source:
  edition: WLC
  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: hi
  text: और उसने रूबेन के पुत्र एलीआब के पुत्र दातान और अबीराम के साथ जो किया—कैसे धरती ने अपना मुँह खोलकर उन्हें, उनके घरानों[a], उनके तंबुओं और उनके पैरों के पास जो कुछ था, उस सब[b] को सारे इस्राएल के बीच निगल लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘उनके घर’ है। इब्रानी शब्द भौतिक घरों या अधिक व्यापक अर्थ में उनके घरानों—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उनके पैरों के पास का सारा यकूम।’ इसका आशय संभवतः उन सभी लोगों, जीवों और वस्तुओं से है जो उनके साथ थे या उनके अधिकार में थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: जो किया
  rationale: सामान्य क्रिया का सीधा और स्वाभाविक अर्थ; पूर्ववर्ती वाक्य से जुड़े स्मरणात्मक खंड का रूप बनाए रखता है।
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: रूबेन के पुत्र एलीआब के पुत्रों
  rationale: इब्रानी की वंशावली-संबंधी संरचना को किसी जातीय विशेषण में बदले बिना सुरक्षित रखता है।
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: धरती ने अपना मुँह खोलकर
  rationale: मूल का सजीव मानवीकरण और 'मुँह खोलने' का रूपक बनाए रखता है।
- source_word: וַתִּבְלָעֵם
  choice: निगल लिया
  rationale: בלע का ठोस और प्रचलित अर्थ है तथा मूल चित्र को ठीक से व्यक्त करता है।
- source_word: בָּתֵּיהֶם
  choice: उनके घरानों
  rationale: शाब्दिक अर्थ 'उनके घर' है, पर अलग से तंबुओं का उल्लेख होने के कारण यहाँ परिवार अथवा घराने का अर्थ संभावित है; पादटिप्पणी वास्तविक अस्पष्टता बताती है।
- source_word: אָהֳלֵיהֶם
  choice: उनके तंबुओं
  rationale: मरुभूमि के प्रसंग में मूल का सीधा और स्पष्ट अनुवाद।
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: उनके पैरों के पास जो कुछ था, उस सब
  rationale: असामान्य संज्ञा יְקוּם और स्थानसूचक मुहावरे को अत्यधिक संकीर्ण अर्थ दिए बिना स्वाभाविक हिन्दी में रखता है; इसमें उनके साथ रहनेवाले लोग, जीव या संपत्ति सम्मिलित हो सकते हैं।
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: सारे इस्राएल के बीच
  rationale: घटना के समस्त इस्राएल के मध्य घटने के स्थानिक और सार्वजनिक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: כָּל־הַיְקוּם के दायरे की अनिश्चितता
  choice: जो कुछ था, उस सब
  alternative: हर जीवित प्राणी / सारी संपत्ति
  rationale: मूल शब्द का आशय केवल जीवित प्राणियों या केवल संपत्ति तक निश्चित रूप से सीमित नहीं है; व्यापक अनुवाद मूल की अर्थगत अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। ‘धरती ने अपना मुँह खोला’ मूल की काव्यात्मक सजीवता बनाए रखता है। वंशावली की पुनरुक्त संरचना जानबूझकर सुरक्षित रखी गई है, और दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबद्ध पदों के तुरंत बाद दिए गए हैं।
