base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: hi
  text: देखो, आज मैं तुम्हारे सामने आशीष और शाप रख रहा हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इसका अनुवाद “आज मैं तुम्हारे सामने आशीष और शाप दे रहा हूँ” भी हो सकता है। यहाँ इब्रानी क्रिया का अर्थ “देना” या “रखना” दोनों हो सकता है; “सामने रखना” हिंदी में अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: देखो
  rationale: यह एकवचन आज्ञार्थक रूप है, जो इस्राएल को सामूहिक रूप से संबोधित करके उसका ध्यान खींचता है। हिंदी में “देखो” स्वाभाविक, वर्तमान और गरिमापूर्ण है; “निहारो” अनावश्यक रूप से साहित्यिक होता।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम वक्ता पर हल्का बल देता है। स्पष्ट “मैं” इसे पर्याप्त रूप से व्यक्त करता है; “मैं स्वयं” बल को जरूरत से अधिक बढ़ा देता।
- source_word: נֹתֵן
  choice: रख रहा हूँ
  rationale: נתן का मूल अर्थ “देना/रखना” हो सकता है। לִפְנֵיכֶם के साथ यह विकल्पों को श्रोताओं के सामने प्रस्तुत करने का भाव देता है, इसलिए “सामने ... रख रहा हूँ” स्वाभाविक हिंदी है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे सामने
  rationale: यह बहुवचन संबोधन है और किसी बात को श्रोताओं के समक्ष प्रस्तुत करने का सामान्य मुहावरा है।
- source_word: הַיּוֹם
  choice: आज
  rationale: आधुनिक हिंदी में कालवाचक अर्थ का सीधा और स्वाभाविक रूप।
- source_word: בְּרָכָה
  choice: आशीष
  rationale: वाचा के संदर्भ में मिलने वाली भलाई और अनुग्रह को संक्षिप्त, परिचित बाइबलीय हिंदी में व्यक्त करता है।
- source_word: וּקְלָלָה
  choice: और शाप
  rationale: בְּרָכָה के प्रतिलोम विकल्प को स्पष्ट और समानांतर ढंग से व्यक्त करता है।
theological_decisions:
- issue: आशीष और शाप का स्वरूप
  choice: इन्हें इस्राएल के सामने रखे गए वाचा-संबंधी दो विकल्पों के रूप में बिना अतिरिक्त व्याख्या के प्रस्तुत किया गया है।
  alternative: इसे अच्छे-बुरे कर्मों के प्रतिफल का सार्वभौमिक नैतिक सिद्धांत बनाकर स्पष्ट करना।
  rationale: पद व्यवस्थाविवरण के वाचा-संदर्भ में आशीष और शाप की प्रस्तावना करता है; अनुवाद को यही तनाव और औपचारिक प्रस्तुति बनाए रखनी चाहिए, बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पाठ के लिए सहज। “देखो” सामूहिक इस्राएल को संबोधित एकवचन आज्ञा का स्वाभाविक हिंदी रूप है, जबकि “तुम्हारे” मूल के बहुवचन प्रत्यय को बनाए रखता है।
