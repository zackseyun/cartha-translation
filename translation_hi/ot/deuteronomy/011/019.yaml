  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: hi
  text: तुम उन्हें अपने बच्चों[a] को सिखाओ और उनके बारे में बात करो—जब तुम अपने घर में बैठो, जब मार्ग पर चलो, जब लेटो और जब उठो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने बेटों को।’ इब्रानी में पुल्लिंग बहुवचन शब्द है, जो प्रतिनिधिक रूप से किसी की सभी संतानों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: तुम ... सिखाना
  rationale: למד का पिएल रूप ‘सिखाना’ अर्थ देता है। हिंदी में विधिपरक अनंत रूप आसपास के वाचा-संबंधी निर्देश के अनुरूप स्वाभाविक है; आरंभिक וְ को अलग ‘और’ से व्यक्त करना आवश्यक नहीं।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन कर्म-सर्वनाम पिछले प्रसंग के वचनों/आदेशों की ओर संकेत करता है; हिंदी में सर्वनाम रखकर उसी संदर्भगत संबंध को बनाए रखा गया है।
- source_word: אֶת־בְּנֵיכֶם
  choice: अपने बच्चों[a] को
  rationale: בנים का अर्थ संकीर्ण रूप से ‘बेटे’ और प्रतिनिधिक रूप से ‘बच्चे/संतान’ हो सकता है। इस वाचा-शिक्षा के संदर्भ में ‘बच्चों’ स्वाभाविक रूप से व्यापक आशय व्यक्त करता है।
- source_word: לְדַבֵּר בָּם
  choice: उनके विषय में बातें करना
  rationale: לְ के साथ पिएल infinitive construct शिक्षा देने के साथ होने वाली वाणी और उसकी विषयवस्तु बताता है। ‘उनके विषय में बातें करना’ सामान्य आधुनिक हिंदी में स्पष्ट है और बहुवचन संदर्भ बनाए रखता है।
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: जब तुम अपने घर में बैठे हो
  rationale: בְ + infinitive construct कालगत परिस्थिति, ‘जब तुम बैठो/बैठे हो,’ व्यक्त करता है; ‘अपने घर में’ स्थान को सीधे प्रस्तुत करता है।
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: जब मार्ग पर चल रहे हो
  rationale: הלך का सामान्य अर्थ ‘चलना/जाना’ है। ‘मार्ग पर चलना’ मूल बिंब को रखते हुए गरिमापूर्ण और समझने योग्य हिंदी है।
- source_word: וּבְשָׁכְבְּךָ
  choice: जब लेटो
  rationale: שכב का infinitive construct कालगत प्रसंग देता है। ‘जब लेटो’ शाब्दिक तथा स्वाभाविक है और अनावश्यक रूप से केवल सोने की क्रिया तक अर्थ सीमित नहीं करता।
- source_word: וּבְקוּמֶךָ
  choice: जब उठो
  rationale: קום यहाँ लेटने के विपरीत उठने को व्यक्त करता है। ‘जब उठो’ हिंदी में संक्षिप्त और स्वाभाविक है तथा युग्म की लय बनाए रखता है।
theological_decisions:
- issue: בְּנֵיכֶם में लिंग-सूचक भाषा
  choice: अपने बच्चों
  alternative: अपने बेटों
  rationale: पुल्लिंग बहुवचन यहाँ संतान के लिए प्रतिनिधिक रूप में प्रयुक्त हो सकता है। ‘बच्चों’ बेटियों को बाहर माने बिना आशय को व्यक्त करता है, जबकि ‘बेटों’ वास्तविक शाब्दिक विकल्प के रूप में पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण निर्देशात्मक स्वर अपनाया गया है। एकवचन ‘तुम’ मूल के दूसरे पुरुष एकवचन रूपों को दर्शाता है, जबकि ‘अपने बच्चों’ में बहुवचन संतति का आशय बना रहता है।
