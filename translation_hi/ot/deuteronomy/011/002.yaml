source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: hi
  text: और आज यह जान लो कि मैं तुम्हारे बच्चों से बात नहीं कर रहा हूँ, जिन्होंने यहोवा, तुम्हारे परमेश्वर, के अनुशासन को, उसकी महानता को, उसके शक्तिशाली हाथ[a] को और उसकी फैलाई हुई भुजा को न जाना है और न देखा है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके मज़बूत हाथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם הַיּוֹם
  choice: और आज यह जान लो
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ प्रसंग में ध्यान खींचने वाले आग्रह का कार्य करती है; ‘जान लो’ आधुनिक हिन्दी में सीधा संबोधन और उपदेशात्मक बल बनाए रखता है।
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: कि मैं तुम्हारे उन बच्चों से बात नहीं कर रहा हूँ
  rationale: इब्रानी वाक्यांश अंडाकार है और शासक क्रिया छोड़ देता है। व्यवस्थाविवरण 11:2 के भाषण-संदर्भ के अनुसार पूर्ति यह स्पष्ट करती है कि मूसा प्रत्यक्षदर्शी श्रोताओं की तुलना उनकी संतान से कर रहा है।
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: जिन्होंने न तो ... देखा है
  rationale: ‘जानना’ और ‘देखना’ यहाँ अनुभव से परिचित होने के समानांतर भाव हैं। हिन्दी में दोनों को अलग दोहराने से असहजता और अर्थगत पुनरुक्ति होती; ‘देखा है’ को आगे की संयुक्त कर्म-सूची के साथ रखना स्वाभाविक है, जबकि बच्चों के अनुभवहीन होने का भाव प्रसंग से स्पष्ट रहता है।
- source_word: מוּסַר
  choice: अनुशासन
  rationale: यह शब्द शिक्षा, सुधार और ताड़ना के संयुक्त भाव को व्यक्त कर सकता है। ‘अनुशासन’ इसे केवल दंड तक सीमित किए बिना सुधारात्मक और शिक्षाप्रद पक्ष बनाए रखता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और वाचागत संबोधन को सीधे ‘तुम्हारे परमेश्वर’ के रूप में रखा गया है।
- source_word: גָּדְלוֹ
  choice: उसकी महानता
  rationale: यह यहोवा की महानता को सूचित करता है, विशेषतः उसके प्रकट किए हुए सामर्थी कार्यों में।
- source_word: יָדוֹ הַחֲזָקָה
  choice: उसका सामर्थी हाथ
  rationale: חזק का भाव शक्तिशाली अथवा सामर्थी है। ‘सामर्थी हाथ’ दिव्य शक्ति की इस प्रचलित इब्रानी उपमा को स्वाभाविक हिन्दी में रखता है।
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: उसकी बढ़ाई हुई भुजा
  rationale: यह सक्रिय दिव्य सामर्थ्य की इब्रानी अभिव्यक्ति है; ‘बढ़ाई हुई भुजा’ उसके दृश्य रूपक को सुरक्षित रखती है।
theological_decisions:
- issue: ‘तुम्हारे बच्चों’ के साथ अंडाकार वाक्य-विन्यास
  choice: अंतर्निहित भाषण-क्रिया को ‘मैं ... से बात नहीं कर रहा हूँ’ के रूप में स्पष्ट किया
  alternative: ‘क्योंकि तुम्हारे बच्चे नहीं, जिन्होंने...’
  rationale: मूल इब्रानी में ‘तुम्हारे बच्चे नहीं’ के बाद शासक क्रिया व्यक्त नहीं है। संदर्भ में मूसा उन लोगों को संबोधित कर रहा है जिन्होंने यहोवा के कार्य देखे थे; चुनी हुई पूर्ति इस विरोध को पठनीय बनाती है, पर उसे किसी सिद्धान्त से नहीं भरती।
- issue: יְהוָה का प्रतिपादन
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ स्रोत का यह भेद बनाए रखता है।
- issue: מוּסַר का अर्थ-क्षेत्र
  choice: अनुशासन
  alternative: शिक्षा; ताड़ना
  rationale: इस संदर्भ में परमेश्वर के सुधारात्मक और शिक्षाप्रद व्यवहार दोनों निहित हो सकते हैं। ‘अनुशासन’ किसी एक पक्ष को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण शैली। पद अगले वाक्य में जारी रहने के कारण अंत में दीर्घ डैश रखा गया है। स्रोत की अंडाकार रचना को अर्थ-स्पष्टता के लिए सीमित रूप से पूरा किया गया है।
