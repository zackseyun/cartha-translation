  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: hi
  text: क्योंकि तुम्हारी अपनी आँखों ने याहवे के समूचे महान कार्य को देखा है, जो उसने किया है।[a]
