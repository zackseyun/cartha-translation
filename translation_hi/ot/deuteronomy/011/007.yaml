lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; इसलिए हिन्दी में ‘क्योंकि’ इसका स्वाभाविक कारणसूचक अनुवाद है।
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: तुम्हारी अपनी आँखों ने … देखा है
  rationale: इब्रानी की चिह्नित सहभागी रचना प्रत्यक्षदर्शी होने पर बल देती है। सहज हिन्दी में पूर्ण क्रिया के साथ ‘अपनी आँखों’ इस बल को व्यक्त करता है।
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: उस सारे … कार्य को
  rationale: एकवचन ‘कार्य’ यहाँ याहवे के किए हुए समस्त महान काम का सामूहिक बोध कराता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का शीर्षक से प्रतिस्थापन न करके हिन्दी लिप्यंतरण किया गया है।
- source_word: הַגָּדֹל
  choice: महान
  rationale: यह ‘कार्य’ की विशालता और महत्त्व बताने वाला सीधा विशेषण है; ‘सामर्थी’ अनावश्यक व्याख्या जोड़ता।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किया था
  rationale: संबंधवाचक उपवाक्य और पूर्ण क्रिया को स्वाभाविक हिन्दी में रखा गया है; ‘था’ कार्य के पूर्व में संपन्न होने को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का अधिक सीधा देवनागरी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी आँखों ने’ मूल के प्रत्यक्षदर्शी बल को स्वाभाविक हिन्दी में सामने लाता है।
