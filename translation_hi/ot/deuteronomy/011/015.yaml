  text: וְ/נָתַתִּ֛י עֵ֥שֶׂב בְּ/שָׂדְ/ךָ֖ לִ/בְהֶמְתֶּ֑/ךָ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: hi
  text: और मैं तुम्हारे खेत में तुम्हारे पशुओं के लिए घास[a] दूँगा, और तुम खाओगे और तृप्त हो जाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वनस्पति’ अथवा ‘चारा’; इब्रानी शब्द सामान्य रूप से उगने वाली वनस्पति को दर्शा सकता है, पर यहाँ संभवतः पशुओं के चारे का अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पेट भर जाएगा’; इब्रानी क्रिया खाने के बाद भर जाने या संतुष्ट होने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं दूँगा
  rationale: संयोजक वाव को क्रमसूचक ‘और’ से रखा गया है। प्रतिज्ञा के प्रसंग में पूर्ण रूप का भावी अर्थ है, इसलिए ‘दूँगा’ उपयुक्त है।
- source_word: עֵשֶׂב
  choice: घास
  rationale: इस संज्ञा का अर्थ व्यापक रूप से वनस्पति हो सकता है, पर पशुओं के लिए दिए जाने के कारण यहाँ ‘घास’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּשָׂדְךָ
  choice: तेरे खेत में
  rationale: שָׂדֶה का ठोस कृषि-संदर्भ वाला सामान्य अर्थ ‘खेत’ है; एकवचन और द्वितीय पुरुष एकवचन दोनों सुरक्षित रखे गए हैं।
- source_word: לִבְהֶמְתֶּךָ
  choice: तेरे पशुओं के लिए
  rationale: בְּהֵמָה यहाँ पालतू पशुधन के लिए सामूहिक अर्थ में है। आधुनिक हिन्दी में ‘पशुओं’ सहज है और इसे केवल गाय-बैलों तक सीमित नहीं करता।
- source_word: וְאָכַלְתָּ
  choice: और तू खाएगा
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन को ‘तू’ से स्पष्ट रखा गया है। प्रतिज्ञा-क्रम के कारण भविष्यकाल स्वाभाविक है।
- source_word: וְשָׂבָעְתָּ
  choice: और तृप्त होगा
  rationale: यह क्रिया खाने के बाद भर जाने और संतोष पाने का भाव रखती है। ‘तृप्त’ दोनों पहलुओं को संक्षेप और गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: इस्राएल को प्रतिनिधिक एकवचन में संबोधन
  choice: ‘तेरे… तू’ के द्वारा द्वितीय पुरुष एकवचन बनाए रखा गया
  alternative: ‘तुम्हारे… तुम’ अथवा बहुवचन संबोधन
  rationale: इब्रानी पाठ में सभी संबोधन पुल्लिंग एकवचन हैं। स्पष्ट हिन्दी एकवचन स्रोत की वाचा-संबंधी अलंकारिक शक्ति को सुरक्षित रखता है।
- issue: प्रतिज्ञात आशीष का स्वरूप
  choice: साधारण कृषि-संबंधी दैवी प्रबंध के रूप में अनुवाद
  alternative: इसे स्पष्ट रूप से व्यापक समृद्धि या असाधारण बहुतायत की प्रतिज्ञा बनाना
  rationale: पाठ पशुओं के लिए घास और मनुष्य के खाकर तृप्त होने की बात करता है; इससे आगे कोई समृद्धि-सिद्धांत जोड़ना मूल पाठ का विस्तार होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तेरे/तू’ आज की हिन्दी में घनिष्ठ संबोधन है, पर यहाँ इसे इब्रानी के स्पष्ट प्रतिनिधिक एकवचन को बचाने के लिए चुना गया है। अर्धविराम यह स्पष्ट करता है कि मनुष्य का खाना पिछले व्यापक खाद्य-प्रबंध से जुड़ा है, केवल पशुओं की घास से नहीं।
