id: DEU.11.4
reference: Deuteronomy 11:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: hi
  text: और मिस्र की सेना, उसके घोड़ों और रथों के साथ उसने क्या किया—जब वे तुम्हारा पीछा कर रहे थे, तब उसने लाल सागर[a] का जल उनके ऊपर बहा दिया, और याहवे ने उन्हें आज तक नष्ट कर रखा है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “सरकंडों का सागर।” परंपरागत अनुवाद: “लाल सागर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל
  choice: सेना
  rationale: घोड़ों और रथों के उल्लेख वाला सैन्य संदर्भ यहाँ חֵיל का अर्थ ‘सेना’ स्पष्ट करता है।
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: उसके घोड़ों और उसके रथों के साथ
  rationale: एकवचन प्रत्यय सामूहिक रूप से मिस्र की ओर संकेत करते हैं; हिन्दी में ‘रथ’ स्वाभाविक और स्पष्ट है। ‘के साथ’ पिछले पद के साथ संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: הֵצִיף
  choice: पानी उन पर चढ़ा दिया
  rationale: 'हिफ़ील रूप का कारणवाचक भाव सुरक्षित है: परमेश्वर ने पानी को उन पर चढ़ा दिया।'
- source_word: מֵי יַם סוּף
  choice: लाल सागर का पानी
  rationale: ‘लाल सागर’ हिन्दी में प्रचलित भौगोलिक नाम है; इब्रानी शब्द का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַל־פְּנֵיהֶם
  choice: उन पर
  rationale: इस मुहावरे का प्रसंगानुकूल अर्थ पानी का उनके ऊपर आ जाना है।
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: जब वे तुम्हारा पीछा कर रहे थे
  rationale: ב के साथ infinitive construct समकालीन क्रिया बताता है; यह हिन्दी में स्वाभाविक कालगत अभिव्यक्ति है।
- source_word: וַיְאַבְּדֵם
  choice: उनका ऐसा विनाश किया
  rationale: कारणवाचक रूप उन्हें नाश कर देने का अर्थ देता है; अगले कालगत पद से जोड़ने के लिए ‘ऐसा’ प्रयोग किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: कि वे आज तक फिर दिखाई नहीं दिए
  rationale: शाब्दिक ‘आज के दिन तक’ यहाँ विनाश के स्थायी परिणाम को बताता है; हिन्दी में यह विस्तार उसी आशय को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नामत्व को सुरक्षित रखता है।
- issue: יַם סוּף का अनुवाद
  choice: लाल सागर
  alternative: सरकंडों का सागर
  rationale: मुख्य पाठ में प्रचलित भौगोलिक नाम रखा गया है, जबकि इब्रानी סוּף से जुड़ा शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: עַד הַיּוֹם הַזֶּה का विनाश से संबंध
  choice: विनाश का परिणाम आज तक बना रहा
  alternative: यहोवा ने उन्हें आज के दिन तक नष्ट किया
  rationale: इब्रानी वाक्य का कालगत पद स्थायी परिणाम व्यक्त करता है, न कि लगातार चलती हुई विनाश-क्रिया; हिन्दी में संभावित भ्रम से बचते हुए यही आशय दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। पद पिछले वाक्य की संरचना को आगे बढ़ाता है, इसलिए आरम्भ और अंत में संयोजकता दर्शाने हेतु डैश रखा गया है। सर्वनाम बहुवचन ‘तुम्हारा’ सामूहिक इस्राएल को संबोधित करता है।
