revisions:
- from: और उसने मिस्र की सेना, उसके घोड़ों और उसके रथों के साथ क्या किया—जब वे तुम्हारा पीछा कर रहे थे, तब उसने लाल सागर[a] का पानी उन पर चढ़ा दिया, और यहोवा ने उनका ऐसा विनाश किया कि वे आज तक फिर दिखाई नहीं दिए—
  to: और मिस्र की सेना, उसके घोड़ों और रथों के साथ उसने क्या किया—जब वे तुम्हारा पीछा कर रहे थे, तब उसने लाल सागर[a] का जल उनके ऊपर बहा दिया, और याहवे ने उन्हें आज तक नष्ट कर रखा है—
  rationale: The revision removes the unsupported expansion about the Egyptians not being seen again and renders the enduring force of “to this day” as the continuing result of destruction. It also uses “याहवे” for יהוה in accordance with the POB audit trail and improves the causative inundation wording. The footnote anchor and lexical alternative are retained.
