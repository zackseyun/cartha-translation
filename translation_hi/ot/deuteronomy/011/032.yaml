  yaml_path: translation/ot/deuteronomy/011/032.yaml
  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: hi
  text: तुम सावधानी से उन सभी विधियों और न्याय-विधानों का पालन करना, जिन्हें मैं आज तुम्हारे सामने रख रहा हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, ‘जिन्हें मैं आज तुम्हारे सामने दे रहा हूँ’; हिब्रू मुहावरे का अर्थ ‘तुम्हारे सामने रखना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: सावधानी से मानना
  rationale: שׁמר के साथ לַעֲשׂוֹת का संयुक्त भाव केवल सुरक्षित रखने का नहीं, बल्कि ध्यानपूर्वक पालन करने का है। हिंदी में ‘सावधानी से मानना’ इस निर्देशात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: यह संपूर्णता पर बल देता है और दोनों बहुवचन कानूनी पदों के साथ स्वाभाविक है।
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: חֻקִּים निर्धारित विधान या अधिनियम हैं; ‘विधियाँ’ आधुनिक हिंदी में कानूनी-वाचा संबंधी गरिमा बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधानों
  rationale: מִשְׁפָּטִים न्यायिक निर्णयों, नियमों या विधानों को सूचित कर सकता है। ‘न्याय-विधान’ इसे חֻקִּים से अलग रखते हुए कानूनी भाव स्पष्ट करता है।
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִפְנֵיכֶם
  choice: जिन्हें मैं ... तुम्हारे सामने रख रहा हूँ
  rationale: נתן का शाब्दिक अर्थ ‘देना’ है, पर לִפְנֵי के साथ यह किसी बात को विचार और पालन के लिए सामने रखने का मुहावरा है। वर्तमान प्रगतिशील रूप हिब्रू कृदंत का चल रहा वर्तमान भाव बनाए रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह वाचा-संबंधी संबोधन की तात्कालिकता को स्पष्ट, आधुनिक हिंदी में व्यक्त करता है।
