source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: hi
  text: ताकि उस देश में तुम्हारे और तुम्हारे बेटों[a] के दिन बढ़ें, जिसे याहवे ने तुम्हारे पूर्वजों को देने की शपथ ली थी—जितने दिन आकाश पृथ्वी के ऊपर रहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी संतान।” इब्रानी में शाब्दिक रूप से “तुम्हारे बेटे” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आकाश के पृथ्वी के ऊपर रहने के दिनों के समान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: जिससे
  rationale: यह पिछले आदेशों के उद्देश्य अथवा परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִרְבּוּ יְמֵיכֶם
  choice: तुम्हारे ... दिन बहुत हों
  rationale: इब्रानी मुहावरे में दिनों के बढ़ने, अर्थात दीर्घ अवधि तक बने रहने, का भाव है; हिन्दी में यह रूप मूल बिंब को बनाए रखता है।
- source_word: וִימֵי בְנֵיכֶם
  choice: और तुम्हारे बेटों के दिन
  rationale: בנים का प्रत्यक्ष अर्थ ‘बेटे’ है। सम्भावित व्यापक अर्थ ‘सन्तान’ को पादटिप्पणी में रखा गया है।
- source_word: עַל הָאֲדָמָה
  choice: इस देश में
  rationale: व्यवस्थाविवरण के सन्दर्भ में אֲדָמָה प्रतिज्ञात देश की ओर संकेत करता है; हिन्दी में स्थान के लिए ‘में’ अधिक स्वाभाविक है।
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם לָתֵת לָהֶם
  choice: जिसे याहवे ने तुम्हारे पूर्वजों को देने की शपथ खाई थी
  rationale: यह सम्बन्धवाचक उपवाक्य, वाचा-संबंधी शपथ और प्राप्तकर्ताओं को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: जब तक आकाश पृथ्वी के ऊपर बना रहे
  rationale: यह वाक्यांश दीर्घ स्थायित्व का मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है और अधिक शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिवाचक नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: בְנֵיכֶם का लिंग और दायरा
  choice: तुम्हारे बेटे
  alternative: तुम्हारी सन्तान
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में ‘बेटे’ रखा गया है; व्यापक प्रतिनिधिक अर्थ की सम्भावना पादटिप्पणी में दी गई है।
- issue: अन्तिम उपमा का अर्थ
  choice: जब तक आकाश पृथ्वी के ऊपर बना रहे
  alternative: आकाश के पृथ्वी के ऊपर रहने के दिनों के समान
  rationale: इब्रानी अभिव्यक्ति अवधि और स्थायित्व का बोध कराती है। मुख्य पाठ में अर्थपूर्ण हिन्दी मुहावरा रखा गया है, जबकि शाब्दिक उपमा पादटिप्पणी में है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मुख्य वाक्य की जटिलता घटाने के लिए देश से सम्बन्धित उपवाक्य को डैशों के बीच रखा गया है। ‘दिन बहुत हों’ मूल इब्रानी बिंब को बनाए रखता है, जबकि अन्तिम अवधि-सूचक वाक्यांश को हिन्दी में स्वाभाविक बनाया गया है।
