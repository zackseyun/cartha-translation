  text: וְ/הָיָ֗ה אִם שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל מִצְוֺתַ֔/י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ וּ/לְ/עָבְד֔/וֹ בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: hi
  text: और यदि तुम मेरी उन आज्ञाओं को सचमुच सुनोगे जिन्हें मैं आज तुम्हें दे रहा हूँ[a]—कि तुम अपने परमेश्वर यहोवा[b] से प्रेम करो और अपने पूरे मन और अपने पूरे प्राण[c] से उसकी सेवा करो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में बल देने वाली अभिव्यक्ति है, जिसका शाब्दिक भाव ‘यदि तुम सचमुच सुनोगे’ है; सन्दर्भ में इसका अर्थ ‘यदि तुम ध्यान से आज्ञा मानोगे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम; यहाँ ‘यहोवा’। इसे ‘याहवे’ भी लिखा जाता है और परम्परागत रूप से ‘प्रभु’ अनूदित किया गया है।
    reason: lexical_alternative
  - marker: c
    text: ‘प्राण’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘जीवन’ या ‘सम्पूर्ण अस्तित्व’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: और यदि
  rationale: वाक्यांश अगले पद तक जाने वाली शर्त का आरम्भ करता है। ‘और यदि’ हिब्रू की प्रवचनात्मक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: सचमुच ... सुनोगे
  rationale: धातु के infinitive absolute और imperfect का मेल क्रिया पर बल देता है। ‘सचमुच सुनोगे’ श्रवण और आज्ञापालन दोनों की सम्भावित छाया को पूरी तरह एक अर्थ में सीमित नहीं करता।
- source_word: אֶל מִצְוֺתַי
  choice: मेरी ... आज्ञाओं को
  rationale: ‘आज्ञाएँ’ वाचा के सन्दर्भ में दिए गए आदेशों का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है। हिन्दी में ‘सुनना’ के साथ ‘को’ स्वाभाविक है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें दे रहा हूँ
  rationale: वर्तमान प्रगतिशील रूप मूसा के जारी भाषण को दर्शाता है; हिन्दी में आज्ञा ‘देना’ कहना ‘आज्ञा देना’ की पुनरुक्ति से बचते हुए अर्थ बनाए रखता है।
- source_word: לְאַהֲבָה
  choice: प्रेम करने
  rationale: उद्देश्य अथवा अपेक्षित प्रत्युत्तर बताने वाले infinitive का सीधा और स्वाभाविक अनुवाद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यन्तरण के द्वारा चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: सम्बन्धवाचक बहुवचन प्रत्यय का स्वाभाविक हिन्दी रूप; कर्ता वही होने के कारण ‘अपने’ उपयुक्त है।
- source_word: וּלְעָבְדוֹ
  choice: और ... उसकी सेवा करने
  rationale: עבד समर्पित आज्ञाकारिता और उपासना दोनों को समेट सकता है; ‘सेवा करना’ इसे केवल उपासना तक सीमित नहीं करता।
- source_word: בְּכָל לְבַבְכֶם
  choice: अपने पूरे मन से
  rationale: लेवाव विचार, इच्छा और भाव सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘पूरे मन से’ अधिक स्वाभाविक है और इसे केवल भावनात्मक हृदय तक सीमित नहीं करता।
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: और अपने पूरे प्राण से
  rationale: נפש का अर्थ प्राण, जीवन या सम्पूर्ण अस्तित्व हो सकता है। ‘प्राण’ पारम्परिक प्रतिध्वनि बनाए रखते हुए व्यापक अर्थ के लिए टिप्पणी की आवश्यकता स्वीकार करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। मुख्य पाठ में हिन्दी पाठकों के बीच पहचाने जाने वाले ‘यहोवा’ को रखकर उसे केवल उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: שָׁמֹעַ תִּשְׁמְעוּ का अर्थबल
  choice: सचमुच ... सुनोगे
  alternative: ध्यान से आज्ञा मानोगे
  rationale: हिब्रू मुहावरे में सुनने के साथ आज्ञाकारी प्रत्युत्तर निहित हो सकता है। मुख्य पाठ श्रवण-रूपक और बल दोनों रखता है; आज्ञापालन का अर्थ टिप्पणी में दिया गया है।
- issue: נפש की अर्थ-सीमा
  choice: प्राण
  alternative: जीवन; सम्पूर्ण अस्तित्व
  rationale: वाचा-सूत्र की पारम्परिक गूँज को रखा गया है, पर शब्द को शरीर से अलग किसी अमूर्त आत्मा के संकीर्ण अर्थ में तय नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और सार्वजनिक पाठ के योग्य। पद मूल में अधूरी शर्त है जो अगले पद में पूरी होती है; अन्त के डैश इस निरन्तरता को दिखाते हैं। सभी सर्वनाम बहुवचन समुदाय को सम्बोधित करते हैं।
