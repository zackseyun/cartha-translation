base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: hi
  text: कोई भी तुम्हारे सामने टिक नहीं सकेगा।[a] तुम्हारा परमेश्वर याहवे उस सारे देश में, जिस पर तुम पाँव रखोगे, तुम्हारे प्रति भय और आतंक फैला देगा,[b] जैसा उसने तुमसे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोई मनुष्य तुम्हारे सामने खड़ा नहीं होगा।” यहाँ “सामने खड़ा होना” सफलतापूर्वक सामना करने या विरोध करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उस सारे देश के मुख पर।” हिब्रू शब्द का अर्थ “धरती” भी हो सकता है, पर तत्काल संदर्भ उस देश का है जिस पर इस्राएली पाँव रखेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: कोई भी तुम्हारे सामने टिक नहीं सकेगा
  rationale: हिब्रू मुहावरे का शाब्दिक बिंब ‘सामने खड़ा होना’ है, पर संदर्भ में इसका अर्थ सफलतापूर्वक सामना या विरोध कर पाना है। ‘टिक नहीं सकेगा’ इस आशय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: तुम्हारा भय और आतंक
  rationale: दोनों निकटार्थी संज्ञाओं का युग्म तीव्रता बढ़ाता है। ‘भय’ और ‘आतंक’ उनके भेद को कुछ हद तक बनाए रखते हैं; यहाँ भाव वह डर है जो इस्राएल के कारण दूसरों में उत्पन्न होगा।
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: '... में फैला देगा'
  rationale: शाब्दिक रचना ‘... के मुख पर रख देगा’ हिन्दी में अस्वाभाविक है। ‘फैला देगा’ पूरे भूभाग पर भय छा जाने का स्थानिक भाव स्पष्ट और सहज रूप से देता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: वाचा-संबंधी व्यक्तिगत नाम को ‘यहोवा’ के रूप में रखा गया है और אֱלֹהֵיכֶם का बहुवचन संबोधन ‘तुम्हारा परमेश्वर’ से व्यक्त किया गया है।
- source_word: כָל־הָאָרֶץ
  choice: उस सारे देश
  rationale: הָאָרֶץ का अर्थ ‘धरती’ या ‘देश’ हो सकता है। अगला उपवाक्य उस क्षेत्र को सीमित करता है जिस पर इस्राएली पाँव रखेंगे, इसलिए यहाँ ‘देश’ संदर्भानुकूल है।
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: जिस पर तुम पाँव रखोगे
  rationale: דרך के ठोस ‘पाँव रखना/रौंदना’ बिंब को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: ठीक जैसा उसने तुमसे कहा था
  rationale: דבר का मूल अर्थ ‘कहना/बोलना’ है। ‘वादा किया’ कहना प्रसंगगत बल को स्पष्ट करता, पर स्रोत की अपेक्षा अधिक विशिष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी बाइबल-परंपरा में पहचाने जाने योग्य व्यक्तिगत नाम ‘यहोवा’ रखा गया है, न कि उसे केवल उपाधि ‘प्रभु’ से बदला गया।
- issue: प्रतिनिधिक एकवचन אִישׁ
  choice: कोई भी
  alternative: कोई पुरुष
  rationale: यहाँ אִישׁ किसी एक पुरुष की पहचान नहीं करता, बल्कि सार्वत्रिक निषेध में ‘कोई व्यक्ति’ के अर्थ में है। ‘कोई भी’ हिन्दी में उसके प्रतिनिधिक और व्यापक आशय को स्वाभाविक रूप से देता है।
- issue: ‘सामने खड़ा होने’ के मुहावरे का बल
  choice: टिक नहीं सकेगा
  alternative: सामने खड़ा नहीं होगा
  rationale: संदर्भ युद्ध और विरोध का है; सामर्थ्य का भाव हिब्रू मुहावरे में निहित है। फिर भी पादटिप्पणी में अधिक शाब्दिक बिंब दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। बहुवचन ‘तुम’ पूरे इस्राएल को संबोधित करता है। मुहावरेदार हिन्दी अपनाते हुए मुख्य हिब्रू बिंब पादटिप्पणियों में सुरक्षित रखे गए हैं।
