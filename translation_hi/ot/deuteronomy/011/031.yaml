  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: hi
  text: क्योंकि तुम यरदन पार कर उस देश में प्रवेश करने और उसे अपने अधिकार में लेने जा रहे हो, जिसे याहवे[a], तुम्हारा परमेश्वर, तुम्हें दे रहा है; और तुम उसे अपने अधिकार में लोगे और उसमें बसोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संयोजक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: यरदन पार करके … जा रहे हो
  rationale: कृदन्त निकट भविष्य की निश्चित क्रिया दर्शाता है। हिन्दी में ‘जा रहे हो’ के साथ यह भाव सहज और स्पष्ट है।
- source_word: לָבֹא
  choice: प्रवेश करने
  rationale: यरदन पार करने के बाद देश में भीतर जाने का भाव है; ‘प्रवेश करना’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: לָרֶשֶׁת / וִירִשְׁתֶּם
  choice: अधिकार करने / अधिकार करोगे
  rationale: ירשׁ यहाँ देश को अपने अधिकार में लेने और रखने का अर्थ देता है। दोनों प्रयोगों में एक ही हिन्दी शब्दावली रखी गई है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: संदर्भ में यह इस्राएल को दिए जाने वाले भूभाग को दर्शाता है; हिन्दी बाइबलीय संदर्भ में ‘देश’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम YHWH को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित वाचा-संबंधी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: נֹתֵן לָכֶם
  choice: तुम्हें दे रहा है
  rationale: कृदन्त परमेश्वर के वर्तमान अथवा आसन्न दान को सजीव और निश्चित रूप में प्रस्तुत करता है।
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: उसमें बसोगे
  rationale: ישׁב यहाँ देश में निवास स्थापित करने का भाव रखता है; ‘बसोगे’ केवल रहने की अपेक्षा इस संदर्भ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; पादटिप्पणी मूल अक्षरों और पारंपरिक विकल्प की सूचना देती है।
- issue: देश पर अधिकार और परमेश्वर के दान के बीच संबंध
  choice: ‘अधिकार करने’ और ‘दे रहा है’ दोनों को बनाए रखा
  alternative: केवल विरासत पाने अथवा केवल विजय का भाव
  rationale: मूल पाठ मानवीय अधिकार-ग्रहण और परमेश्वर के दान—दोनों को साथ रखता है; अनुवाद इस तनाव को किसी एक पक्ष में नहीं समेटता।
translation_notes:
  register: आधुनिक मानक हिन्दी, द्वितीय पुरुष बहुवचन ‘तुम’ के साथ। शैली स्पष्ट और गरिमापूर्ण है। ‘प्रवेश करने’, ‘अधिकार करने’ और ‘बसोगे’ मूल की क्रियात्मक क्रमबद्धता को स्वाभाविक हिन्दी में बनाए रखते हैं।
