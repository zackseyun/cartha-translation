  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: hi
  text: और जब याहवे, तुम्हारा परमेश्वर, तुम्हें उस देश में ले आए जिसमें तुम अधिकार करने के लिए प्रवेश कर रहे हो, तब तुम गिरिज्जीम पर्वत पर आशीष और एबाल पर्वत पर शाप रखोगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम गिरिज्जीम पर्वत पर आशीष और एबाल पर्वत पर शाप सुनाओगे।” इब्रानी में शाब्दिक अर्थ “रखना/देना” है; समारोह में की जाने वाली ठीक क्रिया आसपास के प्रसंग में स्पष्ट होती है।
    reason: נתן की व्यापक शब्दार्थ-सीमा और समारोह की संभावित घोषणात्मक क्रिया को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह सूत्र भविष्य में होने वाली परिस्थिति प्रस्तुत करता है। ‘और जब’ उसके कालवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְבִיאֲךָ
  choice: तुम्हें … में ले आए
  rationale: בוא का हिफ़ील रूप किसी को भीतर लाने का कारणवाचक अर्थ देता है; ‘ले आए’ उस भाव को सहज हिन्दी में रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को ‘याहवे’ के रूप में रखा गया है और द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘तुम्हारा’ से व्यक्त किया गया है।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: व्यवस्थाविवरण के प्रसंग में यह प्रतिज्ञात भूभाग को सूचित करता है। हिन्दी में ‘उस देश’ संदर्भित और स्वाभाविक है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: जिसमें तुम अधिकार करने के लिए प्रवेश कर रहे हो
  rationale: निकट भविष्य की प्रवेश-क्रिया और ירשׁ के भूमि पर अधिकार/कब्ज़ा पाने के भाव, दोनों को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: וְנָתַתָּה
  choice: तब तुम … रखना
  rationale: נתן का मूल भाव ‘देना/रखना/स्थापित करना’ है। आज्ञात्मक कानूनी संदर्भ में ‘रखना’ ठोस शब्दावली को बचाता है, जबकि समारोह की ठीक क्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַבְּרָכָה
  choice: आशीष
  rationale: यह निश्चित वाचा-आशीष को सूचित करता है; ‘आशीष’ हिन्दी बाइबलीय भाषा में परिचित और स्पष्ट है।
- source_word: עַל הַר גְּרִזִים
  choice: गिरिज्जीम पर्वत पर
  rationale: עַל के स्थानवाचक अर्थ और भौगोलिक नाम को सीधे व्यक्त किया गया है।
- source_word: הַקְּלָלָה
  choice: शाप
  rationale: यह आशीष के समानांतर निश्चित वाचा-शाप है; ‘शाप’ उसका संक्षिप्त और स्वाभाविक प्रतिशब्द है।
- source_word: עַל הַר עֵיבָל
  choice: एबाल पर्वत पर
  rationale: यह गिरिज्जीम वाले समानांतर स्थानवाचक वाक्यांश को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण ‘याहवे’ नाम को शीर्षक से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: आशीष और शाप से संबंधित वाचा-क्रिया का स्वरूप
  choice: आशीष को … और शाप को … रखना
  alternative: आशीष … और शाप … सुनाना/घोषित करना
  rationale: मूल क्रिया נתן व्यापक रूप से ‘देना/रखना’ कहती है। मुख्य पाठ ठोस लेकिन कुछ हद तक खुला अर्थ सुरक्षित रखता है; आसपास का प्रसंग समारोह की क्रिया को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। पूरे पद में मूल के द्वितीय पुरुष एकवचन को ‘तुम/तुम्हारा’ से बनाए रखा गया है। स्थान-नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
