  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञात्मक शृंखला में हिंदी की स्वाभाविक ‘लिखना’ रचना अपनाई गई है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में रखे गए हैं।
