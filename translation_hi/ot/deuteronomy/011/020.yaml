  yaml_path: translation/ot/deuteronomy/011/020.yaml
  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: hi
  text: और उन्हें अपने घर की चौखटों और अपने फाटकों पर लिखना।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वार-स्तंभों’। इब्रानी शब्द द्वार के दोनों ओर के खड़े स्तंभों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने फाटकों के पास’। इब्रानी शब्द फाटकों के साथ-साथ उनके प्रवेश-क्षेत्र को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: और उन्हें ... लिखना
  rationale: संयोजक वाव के साथ क़ाल पूर्ण रूप इस आज्ञात्मक शृंखला को आगे बढ़ाता है। हिंदी में ‘लिखना’ पूर्ववर्ती निर्देशों से जुड़ी स्वाभाविक आज्ञात्मक शक्ति रखता है; ‘उन्हें’ का संकेत पहले कही गई बातों की ओर है।
- source_word: עַל
  choice: पर
  rationale: यह पूर्वसर्ग किसी सतह या स्थान पर लिखे जाने को सीधे व्यक्त करता है।
- source_word: מְזוּזוֹת
  choice: चौखटों
  rationale: यह संज्ञा प्रवेश-द्वार के खड़े बाजुओं अथवा द्वार-स्तंभों को दर्शाती है। आधुनिक हिंदी में ‘चौखटों’ सहज और स्पष्ट है, जबकि बाद की धार्मिक वस्तु के अर्थ वाला लिप्यंतरण यहाँ उचित नहीं।
- source_word: בֵּיתֶךָ
  choice: अपने घर की
  rationale: בַּיִת का ठोस और सामान्य अर्थ ‘घर’ है; संबंधसूचक रचना हिंदी में स्वाभाविक है।
- source_word: וּבִשְׁעָרֶיךָ
  choice: और अपने फाटकों पर
  rationale: שַׁעַר प्रायः फाटक अथवा उससे जुड़े प्रवेश-स्थान को दर्शाता है। ‘फाटकों’ मूल के बहुवचन और प्रत्यक्ष अर्थ को बनाए रखता है।
