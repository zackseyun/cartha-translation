base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: hi
  text: क्योंकि यदि तुम इस सारी आज्ञा का पूरी सावधानी से पालन करोगे, जिसका पालन करने की आज्ञा मैं तुम्हें दे रहा हूँ—अपने परमेश्वर याहवे से प्रेम करना, उसके सभी मार्गों पर चलना और उससे दृढ़ता से जुड़े रहना[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे लिपटे रहना” या “उसे दृढ़ता से पकड़े रहना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन से संबंध रखते हुए एक बलयुक्त शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों पहलुओं को स्वाभाविक हिन्दी में रखता है।
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: पूरी सावधानी से पालन करोगे
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल पालन की तीव्रता और तत्परता पर बल देता है।
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: इस सारी आज्ञा
  rationale: इब्रानी में ‘आज्ञा’ एकवचन है और सम्भवतः पूरी वाचा-संबंधी आज्ञा को सामूहिक रूप में व्यक्त करती है; हिन्दी में एकवचन बनाए रखा गया है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: जिसे पूरा करने की आज्ञा मैं तुम्हें दे रहा हूँ
  rationale: वर्तमान कृदंत जारी वाणी-क्रिया को दर्शाता है। ‘पूरा करने’ से עשה का व्यावहारिक अर्थ आता है और हिन्दी में कर्म-सर्वनाम की अनावश्यक पुनरावृत्ति नहीं होती।
- source_word: לְאַהֲבָה
  choice: अर्थात ... प्रेम करना
  rationale: यहाँ इनफिनिटिव आज्ञा की विषयवस्तु या उसके निर्वाह का स्वरूप स्पष्ट करता है; ‘अर्थात’ हिन्दी पाठक के लिए इस संबंध को स्पष्ट करता है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहवे
  rationale: व्यक्तिगत दिव्य नाम को ‘यहवे’ रूप में रखा गया है और אֱלֹהֵיכֶם के वाचागत संबंध को ‘अपने परमेश्वर’ से व्यक्त किया गया है।
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: उसके सब मार्गों पर चलना
  rationale: आचरण के लिए प्रयुक्त ‘चलना’ रूपक को उसके वाचागत और धर्मवैचारिक भार सहित सुरक्षित रखा गया है।
- source_word: וּלְדָבְקָה בוֹ
  choice: और उससे लिपटे रहना
  rationale: דבק निकट, दृढ़ और निरंतर जुड़ाव व्यक्त करता है; ‘लिपटे रहना’ जीवंत आधुनिक हिन्दी में संबंधपरक रूपक बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। उसे उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘यहवे’ दिया गया है।
- issue: ‘चलना’ और ‘लिपटे रहना’ के वाचा-संबंधी रूपक
  choice: दोनों रूपकों को मुख्य पाठ में बनाए रखना
  alternative: उसके अनुसार जीवन बिताना; उसके प्रति विश्वासयोग्य बने रहना
  rationale: व्याख्यात्मक रूप में समतल करने के बजाय मूल के आचरणात्मक और संबंधपरक तनाव तथा चित्रात्मकता को सुरक्षित रखा गया है।
- issue: एकवचन ‘आज्ञा’ का सामूहिक आशय
  choice: एकवचन ‘इस सारी आज्ञा’
  alternative: इन सब आज्ञाओं
  rationale: मूल का व्याकरणिक एकवचन कायम रखते हुए उसे समग्र वाचा-निर्देश के रूप में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। पद एक अधूरी शर्तीय संरचना है, इसलिए अंत में दीर्घ डैश रखा गया है। ‘आज्ञा’ का एकवचन और ‘चलना/लिपटे रहना’ के मूल रूपक सुरक्षित हैं।
