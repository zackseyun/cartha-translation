source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: hi
  text: और शाप, यदि तुम अपने परमेश्वर यहवे की आज्ञाओं की न सुनो[a] और उस मार्ग से हट जाओ जिस पर चलने की आज्ञा मैं आज तुम्हें दे रहा हूँ, और दूसरे देवताओं के पीछे चलो, जिन्हें तुमने नहीं जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर यहवे की आज्ञाओं को न मानो।” इब्रानी में “सुनना” वाचा के संदर्भ में प्रायः आज्ञापूर्वक सुनने, अर्थात आज्ञा मानने, का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: और शाप
  rationale: निश्चित संज्ञा पिछले पद के ‘आशीष’ के समानांतर है; हिन्दी में ‘शाप’ वाचा-संबंधी विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם לֹא תִשְׁמְעוּ אֶל מִצְוֺת
  choice: यदि तुम ... की आज्ञाएँ न सुनो
  rationale: शर्त को ‘यदि’ से रखा गया है। ‘सुनो’ मूल क्रिया की श्रवण-छवि बचाता है, जबकि इस वाचा-संदर्भ में आज्ञापालन का आशय भी समाहित है।
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहवे
  rationale: व्यक्तिगत वाचा-नाम יְהוָה को ‘यहवे’ के रूप में लिप्यंतरित किया गया है; हिन्दी संबंध को ‘अपने परमेश्वर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: और उस मार्ग से हट जाओ
  rationale: ‘मार्ग से हटना’ मूल की गति-छवि और वाचा के नियत आचरण से विचलन—दोनों को बनाए रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: जिस पर चलने की आज्ञा मैं आज तुम्हें दे रहा हूँ
  rationale: हिन्दी वाक्य में संबंध को स्पष्ट और स्वाभाविक बनाने के लिए अगले उद्देश्य-वाक्यांश को साथ लिया गया है; वर्तमान कृदंत की तात्कालिकता ‘दे रहा हूँ’ में बनी रहती है।
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: और दूसरे देवताओं के पीछे चलो
  rationale: ‘पीछे चलना’ इब्रानी गति-रूपक को सुरक्षित रखता है। हिन्दी में संयोजक ‘और’ से मुड़ने के परिणामस्वरूप होने वाली क्रिया स्पष्ट होती है।
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: जिन्हें तुमने नहीं जाना
  rationale: पूर्ण क्रिया का सीधा रूप रखा गया है और ‘जानना’ संबंधात्मक अर्थ की संभाव्यता को बिना संकुचित किए सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में आए विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है, उपाधि में नहीं बदला गया। ‘यहवे’ आधुनिक हिन्दी में Yahweh का निकट लिप्यंतरण है।
- issue: שׁמע को स्पष्टतः ‘आज्ञा मानना’ कहना या ‘सुनना’
  choice: आज्ञाएँ सुनो
  alternative: आज्ञाएँ मानो
  rationale: ‘सुनना’ मूल शब्द की अभिव्यक्ति को बनाए रखता है; पादटिप्पणी बताती है कि वाचा-संदर्भ में इसमें आज्ञापालन निहित है। इससे मूल की अर्थ-व्याप्ति अनावश्यक रूप से सीमित नहीं होती।
- issue: אֲשֶׁר לֹא יְדַעְתֶּם में ‘जानना’ का अर्थ
  choice: जिन्हें तुमने नहीं जाना
  alternative: जिनसे तुम परिचित नहीं थे
  rationale: सीधा ‘जानना’ व्यक्तिगत परिचय, मान्यता और अनुभव की संभावित अर्थ-छायाओं को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘आज्ञाएँ’, ‘मार्ग’, ‘शाप’ और ‘देवता’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं; वाक्य-संरचना को हिन्दी में पठनीय बनाने के साथ मूल की शर्त, मार्ग-रूपक और दूसरे देवताओं के पीछे चलने की छवि सुरक्षित रखी गई है।
