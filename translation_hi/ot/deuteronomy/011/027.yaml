  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: hi
  text: आशीष[a], यदि तुम अपने परमेश्वर याहवे की उन आज्ञाओं को मानो[b], जिनकी आज्ञा मैं आज तुम्हें दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह आशीष, जो तुम्हें अपने परमेश्वर याहवे की आज्ञाएँ मानने पर मिलेगी।” इब्रानी में यहाँ सम्बन्धवाचक अव्यय है, जिसका इस प्रसंग में शर्तिया अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सुनो।” इब्रानी क्रिया प्रायः इस तरह सुनने का भाव रखती है कि सुनने वाला उसके अनुसार चले।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: आशीष
  rationale: यह पिछले पद के अधूरे वाक्य-विन्यास को आगे बढ़ाने वाला निश्चित कर्म-पद है। हिन्दी में ‘आशीष’ इसे संक्षिप्त और स्वाभाविक रूप से बनाए रखता है।
- source_word: אֲשֶׁר
  choice: यदि
  rationale: यह मूलतः सम्बन्धवाचक अव्यय है, पर यहाँ आशीष की शर्त बताता है; इसलिए ‘यदि’ प्रसंगगत शर्तिया अर्थ को स्पष्ट करता है।
- source_word: תִּשְׁמְעוּ אֶל
  choice: मानो
  rationale: שׁמע का मूल अर्थ सुनना है, पर אֶל के साथ इस वाचा-सन्दर्भ में ध्यान देकर सुनना और उसके अनुसार चलना निहित है। हिन्दी में आज्ञाओं के साथ ‘मानो’ स्वाभाविक है; मूल का श्रवण-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: ‘आज्ञा’ ईश्वरीय आदेश के कानूनी और वाचागत भार को स्पष्ट एवं प्रचलित हिन्दी में व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं बदला गया।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन के स्वामित्व-सूचक प्रत्यय को हिन्दी में ‘अपने परमेश्वर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: जो मैं आज तुम्हें दे रहा हूँ
  rationale: ‘जो’ आज्ञाओं से सम्बन्ध जोड़ता है; वर्तमान कृदन्त की जारी वाणी को ‘दे रहा हूँ’ व्यक्त करता है, और ‘आज’ वाचा की तात्कालिकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: שׁמע में सुनने और आज्ञापालन का संबंध
  choice: मानो
  alternative: सुनो
  rationale: क्रिया का शाब्दिक आधार ‘सुनना’ है, पर वाचा के इस प्रसंग में उत्तरदायी आज्ञापालन निहित है। आज्ञाओं के साथ आधुनिक हिन्दी में ‘मानो’ अधिक स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। पद 26 से चले आ रहे अधूरे वाक्य-विन्यास को ‘आशीष, यदि…’ के रूप में सुरक्षित रखा गया है।
