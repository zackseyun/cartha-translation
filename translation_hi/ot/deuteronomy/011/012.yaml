  text: אֶ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ דֹּרֵ֣שׁ אֹתָ֑/הּ תָּמִ֗יד עֵינֵ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/הּ מֵֽ/רֵשִׁית֙ הַ/שָּׁנָ֔ה וְ/עַ֖ד אַחֲרִ֥ית שָׁנָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: hi
  text: यह ऐसा देश है जिसकी सुधि[a] तुम्हारा परमेश्वर यहोवा लेता है; वर्ष के आरम्भ से वर्ष के अन्त तक तुम्हारे परमेश्वर यहोवा की आँखें निरन्तर उस पर लगी रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी वह खोज करता है” अथवा “जिसकी देखभाल करता है।” इब्रानी क्रिया का अर्थ खोजना, पूछताछ करना या किसी की सुधि लेना हो सकता है; यहाँ यह देश के प्रति यहोवा के सक्रिय सरोकार को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ आशय समूची पृथ्वी से नहीं, इस्राएल को मिलने वाले भूभाग से है; आधुनिक हिन्दी में ‘देश’ इस सन्दर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित वाचा-सम्बन्धी सम्बोधन को ठीक प्रकार व्यक्त करता है।
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: जिसकी सुधि ... लेता है
  rationale: דרש का मूल अर्थ खोजना, पूछताछ करना या ध्यान रखना हो सकता है। भूमि के विषय में ‘सुधि लेना’ सक्रिय देखभाल और सरोकार को व्यक्त करते हुए मूल की अर्थ-व्याप्ति भी बनाए रखता है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: चलते रहने वाले, नियमित और अटूट ध्यान का भाव देता है तथा गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: तुम्हारे परमेश्वर यहोवा की आँखें ... उस पर लगी रहती हैं
  rationale: ईश्वर की सतर्क दृष्टि का मूल मानवीकरण सुरक्षित रहता है; ‘आँखें उस पर लगी रहना’ हिन्दी का स्वाभाविक मुहावरा है।
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: वर्ष के आरम्भ से वर्ष के अन्त तक
  rationale: समूचे वर्ष की कालावधि को स्पष्ट और मूल क्रम के अनुरूप व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यन्तरण है और नाम को केवल उपाधि में नहीं बदलता।
- issue: ईश्वर की आँखों का मानवीकरण
  choice: आँखें ... उस पर लगी रहती हैं
  alternative: वह निरन्तर उसकी देखभाल करता है
  rationale: मूल पाठ के ठोस चित्र को बनाए रखा गया है, बिना उसे मात्र अमूर्त देखभाल में विलीन किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सुधि लेना’ स्रोत की अर्थगत बहुविधता को कुछ हद तक सुरक्षित रखता है, जबकि आँखों वाली मूल छवि को ज्यों का त्यों बनाए रखा गया है।
