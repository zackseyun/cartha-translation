  text: וְ/חָרָ֨ה אַף יְהוָ֜ה בָּ/כֶ֗ם וְ/עָצַ֤ר אֶת הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הָ֣/אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת יְבוּלָ֑/הּ וַ/אֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵ/עַל֙ הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁ֥ר יְהוָ֖ה נֹתֵ֥ן לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: hi
  text: तब याहवे का क्रोध तुम पर भड़क उठेगा[a], और वह आकाश को बंद कर देगा, जिससे वर्षा नहीं होगी और भूमि अपनी उपज नहीं देगी; और तुम उस अच्छे देश से शीघ्र ही मिट जाओगे जिसे याहवे तुम्हें दे रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक रूप है, “याहवे की नाक (अर्थात् क्रोध) तुम पर जल उठेगी”; इसका अर्थ है कि उसका तीव्र क्रोध तुम पर भड़क उठेगा।
    reason: मूल इब्रानी के मानवरूपी क्रोध-मुहावरे और उसके रूपक को स्पष्ट करना।
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: तब यहवे का क्रोध तुम पर भड़क उठेगा
  rationale: חָרָה אַף का अर्थ क्रोध का जलना या भड़कना है। हिन्दी में ‘क्रोध भड़क उठेगा’ मूल रूपक और उसकी तीव्रता को स्वाभाविक ढंग से बनाए रखता है। प्रसंग में वाव परिणामसूचक है, इसलिए ‘तब’ उपयुक्त है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है।
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: और वह आकाश को बन्द कर देगा
  rationale: यह वर्षा रोकने के लिए आकाश बन्द करने की मूल छवि को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: जिससे वर्षा नहीं होगी
  rationale: यह खण्ड आकाश बन्द किए जाने का परिणाम बताता है; ‘जिससे’ उस सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְהָאֲדָמָה
  choice: और भूमि
  rationale: אֲדָמָה यहाँ उपजाऊ मिट्टी या धरती को दर्शाता है और आगे आए הָאָרֶץ, अर्थात् देश, से भेद बनाए रखता है।
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: अपनी उपज नहीं देगी
  rationale: यह मूल अभिव्यक्ति के निकट रहते हुए कृषि-सन्दर्भ में सहज आधुनिक हिन्दी है।
- source_word: וַאֲבַדְתֶּם
  choice: और तुम ... मिट जाओगे
  rationale: אבד यहाँ वाचा के न्याय के अधीन विनाश और देश से समाप्त हो जाने का व्यापक अर्थ रखता है। ‘मिट जाओगे’ उसकी तीव्रता बनाए रखता है, पर विनाश की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מְהֵרָה
  choice: शीघ्र ही
  rationale: यह तीव्रता और निकटता दोनों को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है।
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: उस अच्छे देश से
  rationale: מֵעַל में उस देश के ऊपर से हट जाने का भाव है; हिन्दी में ‘देश से मिट जाओगे’ इस निष्कासन या समाप्ति को स्वाभाविक रूप से व्यक्त करता है। यहाँ הָאָרֶץ को ‘देश’ कहने से पहले के אֲדָמָה ‘भूमि’ से भेद रहता है।
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: जिसे यहवे तुम्हें दे रहा है
  rationale: נֹתֵן कृदन्त है; ‘दे रहा है’ इस्राएल को उस समय दिए जा रहे देश की तात्कालिकता को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उस नाम को उपाधि से बदले बिना हिन्दी में प्रस्तुत करता है।
- issue: ईश्वरीय क्रोध का मानवरूपी मुहावरा
  choice: यहवे का क्रोध तुम पर भड़क उठेगा
  alternative: यहवे तुमसे क्रोधित होगा
  rationale: चुना गया पाठ मूल के ‘क्रोध जलने’ वाले सजीव रूपक को बनाए रखता है, पर शाब्दिक ‘नाक’ को मुख्य पाठ में लाकर अर्थ को अस्पष्ट नहीं करता।
- issue: וַאֲבַדְתֶּם में न्याय का स्वरूप
  choice: मिट जाओगे
  alternative: नष्ट कर दिए जाओगे; देश से निकाल दिए जाओगे
  rationale: मूल क्रिया विनाश या समाप्त हो जाने को व्यक्त करती है, पर अकेले इस पद में साधन को स्पष्ट नहीं करती। इसलिए अनुवाद निर्वासन अथवा शारीरिक मृत्यु में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज शैली अपनाई गई है। ‘आकाश को बन्द कर देगा’ मूल छवि को बनाए रखता है; ‘भूमि’ और ‘देश’ से אֲדָמָה तथा אֶרֶץ का भेद सुरक्षित है।
