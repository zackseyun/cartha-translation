language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: hi
  text: इसलिए तुम मेरे इन वचनों को अपने हृदय और अपने प्राण पर रखो, और उन्हें अपने हाथ पर एक चिह्न के रूप में बाँधो; और वे तुम्हारी आँखों के बीच माथे की पट्टियाँ[a] हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मग्रंथ की छोटी डिब्बियाँ”; बाद की यहूदी परंपरा में इन्हें पहना जाता था। यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका सटीक अर्थ अनिश्चित है।
    reason: दुर्लभ इब्रानी शब्द का वैकल्पिक ऐतिहासिक अर्थ और उसकी अनिश्चितता बताना।
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: इसलिए तुम ... रखो
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है। ‘रखो’ ठोस इब्रानी बिंब और आज्ञार्थक बल बनाए रखता है; आरम्भिक וְ को पूर्ववर्ती संदर्भ की परिणति के रूप में ‘इसलिए’ से व्यक्त किया गया है।
- source_word: דְּבָרַי אֵלֶּה
  choice: मेरे इन वचनों को
  rationale: प्रथम पुरुष एकवचन प्रत्यय का स्वामित्व स्पष्ट रहता है और हिन्दी में यह शब्दक्रम स्वाभाविक तथा गरिमापूर्ण है।
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: अपने हृदय और अपने प्राण पर
  rationale: עַל के ‘पर’ बिंब को बनाए रखा गया है। נֶפֶשׁ के व्यापक अर्थ-क्षेत्र में यहाँ ‘प्राण’ पारंपरिक भार रखता है और उसे केवल मन अथवा जीवन तक सीमित नहीं करता।
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: और उन्हें ... बाँधो
  rationale: קשׁר का सीधा अर्थ ‘बाँधना’ है; यह शाब्दिक और प्रतीकात्मक, दोनों संभावनाओं को खुला रखता है।
- source_word: לְאוֹת
  choice: एक चिह्न के रूप में
  rationale: אוֹת का अर्थ ‘चिह्न/संकेत’ है। यह चयन प्रतीकात्मक अर्थ व्यक्त करता है, पर उसके भौतिक रूप को निर्धारित नहीं करता।
- source_word: עַל יֶדְכֶם
  choice: अपने हाथ पर
  rationale: יָד का सामान्य अर्थ ‘हाथ’ है; ‘बाँह’ कहना अनावश्यक व्याख्या होती।
- source_word: לְטוֹטָפֹת
  choice: माथे की पट्टियाँ
  rationale: טוֹטָפֹת दुर्लभ शब्द है और ठीक अर्थ अनिश्चित है। ‘माथे की पट्टियाँ’ शरीर पर पहनी जाने वाली वस्तु का सामान्य बोध देता है, बिना बाद की विशिष्ट प्रथा को मूल पाठ में आरोपित किए।
- source_word: בֵּין עֵינֵיכֶם
  choice: तुम्हारी आँखों के बीच
  rationale: इब्रानी अभिव्यक्ति का सीधा बिंब सुरक्षित रखा गया है; केवल ‘माथे पर’ कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: हाथ पर बाँधने और आँखों के बीच रखने की आज्ञा शाब्दिक है या रूपकात्मक
  choice: ठोस शारीरिक बिंब को बनाए रखते हुए अर्थ को अनिर्णीत रखना
  alternative: इसे केवल मन और कर्म में वचनों को धारण करने का रूपक मानना, अथवा केवल शाब्दिक धार्मिक वस्तु पहनने की आज्ञा मानना
  rationale: पद की भाषा ठोस है, पर स्वयं पद यह निश्चित नहीं करता कि उसका बल केवल रूपकात्मक, केवल शाब्दिक, या दोनों है। अनुवाद को इस तनाव का निर्णय पाठक के लिए नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक रूप अपनाया गया है। ‘हृदय’, ‘प्राण’ और ‘चिह्न’ व्यापक पाठक-वर्ग के लिए परिचित हैं। दुर्लभ טוֹטָפֹת के लिए मुख्य पाठ में समझ आने योग्य सामान्य पद रखा गया है और ऐतिहासिक विकल्प पादटिप्पणी में दिया गया है।
