  text: וְ/הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ אֶ֥רֶץ הָרִ֖ים וּ/בְקָעֹ֑ת לִ/מְטַ֥ר הַ/שָּׁמַ֖יִם תִּשְׁתֶּה מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: hi
  text: परन्तु जिस देश को अपने अधिकार में लेने के लिए तुम पार जा रहे हो, वह पहाड़ों और घाटियों का देश है; वह आकाश से होने वाली वर्षा का पानी पीता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: परन्तु जिस देश
  rationale: वाव यहाँ पिछले पद में मिस्र के वर्णन से विरोध दिखाता है; इसलिए आधुनिक हिन्दी में ‘परन्तु’ उपयुक्त है।
- source_word: עֹבְרִים שָׁמָּה
  choice: तुम पार जा रहे हो
  rationale: कृदन्त और दिशासूचक अव्यय उस देश में आसन्न प्रवेश को व्यक्त करते हैं; हिन्दी में गन्तव्य आगे के वाक्यांश से स्पष्ट है।
- source_word: לְרִשְׁתָּהּ
  choice: उस पर अधिकार करने के लिए
  rationale: यरश क्रिया यहाँ सक्रिय रूप से देश को अपने अधिकार में लेने का भाव रखती है, साथ ही व्यवस्थाविवरण की वाचा-संबंधी पृष्ठभूमि में विरासत का अर्थ भी अंतर्निहित रह सकता है।
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: पहाड़ों और घाटियों का देश
  rationale: यह भूभाग की ऊँच-नीच का स्वाभाविक और स्पष्ट हिन्दी वर्णन है; בְקָעוֹת घाटियों या निम्न बेसिनों को सूचित करता है।
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: आकाश की वर्षा का
  rationale: हिब्रू प्रयोग वर्षा को ऊपर से आने वाले जल-स्रोत के रूप में प्रस्तुत करता है। ‘आकाश की वर्षा’ हिन्दी में स्वाभाविक है और שָׁמַיִם का प्रसंगानुकूल अर्थ देता है।
- source_word: תִּשְׁתֶּה מָּיִם
  choice: वह ... पानी पीता है
  rationale: भूमि को पानी पीने वाली बताने वाला मूल मानवीकरण सुरक्षित रखा गया है।
theological_decisions:
- issue: לְרִשְׁתָּהּ में अधिकार और विरासत के अर्थों का संबंध
  choice: मुख्य पाठ में ‘अधिकार करने’
  alternative: ‘विरासत में लेने’
  rationale: इस प्रसंग में इस्राएल का सक्रिय रूप से पार जाकर देश को अपने अधिकार में लेना प्रमुख है। फिर भी क्रिया का वाचा-संबंधी विरासत का भाव नकारा नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘देश’ के लिए पुल्लिंग सर्वनाम और क्रिया रखी गई है। मूल का भूमि के ‘पानी पीने’ वाला सजीव चित्र ज्यों का त्यों सुरक्षित है।
