language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: hi
  text: तब याहवे इन सभी जातियों को तुम्हारे सामने से निकाल देगा, और तुम अपने से बड़ी और अधिक शक्तिशाली जातियों को बेदखल करोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: निकाल देगा
  rationale: हिफ़ील रूप का कारक अर्थ किसी को उसके अधिकार-स्थान से हटाना है। विजय के इस प्रसंग में ‘निकाल देगा’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה का हिंदी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: इन सभी जातियों
  rationale: गּוֹיִם यहाँ भूमि में रहने वाले जातीय-राजनीतिक समुदायों को दर्शाता है; आधुनिक हिंदी में ‘जातियाँ’ इस संदर्भ में सहज है।
- source_word: מִלִּפְנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: शाब्दिक अर्थ ‘तुम्हारे मुख/उपस्थिति के सामने से’ है; हिंदी मुहावरे में ‘तुम्हारे सामने से’ मूल बिंब और निष्कासन का भाव दोनों रखता है।
- source_word: וִירִשְׁתֶּם
  choice: तुम ... बेदखल करोगे
  rationale: क़ाल रूप ירשׁ का अर्थ अधिकार लेना या अधिकार से हटाना हो सकता है। यहाँ सीधा कर्म ‘जातियाँ’ है, भूमि नहीं, इसलिए ‘बेदखल करोगे’ उपयुक्त है और अर्थ की दिशा स्पष्ट करता है।
- source_word: גְּדֹלִים
  choice: बड़ी
  rationale: מִכֶּם के साथ इसका तुलनात्मक अर्थ ‘तुमसे बड़ी’ है।
- source_word: וַעֲצֻמִים
  choice: अधिक शक्तिशाली
  rationale: עָצוּם बल और सामर्थ्य को व्यक्त करता है; ‘अधिक शक्तिशाली’ आधुनिक, स्पष्ट और तुलनात्मक हिंदी है।
- source_word: מִכֶּם
  choice: अपने से
  rationale: द्वितीय पुरुष बहुवचन के साथ तुलनात्मक מִן को स्वाभाविक हिंदी में ‘अपने से’ कहा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिंदी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: וִירִשְׁתֶּם में अधिकार पाने और बेदखल करने की अर्थ-संभावना
  choice: बेदखल करोगे
  alternative: अधिकार करोगे
  rationale: क्रिया का कर्म स्वयं ‘जातियाँ’ हैं; इसलिए यहाँ उन पर अधिकार पाने की अपेक्षा उन्हें उनके अधिकार से हटाने का अर्थ अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निकाल देगा’ और ‘बेदखल करोगे’ से एक ही हिब्रू धातु के हिफ़ील और क़ाल प्रयोगों का संदर्भगत अंतर स्पष्ट किया गया है।
