  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: hi
  text: जिस हर स्थान पर तुम्हारे पाँव का तलवा पड़ेगा, वह तुम्हारा होगा। निर्जन प्रदेश और लबानोन से, नदी—फरात नदी—से लेकर पश्चिमी समुद्र[a] तक तुम्हारी सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘पीछे का समुद्र’ या ‘अंतिम समुद्र’; सामान्यतः इससे भूमध्य सागर समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: हर स्थान
  rationale: यह वितरणात्मक अभिव्यक्ति प्रत्येक स्थान को दर्शाती है; हिंदी में ‘हर स्थान’ स्वाभाविक और सटीक है।
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: जहाँ-जहाँ तुम्हारे पाँव का तलवा पड़ेगा
  rationale: ‘पाँव का तलवा’ मूल ठोस बिंब को बनाए रखता है और ‘जहाँ-जहाँ ... पड़ेगा’ सामान्य हिंदी में व्यापकता व्यक्त करता है।
- source_word: לָכֶם יִהְיֶה
  choice: तुम्हारा होगा
  rationale: यह स्वामित्व और प्रतिज्ञा, दोनों के भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַמִּדְבָּר
  choice: निर्जन प्रदेश से
  rationale: מִדְבָּר के वनहीन, कम आबादी वाले भूभाग के व्यापक अर्थ को ‘रेगिस्तान’ से अधिक उपयुक्त रूप में व्यक्त करता है।
- source_word: וְהַלְּבָנוֹן
  choice: और लबानोन
  rationale: संयोजक ‘और’ को बनाए रखते हुए स्रोत की सीमा-सूचक शृंखला सुरक्षित रखी गई है।
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: महानद अर्थात् फरात नदी तक
  rationale: संदर्भ में निश्चित ‘नदी’ एक उपाधि की तरह प्रयुक्त है और अगला पद उसे फरात के रूप में पहचानता है; ‘महानद’ इस प्रचलित भूगोल-सूचक भाव को संक्षेप में रखता है।
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: और पश्चिमी समुद्र तक
  rationale: אַחֲרוֹן का शाब्दिक भाव ‘पीछे का/अंतिम’ है, पर प्राचीन पूर्वाभिमुख दिशा-बोध में आशय पश्चिम स्थित समुद्र से है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: तुम्हारी सीमा होगी
  rationale: גְּבוּל के भौगोलिक सीमा-बोध को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: भूमि की भौगोलिक प्रतिज्ञा
  choice: पद को क्षेत्रीय सीमा की प्रतिज्ञा के रूप में सीधे प्रस्तुत किया गया है।
  alternative: इसे आदर्शीकृत सीमा या बिना शर्त चिरस्थायी अधिकार के रूप में व्याख्यायित करना।
  rationale: मूल पद प्रतिज्ञात भूभाग की सीमा बताता है, पर उसकी बाद की पूर्ति, स्थायित्व या प्रतिरूपात्मक अर्थ का निर्णय स्वयं इस पद में नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली रखी गई है। बहुवचन ‘तुम्हारे/तुम्हारा’ सामूहिक संबोधन को व्यक्त करता है। सीमा-वाक्य को स्वाभाविक हिंदी क्रम में रखा गया है, जबकि मूल के प्रमुख भौगोलिक संकेत सुरक्षित हैं।
