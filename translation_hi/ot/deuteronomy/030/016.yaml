base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: hi
  text: 'जिसकी आज मैं तुम्हें आज्ञा दे रहा हूँ: अपने परमेश्वर याहवे से प्रेम करो, उसके मार्गों पर चलो और उसकी आज्ञाओं, विधियों और न्याय-विधानों[a] का पालन करो। तब तुम जीवित रहोगे और बहुत बढ़ोगे,[b] और जिस देश में तुम उसे अपने अधिकार में लेने के लिए प्रवेश कर रहे हो, वहाँ तुम्हारा परमेश्वर याहवे तुम्हें आशीष देगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘न्याय-विधानों’ के स्थान पर ‘नियमों’ या ‘न्यायपूर्ण निर्णयों’ का अनुवाद भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी क्रियाशृंखला का अनुवाद परिणाम या उद्देश्य के रूप में भी किया जा सकता है: ‘ताकि तुम जीवित रहो और बहुत बढ़ो, और तुम्हारा परमेश्वर याहवे तुम्हें आशीष दे।’'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिसकी आज मैं तुम्हें आज्ञा दे रहा हूँ
  rationale: आरम्भिक सम्बन्धवाचक אֲשֶׁר को पिछले वाक्य से जोड़ते हुए और कृदन्त מְצַוְּךָ की वर्तमान, तात्कालिक क्रिया को बनाए रखते हुए यह रूप चुना गया है।
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: कि तुम अपने परमेश्वर याहवे से प्रेम रखो
  rationale: लामेदयुक्त क्रियार्थक रूप को आज्ञा की विषय-वस्तु के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। יְהוָה को उपाधि से नहीं, व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: उसके मार्गों पर चलो
  rationale: आचरण के लिए प्रयुक्त इब्रानी रूपक ‘मार्गों में चलना’ को हिन्दी के स्वाभाविक परन्तु रूपक-संरक्षक ‘मार्गों पर चलना’ से व्यक्त किया गया है।
- source_word: לִשְׁמֹר
  choice: पालन करो
  rationale: वाचा और व्यवस्था के सन्दर्भ में ‘पालन करना’ आधुनिक हिन्दी में आज्ञाओं को मानने और निभाने का आशय स्पष्ट करता है।
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: उसकी आज्ञाओं, विधियों और न्याय-विधानों
  rationale: तीनों अलग कानूनी पदों का भेद बनाए रखा गया है। מִשְׁפָּטָיו के न्यायिक पहलू को ‘न्याय-विधान’ व्यक्त करता है।
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: तब तुम जीवित रहोगे और बढ़कर बहुत हो जाओगे
  rationale: क्रियाओं की श्रृंखला को आज्ञापालन के परिणाम अथवा प्रतिज्ञा के रूप में प्रस्तुत किया गया है; ‘बहुत हो जाना’ जनसंख्या-वृद्धि का आशय रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: उस पर अधिकार करने
  rationale: यह क्रिया देश को अपने अधिकार में लेने का अर्थ देती है; भूमि-प्रतिज्ञा के प्रसंग में ‘विरासत में पाने’ की छाया भी सम्भव है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: दिशासूचक क्रिया-विशेषण को छोड़ा नहीं गया; हिन्दी में उसे अंतिम उपवाक्य के साथ रखकर स्वाभाविकता और स्रोत-पारदर्शिता दोनों बनाए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे उपस्थित है। उसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- issue: וְחָיִיתָ וְרָבִיתָ וּבֵרַכְךָ की क्रियाशृंखला
  choice: परिणाम/प्रतिज्ञा के रूप में ‘तब ... रहोगे ... हो जाओगे ... आशीष देगा’
  alternative: उद्देश्य के रूप में ‘ताकि तुम जीवित रहो और बढ़ो, और ... आशीष दे’
  rationale: वाव-युक्त पूर्ण क्रियाएँ आज्ञा के परिणाम या भविष्य की प्रतिज्ञा बता सकती हैं। मुख्य पाठ में स्वाभाविक प्रतिज्ञात्मक रूप रखा गया है और वैकल्पिक उद्देश्यात्मक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर वाचा और व्यवस्था से जुड़े पदों में गरिमापूर्ण औपचारिकता रखी गई है। एकवचन सम्बोधन ‘तुम’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन को दर्शाता है। वाक्य का आरम्भ जानबूझकर सम्बन्धवाचक रखा गया है, क्योंकि पद मूल पाठ में पिछले कथन से व्याकरणिक रूप से जुड़ा हुआ है।
