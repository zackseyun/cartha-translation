source:
  edition: WLC
  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: hi
  text: वह स्वर्ग में नहीं है कि तुम कहो, “हमारे लिए कौन स्वर्ग तक चढ़कर जाएगा, उसे हमारे लिए ले आएगा और हमें उसे सुनाएगा, ताकि हम उसका पालन करें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: स्वर्ग में
  rationale: संदर्भ में यह दूर और दुर्गम स्वर्गीय क्षेत्र को दर्शाता है; हिन्दी में ‘स्वर्ग में’ स्वाभाविक है।
- source_word: הִוא
  choice: वह
  rationale: स्त्रीलिंग एकवचन सर्वनाम का संदर्भ पिछले पद की ‘आज्ञा’ से है; हिन्दी में उसके लिए ‘वह’ स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कि तुम कहो
  rationale: यह एक काल्पनिक आपत्ति के कथन का परिचय देता है और हिन्दी वाक्य-विन्यास में सहज बैठता है।
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: हमारे लिए कौन ... चढ़ेगा
  rationale: यह ऊपर जाने की क्रिया और לָנוּ के हितार्थक भाव, दोनों को बनाए रखता है।
- source_word: הַשָּׁמַיְמָה
  choice: स्वर्ग पर
  rationale: दिशासूचक प्रत्यय स्वर्ग की ओर गति बताता है; ‘स्वर्ग पर चढ़ेगा’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: उसे हमारे लिए ले आएगा
  rationale: לקח का मूल भाव ‘लेना’ है, पर प्रसंग में वस्तु को स्वर्ग से लोगों तक लाने का आशय है; ‘ले आएगा’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: हमें उसे सुनाएगा
  rationale: שׁמע के हिफ़इल रूप का कारक भाव ‘सुनने योग्य बनाना/सुनाना’ है; ‘सुनाएगा’ हिन्दी में उसी भाव का स्वाभाविक रूप है और स्पष्ट कर्म ‘उसे’ भी सुरक्षित रहता है।
- source_word: וְנַעֲשֶׂנָּה
  choice: ताकि हम उसका पालन करें
  rationale: आज्ञा के संदर्भ में ‘उसे करना’ का स्वाभाविक हिन्दी अर्थ ‘उसका पालन करना’ है; ‘ताकि’ प्रयोजन/परिणाम का संबंध स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्ग’ को ‘आकाश’ पर इसलिए प्राथमिकता दी गई है कि निकटवर्ती संदर्भ दुर्गमता और ऊपर के क्षेत्र की बात करता है। कोई पंथ-विशेष व्याख्या नहीं जोड़ी गई।
