  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: hi
  text: और तुम्हारा परमेश्वर याहवे ये सभी शाप[a] तुम्हारे शत्रुओं और तुमसे घृणा करनेवालों पर डालेगा, जिन्होंने तुम्हारा पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ये सभी शपथें’; व्यवस्थाविवरण में यह शब्द प्रायः वाचा के शापों या दंडों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: डालेगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ व्यापक है; शापों के साथ और עַל के कारण हिंदी में ‘पर डालेगा’ स्वाभाविक रूप से शाप आरोपित करने का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबल परंपरा में चतुरक्षरीय दिव्य नाम का प्रचलित और सहज पहचाना जानेवाला लिप्यंतरण ‘यहोवा’ है; इसे उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित पद का सीधा अर्थ ‘तुम्हारा परमेश्वर’ है।
- source_word: כָּל הָאָלות הָאֵלֶּה
  choice: ये सभी शाप
  rationale: व्यवस्थाविवरण की वाचा-संबंधी पृष्ठभूमि में אָלָה यहाँ उन दंडात्मक शापों को सूचित करता है जिनकी घोषणा पहले की गई थी।
- source_word: אֹיְבֶיךָ
  choice: तुम्हारे शत्रुओं
  rationale: बहुवचन और द्वितीय पुरुष एकवचन संबंधवाचक प्रत्यय का स्वाभाविक हिंदी रूप।
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: और तुमसे घृणा करनेवालों पर
  rationale: इब्रानी कृदंत की निरंतर/विशेषतामूलक क्रिया को सहज आधुनिक हिंदी संबंधसूचक अभिव्यक्ति में रखा गया है।
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: जिन्होंने तुम्हारा पीछा किया था
  rationale: רדף का व्यापक अर्थ ‘पीछा करना’ है। पूर्ण क्रिया को पूर्ववर्ती शत्रुतापूर्ण कार्रवाई के रूप में ‘किया था’ से व्यक्त किया गया, बिना ‘सताया’ जैसे अधिक व्याख्यात्मक अर्थ को थोपे।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिंदी पाठकों के लिए ‘यहोवा’ स्थापित लिप्यंतरण है, जबकि ‘याहवे’ स्रोत-उच्चारण का वैकल्पिक विद्वत्तापरक रूप है।
- issue: वाचा के संदर्भ में אָלוֹת का अर्थ
  choice: शाप
  alternative: शपथें
  rationale: अध्याय के निकट संदर्भ में इसका संकेत पहले घोषित वाचा-दंडों की ओर है; फिर भी शब्द के व्यापक कोशीय अर्थ ‘शपथें’ को निर्णय में दर्ज रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। संबोधन मूल के अनुसार एकवचन ‘तुम्हारा/तुमसे/तुम्हारा’ है। ‘शत्रुओं’ और ‘घृणा करनेवालों’ की समानांतरता सुरक्षित है। अलग पाठ-टिप्पणी नहीं जोड़ी गई, क्योंकि ‘शपथें’ कोशीय विकल्प होते हुए भी इस संदर्भ में मुख्य पाठ को संदिग्ध नहीं बनाता।
