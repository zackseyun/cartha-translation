base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: hi
  text: परन्तु यदि तुम्हारा मन हट जाए, और तुम न सुनो,[a] और तुम भटकाए जाओ, और दूसरे देवताओं के आगे दण्डवत् करो और उनकी सेवा करो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सुनो’ का अनुवाद यहाँ ‘आज्ञा मानो’ भी किया जा सकता है, क्योंकि वाचा के संदर्भ में इस इब्रानी क्रिया में कही हुई बात पर ध्यान देकर उसका पालन करने का भाव भी शामिल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले सकारात्मक आह्वान के विपरीत शर्त प्रस्तुत करता है; ‘परन्तु यदि’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִפְנֶה לְבָבְךָ
  choice: तुम्हारा मन फिर जाए
  rationale: פנה का मूल अर्थ ‘मुड़ना/फिरना’ है; ‘मन फिर जाना’ भीतरी निष्ठा के हटने को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְלֹא תִשְׁמָע
  choice: और तुम न सुनो
  rationale: שׁמע में सुनने के साथ बात मानने का भाव भी हो सकता है। मुख्य पाठ में श्रवण-रूपक सुरक्षित रखा गया है और वाचा-संबंधी आज्ञापालन का भाव पादटिप्पणी में बताया गया है।
- source_word: וְנִדַּחְתָּ
  choice: और तुम बहकाए जाओ
  rationale: נדח के निफ़अल रूप में उचित निष्ठा से दूर किए, खींचे या भटकाए जाने का निष्क्रिय भाव है। ‘बहकाए जाओ’ उस निष्क्रियता और धार्मिक विचलन दोनों को बनाए रखता है।
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: दण्डवत् करके
  rationale: यह क्रिया शारीरिक रूप से झुकने या भूमि पर गिरकर प्रणाम करने को दर्शाती है; ‘दण्डवत् करना’ उपासना-संदर्भ में इस दृश्य क्रिया को सुरक्षित रखता है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के आगे
  rationale: यह व्यवस्थाविवरण में प्रतिद्वंद्वी देवताओं के लिए प्रचलित अभिव्यक्ति है; ‘दूसरे देवता’ सीधा और तटस्थ अनुवाद है।
- source_word: וַעֲבַדְתָּם
  choice: उनकी सेवा करो
  rationale: עבד यहाँ देवताओं को दी जाने वाली धार्मिक सेवा को व्यक्त करता है। ‘सेवा करो’ मूल शब्द का सेवा-संबंधी अर्थ बनाए रखता है।
theological_decisions:
- issue: धर्मत्याग की क्रमिक गति
  choice: मन का फिरना, न सुनना, बहकाया जाना, दूसरे देवताओं को दण्डवत् करना और उनकी सेवा करना—इन चरणों को क्रमिक रूप से रखा गया है।
  alternative: ‘बहकाए जाओ’ को अधिक सक्रिय रूप में ‘अपने को बहकने दो’ कहना, या ‘सुनो’ के स्थान पर ‘आज्ञा मानो’ कहना।
  rationale: इब्रानी पाठ वाचा से विमुखता की बढ़ती हुई शृंखला प्रस्तुत करता है, पर एजेंसी या सिद्धान्तगत कारण को विस्तार से निर्धारित नहीं करता। अनुवाद निष्क्रिय रूप और ‘सुनने’ के रूपक को बनाए रखकर इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘मन फिर जाए’ और ‘दण्डवत्’ बाइबिलीय संदर्भ में परिचित हैं; वाक्य की शर्तीय और क्रमिक संरचना मूल के अनुरूप रखी गई है।
