base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/015.yaml
  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: hi
  text: देखो[a], आज मैंने तुम्हारे सामने जीवन और भलाई, तथा मृत्यु और बुराई[b] रखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्यान दो’; इब्रानी में यह श्रोता का ध्यान खींचने वाली आज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: ‘बुराई’ का अर्थ कुछ संदर्भों में ‘हानि’ या ‘विपत्ति’ भी हो सकता है; यहाँ इब्रानी में यह ‘भलाई’ के सीधे विरोध में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: देखो
  rationale: यह ראה का एकवचन पुल्लिंग आज्ञार्थक रूप है और श्रोता का ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ सीधा और स्वाभाविक है।
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: मैंने तुम्हारे सामने ... रखी है
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; לְפָנֶיךָ के साथ यह विकल्पों को किसी के सामने रखने का भाव देता है। हिन्दी में ‘सामने रखना’ इस मुहावरे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: सरल कालवाचक क्रियाविशेषण; आधुनिक हिन्दी में इसका सीधा समतुल्य ‘आज’ है।
- source_word: הַחַיִּים
  choice: जीवन
  rationale: रूप की दृष्टि से बहुवचन होते हुए भी חַיִּים यहाँ भाववाचक अर्थ ‘जीवन’ में प्रयुक्त है।
- source_word: הַטּוֹב
  choice: भलाई
  rationale: טוֹב के व्यापक अर्थ ‘अच्छाई/भलाई’ को सुरक्षित रखता है और इसे केवल समृद्धि या कुशल-क्षेम तक सीमित नहीं करता। ‘जीवन’ के साथ संज्ञात्मक समानांतरता के लिए ‘भलाई’ स्वाभाविक है।
- source_word: הַמָּוֶת
  choice: मृत्यु
  rationale: जीवन के प्रत्यक्ष विलोम के रूप में संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: הָרָע
  choice: बुराई
  rationale: רַע नैतिक बुराई के साथ हानि या विपत्ति को भी सूचित कर सकता है। यहाँ הַטּוֹב के सीधे विलोम में ‘बुराई’ व्यापक विरोध को बनाए रखती है।
theological_decisions:
- issue: वाचा-संबंधी विरोध में הָרָע का अर्थ
  choice: बुराई
  alternative: हानि या विपत्ति
  rationale: पद जीवन/भलाई और मृत्यु/बुराई का व्यापक वाचा-संबंधी विरोध प्रस्तुत करता है। ‘बुराई’ नैतिक और अस्तित्वगत तनाव को बनाए रखती है, जबकि केवल ‘विपत्ति’ चुनने से अर्थ अनावश्यक रूप से परिणामों तक सीमित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। मूल के समानांतर युग्म—जीवन/भलाई और मृत्यु/बुराई—को स्पष्ट रखा गया है।
