id: DEU.30.5
reference: Deuteronomy 30:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: hi
  text: तुम्हारा परमेश्वर याहवे तुम्हें उस देश में ले आएगा, जिस पर तुम्हारे पितरों ने अधिकार किया था[a], और तुम उस पर अधिकार करोगे। वह तुम्हारा भला करेगा[b] और तुम्हारी संख्या तुम्हारे पितरों से भी अधिक बढ़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसे तुम्हारे पितरों ने विरासत में पाया था” अथवा “जिसे तुम्हारे पितरों ने अपने अधिकार में लिया था।” इब्रानी क्रिया में विरासत पाने और अधिकार करने, दोनों की अर्थछायाएँ हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: या “वह तुम्हें समृद्ध करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: तुम्हें ... ले आएगा
  rationale: בוא के हिफ़ील रूप का अर्थ ‘भीतर लाना/ले आना’ है। ‘वापस’ प्रसंग में निहित है, पर इस क्रिया में स्पष्ट नहीं, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: व्यवस्थाविवरण में यह प्रतिज्ञात भौगोलिक देश को सूचित करता है; ‘देश’ आधुनिक हिन्दी में इस संदर्भ में स्वाभाविक है।
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: जिस पर तुम्हारे पितरों ने अधिकार किया था
  rationale: ירשׁ में उत्तराधिकार पाने और अधिकार करने, दोनों की अर्थछायाएँ हो सकती हैं। यहाँ पूर्वजों द्वारा देश पर अधिकार रखने का भाव स्वाभाविक है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֲבֹתֶיךָ
  choice: तुम्हारे पितरों
  rationale: मूल का स्पष्ट पुल्लिंग बहुवचन संबंधसूचक शब्द सुरक्षित रखा गया है; ‘पितर’ इस ऐतिहासिक-वंशगत संदर्भ में संक्षिप्त और समझने योग्य है।
- source_word: וִירִשְׁתָּהּ
  choice: तुम उस पर अधिकार करोगे
  rationale: देश को कर्म बनाकर प्रयुक्त ירשׁ यहाँ अधिकार/कब्ज़ा प्राप्त करने को दर्शाता है और पिछले उपवाक्य से शब्दगत संबंध बनाए रखता है।
- source_word: וְהֵיטִבְךָ
  choice: वह तुम्हारा भला करेगा
  rationale: יטב के हिफ़ील रूप का मूल लाभकारी अर्थ ‘किसी का भला करना’ है। यह ‘समृद्ध करेगा’ की तुलना में अधिक सीधा है और केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: וְהִרְבְּךָ
  choice: तुम्हारी संख्या ... बढ़ाएगा
  rationale: רבה का हिफ़ील रूप यहाँ लोगों को बहुसंख्यक बनाने का भाव देता है। हिन्दी में ‘तुम्हारी संख्या बढ़ाएगा’ स्पष्ट और स्वाभाविक है तथा पितृकालीन वृद्धि-प्रतिज्ञा की प्रतिध्वनि रखता है।
- source_word: מֵאֲבֹתֶיךָ
  choice: तुम्हारे पितरों से भी अधिक
  rationale: तुलनात्मक מִן को स्पष्ट हिन्दी तुलना के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: אֲבֹתֶיךָ में लिंगयुक्त संबंधसूचक शब्द
  choice: तुम्हारे पितरों
  alternative: तुम्हारे पूर्वजों
  rationale: मूल का शब्द व्याकरणिक रूप से पुल्लिंग बहुवचन ‘पिता/पितर’ है। मुख्य पाठ इसे सुरक्षित रखता है, जबकि आशय इस्राएल के पूर्वजों से है।
- issue: וְהֵיטִבְךָ में आशीष का स्वरूप
  choice: तुम्हारा भला करेगा
  alternative: तुम्हें समृद्ध करेगा
  rationale: मूल क्रिया व्यापक रूप से भलाई करने को व्यक्त करती है; ‘समृद्ध’ कहना अर्थ को भौतिक उन्नति तक सीमित समझे जाने का जोखिम रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। द्वितीय पुरुष एकवचन को हिन्दी के आदरसूचक/सामान्य ‘तुम’ रूप से व्यक्त किया गया है। ‘पितर’ मूल के पुल्लिंग वंशगत शब्द को बनाए रखता है; वाक्य-विन्यास को हिन्दी की स्वाभाविक प्रवाहशीलता के अनुसार दो वाक्यों में रखा गया है।
