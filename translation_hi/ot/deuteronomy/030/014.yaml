  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: hi
  text: क्योंकि यह वचन तुम्हारे बहुत निकट है[a]—तुम्हारे मुँह में और तुम्हारे हृदय में—ताकि तुम इसका पालन करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बात” अथवा “यह आज्ञा।” इब्रानी דָּבָר का अर्थ प्रसंग के अनुसार वचन, बात या आज्ञा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस तार्किक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרוֹב אֵלֶיךָ
  choice: तुम्हारे बहुत निकट
  rationale: यह पदबंध संबोधित व्यक्ति के पास होने या सहज उपलब्ध होने का भाव व्यक्त करता है; ‘निकट’ मूल स्थानिक रूपक बनाए रखता है।
- source_word: הַדָּבָר
  choice: यह वचन
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या प्रसंगानुसार ‘आज्ञा’ हो सकता है। संकेतवाचक ‘यह’ पिछले पदों में उल्लिखित विषय से संबंध स्पष्ट करता है, जबकि ‘वचन’ मूल की अर्थगत व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह निकटता पर बल देता है; ‘बहुत’ आधुनिक हिंदी में सीधा और स्वाभाविक तीव्रतासूचक है।
- source_word: בְּפִיךָ
  choice: तुम्हारे मुँह में
  rationale: शाब्दिक देहगत बिंब को बनाए रखता है और अगले पदबंध ‘हृदय में’ के साथ समानांतरता सुरक्षित करता है।
- source_word: וּבִלְבָבְךָ
  choice: और तुम्हारे हृदय में
  rationale: לֵבָב विचार, इच्छा और भीतरी मनुष्य को समेट सकता है; ‘हृदय’ पारंपरिक बिंब और मुँह/हृदय की समानांतरता दोनों बनाए रखता है।
- source_word: לַעֲשֹׂתוֹ
  choice: ताकि तुम इसे मानो
  rationale: ל सहित क्रिया-रूप उद्देश्य या अपेक्षित परिणाम व्यक्त करता है। आज्ञा अथवा वचन के संदर्भ में हिंदी ‘मानना’ कार्यान्वित करने या पालन करने का स्वाभाविक अर्थ देता है, केवल सुनने या स्वीकार करने का नहीं।
theological_decisions:
- issue: הַדָּבָר का संदर्भ
  choice: मुख्य पाठ में ‘यह वचन’
  alternative: ‘यह आज्ञा’ या ‘यह बात’
  rationale: निकट संदर्भ परमेश्वर की आज्ञा से संबंधित है, फिर भी मूल पद व्यापक דָּבָר का प्रयोग करता है। ‘वचन’ उस प्रसंग को व्यक्त करता है, पर अर्थ को केवल एक विशिष्ट ‘आज्ञा’ तक सीमित नहीं करता।
- issue: לַעֲשֹׂתוֹ में आज्ञापालन का भाव
  choice: ‘ताकि तुम इसे मानो’
  alternative: ‘ताकि तुम इसे करो’
  rationale: ‘करो’ अधिक रूपात्मक है, किंतु हिंदी में ‘वचन करना’ अस्वाभाविक है। ‘मानो’ यहाँ वचन को व्यवहार में लाने और उसका पालन करने का अर्थ देता है; इसे केवल मानसिक सहमति के रूप में नहीं लिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और मौखिक रूप से सुबोध प्रयोग। ‘मुँह’ और ‘हृदय’ के मूल समानांतर बिंब सुरक्षित रखे गए हैं। डैश निकटता के कथन और उसके स्पष्टीकरण के बीच प्रवाह स्पष्ट करते हैं।
