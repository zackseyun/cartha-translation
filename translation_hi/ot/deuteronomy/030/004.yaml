base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: hi
  text: यदि तुम्हारे बिखरे हुए लोग[a] आकाश के छोर पर हों[b], तो वहाँ से याहवे, तुम्हारा परमेश्वर, तुम्हें इकट्ठा करेगा, और वहीं से वह तुम्हें लेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे निकाले हुए लोग’ अथवा ‘तुम्हारे निर्वासित लोग।’ इब्रानी शब्द उन लोगों की ओर संकेत करता है जिन्हें दूर कर दिया गया या बिखेर दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश के छोर पर’ एक इब्रानी मुहावरा है, जिसका अर्थ है जितना दूर सम्भव हो उतना दूर।
    reason: cultural_note
  - marker: c
    text: या ‘वह तुम्हें ले आएगा।’ इब्रानी क्रिया का अधिक शाब्दिक अर्थ ‘लेना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है। प्रसंग में ‘भले ही’ सम्भव है, पर मूल में वह बल स्पष्ट रूप से जोड़ा नहीं गया है; ‘भी’ दूरस्थ स्थान की चरम स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִדַּחֲךָ
  choice: तुम्हारे निर्वासित लोग
  rationale: נדח ऐसे लोगों को सूचित करता है जिन्हें दूर कर दिया गया या तितर-बितर किया गया है। एकवचन प्रत्यय इस्राएल को सामूहिक रूप से सम्बोधित करता है; हिन्दी में बहुवचन ‘लोग’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: आकाश के छोर पर
  rationale: यह अत्यन्त दूरस्थ स्थान के लिए इब्रानी स्थानवाचक मुहावरा है। ‘आकाश के छोर’ मूल बिम्ब को बनाए रखता है।
- source_word: מִשָּׁם
  choice: वहाँ से / वहीं से
  rationale: इब्रानी में इसकी पुनरावृत्ति बल देती है। हिन्दी में पहली बार ‘वहाँ से’ और दूसरी बार ‘वहीं से’ कहकर पुनरावृत्ति और बल दोनों रखे गए हैं।
- source_word: יְקַבֶּצְךָ
  choice: तुम्हें इकट्ठा करेगा
  rationale: קבץ के पिएल रूप का अर्थ ‘इकट्ठा करना’ है। ‘वापस’ नहीं जोड़ा गया, क्योंकि वह प्रसंग में निहित है, क्रिया में स्पष्ट नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में ध्वन्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: यह इस्राएल से एकवचन सामूहिक सम्बोधन में प्रयुक्त मानक वाचागत पद है।
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: और वहीं से वह तुम्हें ले लेगा
  rationale: לקח का मूल अर्थ ‘लेना’ है। ‘ले आएगा’ गन्तव्य को अधिक स्पष्ट कर देता, जबकि वह इस पद में नहीं बल्कि आगे के प्रसंग में प्रकट होता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और ‘यहोवा’ वाली भिन्न पारम्परिक ध्वनि से अलग रखता है।
- issue: इस्राएल के लिए सामूहिक एकवचन सम्बोधन
  choice: ‘तुम्हारे’ और ‘तुम्हें’ द्वारा एकवचन सम्बोधन बनाए रखना
  alternative: बहुवचन सम्बोधन ‘तुम लोगों के/तुम लोगों को’
  rationale: इब्रानी इस्राएल को एक सामूहिक इकाई के रूप में एकवचन में सम्बोधित करता है। हिन्दी के रूप प्रसंगानुसार एकवचन और बहुवचन दोनों हो सकते हैं, इसलिए मूल की सामूहिकता बिना अनावश्यक विस्तार के बनी रहती है।
- issue: לקח में गति की दिशा
  choice: ले लेगा
  alternative: ले आएगा
  rationale: इस पद में क्रिया स्वयं गन्तव्य स्पष्ट नहीं करती। ‘ले लेगा’ उस खुलापन को बचाता है; अगले पद की जानकारी को पहले से इसमें नहीं मिलाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निर्वासित लोग’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल शब्द की ‘निकाले गए’ और ‘तितर-बितर’ दोनों सम्भावनाएँ सुरक्षित रखती है। ‘आकाश के छोर’ मूल काव्यात्मक बिम्ब को बनाए रखता है और उसका मुहावरेदार अर्थ पादटिप्पणी में समझाया गया है।
