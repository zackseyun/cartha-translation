  edition: WLC
  text: כִּ֚י הַ/מִּצְוָ֣ה הַ/זֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לֹֽא נִפְלֵ֥את הִוא֙ מִמְּ/ךָ֔ וְ/לֹ֥א רְחֹקָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: hi
  text: क्योंकि यह आज्ञा, जो मैं आज तुम्हें दे रहा हूँ, तुम्हारे लिए बहुत कठिन नहीं है[a] और न ही यह तुमसे दूर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी पहुँच से बाहर नहीं है,” अथवा “तुमसे छिपी हुई नहीं है।” इब्रानी क्रिया का अर्थ असाधारण, अगम्य, या समझ और पहुँच से परे होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמִּצְוָה הַזֹּאת
  choice: यह आज्ञा
  rationale: מִצְוָה के आदेशात्मक और वाचा-संबंधी भाव को ‘आज्ञा’ संक्षिप्त, प्रतिष्ठित और सहज हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जो मैं आज तुम्हें दे रहा हूँ
  rationale: हिन्दी में ‘आज्ञा देना’ स्वाभाविक प्रयोग है; ‘दे रहा हूँ’ इब्रानी कृदंत की वर्तमान और तात्कालिक क्रिया को व्यक्त करता है।
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: तुम्हारे लिए समझ से परे नहीं है
  rationale: נפלא का अर्थ यहाँ असाधारण, अगम्य या पहुँच से बाहर होना हो सकता है। अगले पदों में निकटता और उपलब्धता पर बल होने के कारण ‘समझ से परे नहीं’ बोधगम्यता को व्यक्त करता है, पर पूर्ण मानवीय नैतिक सामर्थ्य का दावा नहीं करता।
- source_word: וְלֹא רְחֹקָה הִוא
  choice: और न ही यह तुमसे दूर है
  rationale: רָחוֹק की दूरी की प्रतिमा को सीधे बनाए रखता है और आगामी पदों में विकसित पहुँच-सुलभता के भाव से जुड़ता है।
theological_decisions:
- issue: मानवीय क्षमता और वाचा-पालन के संबंध में נִפְלֵאת का अर्थ
  choice: ‘तुम्हारे लिए समझ से परे नहीं है’—आज्ञा की बोधगम्यता और सुलभता पर बल
  alternative: ‘तुम्हारे लिए बहुत कठिन नहीं है’ या ‘तुमसे छिपी नहीं है’
  rationale: मूल पाठ आज्ञा को अगम्य या पहुँच से बाहर नहीं बताता। चुना हुआ रूप इसी बात को सामने रखता है, लेकिन यह निर्णय नहीं करता कि मनुष्य अपनी असहाय शक्ति से उसे पूर्णतः मान सकता है; इस प्रकार पाठ का धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘आज्ञा’ वाचा-संबंधी गरिमा बनाए रखती है। वाक्य सरल और मौखिक रूप से सुबोध है, जबकि [a] मूल इब्रानी की वास्तविक अर्थ-विस्तार को सुरक्षित रखता है।
