  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: hi
  text: “जब ये सब बातें—आशीष और शाप, जिन्हें मैंने तुम्हारे सामने रखा है—तुम पर आ पड़ें, और तुम उन सब राष्ट्रों के बीच, जहाँ याहवे, तुम्हारे परमेश्वर ने तुम्हें खदेड़ दिया है, इन बातों को फिर अपने मन में लाओ,[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उन्हें अपने हृदय में वापस लाओ।” इब्रानी में ‘हृदय’ स्मरण और विचार के आंतरिक केंद्र को भी सूचित कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: जब
  rationale: यह रचना भविष्य में घटने वाली परिस्थिति का परिचय देती है। हिंदी में ‘जब’ स्वाभाविक रूप से इसका कालवाचक बल व्यक्त करता है।
- source_word: יָבֹאוּ עָלֶיךָ
  choice: तुम पर आ पड़ें
  rationale: यह इब्रानी मुहावरे ‘तुम पर आएँ’ की निकट और स्वाभाविक हिंदी अभिव्यक्ति है तथा घटनाओं के भोगे जाने का भाव रखती है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सब बातें
  rationale: דברים यहाँ पहले बताई गई वाचा की परिणतियों को समग्र रूप से सूचित करता है; ‘बातें’ हिंदी में ‘वचन’ की अपेक्षा इस संदर्भ में अधिक व्यापक और स्वाभाविक है।
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: वह आशीष और वह शाप
  rationale: दोनों संज्ञाएँ पहले सामने रखी गई वाचा की विपरीत परिणतियों को निश्चित रूप से इंगित करती हैं।
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: जिन्हें मैंने तुम्हारे सामने रखा है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर ‘सामने’ के साथ इसका मुहावरेदार अर्थ किसी विकल्प या विषय को सामने रखना है।
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: तुम इन्हें फिर अपने मन में ले आओ
  rationale: यह चयन שוב के ‘लौटाने’ और לבב के चिंतनशील आंतरिक केंद्र—दोनों को बनाए रखता है। पूर्ववर्ती बातों को दर्शाने के लिए ‘इन्हें’ निहित कर्म के रूप में जोड़ा गया है।
- source_word: בְּכָל הַגּוֹיִם
  choice: उन सब जातियों के बीच
  rationale: בְּ यहाँ निर्वासित लोगों के अन्य राष्ट्रों के भीतर रहने को बताता है; ‘के बीच’ इस बिखराव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הִדִּיחֲךָ
  choice: तुम्हें खदेड़कर भेज देगा
  rationale: क्रिया में बलपूर्वक दूर हटाने या निर्वासित करने का भाव है। ‘खदेड़कर भेज देगा’ इस कठोरता और गंतव्य—दोनों को व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है और אֱלֹהֶיךָ को स्वाभाविक हिंदी पदक्रम में ‘तुम्हारा परमेश्वर’ रखा गया है।
- source_word: שָׁמָּה
  choice: जहाँ … भेज देगा
  rationale: स्थानवाचक ‘वहाँ’ का अर्थ हिंदी के संबंधवाचक वाक्य में ‘जहाँ’ और ‘भेज देगा’ के गंतव्य भाव से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ वाचा के विशिष्ट नाम יהוה का प्रयोग करता है। ‘याहवे’ उसका सीधा लिप्यंतरण है और नाम को सामान्य उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ में स्मरण और मन-परिवर्तन का संबंध
  choice: इन्हें फिर अपने मन में ले आओ
  alternative: इन्हें मन में उतार लो / इन्हें याद करो
  rationale: पद केवल बौद्धिक स्मरण से अधिक आंतरिक विचार की ओर संकेत कर सकता है, पर यहाँ स्वयं ‘मन फिराने’ या ‘पश्चाताप करने’ का स्पष्ट अनुवाद करना अगले पद के विचार को समय से पहले जोड़ देता। इसलिए मूल की रूपकात्मक और अर्थगत खुलावट रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। वाक्य पद 2 में आगे बढ़ता है, इसलिए अंत में अल्पविराम रखा गया है। एकवचन ‘तुम’ मूल पाठ में सामूहिक इस्राएल को संबोधित करता है।
