base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: hi
  text: और तुम्हारा परमेश्वर याहवे तुम्हारे हाथ के हर काम में, तुम्हारी सन्तान में, तुम्हारे पशुधन की बढ़ोतरी में और तुम्हारी भूमि की उपज में तुम्हें बहुतायत देगा[a]—तुम्हारी भलाई के लिए। क्योंकि याहवे फिर तुम्हारे विषय में तुम्हारी भलाई के लिए आनन्दित होगा, जैसा वह तुम्हारे पितरों के विषय में आनन्दित हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें समृद्ध करेगा” या “तुम्हें बहुतायत से देगा”; हिब्रू क्रिया का भाव किसी को भरपूरी या आवश्यकता से अधिक देने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: तुम्हें भरपूर समृद्ध करेगा
  rationale: हिफ़ील रूप किसी को बहुतायत या अधिशेष देने का कारणवाचक भाव रखता है। यह चयन उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है और आगे दी गई ठोस आशीषों से जुड़ा रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: तुम्हारे हाथ के हर काम में
  rationale: हिब्रू के एकवचन 'हाथ' और उसके ठोस मुहावरे को बनाए रखते हुए श्रम तथा सभी उपक्रमों का अर्थ स्पष्ट किया गया है।
- source_word: בִּפְרִי בִטְנְךָ
  choice: तुम्हारी सन्तान में
  rationale: '''गर्भ का फल'' सन्तान के लिए हिब्रू मुहावरा है। हिन्दी में ''सन्तान'' स्वाभाविक और अर्थतः स्पष्ट है; शेष दो ''फल'' पदों को भी उनके सन्दर्भगत अर्थ में प्रस्तुत किया गया है।'
- source_word: בְהֶמְתְּךָ
  choice: तुम्हारे पशुओं
  rationale: यह शब्द इस कृषि-सन्दर्भ में पालतू पशुधन को व्यापक रूप से दर्शाता है; 'पशु' सहज आधुनिक हिन्दी है।
- source_word: אַדְמָתְךָ
  choice: तुम्हारी भूमि
  rationale: यहाँ खेती योग्य मिट्टी/भूमि अभिप्रेत है। 'भूमि की उपज' हिन्दी का स्वाभाविक कृषि-प्रयोग है।
- source_word: לְטוֹבָה / לְטוֹב
  choice: तुम्हारी भलाई के लिए / तुम्हारी भलाई करने में
  rationale: दोनों पद लाभकारी परिणाम दर्शाते हैं। दूसरे प्रयोग में हिन्दी वाक्य-विन्यास के लिए निहित लाभार्थी भाव को स्पष्ट किया गया है।
- source_word: יָשׁוּב ... לָשׂוּשׂ עָלֶיךָ
  choice: फिर तुम्हारी भलाई करने में आनन्दित होगा
  rationale: שׁוב के साथ क्रियार्थक रूप पुनः आरम्भ हुई क्रिया व्यक्त करता है। 'फिर ... आनन्दित होगा' इस अर्थ को सहजता से देता है; עליך के भाव को अगले לְטוֹב के साथ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֲבֹתֶיךָ
  choice: तुम्हारे पूर्वजों
  rationale: शाब्दिक रूप 'तुम्हारे पिताओं' है, पर यहाँ इस्राएल की पिछली पीढ़ियाँ/पुरखे अभिप्रेत हैं। 'पूर्वज' आधुनिक हिन्दी में ठीक वही सामूहिक सन्दर्भ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: चार अक्षरों वाले वाचा-नाम को 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी बाइबिलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप 'यहोवा' अपनाया गया है।
- issue: אֲבֹתֶיךָ का सन्दर्भ
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पिताओं
  rationale: मूल शब्द पुल्लिंग बहुवचन है, किंतु इस सूत्र में इसका सन्दर्भ इस्राएल के पुरखों और पिछली पीढ़ियों से है। 'पूर्वज' उस ऐतिहासिक अर्थ को बिना किसी निजी धर्मसैद्धान्तिक सीमा के व्यक्त करता है।
- issue: यहोवा का आनन्द और भलाई
  choice: तुम्हारी भलाई करने में आनन्दित होगा
  alternative: तुम्हारे ऊपर भलाई के लिए आनन्दित होगा
  rationale: मूल के עליך לְטוֹב में व्यक्ति पर आनन्दित होने और उसके हितकारी परिणाम—दोनों भाव निकट जुड़े हैं। चुना हुआ पाठ स्वाभाविक हिन्दी में हितकारी अभिप्राय स्पष्ट करता है, जबकि ईश्वरीय आनन्द के व्यक्तिगत भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। कृषि-सूची को प्राकृतिक हिन्दी—'सन्तान', 'पशुओं की सन्तान', 'भूमि की उपज'—में व्यक्त किया गया है। मुख्य पाठ में 'तुम' के एकवचन रूप को बनाए रखा गया है, क्योंकि हिब्रू में संबोधन एकवचन है।
