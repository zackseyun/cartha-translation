  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: hi
  text: और वह समुद्र के पार[a] नहीं है कि तुम कहो, “कौन हमारे लिए समुद्र के उस पार जाएगा, उसे हमारे लिए ले आएगा[b] और हमें सुनाएगा[c], ताकि हम उसका पालन करें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समुद्र की दूसरी ओर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसे हमारे लिए लेगा”; संदर्भ में आशय उसे प्राप्त करके हमारे पास लाना है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “हमें उसे सुनवाएगा”; यह कारक अभिव्यक्ति किसी बात को सुनाने या घोषित करने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: समुद्र के पार
  rationale: यह इब्रानी मुहावरा समुद्र की दूसरी ओर स्थित स्थान को दर्शाता है। ‘समुद्र के पार’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा स्थान-संबंधी बिंब बनाए रखता है।
- source_word: הִוא
  choice: वह
  rationale: स्त्रीलिंग सर्वनाम पिछले संदर्भ की ‘आज्ञा’ की ओर संकेत करता है; हिन्दी में ‘वह’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: לֵאמֹר
  choice: कि तुम कहो
  rationale: यह एक काल्पनिक आपत्ति या प्रश्न का कथन आरम्भ करता है; हिन्दी में ‘कि तुम कहो’ इस वाक्य-संबंध को स्पष्ट करता है।
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: कौन हमारे लिए समुद्र के उस पार जाएगा
  rationale: ‘जाएगा’ यहाँ पार जाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘समुद्र के उस पार’ गंतव्य-वाक्यांश को पूरा बनाए रखता है।
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: उसे हमारे लिए ले आएगा
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर संदर्भ में आशय उस आज्ञा को प्राप्त करके लोगों की पहुँच में लाना है; ‘ले आएगा’ इस संदर्भगत गति को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: हमें सुनाएगा
  rationale: हिफ़ील रूप का कारक अर्थ ‘हमें सुनने योग्य बनाएगा/हमें सुनाएगा’ है। ‘हमें सुनाएगा’ हिन्दी में स्वाभाविक रहते हुए उस कारक भाव को सुरक्षित रखता है।
- source_word: וְנַעֲשֶׂנָּה
  choice: ताकि हम उसका पालन करें
  rationale: शाब्दिक भाव ‘और हम उसे करें’ है। आज्ञा के संदर्भ में हिन्दी का ‘पालन करें’ आज्ञाकारिता का अभिप्राय स्पष्ट करता है, और ‘ताकि’ सुनने के उद्देश्य अथवा परिणाम को स्वाभाविक रूप से जोड़ता है।
