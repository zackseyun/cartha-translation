  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: hi
  text: और तुम अपने परमेश्वर याहवे की ओर लौटोगे और उसकी बात मानोगे[a]—उन सबके अनुसार जिनकी आज मैं तुम्हें आज्ञा दे रहा हूँ—तुम और तुम्हारे बच्चे[b], अपने सारे मन और अपने सारे प्राण[c] से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी वाणी सुनोगे।” इब्रानी मुहावरे में सुनने के साथ बात मानने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारे पुत्र”; यहाँ यह शब्द सामान्य अर्थ में संतान को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने सारे जीवन से” अथवा “अपने सम्पूर्ण अस्तित्व से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ עַד
  choice: और तुम ... के पास लौटोगे
  rationale: שׁוּב का मूल अर्थ ‘लौटना/फिरना’ है और עַד यहाँ किसी व्यक्ति की ओर लौटने का लक्ष्य बताता है। ‘पश्चात्ताप करोगे’ प्रसंगगत भाव तो व्यक्त करता, पर मूल क्रिया को अनावश्यक रूप से अधिक विशिष्ट बना देता।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा
  rationale: व्यक्तिगत वाचा-नाम יְהוָה को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; אֱלֹהֶיךָ का अर्थ ‘तुम्हारा परमेश्वर’ है। ‘अपने परमेश्वर’ हिन्दी वाक्य में संबंध को स्वाभाविक ढंग से दिखाता है।
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: और उसकी बात मानोगे
  rationale: שׁמע בְּקוֹל एक इब्रानी मुहावरा है जिसका आशय केवल सुनना नहीं, बल्कि ध्यान देकर आज्ञापालन करना है। ‘उसकी बात मानना’ आधुनिक हिन्दी में उस अर्थ और वाणी-संबंधी बिंब दोनों को सहज रूप से रखता है।
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: उन सब बातों के अनुसार जिनकी आज मैं तुम्हें आज्ञा दे रहा हूँ
  rationale: כְּכֹל אֲשֶׁר आज्ञाओं की पूर्ण व्यापकता और उनके अनुरूप आचरण को व्यक्त करता है। कृदन्त מְצַוֶּה का वर्तमान जारी भाव ‘आज्ञा दे रहा हूँ’ से रखा गया है।
- source_word: אַתָּה וּבָנֶיךָ
  choice: तुम और तुम्हारे बच्चे
  rationale: בָּנִים का शाब्दिक अर्थ ‘पुत्र’ हो सकता है, पर वाचा और वंश के इस प्रसंग में यह सामान्यतः संतान को समावेशी रूप में सूचित कर सकता है।
- source_word: בְּכָל לְבָבְךָ
  choice: अपने सारे मन से
  rationale: לֵבָב इब्रानी में अंतःकरण, इच्छा और विचार के केंद्र को दर्शाता है। हिन्दी का ‘मन’ इस सूत्र में स्वाभाविक और व्यापक है।
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: और अपने सारे प्राण से
  rationale: נֶפֶשׁ के अर्थ-क्षेत्र में प्राण, जीवन, स्वयं और संपूर्ण अस्तित्व आते हैं। ‘प्राण’ पारंपरिक युग्म को बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। उसे ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी पाठकों के लिए परिचित नामरूप ‘यहोवा’ रखा गया; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: וְשַׁבְתָּ में लौटने और पश्चात्ताप का संबंध
  choice: लौटोगे
  alternative: पश्चात्ताप करोगे
  rationale: वाचा के प्रसंग में लौटना पश्चात्ताप को समाहित कर सकता है, पर मूल शब्द ठोस ‘वापस लौटने’ की भाषा रखता है; इसलिए theological implication को संकीर्ण शब्द से निर्णीत नहीं किया गया।
- issue: בָנֶיךָ का दायरा
  choice: तुम्हारे बच्चे
  alternative: तुम्हारे पुत्र
  rationale: पुल्लिंग बहुवचन यहाँ वंशजों/संतानों के लिए सामान्य रूप से प्रयुक्त हो सकता है। ‘बच्चे’ संभावित समावेशी दायरे को रखता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: נֶפֶשׁ की मानव-स्वरूप संबंधी व्यापकता
  choice: प्राण
  alternative: सम्पूर्ण अस्तित्व / जीवन
  rationale: ‘प्राण’ सूत्रगत और परिचित है, पर נֶפֶשׁ को शरीर से पृथक किसी तकनीकी तत्त्व तक सीमित नहीं किया गया; पादटिप्पणी उसके ‘जीवन/सम्पूर्ण अस्तित्व’ अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन ‘तुम’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। वाक्य की पुनरुक्त संरचना और ‘मन/प्राण’ का वाचागत सूत्र सुरक्षित रखा गया है; डैश लम्बे वाक्य में आज्ञा की सीमा और कर्ताओं को स्पष्ट करता है।
