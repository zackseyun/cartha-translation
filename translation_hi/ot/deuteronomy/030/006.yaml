base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: hi
  text: और यहोवा तुम्हारा परमेश्वर तुम्हारे हृदय और तुम्हारे वंशजों के हृदयों का खतना करेगा[a], ताकि तुम यहोवा अपने परमेश्वर से अपने सारे हृदय और अपने सारे प्राण से प्रेम करो[b], ताकि तुम जीवित रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हृदय का खतना’ भीतरी परिवर्तन और वाचा के प्रति समर्पण का रूपक है।
    reason: cultural_note
  - marker: b
    text: ‘प्राण’ का अर्थ यहाँ ‘जीवन’ या ‘सम्पूर्ण अस्तित्व’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָל
  choice: खतना करेगा
  rationale: क्रिया मूलतः खतना करने को दर्शाती है। हृदय इसका कर्म होने के कारण प्रयोग रूपकात्मक है, फिर भी वाचा-चिह्न की मूल छवि को मुख्य पाठ में बनाए रखना आवश्यक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत नाम के लिए यह सुविज्ञ और स्वाभाविक रूप है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: לְבָבְךָ
  choice: तुम्हारे हृदय
  rationale: यहाँ हृदय भीतरी मनुष्य, इच्छा और लगाव को दर्शाता है। ‘हृदय’ हिन्दी में इस व्यापक अर्थ और मूल रूपक दोनों को सुरक्षित रखता है।
- source_word: לְבַב זַרְעֶךָ
  choice: तुम्हारे वंशजों के हृदय
  rationale: זֶרַע सामूहिक अर्थ में संतान अथवा वंशजों को दर्शा सकता है। ‘वंशजों’ से पीढ़ीगत आशय आधुनिक हिन्दी में स्पष्ट होता है, जबकि ‘हृदय’ का एकवचन सामूहिक अभिव्यक्ति को बनाए रखता है।
- source_word: לְאַהֲבָה
  choice: ताकि ... प्रेम करो
  rationale: ל के साथ यह infinitive यहाँ उद्देश्य अथवा परिणाम बताता है; ‘ताकि’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל לְבָבְךָ
  choice: अपने सारे हृदय से
  rationale: यह सम्पूर्ण भीतरी निष्ठा की वाचागत माँग को स्वाभाविक और परिचित हिन्दी में व्यक्त करता है।
- source_word: וּבְכָל נַפְשְׁךָ
  choice: अपने सारे प्राण से
  rationale: נֶפֶשׁ जीवन, स्वयं या प्राण को सूचित कर सकता है। ‘प्राण’ इस व्यवस्थाविवरणीय युग्म में परिचित है और सम्पूर्ण जीवित व्यक्तित्व के भाव को बनाए रखता है।
- source_word: לְמַעַן חַיֶּיךָ
  choice: और जीवित रहो
  rationale: לְמַעַן उद्देश्य अथवा परिणाम सूचित करता है। हिन्दी में ‘और जीवित रहो’ पूर्ववर्ती ‘ताकि’ के अंतर्गत अंतिम उद्देश्य को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: हृदय के खतने की रूपकात्मक वाचा-भाषा
  choice: मुख्य पाठ में ‘हृदय ... का खतना करेगा’ रूपक रखा गया।
  alternative: तुम्हारा हृदय बदल देगा / तुम्हारे हृदय को शुद्ध करेगा
  rationale: मूल पाठ बाहरी वाचा-चिह्न की छवि से परमेश्वर द्वारा किए जाने वाले भीतरी परिवर्तन और निष्ठा को व्यक्त करता है। व्याख्यात्मक प्रतिस्थापन उस संबंध को मिटा देता, इसलिए अर्थ को पादटिप्पणी में समझाया गया है।
- issue: נֶפֶשׁ का अर्थ
  choice: प्राण
  alternative: जीवन / सम्पूर्ण अस्तित्व
  rationale: शब्द केवल शरीर से अलग किसी तत्व को अनिवार्यतः निर्दिष्ट नहीं करता, बल्कि पूरे जीवित व्यक्ति को भी दर्शा सकता है। ‘प्राण’ पारंपरिक अनुगूँज बनाए रखता है और पादटिप्पणी व्यापक अर्थ स्पष्ट करती है।
- issue: ईश्वरीय कार्य और मानवीय प्रेम का संबंध
  choice: ‘ताकि ... प्रेम करो’ द्वारा उद्देश्य/परिणाम का संबंध सुरक्षित रखा गया।
  alternative: और तब तुम प्रेम करोगे
  rationale: हिब्रू में infinitive उद्देश्य या परिणाम दोनों की निकटता रख सकता है। अनुवाद परमेश्वर के भीतरी कार्य को प्रेम की ओर उन्मुख दिखाता है, पर किसी विस्तृत सिद्धान्तगत क्रम को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खतना’ जैसे स्पष्ट वाचागत रूपक को सरल व्याख्या से प्रतिस्थापित नहीं किया गया। एकवचन ‘तुम’ के अर्थ को क्रियाओं और संबंधसूचक रूपों में बनाए रखा गया है।
