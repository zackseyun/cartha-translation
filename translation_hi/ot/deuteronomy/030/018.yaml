source:
  edition: WLC
  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: hi
  text: मैं आज तुम लोगों से यह घोषणा करता हूँ कि तुम निश्चय ही नष्ट हो जाओगे[a][c]; जिस भूमि में प्रवेश करने और उसे अपने अधिकार में लेने के लिए तुम यरदन पार कर रहे हो, उस भूमि पर तुम्हारे दिन लंबे नहीं होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “नष्ट होते हुए नष्ट हो जाओगे” है; यह रचना विनाश की निश्चितता पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात “तुम उस भूमि पर बहुत दिनों तक जीवित नहीं रहोगे।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में आरंभिक “तुम लोगों से” बहुवचन है, लेकिन इसके बाद इस्राएल को एक ही वाचा-समुदाय मानकर एकवचन “तुम” से संबोधित किया गया है। हिन्दी में यह व्याकरणिक बदलाव स्पष्ट दिखाई नहीं देता।
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי
  choice: मैं ... घोषणा करता हूँ
  rationale: נגד के हिफ़ील रूप का अर्थ किसी बात को प्रकट करना या घोषित करना है। यहाँ “घोषणा करता हूँ” चेतावनी की गंभीर और औपचारिक शक्ति को बनाए रखता है।
- source_word: לָכֶם
  choice: तुम लोगों से
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन है। “तुम लोगों से” आरंभिक बहुवचन संबोधन को स्पष्ट करता है और आगे आने वाले सामूहिक एकवचन से उसके व्याकरणिक अंतर को पहचानने में सहायक है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और वाचा-संबंधी चेतावनी की तात्कालिकता बनाए रखती है।
- source_word: כִּי
  choice: कि
  rationale: यह घोषणा की विषय-वस्तु प्रस्तुत करता है; हिन्दी में “कि” इसका स्वाभाविक संयोजक है।
- source_word: אָבֹד תֹּאבֵדוּן
  choice: निश्चय ही नष्ट हो जाओगे
  rationale: क्रिया के साथ उसी धातु का infinitive absolute विनाश की निश्चितता पर बल देता है। “निश्चय ही” उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: तुम्हारे दिन लंबे नहीं होंगे
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘दिन लंबे करना’ है। चुना हुआ रूप उस वाचा-संबंधी मुहावरे को बनाए रखते हुए हिन्दी में सहज है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: व्यवस्थाविवरण के इस प्रसंग में אֲדָמָה मिट्टी मात्र नहीं, यरदन के पार की प्रतिज्ञात भूमि को सूचित करता है। “भूमि” इसी क्षेत्रीय अर्थ को व्यक्त करता है।
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת־הַיַּרְדֵּן
  choice: जिस भूमि ... के लिए तुम यरदन पार कर रहे हो
  rationale: वर्तमान कृदंत निकट और चल रही गति को दर्शाता है। हिन्दी का “पार कर रहे हो” इसे स्वाभाविक रूप से व्यक्त करता है; इब्रानी का אַתָּה सामूहिक एकवचन में इस्राएल को संबोधित करता है।
- source_word: לָבֹא שָׁמָּה
  choice: जिस भूमि में प्रवेश करने
  rationale: בוא और שָׁמָּה उस स्थान के भीतर जाने का भाव देते हैं। सम्बन्धवाचक हिन्दी रचना में “जिस भूमि में प्रवेश करने” ‘वहाँ’ के स्थान-सूचक भाव को बिना असहज पुनरावृत्ति के स्पष्ट करती है।
- source_word: לְרִשְׁתָּהּ
  choice: और उस पर अधिकार करने
  rationale: ירש भूमि-संबंधी संदर्भ में उसे अपने अधिकार में लेने या उस पर अधिकार करने का अर्थ देता है। स्त्रीलिंग प्रत्यय का संदर्भ भूमि से है, जिसे “उस पर” स्पष्ट रखता है।
theological_decisions:
- issue: इस्राएल के लिए बहुवचन से सामूहिक एकवचन में बदलाव
  choice: मुख्य पाठ में स्वाभाविक हिन्दी संबोधन रखा और व्याकरणिक बदलाव को पादटिप्पणी में स्पष्ट किया
  alternative: पूरे पद को केवल बहुवचन मानकर प्रस्तुत करना, या कृत्रिम रूप से एकवचन ‘तू’ का प्रयोग करना
  rationale: इब्रानी में आरंभ का לָכֶם बहुवचन है, पर आगे אַתָּה और संबंधित क्रियारूप इस्राएल को एक वाचा-समुदाय मानकर एकवचन में संबोधित करते हैं। आधुनिक हिन्दी में ‘तू’ अनावश्यक रूप से अशिष्ट या अत्यधिक व्यक्तिगत लग सकता है, जबकि ‘तुम’ संख्या का अंतर स्पष्ट नहीं करता; इसलिए पादटिप्पणी स्रोत की शैली को सुरक्षित रखती है।
- issue: प्रतिज्ञात भूमि की शब्दावली
  choice: הָאֲדָמָה का अनुवाद “भूमि”
  alternative: “ज़मीन” या “धरती”
  rationale: यहाँ संकेत यरदन के पार उस क्षेत्र से है जिसमें इस्राएल प्रवेश करके अधिकार करेगा। “भूमि” कथा और वाचा, दोनों के संदर्भ को गरिमापूर्ण और स्पष्ट रूप में बनाए रखती है।
- issue: विनाश की चेतावनी की निश्चितता
  choice: “निश्चय ही नष्ट हो जाओगे”
  alternative: “नष्ट होते हुए नष्ट हो जाओगे”
  rationale: इब्रानी की दोहरावयुक्त रचना बल और निश्चितता व्यक्त करती है, किसी अलग प्रकार के दोहरे विनाश की शिक्षा नहीं। “निश्चय ही” अर्थगत बल को बनाए रखता है और कृत्रिम हिन्दी से बचता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। “घोषणा,” “भूमि,” और “अधिकार” वाचा-संबंधी संदर्भ की गरिमा बनाए रखते हैं। वाक्य-क्रम को हिन्दी की स्वाभाविक सम्बन्धवाचक रचना के अनुसार ढाला गया है, जबकि शָׁמָּה के स्थान-सूचक भाव और לְרִשְׁתָּהּ के सर्वनाम-संदर्भ को स्पष्ट रखा गया है।
