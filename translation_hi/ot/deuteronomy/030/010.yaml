base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: hi
  text: यदि तुम अपने परमेश्वर यहोवा की बात मानो[a], और उसकी आज्ञाओं तथा विधियों का पालन करो, जो इस व्यवस्था की पुस्तक में लिखी हैं, और यदि तुम अपने सारे मन और अपने सारे प्राण से अपने परमेश्वर यहोवा की ओर लौट आओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने परमेश्वर यहोवा की आवाज़ सुनो”; इस इब्रानी मुहावरे का अर्थ उसकी कही हुई बात पर ध्यान देना और उसे मानना है।
    reason: lexical_alternative
  - marker: b
    text: या “की ओर फिर जाओ” अथवा “की ओर मन फिराओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: दोनों बार यह शब्द पिछले वादे से जुड़ी शर्त प्रस्तुत करता है; इसलिए कारणसूचक अनुवाद के बजाय ‘यदि’ उपयुक्त है।
- source_word: תִשְׁמַע בְּקוֹל
  choice: की बात मानो
  rationale: यह इब्रानी मुहावरा केवल आवाज़ सुनने नहीं, बल्कि कही हुई बात पर ध्यान देकर उसका पालन करने का अर्थ देता है। स्वाभाविक हिन्दी में ‘की बात मानना’ इस आशय को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: לִשְׁמֹר
  choice: पालन करो
  rationale: यह आज्ञाओं और विधियों को मानने के द्वारा यहोवा की बात मानने का आशय स्पष्ट करता है।
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: उसकी आज्ञाओं तथा विधियों
  rationale: ‘आज्ञाएँ’ आदेशों और ‘विधियाँ’ स्थापित वैधानिक नियमों के भेद को यथासंभव बनाए रखती हैं।
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: इस व्यवस्था की पुस्तक में
  rationale: यह वाचा-संबंधी लिखित दस्तावेज़ के लिए स्वाभाविक और पारंपरिक हिन्दी अभिव्यक्ति है।
- source_word: כִּי תָשׁוּב
  choice: और यदि ... लौट आओ
  rationale: दूसरा כִּי समानांतर शर्त रखता है। שׁוּב के मूल लौटने के रूपक और उसके वाचा-संबंधी पश्चात्ताप के संकेत, दोनों को ‘लौट आओ’ बनाए रखता है।
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: अपने सारे मन और अपने सारे प्राण से
  rationale: यह पूरे भीतरी व्यक्तित्व और जीवन से समर्पित होकर लौटने का इब्रानी भाव गरिमापूर्ण तथा परिचित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा के संदर्भ में שׁוּב का अर्थ
  choice: लौट आओ
  alternative: फिर जाओ; मन फिराओ; पश्चात्ताप करो
  rationale: ‘लौट आओ’ मूल दिशात्मक रूपक को बचाता है और पश्चात्ताप के धार्मिक आशय को न तो मिटाता है, न ही व्याख्यात्मक शब्द से पूरी तरह निर्धारित करता है।
- issue: परमेश्वर के नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। एकवचन संबोधन के लिए ‘तुम’ रखा गया है। पद अपने आप में पिछले वाक्य पर निर्भर शर्त है, इसलिए अंत में पूर्णविराम होने पर भी आरंभ ‘यदि’ से किया गया है।
