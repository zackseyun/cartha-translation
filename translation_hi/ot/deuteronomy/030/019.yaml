source:
  edition: WLC
  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: hi
  text: 'मैं आज आकाश और पृथ्वी को तुम्हारे विरुद्ध साक्षी ठहराता हूँ: मैंने तुम्हारे सामने जीवन और मृत्यु, आशीष और शाप रखे हैं। और जीवन को चुनो, ताकि तुम और तुम्हारी संतान जीवित रहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: तुम्हारे विरुद्ध साक्षी ठहराता हूँ
  rationale: हिफ़ील रूप और בָכֶם यहाँ वाचा-संबंधी न्यायिक प्रसंग में साक्षियों को किसी के विरुद्ध खड़ा करने का भाव देते हैं। यह सामान्य चेतावनी की अपेक्षा मूल का कानूनी स्वर बेहतर बनाए रखता है।
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह समूची सृष्टि को समेटने वाला प्रचलित युग्म और वाचा के साक्षियों का सूत्र है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: जीवन और मृत्यु
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा वाचा के परस्पर विपरीत परिणामों को व्यक्त करता है।
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: तुम्हारे सामने ... रखे हैं
  rationale: נתן के साथ לפני यहाँ विकल्पों को किसी के सामने प्रस्तुत करने का अर्थ देता है। हिन्दी पूर्ण पक्ष मूल के पूर्ण क्रियारूप को सहजता से व्यक्त करता है।
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: आशीष और शाप
  rationale: यह वाचा-संबंधी विपरीत युग्म का संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी रूप है।
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: इसलिए जीवन को चुनो
  rationale: व्याकरणतः क्रिया पूर्णरूप है, पर इस प्रसंग में उसका स्पष्ट आज्ञार्थक/उपदेशात्मक बल है। आरंभिक ו पिछले विकल्पों से निष्कर्षात्मक संबंध जोड़ता है, जिसे 'इसलिए' स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמַעַן תִּחְיֶה
  choice: ताकि ... जीवित रहें
  rationale: למען के उद्देश्य अथवा अपेक्षित परिणाम के भाव को 'ताकि' स्पष्ट रूप से बनाए रखता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: אַתָּה וְזַרְעֶךָ
  choice: तुम और तुम्हारी संतान
  rationale: זֶרַע का सामूहिक अर्थ संतान अथवा वंशज है। 'संतान' मूल की पारिवारिक निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: वाचा-संबंधी न्यायिक साक्ष्य
  choice: आकाश और पृथ्वी को तुम्हारे विरुद्ध साक्षी ठहराता हूँ
  alternative: मैं आज तुम्हें चेतावनी देता हूँ
  rationale: मूल पाठ केवल सामान्य चेतावनी नहीं देता, बल्कि वाचा के न्यायिक परिवेश में आकाश और पृथ्वी को साक्षी बनाता है। चयन मूल के गंभीर न्यायिक स्वर को सुरक्षित रखता है।
- issue: द्वितीय पुरुष एकवचन का प्रतिनिधिक प्रयोग
  choice: एकवचन 'तुम्हारे/तुम' रखते हुए 'तुम्हारी संतान' जोड़ा गया
  alternative: तुम सब और तुम्हारे वंशज
  rationale: इब्रानी में संबोधन पुल्लिंग एकवचन है और इस्राएल को वाचा-पक्ष के रूप में प्रतिनिधिक ढंग से संबोधित करता है। हिन्दी 'तुम' इस रूप को बिना अनावश्यक बहुवचन विस्तार के बनाए रखता है।
- issue: וּבָחַרְתָּ का उपदेशात्मक बल
  choice: इसलिए जीवन को चुनो
  alternative: और तुम जीवन चुनोगे
  rationale: आसपास के उपदेशात्मक संदर्भ में पूर्ण क्रियारूप आदेश/आग्रह का कार्य करता है। 'चुनो' इस बल को रखता है; 'इसलिए' संयोजक के प्रसंगगत निष्कर्षात्मक संबंध को स्पष्ट करता है, पर कोई अतिरिक्त धर्मसिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। न्यायिक-वाचा संबंधी स्वर को 'विरुद्ध साक्षी ठहराता हूँ' से संरक्षित किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि 'आकाश और पृथ्वी' तथा 'संतान' मूल अर्थ को पर्याप्त स्पष्टता से व्यक्त करते हैं।
