base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: hi
  text: अपने परमेश्वर यहोवा से प्रेम करने, उसकी आवाज़ सुनने[a] और उससे दृढ़ता से जुड़े रहने[b] के द्वारा; क्योंकि वही तुम्हारा जीवन और तुम्हारे दिनों की दीर्घता है, ताकि तुम उस देश में बसे रहो जिसे यहोवा ने तुम्हारे पितरों[c]—अब्राहम, इसहाक और याकूब—को देने की शपथ खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी बात मानने”; इब्रानी मुहावरा “उसकी आवाज़ सुनना” प्रायः ध्यान देने और आज्ञा मानने का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उससे लिपटे रहने” या “उससे चिपके रहने।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “पितरों”; आगे अब्राहम, इसहाक और याकूब के नाम दिए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: प्रेम करने के द्वारा
  rationale: लामेदयुक्त क्रियारूप पिछले पद के ‘जीवन को चुन’ कथन को साधन या व्याख्या के रूप में आगे बढ़ाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को दर्शाता है।
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: उसकी बात सुनने
  rationale: इब्रानी मुहावरे की श्रवण-छवि बनाए रखता है, जबकि प्रसंग में मानने और आज्ञापालन का भाव भी निहित है।
- source_word: וּלְדָבְקָה בוֹ
  choice: और उससे लिपटे रहने
  rationale: דבק निकट, दृढ़ और निरंतर लगाव व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए वाचा-निष्ठा की तीव्रता बनाए रखता है।
- source_word: כִּי הוּא חַיֶּיךָ
  choice: क्योंकि वही तुम्हारा जीवन है
  rationale: सर्वनाम का सबसे स्वाभाविक संदर्भ यहोवा स्वयं है; ‘वही’ व्यक्तिगत संदर्भ और बल दोनों स्पष्ट करता है।
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: और तुम्हारे दिनों की दीर्घता
  rationale: इब्रानी अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है और केवल ‘लंबी आयु’ कहकर अर्थ को अनावश्यक रूप से समतल नहीं करता।
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: ताकि तुम उस देश में बसे रहो
  rationale: क्रियारूप का प्रयोजन/परिणामगत संबंध व्यक्त होता है; ‘बसे रहो’ निवास की निरंतरता और प्रतिज्ञात देश के संदर्भ के अनुकूल है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पूर्वजों
  rationale: आधुनिक हिन्दी में स्वाभाविक सामूहिक पद है; अगले शब्द तत्काल स्पष्ट कर देते हैं कि अभिप्रेत पूर्वज अब्राहम, इसहाक और याकूब हैं।
- source_word: לָתֵת לָהֶם
  choice: उन्हें देने
  rationale: इब्रानी के स्पष्ट बहुवचन परोक्ष कर्म को बनाए रखता है और प्रतिज्ञा उन नामित पूर्वजों को दिए जाने का भाव सुरक्षित करता है।
theological_decisions:
- issue: כִּי הוּא חַיֶּיךָ में ‘वह’ का संदर्भ
  choice: 'सर्वनाम यहोवा स्वयं को संदर्भित करता है: ‘वही तुम्हारा जीवन है।’'
  alternative: यह सर्वनाम व्यापक रूप से पूर्ववर्ती वाचा-आज्ञापालन के मार्ग को संदर्भित कर सकता है।
  rationale: निकटतम और सबसे प्रमुख पूर्वपद ‘तुम्हारा परमेश्वर यहोवा’ है; व्याकरण और व्यवस्थाविवरण की धर्मवैचारिक भाषा व्यक्तिगत संदर्भ को अधिक समर्थित करती है, यद्यपि आज्ञापालन का मार्ग अवधारणात्मक रूप से जीवन से जुड़ा है।
- issue: प्रतिज्ञात देश किसे देने की शपथ खाई गई
  choice: ‘अब्राहम, इसहाक और याकूब—को देने’ द्वारा לָהֶם का बहुवचन संदर्भ उन्हीं पूर्वजों से रखा गया है।
  alternative: हिन्दी में इसे ‘उनके वंशजों को देने’ के रूप में व्याख्यात्मक बनाया जा सकता था।
  rationale: मूल पाठ स्पष्ट रूप से ‘उन्हें’ कहता है; वंशजों को प्रत्यक्ष ऐतिहासिक प्राप्ति मानकर सर्वनाम को बदलना पाठ की वाचा-संबंधी अभिव्यक्ति को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। एकवचन पुल्लिंग संबोधन मूल के 2ms रूप के अनुरूप है। ‘देश’ प्रतिज्ञात भूभाग के अर्थ में, ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम के लिए, और ‘बसे रहो’ दीर्घकालीन निवास के भाव के लिए चुना गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
