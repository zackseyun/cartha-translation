source:
  edition: WLC
  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: hi
  text: और तुम लौटोगे[a], और यहोवा की वाणी सुनोगे[b], और उसकी सभी आज्ञाओं का पालन करोगे जो मैं आज तुम्हें दे रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वापस मुड़ोगे”; प्रसंग में इसका अर्थ वाचा की ओर लौटना और पश्चाताप करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “यहोवा की वाणी सुनोगे”; यह मुहावरा प्रायः उसकी आज्ञा मानने का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: लौटोगे
  rationale: שׁוּב का मूल अर्थ ‘लौटना/वापस मुड़ना’ है। ‘लौटोगे’ शारीरिक वापसी और वाचा की ओर लौटने—दोनों संभावित भावों को बनाए रखता है।
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: यहोवा की वाणी सुनोगे
  rationale: यह इब्रानी मुहावरे की संरचना को सुरक्षित रखता है; प्रसंग में सुनने का अर्थ आज्ञा मानना भी है, जिसे अगला उपवाक्य स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की प्रचलित लिप्यंतरण-परंपरा के अनुसार ‘यहोवा’ रखा गया है, शीर्षक से प्रतिस्थापित नहीं किया गया।
- source_word: וְעָשִׂיתָ אֶת כָּל מִצְוֺתָיו
  choice: उसकी उन सभी आज्ञाओं का पालन करोगे
  rationale: शाब्दिक ‘करोगे’ हिन्दी में आज्ञाओं के साथ कुछ अस्वाभाविक है; ‘पालन करोगे’ עשה के व्यावहारिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है। ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य को सहजता से जोड़ता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जो मैं आज तुम्हें दे रहा हूँ
  rationale: आज्ञा ‘देना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है। वर्तमान प्रगतिशील रूप इब्रानी कृदंत की तत्काल और जारी क्रिया को दर्शाता है, तथा ‘आज’ को सुरक्षित रखता है।
- source_word: וְאַתָּה
  choice: और तुम
  rationale: स्पष्ट सर्वनाम का बल तथा आरंभिक संयोजक दोनों बनाए गए हैं।
theological_decisions:
- issue: क्या שׁוּב को स्पष्ट रूप से ‘पश्चाताप करना’ कहा जाए
  choice: लौटोगे
  alternative: मन फिराओगे / वापस मुड़ोगे
  rationale: यहाँ शब्द में भौतिक वापसी, वाचा की ओर लौटना और पश्चाताप—सभी की प्रतिध्वनि हो सकती है। ‘लौटोगे’ इस अर्थ-व्याप्ति और धार्मिक तनाव को संकुचित नहीं करता।
- issue: क्या שׁמע בְּקוֹל का अनुवाद सीधे ‘आज्ञा मानना’ किया जाए
  choice: यहोवा की वाणी सुनोगे
  alternative: यहोवा की आज्ञा मानोगे
  rationale: मुहावरे में आज्ञापालन निहित है, पर अगला खंड आज्ञाओं के पालन को अलग से व्यक्त करता है। इसलिए वाणी सुनने की इब्रानी छवि बनाए रखने से दोनों संबद्ध अभिव्यक्तियाँ एक में नहीं मिलतीं।
- issue: प्रतिज्ञा अथवा आदेश का भाव
  choice: लौटोगे… सुनोगे… पालन करोगे
  alternative: लौटो… सुनो… पालन करो
  rationale: इब्रानी पूर्ण क्रियारूप इस संदर्भ में भविष्यसूचक/परिणामी कथन के रूप में स्वाभाविक हैं; इन्हें प्रत्यक्ष आज्ञार्थक में बदलना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। ‘वाणी’ ने मूल की श्रव्य छवि और धार्मिक गरिमा को रखा है, जबकि ‘आज्ञाओं का पालन’ सामान्य हिन्दी में स्पष्ट और स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद रखे गए हैं।
