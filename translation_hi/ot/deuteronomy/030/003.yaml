source:
  edition: WLC
  text: וְ/שָׁ֨ב יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת שְׁבוּתְ/ךָ֖ וְ/רִחֲמֶ֑/ךָ וְ/שָׁ֗ב וְ/קִבֶּצְ/ךָ֙ מִ/כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: hi
  text: तब तुम्हारा परमेश्वर यहोवा तुम्हारी दशा बहाल करेगा[a] और तुम पर दया करेगा; वह तुम्हें उन सब जातियों[b] में से फिर[c] इकट्ठा करेगा, जहाँ तुम्हारे परमेश्वर यहोवा ने तुम्हें तितर-बितर कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम्हारी बन्धुआई लौटाएगा”; यह इब्रानी मुहावरा विपत्ति या निर्वासन की दशा को पलटकर बहाल करने के अर्थ में प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों।”
    reason: lexical_alternative
  - marker: c
    text: “फिर इकट्ठा करेगा” का अनुवाद “लौटेगा और तुम्हें इकट्ठा करेगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में वाचा के व्यक्तिगत ईश्वरीय नाम का प्रचलित और सहज रूप; इसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- source_word: וְשָׁב ... אֶת שְׁבוּתְךָ
  choice: तुम्हारी दशा फिर से सुधारेगा
  rationale: यह इब्रानी मुहावरा विपत्ति अथवा निर्वासन की स्थिति पलटकर बहाली करने का भाव देता है। शाब्दिक ‘तुम्हारी बन्धुआई लौटाएगा’ आधुनिक हिन्दी में भ्रामक हो सकता है, जबकि अगले खंड में लोगों को इकट्ठा करने की बात अलग से कही गई है।
- source_word: וְרִחֲמֶךָ
  choice: तुम पर दया करेगा
  rationale: רחם की करुणामय दया को सरल, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: वह तुम्हें ... फिर इकट्ठा करेगा
  rationale: दूसरे שָׁב को ‘फिर/दोबारा’ के अर्थ में अगले क्रियापद के साथ ग्रहण किया गया है; इससे पुनः एकत्र किए जाने का भाव स्पष्ट रहता है। पृथक क्रिया ‘वह लौटेगा और इकट्ठा करेगा’ भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: מִכָּל הָעַמִּים
  choice: उन सब जातियों में से
  rationale: עַמִּים यहाँ विभिन्न जनसमूहों या राष्ट्रों को दर्शा सकता है। ‘जातियों’ हिन्दी बाइबलीय प्रयोग में इस बहुवचन सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֱפִיצְךָ
  choice: तितर-बितर कर दिया था
  rationale: हिफ़ील रूप द्वारा किसी को विभिन्न स्थानों में बिखेर देने का भाव है; ‘तितर-बितर’ निर्वासन-संदर्भ में स्पष्ट और सहज है।
- source_word: שָׁמָּה
  choice: जहाँ
  rationale: शाब्दिक अर्थ ‘वहाँ’ है, पर संबंधवाचक वाक्य में हिन्दी का ‘जहाँ’ उसी स्थानवाचक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת मुहावरे का आशय
  choice: तुम्हारी दशा फिर से सुधारेगा
  alternative: तुम्हारी बन्धुआई लौटाएगा; तुम्हें बन्धुआई से बहाल करेगा
  rationale: पाठ पहले संकटपूर्ण दशा की बहाली और फिर निर्वासित लोगों के वास्तविक पुनःएकत्रीकरण को बताता है। चुना हुआ अनुवाद दोनों कथनों का अंतर बनाए रखते हुए मुहावरे का व्यापक बहाली-संबंधी अर्थ देता है।
- issue: दूसरे וְשָׁב का व्याकरणिक बल
  choice: फिर इकट्ठा करेगा
  alternative: लौटेगा और तुम्हें इकट्ठा करेगा
  rationale: इब्रानी को ‘फिर से’ के क्रियाविशेषणीय भाव में अथवा अलग क्रिया ‘लौटना’ के रूप में पढ़ा जा सकता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘तुम्हारा/तुम्हें’ मूल के एकवचन सामूहिक संबोधन को बनाए रखता है। पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
