source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे के लिए ऐसा न करना,[a] क्योंकि उन्होंने अपने देवताओं के लिए वे सभी घिनौने काम किए हैं जिनसे याहवे घृणा करता है। यहाँ तक कि वे अपने देवताओं के लिए अपने बेटों और बेटियों को आग में जला देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार ढंग से, “तुम अपने परमेश्वर याहवे की उपासना उस तरह न करना।”
    reason: मूल इब्रानी में ‘ऐसा’ निषिद्ध उपासना-पद्धति की ओर संकेत करता है; यह विकल्प उस प्रसंग को स्पष्ट करता है, जबकि मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן לַיהוָה אֱלֹהֶיךָ
  choice: तुम अपने परमेश्वर याहवे की उपासना उस तरह न करना
  rationale: शाब्दिक रूप से वाक्यांश का अर्थ ‘अपने परमेश्वर याहवे के लिए ऐसा न करना’ है। पिछले पदों के उपासना-संबंधी संदर्भ को स्पष्ट करते हुए ‘उपासना उस तरह न करना’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है। एकवचन ‘तुम’ इब्रानी के वाचिक एकवचन संबोधन को बनाए रखता है।
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: वे सारे घिनौने काम ... जिनसे याहवे घृणा करता है
  rationale: תּוֹעֵבָה की प्रबल नैतिक और धार्मिक तीव्रता को ‘घिनौने काम’ तथा שָׂנֵא को ‘घृणा करता है’ से व्यक्त किया गया है। इब्रानी रचना में संबंधसूचक अर्थ है; हिन्दी में संबंधवाचक उपवाक्य उस आशय को स्पष्ट और स्वाभाविक ढंग से पहुँचाता है।
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: उन्होंने अपने देवताओं के लिए ... किए हैं
  rationale: पूर्ण क्रिया उन लोगों की स्थापित प्रथाओं को बताती है। ‘के लिए’ ל की आराधनात्मक दिशा या समर्पण को व्यक्त करता है।
- source_word: כִּי גַם
  choice: यहाँ तक कि ... भी
  rationale: यह संयोजन अगले उदाहरण की चौंकाने वाली चरम सीमा पर बल देता है और हिन्दी में कारणात्मक विवरण के भीतर स्वाभाविक है।
- source_word: אֶת־בְּנֵיהֶם וְאֶת־בְּנֹתֵיהֶם
  choice: अपने बेटे-बेटियों को
  rationale: मूल पाठ में पुत्र और पुत्रियाँ दोनों स्पष्ट रूप से उल्लिखित हैं; संयुक्त हिन्दी रूप उसी विशिष्टता को संक्षेप और स्वाभाविकता से बनाए रखता है।
- source_word: יִשְׂרְפוּ בָאֵשׁ לֵאלֹהֵיהֶם
  choice: अपने देवताओं के लिए आग में जला देते हैं
  rationale: अपूर्ण क्रिया यहाँ उनकी प्रचलित रीति बताती है, इसलिए सामान्य वर्तमान ‘जला देते हैं’ उपयुक्त है। ‘आग में’ वास्तविक दहन तथा ‘देवताओं के लिए’ उसके आराधनात्मक उद्देश्य को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका नामरूप बनाए रखता है, उसे उपाधि में नहीं बदलता।
- issue: תּוֹעֵבָה और שָׂנֵא की नैतिक तीव्रता
  choice: घिनौने काम; घृणा करता है
  alternative: अप्रिय काम; नापसंद करता है
  rationale: मूल शब्द अत्यंत प्रबल दैवी मूल्यांकन व्यक्त करते हैं। नरम विकल्प पाठ की नैतिक और धार्मिक तीव्रता घटा देंगे।
- issue: לַיהוָה के संदर्भ में निषिद्ध कार्य
  choice: याहवे की उपासना उस तरह न करना
  alternative: याहवे के लिए ऐसा न करना
  rationale: पिछले संदर्भ में ‘ऐसा’ अन्य जातियों की उपासना-पद्धतियों की ओर संकेत करता है। मुख्य पाठ इसे स्पष्ट करता है, जबकि इब्रानी की संक्षिप्त अभिव्यक्ति पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सीधी, गंभीर और सार्वजनिक पाठ के योग्य। ‘उपासना’, ‘घिनौने’ और ‘घृणा’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की धार्मिक तथा नैतिक गंभीरता बनाए रखते हैं।
