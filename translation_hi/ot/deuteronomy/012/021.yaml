source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: hi
  text: यदि वह स्थान, जिसे तुम्हारा परमेश्वर याहवे वहाँ अपना नाम रखने के लिए चुनेगा, तुमसे बहुत दूर हो, तो तुम अपने गाय-बैलों और भेड़-बकरियों में से, जिन्हें याहवे ने तुम्हें दिया है, जैसा मैंने तुम्हें आज्ञा दी है वैसा वध कर सकते हो; और अपने नगरों में[a] जी भरकर[b] खा सकते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने फाटकों के भीतर”; यहाँ इसका अर्थ अपने नगरों या बस्तियों में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने प्राण की सारी इच्छा के अनुसार”; अर्थात अपनी इच्छा या भूख के अनुसार।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: यदि ... तुमसे बहुत दूर हो
  rationale: כִּי यहाँ कानूनी शर्त प्रस्तुत करता है और רחק दूरी को व्यक्त करता है। हिन्दी में यह वाक्यांश शर्त और व्यावहारिक कठिनाई दोनों को स्वाभाविक रूप से बताता है।
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: वह स्थान, जिसे ... चुनेगा
  rationale: व्यवस्थाविवरण की इस विधिक शैली में अपूर्ण क्रिया भावी चुनाव की ओर संकेत कर सकती है; हिन्दी में ‘चुनेगा’ प्रसंग के अनुरूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में उसका लिप्यंतरण रखा गया है।
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: अपना नाम रखने के लिए
  rationale: שׂים का सीधा अर्थ ‘रखना/स्थापित करना’ है। ‘अपना नाम रखने’ से मूल अभिव्यक्ति बनी रहती है और उसमें अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
- source_word: וְזָבַחְתָּ
  choice: वध कर सकते हो
  rationale: इस प्रसंग में क्रिया स्थानीय रूप से भोजन के लिए पशु मारने की अनुमति देती है, न कि स्थानीय बलिदान का निर्देश। ‘वध’ मूल क्रिया को और ‘कर सकते हो’ अनुमति के भाव को व्यक्त करता है।
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: अपने गाय-बैलों और भेड़-बकरियों में से
  rationale: בקר और צאן क्रमशः बड़े और छोटे पालतू पशुओं के सामूहिक वर्ग हैं। हिन्दी में स्पष्टता के लिए दोनों वर्गों के सामान्य पशुओं का उल्लेख किया गया है।
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: मेरी आज्ञा के अनुसार
  rationale: प्रथम पुरुष वक्ता मूसा है। यह अनुवाद पूर्व में दी गई आज्ञा से संबंध बनाए रखता है, पर उसके अनुल्लिखित विवरण को नहीं भरता।
- source_word: בִּשְׁעָרֶיךָ
  choice: अपने नगरों में
  rationale: शाब्दिक अर्थ ‘अपने फाटकों के भीतर’ है, पर यहाँ ‘फाटक’ लक्षणा द्वारा नगरों या बस्तियों को दर्शाता है। मुख्य पाठ में आधुनिक हिन्दी का स्वाभाविक अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: जी भरकर
  rationale: यह मुहावरा ‘अपने प्राण/मन की सारी इच्छा या भूख के अनुसार’ का सहज हिन्दी रूप है और भोजन की इच्छा के प्रसंग को स्पष्ट करता है; मूल चित्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: וְזָבַחְתָּ का बलिदान-संबंधी या सामान्य वध-संबंधी अर्थ
  choice: वध कर सकते हो
  alternative: बलि चढ़ाना / वध करना होगा
  rationale: निकट प्रसंग केंद्रीय पवित्रस्थान से दूरी होने पर स्थानीय भोजन की अनुमति देता है। इसलिए बलिदान का अर्थ लेने से स्थानीय धार्मिक अनुष्ठान का अनुचित संकेत मिलता, जबकि अनुमति का भाव विधिक संदर्भ के अनुकूल है।
- issue: ‘मेरी आज्ञा के अनुसार’ में आदेश की विषयवस्तु
  choice: मूल की अनिर्दिष्टता बनाए रखी गई
  alternative: वध की निश्चित विधि का स्पष्ट उल्लेख
  rationale: पद यह नहीं बताता कि आदेश में कौन-से विशिष्ट नियम सम्मिलित हैं। अतः किसी बाद की परंपरा या विशेष विधि को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगरों में’ और ‘जी भरकर’ जैसे स्वाभाविक हिन्दी रूप मुख्य पाठ में हैं, जबकि मूल इब्रानी के ठोस मुहावरे पादटिप्पणियों में सुरक्षित हैं। एकवचन संबोधन को ‘तुम’ से व्यक्त किया गया है।
