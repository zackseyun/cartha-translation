  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: hi
  text: तुम अपनी होमबलियों का मांस और लहू अपने परमेश्वर यहोवा की वेदी पर चढ़ाओ। तुम्हारे बलिदानों का लहू तुम्हारे परमेश्वर यहोवा की वेदी पर उँडेला जाए, और मांस तुम खाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: चढ़ाना
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर होमबलि के साथ इसका अनुष्ठानिक अर्थ बलि चढ़ाना है। हिंदी में ‘चढ़ाना’ स्वाभाविक और सटीक है।
- source_word: עֹלֹתֶיךָ
  choice: अपने होमबलियों
  rationale: עֹלָה उस बलि का स्थापित पद है जो पूरी तरह वेदी पर जलाई जाती थी। ‘होमबलि’ आधुनिक हिंदी बाइबलीय प्रयोग में संक्षिप्त और परिचित तकनीकी शब्द है।
- source_word: הַבָּשָׂר וְהַדָּם
  choice: मांस और लहू
  rationale: बलिदान-विधि के ठोस शारीरिक संदर्भ को बनाए रखता है; ‘लहू’ इस धार्मिक-विधिक शैली में गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: עַל מִזְבַּח
  choice: वेदी पर
  rationale: עַל का यहाँ स्थानसूचक-अनुष्ठानिक अर्थ है; ‘वेदी पर’ स्वाभाविक हिंदी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְדַם זְבָחֶיךָ
  choice: तुम्हारे बलिदानों का लहू
  rationale: זֶבַח वध करके चढ़ाई जाने वाली बलि का व्यापक पद है। ‘बलिदान’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: יִשָּׁפֵךְ
  choice: उँडेला जाए
  rationale: निफ़अल रूप यहाँ लहू पर की जाने वाली विधिक क्रिया व्यक्त करता है। ‘उँडेला जाए’ कर्मवाच्य और अनुष्ठानिक क्रिया दोनों को बनाए रखता है।
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: और मांस तुम खाना
  rationale: वाव को ‘और’ तथा क्रिया को निर्देशात्मक रूप में रखा गया है। हिंदी का ‘तुम खाना’ कानूनी निर्देश व्यक्त करता है, बिना वाक्य को केवल अनुमति के रूप में सीमित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिंदी के सामान्य पाठक के लिए स्थापित रूप ‘यहोवा’ नाम को नाम के रूप में ही सुरक्षित रखता है, न कि उसे उपाधि में बदलता है।
- issue: अंतिम उपवाक्य וְהַבָּשָׂר תֹּאכֵל का बल
  choice: और मांस तुम खाना
  alternative: पर मांस तुम खा सकते हो
  rationale: मूल में साधारण वाव और अपूर्ण क्रियारूप है, जो इस विधिक संदर्भ में निर्देश दे सकता है। चुना हुआ पाठ उस औपचारिक निर्देश को सुरक्षित रखता है; केवल अनुमतिसूचक अर्थ आरोपित नहीं करता।
- issue: होमबलि के मांस और लहू का वेदी पर चढ़ाया जाना
  choice: दोनों को होमबलि के अंगों के रूप में स्पष्ट रखा
  alternative: वाक्य को सामान्य बलिदानों के मांस के भोजन की अनुमति के साथ मिला देना
  rationale: पहला उपवाक्य होमबलियों के मांस और लहू को वेदी पर रखता है, जबकि दूसरा अन्य बलिदानों के लहू और खाने योग्य मांस का भेद करता है। इस तनाव और संरचना को बिना व्याख्यात्मक समानीकरण के बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक शैली अपनाई गई है। आज्ञार्थक ‘चढ़ाना/खाना’ व्यवस्थाविवरण की निर्देशात्मक वाणी को सहज हिंदी में व्यक्त करता है। वाक्य को दो वाक्यों में बाँटकर पठनीयता बढ़ाई गई है, जबकि इब्रानी की समानांतर संरचना और क्रम सुरक्षित हैं।
