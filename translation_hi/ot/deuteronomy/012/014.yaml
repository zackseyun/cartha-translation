id: DEU.12.14
reference: Deuteronomy 12:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: hi
  text: परन्तु केवल उस स्थान पर, जिसे यहोवा तुम्हारे किसी एक गोत्र में चुनेगा, वहीं तुम अपनी होमबलियाँ चढ़ाओगे, और वहीं वह सब करोगे जिसकी आज्ञा मैं तुम्हें दे रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि केवल
  rationale: पद 13 के निषेध के बाद यह पद एकमात्र अनुमत अपवाद बताता है; ‘बल्कि केवल’ विरोध और विशिष्टता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּמָּקוֹם
  choice: उस स्थान पर
  rationale: निश्चित उपासना-स्थान का संकेत है; हिन्दी में स्थान के साथ ‘पर’ स्वाभाविक है और निश्चितता ‘उस’ से स्पष्ट होती है।
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: जिसे यहोवा ... चुनेगा
  rationale: यिक्तोल रूप यहाँ भावी चुनाव की ओर संकेत करता है; ‘चुनेगा’ उस भावी अर्थ को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: तुम्हारे किसी एक गोत्र में
  rationale: मूल का निकट रूप बनाए रखता है; आशय इस्राएल के किसी एक गोत्र के क्षेत्र के भीतर स्थित स्थान से है।
- source_word: שָׁם
  choice: वहीं
  rationale: दोनों बार स्थान की विशिष्टता और बल बनाए रखने के लिए ‘वहीं’ प्रयोग किया गया है।
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: तुम अपने होमबलि चढ़ाना
  rationale: हिफ़ील क्रिया और עֹלָה का संयुक्त बल बलिदान चढ़ाने का है; ‘होमबलि चढ़ाना’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और संक्षिप्त है।
- source_word: תַּעֲשֶׂה
  choice: करना
  rationale: עשה की व्यापकता को सुरक्षित रखता है और आज्ञात्मक वाक्य में स्वाभाविक हिन्दी देता है।
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: वह सब ... जिसकी आज्ञा मैं तुम्हें दे रहा हूँ
  rationale: भागधातु מְצַוֶּה की वर्तमान/चल रही आज्ञा की छाया को ‘दे रहा हूँ’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में दिव्य नाम स्वयं उपस्थित है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक मानक हिन्दी के सामान्य बाइबलीय पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ नामरूप है, जबकि ‘याहवे’ अधिक शैक्षणिक लिप्यंतरण है।
- issue: चुने हुए उपासना-स्थान की विशिष्टता
  choice: ‘बल्कि केवल’ और दो बार ‘वहीं’
  alternative: ‘सिवाय उस स्थान के’
  rationale: पिछले निषेध के संदर्भ में एकमात्र वैध स्थान पर दिया गया मूल बल सुरक्षित रखा गया है, बिना उस स्थान की बाद की ऐतिहासिक पहचान को इस पद में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गोत्र’ और ‘होमबलि’ जैसे स्थापित धार्मिक शब्द मूल की वाचा-संबंधी और बलिदानी शब्दावली बनाए रखते हैं। मूल में वास्तविक पाठगत अस्पष्टता न होने के कारण कोई पादटिप्पणी नहीं जोड़ी गई।
