base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे के सामने आनन्द मनाओ—तुम, तुम्हारे बेटे-बेटियाँ, तुम्हारे दास-दासियाँ और वह लेवी भी जो तुम्हारे फाटकों के भीतर रहता है[a], क्योंकि तुम्हारे साथ उसका कोई भाग या विरासत नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हारे नगरों में रहता है”; शाब्दिक अर्थ, “जो तुम्हारे फाटकों के भीतर है।”
    reason: שְׁעָרִים का शाब्दिक अर्थ ‘फाटक’ है, पर यह लक्षणा से नगरों या स्थानीय बस्तियों को भी सूचित कर सकता है।
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: आनन्द मनाना
  rationale: निर्देशात्मक प्रसंग में यह क्रिया आज्ञार्थक भाव रखती है। ‘आनन्द मनाना’ उपासना और सामुदायिक उत्सव, दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘सामने/उपस्थिति में’ है; ‘के सामने’ संक्षिप्त और स्वाभाविक है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: तुम्हारे बेटे-बेटियाँ
  rationale: इब्रानी में व्यक्त पुरुष और स्त्री दोनों पदों को बनाए रखता है और हिन्दी में सहज है।
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: तुम्हारे दास-दासियाँ
  rationale: ये शब्द आश्रित सेवकीय अथवा दास स्थिति वाले पुरुषों और स्त्रियों को अलग-अलग बताते हैं। ‘दास-दासियाँ’ उनकी सामाजिक स्थिति और लिंग-भेद दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: וְהַלֵּוִי
  choice: वह लेवी
  rationale: यह लेवी गोत्र के सदस्य के लिए प्रचलित बाइबलीय पद है; एकवचन यहाँ प्रतिनिधिक रूप में प्रयुक्त है।
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: जो तुम्हारे फाटकों के भीतर रहता है
  rationale: ‘फाटक’ मूल रूपक और उसके न्यायिक-सामुदायिक रंग को बनाए रखता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘रहता है’ जोड़ा गया है।
- source_word: חֵלֶק וְנַחֲלָה
  choice: भाग या विरासत
  rationale: यह जोड़ी इस्राएल में लेवी को भूमि का निर्धारित हिस्सा और पैतृक विरासत न मिलने को व्यक्त करती है; दोनों स्रोत पद अलग रखे गए हैं।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: यह मूल संबंधसूचक पद का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: עֶבֶד और אָמָה द्वारा सूचित घरेलू आश्रितों की स्थिति
  choice: दास-दासियाँ
  alternative: सेवक-सेविकाएँ; नौकर-नौकरानियाँ
  rationale: व्यवस्था-संबंधी इस सामाजिक प्रसंग में बँधी हुई अधीन स्थिति महत्त्वपूर्ण है। यह चयन उस वास्तविकता को नरम किए बिना पुरुष और स्त्री दोनों रूपों को सुरक्षित रखता है।
- issue: लेवी के भाग और विरासत का अभाव
  choice: कोई भाग या विरासत नहीं
  alternative: कोई हिस्सा या पैतृक सम्पत्ति नहीं
  rationale: दोनों इब्रानी संज्ञाओं को अलग रखा गया है और लेवी की भूमिहीनता को अतिरिक्त व्याख्या से किसी एक तकनीकी अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। बहुवचन संबोधन ‘तुम’ से रखा गया है। सूची की लय बनाए रखने के लिए संयुक्त रूप ‘बेटे-बेटियाँ’ और ‘दास-दासियाँ’ प्रयुक्त हैं।
