source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: hi
  text: इन सभी वचनों को, जिनकी आज्ञा मैं तुम्हें दे रहा हूँ, ध्यान से सुनो और उनका पालन करो,[a] ताकि तुम्हारा और तुम्हारे बाद तुम्हारी संतान का सदा भला हो,[b] क्योंकि तुम वही करोगे जो तुम्हारे परमेश्वर याहवे की दृष्टि में भला और ठीक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “इन सभी वचनों को सँभालकर रखो और सुनो”; इब्रानी में सावधानी से मानने और ध्यानपूर्वक सुनने के क्रियापद साथ आए हैं, और प्रसंग में आज्ञापालन निहित है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पुत्रों”; यहाँ इसका अर्थ व्यापक रूप से संतान अथवा वंशज है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: ध्यान से सुनो और उनका पालन करो
  rationale: इब्रानी में सावधानी से सुरक्षित रखने/मानने और ध्यानपूर्वक सुनने के दो क्रियापद साथ आते हैं। यह अनुवाद दोनों पक्षों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और सन्दर्भ में निहित आज्ञापालन को स्पष्ट रखता है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: इन सभी वचनों को
  rationale: דברים का मूल अर्थ ‘वचन/बातें’ है; यहाँ मूसा द्वारा कही जा रही आज्ञाओं के लिए ‘वचन’ गरिमापूर्ण और बोधगम्य है।
- source_word: מְצַוֶּךָּ
  choice: जिनकी आज्ञा मैं तुम्हें दे रहा हूँ
  rationale: कृदन्त रूप तत्काल जारी आज्ञा देने की क्रिया को दर्शाता है; यह हिन्दी अभिव्यक्ति उस पक्ष को स्वाभाविक ढंग से रखती है।
- source_word: לְמַעַן יִיטַב לְךָ
  choice: ताकि तुम्हारा ... भला हो
  rationale: यह व्यवस्थाविवरण में कल्याण और अनुकूल परिणाम का प्रचलित वाचा-संबंधी मुहावरा है।
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: और तुम्हारे बाद तुम्हारी सन्तान का
  rationale: בנים का शाब्दिक अर्थ ‘पुत्र’ है, पर इस वाचा-संबंधी प्रसंग में यह आने वाली सन्तति को सामूहिक रूप से दर्शाता है। ‘सन्तान’ उस व्यापक अर्थ को संक्षिप्त रूप में व्यक्त करता है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह अनिश्चित भविष्य तक बने रहने वाली अवधि को दर्शाता है; ‘सदा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: כִּי תַעֲשֶׂה
  choice: क्योंकि तुम ... करोगे
  rationale: כִּי को यहाँ प्रतिज्ञात कल्याण का कारण बताने वाले अर्थ में लिया गया है और अपूर्ण क्रिया को भावी अर्थ में रखा गया है। समयसूचक अथवा शर्तसूचक अर्थ भी व्याकरणतः सम्भव है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: जो ... भला और ठीक है
  rationale: दोनों विशेषण संज्ञा की तरह प्रयुक्त हैं। ‘भला और ठीक’ नैतिक अच्छाई और उचितता के युग्म को सहज हिन्दी में बनाए रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह परमेश्वर के मूल्यांकन का इब्रानी मुहावरा है। ‘दृष्टि में’ रूपक को सुरक्षित रखते हुए हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: בָנֶיךָ का दायरा
  choice: सन्तान
  alternative: पुत्रों
  rationale: रूप की दृष्टि से यह पुल्लिंग बहुवचन है, पर वाचा-संबंधी प्रतिज्ञा में भावी सन्तति को व्यापक रूप से सूचित करता है; केवल पुरुष वंशजों तक अर्थ सीमित करना प्रसंग से आवश्यक नहीं है।
- issue: כִּי תַעֲשֶׂה का सम्बन्ध
  choice: क्योंकि तुम ... करोगे
  alternative: जब तुम ... करोगे; यदि तुम ... करोगे
  rationale: כִּי कारण, समय या शर्त व्यक्त कर सकता है। मुख्य पाठ कारणात्मक अर्थ रखता है, जबकि वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘वचन’, ‘सन्तान’, ‘दृष्टि में’ और ‘याहवे’ बाइबलीय प्रसंग की गंभीरता बनाए रखते हैं; वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
