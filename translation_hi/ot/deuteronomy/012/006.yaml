id: DEU.12.6
reference: Deuteronomy 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: hi
  text: और वहाँ तुम अपनी होमबलियाँ, अपने बलिदान, अपने दशमांश, अपने हाथ से दी हुई भेंट[a], अपनी मन्नतों की भेंटें, अपनी स्वेच्छा-भेंटें, और अपने गाय-बैलों तथा भेड़-बकरियों के पहलौठे ले आना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे हाथ की भेंट।”
    reason: इब्रानी पदबंध में ‘हाथ’ स्पष्ट रूप से है; मुख्य पाठ स्वाभाविक हिंदी देता है और टिप्पणी मूल बिंब को दर्ज करती है।
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: ले आना
  rationale: हिफ़ील रूप चुने हुए स्थान तक वस्तुएँ लाने का निर्देश देता है। विधिक प्रसंग में ‘ले आना’ स्वाभाविक और आदेशात्मक है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: यह पहले बताए गए उपासना-स्थान की ओर संकेत करता है और इब्रानी क्रियाविशेषण की संक्षिप्त संकेतात्मकता बनाए रखता है।
- source_word: עֹלֹתֵיכֶם
  choice: अपने होमबलि
  rationale: עוֹלָה उस बलि का पारंपरिक नाम है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिंदी बाइबलीय प्रयोग में संक्षिप्त और स्थापित शब्द है।
- source_word: וְזִבְחֵיכֶם
  choice: अपने बलिदान
  rationale: זֶבַח वध करके चढ़ाई जाने वाली बलियों की व्यापक श्रेणी है; ‘बलिदान’ इसे होमबलि से अलग रखते हुए अनावश्यक संकीर्णता से बचता है।
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: अपने दशमांश
  rationale: यह दसवाँ भाग अर्पित करने को दर्शाता है; ‘दशमांश’ आधुनिक हिंदी में मान्य धार्मिक पद है।
- source_word: תְּרוּמַת יֶדְכֶם
  choice: अपने हाथ से दी हुई भेंट
  rationale: תְּרוּמָה अलग रखकर दी गई भेंट या अंशदान है और יֶדְכֶם में ‘हाथ’ की छवि है। यह रूप उस छवि को स्वाभाविक हिंदी में बनाए रखता है, बिना किसी विशेष अनुष्ठानिक गति को आरोपित किए।
- source_word: נִדְרֵיכֶם
  choice: अपनी मन्नतों की भेंटें
  rationale: शाब्दिक अर्थ ‘तुम्हारी मन्नतें’ है, पर बलियों की इस सूची में आशय मन्नत पूरी करने के लिए लाई गई भेंटों से है। हिंदी रूप प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: נִדְבֹתֵיכֶם
  choice: अपनी स्वेच्छा-भेंटें
  rationale: यह बिना मन्नत की बाध्यता के स्वेच्छा से दी गई भेंटों को दर्शाता है और मन्नतों की भेंटों से भेद बनाए रखता है।
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: अपने गाय-बैलों तथा भेड़-बकरियों के पहलौठे
  rationale: בָּקָר बड़े पालतू पशुओं और צֹאן छोटे पशुधन—भेड़-बकरियों—को दर्शाते हैं। स्पष्ट हिंदी पशु-नाम ‘झुंड’ जैसे अस्पष्ट सामान्य शब्द से अधिक सटीक हैं; ‘पहलौठे’ प्रथम जन्मे पशुओं को व्यक्त करता है।
theological_decisions:
- issue: נִדְרֵיכֶם का बलि-सूची में अर्थ
  choice: मन्नतों की भेंटें
  alternative: मन्नतें
  rationale: मूल शब्द अपने आप में ‘मन्नतें’ कह सकता है, किंतु यहाँ लाकर चढ़ाई जाने वाली वस्तुओं की सूची है। मुख्य पाठ में प्रसंगगत आशय दिया गया है, जबकि यह नहीं माना गया कि हर स्थान पर शब्द का यही विस्तृत अर्थ होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि,’ ‘दशमांश’ और ‘पहलौठे’ जैसे स्थापित बाइबलीय पद वहाँ बनाए गए हैं जहाँ वे सटीक और परिचित हैं। क्रिया को सूची के अंत में रखकर हिंदी का स्वाभाविक वाक्य-विन्यास अपनाया गया है।
