  yaml_path: translation/ot/deuteronomy/012/004.yaml
  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे के साथ ऐसा न करना।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऐसा” पिछले पदों में दिए गए उन आदेशों की ओर संकेत करता है जिनमें राष्ट्रों के उपासना-स्थलों को नष्ट करने को कहा गया है; इस्राएल को याहवे के साथ वैसा व्यवहार नहीं करना है।
    reason: cross_reference
  - marker: b
    text: 'इब्रानी: YHWH; इस ईश्वरीय नाम को परंपरागत रूप से “यहोवा” या “प्रभु” भी लिखा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: न करना
  rationale: निषेधवाचक לֹא को अपूर्ण क्रिया के साथ आए सीधे कानूनी निषेध के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: תַעֲשׂוּן
  choice: तुम ... करना
  rationale: यह עשה का काल रूप, द्वितीय पुरुष बहुवचन है। לֹא के साथ इसका अर्थ पूरी समुदाय को दिया गया सीधा निषेध है।
- source_word: כֵּן
  choice: ऐसा
  rationale: यह शब्द पिछले प्रसंग में बताए गए राष्ट्रों के उपासना-स्थलों के साथ किए जाने वाले व्यवहार की ओर संकेत करता है; संक्षिप्त संदर्भसूचकता बनाए रखी गई है।
- source_word: לַיהוָה
  choice: याहवे के साथ
  rationale: ל यहाँ याहवे के प्रति या उनके संबंध में वैसा व्यवहार करने का भाव देता है। हिन्दी में ‘के साथ ऐसा करना’ सहज है और संबंधपरक अर्थ को स्पष्ट रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का अर्थ ‘तुम्हारा परमेश्वर’ है। निषेध के कर्ता ‘तुम’ के साथ हिन्दी में ‘अपने परमेश्वर’ अधिक स्वाभाविक ढंग से वही संबंध व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम יהוה प्रत्यक्ष रूप से है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; अन्य परंपरागत रूपों को पादटिप्पणी में बताया गया है।
- issue: प्रसंग में निषेध का आशय
  choice: पिछले पदों में राष्ट्रों के उपासना-स्थलों के साथ किए जाने वाले व्यवहार की तरह याहवे के साथ व्यवहार न करने का सीधा निषेध
  alternative: केवल याहवे की उपासना से जुड़ी वस्तुओं को नष्ट न करने का संकीर्ण निषेध
  rationale: כֵּן (‘ऐसा’) पीछे के प्रसंग की ओर संकेत करता है। मुख्य पाठ की संक्षिप्तता और वास्तविक संदर्भगत तनाव बनाए रखते हुए स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और विधिक गरिमा वाली रखी गई है। ‘तुम’ मूल के बहुवचन संबोधन को दर्शाता है। ‘अपने परमेश्वर’ आधुनिक हिन्दी में ‘तुम्हारे परमेश्वर’ की तुलना में अधिक सहज है और वाचा-संबंध को अक्षुण्ण रखता है।
