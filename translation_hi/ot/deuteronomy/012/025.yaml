id: DEU.12.25
reference: Deuteronomy 12:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: hi
  text: तुम उसे मत खाना[a], ताकि तुम्हारा भला हो और तुम्हारे बाद तुम्हारे बच्चों का भी, क्योंकि तुम वह करोगे जो याहवे की दृष्टि में सही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारे बाद तुम्हारे पुत्रों का’; अधिक व्यापक अर्थ में, ‘तुम्हारे बाद तुम्हारे वंशजों का।’
    reason: बָנֶיךָ विशेष रूप से ‘पुत्रों’ और संदर्भानुसार व्यापक रूप से ‘बच्चों’ या ‘वंशजों’ को सूचित कर सकता है।
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: उसे न खाना
  rationale: क्रिया אָכַל का अर्थ ‘खाना’ है और पुल्लिंग एकवचन प्रत्यय निकटवर्ती संदर्भ के ‘लहू’ की ओर संकेत करता है। निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: לְמַעַן יִיטַב לְךָ
  choice: ताकि तुम्हारा ... भला हो
  rationale: לְמַעַן उद्देश्य अथवा परिणाम बताता है और יִיטַב לְךָ व्यवस्थाविवरण की व्यापक कुशलता/कल्याण की वाचा-संबंधी अभिव्यक्ति है; ‘भला हो’ इसे केवल भौतिक समृद्धि तक सीमित नहीं करता।
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: और तुम्हारे बाद तुम्हारे बच्चों का
  rationale: בָּנִים का अर्थ विशेषतः ‘पुत्र’ और व्यापक रूप से ‘बच्चे/वंशज’ हो सकता है। यहाँ भावी पीढ़ियों का पारिवारिक भाव रखते हुए ‘बच्चों’ चुना गया है और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: כִּי תַעֲשֶׂה
  choice: क्योंकि तुम ... करोगे
  rationale: כִּי प्रतिज्ञात भलाई का आधार बताता है और अपूर्ण क्रिया आगे की अपेक्षित आज्ञाकारिता को व्यक्त करती है।
- source_word: הַיָּשָׁר בְּעֵינֵי
  choice: जो ... की दृष्टि में सही है
  rationale: हिब्रू मुहावरे और दैवी मूल्यांकन के भाव को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलिपि ‘यहोवा’ द्वारा व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से प्रतिस्थापित किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में परिचित ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: בָנֶיךָ का दायरा
  choice: बच्चों
  alternative: पुत्रों; वंशजों
  rationale: रूप व्याकरणतः पुल्लिंग बहुवचन है, पर वाचा-संबंधी संदर्भ में संतान अथवा आगामी पीढ़ियाँ भी अभिप्रेत हो सकती हैं। मुख्य पाठ में पारिवारिक व्यापकता रखी गई है और वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: भलाई और आज्ञाकारिता के बीच संबंध
  choice: क्योंकि तुम वही करोगे
  alternative: जब तुम वही करोगे
  rationale: כִּי यहाँ कारण अथवा आधार बता सकता है, जबकि प्रसंग में शर्त-सदृश अर्थ भी संभव है। मुख्य पाठ कारणवाचक संबंध रखता है और उसे किसी विशिष्ट गुण-सिद्धांत के रूप में विस्तृत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और संबोधन में एकवचन अनौपचारिक ‘तुम’ वाला रूप रखा गया है, जो इस्राएल को संबोधित हिब्रू एकवचन के अनुरूप है। ‘उसे’ का पूर्वसंदर्भ पिछले पदों का ‘लहू’ है।
