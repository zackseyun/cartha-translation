base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: hi
  text: लेकिन जब भी तुम्हारा मन चाहे[a], तुम याहवे तुम्हारे परमेश्वर की उस आशीष के अनुसार, जो उसने तुम्हें दी है, अपने किसी भी नगर[b] में पशु का वध करके मांस खा सकते हो। अशुद्ध और शुद्ध, दोनों उसे ऐसे खा सकते हैं जैसे चिकारा या हिरन खाया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तुम्हारे प्राण की सारी इच्छा में”; अर्थात् जब भी तुम्हारी इच्छा हो।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “अपने सब फाटकों में।” यहाँ “फाटक” नगरों या बस्तियों के लिए इब्रानी मुहावरा है।'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह पिछले निर्देश के संबंध में एक सीमा या छूट प्रस्तुत करता है; ‘फिर भी’ आधुनिक हिन्दी में उसके विरोधात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: जब भी तुम्हारा मन चाहे
  rationale: शाब्दिक अर्थ ‘तुम्हारे प्राण की सारी इच्छा में’ है। हिन्दी में ‘मन चाहे’ इच्छा का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी मूल इब्रानी रूप को सुरक्षित रखती है।
- source_word: תִּזְבַּח וְאָכַלְתָּ בָשָׂר
  choice: पशु का वध करके मांस खा सकते हो
  rationale: संदर्भ में क्रियाएँ आज्ञा या भविष्यवाणी नहीं, बल्कि सामान्य मांसाहार की अनुमति व्यक्त करती हैं। ‘वध’ भोजन के लिए पशु काटने के अर्थ को स्पष्ट रखता है।
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: याहवे तुम्हारे परमेश्वर ने तुम्हें जितनी आशीष दी है, उसके अनुसार
  rationale: तुलनात्मक כ और ‘आशीष’ संज्ञा दोनों को बनाए रखते हुए यह बताता है कि उपभोग परमेश्वर द्वारा दिए गए प्रावधान के अनुरूप है।
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: अपने किसी भी नगर में
  rationale: शाब्दिक ‘अपने सब फाटकों में’ बस्ती या नगर के लिए इब्रानी नागरिक मुहावरा है। मुख्य पाठ में उसका अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: अशुद्ध और शुद्ध, दोनों
  rationale: ये शब्द नैतिक चरित्र नहीं, विधिक या अनुष्ठानिक दशा का संकेत करते हैं; ‘दोनों’ समान अनुमति स्पष्ट करता है।
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: जैसे चिकारे और हिरन का मांस
  rationale: तुलना उन वन्य पशुओं के मांस से है जिन्हें बलिदानी रीति के बिना खाया जाता था। ‘चिकारा’ और ‘हिरन’ आधुनिक हिन्दी में पहचाने जाने योग्य नाम हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। ‘याहवे’ उसका हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘अशुद्ध और शुद्ध’ का आशय
  choice: दोनों को इस मांस को खाने की अनुमति
  alternative: नैतिक रूप से बुरे और अच्छे लोग
  rationale: व्यवस्था के संदर्भ में यह विधिक-अनुष्ठानिक शुद्धता की स्थिति है। वन्य पशुओं के मांस से तुलना बताती है कि यह स्थानीय वध बलिदानी भोजन नहीं था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अनुमति के भाव के लिए ‘खा सकते हो’ और נֶפֶשׁ के मुहावरे के लिए स्वाभाविक हिन्दी ‘मन चाहे’ चुना गया है। तुलना को स्पष्ट करने के लिए अंतिम वाक्य में ‘मांस’ दोहराया गया है, पर बलिदानी और सामान्य वध के बीच निहित भेद को किसी सम्प्रदायगत व्याख्या से नहीं भरा गया।
