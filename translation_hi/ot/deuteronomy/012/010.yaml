id: DEU.12.10
reference: Deuteronomy 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: hi
  text: पर जब तुम यरदन पार करके उस देश में बस जाओगे जिसे तुम्हारा परमेश्वर याहवे तुम्हें विरासत में दे रहा है, और वह तुम्हें चारों ओर के तुम्हारे सब शत्रुओं से विश्राम देगा, तब तुम सुरक्षित रहोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब तुम निश्चिंत होकर बसोगे।”
    reason: इब्रानी वाक्यांश וִישַׁבְתֶּם בֶּטַח में सुरक्षित रहने और निश्चिंत होकर बसने—दोनों का भाव है।
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: पर जब तुम ... पार करके
  rationale: आस-पास के भावी संदर्भ में वाव-संयुक्त क्रिया समय-संबंधी क्रम बताती है। हिंदी में ‘जब ... करके’ इस आशय को स्वाभाविक रूप से व्यक्त करता है; ‘पर’ पिछले पदों के साथ विरोधात्मक संक्रमण बनाए रखता है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी के इस प्रचलित बाइबलीय नाम को रखा गया है; संदर्भ से नदी होना स्पष्ट है।
- source_word: וִישַׁבְתֶּם בָּאָרֶץ
  choice: उस देश में बस जाओगे
  rationale: ישׁב यहाँ केवल रहने नहीं, स्थायी रूप से बसने का भाव देता है। ‘देश’ भौगोलिक और वाचा-संबंधी अर्थ दोनों के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को उपाधि में बदलने के बजाय हिंदी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: מַנְחִיל אֶתְכֶם
  choice: तुम्हें विरासत में दे रहा है
  rationale: נחל के हिफ़ील रूप में किसी को उत्तराधिकार/अधिकार दिलाने का कारक भाव है। संदर्भ में दी जाने वाली वस्तु ‘देश’ है, इसलिए यह हिंदी वाक्यांश प्राकृतिक रहते हुए विरासत का भाव बनाए रखता है।
- source_word: וְהֵנִיחַ לָכֶם
  choice: वह तुम्हें ... विश्राम देगा
  rationale: נוח के हिफ़ील का अर्थ यहाँ शत्रुओं से राहत और विश्राम प्रदान करना है। ‘विश्राम देगा’ मूल धर्मवैचारिक प्रतिमान को बनाए रखता है।
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: चारों ओर के तुम्हारे सब शत्रुओं से
  rationale: यह रूप शत्रुओं की समग्रता और उनके चारों ओर होने, दोनों को स्पष्ट करता है।
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: तुम सुरक्षित रहोगे
  rationale: ישׁב और בטח का संयुक्त भाव भय से मुक्त, सुरक्षित निवास है। आधुनिक हिंदी में ‘सुरक्षित रहोगे’ सहज और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिवाचक वाचा-नाम है। ‘याहवे’ उसका निकटतर लिप्यंतरण है और उसे किसी उपाधि में बदलकर मूल भेद को मिटाता नहीं।
- issue: מַנְחִיל में देश, विरासत और अधिकार का संबंध
  choice: उस देश में ... जिसे ... तुम्हें विरासत में दे रहा है
  alternative: जिस देश का वह तुम्हें अधिकारी बना रहा है
  rationale: चुना हुआ रूप परमेश्वर की देने वाली सक्रियता और देश के विरासत होने—दोनों को रखता है, बिना इस प्रक्रिया की धर्मवैचारिक प्रकृति को अनावश्यक रूप से अधिक स्पष्ट किए।
- issue: וְהֵנִיחַ का ‘विश्राम’ प्रतिमान
  choice: विश्राम देगा
  alternative: राहत देगा
  rationale: शत्रुओं से मुक्ति इसका तात्कालिक संदर्भ है, पर ‘विश्राम’ व्यवस्थाविवरण में भूमि और सुरक्षा से जुड़ी व्यापक प्रतिध्वनि भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु ‘विरासत’ और ‘विश्राम’ जैसे मुख्य बाइबलीय प्रतिमानों को बनाए रखने के लिए गरिमापूर्ण शब्दावली अपनाई गई है। संबोधन बहुवचन है, जैसा इब्रानी क्रियाओं से स्पष्ट है, यद्यपि हिंदी ‘तुम’ में वचन-भेद रूपतः सीमित है।
