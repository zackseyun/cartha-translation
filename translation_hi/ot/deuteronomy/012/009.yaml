source:
  edition: WLC
  text: כִּ֥י לֹא בָּאתֶ֖ם עַד עָ֑תָּה אֶל הַ/מְּנוּחָה֙ וְ/אֶל הַֽ/נַּחֲלָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: hi
  text: क्योंकि तुम अब तक उस विश्राम-स्थान और उस विरासत तक नहीं पहुँचे हो, जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें दे रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्राम’। इब्रानी शब्द מְנוּחָה का अर्थ अमूर्त ‘विश्राम’ अथवा अधिक ठोस ‘विश्राम-स्थान’ हो सकता है; यहाँ भूमि का संदर्भ ठोस अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आदेश का कारण बताता है; हिंदी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאתֶם
  choice: पहुँचे हो
  rationale: בוא का अर्थ आना, प्रवेश करना या पहुँचना हो सकता है। गंतव्य के साथ ‘पहुँचे हो’ आधुनिक हिंदी में सहज है और अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: עַד עָתָּה
  choice: अब तक ... नहीं
  rationale: नकार के साथ यह वाक्यांश वर्तमान समय तक कार्य के न होने को व्यक्त करता है; हिंदी में ‘अब तक ... नहीं’ स्वाभाविक समतुल्य है।
- source_word: הַמְּנוּחָה
  choice: उस विश्राम-स्थान
  rationale: מְנוּחָה अमूर्त ‘विश्राम’ या ठोस ‘विश्राम-स्थान’ दोनों का बोध करा सकता है। भूमि और गंतव्य का संदर्भ ठोस अर्थ का समर्थन करता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: הַנַּחֲלָה
  choice: उस विरासत
  rationale: נַחֲלָה विशेषतः परमेश्वर द्वारा दी या बाँटी गई भूमि-संपत्ति को दर्शाता है। ‘विरासत’ उपहार और वाचा-संबंधी अधिकार दोनों भावों को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिंदी में प्रचलित नामरूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है, न कि उपाधि से बदला गया है।
- source_word: נֹתֵן
  choice: दे रहा है
  rationale: सहभागी रूप क्रिया को जारी अथवा निकटस्थ रूप में प्रस्तुत करता है; ‘दे रहा है’ उस पक्ष को साधारण भविष्य की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का निजी दिव्य नाम सीधे आया है। हिंदी के साधारण बाइबलीय पाठकों में परिचित ‘यहोवा’ नाम को बनाए रखते हुए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: מְנוּחָה का ठोस या अमूर्त अर्थ
  choice: विश्राम-स्थान
  alternative: विश्राम
  rationale: ‘पहुँचना’ और भूमि-प्रवेश का संदर्भ किसी ठोस गंतव्य की ओर संकेत करता है, पर शब्द का अमूर्त अर्थ भी संभव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सहज गद्य। ‘विश्राम-स्थान’ अर्थ की ठोस भूमि-संबंधी छवि रखता है; ‘विरासत’ वाचा और दान में मिली भूमि का भाव बनाए रखती है।
