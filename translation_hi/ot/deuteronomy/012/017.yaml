language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: hi
  text: तुम अपने फाटकों के भीतर[a] अपने अनाज, नए दाखरस और तेल का दशमांश, अपने गाय-बैलों और भेड़-बकरियों के पहलौठे, मन्नत के कारण चढ़ाई जाने वाली अपनी कोई भी भेंट[b], अपनी स्वेच्छा की भेंटें, या अपने हाथ का अंशदान[c] नहीं खा सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने नगरों में।” इब्रानी में शाब्दिक अर्थ “अपने फाटकों के भीतर” है; यह स्थानीय नगरों या बस्तियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी मन्नतें जिन्हें तुम मानोगे।” प्रसंग में संभवतः मन्नतों से जुड़ी चढ़ाई गई भेंटें अभिप्रेत हैं, केवल बोले गए वचन नहीं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने हाथ का अंशदान”; परंपरागत रूप से इसे “अपने हाथ की उठाई हुई भेंट” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: नहीं खा सकते
  rationale: יכל + क्रिया के साधारण रूप का प्रयोग इस कानूनी संदर्भ में असमर्थता नहीं, निषेध व्यक्त करता है। हिन्दी में यह रचना मूल की अभिव्यक्ति और निषेधात्मक बल दोनों बनाए रखती है।
- source_word: בִּשְׁעָרֶיךָ
  choice: अपने फाटकों के भीतर
  rationale: यह मूल इब्रानी बिंब को बनाए रखता है; यहाँ ‘फाटक’ स्थानीय नगरों या बस्तियों के लिए प्रचलित लक्षणा है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: अपने अनाज ... का दशमांश
  rationale: מַעְשַׂר उपज के दसवें भाग का पारिभाषिक शब्द है और דָּגָן विशेष रूप से अनाज को दर्शाता है।
- source_word: תִּירֹשְׁךָ
  choice: नई दाखमधु
  rationale: תירוש सामान्यतः नई या ताज़ी दाखमधु को दर्शाता है; ‘नई दाखमधु’ अन्य इब्रानी मदिरा-संज्ञाओं से इसका भेद बनाए रखती है।
- source_word: יִצְהָרֶךָ
  choice: तेल
  rationale: यह शब्द प्रायः ताज़े तेल, विशेषकर जैतून के तेल, को दर्शाता है; मूल से अधिक विशिष्ट हुए बिना ‘तेल’ स्वाभाविक और सटीक है।
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: अपने गाय-बैलों और भेड़-बकरियों के पहलौठे
  rationale: בכור पहला जन्मा बच्चा है; בקר बड़े पालतू पशुओं और צאן छोटे पशुओं, अर्थात भेड़-बकरियों, के सामूहिक वर्ग हैं।
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: मन्नत मानकर चढ़ाई गई अपनी कोई भी भेंट
  rationale: शाब्दिक रूप में ‘तुम्हारी मन्नतें जिन्हें तुम मानोगे’ है, पर खाने योग्य पवित्र वस्तुओं की सूची में इसका आशय मन्नत से संबद्ध भेंटों से है। हिन्दी रूप संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: נִדְבֹתֶיךָ
  choice: अपने स्वेच्छा-बलिदान
  rationale: यह बाध्यता या मन्नत से अलग, स्वेच्छा से चढ़ाए जाने वाले बलिदानों की पारिभाषिक श्रेणी है।
- source_word: תְּרוּמַת יָדֶךָ
  choice: अपने हाथ से दी हुई भेंट
  rationale: תרומה अलग रखे गए अंशदान या भेंट को दर्शाता है। यह सहज हिन्दी में हाथ से प्रस्तुत करने का भाव देता है, जबकि पादटिप्पणी मूल पदबंध को अधिक शाब्दिक रूप में रखती है।
theological_decisions:
- issue: कानूनी निषेध में יכל का अर्थ
  choice: ‘नहीं खा सकते’ को विधिक निषेध के रूप में प्रस्तुत किया
  alternative: ‘नहीं खाना चाहिए’ या केवल शारीरिक असमर्थता का कथन
  rationale: व्यवस्थाविवरण के कानूनी संदर्भ में यह अनुमति का अभाव व्यक्त करता है। हिन्दी वाक्य मूल की संरचना को बनाए रखते हुए निषेध के रूप में स्वाभाविक है।
- issue: נדר को बोली गई मन्नत या मन्नत-संबंधी भेंट समझना
  choice: मुख्य पाठ में मन्नत मानकर चढ़ाई गई भेंट
  alternative: ‘अपनी मन्नतें जो तुम मानते हो’
  rationale: सूची उन पवित्र वस्तुओं की है जिन्हें खाया जा सकता है, इसलिए संदर्भ मन्नत के शब्दों के बजाय उससे जुड़ी चढ़ाई गई वस्तु की ओर संकेत करता है; फिर भी शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- issue: बलिदानी श्रेणियों का भेद
  choice: मन्नत की भेंट, स्वेच्छा-बलिदान और हाथ से दी हुई भेंट को अलग श्रेणियों के रूप में रखा
  alternative: सभी को सामान्यतः ‘भेंटें’ कहना
  rationale: मूल पाठ विशिष्ट पवित्र/बलिदानी श्रेणियाँ गिनाता है; उन्हें एक ही सामान्य पद में मिला देना कानूनी और उपासना-संबंधी भेद को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट किंतु गरिमापूर्ण विधिक-उपासना संबंधी लहजा रखा गया है। ‘नई दाखमधु’, ‘दशमांश’, ‘पहलौठे’ और ‘स्वेच्छा-बलिदान’ जैसे पद प्रसंग की विशिष्टता बनाए रखते हैं; दुर्लभ इब्रानी मुहावरों को पादटिप्पणियों में समझाया गया है।
