revisions:
- from: बल्कि उस स्थान को ढूँढ़ना जिसे तुम्हारा परमेश्वर यहोवा तुम्हारे सभी गोत्रों में से चुनकर वहाँ अपना नाम स्थापित करेगा[a]—अपने निवास के लिए—और वहीं जाना।
  to: बल्कि उस स्थान को ढूँढ़ना जिसे तुम्हारा परमेश्वर यहोवा तुम्हारे सभी गोत्रों में से अपना नाम वहाँ स्थापित करने के लिए—अपने निवास के लिए—चुनेगा, और वहीं जाना।
  rationale: 'The revision replaces the awkward participial sequence with “... स्थापित करने के लिए ... चुनेगा,” which faithfully reflects the Hebrew purpose relation: Yahweh chooses the place in order to put/set his name there. “अपने निवास के लिए” remains set off within that purpose expression, and the footnote preserves the disputed syntactic relationship without imposing a theological interpretation.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:52:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the contrast, Yahweh’s choice from among Israel’s tribes, the placing/establishing of his name, the dwelling motif, and the commands to seek and go. However, the relative-clause construction makes the location of the choice and the subsequent establishment awkwardly sequenced in Hindi.
  naturalness: 'The phrase “जिसे ... चुनकर वहाँ अपना नाम स्थापित करेगा” is grammatically possible but cumbersome: the conjunctive participle “चुनकर” joins poorly with the future verb “स्थापित करेगा,” and the dash-enclosed “अपने निवास के लिए” is detached from the clause it qualifies. Recasting the purpose clause produces clear, modern Hindi while retaining the source ambiguity through the footnote.'
  terminology: “यहोवा,” “परमेश्वर,” “गोत्र,” “स्थान,” and “नाम स्थापित करना” are suitable in a dignified modern Hindi register. “ढूँढ़ना” and “वहीं जाना” adequately render the imperative-force plural forms in this context.
  issues:
  - severity: medium
    issue: Awkward syntactic linkage of “चुनकर” with “स्थापित करेगा”
    rationale: The Hebrew has “will choose ... to put his name there”; the draft’s “जिसे ... चुनकर वहाँ अपना नाम स्थापित करेगा” can sound as though “choosing” is merely a completed adverbial action before the future establishment. A purpose construction more directly represents the relationship.
  - severity: medium
    issue: Detached placement of “अपने निवास के लिए”
    rationale: Placing this phrase between dashes after “स्थापित करेगा” leaves its syntactic attachment unclear in a way that is more disruptive than the compact Hebrew ambiguity. It should be integrated into the purpose expression, while the footnote continues to explain the genuine ambiguity.
  revised_text: बल्कि उस स्थान को ढूँढ़ना जिसे तुम्हारा परमेश्वर यहोवा तुम्हारे सभी गोत्रों में से अपना नाम वहाँ स्थापित करने के लिए—अपने निवास के लिए—चुनेगा, और वहीं जाना।
  revised_footnotes:
  - marker: a
    text: इसका अनुवाद यह भी हो सकता है, “वहाँ अपने निवास के लिए अपना नाम स्थापित करेगा।” इब्रानी वाक्यांश संक्षिप्त है; यह परमेश्वर के निवास, उस स्थान के उसके निवास होने, या दोनों पर बल दे सकता है।
    reason: alternative_reading
  revision_rationale: 'The revision replaces the awkward participial sequence with “... स्थापित करने के लिए ... चुनेगा,” which faithfully reflects the Hebrew purpose relation: Yahweh chooses the place in order to put/set his name there. “अपने निवास के लिए” remains set off within that purpose expression, and the footnote preserves the disputed syntactic relationship without imposing a theological interpretation.'
