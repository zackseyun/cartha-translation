language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: hi
  text: बल्कि उस स्थान को ढूँढ़ना जिसे तुम्हारा परमेश्वर यहोवा तुम्हारे सभी गोत्रों में से अपना नाम वहाँ स्थापित करने के लिए—अपने निवास के लिए—चुनेगा, और वहीं जाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पिछले निषेध के विपरीत सकारात्मक विकल्प प्रस्तुत करने वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: निर्दिष्ट किंतु अभी अनाम उपासना-स्थल के लिए ठोस और सामान्य शब्द।
- source_word: יִבְחַר
  choice: चुनकर
  rationale: भविष्य में यहोवा द्वारा स्थान चुने जाने का भाव आगामी क्रिया के साथ सहज हिन्दी वाक्यरचना में व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: वाचा-संबंधी संबोधन और बहुवचन श्रोताओं को संबोधित एकवचन संबंधसूचक रूप सुरक्षित रखता है।
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: तुम्हारे सभी गोत्रों में से
  rationale: इस्राएल के गोत्रों के बीच से स्थान चुने जाने का संबंध स्पष्ट करता है।
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: वहाँ अपना नाम स्थापित करेगा
  rationale: ‘नाम रखना’ के अधिक शाब्दिक रूप की अपेक्षा ‘स्थापित करना’ अधिक स्वाभाविक हिन्दी है और अधिकृत उपस्थिति तथा उपासना के मुहावरे को बनाए रखता है।
- source_word: לְשִׁכְנוֹ
  choice: अपने निवास के लिए
  rationale: संक्षिप्त और कठिन इब्रानी पद को बिना अतिरिक्त क्रिया जोड़े निकटता से प्रस्तुत करता है; इसका वाक्यगत संबंध पादटिप्पणी में खुला रखा गया है।
- source_word: תִדְרְשׁוּ
  choice: ढूँढ़ना
  rationale: यहाँ उचित उपासना-स्थान को खोजने की आज्ञा का सरल आधुनिक हिन्दी रूप।
- source_word: וּבָאתָ שָׁמָּה
  choice: और वहीं जाना
  rationale: בוא का गंतव्याभिमुख भाव हिन्दी में ‘जाना’ से स्वाभाविक है; ‘वहीं’ שָׁמָּה को दर्शाता है।
theological_decisions:
- issue: दिव्य नाम और केंद्रीय उपासना-स्थल
  choice: यहोवा ... वहाँ अपना नाम स्थापित करेगा
  alternative: प्रभु ... वहाँ अपना नाम रखेगा
  rationale: व्यक्तिगत दिव्य नाम और चुने हुए अधिकृत उपासना-स्थान की भाषा सुरक्षित रखी गई है, बिना बाद के मंदिर-विषयक निष्कर्ष पाठ में जोड़ने के।
- issue: לְשִׁכְנוֹ का ‘नाम स्थापित करने’ से संबंध
  choice: —अपने निवास के लिए—
  alternative: वहाँ अपना नाम अपने निवास के लिए स्थापित करेगा / ताकि वह वहाँ निवास करे
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है और ‘निवास’ का संबंध परमेश्वर, उसके नाम अथवा स्थान से समझा जा सकता है। मुख्य पाठ और पादटिप्पणी इस वास्तविक अस्पष्टता को बनाए रखते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। आज्ञार्थक प्रवाह को ‘ढूँढ़ना ... और ... जाना’ से रखा गया है; ‘अपने निवास के लिए’ को डैश के बीच रखने से मूल की संक्षिप्तता और संबंधगत अस्पष्टता संकेतित होती है।
