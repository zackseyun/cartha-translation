source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: hi
  text: जब तुम्हारा परमेश्वर याहवे तुम्हारे सामने से उन जातियों को हटा देगा, जिन्हें बेदखल करने के लिए तुम वहाँ जा रहे हो, और तुम उन्हें बेदखल करके उनके देश में बस जाओगे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह शब्द अगले पद की चेतावनी के लिए भविष्य की परिस्थिति प्रस्तुत करता है; इसलिए कालवाचक ‘जब’ स्वाभाविक है।
- source_word: יַכְרִית
  choice: मिटा देगा
  rationale: हिफ़ील रूप यहाँ जातियों को इस्राएल के सामने से हटा देने या समाप्त कर देने का भाव देता है। ‘मिटा देगा’ प्रभावी हिन्दी है, पर अनिवार्यतः पूर्ण विनाश को तकनीकी रूप से निर्धारित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे उपाधि से बदलने के बजाय नाम के रूप में रखता है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित सीधा और स्वाभाविक अनुवाद।
- source_word: הַגּוֹיִם
  choice: उन जातियों
  rationale: सन्दर्भ में यह कनान में रहने वाले सामूहिक जनसमुदायों को दर्शाता है; ‘जातियाँ’ आधुनिक बाइबलीय हिन्दी में उपयुक्त है।
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לָרֶשֶׁת אֹתָם
  choice: जिनका अधिकार लेने के लिए तुम वहाँ जा रहे हो
  rationale: सम्बन्धवाचक उपवाक्य और ‘वहाँ जाने’ की दिशा को बनाए रखते हुए ירש के अधिकार/कब्ज़ा लेने के भाव को हिन्दी में व्यक्त करता है।
- source_word: מִפָּנֶיךָ
  choice: तुम्हारे सामने से
  rationale: हिब्रू मुहावरे का निकट और स्वाभाविक हिन्दी रूप, जो इस्राएल के मार्ग या उपस्थिति से हटाए जाने का भाव देता है।
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: और तुम उनका अधिकार लेकर
  rationale: ירש की पुनरावृत्ति को ‘अधिकार लेना’ द्वारा बनाए रखा गया है; इससे लोगों को बेदखल करके उनकी भूमि पर अधिकार पाने का सन्दर्भ उभरता है।
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: उनके देश में बस जाओगे
  rationale: ישב यहाँ विजय के बाद स्थायी निवास करने को दर्शाता है; ‘बस जाओगे’ सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को व्यक्तिगत नाम के रूप में रखा गया है; ‘प्रभु’ जैसी उपाधि से इसे प्रतिस्थापित नहीं किया गया।
- issue: ירש का अर्थ
  choice: अधिकार लेना
  alternative: बेदखल करना
  rationale: क्रिया लोगों को हटाने और उनके भूभाग पर अधिकार पाने—दोनों से जुड़ सकती है। ‘अधिकार लेना’ मूल की व्यापकता बनाए रखता है, जबकि सन्दर्भ विस्थापन का भाव स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। पद अगले पद तक चलने वाले वाक्य का आरम्भ है, इसलिए अन्त में अल्पविराम रखा गया है। द्वितीय पुरुष एकवचन ‘तुम’ मूल के एकवचन सम्बोधन को दर्शाता है।
