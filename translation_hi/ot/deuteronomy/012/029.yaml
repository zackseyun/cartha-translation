  revised_footnotes: []
  revision_rationale: The revision replaces the ambiguous ‘अधिकार लेना’ with ‘बेदखल करना’ in both occurrences, retaining the source’s repetition and the contextual sense of displacement. It renders the divine name as ‘याहवे’ in conformity with the English POB audit trail and retains the temporal opening and trailing comma required by the verse’s continuation into the next verse.
