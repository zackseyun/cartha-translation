language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּנָּקֵשׁ֙ אַחֲרֵי/הֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣/ם מִ/פָּנֶ֑י/ךָ וּ/פֶן תִּדְרֹ֨שׁ לֵֽ/אלֹהֵי/הֶ֜ם לֵ/אמֹ֨ר אֵיכָ֨ה יַעַבְד֜וּ הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֶת אֱלֹ֣הֵי/הֶ֔ם וְ/אֶעֱשֶׂה כֵּ֖ן גַּם אָֽנִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: hi
  text: अपने लिए सावधान रहना कि जब वे तुम्हारे सामने से नष्ट कर दिए जाएँ, तब तुम उनके पीछे चलकर फंदे में न पड़ जाओ; और उनके देवताओं के बारे में पूछताछ न करना, “ये जातियाँ अपने देवताओं की उपासना कैसे करती थीं? मैं भी वैसा ही करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: अपने विषय में सावधान रहना
  rationale: निफ़ाल आज्ञार्थक और नैतिक हित/संबंध सूचक לְךָ दोनों को बनाए रखता है; आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: उनके पीछे चलकर फंदे में न पड़ जाओ
  rationale: נקש के फँसने/फंदे में पड़ने के रूपक और אַחֲרֵיהֶם के ‘उनके पीछे’ भाव को स्पष्ट रखते हुए मूल चेतावनी सुरक्षित रखता है।
- source_word: הִשָּׁמְדָם מִפָּנֶיךָ
  choice: वे तुम्हारे सामने से नष्ट कर दिए जाएँ
  rationale: निफ़ाल infinitive construct का कर्मवाच्य तथा מִפָּנֶיךָ का स्थानिक/उपस्थिति-सूचक अर्थ संरक्षित है।
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: उनके देवताओं के विषय में यह पूछताछ न करना
  rationale: דרש यहाँ जानकारी खोजने या जाँच-पड़ताल करने का अर्थ देता है; ‘पूछताछ’ इसे केवल सामान्य प्रश्न से अधिक उद्देश्यपूर्ण दिखाता है, बिना इसे स्वयं उपासना मान लेने के।
- source_word: יַעַבְדוּ
  choice: उपासना करती थीं
  rationale: देवताओं के संदर्भ में עבד का धार्मिक ‘सेवा/उपासना करना’ अर्थ हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְאֶעֱשֶׂה כֵּן גַּם־אָנִי
  choice: मैं भी वैसा ही करूँगा
  rationale: सहयोगी/परिणामी वाव और वक्ता के अनुकरण के संकल्प को संक्षेप में सुरक्षित रखता है; हिन्दी में प्रसंग से उद्देश्य स्पष्ट है।
theological_decisions:
- issue: निषिद्ध पूछताछ का स्वरूप
  choice: देवताओं के विषय में पूछताछ, जिसका उद्देश्य उनकी उपासना-पद्धति अपनाना है
  alternative: देवताओं से दैवी उत्तर माँगना
  rationale: לֵאלֹהֵיהֶם व्याकरणतः कुछ विस्तार की अनुमति दे सकता है, पर आगे का सीधा प्रश्न—जातियाँ उनकी उपासना कैसे करती थीं—यहाँ उनके बारे में जानकारी लेने और उसका अनुकरण करने को प्रमुख बनाता है।
- issue: ‘उनके पीछे’ का आशय
  choice: उन जातियों के पीछे चलकर उनके धार्मिक आचरण में फँसना
  alternative: उनके विनाश के बाद केवल कालगत रूप से फँसना
  rationale: पहला אַחֲרֵיהֶם लोगों को संदर्भित करता है, जबकि दूसरा אַחֲרֵי הִשָּׁמְדָם समय बताता है; अनुवाद दोनों संबंधों को अलग रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; संबोधन एकवचन ‘तुम’ के अनुरूप है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। मूल के पुनरुक्त ‘אַחֲרֵי... אַחֲרֵי...’ को हिन्दी की स्वाभाविक वाक्य-रचना में कालगत उपवाक्य और ‘उनके पीछे चलकर’ के द्वारा व्यक्त किया गया है।
