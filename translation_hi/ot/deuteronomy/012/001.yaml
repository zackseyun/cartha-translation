reference: Deuteronomy 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: hi
  text: ये वे विधियाँ और न्याय-विधान हैं जिनका पालन करने में तुम्हें सावधानी बरतनी है, उस देश में जिसे यहोवा, तुम्हारे पूर्वजों के परमेश्वर, ने तुम्हें अधिकार में लेने के लिए दिया है—उन सभी दिनों तक, जब तक तुम धरती पर जीवित रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: ये वे विधियाँ और न्याय-विधान हैं
  rationale: विधियाँ חֻקִּים के निर्धारित नियमों के भाव को व्यक्त करता है, जबकि न्याय-विधान מִשְׁפָּטִים का अलग कानूनी स्वर बनाए रखता है।
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: जिनका पालन करने में तुम्हें सावधानी बरतनी है
  rationale: यह शाब्दिक रूप से केवल ‘रखना’ नहीं, बल्कि ध्यानपूर्वक व्यवहार में लाने की इब्रानी क्रिया-रचना का स्वाभाविक हिन्दी रूप है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: व्यवस्थाविवरण के प्रसंग में यह वाचा के अंतर्गत दिए जा रहे प्रतिज्ञात देश को सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: यह वाचाई सूत्र का अर्थ सुरक्षित रखता है और आधुनिक हिन्दी में सहज है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: ירשׁ यहाँ देश पर अधिकार प्राप्त करने और उसे अपने अधीन रखने का सक्रिय भाव रखता है; केवल निष्क्रिय उत्तराधिकार इसका पूरा बल नहीं दिखाता।
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים עַל הָאֲדָמָה
  choice: उन सभी दिनों तक, जब तक तुम धरती पर जीवित रहो
  rationale: यह सम्पूर्ण जीवनकाल के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और הָאֲדָמָה को पहले आए देश से अलग व्यापक ‘धरती’ के रूप में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचाई नाम का प्रयोग करता है। हिन्दी पाठकों के बीच पहचाने जाने वाले ‘यहोवा’ को रखकर नाम और उपाधि का भेद सुरक्षित रखा गया है; ‘याहवे’ अधिक निकट पुनर्निर्मित उच्चारण है।
- issue: ירשׁ में अधिकार और उत्तराधिकार का संबंध
  choice: अधिकार में लेने के लिए
  alternative: विरासत में पाने के लिए
  rationale: देश का दान परमेश्वर की ओर से है, फिर भी क्रिया यहाँ उसे ग्रहण कर अधिकार स्थापित करने का सक्रिय पहलू रखती है। चुना हुआ रूप उस तनाव को बिना निष्क्रिय बनाए व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। सामूहिक इस्राएल को संबोधित इब्रानी बहुवचन के लिए हिन्दी में ‘तुम’ रखा गया है; ‘तुम्हारे पूर्वजों’ में मूल के वाचाई संबंध को स्वाभाविक रूप दिया गया है।
