source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: hi
  text: सावधान रहो कि तुम अपनी होमबलियाँ हर उस स्थान पर न चढ़ाओ जो तुम्हें दिखाई दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सावधान रहो कि तुम अपनी होमबलियाँ किसी भी ऐसे स्थान पर न चढ़ाओ जो तुम्हें दिखाई दे।”
    reason: निषेधात्मक संदर्भ में בְּכָל מָקוֹם का अर्थ ‘हर स्थान’ अथवा मुहावरेदार रूप में ‘किसी भी स्थान’ समझा जा सकता है।
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: सावधान रहना
  rationale: निफ़अल आज्ञार्थक और सर्वनामयुक्त पद एक प्रबल चेतावनी-सूत्र है। ‘सावधान रहना’ आधुनिक, स्वाभाविक हिंदी में इसकी आज्ञात्मक चेतावनी को बनाए रखता है।
- source_word: פֶּן
  choice: कि ... न
  rationale: यह निषेधात्मक चेतावनी प्रस्तुत करता है। हिंदी में ‘सावधान रहना कि ... न’ उसके निवारक भाव को सहज ढंग से व्यक्त करता है।
- source_word: תַּעֲלֶה
  choice: चढ़ाओ
  rationale: עלה के हिफ़ईल रूप का बलिदान-संबंधी अर्थ वेदी पर अर्पण चढ़ाना है। ‘चढ़ाओ’ कारणवाचक गति और धार्मिक प्रयोग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹלֹתֶיךָ
  choice: अपने होमबलि
  rationale: עֹלָה पूर्णतः जलाए जाने वाले बलिदान का मानक शब्द है। ‘होमबलि’ हिंदी बाइबलीय प्रयोग में संक्षिप्त और स्थापित पारिभाषिक पद है।
- source_word: בְּכָל מָקוֹם
  choice: हर उस स्थान पर
  rationale: כָּל का मूल व्यापक भाव ‘हर’ से स्पष्ट रहता है; निषेधात्मक वाक्य में इसका व्यावहारिक अर्थ किसी भी मनचाहे स्थान पर चढ़ाने की मनाही है।
- source_word: אֲשֶׁר תִּרְאֶה
  choice: जो तुम्हें दिखाई दे
  rationale: यह इब्रानी के प्रत्यक्ष ‘जिसे तुम देखो’ को बनाए रखता है और अपने निरीक्षण या पसंद से स्थान चुनने के निहित संदर्भ को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
theological_decisions:
- issue: उपासना-स्थल के केंद्रीकरण की भाषा
  choice: वचन को स्वयं दिखाई देने वाले प्रत्येक स्थान पर होमबलि चढ़ाने की मनाही के रूप में अनूदित किया गया है।
  alternative: इसे केंद्रीय पवित्रस्थान के बाहर होने वाली हर प्रकार की उपासना पर सामान्य प्रतिबंध के रूप में विस्तार देना।
  rationale: निकटवर्ती पाठ मनचाहे स्थानों पर होमबलि चढ़ाने की बात करता है। व्यापक प्रसंग में चुने हुए उपासना-स्थल का विषय है, पर इस पद के अनुवाद में उसके स्पष्ट शब्दों से अधिक नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सुबोध रखी गई है। ‘होमबलि’ को स्थापित धार्मिक पारिभाषिक शब्द के रूप में रखा गया है; मुख्य पाठ में ‘हर’ से इब्रानी כָּל की औपचारिक व्यापकता और पादटिप्पणी में ‘किसी भी’ का स्वाभाविक निषेधात्मक अर्थ सुरक्षित है।
