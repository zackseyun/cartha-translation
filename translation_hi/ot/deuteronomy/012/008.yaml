source:
  edition: WLC
  text: לֹ֣א תַעֲשׂ֔וּ/ן כְּ֠/כֹל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַ/יּ֑וֹם אִ֖ישׁ כָּל הַ/יָּשָׁ֥ר בְּ/עֵינָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: hi
  text: तुम वैसा न करना जैसा हम आज यहाँ कर रहे हैं—हर पुरुष वह सब करता है जो उसकी अपनी दृष्टि में ठीक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲשׂוּן
  choice: तुम ... न करना
  rationale: निषेध के साथ द्वितीय पुरुष बहुवचन का अपूर्ण रूप आगे के लिए दी गई आज्ञा व्यक्त करता है। यह रूप हिन्दी में स्वाभाविक रहते हुए विधिक-निर्देशात्मक बल बनाए रखता है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वैसा ... जैसा
  rationale: यह तुलनात्मक पदबंध काम करने के ढंग की समानता बताता है। हिन्दी का सहसंबंधी प्रयोग मूल भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹשִׂים פֹּה הַיּוֹם
  choice: हम आज यहाँ कर रहे हैं
  rationale: कृदन्त के साथ स्थान और समयसूचक शब्द वर्तमान में चल रहे व्यवहार को दर्शाते हैं।
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: मूल में पुल्लिंग एकवचन शब्द वितरणात्मक अर्थ में है। ‘हर पुरुष’ उसके रूप को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि आशय प्रत्येक व्यक्ति से अपना निर्णय मानकर काम करने का है।
- source_word: כָּל הַיָּשָׁר
  choice: वही ... जो ... ठीक है
  rationale: यह वाक्यांश उस सबको सूचित करता है जिसे सही या उचित माना जाता है। ‘ठीक है’ सरल और स्वाभाविक है तथा ‘ठीक लगता है’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: यह निजी आकलन या निर्णय का इब्रानी मुहावरा है। हिन्दी में यह रूप मुहावरे का नैतिक आशय और आत्म-संदर्भ दोनों बनाए रखता है।
theological_decisions:
- issue: אִישׁ ... בְּעֵינָיו का पुल्लिंग वितरणात्मक प्रयोग
  choice: हर पुरुष ... उसकी अपनी दृष्टि में
  alternative: हर व्यक्ति ... उसकी अपनी दृष्टि में
  rationale: मुख्य पाठ में मूल के पुल्लिंग एकवचन प्रतिनिधिक रूप को बनाए रखा गया है, जबकि पादटिप्पणी उसके वितरणात्मक आशय को स्पष्ट करती है। इससे पाठ को केवल पुरुषों तक सीमित करने का अनावश्यक निष्कर्ष भी नहीं निकाला जाता।
- issue: הַיָּשָׁר में वस्तुगत ‘ठीक’ और व्यक्ति को ‘ठीक लगने’ के बीच तनाव
  choice: जो उसकी अपनी दृष्टि में ठीक है
  alternative: जो उसे ठीक लगता है
  rationale: ‘अपनी दृष्टि में’ निजी निर्णय का संकेत पहले ही देता है। इसलिए ‘ठीक है’ मूल की अभिव्यक्ति को निकटता से रखता है और ‘लगता है’ जोड़कर अर्थ को आवश्यकता से अधिक नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वैसा ... जैसा’ तुलना को स्वाभाविक बनाता है, और दीर्घ विराम-चिह्न अगले वितरणात्मक उपवाक्य को स्पष्ट करता है।
