source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: hi
  text: परन्तु केवल वे पवित्र वस्तुएँ जो तुम्हारी हों, और तुम्हारी मन्नत की भेंटें[a], उन्हें लेकर उस स्थान पर आना जिसे यहोवा चुनेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी मन्नतें”; इब्रानी शब्द स्वयं मन्नतों को या इस बलिदानी प्रसंग में उन मन्नतों को पूरा करने के लिए लाई गई भेंटों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: पिछली आयतों में स्थानीय रूप से पशु-वध और खाने की अनुमति के बाद यह एक अपवाद और सीमा प्रस्तुत करता है; हिंदी में ‘परन्तु’ इस विरोधात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָדָשֶׁיךָ
  choice: तुम्हारी ... पवित्र वस्तुएँ
  rationale: शब्द सामान्य रूप से परमेश्वर के लिए अलग की गई पवित्र वस्तुओं को दर्शाता है; इसे किसी एक विशेष प्रकार के बलिदान तक सीमित नहीं किया गया।
- source_word: אֲשֶׁר יִהְיוּ לְךָ
  choice: जो ... तुम्हारे पास हों
  rationale: यह संबंधवाचक उपवाक्य उपासक के अधिकार या दायित्व में आने वाली पवित्र वस्तुओं को पहचानता है और हिंदी में सहज है।
- source_word: וּנְדָרֶיךָ
  choice: और तुम्हारी मन्नत की भेंटें
  rationale: शाब्दिक अर्थ ‘तुम्हारी मन्नतें’ है, पर बलिदान-संबंधी प्रसंग में इससे मन्नत पूरी करने के लिए लाई जाने वाली भेंटें अभिप्रेत हो सकती हैं; इस अर्थ-संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּשָּׂא וּבָאתָ
  choice: उन्हें लेकर ... आना
  rationale: दोनों क्रियाओं—उठाकर/लेकर चलने और आने—का आशय स्वाभाविक हिंदी में संयुक्त रूप से व्यक्त होता है, जबकि पवित्र वस्तुओं और भेंटों का कर्म भी स्पष्ट रहता है।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: व्यवस्थाविवरण में केंद्रीय उपासना-स्थल के लिए प्रयुक्त प्रमुख अभिव्यक्ति है; अगला उपवाक्य उस स्थान की पहचान करता है।
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: जिसे यहोवा चुनेगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य में परमेश्वर द्वारा निर्धारित किए जाने वाले स्थान की ओर संकेत करती है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: וּנְדָרֶיךָ का ठोस या अमूर्त अर्थ
  choice: मुख्य पाठ में ‘मन्नत की भेंटें’, पाद-टिप्पणी में ‘मन्नतें’
  alternative: केवल ‘तुम्हारी मन्नतें’
  rationale: बलिदानी प्रसंग में मन्नत पूरी करने के लिए लाई जाने वाली वस्तुएँ अभिप्रेत हो सकती हैं, किंतु इब्रानी संज्ञा स्वयं ‘मन्नतों’ को भी दर्शाती है; इसलिए वास्तविक अर्थगत तनाव को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी अपनाई गई है। ‘लेकर ... आना’ स्रोत की दो क्रमिक क्रियाओं को स्वाभाविक हिंदी में रखता है। ‘पवित्र वस्तुएँ’ जानबूझकर व्यापक है और ‘मन्नत की भेंटें’ की संभावित ठोस व्याख्या को पाद-टिप्पणी द्वारा संतुलित किया गया है।
