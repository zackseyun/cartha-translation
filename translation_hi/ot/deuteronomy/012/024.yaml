lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: तुम उसे न खाना
  rationale: निषेध के साथ द्वितीय पुरुष एकवचन और वस्तु-प्रत्यय को बनाए रखता है तथा हिन्दी में विधिक निर्देश के रूप में स्वाभाविक है।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: इस ठोस अनुष्ठानिक निर्देश में אֶרֶץ का आशय धरती की सतह है; ‘भूमि पर’ संक्षिप्त और गरिमापूर्ण है।
- source_word: תִּשְׁפְּכֶנּוּ
  choice: उसे ... उँडेल देना
  rationale: שׁפך यहाँ रक्त को बहाकर निपटाने की अपेक्षित क्रिया बताता है; ‘उँडेल देना’ हिन्दी में इस क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: כַּמָּיִם
  choice: पानी के समान
  rationale: तुलनात्मक उपमा को बिना विस्तार किए सुरक्षित रखता है।
theological_decisions:
- issue: प्रत्यय ‘उसे’ का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखा गया है और पाद-टिप्पणी में इसे आसपास के प्रसंग में उल्लिखित रक्त बताया गया है।
  alternative: स्पष्टता के लिए मुख्य पाठ में ‘रक्त’ जोड़ना।
  rationale: इब्रानी पाठ संज्ञा को दोहराने के बजाय सर्वनामिक प्रत्यय प्रयोग करता है। ‘उसे’ स्रोत की संरचना और प्रसंगगत संदर्भ दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन ‘तुम’ से इब्रानी द्वितीय पुरुष एकवचन सुरक्षित रखा गया है। भाषा स्वाभाविक, गरिमापूर्ण और विधिक निर्देश के अनुरूप है।
