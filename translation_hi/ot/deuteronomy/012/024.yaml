  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: hi
  text: तुम उसे[a] मत खाना; उसे पानी की तरह ज़मीन पर उंडेल देना।
  philosophy: optimal-equivalence
  footnotes:
