source:
  edition: WLC
  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: hi
  text: और वहाँ तुम अपने परमेश्वर याहवे के सामने खाओगे और अपने हाथ के हर काम में आनन्द मनाओगे—तुम और तुम्हारे घराने—जिसमें तुम्हारे परमेश्वर याहवे ने तुम्हें आशीष दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने हाथ के हर काम’ का अर्थ ‘अपने सभी उद्यमों’ या ‘हर उस काम जिससे तुम हाथ लगाते हो’ भी हो सकता है। हिब्रू मुहावरा शाब्दिक रूप से ‘हाथ के बढ़ाए जाने’ का है।
    reason: मִשְׁלַח יָד के शाब्दिक बिंब और ‘उद्यम/हाथ लगाने’ के स्वाभाविक मुहावरेदार अर्थ को सुरक्षित करता है।
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: और ... खाओगे
  rationale: वाव-संयुक्त पूर्ण क्रिया इस विधिक-निर्देशात्मक प्रसंग में भावी/निर्देशात्मक अर्थ रखती है; आधुनिक हिन्दी में ‘खाओगे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: आस-पास के प्रसंग में यह उस स्थान की ओर संकेत करता है जिसे यहोवा चुनेगा; मूल का संक्षिप्त संकेत बनाए रखा गया है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: לִפְנֵי को ‘के सामने’ कहना उपासना में परमेश्वर की उपस्थिति का स्वाभाविक और निकट अर्थ देता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וּשְׂמַחְתֶּם
  choice: और ... आनन्द मनाओगे
  rationale: यह पहली क्रिया के समानांतर निर्देशात्मक-भावी बल रखता है और वाचा-संबंधी सामूहिक हर्ष को व्यक्त करता है।
- source_word: מִשְׁלַח יֶדְכֶם
  choice: अपने हाथ के हर काम पर
  rationale: शाब्दिक बिंब ‘हाथ बढ़ाना/लगाना’ है और मुहावरे का आशय कार्य, उद्यम या उपलब्धि है। ‘हाथ के हर काम’ हिब्रू बिंब बचाता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: तुम और तुम्हारे घराने
  rationale: בָּתִּים यहाँ इमारतों के बजाय परिवार सहित गृहस्थ समुदायों को दर्शाता है; ‘घराने’ इस सामूहिक अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: जिसमें तुम्हारे परमेश्वर यहोवा ने तुम्हें आशीष दी है
  rationale: संबंधवाचक उपवाक्य को उस कार्य-क्षेत्र से जोड़ा गया है जिसमें परमेश्वर की आशीष मिली है। ‘तुम्हें’ हिन्दी में बहुवचन और आदरसूचक/सामूहिक एकवचन दोनों के साथ संभव है, इसलिए हिब्रू के वचन-परिवर्तन को अनावश्यक रूप से समतल नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ शीर्षक से बदलने के बजाय व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- issue: बहुवचन से सामूहिक एकवचन की ओर संबोधन-परिवर्तन
  choice: मुख्य क्रियाओं में बहुवचन-संगत ‘तुम’, और अंतिम खंड में अस्पष्ट-वचन ‘तुम्हें’
  alternative: सभी रूपों को स्पष्ट बहुवचन ‘तुम सब’ करना; सभी को एकवचन करना
  rationale: व्यवस्थाविवरण में इस्राएल को कभी बहुवचन समुदाय और कभी एक सामूहिक इकाई के रूप में संबोधित किया जाता है। हिन्दी का ‘तुम्हें’ मूल के तनाव को बिना कृत्रिम स्पष्टीकरण के रहने देता है।
- issue: אֲשֶׁר संबंधवाचक उपवाक्य का संबंध
  choice: ‘जिसमें ... आशीष दी है’ द्वारा कार्य/उद्यम के क्षेत्र से संबंध
  alternative: ‘क्योंकि ... आशीष दी है’ द्वारा कारणसूचक अर्थ
  rationale: हिब्रू אֲשֶׁר का निकटतम स्वाभाविक संबंध ‘हाथ के हर काम’ से है, यद्यपि कारणसूचक समझ भी अर्थ की दृष्टि से संभव है; इसलिए वैकल्पिक अर्थ टिप्पणी में दर्शाया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घराने’ सामूहिक पारिवारिक इकाइयों के लिए चुना गया है। ‘आनन्द’ उपासना-संबंधी हर्ष के लिए परिचित शब्द है। ईश्वरीय नाम के लिए हिन्दी में प्रचलित ‘यहोवा’ प्रयुक्त हुआ है।
