base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: hi
  text: केवल इस बात का पूरा ध्यान रखना कि तुम लहू न खाओ, क्योंकि लहू ही जीवन[a] है; और तुम मांस के साथ जीवन न खाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी נֶפֶשׁ का अनुवाद इस पद में दोनों स्थानों पर “प्राण” भी किया जा सकता है। यहाँ इसका आशय प्राणी के सजीव जीवन से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह पहले दी गई अनुमति पर एक प्रबल अपवाद या प्रतिबंध प्रस्तुत करता है।
- source_word: חֲזַק
  choice: दृढ़ निश्चय रखना
  rationale: शाब्दिक अर्थ ‘दृढ़ हो’ है, पर לְבִלְתִּי के साथ यह किसी काम से दृढ़तापूर्वक बचे रहने का आग्रह व्यक्त करता है।
- source_word: לְבִלְתִּי אֲכֹל
  choice: न खाओ
  rationale: यह निर्माण निषेध व्यक्त करता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप।
- source_word: הַדָּם
  choice: लहू
  rationale: ‘लहू’ आधुनिक धार्मिक-बाइबलीय हिन्दी में सहज, ठोस और गरिमापूर्ण है; दोनों उल्लेखों में संगति रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है।
- source_word: הַנָּפֶשׁ / הַנֶּפֶשׁ
  choice: जीवन
  rationale: इस आहार-विधान के संदर्भ में נֶפֶשׁ प्राणी के सजीव जीवन को दर्शाता है, न कि अनिवार्यतः शरीर से पृथक किसी तत्त्व को।
- source_word: וְלֹא תֹאכַל
  choice: इसलिए ... न खाना
  rationale: कानूनी निर्देश का निषेधात्मक बल सुरक्षित है; ‘इसलिए’ पिछले कारण और इस निषेध के तार्किक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: मांस के साथ जीवन
  rationale: मूल की ठोस छवि और נֶפֶשׁ की पिछली आवृत्ति के साथ शाब्दिक संबंध बनाए रखता है।
theological_decisions:
- issue: आहार-विधान में נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण; आत्मा
  rationale: यहाँ पद लहू के निषेध को इस आधार पर समझाता है कि लहू प्राणी का जीवन है। ‘आत्मा’ बाद के शरीर-आत्मा द्वैत का अर्थ जगा सकता है, जिसे इब्रानी पाठ यहाँ आवश्यक नहीं बनाता; फुटनोट वास्तविक शाब्दिक विकल्प सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘दृढ़ निश्चय रखना’ इब्रानी मुहावरे के आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है। ‘लहू’ और ‘मांस’ ठोस आहार-विधान की भाषा बनाए रखते हैं।
