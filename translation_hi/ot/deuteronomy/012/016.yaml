  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: hi
  text: केवल लहू न खाना; उसे पानी की तरह भूमि पर उँडेल देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यह शब्द पिछली अनुमति पर प्रतिबंध लगाता है। हिन्दी में ‘परन्तु’ उस अपवादात्मक मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַדָּם
  choice: लहू को
  rationale: निश्चित उपपद यहाँ वध किए गए पशु के लहू की ओर संकेत करता है; हिन्दी में कर्मचिह्न ‘को’ के साथ ‘लहू’ स्वाभाविक है।
- source_word: לֹא תֹאכֵלוּ
  choice: न खाना
  rationale: निषेधात्मक कानूनी निर्देश को संक्षिप्त और सीधे आज्ञार्थक रूप में प्रस्तुत करता है; बहुवचन संबोधन हिन्दी में प्रसंग से स्पष्ट है।
- source_word: עַל הָאָרֶץ
  choice: भूमि पर
  rationale: इस ठोस क्रिया के संदर्भ में אֶרֶץ का आशय धरती की सतह है; ‘भूमि पर’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: תִּשְׁפְּכֶנּוּ
  choice: उसे उँडेल देना
  rationale: क्रिया जानबूझकर बहाकर डालने का भाव देती है और सर्वनाम प्रत्यय लहू की ओर लौटता है।
- source_word: כַּמָּיִם
  choice: पानी के समान
  rationale: मूल उपमा को स्पष्ट, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: आहार-विधान में लहू का व्यवहार
  choice: लहू खाने का सीधा निषेध और उसे भूमि पर पानी के समान उँडेलने का निर्देश
  alternative: इसमें बाद की प्रतीकात्मक या धार्मिक व्याख्या जोड़ना
  rationale: पद एक ठोस कानूनी निर्देश देता है; अनुवाद को उसके सीधे अर्थ से आगे कोई बाद की धर्मवैचारिक व्याख्या नहीं जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण कानूनी निर्देश। ‘लहू’ बाइबलीय संदर्भ में सामान्य पाठकों के लिए परिचित है; वाक्य में मूल के प्रतिबंध और उपमा दोनों सुरक्षित हैं।
