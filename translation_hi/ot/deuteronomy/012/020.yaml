id: DEU.12.20
reference: Deuteronomy 12:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי יַרְחִיב֩ יְהוָ֨ה אֱלֹהֶ֥י/ךָ אֶֽת גְּבֽוּלְ/ךָ֮ כַּ/אֲשֶׁ֣ר דִּבֶּר לָ/ךְ֒ וְ/אָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי תְאַוֶּ֥ה נַפְשְׁ/ךָ֖ לֶ/אֱכֹ֣ל בָּשָׂ֑ר בְּ/כָל אַוַּ֥ת נַפְשְׁ/ךָ֖ תֹּאכַ֥ל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: hi
  text: जब तुम्हारा परमेश्वर यहोवा तुम्हारे क्षेत्र को बढ़ाए, जैसा उसने तुमसे कहा है, और तुम कहो, “मैं मांस खाना चाहता हूँ,” क्योंकि तुम्हारा मन मांस खाने को तरसता है, तब तुम अपने मन की पूरी इच्छा के अनुसार मांस खा सकते हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: तुम्हारे क्षेत्र को बढ़ाए
  rationale: सीमा बढ़ाने की इब्रानी अभिव्यक्ति यहाँ भूमि-क्षेत्र के विस्तार को दर्शाती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: जैसा उसने तुमसे कहा है
  rationale: דבר का मूल अर्थ ‘कहना/बोलना’ है। संदर्भ में प्रतिज्ञा निहित हो सकती है, पर पाठ में अलग से ‘प्रतिज्ञा’ शब्द नहीं है।
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: और तुम कहो, “मैं मांस खाना चाहता हूँ”
  rationale: इब्रानी इच्छासूचक रूप को हिन्दी में स्वाभाविक प्रत्यक्ष कथन के रूप में दिया गया है।
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: तुम्हारा मन ... तरसता है
  rationale: נפש यहाँ समूचे व्यक्ति की भूख/इच्छा का बोध कराता है; ‘मन’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: अपने मन की पूरी इच्छा के अनुसार
  rationale: मूल की ‘अपनी नेफेश की सारी अभिलाषा’ संरचना को समझने योग्य हिन्दी में रखते हुए उसकी व्यापकता बचाई गई है।
- source_word: תֹּאכַל בָּשָׂר
  choice: मांस खा सकते हो
  rationale: संदर्भ में अपूर्ण क्रिया अनुमति का भाव देती है; हिन्दी में ‘खा सकते हो’ इसे स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, चतुरक्षरी व्यक्तिवाचक नाम है; इसलिए नाम को नाम के रूप में रखा गया है।
- issue: כַּאֲשֶׁר דִּבֶּר לָךְ में प्रतिज्ञा का भाव
  choice: जैसा उसने तुमसे कहा है
  alternative: जैसा उसने तुमसे प्रतिज्ञा की है
  rationale: विस्तारित भूमि का संदर्भ प्रतिज्ञा की ओर संकेत करता है, फिर भी मूल क्रिया केवल ‘कहा’ है; अनुवाद पाठ की शब्दगत खुलावट बनाए रखता है।
- issue: נפש का निरूपण
  choice: मन
  alternative: प्राण / आत्मा
  rationale: यहाँ विषय भोजन की मानवीय लालसा है, आत्मा की अमूर्त सत्ता नहीं; ‘मन’ अनावश्यक धर्मवैज्ञानिक अर्थ जोड़े बिना आशय पहुँचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। वाक्य में विधिक अनुमति का स्वर रखा गया है, पर अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
