base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: hi
  text: तुम उनकी वेदियों को ढा दो, उनके पूजा-स्तंभों को चकनाचूर कर दो, उनके अशेरा-खंभों[a] को आग में जला दो, उनके देवताओं की तराशी हुई मूर्तियों[b] को काट डालो, और उस स्थान से उनका नाम मिटा दो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके अशेरिम” अथवा “उनके पूजा के काष्ठ-स्तंभ।” इब्रानी शब्द अशेरा से जुड़ी पूजा-वस्तुओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके देवताओं की मूर्तियाँ।” इब्रानी शब्द इस बात पर बल देता है कि ये तराशकर बनाई गई उपासना-वस्तुएँ थीं।
    reason: lexical_alternative
  - marker: c
    text: “उनका नाम मिटा दो” उस उपासना-स्थल से उनकी स्मृति और वहाँ उनसे जुड़ी उपासना-उपस्थिति को समाप्त करने का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: उनकी वेदियों को ढा देना
  rationale: נתץ निर्मित संरचनाओं को गिराने या ध्वस्त करने का बोध देता है; ‘ढा देना’ वेदियों के संदर्भ में स्वाभाविक और सशक्त है।
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: उनके पूजा-स्तंभों को चकनाचूर कर देना
  rationale: מַצֵּבָה यहाँ उपासना में प्रयुक्त खड़े पत्थर या स्तंभ को दर्शाता है, और שבר का गहन रूप बलपूर्वक तोड़ने का अर्थ देता है। ‘पूजा-स्तंभ’ वस्तु के धार्मिक प्रयोजन को स्पष्ट करता है।
- source_word: אֲשֵׁרֵיהֶם
  choice: उनके अशेरा-खंभों
  rationale: यह विशिष्ट इब्रानी सांस्कृतिक शब्द अशेरा से जुड़े पूजा-विषयक काष्ठ-खंभों या प्रतीकों को सूचित करता है। लिप्यंतरण के साथ ‘खंभों’ का प्रयोग विशिष्टता और बोधगम्यता दोनों बनाए रखता है।
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: आग में जला देना
  rationale: इब्रानी में आग का स्पष्ट उल्लेख है; यह हिंदी में ठोस और स्वाभाविक अभिव्यक्ति है।
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: उनके देवताओं की तराशी हुई मूर्तियों
  rationale: פֶסֶל मानव द्वारा तराशकर बनाई गई उपासना-मूर्ति पर बल देता है। ‘तराशी हुई मूर्तियाँ’ इस निर्मित स्वरूप को ‘मूर्तियों’ मात्र से अधिक स्पष्ट रूप से रखता है।
- source_word: תְּגַדֵּעוּן
  choice: काट गिराना
  rationale: גדע काटकर गिराने का अर्थ देता है। यह क्रिया यहाँ उन पूजा-वस्तुओं के विनाश का ठोस चित्र सुरक्षित रखती है।
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: उनका नाम मिटा देना
  rationale: शाब्दिक ‘नाम नष्ट करना’ हिंदी में अस्वाभाविक है; ‘नाम मिटा देना’ स्मृति, पहचान और उस स्थल पर प्रतिष्ठित उपस्थिति को समाप्त करने वाला इब्रानी मुहावरा सुरक्षित रखता है।
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: उस स्थान से
  rationale: यह पूर्वसर्गीय वाक्यांश का सीधा, संक्षिप्त और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: אֲשֵׁרֵיהֶם की सांस्कृतिक और धार्मिक पहचान
  choice: अशेरा-खंभों
  alternative: अशेरा; पवित्र खंभों; पूजा के काष्ठ-स्तंभों
  rationale: ‘अशेरा-खंभों’ विशिष्ट कनानी संदर्भ को बचाता है, पर वस्तुओं को स्वयं देवी के समान ठहराने का अनावश्यक निर्णय नहीं करता। पादटिप्पणी वास्तविक शब्दार्थगत विकल्प बताती है।
- issue: פְסִילֵי אֱלֹהֵיהֶם का स्वरूप
  choice: उनके देवताओं की तराशी हुई मूर्तियाँ
  alternative: उनकी मूर्तियाँ; उनके देवताओं की गढ़ी हुई प्रतिमाएँ
  rationale: यह अनुवाद इब्रानी में निहित मानव-निर्मित और तराशी हुई उपासना-वस्तु की ठोस प्रकृति बनाए रखता है, बिना केवल व्याख्यात्मक धार्मिक संज्ञा ‘मूर्तिपूजक प्रतिमाएँ’ जोड़ने के।
- issue: ‘उनका नाम मिटा देना’ का आशय
  choice: मुख्य पाठ में इब्रानी मुहावरे को बनाए रखना
  alternative: उस स्थान से उनकी स्मृति और उपासना का हर चिह्न मिटा देना
  rationale: ‘नाम’ को केवल लिखित नाम या केवल प्रतिष्ठा मानना संदर्भ को संकीर्ण कर देगा। मुख्य पाठ मूल की संक्षिप्तता और संभावित व्यापकता रखता है; पादटिप्पणी स्थल पर स्मरण और प्रतिष्ठित उपस्थिति का संकेत देती है।
translation_notes:
  register: आधुनिक मानक हिंदी का आज्ञार्थक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। समानांतर क्रियाओं—‘ढा देना’, ‘चकनाचूर कर देना’, ‘जला देना’, ‘काट गिराना’, ‘मिटा देना’—से इब्रानी पद की क्रमिक और प्रबल लय सुरक्षित रखी गई है।
