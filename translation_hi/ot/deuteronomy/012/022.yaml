id: DEU.12.22
reference: Deuteronomy 12:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: hi
  text: परन्तु जैसे चिकारे और हिरन का मांस खाया जाता है,[a] वैसे ही तुम इसका मांस खा सकते हो; अशुद्ध और शुद्ध व्यक्ति समान रूप से इसे खा सकते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुरंग और नर हिरन।” इन पशु-नामों की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात अनुष्ठानिक रूप से अशुद्ध और अनुष्ठानिक रूप से शुद्ध—दोनों प्रकार के व्यक्ति इसे खा सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पहले दिए निर्देश पर एक योग्यता या सीमा लगाता है; ‘परन्तु’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: यह सहसंबंधी तुलना जंगली पशुओं का मांस खाने और प्रसंग में उल्लिखित पशु का मांस खाने के बीच समानता बनाए रखती है।
- source_word: יֵאָכֵל
  choice: का मांस खाया जाता है
  rationale: निफ़अल रूप कर्मवाच्य है। हिन्दी में पशुओं को स्वयं ‘खाया जाता है’ कहने के बजाय ‘का मांस’ जोड़ना अधिक स्वाभाविक है।
- source_word: הַצְּבִי
  choice: चिकारा
  rationale: צְבִי गज़ेल-प्रकार के जंगली पशु को दर्शाता है; आधुनिक हिन्दी में ‘चिकारा’ एक सहज और निकट समतुल्य है।
- source_word: הָאַיָּל
  choice: हिरन
  rationale: אַיָּל हिरन को, कभी विशेषतः नर हिरन को, सूचित कर सकता है; ‘हिरन’ अनावश्यक रूप से लिंग निश्चित किए बिना सामान्य अर्थ बनाए रखता है।
- source_word: תֹּאכְלֶנּוּ
  choice: तुम इसका मांस खा सकते हो
  rationale: व्यवस्थागत प्रसंग में अपूर्ण क्रिया अनुमति व्यक्त करती है। ‘खा सकते हो’ इसे आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: הַטָּמֵא
  choice: अशुद्ध व्यक्ति
  rationale: यहाँ शब्द नैतिक बुराई नहीं, अनुष्ठानिक स्थिति को सूचित करता है; ‘अशुद्ध’ मुख्य पारिभाषिक विरोध को बनाए रखता है और ‘व्यक्ति’ आशय स्पष्ट करता है।
- source_word: הַטָּהוֹר
  choice: शुद्ध व्यक्ति
  rationale: यह טָמֵא का अनुष्ठानिक प्रतिपद है; ‘शुद्ध व्यक्ति’ पारिभाषिक जोड़ी और मानवीय संदर्भ दोनों को स्पष्ट रखता है।
- source_word: יַחְדָּו
  choice: समान रूप से
  rationale: यहाँ आशय साथ बैठकर खाने का नहीं, दोनों वर्गों को समान अनुमति मिलने का है।
- source_word: יֹאכְלֶנּוּ
  choice: इसे खा सकते हैं
  rationale: दूसरा अपूर्ण क्रियारूप भी विधिक अनुमति व्यक्त करता है और पहले कथन के अनुरूप है।
theological_decisions:
- issue: शुद्धता और अशुद्धता की शब्दावली
  choice: अशुद्ध और शुद्ध व्यक्ति
  alternative: अनुष्ठानिक रूप से अशुद्ध और अनुष्ठानिक रूप से शुद्ध व्यक्ति
  rationale: मूल के संक्षिप्त पारिभाषिक विरोध को मुख्य पाठ में बनाए रखा गया है। पद का आशय नैतिक चरित्र नहीं, अनुष्ठानिक स्थिति है; यह बात पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘का मांस’ हिन्दी मुहावरे के अनुसार जोड़ा गया है; इससे मूल का आशय नहीं बदलता। ‘अशुद्ध’ और ‘शुद्ध’ व्यवस्था-विषयक पारिभाषिक शब्दों के रूप में रखे गए हैं, जबकि उनका अनुष्ठानिक आशय पादटिप्पणी में समझाया गया है।
