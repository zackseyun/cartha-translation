source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: hi
  text: 'तब वह स्थान, जिसे तुम्हारा परमेश्वर यहोवा अपने नाम को वहाँ वास कराने के लिए चुनेगा—वहीं तुम वह सब कुछ ले आना जिसकी आज्ञा मैं तुम्हें दे रहा हूँ: अपनी होमबलियाँ, अपने बलिदान, अपने दशमांश, तुम्हारे हाथ का अंशदान, और तुम्हारी सब सबसे उत्तम मन्नतें जो तुम यहोवा के लिए मानोगे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: तब वह स्थान, जिसे ... चुनेगा
  rationale: भविष्य की परिस्थिति और पिछले निर्देशों से आगे बढ़ते क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी लिप्यंतरण के द्वारा इब्रानी व्यक्तिगत ईश-नाम को उपाधि से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: अपने नाम को वहाँ वास कराने के लिए
  rationale: हिफ़ील की कारणवाचक शक्ति और व्यवस्थाविवरण की ‘नाम के वास’ वाली अभिव्यक्ति दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: שָׁמָּה תָבִיאוּ
  choice: वहीं तुम ... ले आना
  rationale: שָׁמָּה की दिशात्मक शक्ति और תָבִיאוּ के आदेशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: वह सब कुछ ... जिसकी आज्ञा मैं तुम्हें दे रहा हूँ
  rationale: מְצַוֶּה के जारी क्रियात्मक पक्ष को ‘दे रहा हूँ’ से दर्शाया गया है।
- source_word: עוֹלֹתֵיכֶם
  choice: अपने होमबलि
  rationale: पूर्णतः जलाए जाने वाले बलिदान के लिए स्थापित और संक्षिप्त हिन्दी बाइबलीय पद।
- source_word: זִבְחֵיכֶם
  choice: अपने बलिदान
  rationale: स्रोत शब्द के व्यापक अर्थ को बनाए रखता है; इसे किसी एक संकुचित बलिदान-प्रकार तक सीमित नहीं करता।
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: अपने दशमांश
  rationale: दसवें अंश की भेंट के लिए सटीक और परिचित हिन्दी पद।
- source_word: תְרֻמַת יֶדְכֶם
  choice: अपने हाथ का अंशदान
  rationale: ‘हाथ’ की ठोस इब्रानी अभिव्यक्ति को बनाए रखते हुए व्यक्तिगत रूप से दिए गए अंश का अर्थ संप्रेषित करता है।
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: अपनी उन सब उत्तम मन्नतों की वस्तुएँ
  rationale: מִבְחַר का ‘उत्तम/चुना हुआ’ अर्थ और मन्नत के अंतर्गत लाई जाने वाली वस्तुओं का प्रसंगगत आशय व्यक्त करता है, पर ‘बलि’ जैसा अधिक संकुचित पद नहीं जोड़ता।
- source_word: אֲשֶׁר תִּדְּרוּ לַיהוָה
  choice: जिनकी मन्नत तुम यहोवा से मानोगे
  rationale: भविष्यसूचक क्रिया और यहोवा की ओर निर्देशित मन्नत को सहज हिन्दी में रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी पाठकों में अधिक पहचाना जाने वाला रूप चुना गया है।
- issue: לְשַׁכֵּן שְׁמוֹ שָׁם में ‘नाम’ का वास
  choice: अपने नाम को वहाँ वास कराने के लिए
  alternative: ताकि उसका नाम वहाँ वास करे
  rationale: कारणवाचक रूप को मुख्य पाठ में स्पष्ट रखा गया है और यह नहीं कहा गया कि परमेश्वर का समूचा अस्तित्व उस स्थान में सीमित है।
- issue: מִבְחַר נִדְרֵיכֶם का आशय
  choice: उत्तम मन्नतों की वस्तुएँ
  alternative: सबसे उत्तम मन्नतें
  rationale: संदर्भ में चुने हुए स्थान पर कुछ लाया जा रहा है, इसलिए निहित वस्तुओं को स्पष्ट किया गया है; फिर भी उन्हें किसी विशिष्ट बलिदान-वर्ग के रूप में परिभाषित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘होमबलि’, ‘दशमांश’ और ‘मन्नत’ जैसे स्थापित धार्मिक शब्द प्रसंग की सटीकता के लिए बनाए रखे गए हैं।
