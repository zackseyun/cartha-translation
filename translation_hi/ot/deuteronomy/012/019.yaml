id: DEU.12.19
reference: Deuteronomy 12:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲזֹ֖ב אֶת הַ/לֵּוִ֑י כָּל יָמֶ֖י/ךָ עַל אַדְמָתֶֽ/ךָ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: hi
  text: इस बात का ध्यान रखना कि तुम अपनी भूमि पर[b] अपने जीवन भर लेवी[a] को न त्यागो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “लेवियों”; इब्रानी में एकवचन “लेवी” है, जो सम्भवतः पूरे लेवी-वर्ग के लिए प्रतिनिधिक रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: अथवा “अपने देश में।” इब्रानी में शाब्दिक रूप से “अपनी भूमि पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: इस बात का ध्यान रखना
  rationale: निफ़अल आज्ञार्थक और לְךָ मिलकर स्वयं सावधान रहने की चेतावनी देते हैं। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और चेतावनी का बल बनाए रखता है।
- source_word: פֶּן
  choice: कि ... न
  rationale: यह नकारात्मक चेतावनी आरम्भ करता है; हिन्दी में ‘कि ... न’ इसका सहज और स्पष्ट रूप है।
- source_word: תַּעֲזֹב
  choice: न त्यागो
  rationale: עזב का अर्थ छोड़ना, त्यागना या बेसहारा छोड़ देना हो सकता है। यहाँ ‘त्यागो’ लेवी के प्रति सामाजिक और वाचा-संबंधी दायित्व की गंभीरता को बनाए रखता है।
- source_word: אֶת הַלֵּוִי
  choice: लेवी
  rationale: इब्रानी में निश्चित एकवचन है, जो संभवतः पूरे वर्ग का प्रतिनिधित्व करता है। हिन्दी में एकवचन रखकर स्रोत की व्याकरणिक बनावट सुरक्षित रहती है।
- source_word: כָּל יָמֶיךָ
  choice: अपने जीवन भर
  rationale: शाब्दिक अर्थ ‘अपने सब दिनों’ है; ‘अपने जीवन भर’ आधुनिक हिन्दी में स्वाभाविक रूप से वही कालगत व्यापकता व्यक्त करता है।
- source_word: עַל אַדְמָתֶךָ
  choice: अपनी भूमि पर
  rationale: अדמה भूमि/धरती को और עַל सामान्यतः ‘पर’ को व्यक्त करता है। यह रूप स्रोत के निकट रहते हुए हिन्दी में समझने योग्य है।
theological_decisions:
- issue: लेवी के लिए प्रतिनिधिक एकवचन
  choice: लेवी
  alternative: लेवियों
  rationale: मूल पाठ में लेखयुक्त एकवचन है, जो सम्भवतः इस्राएल में लेवी-वर्ग के किसी भी सदस्य का प्रतिनिधित्व करता है। एकवचन रखने से यह स्रोतगत विशेषता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञा का संबोधन मूल पाठ के अनुसार एकवचन ‘तुम’ में है; ‘भूमि पर’ स्रोत के पूर्वसर्ग को जानबूझकर सुरक्षित रखता है।
