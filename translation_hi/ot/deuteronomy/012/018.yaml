  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: hi
  text: बल्कि तुम उसे अपने परमेश्वर याहवे के सामने उस स्थान पर खाओगे जिसे तुम्हारा परमेश्वर याहवे चुनेगा—तुम, तुम्हारा बेटा और बेटी, तुम्हारा दास और दासी, और तुम्हारे नगर में रहने वाला लेवी[a]—और तुम अपने परमेश्वर याहवे के सामने अपने हर कार्य में आनंद मनाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे फाटकों के भीतर”; यह इब्रानी मुहावरा स्थानीय नगर या समुदाय में रहनेवालों को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारे हाथ के हर भेजे जाने में”; आशय है, तुम्हारे हर काम या उपक्रम में।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पिछले निषेध के विपरीत केवल अनुमत विकल्प प्रस्तुत करता है; ‘बल्कि’ आधुनिक हिन्दी में इस प्रतिबंधात्मक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे के सामने
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/उपस्थिति में’ है; ‘के सामने’ निकट और सहज है, और याहवे व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है।
- source_word: תֹּאכְלֶנּוּ
  choice: तुम उसे ... खाओगे
  rationale: द्वितीय पुरुष एकवचन के साथ पुल्लिंग एकवचन कर्म-प्रत्यय को ‘तुम उसे’ से रखा गया है; व्यवस्था-संबंधी प्रसंग में भविष्यत् रूप निर्देशात्मक बल रखता है।
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר ... בּוֹ
  choice: उस स्थान पर जिसे ... चुनेगा
  rationale: व्यवस्थाविवरण में चुने हुए आराधना-स्थान की मानक अभिव्यक्ति है; בּוֹ का संबंध हिन्दी वाक्य-रचना में ‘उस स्थान पर’ से स्वाभाविक रूप से समाहित है।
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: तुम्हारा दास और दासी
  rationale: इब्रानी के पुरुष और स्त्री घरेलू सेवकों के स्पष्ट भेद को संक्षिप्त, प्रचलित हिन्दी में बनाए रखता है।
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: तुम्हारे नगर में रहनेवाला लेवीवंशी
  rationale: ‘फाटकों के भीतर’ स्थानीय नगर अथवा समुदाय के लिए इब्रानी नागरिक मुहावरा है; मुख्य पाठ में उसका अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְשָׂמַחְתָּ
  choice: तुम ... आनन्द मनाओगे
  rationale: क्रिया सामुदायिक वाचा-आराधना के सक्रिय उत्सव और हर्ष को दर्शाती है; ‘आनन्द मनाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: उस हर काम में ... जिसमें तुम हाथ लगाते हो
  rationale: हाथ बढ़ाने/लगाने का चित्र बनाए रखते हुए इब्रानी मुहावरे का आशय—हर काम या उपक्रम—सहज हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट आधुनिक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: निर्देशात्मक अपूर्ण क्रियाओं का बल
  choice: खाओगे ... आनन्द मनाओगे
  alternative: खाना ... आनन्द मनाना; खाओ ... आनन्द मनाओ
  rationale: इब्रानी अपूर्ण रूप इस कानूनी प्रसंग में निर्देश देते हैं। हिन्दी का भविष्यत् रूप व्यवस्था-वचन की निर्देशात्मक शैली को बिना अनावश्यक कठोरता जोड़े बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किंतु सहज शैली अपनाई गई है। संबोधन का इब्रानी एकवचन ‘तुम’ पूरे पद में बनाए रखा गया है। लंबी घरेलू सूची को डैश और फिर नए वाक्य से व्यवस्थित किया गया है ताकि अर्थ स्पष्ट रहे।
