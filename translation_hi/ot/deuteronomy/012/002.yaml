  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: hi
  text: जिन जातियों को तुम बेदखल कर रहे हो, उन्होंने ऊँचे पहाड़ों पर, पहाड़ियों पर और हर हरे-भरे पेड़ के नीचे जिन स्थानों पर अपने देवताओं की सेवा[a] की, उन सभी स्थानों को तुम निश्चय ही नष्ट कर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपासना की।” इब्रानी क्रिया का अर्थ धार्मिक भाव में किसी देवता की सेवा या उपासना करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: निश्चय ही नष्ट कर देना
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute आज्ञा को प्रबल बनाता है। यह चयन उस जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना यह आवश्यक रूप से जोड़ने के कि विनाश की मात्रा 'पूर्णतः' ही है।
- source_word: הַמְּקֹמוֹת
  choice: उन सभी स्थानों
  rationale: यहाँ מָקוֹם उपासना से जुड़े ठोस स्थानों को सूचित करता है। 'स्थान' सरल और पर्याप्त रूप से व्यापक है।
- source_word: עָבְדוּ שָׁם
  choice: जिन-जिन स्थानों में ... सेवा की
  rationale: עבד देवताओं के संबंध में धार्मिक सेवा अथवा उपासना का अर्थ दे सकता है। 'सेवा की' मूल क्रिया के निकट रहता है; फुटनोट अधिक स्पष्ट विकल्प देता है। हिन्दी वाक्य-रचना में שָׁם का अर्थ सम्बन्धवाचक 'जिन-जिन स्थानों में' से व्यक्त किया गया है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: व्यवस्थाविवरण के संदर्भ में यह देश की गैर-इस्राएली जातियों को सूचित करता है। 'जातियाँ' आधुनिक हिन्दी बाइबलीय शैली में स्वाभाविक है और बाद की धार्मिक श्रेणी नहीं थोपता।
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: जिन जातियों को तुम उनके अधिकार से निकाल रहे हो
  rationale: विजय के संदर्भ में ירשׁ पहले निवासियों को उनके अधिकार/कब्जे से हटाकर अधिकार लेने का भाव रखता है। यह अनुवाद उस विस्थापन को स्पष्ट करता है और 'विरासत में पाना' जैसे भ्रामक अर्थ से बचता है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने देवताओं
  rationale: बहुवचन और सम्बन्ध को सीधे व्यक्त करता है; हिन्दी में वाक्य के कर्ता की ओर लौटने के कारण 'अपने' स्वाभाविक है।
- source_word: עַל הֶהָרִים הָרָמִים
  choice: ऊँचे पहाड़ों पर
  rationale: संज्ञा और विशेषण का सीधा, स्वाभाविक अनुवाद है और ऊँचे उपासना-स्थलों का संकेत बनाए रखता है।
- source_word: הַגְּבָעוֹת
  choice: पहाड़ियों पर
  rationale: גבעות का सीधा बहुवचन अनुवाद; 'चोटियों' जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: हर हरे-भरे पेड़ के नीचे
  rationale: רַעֲנָן ताजी, घनी और फलती-फूलती हरियाली का भाव देता है। 'हरा-भरा' आधुनिक हिन्दी में 'हरा पेड़' से अधिक स्वाभाविक और अर्थपूर्ण है।
theological_decisions:
- issue: अन्य देवताओं की उपासना से जुड़े स्थानों के विरुद्ध आज्ञा का स्वरूप
  choice: आज्ञा का प्रत्यक्ष लक्ष्य वे सभी ठोस स्थान हैं जहाँ देश की जातियाँ अपने देवताओं की सेवा करती थीं।
  alternative: इसे व्यापक रूप से उन जातियों की उपासना-प्रथाओं को मिटाने की आज्ञा के रूप में कहा जा सकता था।
  rationale: इब्रानी पाठ में क्रिया का प्रत्यक्ष कर्म 'सभी स्थान' है, स्वयं प्रथाएँ नहीं। इसलिए अनुवाद ठोस स्थानों पर केंद्रित रहता है और व्यापक निहितार्थ को पाठ पर नहीं थोपता।
- issue: עבד का धार्मिक अर्थ
  choice: मुख्य पाठ में 'सेवा की' रखा गया है।
  alternative: '''उपासना की''।'
  rationale: मूल क्रिया सेवा और धार्मिक उपासना दोनों का भाव रख सकती है। मुख्य पाठ मूल शब्द के निकट रहता है और फुटनोट धार्मिक अर्थ स्पष्ट करता है, जिससे वास्तविक शाब्दिक विस्तार सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आज्ञा का जोर 'निश्चय ही' से व्यक्त हुआ है। लम्बे इब्रानी सम्बन्धवाचक ढाँचे को हिन्दी के स्वाभाविक क्रम में रखा गया है, जबकि सभी भौगोलिक तत्व और उपासना-संबंधी अर्थ सुरक्षित हैं।
