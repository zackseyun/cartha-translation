base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: hi
  text: शापित हो वह जो अपने पिता की पत्नी[a] के साथ सहवास करता है, क्योंकि उसने अपने पिता के वस्त्र का किनारा[b] उघाड़ा है। और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में ‘पिता की पत्नी’ से सौतेली माँ अभिप्रेत हो सकती है, पर इब्रानी पाठ स्पष्ट रूप से ‘सौतेली माँ’ नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘अपने पिता के वस्त्र का किनारा उघाड़ा’ है। यह यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है और लैव्यव्यवस्था 18:8 तथा 20:11 की ‘पिता की नग्नता उघाड़ने’ वाली भाषा से संबंधित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा के शाप की सूत्रात्मक घोषणा है; ‘शापित हो’ आधुनिक हिन्दी में स्पष्ट और विधिक-धार्मिक प्रसंग के अनुकूल है।
- source_word: שֹׁכֵב עִם
  choice: के साथ सहवास करता है
  rationale: यह इब्रानी मुहावरा यौन-संबंध का द्योतक है। ‘सहवास करता है’ गरिमापूर्ण, स्पष्ट और कानूनी प्रसंग के अनुरूप है।
- source_word: אֵשֶׁת אָבִיו
  choice: अपने पिता की पत्नी
  rationale: इब्रानी में ठीक यही संबंध व्यक्त हुआ है। ‘सौतेली माँ’ कहने से संभावित संदर्भ तो स्पष्ट होता, पर मूल पाठ से अधिक निश्चितता जुड़ जाती।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शाप का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: גִלָּה כְּנַף אָבִיו
  choice: अपने पिता के वस्त्र का आँचल उघाड़ा है
  rationale: यह अनुवाद כָּנָף के ‘किनारा/आँचल’ वाले दृश्य रूपक और גלה के ‘उघाड़ना’ अर्थ को बनाए रखता है। प्रसंग में यह यौन मर्यादा और पिता के वैवाहिक अधिकार से जुड़ा शिष्टोक्तिपूर्ण कथन है।
- source_word: וְאָמַר כָּל הָעָם
  choice: और सब लोग कहें
  rationale: यह सामूहिक वाचा-प्रत्युत्तर का सूत्र है; हिन्दी में विधिक-आदेशात्मक भाव सहज रूप से बना रहता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: मान्य और व्यापक हिन्दी लिप्यंतरण मूल उपासना-संबंधी प्रत्युत्तर को सुरक्षित रखता है।
theological_decisions:
- issue: यौन निषेध के प्रसंग में כְּנַף אָבִיו के शिष्टोक्तिपूर्ण रूपक का अनुवाद
  choice: मुख्य पाठ में ‘अपने पिता के वस्त्र का आँचल उघाड़ा है’ रखकर मूल रूपक को सुरक्षित किया गया है।
  alternative: ‘अपने पिता की नग्नता उघाड़ी है’ अथवा ‘अपने पिता के विवाह-संबंध का उल्लंघन किया है’
  rationale: पहला विकल्प लैव्यव्यवस्था 18:8 और 20:11 की संबंधित भाषा को अधिक प्रत्यक्ष करता है, जबकि दूसरा अर्थ की व्याख्या कर देता है। मूल संज्ञा כָּנָף का अर्थ ‘पंख/किनारा/वस्त्र का छोर’ है; इसलिए पाठ की वास्तविक अस्पष्टता और अंतर्पाठीय तनाव को मुख्य अनुवाद तथा पादटिप्पणी के माध्यम से बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘सहवास’ स्पष्ट होते हुए भी अशिष्ट नहीं है। ‘वस्त्र का आँचल’ मूल बिंब को बचाता है; उसकी असामान्यता को पादटिप्पणी स्पष्ट करती है।
