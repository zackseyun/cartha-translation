base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/017.yaml
  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: hi
  text: शापित हो वह जो अपने पड़ोसी का सीमा-चिह्न[a] खिसकाता है। और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीमा।” इब्रानी शब्द संपत्ति की सीमा अथवा उसे दिखाने वाले चिह्न को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा के संदर्भ में शाप की औपचारिक घोषणा है। ‘शापित हो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके न्यायिक और गंभीर भाव को बनाए रखता है।
- source_word: מַסִּיג
  choice: जो … खिसकाता है
  rationale: कृदन्त ऐसे व्यक्ति को दर्शाता है जो यह काम करता है। ‘खिसकाता है’ सीमा को धोखे से दूसरी जगह करने का भाव स्पष्ट करता है; केवल ‘हटाता है’ कहना अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: גְּבוּל
  choice: सीमा-चिह्न
  rationale: भूमि-संबंधी इस कानूनी प्रसंग में शब्द संपत्ति की सीमा अथवा उसे दिखाने वाले चिह्न को सूचित करता है। ‘सीमा-चिह्न’ सामान्य पाठक के लिए अपराध का स्वरूप स्पष्ट करता है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी का
  rationale: यहाँ शब्द समुदाय के दूसरे सदस्य को दर्शाता है। ‘अपने पड़ोसी का’ हिन्दी में स्वाभाविक है और इब्रानी के एकवचन संबंधसूचक रूप को बनाए रखता है।
- source_word: וְאָמַר כָּל הָעָם
  choice: तब सब लोग कहें
  rationale: यह सामूहिक वाचा-पुष्टि की विधिपरक प्रतिक्रिया है। ‘कहें’ निर्देशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सब लोग’ मूल पाठ की व्यापकता को बनाए रखता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: यह स्थापित आराधनात्मक और सामुदायिक प्रत्युत्तर है, जो कही गई बात की पुष्टि और स्वीकृति व्यक्त करता है।
theological_decisions:
- issue: वाचा के कानूनी संदर्भ में शाप-सूत्र
  choice: शापित हो वह, जो अपने पड़ोसी का सीमा-चिह्न खिसकाता है
  alternative: धिक्कारा जाए वह, जो अपने पड़ोसी की सीमा हटाता है
  rationale: चुना हुआ रूप विरासत में मिली भूमि पर कपटपूर्ण अतिक्रमण के विरुद्ध औपचारिक वाचा-शाप की गंभीरता बनाए रखता है। ‘सीमा-चिह्न’ संपत्ति की सीमा वाले प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी मूल शब्द की संभावित व्यापकता सुरक्षित रखती है।
- issue: पुल्लिंग एकवचन कृदन्त का प्रतिनिधिक प्रयोग
  choice: वह, जो … खिसकाता है
  alternative: जो कोई … खिसकाए
  rationale: इब्रानी में कृदन्त पुल्लिंग एकवचन है और एक प्रतिनिधिक कानूनी मामले को प्रस्तुत करता है। हिन्दी में ‘वह, जो … खिसकाता है’ इस एकवचन और प्रतिनिधिक बल को सहज रूप से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में औपचारिक शाप-घोषणा और सामूहिक प्रत्युत्तर का लयात्मक अंतर सुरक्षित है; ‘आमीन’ को प्रचलित धार्मिक रूप में रखा गया है।
