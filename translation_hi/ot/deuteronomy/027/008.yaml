base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: hi
  text: और तुम पत्थरों पर इस व्यवस्था के सारे वचन बिलकुल स्पष्ट रूप से[a] लिखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साफ़-साफ़’ अथवा ‘इस तरह कि वे स्पष्ट हो जाएँ।’ इब्रानी अभिव्यक्ति में ‘स्पष्ट करना/समझाना’ अर्थ वाला एक क्रियारूप और उसे प्रबल करने वाला शब्द साथ आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: और तुम ... लिखना
  rationale: संयोजक सहित काल रूप निर्देशों की शृंखला में आज्ञार्थक बल रखता है और संबोधन एकवचन पुल्लिंग है। आधुनिक हिन्दी में ‘तुम ... लिखना’ इस निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל הָאֲבָנִים
  choice: पत्थरों पर
  rationale: עַל का सामान्य अर्थ ‘पर’ है। निश्चित उपपद संदर्भ में पहले बताए गए पत्थरों की ओर संकेत करता है; हिन्दी में प्रसंग और ‘पत्थरों’ से यह पर्याप्त रूप से स्पष्ट है, इसलिए ‘इन’ या ‘उन’ नहीं जोड़ा गया।
- source_word: אֵת כָּל דִּבְרֵי
  choice: सारे वचन
  rationale: כָּל דִּבְרֵי का औपचारिक और स्वाभाविक अनुवाद ‘सारे वचन’ है; इससे मूल का बहुवचन और संपूर्णता दोनों बने रहते हैं।
- source_word: הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था के
  rationale: תּוֹרָה का अर्थ शिक्षा या निर्देश भी हो सकता है, पर व्यवस्थाविवरण के वाचा-संबंधी विधिक संदर्भ में ‘व्यवस्था’ प्रतिष्ठित और उपयुक्त हिन्दी समतुल्य है। संकेतवाचक הַזֹּאת को ‘इस’ से व्यक्त किया गया है।
- source_word: בַּאֵר הֵיטֵב
  choice: बिलकुल स्पष्ट रूप से
  rationale: באר में स्पष्ट करने या साफ़-साफ़ प्रस्तुत करने का भाव है और הֵיטֵב उसे प्रबल करता है। पत्थरों पर लिखने के संदर्भ में यह वाक्यांश लेख को स्पष्ट रूप से अंकित करने का ढंग बताता है।
