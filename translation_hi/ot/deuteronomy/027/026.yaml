  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: hi
  text: “शापित है वह जो इस व्यवस्था के वचनों का पालन करने में दृढ़ नहीं रहता।” और सब लोग कहें, “आमीन।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पालन करने में दृढ़ नहीं रहता” का अनुवाद “इन वचनों को कायम नहीं रखता,” “स्थिर नहीं रखता,” या “पुष्टि नहीं करता” भी हो सकता है। इब्रानी क्रिया व्यवस्था को स्थिर या प्रभावी रखने का भाव दे सकती है; यहाँ इसे उसके वचनों को करने, अर्थात उनका पालन करने, से जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा के शाप की घोषणात्मक विधि है। ‘शापित हो’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी में इस सूत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: वह जो
  rationale: यह एक प्रतिनिधिक, सामान्य व्यक्ति को सूचित करता है; ‘वह जो’ मूल के एकवचन और सामान्य अर्थ दोनों को बनाए रखता है।
- source_word: לֹא יָקִים
  choice: बनाए नहीं रखता
  rationale: קום के हिफ़ील रूप में यहाँ व्यवस्था को प्रभावी मानना, थामे रखना या उसकी वैधता बनाए रखना निहित है। आगे का ‘उन पर चलकर’ इसे व्यावहारिक आज्ञाकारिता से जोड़ता है।
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था के वचनों
  rationale: דִּבְרֵי के लिए ‘वचन’ और व्यवस्थाविवरण के वाचागत संदर्भ में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त और परिचित हैं।
- source_word: לַעֲשׂוֹת אֹתָם
  choice: उन पर चलकर
  rationale: शाब्दिक अर्थ ‘उन्हें करके’ है; हिन्दी में ‘उन पर चलकर’ उन वचनों को व्यवहार में लाने का भाव स्वाभाविक ढंग से व्यक्त करता है और יָקִים से भेद भी बनाए रखता है।
- source_word: וְאָמַר כָּל הָעָם
  choice: तब सब लोग कहें
  rationale: वाचागत अनुष्ठान के निर्देश में यह रूप अपेक्षित सामूहिक उत्तर बताता है; ‘कहें’ हिन्दी में निर्देशात्मक भाव देता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: स्थापित धार्मिक पद सामूहिक पुष्टि के औपचारिक और उपासना-संबंधी स्वर को सुरक्षित रखता है।
theological_decisions:
- issue: יָקִים ... לַעֲשׂוֹת אֹתָם में वाचा के दायित्व का अर्थ
  choice: व्यवस्था के वचनों को व्यवहार में लाकर बनाए रखना
  alternative: केवल व्यवस्था की सार्वजनिक पुष्टि करना; अथवा केवल ‘व्यवस्था को मानना’ कहना
  rationale: इब्रानी पाठ ‘स्थिर/प्रभावी बनाए रखने’ को ‘उन्हें करने’ से जोड़ता है। अनुवाद दोनों पक्षों—व्यवस्था की मान्यता और वास्तविक आज्ञाकारिता—को रखता है, बिना बाद की किसी धर्मवैज्ञानिक व्यवस्था को आरोपित किए।
- issue: אֲשֶׁר का सामान्य, प्रतिनिधिक संदर्भ
  choice: वह जो
  alternative: जो कोई; वह पुरुष जो
  rationale: मूल का एकवचन प्रतिनिधिक है। ‘वह जो’ लिंग को अनावश्यक रूप से प्रमुख किए बिना मूल की सामान्य व्यापकता रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सार्वजनिक पाठ के योग्य और गरिमापूर्ण रखी गई है। ‘व्यवस्था’, ‘वचन’ और ‘आमीन’ जैसे परिचित बाइबलीय पद बनाए गए हैं; वाक्यरचना को सामान्य पाठक के लिए सहज रखा गया है।
