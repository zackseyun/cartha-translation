  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: hi
  text: तब मूसा और लेवीय याजकों ने सारे इस्राएल से कहा, “शांत होकर सुनो[a], हे इस्राएल! आज तुम अपने परमेश्वर यहवे की एक प्रजा बन गए हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्यान लगाकर सुनो।” इब्रानी आज्ञा मौन रहने या पूरा ध्यान देने—दोनों में से किसी भाव पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “अपने परमेश्वर यहवे के लिए एक प्रजा बन गए हो।” यहाँ भाव यहवे से संबंधित और उनके अपने लोग होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; हिंदी में ‘तब ... कहा’ स्वाभाविक ढंग से उसी प्रगति और वाणी-क्रिया को व्यक्त करता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजकों
  rationale: यह पदबंध याजकों को लेवीय समूह के रूप में पहचानता है; ‘लेवीय याजक’ संक्षिप्त, स्वाभाविक और मूल की निकट संबद्धता को बनाए रखता है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह पूरे इस्राएली समुदाय को सामूहिक रूप से किए गए संबोधन को सुरक्षित रखता है।
- source_word: הַסְכֵּת
  choice: शांत होकर
  rationale: आज्ञार्थक शब्द सुनने से पहले मौन रहने या पूरा ध्यान लगाने का आह्वान कर सकता है; मुख्य पाठ में ठोस मौन का भाव रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּשְׁמַע
  choice: सुनो
  rationale: आधुनिक हिंदी में यह आज्ञार्थक रूप ध्यानपूर्वक ग्रहण करने की पुकार को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: ‘इस दिन’ की अपेक्षा ‘आज’ आधुनिक हिंदी में स्वाभाविक है और काल-सूचक बल को पूर्णतः बनाए रखता है।
- source_word: נִהְיֵיתָ לְעָם
  choice: तुम ... प्रजा बन गए हो
  rationale: एकवचन क्रिया इस्राएल को एक सामूहिक इकाई के रूप में संबोधित करती है। ‘प्रजा’ वाचा-संबंधी समुदाय का भाव देती है, बिना आधुनिक राजनीतिक ‘राष्ट्र’ का अर्थ थोपे।
- source_word: לַיהוָה
  choice: यहवे की
  rationale: היה + ל यहाँ संबंध अथवा अधिकार का भाव देता है। स्वाभाविक हिंदी में ‘यहवे की प्रजा’ उस संबंध को स्पष्ट करता है; ‘यहवे के लिए’ का अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सामूहिक इस्राएल से मेल खाता है; ‘अपने’ हिंदी में ‘तुम्हारे’ संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। ‘यहवे’ उसके संभावित प्राचीन उच्चारण का पारदर्शी हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: इस्राएल के लिए सामूहिक एकवचन संबोधन
  choice: तुम ... बन गए हो
  alternative: तुम लोग ... बन गए हो
  rationale: इब्रानी में इस्राएल को एक सामूहिक इकाई मानकर द्वितीय पुरुष पुल्लिंग एकवचन में संबोधित किया गया है। हिंदी ‘तुम’ संख्या की अस्पष्टता रखते हुए इस सामूहिक वाचाई संबोधन को स्वाभाविक ढंग से सुरक्षित रखता है।
- issue: לַיהוָה में वाचा-संबंधी अधिकार
  choice: अपने परमेश्वर यहवे की प्रजा
  alternative: अपने परमेश्वर यहवे के लिए एक प्रजा
  rationale: संदर्भ में दत्तिवाचक ל संबंध और अपनेपन का संकेत देता है। मुख्य पाठ में स्वाभाविक हिंदी द्वारा यह संबंध स्पष्ट किया गया है, जबकि अधिक रूपात्मक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘हे इस्राएल’ प्रत्यक्ष संबोधन को स्पष्ट करता है। ‘प्रजा’ को वाचा-समुदाय के अर्थ में चुना गया है; भाषा में किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
