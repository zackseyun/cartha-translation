base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: hi
  text: तब मूसा और इस्राएल के पुरनियों ने लोगों को आज्ञा दी, “जिस सारी आज्ञा को मैं आज तुम्हें दे रहा हूँ, उसका पालन करना।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी आज्ञा”; हिब्रू में शब्द एकवचन है और यहाँ सामूहिक अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה अधिकारपूर्वक आदेश देने को व्यक्त करता है; ‘आज्ञा दी’ आधुनिक और गरिमापूर्ण हिन्दी में इसका सीधा रूप है।
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: और इस्राएल के पुरनियों
  rationale: हिब्रू में मूसा और पुरनिये संयुक्त कर्ता हैं; ‘और’ इस समन्वय को बनाए रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עָם यहाँ वाचा-सम्बन्धी राष्ट्रीय समुदाय को दर्शाता है; ‘लोग’ हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: यह ... दी
  rationale: हिब्रू का उद्धरण-सूचक infinitive हिन्दी में ‘यह आज्ञा दी’ और उसके बाद सीधे कथन से स्वाभाविक रूप में व्यक्त होता है।
- source_word: שָׁמֹר
  choice: पालन करना
  rationale: आज्ञा के सन्दर्भ में שׁמר सावधानी से मानने और पालन करने का भाव देता है; ‘पालन करना’ सहज आधुनिक हिन्दी है।
- source_word: כָּל הַמִּצְוָה
  choice: सारी आज्ञा
  rationale: मूल में מִצְוָה एकवचन है और כָּל के साथ समग्र अथवा सामूहिक अर्थ देता है; ‘सारी आज्ञा’ उस एकवचन को बनाए रखता है।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: जो ... मैं ... तुम्हें दे रहा हूँ
  rationale: सम्बन्धवाचक रचना और participle का वर्तमान/तात्कालिक भाव ‘जो मैं ... दे रहा हूँ’ से स्वाभाविक रूप में सुरक्षित रहता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समय पर दिए गए बल को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा-सम्बन्धी निर्देश में מִצְוָה का वचन
  choice: 'एकवचन सामूहिक/समग्र अर्थ: ‘सारी आज्ञा’'
  alternative: अर्थ को बहुवचन करके ‘सारी आज्ञाओं’ कहना
  rationale: हिब्रू संज्ञा एकवचन है। उसे बनाए रखने से व्यवस्थाविवरण में पूरी वाचा-सम्बन्धी मांग को एक समग्र ‘आज्ञा’ के रूप में प्रस्तुत करने का सम्भावित भाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘पुरनियों’ बाइबलीय सन्दर्भ में समुदाय के मान्य अगुओं के लिए प्रचलित पद है। उद्धरण-सूचक לֵאמֹר का अलग से कृत्रिम ‘कहते हुए’ अनुवाद न करके हिन्दी वाक्य-विन्यास में समाहित किया गया है।
