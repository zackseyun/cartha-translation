  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: hi
  text: और जब तुम यरदन पार करोगे, तब इन पत्थरों को, जिन्हें स्थापित करने की आज्ञा मैं आज तुम्हें दे रहा हूँ, एबाल पर्वत पर[a] स्थापित करना और उन पर चूने का पलस्तर चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-परंपराओं में, विशेष रूप से सामरी पंचग्रन्थ में, “एबाल पर्वत” के स्थान पर “गरिज्जीम पर्वत” है।
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: और जब तुम … पार करोगे
  rationale: यह इब्रानी रचना आने वाली परिस्थिति का समय बताती है। आधुनिक हिन्दी में ‘जब … करोगे’ इसका स्वाभाविक और सटीक रूप है।
- source_word: הַיַּרְדֵּן
  choice: यरदन
  rationale: यह नदी का प्रचलित व्यक्तिवाचक नाम है; संदर्भ में ‘नदी’ जोड़ना आवश्यक नहीं है।
- source_word: תָּקִימוּ אֶת הָאֲבָנִים הָאֵלֶּה
  choice: इन पत्थरों को … खड़ा करना
  rationale: हिफ़ील क्रिया यहाँ पत्थरों को स्थापित या खड़ा करने का निर्देश देती है। ‘पत्थर’ मूल पाठ की अनिर्दिष्टता बनाए रखता है और उन्हें स्मारक कहकर अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: जिनके विषय में मैं आज तुम्हें आज्ञा दे रहा हूँ
  rationale: संबंधवाचक उपवाक्य को पत्थरों से जोड़ा गया है और इब्रानी कृदंत की वर्तमान, जारी आज्ञा का भाव ‘आज्ञा दे रहा हूँ’ से व्यक्त होता है।
- source_word: בְּהַר עֵיבָל
  choice: एबाल पर्वत पर
  rationale: स्थानवाचक בְּ और पर्वत के नाम का स्वाभाविक हिन्दी रूप ‘पर्वत पर’ है; मुख्य पाठ WLC/मसोरेटिक पाठ के ‘एबाल’ को ग्रहण करता है।
- source_word: וְשַׂדְתָּ אוֹתָם בַּשִּׂיד
  choice: और उन पर चूने का पलस्तर चढ़ाना
  rationale: क्रिया पत्थरों पर लेप या पलस्तर करने और שִׂיד उस काम में प्रयुक्त चूने को सूचित करता है। यह रूप क्रिया और सामग्री दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण 27:4 में पर्वत के नाम का पाठांतर
  choice: एबाल पर्वत
  alternative: गरिज्जीम पर्वत
  rationale: प्रदत्त WLC/मसोरेटिक मूल पाठ में ‘एबाल’ है, इसलिए वही मुख्य पाठ में रखा गया है। सामरी पंचग्रन्थ का प्रसिद्ध पाठांतर ‘गरिज्जीम’ पादटिप्पणी में दिया गया है, ताकि महत्वपूर्ण पाठगत साक्ष्य छिपे नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञा को हिन्दी के स्वाभाविक निर्देशात्मक रूप ‘खड़ा करना … चढ़ाना’ में व्यक्त किया गया है। पाठांतर का चिह्न उसी स्थान-नाम के बाद रखा गया है जिससे वह संबंधित है।
