source:
  edition: WLC
  text: וְ/זָבַחְתָּ֥ שְׁלָמִ֖ים וְ/אָכַ֣לְתָּ שָּׁ֑ם וְ/שָׂ֣מַחְתָּ֔ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: hi
  text: और तुम मेलबलि चढ़ाओ, वहाँ खाओ, और अपने परमेश्वर याहवे के सामने आनन्द मनाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: चढ़ाना
  rationale: बलिदान-संबंधी प्रसंग में זבח का अर्थ बलि अर्पित करना है। हिंदी में बलि के नाम के साथ ‘चढ़ाना’ स्वाभाविक और स्पष्ट है।
- source_word: שְׁלָמִים
  choice: मेलबलि
  rationale: यह साझा बलिभोज तथा शांति, कुशल और सहभागिता से जुड़ी एक विशिष्ट बलि-श्रेणी है। ‘मेलबलि’ संक्षिप्त और परिचित धार्मिक पद है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְאָכַלְתָּ שָּׁם
  choice: वहाँ ... खाना
  rationale: שָׁם स्थान को स्पष्ट करता है और אָכַל का सीधा अर्थ खाना है। हिंदी में जुड़े हुए आदेशों के लिए समान क्रियारूप स्वाभाविक है।
- source_word: וְשָׂמַחְתָּ
  choice: आनन्द मनाना
  rationale: שׂמח यहाँ उपासना और वाचा के उत्सव का भाव रखता है; ‘आनन्द मनाना’ आधुनिक हिंदी में स्वाभाविक रूप से उस उत्सवी अर्थ को व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: उपासना के प्रसंग में לִפְנֵי परमेश्वर की उपस्थिति में होने का बोध देता है; ‘के सामने’ संक्षिप्त और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में ‘यहोवा’ परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: इब्रानी में द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय है। आदेश के हिंदी वाक्य में ‘अपने परमेश्वर’ उसी संबंध को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक मानक हिंदी में व्यापक पहचान के कारण ‘यहोवा’ चुना गया; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: שְׁלָמִים बलि-श्रेणी का नाम
  choice: मेलबलि
  alternative: शान्ति-बलि; सहभागिता-बलि; कुशल-मंगल की बलि
  rationale: यह शब्द केवल आंतरिक शांति का कथन नहीं, बल्कि साझा भोजन से जुड़ी बलि की एक श्रेणी बताता है। मुख्य पाठ में संक्षिप्त पारंपरिक पद रखा गया और इसकी वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन को हिंदी के निर्देशात्मक क्रियारूप ‘चढ़ाना, खाना, ... मनाना’ से व्यक्त किया गया है; इससे इब्रानी आदेश-श्रृंखला का बल बना रहता है।
