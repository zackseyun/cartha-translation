id: DEU.27.15
reference: Deuteronomy 27:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: hi
  text: शापित हो वह पुरुष जो कोई खुदी हुई मूर्ति या ढली हुई प्रतिमा बनाए—यहोवा के लिए घृणित, कारीगर के हाथों की बनाई हुई वस्तु—और उसे गुप्त स्थान में रखे। तब सब लोग उत्तर में कहें, “आमीन।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: वाचा-संबंधी शाप की विधिक उद्घोषणा को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: इब्रानी का पुल्लिंग एकवचन बनाए रखता है; यहाँ यह प्रतिनिधिक विधिक सूत्र के रूप में प्रयुक्त है।
- source_word: פֶסֶל
  choice: खुदी हुई मूर्ति
  rationale: ऐसी आकृति का ठोस अर्थ सुरक्षित रखता है जिसे काटकर या खोदकर बनाया गया हो।
- source_word: מַסֵּכָה
  choice: ढली हुई प्रतिमा
  rationale: साँचे में ढालकर बनाई गई आकृति का अर्थ देता है, पर मूल में स्पष्ट न होने के कारण मुख्य पाठ में ‘धातु’ नहीं जोड़ता।
- source_word: תּוֹעֲבַת יְהוָה
  choice: यहोवा के लिए घृणित
  rationale: उस वस्तु के प्रति यहोवा की प्रबल धार्मिक और नैतिक घृणा को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: कारीगर के हाथों की बनाई हुई वस्तु
  rationale: मानवीय निर्माण पर मूल के बल को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: וְשָׂם בַּסָּתֶר
  choice: और उसे छिपाकर रखे
  rationale: प्रतिमा को गुप्त स्थान में रखने के भाव को मुहावरेदार हिन्दी में व्यक्त करता है; मूल यह स्पष्ट नहीं करता कि उसे खड़ा किया गया था।
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: तब सब लोग उत्तर देकर कहें
  rationale: सामूहिक विधिक-उपासनीय प्रत्युत्तर के औपचारिक भाव को बनाए रखता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: पहचाने जाने योग्य वाचा-संबंधी और उपासनीय प्रत्युत्तर को लिप्यंतरित रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; इसलिए उसे उपाधि से बदलने के बजाय हिन्दी के परिचित लिप्यंतरण में रखा गया है।
- issue: वाचा के शाप-सूत्र में प्रतिनिधिक पुल्लिंग
  choice: वह पुरुष
  alternative: जो कोई व्यक्ति
  rationale: मूल का पुल्लिंग एकवचन स्पष्ट रखा गया है, जबकि उसका विधिक प्रयोग प्रतिनिधिक है।
- issue: מַסֵּכָה में सामग्री का प्रश्न
  choice: ढली हुई प्रतिमा
  alternative: धातु की ढली हुई प्रतिमा
  rationale: यह शब्द प्रायः धातु ढालने से बनी प्रतिमा के लिए आता है, पर इस पद में सामग्री अलग से व्यक्त नहीं है; इसलिए मुख्य पाठ में अतिरिक्त विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, सार्वजनिक वाचा-घोषणा के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। समानार्थी ‘मूर्ति’ और ‘प्रतिमा’ से פֶסֶל तथा מַסֵּכָה का भेद संकेतित किया गया है।
