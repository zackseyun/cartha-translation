  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: hi
  text: “शापित है वह पुरुष जो अपनी सास के साथ सोता है[a]।” और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, अपनी सास के साथ यौन-संबंध रखता है। इब्रानी में शाब्दिक मुहावरा ‘के साथ लेटना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: यह वाचा के शाप की विधिक-उपासना संबंधी घोषणा है। ‘शापित है’ इब्रानी के विधेय विशेषण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֹׁכֵב עִם
  choice: के साथ सोता है
  rationale: यहाँ इब्रानी मुहावरा यौन-संबंध का संकेत देता है। हिन्दी का ‘के साथ सोता है’ मूल की शिष्टोक्ति को बनाए रखता है; आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: חֹתַנְתּוֹ
  choice: अपनी सास
  rationale: חֹתֶנֶת का अर्थ ‘सास’ है और प्रत्यय तीसरे पुरुष पुल्लिंग एकवचन संबंध दर्शाता है। ‘अपनी सास’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: וְאָמַר כָּל הָעָם
  choice: और सब लोग कहें
  rationale: यह पिछले शापों के समान सामूहिक, निर्धारित उपासना-प्रत्युत्तर है। ‘कहें’ उसकी निर्देशात्मक/विधिक शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: इब्रानी उपासना-प्रत्युत्तर को प्रचलित हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
theological_decisions:
- issue: यौन कृत्य के लिए प्रयुक्त शिष्टोक्ति
  choice: मुख्य पाठ में ‘अपनी सास के साथ सोता है’
  alternative: ‘अपनी सास के साथ यौन-संबंध रखता है’
  rationale: मुख्य पाठ इब्रानी के ‘साथ लेटना’ वाले शिष्ट मुहावरे को बनाए रखता है, जबकि पादटिप्पणी उसके विधिक आशय को स्पष्ट करती है।
- issue: पुल्लिंग एकवचन कर्ता
  choice: ‘वह पुरुष जो’
  alternative: ‘जो कोई’
  rationale: इब्रानी कृदंत व्याकरणतः पुल्लिंग एकवचन है। ‘वह पुरुष’ स्रोत की इस विशेषता को बनाए रखता है और हिन्दी में वाक्य को स्पष्ट करता है।
- issue: शाप-वाक्य का बल
  choice: ‘शापित है’
  alternative: ‘शापित हो’
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है और אָרוּר विधेय रूप में है। ‘शापित है’ उसे घोषणा के रूप में रखता है; ‘शापित हो’ संभावित विधिक अर्थ है, पर वह हिन्दी में अतिरिक्त इच्छार्थक बल ला सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाचा-शाप की औपचारिक शैली तथा सामूहिक उपासना-प्रत्युत्तर सुरक्षित हैं; यौन कृत्य के लिए मूल की शिष्टोक्ति मुख्य पाठ में और उसका स्पष्ट आशय पादटिप्पणी में दिया गया है।
