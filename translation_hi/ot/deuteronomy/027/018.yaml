base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: hi
  text: शापित है वह जो मार्ग में अंधे को भटका दे। और सारी प्रजा कहे, “आमीन।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: यह वाचा-संबंधी शाप की घोषणात्मक शैली है; ‘शापित है’ उसके विधिक और गंभीर बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַשְׁגֶּה
  choice: जो ... भटका दे
  rationale: हिफ़ील कृदंत किसी को भटकाने या गलत दिशा में ले जाने का कारण बनने का भाव देता है; ‘भटका दे’ इस कारक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: עִוֵּר
  choice: अंधे को
  rationale: इब्रानी में पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। हिन्दी में ‘अंधे को’ उस एकवचन पुल्लिंग संदर्भ को स्वाभाविक ढंग से रखता है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग से
  rationale: संदर्भ ठोस दिशा-भ्रम का है। מַשְׁגֶּה के साथ हिन्दी में ‘मार्ग से भटका दे’ स्वाभाविक है और रास्ते पर किसी को गलत दिशा देने का आशय व्यक्त करता है।
- source_word: וְאָמַר
  choice: और ... कहे
  rationale: विधिक-उपासना क्रम में यह निर्धारित सामुदायिक प्रत्युत्तर है; हिन्दी का संभावनार्थक/आज्ञार्थक ‘कहे’ इसे संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सारी प्रजा
  rationale: ‘सारी प्रजा’ मूल के सामूहिक और समावेशी भाव को बनाए रखता है, बिना पद में स्पष्ट न किए गए ‘इस्राएल’ को जोड़ने के।
- source_word: אָמֵן
  choice: आमीन
  rationale: यह स्थापित धार्मिक लिप्यंतरण है और वाचा-संबंधी सामूहिक स्वीकृति को ‘ऐसा ही हो’ जैसी व्याख्यात्मक अभिव्यक्ति से अधिक सीधे सुरक्षित रखता है।
theological_decisions:
- issue: עִוֵּר का लिंग-संबंधी रूपांतरण
  choice: अंधे को
  alternative: अंधे व्यक्ति को
  rationale: मूल में पुल्लिंग एकवचन का व्यक्तिगत उदाहरण है। ‘अंधे को’ हिन्दी में उसी रूप को स्वाभाविक और संक्षिप्त रखता है, जबकि आशय को किसी वर्ग तक सीमित नहीं करता।
- issue: शाप-वाक्य का स्वरूप
  choice: शापित है वह जो...
  alternative: जो... वह शापित हो
  rationale: इब्रानी पाठ इच्छासूचक कामना के बजाय घोषणात्मक वाचा-शाप प्रस्तुत करता है; इसलिए ‘शापित है’ उसके औपचारिक न्यायिक स्वर को बनाए रखता है।
- issue: בַּדָּרֶךְ का संबंध
  choice: मार्ग से भटका दे
  alternative: मार्ग पर गलत दिशा दिखाए
  rationale: दोनों अर्थ संदर्भ में संभव हैं। चुना हुआ रूप מַשְׁגֶּה के ‘भटका देने’ वाले कारक अर्थ और यात्रा-संबंधी ठोस परिस्थिति को संक्षिप्त हिन्दी में साथ रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘मार्ग’ विधिक-काव्यात्मक गंभीरता देता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
