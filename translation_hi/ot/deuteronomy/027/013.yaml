base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: hi
  text: 'और ये गोत्र शाप के लिए एबाल पर्वत पर खड़े होंगे: रूबेन[a], गाद, आशेर, जबूलून, दान और नप्ताली।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाप की घोषणा के लिए” अथवा “शाप देने के लिए”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये गोत्र
  rationale: संयोजक और संकेतवाचक शब्द पिछले पद के समूह के बरक्स इस समूह को प्रस्तुत करते हैं। स्पष्टता के लिए निहित संज्ञा ‘गोत्र’ जोड़ी गई है।
- source_word: יַעַמְדוּ
  choice: खड़े होंगे
  rationale: अपूर्ण क्रिया यहाँ मूसा के निर्देश के भीतर भावी अनुष्ठानिक कार्य बताती है; ‘खड़े होंगे’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עַל הַקְּלָלָה
  choice: शाप के लिए
  rationale: यह संक्षिप्त अभिव्यक्ति शाप से संबंधित अनुष्ठानिक नियुक्ति को व्यक्त करती है और इब्रानी की अस्पष्टता को अनावश्यक रूप से नहीं खोलती।
- source_word: בְּהַר עֵיבָל
  choice: एबाल पर्वत पर
  rationale: स्थानसूचक उपसर्ग और पर्वत के नाम का आधुनिक मानक हिन्दी में स्वाभाविक रूप।
- source_word: רְאוּבֵן גָּד וְאָשֵׁר וּזְבוּלֻן דָּן וְנַפְתָּלִי
  choice: रूबेन, गाद, आशेर, जबूलून, दान और नप्ताली
  rationale: गोत्रों के नाम हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किए गए हैं।
theological_decisions:
- issue: शाप के संबंध में गोत्रों की अनुष्ठानिक भूमिका
  choice: शाप के लिए
  alternative: शाप की घोषणा के लिए; शाप देने के लिए
  rationale: इब्रानी पाठ ‘घोषणा करना’ जैसी क्रिया स्पष्ट रूप से नहीं दोहराता। संदर्भ अनुष्ठानिक सहभागिता सूचित करता है, पर मुख्य पाठ में संक्षिप्तता और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पिछले पद से संबंध बनाए रखने के लिए वाक्य ‘और’ से आरम्भ होता है। ‘ये’ को स्पष्ट करने हेतु ‘गोत्र’ जोड़ा गया है।
