  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: hi
  text: “शापित हो वह पुरुष जो किसी भी पशु के साथ सहवास करता है।” और सब लोग कहें[a], “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई किसी भी पशु के साथ सहवास करता है।” इब्रानी में पुल्लिंग एकवचन रूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा-संबंधी शाप की घोषणात्मक विधि है; ‘शापित हो’ हिन्दी में गंभीर और स्वाभाविक सूत्र है।
- source_word: שֹׁכֵב עִם
  choice: के साथ सहवास करता है
  rationale: यहाँ क्रिया यौन संबंध का शिष्ट संकेत है। ‘सहवास करता है’ अर्थ स्पष्ट रखता है और अनावश्यक अश्लीलता से बचता है।
- source_word: כָּל בְּהֵמָה
  choice: किसी भी पशु
  rationale: כָּל का वितरणात्मक भाव ‘किसी भी’ से और בְּהֵמָה की व्यापक श्रेणी ‘पशु’ से स्वाभाविक रूप में व्यक्त होती है।
- source_word: וְאָמַר כָּל הָעָם
  choice: और सब लोग कहें
  rationale: यह विधिवत सामूहिक प्रत्युत्तर को व्यक्त करता है; हिन्दी में ‘कहें’ अपेक्षित अनुष्ठानिक निर्देश को सहज रूप देता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: प्रचलित उपासना-संबंधी स्वीकृति को लिप्यंतरित रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: शाप-वाक्य में पुल्लिंग एकवचन कर्ता
  choice: वह पुरुष जो
  alternative: जो कोई
  rationale: שֹׁכֵב पुल्लिंग एकवचन कृदंत है और इस विधान में पुरुष कर्ता को सामने रखता है। मुख्य पाठ में यह रूप सुरक्षित है; अधिक सामान्य अर्थ की संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गंभीर, सार्वजनिक पाठ के योग्य और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सहवास’ मूल के यौन आशय को शिष्ट किंतु स्पष्ट ढंग से व्यक्त करता है।
