lexical_decisions:
- source_word: וְעָנוּ
  choice: उत्तर देकर
  rationale: ענה यहाँ औपचारिक प्रत्युत्तर अथवा घोषित कथन का परिचय देता है। ‘उत्तर देकर’ इब्रानी अभिव्यक्ति को बनाए रखता है, भले ही हिंदी में अगला कथन अभी आरम्भ होना हो।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: मूल पाठ स्पष्ट रूप से लेवियों का उल्लेख करता है, लेवीय याजकों का नहीं। आधुनिक हिंदी बाइबलीय प्रयोग में समुदाय के लिए ‘लेवी’ स्वाभाविक है।
- source_word: וְאָמְרוּ
  choice: कहें
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। निर्देशात्मक प्रसंग में ‘कहें’ अपेक्षित भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के हर पुरुष से
  rationale: אִישׁ एकवचन पुल्लिंग ‘पुरुष’ है और यहाँ प्रतिनिधिक सामूहिक अर्थ रखता है। यह अनुवाद मूल की लिंग-सूचना को सुरक्षित रखता है; अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
- source_word: קוֹל רָם
  choice: ऊँचे स्वर में
  rationale: यह सार्वजनिक और सबको सुनाई देने वाली घोषणा का स्वाभाविक हिंदी रूप है तथा प्रसंग की गंभीरता बनाए रखता है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: इस्राएल के हर पुरुष से
  alternative: हर इस्राएली से
  rationale: मूल में एकवचन पुल्लिंग संज्ञा है, जिसका प्रयोग सभा को प्रतिनिधिक रूप से संबोधित करने के लिए हुआ है। मुख्य पाठ स्रोत-रूप को सुरक्षित रखता है और पादटिप्पणी उसके सामूहिक अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उत्तर देकर कहें’ इब्रानी के दोहरे क्रियात्मक सूत्र को सुरक्षित रखता है, जबकि ‘ऊँचे स्वर में’ सार्वजनिक covenantal घोषणा का स्वाभाविक हिंदी रूप है।
