base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: hi
  text: “शापित है वह जो अपने पिता और अपनी माता का अनादर करता है[a]।” और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुच्छ समझता है,” “हल्के में लेता है,” अथवा “हेय समझता है।” हिब्रू क्रिया किसी को महत्वहीन या तिरस्कार के योग्य मानकर उसके साथ वैसा व्यवहार करने का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: यह निष्क्रिय कृदंत covenant curse formula प्रस्तुत करता है। ‘शापित है’ हिब्रू के संक्षिप्त घोषणात्मक रूप और विधि-विधान संबंधी गंभीरता को बनाए रखता है।
- source_word: מַקְלֶה
  choice: अनादर करता है
  rationale: קלה के हिफ़ील रूप का आशय किसी को हल्का, तुच्छ या महत्वहीन समझकर उसके साथ वैसा व्यवहार करना है। ‘अनादर करता है’ आधुनिक हिन्दी में इसके सामाजिक और नैतिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָבִיו וְאִמּוֹ
  choice: अपने पिता या माता का
  rationale: हिब्रू में संयोजक का शाब्दिक अर्थ ‘और’ है, पर निषेधात्मक/विधिक आशय माता-पिता में से किसी एक अथवा दोनों के अनादर पर लागू होता है। हिन्दी में ‘या’ इस वितरणात्मक अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאָמַר כָּל הָעָם
  choice: और सब लोग कहें
  rationale: ‘और’ मूल समन्वय को बनाए रखता है; ‘कहें’ सामूहिक विधिक-उपासना संबंधी प्रत्युत्तर को सहज हिन्दी में व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: प्रचलित लिप्यंतरण covenant affirmation की धार्मिक और सामूहिक गंभीरता बनाए रखता है।
theological_decisions:
- issue: माता-पिता के विरुद्ध अपराध का स्वरूप
  choice: अनादर करता है
  alternative: तुच्छ समझता है / हल्का जानता है / उसका अपमान करता है
  rationale: हिब्रू क्रिया केवल मन के भाव या केवल बोले गए अपशब्द तक सीमित नहीं है; वह माता-पिता को महत्वहीन या तुच्छ मानने और वैसा व्यवहार करने का व्यापक अर्थ रखती है। ‘अनादर’ इस नैतिक विस्तार को बिना अनावश्यक रूप से संकुचित किए सुरक्षित रखता है।
- issue: पिता और माता के बीच संबंधसूचक संयोजक
  choice: या
  alternative: और
  rationale: मूल शब्द ‘और’ है, किंतु इस विधिक शाप का आशय माता-पिता में से किसी के भी अनादर को सम्मिलित करना है। ‘या’ हिन्दी में इस वितरणात्मक प्रयोग को स्पष्ट करता है, जबकि पादटिप्पणी की आवश्यकता नहीं पड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामूहिक विधि-विधान के अनुकूल रूप। वाक्य-विन्यास हिब्रू की शाप-घोषणा और उसके बाद आने वाले जन-प्रत्युत्तर को स्पष्ट रखता है।
