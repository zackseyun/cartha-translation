  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: hi
  text: “शापित है वह जो किसी निर्दोष व्यक्ति की हत्या करने के लिए घूस लेता है[a],” और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “निर्दोष रक्त वाले व्यक्ति को मारने के लिए।” इब्रानी मुहावरे में ‘निर्दोष रक्त’ उस व्यक्ति को दर्शाता है जो हत्या के दोष से निर्दोष है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: वाचा के शाप की विधिवत घोषणा को स्पष्ट और प्रतिष्ठित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹקֵחַ שֹׁחַד
  choice: जो ... घूस लेता है
  rationale: इब्रानी कृदंत के सामान्य एकवचन भाव को स्वाभाविक हिन्दी में रखता है; שֹׁחַד के लिए ‘घूस’ सीधा और प्रचलित कानूनी शब्द है।
- source_word: לְהַכּוֹת
  choice: हत्या कराने के लिए
  rationale: हिफ़ील रूप यहाँ प्रेरणार्थक अर्थ दे सकता है, और ‘निर्दोष रक्त’ के साथ प्रसंग प्राणघातक हिंसा का है। घूस लेने वाला स्वयं मारने के बजाय हत्या करवाने वाला भी हो सकता है।
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: किसी निर्दोष व्यक्ति की
  rationale: शाब्दिक संरचना कठिन है, पर ‘निर्दोष रक्त’ निर्दोष मानव-जीवन/व्यक्ति के लिए इब्रानी मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְאָמַר כָּל הָעָם
  choice: तब सब लोग कहें
  rationale: अनुष्ठानिक निर्देश और निर्धारित सामूहिक प्रत्युत्तर को स्वाभाविक हिन्दी विध्यर्थक रूप में व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: स्थापित उपासना-संबंधी स्वीकृति-सूचक शब्द को लिप्यंतरित रूप में बनाए रखता है।
theological_decisions:
- issue: वाचा के शाप और निर्दोष रक्त के अपराध का संबंध
  choice: घूस लेकर निर्दोष व्यक्ति की हत्या कराने वाले पर शाप की घोषणा
  alternative: घूस लेकर निर्दोष व्यक्ति को मारने वाले पर शाप की घोषणा
  rationale: לְהַכּוֹת का हिफ़ील रूप कारणवाचक अर्थ की अनुमति देता है, जबकि प्रसंग घूस द्वारा हत्या करवाने की ओर संकेत करता है। फिर भी पादटिप्पणी शाब्दिक इब्रानी अभिव्यक्ति को सामने रखती है और अनावश्यक सांप्रदायिक व्याख्या नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाचा की सार्वजनिक घोषणा के अनुरूप गरिमापूर्ण किंतु सहज शैली। ‘शापित’, ‘घूस’, ‘हत्या’ और ‘आमीन’ सामान्य पाठक के लिए स्पष्ट हैं।
