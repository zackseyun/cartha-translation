base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: hi
  text: “शापित हो वह जो छिपकर अपने पड़ोसी पर वार करता है[a]।” तब सारे लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रहार करता है” अथवा “मार डालता है”; इब्रानी क्रिया प्रहार करने से लेकर घातक हिंसा तक का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा-संबंधी शाप की घोषणात्मक शैली है। हिंदी में ‘शापित हो’ सूत्रात्मक और स्वाभाविक है।
- source_word: מַכֵּה
  choice: प्रहार करता है
  rationale: נכה मारने, प्रहार करने और कभी-कभी घातक प्रहार तक का अर्थ दे सकता है। ‘प्रहार करता है’ हिंसा की गंभीरता रखता है, पर हत्या को अनिवार्य अर्थ नहीं बनाता।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: רֵעַ समुदाय के साथी या निकटवर्ती व्यक्ति को दर्शाता है। ‘पड़ोसी’ स्पष्ट, परिचित और प्रसंगानुकूल है।
- source_word: בַּסָּתֶר
  choice: छिपकर
  rationale: यह लोगों की दृष्टि से गुप्त रूप में किए गए कार्य को व्यक्त करता है; ‘छिपकर’ आधुनिक हिंदी में सहज है।
- source_word: וְאָמַר
  choice: तब ... कहें
  rationale: अनुष्ठानिक क्रम में यह जनता की निर्धारित सामूहिक प्रतिक्रिया है। हिंदी में ‘तब ... कहें’ उस क्रम और निर्देशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सब लोग
  rationale: मूल पाठ के ‘समस्त प्रजा/लोग’ को बिना ‘इस्राएल’ जोड़े सरल रूप में रखा गया है।
- source_word: אָמֵן
  choice: आमीन
  rationale: स्थापित उपासना-संबंधी लिप्यंतरण मूल की सामूहिक पुष्टि और स्वीकृति का भाव बनाए रखता है।
theological_decisions:
- issue: מַכֵּה में हिंसा की सीमा
  choice: मुख्य पाठ में ‘प्रहार करता है’
  alternative: ‘मार डालता है’ या ‘घात करता है’
  rationale: इब्रानी क्रिया सामान्य प्रहार से लेकर घातक हिंसा तक विस्तृत हो सकती है। मुख्य पाठ में हत्या निश्चित कर देना मूल की अर्थ-व्याप्ति को अनुचित रूप से संकीर्ण करेगा; पादटिप्पणी अधिक गंभीर या घातक अर्थ की संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामूहिक अनुष्ठानिक उच्चारण के अनुकूल। ‘छिपकर’ को अधिक बोझिल ‘गुप्त रूप से’ पर प्राथमिकता दी गई है।
