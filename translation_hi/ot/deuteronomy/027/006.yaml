base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: hi
  text: तू अपने परमेश्वर यहवे की वेदी साबुत पत्थरों[a] से बना, और उस पर अपने परमेश्वर यहवे के लिए होमबलियाँ चढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बिना तराशे पत्थर।’ इब्रानी में शाब्दिक अर्थ ‘साबुत/पूर्ण पत्थर’ है; ‘बिना तराशे’ निकटवर्ती निर्देश को दर्शाता है कि उन पर लोहे का कोई औज़ार न चलाया जाए (पद 5)।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: साबुत पत्थरों
  rationale: שְׁלֵמוֹת का सीधा अर्थ ‘साबुत/पूर्ण’ है। ‘बिना तराशे पत्थर’ निकटवर्ती पद 5 से समर्थित व्याख्यात्मक अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: תִּבְנֶה
  choice: बनाना
  rationale: विधिक निर्देश में अपूर्ण क्रिया का आदेशात्मक बल है। पहले आए ‘तू’ के साथ यह रूप आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण निर्देश देता है।
- source_word: מִזְבַּח
  choice: वेदी
  rationale: बलिदान चढ़ाने की संरचना के लिए मानक और सटीक हिंदी शब्द।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय के वाचाई और संबंधपरक भाव को हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: और उस पर ... चढ़ाना
  rationale: עלה के हिफ़ील रूप का बलिदानी प्रयोग ‘चढ़ाना’ से स्वाभाविक और सटीक रूप में व्यक्त होता है।
- source_word: עוֹלֹת
  choice: होमबलियाँ
  rationale: पूरी तरह आग में जलाई जाने वाली बलि के लिए प्रचलित, संक्षिप्त और सटीक हिंदी पारिभाषिक शब्द।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: ל यहाँ बलि के समर्पण/अर्पण के लक्ष्य को बताता है; ‘के लिए’ इस भाव को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना संरक्षित करता है।
- issue: שְׁלֵמוֹת को सीधे या संदर्भानुसार व्याख्यात्मक रूप में प्रस्तुत करना
  choice: साबुत पत्थर
  alternative: बिना तराशे पत्थर
  rationale: विशेषण का प्रत्यक्ष अर्थ ‘साबुत/पूर्ण’ है। लोहे का औज़ार न लगाने के पिछले निर्देश से ‘बिना तराशे’ अर्थ निकलता है, पर मुख्य पाठ में उस व्याख्या को अनिवार्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में एकवचन ‘तू’ मूल इब्रानी के 2ms संबोधन को बनाए रखता है। क्रियाओं में ‘बनाना/चढ़ाना’ का निर्देशात्मक रूप सहज, स्पष्ट और गरिमापूर्ण है; ‘वेदी’ और ‘होमबलियाँ’ स्थापित बाइबलीय शब्दावली हैं।
