reference: Deuteronomy 27:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: hi
  text: और वहाँ तुम अपने परमेश्वर यहोवा के लिए पत्थरों की एक वेदी बनाना; उन पर लोहे का औज़ार न चलाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָנִיתָ שָּׁם
  choice: और वहाँ तुम ... बनाना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित पूर्ण क्रिया भविष्य/आज्ञार्थक बल रखती है; हिंदी का ‘बनाना’ स्वाभाविक और विधिक निर्देश का भाव देता है।
- source_word: מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर यहोवा के लिए ... एक वेदी
  rationale: ל समर्पण/उद्देश्य दर्शाता है; יהוה को प्रचलित हिंदी बाइबलीय रूप ‘यहोवा’ और אֱלֹהֶיךָ को ‘अपने परमेश्वर’ किया गया है।
- source_word: מִזְבַּח אֲבָנִים
  choice: पत्थरों की एक वेदी
  rationale: रचना-संबंधी इब्रानी पदबंध सामग्री को निर्दिष्ट करता है; बहुवचन ‘पत्थरों’ को बनाए रखा गया है।
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: उन पर लोहे का औज़ार न चलाना
  rationale: शाब्दिक ‘लोहा न उठाना’ हिंदी में आशय अस्पष्ट करता; संदर्भ में नוף का हिफ़ील रूप पत्थरों पर लोहे के उपकरण का प्रयोग करने को निषिद्ध करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिंदी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ संभावित विद्वत्तापरक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लोहे का औज़ार चलाना’ मूल के संक्षिप्त ‘लोहा’ में निहित उपकरणार्थ को स्वाभाविक हिंदी में स्पष्ट करता है।
