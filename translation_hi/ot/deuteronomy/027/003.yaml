  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: hi
  text: और जब तुम पार जाओ, तब उन पर इस व्यवस्था[a] की सारी बातें लिखना, ताकि तुम उस देश में प्रवेश कर सको जिसे याहवे, तुम्हारा परमेश्वर, तुम्हें दे रहा है—दूध और मधु की धाराएँ बहने वाला देश—ठीक जैसा याहवे, तुम्हारे पुरखों के परमेश्वर,[b] ने तुमसे कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस शिक्षा की सारी बातें।’ हिब्रू ‘तोराह’ का अर्थ ‘शिक्षा’ भी हो सकता है; यहाँ वाचा और विधि के संदर्भ में ‘व्यवस्था’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तुम्हारे पिताओं के परमेश्वर’; ‘पुरखों’ से यहाँ पीढ़ीगत वाचा-संबंध व्यक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: लिखना
  rationale: संयोजक के साथ पूर्ण क्रिया यहाँ निर्देशात्मक आज्ञा का काम करती है। आधुनिक हिन्दी में infinitive imperative ‘लिखना’ आज्ञा का स्पष्ट और स्वाभाविक स्वर देता है।
- source_word: עֲלֵיהֶן
  choice: उन पर
  rationale: स्त्रीलिंग बहुवचन सर्वनाम पिछले पद के पत्थरों की ओर संकेत करता है; हिन्दी में ‘उन पर’ संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: इस व्यवस्था की सारी बातें
  rationale: דִּבְרֵי के मौखिक/पाठीय भाव को ‘बातें’ और תּוֹרָה के वाचाई-कानूनी संदर्भ को ‘व्यवस्था’ व्यक्त करता है। ‘शिक्षा’ की वास्तविक वैकल्पिक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בְּעָבְרֶךָ
  choice: जब तुम पार जाओ
  rationale: पूर्वसर्ग सहित infinitive construct का समयसूचक अर्थ है। क्रिया यरदन पार करने के निकट संदर्भ को व्यक्त करती है, जबकि मूल की तरह नदी का नाम यहाँ नहीं जोड़ा गया।
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: ताकि तुम ... प्रवेश कर सको
  rationale: यह उद्देश्य अथवा परिणाम व्यक्त करता है। ‘प्रवेश कर सको’ हिन्दी में स्वाभाविक है और भूमि में आने का भाव रखता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया है और אֱלֹהֶיךָ को स्वाभाविक हिन्दी संबंध-विन्यास में रखा गया है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदंत भूमि के दिए जाने को चल रही अथवा निश्चित रूप से आसन्न क्रिया के रूप में प्रस्तुत करता है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु की धाराएँ बहने वाला देश
  rationale: हिब्रू समृद्धि-बिंब को हिन्दी में जीवंत और समझने योग्य रखते हुए ‘बहने’ की छवि संरक्षित की गई है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ठीक जैसा ... ने तुमसे कहा था
  rationale: דִּבֶּר का मूल अर्थ ‘बोला/कहा’ है; ‘प्रतिज्ञा की’ अर्थ को स्पष्ट तो करता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: तुम्हारे पुरखों के परमेश्वर
  rationale: ‘पुरखों’ से masculine plural और व्यवस्थाविवरण की वाचा-सूत्रावली दोनों बने रहते हैं, और यह आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है।
- source_word: לָךְ
  choice: तुमसे
  rationale: अंतिम सर्वनाम का रूप पाठ-परंपरा में असामान्य है, पर דִּבֶּר के साथ सन्दर्भगत अर्थ संबोधित व्यक्ति से बोलना है; हिन्दी में ‘तुमसे कहा था’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका निकट लिप्यंतरण है; इसे सामान्य उपाधि ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: אֲבֹתֶיךָ में वाचा-संबंधी पूर्वज-संज्ञा
  choice: तुम्हारे पुरखे
  alternative: तुम्हारे पूर्वज / तुम्हारे पिता
  rationale: ‘पुरखे’ स्रोत के स्पष्ट masculine plural और पीढ़ीगत वाचा-सूत्र को बनाए रखता है, जबकि हिन्दी में सामूहिक पूर्वजों के लिए स्वाभाविक है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: לְמַעַן אֲשֶׁר का उद्देश्य/परिणाम संबंध
  choice: ताकि तुम ... प्रवेश कर सको
  alternative: जिससे तुम ... प्रवेश करोगे
  rationale: हिब्रू रचना उद्देश्य और परिणाम के बीच कुछ लचीलापन रखती है। ‘ताकि’ प्रमुख उद्देश्यगत अर्थ देता है, पर ‘कर सको’ इसे ऐसी कठोर कारण-सिद्धि नहीं बनाता कि लिखना ही भूमि में प्रवेश का योग्यता-अर्जन हो।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। वाक्य में आज्ञा, यरदन पार करने का समय, भूमि का दान और पुरखों से जुड़ी वाचा—इन सबको स्पष्ट रखा गया है। ‘याहवे’ के दोनों प्रयोग सुरक्षित हैं; दूसरे पर लगी पादटिप्पणी पुरखों वाली अभिव्यक्ति को समझाती है।
