    text: या, “प्लास्टर।” इब्रानी संज्ञा उस चूने या प्लास्टर को दर्शाती है जिसे लेप के रूप में लगाया जाता था।
    reason: שִׂיד के अर्थ-क्षेत्र में चूना और उससे बना प्लास्टर दोनों आते हैं।
  revision_rationale: The revision tightens the directional fidelity of the crossing-and-entry clause, removes added emphasis from the description of the stones, and updates the footnote’s modern Hindi spelling. It retains the divine name, the source’s participial “दे रहा है,” the ethical/reflexive sense of “अपने लिए,” and the lime/plaster ambiguity.
