revisions:
- from: और जिस दिन तुम यरदन पार करके उस देश में पहुँचो जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, उस दिन अपने लिए बड़े-बड़े पत्थर खड़े करना और उन पर चूना[a] पोत देना।
  to: जिस दिन तुम यरदन पार करके उस देश में प्रवेश करोगे जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, उस दिन अपने लिए बड़े पत्थर खड़े करना और उन पर चूना[a] पोत देना।
  rationale: The revision tightens the directional fidelity of the crossing-and-entry clause, removes added emphasis from the description of the stones, and updates the footnote’s modern Hindi spelling. It retains the divine name, the source’s participial “दे रहा है,” the ethical/reflexive sense of “अपने लिए,” and the lime/plaster ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:54:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the temporal command, crossing the Jordan, the land being given by Yahweh, erection of large stones, and coating them with lime. However, “पहुँचो” is less precise than the source’s movement into the land after crossing the Jordan; “प्रवेश करोगे” represents this more directly. The Hebrew shifts from plural “you cross” to singular “you shall set up”; Hindi respectful/collective “तुम ... अपने लिए” can appropriately preserve the collective address without artificially introducing an individualizing phrase.
  naturalness: The proposed revision uses fluent modern Hindi and a clear future-temporal construction. “बड़े पत्थर” is more exact than the reduplicated “बड़े-बड़े पत्थर,” which can add a distributive or emphatic nuance not required by the Hebrew. “प्लास्टर” is the usual modern Hindi form in the lexical note.
  terminology: “याहवे” appropriately transliterates יהוה, and “परमेश्वर” is suitable in this register. “चूना” is a sound primary rendering of שִׂיד; the footnote retains “प्लास्टर” as a legitimate lexical alternative and is anchored to the relevant word.
  issues:
  - severity: low
    issue: “पहुँचो” weakens the directional sense of entering the land.
    rationale: The Hebrew states that they cross the Jordan into the land. “उस देश में प्रवेश करोगे” more explicitly retains the destination and entry sense.
  - severity: low
    issue: “बड़े-बड़े पत्थर” adds unnecessary idiomatic emphasis.
    rationale: גדולות means “large/great”; plain “बड़े पत्थर” is natural Hindi and more closely proportioned to the source.
  - severity: low
    issue: Footnote spelling “पलस्तर” is less standard in modern Hindi.
    rationale: “प्लास्टर” is the usual contemporary spelling and clearly identifies the alternative coating material.
  revised_text: जिस दिन तुम यरदन पार करके उस देश में प्रवेश करोगे जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, उस दिन अपने लिए बड़े पत्थर खड़े करना और उन पर चूना[a] पोत देना।
  revised_footnotes:
