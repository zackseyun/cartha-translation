language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: hi
  text: जिस दिन तुम यरदन पार करके उस देश में प्रवेश करोगे जिसे तुम्हारा परमेश्वर याहवे तुम्हें दे रहा है, उस दिन अपने लिए बड़े पत्थर खड़े करना और उन पर चूना[a] पोत देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्लास्टर।” इब्रानी संज्ञा उस चूने या प्लास्टर को दर्शाती है जिसे लेप के रूप में लगाया जाता था।
    reason: שִׂיד के अर्थ-क्षेत्र में चूना और उससे बना प्लास्टर दोनों आते हैं।
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: और जिस दिन ... उस दिन
  rationale: यह इब्रानी मुहावरा भविष्य की परिस्थिति प्रस्तुत करता है। हिन्दी में ‘जिस दिन ... उस दिन’ उसका समय-संबंध स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: तुम यरदन पार करके
  rationale: עבר यहाँ नदी के एक किनारे से दूसरे किनारे जाने को व्यक्त करता है; ‘यरदन पार करना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: यहाँ אֶרֶץ इस्राएल को दिए जाने वाले भूभाग को दर्शाता है। ‘देश’ सामान्य हिन्दी पाठक के लिए स्वाभाविक है और निश्चित संकेत ‘उस’ प्रसंगगत विशिष्टता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נֹתֵן
  choice: दे रहा है
  rationale: इब्रानी कृदंत देने की क्रिया को वर्तमान और निश्चित रूप में प्रस्तुत करता है; ‘दे रहा है’ इस पक्ष को बनाए रखता है।
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: अपने लिए ... खड़े करना
  rationale: हिफ़ील क्रिया पत्थरों को स्थापित या खड़ा करने का आदेश देती है, और לְךָ का आत्मवाचक भाव ‘अपने लिए’ से व्यक्त होता है। सम्बोधन व्याकरणतः एकवचन है, इसलिए हिन्दी में सामूहिक एकवचन ‘तुम/अपने’ रखा गया है।
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: बड़े-बड़े पत्थर
  rationale: ‘बड़े-बड़े पत्थर’ आकार पर बल देने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: וְשַׂדְתָּ אֹתָם בַּשִּׂיד
  choice: उन पर चूना पोत देना
  rationale: क्रिया पत्थरों पर लेप चढ़ाने और שִׂיד उस लेप की चूना अथवा पलस्तर-सामग्री को दर्शाता है। यह अनुवाद हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण आदेशात्मक विन्यास अपनाया गया है। ‘तुम’ इस्राएल के लिए प्रयुक्त इब्रानी सामूहिक एकवचन सम्बोधन को बनाए रखता है।
