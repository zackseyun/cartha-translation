lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה अधिकारपूर्वक आदेश देने को व्यक्त करती है। ‘आज्ञा दी’ इस बल को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखती है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: משה नाम का मानक और व्यापक रूप से प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֶת הָעָם
  choice: लोगों को
  rationale: עָם यहाँ इस्राएल के लोगों को सामूहिक रूप से सूचित करता है; ‘लोगों’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: यह पदबंध पहले से संदर्भित दिन की ओर संकेत करता है। ‘उसी दिन’ हिन्दी कथन में उसका संकेत और समय-संबंध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाली आज्ञा की विषयवस्तु का परिचय देता है। हिन्दी में द्विबिंदु इस कथन-संबंध को ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से दिखाता है।
