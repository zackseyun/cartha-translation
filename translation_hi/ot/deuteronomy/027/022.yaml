  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָר֗וּר שֹׁכֵב֙ עִם אֲחֹת֔/וֹ בַּת אָבִ֖י/ו א֣וֹ בַת אִמּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: hi
  text: शापित है वह जो अपनी बहन के साथ सहवास करता है—उसके पिता की बेटी या उसकी माता की बेटी। और सब लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: शापित हो
  rationale: यह वाचा-संबंधी शाप की विधिवत घोषणा है। ‘शापित हो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके गंभीर और घोषणात्मक बल को बनाए रखता है।
- source_word: שֹׁכֵב עִם
  choice: के साथ सहवास करता है
  rationale: इब्रानी मुहावरा यहाँ यौन-संबंध को सूचित करता है। ‘सहवास करता है’ अर्थ को स्पष्ट, संक्षिप्त और मर्यादित कानूनी भाषा में व्यक्त करता है।
- source_word: אֲחֹתוֹ
  choice: अपनी बहन
  rationale: ‘अपनी’ हिन्दी में कर्ता के साथ संबंध को स्वाभाविक रूप से स्पष्ट करता है; अगला वाक्यांश पैतृक या मातृक संबंध की सीमा बताता है।
- source_word: בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: चाहे वह उसके पिता की बेटी हो या उसकी माता की बेटी
  rationale: यह ‘बहन’ का विकल्पात्मक स्पष्टीकरण है। ‘चाहे…या…’ हिन्दी में इस कानूनी विकल्प को स्पष्ट करता है और पिता तथा माता, दोनों की बेटी वाली समानांतर संरचना बनाए रखता है।
- source_word: וְאָמַר כָּל הָעָם
  choice: और सब लोग कहें
  rationale: यह निर्धारित सामुदायिक प्रत्युत्तर है। ‘कहें’ विधिपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और ‘सब लोग’ मूल के सामूहिक विस्तार को बिना जोड़े सुरक्षित रखता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: यह स्थापित उपासना-संबंधी स्वीकृति है; लिप्यंतरण उसके वाचागत और सामुदायिक संदर्भ को बनाए रखता है।
theological_decisions:
- issue: निषिद्ध संबंध का दायरा
  choice: ‘बहन’ को पिता की बेटी या माता की बेटी के रूप में मूल पाठ के अनुसार स्पष्ट किया गया है।
  alternative: इसे केवल सौतेली बहन तक सीमित करना, या सामान्य रूप से किसी निकट स्त्री-संबंधी तक विस्तृत करना।
  rationale: मूल पाठ पैतृक अथवा मातृक वंश-संबंध बताता है, पर यह स्वयं इस पद में संबंध को उससे अधिक न तो सीमित करता है, न विस्तृत।
- issue: पुरुषवाचक कानूनी कर्ता
  choice: ‘वह जो…अपनी बहन…’
  alternative: ‘वह पुरुष जो…’
  rationale: इब्रानी में कर्ता पुल्लिंग एकवचन है, किंतु हिन्दी में ‘वह जो’ कानूनी सूत्र को स्वाभाविक रखता है; ‘बहन’ और ‘पिता/माता’ संबंध की मूल दिशा को स्पष्ट रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के अनुकूल है। ‘सहवास’ स्पष्ट किन्तु मर्यादित कानूनी शब्द है। पिता और माता की बेटी वाली पुनरुक्त संरचना जानबूझकर रखी गई है ताकि मूल विधान की स्पष्टता और समानांतरता बनी रहे।
