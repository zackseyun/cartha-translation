base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: hi
  text: '“जब तुम यरदन पार करोगे, तब लोगों को आशीर्वाद देने के लिए ये गरिज्जीम पर्वत पर खड़े हों: शिमोन, लेवी, यहूदा, इस्साकार, यूसुफ[a] और बिन्यामीन।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस जनजातीय सूची में यूसुफ एप्रैम और मनश्शे के गोत्रों का प्रतिनिधित्व करता है।
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה יַעַמְדוּ
  choice: ये ... खड़े हों
  rationale: बहुवचन संकेतवाचक के साथ निर्देशात्मक प्रसंग में अपूर्ण क्रिया का स्वाभाविक हिन्दी रूप; यह केवल भविष्यवाणी नहीं, मूसा का आदेश व्यक्त करता है।
- source_word: לְבָרֵךְ אֶת־הָעָם
  choice: लोगों को आशीर्वाद देने के लिए
  rationale: לְ के साथ infinitive construct उद्देश्य व्यक्त करता है; הָעָם को इस्राएली समुदाय के सामूहिक अर्थ में ‘लोगों’ कहा गया है।
- source_word: עַל הַר גְּרִזִים
  choice: गिरिज्जीम पर्वत पर
  rationale: स्थान-सूचक עַל को स्वाभाविक हिन्दी ‘पर’ से और स्थाननाम को प्रचलित हिन्दी बाइबलीय रूप में दिया गया है।
- source_word: בְּעָבְרְכֶם אֶת־הַיַּרְדֵּן
  choice: जब तुम यरदन पार कर जाओ
  rationale: בְּ के साथ infinitive construct और बहुवचन प्रत्यय का कालवाचक अर्थ है। ‘पार कर जाओ’ आगामी पारगमन और उसके बाद होने वाली विधि को सहज रूप से व्यक्त करता है।
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: शिमोन, लेवी, यहूदा, इस्साकार, यूसुफ और बिन्यामीन
  rationale: जनजातीय नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; मूल के ‘यूसुफ’ को मुख्य पाठ में बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: जनजातियों के खड़े होने की क्रिया का निर्देशात्मक या भविष्यसूचक बल
  choice: ‘खड़े हों’—निर्देशात्मक
  alternative: ‘खड़े होंगे’—साधारण भविष्यसूचक
  rationale: व्यवस्थाविवरण 27 के विधिक-अनुष्ठानिक संदर्भ में मूसा भावी समारोह के लिए आदेश दे रहा है; विधिलिंग हिन्दी में इस बल को स्पष्ट रखता है।
- issue: जनजातीय सूची में ‘यूसुफ’ का आशय
  choice: मुख्य पाठ में केवल ‘यूसुफ’
  alternative: ‘यूसुफ के गोत्र’, अथवा ‘एप्रैम और मनश्शे’
  rationale: इब्रानी पाठ स्पष्टतः יוֹסֵף कहता है। मुख्य पाठ में विस्तार करना स्रोत से अधिक कहना होगा; प्रतिनिधिक आशय को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज वाक्य-विन्यास रखा गया है। आदेश के बल के लिए ‘खड़े हों’ और समय-संबंध के लिए ‘जब ... पार कर जाओ, तब ...’ प्रयुक्त हुआ है।
