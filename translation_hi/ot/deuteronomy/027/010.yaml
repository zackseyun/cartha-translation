base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: hi
  text: और तुम अपने परमेश्वर याहवे की वाणी सुनोगे और उसकी आज्ञाओं और विधियों का पालन करोगे, जिनकी मैं आज तुम्हें आज्ञा दे रहा हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर याहवे की बात मानोगे।” इब्रानी मुहावरे “वाणी सुनना” में प्रायः आज्ञा मानने का भाव भी शामिल होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: की वाणी सुनोगे
  rationale: इब्रानी मुहावरा शाब्दिक रूप से ‘वाणी सुनना’ है और उसमें ध्यान देकर मानने का भाव भी निहित है। ‘वाणी सुनोगे’ मूल बिंब को बनाए रखता है, जबकि अगला खंड आज्ञाओं के पालन को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: यह संबोधन इस्राएल के साथ वाचा के संबंध को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְעָשִׂיתָ
  choice: पालन करोगे
  rationale: यहाँ עשה का अर्थ आज्ञाओं और विधियों को कार्य में लाना है। हिंदी में ‘पालन करना’ इस कानूनी-वाचागत संदर्भ में स्वाभाविक और सटीक है।
- source_word: מִצְוֺתָיו
  choice: उसकी आज्ञाओं
  rationale: ‘आज्ञाएँ’ מִצְוֹת के अधिकारपूर्ण और वाचागत स्वरूप को स्पष्ट रखता है।
- source_word: חֻקָּיו
  choice: विधियों
  rationale: ‘विधियाँ’ חֻקִּים के निर्धारित नियमों का भाव व्यक्त करती हैं और ‘आज्ञाओं’ से उसका शब्दगत भेद भी बनाए रखती हैं।
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: जिन्हें मैं आज तुम्हें दे रहा हूँ
  rationale: वर्तमान कृदंत की तात्कालिकता को ‘दे रहा हूँ’ से स्वाभाविक हिंदी में व्यक्त किया गया है; ‘आज्ञाएँ देना’ हिंदी का सामान्य प्रयोग है और ‘आज’ व्यवस्थाविवरण के वर्तमान वाचा-क्षण पर बल बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: שׁמע בקול में सुनने और आज्ञापालन का संबंध
  choice: वाणी सुनोगे
  alternative: बात मानोगे
  rationale: मूल मुहावरे में सुनना और मानना दोनों जुड़े हैं। मुख्य पाठ में ‘वाणी सुनोगे’ मूल अभिव्यक्ति को सुरक्षित रखता है, और साथ का ‘पालन करोगे’ आज्ञाकारिता को स्पष्ट करता है; फुटनोट वैकल्पिक अर्थ बताता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण वाचागत-कानूनी स्वर रखा गया है। ‘तुम’ सामूहिक इस्राएल को संबोधित इब्रानी एकवचन का सहज हिंदी रूप है। भविष्यत्सूचक क्रियाएँ इब्रानी वाव-संयुक्त रूपों की आज्ञार्थक अपेक्षा को बिना कठोर आदेशात्मक शैली थोपे व्यक्त करती हैं।
