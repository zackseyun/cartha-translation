  edition: WLC
  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: hi
  text: “शापित है वह, जो परदेशी[a], अनाथ[b] और विधवा को मिलने वाले न्याय को बिगाड़ता है।” और सभी लोग कहें, “आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “परदेशी” से आशय इस्राएलियों के बीच रहने वाले गैर-स्थानीय निवासी से है।
    reason: cultural_note
  - marker: b
    text: या “पिता-विहीन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: शापित है
  rationale: वाचा-संबंधी शाप की विधिक घोषणा को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַטֶּה
  choice: बिगाड़ता है
  rationale: हिफ़ील कृदन्त यहाँ न्याय को मोड़ने या विकृत करने का भाव देता है; ‘बिगाड़ता है’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: מִשְׁפַּט
  choice: मिलने वाले न्याय
  rationale: यहाँ शब्द अमूर्त न्याय के साथ-साथ इन असुरक्षित लोगों के उचित कानूनी अधिकार को सूचित करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: इस्राएल के बीच रहने वाले गैर-स्थानीय निवासी की ऐतिहासिक-सामाजिक श्रेणी को दर्शाता है; टिप्पणी इसके विशेष अर्थ को स्पष्ट करती है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: हिब्रू शब्द पिता-विहीन या अनाथ व्यक्ति को सूचित कर सकता है; आधुनिक हिन्दी में ‘अनाथ’ संक्षिप्त और सहज है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: इस असुरक्षित सामाजिक श्रेणी का सीधा और मानक हिन्दी समतुल्य है।
- source_word: וְאָמַר כָּל הָעָם
  choice: तब सभी लोग कहें
  rationale: अनुष्ठानिक क्रम में यह पूरी सभा के निर्देशित प्रत्युत्तर को व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: स्थिर उपासना-संबंधी प्रत्युत्तर को प्रचलित हिन्दी लिप्यंतरण में सुरक्षित रखता है।
theological_decisions:
- issue: विधिक-सामाजिक त्रयी को आधुनिक राजनीतिक श्रेणियों में बदले बिना प्रस्तुत करना
  choice: परदेशी, अनाथ और विधवा
  alternative: विदेशी निवासी, पिता-विहीन और विधवा
  rationale: यह चयन मूल पाठ की ऐतिहासिक वाचा-संबंधी श्रेणियों और उनकी सामाजिक असुरक्षा को बनाए रखता है, बिना उन पर आधुनिक नीतिगत अर्थ आरोपित किए।
- issue: מַטֶּה מִשְׁפַּט का अर्थ
  choice: मिलने वाले न्याय को बिगाड़ता है
  alternative: न्याय को फेर देता है
  rationale: वाक्य व्यक्ति के उचित कानूनी हक को भ्रष्ट करने की निंदा करता है; चयन अर्थ को स्पष्ट करता है, जबकि मूल के ‘मोड़ने’ वाले बिंब को शब्दशः थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, सार्वजनिक पाठ के योग्य और गरिमापूर्ण। ‘शापित है’ तथा ‘आमीन’ अनुष्ठानिक गंभीरता बनाए रखते हैं, जबकि ‘मिलने वाले न्याय’ विधिक आशय को सामान्य पाठक के लिए स्पष्ट करता है।
