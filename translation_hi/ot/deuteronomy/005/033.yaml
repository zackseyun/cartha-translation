  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: hi
  text: जिस पूरे मार्ग पर चलने की आज्ञा तुम्हारे परमेश्वर यहोवा ने तुम्हें दी है, उस पर चलना, ताकि तुम जीवित रहो, तुम्हारा भला हो, और उस देश में तुम्हारी आयु लम्बी हो जिस पर तुम अधिकार करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे तुम विरासत में पाओगे।” इब्रानी क्रिया का अर्थ किसी वस्तु पर अधिकार करना और उसे विरासत में पाना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: जिस पूरे मार्ग पर ... उसी पर
  rationale: एकवचन ‘मार्ग’ को बनाए रखकर परमेश्वर द्वारा ठहराए गए जीवन-पथ का रूपक सुरक्षित रखा गया है; हिन्दी में यह संरचना स्वाभाविक भी है।
- source_word: צִוָּה
  choice: आज्ञा ... दी है
  rationale: पूर्ण हुई पर अब भी प्रभावी आज्ञा को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय निजी नाम को हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: वाचा-संबंधी पदबंध को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: תֵּלֵכוּ
  choice: चलते रहना
  rationale: ‘चलना’ आचरण और वाचा के प्रति आज्ञाकारिता का इब्रानी रूपक सुरक्षित रखता है; प्रसंग में इसका आदेशात्मक बल भी स्पष्ट है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: תִּחְיוּן
  choice: तुम जीवित रहो
  rationale: जीवन के मूल अर्थ को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
- source_word: וְטוֹב לָכֶם
  choice: तुम्हारा भला हो
  rationale: कल्याण और अनुकूल दशा के इब्रानी भाव का स्वाभाविक हिन्दी समतुल्य है।
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: तुम्हारे दिन लम्बे हों
  rationale: इब्रानी मुहावरे ‘दिन लम्बे करना’ की छवि को बनाए रखते हुए अर्थ को सुबोध रखा गया है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: व्यवस्थाविवरण के प्रतिज्ञात भूभाग के संदर्भ में ‘देश’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִּירָשׁוּן
  choice: जिस पर तुम अधिकार करने वाले हो
  rationale: क्रिया के भूमि को प्राप्त कर अपने अधिकार में लेने के ठोस अर्थ को व्यक्त करता है, जबकि विरासत के अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी वाचा-नाम है; हिन्दी पाठकों के लिए प्रतिष्ठित बाइबलीय रूप ‘यहोवा’ नाम को पदवी में बदले बिना सुरक्षित रखता है।
- issue: देश के संबंध में ירשׁ का अर्थ
  choice: अधिकार करना
  alternative: विरासत में पाना
  rationale: इस संदर्भ में देश को प्राप्त करके उस पर अधिकार स्थापित करने का ठोस भाव प्रमुख है, पर क्रिया का विरासत-संबंधी अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदेशात्मक पर गरिमामय शैली। ‘मार्ग पर चलना’ रूपक, वाचा-संबंधी संबोधन और ‘दिन लम्बे हों’ का इब्रानी मुहावरा सुरक्षित रखा गया है।
