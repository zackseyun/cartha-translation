base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: hi
  text: तुम अपने पड़ोसी के विरुद्ध झूठी गवाही न देना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अपने पड़ोसी के विरुद्ध झूठी साक्षी न देना।”
    reason: ‘गवाही देना’ मूल न्यायिक अभिव्यक्ति का स्वाभाविक हिंदी रूप है; ‘साक्षी देना’ अधिक शाब्दिक, किंतु कम प्रचलित विकल्प है।
lexical_decisions:
- source_word: לֹא
  choice: न
  rationale: निषेध को हिंदी की स्वाभाविक आज्ञार्थक रचना ‘न देना’ से सीधे व्यक्त किया गया है।
- source_word: תַעֲנֶה
  choice: देना
  rationale: न्यायिक संदर्भ में ענה का अर्थ गवाही देना है; ‘गवाही देना’ आधुनिक हिंदी का स्वाभाविक कानूनी प्रयोग है।
- source_word: בְרֵעֲךָ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: רֵעַ साथी, सहचर या पड़ोसी को सूचित कर सकता है; यहाँ בְ के साथ न्यायिक संदर्भ में ‘के विरुद्ध’ उपयुक्त है। ‘अपने पड़ोसी’ सामान्य व्यक्ति-संबंधी अर्थ को सहज हिंदी में रखता है।
- source_word: עֵד
  choice: गवाही
  rationale: ענה के साथ मिलकर यह न्यायिक साक्ष्य देने की क्रिया व्यक्त करता है; हिंदी में ‘गवाही देना’ सबसे स्वाभाविक समतुल्य है।
- source_word: שָׁוְא
  choice: झूठी
  rationale: इस न्यायिक संदर्भ में שָׁוְא का झूठ, मिथ्यापन या निराधारता का अर्थ ‘झूठी गवाही’ से स्पष्ट और संक्षिप्त रूप में व्यक्त होता है।
