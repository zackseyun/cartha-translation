base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: hi
  text: तुम ही पास जाकर सुनो कि यहोवा हमारा परमेश्वर जो कुछ कहे। फिर जो कुछ यहोवा हमारा परमेश्वर तुमसे कहे, वह सब हमें बताना; और हम उसे सुनेंगे और उसका पालन करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: तुम ही पास जाकर
  rationale: द्वितीय पुरुष सर्वनाम की स्पष्ट उपस्थिति पर बल देने के लिए ‘तुम ही’ और आदेश की स्वाभाविक हिन्दी अभिव्यक्ति के लिए ‘पास जाकर’ चुना गया।
- source_word: וּשֲׁמָע
  choice: सुनो
  rationale: मूल आदेश का सीधा और स्वाभाविक अनुवाद।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: यहोवा हमारा परमेश्वर
  rationale: व्यक्तिगत ईश्वरीय नाम और वाचा-संबंधी ‘हमारा परमेश्वर’ दोनों को प्रत्यक्ष रूप से सुरक्षित रखा गया।
- source_word: תְּדַבֵּר אֵלֵינוּ
  choice: हमें बताना
  rationale: इस संदर्भ में मूसा द्वारा लोगों तक संदेश पहुँचाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: हम उसे सुनेंगे और उस पर चलेंगे
  rationale: ‘करेंगे’ का आशय आज्ञापालन है; ‘उस पर चलेंगे’ सामान्य हिन्दी में इसी भाव को स्पष्ट करता है और दोनों क्रियाओं की क्रमबद्धता रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपस्थित विशिष्ट नाम को हिन्दी बाइबल परंपरा में परिचित रूप से दर्शाया गया, जबकि इसे सामान्य उपाधि में नहीं बदला गया।
- issue: וְעָשִׂינוּ में आज्ञापालन का भाव
  choice: उस पर चलेंगे
  alternative: उसे करेंगे
  rationale: शाब्दिक क्रिया ‘करना’ है, पर हिन्दी में किसी वचन को ‘करना’ अस्वाभाविक हो सकता है; चुना हुआ रूप सुनने के साथ निहित आज्ञापालन को व्यक्त करता है, बिना अतिरिक्त धार्मिक अवधारणा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण किंतु सहज सामूहिक संबोधन। वाक्यरचना को बोलचाल योग्य रखा गया है और मूल के आदेश, मध्यस्थता तथा सुनने-मानने के क्रम को सुरक्षित रखा गया है।
