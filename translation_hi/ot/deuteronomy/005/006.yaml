base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: hi
  text: मैं याहवे, तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से, दासों के घर से[a] निकाल लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दासता के घर से”; इब्रानी में शाब्दिक रूप से “दासों के घर से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: मैं ... हूँ
  rationale: इब्रानी का स्वतंत्र प्रथम-पुरुष सर्वनाम क्रियारहित वाक्य में है; हिन्दी में स्वाभाविक और गंभीर आत्म-परिचय के लिए निहित संयोजक क्रिया ‘हूँ’ व्यक्त की गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ‘तुम्हारा’ से व्यक्त किया गया है; वाचा के संदर्भ में אֱלֹהִים सच्चे परमेश्वर को सूचित करता है।
- source_word: הוֹצֵאתִיךָ
  choice: तुम्हें ... से निकाल लाया
  rationale: יצא के हिफ़ील रूप का अर्थ ‘बाहर निकालना/ले आना’ है। ‘निकाल लाया’ निर्गमन के प्रसंग में स्पष्ट, स्वाभाविक और कारणवाचक भाव के अनुरूप है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: מִן स्रोत को दर्शाता है; ‘मिस्र देश से’ संक्षिप्त और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִבֵּית עֲבָדִים
  choice: दासों के घर से
  rationale: עֲבָדִים बहुवचन ठोस संज्ञा ‘दास’ है। यह चयन इब्रानी संरचना और बंधुआ अवस्था की सामाजिक वास्तविकता को ‘दासता’ जैसे अमूर्त विकल्प की अपेक्षा अधिक सीधे रूप में सुरक्षित रखता है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: निर्गमन-सूत्र में עֲבָדִים का अनुवाद
  choice: दासों
  alternative: दासता / गुलामी
  rationale: इब्रानी में ठोस बहुवचन ‘दासों’ है। मुख्य पाठ में यही रूप रखा गया है, जबकि अधिक मुहावरेदार अमूर्त अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुम्हारा/तुम्हें’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। समानांतर ‘से ... से’ संरचना मूल के दोनों स्रोत-वाक्यांशों को बनाए रखती है।
