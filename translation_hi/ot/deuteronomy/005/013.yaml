  yaml_path: translation/ot/deuteronomy/005/013.yaml
  text: Six days you shall labor and do all your work,[a]
translation:
  language: hi
  text: छः दिन तुम परिश्रम करोगे और अपना सारा काम करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छः दिन तुम परिश्रम कर सकते हो और अपना सारा काम कर सकते हो।” इस कानूनी प्रसंग में इब्रानी अपूर्ण क्रियाओं को अनुदेशात्मक या अनुमतिमूलक समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: छः दिन
  rationale: संख्या और बहुवचन संज्ञा का यह निर्माण अवधि बताता है; हिन्दी में बिना अतिरिक्त परसर्ग के ‘छः दिन’ स्वाभाविक है।
- source_word: תַּעֲבֹד
  choice: तुम परिश्रम करना
  rationale: यहाँ עבד सामान्य श्रम को सूचित करता है। ‘परिश्रम करना’ अगले עשה के ‘काम करना’ से शब्दगत भेद भी बनाए रखता है; अनुदेशात्मक ‘करना’ कानूनी प्रसंग के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעָשִׂיתָ
  choice: और ... करना
  rationale: עשה का अर्थ यहाँ अपने कार्यों को करना है। ‘करना’ मְלַאכְתֶּךָ के साथ सहज है और इब्रानी समन्वय को बनाए रखता है।
- source_word: כָּל
  choice: सारा
  rationale: यह कार्य की संपूर्णता दर्शाता है; एकवचन भाव वाले ‘काम’ के साथ ‘सारा’ स्वाभाविक हिन्दी है।
- source_word: מְלַאכְתֶּךָ
  choice: अपना ... काम
  rationale: שבת के प्रसंग में מְלָאכָה काम, व्यवसाय या कार्य को सूचित करता है। ‘अपना सारा काम’ आधुनिक हिन्दी में स्वाभाविक है और द्वितीय पुरुष संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: विश्राम-दिन की व्यवस्था में अपूर्ण क्रियाओं का आदेशात्मक या अनुमतिमूलक बल
  choice: 'क्रियाओं को अनुदेशात्मक रूप में प्रस्तुत किया गया: ‘तुम परिश्रम करना और अपना सारा काम करना।’'
  alternative: ‘छः दिन तुम परिश्रम कर सकते हो और अपना सारा काम कर सकते हो।’
  rationale: वाचा-संबंधी कानूनी प्रसंग अनुदेशात्मक अर्थ का समर्थन करता है, पर इब्रानी अपूर्ण क्रिया इस संदर्भ में अनुमति भी व्यक्त कर सकती है। मुख्य पाठ आदेशात्मक बल रखता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कानूनी-अनुदेशात्मक स्वर। ‘तुम ... करना’ उत्तर भारतीय मानक हिन्दी में आज्ञा/निर्देश का स्वाभाविक रूप है; अनावश्यक रूप से कठोर ‘अवश्य’ से बचा गया है।
