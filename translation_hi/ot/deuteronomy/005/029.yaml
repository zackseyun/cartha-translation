id: DEU.5.29
reference: Deuteronomy 5:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: hi
  text: काश[a] उनका मन ऐसा ही हो कि वे मेरा भय मानें और जीवन भर मेरी सारी आज्ञाओं का पालन करें, ताकि उनका और उनकी संतानों का सदा भला हो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भला होता कि उनका मन ऐसा ही होता।” इब्रानी आरम्भिक मुहावरे का शाब्दिक रूप है, “कौन देगा...?” यह गहरी अभिलाषा व्यक्त करता है, कोई शाब्दिक प्रश्न नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि प्रबल अभिलाषा व्यक्त करता है; ‘काश’ आधुनिक हिन्दी में इसका स्वाभाविक और भावपूर्ण रूप है।
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: उनका मन सदा ऐसा ही रहे
  rationale: इब्रानी संरचना इच्छा की विषयवस्तु बताती है। ‘ऐसा ही’ उस प्रकार की आन्तरिक प्रवृत्ति की ओर संकेत करता है जिसका प्रसंग में वर्णन हुआ है; ‘रहे’ निरन्तरता को सहज हिन्दी में व्यक्त करता है।
- source_word: לְבָבָם
  choice: मन
  rationale: यहाँ ‘हृदय’ केवल भावनाओं का नहीं, बल्कि इच्छा, विचार और नैतिक प्रवृत्ति का केन्द्र है। आधुनिक सामान्य हिन्दी में ‘मन’ इस समग्र आन्तरिक अभिवृत्ति को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְיִרְאָה אֹתִי
  choice: मेरा भय मानें
  rationale: यह वाचा-संबंधी श्रद्धापूर्ण भय और आज्ञाकारी आदर को व्यक्त करता है। ‘भय मानना’ स्थापित हिन्दी बाइबलीय प्रयोग है और अर्थ को केवल ‘आदर’ तक सीमित नहीं करता।
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: मेरी सारी आज्ञाओं का पालन करें
  rationale: आज्ञाओं के साथ שׁמר का आशय उन्हें मानना और व्यवहार में पूरा करना है; ‘पालन करना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, पर प्रसंग में आशय उनके पूरे जीवनकाल से है; ‘जीवन भर’ इसे स्पष्ट और संक्षिप्त रूप में देता है।
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: ताकि उनका ... भला हो
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम और परमेश्वर की वाचा-संबंधी भलाई व्यक्त करता है; ‘भला हो’ समृद्धि को केवल भौतिक अर्थ तक सीमित नहीं करता।
- source_word: וְלִבְנֵיהֶם
  choice: उनकी सन्तानों का
  rationale: בנים यहाँ केवल पुत्रों के बजाय संतान अथवा वंशजों को समावेशी रूप से सूचित करता है।
- source_word: לְעֹלָם
  choice: सदा
  rationale: यह दीर्घकालिक, पीढ़ियों तक बनी रहने वाली भलाई को व्यक्त करता है; ‘सदा’ स्रोत की खुली कालगत व्यापकता बनाए रखता है।
theological_decisions:
- issue: לְבָבָם की मानवशास्त्रीय भाषा
  choice: मन
  alternative: हृदय
  rationale: स्रोत में ‘हृदय’ आन्तरिक इच्छा, विचार और नैतिक प्रवृत्ति का केन्द्र है। सामान्य आधुनिक हिन्दी में ‘मन’ इसी व्यापक आन्तरिक अभिवृत्ति को स्वाभाविक ढंग से संप्रेषित करता है, बिना इसे केवल बुद्धि तक सीमित किए।
- issue: יִיטַב की वाचा-संबंधी भलाई
  choice: भला हो
  alternative: समृद्ध हों
  rationale: ‘भला हो’ परमेश्वर की समग्र कृपा और कल्याण के अर्थ को खुला रखता है तथा इसे केवल आर्थिक या भौतिक समृद्धि नहीं बनाता।
- issue: בְנֵיהֶם का लिंग और विस्तार
  choice: उनकी सन्तानें
  alternative: उनके पुत्र
  rationale: इस वाचा-संदर्भ में व्याकरणिक पुल्लिंग शब्द भावी संतति या वंशजों को सामान्य रूप से दर्शाता है; ‘सन्तानें’ आशय को यथार्थ रूप से व्यक्त करता है।
- issue: मानवीय उत्तरदायित्व और व्यक्त की गई अभिलाषा
  choice: काश ... मन सदा ऐसा ही रहे
  alternative: कौन देगा कि उनका ऐसा मन हो
  rationale: मुहावरे को इच्छा के रूप में प्रस्तुत किया गया है। इससे आज्ञाकारिता की अपेक्षा बनी रहती है, पर पद में न कही गई कोई विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय मानें’, ‘आज्ञाओं का पालन’ और ‘भला हो’ जैसे परिचित वाचा-संबंधी पद स्रोत की धार्मिक गम्भीरता बनाए रखते हैं।
