  yaml_path: translation/ot/deuteronomy/005/004.yaml
  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: hi
  text: याहवे ने पहाड़ पर आग के बीच से तुम्हारे साथ आमने-सामने[a] बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘आमने-सामने’; यह प्रत्यक्ष और व्यक्तिगत संबोधन का मुहावरा है। व्यवस्थाविवरण 4:12 से तुलना करें, जहाँ इस्राएल वाणी सुनता है, पर कोई रूप नहीं देखता।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: आमने-सामने
  rationale: यह प्रचलित हिन्दी मुहावरा इब्रानी अभिव्यक्ति की प्रत्यक्षता और आलंकारिक शक्ति बनाए रखता है; इसे केवल ‘सीधे’ कहकर सपाट नहीं किया गया।
- source_word: דִּבֶּר
  choice: बात की
  rationale: עִמָּכֶם के साथ मिलकर इसका स्वाभाविक हिन्दी रूप ‘तुम्हारे साथ ... बात की’ है और यह परस्पर निकटता का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: इब्रानी पूर्वसर्ग עִם का सामान्य अर्थ ‘साथ’ है; यह ‘तुमसे’ की अपेक्षा मूल संरचना को अधिक स्पष्ट रूप से दर्शाता है।
- source_word: בָּהָר
  choice: पहाड़ पर
  rationale: यहाँ ב स्थानसूचक है और सीनै की परिस्थिति में ‘पहाड़ पर’ स्वाभाविक हिन्दी है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: מִתּוֹךְ केवल ‘से’ नहीं, बल्कि भीतर या मध्य से निकलने का भाव देता है; यह रूप दृश्य की सजीवता बनाए रखता है।
theological_decisions:
- issue: ‘आमने-सामने’ का मानवरूपी कथन और सीनै पर ईश्वर-दर्शन का प्रश्न
  choice: ‘आमने-सामने’ मुहावरा बनाए रखा गया है और इसे प्रत्यक्ष व्यक्तिगत संबोधन के रूप में खुला छोड़ा गया है।
  alternative: गलतफहमी से बचने के लिए ‘सीधे’ या ‘व्यक्तिगत रूप से’ कहना।
  rationale: व्यवस्थाविवरण 4:12, 15 के अनुसार इस्राएल ने वाणी सुनी, पर कोई रूप नहीं देखा। इसलिए अनुवाद न तो शाब्दिक दृश्य-दर्शन का दावा जोड़ता है, न मूल मुहावरे और उसके धर्मवैचारिक तनाव को मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली। ‘याहवे’ व्यक्तिगत नाम के रूप में रखा गया है; ‘आमने-सामने’ मूल मुहावरे को सुरक्षित रखता है।
