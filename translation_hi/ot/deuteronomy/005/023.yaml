  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अन्धकार’ और ‘गोत्र’ प्रसंगानुकूल बाइबिलीय शब्द हैं; ‘पुरनिए’ को केवल आयु नहीं, मान्य नेतृत्व-पद के अर्थ में चुना गया है।
