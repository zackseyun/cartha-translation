  text: וַ/יְהִ֗י כְּ/שָׁמְעֲ/כֶ֤ם אֶת הַ/קּוֹל֙ מִ/תּ֣וֹךְ הַ/חֹ֔שֶׁךְ וְ/הָ/הָ֖ר בֹּעֵ֣ר בָּ/אֵ֑שׁ וַ/תִּקְרְב֣וּ/ן אֵלַ֔/י כָּל רָאשֵׁ֥י שִׁבְטֵי/כֶ֖ם וְ/זִקְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: hi
  text: जब तुमने अंधकार के बीच से आवाज़[a] सुनी और पर्वत आग में जल रहा था, तब तुम मेरे पास आए—तुम्हारे गोत्रों के सभी प्रधान और तुम्हारे बुज़ुर्ग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्वनि’; इब्रानी शब्द क़ोल का अर्थ ‘आवाज़’ या ‘ध्वनि’ दोनों हो सकता है, पर यहाँ अंधकार में से परमेश्वर के बोलने के प्रसंग में ‘आवाज़’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: जब तुमने ... सुनी
  rationale: हिब्रू कथात्मक और कालवाचक रचना को स्वाभाविक हिन्दी में ‘जब’ से व्यक्त किया गया है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक रूप से बोझिल होता।
- source_word: הַקּוֹל
  choice: आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है। यहाँ परमेश्वर के बोलने का प्रसंग होने के कारण ‘आवाज़’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: अन्धकार के बीच से
  rationale: תּוֹךְ के ‘बीच/मध्य’ वाले स्थानिक बिम्ब को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: और पर्वत आग में जल रहा था
  rationale: कृदन्त בֹּעֵר चल रही समकालीन क्रिया बताता है। हिन्दी की अपूर्ण भूतकालीन रचना उस पृष्ठभूमि को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: तब तुम मेरे पास आए
  rationale: קרב और אֵלַי की गति को ‘मेरे पास आए’ सहज रूप से व्यक्त करता है; ‘तब’ मुख्य कथात्मक परिणाम को पूर्ववर्ती ‘जब’ उपवाक्य से जोड़ता है।
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: तुम्हारे गोत्रों के सभी प्रधान
  rationale: רָאשֵׁי का नेतृत्व-सूचक अर्थ ‘प्रधान’ से स्पष्ट होता है और ‘गोत्र’ बाइबिलीय सामाजिक इकाई को ठीक प्रकार व्यक्त करता है।
- source_word: וְזִקְנֵיכֶם
  choice: और तुम्हारे पुरनिए
  rationale: זְקֵנִים यहाँ केवल वृद्ध पुरुष नहीं, बल्कि मान्य सामुदायिक अगुवे हैं। ‘पुरनिए’ हिन्दी बाइबिलीय भाषा में इस संस्थागत भूमिका को संक्षेप में व्यक्त करता है।
