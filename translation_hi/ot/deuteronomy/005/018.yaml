  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक संक्षेप में: “व्यभिचार न करना।” हिब्रू में “और” है, जो इस आज्ञा को आस-पास की आज्ञाओं से जोड़ता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: और ... न
  rationale: उपसर्ग וְ इस आज्ञा को आस-पास की आज्ञाओं की शृंखला से जोड़ता है, इसलिए ‘और’ रखा गया है। לֹא को निषेधात्मक आज्ञा के स्वाभाविक हिन्दी रूप ‘न’ से व्यक्त किया गया है।
- source_word: תִּנְאָף
  choice: व्यभिचार ... करना
  rationale: נאף का क़ाल अपूर्ण, द्वितीय पुरुष पुल्लिंग एकवचन रूप यहाँ निषेधात्मक आज्ञा है। ‘व्यभिचार करना’ इसके वैवाहिक यौन-बेवफाई संबंधी अर्थ का सटीक, प्रचलित और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: वाचा-व्यवस्था में द्वितीय पुरुष पुल्लिंग एकवचन निषेध का अनुवाद
  choice: और व्यभिचार न करना।
  alternative: व्यभिचार मत करना।
  rationale: हिब्रू का एकवचन संबोधन वाचा के सदस्य को सीधे संबोधित करता है। ‘न करना’ दस आज्ञाओं की गंभीर विधिक शैली बनाए रखता है, जबकि ‘मत करना’ अधिक बोलचाल का प्रत्यक्ष निषेध है। आरंभ का ‘और’ हिब्रू संयोजक को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण और विधिक आज्ञात्मक शैली। ‘व्यभिचार’ सामान्य पाठकों के लिए परिचित है और मूल क्रिया के वैवाहिक बेवफाई के अर्थ को अनावश्यक विस्तार के बिना व्यक्त करता है।
