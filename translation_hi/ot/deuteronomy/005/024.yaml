id: DEU.5.24
reference: Deuteronomy 5:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אֶת כְּבֹד֣/וֹ וְ/אֶת גָּדְל֔/וֹ וְ/אֶת קֹל֥/וֹ שָׁמַ֖עְנוּ מִ/תּ֣וֹךְ הָ/אֵ֑שׁ הַ/יּ֤וֹם הַ/זֶּה֙ רָאִ֔ינוּ כִּֽי יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת הָֽ/אָדָ֖ם וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: hi
  text: और तुमने कहा, ‘देखो, यहोवा, हमारे परमेश्वर ने हमें अपनी महिमा और अपनी महानता दिखाई है, और हमने आग के बीच से उसकी आवाज़ सुनी है। आज हमने देख लिया है कि परमेश्वर मनुष्य से बात कर सकता है, और फिर भी मनुष्य जीवित रहता है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: अपनी महिमा और अपनी महानता
  rationale: दोनों समानांतर संज्ञाओं और उनके संबंधसूचक प्रत्ययों को स्पष्ट रूप से बनाए रखा गया है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: स्थान और स्रोत—दोनों का भाव रखने वाला स्वाभाविक हिन्दी प्रयोग।
- source_word: יְדַבֵּר ... אֶת־הָאָדָם
  choice: मनुष्य से बात कर सकता है
  rationale: यहाँ אֶת को बोलने के सहभागी के अर्थ में लिया गया है; प्रसंग किसी एक घटना से सामान्य संभावना सिद्ध करता है, इसलिए हिन्दी में ‘कर सकता है’ स्वाभाविक है।
- source_word: וָחָי
  choice: और फिर भी मनुष्य जीवित रहता है
  rationale: संक्षिप्त इब्रानी खंड के आश्चर्यजनक विरोधाभास को ‘फिर भी’ से व्यक्त किया गया और अस्पष्ट हिन्दी सर्वनाम से बचने के लिए निहित मानवीय कर्ता दोहराया गया है।
theological_decisions:
- issue: क्या मनुष्य परमेश्वर की वाणी सुनकर जीवित रह सकता है
  choice: परमेश्वर मनुष्य से बात कर सकता है, और फिर भी मनुष्य जीवित रहता है
  alternative: परमेश्वर मनुष्य से बात करता है और वह जीवित रहता है
  rationale: इब्रानी अपूर्ण क्रिया और पूरे वाक्य का अनुभवजन्य निष्कर्ष यहाँ संभावना व्यक्त कर सकता है। अनुवाद चमत्कारपूर्ण तथ्य को रखता है, पर इसे सार्वभौमिक सिद्धांत से अधिक कठोर नहीं बनाता।
- issue: וָחָי का कर्ता
  choice: मनुष्य
  alternative: वह
  rationale: व्याकरण और प्रसंग में जीवित रहने वाला הָאָדָם है। हिन्दी में केवल ‘वह’ रखने से उसका संकेत परमेश्वर की ओर समझा जा सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘देखो’ הֵן की ध्यान आकर्षित करने वाली शक्ति रखता है।
