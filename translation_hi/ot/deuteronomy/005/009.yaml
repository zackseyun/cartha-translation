  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: hi
  text: तुम उनके सामने दण्डवत् न करना और उनकी सेवा न करना[a], क्योंकि मैं यहोवा, तुम्हारा परमेश्वर, जलन रखने वाला परमेश्वर हूँ; मैं पिताओं के अधर्म का हिसाब उनकी सन्तानों पर, तीसरी और चौथी पीढ़ी के लोगों पर लेता हूँ—अर्थात् उन पर जो मुझसे बैर रखते हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सामने भूमि पर गिरकर प्रणाम करना।” इब्रानी क्रिया श्रद्धापूर्वक झुकने या दण्डवत् होने की शारीरिक क्रिया बताती है।
    reason: lexical_alternative
  - marker: b
    text: या “पिताओं के अधर्म के लिए उनकी सन्तानों को दण्ड देता हूँ” अथवा “उन्हें उसके लिए उत्तरदायी ठहराता हूँ।” इब्रानी शब्द का मूल भाव न्यायिक रूप से ध्यान देना या हिसाब लेना है और इसमें दण्ड भी सम्मिलित हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “तीसरे और चौथे लोगों पर”; “पीढ़ी” अर्थ स्पष्ट करने के लिए जोड़ा गया है।
    reason: lexical_alternative
