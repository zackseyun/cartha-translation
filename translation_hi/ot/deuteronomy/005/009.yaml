  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֵל קַנָּא
  choice: जलन रखने वाला परमेश्वर
  rationale: कनाअ वाचा के सम्बन्ध में परमेश्वर के अनन्य अधिकार और प्रतिद्वन्द्वी उपासना को अस्वीकार करने का भाव रखता है। ‘जलन रखने वाला’ इस कठिन सम्बन्धपरक भाषा को नरम किए बिना स्वाभाविक हिन्दी देता है।
- source_word: פֹּקֵד
  choice: लेखा ... लेता हूँ
  rationale: पोक़ेद न्यायिक निरीक्षण, हिसाब लेने और दण्ड तक की अर्थ-सीमा रखता है। ‘लेखा लेना’ शाब्दिक ‘भेंट करना’ की अस्वाभाविकता से बचते हुए इसे केवल ‘दण्ड देना’ तक संकुचित नहीं करता।
