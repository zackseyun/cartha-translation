  choice: जो मुझसे बैर रखते हैं
  rationale: यह अन्तिम पद न्याय के दायरे को उन लोगों से जोड़ता है जो परमेश्वर के प्रति विरोध बनाए रखते हैं; हिन्दी में इसे आरम्भ में रखकर यह सम्बन्ध स्पष्ट किया गया है, बिना वंशगत न्याय के तनाव को मिटाए।
theological_decisions:
- issue: ईश्वरीय jealousy का अनुवाद
  choice: जलन रखने वाला परमेश्वर
  alternative: ईर्ष्यालु परमेश्वर; अपने अधिकार के लिए उत्साही परमेश्वर
  rationale: यह वाचा में केवल परमेश्वर की उपासना की माँग और प्रतिद्वन्द्वी निष्ठा की अस्वीकृति व्यक्त करता है। ‘जलन’ सम्बन्धपरक विशिष्टता को बनाए रखती है, जबकि ‘उत्साही’ इसे हल्का कर सकता है और ‘ईर्ष्यालु’ हिन्दी में निकृष्ट डाह का अधिक प्रबल संकेत देता है।
- issue: क्या पिताओं के अधर्म का न्याय सन्तानों पर उनकी अपनी मुद्रा की परवाह किए बिना होता है
  choice: ‘जो मुझसे बैर रखते हैं’ को न्यायाधीन पीढ़ियों की निरन्तर विरोधी मुद्रा से जोड़ा गया है
  alternative: सन्तान केवल पिताओं के अपराध के कारण स्वतः दण्ड पाती हैं
  rationale: इब्रानी वाक्य के अन्त में आया לְשֹׂנְאָי न्याय-वर्णन को सीमित करता है। वाक्य-रचना इसे स्पष्ट करती है, पर पिताओं के अधर्म और बाद की पीढ़ियों पर उसके लेखे के बीच मूल तनाव को समाप्त नहीं करती।
