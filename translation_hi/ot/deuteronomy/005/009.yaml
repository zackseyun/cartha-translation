- source_word: אָבוֹת
  choice: पिताओं
  rationale: मूल शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है; इसलिए इसे ‘माता-पिता’ या ‘पूर्वज’ बनाकर सामान्यीकृत नहीं किया गया।
- source_word: עַל בָּנִים
