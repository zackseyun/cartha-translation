source:
  edition: WLC
  text: לֹ֥א תִשָּׂ֛א אֶת שֵֽׁם יְהוָ֥ה אֱלֹהֶ֖י/ךָ לַ/שָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהוָ֔ה אֵ֛ת אֲשֶׁר יִשָּׂ֥א אֶת שְׁמ֖/וֹ לַ/שָּֽׁוְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: hi
  text: तुम अपने परमेश्वर याहवे का नाम व्यर्थ न लो[a], क्योंकि जो उसका नाम व्यर्थ लेता है, उसे याहवे निर्दोष न ठहराएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठ के लिए,” “अनुचित रीति से,” अथवा “खोखले ढंग से।” इब्रानी अभिव्यक्ति याहवे के नाम के झूठे या अर्थहीन प्रयोग सहित व्यापक दुरुपयोग को समेट सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “दंड दिए बिना न छोड़ेगा” अथवा “दोषमुक्त न करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: लेना / लेता है
  rationale: नשא का मूल अर्थ ‘उठाना, ढोना, धारण करना’ हो सकता है, पर ‘नाम’ के साथ इस आज्ञा में हिंदी का स्वाभाविक और परिचित प्रयोग ‘नाम लेना’ है। इससे अर्थ को केवल शपथ खाने या प्रतिनिधित्व करने तक सीमित नहीं किया गया।
- source_word: שֵׁם
  choice: नाम
  rationale: मूल शब्द का सीधा अनुवाद है; इसमें प्रतिष्ठा, अधिकार और आह्वान की ध्वनियाँ हो सकती हैं, जिन्हें संकुचित करने के बजाय ‘नाम’ में बनाए रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: दूसरे पुरुष एकवचन के वाचा-संबंधी संबोधन को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: לַשָּׁוְא
  choice: व्यर्थ
  rationale: שָׁוְא में व्यर्थता, खोखलापन, असत्य और अनुचित प्रयोग का अर्थ-क्षेत्र है। ‘व्यर्थ’ मुख्य पाठ में इस व्यापकता को अपेक्षाकृत खुला रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है और आधुनिक हिंदी में स्पष्ट है।
- source_word: יְנַקֶּה (נקה)
  choice: निर्दोष न ठहराएगा
  rationale: पिएल रूप यहाँ दोष या दंड से मुक्त न करने का न्यायिक भाव रखता है। ‘निर्दोष न ठहराएगा’ मूल की दोष-संबंधी भाषा को बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: अपराध करने वाले व्यक्ति को सामान्य रूप से सूचित करने वाला स्वाभाविक हिंदी संबंधवाचक रूप है।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: सर्वनाम का संदर्भ यहवे की ओर है; हिंदी में उसे स्पष्ट और स्वाभाविक रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: आज्ञा के निषेध का दायरा
  choice: नाम व्यर्थ लेना
  alternative: नाम का दुरुपयोग करना; नाम लेकर झूठ बोलना; नाम को झूठ के लिए उठाना
  rationale: इब्रानी वाक्यांश झूठी शपथ, खोखले आह्वान और ईश्वरीय नाम के अन्य अनुचित प्रयोगों को समेट सकता है। मुख्य पाठ किसी एक व्याख्या तक इसे सीमित नहीं करता।
- issue: נקה का न्यायिक परिणाम
  choice: निर्दोष न ठहराएगा
  alternative: दंड दिए बिना न छोड़ेगा; दोषमुक्त न करेगा
  rationale: यह चयन मूल की दोषमुक्ति संबंधी भाषा को बनाए रखता है, जबकि पादटिप्पणी उसके दंडात्मक निहितार्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और प्रत्यक्ष आज्ञात्मक रूप अपनाया गया है। ‘नाम लेना’ सामान्य पाठक के लिए परिचित है, जबकि पादटिप्पणी इब्रानी की व्यापक अर्थ-संभावना बचाती है। एकवचन संबोधन के लिए ‘तुम’ प्रयोग किया गया है।
