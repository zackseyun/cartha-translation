  language: hi
  text: तुम्हारे लिए मेरे सामने कोई अन्य देवता न हों[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे सिवा।” हिब्रू में शाब्दिक अर्थ “मेरे मुख के सामने” है; इससे उपस्थिति और अनन्यता—दोनों का भाव व्यक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: तुम्हारे लिए ... न हो
  rationale: हिब्रू में היה के साथ לְךָ संबंध या अधिकार व्यक्त करता है। यह हिंदी में निषेध की गंभीरता और एकवचन संबोधन बनाए रखते हुए स्वाभाविक है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: कोई दूसरा देवता
  rationale: यहाँ बहुवचन संज्ञा और विशेषण अन्य प्रतिद्वंद्वी देवताओं को सूचित करते हैं। निषेधात्मक हिंदी वाक्य में ‘कोई दूसरा देवता’ स्वाभाविक रूप से सामूहिक और व्यापक निषेध व्यक्त करता है।
- source_word: עַל פָּנָי
  choice: मेरे सामने
  rationale: शाब्दिक अर्थ ‘मेरे मुख के सामने’ है। ‘मेरे सामने’ उपस्थिति और संबंधपरक टकराव का भाव रखता है, जबकि ‘मेरे सिवा’ वाली विशिष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: עַל פָּנָי का अर्थ
  choice: मेरे सामने
  alternative: मेरे सिवा / मेरी उपस्थिति में
  rationale: हिब्रू पदबंध स्थानगत उपस्थिति और उससे निकलने वाली अनन्यता—दोनों को व्यक्त कर सकता है। मुख्य पाठ अधिक औपचारिक रूप से पारदर्शी अर्थ रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘तुम्हारे’ मूल के एकवचन संबोधन को बनाए रखता है; ‘देवता’ इस संदर्भ में प्रतिद्वंद्वी आराध्य को स्पष्ट करता है।
