base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: hi
  text: याहवेह हमारे परमेश्वर ने होरेब में हमारे साथ वाचा बाँधी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “होरेब में हमारे साथ वाचा काटी।”
    reason: इब्रानी मुहावरे כָּרַת בְּרִית की शाब्दिक छवि सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित इब्रानी पद का सीधा और स्वाभाविक अर्थ है, जो वाचा-संबंध को बनाए रखता है।
- source_word: כָּרַת
  choice: बाँधी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘काटी’ है, पर आधुनिक हिन्दी में वाचा के साथ ‘बाँधना’ अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह परमेश्वर और इस्राएल के बीच औपचारिक, संबंधपरक प्रतिबद्धता के लिए प्रचलित और अर्थगर्भित हिन्दी शब्द है।
- source_word: עִמָּנוּ
  choice: हमारे साथ
  rationale: संबंधसूचक इब्रानी पद का सीधा हिन्दी प्रतिरूप है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और בְ को इस प्रसंग में स्वाभाविक हिन्दी स्थानवाचक ‘में’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से आया है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके लिप्यंतरित किया गया है। ‘याहवेह’ संभावित प्राचीन उच्चारण को हिन्दी में स्पष्ट रूप से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘वाचा बाँधी’ हिन्दी में स्वाभाविक है, जबकि मूल मुहावरे की शाब्दिक छवि पादटिप्पणी में रखी गई है।
