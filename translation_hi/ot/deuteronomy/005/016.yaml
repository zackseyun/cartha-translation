id: DEU.5.16
reference: Deuteronomy 5:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: hi
  text: अपने पिता और अपनी माता का आदर करना, जैसा तुम्हारे परमेश्वर यहोवा ने तुम्हें आज्ञा दी है, ताकि तुम्हारे दिन लंबे हों और उस भूमि पर तुम्हारा भला हो जिसे तुम्हारा परमेश्वर यहोवा तुम्हें दे रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: आदर करना
  rationale: पिएल आज्ञार्थक यहाँ माता-पिता को महत्त्व और सम्मान देने का आदेश व्यक्त करता है। हिंदी की निषेधात्मक आज्ञाओं के साथ समानांतर दशवचन शैली में प्रयुक्त क्रियार्थक रूप 'आदर करना' स्वाभाविक और आदेशात्मक है।
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: अपने पिता और अपनी माता
  rationale: दोनों संज्ञाओं से पहले दोहराए गए אֶת की संतुलित अभिव्यक्ति बनाए रखने के लिए 'अपनी' दोनों के साथ रखा गया है।
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: जैसा ... ने तुम्हें आज्ञा दी है
  rationale: यह वाक्यांश पहले दी गई ईश्वरीय आज्ञा के अनुरूप होने का भाव रखता है; हिंदी में पूर्ण क्रिया 'दी है' उसका वर्तमान प्रासंगिक प्रभाव भी स्वाभाविक ढंग से बताती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित प्रतिलिप्यंतरण 'यहोवा' द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदले बिना सुरक्षित रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का अर्थ आधुनिक हिंदी में स्पष्ट और सहज रूप से व्यक्त होता है; दोनों संबंधित परिणामों को एक संयुक्त वाक्य में रखा गया है।
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: तुम्हारे दिन लंबे हों
  rationale: यह स्रोत की ठोस इब्रानी अभिव्यक्ति के निकट है और 'तुम लंबी आयु पाओ' जैसी अधिक व्याख्यात्मक पुनर्रचना से बचता है।
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: और ... तुम्हारा भला हो
  rationale: יִיטַב לָךְ का कल्याण-सूचक मुहावरा हिंदी में 'तुम्हारा भला हो' से स्वाभाविक और व्यापक रूप में व्यक्त होता है।
- source_word: עַל הָאֲדָמָה
  choice: उस भूमि पर
  rationale: אֲדָמָה यहाँ सामान्य मिट्टी नहीं बल्कि परमेश्वर की दी हुई भूमि है; 'पर' עַל को निकटता से दर्शाता है।
- source_word: נֹתֵן לָךְ
  choice: तुम्हें दे रहा है
  rationale: वर्तमान कृदंत दान की चल रही अथवा आसन्न, निश्चित क्रिया को व्यक्त करता है; 'दे रहा है' इस पक्ष को बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से है। उसे उपाधि 'प्रभु' से बदलने के बजाय हिंदी में परिचित नामरूप 'यहोवा' रखा गया है।
- issue: माता-पिता के आदर से जुड़ी प्रतिज्ञा का स्वरूप
  choice: भूमि पर दीर्घ जीवन और भलाई की वाचागत प्रतिज्ञा को उसके मूल खुलेपन सहित रखना
  alternative: इसे हर व्यक्ति के लिए निरपवाद दीर्घायु की गारंटी मानना, या केवल राष्ट्रीय रूपक तक सीमित करना
  rationale: इब्रानी पाठ वास्तविक प्रतिज्ञा देता है, पर स्वयं इसे न तो सरल निरपवाद व्यक्तिगत सूत्र बनाता है, न केवल सामूहिक अमूर्तन। अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध। वाक्य में एकवचन 'तुम्हारे/तुम्हें' रखा गया है, क्योंकि इब्रानी संबोधन पुल्लिंग एकवचन है। आदेश के लिए 'आदर करना' दशवचन की हिंदी सूची-शैली के अनुकूल है। अंग्रेज़ी परामर्श-पाठ के फुटनोट चिह्न मुख्य वाक्य के संबंधित अंशों से मेल नहीं खाते और मूल पाठ में कोई वास्तविक पाठांतर नहीं दर्शाते, इसलिए निराधार चिह्न जोड़ने के बजाय कोई फुटनोट नहीं दिया गया।
