- source_word: וְ/לֹא
  choice: और ... न
  rationale: וְ इस आज्ञा को पिछली आज्ञाओं की शृंखला से जोड़ता है, इसलिए ‘और’ रखा गया है; לֹא के साथ अपूर्ण क्रिया यहाँ निषेधात्मक आज्ञा व्यक्त करती है, जिसे स्वाभाविक हिन्दी में ‘न करना’ कहा गया है।
- source_word: תִּגְנֹב
  choice: चोरी ... करना
