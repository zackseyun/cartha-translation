  alternative: किसी को न मारना।
  rationale: हिब्रू क्रिया רָצַח मारने के लिए प्रयुक्त व्यापक क्रिया नहीं है; यह मुख्यतः हत्या या अनुचित मानव-वध की ओर संकेत करती है। यह चयन व्यवस्था में विभिन्न प्रकार की मृत्यु और वध के बीच किए गए भेद को भी बनाए रखता है।
