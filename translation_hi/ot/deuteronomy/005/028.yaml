  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: hi
  text: और जब तुम मुझसे बोल रहे थे, तब यहोवा ने तुम्हारी बातें[a] सुनीं। यहोवा ने मुझसे कहा, “मैंने इस प्रजा की वे बातें सुनी हैं जो उन्होंने तुमसे कही हैं। उन्होंने जो कुछ कहा है, वह सब उन्होंने अच्छा कहा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे शब्दों की आवाज़”; यह एक इब्रानी श्रवण-संबंधी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने जो कुछ कहा है, उसमें उन्होंने अच्छा किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य हिंदी बाइबल-परंपरा में प्रचलित लिप्यंतरण से व्यक्त किया गया है; इसे उपाधि से नहीं बदला गया।
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: सुनी / मैंने ... सुनी है
  rationale: यहाँ שׁמע बोले गए शब्द सुनने को दर्शाता है। प्रत्यक्ष वचन में पूर्ण हुई क्रिया की वर्तमान प्रासंगिकता के लिए पूर्ण वर्तमान स्वाभाविक है।
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: तुम्हारी बातों की आवाज़ / बातों की आवाज़
  rationale: इससे קול का श्रवण-संबंधी बल और मूल इब्रानी मुहावरा सुरक्षित रहता है, यद्यपि हिंदी में केवल ‘बातें’ भी अधिक सहज हो सकता है।
- source_word: בְּדַבֶּרְכֶם אֵלָי
  choice: जब तुम मुझसे बोल रहे थे
  rationale: ב के साथ infinitive construct मुख्य क्रिया के साथ चल रही समकालीन क्रिया बताता है; हिंदी का अपूर्ण प्रगतिशील रूप यह संबंध स्पष्ट करता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: עָם के सामूहिक एकवचन और संकेतवाचकता को गरिमापूर्ण, स्वाभाविक हिंदी में रखा गया है।
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: जो उन्होंने तुमसे कही हैं
  rationale: संबंधवाचक उपवाक्य को पूर्ववर्ती ‘बातों’ से जोड़ते हुए דבר की वाणी-संबंधी पुनरावृत्ति बनाए रखी गई है।
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: उन्होंने जो कुछ कहा है, वह सब अच्छा कहा है
  rationale: הֵיטִיבוּ का मूल अर्थ ‘अच्छा किया’ है, पर निकटवर्ती कथन के संदर्भ में हिंदी में ‘अच्छा कहा’ स्वाभाविक और अर्थ-संगत है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिंदी पाठ में प्रचलित नामरूप ‘यहोवा’ उस विशिष्टता को बनाए रखता है और उसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: הֵיטִיבוּ में कथन की स्वीकृति या सामान्य आचरण
  choice: वाणी-संदर्भ में ‘सब अच्छा कहा है’
  alternative: ‘उन्होंने अच्छा किया है’
  rationale: व्याकरणतः क्रिया सामान्यतः ‘अच्छा करना’ कह सकती है, लेकिन כָּל אֲשֶׁר דִּבֵּרוּ उसे यहाँ लोगों के कथन के मूल्यांकन से जोड़ता है। वैकल्पिक औपचारिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘बातों की आवाज़’ मूल की श्रवणात्मक अभिव्यक्ति को जानबूझकर बनाए रखता है; पादटिप्पणी उसके शाब्दिक स्वरूप को स्पष्ट करती है।
