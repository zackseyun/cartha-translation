base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: hi
  text: और मूसा ने सारे इस्राएल को बुलाया और उनसे कहा, “हे इस्राएल, सुनो![a] जो विधियाँ और न्याय-विधान[b] मैं आज तुम्हें सुना रहा हूँ, उन्हें सीखो, उनका पालन करो और उन्हें व्यवहार में लाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “सुनो” का अर्थ केवल कानों से सुनना नहीं, बल्कि ध्यान देकर ग्रहण करना और उसके अनुसार चलना भी है।
    reason: lexical_alternative
  - marker: b
    text: “न्याय-विधान” का अनुवाद “नियम,” “अध्यादेश” या “न्याय-संबंधी निर्णय” भी किया जा सकता है। इब्रानी शब्द निर्धारित कानूनी मानकों या निर्णयों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא यहाँ लोगों को संबोधन के लिए बुलाने का भाव रखता है; ‘बुलाकर’ कथा के प्रवाह में स्वाभाविक है और औपचारिक सभा बुलाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह पूरे वाचा-समुदाय का सामूहिक नाम है; ‘सारे इस्राएल’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस सामूहिक संबोधन को बनाए रखता है।
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: हे इस्राएल, सुनो!
  rationale: आज्ञार्थक שׁמע केवल ध्वनि सुनने नहीं, ध्यान देकर ग्रहण करने और आज्ञापालन की ओर बढ़ने का भाव रखता है। ‘सुनो’ मूल की संक्षिप्तता और वाचाई गंभीरता बनाए रखता है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: חקים निर्धारित वैधानिक आदेशों या अधिनियमों को सूचित करता है; ‘विधियाँ’ स्पष्ट कानूनी-वाचाई पद है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: משׁפטים न्यायिक निर्णयों, नियमों या निर्धारित कानूनी मानकों को सूचित कर सकता है। ‘न्याय-विधान’ חקים से भेद बनाए रखते हुए उसके न्यायिक और वैधानिक दोनों पक्ष व्यक्त करता है।
- source_word: דֹּבֵר
  choice: कह रहा हूँ
  rationale: कृदन्त वर्तमान में जारी वाणी को व्यक्त करता है; ‘कह रहा हूँ’ हिन्दी में उस सतत वर्तमान क्रिया को स्वाभाविक रूप से दर्शाता है।
- source_word: בְּאָזְנֵיכֶם
  choice: तुम्हारे सुनते हुए
  rationale: शाब्दिक अर्थ ‘तुम्हारे कानों में’ है, अर्थात प्रत्यक्ष श्रव्य संबोधन। ‘तुम्हारे सुनते हुए’ उस श्रव्य और तत्काल प्रसंग को बनाए रखता है, यद्यपि हिन्दी में जानबूझकर कुछ औपचारिक है।
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: उन्हें सीखो
  rationale: למד यहाँ विधानों को ग्रहण करने और जान लेने की आज्ञा देता है; ‘सीखो’ इस व्यापक अर्थ को संक्षेप में रखता है।
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: उनका पालन करने में सावधानी बरतो
  rationale: שׁמר के ‘ध्यान से मानना/रक्षा करना’ और לעשותם के व्यावहारिक रूप से पूरा करने के भाव को यह सहज हिन्दी में संयुक्त रूप से व्यक्त करता है।
theological_decisions:
- issue: חקים और משפטים की अलग-अलग कानूनी संज्ञाएँ
  choice: विधियाँ और न्याय-विधान
  alternative: विधियाँ और नियम
  rationale: दोनों इब्रानी पद संबंधित हैं, पर एक समान नहीं। अलग पदों से अनुवाद करने पर मूल कानूनी शब्दावली की बनावट बचती है और बाद की किसी धर्मसैद्धांतिक श्रेणी को आरोपित नहीं किया जाता।
- issue: वाचाई आग्रह में שׁמע का बल
  choice: हे इस्राएल, सुनो!
  alternative: हे इस्राएल, ध्यान दो!
  rationale: ‘सुनो’ मूल क्रिया की श्रवण-छवि और प्रसिद्ध संबोधन की गंभीरता रखता है; पाद-टिप्पणी स्पष्ट करती है कि इसका आशय निष्क्रिय सुनना मात्र नहीं है।
- issue: וּשְׁמַרְתֶּם לַעֲשֹׂתָם में आज्ञापालन का संबंध
  choice: उनका पालन करने में सावधानी बरतो
  alternative: उन्हें मानो, ताकि उन पर चलो
  rationale: मूल में आदेशों को संभालकर रखने और उन्हें व्यवहार में करने, दोनों पर बल है। चुना गया रूप उद्देश्य-संबंध को स्वाभाविक हिन्दी में रखता है, बिना यह तय किए कि infinitive केवल उद्देश्य है या परिणाम भी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘तुम्हारे सुनते हुए’ मूल इब्रानी श्रवण-मुहावरे को सामान्य हिन्दी में यथासंभव निकट रखता है; शेष वाक्य में सहजता के लिए अंतिम दो क्रियाओं को ‘पालन करने में सावधानी बरतो’ के रूप में व्यक्त किया गया है।
