revisions:
- from: तू अपने लिए कोई खुदी हुई मूर्ति[a], या किसी भी चीज़ की कोई आकृति[b] न बनाना—चाहे वह ऊपर आकाश में हो, नीचे पृथ्वी पर हो, या पृथ्वी के नीचे जल में हो।
  to: तू अपने लिए कोई तराशी हुई प्रतिमा, या किसी भी ऐसी वस्तु की आकृति[a] न बनाना जो ऊपर आकाश में, नीचे पृथ्वी पर, अथवा पृथ्वी के नीचे जल में हो।
  rationale: The revision uses a more precise and natural Hindi expression for a carved image, improves the attachment and flow of the comprehensive likeness clause, and retains the source text's restrained prohibition without importing the worship language of the next verse. The lexical alternative footnote is retained at the term it explains and its punctuation is corrected.
  reviewer_model: gpt-5.6-terra
