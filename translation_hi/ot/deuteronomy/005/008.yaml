source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: hi
  text: तू अपने लिए कोई तराशी हुई प्रतिमा, या किसी भी ऐसी वस्तु की आकृति[a] न बनाना जो ऊपर आकाश में, नीचे पृथ्वी पर, अथवा पृथ्वी के नीचे जल में हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रूप” अथवा “प्रतिरूप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: खुदी हुई मूर्ति
  rationale: यह शब्द काटकर या खोदकर बनाई गई प्रतिमा को दर्शाता है और प्रायः मूर्तिपूजा के संदर्भ में आता है। ठोस अर्थ रखा गया है; केवल 'मूर्ति' कहने से निर्माण की विधि अस्पष्ट होती और 'आराध्य-मूर्ति' कहना व्याख्या को पद में जोड़ देता।
- source_word: תְּמוּנָה
  choice: आकृति
  rationale: यह किसी रूप, समानता या प्रतिरूप को सूचित करता है। आधुनिक हिन्दी में 'आकृति' स्वाभाविक है और פֶסֶל से आगे निषेध की व्यापकता को बनाए रखता है।
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: तू अपने लिए ... न बनाना
  rationale: वाचा-संबंधी आज्ञा का प्रत्यक्ष एकवचन संबोधन और לְךָ का निजी उपयोग/अधिग्रहण सुरक्षित है। संदर्भ की दस आज्ञाओं वाली गरिमा के अनुरूप 'तू' रखा गया है।
- source_word: כָּל תְּמוּנָה
  choice: किसी भी चीज़ की कोई आकृति
  rationale: निषेधात्मक वाक्य में כָּל की समावेशी व्यापकता 'किसी भी...कोई' से स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: चाहे वह ऊपर आकाश में हो
  rationale: ऊर्ध्व क्षेत्र का स्थानगत संबंध स्पष्ट रहता है। हिन्दी में सामूहिक अर्थ वाला 'आकाश' स्वाभाविक है, यद्यपि इब्रानी रूप व्याकरणतः बहुवचन है।
- source_word: בָּאָרֶץ מִתָּחַת
  choice: नीचे पृथ्वी पर
  rationale: पृथ्वी पर स्थित जीवों या वस्तुओं के लिए हिन्दी का स्वाभाविक परसर्ग 'पर' है; 'नीचे' आकाश के साथ ऊर्ध्वाधर विरोध बनाए रखता है।
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: पृथ्वी के नीचे जल में
  rationale: वाक्यांश प्राचीन विश्व-चित्र के अनुसार भूमि के नीचे के जल का सीधा संकेत देता है; इसे आधुनिक व्याख्या से नहीं बदला गया।
theological_decisions:
- issue: प्रतिमा-निषेध का दायरा
  choice: पद को खुदी हुई मूर्ति अथवा आकृति बनाने के निषेध के रूप में अनूदित किया गया है; आराधना का उद्देश्य इसमें नहीं जोड़ा गया।
  alternative: इसे व्याख्यात्मक रूप से केवल आराधना के लिए मूर्तियाँ बनाने का निषेध कहना।
  rationale: झुकने और सेवा करने का निषेध अगले पद में स्पष्ट होता है। यहाँ उसे जोड़ना पाठ की क्रमिक अभिव्यक्ति और उसके तनाव को समय से पहले हल कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। एकवचन वाचा-संबंधी संबोधन के लिए 'तू' और आज्ञात्मक शैली में 'न बनाना' प्रयुक्त है।
