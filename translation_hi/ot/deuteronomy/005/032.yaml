base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: hi
  text: इसलिए ध्यान रखो कि तुम ठीक वैसा ही करो, जैसा याहवे तुम्हारे परमेश्वर ने तुम्हें आज्ञा दी है। दाएँ या बाएँ मत मुड़ना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दाएँ या बाएँ मत मुड़ना” एक इब्रानी मुहावरा है, जिसका अर्थ है परमेश्वर की आज्ञा से किसी भी दिशा में न हटना।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם
  choice: इसलिए ध्यान रखो
  rationale: שׁמר के साथ उद्देश्यसूचक infinitive आज्ञा को सावधानी से मानने का भाव देता है। वाक्य के आरंभ का וּ संदर्भगत निष्कर्ष/परिणाम बताता है, इसलिए आधुनिक हिन्दी में “इसलिए” स्वाभाविक है।
- source_word: לַ/עֲשׂוֹת
  choice: कि तुम ... करो
  rationale: עשה यहाँ दी गई आज्ञा को व्यवहार में पूरा करने के अर्थ में है। हिन्दी में “ध्यान रखो कि ... करो” उद्देश्य और आज्ञापालन दोनों को सहज रूप से व्यक्त करता है।
- source_word: כַּ/אֲשֶׁר
  choice: ठीक वैसा ही ... जैसा
  rationale: यह पदबंध परमेश्वर की आज्ञा के पूर्ण अनुरूप आचरण पर बल देता है। “ठीक वैसा ही ... जैसा” उस अनुरूपता को स्पष्ट रखता है।
- source_word: צִוָּה
  choice: आज्ञा दी है
  rationale: पूर्ण क्रिया पूर्व में दी गई, किंतु अभी भी बाध्यकारी आज्ञा को दर्शाती है; हिन्दी पूर्णकाल “दी है” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי/כֶם
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय का संबंधवाचक और वाचा-संबंधी भाव सीधे रूप में सुरक्षित है।
- source_word: לֹא תָסֻרוּ
  choice: न ... मुड़ना
  rationale: סור यहाँ निर्धारित मार्ग से हटने का रूपक है। “मुड़ना” मार्ग-चित्र को बनाए रखता है और निषेधात्मक निर्देश में स्वाभाविक है।
- source_word: יָמִין וּ/שְׂמֹאל
  choice: दाएँ ... न बाएँ
  rationale: दोनों दिशाओं का उल्लेख किसी भी ओर आज्ञा से विचलित न होने का इब्रानी मुहावरा है। हिन्दी की संतुलित रचना “न दाएँ ... न बाएँ” मूल की संक्षिप्तता और बल को सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। “याहवे” उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: दाएँ या बाएँ न मुड़ने का आशय
  choice: मार्ग-रूपक को मुख्य पाठ में बनाए रखना
  alternative: किसी भी प्रकार विचलित न होना
  rationale: मूल की दिशात्मक भाषा आज्ञापालन को मार्ग के रूप में चित्रित करती है। अर्थ को व्याख्यात्मक अनुवाद से सीमित करने के बजाय मुहावरे का आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। बहुवचन संबोधन के लिए सामान्य आधुनिक हिन्दी “तुम” प्रयुक्त है। दूसरे वाक्य की संक्षिप्त निषेधात्मक रचना मूल के जोर और मार्ग-रूपक को बनाए रखती है।
