language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עֹ֥שֶׂה חֶ֖סֶד לַֽ/אֲלָפִ֑ים לְ/אֹהֲבַ֖/י וּ/לְ/שֹׁמְרֵ֥י מצות/ו׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: hi
  text: परन्तु मैं हज़ारों के लिए अटल प्रेम दिखाता हूँ—उन लोगों के लिए जो मुझसे प्रेम करते हैं और उसकी आज्ञाओं का पालन करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: परन्तु … करता हूँ
  rationale: यह कृदन्त पिछले पद के दण्ड-वर्णन के विपरीत परमेश्वर के प्रेम को सामने रखता है। संदर्भानुसार ‘परन्तु’ विरोध को स्वाभाविक रूप से व्यक्त करता है और ‘करता हूँ’ प्रथम पुरुष के चल रहे कथन से मेल खाता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में प्रेम के साथ निष्ठा और स्थिरता का भाव है। ‘अटल प्रेम’ आधुनिक हिन्दी में सरल रहते हुए इस गहराई को व्यक्त करता है।
- source_word: לַאֲלָפִים
  choice: हज़ारों पर
  rationale: इब्रानी पाठ में केवल ‘हज़ारों’ है; ‘पीढ़ियाँ’ जैसा कोई संज्ञा-पद स्पष्ट रूप से नहीं दिया गया। इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया और अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: לְאֹהֲבַי
  choice: उन पर जो मुझसे प्रेम करते
  rationale: प्रथम पुरुष प्रत्यय सहित कृदन्त को हिन्दी में सम्बन्धवाचक उपवाक्य द्वारा सहज और ठीक रूप में व्यक्त किया गया है।
- source_word: וּלְשֹׁמְרֵי
  choice: और … पालन करते हैं
  rationale: שמר का अर्थ रक्षा करना, मानना या पालन करना हो सकता है; आज्ञाओं के साथ ‘पालन करना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: מצותו
  choice: उसकी आज्ञाओं
  rationale: दिए गए WLC पाठ में तृतीय पुरुष एकवचन प्रत्यय ו है, इसलिए पाठ को जैसा दिया गया है वैसा ही ‘उसकी’ अनूदित किया गया है; प्रसंगानुकूल ‘मेरी’ पाठांतर को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘आज्ञाओं’ के साथ सर्वनाम
  choice: उसकी आज्ञाओं
  alternative: मेरी आज्ञाओं
  rationale: प्रस्तुत इब्रानी रूप מצותו में तृतीय पुरुष एकवचन प्रत्यय है। यद्यपि आस-पास का प्रथम पुरुष कथन ‘मेरी आज्ञाओं’ की अपेक्षा उत्पन्न करता है और कुछ पाठ-परम्पराएँ ऐसा पढ़ती हैं, मुख्य अनुवाद दिए गए मूल पाठ का अनुसरण करता है तथा तनाव को पादटिप्पणी में सुरक्षित रखता है।
- issue: ‘हज़ारों’ का अभिप्राय
  choice: हज़ारों
  alternative: हज़ारों पीढ़ियों
  rationale: इब्रानी में ‘पीढ़ियाँ’ शब्द नहीं है। उसे मुख्य पाठ में जोड़ने से सम्भावित अर्थ निश्चित हो जाता; अतः मूल की संक्षिप्तता और अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। दीर्घ विराम-चिह्न के बीच आया स्पष्टीकरण ‘हज़ारों’ और उसके बाद के वर्णन का सम्बन्ध स्पष्ट करता है, जबकि मूल पाठ की दो महत्त्वपूर्ण अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
