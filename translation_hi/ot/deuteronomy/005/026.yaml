  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: hi
  text: क्योंकि सभी नश्वर मनुष्यों[a] में ऐसा कौन है, जिसने हमारी तरह आग के बीच में से बोलते हुए जीवित परमेश्वर की वाणी सुनी हो और जीवित रहा हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “समस्त देह”; यह नश्वर मानवजाति के लिए प्रयुक्त मुहावरा है।
    reason: मूल इब्रानी मुहावरे और उसके नश्वर मानवता संबंधी भाव को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में लोगों के भय और निवेदन का कारण प्रस्तुत करता है।
- source_word: מִי כָל בָּשָׂר
  choice: सभी नश्वर मनुष्यों में ऐसा कौन
  rationale: शाब्दिक ‘समस्त देह में कौन’ हिन्दी में अस्वाभाविक है। ‘नश्वर मनुष्य’ इब्रानी मुहावरे में निहित मानव की देहधारी और मरणशील दशा को स्पष्ट रखता है।
- source_word: קוֹל
  choice: वाणी
  rationale: बोलने वाले परमेश्वर के संदर्भ में इसका अर्थ सामान्य ध्वनि नहीं, बल्कि सुनाई देने वाली वाणी है।
- source_word: אֱלֹהִים חַיִּים
  choice: जीवित परमेश्वर
  rationale: रूप की दृष्टि से शब्द बहुवचन-जैसे हैं, पर इब्रानी प्रयोग और संदर्भ में यह इस्राएल के एक परमेश्वर के लिए प्रयुक्त एकवचन पदवी है।
- source_word: מְדַבֵּר מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच में से बोलते हुए
  rationale: यह आग के भीतर से आने वाली परमेश्वर की वाणी का सजीव चित्र सुरक्षित रखता है।
- source_word: כָּמֹנוּ
  choice: हमारी तरह
  rationale: तुलना इस्राएल के अपने अनुभव से है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: וַיֶּחִי
  choice: और जीवित रहा हो
  rationale: मूल क्रिया के सीधे अर्थ ‘जीवित रहना’ को रखा गया है; ‘बच गया’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: כָל בָּשָׂר में मानवता के लिए देह-संबंधी मुहावरा
  choice: सभी नश्वर मनुष्यों
  alternative: समस्त देह / कोई मनुष्य
  rationale: ‘नश्वर’ मनुष्य की सीमित, मरणशील दशा को बनाए रखता है, जबकि शाब्दिक ‘समस्त देह’ आधुनिक हिन्दी में अर्थ को अस्पष्ट कर सकता है। पादटिप्पणी मूल मुहावरा बताती है।
- issue: אֱלֹהִים חַיִּים की संख्या और अभिप्राय
  choice: जीवित परमेश्वर
  alternative: जीवित देवता
  rationale: बहुवचन रूप के बावजूद तत्काल संदर्भ और स्थापित इब्रानी प्रयोग एक ही परमेश्वर को सूचित करते हैं; बहुवचन अनुवाद संदर्भ को गलत प्रस्तुत करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आलंकारिक प्रश्न तथा आग के बीच से सुनाई देने वाली दिव्य वाणी की तीव्रता सुरक्षित है।
