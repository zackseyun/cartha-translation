source:
  edition: WLC
  text: לֹ֣א אֶת אֲבֹתֵ֔י/נוּ כָּרַ֥ת יְהוָ֖ה אֶת הַ/בְּרִ֣ית הַ/זֹּ֑את כִּ֣י אִתָּ֗/נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַ/יּ֖וֹם כֻּלָּ֥/נוּ חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: hi
  text: याहवे ने यह वाचा हमारे पूर्वजों[a] के साथ नहीं बाँधी[b], बल्कि हमारे साथ[c]—हम सभी के साथ, जो आज यहाँ जीवित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हमारे पिताओं’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक मुहावरा है, ‘यह वाचा काटी’।
    reason: lexical_alternative
  - marker: c
    text: 'कुछ लोग इस विरोध को आलंकारिक बलाघात मानते हैं: वाचा केवल हमारे पूर्वजों के साथ नहीं, बल्कि विशेष रूप से हम लोगों के साथ भी है, जो आज यहाँ जीवित हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרַת ... אֶת הַבְּרִית
  choice: यह वाचा ... बाँधी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटना’ है, पर आधुनिक हिन्दी में ‘वाचा बाँधना’ स्वाभाविक है और सम्बन्ध स्थापित करने का भाव सुरक्षित रखता है। ‘यह’ से הַזֹּאת भी व्यक्त होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֲבֹתֵינוּ
  choice: हमारे पूर्वजों
  rationale: शाब्दिक रूप ‘हमारे पिताओं’ है; आधुनिक सामान्य हिन्दी में वंश की पिछली पीढ़ियों के लिए ‘पूर्वजों’ अधिक स्वाभाविक और स्पष्ट है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: बल्कि
  rationale: नकार के बाद यह शब्द यहाँ स्पष्ट विरोध प्रस्तुत करता है; ‘बल्कि’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: אִתָּנוּ אֲנַחְנוּ אֵלֶּה
  choice: हमारे साथ—हम सभी के साथ
  rationale: इब्रानी की बलाघाती पुनरुक्ति और संकेतसूचक अनुप्रयोग को हिन्दी में दोहराव द्वारा व्यक्त किया गया है, बिना अस्वाभाविक शब्दक्रम अपनाए।
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: हम सभी के साथ, जो आज यहाँ जीवित हैं
  rationale: ‘आज’, ‘यहाँ’, ‘सभी’ और ‘जीवित’—मूल के चारों अर्थ-तत्त्व स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित हैं।
theological_decisions:
- issue: क्या यह पद पूर्वजों के साथ किसी भी वाचागत सम्बन्ध का पूर्ण निषेध करता है, या वर्तमान पीढ़ी पर वाचा की विशेष प्रासंगिकता पर बल देता है?
  choice: 'मुख्य पाठ में मूल का सीधा विरोध रखा गया है: पूर्वजों के साथ नहीं, बल्कि आज जीवित वर्तमान समुदाय के साथ।'
  alternative: इसे ‘केवल हमारे पूर्वजों के साथ नहीं’ अर्थात वाचा के नवीनीकरण अथवा वर्तमान पीढ़ी पर विशेष बल के रूप में समझना।
  rationale: मूल इब्रानी में ‘केवल’ नहीं है। उसे मुख्य पाठ में जोड़ना तनाव को पहले ही सुलझा देता; इसलिए वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ बाइबलीय सन्दर्भ का सटीक और प्रचलित शब्द है; ‘याहवे’ व्यक्तिगत दिव्य नाम का लिप्यंतरण है। इब्रानी बलाघात को दीर्घ विराम और ‘हमारे साथ—हम सभी के साथ’ की पुनरुक्ति से व्यक्त किया गया है।
