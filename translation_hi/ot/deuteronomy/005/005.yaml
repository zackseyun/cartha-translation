  text: אָ֠נֹכִי עֹמֵ֨ד בֵּין יְהוָ֤ה וּ/בֵֽינֵי/כֶם֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/הַגִּ֥יד לָ/כֶ֖ם אֶת דְּבַ֣ר יְהוָ֑ה כִּ֤י יְרֵאתֶם֙ מִ/פְּנֵ֣י הָ/אֵ֔שׁ וְ/לֹֽא עֲלִיתֶ֥ם בָּ/הָ֖ר לֵ/אמֹֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: hi
  text: 'उस समय मैं यहोवा और तुम्हारे बीच खड़ा था, ताकि तुम्हें यहोवा का वचन बताऊँ, क्योंकि तुम आग के कारण[a] डर गए थे और पहाड़ पर नहीं चढ़े थे, इस प्रकार:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: «आग के सामने/उपस्थिति से»; यह इब्रानी मुहावरा यहाँ आग के कारण भयभीत होने का अर्थ देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָ֠נֹכִי עֹמֵד
  choice: मैं ... खड़ा था
  rationale: स्वतंत्र सर्वनाम और कालवाचक कृदंत मूसा की मध्यस्थ स्थिति पर बल देते हैं; बीते प्रसंग में हिंदी का ‘खड़ा था’ स्वाभाविक है।
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: यहोवा और तुम्हारे बीच
  rationale: दो पक्षों के बीच मूसा की मध्यस्थ स्थिति को सीधे व्यक्त करता है और दिव्य नाम को नाम के रूप में सुरक्षित रखता है।
- source_word: לְהַגִּיד לָכֶם
  choice: ताकि तुम्हें ... सुनाऊँ
  rationale: हिफ़ील रूप संदेश पहुँचाने या बताने का भाव रखता है; वचन के मौखिक संप्रेषण के लिए ‘सुनाऊँ’ सहज हिंदी है।
- source_word: אֶת דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यहाँ דָּבָר परमेश्वर के कहे हुए संदेश को दर्शाता है; ‘वचन’ परिचित, गरिमापूर्ण और अर्थानुकूल है।
- source_word: מִפְּנֵי הָאֵשׁ
  choice: आग के कारण
  rationale: शाब्दिक रूप ‘आग के सामने/उपस्थिति से’ है, पर प्रसंग में यह भय के कारण को बताने वाला इब्रानी मुहावरा है।
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: और पहाड़ पर नहीं चढ़े थे
  rationale: עלה और בָּהָר का दिशात्मक अर्थ स्वाभाविक हिंदी में ‘पहाड़ पर चढ़ना’ है; पूर्ण भूतकाल आसपास के वर्णन से मेल खाता है।
- source_word: לֵאמֹר
  choice: उसने कहा,
  rationale: यह आगे आने वाली यहोवा की वाणी का परिचय देता है। हिंदी में केवल ‘कहते हुए’ रखने से कर्ता मूसा समझा जा सकता है; ‘उसने कहा’ संदर्भगत वक्ता को स्पष्ट करते हुए अगले पद से संबंध बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम स्पष्ट रूप से आया है। हिंदी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे सामान्य उपाधि ‘प्रभु’ से बदलने पर नाम और उपाधि का भेद मिट जाता।
- issue: לֵאמֹר के निहित वक्ता की पहचान
  choice: उसने कहा
  alternative: कहते हुए
  rationale: मूल का सूत्र स्वयं कर्ता को दोहराता नहीं और अगले पद में परमेश्वर की वाणी आरंभ होती है। हिंदी में अस्पष्ट कृदंत मूसा को वक्ता समझा सकता है, इसलिए सर्वनाम द्वारा संदर्भगत वक्ता दर्शाया गया है, बिना नाम जोड़कर अत्यधिक व्याख्या किए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सरल शैली। वाक्य को अगले पद में आने वाली प्रत्यक्ष वाणी से जोड़ने के लिए अंत में अल्पविराम रखा गया है।
