source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: hi
  text: और याद रखना कि तुम मिस्र देश में गुलाम थे, और तुम्हारा परमेश्वर याहवे तुम्हें वहाँ से बलवान हाथ[a] और फैलाई हुई भुजा से निकाल लाया; इसीलिए तुम्हारे परमेश्वर याहवे ने तुम्हें सब्त के दिन का पालन करने[b] की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामर्थी हाथ।” यह इब्रानी मुहावरा याहवे के शक्तिशाली छुटकारे के कार्य पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “सब्त के दिन को करने।” इब्रानी अभिव्यक्ति का अर्थ उस दिन को मानना या उसका पालन करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: और याद रखना
  rationale: संयोजक וְ के साथ यह रूप आज्ञात्मक बल रखता है। ‘और याद रखना’ पिछले आदेश से संबंध तथा स्मरण करने की पुकार—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כִּי עֶבֶד הָיִיתָ
  choice: कि तुम ... गुलाम थे
  rationale: כִּי यहाँ स्मरण की विषय-वस्तु प्रस्तुत करता है। עֶבֶד के लिए ‘गुलाम’ मिस्र में बँधी हुई और उत्पीड़ित अवस्था को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: इब्रानी के ‘मिस्र के देश में’ को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘देश’ की ठोस अभिव्यक्ति भी बनी रहती है।
- source_word: וַיֹּצִאֲךָ ... מִשָּׁם
  choice: तुम्हें वहाँ से ... निकाल लाया
  rationale: יצא के हिफ़ील रूप में किसी को बाहर निकालने का अर्थ है; ‘निकाल लाया’ निर्गमन और छुटकारे की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर याहवे
  rationale: व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है; אֱלֹהֶיךָ का एकवचन संबोधन ‘तुम्हारा परमेश्वर’ है।
- source_word: בְּיָד חֲזָקָה
  choice: बलवान हाथ के द्वारा
  rationale: ‘बलवान हाथ’ इब्रानी बिंब और חזק की शक्ति-सूचक धारणा को बनाए रखता है; ‘के द्वारा’ साधन का अर्थ स्पष्ट करता है।
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: और बढ़ाई हुई भुजा के द्वारा
  rationale: यह छुटकारा दिलाने में प्रकट परमेश्वर की सामर्थ्य का इब्रानी बिंब है। ‘बढ़ाई हुई भुजा’ उसे व्याख्यात्मक रूप से सपाट किए बिना बनाए रखता है।
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह मिस्र की गुलामी से छुटकारे और सब्त की आज्ञा के बीच स्पष्ट निष्कर्षात्मक संबंध व्यक्त करता है।
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: सब्त के दिन का पालन करने
  rationale: शाब्दिक ‘सब्त के दिन को करना’ हिन्दी में अस्वाभाविक है। प्रसंग में इसका मुहावरेदार अर्थ उस दिन को मानना या उसका पालन करना है।
theological_decisions:
- issue: יהוה परमेश्वर के निज नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निज नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: मिस्र में इस्राएल की עֶבֶד अवस्था
  choice: गुलाम
  alternative: दास; सेवक
  rationale: यह पद विश्राम की आज्ञा को इस्राएल की बँधी हुई अवस्था और छुटकारे से जोड़ता है। ‘गुलाम’ उस कठोर पराधीनता को आधुनिक हिन्दी में स्पष्ट रखता है; ‘सेवक’ उसे हल्का कर सकता है।
- issue: सब्त को ‘करने’ का अर्थ
  choice: सब्त के दिन का पालन करना
  alternative: सब्त के दिन को करना; सब्त का दिन मानना
  rationale: मूल अभिव्यक्ति का रूप जानबूझकर पादटिप्पणी में सुरक्षित है, जबकि मुख्य पाठ में उसका प्रसंगानुकूल मुहावरेदार अर्थ दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘गुलाम’ बँधुआ अवस्था को बिना नरम किए बताता है; ‘परमेश्वर’, ‘भुजा’ और ‘सब्त’ बाइबलीय गरिमा बनाए रखते हैं। वाक्य में एकवचन सामूहिक ‘तुम’ मूल इब्रानी के 2ms संबोधन को दर्शाता है।
