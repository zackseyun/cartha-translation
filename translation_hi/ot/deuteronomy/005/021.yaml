source:
  edition: WLC
  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: hi
  text: तुम अपने पड़ोसी की पत्नी का लालच न करो, और अपने पड़ोसी के घर, उसके खेत, उसके दास, उसकी दासी, उसके बैल, उसके गधे या उसकी किसी भी वस्तु की लालसा न करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַחְמֹד
  choice: लालच करना
  rationale: חמד यहाँ दूसरे की वस्तु को पाने की अनुचित इच्छा व्यक्त करता है। ‘लालच करना’ आधुनिक हिन्दी में इसकी नैतिक निषेधात्मक शक्ति को स्पष्ट रखता है।
- source_word: אֵשֶׁת רֵעֶךָ
  choice: अपने पड़ोसी की पत्नी
  rationale: सम्बन्धवाचक रचना का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: תִתְאַוֶּה
  choice: लालसा करना
  rationale: אוה के हित्पएल रूप को पहले प्रयुक्त חמד से अलग रखते हुए तीव्र इच्छा का भाव व्यक्त करता है; इससे मूल के दो अलग क्रियापद समतल नहीं होते।
- source_word: בֵּית רֵעֶךָ
  choice: अपने पड़ोसी के घर
  rationale: בַּיִת का अर्थ घर या गृहस्थी हो सकता है; आगे सम्पत्ति की सूची होने के कारण यहाँ ‘घर’ सबसे सहज है, यद्यपि व्यापक अर्थ पूरी तरह नकारा नहीं जाता।
- source_word: שָׂדֵהוּ
  choice: उसके खेत
  rationale: שָׂדֶה का सामान्य और विशिष्ट अर्थ ‘खेत’ है; व्यवस्थाविवरण की सूची में इसे स्पष्ट रूप से बनाए रखा गया है।
- source_word: עַבְדּוֹ
  choice: उसके दास
  rationale: सम्पत्ति-सूची का प्रसंग बंधुआ/स्वामित्व की स्थिति को प्रमुख बनाता है; ‘दास’ इसे ‘सेवक’ की अपेक्षा अधिक स्पष्टता से दर्शाता है।
- source_word: אֲמָתוֹ
  choice: उसकी दासी
  rationale: אָמָה स्त्री दास को दर्शाता है; ‘दासी’ पुरुषवाचक ‘दास’ के साथ मूल का लिंगभेद बनाए रखता है।
- source_word: שׁוֹרוֹ
  choice: उसके बैल
  rationale: שׁוֹר के लिए कृषि और भारवाही पशु के प्रसंग में ‘बैल’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: חֲמֹרוֹ
  choice: उसके गधे
  rationale: חֲמוֹר का सीधा और प्रचलित हिन्दी समतुल्य ‘गधा’ है।
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: या उसकी किसी भी वस्तु
  rationale: यह समापन वाक्यांश पड़ोसी की हर वस्तु को समाविष्ट करता है; निकटवर्ती ‘अपने पड़ोसी’ के कारण ‘उसकी’ का सम्बन्ध स्पष्ट है।
- source_word: רֵעֶךָ
  choice: अपने पड़ोसी
  rationale: רֵעַ के लिए ‘पड़ोसी’ स्थापित, सहज और पारस्परिक नैतिक सम्बन्ध को व्यक्त करने वाला शब्द है।
theological_decisions:
- issue: आज्ञा में प्रयुक्त दो निषेधात्मक क्रियाओं का भेद
  choice: חמד को ‘लालच करना’ और אוה को ‘लालसा करना’
  alternative: दोनों को ‘लालच करना’ या दोनों को ‘इच्छा करना’
  rationale: इब्रानी में दो परस्पर सम्बद्ध पर अलग क्रियाएँ हैं। हिन्दी में उनका भेद बनाए रखने से व्यवस्थाविवरण की आलंकारिक संरचना और अर्थगत तनाव सुरक्षित रहता है।
- issue: दासता-सूचक शब्दों का अनुवाद
  choice: ‘दास’ और ‘दासी’
  alternative: ‘सेवक’ और ‘सेविका’
  rationale: यहाँ दोनों व्यक्ति गृह-सम्पत्ति की सूची में आते हैं, इसलिए बंधुआ स्थिति को अस्पष्ट करने वाला ‘सेवक’ उपयुक्त नहीं। ‘दास/दासी’ मूल के लिंगभेद को भी बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा आज्ञात्मक रूप। ‘लालच’ और ‘लालसा’ के द्वारा दोनों इब्रानी क्रियाओं का भेद रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में भी कोई पादटिप्पणी-चिह्न नहीं है।
