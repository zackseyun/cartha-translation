  to: तुम अपने पड़ोसी की पत्नी का लालच न करो, और अपने पड़ोसी के घर, उसके खेत, उसके दास, उसकी दासी, उसके बैल, उसके गधे या उसकी किसी भी वस्तु की लालसा न करो।
