  source_fidelity: The draft includes every Hebrew element in the proper order, explicitly retains the Deuteronomic addition “his field,” distinguishes חמד from תתאוה, and correctly renders the gendered slave terms. However, the infinitival prohibitions “पत्नी का लालच न करना” and especially the final construction with “लालसा करना” are less idiomatic and leave the syntactic scope of the second verb less clear than it should be.
  naturalness: 'Modern Hindi is clearer with finite negative imperatives: “लालच न करो” and “लालसा न करो.” Repeating “अपने पड़ोसी” at the start of the second clause reflects the Hebrew and makes the possessive references in the list unambiguous.'
  terminology: “दास/दासी,” “बैल,” and “गधे” are accurate and suitably direct in this household-property list. “लालच” and “लालसा” preserve the lexical distinction without overinterpreting it.
  issues:
