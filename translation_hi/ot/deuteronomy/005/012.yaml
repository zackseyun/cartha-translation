  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: hi
  text: सब्त के दिन का ध्यानपूर्वक पालन करो और उसे पवित्र रखो, जैसा तुम्हारे परमेश्वर याहवे ने तुम्हें आज्ञा दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמוֹר
  choice: सावधानी से मानना
  rationale: यहाँ क्रिया का रूप आज्ञार्थक बल रखता है और ध्यानपूर्वक पालन करने का भाव देता है। यह निर्गमन 20:8 के ‘याद रखना’ से भिन्नता भी बनाए रखता है।
- source_word: יוֹם הַשַׁבָּת
  choice: सब्त के दिन
  rationale: आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है तथा किसी सामान्य विश्राम के बजाय निर्धारित दिन को सूचित करता है।
- source_word: לְקַדְּשׁוֹ
  choice: उसे पवित्र रखना
  rationale: उद्देश्यसूचक वाक्यांश दिन को पवित्र अर्थात अलग ठहराकर मानने का निर्देश देता है; ‘पवित्र बनाना’ यहाँ अनावश्यक कारणात्मक अर्थ दे सकता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: पूर्व में दी गई ईश्वरीय आज्ञा के अनुरूपता-संबंध को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִוְּךָ
  choice: तुम्हें आज्ञा दी है
  rationale: צוה अधिकारपूर्ण आदेश को सूचित करता है। हिन्दी पूर्णकाल पूर्व में दी गई और अब भी प्रासंगिक आज्ञा के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित वाचा-संबंधी संबोधन का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठकों के लिए स्पष्ट किंतु गरिमापूर्ण। ‘सावधानी से मानना’ मूल क्रिया के ध्यानपूर्ण पालन के भाव को स्पष्ट करता है; वाक्य की आज्ञार्थकता हिन्दी के कृदंत-आज्ञा विन्यास में रखी गई है।
