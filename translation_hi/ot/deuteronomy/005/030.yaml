  text: לֵ֖ךְ אֱמֹ֣ר לָ/הֶ֑ם שׁ֥וּבוּ לָ/כֶ֖ם לְ/אָהֳלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: hi
  text: जा, उनसे कह, ‘अपने तंबुओं में लौट जाओ।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: जा
  rationale: הלך का एकवचन पुल्लिंग आज्ञार्थक रूप है। यहाँ मूसा को जाकर संदेश देने की सीधी आज्ञा है; ‘जा’ स्वाभाविक और सटीक है।
- source_word: אֱמֹר
  choice: कह
  rationale: אמר का एकवचन पुल्लिंग आज्ञार्थक रूप है, जो आगे दिए गए संदेश का परिचय कराता है। ‘कह’ मूल की सरल वाक्-क्रिया को बनाए रखता है।
- source_word: לָהֶם
  choice: उनसे
  rationale: पूर्वसर्ग לְ और तृतीय पुरुष बहुवचन प्रत्यय संबोधित लोगों को दर्शाते हैं। आधुनिक हिन्दी में ‘उनसे कह’ स्वाभाविक प्रयोग है।
- source_word: שׁוּבוּ
  choice: लौट जाओ
  rationale: שוב का बहुवचन आज्ञार्थक रूप अपने पिछले स्थान पर वापस जाने का निर्देश देता है। ‘लौट जाओ’ दिशा और विदाई—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָכֶם
  choice: अपने
  rationale: यहाँ לְ के साथ द्वितीय पुरुष बहुवचन प्रत्यय अपने ही स्थान की ओर लौटने का भाव देता है। हिन्दी में इसका मुहावरेदार समतुल्य ‘अपने’ है।
- source_word: לְאָהֳלֵיכֶם
  choice: तंबुओं में
  rationale: शाब्दिक अर्थ ‘तुम्हारे तंबुओं को/की ओर’ है। लौटने की क्रिया के साथ हिन्दी में गंतव्य के लिए ‘तंबुओं में’ स्वाभाविक है और ऐतिहासिक ठोस बिंब सुरक्षित रहता है।
