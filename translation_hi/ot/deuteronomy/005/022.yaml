  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: hi
  text: याहवे ने ये वचन पर्वत पर तुम्हारी सारी सभा से आग, बादल और घने अंधकार के बीच से ऊँचे स्वर में कहे, और उसने फिर कुछ नहीं कहा।[a] उसने उन्हें पत्थर की दो पटियाओं पर लिखा और मुझे दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसने बोलना जारी नहीं रखा।” इब्रानी वाक्यांश का अर्थ “उसने फिर कुछ नहीं कहा” अथवा “उसने बोलना जारी नहीं रखा” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन वचनों को
  rationale: ‘वचन’ कथित बातों का भाव बनाए रखता है और यहाँ अनावश्यक रूप से ‘आज्ञाएँ’ नहीं जोड़ता। हिन्दी वाक्य-विन्यास के कारण ‘इन वचनों को’ को आरम्भ में रखा गया है।
- source_word: כָּל קְהַלְכֶם
  choice: तुम्हारी सारी सभा से
  rationale: קָהָל एकत्र हुए पूरे समुदाय को दर्शाता है; ‘सभा’ स्वाभाविक और सामूहिक अर्थ वाला आधुनिक हिन्दी शब्द है।
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: आग, बादल और घोर अन्धकार के बीच से
  rationale: ‘बीच से’ מִתּוֹךְ की स्थानगत सजीवता बनाए रखता है और ‘घोर अन्धकार’ עֲרָפֶל की गहनता व्यक्त करता है।
- source_word: קוֹל גָּדוֹל
  choice: ऊँचे स्वर में
  rationale: शाब्दिक ‘बड़े स्वर’ के बजाय यह स्वाभाविक हिन्दी में दिव्य वाणी की प्रबल श्रव्यता व्यक्त करता है।
- source_word: וְלֹא יָסָף
  choice: और इसके आगे कुछ नहीं कहा
  rationale: यह प्रसंगानुकूल रूप से बताता है कि उक्त वचनों में और कुछ नहीं जोड़ा गया, जबकि इब्रानी वाक्यांश की दूसरी सम्भव समझ पादटिप्पणी में सुरक्षित है।
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: पत्थर की दो पटियाओं
  rationale: यह इब्रानी रचना का स्पष्ट और हिन्दी में प्रचलित स्वाभाविक रूप है।
- source_word: וַיִּתְּנֵם אֵלָי
  choice: मुझे दे दिया
  rationale: निरन्तर कर्ता यहोवा है और बहुवचन कर्म का सन्दर्भ पटियाओं/लिखे वचनों से स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसे शीर्षक से बदलने के बजाय हिन्दी पाठकों में परिचित नाम-रूप रखा गया है।
- issue: וְלֹא יָסָף का अर्थ
  choice: और इसके आगे कुछ नहीं कहा
  alternative: और उसने बोलना जारी नहीं रखा
  rationale: मुख्य पाठ में कथित वचनों की पूर्णता का प्रसंगानुकूल अर्थ रखा गया है; क्रिया के ‘जारी रखना’ वाले सम्भव अर्थ को पादटिप्पणी में देकर वास्तविक अर्थगत अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। ‘वचन’, ‘सभा’ और ‘पटियाएँ’ बाइबलीय प्रसंग में परिचित हैं, पर अत्यधिक पुरातन नहीं। वर्तनी में ‘अन्धकार’ का मानक साहित्यिक रूप अपनाया गया है।
