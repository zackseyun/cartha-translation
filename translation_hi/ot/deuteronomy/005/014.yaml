  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: hi
  text: परन्तु सातवाँ दिन तुम्हारे परमेश्वर याहवे के लिए सब्त है। तुम कोई भी काम न करना—न तुम, न तुम्हारा बेटा, न तुम्हारी बेटी, न तुम्हारा दास, न तुम्हारी दासी[a], न तुम्हारा बैल, न तुम्हारा गधा, न तुम्हारा कोई भी पशुधन, और न वह परदेशी[b] जो तुम्हारे फाटकों[c] के भीतर रहता है—ताकि तुम्हारा दास और तुम्हारी दासी भी तुम्हारी तरह विश्राम कर सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ और ‘दासी’ के इब्रानी शब्द घराने के अधीन बंधुआ पुरुष और स्त्री को दर्शाते हैं; इनका अर्थ केवल वेतन पाने वाले सेवक नहीं है।
    reason: सामाजिक और शाब्दिक अर्थ स्पष्ट करना
  - marker: b
    text: अर्थात समुदाय के बीच रहने वाला गैर-इस्राएली निवासी, न कि केवल कुछ समय के लिए आया यात्री।
    reason: शाब्दिक विकल्प और सांस्कृतिक अर्थ
  - marker: c
    text: शाब्दिक रूप से ‘तुम्हारे फाटकों के भीतर’; यह नगर या स्थानीय समुदाय की सीमा में रहने का मुहावरा है।
    reason: प्राचीन सांस्कृतिक मुहावरा
lexical_decisions:
- source_word: שַׁבָּת
  choice: सब्त
  rationale: यह किसी सामान्य विश्राम को नहीं, बल्कि वाचा में निर्धारित पवित्र विश्राम-दिन को नाम देता है; ‘सब्त’ हिन्दी बाइबलीय प्रयोग में स्थापित और संक्षिप्त है।
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर याहवे के लिए
  rationale: ל समर्पण या संबंध का भाव व्यक्त करता है; ‘के लिए’ दिन के याहवे को समर्पित होने का अर्थ स्वाभाविक हिन्दी में रखता है। याहवे मूल पाठ के व्यक्तिगत ईश्वरीय नाम יהוה को दर्शाता है।
- source_word: מְלָאכָה
  choice: काम
  rationale: सब्त की इस आज्ञा में निषिद्ध कार्य की व्यापक श्रेणी के लिए यह सरल और स्वाभाविक हिन्दी शब्द है; किसी खास पेशे या केवल कठिन श्रम तक अर्थ सीमित नहीं करता।
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: तुम्हारा दास / तुम्हारी दासी
  rationale: दोनों शब्द घराने के अधीन पुरुष और स्त्री बंधुआ सदस्यों का भेद बनाए रखते हैं। ‘दास/दासी’ हिन्दी में इस सामाजिक अधीनता को ‘सेवक/सेविका’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: שׁוֹר / חֲמוֹר / בְּהֵמָה
  choice: बैल / गधा / कोई अन्य पालतू पशु
  rationale: पहले दो पशुओं को अलग बनाए रखते हुए בְּהֵמָה को प्रसंगानुसार घरेलू पशुधन के व्यापक वर्ग के रूप में व्यक्त किया गया है; ‘अन्य’ हिन्दी में सूची का संबंध स्पष्ट करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह केवल राह चलते यात्री को नहीं, इस्राएली समुदाय में रहने वाले गैर-स्थानीय निवासी को सूचित करता है। ‘परदेशी’ मुख्य पाठ में सुबोध है और पादटिप्पणी उसके निवासी होने का आशय स्पष्ट करती है।
- source_word: בִּשְׁעָרֶיךָ
  choice: तुम्हारे फाटकों के भीतर
  rationale: मूल रूपक को सुरक्षित रखा गया है; प्राचीन नगर के फाटक उसके नगर-क्षेत्र और सामुदायिक अधिकार-सीमा को सूचित करते हैं।
- source_word: לְמַעַן יָנוּחַ
  choice: ताकि … विश्राम कर सकें
  rationale: לְמַעַן का प्रयोजन-भाव और יָנוּחַ का विश्राम का अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम है। ‘याहवे’ उस नाम को नाम के रूप में बनाए रखता है, बिना उसे ‘प्रभु’ में बदलने के।
- issue: עבד और אמה की सामाजिक स्थिति
  choice: दास / दासी
  alternative: सेवक / सेविका; गुलाम / गुलाम स्त्री
  rationale: आज्ञा घराने के अधीन बंधुआ पुरुष और स्त्री को समान विश्राम देती है। ‘दास/दासी’ स्थिति और लिंग-भेद दोनों बचाता है, जबकि ‘सेवक’ बंधुआ स्थिति को हल्का कर सकता है और ‘गुलाम स्त्री’ हिन्दी में असहज है।
- issue: सब्त के प्रयोजन में दास-दासी का समान विश्राम
  choice: भी तुम्हारी तरह विश्राम कर सकें
  alternative: तुम्हारे समान विश्राम करे
  rationale: כָמוֹךָ का समानता-भाव और दास-दासी दोनों पर लागू उद्देश्य स्पष्ट रखा गया है; इसे सामाजिक समानता के व्यापक दावे में न बढ़ाकर इसी आज्ञा के विश्राम तक सीमित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञा की लय बनाए रखने के लिए ‘न तुम, न…’ वाली सूची और दीर्घ विराम-चिह्न का प्रयोग किया गया है। ‘सब्त’, ‘याहवे’ और ‘दास/दासी’ स्रोत-पाठ की धार्मिक तथा सामाजिक विशिष्टता को बिना व्याख्यात्मक विस्तार के मुख्य पाठ में बनाए रखते हैं।
