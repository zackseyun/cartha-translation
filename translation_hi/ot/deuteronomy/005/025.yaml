id: DEU.5.25
reference: Deuteronomy 5:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: hi
  text: और अब हम क्यों मरें? क्योंकि यह बड़ी आग हमें भस्म कर देगी। यदि हम आगे भी याहवे, हमारे परमेश्वर, की वाणी सुनते रहे, तो हम मर जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालवाचक עַתָּה दोनों को रखते हुए पिछले प्रसंग से लोगों के निष्कर्ष का संबंध स्पष्ट करता है।
- source_word: לָמָּה נָמוּת
  choice: हम क्यों मरें?
  rationale: अपूर्ण क्रिया यहाँ भय से भरे आलंकारिक प्रश्न का भाव देती है; ‘क्यों मरें’ आधुनिक हिन्दी में इस आशंका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי תֹאכְלֵנוּ
  choice: क्योंकि ... हमें भस्म कर देगी
  rationale: כִּי कारण बताता है और आग के साथ אכל का अर्थ ‘खा जाना/नष्ट कर देना’ है; ‘भस्म कर देना’ हिन्दी में आग के लिए स्वाभाविक और सशक्त है।
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: यह बड़ी आग
  rationale: संज्ञा, विशेषण और संकेतवाचक की निश्चितता को हिन्दी के स्वाभाविक क्रम में व्यक्त किया गया है।
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: यदि हम आगे भी ... सुनते रहे
  rationale: יסף के साथ क्रिया का अर्थ काम को जारी रखना है; ‘आगे भी ... सुनते रहे’ निरंतरता और भविष्य की आशंका दोनों रखता है।
- source_word: קוֹל
  choice: वाणी
  rationale: ईश्वर के बोलने के प्रसंग में ‘वाणी’ केवल ध्वनि के बजाय अर्थपूर्ण दिव्य कथन को दर्शाती है और हिन्दी में गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: अपने परमेश्वर
  rationale: ‘अपने’ कर्ता के साथ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और मूल के ‘हमारे परमेश्वर’ का वाच्यार्थ बनाए रखता है।
- source_word: עוֹד
  choice: आगे भी
  rationale: यहाँ शब्द भविष्य में और अधिक समय तक सुनते रहने का भाव देता है।
- source_word: וָמָתְנוּ
  choice: तो हम मर जाएँगे
  rationale: शर्त के परिणाम को ‘तो’ से स्पष्ट किया गया है; पूर्ण क्रिया निश्चित आशंकित परिणाम को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यात्मक प्रतिनिधित्व है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भस्म कर देगी’ आग के विनाशकारी प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वाणी’ सीनै पर परमेश्वर के बोलने के प्रसंग के अनुरूप है।
