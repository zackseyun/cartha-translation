  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: hi
  text: परन्तु तुम यहाँ मेरे साथ खड़े रहो। मैं तुम्हें पूरी आज्ञा, विधियाँ और न्याय-विधान बताऊँगा, जिन्हें तुम उन्हें सिखाओगे; और वे उस देश में उनका पालन करें जिसे मैं उन्हें दे रहा हूँ, ताकि वे उस पर अधिकार करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “विरासत में पाएँ” अथवा “उस पर अधिकार करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: यहाँ मेरे साथ खड़े रहो
  rationale: यह अनुवाद עָמַד के ठोस अर्थ ‘खड़े रहना’ और परमेश्वर की उपस्थिति में मूसा को दिए गए गंभीर निर्देश—दोनों को बनाए रखता है।
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: मैं तुम्हें … बताऊँगा
  rationale: आज्ञार्थक क्रिया के बाद आया cohortative रूप भावी संकल्प को व्यक्त करता है। हिन्दी में ‘बताऊँगा’ आगे दी जाने वाली विस्तृत शिक्षा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת כָּל הַמִּצְוָה
  choice: पूरी आज्ञा
  rationale: מִצְוָה स्रोत में एकवचन है और כָּל समग्रता बताता है। ‘पूरी आज्ञा’ हिन्दी में स्वाभाविक रहते हुए उस सामूहिक एकवचन को सुरक्षित रखता है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: ‘विधियाँ’ वाचा-संबंधी निर्धारित नियमों का अर्थ देता है और अगले पद הַמִּשְׁפָּטִים से भेद बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: यह पद कानूनी निर्णयों अथवा न्याय पर आधारित नियमों को सूचित करता है। ‘न्याय-विधान’ उसके न्यायिक आशय को स्पष्ट रखते हुए ‘विधियाँ’ से अलग शब्दावली देता है।
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: जिन्हें तुम उन्हें सिखाओगे
  rationale: अपूर्ण क्रिया यहाँ मूसा को सौंपे गए भावी शिक्षण-कार्य को व्यक्त करती है; अनुवाद उसी प्रत्यक्ष दायित्व को बनाए रखता है।
- source_word: וְעָשׂוּ
  choice: ताकि वे … उनका पालन करें
  rationale: संदर्भ में यह शिक्षण के उद्देश्य अथवा अपेक्षित परिणाम को व्यक्त करता है। नियमों के विषय में हिन्दी का स्वाभाविक प्रयोग ‘पालन करें’ है।
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: जिसे मैं उन्हें … दे रहा हूँ
  rationale: נֹתֵן कृदन्त परमेश्वर द्वारा दिए जा रहे आसन्न और सुनिश्चित दान को सजीव वर्तमान रूप में रखता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: יָרַשׁ यहाँ देश पर अधिकार प्राप्त करने और उसे अपने अधीन रखने का भाव देता है। यह चयन विरासत पाने के सम्भव अर्थ को नकारे बिना भूमि-अधिग्रहण का ठोस भाव रखता है।
theological_decisions:
- issue: מִצְוָה / חֻקִּים / מִשְׁפָּטִים की कानूनी त्रयी
  choice: ‘आज्ञा, विधियाँ और न्याय-विधान’ के रूप में तीन अलग पद बनाए गए।
  alternative: ‘नियम-कानून’ जैसे एक सामान्य संयुक्त पद में समेटना।
  rationale: अलग शब्द परमेश्वर की वाचा-संबंधी शिक्षा की विविध कानूनी बनावट को सुरक्षित रखते हैं और पाठ में मौजूद भेद को अनावश्यक रूप से समाप्त नहीं करते।
- issue: מִצְוָה का एकवचन
  choice: ‘पूरी आज्ञा’ एकवचन रखा गया।
  alternative: ‘सारी आज्ञाएँ’ अथवा ‘पूरी व्यवस्था’।
  rationale: हिब्रू में संज्ञा एकवचन है, सम्भवतः सामूहिक अर्थ में। एकवचन बनाए रखने से स्रोत की वास्तविक व्याकरणिक और धर्मवैचारिक तनावपूर्ण समग्रता सुरक्षित रहती है।
- issue: וְעָשׂוּ का संबंध
  choice: इसे उद्देश्य/अपेक्षित परिणाम के रूप में ‘ताकि वे … पालन करें’ कहा गया।
  alternative: समन्वयी भविष्यवाणी के रूप में ‘और वे उनका पालन करेंगे’।
  rationale: मूसा के सिखाने और इस्राएल के पालन करने के बीच उद्देश्यगत संबंध प्रसंग में प्रबल है, पर अनुवाद इसे किसी विशिष्ट धर्मसैद्धान्तिक प्रणाली में नहीं बाँधता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘तुम’ मूसा के लिए एकवचन संदर्भ में स्वाभाविक है। कानूनी त्रयी को अलग रखते हुए अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशेष की शब्दावली से बचा गया है।
