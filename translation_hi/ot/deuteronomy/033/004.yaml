  yaml_path: translation/ot/deuteronomy/033/004.yaml
  text: Moses commanded a law for us[b][a], an inheritance for the assembly of Jacob.
translation:
  language: hi
  text: मूसा ने हमारे लिए व्यवस्था का आदेश दिया—याकूब की सभा की विरासत।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा ने हमें व्यवस्था का आदेश दिया, याकूब की सभा की विरासत।” इब्रानी वाक्य-विन्यास संक्षिप्त है; “विरासत” को “व्यवस्था” के समानाधिकरण में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “व्यवस्था” का अनुवाद “शिक्षा” या “निर्देश” भी हो सकता है; “विरासत” का अनुवाद “धरोहर” या “अधिकार की संपत्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: यह शब्द सामान्य शिक्षा या निर्देश को भी सूचित कर सकता है, पर यहाँ मूसा द्वारा वाचा-समुदाय को दी गई आधिकारिक व्यवस्था अभिप्रेत है।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: मूल क्रिया अधिकारपूर्वक आदेश देने का भाव रखती है; इसलिए केवल ‘दी’ कहने के बजाय उसका बल बनाए रखा गया है।
- source_word: לָנוּ
  choice: हमारे लिए
  rationale: ל यहाँ ‘हमें’ या ‘हमारे लिए’ हो सकता है। ‘हमारे लिए’ व्यवस्था को समुदाय के लिए दी गई बाध्यकारी देन और विरासत दोनों के रूप में व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का मानक हिन्दी रूप।
- source_word: מוֹרָשָׁה
  choice: विरासत
  rationale: यह शब्द उत्तराधिकार में मिली स्थायी धरोहर या संपत्ति का भाव रखता है; ‘विरासत’ इस वाचागत अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: קְהִלַּת
  choice: सभा की
  rationale: यह एकत्रित समुदाय को दर्शाता है। ‘सभा’ सामूहिक अर्थ बनाए रखता है और किसी बाद की संस्थागत धारणा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में स्पष्ट रूप से ‘याकूब’ है; इसलिए उसका अर्थ खोलकर ‘इस्राएल’ नहीं किया गया।
theological_decisions:
- issue: दो संज्ञात्मक पदों का वाक्य-संबंध
  choice: दूसरे पद को ‘व्यवस्था’ के समानाधिकरण में रखते हुए व्यवस्था को याकूब की सभा की विरासत बताया गया है।
  alternative: ‘मूसा ने हमें एक व्यवस्था की आज्ञा दी, जो याकूब की सभा के लिए विरासत है।’
  rationale: इब्रानी काव्य-संरचना संक्षिप्त है और दूसरे भाग में क्रिया नहीं है। डैश उस संक्षिप्तता और संभावित समानाधिकरण को बनाए रखता है, बिना संबंध को आवश्यकता से अधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। मूल की काव्यात्मक संक्षिप्तता बनाए रखने के लिए डैश का प्रयोग किया गया है।
