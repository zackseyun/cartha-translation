  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: hi
  text: जिसने अपने पिता और अपनी माता के विषय में कहा, “मैंने उसे नहीं देखा,”[a] और अपने भाइयों को नहीं पहचाना, न अपने पुत्रों को जाना; क्योंकि उन्होंने तेरे वचन का पालन किया और तेरी वाचा की रक्षा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या प्रसंग के अनुसार, “मैंने उसका लिहाज़ नहीं किया।” इब्रानी का अधिक शाब्दिक अर्थ “मैंने उसे नहीं देखा” है; यहाँ आशय संभवतः यह है कि वाचा के प्रति निष्ठा के सामने उसने पारिवारिक संबंध का पक्ष नहीं लिया।
    reason: ראה के शाब्दिक अर्थ और प्रसंगगत मुहावरेदार अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: הָאֹמֵר
  choice: जिसने…कहा
  rationale: संज्ञार्थक कृदंत यहाँ पिछले विषय लेवी से जुड़ा संबंधवाचक उपवाक्य है; हिन्दी में भूतकालिक संबंधवाचक रूप स्वाभाविक है।
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: अपने पिता और अपनी माता के विषय में
  rationale: אמר के साथ ל संबोधन या जिसके विषय में कहा जाए उसे सूचित कर सकता है। अगली पंक्तियों के पारिवारिक संबंधों को देखते हुए ‘के विषय में’ उपयुक्त है।
- source_word: לֹא רְאִיתִיו
  choice: मैंने उसे नहीं देखा
  rationale: ראה का मूल अर्थ ‘देखना’ है। शाब्दिक रूप को मुख्य पाठ में रखा गया है, जबकि प्रसंगगत अर्थ—ध्यान या पक्षपात न करना—पादटिप्पणी में बताया गया है।
- source_word: הִכִּיר
  choice: नहीं पहचाना
  rationale: נכר के हिफ़ील रूप का अर्थ पहचानना या संबंधगत मान्यता देना हो सकता है; ‘पहचाना’ मूल अर्थ और प्रसंग दोनों को खुला रखता है।
- source_word: אֶחָיו
  choice: अपने भाइयों
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘भाई’ है, इसलिए इसे सामान्यीकृत नहीं किया गया।
- source_word: בָּנָיו
  choice: अपने पुत्रों
  rationale: इब्रानी शब्द विशेष रूप से ‘पुत्रों’ का बोध कराता है; उसी लैंगिक विशिष्टता को रखा गया है।
- source_word: יָדָע
  choice: जाना
  rationale: ידע का सामान्य अर्थ ‘जानना’ है; यहाँ संबंधगत पहचान का भाव भी संभव है। ‘जाना’ इब्रानी समानांतरता और अर्थगत तनाव को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁמְרוּ
  choice: पालन किया
  rationale: שׁמר का अर्थ रखना, मानना या पालन करना है। वचन के साथ ‘पालन किया’ स्वाभाविक है और अगले क्रियापद से भेद बनाए रखता है।
- source_word: אִמְרָתֶךָ
  choice: तेरे वचन
  rationale: אמרה का अर्थ कथन या वचन है; ‘वचन’ यहाँ बिना उसे किसी एक विशिष्ट आज्ञा तक सीमित किए वाचिक और वाचागत भाव रखता है।
- source_word: בְּרִיתְךָ
  choice: तेरी वाचा
  rationale: ברית के लिए बाइबिलीय हिन्दी में ‘वाचा’ सटीक, प्रतिष्ठित और समझने योग्य पद है।
- source_word: יִנְצֹרוּ
  choice: रक्षा की
  rationale: נצר में सावधानी से सुरक्षित रखने या रक्षा करने का भाव है। इससे पहले आए שׁמר के साथ शब्दगत भेद भी सुरक्षित रहता है।
theological_decisions:
- issue: एकवचन और बहुवचन रूपों का संदर्भ
  choice: लेवी/लेवियों को सामूहिक रूप से संबोधित करने वाले मूल के एकवचन से बहुवचन परिवर्तन को रखा गया है।
  alternative: पूरे पद को केवल पूर्वज लेवी के विषय में समझना, अथवा सभी रूपों को हिन्दी में एक ही वचन में समतल कर देना।
  rationale: इब्रानी पहले प्रतिनिधिक एकवचन में बोलता है—‘जिसने…नहीं पहचाना…नहीं जाना’—और फिर बहुवचन में कारण देता है—‘उन्होंने…पालन किया…रक्षा की।’ इस तनाव को मिटाना उचित नहीं है।
- issue: परिवार को ‘न देखने’ का आशय
  choice: मुख्य पाठ में ‘मैंने उसे नहीं देखा’ रखा गया और प्रसंगगत अर्थ पादटिप्पणी में दिया गया।
  alternative: मुख्य पाठ में ‘मैंने उसका लिहाज़ नहीं किया’ या ‘मैंने उस पर ध्यान नहीं दिया।’
  rationale: ראה का सीधा अर्थ ‘देखना’ है, पर वाचा के प्रति निष्ठा को पारिवारिक दावों से ऊपर रखने के प्रसंग में इसका मुहावरेदार अर्थ ‘लिहाज़ न करना’ हो सकता है। मुख्य पाठ और पादटिप्पणी दोनों मिलकर वास्तविक अस्पष्टता बचाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबिलीय गद्य। ‘तेरे/तेरी’ से परमेश्वर के प्रति मूल का एकवचन संबोधन रखा गया है। ‘वाचा’ जैसे प्रचलित धर्मग्रंथीय पद को बनाए रखते हुए वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट रखा गया है।
