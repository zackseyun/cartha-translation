base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: hi
  text: 'और बिन्यामीन के विषय में उसने कहा:

    “याहवे का प्रिय उसके पास सुरक्षित बसेगा[a];

    वह दिन भर उस पर छाया किए रहता है,

    और वह उसके कंधों के बीच बसा रहता है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके निकट सुरक्षित बसेगा,” अथवा “उसके नीचे/ऊपर सुरक्षित बसेगा”; इब्रानी संबंधबोधक शब्द संक्षिप्त है और निकटता या सुरक्षापूर्ण देखरेख का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके कंधों के बीच।” इसे कुछ लोग सुरक्षापूर्ण निकटता का रूपक मानते हैं; दूसरे इसे बिन्यामीन के पहाड़ी क्षेत्र या उसके भूभाग में स्थित पवित्रस्थान की ओर संकेत मानते हैं। यह भी अस्पष्ट है कि अंतिम पंक्ति में कौन किसके कंधों के बीच बसता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: बिन्यामीन के विषय में
  rationale: जनजातीय आशीष के शीर्षक के रूप में यह स्वाभाविक हिन्दी है और इब्रानी के ‘बिन्यामीन के लिए/से’ भाव को व्यक्त करता है।
- source_word: יְדִיד יְהוָה
  choice: याहवे का प्रिय
  rationale: יְדִיד प्रेमपात्र या प्रिय जन को दर्शाता है; संक्षिप्त पदबंध मूल की आत्मीयता बनाए रखता है। परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ रूप में रखा गया है।
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: सुरक्षित बसेगा
  rationale: שׁכן का मूल भाव बसना है और לָבֶטַח सुरक्षा का; भविष्यकालीन रूप आशीष-वचन के स्वर के अनुकूल है।
- source_word: עָלָיו
  choice: उसके पास
  rationale: इस प्रसंग में על निकटता, ऊपर/अधीन स्थिति या संरक्षण का संबंध बता सकता है। मुख्य पाठ में सहज ‘पास’ रखा और व्यापक स्थानिक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
- source_word: חֹפֵף עָלָיו כָּל הַיּוֹם
  choice: वह दिन भर उस पर छाया किए रहता है
  rationale: חֹפֵף सुरक्षा देने वाले आवरण का चित्र प्रस्तुत करता है। ‘छाया किए रहता है’ काव्यात्मक चित्र और संरक्षण, दोनों को व्यक्त करता है।
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: और वह उसके कंधों के बीच बसा रहता है
  rationale: ‘कंधों के बीच’ मूल रूपक को सीधे बनाए रखता है और שׁכן की पुनरावृत्ति को ‘बसा रहता है’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: सर्वनामों का संदर्भ
  choice: मुख्य पाठ में याहवे के प्रिय को उसके पास सुरक्षित बसने वाला और याहवे को उस पर छाया करने वाला समझा गया है; अंतिम पंक्ति का ‘वह/उसके’ मूल की अस्पष्टता बनाए रखता है।
  alternative: याहवे बिन्यामीन के ऊपर और उसके कंधों के बीच बसता है; अथवा बिन्यामीन याहवे के कंधों के बीच बसता है।
  rationale: इब्रानी काव्य में कर्ता और सर्वनाम संक्षिप्त हैं, इसलिए अंतिम पंक्ति का संदर्भ निश्चित रूप से हल करना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘छाया किए रहता है’ संरक्षण के चित्र को स्वाभाविक रूप से व्यक्त करता है। सर्वनामगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी में जानबूझकर बनाए रखा गया है।
