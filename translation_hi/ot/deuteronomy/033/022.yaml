  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: hi
  text: 'और दान के विषय में उसने कहा:

    “दान सिंह का बच्चा है;

    वह बाशान से छलाँग लगाता है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְדָן
  choice: और दान के विषय में
  rationale: संयोजक וּ और संबंधसूचक לְ अगली गोत्रीय आशीष का परिचय देते हैं। ‘दान के विषय में’ आधुनिक हिन्दी में स्वाभाविक है और ‘दान के संबंध में’ का अर्थ स्पष्ट रखता है।
- source_word: אָמַר
  choice: उसने कहा
  rationale: भाषण-सूत्र में प्रयुक्त सामान्य क्रिया; सरल और पारदर्शी अनुवाद।
- source_word: דָּן
  choice: दान
  rationale: व्यक्ति और गोत्र का पारंपरिक हिन्दी नाम।
- source_word: גּוּר אַרְיֵה
  choice: सिंह का बच्चा
  rationale: यह पदबंध कम आयु के सिंह को दर्शाता है। ‘सिंह का बच्चा’ साधारण आधुनिक हिन्दी में स्पष्ट है और आयु-संबंधी भाव बनाए रखता है।
- source_word: יְזַנֵּק
  choice: वह छलाँग लगाता है
  rationale: क्रिया अचानक उछलने या झपटकर आगे बढ़ने की गति बताती है। ‘छलाँग लगाता है’ उस सजीव गति को रखता है, पर ‘झपटता है’ जैसी अधिक व्याख्यात्मक आक्रामकता नहीं जोड़ता।
- source_word: מִן הַבָּשָׁן
  choice: बाशान से
  rationale: מִן स्रोत या आरंभ-बिंदु सूचित करता है; ‘बाशान से’ सीधा और स्वाभाविक अनुवाद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। काव्यात्मक समानता और सिंह-शावक की सजीव छवि को संक्षिप्त पंक्तियों में सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ का footnote marker [a] वस्तुतः ‘leaps out’ से जुड़ी lexical alternative बताता है, न कि ‘lion’s cub’ से; हिन्दी मुख्य पाठ में अस्पष्ट अथवा गलत स्थान वाला marker न देकर स्रोत के सीधे अर्थ का अनुवाद किया गया है।
