  edition: WLC
  text: וּ/לְ/יוֹסֵ֣ף אָמַ֔ר מְבֹרֶ֥כֶת יְהֹוָ֖ה אַרְצ֑/וֹ מִ/מֶּ֤גֶד שָׁמַ֨יִם֙ מִ/טָּ֔ל וּ/מִ/תְּה֖וֹם רֹבֶ֥צֶת תָּֽחַת׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: hi
  text: 'यूसुफ के विषय में उसने कहा,


    “उसकी भूमि याहवे से आशीषित हो—


    आकाश की उत्तम वस्तुओं से[a], ओस से,


    और नीचे स्थित गहरी जलराशि से[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश की बहुमूल्य वस्तुओं से।”
    reason: lexical_alternative
  - marker: b
    text: “गहरी जलराशि” संभवतः भूमि के नीचे स्थित जल-स्रोतों की ओर संकेत करती है।
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: यूसुफ के विषय में
  rationale: לְ के साथ नाम यहाँ अगले गोत्र के लिए कही गई आशीष का परिचय देता है। यह हिन्दी में स्वाभाविक है और ‘यूसुफ के लिए’ की संभावित अर्थछाया को पूरी तरह नकारता नहीं।
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: उसकी भूमि याहवे से आशीषित हो
  rationale: निष्क्रिय कृदंत को आशीर्वचन की कामनात्मक शैली में रखा गया है। יְהוָה को व्यक्तिगत ईश्वरीय नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: מִמֶּגֶד שָׁמַיִם
  choice: आकाश की उत्तम उपज से
  rationale: מֶגֶד उत्कृष्ट, बहुमूल्य उपज या संपदा को दर्शाता है। कृषि-संबंधी प्रसंग में ‘उत्तम उपज’ स्पष्ट और स्वाभाविक है, जबकि पाद-टिप्पणी व्यापक शाब्दिक विकल्प को सुरक्षित रखती है।
- source_word: מִטָּל
  choice: ओस से
  rationale: मूल पाठ के מן को बनाए रखते हुए उस ओस को आकाश से मिलने वाली भूमि की समृद्धि के एक स्रोत के रूप में प्रस्तुत किया गया है।
- source_word: וּמִתְּהוֹם רֹבֶצֶת תָּחַת
  choice: और नीचे पड़े हुए गहरे जल से
  rationale: תְּהוֹם यहाँ गहरे जल को और רֹבֶצֶת תָּחַת उसके नीचे स्थित होने की सजीव छवि को व्यक्त करता है। ‘गहरे जल’ बाद की ‘अथाह-कुंड’ संबंधी धारणाएँ आरोपित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: תְּהוֹם का आशय
  choice: गहरा जल
  alternative: अथाह सागर / अधोलोक का जल
  rationale: यह शब्द गहरी जलराशि को सूचित करता है; इस कृषि-आशीष में संभवतः भूमि के नीचे के जल की ओर संकेत है। अनुवाद इस संभावित भौगोलिक अर्थ को खुला रखता है और किसी विशिष्ट ब्रह्मांड-विज्ञान को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद्य-विन्यास आशीर्वचन की काव्यात्मक समानांतरता दिखाता है; ‘नीचे पड़े हुए’ मूल की सजीव छवि को सहज हिन्दी में बनाए रखता है।
