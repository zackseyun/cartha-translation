base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: hi
  text: 'उसने कहा:


    “याहवे सीनै से आया,

    और सेईर से उन पर उदित हुआ;

    वह पारान पर्वत से प्रकाश के साथ प्रकट हुआ,

    और पवित्रता की असंख्य कोटियों में से आया[a];

    उसके दाहिने हाथ से उनके लिए अग्निमय व्यवस्था निकली[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “असंख्य पवित्र जनों में से” भी हो सकता है। इब्रानी पदबंध अमूर्त “पवित्रता” अथवा पवित्र परिचरों—दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ का इब्रानी शब्द अत्यंत कठिन और अनिश्चित है। पारंपरिक अनुवाद “अग्निमय व्यवस्था” है; इसका आशय उसके दाहिने हाथ से निकलती अग्नि की धाराएँ या चमकती लपटें भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में सीधा लिप्यंतरित किया गया है।
- source_word: מִסִּינַי בָּא
  choice: सीनै से आया
  rationale: दिशासूचक מִן और ईश्वरीय आगमन को सरल तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: और सेईर से उन पर सूर्य के समान उदित हुआ
  rationale: זרח प्रकाश, विशेषतः सूर्य के उदय और चमकने, की काव्यात्मक छवि रखता है; ‘उन पर’ לָמוֹ को इस प्रकाशमय ईश्वर-दर्शन के अनुरूप व्यक्त करता है। ‘सूर्य के समान’ उपमा को स्पष्ट करता है, पर परमेश्वर को सूर्य नहीं ठहराता।
- source_word: הוֹפִיעַ
  choice: प्रकाशमान हुआ
  rationale: हिफ़ील रूप के दीप्तिमान होकर प्रकट होने या चमकने के भाव को संक्षेप में व्यक्त करता है।
- source_word: מֵהַר פָּארָן
  choice: पारान पर्वत से
  rationale: स्थान-नाम और הַר का सीधा, प्रचलित हिन्दी रूप है।
- source_word: וְאָתָה
  choice: और … आया
  rationale: ईश्वरीय आगमन की समानांतर काव्य-श्रृंखला बनाए रखता है।
- source_word: מֵרִבְבֹת קֹדֶשׁ
  choice: पवित्रता के असंख्य समूहों के बीच से
  rationale: कठिन इब्रानी संबंध को मुख्य पाठ में जानबूझकर अधिक औपचारिक और खुला रखा गया है; ‘पवित्र जनों’ की संभावित व्याख्या पादटिप्पणी में दी गई है। ‘असंख्य’ רִבְבֹת की विशाल संख्या को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִימִינוֹ
  choice: उसके दाहिने हाथ से
  rationale: מִן का स्वाभाविक अर्थ ‘से’ है और अगले अग्निमय पद के उसी हाथ से निकलने की छवि को सुरक्षित रखता है।
- source_word: אשדת
  choice: अग्निमय व्यवस्था
  rationale: यह अत्यंत कठिन और अनिश्चित इब्रानी रूप है। पारंपरिक व्याख्या को पठनीय मुख्य पाठ में रखा गया है, जबकि अग्नि की धाराओं या चमकती लपटों की संभावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: לָמוֹ
  choice: उनके लिए
  rationale: तीसरे पुरुष बहुवचन सर्वनाम और हितार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: काव्यात्मक ईश्वर-दर्शन में कर्ता की पहचान
  choice: कर्ता को वाचा के परमेश्वर ‘याहवे’ के रूप में प्रस्तुत किया गया है।
  alternative: इस आगमन में बाद के प्रकाशन का प्रतिरूप देखना।
  rationale: पद के व्यवस्थाविवरणीय और सीनै-संबंधी संदर्भ को रखा गया है; बाद की मसीही व्याख्या को अनुवाद के शब्दों में नहीं जोड़ा गया।
- issue: מֵרִבְבֹת קֹדֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘पवित्रता के असंख्य समूहों के बीच से’ रखकर व्याकरणिक अस्पष्टता सुरक्षित की गई है।
  alternative: ‘असंख्य पवित्र जनों के बीच से।’
  rationale: קֹדֶשׁ का अर्थ अमूर्त ‘पवित्रता’ हो सकता है, पर वाक्यांश पवित्र स्वर्गीय परिचरों की ओर भी संकेत कर सकता है; पादटिप्पणी दूसरी संभावना दिखाती है।
- issue: אשדת का अर्थ
  choice: मुख्य पाठ में ‘अग्निमय व्यवस्था’ रखा गया है।
  alternative: ‘अग्नि की धाराएँ’ या ‘चमकती लपटें।’
  rationale: रूप का अर्थ और संभवतः उसका शब्द-विभाजन अनिश्चित है। सीनै के संदर्भ से संगत पारंपरिक अर्थ को मुख्य पाठ में रखा गया है, लेकिन उसे निश्चित बताने के बजाय पादटिप्पणी में वास्तविक शाब्दिक अनिश्चितता दिखाई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, काव्यात्मक परंतु सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। समानांतर पंक्तियाँ मूल पद के ईश्वर-दर्शन की गति और प्रकाश-संबंधी बिंबों को उभारती हैं। ‘व्यवस्था’ बाइबलीय सन्दर्भ में परिचित है; कठिन इब्रानी वाक्यांशों की अनिश्चितता पादटिप्पणियों में खुलकर दर्ज है।
