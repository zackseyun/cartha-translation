lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: की उत्तम उपज से
  rationale: רֹאשׁ का मूल अर्थ ‘सिर/चोटी’ है, पर आशीषों की इस काव्यात्मक सूची में समानांतर מֶגֶד के कारण ‘सबसे उत्तम’ का गुणात्मक अर्थ अधिक स्वाभाविक है। ‘उपज’ को संदर्भ से स्पष्ट किया गया है; स्थानवाचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: הַרְרֵי
  choice: पर्वतों
  rationale: הַר का सामान्य बहुवचन-सम्बन्ध रूप; अगले खंड के גִּבְעוֹת ‘पहाड़ियों’ से भेद बनाए रखता है।
- source_word: קֶדֶם
  choice: प्राचीन
  rationale: קֶדֶם का अर्थ ‘पूर्व’ भी हो सकता है, पर עוֹלָם के समानांतर यहाँ कालवाचक अर्थ ‘पुरातन/प्राचीन’ अधिक उपयुक्त है।
- source_word: מִמֶּגֶד
  choice: की बहुमूल्य उपज से
  rationale: מֶגֶד बहुमूल्य वस्तु, उत्तम फल या समृद्ध उपज को सूचित करता है। ‘बहुमूल्य उपज’ आशीष के कृषि-संपदा संबंधी संदर्भ को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: גִּבְעוֹת
  choice: पहाड़ियों
  rationale: גִּבְעָה का मानक अर्थ ‘पहाड़ी’ है और यह पहले खंड के ‘पर्वतों’ से काव्यात्मक भेद बनाए रखता है।
- source_word: עוֹלָם
  choice: सनातन
  rationale: यहाँ עוֹלָם भू-दृश्य की अति-प्राचीनता और स्थायित्व व्यक्त करता है। ‘सनातन’ काव्यात्मक गरिमा बनाए रखता है, जबकि इसे पहले खंड के ‘प्राचीन’ के समान नहीं कर देता।
