  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: hi
  text: वे याकूब को तेरे न्याय-विधानों और इस्राएल को तेरी व्यवस्था[a] सिखाएँगे; वे तेरे सम्मुख धूप[b] और तेरी वेदी पर पूर्णतः जलाया जाने वाला बलिदान चढ़ाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तेरी शिक्षा’; इब्रानी תּוֹרָה का अर्थ व्यवस्था अथवा शिक्षा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘तेरी नाक/नथुने पर’ है; यह परमेश्वर के सम्मुख धूप प्रस्तुत करने की मानवाकार अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: सिखाएँगे
  rationale: हिफ़ील रूप यहाँ याजकीय संदर्भ में शिक्षा देने को व्यक्त करता है; ‘सिखाएँगे’ स्वाभाविक और स्पष्ट है।
- source_word: מִשְׁפָּטֶיךָ
  choice: तेरे न्याय-विधान
  rationale: यह चयन न्यायिक निर्णयों और विधानों, दोनों की कानूनी वाचा-संबंधी छाया को बनाए रखता है।
- source_word: וְתוֹרָתְךָ
  choice: और तेरी व्यवस्था
  rationale: תּוֹרָה का अर्थ शिक्षा भी हो सकता है, पर यहाँ न्याय-विधानों के समानांतर वाचा-संबंधी व्यवस्था प्रमुख है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָשִׂימוּ קְטוֹרָה בְּאַפֶּךָ
  choice: वे तेरे सम्मुख धूप चढ़ाएँगे
  rationale: शाब्दिक ‘तेरी नाक/नथुने पर’ धूप की सुगंध परमेश्वर के सामने प्रस्तुत करने का मानवाकार मुहावरा है। हिंदी में ‘तेरे सम्मुख ... चढ़ाएँगे’ अर्थ और उपासना-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכָלִיל
  choice: और ... पूरी तरह जला हुआ बलिदान
  rationale: כָּלִיל ऐसे बलिदान को सूचित करता है जो वेदी पर पूर्णतः जला दिया जाता है; यह अनुवाद उस विशिष्टता को स्पष्ट रखता है।
- source_word: עַל מִזְבְּחֶךָ
  choice: तेरी वेदी पर
  rationale: मूल पूर्वसर्ग और संज्ञा का सीधा, स्वाभाविक अनुवाद।
theological_decisions:
- issue: वाचा-संदर्भ में תּוֹרָה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: ‘व्यवस्था’ यहाँ लेवी की उस याजकीय भूमिका को व्यक्त करती है जिसमें वह परमेश्वर की वाचा की अपेक्षाएँ सिखाता है; ‘शिक्षा’ वास्तविक व्यापक विकल्प है और पादटिप्पणी में सुरक्षित है।
- issue: मानवाकार अभिव्यक्ति בְּאַפֶּךָ
  choice: तेरे सम्मुख
  alternative: तेरी नाक/नथुने पर
  rationale: अति-शाब्दिक हिंदी अस्पष्ट और भ्रामक होगी। ‘तेरे सम्मुख’ धूप को परमेश्वर के सामने प्रस्तुत करने का आशय बनाए रखता है, जबकि मूल बिंब पादटिप्पणी में दिया गया है।
- issue: כָּלִיל की संख्या और सामूहिकता
  choice: पूरी तरह जला हुआ बलिदान
  alternative: पूरी तरह जलाए हुए बलिदान
  rationale: मूल में संज्ञा एकवचन रूप में है, पर उसका प्रयोग बलिदान की श्रेणी के लिए सामूहिक हो सकता है। हिंदी में अनिर्दिष्ट एकवचन श्रेणीगत अर्थ को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, काव्यात्मक और सामान्य पाठक के लिए बोधगम्य शैली। परमेश्वर के लिए निकटवाची एकवचन ‘तेरे/तेरी’ मूल के द्वितीय पुरुष एकवचन और काव्य-प्रार्थनात्मक संबोधन को बनाए रखता है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
