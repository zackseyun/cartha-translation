  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: hi
  text: 'वे अनेक जनसमुदायों को पर्वत पर बुलाएँगे[a];

    वहाँ वे धर्मसम्मत बलिदान चढ़ाएँगे[b]।

    क्योंकि वे समुद्रों की भरपूरी और रेत के गुप्त खज़ानों से लाभ उठाएँगे[c][d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे अनेक जनसमुदायों को किसी पर्वत पर बुलाएँगे।’ इब्रानी में पर्वत की पहचान नहीं बताई गई है।
    reason: alternative_reading
  - marker: b
    text: या, ‘धार्मिकता के बलिदान’ अथवा ‘धार्मिकता से चढ़ाए गए बलिदान।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ है, ‘वे समुद्रों की भरपूरी चूसेंगे’; यह समुद्र से पोषण या संपदा प्राप्त करने का रूपक है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी पदबंध कठिन है; इसका अनुवाद ‘रेत की छिपी हुई वस्तुएँ’ या ‘रेत में दबी संपदा’ भी हो सकता है। सम्भवतः इसका संकेत समुद्र-तट या रेतीले क्षेत्रों से मिलने वाले संसाधनों की ओर है।
    reason: textual_or_lexical_difficulty
lexical_decisions:
- source_word: עַמִּים
  choice: देश-देश के लोगों
  rationale: बहुवचन עַמִּים अलग-अलग जन-समुदायों को दर्शाता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और ‘राष्ट्रों’ की अपेक्षा राजनीतिक अर्थ को अनावश्यक रूप से नहीं थोपती।
- source_word: הַר
  choice: पर्वत
  rationale: इब्रानी में किसी विशेष पर्वत का नाम नहीं दिया गया है। हिन्दी में ‘पर्वत पर’ निश्चित अथवा प्रसंग से ज्ञात पर्वत—दोनों की सम्भावना खुली रखता है।
- source_word: יִקְרָאוּ
  choice: बुलाएँगे
  rationale: קרא यहाँ बुलाने, आमंत्रित करने या एकत्र होने के लिए पुकारने का भाव रख सकता है; ‘बुलाएँगे’ इन सम्भावनाओं को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: זִבְחֵי צֶדֶק
  choice: धार्मिकता के बलिदान
  rationale: यह संरचना मूल के संबंधवाचक रूप को बनाए रखती है और यह पूरी तरह तय नहीं करती कि बलिदान स्वयं उचित हैं या धार्मिकता में चढ़ाए गए हैं।
- source_word: שֶׁפַע יַמִּים
  choice: समुद्रों की भरपूरी
  rationale: שֶׁפַע प्रचुरता, उपज या संपदा को समेट सकता है। ‘भरपूरी’ काव्यात्मक और व्यापक है तथा किसी एक समुद्री संसाधन को निर्दिष्ट नहीं करती।
- source_word: יִינָקוּ
  choice: लाभ पाएँगे
  rationale: शाब्दिक अर्थ ‘चूसेंगे’ है। प्रसंग में यह समुद्र से पोषण, उपज या संपदा प्राप्त करने का रूपक है; ‘लाभ पाएँगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस व्यापक आशय को व्यक्त करता है।
- source_word: וּשְׂפוּנֵי טְמֻנֵי חוֹל
  choice: और रेत में छिपे खज़ानों से भी
  rationale: इस कठिन काव्यात्मक पदबंध में छिपी या संचित वस्तुओं का भाव है। ‘खज़ाने’ संसाधन अथवा संपदा का संकेत देता है, पर उनकी ठीक पहचान नहीं करता।
theological_decisions:
- issue: ‘धार्मिकता के बलिदान’ का स्वरूप
  choice: संबंधवाचक और अर्थगत रूप से खुला अनुवाद रखा गया है।
  alternative: उचित बलिदान; धर्मसम्मत बलिदान; धार्मिकता में चढ़ाए गए बलिदान
  rationale: צֶדֶק बलिदानों की उचितता/स्वीकार्यता अथवा उन्हें चढ़ाने की धार्मिकता से संबंधित हो सकता है। मुख्य पाठ किसी बाद की धर्मवैज्ञानिक श्रेणी को नहीं थोपता।
- issue: ‘पर्वत’ की पहचान
  choice: पर्वत का नाम नहीं दिया गया।
  alternative: सिय्योन पर्वत; कोई पर्वतीय पवित्रस्थान; उनका पर्वतीय प्रदेश
  rationale: मूल पाठ पर्वत की पहचान स्पष्ट नहीं करता; किसी विशिष्ट पवित्रस्थान का नाम जोड़ना अति-व्याख्या होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्ति-विभाजन किया गया है। ‘देश-देश के लोगों’, ‘भरपूरी’ और ‘छिपे खज़ानों’ जैसे पद स्रोत की सामूहिक तथा काव्यात्मक छवियों को सहज हिन्दी में व्यक्त करते हैं।
