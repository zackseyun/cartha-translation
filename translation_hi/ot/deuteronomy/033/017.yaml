base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: hi
  text: 'उसका पहलौठा बैल वैभवशाली है;


    उसके सींग जंगली बैल[a] के सींग जैसे हैं।


    उनसे वह पृथ्वी के छोरों तक के लोगों को


    एक साथ सींग मारेगा।


    ये एप्रैम के दसियों हज़ार[b] हैं,


    और ये मनश्शे के हज़ारों हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द רְאֵם संभवतः एक शक्तिशाली जंगली गोवंशी पशु को सूचित करता है; इसे ‘जंगली साँड़’ भी कहा जा सकता है। पुराने अनुवादों में मिलने वाला ‘एक-सींग वाला पशु’ अर्थ संभवतः सही नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इसे ‘एप्रैम के असंख्य जन’ भी कहा जा सकता है। इब्रानी शब्द का मूल अर्थ दस-हज़ारों से है और यहाँ उसका मनश्शे के ‘हज़ारों’ से विरोधात्मक समानांतर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: उसका पहलौठा बैल
  rationale: בְּכוֹר पहलौठी संतान को और שׁוֹר नर गोवंश को सूचित करता है। यह रूप पशु-रूपक और सींगों की अगली छवि, दोनों को स्पष्ट रखता है।
- source_word: הָדָר לוֹ
  choice: वैभवशाली है
  rationale: הָדָר वैभव, प्रताप या महिमा का भाव देता है। हिंदी में विशेषणात्मक रूप काव्यात्मक और स्वाभाविक है।
- source_word: קַרְנֵי רְאֵם
  choice: जंगली बैल के सींग
  rationale: רְאֵם संभवतः एक शक्तिशाली जंगली गोवंशी पशु को सूचित करता है। 'जंगली बैल' आधुनिक पाठक के लिए स्पष्ट है और एक-सींग वाले काल्पनिक पशु का भ्रामक अर्थ नहीं देता।
- source_word: יְנַגַּח
  choice: सींग मारेगा
  rationale: נָגַח सींग वाले पशु के टक्कर मारने या बेधने की ठोस क्रिया है; यह अनुवाद मूल रूपक को बनाए रखता है।
- source_word: עַמִּים
  choice: सब जातियों
  rationale: बहुवचन עַמִּים अलग-अलग जनसमूहों को सूचित करता है। प्रसंग में 'जातियाँ' स्वाभाविक और व्यापक है।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह सामूहिक अथवा एकत्रित रूप से होने वाली क्रिया का भाव सुरक्षित रखता है।
- source_word: אַפְסֵי אָרֶץ
  choice: पृथ्वी के छोर तक
  rationale: यह मुहावरा पृथ्वी के सबसे दूरस्थ भागों को सूचित करता है और कविता के व्यापक भौगोलिक विस्तार को बनाए रखता है।
- source_word: רִבְבוֹת
  choice: दसियों हज़ार
  rationale: रִבְבוֹת का मूल संख्यात्मक भाव दस-हज़ारों का है और यह अगली पंक्ति के 'हज़ारों' से जानबूझकर किया गया अंतर स्पष्ट रखता है।
- source_word: אַלְפֵי
  choice: हज़ारों
  rationale: यहाँ רִבְבוֹת के समानांतर होने के कारण संख्यात्मक अर्थ सबसे उपयुक्त है, न कि कुल या सैन्य इकाई का अर्थ।
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: एप्रैम / मनश्शे
  rationale: ये यूसुफ के पुत्रों और उनसे निकले गोत्रों के प्रचलित हिंदी बाइबलीय नाम हैं।
theological_decisions:
- issue: यूसुफ के आशीर्वाद में पशु-रूपक का निश्चित संदर्भ
  choice: मुख्य पाठ में रूपक को यूसुफ की शक्ति से जोड़ने योग्य रखा गया है और अंतिम पंक्तियों में एप्रैम तथा मनश्शे से उसका संबंध स्पष्ट होने दिया गया है।
  alternative: ‘पहलौठा बैल’ को विशेष रूप से एप्रैम का संकेत माना जा सकता है, जो यूसुफ के वंशजों में प्रमुख हुआ।
  rationale: इब्रानी पाठ पहले यूसुफ को संबोधित करता है और अंत में एप्रैम तथा मनश्शे की संख्याओं से छवि की पहचान कराता है। किसी एक संदर्भ को अनावश्यक रूप से निश्चित करना मूल की संभावित द्विअर्थता को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सींग मारेगा’ जैसे ठोस पद से मूल पशु-रूपक सुरक्षित है, जबकि पंक्ति-विन्यास इब्रानी कविता के समानांतर भाव को पाठक के लिए स्पष्ट करता है।
