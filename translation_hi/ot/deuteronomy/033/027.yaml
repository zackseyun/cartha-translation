base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: hi
  text: 'पुरातन परमेश्वर निवास-स्थान[a] है,

    और नीचे सनातन भुजाएँ हैं।

    उसने तेरे सामने से शत्रु को निकाल दिया,

    और कहा, “नष्ट कर दे!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सनातन परमेश्वर तेरी शरण है।” यह पारंपरिक अर्थ संभव है; किंतु इब्रानी की अधिक सीधी शब्दावली है, “पुरातन परमेश्वर निवास-स्थान है।”
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: निवास-स्थान
  rationale: यह संज्ञा निवास या आश्रय देने वाले स्थान को दर्शाती है। ‘निवास-स्थान’ मूल बिंब को बनाए रखता है और इसे केवल रूपकात्मक ‘शरण’ बनाकर अधिक व्याख्यायित नहीं करता।
- source_word: אֱלֹהֵי קֶדֶם
  choice: प्राचीन काल से परमेश्वर
  rationale: קֶדֶם यहाँ प्राचीन अथवा पूर्वकाल की ओर संकेत करता है। यह हिंदी प्रयोग परमेश्वर के प्राचीन काल से विद्यमान होने का भाव स्वाभाविक रूप से देता है, बिना मुख्य पाठ में ‘सनातन’ अर्थ को अनिवार्य किए।
- source_word: וּמִתַּחַת
  choice: और नीचे
  rationale: यह स्थान-सूचक पद है। ‘और नीचे’ काव्यात्मक समानांतरता और सहारा देने वाली भुजाओं के स्थानिक बिंब को सुरक्षित रखता है।
- source_word: זְרֹעֹת עוֹלָם
  choice: सनातन भुजाएँ
  rationale: ‘भुजाएँ’ सामर्थ्य और सहारे का मूल रूपक बनाए रखता है; עוֹלָם यहाँ स्थायी, कभी समाप्त न होने वाली अवधि का भाव देता है।
- source_word: וַיְגָרֶשׁ
  choice: उसने ... निकाल दिया
  rationale: גרש का अर्थ बलपूर्वक बाहर निकालना या खदेड़ना है। ‘निकाल दिया’ स्पष्ट और स्वाभाविक हिंदी है तथा पूर्ण की गई क्रिया व्यक्त करता है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: शाब्दिक भाव ‘तेरे मुख/उपस्थिति के सामने से’ है। यह अनुवाद इस स्थानिक अर्थ को बनाए रखता है और इस्राएल के आगे से शत्रु हटाए जाने को व्यक्त करता है।
- source_word: אוֹיֵב
  choice: शत्रु
  rationale: मूल में एकवचन है, जो सामूहिक अर्थ भी रख सकता है। हिंदी ‘शत्रु’ दोनों संभावनाएँ खुली रखता है।
- source_word: וַיֹּאמֶר
  choice: और कहा
  rationale: यह सरल कथात्मक क्रम है; पूर्ववर्ती उपवाक्य के आधार पर कर्ता परमेश्वर समझा जाता है।
- source_word: הַשְׁמֵד
  choice: नष्ट कर दे!
  rationale: यह पूर्ण विनाश का आदेश देने वाला हिफ़ील आज्ञार्थक है। ‘नष्ट कर दे’ उसकी शक्ति को स्पष्ट रखता है, पर मूल से अधिक विशिष्ट अर्थ नहीं जोड़ता।
theological_decisions:
- issue: אֱלֹהֵי קֶדֶם में קֶדֶם को ‘प्राचीन काल से’ समझा जाए या ‘सनातन’
  choice: प्राचीन काल से परमेश्वर
  alternative: सनातन परमेश्वर
  rationale: קֶדֶם का अधिक सीधा कालगत अर्थ प्राचीन या पूर्वकाल है। ‘सनातन परमेश्वर’ एक पुराना और संभव व्याख्यात्मक अनुवाद है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है; मुख्य पाठ दोनों पदों के बीच के भेद को भी बनाए रखता है, जहाँ आगे עוֹלָם के लिए ‘सनातन’ आया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। संबोधन का एकवचन ‘तेरे’ रखा गया है, क्योंकि इब्रानी प्रत्यय एकवचन है और सामूहिक इस्राएल को संबोधित करता है। पंक्ति-विन्यास मूल कविता की समानांतर संरचना को उभारता है।
