base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: hi
  text: 'और धरती की बहुमूल्य वस्तुओं और उसकी सारी भरपूरी से,


    और झाड़ी में निवास करनेवाले की कृपा से—


    यह सब यूसुफ के सिर पर आए,


    और अपने भाइयों से अलग किए गए के सिर के शिखर पर आए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “अपने भाइयों में प्रधान जन”; या “अपने भाइयों में समर्पित जन।” इब्रानी शब्द अलग किए जाने पर बल देता है, पर यहाँ प्रतिष्ठा या प्रधानता का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: धरती की बहुमूल्य वस्तुएँ
  rationale: מֶגֶד आशीष के इस संदर्भ में बहुमूल्य अथवा उत्तम उपज और संपदा का बोध कराता है। ‘बहुमूल्य वस्तुएँ’ अर्थ को केवल कृषि-उपज तक सीमित नहीं करता। אֶרֶץ को व्यापक काव्यात्मक अर्थ में ‘धरती’ किया गया है।
- source_word: מְלֹאָהּ
  choice: उसमें की सारी भरपूरी
  rationale: यह धरती में भरी हुई समस्त संपदा को सूचित करता है और मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: רְצוֹן
  choice: कृपा
  rationale: यहाँ शब्द परमेश्वर की अनुकूल प्रसन्नता और सद्भाव को व्यक्त करता है; ‘कृपा’ आधुनिक हिन्दी में सहज और संक्षिप्त है।
- source_word: שֹׁכְנִי סְנֶה
  choice: उस जन की ... जो झाड़ी में वास करता था
  rationale: वर्णनात्मक पदबंध निर्गमन 3 में झाड़ी के बीच परमेश्वर के प्रकट होने की ओर संकेत करता है। मूल में झाड़ी के जलने का विशेषण नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: תָּבוֹאתָה
  choice: यह सब ... आए
  rationale: इब्रानी में स्त्रीलिंग एकवचन क्रिया संयुक्त आशीष को सामूहिक रूप से ग्रहण करती है। हिन्दी में ‘यह सब ... आए’ उस सामूहिक एकता और आशीर्वचनात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְרֹאשׁ יוֹסֵף
  choice: यूसुफ के सिर पर
  rationale: यह आशीष देने की मानक काव्यात्मक अभिव्यक्ति का सीधा और स्पष्ट रूप है।
- source_word: קָדְקֹד
  choice: सिर के शिखर पर
  rationale: शब्द सिर के सबसे ऊपरी भाग को दर्शाता है। ‘सिर का शिखर’ पहले चरण के ‘सिर’ के साथ समानांतरता और अधिक विशिष्ट अर्थ दोनों बनाए रखता है।
- source_word: נְזִיר אֶחָיו
  choice: उसके भाइयों से अलग किए गए जन
  rationale: נְזִיר का मूल भाव अलग या समर्पित किए जाने का है। यह अनुवाद यूसुफ की विशिष्टता को बनाए रखता है, पर ‘प्रधान’ अर्थ को मुख्य पाठ में निश्चित नहीं करता।
theological_decisions:
- issue: ‘झाड़ी में वास करनेवाले’ की पहचान
  choice: झाड़ी में प्रकट हुए परमेश्वर की ओर संकेत करनेवाला वर्णनात्मक दिव्य संबोधन
  alternative: होरेब या सीनै से जुड़ी किसी अधिक सामान्य ईश्वरीय अभिव्यक्ति का संकेत
  rationale: यह वाक्यांश निर्गमन 3 की घटना को दृढ़ता से प्रतिध्वनित करता है। फिर भी मुख्य पाठ मूल की वर्णनात्मक भाषा रखता है और बाद की कोई धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
- issue: נְזִיר אֶחָיו में अलगाव और श्रेष्ठता का संबंध
  choice: मुख्य पाठ में ‘भाइयों से अलग किए गए जन’
  alternative: ‘अपने भाइयों में प्रधान’ या ‘अपने भाइयों में समर्पित जन’
  rationale: शब्द अलग किए जाने को सीधे व्यक्त करता है, जबकि यूसुफ के संदर्भ में प्रतिष्ठा या प्रधानता का संकेत भी संभव है। उस अतिरिक्त अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की बहुअर्थकता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। पंक्ति-विन्यास इब्रानी समानांतरता को उभारता है। ‘वास करता था’ जानबूझकर थोड़ा ऊँचा धार्मिक रजिस्टर रखता है, जबकि शेष शब्दावली सामान्य पाठक के लिए सुबोध है।
