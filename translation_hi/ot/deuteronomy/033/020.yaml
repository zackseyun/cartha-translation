source:
  edition: WLC
  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: hi
  text: 'और गाद के विषय में उसने कहा:


    “धन्य है वह जो गाद को विस्तार देता है[a]।


    वह सिंह की तरह रहता है[b]


    और भुजा, यहाँ तक कि सिर का शिखर भी चीर डालता है[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्य हो वह जो गाद को विस्तार देता है।” यहाँ कर्ता परमेश्वर समझा जा सकता है, यद्यपि इब्रानी में उसका स्पष्ट उल्लेख नहीं है।
    reason: alternative_reading
  - marker: b
    text: “सिंह” के लिए प्रयुक्त इब्रानी शब्द का अनुवाद “सिंहनी” भी हो सकता है। “रहता है” का शाब्दिक अर्थ “बसता है,” “टिकता है” या “लेटता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “भुजा, यहाँ तक कि सिर का शिखर भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד אָמַר
  choice: और गाद के विषय में उसने कहा
  rationale: यह गोत्र को संबोधित आशीर्वचन का परिचय है; ‘के विषय में’ आधुनिक हिन्दी में स्वाभाविक है और לְ के संबंधसूचक प्रयोग को व्यक्त करता है।
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: विधेयात्मक आशीर्वचन की घोषणात्मक शक्ति बनाए रखता है, इसे अनावश्यक रूप से कामनार्थक वाक्य में नहीं बदलता।
- source_word: מַרְחִיב גָּד
  choice: जो गाद के लिए जगह बढ़ाता है
  rationale: हिफ़ील कृदंत में स्थान विस्तृत करने अथवा अधिक जगह देने का भाव है। कर्ता को स्पष्टतः परमेश्वर नहीं कहा गया, इसलिए हिन्दी में भी उसे अनिर्दिष्ट रखा गया है।
- source_word: כְּלָבִיא
  choice: सिंह के समान
  rationale: לָבִיא शक्तिशाली वयस्क सिंह के लिए प्रयुक्त हो सकता है और कभी सिंहनी का अर्थ भी देता है; मुख्य पाठ में सामान्य तथा स्वाभाविक ‘सिंह’ चुना गया और वैकल्पिक लिंगगत अर्थ पादटिप्पणी में रखा गया है।
- source_word: שָׁכֵן
  choice: घात लगाए बैठता है
  rationale: मूल क्रिया बसने, टिकने या लेटने का अर्थ दे सकती है। सिंह की उपमा के भीतर ‘घात लगाए बैठता है’ शिकारी मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְטָרַף
  choice: चीर डालता है
  rationale: טרף हिंसक ढंग से फाड़ने या चीरने का शिकारी बिंब देता है।
- source_word: זְרוֹעַ
  choice: भुजा
  rationale: ‘सिर के शिखर’ के समानांतर इसे शरीर के अंग के रूप में लेना उपयुक्त है; ‘भुजा’ गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: אַף קָדְקֹד
  choice: यहाँ तक कि सिर का शिखर भी
  rationale: אַף का उत्कर्षसूचक बल और קָדְקֹד का सिर के सबसे ऊपरी भाग का अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ‘गाद के लिए जगह बढ़ाने वाले’ का कर्ता
  choice: 'कर्ता को अनिर्दिष्ट रखा गया: ‘वह जो गाद के लिए जगह बढ़ाता है।’'
  alternative: ‘धन्य है परमेश्वर, जो गाद के लिए जगह बढ़ाता है’ अथवा कामनार्थक ‘धन्य हो वह...’।
  rationale: इब्रानी में परमेश्वर का नाम स्पष्टतः नहीं है, यद्यपि वह निहित कर्ता समझा जा सकता है। अनुवाद इस धार्मिक संभावना को स्वीकार करता है पर उसे मुख्य पाठ में जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक आशीर्वचन। वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है; हिंसक सिंह-बिंब और मूल की कर्ता-संबंधी अस्पष्टता सुरक्षित हैं।
