  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: hi
  text: रूबेन जीवित रहे और न मरे, और उसके जन थोड़े हों।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके जन गिने जाएँ।” अंतिम खंड का इब्रानी पाठ कठिन है। इसे इस प्रार्थना के रूप में भी समझा गया है कि रूबेन नगण्य न हो या गोत्रों की गिनती से बाहर न किया जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: जीवित रहे
  rationale: חיה के क़ाल युस्सिव का आशीषात्मक इच्छार्थक बल है; ‘जीवित रहे’ इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: व्यक्तिगत और गोत्रीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְאַל יָמֹת
  choice: और न मरे
  rationale: אַל के साथ युस्सिव निषेधात्मक इच्छा व्यक्त करता है; यह מות के सीधे अर्थ ‘मरना’ को बनाए रखता है और पहले खंड के समानांतर है।
- source_word: וִיהִי
  choice: और ... हों
  rationale: दूसरा युस्सिव एक और इच्छा या आशीष प्रस्तुत करता है; हिन्दी में बहुवचन कर्ता ‘जन’ के अनुसार ‘हों’ स्वाभाविक है।
- source_word: מְתָיו
  choice: उसके जन
  rationale: यह कठिन पद यहाँ सम्भवतः गोत्र के पुरुषों या लोगों को सूचित करता है। ‘जन’ साधारण ‘लोग’ की अपेक्षा आशीर्वचन की गरिमा बनाए रखता है और केवल युद्धरत पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: מִסְפָּר
  choice: थोड़े
  rationale: शाब्दिक अर्थ ‘संख्या’ है, पर היה के साथ यह सम्भवतः ‘गिनती में थोड़े’ का मुहावरेदार भाव देता है। हिन्दी में ‘थोड़े हों’ संक्षिप्त और स्वाभाविक है; कठिन वैकल्पिक समझ पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: अंतिम खंड וִיהִי מְתָיו מִסְפָּר की व्याख्या
  choice: ‘और उसके जन थोड़े हों’—रूबेन संख्या में छोटा रहते हुए भी बना रहे।
  alternative: ‘और उसके जन गिने जाएँ’—अर्थात वह गोत्रीय गिनती से बाहर न हो या नगण्य न हो।
  rationale: मसोरा-पाठ संक्षिप्त और कठिन है। מִסְפָּר को היה के साथ ‘गिनती में थोड़े’ समझना पाठ का सीधा सम्भावित अर्थ है, जबकि अनुकूलतर अर्थ भी प्रस्तावित हुए हैं। मुख्य पाठ सम्भावित अर्थ रखता है और पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण आशीर्वचन। ‘जीवित रहे ... न मरे’ मूल की समानांतर इच्छार्थक संरचना को बनाए रखता है। ‘जन’ गोत्र के लोगों के लिए सहज है और पद की काव्यात्मक गंभीरता के अनुकूल है।
