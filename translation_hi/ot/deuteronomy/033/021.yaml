base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: hi
  text: उसने अपने लिए सबसे उत्तम भूमि चुन ली[a], क्योंकि वहाँ शासक का भाग सुरक्षित रखा गया था। वह लोगों के अगुओं के साथ आया; उसने यहोवा की धार्मिकता को और उसके न्यायों को इस्राएल के साथ पूरा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने अपने लिए पहला भाग चुन लिया।” अगले वाक्यांश का अनुवाद “क्योंकि वहाँ व्यवस्था देनेवाले का भाग सुरक्षित रखा गया था” भी हो सकता है। इब्रानी शब्द का अर्थ “शासक” या “व्यवस्था देनेवाला” हो सकता है; कुछ लोग इसे मूसा का उल्लेख मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: चुन ली
  rationale: क्रिया का मूल अर्थ ‘देखा’ है, पर ‘अपने लिए देखना’ यहाँ किसी भाग को चुनने का भाव देता है।
- source_word: רֵאשִׁית
  choice: सबसे उत्तम भूमि
  rationale: इस भूभाग-संबंधी प्रसंग में शब्द आरंभिक समय के बजाय प्रमुख अथवा चुने हुए हिस्से को सूचित करता है।
- source_word: חֶלְקַת מְחֹקֵק
  choice: शासक का भाग
  rationale: חֶלְקַת आवंटित हिस्से को और מְחֹקֵק शासन करने वाले अथवा व्यवस्था देने वाले अधिकारी को सूचित कर सकता है; मुख्य पाठ में सामान्य अर्थ रखा गया है।
- source_word: סָפוּן
  choice: सुरक्षित रखा गया था
  rationale: निष्क्रिय कृदंत किसी भाग के अलग रखे, संचित या सुरक्षित होने का भाव देता है।
- source_word: וַיֵּתֵא
  choice: वह ... आया
  rationale: यह गति-सूचक क्रिया ‘आया’ अथवा ‘निकलकर गया’ हो सकती है; संदर्भ में ‘आया’ स्वाभाविक है।
- source_word: רָאשֵׁי עָם
  choice: प्रजा के अगुओं
  rationale: शाब्दिक ‘प्रजा के सिर’ का स्वाभाविक हिन्दी अर्थ नेतृत्व करने वाले अगुए हैं।
- source_word: צִדְקַת יְהוָה
  choice: यहोवा की धार्मिकता
  rationale: निर्माण धार्मिकता, न्याय अथवा धर्ममय कार्यों का भाव दे सकता है; निकट रूप मुख्य पाठ में और विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: וּמִשְׁפָּטָיו
  choice: उसके न्याय के निर्णयों
  rationale: बहुवचन शब्द यहोवा के न्यायिक निर्णयों या विधानों को सूचित करता है।
- source_word: עִם יִשְׂרָאֵל
  choice: इस्राएल के साथ
  rationale: पूर्वसर्ग का सीधा अर्थ ‘के साथ’ है और गाद के शेष इस्राएल के साथ मिलकर कार्य करने का भाव सुरक्षित रखता है।
theological_decisions:
- issue: מְחֹקֵק की पहचान और अर्थ
  choice: शासक
  alternative: व्यवस्था देनेवाला, संभवतः मूसा
  rationale: इब्रानी पद संक्षिप्त और विवादित है। सामान्य पदवी रखने से किसी विशिष्ट व्यक्ति की ऐसी पहचान नहीं थोपी जाती जिसकी पाठ में स्पष्ट माँग नहीं है।
- issue: צִדְקַת יְהוָה का अर्थ
  choice: यहोवा की धार्मिकता
  alternative: यहोवा का न्याय; यहोवा के धर्ममय कार्य
  rationale: मूल निर्माण गुण, न्याय, या ठोस धर्ममय कार्य—इनमें से एक से अधिक भाव ग्रहण कर सकता है; मुख्य पाठ निकट रूप रखता है और पादटिप्पणी वास्तविक विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। काव्यात्मक संक्षिप्तता को अत्यधिक स्पष्ट नहीं किया गया; विवादित पदों के विकल्प पादटिप्पणियों में सुरक्षित हैं।
