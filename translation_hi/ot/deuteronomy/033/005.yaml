  text: और वह यशूरून[a] में राजा था, जब प्रजा के मुखिया और इस्राएल के गोत्र एक साथ इकट्ठे हुए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यशूरून’ इस्राएल का एक काव्यात्मक नाम है। यहाँ कर्ता स्पष्ट नहीं है; इसका अनुवाद ‘और यहोवा यशूरून में राजा था’ भी किया जा सकता है, जबकि कुछ लोग इसे मूसा के विषय में समझते हैं।
    reason: alternative_reading_and_cultural_note
  - marker: b
    text: 'इब्रानी वाक्य-विन्यास का अनुवाद यह भी हो सकता है: ‘जब प्रजा के मुखिया इकट्ठे हुए, तब इस्राएल के गोत्र भी एक साथ थे।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और वह ... था
  rationale: היה का यह रूप यहाँ अस्तित्व अथवा स्थिति व्यक्त कर सकता है। हिंदी में ‘था’ सहज है और राजत्व के आरंभ को अनावश्यक रूप से निश्चित नहीं करता; कर्ता की पहचान सर्वनाम द्वारा अस्पष्ट रखी गई है।
- source_word: בִישֻׁרוּן
  choice: यशूरून में
  rationale: यशूरून इस्राएल का काव्यात्मक नाम है; उचित नाम को लिप्यंतरित किया गया और ב का सामुदायिक/स्थानवाचक भाव ‘में’ से व्यक्त किया गया है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: संज्ञा का सीधा और प्रचलित हिंदी रूप; मूल पाठ राजा की पहचान स्पष्ट नहीं करता।
- source_word: בְּהִתְאַסֵּף
  choice: जब ... इकट्ठे हुए
  rationale: ב सहित infinitive construct का समयवाचक अर्थ स्वाभाविक हिंदी उपवाक्य से व्यक्त किया गया है।
- source_word: רָאשֵׁי עָם
  choice: प्रजा के मुखिया
  rationale: ‘सिर’ की इब्रानी उपमा के नेतृत्व-संबंधी अर्थ को हिंदी के प्रचलित ‘मुखिया’ से व्यक्त किया गया है।
- source_word: יַחַד
  choice: एक साथ
  rationale: यह क्रियाविशेषण संयुक्तता और एकता दोनों व्यक्त करता है; ‘एक साथ’ वर्तमान हिंदी में स्वाभाविक है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्र
  rationale: संक्षिप्त इब्रानी विन्यास को पिछले कथन की व्याख्यात्मक समानाधिकरण संरचना में रखा गया है, जिससे मुखियाओं और गोत्रों की एकत्र एकता प्रकट होती है।
theological_decisions:
- issue: ‘वह’ और ‘राजा’ का संदर्भ
  choice: मुख्य पाठ कर्ता को केवल ‘वह’ कहता है और उसकी पहचान निश्चित नहीं करता।
  alternative: इसे ‘यहोवा यशूरून में राजा हुआ’ अथवा ‘मूसा यशूरून में राजा हुआ’ समझा जा सकता है।
  rationale: इब्रानी वाक्य में कर्ता का नाम स्पष्ट रूप से नहीं दिया गया। यहोवा और मूसा—दोनों व्याख्याएँ प्रस्तावित हुई हैं; इसलिए मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: इस्राएल की सामूहिक एकता
  choice: मुखियाओं और गोत्रों को एक साथ एकत्र दिखाया गया है।
  alternative: इसे औपचारिक राज्याभिषेक अथवा विशिष्ट वाचा-सभा के रूप में स्पष्ट किया जा सकता था।
  rationale: पद एक संयुक्त सभा बताता है, पर उसके राजनीतिक या धार्मिक समारोह का सटीक स्वरूप निश्चित नहीं करता।
