  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: hi
  text: 'और नप्ताली के विषय में उसने कहा:


    “हे नप्ताली, तू कृपा से तृप्त

    और याहवे की आशीष से भरपूर है;

    समुद्र[a] और दक्षिण पर अधिकार कर।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “पश्चिम और दक्षिण”; इब्रानी में “समुद्र” दिशासूचक रूप में पश्चिम के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי
  choice: और नप्ताली के विषय में
  rationale: לְ यहाँ जनजातीय आशीष के अगले विषय या संबोधित पक्ष का परिचय देता है; हिन्दी में यह रूप स्वाभाविक है और आसपास की आशीषों की शैली से मेल खाता है।
- source_word: שְׂבַע רָצוֹן
  choice: कृपा से तृप्त
  rationale: שְׂבַע तृप्त या भरपूर होने को और רָצוֹן यहाँ अनुग्रह या कृपा को व्यक्त करता है। संक्षिप्त काव्यात्मक हिन्दी में यह संयोजन समानांतर पंक्ति के अनुकूल है।
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: और यहवे की आशीष से भरपूर
  rationale: מָלֵא का अर्थ भरपूर होना है और construct phrase को स्वाभाविक हिन्दी संबंधवाचक रचना में रखा गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יָם
  choice: समुद्र
  rationale: शब्द का प्राथमिक अर्थ ‘समुद्र’ है; ‘पश्चिम’ का दिशात्मक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְדָרוֹם
  choice: और दक्षिण
  rationale: דָרוֹם दक्षिण अथवा दक्षिणी क्षेत्र को सूचित करता है; यहाँ समानांतर भौगोलिक अभिव्यक्ति के रूप में ‘दक्षिण’ स्पष्ट है।
- source_word: יְרָשָׁה
  choice: अधिकार कर
  rationale: ירשׁ का यह रूप भूमि पर अधिकार करने की आज्ञा या आशीषात्मक निर्देश देता है। ‘अधिकार कर’ हिन्दी में संक्षिप्त और क्षेत्रीय अधिकार के भाव के अनुकूल है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चतुरक्षरी व्यक्तिगत नाम आया है। ‘यहवे’ उसे एक उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में निकट लिप्यंतरण के रूप में प्रस्तुत करता है।
- issue: יְרָשָׁה की आज्ञार्थक अथवा आशीषात्मक शक्ति
  choice: अधिकार कर
  alternative: तू अधिकार करेगा; विरासत में ले
  rationale: रूप को प्रत्यक्ष आज्ञा की तरह रखा गया है, पर आशीष के प्रसंग में उसका भविष्यसूचक या कामनात्मक रंग बना रहता है; हिन्दी वाक्य इसे अनावश्यक रूप से केवल भविष्यवाणी नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक पंक्तियाँ रखी गई हैं। जनजाति को सीधे संबोधन के कारण ‘हे नप्ताली’ और ‘तू’ का प्रयोग किया गया है। मूल की संक्षिप्तता और ‘समुद्र/पश्चिम’ की वास्तविक अस्पष्टता सुरक्षित है।
