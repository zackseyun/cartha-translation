base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: hi
  text: हे यशूरून[a], परमेश्वर के समान कोई नहीं! वह तेरी सहायता के लिए[b] आकाशों पर सवार होता है, और अपने प्रताप में नभ पर[c] सवार होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यशूरून इस्राएल का एक काव्यात्मक नाम है।
    reason: cultural_note
  - marker: b
    text: या, “तेरी सहायता बनकर।”
    reason: lexical_alternative
  - marker: c
    text: या, “बादलों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: परमेश्वर के समान कोई नहीं
  rationale: अस्तित्ववाचक निषेध और तुलना को स्वाभाविक, काव्यात्मक हिन्दी में व्यक्त करता है; אֵל को यहाँ सामान्य ईश्वरीय पद माना गया है।
- source_word: יְשֻׁרוּן
  choice: यशुरून
  rationale: यह इस्राएल का काव्यात्मक नाम है, इसलिए इसका अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: רֹכֵב
  choice: सवार होता है
  rationale: इब्रानी कृदन्त परमेश्वर के विशिष्ट और महिमामय कार्य का चित्र प्रस्तुत करता है; हिन्दी का सामान्य वर्तमान इस गुणात्मक भाव को बनाए रखता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: संदर्भ में स्वर्गीय विस्तार का स्वाभाविक हिन्दी रूप है और काव्यात्मक समानांतरता के पहले पद को स्पष्ट रखता है।
- source_word: בְעֶזְרֶךָ
  choice: तेरी सहायता के लिए
  rationale: בְ यहाँ उद्देश्य अथवा लाभ का भाव व्यक्त कर सकता है; यह रूप हिन्दी में स्पष्ट है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּבְגַאֲוָתוֹ
  choice: और अपने प्रताप में
  rationale: परमेश्वर के विषय में גַאֲוָה उसकी उच्चता, वैभव और महिमा को दर्शाता है; ‘प्रताप’ काव्यात्मक और धर्मवैचारिक रूप से उपयुक्त है।
- source_word: שְׁחָקִים
  choice: ऊँचे आकाश
  rationale: यह काव्यात्मक शब्द ऊपरी आकाश अथवा बादलों के क्षेत्र को दर्शाता है; ‘ऊँचे आकाश’ पहले समानांतर पद से संबंध बनाए रखते हुए उसकी ऊँचाई का भाव देता है।
theological_decisions:
- issue: काव्यात्मक तुलना में אֵל का आशय
  choice: सामान्य ईश्वरीय पद के रूप में ‘परमेश्वर’
  alternative: व्यक्तिनाम ‘एल’ अथवा पद ‘सामर्थी’
  rationale: यह पद इस्राएल के परमेश्वर की अतुलनीयता का गुणगान करता है। ‘परमेश्वर’ हिन्दी में स्वाभाविक रूप से इसी आशय को व्यक्त करता है और किसी अलग देवता का संकेत देने से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली अपनाई गई है। संबोधन में ‘हे’ और एकवचन ‘तेरी’ मूल पाठ के आत्मीय, सामूहिक संबोधन को बनाए रखते हैं। विस्मयादिबोधक चिह्न आरंभिक अतुलनीयता-घोषणा की स्तुतिपरक शक्ति स्पष्ट करता है।
