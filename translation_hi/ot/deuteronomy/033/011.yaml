source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: hi
  text: 'हे याहवे, उसकी सामर्थ्य[a] को आशीष दे,

    और उसके हाथों के काम को स्वीकार कर।

    उसके विरुद्ध उठने वालों और उससे घृणा करने वालों की कमर[b] कुचल दे,

    ताकि वे फिर उठ न सकें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सामर्थ्य’ के स्थान पर ‘संपत्ति’ या ‘सेना’ भी संभव है; इब्रानी शब्द सामर्थ्य, साधन-संपत्ति या सैन्य बल का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘कमर’ शक्ति का चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: आशीष दे
  rationale: यह याहवे को संबोधित आज्ञार्थक विनती है। ‘आशीष दे’ मूल अर्थ को सीधे और स्वाभाविक रूप से व्यक्त करता है; ‘समृद्ध कर’ संदर्भगत अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: חֵילוֹ
  choice: उसकी सामर्थ्य
  rationale: חַיִל सामर्थ्य, साधन-संपत्ति या सैन्य बल का बोध करा सकता है। ‘सामर्थ्य’ इस संदर्भ में अर्थ की व्यापकता को सबसे अच्छी तरह बनाए रखता है।
- source_word: וּפֹעַל יָדָיו
  choice: उसके हाथों के काम
  rationale: यह उसके किए हुए कार्य या परिश्रम का मूर्त इब्रानी चित्र है; हिंदी में भी यह सहज और स्पष्ट है।
- source_word: תִּרְצֶה
  choice: स्वीकार कर
  rationale: क्रिया लेवी की सेवा पर परमेश्वर की प्रसन्नता और अनुमोदन की विनती करती है। ‘स्वीकार कर’ संक्षिप्त है और बलिदानी अथवा सेवकाई-संबंधी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מְחַץ
  choice: तोड़ दे
  rationale: मूल क्रिया कुचलने या चूर करने की प्रबल हिंसक क्रिया है। ‘कमर तोड़ दे’ हिंदी में स्वाभाविक रहते हुए उसकी शक्ति और काव्यात्मक चित्र को बनाए रखता है।
- source_word: מָתְנַיִם
  choice: कमर
  rationale: शाब्दिक अर्थ कमर अथवा कटि-प्रदेश है, जो इब्रानी में शक्ति का चित्र है। ‘कमर’ सामान्य आधुनिक हिंदी में ‘कटि’ से अधिक बोधगम्य है।
- source_word: קָמָיו
  choice: उसके विरुद्ध उठने वालों
  rationale: यह קום, ‘उठना’, से बना रूप है और विरोध में खड़े होने की क्रियात्मक छवि को बनाए रखता है।
- source_word: וּמְשַׂנְאָיו
  choice: उससे घृणा करने वालों
  rationale: यह सहभागी रूप व्यक्तिगत बैर को सीधे व्यक्त करता है; केवल ‘शत्रु’ कहना इस बारीकी को घटा देता।
- source_word: מִן יְקוּמוּן
  choice: ताकि वे फिर उठ न सकें
  rationale: इब्रानी रचना संक्षिप्त और कुछ लुप्तपदीय है। पिछले ‘तोड़ दे’ के परिणाम को हिंदी में स्पष्ट करते हुए यह भाव रखा गया है कि विरोधी दोबारा उठने में समर्थ न हों।
theological_decisions:
- issue: ‘उसकी/उसके’ सर्वनामों का संदर्भ
  choice: सर्वनाम तत्काल संदर्भ में लेवी गोत्र की ओर संकेत करते हैं।
  alternative: इन्हें व्यापक रूप से याजकीय सेवक या लेवी की प्रतिनिधिक सेवकाई से संबंधित माना जा सकता है।
  rationale: व्यवस्थाविवरण 33:8–11 में मूसा की वाणी सीधे लेवी के विषय में है। एकवचन सर्वनाम मूल इब्रानी रूप को सुरक्षित रखते हैं और मुख्य पाठ में किसी व्यापक व्याख्या को आरोपित नहीं करते।
- issue: מִן יְקוּמוּן में विरोधियों के न उठने का आशय
  choice: इसे ‘ताकि वे फिर उठ न सकें’ के रूप में परिणामसूचक समझा गया है।
  alternative: अधिक शाब्दिक रूप ‘उठने से रोक दे’ या प्रबल रूप ‘वे कभी न उठें’ हो सकता है।
  rationale: इब्रानी पदबंध संक्षिप्त है और उसका संबंध पिछले विनाशकारी आज्ञार्थक से है। चुना हुआ रूप परिणाम स्पष्ट करता है, पर ‘कभी’ जोड़कर स्थायी विनाश को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता को पंक्ति-विभाजन से दिखाया गया है। ‘कमर तोड़ दे’ हिंदी का स्वाभाविक प्रयोग है, जबकि पादटिप्पणी मूल इब्रानी की अधिक शाब्दिक हिंसक छवि स्पष्ट करती है।
