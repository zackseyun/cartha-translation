source:
  edition: WLC
  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: hi
  text: इस्राएल सुरक्षित होकर, अकेला बसता है; याकूब का सोता अनाज और नए दाखरस की भूमि में है; उसके आकाश से भी ओस टपकती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: बसा है
  rationale: שׁכן स्थायी रूप से रहने या बसने को व्यक्त करता है। काव्यात्मक आशीष में हिन्दी का वर्तमान पूर्ण रूप सुरक्षित निवास की परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶּטַח
  choice: निडर
  rationale: यहाँ शब्द क्रियाविशेषण की तरह सुरक्षित और बेखटके रहने की दशा बताता है; ‘निडर’ आधुनिक हिन्दी में इसे संक्षेप और सहजता से व्यक्त करता है।
- source_word: בָּדָד
  choice: अकेला
  rationale: शब्द अलग या अपने में रहने का भाव रखता है। आशीष के संदर्भ में यह परित्याग नहीं, बल्कि बाधारहित पृथक सुरक्षा दर्शाता है।
- source_word: עֵין יַעֲקֹב
  choice: याकूब का सोता
  rationale: עֵין का अर्थ ‘आँख’ अथवा ‘सोता/जलस्रोत’ हो सकता है। अनाज, दाखमधु और ओस के कृषि-संदर्भ में ‘सोता’ अधिक संगत है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אֶל אֶרֶץ
  choice: भूमि में है
  rationale: काव्यात्मक, क्रियारहित वाक्यांश में אֶל संबंध या दिशा दर्शाता है। हिन्दी में स्पष्ट और स्वाभाविक स्थान-संबंध के लिए ‘भूमि में है’ प्रयुक्त है।
- source_word: דָּגָן
  choice: अनाज
  rationale: यह सामान्य रूप से धान्य या अन्न-उपज का शब्द है; ‘अनाज’ आधुनिक हिन्दी में व्यापक और स्पष्ट है।
- source_word: תִּירוֹשׁ
  choice: नई दाखमधु
  rationale: תִּירוֹשׁ अंगूर की नई या ताज़ी मदिरा को सूचित करता है। ‘नई दाखमधु’ कृषि-समृद्धि की पारंपरिक बाइबिलीय छवि बनाए रखती है।
- source_word: אַף
  choice: भी
  rationale: यह भूमि के साथ आकाश की देन को जोड़ते हुए जोर देता है; हिन्दी में ‘भी’ इस वृद्धि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׁמָיו
  choice: उसके आकाश
  rationale: मूल का तृतीय पुरुष एकवचन संबंधवाचक प्रत्यय सुरक्षित रखा गया है; इसका संदर्भ इस्राएल/याकूब के ऊपर के आकाश से है।
- source_word: יַעַרְפוּ
  choice: टपकाते हैं
  rationale: यह क्रिया वर्षा या ओस के टपकने/झरने के लिए प्रयुक्त होती है। बहुवचन कर्ता ‘आकाश’ के साथ वर्तमान काव्यात्मक वर्णन हिन्दी में स्वाभाविक है।
- source_word: טָל
  choice: ओस
  rationale: यह शब्द सीधे ‘ओस’ का अर्थ देता है और कृषि-आशीष की छवि बनाए रखता है।
theological_decisions:
- issue: עֵין יַעֲקֹב की अर्थगत अस्पष्टता
  choice: ‘याकूब का सोता’ मुख्य पाठ में
  alternative: ‘याकूब की आँख’
  rationale: उपजाऊ भूमि और ओस का निकट संदर्भ ‘सोता’ अर्थ का समर्थन करता है, पर मूल शब्द की वास्तविक द्विअर्थता पादटिप्पणी में रखी गई है।
- issue: בָּדָד का भाव
  choice: ‘अकेला’—सुरक्षित पृथकता के अर्थ में
  alternative: ‘अपने में’ या ‘अलग’
  rationale: आशीष का संदर्भ नकारात्मक एकाकीपन की अपेक्षा बाधारहित और विशिष्ट निवास का संकेत देता है; फिर भी मुख्य शब्द की तीक्ष्णता को नरम करके समाप्त नहीं किया गया।
- issue: काव्यात्मक काल और पक्ष
  choice: ‘बसा है’ तथा ‘टपकाते हैं’
  alternative: ‘बसा’ तथा ‘टपकाएंगे/टपकाते थे’
  rationale: हिब्रू के रूप काव्यात्मक आशीष में अवस्थागत निवास और सामान्य/चित्रात्मक क्रिया व्यक्त करते हैं। हिन्दी में ये रूप बिना अनावश्यक भविष्यवाणी या केवल भूतकाल तय किए उस तनाव को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक संक्षिप्तता बनाए रखते हुए अस्पष्ट ‘याकूब का सोता’ संरचना को अत्यधिक व्याख्यायित नहीं किया गया। ‘दाखमधु’ बाइबिलीय-कृषि संदर्भ में ‘नई मदिरा’ की अपेक्षा अधिक प्रतिष्ठित और परिचित चयन है।
