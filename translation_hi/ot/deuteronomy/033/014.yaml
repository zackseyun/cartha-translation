lexical_decisions:
- source_word: מֶגֶד
  choice: उत्तम
  rationale: आशीर्वाद के इस संदर्भ में यह शब्द बहुमूल्य अथवा श्रेष्ठ उपज का भाव देता है। हिंदी में ‘उत्तम’ दोनों समानांतर पदों के साथ स्वाभाविक है।
- source_word: תְּבוּאֹת
  choice: उपज
  rationale: यह भूमि से उत्पन्न होने वाली कृषि-उपज के लिए व्यापक शब्द है और किसी एक फसल या कटनी तक अर्थ को सीमित नहीं करता।
- source_word: שָׁמֶשׁ
  choice: सूर्य
  rationale: मूल पाठ में सूर्य को कृषि-वृद्धि और पकने से संबद्ध किया गया है; ‘सूर्य से पकी’ इस संबंध को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: גֶּרֶשׁ
  choice: पैदावार
  rationale: यह दुर्लभ शब्द उस वस्तु को सूचित करता है जो बाहर निकलती या उत्पन्न होती है। ‘पैदावार’ कृषि-संबंधी समानांतरता बनाए रखते हुए अत्यधिक शाब्दिक अस्पष्टता से बचाता है।
- source_word: יְרָחִים
  choice: महीनों
  rationale: यह बहुवचन सामान्यतः ‘महीनों’ को दर्शाता है, यद्यपि इसका संबंध चंद्रमा से है। यहाँ ऋतुचक्र में बार-बार होने वाली उपज का भाव उपयुक्त है।
