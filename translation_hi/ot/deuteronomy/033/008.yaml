base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: hi
  text: 'और लेवी के विषय में उसने कहा:


    “तेरे तुम्मीम और तेरे ऊरीम


    तेरे निष्ठावान जन के हैं,[a]


    जिसे तूने मस्सा[b] में परखा,


    और जिसके साथ तूने मरीबा के जल के पास विवाद किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे भक्त जन” अथवा “तेरे वफादार जन।” इब्रानी पद वाचा के प्रति निष्ठा से पहचाने जाने वाले व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मस्सा” का अर्थ “परीक्षा” है, और “मरीबा” नाम झगड़े या विवाद से जुड़ा है (देखें निर्गमन 17:1–7; गिनती 20:1–13)।
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי
  choice: और लेवी के विषय में
  rationale: לְ यहाँ आशीष के क्रम में उस गोत्र का परिचय देता है जिसके विषय में कहा जा रहा है। यह हिंदी में स्वाभाविक है और केवल ‘लेवी से’ कहने से उत्पन्न संभावित भ्रम से बचाता है।
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: तेरे तुम्मीम और तेरे ऊरीम
  rationale: ये याजकीय निर्णय से जुड़े विशिष्ट पारिभाषिक नाम हैं; इनके ठीक स्वरूप और कार्य को अनिश्चित मानते हुए अर्थानुवाद के बजाय लिप्यंतरण किया गया है। दोनों एकवचन द्वितीय पुरुष संबंधसूचक प्रत्ययों को ‘तेरे’ से व्यक्त किया गया है।
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: तेरे निष्ठावान जन के लिए हैं
  rationale: क्रियारहित इब्रानी वाक्य को स्पष्ट हिंदी बनाने के लिए ‘हैं’ जोड़ा गया है। חָסִיד वाचा-संबंधी निष्ठा या भक्ति से पहचाने जाने वाले व्यक्ति को सूचित कर सकता है; ‘निष्ठावान जन’ इस अर्थ को रखता है और किसी विशेष ऐतिहासिक व्यक्ति की पहचान तय नहीं करता।
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: जिसे तूने ... परखा
  rationale: נסה का सामान्य अर्थ किसी को जाँचना या परखना है। ‘परखा’ इस प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: בְּמַסָּה
  choice: मस्सा में
  rationale: מַסָּה यहाँ स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है; उसके शब्दार्थ की ओर पादटिप्पणी में संकेत है।
- source_word: תְּרִיבֵהוּ
  choice: जिसके साथ तूने ... विवाद किया
  rationale: ריב का भाव झगड़ने, वाद करने या विवाद में पड़ने का है। यह रूप सीधे परमेश्वर और संबोधित व्यक्ति के बीच तनाव को बनाए रखता है।
- source_word: עַל מֵי מְרִיבָה
  choice: मरीबा के जल के पास
  rationale: עַל इस घटना-स्थान वाले प्रसंग में स्थानीय अर्थ देता है। ‘के पास’ हिंदी में स्थान को स्वाभाविक रूप से व्यक्त करता है, जबकि मरीबा को नाम के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ‘तेरे निष्ठावान जन’ का अभिप्रेत व्यक्ति
  choice: वाक्यांश को एकवचन और अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से हारून, पूर्वज लेवी, या पूरे लेवी गोत्र के लिए मानना।
  rationale: इब्रानी एकवचन इन विभिन्न पहचानों में से किसी एक को निर्णायक रूप से निर्धारित नहीं करता। अनुवाद किसी नाम को जोड़कर इस वास्तविक अस्पष्टता को समाप्त नहीं करता।
- issue: मस्सा और मरीबा में परमेश्वर तथा लेवी के प्रतिनिधि के बीच तनाव
  choice: ‘तूने परखा’ और ‘तूने ... विवाद किया’ के सीधे कथन बनाए रखे गए हैं।
  alternative: इन क्रियाओं को इस्राएल की सामूहिक कार्रवाई बताकर या टकराव को नरम करके समझाना।
  rationale: मूल पाठ के व्याकरण में परमेश्वर संबोधक कर्ता है और वही उस व्यक्ति को परखता तथा उससे विवाद करता है; कठिन धार्मिक तनाव को अनुवाद में हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। काव्य-पंक्तियाँ मूल आशीर्वचन की लय और समानांतरता दिखाती हैं। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है, और ऊरीम-तुम्मीम जैसे ऐतिहासिक याजकीय पदों का लिप्यंतरण किया गया है।
