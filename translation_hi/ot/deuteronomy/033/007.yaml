  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: hi
  text: 'और यहूदा के लिए उसने यह कहा:


    “हे याहवे, यहूदा की आवाज़ सुन,


    और उसे उसके लोगों के पास ले आ।


    उसके हाथ उसके लिए संघर्ष करें[a],


    और उसके शत्रुओं के विरुद्ध उसकी सहायता कर।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके हाथ उसके लिए पर्याप्त हों।” यह इब्रानी वाक्यांश कठिन है और इसे एक से अधिक प्रकार से समझा गया है।
    reason: वैकल्पिक पाठ-अर्थ; יָדָיו רָב לוֹ की वास्तविक शाब्दिक और व्याकरणिक अस्पष्टता।
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: यहूदा के लिए उसने यह कहा
  rationale: यह आशीषों की शृंखला में यहूदा के लिए कही गई बात का संक्षिप्त और स्वाभाविक परिचय है। לִיהוּדָה को लाभ अथवा संदर्भसूचक अर्थ में खुला रखते हुए ‘के लिए’ कहा गया है।
- source_word: שְׁמַע יְהוָה
  choice: हे याहवे, ... सुन
  rationale: आज्ञार्थक क्रिया यहाँ प्रार्थनापूर्ण सीधा संबोधन है। परमेश्वर के विशिष्ट नाम יְהוָה को ‘याहवे’ रखा गया है।
- source_word: קוֹל יְהוּדָה
  choice: यहूदा की आवाज़
  rationale: קוֹל का मूल चित्र ‘आवाज़’ है। ‘पुकार’ संभव है, पर वह प्रार्थना या संकट का भाव अधिक स्पष्ट कर देता; मुख्य पाठ स्रोत की व्यापकता बनाए रखता है।
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: और उसे उसके लोगों के पास ले आ
  rationale: हिफ़ील रूप का अर्थ ‘ले आना’ है। अनुवाद यह तय नहीं करता कि बात युद्ध से लौटने, पुनर्मिलन या किसी अन्य परिस्थिति की है।
- source_word: יָדָיו רָב לוֹ
  choice: उसके हाथ उसके लिए संघर्ष करें
  rationale: यह अत्यंत संक्षिप्त और कठिन इब्रानी वाक्यांश है। ‘संघर्ष करें’ युद्ध-संदर्भ और अगली पंक्ति के समानांतर भाव से मेल खाता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: और उसके शत्रुओं के विरुद्ध तू उसका सहायक हो
  rationale: מִן को यहाँ विरोध अथवा बचाव के अर्थ में ‘के विरुद्ध’ समझा गया है। निहित कर्ता याहवे को हिन्दी में ‘तू’ द्वारा स्पष्ट करना स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यह पद वाचा के विशिष्ट नाम का प्रयोग करता है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: कठिन वाक्यांश יָדָיו רָב לוֹ का अर्थ
  choice: उसके हाथ उसके लिए संघर्ष करें
  alternative: उसके हाथ उसके लिए पर्याप्त हों
  rationale: व्यंजनात्मक पाठ और संक्षिप्त वाक्य-विन्यास के एक संभव अर्थ के अनुसार मुख्य पाठ में संघर्ष का भाव रखा गया है। चूँकि पर्याप्तता का अर्थ भी प्राचीन पाठ की वास्तविक संभावना है, उसे पादटिप्पणी में दिया गया है और अस्पष्टता को छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण, सहज शब्दावली रखी गई है। परमेश्वर को सीधे संबोधित करते समय एकवचन ‘तू’ मूल इब्रानी के एकवचन संबोधन और प्रार्थनात्मक निकटता को बनाए रखता है; भाषा को अनावश्यक रूप से पुरातन नहीं बनाया गया।
