source:
  edition: WLC
  text: וּ/לְ/אָשֵׁ֣ר אָמַ֔ר בָּר֥וּךְ מִ/בָּנִ֖ים אָשֵׁ֑ר יְהִ֤י רְצוּי֙ אֶחָ֔י/ו וְ/טֹבֵ֥ל בַּ/שֶּׁ֖מֶן רַגְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: hi
  text: 'और आशेर के विषय में उसने कहा:


    “पुत्रों में सबसे धन्य आशेर है[a];


    वह अपने भाइयों का कृपापात्र हो[b],


    और अपना पाँव तेल में डुबोए[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुत्रों से बढ़कर धन्य आशेर है।” इब्रानी तुलना को तुलनात्मक या श्रेष्ठतावाचक अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उसके भाई” सम्भवतः इस्राएल के अन्य गोत्रों की ओर संकेत करते हैं।
    reason: cultural_note
  - marker: c
    text: “पाँव तेल में डुबोना” सम्भवतः बहुतायत या समृद्धि का चित्र है, पर मुख्य पाठ में इब्रानी रूपक को अक्षरशः रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: और आशेर के विषय में उसने कहा
  rationale: לְ यहाँ अगले गोत्र के विषय में आशीर्वचन आरम्भ करता है। ‘के विषय में’ आधुनिक हिन्दी में स्वाभाविक है और कथन की संरचना बनाए रखता है।
- source_word: בָּרוּךְ מִבָּנִים
  choice: पुत्रों में परम धन्य
  rationale: מִן की तुलना को यहाँ अतिशयोक्तिपरक अर्थ में व्यक्त किया गया है। ‘पुत्रों में परम धन्य’ काव्यात्मक और सहज है, जबकि वैकल्पिक तुलनात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהִי רְצוּי אֶחָיו
  choice: वह अपने भाइयों का कृपापात्र हो
  rationale: יְהִי आशीर्वादात्मक कामना है और רְצוּי स्वीकृति अथवा अनुग्रह पाने का भाव देता है। ‘कृपापात्र’ इस संबंधपरक अर्थ को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: और अपना पाँव तेल में डुबोए
  rationale: मूल के ठोस रूपक, एकवचन ‘पाँव’ और आशीर्वादात्मक भाव को बनाए रखा गया है; तेल को जैतून का तेल कहकर अनावश्यक रूप से विशिष्ट नहीं किया गया।
theological_decisions:
- issue: ‘अपना पाँव तेल में डुबोए’ रूपक का अर्थ
  choice: मुख्य पाठ में मूल रूपक को अक्षरशः बनाए रखना
  alternative: इसे भरपूर उपज, समृद्धि अथवा विशेषतः जैतून के तेल की बहुतायत के रूप में स्पष्ट करना
  rationale: चित्र संभवतः प्रचुरता और समृद्धि सूचित करता है, पर इब्रानी पाठ उसका अर्थ स्पष्ट नहीं करता। शाब्दिक चित्र बनाए रखने से काव्यात्मक और व्याख्यात्मक खुलापन सुरक्षित रहता है।
- issue: מִבָּנִים में तुलना का बल
  choice: 'अतिशयोक्तिपरक: ‘पुत्रों में परम धन्य’'
  alternative: 'तुलनात्मक: ‘पुत्रों से बढ़कर धन्य’'
  rationale: इब्रानी रचना दोनों अर्थों की अनुमति देती है। मुख्य पाठ में सहज हिन्दी अतिशयोक्ति चुनी गई है और वास्तविक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक शैली अपनाई गई है। ‘धन्य’, ‘कृपापात्र’ और आशीर्वादात्मक क्रिया-रूप पद की औपचारिकता बनाए रखते हैं; सभी वास्तविक अर्थ-विकल्प पादटिप्पणियों में सुरक्षित हैं।
