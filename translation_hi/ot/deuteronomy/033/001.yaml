base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: hi
  text: 'और यह वह आशीष है जो परमेश्वर का जन मूसा ने अपनी मृत्यु से पहले इस्राएल के पुत्रों[a] को दी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’; यह समूची इस्राएली प्रजा के लिए प्रयुक्त एक प्रचलित सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: और यह
  rationale: संयोजक וְ तथा संकेतवाचक זֹאת को स्वाभाविक हिंदी में रखते हुए यह पद पिछले प्रसंग से जुड़ता और नए खंड का परिचय देता है।
- source_word: הַבְּרָכָה
  choice: वह आशीष
  rationale: निश्चित पदबंध को हिंदी में संकेतवाचक रूप से व्यक्त किया गया है; ‘आशीष’ औपचारिक आशीर्वचन के अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר בֵּרַךְ
  choice: जो ... दी
  rationale: हिंदी में ‘आशीष देना’ स्वाभाविक मुहावरा है और इब्रानी क्रिया के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: नाम का प्रचलित मानक हिंदी रूप।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह हिंदी बाइबलीय प्रयोग इब्रानी उपाधि ‘परमेश्वर का पुरुष/जन’ को गरिमापूर्ण और सहज रूप में व्यक्त करता है।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी का शाब्दिक पारिवारिक और पुल्लिंग रूप सुरक्षित रखा गया है; व्यापक सामूहिक अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: לִפְנֵי מוֹתוֹ
  choice: अपनी मृत्यु से पहले
  rationale: इब्रानी संज्ञात्मक कालवाचक पदबंध का सीधा और स्वाभाविक हिंदी रूप; ‘अपनी’ से संदर्भ मूसा की मृत्यु की ओर स्पष्ट रहता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל के लिंगयुक्त सामूहिक पदबंध का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल के लोग / इस्राएल की सन्तान
  rationale: मूल पाठ का ‘पुत्रों’ वाला पारिवारिक तथा व्याकरणिक रूप बनाए रखा गया है, जबकि पादटिप्पणी बताती है कि यह पूरी इस्राएली प्रजा के लिए प्रचलित सामूहिक अभिव्यक्ति है।
- issue: אִישׁ הָאֱלֹהִים की उपाधि
  choice: परमेश्वर के जन
  alternative: परमेश्वर का पुरुष
  rationale: ‘परमेश्वर के जन’ आधुनिक हिंदी में अधिक स्वाभाविक और प्रतिष्ठित उपाधि है तथा मूसा की ईश्वरीय नियुक्ति का भाव रखती है; इसे किसी विशिष्ट साम्प्रदायिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘आशीष देना’ सहज हिंदी है; वाक्यांत का द्विबिंदु आगे आने वाले आशीर्वचनों का संकेत देता है।
