  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: hi
  text: तेरे अर्गले लोहे और काँसे के होंगे[a], और जैसे तेरे दिन होंगे, वैसा ही तेरा बल होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी जूतियाँ लोहे और काँसे की होंगी।” इब्रानी शब्द का अर्थ जूती या जूता भी हो सकता है; पर धातुओं और सुरक्षा के इस संदर्भ में बहुत-से लोग इसे अर्गले या कुंडे समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “वैसा ही तेरा विश्राम” अथवा “वैसी ही तेरी सुरक्षा होगी।” अंतिम इब्रानी शब्द दुर्लभ है और उसका अर्थ अनिश्चित है; “बल” पारंपरिक अनुवाद है और आशीर्वाद के संदर्भ में उपयुक्त बैठता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: इस धातु का सामान्य अर्थ; נְחֹשֶׁת के साथ भौतिक दृढ़ता का चित्र प्रस्तुत करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: बाइबिलीय प्रयोग में यह ताँबे अथवा काँसे को व्यापक रूप से सूचित कर सकता है; लोहे के साथ 'काँसा' स्वाभाविक और पारंपरिक युग्म है।
- source_word: מִנְעָלֶיךָ
  choice: तेरे फाटकों के अर्गले
  rationale: शब्द का शाब्दिक रूप से पादुका से संबंध हो सकता है, पर धातुओं और सुरक्षा के संदर्भ में फाटकों को बंद करने वाले अर्गले सुसंगत अर्थ देते हैं। मूल में 'फाटक' स्पष्ट नहीं है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּכְיָמֶיךָ
  choice: और जैसे तेरे दिन होंगे
  rationale: כ तुलना या अनुपात दर्शाता है; यह अभिव्यक्ति जीवन के दिनों और अगली संज्ञा के बीच समानुपात स्थापित करती है।
- source_word: דָּבְאֶךָ
  choice: तेरा बल
  rationale: यह अत्यंत दुर्लभ और अनिश्चित शब्द है। आशीर्वाद के संदर्भ में पारंपरिक 'बल' अर्थ उपयुक्त है, पर 'विश्राम/सुरक्षा' का विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: आशीर्वाद के बिंब की व्याख्या
  choice: पद स्थायी सुरक्षा और जीवन भर बने रहने वाले बल का आश्वासन देता है।
  alternative: यह कठिन भूभाग के लिए मजबूत पादुकाओं और निरंतर सामर्थ्य का वर्णन कर सकता है; अंतिम खंड दिनों के अनुरूप विश्राम या सुरक्षा भी सूचित कर सकता है।
  rationale: यहाँ कोई प्रमुख सिद्धान्तगत विवाद नहीं, किंतु दोनों मुख्य इब्रानी संज्ञाएँ व्याख्यात्मक रूप से कठिन हैं। मुख्य पाठ में संदर्भानुकूल अर्थ लिया गया है और वास्तविक अनिश्चितता पादटिप्पणियों में बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक आशीर्वाद-शैली रखी गई है। एकवचन संबोधन के अनुरूप 'तेरे/तेरा' चुना गया है। 'अर्गले' सटीक किंतु कुछ साहित्यिक शब्द है; 'फाटकों के' जोड़ने से सामान्य पाठक के लिए उसका आशय स्पष्ट होता है।
