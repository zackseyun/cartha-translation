language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: hi
  text: हे इस्राएल, तू धन्य है! तेरे समान कौन है? तू याहवे द्वारा बचाई गई प्रजा है। वह तेरी सहायता की ढाल और तेरे प्रताप की तलवार है। तेरे शत्रु तेरे सामने दीन होकर झुकेंगे[a], और तू उनके ऊँचे स्थानों पर पाँव रखेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे शत्रु विवश होकर तेरी अधीनता स्वीकार करेंगे” अथवा “तेरे सामने झूठी अधीनता दिखाएँगे”; इब्रानी क्रिया दबी हुई या दिखावटी अधीनता का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी ऊँचाइयों पर” अथवा “उनके ऊँचे गढ़ों पर”; कुछ लोग इसका अर्थ “उनकी पीठों पर” समझते हैं, पर इब्रानी संज्ञा का अधिक सीधा अर्थ ऊँचे स्थान या ऊँचाइयाँ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: तू धन्य है
  rationale: बहुवचन विस्मयात्मक रूप इस्राएल की धन्य और सौभाग्यपूर्ण दशा बताता है; यह चयन पद की ऊँची, आशीर्वादात्मक शैली बनाए रखता है।
- source_word: מִי כָמוֹךָ
  choice: तेरे समान कौन है?
  rationale: यह अनुपमता व्यक्त करने वाला आलंकारिक प्रश्न है और हिन्दी में स्वाभाविक तथा सीधा है।
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: याहवे द्वारा बचाई गई प्रजा
  rationale: निफ़अल कृदंत इस्राएल को ऐसी प्रजा के रूप में चित्रित करता है जिसे याहवे ने बचाया है; कर्मवाच्य सम्बन्ध स्पष्ट रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: מָגֵן עֶזְרֶךָ
  choice: तेरी सहायता की ढाल
  rationale: संक्षिप्त इब्रानी समास के रूप को निकटता से रखते हुए याहवे को इस्राएल की रक्षा और सहायता का स्रोत बताया गया है।
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: तेरे प्रताप की तलवार
  rationale: समानांतर पद में याहवे को तलवार कहा गया है; ‘प्रताप’ גַּאֲוָה के सकारात्मक गौरव और उत्कर्ष को व्यक्त करता है, बिना नकारात्मक ‘घमंड’ का भाव लाए।
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: तेरे शत्रु तेरे सामने दीन होकर झुकेंगे
  rationale: क्रिया पराजित शत्रुओं की विवश, संभवतः कपटपूर्ण अधीनता का संकेत दे सकती है। मुख्य पाठ में सहज हिन्दी रखी गई है और अर्थ की दूसरी छाया पादटिप्पणी में सुरक्षित है।
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: तू उनके ऊँचे स्थानों पर पाँव रखेगा
  rationale: בָּמוֹת का सीधा अर्थ ऊँचे स्थान या ऊँचाइयाँ है; विजय-सन्दर्भ में यह शत्रुओं के दुर्गम ऊँचे ठिकानों का भी संकेत दे सकता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में वाचा-नाम सीधे प्रयुक्त है; उसका लिप्यंतरण व्यक्तिगत नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: גַּאֲוָתֶךָ का भाव
  choice: तेरे प्रताप
  alternative: तेरा घमंड / तेरा गौरव / तेरा उत्कर्ष
  rationale: आशीर्वाद के सकारात्मक सन्दर्भ में ‘प्रताप’ सम्मान, गौरव और उत्कर्ष का भाव रखता है; ‘घमंड’ आधुनिक हिन्दी में अनावश्यक नैतिक नकारात्मकता जोड़ता।
- issue: शत्रुओं की अधीनता में निहित कपट
  choice: मुख्य पाठ में ‘दीन होकर झुकेंगे’, पादटिप्पणी में विवश या दिखावटी अधीनता
  alternative: तेरे सामने झूठी अधीनता दिखाएँगे
  rationale: इब्रानी क्रिया में दीन अधीनता और कपटपूर्ण या अनिच्छुक समर्पण दोनों की सम्भावना है। मुख्य पाठ को स्वाभाविक रखते हुए वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। इस्राएल को एकवचन सम्बोधन होने के कारण ‘तू/तेरे’ रखा गया है। छोटे वाक्यों से इब्रानी काव्य की समानांतर संरचना स्पष्ट की गई है।
