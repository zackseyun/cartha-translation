language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֚ף חֹבֵ֣ב עַמִּ֔ים כָּל קְדֹשָׁ֖י/ו בְּ/יָדֶ֑/ךָ וְ/הֵם֙ תֻּכּ֣וּ לְ/רַגְלֶ֔/ךָ יִשָּׂ֖א מִ/דַּבְּרֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: hi
  text: निश्चय ही वह लोगों से प्रेम करता है; उसके सभी पवित्र जन तेरे हाथ में हैं। वे तेरे चरणों के पास बैठते हैं[a]; प्रत्येक तेरे वचनों को ग्रहण करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ अनिश्चित है; इसका अनुवाद ‘वे इकट्ठे हुए’, ‘वे दुबककर बैठे’ या यहाँ तक कि ‘वे मार गिराए गए’ भी किया गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘प्रत्येक तेरे वचनों में से लेता है’ अथवा ‘तेरे कथनों को वहन करता है’; इब्रानी अभिव्यक्ति दुर्लभ और कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ यह शब्द कथन पर बल देने वाला निश्चयार्थक अव्यय है; ‘निश्चय ही’ उसके emphatic भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: חֹבֵב
  choice: प्रेम करता है
  rationale: कृदन्त रूप निरन्तर स्वभाव या प्रवृत्ति दिखाता है; वर्तमानकालीन ‘प्रेम करता है’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों
  rationale: बहुवचन का सामूहिक अर्थ बनाए रखता है और इसे केवल गैर-इस्राएली राष्ट्रों तक सीमित नहीं करता।
- source_word: כָּל קְדֹשָׁיו
  choice: उसके सभी पवित्र जन
  rationale: ‘पवित्र जन’ अलग किए हुए पवित्र लोगों या प्राणियों के व्यापक अर्थ को बनाए रखता है और इसे केवल स्वर्गदूतों अथवा इस्राएल तक सीमित नहीं करता।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: मूल रूपक को सुरक्षित रखते हुए संरक्षण, अधिकार या सामर्थ्य के सम्भावित भावों को खुला रखता है।
- source_word: תֻּכּוּ
  choice: बैठते हैं
  rationale: यह अत्यन्त कठिन रूप है; चरणों के पास होने और वचन ग्रहण करने के प्रसंग में बैठने या झुककर बैठने का अर्थ सर्वाधिक संगत प्रतीत होता है, पर अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: לְרַגְלֶךָ
  choice: तेरे चरणों के पास
  rationale: यह हिन्दी में सम्मानपूर्ण और स्वाभाविक है तथा सुनने या अधीनता की मुद्रा के चित्र को बनाए रखता है।
- source_word: יִשָּׂא
  choice: ग्रहण करता है
  rationale: मूल क्रिया का सामान्य अर्थ उठाना या वहन करना है, पर यहाँ वचनों के साथ ‘ग्रहण करना’ प्रसंगानुकूल है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מִדַּבְּרֹתֶיךָ
  choice: तेरे वचनों को
  rationale: यह दुर्लभ और कठिन अभिव्यक्ति वाणी या कथनों की ओर संकेत करती है। ‘वचनों’ से गरिमामय और स्पष्ट हिन्दी मिलती है; उपसर्ग מִן के सम्भावित अंशवाचक अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: काव्य में पुरुषवाचक सर्वनामों का परिवर्तन
  choice: ‘वह… उसके… तेरे…’ के रूप में इब्रानी का परिवर्तन बनाए रखा गया है।
  alternative: सभी सर्वनामों को केवल अन्य पुरुष अथवा केवल मध्यम पुरुष में एकरूप करना।
  rationale: मूल कविता में पुरुष का परिवर्तन एक वास्तविक पाठगत विशेषता है। उसे समतल करना व्याख्यात्मक निर्णय को पाठ में आरोपित करता।
- issue: ‘पवित्र जन’ का अभिप्राय
  choice: व्यापक ‘पवित्र जन’ रखा गया है।
  alternative: इसे विशेष रूप से ‘स्वर्गदूत’, ‘सन्त’ या ‘इस्राएल की पवित्र प्रजा’ कहना।
  rationale: प्रसंग किसी एक पहचान को निर्णायक रूप से स्थापित नहीं करता; व्यापक शब्दावली मूल की धार्मिक अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। परमेश्वर को सम्बोधित एकवचन निकटता-सूचक ‘तेरे’ मूल के द्वितीय पुरुष एकवचन को स्पष्ट रखता है। ‘चरणों’ और ‘वचनों’ से काव्यात्मक तथा शास्त्रीय गरिमा बनी रहती है, जबकि वाक्य-विन्यास आधुनिक और सरल है।
