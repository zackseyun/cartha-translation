source:
  edition: WLC
  text: וְ/לִ/זְבוּלֻ֣ן אָמַ֔ר שְׂמַ֥ח זְבוּלֻ֖ן בְּ/צֵאתֶ֑/ךָ וְ/יִשָּׂשכָ֖ר בְּ/אֹהָלֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: hi
  text: 'और जबूलून के विषय में उसने कहा,


    “हे जबूलून, बाहर जाते समय[a] आनन्दित हो,

    और हे इस्साकार, अपने तम्बुओं में आनन्दित हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बाहर जाने में।” इब्रानी अभिव्यक्ति जबूलून की गतिविधियों या समृद्धि के क्षेत्र का भी संकेत कर सकती है।
    reason: बְּצֵאתֶךָ के समयसूचक और व्यापक परिस्थितिसूचक/क्रियाक्षेत्र संबंधी अर्थों को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: और जबूलून के विषय में
  rationale: संयोजक और לְ अगली गोत्रीय आशीष का परिचय देते हैं। ‘के विषय में’ आधुनिक हिन्दी में स्वाभाविक है और सम्बोधन से पहले कथन की विषयवस्तु स्पष्ट करता है।
- source_word: אָמַר
  choice: उसने कहा
  rationale: यह सामान्य कथन-परिचायक क्रिया है; ‘कहा’ स्रोत के सीधे और सादे रूप को बनाए रखता है।
- source_word: שְׂמַח
  choice: आनन्द मना
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप दोनों गोत्रों के सामूहिक व्यक्तित्व को सम्बोधित करता है। ‘आनन्द मना’ आशीष के उल्लासपूर्ण और गरिमापूर्ण स्वर को व्यक्त करता है।
- source_word: זְבוּלֻן
  choice: जबूलून
  rationale: गोत्रनाम का हिन्दी बाइबलीय लिप्यन्तरण किया गया है।
- source_word: בְּ/צֵאתֶךָ
  choice: अपने बाहर जाने में
  rationale: בְ के साथ धात्वर्थक संज्ञा शाब्दिक रूप से ‘तेरे बाहर जाने में’ है। यह गतिविधि, प्रस्थान या उनसे जुड़ी समृद्धि की ओर संकेत कर सकता है; ठोस स्रोत-चित्र और ‘तम्बुओं में’ के साथ समानांतरता बनाए रखी गई है।
- source_word: וְ/יִשָּׂשכָר
  choice: और हे इस्साकार
  rationale: दूसरे गोत्र को पहले के साथ जोड़ते हुए प्रत्यक्ष सम्बोधन हिन्दी में ‘हे’ द्वारा स्पष्ट किया गया है।
- source_word: בְּ/אֹהָלֶיךָ
  choice: अपने तम्बुओं में
  rationale: इब्रानी बहुवचन और उसके ठोस चित्र को सुरक्षित रखा गया है। ‘घर में’ अधिक व्याख्यात्मक होता और ‘बाहर जाने’ के साथ स्रोत की समानांतरता को घटाता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता स्पष्ट करने के लिए दूसरे खंड में निहित आज्ञा ‘आनन्द मना’ दोहराई गई है; इब्रानी में यह पहले खंड से समझी जाती है। ‘बाहर जाने’ की सम्भावित अर्थ-व्याप्ति को किसी विशिष्ट व्यवसाय, युद्ध या व्यापार तक सीमित नहीं किया गया है।
