  text: וְ/יָדַעְתָּ֣ הַ/יּ֗וֹם כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ הֽוּא הָ/עֹבֵ֤ר לְ/פָנֶ֨י/ךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛/ם וְ/ה֥וּא יַכְנִיעֵ֖/ם לְ/פָנֶ֑י/ךָ וְ/הֽוֹרַשְׁתָּ֤/ם וְ/הַֽאַבַדְתָּ/ם֙ מַהֵ֔ר כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/003.yaml
  text: So know today that Yahweh your God is the one crossing over before you[a], a consuming fire. He will destroy them, and he will subdue them before you; and you will dispossess them and make them perish quickly[d][c][b], just as Yahweh has spoken to you.
translation:
  language: hi
  text: इसलिए आज जान लो कि याहवे, तुम्हारा परमेश्वर, स्वयं तुम्हारे आगे-आगे पार जा रहा है[a]। वह भस्म करने वाली आग है[b]। वही उनका नाश करेगा और तुम्हारे सामने उन्हें अधीन कर देगा। तब तुम उन्हें बेदखल करोगे[c] और शीघ्र ही उनका अंत कर दोगे, जैसा याहवे ने तुमसे कहा था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे आगे-आगे जा रहा है।” इब्रानी कृदंत याहवे को इस्राएल से आगे पार जानेवाले के रूप में चित्रित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “निगलने वाली आग।”
    reason: lexical_alternative
  - marker: c
    text: या “तुम उन्हें खदेड़ दोगे।” इब्रानी क्रिया में उन्हें भूमि और अधिकार से वंचित करने का भाव भी है।
    reason: lexical_alternative
  - marker: d
    text: या “जैसा याहवे ने तुमसे कहा।” आशय यह है कि यह याहवे के पहले कहे हुए वचन के अनुसार होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: इसलिए आज जान लो
  rationale: संयोजक וְ पिछले प्रसंग से निष्कर्षात्मक संबंध रखता है, और क्रिया यहाँ सीधे संबोधन में आग्रह का भाव देती है। यह रूप उस संबंध और आदेशात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर
  rationale: एकवचन पुरुष को संबोधित वाचा-संबंधी पदबंध का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: הוּא הָעֹבֵר לְפָנֶיךָ
  choice: ही तुम्हारे आगे पार जा रहा है
  rationale: הוּא का बल ‘ही’ से और वर्तमान कृदंत की सजीव, जारी क्रिया ‘जा रहा है’ से व्यक्त होती है। ‘पार’ भूमि में इस्राएल के प्रवेश से जुड़ी עבר की ठोस छवि बनाए रखता है।
- source_word: אֵשׁ אֹכְלָה
  choice: भस्म करनेवाली आग
  rationale: यह अभिव्यक्ति आग की निगलने या नष्ट कर देने वाली शक्ति को स्वाभाविक हिन्दी में व्यक्त करती है और ईश्वरीय न्याय की प्रबल उपमा को नरम नहीं करती।
- source_word: יַשְׁמִידֵם
  choice: उनका नाश करेगा
  rationale: שׁמד के हिफ़ील का विनाशकारी अर्थ स्पष्ट रहता है, बिना आधुनिक तकनीकी अर्थ आरोपित किए।
- source_word: יַכְנִיעֵם
  choice: उन्हें दबा देगा
  rationale: युद्ध के प्रसंग में כנע का आशय विरोधियों को नीचा या अधीन कर देना है; ‘दबा देगा’ साधारण आधुनिक हिन्दी में इस सैन्य परिणाम को स्पष्ट करता है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे सामने
  rationale: स्थानगत और युद्ध-संबंधी भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהוֹרַשְׁתָּם
  choice: उन्हें उनके अधिकार से बेदखल करोगे
  rationale: ירשׁ के हिफ़ील में केवल खदेड़ने से अधिक भूमि और अधिकार से वंचित करने का क्षेत्रीय भाव है; विस्तृत हिन्दी रूप इसे स्पष्ट करता है।
- source_word: וְהַאֲבַדְתָּם
  choice: उनका अंत कर दोगे
  rationale: אבד के हिफ़ील का कारक विनाशार्थ व्यक्त होता है और पहले आए שׁמד के अनुवाद ‘नाश करेगा’ से शब्दगत भेद भी बना रहता है।
- source_word: מַהֵר
  choice: शीघ्र ही
  rationale: यह परिणाम की तीव्रता या शीघ्रता बताता है; ‘शीघ्र ही’ गरिमापूर्ण और सहज है, तथा इससे अनावश्यक रूप से ‘एक ही बार में’ का अर्थ नहीं निकलता।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה לָךְ
  choice: ठीक वैसे ही जैसे याहवे ने तुमसे कहा था
  rationale: पूर्व में कहे गए ईश्वरीय वचन का भाव सुरक्षित है; ‘प्रतिज्ञा की’ कहकर मूल के सामान्य דִּבֶּר को अधिक विशिष्ट नहीं बनाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ उस नाम को शीर्षक में बदले बिना प्रस्तुत करता है।
- issue: אֵשׁ אֹכְלָה में ईश्वरीय युद्ध और न्याय की उपमा
  choice: भस्म करनेवाली आग
  alternative: निगलनेवाली आग
  rationale: मूल की तीखी विनाशकारी उपमा को बनाए रखा गया है; इसे न तो शाब्दिक भौतिक वर्णन में सीमित किया गया, न कोमल व्याख्या से कमज़ोर किया गया।
- issue: ईश्वरीय कार्य और इस्राएल के कार्य का साथ-साथ कथन
  choice: याहवे नाश और दमन करता है; फिर इस्राएल बेदखल करके अंत करता है
  alternative: सारी कार्रवाई केवल ईश्वर या केवल इस्राएल को सौंपना
  rationale: पद जानबूझकर दोनों कर्ताओं की भूमिका साथ रखता है। अनुवाद इस तनाव को किसी व्यवस्थित धार्मिक व्याख्या से हल नहीं करता।
- issue: מַהֵר की समय-संबंधी शक्ति
  choice: शीघ्र ही
  alternative: तुरंत; तेज़ी से
  rationale: यह रूप शीघ्र परिणाम का अर्थ रखता है, पर इसे अनिवार्यतः एक क्षण में पूर्ण संहार के दावे में नहीं बदलता।
