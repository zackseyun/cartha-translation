  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधे संबोधन वाला रूप अपनाया गया है। युद्ध और न्याय की कठोर भाषा को नरम नहीं किया गया, पर अनावश्यक आधुनिक तकनीकी शब्दावली से बचा गया है। ‘तुम’ मूल के एकवचन सामूहिक संबोधन को स्वाभाविक हिन्दी में दर्शाता है।
