source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: hi
  text: इसलिए मैं याहवे के सामने चालीस दिन और चालीस रात तक मुँह के बल पड़ा रहा—वे ही चालीस दिन और चालीस रात जिनमें मैं पड़ा रहा—क्योंकि याहवे ने कहा था कि वह तुम्हें नष्ट कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְנַפַּל / הִתְנַפָּלְתִּי
  choice: इसलिए मैं … मुँह के बल पड़ा रहा
  rationale: נפל के हित्पएल रूप यहाँ मूसा के अपने को भूमि पर डालकर विनती करने और उस दशा में बने रहने को व्यक्त करते हैं। ‘मुँह के बल पड़ा रहा’ आधुनिक हिन्दी में इस शारीरिक मुद्रा और अवधि, दोनों को स्वाभाविक रूप से बताता है। आरम्भिक ו को प्रसंगानुसार परिणामसूचक ‘इसलिए’ से व्यक्त किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי उपस्थिति या सम्मुख होने का भाव देता है; परमेश्वर के विशिष्ट वाचा-नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है।
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: चालीस दिन और चालीस रात तक … पड़ा रहा
  rationale: दोनों אֵת अवधि-सूचक हैं। इब्रानी की पुनरुक्त सापेक्ष उपवाक्य-रचना को हिन्दी में क्रिया ‘पड़ा रहा’ और ‘तक’ के साथ समेटा गया है, जिससे पूरी अवधि स्पष्ट रहती है और अस्वाभाविक पुनरावृत्ति नहीं आती।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह मूसा के याहवे के सामने पड़े रहने का कारण प्रस्तुत करता है।
- source_word: אָמַר יְהוָה לְהַשְׁמִיד אֶתְכֶם
  choice: याहवे ने कहा था कि वह तुम्हें नष्ट कर देगा
  rationale: אָמַר का कार्य मुख्य घटना से पहले हुआ था, इसलिए ‘कहा था’ उपयुक्त है। לְהַשְׁמִיד आशयित विनाश को दर्शाता है; ‘नष्ट कर देगा’ इसे स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה दो बार है। ‘याहवे’ नाम को उपाधि में बदले बिना और उसके नामात्मक स्वरूप को बनाए रखता है।
- issue: मूसा की मुद्रा और मध्यस्थ विनती
  choice: मुँह के बल पड़ा रहा
  alternative: गिर पड़ा / दण्डवत पड़ा रहा
  rationale: पाठ विनती की मुद्रा को संकेतित करता है, पर यहाँ प्रार्थना या मध्यस्थता जैसे शब्द सीधे जोड़ना उचित नहीं। चुना हुआ रूप मुद्रा और दीर्घ अवधि को व्यक्त करता है, बिना अतिरिक्त धार्मिक अर्थ थोपे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुँह के बल पड़ा रहा’ सामान्य पाठक के लिए स्पष्ट है; पादटिप्पणी में अधिक धार्मिक-औपचारिक ‘दण्डवत’ दिया गया है।
