id: DEU.9.12
reference: Deuteronomy 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: hi
  text: तब यहोवा ने मुझसे कहा, “उठ, यहाँ से जल्दी नीचे जा, क्योंकि तेरे लोग, जिन्हें तू मिस्र से निकाल लाया है, भ्रष्ट हो गए हैं। वे उस मार्ग से जल्दी ही भटक गए हैं जिस पर चलने की आज्ञा मैंने उन्हें दी थी। उन्होंने अपने लिए एक ढली हुई मूर्ति[a] बना ली है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धातु को पिघलाकर साँचे में ढाली गई प्रतिमा।” हिब्रू शब्द धातु ढालकर बनाई गई मूर्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य हिन्दी बाइबल परंपरा में पहचाने जाने योग्य रूप में सुरक्षित रखता है।
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: उठ, यहाँ से जल्दी नीचे जा
  rationale: आज्ञाओं की आकस्मिकता, स्थान-सूचक भाव और नीचे जाने की दिशा—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁחֵת
  choice: भ्रष्ट हो गए हैं
  rationale: इस प्रसंग में क्रिया नैतिक और धार्मिक भ्रष्टता बताती है; यह हिन्दी में स्वाभाविक है और कर्मवाचक 'भ्रष्ट किए गए' का गलत संकेत नहीं देती।
- source_word: עַמְּךָ אֲשֶׁר הוֹצֵאתָ מִמִּצְרָיִם
  choice: तेरे लोग, जिन्हें तू मिस्र से निकाल लाया है
  rationale: मूसा के प्रति परमेश्वर के तीखे संबोधन और उसमें निहित अलंकारिक दूरी को नरम किए बिना सुरक्षित रखता है।
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: वे उस मार्ग से जल्दी ही भटक गए हैं
  rationale: निर्धारित मार्ग से हटने के रूपक को रखता है और מַהֵר की पुनरावृत्ति को भी व्यक्त करता है।
- source_word: אֲשֶׁר צִוִּיתִם
  choice: जिस पर चलने की आज्ञा मैंने उन्हें दी थी
  rationale: हिब्रू में 'मार्ग' और लोगों को दी गई आज्ञा का संबंध हिन्दी में स्पष्ट और स्वाभाविक करता है; 'चलने' का भाव रूपक से निहित है।
- source_word: מַסֵּכָה
  choice: धातु ढालकर एक मूर्ति
  rationale: शब्द केवल सामान्य मूर्ति नहीं, ढली हुई धातु की प्रतिमा का संकेत देता है; मुख्य पाठ में इसकी ठोस निर्माण-विधि स्पष्ट की गई है।
theological_decisions:
- issue: '''तेरे लोग, जिन्हें तू मिस्र से निकाल लाया है'' में अलंकारिक दूरी'
  choice: मूल संबोधन को ज्यों का त्यों रखा
  alternative: '''मेरे लोग'' अथवा केवल ''लोग'''
  rationale: हिब्रू में परमेश्वर मूसा से 'तेरे लोग' और 'तू निकाल लाया' कहते हैं; यह फटकार का तनाव है, जिसे समझाकर या नरम करके हटाना उचित नहीं।
- issue: שִׁחֵת में भ्रष्टता का स्वरूप
  choice: भ्रष्ट हो गए हैं
  alternative: भ्रष्ट आचरण किया है / अपने आपको भ्रष्ट कर लिया है
  rationale: यह चुनाव नैतिक पतन को व्यक्त करता है और हिन्दी में स्वाभाविक है, जबकि क्रिया में संभव कारक/परिणामी सूक्ष्मता को किसी एक कठोर व्याख्या तक सीमित नहीं करता।
- issue: מַסֵּכָה का मूर्तिपूजा-संबंधी अर्थ
  choice: धातु ढालकर एक मूर्ति
  alternative: मूर्ति / ढली हुई मूर्ति / बुत
  rationale: सामान्य 'मूर्ति' से अधिक ठोस रूप में हिब्रू द्वारा बताई निर्माण-विधि को बचाता है, पर पाठ में केवल 'बुत' कहकर व्याख्यात्मक विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। मूसा से एकवचन निकट संबोधन के कारण 'तू/तेरे' रखा गया है। मַהֵר की दोनों उपस्थितियों को 'जल्दी' द्वारा सुरक्षित रखा गया है। फुटनोट चिह्न को उस पदांश के बाद रखा गया है जिसे वह स्पष्ट करता है।
