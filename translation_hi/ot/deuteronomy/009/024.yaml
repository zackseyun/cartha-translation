    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: विद्रोह करते आए हो
  rationale: मूल מרה परमेश्वर के अधिकार का विरोध करने और विद्रोही बने रहने का भाव व्यक्त करता है। הֱיִיתֶם के साथ यह इस्राएल के लगातार आचरण का सार है; हिंदी में यह प्रयोग स्वाभाविक रूप से उस निरंतरता को व्यक्त करता है।
- source_word: הֱיִיתֶם
  choice: करते आए हो
  rationale: Qal perfect 2mp यहाँ अतीत से वक्ता के वर्तमान तक चले आए आचरण का सिंहावलोकन करता है। संयुक्त हिंदी क्रिया वर्तमान तक निरंतरता बनाए रखती है।
- source_word: עִם
  choice: के विरुद्ध
  rationale: शाब्दिक अर्थ ‘के साथ’ है, किंतु מרה के संदर्भ में यह विरोधी संबंध दर्शाता है। ‘के विरुद्ध’ हिंदी में आशय स्पष्ट और मुहावरेदार ढंग से देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित प्रतिलेखन ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: מִיּוֹם
  choice: जिस दिन से … उस दिन से
  rationale: यह आरोप के आरंभ-बिंदु को चिह्नित करता है। सहसंबंधी हिंदी रचना मूल के ‘उस दिन से’ वाले कालगत बल को स्वाभाविक बनाती है।
- source_word: דַּעְתִּי אֶתְכֶם
  choice: मैं तुम्हें जानता हूँ
  rationale: ידע का सीधा अर्थ ‘जानना’ रखा गया है। प्रसंग में यह मूसा के इस्राएल से परिचित होने के आरंभ को सूचित करता है; अनावश्यक रूप से ‘पहचानने लगा’ कहकर अर्थ को संकरा नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया।
- issue: עִם का संबंधगत अर्थ
  choice: के विरुद्ध
  alternative: के साथ
  rationale: ‘के साथ’ मूल पूर्वसर्ग का अधिक शाब्दिक रूप है, पर מרה के साथ उसका आशय यहोवा का विरोध करना है। ‘के विरुद्ध’ उस आशय को स्पष्ट करता है, बिना आरोप की तीव्रता बढ़ाए।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गंभीर और सार्वजनिक पाठ के योग्य शैली। बहुवचन ‘तुम’ मूल के 2mp को व्यक्त करता है। वाक्य-विन्यास हिंदी में स्वाभाविक बनाने के लिए कालवाचक खंड पहले रखा गया है।
