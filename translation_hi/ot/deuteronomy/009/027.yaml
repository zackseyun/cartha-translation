base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/027.yaml
  text: Remember your servants[a], Abraham, Isaac, and Jacob. Do not turn your attention to the stubbornness of this people, or to their wickedness[b], or to their sin.
translation:
  language: hi
  text: अपने सेवकों—अब्राहम, इसहाक और याकूब—को स्मरण कर। इस प्रजा के हठ[a], उसकी दुष्टता और उसके पाप पर ध्यान न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कठोरता’ अथवा ‘हठधर्मिता’। यहाँ वह अलग इब्रानी मुहावरा नहीं है जिसका शाब्दिक अर्थ ‘हठीली गर्दन’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘की ओर न फिर’; अर्थात उस पर ध्यान न दे या उसका विचार न कर।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: स्मरण कर
  rationale: परमेश्वर से की जा रही मूसा की विनती में यह एकवचन आज्ञार्थक है। ‘स्मरण कर’ वाचा-संबंधी प्रार्थना के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: לַעֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: यहाँ עבד कुलपिताओं के लिए परमेश्वर के साथ उनके आदरपूर्ण संबंध को व्यक्त करता है; ‘सेवक’ इस संदर्भ में ‘दास’ से अधिक उपयुक्त है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब
  rationale: नामों के प्रचलित मानक हिन्दी रूप लिए गए हैं; दीर्घ विराम-चिह्न इन्हें ‘सेवकों’ के समानाधिकरण के रूप में स्पष्ट करता है।
- source_word: אַל תֵּפֶן אֶל
  choice: पर ध्यान न दे
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘की ओर न मुड़’ है, पर इस प्रार्थना में आशय किसी बात पर ध्यान या विचार न देने का है। हिन्दी में ‘पर ध्यान न दे’ इसे सहज रूप से व्यक्त करता है।
- source_word: קְשִׁי
  choice: हठधर्मिता
  rationale: संज्ञा का अर्थ कठोरता या हठ है। ‘हठधर्मिता’ यहाँ प्रजा के नैतिक रूप से अड़ियल व्यवहार को स्पष्ट करती है, बिना उस अलग इब्रानी मुहावरे को आयात किए जिसका अर्थ ‘हठीली गर्दन’ है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: עם के सामुदायिक अर्थ और संकेतवाचक ‘इस’ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רִשְׁעוֹ
  choice: उसकी दुष्टता
  rationale: एकवचन प्रत्यय सामूहिक संज्ञा ‘प्रजा’ की ओर संकेत करता है। हिन्दी में ‘प्रजा’ व्याकरणतः एकवचन है, इसलिए ‘उसकी’ मूल रूप के साथ भी मेल रखता है।
- source_word: חַטָּאתוֹ
  choice: उसके पाप
  rationale: एकवचन प्रत्यय सामूहिक ‘प्रजा’ से संबंधित है। ‘पाप’ यहाँ ठोस नैतिक अपराध का अर्थ बनाए रखता है।
theological_decisions:
- issue: कुलपिताओं के लिए עבד का अनुवाद
  choice: अपने सेवकों
  alternative: अपने दासों
  rationale: यह शब्द यहाँ अब्राहम, इसहाक और याकूब के लिए वाचा-संबंधी आदरसूचक पद है; बंधुआ स्थिति पर बल देना प्रसंग का उद्देश्य नहीं है।
- issue: प्रजा से जुड़े एकवचन प्रत्यय
  choice: उसकी दुष्टता ... उसके पाप
  alternative: उनकी दुष्टता ... उनके पाप
  rationale: इब्रानी में प्रत्यय एकवचन हैं और ‘प्रजा’ सामूहिक संज्ञा है। मानक हिन्दी में ‘इस प्रजा ... उसकी ... उसके’ स्वाभाविक है और सामूहिक संदर्भ को बदले बिना मूल व्याकरणिक संबंध को सुरक्षित रखता है।
- issue: परमेश्वर से ‘ध्यान न देने’ की विनती
  choice: पर ध्यान न दे
  alternative: की ओर न फिर
  rationale: यह निवेदन परमेश्वर से प्रजा के पाप को आधार बनाकर उसके विरुद्ध कार्रवाई न करने की प्रार्थना है। अनुवाद मूल के रूपक का आशय देता है, पर यह तय नहीं करता कि ‘स्मरण’ या ‘ध्यान न देना’ परमेश्वर में मानवीय विस्मृति अथवा अज्ञान को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल प्रार्थनात्मक शैली रखी गई है। परमेश्वर को संबोधित एकवचन क्रियाएँ ‘स्मरण कर’ और ‘ध्यान न दे’ मूल के सीधे, निकट संबोधन को बनाए रखती हैं।
