  edition: WLC
  text: וָ/אֶתְפַּלֵּ֣ל אֶל יְהוָה֮ וָ/אֹמַר֒ אֲדֹנָ֣/י יְהוִ֗ה אַל תַּשְׁחֵ֤ת עַמְּ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּ/גָדְלֶ֑/ךָ אֲשֶׁר הוֹצֵ֥אתָ מִ/מִּצְרַ֖יִם בְּ/יָ֥ד חֲזָקָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/026.yaml
  text: So I prayed to Yahweh and said[a], “Lord GOD, do not destroy your people and your inheritance, whom you redeemed by your greatness[b], whom you brought out of Egypt with a strong hand.”
translation:
  language: hi
  text: तब मैंने याहवे से प्रार्थना की और कहा, “हे प्रभु याहवे[a], अपनी प्रजा और अपनी विरासत को नष्ट न कीजिए, जिन्हें आपने अपनी महानता से छुड़ाया है, जिन्हें आपने अपने शक्तिशाली हाथ से मिस्र से निकाल लाए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘अदोनाय याहवे’—‘प्रभु याहवे’।'
    reason: मूल संयुक्त ईश्वरीय उपाधि को स्पष्ट करना।
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל אֶל יְהוָה וָאֹמַר
  choice: तब मैंने याहवे से प्रार्थना की और कहा
  rationale: क्रमसूचक वाव को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है; אֶל के साथ प्रार्थना का लक्ष्य ‘याहवे से’ रखा गया है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु याहवे
  rationale: 'संयुक्त संबोधन के दोनों तत्त्व सुरक्षित रखे गए हैं: אֲדֹנָי ‘प्रभु’ और יהוה ‘याहवे’।'
- source_word: אַל תַּשְׁחֵת
  choice: नष्ट न कीजिए
  rationale: निषेधात्मक विनती की गंभीरता को बनाए रखते हुए आधुनिक सम्मानसूचक हिन्दी अपनाई गई है।
- source_word: עַמְּךָ וְנַחֲלָתְךָ
  choice: अपनी प्रजा और अपनी विरासत
  rationale: ‘प्रजा’ परमेश्वर से संबंधित जनसमुदाय को और ‘विरासत’ נַחֲלָה के उत्तराधिकार/निज भाग संबंधी वाचा-भाव को व्यक्त करती है।
- source_word: אֲשֶׁר פָּדִיתָ בְּגָדְלֶךָ
  choice: इन्हें आपने अपनी महानता के द्वारा छुड़ाया
  rationale: פדה को निर्गमन-संदर्भ में ‘छुड़ाया’ और גֹּדֶל को बिना ‘शक्ति’ जोड़कर ‘महानता’ अनूदित किया गया है। बहुवचन ‘इन्हें’ हिन्दी में ‘प्रजा और विरासत’ के एक ही लोगों की दोहरी पहचान को स्वाभाविक रूप से समेटता है।
- source_word: אֲשֶׁר הוֹצֵאתָ מִמִּצְרַיִם בְּיָד חֲזָקָה
  choice: अपने शक्तिशाली हाथ से मिस्र से निकाल लाए हैं
  rationale: निर्गमन के प्रचलित सूत्र ‘मिस्र से निकाल लाना’ को रखा गया है; יָד חֲזָקָה का स्वाभाविक और निकट अर्थ ‘शक्तिशाली हाथ’ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का लिप्यंतरण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी व्यंजन-नाम יהוה को एक व्यक्तिगत वाचा-नाम के रूप में स्पष्ट रखा गया है; इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया।
- issue: ‘प्रजा’ और ‘विरासत’ का संबंध
  choice: दोनों पदों को बनाए रखते हुए बाद में ‘इन्हें’
  alternative: एकवचन ‘जिसे’
  rationale: इब्रानी में दोनों संज्ञाएँ एक ही समुदाय का समानाधिकरणात्मक वर्णन करती हैं। हिन्दी में ‘इन्हें’ दोनों पदों को समेटता है, बिना दो अलग समूह मानने के।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर के लिए ‘आप’ के क्रियारूप प्रयुक्त हुए हैं; इससे इब्रानी के द्वितीय पुरुष एकवचन का सामाजिक स्तर निर्धारित नहीं किया जाता, बल्कि स्वाभाविक आधुनिक हिन्दी सम्मान व्यक्त होता है।
