  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पटियाएँ’ और ‘वाचा’ बाइबलीय संदर्भ के परिचित तथा सटीक शब्द हैं; वाक्य में बार-बार आया ‘और’ इब्रानी कथन-शैली को जानबूझकर कुछ हद तक सुरक्षित रखता है।
