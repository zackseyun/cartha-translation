base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/015.yaml
  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: hi
  text: तब मैं मुड़ा और पर्वत से नीचे उतरा, और पर्वत आग में धधक रहा था,[a] और वाचा की दोनों पटियाएँ मेरे दोनों हाथों में थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस खंड का अनुवाद ‘जब पर्वत आग में धधक रहा था’ भी किया जा सकता है। इब्रानी में सामान्य संयोजक ‘और’ है, जो संदर्भ में साथ-साथ हो रही परिस्थिति को भी व्यक्त कर सकता है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: ‘मेरे दोनों हाथों पर थीं।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: तब मैं मुड़ा
  rationale: דרךिक कथानक में wayyiqtol क्रमिक अगली क्रिया बताता है। ‘तब’ इस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है, और פנה का सीधा अर्थ ‘मुड़ना’ है।
- source_word: וָאֵרֵד מִן הָהָר
  choice: पर्वत से नीचे उतरा
  rationale: ירד नीचे जाने या उतरने को दर्शाता है, और הָהָר संदर्भ में उस निश्चित पर्वत को सूचित करता है जिस पर मूसा था।
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: और पर्वत आग में धधक रहा था
  rationale: मुख्य पाठ में וְ को ‘और’ रखकर इब्रानी का सामान्य समन्वय और उसकी संभावित परिस्थितिजन्य छाया दोनों खुली रखी गई हैं। בֹּעֵר की तीव्रता के लिए ‘धधक रहा था’ स्वाभाविक है और בָּאֵשׁ को ‘आग में’ स्पष्ट रूप से व्यक्त करता है।
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: और वाचा की दोनों पटियाएँ
  rationale: לֻחֹת यहाँ पत्थर की पटियाओं को और הַבְּרִית स्थापित ‘वाचा’ को दर्शाता है। ‘दोनों’ हिन्दी में द्वित्व को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל שְׁתֵּי יָדָי
  choice: मेरे दोनों हाथों में थीं
  rationale: עַל का मूल स्थानिक अर्थ ‘पर’ है, पर संदर्भ में मूसा पटियाएँ लिए हुए था; इसलिए ‘हाथों में’ सहज हिन्दी है। इब्रानी के स्पष्ट ‘दो’ को ‘दोनों’ से बनाए रखा गया है।
