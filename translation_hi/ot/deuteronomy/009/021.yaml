base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/021.yaml
  text: And I took your sin[a], the calf that you had made, and burned it with fire; then I crushed it, grinding it thoroughly until it was as fine as dust, and I threw its dust into the stream that comes down from the mountain.
translation:
  language: hi
  text: और मैंने तुम्हारे पाप को—उस बछड़े को, जिसे तुमने बनाया था—लिया और उसे आग में जला दिया। फिर मैंने उसे कूटा और अच्छी तरह पीसा, यहाँ तक कि वह धूल की तरह बारीक हो गया; और उसकी धूल उस जलधारा[a] में फेंक दी, जो पहाड़ से नीचे बहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नाला’; इब्रानी शब्द बहती धारा, बरसाती नाला या वादी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאתְכֶם
  choice: तुम्हारे पाप को
  rationale: यहाँ शब्द उस मूर्ति को इस्राएल के पाप का साकार रूप बताता है, पापबलि को नहीं। यह अनुवाद बछड़े और उनके पाप के बीच इब्रानी पाठ की कठोर पहचान को बनाए रखता है।
- source_word: הָעֵגֶל
  choice: उस बछड़े को
  rationale: मूल शब्द का सामान्य अर्थ ‘बछड़ा’ है और प्रसंग में सोने के बछड़े की ओर संकेत स्पष्ट है।
- source_word: וָאֶשְׂרֹף אֹתוֹ בָּאֵשׁ
  choice: आग में जला दिया
  rationale: इब्रानी प्रयोग का स्वाभाविक हिन्दी रूप है और आग द्वारा नष्ट किए जाने की ठोस क्रिया स्पष्ट रखता है।
- source_word: וָאֶכֹּת אֹתוֹ טָחוֹן הֵיטֵב
  choice: उसे कूटकर अच्छी तरह पीसा
  rationale: ‘कूटना’ प्रहार करके तोड़ने की क्रिया और ‘पीसना’ उसके बाद उसे अत्यन्त महीन करने की प्रक्रिया—दोनों को सुरक्षित रखता है।
- source_word: עַד אֲשֶׁר דַּק לְעָפָר
  choice: जब तक कि वह धूल के समान बारीक न हो गया
  rationale: यह मूर्ति को पीसने की सीमा और परिणाम दोनों व्यक्त करता है तथा דק और עפר की तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲפָרוֹ
  choice: उसकी धूल
  rationale: यह बछड़े के पीसे हुए अवशेषों को बताता है और पिछले वाक्यांश की ‘धूल’ से शब्दगत संबंध बनाए रखता है; इसे केवल ‘राख’ तक सीमित नहीं करता।
- source_word: הַנַּחַל
  choice: जलधारा
  rationale: नחל बहती धारा, बरसाती नाले या वादी को सूचित कर सकता है। पहाड़ से नीचे बहने के इस प्रसंग में ‘जलधारा’ आधुनिक हिन्दी में सहज और पर्याप्त रूप से व्यापक है।
- source_word: הַיֹּרֵד מִן הָהָר
  choice: जो पहाड़ से नीचे बहती है
  rationale: यह कृदन्त के चलते हुए वर्णनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बछड़े को केवल पापपूर्ण वस्तु न कहकर ‘तुम्हारा पाप’ कहना
  choice: 'मुख्य पाठ में इब्रानी की सीधी पहचान रखी गई है: ‘तुम्हारे पाप को—उस बछड़े को’।'
  alternative: ‘तुम्हारी पापपूर्ण वस्तु, उस बछड़े को’
  rationale: इब्रानी समानाधिकरण जानबूझकर कठोर है और मूर्ति को इस्राएल के पाप का मूर्त रूप बताता है। इसे नरम करने के बजाय मूल की धर्मवैचारिक तीव्रता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। डैश से ‘तुम्हारे पाप’ और ‘उस बछड़े’ का समानाधिकरण स्पष्ट किया गया है। ‘कूटकर…पीसा’ मूल की क्रमिक और तीव्र क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
