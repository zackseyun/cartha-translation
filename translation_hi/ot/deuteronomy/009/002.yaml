  text: עַֽם גָּד֥וֹל וָ/רָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֨עְתָּ֙ וְ/אַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִ/פְנֵ֖י בְּנֵ֥י עֲנָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: hi
  text: एक बड़ी और ऊँचे कद वाली जाति—अनाक के वंशज[a]—जिन्हें तुम जानते हो और जिनके विषय में तुमने सुना है कि, “अनाक के वंशजों के सामने कौन टिक सकता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अनाक के पुत्र।” इन्हें “अनाकी” भी कहा जा सकता है।
    reason: मूल इब्रानी की वंशसूचक अभिव्यक्ति और प्रचलित जातिनाम—दोनों को उपलब्ध कराना।
lexical_decisions:
- source_word: עַם
  choice: जाति
  rationale: यहाँ शब्द एक विशिष्ट जन-समूह को दर्शाता है; आधुनिक हिन्दी में ‘जाति’ इस प्रसंग में स्वाभाविक है, जबकि ‘लोग’ समूहगत पहचान को कम स्पष्ट करता।
- source_word: גָּדוֹל וָרָם
  choice: बड़ी और ऊँचे कद की
  rationale: גָּדוֹל समूह की विशालता/प्रभावशाली स्वरूप और רָם शारीरिक ऊँचाई व्यक्त करता है; ‘ऊँचे कद की’ हिन्दी में आशय स्पष्ट करता है।
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: अनाक के वंशज
  rationale: शाब्दिक रूप ‘अनाक के पुत्र’ है, पर यहाँ वंशगत जन-समूह अभिप्रेत है। ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पारिवारिक संबंध बनाए रखता है।
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: जिन्हें तुम जानते हो
  rationale: इब्रानी पूर्ण क्रिया यहाँ इस जन-समूह से इस्राएल की पहले से विदित परिचितता को सीधे व्यक्त करती है।
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: जिनके विषय में तुमने यह कहते सुना है
  rationale: यह रूप अगले उद्धरण से स्वाभाविक हिन्दी संबंध बनाता है और सुनी हुई प्रसिद्ध उक्ति का भाव सुरक्षित रखता है।
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: के सामने कौन टिक सकता है
  rationale: यह युद्धात्मक संदर्भ में किसी के सम्मुख डटे रहने या उसका सामना कर पाने का मुहावरा है; ‘टिक सकता है’ हिन्दी में उसकी आलंकारिक शक्ति रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए प्रसंगानुसार ‘तुम’; भाषा सहज पर गरिमापूर्ण। ‘ऊँचे कद’ और ‘टिक सकता है’ मूल अर्थ को सामान्य पाठक के लिए स्पष्ट करते हैं।
