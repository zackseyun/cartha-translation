source:
  edition: WLC
  text: וּ/בְ/חֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת יְהוָ֑ה וַ/יִּתְאַנַּ֧ף יְהוָ֛ה בָּ/כֶ֖ם לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/008.yaml
  text: Even at Horeb you provoked Yahweh to wrath[b][a], and Yahweh was angry with you enough to destroy you.
translation:
  language: hi
  text: होरेब में भी तुमने यहोवा को क्रोधित किया,[a] और यहोवा तुम पर इतना क्रोधित हुआ कि वह तुम्हें नष्ट करने को था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और होरेब में” अथवा “होरेब में”; इब्रानी संयोजक पिछले कथन को आगे बढ़ा सकता है, पर यहाँ सम्भवतः बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा तुम पर क्रोधित हुआ, ताकि तुम्हें नष्ट कर दे।” इब्रानी में यहोवा का क्रोध और विनाश का संकट सीधे जुड़े हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחֹרֵב
  choice: होरेब में भी
  rationale: וְ यहाँ पिछले प्रसंग को आगे बढ़ाते हुए बलसूचक अर्थ दे सकता है; ‘भी’ इस संदर्भ में स्वाभाविक है, जबकि केवल ‘और’ या बिना संयोजक के अनुवाद भी सम्भव है।
- source_word: הִקְצַפְתֶּם אֶת־יְהוָה
  choice: तुमने यहोवा को क्रोध दिलाया
  rationale: 'קצף के हिफ़ील रूप का कारणवाचक भाव सुरक्षित रहता है: लोगों ने यहोवा के क्रोध का कारण उत्पन्न किया।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיִּתְאַנַּף יְהוָה בָּכֶם
  choice: यहोवा तुम पर इतना क्रोधित हुआ
  rationale: אנף तीव्र क्रोध व्यक्त करता है; בָּכֶם का विरोधात्मक लक्ष्य ‘तुम पर’ से स्पष्ट होता है। ‘इतना’ अगले विनाशसूचक क्रियार्थक रूप से सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: कि तुम्हें नष्ट कर दे
  rationale: לְ के साथ हिफ़ील क्रियार्थक रूप क्रोध और सम्भावित/अभिप्रेत विनाश को सीधे जोड़ता है; ‘नष्ट कर दे’ गम्भीरता बनाए रखते हुए स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ को रखते हुए नाम को उपाधि में नहीं बदला गया।
- issue: क्रोध और विनाश के बीच सम्बन्ध
  choice: इतना क्रोधित हुआ कि तुम्हें नष्ट कर दे
  alternative: तुम पर क्रोधित हुआ, ताकि तुम्हें नष्ट कर दे
  rationale: इब्रानी לְ-युक्त क्रियार्थक रूप उद्देश्य या परिणाम दोनों की छाया रख सकता है। मुख्य पाठ स्वाभाविक हिन्दी में निकट सम्बन्ध दिखाता है, और पादटिप्पणी वैकल्पिक संरचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्रोध दिलाया’ कारणवाचक इब्रानी रूप को स्पष्ट करता है, और स्थान-नाम ‘होरेब’ पारम्परिक हिन्दी रूप में रखा गया है।
