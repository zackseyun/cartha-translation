  edition: WLC
  text: הֶ֤רֶף מִמֶּ֨/נִּי֙ וְ/אַשְׁמִידֵ֔/ם וְ/אֶמְחֶ֣ה אֶת שְׁמָ֔/ם מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם וְ/אֶֽעֱשֶׂה֙ אֽוֹתְ/ךָ֔ לְ/גוֹי עָצ֥וּם וָ/רָ֖ב מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: hi
  text: मुझे रहने दे[a], ताकि मैं उन्हें नष्ट कर दूँ और आकाश के नीचे से उनका नाम मिटा दूँ[b]; और मैं तुझसे एक ऐसा राष्ट्र बनाऊँगा जो उनसे अधिक शक्तिशाली और अधिक संख्या वाला होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे रहने दे, और मैं उन्हें नष्ट करके आकाश के नीचे से उनका नाम मिटा दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “आकाशों के नीचे से”; इसका आशय पृथ्वी पर से, अर्थात उनके अस्तित्व और स्मृति से, मिटा देना है।
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: मुझे छोड़ दे
  rationale: रפה का आज्ञार्थक रूप מן और सर्वनाम के साथ मुहावरे के रूप में पीछे हटने या हस्तक्षेप छोड़ने को कहता है। यह संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְאַשְׁמִידֵם
  choice: ताकि मैं उन्हें नष्ट कर दूँ
  rationale: आज्ञा के बाद वाव से जुड़ा क्रियारूप यहाँ उद्देश्य या परिणाम व्यक्त कर सकता है। ‘नष्ट कर दूँ’ שׁמד की तीव्रता को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: और ... उनका नाम मिटा दूँ
  rationale: מחה इस मुहावरे में नाम और स्मृति को मिटा देने का भाव रखता है; आधुनिक हिन्दी में ‘नाम मिटा देना’ स्वाभाविक और अर्थसटीक है।
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: आकाश के नीचे से
  rationale: हिब्रू में ‘आकाशों’ का बहुवचन है, पर मानक हिन्दी में ‘आकाश के नीचे से’ उसी स्थानगत और अस्तित्वगत भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: मैं तुझसे एक ... राष्ट्र बनाऊँगा
  rationale: עשה + कर्म + ל का रूप किसी व्यक्ति से कुछ बना देने का परिवर्तनकारी भाव रखता है। हिन्दी में ‘तुझसे ... राष्ट्र बनाऊँगा’ इस आशय को स्पष्ट करता है।
- source_word: עָצוּם
  choice: अधिक शक्तिशाली
  rationale: מִמֶּנּוּ के साथ यह तुलनात्मक अर्थ देता है; ‘अधिक शक्तिशाली’ सामर्थ्य की तुलना को स्पष्ट करता है।
- source_word: וָרָב
  choice: अधिक जनसंख्या वाला
  rationale: इस प्रसंग में רב राष्ट्र की संख्यात्मक विशालता बताता है। यह पदबंध साधारण पाठक के लिए ‘अधिक संख्या वाला’ की अपेक्षा सहज है।
- source_word: מִמֶּנּוּ
  choice: उनसे
  rationale: एकवचन प्रत्यय इस्राएल को सामूहिक राष्ट्र के रूप में संदर्भित करता है; हिन्दी में लोगों के सामूहिक संदर्भ के कारण ‘उनसे’ स्वाभाविक है।
theological_decisions:
- issue: न्याय की ईश्वरीय घोषणा और मूसा से अधिक महान राष्ट्र बनाने का कथन
  choice: कथन को कथा के भीतर वास्तविक और प्रत्यक्ष घोषणा के रूप में रखा गया है।
  alternative: इसे मुख्यतः अलंकारिक कथन या मूसा की परीक्षा मानकर अनुवाद में संकेत देना।
  rationale: हिब्रू पाठ न्याय और प्रतिज्ञा को सीधे ईश्वरीय वचन के रूप में प्रस्तुत करता है। अनुवाद इसकी धर्मवैचारिक तनावपूर्णता को बनाए रखता है और व्याख्यात्मक विवाद का समाधान पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। परमेश्वर द्वारा मूसा को संबोधन के लिए एकवचन निकट संबोधन ‘तू’ के रूप ‘दे’ और ‘तुझसे’ रखे गए हैं, जो बाइबिलीय संवाद में अंतरंग प्रत्यक्षता दिखाते हैं, अनादर नहीं।
