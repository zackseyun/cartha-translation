id: DEU.9.13
reference: Deuteronomy 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “मैंने इस प्रजा को देखा है[a]। देखो, यह अकड़ी हुई गर्दन वाली प्रजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने इस प्रजा को देखा।”
    reason: हिब्रू पूर्ण क्रिया רָאִיתִי को प्रसंग के अनुसार साधारण भूतकाल में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֵלַי
  choice: मुझसे
  rationale: बोलने के प्रसंग में हिन्दी का स्वाभाविक प्रयोग “मुझसे कहा” है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष रूप से अलग अनुवाद नहीं किया
  rationale: “कहा” के तुरंत बाद प्रत्यक्ष कथन आने से हिब्रू का कथन-परिचायक सूत्र हिन्दी में पूर्ण रूप से व्यक्त हो जाता है; “यह कहते हुए कहा” अनावश्यक और अस्वाभाविक होता।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: हिब्रू पूर्ण क्रिया यहाँ देखे हुए के आधार पर वर्तमान, सुनिश्चित आकलन का भाव दे सकती है; “देखा है” इस परिणामात्मक बल को बनाए रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: “प्रजा” सामूहिक एकवचन को बनाए रखती है और इस्राएली समुदाय के लिए वर्तमान हिन्दी में स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: देख
  rationale: הִנֵּה आगामी कथन की ओर जोर देकर ध्यान खींचता है; “देख” उसका संक्षिप्त और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: קְשֵׁה עֹרֶף
  choice: अकड़ी गर्दन वाली
  rationale: यह अनुवाद हठ और विद्रोह का अर्थ देते हुए मूल “कठोर/अकड़ी गर्दन” के रूपक को भी सुरक्षित रखता है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम सामूहिक एकवचन עַם से मेल खाता है; हिन्दी में “प्रजा” के साथ एकवचन “यह ... है” स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। उसे उपाधि “प्रभु” से बदलने के बजाय लिप्यंतरित किया गया है; “याहवे” उपलब्ध प्राचीन भाषाई साक्ष्य के अधिक निकट है।
- issue: कठोर गर्दन के रूपक का संरक्षण
  choice: अकड़ी गर्दन वाली प्रजा
  alternative: हठीली प्रजा
  rationale: “हठीली” अर्थ स्पष्ट करती है, पर मूल का सजीव रूपक मिटा देती है। चुना हुआ रूपक जानबूझकर विरोध न छोड़ने का भाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “प्रजा” सामूहिक एकवचन को स्वाभाविक हिन्दी में बनाए रखती है, और “अकड़ी गर्दन” मूल हिब्रू रूपक को बिना अत्यधिक पुरातन शब्दावली के सुरक्षित रखती है।
