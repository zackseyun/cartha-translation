id: DEU.9.10
reference: Deuteronomy 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֜ה אֵלַ֗/י אֶת שְׁנֵי֙ לוּחֹ֣ת הָֽ/אֲבָנִ֔ים כְּתֻבִ֖ים בְּ/אֶצְבַּ֣ע אֱלֹהִ֑ים וַ/עֲלֵי/הֶ֗ם כְּֽ/כָל הַ/דְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה עִמָּ/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֥וֹם הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/010.yaml
  text: And Yahweh gave me the two stone tablets[a], written with the finger of God[b], and on them were all the words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly.
translation:
  language: hi
  text: और यहोवा ने मुझे पत्थर की वे दो पटियाएँ दीं, जो परमेश्वर की उँगली से लिखी हुई थीं; और उन पर वे सभी वचन थे जो यहोवा ने सभा के दिन पर्वत पर आग के बीच से तुमसे कहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप द्वारा वाचा-संबंधी व्यक्तिवाचक नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखा गया है।
- source_word: שְׁנֵי לוּחֹת הָאֲבָנִים
  choice: पत्थर की वे दो पटियाएँ
  rationale: निर्माण-सामग्री और निश्चितता दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; 'वे' पूर्वप्रसंग में उल्लिखित पटियाओं की ओर संकेत करता है।
- source_word: כְּתֻבִים בְּאֶצְבַּע אֱלֹהִים
  choice: जो परमेश्वर की उँगली से लिखी हुई थीं
  rationale: कर्मवाच्य अर्थ और मूल के सजीव मानवाकार बिंब को बिना व्याख्यात्मक रूप से नरम किए सुरक्षित रखता है।
- source_word: כְּכָל הַדְּבָרִים
  choice: वे सभी वचन
  rationale: सन्दर्भ में דְּבָרִים ईश्वरीय कथनों को सूचित करता है; 'वचन' गरिमापूर्ण और स्पष्ट है, जबकि כְּ यहाँ विषयवस्तु की पूर्ण अनुरूपता दर्शाता है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה עִמָּכֶם
  choice: जो यहोवा ने ... तुमसे कहे थे
  rationale: עִם का मूल अर्थ 'साथ' है, पर हिन्दी में बोलने के साथ 'तुमसे कहना' स्वाभाविक रूप से संबोधित संवाद को व्यक्त करता है; 'कहे थे' पूर्वकालिक घटना को दिखाता है।
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: आग के बीच से
  rationale: מִתּוֹךְ की स्थानिक विशिष्टता को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּיוֹם הַקָּהָל
  choice: सभा के दिन
  rationale: קָהָל को एकत्रित इस्राएली समुदाय के रूप में औपचारिक किंतु सुबोध ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय कार्य के लिए मानवाकार अभिव्यक्ति
  choice: परमेश्वर की उँगली से
  alternative: परमेश्वर की सामर्थ्य से
  rationale: मूल पाठ स्पष्ट रूप से 'उँगली' कहता है; उसका अर्थ खोलकर बिंब और उससे जुड़ा धर्मवैचारिक तनाव मिटाना उचित नहीं।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिवाचक वाचा-नाम को उपाधि से प्रतिस्थापित नहीं किया गया; 'यहोवा' हिन्दी पाठकों में स्थापित लिप्यंतरण है।
- issue: דבר עם की संवादात्मक बारीकी
  choice: तुमसे कहे थे
  alternative: तुम्हारे साथ बातें की थीं
  rationale: मूल के עם में संवादात्मक रंग संभव है, किंतु इस प्रसंग में परमेश्वर द्वारा समुदाय को संबोधित करना अभिप्रेत है; चुना हुआ रूप स्वाभाविक हिन्दी में उस संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की लंबी इब्रानी संरचना को अर्धविराम से स्पष्ट किया गया है। मानवाकार भाषा और 'आग के बीच से' जैसे ठोस बिंब यथावत रखे गए हैं।
