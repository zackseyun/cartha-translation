lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: बीत जाने पर
  rationale: וַיְהִי यहाँ कथा को आगे बढ़ाता है और מִקֵּץ अवधि पूरी होने का समय बताता है। आधुनिक हिन्दी में संयुक्त अभिव्यक्ति ‘बीत जाने पर’ स्वाभाविक ढंग से यही अर्थ देती है।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: मूल की समानांतर समय-अभिव्यक्ति को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: נָתַן
  choice: दीं
  rationale: सामान्य क्रिया ‘देना’ मूल के सीधे अर्थ को बिना अतिरिक्त व्याख्या के व्यक्त करती है; स्त्रीलिंग बहुवचन ‘पटियाएँ’ के अनुसार रूप ‘दीं’ है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मुझे
  rationale: נתן के साथ אֵלַי को हिन्दी में स्वाभाविक अप्रत्यक्ष कर्म ‘मुझे’ के रूप में व्यक्त किया गया है।
- source_word: שְׁנֵי לֻחֹת הָאֲבָנִים
  choice: पत्थर की वे दो पटियाएँ
  rationale: ‘पत्थर की’ सामग्री-संबंध को स्पष्ट करता है और ‘वे दो’ प्रसंग में निर्दिष्ट जोड़े को व्यक्त करता है।
- source_word: לֻחוֹת הַבְּרִית
  choice: वाचा की पटियाएँ
  rationale: मूल में ‘पटियाएँ’ की पुनरावृत्ति एक व्याख्यात्मक पुनर्कथन है; इसे बनाए रखने से इन पटियाओं का वाचा-संबंध स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יְהוָה का प्रयोग करता है। ‘यहवे’ नाम को नाम ही रहने देता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: לֻחוֹת הַבְּרִית का संबंध
  choice: वाचा की पटियाएँ
  alternative: वाचा वाली पटियाएँ
  rationale: संबंध को जानबूझकर व्यापक रखा गया है; हिन्दी का संबंधकारक मूल की तरह यह निर्धारित नहीं करता कि पटियाएँ वाचा का लेख हैं, चिह्न हैं, या उससे अन्य प्रकार से संबंधित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पटिया’ यहाँ लिखने योग्य समतल पत्थर की तख्ती के अर्थ में है। अपपदात्मक पुनरावृत्ति को डैश के द्वारा स्पष्ट किया गया है।
