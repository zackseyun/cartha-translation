translation:
  language: hi
  text: चालीस दिन और चालीस रात बीत जाने पर[a], याहवे ने मुझे पत्थर की वे दो पटियाएँ—वाचा की पटियाएँ—दीं।
  philosophy: optimal-equivalence
  footnotes:
