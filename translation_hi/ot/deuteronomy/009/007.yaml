  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: hi
  text: याद रखो—भूलो मत—कि तुमने जंगल में अपने परमेश्वर यहवे को कैसे क्रोध दिलाया। जिस दिन तू मिस्र देश से निकला था, उस दिन से लेकर इस स्थान पर तुम्हारे पहुँचने तक तुम यहवे के विरुद्ध विद्रोह करते रहे हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहवे के साथ”; यहाँ भाव है, “यहवे के विरुद्ध।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: याद रखो—भूलो मत
  rationale: आज्ञार्थक क्रिया और उसके बाद आए निषेधात्मक रूप, दोनों को रखकर इब्रानी की जोरदार पुनरुक्ति सुरक्षित की गई है।
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: कि तुमने ... कैसे क्रोध दिलाया
  rationale: 'הקצף के हिफ़ील रूप का कारणवाचक भाव व्यक्त होता है: इस्राएल के आचरण ने यहवे को क्रोधित किया। ‘कि ... कैसे’ स्मरण की विषयवस्तु और घटना के ढंग, दोनों को स्वाभाविक हिन्दी में सामने लाता है।'
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय को ‘अपने’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: यहाँ מִדְבָּר निर्जन वनप्रदेश को सूचित करता है; ‘जंगल’ सामान्य आधुनिक हिन्दी में स्पष्ट है और केवल रेतीले मरुस्थल का अर्थ नहीं थोपता।
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ מֵאֶרֶץ מִצְרַיִם
  choice: जिस दिन तुम मिस्र देश से निकले थे, उस दिन से
  rationale: समयावधि के आरंभ-बिंदु को सहज हिन्दी में व्यक्त करते हुए ‘मिस्र देश’ की स्रोत-संरचना रखी गई है।
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: इस स्थान पर तुम्हारे पहुँचने तक
  rationale: क्रिया के बहुवचन प्रत्यय को हिन्दी के सामूहिक ‘तुम्हारे’ में सुरक्षित रखा गया है; यह पहले आए एकवचन संबोधन से स्रोत में हुए संख्या-परिवर्तन को अनावश्यक रूप से समतल नहीं करता।
- source_word: מַמְרִים הֱיִיתֶם
  choice: विद्रोह करते रहे हो
  rationale: מרה अधिकार के विरुद्ध विद्रोही अवज्ञा दर्शाता है। ‘करते रहे हो’ निर्गमन से वर्तमान स्थान तक चले आए व्यवहार को व्यक्त करता है।
- source_word: עִם יְהוָה
  choice: यहवे के विरुद्ध
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर מרה के साथ संबंध विरोधात्मक है; मुख्य पाठ में स्वाभाविक अर्थ दिया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: इस्राएल के विद्रोह की कालगत व्यापकता
  choice: विद्रोह करते रहे हो
  alternative: विद्रोही थे
  rationale: वाक्य निर्गमन के दिन से वर्तमान स्थान तक की निरंतर प्रवृत्ति बताता है; हिन्दी का यह प्रयोग उस अवधि को स्पष्ट करता है, बिना यह दावा किए कि प्रत्येक क्षण समान रूप से विद्रोही था।
- issue: עִם יְהוָה का संबंधसूचक अर्थ
  choice: यहवे के विरुद्ध
  alternative: यहवे के साथ
  rationale: מרה के साथ ‘साथ’ विरोध या टकराव का संबंध व्यक्त करता है। ‘विरुद्ध’ सन्दर्भगत अर्थ है, जबकि शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। आरंभ की दोहरी आज्ञा को डैश से बल दिया गया है। एकवचन से बहुवचन की इब्रानी अदला-बदली हिन्दी के ‘तुम/तुम्हारे’ में स्वाभाविक रूप से खुली रहती है।
