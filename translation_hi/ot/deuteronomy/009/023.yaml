base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: hi
  text: और जब याहवे ने तुम्हें कादेश-बर्नेआ से यह कहकर भेजा, “ऊपर जाओ और उस देश पर अधिकार कर लो जिसे मैंने तुम्हें दिया है,” तब तुमने अपने परमेश्वर याहवे की आज्ञा के विरुद्ध विद्रोह किया[a]; तुमने न तो उस पर विश्वास किया[b] और न उसकी बात मानी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “अपने परमेश्वर याहवे के मुख के विरुद्ध”; यह उसकी आज्ञा या वचन के विरुद्ध जाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर भरोसा नहीं रखा।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से, “उसकी वाणी नहीं सुनी”; इसका भाव उसकी आज्ञा न मानना भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: और जब … ने … भेजा
  rationale: वाव, पूर्वसर्ग और infinitive construct मिलकर कालसूचक परिस्थिति बताते हैं; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्नेआ से
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण; योजक चिह्न संयुक्त नाम की इकाई स्पष्ट रखता है।
- source_word: עֲלוּ
  choice: ऊपर जाओ
  rationale: עלה के दिशासूचक भाव को बनाए रखता है और देश में चढ़कर जाने के प्रसंग में स्वाभाविक है।
- source_word: וּרְשׁוּ
  choice: अधिकार कर लो
  rationale: भूमि-संबंधी प्रसंग में ירשׁ का अर्थ उस पर अधिकार करके उसे अपने कब्जे में लेना है; यह केवल सामान्य ‘रखने’ से अधिक स्पष्ट है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: यहाँ निश्चित भूमि की ओर संकेत है; हिन्दी में प्रसंगानुकूल ‘उस देश’ सहज और स्पष्ट है।
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: जिसे मैंने तुम्हें दिया है
  rationale: पूर्ण क्रिया परमेश्वर के दिए हुए दान को निश्चित और वर्तमान रूप से प्रासंगिक दिखाती है।
- source_word: וַתַּמְרוּ
  choice: तुमने … विद्रोह किया
  rationale: מרה अधिकार के विरुद्ध बगावत या अवज्ञापूर्ण विद्रोह व्यक्त करता है।
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे की आज्ञा के विरुद्ध
  rationale: शाब्दिक ‘मुख के विरुद्ध’ हिब्रू मुहावरा है, जिसका आशय उसके मुख से निकली अधिकारपूर्ण आज्ञा से है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: तुमने … उस पर विश्वास नहीं किया
  rationale: האמין לו विश्वास करने और भरोसा रखने दोनों का भाव दे सकता है; मुख्य पाठ में सामान्य अर्थ रखा और दूसरा भाव पादटिप्पणी में दिया गया है।
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: न उसकी बात मानी
  rationale: שׁמע בקול का मुहावरेदार अर्थ किसी की बात सुनकर उसका पालन करना है; हिन्दी में ‘बात मानना’ श्रवण और आज्ञापालन के संयुक्त आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: נָתַתִּי में पूर्ण क्रिया का बल
  choice: मैंने तुम्हें दिया है
  alternative: मैंने तुम्हें दिया था
  rationale: यह रूप भूमि के दान को निश्चित और वर्तमान प्रसंग में प्रभावी रखता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
- issue: הֶאֱמַנְתֶּם לוֹ का अर्थ-क्षेत्र
  choice: उस पर विश्वास किया
  alternative: उस पर भरोसा रखा
  rationale: क्रिया विश्वास और भरोसे दोनों को समेट सकती है; मुख्य पाठ एक अर्थ चुनता है और वास्तविक वैकल्पिक सूक्ष्मता पादटिप्पणी में रखता है।
- issue: שְׁמַעְתֶּם בְּקֹלוֹ में सुनना और आज्ञापालन
  choice: उसकी बात मानी
  alternative: उसकी वाणी सुनी
  rationale: यह हिब्रू प्रयोग सुनने के साथ आज्ञापालन का भाव रखता है; सहज हिन्दी मुहावरा आशय स्पष्ट करता है, जबकि शाब्दिक चित्र पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रत्यक्ष कथन के लिए हिन्दी उद्धरण-चिह्न और आज्ञार्थक रूप प्रयुक्त हैं। ‘कादेश-बर्नेआ’ तथा ‘याहवे’ को नामों के रूप में लिप्यंतरित किया गया है; हिब्रू मुहावरों की अनावश्यक कठोरता से बचते हुए उनकी वास्तविक सूक्ष्मताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
