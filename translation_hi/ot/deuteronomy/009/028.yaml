  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: hi
  text: कहीं ऐसा न हो कि जिस देश से तू हमें निकाल लाया, वह कहे[a], ‘याहवे उन्हें उस देश में ले जाने में समर्थ नहीं था, जिसके बारे में उसने उनसे बात की थी,[b] और उनसे घृणा करने के कारण वह उन्हें निर्जन प्रदेश में मार डालने के लिए बाहर निकाल लाया।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘जिस देश से तू हमें निकाल लाया’; यहाँ ‘देश’ से आशय उसके निवासियों से है।
    reason: cultural_note
  - marker: b
    text: 'संदर्भ के अनुसार इसका अर्थ यह भी हो सकता है: ‘जिस देश में ले जाने की उसने उनसे प्रतिज्ञा की थी।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह प्रार्थना में आशंकित परिणाम का परिचय देता है और आधुनिक हिन्दी में चेतावनी तथा भय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: जिस देश से तू हमें निकाल लाया, वह
  rationale: इब्रानी में कर्ता शाब्दिक रूप से ‘देश’ है; यह वहाँ के निवासियों के लिए लक्षणा है। मुख्य पाठ मूल अभिव्यक्ति को बनाए रखता है और पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: याहवे ... समर्थ नहीं था
  rationale: यह असमर्थता के आरोप को सीधे व्यक्त करता है। यह कथन देश के निवासियों की संभावित निंदात्मक धारणा है, कथावाचक का दावा नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: לַהֲבִיאָם
  choice: उन्हें ... ले जाने
  rationale: गंतव्य के साथ यह हिन्दी में स्वाभाविक है और इस्राएल को प्रतिज्ञात देश में पहुँचाने का भाव देता है।
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: उस देश में ... जिसके विषय में उसने उनसे कहा था
  rationale: דִּבֶּר का मूल अर्थ ‘कहा/बोला’ सुरक्षित रखा गया है। संदर्भ में यह देश देने की प्रतिज्ञा की ओर संकेत करता है, पर हिन्दी पाठ उस आशय को अनावश्यक रूप से स्पष्ट करके मूल की संक्षिप्तता समाप्त नहीं करता।
- source_word: וּמִשִּׂנְאָתוֹ אֹתָם
  choice: और उनसे घृणा करने के कारण
  rationale: מִן कारण सूचित करता है; यह संभावित आरोप में याहवे के कथित उद्देश्य को व्यक्त करता है।
- source_word: הוֹצִיאָם
  choice: वह उन्हें ... बाहर निकाल लाया
  rationale: पहले प्रयुक्त יצא के साथ शब्दगत संगति और निर्गमन की प्रतिध्वनि बनाए रखी गई है।
- source_word: לַהֲמִתָם
  choice: मार डालने के लिए
  rationale: מות के हिफ़ील रूप का कारक अर्थ स्पष्ट, गंभीर और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: बाइबलीय सन्दर्भ में यह निर्जन वन-प्रदेश को सूचित करने वाला प्रचलित और सहज हिन्दी रूप है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में विशिष्ट दिव्य नाम है; उसका लिप्यंतरण सामान्य उपाधि से भेद बनाए रखता है।
- issue: דִּבֶּר לָהֶם को प्रतिज्ञा के रूप में स्पष्ट करना या उसके शाब्दिक कथन को बनाए रखना
  choice: जिसके विषय में उसने उनसे कहा था
  alternative: जिस देश को देने की उसने उनसे प्रतिज्ञा की थी
  rationale: संदर्भ प्रतिज्ञा का आशय देता है, पर मूल क्रिया ‘कहा’ है। मुख्य पाठ मूल की अभिव्यक्ति और उसके निहितार्थ के बीच का तनाव बनाए रखता है; पादटिप्पणी प्रासंगिक अर्थ बताती है।
- issue: याहवे की असमर्थता और घृणा का कथन
  choice: उद्धृत संभावित आरोप के रूप में यथावत
  alternative: आरोप को नरम या व्याख्यायित करना
  rationale: ये मूसा द्वारा आशंकित बाहरी लोगों के शब्द हैं, परमेश्वर के स्वभाव पर कथावाचक का निर्णय नहीं। उद्धरण-रचना इस भेद को पर्याप्त रूप से सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, प्रार्थनात्मक और सार्वजनिक-पाठ योग्य शैली रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ मूल इब्रानी के निकट है और पारंपरिक भक्तिपरक गरिमा बनाए रखता है।
