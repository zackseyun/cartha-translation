    issue: Awkward rendering of אֲשֶׁר דִּבֶּר לָהֶם
    rationale: ‘जिसके विषय में उसने उनसे कहा था’ is not idiomatic modern Hindi because ‘कहा’ normally needs stated content. ‘जिसके बारे में उसने उनसे बात की थी’ conveys the Hebrew’s literal ‘spoke to them [about]’ and preserves the contextual ambiguity; the footnote can supply the covenantal sense.
  - severity: low
    issue: ‘जंगल’ can be misleading for בַּמִּדְבָּר
    rationale: In contemporary Hindi ‘जंगल’ often denotes a forest, whereas מִדְבָּר denotes wilderness/desert terrain. ‘निर्जन प्रदेश’ is broad, natural, and source-faithful.
