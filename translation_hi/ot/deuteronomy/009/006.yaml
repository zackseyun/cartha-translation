language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: hi
  text: इसलिए जान लो कि यहोवा, तुम्हारा परमेश्वर, यह अच्छी भूमि तुम्हें अधिकार में लेने के लिए तुम्हारी धार्मिकता के कारण नहीं दे रहा है[a], क्योंकि तुम हठीले लोग हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विरासत में पाने के लिए।” इब्रानी क्रिया का अर्थ विरासत पाना हो सकता है, पर व्यवस्थाविवरण में इसमें भूमि को प्राप्त करके उस पर अधिकार करने का भाव प्रायः शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: इसलिए जान लो
  rationale: संयोजक वाव पिछले तर्क से निष्कर्षात्मक संबंध रखता है, और पूर्ण क्रिया यहाँ उपदेशात्मक आज्ञा के रूप में प्रयुक्त है।
- source_word: לֹא בְצִדְקָתְךָ
  choice: तुम्हारे धर्मी होने के कारण नहीं
  rationale: בְ यहाँ साधन नहीं, बल्कि आधार या कारण बताता है; यह वाक्यांश स्वाभाविक हिन्दी में इस बात को स्पष्ट रखता है कि इस्राएल की धार्मिकता भूमि मिलने का आधार नहीं है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: तुम्हारा परमेश्वर यहोवा
  rationale: दिव्य नाम को 'यहोवा' से और एकवचन प्रत्यय को 'तुम्हारा' से व्यक्त किया गया है; हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: נֹתֵן לְךָ
  choice: तुम्हें ... दे रहा है
  rationale: कृदंत निकट और प्रगतिशील क्रिया को दर्शाता है, जब इस्राएल भूमि में प्रवेश करने वाला है।
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: यह अच्छी भूमि
  rationale: निर्देशक, विशेषण और वाचा-संबंधी 'भूमि'—तीनों को सीधे बनाए रखा गया है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार में लेने के लिए
  rationale: व्यवस्थाविवरण में ירשׁ प्रायः प्रतिज्ञात भूमि को प्राप्त कर उस पर अधिकार करने का अर्थ देता है; यह चयन केवल निष्क्रिय उत्तराधिकार का भाव देने से बचता है।
- source_word: עַם קְשֵׁה עֹרֶף
  choice: हठीले लोग
  rationale: शाब्दिक रूप से 'कठोर गर्दन वाला जन' एक इब्रानी मुहावरा है, जिसका आशय अड़ियल और विद्रोही होना है; आधुनिक हिन्दी में 'हठीले लोग' अर्थ को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल को भूमि मिलने का आधार
  choice: पद स्पष्ट रूप से नकारता है कि इस्राएल का धर्मी होना यहोवा द्वारा भूमि दिए जाने का कारण है।
  alternative: इसे केवल नम्रता की सामान्य शिक्षा के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ इस्राएल की धार्मिकता को आधार मानने से इनकार करता है और उसके हठीलेपन को सामने रखता है; अनुवाद इस वाचागत अयोग्यता के तनाव को बनाए रखता है।
- issue: सामूहिक एकवचन संबोधन
  choice: इस्राएल को सामूहिक रूप से संबोधित करते हुए 'तुम्हारा' और 'तुम' रखा गया है।
  alternative: '''तुम सब'' जोड़कर संबोधन को स्पष्ट बहुवचन बनाना।'
  rationale: मूल पाठ में संबोधन व्याकरणिक रूप से एकवचन है, जबकि 'लोग' सामूहिक पहचान बताता है; हिन्दी में इसे बिना अनावश्यक विस्तार के सुरक्षित रखा जा सकता है।
- issue: कठोर गर्दन का रूपक
  choice: मुख्य पाठ में अर्थपरक 'हठीले लोग' रखा गया और शाब्दिक रूपक को मुख्य पाठ में नहीं थोपा गया।
  alternative: '''हठीली गर्दन वाले लोग'' या ''कठोर गर्दन वाले लोग''।'
  rationale: शाब्दिक रूप हिन्दी में अस्वाभाविक और संभावित रूप से अस्पष्ट है; 'हठीले' विद्रोही जिद के आशय को संप्रेषित करता है, यद्यपि रूपक खो जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। 'धर्मी होने' से धार्मिकता का नैतिक-वाचागत भाव सामान्य पाठक के लिए स्पष्ट किया गया है। दिव्य नाम के लिए 'यहोवा' रखा गया है।
