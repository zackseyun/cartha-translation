revisions:
- from: इसलिए जान लो कि तुम्हारा परमेश्वर यहोवा यह अच्छी भूमि तुम्हारे धर्मी होने के कारण तुम्हें अधिकार में लेने के लिए नहीं दे रहा है[a], क्योंकि तुम हठीले लोग हो।
  to: इसलिए जान लो कि यहोवा, तुम्हारा परमेश्वर, यह अच्छी भूमि तुम्हें अधिकार में लेने के लिए तुम्हारी धार्मिकता के कारण नहीं दे रहा है[a], क्योंकि तुम हठीले लोग हो।
  rationale: The revision moves “तुम्हारी धार्मिकता के कारण” immediately before “नहीं दे रहा है,” so that Hindi unmistakably denies righteousness as the reason for Yahweh's gift, as the Hebrew does. It also uses the noun “धार्मिकता” for צְדָקָה. The possession purpose, explanatory “क्योंकि,” and the idiomatic rendering of “stiff-necked” are retained; the lexical-alternative footnote remains valid and anchored.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:51:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the exhortation, the denial that Israel's righteousness is the basis for receiving the land, Yahweh's giving of the good land, and Israel's obstinacy. However, the placement of नहीं in the Hindi clause can syntactically suggest that the denied element is the purpose “to take possession,” rather than the stated ground of Israel's righteousness.
  naturalness: Most wording is clear and suitably formal-modern. Reordering the negation immediately with “तुम्हारी धार्मिकता के कारण” makes the intended contrast unambiguous. “हठीले लोग” is a natural idiomatic rendering of the Hebrew metaphor in this register.
  terminology: “यहोवा,” “परमेश्वर,” “धार्मिकता,” “भूमि,” and “अधिकार में लेने” appropriately represent the key terms. “धार्मिकता” more directly corresponds to the abstract noun צְדָקָה than “धर्मी होने.” The footnote accurately preserves the lexical alternative of inheritance.
  issues:
  - severity: medium
    issue: Negation is positioned after the purpose phrase.
    rationale: In “तुम्हारे धर्मी होने के कारण तुम्हें अधिकार में लेने के लिए नहीं दे रहा है,” नहीं most immediately negates “अधिकार में लेने के लिए,” potentially yielding the incorrect sense that the land is not being given for possession. The Hebrew negates “because of your righteousness.”
  - severity: low
    issue: “धर्मी होने” is less direct than an abstract noun for צִדְקָה.
    rationale: Though intelligible, “तुम्हारी धार्मिकता के कारण” more closely and naturally renders the Hebrew noun while retaining the covenantal-moral sense.
  revised_text: इसलिए जान लो कि यहोवा, तुम्हारा परमेश्वर, यह अच्छी भूमि तुम्हें अधिकार में लेने के लिए तुम्हारी धार्मिकता के कारण नहीं दे रहा है[a], क्योंकि तुम हठीले लोग हो।
  revised_footnotes:
  - marker: a
    text: या “विरासत में पाने के लिए।” इब्रानी क्रिया का अर्थ विरासत पाना हो सकता है, पर व्यवस्थाविवरण में इसमें भूमि को प्राप्त करके उस पर अधिकार करने का भाव प्रायः शामिल है।
    reason: lexical_alternative
  revision_rationale: The revision moves “तुम्हारी धार्मिकता के कारण” immediately before “नहीं दे रहा है,” so that Hindi unmistakably denies righteousness as the reason for Yahweh's gift, as the Hebrew does. It also uses the noun “धार्मिकता” for צְדָקָה. The possession purpose, explanatory “क्योंकि,” and the idiomatic rendering of “stiff-necked” are retained; the lexical-alternative footnote remains valid and anchored.
