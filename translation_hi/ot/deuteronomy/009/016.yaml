source:
  edition: WLC
  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: hi
  text: 'मैंने देखा, और देखो, तुमने अपने परमेश्वर यहोवा के विरुद्ध पाप किया था: तुमने अपने लिए धातु से ढाला हुआ एक बछड़ा[a] बना लिया था। तुम उस मार्ग से शीघ्र ही हट गए थे, जिस मार्ग पर चलने की आज्ञा यहोवा ने तुम्हें दी थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ढली हुई धातु का बछड़ा।” इब्रानी पद धातु ढालकर बनाए हुए बछड़े को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: मैंने देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। हिन्दी कथा-वर्णन में ‘मैंने देखा’ स्वाभाविक है और अगले ध्यानाकर्षक पद के साथ भी स्पष्ट रहता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה श्रोता का ध्यान अचानक सामने आई स्थिति की ओर खींचता है। ‘और देखो’ इसका बल संक्षेप में बनाए रखता है।
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: तुमने अपने परमेश्वर यहोवा के विरुद्ध पाप किया था
  rationale: इस प्रसंग में ל के साथ חטא अपराध के लक्ष्य को दर्शाता है; ‘के विरुद्ध पाप’ स्वाभाविक हिन्दी है। ‘किया था’ मूसा द्वारा पिछली घटना के पुनर्वर्णन को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नाम-रूप ‘यहोवा’ tetragrammaton को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: עֲשִׂיתֶם לָכֶם
  choice: तुमने अपने लिए ... बना लिया था
  rationale: לָכֶם हितग्राही अर्थ रखता है। ‘अपने लिए’ उसे स्पष्ट करता है, और ‘बना लिया था’ हिन्दी में कर्ता की संलग्नता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵגֶל מַסֵּכָה
  choice: ढली हुई धातु का एक बछड़ा
  rationale: מַסֵּכָה धातु ढालकर बनाई गई मूर्ति को सूचित करता है। यह अनुवाद वस्तु और निर्माण-विधि दोनों को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: סַרְתֶּם מַהֵר מִן הַדֶּרֶךְ
  choice: तुम उस मार्ग से बहुत जल्दी भटक गए थे
  rationale: סור और דֶּרֶךְ मिलकर आज्ञापालन के मार्ग से हटने का रूपक बनाते हैं। ‘भटक गए’ वर्तमान हिन्दी में स्वाभाविक है और ‘बहुत जल्दी’ מַהֵר का बल रखता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: जिस पर चलने की आज्ञा यहोवा ने तुम्हें दी थी
  rationale: शाब्दिक रूप से ‘जिस मार्ग की आज्ञा’ हिन्दी में अधूरा लग सकता है; ‘जिस पर चलने की’ उस निहित नैतिक दिशा को स्पष्ट करता है, बिना आशय बदले।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए ‘यहोवा’ इसका स्थापित और समझने योग्य नाम-रूप है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: ‘मार्ग’ की आज्ञा का अर्थ
  choice: जिस पर चलने की आज्ञा यहोवा ने तुम्हें दी थी
  alternative: जिसकी आज्ञा यहोवा ने तुम्हें दी थी
  rationale: ‘मार्ग’ यहाँ आचरण और आज्ञापालन का रूपक है। ‘पर चलने’ को व्यक्त करने से हिन्दी वाक्य स्वाभाविक होता है, पर यह किसी विशिष्ट धार्मिक व्यवस्था को मूल से अधिक नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक कथन को बनाए रखता है; ‘ढली हुई धातु’ पारंपरिक किंतु आज कम स्पष्ट ‘पिघला हुआ बछड़ा’ से अधिक सटीक है।
