base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: hi
  text: और यहोवा हारून पर बहुत क्रोधित हुआ, उसे नष्ट करने के लिए; और मैंने भी उस समय हारून के लिए प्रार्थना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: और हारून पर भी
  rationale: בְ को क्रोध के लक्ष्य के अर्थ में स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है; आरम्भिक וְּ को ‘और’ तथा प्रसंगगत समावेश को हिन्दी में स्वाभाविक बनाने के लिए ‘भी’ से व्यक्त किया गया है।
- source_word: הִתְאַנַּף ... מְאֹד
  choice: इतना क्रोधित हुआ
  rationale: क्रिया के प्रबल क्रोध और מְאֹד की तीव्रता को परिणामसूचक अगले खंड के साथ सहज हिन्दी में जोड़ा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा सुरक्षित रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְהַשְׁמִידוֹ
  choice: कि वह उसे नष्ट कर देना चाहता था
  rationale: לְ के यहाँ आशय अथवा प्रवृत्ति को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है; ‘नष्ट कर देना’ שׁמד की गंभीरता बनाए रखता है।
- source_word: וָאֶתְפַּלֵּל
  choice: मैंने ... प्रार्थना की
  rationale: פלל के हित्पअेल का सीधा अर्थ ‘प्रार्थना करना’ रखा गया है; मध्यस्थता का भाव अगले पदबंध से स्पष्ट होता है।
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: हारून के लिए भी
  rationale: בְּעַד को प्रार्थना के संदर्भ में ‘के लिए’ और גַּם को ‘भी’ से व्यक्त किया गया है।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: समय-सूचक पदबंध का संक्षिप्त, स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी पाठकों में स्थापित व्यक्तिगत नाम ‘यहोवा’ रखा गया है।
- issue: לְהַשְׁמִידוֹ में इच्छा अथवा निकट परिणाम
  choice: कि वह उसे नष्ट कर देना चाहता था
  alternative: उसे नष्ट करने के लिए
  rationale: इब्रानी infinitive में उद्देश्य/अभिप्राय का अर्थ संभव है। हिन्दी में चुना रूप इसे स्वाभाविक बनाता है, पर इसे पूर्ण हुई घटना नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सीधी, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की तीव्रता और मूसा की मध्यस्थ प्रार्थना दोनों सुरक्षित हैं।
