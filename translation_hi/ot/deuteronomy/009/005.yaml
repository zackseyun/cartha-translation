base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: hi
  text: तुम अपनी धार्मिकता या अपने हृदय की खराई के कारण उनकी भूमि पर अधिकार करने के लिए प्रवेश नहीं कर रहे हो; बल्कि इन राष्ट्रों की दुष्टता के कारण यहोवा, तुम्हारा परमेश्वर, उन्हें तुम्हारे सामने से बेदखल कर रहा है[a], और इसलिए कि वह उस वचन[b] को स्थिर करे जिसकी शपथ यहोवा ने तुम्हारे पितरों[c]—अब्राहम, इसहाक और याकूब—से खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें तुम्हारे सामने से निकाल रहा है।” इब्रानी क्रिया किसी को भूमि के अधिकार से वंचित करने और वहाँ से निकालने—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “वचन” से आशय शपथ के साथ दिया गया प्रतिज्ञा-वचन है।
    reason: lexical_clarification
  - marker: c
    text: “पितरों” से यहाँ विशेष रूप से अब्राहम, इसहाक और याकूब का आशय है, जिनके नाम आगे दिए गए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: अपनी धार्मिकता के कारण
  rationale: पूर्वसर्ग בְ यहाँ निषेधात्मक वाक्य में कारण बताता है; צְדָקָה नैतिक धार्मिकता को व्यक्त करता है।
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: या अपने मन की सच्चाई के कारण
  rationale: יֹשֶׁר का मूल भाव सीधापन और खराई है; לֵבָב के साथ यह भीतरी नैतिक सच्चाई का संकेत देता है। हिंदी में ‘मन की सच्चाई’ स्वाभाविक और सुबोध है।
- source_word: בָא לָרֶשֶׁת
  choice: अधिकार करने के लिए प्रवेश कर रहे हो
  rationale: בוא और उद्देश्यसूचक infinitive भूमि में प्रवेश तथा उस पर अधिकार करने, दोनों भावों को रखते हैं।
- source_word: בְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: इन राष्ट्रों की दुष्टता के कारण
  rationale: רִשְׁעָה दुष्टता या दोष को और בְ कारण को व्यक्त करता है; גּוֹיִם के लिए ‘राष्ट्र’ प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: उन्हें तुम्हारे सामने से बेदखल कर रहा है
  rationale: ירשׁ के हिफ़ील रूप में किसी को उसकी मिल्कियत से वंचित करने या निकालने का कारणात्मक भाव है; ‘बेदखल’ भूमि-अधिकार की बारीकी को सुरक्षित रखता है।
- source_word: וּלְמַעַן הָקִים
  choice: और इसलिए भी कि वह ... पूरा करे
  rationale: לְמַעַן उद्देश्य बताता है और הקים यहाँ शपथपूर्वक दिए वचन को स्थापित या पूरा करने का भाव रखता है।
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: उस वचन को ... जिसकी शपथ ... खाई थी
  rationale: דָּבָר का सीधा अर्थ ‘वचन’ है, जबकि शपथ का संदर्भ उसमें प्रतिज्ञा का भाव स्पष्ट करता है।
- source_word: לַאֲבֹתֶיךָ
  choice: तुम्हारे पूर्वजों
  rationale: तत्काल बाद अब्राहम, इसहाक और याकूब के नाम होने से संदर्भ स्पष्ट है; आधुनिक हिंदी में ‘पूर्वजों’ स्वाभाविक है और फुटनोट इसकी विशिष्टता बताता है।
theological_decisions:
- issue: भूमि पर इस्राएल के अधिकार के आधार
  choice: इस्राएल की धार्मिकता का स्पष्ट निषेध करते हुए राष्ट्रों की दुष्टता और यहोवा की शपथ के प्रति निष्ठा—दोनों कारण सुरक्षित रखे गए हैं।
  alternative: केवल राष्ट्रों की दुष्टता या केवल पूर्वजों से की गई प्रतिज्ञा को मुख्य कारण बनाना।
  rationale: इब्रानी पाठ כִּי वाले कारण और וּלְמַעַן वाले उद्देश्य, दोनों को स्पष्ट रूप से जोड़ता है; किसी एक को दूसरे में समाहित नहीं करना चाहिए।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ का व्यक्तिगत नाम बनाए रखा गया है। आधुनिक हिंदी के व्यापक बाइबलीय पाठक-वर्ग के लिए ‘यहोवा’ अधिक परिचित लिप्यंतरण है, यद्यपि ‘याहवे’ संभावित उच्चारण के अधिक निकट माना जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन के अनुरूप ‘तुम’ का प्रयोग किया गया है। ‘बेदखल’ भूमि-अधिकार के कारणात्मक भाव को संक्षेप में व्यक्त करता है; फुटनोट वैकल्पिक निष्कासन-भाव स्पष्ट करता है।
