source:
  edition: WLC
  text: בַּ/עֲלֹתִ֣/י הָ/הָ֗רָ/ה לָ/קַ֜חַת לוּחֹ֤ת הָֽ/אֲבָנִים֙ לוּחֹ֣ת הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת יְהוָ֖ה עִמָּ/כֶ֑ם וָ/אֵשֵׁ֣ב בָּ/הָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֥א שָׁתִֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/009.yaml
  text: When I went up the mountain to receive the stone tablets[a], the tablets of the covenant that Yahweh made with you, I remained on the mountain forty days and forty nights[c][b]; I ate no bread and drank no water.
translation:
  language: hi
  text: जब मैं पत्थर की पटियाएँ[b]—उस वाचा की पटियाएँ, जो याहवे ने तुम्हारे साथ बाँधी थी[c]—लेने[a] के लिए पहाड़ पर चढ़ा, तब मैं चालीस दिन और चालीस रात पहाड़ पर रहा। मैंने न रोटी खाई और न पानी पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राप्त करने।” इब्रानी में शाब्दिक अर्थ “लेने” है; प्रसंग में मूसा पटियाएँ दिए जाने के लिए ऊपर गया था।
    reason: lexical_alternative
  - marker: b
    text: या, “पत्थर की तख्तियाँ।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम्हारे साथ काटी थी”; यह वाचा बाँधने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֹתִי הָהָרָה
  choice: जब मैं…पहाड़ पर चढ़ा
  rationale: בְּ के साथ infinitive construct यहाँ काल-सूचक है, और दिशासूचक הָהָרָה किसी निश्चित पहाड़ की ओर चढ़ने को व्यक्त करता है। यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לָקַחַת
  choice: लेने
  rationale: मूल अर्थ ‘लेना’ है। प्रसंग में पटियाएँ परमेश्वर से प्राप्त की जानी हैं, फिर भी मुख्य पाठ में स्रोत की सीधी अभिव्यक्ति रखी गई है और ‘प्राप्त करने’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: לוּחֹת הָאֲבָנִים
  choice: पत्थर की पटियाएँ
  rationale: यह construct पदबंध पटियाओं की सामग्री बताता है। ‘पत्थर की पटियाएँ’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: לוּחֹת הַבְּרִית
  choice: उस वाचा की पटियाएँ
  rationale: मूल में दोहराव पहले कही गई पत्थर की पटियाओं की पहचान वाचा की पटियाओं के रूप में करता है; हिन्दी में ‘उस’ इस समानाधिकरण संबंध को स्पष्ट करता है।
- source_word: כָּרַת…עִמָּכֶם
  choice: तुम्हारे साथ बाँधी थी
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर उसका अर्थ वाचा स्थापित करना है। ‘वाचा बाँधना’ हिन्दी में स्वाभाविक मुहावरा है और संबंधात्मक भाव बनाए रखता है।
- source_word: וָאֵשֵׁב
  choice: मैं…रहा
  rationale: ישׁב का अर्थ बैठना, निवास करना या बने रहना हो सकता है। यहाँ चालीस दिन और रात की अवधि प्रमुख है, इसलिए ‘रहा’ प्रसंगानुकूल है।
- source_word: לֶחֶם לֹא אָכַלְתִּי
  choice: मैंने न रोटी खाई
  rationale: לֶחֶם कभी व्यापक अर्थ में भोजन भी हो सकता है, पर यहाँ ठोस शब्द ‘रोटी’ को बनाए रखा गया है।
- source_word: וּמַיִם לֹא שָׁתִיתִי
  choice: और न पानी पिया
  rationale: यह पिछले निषेध के समानांतर सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: כרת ברית के वाचा-संबंधी मुहावरे का अनुवाद
  choice: वाचा बाँधी
  alternative: वाचा की; वाचा काटी
  rationale: ‘वाचा काटी’ शाब्दिक तो है, पर आधुनिक हिन्दी में अर्थ अस्पष्ट कर देगा। ‘वाचा बाँधी’ मुहावरे का आशय स्वाभाविक ढंग से देता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। वाक्य की समानाधिकरण संरचना को डैश से स्पष्ट किया गया है, मूल का ‘पटियाएँ’ वाला दोहराव सुरक्षित है, और भोजन-पानी के समानांतर निषेध को संक्षिप्त स्वाभाविक रूप दिया गया है।
