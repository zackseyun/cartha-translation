  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: hi
  text: तब मैंने उन दोनों पटियाओं को पकड़कर अपने दोनों हाथों से फेंक दिया और तुम्हारी आँखों के सामने उन्हें तोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: मैंने...पकड़कर
  rationale: תפשׂ का अर्थ पकड़ना या थाम लेना है। यहाँ ‘पकड़कर’ शारीरिक क्रिया को सहज और बिना अनावश्यक तीव्रता के व्यक्त करता है।
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: उन दोनों पटियाओं को
  rationale: लֻחֹת के लिए ‘पटियाएँ’ प्रचलित बाइबलीय हिंदी है। ‘पत्थर’ इस पद में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया; ‘उन’ से पहले से उल्लिखित पटियाओं का संकेत मिलता है।
- source_word: וָאַשְׁלִכֵם
  choice: नीचे फेंक दिया
  rationale: שלך का मूल अर्थ फेंकना है। מֵעַל के साथ प्रसंग में हाथों से नीचे फेंकने की गति स्वाभाविक रूप से व्यक्त होती है।
- source_word: מֵעַל שְׁתֵּי יָדַי
  choice: अपने दोनों हाथों से
  rationale: इब्रानी में ‘मेरे दोनों हाथों के ऊपर से’ है। हिंदी में ‘अपने दोनों हाथों से’ स्वाभाविक है और द्विवचन के बल को बनाए रखता है।
- source_word: וָאֲשַׁבְּרֵם
  choice: उन्हें तोड़ दिया
  rationale: שׁבר का सीधा अर्थ ‘तोड़ना’ है। ‘चकनाचूर कर दिया’ संभावित परिणाम को अधिक स्पष्ट करता, पर मूल क्रिया से अधिक विशिष्ट होता; इसलिए संयत और स्रोत-समीप विकल्प चुना गया।
- source_word: לְעֵינֵיכֶם
  choice: तुम्हारी आँखों के सामने
  rationale: यह इब्रानी मुहावरा संबोधित लोगों की प्रत्यक्ष दृष्टि या उपस्थिति में किए गए कार्य को बताता है। हिंदी में यह अभिव्यक्ति स्वाभाविक और चित्रात्मक है।
theological_decisions: []
