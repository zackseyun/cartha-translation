  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य में क्रमिक क्रियाओं का प्रवाह बनाए रखते हुए इब्रानी के ‘दोनों हाथों’ और ‘तुम्हारी आँखों के सामने’ वाले बल को सुरक्षित रखा गया है।
