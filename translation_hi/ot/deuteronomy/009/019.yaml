id: DEU.9.19
reference: Deuteronomy 9:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: hi
  text: क्योंकि मैं उस क्रोध और प्रकोप से डर गया था, जिससे याहवे तुम्हें नष्ट करने के लिए तुम्हारे विरुद्ध भड़क उठा था[a]। पर उस समय भी याहवे ने मेरी सुन ली[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस क्रोध और प्रकोप से याहवे तुम्हारे विरुद्ध क्रोधित हुआ था।”
    reason: मूल में क्रोध के लिए संज्ञाओं के साथ एक और क्रोध-सूचक क्रिया प्रयुक्त है; अधिक शब्दशः रूप हिन्दी में पुनरुक्तिपूर्ण है, पर मूल की बनावट दिखाता है।
  - marker: b
    text: शाब्दिक रूप से, “याहवे ने मुझे सुना”; इस प्रसंग में इसका अर्थ है कि उसने मूसा की विनती पर अनुकूल ध्यान दिया।
    reason: इब्रानी अभिव्यक्ति सुनने और अनुकूल प्रत्युत्तर देने, दोनों का संकेत दे सकती है।
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: मैं डर गया था
  rationale: यह क्रिया भय या गहरी आशंका व्यक्त करती है। ‘मैं डर गया था’ आधुनिक हिन्दी में स्वाभाविक है और मूसा की व्यक्तिगत प्रतिक्रिया बनाए रखता है।
- source_word: מִפְּנֵי
  choice: से
  rationale: इस प्रसंग में यह भय के कारण को दर्शाता है; हिन्दी में ‘से डरना’ इसका स्वाभाविक रूप है।
- source_word: הָאַף וְהַחֵמָה
  choice: क्रोध और प्रकोप
  rationale: दोनों निकटार्थक शब्द दैवी रोष की तीव्रता को संचित रूप से व्यक्त करते हैं। ‘क्रोध और प्रकोप’ इस दोहरे बल को बनाए रखता है।
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: यहोवा तुम पर जिस ... से भड़का था
  rationale: קצף तीव्र क्रोध व्यक्त करता है। ‘भड़का था’ उसके बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘तुम पर’ עֲלֵיכֶם को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यंजनात्मक नाम YHWH को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: तुम्हें नष्ट करने के लिए
  rationale: उद्देश्यसूचक לְ और हिफ़ील क्रिया का सीधा अर्थ सुरक्षित रखा गया है; इसमें न तो विनाश की तीव्रता घटाई गई है, न अतिरिक्त व्याख्या जोड़ी गई है।
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: पर ... यहोवा ने मेरी सुन ली
  rationale: שׁמע אֶל यहाँ केवल ध्वनि सुनने के बजाय विनती पर अनुकूल ध्यान देने का संकेत देता है। ‘मेरी सुन ली’ हिन्दी में इसी अर्थ को स्वाभाविक रूप से व्यक्त करता है; ‘पर’ विनाश की आशंका से अनुकूल उत्तर की ओर मोड़ दिखाता है।
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: उस समय भी
  rationale: यह पदबंध एक और अवसर पर परमेश्वर द्वारा मूसा की सुनने की बात जोड़ता है; ‘भी’ גַּם का योगात्मक बल रखता है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठ में परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, उसे उपाधि में नहीं बदलता।
- issue: दैवी क्रोध की तीव्रता
  choice: क्रोध और प्रकोप ... भड़का था
  alternative: बहुत क्रोधित हुआ था
  rationale: मूल में אַף, חֵמָה और קצף तीनों क्रोध-संबंधी अभिव्यक्तियाँ हैं। चुना हुआ रूप इस संचयी तीव्रता को बिना नरम किए बनाए रखता है।
- issue: विनाश का उद्देश्य
  choice: तुम्हें नष्ट करने के लिए
  alternative: ताकि वह तुम्हें नष्ट कर दे / क्योंकि वह तुम्हें नष्ट करना चाहता था
  rationale: उद्देश्यसूचक इब्रानी रचना को सीधे रखा गया है। ‘चाहता था’ जैसी मनोवैज्ञानिक व्याख्या नहीं जोड़ी गई, और न ही इस तनाव को घटाया गया कि मूसा इस विनाशकारी क्रोध से भयभीत था।
- issue: मूसा की मध्यस्थता पर प्रत्युत्तर
  choice: यहोवा ने मेरी सुन ली
  alternative: यहोवा ने मेरी बात सुनी
  rationale: प्रसंग में सुनना अनुकूल प्रत्युत्तर को संकेतित करता है। फिर भी अनुवाद परिणाम का विस्तृत धर्मवैज्ञानिक वर्णन जोड़ने के बजाय मूल की संक्षिप्त भाषा रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए पुनर्गठित है, पर भय, दैवी क्रोध, विनाश के उद्देश्य और मूसा की सुनी गई विनती—इन सभी मूल तत्वों को सुरक्षित रखता है।
