  text: אַל תֹּאמַ֣ר בִּ/לְבָבְ/ךָ֗ בַּ/הֲדֹ֣ף יְהוָה֩ אֱלֹהֶ֨י/ךָ אֹתָ֥/ם מִ/לְּ/פָנֶי/ךָ֮ לֵ/אמֹר֒ בְּ/צִדְקָתִ/י֙ הֱבִיאַ֣/נִי יְהוָ֔ה לָ/רֶ֖שֶׁת אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְ/רִשְׁעַת֙ הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה יְהוָ֖ה מוֹרִישָׁ֥/ם מִ/פָּנֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/004.yaml
  text: Do not say in your heart[a], when Yahweh your God drives them out from before you, saying, ‘Because of my righteousness Yahweh has brought me in to possess this land,’ while because of the wickedness of these nations Yahweh is dispossessing them before you.
translation:
  language: hi
  text: जब तुम्हारा परमेश्वर यहोवा उन्हें तुम्हारे सामने से खदेड़ेगा, तब अपने मन में यह मत कहना, ‘मेरी धार्मिकता के कारण यहोवा मुझे इस देश का अधिकार लेने के लिए लाया है, और[a] इन जातियों की दुष्टता के कारण यहोवा उन्हें तुम्हारे सामने से निकाल रहा है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “बल्कि इन जातियों की दुष्टता के कारण।” इब्रानी संयोजक का अनुवाद “और” या, प्रसंग के विरोधात्मक भाव को उभारते हुए, “बल्कि” किया जा सकता है।'
    reason: discourse_ambiguity
lexical_decisions:
- source_word: אַל תֹּאמַר בִּלְבָבְךָ
  choice: अपने मन में यह मत कहना
  rationale: निषेध को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘मन में’ इब्रानी के आंतरिक विचार अथवा आत्म-संवाद के भाव को सुरक्षित रखता है।
- source_word: בַּהֲדֹף
  choice: जब ... खदेड़ दे
  rationale: पूर्वसर्गयुक्त infinitive construct यहाँ समयसूचक है; ‘खदेड़ दे’ נדף के बलपूर्वक दूर हटाने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी की प्रचलित ध्वन्यात्मक परंपरा ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּצִדְקָתִי
  choice: मेरी धार्मिकता के कारण
  rationale: צְדָקָה के नैतिक सहीपन अथवा योग्यता के दावे को ‘धार्मिकता’ बनाए रखती है; ‘के कारण’ कारक संबंध स्पष्ट करता है।
- source_word: הֱבִיאַנִי
  choice: मुझे ... यहाँ लाया है
  rationale: हिफ़ील रूप के ‘मुझे प्रवेश कराया/ले आया’ भाव को लक्ष्य देश के संदर्भ में स्वाभाविक हिन्दी दी गई है।
- source_word: לָרֶשֶׁת אֶת הָאָרֶץ הַזֹּאת
  choice: इस देश पर अधिकार करने के लिए
  rationale: ירשׁ यहाँ भूमि को अपने अधिकार में लेने का संकेत देता है; ‘अधिकार करना’ आधुनिक हिन्दी में स्पष्ट है और ‘देश’ वाचा-संबंधी भूभाग का स्वाभाविक बोध देता है।
- source_word: וּבְרִשְׁעַת הַגּוֹיִם הָאֵלֶּה
  choice: बल्कि इन जातियों की दुष्टता के कारण
  rationale: वाव का प्रसंगगत विरोध ‘बल्कि’ से प्रकट होता है और רִשְׁעָה का नैतिक अर्थ ‘दुष्टता’ से सुरक्षित रहता है।
- source_word: מוֹרִישָׁם
  choice: उन्हें ... निकाल रहा है
  rationale: ירשׁ का हिफ़ील यहाँ अधिकार से वंचित कर भूमि से हटाने का अर्थ देता है; ‘निकाल रहा है’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है; हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ उसे उपाधि ‘प्रभु’ से बदले बिना सुरक्षित रखता है।
- issue: क्या इस्राएल अपनी धार्मिकता से देश का अधिकारी बना
  choice: पात्र का दावा उद्धृत करके ‘बल्कि’ से उसका खंडन स्पष्ट किया गया
  alternative: समन्वयी ‘और’ से दोनों कारणों को साथ रखना
  rationale: वचन का वक्तृता-संदर्भ आत्म-धार्मिकता के दावे को अस्वीकार करता है, पर ‘धार्मिकता’ शब्द को नरम करके यह तनाव मिटाया नहीं गया।
- issue: ירשׁ के दो संबंधित अर्थ
  choice: इस्राएल के लिए ‘अधिकार करना’ और जातियों के लिए ‘निकालना’
  alternative: दोनों स्थानों पर एक ही हिन्दी क्रिया रखना
  rationale: मूल धातु की अर्थ-व्याप्ति में अधिकार पाना और अधिकार से वंचित करना दोनों हैं; हिन्दी में अलग क्रियाएँ प्रसंगगत अर्थ को अधिक साफ़ रखती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने मन में’, ‘धार्मिकता’, ‘देश पर अधिकार’ और ‘जातियाँ’ जैसे पद मूल के प्रमुख रूपकों व धर्मवैचारिक शब्दावली को बनाए रखते हैं।
