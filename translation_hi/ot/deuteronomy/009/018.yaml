source:
  edition: WLC
  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: hi
  text: फिर मैं पहले की तरह[a] चालीस दिन और चालीस रात तक याहवे के सामने दण्डवत पड़ा रहा। मैंने न रोटी खाई, न पानी पिया। यह मैंने तुम्हारे उस सारे पाप के कारण किया, जो तुमने याहवे की दृष्टि में बुरा काम करके, उन्हें क्रोधित करने के लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहली बार की तरह’ अथवा ‘पहले के समान।’ इब्रानी पदबंध मूसा के याहवे के सामने बिताए पहले चालीस दिन के समय की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: दण्डवत पड़ा रहा
  rationale: हित्पएल रूप यहाँ मूसा के अपने को याहवे के सामने गिराकर विनती करने की मुद्रा बताता है। अवधि के साथ ‘पड़ा रहा’ स्वाभाविक हिंदी है; ‘दण्डवत’ जानबूझकर अपनाई गई नम्र शारीरिक मुद्रा स्पष्ट करता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्थान-संबंधी अर्थ ‘के सामने/उपस्थिति में’ है। परमेश्वर के व्यक्तिगत नाम יְהוָה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כָּרִאשֹׁנָה
  choice: पहले की तरह
  rationale: यह पदबंध मूसा के पहले चालीस-दिन के समय की ओर लौटकर संकेत करता है और तुलना को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: चालीस दिन और चालीस रात
  rationale: अवधि का सीधा और स्वाभाविक अनुवाद।
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: मैंने न रोटी खाई, न पानी पिया
  rationale: मूल में ‘रोटी’ और ‘पानी’ दोनों स्पष्ट हैं; समांतर ‘न…न’ रचना हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: तुम्हारे उस सारे पाप के कारण
  rationale: עַל कारण सूचित करता है। חַטַּאת एकवचन में सामूहिक अर्थ रखता है; ‘उस सारे पाप’ इस रूप और सामूहिक बल को यथासंभव बनाए रखता है।
- source_word: אֲשֶׁר חֲטָאתֶם
  choice: जो तुमने … किया था
  rationale: सापेक्ष वाक्यांश पहले हो चुके पाप को बताता है; हिंदी में ‘पाप किया’ का दोहराव संदर्भ से स्पष्ट रहते हुए वाक्य को मूल संरचना के निकट रखता है।
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में बुरा काम करके
  rationale: ‘दृष्टि में’ इब्रानी मूल्यांकन-संबंधी मुहावरे को बनाए रखता है, और कृदंत रूप पाप किए जाने के ढंग/विषय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְהַכְעִיסוֹ
  choice: उन्हें क्रोधित करके
  rationale: הכעיס का हिफ़ील रूप क्रोध उत्पन्न करने का कारणवाचक भाव देता है। ‘करके’ में प्रयोजन और परिणाम के बीच मूल की संभावित अर्थ-छाया खुली रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ चार-अक्षरी व्यक्तिगत नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: לְהַכְעִיסוֹ में प्रयोजन अथवा परिणाम
  choice: उन्हें क्रोधित करके
  alternative: उन्हें क्रोधित करने के लिए
  rationale: इब्रानी לְ वाला infinitive प्रयोजन, परिणाम या व्याख्यात्मक संबंध व्यक्त कर सकता है। ‘करके’ विद्रोही कार्य और उत्पन्न क्रोध का संबंध रखता है, बिना यह निश्चित किए कि क्रोधित करना ही उनका घोषित उद्देश्य था।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, कथात्मक रूप रखा गया है। ‘दण्डवत पड़ा रहा’ लंबी अवधि और विनयपूर्ण शारीरिक मुद्रा दोनों को व्यक्त करता है। याहवे के लिए आदरसूचक बहुवचन सर्वनाम ‘उन्हें’ प्रयुक्त हुआ है।
