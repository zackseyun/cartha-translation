source:
  edition: WLC
  text: שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַ/יּוֹם֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִמֶּ֑/ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצֻרֹ֖ת בַּ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/001.yaml
  text: 'Hear[a], Israel: today you are crossing the Jordan to go in to dispossess nations greater and mightier than you[b], with cities great and fortified up to the heavens.'
translation:
  language: hi
  text: सुन, हे इस्राएल! आज तू यरदन पार कर उन जातियों को बेदखल करने के लिए प्रवेश करने वाला है[a], जो तुझसे बड़ी और शक्तिशाली हैं और जिनके नगर बड़े और आकाश तक किलेबंद हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का अर्थ “अधिकार में लेना” या “अधिकार करना” भी हो सकता है; विजय के इस प्रसंग में इसका अर्थ पहले से बसे लोगों को बेदखल करना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “आकाश तक” है; यह अत्यन्त ऊँची और दुर्जेय किलेबंदी का अतिशयोक्तिपूर्ण वर्णन है।
    reason: cultural_note
lexical_decisions:
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: हे इस्राएल, सुन!
  rationale: एकवचन आज्ञार्थक क्रिया इस्राएल को सामूहिक इकाई के रूप में सम्बोधित करती है। यह रूप व्यवस्थाविवरण की वाचाई पुकार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֹבֵר הַיּוֹם אֶת־הַיַּרְדֵּן
  choice: आज तू यरदन पार करके
  rationale: कृदन्त और ‘आज’ आसन्न कार्य को व्यक्त करते हैं; एकवचन ‘तू’ सामूहिक इस्राएल से मूल सम्बोधन को सुरक्षित रखता है।
- source_word: לָבֹא לָרֶשֶׁת גּוֹיִם
  choice: उन जातियों को उनके अधिकार से निकालकर उनकी भूमि पर अधिकार करने जा रहा है
  rationale: ירשׁ विजय के प्रसंग में वर्तमान निवासियों को हटाने और उनके क्षेत्र पर अधिकार करने—दोनों अर्थों को समेट सकता है। हिन्दी में केवल ‘जातियों पर अधिकार’ अस्वाभाविक या भ्रामक होता, इसलिए दोनों पहलुओं को स्पष्ट किया गया है।
- source_word: גּוֹיִם
  choice: जातियाँ
  rationale: यहाँ अलग-अलग राष्ट्रीय/जनसमूहों के लिए व्यवस्थाविवरण में प्रचलित और सुबोध हिन्दी पद है।
- source_word: גְּדֹלִים וַעֲצֻמִים מִמֶּךָּ
  choice: जो तुझसे बड़ी और शक्तिशाली हैं
  rationale: दोनों तुलनात्मक विशेषणों—बड़ाई और सामर्थ्य—को सीधे सुरक्षित रखा गया है।
- source_word: עָרִים גְּדֹלֹת וּבְצֻרֹת בַּשָּׁמָיִם
  choice: उनके नगर बड़े हैं और उनकी किलेबन्दी आकाश तक ऊँची है
  rationale: नगरों के आकार तथा अत्यन्त ऊँची/दुर्जेय किलेबन्दी, दोनों को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल अतिशयोक्तिपूर्ण आकाश-बिम्ब को रखा गया है।
theological_decisions:
- issue: ירשׁ में अधिकार करना और बेदखल करना
  choice: उन जातियों को उनके अधिकार से निकालकर उनकी भूमि पर अधिकार करना
  alternative: उन जातियों पर अधिकार करना / उन्हें बेदखल करना
  rationale: विजय-सन्दर्भ दोनों अर्थ-पहलुओं को सम्भव बनाता है। चुना हुआ रूप किसी एक को दबाने के बजाय भूमि-अधिकार और पूर्व निवासियों के हटाए जाने दोनों को सामने रखता है।
- issue: नगरों की किलेबन्दी का अतिशयोक्तिपूर्ण वर्णन
  choice: किलेबन्दी आकाश तक ऊँची
  alternative: बहुत ऊँची किलेबन्दी / स्वर्ग तक दृढ़ किए हुए नगर
  rationale: मूल अलंकार को शाब्दिक तथ्य में बदलने या साधारण परिभाषा में समतल करने के बजाय उसका सजीव बिम्ब सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। सामूहिक इस्राएल के लिए मूल के एकवचन को ‘तू’ से रखा गया है। ‘किलेबन्दी’ वर्तमान हिन्दी में स्पष्ट है और ‘आकाश तक’ मूल काव्यात्मक अतिशयोक्ति को बनाए रखता है।
