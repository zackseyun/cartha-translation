source:
  edition: WLC
  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: hi
  text: परन्तु वे तेरे लोग और तेरी विरासत[a] हैं, जिन्हें तू अपनी महान शक्ति और अपनी फैलाई हुई भुजा[b] से निकाल लाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वे तेरे लोग और तेरी विरासत हैं।” हिब्रू संयोजक का सामान्य अर्थ “और” भी हो सकता है; “परन्तु” मूसा की विनती में निहित सम्भावित विरोध को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “फैलाई हुई भुजा” निर्गमन से जुड़ी एक प्रचलित अभिव्यक्ति है, जो यहोवा के सामर्थी उद्धार को दर्शाती है।
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: परन्तु वे
  rationale: वाव का मूल अर्थ ‘और’ हो सकता है, पर पिछले विनाश-विनती के संदर्भ में यहाँ विरोधात्मक भाव स्वाभाविक है; ‘परन्तु’ उसे स्पष्ट करते हुए हिब्रू की सम्भावित अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: עַמְּךָ
  choice: तेरी प्रजा
  rationale: עַם यहाँ परमेश्वर से सम्बन्धित इस्राएल के लोगों को दर्शाता है; ‘प्रजा’ हिन्दी में सामूहिक और सम्बन्धपरक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנַחֲלָתֶךָ
  choice: और तेरा निज भाग
  rationale: נַחֲלָה का अर्थ विरासत अथवा आवंटित अधिकार-भाग है। परमेश्वर के विषय में हिन्दी का ‘निज भाग’ स्वामित्व और वाचा-सम्बन्ध को बनाए रखता है तथा ‘विरासत’ से उत्पन्न होने वाली उत्तराधिकारी की सम्भावित भ्रामक धारणा से बचता है।
- source_word: אֲשֶׁר
  choice: जिन्हें
  rationale: सम्बन्धवाचक सर्वनाम व्यक्तियों के समूह ‘प्रजा’ की ओर संकेत करता है, इसलिए ‘जिन्हें’ उपयुक्त है।
- source_word: הוֹצֵאתָ
  choice: निकाल लाया है
  rationale: יצא के हिफ़ील रूप का यहाँ निर्गमन-सूचक अर्थ ‘बाहर निकालना’ है; ‘निकाल लाया’ हिन्दी में इस उद्धारकारी कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: अपने महान सामर्थ्य से
  rationale: כֹּחַ शक्ति या सामर्थ्य और גָּדוֹל महानता दर्शाते हैं; करणसूचक בְּ को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: और अपनी बढ़ाई हुई भुजा से
  rationale: यह निर्गमन-वर्णन में परमेश्वर के सामर्थी उद्धार का स्थापित सजीव रूपक है। ‘बढ़ाई हुई भुजा’ मूल मानवीकरण को अमूर्त किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानवीकरण
  choice: ‘अपनी बढ़ाई हुई भुजा’ के सजीव रूपक को बनाए रखा गया।
  alternative: ‘अपने सामर्थी कामों से’ जैसे भावानुवाद का प्रयोग।
  rationale: हिब्रू जानबूझकर देह-संबंधी बिम्ब द्वारा परमेश्वर के प्रबल उद्धार को व्यक्त करता है; इसे बनाए रखने से निर्गमन-भाषा की साहित्यिक और धर्मवैचारिक शक्ति सुरक्षित रहती है।
- issue: נַחֲלָה में वाचागत अधिकार-भाग
  choice: ‘तेरा निज भाग’
  alternative: ‘तेरी विरासत’ या ‘तेरी सम्पत्ति’
  rationale: ‘निज भाग’ इस्राएल के परमेश्वर से विशेष सम्बन्ध और उसके अपने ठहराए हुए भाग होने का भाव रखता है, बिना यह संकेत दिए कि परमेश्वर ने किसी पूर्व स्वामी से विरासत पाई।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। प्रार्थना के प्रत्यक्ष सम्बोधन के अनुरूप एकवचन ‘तेरी/तू’ रखा गया है। ‘निज भाग’ बाइबलीय गरिमा और सहज बोध के बीच संतुलन रखता है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
