base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: hi
  text: और तबेरा में, मस्सा में, और किब्रोत-हत्तावाह[a] में तुम यहवे को क्रोधित करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किब्रोत-हत्तावाह” स्थान का नाम है; इसका शाब्दिक अर्थ “लालसा की कब्रें” या “अभिलाषा की कब्रें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: और तबएरा में
  rationale: संयोजक וּ और स्थानसूचक בְ को स्वाभाविक हिन्दी में ‘और ... में’ कहा गया है; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: וּ/בְ/מַסָּה
  choice: मस्सा में
  rationale: בְ यहाँ स्थान को सूचित करता है। नाम को अनूदित करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: और किब्रोत-हत्तावाह में भी
  rationale: यह एक निश्चित स्थान-नाम है, इसलिए इसका लिप्यंतरण मुख्य पाठ में रखा गया है; उसके घटकों का शाब्दिक अर्थ पादटिप्पणी में दिया गया है। ‘भी’ हिन्दी में स्थानों की सूची और निरंतर आरोप को स्वाभाविक बनाता है।
- source_word: מַקְצִפִים
  choice: क्रोध दिलाते
  rationale: קצף के हिफ़ील कृदन्त का कारणवाचक भाव है—किसी को क्रोधित करना या क्रोध भड़काना। ‘क्रोध दिलाते’ इसे सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: הֱיִיתֶם
  choice: रहे
  rationale: היה और कृदन्त का मेल भूतकाल में जारी या बार-बार होने वाली क्रिया दर्शाता है; ‘दिलाते रहे’ उस निरंतर/पुनरावृत्त भाव को व्यक्त करता है।
- source_word: אֶת יְהוָה
  choice: यहवे को
  rationale: אֶת प्रत्यक्ष कर्म को चिह्नित करता है, जिसे हिन्दी का ‘को’ व्यक्त करता है। יהוה को उसके व्यक्तिगत वाचा-नाम के लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: इस्राएल के आचरण का कालगत स्वरूप
  choice: क्रोध दिलाते रहे
  alternative: क्रोधित किया
  rationale: הֱיִיתֶם के साथ हिफ़ील कृदन्त जारी या बार-बार होने वाली भूतकालीन क्रिया का संकेत देता है; इसलिए एकमात्र पूर्ण घटना का भाव नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। तीनों स्थान-नाम लिप्यंतरित हैं और मूल की आरोपात्मक पुनरावृत्ति को ‘... में ... में ... में भी’ तथा ‘दिलाते रहे’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
