    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: नप्ताली के पूरे क्षेत्र को
  rationale: जनजातीय नाम यहाँ भौगोलिक सूची में है; इसलिए ‘क्षेत्र’ निहित भूभाग-संबंधी अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: एप्रैम और मनश्शे के देश को
  rationale: אֶרֶץ का मूल अर्थ ‘देश/भूमि’ है; दोनों जनजातीय नाम संयुक्त रूप से उस भूभाग को बताते हैं।
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: यहूदा के पूरे देश को
  rationale: स्पष्ट אֶרֶץ को ‘देश’ से व्यक्त किया गया है और כָּל को ‘पूरे’ से, जिससे भौगोलिक विस्तार बना रहता है।
- source_word: עַד
  choice: तक
  rationale: सीमा अथवा दृश्य विस्तार के अंतिम बिंदु को हिन्दी में संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַיָּם הָאַחֲרוֹן
  choice: पश्चिमी सागर
  rationale: शाब्दिक रूप से ‘पिछला/अंतिम सागर’; प्राचीन इब्रानी दिशाबोध में यह पश्चिम के समुद्र को सूचित करता है। मुख्य पाठ में मुहावरे का अर्थ दिया गया है, जबकि शाब्दिक रूप और पहचान पादटिप्पणी में रखी गई है।
