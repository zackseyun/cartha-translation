  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: hi
  text: नून का पुत्र यहोशू बुद्धि की आत्मा से परिपूर्ण था[a], क्योंकि मूसा ने अपने हाथ उस पर रखे थे। तब इस्राएल के पुत्रों[b] ने उसकी बात सुनी और वैसा ही किया जैसा यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘बुद्धि की आत्मा से भरा हुआ था’ भी हो सकता है। इब्रानी अभिव्यक्ति सामान्य रूप से बुद्धिमान स्वभाव या विशेष रूप से परमेश्वर द्वारा दी गई सामर्थ्य—दोनों ओर संकेत कर सकती है।
    reason: alternative_reading
  - marker: b
    text: या ‘इस्राएलियों’ अथवा ‘इस्राएल की संतानों।’ मूलतः, ‘इस्राएल के पुत्रों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: बुद्धि की आत्मा से परिपूर्ण था
  rationale: विशेषण מָלֵא का स्वाभाविक अर्थ ‘परिपूर्ण था’ है। ‘बुद्धि की आत्मा’ इब्रानी संबंध-वाक्यांश को बनाए रखता है और यह तय नहीं करता कि यहाँ सामान्य बुद्धिमत्ता का गुण अभिप्रेत है या परमेश्वर की ओर से विशेष सामर्थ्य।
- source_word: רוּחַ
  choice: आत्मा
  rationale: इस प्रसंग में רוּחַ बुद्धि प्रदान करने वाली आत्मिक सामर्थ्य को सूचित करता है। हिन्दी लिपि में बड़े और छोटे अक्षर का भेद नहीं है, इसलिए संभावित दिव्य आशय को पादटिप्पणी में स्पष्ट किया गया है, बिना उसे अनिवार्य रूप से पवित्र आत्मा की स्पष्ट उपाधि बनाए।
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: अपने हाथ उस पर रखे थे
  rationale: यह हाथ रखने की औपचारिक क्रिया का प्रचलित और स्वाभाविक हिन्दी रूप है; बहुवचन ‘हाथ’ मूल पाठ के יָדָיו को सुरक्षित रखता है।
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: उसकी बात मानी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने से बढ़कर ध्यान देकर स्वीकार करने और आज्ञा मानने का भाव रखता है। अगला वाक्यांश इस आज्ञापालन को कार्य में परिणत दिखाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह अनुवाद मूल के पुरुषवाची पारिवारिक और वाचागत रूप को बनाए रखता है। सामान्य आधुनिक विकल्प ‘इस्राएली’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: वैसा ही किया जैसा यहोवा ने मूसा को आज्ञा दी थी
  rationale: यह आधुनिक हिन्दी में सहज है और इस बात को सुरक्षित रखता है कि लोगों का आचरण मूसा को पहले दी गई यहोवा की आज्ञा के अनुरूप था।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किया गया।
theological_decisions:
- issue: क्या רוּחַ חָכְמָה को पवित्र आत्मा का स्पष्ट उल्लेख माना जाए
  choice: ‘बुद्धि की आत्मा’ रखा गया है और उसकी व्यापक अथवा विशिष्ट दिव्य व्याख्या को खुला छोड़ा गया है।
  alternative: ‘बुद्धि का आत्मा’ या स्पष्ट रूप से ‘पवित्र आत्मा, जो बुद्धि देता है’
  rationale: यह पद यहोशू को परमेश्वर की ओर से सामर्थ्य और बुद्धि प्राप्त व्यक्ति के रूप में प्रस्तुत करता है, पर इब्रानी वाक्यांश स्वयं पवित्र आत्मा की स्पष्ट पहचान को अनिवार्य नहीं बनाता।
- issue: בְּנֵי יִשְׂרָאֵל में लिंग और पारिवारिक भाषा
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मूल पाठ का पुरुषवाची बहुवचन और वाचा-संबंधी पारिवारिक रूप सुरक्षित रखा गया है; अधिक सामान्य सामूहिक रूप पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परिपूर्ण था’ औपचारिक किंतु प्रचलित बाइबलीय अभिव्यक्ति है। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न हाथ रखने के बाद था, जबकि उसकी पादटिप्पणी בְּנֵי יִשְׂרָאֵל से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [b] को ‘इस्राएल के पुत्रों’ के बाद सही स्थान पर रखा गया है।
