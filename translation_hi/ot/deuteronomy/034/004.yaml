base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: hi
  text: और याहवे ने उससे कहा, “यह वह देश है जिसके विषय में मैंने अब्राहम, इसहाक और याकूब से यह कहकर शपथ खाई थी, ‘मैं इसे तुम्हारे वंश[a] को दूँगा।’ मैंने तुम्हें इसे तुम्हारी अपनी आँखों से दिखाया है, पर तुम वहाँ पार नहीं जाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बीज।” इब्रानी में यह शब्द एकवचन रूप में प्रयुक्त सामूहिक संज्ञा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: זֹאת הָאָרֶץ
  choice: यह वही देश है
  rationale: यहाँ אֶרֶץ वाचा में प्रतिज्ञा किए गए देश को दर्शाता है; ‘वही’ पूर्ववर्ती दर्शन के संदर्भ में संकेत की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने ... शपथ खाकर कहा था
  rationale: क्रिया के शपथ-संबंधी स्पष्ट अर्थ को सुरक्षित रखते हुए לֵאמֹר के साथ सहज हिन्दी वाक्य बनाया गया है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब से
  rationale: तीनों कुलपतियों के नाम और उनसे की गई शपथ का संबंध स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है।
- source_word: לְזַרְעֲךָ
  choice: तुम्हारे वंश[a] को
  rationale: זֶרַע यहाँ रूप में एकवचन किंतु अर्थ में सामूहिक संज्ञा है। ‘वंश’ उस सामूहिकता और वाचा की निरंतरता को सहज हिन्दी में बनाए रखता है।
- source_word: אֶתְּנֶנָּה
  choice: मैं इसे ... दूँगा
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ देश से है और प्रतिज्ञा का भविष्यकाल स्पष्ट रखा गया है।
- source_word: הֶרְאִיתִיךָ בְעֵינֶיךָ
  choice: मैंने तुम्हें इसे अपनी आँखों से देखने दिया है
  rationale: हिफ़ील रूप की प्रेरणार्थक छाया और प्रत्यक्ष, व्यक्तिगत दर्शन पर बल—दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: पर तुम उस पार नहीं जाओगे
  rationale: ‘उस पार’ पार करने की स्थानिक छवि और गंतव्य—दोनों को संक्षेप में व्यक्त करता है; ‘पर’ दर्शन और प्रवेश-निषेध का विरोध स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरीय वाचा-नाम है। उसका लिप्यंतरण नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: कुलपतियों की प्रतिज्ञा में זֶרַע का अर्थ
  choice: वंश
  alternative: बीज; वंशज
  rationale: मूल शब्द व्याकरणिक रूप से एकवचन और अर्थ में सामूहिक है। ‘वंश’ इस सामूहिक एकवचन को बनाए रखता है, जबकि ‘वंशज’ बहुवचन को अधिक स्पष्ट कर देता और ‘बीज’ आधुनिक हिन्दी में यहाँ कम स्वाभाविक होता।
- issue: मूसा को देश दिखाने और उसमें प्रवेश न देने का तनाव
  choice: देखने दिया है, पर ... नहीं जाओगे
  alternative: दिखाया है, लेकिन ... प्रवेश नहीं करोगे
  rationale: अनुवाद दर्शन की अनुमति और सीमा के बीच मूल विरोध को बनाए रखता है तथा ‘प्रवेश’ कहकर पार जाने की भौगोलिक छवि को अनावश्यक रूप से नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर की सीधी वाणी में सम्मानसूचक बहुवचन के बजाय निकट, प्रत्यक्ष एकवचन भाव है; फिर भी आधुनिक हिन्दी की पठनीयता के लिए ‘तुम/तुम्हारे’ रूप अपनाए गए हैं।
