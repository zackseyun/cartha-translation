base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/008.yaml
  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: hi
  text: इस्राएलियों ने मोआब के मैदानों में मूसा के लिए तीस दिन तक रोए। तब मूसा के लिए रोने और शोक मनाने के दिन पूरे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: विलाप किया
  rationale: בכה का मूल अर्थ रोना है; मृत्यु के प्रसंग में ‘विलाप किया’ स्वाभाविक और गरिमापूर्ण है, जबकि आगे का ‘रोने और शोक मनाने’ वाला पदबंध मूल की पुनरुक्ति को बनाए रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का सामान्य जातिनाम है; आधुनिक हिन्दी में ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा के लिए
  rationale: בכה के साथ אֶת उस व्यक्ति को सूचित करता है जिसकी मृत्यु पर रोया जाता है; हिन्दी में ‘मूसा के लिए विलाप किया’ इस संबंध को स्पष्ट करता है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עַרְבוֹת समतल अथवा मैदानी भूभाग को दर्शाता है; ‘मैदानों’ स्थापित और सहज भौगोलिक अनुवाद है।
- source_word: שְׁלֹשִׁים יוֹם
  choice: तीस दिन तक
  rationale: संख्या और कालावधि का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: וַיִּתְּמוּ
  choice: पूरे हुए
  rationale: תם यहाँ अवधि के पूर्ण होकर समाप्त होने को व्यक्त करता है; ‘पूरे हुए’ परिणामात्मक भाव को रखते हुए स्वाभाविक हिन्दी है।
- source_word: יְמֵי בְכִי אֵבֶל מֹשֶׁה
  choice: मूसा के लिए रोने और शोक मनाने के दिन
  rationale: सघन इब्रानी पदबंध में रोना और शोक दोनों जुड़े हैं। हिन्दी में संयोजक पदबंध मूल के सभी अर्थ-घटकों को स्पष्ट और सहज रूप से रखता है।
