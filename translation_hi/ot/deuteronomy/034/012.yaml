  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: hi
  text: और उन सभी पराक्रमी कार्यों[a] और उन सभी महान भयावह कार्यों[b] के लिए, जिन्हें मूसा ने सारे इस्राएल की आँखों के सामने[c] किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उस शक्तिशाली हाथ के सारे [कार्य]” या “सारा शक्तिशाली हाथ।” इब्रानी में “हाथ” शक्ति या सामर्थ्य का बिंब हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सारा बड़ा भय,” “महान आतंक,” अथवा “महान विस्मयकारी कार्य।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “सारे इस्राएल की आँखों के सामने,” अर्थात पूरी प्रजा के देखते हुए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל הַיָּד הַחֲזָקָה
  choice: और उन सभी सामर्थी कामों के कारण भी
  rationale: ‘सामर्थी हाथ’ इब्रानी में शक्ति और उसके द्वारा किए गए कार्यों का बिंब है। प्रसंग मूसा के कार्यों का सार प्रस्तुत करता है; इसलिए स्वाभाविक हिन्दी में भाव स्पष्ट किया गया है, जबकि शाब्दिक बिंब पादटिप्पणी में रखा गया है। לְ को पिछले वाक्य से जुड़ी कारणसूचक रचना ‘के कारण’ से व्यक्त किया गया है।
- source_word: וּלְכֹל הַמּוֹרָא הַגָּדוֹל
  choice: तथा उन सभी महान और भयप्रद कामों के कारण भी
  rationale: מוֹרָא भय, आतंक अथवा भय-विस्मय उत्पन्न करनेवाले प्रदर्शन या कार्य को सूचित कर सकता है। ‘महान और भयप्रद काम’ यहाँ वस्तुगत, विस्मयकारी कार्यों का स्वाभाविक हिन्दी वर्णन है और केवल आंतरिक भावना तक अर्थ को सीमित नहीं करता।
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: जिन्हें मूसा ने ... किया था
  rationale: עָשָׂה का सीधा अर्थ ‘करना’ है। बहुवचन ‘कामों’ के अनुसार सम्बन्धवाचक रचना को हिन्दी में स्वाभाविक बनाया गया है।
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल की आँखों के सामने
  rationale: मूल का ठोस नेत्र-बिंब सुरक्षित रखते हुए यह स्पष्ट किया गया है कि ये कार्य पूरी प्रजा के सामने सार्वजनिक रूप से हुए।
theological_decisions:
- issue: मूसा के कार्यों की अंतिम प्रशंसा का स्वरूप
  choice: इसे मूसा द्वारा पूरी इस्राएली प्रजा के सामने किए गए सामर्थी और भय-विस्मय उत्पन्न करनेवाले कार्यों का सार माना गया है।
  alternative: ‘सामर्थी हाथ’ और ‘महान आतंक’ जैसे अधिक शाब्दिक पदों का प्रयोग।
  rationale: अनुवाद मूल की भव्यता और सार्वजनिक दृश्यता बनाए रखता है, पर बाद की कोई धर्मवैज्ञानिक व्याख्या अथवा विशिष्ट साम्प्रदायिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। यह पद पिछले वाक्य की निरंतरता है; इसलिए आरम्भ में ‘और’ तथा सम्बन्धसूचक ‘के कारण भी’ बनाए गए हैं।
