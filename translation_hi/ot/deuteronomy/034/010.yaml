lexical_decisions:
- source_word: וְלֹא
  choice: फिर ... कोई ... नहीं
  rationale: संयोजक और निषेध को स्वाभाविक हिन्दी में कथात्मक निष्कर्ष के रूप में व्यक्त किया गया है; इससे मूल में निहित क्रम बना रहता है, बिना अनावश्यक विरोध जोड़े।
- source_word: קָם
  choice: उठा
  rationale: नबी के प्रकट होने के लिए हिन्दी बाइबलीय और स्वाभाविक प्रयोग ‘उठना’ मूल क्रिया קום के रूपक को भी बनाए रखता है।
- source_word: נָבִיא
  choice: नबी
  rationale: यह נָבִיא का प्रचलित, स्पष्ट और धर्म-सांप्रदायिक रूप से निरपेक्ष हिन्दी रूप है।
- source_word: עוֹד
  choice: फिर
  rationale: यहाँ עוֹד मूसा के बाद पुनः या आगे किसी तुलनीय नबी के न उठने का कालगत भाव देता है। ‘फिर’ आधुनिक हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है; ‘अब तक’ भी संभव है, इसलिए पादटिप्पणी दी गई है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: בְּ का क्षेत्रगत अर्थ सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: כְּמֹשֶׁה
  choice: मूसा के समान
  rationale: तुलनासूचक כְּ का औपचारिक किंतु सहज हिन्दी प्रतिरूप है।
- source_word: אֲשֶׁר יְדָעוֹ
  choice: जिसे ... जानता था
  rationale: मूसा यहाँ ‘जानना’ क्रिया का कर्म है। हिन्दी में ‘जिसे’ इस व्याकरणिक संबंध को स्पष्ट रखता है और ידע के संबंधपरक अर्थ को अधिक व्याख्यायित नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: פָּנִים אֶל פָּנִים
  choice: आमने-सामने
  rationale: यह मूल के ठोस मुहावरे और प्रत्यक्ष संबंध की छवि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यहोवा और मूसा के संबंध का मानव-सदृश वर्णन
  choice: ‘आमने-सामने’ मुहावरे को यथावत रखना
  alternative: ‘प्रत्यक्ष रूप से’ या ‘व्यक्तिगत रूप से’ जानना
  rationale: मूल पाठ ठोस संबंधपरक भाषा का उपयोग करता है। ‘आमने-सामने’ विशिष्ट निकटता और प्रत्यक्षता को बनाए रखता है, पर परमेश्वर के शारीरिक स्वरूप के बारे में कोई अतिरिक्त निष्कर्ष नहीं थोपता।
- issue: יְדָעוֹ में जानने की दिशा
  choice: ‘जिसे यहोवा ... जानता था’
  alternative: ‘जो यहोवा को ... जानता था’
  rationale: प्रत्यय וֹ मूसा को क्रिया का कर्म बनाता है; अतः पाठ यह कहता है कि यहोवा मूसा को जानता था। दिशा उलटने से मूल व्याकरण और संबंधपरक बल बदल जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नबी’, ‘मूसा’, ‘इस्राएल’ और ‘यहोवा’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। वाक्य में मूल की कालगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी के द्वारा सुरक्षित रखा गया है।
