  rationale: भौगोलिक प्रयोग में यह यरदन की विस्तृत समतल निचली भूमि को सूचित करता है। ‘तराई’ आधुनिक हिन्दी में इस भू-आकृति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּקְעַת יְרֵחוֹ
  choice: यरीहो की घाटी
  rationale: בִּקְעָה चौड़ी घाटी या मैदान को दर्शाता है। ‘घाटी’ הַכִּכָּר के लिए प्रयुक्त ‘तराई’ से भेद रखते हुए स्थलाकृतिक अर्थ बनाए रखता है।
- source_word: עִיר הַתְּמָרִים
  choice: खजूर के पेड़ों का नगर
  rationale: यह यरीहो का वर्णनात्मक उपनाम है और मूल रूपक को स्पष्ट, सहज हिन्दी में बनाए रखता है।
- source_word: עַד צֹעַר
  choice: सोअर तक
  rationale: עַד विस्तार की सीमा बताता है; ‘तक’ हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וְאֶת ... וְאֶת
  choice: और ... और
  rationale: दोहराया हुआ संयोजक इस संचयी सूची की शैली को बनाए रखता है।
