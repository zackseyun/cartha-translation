source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: hi
  text: मूसा की उम्र एक सौ बीस वर्ष थी जब उसकी मृत्यु हुई। उसकी आँख की ज्योति धुँधली नहीं हुई थी[a], और उसकी जीवन-शक्ति क्षीण नहीं हुई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी दृष्टि कमजोर नहीं हुई थी।” इब्रानी में शाब्दिक रूप से “उसकी आँख धुँधली नहीं हुई थी।”
    reason: lexical_alternative
  - marker: b
    text: या “उसकी शारीरिक स्फूर्ति कम नहीं हुई थी” अथवा “उसका स्वाभाविक बल घटा नहीं था।” इब्रानी मुहावरा शरीर की बनी हुई ताजगी या जीवन-शक्ति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: मूसा
  rationale: आरंभिक וְ कथानक को आगे बढ़ाता है; हिंदी में अलग संयोजक जोड़े बिना नाम से वाक्य आरंभ करना स्वाभाविक है।
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: मूसा की उम्र एक सौ बीस वर्ष थी
  rationale: ‘इतने वर्षों का पुत्र’ आयु बताने वाला इब्रानी मुहावरा है; यह आधुनिक हिंदी में उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: בְּמֹתוֹ
  choice: जब उसकी मृत्यु हुई
  rationale: पूर्वसर्ग בְ यहाँ कालवाचक है; यह रूप ‘उसकी मृत्यु के समय’ का सहज हिंदी समतुल्य है।
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: उसकी आँख की ज्योति धुँधली नहीं हुई थी
  rationale: כָהָה मंद या दुर्बल होने को व्यक्त करता है। एकवचन ‘आँख’ को रखते हुए ‘आँख की ज्योति’ हिंदी में दृष्टि का स्वाभाविक बोध कराता है।
- source_word: וְלֹא נָס לֵחֹה
  choice: और उसकी जीवन-शक्ति क्षीण नहीं हुई थी
  rationale: לֵחַ शाब्दिक रूप से ताजगी या नमी और इस प्रसंग में देह की स्फूर्ति अथवा जीवन-शक्ति को सूचित करता है। נוּס का मूल अर्थ ‘भाग जाना’ है, पर पूरा मुहावरा शक्ति के न घटने को बताता है; हिंदी में ‘क्षीण नहीं हुई’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: לֵחֹה का आशय
  choice: जीवन-शक्ति
  alternative: शारीरिक स्फूर्ति / स्वाभाविक बल / ताजगी
  rationale: दुर्लभ संज्ञा का आशय केवल मांसपेशीय बल तक सीमित करना निश्चित नहीं है। ‘जीवन-शक्ति’ देहगत स्फूर्ति और जीवंतता की व्यापकता बनाए रखता है, बिना किसी विशेष धर्मवैज्ञानिक अर्थ को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक गद्य। ‘आँख’ का इब्रानी एकवचन सुरक्षित रखा गया है, जबकि ‘आँख की ज्योति’ हिंदी पाठक को दृष्टि का अभिप्राय स्पष्ट करता है। मुख्य पाठ में दुर्लभ इब्रानी मुहावरे को स्वाभाविक हिंदी में दिया गया है और उसके अधिक शाब्दिक अथवा वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
