reference: Deuteronomy 34:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: hi
  text: 'तब मूसा मोआब के मैदान से नबो पर्वत पर, पिसगा की चोटी तक चढ़ गया, जो यरीहो के सामने है। और याहवे ने उसे सारी भूमि दिखाई: गिलाद से लेकर दान तक।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गया
  rationale: עלה ऊपर की ओर जाने को व्यक्त करता है। पर्वत के संदर्भ में ‘चढ़ गया’ स्वाभाविक और दिशात्मक अर्थ को सुरक्षित रखता है।
- source_word: מֵעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों से
  rationale: עַרְבוֹת यहाँ मोआब के समतल मैदानी क्षेत्र को सूचित करता है; ‘मैदानों’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַר נְבוֹ
  choice: नबो पर्वत
  rationale: हिन्दी में הַר और स्थान-नाम का स्वाभाविक रूप ‘नबो पर्वत’ है।
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: पिसगा की चोटी
  rationale: רֹאשׁ का मूल अर्थ ‘सिर’ है, पर यहाँ स्थलाकृतिक अर्थ ‘चोटी’ है। पिसगा को स्रोत के अनुसार विशिष्ट नाम के रूप में रखा गया है।
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: जो यरीहो के सामने है
  rationale: भौगोलिक संदर्भ में עַל־פְּנֵי का अर्थ ‘के सामने/सम्मुख’ है; यह अनावश्यक रूप से सटीक दूरी का दावा किए बिना स्थिति बताता है।
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: यहोवा ने उसे ... दिखाया
  rationale: ראה का हिफ़ील रूप कारणवाचक है—‘देखने दिया/दिखाया’। ‘दिखाया’ आधुनिक हिन्दी में सर्वाधिक स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, किसी पदवी से प्रतिस्थापित नहीं किया गया।
- source_word: כָּל הָאָרֶץ
  choice: पूरा देश
  rationale: הָאָרֶץ यहाँ समस्त पृथ्वी नहीं, सामने दिखाई जा रही भूमि/देश को सूचित करता है। ‘पूरा देश’ हिन्दी में संदर्भानुकूल है।
- source_word: אֶת הַגִּלְעָד עַד דָּן
  choice: गिलाद से लेकर दान तक
  rationale: עַד सीमा या विस्तार को दर्शाता है। ‘से लेकर ... तक’ हिन्दी में भौगोलिक विस्तार का स्वाभाविक रूप है और गिलाद से आरम्भ होने वाली सूची को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों में पहचाने जाने योग्य लिप्यंतरण ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसी पदवी से नहीं बदला गया।
- issue: וַיַּרְאֵהוּ की कारणवाचकता
  choice: यहोवा ने उसे ... दिखाया
  alternative: यहोवा ने उसे ... देखने दिया
  rationale: दोनों रूप हिफ़ील की कारणवाचकता व्यक्त कर सकते हैं। ‘दिखाया’ अधिक स्वाभाविक है और यह दावा नहीं करता कि मूसा ने अपनी सामान्य दृष्टि से स्वतंत्र रूप से सब कुछ देखा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-क्रम मूल की प्रगति का अनुसरण करता है। अंतिम उपवाक्य को द्विबिंदु के बाद भूमि के विस्तार के रूप में प्रस्तुत किया गया है।
