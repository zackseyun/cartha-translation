  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: hi
  text: और उसने मोआब देश की घाटी में, बेत-पोर के सामने, उसे दफ़नाया[a]; और आज तक कोई नहीं जानता कि उसकी कब्र कहाँ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘उसने’ का कर्ता बताया नहीं गया है; पिछले पद के संदर्भ से संकेत यहोवा की ओर है।
    reason: मूल पाठ में अनाम कर्ता की वास्तविक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: और उसने उसे दफ़नाया
  rationale: क्रिया क़ाल 3 पुल्लिंग एकवचन में सक्रिय है। हिंदी का ‘उसने’ कर्ता को अनाम रखते हुए इब्रानी की व्याकरणिक अस्पष्टता बनाए रखता है; ‘उसे दफ़नाया गया’ करने की आवश्यकता नहीं है।
- source_word: בַגַּיְ
  choice: घाटी में
  rationale: גַּיְ घाटी या खड्ड को दर्शा सकता है; इस स्थल-वर्णन में ‘घाटी’ स्वाभाविक और सर्वसुलभ है।
- source_word: בְּאֶרֶץ מוֹאָב
  choice: मोआब देश की
  rationale: यह इब्रानी के ठोस पदबंध ‘मोआब के देश में’ का अर्थ सुरक्षित रखते हुए हिंदी वाक्य में ‘घाटी’ के साथ स्वाभाविक संबंध बनाता है।
- source_word: מוּל
  choice: के सामने
  rationale: स्थान-सूचक מוּל का अर्थ किसी स्थान के सामने या आमने-सामने होना है; ‘के सामने’ आधुनिक हिंदी में स्पष्ट है।
- source_word: בֵּית פְּעוֹר
  choice: बेत-पोर
  rationale: स्थान-नाम का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וְלֹא יָדַע אִישׁ
  choice: और ... कोई नहीं जानता
  rationale: אִישׁ यहाँ सामान्य मानवीय अर्थ में प्रयुक्त है। ‘कोई नहीं जानता’ इसका स्वाभाविक, समावेशी और अर्थ-सटीक आधुनिक हिंदी रूप है।
- source_word: קְבֻרָתוֹ
  choice: उसकी कब्र कहाँ है
  rationale: संदर्भ में संज्ञा दफ़न किए जाने के स्थान को बताती है। हिंदी में ‘उसकी कब्र कहाँ है’ स्थान के अज्ञात होने का आशय ‘उसका दफ़न-स्थान’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी काल-सूचक पदबंध का प्रचलित और स्वाभाविक हिंदी समतुल्य है तथा कथाकार के समय तक जारी स्थिति बताता है।
theological_decisions:
- issue: ‘उसने उसे दफ़नाया’ में कर्ता की पहचान
  choice: मुख्य पाठ में अनाम सर्वनाम ‘उसने’ रखा गया है।
  alternative: पिछले पद के आधार पर स्पष्ट रूप से ‘यहोवा ने’ कहना, अथवा कर्मवाच्य ‘उसे दफ़नाया गया’ करना।
  rationale: पद 5 के निकट संदर्भ से यहोवा कर्ता प्रतीत होता है, पर इस पद में कर्ता का नाम नहीं दिया गया। ‘उसने’ मूल पाठ की सक्रिय रचना और वास्तविक अस्पष्टता दोनों को सुरक्षित रखता है।
- issue: सामान्य अर्थ वाला אִישׁ
  choice: ‘कोई नहीं जानता’
  alternative: ‘कोई पुरुष नहीं जानता’ या ‘किसी मनुष्य को मालूम नहीं’।
  rationale: אִישׁ का यहाँ आशय किसी भी व्यक्ति से है, केवल पुरुषों से नहीं। ‘कोई नहीं जानता’ आधुनिक हिंदी में इसी सामान्य अर्थ को बिना अनावश्यक लैंगिक सीमांकन के ठीक व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सक्रिय वाक्य-विन्यास मूल इब्रानी के अनुरूप है; स्थान-नाम ‘बेत-पोर’ लिप्यंतरित है। ‘दफ़नाया’ और ‘कब्र’ सामान्य आधुनिक हिंदी में स्पष्ट हैं।
