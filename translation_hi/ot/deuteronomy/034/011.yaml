source:
  edition: WLC
  text: לְ/כָל הָ֨/אֹת֜וֹת וְ/הַ/מּוֹפְתִ֗ים אֲשֶׁ֤ר שְׁלָח/וֹ֙ יְהוָ֔ה לַ/עֲשׂ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: hi
  text: और उन सब चिन्हों और अद्भुत कामों में, जिन्हें करने के लिए याहवे ने उसे मिस्र देश में फ़िरौन, उसके सब सेवकों और उसके सारे देश की ओर भेजा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: उन सब चिन्हों और अद्भुत कामों में भी
  rationale: आरम्भिक לְכָל पिछले पद के कथन पर निर्भर है और उस क्षेत्र को आगे बढ़ाता है जिसमें मूसा बेजोड़ था। ‘में भी’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है। ‘चिन्ह’ אוֹת का व्यापक अर्थ रखता है, और ‘अद्भुत काम’ מוֹפֵת के आश्चर्य उत्पन्न करने वाले कार्यों के भाव को स्पष्ट करता है।
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: जिन्हें करने के लिए याहवे ने उसे ... भेजा था
  rationale: यह वाक्यांश सीधे बताता है कि याहवे ने मूसा को इन कार्यों को करने के लिए भेजा था। ‘करने’ עשה की व्यापकता को बिना अनावश्यक व्याख्या के रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: मिस्र देश में
  rationale: यह इब्रानी में आए ‘मिस्र देश’ के पूर्ण रूप को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: फ़िरौन, उसके सब सेवकों और उसके सारे देश के प्रति
  rationale: बार-बार आए לְ को ‘के प्रति’ से संबंधसूचक रूप में रखा गया है। इससे दिशा, लक्ष्य या प्रतिकूल प्रभाव में से किसी एक अर्थ को मुख्य पाठ में निर्णायक रूप से नहीं चुना जाता।
- source_word: עֲבָדָיו
  choice: उसके सब सेवकों
  rationale: עֶבֶד का सीधा अर्थ ‘सेवक’ है; राजकीय प्रसंग में अधिकारी भी सम्मिलित हो सकते हैं, पर ‘सेवक’ स्रोत की शब्दावली के अधिक निकट है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी साम्प्रदायिक व्याख्या को नहीं जोड़ता।
- issue: फ़िरौन और मिस्र के साथ चिन्हों का संबंध
  choice: के प्रति
  alternative: के विरुद्ध; के सामने; पूरे देश में
  rationale: इब्रानी לְ संबंध, दिशा, लक्ष्य या प्रतिकूलता व्यक्त कर सकता है। मुख्य पाठ में ‘के प्रति’ इस वास्तविक अस्पष्टता को यथासंभव खुला रखता है, जबकि पादटिप्पणी प्रसंगानुकूल विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले पद के वाक्य को आगे बढ़ाता है, इसलिए आरम्भ में ‘और’ तथा ‘भी’ रखा गया है। ‘चमत्कारों’ के बजाय ‘अद्भुत कामों’ से מוֹפְתִים का आश्चर्यकारी कार्य वाला भाव सहज हिन्दी में व्यक्त होता है।
