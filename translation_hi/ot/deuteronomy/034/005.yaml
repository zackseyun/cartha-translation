  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: hi
  text: तब याहवे का सेवक मूसा वहाँ मोआब के देश में याहवे के वचन के अनुसार[a] मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख के अनुसार”; इस मुहावरे का अनुवाद “याहवे की आज्ञा से” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: इस प्रकार ... मर गया
  rationale: वय्यिक्तोल कथानक की अगली घटना बताता है। ‘इस प्रकार’ पूर्ववर्ती प्रसंग से क्रम और परिणाम का स्वाभाविक संबंध व्यक्त करता है, जबकि ‘मर गया’ मूल क्रिया מות का सीधा अर्थ रखता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण पिछले पदों में बताए गए स्थान की ओर संकेत करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: עֶבֶד יְהוָה
  choice: यहोवा का सेवक
  rationale: עֶבֶד दास या सेवक दोनों अर्थ दे सकता है, पर यहाँ मूसा की सम्मानपूर्ण, नियुक्त सेवक की उपाधि है; ‘सेवक’ इस प्रसंग में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּאֶרֶץ מוֹאָב
  choice: मोआब देश में
  rationale: मूल में ‘मोआब के देश में’ स्पष्ट है; हिन्दी में ‘मोआब देश में’ उसी भौगोलिक बल को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: शाब्दिक रूप ‘यहोवा के मुँह पर/अनुसार’ एक मुहावरा है, जिसका आशय उसके वचन या आदेश के अनुसार है। मुख्य पाठ में अर्थपूर्ण मुहावरेदार अनुवाद रखा गया और शाब्दिक बिंब व वैकल्पिक अर्थ टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में प्रतिष्ठित ‘यहोवा’ उसे केवल ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना नाम के रूप में प्रस्तुत करता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: मूसा की उपाधि में עֶבֶד का अर्थ
  choice: सेवक
  alternative: दास
  rationale: यहाँ शब्द मूसा के सम्मानपूर्ण वाचा-संबंधी पद को उभारता है। ‘दास’ संभावित कोशीय अर्थ है, किंतु इस संदर्भ में बंधुआ स्थिति पर अनावश्यक बल डाल सकता है।
- issue: עַל פִּי יְהוָה की व्याख्या
  choice: यहोवा के वचन के अनुसार
  alternative: यहोवा की आज्ञा से
  rationale: इब्रानी मुहावरा दोनों अर्थ-छायाएँ सह सकता है। मुख्य पाठ ‘वचन’ को बनाए रखता है और टिप्पणी ‘आज्ञा’ की संभावना तथा मूल मुख-बिंब सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘मोआब देश’ भौगोलिक स्पष्टता बनाए रखता है और ‘वचन के अनुसार’ मूल मुहावरे का अर्थ देते हुए उसकी धार्मिक तथा साहित्यिक गूँज को सुरक्षित रखता है।
