source:
  edition: WLC
  text: כִּ֤י יָדַ֨עְתִּי֙ רַבִּ֣ים פִּשְׁעֵי/כֶ֔ם וַ/עֲצֻמִ֖ים חַטֹּֽאתֵי/כֶ֑ם צֹרְרֵ֤י צַדִּיק֙ לֹ֣קְחֵי כֹ֔פֶר וְ/אֶבְיוֹנִ֖ים בַּ/שַּׁ֥עַר הִטּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/012.yaml
  text: For I know how many your transgressions are, and how great your sins are—oppressors of the righteous[a], takers of a bribe[b], and those who turn aside the needy in the gate.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि तुम्हारे अपराध बहुत अधिक हैं और तुम्हारे पाप बहुत भारी हैं—तुम धर्मी को सताते हो, रिश्वत[a] लेते हो और नगर के फाटक[b] पर जरूरतमंदों को न्याय से वंचित करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार “रिश्वत” है; इसका अधिक सामान्य अर्थ “छुड़ौती” या किसी व्यक्ति के बदले दिया गया भुगतान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'प्राचीन नगरों के फाटक पर मुकदमों की सुनवाई और सार्वजनिक निर्णय हुआ करते थे। अंतिम वाक्यांश का अधिक शाब्दिक अनुवाद हो सकता है: “नगर के फाटक पर जरूरतमंदों को किनारे कर देते हो।”'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है और इब्रानी के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: पूर्ण रूप यहाँ परमेश्वर के दृढ़ और वर्तमान ज्ञान को व्यक्त करता है; हिन्दी का वर्तमान काल इसी अर्थ को सहजता से देता है।
- source_word: רַבִּים פִּשְׁעֵיכֶם
  choice: तुम्हारे अपराध कितने अधिक हैं
  rationale: רַבִּים की बहुलता और פשׁע के जानबूझकर किए गए उल्लंघन/विद्रोह के भाव को बनाए रखता है।
- source_word: וַעֲצֻמִים חַטֹּאתֵיכֶם
  choice: तुम्हारे पाप कितने भारी हैं
  rationale: עֲצֻמִים केवल संख्या नहीं, बल्कि पापों की गंभीरता और प्रबलता भी बताता है; ‘भारी’ इस नैतिक भार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֹרְרֵי צַדִּיק
  choice: तुम धर्मी जन को सताते हो
  rationale: צֹרְרֵי सक्रिय वैरपूर्ण उत्पीड़न बताता है। ‘धर्मी जन’ צַדִּיק के एकवचन, सामान्य प्रतिनिधिक अर्थ को सुरक्षित रखता है।
- source_word: לֹקְחֵי כֹפֶר
  choice: रिश्वत लेते हो
  rationale: न्यायिक भ्रष्टाचार के प्रसंग में כֹפֶר का सबसे संभावित अर्थ अनुचित भुगतान या रिश्वत है; अन्य संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְאֶבְיוֹנִים
  choice: जरूरतमंदों को
  rationale: אֶבְיוֹן आर्थिक और सामाजिक रूप से असहाय व्यक्ति को दर्शाता है; ‘जरूरतमंद’ व्यापक और वर्तमान हिन्दी है।
- source_word: בַּשַּׁעַר
  choice: नगर-फाटक पर
  rationale: प्राचीन नगर का फाटक न्यायिक सुनवाई और सार्वजनिक निर्णयों का स्थान था। ‘नगर’ जोड़ने से आधुनिक पाठक के लिए संकेत स्पष्ट होता है।
- source_word: הִטּוּ
  choice: न्याय से वंचित करते हो
  rationale: נטה का हिफ़ील रूप मूलतः ‘हटा देना/एक ओर मोड़ देना’ है; नगर-फाटक के न्यायिक प्रसंग में इसका आशय जरूरतमंदों को उचित न्याय न देना है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: צַדִּיק का सामाजिक और न्यायिक अर्थ
  choice: धर्मी जन
  alternative: निर्दोष व्यक्ति / न्यायी व्यक्ति
  rationale: शब्द अदालत में निर्दोष पक्ष को भी सूचित कर सकता है, पर ‘धर्मी जन’ इसके व्यापक नैतिक और न्यायिक अर्थ को अनावश्यक रूप से संकुचित नहीं करता।
- issue: הִטּוּ में न्याय से वंचित करने का निहितार्थ
  choice: न्याय से वंचित करते हो
  alternative: किनारे कर देते हो / हटा देते हो
  rationale: नगर-फाटक के स्पष्ट न्यायिक प्रसंग में अर्थगत निहितार्थ को मुख्य पाठ में व्यक्त किया गया है, जबकि क्रिया की अधिक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified किन्तु सरल रूप अपनाया गया है। ‘कितने अधिक’ और ‘कितने भारी’ इब्रानी की बलाघाती विशेषण-रचना को दर्शाते हैं। समानांतर क्रियाओं से इब्रानी कृदंतों का आरोपात्मक बल हिन्दी में स्पष्ट और स्वाभाविक रखा गया है।
