  yaml_path: translation/ot/amos/005/021.yaml
  text: I hate[a], I reject your festivals, and I will not delight in your solemn assemblies.
translation:
  language: hi
  text: मैं तुम्हारे पर्वों से घृणा करता हूँ, उन्हें ठुकराता हूँ; और तुम्हारी गंभीर सभाओं से प्रसन्न न होऊँगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “नहीं सूँघूँगा”—अर्थात् मैं इन्हें स्वीकार या इनसे प्रसन्न नहीं होऊँगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: मैं ... से घृणा करता हूँ
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया यहाँ भविष्यवाणी की सजीव घोषणा में वर्तमान दृढ़ घृणा व्यक्त करती है; वर्तमान काल हिन्दी में इसकी सीधी और प्रबल शक्ति बनाए रखता है।
- source_word: מָאַסְתִּי
  choice: उन्हें ठुकराता हूँ
  rationale: מָאַסְתִּי किसी वस्तु को अस्वीकार्य मानकर नकारने का भाव रखता है। ‘ठुकराता हूँ’ इस सक्रिय अस्वीकृति को सहज आधुनिक हिन्दी में व्यक्त करता है और पहले पद की ‘घृणा’ से भिन्न रहता है।
- source_word: חַגֵּיכֶם
  choice: तुम्हारे पर्वों
  rationale: חַג धार्मिक उत्सव, विशेषकर नियत पर्व, को दर्शाता है। ‘पर्व’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी में स्पष्ट है।
- source_word: וְלֹא אָרִיחַ
  choice: और ... प्रसन्न न होऊँगा
  rationale: אָרִיחַ का मूल बिंब ‘सूँघने’ का है, पर उपासना-संदर्भ में यह सुगंध को स्वीकार करने अथवा उससे प्रसन्न होने का मुहावरा है। सभाएँ इसका संबंधित पद हैं, इसलिए मुख्य पाठ में ‘प्रसन्न न होऊँगा’ अर्थ को स्वाभाविक हिन्दी में देता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: בְּעַצְּרֹתֵיכֶם
  choice: तुम्हारी महासभाओं से
  rationale: עֲצָרָה/עֲצֶרֶת नियत धार्मिक अवसर की औपचारिक सभा को सूचित करता है। ‘महासभा’ उसके बड़े, औपचारिक सामूहिक आयोजन का भाव रखता है, जबकि ‘से’ प्रसन्न होने के हिन्दी मुहावरे के अनुरूप בְּ का संबंध व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा ‘सूँघने’ का मानवरूपी उपासना-संबंधी बिंब
  choice: मुख्य पाठ में ‘प्रसन्न न होऊँगा’ और पादटिप्पणी में शाब्दिक ‘नहीं सूँघूँगा’
  alternative: मुख्य पाठ में ‘तुम्हारी महासभाओं को नहीं सूँघूँगा’
  rationale: इब्रानी में सुगंध सूँघने का बिंब ग्रहणशीलता और प्रसन्नता को व्यक्त करता है। यहाँ संबंधित पद बलि नहीं, सभाएँ हैं, इसलिए केवल शाब्दिक हिन्दी अस्पष्ट और अस्वाभाविक होगी। अर्थ मुख्य पाठ में और वास्तविक बिंब पादटिप्पणी में रखने से दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘घृणा करता हूँ’ तथा ‘ठुकराता हूँ’ मूल की तीखी समानांतर घोषणा बनाए रखते हैं; अर्धविराम अंतिम अस्वीकृति को स्पष्ट रूप से जोड़ता है।
