  yaml_path: translation/ot/amos/005/010.yaml
  text: They hate the one who reproves in the gate[b][a], and they abhor the one who speaks with integrity.
translation:
  language: hi
  text: वे फाटक पर दोष दिखानेवाले से घृणा करते हैं[a], और खराई से बोलनेवाले से घोर घृणा करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “फाटक” से आशय नगर के फाटक से है, जहाँ प्रायः मुकदमों की सुनवाई और सार्वजनिक न्याय होता था।
    reason: cultural_note
  - marker: b
    text: या, “निष्कपटता से बोलनेवाले से” अथवा “सत्यनिष्ठा से बोलनेवाले से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂנְאוּ
  choice: बैर रखते हैं
  rationale: कालगत पूर्ण रूप यहाँ समाज के लगातार दिखाई देनेवाले स्वभाव का वर्णन करता है। “बैर रखते हैं” वर्तमान और निरंतर शत्रुता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַשַּׁעַר
  choice: फाटक पर
  rationale: यह नगर के फाटक को सूचित करता है, जहाँ न्यायिक और सार्वजनिक कार्यवाही होती थी। संक्षिप्त मूल बिंब को मुख्य पाठ में रखा गया है और सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מוֹכִיחַ
  choice: दोष दिखानेवाला
  rationale: यह कृदंत सुधारने, दोष बताने अथवा न्यायिक प्रसंग में किसी को उत्तरदायी ठहरानेवाले व्यक्ति को सूचित कर सकता है। “दोष दिखानेवाला” सामान्य पाठक के लिए सहज है और सुधारात्मक तथा न्यायिक दोनों छायाएँ बनाए रखता है।
- source_word: וְדֹבֵר
  choice: और ... बोलनेवाला
  rationale: कृदंत रूप को पहले कृदंत के समानांतर “बोलनेवाला” से व्यक्त किया गया है।
- source_word: תָּמִים
  choice: खराई से
  rationale: इस शब्द में संपूर्णता, निर्दोषता और सत्यनिष्ठा का भाव है। क्रियाविशेषणीय समझ के अनुसार “खराई से” स्वाभाविक आधुनिक हिन्दी है; वस्तु के रूप में पढ़े जाने की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: יְתָעֵבוּ
  choice: घृणा करते हैं
  rationale: पिएल रूप तीव्र वितृष्णा प्रकट करता है। “घृणा करते हैं” पहले खंड के “बैर रखते हैं” से अलग रहते हुए इसकी तीव्रता को स्पष्ट करता है।
