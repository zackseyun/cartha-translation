id: AMO.5.19
reference: Amos 5:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר יָנ֥וּס אִישׁ֙ מִ/פְּנֵ֣י הָ/אֲרִ֔י וּ/פְגָע֖/וֹ הַ/דֹּ֑ב וּ/בָ֣א הַ/בַּ֔יִת וְ/סָמַ֤ךְ יָד/וֹ֙ עַל הַ/קִּ֔יר וּ/נְשָׁכ֖/וֹ הַ/נָּחָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/019.yaml
  text: It will be as when a man flees from before the lion[a], and the bear meets him; then he enters the house and leans his hand on the wall[b], and the snake bites him.
translation:
  language: hi
  text: यह ऐसा होगा, जैसे कोई आदमी सिंह के सामने से भागे और भालू से उसका सामना हो जाए[a]; फिर वह घर में आए और दीवार पर अपना हाथ टिकाए, और साँप[b] उसे डस ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भालू उसे आ मिले’ अथवा ‘भालू उस पर आ पड़े।’ इब्रानी क्रिया प्रसंग के अनुसार मिलने, सामना होने या किसी पर आ पड़ने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सर्प।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह पिछले पद में वर्णित बात से उपमा जोड़ता है। स्वाभाविक हिन्दी वाक्य के लिए ‘यह ऐसा होगा, जैसे’ प्रयोग किया गया है।
- source_word: יָנוּס
  choice: भागे
  rationale: यह भय या संकट से भागने की तात्कालिकता व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई आदमी
  rationale: इब्रानी में पुल्लिंग एकवचन है, जिसका प्रयोग यहाँ प्रतिनिधि उदाहरण के रूप में हुआ है।
- source_word: מִפְּנֵי הָאֲרִי
  choice: सिंह के सामने से
  rationale: यह मूल के ‘सामने से/उपस्थिति से’ वाले सजीव भाव को बनाए रखता है।
- source_word: וּפְגָעוֹ הַדֹּב
  choice: और भालू से उसका सामना हो जाए
  rationale: פגע मिलने, सामना होने या आ पड़ने का अर्थ दे सकता है। यह चयन मूल की संभावित व्यापकता और प्रसंग के खतरे—दोनों को बनाए रखता है।
- source_word: וּבָא הַבַּיִת
  choice: फिर वह घर में आए
  rationale: בוא यहाँ घर के भीतर आने या प्रवेश करने को दर्शाता है; ‘फिर’ घटनाओं का क्रम स्पष्ट करता है।
- source_word: וְסָמַךְ יָדוֹ עַל הַקִּיר
  choice: और दीवार पर अपना हाथ टिकाए
  rationale: סמך का अर्थ सहारा देना, टेक लगाना या टिकाना है। ‘हाथ टिकाए’ दृश्य को ठोस और स्वाभाविक हिन्दी में रखता है।
- source_word: וּנְשָׁכוֹ הַנָּחָשׁ
  choice: और साँप उसे डस ले
  rationale: נשך का अर्थ काटना या डसना है; साँप के प्रसंग में ‘डसना’ अधिक स्वाभाविक और सटीक हिन्दी है।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: नָחָשׁ के लिए आधुनिक सामान्य हिन्दी में ‘साँप’ सहज है; ‘सर्प’ वैकल्पिक साहित्यिक शब्द है।
