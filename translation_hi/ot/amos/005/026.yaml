  edition: WLC
  text: וּ/נְשָׂאתֶ֗ם אֵ֚ת סִכּ֣וּת מַלְכְּ/כֶ֔ם וְ/אֵ֖ת כִּיּ֣וּן צַלְמֵי/כֶ֑ם כּוֹכַב֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר עֲשִׂיתֶ֖ם לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/026.yaml
  text: And you carried Sikkuth your king[a], and Kiyyun your images, the star of your god[c][b], which you made for yourselves.
translation:
  language: hi
  text: और तुम सिक्कूत, अपने राजा को[a], और किय्यून—अपनी मूर्तियों को, अपने देवता का तारा को[c]—उठाए फिरते थे, जिन्हें तुमने अपने लिए बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “अपने मोलेक को।” हिब्रू में शाब्दिक रूप से “अपने राजा” है, पर अनेक व्याख्याकार इसे मोलेक देवता का उल्लेख मानते हैं; प्रेरितों के काम 7:43 में भी यही परम्परा दिखाई देती है।
    reason: alternative_reading
  - marker: c
    text: या सम्भवतः, “अपने देवताओं के तारे”; मसोरेटी स्वरांकन एकवचन “अपने देवता” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשָׂאתֶם
  choice: और तुम ... उठाए फिरते थे
  rationale: נשׂא का मूल अर्थ उठाना/ढोना है। प्रसंग में उपासना-संबंधी वस्तुओं को जुलूस या यात्रा में साथ ले जाने का भाव है; हिन्दी में ‘उठाए फिरते थे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: סִכּוּת
  choice: सिक्कूत
  rationale: यह दुर्लभ और अनिश्चित नाम है। अनुमानित अर्थ थोपने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: מַלְכְּכֶם
  choice: अपने राजा
  rationale: मसोरेटी पाठ का सीधा अर्थ ‘तुम्हारा राजा’ है। मोलेक देवता से इसकी पहचान सम्भव है, पर निश्चित नहीं; इसलिए विकल्प पादटिप्पणी में है।
- source_word: כִּיּוּן
  choice: किय्यून
  rationale: यह दुर्लभ नाम सम्भवतः नक्षत्र-पूजा से जुड़ा है। अनिश्चित पहचान को मुख्य पाठ में निश्चित किए बिना नाम का लिप्यंतरण किया गया है।
- source_word: צַלְמֵיכֶם
  choice: अपनी मूर्तियों
  rationale: צֶלֶם का अर्थ प्रतिमा या मूर्ति है। यहाँ बहुवचन और स्वामित्व-सूचक प्रत्यय को स्पष्ट रूप से रखा गया है।
- source_word: כּוֹכַב אֱלֹהֵיכֶם
  choice: अपने देवता के तारे
  rationale: मसोरेटी स्वरांकन के अनुसार אֱלֹהֵיכֶם यहाँ एकवचन अर्थ ‘तुम्हारा देवता’ देता है। सम्बन्धकारक रचना को यथासम्भव सीधे रखा गया है।
- source_word: אֲשֶׁר עֲשִׂיתֶם לָכֶם
  choice: जिन्हें तुमने अपने लिए बनाया था
  rationale: सम्बन्धवाचक उपवाक्य को हिन्दी में बहुवचन वस्तुओं से जोड़ा गया है और לָכֶם का आत्मसंबंधी भाव ‘अपने लिए’ से सुरक्षित है।
theological_decisions:
- issue: מַלְכְּכֶם को सामान्य संज्ञा ‘तुम्हारा राजा’ मानना या मोलेक देवता का नाम
  choice: अपने राजा
  alternative: अपने मोलेक को / मोलेक, अपने राजा को
  rationale: हिब्रू पाठ सीधे ‘तुम्हारा राजा’ पढ़ता है और यहाँ मोलेक नाम स्पष्ट रूप से नहीं लिखता। प्राचीन अनुवाद-परम्परा तथा प्रेरितों के काम 7:43 से जुड़ी वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- issue: סִכּוּת और כִּיּוּן की व्याख्या करना या नामों के रूप में लिप्यंतरित करना
  choice: सिक्कूत और किय्यून के रूप में लिप्यंतरण
  alternative: सिक्कूत को ‘मन्दिर/छत्र’ कहना अथवा दोनों को निश्चित नक्षत्र-देवताओं के रूप में पहचानना
  rationale: दोनों शब्द अत्यन्त दुर्लभ हैं और उनकी सटीक पहचान विवादित है। लिप्यंतरण मूल पाठ की अनिश्चितता और सम्भावित नाम-संज्ञा के स्वरूप को सुरक्षित रखता है।
- issue: אֱלֹהֵיכֶם का वचन
  choice: अपने देवता के तारे
  alternative: अपने देवताओं के तारे
  rationale: मसोरेटी स्वरांकन एकवचन ‘तुम्हारा देवता’ का समर्थन करता है, यद्यपि व्यंजनात्मक रूप और प्रसंग के आधार पर बहुवचन अर्थ प्रस्तावित किया गया है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज रूप अपनाया गया है। दुर्लभ उपासना-संबंधी नामों को देवनागरी में लिप्यंतरित किया गया है। वाक्य में डैश से ‘अपने देवता के तारे’ को पूर्ववर्ती उपासना-वस्तुओं की व्याख्यात्मक समानाधिकरण रचना के रूप में रखा गया है, पर उसकी सटीक पहचान निश्चित नहीं की गई।
