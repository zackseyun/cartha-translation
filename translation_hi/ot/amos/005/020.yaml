review_pass:
  verdict: approve
  source_fidelity: The translation accurately preserves the rhetorical question, the repeated negation, the darkness/light antithesis, the intensifying second darkness term, and the final assertion that the day has no brightness. “याहवेह का दिन” directly represents יוֹם יְהוָה without replacing the divine name with a title. The future-oriented “होगा” is suitable in this prophetic context and does not materially narrow the Hebrew.
  naturalness: The Hindi is clear, dignified, and idiomatic for a prophetic text. The dash effectively marks the climactic image of “घोर अँधेरा.” “जिसमें कोई चमक न होगी” is natural Hindi while adequately expressing the referential force of לוֹ toward the day.
  terminology: “याहवेह,” “अंधकार,” “प्रकाश,” and “घोर अँधेरा” are appropriate modern-standard Hindi renderings and preserve the prophetic register. “चमक” is a sound rendering of נֹגַהּ in this imagery.
