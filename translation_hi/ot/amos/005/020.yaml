id: AMO.5.20
reference: Amos 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/לֹא חֹ֛שֶׁךְ י֥וֹם יְהוָ֖ה וְ/לֹא א֑וֹר וְ/אָפֵ֖ל וְ/לֹא נֹ֥גַֽהּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/020.yaml
  text: Is not the day of Yahweh darkness[a], and not light, and gloom with no brightness in it?
translation:
  language: hi
  text: क्या याहवेह का दिन अंधकार नहीं होगा, प्रकाश नहीं—घोर अँधेरा, जिसमें कोई चमक न होगी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और घोर अँधेरा, और उसके लिए कोई चमक नहीं।”'
    reason: मूल में अंतिम वाक्यांश का संबंध ‘दिन’ से לוֹ (“उसके लिए”) द्वारा व्यक्त है; मुख्य पाठ इसे स्वाभाविक हिंदी में ‘जिसमें’ कहता है।
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं होगा
  rationale: यह आलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है। हिंदी में ‘क्या ... नहीं होगा’ प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: यह संज्ञा प्रकाश के सीधे विलोम के रूप में प्रयुक्त है; ‘अंधकार’ आधुनिक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: יוֹם יְהוָה
  choice: याहवेह का दिन
  rationale: मूल की भविष्यद्वक्ताई अभिव्यक्ति और परमेश्वर के व्यक्तिगत नाम—दोनों को सीधे सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवेह
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְלֹא אוֹר
  choice: प्रकाश नहीं
  rationale: दोहराई गई नकारात्मकता और ‘अंधकार/प्रकाश’ का तीखा विरोध सुरक्षित रहता है।
- source_word: וְאָפֵל
  choice: घोर अँधेरा
  rationale: אָפֵל साधारण अंधकार से अधिक गहन अँधेरे या धुँधलके को व्यक्त करता है; ‘घोर अँधेरा’ यहाँ चित्र की तीव्रता को सहज हिंदी में प्रकट करता है।
- source_word: וְלֹא נֹגַהּ לוֹ
  choice: जिसमें कोई चमक न होगी
  rationale: נֹגַהּ का अर्थ चमक या उजास है। לוֹ का स्वाभाविक हिंदी संबंध उस दिन से ‘जिसमें’ के द्वारा व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवेह’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: ‘याहवेह के दिन’ का स्वरूप
  choice: निर्णायक अंधकार के रूप में आलंकारिक प्रश्न
  alternative: कथनात्मक रूप में ‘निश्चय ही ...’
  rationale: पद उन लोगों की अपेक्षा को उलटता है जो इस दिन को प्रकाश समझते थे। प्रश्नात्मक रूप मूल की विडंबना और न्याय-संबंधी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। डैश मूल की बढ़ती हुई अंधकार-छवि को स्पष्ट करता है, जबकि दोहराया हुआ ‘नहीं’ इब्रानी समानांतरता को बनाए रखता है।
