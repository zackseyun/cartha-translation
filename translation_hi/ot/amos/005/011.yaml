id: AMO.5.11
reference: Amos 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ֠/כֵן יַ֣עַן בּוֹשַׁסְ/כֶ֞ם עַל דָּ֗ל וּ/מַשְׂאַת בַּר֙ תִּקְח֣וּ מִמֶּ֔/נּוּ בָּתֵּ֥י גָזִ֛ית בְּנִיתֶ֖ם וְ/לֹא תֵ֣שְׁבוּ בָ֑/ם כַּרְמֵי חֶ֣מֶד נְטַעְתֶּ֔ם וְ/לֹ֥א תִשְׁתּ֖וּ אֶת יֵינָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/011.yaml
  text: Therefore[a], because you trample on the poor and take a grain tax from him, you have built houses of cut stone, but you will not live in them; you have planted delightful vineyards[c][b], but you will not drink their wine.
translation:
  language: hi
  text: इसलिए, क्योंकि तुम गरीब को रौंदते हो और उससे अनाज की उगाही[a] करते हो, तुमने तराशे हुए पत्थरों के घर[b] बनाए हैं, पर तुम उनमें नहीं रहोगे; तुमने मनभावने अंगूर के बाग[c] लगाए हैं, पर तुम उनकी मदिरा नहीं पीओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे अनाज का कर (या लगान) वसूलते हो।” इब्रानी पद अनाज के रूप में लादे गए भार अथवा वसूली को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “गढ़े हुए पत्थरों के घर।”
    reason: lexical_alternative
  - marker: c
    text: या, “उत्तम अंगूर के बाग” अथवा “सुखद अंगूर के बाग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן יַעַן
  choice: इसलिए, क्योंकि
  rationale: दोनों संबंधसूचक शब्दों को बनाए रखकर पहले निष्कर्ष और फिर उसके कारण को व्यक्त किया गया है; इससे भविष्यद्वक्ता के न्याय-घोषणा वाले बल की रक्षा होती है।
- source_word: בּוֹשַׁסְכֶם עַל דָּל
  choice: तुम गरीब को रौंदते हो
  rationale: ‘रौंदते हो’ मूल क्रिया के कुचलने और कठोर शोषण के सजीव रूपक को बनाए रखता है; ‘गरीब’ דָּל का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וּמַשְׂאַת בַּר תִּקְחוּ מִמֶּנּוּ
  choice: और उससे अनाज की उगाही करते हो
  rationale: यह पद गरीब व्यक्ति पर लादे गए अनाज-रूपी भार, लगान या कर को दर्शाता है। ‘उगाही’ जबरन आर्थिक वसूली का भाव स्पष्ट करती है और इसे केवल वैध राजकीय कर नहीं मान लेती।
- source_word: בָּתֵּי גָזִית
  choice: तराशे हुए पत्थरों के घर
  rationale: גָזִית काटकर और तराशकर तैयार किए गए निर्माण-पत्थर को दर्शाता है। यह अनुवाद महँगे निर्माण की छवि रखता है, पर मूल से आगे बढ़कर उन्हें ‘महल’ नहीं कहता।
- source_word: וְלֹא תֵשְׁבוּ בָם
  choice: पर तुम उनमें नहीं रहोगे
  rationale: घर के संदर्भ में יָשַׁב का स्वाभाविक अर्थ ‘रहना’ है। भविष्यकाल आने वाले न्याय और उपभोग से वंचित किए जाने को सीधे व्यक्त करता है।
- source_word: כַּרְמֵי חֶמֶד
  choice: मनभावने अंगूर के बाग
  rationale: חֶמֶד में वांछनीयता, प्रियता और सुखद आकर्षण का भाव है। ‘मनभावने’ इस मूल्यवान और आकर्षक गुण को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִשְׁתּוּ אֶת יֵינָם
  choice: पर तुम उनकी मदिरा नहीं पीओगे
  rationale: '‘उनकी’ निकटवर्ती अंगूर के बागों की ओर संकेत करता है और मूल की संक्षिप्त विडंबना बनाए रखता है: लगाने वाले उनके फल से बनी मदिरा का आनंद नहीं लेंगे।'
theological_decisions:
- issue: न्याय-वचन का स्वरूप
  choice: शोषण से अर्जित संपत्ति का उपभोग न कर पाने की प्रत्यक्ष भविष्यद्वाणी-संबंधी न्याय-घोषणा
  alternative: अन्याय के विषय में केवल एक सामान्य नैतिक कहावत
  rationale: सीधा बहुवचन संबोधन और भविष्यकालीन वंचना इसे अमूर्त सिद्धांत नहीं, बल्कि अपराध के प्रत्युत्तर में घोषित न्याय दिखाते हैं। अनुवाद इस संबंध को बिना किसी विशिष्ट सांप्रदायिक व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘रौंदते हो’ भविष्यद्वक्ता की तीखी सामाजिक भाषा को बनाए रखता है, जबकि ‘उगाही’ शोषणकारी आर्थिक वसूली को सामान्य पाठक के लिए स्पष्ट करती है। वाक्य की समानांतर संरचना—घर बनाए पर उनमें न रहना, बाग लगाए पर उनकी मदिरा न पीना—मूल की न्यायपूर्ण विडंबना को सुरक्षित रखती है।
