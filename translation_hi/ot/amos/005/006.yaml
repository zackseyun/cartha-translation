reference: Amos 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דִּרְשׁ֥וּ אֶת יְהוָ֖ה וִֽ/חְי֑וּ פֶּן יִצְלַ֤ח כָּ/אֵשׁ֙ בֵּ֣ית יוֹסֵ֔ף וְ/אָכְלָ֥ה וְ/אֵין מְכַבֶּ֖ה לְ/בֵֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/006.yaml
  text: Seek Yahweh and live[a], lest he break out like fire in the house of Joseph, and it consume[b], with no one to quench it for Bethel.
translation:
  language: hi
  text: याहवे की खोज करो और जीवित रहो,[a] कहीं ऐसा न हो कि वह यूसुफ के घराने में आग की तरह भड़क उठे, और वह आग उसे भस्म कर डाले, और बेतेल के लिए उसे बुझाने वाला कोई न हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की खोज करो, ताकि तुम जीवित रहो।”
    reason: इब्रानी में दूसरी आज्ञा पहली आज्ञा के परिणाम या उद्देश्य का भाव भी दे सकती है।
  - marker: b
    text: इब्रानी में ‘भड़क उठे’ का कर्ता व्यक्त नहीं है; याहवे सबसे संभावित संदर्भ है, पर आग को निहित कर्ता समझना भी संभव है। बेतेल उत्तरी राज्य का एक प्रमुख उपासना-केंद्र था। अंतिम वाक्यांश का अत्यंत शाब्दिक रूप है, “और बेतेल के लिए बुझाने वाला कोई नहीं।”
    reason: वैकल्पिक व्याकरणिक पठन, कठिन संबंधबोधक वाक्यांश और ऐतिहासिक-सांस्कृतिक संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: खोज करो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ वाचा और भविष्यवाणी के संदर्भ में परमेश्वर की ओर मुड़ने और उसे पाने का यत्न करने का भाव देता है; ‘खोज करो’ सरल और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर का लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: इब्रानी की संक्षिप्त आज्ञार्थक रचना को बनाए रखता है; इसमें खोजने के परिणामस्वरूप जीवन पाने का भाव भी सुनाई देता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: अवांछित परिणाम की चेतावनी देने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग।
- source_word: יִצְלַח
  choice: वह ... भड़क उठे
  rationale: आग के बिंब में क्रिया का अर्थ फूट पड़ना या तेजी से फैलना है। निहित कर्ता को पिछले उपवाक्य के याहवे के रूप में लिया गया है, पर विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כָּאֵשׁ
  choice: आग की तरह
  rationale: तुलना का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בֵּית יוֹסֵף
  choice: यूसुफ का घराना
  rationale: यह उत्तरी राज्य, विशेषकर एप्रैम, के लिए भविष्यवाणी-संबंधी सामूहिक पद है; ‘घराना’ हिन्दी में वंश/समुदाय का भाव स्पष्ट करता है।
- source_word: וְאָכְלָה
  choice: और उसे भस्म कर दे
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है और कर्म संदर्भ से यूसुफ का घराना है। हिन्दी में अस्पष्ट शून्य कर्म अस्वाभाविक होता, इसलिए ‘उसे’ जोड़ा गया; ‘भस्म’ आग के बिंब को बनाए रखता है।
- source_word: וְאֵין מְכַבֶּה
  choice: उसे बुझानेवाला कोई न हो
  rationale: आग बुझाने के लिए किसी व्यक्ति के न होने या समर्थ न होने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לְבֵית אֵל
  choice: बेतेल के लिए
  rationale: कठिन संबंधबोधक לְ को अत्यधिक स्पष्ट किए बिना निकट रूप से रखा गया है। बेतेल यहाँ स्थान-नाम है।
theological_decisions:
- issue: ‘भड़क उठे’ का निहित कर्ता
  choice: याहवे को कर्ता मानकर ‘वह’
  alternative: आग को कर्ता मानकर ‘वह आग की तरह भड़क उठे’ अथवा निर्वैयक्तिक अर्थ
  rationale: पिछले उपवाक्य में याहवे निकटतम संभावित संदर्भ है और भविष्यवाणी-साहित्य में उसका न्याय आग के रूप में चित्रित होता है। फिर भी इब्रानी में कर्ता व्यक्त नहीं है, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है।
- issue: בֵּית יוֹסֵף की पहचान
  choice: ‘यूसुफ का घराना’, अर्थात उत्तरी राज्य के लिए सामूहिक नाम
  alternative: केवल यूसुफ का जैविक परिवार
  rationale: आमोस के ऐतिहासिक और भविष्यवाणी-संबंधी संदर्भ में यह पद उत्तरी इस्राएली राज्य/समुदाय को सूचित करता है; अनुवाद पारंपरिक रूपक को बनाए रखता है।
- issue: בֵּית אֵל का अर्थ
  choice: स्थान-नाम ‘बेतेल’
  alternative: सामान्य संज्ञा के रूप में ‘परमेश्वर का घर’
  rationale: आमोस में बेतेल उत्तरी राज्य का प्रमुख उपासना-केंद्र है और यहाँ भौगोलिक नाम ही प्रसंगानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज भविष्यवाणी-शैली। ‘याहवे’ व्यक्तिगत दिव्य नाम के रूप में रखा गया है। ‘कहीं ऐसा न हो कि’ चेतावनी का स्वाभाविक रूप है। ‘बेतेल के लिए’ जानबूझकर कुछ असामान्य रखा गया है ताकि कठिन इब्रानी संबंध को चुपचाप ‘में’ या ‘विरुद्ध’ करके न सुलझाया जाए।
