base_translation:
  language: en
  yaml_path: translation/ot/amos/005/023.yaml
  text: Take away from me the noise of your songs[a], and I will not listen to the melody of your harps.
translation:
  language: hi
  text: अपने गीतों का शोर मुझसे दूर कर; मैं तेरे तंत्री वाद्यों[a] का संगीत नहीं सुनूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वीणाओं”; इब्रानी में एक प्राचीन तंत्री वाद्य का नाम है, जिसका ठीक आधुनिक समकक्ष निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר מֵעָלַי
  choice: मुझसे दूर कर
  rationale: आज्ञार्थक क्रिया और ‘मेरे ऊपर से/मुझसे’ के भाव को स्वाभाविक हिन्दी में सीधे और कठोर आदेश के रूप में व्यक्त करता है।
- source_word: הֲמוֹן
  choice: शोर
  rationale: इस प्रसंग में यह केवल ध्वनि नहीं, बल्कि परमेश्वर को अप्रिय लगने वाले कोलाहल का नकारात्मक भाव रखता है।
- source_word: שִׁירֶיךָ
  choice: तेरे गीतों
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְזִמְרַת
  choice: का संगीत
  rationale: वाद्य से निकलने वाली संगीतमय ध्वनि को व्यक्त करता है और पहले खंड के ‘गीतों’ से अनावश्यक पुनरावृत्ति से बचता है।
- source_word: נְבָלֶיךָ
  choice: तेरी सारंगियों
  rationale: נבל एक प्राचीन तंत्री वाद्य था; ‘सारंगी’ आधुनिक हिन्दी पाठक के लिए तंत्री वाद्य का सुबोध निकटतम रूप है, जबकि सटीक पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לֹא אֶשְׁמָע
  choice: मैं नहीं सुनूँगा
  rationale: निषेध सहित अपूर्ण क्रिया यहाँ ध्यान देने से दृढ़ इनकार व्यक्त करती है; हिन्दी का यह रूप उसी इच्छापूर्ण अस्वीकृति को बनाए रखता है।
theological_decisions:
- issue: अन्याय से जुड़े उपासना-संगीत का परमेश्वर द्वारा तिरस्कार
  choice: ‘शोर’ और ‘मैं नहीं सुनूँगा’ के द्वारा स्पष्ट, कठोर अस्वीकृति
  alternative: הֲמוֹן को तटस्थ ‘ध्वनि’ और לֹא אֶשְׁמָע को ‘मैं नहीं सुनता’ कहना
  rationale: आमोस 5 के निकटवर्ती प्रसंग में न्याय से रहित धार्मिक आचरण का खंडन है। अनुवाद उस भविष्यद्वाणी-संबंधी तीखेपन को बनाए रखता है, पर पद में निहित बात से आगे कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और भविष्यद्वाणी-संबंधी कठोर स्वर। परमेश्वर से एकवचन संबोधन के अनुरूप ‘तेरे/तेरी’ रखा गया है।
