  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֹשֵׂ֨ה כִימָ֜ה וּ/כְסִ֗יל וְ/הֹפֵ֤ךְ לַ/בֹּ֨קֶר֙ צַלְמָ֔וֶת וְ/י֖וֹם לַ֣יְלָה הֶחְשִׁ֑יךְ הַ/קּוֹרֵ֣א לְ/מֵֽי הַ/יָּ֗ם וַֽ/יִּשְׁפְּכֵ֛/ם עַל פְּנֵ֥י הָ/אָ֖רֶץ יְהוָ֥ה שְׁמֽ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/008.yaml
  text: He who made the Pleiades and Orion[a], and turns deep darkness into morning, and darkens day into night[b], who calls for the waters of the sea and pours them out over the face of the earth—Yahweh is his name.
translation:
  language: hi
  text: 'वही कृत्तिका तारागुच्छ और कालपुरुष तारामंडल[a] को बनाता है,

    घोर अंधकार[b] को भोर में बदल देता है

    और दिन को अँधेरा करके रात बना देता है;

    वही समुद्र के जल को बुलाता है

    और उसे धरती की सतह पर उंडेल देता है—

    याहवे[c] उसका नाम है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इन नामों का लिप्यंतरण ‘कीमा’ और ‘केसील’ है; इन्हें सामान्यतः क्रमशः कृत्तिका तारागुच्छ (Pleiades) और कालपुरुष तारामंडल (Orion) माना जाता है।
    reason: प्राचीन खगोलीय नामों की पहचान पूरी तरह निश्चित नहीं है।
  - marker: b
    text: इसका अनुवाद ‘मृत्यु की छाया’ भी हो सकता है।
    reason: צַלְמָוֶת के वैकल्पिक शाब्दिक और पारंपरिक अर्थ को सुरक्षित रखना।
  - marker: c
    text: इब्रानी में YHWH, परमेश्वर का व्यक्तिगत नाम; इसके प्राचीन उच्चारण के आधार पर यहाँ ‘याहवे’ लिखा गया है।
    reason: ईश्वरीय नाम और उसके लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: עֹשֵׂה
  choice: वही ... बनाता है
  rationale: इब्रानी पुल्लिंग एकवचन कृदंत परमेश्वर का वर्णन करने वाले कर्तृवाचक पद के रूप में है। वर्तमानकालीन हिन्दी रचना उसके निरंतर सामर्थ्यपूर्ण कार्य को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: כִימָה
  choice: कृत्तिका तारागुच्छ
  rationale: इस खगोलीय नाम की प्रचलित पहचान Pleiades से है; हिन्दी में ‘कृत्तिका तारागुच्छ’ सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट है। पहचान की कुछ अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: כְסִיל
  choice: कालपुरुष तारामंडल
  rationale: כִימָה के साथ खगोलीय युग्म में यह सामान्यतः Orion माना जाता है। हिन्दी का प्रचलित खगोलीय नाम ‘कालपुरुष तारामंडल’ चुना गया है; मूल नाम और पहचान की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וְהֹפֵךְ לַבֹּקֶר צַלְמָוֶת
  choice: घोर अंधकार को भोर में बदल देता है
  rationale: הפך के परिवर्तन-बोध और לַבֹּקֶר की दिशा को सहज हिन्दी में रखा गया है। צַלְמָוֶת का प्रसंगानुकूल अर्थ गहरा या घोर अंधकार है।
- source_word: וְיוֹם לַיְלָה הֶחְשִׁיךְ
  choice: और दिन को अँधेरा करके रात बना देता है
  rationale: हिफ़ील क्रिया החשיך के कारणवाचक अर्थ ‘अँधेरा करना’ को बनाए रखते हुए दिन से रात होने की समानांतर छवि स्पष्ट की गई है।
- source_word: הַקּוֹרֵא לְמֵי הַיָּם
  choice: वही समुद्र के जल को बुलाता है
  rationale: कृदंत वर्णन की निरंतरता बनाए रखी गई है। ‘बुलाता है’ जल को अपने आदेश से उपस्थित करने या मँगाने का भाव व्यक्त करता है।
- source_word: וַיִּשְׁפְּכֵם עַל־פְּנֵי הָאָרֶץ
  choice: और उसे धरती की सतह पर उंडेल देता है
  rationale: बहुवचन प्रत्यय का संदर्भ ‘जल’ से है, जो हिन्दी में समूहवाचक एकवचन की तरह स्वाभाविक है। ‘धरती की सतह’ פני הארץ का स्पष्ट और निकट अर्थ देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है, केवल ‘प्रभु’ की उपाधि नहीं। ‘याहवे’ उस नाम को स्पष्ट रखता है, जबकि उच्चारण की ऐतिहासिक अनिश्चितता पादटिप्पणी में बताई गई है।
- issue: צַלְמָוֶת का अर्थ
  choice: घोर अंधकार
  alternative: मृत्यु की छाया
  rationale: दिन, भोर और रात के ब्रह्मांडीय समानांतर प्रसंग में गहन अंधकार मुख्य अर्थ है। फिर भी पारंपरिक और संभावित ‘मृत्यु की छाया’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक पंक्ति-विन्यास रखा गया है। भाषा गरिमापूर्ण पर सरल है; ‘घोर अंधकार’, ‘भोर’ और ‘उंडेल देता है’ मूल की ब्रह्मांडीय तथा वर्षा-सदृश छवियों को सहज हिन्दी में व्यक्त करते हैं।
