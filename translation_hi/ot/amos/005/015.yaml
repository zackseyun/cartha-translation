base_translation:
  language: en
  yaml_path: translation/ot/amos/005/015.yaml
  text: Hate evil[a], and love good, and establish justice in the gate; perhaps Yahweh, the God of hosts[c][b], will be gracious to the remnant of Joseph.
translation:
  language: hi
  text: बुराई से घृणा करो, भलाई से प्रेम करो, और नगर-फाटक पर[a] न्याय स्थापित करो; शायद याहवे[b], सेनाओं का परमेश्वर, यूसुफ के बचे हुए लोगों[c] पर अनुग्रह करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन नगर का फाटक वह सार्वजनिक स्थान था जहाँ बुज़ुर्ग और अधिकारी मुकदमे सुनते और न्याय का प्रशासन करते थे। इसका अनुवाद ‘नगर-फाटक में’ भी किया जा सकता है।
    reason: cultural_note_and_lexical_alternative
  - marker: b
    text: ‘याहवे’ मूल इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण है।
    reason: divine_name
  - marker: c
    text: यहाँ ‘यूसुफ’ से आशय उसके वंशजों, विशेषकर उत्तरी राज्य के लोगों से है; ‘बचे हुए लोग’ वे हैं जो न्याय के बाद शेष रहे।
    reason: referent_clarification
lexical_decisions:
- source_word: שִׂנְאוּ רָע
  choice: बुराई से घृणा करो
  rationale: बहुवचन आज्ञार्थक क्रिया और उसके नैतिक कर्म की प्रबलता बनाए रखता है; इसे नरम करके केवल ‘त्यागो’ नहीं किया गया।
- source_word: וְאֶהֱבוּ טוֹב
  choice: भलाई से प्रेम करो
  rationale: ‘घृणा करो—प्रेम करो’ का मूल विरोध और नैतिक अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: וְהַצִּיגוּ ... מִשְׁפָּט
  choice: न्याय स्थापित करो
  rationale: हिफ़ील आज्ञार्थक यहाँ न्याय को सार्वजनिक व्यवस्था में दृढ़ता से कायम करने का भाव देता है, न कि केवल कोई निर्णय प्रस्तुत करने का।
- source_word: בַשַּׁעַר
  choice: नगर-फाटक पर
  rationale: प्राचीन नगर के फाटक पर न्यायिक और नागरिक मामले सुने जाते थे। ‘नगर-फाटक’ हिन्दी पाठक के लिए केवल किसी सामान्य द्वार की अपेक्षा अधिक स्पष्ट है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह पश्चात्ताप के परिणाम को निश्चित नहीं बनाता, बल्कि आशा और अनिश्चितता का मूल तनाव बनाए रखता है।
- source_word: יֶחֱנַן
  choice: अनुग्रह करे
  rationale: חנן के कृपापूर्ण पक्ष का निकट और गरिमापूर्ण हिन्दी रूप है; ‘शायद’ के बाद संभावनार्थक क्रिया स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: स्थिर दिव्य उपाधि का अर्थ सुरक्षित रखता है और ‘सेनाओं’ को केवल मानवीय या केवल स्वर्गीय सेनाओं तक सीमित नहीं करता।
- source_word: שְׁאֵרִית יוֹסֵף
  choice: यूसुफ के बचे हुए लोग
  rationale: यह न्याय के बाद शेष बचे यूसुफ के वंशजों, विशेषकर उत्तरी राज्य के लोगों, को दर्शाता है। साधारण पाठकों के लिए यह ‘यूसुफ का अवशेष’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: אוּלַי और יֶחֱנַן में आशा तथा अनिश्चितता
  choice: शायद ... अनुग्रह करे
  alternative: तब ... अवश्य अनुग्रह करेगा
  rationale: मूल पाठ अनुग्रह की आशा देता है, पर उसे पश्चात्ताप का स्वतः निश्चित परिणाम नहीं बताता; इसलिए उस तनाव को सुरक्षित रखा गया है।
- issue: שְׁאֵרִית יוֹסֵף का सामूहिक अर्थ
  choice: यूसुफ के बचे हुए लोग
  alternative: यूसुफ का अवशेष
  rationale: ‘यूसुफ’ यहाँ व्यक्ति मात्र नहीं, उसके वंशजों और विशेष रूप से उत्तरी राज्य के लिए सामूहिक नाम है; ‘बचे हुए लोग’ इसी आशय को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। समानांतर आज्ञाओं में ‘घृणा करो—प्रेम करो—स्थापित करो’ की प्रबलता और भविष्यवाणी के ‘शायद’ वाले अनिश्चित आशावाद को बनाए रखा गया है।
