base_translation:
  language: en
  yaml_path: translation/ot/amos/005/016.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the Lord: In all the squares there will be wailing, and in all the streets they will say, “Alas! Alas!” They will call the farmer to mourning[b], and those who know lamentation to wailing.'
translation:
  language: hi
  text: 'इसलिए यहोवा, सेनाओं के परमेश्वर, प्रभु, यों कहता है: “सब चौकों में विलाप होगा, और सब गलियों में लोग कहेंगे, ‘हाय! हाय!’ वे किसान को शोक मनाने के लिए, और विलाप करना जाननेवालों को विलाप के लिए[a] बुलाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विलाप करना जाननेवाले” से संभवतः ऐसे कुशल या पेशेवर विलापी अभिप्रेत हैं जिन्हें शोक के अवसर पर बुलाया जाता था।
    reason: cultural_note
