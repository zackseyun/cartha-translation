source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה הָ/עִ֛יר הַ/יֹּצֵ֥את אֶ֖לֶף תַּשְׁאִ֣יר מֵאָ֑ה וְ/הַ/יּוֹצֵ֥את מֵאָ֛ה תַּשְׁאִ֥יר עֲשָׂרָ֖ה לְ/בֵ֥ית יִשְׂרָאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/003.yaml
  text: 'For thus says the Lord GOD: The city that marches out a thousand will have a hundred left[a], and the one that marches out a hundred will have ten left, for the house of Israel.'
translation:
  language: hi
  text: 'क्योंकि प्रभु यहोवा यों कहता है: जो नगर युद्ध के लिए एक हज़ार लेकर निकलता है, उसमें सौ बच रहेंगे; और जो सौ लेकर निकलता है, उसमें दस बच रहेंगे—इस्राएल के घराने में।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यों कहता है
  rationale: मानक भविष्यद्वक्तीय उद्घोषणा को वर्तमान काल में रखा गया है और כִּי का पूर्ववर्ती कथन से कारणसूचक संबंध सुरक्षित है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के विशिष्ट नाम יהוה को ‘यहोवा’ के रूप में अलग-अलग सुरक्षित रखा गया है।
- source_word: הָעִיר
  choice: जो नगर
  rationale: निश्चित पद को सामान्य उदाहरणात्मक कथन में स्वाभाविक हिन्दी संबंधवाचक रचना से व्यक्त किया गया है।
- source_word: הַיֹּצֵאת
  choice: युद्ध के लिए निकलता है
  rationale: क्रिया का शाब्दिक अर्थ ‘निकलना’ है; गिने हुए दल और भारी क्षति के संदर्भ में सैन्य प्रयाण निहित है, इसलिए उसे मुख्य पाठ में स्पष्ट किया गया है।
- source_word: אֶלֶף / מֵאָה
  choice: एक हज़ार सैनिक / सौ सैनिक
  rationale: संख्याएँ नगर से निकलने वाले सैन्य दल को सूचित करती हैं; हिन्दी में अर्थ स्पष्ट करने के लिए ‘सैनिक’ जोड़ा गया है।
- source_word: תַּשְׁאִיר
  choice: उसके ... ही बचे रहेंगे
  rationale: हिफ़ील रूप का परिणामसूचक भाव स्वाभाविक हिन्दी में जीवित बचे हुए लोगों की संख्या के रूप में व्यक्त किया गया है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने के साथ ऐसा ही होगा
  rationale: לְ के संबंध/संदर्भ भाव को हिन्दी में स्पष्ट किया गया है और ‘इस्राएल का घराना’ राष्ट्रीय-वाचा संबंधी पद के रूप में सुरक्षित है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में ईश्वरीय नाम और उपाधि
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि और चतुरक्षरीय विशिष्ट नाम दोनों उपस्थित हैं; ‘प्रभु यहोवा’ दोनों को बनाए रखता है और उन्हें एक सामान्य उपाधि में विलीन नहीं करता।
- issue: विनाश की मात्रा और बचे हुए लोग
  choice: सौ ही / दस ही बचे रहेंगे
  alternative: सौ / दस छोड़ देगा
  rationale: नगर को कर्ता मानकर अस्पष्ट रूप से लोगों को ‘छोड़ने’ वाला बताने के बजाय परिणाम को व्यक्त किया गया है; दस प्रतिशत शेष रहने की कठोर भविष्यवाणी ज्यों की त्यों रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘यों कहता है’ भविष्यद्वक्तीय शैली बनाए रखता है; ‘ही’ भारी क्षति और अल्प अवशेष पर बल देता है।
