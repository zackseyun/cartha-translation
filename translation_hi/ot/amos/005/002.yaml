  yaml_path: translation/ot/amos/005/002.yaml
  text: Fallen[a], virgin Israel will not rise again; abandoned on her own land[b], she has no one to raise her up.
translation:
  language: hi
  text: 'गिर पड़ी है[a] कुँवारी इस्राएल[b],

    वह फिर न उठेगी;

    अपनी ही भूमि पर छोड़ दी गई है,

    उसे उठाने वाला कोई नहीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अब और न उठेगी।” इब्रानी मुहावरे का शाब्दिक भाव है, “वह फिर नहीं उठेगी।”
    reason: lexical_alternative
  - marker: b
    text: “कुँवारी इस्राएल” राष्ट्र का काव्यात्मक मानवीकरण है; यह किसी स्त्री की शाब्दिक यौन स्थिति का कथन नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: נָפְלָה
  choice: गिर पड़ी है
  rationale: नפל का काल पूर्ण क्रिया के साथ वर्तमान परिणाम व्यक्त करता है। आरंभ में इसे रखकर इब्रानी विलाप की आकस्मिकता और पतन की दशा दोनों सुरक्षित रहती हैं।
- source_word: לֹא תוֹסִיף קוּם
  choice: वह फिर न उठेगी
  rationale: יסף के हिफ़ील रूप और קום के क्रियार्थक रूप का मुहावरा यहाँ ‘फिर उठना’ है। निषेध निर्णायक पतन व्यक्त करता है, जबकि भविष्यकालीन हिंदी स्वाभाविक है।
- source_word: בְּתוּלַת יִשְׂרָאֵל
  choice: कुँवारी इस्राएल
  rationale: בְּתוּלָה का मूल रूपक बनाए रखा गया है। यहाँ यह राष्ट्र का काव्यात्मक मानवीकरण है, किसी स्त्री की शाब्दिक यौन स्थिति का कथन नहीं।
- source_word: נִטְּשָׁה
  choice: छोड़ दी गई है
  rationale: נטש का निफ़अल रूप त्यागे या असहाय छोड़ दिए जाने की निष्क्रिय दशा बताता है। यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: עַל אַדְמָתָהּ
  choice: अपनी ही भूमि पर
  rationale: אֲדָמָה यहाँ राष्ट्रीय संदर्भ में ‘भूमि’ है। संबंधवाचक प्रत्यय को ‘अपनी’ और बलसूचक ‘ही’ से व्यक्त किया गया है, जो अपनी भूमि पर असहाय पड़े रहने की विडंबना उभारता है।
- source_word: אֵין מְקִימָהּ
  choice: उसे उठाने वाला कोई नहीं
  rationale: अस्तित्व-निषेध אֵין और קום के हिफ़ील कृदंत का अर्थ है कि उसे उठाने या पुनः खड़ा करने वाला कोई नहीं। ‘उठाने’ पहले के ‘उठेगी’ के साथ इब्रानी शब्द-संबंध बनाए रखता है।
theological_decisions:
- issue: न्याय-वाणी में इस्राएल के लिए ‘कुँवारी’ का रूपक
  choice: रूपक को सीधे ‘कुँवारी इस्राएल’ के रूप में रखा गया।
  alternative: युवती इस्राएल
  rationale: पाठ राष्ट्र को स्त्री के रूप में मानवीकृत करता है। मूल रूपक को बनाए रखना उसकी असुरक्षा, सम्मान और दुखद पतन की काव्यात्मक तनाव-स्थिति को सुरक्षित रखता है, बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े।
- issue: לֹא תוֹסִיף קוּם में न्याय की निर्णायकता
  choice: ‘वह फिर न उठेगी’
  alternative: ‘वह अब और न उठेगी’
  rationale: यह इब्रानी मुहावरा इस न्याय-वाणी में पुनः उठने के निषेध को व्यक्त करता है। अनुवाद उसकी कठोरता बनाए रखता है और पाठ से आगे जाकर उसके व्यापक धर्मवैचारिक परिणाम निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विलाप-शैली रखी गई है। पंक्ति-विन्यास काव्यात्मक समानांतरता दिखाता है। ‘कुँवारी इस्राएल’ पारंपरिक भविष्यद्वाणी-संबंधी रूपक को स्पष्ट व्याख्या में बदले बिना सुरक्षित रखता है।
