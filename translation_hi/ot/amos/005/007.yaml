  text: तुम जो न्याय को नागदौना[a] बना देते हो और धार्मिकता को धरती पर गिरा देते हो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कड़वाहट”; इब्रानी शब्द नागदौना, एक कड़वे पौधे, का नाम है और यहाँ रूपकात्मक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “और न्याय को धरती पर गिरा देते हो,” क्योंकि “धार्मिकता” के लिए प्रयुक्त इब्रानी शब्द के अर्थक्षेत्र में न्याय भी सम्मिलित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַהֹפְכִים
  choice: तुम, जो ... बना देते हो
  rationale: संदर्भ में सवाचक रूप से प्रयुक्त सविशेषण कृदन्त भविष्यद्वक्ता के सीधे संबोधन को जारी रखता है; इसलिए दूसरे पुरुष का प्रयोग किया गया है।
- source_word: לַעֲנָה
  choice: नागदौना
  rationale: यह इब्रानी शब्द अत्यन्त कड़वे पौधे को सूचित करता है और यहाँ रूपकात्मक है। ठोस भविष्यद्वक्तापरक बिम्ब बनाए रखने के लिए पौधे का नाम मुख्य पाठ में रखा गया है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: सामाजिक और नैतिक संदर्भ में यह विधिक तथा सामुदायिक उचित व्यवस्था को व्यक्त करता है।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: यहाँ מִשְׁפָּט के साथ प्रयुक्त होने पर यह उससे जुड़ा, पर अलग नैतिक आयाम बनाए रखता है; 'न्याय' भी अर्थ-सीमा में सम्भव है।
- source_word: לָאָרֶץ
  choice: धरती पर
  rationale: यह स्थानगत बिम्ब को स्वाभाविक हिन्दी में बनाए रखता है और धार्मिकता को नीचे गिराए जाने का भाव देता है।
- source_word: הִנִּיחוּ
  choice: पटक देते हो
  rationale: हिफ़ील रूप का मूल भाव नीचे रख देने का है; नकारात्मक संदर्भ और स्थानगत बिम्ब को स्पष्ट करने के लिए 'पटक देते हो' चुना गया है, बिना इसे केवल 'त्याग देना' बनाकर अर्थ सीमित किए।
theological_decisions:
- issue: भविष्यद्वक्तापरक नैतिक संदर्भ में צְדָקָה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय / जो उचित है
  rationale: צְדָקָה में धार्मिकता और न्याय दोनों का अर्थक्षेत्र है। מִשְׁפָּט और צְדָקָה की जोड़ी को एक ही हिन्दी शब्द में समेटने के बजाय दो सम्बद्ध अवधारणाएँ सुरक्षित रखी गई हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
