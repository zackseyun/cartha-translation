source:
  edition: WLC
  text: וְ/אַֽל תִּדְרְשׁוּ֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּל֙ לֹ֣א תָבֹ֔אוּ וּ/בְאֵ֥ר שֶׁ֖בַע לֹ֣א תַעֲבֹ֑רוּ כִּ֤י הַ/גִּלְגָּל֙ גָּלֹ֣ה יִגְלֶ֔ה וּ/בֵֽית אֵ֖ל יִהְיֶ֥ה לְ/אָֽוֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/005.yaml
  text: But do not seek Bethel[a], and do not enter Gilgal, and do not cross over to Beersheba; for Gilgal will surely go into exile, and Bethel will become nothingness.
translation:
  language: hi
  text: पर बेतेल[a] की खोज न करो, और गिलगाल में न जाओ, और बेर्शेबा की ओर पार न जाओ; क्योंकि गिलगाल निर्वासन में चला ही जाएगा, और बेतेल व्यर्थ हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः, “बेतेल बेत-आवेन बन जाएगा।” यह इब्रानी शब्द-क्रीड़ा है: बेतेल का अर्थ “परमेश्वर का घर” है, जबकि आवेन का अर्थ “व्यर्थता,” “दुष्टता” या “अनर्थ” हो सकता है।'
    reason: אָוֶן के विविध अर्थों और बेतेल/बेत-आवेन की संभावित शब्द-क्रीड़ा को सुरक्षित रखना।
lexical_decisions:
- source_word: תִּדְרְשׁוּ
  choice: खोज न करो
  rationale: דרשׁ का मूल अर्थ ‘खोजना’ या ‘पूछताछ करना’ है। उपासना-स्थल के संदर्भ में ‘खोज न करो’ धार्मिक सहायता या आराधना के लिए वहाँ जाने का भाव रखता है और निकटवर्ती ‘यहोवा की खोज करो’ के साथ जानबूझकर बनाई गई प्रतिध्वनि भी बचाता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: यह नगर और उपासना-स्थल का नाम है; इसलिए इसका अनुवाद ‘परमेश्वर का घर’ न करके प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: תָבֹאוּ
  choice: में न जाओ
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है। किसी तीर्थस्थल के साथ आधुनिक हिन्दी में ‘गिलगाल में न जाओ’ स्वाभाविक है और वहाँ पहुँचने या प्रवेश करने का आशय स्पष्ट करता है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: תַעֲבֹרוּ
  choice: को पार न जाओ
  rationale: עבר का ठोस अर्थ ‘पार जाना’ है। यह बेर्शेबा की ओर लंबी तीर्थयात्रा का संकेत बनाए रखता है; केवल ‘न जाओ’ कहने से क्रिया की यह विशिष्टता मिट जाती।
- source_word: בְאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: גָּלֹה יִגְלֶה
  choice: अवश्य बँधुआई में जाएगा
  rationale: क्रिया के साथ infinitive absolute निर्वासन की निश्चितता पर बल देता है। ‘अवश्य’ उस बल को और ‘बँधुआई में जाएगा’ भविष्यद्वक्ताओं के निर्वासन-विषय को व्यक्त करता है।
- source_word: יִהְיֶה לְאָוֶן
  choice: व्यर्थ हो जाएगा
  rationale: אָוֶן में व्यर्थता, अनर्थ, दुष्टता या विपत्ति के अर्थ संभव हैं। ‘व्यर्थ हो जाएगा’ उपासना-स्थल के निष्फल और मूल्यहीन हो जाने का न्यायसूचक भाव रखता है, जबकि टिप्पणी अन्य अर्थों और शब्द-क्रीड़ा को सुरक्षित करती है।
theological_decisions:
- issue: לְאָוֶן में बेतेल के परिणाम का अर्थ
  choice: बेतेल व्यर्थ हो जाएगा
  alternative: बेतेल अनर्थ/दुष्टता बन जाएगा; अथवा बेतेल ‘बेत-आवेन’ बन जाएगा
  rationale: इब्रानी אָוֶן संभवतः व्यर्थता या अनर्थ का अर्थ देने के साथ ‘बेतेल’ और ‘बेत-आवेन’ के बीच व्यंग्यपूर्ण शब्द-क्रीड़ा भी करता है। मुख्य पाठ सहज हिन्दी में न्याय का भाव देता है; पादटिप्पणी अस्पष्टता और शब्द-क्रीड़ा को बिना किसी एक अर्थ को अनिवार्य ठहराए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीनों निषेधों की समानांतर रचना और गिलगाल के निश्चित निर्वासन पर मूल इब्रानी का बल बनाए रखा गया है।
