base_translation:
  language: en
  yaml_path: translation/ot/amos/005/001.yaml
  text: 'Hear this word that I am taking up over you as a lament[a], O house of Israel:'
translation:
  language: hi
  text: हे इस्राएल के घराने, यह वचन सुनो, जिसे मैं तुम पर विलाप के रूप में उठा रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति; भविष्यद्वाणी के गंभीर आह्वान को बनाए रखती है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: भविष्यद्वाणी के सूत्रात्मक प्रयोग को सुरक्षित रखते हुए דָּבָר के ‘वचन/संदेश’ अर्थ को व्यक्त करता है।
- source_word: אֲשֶׁר אָנֹכִי נֹשֵׂא
  choice: जिसे मैं ... उठा रहा हूँ
  rationale: נשׂא के मूल ‘उठाना’ बिंब और विलाप आरम्भ करने के मुहावरे, दोनों को यथासंभव बनाए रखता है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे विषय में
  rationale: हिन्दी में स्वाभाविक रूप से विलाप के लक्ष्य को बताता है; ‘तुम्हारे विरुद्ध’ से आने वाली अनावश्यक रूप से प्रबल विरोधात्मक व्याख्या से बचता है।
- source_word: קִינָה
  choice: विलाप के रूप में
  rationale: קִינָה शोक-विलाप, प्रायः मृत्युगीत, को दर्शाता है; यह चयन सामान्य आधुनिक पाठक के लिए स्पष्ट है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: सम्बोधन का बल स्पष्ट करता है और सामूहिक ‘घराने’ की छवि को सुरक्षित रखता है।
theological_decisions:
- issue: עֲלֵיכֶם का सम्बन्धात्मक या विरोधात्मक अर्थ
  choice: तुम्हारे विषय में
  alternative: तुम्हारे विरुद्ध
  rationale: सन्दर्भ में न्याय का स्वर है, पर इब्रानी पूर्वसर्ग स्वयं दोनों छायाएँ रख सकता है; मुख्य पाठ में कम व्याख्यात्मक विकल्प चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-सुलभ शैली रखी गई है। ‘हे’ और ‘वचन’ गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
