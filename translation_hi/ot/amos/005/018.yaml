source:
  edition: WLC
  text: ה֥וֹי הַ/מִּתְאַוִּ֖ים אֶת י֣וֹם יְהוָ֑ה לָ/מָּה זֶּ֥ה לָ/כֶ֛ם י֥וֹם יְהוָ֖ה הוּא חֹ֥שֶׁךְ וְ/לֹא אֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/018.yaml
  text: Woe to those who long for the day of Yahweh! Why would you have the day of Yahweh? It is darkness[a], and not light.
translation:
  language: hi
  text: हाय उन पर जो याहवे के दिन की लालसा करते हैं! याहवे का दिन तुम्हारे किस काम का?[a] वह अंधकार है, प्रकाश नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम याहवे का दिन क्यों चाहते हो?” इब्रानी अभिव्यक्ति मुहावरेदार और आलंकारिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वाणी की शोकपूर्ण धिक्कार और आने वाले अनिष्ट की घोषणा का बल बनाए रखता है; केवल ‘हाय’ की अपेक्षा हिन्दी में संबोधित लोगों को अधिक स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: הַמִּתְאַוִּים
  choice: जो ... की लालसा करते हैं
  rationale: हित्पएल कृदन्त निरन्तर और तीव्र अभिलाषा रखने वाले लोगों को दर्शाता है। ‘लालसा करते हैं’ उनकी उत्सुक अपेक्षा और पद में निहित विडम्बनापूर्ण फटकार दोनों को व्यक्त करता है।
- source_word: יוֹם יְהוָה
  choice: याहवे का दिन
  rationale: यह भविष्यद्वाणी में प्रयुक्त विशिष्ट पदबंध को सीधा रखता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: לָמָּה זֶּה לָכֶם
  choice: तुम्हारे किस काम का?
  rationale: इब्रानी वाक्यांश संक्षिप्त, मुहावरेदार और आलंकारिक प्रश्न है। यह हिन्दी रूप स्वाभाविक ढंग से उस कल्पित लाभ को चुनौती देता है जिसकी श्रोता उस दिन से आशा रखते थे।
- source_word: הוּא חֹשֶׁךְ וְלֹא אוֹר
  choice: वह अंधकार है, प्रकाश नहीं
  rationale: ‘वह’ दिन की ओर लौटता है और इब्रानी के तीखे विरोध को बनाए रखता है। ‘अंधकार’ और ‘प्रकाश’ को शाब्दिक रखा गया है क्योंकि यही पद की केंद्रीय और पारदर्शी भविष्यद्वाणी-संबंधी छवि है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और इसे उपाधि में बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: ‘याहवे के दिन’ का स्वरूप
  choice: पद के अपने विरोध के अनुसार उसे ‘अंधकार, प्रकाश नहीं’ कहना
  alternative: उसे व्याख्यात्मक रूप से केवल दण्ड या केवल उद्धार का दिन कहना
  rationale: पद श्रोताओं की अनुकूल अपेक्षा को उलटता है, पर यहाँ उस दिन का पूरा धर्मवैज्ञानिक स्वरूप परिभाषित नहीं करता। इसलिए मूल का तनाव और रूपक बिना अतिरिक्त साम्प्रदायिक व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘हाय उन पर’ भविष्यद्वाणी की धिक्कार का बल देता है; ‘किस काम का?’ मूल के संक्षिप्त आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
