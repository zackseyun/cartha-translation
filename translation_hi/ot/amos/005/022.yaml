  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אִם תַּעֲלוּ לִ֥/י עֹל֛וֹת וּ/מִנְחֹתֵי/כֶ֖ם לֹ֣א אֶרְצֶ֑ה וְ/שֶׁ֥לֶם מְרִיאֵי/כֶ֖ם לֹ֥א אַבִּֽיט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/022.yaml
  text: For even if you offer up to me burnt offerings and your grain offerings[a], I will not accept them; and I will not look upon the peace offerings of your fattened animals.
translation:
  language: hi
  text: क्योंकि चाहे तुम मेरे लिए होमबलियाँ और अपनी अन्नबलियाँ चढ़ाओ, फिर भी मैं उन्हें स्वीकार नहीं करूँगा; और तुम्हारे मोटे किए हुए पशुओं की शांति-बलियों पर मैं दृष्टि नहीं करूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि चाहे ... फिर भी
  rationale: यह पद पिछले कथन से कारणसूचक रूप में जुड़ते हुए रियायती भाव व्यक्त करता है; यह हिन्दी संरचना दोनों अर्थ-सूक्ष्मताओं को बनाए रखती है।
- source_word: תַּעֲלוּ לִי
  choice: मेरे लिए ... चढ़ाओ
  rationale: עלה के हिफ़ील रूप का यहाँ बलि को वेदी पर चढ़ाने का पारिभाषिक अर्थ है; ‘चढ़ाओ’ हिन्दी में स्वाभाविक बलिदानी प्रयोग है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह पूरी तरह जलाकर चढ़ाई जाने वाली विशिष्ट बलि है; ‘होमबलि’ स्थापित और संक्षिप्त हिन्दी पारिभाषिक शब्द है।
- source_word: וּמִנְחֹתֵיכֶם
  choice: और अपने अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה अन्न से बनी भेंट को दर्शाता है; ‘अन्नबलि’ इसकी विशिष्टता बनाए रखता है।
- source_word: לֹא אֶרְצֶה
  choice: मैं उन्हें स्वीकार न करूँगा
  rationale: רצה यहाँ बलि को अनुग्रहपूर्वक स्वीकार करने का अर्थ देता है; ‘उन्हें’ बहुवचन बलियों से स्वाभाविक रूप से पूरा किया गया है।
- source_word: וְשֶׁלֶם
  choice: और ... मेलबलियों
  rationale: שֶׁלֶם शांति, कुशल और सहभागिता से जुड़ी विशिष्ट बलि-श्रेणी है; ‘मेलबलि’ इस संबंधपरक भाव को संक्षेप में व्यक्त करती है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: מְרִיאֵיכֶם
  choice: तुम्हारे पाले-पोसे पशुओं के
  rationale: यह शब्द बलि के लिए मोटे किए गए पशुओं को सूचित करता है; ‘पाले-पोसे पशु’ आधुनिक हिन्दी में सहज है और केवल शरीर की चर्बी पर अनावश्यक बल नहीं देता।
- source_word: לֹא אַבִּיט
  choice: मैं दृष्टि न करूँगा
  rationale: נבט के दृश्य रूपक और किसी वस्तु को कृपापूर्वक न देखने के भाव को बनाए रखता है।
theological_decisions:
- issue: इस्राएल की बलि-व्यवस्था के विशिष्ट पदों को सुरक्षित रखना
  choice: ‘होमबलियाँ,’ ‘अन्नबलि,’ और ‘मेलबलियाँ’ जैसी अलग-अलग बलि-श्रेणियाँ रखी गई हैं।
  alternative: सभी को सामान्य रूप से ‘बलियाँ’ या ‘भेंटें’ कहना।
  rationale: मूल पाठ विशिष्ट उपासना-विधियों का नाम लेता है। उन्हें सामान्य बना देने से भविष्यद्वक्ता की आलोचना की ठोस वाचा-संबंधी पृष्ठभूमि धुंधली हो जाएगी।
- issue: שֶׁלֶם में निहित अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘मेलबलि’ रखा गया है।
  alternative: ‘शान्ति-बलि’ या ‘सहभागिता-बलि’।
  rationale: इब्रानी शब्द कुशल-क्षेम, शांति और सामुदायिक सहभागिता से जुड़ी बलि-श्रेणी को सूचित करता है। कोई एक हिन्दी पद इसकी पूरी अर्थ-व्याप्ति नहीं समेटता, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि,’ ‘अन्नबलि,’ और ‘मेलबलि’ बाइबलीय बलि-प्रणाली की पारिभाषिक विशिष्टता बनाए रखते हैं।
