  yaml_path: translation/ot/amos/005/017.yaml
  text: And in all the vineyards there will be wailing[b][a], for I will pass through your midst," says Yahweh.
translation:
  language: hi
  text: और सभी दाख की बारियों में विलाप होगा[a], क्योंकि मैं तेरे बीच से होकर गुज़रूँगा[b],” यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शोक’ अथवा ‘मातम’। हिब्रू शब्द सार्वजनिक शोक को दर्शाता है, जिसे प्रायः ऊँची आवाज़ में व्यक्त किया जाता था।
    reason: lexical_alternative
  - marker: b
    text: ‘मैं तेरे बीच से होकर गुज़रूँगा’ न्याय के लिए परमेश्वर के आगमन से संबंधित पूर्ववर्ती बाइबलीय भाषा की प्रतिध्वनि हो सकती है; तुलना करें निर्गमन 12:12। इस पद में यह संकेत स्पष्ट नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְ/כָל כְּרָמִים
  choice: और सभी दाख की बारियों में
  rationale: संयोजक, स्थानसूचक संबंध और समष्टिबोधक शब्द को स्पष्ट रखते हुए बहुवचन כְּרָמִים का स्वाभाविक आधुनिक हिन्दी रूप दिया गया है।
- source_word: מִסְפֵּד
  choice: विलाप होगा
  rationale: यह संज्ञा सार्वजनिक और प्रायः सुनाई देने वाले शोक को व्यक्त करती है। हिब्रू के क्रियारहित वाक्य को हिन्दी में स्वाभाविक बनाने के लिए ‘होगा’ जोड़ा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगामी कथन को विलाप के कारण के रूप में प्रस्तुत करता है।
- source_word: אֶעֱבֹר בְּ/קִרְבְּ/ךָ
  choice: मैं तेरे बीच से होकर गुज़रूँगा
  rationale: עבר और בְּקֶרֶב की स्थानगत छवि तथा सामूहिक इस्राएल को संबोधित एकवचन प्रत्यय दोनों सुरक्षित रखे गए हैं।
- source_word: אָמַר יְהוָה
  choice: यहोवा का कहना है
  rationale: भविष्यद्वाणी के कथन-सूत्र को वर्तमान प्रभाव वाले स्वाभाविक हिन्दी रूप में रखा गया है और יְהוָה को उसके व्यक्तिवाचक नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय ईश्वरीय नाम प्रत्यक्ष है। हिन्दी में सुविदित व्यक्तिवाचक रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: न्याय के लिए परमेश्वर के बीच से होकर गुज़रने की छवि
  choice: मैं तेरे बीच से होकर गुज़रूँगा
  alternative: मैं तेरे बीच आऊँगा
  rationale: सीधी गतिशील छवि और न्यायपूर्ण ईश्वरीय आगमन का तनाव सुरक्षित रखा गया है। निर्गमन 12:12 की संभावित प्रतिध्वनि को मुख्य पाठ में स्पष्ट दावा नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। सामूहिक इस्राएल के लिए मूल के एकवचन संबोधन को ‘तेरे’ से सुरक्षित रखा गया है। दोनों पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद लगाए गए हैं।
