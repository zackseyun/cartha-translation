source:
  edition: WLC
  text: דִּרְשׁוּ ט֥וֹב וְ/אַל רָ֖ע לְמַ֣עַן תִּֽחְי֑וּ וִ/יהִי כֵ֞ן יְהוָ֧ה אֱלֹהֵֽי צְבָא֛וֹת אִתְּ/כֶ֖ם כַּ/אֲשֶׁ֥ר אֲמַרְתֶּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/014.yaml
  text: Seek good and not evil[a], so that you may live; and so Yahweh, the God of hosts, will be with you, as you have said.
translation:
  language: hi
  text: भलाई की खोज करो, बुराई की नहीं, ताकि तुम जीवित रहो; तब याहवे, सेनाओं का परमेश्वर, तुम्हारे साथ होगा, जैसा तुमने कहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा तुम कहते हो।” इब्रानी पूर्ण क्रिया याहवे की उपस्थिति के विषय में उनके पहले किए गए दावे की ओर संकेत कर सकती है।
    reason: कालगत अर्थ और पूर्व दावे के संकेत से जुड़ा अनुवाद-विकल्प
lexical_decisions:
- source_word: דִּרְשׁוּ טוֹב וְאַל רָע
  choice: भलाई की खोज करो, बुराई की नहीं
  rationale: ‘खोज करो’ דרשׁ के ‘ढूँढ़ने/चाहने/अनुसरण करने’ के भाव को बनाए रखता है। ‘भलाई’ और ‘बुराई’ हिन्दी में इस संक्षिप्त नैतिक विरोध को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: לְמַעַן תִּחְיוּ
  choice: ताकि तुम जीवित रहो
  rationale: לְמַעַן उद्देश्य अथवा परिणाम बताता है। ‘जीवित रहो’ मूल पाठ की व्यापकता बनाए रखता है और इसे केवल शारीरिक बचाव या समृद्धि तक सीमित नहीं करता।
- source_word: וִיהִי כֵן
  choice: तब ... होगा
  rationale: यह अनुवाद पहले आदेश के फलस्वरूप होने वाली स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; यह परमेश्वर की उपस्थिति को वर्तमान की बिना शर्त घोषणा नहीं बनाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यह צְבָאוֹת की बहुवचनीय और व्यापक छवि को बनाए रखता है, बिना इसे केवल पृथ्वी की या केवल स्वर्गीय सेनाओं तक सीमित किए।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: यहाँ संबंधबोधक पद परमेश्वर की उपस्थिति को सीधे ‘साथ’ होने के रूप में व्यक्त करता है।
- source_word: כַּאֲשֶׁר אֲמַרְתֶּם
  choice: जैसा तुम कहते आए हो
  rationale: इब्रानी पूर्ण क्रिया उनके पहले से किए जाते रहे दावे की ओर संकेत कर सकती है। यह हिन्दी उस पूर्ववर्ती दावे का भाव रखती है और उसे केवल एक क्षण की उक्ति नहीं बनाती।
theological_decisions:
- issue: याहवे के ‘तुम्हारे साथ’ होने को बिना शर्त वर्तमान तथ्य माना जाए या भलाई खोजने का परिणाम
  choice: 'इसे भलाई खोजने से जुड़ा परिणाम बनाया गया है: ‘तब ... तुम्हारे साथ होगा।’'
  alternative: ‘और इस प्रकार याहवे ... तुम्हारे साथ है।’
  rationale: वाक्यक्रम और आमोस के प्रसंग में जीवन तथा परमेश्वर की उपस्थिति पश्चात्ताप की पुकार से जुड़े हैं। अंतिम उपवाक्य लोगों के अपने दावे को स्मरण कराता है, इसलिए उनकी वर्तमान स्थिति की बिना शर्त पुष्टि करना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भलाई की खोज करो, बुराई की नहीं’ मूल की संक्षिप्त समानांतरता को सुरक्षित रखता है। अर्थ से संबंधित पाद-टिप्पणी-चिह्न को उसी अंतिम उपवाक्य के बाद रखा गया है जिसे वह स्पष्ट करता है।
