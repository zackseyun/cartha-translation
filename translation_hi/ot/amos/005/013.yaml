  text: לָ/כֵ֗ן הַ/מַּשְׂכִּ֛יל בָּ/עֵ֥ת הַ/הִ֖יא יִדֹּ֑ם כִּ֛י עֵ֥ת רָעָ֖ה הִֽיא׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/013.yaml
  text: Therefore the prudent man keeps silent at that time[a], for it is an evil time.
translation:
  language: hi
  text: इसलिए उस समय समझदार मनुष्य चुप रहता है[a], क्योंकि वह बुराई का समय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुद्धिमान व्यक्ति” अथवा “विवेकी जन”; इब्रानी में यह पुल्लिंग एकवचन है, पर यहाँ इसका प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले आरोपों से निकलने वाले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּשְׂכִּיל
  choice: समझदार मनुष्य
  rationale: हिफ़ील कृदंत ऐसे व्यक्ति को दर्शाता है जो सूझ-बूझ रखता और विवेक से काम करता है; पुल्लिंग एकवचन का प्रतिनिधिक रूप भी सुरक्षित रहता है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह चर्चा में आए विशेष समय या परिस्थिति की ओर संकेत करने वाला स्वाभाविक हिन्दी कालवाचक पद है।
- source_word: יִדֹּם
  choice: चुप रहता है
  rationale: דמם का अर्थ मौन या स्थिर रहना है; यह चयन परिस्थिति के कारण बरते जाने वाले निरंतर संयम को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह चुप रहने का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: עֵת רָעָה
  choice: बुरा समय
  rationale: यह ऐसा समय बताता है जो बुराई और संकट से चिह्नित है; संक्षिप्त हिन्दी मूल की अभिव्यक्ति को निकटता से रखती है।
- source_word: הִיא
  choice: वह ... है
  rationale: स्त्रीलिंग सर्वनाम עֵת अर्थात ‘समय’ की ओर लौटता है; हिन्दी में ‘वह बुरा समय है’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: הַמַּשְׂכִּיל का लिंग और प्रतिनिधिक अर्थ
  choice: समझदार मनुष्य
  alternative: समझदार व्यक्ति; विवेकी जन
  rationale: इब्रानी रूप व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर संदर्भ में सामान्य प्रतिनिधिक अर्थ रख सकता है। मुख्य पाठ मूल का रूप सुरक्षित रखता है और पादटिप्पणी उसके व्यापक अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली। ‘चुप रहता है’ मूल क्रिया की निरंतर या संयमित चुप्पी को व्यक्त करता है; पादटिप्पणी पुल्लिंग रूप और उसके प्रतिनिधिक आशय दोनों को सुरक्षित रखती है।
