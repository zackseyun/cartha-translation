source:
  edition: WLC
  text: וְ/הִגְלֵיתִ֥י אֶתְ/כֶ֖ם מֵ/הָ֣לְאָה לְ/דַמָּ֑שֶׂק אָמַ֛ר יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/027.yaml
  text: Therefore I will send you into exile beyond Damascus,” says Yahweh[a], whose name is the God of hosts.
translation:
  language: hi
  text: “इसलिए मैं तुम्हें दमिश्क के पार निर्वासन में भेज दूँगा[a],” याहवे कहता है—उसका नाम सेनाओं का परमेश्वर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हें दमिश्क के पार निर्वासित कर दूँगा।”
    reason: हिब्रू क्रिया का अधिक संक्षिप्त कारक अनुवाद भी सम्भव है।
lexical_decisions:
- source_word: וְהִגְלֵיתִי
  choice: इसलिए मैं ... निर्वासन में भेज दूँगा
  rationale: हिफ़ईल रूप का अर्थ किसी को निर्वासन में जाने के लिए बाध्य करना है। ‘निर्वासन में भेज दूँगा’ आधुनिक हिन्दी में स्वाभाविक है और कारक भाव को बनाए रखता है। आरम्भिक וְ को पिछले न्याय-वचन के निष्कर्ष के रूप में ‘इसलिए’ कहा गया है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: प्रत्यक्ष कर्मचिह्न के साथ द्वितीय पुरुष पुल्लिंग बहुवचन प्रत्यय है; हिन्दी में इसका स्वाभाविक रूप ‘तुम्हें’ है।
- source_word: מֵהָלְאָה לְדַמָּשֶׂק
  choice: दमिश्क के पार
  rationale: यह पदबंध दमिश्क से आगे की दिशा या स्थान बताता है। ‘के पार’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: אָמַר
  choice: कहता है
  rationale: यद्यपि हिब्रू रूप पूर्णकालिक है, भविष्यद्वाणी के कथन-सूत्र में वर्तमान काल हिन्दी में वचन को सजीव और स्वाभाविक रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं का परमेश्वर
  rationale: यह צְבָאוֹת के बहुवचन और उपाधि की व्यापकता को बनाए रखता है, बिना यह तय किए कि सेनाएँ सांसारिक हैं या स्वर्गीय।
- source_word: שְׁמוֹ
  choice: उसका नाम ... है
  rationale: हिब्रू की स्पष्ट नामवाचक उपवाक्य-रचना को हिन्दी में पूर्ण वाक्य के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: צְבָאוֹת का आशय
  choice: सेनाओं
  alternative: स्वर्गीय सेनाओं; समूहों
  rationale: मूल शब्द का दायरा केवल सांसारिक या केवल स्वर्गीय सेनाओं तक स्पष्ट रूप से सीमित नहीं है; ‘सेनाओं’ इस खुलापन को सुरक्षित रखता है।
- issue: אֱלֹהֵי צְבָאוֹת שְׁמוֹ की रचना
  choice: उसका नाम सेनाओं का परमेश्वर है
  alternative: जिसका नाम सेनाओं का परमेश्वर है
  rationale: स्वतंत्र उपवाक्य मूल के स्पष्ट ‘उसका नाम’ को बनाए रखता है और हिन्दी में अस्पष्ट संबंधवाचक रचना से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निर्वासन में भेज दूँगा’ मुहावरेदार हिन्दी है, जबकि पाद-टिप्पणी अधिक औपचारिक ‘निर्वासित कर दूँगा’ देती है।
