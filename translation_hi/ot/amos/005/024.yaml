    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגַּל
  choice: बल्कि … उमड़ता रहे
  rationale: संदर्भ में וְ विरोध अथवा अपेक्षित विकल्प को सामने लाता है, इसलिए ‘बल्कि’ स्वाभाविक है। क्रिया का रूप आदेश-सदृश इच्छा व्यक्त करता है; ‘उमड़ता रहे’ जल की गतिशील और प्रबल छवि को बनाए रखता है।
- source_word: כַּמַּיִם
  choice: जल की तरह
  rationale: מַיִם रूप की दृष्टि से बहुवचन है, पर आधुनिक हिन्दी में ‘जल’ इस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है। बहुलता और प्रवाह की छवि पर पादटिप्पणी दी गई है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ शब्द केवल न्यायिक निर्णय नहीं, बल्कि समाज और सार्वजनिक जीवन में न्यायपूर्ण व्यवस्था और आचरण को दर्शाता है।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: ‘धार्मिकता’ नैतिक और वाचा-संबंधी सही आचरण का भाव रखता है तथा इसे מִשְׁפָּט के लिए प्रयुक्त ‘न्याय’ से अलग बनाए रखता है।
- source_word: כְּנַחַל
  choice: धारा की तरह
  rationale: נַחַל नदी, बरसाती नाला अथवा जलधारा को सूचित कर सकता है। ‘धारा’ आधुनिक हिन्दी में स्पष्ट और सहज है तथा अनावश्यक तकनीकीपन से बचता है।
- source_word: אֵיתָן
  choice: कभी न सूखने वाली
  rationale: नदी या धारा के साथ אֵיתָן स्थायी अथवा बारहमासी प्रवाह का बोध देता है। ‘कभी न सूखने वाली’ इस अर्थ को साधारण पाठक के लिए स्पष्ट रखता है।
theological_decisions:
- issue: מִשְׁפָּט और צְדָקָה की नैतिक जोड़ी
  choice: न्याय … धार्मिकता
  alternative: न्याय … सही आचरण
  rationale: दो अलग इब्रानी पदों का भेद रखते हुए पहला सामाजिक और विधिक न्याय को तथा दूसरा व्यापक नैतिक-वाचा संबंधी खराई को व्यक्त करता है। इससे किसी संकीर्ण सांप्रदायिक अर्थ को आरोपित किए बिना पद का तनाव बना रहता है।
