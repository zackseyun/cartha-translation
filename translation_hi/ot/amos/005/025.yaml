- from: हे इस्राएल के घराने, क्या तुम जंगल में उन चालीस वर्षों तक मेरे लिए बलिदान और अन्नबलि[a] लाते रहे?
  to: हे इस्राएल के घराने, क्या तुमने जंगल में चालीस वर्षों तक मुझे बलिदान और भेंट[a] चढ़ाए?
  rationale: Revision preserves the direct rhetorical question and every major source element while avoiding an unnecessary narrowing of מִנְחָה. ‘मुझे ... चढ़ाए’ naturally expresses presentation to the divine addressee and does not add an interpretive claim about acceptance or exclusive devotion.
