source:
  edition: WLC
  text: הַ/זְּבָחִ֨ים וּ/מִנְחָ֜ה הִֽגַּשְׁתֶּם לִ֧/י בַ/מִּדְבָּ֛ר אַרְבָּעִ֥ים שָׁנָ֖ה בֵּ֥ית יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/005/025.yaml
  text: Did you bring me sacrifices and offerings in the wilderness for forty years[a], O house of Israel?
translation:
  language: hi
  text: हे इस्राएल के घराने, क्या तुमने जंगल में चालीस वर्षों तक मुझे बलिदान और भेंट[a] चढ़ाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अन्नबलि’। इब्रानी शब्द सामान्य भेंट या उपहार का भी अर्थ दे सकता है, पर उपासना के संदर्भ में यह विशेष रूप से अन्नबलि के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזְּבָחִים
  choice: बलिदान
  rationale: זֶבַח वध से जुड़े बलिदान को सूचित करता है; ‘बलिदान’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: וּמִנְחָה
  choice: और अन्नबलि
  rationale: उपासना के इस संदर्भ में מִנְחָה का विशिष्ट अर्थ अनाज से चढ़ाई जाने वाली भेंट है। हिन्दी में ‘अन्नबलि’ इस धार्मिक अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: הִגַּשְׁתֶּם
  choice: लाते रहे
  rationale: נגשׁ का हिफ़ील यहाँ किसी भेंट को सामने लाने या अर्पण हेतु प्रस्तुत करने का अर्थ देता है। अवधि के साथ ‘लाते रहे’ निरंतर प्रथा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘चढ़ाते’ कहकर क्रिया में अतिरिक्त धार्मिक अर्थ जोड़ने के।
- source_word: לִי
  choice: मेरे लिए
  rationale: इब्रानी לִי को हिन्दी में ‘मेरे लिए’ स्वाभाविक ढंग से व्यक्त करता है और इस चुनौती को उभारता है कि क्या वे भेंटें सचमुच यहोवा के लिए थीं।
- source_word: בַמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वनप्रदेश या मरुभूमि को सूचित करता है। निर्गमन-कालीन संदर्भ में ‘जंगल’ हिन्दी बाइबलीय प्रयोग में सहज और व्यापक रूप से समझा जाता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: उन चालीस वर्षों तक
  rationale: यह पदावली अवधि बताती है। ‘उन’ प्रसिद्ध जंगल-काल की ओर संकेत करता है और ‘तक’ पूरे काल की अवधि को स्पष्ट करता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह भविष्यद्वक्ताओं में प्रचलित संबोधन है। ‘हे ... घराने’ इसके संबोधनात्मक और सामूहिक स्वर को बनाए रखता है।
theological_decisions:
- issue: प्रश्न का आलंकारिक बल
  choice: इसे तीखी आलंकारिक चुनौती के रूप में प्रश्न ही रहने दिया गया है; निहित उत्तर स्पष्ट नहीं जोड़ा गया।
  alternative: इसे कथन बनाना—‘तुम मेरे लिए ... नहीं लाए’—या एक तटस्थ सूचना-प्रश्न के रूप में प्रस्तुत करना।
  rationale: प्रश्नवाचक הֲ और आमोस 5 का संदर्भ नकारात्मक या चुनौतीपूर्ण उत्तर की अपेक्षा रखते हैं, पर मूल पाठ उस उत्तर को सीधे नहीं कहता। प्रश्नरूप बनाए रखने से धार्मिक तनाव सुरक्षित रहता है।
- issue: बलिदानों की वास्तविक दिशा या स्वीकार्यता
  choice: ‘मेरे लिए’ रखा गया है, पर यह नहीं समझाया गया कि परमेश्वर उन्हें अस्वीकार कर रहे थे, वे अन्य देवताओं के लिए थे, या प्रश्न किसी दूसरी बात पर केंद्रित है।
  alternative: अनुवाद में ‘क्या सचमुच मेरे ही लिए’ जोड़कर एक विशेष व्याख्या को स्पष्ट करना।
  rationale: संदर्भ ऐसी व्याख्याओं को जन्म देता है, किंतु इस पद में ‘सचमुच’ या कोई स्पष्ट व्याख्यात्मक निष्कर्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। भविष्यद्वक्ताई संबोधन के लिए ‘हे इस्राएल के घराने’ औपचारिक स्वर बनाए रखता है। प्रश्न की तीक्ष्णता सुरक्षित है, लेकिन निहित नकारात्मक उत्तर को अनुवाद में नहीं जोड़ा गया।
