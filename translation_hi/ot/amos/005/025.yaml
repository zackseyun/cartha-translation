  verdict: revise
  source_fidelity: The rhetorical interrogative, wilderness setting, forty-year duration, and vocative are retained. However, the Hebrew מִנְחָה has a broader lexical range than the draft’s unqualified ‘अन्नबलि’; in this cultic pairing ‘grain offering’ is plausible but should remain an alternative rather than be imposed as the sole sense. ‘लाते रहे’ also adds an explicit ongoing/iterative nuance that the Hebrew perfect need not state.
  naturalness: ‘हे इस्राएल के घराने’ is appropriately dignified prophetic Hindi. ‘मुझे ... चढ़ाए’ is more idiomatic and direct than ‘मेरे लिए ... लाते रहे’ for presenting sacrificial gifts, while retaining the rhetorical question.
  terminology: Use ‘बलिदान और भेंट’ in the text, with ‘अन्नबलि’ in a lexical footnote. This preserves the source ambiguity and follows the English POB audit trail without flattening the cultic context.
