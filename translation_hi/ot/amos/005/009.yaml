translation:
  language: hi
  text: वह बलवान पर अचानक विनाश ले आता है[a], और गढ़ पर विनाश आ पड़ता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बलवान पर विनाश फूट पड़ने देता है।” यहाँ प्रयुक्त हिब्रू क्रिया दुर्लभ और कठिन है; इसका अर्थ अलग ढंग से भी लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: “गढ़” का अनुवाद “किला” या “किलेबंद स्थान” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּבְלִיג
  choice: जो ... अचानक ... ले आता है
  rationale: हिफ़ील कृदन्त यहाँ संज्ञा की तरह प्रयुक्त है—‘वह जो...’। यह दुर्लभ और कठिन क्रिया प्रसंग में विनाश के अचानक प्रकट होने या टूट पड़ने का भाव देती है। सहज हिन्दी में ‘अचानक ... ले आता है’ इस आकस्मिकता को व्यक्त करता है; शब्द की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: שֹׁד
  choice: विनाश
  rationale: यह संज्ञा हिंसक तबाही, उजाड़ या लूट से हुई बरबादी का बोध करा सकती है। यहाँ गढ़ के पतन के समानान्तर ‘विनाश’ सबसे स्पष्ट और व्यापक विकल्प है।
- source_word: עַל
  choice: पर
  rationale: दोनों स्थानों पर यह विनाश के लक्ष्य को सूचित करता है। ‘पर’ हिन्दी में स्वाभाविक रहते हुए मूल बिम्ब को बनाए रखता है।
- source_word: עָז
  choice: बलवान
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है और किसी शक्तिशाली व्यक्ति या सत्ता को सूचित कर सकता है। ‘बलवान’ इस अस्पष्टता को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: וְשֹׁד
  choice: और ... विनाश
  rationale: हिब्रू संयोजक का सीधा अर्थ ‘और’ है। इसे परिणामसूचक ‘जिससे’ न बनाकर मूल पाठ की व्याकरणिक और अर्थगत खुली संभावना सुरक्षित रखी गई है।
- source_word: מִבְצָר
  choice: गढ़
  rationale: यह किलेबन्द सुरक्षित स्थान को दर्शाता है। ‘गढ़’ संक्षिप्त, स्वाभाविक और काव्यात्मक सैन्य बिम्ब के अनुरूप है।
- source_word: יָבוֹא
  choice: आ पड़ता है
  rationale: मूल क्रिया का आधारभूत अर्थ ‘आना’ है। विनाश के विषय और गढ़ के लक्ष्य के साथ ‘आ पड़ता है’ स्वाभाविक हिन्दी में उसके टूट पड़ने का भाव देता है, पर क्रिया को अत्यधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: कर्ता की पहचान
  choice: कर्ता को ‘जो...’ के कृदन्तीय रूप में ही रखा गया है; आसपास के प्रसंग में संकेत यहोवा की ओर है।
  alternative: इसे किसी निरपेक्ष विनाशकारी शक्ति के रूप में समझना।
  rationale: आमोस 5:8–9 का संदर्भ यहोवा के सामर्थ्य का वर्णन करता है, फिर भी इस पद में दिव्य नाम प्रत्यक्ष नहीं है। इसलिए अनुवाद में नाम जोड़ने के बजाय मूल की अप्रत्यक्षता सुरक्षित रखी गई है।
- issue: दोनों खण्डों का सम्बन्ध
  choice: मूल संयोजक के अनुसार ‘और’ रखा गया है।
  alternative: दूसरे खण्ड को परिणाम मानकर ‘जिससे गढ़ पर विनाश आ पड़ता है’ कहना।
  rationale: וְ परिणाम का भाव दे सकता है, पर वह भाव स्पष्ट रूप से चिह्नित नहीं है। ‘और’ समानान्तरता तथा सम्भावित परिणाम—दोनों पाठों के लिए जगह छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक वाक्य रखा गया है। ‘बलवान’, ‘विनाश’ और ‘गढ़’ सामान्य पाठक के लिए बोधगम्य हैं। दुर्लभ क्रिया की अनिश्चितता को मुख्य पाठ में सहज अभिव्यक्ति और पादटिप्पणी में वैकल्पिक पाठ द्वारा सुरक्षित रखा गया है।
