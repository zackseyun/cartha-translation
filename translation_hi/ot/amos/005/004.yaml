  terminology: “याहवे” appropriately represents יהוה as required. “इस्राएल का घराना” retains the corporate force of בֵּית יִשְׂרָאֵל, and “जीवित रहो” preserves the source’s imperative wording without deciding whether the force is purpose or promised consequence.
