base_translation:
  language: en
  yaml_path: translation/ot/amos/005/004.yaml
  text: 'For thus says Yahweh to the house of Israel: Seek me and live[a].'
translation:
  language: hi
  text: 'क्योंकि याहवे इस्राएल के घराने से यह कहता है: “मुझे खोजो और जीवित रहो[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे खोजो ताकि तुम जीवित रहो,” अथवा “मुझे खोजो, और तुम जीवित रहोगे।” इब्रानी को ऐसे अत्यावश्यक आदेश के रूप में समझा जा सकता है जिसके साथ प्रतिज्ञात परिणाम जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विलाप और न्याय-संदेश के आधार या कारण को प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כֹה אָמַר
  choice: यह कहता है
  rationale: यह नबूवत के संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है। रूप की दृष्टि से אָמַר पूर्ण क्रिया है, पर इस स्थिर सूत्र में कथन को वर्तमान और प्रामाणिक घोषणा के रूप में प्रस्तुत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לְבֵית יִשְׂרָאֵל
  choice: इस्राएल के घराने से
  rationale: לְ यहाँ संबोधित पक्ष दर्शाता है, और ‘घराना’ इस्राएल की सामूहिक तथा वाचा-संबंधी पहचान को केवल ‘इस्राएल’ कहने की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: דִּרְשׁוּנִי
  choice: मेरी खोज करो
  rationale: דרש यहाँ केवल जानकारी पूछने का नहीं, बल्कि याहवे की ओर मुड़कर उसे खोजने का भाव रखता है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: वाव से जुड़े दूसरे आज्ञार्थक रूप को सीधे दूसरे आदेश के रूप में रखा गया है, ताकि जीवन को उद्देश्य, परिणाम या प्रतिज्ञा मानने की संभावनाओं में से किसी एक को मुख्य पाठ में अनावश्यक रूप से निश्चित न किया जाए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम का लिप्यंतरण करता है, उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘मेरी खोज करो और जीवित रहो’ का बल
  choice: सीधा वाचागत आह्वान, जिसमें जीवन को बिना संकुचित अर्थ दिए सामने रखा गया है
  alternative: मेरी खोज करो ताकि तुम जीवित रहो; मेरी खोज करो, और तुम जीवित रहोगे
  rationale: इब्रानी में तीव्र आदेश के साथ उद्देश्य या प्रतिज्ञात परिणाम का भाव समझा जा सकता है। यह पद स्वयं जीवन को केवल शारीरिक बचाव या केवल आत्मिक जीवन तक सीमित नहीं करता, इसलिए अनुवाद उस व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त, गरिमापूर्ण और नबूवत की घोषणा के अनुरूप रखी गई है। ‘घराना’ सामूहिक वाचा-संबंधी अभिव्यक्ति को बनाए रखता है; ‘जीवित रहो’ मूल की संक्षिप्तता और अर्थगत खुलापन सुरक्षित रखता है।
