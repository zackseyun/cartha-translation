    rationale: In “इस्राएल के घराने से याहवे यह कहता है,” the initial “से” can be read as a source (“from the house of Israel”), obscuring the Hebrew לְ, which identifies the house of Israel as the addressee. Placing “से” directly with “कहता है” clearly conveys “says to.”
