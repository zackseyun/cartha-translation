source:
  edition: WLC
  text: וְ/אָ֨נֹכִ֜י הִשְׁמַ֤דְתִּי אֶת הָֽ/אֱמֹרִי֙ מִ/פְּנֵי/הֶ֔ם אֲשֶׁ֨ר כְּ/גֹ֤בַהּ אֲרָזִים֙ גָּבְה֔/וֹ וְ/חָסֹ֥ן ה֖וּא כָּֽ/אַלּוֹנִ֑ים וָ/אַשְׁמִ֤יד פִּרְי/וֹ֙ מִ/מַּ֔עַל וְ/שָׁרָשָׁ֖י/ו מִ/תָּֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/009.yaml
  text: Yet I destroyed the Amorite before them[a], whose height was like the height of cedars, and he was strong like the oaks[b]; I destroyed his fruit above and his roots beneath.
translation:
  language: hi
  text: फिर भी मैंने उनके सामने से एमोरी को नष्ट कर दिया[a], जिसकी ऊँचाई देवदारों की ऊँचाई के समान थी और जो बलूत के पेड़ों के समान बलवान था; मैंने ऊपर से उसका फल और नीचे से उसकी जड़ें नष्ट कर दीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘एमोरी’ एकवचन है, पर यहाँ यह पूरी एमोरी जाति के लिए सामूहिक रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: ‘फल’ और ‘जड़ें’ वृक्ष के बिंब को आगे बढ़ाते हैं और ऊपर से नीचे तक संपूर्ण विनाश का संकेत देते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: फिर भी मैंने
  rationale: संयोजक और बलाघातयुक्त सर्वनाम संदर्भ में विरोध और ‘मैं ही’ के भाव को उभारते हैं; ‘फिर भी मैंने’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִשְׁמַדְתִּי / וָאַשְׁמִיד
  choice: नष्ट कर दिया / नष्ट कर दीं
  rationale: हिफ़ील रूप पूर्ण विनाश कराने का अर्थ देता है। एक ही क्रिया को दोनों स्थानों पर रखने से इब्रानी की पुनरावृत्ति और अलंकारिक बल सुरक्षित रहते हैं।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: इब्रानी में एकवचन जातिवाचक रूप है, जो पूरे एमोरी समुदाय को एक सामूहिक व्यक्तित्व के रूप में प्रस्तुत करता है।
- source_word: מִפְּנֵיהֶם
  choice: उनके सामने से
  rationale: यह स्थानवाचक मुहावरा इस्राएलियों की उपस्थिति या मार्ग से हटाए जाने को व्यक्त करता है और इब्रानी बिंब को बनाए रखता है।
- source_word: אֲשֶׁר כְּגֹבַהּ אֲרָזִים גָּבְהוֹ
  choice: जिसकी ऊँचाई देवदारों की ऊँचाई के समान थी
  rationale: मूल पाठ में ‘ऊँचाई’ की पुनरुक्ति है; इसे बनाए रखने से तुलना का औपचारिक और प्रभावशाली स्वर सुरक्षित रहता है।
- source_word: וְחָסֹן הוּא כָּאַלּוֹנִים
  choice: और जो बाँज के पेड़ों के समान बलवान था
  rationale: חָסֹן शक्ति और दृढ़ता दर्शाता है। אַלּוֹנִים के लिए ‘बाँज के पेड़’ आधुनिक हिन्दी में ओक-वर्ग के मजबूत वृक्षों का सुबोध नाम है।
- source_word: פִּרְיוֹ מִמַּעַל
  choice: ऊपर से उसका फल
  rationale: ‘फल’ वृक्ष के रूपक को जारी रखता है; मुख्य पाठ में इसे ‘वंश’ जैसे व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: וְשָׁרָשָׁיו מִתָּחַת
  choice: नीचे से उसकी जड़ें
  rationale: यह ‘ऊपर से’ के समानांतर है और ऊपर से नीचे तक संपूर्ण विनाश के वृक्ष-बिंब को पूरा करता है।
theological_decisions:
- issue: एमोरी के लिए सामूहिक एकवचन
  choice: ‘एमोरी ... जिसकी ... जो ... उसका ... उसकी’ के रूप में एकवचन बनाए रखा गया।
  alternative: 'पूरे वाक्य को बहुवचन करना: ‘एमोरियों ... उनकी ... वे’।'
  rationale: इब्रानी एकवचन के द्वारा पूरी जाति को एक विशाल वृक्ष जैसे सामूहिक व्यक्तित्व के रूप में चित्रित करता है। इसे बनाए रखने से साहित्यिक रूपक और उसकी तीव्रता सुरक्षित रहती है।
- issue: फल और जड़ों के विनाश का आशय
  choice: मुख्य पाठ में वृक्ष-संबंधी शब्दों को अक्षरशः रखा गया।
  alternative: ‘फल’ को सीधे ‘संतान’ या ‘वंश’ और ‘जड़ों’ को ‘पूर्वजों’ या ‘आधार’ के रूप में स्पष्ट करना।
  rationale: मूल पाठ रूपक का अर्थ स्वयं खुला रखता है। टिप्पणी संपूर्ण विनाश का संकेत बता सकती है, पर मुख्य पाठ को किसी एक विशिष्ट व्याख्या तक सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देवदार’ और ‘बाँज’ वृक्ष-बिंब को स्पष्ट रखते हैं; सामूहिक एकवचन जानबूझकर सुरक्षित रखा गया है।
