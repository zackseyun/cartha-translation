id: AMO.2.12
reference: Amos 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תַּשְׁק֥וּ אֶת הַ/נְּזִרִ֖ים יָ֑יִן וְ/עַל הַ/נְּבִיאִים֙ צִוִּיתֶ֣ם לֵ/אמֹ֔ר לֹ֖א תִּנָּבְאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/012.yaml
  text: But you made the Nazirites drink wine[a], and you commanded the prophets, saying[b], ‘Do not prophesy.’
translation:
  language: hi
  text: लेकिन तुमने नाज़ीरों को दाखमधु पिलाया[a], और नबियों को यह आज्ञा दी[b], “भविष्यवाणी मत करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समर्पित लोगों को।” “नाज़ीर” वे लोग थे जो विशेष मन्नत के द्वारा परमेश्वर के लिए अलग किए गए थे; इस मन्नत में दाखमधु से परहेज़ करना शामिल था।
    reason: lexical_alternative
  - marker: b
    text: या “तुम भविष्यवाणी नहीं करोगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּשְׁקוּ
  choice: तुमने … पिलाया
  rationale: שׁקה का हिफ़ील रूप कारणवाचक है; ‘पिलाया’ हिन्दी में स्वाभाविक रूप से किसी को दाखमधु पीने के लिए विवश करने या देने का भाव व्यक्त करता है।
- source_word: הַנְּזִרִים
  choice: नाज़ीरों
  rationale: यह सामान्य ‘समर्पित लोगों’ के बजाय विशेष मन्नत के अधीन परमेश्वर को समर्पित व्यक्तियों का तकनीकी नाम है; लिप्यंतरण उस विशिष्ट धार्मिक-सांस्कृतिक श्रेणी को सुरक्षित रखता है।
- source_word: יָיִן
  choice: दाखमधु
  rationale: यह יַיִן का मानक, गरिमापूर्ण हिन्दी प्रतिशब्द है और नाज़ीरों के लिए उससे परहेज़ करने की अपेक्षा के संदर्भ में उपयुक्त है।
- source_word: וְעַל הַנְּבִיאִים צִוִּיתֶם
  choice: और नबियों को यह आज्ञा दी
  rationale: צוה के साथ עַל यहाँ उन व्यक्तियों को सूचित करता है जिन पर आज्ञा थोपी गई; हिन्दी में यह रचना अर्थ को स्वाभाविक और स्पष्ट रखती है।
- source_word: לֵאמֹר
  choice: यह … दी
  rationale: सीधे कथन का परिचय हिन्दी में ‘यह आज्ञा दी’ से स्वाभाविक रूप से हो जाता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक होगा।
- source_word: לֹא תִּנָּבְאוּ
  choice: भविष्यवाणी मत करो
  rationale: निषेध के साथ यह बहुवचन क्रियारूप नबियों पर लगाए गए प्रतिबंध को व्यक्त करता है; ‘मत करो’ आधुनिक हिन्दी में सीधी निषेधात्मक आज्ञा है।
theological_decisions:
- issue: נזירים की विशिष्ट वाचागत और समर्पण-संबंधी पहचान
  choice: नाज़ीरों
  alternative: समर्पित लोगों
  rationale: तकनीकी नाम रखने से यह स्पष्ट रहता है कि इस्राएल ने केवल सामान्य धार्मिक लोगों को नहीं, बल्कि विशेष मन्नत द्वारा परमेश्वर के लिए अलग किए गए लोगों को उनके संयम के विरुद्ध दाखमधु पिलाया।
- issue: לֹא תִּנָּבְאוּ में निषेध का बल
  choice: भविष्यवाणी मत करो
  alternative: तुम भविष्यवाणी नहीं करोगे
  rationale: संदर्भ में ये लोगों द्वारा नबियों पर थोपी गई रोक के शब्द हैं। चुना हुआ पाठ इसे स्पष्ट आज्ञात्मक निषेध के रूप में व्यक्त करता है, जबकि विकल्प हिब्रू के रूप की अधिक शाब्दिक सम्भावना दिखाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर पद की भविष्यवाणी-संबंधी गरिमा बनाए रखी गई है। ‘नाज़ीर’ जैसे सांस्कृतिक-धार्मिक तकनीकी शब्द को व्याख्यात्मक पाद-टिप्पणी सहित रखा गया है। ‘लेकिन’ पूर्ववर्ती प्रसंग के साथ विरोध को स्वाभाविक ढंग से जोड़ता है।
