source:
  edition: WLC
  text: וָ/אָקִ֤ים מִ/בְּנֵי/כֶם֙ לִ/נְבִיאִ֔ים וּ/מִ/בַּחוּרֵי/כֶ֖ם לִ/נְזִרִ֑ים הַ/אַ֥ף אֵֽין זֹ֛את בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/011.yaml
  text: And I raised up some of your sons to be prophets[a], and some of your young men to be Nazirites. Is this not so[b], O sons of Israel? declares Yahweh.
translation:
  language: hi
  text: और मैंने तुम्हारे बेटों में से कुछ को भविष्यद्वक्ता और तुम्हारे जवानों में से कुछ को नाज़ीरों के रूप में ठहराया। हे इस्राएल के पुत्रों, क्या यह सच नहीं है? यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאָקִים
  choice: मैंने … ठहराया
  rationale: קום के हिफ़ील रूप का अर्थ यहाँ परमेश्वर द्वारा लोगों को विशेष भूमिकाओं के लिए खड़ा करना या नियुक्त करना है। हिंदी में ‘ठहराया’ इस नियुक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִבְּנֵיכֶם
  choice: तुम्हारे बेटों में से कुछ को
  rationale: मूल पदबंध का शाब्दिक अर्थ ‘तुम्हारे बेटों में से’ है; ‘कुछ’ जोड़ने से उसका अंशवाचक भाव स्पष्ट और स्वाभाविक होता है।
- source_word: לִנְבִיאִים
  choice: भविष्यद्वक्ता
  rationale: लामेद यहाँ भूमिका या परिणाम बताता है। ‘ठहराया’ के साथ ‘भविष्यद्वक्ता’ उस नियुक्त भूमिका को स्पष्ट करता है।
- source_word: וּמִבַּחוּרֵיכֶם
  choice: और तुम्हारे जवानों में से कुछ को
  rationale: בָּחוּר यहाँ युवावस्था के पुरुषों को दर्शाता है; ‘जवानों’ से अर्थ और समानांतर अंशवाचक रचना दोनों सुरक्षित रहते हैं।
- source_word: לִנְזִרִים
  choice: नाज़ीर
  rationale: यह इस्राएल में विशेष मन्नत द्वारा परमेश्वर को समर्पित व्यक्ति के लिए तकनीकी शब्द है। लिप्यंतरण विशिष्ट संस्था को सामान्य ‘समर्पित जन’ में विलीन नहीं करता।
- source_word: הַאַף אֵין זֹאת
  choice: क्या यह सच नहीं है?
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। यह हिंदी रूप उसके बल को स्वाभाविक और स्पष्ट रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: हे इस्राएल के पुत्रो
  rationale: मूल में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है और यह सीधे संबोधन में प्रयुक्त हुआ है। ‘हे’ संबोधन को स्पष्ट करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह मानक भविष्यद्वाणी-सूत्र है। ‘घोषणा’ נְאֻם का औपचारिक बल रखता है और ‘याहवे’ मूल पाठ में आए व्यक्तिगत दिव्य नाम को प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला दिव्य नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय व्यक्तिगत वाचा-नाम के रूप में रखता है।
- issue: נְזִרִים को वर्णनात्मक शब्द या तकनीकी पद के रूप में प्रस्तुत करना
  choice: नाज़ीर
  alternative: समर्पित जन / नाज़ीर की मन्नत मानने वाले
  rationale: यह सामान्य पवित्रता नहीं, इस्राएल की एक पहचानी हुई समर्पण-व्यवस्था को सूचित करता है; इसलिए तकनीकी पद मुख्य पाठ में और संक्षिप्त व्याख्या पादटिप्पणी में दी गई है।
- issue: בְּנֵי יִשְׂרָאֵל के पुरुषवाचक रूप को बनाए रखना
  choice: इस्राएल के पुत्रो
  alternative: इस्राएल की सन्तानो / इस्राएल के लोगो
  rationale: मूल का पुरुषवाचक बहुवचन और वाचिक संबोधन सुरक्षित रखा गया है, जबकि पादटिप्पणी बताती है कि संबोधन समूचे इस्राएली समुदाय के लिए भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। समानांतर इब्रानी रचना को स्वाभाविक हिंदी में एक ही क्रिया ‘ठहराया’ के अधीन रखा गया है। तकनीकी पद ‘नाज़ीर’ और वाचा-नाम ‘याहवे’ को लिप्यंतरित किया गया है; आवश्यक सांस्कृतिक और शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
