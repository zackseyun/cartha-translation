source:
  edition: WLC
  text: הִנֵּ֛ה אָנֹכִ֥י מֵעִ֖יק תַּחְתֵּי/כֶ֑ם כַּ/אֲשֶׁ֤ר תָּעִיק֙ הָ/עֲגָלָ֔ה הַֽ/מְלֵאָ֥ה לָ֖/הּ עָמִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/013.yaml
  text: Look[a], I am pressing down beneath you[b], as a cart presses down when it is full of sheaves.
translation:
  language: hi
  text: देखो[a], मैं तुम्हारे नीचे दबाव डाल रहा हूँ[b], जैसे पूलों से भरी गाड़ी दबाव डालती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुनो।” यह शब्द जोर देकर अगली घोषणा की ओर ध्यान खींचता है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू वाक्यांश कठिन है। इसे “मैं तुम्हें तुम्हारी जगह पर दबा रहा हूँ” या “मैं तुम्हें बोझ से दबा रहा हूँ” भी समझा जा सकता है। क्रिया का भाव आसन्न भविष्य का भी हो सकता है: “मैं तुम्हारे नीचे दबाव डालूँगा।”'
    reason: textual_ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द आगे आने वाली दैवी घोषणा पर जोर देता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका ध्यान खींचने वाला बल बनाए रखता है।
- source_word: אָנֹכִי
  choice: मैं
  rationale: स्वतंत्र सर्वनाम कर्ता पर जोर देता है। ‘देखो, मैं…’ में यह जोर पर्याप्त रूप से व्यक्त होता है; ‘मैं स्वयं’ अनावश्यक रूप से भारी पड़ता।
- source_word: מֵעִיק
  choice: दबा रहा हूँ
  rationale: हिफ़ील रूप दबाव डालने या भार से दबाने का भाव देता है। वर्तमान प्रगतिशील रूप हिब्रू की सजीव, आसन्न घोषणा को व्यक्त करता है, जबकि पादटिप्पणी संभावित भविष्य अर्थ को सुरक्षित रखती है।
- source_word: תַּחְתֵּיכֶם
  choice: तुम्हारे नीचे की जगह को
  rationale: शाब्दिक स्थानवाचक अर्थ ‘तुम्हारे नीचे’ है। हिन्दी में क्रिया को स्पष्ट और भौतिक चित्र को संगत बनाने के लिए ‘जगह को’ जोड़ा गया है; इसे सीधे ‘तुम्हें’ कर्म मानना अधिक व्याख्यात्मक होता।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: तुलना को संक्षिप्त और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: תָּעִיק
  choice: दबाती है
  rationale: पहले खंड की उसी धातु के दोहराव को हिन्दी में भी ‘दबाना’ द्वारा बनाए रखा गया है।
- source_word: הָעֲגָלָה
  choice: गाड़ी
  rationale: यह कृषि-उपज ढोने वाली गाड़ी है। ‘गाड़ी’ सामान्य आधुनिक हिन्दी में सहज है और संदर्भ से उसका स्वरूप स्पष्ट होता है।
- source_word: הַמְלֵאָה לָהּ
  choice: लदी
  rationale: शाब्दिक रूप से ‘जो अपने लिए भरी हुई है’; ‘लदी’ हिन्दी में भार से पूरी भरी गाड़ी की दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָמִיר
  choice: पूलों
  rationale: यह काटे और बाँधे गए अनाज के गट्ठरों या पूलों को दर्शाता है। ‘पूल’ कृषि-बिंब को सटीक और संक्षिप्त रखता है।
theological_decisions:
- issue: न्याय के चित्र में दबाव का लक्ष्य
  choice: परमेश्वर उनके नीचे की जगह को दबा रहा है
  alternative: परमेश्वर उन्हें उनके स्थान पर दबा रहा है / उन्हें बोझ से दबा रहा है
  rationale: हिब्रू תַּחְתֵּיכֶם का सीधा स्थानवाचक अर्थ ‘तुम्हारे नीचे’ है, पर पूरे वाक्य की व्याख्या विवादित है। मुख्य पाठ स्थानवाचक बिंब बनाए रखता है और पादटिप्पणी व्यक्ति को सीधे दबाने वाली वैकल्पिक समझ दर्ज करती है; इस प्रकार न्याय की गंभीरता रहते हुए अनिश्चितता को एक ही अर्थ में बंद नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पूलों से लदी गाड़ी’ ग्रामीण कृषि-बिंब को बनाए रखता है। मुख्य पाठ हिब्रू की स्थानवाचक अभिव्यक्ति और धातु-दोहराव को यथासंभव सुरक्षित रखता है, जबकि कठिन व्याकरणिक और अर्थगत विकल्प पादटिप्पणी में दिए गए हैं।
