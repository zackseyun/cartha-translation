source:
  edition: WLC
  text: וְ/אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶתְ/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וָ/אוֹלֵ֨ךְ אֶתְ/כֶ֤ם בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה לָ/רֶ֖שֶׁת אֶת אֶ֥רֶץ הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/010.yaml
  text: Yet I brought you up from the land of Egypt[a], and I led you in the wilderness forty years, to take possession of the land of the Amorites.
translation:
  language: hi
  text: फिर भी मैं तुम्हें मिस्र देश से निकाल लाया और चालीस वर्ष तक वीराने में तुम्हारी अगुवाई करता रहा, ताकि तुम अमोरियों[a] के देश को अपने अधिकार में ले सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘अमोरी’ एकवचन है, जिसका प्रयोग यहाँ पूरी जाति के लिए सामूहिक अर्थ में हुआ है।
    reason: मूल भाषा के सामूहिक एकवचन और हिन्दी में प्रयुक्त स्वाभाविक बहुवचन को स्पष्ट करना।
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: फिर भी मैं ही
  rationale: संयोजक के साथ स्वतंत्र सर्वनाम प्रसंग में विरोध और बल दोनों व्यक्त करता है। ‘फिर भी मैं ही’ इस्राएल के अपराधों के विपरीत परमेश्वर के किए हुए कार्य पर स्वाभाविक हिन्दी में जोर देता है।
- source_word: הֶעֱלֵיתִי
  choice: निकाल लाया
  rationale: हिफ़ील रूप निर्गमन के प्रसंग में इस्राएल को मिस्र से ऊपर ले आने का द्योतक है। हिन्दी में ‘मिस्र देश से निकाल लाया’ वही ऐतिहासिक भाव स्वाभाविक ढंग से व्यक्त करता है; केवल ‘ऊपर लाया’ यहाँ असहज और भ्रामक हो सकता है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: मूल पाठ में אֶרֶץ ‘देश/भूमि’ स्पष्ट रूप से है; ‘मिस्र देश’ उसे संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וָאוֹלֵךְ אֶתְכֶם
  choice: तुम्हारी अगुवाई करता रहा
  rationale: הלך का हिफ़ील रूप यहाँ किसी को ले चलने या उसकी अगुवाई करने का अर्थ देता है। निरंतर यात्रा की अवधि को देखते हुए ‘करता रहा’ हिन्दी में चालीस वर्षों तक चले कार्य को स्पष्ट करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्गमन-यात्रा के निर्जन, कम आबाद प्रदेश को सूचित करता है। ‘वीराना’ आधुनिक हिन्दी में ‘जंगल’ की वनाच्छादित भूमि वाली संभावित गलत धारणा से बचाता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: संख्या का सीधा अनुवाद है; ‘तक’ अगुवाई की अवधि को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: לָרֶשֶׁת
  choice: अधिकार कर सको
  rationale: ירשׁ का यह रूप भूमि को अपने अधिकार में लेने के उद्देश्य को व्यक्त करता है। ‘अधिकार करना’ सक्रिय विजय और बसने के प्रसंग को दर्शाता है, जबकि ‘विरासत में पाना’ अनावश्यक रूप से एक विशिष्ट व्याख्या जोड़ सकता है।
- source_word: אֶרֶץ הָאֱמֹרִי
  choice: अमोरियों के देश
  rationale: मूल इब्रानी में ‘अमोरी’ व्याकरणिक रूप से एकवचन है, पर जाति के लिए सामूहिक अर्थ में प्रयुक्त हुआ है। सामान्य हिन्दी में बहुवचन ‘अमोरियों’ अर्थ को स्वाभाविक और स्पष्ट रखता है; मूल रूप की सूचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘अमोरी’ का सामूहिक एकवचन
  choice: मुख्य पाठ में स्वाभाविक बहुवचन ‘अमोरियों’ और पादटिप्पणी में इब्रानी एकवचन की सूचना
  alternative: ‘अमोरी के देश’ के रूप में एकवचन बनाए रखना
  rationale: इब्रानी एकवचन यहाँ पूरी जाति के लिए सामूहिक रूप से प्रयुक्त है। हिन्दी में शाब्दिक एकवचन किसी एक व्यक्ति का बोध करा सकता है, इसलिए बहुवचन अर्थ को ठीक से संप्रेषित करता है, जबकि पादटिप्पणी मूल की आकृति और उसकी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर भी मैं ही’ वाक्य के विरोधात्मक और जोरदार स्वर को बनाए रखता है। ‘वीराना’ निर्गमन के निर्जन प्रदेश को ‘जंगल’ की संभावित वन-संबंधी धारणा के बिना व्यक्त करता है।
