  yaml_path: translation/ot/amos/002/016.yaml
  text: Even the stouthearted among the warriors will flee naked on that day,” declares Yahweh[a].
translation:
  language: hi
  text: “योद्धाओं में दृढ़ हृदय वाला व्यक्ति भी उस दिन नंगा होकर भागेगा,” याहवे की यह घोषणा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वीरों में साहसी व्यक्ति भी उस दिन नंगा होकर भागेगा।”
    reason: אַמִּיץ לִבּוֹ के लिए ‘दृढ़ हृदय वाला’ इब्रानी मुहावरे के निकट है; ‘साहसी’ उसका स्वाभाविक आधुनिक हिन्दी विकल्प है। गִּבּוֹרִים के लिए ‘वीर’ एक वैकल्पिक शब्द है।
lexical_decisions:
- source_word: אַמִּיץ לִבּוֹ
  choice: सबसे साहसी
  rationale: शाब्दिक रूप से ‘हृदय में दृढ़/बलवान’ यह इब्रानी मुहावरा साहसी और अडिग व्यक्ति को दर्शाता है। सहज आधुनिक हिन्दी में ‘सबसे साहसी’ उसका अर्थ और यहाँ का उत्कर्ष-भाव व्यक्त करता है।
- source_word: בַּגִּבּוֹרִים
  choice: योद्धाओं में
  rationale: न्याय के इस सैनिक संदर्भ में גִּבּוֹרִים शक्तिशाली लड़ाकों या योद्धाओं को दर्शाता है; ‘योद्धाओं’ से सैन्य अर्थ स्पष्ट रहता है।
- source_word: עָרוֹם
  choice: नंगा होकर
  rationale: मूल शब्द का सीधा अर्थ ‘नंगा’ है। यह घबराहट में पलायन और पूर्ण अपमान की तीखी छवि को बनाए रखता है; ‘वस्त्रहीन’ अपेक्षाकृत शिष्ट किंतु कम प्रभावशाली होता।
- source_word: יָנוּס
  choice: भागेगा
  rationale: क्रिया का अर्थ भय या संकट में भाग निकलना है। ‘भागेगा’ वर्तमान हिन्दी में सीधा और स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक साहित्य का प्रचलित काल-सूचक पद है; ‘उस दिन’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם गंभीर भविष्यसूचक घोषणा का सूत्र है। याहवे नाम को उपाधि से बदलने के बजाय मूल में उपस्थित परमेश्वर के निजी नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी नाम सीधे आया है। ‘याहवे’ उसका निकट प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: साहसी योद्धा का पलायन
  choice: सबसे साहसी भी भागेगा
  alternative: दृढ़ हृदय वाला भी भागेगा
  rationale: पद का बल इस बात पर है कि न्याय के दिन योद्धाओं में अत्यंत साहसी व्यक्ति भी बच नहीं सकेगा। अनुवाद उस उलटाव को बनाए रखता है, बिना यह जोड़े कि वह सफलतापूर्वक बच निकलेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के लिए सहज रखी गई है। ‘नंगा’ जानबूझकर रखा गया है, क्योंकि मूल की कठोर और अपमानसूचक छवि को नरम करना उचित नहीं होगा।
