lexical_decisions:
- source_word: אָבַד מָנוֹס מִקָּל
  choice: तेज़ दौड़नेवाले के लिए भी भाग निकलने का कोई उपाय न रहेगा
  rationale: यह वाक्यांश बताता है कि तेज़ व्यक्ति से भी भागकर बचने की सम्भावना छिन जाएगी। यह हिन्दी में स्वाभाविक रहते हुए אָבַד की पूर्ण हानि और מָנוֹס के पलायन/बच निकलने के भाव को व्यक्त करता है।
- source_word: חָזָק
  choice: बलवान
  rationale: यह विशेषण यहाँ संज्ञा के रूप में शक्तिशाली व्यक्ति के लिए प्रयुक्त है; ‘बलवान’ अगले शब्द ‘योद्धा’ से इसका भेद बनाए रखता है।
- source_word: יְאַמֵּץ כֹּחוֹ
  choice: अपना बल न जुटा सकेगा
  rationale: शाब्दिक ‘अपने बल को दृढ़ न करेगा’ हिन्दी में अस्वाभाविक है। ‘बल जुटाना’ उस आशय को स्वाभाविक ढंग से व्यक्त करता है कि बलवान संकट में अपनी सामर्थ्य का उपयोग नहीं कर पाएगा।
- source_word: גִּבּוֹר
  choice: योद्धा
  rationale: न्याय और युद्ध के प्रसंग में यह शब्द किसी वीर अथवा शक्तिशाली लड़ाके को सूचित करता है; यहाँ ‘योद्धा’ सबसे स्पष्ट है।
- source_word: יְמַלֵּט נַפְשׁוֹ
  choice: अपना प्राण न बचा सकेगा
  rationale: מלט का अर्थ छुड़ाना या बचाना है, और इस संकट-सन्दर्भ में נפש व्यक्ति के जीवन को सूचित करता है, किसी पृथक अमूर्त ‘आत्मा’ को नहीं।
