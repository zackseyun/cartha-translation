source:
  edition: WLC
  text: וְ/עַל בְּגָדִ֤ים חֲבֻלִים֙ יַטּ֔וּ אֵ֖צֶל כָּל מִזְבֵּ֑חַ וְ/יֵ֤ין עֲנוּשִׁים֙ יִשְׁתּ֔וּ בֵּ֖ית אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/008.yaml
  text: And on garments taken in pledge they stretch themselves out beside every altar[c][b][a], and in the house of their God they drink the wine of those they have fined.
translation:
  language: hi
  text: वे गिरवी रखे हुए कपड़ों पर हर वेदी के पास पसर जाते हैं[a], और अपने देवताओं के घर में जिन लोगों पर जुर्माना लगाया गया है उनकी दाखमधु पीते हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे गिरवी रखे कपड़ों पर हर वेदी के पास लेट जाते हैं।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिन लोगों पर जुर्माना लगाया गया है उनकी दाखमधु” या “दंडित लोगों की दाखमधु”; इसका आशय उनसे वसूले गए जुर्माने से प्राप्त दाखमधु भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'कुछ लोग इसका अनुवाद “अपने परमेश्वर के घर में” करते हैं; हिब्रू शब्द का रूप बहुवचन है: “उनके देवताओं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגָדִים חֲבֻלִים
  choice: गिरवी रखे हुए कपड़े
  rationale: यह पदबंध ऋण की जमानत के रूप में लिए गए वस्त्रों को दर्शाता है। ‘कपड़े’ सामान्य और सहज है, जबकि ‘गिरवी रखे हुए’ कानूनी-आर्थिक आशय स्पष्ट करता है।
- source_word: יַטּוּ
  choice: पसर जाते हैं
  rationale: हिफ़ील रूप यहाँ शरीर फैलाकर लेटने या टिकने की छवि देता है। ‘पसर जाते हैं’ भोग-विलास और निर्लज्ज दुरुपयोग का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵצֶל כָּל מִזְבֵּחַ
  choice: हर वेदी के पास
  rationale: स्थानसूचक אֵצֶל और כָּל के वितरणात्मक बल को सीधे और सहज रूप में व्यक्त करता है।
- source_word: יֵין עֲנוּשִׁים
  choice: जुर्माना किए गए लोगों की दाखमधु
  rationale: עֲנוּשִׁים दंडित या विशेषतः आर्थिक जुर्माना लगाए गए लोगों को सूचित कर सकता है। यह अनुवाद मूल संबंध को जानबूझकर कुछ हद तक खुला रखता है; दाखमधु संभवतः उनसे वसूले गए जुर्मानों से प्राप्त हुई थी।
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: अपने देवताओं के भवन में
  rationale: אֱלֹהֵיהֶם का रूप बहुवचन है और प्रत्यय ‘उनके’ है। यहाँ ‘अपने’ हिन्दी में उसी कर्ता की ओर स्वाभाविक रूप से लौटता है; ‘देवताओं’ रूपगत बहुवचन और प्रसंग की विवादात्मक धार सुरक्षित रखता है।
theological_decisions:
- issue: אֱלֹהֵיהֶם को एकवचन ‘उनके परमेश्वर’ या बहुवचन ‘उनके देवताओं’ के रूप में प्रस्तुत करना
  choice: अपने देवताओं
  alternative: अपने परमेश्वर
  rationale: हिब्रू रूप आकृतिगत रूप से बहुवचन है। यद्यपि אֱלֹהִים कभी एकवचन अर्थ में इस्राएल के परमेश्वर के लिए आता है, अनेक वेदियों और भ्रष्ट उपासना के इस प्रसंग में बहुवचन अनुवाद वास्तविक भाषिक और धर्मवैचारिक तनाव को बिना समतल किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पसर जाते हैं’ मूल की शारीरिक और नैतिक छवि को जीवंत रखता है। सभी वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं और हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
