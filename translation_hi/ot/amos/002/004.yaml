  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יְהוּדָ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל מָאֳסָ֞/ם אֶת תּוֹרַ֣ת יְהוָ֗ה וְ/חֻקָּי/ו֙ לֹ֣א שָׁמָ֔רוּ וַ/יַּתְעוּ/ם֙ כִּזְבֵי/הֶ֔ם אֲשֶׁר הָלְכ֥וּ אֲבוֹתָ֖/ם אַחֲרֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/004.yaml
  text: 'Thus says Yahweh: “For three transgressions of Judah[a], and for four, I will not turn it back, because they have rejected the law of Yahweh and have not kept his statutes; and their lies have led them astray[c][b], after which their fathers walked.”'
translation:
  language: hi
  text: 'यहोवा यों कहता है:


    “यहूदा के तीन अपराधों के कारण,


    वरन् चार के कारण, मैं इसे वापस नहीं लूँगा[a],


    क्योंकि उन्होंने यहोवा की व्यवस्था[b] को ठुकरा दिया


    और उसकी विधियों का पालन नहीं किया।


    उनके झूठ[c] ने उन्हें भटका दिया,


    जिनके पीछे उनके पुरखे चलते थे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इसे नहीं पलटूँगा,” अर्थात घोषित न्याय या दण्ड को।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा की व्यवस्था” का अनुवाद “यहोवा की शिक्षा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “उनके झूठ” विशेष रूप से झूठे देवताओं या मूर्तियों की ओर संकेत कर सकता है—पूजा की वे भ्रामक वस्तुएँ जिनके पीछे उनके पुरखे चले थे।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण को रखा गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: פִּשְׁעֵי
  choice: अपराधों
  rationale: यह शब्द गंभीर नैतिक और वाचा-संबंधी उल्लंघनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आमोस की आवर्ती उक्ति के अनुकूल है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं इसे नहीं टालूँगा
  rationale: हिब्रू में कर्म अप्रकट है। यह अभिव्यक्ति घोषित न्याय को वापस लेने या टालने का भाव देती है, पर मुख्य पाठ में ‘दण्ड’ जोड़कर अस्पष्टता को पूरी तरह समाप्त नहीं करती।
- source_word: מָאֳסָם
  choice: उन्होंने ... ठुकरा दिया
  rationale: यह यहोवा की शिक्षा के जानबूझकर अस्वीकार को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था
  rationale: वाचा और आज्ञाओं के संदर्भ में ‘व्यवस्था’ परिचित तथा उपयुक्त है; ‘शिक्षा’ का व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: חֻקָּיו
  choice: उसकी विधियों
  rationale: वाचा-संबंधी निर्धारित नियमों के लिए यह गरिमापूर्ण और बोधगम्य हिन्दी शब्द है।
- source_word: שָׁמָרוּ
  choice: पालन नहीं किया
  rationale: कानूनी और वाचा-संबंधी संदर्भ में שמר के आज्ञापालन वाले अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּתְעוּם
  choice: ने उन्हें भटका दिया
  rationale: हिफ़ील रूप के किसी को गलत मार्ग पर ले जाने वाले कारक अर्थ को सीधे व्यक्त करता है।
- source_word: כִּזְבֵיהֶם
  choice: उनके झूठ
  rationale: मूल शब्द का सीधा अर्थ रखा गया है; झूठे देवताओं या मूर्तियों की ओर सम्भावित संकेत को मुख्य पाठ में आरोपित करने के बजाय पादटिप्पणी में बताया गया है।
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם אַחֲרֵיהֶם
  choice: उन्हीं के पीछे उनके पुरखे चलते थे
  rationale: ‘पीछे चलने’ की हिब्रू छवि और ‘उनके झूठ’ के साथ संबंध दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: לֹא אֲשִׁיבֶנּוּ में अप्रकट कर्म का आशय
  choice: मुख्य पाठ में ‘मैं इसे नहीं टालूँगा’ रखकर कर्म को सामान्य और अप्रकट रखा गया।
  alternative: ‘मैं दण्ड को वापस नहीं लूँगा’ या ‘मैं दण्ड देने से नहीं फिरूँगा।’
  rationale: हिब्रू की आवर्ती उक्ति संक्षिप्त है और सर्वनाम किस घोषित वस्तु की ओर संकेत करता है, इसे स्पष्ट नहीं करती; इसलिए ‘दण्ड’ या ‘क्रोध’ जोड़कर अर्थ को सीमित नहीं किया गया।
- issue: כִּזְבֵיהֶם का संदर्भ
  choice: मुख्य पाठ में शाब्दिक ‘उनके झूठ’।
  alternative: ‘उनके झूठे देवता’ या ‘उनकी मूर्तियाँ।’
  rationale: भविष्यद्वाणी साहित्य में यह शब्द झूठे देवताओं या भ्रामक मूर्तिपूजा का सूचक हो सकता है, पर यहाँ संज्ञा स्वयं व्यापक है; इसलिए वास्तविक संदिग्धता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक पंक्ति-विन्यास और गरिमापूर्ण भविष्यद्वाणी शैली के साथ रखी गई है। ‘वरन् चार’ बढ़ती हुई संख्यात्मक उक्ति का बल बनाए रखता है। ‘पुरखे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि मूल के ‘पिता’ को सामूहिक पूर्वजों के अर्थ में व्यक्त करता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
