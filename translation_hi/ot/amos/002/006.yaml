reference: Amos 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י יִשְׂרָאֵ֔ל וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל מִכְרָ֤/ם בַּ/כֶּ֨סֶף֙ צַדִּ֔יק וְ/אֶבְי֖וֹן בַּ/עֲב֥וּר נַעֲלָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Israel[a], and for four, I will not revoke the punishment, because they sell the righteous for silver, and the needy for a pair of sandals.”'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “इस्राएल के तीन अपराधों के कारण,


    वरन् चार के कारण,


    मैं उसे वापस नहीं लूँगा[a],


    क्योंकि वे धर्मी जन को चाँदी के लिए


    और ज़रूरतमंद को एक जोड़ी चप्पलों के लिए बेच देते हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे रद्द नहीं करूँगा”; अर्थात मैं घोषित न्याय-दण्ड को वापस नहीं लूँगा।
    reason: इब्रानी में ‘उसे’ का स्पष्ट संज्ञा-सन्दर्भ नहीं है; यह सम्भवतः घोषित न्याय या दण्ड की ओर संकेत करता है।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: यह भविष्यद्वक्ताओं का मानक सन्देशवाहक सूत्र है। ‘यों कहते हैं’ स्वाभाविक और गरिमापूर्ण हिन्दी है, और याहवे वाचा से जुड़े परमेश्वर के निजी नाम को व्यक्त करता है।
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי יִשְׂרָאֵל וְעַל אַרְבָּעָה
  choice: इस्राएल के तीन अपराधों के कारण, वरन् चार के कारण
  rationale: यह आमोस में बार-बार आने वाली बढ़ती हुई संख्या की अलंकारिक उक्ति को बनाए रखता है। ‘अपराध’ פֶּשַׁע के नैतिक और विद्रोहात्मक बल को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसे वापस नहीं फेरूँगा
  rationale: इब्रानी में पुल्लिंग एकवचन कर्म-सूचक प्रत्यय है, पर उसका स्पष्ट संज्ञा-सन्दर्भ नहीं दिया गया। यह अनुवाद उस अनिश्चितता को बनाए रखता है; सम्भावित आशय पादटिप्पणी में बताया गया है।
- source_word: מִכְרָם
  choice: क्योंकि वे ... बेच देते हैं
  rationale: עַל के बाद प्रत्यययुक्त infinitive construct न्याय का कारण बताता है। हिन्दी में कारणवाचक finite clause अधिक स्वाभाविक है।
- source_word: בַּכֶּסֶף
  choice: चाँदी के लिए
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ है; इसे सामान्य ‘धन’ में बदलने से मूल बिम्ब मिट जाता।
- source_word: צַדִּיק
  choice: धर्मी जन
  rationale: צַדִּיק का अर्थ धर्मी अथवा न्यायिक दृष्टि से सही पक्ष वाला व्यक्ति हो सकता है। ‘धर्मी जन’ धार्मिक-नैतिक शब्द-संबंध को बनाए रखता है, जबकि ‘जन’ हिन्दी में संज्ञात्मक प्रयोग को सहज बनाता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: אֶבְיוֹן उस व्यक्ति पर बल देता है जो अभाव में है। ‘ज़रूरतमंद’ आधुनिक हिन्दी में स्वाभाविक और अपमानरहित है।
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: एक जोड़ी चप्पलों के लिए
  rationale: נַעֲלָיִם का द्विवचन रूप जोड़ी का संकेत देता है। ‘चप्पलें’ प्राचीन पादत्राण के बिम्ब और तुच्छ मूल्य के अपमानजनक विनिमय को सहज हिन्दी में व्यक्त करती हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: निजी वाचा-नाम को नाम के रूप में प्रस्तुत किया गया है; इसे उपाधि ‘प्रभु’ से बदलने पर मूल पाठ का भेद मिट सकता था।
- issue: आमोस के आवर्ती वाक्य לֹא אֲשִׁיבֶנּוּ का आशय
  choice: मैं उसे वापस नहीं फेरूँगा
  alternative: मैं दण्ड को नहीं टालूँगा; मैं अपना निर्णय वापस नहीं लूँगा
  rationale: मूल पाठ में ‘उसे’ का आशय स्पष्ट संज्ञा से नहीं बताया गया है। मुख्य पाठ उस वास्तविक अस्पष्टता को रखता है और पादटिप्पणी सम्भावित न्याय-सन्दर्भ स्पष्ट करती है।
- issue: צַדִּיק का सामाजिक-न्यायिक अर्थ
  choice: धर्मी जन
  alternative: निर्दोष जन; न्याय पाने का अधिकारी
  rationale: सन्दर्भ न्यायिक शोषण का हो सकता है, पर केवल ‘निर्दोष’ चुनना शब्द के व्यापक धार्मिक-नैतिक बल को सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुलभ रखी गई है। काव्यात्मक पंक्ति-विन्यास ने भविष्यद्वाणी के सूत्र, संख्यात्मक उत्कर्ष और दो समानान्तर आरोपों को उभारा है। मुख्य पाठ में मूल इब्रानी की कर्म-संबंधी अस्पष्टता जानबूझकर सुरक्षित है।
