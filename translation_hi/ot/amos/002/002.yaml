base_translation:
  language: en
  yaml_path: translation/ot/amos/002/002.yaml
  text: So I will send fire upon Moab[a], and it will consume the citadels of Kerioth; and Moab will die amid tumult, amid shouting[c][b], amid the sound of a trumpet.
translation:
  language: hi
  text: इसलिए मैं मोआब पर आग भेजूँगा, और वह करिय्योत के गढ़ों[a] को भस्म कर देगी। तब मोआब कोलाहल के बीच, युद्ध-घोष[b] और नरसिंगे की ध्वनि के बीच मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “करिय्योत के राजमहलों” अथवा “करिय्योत के दुर्गों।” करिय्योत को “नगरों” भी समझा जा सकता है, यद्यपि यहाँ इसका स्थान-नाम होना अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: b
    text: या “जयघोष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: इसलिए मैं ... भेजूँगा
  rationale: संयोजक וְ को न्याय-वचनों की क्रमिक परिणति के रूप में स्वाभाविक हिन्दी ‘इसलिए’ से व्यक्त किया गया है; प्रथम पुरुष में परमेश्वर की सीधी कर्तृता बनी रहती है।
- source_word: אֵשׁ בְּמוֹאָב
  choice: मोआब पर आग
  rationale: आग द्वारा विनाश के भाव में בְּ का लक्ष्यसूचक अर्थ ‘पर’ स्वाभाविक है और न्याय की मूल बिंबात्मक भाषा को बनाए रखता है।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है। अग्नि के संदर्भ में ‘भस्म कर देना’ सामान्य पाठक के लिए स्वाभाविक है और पूर्ण विनाश का भाव देता है।
- source_word: אַרְמְנוֹת
  choice: गढ़ों
  rationale: यह शब्द राजकीय भवनों अथवा किलेबंद दुर्गों को सूचित कर सकता है। ‘गढ़’ रक्षात्मक और सामर्थ्य-केंद्रित अर्थ को संक्षेप में व्यक्त करता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הַקְּרִיּוֹת
  choice: करिय्योत
  rationale: संदर्भ में इसे मोआब के एक स्थान-नाम के रूप में ग्रहण किया गया है। ‘नगरों’ का सामान्य संज्ञा-अर्थ संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמֵת
  choice: तब मोआब ... मर जाएगा
  rationale: पूर्ण क्रिया भविष्यसूचक न्याय-क्रम में भविष्य का कार्य बताती है। राष्ट्र का मानवीकरण करते हुए मूल ‘मरना’ को सीधे रखा गया है।
- source_word: בְּשָׁאוֹן
  choice: कोलाहल के बीच
  rationale: शब्द युद्धजनित शोर, हंगामे या उथल-पुथल को दर्शाता है; ‘कोलाहल’ गरिमापूर्ण और बोधगम्य हिन्दी है।
- source_word: בִּתְרוּעָה
  choice: युद्ध-घोष
  rationale: תְּרוּעָה जयघोष, ऊँची पुकार, युद्ध-घोष या कभी वाद्य-ध्वनि का अर्थ दे सकता है। अगले पदांश में नरसिंगे की ध्वनि स्पष्ट होने के कारण यहाँ ‘युद्ध-घोष’ उपयुक्त है।
- source_word: בְּקוֹל שׁוֹפָר
  choice: नरसिंगे की ध्वनि
  rationale: שׁוֹפָר युद्ध और सभा में प्रयुक्त सींग का वाद्य है। ‘नरसिंगा’ हिन्दी बाइबलीय और सांस्कृतिक संदर्भ में स्पष्ट है तथा केवल आधुनिक धातु की तुरही का आभास नहीं देता।
