  text: וְ/תֹפֵ֤שׂ הַ/קֶּ֨שֶׁת֙ לֹ֣א יַעֲמֹ֔ד וְ/קַ֥ל בְּ/רַגְלָ֖י/ו לֹ֣א יְמַלֵּ֑ט וְ/רֹכֵ֣ב הַ/סּ֔וּס לֹ֥א יְמַלֵּ֖ט נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/015.yaml
  text: And the one who grasps the bow will not stand[a], and the swift of foot will not escape[c][b], and the rider of the horse will not save his life.
translation:
  language: hi
  text: और धनुष थामनेवाला टिक न सकेगा[a], और तेज़ दौड़नेवाला बचकर न निकल सकेगा, और घोड़े पर सवार अपनी जान न बचा सकेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने स्थान पर डटा न रह सकेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹפֵשׂ הַקֶּשֶׁת
  choice: धनुष थामनेवाला
  rationale: यह इब्रानी के शाब्दिक चित्र, ‘धनुष पकड़नेवाला’, को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और ‘तीरंदाज़’ की अपेक्षा अभिव्यक्ति के रूप के अधिक निकट है।
- source_word: לֹא יַעֲמֹד
  choice: टिक न सकेगा
  rationale: עמד का मूल अर्थ ‘खड़ा रहना’ है; युद्ध और न्याय के इस प्रसंग में ‘टिकना’ अपने स्थान पर डटे रहने या सामना कर पाने का स्वाभाविक हिन्दी भाव देता है।
- source_word: קַל בְּרַגְלָיו
  choice: तेज़ दौड़नेवाला
  rationale: शाब्दिक अर्थ ‘पाँवों में तेज़’ है। ‘तेज़ दौड़नेवाला’ सामान्य पाठक के लिए सहज है और भागने की गति का भाव स्पष्ट रखता है।
- source_word: יְמַלֵּט
  choice: बचकर न निकल सकेगा
  rationale: इस खंड में क्रिया का अर्थ संकट से निकल भागना है; यह हिन्दी प्रयोग उस भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹכֵב הַסּוּס
  choice: घोड़े पर सवार
  rationale: यह एकवचन इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और सवार के चित्र को स्पष्ट बनाए रखता है।
- source_word: יְמַלֵּט נַפְשׁוֹ
  choice: अपनी जान न बचा सकेगा
  rationale: इस प्रसंग में נֶפֶשׁ व्यक्ति के जीवन को सूचित करता है; ‘अपनी जान बचाना’ आधुनिक हिन्दी में सटीक और सहज मुहावरा है।
