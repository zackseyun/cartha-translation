base_translation:
  language: en
  yaml_path: translation/ot/amos/002/003.yaml
  text: And I will cut off the judge from her midst[a], and I will kill all her officials with him,” says Yahweh.
translation:
  language: hi
  text: और मैं उसके बीच से शासक[a] को मिटा दूँगा, और उस शासक के साथ उसके सभी अधिकारियों को मार डालूँगा,” याहवे का कहना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायाधीश”; इब्रानी शब्द किसी न्यायिक अधिकारी को अथवा यहाँ अधिक व्यापक अर्थ में शासन करने वाले व्यक्ति को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: मैं ... का अन्त कर दूँगा
  rationale: हिफ़ील में כרת निर्णायक रूप से काट डालने, हटा देने या नष्ट कर देने का भाव रखता है। हिन्दी में ‘का अन्त कर दूँगा’ न्याय के कठोर और निर्णायक परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שׁוֹפֵט
  choice: शासक
  rationale: शब्द का मूल अर्थ ‘न्यायाधीश’ है, पर यहाँ मोआब के राजनीतिक नेतृत्व और समानांतर ‘अधिकारियों’ के संदर्भ में यह व्यापक रूप से शासन करने वाले व्यक्ति को सूचित कर सकता है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מִקִּרְבָּהּ
  choice: उसके बीच से
  rationale: स्त्रीलिंग एकवचन प्रत्यय मोआब को व्यक्तिरूप में प्रस्तुत करता है। हिन्दी में ‘उसके बीच से’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: וְכָל שָׂרֶיהָ
  choice: उसके सभी अधिकारियों को
  rationale: שָׂרִים शासकीय प्रधानों, अधिकारियों या अगुवों को दर्शा सकता है। ‘अधिकारी’ आधुनिक हिन्दी में शासक वर्ग के सदस्यों का स्पष्ट, गैर-वंशानुगत संकेत देता है।
- source_word: אֶהֱרֹג
  choice: मार डालूँगा
  rationale: הרג का सीधा अर्थ मारना है। ‘मार डालूँगा’ भावी दण्ड की निश्चितता और तीव्रता को स्पष्ट करता है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: पुल्लिंग एकवचन प्रत्यय स्वाभाविक रूप से पहले आए एकवचन ‘शासक’ की ओर लौटता है और अधिकारियों के उसी भाग्य में सम्मिलित होने को बताता है।
- source_word: אָמַר יְהוָה
  choice: यहोवा का कहना है
  rationale: यह भविष्यद्वाणी का उद्धरण-सूत्र है। יְהוָה को उसके व्यक्तिगत वाचा-नाम के प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: שׁוֹפֵט का पदगत अर्थ
  choice: शासक
  alternative: न्यायाधीश
  rationale: मोआब के नेतृत्व और उसके अधिकारियों के समानांतर प्रयोग में राजनीतिक शासक का व्यापक अर्थ संदर्भानुकूल है, पर मूल शब्द के न्यायिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। मोआब के लिए मूल का स्त्रीलिंग व्यक्तिरूप ‘उसके’ में स्वाभाविक रूप से बना रहता है; पदगत अस्पष्टता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
