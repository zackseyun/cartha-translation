source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י מוֹאָ֔ב וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל שָׂרְפ֛/וֹ עַצְמ֥וֹת מֶֽלֶךְ אֱד֖וֹם לַ/שִּֽׂיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/001.yaml
  text: 'Thus says Yahweh: “For three transgressions of Moab[a], and for four, I will not revoke it[b], because he burned the bones of the king of Edom to lime.”'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “मोआब के तीन अपराधों के कारण,

    और चार के कारण,

    मैं उसे वापस नहीं लूँगा[a],

    क्योंकि उसने एदोम के राजा की हड्डियों को चूना होने तक जला दिया[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे नहीं फेरूँगा”; अर्थात् मैं घोषित दण्ड को वापस नहीं लूँगा।
    reason: lexical_alternative
  - marker: b
    text: या, “चूने में बदल दिया” अथवा “पलस्तर बना दिया”; इब्रानी का आशय हड्डियों को इतनी पूरी तरह जलाने से है कि वे चूना बन गईं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह भविष्यद्वक्ताओं का मानक संदेशवाहक-सूत्र है। יְהוָה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘यहोवा’ रखा गया है।
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי מוֹאָב וְעַל אַרְבָּעָה
  choice: मोआब के तीन अपराधों के कारण, बल्कि चार के कारण
  rationale: यह आमोस की संख्यात्मक वृद्धि वाली उक्ति को बनाए रखता है। ‘अपराध’ פֶּשַׁע में निहित नैतिक विद्रोह और दोष, दोनों को सामान्य आधुनिक हिन्दी में व्यक्त करता है। ‘बल्कि’ बताता है कि चार, तीन में जोड़ी गई निर्णायक पराकाष्ठा है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसे वापस नहीं लूँगा
  rationale: इब्रानी के शाब्दिक मुहावरे ‘मैं उसे वापस नहीं फेरूँगा’ और उसके पुल्लिंग एकवचन कर्म-सर्वनाम को बनाए रखा गया है। सन्दर्भ में ‘उसे’ घोषित दण्ड या न्यायादेश की ओर संकेत करता है, पर मुख्य पाठ उस अनिर्दिष्टता को जबरन नहीं खोलता।
- source_word: עַל שָׂרְפוֹ
  choice: क्योंकि उसने ... जलाकर
  rationale: עַל यहाँ न्याय के आधार को व्यक्त करता है। क्रियारूप का एकवचन प्रत्यय ‘उसने’ के रूप में सुरक्षित है; यह मोआब को सामूहिक रूप से एक व्यक्ति मानकर कहता है।
- source_word: עַצְמוֹת מֶלֶךְ אֱדוֹם
  choice: एदोम के राजा की हड्डियों
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्पष्ट हिन्दी रूप है।
- source_word: לַשִּׂיד
  choice: चूना बना दिया
  rationale: שִׂיד का अर्थ चूना या पलस्तर है, केवल राख नहीं। यह रूप हड्डियों को इतनी पूरी तरह जलाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है कि वे चूने में बदल गईं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्रामेटन ईश्वर के व्यक्तिवाचक वाचा-नाम के रूप में आया है। हिन्दी बाइबलीय प्रयोग में व्यापक और पहचाना जाने वाला रूप ‘यहोवा’ चुना गया है; इसे उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: לֹא אֲשִׁיבֶנּוּ में अनिर्दिष्ट कर्म
  choice: सर्वनाम ‘उसे’ को मुख्य पाठ में बनाए रखना
  alternative: मैं अपना दण्ड नहीं टालूँगा
  rationale: सन्दर्भ घोषित दण्ड की ओर संकेत करता है, किन्तु इब्रानी स्वयं संज्ञा नहीं देता। सर्वनाम बनाए रखने से मूल की वास्तविक अनिर्दिष्टता और न्याय की अटलता दोनों सुरक्षित रहती हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, काव्यात्मक पंक्ति-विन्यास और भविष्यद्वक्ताओं के अनुरूप गरिमामय स्वर में रखी गई है। वाक्य सामान्य पाठक के लिए सहज है, जबकि संख्यात्मक सूत्र, सामूहिक एकवचन और अनिर्दिष्ट कर्म-सर्वनाम जैसे मूल-पाठ के महत्त्वपूर्ण गुण सुरक्षित हैं।
