source:
  edition: WLC
  text: הַ/שֹּׁאֲפִ֤ים עַל עֲפַר אֶ֨רֶץ֙ בְּ/רֹ֣אשׁ דַּלִּ֔ים וְ/דֶ֥רֶךְ עֲנָוִ֖ים יַטּ֑וּ וְ/אִ֣ישׁ וְ/אָבִ֗י/ו יֵֽלְכוּ֙ אֶל הַֽ/נַּעֲרָ֔ה לְמַ֥עַן חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/002/007.yaml
  text: those who trample the head of the poor into the dust of the earth[a], and turn aside the way of the humble; and a man and his father go in to the same girl[d][c][b], so as to profane my holy name.
translation:
  language: hi
  text: 'जो गरीबों के सिर को धरती की धूल में रौंदते हैं[a]

    और दीनों के मार्ग को मोड़ देते हैं[b];

    एक पुरुष और उसका पिता एक ही युवती के पास जाते हैं[c][d],

    और इस प्रकार मेरे पवित्र नाम को अपवित्र करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो गरीबों के सिर पर पड़ी धरती की धूल के लिए हाँफते हैं।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ तीव्र लालसा से हाँफना हो सकता है, पर इस संदर्भ में यह संभवतः निर्मम दमन का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “दुःख से दबे हुए लोगों के मार्ग को हटा देते हैं,” अथवा “नम्र लोगों का रास्ता बिगाड़ देते हैं।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “युवती के पास जाते हैं”; यहाँ यह यौन संबंध की शिष्टोक्ति है। נַעֲרָה का अनुवाद “लड़की” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: यह पद उस युवती को स्पष्ट रूप से मंदिर की वेश्या, दासी या गुलाम नहीं बताता, यद्यपि कुछ व्याख्याकार संदर्भ से ऐसे शोषण की संभावना देखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַשֹּׁאֲפִים עַל עֲפַר אֶרֶץ בְּרֹאשׁ דַּלִּים
  choice: कंगालों के सिर को धरती की धूल में रौंदते हैं
  rationale: שׁאף का मूल अर्थ हाँफना या तीव्र लालसा करना हो सकता है, पर इस संदर्भ में पूरा पदबंध निर्बलों के क्रूर दमन और अपमान का चित्र प्रस्तुत करता है। ‘रौंदते हैं’ आधुनिक हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: דַּלִּים
  choice: कंगालों
  rationale: यह शब्द आर्थिक रूप से गरीब और सामाजिक रूप से निर्बल लोगों को सूचित करता है। ‘कंगाल’ यहाँ उनकी असहाय दशा को स्पष्ट और सजीव ढंग से व्यक्त करता है।
- source_word: וְדֶרֶךְ עֲנָוִים יַטּוּ
  choice: दीनों के मार्ग को मोड़ देते हैं
  rationale: דֶּרֶךְ के मार्ग-रूपक और יַטּוּ के ‘मोड़ देना/हटा देना’ भाव को बनाए रखा गया है। עֲנָוִים में दीनता, नम्रता और दुःख से दबे होने के मिले-जुले अर्थ हैं; ‘दीन’ इस अर्थ-परास को अपेक्षाकृत खुला रखता है।
- source_word: וְאִישׁ וְאָבִיו
  choice: एक पुरुष और उसका पिता
  rationale: दोनों एकवचन संज्ञाओं और पारिवारिक संबंध को सीधे रखा गया है। एक साथ या एक ही समय में जाने का अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: יֵלְכוּ אֶל הַנַּעֲרָה
  choice: एक ही युवती के पास जाते हैं
  rationale: यहाँ ‘पास जाना’ यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है। ‘युवती’ נַעֲרָה की आयु और संभावित असुरक्षा को व्यक्त करती है। ‘एक ही’ से संदर्भगत बात स्पष्ट होती है कि पिता और पुत्र उसी स्त्री के पास जाते हैं, पर उसकी सामाजिक स्थिति निर्धारित नहीं की जाती।
- source_word: לְמַעַן חַלֵּל
  choice: और इस प्रकार ... अपवित्र करते हैं
  rationale: इस रचना से कर्म और परमेश्वर के नाम के अपमान के बीच परिणामात्मक संबंध स्वाभाविक हिन्दी में स्पष्ट होता है। ‘ताकि’ का कठोर उद्देश्य-बोध यहाँ अनचाहा लग सकता है; इस विकल्प में मूल की निंदा का बल बना रहता है।
- source_word: אֶת שֵׁם קָדְשִׁי
  choice: मेरे पवित्र नाम को
  rationale: यह हिन्दी में स्वाभाविक और धर्मवैचारिक रूप से सटीक अभिव्यक्ति है, जो परमेश्वर के नाम की पवित्रता को बनाए रखती है।
theological_decisions:
- issue: एक पुरुष और उसके पिता का उसी युवती के पास जाना
  choice: मुख्य पाठ इसे पिता और पुत्र द्वारा एक ही युवती के साथ यौन संबंध बनाने की ओर संकेत करने वाली शिष्टोक्ति के रूप में रखता है।
  alternative: इसे विशेष रूप से मंदिर-वेश्यावृत्ति, दासी के यौन शोषण अथवा किसी निश्चित प्रकार के कौटुम्बिक व्यभिचार का संकेत माना जा सकता है।
  rationale: इब्रानी पाठ युवती को मंदिर की वेश्या, दासी या गुलाम के रूप में स्पष्टतः नहीं पहचानता। इसलिए मुख्य पाठ यौन अपराध और परमेश्वर के नाम के अपमान को व्यक्त करता है, पर संभावित सामाजिक या पंथीय पृष्ठभूमि को निश्चित नहीं करता।
- issue: לְמַעַן में उद्देश्य और परिणाम का संबंध
  choice: ‘और इस प्रकार’ द्वारा अपवित्रीकरण को उनके कर्म का परिणाम बताया गया है।
  alternative: ‘ताकि’ या ‘इस उद्देश्य से कि’ कहकर इसे उनका सचेत उद्देश्य माना जा सकता है।
  rationale: לְמַעַן उद्देश्य या परिणाम की दिशा व्यक्त कर सकता है। संदर्भ में दोषियों का घोषित लक्ष्य परमेश्वर का नाम अपवित्र करना था, यह निश्चित कर देना आवश्यक नहीं; फिर भी उनके कर्म का धर्मवैचारिक परिणाम स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद्यात्मक समानांतरता के लिए पंक्ति-विभाजन किया गया है। यौन कृत्य के लिए मूल की शिष्टोक्ति को मुख्य पाठ में बनाए रखते हुए पादटिप्पणी में उसका अर्थ स्पष्ट किया गया है।
