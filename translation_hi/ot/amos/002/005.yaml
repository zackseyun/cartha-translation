  yaml_path: translation/ot/amos/002/005.yaml
  text: So I will send fire upon Judah[a], and it will devour the citadels of Jerusalem.
translation:
  language: hi
  text: इसलिए मैं यहूदा पर आग भेजूँगा, और वह यरूशलेम के राजमहलों[a] को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुर्गों” या “गढ़ों।” इब्रानी शब्द दुर्गीकृत राजकीय भवनों का भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: इसलिए मैं ... भेजूँगा
  rationale: שׁלח का हिफ़ील रूप ‘भेजना’ दर्शाता है। आरम्भिक וְ पिछले न्याय-वचन से परिणामात्मक सम्बन्ध रखता है; आधुनिक हिन्दी में ‘इसलिए’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵשׁ
  choice: आग
  rationale: אֵשׁ का सीधा अर्थ ‘आग’ है। न्याय के इस भविष्यसूचक कथन में उसके शाब्दिक या रूपक स्वरूप को और सीमित किए बिना यही शब्द रखा गया है।
- source_word: בִּיהוּדָה
  choice: यहूदा पर
  rationale: यहाँ בְּ को ‘पर’ कहना आग भेजे जाने की प्रतिकूल दिशा को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे अधिक व्याख्यायित किए।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: आग को कर्ता मानकर אכל का भाव ‘खा जाना/निगल जाना’ है। ‘भस्म कर देगी’ हिन्दी में आग द्वारा पूर्ण विनाश का स्वाभाविक और सजीव प्रयोग है।
- source_word: אַרְמְנוֹת
  choice: राजगढ़ों
  rationale: אַרְמוֹן ऐसे भव्य राजकीय भवन को सूचित कर सकता है जो दुर्गीकृत भी हो। ‘राजगढ़’ उसके राजमहली और रक्षात्मक दोनों पहलुओं को संक्षेप में बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions:
- issue: घोषित आग का स्वरूप
  choice: इसे परमेश्वर के न्याय की सीधी भविष्यसूचक छवि के रूप में रखा गया है, पर यह निर्धारित नहीं किया गया कि आग केवल शाब्दिक है, रूपक है, या सैनिक आक्रमण के माध्यम से आती है।
  alternative: इसे केवल वास्तविक अग्निकांड अथवा केवल आक्रमण के रूपक के रूप में स्पष्ट करना।
  rationale: मूल पद आग भेजे जाने और उसके द्वारा यरूशलेम के राजगढ़ों को नष्ट किए जाने की घोषणा करता है, लेकिन विनाश की सटीक कार्यविधि नहीं बताता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज भविष्यसूचक शैली। ‘राजगढ़ों’ अपेक्षाकृत सघन शब्द है, इसलिए उसके अर्थ-क्षेत्र को पादटिप्पणी में स्पष्ट किया गया है।
