source:
  edition: WLC
  text: הַשְׁמִ֨יעוּ֙ עַל אַרְמְנ֣וֹת בְּ/אַשְׁדּ֔וֹד וְ/עַֽל אַרְמְנ֖וֹת בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/אִמְר֗וּ הֵאָֽסְפוּ֙ עַל הָרֵ֣י שֹׁמְר֔וֹן וּ/רְא֞וּ מְהוּמֹ֤ת רַבּוֹת֙ בְּ/תוֹכָ֔/הּ וַ/עֲשׁוּקִ֖ים בְּ/קִרְבָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/009.yaml
  text: Proclaim to the citadels of Ashdod and to the citadels in the land of Egypt[a], and say, “Assemble on the mountains of Samaria, and see the many tumults within her[d][c][b], and the oppressed in her midst.”
translation:
  language: hi
  text: अशदोद के गढ़ों और मिस्र देश के गढ़ों को यह घोषणा करो और कहो, “सामरिया के पहाड़ों[b] पर इकट्ठे हो जाओ और उसके भीतर मची भारी उथल-पुथल[c] और उसके बीच के पीड़ित लोगों[d] को देखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “सामरिया की पहाड़ियों।”
    reason: lexical_alternative
  - marker: c
    text: या “बहुत-से उपद्रव” अथवा “बड़ी अशांति।”
    reason: lexical_alternative
  - marker: d
    text: या “अत्याचार के काम।” इब्रानी रूप का सबसे स्वाभाविक अर्थ अत्याचार से पीड़ित लोग है, पर यहाँ अमूर्त अर्थ भी सम्भव माना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  choice: घोषणा करो
  rationale: हिफ़ील आज्ञार्थक यहाँ सार्वजनिक रूप से सुनाने या घोषित करने का आदेश देता है; ‘घोषणा करो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी आज्ञात्मक शक्ति बनाए रखता है।
- source_word: אַרְמְנוֹת
  choice: गढ़ों
  rationale: यह शब्द भव्य, उच्चवर्गीय और प्रायः किलेबंद निवासों को सूचित कर सकता है। ‘गढ़ों’ से सुरक्षा और सामर्थ्य का पक्ष उभरता है; ‘राजमहलों’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּאַשְׁדּוֹד / בְּאֶרֶץ מִצְרָיִם
  choice: अशदोद के गढ़ों में / मिस्र देश के गढ़ों में
  rationale: स्थानवाचक ב को हिन्दी में ‘में’ से व्यक्त किया गया है, और ‘मिस्र देश’ कहकर मूल की पूर्ण अभिव्यक्ति אֶרֶץ מִצְרָיִם बनाए रखी गई है।
- source_word: הֵאָסְפוּ
  choice: इकट्ठे हो जाओ
  rationale: निफ़ाल आज्ञार्थक पर्यवेक्षकों को एक स्थान पर जमा होने का बुलावा देता है; यह वाक्यांश सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: הָרֵי שֹׁמְרוֹן
  choice: सामरिया के पहाड़ों
  rationale: הַר का सीधा अर्थ ‘पहाड़’ है और बहुवचन ऊँचे अवलोकन-स्थलों की छवि बनाए रखता है; ‘पहाड़ियों’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: מְהוּמוֹת רַבּוֹת
  choice: भारी उथल-पुथल
  rationale: यह पद व्यापक अव्यवस्था, हलचल और सामाजिक कोलाहल को व्यक्त करता है। हिन्दी में ‘भारी उथल-पुथल’ स्वाभाविक है और רַבּוֹת की तीव्रता को संप्रेषित करता है, यद्यपि व्याकरणिक बहुवचन को मुहावरेदार सामूहिक पद में व्यक्त करता है।
- source_word: בְּתוֹכָהּ / בְּקִרְבָּהּ
  choice: उसके भीतर / उसके बीच
  rationale: दोनों पद सामरिया नगर के आन्तरिक भाग को बताते हैं। हिन्दी में हल्का शब्द-भेद रखकर मूल की निकट-समानान्तर अभिव्यक्तियों को स्वाभाविक रूप दिया गया है।
- source_word: עֲשׁוּקִים
  choice: पीड़ित लोगों
  rationale: रूप को निष्क्रिय कृदन्त का संज्ञात्मक बहुवचन मानकर उन लोगों के रूप में अनूदित किया गया है जिन पर अत्याचार हुआ है। ‘लोगों’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, बिना किसी नये समूह को प्रस्तुत किए।
theological_decisions:
- issue: सामरिया में दिखाई देने वाली עֲשׁוּקִים का संदर्भ
  choice: अत्याचार से पीड़ित लोग
  alternative: अत्याचार अथवा अत्याचार के काम
  rationale: मसोरेटिक स्वरांकन के अनुसार यह रूप निष्क्रिय बहुवचन कृदन्त के रूप में पीड़ित व्यक्तियों को स्वाभाविक रूप से सूचित करता है। फिर भी अमूर्त अर्थ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है, ताकि सामाजिक पाप और उसके शिकारों के बीच की व्याख्यात्मक सम्भावना दबाई न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक भविष्यद्वाणी की शैली के अनुरूप रखी गई है। ‘घोषणा करो’, ‘इकट्ठे हो जाओ’ और ‘देखो’ से तीनों आज्ञार्थक क्रियाओं की शक्ति स्पष्ट रहती है। सामरिया के लिए हिन्दी का स्वाभाविक सर्वनाम ‘उसके’ प्रयोग किया गया है; मूल की स्त्रीलिंग नगर-कल्पना को कृत्रिम हिन्दी स्त्रीलिंग से नहीं थोपा गया।
