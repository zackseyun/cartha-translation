base_translation:
  language: en
  yaml_path: translation/ot/amos/003/015.yaml
  text: And I will strike the winter house along with the summer house[a], and the houses of ivory will perish, and many houses will come to an end," declares Yahweh.
translation:
  language: hi
  text: “मैं शीतकालीन निवास और ग्रीष्मकालीन निवास, दोनों पर प्रहार करूँगा; हाथीदाँत के घर[a] नष्ट हो जाएँगे, और बहुत-से घर समाप्त हो जाएँगे,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “हाथीदाँत से सजाए गए घर”—संभवतः ये सचमुच हाथीदाँत से बने घर नहीं, बल्कि हाथीदाँत की जड़ाई से सजाए गए विलासी घर थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכֵּיתִי
  choice: मैं ... प्रहार करूँगा
  rationale: נכה के सामान्य अर्थ ‘मारना/प्रहार करना’ को व्यक्त करता है और न्याय की प्रबलता बनाए रखता है, पर विनाश की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בֵית הַחֹרֶף
  choice: शीतकालीन भवन
  rationale: शीत ऋतु में उपयोग किए जाने वाले निवास का अर्थ देता है और मौसमी भवनों की सामाजिक पृष्ठभूमि सुरक्षित रखता है।
- source_word: עַל
  choice: के साथ ... पर भी
  rationale: यहाँ עַל दोनों मौसमी भवनों को एक ही प्रहार के संयुक्त लक्ष्य के रूप में जोड़ता है; हिन्दी में यह संरचना उस समन्वित न्याय को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בֵּית הַקָּיִץ
  choice: ग्रीष्मकालीन भवन
  rationale: शीतकालीन भवन के समानांतर मौसमी निवास को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְאָבְדוּ
  choice: नष्ट हो जाएँगे
  rationale: אבד के अकर्मक भाव—नष्ट या समाप्त हो जाना—को सहज हिन्दी में व्यक्त करता है।
- source_word: בָּתֵּי הַשֵּׁן
  choice: हाथीदाँत के भवन
  rationale: इब्रानी के सजीव और अपेक्षाकृत शाब्दिक बिंब को बनाए रखता है; सम्भावित आशय कि भवन हाथीदाँत से सजाए गए थे, पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְסָפוּ
  choice: मिट जाएँगे
  rationale: סוף के ‘अंत हो जाना/समाप्त हो जाना’ भाव को संक्षिप्त प्राकृतिक हिन्दी में देता है, बिना आग या युद्ध जैसी किसी विशिष्ट विधि को जोड़ने के।
- source_word: בָּתִּים רַבִּים
  choice: बहुत-से भवन
  rationale: רַבִּים का प्राथमिक परिमाणात्मक अर्थ ‘बहुत-से’ है; ‘विशाल’ या ‘भव्य’ कहना संदर्भगत अनुमान को मूल विशेषण में मिला देता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: भारयुक्त भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है और वाक्य को केवल साधारण ‘कहता है’ तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है; ‘यहोवा’ एक बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: בָּתִּים רַבִּים में רַבִּים का अर्थ
  choice: बहुत-से भवन
  alternative: बड़े/भव्य भवन
  rationale: विशेषण का सीधा अर्थ संख्या की अधिकता है। विलासी भवनों का संदर्भ ‘भव्य’ अर्थ को सम्भव बनाता है, पर पाठ स्वयं उस अर्थ को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘शीतकालीन/ग्रीष्मकालीन भवन’ समानांतर संरचना और सम्पन्न वर्ग के अनेक मौसमी निवासों का संकेत बचाते हैं। शब्दावली सामान्य पाठक के लिए बोधगम्य है, जबकि मूल के बिंब और अर्थगत अनिश्चितता पादटिप्पणी सहित सुरक्षित हैं।
