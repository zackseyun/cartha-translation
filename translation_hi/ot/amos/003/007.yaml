source:
  edition: WLC
  text: כִּ֣י לֹ֧א יַעֲשֶׂ֛ה אֲדֹנָ֥/י יְהוִ֖ה דָּבָ֑ר כִּ֚י אִם גָּלָ֣ה סוֹד֔/וֹ אֶל עֲבָדָ֖י/ו הַ/נְּבִיאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/007.yaml
  text: For the Lord GOD does nothing unless he reveals his secret to his servants the prophets[a].
translation:
  language: hi
  text: क्योंकि प्रभु याहवे कोई काम नहीं करता, जब तक कि वह अपने सेवक नबियों को अपनी गुप्त बात[a] प्रकट न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुप्त विचार” अथवा “गोपनीय योजना।” इब्रानी शब्द गोपनीय मंत्रणा, अंतरंग विचार-विमर्श या किसी गुप्त विषय को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार बताता है; इसलिए कारणसूचक ‘क्योंकि’ प्रसंग के प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא ... כִּי אִם
  choice: कोई काम नहीं करता, जब तक कि ... न करे
  rationale: नकार और अपवाद की इस इब्रानी रचना का यह स्वाभाविक हिन्दी रूप है और यह बताता है कि प्रकट करना परमेश्वर के कार्य से जुड़ी आवश्यक शर्त है।
- source_word: יַעֲשֶׂה ... דָּבָר
  choice: कोई काम नहीं करता
  rationale: शाब्दिक अर्थ ‘कोई बात/वस्तु करना’ है; ‘कोई काम नहीं करता’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: ‘प्रभु’ אֲדֹנָי की उपाधि को और ‘याहवे’ יהוה के व्यक्तिगत वाचा-नाम को अलग-अलग सुरक्षित रखता है।
- source_word: גָּלָה
  choice: प्रकट करे
  rationale: क्रिया का अर्थ ‘खोलना, प्रकट करना, बता देना’ है; सामान्य सिद्धान्त वाले इस वाक्य में ‘प्रकट करे’ उपयुक्त है।
- source_word: סוֹדוֹ
  choice: अपनी गुप्त बात
  rationale: סוֹד गोपनीय सलाह, अंतरंग विचार-विमर्श या गुप्त विषय को सूचित कर सकता है। ‘गुप्त बात’ इस व्यापकता को बनाए रखती है और किसी निश्चित प्रकार की योजना को अनावश्यक रूप से आरोपित नहीं करती।
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: अपने सेवक नबियों को
  rationale: यह पद नबियों को परमेश्वर की सेवा में नियुक्त जनों के रूप में प्रस्तुत करता है; ‘सेवक नबी’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: संयुक्त ईश्वरीय पदवी אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: प्रत्यक्ष नाम ‘याहवे’ रखने से इब्रानी के दोनों घटक—उपाधि और व्यक्तिगत नाम—बने रहते हैं; केवल ‘परमेश्वर’ कहने से नाम और उपाधि का भेद मिट जाता।
- issue: סוֹד का आशय
  choice: गुप्त बात
  alternative: गुप्त विचार / गोपनीय योजना / गुप्त मंत्रणा
  rationale: मूल शब्द में गोपनीय बात, अंतरंग मंत्रणा और योजना की अर्थ-छायाएँ संभव हैं। मुख्य पाठ में व्यापक ‘गुप्त बात’ रखकर किसी विशिष्ट धर्मवैज्ञानिक अर्थ को निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जब तक कि ... न करे’ अपवादसूचक इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘सेवक नबी’ पारंपरिक धार्मिक शब्दावली होते हुए भी आज समझने योग्य है।
