source:
  edition: WLC
  text: כִּ֗י בְּ/י֛וֹם פָּקְדִ֥/י פִשְׁעֵֽי יִשְׂרָאֵ֖ל עָלָ֑י/ו וּ/פָֽקַדְתִּי֙ עַל מִזְבְּח֣וֹת בֵּֽית אֵ֔ל וְ/נִגְדְּעוּ֙ קַרְנ֣וֹת הַ/מִּזְבֵּ֔חַ וְ/נָפְל֖וּ לָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/014.yaml
  text: For on the day when I punish Israel for his transgressions[a], I will also punish the altars of Bethel[b]; the horns of the altar will be cut off and fall to the ground.
translation:
  language: hi
  text: क्योंकि जिस दिन मैं इस्राएल को उसके विद्रोहों के लिए दण्ड दूँगा[a], उस दिन मैं बेतेल की वेदियों को भी दण्ड दूँगा; वेदी के सींग[b] काट डाले जाएँगे और भूमि पर गिर पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब मैं इस्राएल के विद्रोहों का लेखा लूँगा।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ किसी से लेखा लेने अथवा उसे दण्ड देने के भाव में “उसकी सुधि लेना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सींग” वेदी के कोनों पर बने सींग-जैसे उभार थे, जो उसकी पवित्रता और धार्मिक अनुष्ठानों से जुड़े थे।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार या स्पष्टीकरण देता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: בְּיוֹם פָּקְדִי
  choice: जिस दिन मैं ... दण्ड दूँगा
  rationale: कालसूचक इब्रानी मुहावरे को स्वाभाविक हिन्दी में रखा गया है। न्याय के प्रसंग में פקד का अर्थ दण्ड देना या लेखा लेना है, जबकि उसकी व्यापक अर्थ-छाया पाद-टिप्पणी में सुरक्षित है।
- source_word: פִשְׁעֵי
  choice: विद्रोहों
  rationale: פשע केवल सामान्य भूल नहीं, बल्कि उचित अधिकार के विरुद्ध अपराध या विद्रोह का भाव व्यक्त करता है।
- source_word: יִשְׂרָאֵל עָלָיו
  choice: इस्राएल को उसके विद्रोहों के लिए
  rationale: एकवचन सामूहिक संज्ञा ‘इस्राएल’ और एकवचन प्रत्यय के व्यक्तिगत, वाचिक स्वर को ‘उसके’ द्वारा बनाए रखा गया है।
- source_word: וּפָקַדְתִּי עַל
  choice: मैं ... को भी दण्ड दूँगा
  rationale: दोहराया गया פקד इस्राएल के न्याय को बेतेल की उपासना-व्यवस्था के न्याय से जोड़ता है; ‘भी’ संयोजक की योगात्मक शक्ति स्पष्ट करता है।
- source_word: מִזְבְּחוֹת בֵּית אֵל
  choice: बेतेल की वेदियों
  rationale: बहुवचन ‘वेदियों’ और स्थान-नाम बेतेल को सीधे तथा स्पष्ट रूप में रखा गया है।
- source_word: וְנִגְדְּעוּ
  choice: काट डाले जाएँगे
  rationale: क्रिया हिंसक रूप से काटकर अलग कर देने का परिणाम बताती है; हिन्दी का कर्मवाच्य मूल रूप के अनुरूप है।
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींग
  rationale: ये वेदी के कोनों पर बने वास्तविक सींग-जैसे उभार थे; सांस्कृतिक और धार्मिक बिम्ब को शाब्दिक रूप में सुरक्षित रखा गया है।
- source_word: וְנָפְלוּ לָאָרֶץ
  choice: और भूमि पर गिर पड़ेंगे
  rationale: यह सींगों के काटे जाने का भौतिक परिणाम सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस्राएल राष्ट्र के लिए एकवचन सर्वनाम
  choice: इस्राएल को उसके विद्रोहों के लिए
  alternative: इस्राएल को उनके विद्रोहों के लिए
  rationale: इब्रानी में ‘इस्राएल’ एकवचन सामूहिक संज्ञा है और उससे जुड़ा प्रत्यय भी एकवचन है। ‘उसके’ भविष्यद्वाणी में राष्ट्र के व्यक्तिगत और वाचा-संबंधी चित्रण को बनाए रखता है।
- issue: वेदी के धार्मिक बिम्ब को शाब्दिक रखना
  choice: वेदी के सींग
  alternative: वेदी के कोनों के उभार
  rationale: मूल पाठ वास्तविक सींग-जैसी संरचनाओं को नाम देता है। ‘सींग’ रखने से वेदी की पवित्रता और अनुष्ठान से जुड़ा बिम्ब सपाट व्याख्या में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘दण्ड दूँगा’ न्याय का आशय स्पष्ट करता है, जबकि पाद-टिप्पणी פקד की व्यापक अर्थ-छाया बचाती है। ‘वेदियों’ के बहुवचन और इसके बाद ‘वेदी’ के एकवचन को मूल पाठ के अनुसार सुरक्षित रखा गया है।
