source:
  edition: WLC
  text: רַ֚ק אֶתְ/כֶ֣ם יָדַ֔עְתִּי מִ/כֹּ֖ל מִשְׁפְּח֣וֹת הָ/אֲדָמָ֑ה עַל כֵּן֙ אֶפְקֹ֣ד עֲלֵי/כֶ֔ם אֵ֖ת כָּל עֲוֺנֹֽתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/002.yaml
  text: You only have I known from among all the families of the earth[b][a]; therefore I will punish you for all your iniquities.
translation:
  language: hi
  text: पृथ्वी के सब कुलों में से केवल तुम्हीं को मैंने जाना है[a]; इसलिए मैं तुम्हारे सभी अधर्मों के लिए तुम्हें दण्ड दूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल तुम्हीं को मैंने चुना/अपना माना है।” इब्रानी में शब्दशः “जाना” है, जिसमें यहाँ विशेष सम्बन्ध और वाचा की अर्थछाया हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का आशय है, “मैं तुम्हारे सभी अधर्मों का लेखा तुमसे लूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल तुम्हीं को
  rationale: वाक्य के आरम्भ में दी गई विशिष्टता और बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָדַעְתִּי
  choice: मैंने जाना है
  rationale: मूल क्रिया ‘जानना’ है और यहाँ सम्बन्धपरक तथा वाचागत अर्थछाया रखती है। मुख्य पाठ में ‘जाना’ रखने से ‘चुना’ या ‘अपना माना’ जैसे व्याख्यात्मक अर्थ समय से पहले निश्चित नहीं होते।
- source_word: מִכֹּל מִשְׁפְּחוֹת הָאֲדָמָה
  choice: पृथ्वी के सब कुलों में से
  rationale: ‘कुल’ यहाँ मानव-समुदायों अथवा जातीय परिवारों का सामूहिक बोध देता है, और ‘पृथ्वी’ सन्दर्भ के विश्वव्यापी विस्तार को व्यक्त करती है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: विशेष सम्बन्ध और उसके कारण आने वाले न्याय के बीच परिणामसूचक सम्बन्ध स्पष्ट करता है।
- source_word: אֶפְקֹד עֲלֵיכֶם
  choice: तुम्हें दण्ड दूँगा
  rationale: इस न्याय-सन्दर्भ में פקד का आशय अपराधों के लिए दण्ड देना या लेखा लेना है; चुना गया रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֲוֺנֹתֵיכֶם
  choice: तुम्हारे सभी अधर्मों
  rationale: ‘अधर्म’ नैतिक कुटिलता और दोष—दोनों का भार रखता है और सामान्य ‘पाप’ की तुलना में עָוֹן की न्यायिक अर्थछाया को बेहतर बनाए रखता है।
theological_decisions:
- issue: יָדַע का वाचागत और सम्बन्धपरक आशय
  choice: मुख्य पाठ में ‘जाना’ रखा गया है और उसकी विशेष सम्बन्धपरक अर्थछाया पादटिप्पणी में बताई गई है।
  alternative: ‘चुना’ या ‘अपना माना’
  rationale: यह पद इस्राएल के साथ परमेश्वर के अद्वितीय सम्बन्ध की बात करता है, पर मूल क्रिया ‘जानना’ है। इसे बनाए रखने से चुनाव का संकेत बना रहता है, पर किसी संकुचित धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में नहीं थोपा जाता।
- issue: פקד का न्यायिक बल
  choice: ‘दण्ड दूँगा’
  alternative: ‘लेखा लूँगा’ या अधिक शब्दशः ‘तुम पर ... का दण्ड लाऊँगा’
  rationale: इस सन्दर्भ में वाचा का विशेषाधिकार अपराधों के न्याय की ओर ले जाता है। ‘दण्ड दूँगा’ आधुनिक हिन्दी में इसका स्पष्ट भाव देता है, जबकि ‘लेखा लूँगा’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुम्हीं’ मूल की विशिष्टता पर बल देता है; ‘कुल’ जातीय परिवारों के सामूहिक अर्थ को संक्षेप में व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के तुरन्त बाद दिए गए हैं।
