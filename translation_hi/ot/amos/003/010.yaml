source:
  edition: WLC
  text: וְ/לֹֽא יָדְע֥וּ עֲשׂוֹת נְכֹחָ֖ה נְאֻם יְהוָ֑ה הָ/אֽוֹצְרִ֛ים חָמָ֥ס וָ/שֹׁ֖ד בְּ/אַרְמְנֽוֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/010.yaml
  text: They do not know how to do what is right—oracle of Yahweh—those who store up violence and destruction in their citadels[a][b].
translation:
  language: hi
  text: वे सही काम करना नहीं जानते—याहवे की यह वाणी है—जो अपने गढ़ों[b] में हिंसा और लूट[a] जमा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनाश।”
    reason: שֹׁד का अर्थ ‘लूट’ के साथ-साथ ‘विनाश’ या ‘विध्वंस’ भी हो सकता है।
  - marker: b
    text: या, “महलों।”
    reason: אַרְמוֹן किलेबंद निवास, गढ़ या महल का अर्थ दे सकता है।
lexical_decisions:
- source_word: יָדְעוּ
  choice: जानते ही नहीं
  rationale: ידע के साथ עֲשׂוֹת यहाँ सही आचरण की व्यावहारिक नैतिक समझ न होने का बोध देता है। ‘ही’ अभियोग की तीव्रता व्यक्त करता है, पर पूर्ण दार्शनिक असमर्थता नहीं जोड़ता।
- source_word: עֲשׂוֹת נְכֹחָה
  choice: सही काम करना
  rationale: נְכֹחָה का भाव सीधाई, खराई और उचित आचरण है; आधुनिक हिन्दी में ‘सही काम करना’ स्वाभाविक और नैतिक अर्थ में स्पष्ट है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की वाणी है
  rationale: נְאֻם भविष्यद्वाणी का औपचारिक घोष-वाक्य है; ‘वाणी’ उसकी गरिमा रखता है और यְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: הָאֹצְרִים
  choice: जमा करते हैं
  rationale: אצר संचित करने या भंडार भरने को दर्शाता है; कृदंत उनके लगातार या चरित्रगत आचरण को बताता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: חָמָס हिंसक अन्याय और उत्पीड़न का सूचक है; ‘हिंसा’ इसका सीधा और परिचित हिन्दी रूप है।
- source_word: שֹׁד
  choice: लूट का धन
  rationale: שֹׁד का अर्थ विनाश भी हो सकता है और लूट भी। ‘जमा करते हैं’ तथा गढ़ों के संदर्भ में लूटी हुई संपत्ति का मूर्त अर्थ विशेष रूप से संगत है, जबकि विनाश वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּאַרְמְנוֹתֵיהֶם
  choice: अपने गढ़ों में
  rationale: אַרְמוֹן महल, दुर्गयुक्त राजनिवास या गढ़ हो सकता है। ‘गढ़’ संपन्न अभिजात वर्ग की किलेबंद सुरक्षा को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में रखता है।
- issue: ‘सही काम करना नहीं जानते’ में नैतिक अज्ञान अथवा असमर्थता
  choice: वे सही काम करना जानते ही नहीं
  alternative: वे नहीं जानते कि सही क्या है; वे सही काम कर ही नहीं सकते
  rationale: इब्रानी वाक्य भ्रष्ट अभ्यास से उपजी नैतिक अनभिज्ञता पर अभियोग लगाता है। अनुवाद उसकी तीव्रता रखता है, लेकिन उसे मात्र सूचना की कमी या निरपेक्ष दार्शनिक असमर्थता नहीं बनाता।
- issue: שֹׁד का परिणामसूचक अथवा अर्जित लूट का अर्थ
  choice: लूट का धन
  alternative: विनाश
  rationale: दोनों अर्थ कोशगत रूप से संभव हैं। אצר (‘जमा करना’) के साथ लूट की संपत्ति स्वाभाविक है; वैकल्पिक ‘विनाश’ पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु भविष्यद्वाणी के अनुरूप गरिमापूर्ण और तीखी है। प्रत्यक्ष वाणी को उद्धरण-चिह्नों से स्पष्ट किया गया है। ‘गढ़’ सामान्य पाठक के लिए बोधगम्य रहते हुए किलेबंद अभिजात निवास का भाव देता है।
