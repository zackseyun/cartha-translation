  yaml_path: translation/ot/amos/003/008.yaml
  text: A lion has roared—who will not fear? The Lord GOD has spoken—who will not prophesy?[a][b]
translation:
  language: hi
  text: सिंह गरजा है—कौन न डरेगा? प्रभु याहवे[a] ने कहा है—कौन भविष्यवाणी न करेगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “अदोनाय YHWH,” अर्थात “प्रभु याहवे।” YHWH को परंपरागत हिन्दी में “यहोवा” भी लिखा जाता है।'
    reason: संयुक्त दिव्य उपाधि में YHWH के वैकल्पिक हिन्दी लिप्यंतरण को स्पष्ट करना।
  - marker: b
    text: 'या, अधिक मुहावरेदार ढंग से: “कौन भविष्यवाणी किए बिना रह सकता है?”'
    reason: अलंकारिक प्रश्न के बाध्यकारी अर्थ का मुहावरेदार विकल्प देना।
lexical_decisions:
- source_word: אַרְיֵה
  choice: सिंह
  rationale: यह पशु के लिए सामान्य संज्ञा है; हिन्दी में अनिश्चितता अलग उपपद के बिना स्वाभाविक रूप से व्यक्त होती है।
- source_word: שָׁאָג
  choice: गरजा है
  rationale: काल पूर्ण क्रिया को ऐसी वर्तमान-पूर्ण अभिव्यक्ति में रखा गया है जिसमें गर्जना हो चुकी है और उसका प्रभाव—भय—तुरंत अपेक्षित है।
- source_word: מִי לֹא יִירָא
  choice: कौन न डरेगा?
  rationale: नकार सहित प्रश्न अलंकारिक है और सर्वव्यापी, अनिवार्य प्रतिक्रिया की अपेक्षा करता है; अपूर्ण क्रिया का भविष्यात्मक-मोडल बल बना रहता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और चार-अक्षरीय व्यक्तिगत नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है, जिससे दोनों घटक अलग और स्पष्ट रहते हैं।
- source_word: דִּבֶּר
  choice: ने कहा है
  rationale: पूर्ण क्रिया और पहले खंड के साथ समानांतर वर्तमान-पूर्ण प्रभाव सुरक्षित है। इस संदर्भ में ‘कहा है’ सामान्य हिन्दी में दिव्य वाणी के घटित होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִי לֹא יִנָּבֵא
  choice: कौन भविष्यवाणी न करेगा?
  rationale: प्रत्यक्ष अर्थ और पहले अलंकारिक प्रश्न की समानांतर रचना सुरक्षित रखी गई है; वाक्य का आशय बाध्यकारी प्रतिक्रिया है, पर मुख्य पाठ में ‘भला कैसे न’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: मूल में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘प्रभु यहोवा’ हिन्दी पाठकों के लिए पहचाना हुआ रूप है और אֲדֹנָי तथा יהוה को एक ही पद में मिला देने से बचता है; उच्चारण की अनिश्चितता और वैकल्पिक रूप पादटिप्पणी में दिए गए हैं।
- issue: भविष्यवाणी करने की अनिवार्यता का बल
  choice: अलंकारिक प्रश्न को यथावत रखना
  alternative: कौन भविष्यवाणी किए बिना रह सकता है?
  rationale: 'सीधी रचना मूल की समानता और धर्मवैचारिक तनाव दोनों बचाती है: परमेश्वर के बोलने पर नबी का बोलना अपेक्षित और लगभग अनिवार्य है, पर पाठ इसके तंत्र को विस्तार से नहीं समझाता।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। दोनों खंडों की समानांतर लय, पूर्ण क्रियाओं की तात्कालिकता और नकारात्मक अलंकारिक प्रश्न सुरक्षित रखे गए हैं।
