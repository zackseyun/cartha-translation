source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ כַּ/אֲשֶׁר֩ יַצִּ֨יל הָ/רֹעֶ֜ה מִ/פִּ֧י הָ/אֲרִ֛י שְׁתֵּ֥י כְרָעַ֖יִם א֣וֹ בְדַל אֹ֑זֶן כֵּ֣ן יִנָּצְל֞וּ בְּנֵ֣י יִשְׂרָאֵ֗ל הַ/יֹּֽשְׁבִים֙ בְּ/שֹׁ֣מְר֔וֹן בִּ/פְאַ֥ת מִטָּ֖ה וּ/בִ/דְמֶ֥שֶׁק עָֽרֶשׂ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/012.yaml
  text: 'Thus says Yahweh: As the shepherd rescues from the mouth of the lion two legs or a piece of an ear[b][a], so will the sons of Israel who dwell in Samaria be rescued—with the corner of a bed and the cover of a couch.'
translation:
  language: hi
  text: 'याहवेह ऐसा कहते हैं: “जैसे चरवाहा सिंह के मुँह से दो टाँगें या कान का एक टुकड़ा बचा लाता है, वैसे ही सामरिया में रहने वाले इस्राएल के लोग[a] बचाए जाएँगे—पलंग के एक कोने और दमिश्क के दीवान के साथ[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: अंतिम पदबंध कठिन है। इब्रानी का शाब्दिक पाठ है, “पलंग के एक कोने के साथ और दमिश्क के दीवान के साथ।” इसका संकेत विलासपूर्ण साज-सामान की ओर हो सकता है; अन्य संभावित अर्थ हैं, “दमिश्की कपड़े के दीवान के साथ” या “दमिश्क में एक दीवान के साथ।”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवेह
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: इब्रानी की स्पष्ट तुलनात्मक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יַצִּיל / יִנָּצְלוּ
  choice: बचा लाता है / बचाए जाएँगे
  rationale: नצל के सक्रिय और कर्मवाच्य रूपों का संबंध बनाए रखते हुए प्रसंगानुकूल हिन्दी दी गई है; पहले पद में चरवाहा केवल अवशेष निकाल लाता है।
- source_word: הָרֹעֶה
  choice: चरवाहा
  rationale: यहाँ निश्चित पद सामान्य उदाहरण प्रस्तुत करता है; हिन्दी में बिना अतिरिक्त निर्धारक के ‘चरवाहा’ स्वाभाविक है।
- source_word: מִפִּי הָאֲרִי
  choice: सिंह के मुँह से
  rationale: इब्रानी चित्र को निकटता और स्वाभाविकता से व्यक्त करता है।
- source_word: שְׁתֵּי כְרָעַיִם
  choice: दो टाँगें
  rationale: כְרָעַיִם पशु की निचली टाँगों अथवा पिंडलियों को सूचित कर सकता है; ‘टाँगें’ स्पष्ट और सामान्य हिन्दी है।
- source_word: בְדַל אֹזֶן
  choice: कान का एक टुकड़ा
  rationale: בְדַל किसी अलग हुए अंश या टुकड़े को दर्शाता है और नगण्य अवशेष का कठोर चित्र बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ का जातीय-सामुदायिक अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הַיֹּשְׁבִים בְּשֹׁמְרוֹן
  choice: सामरिया में रहने वाले
  rationale: स्थान और कृदन्तीय अर्थ दोनों को सरल, वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: בִּפְאַת מִטָּה
  choice: पलंग के एक कोने के साथ
  rationale: בְּ की अस्पष्ट सहचारी/स्थानवाची शक्ति और פְאַת के ‘कोना/किनारा’ अर्थ को अधिक व्याख्या किए बिना रखा गया है।
- source_word: וּבִדְמֶשֶׁק עָרֶשׂ
  choice: और दमिश्क के दीवान के साथ
  rationale: मसोरेटी व्यंजन-पाठ में דמשק को ‘दमिश्क’ मानने वाला सीधा पाठ मुख्य अनुवाद में रखा गया है; עָרֶשׂ को पहले प्रयुक्त ‘पलंग’ से अलग दिखाने के लिए ‘दीवान’ कहा गया है।
theological_decisions:
- issue: क्या उपमा को व्यापक छुटकारे की आशा के रूप में नरम किया जाए या अत्यल्प अवशेष के व्यंग्यपूर्ण चित्र को बनाए रखा जाए
  choice: केवल नगण्य अवशेष बचने का कठोर चित्र सुरक्षित रखा गया
  alternative: न्याय से सामान्य रूप में बच निकलने की बात कहना
  rationale: सिंह से छुड़ाई गई दो टाँगें या कान का टुकड़ा सफल उद्धार नहीं, बल्कि हानि प्रमाणित करने योग्य तुच्छ अवशेष हैं; इसलिए पद न्याय की तीव्रता को कम नहीं करता।
- issue: अस्पष्ट अंतिम पदबंध का अनुवाद
  choice: मसोरेटी पाठ के ‘दमिश्क’ को मुख्य पाठ में रखा और विकल्प पादटिप्पणी में दिए
  alternative: ‘दमिश्की कपड़े का दीवान’ अथवा ‘दमिश्क में एक दीवान’
  rationale: पदबंध वास्तविक रूप से कठिन है। किसी अनुमानित अर्थ को निश्चित घोषित करने के बजाय मूल पाठ और प्रमुख संभावनाएँ पारदर्शी ढंग से सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्तीय स्वर रखा गया है। वाक्य सहज है, पर सिंह के मुँह से मिले नगण्य अवशेष और अंतिम पदबंध की मूल अस्पष्टता को जानबूझकर नहीं सँवारा गया।
