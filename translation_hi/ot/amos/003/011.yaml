source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּ֤ה אָמַר֙ אֲדֹנָ֣/י יְהוִ֔ה צַ֖ר וּ/סְבִ֣יב הָ/אָ֑רֶץ וְ/הוֹרִ֤ד מִמֵּ/ךְ֙ עֻזֵּ֔/ךְ וְ/נָבֹ֖זּוּ אַרְמְנוֹתָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/011.yaml
  text: 'Therefore[a], thus says the Lord GOD: An adversary shall surround the land, and he shall bring down your strength from you[b], and your citadels shall be plundered.'
translation:
  language: hi
  text: 'इसलिए प्रभु याहवे यों कहता है:


    “एक विरोधी[a] देश को घेर लेगा;


    वह तेरा बल तुझसे छीन लेगा,


    और तेरे गढ़[b] लूट लिए जाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक शत्रु’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरे राजमहल’। इब्रानी शब्द राजमहलों या किलाबंद गढ़ों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יְהוִה को प्रचलित हिन्दी रूप ‘यहोवा’ में रखा गया है; इससे दोनों तत्व स्पष्ट रहते हैं।
- source_word: צַר
  choice: एक विरोधी
  rationale: यहाँ शब्द किसी शत्रुतापूर्ण आक्रमणकारी को सूचित करता है, न कि केवल अमूर्त संकट को। ‘विरोधी’ मूल के एकवचन और उसकी कुछ अनिश्चित पहचान को बनाए रखता है।
- source_word: וּסְבִיב הָאָרֶץ
  choice: देश को घेर लेगा
  rationale: इब्रानी पदबंध संक्षिप्त और क्रियारहित है। प्रसंग में ‘विरोधी’ के साथ यह देश की घेराबंदी का भाव देता है; ‘देश’ क्षेत्रीय न्याय को ‘पृथ्वी’ से अधिक स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְהוֹרִד מִמֵּךְ עֻזֵּךְ
  choice: वह तेरा बल तुझसे छीन लेगा
  rationale: शाब्दिक भाव ‘तेरा बल तुझसे नीचे उतार देगा’ है। ‘बल ... छीन लेगा’ आधुनिक हिन्दी में राष्ट्रीय या सैन्य सामर्थ्य हटाए जाने का अर्थ स्वाभाविक रूप से देता है।
- source_word: וְנָבֹזּוּ
  choice: लूट लिए जाएँगे
  rationale: निफ़अल रूप आक्रमणकारियों द्वारा लूटे जाने का कर्मवाच्य भाव देता है।
- source_word: אַרְמְנוֹתָיִךְ
  choice: तेरे गढ़
  rationale: אַרְמוֹן राजमहल अथवा किलाबंद भवन/दुर्ग हो सकता है। घेराबंदी के प्रसंग में ‘गढ़’ सुरक्षा और प्रतिष्ठित भवन—दोनों के संकेत को यथासंभव बनाए रखता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ मूल में उपस्थित उपाधि और वाचा-संबंधी व्यक्तिगत नाम के भेद को स्पष्ट रखता है; ‘प्रभु परमेश्वर’ नाम को सामान्य पदवी में बदल देता।
- issue: न्याय लाने वाले आक्रमणकारी की पहचान
  choice: अनिश्चित ‘एक विरोधी’
  alternative: किसी विशिष्ट साम्राज्य का नाम जोड़ना
  rationale: पद स्वयं आक्रमणकारी का नाम नहीं बताता। इसलिए ऐतिहासिक पहचान को अनुवाद में जोड़कर मूल की अनिश्चितता को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। स्त्रीलिंग एकवचन संबोधन को हिन्दी में ‘तेरा/तुझसे/तेरे’ से व्यक्त किया गया है, जिसका संदर्भ प्रसंगतः सामरिया से है। काव्यात्मक भविष्यवाणी की संक्षिप्तता बनाए रखते हुए केवल आवश्यक क्रिया ‘घेर लेगा’ स्पष्ट की गई है।
