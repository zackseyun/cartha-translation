reference: Amos 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֞וּ אֶת הַ/דָּבָ֣ר הַ/זֶּ֗ה אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה עֲלֵי/כֶ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל עַ֚ל כָּל הַ/מִּשְׁפָּחָ֔ה אֲשֶׁ֧ר הֶעֱלֵ֛יתִי מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/001.yaml
  text: 'Hear this word that Yahweh has spoken against you[a], sons of Israel, against the whole family that I brought up from the land of Egypt, saying:'
translation:
  language: hi
  text: 'हे इस्राएल के पुत्रों[a], यह वचन सुनो, जो याहवे ने तुम्हारे विरुद्ध—उस समूचे कुल के विरुद्ध, जिसे मैं मिस्र देश से निकालकर ऊपर ले आया था—कहा है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल की संतानों’ अथवा ‘इस्राएल के लोगों’। इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है, जो पारिवारिक और वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
    reason: शाब्दिक रूप तथा स्वाभाविक सामूहिक अर्थ के वैकल्पिक अनुवाद बताने के लिए।
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ भविष्यद्वाणी की गंभीर पुकार और वाचा-संबंधी प्रतिध्वनि दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह वचन
  rationale: דבר के संभावित अर्थों में ‘बात’, ‘संदेश’ और ‘वचन’ शामिल हैं; यहाँ ईश्वरीय भविष्यद्वाणी के लिए ‘वचन’ उपयुक्त और पारदर्शी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: עֲלֵיכֶם / עַל כָּל הַמִּשְׁפָּחָה
  choice: तुम्हारे विरुद्ध—उस पूरे परिवार के विरुद्ध
  rationale: न्याय की इस भविष्यद्वाणी में עַל का प्रतिकूल भाव ‘विरुद्ध’ से व्यक्त होता है। इसकी पुनरावृत्ति मूल पाठ के बल और न्यायिक स्वर को बनाए रखती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रो
  rationale: यह मूल के पारिवारिक और वाचा-संबंधी पदबंध को सीधे बनाए रखता है; सम्बोधन होने के कारण हिन्दी में ‘पुत्रो’ रूप प्रयुक्त हुआ है।
- source_word: כָּל הַמִּשְׁפָּחָה
  choice: पूरा परिवार
  rationale: מִשְׁפָּחָה यहाँ मिस्र से निकाले गए सामूहिक वंश-समुदाय को पारिवारिक इकाई के रूप में प्रस्तुत करता है।
- source_word: הֶעֱלֵיתִי מֵאֶרֶץ מִצְרַיִם
  choice: मैं मिस्र देश से निकालकर ऊपर ले आया था
  rationale: ‘निकालकर’ प्रस्थान का आशय स्पष्ट करता है, जबकि ‘ऊपर ले आया’ עלה के हिफ़ील रूप और निर्गमन से जुड़ी इब्रानी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: 'कहा है:'
  rationale: हिन्दी में मुख्य क्रिया और अंत का द्विबिंदु अगले पद में आने वाले कथन का स्वाभाविक परिचय देते हैं; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक और लिंगयुक्त पदबंध
  choice: इस्राएल के पुत्रो
  alternative: इस्राएल की सन्तानो; इस्राएल के लोगो
  rationale: ‘पुत्रो’ मूल की व्याकरणिक पुरुषवाचकता तथा पारिवारिक-वाचा संबंधी बिंब को बनाए रखता है। अधिक मुहावरेदार सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- issue: עַל का न्यायिक भाव
  choice: विरुद्ध
  alternative: विषय में; सम्बन्ध में
  rationale: आमोस के न्याय-संदेश के संदर्भ में ‘विरुद्ध’ कथन की प्रतिकूल दिशा को दर्शाता है, जबकि कम कठोर विकल्प सम्भव तो हैं, पर यहाँ संदर्भगत बल को घटाते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। सम्बोधन को आरम्भ में रखने से हिन्दी वाक्य स्वाभाविक बनता है। दीर्घ विराम-चिह्न मूल में दोहराए गए ‘विरुद्ध’ और ‘पूरे परिवार’ की व्याख्यात्मक समानाधिकरण संरचना को स्पष्ट करता है।
