base_translation:
  language: en
  yaml_path: translation/ot/amos/003/006.yaml
  text: If a trumpet is blown in a city[a], do not the people tremble? If disaster happens in a city, has not Yahweh done it?
translation:
  language: hi
  text: यदि किसी नगर में नरसिंगा फूँका जाए, तो क्या लोग काँप नहीं उठते? यदि किसी नगर में विपत्ति[a] आए, तो क्या यहोवा ने ऐसा नहीं किया?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनिष्ट।” इब्रानी शब्द का अनुवाद “बुराई” भी हो सकता है, पर यहाँ उसका अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति या दंड है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתָּקַע שׁוֹפָר
  choice: नरसिंगा फूँका जाए
  rationale: שׁוֹפָר चेतावनी देने के लिए फूँके जाने वाले सींग अथवा नरसिंगे को दर्शाता है। ‘नरसिंगा फूँका जाए’ मूल के वाद्य और सार्वजनिक चेतावनी—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּעִיר
  choice: किसी नगर में
  rationale: עִיר का सामान्य अर्थ नगर या बस्ती है। अनिश्चित शर्तवाचक वाक्य में ‘किसी नगर में’ स्वाभाविक है और दोनों पंक्तियों की समानांतरता बनाए रखता है।
- source_word: וְעָם
  choice: लोग
  rationale: यहाँ עָם से आशय नगर के निवासियों से है। ‘लोग’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: יֶחֱרָדוּ
  choice: काँप नहीं उठते
  rationale: חרד भय और आकस्मिक चेतावनी से काँपने या थर्रा उठने का भाव रखता है। यह चयन उसकी शारीरिक और भावात्मक तीव्रता दोनों को सुरक्षित रखता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस प्रसंग में רָעָה नैतिक बुराई नहीं, बल्कि हानि, विपदा या न्यायस्वरूप संकट को दर्शाता है। ‘विपत्ति’ इस अर्थ को स्पष्ट रखते हुए शब्द की गंभीरता बनाए रखता है।
- source_word: תִּהְיֶה
  choice: आए
  rationale: विपत्ति के साथ היה का भाव उसके घटित होने या नगर पर आने का है। ‘आए’ संक्षिप्त, स्वाभाविक और शर्तवाचक रचना के अनुकूल है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: यह इब्रानी व्यक्तिगत ईश्वरीय नाम יהוה को नाम के रूप में प्रस्तुत करता है और हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाता है।
- source_word: עָשָׂה
  choice: उसे नहीं किया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है। यद्यपि यह अभिव्यक्ति हिन्दी में कुछ कठोर है, यह मूल की सीधी और चौंकाने वाली ईश्वरीय सक्रियता को ‘होने दिया’ जैसे नरम अर्थ में नहीं बदलती।
theological_decisions:
- issue: רָעָה और यहोवा की कार्रवाई का संबंध
  choice: רָעָה का अनुवाद ‘विपत्ति’ किया गया
  alternative: ‘बुराई’ या ‘अनिष्ट’
  rationale: नगर में चेतावनी और आमोस के न्याय-संदेश का प्रसंग नैतिक दुष्टता के बजाय विपदा या न्यायसूचक संकट की ओर संकेत करता है। इससे यहोवा द्वारा नैतिक बुराई किए जाने का अर्थ नहीं निकलता, फिर भी न्याय पर उसकी प्रभुता का कथन सुरक्षित रहता है।
- issue: दूसरी पंक्ति में ईश्वरीय सक्रियता
  choice: ‘क्या यहोवा ने उसे नहीं किया?’
  alternative: ‘क्या यहोवा ने उसे घटित नहीं किया?’ या ‘क्या यहोवा ने उसे आने नहीं दिया?’
  rationale: मूल पाठ विपत्ति को सीधे यहोवा के कार्य से जोड़ता है। चुना हुआ रूप इस धार्मिक तनाव को नरम किए बिना עשה की व्यापकता और मूल प्रश्न की तीक्ष्णता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दो समानांतर अलंकारिक प्रश्नों की संरचना सुरक्षित है। ‘नरसिंगा’ प्राचीन चेतावनी-संकेत का ठोस बिंब बनाए रखता है, जबकि ‘किसी नगर में’ सामान्य शर्त को सहज हिन्दी में व्यक्त करता है।
