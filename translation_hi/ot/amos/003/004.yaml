base_translation:
  language: en
  yaml_path: translation/ot/amos/003/004.yaml
  text: Does a lion roar in the forest when it has no prey? Does a young lion raise its voice from its den unless it has caught something?[a][b]
translation:
  language: hi
  text: क्या सिंह वन में दहाड़ता है जब उसके पास शिकार न हो? क्या युवा सिंह अपनी माँद से आवाज़ देता है, अगर उसने कुछ न पकड़ा हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में केवल “अगर उसने पकड़ा न हो”; क्या पकड़ा, यह प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁאַג
  choice: दहाड़ता है
  rationale: यह क्रिया सिंह की ऊँची पुकार को व्यक्त करती है; आधुनिक हिन्दी में ‘दहाड़ना’ इसका स्वाभाविक और सटीक पर्याय है।
- source_word: אַרְיֵה
  choice: सिंह
  rationale: सामान्य पशु-संज्ञा; काव्यात्मक और गरिमापूर्ण हिन्दी में ‘सिंह’ उपयुक्त है।
- source_word: בַּיַּעַר
  choice: वन में
  rationale: יַעַר का अर्थ वन या जंगल है; ‘वन’ संक्षिप्त, सहज और साहित्यिक गरिमा वाला विकल्प है।
- source_word: טֶרֶף
  choice: शिकार
  rationale: संज्ञा पकड़े या फाड़े गए आहार को सूचित करती है; आखेट के प्रसंग में ‘शिकार’ सबसे स्वाभाविक है।
- source_word: אֵין לוֹ
  choice: उसके पास कोई ... न हो
  rationale: यह इब्रानी मुहावरा अभाव व्यक्त करता है; हिन्दी में ‘उसके पास ... न हो’ उसी संबंध को स्वाभाविक ढंग से रखता है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: यह शब्द छोटे शावक के बजाय युवा और बलवान सिंह को सूचित करता है; इसलिए ‘जवान सिंह’ चुना गया है।
- source_word: יִתֵּן קוֹלוֹ
  choice: आवाज़ निकालता है
  rationale: शाब्दिक अर्थ ‘अपनी आवाज़ देता है’ है; ‘आवाज़ निकालता है’ हिन्दी में पशु के स्वर करने का सहज प्रयोग है और अनावश्यक रूप से दूसरी बार ‘दहाड़ना’ नहीं जोड़ता।
- source_word: מִמְּעֹנָתוֹ
  choice: अपनी माँद से
  rationale: यह पशु के निवास-स्थान को दर्शाता है; सिंह के संदर्भ में ‘माँद’ स्वाभाविक हिन्दी है।
- source_word: בִּלְתִּי אִם
  choice: जब तक कि ... न
  rationale: यह अपवादात्मक शर्त प्रस्तुत करता है; प्रश्नवाचक वाक्य में ‘जब तक कि ... न’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: לָכָד
  choice: उसने कुछ पकड़ा
  rationale: क्रिया का अर्थ पकड़ना या अपने अधिकार में करना है। मूल में कर्म व्यक्त नहीं है, इसलिए हिन्दी की पूर्णता हेतु संदर्भानुसार ‘कुछ’ जोड़ा गया है।
