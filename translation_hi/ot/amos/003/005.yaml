translation_notes:
  register: आधुनिक मानक हिन्दी में प्रश्नात्मक, कहावत-जैसी लय रखी गई है। ‘धरती’ और ‘भूमि’ मूल के הָאָרֶץ तथा הָאֲדָמָה के हल्के शब्दगत भेद को दर्शाते हैं। भाषा सामान्य पाठक के लिए स्पष्ट है, पर मूल बिंब और उसकी कारण-परिणाम संरचना सुरक्षित रखी गई है।
