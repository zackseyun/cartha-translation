  text: הֲ/תִפֹּ֤ל צִפּוֹר֙ עַל פַּ֣ח הָ/אָ֔רֶץ וּ/מוֹקֵ֖שׁ אֵ֣ין לָ֑/הּ הֲ/יַֽעֲלֶה פַּח֙ מִן הָ֣/אֲדָמָ֔ה וְ/לָכ֖וֹד לֹ֥א יִלְכּֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/003/005.yaml
  text: Does a bird fall into a trap on the ground when there is no snare for it? Does a trap spring up from the ground when it has caught nothing at all?[a][b]
translation:
  language: hi
  text: क्या कोई पक्षी धरती पर किसी फंदे में गिरता है, जबकि उसके लिए कोई फँसाने वाला साधन न हो?[a] क्या कोई फंदा भूमि से उछलता है और कुछ भी नहीं पकड़ता?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि उसके लिए कोई चारा या फंदे को सक्रिय करने वाला अंग न हो?” इब्रानी शब्द व्यापक रूप में फँसाने वाली वस्तु, और अधिक विशेष रूप में चारे या फंदे के सक्रिय करने वाले अंग को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और पकड़ने को वह नहीं पकड़ता।” इब्रानी में एक ही धातु का यह जोरदार प्रयोग है; आशय है कि फंदा बिना कुछ पकड़े नहीं उछलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִפֹּל
  choice: गिरता है
  rationale: נפל का मूल अर्थ ‘गिरना’ है। फंदे के चित्र में ‘फंदे में गिरना’ स्वाभाविक हिन्दी है और ‘पकड़ा जाना’ जैसा व्याख्यात्मक अनुवाद करने से बचता है।
- source_word: צִפּוֹר
  choice: पक्षी
  rationale: यहाँ किसी विशेष प्रजाति के बजाय सामान्य रूप से पक्षी का उल्लेख है।
- source_word: פַּח
  choice: फंदा
  rationale: यह पक्षियों या पशुओं को पकड़ने वाला उपकरण है। ‘फंदा’ दोनों प्रयोगों में स्पष्ट और स्वाभाविक है।
- source_word: הָאָרֶץ
  choice: धरती पर
  rationale: शिकार के इस ठोस दृश्य में यह स्थानसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מוֹקֵשׁ
  choice: चारा
  rationale: यह शब्द फँसाने वाली वस्तु, प्रलोभन या फंदे को सक्रिय करने वाले अंग का संकेत दे सकता है। प्रसंग में ‘चारा’ पहले प्रश्न के कारण-परिणाम संबंध को स्पष्ट रखता है, जबकि व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֵין לָהּ
  choice: उसके लिए कोई चारा न हो
  rationale: स्त्रीलिंग प्रत्यय पक्षी की ओर संकेत करता है और वाक्य उस वस्तु के अभाव को बताता है जो उसे फंदे में गिराएगी।
- source_word: יַעֲלֶה
  choice: उछलता है
  rationale: עלה का मूल भाव ऊपर उठना है; सक्रिय हुए फंदे की गति के लिए ‘उछलना’ सहज और चित्रात्मक हिन्दी है।
- source_word: הָאֲדָמָה
  choice: भूमि से
  rationale: यह उस जमीन या मिट्टी को दर्शाता है जहाँ से सक्रिय फंदा ऊपर उठता है।
- source_word: וְלָכוֹד לֹא יִלְכּוֹד
  choice: यदि उसने कुछ भी न पकड़ा हो
  rationale: क्रिया के साथ उसी धातु का infinitive absolute जोर देता है कि फंदा बिना कुछ पकड़े नहीं उछलता। ‘कुछ भी न’ उस बल को सहज हिन्दी में व्यक्त करता है।
