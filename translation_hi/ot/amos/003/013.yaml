  footnotes:
  - marker: a
    text: या, “याकूब के घराने में गवाही दो।” इब्रानी पूर्वसर्ग का अर्थ “में” या इस न्यायिक संदर्भ में “के विरुद्ध” हो सकता है।
    reason: lexical_alternative
