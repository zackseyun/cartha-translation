lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ भविष्यद्वाणी की गंभीर पुकार को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: וְהָעִידוּ
  choice: गवाही दो
  rationale: हिफ़ील बहुवचन आज्ञार्थक यहाँ न्यायिक अर्थ में साक्ष्य देने को सूचित करता है। साथ के בְּ और न्याय-संदर्भ के कारण ‘के विरुद्ध’ उपयुक्त है, जबकि पादटिप्पणी मूल पूर्वसर्ग की सम्भव व्यापकता बचाती है।
- source_word: בְּבֵית יַעֲקֹב
  choice: याकूब के घराने के विरुद्ध
  rationale: ‘याकूब का घराना’ इस्राएल के लिए वाचा-संबंधी सामूहिक पदनाम है। आमोस 3 के न्याय-संदर्भ में בְּ को विरोधात्मक अर्थ में लिया गया है।
- source_word: נְאֻם
  choice: की यह घोषणा है
  rationale: यह परमेश्वर के अधिकारपूर्ण वचन का मानक भविष्यद्वाणी-सूत्र है; यह हिन्दी में गंभीर और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त उपाधि में אֲדֹנָי को ‘प्रभु’ और परमेश्वर के निज नाम יהוה को ‘यहोवा’ देकर दोनों तत्व अलग और स्पष्ट रखे गए हैं।
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: צְבָאוֹת की बहुवचन व्यापकता को बनाए रखता है और यह तय नहीं करता कि केवल स्वर्गीय या केवल पृथ्वी की सेनाएँ अभिप्रेत हैं।
theological_decisions:
- issue: संयुक्त ईश्वरीय पदनाम אֲדֹנָי יְהוִה में יהוה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु याहवे; प्रभु परमेश्वर
  rationale: मूल में उपाधि और निज नाम दोनों उपस्थित हैं। ‘प्रभु यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित है और निज नाम को सामान्य पद ‘परमेश्वर’ में विलीन नहीं करता।
- issue: אֱלֹהֵי הַצְּבָאוֹת में सेनाओं का संदर्भ
  choice: सेनाओं के परमेश्वर
  alternative: स्वर्गीय सेनाओं के परमेश्वर; सर्वशक्तिमान परमेश्वर
  rationale: मूल पद earthly अथवा heavenly referent को यहाँ स्पष्ट नहीं करता। ‘सेनाओं’ उस अर्थगत विस्तार और उपाधि की तनावपूर्ण व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी और न्यायालय-सदृश स्वर रखा गया है। ‘घराना,’ ‘गवाही,’ ‘घोषणा’ और ‘सेनाओं के परमेश्वर’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की औपचारिकता बनाए रखते हैं।
