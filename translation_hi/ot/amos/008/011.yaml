base_translation:
  language: en
  yaml_path: translation/ot/amos/008/011.yaml
  text: Behold[a], days are coming, declares the Lord GOD, when I will send a famine on the land—not a famine for bread, nor a thirst for water, but for hearing the words of Yahweh.
translation:
  language: hi
  text: 'देखो, दिन आ रहे हैं—प्रभु याहवे की यह घोषणा है—जब मैं देश में अकाल भेजूँगा: रोटी का अकाल नहीं, न पानी की प्यास, बल्कि याहवे के वचनों को सुनने[क] का अकाल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “याहवे के वचन सुनने के लिए [अकाल]।” हिब्रू infinitive का अधिक सीधा अनुवाद इस प्रकार किया जा सकता है; ‘सुनने का अकाल’ रोटी और पानी के साथ समानांतरता बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह गंभीर भविष्यसूचक घोषणा की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक होते हुए भी उसका आह्वानात्मक बल बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आने वाले हैं
  rationale: यह निकट आती भावी घटना की मानक भविष्यसूचक अभिव्यक्ति है; ‘ऐसे’ आगे वर्णित दिनों से इसे सहज रूप से जोड़ता है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यसूचक ‘घोषणा’ और אֲדֹנָי יְהוִה को सम्मानसूचक उपाधि सहित व्यक्तिगत नाम ‘प्रभु यहोवा’ के रूप में रखा गया है।
- source_word: וְהִשְׁלַחְתִּי רָעָב
  choice: जब मैं … अकाल भेजूँगा
  rationale: आने वाले दिनों को परमेश्वर की प्रथम-पुरुष कार्रवाई से जोड़ता है और רָעָב का सामुदायिक विपत्ति वाला अर्थ ‘अकाल’ सुरक्षित रखता है।
- source_word: בָּאָרֶץ
  choice: इस देश में
  rationale: अमोस के न्याय-संदर्भ में אֶרֶץ से लक्षित भूमि/देश अधिक स्वाभाविक है; ‘इस’ हिन्दी में संदर्भगत निश्चितता व्यक्त करता है, विश्वव्यापी अर्थ आरोपित नहीं करता।
- source_word: לֹא רָעָב לַלֶּחֶם
  choice: रोटी का अकाल नहीं
  rationale: रोटी की मूल छवि और अकाल के साथ उसका निकट समानांतर संबंध दोनों सुरक्षित हैं।
- source_word: וְלֹא צָמָא לַמַּיִם
  choice: और न पानी की प्यास
  rationale: पहले निषेध के समानांतर दूसरा निषेध स्वाभाविक हिन्दी में रखा गया है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह शाब्दिक अभाव का निषेध करके वास्तविक अभाव की ओर तीखा विरोध दिखाता है।
- source_word: לִשְׁמֹעַ
  choice: सुनने का
  rationale: हिब्रू क्रियार्थक संज्ञा का सीधा अर्थ रखता है और ‘रोटी का अकाल’ के साथ रूपकात्मक समानांतरता बनाए रखता है।
- source_word: דִּבְרֵי יְהוָה
  choice: यहोवा के वचनों
  rationale: बहुवचन דִּבְרֵי को ‘वचनों’ से दर्शाया गया है और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा; संयुक्त पद में ‘प्रभु यहोवा’
  alternative: ‘याहवे’ अथवा ‘प्रभु परमेश्वर’
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखते हुए אֲדֹנָי की अलग उपाधि ‘प्रभु’ भी सुरक्षित रखी गई है।
- issue: घोषित अकाल का स्वरूप
  choice: रोटी या पानी की वास्तविक कमी नहीं, बल्कि यहोवा के वचन सुनने का अभाव
  alternative: शारीरिक अकाल के साथ-साथ आत्मिक अभाव
  rationale: पद स्वयं रोटी के अकाल और पानी की प्यास को स्पष्टतः नकारकर सुनने को वास्तविक विषय बताता है; अनुवाद इस विरोध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: ‘सुनने’ में निहित अर्थ
  choice: सुनने का अकाल
  alternative: वचन न मिलने का अकाल अथवा आज्ञा मानने की अनिच्छा
  rationale: שׁמע में प्रसंगानुसार सुनने, ग्रहण करने या आज्ञापालन की छायाएँ हो सकती हैं। केवल ‘सुनने’ का अनुवाद मूल की संभावित अर्थ-व्याप्ति को समय से पहले सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यसूचक गंभीरता के लिए डैश और अर्धविराम प्रयुक्त हैं; अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘घोषणा’, ‘अकाल’ और ‘वचन’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं।
