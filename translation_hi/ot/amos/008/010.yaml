source:
  edition: WLC
  text: וְ/הָפַכְתִּ֨י חַגֵּי/כֶ֜ם לְ/אֵ֗בֶל וְ/כָל שִֽׁירֵי/כֶם֙ לְ/קִינָ֔ה וְ/הַעֲלֵיתִ֤י עַל כָּל מָתְנַ֨יִם֙ שָׂ֔ק וְ/עַל כָּל רֹ֖אשׁ קָרְחָ֑ה וְ/שַׂמְתִּ֨י/הָ֙ כְּ/אֵ֣בֶל יָחִ֔יד וְ/אַחֲרִיתָ֖/הּ כְּ/י֥וֹם מָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/010.yaml
  text: I will turn your feasts into mourning[a], and all your songs into lamentation; I will bring sackcloth on every waist and baldness on every head; I will make it like mourning for an only son[d][c][b], and its end like a bitter day.
translation:
  language: hi
  text: मैं तुम्हारे पर्वों को शोक में[a] और तुम्हारे सब गीतों को विलाप में बदल दूँगा। मैं हर कमर पर टाट और हर सिर पर गंजापन ले आऊँगा। मैं उसे किसी इकलौते के लिए शोक के समान[b] और उसके अंत को कड़वे दिन के समान[c] कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्सवों को मातम में’।
    reason: חַג के लिए ‘पर्व/उत्सव’ और אֵבֶל के लिए ‘शोक/मातम’ दोनों स्वाभाविक विकल्प हैं।
  - marker: b
    text: इब्रानी में ‘इकलौते के शोक के समान’; सामान्यतः इसका अर्थ इकलौते पुत्र के लिए शोक समझा जाता है।
    reason: יָחִיד में ‘पुत्र’ स्पष्ट रूप से नहीं है, यद्यपि इस शोक-चित्र में वह प्रचलित अर्थ है।
  - marker: c
    text: या ‘कड़वाहट के दिन के समान’।
    reason: כְיוֹם מָר विशेषणात्मक ‘कड़वा दिन’ अथवा भाववाचक ‘कड़वाहट का दिन’ के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: बदल दूँगा
  rationale: यह क्रिया एक अवस्था को दूसरी अवस्था में बदलने को दर्शाती है; हिन्दी में ‘बदल दूँगा’ भाव और दैवी कर्तृत्व दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַגֵּיכֶם
  choice: तुम्हारे पर्वों
  rationale: חַג धार्मिक और सामुदायिक उत्सवों का सूचक है; ‘पर्व’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: לְאֵבֶל
  choice: शोक में
  rationale: אֵבֶל विशेषतः मृत्यु-संबंधी शोक और उससे जुड़ी प्रथाओं को व्यक्त करता है।
- source_word: שִׁירֵיכֶם ... לְקִינָה
  choice: तुम्हारे सब गीतों को विलाप में
  rationale: קִינָה औपचारिक, प्रायः मृत्यु-सदृश विलाप है; ‘विलाप’ हिन्दी में उसका गंभीर स्वर बनाए रखता है।
- source_word: וְהַעֲלֵיתִי עַל כָּל מָתְנַיִם שָׂק
  choice: मैं हर कमर पर टाट ... ले आऊँगा
  rationale: हिफ़ील रूप किसी वस्तु को लोगों पर आने देने या चढ़ाने का भाव देता है। ‘टाट’ शोक-वस्त्र के खुरदरे कपड़े का प्रचलित बाइबलीय हिन्दी रूप है और ‘कमर’ מָתְנַיִם का स्वाभाविक आधुनिक अनुवाद है।
- source_word: וְעַל כָּל רֹאשׁ קָרְחָה
  choice: हर सिर पर गंजापन
  rationale: קָרְחָה शोक के चिह्न के रूप में बाल हटाए जाने से उत्पन्न गंजेपन को दर्शाता है; मूल की तीखी छवि को बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: וְשַׂמְתִּיהָ
  choice: मैं उसे ... कर दूँगा
  rationale: स्त्रीलिंग प्रत्यय का निश्चित संदर्भ स्पष्ट नहीं है। हिन्दी का ‘उसे’ उस अस्पष्टता को किसी भूमि, नगर या एक विशेष पर्व तक सीमित किए बिना बनाए रखता है।
- source_word: כְּאֵבֶל יָחִיד
  choice: इकलौते के लिए किए जानेवाले शोक के समान
  rationale: יָחִיד का शाब्दिक अर्थ ‘इकलौता/एकमात्र’ है। मुख्य पाठ में ‘पुत्र’ जोड़ने के बजाय मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: וְאַחֲרִיתָהּ כְּיוֹם מָר
  choice: उसके अंत को कड़वे दिन के समान
  rationale: אַחֲרִית परिणाम अथवा अंतिम दशा को और יוֹם מָר कड़वाहट से चिह्नित दिन को दर्शाता है; यह रूप मूल की तुलना और भावात्मक तीव्रता दोनों रखता है।
theological_decisions:
- issue: וְשַׂמְתִּיהָ और וְאַחֲרִיתָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘उसे’ और ‘उसके’ द्वारा संदर्भ को अनिर्दिष्ट रखा गया
  alternative: ‘भूमि/नगर’ अथवा ‘पर्व’ को स्पष्ट संदर्भ मानना
  rationale: मूल इब्रानी किसी निहित स्त्रीलिंग सामूहिक सत्ता—जैसे भूमि, नगरी या पूरी वर्णित दशा—की ओर संकेत कर सकता है। किसी एक संदर्भ को जोड़ना पाठ से अधिक निश्चितता पैदा करता।
- issue: יָחִיד की पहचान
  choice: मुख्य पाठ में ‘इकलौते’
  alternative: ‘इकलौते पुत्र’ या ‘इकलौती संतान’
  rationale: संदर्भ में इकलौते पुत्र का शोक सामान्यतः अभिप्रेत समझा जाता है, पर יָחִיד स्वयं ‘पुत्र’ नहीं कहता। इसलिए शब्दगत खुलापन मुख्य पाठ में रखा गया और प्रचलित अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यसूचक स्वर रखा गया है। समानांतर वाक्य-विन्यास, शोक के दृश्य चिह्न और मूल की संदर्भगत अस्पष्टता सुरक्षित हैं। ‘टाट’ सामान्य पाठक के लिए परिचित बाइबलीय शब्द है; ‘गंजापन’ मूल की कठोर छवि को सीधे व्यक्त करता है।
