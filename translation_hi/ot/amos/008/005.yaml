id: AMO.8.5
reference: Amos 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֵ/אמֹ֗ר מָתַ֞י יַעֲבֹ֤ר הַ/חֹ֨דֶשׁ֙ וְ/נַשְׁבִּ֣ירָה שֶּׁ֔בֶר וְ/הַ/שַּׁבָּ֖ת וְ/נִפְתְּחָה בָּ֑ר לְ/הַקְטִ֤ין אֵיפָה֙ וּ/לְ/הַגְדִּ֣יל שֶׁ֔קֶל וּ/לְ/עַוֵּ֖ת מֹאזְנֵ֥י מִרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/005.yaml
  text: saying[a], “When will the new moon be over, so that we may sell grain, and the Sabbath, so that we may offer wheat for sale—making the ephah small and the shekel large[b], and distorting deceitful scales?”
translation:
  language: hi
  text: यह कहते हैं[a], “नए चाँद का पर्व कब बीतेगा कि हम अनाज बेचें, और विश्राम-दिन कब बीतेगा कि हम गेहूँ बिक्री के लिए निकालें—एपा को छोटा और शेकेल को बड़ा करते हुए[b], और छल के तराज़ुओं को टेढ़ा करते हुए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महीना”; यहाँ प्रसंग कैलेंडर के महीने के बजाय नए चाँद के पर्व की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “एपा को छोटा और शेकेल को बड़ा करना”—अर्थात् वस्तु कम देना और भुगतान अधिक माँगना।
    reason: cultural_note
lexical_decisions:
- source_word: הַחֹדֶשׁ
  choice: नए चाँद का पर्व
  rationale: व्यापार और पवित्र समय के इस संदर्भ में शब्द कैलेंडर के महीने से अधिक अमावस्या/नवचंद्र के धार्मिक पर्व को सूचित करता है। ‘पर्व’ जोड़ने से आधुनिक हिन्दी में आशय स्पष्ट होता है।
- source_word: וְנַשְׁבִּירָה שֶּׁבֶר
  choice: कि हम अनाज बेचें
  rationale: हिफ़िल क्रिया और संज्ञा का संयुक्त अर्थ अनाज या खाद्य-सामग्री बेचना है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְהַשַּׁבָּת
  choice: विश्राम-दिन
  rationale: यह साप्ताहिक पवित्र दिन है, जिसकी समाप्ति की व्यापारी अधीरता से प्रतीक्षा करते हैं; परिचित हिन्दी बाइबलीय पद रखा गया है।
- source_word: וְנִפְתְּחָה בָּר
  choice: कि हम गेहूँ बिक्री के लिए निकालें
  rationale: शाब्दिक ‘खोलें’ यहाँ भंडार या बोरे खोलकर माल बिक्री के लिए प्रस्तुत करने का मुहावरा है; בָּר को इस बाज़ार-संदर्भ में ठोस रूप से ‘गेहूँ’ कहा गया है।
- source_word: לְהַקְטִין אֵיפָה
  choice: एपा को छोटा करते हुए
  rationale: 'प्राचीन सूखी वस्तुओं की माप ‘एपा’ को बनाए रखने से ठगी का ठोस चित्र सुरक्षित रहता है: खरीदार को घोषित मात्रा से कम देना।'
- source_word: וּלְהַגְדִּיל שֶׁקֶל
  choice: शेकेल को बड़ा करते हुए
  rationale: शेकेल यहाँ भार/भुगतान का मानक है। ‘बड़ा’ मूल समानांतरता को बचाता है और अधिक कीमत वसूलने की धूर्तता दर्शाता है।
- source_word: וּלְעַוֵּת מֹאזְנֵי מִרְמָה
  choice: छल के तराज़ुओं को टेढ़ा करते हुए
  rationale: עוה के मोड़ने या विकृत करने के भौतिक बिंब को ‘टेढ़ा करना’ स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘छल के तराज़ू’ उनके कपटपूर्ण चरित्र को व्यक्त करता है।
theological_decisions:
- issue: आर्थिक लोभ की निंदा में पवित्र समयों का अनुवाद
  choice: חֹדֶשׁ को ‘नए चाँद का पर्व’ और שַׁבָּת को ‘विश्राम-दिन’ के रूप में धार्मिक अवसर मानकर प्रस्तुत किया गया है।
  alternative: חֹדֶשׁ को केवल ‘महीना’ कहना।
  rationale: व्यापारी लाभ कमाने में बाधा मानकर इन पवित्र अवसरों की समाप्ति चाहते हैं। धार्मिक अर्थ बनाए रखना नबी की आलोचना के तनाव को सुरक्षित रखता है, बिना कोई अतिरिक्त सांप्रदायिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘एपा’ और ‘शेकेल’ जैसे प्राचीन ठोस माप-शब्द मूल बिंब और समानांतरता के लिए रखे गए हैं तथा पादटिप्पणी में उनका व्यावहारिक आशय स्पष्ट किया गया है।
