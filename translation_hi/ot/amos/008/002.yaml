review_pass:
  verdict: revise
  source_fidelity: The announcement must state that the end has come upon Israel, not that Israel itself has ended. The final idiom conveys that Yahweh will no longer spare Israel; the draft's ‘उनके पास से नहीं गुजरूँगा’ sounds like literal physical movement and does not communicate the judicial sense adequately in Hindi.
  naturalness: Most of the draft is clear and modern. ‘मेरी प्रजा इस्राएल का अंत आ पहुँचा है’ is structurally ambiguous and readily means ‘my people Israel have come to an end.’ A direct postposition, ‘पर,’ is both natural and faithful. ‘उसे फिर कभी नहीं बख्शूँगा’ is the clearest idiomatic Hindi expression of the final clause in this judgment context.
  terminology: ‘याहवे,’ ‘आमोस,’ and ‘इस्राएल’ are consistent transliterations. ‘प्रजा’ suitably renders ‘my people.’ The wordplay note is useful; its transliterations should retain the relevant contrast between क़ायित्स and क़ेत्स.
  issues:
  - severity: high
    issue: ‘मेरी प्रजा इस्राएल का अंत आ पहुँचा है’ omits the force of אֶל (‘upon’) and can mean that Israel has itself come to an end.
    rationale: The Hebrew says that ‘the end’ has arrived upon/against Yahweh’s people Israel. ‘मेरी प्रजा इस्राएल पर अंत आ पहुँचा है’ preserves this relation and the judgment announcement.
  - severity: medium
    issue: ‘मैं फिर कभी उनके पास से नहीं गुजरूँगा’ is overly literal and unnatural as a rendering of the judgment idiom.
    rationale: In context, לֹא־אוֹסִיף עוֹד עֲבוֹר לוֹ means Yahweh will no longer pass over or spare Israel. Hindi ‘नहीं बख्शूँगा’ clearly conveys this, while a footnote can preserve the more literal alternative.
  revised_text: उसने कहा, “आमोस, तुम्हें क्या दिखाई दे रहा है?” मैंने कहा, “गर्मियों के फलों की एक टोकरी[a]।” तब याहवे ने मुझसे कहा, “मेरी प्रजा इस्राएल पर अंत आ पहुँचा है; मैं उसे फिर कभी नहीं बख्शूँगा[b]।”
