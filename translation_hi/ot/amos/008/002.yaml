id: AMO.8.2
reference: Amos 8:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר כְּל֣וּב קָ֑יִץ וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בָּ֤א הַ/קֵּץ֙ אֶל עַמִּ֣/י יִשְׂרָאֵ֔ל לֹא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/002.yaml
  text: And he said[a], “What do you see, Amos?” And I said, “A basket of summer fruit.” Then Yahweh said to me, “The end has come upon my people Israel[b]; I will not again pass by them.”
translation:
  language: hi
  text: उसने कहा, “आमोस, तुम्हें क्या दिखाई दे रहा है?” मैंने कहा, “गर्मियों के फलों की एक टोकरी[a]।” तब याहवे ने मुझसे कहा, “मेरी प्रजा इस्राएल पर अंत आ पहुँचा है; मैं उसे फिर कभी नहीं बख्शूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “गर्मियों के फल” (क़ायित्स) और “अंत” (क़ेत्स) की ध्वनियाँ मिलती-जुलती हैं। यह शब्द-क्रीड़ा दर्शन को आने वाले न्याय की घोषणा से जोड़ती है।
    reason: cultural_note
  - marker: b
    text: या, “मैं फिर कभी उसके पास से नहीं गुजरूँगा” अथवा “मैं फिर कभी उसे छोड़कर आगे नहीं बढ़ूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक रूप को सहज हिन्दी में रखा गया है; कर्ता पिछले दर्शन-संदर्भ से समझा जाता है।
- source_word: מָה אַתָּה רֹאֶה
  choice: तुम्हें क्या दिखाई दे रहा है?
  rationale: कृदन्त רֹאֶה की तात्कालिक, जारी दृष्टि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּלוּב קָיִץ
  choice: गर्मियों के फलों की एक टोकरी
  rationale: כְּלוּב को ‘टोकरी’ और קָיִץ को विशेष रूप से गर्मियों में पकने वाले फलों के रूप में प्रस्तुत करता है; अगले वाक्य के ध्वनि-साम्य को पादटिप्पणी में समझाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: उपाधि से बदलने के बजाय इब्रानी चतुरक्षरीय परमेश्वर-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: בָּא הַקֵּץ
  choice: अंत आ पहुँचा है
  rationale: पूर्ण क्रिया בָּא की भविष्यसूचक निश्चितता और ‘अंत’ के पहुँच चुकने का भाव सुरक्षित रहता है।
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल का अंत
  rationale: शाब्दिक दिशा-सूचक संरचना को हिन्दी में स्वाभाविक संबंध-वाक्यांश बनाया गया है, जबकि न्याय के आगमन का आशय ‘आ पहुँचा’ में बना रहता है।
- source_word: לֹא אוֹסִיף עוֹד
  choice: मैं फिर कभी नहीं
  rationale: दोहराई जाने वाली क्रिया के अब आगे न होने का दृढ़ निषेध सहज हिन्दी में व्यक्त होता है।
- source_word: עֲבוֹר לוֹ
  choice: उनके पास से गुजरूँगा
  rationale: עבר के मूल ‘गुजरना/पास से निकलना’ रूपक को मुख्य पाठ में रखा गया है; ‘बख्शना’ या ‘अनदेखा करना’ जैसे संभावित अर्थ पादटिप्पणी में दिए गए हैं। सामूहिक एकवचन ‘प्रजा’ के सदस्यों के लिए हिन्दी में ‘उनके’ स्वाभाविक है।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे किसी उपाधि से बदले बिना प्रस्तुत करता है।
- issue: עֲבוֹר לוֹ में न्याय और सहनशीलता का निहितार्थ
  choice: मैं फिर कभी उनके पास से नहीं गुजरूँगा
  alternative: मैं फिर कभी उन्हें नहीं बख्शूँगा / मैं फिर कभी उन्हें अनदेखा करके आगे नहीं बढ़ूँगा
  rationale: मुख्य पाठ इब्रानी रूपक को बनाए रखता है और उसके न्याय-संबंधी निहितार्थ को एक ही व्याख्या में सीमित नहीं करता; स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य रखी गई है। दर्शन की तात्कालिकता के लिए ‘दिखाई दे रहा है’ और भविष्यसूचक घोषणा की पूर्णता के लिए ‘आ पहुँचा है’ चुना गया है। इब्रानी शब्द-क्रीड़ा हिन्दी में ध्वन्यात्मक रूप से पुनरुत्पादित नहीं की जा सकती, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है।
