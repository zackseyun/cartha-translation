base_translation:
  language: en
  yaml_path: translation/ot/amos/008/009.yaml
  text: And it shall happen in that day[a], declares the Lord GOD, that I will make the sun go down at noon, and I will darken the earth in broad daylight.
translation:
  language: hi
  text: “उस दिन ऐसा होगा—प्रभु यहोवा की यह घोषणा है—कि मैं दोपहर के समय सूर्य को अस्त कर दूँगा और दिन के उजाले में धरती[a] पर अँधेरा कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश”; इब्रानी शब्द אֶרֶץ पूरी धरती या किसी विशेष देश, दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य में होने वाली भविष्यवाणी का परिचय देता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रहते हुए कथन की गंभीरता बनाए रखती है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वक्ता के अधिकारपूर्ण ईश्वरीय कथन के रूप में ‘घोषणा’ कहा गया है; संयुक्त उपाधि में אֲדֹנָי और व्यक्तिगत नाम יהוה, दोनों का भेद सुरक्षित रखा गया है।
- source_word: וְהֵבֵאתִי הַשֶּׁמֶשׁ
  choice: मैं ... सूर्य को अस्त कर दूँगा
  rationale: בוא के हिफ़ील रूप से सूर्य के अस्त होने को घटित कराने का भाव आता है; यह हिन्दी में स्पष्ट रूप से परमेश्वर की सक्रिय भूमिका व्यक्त करता है।
- source_word: בַּצָּהֳרָיִם
  choice: दोपहर के समय
  rationale: शब्द का अर्थ मध्याह्न या दोपहर है; चुना हुआ रूप सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְהַחֲשַׁכְתִּי לָאָרֶץ
  choice: धरती पर अँधेरा कर दूँगा
  rationale: חשׁך के हिफ़ील रूप का कारणवाचक भाव ‘अँधेरा कर दूँगा’ से व्यक्त होता है। לָאָרֶץ को स्वाभाविक हिन्दी वाक्य-विन्यास में ‘धरती पर’ कहा गया है।
- source_word: בְּיוֹם אוֹר
  choice: दिन के उजाले में
  rationale: शाब्दिक भाव ‘उजाले के दिन में’ है; चुना हुआ रूप पूरे दिन के प्रकाश के बीच आने वाले असामान्य अँधेरे को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: संयुक्त ईश्वरीय संबोधन אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: ‘प्रभु यहोवा’ मूल के दो अलग घटकों—उपाधि אֲדֹנָי और व्यक्तिगत नाम יהוה—को बनाए रखता है और उन्हें एक ही सामान्य उपाधि में नहीं मिलाता।
- issue: אָרֶץ का विस्तार
  choice: धरती
  alternative: देश
  rationale: दोपहर में सूर्यास्त और दिन के उजाले में अँधेरे की व्यापक, ब्रह्मांडीय छवि यहाँ ‘धरती’ का समर्थन करती है; फिर भी ‘देश’ का स्थानीय अर्थ भाषिक रूप से संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष ईश्वरीय वचन को उद्धरण-चिह्नों से स्पष्ट किया गया है, और मूल पाठ की भविष्यसूचक गंभीरता तथा दिन के उजाले में अँधेरे की तीखी विरोधाभासी छवि सुरक्षित रखी गई है।
