translation:
  language: hi
  text: 'प्रभु यहोवा ने मुझे यह दिखाया: देखो, गर्मियों के फलों की एक टोकरी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पके फलों की एक टोकरी।” इब्रानी में शाब्दिक रूप से “गर्मियों के फल” है; यह अगले पद में “अंत” के लिए आए इब्रानी शब्द के साथ ध्वनि-साम्य वाला शब्द-खेल बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה
  choice: यह
  rationale: दर्शन का परिचय देने वाले संकेतवाचक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִרְאַנִי
  choice: ने मुझे ... दिखाया
  rationale: ראה के हिफ़ील रूप का अर्थ ‘दिखाना’ है; भविष्यद्वक्ताओं के दर्शन-वृत्तांत में यह स्पष्ट और स्वाभाविक है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: दर्शन में अचानक सामने आई वस्तु की ओर ध्यान खींचने वाला जीवंत संकेत सुरक्षित रहता है।
- source_word: כְּלוּב
  choice: टोकरी
  rationale: קָיִץ से भरे पात्र के प्रसंग में ‘टोकरी’ उपयुक्त अर्थ है, न कि शब्द का अन्य संभावित अर्थ ‘पिंजरा’।
- source_word: קָיִץ
  choice: ग्रीष्मकालीन फल
  rationale: गर्मी में पकने या इकट्ठे किए जाने वाले फल का बोध देता है और अगले पद के קֵץ, ‘अन्त’, के साथ मूल ध्वनि-साम्य को यथासंभव पहचानने योग्य रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में ईश्वरीय नाम का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में יהוה स्पष्ट रूप से है; ‘यहोवा’ वाचा-नाम को अलग पहचान देता है, जबकि ‘प्रभु’ אֲדֹנָי को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ भविष्यद्वक्ताओं के दर्शन की जीवंतता बनाए रखता है; मुख्य पाठ में अपेक्षाकृत शाब्दिक ‘ग्रीष्मकालीन फल’ शब्दक्रीड़ा के कारण सुरक्षित है।
