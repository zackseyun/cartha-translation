  text: In that day the beautiful virgins and the young men will faint from thirst[a].
translation:
  language: hi
  text: उस दिन सुन्दर कुँवारियाँ और युवक प्यास के मारे मूर्छित हो जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्यास से बेसुध हो जाएँगे।”
