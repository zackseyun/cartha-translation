lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त काल-सूचक पद है; ‘उस दिन’ इब्रानी के संकेतात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תִּתְעַלַּפְנָה
  choice: मूर्छित हो जाएँगे
  rationale: עלף के हित्पएल रूप का अर्थ कमजोरी के कारण बेसुध या मूर्छित हो जाना है। संयुक्त कर्ता में स्त्री और पुरुष दोनों होने के कारण हिन्दी में पुल्लिंग बहुवचन क्रिया स्वाभाविक है।
- source_word: הַבְּתוּלֹת
  choice: कुँवारियाँ
  rationale: यह शब्द केवल युवतियों की आयु नहीं, उनके अविवाहित अथवा अक्षत-कौमार्य होने का अधिक विशिष्ट भाव रखता है; ‘कुँवारियाँ’ इसे सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַיָּפוֹת
  choice: सुन्दर
  rationale: यह विशेषण कुँवारियों का वर्णन करता है; ‘सुन्दर’ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: וְהַבַּחוּרִים
  choice: और जवान
  rationale: בָּחוּר जीवन की शक्ति और यौवन में स्थित पुरुषों को दर्शाता है; ‘जवान’ यहाँ संक्षिप्त और स्वाभाविक है।
- source_word: בַּצָּמָא
  choice: प्यास के मारे
  rationale: यहाँ בְּ कारण अथवा वह दशा व्यक्त करता है जिससे मूर्छा आती है; ‘प्यास के मारे’ इस कारणात्मक संबंध को सहज हिन्दी में स्पष्ट करता है।
