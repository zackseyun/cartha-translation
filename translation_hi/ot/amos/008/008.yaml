source:
  edition: WLC
  text: הַ֤/עַל זֹאת֙ לֹֽא תִרְגַּ֣ז הָ/אָ֔רֶץ וְ/אָבַ֖ל כָּל יוֹשֵׁ֣ב בָּ֑/הּ וְ/עָלְתָ֤ה כָ/אֹר֙ כֻּלָּ֔/הּ וְ/נִגְרְשָׁ֥ה ו/נשקה כִּ/יא֥וֹר מִצְרָֽיִם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/008.yaml
  text: Because of this[a], will not the land tremble, and every one who dwells in it mourn? All of it will rise like the Nile[b]; it will be driven along and sink like the Nile of Egypt.
translation:
  language: hi
  text: क्या इस कारण देश[a] नहीं काँपेगा, और उसमें रहने वाला हर व्यक्ति शोक नहीं करेगा? पूरा देश नील नदी के समान उठेगा[b]; वह उछाला जाएगा और मिस्र की नील नदी के समान धँस जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देश’ के स्थान पर ‘पृथ्वी’ भी संभव है। इब्रानी शब्द אֶרֶץ के दोनों अर्थ हो सकते हैं; यहाँ न्यायाधीन क्षेत्र और उसमें रहने वालों के उल्लेख के कारण ‘देश’ चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में तुलना ‘नील नदी के समान … मिस्र की नील नदी के समान’ है। यह नील नदी के प्रतिवर्ष चढ़ने और फिर उतरने की छवि है, जो यहाँ व्यापक उथल-पुथल को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: הַעַל זֹאת
  choice: क्या इस कारण
  rationale: प्रश्नवाचक הַ और कारणसूचक עַל זֹאת दोनों को स्पष्ट रखते हुए आने वाले न्याय का आधार व्यक्त करता है।
- source_word: תִרְגַּז
  choice: नहीं काँपेगा
  rationale: רגז भूमि के काँपने और न्याय से उत्पन्न विक्षोभ या भय—दोनों का संकेत दे सकता है; यहाँ ‘काँपेगा’ इस दोहरे प्रभाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। यहाँ उसके निवासियों और न्यायाधीन क्षेत्र पर ध्यान होने के कारण ‘देश’ मुख्य पाठ में उपयुक्त है, जबकि दूसरा अर्थ टिप्पणी में रखा गया है।
- source_word: וְאָבַל
  choice: शोक नहीं करेगा
  rationale: אבל शोक मनाने या विलाप करने को दर्शाता है। नकारयुक्त आलंकारिक प्रश्न में ‘नहीं करेगा’ इब्रानी वाक्य-संरचना के प्रभाव को बनाए रखता है।
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: उसमें रहने वाला हर व्यक्ति
  rationale: यह יוֹשֵׁב के कृदंत भाव और כָּל के प्रत्येक व्यक्ति पर लागू होने वाले बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעָלְתָה כָאֹר כֻּלָּהּ
  choice: वह सारा का सारा नील नदी के समान उठेगा
  rationale: כֻּלָּהּ पूरे देश की ओर लौटता है और אֹר यहाँ मिस्र के स्पष्ट उल्लेख के कारण नील नदी को सूचित करता है। ‘उठेगा’ नदी की बाढ़ और देश की व्यापक उथल-पुथल, दोनों की छवि बनाए रखता है।
- source_word: וְנִגְרְשָׁה
  choice: वह उछाला जाएगा
  rationale: גרשׁ के निफ़अल रूप का निष्क्रिय बल रखते हुए बाढ़ में हिलाए या धकेले जाने की छवि व्यक्त की गई है; ‘बहा दिया जाएगा’ संभव है, पर वह स्थान से पूरी तरह हटा दिए जाने का अनावश्यक अर्थ दे सकता है।
- source_word: וְנשקה
  choice: फिर नीचे बैठ जाएगा
  rationale: नील नदी की उठती और घटती बाढ़ के संदर्भ में यह नीचे जाने या बैठने का भाव देता है। ‘फिर’ क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
- source_word: כִּיאוֹר מִצְרָיִם
  choice: मिस्र की नील नदी के समान
  rationale: यह इब्रानी उपमा को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है तथा मिस्र की नील नदी की बाढ़ की छवि को पहचानने योग्य बनाता है।
