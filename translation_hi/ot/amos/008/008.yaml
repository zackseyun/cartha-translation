  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। आलंकारिक प्रश्न को प्रश्न के रूप में बनाए रखा गया है। नील नदी की उपमा स्पष्ट की गई है, पर उसके काव्यात्मक तनाव को व्याख्यात्मक गद्य में नहीं बदला गया।
