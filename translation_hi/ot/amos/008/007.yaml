id: AMO.8.7
reference: Amos 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נִשְׁבַּ֥ע יְהוָ֖ה בִּ/גְא֣וֹן יַעֲקֹ֑ב אִם אֶשְׁכַּ֥ח לָ/נֶ֖צַח כָּל מַעֲשֵׂי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/007.yaml
  text: 'Yahweh has sworn by the pride of Jacob: Surely I will never forget any of their deeds[a][b].'
translation:
  language: hi
  text: याहवे ने याकूब के घमंड की शपथ खाई है:[a] “निश्चय ही मैं उनके किसी भी काम को कभी नहीं भूलूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब के गौरव की” अथवा “याकूब की महिमा की।” इब्रानी पदबंध उस बात की ओर विडंबनापूर्वक संकेत कर सकता है जिस पर याकूब घमंड करता है, या संभवतः परमेश्वर की ओर, जो याकूब की सच्ची महिमा हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यदि मैं उनके किसी भी काम को सदा भूलूँ।” यह शपथ का एक सूत्र है, जिसका अर्थ है, “निश्चय ही मैं उनके किसी भी काम को कभी नहीं भूलूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: शपथ खाई है
  rationale: निफ़अल रूप यहाँ शपथ लेने का सामान्य इब्रानी मुहावरा है। हिन्दी का पूर्ण वर्तमान रूप घोषणा की सम्पन्न और वर्तमानतः प्रभावी गंभीरता व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בִּגְאוֹן
  choice: के घमंड की
  rationale: גָּאוֹן का अर्थ घमंड, गौरव, उत्कर्ष या महिमा हो सकता है। ‘घमंड’ सीधा अर्थ देते हुए वाक्य की विडंबना और संभावित द्विअर्थकता बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल में आए वाचाई राष्ट्रीय नाम को ‘इस्राएल’ से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
- source_word: אִם אֶשְׁכַּח לָנֶצַח
  choice: निश्चय ही मैं ... कभी नहीं भूलूँगा
  rationale: शपथ के बाद אִם एक अपूर्ण आत्म-अभिशापसूचक सूत्र आरम्भ करता है—शाब्दिक रूप से ‘यदि मैं सदा भूलूँ’। स्वाभाविक हिन्दी में इसका आशय दृढ़ निषेध से व्यक्त किया गया है और शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- source_word: כָּל מַעֲשֵׂיהֶם
  choice: उनके किसी भी काम को
  rationale: निषेधात्मक हिन्दी वाक्य में כָּל का वितरणात्मक भाव ‘किसी भी’ से स्वाभाविक रूप में आता है। מַעֲשֶׂה के लिए ‘काम’ सरल, व्यापक और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘याकूब के घमंड’ का आशय
  choice: मुख्य पाठ में अस्पष्ट पदबंध को यथासंभव बनाए रखना
  alternative: ‘याकूब की महिमा’ को परमेश्वर की उपाधि मानना, अथवा इसे इस्राएल के गौरव/वैभव के रूप में समझना
  rationale: इब्रानी पदबंध संभवतः इस्राएल के घमंड पर विडंबनापूर्ण संकेत है, पर वह याकूब की सच्ची महिमा के रूप में परमेश्वर की ओर भी संकेत कर सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: अपूर्ण शपथ-वाक्य का अर्थ
  choice: दृढ़ प्रतिज्ञा के रूप में ‘निश्चय ही ... कभी नहीं’
  alternative: शाब्दिक ‘यदि मैं उनके कामों को सदा भूलूँ’
  rationale: इब्रानी शपथ-सूत्र में परिणाम अथवा आत्म-अभिशाप अनकहा रहता है। केवल शाब्दिक अनुवाद आधुनिक हिन्दी में अधूरा और भ्रामक होगा; इसलिए अर्थ मुख्य पाठ में और संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, भविष्यद्वाणी-संगत और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘याहवे’, ‘याकूब’ और शपथ की औपचारिकता मूल की गरिमा बनाए रखते हैं; वास्तविक अर्थगत अस्पष्टताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
