- source_word: שִׁמְעוּ זֹאת
  choice: यह सुनो
  rationale: बहुवचन आज्ञार्थक और संकेतवाचक कर्म को सीधे, भविष्यवाणी-संबंधी आह्वान के रूप में रखता है।
- source_word: הַשֹּׁאֲפִים
  choice: तुम जो ... रौंदते हो
  rationale: सहभागी रूप निरंतर या चरित्रगत दमन को दिखाता है। मूल क्रिया में हाँफते हुए पीछे पड़ने, निगल जाने या कुचलने जैसी तीखी और कुछ विवादित छवि है; संदर्भ में ‘रौंदते हो’ आर्थिक शोषण की हिंसा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंदों
  rationale: यह आर्थिक अभाव और सहायता की आवश्यकता पर बल देता है तथा अगले पदबंध के ‘गरीबों’ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: וְלַשְׁבִּית
  choice: और ... का अंत कर देते हो
  rationale: שבת के हिफ़ील रूप का मूल भाव किसी को समाप्त या लुप्त कर देना है। यह अनुवाद कारणवाचक अर्थ को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: ענוי אָרֶץ
  choice: देश के गरीबों
  rationale: सामाजिक शोषण के संदर्भ में ענוי का अर्थ ‘गरीबों’ है; אָרֶץ यहाँ व्यापक पृथ्वी के बजाय स्थानीय देश/भूमि को सूचित करता है।
