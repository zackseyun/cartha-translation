source:
  edition: WLC
  text: וְ/נָעוּ֙ מִ/יָּ֣ם עַד יָ֔ם וּ/מִ/צָּפ֖וֹן וְ/עַד מִזְרָ֑ח יְשֽׁוֹטְט֛וּ לְ/בַקֵּ֥שׁ אֶת דְּבַר יְהוָ֖ה וְ/לֹ֥א יִמְצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/012.yaml
  text: They will wander from sea to sea[a], and from north to east; they will roam about seeking the word of Yahweh[b], but they will not find it.
translation:
  language: hi
  text: वे समुद्र से समुद्र तक और उत्तर से पूर्व तक भटकेंगे[a]। वे याहवे का वचन[b] ढूँढ़ने के लिए इधर-उधर फिरेंगे, पर उसे पाएँगे नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ ‘डगमगाएँगे’ या ‘लड़खड़ाएँगे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात याहवे की ओर से मिलने वाला दिव्य संदेश या प्रकाशन।
    reason: lexical_clarification
lexical_decisions:
- source_word: וְנָעוּ
  choice: भटकेंगे
  rationale: נוּעַ में भटकने के साथ डगमगाने या लड़खड़ाने का भाव भी हो सकता है। यहाँ दूर-दूर तक व्याकुल खोज का प्रसंग होने के कारण ‘भटकेंगे’ स्वाभाविक है, जबकि वैकल्पिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: מִיָּם עַד יָם
  choice: समुद्र से समुद्र तक
  rationale: यह इब्रानी भौगोलिक अभिव्यक्ति को उसकी व्यापकता सहित सीधे रूप में रखता है और किसी निश्चित समुद्र या दिशा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וּמִצָּפוֹן וְעַד מִזְרָח
  choice: और उत्तर से पूर्व तक
  rationale: मִזְרָח का अर्थ पूर्व, अर्थात सूर्योदय की दिशा, है। सीधा अनुवाद मूल की असामान्य दिशात्मक जोड़ी को व्याख्या द्वारा बदलने के बजाय सुरक्षित रखता है।
- source_word: יְשׁוֹטְטוּ
  choice: इधर-उधर फिरेंगे
  rationale: यह क्रिया खोज में बार-बार अलग-अलग दिशाओं में घूमने का भाव देती है। ‘इधर-उधर फिरेंगे’ आधुनिक हिन्दी में स्पष्ट है और अनिवार्यतः दौड़ने का अर्थ नहीं जोड़ता।
- source_word: לְבַקֵּשׁ
  choice: ढूँढ़ने के लिए
  rationale: यह उद्देश्यसूचक infinitive को सहज हिन्दी में व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ דָּבָר की पारंपरिक और पारदर्शी अभिव्यक्ति है; भविष्यद्वाणी के प्रसंग में इसका आशय परमेश्वर से मिलने वाला संदेश या प्रकाशन है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וְלֹא יִמְצָאוּ
  choice: पर उसे पाएँगे नहीं
  rationale: ‘उसे’ का संकेत पहले आए ‘वचन’ की ओर है। इब्रानी वाव को यहाँ परिणाम के विरोधाभास के कारण स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है; ‘प्रभु’ मूल में उपस्थित भेद को मिटा देता, जबकि ‘यहोवा’ एक पारंपरिक किंतु बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: דְּבַר יְהוָה का आशय
  choice: याहवे का वचन
  alternative: याहवे का संदेश
  rationale: ‘वचन’ मूल शब्द की व्यापकता और भविष्यद्वाणी-संबंधी धार्मिक अभिव्यक्ति को बनाए रखता है। पाद-टिप्पणी स्पष्ट करती है कि यहाँ सामान्य बोली नहीं, परमेश्वर से आने वाला संदेश या प्रकाशन अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोहराई गई गतिशील क्रियाओं का भेद ‘भटकेंगे’ और ‘इधर-उधर फिरेंगे’ से बनाए रखा गया है। ‘उत्तर से पूर्व तक’ की असामान्य दिशात्मक संरचना को मूल की वास्तविक अस्पष्टता और तनाव के कारण ज्यों का त्यों रखा गया है।
