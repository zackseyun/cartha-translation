  yaml_path: translation/ot/amos/008/014.yaml
  text: Those who swear by the guilt of Samaria and say[a], ‘As your god, Dan, lives,’ and[c][b], ‘As the way of Beer-sheba lives,’ will fall and never rise again.
translation:
  language: hi
  text: जो सामरिया के दोष की शपथ खाते हैं[a] और कहते हैं, “हे दान, तेरे देवता के जीवन की शपथ,” और “बेर्शेबा के मार्ग के जीवन की शपथ,” वे गिरेंगे और फिर कभी नहीं उठेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामरिया के पाप की”; कुछ लोग इसे सामरिया से जुड़े किसी देवता या मूर्ति का संकेत मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁבָּעִים
  choice: जो ... की शपथ खाते हैं
