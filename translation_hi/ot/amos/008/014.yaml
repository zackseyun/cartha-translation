- source_word: חֵי
  choice: '... के जीवन की शपथ'
  rationale: इब्रानी शपथ-सूत्र को हिन्दी में स्पष्ट और प्रतिष्ठित शपथ-वाक्य के रूप में व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ דָּן
  choice: हे दान, तेरे देवता
  rationale: व्यंजनहीन मूल पाठ की संक्षिप्त और संदिग्ध रचना को सम्भव सम्बोधन के रूप में रखा गया है; ‘दान के तेरे देवता’ वैकल्पिक विश्लेषण पादटिप्पणी में दिया गया है।
- source_word: דֶּרֶךְ בְּאֵר שָׁבַע
  choice: बेर्शेबा का मार्ग
  rationale: דֶּרֶךְ के शाब्दिक अर्थ ‘मार्ग’ को रखा गया है, क्योंकि यहाँ तीर्थयात्रा के मार्ग अथवा उपासना-पद्धति—दोनों की सम्भावना है।
- source_word: וְנָפְלוּ וְלֹא יָקוּמוּ עוֹד
  choice: वे गिर पड़ेंगे और फिर कभी न उठेंगे
  rationale: भविष्यसूचक न्याय और उसके अंतिम स्वरूप को स्वाभाविक, संक्षिप्त हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘सामरिया के दोष’ का आशय
  choice: सामरिया की दोषपूर्ण उपासना की ओर सम्भावित लाक्षणिक संकेत रखते हुए ‘दोष’
  alternative: ‘सामरिया का पाप’; अथवा ‘सामरिया की अशिमा’ नामक देवता
  rationale: सामान्य संज्ञा का प्रचलित अर्थ मुख्य पाठ में रहता है और किसी विशेष देवता की पहचान अनावश्यक रूप से निश्चित नहीं की जाती।
- issue: אֱלֹהֶיךָ דָּן की वाक्य-रचना
  choice: दान को सम्बोधन मानकर ‘हे दान, तेरे देवता’
  alternative: ‘दान के तेरे देवता’
  rationale: मूल पाठ की संक्षिप्त रचना एकाधिक विश्लेषण स्वीकार करती है; मुख्य पाठ एक व्याकरणतः सम्भव पाठ देता है और विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ‘बेर्शेबा का मार्ग’ का अर्थ
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति बनाए रखना
  alternative: बेर्शेबा की तीर्थयात्रा अथवा वहाँ की उपासना-पद्धति
  rationale: मूल अभिव्यक्ति की उपासना-संबंधी अस्पष्टता को किसी एक अर्थ में सीमित नहीं किया गया।
