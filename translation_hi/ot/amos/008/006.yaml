base_translation:
  language: en
  yaml_path: translation/ot/amos/008/006.yaml
  text: to buy the poor for silver[a], and the needy for a pair of sandals, and sell the sweepings of the grain.
translation:
  language: hi
  text: ताकि हम गरीबों को चाँदी के बदले और ज़रूरतमंद को जूतियों की एक जोड़ी के बदले खरीदें, और अनाज का बचा-खुचा अंश[a] बेचें।
  philosophy: optimal-equivalence
  footnotes:
