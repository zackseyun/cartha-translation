    text: या, ‘अनाज की छँटाई में बचा अंश’ अथवा ‘गिरा हुआ अनाज’; इब्रानी पदबंध संभवतः घटिया अनाज-अवशेष को माल के रूप में बेचने का संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְנוֹת
  choice: खरीद लें
  rationale: क़ाल धातु का यह क्रियार्थक रूप पिछले पद में व्यक्त व्यापारियों की मंशा को आगे बढ़ाता है। यहाँ खरीदने का अर्थ आर्थिक शोषण के द्वारा गरीबों को संभवतः ऋण-दासता में ले लेना है।
- source_word: בַּכֶּסֶף
  choice: चाँदी के बदले
  rationale: पूर्वसर्ग यहाँ कीमत का बोध कराता है। ‘चाँदी’ मूल इब्रानी की ठोस अभिव्यक्ति और नबी की शैली को बनाए रखती है।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: यह शब्द आर्थिक रूप से गरीब और सामाजिक रूप से कमजोर लोगों को सूचित करता है; इस संदर्भ में ‘गरीबों’ सहज और स्पष्ट है।
- source_word: וְאֶבְיוֹן
  choice: और जरूरतमंद को
  rationale: यह शब्द דַּלִּים के समानार्थी होते हुए भी उससे पूरी तरह एक नहीं है। ‘जरूरतमंद’ समानांतरता में अर्थभेद बनाए रखता है।
- source_word: בַּעֲבוּר נַעֲלָיִם
  choice: एक जोड़ी जूतियों के बदले
  rationale: नַעֲלָיִם द्विवचन है, इसलिए ‘एक जोड़ी जूतियों’ स्वाभाविक है और उस तुच्छ कीमत को स्पष्ट करता है जिसके लिए जरूरतमंद का शोषण किया जाता है।
- source_word: וּמַפַּל בַּר
  choice: और अनाज का कूड़ा-कचरा
  rationale: מַפַּל उस सामग्री को दर्शाता है जो गिर गई हो या छँटकर निकली हो; בַּר यहाँ सामान्यतः अनाज है। ‘कूड़ा-कचरा’ घटिया बचे हुए अंश और बेईमान बिक्री—दोनों का संकेत देता है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखती है।
- source_word: נַשְׁבִּיר
  choice: भी बेच डालें
  rationale: शׁבר का हिफ़ील रूप इस व्यापारिक संदर्भ में अनाज बेचने का अर्थ देता है। ‘बेच डालें’ वक्ताओं की निर्लज्ज मंशा को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: गरीबों को ‘खरीदने’ का आशय
  choice: मूल का सीधा ‘खरीद लें’ रखा गया
  alternative: ‘ऋण-दास बना लें’
  rationale: संदर्भ ऋण-दासता या आर्थिक अधीनता की ओर संकेत करता है, पर मूल पद इसे स्पष्ट रूप से नहीं खोलता; इसलिए व्याख्यात्मक विस्तार के बजाय उसकी कठोर और कुछ हद तक खुली अभिव्यक्ति सुरक्षित रखी गई है।
