source:
  edition: WLC
  text: וְ/הֵילִ֜ילוּ שִׁיר֤וֹת הֵיכָל֙ בַּ/יּ֣וֹם הַ/ה֔וּא נְאֻ֖ם אֲדֹנָ֣/י יְהוִ֑ה רַ֣ב הַ/פֶּ֔גֶר בְּ/כָל מָק֖וֹם הִשְׁלִ֥יךְ הָֽס־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/008/003.yaml
  text: And the songs of the palace will become wailing in that day[a], declares the Lord GOD. Many will be the corpses[b]; in every place they will throw them out—silence!
translation:
  language: hi
  text: उस दिन राजमहल के गीत विलाप में बदल जाएँगे[a]—प्रभु याहवे की यह घोषणा है। लाशें बहुत होंगी; हर जगह उन्हें फेंक दिया जाएगा। चुप![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर के गीत विलाप में बदल जाएँगे।” इब्रानी शब्द הֵיכָל का अर्थ ‘राजमहल’ या ‘मन्दिर’ दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “शान्त!” अथवा “मौन रहो!” अंतिम इब्रानी शब्द הָס चुप रहने का तीखा आह्वान है, जो सम्भवतः भय या स्तब्धता प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵילִילוּ שִׁירוֹת
  choice: गीत विलाप में बदल जाएँगे
  rationale: क्रिया ילל का हिफ़ईल रूप और बहुवचन कर्ता שִׁירוֹת मिलकर गीतों के शोकपूर्ण विलाप में बदल जाने का सजीव भाव देते हैं। यह हिन्दी में स्वाभाविक है और केवल गायकों के रोने का अर्थ नहीं देता।
- source_word: הֵיכָל
  choice: राजमहल
  rationale: यह शब्द ‘राजमहल’ या ‘मन्दिर’ दोनों का अर्थ दे सकता है। आमोस 8 में राज्य के सार्वजनिक और अभिजात जीवन पर न्याय के संदर्भ में ‘राजमहल’ उपयुक्त है; वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक भविष्यद्वाणी-सूचक काल-वाक्यांश का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वक्ता की प्रामाणिक घोषणा के सूत्र के रूप में प्रस्तुत किया गया है। अֲדֹנָי को ‘प्रभु’ और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ रखा गया है।
- source_word: רַב הַפֶּגֶר
  choice: लाशें बहुत होंगी
  rationale: मात्रा बताने वाले רַב और पגר ‘मृत देह’ को आधुनिक हिन्दी में स्पष्ट, सीधी और प्रभावशाली रीति से व्यक्त करता है।
- source_word: בְּכָל מָקוֹם הִשְׁלִיךְ
  choice: हर जगह उन्हें फेंक दिया जाएगा
  rationale: एकवचन क्रिया यहाँ अवैयक्तिक भाव में है। हिन्दी का कर्मवाच्य अज्ञात या सामूहिक कर्ता को स्वाभाविक रूप से व्यक्त करता है; ‘उन्हें’ का संकेत पूर्वोक्त लाशों की ओर है।
- source_word: הָס
  choice: चुप!
  rationale: अंतिम तीखा उद्गार मौन की माँग करता है और सामूहिक मृत्यु के बाद भय तथा स्तब्धता को उभारता है। संक्षिप्त रूप मूल की आकस्मिकता बनाए रखता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल पाठ में יהוה, परमेश्वर का विशिष्ट वाचा-नाम, स्पष्ट रूप से आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है, जबकि אֲדֹנָי का अर्थ ‘प्रभु’ है।
- issue: הֵיכָל का स्थल-संदर्भ
  choice: राजमहल
  alternative: मन्दिर
  rationale: दोनों अर्थ शब्द-संगत हैं और पद अकेले इस तनाव को पूरी तरह समाप्त नहीं करता। मुख्य पाठ में प्रसंगानुकूल ‘राजमहल’ चुना गया है और ‘मन्दिर’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और भविष्यद्वाणी के कठोर स्वर के अनुरूप रखी गई है। छोटे अंतिम उद्गार से मूल इब्रानी की आकस्मिक और भयावह समाप्ति सुरक्षित रहती है।
