  text: כֹּ֤ה הִרְאַ֨/נִי֙ אֲדֹנָ֣/י יְהוִ֔ה וְ/הִנֵּ֥ה קֹרֵ֛א לָ/רִ֥ב בָּ/אֵ֖שׁ אֲדֹנָ֣/י יְהוִ֑ה וַ/תֹּ֨אכַל֙ אֶת תְּה֣וֹם רַבָּ֔ה וְ/אָכְלָ֖ה אֶת הַ/חֵֽלֶק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/004.yaml
  text: 'This is what the Lord GOD showed me: behold[a], the Lord GOD was calling for a judgment by fire[b], and it consumed the great deep and was consuming the land.'
translation:
  language: hi
  text: 'प्रभु यहोवा ने मुझे यह दिखाया: देखो, प्रभु यहोवा आग के द्वारा न्यायिक वाद के लिए बुला रहे थे[a]। आग ने महान गहराई को भस्म कर दिया और उस भाग को भस्म करने लगी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आग के द्वारा विवाद करने के लिए” अथवा “आग से न्याय करने के लिए”; इब्रानी पद में न्यायिक विवाद या वाद का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “उस भूभाग को” अथवा “देश को”; इब्रानी शब्द का शाब्दिक अर्थ “भाग” या “हिस्सा” है और यहाँ यह किसी भूभाग को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: ने मुझे यह दिखाया
  rationale: दर्शन के परिचय का स्वाभाविक हिन्दी रूप है और हिफ़ील क्रिया का ‘दिखाया’ अर्थ सुरक्षित रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों उपाधियों को बनाए रखते हुए יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: दर्शन की आकस्मिकता और सजीवता व्यक्त करता है।
- source_word: קֹרֵא לָרִב בָּאֵשׁ
  choice: आग के द्वारा मुक़दमा लड़ने को पुकार रहे थे
  rationale: לָרִב के क्रियात्मक और न्यायिक अर्थ को बनाए रखता है; ‘दंड’ कहकर परिणाम को मूल से अधिक निश्चित नहीं करता। कृदंत की जारी क्रिया ‘पुकार रहे थे’ से व्यक्त होती है।
- source_word: וַתֹּאכַל
  choice: आग ने ... भस्म कर दिया
  rationale: स्त्रीलिंग क्रिया का कर्ता आग है; हिन्दी में सर्वनाम की अस्पष्टता से बचने हेतु कर्ता दोहराया गया है।
- source_word: תְּהוֹם רַבָּה
  choice: विशाल गहरा जल
  rationale: תהום की गहरे अथाह जलराशि वाली बाइबिलीय धारणा को स्पष्ट हिन्दी में व्यक्त करता है, बिना इसे बाद की किसी धर्मवैज्ञानिक अवधारणा से जोड़ने के।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म करने लगी
  rationale: दर्शन में आगे बढ़ती हुई क्रिया का भाव रखता है और पहले पूर्ण हुए भक्षण से उसका अंतर दिखाता है।
- source_word: הַחֵלֶק
  choice: उस भाग
  rationale: मूल के ‘भाग/हिस्से’ को जानबूझकर सुरक्षित रखता है; इसे निश्चित रूप से ‘देश’ मानकर व्याख्यात्मक विस्तार नहीं करता।
theological_decisions:
- issue: संयुक्त ईश्वरीय नाम אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: व्यक्तिवाचक वाचा-नाम को सामान्य उपाधि में बदलने के बजाय मूल के दोनों तत्वों को अलग-अलग बनाए रखता है।
- issue: לָרִב का न्यायिक आशय
  choice: मुक़दमा लड़ने को
  alternative: न्याय करने को
  rationale: मूल में विवाद करना, मुक़दमा लड़ना अथवा न्यायिक प्रतिवाद करना संभव है; क्रियात्मक अनुवाद इस तनाव को ‘दंड’ या अंतिम निर्णय में सीमित नहीं करता।
- issue: הַחֵלֶק का संदर्भ
  choice: उस भाग
  alternative: देश
  rationale: यह शब्द भाग, हिस्सा, भूभाग या आवंटित क्षेत्र बता सकता है। निकट संदर्भ इसे भूमि से जोड़ सकता है, पर मूल की अस्पष्टता बनाए रखना अधिक उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मुक़दमा लड़ने’ में मूल का न्यायिक रूपक रखा गया है; ‘उस भाग’ के साथ पादटिप्पणी मूल की वास्तविक संदिग्धता स्पष्ट करती है।
