  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י מָֽה אַתָּ֤ה רֹאֶה֙ עָמ֔וֹס וָ/אֹמַ֖ר אֲנָ֑ךְ וַ/יֹּ֣אמֶר אֲדֹנָ֗/י הִנְ/נִ֨י שָׂ֤ם אֲנָךְ֙ בְּ/קֶ֨רֶב֙ עַמִּ֣/י יִשְׂרָאֵ֔ל לֹֽא אוֹסִ֥יף ע֖וֹד עֲב֥וֹר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/008.yaml
  text: And Yahweh said to me[a], “What do you see, Amos?” And I said, “A plumb line.” Then the Lord said, “Look, I am setting a plumb line in the midst of my people Israel[b]; I will not again pass by them.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “आमोस, तुम्हें क्या दिखाई दे रहा है?” मैंने कहा, “एक साहुल[a]।” तब प्रभु ने कहा, “देख, मैं अपनी प्रजा इस्राएल के बीच साहुल रख रहा हूँ; मैं उसे फिर कभी छोड़कर आगे नहीं बढ़ूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “राँगा,” “सीसा,” अथवा “साहुल का लटकता भार।” इब्रानी शब्द शायद साहुल या उससे जुड़े पदार्थ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “मैं उसे फिर कभी छोड़कर आगे नहीं बढ़ूँगा” का आशय संभवतः यह है कि याहवे अब इस्राएल को नहीं बख्शेगा अथवा उसके पाप को और अनदेखा नहीं करेगा।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचिक नाम को उपाधि से अलग रखते हुए देवनागरी में लिप्यंतरित किया गया है।
- source_word: מָה אַתָּה רֹאֶה
  choice: तुम्हें क्या दिखाई दे रहा है?
  rationale: दर्शन के तत्काल प्रसंग और इब्रानी कृदन्त की जारी क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲנָךְ
  choice: साहुल
  rationale: प्रसंग में दीवार की सीध जाँचने वाले भारयुक्त उपकरण का संकेत सबसे उपयुक्त है; शब्द की सटीक व्युत्पत्ति और धातु-संबंधी अर्थ विवादित होने के कारण विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ प्रयुक्त ईश्वरीय उपाधि को याहवे नाम से अलग रखा गया है।
- source_word: הִנְנִי שָׂם
  choice: देख, मैं ... लगा रहा हूँ
  rationale: הִנְנִי की ध्यान आकर्षित करने वाली शक्ति और שָׂם की दृश्यात्मक, जारी क्रिया दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּקֶרֶב עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के बीच
  rationale: स्थानगत अर्थ को बनाए रखते हुए इस्राएल के साथ परमेश्वर के प्रजा-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: अब मैं फिर उसके पास से होकर नहीं गुज़रूँगा
  rationale: עבר के ‘पास से गुज़रने’ वाले बिंब को मुख्य पाठ में सुरक्षित रखता है। एकवचन सर्वनाम को सामूहिक संज्ञा ‘प्रजा इस्राएल’ के अनुरूप ‘उसके’ से व्यक्त किया गया है; दण्ड न टालने का निहितार्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम और उपाधि का भेद
  choice: יְהוָה को ‘याहवे’ और אֲדֹנָי को ‘प्रभु’
  alternative: दोनों को ‘प्रभु’ कहना
  rationale: पद में विशिष्ट वाचिक नाम और उपाधि दोनों आए हैं; उनका भेद बनाए रखने से स्रोत-पाठ की सूक्ष्मता सुरक्षित रहती है।
- issue: न्याय-संबंधी मुहावरा לֹא אוֹסִיף עוֹד עֲבוֹר לוֹ
  choice: ‘अब मैं फिर उसके पास से होकर नहीं गुज़रूँगा’ बिंब को मुख्य पाठ में रखना
  alternative: ‘अब मैं उसे और नहीं छोड़ूँगा’ या ‘अब मैं उसके पाप को अनदेखा नहीं करूँगा’
  rationale: मुख्य पाठ में इब्रानी रूपक और उसकी वास्तविक अस्पष्टता बनी रहती है, जबकि आसन्न न्याय और अब क्षमा करके छोड़ न देने का संभावित आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘साहुल’ प्रसंग के तकनीकी बिंब को संक्षेप में व्यक्त करता है। याहवे और प्रभु का भेद जानबूझकर सुरक्षित रखा गया है; अन्तिम वाक्य के न्याय-संबंधी मुहावरे को व्याख्यात्मक अनुवाद से पूरी तरह नहीं बदला गया।
