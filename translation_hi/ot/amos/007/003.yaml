    text: या “याहवे इस बात के विषय में पीछे हट गए,” अथवा “याहवे को इस बात का खेद हुआ।” इब्रानी क्रिया प्रसंग के अनुसार किसी निर्णय या घोषित कार्य को वापस लेने, खेद होने, या अपना मन बदलने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: मान गए
  rationale: इस भविष्यदर्शी मध्यस्थता के प्रसंग में निफ़अल क्रिया घोषित दंड को लागू न करने का निर्णय व्यक्त करती है। ‘मान गए’ आधुनिक हिन्दी में निवेदन के प्रत्युत्तर में ठहराए हुए कार्य से पीछे हटने का भाव स्वाभाविक रूप से देता है, बिना नैतिक भूल मान लेने का अर्थ जोड़े।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: עַל זֹאת
  choice: इस बात पर
  rationale: यह पदबंध पिछली दर्शन-घटना और उसके द्वारा सूचित दंड की ओर संकेत करता है; ‘इस बात पर’ उसका संदर्भ संक्षेप और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא תִהְיֶה
  choice: यह नहीं होगा
  rationale: स्त्रीलिंग एकवचन क्रिया प्रसंग में निहित विपत्ति अथवा घटना को सूचित करती है। ‘यह नहीं होगा’ भविष्यसूचक निषेध को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: אָמַר יְהוָה
  choice: याहवे ने कहा
  rationale: यह אָמַר का साधारण पूर्ण रूप है; अतः इसे किसी अधिक सूत्रबद्ध ‘घोषणा की’ के बजाय सीधे ‘ने कहा’ अनूदित किया गया है।
theological_decisions:
- issue: נִחַם יְהוָה में परमेश्वर के लिए मानवीय अनुभूति और निर्णय की भाषा
  choice: ‘याहवे इस बात पर मान गए’ कहकर आमोस की मध्यस्थता के बाद घोषित दंड रोकने का चित्रण बनाए रखा गया है।
  alternative: ‘याहवे ने इस बात के विषय में अपना मन बदल लिया’ या ‘याहवे को इस बात का खेद हुआ।’
  rationale: मूल पाठ परमेश्वर की कार्रवाई में वास्तविक प्रत्युत्तर को मानवीय ढंग से व्यक्त करता है। मुख्य अनुवाद उस तनाव को मिटाता नहीं, पर ‘पश्चाताप किया’ जैसे शब्द से नैतिक अपराध का अनचाहा संकेत भी नहीं देता; दूसरे सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘मान गए’ मध्यस्थता के निकट प्रसंग में मुहावरेदार है; पादटिप्पणी मूल क्रिया की व्यापक अर्थ-सीमा और धर्मवैज्ञानिक तनाव को स्पष्ट रखती है।
