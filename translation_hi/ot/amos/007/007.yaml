source:
  edition: WLC
  text: כֹּ֣ה הִרְאַ֔/נִי וְ/הִנֵּ֧ה אֲדֹנָ֛/י נִצָּ֖ב עַל חוֹמַ֣ת אֲנָ֑ךְ וּ/בְ/יָד֖/וֹ אֲנָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/007.yaml
  text: 'This is what he showed me: behold[a], the Lord was standing by a wall made with a plumb line, with a plumb line in his hand.'
translation:
  language: hi
  text: 'उसने मुझे यह दिखाया: देखो, प्रभु साहुल से बनी एक दीवार[a] के पास खड़ा था और उसके हाथ में साहुल था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है; इसका अनुवाद ‘साहुल की दीवार पर’ भी हो सकता है। אֲנָךְ सम्भवतः साहुल या उसका लटकता भार दर्शाता है, यद्यपि कुछ विद्वान इसका अर्थ ‘सीसा’ या ‘टिन’ मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: उसने मुझे यह दिखाया
  rationale: दर्शन के परिचय की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए הִרְאַנִי के प्रेरणार्थक भाव, ‘मुझे दिखाया’, को सुरक्षित रखा गया है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह दर्शन में अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘देखो’ आधुनिक हिन्दी में स्पष्ट है और मूल का संकेतात्मक बल बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह परमेश्वर के लिए प्रयुक्त उपाधि है, कोई व्यक्तिवाचक नाम नहीं; इसलिए इसका अनुवाद ‘प्रभु’ किया गया है।
- source_word: נִצָּב
  choice: खड़ा था
  rationale: इब्रानी कृदन्त चलते हुए दृश्य की स्थिति दिखाता है; ‘खड़ा था’ उसी दृश्यात्मक निरन्तरता को व्यक्त करता है।
- source_word: עַל
  choice: के पास
  rationale: עַל का सामान्य अर्थ ‘पर’ है, पर दीवार के साथ इस दृश्य में ‘के पास’ निरीक्षण के लिए खड़े होने का सम्भावित स्थानिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: חוֹמַת אֲנָךְ
  choice: साहुल से बनी एक दीवार
  rationale: कठिन समास को ऐसी दीवार के रूप में व्यक्त किया गया है जिसे साहुल से सीधा बनाकर खड़ा किया गया हो; मूल की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: אֲנָךְ
  choice: साहुल
  rationale: सन्दर्भ में यह दीवार की सीध जाँचने वाले भारयुक्त उपकरण को सबसे सम्भावित रूप से दर्शाता है। हिन्दी ‘साहुल’ इस निर्माण-उपकरण का संक्षिप्त और प्रचलित नाम है।
- source_word: וּבְיָדוֹ אֲנָךְ
  choice: और उसके हाथ में साहुल था
  rationale: मूल के समान वस्तु को प्रभु के हाथ में दिखाता है और हिन्दी में वाक्य को सहज रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: मूल में यहाँ परमेश्वर की उपाधि है, चार अक्षरों वाला ईश्वरीय नाम नहीं। ‘प्रभु’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और गरिमापूर्ण है, जबकि किसी विशिष्ट साम्प्रदायिक व्याख्या को आरोपित नहीं करता।
- issue: दीवार के सम्बन्ध में עַל का स्थानिक अर्थ
  choice: दीवार के पास
  alternative: दीवार पर
  rationale: दोनों अर्थ व्याकरणतः सम्भव हैं। दृश्य में हाथ में साहुल लेकर दीवार का निरीक्षण करने के कारण ‘के पास’ अधिक स्वाभाविक है; मूल शब्दावली की कठिनाई पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साहुल’ निर्माण-काम में प्रयुक्त सटीक हिन्दी शब्द है। ‘देखो’ दर्शन की आकस्मिकता को बिना अत्यधिक पुरातन शैली के व्यक्त करता है।
