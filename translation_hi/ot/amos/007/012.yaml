  text: וַ/יֹּ֤אמֶר אֲמַצְיָה֙ אֶל עָמ֔וֹס חֹזֶ֕ה לֵ֥ךְ בְּרַח לְ/ךָ֖ אֶל אֶ֣רֶץ יְהוּדָ֑ה וֶ/אֱכָל שָׁ֣ם לֶ֔חֶם וְ/שָׁ֖ם תִּנָּבֵֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/012.yaml
  text: Then Amaziah said to Amos[a], “Seer, go, flee away to the land of Judah, and eat bread there, and prophesy there.”
translation:
  language: hi
  text: तब अमस्याह ने आमोस से कहा, “हे दर्शी, जा, भागकर यहूदा देश चला जा। वहीं रोटी खा[a] और वहीं भविष्यवाणी कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सम्भवतः, “वहीं अपनी रोज़ी कमा” या “वहीं अपना निर्वाह कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֶה
  choice: दर्शी
  rationale: यह दर्शन देखने वाले व्यक्ति के लिए प्रयुक्त विशिष्ट पद है; इसे सामान्य शब्द ‘भविष्यद्वक्ता’ से अनावश्यक रूप से नहीं मिलाया गया।
- source_word: לֵךְ בְּרַח לְךָ
  choice: जा, भागकर ... चला जा
  rationale: दोनों आज्ञार्थक क्रियाओं तथा לְךָ में निहित तत्काल व्यक्तिगत प्रस्थान के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ יְהוּדָה
  choice: यहूदा देश
  rationale: मूल के भौगोलिक और राजनीतिक अर्थ को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וֶאֱכָל שָׁם לֶחֶם
  choice: वहीं रोटी खा
  rationale: मूल का ठोस वाक्यांश सुरक्षित रखा गया है; जीविका कमाने का संभावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: תִּנָּבֵא
  choice: भविष्यवाणी कर
  rationale: नבא के निफ़अल रूप का स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: कथानक को आगे बढ़ाने वाले वाव-क्रम को आधुनिक हिन्दी के स्वाभाविक क्रमसूचक ‘तब’ से व्यक्त किया गया है।
theological_decisions:
- issue: क्या ‘रोटी खा’ को आमोस पर जीविका के लिए भविष्यवाणी करने का आरोप स्पष्ट करते हुए अनूदित किया जाए
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति ‘रोटी खा’ रखी गई है।
  alternative: ‘वहीं अपनी रोज़ी कमा’ या ‘वहीं अपनी जीविका चला’
  rationale: संदर्भ में अमस्याह संभवतः आमोस को पेशेवर भविष्यद्वक्ता मानकर तिरस्कारपूर्वक बोलता है, पर इब्रानी पाठ स्वयं ‘रोटी खा’ कहता है। मुख्य पाठ उस अभिव्यक्ति और उसके तनाव को बनाए रखता है, जबकि संभावित मुहावरेदार आशय पादटिप्पणी में स्पष्ट होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘हे दर्शी’ संबोधन मूल के विशिष्ट भविष्यसूचक पद को बनाए रखता है; आज्ञाओं की तीव्रता को ‘जा, भागकर ... चला जा’ से व्यक्त किया गया है।
