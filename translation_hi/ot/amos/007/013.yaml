  yaml_path: translation/ot/amos/007/013.yaml
  text: But at Bethel you must not prophesy any longer[a], for it is the king’s sanctuary[b], and it is a royal house.
translation:
  language: hi
  text: परन्तु बेतेल में अब और भविष्यवाणी मत करना[a], क्योंकि यह राजा का पवित्र स्थान है और राज्य का भवन[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर भविष्यवाणी मत करना” या “तू आगे से भविष्यवाणी न करना।” इब्रानी में शाब्दिक भाव है, “भविष्यवाणी करने के लिए अब और न जोड़ना।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राज्य का घर।” इससे संभवतः राजसत्ता से जुड़ी संस्था के रूप में बेतेल का उल्लेख है।
    reason: lexical_alternative
