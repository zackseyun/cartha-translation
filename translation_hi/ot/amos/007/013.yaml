  choice: ‘राजा का पवित्रस्थान’ और ‘राजघराने का भवन’ के रूप में वर्णन
  alternative: ‘राजकीय मंदिर’ अथवा ‘राज्य का पवित्रस्थान’
  rationale: यह अमस्याह का राजनीतिक-धार्मिक दावा है, अनुवादक की ओर से बेतेल की उपासना को वैध ठहराना नहीं। चुनी हुई भाषा मूल के रूपक और संस्थागत संबंध को बनाए रखती है।
