reference: Amos 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי כֹה֙ אָמַ֣ר עָמ֔וֹס בַּ/חֶ֖רֶב יָמ֣וּת יָרָבְעָ֑ם וְ/יִ֨שְׂרָאֵ֔ל גָּלֹ֥ה יִגְלֶ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/011.yaml
  text: 'For this is what Amos has said: ‘Jeroboam will die by the sword[a], and Israel will surely go into exile from its land.’'
translation:
  language: hi
  text: 'क्योंकि आमोस ने यह कहा है: “यारोबाम तलवार से मरेगा, और इस्राएल निश्चय ही अपनी भूमि से निर्वासन में चला जाएगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चित रूप से निर्वासित हो जाएगा” अथवा “अवश्य ही बंदी बनाकर ले जाया जाएगा।” हिब्रू में बल देने के लिए उसी धातु का अनन्त रूप एक रूपान्तरित क्रिया के साथ प्रयुक्त हुआ है।
    reason: निर्वासन संबंधी हिब्रू अभिव्यक्ति के वैकल्पिक अनुवाद और उसके बलसूचक व्याकरण को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द पिछले पद में लगाए गए आरोप का कारण बताते हुए आमोस के कथन का उद्धरण प्रस्तुत करता है।
- source_word: כֹה אָמַר עָמוֹס
  choice: आमोस ने यह कहा है
  rationale: यह स्वाभाविक आधुनिक हिन्दी में रिपोर्ट किए गए पूर्व कथन को व्यक्त करता है और ‘ऐसा कहा’ की सूत्रात्मक शक्ति बनाए रखता है।
- source_word: בַּחֶרֶב יָמוּת
  choice: तलवार से मरेगा
  rationale: हिब्रू में तलवार हिंसक मृत्यु का साधन है; सीधा अनुवाद अर्थ और चित्र दोनों सुरक्षित रखता है।
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: राजा के नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְיִשְׂרָאֵל
  choice: और इस्राएल
  rationale: यहाँ ‘इस्राएल’ उत्तरी राज्य अथवा उसके लोगों के लिए सामूहिक एकवचन है; मूल पदनाम को बिना अधिक व्याख्या के रखा गया है।
- source_word: גָּלֹה יִגְלֶה
  choice: निश्चय ही ... निर्वासन में चला जाएगा
  rationale: एक ही धातु के क्रियार्थक संज्ञा-रूप और सीमित क्रिया का संयोजन कथन पर बल देता है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: מֵעַל אַדְמָתוֹ
  choice: अपनी भूमि से
  rationale: ‘भूमि’ राष्ट्रीय भूभाग के अर्थ में उपयुक्त है। निजवाचक ‘अपनी’ सामूहिक एकवचन इस्राएल और उसकी भूमि के संबंध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस्राएल’ का संदर्भ और एकवचन संबंधसूचक प्रत्यय
  choice: इस्राएल को सामूहिक राष्ट्रीय इकाई मानते हुए ‘अपनी भूमि’
  alternative: ‘इस्राएल के लोग अपनी भूमि से’
  rationale: हिब्रू में इस्राएल को एकवचन सामूहिक इकाई माना गया है। मुख्य पाठ में ‘इस्राएल’ बनाए रखने से राजनीतिक और सामूहिक अर्थ सुरक्षित रहता है तथा अनावश्यक विशिष्टीकरण नहीं होता।
- issue: גָּלֹה יִגְלֶה में निर्वासन की क्रियात्मक दिशा
  choice: निर्वासन में चला जाएगा
  alternative: निर्वासित कर दिया जाएगा
  rationale: मूल में क़ाल रूप है, जो इस्राएल के निर्वासन में जाने को व्यक्त करता है; सक्रिय हिन्दी इसे अनावश्यक रूप से कर्मवाच्य बनाए बिना मूल की अभिव्यक्ति के निकट रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। उद्धृत आरोप को सीधे कथन के रूप में रखा गया है। पादटिप्पणी का चिह्न निर्वासन वाली अभिव्यक्ति के बाद लगाया गया है, क्योंकि टिप्पणी उसी हिब्रू पदबंध से संबंधित है।
