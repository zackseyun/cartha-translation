  text: וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ חֲדַל נָ֔א מִ֥י יָק֖וּם יַעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/005.yaml
  text: Then I said[a], “Lord GOD, please cease[b]. How can Jacob stand? For he is small.”
translation:
  language: hi
  text: तब मैंने कहा, “हे प्रभु याहवे[a], कृपा करके रुक जाइए! याकूब कैसे टिक पाएगा?[b] क्योंकि वह छोटा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘अदोनाय याहवे’ (אֲדֹנָי יְהוִה), अर्थात उपाधि ‘प्रभु’ के साथ परमेश्वर का विशिष्ट नाम ‘याहवे’।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्य बहुत संक्षिप्त है। इसका अनुवाद ‘याकूब को कौन खड़ा करेगा?’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु याहवे
  rationale: सम्बोधन में ‘हे’ स्वाभाविक है; ‘प्रभु’ אֲדֹנָי को और ‘याहवे’ परमेश्वर के विशिष्ट नाम יהוה को अलग-अलग सुरक्षित रखता है।
- source_word: חֲדַל נָא
  choice: कृपा करके रुक जाइए
  rationale: חֲדַל न्याय की कार्रवाई रोकने का आग्रह है और נָא विनती का भाव जोड़ता है। आदरसूचक आज्ञार्थक रूप आम पाठक के लिए स्वाभाविक है।
- source_word: מִי יָקוּם יַעֲקֹב
  choice: याकूब कैसे टिक पाएगा?
  rationale: इब्रानी वाक्य संक्षिप्त और असामान्य है। प्रसंग में यह न्याय सहकर जीवित या स्थिर रह पाने के विषय में आलंकारिक प्रश्न है; वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ में राष्ट्रीय/वाचागत अर्थ में प्रयुक्त व्यक्तिवाचक नाम को ज्यों का त्यों रखा गया है।
- source_word: כִּי קָטֹן הוּא
  choice: क्योंकि वह छोटा है
  rationale: כִּי कारण बताता है और קָטֹן का मूल बिम्ब ‘छोटा’ सुरक्षित रखा गया है; ‘कमज़ोर’ अधिक व्याख्यात्मक होता। पुल्लिंग एकवचन ‘वह’ याकूब के व्यक्तिकरण से मेल खाता है।
theological_decisions:
- issue: संयुक्त उपाधि אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: यह रूप उपाधि אֲדֹנָי और वाचा के विशिष्ट नाम יהוה—दोनों को स्पष्ट रखता है और उन्हें एक सामान्य उपाधि में नहीं मिलाता।
- issue: מִי יָקוּם में याकूब के टिकने या किसी के उसे खड़ा करने का अर्थ
  choice: याकूब कैसे टिक पाएगा?
  alternative: याकूब को कौन खड़ा करेगा?
  rationale: आस-पास के न्याय-दर्शन और याकूब के छोटा होने का कारणात्मक कथन उसके सह न पाने की ओर संकेत करते हैं; फिर भी इब्रानी के ‘कौन’ और संभावित सकर्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सहज रखी गई है। भविष्यसूचक विनती की तीव्रता विस्मयादिबोधक चिह्न से व्यक्त होती है, जबकि ‘छोटा’ मूल रूपक और याकूब का सामूहिक व्यक्तिकरण बनाए रखता है।
