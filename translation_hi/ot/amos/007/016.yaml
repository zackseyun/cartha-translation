id: AMO.7.16
reference: Amos 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֖ה שְׁמַ֣ע דְּבַר יְהוָ֑ה אַתָּ֣ה אֹמֵ֗ר לֹ֤א תִנָּבֵא֙ עַל יִשְׂרָאֵ֔ל וְ/לֹ֥א תַטִּ֖יף עַל בֵּ֥ית יִשְׂחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/016.yaml
  text: 'And now[a], hear the word of Yahweh: You say, ‘Do not prophesy against Israel, and do not preach against the house of Isaac.’'
translation:
  language: hi
  text: और अब, याहवे का वचन सुन। तू कहता है, ‘इस्राएल के विरुद्ध भविष्यवाणी मत कर और इसहाक के घराने के विरुद्ध उपदेश मत दे[a]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसहाक के घराने के विरुद्ध वचन मत उंडेल।” यहाँ प्रयुक्त इब्रानी क्रिया का शाब्दिक अर्थ “टपकाना” है और यह भविष्यसूचक वाणी बोलने के लिए मुहावरे के रूप में आती है।
    reason: शाब्दिक रूपक और भविष्यसूचक मुहावरे—दोनों को दिखाने वाला शब्दार्थ-संबंधी विकल्प।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को रखते हुए आमोस के उत्तर में तत्काल परिवर्तन व्यक्त करता है।
- source_word: שְׁמַע
  choice: सुन
  rationale: यह अमस्याह को संबोधित एकवचन आज्ञार्थक रूप है; ‘सुन’ भविष्यसूचक वाणी की सीधी और स्वाभाविक शैली बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ मानक भविष्यसूचक सूत्र और דָּבָר के प्रकाशनात्मक भार को बनाए रखता है; יהוה को उसके व्यक्तिवाचक नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: אַתָּה אֹמֵר
  choice: तू कहता है
  rationale: स्पष्ट सर्वनाम और कृदंत अमस्याह के कथन पर बल देते हैं; निकटवर्ती प्रत्यक्ष संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है।
- source_word: לֹא תִנָּבֵא עַל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध भविष्यवाणी मत कर
  rationale: नकार के साथ अपूर्ण क्रिया यहाँ निषेध व्यक्त करती है। प्रसंग में עַל आमोस की दंडसूचक वाणी के विरोधी लक्ष्य को दर्शाता है, इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: וְלֹא תַטִּיף
  choice: और उपदेश मत दे
  rationale: נטף के हिफ़ील रूप का शाब्दिक अर्थ ‘टपकाना’ है, पर यहाँ यह भविष्यसूचक वाणी उंडेलने का मुहावरा है। ‘उपदेश मत दे’ स्वाभाविक हिन्दी में उसका कार्य बताता और पिछले ‘भविष्यवाणी’ से हल्का lexical distinction बनाए रखता है।
- source_word: עַל בֵּית יִשְׂחָק
  choice: इसहाक के घराने के विरुद्ध
  rationale: ‘इसहाक का घराना’ इस्राएल के लिए काव्यात्मक और वाचा-संबंधी पद है। ‘घराना’ हिन्दी में वंशगत समुदाय का भाव स्वाभाविक रूप से व्यक्त करता है और עַל की प्रतिकूल शक्ति को ‘के विरुद्ध’ रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: आमोस की वाणी का इस्राएल से संबंध
  choice: इस्राएल के विरुद्ध / इसहाक के घराने के विरुद्ध
  alternative: इस्राएल से / इसहाक के घराने से; इस्राएल के विषय में / इसहाक के घराने के विषय में
  rationale: עַל के कई संभावित संबंधसूचक अर्थ हैं, किंतु इस प्रसंग में अमस्याह दंडसूचक भविष्यवाणी को रोक रहा है। ‘के विरुद्ध’ इस टकरावपूर्ण शक्ति को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े व्यक्त करता है।
- issue: בֵּית יִשְׂחָק की पहचान
  choice: इसहाक का घराना
  alternative: इसहाक का परिवार / इस्राएल
  rationale: मूल की काव्यात्मक वाचा-संबंधी अभिव्यक्ति को सीधे ‘इस्राएल’ बनाकर समतल नहीं किया गया; पाठ में दोनों समानांतर पदों का तनाव और शैली सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधी भविष्यसूचक हिन्दी अपनाई गई है। अमस्याह को एकवचन निकट संबोधन के कारण ‘तू’ कहा गया है। ‘उपदेश मत दे’ मुहावरे का सहज अर्थ देता है, जबकि पादटिप्पणी मूल ‘टपकाने/उंडेलने’ के रूपक को सुरक्षित रखती है।
