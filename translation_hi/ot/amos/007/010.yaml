id: AMO.7.10
reference: Amos 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֗ח אֲמַצְיָה֙ כֹּהֵ֣ן בֵּֽית אֵ֔ל אֶל יָרָבְעָ֥ם מֶֽלֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר קָשַׁ֨ר עָלֶ֜י/ךָ עָמ֗וֹס בְּ/קֶ֨רֶב֙ בֵּ֣ית יִשְׂרָאֵ֔ל לֹא תוּכַ֣ל הָ/אָ֔רֶץ לְ/הָכִ֖יל אֶת כָּל דְּבָרָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/010.yaml
  text: Then Amaziah[a], the priest of Bethel, sent word to Jeroboam king of Israel, saying, “Amos has conspired against you in the midst of the house of Israel[c][b]; the land is not able to bear all his words.”
translation:
  language: hi
  text: 'तब बेतेल के याजक अमस्याह ने इस्राएल के राजा यारोबाम के पास यह सन्देश भेजा: “आमोस ने इस्राएल के घराने के बीच[b] आपके विरुद्ध षड्यन्त्र रचा है।[a] देश उसके सारे वचनों को सह नहीं सकता।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपके विरुद्ध साज़िश की है।”
    reason: קָשַׁר राजनीतिक प्रसंग में षड्यन्त्र रचने या साज़िश करने, दोनों ढंग से व्यक्त किया जा सकता है।
  - marker: b
    text: या, “इस्राएल के घराने में।”
    reason: בְּקֶרֶב का अर्थ ‘के बीच’, ‘में’ या ‘के मध्य’ हो सकता है।
  - marker: c
    text: या, “देश उसके सारे वचनों को अपने में समा नहीं सकता,” अथवा “सहन नहीं कर सकता।”
    reason: לְהָכִיל में समाहित करने और सहन करने, दोनों अर्थ-छायाएँ सम्भव हैं।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: यह सन्देश भेजा
  rationale: मूल क्रिया का अर्थ ‘भेजा’ है और לֵאמֹר आगे सन्देश प्रस्तुत करता है। हिन्दी में ‘यह सन्देश भेजा’ संप्रेषण की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֹּהֵן בֵּית אֵל
  choice: बेतेल के याजक
  rationale: रचना अमस्याह के पद और बेतेल से उसके संस्थागत सम्बन्ध को बताती है; ‘बेतेल के याजक’ इसे संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָשַׁר עָלֶיךָ
  choice: आपके विरुद्ध षड्यन्त्र रचा है
  rationale: राजनीतिक प्रसंग में קָשַׁר षड्यन्त्र या साज़िश करने का आरोप व्यक्त करता है और עַל आरोप के लक्ष्य को सूचित करता है। आदरसूचक ‘आपके’ राजा को सम्बोधित करने के लिए स्वाभाविक है।
- source_word: בְּקֶרֶב בֵּית יִשְׂרָאֵל
  choice: इस्राएल के घराने के बीच
  rationale: ‘बीच’ सामाजिक और स्थानिक अर्थ बनाए रखता है, जबकि ‘इस्राएल का घराना’ भविष्यद्वक्ताओं में प्रयुक्त सामुदायिक-राष्ट्रीय अभिव्यक्ति को केवल ‘इस्राएल’ कर देने से बचाता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस प्रसंग में शब्द समूची पृथ्वी नहीं, इस्राएल के भू-राजनीतिक समुदाय को सूचित करता है। हिन्दी में शिकायत के राजनीतिक आशय के लिए ‘देश’ स्वाभाविक है।
- source_word: לְהָכִיל
  choice: सह नहीं सकता
  rationale: यहाँ क्रिया में समाहित करने और सहन करने की क्षमता, दोनों का भाव सम्भव है। ‘सह नहीं सकता’ अमस्याह की शिकायत की आलंकारिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל דְּבָרָיו
  choice: उसके सारे वचनों
  rationale: यह बहुवचन ‘वचनों’ और समग्रता व्यक्त करने वाले ‘सारे’ दोनों को सुरक्षित रखता है; भविष्यद्वाणी के प्रसंग में ‘वचन’ गरिमापूर्ण और सुबोध है।
theological_decisions:
- issue: आमोस पर अमस्याह के आरोप का स्वरूप
  choice: राजनीतिक आरोप के रूप में ‘आपके विरुद्ध षड्यन्त्र रचा है’
  alternative: ‘आपके विरुद्ध साज़िश की है’
  rationale: पद अमस्याह द्वारा राजा के सामने लगाया गया आरोप सुनाता है; यह कथावाचक की ओर से आमोस को वास्तव में राजद्रोही घोषित नहीं करता। अनुवाद आरोप की तीव्रता बनाए रखता है, पर उसकी सत्यता का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण भविष्यद्वाणी-वृत्तान्त शैली अपनाई गई है। नामों के प्रचलित हिन्दी रूप—अमस्याह, बेतेल, यारोबाम और आमोस—रखे गए हैं। प्रत्यक्ष कथन में राजा के लिए आदरसूचक ‘आप’ स्वाभाविक हिन्दी व्यवहार के अनुसार प्रयुक्त है।
