source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם כִּלָּה֙ לֶֽ/אֱכוֹל֙ אֶת עֵ֣שֶׂב הָ/אָ֔רֶץ וָ/אֹמַ֗ר אֲדֹנָ֤/י יְהוִה֙ סְֽלַֽח נָ֔א מִ֥י יָק֖וּם יַֽעֲקֹ֑ב כִּ֥י קָטֹ֖ן הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/002.yaml
  text: And when it had finished eating the vegetation of the land[a], I said, “Lord GOD, please forgive! How can Jacob stand? For he is small.”
translation:
  language: hi
  text: और जब टिड्डियों का दल देश की वनस्पति खा चुका था, तब मैंने कहा, “हे प्रभु याहवे, कृपा करके क्षमा कीजिए! याकूब कैसे खड़ा रह सकेगा?[a] क्योंकि वह छोटा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याकूब को कौन खड़ा करेगा?”
    reason: מִי का सीधा अर्थ ‘कौन’ है, और קום को यहाँ पुनर्स्थापना अथवा खड़ा किए जाने के भाव में समझना भी संभव है।
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: और जब … तब
  rationale: यह पद दर्शन की अगली घटना बताता है; इस प्रसंग में אִם का अर्थ शर्तसूचक ‘यदि’ नहीं, बल्कि कालसूचक ‘जब’ है। हिंदी का ‘जब … तब’ स्वाभाविक कथा-प्रवाह देता है।
- source_word: כִּלָּה לֶאֱכוֹל
  choice: खा चुका
  rationale: כלה के साथ क्रिया का infinitive कार्य की पूर्णता व्यक्त करता है। पूर्णताबोधक ‘खा चुका’ इसी अर्थ को सहज हिंदी में रखता है।
- source_word: עֵשֶׂב הָאָרֶץ
  choice: देश की हरियाली
  rationale: עֵשֶׂב घास, वनस्पति या हरी उपज के व्यापक अर्थ में आ सकता है। ‘हरियाली’ कृषि-विनाश के प्रसंग में इस व्यापकता को बनाए रखता है, और הָאָרֶץ यहाँ इस्राएल के देश को सूचित करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: हे प्रभु यहोवा
  rationale: अमोस सीधे संबोधन में दोनों पदों का प्रयोग करता है। ‘प्रभु’ אֲדֹנָי को और ‘यहोवा’ वाचा के नाम יהוה को अलग-अलग सुरक्षित रखता है।
- source_word: סְלַח נָא
  choice: कृपा करके क्षमा कर
  rationale: נָא विनती की तात्कालिक और नम्र शक्ति रखता है; ‘कृपा करके’ इसे स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: מִי יָקוּם יַעֲקֹב
  choice: याकूब कैसे खड़ा रह सकेगा?
  rationale: शाब्दिक संरचना में ‘कौन’ है, पर प्रसंग में प्रश्न याकूब के न्याय के बाद टिके रहने या बचने की असमर्थता पर केंद्रित है। ‘खड़ा रह सकेगा’ קום की छवि और प्रश्न की अलंकारिक शक्ति दोनों बनाए रखता है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: मूल पाठ वाचा-समुदाय के लिए ‘याकूब’ नाम ही रखता है; इसे अर्थ खोलकर ‘इस्राएल’ नहीं किया गया।
- source_word: כִּי קָטֹן הוּא
  choice: क्योंकि वह छोटा है
  rationale: קָטֹן संख्या, शक्ति या महत्त्व की कमी को सूचित कर सकता है। ‘छोटा’ इस रूपक की व्यापकता को बिना संकुचित किए सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: हे प्रभु यहोवा
  alternative: हे प्रभु परमेश्वर
  rationale: मूल पाठ में उपाधि אֲדֹנָי और वाचा का नाम יהוה दोनों हैं। ‘प्रभु यहोवा’ दोनों को स्पष्ट रखता है और उन्हें एक ही सामान्य उपाधि में नहीं मिलाता।
- issue: מִי יָקוּם יַעֲקֹב का आशय
  choice: याकूब कैसे खड़ा रह सकेगा?
  alternative: याकूब को कौन खड़ा करेगा?
  rationale: मुख्य पाठ प्रसंगानुसार याकूब के टिके रहने की असमर्थता व्यक्त करता है। फिर भी व्याकरण का ‘कौन’ और קום का पुनः खड़ा करने वाला संभावित भाव वास्तविक अस्पष्टता है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दर्शन के पिछले संदर्भ में निहित कर्ता को स्पष्ट करने के लिए ‘टिड्डियों का दल’ कहा गया है। संबोधन में ‘हे’ और विनती में ‘कृपा करके’ भविष्यद्वक्ता की गंभीर मध्यस्थता को स्वाभाविक हिंदी में व्यक्त करते हैं।
