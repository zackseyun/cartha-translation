source:
  edition: WLC
  text: וַ/יַּ֤עַן עָמוֹס֙ וַ/יֹּ֣אמֶר אֶל אֲמַצְיָ֔ה לֹא נָבִ֣יא אָנֹ֔כִי וְ/לֹ֥א בֶן נָבִ֖יא אָנֹ֑כִי כִּֽי בוֹקֵ֥ר אָנֹ֖כִי וּ/בוֹלֵ֥ס שִׁקְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/014.yaml
  text: Then Amos answered and said to Amaziah[a], “I am not a prophet, nor am I a son of a prophet; rather[b], I am a herdsman and a dresser of sycamore figs.”
translation:
  language: hi
  text: तब आमोस ने अमस्याह को उत्तर देकर कहा, “मैं न तो नबी हूँ, न नबी का बेटा[a]; बल्कि मैं पशुपालक और गूलर के फलों को तैयार करनेवाला हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नबी का बेटा” किसी नबी का वास्तविक पुत्र होने के बजाय नबियों की मंडली या समुदाय का सदस्य होने का मुहावरा भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गूलर के फल” से सिकमोर-अंजीर के फल अभिप्रेत हैं। दुर्लभ हिब्रू शब्द का अर्थ सम्भवतः इन फलों को तैयार करना, या उन्हें पकने के लिए चीरना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: हिब्रू की संयुक्त कथात्मक उक्ति का स्वाभाविक आधुनिक हिन्दी रूप; ‘उत्तर देकर कहा’ सम्भव है, पर अनावश्यक रूप से भारी लगता है।
- source_word: לֹא נָבִיא אָנֹכִי
  choice: न मैं नबी हूँ
  rationale: स्पष्ट निषेध और אָנֹכִי के बल को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְלֹא בֶן נָבִיא אָנֹכִי
  choice: न नबी का बेटा
  rationale: हिब्रू मुहावरे को मुख्य पाठ में यथासम्भव सुरक्षित रखता है; इसका अर्थ किसी नबी-मंडली का सदस्य भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: כִּי
  choice: बल्कि
  rationale: दो निषेधों के बाद आनेवाले विरोधात्मक आत्म-वर्णन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בוֹקֵר
  choice: पशुपालक
  rationale: यह शब्द विशेषतः पशु-झुंड, सम्भवतः गाय-बैलों, की देखभाल करनेवाले को सूचित करता है; ‘चरवाहा’ इसे भेड़ों तक सीमित समझा जा सकता है।
- source_word: וּבוֹלֵס שִׁקְמִים
  choice: गूलर के फलों की देखभाल करनेवाला
  rationale: दुर्लभ क्रिया בולס के कृषि-संबंधी अर्थ को बिना यह निश्चित किए व्यक्त करता है कि काम विशेषतः फल चीरना, दबाना या अन्य प्रकार से तैयार करना था।
- source_word: שִׁקְמִים
  choice: गूलर के फल
  rationale: यह सिकमोर-फिग वृक्ष के फल को सूचित करता है; आधुनिक हिन्दी में ‘गूलर’ सामान्य पाठक के लिए अधिक बोधगम्य है।
theological_decisions:
- issue: क्या आमोस अपने नबी होने का पूर्ण निषेध करता है या केवल पेशेवर/मंडलीय नबी होने का
  choice: 'मुख्य पाठ में शाब्दिक तनाव सुरक्षित रखा गया है: ‘न मैं नबी हूँ, न नबी का बेटा।’'
  alternative: ‘मैं पेशेवर नबी नहीं हूँ और न किसी नबी-मंडली का सदस्य हूँ।’
  rationale: संदर्भ में आमोस परमेश्वर का वचन सुनाता है, फिर भी हिब्रू कथन सीधा निषेध करता है। व्याख्यात्मक विस्तार द्वारा इस तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न मैं… न…’ से मूल का बल और संतुलन बना रहता है। ‘गूलर’ भारतीय हिन्दी में परिचित वृक्ष-नाम है; तकनीकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
