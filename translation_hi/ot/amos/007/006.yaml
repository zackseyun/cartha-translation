  text: 'याहवे इस बात से भी पीछे हट गया: “यह भी नहीं होगा,” प्रभु याहवे ने कहा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात पर भी अपना मन बदल दिया”; यह इब्रानी की मानव-सदृश भाषा है, जो विनती के प्रति याहवे की प्रतिक्रिया का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִחַם
  choice: नरम पड़ा
  rationale: निफ़अल रूप यहाँ आमोस की विनती के प्रत्युत्तर में घोषित विपत्ति को रोक देने का भाव व्यक्त करता है। ‘नरम पड़ा’ आधुनिक हिन्दी में इस संबंधात्मक और मानव-सदृश अभिव्यक्ति को बनाए रखता है, बिना यह संकेत दिए कि परमेश्वर से कोई नैतिक भूल हुई थी।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: עַל זֹאת
  choice: इस बात पर
  rationale: यह वाक्यांश उस दर्शन में घोषित न्याय के विषय की ओर संकेत करता है; ‘इस बात पर’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: גַּם הִיא
  choice: यह भी
  rationale: स्त्रीलिंग सर्वनाम पूर्वोक्त विपत्ति की ओर लौटता है और גַּם का योगात्मक बल ‘भी’ से सुरक्षित रहता है।
- source_word: לֹא תִהְיֶה
  choice: नहीं होगा
  rationale: शाब्दिक ‘नहीं होगी’ के बजाय प्रसंग में अभिप्रेत घटना के न घटने को सहज हिन्दी में व्यक्त किया गया है; ‘यह’ को घोषित न्याय का समग्र संकेत मानकर सामान्य पुल्लिंग प्रयोग रखा गया है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: अदोनाय की उपाधि और याहवे के व्यक्तिगत नाम—दोनों को स्पष्ट रखते हुए इस संयुक्त संबोधन को पारदर्शी ढंग से प्रस्तुत किया गया है।
theological_decisions:
- issue: נִחַם में परमेश्वर के लिए मानव-सदृश संबंधात्मक भाषा
  choice: ‘नरम पड़ा’ कहकर परमेश्वर को भविष्यद्वक्ता की विनती का प्रत्युत्तर देते हुए प्रस्तुत किया गया है।
  alternative: ‘अपना मन बदल दिया’ या ‘दया की’
  rationale: मूल इब्रानी में उपस्थित धर्मवैचारिक तनाव को बनाए रखा गया है। अनुवाद न तो अभिव्यक्ति को सिद्धान्तात्मक व्याख्या से निष्प्रभावी करता है, न परमेश्वर की भूल या अज्ञान का अनावश्यक अर्थ जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। दिव्य नाम ‘याहवे’ को सुरक्षित रखा गया है और संयुक्त उपाधि אֲדֹנָי יְהוִה को ‘प्रभु याहवे’ किया गया है।
