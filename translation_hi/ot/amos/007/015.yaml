language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקָּחֵ֣/נִי יְהוָ֔ה מֵ/אַחֲרֵ֖י הַ/צֹּ֑אן וַ/יֹּ֤אמֶר אֵלַ/י֙ יְהוָ֔ה לֵ֥ךְ הִנָּבֵ֖א אֶל עַמִּ֥/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/015.yaml
  text: But Yahweh took me from following the flock[a], and Yahweh said to me, “Go[b], prophesy to my people Israel.”
translation:
  language: hi
  text: पर याहवे ने मुझे रेवड़ के पीछे-पीछे चलने से ले लिया[a], और याहवे ने मुझसे कहा, “जा, मेरी प्रजा इस्राएल की ओर भविष्यवाणी कर[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “रेवड़ के पीछे से।” यह इब्रानी मुहावरा रेवड़ के पीछे चलकर उसकी देखभाल करने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मेरी प्रजा इस्राएल की ओर” है। प्रसंग में संदेश में न्याय भी शामिल है, पर इस पद में स्पष्ट रूप से “विरुद्ध” नहीं कहा गया।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקָּחֵנִי
  choice: मुझे ... ले लिया
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। यह आमोस को उसके पहले काम से भविष्यद्वक्ता की सेवा में ले लिए जाने को सीधे ढंग से व्यक्त करता है, बिना बलपूर्वक पकड़ने का भाव जोड़े।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: מֵאַחֲרֵי הַצֹּאן
  choice: रेवड़ के पीछे से
  rationale: यह चयन इब्रानी के स्थानसूचक चरवाही-बिंब, शाब्दिक रूप से ‘रेवड़ के पीछे से’, को बनाए रखता है। ‘रेवड़ चराने से’ अधिक व्याख्यात्मक होता।
- source_word: הַצֹּאן
  choice: रेवड़
  rationale: צאן छोटे पालतू पशुओं—आम तौर पर भेड़-बकरियों—के समूह को सूचित कर सकता है; ‘रेवड़’ उसका स्वाभाविक हिन्दी सामूहिक रूप है।
- source_word: וַיֹּאמֶר אֵלַי
  choice: मुझसे कहा
  rationale: אמר + אל का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לֵךְ
  choice: जा
  rationale: הלך के आज्ञार्थक रूप की संक्षिप्तता और बुलाहट का आदेशात्मक बल सुरक्षित रहता है।
- source_word: הִנָּבֵא
  choice: भविष्यवाणी कर
  rationale: נבא के निफ़अल आज्ञार्थक रूप के लिए यह मानक, संक्षिप्त और सामान्य हिन्दी क्रिया है।
- source_word: אֶל עַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल के पास जाकर
  rationale: אֶל की सामान्य दिशात्मक शक्ति ‘की ओर/के पास’ को स्वाभाविक हिन्दी में व्यक्त किया गया है। इससे इस पद में अनुपस्थित ‘विरुद्ध’ का भाव नहीं जोड़ा जाता और ‘मेरी प्रजा’ का वाचाई संबंध भी बना रहता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है; अतः उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: इस्राएल की ओर भविष्यद्वाणी के आदेश का भाव
  choice: मेरी प्रजा इस्राएल के पास जाकर भविष्यवाणी कर
  alternative: मेरी प्रजा इस्राएल के विरुद्ध भविष्यवाणी कर
  rationale: אֶל सामान्यतः दिशा या संबोधन बताता है। व्यापक प्रसंग में न्याय का संदेश है, पर इस पद के शब्द स्वयं ‘विरुद्ध’ नहीं कहते; इसलिए उस तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। चरवाही का मूल बिंब ‘रेवड़ के पीछे’ सुरक्षित है; ‘के पास जाकर’ हिन्दी में दिशात्मक אֶל को स्वाभाविक बनाता है।
