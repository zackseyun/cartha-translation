base_translation:
  language: en
  yaml_path: translation/ot/amos/007/017.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘Your wife will prostitute herself in the city, and your sons and your daughters will fall by the sword, and your land will be divided by measuring line; and you yourself will die on unclean land[c][b], and Israel will surely go into exile from its land.’'
translation:
  language: hi
  text: 'इसलिए याहवे यों कहता है: “तेरी पत्नी नगर में वेश्यावृत्ति करेगी,[a] तेरे बेटे और तेरी बेटियाँ तलवार से मारे जाएँगे, तेरी भूमि नापने की डोरी से बाँटी जाएगी,[b] और तू स्वयं अशुद्ध भूमि पर मरेगा; इस्राएल अपनी भूमि से अवश्य निर्वासन में जाएगा।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक अनुवाद “वेश्या का काम करेगी” भी हो सकता है। मूल क्रिया यह नहीं बताती कि ऐसा स्वेच्छा से होगा या उस पर थोपा जाएगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “डोरी से बाँटी जाएगी”; यहाँ आशय विजित भूमि को नापकर अलग-अलग भागों में बाँटने से है।
    reason: lexical_alternative
  - marker: c
    text: “अवश्य निर्वासन में जाएगा” में इब्रानी की एक ही धातु के दोहरे प्रयोग का जोर व्यक्त किया गया है, जो कथन की निश्चितता पर बल देता है।
    reason: source_emphasis
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह अमस्याह के विरोध के फलस्वरूप आने वाले न्याय को प्रस्तुत करता है और इब्रानी के निष्कर्षसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है; ‘यों कहता है’ उसकी औपचारिक घोषणा को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תִּזְנֶה
  choice: वेश्यावृत्ति करेगी
  rationale: זנה के स्पष्ट यौन और सामाजिक अर्थ को नरम किए बिना आधुनिक हिन्दी में व्यक्त करता है; यह क्रिया के सक्रिय रूप को भी बनाए रखता है।
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: तेरे बेटे और तेरी बेटियाँ
  rationale: मूल पाठ में अलग-अलग उल्लिखित पुत्रों और पुत्रियों को सामान्य ‘सन्तान’ में नहीं समेटता।
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: तलवार से मारे जाएँगे
  rationale: इब्रानी मुहावरे ‘तलवार से गिरना’ का आशय युद्ध में हिंसक मृत्यु है; यह हिन्दी में अर्थ को स्पष्ट और गम्भीर रखता है।
- source_word: בַּחֶבֶל תְּחֻלָּק
  choice: नापने की डोरी से बाँटी जाएगी
  rationale: חֶבֶל यहाँ विजित भूमि को मापकर बाँटने की डोरी है; अनुवाद उपकरण और विभाजन दोनों को स्पष्ट करता है।
- source_word: וְאַתָּה
  choice: और तू स्वयं
  rationale: मूल में स्पष्ट सर्वनाम के जोर को ‘स्वयं’ द्वारा सुरक्षित रखता है।
- source_word: עַל אֲדָמָה טְמֵאָה
  choice: अशुद्ध भूमि पर
  rationale: ‘भूमि’ और ‘अशुद्ध’ को निकटता से रखकर विदेशी भूमि से जुड़े वाचाई तथा अनुष्ठानिक संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: גָּלֹה יִגְלֶה
  choice: अवश्य निर्वासन में जाएगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के जोर और निश्चितता को ‘अवश्य’ से व्यक्त करता है।
- source_word: מֵעַל אַדְמָתוֹ
  choice: अपनी भूमि से
  rationale: मूल के अलगाव-सूचक भाव को बिना अनावश्यक विस्तार के सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल के व्यक्तिगत वाचाई नाम को हिन्दी लिपि में प्रत्यक्ष रूप से प्रस्तुत करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ‘अशुद्ध भूमि’ का आशय
  choice: मूल अभिव्यक्ति ‘अशुद्ध भूमि’ को यथावत रखना
  alternative: विदेशी भूमि; अपवित्र देश
  rationale: सन्दर्भ निर्वासन और इस्राएल की भूमि से बाहर मृत्यु की ओर संकेत करता है, पर मुख्य पाठ में ‘विदेशी’ जोड़ना मूल की धार्मिक और वाचाई अर्थ-सम्भावना को सीमित कर देता।
- issue: אשתך ... תזנה में घोषित अपमान और विपत्ति
  choice: तेरी पत्नी नगर में वेश्यावृत्ति करेगी
  alternative: तेरी पत्नी नगर में वेश्या बन जाएगी; तेरी पत्नी से नगर में वेश्यावृत्ति कराई जाएगी
  rationale: मूल व्याकरण सक्रिय है और कारण या बाध्यता को स्पष्ट नहीं करता। इसलिए अनुवाद उस कठोर कथन को बनाए रखता है, पर बलपूर्वक कराए जाने की व्याख्या मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और न्याय-वाणी के अनुरूप कठोर रखी गई है। सम्बोधन की निकटता और तीव्रता के कारण एकवचन ‘तेरी/तेरे/तू’ प्रयुक्त है। अर्धविराम अंतिम दो परस्पर सम्बद्ध दण्ड-वाक्यों—अमस्याह की मृत्यु और इस्राएल के निर्वासन—को स्पष्ट रूप से जोड़ता है।
