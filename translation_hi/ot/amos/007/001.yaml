  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'देखो' की पुनरावृत्ति मूल की दर्शनात्मक तात्कालिकता बनाए रखती है। कृषि-संबंधी दुर्लभ शब्द לֶקֶשׁ के लिए संक्षिप्त मुख्य-पाठ और व्याख्यात्मक पादटिप्पणी का प्रयोग किया गया है।
