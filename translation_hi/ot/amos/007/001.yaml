  yaml_path: translation/ot/amos/007/001.yaml
  text: 'This is what the Lord GOD showed me: behold[a], he was forming locusts at the beginning of the spring crop''s coming up, and behold[b], it was the spring crop after the king''s mowings.'
translation:
  language: hi
  text: 'प्रभु यहोवा ने मुझे यह दिखाया: देखो, जब बाद की फसल उगनी शुरू ही हुई थी, तब वह टिड्डियों का झुंड रच रहा था। और देखो, वह राजा की कटाइयों के बाद की बाद की फसल[a] थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाद की फसल” का अर्थ पहली कटाई के बाद वसंत में उगने वाली बाद की वृद्धि या दूसरी फसल भी हो सकता है। “राजा की कटाइयाँ” संभवतः घास या चारे की वह पहली कटाई थीं जो राजा के हिस्से के रूप में ली जाती थीं।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כֹּה הִרְאַנִי
  choice: ने मुझे यह दिखाया
  rationale: दर्शन-वर्णन के सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और हिफ़ील रूप की कारणवाचक अनुभूति बनाए रखता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों दैवी पदों को अलग-अलग सुरक्षित रखता है और य्ह्व्ह को उसके व्यक्तिवाचक वाचा-नाम के रूप में प्रस्तुत करता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: दर्शन की जीवंत, आकस्मिक प्रस्तुति और पाठक का ध्यान खींचने वाला बल बनाए रखता है।
- source_word: יוֹצֵר
  choice: बना रहा था
  rationale: कृदंत की चल रही क्रिया को हिन्दी के अपूर्ण भूतकाल से व्यक्त करता है।
- source_word: גֹּבַי
  choice: टिड्डियाँ
  rationale: कृषि-विनाश के प्रसंग में झुंड बनाकर फसल खाने वाले कीटों का स्पष्ट और प्रचलित हिन्दी नाम है।
- source_word: בִּתְחִלַּת עֲלוֹת
  choice: उगनी शुरू ही हुई थी
  rationale: उपज के निकलने की आरम्भिक अवस्था और वाक्य के समय-संबंध दोनों को सहज हिन्दी में रखता है।
- source_word: הַלָּקֶשׁ / לֶקֶשׁ
  choice: पिछली उपज
  rationale: यह शब्द पहली कटाई के बाद होने वाली बाद की वृद्धि या फसल को सूचित करता है; 'पिछली उपज' उसकी कालानुक्रमिक विशेषता को बनाए रखता है, जबकि पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: גִּזֵּי הַמֶּלֶךְ
  choice: राजा की कटाई
  rationale: शाब्दिक रूप से काटने की क्रिया है और प्रसंग में राजा के हिस्से के लिए की गई पहली घास या चारे की कटाई को दर्शाता है।
theological_decisions:
- issue: संयुक्त दैवी उपाधि אֲדֹנָי יְהוִה का अनुवाद
  choice: प्रभु यहोवा
  alternative: प्रभु परमेश्वर
  rationale: मूल में उपाधि और दैवी व्यक्तिवाचक नाम दोनों उपस्थित हैं। 'प्रभु यहोवा' इस भेद को बनाए रखता है और नाम को सामान्य पदवी में नहीं बदलता।
- issue: टिड्डियाँ बनाने वाले कर्ता की पहचान
  choice: वह टिड्डियाँ बना रहा था
  alternative: टिड्डियाँ बन रही थीं
  rationale: मसोरेटिक पाठ का पुल्लिंग एकवचन कृदंत दैवी कर्ता की ओर संकेत करता है; इसलिए उसे अस्पष्ट निष्क्रिय रूप में नहीं बदला गया।
