reference: Amos 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָשַׁ֨מּוּ֙ בָּמ֣וֹת יִשְׂחָ֔ק וּ/מִקְדְּשֵׁ֥י יִשְׂרָאֵ֖ל יֶחֱרָ֑בוּ וְ/קַמְתִּ֛י עַל בֵּ֥ית יָרָבְעָ֖ם בֶּ/חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/007/009.yaml
  text: The high places of Isaac will be made desolate[a], and the sanctuaries of Israel will be laid waste[c][b]; and I will rise against the house of Jeroboam with the sword.
translation:
  language: hi
  text: इसहाक के ऊँचे स्थान उजाड़ हो जाएँगे[a], और इस्राएल के पवित्र-स्थान खंडहर हो जाएँगे; और मैं यारोबाम के घराने के विरुद्ध तलवार से उठ खड़ा होऊँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजाड़ कर दिए जाएँगे।”
    reason: इब्रानी निफ़अल क्रिया उजाड़ हो जाने अथवा उजाड़ कर दिए जाने की अर्थ-छाया दे सकती है।
  - marker: c
    text: या, “तलवार के द्वारा।”
    reason: בֶּחָרֶב साधनात्मक पद है; ‘तलवार से’ और ‘तलवार के द्वारा’ दोनों सम्भव हिन्दी रूप हैं।
lexical_decisions:
- source_word: וְנָשַׁמּוּ
  choice: उजाड़ हो जाएँगे
  rationale: निफ़अल रूप का परिणामसूचक अर्थ—उजाड़ हो जाना—स्वाभाविक हिन्दी में व्यक्त होता है और कर्मवाच्य तथा अवस्थापरिवर्तन के बीच मूल की संभावित अर्थ-छाया को खुला रखता है।
- source_word: בָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह पूजा के लिए प्रयुक्त ऊँचे स्थलों का पारंपरिक और स्रोत-संगत पद है।
- source_word: יִשְׂחָק
  choice: इसहाक
  rationale: मूल पाठ में आया व्यक्तिवाचक नाम सुरक्षित रखा गया है; यहाँ यह उत्तरी वाचा-समुदाय के लिए काव्यात्मक संकेत है।
- source_word: וּמִקְדְּשֵׁי
  choice: और ... के पवित्र-स्थान
  rationale: מקדשׁ के धार्मिक और उपासना-संबंधी अर्थ को स्पष्ट रखता है; योजक 'और' भी सुरक्षित है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल नाम को रखा गया है; प्रसंग में इसका संकेत उत्तरी राज्य की ओर है।
- source_word: יֶחֱרָבוּ
  choice: खंडहर हो जाएँगे
  rationale: חרב की उजड़ने या नष्ट होकर खंडहर बनने की तीव्रता व्यक्त करता है और पहली पंक्ति की हूबहू पुनरावृत्ति से बचते हुए समानांतरता बनाए रखता है।
- source_word: וְקַמְתִּי עַל
  choice: और मैं ... के विरुद्ध ... उठ खड़ा होऊँगा
  rationale: קום עם על में निहित सक्रिय, विरोधी और न्यायकारी मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּית יָרָבְעָם
  choice: यारोबाम का घराना
  rationale: בית का वंशीय/राजघराने वाला आशय पाठ में सहज रूप से व्यक्त होता है, बिना इसे केवल 'राजवंश' तक सीमित किए।
- source_word: בֶּחָרֶב
  choice: तलवार लेकर
  rationale: हिंसक न्याय के साधन को दर्शाता है और 'उठ खड़ा होऊँगा' के साथ स्वाभाविक हिन्दी बनाता है; शाब्दिक विकल्प 'तलवार से' भी संभव है।
theological_decisions:
- issue: '''इसहाक'' का संदर्भ'
  choice: मुख्य पाठ में 'इसहाक' बनाए रखना, जो यहाँ उत्तरी लोगों/प्रदेश का काव्यात्मक नाम है।
  alternative: स्पष्टता के लिए इसे 'इस्राएल' कर देना।
  rationale: इब्रानी पाठ जानबूझकर 'इसहाक' कहता है; उसे 'इस्राएल' से बदलना साहित्यिक और वाचागत संकेत को मिटा देगा।
- issue: '''मैं ... के विरुद्ध ... उठ खड़ा होऊँगा'' में परमेश्वर की क्रिया'
  choice: प्रत्यक्ष ईश्वरीय विरोध और न्याय के रूप में अनुवाद।
  alternative: कम तीव्र 'मैं ... के विरुद्ध कार्रवाई करूँगा।'
  rationale: मूल वाक्य न्यायिक-सैन्य छवि में परमेश्वर को स्वयं यारोबाम के घराने के विरुद्ध खड़ा दिखाता है; हल्का अनुवाद इसकी शक्ति घटाता।
- issue: בֶּחָרֶב का संबंध और साधनात्मक अर्थ
  choice: इसे अंतिम खंड में परमेश्वर के यारोबाम के घराने के विरुद्ध उठने के साधन—'तलवार लेकर'—के रूप में जोड़ा गया है।
  alternative: इसे 'तलवार से' अनूदित करना।
  rationale: इब्रानी पदक्रम अंतिम खंड से इसका सीधा संबंध दिखाता है। अर्थ युद्ध अथवा हिंसक दंड के साधन का है; दोनों हिन्दी रूप संभव हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। 'ऊँचे स्थान' और 'पवित्र-स्थान' उपासना-संबंधी शब्दावली को बनाए रखते हैं; 'घराना' בית के वंशीय आशय को सहज हिन्दी में व्यक्त करता है।
