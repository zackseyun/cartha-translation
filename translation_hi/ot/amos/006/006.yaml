  text: הַ/שֹּׁתִ֤ים בְּ/מִזְרְקֵי֙ יַ֔יִן וְ/רֵאשִׁ֥ית שְׁמָנִ֖ים יִמְשָׁ֑חוּ וְ/לֹ֥א נֶחְל֖וּ עַל שֵׁ֥בֶר יוֹסֵֽף־
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/006.yaml
  text: who drink wine from bowls and anoint themselves with the finest oils[b][a], but are not grieved over the ruin of Joseph—
translation:
  language: hi
  text: जो कटोरों से दाखमधु पीते हैं और सबसे उत्तम तेल अपने शरीर पर मलते हैं[a], परन्तु यूसुफ के विनाश पर शोक नहीं करते[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबसे चुने हुए तेल’; शाब्दिक अर्थ, ‘तेलों के प्रथम अंश।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘यूसुफ’ काव्यात्मक रूप से इस्राएल के लोगों, विशेषकर उत्तरी राज्य, को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׁתִים
  choice: जो ... पीते हैं
  rationale: निश्चित उपपद सहित कृदन्त पिछले पद से चल रहे धिक्कार-वर्णन को आगे बढ़ाता है; हिन्दी में सम्बन्धवाचक रचना स्वाभाविक है।
- source_word: בְּמִזְרְקֵי יַיִן
  choice: कटोरों से दाखमधु
  rationale: מִזְרָק बड़े कटोरे अथवा पात्र को दर्शाता है; ‘कटोरों से’ ऐश्वर्यपूर्ण और अतिशय पान की मूल छवि को बनाए रखता है।
- source_word: וְרֵאשִׁית שְׁמָנִים
  choice: उत्तम-से-उत्तम तेलों
  rationale: רֵאשִׁית का शाब्दिक अर्थ ‘पहला/मुख्य अंश’ है और यहाँ श्रेष्ठतम तेलों का भाव देता है; यह चयन हिन्दी में स्वाभाविक रहते हुए विलासिता व्यक्त करता है।
- source_word: יִמְשָׁחוּ
  choice: अपना अभिषेक करते हैं
  rationale: משׁח का सामान्य अर्थ अभिषेक करना है। यहाँ कर्मकाण्डीय प्रतिष्ठापन नहीं, बल्कि शरीर पर विलासपूर्ण ढंग से तेल लगाने का भाव है; ‘अपना’ प्रतिवर्ती आशय स्पष्ट करता है।
- source_word: וְלֹא נֶחְלוּ
  choice: परन्तु ... शोक नहीं करते
  rationale: חלה का निफ़अल रूप दुःख से व्यथित या पीड़ित होने का भाव दे सकता है। ‘शोक नहीं करते’ प्रसंग के नैतिक-भावनात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל שֵׁבֶר יוֹסֵף
  choice: यूसुफ के विनाश पर
  rationale: שֵׁבֶר मूलतः टूटने या दरार का बोध देता है और विस्तृत अर्थ में विपत्ति, पतन या विनाश को सूचित करता है; ‘विनाश’ भविष्यद्वाणी के गंभीर भाव को बनाए रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: मूल पाठ के व्यक्तिवाचक नाम को बनाए रखने से काव्यात्मक और वाचा-संबंधी संकेत सुरक्षित रहता है; उसका सामूहिक सन्दर्भ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘यूसुफ’ का लाक्षणिक प्रयोग
  choice: मुख्य पाठ में ‘यूसुफ’ को बनाए रखा गया है, जो काव्यात्मक रूप से इस्राएल के लोगों, विशेषकर उत्तरी राज्य, को दर्शाता है।
  alternative: मुख्य पाठ में व्याख्यात्मक रूप से ‘इस्राएल’ या ‘यूसुफ का घराना’ लिखना।
  rationale: नाम को ज्यों का त्यों रखने से स्रोत-पाठ की भविष्यद्वाणीपूर्ण छवि और गोत्रीय-वाचागत अनुगूँज सुरक्षित रहती है तथा मुख्य पाठ अनावश्यक रूप से व्याख्यात्मक नहीं बनता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘दाखमधु’ और ‘अभिषेक’ बाइबलीय साहित्यिक गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी है। दोनों पादटिप्पणी-चिह्न सम्बद्ध पदांशों के तुरन्त बाद रखे गए हैं।
