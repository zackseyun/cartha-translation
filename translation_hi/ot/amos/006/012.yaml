id: AMO.6.12
reference: Amos 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/יְרֻצ֤וּ/ן בַּ/סֶּ֨לַע֙ סוּסִ֔ים אִֽם יַחֲר֖וֹשׁ בַּ/בְּקָרִ֑ים כִּֽי הֲפַכְתֶּ֤ם לְ/רֹאשׁ֙ מִשְׁפָּ֔ט וּ/פְרִ֥י צְדָקָ֖ה לְ/לַעֲנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/012.yaml
  text: Do horses run on rock? Does one plow there with oxen? Yet you have turned justice into poison[c][b][a], and the fruit of righteousness into wormwood.
translation:
  language: hi
  text: क्या घोड़े चट्टान पर दौड़ते हैं? क्या कोई वहाँ बैलों से हल चलाता है? फिर भी तुमने न्याय को विष[a] और धार्मिकता के फल को नागदौना[b][c] बना दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विष’ के स्थान पर ‘कड़वा विषैला पौधा’ भी सम्भव; इब्रानी शब्द רֹאשׁ किसी कड़वे या विषैले पदार्थ अथवा पौधे को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: नागदौना बहुत कड़वा पौधा है; यहाँ वह नैतिक भ्रष्टता और उसके कटु परिणाम का रूपक है।
    reason: cultural_note
  - marker: c
    text: ‘धार्मिकता के फल’ का अनुवाद ‘न्यायपरायणता के फल’ भी हो सकता है; इब्रानी צְדָקָה में नैतिक और न्यायिक, दोनों अर्थ-छायाएँ हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְרֻצוּן
  choice: क्या ... दौड़ते हैं
  rationale: अपूर्ण रूप यहाँ असंगति को उभारने वाला आलंकारिक प्रश्न है; हिन्दी का सामान्य वर्तमानकाल इसकी कहावतनुमा शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּסֶּלַע
  choice: चट्टान पर
  rationale: סֶלַע का अर्थ चट्टान या शैल है; प्रसंग में सामान्यतः कठोर, पथरीली सतह अभिप्रेत है।
- source_word: אִם יַחֲרוֹשׁ בַּבְּקָרִים
  choice: क्या कोई वहाँ बैलों से हल चलाता है
  rationale: אִם यहाँ शर्त नहीं, बल्कि समानांतर आलंकारिक प्रश्न आरम्भ करता है। हल चलाने के प्रसंग में בָּקָר के लिए ‘बैल’ स्वाभाविक है; ‘वहाँ’ निहित स्थान-संदर्भ को स्पष्ट करता है।
- source_word: כִּי
  choice: फिर भी
  rationale: यह संयोजक पिछले असंभव कार्यों और लोगों के विकृत आचरण के बीच तीखा विरोध प्रकट करता है।
- source_word: הֲפַכְתֶּם
  choice: तुमने ... बना दिया है
  rationale: द्वितीय पुरुष बहुवचन पूर्ण क्रिया सीधे आरोप और उसके वर्तमान परिणाम को व्यक्त करती है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: भविष्यद्वक्ताओं के सामाजिक और न्यायिक प्रसंग में यह सार्वजनिक न्याय का बोध कराता है।
- source_word: לְרֹאשׁ
  choice: विष
  rationale: רֹאשׁ किसी कड़वे अथवा विषैले पदार्थ या पौधे को सूचित कर सकता है; आधुनिक हिन्दी में ‘विष’ रूपक की घातकता स्पष्ट रखता है।
- source_word: וּפְרִי צְדָקָה
  choice: और धार्मिकता के फल को
  rationale: रचना के फल-रूपक को बनाए रखते हुए צְדָקָה के नैतिक अर्थ के लिए ‘धार्मिकता’ चुना गया है; इसके न्यायपरक अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: לְלַעֲנָה
  choice: नागदौना
  rationale: לַעֲנָה एक अत्यन्त कड़वा पौधा है; ‘नागदौना’ ठोस वनस्पति-चित्र को बनाए रखता है, जबकि पादटिप्पणी रूपक समझाती है।
theological_decisions:
- issue: צְדָקָה का नैतिक अथवा न्यायिक अर्थ
  choice: धार्मिकता
  alternative: न्यायपरायणता / न्याय
  rationale: מִשְׁפָּט के साथ समानांतरता न्यायिक छाया देती है, पर צְדָקָה का व्यापक नैतिक अर्थ भी वास्तविक है। मुख्य पाठ में ‘धार्मिकता’ और पादटिप्पणी में विकल्प रखकर तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। दो छोटे आलंकारिक प्रश्न मूल की तीक्ष्णता बनाए रखते हैं। ‘चट्टान’, ‘विष’ और ‘नागदौना’ जैसे ठोस चित्र सुरक्षित रखे गए हैं; दुर्लभ वनस्पति-संज्ञा की व्याख्या पादटिप्पणी में दी गई है।
