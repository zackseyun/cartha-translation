id: AMO.6.11
reference: Amos 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה יְהוָה֙ מְצַוֶּ֔ה וְ/הִכָּ֛ה הַ/בַּ֥יִת הַ/גָּד֖וֹל רְסִיסִ֑ים וְ/הַ/בַּ֥יִת הַ/קָּטֹ֖ן בְּקִעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/011.yaml
  text: For behold[a], Yahweh commands, and the great house will be struck into fragments, and the small house into pieces.
translation:
  language: hi
  text: क्योंकि देखो, याहवे आज्ञा देता है, और बड़े घर को चूर-चूर कर दिया जाएगा[a], और छोटे घर में दरारें डाल दी जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और वह बड़े घर को टुकड़ों में, और छोटे घर को दरारों में मारेगा।” ‘दरारों’ का अर्थ ‘टूटे हुए टुकड़े’ भी हो सकता है।'
    reason: इब्रानी क्रिया कर्तृवाच्य, तृतीय पुरुष पुल्लिंग एकवचन है; मुख्य पाठ का कर्मवाच्य प्रहार करने वाले को अनिर्दिष्ट रखता है। अंतिम संज्ञा के अर्थ में ‘दरारें/फटन’ और ‘टूटे हुए टुकड़े’ दोनों संभावित हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आगे आने वाली घोषणा की ओर जीवंत ढंग से ध्यान खींचता है और आधुनिक हिन्दी में भविष्यद्वक्ताई बल बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: מְצַוֶּה
  choice: आज्ञा देता है
  rationale: कर्तृवाचक कृदन्त यहाँ याहवे की निकटवर्ती और अधिकारपूर्ण आज्ञा को व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְהִכָּה
  choice: प्रहार किया जाएगा
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर प्रहार करने वाला तात्कालिक वाक्य-विन्यास में स्पष्ट रूप से निर्दिष्ट नहीं है। भाववाच्य हिन्दी इस अस्पष्टता को बनाए रखती है, जबकि न्याय का परिणाम स्पष्ट करती है।
- source_word: הַבַּיִת הַגָּדוֹל
  choice: बड़ा घर
  rationale: ‘घर’ मूल संज्ञा को बनाए रखता है; ‘बड़ा’ आकार और संभव सामाजिक प्रतिष्ठा, दोनों की संभावना खुली रखता है।
- source_word: רְסִיסִים
  choice: चूर-चूर
  rationale: यह हिंसक रूप से बहुत छोटे टुकड़ों में टूटने का भाव स्पष्ट, सजीव और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבַּיִת הַקָּטֹן
  choice: छोटा घर
  rationale: यह ‘बड़े घर’ के साथ मूल समानांतरता को सीधे बनाए रखता है।
- source_word: בְּקִעִים
  choice: दरारें
  rationale: यह शब्द फटने, चिरने या दरारों को सूचित कर सकता है। ‘दरारें’ पहले घर के पूर्णतः चूर होने और दूसरे के फटने के बीच मूल काव्यात्मक भेद को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में विशिष्ट नाम य्ह्व्ह है; ‘याहवे’ उसे उपाधि में बदले बिना पहचान योग्य रूप में प्रस्तुत करता है।
- issue: וְהִכָּה में प्रहार का कर्ता
  choice: भाववाच्य—‘प्रहार किया जाएगा’
  alternative: ‘वह बड़े घर पर प्रहार करेगा’
  rationale: व्याकरण में क्रिया तृतीय पुरुष पुल्लिंग एकवचन है, किंतु आज्ञा देने वाले याहवे और आज्ञा का पालन करने वाले संभावित प्रहारकर्ता के बीच संबंध स्पष्ट नहीं किया गया। भाववाच्य न्याय के ईश्वरीय आदेश को बनाए रखते हुए तत्काल कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देखो’ भविष्यद्वक्ताई ध्यान-सूचक बल देता है। दो घरों के विनाश की भिन्न छवियाँ—चूर-चूर होना और दरारें पड़ना—सुरक्षित रखी गई हैं।
