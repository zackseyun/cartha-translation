  text: those who lie on beds of ivory and sprawl on their couches[b][a], and eat lambs from the flock and calves from the stall—
translation:
  language: hi
  text: जो हाथीदाँत के पलंगों पर लेटते और अपने दीवानों पर पसरते हैं,[a] और झुंड में से मेमने और बाड़े में से[b] बछड़े खाते हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने दीवानों पर तनकर पड़े रहते हैं।”
    reason: lexical_alternative
  - marker: b
    text: “बाड़े में से” का अनुवाद “मोटा करने के बाड़े में से” भी हो सकता है; इससे विलासी भोजन के लिए विशेष रूप से पाले गए पशुओं पर बल पड़ता है।
    reason: lexical_alternative
