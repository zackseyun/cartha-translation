- source_word: עַל עַרְשׂוֹתָם
  choice: अपने दीवानों पर
  rationale: עֶרֶשׂ पलंग या आसननुमा शय्या हो सकता है; ‘दीवान’ पहले आए ‘पलंगों’ से शब्दगत भेद रखते हुए भोज-विलास का दृश्य व्यक्त करता है।
- source_word: וְאֹכְלִים
