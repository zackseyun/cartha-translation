- source_word: כָּרִים
  choice: मेमने
  rationale: शब्द युवा भेड़ों, सम्भवतः भोज के लिए चुने पशुओं, को दर्शाता है; ‘मेमने’ स्पष्ट और प्रचलित समतुल्य है।
- source_word: מִצֹּאן
  choice: झुंड में से
  rationale: स्रोत के उस चित्र को बनाए रखता है जिसमें पशु झुंड से चुनकर लिया जाता है।
- source_word: וַעֲגָלִים
  choice: और ... बछड़े
  rationale: यह मूल शब्द का सीधा, स्वाभाविक हिन्दी समतुल्य है।
- source_word: מִתּוֹךְ מַרְבֵּק
  choice: बाड़े में से
  rationale: מַרְבֵּק पशुओं को रखने और सम्भवतः मोटा करने के स्थान को दर्शाता है; मुख्य पाठ में संक्षिप्त ‘बाड़े’ रखा गया और मोटा किए जाने की सम्भावना टिप्पणी में दी गई है।
