  text: נִשְׁבַּע֩ אֲדֹנָ֨/י יְהוִ֜ה בְּ/נַפְשׁ֗/וֹ נְאֻם יְהוָה֙ אֱלֹהֵ֣י צְבָא֔וֹת מְתָאֵ֤ב אָֽנֹכִי֙ אֶת גְּא֣וֹן יַֽעֲקֹ֔ב וְ/אַרְמְנֹתָ֖י/ו שָׂנֵ֑אתִי וְ/הִסְגַּרְתִּ֖י עִ֥יר וּ/מְלֹאָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/008.yaml
  text: 'The Lord GOD has sworn by himself—oracle of Yahweh[a], the God of Armies: I abhor the pride of Jacob, and I hate his citadels[c][b]; and I will hand over the city and all that fills it.'
translation:
  language: hi
  text: 'प्रभु यहोवा ने अपनी ही शपथ खाई है—सेनाओं के परमेश्वर यहोवा की वाणी है: “मैं याकूब के घमंड[a] से घृणा करता हूँ और उसके गढ़ों[b] से नफ़रत करता हूँ; मैं नगर और उसमें जो कुछ है, सबको सौंप दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याकूब का वैभव।” इब्रानी शब्द घमंड या वैभव—दोनों का बोध करा सकता है; यहाँ न्याय का प्रसंग नकारात्मक अर्थ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके राजमहल।” इब्रानी शब्द राजसी और किलाबंद भवनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: संयुक्त ईश्वरीय उपाधि में אֲדֹנָי को ‘प्रभु’ और वाचा के नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: נִשְׁבַּע ... בְּנַפְשׁוֹ
  choice: अपनी ही शपथ खाई है
  rationale: शाब्दिक ‘अपने प्राण की शपथ’ का भाव स्वयं को साक्षी बनाकर शपथ खाना है; यह हिन्दी में उसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְאֻם יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: सेनाओं के परमेश्वर यहोवा की वाणी है
  rationale: נְאֻם की भविष्यवाणी-सूचक औपचारिकता ‘की वाणी है’ से और צְבָאוֹת का सैन्य बिंब ‘सेनाओं’ से सुरक्षित रहता है।
- source_word: מְתָאֵב
  choice: घृणा करता हूँ
  rationale: यह कृदन्त तीव्र वितृष्णा और स्थायी रुख व्यक्त करता है; आधुनिक हिन्दी में ‘घृणा’ सशक्त और गरिमापूर्ण है।
- source_word: גְּאוֹן יַעֲקֹב
  choice: याकूब का घमण्ड
  rationale: न्याय के प्रसंग में גָּאוֹן का नकारात्मक अर्थ ‘घमण्ड’ सर्वाधिक उपयुक्त है; ‘याकूब’ इस्राएल के लिए सामूहिक नाम है।
- source_word: אַרְמְנֹתָיו
  choice: उसके गढ़
  rationale: אַרְמוֹן राजमहल के साथ किलाबन्द सामर्थ्य-केंद्र का भी बोध करा सकता है; ‘गढ़’ इस न्याय-वचन में रक्षात्मक शक्ति को स्पष्ट रखता है।
- source_word: שָׂנֵאתִי
  choice: नफ़रत करता हूँ
  rationale: पूर्ण क्रिया यहाँ यहोवा के दृढ़ और स्थापित रुख को बताती है; वर्तमानकालीन हिन्दी सीधी वाणी का बल बनाए रखती है।
- source_word: וְהִסְגַּרְתִּי
  choice: मैं ... शत्रु के हाथ सौंप दूँगा
  rationale: सन्दर्भ में הפעיל रूप का अर्थ किसी अन्य की सत्ता में दे देना है। हिन्दी में अपेक्षित आशय स्पष्ट करने के लिए ‘शत्रु के हाथ’ जोड़ा गया है।
- source_word: עִיר וּמְלֹאָהּ
  choice: नगर और उसमें जो कुछ है, सबको
  rationale: מְלֹא शहर को भरने वाले उसके लोगों, सम्पत्ति और समस्त सामग्री को समेटता है; यह रूप सहज हिन्दी में उसकी व्यापकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को केवल ‘प्रभु’ बनाकर विलीन नहीं किया गया; हिन्दी पाठकों के बीच परिचित रूप ‘यहोवा’ चुना गया है।
- issue: גְּאוֹן יַעֲקֹב का अर्थ
  choice: याकूब का घमण्ड
  alternative: याकूब का वैभव
  rationale: घृणा और दण्ड के निकट प्रसंग में नकारात्मक अर्थ अधिक सम्भावित है, पर शब्द के सकारात्मक ‘वैभव/महिमा’ अर्थ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: וְהִסְגַּרְתִּי में सम्बन्ध
  choice: और/अर्धविराम द्वारा क्रम
  alternative: इसलिए मैं सौंप दूँगा
  rationale: मूल में साधारण וְ है; स्पष्ट कारणसूचक ‘इसलिए’ जोड़ने के बजाय कथनों का क्रम बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष ईश्वरीय वाणी को उद्धरण-चिह्नों में रखा गया है। ‘घृणा’ और ‘नफ़रत’ का क्रम मूल की दो भिन्न किन्तु निकटवर्ती तीव्र क्रियाओं को स्वाभाविक हिन्दी में अलग पहचान देता है।
