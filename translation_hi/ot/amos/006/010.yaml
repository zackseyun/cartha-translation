base_translation:
  language: en
  yaml_path: translation/ot/amos/006/010.yaml
  text: Then his uncle[a], the one who burns him, will carry him out to bring the bones out of the house, and he will say to the one who is in the innermost part of the house, “Is there still anyone with you?” And he will say, “No one.” Then he will say[c][b], “Hush! For we must not mention the name of Yahweh.”
translation:
  language: hi
  text: तब उसका चाचा[a]—जो उसे जलाने वाला है[b]—उसे उठाकर घर से हड्डियाँ बाहर निकालने के लिए ले जाएगा। वह जो घर के सबसे भीतरी भाग में है, उससे पूछेगा, “क्या तुम्हारे साथ अब भी कोई है?” वह उत्तर देगा, “कोई नहीं।” तब वह कहेगा, “चुप! क्योंकि हमें याहवे का नाम नहीं लेना चाहिए।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका कुटुम्बी”; इब्रानी शब्द किसी निकट पुरुष संबंधी को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “जो उसे जलाता है।” यह असामान्य अभिव्यक्ति न्याय के समय शवों को जलाकर हटाने से संबंधित हो सकती है।
    reason: cultural_note
  - marker: c
    text: इस संक्षिप्त इब्रानी कथन को “याहवे का नाम मत लेना” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: उसका चाचा
  rationale: शव हटाने और पारिवारिक दायित्व के संदर्भ में यह शब्द निकट पुरुष संबंधी, विशेषतः ‘चाचा’, का बोध कराता है; फिर भी व्यापक अर्थ ‘कुटुम्बी’ संभव है, इसलिए पादटिप्पणी दी गई है।
- source_word: וּמְסָרְפוֹ
  choice: जो उसे जलाने वाला है
  rationale: שׂרף का स्पष्ट अर्थ ‘जलाना’ है। इस्राएली शव-संस्कार की सामान्य रीति में दाह असामान्य होने पर भी, न्याय के इस दृश्य की कठिन और विचित्र शब्दावली को सामान्य ‘अंत्येष्टि करने वाला’ बनाकर सरल नहीं किया गया।
- source_word: לְהוֹצִיא עֲצָמִים
  choice: हड्डियाँ बाहर निकालने के लिए
  rationale: עֲצָמִים का ठोस अर्थ ‘हड्डियाँ’ है; ‘अवशेष’ अधिक सहज होता, पर मूल बिंब को कम स्पष्ट कर देता।
- source_word: בְּיַרְכְּתֵי הַבַּיִת
  choice: घर के सबसे भीतरी भाग में
  rationale: यह पद घर के दूरस्थ, अंदरूनी कोने या भाग को दर्शाता है; यह हिंदी अभिव्यक्ति स्थानगत अर्थ को स्वाभाविक रूप से संप्रेषित करती है।
- source_word: הַעוֹד עִמָּךְ
  choice: क्या तुम्हारे साथ अब भी कोई है?
  rationale: प्रश्न यह जानना चाहता है कि कोई और व्यक्ति बचा या उपस्थित है या नहीं; ‘कोई’ जोड़ना हिंदी में आवश्यक और स्वाभाविक है।
- source_word: אָפֶס
  choice: कोई नहीं
  rationale: यहाँ यह शब्द संक्षिप्त उत्तर के रूप में किसी के न बचे होने को व्यक्त करता है।
- source_word: הָס
  choice: चुप!
  rationale: यह अचानक मौन रहने की आज्ञा देने वाला उद्गार है; ‘चुप!’ उसकी संक्षिप्तता और भयपूर्ण तात्कालिकता बनाए रखता है।
- source_word: לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה
  choice: हमें यहोवा का नाम नहीं लेना चाहिए
  rationale: इन्फिनिटिव वाला यह संक्षिप्त वाक्य निषेध अथवा बाध्यता व्यक्त कर सकता है। चुना गया रूप स्वाभाविक हिंदी में निषेध रखता है, पर उसके कारण की व्याख्या नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में बनाए रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और मूल में उपस्थित नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: כִּי לֹא לְהַזְכִּיר בְּשֵׁם יְהוָה में निषेध का बल
  choice: क्योंकि हमें यहोवा का नाम नहीं लेना चाहिए
  alternative: यहोवा का नाम मत लेना; क्योंकि यहोवा का नाम नहीं लिया जाना चाहिए
  rationale: इब्रानी कथन संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है। चुना गया रूप आवश्यकता/निषेध का भाव रखता है, पर यह नहीं बताता कि नाम क्यों नहीं लेना चाहिए; इस प्रकार भयपूर्ण प्रसंग का धार्मिक तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शव और हड्डियों का कठोर बिंब मूल के अनुसार सुरक्षित है। संवाद को सहज हिंदी में रखा गया है, जबकि ‘जलाने वाला’ और अंतिम निषेध की वास्तविक अस्पष्टता पादटिप्पणियों में बनाए रखी गई है।
