id: AMO.6.2
reference: Amos 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עִבְר֤וּ כַֽלְנֵה֙ וּ/רְא֔וּ וּ/לְכ֥וּ מִ/שָּׁ֖ם חֲמַ֣ת רַבָּ֑ה וּ/רְד֣וּ גַת פְּלִשְׁתּ֗ים הֲ/טוֹבִים֙ מִן הַ/מַּמְלָכ֣וֹת הָ/אֵ֔לֶּה אִם רַ֥ב גְּבוּלָ֖/ם מִ/גְּבֻלְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/002.yaml
  text: Cross over to Calneh and see[a]; and from there go to Hamath the great; then go down to Gath of the Philistines[b]. Are they better than these kingdoms? Or is their territory greater than your territory?
translation:
  language: hi
  text: कलनेह[a] होकर जाओ और देखो; और वहाँ से महान नगर हमात को जाओ; फिर पलिश्तियों के गत नगर में उतर जाओ। क्या वे इन राज्यों से बेहतर हैं?[b] या उनका क्षेत्र तुम्हारे क्षेत्र से बड़ा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कलनेह एक स्थान का नाम है। कुछ लोग इसे उत्तरी सीरिया या मेसोपोटामिया के किसी नगर से जोड़ते हैं, पर इसकी पहचान निश्चित नहीं है।
    reason: cultural_note
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “क्या तुम इन राज्यों से बेहतर हो?” इब्रानी में ‘बेहतर’ का कर्ता स्पष्ट रूप से नहीं दिया गया है; इसलिए यह तुलना बताए गए नगरों या सम्बोधित लोगों से समझी जा सकती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עִבְרוּ
  choice: पार जाकर
  rationale: यह עבר के बहुवचन आज्ञार्थक रूप की पार जाने की दिशात्मकता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כַּלְנֵה
  choice: कलनेह
  rationale: अनिश्चित पहचान वाले स्थान-नाम का अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: וּרְאוּ
  choice: देखो
  rationale: ראה के आज्ञार्थक रूप का सीधा और स्वाभाविक अनुवाद, जो निरीक्षण करने के आलंकारिक आह्वान को व्यक्त करता है।
- source_word: וּלְכוּ מִשָּׁם
  choice: और वहाँ से ... जाओ
  rationale: संयोजक और स्थानवाचक पद दोनों को रखते हुए आदेशों का क्रम स्पष्ट किया गया है।
- source_word: חֲמַת רַבָּה
  choice: महान हमात
  rationale: स्थान-नाम हमात को लिप्यंतरित किया गया और רַבָּה का अर्थ ‘महान’ स्पष्ट रूप से रखा गया है।
- source_word: וּרְדוּ
  choice: फिर ... उतर जाओ
  rationale: ירד की भौगोलिक रूप से नीचे जाने की धारणा को ‘उतर जाओ’ से रखा गया; ‘फिर’ आदेशों का क्रम स्वाभाविक बनाता है।
- source_word: גַּת פְּלִשְׁתִּים
  choice: पलिश्तियों के गत नगर
  rationale: सम्बन्धवाचक संरचना को सुरक्षित रखते हुए ‘नगर’ जोड़ा गया है ताकि हिन्दी में स्थान और गंतव्य स्पष्ट तथा स्वाभाविक रहें।
- source_word: הֲטוֹבִים מִן הַמַּמְלָכוֹת הָאֵלֶּה
  choice: क्या वे इन राज्यों से उत्तम हैं?
  rationale: ‘उत्तम’ के कर्ता का मूल में स्पष्ट उल्लेख नहीं है। मुख्य पाठ में निकटतम पूर्ववर्ती नगरों/राज्यों के लिए ‘वे’ रखा गया है, जबकि सम्भव वैकल्पिक कर्ता ‘तुम’ पादटिप्पणी में दिया गया है।
- source_word: אִם
  choice: या
  rationale: दो आलंकारिक प्रश्नों के दूसरे विकल्प का परिचय होने के कारण आधुनिक हिन्दी में ‘या’ सर्वाधिक स्वाभाविक है।
- source_word: רַב גְּבוּלָם מִגְּבֻלְכֶם
  choice: उनका क्षेत्र तुम्हारे क्षेत्र से बड़ा है
  rationale: राजनीतिक भूभाग की तुलना में גְּבוּל का आशय केवल सीमा-रेखा नहीं, बल्कि क्षेत्र है; इसलिए ‘क्षेत्र’ चुना गया है।
theological_decisions:
- issue: הֲטוֹבִים में निहित कर्ता
  choice: मुख्य पाठ में ‘वे’, अर्थात अभी बताए गए नगर/राज्य
  alternative: ‘क्या तुम इन राज्यों से उत्तम हो?’
  rationale: इब्रानी विशेषण में कर्ता व्यक्त नहीं है। निकटतम उल्लिखित स्थानों को कर्ता मानना सम्भव है, पर सम्बोधित लोगों को कर्ता मानना भी व्याकरणतः सम्भव है; इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट रखी गई है। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है। आदेशों की क्रमिक गति और दूसरे प्रश्न की आलंकारिक तुलना को बनाए रखा गया है; मूल की वास्तविक कर्ता-अस्पष्टता पादटिप्पणी में सुरक्षित है।
