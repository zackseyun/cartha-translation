source:
  edition: WLC
  text: כִּ֡י הִנְ/נִי֩ מֵקִ֨ים עֲלֵי/כֶ֜ם בֵּ֣ית יִשְׂרָאֵ֗ל נְאֻם יְהוָ֛ה אֱלֹהֵ֥י הַ/צְּבָא֖וֹת גּ֑וֹי וְ/לָחֲצ֥וּ אֶתְ/כֶ֛ם מִ/לְּב֥וֹא חֲמָ֖ת עַד נַ֥חַל הָ/עֲרָבָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/014.yaml
  text: For behold[a], I am raising up against you a nation, O house of Israel, declares Yahweh, the God of hosts[b], and they will oppress you from Lebo-hamath to the Wadi of the Arabah.
translation:
  language: hi
  text: “क्योंकि देखो, हे इस्राएल के घराने, मैं तुम्हारे विरुद्ध एक राष्ट्र को खड़ा कर रहा हूँ,” सेनाओं के परमेश्वर याहवे की यह घोषणा है, “और वे लबो-हमात[a] से लेकर अराबा की वादी[b] तक तुम्हारा उत्पीड़न करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमात के प्रवेश-स्थान से।” हिब्रू पद को स्थाननाम ‘लबो-हमात’ अथवा सीमा बताने वाले वर्णन के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “अराबा के नाले तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले न्याय-वचन का कारण या आधार बताता है और प्रसंग के तार्किक संबंध को बनाए रखता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह आसन्न ईश्वरीय कार्य की ओर ध्यान खींचने वाली भविष्यद्वाणी की उद्घोषणा है।
- source_word: מֵקִים
  choice: खड़ा कर रहा हूँ
  rationale: हिफ़ील रूप किसी को उठाने या कार्यक्षेत्र में लाने का अर्थ देता है; यह राष्ट्र को न्याय के साधन के रूप में खड़ा करने में परमेश्वर की सक्रियता स्पष्ट रखता है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे विरुद्ध
  rationale: सैनिक और न्यायिक प्रसंग में על का विरोधसूचक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: בֵּית יִשְׂרָאֵל
  choice: हे इस्राएल के घराने
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ भविष्यद्वाणी के संबोधन-भाव को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखता है और याहवे नाम को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: सेनाओं के परमेश्वर
  rationale: यह צבאות की सैनिक तथा व्यापक ब्रह्मांडीय अर्थ-सीमा को केवल पृथ्वी की या केवल स्वर्गीय सेनाओं तक सीमित नहीं करता।
- source_word: גּוֹי
  choice: एक राष्ट्र
  rationale: एक विदेशी राष्ट्रीय शक्ति के लिए प्रयुक्त एकवचन का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: וְלָחֲצוּ
  choice: और वे ... दबाएँगे
  rationale: क्रिया दमनकारी दबाव और उत्पीड़न व्यक्त करती है। हिब्रू में ‘राष्ट्र’ के एकवचन के बाद आई बहुवचन क्रिया का बदलाव ‘वे’ द्वारा सुरक्षित रखा गया है।
- source_word: מִלְּבוֹא חֲמָת
  choice: लबो-हमात से
  rationale: यह ज्ञात भौगोलिक नाम अथवा सीमा-सूचक पद है। मुख्य पाठ में स्थाननाम रखने से इसे केवल सामान्य वर्णन समझने की भूल नहीं होती, जबकि वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: נַחַל הָעֲרָבָה
  choice: अराबा की वादी
  rationale: נחל यहाँ किसी वादी या मौसमी जलधारा को सूचित कर सकता है। ‘वादी’ भौगोलिक स्वरूप को संक्षेप में व्यक्त करता है और ‘अराबा’ को क्षेत्रीय नाम के रूप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रत्यक्ष रखा गया है; किसी विशेष संप्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: एक राष्ट्र के बाद बहुवचन क्रिया
  choice: एक राष्ट्र ... वे ... दबाएँगे
  alternative: एक राष्ट्र ... वह ... दबाएगा
  rationale: हिब्रू में גּוֹי एकवचन है, पर וְלָחֲצוּ बहुवचन है। हिन्दी में ‘वे’ इस वास्तविक व्याकरणिक तनाव को सुरक्षित रखता है और राष्ट्र के लोगों की सामूहिक कार्रवाई की संभावना खुली छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। वाक्य सामान्य पाठक के लिए सहज है, जबकि भौगोलिक पदों की मूल विशिष्टता और हिब्रू के एकवचन-बहुवचन तनाव को सुरक्षित रखा गया है।
