  text: הַֽ/מְנַדִּ֖ים לְ/י֣וֹם רָ֑ע וַ/תַּגִּישׁ֖וּ/ן שֶׁ֥בֶת חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/006/003.yaml
  text: you who put far away the evil day and bring near the seat of violence[a][b].
translation:
  language: hi
  text: तुम, जो विपत्ति के दिन को दूर करते हो[a], और हिंसा के आसन को निकट लाते हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति के दिन को टालते हो।”
    reason: lexical_alternative
  - marker: b
    text: या, “हिंसा का सिंहासन निकट लाते हो,” अथवा “हिंसा का शासन निकट लाते हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְנַדִּים
  choice: जो ... दूर करते हो
  rationale: सम्बोधित लोगों के सक्रिय रूप से किसी बात को दूर करने या टालने का भाव रखता है और आरोपात्मक लहजे को बनाए रखता है।
- source_word: לְיוֹם רָע
  choice: विपत्ति के दिन को
  rationale: शाब्दिक ‘बुरे दिन’ की तुलना में आधुनिक हिन्दी में भाव अधिक स्वाभाविक और स्पष्ट है; यह आने वाले संकट या न्याय के दिन की ओर संकेत करता है, पर उसकी व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַתַּגִּישׁוּן
  choice: और ... पास ले आते हो
  rationale: हिफ़ील का कारक भाव ‘निकट लाना’ सुरक्षित रहता है और पहली पंक्ति के ‘दूर करने’ के साथ जानबूझकर रखा गया विरोध उभरता है।
- source_word: שֶׁבֶת
  choice: आसन
  rationale: यह बैठने के स्थान, स्थापित सत्ता या शासन का संकेत दे सकता है। ‘आसन’ मूल बिंब को बचाता है और ‘सिंहासन’ या ‘शासन’ जैसी अधिक निश्चित व्याख्या से बचता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: आमोस के सामाजिक न्याय-संदर्भ में यह निर्मम हिंसा, अत्याचार और अन्याय के व्यापक भाव का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पद में निहित विडंबना और ‘हिंसा के आसन’ का संबंध
  choice: लोग विपत्ति के दिन को दूर मानते या टालते हैं, जबकि वे हिंसा की स्थापित सत्ता को निकट ला रहे हैं।
  alternative: वे न्याय की चिंता को टालते हुए समाज में हिंसा का शासन स्थापित करते हैं; अथवा वे अनजाने में हिंसक विपत्ति के दिन को निकट लाते हैं।
  rationale: इब्रानी कथन संक्षिप्त और बहुअर्थी है। मुख्य पाठ ‘आसन’ के बिंब को बनाए रखता है ताकि सामाजिक अत्याचार और उसके द्वारा बुलाई गई न्याय-विपत्ति—दोनों के बीच का तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और भविष्यद्वाणी-सुलभ शैली। ‘दूर’ और ‘पास’ का विरोध मूल इब्रानी की विडंबना को स्पष्ट रखता है; ‘आसन’ जानबूझकर कुछ अस्पष्टता बचाता है।
