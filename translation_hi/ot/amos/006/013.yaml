  text: तुम जो निरर्थक बात पर आनन्द मनाते हो, जो कहते हो, “क्या हमने अपनी ही शक्ति से अपने लिए सींग नहीं ले लिए हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: तुम जो ... आनन्द मनाते
  rationale: बहुवचन कृदन्त को पिछले सन्दर्भ से जारी सीधे भविष्यद्वक्ताई सम्बोधन के रूप में रखा गया है।
- source_word: לְלֹא דָבָר
  choice: किसी काम की बात पर नहीं
  rationale: इब्रानी का शाब्दिक अर्थ ‘जो कोई बात/वस्तु नहीं’ है और यहाँ व्यर्थ या नगण्य उपलब्धि का भाव हो सकता है। हिन्दी में यह अर्थ स्वाभाविक ढंग से व्यक्त होता है; लो-दबार स्थान-नाम की सम्भावित शब्द-क्रीड़ा पादटिप्पणी में सुरक्षित है।
- source_word: הָאֹמְרִים
  choice: जो कहते हो
  rationale: यह पहले कृदन्त के समानान्तर दूसरा बहुवचन कृदन्त है और घमण्ड भरे कथन को सीधे सम्बोधन से जोड़ता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह आत्मसन्तुष्ट दावे वाली आलंकारिक प्रश्न-रचना को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: בְחָזְקֵנוּ
  choice: अपने ही बल से
  rationale: संज्ञा ‘बल/सामर्थ्य’ और प्रथम पुरुष बहुवचन प्रत्यय को व्यक्त करते हुए ‘ही’ घमण्डपूर्ण आत्मनिर्भरता के बलाघात को उभारता है।
- source_word: לָקַחְנוּ
  choice: हासिल किए हैं
  rationale: क्रिया का मूल अर्थ ‘लेना’ है; सन्दर्भ में प्राप्त करने या अधिकार में लेने का भाव है। ‘हासिल किए’ सैन्य विजय को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: קַרְנָיִם
  choice: सींग
  rationale: द्विवचन रूप का सामान्य अर्थ ‘सींग’ है, जो शक्ति का रूपक है। कर्नैम नगर की सम्भावित ओर-संकेतक शब्द-क्रीड़ा को पादटिप्पणी में रखा गया है।
