translation:
  language: hi
  text: जो वीणा पर झंकारते हैं[a], और दाऊद की तरह अपने लिए संगीत के वाद्य ईजाद करते हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का शाब्दिक रूप ‘वीणा के मुख पर’ है। ‘मुख’ का इस मुहावरे में सटीक संकेत अनिश्चित है; इसलिए इसे यहाँ सामान्य अर्थ में ‘वीणा पर’ कहा गया है।
    reason: עַל פִּי הַנָּבֶל के असामान्य शाब्दिक बिंब और उसके अर्थगत अनिश्चय को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הַפֹּרְטִים
  choice: मनमानी तानें छेड़ते हैं
  rationale: इस दुर्लभ क्रिया में वीणा के साथ सहज या बेपरवाह ढंग से तान छेड़ने अथवा संगीत रचने का भाव है। यह अनुवाद क्रिया की संगीत-संबंधी और आलोचनात्मक दोनों छवियों को स्वाभाविक हिन्दी में रखता है।
- source_word: עַל פִּי הַנָּבֶל
  choice: वीणा की धुन पर
  rationale: शाब्दिक रूप से ‘वीणा के मुख पर’ है। हिन्दी में ‘वीणा की धुन पर’ वाद्य की संगति में गाने या तान छेड़ने का स्वाभाविक अर्थ देता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: חָשְׁבוּ לָהֶם
  choice: अपने लिए … गढ़ते हैं
  rationale: חָשַׁב यहाँ योजना बनाने, रचने या आविष्कार करने के अर्थ में है। ‘गढ़ते हैं’ रचनात्मक आविष्कार का भाव रखता है और केवल मानसिक विचार तक सीमित नहीं करता।
- source_word: כְּלֵי שִׁיר
  choice: संगीत के वाद्य
  rationale: शाब्दिक अर्थ ‘गीत/गायन के उपकरण’ है; प्रसंग में इसका स्वाभाविक हिन्दी अर्थ संगीत बजाने के वाद्य है।
