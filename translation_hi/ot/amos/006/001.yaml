base_translation:
  language: en
  yaml_path: translation/ot/amos/006/001.yaml
  text: Woe to those who are at ease in Zion[a], and to those who feel secure on the mountain of Samaria, the distinguished men of the foremost of the nations[c][b], to whom the house of Israel comes.
translation:
  language: hi
  text: हाय उन पर जो सिय्योन में निश्चिंत हैं, और उन पर जो सामरिया के पहाड़ पर अपने को सुरक्षित समझते हैं—राष्ट्रों में प्रथम के नामी जन,[a][b] जिनके पास इस्राएल का घराना आता है![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नामी” का शाब्दिक अर्थ “नामित,” “चिह्नित” या “ठहराए हुए” भी हो सकता है; यहाँ सम्भवतः प्रसिद्ध अथवा प्रमुख लोगों का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: “राष्ट्रों में प्रथम” का अनुवाद “राष्ट्रों में प्रमुख” या “राष्ट्रों के प्रधान” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी उपवाक्य संक्षिप्त है; शाब्दिक रूप से, “और इस्राएल का घराना उनके पास आता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय उन पर
  rationale: यह भविष्यद्वक्ताओं की चेतावनी और विलाप—दोनों का स्वर व्यक्त करता है; हिन्दी में ‘हाय उन पर’ न्याय की घोषणा को स्वाभाविक ढंग से रखता है।
- source_word: הַשַּׁאֲנַנִּים
  choice: जो ... निश्चिन्त हैं
