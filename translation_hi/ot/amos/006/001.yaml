- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: स्थानवाचक प्रयोग को बनाए रखते हुए पारम्परिक हिन्दी स्थान-नाम रखा गया है।
- source_word: וְהַבֹּטְחִים
  choice: जो ... अपने को सुरक्षित समझते हैं
  rationale: בטח यहाँ सकारात्मक विश्वास से अधिक झूठी सुरक्षा और आत्मविश्वास का संकेत देता है।
- source_word: בְּהַר שֹׁמְרוֹן
  choice: सामरिया के पहाड़ पर
  rationale: इब्रानी भौगोलिक पदबंध का निकट और स्वाभाविक अनुवाद है।
- source_word: נְקֻבֵי
  choice: माने जानेवाले प्रतिष्ठित पुरुष
  rationale: शाब्दिक अर्थ ‘नामित/चिह्नित’ है, पर सन्दर्भ में विशिष्ट अथवा प्रसिद्ध अगुओं का बोध होता है; मूल अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: רֵאשִׁית הַגּוֹיִם
  choice: राष्ट्रों में प्रमुख
