- source_word: וּבָאוּ לָהֶם
  choice: जिनके पास ... आता है
  rationale: संक्षिप्त इब्रानी वाक्य को हिन्दी में सम्बन्धवाचक उपवाक्य के रूप में स्पष्ट किया गया है, बिना उसके आशय को अधिक निर्धारित किए।
- source_word: בֵּית יִשְׂרָאֵל
  choice: इस्राएल का घराना
  rationale: मूल के राष्ट्रीय-वाचक सूत्र को केवल ‘इस्राएल’ या ‘इस्राएली लोग’ में समतल किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: सिय्योन और सामरिया में सम्बोधित लोगों का संदर्भ
  choice: वचन को सिय्योन और सामरिया—दोनों सत्ता-केंद्रों के आत्मसन्तुष्ट लोगों को सम्बोधित करते हुए रखा गया है।
  alternative: पूरा वचन केवल उत्तरी राज्य के अगुओं को सम्बोधित हो सकता है, और सिय्योन का उल्लेख आलंकारिक अथवा पाठ-संबंधी प्रश्न माना जा सकता है।
  rationale: इब्रानी की समानान्तर संरचना दोनों स्थानों को सीधे रखती है; अनुवाद किसी एक संदर्भ को हटाता या दूसरे में विलीन नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गम्भीर भविष्यद्वक्ताई स्वर के साथ रखी गई है। ‘निश्चिन्त’ और ‘अपने को सुरक्षित समझते हैं’ झूठी सुरक्षा का भाव देते हैं; ‘घराना’ मूल की सामुदायिक-राष्ट्रीय अभिव्यक्ति को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
