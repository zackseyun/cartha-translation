source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י אֱד֔וֹם וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל רָדְפ֨/וֹ בַ/חֶ֤רֶב אָחִי/ו֙ וְ/שִׁחֵ֣ת רַחֲמָ֔י/ו וַ/יִּטְרֹ֤ף לָ/עַד֙ אַפּ֔/וֹ וְ/עֶבְרָת֖/וֹ שְׁמָ֥רָ/ה נֶֽצַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/011.yaml
  text: 'Thus says Yahweh: “For three transgressions of Edom[a], and for four, I will not revoke its punishment, because he pursued his brother with the sword and destroyed his compassion; his anger tore continually[c][b], and he kept his wrath forever.”'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:

    “एदोम के तीन अपराधों के कारण,

    बल्कि चार के कारण,

    मैं उसका दण्ड नहीं हटाऊँगा[a],

    क्योंकि उसने तलवार से अपने भाई का पीछा किया[b]

    और अपनी करुणा नष्ट कर दी;

    उसका क्रोध लगातार चीरता-फाड़ता रहा[c],

    और उसने अपना रोष सदा बनाए रखा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उसे वापस नहीं फेरूँगा”; अर्थात् मैं घोषित न्याय को नहीं पलटूँगा।
    reason: lexical_alternative
  - marker: b
    text: “अपने भाई” सम्भवतः एसाव और याकूब के माध्यम से एदोम और इस्राएल के पारिवारिक सम्बन्ध की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: इसका अनुवाद यह भी हो सकता है, “वह अपने क्रोध में सदा चीरता-फाड़ता रहा।” हिब्रू में किसी हिंसक शिकारी के चीरने की सजीव छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका निकट लिप्यंतरण रखा गया है।
- source_word: פִּשְׁעֵי
  choice: अपराधों
  rationale: यह शब्द गंभीर नैतिक और वाचा-संबंधी उल्लंघनों को व्यक्त करता है तथा आम हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसका दण्ड नहीं हटाऊँगा
  rationale: हिब्रू मुहावरे में निहित घोषित न्याय को स्पष्ट करते हुए उसके वापस न लिए जाने का भाव रखा गया है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: רָדְפוֹ בַחֶרֶב אָחִיו
  choice: उसने तलवार से अपने भाई का पीछा किया
  rationale: एदोम को एक पुरुष के रूप में व्यक्त करने वाली हिब्रू एकवचन शैली और ‘भाई’ के पारिवारिक आरोप—दोनों को सुरक्षित रखा गया है।
- source_word: שִׁחֵת רַחֲמָיו
  choice: अपनी करुणा नष्ट कर दी
  rationale: रַחֲמִים की दया/करुणा और שִׁחֵת की विनाशकारी तीव्रता को बिना अनावश्यक व्याख्या के व्यक्त किया गया है।
- source_word: וַיִּטְרֹף לָעַד אַפּוֹ
  choice: उसका क्रोध लगातार चीरता-फाड़ता रहा
  rationale: טרף की हिंसक, शिकारी छवि को सुरक्षित रखा गया है और לעד की निरंतरता को ‘लगातार’ से व्यक्त किया गया है; वाक्य-विन्यास का दूसरा सम्भव पाठ पादटिप्पणी में है।
- source_word: וְעֶבְרָתוֹ שְׁמָרָה נֶצַח
  choice: उसने अपना रोष सदा बनाए रखा
  rationale: ‘रोष’ עֶבְרָה की प्रबलता को और ‘सदा बनाए रखा’ שׁמר तथा נצח की दीर्घकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राष्ट्र एदोम और एकवचन पुरुषवाचक रूपों के बीच सम्बन्ध
  choice: एदोम के लिए ‘उसने/अपना/उसका’ जैसे एकवचन पुरुषवाचक रूप बनाए रखे गए हैं।
  alternative: राष्ट्र को बहुवचन मानकर ‘उन्होंने/उनका’ कहना।
  rationale: हिब्रू एदोम का एक व्यक्ति के रूप में मानवीकरण करता है; यही शैली ‘अपने भाई’ वाले पारिवारिक आरोप को भी प्रभावी बनाती है।
- issue: ‘अपने भाई’ का ऐतिहासिक संकेत
  choice: मुख्य पाठ में केवल ‘अपने भाई’ रखा गया है।
  alternative: मुख्य पाठ में इसे ‘इस्राएल, अपने भाई-राष्ट्र’ के रूप में स्पष्ट करना।
  rationale: हिब्रू स्वयं भाई का नाम नहीं बताता। सम्भावित एसाव–याकूब/एदोम–इस्राएल पृष्ठभूमि को पादटिप्पणी में रखा गया है, ताकि मूल की संक्षिप्तता और संकेतात्मकता बनी रहे।
- issue: וַיִּטְרֹף...אַפּוֹ का कर्ता और सम्बन्ध
  choice: ‘उसका क्रोध लगातार चीरता-फाड़ता रहा’—क्रोध को कर्ता मानने वाला सजीव रूप।
  alternative: ‘वह अपने क्रोध में सदा चीरता-फाड़ता रहा।’
  rationale: हिब्रू शब्दक्रम दोनों प्रकार की समझ की गुंजाइश देता है। मुख्य पाठ शिकारी रूपक को बनाए रखता है और वैकल्पिक व्याकरणिक सम्बन्ध पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण भविष्यद्वाणी की शैली के साथ रखी गई है। काव्यात्मक पंक्ति-विन्यास Amos के आरोप और समानांतर वाक्य-रचना को स्पष्ट करता है। ‘करुणा’, ‘क्रोध’ और ‘रोष’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के भावगत भेद और तीव्रता को बनाए रखते हैं।
