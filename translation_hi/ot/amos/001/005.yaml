  text: וְ/שָֽׁבַרְתִּי֙ בְּרִ֣יחַ דַּמֶּ֔שֶׂק וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מִ/בִּקְעַת אָ֔וֶן וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מִ/בֵּ֣ית עֶ֑דֶן וְ/גָל֧וּ עַם אֲרָ֛ם קִ֖ירָ/ה אָמַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/005.yaml
  text: I will break the gate-bar of Damascus[a], and I will cut off the inhabitant from the Valley of Aven and the one who holds the scepter from Beth-eden[b]; and the people of Aram will go into exile to Kir,” says Yahweh.
translation:
  language: hi
  text: “मैं दमिश्क के फाटक की साँकल तोड़ दूँगा। मैं आवेन की घाटी[a] से निवासी को और बेत-एदेन[b] से राजदंड थामनेवाले को मिटा दूँगा; और अराम के लोग निर्वासन में कीर चले जाएँगे,” याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू नाम ‘आवेन’ उस शब्द की प्रतिध्वनि हो सकता है जिसका अर्थ ‘दुष्टता’ या ‘विपत्ति’ है। यहाँ यह संभवतः किसी स्थान का नाम है, जिसमें भविष्यद्वक्ता का शब्दालंकार भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बेत-एदेन’ का अनुवाद ‘एदेन का घर’ भी किया जा सकता है; कुछ विद्वान इसकी ऐतिहासिक पहचान बित-अदिनी से करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁבַרְתִּי
  choice: मैं ... तोड़ दूँगा
  rationale: भविष्यसूचक न्याय के प्रसंग में संयोजक वाव के साथ पूर्ण क्रिया भावी कार्य बताती है; ‘तोड़ दूँगा’ किले की सुरक्षा नष्ट करने के बिंब को सहज हिन्दी में रखता है।
- source_word: בְּרִיחַ
  choice: फाटक की साँकल
  rationale: यह फाटक या द्वार को बंद रखनेवाली आड़ी छड़ अथवा अर्गला है। ‘फाटक की साँकल’ सामान्य पाठक के लिए स्वाभाविक है और रक्षात्मक व्यवस्था का बिंब स्पष्ट रखती है।
- source_word: דַּמֶּשֶׂק
  choice: दमिश्क
  rationale: स्थान-नाम का हिन्दी में प्रचलित रूप।
- source_word: וְהִכְרַתִּי
  choice: मिटा दूँगा
  rationale: क्रिया निर्णायक रूप से हटा देने या नष्ट कर देने का अर्थ देती है। ‘मिटा दूँगा’ हिन्दी में स्वाभाविक है और न्याय की तीव्रता बनाए रखता है।
- source_word: יוֹשֵׁב
  choice: निवासी
  rationale: एकवचन कृदंत यहाँ सामूहिक या प्रतिनिधिक अर्थ में हो सकता है। अनुवाद उसे सीधे ‘शासक’ बनाकर निहितार्थ को निश्चित नहीं करता।
- source_word: מִבִּקְעַת אָוֶן
  choice: आवेन की घाटी से
  rationale: בִּקְעָה खुली घाटी या मैदान को सूचित करता है और אָוֶן यहाँ संभवतः स्थान-नाम है। मुख्य पाठ स्थान-नाम को बनाए रखता है; संभावित शब्दालंकार पाद-टिप्पणी में दिया गया है।
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: राजदंड थामनेवाले
  rationale: תמך का अर्थ ‘थामना’ और שֵׁבֶט का यहाँ अर्थ शासकीय दंड अथवा राजदंड है। ठोस बिंब को बनाए रखते हुए यह पद शासक या सत्ता-धारी की ओर संकेत करता है।
- source_word: מִבֵּית עֶדֶן
  choice: बेत-एदेन से
  rationale: मुख्य पाठ में इसे स्थान-नाम माना गया है। इसका शाब्दिक अर्थ और संभावित ऐतिहासिक पहचान पाद-टिप्पणी में सुरक्षित हैं।
- source_word: וְגָלוּ
  choice: निर्वासन में ... चले जाएँगे
  rationale: क्रिया देश-निकाले अथवा निर्वासन में जाने को व्यक्त करती है। यह रूप गति और निर्वासन दोनों को रखता है, बिना उस एजेंसी को स्पष्ट किए जो इस उपवाक्य में कही नहीं गई।
- source_word: עַם אֲרָם
  choice: अराम के लोग
  rationale: हिब्रू जातीय-भौगोलिक नाम ‘अराम’ को रखा गया है; बाद के राजनीतिक नाम ‘सीरिया’ को आरोपित नहीं किया गया।
- source_word: קִירָה
  choice: कीर
  rationale: दिशासूचक प्रत्यय कीर की ओर गति बताता है; हिन्दी वाक्य-विन्यास में ‘कीर चले जाएँगे’ वही दिशा व्यक्त करता है।
- source_word: אָמַר יְהוָה
  choice: याहवे कहता है
  rationale: भविष्यद्वक्ता की संदेश-सूत्र शैली को वर्तमान काल में स्वाभाविक हिन्दी दी गई है और चतुरक्षरीय ईश्वरीय नाम को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। उसका लिप्यंतरण नाम की विशिष्टता बनाए रखता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। समानांतर भविष्यसूचक पंक्तियाँ, फाटक की सुरक्षा का ठोस बिंब, एकवचन प्रतिनिधिक ‘निवासी’, और ‘राजदंड थामनेवाले’ की राजनीतिक छवि सुरक्षित रखी गई है। स्थान-नामों को अनुवादित या आधुनिक भू-राजनीतिक नामों से प्रतिस्थापित नहीं किया गया।
