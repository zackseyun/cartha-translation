base_translation:
  language: en
  yaml_path: translation/ot/amos/001/012.yaml
  text: So I will send fire upon Teman[a], and it will consume the citadels of Bozrah.
translation:
  language: hi
  text: इसलिए मैं तेमान पर आग भेजूँगा, और वह बोस्रा के गढ़ों[a] को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बोस्रा के महलों।” इब्रानी शब्द राजसी भवनों या किलेबंद गढ़ों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שִׁלַּחְתִּי
  choice: इसलिए मैं भेजूँगा
  rationale: पूर्ववर्ती अभियोग के परिणाम को व्यक्त करने के लिए वाव को ‘इसलिए’ से दिया गया है; हिफ़ील क्रिया का सामान्य अर्थ ‘भेजना’ है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सीधा और प्रसंगानुकूल अर्थ ‘आग’ है; न्याय की ठोस छवि को बनाए रखा गया है।
- source_word: בְּ/תֵימָן
  choice: तेमान पर
  rationale: स्थाननाम को लिप्यंतरित किया गया है। ‘आग भेजना’ के साथ בְ का ‘पर’ स्वाभाविक हिन्दी में लक्षित न्याय को व्यक्त करता है।
- source_word: וְ/אָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: आग के कर्ता होने पर אָכַל का अर्थ ‘खा जाना/नष्ट कर देना’ है। ‘भस्म कर देगी’ आधुनिक हिन्दी में आग द्वारा पूर्ण विनाश की छवि स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַרְמְנוֹת
  choice: गढ़ों
  rationale: यह शब्द राजसी भवनों अथवा किलेबंद दुर्गों को सूचित कर सकता है। ‘गढ़’ इसकी रक्षात्मक और शासकीय दोनों ध्वनियों को संक्षेप में रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: בָּצְרָה
  choice: बोस्रा के
  rationale: स्थाननाम का लिप्यंतरण किया गया है और संबंधसूचक रचना द्वारा इसे אַרְמְנוֹת से जोड़ा गया है।
theological_decisions:
- issue: भविष्यद्वाणी में न्याय की घोषणा
  choice: परमेश्वर द्वारा सीधे आग भेजने और उसके द्वारा विनाश की ठोस छवि को बनाए रखना
  alternative: ‘आग’ को सामान्य विनाश के रूप में व्याख्यात्मक ढंग से प्रस्तुत करना
  rationale: इब्रानी पाठ न्याय की सीधी घोषणा करता है; अनुवाद छवि को अमूर्त या नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वाणी-वाचन। ‘तेमान’ और ‘बोस्रा’ स्थाननामों के रूप में लिप्यंतरित हैं; ‘भस्म कर देगी’ आग की विनाशकारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
