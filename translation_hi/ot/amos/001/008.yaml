  text: וְ/הִכְרַתִּ֤י יוֹשֵׁב֙ מֵֽ/אַשְׁדּ֔וֹד וְ/תוֹמֵ֥ךְ שֵׁ֖בֶט מֵֽ/אַשְׁקְל֑וֹן וַ/הֲשִׁיב֨וֹתִי יָדִ֜/י עַל עֶקְר֗וֹן וְ/אָֽבְדוּ֙ שְׁאֵרִ֣ית פְּלִשְׁתִּ֔ים אָמַ֖ר אֲדֹנָ֥/י יְהוִֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/008.yaml
  text: And I will cut off the inhabitant from Ashdod[a], and the one who holds the scepter from Ashkelon; I will turn my hand against Ekron[b], and the remnant of the Philistines shall perish,” says the Lord GOD.
translation:
  language: hi
  text: “मैं अशदोद के निवासी को और अश्कलोन के राजदंड थामनेवाले को काट डालूँगा[a]; मैं एक्रोन के विरुद्ध अपना हाथ फेरूँगा[b], और पलिश्तियों के बचे हुए लोग नाश हो जाएँगे,” प्रभु याहवे कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अश्कलोन के शासक को’; शाब्दिक रूप से, ‘राजदंड थामनेवाले को’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मैं एक्रोन के विरुद्ध अपना हाथ फिर से फेरूँगा।’ इब्रानी मुहावरा न्याय के लिए निर्देशित, संभवतः दोबारा की गई कार्रवाई व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: मैं ... काट डालूँगा
  rationale: हिफ़ील रूप यहाँ हटाने या समूल नष्ट करने का न्याय-सूचक भाव रखता है। ‘काट डालूँगा’ मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में विनाश का आशय स्पष्ट करता है।
- source_word: יוֹשֵׁב
  choice: निवासी
  rationale: शाब्दिक अर्थ ‘रहनेवाला’ है। एकवचन किसी प्रतिनिधि निवासी या सामूहिक जनसंख्या को सूचित कर सकता है; ‘निवासी’ इस अस्पष्टता को शासक मानकर सीमित नहीं करता।
- source_word: וְתוֹמֵךְ שֵׁבֶט
  choice: राजदंड थामनेवाला
  rationale: תמך का अर्थ थामना और שֵׁבֶט का यहाँ अर्थ शासन का दंड या राजदंड है। यह पद शासक को सूचित करता है, पर अनुवाद मूल चित्र को सुरक्षित रखता है।
- source_word: וַהֲשִׁיבוֹתִי יָדִי עַל
  choice: मैं ... के विरुद्ध अपना हाथ फेरूँगा
  rationale: यह इब्रानी मुहावरा न्याय के लिए हाथ को किसी के विरुद्ध मोड़ने या फिर से लगाने का भाव देता है। ‘हाथ फेरूँगा’ रूपक और उसकी संभावित पुनरावृत्ति—दोनों को खुला रखता है।
- source_word: וְאָבְדוּ
  choice: नाश हो जाएँगे
  rationale: क्रिया अकर्मक परिणाम व्यक्त करती है—वे नष्ट या लुप्त हो जाएँगे। हिन्दी में ‘नाश हो जाएँगे’ इस परिणामात्मक बल और भविष्यवाणी की गंभीरता को बनाए रखता है।
- source_word: שְׁאֵרִית פְּלִשְׁתִּים
  choice: पलिश्तियों के बचे हुए लोग
  rationale: שְׁאֵרִית बचे हुए अंश या लोगों को दर्शाता है। संदर्भ में लोगों का नाश है, इसलिए यह स्वाभाविक हिन्दी है और ‘शेष’ की धारणा को स्पष्ट रखती है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: 'दोनों इब्रानी तत्वों को अलग-अलग व्यक्त किया गया है: אֲדֹנָי ‘प्रभु’ और יהוה परमेश्वर का व्यक्तिगत नाम ‘याहवे’। इससे ‘प्रभु प्रभु’ जैसी पुनरुक्ति से बचते हुए मूल पदवी और नाम दोनों सुरक्षित रहते हैं।'
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का अनुवाद
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर / प्रभु यहोवा
  rationale: मूल पाठ में אֲדֹנָי के बाद चार-अक्षरी व्यक्तिगत नाम יהוה है। ‘प्रभु याहवे’ पदवी और नाम दोनों को प्रत्यक्ष रूप से प्रस्तुत करता है; ‘प्रभु परमेश्वर’ पाठ-परंपरा के आदरसूचक प्रतिस्थापन को दर्शाता, पर व्यक्तिगत नाम को छिपा देता।
- issue: ‘निवासी’ का एकवचन अर्थ
  choice: एकवचन प्रतिनिधि शब्द को बनाए रखना
  alternative: अशदोद के निवासी / अशदोद की जनसंख्या
  rationale: इब्रानी יוֹשֵׁב व्याकरणतः एकवचन है, लेकिन नगर की जनता या उसके प्रतिनिधि को सामूहिक रूप से सूचित कर सकता है। अनुवाद इस तनाव को बहुवचन बनाकर हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यवाणी-संबंधी न्यायवाणी के अनुकूल रखी गई है। नगरों के प्रचलित हिन्दी रूप—अशदोद, अश्कलोन और एक्रोन—तथा जाति-नाम ‘पलिश्ती’ अपनाए गए हैं। ‘राजदंड थामनेवाला’ और ‘अपना हाथ फेरूँगा’ जैसे चित्र मूल इब्रानी रूपकों को सुरक्षित रखते हैं; पादटिप्पणियाँ उनके स्वाभाविक अर्थ और वैकल्पिक समझ स्पष्ट करती हैं।
