id: AMO.1.13
reference: Amos 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י בְנֵֽי עַמּ֔וֹן וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל בִּקְעָ/ם֙ הָר֣וֹת הַ/גִּלְעָ֔ד לְמַ֖עַן הַרְחִ֥יב אֶת גְּבוּלָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/013.yaml
  text: 'Thus says Yahweh: “For three transgressions of the sons of Ammon[a], and for four, I will not revoke it[b], because they ripped open the pregnant women of Gilead in order to enlarge their border.”'
translation:
  language: hi
  text: 'याहवे यों कहता है:


    “अम्मोनियों[a] के तीन अपराधों के कारण,

    हाँ, चार के कारण,

    मैं अपना दण्ड-विधान वापस नहीं लूँगा[b],

    क्योंकि उन्होंने अपनी सीमा बढ़ाने के लिए

    गिलाद की गर्भवती स्त्रियों के पेट चीर डाले।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उसे वापस नहीं लूँगा” या “मैं उसे नहीं टालूँगा।” यहाँ आशय घोषित न्याय-दण्ड से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह मानक भविष्यद्वक्तीय संदेश-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है तथा יְהוָה को उसके नाम ‘याहवे’ से व्यक्त करता है।
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי ... וְעַל אַרְבָּעָה
  choice: तीन अपराधों के कारण, हाँ, चार के कारण
  rationale: यह इब्रानी की क्रमवृद्धि ‘तीन... और चार’ को बनाए रखता है। ‘अपराध’ פֶּשַׁע के नैतिक उल्लंघन और विद्रोह के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोन के वंशजों
  rationale: यह इब्रानी के शाब्दिक संबंध ‘अम्मोन के पुत्रों’ को कठोर शब्दशः हिन्दी के बिना सुरक्षित रखता है; आशय अम्मोनी लोग है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसे वापस नहीं लूँगा
  rationale: इब्रानी में कर्म सर्वनाम स्पष्ट है, पर उसका संदर्भ व्यक्त नहीं किया गया। यह अनुवाद उस अस्पष्टता को बनाए रखता है; पादटिप्पणी न्याय-दण्ड न टालने के मुहावरेदार आशय को स्पष्ट करती है।
- source_word: בִּקְעָם הָרוֹת הַגִּלְעָד
  choice: उन्होंने गिलाद की गर्भवती स्त्रियों के पेट चीर डाले
  rationale: यह युद्ध-अत्याचार की हिंसक तीव्रता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है। ‘पेट’ हिन्दी में गर्भवती स्त्रियों को ‘चीरने’ के आशय को सहज रूप से स्पष्ट करता है।
- source_word: לְמַעַן הַרְחִיב אֶת גְּבוּלָם
  choice: अपनी सीमा बढ़ाने के लिए
  rationale: उद्देश्यसूचक לְמַעַן और גְּבוּל के ‘सीमा’ अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को प्रत्यक्ष रूप में सुरक्षित रखा गया है और उसे सामान्य उपाधि से नहीं बदला गया।
- issue: לֹא אֲשִׁיבֶנּוּ में अव्यक्त संदर्भ
  choice: मैं उसे वापस नहीं लूँगा
  alternative: मैं उसका दण्ड नहीं टालूँगा
  rationale: मुख्य पाठ इब्रानी के सर्वनाम और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है; वैकल्पिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है, ताकि पाठ में ‘दण्ड’ को अनकहे रूप में न जोड़ा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वक्तीय लहजा रखा गया है। पद्यात्मक पंक्ति-विन्यास से आमोस के दोहराए जाने वाले न्याय-सूत्र और ‘तीन... चार’ की क्रमवृद्धि स्पष्ट होती है। हिंसक घटना को मूल के अनुरूप प्रत्यक्ष रखा गया है, पर अनावश्यक विस्तार नहीं जोड़ा गया।
