base_translation:
  language: en
  yaml_path: translation/ot/amos/001/015.yaml
  text: And their king shall go into exile[a], he and his officials together, says Yahweh.
translation:
  language: hi
  text: उनका राजा निर्वासन में चला जाएगा[a]—वह और उसके अधिकारी, सब एक साथ—यहोवा कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिल्कोम।” मिल्कोम अम्मोनियों का देवता था। कुछ लोग इस पंक्ति का अर्थ यह समझते हैं कि अम्मोन का देवता अपने पुरोहितों या अधिकारियों के साथ निर्वासन में जाएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָלַךְ
  choice: चला जाएगा
  rationale: भविष्यद्वाणी के न्याय-संदर्भ में संयोजक सहित पूर्ण क्रिया भविष्य में होने वाली निश्चित घटना बताती है; यह हिंदी में स्वाभाविक भविष्यकाल है।
- source_word: מַלְכָּם
  choice: उनका राजा
  rationale: मसोरेटिक स्वरांकन और प्रत्यय इसे स्वाभाविक रूप से ‘उनका राजा’ बताते हैं; मिल्कोम की संभव वैकल्पिक पहचान पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּגּוֹלָה
  choice: बँधुआई में
  rationale: यह विजय के बाद बलपूर्वक देश से निकाले जाने की दशा को व्यक्त करता है; ‘बँधुआई में चला जाएगा’ प्रस्थान और निर्वासन दोनों भावों को सहज हिंदी में रखता है।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम राजा पर बल देता है और अगले संयुक्त पदबंध में स्वाभाविक रूप से जुड़ता है।
- source_word: וְשָׂרָיו
  choice: और उसके अधिकारी
  rationale: שָׂרִים राजकीय शासकों, प्रधानों या अधिकारियों को दर्शाता है; आधुनिक संदर्भ में ‘अधिकारी’ स्पष्ट और व्यापक है।
- source_word: יַחְדָּו
  choice: सब एक साथ
  rationale: यह राजा और उसके अधिकारियों के संयुक्त निर्वासन पर बल देता है; ‘सब’ हिंदी में उस सामूहिकता को स्पष्ट करता है।
- source_word: אָמַר יְהוָה
  choice: यह यहोवा का वचन है
  rationale: भविष्यद्वाणी के संदेश-सूत्र को स्वाभाविक, गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है और व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: מַלְכָּם मानव राजा को दर्शाता है या अम्मोन के देवता मिल्कोम को
  choice: 'मानव शासक: ‘उनका राजा’'
  alternative: ‘मिल्कोम’; इस स्थिति में उसके साथ जाने वाले שָׂרָיו को उसके प्रधान अथवा संभवतः पुरोहित समझा जा सकता है।
  rationale: मसोरेटिक स्वरांकन, सर्वनाम-प्रत्यय और ‘वह और उसके अधिकारी’ वाली निकटवर्ती रचना मानव राजा के अर्थ का समर्थन करती है। फिर भी व्यंजनात्मक रूप मिल्कोम नाम के रूप में भी समझा जा सकता है और अम्मोन के संदर्भ में यह महत्वपूर्ण संभावना है, इसलिए इसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बँधुआई’ बलपूर्वक निर्वासन का परिचित बाइबलीय भाव देता है। डैश मूल वाक्य में הוּא से आरंभ होने वाले बलाघातपूर्ण स्पष्टीकरण को उभारते हैं।
