source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י עַזָּ֔ה וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל הַגְלוֹתָ֛/ם גָּל֥וּת שְׁלֵמָ֖ה לְ/הַסְגִּ֥יר לֶ/אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/006.yaml
  text: 'Thus says Yahweh: “For three transgressions of Gaza[a], and for four, I will not revoke its punishment[b], because they carried away an entire population into exile to hand them over to Edom.”'
translation:
  language: hi
  text: 'यहोवा यों कहता है: “गाज़ा के तीन अपराधों के कारण, वरन् चार के कारण भी, मैं उसका दण्ड वापस नहीं लूँगा[a], क्योंकि उन्होंने एक पूरे समुदाय को निर्वासित करके एदोम के हाथ सौंप दिया[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मैं उसे वापस नहीं फेरूँगा।” इस न्याय-सूत्र में इसका आशय है कि यहोवा घोषित दण्ड को वापस नहीं लेंगे।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश का अनुवाद “समूचे बन्दी-समूह को निर्वासित किया” भी हो सकता है। बल इस बात पर है कि पूरे समुदाय या बन्दी-समूह को ले जाया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को प्रचलित और श्रद्धापूर्ण हिन्दी रूप में रखा गया है।
- source_word: פִּשְׁעֵי
  choice: अपराधों
  rationale: यह पापपूर्ण उल्लंघनों का नैतिक बल व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: עַל שְׁלֹשָׁה ... וְעַל אַרְבָּעָה
  choice: तीन ... के कारण, वरन् चार के कारण
  rationale: इब्रानी की क्रमवर्धक संख्यात्मक उक्ति को बनाए रखता है; यह केवल शाब्दिक गिनती नहीं, दोष की परिपूर्णता या अति का संकेत देती है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसका दण्ड नहीं टालूँगा
  rationale: शाब्दिक अर्थ ‘मैं उसे वापस नहीं फेरूँगा’ है; न्याय-सूत्र में निहित विषय घोषित दण्ड है। हिन्दी में अर्थ स्पष्ट करते हुए पादटिप्पणी में मूल की अस्पष्टता सुरक्षित रखी गई है।
- source_word: הַגְלוֹתָם גָּלוּת שְׁלֵמָה
  choice: वे पूरी की पूरी आबादी को बँधुआई में ले गए
  rationale: पूर्ण निर्वासन या लोगों के पूरे समुदाय को बन्दी बनाकर ले जाने की व्यापकता स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: לְהַסְגִּיר
  choice: हाथ सौंप दें
  rationale: बन्दियों को दूसरे पक्ष के अधिकार में देने का अर्थ सहज और गंभीर हिन्दी में व्यक्त करता है।
- source_word: לֶאֱדוֹם
  choice: एदोम
  rationale: राष्ट्र के नाम का मानक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: לֹא אֲשִׁיבֶנּוּ का निहित कर्म
  choice: उसका दण्ड नहीं टालूँगा
  alternative: मैं उसे वापस नहीं फेरूँगा / मैं अपना क्रोध नहीं फेरूँगा
  rationale: इब्रानी में कर्म स्पष्ट नहीं है। आमोस 1–2 के न्याय-सूत्र में घोषित दण्ड का न टलना अभिप्रेत है; मुख्य पाठ इसे सुबोध बनाता है और पादटिप्पणी शाब्दिक अनिश्चितता बताती है।
- issue: גָּלוּת שְׁלֵמָה का विस्तार
  choice: पूरी की पूरी आबादी
  alternative: समूचा बन्दी-समूह / पूरी बँधुआई
  rationale: वाक्यांश छिटपुट बन्दियों के बजाय पूर्ण समुदाय या पूरे बन्दी-समूह को ले जाने पर बल देता है; ‘आबादी’ सम्भावित सामूहिक अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली। ‘यों कहता है’, ‘वरन्’ और ‘बँधुआई’ बाइबलीय गंभीरता बनाए रखते हैं, जबकि शेष वाक्य सामान्य पाठक के लिए स्पष्ट और स्वाभाविक रखा गया है।
