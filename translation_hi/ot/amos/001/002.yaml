source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָה֙ מִ/צִיּ֣וֹן יִשְׁאָ֔ג וּ/מִ/ירוּשָׁלִַ֖ם יִתֵּ֣ן קוֹל֑/וֹ וְ/אָֽבְלוּ֙ נְא֣וֹת הָ/רֹעִ֔ים וְ/יָבֵ֖שׁ רֹ֥אשׁ הַ/כַּרְמֶֽל׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/002.yaml
  text: 'And he said: Yahweh roars from Zion and gives his voice from Jerusalem[a]; the pastures of the shepherds mourn[c][b], and the summit of Carmel dries up.'
translation:
  language: hi
  text: 'और उसने कहा:


    “याहवे सिय्योन से गरजता है,

    और यरूशलेम से अपनी आवाज़ सुनाता है[a];

    चरवाहों की चरागाहें[b] शोक मनाती हैं,

    और कर्मेल की चोटी[c] सूख जाती है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आवाज़ देता है”; अर्थ “अपनी आवाज़ निकालता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चरवाहों के हरे मैदान।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “कर्मेल का सिर,” अर्थात उसकी चोटी या सबसे ऊँचा भाग।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय पवित्र नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में सीधे लिप्यंतरित किया गया है।
- source_word: יִשְׁאָג
  choice: गरजता है
  rationale: क्रिया सिंह की गर्जना का सजीव बिंब प्रस्तुत करती है; वर्तमानकालीन रूप भविष्यसूचक घोषणा की तात्कालिकता बनाए रखता है।
- source_word: יִתֵּן קוֹלוֹ
  choice: अपनी आवाज़ सुनाता है
  rationale: शाब्दिक इब्रानी मुहावरा ‘अपनी आवाज़ देता है’ हिन्दी में अस्वाभाविक है; यह चयन उसके अर्थ और ‘गरजता है’ के साथ समानांतरता को बनाए रखता है।
- source_word: נְאוֹת הָרֹעִים
  choice: चरवाहों की चरागाहें
  rationale: संदर्भ में נְאוֹת पशुओं के चरने के स्थान हैं; ‘चरागाहें’ साधारण और सटीक हिन्दी है।
- source_word: אָבְלוּ
  choice: शोक मनाती हैं
  rationale: भूमि का मानवीकरण करते हुए क्रिया के मूल अर्थ ‘शोक करना’ को सुरक्षित रखा गया है; केवल भौतिक परिणाम बताने वाला ‘मुरझाती हैं’ काव्यात्मक तनाव घटा देता।
- source_word: רֹאשׁ הַכַּרְמֶל
  choice: कर्मेल की चोटी
  rationale: ‘कर्मेल का सिर’ इब्रानी भौगोलिक मुहावरा है; हिन्दी में ‘चोटी’ उसी आशय का स्वाभाविक रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ यहाँ परमेश्वर का विशिष्ट वाचा-नाम देता है; लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: अपूर्ण क्रियाओं יִשְׁאָג और יִתֵּן का काल
  choice: वर्तमानकालीन भविष्यसूचक घोषणा—‘गरजता है… सुनाता है’
  alternative: भविष्यकाल—‘गरजेगा… अपनी आवाज़ सुनाएगा’
  rationale: इब्रानी रूप भविष्य का संकेत दे सकते हैं, पर भविष्यवाणी के उद्घोष में वर्तमान जैसा सजीव बल भी रखते हैं। मुख्य पाठ उस तात्कालिक काव्यात्मक प्रभाव को चुनता है, बिना भविष्यसूचक संदर्भ को नकारे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। पंक्ति-विन्यास ने इब्रानी समानांतरता को उभारा है। ‘उसने कहा’ पिछले पद में आमोस को संकेत करता है; मूल पाठ की तरह नाम यहाँ जोड़ा नहीं गया।
