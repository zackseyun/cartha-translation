source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵ֣י דַמֶּ֔שֶׂק וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַל דּוּשָׁ֛/ם בַּ/חֲרֻצ֥וֹת הַ/בַּרְזֶ֖ל אֶת הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/003.yaml
  text: 'Thus says Yahweh: “For three transgressions of Damascus[a], and for four, I will not revoke it, because they threshed Gilead with threshing sledges of iron.”'
translation:
  language: hi
  text: 'याहवे यों कहते हैं:


    “दमिश्क के तीन अपराधों के कारण,

    और चार के कारण,

    मैं उसे वापस नहीं लूँगा[a],

    क्योंकि उन्होंने गिलाद को

    लोहे के दँवनी-पाटों से रौंद डाला।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे नहीं फेरूँगा”; अर्थात् घोषित न्याय-दण्ड को नहीं पलटूँगा।
    reason: इब्रानी वाक्यांश का शाब्दिक अर्थ ‘मैं उसे वापस नहीं फेरूँगा’ है, पर सर्वनाम किस बात की ओर संकेत करता है, यह मूल पाठ में स्पष्ट नहीं किया गया।
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहते हैं
  rationale: यह नबियों के सन्देश की मानक उद्घोषणा है। परमेश्वर के व्यक्तिगत वाचा-नाम יְהוָה को ‘याहवे’ के रूप में रखा गया है।
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי דַמֶּשֶׂק וְעַל אַרְבָּעָה
  choice: दमिश्क के तीन अपराधों के कारण, बल्कि चार के कारण
  rationale: ‘तीन...बल्कि चार’ इब्रानी की क्रम-वृद्धि वाली काव्यात्मक उक्ति को बनाए रखता है। ‘अपराध’ פֶּשַׁע के विद्रोह अथवा गंभीर उल्लंघन के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसे वापस नहीं लूँगा
  rationale: इब्रानी में प्रत्यय का आशय स्पष्ट रूप से नहीं खोला गया है; इसलिए ‘दण्ड’ को मुख्य पाठ में जोड़ने के बजाय सर्वनाम रखा गया है। ‘वापस नहीं लूँगा’ घोषित निर्णय न पलटने का भाव देता है।
- source_word: עַל דּוּשָׁם
  choice: क्योंकि उन्होंने ... दाँवा है
  rationale: दूसरा עַל न्याय के कारण का परिचय देता है। דושׁ का मूल अर्थ अनाज दाँवना है; उसी क्रूर रूपक को बनाए रखा गया है। बहुवचन क्रिया दमिश्क के लोगों अथवा उसकी सेना की ओर संकेत करती है।
- source_word: בַּחֲרֻצוֹת הַבַּרְזֶל
  choice: लोहे के दँवनी-पाटों से
  rationale: חֲרֻצוֹת ऐसे भारी दँवनी-पाटों अथवा दाँवने के उपकरणों को दर्शाता है जो अनाज पर खींचे जाते थे। यह चयन उपकरण और लोहे—दोनों विवरणों को संक्षेप में सुरक्षित रखता है।
- source_word: אֶת הַגִּלְעָד
  choice: गिलाद को
  rationale: क्षेत्र के नाम को लिप्यंतरित किया गया है। मूल पाठ गिलाद को सामूहिक रूप से प्रस्तुत करता है, जिसमें वहाँ के लोग भी निहित हैं; अनुवाद इस रूपक को स्पष्ट करके सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: לֹא אֲשִׁיבֶנּוּ में अस्पष्ट कर्म
  choice: मैं उसे वापस नहीं लूँगा
  alternative: मैं दण्ड को वापस नहीं लूँगा / मैं नहीं टलूँगा
  rationale: इब्रानी में केवल पुल्लिंग एकवचन कर्म-प्रत्यय है और उसका संज्ञात्मक संदर्भ अनकहा है। मुख्य पाठ उस संक्षिप्तता और अस्पष्टता को रखता है; पादटिप्पणी सम्भावित न्यायिक आशय बताती है।
- issue: गिलाद को दाँवने का रूपक
  choice: रूपक को प्रत्यक्ष रूप से बनाए रखना
  alternative: गिलाद के लोगों को बेरहमी से कुचल डाला
  rationale: व्याख्यात्मक विकल्प सम्भावित अर्थ स्पष्ट करता है, पर मूल की हिंसक कृषि-छवि और क्षेत्र के सामूहिक उल्लेख को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘दँवनी-पाट’ अपेक्षाकृत कम प्रचलित कृषि-शब्द है, पर ‘दाँवा’ के साथ उसका अर्थ सन्दर्भ से खुलता है और मूल रूपक अक्षुण्ण रहता है। काव्य-पंक्तियाँ इब्रानी उद्घोषणा की क्रमिक गति को दर्शाती हैं।
