source:
  edition: WLC
  text: וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/חוֹמַ֣ת רַבָּ֔ה וְ/אָכְלָ֖ה אַרְמְנוֹתֶ֑י/הָ בִּ/תְרוּעָה֙ בְּ/י֣וֹם מִלְחָמָ֔ה בְּ/סַ֖עַר בְּ/י֥וֹם סוּפָֽה
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/014.yaml
  text: I will kindle a fire in the wall of Rabbah[a], and it will consume her citadels, with a battle cry on the day of war[c][b], with a storm on the day of tempest.
translation:
  language: hi
  text: मैं रब्बा की शहरपनाह में आग लगा दूँगा, और वह उसके दुर्गों को भस्म कर देगी—रणघोष के साथ, युद्ध के दिन; तूफ़ान के साथ, आँधी के दिन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִצַּתִּי אֵשׁ
  choice: मैं ... आग लगा दूँगा
  rationale: हिफ़ील रूप का कारणवाचक भाव और भविष्यसूचक न्याय-संदर्भ स्वाभाविक आधुनिक हिन्दी में स्पष्ट रहता है।
- source_word: בְּחוֹמַת רַבָּה
  choice: रब्बा की शहरपनाह में
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है; ‘शहरपनाह’ इस ऐतिहासिक सैन्य संदर्भ में ‘दीवार’ से अधिक सटीक है। ב को यहाँ ‘में’ रखा गया है, जहाँ आग लगाए जाने का स्थान व्यक्त होता है।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: आग द्वारा निगलने या नष्ट करने की इब्रानी छवि को हिन्दी में स्वाभाविक अग्नि-संबंधी क्रिया से व्यक्त किया गया है। ‘वह’ का संदर्भ आग है।
- source_word: אַרְמְנוֹתֶיהָ
  choice: उसके गढ़ों
  rationale: אַרְמוֹן महल या सुदृढ़ दुर्गनुमा भवन दोनों का बोध करा सकता है। युद्ध और नगर-विनाश के प्रसंग में ‘गढ़’ व्यापक सैन्य अर्थ को उचित रूप से व्यक्त करता है।
- source_word: בִּתְרוּעָה
  choice: रणघोष
  rationale: תְּרוּעָה ऊँची पुकार, चेतावनी का घोष या कभी तुरही से जुड़ी ध्वनि हो सकती है। ‘युद्ध के दिन’ के समानांतर ‘रणघोष’ संक्षिप्त और स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּיוֹם מִלְחָמָה
  choice: युद्ध के दिन
  rationale: कालवाचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּסַעַר בְּיוֹם סוּפָה
  choice: आँधी के दिन प्रचण्ड तूफ़ान के साथ
  rationale: סַעַר और סוּפָה दोनों तूफ़ानी प्रचण्डता व्यक्त करते हैं। हिन्दी में ‘प्रचण्ड तूफ़ान’ और ‘आँधी का दिन’ काव्यात्मक समानांतरता तथा तीव्रता बनाए रखते हैं।
theological_decisions:
- issue: न्याय में युद्ध और तूफ़ान की छवियों का संबंध
  choice: अनुवाद सैन्य विनाश और तूफ़ानी प्रचण्डता दोनों को साथ रखता है, बिना यह निश्चित किए कि तूफ़ान केवल रूपक है या प्रत्यक्ष ईश्वरीय प्रकटता।
  alternative: तूफ़ानी भाषा को केवल यहोवा के दिव्य योद्धा के रूप में प्रकट होने का तकनीकी वर्णन माना जा सकता है।
  rationale: इब्रानी पाठ रणघोष और युद्ध के दिन को आँधी और तूफ़ान के दिन के साथ जोड़ता है। अनुवाद इस धार्मिक-काव्यात्मक तनाव को खुला रखता है।
- issue: אַרְמְנוֹתֶיהָ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: ‘उसके’ को रब्बा नगर के संदर्भ में रखा गया है।
  alternative: हिन्दी में इसे ‘रब्बा के गढ़ों’ के रूप में दोहराया जा सकता था।
  rationale: इब्रानी में नगर स्त्रीलिंग है। हिन्दी में ‘उसके’ अर्थ को स्पष्ट रखते हुए अनावश्यक पुनरावृत्ति से बचाता है, यद्यपि स्रोत की स्त्री-व्यक्तिकरण छवि हिन्दी सर्वनाम में प्रत्यक्ष नहीं रहती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रव्य पाठ के अनुकूल रखी गई है। ‘शहरपनाह,’ ‘रणघोष’ और ‘गढ़’ सैन्य-काव्यात्मक प्रसंग को साधारण पाठक के लिए समझने योग्य रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
