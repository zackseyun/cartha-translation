base_translation:
  language: en
  yaml_path: translation/ot/amos/001/004.yaml
  text: So I will send fire upon the house of Hazael[a], and it will consume the citadels of Ben-hadad.
translation:
  language: hi
  text: इसलिए मैं हजाएल के घर पर आग भेजूँगा, और वह बेन-हदद के गढ़ों[a] को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजमहलों”; इब्रानी शब्द राजमहलों या किलेबंद गढ़ों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: इसलिए मैं ... भेजूँगा
  rationale: प्रथम पुरुष एकवचन क्रिया का अर्थ ‘मैं भेजूँगा’ है। आरंभिक संयोजक पिछले अभियोग के फलस्वरूप आने वाले न्याय को जोड़ता है; हिंदी में ‘इसलिए’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल पाठ के ठोस और प्रभावशाली न्याय-चित्र को बनाए रखा गया है; इसे युद्ध या विनाश कहकर व्याख्यात्मक रूप से नहीं बदला गया।
- source_word: בְּבֵית חֲזָאֵל
  choice: हजाएल के राजघराने पर
  rationale: यहाँ בְּ लक्ष्य को सूचित करता है। בֵּית राजकीय संदर्भ में शासक के घराने या वंश को व्यक्त कर सकता है; ‘राजघराना’ आधुनिक हिंदी में इस आशय को स्पष्ट और स्वाभाविक रखता है।
- source_word: חֲזָאֵל
  choice: हजाएल
  rationale: व्यक्तिनाम का हिंदी लिप्यंतरण।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: आग को कर्ता बनाकर प्रयुक्त אכל का शाब्दिक अर्थ ‘खा जाना’ है, पर इस प्रसंग में ‘भस्म कर देना’ उसका स्वाभाविक हिंदी रूप है और आग की छवि को बनाए रखता है।
- source_word: אַרְמְנוֹת
  choice: गढ़ों
  rationale: यह शब्द राजमहलों अथवा किलेबंद दुर्गों को सूचित कर सकता है। न्याय और युद्ध के प्रसंग में ‘गढ़’ सुदृढ़ शाही ठिकानों का स्वाभाविक हिंदी शब्द है; दूसरी संभव अर्थछाया पादटिप्पणी में दी गई है।
- source_word: בֶּן הֲדָד
  choice: बेन-हदद
  rationale: राजकीय व्यक्तिनाम या वंशगत उपाधि का हिंदी लिप्यंतरण।
theological_decisions:
- issue: ‘हजाएल के घर’ का आशय
  choice: राजकीय घराना या वंश
  alternative: हजाएल का वास्तविक भवन या महल
  rationale: भविष्यद्वाणी के राजकीय न्याय-संदर्भ में ‘घर’ शासक के वंश और सत्ता-व्यवस्था को सूचित कर सकता है। ‘राजघराना’ लक्ष्य को केवल एक इमारत तक सीमित करने से बचाता है।
- issue: आग की प्रकृति
  choice: मूल पाठ की ठोस ‘आग’ की छवि बनाए रखना
  alternative: इसे सैनिक विनाश या परमेश्वर के न्याय के रूप में भावानुवाद करना
  rationale: मूल पाठ स्वयं ‘आग’ कहता है। छवि को यथावत रखने से भविष्यद्वाणी की शक्ति बनी रहती है और मुख्य पाठ में किसी एक व्याख्या को आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘भस्म कर देगी’ आग के साथ स्वाभाविक हिंदी प्रयोग है। पादटिप्पणी-चिह्न उसी शब्द पर रखा गया है जिसकी अर्थ-सीमा स्पष्ट की जा रही है।
