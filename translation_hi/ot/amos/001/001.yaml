  text: דִּבְרֵ֣י עָמ֔וֹס אֲשֶׁר הָיָ֥ה בַ/נֹּקְדִ֖ים מִ/תְּק֑וֹעַ אֲשֶׁר֩ חָזָ֨ה עַל יִשְׂרָאֵ֜ל בִּ/ימֵ֣י עֻזִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה וּ/בִ/ימֵ֞י יָרָבְעָ֤ם בֶּן יוֹאָשׁ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל שְׁנָתַ֖יִם לִ/פְנֵ֥י הָ/רָֽעַשׁ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/001.yaml
  text: The words of Amos[a], who was among the shepherds from Tekoa, which he saw concerning Israel in the days of Uzziah king of Judah and in the days of Jeroboam son of Joash, king of Israel[b], two years before the earthquake.
translation:
  language: hi
  text: आमोस—जो तक़ोआ के भेड़ पालनेवालों में से था—के वचन, जिन्हें उसने यहूदा के राजा उज्जियाह के दिनों में और इस्राएल के राजा योआश के पुत्र यारोबाम के दिनों में इस्राएल के विषय में देखा[a]—भूकम्प से दो वर्ष पहले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के विरुद्ध।” इब्रानी पूर्वसर्ग भविष्यद्वाणी के सन्दर्भ में दोनों अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: वचन
  rationale: भविष्यद्वाणी-संग्रह की शीर्ष-पंक्ति में דְּבָרִים के लिए ‘वचन’ स्वाभाविक, गरिमापूर्ण और बोलकर दिए गए संदेशों तथा उनकी लिखित सामग्री—दोनों के लिए उपयुक्त है।
- source_word: בַנֹּקְדִים
  choice: भेड़ पालनेवालों में से
  rationale: נֹקֵד सामान्य चरवाहे से अधिक विशेष रूप से भेड़ पालने या प्रजनन करानेवाले व्यक्ति को सूचित कर सकता है। यह रूप उस विशिष्टता और בְּ के ‘में से’ भाव को सहज हिन्दी में रखता है।
- source_word: מִתְּקוֹעַ
  choice: तक़ोआ के
  rationale: מִן मूल स्थान बताता है; हिन्दी में व्यवसाय-समूह के साथ ‘तक़ोआ के ... में से’ अधिक स्वाभाविक है। स्थाननाम को ध्वन्यात्मक रूप से ‘तक़ोआ’ लिखा गया है।
- source_word: חָזָה
  choice: देखा
  rationale: भविष्यद्वाणी के सन्दर्भ में यह प्रकाशन को दर्शन में देखने का तकनीकी भाव रखता है। ‘देखा’ मूल रूपक को बनाए रखता है और व्याख्यात्मक विस्तार नहीं करता।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विषय में
  rationale: עַל यहाँ ‘के विषय में’ अथवा ‘के विरुद्ध’ दोनों अर्थ दे सकता है। पुस्तक की शीर्ष-पंक्ति में व्यापक और कम निर्णायक अर्थ मुख्य पाठ में रखा गया है।
- source_word: בִּימֵי ... וּבִימֵי
  choice: के दिनों में ... और ... के दिनों में
  rationale: इब्रानी काल-सूचक सूत्र को स्वाभाविक हिन्दी में निकटता से बनाए रखता है।
- source_word: שְׁנָתַיִם לִפְנֵי הָרָעַשׁ
  choice: भूकम्प से दो वर्ष पहले
  rationale: निश्चित लेख के कारण ज्ञात ऐतिहासिक भूकम्प का संकेत है; हिन्दी में यह सीधा और स्वाभाविक काल-वाक्यांश है।
theological_decisions:
- issue: ‘वचन’ और ‘देखा’ का सम्बन्ध
  choice: ‘वचन, जिन्हें उसने ... देखा’
  alternative: ‘आमोस के वचन... उसने इस्राएल के विषय में दर्शन देखा’
  rationale: इब्रानी पाठ असामान्य रूप से ‘वचनों’ को ‘देखने’ की क्रिया से जोड़ता है और इस प्रकार बोले गए सन्देश तथा दर्शनीय प्रकाशन को एक साथ रखता है। मुख्य पाठ में इस तनाव को सहज सीमा तक संरक्षित किया गया है।
- issue: עַל יִשְׂרָאֵל का अर्थ
  choice: इस्राएल के विषय में
  alternative: इस्राएल के विरुद्ध
  rationale: भविष्यद्वाणी में पूर्वसर्ग विरोध का भाव ले सकता है, पर शीर्षक के रूप में ‘के विषय में’ अधिक व्यापक है और न्याय-सन्देश को पहले से एकमात्र अर्थ नहीं बनाता। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘भेड़ पालनेवालों’ को सामान्य ‘चरवाहों’ के बजाय व्यावसायिक विशिष्टता बनाए रखने के लिए चुना गया है। इब्रानी शीर्ष-पंक्ति की संरचना को हिन्दी की पठनीयता के अनुरूप हल्का पुनर्विन्यस्त किया गया है।
