base_translation:
  language: en
  yaml_path: translation/ot/amos/001/010.yaml
  text: So I will send fire upon the wall of Tyre[a], and it will consume her citadels.
translation:
  language: hi
  text: इसलिए मैं सोर की शहरपनाह पर आग भेजूँगा, और वह उसके गढ़ों[a] को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महलों।” इब्रानी शब्द राजसी भवनों या किलाबंद गढ़ों—दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: इसलिए मैं ... भेजूँगा
  rationale: प्रथम पुरुष एकवचन और आरंभिक संयोजक को पिछले अभियोग से निकले परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; “और” भी संभव है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सीधा अर्थ सुरक्षित है और न्याय के स्वरूप को शाब्दिक, सैनिक या रूपकात्मक कहकर सीमित नहीं किया गया।
- source_word: בְּחוֹמַת צֹר
  choice: सोर की शहरपनाह पर
  rationale: בְּ को यहाँ न्याय-सूत्र में “पर” और חוֹמָה को नगर की रक्षात्मक दीवार स्पष्ट करने वाले प्रचलित शब्द “शहरपनाह” से व्यक्त किया गया है। צֹר का मानक हिन्दी रूप “सोर” है।
- source_word: וְאָכְלָה
  choice: और वह ... भस्म कर देगी
  rationale: आग के विषय में “खा जाना” का स्वाभाविक हिन्दी समतुल्य “भस्म कर देना” है, जो विनाशकारी शक्ति को बनाए रखता है।
- source_word: אַרְמְנֹתֶיהָ
  choice: उसके गढ़ों
  rationale: אַרְמוֹן महल या किलाबंद सुदृढ़ भवन का अर्थ दे सकता है। नगर की शहरपनाह के प्रसंग में “गढ़” सैन्य-सुदृढ़ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: भविष्यद्वाणी के न्याय में आग का स्वरूप
  choice: परमेश्वर द्वारा भेजी गई आग की मूल छवि को बिना उसकी कार्यविधि तय किए रखा गया है।
  alternative: इसे केवल शाब्दिक अग्निकांड या केवल आक्रमणकारी विनाश का रूपक बताना।
  rationale: इब्रानी पाठ आग भेजे जाने और उसके द्वारा गढ़ों के भस्म होने की बात कहता है, पर यह स्पष्ट नहीं करता कि इसकी पूर्ति शाब्दिक, सैनिक या रूपकात्मक ढंग से होगी।
translation_notes:
  register: आधुनिक, dignified मानक हिन्दी। “शहरपनाह” नगर की रक्षात्मक दीवार को स्पष्ट करता है; “गढ़ों” के साथ पादटिप्पणी मूल की वास्तविक अर्थगत व्यापकता बनाए रखती है।
