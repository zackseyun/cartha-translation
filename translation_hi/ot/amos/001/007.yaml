  text: וְ/שִׁלַּ֥חְתִּי אֵ֖שׁ בְּ/חוֹמַ֣ת עַזָּ֑ה וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/007.yaml
  text: So I will send fire upon the wall of Gaza[a], and it will consume her citadels.
translation:
  language: hi
  text: इसलिए मैं गाज़ा की शहरपनाह पर आग भेजूँगा, और वह उसके गढ़ों[a] को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजमहलों।” इब्रानी शब्द राजकीय अथवा विशिष्ट भवनों के साथ-साथ किलेबंद गढ़ों का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  choice: इसलिए मैं…भेजूँगा
  rationale: प्रथम पुरुष एकवचन में परमेश्वर की सीधी कार्रवाई व्यक्त होती है। आरंभिक वाव को प्रसंग में चल रहे न्यायादेश के परिणाम के रूप में स्वाभाविक हिन्दी ‘इसलिए’ से व्यक्त किया गया है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सामान्य और प्रत्यक्ष अर्थ है तथा भविष्यद्वाणी में विनाशकारी न्याय की छवि को बनाए रखता है।
- source_word: בְּחוֹמַת
  choice: शहरपनाह पर
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है। आग भेजने के साथ בְּ को हिन्दी में स्वाभाविक रूप से ‘पर’ कहा गया है; ‘शहरपनाह’ साधारण दीवार के बजाय नगर की किलेबंद बाहरी दीवार का भाव देता है।
- source_word: עַזָּה
  choice: गाज़ा
  rationale: स्थान-नाम का हिन्दी में प्रचलित रूप।
- source_word: וְאָכְלָה
  choice: और वह…भस्म कर देगी
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘आग’ है। ‘भस्म कर देगी’ आग द्वारा पूरी तरह नष्ट करने का अर्थ स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: אַרְמְנֹתֶיהָ
  choice: उसके गढ़ों
  rationale: אַרְמוֹן राजकीय या विशिष्ट भवन के साथ किलेबंदी का भाव भी दे सकता है। युद्ध और नगर-विनाश के प्रसंग में ‘गढ़ों’ से रक्षात्मक सुदृढ़ता स्पष्ट होती है, जबकि ‘राजमहलों’ वाला वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: नगर के लिए स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय
  choice: उसके गढ़ों
  alternative: गाज़ा के गढ़ों
  rationale: इब्रानी में प्रत्यय स्त्रीलिंग एकवचन है और गाज़ा नगर की ओर संकेत करता है। हिन्दी का ‘उसके’ जैविक लिंग तय किए बिना नगर-संदर्भ को बनाए रखता है; इससे कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘शहरपनाह’ नगर की किलेबंद दीवार के लिए सटीक है; वाक्य की भविष्यद्वाणी-संबंधी गंभीरता बनाए रखते हुए अनावश्यक पुरातन भाषा से बचा गया है।
