source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה עַל שְׁלֹשָׁה֙ פִּשְׁעֵי צֹ֔ר וְ/עַל אַרְבָּעָ֖ה לֹ֣א אֲשִׁיבֶ֑/נּוּ עַֽל הַסְגִּירָ֞/ם גָּל֤וּת שְׁלֵמָה֙ לֶ/אֱד֔וֹם וְ/לֹ֥א זָכְר֖וּ בְּרִ֥ית אַחִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/001/009.yaml
  text: 'Thus says Yahweh: “For three transgressions of Tyre[a], and for four, I will not revoke its punishment[c][b], because they delivered up an entire population of exiles to Edom and did not remember a covenant of brotherhood.”'
translation:
  language: hi
  text: 'याहवेह यों कहता है: “सोर के तीन अपराधों के कारण, और चार के कारण, मैं उसका दण्ड रद्द नहीं करूँगा[a], क्योंकि उन्होंने पूरे निर्वासित समुदाय को एदोम के हाथ सौंप दिया[b] और भाइयों की वाचा को स्मरण नहीं रखा[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उसे वापस नहीं फेरूँगा।” इब्रानी में यह स्पष्ट नहीं किया गया कि किसे वापस नहीं फेरा जाएगा; प्रसंग में आशय घोषित दण्ड या न्याय को न हटाने से है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्वासितों का एक पूरा समूह” अथवा “एक सम्पूर्ण बन्दी समुदाय।” इब्रानी पद सम्पूर्ण रूप से पकड़े या निर्वासित किए गए लोगों के समूह को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “भाइयों की वाचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवेह यों कहता है
  rationale: भविष्यद्वक्ताओं की प्रामाणिक सन्देश-घोषणा को स्वाभाविक हिन्दी में रखते हुए यְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवेह’ से व्यक्त किया गया है।
- source_word: עַל שְׁלֹשָׁה פִּשְׁעֵי צֹר וְעַל אַרְבָּעָה
  choice: सोर के तीन अपराधों के कारण, बल्कि चार के कारण
  rationale: तीन-चार की संख्यात्मक वृद्धि वाली आमोस की काव्यात्मक अभियोग-पद्धति सुरक्षित रहती है; ‘बल्कि’ वृद्धि का भाव स्पष्ट करता है, और פֶּשַׁע के नैतिक तथा विद्रोही आशय के लिए ‘अपराध’ सहज है।
- source_word: לֹא אֲשִׁיבֶנּוּ
  choice: मैं उसका दण्ड वापस नहीं लूँगा
  rationale: इब्रानी का शाब्दिक अर्थ ‘मैं उसे वापस नहीं फेरूँगा’ है और कर्म का सन्दर्भ निहित है। मुख्य पाठ में न्यायिक आशय स्पष्ट किया गया है, जबकि पाद-टिप्पणी मूल अस्पष्टता बताती है।
- source_word: הַסְגִּירָם
  choice: उन्होंने ... एदोम के हाथ सौंप दिया
  rationale: हिफ़िल क्रिया किसी समूह को दूसरी सत्ता के अधिकार में सौंपने को दर्शाती है; ‘के हाथ सौंप दिया’ हिन्दी में इसका गम्भीर और स्वाभाविक रूप है।
- source_word: גָּלוּת שְׁלֵמָה
  choice: बन्धुओं के पूरे समुदाय को
  rationale: גָּלוּת यहाँ सामूहिक रूप से बन्दी बनाए या निर्वासित किए गए लोगों को सूचित कर सकता है, और שְׁלֵמָה उस समूह की सम्पूर्णता पर बल देता है। ‘समुदाय’ सामूहिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא זָכְרוּ בְּרִית אַחִים
  choice: और भाइयों की वाचा को स्मरण नहीं रखा
  rationale: זכר का मूल ‘स्मरण करना’ रखते हुए ‘स्मरण नहीं रखा’ वाचा के अनुसार आचरण न करने का प्रसंगगत आशय भी संप्रेषित करता है। בְּרִית אַחִים का निकट रूप ‘भाइयों की वाचा’ मूल रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवेह
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम यְהוָה है। ‘याहवेह’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: לֹא אֲשִׁיבֶנּוּ में निहित कर्म
  choice: न्यायिक आशय को ‘उसका दण्ड वापस नहीं लूँगा’ के रूप में स्पष्ट करना
  alternative: ‘मैं उसे वापस नहीं फेरूँगा’ कहकर अस्पष्टता ज्यों की त्यों रखना
  rationale: आमोस के इस आवर्ती सूत्र में प्रसंग आने वाले न्याय को न हटाने का है। स्पष्ट हिन्दी मुख्य पाठ में दी गई है, पर मूल की अनिर्दिष्टता पाद-टिप्पणी में सुरक्षित है।
- issue: בְּרִית אַחִים का सम्बन्ध
  choice: भाइयों की वाचा
  alternative: भाईचारे की वाचा; भाइयों के बीच की वाचा
  rationale: यह पद किसी भ्रातृ-सदृश राजनीतिक या जातीय सम्बन्ध की वाचा का संकेत कर सकता है, पर उसका सटीक ऐतिहासिक स्वरूप पाठ में निर्धारित नहीं है। निकट अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यद्वाणी की न्यायिक गम्भीरता तथा मूल की काव्यात्मक ‘तीन...चार’ रचना सुरक्षित है। ‘बन्धु’ और ‘वाचा’ जैसे शब्द प्रसंग की धार्मिक-ऐतिहासिक गरिमा बनाए रखते हैं, जबकि पाद-टिप्पणियाँ वास्तविक lexical ambiguity को स्पष्ट करती हैं।
