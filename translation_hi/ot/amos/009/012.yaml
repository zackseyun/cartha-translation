  text: לְמַ֨עַן יִֽירְשׁ֜וּ אֶת שְׁאֵרִ֤ית אֱדוֹם֙ וְ/כָל הַ/גּוֹיִ֔ם אֲשֶׁר נִקְרָ֥א שְׁמִ֖/י עֲלֵי/הֶ֑ם נְאֻם יְהוָ֖ה עֹ֥שֶׂה זֹּֽאת־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/012.yaml
  text: so that they may possess the remnant of Edom and all the nations who are called by my name,” declares Yahweh[b][a], who does this.
translation:
  language: hi
  text: ताकि वे एदोम के बचे हुए लोगों और उन सब राष्ट्रों को अपने अधिकार में ले लें, जो मेरे नाम से कहलाते हैं[a],” याहवे की यह घोषणा है, जो यह करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “जिन पर मेरा नाम पुकारा गया है।” यह इब्रानी मुहावरा याहवे से संबंध रखने या उसके द्वारा अपना माना जाने का भाव व्यक्त करता है।'
    reason: lexical_alternative
  - marker: b
    text: 'प्रेरितों के काम 15:17 में उद्धृत इस पद का यूनानी रूप उल्लेखनीय रूप से भिन्न है। उसका भाव है: “ताकि बाकी मनुष्य प्रभु को खोजें, और वे सब राष्ट्र भी जिन पर मेरा नाम पुकारा गया है।”'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह पिछले पदों में वर्णित पुनर्स्थापना के उद्देश्य या परिणाम को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: יִירְשׁוּ
  choice: अपने अधिकार में ले लें
  rationale: क्रिया ירשׁ विरासत पाने के साथ-साथ किसी भूमि या लोगों पर अधिकार करने का अर्थ भी रखती है। यहाँ इसके कर्म एदोम के बचे हुए लोग और राष्ट्र हैं, इसलिए यह प्रयोग प्रसंग के अनुकूल है और मूल की विजय-अधिकार संबंधी धार को बनाए रखता है।
- source_word: שְׁאֵרִית אֱדוֹם
  choice: एदोम के बचे हुए लोग
  rationale: שְׁאֵרִית न्याय के बाद बची हुई शेष जनसंख्या को सूचित कर सकता है। आधुनिक हिन्दी में यह रूप स्वाभाविक है और भावी पुनर्स्थापना के संदर्भ में एदोम के बचे हुओं को स्पष्ट करता है।
- source_word: וְכָל הַגּוֹיִם
  choice: और उन सब राष्ट्रों
  rationale: גּוֹיִם का व्यापक अर्थ इस्राएल से बाहर के राष्ट्र या जातीय समुदाय है। ‘राष्ट्र’ पुराने नियम के भविष्यवाणी-संबंधी संदर्भ में निष्पक्ष और सुबोध है। ‘उन’ अगले संबंधवाचक उपवाक्य से हिन्दी वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: जो मेरे नाम से कहलाते हैं
  rationale: यह सुबोध हिन्दी में उस इब्रानी मुहावरे को व्यक्त करता है जो याहवे से संबंध, स्वामित्व या उसके द्वारा दावा किए जाने का भाव रखता है। अधिक शब्दशः रूप पाद-टिप्पणी में दिया गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם का भविष्यद्वाणी-संबंधी औपचारिक बल बना रहता है और יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: עֹשֶׂה זֹּאת
  choice: वही यह करता है
  rationale: कर्तृवाचक कृदंत याहवे को इस प्रतिज्ञात कार्य को पूरा करने वाले के रूप में प्रस्तुत करता है। ‘वही’ मूल में निहित कर्ता पर बल को सहज हिन्दी में स्पष्ट करता है, जबकि वर्तमानकालीन रूप मूल की पक्षगत खुली प्रकृति को बनाए रखता है।
theological_decisions:
- issue: पुनर्स्थापना की भविष्यवाणी में इस्राएल का एदोम और अन्य राष्ट्रों से संबंध
  choice: मसोरेटिक इब्रानी पाठ के अनुसार एदोम के बचे हुए लोगों और राष्ट्रों को ‘अपने अधिकार में लेने’ की सीधी भाषा रखी गई है।
  alternative: प्रेरितों के काम 15:17 में उद्धृत यूनानी पाठ के अनुरूप इसे ‘बाकी मनुष्य प्रभु को खोजें’ जैसे समावेश-केंद्रित रूप में देना।
  rationale: WLC का पाठ स्पष्ट रूप से एदोम के शेष भाग और याहवे के नाम से कहलाने वाले राष्ट्रों पर अधिकार की बात करता है। मुख्य पाठ में यूनानी परंपरा को मिलाने से इब्रानी साक्ष्य की विशिष्टता और न्याय, पुनर्स्थापना तथा राष्ट्रों के संबंध की वास्तविक धार्मिक-वैचारिक खींचतान दब जाएगी। यूनानी रूप को पाद-टिप्पणी में दर्ज किया गया है।
- issue: याहवे के नाम से कहलाने वाले राष्ट्रों का आशय
  choice: मुहावरे को ‘जो मेरे नाम से कहलाते हैं’ के रूप में रखा गया है, जिससे संबंध या दावा व्यक्त होता है पर उसकी पूरी धार्मिक परिणति निर्धारित नहीं की जाती।
  alternative: इसे स्पष्ट व्याख्या के साथ ‘जो मेरे अपने लोग हैं’ कहना।
  rationale: व्याख्यात्मक विकल्प मुहावरे में निहित स्वामित्व या संबंध को एक ही प्रकार के वाचा-सदस्यत्व में सीमित कर देगा। चुना हुआ रूप मूल की अर्थगत व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने अधिकार में ले लें’ मूल की कठोरता को अनावश्यक रूप से नरम नहीं करता; वहीं पाद-टिप्पणियाँ इब्रानी मुहावरे और यूनानी पाठ-परंपरा की महत्वपूर्ण भिन्नता को पारदर्शी बनाती हैं।
