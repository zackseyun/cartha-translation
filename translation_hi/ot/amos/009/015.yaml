id: AMO.9.15
reference: Amos 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/נְטַעְתִּ֖י/ם עַל אַדְמָתָ֑/ם וְ/לֹ֨א יִנָּתְשׁ֜וּ ע֗וֹד מֵ/עַ֤ל אַדְמָתָ/ם֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם אָמַ֖ר יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/015.yaml
  text: I will plant them on their land[a], and they will never again be uprooted from the land that I have given them, says Yahweh your God.
translation:
  language: hi
  text: मैं उन्हें उनकी भूमि में रोपूँगा, और वे फिर कभी उस भूमि से उखाड़े नहीं जाएँगे जो मैंने उन्हें दी है। यहोवा, तुम्हारा परमेश्वर[a], कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “तुम्हारा परमेश्वर” में “तुम्हारा” दूसरा पुरुष एकवचन है। संभवतः यहाँ इस्राएल को एक समुदाय के रूप में संबोधित किया गया है; कुछ लोग प्रसंग के बहुवचन के अनुरूप “उनका परमेश्वर” समझते हैं।
    reason: मूल पाठ में बहुवचन संदर्भ के बीच दूसरे पुरुष एकवचन के उल्लेखनीय परिवर्तन को सुरक्षित और स्पष्ट करना।
lexical_decisions:
- source_word: וּנְטַעְתִּים
  choice: मैं उन्हें ... रोपूँगा
  rationale: נטע का मूल अर्थ ‘रोपना’ है। पुनर्स्थापना के इस प्रसंग में कृषि-रूपक को बनाए रखना उचित है और आगे आने वाले ‘उखाड़े’ से इसका स्पष्ट संबंध बनता है।
- source_word: עַל אַדְמָתָם
  choice: उनकी भूमि में
  rationale: אדמה का अर्थ मिट्टी, भूमि या धरती हो सकता है। हिन्दी में किसी जाति को उसकी भूमि में रोपने के रूपक के लिए ‘भूमि में’ स्वाभाविक है; ‘उनकी’ मूल के अधिकारवाचक प्रत्यय को सुरक्षित रखता है।
- source_word: וְלֹא יִנָּתְשׁוּ עוֹד
  choice: वे फिर कभी ... उखाड़े नहीं जाएँगे
  rationale: נתש का निफ़ाल रूप उखाड़े जाने को व्यक्त करता है। ‘उखाड़े’ पहले के ‘रोपूँगा’ रूपक को बनाए रखता है, और ‘फिर कभी ... नहीं’ עוֹד के साथ स्थायी निषेध का स्वाभाविक हिन्दी रूप है।
- source_word: מֵעַל אַדְמָתָם
  choice: अपनी ... भूमि से
  rationale: מֵעַל का शाब्दिक भाव ‘के ऊपर से’ है, पर यहाँ हिन्दी में ‘भूमि से’ स्वाभाविक है। तीसरे पुरुष बहुवचन प्रत्यय को ‘अपनी’ के द्वारा स्पष्ट और मुहावरेदार ढंग से रखा गया है।
- source_word: אֲשֶׁר נָתַתִּי לָהֶם
  choice: जो मैंने उन्हें दी है
  rationale: इब्रानी सिद्ध क्रिया को यहाँ वर्तमान परिणाम वाले पूर्ण भाव में प्रस्तुत किया गया है; यह भूमि के दिए जाने और उस दान की बनी हुई वैधता दोनों को व्यक्त करता है।
- source_word: אָמַר יְהוָה
  choice: यह ... यहोवा का वचन है
  rationale: नबी-संबंधी सूत्र का यह प्रतिष्ठित और स्वाभाविक हिन्दी रूप घोषणा के वर्तमान अधिकार को व्यक्त करता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: मसोरेटिक पाठ में प्रत्यय दूसरे पुरुष एकवचन है। आसपास के बहुवचन सर्वनामों के बावजूद इसे बिना संशोधन मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम है, केवल उपाधि नहीं। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ परिचित लिप्यंतरण है और नाम को नाम के रूप में बनाए रखता है।
- issue: אֱלֹהֶיךָ में वचन और पुरुष का परिवर्तन
  choice: तुम्हारे परमेश्वर
  alternative: उनके परमेश्वर
  rationale: प्राप्त इब्रानी पाठ स्पष्ट रूप से दूसरे पुरुष एकवचन ‘तुम्हारे’ पढ़ता है। इसे इस्राएल समुदाय को एक सामूहिक इकाई मानकर किए गए संबोधन के रूप में समझा जा सकता है; ‘उनके’ अधिक सुचारु है, पर मूल पाठ को बदल देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रोपूँगा/उखाड़े’ की कृषि-छवि जानबूझकर सुरक्षित है। पादटिप्पणी का चिह्न मुख्य पाठ में संबंधित विवादित वाक्यांश के बाद रखा गया है।
