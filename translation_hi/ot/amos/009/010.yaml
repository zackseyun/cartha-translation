  text: בַּ/חֶ֣רֶב יָמ֔וּתוּ כֹּ֖ל חַטָּאֵ֣י עַמִּ֑/י הָ/אֹמְרִ֗ים לֹֽא תַגִּ֧ישׁ וְ/תַקְדִּ֛ים בַּעֲדֵ֖י/נוּ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/010.yaml
  text: By the sword all the sinners of my people will die—those who say, ‘The disaster will not overtake us or come against us.’
translation:
  language: hi
  text: मेरी प्रजा के सभी पापी तलवार से मारे जाएँगे—वे जो कहते हैं, ‘विपत्ति न तो हम तक पहुँचेगी, न हमारे सामने आएगी।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחֶרֶב יָמוּתוּ
  choice: तलवार से मारे जाएँगे
  rationale: शाब्दिक अर्थ ‘तलवार से मरेंगे’ है; हिन्दी में यह रूप हिंसक मृत्यु के साधन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּל חַטָּאֵי עַמִּי
  choice: मेरी प्रजा के सभी पापी
  rationale: संबंधसूचक संरचना और प्रथम पुरुष ‘मेरी प्रजा’ को सीधे सुरक्षित रखा गया है।
- source_word: תַגִּישׁ
  choice: हम तक पहुँचेगी
  rationale: נגש का हिफ़ील रूप यहाँ विपत्ति के निकट आने या आ पहुँचने का भाव देता है।
- source_word: וְתַקְדִּים בַּעֲדֵינוּ
  choice: न हमारे सामने आएगी
  rationale: קדם और בעדינו का संयोजन कठिन और कुछ हद तक अस्पष्ट है; यह अनुवाद सामने आ पड़ने/सामना करने के स्थानिक भाव को बनाए रखता है, बिना अत्यधिक व्याख्या जोड़े।
theological_decisions:
- issue: ‘मेरी प्रजा के पापी’ और न्याय का संबंध
  choice: वचन को प्रजा के भीतर के पापियों पर लागू रखा गया है
  alternative: इसे समस्त प्रजा या बाहरी शत्रुओं पर सामान्यीकृत करना
  rationale: मसोरेटिक पाठ स्पष्ट रूप से ‘मेरी प्रजा के सभी पापी’ कहता है; इस आंतरिक न्याय की धार को नरम नहीं किया गया।
- issue: पापियों के दावे में विपत्ति के दो क्रियात्मक वर्णन
  choice: 'दोनों समानांतर क्रियाओं को अलग-अलग रखा गया: ‘पहुँचेगी’ और ‘सामने आएगी’'
  alternative: दोनों को एक ही सामान्य क्रिया में मिला देना
  rationale: मूल पाठ की पुनरुक्ति और संभावित अर्थ-तनाव को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर भविष्यद्वाणी-संबंधी लहजा। वाक्य सामान्य पाठक के लिए सहज है और मूल की न्याय-संबंधी तीक्ष्णता बनाए रखता है।
