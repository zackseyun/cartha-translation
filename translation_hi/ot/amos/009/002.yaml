source:
  edition: WLC
  text: אִם יַחְתְּר֣וּ בִ/שְׁא֔וֹל מִ/שָּׁ֖ם יָדִ֣/י תִקָּחֵ֑/ם וְ/אִֽם יַעֲלוּ֙ הַ/שָּׁמַ֔יִם מִ/שָּׁ֖ם אוֹרִידֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/002.yaml
  text: Though they dig into Sheol[a], from there my hand will take them; and though they climb up to the heavens, from there I will bring them down.
translation:
  language: hi
  text: चाहे वे खोदकर शीओल[a] में प्रवेश कर जाएँ, वहाँ से मेरा हाथ उन्हें ले लेगा; और चाहे वे आकाश तक चढ़ जाएँ, वहाँ से मैं उन्हें नीचे उतार लाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “मृतकों का लोक”।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתְּרוּ
  choice: खोदकर ... जा घुसें
  rationale: חָתַר में खोदने या सेंध लगाकर भीतर जाने का ठोस बिंब है। यह प्रयोग भाग निकलने के प्रयास को स्वाभाविक हिन्दी में व्यक्त करते हुए उस बिंब को बनाए रखता है।
- source_word: בִשְׁאוֹל
  choice: शीओल
  rationale: इब्रानी संज्ञा का लिप्यंतरण मृतकों के लोक की व्यापक धारणा को सुरक्षित रखता है और इसे केवल कब्र तक सीमित करने या किसी बाद की धर्मवैज्ञानिक अवधारणा से जोड़ने से बचाता है।
- source_word: יָדִי
  choice: मेरा हाथ
  rationale: शाब्दिक मानवीकरण परमेश्वर की पहुँच और सामर्थ्य का ठोस बिंब बनाए रखता है।
- source_word: תִּקָּחֵם
  choice: उन्हें पकड़ लेगा
  rationale: לָקַח का अर्थ यहाँ अपने अधिकार में लेना या पकड़ लेना है। हिन्दी में यह वाक्यांश दण्ड से बच न सकने का भाव स्पष्ट करता है, बिना अनावश्यक हिंसक अर्थ जोड़े।
- source_word: יַעֲלוּ הַשָּׁמַיִם
  choice: आकाश तक चढ़ जाएँ
  rationale: यह शीओल और आकाश के ब्रह्माण्डीय छोरों का समानान्तर बिंब बनाए रखता है। हिन्दी में सामूहिक अर्थ वाले एकवचन 'आकाश' का प्रयोग स्वाभाविक है।
- source_word: אוֹרִידֵם
  choice: मैं उन्हें नीचे उतार लाऊँगा
  rationale: हिफ़ील रूप का कारणवाचक अर्थ स्पष्ट रूप से व्यक्त होता है और मूल से अधिक हिंसक 'पटक दूँगा' जैसे अर्थ से बचा जाता है।
- source_word: אִם ... וְאִם
  choice: चाहे ... और चाहे
  rationale: 'प्रसंग में ये साधारण शर्तें नहीं, बल्कि रियायती उपवाक्य हैं: वे किसी भी चरम तक भागने का प्रयत्न करें, फिर भी बच नहीं पाएँगे।'
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शीओल
  alternative: कब्र; मृतकों का लोक; अधोलोक
  rationale: यह पद शीओल और आकाश को दो ब्रह्माण्डीय छोरों के रूप में रखकर परमेश्वर के न्याय से बचने की असम्भवता दिखाता है। लिप्यंतरण मूल इब्रानी धारणा को सुरक्षित रखता है, जबकि पादटिप्पणी सामान्य पाठक के लिए अर्थ खोलती है और किसी एक बाद की व्याख्या को निर्णायक नहीं बनाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'खोदकर ... जा घुसें' और 'आकाश तक चढ़ जाएँ' मूल की सजीव समानान्तरता बनाए रखते हैं; 'शीओल' को पादटिप्पणी सहित रखा गया है ताकि सांस्कृतिक या सम्प्रदायगत अतिव्याख्या न हो।
