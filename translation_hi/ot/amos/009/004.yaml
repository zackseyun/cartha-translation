source:
  edition: WLC
  text: וְ/אִם יֵלְכ֤וּ בַ/שְּׁבִי֙ לִ/פְנֵ֣י אֹֽיבֵי/הֶ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/חֶ֖רֶב וַ/הֲרָגָ֑תַ/ם וְ/שַׂמְתִּ֨י עֵינִ֧/י עֲלֵי/הֶ֛ם לְ/רָעָ֖ה וְ/לֹ֥א לְ/טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/004.yaml
  text: And if they go into captivity before their enemies[a], from there I will command the sword, and it will kill them; and I will set my eyes on them for harm and not for good.
translation:
  language: hi
  text: और यदि वे अपने शत्रुओं के सामने बंदी बनकर चले जाएँ, तो वहाँ से मैं तलवार को आज्ञा दूँगा, और वह उन्हें मार डालेगी। मैं उन पर अपनी दृष्टि हानि के लिए लगाऊँगा, भलाई के लिए नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विपत्ति लाने के लिए, भलाई के लिए नहीं।” यहाँ हिब्रू शब्द רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति या दंड के रूप में पहुँचने वाली हानि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह पिछले पद से संबंध बनाए रखते हुए न्याय की एक और संभावित परिस्थिति प्रस्तुत करता है।
- source_word: יֵלְכוּ בַשְּׁבִי
  choice: बँधुआई में चले जाएँ
  rationale: הלך की गति और שבי की बंदी अथवा निर्वासित अवस्था—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; कर्मवाच्य अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: לִפְנֵי אֹיְבֵיהֶם
  choice: अपने शत्रुओं के सामने
  rationale: हिब्रू मुहावरे का सीधा और सुबोध रूप है, जो शत्रुओं की उपस्थिति और अधीनता के संदर्भ को बनाए रखता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह स्पष्ट करता है कि बँधुआई का स्थान भी उन्हें परमेश्वर के न्याय से नहीं बचाएगा।
- source_word: אֲצַוֶּה אֶת־הַחֶרֶב
  choice: मैं तलवार को आज्ञा दूँगा
  rationale: तलवार को परमेश्वर के आदेशाधीन कर्ता के रूप में प्रस्तुत करने वाले सजीव रूपक को सुरक्षित रखता है।
- source_word: וַהֲרָגָתַם
  choice: और वह उन्हें मार डालेगी
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता 'तलवार' है; हिन्दी में 'वह' इस संबंध और मानवीकरण को स्पष्ट करता है।
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  choice: मैं उन पर अपनी दृष्टि ... लगाऊँगा
  rationale: लक्षित ईश्वरीय ध्यान के हिब्रू रूपक को बनाए रखता है, जिसका प्रतिकूल उद्देश्य अगले वाक्यांश में स्पष्ट होता है।
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  choice: भलाई के लिए नहीं, बल्कि हानि पहुँचाने के लिए
  rationale: רעה यहाँ नैतिक बुराई नहीं, बल्कि विपत्ति या दंडात्मक हानि को दर्शाता है। हिन्दी में यह क्रम स्वाभाविक है और मूल विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय कार्य के संबंध में רָעָה का अनुवाद
  choice: हानि पहुँचाने के लिए
  alternative: विपत्ति लाने के लिए; बुराई के लिए
  rationale: संदर्भ वाचा-संबंधी न्याय का है। 'बुराई' से नैतिक दुष्टता का अनुचित अर्थ निकल सकता है; 'हानि' प्रतिकूल दंड का अर्थ देता है और मूल पाठ के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। 'बँधुआई' बाइबलीय संदर्भ में बंदी बनाकर ले जाए जाने या निर्वासन की अवस्था को व्यक्त करता है। तलवार और दृष्टि के मूल रूपकों को सुरक्षित रखा गया है।
