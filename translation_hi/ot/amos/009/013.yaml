  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/נִגַּ֤שׁ חוֹרֵשׁ֙ בַּ/קֹּצֵ֔ר וְ/דֹרֵ֥ךְ עֲנָבִ֖ים בְּ/מֹשֵׁ֣ךְ הַ/זָּ֑רַע וְ/הִטִּ֤יפוּ הֶֽ/הָרִים֙ עָסִ֔יס וְ/כָל הַ/גְּבָע֖וֹת תִּתְמוֹגַֽגְנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/013.yaml
  text: Behold[a], days are coming, declares Yahweh, when the plowman will overtake the reaper, and the one who treads grapes the one who sows the seed; the mountains will drip sweet wine[c][b], and all the hills will melt.
translation:
  language: hi
  text: “देखो, दिन आ रहे हैं,” यहोवा की यह घोषणा है, “जब हल चलाने वाला कटनी करने वाले तक आ पहुँचेगा, और अंगूर रौंदने वाला बीज बोने वाले तक आ पहुँचेगा। पहाड़ मीठी दाखमधु[a] टपकाएँगे, और सारी पहाड़ियाँ पिघल जाएँगी[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नई दाखमधु।”
    reason: lexical_alternative
  - marker: b
    text: यह चित्र इतनी अधिक उपज का है कि एक ऋतु का काम पिछली ऋतु का काम पूरा होने से पहले ही शुरू हो जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यवाणी में ध्यान आकर्षित करने वाले उद्गार को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: נְאֻם की गंभीर घोषणात्मक शक्ति और יהוה के व्यक्तिगत नाम, दोनों को सुरक्षित रखता है।
- source_word: וְנִגַּשׁ
  choice: के पास आ पहुँचेगा
  rationale: मूल क्रिया का अर्थ ‘निकट आना’ है। यह अनुवाद ऋतुओं के असाधारण रूप से सट जाने का चित्र बनाए रखता है, बिना ‘आगे निकल जाना’ जैसा अधिक व्याख्यात्मक अर्थ थोपे।
- source_word: חוֹרֵשׁ ... קֹּצֵר
  choice: हल चलानेवाला ... कटनी करनेवाला
  rationale: कृषि-कर्मियों के ठोस और परस्पर विरोधी चित्र को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דֹרֵךְ עֲנָבִים
  choice: अंगूर रौंदनेवाला
  rationale: दाखमधु बनाने के लिए अंगूर रौंदने की प्राचीन प्रक्रिया का सजीव चित्र सुरक्षित रहता है।
- source_word: מֹשֵׁךְ הַזָּרַע
  choice: बीज बोनेवाला
  rationale: शाब्दिक रूप ‘बीज खींचनेवाला/निकालनेवाला’ है, पर प्रसंग में यह बोआई करने वाले व्यक्ति का मुहावरेदार वर्णन है; हिन्दी में शाब्दिक रूप अस्पष्ट और भ्रामक होगा।
- source_word: עָסִיס
  choice: मीठी दाखमधु
  rationale: ताज़ी, समृद्ध दाखमधु का भाव देता है और इसे केवल अंगूर के रस तक सीमित नहीं करता।
- source_word: תִּתְמוֹגַגְנָה
  choice: पिघल जाएँगी
  rationale: मूल के चौंकाने वाले काव्यात्मक रूपक को बनाए रखता है; इसे केवल ‘बहेंगी’ कहकर व्याख्यात्मक रूप से सरल नहीं किया गया।
theological_decisions:
- issue: भविष्यवाणी में पुनर्स्थापना और भरपूरी का चित्र
  choice: ठोस कृषि-चित्रों और काव्यात्मक अतिशयोक्ति को यथावत रखना
  alternative: इसे केवल शाब्दिक कृषि-भविष्यवाणी या केवल आत्मिक आशीष के रूप में स्पष्ट कर देना
  rationale: इब्रानी पाठ भरपूर उपज और एक-दूसरे से मिलती कृषि ऋतुओं का काव्यात्मक चित्र देता है। अनुवाद इसके पूरा होने की धार्मिक रूपरेखा तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’ से परमेश्वर का व्यक्तिगत नाम सुरक्षित है। कृषि-चित्र को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि ‘पहाड़ियाँ पिघल जाएँगी’ में मूल की काव्यात्मक तीव्रता बनाए रखी गई है।
