base_translation:
  language: en
  yaml_path: translation/ot/amos/009/006.yaml
  text: He who builds his upper chambers in the heavens[a], and has founded his vault upon the earth[b], who calls for the waters of the sea and pours them out upon the face of the earth—Yahweh is his name.
translation:
  language: hi
  text: 'वही है जो आकाश में अपने ऊपरी कक्ष बनाता है[a]


    और पृथ्वी पर अपनी संरचना की नींव रखता है[b];


    जो समुद्र के जल को बुलाता है


    और उसे धरती की सतह पर उंडेल देता है—


    उसका नाम याहवे है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी चढ़ाइयाँ” अथवा “अपनी सीढ़ियाँ।” इब्रानी शब्द ऊँचाइयों, सीढ़ियों या ऊपरी कमरों को सूचित कर सकता है; यहाँ संभवतः आकाश की ऊँची संरचनाएँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “अपना बंध,” “अपनी जुड़ी हुई संरचना” अथवा “अपना गुंबद।” इब्रानी शब्द मूलतः किसी बँधी या एक साथ जुड़ी वस्तु को सूचित करता है और यहाँ ब्रह्मांडीय स्थापत्य के बिंब में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנֶה
  choice: वही है जो ... बनाता है
  rationale: संज्ञार्थक क़ाल कृदंत याहवे के विशिष्ट और निरंतर कार्य का वर्णन करता है। हिन्दी का संबंधवाचक वाक्यांश स्तुतिपरक शैली और वर्णनात्मक बल दोनों को बनाए रखता है।
- source_word: מַעֲלוֹתָיו
  choice: अपने ऊपरी कक्ष
  rationale: מַעֲלוֹת ऊँचाइयों, चढ़ाइयों, सीढ़ियों या ऊपरी कमरों को सूचित कर सकता है। यहाँ ब्रह्मांडीय स्थापत्य के संदर्भ में ‘ऊपरी कक्ष’ स्वाभाविक है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: וַאֲגֻדָּתוֹ
  choice: अपनी मेहराबी संरचना
  rationale: אֲגֻדָּה का मूल भाव किसी बँधी या एक साथ जुड़ी वस्तु का है। इस दुर्लभ ब्रह्मांडीय प्रयोग में ‘मेहराबी संरचना’ स्थापत्य-बिंब देता है, पर इसे किसी आधुनिक वैज्ञानिक धारणा में नहीं बदलता।
- source_word: יְסָדָהּ
  choice: की नींव रखता है
  rationale: יסד का अर्थ नींव रखना या स्थापित करना है। हिन्दी में यह मुहावरा सृष्टि-संबंधी स्थापत्य बिंब को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַקֹּרֵא לְמֵי הַיָּם
  choice: जो समुद्र के जल को बुलाता है
  rationale: קרא के साथ לְ यहाँ जल को कार्य के लिए बुलाने या आदेशपूर्वक आह्वान करने का भाव देता है। ‘बुलाता है’ मूल चित्र को सरल और सीधा रखता है।
- source_word: וַיִּשְׁפְּכֵם
  choice: और उसे ... उंडेल देता है
  rationale: שפך का जीवंत अर्थ ‘उंडेलना’ है। हिन्दी में ‘जल’ सामूहिक एकवचन होने के कारण सर्वनाम ‘उसे’ रखा गया है।
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: धरती के ऊपर
  rationale: शाब्दिक भाव ‘धरती के मुख/सतह पर’ है। ‘धरती के ऊपर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए व्यापक फैलाव के चित्र को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: שְׁמוֹ
  choice: उसका नाम ... है
  rationale: यह इब्रानी संज्ञावाक्य पद के अंत में आने वाली चरम पहचान को बनाए रखता है।
theological_decisions:
- issue: מַעֲלוֹתָיו और אֲגֻדָּתוֹ में ब्रह्मांडीय स्थापत्य-बिंब
  choice: ‘ऊपरी कक्ष’ और ‘मेहराबी संरचना’ द्वारा प्राचीन स्थापत्य-बिंब बनाए रखना
  alternative: ‘चढ़ाइयाँ/सीढ़ियाँ’ और ‘बंध/समूह/गुंबद’ जैसे अधिक शाब्दिक या अधिक विशिष्ट रूप
  rationale: पद याहवे को सृष्टिकर्ता और ब्रह्मांड के प्रभु के रूप में प्राचीन स्थापत्य भाषा में चित्रित करता है। चुना हुआ रूप न तो इस चित्र को आधुनिक विज्ञान में बदलता है, न इसकी वास्तविक शब्दगत अनिश्चितता छिपाता है।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा या ‘प्रभु’
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; इसलिए उपाधि से प्रतिस्थापित करने के बजाय उसका लिप्यंतरण किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु पद की स्तुतिपरक गरिमा और काव्यात्मक पंक्ति-विन्यास सुरक्षित रखे गए हैं। ‘ऊपरी कक्ष,’ ‘नींव’ और ‘मेहराबी संरचना’ परस्पर जुड़े स्थापत्य-बिंब बनाते हैं। दुर्लभ इब्रानी शब्दों की अनिश्चितता को मुख्य पाठ में पठनीय विकल्प और पादटिप्पणियों में वास्तविक वैकल्पिक अर्थ देकर सुरक्षित रखा गया है।
