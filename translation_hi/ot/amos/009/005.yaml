  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אדֹנָ֨/י יְהוִ֜ה הַ/צְּבָא֗וֹת הַ/נּוֹגֵ֤עַ בָּ/אָ֨רֶץ֙ וַ/תָּמ֔וֹג וְ/אָבְל֖וּ כָּל י֣וֹשְׁבֵי בָ֑/הּ וְ/עָלְתָ֤ה כַ/יְאֹר֙ כֻּלָּ֔/הּ וְ/שָׁקְעָ֖ה כִּ/יאֹ֥ר מִצְרָֽיִם־
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/005.yaml
  text: And the Lord GOD of hosts is the one who touches the earth[a], and it melts, and all who dwell in it mourn; and all of it rises like the Nile and sinks like the Nile of Egypt.
translation:
  language: hi
  text: और प्रभु याहवे[a], सेनाओं के अधिपति, जो पृथ्वी को छूते हैं—वह पिघल जाती है, और उसके सभी निवासी शोक करते हैं; और पूरी पृथ्वी नील नदी की तरह उठती है और मिस्र की नील नदी की तरह धँस जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में संयुक्त पदवी है: ‘प्रभु YHWH, सेनाओं के अधिपति।’ यहाँ परमेश्वर के व्यक्तिगत नाम YHWH को ‘याहवे’ लिखा गया है।'
    reason: divine_name
lexical_decisions:
- source_word: וַאדֹנָי יְהוִה
  choice: और प्रभु याहवे
  rationale: अदोनाय के लिए ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम YHWH के लिए ‘याहवे’ रखा गया है, जिससे संयुक्त उपाधि और मूल नाम दोनों स्पष्ट रहते हैं।
- source_word: הַצְּבָאוֹת
  choice: सेनाओं के अधिपति
  rationale: यह पदवी याहवे के स्वर्गीय और पार्थिव सैन्य-दलों पर अधिकार को व्यक्त करती है। ‘अधिपति’ आधुनिक हिन्दी में स्वाभाविक है और केवल मानव सेनाओं तक अर्थ को सीमित नहीं करता।
- source_word: הַנּוֹגֵעַ בָּאָרֶץ
  choice: वही हैं जो पृथ्वी को छूते हैं
  rationale: कृदन्त परमेश्वर का वर्णनात्मक गुण प्रस्तुत करता है। ‘छूते हैं’ נגע का सीधा अर्थ रखता है; विनाशकारी परिणाम अगली क्रिया से प्रकट होता है। व्यापक ईश्वर-दर्शनात्मक प्रसंग में אֶרֶץ को ‘पृथ्वी’ किया गया है।
- source_word: וַתָּמוֹג
  choice: और वह पिघल जाती है
  rationale: מוּג के पिघलने, गलने या विघटित होने के सजीव रूपक को सुरक्षित रखा गया है; ‘काँपती है’ सम्भव है, पर रूपक को कमजोर करता है।
- source_word: וְאָבְלוּ כָּל יֹשְׁבֵי בָהּ
  choice: और उसके सभी निवासी शोक करते हैं
  rationale: אבל विपत्ति के कारण शोक को दर्शाता है। ‘निवासी’ हिन्दी में यֹשְׁבֵי בָהּ का सहज और संक्षिप्त रूप है।
- source_word: וְעָלְתָה כַיְאֹר כֻּלָּהּ
  choice: वह सारी की सारी नील नदी के समान उठती है
  rationale: स्त्रीलिंग एकवचन क्रिया का सम्बन्ध पृथ्वी से बना रहता है। כֻּלָּהּ के पूर्ण बल को ‘सारी की सारी’ व्यक्त करता है और יְאֹר यहाँ नील नदी को सूचित करता है।
- source_word: וְשָׁקְעָה כִּיאֹר מִצְרָיִם
  choice: और मिस्र की नील नदी के समान धँस जाती है
  rationale: שׁקע के डूबने या नीचे बैठने के चित्र को ‘धँस जाती है’ व्यक्त करता है। मिस्र का उल्लेख नील नदी की पहचान स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम YHWH का अनुवाद
  choice: याहवे
  alternative: यहोवा; बड़े अक्षरों के संकेत सहित ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יְהוָה सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: הַצְּבָאוֹת की व्यापकता
  choice: सेनाओं के अधिपति
  alternative: स्वर्गीय सेनाओं के अधिपति; सर्वशक्तिमान
  rationale: मूल पदवी में सेनाओं या दलों की छवि बनी रहती है, पर पाठ यह निर्धारित नहीं करता कि केवल स्वर्गीय सेनाएँ अभिप्रेत हैं। ‘सर्वशक्तिमान’ अर्थ की व्याख्या करता, पर मूल रूपक को हटा देता।
- issue: אֶרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश; भूमि
  rationale: सभी निवासियों और नील के समान समूची पृथ्वी के उठने-धँसने का ईश्वर-दर्शनात्मक चित्र व्यापक अर्थ का समर्थन करता है, यद्यपि ‘भूमि’ भाषिक रूप से सम्भव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पिघल जाती है’ और ‘धँस जाती है’ मूल के प्रबल काव्यात्मक चित्रों को बनाए रखते हैं; ‘सारी की सारी’ כֻּלָּהּ के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
