id: AMO.9.9
reference: Amos 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי הִנֵּ֤ה אָֽנֹכִי֙ מְצַוֶּ֔ה וַ/הֲנִע֥וֹתִי בְ/כָֽל הַ/גּוֹיִ֖ם אֶת בֵּ֣ית יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֤ר יִנּ֨וֹעַ֙ בַּ/כְּבָרָ֔ה וְ/לֹֽא יִפּ֥וֹל צְר֖וֹר אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/009.yaml
  text: For look, I am commanding, and I will shake the house of Israel among all the nations, as one shakes with a sieve, yet not a pebble will fall to the ground.
translation:
  language: hi
  text: क्योंकि देखो, मैं आज्ञा दे रहा हूँ, और इस्राएल के घराने को सब राष्ट्रों के बीच ऐसा झकझोरूँगा, जैसे छलनी में झकझोरा जाता है; और एक कंकड़[a] भी भूमि पर नहीं गिरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: छोटी-सी डली। यहाँ प्रयुक्त इब्रानी शब्द का सामान्य अर्थ छोटा पत्थर या कंकड़ है; छलनी के बिंब में उसका ठीक संकेत विवादित है।'
    reason: दुर्लभ और संदर्भगत रूप से कठिन बिंब की वास्तविक शब्दार्थगत अस्पष्टता बताना।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रत्यक्ष उद्गार है; आधुनिक हिन्दी में स्वाभाविक और मूल के बल के अनुरूप है।
- source_word: וַהֲנִעוֹתִי / יִנּוֹעַ
  choice: झकझोरूँगा / झकझोरा जाता है
  rationale: दोनों रूप उसी हिलाने या झकझोरने की क्रिया को दोहराते हैं और छलनी से छानने की तीव्र गति को व्यक्त करते हैं।
- source_word: בְכָל הַגּוֹיִם
  choice: सब राष्ट्रों के बीच
  rationale: यह इस्राएल के घराने के राष्ट्रों में बिखरकर झकझोरे जाने का स्थान या क्षेत्र दर्शाता है; 'के बीच' हिन्दी में इस संबंध को स्वाभाविक रूप से रखता है।
- source_word: כְּבָרָה
  choice: छलनी
  rationale: यह अनाज छानने के उपकरण का सामान्य अर्थ है और उपमा को स्पष्ट रखता है।
- source_word: צְרוֹר
  choice: कंकड़
  rationale: यहाँ शब्द किसी छोटी ठोस वस्तु, विशेषकर छोटे पत्थर, को सूचित करता है; 'कंकड़' मूल बिंब को बिना धर्मवैज्ञानिक निष्कर्ष थोपे बनाए रखता है।
theological_decisions:
- issue: छलनी के बिंब में किसका बचना या गिरना अभिप्रेत है
  choice: मूल कथन को 'एक कंकड़ भी भूमि पर नहीं गिरेगा' के रूप में यथावत रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से 'एक भी सच्चा दाना नष्ट नहीं होगा' या 'एक भी पापी बच नहीं पाएगा' कहा जा सकता था।
  rationale: संदर्भ न्याय और संरक्षण दोनों की ओर संकेत कर सकता है, जबकि पद का बिंब संक्षिप्त और तनावपूर्ण है। अनुवाद किसी एक धर्मवैज्ञानिक पहचान को कंकड़ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'घराना', 'राष्ट्र', 'छलनी' और 'भूमि' सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल की पुनरुक्ति और न्याय-संबंधी तनाव सुरक्षित हैं।
