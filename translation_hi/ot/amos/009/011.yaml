base_translation:
  language: en
  yaml_path: translation/ot/amos/009/011.yaml
  text: In that day I will raise up the fallen shelter of David[a], and I will wall up its breaches[c][b], and I will raise up its ruins and rebuild it as in the days of old.
translation:
  language: hi
  text: उस दिन मैं दाऊद की गिरी हुई झोंपड़ी[a] को फिर खड़ा करूँगा। मैं उसके टूटे हुए खुले भागों[b] को बंद कर दूँगा, उसके ध्वस्त भागों को फिर खड़ा करूँगा और उसे प्राचीन दिनों के समान फिर से बनाऊँगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दाऊद की गिरी हुई कुटी’; परंपरागत अनुवादों में ‘दाऊद का तंबू’। यहाँ प्रयुक्त इब्रानी शब्द अस्थायी छप्पर या झोंपड़ी को दर्शाता है और संभवतः दाऊद के गिरे हुए राजघराने या राज्य का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी दरारों को भर दूँगा’ अथवा ‘उसके टूटे हुए भागों की मरम्मत करूँगा’।
    reason: lexical_alternative
  - marker: c
    text: ‘प्राचीन दिनों के समान’ का आशय पुराने या बहुत पहले के दिनों से है; यहाँ इसका अर्थ आवश्यक रूप से अमूर्त अनंतता नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक पदबंध है और समय को अधिक निश्चित किए बिना मूल अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: אָקִים
  choice: फिर खड़ा करूँगा
  rationale: हिफ़ील रूप का ठोस अर्थ ‘खड़ा करना’ है। ‘फिर’ पुनर्स्थापना के प्रसंग को स्वाभाविक बनाता है और पद में दोहराए गए निर्माण-बिंब को बनाए रखता है।
- source_word: סֻכַּת דָּוִיד
  choice: दाऊद की ... झोंपड़ी
  rationale: סֻכָּה अस्थायी छप्पर, कुटी या झोंपड़ी को सूचित करता है। ‘झोंपड़ी’ मूल के नाजुक ढाँचे के बिंब को बनाए रखती है और इसे सीधे ‘राजवंश’ या धार्मिक अर्थ वाले ‘मिलापवाले तंबू’ में नहीं बदलती।
- source_word: הַנֹּפֶלֶת
  choice: गिरी हुई
  rationale: शाब्दिक रूप से यह ‘गिरती हुई’ कृदंत है; पुनर्निर्माण के संदर्भ में ‘गिरी हुई’ ढह चुकी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְגָדַרְתִּי אֶת פִּרְצֵיהֶן
  choice: मैं उसकी दरारों को भर दूँगा
  rationale: גדר दीवार या घेरा लगाकर बंद करने और פֶּרֶץ टूटे हुए खुले भाग को दर्शाता है। ‘दरारों को भर दूँगा’ आधुनिक हिन्दी में मरम्मत का ठोस बिंब देता है, जबकि ‘बाड़ लगाऊँगा’ यहाँ कम स्वाभाविक होता।
- source_word: וַהֲרִסֹתָיו
  choice: उसके खंडहरों
  rationale: הריסה ध्वस्त या उजड़े स्थान को बताता है। ‘खंडहर’ स्थापत्य-विनाश और पुनर्स्थापना दोनों के प्रसंग में स्पष्ट तथा स्वाभाविक है।
- source_word: וּבְנִיתִיהָ
  choice: उसे ... फिर से बनाऊँगा
  rationale: मूल क्रिया ‘बनाना’ है, पर ध्वंस के बाद निर्माण के संदर्भ में ‘फिर से बनाना’ अपेक्षित पुनर्निर्माण को स्पष्ट करता है।
- source_word: כִּימֵי עוֹלָם
  choice: प्राचीन दिनों के समान
  rationale: यहाँ עוֹלָם बीते हुए प्राचीन काल को सूचित करता है, अमूर्त अनंतता को आवश्यक रूप से नहीं।
theological_decisions:
- issue: ‘दाऊद की झोंपड़ी’ का अभिप्राय
  choice: ठोस और नाजुक झोंपड़ी का रूपक ज्यों का त्यों रखा गया है, जो दाऊद के गिरे हुए राजघराने या राज्य की ओर संकेत कर सकता है।
  alternative: इसे सीधे ‘दाऊद का राजवंश’, किसी शाब्दिक उपासना-तंबू, या स्पष्ट मसीही पदवी के रूप में अनूदित करना।
  rationale: हिब्रू पाठ दाऊद से जुड़े पुनर्स्थापन को झोंपड़ी के बिंब में व्यक्त करता है। अनुवाद इस संकेत को बनाए रखता है, पर उसकी धर्मवैज्ञानिक पूर्ति को पाठ में जोड़कर अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज भविष्यवाणी-शैली अपनाई गई है। ‘झोंपड़ी’, ‘दरारों’ और ‘खंडहरों’ द्वारा मूल निर्माण तथा पुनर्स्थापना के बिंब को बनाए रखा गया है। सर्वनामों को हिन्दी में एकवचन संरचना के अनुसार स्वाभाविक किया गया है।
