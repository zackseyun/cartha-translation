source:
  edition: WLC
  text: הִנֵּ֞ה עֵינֵ֣י אֲדֹנָ֣/י יְהוִ֗ה בַּ/מַּמְלָכָה֙ הַֽ/חַטָּאָ֔ה וְ/הִשְׁמַדְתִּ֣י אֹתָ֔/הּ מֵ/עַ֖ל פְּנֵ֣י הָ/אֲדָמָ֑ה אֶ֗פֶס כִּ֠י לֹ֣א הַשְׁמֵ֥יד אַשְׁמִ֛יד אֶת בֵּ֥ית יַעֲקֹ֖ב נְאֻם יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/008.yaml
  text: Look[a], the eyes of the Lord GOD are on the sinful kingdom, and I will destroy it from the face of the earth. Yet I will not utterly destroy the house of Jacob," declares Yahweh.
translation:
  language: hi
  text: देखो, प्रभु याहवे की आँखें उस पापी राज्य पर लगी हैं, और मैं उसे धरती पर से नष्ट कर दूँगा। फिर भी, मैं याकूब के घराने को पूरी तरह नष्ट नहीं करूँगा[a]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में मुख्य क्रिया के साथ उसी धातु का एक विशेष अनन्त-रूप प्रयुक्त हुआ है, जो इस बात पर बल देता है कि याकूब के घराने का पूर्ण विनाश नहीं होगा।
    reason: मूल भाषा में infinitive absolute और finite verb के संयुक्त बल को स्पष्ट करना
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्घोषणात्मक अव्यय है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी गंभीरता बनाए रखता है।
- source_word: עֵינֵי אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की दृष्टि
  rationale: शाब्दिक ‘आँखें’ के स्थान पर हिन्दी मुहावरे के अनुसार ‘दृष्टि’ दिव्य निगरानी और न्याय के लिए केंद्रित ध्यान को व्यक्त करती है; संयुक्त उपाधि में दोनों तत्व सुरक्षित हैं।
- source_word: בַּמַּמְלָכָה הַחַטָּאָה
  choice: इस पापी राज्य पर
  rationale: निर्दिष्ट लेख को ‘इस’ से व्यक्त किया गया है और विशेषणात्मक वाक्यांश को संक्षेप में ‘पापी राज्य’ कहा गया है; ‘पर’ न्याय के लिए लगी दृष्टि का संकेत देता है।
- source_word: וְהִשְׁמַדְתִּי אֹתָהּ
  choice: मैं इसे ... नष्ट कर दूँगा
  rationale: हिफ़ील रूप विनाश अथवा मिटा दिए जाने को बताता है; ‘नष्ट कर दूँगा’ बलवान है, पर विनाश की विधि अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से
  rationale: यह हिन्दी में स्वाभाविक रूप से धरती की सतह से हटा दिए जाने का भाव देता है और हिब्रू मुहावरे का अर्थ सुरक्षित रखता है।
- source_word: אֶפֶס כִּי
  choice: फिर भी
  rationale: यह पहले घोषित न्याय पर एक प्रबल सीमा लगाते हुए विरोधात्मक मोड़ प्रस्तुत करता है।
- source_word: לֹא הַשְׁמֵיד אַשְׁמִיד
  choice: मैं पूरी तरह नष्ट नहीं करूँगा
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का संयोजन बल देता है; निषेध के साथ यह पूर्ण विनाश को दृढ़ता से नकारता है।
- source_word: בֵּית יַעֲקֹב
  choice: याकूब का घराना
  rationale: यह याकूब से निकले लोगों के लिए वाचा-संबंधी राष्ट्रीय अभिव्यक्ति है; ‘घराना’ हिन्दी में सामूहिक वंश का स्वाभाविक संकेत है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह नबी-संबंधी प्रामाणिक घोषणा-सूत्र को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा दिव्य नाम को नाम के रूप में रखता है।
theological_decisions:
- issue: एक ही पद में אֲדֹנָי יְהוִה और अकेले יְהוָה का अनुवाद
  choice: ‘प्रभु याहवे’ और ‘याहवे’
  alternative: ‘प्रभु परमेश्वर’ और ‘यहोवा’ अथवा दोनों स्थानों पर उपाधि-आधारित रूप
  rationale: पहले प्रयोग में אֲדֹנָי की उपाधि और יהוה का व्यक्तिगत दिव्य नाम दोनों बनाए गए हैं; अंतिम सूत्र में दिव्य नाम सीधे रखा गया है।
- issue: राज्य के विनाश और याकूब के घराने के संरक्षण के बीच तनाव
  choice: पापी राज्य का विनाश, पर याकूब के घराने का पूर्ण विनाश नहीं
  alternative: दूसरे कथन को केवल कम कठोर दंड के रूप में सामान्यीकृत करना
  rationale: हिब्रू पाठ कठोर न्याय को घोषित करते हुए कुल विनाश को स्पष्टतः नकारता है; अनुवाद दोनों बातों को बिना मिलाए साथ रखता है।
- issue: निषेध के साथ क्रियार्थक संज्ञा का बल
  choice: ‘पूरी तरह नष्ट नहीं करूँगा’
  alternative: ‘निश्चय ही नष्ट नहीं करूँगा’
  rationale: संदर्भ में बल इस बात पर है कि विनाश पूर्ण नहीं होगा; चुना गया रूप आंशिक न्याय की संभावना को बनाए रखते हुए समूल विनाश का निषेध स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दृष्टि लगी हुई है’ शाब्दिक ‘आँखें ... पर हैं’ की अपेक्षा स्वाभाविक हिन्दी है, जबकि न्यायपूर्ण निगरानी का भाव बनाए रखती है। दिव्य नाम ‘याहवे’ का लिप्यंतरण किया गया है।
