reference: Amos 9:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֣וֹא כִ/בְנֵי֩ כֻשִׁיִּ֨ים אַתֶּ֥ם לִ֛/י בְּנֵ֥י יִשְׂרָאֵ֖ל נְאֻם יְהוָ֑ה הֲ/ל֣וֹא אֶת יִשְׂרָאֵ֗ל הֶעֱלֵ֨יתִי֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם וּ/פְלִשְׁתִּיִּ֥ים מִ/כַּפְתּ֖וֹר וַ/אֲרָ֥ם מִ/קִּֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/007.yaml
  text: Are you not like the Cushites to me[a], O sons of Israel? declares Yahweh. Did I not bring up Israel from the land of Egypt, and the Philistines from Caphtor[c][b], and Aram from Kir?
translation:
  language: hi
  text: “हे इस्राएल के पुत्रों, क्या तुम मेरे लिए कूशियों[a] के समान नहीं हो?” याहवे की यह घोषणा है। “क्या मैं इस्राएल को मिस्र देश से, पलिश्तियों को कप्तोर[b] से और अराम को कीर से[c] निकालकर नहीं लाया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इथियोपियावासियों”; इब्रानी में “कूशी,” अर्थात कूश देश के लोग।
    reason: lexical_alternative
  - marker: b
    text: कप्तोर एक स्थान का नाम है। बहुत-से लोग परम्परागत रूप से इसे क्रेते से जोड़ते हैं, पर इसकी ठीक पहचान विवादित है।
    reason: cultural_note
  - marker: c
    text: या, “अरामियों को कीर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: दोनों स्थानों पर यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है; आधुनिक हिन्दी में ‘क्या ... नहीं’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִבְנֵי כֻשִׁיִּים
  choice: कूशियों के समान
  rationale: כ तुलना सूचित करता है और בְּנֵי यहाँ किसी जातीय समुदाय के लिए मुहावरेदार प्रयोग है। ‘कूशी’ मूल इब्रानी जाति-भौगोलिक नाम को सुरक्षित रखता है।
- source_word: אַתֶּם לִי
  choice: तुम मेरे लिए
  rationale: לִי याहवे के साथ संबंध अथवा उनके परिप्रेक्ष्य को व्यक्त करता है। ‘मेरे लिए’ मूल की सीधी अभिव्यक्ति और उसकी तीक्ष्णता को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: हे इस्राएल के पुत्रो
  rationale: सम्बोधन और मूल के पुल्लिंग बहुवचन रूप, दोनों को सुरक्षित रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह मानक भविष्यद्वक्ताई सूत्र है; ‘घोषणा’ उसके औपचारिक और गंभीर बल को व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: הֶעֱלֵיתִי
  choice: निकालकर ... लाया
  rationale: हिफ़ील क्रिया किसी स्थान से लोगों को ले आने को दर्शाती है। हिन्दी में यही वाक्यांश तीनों समानांतर ऐतिहासिक स्थानांतरणों के लिए स्वाभाविक है, यद्यपि इब्रानी में ‘ऊपर लाने’ का शाब्दिक भाव भी उपस्थित है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: मूल में आए ‘देश’ संज्ञा को बनाए रखते हुए स्वाभाविक हिन्दी क्रम अपनाया गया है।
- source_word: פְלִשְׁתִּיִּים
  choice: पलिश्तियों
  rationale: इस जाति के लिए प्रचलित हिन्दी बाइबलीय नाम है।
- source_word: כַּפְתּוֹר
  choice: कप्तोर
  rationale: स्थान की पहचान विवादित होने के कारण मूल नाम का लिप्यंतरण किया गया है, उसे निश्चित रूप से क्रेते नहीं कहा गया।
- source_word: אֲרָם
  choice: अराम
  rationale: इब्रानी शब्द क्षेत्र अथवा उसके लोगों को सूचित कर सकता है। मुख्य पाठ में नाम को बनाए रखकर यह अस्पष्टता अनावश्यक रूप से समाप्त नहीं की गई।
- source_word: קִיר
  choice: कीर
  rationale: स्थान-नाम का सीधा हिन्दी लिप्यंतरण है।
theological_decisions:
- issue: इस्राएल और कूशियों के बीच तुलना का बल
  choice: 'तुलना को सीधे और बिना नरम किए रखा गया है: इस्राएल याहवे के लिए कूशियों के समान है।'
  alternative: तुलना को केवल भौगोलिक विस्थापन तक सीमित मानना।
  rationale: अलंकारिक प्रश्न इस्राएल के जातीय अथवा निर्गमन-आधारित विशेषाधिकार के दावे को चुनौती देता है, और अगला वाक्य अन्य जातियों के स्थानांतरण में भी याहवे की सक्रियता दिखाता है। अनुवाद इस धर्मवैज्ञानिक तनाव को समझाकर समाप्त नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: हे इस्राएल के पुत्रो
  alternative: हे इस्राएल के लोगो / हे इस्राएल की सन्तानो
  rationale: मूल का सम्बोधन और व्याकरणिक रूप सुरक्षित रखा गया है, जबकि वाक्य आधुनिक हिन्दी में बोधगम्य बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्ताई शैली रखी गई है। दोनों अलंकारिक प्रश्न स्पष्ट हैं; जातीय और स्थान-नामों का लिप्यंतरण किया गया है। ‘मेरे लिए’ मूल संबंधसूचक अभिव्यक्ति की सीधाई बनाए रखता है, और ‘निकालकर ... लाया’ तीनों समानांतर खंडों में स्वाभाविक हिन्दी देता है।
