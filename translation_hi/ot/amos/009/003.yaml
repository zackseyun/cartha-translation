  text: וְ/אִם יֵחָֽבְאוּ֙ בְּ/רֹ֣אשׁ הַ/כַּרְמֶ֔ל מִ/שָּׁ֥ם אֲחַפֵּ֖שׂ וּ/לְקַחְתִּ֑י/ם וְ/אִם יִסָּ֨תְר֜וּ מִ/נֶּ֤גֶד עֵינַ/י֙ בְּ/קַרְקַ֣ע הַ/יָּ֔ם מִ/שָּׁ֛ם אֲצַוֶּ֥ה אֶת הַ/נָּחָ֖שׁ וּ/נְשָׁכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/003.yaml
  text: And if they hide themselves on the summit of Carmel[a], from there I will search them out and take them; and if they conceal themselves from before my eyes on the floor of the sea, from there I will command the serpent[b], and it will bite them.
translation:
  language: hi
  text: और यदि वे कर्मेल की चोटी पर छिप जाएँ, तो वहाँ से मैं उन्हें ढूँढ़ निकालूँगा और ले लूँगा; और यदि वे मेरी आँखों के सामने से समुद्र की तलहटी[a] में जा छिपें, तो वहाँ से मैं सर्प[b] को आज्ञा दूँगा, और वह उन्हें डस लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र के तल पर।”
    reason: lexical_alternative
  - marker: b
    text: या, “साँप।” इब्रानी संज्ञा दोनों रूपों में अनूदित की जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵחָבְאוּ
  choice: छिप जाएँ
  rationale: निफ़ाल रूप यहाँ जान-बूझकर स्वयं को छिपाने का भाव देता है; आधुनिक हिन्दी में ‘छिप जाएँ’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּרֹאשׁ הַכַּרְמֶל
  choice: कर्मेल की चोटी पर
  rationale: רֹאשׁ का स्थानगत अर्थ यहाँ ‘चोटी’ है। ‘कर्मेल’ को मूल पाठ के अनुसार स्थान-नाम ही रखा गया है, उसमें ‘पर्वत’ नहीं जोड़ा गया।
- source_word: אֲחַפֵּשׂ
  choice: ढूँढ़ निकालूँगा
  rationale: पिएल रूप गहन और सफल खोज का संकेत देता है; ‘ढूँढ़ निकालूँगा’ साधारण ‘ढूँढ़ूँगा’ से अधिक स्पष्ट रूप से उस बल को व्यक्त करता है।
- source_word: וּלְקַחְתִּים
  choice: और पकड़ लूँगा
  rationale: לקח का मूल अर्थ व्यापक रूप से ‘लेना’ है, पर न्याय और पीछा करने के इस प्रसंग में हिन्दी का ‘पकड़ लेना’ अभिप्रेत हिरासत को स्वाभाविक रूप से व्यक्त करता है, बिना दंड की रीति जोड़े।
- source_word: יִסָּתְרוּ
  choice: जा छिपें
  rationale: סתר छिपने या ओझल होने को दर्शाता है। पहले प्रयुक्त छिपने के क्रिया-भाव से हिन्दी में पूर्ण कृत्रिम भेद करने के बजाय ‘जा छिपें’ समुद्र की तलहटी तक पहुँचकर ओझल होने का स्वाभाविक भाव देता है।
- source_word: מִנֶּגֶד עֵינַי
  choice: मेरी आँखों के सामने से
  rationale: यह चयन मूल की सजीव, मानवरूपी अभिव्यक्ति को सुरक्षित रखता है और उसे केवल अमूर्त ‘मेरी दृष्टि से’ में नहीं बदलता।
- source_word: בְּקַרְקַע הַיָּם
  choice: समुद्र की तलहटी में
  rationale: קַרְקַע भूमि, तल या फर्श को सूचित करता है। ‘समुद्र की तलहटी’ आधुनिक हिन्दी में स्वाभाविक है और समुद्र के सबसे निचले स्थान की छवि बनाए रखता है।
- source_word: אֲצַוֶּה
  choice: मैं ... आज्ञा दूँगा
  rationale: צוה का सामान्य अर्थ ‘आज्ञा देना’ है; इससे जीव पर परमेश्वर के प्रत्यक्ष अधिकार का कथन बना रहता है।
- source_word: הַנָּחָשׁ
  choice: सर्प
  rationale: נָחָשׁ साँप अथवा सर्प को सूचित करता है। ‘सर्प’ भविष्यद्वाणी की गरिमामय शैली के अनुकूल है, पर इससे उत्पत्ति की किसी विशिष्ट प्रतीकात्मक व्याख्या को अनिवार्य नहीं किया गया।
- source_word: וּנְשָׁכָם
  choice: वह उन्हें डस लेगा
  rationale: נשׁך का अर्थ काटना या डसना है। विषैले सर्प के प्रसंग में ‘डसना’ स्वाभाविक हिन्दी है, और एकवचन ‘वह’ कर्ता को स्पष्ट रखता है।
theological_decisions:
- issue: मानवरूपी भाषा द्वारा परमेश्वर की सर्वदृष्टि और अपरिहार्य न्याय
  choice: ‘मेरी आँखों के सामने से’ की ठोस अभिव्यक्ति बनाए रखी गई।
  alternative: ‘मेरी दृष्टि से’ या ‘मेरी नज़र से’
  rationale: पद यह घोषित करता है कि कोई स्थान परमेश्वर की खोज और न्याय की पहुँच से बाहर नहीं। मूल की आँखों वाली सजीव भाषा को बनाए रखने से यह बल सुरक्षित रहता है और पाठ में अतिरिक्त दार्शनिक व्याख्या नहीं जोड़ी जाती।
- issue: इस पद में वक्ता के लिए परमेश्वर का नाम न जोड़ना
  choice: मूल के अनुसार प्रथम पुरुष में ‘मैं’ वाली वाणी रखी गई।
  alternative: स्पष्टता के लिए ‘यहोवा’ या ‘प्रभु’ जोड़ना
  rationale: यह आसपास के पदों से जारी दिव्य वाणी है, किंतु इस पद में नाम दोहराया नहीं गया; इसलिए उसे जोड़ना मूल से अधिक विस्तार होता।
- issue: सर्प की छवि का धर्मवैज्ञानिक अति-निर्धारण न करना
  choice: הַנָּחָשׁ का अनुवाद सामान्य जीववाचक ‘सर्प’ किया गया।
  alternative: इसे किसी विशिष्ट आदिम या दुष्ट आत्मिक सत्ता का संकेत मानकर अनुवाद करना
  rationale: इस प्रसंग में पाठ समुद्र में स्थित एक काटने वाले जीव की बात करता है। शब्द को उसकी सामान्य अर्थ-सीमा में रखने से अनावश्यक प्रतीकात्मक सिद्धांत आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कर्मेल’ को स्थान-नाम के रूप में रखा गया है; ‘सर्प’ भविष्यद्वाणी के ऊँचे किंतु सहज रजिस्टर के अनुकूल है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘Carmel’ के बाद दिखता है, जबकि उसकी टिप्पणी स्पष्टतः ‘समुद्र की तलहटी’ से संबंधित है; हिन्दी मसौदे में चिह्न उसी संबद्ध पदांश के बाद सही स्थान पर रखा गया है।
