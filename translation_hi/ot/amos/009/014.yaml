source:
  edition: WLC
  text: וְ/שַׁבְתִּי֮ אֶת שְׁב֣וּת עַמִּ֣/י יִשְׂרָאֵל֒ וּ/בָנ֞וּ עָרִ֤ים נְשַׁמּוֹת֙ וְ/יָשָׁ֔בוּ וְ/נָטְע֣וּ כְרָמִ֔ים וְ/שָׁת֖וּ אֶת יֵינָ֑/ם וְ/עָשׂ֣וּ גַנּ֔וֹת וְ/אָכְל֖וּ אֶת פְּרִי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/014.yaml
  text: I will restore the fortunes of my people Israel[a], and they will rebuild ruined cities and inhabit them; they will plant vineyards and drink their wine; they will make gardens and eat their fruit.
translation:
  language: hi
  text: मैं अपनी प्रजा इस्राएल की दशा बहाल कर दूँगा[a]। वे उजड़े हुए नगरों को फिर से बनाएँगे और उनमें बसेंगे; वे अंगूर के बाग लगाएँगे और उनका दाखरस पीएँगे; वे बगीचे बनाएँगे और उनका फल खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपनी प्रजा इस्राएल के बंदियों को लौटा लाऊँगा” अथवा “मैं अपनी प्रजा इस्राएल की बंधुआई को बहाल कर दूँगा।” इब्रानी पुनर्स्थापना-सूत्र बंधुआई से वापसी और विपत्ति की दशा के व्यापक रूप से पलट जाने—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁבְתִּי אֶת שְׁבוּת
  choice: दशा फिर से सुधार दूँगा
  rationale: यह इब्रानी पुनर्स्थापना-सूत्र विपत्ति के पलटने और बंधुआई से लौटने, दोनों का संकेत दे सकता है। मुख्य पाठ में यह चुनाव व्यापक बहाली को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अधिक शाब्दिक संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह वाचा-संबंधी पदनाम को सीधे बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: וּבָנוּ עָרִים נְשַׁמּוֹת
  choice: उजड़े हुए नगरों को फिर से बनाएँगे
  rationale: क्रिया शाब्दिक रूप से ‘बनाना’ है, पर उजड़े नगरों के संदर्भ में ‘फिर से बनाएँगे’ पुनर्निर्माण का भाव स्पष्ट करता है। נְשַׁמּוֹת के लिए ‘उजड़े हुए’ विनाश और वीरानी दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְיָשָׁבוּ
  choice: उनमें बसेंगे
  rationale: ישׁב यहाँ नगरों में रहने या बसने को दर्शाता है; ‘बसेंगे’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
- source_word: וְנָטְעוּ כְרָמִים
  choice: अंगूर के बाग लगाएँगे
  rationale: כְרָמִים का सामान्य आधुनिक हिन्दी समतुल्य ‘अंगूर के बाग’ है।
- source_word: וְשָׁתוּ אֶת יֵינָם
  choice: उनकी दाखमधु पिएँगे
  rationale: प्रत्यय निकटवर्ती अंगूर के बागों की उपज की ओर संकेत करता है। ‘दाखमधु’ יַיִן का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: וְעָשׂוּ גַנּוֹת
  choice: बगीचे लगाएँगे
  rationale: यद्यपि עשה का मूल अर्थ ‘बनाना’ है, हिन्दी में बगीचे के साथ ‘लगाना’ अधिक स्वाभाविक है और कृषि-पुनर्बहाली के चित्र को बनाए रखता है।
- source_word: וְאָכְלוּ אֶת פְּרִיהֶם
  choice: उनका फल खाएँगे
  rationale: प्रत्यय बगीचों की ओर लौटता है; ‘फल’ פְּרִי का सीधा और सहज समतुल्य है।
theological_decisions:
- issue: שׁוּב שְׁבוּת पुनर्स्थापना-सूत्र का अर्थ
  choice: अपनी प्रजा इस्राएल की दशा फिर से सुधार दूँगा
  alternative: अपनी प्रजा इस्राएल के बंधुओं को लौटा लाऊँगा / अपनी प्रजा इस्राएल की बंधुआई पलट दूँगा
  rationale: सूत्र व्यापक विपत्ति-पलटाव के साथ निर्वासन या बंधुआई से वापसी का भी भाव रख सकता है। अगले वाक्यांश नगरों, निवास और खेती की समग्र बहाली दिखाते हैं; इसलिए मुख्य पाठ व्यापक अर्थ रखता है, जबकि अधिक शाब्दिक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। समानांतर कृषि-वाक्यांशों और भविष्यकालीन पुनर्स्थापना की लय को सुरक्षित रखा गया है।
