source:
  edition: WLC
  text: רָאִ֨יתִי אֶת אֲדֹנָ֜/י נִצָּ֣ב עַֽל הַ/מִּזְבֵּ֗חַ וַ/יֹּאמֶר֩ הַ֨ךְ הַ/כַּפְתּ֜וֹר וְ/יִרְעֲשׁ֣וּ הַ/סִּפִּ֗ים וּ/בְצַ֨עַ/ם֙ בְּ/רֹ֣אשׁ כֻּלָּ֔/ם וְ/אַחֲרִיתָ֖/ם בַּ/חֶ֣רֶב אֶהֱרֹ֑ג לֹֽא יָנ֤וּס לָ/הֶם֙ נָ֔ס וְ/לֹֽא יִמָּלֵ֥ט לָ/הֶ֖ם פָּלִֽיט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/009/001.yaml
  text: 'I saw the Lord standing beside the altar[a], and he said: Strike the capital, so that the thresholds may shake; shatter them on the heads of all of them. And I will kill their survivors with the sword; not one who flees among them will get away[d][c][b], and not one who escapes among them will be delivered.'
translation:
  language: hi
  text: 'मैंने प्रभु को वेदी[a] के पास खड़े देखा। उन्होंने कहा,


    “स्तंभ-शीर्ष[b] पर प्रहार कर, ताकि देहलियाँ काँप उठें;

    उन्हें उन सबके सिरों पर तोड़ दे[c]।

    उनके बचे हुओं को मैं तलवार से मार डालूँगा[d]।

    उनमें से कोई भागनेवाला बच नहीं पाएगा,

    और उनमें से कोई बच निकलनेवाला बचाया नहीं जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेदी पर खड़े।” इब्रानी संबंधबोधक शब्द का अर्थ “पर” हो सकता है, पर दृश्य में वेदी के पास न्याय के लिए खड़ा होना भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऊपरी सिरे पर” अथवा “कलश पर।” इब्रानी शब्द भवन के सबसे ऊपर के स्थापत्य भाग को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी वाक्य कठिन है; अधिक शाब्दिक रूप से, “उन्हें उन सबके सिर पर तोड़ दे।” आशय संभवतः यह है कि टूटे हुए भवन के भाग वहाँ उपस्थित सब लोगों पर गिर पड़ें।
    reason: textual_difficulty
  - marker: d
    text: या “उनके शेष लोगों को।” यहाँ संदर्भ आरंभिक विनाश के बाद जीवित बचे लोगों की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ परमेश्वर के सार्वभौम अधिकार को व्यक्त करने वाली उपाधि है, वाचा का नाम YHWH नहीं; इसलिए स्वाभाविक हिन्दी में ‘प्रभु’ उपयुक्त है।
- source_word: נִצָּב עַל הַמִּזְבֵּחַ
  choice: वेदी के पास खड़े
  rationale: נִצָּב स्थिर होकर खड़े होने का बोध देता है। עַל का अर्थ यहाँ ‘पर’ भी हो सकता है, पर न्याय के लिए वेदी के निकट खड़े होने का दृश्य हिन्दी में ‘के पास’ से स्वाभाविक बनता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַךְ הַכַּפְתּוֹר
  choice: स्तंभ-शीर्ष पर प्रहार कर
  rationale: הַךְ एक बलपूर्ण आज्ञा है। כַּפְתּוֹר यहाँ भवन के ऊपरी सजावटी अथवा संरचनात्मक भाग को सूचित करता है; ‘स्तंभ-शीर्ष’ सामान्य पाठक के लिए स्थापत्य अर्थ स्पष्ट करता है।
- source_word: הַסִּפִּים
  choice: देहलियाँ
  rationale: शब्द द्वार की चौखट के निचले भाग अथवा देहली को सूचित कर सकता है। ‘देहलियाँ’ भवन के काँपने और ढहने के चित्र के अनुकूल है।
- source_word: וּבְצַעַם בְּרֹאשׁ כֻּלָּם
  choice: उन्हें तोड़कर उन सबके सिरों पर गिरा दे
  rationale: यह कठिन इब्रानी वाक्यांश संरचना को तोड़ने और उसके नीचे उपस्थित लोगों पर उसके गिरने का बोध देता है। ‘गिरा दे’ निहित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि कठिन शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְאַחֲרִיתָם
  choice: उनके बचे हुओं
  rationale: इस सर्वनाशकारी न्याय-संदर्भ में इसका आशय आरंभिक विध्वंस के बाद जीवित बचे लोगों से है, न कि आशापूर्ण ‘बचे हुए समुदाय’ से।
- source_word: לֹא יָנוּס לָהֶם נָס
  choice: उनमें से भागनेवाला कोई भी बचकर नहीं निकल पाएगा
  rationale: इब्रानी में भागने से जुड़े सजातीय शब्दों की पुनरुक्ति है। हिन्दी में अर्थ और जोर को सहज ढंग से व्यक्त किया गया है।
- source_word: וְלֹא יִמָּלֵט לָהֶם פָּלִיט
  choice: उनमें से बच निकलनेवाला कोई भी नहीं बचेगा
  rationale: दूसरी समानांतर पंक्ति पूर्णतः बचाव की असंभवता पर बल देती है; हिन्दी में पहले कथन से पर्याप्त भिन्नता रखते हुए समानांतरता बनाए रखी गई है।
theological_decisions:
- issue: दर्शन में प्रयुक्त ईश्वरीय उपाधि
  choice: प्रभु
  alternative: स्वामी
  rationale: אֲדֹנָי इस पद में इस्राएल के सार्वभौम न्यायी की उपाधि है। ‘प्रभु’ प्रचलित, गरिमापूर्ण और धार्मिक रूप से तटस्थ अनुवाद है तथा इसे YHWH के विशिष्ट नाम के साथ नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष भविष्यद्वाणी-संबंधी स्वर रखा गया है। स्थापत्य शब्दावली को सामान्य पाठक के लिए स्पष्ट बनाया गया है, कठिन इब्रानी वाक्यांश की अनिश्चितता पादटिप्पणी में सुरक्षित है, और दैवी न्याय की कठोरता को नरम नहीं किया गया।
