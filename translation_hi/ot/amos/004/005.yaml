source:
  edition: WLC
  text: וְ/קַטֵּ֤ר מֵֽ/חָמֵץ֙ תּוֹדָ֔ה וְ/קִרְא֥וּ נְדָב֖וֹת הַשְׁמִ֑יעוּ כִּ֣י כֵ֤ן אֲהַבְתֶּם֙ בְּנֵ֣י יִשְׂרָאֵ֔ל נְאֻ֖ם אֲדֹנָ֥/י יְהוִֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/005.yaml
  text: And burn a thank offering from leavened bread[a], and proclaim freewill offerings—announce them! For this is what you have loved, O sons of Israel[b], declares the Lord GOD.
translation:
  language: hi
  text: खमीरयुक्त सामग्री के साथ धन्यवाद-बलि जलाकर चढ़ाओ[a]; स्वेच्छा-बलियों की घोषणा करो—उन्हें सुनाओ! क्योंकि, हे इस्राएल के पुत्रो[b], तुमने यही चाहा है—प्रभु याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘खमीर से’ या ‘खमीरयुक्त रोटी की’ भी हो सकता है; इब्रानी वाक्यांश धन्यवाद-बलि को खमीरयुक्त सामग्री से जोड़ता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַטֵּר
  choice: जलाकर चढ़ाओ
  rationale: पिएल आज्ञार्थक वेदी पर बलि को इस प्रकार जलाने का बोध कराता है कि उसका धुआँ ऊपर उठे। ‘जलाकर चढ़ाओ’ हिन्दी में याजकीय क्रिया को स्वाभाविक ढंग से व्यक्त करता है और प्रसंग की व्यंग्यपूर्ण आज्ञा बनाए रखता है।
- source_word: מֵחָמֵץ
  choice: खमीर उठी रोटी से
  rationale: חָמֵץ खमीर या खमीर उठी सामग्री को सूचित करता है। מִן के संबंध को ‘से’ द्वारा रखा गया है; वाक्यांश धन्यवाद-बलि के साथ खमीरयुक्त सामग्री को जोड़ता है, पर उस संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: תּוֹדָה
  choice: धन्यवाद-बलि
  rationale: यहाँ תּוֹדָה सामान्य धन्यवाद नहीं, बल्कि धन्यवाद के अवसर पर चढ़ाई जाने वाली विशिष्ट बलि है।
- source_word: נְדָבוֹת
  choice: स्वेच्छा-बलियाँ
  rationale: यह उन बलियों का प्रचलित याजकीय अर्थ है जिन्हें व्यक्ति अपनी इच्छा से चढ़ाता है।
- source_word: וְקִרְאוּ ... הַשְׁמִיעוּ
  choice: घोषणा करो—उनका प्रचार करो
  rationale: दोनों बहुवचन आज्ञाओं की सार्वजनिक उद्घोषणा की तीव्रता और जानबूझकर दोहराव सुरक्षित रखा गया है।
- source_word: כִּי כֵן אֲהַבְתֶּם
  choice: क्योंकि ... तुमने इसी को चाहा है
  rationale: यह रूप इस्राएल की जमी हुई पसंद पर आरोप लगाता है। ‘इसी’ כֵן के संकेतात्मक बल को और ‘चाहा है’ पूर्ण क्रिया के स्थायी भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रो
  rationale: मूल के पुल्लिंग बहुवचन संबोधन को सीधे रखा गया है; संबोधन के कारण ‘पुत्रो’ रूप प्रयुक्त हुआ है।
- source_word: נְאֻם אֲדֹנָי יְהוִה
  choice: प्रभु याहवे की यह वाणी है
  rationale: נְאֻם को हिन्दी की स्वाभाविक भविष्यद्वाणी-सूत्र शैली में व्यक्त किया गया है। אֲדֹנָי को ‘प्रभु’ और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: खमीरयुक्त सामग्री और धन्यवाद-बलि का संबंध
  choice: खमीर उठी रोटी से धन्यवाद-बलि
  alternative: खमीर उठी रोटी की धन्यवाद-बलि
  rationale: इब्रानी מֵחָמֵץ संबंध को संक्षिप्त और कुछ हद तक खुला छोड़ता है। ‘से’ उस अस्पष्टता को ‘की’ की अपेक्षा बेहतर बचाता है और यह निर्णय नहीं थोपता कि रोटी स्वयं पूरी बलि थी या उसके साथ चढ़ाई गई सामग्री।
- issue: כִּי כֵן אֲהַבְתֶּם में प्रेम/पसंद का आरोप
  choice: तुमने इसी को चाहा है
  alternative: तुम्हें यही प्रिय है
  rationale: चुना हुआ रूप पूर्ण क्रिया और आरोपात्मक बल दोनों को रखता है, जबकि विकल्प अधिक स्थायी वर्तमान भाव देता है।
- issue: אֲדֹנָי יְהוִה में परमेश्वर का नाम
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: यह अनुवाद उपाधि אֲדֹנָי और वाचा-नाम יהוה के बीच का अंतर बनाए रखता है, बिना नाम को सामान्य उपाधि में मिला देने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक वाचन के योग्य हिन्दी अपनाई गई है। व्यंग्यपूर्ण भविष्यद्वाणी-संबोधन को आज्ञार्थक क्रियाओं और विस्मयादिबोधक चिह्न से उभारा गया है। याजकीय पदों के लिए समझने योग्य संयुक्त शब्द प्रयुक्त हुए हैं; मूल की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
