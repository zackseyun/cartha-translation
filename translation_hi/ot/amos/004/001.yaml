id: AMO.4.1
reference: Amos 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שִׁמְע֞וּ הַ/דָּבָ֣ר הַ/זֶּ֗ה פָּר֤וֹת הַ/בָּשָׁן֙ אֲשֶׁר֙ בְּ/הַ֣ר שֹֽׁמְר֔וֹן הָ/עֹשְׁק֣וֹת דַּלִּ֔ים הָ/רֹצְצ֖וֹת אֶבְיוֹנִ֑ים הָ/אֹמְרֹ֥ת לַ/אֲדֹֽנֵי/הֶ֖ם הָבִ֥יאָ/ה וְ/נִשְׁתֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/001.yaml
  text: Hear this word[a], you cows of Bashan, who are on the mountain of Samaria, who oppress the poor, who crush the needy, who say to their masters, “Bring[b], that we may drink.”
translation:
  language: hi
  text: इस वचन को सुनो, हे बाशान की गायो[a], जो सामरिया के पहाड़ पर हो, जो दीनों पर अत्याचार करती हो, जो ज़रूरतमंदों को कुचलती हो, और जो अपने स्वामियों[b] से कहती हो, “लाओ, ताकि हम पिएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बाशान यरदन के पूर्व का एक उपजाऊ प्रदेश था, जो हृष्ट-पुष्ट पशुओं के लिए प्रसिद्ध था। यह विलासिता और उत्पीड़न में लिप्त लोगों के लिए एक तीखा अपमानजनक रूपक है।
    reason: cultural_note
  - marker: b
    text: या “अपने पतियों।” इब्रानी शब्द אֲדֹנֵיהֶם का अर्थ प्रसंगानुसार स्वामी, प्रभु या पति हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। “सुनो” भविष्यद्वक्ताओं के गंभीर आह्वान की शक्ति को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַדָּבָר הַזֶּה
  choice: इस वचन को
  rationale: דָּבָר का अर्थ “वचन,” “बात” या “संदेश” हो सकता है। भविष्यद्वाणी के प्रसंग में “वचन” औपचारिक अनुगूँज को बनाए रखता है।
- source_word: פָּרוֹת הַבָּשָׁן
  choice: हे बाशान की गायो
  rationale: פָּרוֹת विशेष रूप से मादा पशुओं का बहुवचन है। संबोधन में “गायो” मूल के स्त्रीलिंग रूप और चुभते हुए रूपक दोनों को सुरक्षित रखता है।
- source_word: בְּהַר שֹׁמְרוֹן
  choice: सामरिया के पहाड़ पर
  rationale: הַר एकवचन “पहाड़” है। “पर” स्थानसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעֹשְׁקוֹת דַּלִּים
  choice: दीनों पर अत्याचार करती हो
  rationale: עָשַׁק सामाजिक और आर्थिक उत्पीड़न या शोषण को व्यक्त करता है। “अत्याचार” भविष्यद्वाणी की नैतिक तीव्रता बनाए रखता है; “दीनों” से असहाय निर्धनों का भाव आता है।
- source_word: הָרֹצְצוֹת אֶבְיוֹנִים
  choice: ज़रूरतमंदों को कुचलती हो
  rationale: רצץ में कुचलने या तोड़ डालने की प्रबल छवि है। “कुचलती” उस हिंसक रूपक को बनाए रखता है, और “ज़रूरतमंद” אֶבְיוֹנִים को पहले प्रयुक्त “दीनों” से अलग पहचान देता है।
- source_word: הָאֹמְרֹת לַאֲדֹנֵיהֶם
  choice: अपने स्वामियों से कहती हो
  rationale: אֲדֹנֵיהֶם का अर्थ प्रसंगानुसार “स्वामी,” “प्रभु” या “पति” हो सकता है। “स्वामियों” व्यापक शाब्दिक अर्थ रखता है, जबकि संभावित वैवाहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָבִיאָה
  choice: लाओ
  rationale: यह בוא का सकर्मक हिफ़ील आज्ञार्थक रूप है। मूल में कर्म स्पष्ट नहीं है, इसलिए हिन्दी में भी उसे अनकहा रखा गया है।
- source_word: וְנִשְׁתֶּה
  choice: ताकि हम पिएँ
  rationale: आज्ञा के बाद आया यह रूप उद्देश्य या परिणाम व्यक्त कर सकता है। “ताकि हम पिएँ” संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: “बाशान की गायो” स्त्रीलिंग संबोधन का लक्ष्य
  choice: सामरिया की संपन्न और अत्याचारी स्त्रियों को विलासी, हृष्ट-पुष्ट “बाशान की गायों” के रूपक द्वारा संबोधित किया गया है।
  alternative: यह केवल स्त्रियों तक सीमित न होकर सामरिया के समूचे विलासी अभिजात वर्ग का व्यापक रूपक हो सकता है।
  rationale: पूरे पद में स्त्रीलिंग बहुवचन रूप सीधे स्त्रियों को संबोधित किए जाने का प्रबल संकेत देते हैं। अनुवाद रूपक को न तो नरम करता है, न मुख्य पाठ में उसकी सीमा से अधिक व्याख्या करता है।
- issue: לַאֲדֹנֵיהֶם का संबंधसूचक अर्थ
  choice: अपने स्वामियों
  alternative: अपने पतियों; अपने प्रभुओं
  rationale: इब्रानी संज्ञा इन सभी अर्थों की अनुमति देती है और स्वयं वैवाहिक संबंध को निश्चित नहीं करती। मुख्य पाठ में व्यापक अर्थ रखा गया है और “पतियों” की संभावित व्याख्या पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, भविष्यद्वाणी-सुलभ किंतु सहज बोधगम्य रूप रखा गया है। स्त्रीलिंग बहुवचन क्रियाओं से मूल संबोधन स्पष्ट रखा गया है। रूपक की कठोरता को नरम नहीं किया गया, और जहाँ इब्रानी संबंधसूचक शब्द अस्पष्ट है वहाँ मुख्य पाठ तथा पादटिप्पणी दोनों के द्वारा अस्पष्टता सुरक्षित रखी गई है।
