  yaml_path: translation/ot/amos/004/008.yaml
  text: So two or three cities staggered to one city to drink water[a], but they were not satisfied; yet you did not return to me[b], declares Yahweh.
translation:
  language: hi
  text: दो या तीन नगर पानी पीने के लिए एक ही नगर की ओर भटके[a], पर तृप्त न हुए; फिर भी तुम मेरी ओर नहीं लौटे[b]—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लड़खड़ाते हुए एक ही नगर की ओर चले।” हिब्रू क्रिया पानी की खोज में इधर-उधर अथवा अस्थिर गति से चलने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी ओर नहीं फिरे।” आमोस में “लौटना” परमेश्वर की ओर वाचा के संबंध में फिरने का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָעוּ
  choice: भटकते हुए ... गए
  rationale: נוע इधर-उधर अथवा अस्थिर रूप से चलने का भाव देता है। सूखे के संदर्भ में यह पानी की खोज में नगरवासियों की व्याकुल आवाजाही को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁתַּיִם שָׁלֹשׁ עָרִים
  choice: दो-तीन नगर
  rationale: यह हिब्रू संख्यात्मक युग्म थोड़ी-सी अनिश्चित संख्या बताता है; ‘दो-तीन नगर’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: אֶל עִיר אַחַת
  choice: एक नगर में
  rationale: दिशासूचक वाक्यांश अनेक नगरों के निवासियों के उस एक नगर में पहुँचने का संकेत देता है जहाँ पानी उपलब्ध था।
- source_word: לִשְׁתּוֹת מַיִם
  choice: पानी पीने के लिए
  rationale: उद्देश्यसूचक infinitive का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְלֹא יִשְׂבָּעוּ
  choice: फिर भी उनकी प्यास न बुझी
  rationale: שׂבע का मूल भाव तृप्त या संतुष्ट होना है। पानी के स्पष्ट संदर्भ में ‘प्यास न बुझी’ अभाव और अतृप्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: तौभी तुम मेरी ओर न फिरे
  rationale: שׁוב यहाँ लौटने और परमेश्वर की ओर मन फेरने, दोनों अर्थों को धारण करता है; ‘मेरी ओर न फिरे’ इस भविष्यद्वक्ताई और वाचागत संकेत को बिना ‘पश्चाताप’ शब्द जोड़कर सुरक्षित रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गंभीर भविष्यद्वक्ताई संदेश-सूत्र को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: שׁוב में लौटने और मन फेरने का संयुक्त भाव
  choice: तुम मेरी ओर न फिरे
  alternative: तुम मेरे पास न लौटे
  rationale: चुना हुआ रूप शारीरिक वापसी और वाचागत/आत्मिक मन-फिराव के बीच मौजूद अर्थगत तनाव को बनाए रखता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे शीर्षक से प्रतिस्थापित न करके देवनागरी में लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और जनसुलभ रखी गई है। ‘दो-तीन’ हिन्दी मुहावरे के अनुसार है; ‘तौभी’ भविष्यद्वक्ताई धिक्कार की गंभीर लय बनाए रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न सम्मिलित हैं।
