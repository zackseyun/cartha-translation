id: AMO.4.4
reference: Amos 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֹּ֤אוּ בֵֽית אֵל֙ וּ/פִשְׁע֔וּ הַ/גִּלְגָּ֖ל הַרְבּ֣וּ לִ/פְשֹׁ֑עַ וְ/הָבִ֤יאוּ לַ/בֹּ֨קֶר֙ זִבְחֵי/כֶ֔ם לִ/שְׁלֹ֥שֶׁת יָמִ֖ים מַעְשְׂרֹֽתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/004.yaml
  text: Come to Bethel—and transgress; to Gilgal—and multiply transgression. Bring your sacrifices every morning[a], your tithes every three days,
translation:
  language: hi
  text: बेतेल आओ और अपराध करो; गिलगाल आओ और अपराध बढ़ाते जाओ। हर सुबह अपने बलिदान और हर तीन दिन में[a] अपने दशमांश लाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तीसरे दिन’ अथवा ‘तीन दिन बाद’।
    reason: इब्रानी काल-सूचक पदबंध לִשְׁלֹשֶׁת יָמִים की वास्तविक वैकल्पिक व्याख्याएँ।
lexical_decisions:
- source_word: בֹּאוּ
  choice: आओ
  rationale: बहुवचन आज्ञार्थक रूप है। ‘आओ’ भविष्यद्वक्ता के व्यंग्यपूर्ण सीधे आह्वान की जीवंतता बनाए रखता है।
- source_word: בֵית אֵל
  choice: बेतेल
  rationale: स्थाननाम को हिन्दी में प्रचलित बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: וּפִשְׁעוּ
  choice: और अपराध करो
  rationale: פשע में केवल सामान्य पाप नहीं, बल्कि विद्रोही उल्लंघन का भाव भी है। ‘अपराध करो’ स्वाभाविक हिन्दी में व्यंग्यपूर्ण आज्ञा को बनाए रखता है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल आओ
  rationale: समानांतर पहली पंक्ति से उपासना-स्थल की ओर गति निहित है; हिन्दी में क्रिया दोहराने से वाक्य स्पष्ट और स्वाभाविक बनता है।
- source_word: הַרְבּוּ לִפְשֹׁעַ
  choice: अपराध बढ़ाते जाओ
  rationale: हिफ़ील आज्ञार्थक और क्रियार्थक संज्ञा अपराध को बढ़ाने या अधिकाधिक करने का भाव देते हैं। यह रूप हिन्दी में तीखे भविष्यद्वक्ताई व्यंग्य को सहज ढंग से व्यक्त करता है।
- source_word: וְהָבִיאוּ
  choice: लाओ
  rationale: यह पहले के आज्ञार्थकों को आगे बढ़ाने वाला बहुवचन आदेश है।
- source_word: לַבֹּקֶר
  choice: हर सुबह
  rationale: संदर्भ में वितरणात्मक अर्थ सम्भावित है और कर्मकाण्ड की नियमितता पर व्यंग्य को स्पष्ट करता है।
- source_word: זִבְחֵיכֶם
  choice: अपने बलिदान
  rationale: उपासना-संबंधी זבח के लिए ‘बलिदान’ हिन्दी में मानक और स्पष्ट शब्द है।
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: हर तीन दिन में
  rationale: इब्रानी पदबंध के सम्भावित आवृत्तिमूलक अर्थ को मुख्य पाठ में रखा गया है; अन्य वास्तविक सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: अपने दशमांश
  rationale: उपासना के लिए दिए जाने वाले दसवें भाग के अर्थ में ‘दशमांश’ स्थापित हिन्दी पद है।
theological_decisions:
- issue: आज्ञार्थक क्रियाओं में भविष्यद्वक्ताई व्यंग्य
  choice: 'आज्ञाओं को सीधे रूप में रखा गया है: ‘आओ और अपराध करो ... अपराध बढ़ाते जाओ।’'
  alternative: व्यंग्य को स्पष्ट करके ‘जाओ, खूब अपराध करो’ कहना।
  rationale: इब्रानी में वास्तविक आज्ञार्थक रूप हैं, पर वे निन्दात्मक व्यंग्य में प्रयुक्त हुए हैं। व्यंग्य को अतिरिक्त शब्दों से स्पष्ट करना अनुवाद से आगे बढ़कर व्याख्या करना होता।
- issue: לִשְׁלֹשֶׁת יָמִים का काल-संबंधी अर्थ
  choice: मुख्य पाठ में ‘हर तीन दिन में’।
  alternative: ‘तीसरे दिन’ अथवा ‘तीन दिन बाद’।
  rationale: पदबंध वास्तव में बहुअर्थी है। मुख्य विकल्प कर्मकाण्डीय तत्परता पर आमोस के व्यंग्य के अनुकूल है, जबकि दूसरे विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा और मौखिक रूप से सहज पाठ। समानांतरता तथा तीखे भविष्यद्वक्ताई व्यंग्य को बनाए रखने के लिए छोटे आज्ञार्थक वाक्य रखे गए हैं।
