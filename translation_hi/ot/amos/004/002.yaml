source:
  edition: WLC
  text: נִשְׁבַּ֨ע אֲדֹנָ֤/י יְהוִה֙ בְּ/קָדְשׁ֔/וֹ כִּ֛י הִנֵּ֥ה יָמִ֖ים בָּאִ֣ים עֲלֵי/כֶ֑ם וְ/נִשָּׂ֤א אֶתְ/כֶם֙ בְּ/צִנּ֔וֹת וְ/אַחֲרִיתְ/כֶ֖ן בְּ/סִיר֥וֹת דּוּגָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/002.yaml
  text: 'The Lord GOD has sworn by his holiness: For behold[a], days are coming upon you when they will lift you away with hooks[b], and your posterity with fishhooks.'
translation:
  language: hi
  text: 'प्रभु याहवे ने अपनी पवित्रता की शपथ खाई है: “देखो, तुम पर ऐसे दिन आनेवाले हैं, जब तुम्हें काँटों से उठा ले जाया जाएगा, और तुममें से जो शेष रह जाएँगी[a], उन्हें मछली पकड़ने के काँटों से ले जाया जाएगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “तुममें से अंतिम स्त्रियाँ” भी हो सकता है। इब्रानी शब्द किसी के अंत, भविष्य या बचे हुए लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “काँटों” और “मछली पकड़ने के काँटों” के लिए आए इब्रानी शब्द कठिन हैं। संभव है कि यहाँ मछली पकड़ने के नुकीले साधनों जैसे उपकरणों से बंदियों को ले जाने का सामान्य बिंब हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु याहवे
  rationale: दोनों पदों को स्पष्ट रखते हुए אֲדֹנָי का स्वाभाविक हिन्दी रूप ‘प्रभु’ और परमेश्वर के व्यक्तिगत नाम יְהוִה का लिप्यंतरण ‘याहवे’ किया गया है।
- source_word: נִשְׁבַּע
  choice: ने ... शपथ खाई है
  rationale: पूर्ण क्रिया भविष्यद्वाणी में वर्तमान प्रभाव रखने वाली, विधिवत की गई शपथ बताती है; हिन्दी पूर्ण वर्तमान इसका स्वाभाविक रूप है।
- source_word: בְּקָדְשׁוֹ
  choice: अपनी पवित्रता की शपथ
  rationale: यहाँ קֹדֶשׁ को परमेश्वर का पवित्र गुण समझना प्रसंग और आमोस 6:8 की समान शपथ-भाषा के अनुकूल है, न कि पवित्रस्थान का उल्लेख।
- source_word: כִּי הִנֵּה
  choice: देखो
  rationale: भविष्यद्वाणी की ओर तत्काल ध्यान खींचने वाला सहज आधुनिक हिन्दी संकेत; ‘निहारो’ जैसे पुरातन रूप से बचा गया है।
- source_word: יָמִים בָּאִים עֲלֵיכֶם
  choice: तुम पर ऐसे दिन आनेवाले हैं
  rationale: मानक भविष्यद्वाणी-सूत्र और עַל की धमकीपूर्ण दिशा दोनों सुरक्षित रहते हैं।
- source_word: וְנִשָּׂא אֶתְכֶם
  choice: तुम्हें ... उठा ले जाया जाएगा
  rationale: एकवचन क्रिया का कर्ता अनिर्दिष्ट है; कर्मवाच्य हिन्दी में अनिर्दिष्ट बलपूर्वक निर्वासन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּצִנּוֹת
  choice: काँटेदार अंकुशों से
  rationale: दुर्लभ शब्द का सटीक अर्थ विवादित है; समानांतर मछली पकड़ने के साधनों और बंदियों को घसीटकर ले जाने की छवि के आधार पर काँटेदार हुक-जैसे उपकरण अभिप्रेत माने गए हैं।
- source_word: וְאַחֲרִיתְכֶן
  choice: तुममें से जो शेष रह जाएँगी
  rationale: אַחֲרִית का अर्थ अंत, बाद का भाग या बचे हुए लोग हो सकता है। निर्वासन के प्रसंग में ‘शेष’ उपयुक्त है; स्त्रीलिंग बहुवचन प्रत्यय को ‘रह जाएँगी’ में सुरक्षित रखा गया है।
- source_word: בְּסִירוֹת דּוּגָה
  choice: मछली पकड़ने के काँटों से
  rationale: वाक्यांश कठिन है, पर דּוּגָה और पहले पद के समानांतर बिंब के कारण मछली पकड़ने के हुक सर्वाधिक संभावित हैं।
theological_decisions:
- issue: אֲדֹנָי יְהוִה में परमेश्वर के नाम का रूप
  choice: प्रभु याहवे
  alternative: प्रभु परमेश्वर
  rationale: मूल में वाचा का व्यक्तिगत नाम יְהוִה प्रत्यक्ष है; ‘याहवे’ उसे सामान्य उपाधि में विलीन किए बिना व्यक्त करता है।
- issue: शपथ में בְּקָדְשׁוֹ का आशय
  choice: अपनी पवित्रता की शपथ
  alternative: अपने पवित्रस्थान की शपथ
  rationale: यह पाठ परमेश्वर की अपनी पवित्रता को शपथ की गारंटी के रूप में सबसे स्वाभाविक ढंग से प्रस्तुत करता है; फिर भी संज्ञा में ‘पवित्र वस्तु/स्थान’ का अर्थ भाषिक रूप से संभव है।
- issue: וְאַחֲרִיתְכֶן से किन लोगों का संकेत है
  choice: तुममें से जो शेष रह जाएँगी
  alternative: तुम्हारी संतान / तुममें से अंतिम स्त्रियाँ
  rationale: न्याय और पूर्ण निर्वासन के प्रसंग में बचे हुए लोगों का अर्थ अधिक उपयुक्त है, पर शब्द की ‘भविष्य/उत्तरकाल’ संबंधी अर्थ-सीमा के कारण वंशज का अर्थ पूर्णतः असंभव नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप रखा गया है। संबोधित समूह का इब्रानी स्त्रीलिंग बहुवचन ‘रह जाएँगी’ में प्रकट किया गया है। ‘देखो’ भविष्यद्वाणी की तत्परता रखता है और अनावश्यक पुरातनता से बचता है।
