source:
  edition: WLC
  text: וְ/גַ֣ם אָנֹכִי֩ מָנַ֨עְתִּי מִ/כֶּ֜ם אֶת הַ/גֶּ֗שֶׁם בְּ/ע֨וֹד שְׁלֹשָׁ֤ה חֳדָשִׁים֙ לַ/קָּצִ֔יר וְ/הִמְטַרְתִּי֙ עַל עִ֣יר אֶחָ֔ת וְ/עַל עִ֥יר אַחַ֖ת לֹ֣א אַמְטִ֑יר חֶלְקָ֤ה אַחַת֙ תִּמָּטֵ֔ר וְ/חֶלְקָ֛ה אֲשֶֽׁר לֹֽא תַמְטִ֥יר עָלֶ֖י/הָ תִּיבָֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/007.yaml
  text: And I also withheld the rain from you when there were still three months until the harvest; and I caused it to rain on one city[a], but on another city I did not cause it to rain. One field received rain, but the field on which it did not rain dried up.
translation:
  language: hi
  text: “और मैंने भी तुमसे वर्षा रोक ली, जब कटनी होने में अभी तीन महीने बाकी थे। मैंने एक नगर पर वर्षा बरसाई, पर दूसरे नगर पर वर्षा नहीं बरसाई। एक खेत[a] पर वर्षा हुई, पर जिस खेत पर वर्षा नहीं हुई, वह सूख गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि का एक भूखंड।”
    reason: חֶלְקָה खेत के अतिरिक्त भूमि के किसी निश्चित भाग या भूखंड का भी अर्थ दे सकता है।
lexical_decisions:
- source_word: וְגַם אָנֹכִי
  choice: और मैंने भी
  rationale: וְגַם का योगात्मक बल ‘भी’ से सुरक्षित रहता है। स्वतंत्र सर्वनाम אָנֹכִי कर्ता पर जोर देता है; हिन्दी में ‘मैंने भी’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָנַעְתִּי מִכֶּם אֶת־הַגֶּשֶׁם
  choice: तुमसे वर्षा रोक ली
  rationale: מנע עם מן का अर्थ किसी से कोई वस्तु रोक रखना है। यह चयन परमेश्वर की प्रत्यक्ष क्रिया और श्रोताओं को वर्षा से वंचित किए जाने—दोनों को स्पष्ट रखता है।
- source_word: בְּעוֹד שְׁלֹשָׁה חֳדָשִׁים לַקָּצִיר
  choice: जबकि कटनी में अभी तीन महीने बाकी थे
  rationale: בְּעוֹד शेष समय को दर्शाता है। ‘कटनी’ कृषि-संदर्भ में קָצִיר का सहज और प्रचलित हिन्दी रूप है।
- source_word: וְהִמְטַרְתִּי
  choice: मैंने ... वर्षा बरसाई
  rationale: מטר के हिफ़ील रूप की कारणवाचकता को बनाए रखते हुए यह हिन्दी में स्वाभाविक है और वर्षा पर परमेश्वर के सक्रिय नियंत्रण को व्यक्त करता है।
- source_word: עַל עִיר אֶחָת ... וְעַל עִיר אַחַת לֹא אַמְטִיר
  choice: एक नगर पर वर्षा बरसाई, पर दूसरे नगर पर वर्षा नहीं बरसाई
  rationale: दो नगरों के बीच जानबूझकर किए गए अंतर और इब्रानी की समानांतर पुनरुक्ति को सुरक्षित रखता है।
- source_word: חֶלְקָה אַחַת
  choice: एक खेत
  rationale: חֶלְקָה भूमि के किसी निश्चित भाग या भूखंड को दर्शाता है; कृषि और वर्षा के संदर्भ में ‘खेत’ सर्वाधिक सहज है, जबकि व्यापक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: תִּמָּטֵר
  choice: पर वर्षा हुई
  rationale: निफ़अल रूप का निष्क्रिय भाव सहज हिन्दी में व्यक्त होता है और अगले उपवाक्य के साथ स्पष्ट विरोध बनाता है।
- source_word: תִּיבָשׁ
  choice: सूख गया
  rationale: יבש भूमि के नमी खोकर सूख जाने को बताता है; पुल्लिंग क्रिया हिन्दी के चुने हुए शब्द ‘खेत’ के अनुरूप है।
theological_decisions:
- issue: चुनिंदा वर्षा और सूखे में परमेश्वर की सक्रिय भूमिका
  choice: ‘मैंने ... वर्षा रोक ली,’ ‘मैंने ... वर्षा बरसाई,’ और ‘वर्षा नहीं बरसाई’ द्वारा प्रथम पुरुष की प्रत्यक्ष दैवी क्रिया सुरक्षित रखी गई है।
  alternative: मौसम को निर्वैयक्तिक रूप से प्रस्तुत करना, जैसे ‘वर्षा रुक गई’ या ‘वर्षा नहीं हुई’।
  rationale: इब्रानी में प्रथम पुरुष क्रियाएँ न्याय के रूप में परमेश्वर की सीधी और चुनिंदा कार्रवाई पर जोर देती हैं; निर्वैयक्तिक भाषा इस धर्मवैचारिक बल को कम कर देती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वक्ता के गंभीर और गरिमापूर्ण स्वर को बनाए रखती है। ‘वर्षा बरसाई’ कारणवाचक दैवी क्रिया को सहज रूप में व्यक्त करता है; ‘कटनी’ और ‘खेत’ सामान्य पाठक के लिए स्पष्ट कृषि-शब्द हैं।
