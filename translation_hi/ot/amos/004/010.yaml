source:
  edition: WLC
  text: שִׁלַּ֨חְתִּי בָ/כֶ֥ם דֶּ֨בֶר֙ בְּ/דֶ֣רֶךְ מִצְרַ֔יִם הָרַ֤גְתִּי בַ/חֶ֨רֶב֙ בַּח֣וּרֵי/כֶ֔ם עִ֖ם שְׁבִ֣י סֽוּסֵי/כֶ֑ם וָ/אַעֲלֶ֞ה בְּאֹ֤שׁ מַחֲנֵי/כֶם֙ וּֽ/בְ/אַפְּ/כֶ֔ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/010.yaml
  text: I sent among you a plague in the manner of Egypt[a]; I killed your young men with the sword, along with your captured horses, and I made the stench of your camps rise even into your nostrils; yet you did not return to me[b], declares Yahweh.
translation:
  language: hi
  text: मैंने तुम्हारे बीच मिस्र जैसी महामारी भेजी[a]; मैंने तुम्हारे जवानों को तलवार से मार डाला, तुम्हारे घोड़ों के बंदी बनाए जाने के साथ[b]; मैंने तुम्हारी छावनियों की दुर्गन्ध तुम्हारी नाकों तक चढ़ा दी। फिर भी तुम मेरी ओर नहीं लौटे—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मिस्र के मार्ग/रीति के अनुसार”; सम्भवतः यह मिस्र से जुड़े दण्डों की ओर संकेत करता है, न कि मिस्र जाने वाले किसी मार्ग की ओर।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “तुम्हारे घोड़ों की बंदी के साथ।” यह संक्षिप्त वाक्यांश सम्भवतः ऐसी सैन्य पराजय बताता है जिसमें जवान मारे गए और घोड़े छीन लिए गए; इसके सटीक व्याकरणिक संबंध पर मतभेद है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: שִׁלַּחְתִּי בָכֶם דֶּבֶר
  choice: मैंने तुम्हारे बीच ... महामारी भेजी
  rationale: שלח का सीधा अर्थ ‘भेजना’ है; בָכֶם को विपत्ति के लोगों के बीच पहुँचने के अर्थ में ‘तुम्हारे बीच’ कहा गया है। דֶּבֶר के लिए आधुनिक और स्पष्ट ‘महामारी’ उपयुक्त है।
- source_word: בְּדֶרֶךְ מִצְרַיִם
  choice: मिस्र जैसी
  rationale: शाब्दिक संरचना ‘मिस्र के मार्ग/रीति में’ है, पर यहाँ सम्भवतः मिस्र से जुड़े महामारीरूपी दण्डों की ओर संकेत है। सहज हिन्दी में ‘मिस्र जैसी’ उस तुलना को बनाए रखती है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הָרַגְתִּי בַחֶרֶב בַּחוּרֵיכֶם
  choice: मैंने तुम्हारे जवानों को तलवार से मार डाला
  rationale: הרג की कठोरता को ‘मार डाला’ स्पष्ट रूप से व्यक्त करता है। בַּחוּרִים मूलतः युवावस्था के पुरुष हैं; युद्ध-संदर्भ के बावजूद ‘जवान’ अर्थ को अनावश्यक रूप से केवल सैनिकों तक सीमित नहीं करता।
- source_word: עִם שְׁבִי סוּסֵיכֶם
  choice: और तुम्हारे घोड़ों को बंदी बना लिया
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है—शाब्दिक रूप से ‘तुम्हारे घोड़ों की बंदी/बंदी बनाए जाने के साथ’। हिन्दी में यह सैन्य पराजय और घोड़ों के छीन लिए जाने का सम्भावित आशय देता है; मूल की बनावट पादटिप्पणी में सुरक्षित है।
- source_word: וָאַעֲלֶה בְּאֹשׁ מַחֲנֵיכֶם וּבְאַפְּכֶם
  choice: मैंने तुम्हारी छावनियों की दुर्गन्ध तुम्हारी नाक तक चढ़ा दी
  rationale: עלה की कारक अभिव्यक्ति को ‘चढ़ा दी’, בְּאֹשׁ को गरिमापूर्ण किन्तु तीखे ‘दुर्गन्ध’, और אַף को गन्ध के प्रसंग में ‘नाक’ कहा गया है।
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: फिर भी तुम मेरी ओर नहीं लौटे
  rationale: שוב का मूल ‘लौटना’ है और यहाँ उसका वाचागत/पश्चात्ताप-संबंधी बल मौजूद है। ‘मेरी ओर नहीं लौटे’ उस धार्मिक अर्थ को बिना विस्तारवादी व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय निजी नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को ‘प्रभु’ जैसे पद में नहीं बदला गया; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण है।
- issue: וְלֹא שַׁבְתֶּם עָדַי में पश्चात्ताप का आशय
  choice: तुम मेरी ओर नहीं लौटे
  alternative: तुमने पश्चात्ताप करके मेरी ओर लौटना स्वीकार नहीं किया
  rationale: ‘लौटना’ वाचा-संबंधी पश्चात्ताप का संकेत देता है, लेकिन मूल में ‘पश्चात्ताप’ के लिए अलग संज्ञा या क्रिया नहीं है; इसलिए व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- issue: विपत्तियों को परमेश्वर के प्रत्यक्ष कर्म के रूप में रखना
  choice: मैंने ... भेजी; मैंने ... मार डाला; मैंने ... चढ़ा दी
  alternative: तुम पर ... आई; तुम्हारे जवान ... मारे गए
  rationale: मूल तीनों न्यायकारी घटनाओं को प्रथम पुरुष में वक्ता के प्रत्यक्ष कर्म के रूप में रखता है। कर्मवाच्य बनाकर इस धार्मिक तनाव को कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रत्यक्ष और भविष्यद्वक्ताई गरिमा के साथ रखी गई है। ‘महामारी’, ‘जवान’, ‘छावनियाँ’ और ‘दुर्गन्ध’ सामान्य पाठक के लिए स्पष्ट हैं। समानान्तर प्रथम-पुरुष क्रियाएँ न्याय-वाणी की तीव्रता बनाए रखती हैं; अंतिम सूत्र को स्वाभाविक हिन्दी में ‘यह यहोवा की घोषणा है’ कहा गया है।
