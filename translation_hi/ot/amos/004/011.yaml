source:
  edition: WLC
  text: הָפַ֣כְתִּי בָ/כֶ֗ם כְּ/מַהְפֵּכַ֤ת אֱלֹהִים֙ אֶת סְדֹ֣ם וְ/אֶת עֲמֹרָ֔ה וַ/תִּהְי֕וּ כְּ/א֖וּד מֻצָּ֣ל מִ/שְׂרֵפָ֑ה וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/011.yaml
  text: I overthrew some among you as God overthrew Sodom and Gomorrah[a], and you became like a brand snatched from the burning; yet you did not return to me[c][b], declares Yahweh.
translation:
  language: hi
  text: “मैंने तुममें से कुछ को[a] नष्ट कर दिया, जैसे परमेश्वर ने सदोम और अमोरा को नष्ट कर दिया था;[b] और तुम उस जलती हुई लकड़ी के टुकड़े जैसे हो गए जिसे आग से खींच निकाला गया हो।[c] फिर भी तुम मेरी ओर नहीं लौटे,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच।” मूल इब्रानी संबंधबोधक को ‘तुममें से कुछ’ के अंशवाचक अर्थ में समझा जा सकता है, पर ‘कुछ’ शब्द स्पष्ट रूप से नहीं लिखा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “परमेश्वर द्वारा सदोम और अमोरा को उलट दिए जाने के समान।”
    reason: lexical_alternative
  - marker: c
    text: या, “धधकती आग से बचाकर निकाले गए अग्निकाष्ठ के समान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפַכְתִּי
  choice: मैंने … उलट दिया
  rationale: न्याय के संदर्भ में הפך विनाशकारी रूप से उलट देने को व्यक्त करता है। ‘उलट दिया’ सदोम और अमोरा के विनाश की ओर संकेत और मूल पद में धातु की पुनरावृत्ति दोनों को बनाए रखता है।
- source_word: בָכֶם
  choice: तुममें से कुछ को
  rationale: 'यहाँ בְּ को अंशवाचक समझना स्वाभाविक है: न्याय ने इस्राएल के भीतर कुछ लोगों या स्थानों को आ घेरा। ‘कुछ’ मूल में स्पष्ट संज्ञा नहीं है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।'
- source_word: כְּמַהְפֵּכַת אֱלֹהִים
  choice: जैसे परमेश्वर ने … उलट दिया था
  rationale: मूल का संज्ञात्मक वाक्यांश ‘परमेश्वर का उलटना’ कर्तृवाचक संबंध व्यक्त करता है। हिन्दी में क्रियात्मक रूप अधिक सहज है और परमेश्वर को इस विनाश का कर्ता बनाए रखता है।
- source_word: סְדֹם וַעֲמֹרָה
  choice: सदोम और अमोरा
  rationale: ये दोनों स्थान-नाम हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किए गए हैं।
- source_word: וַתִּהְיוּ
  choice: तुम … हो गए
  rationale: यह रूप न्याय के बाद उत्पन्न दशा को दिखाता है; इसलिए केवल ‘थे’ की अपेक्षा ‘हो गए’ अधिक सटीक है।
- source_word: כְּאוּד מֻצָּל מִשְּׂרֵפָה
  choice: आग में से खींच निकाली गई जलती लकड़ी के समान
  rationale: אוּד आग में पड़ी या जलती लकड़ी को सूचित करता है, और נצל का कर्मवाच्य रूप संकट से बचाकर निकाल लिए जाने का बोध देता है। यह अनुवाद उद्धार और लगभग भस्म हो जाने, दोनों चित्रों को बनाए रखता है।
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: फिर भी तुम मेरी ओर नहीं लौटे
  rationale: שׁוב और עַד का मेल परमेश्वर की ओर संबंधात्मक और वाचा-संबंधी वापसी को व्यक्त करता है। ‘लौटे’ पश्चात्ताप को समेटता है, पर उसे केवल मनोभाव तक सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם मानक भविष्यद्वक्ताई घोषणा-सूत्र है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; लिप्यंतरण उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: भविष्यद्वक्ताई संदर्भ में שׁוב का आशय
  choice: मेरी ओर लौटे
  alternative: मन फिराया / पश्चात्ताप किया
  rationale: यह चयन भीतर के खेद से आगे बढ़कर परमेश्वर की ओर पूरी वाचा-संबंधी वापसी का व्यापक आशय बनाए रखता है।
- issue: वक्ता याहवे होते हुए אֱלֹהִים का तृतीय पुरुष प्रयोग
  choice: जैसे परमेश्वर ने … उलट दिया था
  alternative: जैसे मैंने … उलट दिया था
  rationale: मूल में אֱלֹהִים स्पष्ट रूप से तृतीय पुरुष में है। इसे प्रथम पुरुष में बदलना मूल की अभिव्यक्ति और उसके धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उलट दिया’ सामान्य ‘नाश किया’ से कुछ अधिक शाब्दिक है, लेकिन यह मूल की शब्द-पुनरावृत्ति और सदोम-अमोरा के प्रचलित ‘उलट दिए जाने’ वाले चित्र को सुरक्षित रखता है। ‘जलती लकड़ी’ साधारण पाठक के लिए ‘अग्निकाष्ठ’ से अधिक सहज है; अधिक तकनीकी विकल्प पादटिप्पणी में दिया गया है।
