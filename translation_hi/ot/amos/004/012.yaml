base_translation:
  language: en
  yaml_path: translation/ot/amos/004/012.yaml
  text: Therefore[a], thus I will do to you, Israel; because I will do this to you, prepare to meet your God, Israel.
translation:
  language: hi
  text: इसलिए, हे इस्राएल, मैं तेरे साथ ऐसा करूँगा; क्योंकि मैं तेरे साथ यह करूँगा, इसलिए अपने परमेश्वर से मिलने के लिए तैयार हो जा, हे इस्राएल।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर का सामना करने के लिए तैयार हो जा।” इस संदर्भ में यह घोषित न्याय के संदर्भ में होने वाला भयावह सामना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले न्यायों से निकले निष्कर्ष और आगामी घोषणा की ओर संकेत करता है।
- source_word: כֹּה אֶעֱשֶׂה לְּךָ
  choice: मैं तेरे साथ ऐसा ही करूँगा
  rationale: כֹּה की संकेतवाचक शक्ति और עשה के व्यापक अर्थ को बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है; न्याय का प्रतिकूल भाव संदर्भ से स्पष्ट होता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप रखा गया है; सम्बोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: עֵקֶב כִּי
  choice: और क्योंकि … इसलिए
  rationale: यह आगामी आज्ञा का आधार बताता है। हिन्दी में कारण और परिणाम का संबंध स्पष्ट तथा स्वाभाविक बनाने के लिए सहसंबंधी रचना अपनाई गई है।
- source_word: זֹאת אֶעֱשֶׂה לָּךְ
  choice: मैं तेरे साथ यह करूँगा
  rationale: मूल की पुनरुक्ति और संकेतवाचक ‘यह’ को सुरक्षित रखा गया है; स्त्रीलिंगी प्रत्यय के बावजूद सम्बोधन इस्राएल से ही है।
- source_word: הִכּוֹן
  choice: तैयार हो जा
  rationale: निफ़अल आज्ञार्थक रूप तैयारी या तत्परता का आदेश देता है; एकवचन सम्बोधन को बनाए रखा गया है।
- source_word: לִקְרַאת
  choice: से मिलने के लिए
  rationale: यह किसी से मिलने या उसका सामना करने के लिए आगे आने का भाव रखता है। मुख्य पाठ में अपेक्षाकृत खुला ‘मिलने’ रखा गया है, जबकि संदर्भगत भयावह अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: ‘अपने’ हिन्दी में उसी सम्बोधित व्यक्ति के परमेश्वर का संबंध स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने परमेश्वर से मिलने’ का स्वर
  choice: मुख्य पाठ में शब्दावली की मूल अस्पष्टता रखी गई है, जबकि पाद-टिप्पणी न्यायपूर्ण और भयावह सामना स्पष्ट करती है।
  alternative: इसे मुख्य पाठ में सीधे ‘अपने परमेश्वर का सामना करने’ के रूप में अनूदित करना।
  rationale: निकटवर्ती संदर्भ ईश्वरीय न्याय और टकराव की ओर स्पष्ट संकेत करता है, पर לִקְרַאת अपने आप में मिलने या सामना करने—दोनों का भाव दे सकता है; इसलिए मुख्य पाठ को अत्यधिक व्याख्यात्मक नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। इस्राएल को एक व्यक्ति की तरह सम्बोधित करने वाले इब्रानी एकवचन को ‘तेरे’ और ‘हो जा’ से सुरक्षित रखा गया है। मूल की जानबूझकर की गई पुनरुक्ति भी बनाए रखी गई है।
