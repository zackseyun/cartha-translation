id: AMO.4.6
reference: Amos 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גַם אֲנִי֩ נָתַ֨תִּי לָ/כֶ֜ם נִקְי֤וֹן שִׁנַּ֨יִם֙ בְּ/כָל עָ֣רֵי/כֶ֔ם וְ/חֹ֣סֶר לֶ֔חֶם בְּ/כֹ֖ל מְקוֹמֹֽתֵי/כֶ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/006.yaml
  text: And I also gave you cleanness of teeth in all your cities[a], and lack of bread in all your places; yet you did not return to me, declares Yahweh.
translation:
  language: hi
  text: “मैंने भी तुम्हें तुम्हारे सभी नगरों में दाँतों की सफ़ाई[a] और तुम्हारे सभी स्थानों में रोटी का अभाव दिया; फिर भी तुम मेरी ओर नहीं लौटे,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दाँतों की सफ़ाई”; यह खाने को कुछ न होने का मुहावरा है, क्योंकि तब दाँतों में भोजन नहीं रहता।
    reason: हिब्रू मुहावरे की शाब्दिक छवि को बनाए रखते हुए उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: मैंने भी
  rationale: וְגַם की योगात्मक शक्ति और אֲנִי के बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: נָתַתִּי לָכֶם
  choice: तुम्हारे दाँत साफ रखे … रोटी की कमी कर दी
  rationale: हिब्रू में ‘मैंने तुम्हें दिया’ दोनों विपत्तियों पर लागू होता है। हिन्दी में शाब्दिक ‘सफाई दी’ अस्वाभाविक और भ्रामक होता, इसलिए कारणात्मक भाव को स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: נִקְיוֹן שִׁנַּיִם
  choice: तुम्हारे दाँत साफ रखे
  rationale: भोजन न मिलने के कारण दाँत साफ रहने की तीखी हिब्रू छवि को मुख्य पाठ में बनाए रखता है; पादटिप्पणी इसका आशय स्पष्ट करती है।
- source_word: בְּכָל עָרֵיכֶם
  choice: तुम्हारे सभी नगरों में
  rationale: स्थानवाचक अर्थ और संबोधन के बहुवचन स्वामित्व को सीधे व्यक्त करता है।
- source_word: וְחֹסֶר לֶחֶם
  choice: और … रोटी की कमी
  rationale: חֹסֶר और לֶחֶם के ठोस शब्दार्थ को बनाए रखता है; ‘अकाल’ कहने से अधिक व्याख्यात्मक होने से बचता है।
- source_word: בְּכֹל מְקוֹמֹתֵיכֶם
  choice: तुम्हारे सभी स्थानों में
  rationale: מְקוֹמוֹת को ‘नगरों’ तक सीमित किए बिना उसके व्यापक अर्थ और पद की समानांतर रचना को सुरक्षित रखता है।
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: फिर भी तुम मेरी ओर नहीं लौटे
  rationale: שׁוּב के लौटने/फिरने के वाच्यार्थ तथा परमेश्वर की ओर लौटने के वाचा-संबंधी भाव, दोनों को सुरक्षित रखता है; इसे केवल भीतरी ‘पश्चात्ताप’ तक सीमित नहीं करता।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: मानक भविष्यद्वाणी-सूत्र को स्पष्ट हिन्दी में व्यक्त करता है और יְהוָה को उसके नाम ‘याहवे’ से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। लिप्यंतरण उस नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: נִקְיוֹן שִׁנַּיִם मुहावरे को मुख्य पाठ में व्याख्यात्मक बनाना या उसकी छवि बनाए रखना
  choice: ‘तुम्हारे दाँत साफ रखे’ की छवि बनाए रखना
  alternative: तुम्हें खाने को कुछ नहीं दिया; तुम पर भूख डाली
  rationale: अगला समानांतर वाक्यांश ‘रोटी की कमी’ अर्थ को संदर्भ में स्पष्ट करता है। इसलिए मूल की व्यंग्यपूर्ण और सजीव छवि को हटाना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा भविष्यद्वाणी-संबंधी लहजा रखा गया है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। मूल की ठोस छवि और ‘नगरों/स्थानो’ के समानांतर भेद को बनाए रखते हुए अस्वाभाविक शाब्दिक हिन्दी से बचा गया है।
