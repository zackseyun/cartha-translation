source:
  edition: WLC
  text: כִּ֡י הִנֵּה֩ יוֹצֵ֨ר הָרִ֜ים וּ/בֹרֵ֣א ר֗וּחַ וּ/מַגִּ֤יד לְ/אָדָם֙ מַה שֵּׂח֔/וֹ עֹשֵׂ֥ה שַׁ֨חַר֙ עֵיפָ֔ה וְ/דֹרֵ֖ךְ עַל בָּ֣מֳתֵי אָ֑רֶץ יְהוָ֥ה אֱלֹהֵֽי צְבָא֖וֹת שְׁמֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/013.yaml
  text: For behold[a], the one who forms the mountains and creates the wind, and declares to man what his thought is, who makes the dawn darkness and treads on the heights of the earth—Yahweh, the God of hosts[c][b], is his name.
translation:
  language: hi
  text: क्योंकि देखो, जो पहाड़ों को आकार देता है, हवा को रचता है[a], मनुष्य को बताता है[b] कि उसका विचार क्या है[c], भोर को अंधकार बना देता है और पृथ्वी की ऊँचाइयों पर चलता है—याहवे—सेनाओं का परमेश्वर—उसका नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मा को रचता है”; हिब्रू רוּחַ का अर्थ “हवा,” “श्वास” या “आत्मा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मानवजाति को बताता है”; हिब्रू में प्रतिनिधिक एकवचन אָדָם है।
    reason: lexical_alternative
  - marker: c
    text: या “कि वह क्या सोचता है” अथवा “उसका मनन क्या है”; हिब्रू शब्द मन के भीतर के चिंतन, मनन, कथन या शिकायत को सूचित कर सकता है, और “उसका” का संदर्भ भी पूरी तरह स्पष्ट नहीं है।
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: क्योंकि देखो
  rationale: כִּי पिछले संदर्भ के लिए आधार प्रस्तुत करता है, जबकि הִנֵּה ध्यान आकृष्ट करने वाली भविष्यद्वक्ताई गंभीरता जोड़ता है; हिन्दी में दोनों तत्व रखे गए हैं।
- source_word: יוֹצֵר הָרִים
  choice: पहाड़ों को आकार देता है
  rationale: יוֹצֵר में कारीगर की तरह गढ़ने या आकार देने का भाव है; यह सामान्य ‘बनाता है’ से अधिक ठोस सृजनात्मक बिंब सुरक्षित रखता है।
- source_word: וּבֹרֵא רוּחַ
  choice: हवा को रचता है
  rationale: सृष्टि और ब्रह्मांडीय प्रभुता के इस क्रम में רוּחַ का अर्थ ‘हवा’ सर्वाधिक स्वाभाविक है; ‘आत्मा’ की वास्तविक शब्दार्थगत संभावना पादटिप्पणी में रखी गई है।
- source_word: וּמַגִּיד לְאָדָם
  choice: मनुष्य को बताता है
  rationale: מַגִּיד प्रकट करने या बताने का भाव देता है। אָדָם प्रतिनिधिक एकवचन है, इसलिए ‘मनुष्य’ स्रोत की वचन-संरचना और सामान्य मानव-संदर्भ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: מַה שֵּׂחוֹ
  choice: कि उसका मनन क्या है
  rationale: שֵׂחַ/שִׂיחַ विचार, मनन, अंतर्मन की बात या कभी शिकायत/कथन का अर्थ दे सकता है। ‘मनन’ आंतरिक चिंतन का भाव रखता है और सर्वनाम की स्रोतगत अस्पष्टता को नहीं मिटाता।
- source_word: עֹשֵׂה שַׁחַר עֵיפָה
  choice: भोर को अंधकार बना देता है
  rationale: עֵיפָה अंधकार या घोर छाया को दर्शाता है। यह अनुवाद भोर को अंधकार में बदल देने वाली न्याय-संबंधी उलटाव की छवि सुरक्षित रखता है।
- source_word: וְדֹרֵךְ עַל בָּמֳתֵי אָרֶץ
  choice: पृथ्वी की ऊँचाइयों पर पाँव रखकर चलता है
  rationale: דֹרֵךְ में पाँव रखने/रौंदते हुए चलने का ठोस भाव है, और בָּמֳתֵי यहाँ उपासना-स्थलों के बजाय भौगोलिक ऊँचाइयों के अर्थ में उपयुक्त है।
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  choice: याहवे, सेनाओं का परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को ‘याहवे’ के रूप में रखा गया है। צְבָאוֹת की सैन्य और स्वर्गीय समूहों की छवि ‘सेनाओं’ में सुरक्षित रहती है।
- source_word: שְׁמוֹ
  choice: उसका नाम ... है
  rationale: हिब्रू की चरम पहचान-सूत्र शैली को स्वाभाविक हिन्दी नामवाचक वाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में उपाधि नहीं बल्कि चतुराक्षरी व्यक्तिगत नाम आया है; लिप्यंतरण उसके नाम होने की पहचान को सुरक्षित रखता है।
- issue: רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा; श्वास
  rationale: पहाड़, भोर और पृथ्वी की ऊँचाइयों वाले ब्रह्मांडीय संदर्भ में ‘हवा’ सबसे संगत है, पर शब्द की धर्मवैचारिक रूप से महत्त्वपूर्ण व्यापकता पादटिप्पणी में रखी गई है।
- issue: מַה שֵּׂחוֹ में सर्वनाम और संज्ञा का अर्थ
  choice: उसका मनन क्या है
  alternative: वह क्या सोचता है; उसका विचार क्या है; उसकी शिकायत क्या है
  rationale: ‘मनन’ आंतरिक चिंतन को व्यक्त करता है, जबकि ‘उसका’ यह जबरन तय नहीं करता कि अभिप्रेत मनुष्य का विचार है या परमेश्वर से संबंधित कथन; संभावनाएँ पादटिप्पणी में स्पष्ट हैं।
- issue: לְאָדָם का मानवीय संदर्भ
  choice: मनुष्य को
  alternative: मानवजाति को; लोगों को
  rationale: אָדָם रूपतः प्रतिनिधिक एकवचन है। ‘मनुष्य’ आधुनिक हिन्दी में सामान्य मानव को सूचित कर सकता है और स्रोत के एकवचन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। सहभागी क्रियाओं की शृंखला और अंत में आने वाली दिव्य पहचान को एक दीर्घ, लयात्मक वाक्य में सुरक्षित रखा गया है। ‘अंधकार’, ‘ऊँचाइयों’ और ‘सेनाओं का परमेश्वर’ पाठ की भविष्यद्वक्ताई तथा ब्रह्मांडीय गंभीरता बनाए रखते हैं।
