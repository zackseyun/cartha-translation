source:
  edition: WLC
  text: וּ/פְרָצִ֥ים תֵּצֶ֖אנָה אִשָּׁ֣ה נֶגְדָּ֑/הּ וְ/הִשְׁלַכְתֶּ֥נָה הַ/הַרְמ֖וֹנָ/ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/003.yaml
  text: And through the breaches you will go out[a], each woman straight ahead of her[b], and you will be cast out toward Harmon,” declares Yahweh.
translation:
  language: hi
  text: और तुम दीवार की सेंधों से निकलोगी, हर स्त्री अपने सामने की दिशा में; और तुम हारमोन की ओर फेंक दी जाओगी[b],” यहोवा की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी क्रियारूप और “हारमोन” शब्द दोनों कठिन हैं। क्रिया का सक्रिय अर्थ भी संभव माना गया है, पर उसका कर्म स्पष्ट नहीं है। “हारमोन” को “गढ़” या “हर्मोन” भी समझा गया है, पर इसकी ठीक पहचान अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּפְרָצִים
  choice: दीवार की दरारों से
  rationale: פְרָצִים दीवार में पड़ी टूटनों या दरारों को सूचित करता है। प्रसंग में नगर से बाहर निकलने की गति निहित है, इसलिए हिन्दी में ‘से’ और स्पष्टता के लिए ‘दीवार की’ रखा गया है।
- source_word: תֵּצֶאנָה
  choice: तुम ... निकलोगी
  rationale: यह יצא का क़ाल रूप, द्वितीय पुरुष स्त्रीलिंग बहुवचन है और सामान्यतः सक्रिय अर्थ ‘निकलना’ देता है। निर्वासन की बाध्यता प्रसंग से स्पष्ट होती है, पर क्रिया को अनावश्यक रूप से कर्मवाच्य नहीं बनाया गया।
- source_word: אִשָּׁה נֶגְדָּהּ
  choice: एक-एक स्त्री सीधे अपने सामने की ओर
  rationale: אִשָּׁה यहाँ वितरणात्मक है, इसलिए ‘एक-एक स्त्री’ स्वाभाविक है। נֶגְדָּהּ का मूल भाव ‘उसके सामने’ या ‘उसके सम्मुख’ है; ‘सीधे’ तत्काल सामने की दरार से निकलने की प्रसंगगत दिशा व्यक्त करता है।
- source_word: וְהִשְׁלַכְתֶּנָה
  choice: और तुम ... फेंक दी जाओगी
  rationale: रूप कठिन है। प्रसंग में स्त्रियों का बलपूर्वक निष्कासन अभिप्रेत जान पड़ता है, इसलिए कर्मवाच्य हिन्दी चुनी गई है; कर्ता को नहीं जोड़ा गया। पाठ की व्याकरणिक कठिनाई पादटिप्पणी में स्वीकार की गई है।
- source_word: הַהַרְמוֹנָה
  choice: हारमोन की ओर
  rationale: यह शब्द अस्पष्ट है और संभवतः किसी स्थान का नाम है। अनिश्चित अर्थ को ‘गढ़’ या निश्चित पहचान ‘हर्मोन’ द्वारा हल करने के बजाय उसका लिप्यंतरण किया गया है। अन्त का दिशासूचक ה ‘की ओर’ से व्यक्त हुआ है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की घोषणा है
  rationale: यह मानक नबूवत-सूचक सूत्र है। नְאֻם को गरिमापूर्ण और स्वाभाविक हिन्दी में ‘घोषणा’ तथा יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: निष्कासन की क्रिया में कर्ता
  choice: कर्ता को अनिर्दिष्ट रखते हुए ‘फेंक दी जाओगी’
  alternative: परमेश्वर तुम्हें फेंक देगा
  rationale: प्रसंग न्याय को परमेश्वर से जोड़ता है, पर इस खंड में क्रिया का रूप कठिन है और कर्ता स्पष्ट रूप से व्यक्त नहीं है। इसलिए अनकहे कर्ता को धर्मवैज्ञानिक अनुमान से नहीं भरा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्त्रीलिंग बहुवचन ‘निकलोगी/जाओगी’ पिछले पदों में संबोधित सामरिया की स्त्रियों के अनुरूप है। अस्पष्ट स्थाननाम और कठिन क्रियारूप को मुख्य पाठ में जबरन निश्चित नहीं किया गया, बल्कि पादटिप्पणी में वास्तविक अनिश्चितता सुरक्षित रखी गई है।
