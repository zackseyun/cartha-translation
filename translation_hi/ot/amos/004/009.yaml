source:
  edition: WLC
  text: הִכֵּ֣יתִי אֶתְ/כֶם֮ בַּ/שִּׁדָּפ֣וֹן וּ/בַ/יֵּרָקוֹן֒ הַרְבּ֨וֹת גַּנּוֹתֵי/כֶ֧ם וְ/כַרְמֵי/כֶ֛ם וּ/תְאֵנֵי/כֶ֥ם וְ/זֵיתֵי/כֶ֖ם יֹאכַ֣ל הַ/גָּזָ֑ם וְ/לֹֽא שַׁבְתֶּ֥ם עָדַ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/amos/004/009.yaml
  text: I struck you with blight and mildew; your many gardens and your vineyards[a], your fig trees and your olive trees, the locust devoured; yet you did not return to me, declares Yahweh.
translation:
  language: hi
  text: मैंने तुम्हें झुलसा रोग और फफूंदी से मारा; तुम्हारे बहुत-से बगीचों और अंगूर की बारियों, अंजीर और जैतून के पेड़ों को टिड्डी[a] ने खा लिया; फिर भी तुम मेरी ओर नहीं लौटे—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में फसल खाने वाले एक कीट का नाम है; इसे परंपरागत रूप से एक प्रकार की टिड्डी समझा गया है। अन्य संभावित अनुवाद: “काटने वाली टिड्डी” या “कुतरने वाली टिड्डी।”'
    reason: मूल शब्द גָּזָם से सूचित कीट की सटीक प्रजाति अनिश्चित है।
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: मैंने तुम्हें…मारा
  rationale: हिफ़ील रूप का सीधा अर्थ ‘मारना/प्रहार करना’ है। यह चुनाव परमेश्वर के सक्रिय न्याय को स्पष्ट रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּשִּׁדָּפוֹן וּבַיֵּרָקוֹן
  choice: झुलसा रोग और गेरुई से
  rationale: ये कृषि को नष्ट करने वाले रोगों अथवा अवस्थाओं के युग्म हैं। ‘झुलसा रोग’ और ‘गेरुई’ आधुनिक कृषि-संदर्भ में संक्षिप्त तथा बोधगम्य समतुल्य हैं।
- source_word: הַרְבּוֹת גַּנּוֹתֵיכֶם וְכַרְמֵיכֶם
  choice: तुम्हारी बहुत-सी वाटिकाओं और दाख की बारियों को
  rationale: הַרְבּוֹת की परिमाण-सूचक शक्ति को ‘बहुत-सी’ से व्यक्त किया गया है। ‘वाटिकाएँ’ और ‘दाख की बारियाँ’ क्रमशः גַּנּוֹת और כְּרָמִים की कृषि-छवि बनाए रखते हैं।
- source_word: תְאֵנֵיכֶם וְזֵיתֵיכֶם
  choice: तुम्हारे अंजीर और जैतून के पेड़ों को
  rationale: संदर्भ में दोनों शब्द फलों के बजाय वृक्षों को सूचित करते हैं; इसलिए ‘पेड़ों’ को स्पष्ट किया गया है।
- source_word: יֹאכַל הַגָּזָם
  choice: टिड्डी खा गई
  rationale: גָּזָם फसल खाने वाले किसी कीट का नाम है, जिसे परंपरागत रूप से एक प्रकार की टिड्डी माना गया है। एकवचन सामूहिक भाव को हिन्दी में ‘टिड्डी’ स्वाभाविक रूप से व्यक्त करती है; पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא שַׁבְתֶּם עָדַי
  choice: फिर भी तुम मेरी ओर नहीं लौटे
  rationale: שׁוּב के लौटने, मन फिराने और परमेश्वर से संबंध बहाल करने के व्यापक वाचा-संबंधी भाव को ‘लौटे’ सुरक्षित रखता है, बिना इसे केवल मानसिक पश्चात्ताप तक सीमित किए।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם का औपचारिक भविष्यद्वाणी-सूत्र ‘घोषणा’ से व्यक्त होता है और יְהוָה को उपाधि से बदलने के बजाय उसके नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: שַׁבְתֶּם עָדַי का वाचा-संबंधी अर्थ
  choice: तुम मेरी ओर नहीं लौटे
  alternative: तुमने मन नहीं फिराया; तुम मेरे पास वापस नहीं आए
  rationale: ‘मेरी ओर लौटे’ शारीरिक वापसी, पश्चात्ताप और फिर से निष्ठावान होने के परस्पर जुड़े भावों को खुला रखता है तथा किसी एक धार्मिक व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृषि-संबंधी शब्दों में ‘झुलसा रोग’, ‘गेरुई’, ‘वाटिकाएँ’ और ‘दाख की बारियाँ’ चुने गए हैं। इब्रानी के कर्म-प्रथम विन्यास की कुछ छाप रखते हुए हिन्दी वाक्य को स्पष्ट बनाने के लिए विभक्ति-चिह्न जोड़े गए हैं।
