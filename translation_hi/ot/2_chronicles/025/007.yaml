  yaml_path: translation/ot/2_chronicles/025/007.yaml
  text: But a man of God came to him[a], saying, “O king, do not let the army of Israel go with you, for Yahweh is not with Israel, with all the sons of Ephraim.”
translation:
  language: hi
  text: परन्तु परमेश्वर का एक जन उसके पास आया और कहने लगा, “हे राजा, इस्राएल की सेना को अपने साथ न जाने दे, क्योंकि याहवे इस्राएल—अर्थात् एप्रैम के सभी पुत्रों[a]—के साथ नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम के सभी लोग।” इब्रानी में शाब्दिक रूप से, “एप्रैम के सभी पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का एक जन
  rationale: यह एक ईश्वरीय रूप से नियुक्त सन्देशवाहक की प्रचलित उपाधि है; ‘एक’ इस प्रसंग में अनिश्चित परिचय को व्यक्त करता है।
- source_word: בָּא אֵלָיו
  choice: उसके पास आया
  rationale: בוא के साथ אֶל यहाँ किसी व्यक्ति की ओर आने का सामान्य अर्थ देता है।
- source_word: לֵאמֹר
  choice: और कहने लगा
  rationale: इब्रानी के मानक कथन-परिचय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: हे राजा
  rationale: प्रत्यक्ष सम्बोधन होने के कारण हिन्दी में सम्बोधनसूचक ‘हे’ उपयुक्त है।
- source_word: אַל יָבֹא עִמְּךָ
  choice: अपने साथ न जाने दे
  rationale: क्रिया का मूल अर्थ ‘आना’ है, पर सैन्य अभियान के प्रसंग में हिन्दी में ‘साथ न जाने दे’ अधिक स्वाभाविक है; निषेधात्मक भाव सुरक्षित है।
- source_word: צְבָא יִשְׂרָאֵל
  choice: इस्राएल की सेना
  rationale: צָבָא यहाँ युद्ध के लिए संगठित सैन्य दल को दर्शाता है।
- source_word: כִּי אֵין יְהוָה עִם יִשְׂרָאֵל
  choice: क्योंकि याहवे इस्राएल के साथ नहीं है
  rationale: כִּי कारण बताता है और אֵין ... עִם ईश्वरीय समर्थन अथवा उपस्थिति के अभाव को मूल की तरह खुला रखता है।
- source_word: כֹּל בְּנֵי אֶפְרָיִם
  choice: अर्थात् एप्रैम के सभी वंशजों
  rationale: यह पद ‘इस्राएल’ को एप्रैम से सम्बद्ध उत्तरी समुदाय के रूप में स्पष्ट करता है। ‘वंशज’ पुत्रत्व-आधारित इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: ‘याहवे इस्राएल के साथ नहीं है’ का आशय
  choice: कथन को मूल की तरह बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: याहवे इस्राएल को विजय नहीं देगा
  rationale: ‘साथ होना’ ईश्वरीय उपस्थिति, अनुमोदन या सहायता की ओर संकेत कर सकता है; किसी एक आशय तक सीमित करना मूल की अर्थगत व्यापकता घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सैन्य प्रसंग में ‘साथ न जाने दे’ स्वाभाविक हिन्दी है। अंतिम पदबंध को ‘अर्थात्’ से जोड़ा गया है ताकि ‘इस्राएल’ और ‘एप्रैम के सभी वंशज’ के बीच स्पष्टकारी सम्बन्ध व्यक्त हो, बिना उन्हें दो अलग समूह बनाए।
