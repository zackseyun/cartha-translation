  text: וַ/עֲשֶׂ֨רֶת אֲלָפִ֜ים חַיִּ֗ים שָׁבוּ֙ בְּנֵ֣י יְהוּדָ֔ה וַ/יְבִיא֖וּ/ם לְ/רֹ֣אשׁ הַ/סָּ֑לַע וַ/יַּשְׁלִיכ֛וּ/ם מֵֽ/רֹאשׁ הַ/סֶּ֖לַע וְ/כֻלָּ֥/ם נִבְקָֽעוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/012.yaml
  text: And the sons of Judah captured ten thousand alive[a], brought them to the top of the cliff, and threw them down from the top of the cliff[b], and all of them were dashed to pieces.
translation:
  language: hi
  text: यहूदा के लोगों ने दस हज़ार लोगों को जीवित बंदी बना लिया, उन्हें चट्टान[a] की चोटी पर ले जाकर चट्टान की चोटी से नीचे फेंक दिया; वे सब के सब फटकर टुकड़े-टुकड़े हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘चट्टानी कगार’ अथवा ‘शैल’; इब्रानी: सेलाʿ।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘फट गए’ या ‘टूटकर अलग हो गए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁבוּ
  choice: पकड़ लिया
  rationale: सैन्य प्रसंग में, חַיִּים के साथ इसका अर्थ लोगों को जीवित बंदी बनाना है; ‘पकड़ लिया’ सरल और स्वाभाविक हिन्दी है।
- source_word: חַיִּים
  choice: जीवित
  rationale: यह बताता है कि इन दस हज़ार लोगों को युद्ध में मारने के बजाय जीवित पकड़ा गया था।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के लोगों
  rationale: शाब्दिक ‘यहूदा के पुत्रों’ के बजाय यह सामूहिक जातीय-सैन्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְבִיאוּם
  choice: वे उन्हें ... ले गए
  rationale: हिफ़ील रूप का मूल अर्थ ‘लाना/ले जाना’ है; हिन्दी में कथावाचक दृष्टि से गंतव्य तक ‘ले गए’ स्वाभाविक है।
- source_word: לְרֹאשׁ
  choice: की चोटी पर
  rationale: भौगोलिक आकृति के साथ רֹאשׁ का अर्थ ‘सिर’ नहीं, बल्कि ‘चोटी/ऊपरी भाग’ है।
- source_word: הַסָּלַע / הַסֶּלַע
  choice: चट्टान
  rationale: סֶלַע बड़ी चट्टान, शैल या चट्टानी कगार को सूचित कर सकता है। ‘चट्टान’ सामान्य पाठक के लिए स्पष्ट है और स्रोत की कुछ व्यापकता बनाए रखता है।
- source_word: וַיַּשְׁלִיכוּם
  choice: नीचे फेंक दिया
  rationale: שלך का अर्थ ‘फेंकना’ है; चोटी से फेंकने के प्रसंग में ‘नीचे’ दिशा को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְכֻלָּם
  choice: वे सब के सब
  rationale: यह इब्रानी में व्यक्त संपूर्णता और सर्वनाम-संदर्भ दोनों को बलपूर्वक बनाए रखता है।
- source_word: נִבְקָעוּ
  choice: चिरकर टुकड़े-टुकड़े हो गए
  rationale: निफ़अल रूप ‘चिर जाना/फट जाना/टूटकर अलग हो जाना’ दर्शाता है। यह अनुवाद हिंसक परिणाम को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
