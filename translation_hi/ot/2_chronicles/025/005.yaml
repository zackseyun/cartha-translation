base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/005.yaml
  text: Then Amaziah gathered Judah and appointed them by fathers’ houses under commanders of thousands and commanders of hundreds[a], for all Judah and Benjamin. He mustered them from twenty years old and upward, and found them to be three hundred thousand choice men, going out to war[c][b], able to handle spear and shield.
translation:
  language: hi
  text: तब अमस्याह ने यहूदा को इकट्ठा किया और सारे यहूदा और बिन्यामीन के लोगों को उनके पितृकुलों के अनुसार हज़ारों के प्रधानों और सैकड़ों के प्रधानों के अधीन नियुक्त किया। उसने बीस वर्ष और उससे अधिक आयु के लोगों की गिनती की और पाया कि वे तीन लाख चुने हुए पुरुष[a] थे, जो युद्ध के लिए निकलनेवाले[b] और भाला तथा ढाल[c] थामनेवाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जवान पुरुष”; इब्रानी शब्द בָּחוּר युवा पुरुष को भी दर्शा सकता है, पर इस सैन्य सूची में चुने हुए या सक्षम पुरुषों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “युद्ध के लिए निकलनेवाले”; यह सैन्य सेवा के योग्य या उसके लिए तैयार पुरुषों का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त इब्रानी शब्द צִנָּה विशेष रूप से बड़ी ढाल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ लोगों को इकट्ठा या एकत्र करना है; यह सहज आधुनिक हिन्दी है और सैन्य संदर्भ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: וַיַּעֲמִידֵם
  choice: उन्हें ... प्रधानों के अधीन खड़ा किया
  rationale: हिफ़ील रूप का मूल भाव ‘खड़ा करना/स्थान देना’ है। यहाँ यह सैन्य संगठन और अधिकारियों के अधीन नियुक्ति, दोनों को व्यक्त करता है।
- source_word: לְבֵית אָבוֹת
  choice: उनके पितृकुलों के अनुसार
  rationale: यह पद पैतृक वंश पर आधारित कुल अथवा घराने की सामाजिक इकाइयों को दर्शाता है; ‘पितृकुल’ संक्षिप्त और अर्थ-स्पष्ट है।
- source_word: לְשָׂרֵי הָאֲלָפִים וּלְשָׂרֵי הַמֵּאוֹת
  choice: हज़ार-हज़ार और सौ-सौ के प्रधानों के अधीन
  rationale: שׂר सैन्य-अधिकारी या प्रधान को दर्शाता है। यह अनुवाद पदानुक्रम को बनाए रखता है, पर यह दावा नहीं करता कि प्रत्येक इकाई में ठीक उतने ही सैनिक उपस्थित थे।
- source_word: וַיִּפְקְדֵם
  choice: पुरुषों की गिनती की
  rationale: פקד यहाँ सैन्य जनगणना या निरीक्षण का बोध देता है। ‘गिनती की’ आम पाठक के लिए स्पष्ट है और प्रसंग सैन्य भर्ती का आशय स्वयं देता है।
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह आयु-सीमा का मानक सूत्र है, जिसे स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וַיִּמְצָאֵם
  choice: पाया कि वे ... थे
  rationale: यह क्रिया की गई गिनती के परिणाम को प्रस्तुत करती है; हिन्दी में यह संरचना सहज और मूल के निकट है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: तीन लाख
  rationale: भारतीय हिन्दी संख्या-पद्धति में 300,000 का स्वाभाविक और सटीक रूप ‘तीन लाख’ है।
- source_word: בָּחוּר
  choice: चुने हुए पुरुष
  rationale: בָּחוּר का अर्थ युवा पुरुष भी हो सकता है, किंतु सैन्य सूची में यह चुने हुए या सक्षम पुरुषों की ओर संकेत कर सकता है। मुख्य पाठ में प्रसंगानुकूल अर्थ और पादटिप्पणी में वास्तविक वैकल्पिक अर्थ रखा गया है।
- source_word: יוֹצֵא צָבָא
  choice: सेना में जाने योग्य
  rationale: शाब्दिक भाव ‘सेना/युद्ध के लिए निकलनेवाला’ है। हिन्दी रूप सैन्य सेवा की योग्यता व्यक्त करता है और पादटिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: אֹחֵז רֹמַח וְצִנָּה
  choice: भाला तथा बड़ी ढाल थामने में समर्थ
  rationale: אֹחֵז का मूल अर्थ ‘थामनेवाला’ है, जबकि सैन्य प्रसंग में क्षमता निहित है। צִנָּה सामान्य छोटी ढाल नहीं, बल्कि बड़ी ढाल है, इसलिए यह विशेषता मुख्य पाठ में रखी गई है।
