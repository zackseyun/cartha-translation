source:
  edition: WLC
  text: וְ/אֶת בְּנֵי/הֶ֖ם לֹ֣א הֵמִ֑ית כִּ֣י כַ/כָּת֣וּב בַּ/תּוֹרָ֡ה בְּ/סֵ֣פֶר מֹשֶׁה֩ אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יָמ֨וּתוּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יָמ֣וּתוּ עַל אָב֔וֹת כִּ֛י אִ֥ישׁ בְּ/חֶטְא֖/וֹ יָמֽוּתוּ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/004.yaml
  text: But he did not put their sons to death[a], because it is written in the Law, in the Book of Moses, where Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers, but each man shall die for his own sin.”
translation:
  language: hi
  text: 'परन्तु उसने उनके पुत्रों को मृत्युदण्ड नहीं दिया, क्योंकि मूसा की पुस्तक में लिखी व्यवस्था में ऐसा लिखा है, जिसमें यहोवा ने आज्ञा दी है: “पुत्रों के कारण पिताओं को मृत्युदण्ड न दिया जाए, और पिताओं के कारण पुत्रों को मृत्युदण्ड न दिया जाए; बल्कि हर व्यक्ति अपने ही पाप के कारण मरे।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת בְּנֵי/הֶם לֹא הֵמִית
  choice: परन्तु उसने उनके पुत्रों को मृत्युदण्ड नहीं दिया
  rationale: वाव पिछले पद में हत्यारों को मार डालने के विपरीत उनके पुत्रों को छोड़ देने का विरोध दर्शाता है। מות के हिफ़ील रूप का न्यायिक आशय ‘मृत्युदण्ड देना’ से स्पष्ट होता है; בנים का विशिष्ट अर्थ ‘पुत्र’ रखा गया है।
- source_word: כִּי כַכָּתוּב
  choice: क्योंकि ... ऐसा लिखा है
  rationale: यह अमस्याह के कार्य का कारण लिखित धर्मशास्त्रीय आदेश के आधार पर बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּתּוֹרָה בְּסֵפֶר מֹשֶׁה
  choice: मूसा की पुस्तक में दी गई व्यवस्था में
  rationale: दोनों पदबंधों का निकट संबंध बनाए रखते हुए תורה का विधिक और शास्त्रीय अर्थ ‘व्यवस्था’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר צִוָּה יְהוָה לֵאמֹר
  choice: जहाँ यहोवा ने आज्ञा दी थी
  rationale: सापेक्ष उपवाक्य लिखित मूसीय व्यवस्था की ओर संकेत करता है और לאמר से आरम्भ होने वाले उद्धरण को हिन्दी में सहज रूप से प्रस्तुत करता है।
- source_word: לֹא יָמוּתוּ אָבוֹת עַל בָּנִים וּבָנִים לֹא יָמוּתוּ עַל אָבוֹת
  choice: पुत्रों के कारण पिता मृत्युदण्ड न पाएँ, और पिताओं के कारण पुत्र मृत्युदण्ड न पाएँ
  rationale: न्यायिक संदर्भ में ‘मृत्युदण्ड न पाएँ’ निषेध का आशय स्पष्ट करता है; על को दण्ड का आधार बताने वाले ‘के कारण’ से व्यक्त किया गया और मूल की सममिति बनाए रखी गई है।
- source_word: כִּי אִישׁ בְּחֶטְאוֹ יָמוּתוּ
  choice: बल्कि हर व्यक्ति अपने ही पाप के कारण मरे
  rationale: איש का वितरणात्मक भाव ‘हर व्यक्ति’ से स्वाभाविक और समावेशी हिन्दी में व्यक्त होता है। एकवचन कर्ता के साथ रूपतः बहुवचन क्रिया का आशय भी वितरणात्मक है; ‘अपने ही’ व्यक्तिगत उत्तरदायित्व पर मूल का बल बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम יהוה है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किया गया।
- issue: माता-पिता और संतान के पारस्परिक दण्ड का न्यायिक अर्थ
  choice: मृत्युदण्ड न पाएँ
  alternative: न मरें
  rationale: מות का साधारण अर्थ ‘मरना’ हो सकता है, पर व्यवस्थाविवरण 24:16 से उद्धृत यह आदेश न्यायिक दण्ड के बारे में है। इसलिए न्यायिक आशय स्पष्ट किया गया है, जबकि अंतिम व्यक्तिगत उत्तरदायित्व वाले खंड में मूल के अनुरूप ‘मरे’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘व्यवस्था’, ‘आज्ञा’ और ‘मृत्युदण्ड’ विधिक-शास्त्रीय प्रसंग को व्यक्त करते हैं; अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
