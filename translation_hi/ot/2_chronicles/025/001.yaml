base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/001.yaml
  text: Amaziah was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddan[b], from Jerusalem.
translation:
  language: hi
  text: अमस्याह पच्चीस वर्ष का था जब वह राजा बना, और उसने यरूशलेम में उनतीस वर्ष तक राज्य किया। उसकी माता का नाम यहोअद्दान था; वह यरूशलेम की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: पच्चीस वर्ष का था
  rationale: यह इब्रानी में आयु बताने का प्रचलित मुहावरा है; शाब्दिक रूप ‘पच्चीस वर्ष का पुत्र’ होगा, पर आधुनिक हिन्दी में चुना गया रूप स्वाभाविक और अर्थ-सटीक है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: पहला प्रयोग राज्यारोहण के समय को दर्शाता है; ‘राजा बना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: उनतीस वर्ष तक राज्य किया
  rationale: दूसरा प्रयोग शासन की अवधि बताता है; ‘राज्य किया’ राजकीय काल के लिए स्पष्ट और प्रचलित हिन्दी है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग בְּ को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: इब्रानी संरचना का अर्थ सुरक्षित रखते हुए आधुनिक, गरिमापूर्ण हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: יְהוֹעַדָּן
  choice: यहोअद्दान
  rationale: व्यक्तिनाम को इब्रानी व्यंजन-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִירוּשָׁלָיִם
  choice: वह यरूशलेम की थी
  rationale: מִן यहाँ माता के मूल स्थान को बताता है; हिन्दी में यह रूप ‘यरूशलेम से’ की अपेक्षा व्यक्ति की नगर-संबद्धता अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, स्वाभाविक और गरिमापूर्ण रखी गई है। राजकीय काल-विवरण की पारंपरिक शैली को अनावश्यक शाब्दिकता के बिना सुरक्षित रखा गया है।
