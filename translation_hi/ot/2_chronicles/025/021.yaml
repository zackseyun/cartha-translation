base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/021.yaml
  text: So Joash king of Israel went up[a], and he and Amaziah king of Judah faced one another at Beth-shemesh, which belongs to Judah.
translation:
  language: hi
  text: तब इस्राएल का राजा योआश चढ़ आया, और वह तथा यहूदा का राजा अमस्याह बेत-शेमेश में, जो यहूदा का था, आमने-सामने हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ आया
  rationale: कथात्मक प्रयोग में עלה का अर्थ ‘ऊपर जाना/चढ़ आना’ है। यहाँ योआश की युद्धस्थल की ओर गति व्यक्त है; ‘चढ़ आया’ मूल बिंब को रखता है, बिना सैन्य अर्थ को अनावश्यक रूप से स्पष्ट किए।
- source_word: וַיִּתְרָאוּ פָנִים
  choice: आमने-सामने हुए
  rationale: मुहावरे का शाब्दिक बिंब ‘चेहरे देखना’ है। युद्ध के संदर्भ में ‘आमने-सामने हुए’ स्वाभाविक हिन्दी है और मुठभेड़ का भाव बनाए रखता है।
- source_word: הוּא וַאֲמַצְיָהוּ
  choice: वह और ... अमस्याह
  rationale: स्पष्ट सर्वनाम הוּא दोनों पक्षों को उभारता है। ‘वह और ... अमस्याह’ इब्रानी संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּבֵית שֶׁמֶשׁ
  choice: बेत-शेमेश में
  rationale: בְ स्थान बताता है; हिन्दी में नगर के साथ ‘में’ स्वाभाविक है। स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר לִיהוּדָה
  choice: यहूदा के बेत-शेमेश
  rationale: לִיהוּדָה क्षेत्रीय संबंध/अधिकार दर्शाता है। हिन्दी में ‘यहूदा के बेत-शेमेश’ संक्षिप्त और स्वाभाविक रूप से बताता है कि यह नगर यहूदा का था।
- source_word: מֶלֶךְ יִשְׂרָאֵל / מֶלֶךְ יְהוּדָה
  choice: इस्राएल का राजा / यहूदा का राजा
  rationale: दोनों राजकीय उपाधियों का सीधा और समानांतर अनुवाद किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘आमने-सामने हुए’ मूल मुहावरे और युद्ध-संदर्भ, दोनों को पर्याप्त रूप से व्यक्त करता है; इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
