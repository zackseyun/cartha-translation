  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַחֲרֵ֣י מ֔וֹת יוֹאָ֥שׁ בֶּן יְהוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/025.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Joash son of Jehoahaz, king of Israel.
translation:
  language: hi
  text: यहूदा का राजा योआश का पुत्र अमस्याह, इस्राएल के राजा यहोआहाज के पुत्र योआश की मृत्यु के बाद पंद्रह वर्ष तक जीवित रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: यहाँ क्रिया חיה किसी अन्य राजा की मृत्यु के बाद एक निश्चित अवधि तक जीवन जारी रहने की सूचना देती है। ‘जीवित रहा’ स्वाभाविक हिंदी है और ‘उससे अधिक जीवित रहा’ जैसी व्याख्या को मुख्य पाठ में अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: हिब्रू व्यक्तिगत नाम का हिंदी बाइबलीय लिप्यंतरण।
- source_word: בֶן יוֹאָשׁ
  choice: योआश का पुत्र
  rationale: वंश-संबंध बताने वाली हिब्रू रचना का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: राजकीय पद और राज्य को दर्शाने वाली रचना का सीधा हिंदी अनुवाद।
- source_word: אַחֲרֵי מוֹת
  choice: की मृत्यु के बाद
  rationale: हिब्रू में ‘मृत्यु’ संज्ञा के साथ ‘बाद’ है; हिंदी में यही रचना अर्थ और रूप दोनों को स्वाभाविक ढंग से बनाए रखती है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: हिब्रू व्यक्तिगत नाम का हिंदी लिप्यंतरण।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: राजकीय पद और राज्य को दर्शाने वाली रचना का सीधा हिंदी अनुवाद।
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: पंद्रह वर्ष तक
  rationale: अवधि बताने वाले पद का स्वाभाविक हिंदी रूप; ‘तक’ क्रिया ‘जीवित रहा’ के साथ अवधि को स्पष्ट करता है।
