base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/010.yaml
  text: So Amaziah separated them[a], the troops that had come to him from Ephraim, to go to their place. And they became very angry with Judah and returned to their place in fierce anger.
translation:
  language: hi
  text: तब अमस्याह ने एप्रैम से उसके पास आए सैनिक-दल को अलग कर दिया, ताकि वे अपने स्थान को चले जाएँ। वे यहूदा पर[a] बहुत क्रोधित हुए और प्रचंड क्रोध में अपने स्थान को लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा से बहुत क्रोधित हुए।”
    reason: इब्रानी पूर्वसर्ग בְּ क्रोध के लक्ष्य के लिए “पर/के विरुद्ध/से” जैसे निकटवर्ती हिन्दी प्रयोगों की अनुमति देता है; मुख्य पाठ में अधिक स्पष्ट लक्ष्यसूचक रूप रखा गया है।
lexical_decisions:
- source_word: וַיַּבְדִּילֵם
  choice: अलग करके ... लौट जाने के लिए कहा
  rationale: בדל का मूल अर्थ ‘अलग करना’ है; प्रसंग में अमस्याह एप्रैमी सैनिक-दल को अपनी सेना से अलग कर वापस भेजता है। यह रूप मूल क्रिया और प्रसंगगत आशय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַגְּדוּד
  choice: सैनिक-दल
  rationale: גְּדוּד किसी सैन्य दल या टुकड़ी को सूचित करता है। ‘सैनिक-दल’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֲשֶׁר בָּא אֵלָיו מֵאֶפְרַיִם
  choice: एप्रैम से उसके पास आए
  rationale: यह संबंधवाचक उपवाक्य उस सैनिक-दल की पहचान करता है जिसे अलग किया गया था।
- source_word: לָלֶכֶת לִמְקוֹמָם
  choice: अपने स्थान को लौट जाने के लिए
  rationale: शाब्दिक अर्थ ‘अपने स्थान को जाने के लिए’ है; पूर्व प्रसंग में वे एप्रैम से आए थे, इसलिए ‘लौट जाने’ से दिशा स्वाभाविक रूप से स्पष्ट होती है।
- source_word: וַיִּחַר אַפָּם מְאֹד
  choice: वे ... बहुत क्रोधित हुए
  rationale: חרה אף के ‘क्रोध जलने’ वाले इब्रानी मुहावरे का अर्थ वर्तमान हिन्दी में स्वाभाविक ढंग से दिया गया है।
- source_word: בִּיהוּדָה
  choice: यहूदा से
  rationale: यह पूर्वसर्ग क्रोध के लक्ष्य को सूचित करता है। हिन्दी में ‘यहूदा से क्रोधित हुए’ सहज है और विरोध की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: וַיָּשׁוּבוּ לִמְקוֹמָם
  choice: अपने स्थान को लौट गए
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है; ‘अपने स्थान’ मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: בָּחֳרִי אָף
  choice: भयंकर रोष में
  rationale: यह पद गर्म या प्रचंड क्रोध को तीव्र करता है। ‘भयंकर रोष’ उसी बल को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
