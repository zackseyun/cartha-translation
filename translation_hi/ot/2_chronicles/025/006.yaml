  yaml_path: translation/ot/2_chronicles/025/006.yaml
  text: And he hired from Israel one hundred thousand mighty men of valor for one hundred talents of silver[a].
translation:
  language: hi
  text: और उसने इस्राएल से एक लाख वीर योद्धाओं को चाँदी के सौ किक्कार देकर भाड़े पर रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂכֹּר
  choice: भाड़े पर रखा
  rationale: שׂכר का सामान्य अर्थ मज़दूरी या भुगतान देकर किसी को नियुक्त करना है। यह अनुवाद भुगतान का भाव स्पष्ट करता है, पर उन्हें अलग से ‘भाड़े के सैनिक’ कहकर अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल से
  rationale: מן स्रोत या उद्गम को दर्शाता है। यहाँ ‘इस्राएल’ उत्तरी राज्य को सूचित करता है, जहाँ से ये सैनिक लिए गए।
- source_word: מֵאָה אֶלֶף
  choice: एक लाख
  rationale: हिन्दी में 100,000 के लिए स्वाभाविक और सटीक संख्या-रूप ‘एक लाख’ है।
- source_word: גִּבּוֹר חָיִל
  choice: वीर योद्धाओं
  rationale: यह पदबंध सामर्थ्यवान और युद्ध-कुशल पुरुषों को दर्शाता है। ‘वीर योद्धा’ सैन्य अर्थ और शौर्य दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּמֵאָה כִכַּר כָּסֶף
  choice: सौ किक्कार चाँदी देकर
  rationale: בְּ यहाँ मूल्य या भुगतान व्यक्त करता है। ‘देकर’ हिन्दी में संबंध स्पष्ट करता है; प्राचीन भार-मुद्रा की इकाई ‘किक्कार’ को परिवर्तित किए बिना रखा गया है।
