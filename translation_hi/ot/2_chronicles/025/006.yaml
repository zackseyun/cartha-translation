  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘किक्कार’ बाइबलीय प्राचीन इकाई के रूप में सुरक्षित है। ‘वीर योद्धा’ के लिए अलग पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि हिन्दी पदबंध मूल के सैन्य और शौर्य-संबंधी आशय को पर्याप्त रूप से व्यक्त करता है।
