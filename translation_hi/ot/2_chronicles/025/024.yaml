base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/024.yaml
  text: And he took all the gold and the silver[a], and all the vessels found in the house of God with Obed-edom, and the treasures of the king’s house, and hostages[b], and returned to Samaria.
translation:
  language: hi
  text: और वह सारा सोना और चाँदी, परमेश्वर के भवन में ओबेद-एदोम के पास पाए गए सारे पात्र[a], राजभवन के खजाने और बंधकों को[b] लेकर शोमरोन लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ओबेद-एदोम की देखरेख में’; इब्रानी में शाब्दिक रूप से ‘ओबेद-एदोम के साथ’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘जमानतों के पुत्र’; संभवतः ऐसे लोग जिन्हें सुरक्षा की गारंटी के रूप में रखा गया था, अर्थात बंधक।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הַזָּהָב וְהַכֶּסֶף
  choice: सारा सोना और चाँदी
  rationale: כָל की समग्रता को बनाए रखते हुए दोनों बहुमूल्य धातुओं का अलग-अलग उल्लेख स्वाभाविक हिन्दी में रखा गया है।
- source_word: כָל הַכֵּלִים
  choice: सारे पात्र
  rationale: כֵּלִים वस्तुओं, उपकरणों या पात्रों के लिए व्यापक शब्द है; मंदिर के संदर्भ में ‘पात्र’ स्पष्ट, गरिमापूर्ण और प्रचलित है।
- source_word: הַנִּמְצְאִים
  choice: पाए गए
  rationale: कृदंत उन पात्रों के वहाँ पाए जाने या मौजूद होने को व्यक्त करता है; ‘पाए गए’ स्रोत के रूप के निकट और हिन्दी में सहज है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह हिब्रू अभिव्यक्ति का सीधा और स्वाभाविक रूप है तथा ‘मंदिर’ कहकर निहित अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: עִם עֹבֵד אֱדוֹם
  choice: ओबेद-एदोम के पास
  rationale: עִם का मूल अर्थ ‘साथ/पास’ है। ‘के पास’ हिन्दी में स्वाभाविक रहते हुए इस अनिश्चितता को बनाए रखता है कि आशय केवल स्थान-संबंध है या अभिरक्षा।
- source_word: אֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: राजभवन के खजाने
  rationale: संदर्भ में अֹצְרוֹת से भंडारों के बजाय उनमें रखी मूल्यवान संपत्ति अभिप्रेत है। ‘राजभवन’ हिन्दी में राजा के घर अर्थात महल को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: बंधक बनाए गए लोग
  rationale: शाब्दिक रूप ‘प्रतिज्ञाओं/जमानतों के पुत्र’ कठिन है और संभवतः सुरक्षा के रूप में रखे व्यक्तियों का संकेत देता है। स्पष्ट अर्थ मुख्य पाठ में और शाब्दिक कठिनाई पादटिप्पणी में रखी गई है।
- source_word: וַיָּשָׁב שֹׁמְרוֹן
  choice: लेकर शोमरोन लौट गया
  rationale: וַיָּשָׁב कथा को आगे बढ़ाते हुए वापसी बताता है। पद की वस्तु-सूची के साथ हिन्दी में ‘लेकर ... लौट गया’ स्वाभाविक है; कर्ता पिछले संदर्भ से समझा जाता है।
