base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/018.yaml
  text: Then Joash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying, ‘Give your daughter to my son as a wife.’ Then a wild beast of the field that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: hi
  text: 'तब इस्राएल के राजा योआश ने यहूदा के राजा अमस्याह के पास यह संदेश भेजा: “लबानोन में की कँटीली झाड़ी[a] ने लबानोन में के देवदार को संदेश भेजकर कहा, ‘अपनी बेटी को मेरे बेटे की पत्नी बनने के लिए दे।’ फिर लबानोन में का एक जंगली पशु उधर से गुज़रा और उसने उस कँटीली झाड़ी को रौंद डाला।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काँटेदार पौधा” अथवा “कँटीली बूटी।” हिब्रू शब्द किसी काँटेदार पौधे का नाम है; उसकी ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוֹחַ
  choice: कँटीली झाड़ी
  rationale: यह शब्द किसी काँटेदार पौधे को सूचित करता है, पर उसकी ठीक प्रजाति अनिश्चित है। ‘कँटीली झाड़ी’ देवदार के साथ उसके छोटे और दुर्बल होने का स्वाभाविक विरोध बनाए रखती है।
- source_word: הָאֶרֶז
  choice: देवदार
  rationale: यह शब्द देवदार के वृक्ष को सूचित करता है; हिंदी में ‘देवदार’ ऊँचाई और सामर्थ्य की उपमा को स्पष्ट रखता है।
- source_word: בַּלְּבָנוֹן
  choice: लबानोन का / लबानोन की
  rationale: संबंधकारक रचना आधुनिक हिंदी में स्वाभाविक रूप से बताती है कि पौधे और पशु लबानोन में थे।
- source_word: שָׁלַח ... לֵאמֹר
  choice: संदेश भेजकर कहा
  rationale: हिब्रू की संदेश भेजने और कहने की संयुक्त अभिव्यक्ति को स्पष्ट तथा स्वाभाविक आधुनिक हिंदी में रखा गया है।
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: अपनी बेटी का विवाह मेरे बेटे से कर दे
  rationale: यह विवाह-संबंध की प्रार्थना है; यह हिंदी रूप मूल संबंध को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: एक जंगली पशु
  rationale: यह पद स्थल पर रहने वाले किसी अनिर्दिष्ट वन्य पशु को दर्शाता है; ‘जंगली पशु’ हिंदी में स्वाभाविक है और प्रजाति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַתַּעֲבֹר
  choice: उधर से निकला
  rationale: यह उस पशु के पास से गुजरने की आकस्मिक गति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתִּרְמֹס
  choice: रौंद डाला
  rationale: यह क्रिया पैरों तले कुचलने का सजीव भाव देती है और हिब्रू क्रिया की तीव्रता बनाए रखती है।
- source_word: וַיִּשְׁלַח ... אֶל ... לֵאמֹר
  choice: के पास यह संदेश भेजा
  rationale: हिब्रू में भेजी गई वस्तु अंतर्निहित संदेश है; उसे हिंदी में स्पष्ट करना वाक्य को सहज बनाता है, जबकि संदेश की दिशा और कथन की भूमिका सुरक्षित रहती है।
