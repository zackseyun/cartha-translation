  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י אֲמַצְיָ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרוֹנִ֑ים הֲ/לֹא֙ הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/026.yaml
  text: The rest of the acts of Amaziah[a], from first to last[b], are they not written in the Book of the Kings of Judah and Israel?
translation:
  language: hi
  text: अमस्याह के बाकी काम—आरम्भ से अन्त तक—क्या यहूदा और इस्राएल के राजाओं की पुस्तक में लिखे हुए नहीं हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: राजकीय इतिहास के इस समापन-सूत्र में דִּבְרֵי केवल कथनों को नहीं, बल्कि राजा के कामों और उसके शासन की घटनाओं को दर्शाता है; ‘बाकी काम’ सहज और अर्थानुकूल है।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: आरम्भ से अन्त तक
  rationale: यह युग्म उसके पूरे शासनकाल के कामों के विस्तार को व्यक्त करता है; हिन्दी मुहावरे में यह स्वाभाविक है।
- source_word: הֲלֹא הִנָּם כְּתוּבִים
  choice: क्या ... लिखे हुए नहीं हैं?
  rationale: हिब्रू का आलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में इसी प्रश्नात्मक बल को बनाए रखा गया है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक पर’ सम्भव है, पर किसी अभिलेख में सामग्री लिखे होने के लिए स्वाभाविक हिन्दी ‘पुस्तक में’ है।
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल के राजाओं की
  rationale: स्रोत के क्रम को सुरक्षित रखते हुए उद्धृत अभिलेख का शीर्षक-सदृश नाम दिया गया है।
