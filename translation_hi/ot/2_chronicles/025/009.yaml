base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/009.yaml
  text: Amaziah said to the man of God[a], “But what should be done about the hundred talents that I have given to the troops of Israel?” The man of God said[b], “Yahweh is able to give you much more than this.”
translation:
  language: hi
  text: अमस्याह ने परमेश्वर के जन से कहा, “लेकिन उन सौ किक्कारों[a] के बारे में क्या किया जाए, जो मैंने इस्राएली सैनिक-दल को दिए हैं?” परमेश्वर के जन ने कहा, “याहवे तुम्हें इससे कहीं अधिक दे सकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पिछले पद में इन्हें चाँदी के किक्कार बताया गया है। किक्कार भार की एक प्राचीन इकाई थी।
    reason: cross_reference
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह परमेश्वर द्वारा नियुक्त संदेशवाहक के लिए प्रचलित इब्रानी पदवी है। यह शब्द-रूप को बनाए रखती है और पद को अनावश्यक रूप से ‘भविष्यद्वक्ता’ तक सीमित नहीं करती।
- source_word: וּמַה לַּעֲשׂוֹת
  choice: लेकिन ... का क्या होगा
  rationale: संदर्भ में अमस्याह पहले दिए गए धन के विषय में आपत्ति जता रहा है। यह स्वाभाविक हिन्दी में मुहावरे का आशय और विरोधसूचक बल व्यक्त करता है।
- source_word: מְאַת הַכִּכָּר
  choice: सौ किक्कारों
  rationale: כִּכָּר भार की एक प्राचीन इकाई है। पिछले पद में चाँदी का उल्लेख है, पर इस पद में नहीं; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: גְדוּד יִשְׂרָאֵל
  choice: इस्राएली सैनिक-दल
  rationale: גְּדוּד सैनिकों के दल या सैन्य टुकड़ी को दर्शाता है। भाड़े के सैनिकों के इस संदर्भ में यह सहज और सटीक है।
- source_word: יֵשׁ לַיהוָה לָתֶת לְךָ
  choice: याहवे तुम्हें ... दे सकता है
  rationale: यह अस्तित्वसूचक रचना याहवे की देने की सामर्थ्य अथवा उपलब्ध साधनों पर बल देती है। हिन्दी में ‘दे सकता है’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַרְבֵּה מִזֶּה
  choice: इससे कहीं अधिक
  rationale: तुलनात्मक रचना प्रचुर मात्रा को व्यक्त करती है; ‘कहीं अधिक’ इसका स्पष्ट, स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन आया है; ‘याहवे’ उसका लिप्यंतरण है, न कि उसके स्थान पर कोई उपाधि।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उपाधि से प्रतिस्थापित नहीं करता।
- issue: יֵשׁ לַיהוָה की क्षमता-सूचक अभिव्यक्ति
  choice: याहवे ... दे सकता है
  alternative: याहवे के पास ... देने के लिए पर्याप्त है
  rationale: दोनों अर्थ मूल रचना में संभव हैं। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए सामर्थ्य का भाव चुना गया है; संसाधन-सम्पन्नता वाला निकट विकल्प भी अर्थगत रूप से मान्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘परमेश्वर का जन’ पारंपरिक बाइबलीय पदवी को सुरक्षित रखता है। ‘किक्कार’ को सांस्कृतिक-ऐतिहासिक भार-इकाई के रूप में रखा गया और पादटिप्पणी में स्पष्ट किया गया है।
