source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בַּ/אֲמַצְיָ֑הוּ וַ/יִּשְׁלַ֤ח אֵלָי/ו֙ נָבִ֔יא וַ/יֹּ֣אמֶר ל֗/וֹ לָ֤/מָּה דָרַ֨שְׁתָּ֙ אֶת אֱלֹהֵ֣י הָ/עָ֔ם אֲשֶׁ֛ר לֹא הִצִּ֥ילוּ אֶת עַמָּ֖/ם מִ/יָּדֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/015.yaml
  text: Then Yahweh’s anger burned against Amaziah[a], and he sent a prophet to him, who said to him, “Why have you sought the gods of the people who did not deliver their people from your hand?”
translation:
  language: hi
  text: तब याहवे का क्रोध अमस्याह पर भड़क उठा। उसने उसके पास एक नबी भेजा, जिसने उससे कहा, “तूने उन लोगों के देवताओं की खोज क्यों की[a], जिन्होंने अपने लोगों को तेरे हाथ से नहीं बचाया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनसे पूछा” अथवा “उनसे परामर्श लिया।”
    reason: मूल क्रिया का अर्थ खोजना, पूछताछ करना या परामर्श लेना हो सकता है।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध ... भड़क उठा
  rationale: यह स्वाभाविक हिन्दी में इब्रानी के ‘क्रोध जलने’ वाले सजीव मुहावरे को बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בַּאֲמַצְיָהוּ
  choice: अमस्याह पर
  rationale: क्रोध के साथ בְּ यहाँ क्रोध की दिशा या लक्ष्य बताता है।
- source_word: נָבִיא
  choice: एक नबी
  rationale: भविष्यद्वक्ता-संदेशवाहक के लिए यह प्रचलित और सहज हिन्दी शब्द है।
- source_word: דָרַשְׁתָּ
  choice: खोज ... की
  rationale: דרש का अर्थ धार्मिक संदर्भ में खोजना, पूछताछ करना या परामर्श लेना हो सकता है; ‘खोज की’ इसकी व्यापकता और अस्पष्टता बचाता है।
- source_word: אֱלֹהֵי הָעָם
  choice: उन लोगों के देवताओं
  rationale: संदर्भित पराजित जाति के देवताओं को दर्शाने वाला स्वाभाविक हिन्दी निर्माण है।
- source_word: אֲשֶׁר לֹא הִצִּילוּ
  choice: जिन्होंने ... नहीं बचाया
  rationale: हिफ़ील क्रिया का उद्धार या बचाव संबंधी अर्थ सैन्य संदर्भ में स्पष्ट रहता है; पाठ केवल यह कहता है कि उन्होंने नहीं बचाया, यह नहीं कि वे बचा नहीं सकते थे।
- source_word: עַמָּם
  choice: अपने ही लोगों को
  rationale: ‘अपने ही’ सम्बन्धवाचक भाव को स्वाभाविक हिन्दी में स्पष्ट करता और कथन की विडंबना उभारता है।
- source_word: מִיָּדֶךָ
  choice: तेरे हाथ से
  rationale: यह शक्ति और नियंत्रण का इब्रानी मूर्त मुहावरा बनाए रखता है और हिन्दी में समझने योग्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘यहवे’ उसका हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: דרש की धार्मिक क्रिया का आशय
  choice: खोज की
  alternative: पूछा / परामर्श लिया / उपासना की
  rationale: मूल क्रिया का अर्थ-विस्तार खोजना, पूछना और परामर्श लेना समेटता है। केवल ‘उपासना की’ कहना संदर्भ से सम्भव होते हुए भी मूल से अधिक निश्चित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। राजकीय संबोधन में एकवचन ‘तू/तेरे’ मूल के एकवचन रूपों और सीधे नबी-संबोधन को दर्शाता है। वाक्य-विन्यास को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
