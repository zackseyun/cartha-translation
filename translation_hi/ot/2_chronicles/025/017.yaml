  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। वंशावली को सामान्य पाठक के लिए स्पष्ट किया गया है, और अंतिम इब्रानी मुहावरे की वास्तविक अर्थ-व्याप्ति फुटनोट में सुरक्षित रखी गई है।
