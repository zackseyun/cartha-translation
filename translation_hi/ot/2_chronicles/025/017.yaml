base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/017.yaml
  text: Then Amaziah king of Judah took counsel and sent to Joash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come, let us face one another.”
translation:
  language: hi
  text: 'तब यहूदा के राजा अमस्याह ने परामर्श किया और इस्राएल के राजा येहू के पोते, यहोआहाज के पुत्र योआश के पास यह संदेश भेजा: “आओ, हम आमने-सामने हों।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम एक-दूसरे का सामना करें।” इब्रानी मुहावरा शाब्दिक रूप से एक-दूसरे का मुख देखने की बात करता है; यहाँ संभवतः इसका अर्थ सीधी मुठभेड़ की चुनौती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: सलाह की
  rationale: निफ़अल रूप यहाँ विचार-विमर्श अथवा परामर्श करने का भाव देता है; ‘सलाह की’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस कथात्मक बारीकी को बनाए रखता है।
- source_word: וַיִּשְׁלַח אֶל
  choice: के पास यह संदेश भेजा
  rationale: मूल में केवल ‘के पास भेजा’ है और भेजी गई बात आगे उद्धृत है। हिन्दी में कर्ता अथवा दूत को अनावश्यक रूप से जोड़े बिना ‘संदेश भेजा’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा येहू के पोते, यहोआहाज के पुत्र योआश
  rationale: सभी नाम, वंश-संबंध और राजकीय उपाधि सुरक्षित रखे गए हैं। हिन्दी में संबंधों को स्पष्ट और सहज बनाने के लिए क्रम को पुनर्गठित किया गया है।
- source_word: לֵאמֹר
  choice: 'यह संदेश भेजा:'
  rationale: इब्रानी का मानक कथन-परिचायक हिन्दी में अलग से ‘यह कहते हुए’ रखने पर बोझिल होता; उद्धरण-चिह्न से पहले यह रचना उसका कार्य स्वाभाविक ढंग से करती है।
- source_word: לְךָ
  choice: आओ
  rationale: इस प्रसंग में आदेशात्मक रूप चुनौती के निमंत्रण के रूप में प्रयुक्त है; ‘आओ’ उसका संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: נִתְרָאֶה פָנִים
  choice: हम आमने-सामने हों
  rationale: शाब्दिक मुख-दर्शन वाले मुहावरे को स्वाभाविक हिन्दी में रखते हुए सीधी भेंट और संभावित मुठभेड़—दोनों निहितार्थ सुरक्षित रखता है।
