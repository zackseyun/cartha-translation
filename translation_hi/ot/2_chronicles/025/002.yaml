    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने किया
  rationale: वाव-क्रमिक अपूर्ण क्रिया यहाँ अतीत की कथा को आगे बढ़ाती है; स्वाभाविक हिन्दी में आरम्भिक ‘और’ आवश्यक नहीं है।
- source_word: הַיָּשָׁר
  choice: वह ... जो ... सही था
  rationale: लेखयुक्त विशेषण संज्ञा की तरह प्रयुक्त है और ‘जो सही था’ नैतिक मूल्यांकन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह इब्रानी का प्रचलित मूल्यांकन-सूचक मुहावरा है; ‘दृष्टि में’ मूल रूपक और अर्थ दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: רַק
  choice: फिर भी
  rationale: यहाँ רַק पहले सकारात्मक कथन को सीमित करता है; ‘फिर भी’ उसके विरोधात्मक-सीमाकारी बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא
  choice: नहीं
  rationale: साधारण निषेध।
- source_word: בְּלֵבָב שָׁלֵם
  choice: पूरे मन से
  rationale: यह वाक्यांश भक्ति या निष्ठा की पूर्णता का संकेत देता है। ‘पूरे मन से’ आधुनिक हिन्दी में स्वाभाविक है और मूल के हृदय/मन-संबंधी रूपक को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में परिचित ‘यहोवा’ नाम को बनाए रखना उपाधि ‘प्रभु’ से प्रतिस्थापित करने की अपेक्षा स्रोत के अधिक निकट है।
- issue: अमस्याह की भक्ति की अपूर्णता
  choice: पूरे मन से नहीं
  alternative: सिद्ध मन से नहीं / सम्पूर्ण हृदय से नहीं
  rationale: इब्रानी कथन उसके बाहरी रूप से सही कार्य और अधूरी भीतरी निष्ठा के बीच तनाव रखता है, पर उससे अधिक कठोर निष्कर्ष नहीं निकालता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘दृष्टि में’ मूल इब्रानी मुहावरे को बनाए रखता है; ‘पूरे मन से’ शाब्दिक रूपक और स्वाभाविक हिन्दी के बीच संतुलन देता है।
