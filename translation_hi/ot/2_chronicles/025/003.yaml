  text: When the kingdom was firmly in his hand[a], he killed his servants who had struck down the king his father.
translation:
  language: hi
  text: जब राजसत्ता उसके हाथ में दृढ़ हो गई,[a] तब उसने अपने उन सेवकों को मार डाला जिन्होंने उसके पिता, राजा को मार गिराया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावानुवाद के साथ, “जब राजसत्ता पूरी तरह उसके नियंत्रण में आ गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब ... तब
  rationale: यह कथात्मक सूत्र अगले प्रसंग का समय बताता है। हिन्दी में ‘जब ... तब’ स्वाभाविक रूप से काल-संबंध स्पष्ट करता है, बिना ऐसा ‘अब’ जोड़ने के जिसका स्रोत में स्पष्ट शब्द नहीं है।
- source_word: חָזְקָה הַמַּמְלָכָה עָלָיו
  choice: राज्य पर उसका अधिकार दृढ़ हो गया
  rationale: यहाँ חזק शारीरिक शक्ति नहीं, राजसत्ता के सुदृढ़ होने को व्यक्त करता है। עָלָיו का शाब्दिक रूप ‘उस पर’ हिन्दी में भ्रामक हो सकता है; यह अनुवाद नियंत्रण का आशय रखते हुए הַמַּמְלָכָה को ‘राज्य’ के रूप में बनाए रखता है।
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: הרג के लिए यह स्पष्ट, आधुनिक और प्रसंगानुकूल हिन्दी अभिव्यक्ति है।
- source_word: עֲבָדָיו
  choice: अपने ... सेवकों
  rationale: राजदरबार के प्रसंग में עבד राजा की सेवा में लगे सेवकों या अधिकारियों को सूचित कर सकता है। ‘सेवक’ पद अथवा बंधुआ स्थिति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַמַּכִּים
  choice: जिन्होंने ... मार गिराया था
  rationale: נכה का कृदंत उन सेवकों को पिता के हत्यारों के रूप में पहचानता है। ‘मार गिराया’ हिंसक प्रहार और परिणामी मृत्यु दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת הַמֶּלֶךְ אָבִיו
  choice: उसके पिता, राजा को
  rationale: यह रूप पिता और राजा के बीच मूल इब्रानी के समानाधिकरण को बनाए रखता है और हिन्दी में स्पष्ट है।
