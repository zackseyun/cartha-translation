  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। राजसत्ता के सुदृढ़ होने का अर्थ स्पष्ट किया गया है, पर ‘राज्य’ और ‘सेवक’ जैसे स्रोत-सन्निकट शब्द बनाए रखे गए हैं।
