  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יוֹאָ֣שׁ בֶּן יְהוֹאָחָ֗ז תָּפַ֛שׂ יוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ וַ/יְבִיאֵ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹ֞ץ בְּ/חוֹמַ֣ת יְרוּשָׁלִַ֗ם מִ/שַּׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פּוֹנֶ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/023.yaml
  text: And Joash king of Israel captured Amaziah king of Judah[a], the son of Joash, son of Jehoahaz, at Beth-shemesh, and brought him to Jerusalem. Then he broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: hi
  text: इस्राएल के राजा योआश ने यहूदा के राजा अमस्याह को, जो योआश का पुत्र और यहोआहाज का पोता था, बेत-शेमेश में पकड़ लिया और उसे यरूशलेम ले आया। फिर उसने यरूशलेम की शहरपनाह का एप्रैम फाटक से लेकर कोने के फाटक[a] तक चार सौ हाथ लंबा भाग ढा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक शाब्दिक रूप में, “उस फाटक तक जो मुड़ता है/जिसकी ओर मुख है।” “कोने का फाटक” सम्भवतः वही फाटक है जिसका उल्लेख 2 राजा 14:13 के समानांतर वृत्तांत में मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּפַשׂ
  choice: पकड़ लिया
  rationale: यह क्रिया किसी को अधिकार में लेने या बंदी बनाने का भाव देती है। सैन्य प्रसंग में ‘पकड़ लिया’ स्वाभाविक है और मूल से अधिक विवरण नहीं जोड़ता।
- source_word: בְּבֵית שָׁמֶשׁ
  choice: बेत-शेमेश में
  rationale: स्थानवाचक בְּ को यहाँ घटना के स्थान के रूप में लिया गया है; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: וַיְבִיאֵהוּ
  choice: उसे यरूशलेम ले आया
  rationale: בוא के हिफ़ील रूप का सामान्य अर्थ ‘ले आना’ है; यह ले जाने के ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיִּפְרֹץ בְּחוֹמַת יְרוּשָׁלִַם
  choice: यरूशलेम की शहरपनाह को ... ढा दिया
  rationale: פרץ यहाँ दीवार में दरार डालने या उसके एक भाग को तोड़ने के अर्थ में है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को स्पष्ट करता है और ‘ढा दिया’ सहज आधुनिक हिन्दी है।
- source_word: מִשַּׁעַר אֶפְרַיִם עַד שַׁעַר הַפּוֹנֶה
  choice: एप्रैम फाटक से लेकर कोने के फाटक तक
  rationale: पहला पद नामित नगर-द्वार है। הַפּוֹנֶה का शाब्दिक अर्थ अस्पष्ट है, पर 2 राजा 14:13 के समानांतर वृत्तांत के आधार पर ‘कोने का फाटक’ सम्भावित पहचान है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: चार सौ हाथ की दूरी में
  rationale: אַמָּה प्राचीन लंबाई की इकाई ‘हाथ’ है। मूल में माप सीधे दिया गया है; हिन्दी में ‘की दूरी में’ जोड़ने से यह स्पष्ट होता है कि दीवार का कितना भाग ढाया गया।
- source_word: בֶּן יוֹאָשׁ בֶּן יְהוֹאָחָז
  choice: योआश का पुत्र और यहोआहाज का पोता
  rationale: लगातार दो बार आए בֶּן को स्वाभाविक हिन्दी वंश-संबंध में व्यक्त किया गया है और दोनों पीढ़ियाँ सुरक्षित रखी गई हैं।
