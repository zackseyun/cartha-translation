base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/008.yaml
  text: But if you do go[a], act resolutely in battle; God will make you stumble before the enemy[b], for there is power in God to help and to make stumble.
translation:
  language: hi
  text: परन्तु यदि तुम जाओ ही, तो युद्ध के लिए दृढ़ बनो; परमेश्वर तुम्हें शत्रु के सामने ठोकर खिलाएगा[a], क्योंकि परमेश्वर में सहायता करने और ठोकर खिलाने की सामर्थ्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसी हिब्रू क्रिया की पुनरावृत्ति आगे भी हुई है: परमेश्वर में ‘सहायता करने’ और ‘ठोकर खिलाने’—दोनों की सामर्थ्य है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु यदि
  rationale: यह पद पिछले निर्देश के विपरीत एक शर्त प्रस्तुत करता है; ‘परन्तु यदि’ उस विरोधात्मक भाव को स्पष्ट रखता है।
- source_word: בֹּא אַתָּה
  choice: तुम जाओ ही
  rationale: क्रिया के साथ स्पष्ट सर्वनाम से आए बल को ‘ही’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עֲשֵׂה חֲזַק לַמִּלְחָמָה
  choice: युद्ध में दृढ़ता से काम करो
  rationale: शाब्दिक ‘बलवान होकर करो’ के बजाय यह युद्ध-संदर्भ में दृढ़ होकर कार्य करने की आज्ञा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַכְשִׁילְךָ
  choice: तुम्हें ... ठोकर खिलाएगा
  rationale: हिफ़ील रूप का कारक अर्थ सुरक्षित है और इसी मूल की पद के अंत में हुई पुनरावृत्ति भी बनी रहती है।
- source_word: לִפְנֵי אוֹיֵב
  choice: शत्रु के सामने
  rationale: यह शत्रु की उपस्थिति में पराजित या गिराए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֶשׁ כֹּחַ בֵּאלֹהִים
  choice: परमेश्वर में ... सामर्थ्य है
  rationale: हिब्रू की अस्तित्ववाचक संरचना को बनाए रखते हुए पूरक क्रियार्थक रूपों से स्वाभाविक सम्बन्ध रखा गया है।
- source_word: לַעְזֹר וּלְהַכְשִׁיל
  choice: सहायता करने और ठोकर खिलाने
  rationale: दोनों समांतर क्रियाओं को रखा गया है और כשל की पहले आए रूप से शब्दगत कड़ी सुरक्षित है।
theological_decisions:
- issue: सैनिक पराजय में परमेश्वर की प्रत्यक्ष भूमिका
  choice: परमेश्वर तुम्हें ... ठोकर खिलाएगा
  alternative: परमेश्वर तुम्हें ठोकर खाने देगा
  rationale: हिब्रू कारक क्रिया द्वारा परमेश्वर की प्रत्यक्ष भूमिका व्यक्त करता है। उसे केवल अनुमति देने के रूप में नरम करना मूल पाठ के धर्मवैचारिक तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथन। ‘ठोकर खिलाना’ जानबूझकर दोनों स्थानों पर रखा गया है ताकि मूल की शब्द-पुनरावृत्ति दिखाई दे; ‘परमेश्वर’ सामान्य बाइबलीय हिन्दी के अनुरूप है।
