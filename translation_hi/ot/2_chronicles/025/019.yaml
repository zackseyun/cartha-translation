base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/019.yaml
  text: You said[a], ‘Look, you have struck Edom, and your heart has lifted you up to boast.’ Now stay at home. Why should you provoke disaster, so that you fall—you and Judah with you?
translation:
  language: hi
  text: तूने कहा, ‘देख, तूने एदोम को हरा दिया है, और तेरे मन ने तुझे अपनी बड़ाई करने के लिए ऊँचा उठा दिया है।’[a] अब अपने घर में ही रह। तू क्यों विपत्ति को मोल लेता है, जिससे तू गिर पड़े—तू और तेरे साथ यहूदा भी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे मन ने तुझे महिमा पाने के लिए ऊँचा उठा दिया है” अथवा “तेरे मन ने तुझे सम्मान पाने के लिए घमंडी बना दिया है।” हिब्रू अभिव्यक्ति विजय के बाद स्वयं को ऊँचा समझने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתָּ
  choice: तूने कहा
  rationale: यह אמר का काल पूर्ण, द्वितीय पुरुष एकवचन रूप है और सामने वाले राजा के दावे को प्रस्तुत करता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह बल देने वाला संकेतवाचक अव्यय है; आधुनिक हिन्दी में ‘देख’ उसका स्वाभाविक प्रभाव बनाए रखता है।
- source_word: הִכִּיתָ אֶת אֱדוֹם
  choice: तूने एदोम को हरा दिया है
  rationale: נכה का हिफ़ील रूप युद्ध के प्रसंग में मारने अथवा पराजित करने का अर्थ देता है; ‘हरा दिया’ सैन्य विजय का आशय स्पष्ट करता है।
- source_word: וּנְשָׂאֲךָ לִבְּךָ
  choice: तेरे मन ने तुझे ... ऊँचा उठा दिया है
  rationale: हिब्रू रूपक को बनाए रखा गया है, जिसमें विजय के बाद मन व्यक्ति को आत्म-महत्त्व की ओर उठा देता है।
- source_word: לְהַכְבִּיד
  choice: अपनी बड़ाई करने के लिए
  rationale: इस डाँट के प्रसंग में क्रिया आत्म-महिमा अथवा डींग मारने की ओर संकेत करती है; ‘अपनी बड़ाई करना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַתָּה שְׁבָה בְּבֵיתֶךָ
  choice: अब अपने घर में ही रह
  rationale: यह युद्ध के लिए बाहर न निकलने और वहीं ठहरे रहने की सीधी आज्ञा है।
- source_word: לָמָּה תִתְגָּרֶה בְּרָעָה
  choice: तू क्यों विपत्ति को ललकारता है
  rationale: גרה का हित्पएल रूप संघर्ष भड़काने या मोल लेने का भाव देता है, जबकि רעה यहाँ नैतिक बुराई से अधिक आने वाली विपत्ति है।
- source_word: וְנָפַלְתָּ אַתָּה וִיהוּדָה עִמָּךְ
  choice: कि तू गिर पड़े—तू और तेरे साथ यहूदा भी
  rationale: वाक्य राजा की चुनौती के संभावित परिणाम और उसके साथ समूचे यहूदा के पतन पर बल देता है।
