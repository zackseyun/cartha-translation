base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/027.yaml
  text: From the time that Amaziah turned away from following Yahweh[a], they conspired against him in Jerusalem, and he fled to Lachish; but they sent after him to Lachish and put him to death there.
translation:
  language: hi
  text: जिस समय से अमस्याह ने याहवे के पीछे चलना छोड़ दिया[a], लोग यरूशलेम में उसके विरुद्ध षड्यंत्र रचने लगे। वह लाकीश भाग गया, पर उन्होंने उसके पीछे लोगों को लाकीश भेजा और वहीं उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “याहवे के पीछे से फिर गया”; यह मुहावरा याहवे के पीछे चलना छोड़ देने का अर्थ देता है।
    reason: मूल इब्रानी मुहावरे का शाब्दिक रूप और आशय स्पष्ट करना।
lexical_decisions:
- source_word: וּמֵעֵת אֲשֶׁר
  choice: जिस समय से … उसी समय से
  rationale: यह पद उस समय-बिंदु को बताता है जहाँ से आगे षड्यंत्र आरम्भ हुआ; हिन्दी में सहसंबंधी रचना वाक्य को स्पष्ट और स्वाभाविक बनाती है।
- source_word: סָר מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलने से फिर गया
  rationale: यह धार्मिक विमुखता का मुहावरा है। यह अनुवाद मूल के ‘पीछे चलने’ वाले बिंब को बनाए रखते हुए हिन्दी में अर्थ संप्रेषित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: उसके विरुद्ध षड्यंत्र रचा
  rationale: इब्रानी क्रिया-संज्ञा युग्म का स्वाभाविक हिन्दी समतुल्य, जो योजनाबद्ध विरोध को व्यक्त करता है।
- source_word: וַיָּנָס לָכִישָׁה
  choice: वह लाकीश भाग गया
  rationale: संकट से बचने के लिए भागने और लाकीश की ओर दिशा—दोनों को स्पष्ट करता है।
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו לָכִישָׁה
  choice: उन्होंने उसके पीछे लोगों को लाकीश भेजा
  rationale: मूल में कर्म निहित है; हिन्दी में ‘लोगों को’ जोड़ना भेजे गए व्यक्तियों के अर्थ को स्वाभाविक और स्पष्ट करता है।
- source_word: וַיְמִיתֻהוּ שָׁם
  choice: वहीं उसे मार डाला
  rationale: कारक क्रिया की जानबूझकर हत्या कराने या करने की शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना और अपेक्षाकृत निकट उच्चारण के साथ प्रस्तुत करता है।
- issue: अमस्याह के विमुख होने की प्रकृति
  choice: याहवे के पीछे चलने से फिर गया
  alternative: याहवे को त्याग दिया
  rationale: मूल मुहावरा अनुकरण करना छोड़ने को कहता है; अधिक प्रबल ‘त्याग दिया’ कहने से बचकर मूल की अभिव्यक्ति और उसका धार्मिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप। ‘षड्यंत्र रचा’ तथा ‘मार डाला’ जैसे प्रचलित पद मूल की तीव्रता बनाए रखते हैं; अनावश्यक पुरातन या अत्यधिक संस्कृतनिष्ठ भाषा से बचा गया है।
