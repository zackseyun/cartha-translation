base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/016.yaml
  text: And it happened[a], as he was speaking to him, that the king said to him, “Have we made you the king’s adviser? Stop! Why should they strike you down?” So the prophet stopped and said, “I know that God has determined to destroy you[c][b], because you have done this and have not listened to my counsel.”
translation:
  language: hi
  text: जब वह उससे बोल रहा था, तब राजा ने उससे कहा, “क्या हमने तुझे राजा का सलाहकार नियुक्त किया है?[a] बस कर! वे तुझे क्यों मारें?”[b] तब भविष्यद्वक्ता रुक गया और बोला, “मैं जानता हूँ कि परमेश्वर ने तुझे नष्ट करने की ठान ली है,[c] क्योंकि तूने यह किया है और मेरी सलाह नहीं मानी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या हमने तुझे राजा को सलाह देने के लिए नियुक्त किया है?”
    reason: यह पदबंध सलाहकार के पद या राजा को सलाह देने के कार्य—दोनों ढंग से व्यक्त किया जा सकता है।
  - marker: b
    text: 'इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है: “वे तुझे क्यों मारें?” सम्भवतः आशय उन लोगों से है जो राजा के आदेश पर उसे दण्ड देते।'
    reason: अनिर्दिष्ट बहुवचन कर्ता और निहित राजकीय धमकी को स्पष्ट करना।
  - marker: c
    text: या, “परमेश्वर ने तुझे नष्ट करने की योजना बनाई है।” इब्रानी क्रिया का मूल अर्थ सलाह देना, योजना बनाना या निश्चय करना है।
    reason: יָעַץ के अर्थ-क्षेत्र और सम्भव वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: הַלְיוֹעֵץ לַמֶּלֶךְ נְתַנּוּךָ
  choice: क्या हमने तुझे राजा का सलाहकार नियुक्त किया है?
  rationale: प्रश्नवाचक הֲ, לְיוֹעֵץ और נתן के संयुक्त अर्थ को स्वाभाविक हिन्दी में एक तिरस्कारपूर्ण आलंकारिक प्रश्न के रूप में व्यक्त किया गया है। “नियुक्त किया” पद दिए जाने की धारणा को स्पष्ट करता है।
- source_word: חֲדַל לְךָ
  choice: बस कर!
  rationale: यह भविष्यद्वक्ता को बोलना बंद करने की कड़ी आज्ञा है। “बस कर!” आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और तीखा है।
- source_word: לָמָּה יַכּוּךָ
  choice: क्यों वे तुझे मारें?
  rationale: क्रिया का कर्ता अनिर्दिष्ट बहुवचन है। अनुवाद में “वे” रखकर उस अस्पष्टता को बचाया गया है और נכה के सामान्य प्रहार/मारने के अर्थ को मृत्यु के रूप में अनावश्यक ढंग से निश्चित नहीं किया गया।
- source_word: יָעַץ אֱלֹהִים
  choice: परमेश्वर ने ... ठान ली है
  rationale: יעץ का मूल संबंध सलाह, योजना या निश्चय से है। इस प्रसंग में परमेश्वर विनाश करने का दृढ़ निश्चय करता है; “ठान ली है” उस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: לְהַשְׁחִיתֶךָ
  choice: तुझे नष्ट करने
  rationale: שׁחת के हिफ़ईल रूप का सीधा अर्थ विनाश कर देना है; “नष्ट करने” स्पष्ट और प्रचलित हिन्दी है।
- source_word: וְלֹא שָׁמַעְתָּ לַעֲצָתִי
  choice: और मेरी सलाह नहीं मानी
  rationale: שׁמע यहाँ केवल सुनने नहीं, बल्कि ध्यान देकर मानने का भाव रखता है। “सलाह नहीं मानी” इस प्रसंग में स्वाभाविक रूप से दोनों भावों को समेटता है।
theological_decisions:
- issue: יָעַץ אֱלֹהִים לְהַשְׁחִיתֶךָ में परमेश्वर का विनाशकारी निश्चय
  choice: परमेश्वर ने तुझे नष्ट करने की ठान ली है
  alternative: परमेश्वर ने तुझे नष्ट करने की योजना बनाई है
  rationale: इब्रानी कथन परमेश्वर के न्याय को दृढ़ निश्चय के रूप में सामने रखता है। अनुवाद इस तनाव को न तो नरम करता है, न इसे किसी व्यापक मतवादी व्याख्या से समझाने का प्रयास करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में प्रसंगानुकूल एकवचन “तू/तुझे”, और राजकीय फटकार के लिए संक्षिप्त तथा तीखा लहजा रखा गया है। भाषा गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज है।
