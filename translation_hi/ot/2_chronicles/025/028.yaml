  edition: WLC
  text: וַ/יִּשָּׂאֻ֖/הוּ עַל הַ/סּוּסִ֑ים וַֽ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/028.yaml
  text: They carried him on horses and buried him with his fathers in the city of Judah[a].
translation:
  language: hi
  text: वे उसे घोड़ों पर[a] ले गए और उसके पुरखों के साथ यहूदा के नगर में उसे दफ़ना दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “घोड़ों पर” है और “घोड़े” बहुवचन में है।
    reason: मूल पाठ में घोड़ों का बहुवचन स्पष्ट है; अर्थी या रथ जैसी किसी अनुल्लिखित वस्तु को जोड़ने से बचते हुए इस असामान्य चित्र को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: וַיִּשָּׂאֻהוּ
  choice: वे उसे ... ले गए
  rationale: נשׂא के बहुवचन कर्ता और एकवचन पुल्लिंग कर्म को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में मृत शरीर को एक स्थान से दूसरे स्थान ले जाना अभिप्रेत है।
- source_word: עַל הַסּוּסִים
  choice: घोड़ों पर
  rationale: हिब्रू के स्थानवाचक संबंध और स्पष्ट बहुवचन को बिना रथ, अर्थी या किसी अन्य साधन की कल्पना जोड़े सुरक्षित रखता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उसे दफ़ना दिया
  rationale: קבר का सीधा और स्वाभाविक हिन्दी अनुवाद है; पूर्ण हुई क्रिया के लिए ‘दफ़ना दिया’ उपयुक्त है।
- source_word: עִם אֲבֹתָיו
  choice: उसके पुरखों के साथ
  rationale: ‘पुरखे’ हिब्रू के पारिवारिक और वंशगत दफ़न-सूत्र को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעִיר יְהוּדָה
  choice: यहूदा के नगर में
  rationale: मसोरेटिक पाठ में दिए गए ‘यहूदा के नगर’ को सीधे सुरक्षित रखता है और इसे अधिक परिचित ‘दाऊद के नगर’ से नहीं मिलाता।
theological_decisions:
- issue: दफ़नाने के स्थान का पाठ
  choice: यहूदा के नगर में
  alternative: दाऊद के नगर में; अथवा सामान्यीकृत रूप ‘यहूदा में’
  rationale: प्रस्तुत मसोरेटिक पाठ स्पष्टतः ‘यहूदा के नगर’ कहता है। अपेक्षित या समानांतर अभिव्यक्ति के अनुसार इसका सामंजस्य करना मूल-पाठ की विशिष्टता को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘पुरखों’ पारिवारिक-वंशगत अर्थ को सहजता से व्यक्त करता है। ‘यहूदा के नगर’ की कुछ असामान्य अभिव्यक्ति मूल पाठ के कारण जानबूझकर बनाए रखी गई है।
