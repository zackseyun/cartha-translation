  text: और यहूदा इस्राएल के सामने पराजित हुआ, और हर एक अपने तंबू की ओर[a] भाग गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “हर एक अपने तंबू को”; यह अपने-अपने स्थान या डेरे की ओर तितर-बितर होकर लौटने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּגֶף
  choice: हार गया
  rationale: निफ़अल रूप यहाँ युद्ध में पराजित होने का अर्थ देता है; ‘हार गया’ स्पष्ट, स्वाभाविक और प्रसंगानुकूल है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: दक्षिणी राज्य का प्रचलित हिन्दी नाम।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: युद्ध के प्रसंग में यह प्रतिद्वंद्वी के सामने पराजित होने का इब्रानी मुहावरा है; ‘के सामने’ स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: उत्तरी राज्य का प्रचलित हिन्दी नाम।
- source_word: וַיָּנֻסוּ
  choice: भाग गया
  rationale: נוּס का अर्थ भय या पराजय के कारण भागना है; यहाँ एकवचन वितरणात्मक कर्ता ‘हर एक’ के अनुरूप एकवचन रखा गया है।
- source_word: אִישׁ
  choice: हर एक
  rationale: वितरणात्मक एकवचन का अर्थ प्रत्येक योद्धा है; ‘हर एक’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘पुरुष’ जोड़ने से बचता है।
- source_word: לְאֹהָלָיו
  choice: अपने तम्बू को
  rationale: शाब्दिक तम्बू-चित्र को सुरक्षित रखते हुए स्वामित्व का भाव ‘अपने’ से व्यक्त किया गया है; पदबंध अपने स्थान या छावनी की ओर तितर-बितर लौटने का मुहावरा भी हो सकता है।
