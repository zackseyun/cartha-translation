  choice: अपनी प्रजा की अगुवाई करते हुए
  rationale: נהג के ‘ले जाना/अगुवाई करना’ अर्थ को सैन्य प्रसंग में स्वाभाविक हिंदी में व्यक्त करता है, बिना युद्ध-संचालन की अनकही बारीकियाँ जोड़ने के।
- source_word: גֵּיא הַמֶּלַח
  choice: नमक की घाटी
  rationale: स्थान-नाम के दोनों घटकों का सीधा और प्रचलित हिंदी रूप।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: נכה के प्रहार करके गिराने वाले सैन्य अर्थ को व्यक्त करता है; साथ दी गई मृतक-संख्या के प्रसंग में यह स्वाभाविक है।
- source_word: בְּנֵי שֵׂעִיר
  choice: सेईर के पुत्रों
  rationale: मूल इब्रानी के जातीय-वंशावली मुहावरे ‘सेईर के पुत्र’ को मुख्य पाठ में सुरक्षित रखता है।
- source_word: עֲשֶׂרֶת אֲלָפִים
  choice: दस हज़ार
  rationale: इब्रानी संख्या-वाक्यांश का सीधा और मानक हिंदी अनुवाद।
- source_word: וַאֲמַצְיָהוּ
  choice: फिर अमस्याह
  rationale: वाव से व्यक्त कथा-क्रम को आधुनिक हिंदी में स्वाभाविक रूप से आगे बढ़ाता है।
