  text: Then Amaziah strengthened himself[a], led his people, and went to the Valley of Salt, where he struck down ten thousand of the sons of Seir.
translation:
  language: hi
  text: फिर अमस्याह ने अपने आपको दृढ़ किया, अपनी प्रजा की अगुवाई की और नमक की घाटी में गया। वहाँ उसने सेईर के दस हज़ार पुत्रों[a] को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेईर के लोग’ अथवा ‘सेईर के वंशज’। इब्रानी में शाब्दिक रूप से ‘सेईर के पुत्र’ है, जो एक जातीय-वंशावली अभिव्यक्ति है।
    reason: lexical_alternative
