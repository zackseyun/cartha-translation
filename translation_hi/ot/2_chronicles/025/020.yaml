base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/020.yaml
  text: But Amaziah would not listen[a], for it was from God, in order to give them into the hand of their enemies, because they had sought the gods of Edom.
translation:
  language: hi
  text: पर अमस्याह ने बात नहीं मानी, क्योंकि यह परमेश्वर की ओर से था, ताकि वह उन्हें उनके हाथ में सौंप दे[a], क्योंकि उन्होंने एदोम के देवताओं की खोज की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाथ में।” यह इब्रानी मुहावरा किसी के अधिकार या वश में सौंपे जाने को दर्शाता है। संदर्भ में यह विरोधी पक्ष की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: बात नहीं मानी
  rationale: यहाँ क्रिया का अर्थ केवल सुनना नहीं, बल्कि दी गई सलाह या चेतावनी को मानना है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक रूप से उस आशय को बताती है।
- source_word: מֵהָאֱלֹהִים הִיא
  choice: यह परमेश्वर की ओर से था
  rationale: स्त्रीलिंग सर्वनाम सम्भवतः अभी वर्णित परिस्थिति या निर्णय की ओर संकेत करता है। अनुवाद दैवी कारण को बनाए रखता है, पर उसके संकेत को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में दोनों के बीच की स्रोत-पाठ की निकटता को बनाए रखता है।
- source_word: תִּתָּם
  choice: वह उन्हें ... कर दे
  rationale: נתן और ‘हाथ में’ का संयुक्त प्रयोग किसी को दूसरे के अधिकार में सौंपने का भाव देता है। ‘वह’ का संदर्भ परमेश्वर है, जबकि वाक्य की संरचना स्रोत की दैवी सक्रियता को बनाए रखती है।
- source_word: בְּיָד
  choice: उनके शत्रुओं के हाथ में
  rationale: ‘हाथ में’ अधिकार या वश में सौंपे जाने का इब्रानी मुहावरा है। ‘शत्रुओं’ को निकटवर्ती युद्ध-संदर्भ से स्पष्ट किया गया है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: דָרְשׁוּ
  choice: खोज की थी
  rationale: देवताओं के साथ प्रयुक्त यह क्रिया आराधनापूर्ण निर्भरता, सहायता की तलाश या परामर्श लेने तक का व्यापक धार्मिक भाव रख सकती है। ‘खोज की थी’ इस व्यापकता को बनाए रखता है।
- source_word: אֱלֹהֵי אֱדוֹם
  choice: एदोम के देवताओं
  rationale: यह संबंधवाचक पदबंध एदोम में पूजे जाने वाले देवताओं को सीधे दर्शाता है।
theological_decisions:
- issue: अमस्याह के न मानने और उसकी पराजय में परमेश्वर की सक्रियता
  choice: पद स्पष्ट रूप से कहता है कि यह परमेश्वर की ओर से था और इसका उद्देश्य अथवा परिणाम उन्हें शत्रुओं के हाथ में कर देना था।
  alternative: इसे केवल परमेश्वर की निष्क्रिय अनुमति या पूर्वज्ञान के रूप में नरम किया जा सकता था।
  rationale: इब्रानी में ‘परमेश्वर की ओर से’ और उद्देश्यसूचक לְמַעַן दोनों स्पष्ट हैं। अनुवाद दैवी सक्रियता और मानवीय मूर्तिपूजा के कारण के बीच मौजूद धार्मिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बात नहीं मानी’ सामान्य पाठक के लिए ‘सुनने’ से आगे बढ़कर सलाह न मानने का प्रसंगगत अर्थ स्पष्ट करता है। ‘यह’ के संकेत को खुला रखा गया है और दैवी कारण को नरम नहीं किया गया।
