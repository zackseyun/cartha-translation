  text: וַ/יְהִ֗י אַחֲרֵ֨י ב֤וֹא אֲמַצְיָ֨הוּ֙ מֵֽ/הַכּ֣וֹת אֶת אֲדוֹמִ֔ים וַ/יָּבֵ֗א אֶת אֱלֹהֵי֙ בְּנֵ֣י שֵׂעִ֔יר וַ/יַּֽעֲמִידֵ֥/ם ל֖/וֹ לֵ/אלֹהִ֑ים וְ/לִ/פְנֵי/הֶ֥ם יִֽשְׁתַּחֲוֶ֖ה וְ/לָ/הֶ֥ם יְקַטֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/014.yaml
  text: It happened[a], after Amaziah came from striking down the Edomites, that he brought the gods of the sons of Seir and set them up for himself as gods; and before them he bowed down[c][b], and to them he burned incense.
translation:
  language: hi
  text: ऐसा हुआ कि अमस्याह एदोमियों को मारकर लौटने के बाद, वह सेईर के लोगों के देवताओं[a] को ले आया और उन्हें अपने देवताओं के रूप में स्थापित किया; उसने उनके सामने दण्डवत किया और उनके लिए धूप जलाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सेईर के पुत्रों के देवता।”
    reason: इब्रानी בְּנֵי שֵׂעִיר के औपचारिक संबंधसूचक रूप को सुरक्षित रखना, जबकि मुख्य पाठ में स्वाभाविक हिन्दी देना।
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי בּוֹא
  choice: लौट आया। इसके बाद
  rationale: यह रचना अमस्याह के आने के बाद की घटना बताती है। प्रसंग में वह युद्ध से अपने देश लौटा है; हिन्दी में अलग वाक्यों द्वारा कालक्रम स्वाभाविक और स्पष्ट रहता है।
- source_word: מֵהַכּוֹת אֶת אֲדוֹמִים
  choice: एदोमियों को मार गिराकर
  rationale: נכה के ठोस अर्थ ‘मारना/मार गिराना’ को बनाए रखता है और केवल सामान्य ‘पराजित करना’ कहकर उसकी तीव्रता कम नहीं करता।
- source_word: אֱלֹהֵי בְּנֵי שֵׂעִיר
  choice: सेईर के लोगों के देवताओं
  rationale: यहाँ אֱלֹהֵי बहुवचन में गैर-इस्राएली देवताओं को सूचित करता है। ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक है; इब्रानी का शाब्दिक ‘पुत्रों’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּעֲמִידֵם לוֹ לֵאלֹהִים
  choice: उन्हें अपने देवताओं के रूप में स्थापित किया
  rationale: हिफ़ील क्रिया भौतिक रूप से खड़ा/स्थापित करने और अपने देवताओं के रूप में अपनाने—दोनों भावों को संदर्भ में व्यक्त करती है।
- source_word: וְלִפְנֵיהֶם יִשְׁתַּחֲוֶה
  choice: वह उनके सामने दण्डवत करता
  rationale: השתחוה का शारीरिक झुकने या भूमि पर गिरने का भाव ‘दण्डवत’ से सुरक्षित रहता है; केवल ‘आराधना करता’ कहना क्रिया के ठोस संकेत को खो देता।
- source_word: וְלָהֶם יְקַטֵּר
  choice: उनके लिए धूप जलाता था
  rationale: קטר धूप अथवा सुगन्धित अर्पण जलाने को सूचित करता है। हिन्दी धार्मिक व्यवहार के संदर्भ में ‘धूप जलाना’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: मूर्तिपूजक देवताओं के लिए אֱלֹהֵי का अनुवाद
  choice: देवताओं
  alternative: दैवी प्राणियों
  rationale: संदर्भ में सेईर के वे देवता हैं जिन्हें अमस्याह पूजा के लिए अपनाता है। ‘देवताओं’ बहुवचन और कथानक में निहित धर्मत्याग, दोनों को बिना नरम किए व्यक्त करता है।
- issue: יִשְׁתַּחֲוֶה और יְקַטֵּר के क्रियात्मक पक्ष
  choice: दण्डवत करता और ... धूप जलाता था
  alternative: दण्डवत हुआ और ... धूप जलाई
  rationale: इब्रानी में यहाँ प्रयुक्त अपूर्ण क्रियारूप निरन्तर या बार-बार किए गए आचरण की गुंजाइश रखते हैं। हिन्दी का आदतन रूप उस आयाम को बचाता है, पर यह दावा नहीं करता कि केवल एक ही अवसर था।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। ‘दण्डवत’ धार्मिक संदर्भ में परिचित है और मूल क्रिया के शारीरिक भाव को बनाए रखता है। वाक्य-विभाजन हिन्दी में बोझिल अधीनस्थ संरचना से बचाता है।
