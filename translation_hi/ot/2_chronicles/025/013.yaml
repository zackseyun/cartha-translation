base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/025/013.yaml
  text: But the men of the troop whom Amaziah had sent back from going with him to battle raided the cities of Judah[a], from Samaria to Beth-horon[b], and struck down three thousand of them and took much plunder.
translation:
  language: hi
  text: परन्तु उस सैन्य-दल के लोग, जिन्हें अमस्याह ने अपने साथ युद्ध में जाने से वापस भेज दिया था, यहूदा के नगरों में छापे मारते हुए शोमरोन से बेत-होरोन तक[a] पहुँचे। उन्होंने उनमें से तीन हज़ार लोगों को मार गिराया[b] और बहुत-सी लूट ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शोमरोन से बेत-होरोन की सीमा तक।’ इब्रानी वाक्यांश छापों के भौगोलिक विस्तार को बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मार डाला।’ इब्रानी क्रिया का मूल अर्थ ‘प्रहार करना’ है, पर युद्ध के इस प्रसंग में घातक प्रहार अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי הַגְּדוּד
  choice: उस सैन्य-दल के लोग
  rationale: शाब्दिक अर्थ ‘दल के पुत्र’ है, पर यह इब्रानी मुहावरा दल के सदस्यों को दर्शाता है। ‘सैन्य-दल के लोग’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का सैनिक अर्थ बनाए रखता है।
- source_word: אֲשֶׁר הֵשִׁיב אֲמַצְיָהוּ
  choice: जिन्हें अमस्याह ने ... वापस भेज दिया था
  rationale: שוב का हिफ़ईल रूप ‘लौटा देना/वापस भेजना’ दर्शाता है। पूर्वघटित क्रिया के लिए ‘भेज दिया था’ उपयुक्त है।
- source_word: מִלֶּכֶת עִמּוֹ לַמִּלְחָמָה
  choice: अपने साथ युद्ध में जाने से
  rationale: यह रचना अमस्याह के साथ युद्ध-अभियान में जाने से रोके जाने को व्यक्त करती है; हिन्दी में इसे संक्षिप्त और स्वाभाविक रूप दिया गया है।
- source_word: וַיִּפְשְׁטוּ
  choice: पर टूट पड़े
  rationale: सैनिक प्रसंग में פשט धावा बोलने या छापा मारने को सूचित करता है। ‘पर टूट पड़े’ आक्रमण की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों पर
  rationale: עָרֵי का सामान्य अर्थ नगर/शहर है; गरिमापूर्ण बाइबलीय हिन्दी में ‘नगरों’ उपयुक्त है।
- source_word: מִשֹּׁמְרוֹן וְעַד בֵּית חוֹרוֹן
  choice: शोमरोन से लेकर बेत-होरोन तक
  rationale: מִן ... וְעַד भौगोलिक विस्तार की दोनों सीमाएँ बताता है। स्थान-नामों को इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: וַיַּכּוּ מֵהֶם
  choice: उन्होंने उनमें से ... लोगों को मार गिराया
  rationale: נכה का अर्थ प्रहार करना है और युद्ध-संदर्भ में सामान्यतः घातक प्रहार सूचित करता है। ‘मार गिराया’ क्रिया की युद्ध-संबंधी शक्ति और कुछ हद तक उसकी व्यापकता दोनों बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיָּבֹזּוּ בִּזָּה רַבָּה
  choice: बहुत-सी लूट ले गए
  rationale: इब्रानी सजातीय रचना लूट की बड़ी मात्रा पर बल देती है। ‘बहुत-सी लूट ले गए’ उस बल को बिना अस्वाभाविक पुनरुक्ति के व्यक्त करता है।
