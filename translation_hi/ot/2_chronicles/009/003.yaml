  text: וַ/תֵּ֨רֶא֙ מַֽלְכַּת שְׁבָ֔א אֵ֖ת חָכְמַ֣ת שְׁלֹמֹ֑ה וְ/הַ/בַּ֖יִת אֲשֶׁ֥ר בָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/003.yaml
  text: When the queen of Sheba saw Solomon’s wisdom and the house that he had built,[a]
translation:
  language: hi
  text: जब शीबा की रानी ने सुलैमान की बुद्धि और उसके बनाए हुए भवन[a] को देखा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके बनाए हुए महल।” इब्रानी में “घर/भवन” है, जो इस राजकीय प्रसंग में विशेष रूप से सुलैमान के राजमहल-परिसर को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: जब ... ने ... देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; प्रसंग में ‘जब’ अगले पद में जारी वाक्य के लिए स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: מַלְכַּת שְׁבָא
  choice: शीबा की रानी
  rationale: यह संबंध-रचना रानी की पहचान उसके राज्य अथवा स्थान से कराती है; आधुनिक हिन्दी में यह स्वाभाविक रूप है।
- source_word: אֵת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म का चिह्न है, जिसका हिन्दी में स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं; वाक्य-विन्यास उसका कार्य स्पष्ट करता है।
- source_word: חָכְמַת שְׁלֹמֹה
  choice: सुलैमान की बुद्धि
  rationale: संबंध-रचना का स्वाभाविक हिन्दी रूप; ‘बुद्धि’ यहाँ विवेक और सूझ-बूझ को भी समेटती है।
- source_word: וְהַבַּיִת
  choice: और ... भवन
  rationale: בַּיִת का मूल अर्थ घर/भवन है। राजकीय प्रसंग में यह महल या राजमहल-परिसर हो सकता है, पर मुख्य पाठ में व्यापक अर्थ वाला ‘भवन’ स्रोत की अस्पष्टता बचाता है।
- source_word: אֲשֶׁר בָּנָה
  choice: उसके बनाए हुए
  rationale: संबंधवाचक उपवाक्य का सहज हिन्दी रूप, जो स्पष्ट करता है कि निर्माण देखने की घटना से पहले पूरा हो चुका था।
