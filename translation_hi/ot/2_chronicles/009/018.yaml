base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/018.yaml
  text: There were six steps to the throne[a], and a gold footstool attached to the throne, and armrests on this side and on that beside the seat, and two lions standing beside the armrests.
translation:
  language: hi
  text: सिंहासन तक छह सीढ़ियाँ थीं, और सिंहासन से जुड़ी हुई सोने की एक पादपीठ[a] थी। बैठने के स्थान के इधर और उधर हत्थे थे, और हत्थों के पास दो सिंह खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “सिंहासन से जुड़ी हुई सोने की एक ढलान या सीढ़ीदार मार्ग।” इब्रानी शब्द כֶּבֶשׁ का अर्थ भिन्न रूप से समझा जा सकता है, यद्यपि सिंहासन के प्रसंग में “पादपीठ” उपयुक्त प्रतीत होता है।
    reason: lexical_alternative
