  yaml_path: translation/ot/2_chronicles/009/016.yaml
  text: and three hundred shields of beaten gold[a]; three hundred shekels of gold went onto each shield[c][b]. And the king put them in the House of the Forest of Lebanon.
translation:
  language: hi
  text: और पीटकर बनाए गए सोने की तीन सौ ढालें बनाईं। हर ढाल पर तीन सौ शेकेल[a] सोना चढ़ाया गया था। राजा ने उन्हें लबानोन के वन-भवन[b] में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “तीन सौ सोना” है; माप की इकाई “शेकेल” स्पष्टता के लिए जोड़ी गई है और 1 राजा 10:17 के समानांतर वर्णन के आधार पर संभवतः निहित है।
    reason: lexical_alternative
  - marker: b
    text: “लबानोन के वन-भवन” एक नामित राजकीय भवन था; इसका अनुवाद “लबानोन के वन का महल” भी किया जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: מָגִנִּים
  choice: ढालें
  rationale: מָגֵן का सामान्य अर्थ ‘ढाल’ है। आधुनिक हिन्दी में ‘ढाल’ स्पष्ट और स्वाभाविक है।
- source_word: זָהָב שָׁחוּט
  choice: पीटकर पतला किया हुआ सोना
  rationale: שָׁחוּט यहाँ काम किए हुए धातु, सम्भवतः पीटकर पतली की गई सोने की परत, को दर्शाता है। यह अनुवाद निर्माण-विधि का ठोस भाव बनाए रखता है।
- source_word: שְׁלֹשׁ מֵאוֹת זָהָב
  choice: तीन सौ शेकेल सोना
  rationale: इब्रानी में माप की इकाई व्यक्त नहीं की गई है, पर 1 राजा 10:17 के समानांतर वर्णन से ‘शेकेल’ निहित जान पड़ता है। स्पष्टता के लिए इसे मुख्य पाठ में रखा गया और पादटिप्पणी में मूल की संक्षिप्तता बताई गई है।
- source_word: יַעֲלֶה עַל
  choice: पर ... चढ़ाया गया था
  rationale: मूल अभिव्यक्ति का शाब्दिक चित्र किसी वस्तु पर सोना ‘चढ़ने’ का है। हिन्दी में धातु की परत लगाने के लिए ‘सोना चढ़ाना’ स्वाभाविक और अर्थानुकूल है।
- source_word: הַמָּגֵן הָאֶחָת
  choice: हर ढाल
  rationale: मूल में एकवचन ‘एक ढाल’ है, पर प्रसंग में इसका प्रयोग वितरणात्मक है; इसलिए ‘हर ढाल’ स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... रख दिया
  rationale: स्थान के साथ נתן का अर्थ यहाँ ‘रखना’ या ‘स्थापित करना’ है। ‘रख दिया’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: लबानोन-वन भवन
  rationale: यह एक विशिष्ट राजकीय भवन का नाम है। ‘भवन’ בֵּית के अर्थ को रखता है और संयुक्त नाम ‘लबानोन-वन’ हिन्दी में संक्षिप्त तथा पहचानने योग्य है।
- source_word: וְשְׁלֹשׁ מֵאוֹת מָגִנִּים
  choice: और ... तीन सौ ढालें बनाईं
  rationale: इस पद में ‘बनाईं’ क्रिया दुबारा नहीं लिखी गई, बल्कि पिछले पद की क्रिया आगे समझी जाती है। पूर्ण और स्वाभाविक हिन्दी वाक्य के लिए उसे यहाँ दोहराया गया है।
