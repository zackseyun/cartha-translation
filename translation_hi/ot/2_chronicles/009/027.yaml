base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/027.yaml
  text: The king made silver as common as stones in Jerusalem[a], and he made cedars as plentiful as sycamore trees in the lowland.
translation:
  language: hi
  text: राजा ने यरूशलेम में चाँदी को पत्थरों जितना आम कर दिया, और देवदारों को निचले पहाड़ी प्रदेश[a] के सिकामोर-अंजीर के पेड़ों की तरह बहुतायत से उपलब्ध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शफ़ेला में”; यह यहूदा के मध्यवर्ती पहाड़ी क्षेत्र के पश्चिम में स्थित निचली तलहटी का इलाका था।
    reason: שְׁפֵלָה के तकनीकी क्षेत्रीय नाम और उसके भौगोलिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: कर दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया/रखा’ है, पर इस तुलना में वह किसी वस्तु को अत्यधिक प्रचुर कर देने का भाव व्यक्त करती है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: यहाँ मूल्यवान धातु चाँदी अभिप्रेत है, विशेष रूप से सिक्के या धन नहीं।
- source_word: כָּאֲבָנִים
  choice: पत्थरों जितना आम
  rationale: तुलना रूप या पदार्थ की नहीं, बल्कि प्रचुरता और सामान्य उपलब्धता की है।
- source_word: הָאֲרָזִים
  choice: देवदार की लकड़ी
  rationale: बहुवचन शब्द देवदार के वृक्षों या उनसे प्राप्त लकड़ी को सूचित कर सकता है; राजकीय समृद्धि के प्रसंग में वस्तु के रूप में लकड़ी कहना स्वाभाविक है, जबकि देवदार का बिंब बना रहता है।
- source_word: כַּשִּׁקְמִים
  choice: गूलर के पेड़ों जितना
  rationale: शब्द साइकामोर-अंजीर जाति के वृक्षों को दर्शाता है; ‘गूलर के पेड़’ सामान्य हिन्दी पाठक के लिए संक्षिप्त और परिचित रूप है।
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: तराई के
  rationale: שְׁפֵלָה यहूदा के पहाड़ी देश के पश्चिम की नीची तलहटी का क्षेत्र है। पाठ में सुबोध ‘तराई’ रखा गया और क्षेत्रीय नाम पादटिप्पणी में दिया गया।
- source_word: לָרֹב
  choice: बहुतायत में
  rationale: यह पद देवदार की अत्यधिक प्रचुरता पर बल देता है।
