  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַֽלְכַּת שְׁבָ֗א שָֽׁמְעָה֮ אֶת שֵׁ֣מַע שְׁלֹמֹה֒ וַ/תָּב֣וֹא לְ/נַסּוֹת֩ אֶת שְׁלֹמֹ֨ה בְ/חִיד֜וֹת בִּ/ירֽוּשָׁלִַ֗ם בְּ/חַ֣יִל כָּבֵ֣ד מְאֹ֡ד וּ֠/גְמַלִּים נֹשְׂאִ֨ים בְּשָׂמִ֧ים וְ/זָהָ֛ב לָ/רֹ֖ב וְ/אֶ֣בֶן יְקָרָ֑ה וַ/תָּבוֹא֙ אֶל שְׁלֹמֹ֔ה וַ/תְּדַבֵּ֣ר עִמּ֔/וֹ אֵ֛ת כָּל אֲשֶׁ֥ר הָיָ֖ה עִם לְבָבָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/001.yaml
  text: The queen of Sheba heard of Solomon’s fame[a], and she came to Jerusalem to test Solomon with riddles, with a very great retinue and camels carrying spices, gold in abundance, and precious stones. When she came to Solomon[c][b], she spoke with him about all that was in her heart.
translation:
  language: hi
  text: शीबा की रानी ने सुलैमान की ख्याति[a] सुनी। वह पहेलियों[b] से सुलैमान को परखने के लिए यरूशलेम आई। उसके साथ बहुत बड़ा दल था और ऐसे ऊँट थे जिन पर सुगंध-द्रव्य, बहुतायत में सोना और बहुमूल्य रत्न लदे थे। वह सुलैमान के पास आई और उसके साथ अपने मन की सारी बातें[c] कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुलैमान के विषय में समाचार।”
    reason: lexical_alternative
  - marker: b
    text: या, “कठिन प्रश्नों से।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जो कुछ उसके हृदय में था”; अर्थात उसके सभी विचार, प्रश्न और चिंताएँ।
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁמַע
  choice: ख्याति
  rationale: यहाँ संज्ञा सुलैमान के विषय में फैली हुई चर्चा या प्रसिद्धि को दर्शाती है; ‘ख्याति’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है, जबकि पादटिप्पणी ‘समाचार’ की अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: לְנַסּוֹת
  choice: परखने के लिए
  rationale: इस प्रसंग में क्रिया का अर्थ सुलैमान की बुद्धि या क्षमता की परीक्षा लेना है; ‘परखना’ उद्देश्य और बौद्धिक संदर्भ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: בְחִידוֹת
  choice: पहेलियों से
  rationale: חִידוֹת का मूल अर्थ पहेलियाँ या गूढ़ कथन है। ‘पहेलियाँ’ इसकी ठोस अर्थ-छवि को बनाए रखता है; ‘कठिन प्रश्न’ पादटिप्पणी में वैकल्पिक अर्थ है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम आई
  rationale: गति-सूचक क्रिया के साथ हिन्दी में गंतव्य बिना परसर्ग के स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּחַיִל כָּבֵד מְאֹד
  choice: उसके साथ बहुत बड़ा दल था
  rationale: חַיִל के अर्थ-क्षेत्र में बल, सेना, संपत्ति और दल शामिल हैं। ऊँटों और बहुमूल्य वस्तुओं वाले राजकीय यात्रा-प्रसंग में ‘बहुत बड़ा दल’ सैन्य अर्थ को अनावश्यक रूप से निश्चित किए बिना उपयुक्त है।
- source_word: בְּשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: बहुवचन संज्ञा सुगंधित मसालों अथवा सुगंधित पदार्थों को दर्शाती है। ‘सुगंध-द्रव्य’ राजकीय उपहारों के इस संदर्भ में पर्याप्त व्यापक और स्पष्ट है।
- source_word: לָרֹב
  choice: बहुतायत में
  rationale: यह सोने की अत्यधिक मात्रा बताता है; ‘बहुतायत में’ स्रोत की मात्रात्मक तीव्रता बनाए रखता है।
- source_word: אֶבֶן יְקָרָה
  choice: बहुमूल्य रत्न
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में प्रयुक्त है; हिन्दी में बहुवचन ‘रत्न’ सूची के संदर्भ में स्वाभाविक है।
- source_word: וַתְּדַבֵּר עִמּוֹ
  choice: उसके साथ ... बातें कीं
  rationale: דבר के साथ עִם संवादात्मक बोलचाल का संकेत देता है; ‘के साथ ... बातें कीं’ एकतरफा संबोधन के बजाय वार्तालाप का भाव रखता है।
- source_word: אֵת כָּל אֲשֶׁר הָיָה עִם לְבָבָהּ
  choice: अपने मन की सारी बातें
  rationale: हिब्रू में ‘हृदय’ विचारों, चिंताओं और अभिप्रायों का केंद्र है। हिन्दी मुहावरे में ‘मन की सारी बातें’ उसी व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी मूल रूपक बताती है।
