  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। लंबे हिब्रू वाक्य को पठनीयता के लिए छोटे वाक्यों में बाँटा गया है। ‘शीबा’, ‘सुलैमान’ और ‘यरूशलेम’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। सभी पादटिप्पणी-चिह्न संबंधित मुख्य पाठ में दिए गए हैं।
