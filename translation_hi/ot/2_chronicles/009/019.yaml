  text: And twelve lions were standing there on the six steps[a], on this side and on that side. Nothing like it had been made for any kingdom.
translation:
  language: hi
  text: और बारह सिंह वहाँ छह सीढ़ियों पर, एक ओर और दूसरी ओर, खड़े थे। किसी भी राज्य के लिए ऐसा नहीं बनाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁנֵים עָשָׂר אֲרָיוֹת
  choice: और बारह सिंह
  rationale: संयोजक וּ को वर्णन की निरंतरता दिखाने के लिए ‘और’ रखा गया है; אֲרָיוֹת सिंह-आकृतियों के लिए सामान्य बहुवचन है।
- source_word: עֹמְדִים שָׁם
  choice: वहाँ ... खड़े थे
  rationale: कृदंत עֹמְדִים दृश्य की स्थिर, वर्णनात्मक अवस्था व्यक्त करता है; आधुनिक हिन्दी में ‘खड़े थे’ स्वाभाविक है।
- source_word: עַל שֵׁשׁ הַמַּעֲלוֹת
  choice: छह सीढ़ियों पर
  rationale: מַעֲלוֹת यहाँ सिंहासन तक जाने वाली सीढ़ियाँ हैं और עַל का सीधा स्थानवाचक अर्थ ‘पर’ है।
- source_word: מִזֶּה וּמִזֶּה
  choice: इधर और उधर
  rationale: यह सममित स्थान-वितरण बताने वाला मुहावरा है; अनिश्चितता बनाए रखते हुए दोनों ओर होने का ठोस बोध देता है।
- source_word: לֹא נַעֲשָׂה כֵן לְכָל מַמְלָכָה
  choice: ऐसा किसी भी राज्य के लिए नहीं बनाया गया था
  rationale: निष्क्रिय रचना और तुलना को निकटता से सुरक्षित रखा गया है; לְ को ‘के लिए’ द्वारा व्यक्त किया गया है।
