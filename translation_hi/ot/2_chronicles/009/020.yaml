  text: וְ֠/כֹל כְּלֵ֞י מַשְׁקֵ֨ה הַ/מֶּ֤לֶךְ שְׁלֹמֹה֙ זָהָ֔ב וְ/כֹ֗ל כְּלֵ֛י בֵּֽית יַ֥עַר הַ/לְּבָנ֖וֹן זָהָ֣ב סָג֑וּר אֵ֣ין כֶּ֗סֶף נֶחְשָׁ֛ב בִּ/ימֵ֥י שְׁלֹמֹ֖ה לִ/מְאֽוּמָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/020.yaml
  text: All King Solomon’s drinking vessels were gold[a], and all the vessels of the House of the Forest of Lebanon were pure gold[c][b]. Silver was not considered anything in the days of Solomon.
translation:
  language: hi
  text: राजा सुलैमान के पीने के सभी पात्र सोने के थे, और लबानोन के वन का भवन[a] के सभी पात्र खरे सोने[b] के थे। सुलैमान के दिनों में चाँदी को कुछ भी नहीं माना जाता था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, एक विशिष्ट राजकीय भवन; अनुवाद ‘लबानोन के वन का महल’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘बन्द सोना’; यह मुहावरा सामान्यतः ‘खरा’ या ‘परिष्कृत’ सोना समझा जाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सुलैमान के दिनों में चाँदी को कुछ मूल्यवान नहीं माना जाता था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי מַשְׁקֵה
  choice: पीने के पात्र
  rationale: यह כְּלֵי के व्यापक अर्थ और מַשְׁקֵה के पेय-संबंधी अर्थ को स्वाभाविक हिन्दी में रखता है और इसे केवल प्यालों तक सीमित नहीं करता।
- source_word: זָהָב
  choice: सोना
  rationale: पदार्थ के लिए सीधा और सामान्य हिन्दी शब्द; पद में इसकी पुनरावृत्ति बनाए रखी गई है।
- source_word: בֵּית יַעַר הַלְּבָנוֹן
  choice: लबानोन-वन भवन
  rationale: यह विशिष्ट राजकीय भवन का नाम है। 'भवन' בֵּית को दर्शाता है और 'लबानोन-वन' नाम की विशेषता को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: זָהָב סָגוּר
  choice: खरा सोना
  rationale: सोने के साथ סָגוּר उच्च गुणवत्ता अथवा शुद्ध किए हुए सोने का मुहावरा है; 'खरा सोना' आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֵין כֶּסֶף נֶחְשָׁב ... לִמְאוּמָה
  choice: चाँदी को कुछ भी नहीं समझा जाता था
  rationale: यह मूल कथन की तीव्रता और संरचना को बनाए रखते हुए चाँदी की नगण्य प्रतिष्ठा व्यक्त करता है।
- source_word: בִּימֵי שְׁלֹמֹה
  choice: सुलैमान के दिनों में
  rationale: यह इब्रानी काल-सूचक मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; इसे अनावश्यक रूप से केवल शासनकाल तक सीमित नहीं करता।
