base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/021.yaml
  text: For the king had ships going to Tarshish with Huram’s servants; once every three years the ships of Tarshish would come[a], carrying gold and silver, ivory, monkeys, and peacocks.
translation:
  language: hi
  text: क्योंकि राजा के जहाज़ हूराम के सेवकों के साथ तरशीश जाते थे। हर तीन वर्ष में एक बार तरशीश के जहाज़ सोना, चाँदी, हाथीदाँत, बंदर और मोर[a] लेकर आते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तोते’; इस इब्रानी पक्षी-नाम की ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֳנִיּוֹת לַמֶּלֶךְ
  choice: राजा के जहाज़
