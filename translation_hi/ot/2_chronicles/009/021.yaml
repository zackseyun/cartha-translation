- source_word: הֹלְכוֹת תַּרְשִׁישׁ
  choice: तरशीश जाते थे
  rationale: कृदन्त और स्थाननाम को यहाँ गंतव्य या व्यापारिक मार्ग के रूप में पढ़ना सबसे स्वाभाविक है; अपूर्ण भूतकालीन आदतन क्रिया हिन्दी में ‘जाते थे’ से व्यक्त हुई है।
- source_word: עִם עַבְדֵי חוּרָם
  choice: हूराम के सेवकों के साथ
  rationale: עבדים राजकीय सेवा में लगे लोगों को सूचित करता है; ‘सेवक’ सीधा और गरिमापूर्ण समतुल्य है।
- source_word: אַחַת לְשָׁלֹשׁ שָׁנִים
  choice: हर तीन वर्ष में एक बार
  rationale: वितरणात्मक काल-अभिव्यक्ति का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: תָּבֹאנָה
  choice: आते थे
  rationale: अपूर्ण क्रिया यहाँ बीते समय की बार-बार होने वाली गतिविधि बताती है।
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: तरशीश के जहाज़
  rationale: दूसरी अभिव्यक्ति संज्ञात्मक है और संभवतः तरशीश के मार्ग या व्यापार से जुड़े समुद्री जहाज़ों को दर्शाती है; मूल की संरचना और संभावित व्यापक अर्थ बनाए रखे गए हैं।
- source_word: נֹשְׂאוֹת
  choice: लेकर आते थे
  rationale: जहाज़ों द्वारा माल लाने का आशय आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: שֶׁנְהַבִּים
  choice: हाथीदाँत
  rationale: यह वस्तु के रूप में हाथीदाँत का प्रचलित अर्थ है।
- source_word: וְקוֹפִים
  choice: बंदर
  rationale: यह पशुनाम बंदरों या कपियों के लिए प्रयुक्त हो सकता है; सामान्य पाठक के लिए ‘बंदर’ अधिक सहज है।
- source_word: וְתוּכִּיִּים
  choice: मोर
  rationale: परंपरागत अर्थ ‘मोर’ अपनाया गया है, किंतु इस दुर्लभ इब्रानी पशु-पक्षी नाम की पहचान अनिश्चित होने के कारण पाठ में पादटिप्पणी दी गई है।
