source:
  edition: WLC
  text: וּ/שְׁאָר֙ דִּבְרֵ֣י שְׁלֹמֹ֔ה הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרוֹנִ֑ים הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל דִּבְרֵי֙ נָתָ֣ן הַ/נָּבִ֔יא וְ/עַל נְבוּאַ֞ת אֲחִיָּ֣ה הַ/שִּֽׁילוֹנִ֗י וּ/בַ/חֲזוֹת֙ יעדי הַ/חֹזֶ֔ה עַל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/029.yaml
  text: The rest of the acts of Solomon[a], from first to last, are they not written in the records of Nathan the prophet, and in the prophecy of Ahijah the Shilonite[b], and in the visions of Iddo the seer concerning Jeroboam son of Nebat?
translation:
  language: hi
  text: सुलैमान के शेष काम, आरम्भ से अन्त तक, क्या नातान नबी के वृत्तांत[a] में, शीलोवासी अहिय्याह की भविष्यवाणी में और नबाट के पुत्र यारोबाम के विषय में[b] द्रष्टा इद्दो के दर्शनों में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नातान नबी के वचनों/विवरण में।” इब्रानी शब्द बोले गए वचनों या लिखित वृत्तांत—दोनों को सूचित कर सकता है; यहाँ सम्भवतः किसी लिखित स्रोत का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: या “नबाट के पुत्र यारोबाम के बारे में”; सम्भवतः “उसके विरुद्ध।” इब्रानी संबंधबोधक के ये अर्थ हो सकते हैं, पर स्रोत-सूची के इस प्रसंग में “के विषय में” सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר דִּבְרֵי שְׁלֹמֹה
  choice: सुलैमान के बाकी काम
  rationale: राजकीय इतिहास के समापन-सूत्र में דִּבְרֵי का अर्थ केवल बोले गए ‘वचन’ नहीं, बल्कि राजा के काम या कार्यकलाप है। ‘बाकी काम’ आधुनिक हिन्दी में सहज है।
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרוֹנִים
  choice: आरम्भ से अन्त तक
  rationale: यह पदबंध सुलैमान के पूरे इतिहास को समेटता है; हिन्दी का यह मुहावरा उसी समग्र अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या ... लिखे नहीं हैं?
  rationale: मूल के आलंकारिक प्रश्न और लिखित स्रोतों की ओर संकेत, दोनों को सुरक्षित रखा गया है।
- source_word: עַל דִּבְרֵי נָתָן הַנָּבִיא
  choice: नातान नबी के वृत्तांत में
  rationale: इस स्रोत-सूची में דִּבְרֵי किसी लिखित विवरण या अभिलेख को सूचित करता है। כתב के साथ עַל को स्वाभाविक हिन्दी में ‘में लिखे’ कहा गया है।
- source_word: נְבוּאַת אֲחִיָּה הַשִּׁילוֹנִי
  choice: शीलोवासी अहिय्याह की भविष्यवाणी में
  rationale: נְבוּאָה का सीधा अर्थ ‘भविष्यवाणी’ है और הַשִּׁילוֹנִי अहिय्याह का शीलो से संबंध बताता है।
- source_word: וּבַחֲזוֹת יֶעְדּוֹ הַחֹזֶה
  choice: दर्शी इद्दो के दर्शनों में
  rationale: חֲזוֹת को बहुवचन/समूहवाचक अर्थ में ‘दर्शनों’ और חֹזֶה को נָבִיא से भिन्न उपाधि बनाए रखने के लिए ‘दर्शी’ कहा गया है। नाम का प्रचलित बाइबलीय रूप ‘इद्दो’ रखा गया है।
- source_word: עַל יָרָבְעָם בֶּן נְבָט
  choice: नबाट के पुत्र यारोबाम के विषय में
  rationale: दस्तावेजी स्रोत के इस प्रसंग में עַל स्वाभाविक रूप से विषयवाचक है, यद्यपि कुछ संदर्भों में इसका अर्थ ‘के विरुद्ध’ भी हो सकता है।
theological_decisions:
- issue: इद्दो के दर्शनों और यारोबाम के बीच संबंध बताने वाले עַל का अर्थ
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: यहाँ इतिहास-ग्रंथों की सूची दी जा रही है, इसलिए यारोबाम को दर्शनों का विषय मानना सबसे स्वाभाविक है; फिर भी संभावित विरोधात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी’ और ‘दर्शी’ को अलग-अलग रखकर मूल की दो भविष्यसूचक उपाधियों का भेद सुरक्षित किया गया है। पादटिप्पणी-चिह्न उन्हीं शब्दसमूहों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
