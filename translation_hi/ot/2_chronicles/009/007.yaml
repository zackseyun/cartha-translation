base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/007.yaml
  text: Blessed are your men[b][a], and blessed are these your servants who stand before you continually and hear your wisdom.
translation:
  language: hi
  text: धन्य हैं आपके लोग,[a] और धन्य हैं आपके ये सेवक, जो निरन्तर आपके सामने खड़े रहते हैं[b] और आपकी बुद्धि की बातें सुनते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुखी हैं आपके लोग।” इब्रानी शब्द אַשְׁרֵי सुखी या सौभाग्यशाली दशा के साथ-साथ धन्यता का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “आपके सामने खड़े रहते हैं” राजदरबार की अभिव्यक्ति है, जिसका अर्थ राजा की उपस्थिति में सेवा के लिए उपस्थित रहना है।
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य हैं
  rationale: यह विस्मयादिबोधक रूप प्रशंसनीय, सौभाग्यपूर्ण और ईर्ष्या योग्य सुखमय दशा व्यक्त करता है। ‘धन्य हैं’ ऊँचे किंतु सहज हिन्दी भाव को बनाए रखता है; ‘सुखी हैं’ भी सम्भव है।
- source_word: אֲנָשֶׁיךָ
  choice: आपके ये लोग
  rationale: אֲנָשִׁים का सामान्य अर्थ ‘मनुष्य/लोग’ है। राजदरबार के प्रसंग में ये राजा के दरबारी या अधिकारी हो सकते हैं, पर मूल पाठ स्वयं पद को अधिक विशिष्ट नहीं बनाता। हिन्दी में ‘आपके लोग’ स्वाभाविक है; निकटवर्ती אֵלֶּה के कारण ‘ये’ जोड़ा गया है।
- source_word: עֲבָדֶיךָ
  choice: आपके ये सेवक
  rationale: עֶבֶד का अर्थ दास या सेवक हो सकता है। यहाँ राजकीय उपस्थिति और सेवा का प्रसंग होने के कारण ‘सेवक’ उपयुक्त है, जबकि ‘दास’ अनावश्यक रूप से बँधी हुई दासता पर बल दे सकता है।
- source_word: אֵלֶּה
  choice: ये
  rationale: निर्देशक सर्वनाम सामने उपस्थित या विशेष रूप से संकेत किए गए सेवकों की ओर ध्यान खींचता है। हिन्दी वाक्य में ‘आपके ये सेवक’ इसका स्वाभाविक स्थान है।
- source_word: הָעֹמְדִים לְפָנֶיךָ
  choice: जो ... आपके सामने खड़े रहते हैं
  rationale: शाब्दिक चित्र को बनाए रखते हुए यह राजदरबार में राजा की उपस्थिति में सेवा के लिए उपस्थित रहने का भाव व्यक्त करता है। सांस्कृतिक अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह नियमित और सतत उपस्थिति का भाव देता है। ‘निरन्तर’ गरिमापूर्ण और संक्षिप्त है तथा अनिवार्य रूप से बिना किसी क्षण के विराम का दावा नहीं करता।
- source_word: וְשֹׁמְעִים
  choice: और ... सुनते हैं
  rationale: שׁמע यहाँ सुनने और ग्रहण करने का अर्थ देता है। ‘सुनते हैं’ मूल की सीधी अभिव्यक्ति और ‘आपकी बुद्धि’ की असामान्य किंतु अर्थपूर्ण संरचना को सुरक्षित रखता है।
- source_word: חָכְמָתֶךָ
  choice: आपकी बुद्धि
  rationale: संज्ञा सीधे राजा की बुद्धि को दर्शाती है। इसे ‘आपकी बुद्धिमानी की बातें’ बनाना अर्थ को स्पष्ट तो करता, पर मूल में निहित संक्षिप्त अभिव्यक्ति का विस्तार कर देता।
