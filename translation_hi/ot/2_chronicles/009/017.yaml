translation:
  language: hi
  text: राजा ने हाथीदाँत का एक बड़ा सिंहासन बनाया और उस पर शुद्ध सोना मढ़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाया
  rationale: राजा के निर्माण कराने के अर्थ में हिंदी का प्रेरणार्थक रूप स्वाभाविक है; इससे यह अनिवार्य रूप से नहीं निकलता कि राजा ने अपने हाथों से सिंहासन बनाया।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ निश्चित उपाधि का प्रयोग करता है; संदर्भ में यह सुलैमान है, पर अनुवाद में नाम जोड़ना आवश्यक नहीं।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: राजकीय संदर्भ में यह सामान्य आसन नहीं, राजा का सिंहासन है।
- source_word: שֵׁן
  choice: हाथीदाँत
  rationale: शब्द का मूल अर्थ ‘दाँत’ है, पर पदार्थ के रूप में इस संयोग का स्वाभाविक अर्थ हाथीदाँत है।
- source_word: גָּדוֹל
  choice: भव्य
  rationale: यहाँ शब्द आकार के साथ वैभव और प्रभाव भी व्यक्त कर सकता है; ‘भव्य’ आधुनिक हिंदी में उस व्यापक भाव को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: וַיְצַפֵּהוּ
  choice: उस पर ... मढ़वाया
  rationale: पिएल रूप किसी वस्तु को पदार्थ से ढकने या मढ़ने को दर्शाता है; राजकीय कर्ता के साथ हिंदी में प्रेरणार्थक प्रयोग स्वाभाविक है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोना
  rationale: यह पदार्थ और उसकी शुद्धता का सीधा तथा प्रचलित हिंदी रूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘भव्य’ को चुना गया है ताकि גָּדוֹל के केवल आकार ही नहीं, प्रभावशाली वैभव का भाव भी रहे। हिंदी में हाथीदाँत का अर्थ स्पष्ट होने के कारण शाब्दिक ‘दाँत का सिंहासन’ वाली टिप्पणी आवश्यक नहीं समझी गई।
