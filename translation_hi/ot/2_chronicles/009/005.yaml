  yaml_path: translation/ot/2_chronicles/009/005.yaml
  text: Then she said to the king[a], “The report that I heard in my own land about your words and your wisdom was true.”
translation:
  language: hi
  text: तब उसने राजा से कहा, “मैंने अपने देश में आपकी बातों और आपकी बुद्धि के विषय में जो समाचार सुना था, वह सच था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब उसने ... कहा
  rationale: वय्यिक़्तोल कथानक में अगली घटना बताता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל־הַמֶּלֶךְ
  choice: राजा से
  rationale: सम्बोधित व्यक्ति को बताने वाला पूर्वसर्गीय पद; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: אֱמֶת הַדָּבָר
  choice: जो समाचार ... वह सच था
  rationale: इब्रानी मुहावरा सुनी हुई बात की सत्यता स्वीकार करता है। प्रसंग में ‘समाचार’ דבר का स्वाभाविक अर्थ देता है।
- source_word: אֲשֶׁר שָׁמַעְתִּי
  choice: जो ... मैंने ... सुना था
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी क्रम में रखा गया है; भूतपूर्वता के लिए ‘सुना था’ उपयुक्त है।
- source_word: בְּאַרְצִי
  choice: अपने देश में
  rationale: प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘अपने’ से स्पष्ट होता है; यहाँ ‘देश’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַל־דְּבָרֶיךָ
  choice: आपकी बातों के विषय में
  rationale: דברים में ‘बातें’, ‘मामले’ या ‘कार्य’ की अर्थ-सम्भावना है। ‘बातों’ मूल शब्द के निकट रहते हुए जानबूझकर उसकी व्यापकता बनाए रखता है।
- source_word: וְעַל־חָכְמָתֶךָ
  choice: और आपकी बुद्धि के विषय में
  rationale: मूल संज्ञा और द्वितीय पुरुष प्रत्यय का सीधा तथा स्पष्ट अनुवाद।
