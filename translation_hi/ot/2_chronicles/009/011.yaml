  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण ऐतिहासिक शैली रखी गई है। दुर्लभ लकड़ी का नाम लिप्यंतरित है और स्थापत्य शब्द की वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
