base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/011.yaml
  text: And the king made from the algum wood stairways for the house of Yahweh and for the king’s house[a], and lyres and harps for the singers[b]. Nothing like them had been seen before in the land of Judah.
translation:
  language: hi
  text: और राजा ने अलगूम की लकड़ी से याहवे के भवन और राजभवन के लिए सीढ़ीदार मार्ग[a], और गायकों के लिए वीणाएँ और हार्प बनवाए। यहूदा देश में इनके जैसी वस्तुएँ पहले कभी नहीं देखी गई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीढ़ियाँ”; इब्रानी शब्द भवनों तक पहुँचने के लिए बनाए गए मार्गों या सीढ़ियों का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצֵי הָאַלְגּוּמִים
  choice: अलगूम की लकड़ी
  rationale: यह बहुमूल्य आयातित लकड़ी के लिए प्रयुक्त एक दुर्लभ शब्द है, जिसकी ठीक प्रजाति अज्ञात है। इसलिए अनुमानित वृक्ष-नाम देने के बजाय इतिहासवृत्त के इब्रानी रूप का लिप्यंतरण रखा गया है।
- source_word: מְסִלּוֹת
  choice: सीढ़ीदार मार्ग
  rationale: संज्ञा का सामान्य अर्थ ऊँचा या बनाया हुआ मार्ग है; इस स्थापत्य प्रसंग में यह भवन तक पहुँचने के मार्ग अथवा सीढ़ियों को सूचित कर सकती है। ‘सीढ़ीदार मार्ग’ दोनों पहलुओं को यथासंभव बनाए रखता है।
- source_word: לְבֵית יְהוָה וּלְבֵית הַמֶּלֶךְ
  choice: यहोवा के भवन और राजभवन के लिए
  rationale: पहले בַּיִת के लिए ‘भवन’ इब्रानी अभिव्यक्ति को बनाए रखता है, जबकि दूसरे को स्वाभाविक और प्रसंगानुकूल हिन्दी में ‘राजभवन’ कहा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: כִנֹּרוֹת
  choice: वीणाएँ
  rationale: यह एक तार वाला वाद्य था; ठीक आधुनिक समकक्ष निश्चित नहीं है। ‘वीणा’ हिन्दी पाठक के लिए स्वाभाविक और गरिमापूर्ण सामान्य समतुल्य है।
- source_word: נְבָלִים
  choice: सारंगियाँ
  rationale: यह כִנּוֹר से भिन्न दूसरा तार वाला वाद्य था। सटीक वाद्य-पहचान अनिश्चित होने पर भी अलग हिन्दी वाद्य-नाम दोनों शब्दों के भेद को बनाए रखता है।
- source_word: לַשָּׁרִים
  choice: गायकों के लिए
  rationale: शׁיר धातु से बना यह रूप सीधे ‘गाने वालों’ अर्थात गायकों को दर्शाता है।
- source_word: וְלֹא נִרְאוּ כָהֵם לְפָנִים בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में इनके जैसी वस्तुएँ पहले कभी नहीं देखी गई थीं
  rationale: यह अनूठेपन और पूर्व में न देखे जाने की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है; ‘देश’ मूल के אֶרֶץ को भी व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी की व्यापक बाइबलीय परंपरा में ‘यहोवा’ पहचाना जाने वाला लिप्यंतरण है और यह ‘प्रभु’ जैसी उपाधि से नाम को अलग रखता है; मूल उच्चारण की पुनर्रचना ‘याहवे’ भी संभव है।
