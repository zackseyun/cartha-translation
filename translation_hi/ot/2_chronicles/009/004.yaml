  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दरबारी व्यवस्था के अलग-अलग पदों को ‘सेवक’, ‘परिचारक’ और ‘पेय परोसनेवाले’ द्वारा अलग रखा गया है। मुख्य पाठ में मसोरेटी पाठ को प्राथमिकता दी गई है और समानांतर पाठ की भिन्न सम्भावना पादटिप्पणी में दी गई है।
