base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/004.yaml
  text: the food of his table[a], the seating of his servants, the attendance of his ministers and their clothing, his cupbearers and their clothing, and the stairway by which he went up to the house of Yahweh[b], there was no more breath in her.
translation:
  language: hi
  text: उसकी मेज़ का भोजन, उसके सेवकों के बैठने की व्यवस्था, उसके परिचारकों का अपने-अपने स्थान पर खड़ा रहना और उनके वस्त्र, उसके पेय परोसनेवाले और उनके वस्त्र, और वह सीढ़ी जिससे वह याहवे के भवन में ऊपर जाता था[a]—यह सब देखकर उसमें फिर साँस न रही।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, 1 राजा 10:5 के समानांतर पाठ के अनुसार, “वह होमबलि जो वह याहवे के भवन में चढ़ाता था।” यहाँ का इब्रानी पाठ सबसे स्वाभाविक रूप से “वह सीढ़ी/चढ़ने का मार्ग जिससे वह ऊपर जाता था” पढ़ा जाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “उसमें फिर साँस न रही”; यह अत्यधिक आश्चर्य से अभिभूत होने का इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל שֻׁלְחָנוֹ
  choice: उसकी मेज़ का भोजन
  rationale: यह ठोस अर्थ ‘उसकी मेज़ पर परोसा जानेवाला भोजन’ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: מוֹשַׁב עֲבָדָיו
  choice: उसके सेवकों के बैठने की व्यवस्था
  rationale: מוֹשָׁב यहाँ केवल बैठने की क्रिया नहीं, बल्कि राजदरबार में निर्धारित आसनों अथवा क्रमबद्ध बैठने की व्यवस्था को सूचित करता है।
- source_word: מַעֲמַד מְשָׁרְתָיו
  choice: उसके परिचारकों का अपने-अपने स्थान पर खड़ा रहना
  rationale: मूल पद में खड़े होने या निर्धारित स्थान पर उपस्थित रहने का दृश्य भाव है। ‘परिचारक’ इसे पहले आए ‘सेवकों’ से अलग रखते हुए राजकीय सेवा का अर्थ व्यक्त करता है।
- source_word: מַלְבּוּשֵׁיהֶם
  choice: उनके वस्त्र
  rationale: यह स्पष्ट, गरिमापूर्ण और मूल संज्ञा का सीधा अनुवाद है।
- source_word: מַשְׁקָיו
  choice: उसके पेय परोसनेवाले
  rationale: राजदरबार में पेय की सेवा करनेवाले अधिकारियों का अर्थ देता है और किसी विशेष पेय को अनावश्यक रूप से नहीं जोड़ता।
- source_word: עֲלִיָּתוֹ אֲשֶׁר יַעֲלֶה בֵּית יְהוָה
  choice: वह सीढ़ी जिससे वह याहवे के भवन को जाता था
  rationale: मसोरेटी पाठ का सबसे स्वाभाविक अर्थ चढ़ने का मार्ग अथवा सीढ़ी है। समानांतर पाठ के कारण सम्भव ‘होमबलि’ पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא הָיָה עוֹד בָּהּ רוּחַ
  choice: उसमें साँस बाकी न रही
  rationale: רוּחַ के ‘साँस’ अर्थ और इब्रानी के सजीव मुहावरे को बनाए रखते हुए यह आश्चर्य से अभिभूत होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
