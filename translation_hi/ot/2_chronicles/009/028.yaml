  text: और लोग सुलैमान के लिए मिस्र और सभी देशों से घोड़े लाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצִיאִים
  choice: और लोग ... लाते थे
  rationale: हिफ़ईल कृदंत का शाब्दिक अर्थ ‘बाहर निकालना/ले आना’ है। यहाँ घोड़ों की व्यापारिक आपूर्ति के संदर्भ में ‘लाते थे’ स्वाभाविक है और अनिश्चित बहुवचन कर्ता को ‘लोग’ से व्यक्त करता है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी अर्थ।
- source_word: מִ/מִּצְרַיִם
  choice: मिस्र से
  rationale: מִן स्रोत या उद्गम बताता है।
- source_word: לִ/שְׁלֹמֹה
  choice: सुलैमान के लिए
  rationale: לְ यहाँ गंतव्य अथवा लाभार्थी सूचित करता है; व्यापारिक आपूर्ति के संदर्भ में ‘के लिए’ सबसे स्वाभाविक है।
- source_word: וּ/מִ/כָּל הָ/אֲרָצוֹת
  choice: और सभी देशों से
  rationale: כָּל के साथ אֲרָצוֹת अनेक भूभागों या राज्यों को दर्शाता है। आधुनिक हिन्दी में ‘सभी देशों’ स्पष्ट और सहज है।
