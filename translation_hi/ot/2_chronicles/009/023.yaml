review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the worldwide royal setting, the purpose of hearing Solomon's wisdom, and God's having placed that wisdom in his heart. However, “आते थे” adds the action of coming, which is not stated in the Hebrew; the idiom instead denotes seeking access to Solomon.
  naturalness: “दर्शन पाने” can naturally suggest religious viewing or veneration in modern Hindi, despite the explanatory note. “सुलैमान से मिलने का अवसर चाहते थे” is clearer and suitably formal in this royal context.
  terminology: “सुलैमान,” “बुद्धि,” “परमेश्वर,” and “हृदय” are appropriate. Retaining “हृदय” preserves the Hebrew expression without reducing it to merely intellectual ability.
  issues:
  - severity: medium
    issue: “सुलैमान के दर्शन पाने ... आते थे” adds “came” and risks a devotional sense for “दर्शन.”
    rationale: מְבַקְשִׁים (“were seeking”) with “the face of Solomon” means seeking his presence or an audience. It does not explicitly say that the kings came, and a non-devotional audience expression is preferable in Hindi.
  revised_text: और पृथ्वी के सभी राजा सुलैमान से मिलने का अवसर चाहते थे[a], ताकि उसकी उस बुद्धि को सुनें जो परमेश्वर ने उसके हृदय में रखी थी।
