  text: וְ/כֹל֙ מַלְכֵ֣י הָ/אָ֔רֶץ מְבַקְשִׁ֖ים אֶת פְּנֵ֣י שְׁלֹמֹ֑ה לִ/שְׁמֹ֨עַ֙ אֶת חָכְמָת֔/וֹ אֲשֶׁר נָתַ֥ן הָ/אֱלֹהִ֖ים בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/023.yaml
  text: And all the kings of the earth sought the presence of Solomon[a], to hear his wisdom that God had put in his heart.
translation:
  language: hi
  text: और पृथ्वी के सभी राजा सुलैमान से मिलने का अवसर चाहते थे[a], ताकि उसकी उस बुद्धि को सुनें जो परमेश्वर ने उसके हृदय में रखी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सुलैमान का मुख खोजते थे”; यह इब्रानी मुहावरा उससे मिलने या उसकी उपस्थिति में पहुँचने का अवसर चाहने के अर्थ में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל מַלְכֵי הָאָרֶץ
  choice: और पृथ्वी के सभी राजा
  rationale: וְ narrative continuation को व्यक्त करता है; הָאָרֶץ का यहाँ अंतरराष्ट्रीय राजकीय संदर्भ में ‘पृथ्वी’ स्वाभाविक है, यद्यपि इसका अर्थ ‘देश’ भी हो सकता है।
- source_word: מְבַקְשִׁים אֶת־פְּנֵי שְׁלֹמֹה
  choice: सुलैमान के दर्शन पाने आते थे
  rationale: शाब्दिक ‘सुलैमान का मुख खोजते थे’ एक इब्रानी मुहावरा है जिसका आशय उसकी उपस्थिति या भेंट का अवसर पाना है। ‘दर्शन पाने’ मुख/उपस्थिति की छवि को कुछ हद तक बचाता है और ‘आते थे’ कृदंत की निरंतर/बारंबार क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁמֹעַ אֶת חָכְמָתוֹ
  choice: उस बुद्धि को सुनने के लिए
  rationale: उद्देश्यवाचक infinitive को ‘सुनने के लिए’ से सीधे व्यक्त किया गया है; ‘उस बुद्धि’ सुलैमान की बुद्धि की ओर संकेत करता है।
- source_word: אֲשֶׁר נָתַן הָאֱלֹהִים בְּלִבּוֹ
  choice: जो परमेश्वर ने उसके हृदय में रखी थी
  rationale: נתן मूलतः ‘दिया’ है, पर בְּלִבּוֹ के साथ हिन्दी में ‘हृदय में रखी’ स्वाभाविक है और इब्रानी की आंतरिक-मनुष्य संबंधी छवि को बनाए रखता है।
theological_decisions:
- issue: सुलैमान की बुद्धि का दिव्य स्रोत
  choice: जो परमेश्वर ने उसके हृदय में रखी थी
  alternative: जो परमेश्वर ने उसे दी थी
  rationale: मुख्य पाठ परमेश्वर को बुद्धि का स्पष्ट स्रोत मानता है और ‘हृदय में’ को बनाए रखकर मूल पाठ की मानव-अंतरात्मा संबंधी भाषा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘दर्शन पाने’ को धार्मिक आराधना के अर्थ में नहीं, राजा की उपस्थिति में पहुँचने के राजकीय मुहावरे के रूप में प्रयुक्त किया गया है; पादटिप्पणी इसे स्पष्ट करती है।
