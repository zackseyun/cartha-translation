  rationale: इब्रानी कृदंत प्रसंग में बार-बार होने वाली प्रथागत क्रिया व्यक्त करता है; ‘लाते थे’ इसे स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אִישׁ מִנְחָתוֹ
  choice: अपनी-अपनी भेंट
  rationale: אִישׁ का प्रयोग वितरणात्मक है और מִנְחָה राजा को दी जाने वाली भेंट या कर-सदृश उपहार को सूचित कर सकता है। ‘भेंट’ मूल की व्यापकता बनाए रखता है।
- source_word: כְּלֵי כֶסֶף
  choice: चाँदी की वस्तुएँ
