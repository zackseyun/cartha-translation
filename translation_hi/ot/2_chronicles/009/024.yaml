- source_word: וּכְלֵי זָהָב
  choice: सोने की वस्तुएँ
  rationale: चाँदी की वस्तुओं के समानांतर वही व्यापक और स्वाभाविक शब्दावली रखी गई है।
- source_word: וּשְׂלָמוֹת
  choice: वस्त्र
  rationale: यह शब्द कपड़ों, संभवतः मूल्यवान बाहरी परिधानों, को दर्शाता है; ‘वस्त्र’ सम्मानपूर्ण और पर्याप्त रूप से व्यापक है।
- source_word: נֵשֶׁק
  choice: हथियार
  rationale: यह शब्द हथियारों अथवा सैन्य साज-सामान को सूचित कर सकता है; ‘हथियार’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּבְשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: राजकीय भेंटों के प्रसंग में यह सुगंधित मसालों अथवा अन्य सुगंधित पदार्थों के लिए व्यापक पद है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: प्रत्यक्ष और स्वाभाविक हिन्दी समतुल्य।
- source_word: וּפְרָדִים
  choice: खच्चर
  rationale: प्रत्यक्ष और स्वाभाविक हिन्दी समतुल्य।
- source_word: דְּבַר שָׁנָה בְּשָׁנָה
  choice: हर वर्ष
  rationale: यह इब्रानी मुहावरा नियमित वार्षिक पुनरावृत्ति बताता है; ‘हर वर्ष’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
