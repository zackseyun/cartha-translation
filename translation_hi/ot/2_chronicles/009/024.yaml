  yaml_path: translation/ot/2_chronicles/009/024.yaml
  text: 'And they were bringing[a], each man his tribute: articles of silver and articles of gold, garments, weapons, spices, horses, and mules[c][b], year by year.'
translation:
  language: hi
  text: और वे अपनी-अपनी भेंट[a] लाते थे—चाँदी की वस्तुएँ, सोने की वस्तुएँ, वस्त्र[b], हथियार[c], सुगंध-द्रव्य, घोड़े और खच्चर—हर वर्ष।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी-अपनी सौगात” अथवा “अपना-अपना नजराना”; इब्रानी शब्द מִנְחָה भेंट या चढ़ावा बता सकता है, और इस राजकीय प्रसंग में कर के रूप में दी गई भेंट का भाव भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “पोशाकें।”
    reason: lexical_alternative
  - marker: c
    text: या “कवच” अथवा “युद्ध-सामग्री।”
    reason: lexical_alternative
