base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/009.yaml
  text: And she gave the king one hundred twenty talents of gold[a], and spices in great abundance, and precious stones. There had never been spices like those that the queen of Sheba gave to King Solomon.
translation:
  language: hi
  text: उसने राजा को सोने के एक सौ बीस किक्कार, बहुतायत में सुगंधित मसाले और बहुमूल्य रत्न दिए। शीबा की रानी ने राजा सुलैमान को जो मसाले दिए थे, ऐसे मसाले पहले कभी नहीं थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “शीबा की रानी ने राजा सुलैमान को जो मसाले दिए थे, ऐसे मसाले फिर कभी नहीं हुए।” इब्रानी कथन का आशय उस समय तक ऐसे मसालों की बराबरी न होने से हो सकता है, अथवा अधिक व्यापक रूप से यह कि बाद में भी ऐसे मसाले नहीं हुए।'
    reason: इब्रानी कथन के समय-संबंधी दायरे में वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: उसने ... दिए
  rationale: क्रिया कथा को आगे बढ़ाती है; हिंदी में स्वाभाविक क्रम रखते हुए स्त्रीलिंग कर्ता का संकेत ‘उसने’ से दिया गया है।
- source_word: מֵאָה וְעֶשְׂרִים כִּכַּר זָהָב
  choice: एक सौ बीस किक्कार सोना
  rationale: כִּכָּר प्राचीन भार-माप है। पारंपरिक बाइबलीय इकाई ‘किक्कार’ रखने से अनिश्चित आधुनिक रूपांतरण थोपने से बचा गया है।
- source_word: וּבְשָׂמִים לָרֹב מְאֹד
  choice: बहुत बड़ी मात्रा में सुगंधित मसाले
  rationale: בְּשָׂמִים सुगंधित मसालों या सुगंध-द्रव्यों का व्यापक पद है, और לָרֹב מְאֹד अत्यधिक मात्रा पर बल देता है।
- source_word: וְאֶבֶן יְקָרָה
  choice: और बहुमूल्य रत्न
  rationale: एकवचन אֶבֶן यहाँ सामूहिक अर्थ में प्रयुक्त हो सकता है; सूची के संदर्भ में हिंदी बहुवचन स्वाभाविक है।
- source_word: כַּבֹּשֶׂם הַהוּא
  choice: जैसे मसाले ... वैसे मसाले
  rationale: כְּ की तुलनात्मक शक्ति को स्पष्ट रखते हुए गुणवत्ता, प्रकार अथवा समग्र उपहार में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: מַלְכַּת שְׁבָא
  choice: शीबा की रानी
  rationale: स्थान-नाम को मूल उच्चारण के निकट और प्रचलित हिंदी बाइबलीय रूप में रखा गया है।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान को
  rationale: पद और नाम का यह क्रम स्वाभाविक आधुनिक हिंदी है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सुगंधित मसाले’ सामान्य ‘मसाले’ की अपेक्षा मूल शब्द के सुगंध-संबंधी भाव को बेहतर व्यक्त करता है; प्राचीन भार-माप ‘किक्कार’ को रूपांतरित नहीं किया गया।
