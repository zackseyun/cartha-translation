  yaml_path: translation/ot/2_chronicles/009/015.yaml
  text: King Solomon made two hundred large shields of beaten gold[a]; six hundred shekels of beaten gold went onto each shield.
translation:
  language: hi
  text: राजा सुलैमान ने पीटे हुए सोने की दो सौ बड़ी ढालें बनाईं; हर ढाल पर पीटे हुए सोने के छह सौ शेकेल[a] लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से है, “पीटे हुए सोने के छह सौ एक ढाल पर चढ़े।” यहाँ भार की इकाई निहित है; स्पष्टता के लिए “शेकेल” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाईं
  rationale: 'राजकीय निर्माण के संदर्भ में यह स्वाभाविक हिन्दी है: राजा ने ढालें तैयार कराईं। यह मूल क्रिया ‘बनाना’ के अर्थ को बनाए रखती है।'
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: हिन्दी में उपाधि और नाम का स्वाभाविक क्रम।
- source_word: מָאתַיִם צִנָּה
  choice: दो सौ बड़ी ढालें
  rationale: צִנָּה संभवतः शरीर को अधिक ढकने वाली बड़ी ढाल है; ‘बड़ी ढालें’ निकटवर्ती छोटे ढाल-शब्द से संभावित भेद सुरक्षित रखता है।
- source_word: זָהָב שָׁחוּט
  choice: पीटा हुआ सोना
  rationale: שָׁחוּט यहाँ काम किए हुए, पीटकर पतला किए गए सोने को सूचित करता है; ‘पीटा हुआ सोना’ स्पष्ट और स्रोत-सन्निकट है।
- source_word: יַעֲלֶה עַל
  choice: पर ... लगे
  rationale: मूल रूपक में सोने की मात्रा ढाल ‘पर चढ़ती’ है। हिन्दी में ‘पर ... लगे’ निर्माण में प्रयुक्त मात्रा को स्वाभाविक ढंग से व्यक्त करता है, बिना यह अनिवार्य किए कि ढाल पूरी तरह ढकी थी।
- source_word: הַצִּנָּה הָאֶחָת
  choice: हर ढाल
  rationale: शाब्दिक ‘एक ढाल’ यहाँ वितरणात्मक है; हिन्दी में ‘हर ढाल’ अपेक्षित अर्थ देता है।
- source_word: '[שֵׁשׁ מֵאוֹת के बाद निहित माप-इकाई]'
  choice: शेकेल
  rationale: इब्रानी में इकाई व्यक्त नहीं है, पर मात्रा भार की है। पाठ की स्पष्टता के लिए पारंपरिक भार-इकाई ‘शेकेल’ दी गई है और पादटिप्पणी में इसकी पूर्ति बताई गई है।
