base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/031.yaml
  text: And Solomon slept with his fathers[a], and they buried him in the city of David his father. And Rehoboam his son reigned in his place.
translation:
  language: hi
  text: और सुलैमान अपने पुरखाओं के साथ सो गया[a], और उन्होंने उसे उसके पिता दाऊद के नगर में दफ़नाया। और उसका पुत्र रहूबियाम उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अपने पुरखाओं के साथ सो गया”; यह मृत्यु और अपने पूर्वजों के बीच दफ़न होने के लिए प्रयुक्त एक परंपरागत अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी राजकीय मृत्यु-सूचना के परंपरागत रूपक को बनाए रखता है; यहाँ इसका आशय मृत्यु है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ आधुनिक हिन्दी में वंशगत पूर्वजों का स्वाभाविक और स्पष्ट बोध देता है तथा मूल मुहावरे की संरचना बनाए रखता है।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे ... दफ़नाया
  rationale: मूल क्रिया सक्रिय बहुवचन है और कर्ता अनिर्दिष्ट है; ‘उन्होंने’ उसी अनिर्दिष्ट बहुवचन को सुरक्षित रखता है।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: यह पहचाना जाने वाला बाइबलीय स्थान-सूचक पद है और हिन्दी में स्वाभाविक है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: दाऊद और सुलैमान के संबंध को मूल के सीधे अर्थ के अनुसार व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के प्रसंग में यह स्वाभाविक हिन्दी है और राजपद ग्रहण करने का भाव स्पष्ट करती है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार और प्रतिस्थापन—दोनों का मूल भाव निकटता से व्यक्त करता है।
