lexical_decisions:
- source_word: אַנְשֵׁי הַתָּרִים
  choice: व्यापारी
  rationale: यह पद घूम-फिरकर व्यापार करने वाले व्यापारियों को दर्शाता है; आधुनिक हिन्दी में ‘व्यापारी’ सहज और पर्याप्त स्पष्ट है।
- source_word: הַסֹּחֲרִים
  choice: सौदागर
  rationale: पहले व्यापारिक वर्ग से शब्दगत भेद बनाए रखते हुए वाणिज्य करने वालों के लिए स्वाभाविक हिन्दी पर्याय चुना गया है।
- source_word: מַלְכֵי עֲרַב
  choice: अरब के सभी राजा
  rationale: עֲרַב को यहाँ भौगोलिक/जनसमूह-सूचक नाम ‘अरब’ समझा गया है, जैसा समानांतर संदर्भ और प्राचीन अनुवाद-परंपरा समर्थन करते हैं।
- source_word: פַחוֹת הָאָרֶץ
  choice: देश के राज्यपाल
  rationale: פַחוֹת प्रशासनिक शासकों/राज्यपालों को दर्शाता है; ‘देश’ הָאָרֶץ की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מְבִיאִים
  choice: लाते थे
  rationale: हिब्रू कृदंत जारी या नियमित गतिविधि का संकेत देता है; हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करता है।
