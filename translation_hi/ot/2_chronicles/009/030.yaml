translation:
  language: hi
  text: सुलैमान ने यरूशलेम में समस्त इस्राएल पर चालीस वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: राज किया
  rationale: यह क्रिया राजकीय शासन को व्यक्त करती है और यहाँ भूतकालीन कथन है; ‘राज किया’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्ति-नाम का प्रचलित और सहज रूप।
- source_word: בִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב यहाँ स्थान सूचित करता है; हिन्दी में ‘में’ इसका स्वाभाविक प्रतिरूप है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल पर
  rationale: מלך के साथ עַל शासन-अधिकार का बोध कराता है। ‘समस्त इस्राएल’ सामूहिक राष्ट्रीय अर्थ को सुरक्षित रखता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: यह अवधि बताता है; हिन्दी में अवधि को स्पष्ट और स्वाभाविक रूप से व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
