translation:
  language: hi
  text: राजा सुलैमान धन और बुद्धि में पृथ्वी के सभी राजाओं से बढ़कर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: बढ़कर था
  rationale: גדל का מִן के साथ यह तुलनात्मक प्रयोग दूसरों की अपेक्षा महान या श्रेष्ठ होने का भाव देता है। हिंदी में ‘से बढ़कर था’ इस तुलना को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: पदवी और नाम के इस संयोजन का आधुनिक मानक हिंदी में स्वाभाविक रूप ‘राजा सुलैमान’ है।
- source_word: מִכֹּל מַלְכֵי הָאָרֶץ
  choice: पृथ्वी के सभी राजाओं से
  rationale: אָרֶץ के ‘भूमि’ और ‘पृथ्वी’ दोनों अर्थ हो सकते हैं; यहाँ अंतरराष्ट्रीय और व्यापक राजकीय तुलना के संदर्भ में ‘पृथ्वी’ उपयुक्त है। מִן का तुलनात्मक भाव ‘से’ द्वारा व्यक्त किया गया है।
- source_word: לְעֹשֶׁר
  choice: धन में
  rationale: यहाँ לְ उस क्षेत्र या विषय को चिह्नित करता है जिसमें तुलना की गई है। עֹשֶׁר के लिए ‘धन’ सहज, वर्तमान और संक्षिप्त हिंदी है।
- source_word: וְחָכְמָה
  choice: और बुद्धि में
  rationale: חָכְמָה का अर्थ ‘बुद्धि’ या ‘बुद्धिमत्ता’ है। हिंदी में संयुक्त तुलना को स्पष्ट और स्वाभाविक रखने के लिए ‘में’ को दूसरे पद के साथ भी रखा गया है।
