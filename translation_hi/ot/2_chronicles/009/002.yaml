- source_word: מִשְּׁלֹמֹה
  choice: सुलैमान से
  rationale: נעלם के साथ מן उस व्यक्ति को सूचित करता है जिससे कोई बात छिपी हो।
- source_word: אֲשֶׁר לֹא הִגִּיד לָהּ
  choice: जिसे उसने उसे समझाया न हो
  rationale: दूसरा נגד पहली क्रिया की पुनरावृत्ति है; कठिन प्रश्नों के संदर्भ में ‘समझाया’ सुलैमान द्वारा बात स्पष्ट करने का आशय देता है, जबकि अधिक शाब्दिक ‘बताया’ को पादटिप्पणी में रखा गया है।
