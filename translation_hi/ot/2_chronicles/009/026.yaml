  yaml_path: translation/ot/2_chronicles/009/026.yaml
  text: And he ruled over all the kings from the River to the land of the Philistines and to the border of Egypt[a].
translation:
  language: hi
  text: वह नदी[a] से लेकर पलिश्तियों के देश तक और मिस्र की सीमा तक के सभी राजाओं पर शासन करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नदी’ से संभवतः फरात नदी अभिप्रेत है, जो इब्रानी बाइबल में एक प्रचलित भौगोलिक पद है।
    reason: मूल पाठ के निश्चित पद ‘नदी’ को मुख्य पाठ में बनाए रखते हुए उसके संभावित भौगोलिक संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי מוֹשֵׁל
  choice: शासन करता था
  rationale: היה के साथ participle מוֹשֵׁל बीते समय की जारी या स्थायी अवस्था व्यक्त करता है; हिंदी का अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל הַמְּלָכִים
  choice: सभी राजाओं पर
  rationale: משל के साथ ב यहाँ अधीन शासकों पर प्रभुत्व का बोध कराता है; ‘पर’ इस राजनीतिक संबंध को स्पष्ट रखता है।
- source_word: מִן הַנָּהָר
  choice: महानद से
  rationale: सप्रत्यय הַנָּהָר इस भू-राजनीतिक प्रयोग में फरात के लिए प्रचलित पद है। हिंदी बाइबलीय भूगोल में ‘महानद’ इस विशिष्ट पद को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: וְעַד אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश तक
  rationale: यह पश्चिमी विस्तार की सीमा बताता है और इब्रानी की जाति तथा देश-संबंधी अभिव्यक्ति को सीधे बनाए रखता है।
- source_word: וְעַד גְּבוּל מִצְרָיִם
  choice: और मिस्र की सीमा तक
  rationale: גְּבוּל का मूल क्षेत्रीय अर्थ ‘सीमा’ है; यह वाक्यांश दक्षिण-पश्चिमी विस्तार को दर्शाता है।
