  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। इब्रानी की भौगोलिक सीमा-रचना को बनाए रखते हुए वाक्यक्रम हिंदी के अनुसार स्वाभाविक किया गया है। ‘महानद’ को पाठ में ही विशिष्ट भौगोलिक पद के रूप में रखा गया है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
