  text: וְ/גַם עַבְדֵ֤י חירם וְ/עַבְדֵ֣י שְׁלֹמֹ֔ה אֲשֶׁר הֵבִ֥יאוּ זָהָ֖ב מֵ/אוֹפִ֑יר הֵבִ֛יאוּ עֲצֵ֥י אַלְגּוּמִּ֖ים וְ/אֶ֥בֶן יְקָרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/010.yaml
  text: And also the servants of Hiram and the servants of Solomon[a], who brought gold from Ophir[c][b], brought algum wood and precious stones.
translation:
  language: hi
  text: और हीराम के सेवक और सुलैमान के सेवक, जो ओपीर से सोना लाए थे, अलगूम की लकड़ी[a] और बहुमूल्य पत्थर[b] भी लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अलगूम” किस विशेष प्रकार की लकड़ी थी, यह निश्चित नहीं है; इसे “अलमुग की लकड़ी” भी कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “बहुमूल्य पत्थर” एकवचन रूप में है, पर यहाँ इसका सामूहिक अर्थ, अर्थात बहुमूल्य पत्थरों का माल, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगसूचक बल दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में सुरक्षित रखता है।
- source_word: עַבְדֵי
  choice: सेवक
  rationale: राजकीय सेवा में लगे लोगों के लिए यह प्रसंगानुकूल और सामान्य हिन्दी शब्द है; 'दास' अनावश्यक रूप से स्वामित्व की स्थिति पर बल देता।
- source_word: חירם
  choice: हीराम
  rationale: इस पद के इब्रानी व्यंजनात्मक रूप के अनुरूप प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा में सुबोध और व्यापक रूप।
- source_word: אֲשֶׁר הֵבִיאוּ זָהָב מֵאוֹפִיר
  choice: जो ओपीर से सोना लाए थे
  rationale: सम्बन्धवाचक उपवाक्य सेवकों की पहचान कराता है; 'लाए थे' पूर्ववर्ती सोना लाने और फिर अन्य वस्तुएँ लाने का स्वाभाविक हिन्दी क्रम व्यक्त करता है।
- source_word: עֲצֵי אַלְגּוּמִּים
  choice: अलगूम की लकड़ी
  rationale: वृक्ष-प्रजाति की पहचान अनिश्चित होने के कारण अनुमानात्मक 'चन्दन' के बजाय इब्रानी पद का लिप्यंतरण रखा गया है।
- source_word: וְאֶבֶן יְקָרָה
  choice: और बहुमूल्य पत्थर
  rationale: אֶבֶן रूपतः एकवचन है, पर माल-सूची में सामूहिक अर्थ सम्भावित है; हिन्दी में 'पत्थर' का यही रूप एकवचन और बहुवचन दोनों में चलता है, इसलिए अस्पष्टता स्वाभाविक रूप से बनी रहती है।
