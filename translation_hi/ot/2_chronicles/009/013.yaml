  text: וַ/יְהִי֙ מִשְׁקַ֣ל הַ/זָּהָ֔ב אֲשֶׁר בָּ֥א לִ/שְׁלֹמֹ֖ה בְּ/שָׁנָ֣ה אֶחָ֑ת שֵׁ֥שׁ מֵא֛וֹת וְ/שִׁשִּׁ֥ים וָ/שֵׁ֖שׁ כִּכְּרֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/013.yaml
  text: The weight of the gold that came to Solomon in one year was six hundred sixty-six talents of gold,[a]
translation:
  language: hi
  text: एक वर्ष में सुलैमान के पास आए सोने का वज़न छह सौ छियासठ किक्कार[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किक्कार’ प्राचीन भार की एक बड़ी इकाई थी; इसका ठीक भार अलग-अलग समय और स्थान में भिन्न था। सामान्य अनुमान से 666 किक्कार लगभग 23 मीट्रिक टन होते हैं।
    reason: प्राचीन माप की इकाई को आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: कथात्मक क्रम में यह अस्तित्व/स्थिति बताने वाली क्रिया है; हिन्दी में वाक्य के अंत का ‘था’ स्वाभाविक रूप से इसका अर्थ व्यक्त करता है, बिना कोई अनावश्यक ‘अब’ जोड़े।
- source_word: מִשְׁקַל הַזָּהָב
  choice: सोने का वज़न
  rationale: מִשְׁקַל विशेष रूप से भार या वज़न को दर्शाता है, केवल मात्रा या मूल्य को नहीं।
- source_word: אֲשֶׁר בָּא לִשְׁלֹמֹה
  choice: सुलैमान के पास आए
  rationale: בָּא का मूल अर्थ ‘आया’ है और इसमें लाने वाला कर्ता निर्दिष्ट नहीं है; ‘के पास आए’ प्राप्तकर्ता की दिशा स्पष्ट करते हुए इस अनिर्दिष्ट कर्तृत्व को बनाए रखता है।
- source_word: בְּשָׁנָה אֶחָת
  choice: एक वर्ष में
  rationale: यह एक वर्ष की अवधि के भीतर प्राप्त सोने की मात्रा बताता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שֵׁשׁ מֵאוֹת וְשִׁשִּׁים וָשֵׁשׁ
  choice: छः सौ छियासठ
  rationale: मूल पाठ की ठीक वही संख्या सरल आधुनिक हिन्दी में दी गई है।
- source_word: כִּכְּרֵי זָהָב
  choice: किक्कार
  rationale: כִּכָּר प्राचीन भार-माप है। ‘किक्कार’ स्रोत की इकाई को सुरक्षित रखता है; पाठक की सहायता के लिए पादटिप्पणी में इसका अनुमानित आधुनिक भार दिया गया है।
theological_decisions:
- issue: संख्या 666 का संभावित प्रतीकात्मक अर्थ
  choice: इसे सोने के ऐतिहासिक भार की सीधी संख्या के रूप में प्रस्तुत किया गया है।
  alternative: बाइबल के अन्य स्थानों में 666 के संभावित प्रतीकात्मक संबंध की ओर संकेत करना।
  rationale: यह पद स्वयं संख्या की कोई प्रतीकात्मक व्याख्या नहीं करता; इसलिए अनुवाद में बाद की धार्मिक संबद्धता आरोपित नहीं की गई।
- issue: सोना किसके द्वारा पहुँचाया गया
  choice: ‘सुलैमान के पास आए’ कहकर कर्ता को अनिर्दिष्ट रखा गया है।
  alternative: ‘सुलैमान के पास लाया गया’ कहना।
  rationale: इब्रानी में क्रिया सक्रिय रूप में ‘आया’ है और लाने वाले का उल्लेख नहीं है; चुना हुआ रूप इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वज़न’ सामान्य हिन्दी में स्पष्ट है। ‘किक्कार’ को लिप्यंतरित कर मूल प्राचीन इकाई सुरक्षित रखी गई है और पादटिप्पणी में अनुमानित आधुनिक समतुल्य दिया गया है।
