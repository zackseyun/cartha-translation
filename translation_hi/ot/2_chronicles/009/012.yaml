- source_word: אֲשֶׁר שָׁאָלָה
  choice: जो कुछ उसने माँगा
  rationale: यह उसकी इच्छित वस्तुओं को उसके अनुरोध से स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: מִלְּבַד אֲשֶׁר הֵבִיאָה אֶל הַמֶּלֶךְ
  choice: उससे अलग जो वह राजा के पास लाई थी
  rationale: מִלְּבַד के अपवर्जक अथवा अतिरिक्त भाव को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: וַתַּהֲפֹךְ
  choice: वह मुड़ी
