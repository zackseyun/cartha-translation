base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/012.yaml
  text: And King Solomon gave the queen of Sheba all that she desired[a], whatever she asked, besides what she had brought to the king. Then she turned and went to her own land[b], she and her servants.
translation:
  language: hi
  text: राजा सुलैमान ने शीबा की रानी को वह सब दिया जो वह चाहती थी, अर्थात् जो कुछ उसने माँगा था, उसके अतिरिक्त जो वह राजा के पास लाई थी।[क] फिर वह मुड़ी[ख] और अपने सेवकों के साथ अपने देश चली गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जो वह राजा के पास लाई थी, उससे अलग।” हिब्रू वाक्यांश को सुलैमान के उपहारों को रानी के लाए हुए उपहारों से अलग बताने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: ख
    text: या, “वह लौट गई।” हिब्रू में शाब्दिक रूप से “वह मुड़ी और गई” है।
    reason: lexical_alternative
