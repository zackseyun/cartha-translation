- source_word: וַתֵּלֶךְ לְאַרְצָהּ
  choice: अपने देश चली गई
  rationale: गंतव्य और स्त्रीलिंग कर्ता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִיא וַעֲבָדֶיהָ
  choice: अपने सेवकों के साथ
  rationale: हिब्रू समन्वय ‘वह और उसके सेवक’ को सहज हिन्दी में व्यक्त किया गया है; यहाँ עֲבָדִים राजकीय साथियों/सेवकों के लिए उपयुक्त है।
