source:
  edition: WLC
  text: יְהִ֨י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּר֔וּךְ אֲשֶׁ֣ר חָפֵ֣ץ בְּ/ךָ֗ לְ/תִתְּ/ךָ֤ עַל כִּסְא/וֹ֙ לְ/מֶ֔לֶךְ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/אַהֲבַ֨ת אֱלֹהֶ֤י/ךָ אֶת יִשְׂרָאֵל֙ לְ/הַעֲמִיד֣/וֹ לְ/עוֹלָ֔ם וַ/יִּתֶּנְ/ךָ֤ עֲלֵי/הֶם֙ לְ/מֶ֔לֶךְ לַ/עֲשׂ֖וֹת מִשְׁפָּ֥ט וּ/צְדָקָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/008.yaml
  text: Blessed be Yahweh your God[a], who delighted in you and set you on his throne as king for Yahweh your God. Because your God loved Israel, to establish them forever[c][b], he made you king over them to administer justice and righteousness.
translation:
  language: hi
  text: तुम्हारा परमेश्वर यहोवा धन्य हो[a], जो तुमसे प्रसन्न हुआ और जिसने तुम्हें अपने सिंहासन पर तुम्हारे परमेश्वर यहोवा के लिए राजा बनाया। क्योंकि तुम्हारे परमेश्वर ने इस्राएल से प्रेम किया, उसे सदा के लिए स्थिर रखने के लिए[b][c] उसने तुम्हें उन पर राजा बनाया, ताकि तुम न्याय और धार्मिकता करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे परमेश्वर यहोवा को धन्य कहा जाए।”
    reason: इब्रानी कामनार्थक आशीर्वचन को हिन्दी में एक से अधिक ढंग से व्यक्त किया जा सकता है।
  - marker: b
    text: “उसे” का अर्थ सामूहिक रूप से इस्राएल है; अनुवाद “उन्हें सदा के लिए स्थिर रखने के लिए” भी हो सकता है।
    reason: इब्रानी प्रत्यय एकवचन है, जबकि इस्राएल को सामूहिक प्रजा के रूप में भी समझा जा सकता है।
  - marker: c
    text: या, “क्योंकि तुम्हारे परमेश्वर ने इस्राएल से प्रेम किया ताकि उसे सदा के लिए स्थिर रखे, उसने तुम्हें उन पर राजा बनाया।”
    reason: उद्देश्यसूचक वाक्यांश का ‘इस्राएल से प्रेम किया’ वाले उपवाक्य से संबंध अधिक स्पष्ट करके भी अनुवाद किया जा सकता है।
lexical_decisions:
- source_word: יְהִי יְהוָה אֱלֹהֶיךָ בָּרוּךְ
  choice: तुम्हारा परमेश्वर यहोवा धन्य हो
  rationale: आज्ञार्थक/कामनार्थक संरचना और आशीर्वचन के सूत्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: חָפֵץ בְּךָ
  choice: तुमसे प्रसन्न होकर
  rationale: क्रिया में प्रसन्नता और अनुग्रहपूर्ण चुनाव का भाव है; यह हिन्दी में सहज है और केवल औपचारिक स्वीकृति तक अर्थ को सीमित नहीं करता।
- source_word: לְתִתְּךָ עַל כִּסְאוֹ
  choice: तुम्हें अपने सिंहासन पर ... राजा बनाया
  rationale: राजकीय नियुक्ति का अर्थ स्पष्ट करते हुए ‘अपने सिंहासन’ के उल्लेख को बनाए रखता है, जिससे परमेश्वर के अधिकार के अधीन राजत्व का कथन सुरक्षित रहता है।
- source_word: לְמֶלֶךְ לַיהוָה אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर यहोवा के लिए राजा
  rationale: सम्बन्ध और प्रतिनिधिक भूमिका बताने वाले לְ को बिना अतिरिक्त व्याख्या के यथासंभव सीधे रूप में प्रस्तुत करता है।
- source_word: בְּאַהֲבַת אֱלֹהֶיךָ אֶת יִשְׂרָאֵל
  choice: इस्राएल से तुम्हारे परमेश्वर के प्रेम के कारण
  rationale: בְּ के कारणसूचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהַעֲמִידוֹ לְעוֹלָם
  choice: उसे सदा के लिए स्थिर रखने के लिए
  rationale: एकवचन प्रत्यय को ‘उसे’ से सुरक्षित रखते हुए इस्राएल को सामूहिक प्रजा के रूप में संदर्भित करता है; उद्देश्यसूचक infinitive भी बना रहता है।
- source_word: וַיִּתֶּנְךָ עֲלֵיהֶם לְמֶלֶךְ
  choice: उसने तुम्हें उन पर राजा बनाया
  rationale: शाब्दिक ‘दिया’ के स्थान पर राजकीय नियुक्ति का प्रसंगगत अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לַעֲשׂוֹת מִשְׁפָּט וּצְדָקָה
  choice: ताकि तुम न्याय और धार्मिकता का काम करो
  rationale: दोनों विशिष्ट संज्ञाओं को बनाए रखते हुए राजकीय दायित्व को सामान्य पाठक के लिए सुबोध बनाता है।
theological_decisions:
- issue: כִּסְאוֹ (‘उसका/अपने सिंहासन’) और सुलैमान का राजत्व
  choice: ‘अपने सिंहासन’ को यहोवा के सिंहासन के रूप में रखा गया है।
  alternative: इसे सामान्य राजवंशीय सिंहासन मानकर केवल ‘सिंहासन’ कहना।
  rationale: निकटतम कर्ता यहोवा है और इतिहासकार सुलैमान के शासन को परमेश्वर के अधिकार के अधीन प्रस्तुत करता है; सर्वनाम हटाने से यह महत्त्वपूर्ण कथन दब जाता।
- issue: לְהַעֲמִידוֹ का वाक्यगत सम्बन्ध
  choice: उद्देश्य-वाक्यांश को परमेश्वर के प्रेम के कारण और राजा की नियुक्ति के बीच रखा गया है।
  alternative: ‘तुम्हारे परमेश्वर ने इस्राएल से प्रेम किया ताकि उसे सदा स्थिर रखे’ के रूप में इसे केवल प्रेम से जोड़ना।
  rationale: इब्रानी वाक्य-विन्यास उद्देश्य को प्रेम और राजकीय नियुक्ति दोनों के निकट रखता है; मुख्य पाठ की संरचना इस तनाव को अनावश्यक रूप से निर्णीत नहीं करती।
- issue: צְדָקָה का राजकीय अर्थ
  choice: ‘धार्मिकता’
  alternative: ‘सही काम’ या दूसरा ‘न्याय’
  rationale: מִשְׁפָּט और צְדָקָה की पारम्परिक जोड़ी में दोनों पदों का भेद बनाए रखना उचित है; ‘धार्मिकता’ नैतिक सहीपन को व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘तुम’ का प्रयोग रानी द्वारा राजा को सीधे सम्बोधन और मूल के एकवचन रूप के अनुरूप है। दिव्य नाम को ‘यहोवा’ के रूप में प्रत्यक्ष रखा गया है; वाक्य में मूल की पुनरावृत्ति और राजकीय-धर्मवैचारिक बल भी सुरक्षित हैं।
