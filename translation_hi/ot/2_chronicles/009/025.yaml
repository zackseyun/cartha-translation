base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/025.yaml
  text: Solomon had four thousand stalls for horses and chariots[a], and twelve thousand horsemen[b]; he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: hi
  text: सुलैमान के पास घोड़ों और रथों के लिए चार हज़ार बाड़े[a] और बारह हज़ार घुड़सवार थे। उसने उन्हें रथों के नगरों में और राजा के साथ यरूशलेम में तैनात किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अस्तबल”; इब्रानी शब्द घोड़ों को रखने के स्थानों या अलग-अलग इकाइयों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: 1 राजा 4:26 के समानांतर वर्णन में “चालीस हज़ार बाड़े” है, जबकि यहाँ “चार हज़ार” है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי לִשְׁלֹמֹה
  choice: सुलैमान के पास ... थे
  rationale: היה + ל का इब्रानी मुहावरा स्वामित्व या उपलब्धता व्यक्त करता है; आधुनिक हिंदी में यह सबसे स्वाभाविक रूप है।
- source_word: אֻרְיוֹת
  choice: अश्वशालाएँ
  rationale: यह शब्द घोड़ों को रखने के स्थान या इकाइयों को दर्शाता है। ‘अश्वशालाएँ’ गरिमापूर्ण और सुबोध है; ‘खूँटे’ अर्थ को अनावश्यक रूप से संकीर्ण करता।
- source_word: סוּסִים וּמַרְכָּבוֹת
  choice: घोड़ों और रथों के लिए
  rationale: दोनों इब्रानी संज्ञाओं को बनाए रखते हुए हिंदी में उनके और अश्वशालाओं के प्रयोजन-संबंध को स्पष्ट करता है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: यह सवारों या अश्वारोही सैनिकों का सीधा और सामान्य हिंदी समतुल्य है।
- source_word: וַיַּנִּיחֵם
  choice: उसने उन्हें ... तैनात किया
  rationale: सैन्य-प्रशासनिक संदर्भ में क्रिया का आशय निर्दिष्ट स्थानों पर रखना या नियुक्त करना है; ‘तैनात किया’ प्रसंगानुकूल है।
- source_word: בְּעָרֵי הָרֶכֶב
  choice: रथों के नगरों में
  rationale: यह रथ-सेना से संबद्ध निर्दिष्ट नगरों को दर्शाता है और इब्रानी संबंध-रचना को सहज हिंदी में व्यक्त करता है।
- source_word: וְעִם הַמֶּלֶךְ בִּירוּשָׁלִָם
  choice: और अपने पास यरूशलेम में
  rationale: मूल का शाब्दिक अर्थ ‘और राजा के साथ यरूशलेम में’ है। कर्ता सुलैमान होने के कारण ‘अपने पास’ हिंदी में संबंध को स्वाभाविक और स्पष्ट बनाता है।
