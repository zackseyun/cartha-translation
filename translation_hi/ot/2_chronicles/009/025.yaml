  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘अश्वशालाएँ’ सामान्य ‘घुड़सालों’ की अपेक्षा शास्त्रीय गरिमा रखता है, पर संदर्भ से अर्थ स्पष्ट है। मूल पाठ की संख्या ‘चार हज़ार’ बिना सामंजस्य बैठाए सुरक्षित रखी गई है।
