source:
  edition: WLC
  text: וְ/לֹֽא הֶאֱמַ֣נְתִּי לְ/דִבְרֵי/הֶ֗ם עַ֤ד אֲשֶׁר בָּ֨אתִי֙ וַ/תִּרְאֶ֣ינָה עֵינַ֔/י וְ/הִנֵּה֙ לֹ֣א הֻגַּד לִ֔/י חֲצִ֖י מַרְבִּ֣ית חָכְמָתֶ֑/ךָ יָסַ֕פְתָּ עַל הַ/שְּׁמוּעָ֖ה אֲשֶׁ֥ר שָׁמָֽעְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/009/006.yaml
  text: But I did not believe their words until I came and my own eyes saw it[a]; and behold, not even half of the greatness of your wisdom had been told to me[b]. You have surpassed the report that I heard.
translation:
  language: hi
  text: लेकिन जब तक मैं नहीं आई और अपनी आँखों से नहीं देखा, तब तक मैंने उनकी बातों पर विश्वास नहीं किया। और देखिए, आपकी बुद्धि की महानता[a] का आधा भी मुझे नहीं बताया गया था। मैंने जो समाचार सुना था, आप उससे कहीं बढ़कर निकले हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी बुद्धि की बहुतायत।”
    reason: מַרְבִּית का अर्थ ‘महानता’ के साथ-साथ ‘बहुतायत’ या ‘प्रचुरता’ भी हो सकता है।
  - marker: b
    text: या, “आप उस समाचार से बढ़ गए हैं जो मैंने सुना था।”
    reason: यह יָסַפְתָּ עַל की अधिक रूप-समीपी वैकल्पिक अभिव्यक्ति है; इसका अर्थ सुने हुए समाचार से आगे बढ़ना या उससे बढ़कर होना है।
lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: विश्वास नहीं किया
  rationale: यहाँ אמן का हिफ़ील रूप सुनी हुई बातों को सच मानने के अर्थ में है; ‘विश्वास करना’ आधुनिक हिन्दी में इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְדִבְרֵיהֶם
  choice: उनकी बातों पर
  rationale: דבר का सामान्य अर्थ ‘बात/वचन’ है। प्रसंग में ये सुलैमान के विषय में कही गई बातें हैं; ‘बातों पर विश्वास’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: וַתִּרְאֶינָה עֵינַי
  choice: अपनी आँखों से नहीं देखा
  rationale: इब्रानी का शाब्दिक भाव ‘मेरी आँखों ने देखा’ है। हिन्दी मुहावरा ‘अपनी आँखों से देखना’ प्रत्यक्ष पुष्टि के बल को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: הִנֵּה ध्यान और आश्चर्य की ओर संकेत करता है। राजा को संबोधित करते हुए ‘देखिए’ उसका संवादात्मक बल और सम्मानपूर्ण हिन्दी शैली बनाए रखता है।
- source_word: מַרְבִּית חָכְמָתֶךָ
  choice: आपकी बुद्धि की महानता
  rationale: מַרְבִּית मात्रा, प्रचुरता या महानता सूचित कर सकता है। ‘बुद्धि की महानता’ प्रसंग में उसके विशाल परिमाण और उत्कृष्टता दोनों को सहज हिन्दी में व्यक्त करती है; ‘बहुतायत’ को पाठ-टिप्पणी में रखा गया है।
- source_word: הֻגַּד לִי
  choice: मुझे नहीं बताया गया था
  rationale: נגד का होफ़ाल निष्क्रिय अर्थ ‘बताया/सूचित किया गया’ देता है। ‘था’ रानी के आने और देखने से पहले की सूचना को स्पष्ट करता है।
- source_word: יָסַפְתָּ עַל
  choice: आप उससे कहीं बढ़कर निकले हैं
  rationale: יסף על यहाँ पहले सुने समाचार से बढ़ जाने का भाव देता है। ‘बढ़कर निकले हैं’ तुलना और प्रत्यक्ष अनुभव से हुई पुष्टि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשְּׁמוּעָה אֲשֶׁר שָׁמָעְתִּי
  choice: मैंने जो समाचार सुना था
  rationale: שְׁמוּעָה किसी सुनी हुई सूचना या समाचार को दर्शाता है। ‘समाचार’ तटस्थ है और ‘अफ़वाह’ जैसा अविश्वसनीयता का अतिरिक्त भाव नहीं जोड़ता।
