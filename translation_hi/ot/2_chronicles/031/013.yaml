base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/013.yaml
  text: Jehiel[a], Azaziah, Nahath, Asahel, Jerimoth, Jozabad, Eliel, Ismakiah[b], Mahath, and Benaiah were officers under the authority of Conaniah and Shimei his brother, by the appointment of King Hezekiah and Azariah, the chief officer of the house of God.
translation:
  language: hi
  text: यहीएल, अज़ज़्याह, नहत, असाहेल, यरीमोत, योज़ाबाद, एलीएल, यिस्मक्याह, महत और बनायाह अधिकारी थे। वे कोनन्याह और उसके भाई शिमई के अधीन[a], राजा हिजकिय्याह और परमेश्वर के भवन के प्रधान अज़र्याह द्वारा की गई नियुक्ति के अनुसार[b] सेवा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोनन्याह और उसके भाई शिमई के हाथ से।”
    reason: lexical_alternative
  - marker: b
    text: या “राजा हिजकिय्याह और अज़र्याह के आदेश से”; अथवा “उनकी देखरेख में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקִידִים
  choice: अधिकारी
  rationale: यह संज्ञा प्रशासनिक दायित्व के लिए नियुक्त व्यक्तियों को दर्शाती है; ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से ऊँचा पद नहीं जताती।
- source_word: מִיַּד
  choice: के अधीन
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यहाँ यह अधिकार या पर्यवेक्षण के अधीन होने का मुहावरा है।
- source_word: אָחִיו
  choice: उसके भाई
  rationale: यह शिमई का कोनन्याह से सीधा पारिवारिक संबंध बताता है।
- source_word: בְּמִפְקַד
  choice: नियुक्ति के अनुसार
  rationale: शब्द नियुक्ति, आदेश या देखरेख का भाव दे सकता है; प्रसंग में औपचारिक प्राधिकरण व्यक्त करने के लिए यह चयन उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: נְגִיד
  choice: प्रधान
  rationale: यह नेतृत्व या मुख्य अधिकारी का पद दर्शाता है; ‘प्रधान’ प्रशासनिक संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह इब्रानी पदबंध का निकट और हिन्दी में सुबोध रूप है; संदर्भ में इसका आशय मन्दिर है।
- source_word: Proper names (יְחִיאֵל, עֲזַזְיָהוּ, נַחַת, עֲשָׂהאֵל, יְרִימוֹת, יוֹזָבָד, אֱלִיאֵל, יִסְמַכְיָהוּ, מַחַת, בְּנָיָהוּ, כּוֹנַנְיָהוּ, שִׁמְעִי, יְחִזְקִיָּהוּ, עֲזַרְיָהוּ)
  choice: यहीएल, अज़ज़्याह, नहत, असाहेल, यरीमोत, योज़ाबाद, एलीएल, यिस्मक्याह, महत, बनायाह, कोनन्याह, शिमई, हिजकिय्याह, अज़र्याह
  rationale: नामों को अनुवादित करने के बजाय इब्रानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है, साथ ही हिन्दी बाइबलीय पाठकों के लिए पठनीयता रखी गई है।
theological_decisions:
- issue: मन्दिर-प्रशासन के पदनामों का स्वरूप
  choice: सामान्य प्रशासनिक हिन्दी—‘अधिकारी’ और ‘प्रधान’—का प्रयोग
  alternative: ‘शासक’, ‘राजकुमार’ या अधिक पुरोहितीय पदानुक्रम सूचित करने वाले शब्द
  rationale: पद मुख्यतः प्रशासनिक व्यवस्था और अधिकार-शृंखला बताता है; मूल पाठ से अधिक ऊँचा राजकीय या पुरोहितीय दर्जा आरोपित नहीं किया गया।
- issue: בְּמִפְקַד में प्राधिकरण का प्रकार
  choice: ‘नियुक्ति के अनुसार’ मुख्य पाठ में, और ‘आदेश से/देखरेख में’ पादटिप्पणी में
  alternative: केवल ‘आदेश से’ या केवल ‘देखरेख में’
  rationale: इब्रानी शब्द की अर्थ-सीमा में नियुक्ति, आदेश और पर्यवेक्षण सम्मिलित हो सकते हैं; मुख्य पाठ संदर्भानुकूल है और पादटिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज प्रशासनिक भाषा रखी गई है। लम्बी नाम-सूची के बाद वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है, बिना अधिकार-शृंखला बदले।
