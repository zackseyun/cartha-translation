base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/008.yaml
  text: When Hezekiah and the officials came and saw the heaps[b][a], they blessed Yahweh and his people Israel.
translation:
  language: hi
  text: जब हिजकिय्याह और अधिकारी आए और उन ढेरों[a] को देखा, तब उन्होंने यहोवा की स्तुति की और उसकी प्रजा इस्राएल[b] को आशीर्वाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राशियों को।’ इब्रानी शब्द संचित वस्तुओं के ढेरों को सूचित करता है; यहाँ संभवतः चढ़ाई हुई उपज या भेंटों के ढेर।
    reason: lexical_alternative
  - marker: b
    text: ‘उसकी प्रजा इस्राएल’ में ‘उसकी’ का संबंध सबसे स्वाभाविक रूप से यहोवा से है। व्याकरण की दृष्टि से इसे हिजकिय्याह से जोड़कर ‘उसकी प्रजा, इस्राएल’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का यह कथात्मक रूप सामान्य भूतकाल में ‘आए’ के रूप में स्वाभाविक है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: וְהַשָּׂרִים
  choice: और अधिकारी
  rationale: שׂרים यहाँ शासन-प्रशासन से जुड़े अगुओं को दर्शाता है; आधुनिक हिन्दी में ‘अधिकारी’ स्पष्ट और प्रसंगानुकूल है।
- source_word: וַיִּרְאוּ
  choice: उन्होंने ... देखा
  rationale: ראה यहाँ सीधे दृश्य बोध को व्यक्त करता है। हिन्दी में कर्ता स्पष्ट करने के लिए सर्वनाम दोहराया गया है।
- source_word: הָעֲרֵמוֹת
  choice: उन ढेरों
  rationale: עֲרֵמוֹת जमा की हुई उपज या भेंटों के ठोस ढेरों को दर्शाता है; ‘ढेर’ उस दृश्य बिंब को बनाए रखता है।
- source_word: וַיְבָרֲכוּ
  choice: आशीर्वाद दिया
  rationale: ברך का मूल अर्थ बनाए रखा गया है। परमेश्वर को आशीर्वाद देना यहाँ उसकी स्तुति या प्रशंसा करना है, जबकि प्रजा के संबंध में भी यही क्रिया स्वाभाविक रूप से लागू होती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: उसकी प्रजा इस्राएल
  rationale: प्रत्यय וֹ का निकटतम और प्रसंगतः सबसे स्वाभाविक संदर्भ यहोवा है; ‘उसकी प्रजा इस्राएल’ वाचा-संबंध को व्यक्त करता है।
theological_decisions:
- issue: ‘उसकी प्रजा’ में सर्वनाम का संदर्भ
  choice: '‘उसकी’ को यहोवा के संदर्भ में लिया गया है: ‘उसकी प्रजा इस्राएल।’'
  alternative: 'व्याकरण की दृष्टि से इसे हिजकिय्याह के संदर्भ में भी समझा जा सकता है: ‘उसकी प्रजा, इस्राएल।’'
  rationale: निकटवर्ती पदबंध ‘यहोवा को और उसकी प्रजा इस्राएल को’ तथा सामान्य बाइबलीय वाचा-भाषा यहोवा को संदर्भ मानने का अधिक समर्थन करते हैं। फिर भी स्रोत में संभव दूसरी समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: यहोवा और इस्राएल दोनों को ‘आशीर्वाद देना’
  choice: एक ही इब्रानी क्रिया के लिए दोनों कर्मों के साथ ‘आशीर्वाद दिया’ रखा गया है।
  alternative: ‘यहोवा की स्तुति की और उसकी प्रजा इस्राएल को आशीर्वाद दिया।’
  rationale: मूल पाठ एक ही क्रिया וַיְבָרֲכוּ को दोनों कर्मों पर लागू करता है। हिन्दी में हल्की असामान्यता के बावजूद इसे बनाए रखने से मूल की संरचना और अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अधिकारी’ प्रशासनिक प्रसंग के लिए सहज है; ‘ढेर’ मूल के ठोस चित्र को बनाए रखता है।
