  text: וַ/יַּעֲמֵ֣ד יְחִזְקִיָּ֡הוּ אֶת מַחְלְק֣וֹת הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם עַֽל מַחְלְקוֹתָ֞/ם אִ֣ישׁ כְּ/פִ֣י עֲבֹדָת֗/וֹ לַ/כֹּהֲנִים֙ וְ/לַ/לְוִיִּ֔ם לְ/עֹלָ֖ה וְ/לִ/שְׁלָמִ֑ים לְ/שָׁרֵת֙ וּ/לְ/הֹד֣וֹת וּ/לְ/הַלֵּ֔ל בְּ/שַׁעֲרֵ֖י מַחֲנ֥וֹת יְהוָֽה־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/002.yaml
  text: And Hezekiah appointed the divisions of the priests and the Levites according to their divisions[a], each man according to his service, both the priests and the Levites, for burnt offerings and peace offerings[c][b], to minister and to give thanks and to praise at the gates of the camps of Yahweh.
translation:
  language: hi
  text: हिजकिय्याह ने याजकों और लेवियों के दलों को उनके दलों[a] के अनुसार नियुक्त किया, हर एक को उसकी सेवा के अनुसार—याजकों और लेवियों को होमबलियों और मेलबलियों[b] के लिए, तथा सेवा करने, धन्यवाद देने और यहोवा की छावनियों के फाटकों पर स्तुति करने के लिए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवा-क्रम”; याजकों और लेवियों के संगठित समूह।
    reason: lexical_alternative
  - marker: b
    text: या “शांति-बलियाँ।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से “यहोवा की छावनियों के फाटकों पर”; कुछ लोग इसे संदर्भ के अनुसार “यहोवा के आँगनों में” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किया
  rationale: प्रशासनिक और उपासना-संबंधी संदर्भ में यह क्रिया लोगों को व्यवस्थित भूमिकाओं में ठहराने या लगाने को दर्शाती है; ‘नियुक्त किया’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַחְלְקוֹת
  choice: दल
  rationale: यह याजकों और लेवियों के संगठित सेवा-समूहों को दर्शाता है। ‘दल’ स्पष्ट और सहज है तथा पद में संज्ञा की पुनरावृत्ति भी बनाए रखता है।
- source_word: אִישׁ כְּפִי עֲבֹדָתוֹ
  choice: हर एक को उसकी सेवा के अनुसार
  rationale: वितरणात्मक एकवचन का अर्थ सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक है; संदर्भ से स्पष्ट है कि याजकीय और लेवी पुरुष सेवक अभिप्रेत हैं।
- source_word: לְעֹלָה
  choice: होमबलियाँ चढ़ाएँ
  rationale: עֹלָה बलिदान की स्थापित श्रेणी है। बहुवचन आवर्ती सेवाओं के सारांश में स्वाभाविक है; ‘चढ़ाएँ’ हिन्दी वाक्य में प्रयोजन को स्पष्ट करता है।
- source_word: וְלִשְׁלָמִים
  choice: और मेलबलियाँ
  rationale: ‘मेलबलि’ हिन्दी बाइबलीय प्रयोग में इस बलिदान-श्रेणी का संक्षिप्त और परिचित नाम है; यह केवल सामान्य ‘शान्ति’ के अर्थ तक सीमित नहीं करता।
- source_word: לְשָׁרֵת
  choice: सेवा करें
  rationale: मन्दिर-संबंधी पवित्र सेवा अभिप्रेत है। हिन्दी में ‘सेवा करना’ स्वाभाविक है और अनावश्यक रूप से बाद की कलीसियाई शब्दावली नहीं जोड़ता।
- source_word: וּלְהוֹדוֹת וּלְהַלֵּל
  choice: धन्यवाद दें और ... स्तुति करें
  rationale: उपासना के संदर्भ में ידה का आशय धन्यवाद देना है और הלל स्तुति करना; दोनों अलग क्रियाएँ रखी गई हैं।
- source_word: בְּשַׁעֲרֵי מַחֲנוֹת יְהוָה
  choice: यहोवा के छावनी-स्थानों के फाटकों पर
  rationale: מַחֲנוֹת स्पष्ट रूप से बहुवचन है। असामान्य ‘छावनियों’ की छवि को ‘आँगनों’ बनाकर व्याख्यात्मक रूप से सामान्य नहीं किया गया; ‘छावनी-स्थान’ हिन्दी में अर्थ को कुछ अधिक स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण दिया गया है।
theological_decisions:
- issue: אִישׁ का लिंग-सूचक वितरणात्मक प्रयोग
  choice: हर एक को उसकी सेवा के अनुसार
  alternative: हर पुरुष को उसकी सेवा के अनुसार
  rationale: संदर्भ ऐतिहासिक रूप से पुरुष याजकों और लेवियों का है, पर हिन्दी में ‘हर पुरुष’ अनावश्यक रूप से भारी लगता है। ‘हर एक’ स्रोत के वितरणात्मक बल को सुरक्षित रखता है और संदर्भ लिंग को स्पष्ट करता है।
- issue: שְׁלָמִים का अनुवाद
  choice: मेलबलियाँ
  alternative: शान्ति-बलियाँ
  rationale: ‘मेलबलि’ बलिदान की पारंपरिक श्रेणी को व्यक्त करती है, पर इसे केवल मानसिक या राजनीतिक शान्ति के अर्थ में सीमित नहीं करती। वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: מַחֲנוֹת יְהוָה की असामान्य मन्दिर-संबंधी छवि
  choice: यहोवा के छावनी-स्थानों
  alternative: यहोवा के आँगनों
  rationale: हिब्रू बहुवचन और उसकी असामान्य छवि को सुरक्षित रखा गया है; ‘आँगन’ सन्दर्भगत व्याख्या है, प्रत्यक्ष शब्दार्थ नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। प्रशासनिक संरचना के लिए ‘दल’, उपासना-कर्म के लिए ‘सेवा’, और बलिदान-श्रेणियों के लिए प्रचलित हिन्दी बाइबलीय शब्दावली अपनाई गई है। हिब्रू के असामान्य बहुवचन ‘छावनियों’ को व्याख्यात्मक ‘आँगनों’ से प्रतिस्थापित नहीं किया गया।
