base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/015.yaml
  text: Under his authority were Eden[a], Miniamin, Jeshua, Shemaiah, Amariah, and Shecaniah, in the cities of the priests, faithfully to distribute to their brothers by divisions[c][b], to great and small alike.
translation:
  language: hi
  text: उसके अधीन एदेन[a], मिन्यामीन, येशूअ, शमायाह, अमर्याह और शकन्याह थे। वे याजकों के नगरों में अपने भाइयों[b] को विभागों के अनुसार निष्ठापूर्वक वितरित करते थे—बड़े और छोटे, दोनों को समान रूप से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके साथ” अथवा “उसकी जिम्मेदारी में”; इब्रानी मुहावरा सहयोग, देखरेख या अधिकार का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” से आशय याजकीय समुदाय के उनके साथी सदस्यों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל־יָדוֹ
  choice: उसके अधीन
  rationale: यह इब्रानी मुहावरा किसी की देखरेख, अधिकार या जिम्मेदारी के अधीन कार्य करने का भाव दे सकता है। प्रशासनिक संदर्भ में ‘उसके अधीन’ स्वाभाविक और स्पष्ट है।
- source_word: עֵדֶן וּמִנְיָמִן וְיֵשׁוּעַ וּשְׁמַעְיָהוּ אֲמַרְיָהוּ וּשְׁכַנְיָהוּ
  choice: एदेन, मिन्यामीन, येशूअ, शमायाह, अमर्याह और शकन्याह
  rationale: व्यक्तिनामों को इब्रानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּעָרֵי הַכֹּהֲנִים
  choice: याजकों के नगरों में
  rationale: यह संबंधवाचक इब्रानी रचना का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: यहाँ शब्द धार्मिक ‘विश्वास’ से अधिक सौंपे गए प्रशासनिक कार्य को भरोसेमंद ढंग से करने का भाव व्यक्त करता है।
- source_word: לָתֵת
  choice: बाँटकर देते थे
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है, किंतु संदर्भ नियत अंशों के संगठित वितरण का है; संयुक्त अभिव्यक्ति दोनों भावों को बनाए रखती है।
- source_word: לַאֲחֵיהֶם
  choice: अपने भाइयों को
  rationale: मूल में शाब्दिक रूप से ‘उनके भाइयों’ है; हिन्दी में कर्ता के साथ ‘अपने भाइयों’ अधिक स्वाभाविक है और याजकीय समुदाय के सह-सदस्यों को सूचित करता है।
- source_word: בְּמַחְלְקוֹת
  choice: उनके दलों के अनुसार
  rationale: מַחְלְקוֹת व्यवस्थित दलों अथवा सेवा-वर्गों को दर्शाता है; ‘दलों के अनुसार’ वितरण की व्यवस्था स्पष्ट करता है।
- source_word: כַּגָּדוֹל כַּקָּטָן
  choice: बड़े और छोटे, दोनों को समान रूप से
  rationale: यह समावेशी और निष्पक्ष वितरण का भाव देता है; ‘बड़े और छोटे’ मूल की संभावित पद, आयु या महत्त्व-संबंधी व्यापकता को सुरक्षित रखता है।
