  text: וּ/כְ/כַלּ֣וֹת כָּל זֹ֗את יָצְא֨וּ כָּל יִשְׂרָאֵ֥ל הַֽ/נִּמְצְאִים֮ לְ/עָרֵ֣י יְהוּדָה֒ וַ/יְשַׁבְּר֣וּ הַ/מַּצֵּב֣וֹת וַ/יְגַדְּע֣וּ הָ/אֲשֵׁרִ֡ים וַ/יְנַתְּצ֣וּ אֶת הַ֠/בָּמוֹת וְ/אֶת הַֽ/מִּזְבְּחֹ֞ת מִ/כָּל יְהוּדָ֧ה וּ/בִנְיָמִ֛ן וּ/בְ/אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה עַד לְ/כַלֵּ֑ה וַ/יָּשׁ֜וּבוּ כָּל בְּנֵ֧י יִשְׂרָאֵ֛ל אִ֥ישׁ לַ/אֲחֻזָּת֖/וֹ לְ/עָרֵי/הֶֽם־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/001.yaml
  text: And when all this was finished[a], all Israel who were present went out to the cities of Judah and shattered the pillars, cut down the Asherim, and tore down the high places and the altars throughout all Judah and Benjamin, and in Ephraim and Manasseh, until they had completely destroyed them. Then all the sons of Israel returned, each man to his possession, to their cities.
translation:
  language: hi
  text: जब यह सब पूरा हो गया, तब वहाँ उपस्थित सभी इस्राएली यहूदा के नगरों में गए। उन्होंने पूजा-स्तंभों को चकनाचूर कर दिया, अशेरा-चिह्नों[a] को काट गिराया, और सारे यहूदा और बिन्यामीन में तथा एप्रैम और मनश्शे में ऊँचे स्थानों और वेदियों को ढा दिया, यहाँ तक कि उन्हें पूरी तरह नष्ट कर दिया। तब इस्राएल के सब लोग अपने-अपने अधिकार की भूमि और अपने नगरों को लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा के खंभों।” इब्रानी शब्द अशेरा से जुड़ी पूजा-वस्तुओं के लिए है, जिन्हें प्रायः लकड़ी के खंभे या वृक्ष माना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹת כָּל זֹאת
  choice: जब यह सब पूरा हो गया
  rationale: כ־ के साथ infinitive construct समयसूचक उपवाक्य बनाता है। निष्क्रिय हिन्दी सहज है और इब्रानी में न दिए गए कर्ता को नहीं जोड़ती।
- source_word: כָּל יִשְׂרָאֵל הַנִּמְצְאִים
  choice: वहाँ उपस्थित सभी इस्राएली
  rationale: הַנִּמְצְאִים का आशय वहाँ पाए जाने वाले अथवा उपस्थित लोगों से है; प्रसंगानुसार यह पर्व में उपस्थित इस्राएलियों को दर्शाता है।
- source_word: הַמַּצֵּבוֹת
  choice: पूजा के खंभों
  rationale: מַצֵּבוֹת धार्मिक उपयोग के खड़े पत्थर या स्तंभ हैं। 'पूजा के खंभे' सामान्य पाठक को इनके धार्मिक स्वरूप का स्पष्ट संकेत देता है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-चिह्नों
  rationale: यह बहुवचन अशेरा से संबंधित पूजनीय वस्तुओं को सूचित करता है, पर उनका ठीक भौतिक रूप निश्चित नहीं करता। 'चिह्न' इस अस्पष्टता को बनाए रखता है; वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थानों
  rationale: בָּמוֹת पूजा के लिए प्रयुक्त ऊँचे स्थल हैं; हिन्दी बाइबलीय प्रयोग में 'ऊँचे स्थान' संक्षिप्त और समझने योग्य है।
- source_word: מִכָּל יְהוּדָה וּבִנְיָמִן וּבְאֶפְרַיִם וּמְנַשֶּׁה
  choice: सारे यहूदा और बिन्यामीन में तथा एप्रैम और मनश्शे में
  rationale: यह वाक्यांश उन सभी क्षेत्रों में विनाश की व्यापकता बताता है। हिन्दी में 'में' स्थान और विस्तार दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד לְכַלֵּה
  choice: जब तक उन्होंने उन सबका पूरी तरह नाश नहीं कर दिया
  rationale: यह मुहावरा कार्य को पूर्ण अंत तक पहुँचाने पर बल देता है। 'उन सबका' पूर्वोक्त धार्मिक प्रतिष्ठानों की ओर संकेत करता है।
- source_word: אִישׁ לַאֲחֻזָּתוֹ לְעָרֵיהֶם
  choice: अपने-अपने अधिकार की भूमि में, अपने नगरों को
  rationale: אִישׁ का वितरणात्मक अर्थ 'अपने-अपने' से स्वाभाविक ढंग से आता है। אֲחֻזָּה पैतृक अथवा स्थायी भू-अधिकार को दर्शाती है, इसलिए 'अधिकार की भूमि' केवल निजी चल-संपत्ति से अधिक सटीक है।
theological_decisions:
- issue: इब्रानी के पुरुषवाचक सामुदायिक पद בְּנֵי יִשְׂרָאֵל और वितरणात्मक אִישׁ का हिन्दी रूप
  choice: सभी इस्राएली ... अपने-अपने
  alternative: इस्राएल के सभी पुत्र ... हर पुरुष
  rationale: यहाँ दोनों पद पूरे जातीय समुदाय और प्रत्येक सदस्य के लिए रूढ़ सामुदायिक/वितरणात्मक भाषा हैं। सहज हिन्दी में 'इस्राएली' और 'अपने-अपने' स्रोत का अर्थ रखते हैं, बिना यह दावा जोड़े कि वापसी केवल पुरुषों की थी।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। धार्मिक वस्तुओं के लिए पारंपरिक शब्दावली और आवश्यक व्याख्यात्मक स्पष्टता का संतुलन रखा गया है।
