  yaml_path: translation/ot/2_chronicles/031/012.yaml
  text: They brought in the contribution[a], the tithe, and the holy things faithfully, and Conaniah the Levite was chief over them[b], with his brother Shimei second.
translation:
  language: hi
  text: वे भेंट[a], दशमांश और पवित्र वस्तुएँ विश्वासपूर्वक ले आए। इनकी देखरेख का प्रधान लेवीय कोनन्याह था, और उसका भाई शिमी दूसरे पद पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र उपयोग के लिए अलग किया गया अंश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: भीतर लाते गए
  rationale: हिफ़ील रूप का अर्थ ‘लाना/भीतर लाना’ है। भंडारों के संदर्भ में यह सामग्री पहुँचाने को स्वाभाविक रूप से व्यक्त करता है, और क्रिया की कथात्मक प्रगति भी बनाए रखता है।
- source_word: הַתְּרוּמָה
  choice: भेंट
  rationale: यह पवित्र उपयोग के लिए अलग किया गया अंश या योगदान है। ‘भेंट’ आधुनिक हिन्दी में सहज और धार्मिक संदर्भ में स्पष्ट है; तकनीकी अनुष्ठानिक अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: הַמַּעֲשֵׂר
  choice: दशमांश
  rationale: यह परमेश्वर को दिया जाने वाला दसवाँ भाग है; ‘दशमांश’ इसका प्रचलित और सटीक हिन्दी समतुल्य है।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र की हुई वस्तुएँ
  rationale: बहुवचन संज्ञा उन वस्तुओं को सूचित करती है जो पवित्र उपयोग के लिए समर्पित थीं। यह हिन्दी में ‘पवित्र वस्तुएँ’ की अपेक्षा समर्पण का भाव अधिक स्पष्ट करती है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: प्रशासनिक संदर्भ में אֱמוּנָה ईमानदार, भरोसेमंद और निष्ठापूर्ण रीति को व्यक्त करता है। यह अनुवाद उस गुण को संज्ञात्मक स्पष्टता के साथ रखता है।
- source_word: וַעֲלֵיהֶם נָגִיד
  choice: उनका प्रधान था
  rationale: על अधिकार या देखरेख और נָגִיד नियुक्त अगुआ को दर्शाता है। ‘प्रधान’ राजकीय शासन का अनावश्यक अर्थ दिए बिना वरिष्ठ पर्यवेक्षण व्यक्त करता है।
- source_word: כונניהו
  choice: कोनन्याह
  rationale: हिब्रू नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
- source_word: הַלֵּוִי
  choice: लेवी
  rationale: सव्याख्यात्मक ‘लेवीवंशी’ के बजाय संक्षिप्त, बाइबलीय हिन्दी में परिचित पद रखा गया है; निश्चित पद व्यक्ति की पहचानी हुई भूमिका बताता है।
- source_word: אָחִיהוּ
  choice: उसका भाई
  rationale: सामान्य अर्थ सगा भाई है और संदर्भ व्यापक संबंधी का अर्थ लेने को बाध्य नहीं करता।
- source_word: מִשְׁנֶה
  choice: उसके बाद दूसरे स्थान पर
  rationale: शब्द दूसरे दर्जे के अधिकारी या उपप्रधान को दर्शाता है। वाक्यांश पदानुक्रम स्पष्ट करता है, पर किसी अधिक विशिष्ट पदवी को आरोपित नहीं करता।
