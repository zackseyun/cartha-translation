translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी अपनाई गई है। मूल इब्रानी की संक्षिप्त, अध्याहारयुक्त रचना को स्पष्ट करने के लिए दूसरे खंड में ‘पंजीकरण’ दोहराया गया है। दोनों अंतिम בְּ-वाक्यांशों को समान रूप से ‘के अनुसार’ से व्यक्त किया गया है, क्योंकि मूल में दोनों पर एक ही पूर्वसर्ग है।
