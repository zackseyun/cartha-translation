base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/017.yaml
  text: The genealogical registration of the priests was by their fathers’ houses[a], and that of the Levites from twenty years old and upward[b], in their duties by their divisions.
translation:
  language: hi
  text: याजकों का वंशानुसार पंजीकरण उनके पितृकुलों के अनुसार हुआ, और बीस वर्ष और उससे अधिक आयु के लेवियों का पंजीकरण उनके सेवा-दायित्वों और उनके विभागों के अनुसार हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִתְיַחֵשׂ
  choice: वंशावली में पंजीकरण
  rationale: यह क्रिया वंश के आधार पर अभिलेख में दर्ज किए जाने को दर्शाती है। इब्रानी वाक्य संक्षिप्त और अध्याहारयुक्त है, इसलिए प्रशासनिक अर्थ को स्पष्ट करने हेतु भाववाचक पद प्रयोग किया गया है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: याजकीय वर्ग के लिए मानक और स्वाभाविक हिन्दी पद।
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह आधिकारिक पंजीकरण और सेवा-व्यवस्था में प्रयुक्त पैतृक वंश-समूहों को सूचित करता है; ‘पितृकुल’ संक्षिप्त तथा सांस्कृतिक रूप से उपयुक्त है।
- source_word: וְהַלְוִיִּם
  choice: और लेवियों का पंजीकरण
  rationale: इब्रानी में पहले खंड से ‘वंशावली में पंजीकरण’ का विचार अध्याहृत है; हिन्दी में समानांतर रचना स्पष्ट करने के लिए इसे दोहराया गया है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: बीस वर्ष या उससे अधिक आयु वालों का
  rationale: यह आयु-सीमा बताने वाला प्रचलित सूत्र है और आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בְּמִשְׁמְרוֹתֵיהֶם
  choice: उनके सेवा-कार्यों के अनुसार
  rationale: संज्ञा का अर्थ दायित्व, कार्यभार या नियत सेवा हो सकता है; यहाँ केवल पहरे के बजाय व्यापक लेवीय सेवा अभिप्रेत है।
- source_word: בְּמַחְלְקוֹתֵיהֶם
  choice: उनके दलों के अनुसार
  rationale: यह सेवा के लिए व्यवस्थित समूहों या वर्गों को दर्शाता है; ‘दल’ सामान्य पाठक के लिए स्पष्ट है।
