base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/011.yaml
  text: Then Hezekiah commanded them to prepare chambers in the house of Yahweh[b][a], and they prepared them.
translation:
  language: hi
  text: तब हिजकिय्याह ने याहवे के भवन में कोठरियाँ[a] तैयार करने की आज्ञा दी[b], और उन्होंने उन्हें तैयार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कमरे”; प्रसंग के अनुसार ये भंडार-कक्ष थे, पर मूल शब्द केवल कोठरियों या कमरों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “कहा कि ... तैयार करें”; यहाँ यह राजकीय निर्देश का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: आज्ञा दी
  rationale: क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर לְהָכִין के साथ यह राजा द्वारा दिया गया निर्देश व्यक्त करती है; इसलिए ‘आज्ञा दी’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: לְהָכִין
  choice: तैयार करने
  rationale: כון के हिफ़ील रूप का यहाँ अर्थ किसी वस्तु या स्थान को उपयोग के लिए तैयार करना है।
- source_word: לְשָׁכוֹת
  choice: कोठरियाँ
  rationale: यह शब्द भवन-समूह के भीतर के कमरों को दर्शाता है। ‘कोठरियाँ’ स्थापत्य अर्थ बनाए रखता है; भंडारण का उपयोग प्रसंग से समझ आता है, शब्द में स्वयं स्पष्ट नहीं है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ मूल ‘घर’ की मंदिर-संज्ञा को स्वाभाविक हिन्दी में बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: וַיָּכִינוּ
  choice: और उन्होंने उन्हें तैयार कर दिया
  rationale: बहुवचन क्रिया का अप्रकट कर्म पहले आई ‘कोठरियाँ’ है; हिन्दी में ‘उन्हें’ जोड़ना अर्थ स्पष्ट करता है, और ‘कर दिया’ कार्य की पूर्ति दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। ‘कोठरियाँ’ मंदिर-परिसर की स्थापत्य भाषा बनाए रखता है और पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
