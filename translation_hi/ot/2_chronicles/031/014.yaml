  text: וְ/קוֹרֵ֨א בֶן יִמְנָ֤ה הַ/לֵּוִי֙ הַ/שּׁוֹעֵ֣ר לַ/מִּזְרָ֔חָ/ה עַ֖ל נִדְב֣וֹת הָ/אֱלֹהִ֑ים לָ/תֵת֙ תְּרוּמַ֣ת יְהוָ֔ה וְ/קָדְשֵׁ֖י הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/014.yaml
  text: Kore son of Imnah[a], the Levite, the gatekeeper on the east, was in charge of the freewill offerings of God[b], to distribute the contribution of Yahweh and the most holy things.
translation:
  language: hi
  text: यिम्ना का पुत्र कोरे, लेवी और पूर्व की ओर का द्वारपाल, परमेश्वर को चढ़ाई गई स्वेच्छा-भेंटों का प्रभारी था, ताकि वह याहवे की भेंट और परमपवित्र वस्तुओं को वितरित करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ “देना” है; यहाँ प्रशासनिक संदर्भ में समर्पित वस्तुओं को उनके निर्धारित प्राप्तकर्ताओं में बाँटने का आशय है। “परमपवित्र वस्तुएँ” का अनुवाद “परमपवित्र भेंटें” भी हो सकता है। यह वाक्यांश विशेष रूप से पवित्र वस्तुओं को दर्शाता है, जरूरी नहीं कि मंदिर के भीतरी “परमपवित्र स्थान” को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקוֹרֵא בֶן יִמְנָה
  choice: यिम्ना का पुत्र कोरे
  rationale: व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; आरंभिक संयोजक को स्वाभाविक हिन्दी वाक्य-विन्यास में अलग से नहीं रखा गया।
- source_word: הַלֵּוִי
  choice: जो लेवी था
  rationale: निश्चित पद को कोरे की स्पष्ट सामुदायिक पहचान के रूप में रखा गया है।
- source_word: הַשּׁוֹעֵר לַמִּזְרָחָה
  choice: पूर्व दिशा में नियुक्त द्वारपाल
  rationale: שׁוֹעֵר मंदिर के प्रवेश-द्वार के अधिकारी को सूचित करता है; לַמִּזְרָחָה उसकी पूर्वी दिशा में नियुक्ति बताता है, यद्यपि इस पदांश में अलग से 'फाटक' शब्द नहीं है।
- source_word: עַל נִדְבוֹת הָאֱלֹהִים
  choice: परमेश्वर को चढ़ाए गए स्वेच्छा-दानों का अधिकारी
  rationale: עַל प्रशासनिक उत्तरदायित्व व्यक्त करता है और נִדְבוֹת स्वेच्छा से दिए गए दानों को। हिन्दी में संबंध का आशय स्पष्ट करने के लिए इन्हें परमेश्वर को चढ़ाए गए दान कहा गया है।
- source_word: לָתֵת
  choice: बाँटना … देना
  rationale: मूल क्रिया का शाब्दिक अर्थ 'देना' है; प्रशासनिक संदर्भ में इसका आशय निर्धारित वस्तुओं को प्राप्तकर्ताओं में बाँटना है। मुख्य क्रिया में 'बाँटना' संदर्भ स्पष्ट करता है और वाक्य के दूसरे संयुक्त कर्म के साथ 'देना' स्वाभाविक हिन्दी प्रवाह बनाए रखता है।
- source_word: תְּרוּמַת יְהוָה
  choice: याहवे को अर्पित भेंट
  rationale: תְּרוּמָה अलग रखी गई भेंट या अंशदान है। संबंध-रचना को संदर्भानुसार याहवे को समर्पित भेंट के रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले हिब्रू ईश्वरीय नाम का हिन्दी में निकट लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וְקָדְשֵׁי הַקֳּדָשִׁים
  choice: और परमपवित्र वस्तुएँ
  rationale: यह हिब्रू संबंध-वाक्यांश अत्यधिक पवित्र वस्तुओं या अर्पणों को दर्शाता है; यहाँ इसका अर्थ मंदिर का भीतरी 'परमपवित्र स्थान' नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। 'याहवे' उसका आधुनिक विद्वतापरक उच्चारण दर्शाने वाला हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: וְקָדְשֵׁי הַקֳּדָשִׁים का संदर्भ
  choice: परमपवित्र वस्तुएँ
  alternative: परमपवित्र भेंटें; परमपवित्र स्थान
  rationale: बहुवचन और वितरण के संदर्भ में यह वाक्यांश पवित्र वस्तुओं या भेंटों की ओर संकेत करता है, भवन के भीतरी कक्ष की ओर नहीं; 'वस्तुएँ' मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रशासनिक आशय स्पष्ट करने के लिए एक लंबे हिब्रू वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। 'स्वेच्छा-दान', 'द्वारपाल' और 'परमपवित्र' जैसे परिचित धार्मिक शब्द मूल के सांस्कृतिक संदर्भ को बनाए रखते हैं।
