id: 2CH.31.5
reference: 2 Chronicles 31:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִ/פְרֹ֣ץ הַ/דָּבָ֗ר הִרְבּ֤וּ בְנֵֽי יִשְׂרָאֵל֙ רֵאשִׁ֣ית דָּגָ֗ן תִּיר֤וֹשׁ וְ/יִצְהָר֙ וּ/דְבַ֔שׁ וְ/כֹ֖ל תְּבוּאַ֣ת שָׂדֶ֑ה וּ/מַעְשַׂ֥ר הַ/כֹּ֛ל לָ/רֹ֖ב הֵבִֽיאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/005.yaml
  text: And when the matter spread[a], the sons of Israel brought in abundance the firstfruits of grain, new wine, oil, honey, and all the produce of the field[b]; they brought in abundantly the tithe of everything.
translation:
  language: hi
  text: जैसे ही यह बात फैली, इस्राएल के पुत्रों[a] ने अनाज, नए दाखरस, तेल, मधु[b] और खेत की सारी उपज का पहला अंश बहुतायत से दिया; और वे हर चीज़ का दशमांश भी बहुतायत से लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “इस्राएली” या “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है, जो इस्राएल की प्रजा के लिए प्रयुक्त एक सामान्य सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “मधु” कुछ संदर्भों में केवल मधुमक्खी का शहद नहीं, बल्कि खजूर आदि का मीठा गाढ़ा रस भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִ/פְרֹץ הַ/דָּבָר
  choice: जैसे ही यह बात फैली
  rationale: כי के साथ פרץ का infinitive construct यहाँ समय का भाव देता है। ‘फैली’ बात के तेजी से प्रचलित होने का स्वाभाविक हिन्दी रूप है, जबकि ‘यह बात’ דבר की व्यापकता बनाए रखता है।
- source_word: הִרְבּוּ
  choice: बहुतायत से दिया
  rationale: רבה के हिफ़ील रूप में मात्रा बढ़ाने या बहुत करने का भाव है। प्रसंग में लोग उपज का पहला अंश अर्पित कर रहे हैं, इसलिए हिन्दी में क्रिया को स्पष्ट करते हुए मात्रा पर बल रखा गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी के औपचारिक सामूहिक पदबंध को मुख्य पाठ में बनाए रखा गया है; यहाँ इसका आशय इस्राएली लोगों से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: רֵאשִׁית
  choice: पहला अंश
  rationale: अर्पण के संदर्भ में यह उपज से परमेश्वर के लिए अलग किए गए आरंभिक भाग को दर्शाता है। ‘पहला अंश’ सूची की सभी वस्तुओं पर स्वाभाविक रूप से लागू होता है।
- source_word: דָּגָן
  choice: अनाज
  rationale: यह सामान्य रूप से अन्न या धान्य की उपज का सूचक है; आधुनिक हिन्दी में ‘अनाज’ स्पष्ट और स्वाभाविक है।
- source_word: תִּירוֹשׁ
  choice: नया दाखरस
  rationale: यह शब्द सामान्यतः नई या ताज़ी दाख-उपज के रस/मदिरा को दर्शाता है। ‘नया दाखरस’ कृषि-संबंधी विशेषता को बनाए रखता है।
- source_word: יִצְהָר
  choice: तेल
  rationale: शब्द प्रायः जैतून के ताज़े तेल के लिए आता है, पर मूल पाठ में जैतून स्पष्ट नहीं है; इसलिए व्यापक ‘तेल’ रखा गया है।
- source_word: דְבַשׁ
  choice: मधु
  rationale: इब्रानी शब्द मधुमक्खी के शहद या खजूर जैसे फलों के मीठे गाढ़े रस को दर्शा सकता है। मुख्य पाठ में व्यापक पारंपरिक शब्द रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְ/כֹל תְּבוּאַת שָׂדֶה
  choice: और खेत की सारी उपज
  rationale: תבואה खेत से प्राप्त उपज या पैदावार है। यह रूप कृषि-संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וּ/מַעְשַׂר הַ/כֹּל
  choice: हर चीज़ का दशमांश
  rationale: מעשר धार्मिक-अर्पण के रूप में दिए जाने वाले दसवें भाग का तकनीकी पद है; ‘दशमांश’ उसी अर्थ को संक्षेप में व्यक्त करता है।
- source_word: לָ/רֹב
  choice: बहुतायत से
  rationale: यह वाक्यांश बड़ी मात्रा पर बल देता है; ‘बहुतायत से’ उस जोर को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का लिंगसूचक सामूहिक पदबंध
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल के लोगों
  rationale: मुख्य पाठ में इब्रानी की औपचारिक अभिव्यक्ति सुरक्षित रखी गई है, पर इसे केवल पुरुषों तक सीमित न समझा जाए इसलिए पादटिप्पणी में सामूहिक आशय बताया गया है।
- issue: רֵאשִׁית का अर्पण-संबंधी अर्थ
  choice: पहला अंश
  alternative: पहली उपज / पहले फल
  rationale: यहाँ शब्द सूचीबद्ध कृषि-उत्पादों से आरंभ में अलग किए गए अर्पण को सूचित करता है। ‘पहला अंश’ किसी एक प्रकार की फसल तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण ऐतिहासिक-वर्णन शैली रखी गई है। ‘दाखरस’, ‘पहला अंश’ और ‘दशमांश’ कृषि तथा अर्पण-संबंधी शब्दावली को सामान्य पाठक के लिए स्पष्ट रखते हैं। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद लगाए गए हैं जिनकी वे व्याख्या करते हैं।
