- source_word: עַל הָעֲרֵמוֹת
  choice: उन ढेरों के विषय में
  rationale: עַל यहाँ पूछने के विषय को दर्शाता है; निश्चित उपपद ה को पूर्व-संदर्भित ढेरों के लिए ‘उन’ से व्यक्त किया गया है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों से
  rationale: पूछने की क्रिया के संबोधित व्यक्तियों को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
