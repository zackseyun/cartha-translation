source:
  edition: WLC
  text: וּ/מְנָת֩ הַ/מֶּ֨לֶךְ מִן רְכוּשׁ֜/וֹ לָ/עֹל֗וֹת לְ/עֹלוֹת֙ הַ/בֹּ֣קֶר וְ/הָ/עֶ֔רֶב וְ/הָ֣/עֹל֔וֹת לַ/שַּׁבָּת֖וֹת וְ/לֶ/חֳדָשִׁ֣ים וְ/לַ/מֹּעֲדִ֑ים כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/003.yaml
  text: 'The king’s portion from his own possessions was for the burnt offerings: the burnt offerings of the morning and the evening[a], and the burnt offerings for the Sabbaths, the new moons, and the appointed feasts[e][d][c][b], as it is written in the Law of Yahweh.'
translation:
  language: hi
  text: 'राजा की अपनी संपत्ति में से होमबलियों के लिए एक भाग था: सुबह और शाम की होमबलियों के लिए, और सब्तों, नए चाँद के अवसरों[a] और नियत पर्वों[b] की होमबलियों के लिए—जैसा कि यहोवा की व्यवस्था[c] में लिखा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नए चाँद के अवसर” इस्राएल के उपासना-पंचांग में हर महीने नवचंद्र पर किए जाने वाले अनुष्ठानों को कहते हैं।
    reason: cultural_note
  - marker: b
    text: या “नियत समयों” अथवा “नियत त्योहारों।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “यहोवा की तोराह”; “यहोवा की शिक्षा” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְנָת הַמֶּלֶךְ מִן רְכוּשׁוֹ
  choice: राजा ने अपनी संपत्ति में से ... अपना भाग ठहराया था
  rationale: מְנָה किसी निर्धारित हिस्से या आवंटन को और רְכוּשׁ संपत्ति को दर्शाता है। हिंदी में क्रियात्मक रूप वाक्य को स्वाभाविक बनाते हुए यह स्पष्ट करता है कि यह राजा की निजी संपत्ति से निर्धारित योगदान था।
- source_word: לָעֹלוֹת
  choice: होमबलियों के लिए
  rationale: עֹלָה पूरी तरह जलाई जाने वाली बलि का प्रचलित इब्रानी पद है; हिंदी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त और सटीक है।
- source_word: לְעֹלוֹת הַבֹּקֶר וְהָעֶרֶב
  choice: सुबह और शाम की होमबलियों के लिए
  rationale: यह अनुवाद दोनों दैनिक बलियों को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַשַּׁבָּתוֹת וְלֶחֳדָשִׁים וְלַמֹּעֲדִים
  choice: सब्तों, नए चाँद के दिनों और नियत पर्वों की
  rationale: שַׁבָּתוֹת बहुवचन सब्तों को, חֳדָשִׁים इस उपासना-संदर्भ में मासिक नवचंद्र अनुष्ठानों को, और מוֹעֲדִים निर्धारित धार्मिक अवसरों या पर्वों को दर्शाता है।
- source_word: כַּכָּתוּב
  choice: जैसा ... लिखा है
  rationale: यह धर्मग्रंथ में लिखे विधान के अनुरूप होने का परिचित सूत्र है।
- source_word: בְּתוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था में
  rationale: इस विधिक-उपासना संदर्भ में תּוֹרָה लिखित व्यवस्था या शिक्षा को सूचित करती है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिंदी में पहचाना जाने वाला नामरूप है और ‘प्रभु’ जैसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
- issue: תּוֹרָה का संदर्भगत अर्थ
  choice: व्यवस्था
  alternative: शिक्षा / तोराह
  rationale: यहाँ बलियों के निर्धारित विधान का उल्लेख है, इसलिए ‘व्यवस्था’ संदर्भ के अनुकूल है; फिर भी पद का मूल अर्थ व्यापक रूप से ‘शिक्षा’ हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘होमबलि’, ‘सब्त’ और ‘व्यवस्था’ जैसे परिचित धर्मग्रंथीय पद संदर्भगत सटीकता के लिए बनाए रखे गए हैं। मुख्य वाक्य में इब्रानी की पुनरावृत्ति को संरक्षित करते हुए हिंदी में स्वाभाविक क्रियात्मक आरंभ अपनाया गया है।
