  text: וּ/בְנֵ֧י יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה הַ/יּֽוֹשְׁבִים֮ בְּ/עָרֵ֣י יְהוּדָה֒ גַּם הֵ֗ם מַעְשַׂ֤ר בָּקָר֙ וָ/צֹ֔אן וּ/מַעְשַׂ֣ר קָֽדָשִׁ֔ים הַ/מְקֻדָּשִׁ֖ים לַ/יהוָ֣ה אֱלֹהֵי/הֶ֑ם הֵבִ֕יאוּ וַֽ/יִּתְּנ֖וּ עֲרֵמ֥וֹת עֲרֵמֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/006.yaml
  text: And the people of Israel and Judah who lived in the cities of Judah also brought the tithe of cattle and sheep[a], and the tithe of the holy things consecrated to Yahweh their God, and they laid them in heaps[b], heap upon heap.
translation:
  language: hi
  text: और इस्राएल और यहूदा के जो लोग यहूदा के नगरों में रहते थे, वे भी गाय-बैलों और भेड़-बकरियों का दशमांश तथा उन पवित्र वस्तुओं[a] का दशमांश लाए, जो उनके परमेश्वर याहवे के लिए पवित्र ठहराई गई थीं; और उन्होंने उन्हें ढेर-के-ढेर लगा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र भेंटों का दशमांश” अथवा “समर्पित वस्तुओं का दशमांश।” इब्रानी शब्द उन वस्तुओं को सूचित करता है जिन्हें परमेश्वर के लिए पवित्र ठहराया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा के ... लोग
  rationale: בני का शाब्दिक अर्थ ‘पुत्र/सन्तान’ है, पर यहाँ वह पूरे समुदाय को सूचित करता है; ‘लोग’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה
  choice: जो यहूदा के नगरों में रहते थे
  rationale: ישב का कृदन्त यहाँ स्थायी निवास का भाव देता है; ‘नगरों में रहते थे’ स्पष्ट और सहज है।
- source_word: גַּם הֵם
  choice: वे भी
  rationale: यह पद बल देता है कि यहूदा के नगरों में रहने वाले इन लोगों ने भी योगदान दिया।
- source_word: מַעְשַׂר
  choice: दशमांश
  rationale: यह परमेश्वर को दिए जाने वाले दसवें भाग का मानक धार्मिक शब्द है।
- source_word: בָּקָר וָצֹאן
  choice: गाय-बैलों और भेड़-बकरियों
  rationale: בקר बड़े पालतू पशुओं और צאן छोटे झुंड-पशुओं—मुख्यतः भेड़ और बकरियों—को सूचित करता है; यह अनुवाद दोनों वर्गों को स्पष्ट करता है।
- source_word: וּמַעְשַׂר קָדָשִׁים
  choice: पवित्र वस्तुओं का दशमांश
  rationale: קדשים ऐसी वस्तुओं या भेंटों को सूचित करता है जो पवित्र रूप से अलग की गई थीं; मूल की व्यापकता बनाए रखने के लिए ‘पवित्र वस्तुएँ’ रखा गया है।
- source_word: הַמְקֻדָּשִׁים לַיהוָה אֱלֹהֵיהֶם
  choice: जो उनके परमेश्वर याहवे के लिए पवित्र ठहराई गई थीं
  rationale: קדש का होफाल कृदन्त उन वस्तुओं के पवित्र घोषित या समर्पित किए जाने का भाव देता है; स्त्रीलिंग बहुवचन हिन्दी में ‘वस्तुओं’ के अनुसार है।
- source_word: הֵבִיאוּ
  choice: लाए
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘लाना’ है और यहाँ भेंटों को संग्रह-स्थान तक लाना अभिप्रेत है।
- source_word: וַיִּתְּנוּ עֲרֵמוֹת עֲרֵמוֹת
  choice: उन्होंने उन्हें ढेर-के-ढेर लगा दिया
  rationale: נתן यहाँ रखने/लगाने के अर्थ में है और ערמות की पुनरावृत्ति अनेक ढेरों पर बल देती है; ‘ढेर-के-ढेर’ उसी बल को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का निजी नाम יהוה है; ‘याहवे’ उसे उपाधि में बदले बिना प्रत्यक्ष रूप से प्रस्तुत करता है।
- issue: קָדָשִׁים की वस्तुओं का सटीक स्वरूप
  choice: पवित्र वस्तुएँ
  alternative: पवित्र भेंटें; समर्पित वस्तुएँ
  rationale: पद यह निश्चित नहीं करता कि ये केवल भेंटें थीं या व्यापक रूप से पवित्र ठहराई गई वस्तुएँ; इसलिए अधिक विशिष्ट अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘गाय-बैल’ और ‘भेड़-बकरियाँ’ पशुओं की दोनों इब्रानी श्रेणियों को स्पष्ट करते हैं। पुनरुक्ति ‘ढेर-के-ढेर’ मूल की बलात्मक शैली को हिन्दी में बनाए रखती है।
