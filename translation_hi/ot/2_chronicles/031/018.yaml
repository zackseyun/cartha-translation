source:
  edition: WLC
  text: וּ/לְ/הִתְיַחֵ֗שׂ בְּ/כָל טַפָּ֧/ם נְשֵׁי/הֶ֛ם וּ/בְנֵי/הֶ֥ם וּ/בְנוֹתֵי/הֶ֖ם לְ/כָל קָהָ֑ל כִּ֥י בֶ/אֱמוּנָתָ֖/ם יִתְקַדְּשׁוּ קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/018.yaml
  text: and for the enrollment of all their little ones[a], their wives, their sons, and their daughters, for all the assembly[c][b]; for in their faithfulness they consecrated themselves as holy.
translation:
  language: hi
  text: और पूरी सभा में उनके सभी छोटे बच्चों, उनकी पत्नियों, उनके बेटों और उनकी बेटियों का भी वंशावली के अनुसार पंजीकरण किया गया; क्योंकि वे विश्वासयोग्यता के साथ अपने को पवित्र करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְהִתְיַחֵשׂ
  choice: का भी वंशावली में पंजीकरण हुआ
  rationale: हित्पएल क्रिया इतिहास-वृत्तांत में परिवार या वंश के अनुसार अभिलेख में दर्ज किए जाने को बताती है। हिन्दी में यह प्रशासनिक और वंशावली-संबंधी अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּכָל טַפָּם
  choice: उनके सभी छोटे बच्चों
  rationale: טַף विशेष रूप से छोटे बच्चों को सूचित करता है; केवल ‘बच्चों’ कहने की अपेक्षा यह मूल की विशिष्टता बनाए रखता है।
- source_word: נְשֵׁיהֶם וּבְנֵיהֶם וּבְנוֹתֵיהֶם
  choice: उनकी पत्नियों, उनके बेटों और उनकी बेटियों
  rationale: घरेलू सूची में נָשִׁים का अर्थ ‘पत्नियाँ’ है, और मूल में बेटों तथा बेटियों का अलग-अलग उल्लेख सुरक्षित रखा गया है।
- source_word: לְכָל קָהָל
  choice: पूरी सभा में
  rationale: यह पद पंजीकरण के सामुदायिक विस्तार को दर्शाता है। प्रसंग के अनुसार हिन्दी में ‘पूरी सभा में’ स्वाभाविक है, जबकि शाब्दिक ‘पूरी सभा के लिए’ लाभार्थी का भ्रामक भाव दे सकता है।
- source_word: בֶאֱמוּנָתָם
  choice: विश्वासयोग्यता से
  rationale: यहाँ אֱמוּנָה पवित्र दायित्व निभाने में निष्ठा और भरोसेमंदी को सूचित करती है, मुख्यतः मन के भीतर के विश्वास को नहीं।
- source_word: יִתְקַדְּשׁוּ קֹדֶשׁ
  choice: अपने को पवित्र रखते थे
  rationale: हित्पएल रूप आत्म-संबंधी पवित्रीकरण बताता है और संज्ञा קֹדֶשׁ उसी भाव पर बल देती है। मुख्य पाठ में सहज हिन्दी रखी गई है और दोहरे पवित्रता-भाव को पाद-टिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पवित्र-प्रशासनिक प्रसंग में אֱמוּנָה का अर्थ
  choice: पवित्र दायित्वों में विश्वासयोग्यता या निष्ठा
  alternative: भीतरी या भक्तिपरक विश्वास
  rationale: आसपास का प्रसंग याजकीय और लेवीय वितरण तथा पवित्र सेवा की व्यवस्था से संबंधित है; इसलिए यहाँ भरोसेमंद निष्ठा अधिक उपयुक्त है।
- issue: יִתְקַדְּשׁוּ קֹדֶשׁ में पवित्रता की पुनरुक्ति
  choice: मुख्य पाठ में ‘अपने को पवित्र रखते थे,’ और पाद-टिप्पणी में बलाघात स्पष्ट
  alternative: ‘पवित्रता में अपने को पवित्र करते थे’ या ‘अपने को पवित्र ठहराते थे’
  rationale: मूल के बल को पूरी तरह मिटाए बिना मुख्य वाक्य को आधुनिक हिन्दी में स्वाभाविक रखा गया है; पुनरुक्ति की व्याख्या पाठक के लिए पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। ‘वंशावली में पंजीकरण’ प्रशासनिक अर्थ को स्पष्ट करता है; ‘बेटों और बेटियों’ से मूल की लैंगिक विशिष्टता बनी रहती है।
