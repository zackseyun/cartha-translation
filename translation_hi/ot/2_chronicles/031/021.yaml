  text: וּ/בְ/כָֽל מַעֲשֶׂ֞ה אֲשֶׁר הֵחֵ֣ל בַּ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים וּ/בַ/תּוֹרָה֙ וּ/בַ/מִּצְוָ֔ה לִ/דְרֹ֖שׁ לֵֽ/אלֹהָ֑י/ו בְּ/כָל לְבָב֥/וֹ עָשָׂ֖ה וְ/הִצְלִֽיחַ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/021.yaml
  text: And in every work that he began in the service of the house of God[a], and in the law and the commandment, seeking his God with all his heart[c][b], he did and prospered.
translation:
  language: hi
  text: और परमेश्वर के भवन की सेवा में, व्यवस्था[a] और आज्ञा में, उसने जो भी काम आरम्भ किया, उसे अपने परमेश्वर की खोज करने के लिए उसने पूरे मन से किया और सफलता पाई।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा”; इब्रानी शब्द तोराह का अर्थ व्यवस्था या शिक्षा हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “वह समृद्ध हुआ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל מַעֲשֶׂה אֲשֶׁר הֵחֵל
  choice: उसने जो भी काम आरम्भ किया
  rationale: מַעֲשֶׂה के व्यापक अर्थ ‘काम/कार्य’ और הֵחֵל के सामान्य अर्थ ‘आरम्भ किया’ को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: בַּעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन की सेवा
  rationale: עֲבוֹדָה यहाँ भवन से जुड़ी सेवा और उपासना-संबंधी कार्य, दोनों को समेटता है; ‘सेवा’ इसे केवल निर्माण-कार्य या याजकीय अनुष्ठान तक सीमित नहीं करता।
- source_word: וּבַתּוֹרָה
  choice: व्यवस्था
  rationale: राजकीय सुधार के इस प्रसंग में תּוֹרָה परमेश्वर की वाचा-संबंधी व्यवस्था की ओर संकेत करती है। व्यापक अर्थ ‘शिक्षा’ को पादटिप्पणी में रखा गया है।
- source_word: וּבַמִּצְוָה
  choice: और आज्ञा
  rationale: מִצְוָה के एकवचन रूप को बनाए रखा गया है; यहाँ यह सामूहिक अर्थ भी दे सकता है।
- source_word: לִדְרֹשׁ לֵאלֹהָיו
  choice: अपने परमेश्वर को खोजने के लिए
  rationale: דּרשׁ इतिहास-वृत्तांत में परमेश्वर की ओर निष्ठापूर्वक मुड़ने और उसे खोजने का प्रमुख भाव रखता है, पर ‘उससे पूछना/परामर्श लेना’ भी सम्भव है।
- source_word: בְּכָל לְבָבוֹ
  choice: पूरे मन से
  rationale: यह स्वाभाविक हिन्दी मुहावरा सम्पूर्ण आन्तरिक निष्ठा व्यक्त करता है।
- source_word: עָשָׂה וְהִצְלִיחַ
  choice: करता रहा और सफल हुआ
  rationale: עָשָׂה का सरल क्रियात्मक भाव और הצליח का सफल होने का परिणाम रखा गया है। प्रसंग के समाहारात्मक स्वर को व्यक्त करने के लिए हिन्दी में ‘करता रहा’ प्रयुक्त है।
theological_decisions:
- issue: תּוֹרָה का अर्थ
  choice: मुख्य पाठ में ‘व्यवस्था’
  alternative: ‘शिक्षा’
  rationale: हिजकिय्याह के सुधारों का प्रसंग विधि और वाचा-संबंधी आज्ञाकारिता को प्रमुख बनाता है, फिर भी शब्द के व्यापक शिक्षात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לִדְרֹשׁ לֵאלֹהָיו का भाव
  choice: ‘अपने परमेश्वर को खोजना’
  alternative: ‘अपने परमेश्वर से पूछना/परामर्श लेना’
  rationale: इतिहास-वृत्तांत में यह पद प्रायः भक्तिपूर्ण और वाचा-संबंधी खोज व्यक्त करता है, लेकिन पूछने या परामर्श लेने का अर्थ भी वास्तविक है और पादटिप्पणी में दिया गया है।
- issue: בְּכָל לְבָבוֹ का संबंध
  choice: मुख्य पाठ में उसके काम करने से जोड़ा गया
  alternative: इसे परमेश्वर को खोजने से जोड़ना
  rationale: इब्रानी शब्दक्रम और वाक्य-विन्यास ‘पूरे मन से किया’ को बल देते हैं, यद्यपि अर्थ की दृष्टि से यह परमेश्वर को खोजने की रीति को भी वर्णित कर सकता है; अनुवाद इस निष्ठा को किसी संकीर्ण सिद्धान्त में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर का भवन’, ‘व्यवस्था’ और ‘आज्ञा’ जैसे परिचित बाइबिलीय पद बनाए गए हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
