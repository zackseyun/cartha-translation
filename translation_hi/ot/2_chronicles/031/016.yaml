  text: מִ/לְּ/בַ֞ד הִתְיַחְשָׂ֣/ם לִ/זְכָרִ֗ים מִ/בֶּ֨ן שָׁל֤וֹשׁ שָׁנִים֙ וּ/לְ/מַ֔עְלָ/ה לְ/כָל הַ/בָּ֥א לְ/בֵית יְהוָ֖ה לִ/דְבַר י֣וֹם בְּ/יוֹמ֑/וֹ לַ/עֲב֣וֹדָתָ֔/ם בְּ/מִשְׁמְרוֹתָ֖/ם כְּ/מַחְלְקוֹתֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/016.yaml
  text: apart from those enrolled by genealogy among the males from three years old and upward[a], all who entered the house of Yahweh, as the daily matter required[c][b], for their service in their duties according to their divisions.
translation:
  language: hi
  text: तीन वर्ष या उससे अधिक आयु के वंशावली में दर्ज पुरुषों[a] के अतिरिक्त, यहोवा के भवन में आनेवाले सभी को, उसके दिन की आवश्यकता के अनुसार[b], उनकी सेवा के लिए, उनकी सेवा-पालियों[c] में, उनके विभागों के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरुषों की वंशावली के अनुसार पंजीकरण-सूची।”
    reason: इब्रानी पद का अर्थ वंशावली के आधार पर किया गया प्रशासनिक पंजीकरण भी हो सकता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “हर दिन की बात उसके दिन में,” अर्थात प्रत्येक दिन की आवश्यकता के अनुसार।
    reason: मूल मुहावरे का शाब्दिक रूप और उसका प्रशासनिक आशय दिखाने के लिए।
  - marker: c
    text: या, “अपनी पहरेदारियों में” अथवा “अपनी निर्धारित जिम्मेदारियों में।”
    reason: मִשְׁמְרוֹתָם का अर्थ सेवा-पाली, पहरा, अथवा सौंपी हुई जिम्मेदारी हो सकता है।
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पहले उल्लिखित वितरण-समूह से अलग एक अतिरिक्त श्रेणी प्रस्तुत करता है; हिन्दी में यह पृथकता और संबंध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִתְיַחְשָׂם לִזְכָרִים
  choice: पुरुषों में वंशावली के अनुसार दर्ज लोगों
  rationale: हित्पाएल रूप प्रशासनिक वंशावली-पंजीकरण को दर्शाता है, और לִזְכָרִים पुरुष सदस्यों का स्पष्ट उल्लेख करता है।
- source_word: מִבֶּן שָׁלֹשׁ שָׁנִים וּלְמַעְלָה
  choice: तीन वर्ष और उससे अधिक आयु के
  rationale: आयु-सीमा का आधुनिक और स्पष्ट हिन्दी रूप।
- source_word: לְכָל הַבָּא לְבֵית יְהוָה
  choice: वे सभी जो यहोवा के भवन में आते थे
  rationale: सामूहिक कृदन्त का सामान्य/आवर्ती अर्थ रखा गया है; בית का औपचारिक रूप 'भवन' और יְהוָה का नाम 'यहोवा' रखा गया है।
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: प्रतिदिन की आवश्यकता के अनुसार
  rationale: शाब्दिक 'हर दिन की बात उसके दिन में' का प्रशासनिक आशय, अर्थात हर दिन की अपेक्षित सेवा, सुबोध हिन्दी में व्यक्त होता है।
- source_word: לַעֲבוֹדָתָם
  choice: काम करने के लिए
  rationale: मन्दिर-संदर्भ की सेवा/कार्य का प्रयोजन स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना बाद की कलीसियाई शब्दावली जोड़े।
- source_word: בְּמִשְׁמְרוֹתָם
  choice: अपनी निर्धारित सेवाओं में
  rationale: यह शब्द सौंपी गई पहरेदारी, जिम्मेदारी या सेवा-पाली को सूचित कर सकता है; मुख्य पाठ में व्यापक कार्यात्मक अर्थ रखा गया है।
- source_word: כְּמַחְלְקוֹתֵיהֶם
  choice: अपने-अपने दलों के मुताबिक
  rationale: याजकीय/लेवीय संगठित विभागों का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: मन्दिर-सेवकों के लिए लिंग-विशिष्ट भाषा
  choice: पुरुषों में
  alternative: लोगों में / उनमें
  rationale: मूल इब्रानी זְכָרִים स्पष्ट रूप से पुरुषों को निर्दिष्ट करता है; इसे लिंग-निरपेक्ष करना स्रोत की सूचना मिटा देता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण 'यहोवा' से रखा गया है।
- issue: तीन वर्ष की आयु से पंजीकरण और वास्तविक सेवा का संबंध
  choice: पंजीकृत लोगों और प्रतिदिन भवन में सेवा के लिए आने वालों के बीच मूल वाक्य का संबंध बनाए रखा
  alternative: तीन वर्ष के बालकों को स्वयं सक्रिय मन्दिर-सेवक बताना
  rationale: इब्रानी वाक्य की संरचना कठिन है और संदर्भ वितरण/पंजीकरण से जुड़ा है; अनुवाद उस तनाव को किसी निश्चित व्याख्या से पूरी तरह नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सुबोध शैली। वाक्य की प्रशासनिक और मन्दिर-सेवा संबंधी शब्दावली रखी गई है। स्रोत की कठिन वाक्य-संरचना को पूर्णतः समतल किए बिना हिन्दी में पठनीय बनाया गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
