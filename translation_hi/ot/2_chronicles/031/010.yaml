base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/010.yaml
  text: Azariah the chief priest[a], of the house of Zadok, said to him, “Since they began bringing the contribution into the house of Yahweh, we have eaten and been satisfied and have had plenty left over, for Yahweh has blessed his people; and what is left is this great abundance.”
translation:
  language: hi
  text: सादोक के घराने के प्रधान याजक अजर्याह ने उससे कहा, “जब से लोगों ने याहवे के भवन में पवित्र अंश[a] लाना शुरू किया है, तब से हमने पेट भर खाया है और बहुतायत में बचा है; क्योंकि याहवे ने अपनी प्रजा को आशीष दी है। और जो बचा है, वह यह बड़ा भंडार है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेंट”; इब्रानी शब्द उस अंश या योगदान को दर्शाता है जिसे पवित्र उपयोग के लिए अलग किया गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: प्रधान याजक
  rationale: यह पदबंध अजर्याह की प्रमुख याजकीय भूमिका बताता है। ‘प्रधान याजक’ स्वाभाविक हिन्दी है और ‘महायाजक’ जैसे अधिक तकनीकी पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: לְבֵית צָדוֹק
  choice: सादोक के घराने के
  rationale: यह पदबंध सादोक के याजकीय वंश अथवा घराने से संबंध व्यक्त करता है।
- source_word: מֵהָחֵל
  choice: जब से ... शुरू किया है
  rationale: מן के साथ क्रिया का यह रूप कार्य के आरंभ-बिंदु से अब तक का समय व्यक्त करता है।
- source_word: הַתְּרוּמָה
  choice: पवित्र अंश
  rationale: תְּרוּמָה उस अंश या योगदान को दर्शाता है जो पवित्र उपयोग के लिए अलग करके दिया जाता था। ‘पवित्र अंश’ इस धार्मिक उद्देश्य को स्पष्ट रखता है; ‘भेंट’ भी संभव है।
- source_word: לָבִיא בֵית יְהוָה
  choice: याहवे के भवन में ... लाना
  rationale: בוא का कारक भाव योगदान को मंदिर के भीतर अथवा उसके परिसर में लाए जाने की दिशा बताता है।
- source_word: אָכוֹל וְשָׂבוֹעַ
  choice: हम खाते आए हैं और तृप्त हुए हैं
  rationale: दोनों रूप पर्याप्त भोजन और तृप्ति का परिणाम बताते हैं। वक्ता के सामूहिक दृष्टिकोण के कारण हिन्दी में ‘हम’ स्पष्ट किया गया है।
- source_word: וְהוֹתֵר עַד לָרֹב
  choice: फिर भी बहुतायत में बचा है
  rationale: יתר और עַד לָרֹב मिलकर अत्यधिक मात्रा में शेष रहने का भाव देते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בֵּרַךְ אֶת עַמּוֹ
  choice: अपनी प्रजा को आशीष दी है
  rationale: पूर्ण क्रिया वर्तमान में दिखाई दे रही बहुतायत का कारण बताती है। ‘प्रजा’ सामूहिक वाचा-समुदाय के लिए स्वाभाविक है।
- source_word: וְהַנּוֹתָר אֶת הֶהָמוֹן הַזֶּה
  choice: जो बचा है, वह यह बड़ा भंडार है
  rationale: הַנּוֹתָר संज्ञात्मक रूप में ‘जो बचा है’ और הָמוֹן इस संदर्भ में सामग्री की बड़ी मात्रा बताता है। ‘भंडार’ दृश्यतः संचित अधिशेष को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि का भेद बनाए रखता है।
- issue: הַכֹּהֵן הָרֹאשׁ को तकनीकी उपाधि मानना
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: मूल पदबंध शाब्दिक रूप से प्रमुख अथवा प्रधान याजक कहता है; ‘प्रधान याजक’ नेतृत्व का भाव सुरक्षित रखता है, बिना बाद की अधिक निश्चित तकनीकी उपाधि थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मंदिर के लिए ‘याहवे का भवन’, वंश-संबंध के लिए ‘घराना’, और संचित अधिशेष के लिए ‘भंडार’ चुना गया है। फुटनोट चिह्न संबंधित शब्द ‘पवित्र अंश’ के तुरंत बाद रखा गया है।
