base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/019.yaml
  text: And for the sons of Aaron[a], the priests, in the pasture lands of their cities, in every city[e][d][c][b], there were men designated by name to give portions to every male among the priests and to everyone enrolled by genealogy among the Levites.
translation:
  language: hi
  text: और हारून के याजक वंशजों[a] के लिए भी—उनके नगरों के चारागाहों[b] में, हर एक नगर में[c]—कुछ पुरुष नाम से नियुक्त किए गए थे[d], ताकि वे याजकों में से हर पुरुष को और लेवियों में से वंशावली में दर्ज हर व्यक्ति[e] को हिस्से दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘हारून के पुत्रों’; यहाँ यह वंशावली-संबंधी अभिव्यक्ति हारून के बाद के वंशजों को भी समेटती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके नगरों की खुली सामुदायिक भूमि में’। यह नगरों के आसपास की भूमि थी, जिसका उपयोग प्रायः पशु चराने के लिए किया जाता था।
    reason: cultural_note
  - marker: c
    text: हिब्रू में ‘हर नगर और नगर’, अर्थात् ‘प्रत्येक नगर’।
    reason: lexical_alternative
  - marker: d
    text: या ‘नाम से दर्ज किए गए थे’ अथवा ‘नाम लेकर निर्धारित किए गए थे’। हिब्रू औपचारिक रूप से नाम द्वारा पहचान किए जाने का संकेत देता है।
    reason: lexical_alternative
  - marker: e
    text: अर्थात् उन्हें वंशावली के अभिलेखों में लेवियों के रूप में दर्ज किया गया था।
    reason: cultural_note
lexical_decisions:
- source_word: וְלִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के वंशजों, अर्थात् याजकों, के लिए भी
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर वंश-संबंधी संदर्भ में यह बाद की पीढ़ियों के वंशजों को भी समेटता है। ‘अर्थात् याजकों’ से हिब्रू के समानाधिकरण को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: בִּשְׂדֵי מִגְרַשׁ עָרֵיהֶם
  choice: उनके नगरों के चारागाहों में
  rationale: מגרש नगर के आसपास की खुली या सामुदायिक भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था; ‘चारागाह’ इस संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: בְּכָל עִיר וָעִיר
  choice: हर एक नगर में
  rationale: ‘नगर और नगर’ की हिब्रू पुनरुक्ति वितरणात्मक और व्यापक अर्थ देती है। ‘हर एक नगर’ उस बल को सहज हिन्दी में बनाए रखता है।
- source_word: אֲנָשִׁים אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: कुछ पुरुष नाम लेकर नियुक्त किए गए थे
  rationale: वाक्यांश औपचारिक रूप से नाम द्वारा पहचाने या निर्धारित किए जाने का संकेत देता है। ‘नाम लेकर नियुक्त’ प्रशासनिक भूमिका के संदर्भ में स्वाभाविक है, जबकि पादटिप्पणी ‘नाम से दर्ज’ की सम्भावना सुरक्षित रखती है।
- source_word: לָתֵת מָנוֹת
  choice: हिस्से दें
  rationale: מָנוֹת वितरित की जाने वाली सामग्री के भाग या हिस्से हैं। ‘हिस्से दें’ स्पष्ट और प्रसंगानुकूल है।
- source_word: לְכָל זָכָר בַּכֹּהֲנִים
  choice: याजकों में से हर पुरुष को
  rationale: זכר पुरुष लिंग को स्पष्ट रूप से व्यक्त करता है; ‘हर पुरुष’ इस विशिष्टता को बनाए रखता है।
- source_word: וּלְכָל הִתְיַחֵשׂ בַּלְוִיִּם
  choice: लेवियों में से वंशावली में दर्ज हर व्यक्ति को
  rationale: התיחש का आशय वंशावली के आधार पर अभिलेख में दर्ज या पंजीकृत होना है। यह अनुवाद प्रशासनिक-वंशावली अर्थ को साफ आधुनिक हिन्दी में व्यक्त करता है।
