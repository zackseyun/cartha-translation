  text: וַ/יֹּ֤אמֶר לָ/עָם֙ לְ/יוֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם לָ/תֵ֕ת מְנָ֥ת הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְמַ֥עַן יֶחֶזְק֖וּ בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/004.yaml
  text: He also commanded the people[a], the inhabitants of Jerusalem, to give the portion due to the priests and the Levites, so that they might devote themselves to the law of Yahweh.
translation:
  language: hi
  text: उसने यरूशलेम के निवासियों को यह आज्ञा भी दी कि वे याजकों और लेवियों को उनका निर्धारित भाग दें, ताकि वे याहवे की व्यवस्था में दृढ़ता से लगे रह सकें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वे याहवे की व्यवस्था में दृढ़ हो सकें,” अथवा “ताकि वे याहवे की व्यवस्था को दृढ़ता से थामे रहें।”
    reason: יֶחֶזְקוּ के अर्थ में ‘दृढ़/सामर्थी होना,’ ‘दृढ़ता से लगे रहना’ और ‘दृढ़ता से थामे रहना’—इन निकटवर्ती संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने ... यह आज्ञा भी दी
  rationale: אמר का मूल अर्थ ‘कहना’ है, पर राजा द्वारा प्रजा को दिए गए निर्देश और उसके बाद आए उद्देश्यवाचक infinitive के संदर्भ में ‘आज्ञा दी’ स्वाभाविक रूप से उसका आदेशात्मक बल व्यक्त करता है। ‘भी’ कथा की निरंतरता को दर्शाता है।
- source_word: לָעָם לְיוֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों को
  rationale: 'दूसरा पदबंध पहले को अधिक स्पष्ट करता है: संबोधित लोग विशेष रूप से यरूशलेम में रहनेवाले थे। हिंदी में इसे एक संक्षिप्त, स्वाभाविक पदबंध में व्यक्त किया गया है।'
- source_word: לָתֵת
  choice: दें
  rationale: נתן का सीधा अर्थ ‘देना’ है; यहाँ आज्ञा के आशय को हिंदी के संयोजक रूप ‘कि वे ... दें’ में रखा गया है।
- source_word: מְנָת
  choice: उनका निर्धारित भाग
  rationale: מְנָה किसी नियत या आवंटित हिस्से को दर्शाता है। ‘निर्धारित भाग’ याजकों और लेवियों को मिलनेवाले अधिकारपूर्ण हिस्से को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों
  rationale: दोनों अलग-अलग समूहों को मूल के अनुसार स्पष्ट रूप से बनाए रखा गया है; ये हिंदी बाइबल-परंपरा में परिचित शब्द हैं।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्यसूचक संबंध को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יֶחֶזְקוּ
  choice: दृढ़ता से लगे रह सकें
  rationale: חזק के Qal रूप में ‘दृढ़ होना,’ ‘मजबूत होना’ या ‘दृढ़ता से थामे रहना’ जैसे अर्थ संभव हैं। भौतिक सहायता के इस संदर्भ में चुना गया वाक्यांश निरंतर समर्पित रहने का भाव देता है, जबकि ‘दृढ़ता से’ मूल क्रिया का बल बनाए रखता है।
- source_word: בְּתוֹרַת יְהוָה
  choice: याहवे की व्यवस्था में
  rationale: תּוֹרָה यहाँ परमेश्वर की वाचा-संबंधी और उपासना-संबंधी व्यवस्था/निर्देश को दर्शाती है। בְּ को ‘में’ से व्यक्त किया गया है, और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत शैक्षिक लिप्यंतरण है और किसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
- issue: יֶחֶזְקוּ בְּתוֹרַת יְהוָה का अर्थ
  choice: याहवे की व्यवस्था में दृढ़ता से लगे रह सकें
  alternative: याहवे की व्यवस्था में दृढ़ हो सकें; याहवे की व्यवस्था को दृढ़ता से थामे रह सकें
  rationale: वाक्यांश में सामर्थ्य पाने, दृढ़ रहने और दृढ़ता से थामे रहने के अर्थों की वास्तविक गुंजाइश है। संदर्भ में लोगों द्वारा दिए गए भाग से याजक और लेवी अपनी व्यवस्था-संबंधी सेवा में निरंतर लगे रह सकते थे। मुख्य पाठ संदर्भगत अर्थ देता है और अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है और शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘निवासी,’ ‘निर्धारित भाग,’ ‘याजक,’ ‘लेवी’ और ‘व्यवस्था’ जैसे शब्द धार्मिक-ऐतिहासिक संदर्भ को स्पष्ट रखते हैं।
