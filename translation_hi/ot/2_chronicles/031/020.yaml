base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/031/020.yaml
  text: Hezekiah did this throughout all Judah[a], and he did what was good and right and true before Yahweh his God.
translation:
  language: hi
  text: हिजकिय्याह ने पूरे यहूदा में ऐसा ही किया। उसने अपने परमेश्वर याहवे के सामने वह किया जो भला, सही और सच्चा[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्य।” इब्रानी शब्द אֱמֶת सत्य, विश्वसनीयता या निष्ठा का अर्थ दे सकता है; यहाँ यह संभवतः सच्चे और भरोसेमंद आचरण का वर्णन करता है।
    reason: शब्दार्थ का वैकल्पिक अर्थ
lexical_decisions:
- source_word: וַיַּעַשׂ כָּזֹאת
  choice: ऐसा ही किया
  rationale: यह पद पिछले सुधारों और प्रबंधों का सार प्रस्तुत करता है। ‘ऐसा ही किया’ संकेतवाचक भाव और सार-सूचक कार्य दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּכָל יְהוּדָה
  choice: पूरे यहूदा में
  rationale: यह पूरे भूभाग में कार्य किए जाने की व्यापकता को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: הַטּוֹב
  choice: जो भला ... था
  rationale: निश्चित लेख के कारण विशेषण संज्ञात्मक रूप में है; ‘जो भला था’ उसके नैतिक और संज्ञात्मक भाव को बनाए रखता है।
- source_word: הַיָּשָׁר
  choice: उचित
  rationale: नैतिक संदर्भ में יָשָׁר का अर्थ सीधा, खरा या सही है। ‘उचित’ इस त्रिक में स्वाभाविक है और परमेश्वर के मूल्यांकन के अनुसार सही आचरण का भाव देता है।
- source_word: הָאֱמֶת
  choice: सच्चा
  rationale: אֱמֶת सत्य, विश्वसनीयता और निष्ठा का बोध करा सकता है। ‘सच्चा’ मूल के प्रत्यक्ष अर्थ को बनाए रखता है, जबकि पादटिप्पणी आचरण-संबंधी ‘विश्वासयोग्य’ अर्थ की संभावना बताती है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי उपस्थिति और मूल्यांकन दोनों का भाव रखता है; ‘के सामने’ इस संबंधपरक अस्पष्टता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: पुरुष एकवचन प्रत्यय हिजकिय्याह की ओर संकेत करता है। हिंदी में कर्ता की ओर लौटते संबंध को ‘अपने’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है, उपाधि से नहीं बदलता।
- issue: הָאֱמֶת का नैतिक अर्थ
  choice: सच्चा
  alternative: विश्वासयोग्य; निष्ठापूर्ण
  rationale: त्रिक में मूल शब्द को ‘सच्चा’ कहना उसके सत्य-संबंधी अर्थ को सीधे बनाए रखता है; साथ ही पादटिप्पणी यह खुला रखती है कि यहाँ विश्वसनीय या निष्ठापूर्ण आचरण अभिप्रेत हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। नैतिक त्रिक को ‘भला, उचित और सच्चा’ के रूप में समानांतर रखा गया है; शब्दार्थ की वास्तविक व्यापकता पादटिप्पणी में सुरक्षित है।
