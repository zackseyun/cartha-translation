id: 2CH.16.9
reference: 2 Chronicles 16:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יְהוָ֗ה עֵינָ֞י/ו מְשֹׁטְט֤וֹת בְּ/כָל הָ/אָ֨רֶץ֙ לְ֠/הִתְחַזֵּק עִם לְבָבָ֥/ם שָׁלֵ֛ם אֵלָ֖י/ו נִסְכַּ֣לְתָּ עַל זֹ֑את כִּ֣י מֵ/עַ֔תָּה יֵ֥שׁ עִמְּ/ךָ֖ מִלְחָמֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/009.yaml
  text: For the eyes of Yahweh range throughout all the earth to strengthen those whose heart is wholly toward him[a]. You have acted foolishly in this; for from now on you will have wars.
translation:
  language: hi
  text: क्योंकि यहोवा की आँखें सारी पृथ्वी पर घूमती रहती हैं, ताकि वह उन लोगों को सामर्थ्य दे जिनका हृदय पूरी तरह उसकी ओर लगा है।[a] इस मामले में तुमने मूर्खता की है; इसलिए अब से तुम्हें युद्धों का सामना करना पड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि वह उन लोगों के पक्ष में अपने को सामर्थी दिखाए जिनका हृदय उसके प्रति निर्दोष है।”
    reason: לְהִתְחַזֵּק और שָׁלֵם के संभव वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עֵינָיו מְשֹׁטְטוֹת
  choice: उसकी आँखें ... घूमती रहती हैं
  rationale: मूल पाठ में परमेश्वर की दृष्टि और सक्रिय खोज का मानवीय बिंब स्पष्ट रखा गया है; अपूर्ण कृदन्त की निरंतरता भी व्यक्त होती है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: कथन का सार्वभौमिक स्वर ‘देश’ की अपेक्षा ‘पृथ्वी’ से अधिक स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְהִתְחַזֵּק עִם
  choice: सामर्थ्य दे
  rationale: हितकारी अर्थ में यहोवा द्वारा ऐसे लोगों को दृढ़ समर्थन देने की बात है; आत्मवाचक अर्थ ‘अपने को सामर्थी दिखाए’ भी संभव है और पादटिप्पणी में सुरक्षित है।
- source_word: לְבָבָם שָׁלֵם אֵלָיו
  choice: जिनका हृदय पूरी तरह उसकी ओर लगा है
  rationale: यह पापरहित सिद्धता नहीं, बल्कि अखंड निष्ठा और पूरे मन से यहोवा की ओर उन्मुख होने को व्यक्त करता है।
- source_word: נִסְכַּלְתָּ עַל זֹאת
  choice: इस मामले में तुमने मूर्खता की है
  rationale: भविष्यद्वक्ता की फटकार को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: יֵשׁ עִמְּךָ מִלְחָמוֹת
  choice: तुम्हें युद्धों का सामना करना पड़ेगा
  rationale: מֵעַתָּה के साथ यह अस्तित्ववाचक रचना आगामी और बार-बार होने वाले युद्धों का बोध कराती है।
theological_decisions:
- issue: שָׁלֵם से वर्णित हृदय का अर्थ
  choice: पूरी तरह यहोवा की ओर लगा हुआ, अर्थात अखंड निष्ठा
  alternative: उसके प्रति निर्दोष या सिद्ध हृदय
  rationale: संदर्भ आसा के यहोवा पर पूर्ण भरोसा रखने के बजाय मानवीय सहायता पर निर्भर होने का है; इसलिए पापरहित सिद्धता का भाव आरोपित नहीं किया गया।
- issue: הָאָרֶץ का विस्तार
  choice: सारी पृथ्वी
  alternative: सारा देश
  rationale: सूक्ति-सदृश कथन यहोवा की सर्वत्र खोजती दृष्टि को प्रस्तुत करता है, केवल यहूदा की भूमि को नहीं।
- issue: לְהִתְחַזֵּק का कर्तृवाचक अथवा हितकारी बल
  choice: निष्ठावान लोगों को सामर्थ्य देना
  alternative: उनके पक्ष में अपने को सामर्थी दिखाना
  rationale: दोनों अर्थ व्याकरण और संदर्भ में संभव हैं; मुख्य पाठ में स्वाभाविक हितकारी अर्थ लिया गया और दूसरा अर्थ पादटिप्पणी में रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। ‘आँखें घूमती रहती हैं’ मूल मानवीय बिंब को बनाए रखता है, और ‘हृदय ... उसकी ओर लगा है’ अखंड वाचा-निष्ठा को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
