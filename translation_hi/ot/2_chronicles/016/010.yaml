  yaml_path: translation/ot/2_chronicles/016/010.yaml
  text: Then Asa was angry with the seer and put him in the prison house[a], because he was in a rage with him over this[b]. And Asa brutally oppressed some of the people at that time.
translation:
  language: hi
  text: तब आसा द्रष्टा पर क्रोधित हुआ और उसने उसे बंदीगृह[a] में डाल दिया, क्योंकि इस बात को लेकर वह उस पर अत्यंत क्रुद्ध था। उस समय आसा ने प्रजा में से कुछ लोगों पर कठोर अत्याचार किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काठ में जकड़ने का स्थान’; इब्रानी पद संभवतः ऐसे बंदी-स्थान को दर्शाता है जहाँ कैदी को किसी साधन से जकड़ा जाता था।
    reason: lexical_alternative
  - marker: b
    text: या ‘कुचला’ अथवा ‘उनके साथ बुरा व्यवहार किया’; इब्रानी क्रिया का शाब्दिक भाव हिंसक रूप से ‘कुचलना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְעַס
  choice: क्रोधित हुआ
  rationale: כעס क्रोध या खीझ को व्यक्त करता है; ‘क्रोधित हुआ’ कथानक के क्रम और भाव, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: הָרֹאֶה
  choice: द्रष्टा
  rationale: רֹאֶה भविष्यद्वक्ता के लिए प्रयुक्त पुराना पद है, जिसका शाब्दिक अर्थ ‘देखने वाला/द्रष्टा’ है; ‘द्रष्टा’ इस विशिष्ट पद को बनाए रखता है।
- source_word: בֵּית הַמַּהְפֶּכֶת
  choice: बंदीगृह
  rationale: यह कठिन पद किसी ऐसे निरोध-स्थान की ओर संकेत करता है जहाँ बंधन या कष्ट देने की व्यवस्था रही होगी। ‘बंदीगृह’ प्रसंगगत अर्थ को स्पष्ट करता है, जबकि अधिक विशिष्ट संभावना पादटिप्पणी में रखी गई है।
- source_word: בְזַעַף עִמּוֹ
  choice: वह उस पर अत्यंत क्रुद्ध था
  rationale: זַעַף तीव्र रोष या प्रकोप दर्शाता है। यह चुनाव उसकी तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עַל זֹאת
  choice: इस बात को लेकर
  rationale: यह निकटवर्ती कारण या प्रसंग की ओर संकेत करता है; हिन्दी में यह प्रयोग स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: וַיְרַצֵּץ
  choice: कुचल डाला
  rationale: רצץ का मूल चित्र कुचलने या चूर करने का है और यहाँ मनुष्यों के साथ कठोर, हिंसक दुर्व्यवहार को दर्शाता है। ‘कुचल डाला’ उस हिंसक बल को बनाए रखता है, बिना उसे केवल सामान्य ‘सताया’ तक हल्का किए।
- source_word: מִן הָעָם
  choice: प्रजा में से कुछ लोगों को
  rationale: यहाँ מִן अंशसूचक है; अतः बात पूरी प्रजा की नहीं, उसमें से कुछ लोगों की है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह समयसूचक पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
