source:
  edition: WLC
  text: וַ/יֹּצֵ֨א אָסָ֜א כֶּ֣סֶף וְ/זָהָ֗ב מֵ/אֹֽצְר֛וֹת בֵּ֥ית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח אֶל בֶּן הֲדַד֙ מֶ֣לֶךְ אֲרָ֔ם הַ/יּוֹשֵׁ֥ב בְּ/דַרְמֶ֖שֶׂק לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/002.yaml
  text: Then Asa brought out silver and gold from the treasuries of the house of Yahweh and of the king’s house[a], and sent them to Ben-hadad king of Aram, who lived in Damascus, saying,
translation:
  language: hi
  text: 'तब आसा ने याहवे के भवन और राजमहल के भंडारों से चाँदी और सोना निकाला और उन्हें अराम के राजा बेन-हदद के पास, जो दमिश्क में रहता था, भेजा और कहलवाया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: निकाला
  rationale: हिफ़ील रूप का अर्थ भंडार से बाहर निकालना है; ‘निकाला’ हिंदी में स्वाभाविक और ठोस क्रिया है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: दोनों निर्दिष्ट बहुमूल्य धातुओं का सीधा और प्रचलित हिंदी रूप।
- source_word: מֵאֹצְרוֹת
  choice: भंडारों से
  rationale: हिब्रू में बहुवचन है; ‘भंडारों’ से संख्या और संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: בֵּית יְהוָה
  choice: यहवे के भवन
  rationale: ‘भवन’ स्रोत के ‘घर/भवन’ को बनाए रखता है, और יְהוָה को व्यक्तिवाचक वाचा-नाम ‘यहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וּבֵית הַמֶּלֶךְ
  choice: और राजभवन के
  rationale: शाब्दिक अर्थ ‘राजा का भवन’ है; आधुनिक हिंदी में ‘राजभवन’ स्पष्ट और स्वाभाविक है तथा मंदिर के भंडार और राजकीय भंडार का भेद बताता है।
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: क्रिया का सामान्य अर्थ ‘भेजना’ है; संदर्भ के अनुसार चाँदी-सोना संदेश सहित भेजा गया।
- source_word: אֶל בֶּן הֲדַד
  choice: बेन-हदद के पास
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण और हिंदी में प्राप्तकर्ता बताने का स्वाभाविक ढंग।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: मूल भौगोलिक नाम ‘अराम’ को बनाए रखा गया है; इसे बाद के नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
- source_word: הַיּוֹשֵׁב בְּדַרְמֶשֶׂק
  choice: जो दमिश्क में रहता था
  rationale: कृदंत का निवास-सूचक, अवधि-बोधक अर्थ सहज आधुनिक हिंदी में व्यक्त होता है।
- source_word: לֵאמֹר
  choice: 'यह संदेश भेजा:'
  rationale: अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका हिंदी में स्वाभाविक रूप से स्पष्ट करता है; केवल ‘कहते हुए’ की अपेक्षा प्रेषित राजनयिक संदेश के संदर्भ में अधिक सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम है। ‘यहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और वाचा-नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘यह संदेश भेजा:’ पद के अंत में अगले पद के प्रत्यक्ष कथन की स्वाभाविक भूमिका बनाता है।
