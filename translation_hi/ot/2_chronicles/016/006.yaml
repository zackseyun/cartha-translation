  yaml_path: translation/ot/2_chronicles/016/006.yaml
  text: Then King Asa took all Judah[a], and they carried away the stones of Ramah and its timber, with which Baasha had built[b], and he built with them Geba and Mizpah.
translation:
  language: hi
  text: तब राजा आसा ने पूरे यहूदा को जुटाया[a]। वे रामा के पत्थर और उसकी इमारती लकड़ी उठा ले गए, जिनका बाशा ने निर्माण में उपयोग किया था[b]। आसा ने उन्हीं से गेबा और मिस्पा का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरे यहूदा को बुलाया/काम पर लगाया”; शाब्दिक अर्थ “पूरे यहूदा को लिया” है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात बाशा ने इन्हीं पत्थरों और इमारती लकड़ी का उपयोग करके रामा का निर्माण किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקַח אֶת כָּל יְהוּדָה
  choice: पूरे यहूदा को जुटाया
  rationale: शाब्दिक अर्थ ‘पूरे यहूदा को लिया’ है, पर प्रसंग में राजा द्वारा यहूदा के लोगों को काम के लिए एकत्र या तैनात करना अभिप्रेत है। ‘जुटाया’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ देता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּשְׂאוּ
  choice: उठा ले गए
  rationale: נשׂא यहाँ निर्माण-सामग्री को उठाकर दूसरी जगह ले जाने को व्यक्त करता है। ‘उठा ले गए’ इस गतिविधि को स्पष्ट और सहज हिन्दी में बताता है।
- source_word: אַבְנֵי הָרָמָה
  choice: रामा के पत्थर
  rationale: यह स्थानवाचक नाम के साथ रचना-संबंधी संधि है और रामा की किलेबंदी में लगे पत्थरों की ओर संकेत करती है।
- source_word: עֵצֶיהָ
  choice: उसकी लकड़ी
  rationale: स्त्रीलिंग प्रत्यय रामा की ओर लौटता है। ‘लकड़ी’ सामान्य पाठक के लिए सहज है और यहाँ भवन-निर्माण की लकड़ी को दर्शाती है।
- source_word: אֲשֶׁר בָּנָה בַּעְשָׁא
  choice: जिनसे बाशा ने वहाँ निर्माण किया था
  rationale: सम्बन्धवाचक उपवाक्य पत्थरों और लकड़ी, दोनों को बाशा द्वारा निर्माण में इस्तेमाल की गई सामग्री के रूप में बताता है। ‘वहाँ’ रामा को इंगित करता है, पर वस्तु का अस्पष्ट लोप पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַיִּבֶן בָּהֶם
  choice: आसा ने उन्हीं से ... का निर्माण किया
  rationale: एकवचन क्रिया का कर्ता आसा है और बहुवचन सर्वनाम पहले बताई गई सामग्री को दर्शाता है। ‘उन्हीं से’ सामग्री के पुनः उपयोग पर स्वाभाविक बल देता है।
- source_word: גֶּבַע
  choice: गेबा
  rationale: इब्रानी स्थानवाचक नाम का मानक हिन्दी लिप्यंतरण।
- source_word: הַמִּצְפָּה
  choice: मिस्पा
  rationale: इब्रानी स्थानवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; हिन्दी में नाम के साथ इब्रानी निश्चित उपपद अलग से नहीं दर्शाया गया।
