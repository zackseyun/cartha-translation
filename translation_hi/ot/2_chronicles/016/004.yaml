base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/004.yaml
  text: Ben-hadad listened to King Asa and sent the commanders of his armies against the cities of Israel[a], and they struck Ijon, Dan, Abel-maim, and all the store-cities of Naphtali.
translation:
  language: hi
  text: बेन-हदद ने राजा आसा की बात सुनी और अपनी सेनाओं के सेनापतियों को इस्राएल के नगरों के विरुद्ध भेजा। उन्होंने इय्योन, दान, आबेल-माइम[a] और नप्ताली के सभी भंडार-नगरों पर आक्रमण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू पाठ में “आबेल-माइम” है; कुछ इसे समानांतर अंशों में उल्लिखित आबेल-बेत-माका के रूप में पहचानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: की बात मानी
  rationale: यहाँ क्रिया केवल सुनने नहीं, बल्कि आसा के निवेदन पर अनुकूल कार्रवाई करने का भाव देती है। ‘बात मानी’ आधुनिक हिन्दी में सुनने और स्वीकार करने, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂרֵי הַחֲיָלִים אֲשֶׁר לוֹ
  choice: अपनी सेनाओं के सेनापतियों
  rationale: שָׂרֵי सैन्य अधिकारियों को और הַחֲיָלִים सैन्य बलों को सूचित करता है; אֲשֶׁר לוֹ उनके बेन-हदद के अधीन होने का भाव देता है।
- source_word: עָרֵי יִשְׂרָאֵל
  choice: इस्राएल के नगरों
  rationale: यह उत्तरी राज्य इस्राएल के नगरों का सीधा भौगोलिक-राजनीतिक उल्लेख है।
- source_word: וַיַּכּוּ
  choice: आक्रमण किया
  rationale: नכה सैन्य प्रसंग में प्रहार करने या हमला करने का अर्थ रखता है। नगरों के साथ ‘आक्रमण किया’ सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: עִיּוֹן
  choice: इय्योन
  rationale: स्थान-नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण किया गया है।
- source_word: אָבֵל מָיִם
  choice: आबेल-माइम
  rationale: अनुवाद ने हिब्रू पाठ में उपस्थित स्थान-नाम को बनाए रखा है और समानांतर अंशों के अधिक परिचित नाम से उसका सामंजस्य नहीं किया।
- source_word: מִסְכְּנוֹת
  choice: भंडार-नगरों
  rationale: शब्द ऐसे नगरों को सूचित करता है जिनका उपयोग सामग्री या रसद के भंडारण के लिए होता था।
- source_word: עָרֵי נַפְתָּלִי
  choice: नप्ताली के ... नगरों
  rationale: सम्बन्धवाचक रचना इन नगरों को नप्ताली के क्षेत्र से जोड़ती है।
