base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/011.yaml
  text: Behold[a], the acts of Asa, the first and the last, behold, they are written in the Book of the Kings of Judah and Israel.
translation:
  language: hi
  text: देखो, आसा के आरम्भ से अन्त तक के कार्य—देखो, वे यहूदा और इस्राएल के राजाओं की पुस्तक में लिखे हुए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह समापन-सूचना की ओर ध्यान खींचता है। ‘देखो’ इसके संकेतात्मक और बलात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דִּבְרֵי אָסָא
  choice: आसा के ... काम
  rationale: राजकीय इतिहास के सार-सूत्रों में דִּבְרֵי केवल बोले हुए ‘वचन’ नहीं, बल्कि राजा के कार्यों और उससे सम्बन्धित घटनाओं को सूचित करता है। ‘काम’ सामान्य पाठक के लिए सहज और प्रसंगानुकूल है।
- source_word: הָרִאשׁוֹנִים וְהָאַחֲרוֹנִים
  choice: आरम्भ से अन्त तक
  rationale: शाब्दिक रूप से ‘पहले और बाद के’ यह युग्म आसा के पूरे शासनकाल के वृत्तांत को समेटता है; हिन्दी में ‘आरम्भ से अन्त तक’ उसका स्वाभाविक मुहावरेदार अर्थ देता है।
- source_word: הִנָּם כְּתוּבִים
  choice: लिखे हुए हैं
  rationale: यह बताता है कि ये वृत्तांत एक लिखित स्रोत में विद्यमान हैं। हिन्दी में सर्वनाम का भाव ‘काम’ के साथ निहित है, इसलिए अलग से दूसरा ध्यानसूचक शब्द जोड़ना अस्वाभाविक होता।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: עַל का मूल अर्थ ‘पर’ है, पर लिखित स्रोत में सामग्री दर्ज होने के इस सूत्र में हिन्दी मुहावरा ‘पुस्तक में’ अपेक्षित है।
- source_word: הַמְּלָכִים לִיהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल के राजाओं की
  rationale: לִ यहाँ सम्बन्ध का भाव देता है। यह अनुवाद अभिलेख के शीर्षक को पारदर्शी रखता है और मूल में स्पष्ट रूप से न दिए गए ‘इतिहास-वृत्त’ जैसे विस्तार से बचता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरम्भिक ध्यानसूचक को ‘देखो’ से व्यक्त किया गया है, जबकि הִנָּם के कारण दूसरा ‘देखो’ जोड़ने के बजाय स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
