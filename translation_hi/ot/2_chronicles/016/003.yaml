  text: בְּרִית֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/בֵ֥ין אָבִ֖/י וּ/בֵ֣ין אָבִ֑י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּֽי לְ/ךָ֙ כֶּ֣סֶף וְ/זָהָ֔ב לֵ֞ךְ הָפֵ֣ר בְּרִֽיתְ/ךָ֗ אֶת בַּעְשָׁא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וְ/יַעֲלֶ֖ה מֵ/עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/003.yaml
  text: There is a treaty between me and you[a], and between my father and your father. Look, I have sent you silver and gold. Go, break your treaty with Baasha king of Israel[b], so that he may withdraw from me.
translation:
  language: hi
  text: “मेरे और तुम्हारे बीच[a], और मेरे पिता और तुम्हारे पिता के बीच संधि है। देखो, मैंने तुम्हें चाँदी और सोना भेजा है। जाओ, इस्राएल के राजा बाशा के साथ अपनी संधि तोड़ दो, ताकि वह मुझ पर से हट जाए।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘संधि’ के लिए ‘वाचा’ या ‘गठबंधन’ भी अनुवाद हो सकता है (इब्रानी: בְּרִית); यहाँ प्रसंग राजाओं के बीच राजनीतिक समझौते का है।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और वह मेरे ऊपर से चला जाए” (क्रिया का मूल अर्थ ‘ऊपर जाना’ है); प्रसंग में इसका अर्थ संभवतः यह है कि बाशा आसा पर अपना दबाव या सैन्य कार्रवाई हटा ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִית
  choice: संधि
  rationale: राजाओं के बीच राजनीतिक समझौते के इस प्रसंग में ‘संधि’ स्वाभाविक और सटीक है; यही शब्द दोनों occurrences में रखकर इब्रानी की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין אָבִי וּבֵין אָבִיךָ
  choice: मेरे और तुम्हारे बीच, और मेरे पिता और तुम्हारे पिता के बीच
  rationale: इब्रानी में ‘बीच’ की समानांतर पुनरावृत्ति को स्पष्ट राजनयिक सूत्र के रूप में बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भेजी गई भेंट की ओर ध्यान खींचता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שָׁלַחְתִּי לְךָ כֶּסֶף וְזָהָב
  choice: मैंने तुम्हारे पास चाँदी और सोना भेजा है
  rationale: इब्रानी पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित स्वाभाविक हिन्दी पूर्णकाल में व्यक्त किया गया है।
- source_word: לֵךְ
  choice: जाओ
  rationale: अनुरोधित कार्रवाई का सीधा आज्ञार्थक रूप।
- source_word: הָפֵר
  choice: तोड़ दो
  rationale: हिफ़ील रूप यहाँ संधि को भंग करने का अर्थ देता है; ‘तोड़ दो’ सहज और प्रभावशाली हिन्दी है।
- source_word: בְּרִיתְךָ אֶת־בַּעְשָׁא
  choice: बाशा के साथ अपनी संधि
  rationale: व्यक्तिनाम के साथ संधि-संबंध को हिन्दी में ‘के साथ’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וְיַעֲלֶה מֵעָלַי
  choice: ताकि वह मेरे विरुद्ध से हट जाए
  rationale: मुहावरे में दबाव या सैन्य कार्रवाई हटाने का भाव है; ‘मेरे विरुद्ध से’ मूल के מֵעָלַי की असामान्य दिशात्मक छवि को कुछ हद तक बचाता है, जबकि ‘हट जाए’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: मानक राजकीय पदवी का सीधा अनुवाद।
