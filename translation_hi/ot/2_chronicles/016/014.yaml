  text: וַ/יִּקְבְּרֻ֣/הוּ בְ/קִבְרֹתָ֗י/ו אֲשֶׁ֣ר כָּֽרָה ל/וֹ֮ בְּ/עִ֣יר דָּוִיד֒ וַ/יַּשְׁכִּיבֻ֗/הוּ בַּ/מִּשְׁכָּב֙ אֲשֶׁ֤ר מִלֵּא֙ בְּשָׂמִ֣ים וּ/זְנִ֔ים מְרֻקָּחִ֖ים בְּ/מִרְקַ֣חַת מַעֲשֶׂ֑ה וַ/יִּשְׂרְפוּ ל֥/וֹ שְׂרֵפָ֖ה גְּדוֹלָ֥ה עַד לִ/מְאֹֽד־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/014.yaml
  text: They buried him in his tomb[a], which he had cut out for himself in the City of David, and laid him on the bier that had been filled with spices and various blended ointments prepared by a perfumer’s craft[b]; and they made a very great burning for him.
translation:
  language: hi
  text: उन्होंने उसे दाऊद के नगर में उसकी उन कब्रों में दफनाया, जिन्हें उसने अपने लिए खोदी थीं। उन्होंने उसे उस शव-शय्या पर लिटाया, जो सुगंध-द्रव्यों और सुगंध बनाने वाले कारीगर की कला से तैयार किए गए तरह-तरह के मिश्रणों से भरी हुई थी। फिर उन्होंने उसके लिए बहुत बड़ा दहन किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “उन्होंने उसके लिए अत्यन्त बड़ा दहन किया” है। यह संभवतः अंतिम संस्कार के अवसर पर सुगंध-द्रव्यों का सम्मानसूचक दहन था; पाठ यह नहीं कहता कि उसका शरीर जलाया गया था।
    reason: सांस्कृतिक टिप्पणी और मूल मुहावरे की अर्थगत अनिश्चितता
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे ... दफनाया
  rationale: קבר का सीधा कथात्मक अर्थ ‘दफनाना’ है; बहुवचन कर्ता और एकवचन पुल्लिंग कर्म को स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְקִבְרֹתָיו
  choice: उसकी ... कब्र में
  rationale: इब्रानी रूप बहुवचन है और राजकीय कब्र-समूह का संकेत दे सकता है, पर प्रसंग में आसा के व्यक्तिगत दफन-स्थान के लिए हिन्दी का एकवचन ‘कब्र’ अधिक स्वाभाविक है।
- source_word: אֲשֶׁר כָּרָה לוֹ
  choice: जिसे उसने अपने लिए खुदवाया था
  rationale: כרה का अर्थ खोदना या काटकर बनाना है। ‘खुदवाया’ पूर्व-तैयार कब्र का अर्थ सहजता से व्यक्त करता है, यद्यपि इब्रानी व्याकरण प्रत्यक्षतः ‘उसने खोदी’ कहता है।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊदपुर में
  rationale: ‘दाऊदपुर’ हिन्दी बाइबलीय स्थान-नाम के रूप में संक्षिप्त और सुबोध है तथा ‘दाऊद का नगर’ के अर्थ को वहन करता है।
- source_word: וַיַּשְׁכִּיבֻהוּ בַּמִּשְׁכָּב
  choice: उन्होंने उसे ... शव-शय्या पर लिटाया
  rationale: שכב के हिफ़ील का अर्थ किसी को लिटाना है। מִשְׁכָּב मूलतः लेटने का स्थान, पलंग या शय्या है; अंतिम संस्कार के प्रसंग में ‘शव-शय्या’ अर्थ स्पष्ट करता है, बिना दाह-संस्कार मान लेने के।
- source_word: אֲשֶׁר מִלֵּא
  choice: जो ... भरी हुई थी
  rationale: इब्रानी में पुल्लिंग एकवचन कर्ता स्पष्ट नहीं है; हिन्दी में परिणामकारी भाव और अस्पष्ट कर्ता को बनाए रखने के लिए कर्मवाच्य-सदृश अभिव्यक्ति चुनी गई है।
- source_word: בְּשָׂמִים
  choice: सुगंध-द्रव्यों
  rationale: यह शब्द मसालों, सुगंधित पदार्थों या गंध-द्रव्यों के लिए आता है; अंतिम संस्कार के प्रसंग में ‘सुगंध-द्रव्य’ सर्वाधिक स्पष्ट है।
- source_word: וּזְנִים מְרֻקָּחִים
  choice: तरह-तरह के सुगंधित मिश्रणों
  rationale: זנים दुर्लभ शब्द है, जो संभवतः प्रकारों या किस्मों को बताता है, और רקח सुगंधित पदार्थ मिलाकर तैयार करने को सूचित करता है। यह अनुवाद अनिश्चित शब्द को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: בְּמִרְקַחַת מַעֲשֶׂה
  choice: गंधी की कला से तैयार किए गए
  rationale: वाक्यांश सुगंधित मिश्रण बनाने वाले कुशल कारीगर के काम या कला को दर्शाता है; ‘गंधी’ पारंपरिक किन्तु बोधगम्य हिन्दी पद है।
- source_word: וַיִּשְׂרְפוּ לוֹ שְׂרֵפָה גְּדוֹלָה עַד לִמְאֹד
  choice: उन्होंने उसके सम्मान में बहुत विशाल अग्नि जलाई
  rationale: शाब्दिक मुहावरा ‘उसके लिए अत्यन्त बड़ा दहन किया’ है। हिन्दी में ‘अग्नि जलाई’ औपचारिक सम्मानसूचक दहन को स्वाभाविक बनाता है और शरीर के दाह का निष्कर्ष नहीं थोपता।
theological_decisions:
- issue: अंतिम संस्कार में ‘बड़े दहन’ का आशय
  choice: आसा के सम्मान में जलाई गई विशाल औपचारिक अग्नि
  alternative: आसा के शरीर का दाह-संस्कार
  rationale: पद पहले स्पष्टतः दफनाए जाने और शव-शय्या पर रखे जाने की बात कहता है। अतः अग्नि संभवतः सुगंध-द्रव्यों की सम्मानसूचक जलन थी; फिर भी मूल पाठ यह नहीं बताता कि वास्तव में क्या जलाया गया, इसलिए पादटिप्पणी में अनिश्चितता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली। ‘दफनाया’, ‘शव-शय्या’ और ‘सुगंध-द्रव्य’ सामान्य पाठक के लिए स्पष्ट हैं; ‘गंधी’ कारीगरी के भाव को संक्षेप में रखता है। मुख्य पाठ में अग्नि को सम्मानसूचक बताया गया है, जबकि क्या जलाया गया था इसकी अनिश्चितता पादटिप्पणी में बनी रहती है।
