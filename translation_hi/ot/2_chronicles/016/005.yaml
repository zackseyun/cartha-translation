  text: जब बाशा ने यह सुना, तो उसने रामा को बनाना बंद कर दिया और अपना काम बंद कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब … ने यह सुना, तो
  rationale: यह इब्रानी संरचना घटनाओं के क्रम में समयवाचक उपवाक्य प्रस्तुत करती है। हिंदी में ‘जब … ने यह सुना, तो’ स्वाभाविक है; ‘यह’ का आशय पिछले प्रसंग में बताई गई बात से है।
- source_word: בַּעְשָׁא
  choice: बाशा
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: וַיֶּחְדַּל מִבְּנוֹת
  choice: निर्माण करना बंद कर दिया
  rationale: חדל के साथ מן और क्रियार्थक संज्ञा किसी गतिविधि को छोड़ने या बंद करने का अर्थ देते हैं। यह हिंदी में सहज और अर्थनिष्ठ अभिव्यक्ति है।
- source_word: אֶת הָרָמָה
  choice: रामा का
  rationale: रामा स्थान का नाम है और निर्माण-कार्य का लक्ष्य है। हिंदी में ‘रामा का निर्माण’ मूल वाक्य के रूप को निकटता से रखता है; प्रसंग में इसका आशय नगर को किलेबंद या सुदृढ़ करना भी हो सकता है।
- source_word: וַיַּשְׁבֵּת
  choice: रोक दिया
  rationale: שבת का हिफ़ईल रूप यहाँ किसी काम को रुकवा देने या समाप्त कर देने का अर्थ देता है। ‘रोक दिया’ उसके कारक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מְלַאכְתּוֹ
  choice: अपना काम
  rationale: מלאכה का सामान्य अर्थ काम या श्रम है; स्वत्वप्रत्यय को हिंदी में कर्ता-सापेक्ष ‘अपना’ से स्वाभाविक रूप में व्यक्त किया गया है।
