source:
  edition: WLC
  text: וַ/יֶּחֱלֶ֣א אָסָ֡א בִּ/שְׁנַת֩ שְׁלוֹשִׁ֨ים וָ/תֵ֤שַׁע לְ/מַלְכוּת/וֹ֙ בְּ/רַגְלָ֔י/ו עַד לְ/מַ֖עְלָ/ה חָלְי֑/וֹ וְ/גַם בְּ/חָלְי/וֹ֙ לֹא דָרַ֣שׁ אֶת יְהוָ֔ה כִּ֖י בָּ/רֹפְאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/012.yaml
  text: In the thirty-ninth year of his reign[a], Asa became diseased in his feet; his disease became very severe. Yet even in his disease he did not seek Yahweh, but the physicians.
translation:
  language: hi
  text: अपने राज्य के उनतालीसवें वर्ष में आसा के पैरों में रोग हो गया, और उसका रोग बहुत गंभीर हो गया। फिर भी, अपने रोग में उसने यहोवा को नहीं खोजा, बल्कि वैद्यों की ओर मुड़ा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने यहोवा से सलाह नहीं ली, बल्कि वैद्यों से ली।” इब्रानी वाक्य संक्षिप्त है और यहोवा को खोजने या उससे सलाह लेने के विरोध में वैद्यों की ओर मुड़ने को रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱלֶא
  choice: रोग हो गया
  rationale: यह क्रिया बीमार या दुर्बल हो जाने को व्यक्त करती है; प्रसंग में ‘रोग हो गया’ स्वाभाविक और स्पष्ट है।
- source_word: בְּרַגְלָיו
  choice: उसके पैरों में
  rationale: רֶגֶל का अर्थ पैर या टाँग हो सकता है; यहाँ बहुवचन रूप के अनुरूप ‘पैरों में’ सहज है और अनावश्यक चिकित्सीय विशिष्टता से बचता है।
- source_word: עַד לְמַעְלָה
  choice: बहुत गंभीर
  rationale: यहाँ पदबंध स्थानगत ‘ऊपर’ के बजाय रोग की अत्यधिक गंभीरता बताता है।
- source_word: חָלְיוֹ / בְּחָלְיוֹ
  choice: उसका रोग / अपने रोग में
  rationale: दोनों स्थानों पर ‘रोग’ रखकर इब्रानी की शब्दगत पुनरावृत्ति सुरक्षित रहती है।
- source_word: דָרַשׁ אֶת יְהוָה
  choice: यहोवा को नहीं खोजा
  rationale: דָרַשׁ का अर्थ परमेश्वर को खोजना, उसकी ओर मुड़ना या उससे पूछना हो सकता है; ‘खोजना’ व्यापक वाचा-संबंधी अर्थ और मूल की समानांतर संरचना को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: כִּי בָּרֹפְאִים
  choice: बल्कि वैद्यों को खोजा
  rationale: इब्रानी वाक्यांश संक्षिप्त और अध्याहारयुक्त है—शाब्दिक रूप से ‘परन्तु/क्योंकि वैद्यों में’; पहले खंड की ‘खोजा’ क्रिया को अध्याहृत करके हिन्दी में विरोध स्पष्ट किया गया है।
theological_decisions:
- issue: क्या यह पद चिकित्सा को ही दोषी ठहराता है या आसा द्वारा यहोवा को न खोजने को
  choice: अनुवाद यह विरोध बनाए रखता है कि आसा ने यहोवा को नहीं खोजा, बल्कि वैद्यों को खोजा; यह वैद्यों या चिकित्सा की सार्वभौमिक निंदा नहीं करता।
  alternative: इसे हर प्रकार की चिकित्सकीय सहायता की निंदा समझना, या वैद्यों की ओर मुड़ने को यहोवा को न खोजने से असंबद्ध सूचना मानना।
  rationale: मूल पाठ यहोवा और वैद्यों को आसा की खोज के विपरीत लक्ष्य बनाता है, पर चिकित्सा के विषय में कोई सार्वभौमिक निषेध स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वैद्य’ רֹפְאִים के लिए संक्षिप्त और प्रतिष्ठित हिन्दी शब्द है। मुख्य पाठ में इब्रानी की पुनरावृत्ति तथा अध्याहारयुक्त विरोध को यथासंभव बनाए रखा गया है।
