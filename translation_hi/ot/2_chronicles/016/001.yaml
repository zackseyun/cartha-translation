source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/שֵׁשׁ֙ לְ/מַלְכ֣וּת אָסָ֔א עָלָ֞ה בַּעְשָׁ֤א מֶֽלֶךְ יִשְׂרָאֵל֙ עַל יְהוּדָ֔ה וַ/יִּ֖בֶן אֶת הָ/רָמָ֑ה לְ/בִלְתִּ֗י תֵּ֚ת יוֹצֵ֣א וָ/בָ֔א לְ/אָסָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/001.yaml
  text: In the thirty-sixth year of Asa’s reign[a], Baasha king of Israel went up against Judah and built up Ramah, so as not to allow anyone to go out or come in to Asa king of Judah.
translation:
  language: hi
  text: आसा के शासन के छत्तीसवें वर्ष[a] में इस्राएल का राजा बाशा यहूदा पर चढ़ आया और उसने रामा का निर्माण किया, ताकि वह किसी को यहूदा के राजा आसा के पास आने-जाने न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “आसा के शासन के छत्तीसवें वर्ष में।” इससे बाशा के विषय में 1 राजा की पुस्तक के कालक्रम के साथ तनाव उत्पन्न होता है। कुछ लोग इसे राज्य के विभाजन से गिना हुआ मानते हैं, जबकि अन्य सामंजस्य बैठाने के लिए पाठ-संशोधन प्रस्तावित करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָשֵׁשׁ
  choice: छत्तीसवें वर्ष में
  rationale: समय बताने वाली इब्रानी रचना का स्वाभाविक और निकट हिन्दी रूप।
- source_word: לְמַלְכוּת אָסָא
  choice: आसा के शासन के
  rationale: מַלְכוּת यहाँ राजा के शासनकाल को दर्शाता है; यह चयन काल-संदर्भ को स्पष्ट रखता है।
- source_word: עָלָה ... עַל יְהוּדָה
  choice: यहूदा पर चढ़ आया
  rationale: सैन्य प्रसंग में עלה עם עַל आक्रमण के लिए आगे बढ़ने का भाव देता है; हिन्दी का ‘चढ़ आया’ मूल मुहावरे और सैन्य आशय दोनों को रखता है।
- source_word: וַיִּבֶן אֶת הָרָמָה
  choice: उसने रामा को बनाया
  rationale: בנה का मूल अर्थ ‘बनाना’ है। प्रसंग में किलेबंदी निहित हो सकती है, पर मुख्य पाठ में उसे स्पष्ट करके मूल से अधिक नहीं कहा गया।
- source_word: לְבִלְתִּי תֵּת
  choice: ताकि वह ... न दे
  rationale: यह रचना निषेधात्मक उद्देश्य व्यक्त करती है; हिन्दी में यह सहज उद्देश्यवाचक रूप है।
- source_word: יוֹצֵא וָבָא
  choice: आने-जाने
  rationale: शाब्दिक क्रम ‘निकलने और आने’ का है, पर यह युग्म आवाजाही या पहुँच को दर्शाता है; ‘आने-जाने’ स्वाभाविक हिन्दी में वही समग्र भाव देता है।
- source_word: לְאָסָא מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आसा के पास
  rationale: לְ को यहाँ आसा की ओर पहुँच या संबंध के रूप में लिया गया है; ‘के पास’ हिन्दी में दिशा और पहुँच स्पष्ट करता है।
theological_decisions:
- issue: राजाओं की पुस्तक में बाशा के कालक्रम के साथ तनाव
  choice: मुख्य पाठ में मसोरेटिक पाठ के अनुसार ‘आसा के शासन के छत्तीसवें वर्ष’ को बनाए रखा गया
  alternative: राज्य-विभाजन से छत्तीसवाँ वर्ष; अथवा सामंजस्यकारी पाठ-संशोधन के अनुसार आसा का छब्बीसवाँ वर्ष
  rationale: इब्रानी पाठ स्पष्ट रूप से आसा के शासन का छत्तीसवाँ वर्ष कहता है। कालक्रम की कठिनाई को चुपचाप बदलने या सामंजस्य बैठाने के बजाय पादटिप्पणी में पारदर्शी रूप से बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। कालक्रम की वास्तविक कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
