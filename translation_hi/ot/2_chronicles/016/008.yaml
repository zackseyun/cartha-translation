source:
  edition: WLC
  text: הֲ/לֹ֧א הַ/כּוּשִׁ֣ים וְ/הַ/לּוּבִ֗ים הָי֨וּ לְ/חַ֧יִל לָ/רֹ֛ב לְ/רֶ֥כֶב וּ/לְ/פָרָשִׁ֖ים לְ/הַרְבֵּ֣ה מְאֹ֑ד וּ/בְ/הִשָּֽׁעֶנְ/ךָ֥ עַל יְהוָ֖ה נְתָנָ֥/ם בְּ/יָדֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/008.yaml
  text: Were not the Cushites and the Lubites a very great army[a], with chariots and horsemen in great abundance? Yet when you relied on Yahweh, he gave them into your hand.
translation:
  language: hi
  text: क्या कूशियों और लूबियों की सेना बहुत बड़ी नहीं थी, और उनके रथ और घुड़सवार बहुत बड़ी संख्या में नहीं थे[a]? फिर भी, जब तुमने यहोवा पर भरोसा किया, तो उसने उन्हें तुम्हारे हाथ में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक भौगोलिक नामों में, “इथियोपियाइयों” और “लीबियाइयों।” यहाँ मूल इब्रानी जातिनामों के निकट रहने के लिए “कूशी” और “लूबी” रखा गया है।
    reason: कूशी और लूबी जातिनामों के संभावित पारंपरिक भौगोलिक समतुल्य बताता है, बिना उन्हें निश्चित आधुनिक पहचान के रूप में प्रस्तुत किए।
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं थे
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; हिंदी में यह रचना उसी बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: הַכּוּשִׁים
  choice: कूशी
  rationale: मूल जातिनाम के निकट रहने और उसे आधुनिक इथियोपिया के साथ अनावश्यक रूप से समान ठहराने से बचने के लिए लिप्यंतरण किया गया है।
- source_word: וְהַלּוּבִים
  choice: और लूबी
  rationale: मूल जातिनाम के निकट रहने तथा बाद के लीबिया से उसकी पहचान को निश्चित न मानने के लिए लिप्यंतरण रखा गया है।
- source_word: הָיוּ לְחַיִל לָרֹב
  choice: एक बहुत बड़ी सेना नहीं थे
  rationale: यहाँ חַיִל सैन्य बल या सेना को और לָרֹב उसके बड़े आकार को व्यक्त करता है; हिंदी में 'बहुत बड़ी सेना' स्पष्ट और स्वाभाविक है।
- source_word: לְרֶכֶב וּלְפָרָשִׁים לְהַרְבֵּה מְאֹד
  choice: जिनके पास बहुत बड़ी संख्या में रथ और घुड़सवार थे
  rationale: वाक्यांश सैन्य साधनों की अत्यधिक संख्या बताता है; 'घुड़सवार' मूल की ठोस छवि को बनाए रखता है।
- source_word: וּבְהִשָּׁעֶנְךָ עַל
  choice: फिर भी जब तुमने ... पर भरोसा किया
  rationale: क्रिया का मूल रूपक 'टेक लगाना' है, पर प्रसंग में आश्रय और निर्भरता का भाव है; 'भरोसा किया' वर्तमान हिंदी में स्वाभाविक है। 'फिर भी' तर्क में निहित विरोध को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- source_word: נְתָנָם בְּיָדֶךָ
  choice: उसने उन्हें तुम्हारे हाथ में कर दिया
  rationale: यह विजय और शत्रु पर अधिकार देने का इब्रानी मुहावरा है; हिंदी में इसका चित्रात्मक रूप समझ में आता है और मूल के निकट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों में व्यापक रूप से पहचाने जाने वाले 'यहोवा' रूप को रखा गया है, उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया।
- issue: भरोसे और विजय के बीच संबंध
  choice: जब तुमने यहोवा पर भरोसा किया, तो उसने...
  alternative: क्योंकि तुमने यहोवा पर भरोसा किया, इसलिए उसने...
  rationale: בְּ + infinitive परिस्थिति या समय को व्यक्त कर सकता है। कारणात्मक अर्थ संभव है, पर उसे अधिक स्पष्ट करके मूल की व्याकरणिक गुंजाइश को सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी। अलंकारिक प्रश्न, सैन्य चित्र और 'हाथ में कर दिया' वाला इब्रानी मुहावरा सुरक्षित रखा गया है।
