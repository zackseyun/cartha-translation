  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी मृत्यु-सूचक रूपक को सुरक्षित रखते हुए उसके तुरंत बाद आने वाले स्पष्ट कथन ‘मर गया’ को भी ज्यों का त्यों व्यक्त किया गया है।
