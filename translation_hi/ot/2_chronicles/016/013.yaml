  yaml_path: translation/ot/2_chronicles/016/013.yaml
  text: And Asa slept with his fathers and died in the forty-first year of his reign[a].
translation:
  language: hi
  text: आसा अपने पुरखाओं के साथ सो गया[a] और अपने शासन के इकतालीसवें वर्ष में मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने पुरखाओं के साथ सो गया।” यह मृत्यु के लिए प्रयुक्त एक प्रचलित इब्रानी अभिव्यक्ति है।'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी राजकीय वृत्तांतों में यह मृत्यु का प्रचलित रूपक है। अगले क्रियापद में मृत्यु स्पष्ट रूप से कही गई है, इसलिए इस रूपक को बनाए रखा गया है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह मृत्यु और अपने पूर्वजों से जा मिलने का पारिवारिक-वंशगत सूत्र है। आधुनिक हिन्दी में ‘पुरखाओं’ से इसका भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות का सीधा अर्थ है; मूल पाठ में रूपक के साथ मृत्यु का स्पष्ट कथन भी है, इसलिए दोनों रखे गए हैं।
- source_word: בִּשְׁנַת אַרְבָּעִים וְאַחַת
  choice: इकतालीसवें वर्ष में
  rationale: राजकीय कालगणना में प्रयुक्त इब्रानी संख्या का स्वाभाविक हिन्दी क्रमवाचक रूप।
- source_word: לְמָלְכוֹ
  choice: अपने शासन के
  rationale: यह आसा के राजा के रूप में शासन करने की अवधि को दर्शाता है; ‘शासन’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions: []
