language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִ֗יא בָּ֚א חֲנָ֣נִי הָ/רֹאֶ֔ה אֶל אָסָ֖א מֶ֣לֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֵלָ֗י/ו בְּ/הִשָּׁ֨עֶנְ/ךָ֜ עַל מֶ֤לֶךְ אֲרָם֙ וְ/לֹ֤א נִשְׁעַ֨נְתָּ֙ עַל יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל כֵּ֗ן נִמְלַ֛ט חֵ֥יל מֶֽלֶךְ אֲרָ֖ם מִ/יָּדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/016/007.yaml
  text: At that time Hanani the seer came to Asa king of Judah and said to him[a], “Because you relied on the king of Aram and did not rely on Yahweh your God, therefore the army of the king of Aram has escaped from your hand.”
translation:
  language: hi
  text: उस समय द्रष्टा हनानी यहूदा के राजा आसा के पास आया और उससे कहा, “तुमने अराम के राजा[a] पर भरोसा किया और अपने परमेश्वर याहवे पर भरोसा नहीं किया। इसी कारण अराम के राजा की सेना तुम्हारे हाथ से बच निकली है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सीरिया का राजा।” इब्रानी में “अराम” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָעֵת הַהִיא
  choice: उस समय
  rationale: यह स्वाभाविक हिन्दी में प्रसंग का काल-सूचक आरम्भ है; आरम्भिक संयोजक को अलग से ‘और’ कहने की आवश्यकता नहीं है।
- source_word: הָרֹאֶה
  choice: द्रष्टा
  rationale: यह विशिष्ट भविष्यदर्शी पदवी को ‘नबी’ में सामान्यीकृत किए बिना व्यक्त करता है।
- source_word: בְּהִשָּׁעֶנְךָ ... וְלֹא נִשְׁעַנְתָּ
  choice: तुमने ... पर भरोसा किया और ... पर भरोसा नहीं किया
  rationale: दोनों समान इब्रानी क्रियाओं की पुनरावृत्ति बनाए रखते हुए राजनीतिक और धार्मिक निर्भरता का अर्थ स्पष्ट करता है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: इब्रानी में आए प्राचीन भौगोलिक नाम ‘अराम’ को सीधे सुरक्षित रखता है; ‘सीरिया’ बाद का प्रचलित समतुल्य है।
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे
  rationale: दिव्य नाम को पदवी से बदलने के बजाय हिन्दी में ‘याहवे’ रूप में लिप्यंतरित किया गया है; संबंधवाचक भाव स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: आसा के भरोसे और उसके सैन्य परिणाम के बीच स्पष्ट कारण-परिणाम संबंध व्यक्त करता है।
- source_word: נִמְלַט
  choice: बच निकली है
  rationale: पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम को व्यक्त करता है; सैन्य प्रसंग में यह स्वाभाविक है।
- source_word: חֵיל מֶלֶךְ אֲרָם
  choice: अराम के राजा की सेना
  rationale: यहाँ חֵיל का संदर्भ सैन्य बल से है, जिसे सामान्य पाठक के लिए ‘सेना’ स्पष्ट रूप से व्यक्त करता है।
- source_word: מִיָּדֶךָ
  choice: तुम्हारे हाथ से
  rationale: मूल रूपक को सुरक्षित रखता है और हिन्दी में अधिकार या नियंत्रण से निकल जाने का अर्थ सहज रूप से देता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना स्रोत-पारदर्शी रूप में प्रस्तुत करता है।
- issue: आसा की विफलता में मानवीय और परमेश्वरीय भरोसे का विरोध
  choice: दोनों खंडों में ‘भरोसा’ की पुनरावृत्ति
  alternative: पहले खंड में ‘सहारा लिया’ और दूसरे में ‘भरोसा नहीं किया’
  rationale: समान इब्रानी धातु की पुनरावृत्ति आरोप के धर्मवैचारिक तनाव को स्पष्ट रखती है और व्याख्यात्मक भेद नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजा को संबोधित इब्रानी एकवचन रूप को ‘तुम’ से व्यक्त किया गया है; अत्यधिक औपचारिक ‘आप’ मूल की संख्या-सूचना को धुंधला कर सकता था। ‘द्रष्टा’ विशिष्ट पदवी को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुकूल है।
