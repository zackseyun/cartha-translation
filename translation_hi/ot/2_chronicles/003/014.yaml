  yaml_path: translation/ot/2_chronicles/003/014.yaml
  text: He made the curtain of blue[a], purple, crimson, and fine linen[c][b], and worked cherubim on it.
translation:
  language: hi
  text: उसने नीले, बैंगनी और गहरे लाल रंग के कपड़े तथा महीन सन से परदा[b] बनाया और उस पर करूबों की आकृतियाँ बनाईं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या ‘विभाजक परदा’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, ‘उसने उस पर करूबों को चढ़ाया’; अर्थात उसने उसे करूबों की आकृतियों से सजाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: परदा
  rationale: यह शब्द पवित्रस्थान के भीतर विभाजन करने वाले वस्त्र के परदे को दर्शाता है। आधुनिक हिन्दी में ‘परदा’ स्वाभाविक और स्पष्ट है।
- source_word: תְּכֵלֶת
  choice: नीले
  rationale: यह नीले अथवा नीले-बैंगनी रंग से रंगी सामग्री को दर्शाता है; रंगों की इस सूची में ‘नीले’ संक्षिप्त और स्वाभाविक है।
- source_word: אַרְגָּמָן
  choice: बैंगनी
  rationale: यह बहुमूल्य बैंगनी रंग से रंगी सामग्री के लिए प्रचलित अर्थ है।
- source_word: כַרְמִיל
  choice: गहरे लाल
  rationale: यह लाल रंग की रंगी हुई सामग्री को दर्शाता है; ‘गहरे लाल’ सम्भावित रंग-छटा को सहज हिन्दी में व्यक्त करता है, जबकि ‘सुर्ख लाल’ वैकल्पिक अनुवाद है।
- source_word: בּוּץ
  choice: उत्तम मलमल
  rationale: यह साधारण कपड़े के बजाय उच्च कोटि के महीन सन-वस्त्र को सूचित करता है; ‘उत्तम मलमल’ आधुनिक पाठक के लिए उसकी महीनता और गुणवत्ता दोनों व्यक्त करता है।
- source_word: וַיַּעַל עָלָיו כְּרוּבִים
  choice: उस पर करूबों की आकृतियाँ बनाईं
  rationale: शाब्दिक मुहावरा ‘उस पर करूबों को चढ़ाया’ है, पर प्रसंग में आशय परदे को करूबों की आकृतियों से सजाना है। यह अनुवाद कारीगरी का अर्थ देता है, पर उसकी विधि को अनावश्यक रूप से कढ़ाई नहीं ठहराता।
- source_word: כְּרוּבִים
  choice: करूबों
  rationale: ‘करूब’ बाइबलीय और मन्दिर-संबंधी पारिभाषिक शब्द को बनाए रखता है तथा इसे सामान्य पंखदार बालक जैसी बाद की छवि से अलग रखता है।
