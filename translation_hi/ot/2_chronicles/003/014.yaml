  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। रंगों को विशेषण-रूप में और בּוּץ को ‘उत्तम मलमल’ के रूप में प्रस्तुत किया गया है। ‘आकृतियाँ बनाईं’ मूल मुहावरे का अर्थ स्पष्ट करता है, पर कारीगरी की निश्चित तकनीक नहीं जोड़ता।
