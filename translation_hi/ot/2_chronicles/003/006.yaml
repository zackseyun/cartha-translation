  yaml_path: translation/ot/2_chronicles/003/006.yaml
  text: He overlaid the house with precious stones for beauty[b][a], and the gold was gold from Parvaim.
translation:
  language: hi
  text: उसने भवन[a] को शोभा के लिए बहुमूल्य पत्थरों से मढ़ा, और सोना परवायिम का सोना था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘भवन’ का शाब्दिक अर्थ ‘घर’ है; इतिहास-वृत्तांत में यह मन्दिर के लिए प्रचलित संज्ञा है।
    reason: lexical_alternative
  - marker: b
    text: परवायिम की पहचान निश्चित नहीं है। इसका अर्थ ‘परवायिम का सोना’ या ‘परवायिम से आया सोना’ हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: सजाया
  rationale: צפה का मूल भाव किसी सतह पर सामग्री चढ़ाना है। यहाँ पत्थरों के संदर्भ में स्वाभाविक हिन्दी के लिए ‘से सजाया’ उस अलंकरणात्मक आवरण को व्यक्त करता है; ‘मढ़ा’ भी संभव है, पर पत्थरों के साथ कुछ कम सहज लगता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘घर’ है और इतिहास-वृत्तांत में यह मन्दिर के लिए प्रयुक्त होता है। ‘भवन’ स्रोत की रूपकात्मक संज्ञा को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: אֶבֶן יְקָרָה
  choice: बहुमूल्य पत्थरों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में है। हिन्दी में निर्माण और सजावट की सामग्री के लिए बहुवचन ‘बहुमूल्य पत्थर’ स्वाभाविक है।
- source_word: לְתִפְאָרֶת
  choice: शोभा देने के लिए
  rationale: यह उद्देश्य बताता है और सौन्दर्य, अलंकरण तथा वैभव का भाव रखता है। ‘शोभा देने के लिए’ स्पष्ट और सहज हिन्दी है।
- source_word: וְהַזָּהָב
  choice: और सोना
  rationale: समुच्चय को सरलता से रखते हुए अगली उपवाक्य में प्रयुक्त सोने की पहचान बताई गई है।
- source_word: זְהַב פַּרְוָיִם
  choice: परवायिम का सोना
  rationale: सम्बन्धसूचक रचना उद्गम या जुड़ाव बता सकती है। स्थान की पहचान अनिश्चित होने के कारण ‘परवायिम का सोना’ मूल की अस्पष्टता को ‘से आया’ कहने की अपेक्षा बेहतर बनाए रखता है।
