base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/011.yaml
  text: 'The wings of the cherubim were twenty cubits long: one wing was five cubits[a], reaching to the wall of the house, and the other wing was five cubits[b], reaching to the wing of the other cherub.'
translation:
  language: hi
  text: करूबों के पंखों की लंबाई बीस हाथ थी। एक पंख पाँच हाथ लंबा था और भवन की दीवार तक पहुँचता था[a], और दूसरा पंख पाँच हाथ लंबा था[b] और दूसरे करूब के पंख तक पहुँचता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भवन की दीवार को छूता था ... दूसरे करूब के पंख को छूता था।” इब्रानी कृदंत किसी बिंदु तक फैलने के साथ-साथ वास्तविक स्पर्श पर भी बल दे सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘भवन’ से मंदिर की इमारत अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וְכַנְפֵי הַכְּרוּבִים
  choice: करूबों के पंख
  rationale: बहुवचन रचना को स्वाभाविक हिन्दी में रखा गया है; ‘करूब’ इन स्वर्गीय प्राणियों के लिए प्रचलित लिप्यंतरण है। आरंभिक संयोजक को हिन्दी प्रवाह के लिए अलग से व्यक्त नहीं किया गया।
- source_word: אָרְכָּם אַמּוֹת עֶשְׂרִים
  choice: पंखों की कुल लंबाई बीस हाथ थी
  rationale: शाब्दिक ‘उनकी लंबाई’ संदर्भ में दोनों करूबों के फैलाए हुए पंखों की सम्मिलित माप बताता है; ‘कुल’ वास्तु-विवरण को स्पष्ट करता है और अगले दो पाँच-पाँच हाथ के पंखों से उसका संबंध बनाए रखता है।
- source_word: אַמּוֹת
  choice: हाथ
  rationale: प्राचीन माप ‘क्यूबिट’ के लिए हिन्दी बाइबलीय और सामान्यतः समझ में आने वाला पारंपरिक शब्द ‘हाथ’ चुना गया है; आधुनिक इकाई में अनुमानित परिवर्तन नहीं किया गया।
- source_word: כְּנַף הָאֶחָד לְאַמּוֹת חָמֵשׁ
  choice: एक पंख पाँच हाथ लंबा था
  rationale: इब्रानी की संक्षिप्त माप-वाक्य रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מַגַּעַת / מַגִּיעַ
  choice: तक पहुँचता था
  rationale: נגע के कृदंत यहाँ किसी सीमा तक विस्तार और संभवतः वास्तविक स्पर्श, दोनों का संकेत दे सकते हैं। मुख्य पाठ में स्वाभाविक ‘पहुँचता था’ रखा गया और ‘छूता था’ की संभावना पादटिप्पणी में सुरक्षित की गई है।
- source_word: לְקִיר הַבַּיִת
  choice: भवन की दीवार तक
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ मंदिर की इमारत अभिप्रेत है। ‘भवन’ आधुनिक हिन्दी में वास्तु-संदर्भ को स्पष्ट रखते हुए स्रोत की शब्दावली के निकट है।
- source_word: וְהַכָּנָף הָאַחֶרֶת
  choice: और दूसरा पंख
  rationale: אַחֶרֶת का अर्थ ‘दूसरा/अन्य’ है; दो पंखों के उल्लेख में ‘दूसरा’ स्वाभाविक हिन्दी है।
- source_word: לִכְנַף הַכְּרוּב הָאַחֵר
  choice: दूसरे करूब के पंख तक
  rationale: एकवचन करूब और उसके पंख के साथ संबंध को सीधे और स्पष्ट रूप में रखा गया है।
