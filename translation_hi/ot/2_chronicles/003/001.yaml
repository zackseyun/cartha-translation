  text: וַ/יָּ֣חֶל שְׁלֹמֹ֗ה לִ/בְנ֤וֹת אֶת בֵּית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם בְּ/הַר֙ הַ/מּ֣וֹרִיָּ֔ה אֲשֶׁ֥ר נִרְאָ֖ה לְ/דָוִ֣יד אָבִ֑י/הוּ אֲשֶׁ֤ר הֵכִין֙ בִּ/מְק֣וֹם דָּוִ֔יד בְּ/גֹ֖רֶן אָרְנָ֥ן הַ/יְבוּסִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/001.yaml
  text: Then Solomon began to build the house of Yahweh in Jerusalem on Mount Moriah[a], where Yahweh had appeared to David his father, at the place that David had prepared[b], on the threshing floor of Ornan the Jebusite.
translation:
  language: hi
  text: तब सुलैमान ने यरूशलेम में मोरिय्याह पर्वत पर याहवे का भवन बनाना आरम्भ किया, जहाँ याहवे उसके पिता दाऊद को दिखाई दिए थे, उस स्थान पर जिसे दाऊद ने तैयार किया था—यबूसी ओर्नान के खलिहान पर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּחֶל ... לִבְנוֹת
  choice: बनाना आरम्भ किया
  rationale: आरम्भसूचक क्रिया और उसके बाद आए उद्देश्यवाचक रूप को स्वाभाविक हिन्दी में व्यक्त करता है तथा कथानक की अगली घटना को आगे बढ़ाता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ हिब्रू ‘घर’ की उपमा को बनाए रखता है; प्रसंग से स्पष्ट है कि यह मन्दिर है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְּהַר הַמּוֹרִיָּה
  choice: मोरिय्याह पर्वत पर
  rationale: विशिष्ट स्थलनाम और स्थानसूचक अर्थ का सीधा, प्रचलित हिन्दी रूप।
- source_word: אֲשֶׁר נִרְאָה לְדָוִיד אָבִיהוּ
  choice: वहीं याहवे उसके पिता दाऊद को दिखाई दिए थे
  rationale: निफ़अल रूप को ईश-दर्शन के प्रसंग में ‘दिखाई दिए’ किया गया है। हिब्रू में कर्ता व्यक्त नहीं है, पर निकटतम प्रसंग उसे याहवे समझता है; हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए नाम स्पष्ट किया गया है।
- source_word: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד
  choice: उस स्थान पर ... जिसे दाऊद ने तैयार किया था
  rationale: अत्यंत संक्षिप्त और कठिन हिब्रू वाक्यांश का पारंपरिक प्रसंगानुकूल अर्थ देता है; पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: בְּגֹרֶן אָרְנָן הַיְבוּסִי
  choice: यबूसी ओर्नान के खलिहान पर
  rationale: गोरन खुले समतल दँवाई-स्थल को सूचित करता है; ‘पर’ उसके स्थानगत प्रयोग के लिए स्वाभाविक है। इतिहासवृत्त में प्रयुक्त नामरूप ‘ओर्नान’ सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: נִרְאָה का अंतर्निहित कर्ता
  choice: याहवे उसके पिता दाऊद को दिखाई दिए थे
  alternative: वह उसके पिता दाऊद को दिखाई दिया था; वह स्थान उसके पिता दाऊद को दिखाया गया था
  rationale: इस प्रसंग में ईश-दर्शन सबसे स्वाभाविक समझ है, पर निफ़अल रूप और अनुपस्थित स्पष्ट कर्ता के कारण व्याकरणिक तनाव को निर्णय-सूची में दर्ज रखा गया है।
- issue: אֲשֶׁר הֵכִין בִּמְקוֹם דָּוִיד की संक्षिप्त रचना
  choice: जिसे दाऊद ने तैयार किया था
  alternative: जिसे उसने दाऊद के स्थान पर तैयार किया था; जहाँ दाऊद के लिए स्थान तैयार किया गया था
  rationale: मुख्य पाठ प्रसंग में दाऊद द्वारा मन्दिर-स्थल तैयार किए जाने की सामान्य समझ अपनाता है, जबकि हिब्रू शब्दक्रम से उत्पन्न अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण गद्य। लम्बे हिब्रू वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। ‘भवन’ से मूल की घर-वाली छवि बची रहती है, जबकि ‘खलिहान’ सामान्य पाठक के लिए समझने योग्य है।
