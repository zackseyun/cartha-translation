base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/017.yaml
  text: He set up the pillars in front of the nave[a], one on the right and one on the left; and he called the name of the one on the right Jachin, and the name of the one on the left Boaz.
translation:
  language: hi
  text: उसने मंदिर के मुख्य सभागार[a] के सामने खंभों को खड़ा किया—एक दाहिनी ओर और एक बाईं ओर। उसने दाहिनी ओर के खंभे का नाम याकीन और बाईं ओर के खंभे का नाम बोअज़ रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मंदिर के मुख्य भवन’। यहाँ हिब्रू शब्द हेखाल पूरे मंदिर-परिसर के बजाय मंदिर के मुख्य सभागार को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: खड़ा किया
  rationale: हिफ़ील रूप यहाँ खम्भों को उनके स्थान पर स्थापित करके खड़ा करने का भाव देता है; यह हिन्दी में स्वाभाविक और निर्माण-संदर्भ के अनुकूल है।
- source_word: הָעַמּוּדִים
  choice: खम्भों
  rationale: यह शब्द स्थापत्य के स्तम्भों या खम्भों को दर्शाता है। साधारण आधुनिक हिन्दी में ‘खम्भे’ अधिक सहज है।
- source_word: עַל פְּנֵי הַהֵיכָל
  choice: मन्दिर के मुख्य भवन के सामने
  rationale: הֵיכָל यहाँ पूरे मन्दिर-परिसर के बजाय मन्दिर के मुख्य सभागार/भवन को सूचित करता है; ‘के सामने’ स्थानिक अर्थ को सुरक्षित रखता है।
- source_word: אֶחָד מִיָּמִין וְאֶחָד מֵהַשְּׂמֹאול
  choice: एक दाहिनी ओर और एक बाईं ओर
  rationale: मूल पाठ साधारण दाएँ-बाएँ की भाषा प्रयोग करता है, स्पष्ट दिशाओं की नहीं; अनुवाद भी यही अस्पष्ट अभिमुखता बनाए रखता है।
- source_word: וַיִּקְרָא שֵׁם
  choice: नाम ... रखा
  rationale: यह हिब्रू नामकरण-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: הַיְמִינִי
  choice: दाहिनी ओर के खम्भे
  rationale: विशेषण दाहिनी ओर स्थित वस्तु को बताता है; हिन्दी में संज्ञा दोहराने से सन्दर्भ स्पष्ट और सहज रहता है।
- source_word: יָכִין
  choice: याकीन
  rationale: हिब्रू व्यक्तिवाचक नाम का देवनागरी लिप्यन्तरण; प्रारम्भिक व्यंजन योड को ‘या’ और כ को ‘क’ से व्यक्त किया गया है।
- source_word: הַשְּׂמָאלִי
  choice: बाईं ओर के खम्भे
  rationale: यह बाईं ओर स्थित खम्भे को सूचित करता है; समानान्तर हिन्दी संरचना स्पष्टता बनाए रखती है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: हिब्रू नाम का ऐसा देवनागरी लिप्यन्तरण जो दोनों स्वर-खंडों को पहचानने योग्य रखता है।
