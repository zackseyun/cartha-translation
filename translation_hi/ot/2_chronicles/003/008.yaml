  yaml_path: translation/ot/2_chronicles/003/008.yaml
  text: He made the Most Holy Place[a], its length corresponding to the width of the house, twenty cubits, and its width twenty cubits; and he overlaid it with fine gold[b], six hundred talents.
translation:
  language: hi
  text: उसने परमपवित्र स्थान[a] बनाया। उसकी लंबाई भवन की चौड़ाई के बराबर बीस हाथ थी, और उसकी चौड़ाई भी बीस हाथ थी। उसने उसे छह सौ किक्कार के उत्तम सोने से मढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रतम स्थान’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह इब्रानी संबंध-पदबंध सबसे भीतरी पवित्र स्थान के लिए प्रयुक्त अतिशयोक्तिपरक मुहावरा है। ‘परमपवित्र स्थान’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: אָרְכּוֹ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: उसकी लंबाई भवन की चौड़ाई के बराबर
  rationale: स्थापत्य-संदर्भ में עַל־פְּנֵי यहाँ कमरे की लंबाई और भवन की चौड़ाई के अनुरूपता-संबंध को व्यक्त करता है।
- source_word: אַמּוֹת עֶשְׂרִים
  choice: बीस हाथ
  rationale: ‘हाथ’ हिन्दी में प्राचीन ‘क्यूबिट’ के लिए स्वाभाविक पारंपरिक माप-शब्द है और मूल पाठ की माप-पद्धति को बनाए रखता है।
- source_word: וַיְחַפֵּהוּ
  choice: उसे ... से मढ़ा
  rationale: मंदिर-निर्माण के संदर्भ में क्रिया का अर्थ किसी सतह पर सोने की परत चढ़ाना है; ‘मढ़ा’ हिन्दी में इसका सटीक स्थापत्य-शिल्प संबंधी रूप है।
- source_word: זָהָב טוֹב
  choice: उत्तम सोना
  rationale: טוֹב यहाँ सोने की उच्च गुणवत्ता बताता है; ‘उत्तम’ स्पष्ट है और ‘शुद्ध’ कहकर धातु की ऐसी विशिष्ट शुद्धता नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: לְכִכָּרִים שֵׁשׁ מֵאוֹת
  choice: छः सौ किक्कार
  rationale: לְ यहाँ प्रयुक्त सोने की कुल मात्रा सूचित करता है। ‘किक्कार’ मूल प्राचीन भार-इकाई को बिना अनुमानित आधुनिक रूपांतरण के सुरक्षित रखता है।
