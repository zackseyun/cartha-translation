translation:
  language: hi
  text: उसने परमपवित्र स्थान में दो करूब बनाए—मूर्तिकला की कृतियाँ—और उन्हें सोने से मढ़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान में
  rationale: शाब्दिक संरचना ‘पवित्रताओं की पवित्रता के भवन में’ इब्रानी का परमश्रेष्ठता-सूचक मुहावरा है और भीतरी पवित्रतम कक्ष को दर्शाती है। ‘परमपवित्र स्थान’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित रूप है।
- source_word: כְּרוּבִים שְׁנַיִם
  choice: दो करूब
  rationale: ‘करूब’ इब्रानी כְּרוּב का प्रचलित हिन्दी लिप्यंतरण है; हिन्दी में संख्या के बाद इसका रूप अपरिवर्तित रखना स्वाभाविक है।
- source_word: מַעֲשֵׂה צַעֲצֻעִים
  choice: मूर्तिकला की कारीगरी
  rationale: मַעֲשֵׂה किसी निर्मित कार्य या कारीगरी को बताता है। दुर्लभ צַעֲצֻעִים का सटीक अर्थ अनिश्चित है, पर प्रसंग में यह कारीगर के बजाय मूर्त या गढ़े हुए काम की विधा अथवा उत्पाद को अधिक स्वाभाविक रूप से दर्शाता है।
- source_word: וַיְצַפּוּ אֹתָם זָהָב
  choice: और उन्हें सोने से मढ़ दिया
  rationale: पिएल रूप में צפה धातु किसी वस्तु पर धातु की परत चढ़ाने को दर्शाती है; स्थापत्य प्रसंग में ‘सोने से मढ़ना’ सटीक और स्वाभाविक हिन्दी है।
