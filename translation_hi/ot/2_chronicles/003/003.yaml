base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/003.yaml
  text: 'These are the foundations Solomon laid for building the house of God: the length in cubits[a], according to the former measure, was sixty cubits[c][b], and the width twenty cubits.'
translation:
  language: hi
  text: परमेश्वर का भवन बनाने के लिए सुलैमान ने जो आधार रखे, वे ये हैं:[a] पुराने मान के अनुसार उसकी लंबाई साठ हाथ और चौड़ाई बीस हाथ थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आधार रखे’ के पीछे का इब्रानी रूप कुछ कठिन है। इसका अर्थ ‘नींव रखी’ या अधिक सामान्य रूप से निर्माण की आधार-योजना भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पुराने मान के अनुसार’ संभवतः पहले प्रचलित हाथ के किसी मानक को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הוּסַד
  choice: नींव डाली
  rationale: यह יסד धातु का कठिन रूप है। निर्माण-संदर्भ में ‘नींव डाली’ स्वाभाविक है और क्रिया के मूल भाव को बनाए रखता है; आगे दिए गए माप उसी आरंभिक निर्माण-विवरण को स्पष्ट करते हैं।
- source_word: לִבְנוֹת
  choice: बनाने के लिए
  rationale: ל उपसर्ग सहित infinitive construct प्रयोजन व्यक्त करता है; आधुनिक हिन्दी में ‘बनाने के लिए’ इसका सहज रूप है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह स्रोत के ‘परमेश्वर के घर/भवन’ वाले रूपक को बनाए रखता है और मंदिर-संदर्भ में dignified तथा स्पष्ट है।
- source_word: הָאֹרֶךְ
  choice: लंबाई
  rationale: वास्तु-माप के संदर्भ में इसका सामान्य हिन्दी समतुल्य ‘लंबाई’ है।
- source_word: אַמּוֹת
  choice: हाथ
  rationale: अम्मा प्राचीन लंबाई की इकाई है; हिन्दी बाइबलीय प्रयोग में ‘हाथ’ समझने योग्य पारंपरिक समतुल्य है। इसे आधुनिक इकाई में बदलने से ऐतिहासिक माप की अनिश्चितता दब जाती।
- source_word: בַּמִּדָּה הָרִאשׁוֹנָה
  choice: पुराने माप के हाथ के अनुसार
  rationale: यह वाक्यांश संभवतः पहले या पुराने मानक के हाथ को सूचित करता है। यह रूप उस ऐतिहासिक संकेत को रखता है, पर उसकी ठीक पहचान निश्चित नहीं करता।
- source_word: שִׁשִּׁים
  choice: साठ
  rationale: मंदिर की लंबाई बताने वाली संख्या।
- source_word: וְרֹחַב
  choice: और चौड़ाई
  rationale: ‘लंबाई’ के समानांतर स्वाभाविक वास्तु-शब्दावली।
- source_word: עֶשְׂרִים
  choice: बीस
  rationale: मंदिर की चौड़ाई बताने वाली संख्या।
