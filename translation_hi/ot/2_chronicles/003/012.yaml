  yaml_path: translation/ot/2_chronicles/003/012.yaml
  text: The wing of the one cherub was five cubits[a], reaching to the wall of the house; and the other wing was five cubits[b], touching the wing of the other cherub.
translation:
  language: hi
  text: एक करूब का पंख पाँच हाथ[a] लंबा था और भवन[b] की दीवार तक पहुँचता था; उसका दूसरा पंख भी पाँच हाथ लंबा था और दूसरे करूब के पंख से सटा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ प्राचीन लंबाई की एक इकाई है।
    reason: measurement_note
  - marker: b
    text: यहाँ ‘भवन’ से मंदिर का मुख्य भवन अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: כְנַף
  choice: पंख
  rationale: करूबों और मंदिर की बनावट के इस प्रसंग में इसका ठोस अर्थ ‘पंख’ है।
- source_word: כְּרוּב
  choice: करूब
  rationale: इब्रानी संज्ञा यहाँ एकवचन है; इसलिए एक आकृति के लिए ‘करूब’ रखा गया है।
- source_word: אַמּוֹת חָמֵשׁ
  choice: पाँच हाथ
  rationale: प्राचीन माप को हिन्दी में प्रचलित बाइबलीय इकाई ‘हाथ’ द्वारा व्यक्त किया गया है; आधुनिक अनुमान फुटनोट में दिया गया है।
- source_word: מַגִּיעַ
  choice: तक पहुँचता था
  rationale: यह पंख के भवन की दीवार तक फैले होने और वहाँ पहुँचने का स्थानिक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קִיר הַבָּיִת
  choice: भवन की दीवार
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; प्रसंग में यह मंदिर के मुख्य भवन को सूचित करता है। ‘भवन’ मूल अर्थ और स्थापत्य संदर्भ दोनों को बनाए रखता है।
- source_word: הַכָּנָף הָאַחֶרֶת
  choice: उसका दूसरा पंख
  rationale: यह उसी करूब के अन्य पंख को स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है।
- source_word: דְּבֵקָה
  choice: से सटा हुआ था
  rationale: यह दोनों पंखों के निकट संपर्क को व्यक्त करता है, पर उन्हें यांत्रिक रूप से जोड़े जाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הַכְּרוּב הָאַחֵר
  choice: दूसरे करूब
  rationale: यह दो करूबों के परस्पर संबंध को रखते हुए ‘अन्य/दूसरे’ का स्वाभाविक हिन्दी रूप है।
