lexical_decisions:
- source_word: וַיָּחֶל
  choice: उसने … आरम्भ किया
  rationale: हिफ़ील रूप कार्य के आरम्भ को व्यक्त करता है। हिन्दी कथात्मक शैली में आरम्भिक संयोजक का अलग अनुवाद आवश्यक नहीं है।
- source_word: לִבְנוֹת
  choice: निर्माण करना
  rationale: בנה का सीधा अर्थ बनाना या निर्माण करना है; यहाँ भवन-निर्माण के प्रसंग में ‘निर्माण करना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने
  rationale: यह निर्माण आरम्भ होने का महीना बताने वाला कालवाचक पद है।
- source_word: בַּשֵּׁנִי
  choice: दूसरे दिन
  rationale: इब्रानी में दोहराया गया क्रमवाचक शब्द संक्षिप्त है और सामान्यतः महीने के दूसरे दिन के अर्थ में समझा जाता है; मुख्य पाठ में ‘दिन’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि पादटिप्पणी मूल की संक्षिप्तता सुरक्षित रखती है।
- source_word: בִּשְׁנַת אַרְבַּע
  choice: चौथे वर्ष
  rationale: यह राजकीय कालगणना का सामान्य सूत्र है।
- source_word: לְמַלְכוּתוֹ
  choice: अपने राज्य के
  rationale: यह उसके राजकीय शासनकाल को कालगणना का आधार बनाता है। ‘अपने राज्य के चौथे वर्ष’ आधुनिक हिन्दी में स्वाभाविक है और मूल के आशय को व्यक्त करता है।
