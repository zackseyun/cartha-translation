  text: וַ/יְחַ֨ף אֶת הַ/בַּ֜יִת הַ/קֹּר֧וֹת הַ/סִּפִּ֛ים וְ/קִֽירוֹתָ֥י/ו וְ/דַלְתוֹתָ֖י/ו זָהָ֑ב וּ/פִתַּ֥ח כְּרוּבִ֖ים עַל הַ/קִּירֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/007.yaml
  text: He overlaid the house with gold—the beams[a], the thresholds, its walls[d][c][b], and its doors—and he engraved cherubim on the walls.
translation:
  language: hi
  text: उसने भवन को—उसकी कड़ियों, देहलियों, दीवारों और द्वारों को—सोने से मढ़ा और दीवारों पर करूबों की आकृतियाँ उकेरीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחַף
  choice: उसने ... मढ़ा
  rationale: यह क्रिया किसी सतह को सामग्री की परत से ढकने को दर्शाती है; मंदिर-निर्माण के संदर्भ में सोने से ‘मढ़ना’ स्वाभाविक और सटीक है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में शाब्दिक अर्थ ‘घर’ है, पर संदर्भ में यह मंदिर का भवन है। ‘भवन’ मूल रूपक को बहुत दूर किए बिना आधुनिक हिन्दी में स्पष्ट है।
- source_word: הַקֹּרוֹת
  choice: कड़ियों
  rationale: यह शब्द छत अथवा भवन की संरचनात्मक लकड़ियों को सूचित करता है। ‘कड़ियाँ’ वास्तु-संदर्भ में उपयुक्त है और केवल ‘शहतीर’ या ‘राफ्टर’ जैसी अधिक विशिष्ट पहचान नहीं थोपता।
- source_word: הַסִּפִּים
  choice: देहलियों
  rationale: इस पद का अर्थ देहली, चौखट का आधार या द्वार-संरचना हो सकता है। ‘देहलियाँ’ संभावित वास्तु-अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קִירוֹתָיו
  choice: उसकी ... दीवारों
  rationale: बहुवचन संज्ञा पर लगा एकवचन पुल्लिंग संबंधसूचक प्रत्यय भवन की ओर संकेत करता है।
- source_word: דַלְתוֹתָיו
  choice: द्वारों
  rationale: यह शब्द दरवाज़ों अथवा उनके पल्लों को सूचित करता है; ‘द्वार’ गरिमापूर्ण और व्यापक हिन्दी रूप है।
- source_word: זָהָב
  choice: सोने से
  rationale: इब्रानी में सामग्री सूची के बाद आती है; हिन्दी में ‘सोने से मढ़ा’ उसके व्याकरणिक संबंध को स्पष्ट करता है।
- source_word: וּפִתַּח
  choice: आकृतियाँ उकेरीं
  rationale: क्रिया नक्काशी या उत्कीर्णन को सूचित करती है। दीवारों पर सजावटी रूपों के संदर्भ में ‘उकेरीं’ स्वाभाविक है; ‘आकृतियाँ’ हिन्दी वाक्य में कर्म का स्वरूप स्पष्ट करती है।
- source_word: כְּרוּבִים
  choice: करूबों
  rationale: ‘करूब’ मंदिर-संबंधी बाइबलीय प्राणियों के विशिष्ट नाम को सुरक्षित रखता है और उन्हें सामान्य स्वर्गदूत नहीं बनाता।
- source_word: עַל הַקִּירוֹת
  choice: दीवारों पर
  rationale: पूर्वसर्ग यहाँ उकेरी गई आकृतियों के स्थान को दर्शाता है; ‘पर’ इसका सहज हिन्दी रूप है।
