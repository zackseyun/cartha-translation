base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/016.yaml
  text: He made chains in the inner sanctuary and put them on the tops of the pillars[b][a]; he also made one hundred pomegranates and put them on the chains.
translation:
  language: hi
  text: उसने भीतरी पवित्र स्थान[a] में सजावटी ज़ंजीरें[b] बनाईं और उन्हें खम्भों के ऊपरी सिरों पर लगाया। उसने अनार के आकार के सौ आभूषण भी बनाए और उन्हें ज़ंजीरों पर लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भीतरी कक्ष में’; परम्परागत रूप से ‘परमपवित्र स्थान में।’ इब्रानी शब्द मन्दिर के भीतरी पवित्र स्थान को दर्शाता है, हालाँकि यहाँ कुछ लोग इस वाक्यांश को सजावटी काम के सम्बन्ध में अधिक व्यापक अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘ज़ंजीरनुमा सजावट’ अथवा ‘मालाएँ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁרְשְׁרוֹת
  choice: सजावटी ज़ंजीरें
  rationale: यह संज्ञा ज़ंजीर-जैसी अलंकरणकारी कारीगरी को दर्शाती है। ‘सजावटी ज़ंजीरें’ ठोस अर्थ और स्थापत्य-संदर्भ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּדְּבִיר
  choice: भीतरी पवित्रस्थान
  rationale: דְּבִיר मन्दिर के भीतरी पवित्र कक्ष को सूचित करता है। यह चयन स्थानगत अर्थ बनाए रखता है और किसी अधिक व्याख्यात्मक पारम्परिक पद को मुख्य पाठ पर थोपता नहीं।
- source_word: רֹאשׁ הָעַמֻּדִים
  choice: खम्भों के सिरों
  rationale: इब्रानी ‘सिर’ स्थापत्य वस्तुओं के ऊपरी भाग के लिए प्रयुक्त है। हिन्दी में ‘खम्भों के सिरों’ स्वाभाविक और चित्रात्मक है।
- source_word: רִמּוֹנִים
  choice: अनार के आकार के ... आभूषण
  rationale: सन्दर्भ में ये वास्तविक फल नहीं, अनार की आकृति वाले मन्दिर-अलंकरण हैं; स्पष्टता के लिए निहित सजावटी अर्थ व्यक्त किया गया है।
- source_word: מֵאָה
  choice: सौ
  rationale: मूल संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיִּתֵּן בַּשַּׁרְשְׁרוֹת
  choice: उन्हें ज़ंजीरों पर लगाया
  rationale: पूर्वसर्ग यहाँ अनाराकार आभूषणों के ज़ंजीरों से जुड़े होने को सबसे सहज रूप से व्यक्त करता है; ‘पर लगाया’ हिन्दी में स्थापत्य-अलंकरण के लिए स्वाभाविक है।
