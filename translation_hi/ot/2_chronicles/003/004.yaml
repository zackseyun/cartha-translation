base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/004.yaml
  text: The portico that was in front of the house was twenty cubits long[a], corresponding to the width of the house, and its height was one hundred and twenty cubits; and he overlaid its interior with pure gold.
translation:
  language: hi
  text: भवन के सामने का बरामदा बीस हाथ लंबा था, जो भवन की चौड़ाई के बराबर था। उसकी ऊँचाई एक सौ बीस हाथ[a] थी; और उसने उसके भीतर को शुद्ध सोने से मढ़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में बरामदे की ऊँचाई ‘एक सौ बीस’ हाथ दी गई है। 1 राजा 6:3 के समानांतर वर्णन में बरामदे की लंबाई और चौड़ाई तो दी गई है, पर यह ऊँचाई नहीं; इसलिए कुछ व्याख्याकारों को यहाँ पाठ-संबंधी कठिनाई होने का संदेह है। अनुवाद संरक्षित मसोरेटिक पाठ का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: הָאוּלָם
  choice: बरामदा
  rationale: यह शब्द मुख्य भवन के सामने बने प्रवेश-मंडप को दर्शाता है। ‘बरामदा’ आधुनिक हिंदी में सहज और वास्तु-संदर्भ में स्पष्ट है।
- source_word: אֲשֶׁר עַל־פְּנֵי
  choice: के सामने
  rationale: यह पद भवन के आगे स्थित होने का स्थानिक अर्थ व्यक्त करता है।
- source_word: הָאֹרֶךְ עַל־פְּנֵי רֹחַב הַבַּיִת
  choice: बीस हाथ लंबा था, जो भवन की चौड़ाई के बराबर था
  rationale: इब्रानी की संक्षिप्त रचना बरामदे की लंबाई को भवन की चौड़ाई के अनुरूप बताती है; हिंदी में यह वाक्य उस संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: אַמּוֹת עֶשְׂרִים
  choice: बीस हाथ
  rationale: ‘हाथ’ बाइबलीय माप ‘क्यूबिट’ का हिंदी में प्रचलित पारंपरिक रूप है और प्राचीन माप-इकाई को बनाए रखता है।
- source_word: וְהַגֹּבַהּ מֵאָה וְעֶשְׂרִים
  choice: उसकी ऊँचाई एक सौ बीस हाथ थी
  rationale: मसोरेटिक पाठ के अंक को यथावत रखा गया है और संदर्भ से समझी जाने वाली माप-इकाई ‘हाथ’ स्पष्टता के लिए दोहराई गई है।
- source_word: וַיְצַפֵּהוּ
  choice: उसने ... मढ़ दिया
  rationale: צפה का अर्थ किसी सतह पर धातु की परत चढ़ाना है; सोने के वास्तु-अलंकरण के लिए ‘मढ़ना’ सटीक और स्वाभाविक हिंदी है।
- source_word: מִפְּנִימָה
  choice: उसके भीतरी भाग को
  rationale: यह क्रियाविशेषण भीतर की ओर या अंदर की सतह को सूचित करता है; चयनित रूप हिंदी में संदर्भ स्पष्ट करता है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने
  rationale: यह मूल पद का सीधा और स्वाभाविक हिंदी अनुवाद है।
