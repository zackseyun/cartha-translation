  text: וְ/אֵ֣ת הַ/בַּ֣יִת הַ/גָּד֗וֹל חִפָּה֙ עֵ֣ץ בְּרוֹשִׁ֔ים וַ/יְחַפֵּ֖/הוּ זָהָ֣ב ט֑וֹב וַ/יַּ֧עַל עָלָ֛י/ו תִּמֹרִ֖ים וְ/שַׁרְשְׁרֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/005.yaml
  text: He paneled the great house with cypress wood[a], overlaid it with fine gold[b], and put palm trees and chains on it.
translation:
  language: hi
  text: उसने बड़े भवन को सरू की लकड़ी[a] से मढ़ा, फिर उसे उत्तम सोने से मढ़ दिया और उस पर खजूर के पेड़ और जंजीरें[b] लगाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सरू’ के स्थान पर ‘सनोवर’ या ‘देवदार-सदृश वृक्ष’ भी सम्भव है; इब्रानी शब्द בְּרוֹשׁ से अभिप्रेत वृक्ष की सटीक पहचान विवादित है।
    reason: lexical_alternative
  - marker: b
    text: ‘खजूर के पेड़ और जंजीरें’ सम्भवतः भवन पर लगाई गई उनकी सजावटी आकृतियों या नक्काशी को दर्शाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הַבַּיִת הַגָּדוֹל
  choice: बड़ा भवन
  rationale: यह इब्रानी पद शाब्दिक रूप से ‘बड़ा घर’ है, पर मन्दिर-निर्माण के प्रसंग में ‘भवन’ अधिक स्वाभाविक वास्तुशिल्पीय शब्द है; ‘बड़ा’ मूल विशेषण को बनाए रखता है।
- source_word: חִפָּה
  choice: मढ़ा
  rationale: क्रिया का अर्थ ढकना या ऊपर परत चढ़ाना है। लकड़ी और फिर सोने की परत चढ़ाने की निर्माण-प्रक्रिया के लिए ‘मढ़ा’ संक्षिप्त और स्वाभाविक है।
- source_word: עֵץ בְּרוֹשִׁים
  choice: सरू की लकड़ी
  rationale: בְּרוֹשׁ वृक्ष की सटीक पहचान विवादित है। ‘सरू’ प्रचलित अनुवाद है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: זָהָב טוֹב
  choice: उत्तम सोना
  rationale: शाब्दिक अर्थ ‘अच्छा सोना’ है; ‘उत्तम सोना’ आधुनिक हिन्दी में उसकी उच्च गुणवत्ता को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे अनिवार्यतः पूर्णतः शुद्ध बताने के।
- source_word: וַיַּעַל עָלָיו
  choice: उस पर ... लगाईं
  rationale: हिफ़ील रूप यहाँ किसी वस्तु या अलंकरण को सतह पर लगाने के अर्थ में है।
- source_word: תִּמֹרִים
  choice: खजूर के पेड़
  rationale: मूल शब्द खजूर के पेड़ों अथवा उनकी सजावटी आकृतियों को दर्शा सकता है। मुख्य पाठ में सीधा अर्थ रखा गया है और वास्तुशिल्पीय आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שַׁרְשְׁרוֹת
  choice: जंजीरें
  rationale: यह शब्द जंजीरों या जंजीर-जैसी सजावट को दर्शाता है। ‘जंजीरें’ सबसे सीधा अनुवाद है।
