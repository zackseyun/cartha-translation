translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मढ़ा’ लकड़ी की परत और सोने की परत—दोनों के लिए मूल में दोहराई गई क्रिया को प्रतिबिम्बित करता है। वृक्ष की अनिश्चित पहचान और सजावटी रूपों की सम्भावित व्याख्या पादटिप्पणियों में सुरक्षित रखी गई है।
