base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/013.yaml
  text: The wings of these cherubim spread twenty cubits[a], and they stood on their feet, with their faces toward the house.
translation:
  language: hi
  text: इन करूबों के पंख बीस हाथ तक फैले हुए थे। वे अपने पैरों पर खड़े थे और उनके मुख भवन[a] की ओर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मन्दिर।” इब्रानी में “भवन,” जो मन्दिर की इमारत के लिए प्रचलित पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּנְפֵי הַכְּרוּבִים הָאֵלֶּה
  choice: इन करूबों के पंख
  rationale: इब्रानी रचना-संबंध और संकेतवाचक बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है; ‘करूब’ स्थापित बाइबलीय शब्द है।
- source_word: פֹּרְשִׂים
  choice: फैले हुए थे
  rationale: कृदन्त यहाँ पंखों की अवस्था या स्थिति बताता है; हिन्दी में यह रूप वर्णनात्मक भूतकाल के अनुकूल है।
- source_word: אַמּוֹת עֶשְׂרִים
  choice: बीस हाथ तक
  rationale: इब्रानी माप ‘अम्मा’ के लिए हिन्दी बाइबल-परंपरा में सुबोध ‘हाथ’ रखा गया है; ‘तक’ विस्तार का स्वाभाविक बोध देता है, यद्यपि मूल में अलग से चौड़ाई का शब्द नहीं है।
- source_word: וְהֵם עֹמְדִים עַל רַגְלֵיהֶם
  choice: वे अपने पैरों पर खड़े थे
  rationale: सर्वनाम विषय को पंखों से करूबों की ओर फिर ले जाता है और उनकी सीधी खड़ी मुद्रा स्पष्ट करता है।
- source_word: וּפְנֵיהֶם לַבָּיִת
  choice: और उनके मुख भवन की ओर थे
  rationale: ‘मुख’ dignified और सहज है; ‘की ओर’ दिशा को व्यक्त करता है। בַּיִת का मूल अर्थ सुरक्षित रखने के लिए ‘भवन’ चुना गया है, जबकि संदर्भ में यह मन्दिर-भवन है।
theological_decisions:
- issue: मन्दिर-निर्माण के संदर्भ में בַּיִת का अनुवाद
  choice: भवन
  alternative: मन्दिर
  rationale: इब्रानी में सामान्य शब्द ‘घर/भवन’ है, जो यहाँ मन्दिर के लिए प्रचलित पदनाम है। ‘भवन’ मूल शब्द की बनावट बचाता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और वर्णनात्मक शैली। ‘करूब’ तथा ‘हाथ’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं।
