base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/003/015.yaml
  text: In front of the house he made two pillars[a], thirty-five cubits high[b], and the capital that was on the top of each was five cubits.
translation:
  language: hi
  text: उसने मन्दिर के सामने दो खम्भे बनाए। उनकी लम्बाई पैंतीस हाथ थी[b], और हर एक के शीर्ष पर[a] पाँच हाथ का मुकुट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके शीर्ष पर’ है। एकवचन प्रत्यय सम्भवतः दोनों खम्भों में से हर एक के लिए वितरणात्मक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में शाब्दिक रूप से ‘लम्बाई पैंतीस हाथ’ है। 1 राजा 7:15 में प्रत्येक खम्भे की ऊँचाई अठारह हाथ दी गई है। इसलिए कुछ लोग यहाँ दोनों खम्भों की सम्मिलित माप समझते हैं, जबकि अन्य इसे पाठ-सम्बन्धी कठिनाई मानते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: לִפְנֵי הַבַּיִת
  choice: मन्दिर के सामने
  rationale: לִפְנֵי स्थान को ‘सामने’ बताता है। इस निर्माण-वर्णन में הַבַּיִת से मन्दिर अभिप्रेत है; ‘मन्दिर’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: עַמּוּדִים שְׁנַיִם
  choice: दो खम्भे
  rationale: עַמּוּדִים स्थापत्य के खम्भों को दर्शाता है; ‘खम्भे’ साधारण पाठक के लिए सहज शब्द है।
- source_word: אַמּוֹת שְׁלֹשִׁים וְחָמֵשׁ אֹרֶךְ
  choice: उनकी लम्बाई पैंतीस हाथ थी
  rationale: मूल पाठ में אֹרֶךְ का अर्थ ‘लम्बाई’ है। खम्भों के प्रसंग में इसे चुपचाप ‘ऊँचाई’ नहीं बनाया गया; प्राचीन माप ‘हाथ’ भी बनाए रखा गया है।
- source_word: הַצֶּפֶת
  choice: मुकुट
  rationale: यह खम्भे के अलंकृत ऊपरी भाग को दर्शाता है। ‘मुकुट’ हिन्दी में स्थापत्य-सन्दर्भ को गरिमापूर्ण और सुबोध ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר עַל רֹאשׁוֹ
  choice: हर एक के शीर्ष पर
  rationale: רֹאשׁ का वस्तु के लिए स्वाभाविक अर्थ ‘शीर्ष’ है। एकवचन प्रत्यय को दो खम्भों में से प्रत्येक पर वितरणात्मक रूप से समझा गया है, और इस व्याख्या को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אַמּוֹת חָמֵשׁ
  choice: पाँच हाथ ऊँचा
  rationale: मुकुट का पाँच हाथ का माप स्वाभाविक हिन्दी में व्यक्त किया गया है; स्थापत्य-सन्दर्भ में ‘ऊँचा’ निहित आयाम को स्पष्ट करता है।
