  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘शेकेल’ को ऐतिहासिक भार-इकाई के रूप में लिप्यंतरित किया गया है। मूल अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘सोना’ के बाद था, पर उसकी विषयवस्तु עֲלִיּוֹת से सम्बन्धित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘ऊपरी कक्षों’ के बाद रखा गया है।
