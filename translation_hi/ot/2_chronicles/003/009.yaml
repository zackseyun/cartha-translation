  text: कीलों का भार पचास शेकेल सोने का था, और उसने ऊपरी कक्षों[a] को सोने से मढ़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपरी भागों”; इब्रानी शब्द मन्दिर के ऊपर बने कक्षों या, अधिक व्यापक रूप से, उसकी ऊपरी संरचनाओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁקָל לְמִסְמְרוֹת
  choice: कीलों का भार
  rationale: מִשְׁקָל ‘भार’ को दर्शाता है और לְמִסְמְרוֹת इस निर्माण में उन कीलों को बताता है जिनका भार दिया गया है। ‘कीलें’ मन्दिर-निर्माण के प्रसंग में स्वाभाविक है।
- source_word: לִשְׁקָלִים חֲמִשִּׁים זָהָב
  choice: पचास शेकेल सोना था
  rationale: यह वाक्यांश सोने की मापी गई मात्रा बताता है। ‘शेकेल’ प्राचीन भार-इकाई को बिना आधुनिक मूल्य में बदले सुरक्षित रखता है।
- source_word: וְהָעֲלִיּוֹת
  choice: ऊपरी कक्षों
  rationale: עֲלִיּוֹת सामान्यतः ऊपर स्थित कक्षों को दर्शाता है, पर यहाँ ठीक वास्तु-सन्दर्भ निश्चित नहीं है; इसलिए मुख्य पाठ में स्वाभाविक अर्थ और पादटिप्पणी में व्यापक सम्भावना दी गई है।
- source_word: חִפָּה זָהָב
  choice: सोने से मढ़ा
  rationale: חפה किसी वस्तु पर आवरण चढ़ाने को दर्शाता है। वास्तु और अलंकरण के इस प्रसंग में ‘सोने से मढ़ा’ स्वाभाविक और सटीक है।
