  text: וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לִ/דְר֕וֹשׁ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/לַ/עֲשׂ֖וֹת הַ/תּוֹרָ֥ה וְ/הַ/מִּצְוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/003.yaml
  text: And he told Judah to seek the LORD, the God of their fathers, and to keep the law and the commandment.
translation:
  language: hi
  text: उसने यहूदा से कहा कि वे अपने पूर्वजों के परमेश्वर यहोवा[a] की खोज करें और व्यवस्था तथा आज्ञा का पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है।
    reason: पाठक को बताता है कि ‘यहोवा’ सामान्य उपाधि नहीं, मूल में आया दिव्य नाम है।
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: उसने यहूदा से कहा
  rationale: אָמַר का मूल अर्थ ‘कहना’ है; संदर्भ में यह आदेशात्मक कथन है, पर ‘कहा कि’ मूल की अभिव्यक्ति के निकट और स्वाभाविक है। ‘यहूदा’ यहाँ राज्य/उसके लोगों के लिए सामूहिक संज्ञा है।
- source_word: לִדְרוֹשׁ
  choice: खोज करें
  rationale: דָּרַשׁ यहाँ परमेश्वर की ओर मुड़ने, उनकी इच्छा जानने और उन्हें पाने का प्रयत्न करने का धार्मिक अर्थ रखता है; ‘खोज करें’ इस व्यापकता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, ताकि इसे सामान्य उपाधि ‘प्रभु’ में न बदला जाए।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: सर्वनाम का संबंध यहूदा के लोगों से है। ‘पूर्वजों’ आधुनिक हिंदी में स्वाभाविक है और वंशगत-वाचा संबंध को व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: पालन करें
  rationale: ‘व्यवस्था और आज्ञा को करना’ का स्वाभाविक हिंदी धार्मिक-कानूनी प्रयोग ‘पालन करना’ है।
- source_word: הַתּוֹרָה וְהַמִּצְוָה
  choice: व्यवस्था तथा आज्ञा
  rationale: दोनों निश्चित एकवचन संज्ञाओं का भेद सुरक्षित रखा गया है; ‘व्यवस्था’ तोराह के निर्देश और ‘आज्ञा’ विशिष्ट आदेश को दर्शाती है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: मुख्य पाठ में ‘यहोवा’
  alternative: ‘प्रभु’ या ‘याहवे’
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिंदी बाइबल परंपरा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; पादटिप्पणी मूल हिब्रू रूप की जानकारी देती है, बिना किसी सांप्रदायिक व्याख्या के।
- issue: ‘व्यवस्था और आज्ञा’ का संबंध
  choice: दोनों संज्ञाओं को अलग रखते हुए ‘व्यवस्था तथा आज्ञा’
  alternative: ‘व्यवस्था की आज्ञाओं’ या केवल ‘व्यवस्था’
  rationale: हिब्रू में दोनों पर निश्चित लेख है और वे וְ से जुड़े हैं; उन्हें मिला देने से मूल का औपचारिक तथा वैचारिक तनाव घट जाएगा।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। बहुवचन ‘वे/करें’ सामूहिक ‘यहूदा’ अर्थात उसके लोगों के अनुरूप है।
