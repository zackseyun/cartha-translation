base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/012.yaml
  text: Asa and the people who were with him pursued them as far as Gerar[a], and the Cushites fell until none remained alive, for they were shattered before Yahweh and before his army[b]. Then they carried off a very great amount of plunder.
translation:
  language: hi
  text: आसा और उसके साथ के लोगों ने गरार तक उनका पीछा किया। इतने कूशी[a] मारे गए कि उनमें से कोई जीवित न बचा, क्योंकि वे याहवे के सामने और उसकी सेना[b] के सामने चूर-चूर हो गए थे। तब वे बहुत बड़ी मात्रा में लूट ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवादों में ‘इथियोपियाई’। इब्रानी में ‘कूशी’ है, अर्थात कूश देश के लोग।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘छावनी’ या ‘सेना’ हो सकता है। ‘उसकी’ का संकेत आसा की सेना की ओर समझा जा सकता है, यद्यपि कुछ लोग इसे याहवे की छावनी या सेना मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּרְדְּפֵם
  choice: उनका पीछा किया
  rationale: רדף का सामान्य सैन्य अर्थ ‘पीछा करना’ है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: עַד לִגְרָר
  choice: गरार तक
  rationale: עַד स्थान के साथ पीछा किए जाने की सीमा बताता है।
- source_word: מִכּוּשִׁים
  choice: कूशी
  rationale: כּוּשִׁים कूश के लोगों को सूचित करता है। ‘कूशी’ मूल जाति-भौगोलिक नाम को बनाए रखता है और आधुनिक इथियोपिया से अनावश्यक समानता नहीं करता।
- source_word: וַיִּפֹּל מִכּוּשִׁים לְאֵין לָהֶם מִחְיָה
  choice: इतने कूशी मारे गए कि उनमें से कोई जीवित न बचा
  rationale: נפל और מן की रचना उस समूह में हुई भारी जनहानि बताती है, जबकि अगला वाक्यांश किसी के जीवित न बचने पर बल देता है। हिन्दी में यह रूप अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִשְׁבְּרוּ
  choice: चूर-चूर हो गए थे
  rationale: שׁבר का निफ़अल यहाँ निर्णायक सैन्य विनाश दर्शाता है; ‘चूर-चूर’ मूल बिंब और उसकी तीव्रता को बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי के स्थानिक-धर्मवैचारिक मुहावरे को ‘के सामने’ से सुरक्षित रखा गया है और יהוה को उसके वाचा-संबंधी नाम ‘याहवे’ से लिखा गया है।
- source_word: וְלִפְנֵי מַחֲנֵהוּ
  choice: और आसा की सेना के सामने
  rationale: מַחֲנֶה का अर्थ ‘छावनी’ या युद्धरत ‘सेना’ हो सकता है। पीछा करने और युद्ध के प्रसंग में ‘सेना’ स्वाभाविक है; प्रत्यय को आसा से संबद्ध समझा गया है, पर पाठगत विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיִּשְׂאוּ שָׁלָל הַרְבֵּה מְאֹד
  choice: तब वे बहुत अधिक लूट का माल उठा ले गए
  rationale: נשא עם שׁלל युद्ध में प्राप्त माल ले जाने का बोध देता है और הַרְבֵּה מְאֹד उसकी अत्यधिक मात्रा पर बल देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ सीधे चतुरक्षरीय वाचा-नाम का प्रयोग करता है; ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מַחֲנֵהוּ में एकवचन पुंल्लिंग प्रत्यय का संदर्भ
  choice: आसा की सेना
  alternative: याहवे की सेना/छावनी; अथवा आसा की छावनी
  rationale: कथानक में आसा और उसके साथ के लोग प्रत्यक्ष मानव सैन्य बल हैं, इसलिए आसा सबसे स्वाभाविक संदर्भ है। फिर भी इब्रानी प्रत्यय स्वयं संदर्भ को निर्णायक रूप से स्पष्ट नहीं करता, अतः दूसरा अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘कूशी’ ऐतिहासिक जाति-भौगोलिक नाम को सुरक्षित रखता है; ‘लूट का माल’ सामान्य पाठक के लिए स्पष्ट है। मुख्य पाठ में संदर्भगत स्पष्टता दी गई है, जबकि वास्तविक शाब्दिक और धर्मवैचारिक अस्पष्टता पाद-टिप्पणियों में संरक्षित है।
