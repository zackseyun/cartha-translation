base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/010.yaml
  text: And Asa cried out to Yahweh his God and said[a], “Yahweh, there is none besides you to help between the mighty and the powerless. Help us, Yahweh our God, for we rely on you, and in your name we have come against this multitude. Yahweh our God, you are our God[b]; do not let man prevail against you.”
translation:
  language: hi
  text: आसा ने अपने परमेश्वर यहवे को पुकारकर कहा, “हे यहवे, सामर्थी और निर्बल की सहायता करने में तेरे सिवा कोई नहीं है[a]। हे यहवे, हमारे परमेश्वर, हमारी सहायता कर, क्योंकि हम तुझ पर भरोसा रखते हैं और तेरे नाम से इस विशाल जनसमूह के विरुद्ध आए हैं। हे यहवे, तू हमारा परमेश्वर है; नश्वर मनुष्य को तेरे विरुद्ध प्रबल न होने दे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सिवा कोई नहीं जो सहायता करे, चाहे बहुतों के साथ हो या जिनमें शक्ति नहीं है उनके साथ।” इब्रानी वाक्य बहुत संक्षिप्त है और संख्या या सामर्थ्य—दोनों में से किसी पर बल दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “नश्वर मनुष्य को तेरे सामने टिके न रहने दे”; अथवा, “नश्वर मनुष्य को तुझे रोकने न दे।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: को पुकारकर
  rationale: प्रार्थना के संदर्भ में यह पदबंध परमेश्वर से सहायता के लिए पुकारने का भाव रखता है; यह केवल सामान्य रूप से कहने से अधिक तात्कालिकता व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֵין עִמְּךָ לַעְזוֹר
  choice: सहायता करने वाला तेरे सिवा कोई नहीं है
  rationale: यह कठिन और संक्षिप्त इब्रानी पदबंध परमेश्वर की अद्वितीय सहायता पर बल देता है। पाठ की दूसरी सम्भव व्याख्या पादटिप्पणी में रखी गई है।
- source_word: בֵּין רַב לְאֵין כֹּחַ
  choice: सामर्थी और निर्बल के बीच
  rationale: רַב संख्या अथवा सामर्थ्य का संकेत दे सकता है; युद्ध-संदर्भ में यह अनुवाद विरोधी ध्रुवों को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि संख्यात्मक सम्भावना पादटिप्पणी में दी गई है।
- source_word: כִּי עָלֶיךָ נִשְׁעַנּוּ
  choice: क्योंकि हम तुझ पर भरोसा रखते हैं
  rationale: נשען का शाब्दिक चित्र ‘सहारे के लिए टिकना’ है; ‘भरोसा रखना’ हिन्दी में उसी निर्भरता को सहज रूप से प्रकट करता है।
- source_word: וּבְשִׁמְךָ בָאנוּ
  choice: तेरे नाम से ... सामना करने आए हैं
  rationale: ‘तेरे नाम से’ परमेश्वर के अधिकार और उस पर निर्भर होकर कार्य करने का बाइबलीय भाव बनाए रखता है।
- source_word: הֶהָמוֹן הַזֶּה
  choice: इस विशाल जनसमूह
  rationale: הָמוֹן बड़ी भीड़ या जनसमूह को दर्शाता है; सैन्य संदर्भ को अनावश्यक रूप से पाठ में जोड़े बिना ‘विशाल जनसमूह’ उसके आकार को स्पष्ट करता है।
- source_word: אַל יַעְצֹר עִמְּךָ אֱנוֹשׁ
  choice: नश्वर मनुष्य को अपने विरुद्ध प्रबल न होने दे
  rationale: עצר यहाँ कठिन है और रोकने, टिके रहने या प्रबल होने का भाव दे सकता है। युद्ध-प्रार्थना के संदर्भ में ‘प्रबल न होने दे’ स्वाभाविक है; אֱנוֹשׁ की नश्वरता ‘नश्वर मनुष्य’ से सुरक्षित रखी गई है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: पद में वाचा का व्यक्तिगत नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहवे’ मूल नाम का निकट हिन्दी लिप्यंतरण है।
- issue: אֵין עִמְּךָ לַעְזוֹר की कठिन वाक्यरचना
  choice: तेरे सिवा कोई नहीं है
  alternative: तेरे लिए सहायता करना कठिन नहीं है
  rationale: मुख्य पाठ परमेश्वर की अद्वितीय सहायता को व्यक्त करता है, पर इब्रानी को परमेश्वर के लिए सहायता की सहजता बताने वाला भी समझा जा सकता है; उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम विनती में मनुष्य और परमेश्वर का विरोध
  choice: नश्वर मनुष्य को अपने विरुद्ध प्रबल न होने दे
  alternative: नश्वर मनुष्य को तेरे सामने टिके न रहने दे / नश्वर मनुष्य को तुझे रोकने न दे
  rationale: मूल में मानवीय नश्वरता और यहवे के बीच तीखा विरोध है। चुना हुआ पाठ युद्ध-संदर्भ के अनुकूल है, पर עצר की अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमामय रखी गई है। परमेश्वर को संबोधित करते समय ‘तू/तेरे/तुझ’ का प्रयोग निकटता और पारंपरिक बाइबलीय प्रार्थना-शैली के लिए किया गया है, अपमान के भाव में नहीं। कठिन इब्रानी वाक्यरचना को मुख्य पाठ में पठनीय बनाया गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित रखे गए हैं।
