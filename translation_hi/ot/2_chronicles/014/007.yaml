source:
  edition: WLC
  text: וַ/יְהִ֣י לְ/אָסָ֗א חַיִל֮ נֹשֵׂ֣א צִנָּ֣ה וָ/רֹמַח֒ מִֽ/יהוּדָה֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וּ/מִ/בִּנְיָמִ֗ן נֹשְׂאֵ֤י מָגֵן֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת מָאתַ֥יִם וּ/שְׁמוֹנִ֖ים אָ֑לֶף כָּל אֵ֖לֶּה גִּבּ֥וֹרֵי חָֽיִלס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/007.yaml
  text: And Asa had an army of three hundred thousand from Judah bearing large shields and spears[a], and from Benjamin two hundred eighty thousand bearing shields and drawing bows. All these were mighty men of valor.
translation:
  language: hi
  text: आसा के पास यहूदा के तीन लाख सैनिक थे, जो बड़ी ढालें और भाले उठाते थे, और बिन्यामीन के दो लाख अस्सी हज़ार सैनिक थे, जो ढालें उठाते और धनुष खींचते थे। ये सभी वीर योद्धा थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל
  choice: सैनिक
  rationale: इस सैन्य गणना में यह शब्द आसा के अधीन सेना या सैन्य दल को दर्शाता है; संख्या के साथ हिंदी में ‘सैनिक’ स्वाभाविक और स्पष्ट है।
- source_word: נֹשֵׂא צִנָּה וָרֹמַח
  choice: बड़ी ढालें और भाले उठाते थे
  rationale: צִנָּה बड़ी, शरीर को ढकने वाली ढाल है और רֹמַח भाला; ‘उठाते थे’ सैनिकों के इन हथियारों से सुसज्जित होने का सहज हिंदी रूप है।
- source_word: מִיהוּדָה
  choice: यहूदा के
  rationale: מִן यहाँ सैनिकों की जनजातीय उत्पत्ति बताता है; संख्या और ‘सैनिक’ के साथ ‘यहूदा के’ स्वाभाविक हिंदी है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: तीन लाख
  rationale: हिंदी संख्या-पद्धति में 300,000 का स्वाभाविक रूप ‘तीन लाख’ है।
- source_word: נֹשְׂאֵי מָגֵן
  choice: ढालें उठाते
  rationale: מָגֵן सामान्यतः צִנָּה से छोटी ढाल को सूचित करता है; पहले पद को ‘बड़ी ढालें’ और इसे ‘ढालें’ कहने से भेद बना रहता है।
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: धनुष खींचते
  rationale: इब्रानी मुहावरा धनुष को मोड़ने/चढ़ाने और चलाने वाले धनुर्धरों को दर्शाता है; ‘धनुष खींचते’ मूल बिंब को रखते हुए समझने योग्य है।
- source_word: מָאתַיִם וּשְׁמוֹנִים אָלֶף
  choice: दो लाख अस्सी हज़ार
  rationale: 280,000 का प्रचलित आधुनिक हिंदी रूप।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: सारांश देने वाले इब्रानी वाक्यांश का स्वाभाविक हिंदी रूप।
- source_word: גִּבּוֹרֵי חָיִל
  choice: वीर योद्धा
  rationale: यह रूढ़ सैन्य पद बलवान, साहसी और युद्ध-कुशल पुरुषों को दर्शाता है; ‘वीर योद्धा’ आधुनिक हिंदी में संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: גִּבּוֹרֵי חָיִל में पुरुषवाचक सैन्य अभिव्यक्ति
  choice: वीर योद्धा
  alternative: वीर पुरुष / पराक्रमी पुरुष
  rationale: प्रसंग प्राचीन सैन्य गणना का है और इब्रानी रूप पुरुषवाचक है। हिंदी में ‘योद्धा’ इसी सैनिक संदर्भ को स्पष्ट रखता है; अलग से ‘पुरुष’ जोड़ना अर्थतः संभव है, पर वाक्य को अनावश्यक रूप से भारी बनाता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण सैन्य शैली। बड़ी ढाल (צִנָּה) और सामान्य ढाल (מָגֵן) का lexical भेद रखा गया है। भारतीय संख्या-पद्धति के अनुसार ‘लाख’ का प्रयोग किया गया है।
