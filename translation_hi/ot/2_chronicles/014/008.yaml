base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/008.yaml
  text: Zerah the Cushite came out against them with an army of a thousand thousands and three hundred chariots[b][a], and he came as far as Mareshah.
translation:
  language: hi
  text: कूशी[a] जेरह दस लाख[b] सैनिकों और तीन सौ रथों की सेना लेकर उनके विरुद्ध निकला और मारेशा तक आ पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूशी’ इब्रानी जाति-भौगोलिक पद है; परंपरागत अनुवाद ‘इथियोपियाई’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘एक हज़ार हज़ार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: उनके विरुद्ध निकला
  rationale: युद्ध के प्रसंग में יצא और אֲלֵיהֶם का संयुक्त अर्थ शत्रुतापूर्ण सैन्य प्रस्थान है; यह अनुवाद स्वाभाविक हिंदी में वही भाव देता है।
- source_word: זֶרַח הַכּוּשִׁי
  choice: कूशी जेरह
  rationale: כּוּשִׁי को पारंपरिक किंतु अधिक व्याख्यात्मक ‘इथियोपियाई’ के बजाय इब्रानी जाति-भौगोलिक पद के निकट ‘कूशी’ रखा गया है।
- source_word: בְּחַיִל
  choice: सेना लेकर
  rationale: यहाँ חַיִל धन या वीरता नहीं, सैन्य बल को सूचित करता है; ‘सेना लेकर’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֶלֶף אֲלָפִים
  choice: दस लाख
  rationale: इब्रानी का शाब्दिक रूप ‘एक हज़ार हज़ार’ है, जिसका अंकगणितीय मूल्य दस लाख है; मुख्य पाठ में सहज संख्या दी गई और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּמַרְכָּבוֹת שְׁלֹשׁ מֵאוֹת
  choice: और तीन सौ रथों
  rationale: संख्या और संज्ञा का सीधा, स्वाभाविक हिंदी रूप।
- source_word: וַיָּבֹא עַד מָרֵשָׁה
  choice: और मारेशा तक आ पहुँचा
  rationale: עַד स्थान की सीमा तक पहुँचने का भाव देता है; ‘तक आ पहुँचा’ इस सूक्ष्मता को सुरक्षित रखता है।
