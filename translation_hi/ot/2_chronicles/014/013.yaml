source:
  edition: WLC
  text: וַ/יַּכּ֗וּ אֵ֤ת כָּל הֶֽ/עָרִים֙ סְבִיב֣וֹת גְּרָ֔ר כִּי הָיָ֥ה פַֽחַד יְהוָ֖ה עֲלֵי/הֶ֑ם וַ/יָּבֹ֨זּוּ֙ אֶת כָּל הֶ֣/עָרִ֔ים כִּֽי בִזָּ֥ה רַבָּ֖ה הָיְתָ֥ה בָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/013.yaml
  text: And they struck down all the cities around Gerar, for the terror of Yahweh was upon them. And they plundered all the cities, for there was much spoil in them.
translation:
  language: hi
  text: उन्होंने गरार के आसपास के सभी नगरों को परास्त कर दिया, क्योंकि उन पर याहवे का आतंक छा गया था। उन्होंने उन सभी नगरों को लूट लिया, क्योंकि उनमें लूट का बहुत-सा माल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: परास्त कर दिया
  rationale: नכה का हिफ़ईल रूप युद्ध के प्रसंग में बलपूर्वक मारने या पराजित करने का भाव देता है। नगरों के लिए हिंदी में ‘परास्त कर दिया’ स्वाभाविक है और बिना आधार यह नहीं मानता कि हर निवासी मार डाला गया।
- source_word: כָּל הֶעָרִים סְבִיבוֹת גְּרָר
  choice: गरार के आस-पास के सभी नगरों
  rationale: यह पदबंध स्थानिक संबंध को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: פַּחַד יְהוָה
  choice: यहोवा का आतंक
  rationale: यहाँ श्रद्धापूर्ण भय नहीं, बल्कि यहोवा से उत्पन्न अथवा उससे संबद्ध दहशत अभिप्रेत है; ‘आतंक’ सैन्य प्रसंग के अनुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित रूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से अलग रखते हुए व्यक्त करता है।
- source_word: עֲלֵיהֶם
  choice: उन पर ... छा गया था
  rationale: हिब्रू में किसी दशा के ‘उन पर’ होने का मुहावरा हिंदी में ‘छा गया था’ से सहज रूप में व्यक्त होता है।
- source_word: וַיָּבֹזּוּ
  choice: लूट लिया
  rationale: בזז युद्ध में माल लूटने को दर्शाता है; ‘लूट लिया’ सामान्य आधुनिक हिंदी में स्पष्ट और सटीक है।
- source_word: בִּזָּה רַבָּה
  choice: बहुत-सा माल
  rationale: בִּזָּה युद्ध में प्राप्त लूट का माल है। ‘बहुत-सा माल’ क्रिया ‘लूट लिया’ की अनावश्यक पुनरुक्ति से बचते हुए आशय बनाए रखता है।
- source_word: בָהֶם
  choice: उनमें
  rationale: सर्वनाम का स्वाभाविक पूर्वपद नगर हैं; ‘उनमें’ उस संबंध को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिंदी पाठकों के लिए प्रतिष्ठित और पहचानने योग्य लिप्यंतरण ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: פַּחַד יְהוָה में संबंध का अर्थ
  choice: यहोवा का आतंक
  alternative: यहोवा का भय
  rationale: षष्ठी संबंध स्रोत (‘यहोवा से आया आतंक’) या संबद्धता दोनों व्यक्त कर सकता है। मुख्य पाठ ‘का’ द्वारा इस संबंध की व्यापकता बनाए रखता है और श्रद्धापूर्ण भय का गलत संकेत नहीं देता।
translation_notes:
  register: भाषा आधुनिक, प्रवाहपूर्ण और गरिमापूर्ण रखी गई है। सैन्य हिंसा तथा लूट के अर्थ को नरम नहीं किया गया, पर ‘नगरों को मार डाला’ जैसी अस्वाभाविक और अत्यधिक निश्चित अभिव्यक्ति से बचा गया है।
