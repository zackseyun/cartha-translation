  text: וַ/יָּ֨סַר֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה אֶת הַ/בָּמ֖וֹת וְ/אֶת הַֽ/חַמָּנִ֑ים וַ/תִּשְׁקֹ֥ט הַ/מַּמְלָכָ֖ה לְ/פָנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/004.yaml
  text: He removed the high places and the incense altars from all the cities of Judah[a], and the kingdom had rest before him.
translation:
  language: hi
  text: उसने यहूदा के सभी नगरों से ऊँचे स्थानों और धूप की वेदियों[a] को हटा दिया, और उसके शासन में राज्य को शांति मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “सूर्य-स्तंभ।” इब्रानी शब्द उपासना-संबंधी वस्तुओं को दर्शाता है और कुछ संदर्भों में सूर्य-पूजा से जुड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: उसने ... हटा दिया
  rationale: हिफ़ील रूप किसी वस्तु को दूर करने का भाव देता है। यह चयन ठोस कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे औपचारिक उन्मूलन मानने के।
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: यहूदा के सभी नगरों में से
  rationale: यह आसा के सुधार के भौगोलिक विस्तार को सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थानों
  rationale: यह शब्द सामान्यतः उपासना से जुड़े ऊँचे स्थलों को दर्शाता है। ‘ऊँचे स्थान’ ऐतिहासिक-धार्मिक अर्थ को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
- source_word: הַחַמָּנִים
  choice: धूप-वेदियों
  rationale: यह कठिन शब्द उपासना-संबंधी वस्तुओं के लिए प्रयुक्त होता है और कुछ संदर्भों में धूप अथवा सूर्य-पूजा से जुड़ सकता है। मुख्य पाठ में पठनीय और संभव अर्थ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַתִּשְׁקֹט
  choice: चैन मिला
  rationale: क्रिया निर्बाध, शांत या विश्राम की दशा बताती है। ‘राज्य को चैन मिला’ आधुनिक हिन्दी में स्वाभाविक है और इतिहास-वृत्तांत में राष्ट्रीय शांति का भाव रखता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: यह राजकीय क्षेत्र या राज्य का सीधा और प्रचलित हिन्दी रूप है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक अर्थ ‘उसके सामने’ है। संभवतः आशय उसके शासनकाल में या उसके अधीन है, पर मुख्य पाठ वास्तविक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: आसा द्वारा हटाई गई उपासना-संबंधी वस्तुओं का स्वरूप
  choice: בָּמוֹת और חַמָּנִים को ठोस उपासना-स्थलों और वस्तुओं के रूप में प्रस्तुत किया गया है, लेकिन इब्रानी से अधिक विशिष्ट धार्मिक पहचान नहीं थोपी गई।
  alternative: חַמָּנִים को विशेष रूप से सूर्य-स्तंभ या सूर्य-प्रतिमाएँ समझना।
  rationale: पद अनुचित उपासना से जुड़े स्थलों और वस्तुओं के विरुद्ध सुधार का वर्णन करता है, पर חַמָּנִים का सटीक स्वरूप विवादित है। इसलिए मुख्य पाठ स्पष्ट रहता है और अधिक विशिष्ट संभावना पादटिप्पणी में सुरक्षित है।
- issue: לְפָנָיו का संबंध
  choice: ‘उसके सामने’ रखकर इब्रानी मुहावरे और उसकी अस्पष्टता को सुरक्षित रखा गया है।
  alternative: ‘उसके शासनकाल में’ या ‘उसके अधीन’।
  rationale: संदर्भ में मुहावरे का अर्थ आसा के शासन के दौरान हो सकता है, पर शाब्दिक अभिव्यक्ति को व्याख्यात्मक रूप से सीमित करना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धूप-वेदियाँ’ धार्मिक-सांस्कृतिक संदर्भ को संक्षेप में व्यक्त करता है; कठिन शब्द की अनिश्चितता पादटिप्पणी में संरक्षित है।
