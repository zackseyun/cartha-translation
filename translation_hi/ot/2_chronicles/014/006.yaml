base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/006.yaml
  text: And he said to Judah[a], “Let us build these cities and surround them with walls and towers, gates and bars, while the land is still before us, because we have sought Yahweh our God. We have sought him, and he has given us rest on every side.” So they built and prospered.
translation:
  language: hi
  text: उसने यहूदा के लोगों से कहा, “आओ, हम इन नगरों को बनाएँ और उनके चारों ओर शहरपनाह और मीनारें, फाटक और उन्हें बंद करने की सलाखें बनाएँ। जब तक यह देश हमारे सामने है,[a] क्योंकि हमने अपने परमेश्वर यहोवा की खोज की है। हमने उसकी खोज की, और उसने हमें चारों ओर से विश्राम दिया है।” इसलिए उन्होंने निर्माण किया और सफलता पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि अभी यह देश हमारे सामने है”; इसका भाव यह हो सकता है कि अवसर अभी उपलब्ध है या देश उनके सामने अबाध पड़ा है।
    reason: לְפָנֵינוּ के मुहावरे और clause के temporal/causal संबंध में वास्तविक अर्थगत गुंजाइश है।
lexical_decisions:
- source_word: וַיֹּאמֶר לִיהוּדָה
  choice: उसने यहूदा के लोगों से कहा
  rationale: यहाँ ‘यहूदा’ स्थान/राज्य का नाम होते हुए उसके लोगों के लिए लक्षणा के रूप में प्रयुक्त है। हिन्दी में ‘यहूदा के लोगों से’ आशय को स्वाभाविक और स्पष्ट बनाता है।
- source_word: נִבְנֶה
  choice: आओ, हम ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन इच्छार्थक रूप सामूहिक प्रोत्साहन या संकल्प व्यक्त करता है; यह अनुवाद उसी बल को बनाए रखता है और ‘फिर से बनाना’ जैसी अनकही बात नहीं जोड़ता।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: इन नगरों को
  rationale: עָרִים बस्तियों/नगरों का सामान्य शब्द है और किलेबंदी के प्रसंग में ‘नगर’ उपयुक्त है।
- source_word: וְנָסֵב חוֹמָה וּמִגְדָּלִים דְּלָתַיִם וּבְרִיחִים
  choice: उनके चारों ओर शहरपनाह और मीनारें, फाटक और बेड़े बनाएँ
  rationale: סבב का हिफ़ील यहाँ चारों ओर घेरने का भाव देता है। सूची नगर की रक्षात्मक संरचनाओं की है; ‘शहरपनाह’, ‘मीनारें’, ‘फाटक’ और ‘बेड़े’ आधुनिक हिन्दी में उसी किलेबंदी को स्पष्ट करते हैं।
- source_word: עוֹדֶנּוּ הָאָרֶץ לְפָנֵינוּ
  choice: अभी यह देश हमारे सामने खुला है
  rationale: मुहावरा वर्तमान अवसर और अबाध उपलब्धता का संकेत देता है। ‘खुला है’ अर्थ को सहज बनाता है, पर इसे सीधे ‘शान्ति में’ या ‘हमारे अधिकार में’ नहीं बदलता।
- source_word: כִּי דָרַשְׁנוּ אֶת יְהוָה אֱלֹהֵינוּ דָּרַשְׁנוּ
  choice: क्योंकि हमने अपने परमेश्वर यहोवा की खोज की है। हमने उसकी खोज की
  rationale: דרשׁ परमेश्वर के प्रति भक्तिपूर्ण खोज और निर्भरता को व्यक्त करता है। मूल की जोरदार पुनरुक्ति सुरक्षित रखी गई है।
- source_word: וַיָּנַח לָנוּ מִסָּבִיב
  choice: उसने हमें चारों ओर से विश्राम दिया है
  rationale: वाक्यांश हर ओर से मिले चैन/राहत को बताता है। मूल में शत्रुओं का स्पष्ट उल्लेख नहीं है, इसलिए उन्हें अनुवाद में नहीं जोड़ा गया।
- source_word: וַיִּבְנוּ וַיַּצְלִיחוּ
  choice: इसलिए उन्होंने निर्माण किया और सफलता पाई
  rationale: अन्तिम क्रियाएँ निर्माण और उसके सफल परिणाम की सूचना देती हैं। ‘सफलता पाई’ यहाँ स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि ‘प्रभु’ से अलग रखते हुए स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए परिचित रूप ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; इसे केवल उपाधि ‘प्रभु’ से बदलना मूल का भेद मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘शहरपनाह’ किलेबंद नगर की दीवार के लिए सटीक और प्रचलित बाइबलीय शब्द है; वाक्य-विन्यास को हिन्दी में स्वाभाविक रखते हुए मूल की पुनरुक्ति और कारण-परिणाम संरचना सुरक्षित रखी गई है।
