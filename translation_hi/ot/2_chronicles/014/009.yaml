- source_word: וַיֵּצֵא
  choice: निकल आया
  rationale: यָצָא का मूल अर्थ ‘निकलना’ है; सैनिक प्रसंग में यह आगे बढ़कर निकलने का भाव भी देता है, पर मुख्य पाठ में अनावश्यक विस्तार नहीं किया गया।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है। प्रसंग में सामना करने का भाव संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: युद्ध के लिए मोर्चा बाँधा
  rationale: עָרַךְ और מִלְחָמָה का संयुक्त प्रयोग युद्ध के लिए सेना को पंक्तिबद्ध करने या मोर्चा लगाने को दर्शाता है; यह हिन्दी में स्पष्ट और वर्तमान प्रयोग है।
- source_word: בְּגֵיא
  choice: घाटी में
  rationale: גַּיְא का सामान्य अर्थ घाटी या सँकरी घाटी है; यहाँ स्थान-सूचक नाम के साथ ‘घाटी’ सर्वाधिक सहज है।
- source_word: צְפַתָה
  choice: सफाता
  rationale: स्थान-नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: לְמָרֵשָׁה
  choice: मारेशा में
  rationale: स्थान-नाम के साथ לְ यहाँ भौगोलिक संबंध या स्थिति बताता है; ‘मारेशा में’ निकट रूप है, यद्यपि ‘मारेशा के पास’ भी संभव है।
