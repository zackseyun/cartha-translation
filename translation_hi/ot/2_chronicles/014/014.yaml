  yaml_path: translation/ot/2_chronicles/014/014.yaml
  text: They also struck the tents of livestock[a], and they carried off sheep in abundance and camels[c][b]. Then they returned to Jerusalem.
translation:
  language: hi
  text: उन्होंने पशुपालकों के डेरों[a] पर भी आक्रमण किया और बहुत बड़ी संख्या में भेड़-बकरियाँ[b] और ऊँट लूटकर ले गए[c]। फिर वे यरूशलेम लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पशुधन के तंबू।” इसका आशय पशुपालकों या चरवाहों के डेरे हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ सामूहिक रूप से “रेवड़” या “छोटे पालतू पशु” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का शाब्दिक अर्थ “बंदी बना लिया” हो सकता है; पशुओं के संदर्भ में आशय उन्हें लूट के रूप में पकड़कर ले जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: पूर्ववर्ती घटनाओं से इस कार्रवाई का योगात्मक संबंध स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אָהֳלֵי מִקְנֶה
  choice: पशुपालकों के डेरों
  rationale: शाब्दिक अर्थ ‘पशुधन के तंबू’ है, पर आशय संभवतः पशुधन से जुड़े चरवाहों या पशुपालकों की छावनियों से है; यह चयन उसी अर्थ को सहज हिंदी में रखता है।
- source_word: הִכּוּ
  choice: आक्रमण किया
  rationale: सैन्य प्रसंग में נכה का अर्थ प्रहार करना या हमला करना है; डेरों को ‘मारा’ कहना हिंदी में अस्वाभाविक होता।
- source_word: וַיִּשְׁבּוּ
  choice: लूटकर ले गए
  rationale: שבה सामान्यतः बंदी बनाने के लिए आता है, किंतु पशुओं के कर्म होने पर उन्हें युद्ध की लूट के रूप में पकड़कर ले जाने का अर्थ उपयुक्त है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: सामूहिक संज्ञा צֹאן प्रायः छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, दोनों को समेटती है; हिंदी में यह अर्थ अधिक स्पष्ट है।
- source_word: לָרֹב
  choice: बहुत बड़ी संख्या में
  rationale: पशुओं की अत्यधिक मात्रा पर दिए गए बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּגְמַלִּים
  choice: और ऊँट
  rationale: मूल संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: फिर वे यरूशलेम लौट आए
  rationale: कथानक में अगली घटना को ‘फिर’ से स्वाभाविक रूप में आगे बढ़ाया गया है।
