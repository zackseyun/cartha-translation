  yaml_path: translation/ot/2_chronicles/014/002.yaml
  text: He removed the foreign altars and the high places[a], shattered the sacred pillars, and cut down the Asherim.
translation:
  language: hi
  text: उसने विदेशी वेदियों और ऊँचे उपासना-स्थलों को हटा दिया, पवित्र स्तंभों को तोड़ डाला और अशेरिम[a] को काट गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशेरा के खंभे।” इब्रानी शब्द अशेरा की उपासना से जुड़ी धार्मिक वस्तुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: उसने ... हटा दिए
  rationale: हिफ़ील कथात्मक रूप यहाँ किसी वस्तु को दूर करने या हटा देने की ठोस सुधारात्मक कार्रवाई व्यक्त करता है।
- source_word: מִזְבְּחוֹת הַנֵּכָר
  choice: पराए देवताओं की वेदियाँ
  rationale: शाब्दिक अर्थ ‘परायी/विदेशी वेदियाँ’ है; उपासना-संदर्भ में आशय गैर-इस्राएली देवताओं से जुड़ी वेदियों का है। यह हिन्दी में स्वाभाविक है और केवल विदेशी लोगों के स्वामित्व का भ्रामक अर्थ टालता है।
- source_word: הַבָּמוֹת
  choice: पूजा के ऊँचे स्थान
  rationale: यह शब्द ऊँचे या स्थानीय उपासना-स्थलों के लिए प्रचलित धार्मिक पद है। ‘पूजा के’ जोड़ने से आधुनिक पाठक के लिए धार्मिक कार्य स्पष्ट होता है।
- source_word: וַיְשַׁבֵּר
  choice: तोड़ डाला
  rationale: क्रिया बलपूर्वक और निर्णायक ढंग से तोड़ने का भाव रखती है; यह हिन्दी मुहावरा उसी तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּצֵּבוֹת
  choice: पूजा के खम्भों
  rationale: מַצֵּבוֹת खड़े किए गए पवित्र पत्थरों या धार्मिक स्तम्भों को दर्शाता है। ‘पूजा के खम्भे’ उनके धार्मिक उपयोग को स्पष्ट रखते हुए अनावश्यक विशिष्टता से बचता है।
- source_word: וַיְגַדַּע
  choice: काट गिराया
  rationale: גדע पेड़ या लकड़ी की वस्तु को काट डालने के लिए प्रयुक्त होता है; यह चयन क्रिया और परिणाम दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-चिह्नों
  rationale: बहुवचन पद अशेरा-उपासना से जुड़ी धार्मिक वस्तुओं को सूचित करता है, पर उनका ठीक स्वरूप अनिश्चित है। ‘चिह्न’ इस अनिश्चितता को ‘खम्भे’ कहकर सीमित किए बिना अर्थपूर्ण हिन्दी देता है।
theological_decisions:
- issue: अशेरा-सम्बन्धी वस्तुओं की पहचान
  choice: अशेरा-चिह्नों
  alternative: अशेरा के खम्भों
  rationale: मूल शब्द अशेरा से सम्बद्ध उपासना-वस्तुओं को दर्शाता है, किन्तु वे लकड़ी के खम्भे, शैलीबद्ध वृक्ष या अन्य धार्मिक प्रतीक थे—यह निश्चित नहीं है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी प्रचलित विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। धार्मिक तकनीकी पदों को संक्षिप्त अर्थ-सूचक विस्तार के साथ प्रस्तुत किया गया है; अशेरा-वस्तुओं के स्वरूप की वास्तविक अनिश्चितता सुरक्षित रखी गई है।
