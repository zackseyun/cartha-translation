  footnotes:
  - marker: a
    text: या, ‘इथियोपियाइयों।’ इब्रानी जातिनाम ‘कूशी’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: मार गिराया
  rationale: सैनिक प्रसंग में נָגַף शत्रु पर प्रहार करके उसे परास्त करने का बोध देता है। ‘मार गिराया’ दैवी कार्रवाई की सजीवता बनाए रखता है; केवल ‘पराजित किया’ इसकी तीव्रता कुछ कम कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: הַכּוּשִׁים
  choice: कूशियों / कूशी
  rationale: यह इब्रानी जातिनाम כּוּשִׁים का सीधा और ऐतिहासिक रूप से सावधान अनुवाद है। ‘इथियोपियाई’ पारंपरिक विकल्प है, पर वह बाद की भौगोलिक पहचान को पाठ पर आरोपित कर सकता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: युद्ध-वर्णन में यह आसा और यहूदा की उपस्थिति अथवा उनके आगे शत्रु के मारे जाने को दर्शाता है। ‘के सामने’ इब्रानी रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यहाँ नाम राज्य अथवा उसके लोगों को सामूहिक रूप से दर्शाता है; प्रसंग से यह अर्थ स्पष्ट रहता है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוּס का सीधा अर्थ भय या पराजय के कारण भागना है। यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसके सम्भावित इब्रानी उच्चारण का निकट लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण कथात्मक हिन्दी में रखी गई है। ‘तब’ वाक्य को पूर्ववर्ती युद्ध-वृत्तांत से जोड़ता है। ‘आसा और यहूदा के सामने’ मूल की समानांतर अभिव्यक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
