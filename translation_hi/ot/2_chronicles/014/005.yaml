source:
  edition: WLC
  text: וַ/יִּ֛בֶן עָרֵ֥י מְצוּרָ֖ה בִּ/יהוּדָ֑ה כִּֽי שָׁקְטָ֣ה הָ/אָ֗רֶץ וְ/אֵין עִמּ֤/וֹ מִלְחָמָה֙ בַּ/שָּׁנִ֣ים הָ/אֵ֔לֶּה כִּֽי הֵנִ֥יחַ יְהוָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/014/005.yaml
  text: He built fortified cities in Judah[a], because the land was quiet and there was no war with him in those years, because Yahweh gave him rest.
translation:
  language: hi
  text: उसने यहूदा में किलेबंद नगरों का निर्माण किया, क्योंकि देश शांत था और उन वर्षों में उसका किसी से युद्ध नहीं हुआ था[a], क्योंकि याहवे ने उसे विश्राम दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके साथ कोई युद्ध नहीं था।” इब्रानी मुहावरा सामान्यतः आसा से जुड़े किसी भी युद्ध के न होने का अर्थ दे सकता है।
    reason: मूल इब्रानी मुहावरे की शाब्दिक बनावट और उसकी व्यापक अर्थ-संभावना बताने के लिए।
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने…निर्माण किया
  rationale: בנה के कथात्मक भूतकालीन रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक ו को हिन्दी कथन में अलग से अनूदित करना आवश्यक नहीं है।
- source_word: עָרֵי מְצוּרָה
  choice: किलेबंद नगरों
  rationale: यह रचना ऐसे नगरों को दर्शाती है जो रक्षा के लिए दृढ़ किए गए थे; ‘किलेबंद नगर’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: स्थानवाचक בְּ और स्थाननाम का सीधा अर्थ।
- source_word: שָׁקְטָה הָאָרֶץ
  choice: देश शांत था
  rationale: שׁקט अशांति या विघ्न के अभाव को व्यक्त करता है; ‘शांत’ मूल बिंब को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: וְאֵין עִמּוֹ מִלְחָמָה
  choice: उसका किसी से युद्ध नहीं हुआ था
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, जो आसा से जुड़े युद्ध के अभाव को बताता है और ‘विरुद्ध’ जोड़कर दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּשָּׁנִים הָאֵלֶּה
  choice: उन वर्षों में
  rationale: वर्णित ऐतिहासिक अवधि का स्वाभाविक हिन्दी संकेत।
- source_word: הֵנִיחַ
  choice: विश्राम दिया था
  rationale: נוח के हिफ़ील रूप में किसी को संघर्ष से राहत या विश्राम देने का भाव है; यह ईश्वर-प्रदत्त विश्राम के मूल धार्मिक बिंब को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: לוֹ
  choice: उसे
  rationale: הֵנִיחַ का परोक्ष कर्म; हिन्दी में ‘उसे विश्राम दिया’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे उपाधि से नहीं बदलता।
- issue: युद्ध के अभाव को किस दिशा में समझा जाए
  choice: उसका किसी से युद्ध नहीं हुआ था
  alternative: उसके विरुद्ध कोई युद्ध नहीं हुआ था
  rationale: עִמּוֹ का मूल अर्थ ‘उसके साथ’ है और वाक्य युद्ध में आसा की संलिप्तता के अभाव को सामान्य रूप से कह सकता है; ‘उसके विरुद्ध’ अर्थ को अधिक संकीर्ण कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ऐतिहासिक गद्य। ‘किलेबंद नगर’, ‘देश शांत था’ और ‘विश्राम दिया’ मूल के ठोस तथा धार्मिक बिंबों को बनाए रखते हैं।
