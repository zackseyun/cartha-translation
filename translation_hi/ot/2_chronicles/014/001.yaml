  text: Asa did what was good and right in the eyes of Yahweh his God[a].
translation:
  language: hi
  text: आसा ने वह किया जो उसके परमेश्वर यहोवा की दृष्टि में भला और सही था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “यहोवा की आँखों में”; यह इब्रानी मुहावरा यहोवा की दृष्टि या निर्णय में होने का अर्थ देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने…किया
  rationale: इस नैतिक मूल्यांकन वाले वाक्य-विन्यास में עשה का अर्थ आचरण करना या कार्य करना है; हिंदी में ‘ने वही किया जो…’ स्वाभाविक है।
- source_word: אָסָא
  choice: आसा
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: הַטּוֹב
  choice: भला
  rationale: यहाँ शब्द नैतिक रूप से अच्छे आचरण को सूचित करता है; ‘भला’ dignified और सामान्य हिंदी में उपयुक्त है।
- source_word: וְהַיָּשָׁר
  choice: और सही
  rationale: नैतिक संदर्भ में יָשָׁר का अर्थ उचित या ठीक है; ‘सही’ मूल के मूल्यांकनात्मक अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: इब्रानी मुहावरे ‘की आँखों में’ का आशय किसी के आकलन या निर्णय में है; ‘की दृष्टि में’ रूपक और अर्थ दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम का हिंदी बाइबल परंपरा में व्यापक और पहचाना हुआ लिप्यंतरण।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: यह रूप इस्राएल के परमेश्वर के लिए एकवचन अर्थ रखता है और तृतीय पुरुष एकवचन संबंध सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है। हिंदी पाठकों के लिए प्रचलित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ एक निकटतर वैकल्पिक विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘वही किया जो…’ मूल के विशेषणयुक्त कर्म-वाक्यांश को स्वाभाविक हिंदी में व्यक्त करता है।
