source:
  edition: WLC
  text: וַֽ/יְדַבְּר֔וּ אֶל אֱלֹהֵ֖י יְרוּשָׁלִָ֑ם כְּ/עַ֗ל אֱלֹהֵי֙ עַמֵּ֣י הָ/אָ֔רֶץ מַעֲשֵׂ֖ה יְדֵ֥י הָ/אָדָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/019.yaml
  text: And they spoke against the God of Jerusalem as against the gods of the peoples of the earth[b][a], the work of human hands.
translation:
  language: hi
  text: उन्होंने यरूशलेम के परमेश्वर के विरुद्ध वैसी ही बातें कहीं, जैसी पृथ्वी के लोगों के देवताओं के विरुद्ध—जो मनुष्य के हाथों की बनाई हुई वस्तुएँ हैं।[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘के विरुद्ध’ के स्थान पर अधिक शाब्दिक रूप से ‘की ओर/को’ है: “उन्होंने यरूशलेम के परमेश्वर से वैसी ही बातें कहीं, जैसी पृथ्वी के लोगों के देवताओं के विरुद्ध।” किंतु प्रसंग में वाणी विरोधपूर्ण और निंदात्मक है।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “मनुष्य के हाथों का काम।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: उन्होंने…बातें कहीं
  rationale: דבר का पिएल रूप सामान्यतः ‘बोलना/बातें कहना’ है। विरोध का भाव क्रिया में जोड़ने के बजाय अगले संबंधसूचक पद से व्यक्त किया गया है।
- source_word: אֶל
  choice: के विरुद्ध
  rationale: אֶל का सामान्य अर्थ ‘की ओर/से’ है, पर निकट प्रसंग में अश्शूरी सेवकों की निंदात्मक वाणी के कारण ‘के विरुद्ध’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אֱלֹהֵי יְרוּשָׁלִָם
  choice: यरूशलेम के परमेश्वर
  rationale: रूपतः אֱלֹהֵי बहुवचन-सदृश रचना है, किंतु इस्राएल के परमेश्वर के लिए इसका अर्थ एकवचन है; प्रसंग भी मनुष्य-निर्मित देवताओं से उसी एक परमेश्वर का विरोध दिखाता है।
- source_word: כְּעַל
  choice: वैसे ही…जैसे…के विरुद्ध
  rationale: यह अभिव्यक्ति तुलना और विरोधपूर्ण वाणी, दोनों को व्यक्त करती है। हिंदी में विभाजित ‘वैसे ही…जैसे’ रचना स्वाभाविक है।
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: पृथ्वी के लोगों के देवताओं
  rationale: यहाँ אֱלֹהֵי स्पष्टतः बहुवचन है। ‘पृथ्वी के लोग’ इब्रानी עַמֵּי הָאָרֶץ की व्यापकता बनाए रखता है।
- source_word: מַעֲשֵׂה יְדֵי הָאָדָם
  choice: मनुष्य के हाथों की बनाई हुई वस्तुएँ
  rationale: शाब्दिक ‘मनुष्य के हाथों का काम’ का आशय मनुष्य-निर्मित देवमूर्तियों से है। ‘बनाई हुई वस्तुएँ’ हिंदी में स्पष्ट है और वचन-सामंजस्य भी रखता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द जातिवाचक है, किसी विशेष पुरुष को नहीं दर्शाता; आधुनिक हिंदी में ‘मनुष्य’ इस सामान्य मानवीय अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: वाणी को यरूशलेम के परमेश्वर ‘से’ कही गई मानें या उसके ‘विरुद्ध’
  choice: के विरुद्ध
  alternative: से / की ओर
  rationale: निकट प्रसंग उपहास और निंदा का है। ‘के विरुद्ध’ אֶל की संदर्भगत विरोधी शक्ति व्यक्त करता है, जबकि उसका अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אֱלֹהֵי יְרוּשָׁלִָם को एकवचन मानें या बहुवचन
  choice: यरूशलेम के परमेश्वर
  alternative: यरूशलेम के देवता
  rationale: אֱלֹהִים और उसका रचनात्मक रूप इस्राएल के परमेश्वर के लिए नियमित रूप से एकवचन अर्थ रखते हैं। यहाँ उनका मनुष्य के हाथों बने बहुवचन देवताओं से स्पष्ट विरोध है।
- issue: अंतिम पदबंध का संबंध किनसे है
  choice: पृथ्वी के लोगों के देवताओं से
  alternative: सामान्य स्वतंत्र कथन
  rationale: निकटतम पूर्वपद और वाक्य का तर्क ‘मनुष्य के हाथों की बनाई हुई वस्तुएँ’ को अन्य जातियों के देवताओं का वर्णन बनाते हैं, यरूशलेम के परमेश्वर का नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर’ और ‘देवताओं’ का भेद मूल के एकवचन-बनाम-बहुवचन अर्थ को स्पष्ट करता है। तुलना को स्वाभाविक हिंदी ‘वैसे ही…जैसे’ में रखा गया है; वास्तविक संबंधसूचक अस्पष्टता पादटिप्पणी में सुरक्षित है।
