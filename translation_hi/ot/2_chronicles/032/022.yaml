source:
  edition: WLC
  text: וַ/יּוֹשַׁע֩ יְהוָ֨ה אֶת יְחִזְקִיָּ֜הוּ וְ/אֵ֣ת יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם מִ/יַּ֛ד סַנְחֵרִ֥יב מֶֽלֶךְ אַשּׁ֖וּר וּ/מִ/יַּד כֹּ֑ל וַֽ/יְנַהֲלֵ֖/ם מִ/סָּבִֽיב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/022.yaml
  text: So Yahweh saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib king of Assyria and from the hand of all others[b][a], and he guided them on every side.
translation:
  language: hi
  text: इस प्रकार यहोवा ने हिजकिय्याह और यरूशलेम के निवासियों को अश्शूर के राजा सन्हेरीब के हाथ से और अन्य सभी के हाथ से[a] बचाया, और हर ओर उनका मार्गदर्शन किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सबके हाथ से।” इब्रानी में “सब” का आशय स्पष्ट करने वाला संज्ञा-पद नहीं है; संभवतः अन्य शत्रु या विरोधी शक्तियाँ अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “और वह उन्हें चारों ओर ले चला।” कुछ लोग इसका व्यापक अर्थ “उसने उन्हें चारों ओर से सुरक्षा दी” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: बचाया
  rationale: यह ישׁע से है और संकट अथवा शत्रु की शक्ति से छुड़ाने का भाव व्यक्त करता है। ‘बचाया’ सहज हिन्दी में दैवी उद्धार का अर्थ बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ उस नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करती है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: यह कृदन्तीय पद शाब्दिक रूप से यरूशलेम में रहने वालों को दर्शाता है; ‘निवासी’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी मुहावरा किसी की शक्ति अथवा नियंत्रण से छुटकारा सूचित करता है। हिन्दी में यह बिंब समझ में आता है और मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा सन्हेरीब
  rationale: राजकीय उपाधि और नाम दोनों सुरक्षित हैं; हिन्दी में यह शब्दक्रम स्वाभाविक है।
- source_word: וּמִיַּד כֹּל
  choice: और अन्य सभी के हाथ से
  rationale: כֹּל का अपेक्षित संज्ञा-पद मूल में अनकहा है। ‘अन्य सभी’ सन्हेरीब के अतिरिक्त विरोधी शक्तियों का संभावित संकेत देता है, जबकि पादटिप्पणी मूल की अपूर्णता स्पष्ट करती है।
- source_word: וַיְנַהֲלֵם
  choice: और उन्हें मार्ग दिखाया
  rationale: נהל का मूल अर्थ अगुवाई करना या मार्ग दिखाना है। यह चयन ‘विश्राम दिया’ जैसी व्याख्यात्मक परिणति थोपे बिना दिशा-निर्देशन का भाव रखता है।
- source_word: מִסָּבִיב
  choice: चारों ओर
  rationale: यह आसपास अथवा हर ओर के विस्तार को व्यक्त करता है; ‘चारों ओर’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है, केवल उपाधि नहीं। इसलिए उसे नाम के रूप में रखा गया है।
- issue: וַיְנַהֲלֵם מִסָּבִיב का आशय
  choice: और उन्हें चारों ओर मार्ग दिखाया
  alternative: और उन्हें चारों ओर से चैन दिया
  rationale: נהל का प्रत्यक्ष शब्दार्थ अगुवाई करना या मार्ग दिखाना है। सुरक्षा अथवा चैन का भाव प्रसंग में निहित हो सकता है, पर उसे मुख्य पाठ में निश्चित अर्थ बनाकर नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। मूल के ‘हाथ’ वाले बिंब और נהל की अगुवाई-संबंधी अस्पष्टता को बनाए रखा गया है; व्याख्यात्मक विकल्प पादटिप्पणियों में दिए गए हैं।
