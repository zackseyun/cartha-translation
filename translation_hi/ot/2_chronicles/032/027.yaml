base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/027.yaml
  text: And Hezekiah had very great wealth and honor[a], and he made storehouses for silver and gold, precious stones, spices, shields[b], and every desirable article.
translation:
  language: hi
  text: हिजकिय्याह के पास बहुत अधिक धन और सम्मान था। उसने चाँदी, सोने, बहुमूल्य पत्थरों, सुगंध-द्रव्यों, ढालों और हर एक बहुमूल्य वस्तु[b] के लिए भंडारगृह[a] बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खजाने के कक्ष।” हिब्रू शब्द सामान्य भंडारों अथवा विशेष रूप से राजकीय खजाना रखने के कक्षों, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हर मूल्यवान वस्तु” या “हर प्रकार के बहुमूल्य पात्र।” हिब्रू पद व्यापक है और इसमें विविध विलासिता की वस्तुएँ सम्मिलित हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לִיחִזְקִיָּהוּ
  choice: हिजकिय्याह के पास ... था
  rationale: हिब्रू स्वामित्व-सूचक मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप; कथन की निरंतरता प्रसंग से स्पष्ट है।
- source_word: עֹשֶׁר וְכָבוֹד הַרְבֵּה מְאֹד
  choice: बहुत अधिक धन और सम्मान
  rationale: עֹשֶׁר को भौतिक समृद्धि के अर्थ में ‘धन’ और כָבוֹד को राजकीय प्रतिष्ठा के अर्थ में ‘सम्मान’ कहा गया है; הַרְבֵּה מְאֹד की तीव्रता ‘बहुत अधिक’ से व्यक्त होती है।
- source_word: וְאֹצָרוֹת עָשָׂה לוֹ
  choice: उसने ... भंडार बनवाए
  rationale: אֹצָרוֹת सामान्य भंडार अथवा खजाने के कक्ष हो सकते हैं। राजकीय निर्माण के सन्दर्भ में ‘बनवाए’ स्वाभाविक हिन्दी है और עָשָׂה के कारक अर्थ को उचित रूप से व्यक्त करता है।
- source_word: לְכֶסֶף וּלְזָהָב וּלְאֶבֶן יְקָרָה
  choice: चाँदी, सोने, बहुमूल्य पत्थरों ... के लिए
  rationale: हिब्रू की सूची को हिन्दी में स्वाभाविक संयुक्त सूची के रूप में रखा गया है; एकवचन אֶבֶן का आशय सामूहिक होने के कारण ‘पत्थरों’ किया गया है।
- source_word: וְלִבְשָׂמִים
  choice: सुगंध-द्रव्यों
  rationale: בְשָׂמִים सुगंधित मसालों, गंध-द्रव्यों या इत्र-सामग्री के लिए व्यापक शब्द है; ‘सुगंध-द्रव्य’ इस विस्तार को बिना अनावश्यक संकीर्णता के रखता है।
- source_word: וּלְמָגִנִּים
  choice: ढालों
  rationale: מָגִנִּים का विशिष्ट अर्थ ढालें है, सामान्य हथियार या कवच नहीं।
- source_word: וּלְכֹל כְּלֵי חֶמְדָּה
  choice: हर प्रकार की बहुमूल्य वस्तु
  rationale: כְּלֵי व्यापक रूप से वस्तुओं, पात्रों या उपकरणों को और חֶמְדָּה मनभावन अथवा मूल्यवान होने को सूचित करता है। हिन्दी पदबंध व्यापक अर्थ बनाए रखता है।
