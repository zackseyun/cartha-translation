language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֣וּ וְ/אַל תֵּחַ֗תּוּ מִ/פְּנֵי֙ מֶ֣לֶךְ אַשּׁ֔וּר וּ/מִ/לִּ/פְנֵ֖י כָּל הֶ/הָמ֣וֹן אֲשֶׁר עִמּ֑/וֹ כִּֽי עִמָּ֥/נוּ רַ֖ב מֵ/עִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/007.yaml
  text: Be strong and courageous[a]. Do not fear or be dismayed before the king of Assyria or before all the multitude that is with him[b], for there are more with us than with him.
translation:
  language: hi
  text: दृढ़ और साहसी बनो। अश्शूर के राजा और उसके साथ की सारी भीड़[a] से न डरो और न घबराओ, क्योंकि उसके साथ जितने हैं, उनसे अधिक हमारे साथ हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ की सारी सेना।” यहाँ प्रयुक्त इब्रानी शब्द बड़ी भीड़ को दर्शाता है और इस प्रसंग में सैनिकों के विशाल समूह के लिए भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि हमारे साथ, उसके साथ से अधिक है।” यह एक संक्षिप्त तुलना है, जिसे अगला पद स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: दृढ़ और साहसी बनो
  rationale: दोनों बहुवचन आज्ञार्थक क्रियाएँ एक प्रचलित उत्साहवर्धक युग्म बनाती हैं। यह रूप उनकी शक्ति और साहस—दोनों की पुकार को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: न डरो और न घबराओ
  rationale: पहली क्रिया भय और दूसरी संकट के सामने हताश या आतंकित हो जाने का भाव व्यक्त करती है। ‘घबराओ’ सामान्य पाठक के लिए स्वाभाविक है और प्रसंग का भावात्मक बल बनाए रखता है।
- source_word: מִפְּנֵי ... וּמִלִּפְנֵי
  choice: '... से'
  rationale: भय व्यक्त करने वाली हिन्दी रचना में ‘से डरना/घबराना’ इब्रानी के ‘सामने/उपस्थिति के कारण’ वाले मुहावरे का सहज समतुल्य है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: इब्रानी संबंध-वाचक पदबंध का सीधा और पारदर्शी अनुवाद।
- source_word: כָּל הֶהָמוֹן אֲשֶׁר עִמּוֹ
  choice: उसके साथ की सारी भीड़
  rationale: הָמוֹן बड़ी भीड़ या जनसमूह को दर्शाता है और सैनिक संदर्भ में सेना की विशाल संख्या के लिए भी प्रयुक्त हो सकता है। ‘भीड़’ मूल शब्द की व्यापकता बचाती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रोत्साहन का कारण प्रस्तुत करता है।
- source_word: עִמָּנוּ רַב מֵעִמּוֹ
  choice: उसके साथ जितने हैं, उनसे अधिक हमारे साथ हैं
  rationale: इब्रानी वाक्य संक्षिप्त और लुप्तपदीय है—शाब्दिक रूप से, ‘हमारे साथ [उससे] अधिक है।’ हिन्दी में तुलना स्पष्ट करने के लिए ‘जितने हैं’ जोड़ा गया है, पर अगले पद की स्पष्ट धार्मिक व्याख्या को इस पद में नहीं लाया गया।
theological_decisions:
- issue: अंतिम खंड की लुप्तपदीय तुलना
  choice: 'साथ रहने वालों या उपलब्ध सहायता की परिमाणात्मक तुलना: ‘उसके साथ जितने हैं, उनसे अधिक हमारे साथ हैं’'
  alternative: 'एकवचन व्यक्तिगत अर्थ: ‘जो हमारे साथ है, वह उसके साथ वाले से बड़ा है’'
  rationale: मूल में רַב एकवचन रूप में है, पर वाक्य लुप्तपदीय है और तत्काल प्रसंग अश्शूरी जनसमूह के सामने यहूदा के पक्ष की सहायता की तुलना करता है। अगला पद सहायता के स्वरूप को स्पष्ट करता है; इसलिए यहाँ किसी दूसरे प्रसिद्ध धार्मिक सूत्र की एकवचन शब्दावली आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य प्रसंग स्पष्ट है, पर הָמוֹן को अनिवार्य रूप से ‘सेना’ बनाकर उसकी अर्थ-व्याप्ति सीमित नहीं की गई। सभी आज्ञाएँ बहुवचन में हैं।
