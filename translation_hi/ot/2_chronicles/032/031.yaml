  text: וְ/כֵ֞ן בִּ/מְלִיצֵ֣י שָׂרֵ֣י בָּבֶ֗ל הַֽ/מְשַׁלְּחִ֤ים עָלָי/ו֙ לִ/דְרֹ֗שׁ הַ/מּוֹפֵת֙ אֲשֶׁ֣ר הָיָ֣ה בָ/אָ֔רֶץ עֲזָב֖/וֹ הָֽ/אֱלֹהִ֑ים לְ/נַ֨סּוֹת֔/וֹ לָ/דַ֖עַת כָּל בִּ/לְבָבֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/031.yaml
  text: And so[a], in the matter of the envoys of the princes of Babylon, who had been sent to him to inquire about the sign that had happened in the land, God left him, to test him[b], to know all that was in his heart.
translation:
  language: hi
  text: और इसी प्रकार, बाबेल के अधिकारियों के दूतों के विषय में भी—जो देश में हुए चिन्ह[a] के बारे में पूछताछ करने के लिए उसके पास भेजे गए थे—परमेश्वर ने उसे छोड़ दिया, ताकि उसे परखे और उसके हृदय में जो कुछ था, वह सब जाने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अद्भुत घटना” अथवा “शकुनसूचक संकेत।”
    reason: מוֹפֵת की अर्थ-सीमा में चिन्ह, आश्चर्यजनक घटना और असाधारण पूर्वसूचक संकेत शामिल हो सकते हैं।
lexical_decisions:
- source_word: וְכֵן
  choice: और इसी प्रकार
  rationale: यह पिछले वृत्तांत से जुड़ी एक और परिस्थिति प्रस्तुत करता है और इब्रानी के संयोजक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּמְלִיצֵי שָׂרֵי בָּבֶל
  choice: बाबेल के हाकिमों के उन दूतों के मामले में
  rationale: מְלִיצֵי यहाँ मध्यस्थों अथवा राजदूतों को दर्शाता है; בִּ को प्रसंगगत अर्थ में ‘के मामले में’ कहा गया है। שָׂרֵי के लिए ‘हाकिमों’ राजनीतिक पद और अधिकार दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הַמְשַׁלְּחִים עָלָיו
  choice: जिन्हें उसके पास ... भेजा गया था
  rationale: रूप की कठिनाई के बावजूद प्रसंग दूतों के हिजकिय्याह के पास भेजे जाने का है। हिन्दी में कर्मवाच्य इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִדְרֹשׁ
  choice: के बारे में पूछताछ करने के लिए
  rationale: דרש यहाँ साधारण प्रश्न पूछने से अधिक, किसी घटना की जानकारी लेने या जाँच करने का भाव रखता है।
- source_word: הַמּוֹפֵת
  choice: चिन्ह
  rationale: מוֹפֵת का अर्थ चिन्ह, आश्चर्यकर्म या शकुनसूचक अद्भुत घटना हो सकता है। ‘चिन्ह’ व्यापक और संक्षिप्त है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר הָיָה בָאָרֶץ
  choice: देश में हुए
  rationale: היה यहाँ किसी उल्लेखनीय घटना के घटित होने को दर्शाता है; संक्षिप्त हिन्दी वाक्यांश घटना का भाव बनाए रखता है।
- source_word: עֲזָבוֹ
  choice: उसे छोड़ दिया
  rationale: עזב का अर्थ छोड़ना, त्यागना या अलग हो जाना हो सकता है। ‘छोड़ दिया’ मूल की गंभीरता रखता है, पर उससे अधिक प्रबल धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: निश्चित संज्ञा इस्राएल के परमेश्वर को दर्शाती है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ मानक और गरिमापूर्ण है।
- source_word: לְנַסּוֹתוֹ
  choice: उसे परखने
  rationale: נסה का सामान्य अर्थ जाँचना या परखना है। ‘परखने’ व्यक्ति के भीतर की वास्तविक दशा सामने आने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָדַעַת כָּל בִּלְבָבוֹ
  choice: उसके हृदय में जो कुछ था, वह सब जानने के लिए
  rationale: यह सीधा अर्थ मूल के उद्देश्य-वाचक रूप और ‘जानने’ की धर्मवैज्ञानिक जटिलता को बनाए रखता है। ‘हृदय’ इब्रानी मुहावरे में विचारों, इच्छाओं और उद्देश्यों सहित भीतरी मनुष्य को सूचित करता है।
theological_decisions:
- issue: परमेश्वर की परीक्षा और उसके जानने की भाषा
  choice: परमेश्वर ने उसे छोड़ दिया—उसे परखने और उसके हृदय में जो कुछ था, वह सब जानने के लिए
  alternative: परमेश्वर ने उसे छोड़ दिया, ताकि उसके हृदय में जो कुछ था उसे प्रकट कर दे
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘परखने’ और ‘जानने’ के लिए कहता है। मुख्य पाठ इसी भाषा और उससे उत्पन्न धर्मवैज्ञानिक तनाव को बनाए रखता है; ‘प्रकट करने’ जैसा व्याख्यात्मक समाधान पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। ‘हाकिम’, ‘दूत’, ‘चिन्ह’, ‘परखना’ और ‘हृदय’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल के राजनीतिक, चमत्कारिक और आंतरिक अर्थ-क्षेत्रों को बनाए रखते हैं।
