  text: עִמּ/וֹ֙ זְר֣וֹעַ בָּשָׂ֔ר וְ/עִמָּ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ לְ/עָזְרֵ֔/נוּ וּ/לְ/הִלָּחֵ֖ם מִלְחֲמֹתֵ֑/נוּ וַ/יִּסָּמְכ֣וּ הָ/עָ֔ם עַל דִּבְרֵ֖י יְחִזְקִיָּ֥הוּ מֶֽלֶךְ יְהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/008.yaml
  text: With him is an arm of flesh[a], but with us is Yahweh our God, to help us and to fight our battles. And the people relied on the words of Hezekiah king of Judah.
translation:
  language: hi
  text: उसके साथ मनुष्य की भुजा[a] है, पर हमारे साथ यहोवा, हमारे परमेश्वर, हमारी सहायता करने और हमारी लड़ाइयाँ लड़ने के लिए हैं। और लोगों ने यहूदा के राजा हिजकिय्याह की बातों पर भरोसा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य का बल।” इब्रानी में शाब्दिक रूप से “मांस की भुजा” है—अर्थात यहोवा की सहायता के विपरीत नश्वर मनुष्य की शक्ति।
    reason: शाब्दिक उपमा और उसके भावार्थ, दोनों को उपलब्ध कराना।
lexical_decisions:
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: यह संगति अथवा समर्थन व्यक्त करता है और आगे के ‘हमारे साथ’ के समानांतर रूप को बनाए रखता है।
- source_word: זְרוֹעַ בָּשָׂר
  choice: केवल मनुष्य की भुजा
  rationale: ‘भुजा’ की इब्रानी उपमा को बनाए रखते हुए בָּשָׂר का आशय नश्वर मानवीय सामर्थ्य के रूप में स्पष्ट करता है; ‘केवल’ निहित विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: וְעִמָּנוּ
  choice: पर हमारे साथ
  rationale: वाव यहाँ मानवीय शक्ति और परमेश्वर की सहायता के बीच प्रबल विरोध दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को सुरक्षित रखता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: सरल और स्वाभाविक वाचाई अभिव्यक्ति।
- source_word: לְעָזְרֵנוּ
  choice: जो हमारी सहायता करेंगे
  rationale: उद्देश्यसूचक infinitive को पिछले खंड से स्वाभाविक हिन्दी संबंध देता है।
- source_word: וּלְהִלָּחֵם מִלְחֲמֹתֵינוּ
  choice: और हमारी लड़ाइयाँ लड़ेंगे
  rationale: मूल के infinitive और सजातीय कर्म की युद्ध-संबंधी अभिव्यक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: וַיִּסָּמְכוּ
  choice: भरोसा किया
  rationale: क्रिया के आलंकारिक अर्थ—किसी पर टिकना या निर्भर होना—को प्रसंगानुकूल व्यक्त करता है।
- source_word: עַל דִּבְרֵי יְחִזְקִיָּהוּ
  choice: हिजकिय्याह की बातों पर
  rationale: बहुवचन ‘बातों’ और עַל के साथ भरोसा करने की संरचना को सुरक्षित रखता है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय पद और क्षेत्र को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में प्रयुक्त व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम-रूप में रखा गया है।
- issue: मानवीय और ईश्वरीय सहायता के बीच विरोध
  choice: ‘पर’ द्वारा विरोध को स्पष्ट करना
  alternative: ‘और’ से समन्वय बनाए रखना
  rationale: 'दोनों समानांतर खंडों का आशय स्पष्ट विरोधात्मक है: उसके पास नश्वर मानवीय सामर्थ्य है, जबकि यहूदा के साथ उसका परमेश्वर है।'
- issue: לְעָזְרֵנוּ וּלְהִלָּחֵם के कालगत रूप का हिन्दी निर्वाह
  choice: ‘जो ... करेंगे और ... लड़ेंगे’
  alternative: ‘हमारी सहायता करने और हमारी लड़ाइयाँ लड़ने के लिए’
  rationale: इब्रानी infinitives उद्देश्य बताते हैं; हिन्दी का भविष्यकालीन संबंधवाचक खंड उसी आश्वासन को स्वाभाविक रूप से व्यक्त करता है, बिना परिणाम की अतिरिक्त निश्चितता जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सहज। ‘मनुष्य की भुजा’ से मूल उपमा रखी गई है और पादटिप्पणी में शाब्दिक रूप तथा भावार्थ दिया गया है।
