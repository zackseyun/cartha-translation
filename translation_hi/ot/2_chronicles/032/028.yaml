  text: उसने अनाज, नए दाखरस[b] और तेल की उपज के लिए भंडारगृह[a], सब प्रकार के पशुओं के लिए पशुशालाएँ, और झुंडों के लिए बाड़े[c] भी बनवाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भंडारण-नगर”; इब्रानी शब्द बड़े भंडारण-परिसरों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “नया दाखरस” उस इब्रानी शब्द का अनुवाद है जो कृषि-सूचियों में प्रायः सामान्य मदिरा से अलग, अंगूर की नई उपज के लिए आता है।
    reason: lexical_alternative
  - marker: c
    text: या “घेरे हुए स्थान।”
    reason: lexical_alternative
