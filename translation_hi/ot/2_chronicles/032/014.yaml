  text: מִ֠י בְּֽ/כָל אֱלֹהֵ֞י הַ/גּוֹיִ֤ם הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר הֶחֱרִ֣ימוּ אֲבוֹתַ֔/י אֲשֶׁ֣ר יָכ֔וֹל לְ/הַצִּ֥יל אֶת עַמּ֖/וֹ מִ/יָּדִ֑/י כִּ֤י יוּכַל֙ אֱלֹ֣הֵי/כֶ֔ם לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/014.yaml
  text: Who among all the gods of these nations that my fathers devoted to destruction was able to deliver his people from my hand[a], that your God should be able to deliver you from my hand?
translation:
  language: hi
  text: इन जातियों के उन सब देवताओं में से कौन था, जिन्हें मेरे पुरखाओं ने विनाश के लिए समर्पित कर दिया था, जो अपनी प्रजा को मेरे हाथ से छुड़ा सका[a]? फिर तुम्हारा परमेश्वर तुम्हें मेरे हाथ से कैसे छुड़ा सकेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें मेरे पुरखाओं ने पूर्ण विनाश के अधीन कर दिया था।” इब्रानी क्रिया का अर्थ किसी को विनाश के लिए समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הַגּוֹיִם הָאֵלֶּה
  choice: इन जातियों के उन सब देवताओं में से कौन
  rationale: מִי और בְּכָל का अंशवाचक भाव ‘सब ... में से कौन’ से स्वाभाविक रूप में व्यक्त होता है। ‘देवताओं’ मूल वक्ता की भाषा को बिना संपादकीय टिप्पणी के बनाए रखता है।
- source_word: אֲשֶׁר הֶחֱרִימוּ אֲבוֹתַי
  choice: जिन जातियों को मेरे पुरखाओं ने विनाश के लिए अर्पित कर दिया था
  rationale: संबंधवाचक उपवाक्य को निकटतम व्याकरणिक पूर्वपद ‘जातियों’ से जोड़ा गया है। חרם साधारण नाश से अधिक, किसी को विनाश के लिए समर्पित करने का तकनीकी भाव रखता है; ‘पुरखाओं’ से राजकीय पूर्वजों/पूर्ववर्तियों का अर्थ सहज रहता है।
- source_word: יָכוֹל לְהַצִּיל אֶת עַמּוֹ מִיָּדִי
  choice: अपनी प्रजा को मेरे हाथ से छुड़ा सका
  rationale: נצל का सैन्य-संकट संबंधी अर्थ ‘छुड़ाना’ है। ‘मेरे हाथ से’ शक्ति और नियंत्रण के पारदर्शी इब्रानी रूपक को सुरक्षित रखता है।
- source_word: כִּי יוּכַל אֱלֹהֵיכֶם
  choice: फिर तुम्हारा परमेश्वर ... कैसे छुड़ा सकेगा
  rationale: כִּי सहित यह खंड पिछले प्रश्न से निकला अविश्वासपूर्ण निष्कर्ष और चुनौती व्यक्त करता है। हिंदी में ‘फिर ... कैसे’ उस तिरस्कारपूर्ण प्रश्न को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהַצִּיל אֶתְכֶם מִיָּדִי
  choice: तुम्हें मेरे हाथ से ... छुड़ा सकेगा
  rationale: पहले आए נצל और מִיָּדִי के साथ शब्दावली की संगति रखी गई है।
theological_decisions:
- issue: חרם का अर्थ
  choice: विनाश के लिए अर्पित कर दिया था
  alternative: नष्ट कर दिया था; पूर्ण विनाश के अधीन कर दिया था
  rationale: यह चयन क्रिया के समर्पण और विनाश—दोनों पक्षों को रखता है और उसे केवल सामान्य सैन्य पराजय तक सीमित नहीं करता।
- issue: अन्य जातियों के אֱלֹהִים का उल्लेख
  choice: देवताओं
  alternative: कथित देवताओं; मूर्तियों
  rationale: मूल वक्ता इन्हें सीधे ‘देवता’ कहता है; ‘कथित’ या ‘मूर्तियाँ’ जोड़ना पाठ में निहित न होने वाली व्याख्या होगी।
- issue: כִּי से आरंभ अंतिम चुनौती का संबंध
  choice: 'अलग किंतु संबद्ध प्रश्न: ‘फिर ... कैसे’'
  alternative: 'एक ही लंबा प्रश्न: ‘कि तुम्हारा परमेश्वर ...’'
  rationale: इब्रानी वाक्य पिछले उदाहरणों से निष्कर्ष निकालते हुए अविश्वास प्रकट करता है। दो प्रश्नों में हिंदी रूपांतरण तर्क और व्यंग्य को स्पष्ट करता है, जबकि कारणात्मक/निष्कर्षात्मक संबंध बना रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘प्रजा’, ‘पुरखाओं’ और ‘मेरे हाथ से’ राजकीय-सैन्य संदर्भ तथा मूल रूपक को बनाए रखते हैं। वक्ता के उपहास को ‘फिर ... कैसे छुड़ा सकेगा?’ से स्पष्ट किया गया है।
