  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יְחִזְקִיָּ֖הוּ וַ/חֲסָדָ֑י/ו הִנָּ֣/ם כְּתוּבִ֗ים בַּ/חֲז֞וֹן יְשַֽׁעְיָ֤הוּ בֶן אָמוֹץ֙ הַ/נָּבִ֔יא עַל סֵ֥פֶר מַלְכֵי יְהוּדָ֖ה וְ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/032.yaml
  text: The rest of the acts of Hezekiah and his faithful deeds—behold[a], they are written in the vision of Isaiah son of Amoz, the prophet, in the Book of the Kings of Judah and Israel.
translation:
  language: hi
  text: हिजकिय्याह के बाकी काम और उसके निष्ठापूर्ण कार्य[a]—देखो, वे आमोस के पुत्र यशायाह नबी के दर्शन में, यहूदा और इस्राएल के राजाओं की पुस्तक में लिखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाचा के प्रति उसकी निष्ठा के कार्य” अथवा “उसके निष्ठा के कार्य।” इब्रानी शब्द में निष्ठापूर्ण और वफादार भलाई का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: राजकीय इतिहास के समापन-सूत्र में דִּבְרֵי केवल कथनों को नहीं, बल्कि राजा के कार्यों और मामलों को दर्शाता है; इसलिए स्वाभाविक हिन्दी में ‘बाकी काम’ उपयुक्त है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: וַחֲסָדָיו
  choice: उसके निष्ठापूर्ण कार्य
  rationale: חֶסֶד यहाँ राजा के ऐसे कार्यों को सूचित करता है जिनमें निष्ठा और वफादारी झलकती है; यह चयन उस अर्थ को बनाए रखता है, पर मुख्य पाठ में अनावश्यक रूप से तकनीकी वाचा-संबंधी अर्थ नहीं जोड़ता।
- source_word: הִנָּם
  choice: देखो, वे
  rationale: यह प्रस्तुतिकरण सूचक अव्यय आगे कही बात की ओर ध्यान खींचता है; ‘देखो’ उसकी आलंकारिक शक्ति को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: כְּתוּבִים
  choice: लिखे हैं
  rationale: इब्रानी निष्क्रिय कृदंत का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בַּחֲזוֹן
  choice: दर्शन में
  rationale: חָזוֹן का प्राथमिक अर्थ ‘दर्शन’ है; इसे ‘वृत्तांत’ या ‘भविष्यवाणी’ बनाकर अर्थ को संकुचित नहीं किया गया।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: आमोस के पुत्र यशायाह नबी
  rationale: वंश-सूचना और नबी के पद, दोनों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: עַל סֵפֶר מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल के राजाओं की पुस्तक में
  rationale: ग्रंथ-संदर्भ के इस सूत्र में עַל दोनों लिखित स्रोतों को जोड़ता है; हिन्दी में ‘पुस्तक में’ सबसे स्वाभाविक है, जबकि ‘पर’ भ्रामक या असहज होता।
theological_decisions:
- issue: हिजकिय्याह के कार्यों के लिए חֶסֶד की अर्थ-छाया
  choice: निष्ठापूर्ण कार्य
  alternative: वाचा के प्रति निष्ठा के कार्य; वफादारी के कार्य; भले काम
  rationale: शब्द में संबंधपरक निष्ठा, वफादारी और कृपालु भलाई की अर्थ-छायाएँ हैं। मानव राजा के आचरण के संदर्भ में ‘निष्ठापूर्ण कार्य’ सकारात्मक नैतिक और संबंधपरक भाव को सुरक्षित रखता है, पर संदर्भ से अधिक प्रबल तकनीकी वाचा-सिद्धांत आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध ऐतिहासिक-वृत्तांत शैली का प्रयोग किया गया है। ‘देखो’ मूल के ध्यानाकर्षक भाव को बनाए रखता है। स्रोत-ग्रंथ के साथ संबंध की कुछ व्याकरणिक अस्पष्टता को विराम-चिह्नों द्वारा अनावश्यक रूप से कठोर नहीं किया गया।
