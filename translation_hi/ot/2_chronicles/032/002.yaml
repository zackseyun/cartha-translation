- source_word: לַמִּלְחָמָה
  choice: युद्ध करने का
  rationale: मुहावरे के साथ यह युद्ध के उद्देश्य को व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: युद्ध के संदर्भ में यह शत्रुतापूर्ण दिशा बताता है।
- source_word: יְרוּשָׁלִָם
