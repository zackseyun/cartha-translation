  text: וַ/יִּתְפַּלֵּ֞ל יְחִזְקִיָּ֣הוּ הַ/מֶּ֗לֶךְ וִֽ/ישַֽׁעְיָ֧הוּ בֶן אָמ֛וֹץ הַ/נָּבִ֖יא עַל זֹ֑את וַֽ/יִּזְעֲק֖וּ הַ/שָּׁמָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/020.yaml
  text: Then Hezekiah the king and Isaiah son of Amoz[a], the prophet, prayed because of this and cried out to heaven.
translation:
  language: hi
  text: तब राजा हिजकिय्याह और आमोस के पुत्र यशायाह नबी ने इस विषय में प्रार्थना की और स्वर्ग[a] की ओर पुकारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशों की ओर।’ इब्रानी संज्ञा का रूप बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: פלל के हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है। इब्रानी में पहला क्रियापद एकवचन है, यद्यपि कर्ता संयुक्त है; आगे बहुवचन क्रिया आती है। स्वाभाविक हिन्दी में दोनों व्यक्तियों को इस क्रिया का संयुक्त कर्ता बनाया गया है।
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: राजा हिजकिय्याह
  rationale: व्यक्तिनाम के साथ स्पष्ट राजकीय पदवी को हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: וִישַׁעְיָהוּ בֶן־אָמֹוץ הַנָּבִיא
  choice: आमोस के पुत्र यशायाह नबी
  rationale: वंश-सूचक पहचान और नबी की पदवी, दोनों को मूल के अनुसार सुरक्षित रखा गया है।
- source_word: עַל־זֹאת
  choice: इस विषय में
  rationale: यह पद उस विषय या परिस्थिति को दर्शाता है जिसके संबंध में प्रार्थना की गई। ‘इस विषय में’ कारण और विषय के बीच मूल में विद्यमान हल्के खुलेपन को बनाए रखता है।
- source_word: וַיִּזְעֲקוּ
  choice: पुकारा
  rationale: זעק संकट में की गई तीव्र पुकार को व्यक्त करता है। ‘पुकारा’ सरल, स्वाभाविक और पर्याप्त रूप से प्रबल हिन्दी है।
- source_word: הַשָּׁמָיִם
  choice: स्वर्ग की ओर
  rationale: संज्ञा इब्रानी में बहुवचन रूप वाली है, पर यहाँ दिशा और ईश्वरीय लोक की ओर की गई विनती का भाव है। आधुनिक हिन्दी में ‘स्वर्ग की ओर’ स्वाभाविक है; रूपगत बहुवचन को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: प्रार्थना के प्रसंग में הַשָּׁמָיִם का अनुवाद
  choice: स्वर्ग की ओर
  alternative: आकाशों की ओर
  rationale: यह वाक्य पुकार की दिशा बताता है, कोई विस्तृत ब्रह्मांड-विज्ञान प्रतिपादित नहीं करता। ‘स्वर्ग की ओर’ आधुनिक हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी इब्रानी के बहुवचन रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। नामों और पदवियों को प्रचलित बाइबलीय हिन्दी रूप में रखा गया है; भाषा को न तो अत्यधिक संस्कृतनिष्ठ बनाया गया है, न बोलचाल की अनौपचारिकता दी गई है।
