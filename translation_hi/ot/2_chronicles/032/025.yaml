base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/025.yaml
  text: But Hezekiah did not repay according to the benefit done to him[a], because his heart was proud; therefore wrath came upon him and upon Judah and Jerusalem.
translation:
  language: hi
  text: परन्तु हिजकिय्याह ने अपने ऊपर किए गए उपकार के अनुरूप प्रतिफल नहीं दिया[a], क्योंकि उसका मन घमण्ड से भर गया था। इसलिए उस पर और यहूदा तथा यरूशलेम पर प्रकोप हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ की गई भलाई के अनुरूप प्रत्युत्तर नहीं दिया।” इब्रानी अभिव्यक्ति का व्यापक अर्थ है—प्राप्त भलाई के लिए उचित प्रतिदान करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִגְמֻל עָלָיו
  choice: अपने ऊपर किए गए उपकार के अनुरूप
  rationale: גְּמוּל यहाँ हिजकिय्याह को मिले भले कार्य या उपकार को सूचित करता है; כִּ तुलना या अनुरूपता व्यक्त करता है। यह रूप दैवी चंगाई और छुटकारे के संदर्भ को रखते हुए प्रतिफल के किसी एक विशिष्ट रूप को निर्धारित नहीं करता।
- source_word: הֵשִׁיב
  choice: प्रतिफल नहीं दिया
  rationale: שׁוב का हिफ़ील रूप मूलतः लौटाने या प्रत्युत्तर देने का भाव रखता है। גמול के साथ यहाँ प्राप्त उपकार का उचित प्रतिदान करने का अर्थ है; 'प्रतिफल नहीं दिया' हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: גָבַהּ לִבּוֹ
  choice: उसका मन घमण्ड से भर गया था
  rationale: शाब्दिक मुहावरा 'उसका हृदय ऊँचा हो गया' अभिमान को व्यक्त करता है। आधुनिक हिन्दी में 'मन घमण्ड से भर गया' आन्तरिक नैतिक दशा को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: קֶצֶף
  choice: प्रकोप
  rationale: קֶצֶף तीव्र कोप, विशेषतः न्यायकारी दैवी रोष, का सूचक है। 'प्रकोप' प्रसंग की गम्भीरता बनाए रखता है।
- source_word: וַיְהִי עָלָיו קֶצֶף
  choice: उस पर ... प्रकोप हुआ
  rationale: इब्रानी रचना अस्तित्व या परिणाम बताती है। यह हिन्दी अभिव्यक्ति प्रकोप के घटित होने को दर्शाती है और उसके कर्ता को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: यहूदा तथा यरूशलेम
  rationale: स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
theological_decisions:
- issue: दैवी उपकार के प्रति हिजकिय्याह की विफलता का स्वरूप
  choice: हिजकिय्याह ने मिले उपकार के अनुरूप उचित प्रतिफल नहीं दिया; इसे केवल मौखिक धन्यवाद तक सीमित नहीं किया गया।
  alternative: हिजकिय्याह ने उपकार के लिए धन्यवाद नहीं दिया।
  rationale: इब्रानी कथन व्यापक रूप से उचित प्रत्युत्तर या प्रतिदान न देने की बात करता है। संकुचित अर्थ जोड़ने के बजाय नैतिक मूल्यांकन की व्यापकता सुरक्षित रखी गई है।
- issue: प्रकोप का स्रोत
  choice: 'कर्ता को अप्रकट रखा गया: ''प्रकोप हुआ।'''
  alternative: '''यहोवा का प्रकोप हुआ'' या ''परमेश्वर का प्रकोप हुआ।'''
  rationale: सन्दर्भ में प्रकोप दैवी समझा जाता है, पर इस उपवाक्य में इब्रानी पाठ कर्ता का स्पष्ट नाम नहीं लेता। अनुवाद उसी निहितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। 'परन्तु', 'उपकार', 'प्रतिफल' और 'प्रकोप' जैसे शब्द बाइबलीय गम्भीरता रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं।
