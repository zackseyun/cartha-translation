  yaml_path: translation/ot/2_chronicles/032/010.yaml
  text: 'Thus says Sennacherib king of Assyria: On what are you trusting, that you remain under siege in Jerusalem?'
translation:
  language: hi
  text: 'अश्शूर का राजा सन्हेरीब यह कहता है: “तुम किस बात पर भरोसा करके यरूशलेम में घिरे बैठे हो?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל מָה
  choice: किस बात पर
  rationale: यह इब्रानी प्रश्न भरोसे के आधार को पूछता है; ‘किस बात पर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को बनाए रखता है।
- source_word: בֹּטְחִים
  choice: भरोसा करके
  rationale: क्रिया भरोसा या विश्वास रखने को व्यक्त करती है; अगले खंड से संबंध दिखाने के लिए हिन्दी में कृदंत रूप स्वाभाविक है।
- source_word: וְיֹשְׁבִים בְּמָצוֹר
  choice: घिरे बैठे हो
  rationale: शाब्दिक ‘घेराबंदी में बैठे/रहते हो’ का स्वाभाविक और सजीव हिन्दी रूप, जो निरंतर घेराबंदी की स्थिति व्यक्त करता है।
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा सन्हेरीब
  rationale: व्यक्ति और राज्य के प्रचलित हिन्दी बाइबलीय नामों के साथ मूल पदक्रम का स्वाभाविक हिन्दी रूप।
