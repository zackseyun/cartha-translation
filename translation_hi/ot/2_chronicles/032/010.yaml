  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में चुनौती और उपहास का भाव मूल के अनुसार बना रहता है; किसी व्याख्यात्मक धार्मिक निष्कर्ष को नहीं जोड़ा गया।
