base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/018.yaml
  text: And they called out loudly in Judean to the people of Jerusalem who were on the wall, to frighten them and to terrify them, so that they might capture the city.
translation:
  language: hi
  text: और उन्होंने शहरपनाह पर खड़े यरूशलेम के लोगों को डराने और आतंकित करने के लिए यहूदा की भाषा में ऊँचे स्वर से पुकारा, ताकि वे नगर पर अधिकार कर सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוּדִית
  choice: यहूदा की भाषा में
  rationale: यह शब्द उस समय यहूदा में बोली जाने वाली स्थानीय भाषा को दर्शाता है; आधुनिक पाठक के लिए यह रूप ‘यहूदी भाषा’ की अपेक्षा ऐतिहासिक संदर्भ अधिक स्पष्ट रखता है।
- source_word: עַל הַחוֹמָה
  choice: शहरपनाह पर खड़े
  rationale: עַל स्थान को दर्शाता है और הַחוֹמָה नगर की रक्षात्मक दीवार है; ‘शहरपनाह’ स्वाभाविक तथा प्रसंगानुकूल है।
- source_word: לְיָרְאָם וּלְבַהֲלָם
  choice: डराने और घबराने के लिए
  rationale: 'दोनों समानार्थी क्रियाओं का भेद बनाए रखा गया है: पहली भय उत्पन्न करने और दूसरी आतंकित अथवा विचलित करने का भाव देती है।'
- source_word: יִלְכְּדוּ
  choice: अधिकार कर सकें
  rationale: लכד का सैन्य प्रसंग में अर्थ नगर को पकड़ लेना या जीत लेना है; ‘अधिकार करना’ वर्तमान हिंदी में स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। मूल के उद्देश्यसूचक क्रम—लोगों को भयभीत करना ताकि नगर पर अधिकार किया जा सके—को सुरक्षित रखा गया है।
