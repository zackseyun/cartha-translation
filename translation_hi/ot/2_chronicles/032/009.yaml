- source_word: עַל יְחִזְקִיָּהוּ ... וְעַל כָּל יְהוּדָה
  choice: हिजकिय्याह ... और ... सभी यहूदावासियों के विरुद्ध
  rationale: दोहराया गया עַל संदेश की शत्रुतापूर्ण दिशा बताता है, इसलिए केवल ‘के पास’ या ‘से’ की अपेक्षा ‘के विरुद्ध’ उपयुक्त है।
- source_word: אֲשֶׁר בִּירוּשָׁלִַם
  choice: यरूशलेम में उपस्थित
  rationale: यह ‘समस्त यहूदा’ को यरूशलेम में मौजूद यहूदा के लोगों तक सीमित करता है; ‘उपस्थित’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: לֵאמֹר
  choice: यह कहने के लिए
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका है।
