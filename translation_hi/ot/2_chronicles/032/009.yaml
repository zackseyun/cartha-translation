  rationale: राजकीय संदर्भ में यह अधिकारियों या राजसेवकों को सूचित कर सकता है; ‘सेवकों’ से मूल शब्द का रूप और संदर्भगत व्यापकता दोनों सुरक्षित रहते हैं।
