base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/009.yaml
  text: After this[a], Sennacherib king of Assyria sent his servants to Jerusalem—while he was before Lachish with all his dominion with him—against Hezekiah king of Judah and against all Judah who were in Jerusalem, saying[b],
translation:
  language: hi
  text: 'इसके बाद अश्शूर के राजा सनहेरीब ने अपने राज-सेवकों को यरूशलेम भेजा, जब वह स्वयं लाकीश के विरुद्ध था[a] और उसकी सारी प्रभुता उसके साथ थी[b], ताकि वे यहूदा के राजा हिजकिय्याह और यरूशलेम में रहने वाले यहूदा के सभी लोगों के विरुद्ध यह कहें:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाकीश के सामने था” या “लाकीश को घेरे हुए था।” इब्रानी में शाब्दिक रूप से “लाकीश पर/के विरुद्ध” है, जो सैन्य संदर्भ में प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी सारी सेना उसके साथ थी।” इब्रानी “उसकी सारी प्रभुता” से उसके शासनाधिकार/राज्य का अर्थ हो सकता है, या इस संदर्भ में उसके अधीन पूरी शक्ति का।
    reason: lexical_alternative
