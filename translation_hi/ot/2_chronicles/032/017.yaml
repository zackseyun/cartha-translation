  text: וּ/סְפָרִ֣ים כָּתַ֔ב לְ/חָרֵ֕ף לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/לֵֽ/אמֹ֨ר עָלָ֜י/ו לֵ/אמֹ֗ר כֵּֽ/אלֹהֵ֞י גּוֹיֵ֤ הָ/אֲרָצוֹת֙ אֲשֶׁ֨ר לֹא הִצִּ֤ילוּ עַמָּ/ם֙ מִ/יָּדִ֔/י כֵּ֣ן לֹֽא יַצִּ֞יל אֱלֹהֵ֧י יְחִזְקִיָּ֛הוּ עַמּ֖/וֹ מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/017.yaml
  text: He also wrote letters to mock Yahweh[a], the God of Israel, and to speak against him, saying, “Just as the gods of the nations of the lands have not delivered their people from my hand, so the God of Hezekiah will not deliver his people from my hand.”
translation:
  language: hi
  text: 'उसने यहोवा[a], इस्राएल के परमेश्वर, का अपमान करने और उसके विरुद्ध बोलने के लिए पत्र भी लिखे: “जैसे देशों की जातियों के देवता अपने लोगों को मेरे हाथ से नहीं छुड़ा सके, वैसे ही हिजकिय्याह का परमेश्वर भी अपने लोगों को मेरे हाथ से नहीं छुड़ा सकेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा की निंदा करने” अथवा “यहोवा को ललकारने।” इब्रानी क्रिया में अपमान और तिरस्कार का भाव है।
    reason: לְחָרֵף के निकट अर्थों और उसके तीखे निंदात्मक भाव को दर्शाने के लिए।
lexical_decisions:
- source_word: וּסְפָרִים כָּתַב
  choice: उसने ... पत्र भी लिखे
  rationale: सְפָרִים इस प्रसंग में लिखित पत्रों को दर्शाता है; आरंभिक ו कथानक की निरंतरता को ‘भी’ से स्वाभाविक रूप में व्यक्त करता है।
- source_word: לְחָרֵף
  choice: का अपमान करने
  rationale: חרף का अर्थ निंदा, तिरस्कार या अपमान करना है। ‘अपमान करने’ से परमेश्वर के विरुद्ध उद्दंड और निंदात्मक भाव स्पष्ट रहता है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध को सीधा और स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: וְלֵאמֹר עָלָיו
  choice: उसके विरुद्ध यह कहने
  rationale: प्रसंग में עָלָיו तटस्थ रूप से ‘उसके विषय में’ नहीं, बल्कि विरोधी भाषण को व्यक्त करता है।
- source_word: כֵּאלֹהֵי גּוֹיֵי הָאֲרָצוֹת
  choice: जैसे दूसरे देशों की जातियों के देवता
  rationale: तुलना को ‘जैसे’ से रखा गया है। ‘दूसरे’ हिन्दी में बहुवचन הָאֲרָצוֹת के प्रसंगगत भाव को स्पष्ट करता है और अपने देश से बाहर की जातियों की ओर संकेत करता है।
- source_word: אֲשֶׁר לֹא הִצִּילוּ עַמָּם
  choice: अपने लोगों को ... नहीं छुड़ा सके
  rationale: Hiphil נצל सैन्य संकट से छुड़ाने या बचाने का अर्थ देता है; ‘छुड़ा सके’ शत्रु के हाथ से मुक्ति और दावे में निहित असमर्थता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: शक्ति और नियंत्रण के मूल रूपक को बनाए रखा गया है।
- source_word: כֵּן לֹא יַצִּיל
  choice: वैसे ही ... नहीं छुड़ा सकेगा
  rationale: כֵּן तुलना के उत्तरार्ध को प्रस्तुत करता है; एक ही क्रिया दोहराने से मूल की अलंकारिक समानांतरता बनी रहती है।
- source_word: אֱלֹהֵי יְחִזְקִיָּהוּ
  choice: हिजकिय्याह का परमेश्वर
  rationale: यह सीधा सम्बन्धवाचक अनुवाद है और वक्ता के तिरस्कारपूर्ण ढंग को बनाए रखता है।
- source_word: עַמּוֹ
  choice: अपने लोगों को
  rationale: प्रत्यय का संदर्भ हिजकिय्याह के परमेश्वर से है; हिन्दी में कर्ता के साथ ‘अपने’ स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ सामान्य उपाधि नहीं, टेट्राग्रामटन יהוה सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है और मूल में उपस्थित विशिष्ट नाम को उपाधि में नहीं बदलता।
- issue: अश्शूरी वक्ता द्वारा יהוה को जातियों के देवताओं के समान ठहराना
  choice: तुलना को बिना सुधार या व्याख्यात्मक नरमी के रखा गया
  alternative: उद्धरण में यह स्पष्ट जोड़ना कि उसका दावा झूठा था
  rationale: यह वक्ता का निंदात्मक दावा है; मूल पाठ उसकी धर्मवैज्ञानिक भूल को उद्धरण के भीतर संपादकीय टिप्पणी जोड़कर नहीं सुधारता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य मुहावरा ‘मेरे हाथ से’ तथा मूल की जैसे–वैसे समानांतर रचना सुरक्षित रखी गई है।
