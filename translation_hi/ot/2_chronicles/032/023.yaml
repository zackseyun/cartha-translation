  text: וְ֠/רַבִּים מְבִיאִ֨ים מִנְחָ֤ה לַ/יהוָה֙ לִ/יר֣וּשָׁלִַ֔ם וּ/מִ֨גְדָּנ֔וֹת לִֽ/יחִזְקִיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּנַּשֵּׂ֛א לְ/עֵינֵ֥י כָל הַ/גּוֹיִ֖ם מֵ/אַֽחֲרֵי כֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/023.yaml
  text: And many were bringing an offering to Yahweh in Jerusalem[a], and choice gifts to Hezekiah king of Judah[b], and after this he was exalted in the sight of all the nations.
translation:
  language: hi
  text: और बहुत-से लोग यरूशलेम में[a] यहोवा के लिए भेंट और यहूदा के राजा हिजकिय्याह के लिए बहुमूल्य उपहार[b] लाते रहे। इसके बाद वह सभी राष्ट्रों की दृष्टि में प्रतिष्ठित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरूशलेम को।” यहाँ प्रयुक्त हिब्रू पूर्वसर्ग का अर्थ गंतव्य या स्थान—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उत्तम उपहार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और बड़ी संख्या में लोगों को दर्शाता है; हिन्दी में स्पष्टता के लिए ‘लोग’ जोड़ा गया है।
- source_word: מְבִיאִים
  choice: लाते रहे
  rationale: प्रतिभागी रूप बीते समय में जारी या बार-बार होने वाली क्रिया व्यक्त करता है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यहोवा को दी जाने वाली वस्तु के संदर्भ में यह धार्मिक अर्पण का व्यापक और स्वाभाविक हिन्दी शब्द है, जो किसी खास बलिदान का अर्थ नहीं थोपता।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ प्राप्तकर्ता को चिह्नित करता है; परमेश्वर का व्यक्तिगत नाम יְהוָה ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: לִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: यहाँ לְ को भेंट चढ़ाने के स्थान के अर्थ में समझा गया है; गंतव्य ‘यरूशलेम को’ भी व्याकरणतः संभव है और पादटिप्पणी में रखा गया है।
- source_word: מִגְדָּנוֹת
  choice: बहुमूल्य उपहार
  rationale: शब्द मूल्यवान अथवा उत्तम वस्तुओं को सूचित करता है; ‘बहुमूल्य उपहार’ भोजन तक अर्थ को सीमित नहीं करता।
- source_word: וַיִּנַּשֵּׂא
  choice: बहुत प्रतिष्ठित हुआ
  rationale: निफ़ाल रूप पद और सम्मान में ऊँचा किए जाने अथवा ऊँचा माने जाने का भाव देता है; संदर्भ में सार्वजनिक प्रतिष्ठा स्वाभाविक है।
- source_word: לְעֵינֵי כָל הַגּוֹיִם
  choice: सभी राष्ट्रों की दृष्टि में
  rationale: हिब्रू मुहावरे को निकटता से रखते हुए सार्वजनिक मान-सम्मान का अर्थ व्यक्त करता है।
- source_word: מֵאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह वाक्यांश पूर्ववर्ती घटनाओं के बाद के समय को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है; इसे पदवी ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: וַיִּנַּשֵּׂא में सम्मान का कर्ता
  choice: वह बहुत प्रतिष्ठित हुआ
  alternative: वह बहुत ऊँचा किया गया
  rationale: हिब्रू निष्क्रिय/परिणामी भाव रखता है लेकिन यह नहीं बताता कि किसने उसे ऊँचा किया; हिन्दी में ऐसा रूप चुना गया है जो अनिर्दिष्ट कर्ता को बनाए रखता और प्रसंगगत प्रतिष्ठा व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण स्तर रखा गया है। ‘लाते रहे’ जारी/बार-बार हुई क्रिया को, और ‘दृष्टि में’ मूल हिब्रू मुहावरे को बनाए रखता है।
