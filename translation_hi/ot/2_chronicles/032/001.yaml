  text: אַחֲרֵ֨י הַ/דְּבָרִ֤ים וְ/הָ/אֱמֶת֙ הָ/אֵ֔לֶּה בָּ֖א סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר וַ/יָּבֹ֣א בִֽ/יהוּדָ֗ה וַ/יִּ֨חַן֙ עַל הֶ/עָרִ֣ים הַ/בְּצֻר֔וֹת וַ/יֹּ֖אמֶר לְ/בִקְעָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/001.yaml
  text: After these things and this faithfulness[a], Sennacherib king of Assyria came and entered Judah[c][b], and he encamped against the fortified cities and intended to break into them for himself.
translation:
  language: hi
  text: इन बातों और इस निष्ठा[a] के बाद अश्शूर का राजा सन्हेरीब आया और यहूदा में प्रवेश किया। उसने गढ़बंद नगरों के सामने छावनी डाली और उन्हें तोड़कर अपने अधिकार में करने की ठानी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों और इन विश्वासयोग्य कार्यों के बाद।” इब्रानी אֱמֶת का अर्थ “सत्य” या “निष्ठा/विश्वासयोग्यता” हो सकता है; यहाँ सम्भवतः पिछले प्रसंग में बताए गए हिजकियाह के विश्वासयोग्य आचरण की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “और उनमें सेंध लगाकर उन्हें अपने लिए जीत लेने का इरादा किया।” अंतिम इब्रानी वाक्यांश मुहावरेदार ढंग से सन्हेरीब का उद्देश्य बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי הַדְּבָרִים
  choice: इन सब बातों के बाद
  rationale: यह पदबंध पिछली घटनाओं और कार्यों की ओर संकेत करता है। ‘बातों’ से इब्रानी की व्यापकता बनी रहती है, जबकि ‘सब’ हिन्दी में संकेत को स्वाभाविक बनाता है।
- source_word: וְהָאֱמֶת הָאֵלֶּה
  choice: और इस विश्वासयोग्यता
  rationale: אֱמֶת का अर्थ ‘सत्य’ भी हो सकता है, पर पिछले प्रसंग में यह हिजकियाह के विश्वासयोग्य आचरण की ओर संकेत करता जान पड़ता है। मुख्य पाठ में व्यक्ति का नाम जोड़ने के बजाय मूल की अंतर्निहित संदर्भ-सूचना सुरक्षित रखी गई है।
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा सन्हेरीब
  rationale: राजकीय उपाधि और नाम को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘अश्शूर’ मूल जाति और साम्राज्य के नाम का प्रचलित बाइबलीय रूप है।
- source_word: וַיָּבֹא בִיהוּדָה
  choice: यहूदा में घुस गया
  rationale: ב के साथ गति-सूचक בוא यहाँ देश में प्रवेश को बताता है। आक्रमण के प्रसंग में ‘घुस गया’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּחַן עַל הֶעָרִים הַבְּצֻרוֹת
  choice: गढ़वाले नगरों के विरुद्ध छावनी डाली
  rationale: חנה על का मूल अर्थ किसी लक्ष्य के विरुद्ध पड़ाव डालना है। ‘घेरा डाला’ सम्भव है, पर वह पूर्ण घेराबंदी को मूल से अधिक स्पष्ट कर सकता है।
- source_word: וַיֹּאמֶר לְבִקְעָם אֵלָיו
  choice: और उन्हें तोड़कर अपने अधिकार में करने की ठानी
  rationale: אמר यहाँ मन में निश्चय या इरादा करने के अर्थ में है; בקע नगरों की सुरक्षा तोड़ने या उनमें सेंध लगाने को दर्शाता है। אֵלָיו का दिशात्मक/लाभार्थक भाव ‘अपने अधिकार में’ से स्वाभाविक हिन्दी में व्यक्त होता है।
