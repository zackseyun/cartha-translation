base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/030.yaml
  text: It was Hezekiah who stopped up the upper outlet of the waters of Gihon and directed them down to the west side of the city of David[b][a]. And Hezekiah prospered in all his work.
translation:
  language: hi
  text: हिजकिय्याह ने ही गीहोन के जल के ऊपरी निकास[a] को बंद कर दिया और उन्हें नीचे, दाऊद के नगर के पश्चिमी भाग की ओर मोड़ दिया[b]। हिजकिय्याह अपने हर काम में सफल हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गीहोन के ऊपरी सोते को।” इब्रानी शब्द उस स्थान को दर्शा सकता है जहाँ से जल निकलता है, या व्यापक अर्थ में स्वयं सोते अथवा उसके बहाव को।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें सीधा मार्ग दिया” अथवा “उन्हें एक सीधी दिशा में बहाया।” इब्रानी क्रिया जल को एक निश्चित, सीधी दिशा में ले जाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יְחִזְקִיָּהוּ
  choice: उसी हिजकिय्याह ने
  rationale: सर्वनाम और नाम का संयुक्त प्रयोग कर्ता पर बल देता है; ‘उसी हिजकिय्याह ने’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָתַם
  choice: बंद कर दिया
  rationale: यह क्रिया किसी निकास या खुले स्थान को रोकने अथवा बंद करने का बोध देती है और जल-प्रबंध के प्रसंग में सहज है।
- source_word: מוֹצָא מֵימֵי גִיחוֹן הָעֶלְיוֹן
  choice: गीहोन के जल के ऊपरी निकास
  rationale: इससे संबंध-श्रृंखला और ‘ऊपरी’ स्थलाकृतिक विशेषण सुरक्षित रहते हैं, जबकि निकास-स्थान और सोते के बीच की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: וַיַּישְּׁרֵם
  choice: उस जल को ... प्रवाहित किया
  rationale: ישר के कारक अर्थ में जल को निश्चित अथवा सीधी दिशा में ले जाना अभिप्रेत है; ‘प्रवाहित किया’ हिन्दी में स्वाभाविक है, और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְמַטָּה מַּעְרָבָה לְעִיר דָּוִיד
  choice: नीचे की ओर दाऊदपुर के पश्चिम में
  rationale: यह अनुवाद नीचे की दिशा और पश्चिमी स्थिति दोनों को व्यक्त करता है। ‘दाऊदपुर’ עיר דוד का प्रचलित, संक्षिप्त हिन्दी स्थाननाम है।
- source_word: וַיַּצְלַח
  choice: सफल हुआ
  rationale: क्रिया सफलता या समृद्धि का अर्थ देती है; कार्यों के प्रसंग में ‘सफल हुआ’ स्पष्ट और आधुनिक हिन्दी है।
- source_word: בְּכָל מַעֲשֵׂהוּ
  choice: अपने हर काम में
  rationale: एकवचन सामूहिक संज्ञा को हिन्दी में ‘हर काम’ स्वाभाविक रूप से व्यक्त करता है और समस्त उपक्रमों का भाव बनाए रखता है।
