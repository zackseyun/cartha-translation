source:
  edition: WLC
  text: וַ/יִּכָּנַ֤ע יְחִזְקִיָּ֨הוּ֙ בְּ/גֹ֣בַהּ לִבּ֔/וֹ ה֖וּא וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/לֹא בָ֤א עֲלֵי/הֶם֙ קֶ֣צֶף יְהוָ֔ה בִּ/ימֵ֖י יְחִזְקִיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/026.yaml
  text: But Hezekiah humbled himself for the pride of his heart[a], he and the inhabitants of Jerusalem, so the wrath of Yahweh did not come upon them in the days of Hezekiah.
translation:
  language: hi
  text: तब हिजकिय्याह ने अपने मन के घमंड के कारण[a] स्वयं को नम्र किया, और यरूशलेम के निवासियों ने भी ऐसा ही किया। इसलिए हिजकिय्याह के दिनों में यहोवा का प्रकोप उन पर नहीं आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके मन की ऊँचाई में/के कारण”; यह इब्रानी मुहावरा मन के भीतर के घमंड या अभिमान को दर्शाता है।
    reason: בְּגֹבַהּ לִבּוֹ की ‘ऊँचाई’ वाली शाब्दिक छवि तथा בְּ के ‘में/के कारण’ संबंधी अर्थगत विस्तार को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: अपने आपको दीन किया
  rationale: 'निफ़अल रूप यहाँ संदर्भानुसार आत्मवाचक/मध्य अर्थ देता है: हिजकिय्याह ने पश्चात्ताप में स्वयं को नम्र किया, न कि केवल उसे निष्क्रिय रूप से दीन किया गया।'
- source_word: בְּגֹבַהּ לִבּוֹ
  choice: अपने मन के घमंड के कारण
  rationale: גֹבַהּ का मूल अर्थ ‘ऊँचाई’ है; ‘मन/हृदय की ऊँचाई’ का मुहावरा आंतरिक घमंड या अभिमान दर्शाता है। בְּ के कारणवाचक अर्थ को स्वाभाविक हिन्दी में ‘के कारण’ कहा गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: הוּא וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: उसने और यरूशलेम के निवासियों ने भी
  rationale: बलाघाती सर्वनाम הוּא हिजकिय्याह को यरूशलेम के निवासियों के साथ स्पष्ट रूप से सम्मिलित करता है। दोहराया गया ‘ने’ हिन्दी में यह साफ करता है कि दोनों ने अपने आपको दीन किया।
- source_word: קֶצֶף יְהוָה
  choice: यहोवा का प्रकोप
  rationale: קֶצֶף न्याय-संदर्भ में तीव्र दैवी रोष को व्यक्त करता है; ‘प्रकोप’ उसकी गंभीरता बनाए रखता है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְלֹא בָא עֲלֵיהֶם
  choice: उन पर नहीं आया
  rationale: בוא על का न्याय-संबंधी मुहावरा हिन्दी में सीधे और स्वाभाविक रूप से ‘उन पर आना’ है।
- source_word: בִּימֵי יְחִזְקִיָּהוּ
  choice: हिजकिय्याह के दिनों में
  rationale: यह मूल कालवाचक वाक्यांश को बिना यह सीमित किए सुरक्षित रखता है कि आशय केवल शासनकाल है या पूरा जीवनकाल।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल-पाठकों के लिए सुपरिचित ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ में बदले बिना सुरक्षित रखता है; ‘याहवे’ एक सम्भव विद्वत्तापरक लिप्यंतरण है।
- issue: प्रकोप का टलना
  choice: हिजकिय्याह के दिनों में उन पर नहीं आया
  alternative: उनसे पूर्णतः सदा के लिए हटा दिया गया
  rationale: मूल कथन केवल समयगत विलंब बताता है। अनुवाद यह निष्कर्ष नहीं जोड़ता कि न्याय स्थायी रूप से निरस्त हो गया था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘मन का घमंड’, ‘अपने आपको दीन किया’ और ‘प्रकोप’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल की नैतिक और न्याय-संबंधी गंभीरता बनाए रखते हैं।
