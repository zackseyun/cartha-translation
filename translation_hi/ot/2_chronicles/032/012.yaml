  text: הֲ/לֹא הוּא֙ יְחִזְקִיָּ֔הוּ הֵסִ֥יר אֶת בָּמֹתָ֖י/ו וְ/אֶת מִזְבְּחֹתָ֑י/ו וַ/יֹּ֨אמֶר לִֽ/יהוּדָ֤ה וְ/לִֽ/ירוּשָׁלִַ֨ם֙ לֵ/אמֹ֔ר לִ/פְנֵ֨י מִזְבֵּ֧חַ אֶחָ֛ד תִּֽשְׁתַּחֲו֖וּ וְ/עָלָ֥י/ו תַּקְטִֽירוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/012.yaml
  text: Was it not Hezekiah himself who removed his high places and his altars[a], and said to Judah and Jerusalem, saying, ‘Before one altar you shall bow down, and on it you shall burn incense’?”
translation:
  language: hi
  text: क्या यह वही हिजकिय्याह नहीं है जिसने उसके ऊँचे स्थानों और उसकी वेदियों को हटा दिया[a] और यहूदा और यरूशलेम से कहा, ‘तुम एक ही वेदी के सामने दण्डवत् करो और उसी पर धूप जलाओ’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम एक ही वेदी के सामने आराधना करो और उसी पर भेंटों को धुएँ में चढ़ाओ।”
    reason: תִּשְׁתַּחֲווּ का अर्थ ‘आराधना करना’ और תַּקְטִירוּ का अर्थ भेंट को जलाकर धुआँ उठाना भी हो सकता है।
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में यह रचना उस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הוּא יְחִזְקִיָּהוּ
  choice: वही हिजकिय्याह
  rationale: सर्वनाम और नाम के संयुक्त प्रयोग का बल बनाए रखने के लिए ‘वही’ रखा गया है।
- source_word: הֵסִיר
  choice: हटा दिया
  rationale: सूर के हिफ़ील रूप का सीधा और प्रसंगानुकूल अर्थ, अर्थात उपासना-स्थलों को दूर करना।
- source_word: בָּמֹתָיו
  choice: उसके ऊँचे स्थानों
  rationale: ‘ऊँचे स्थान’ धार्मिक उपासना-स्थलों के लिए प्रचलित बाइबलीय पद है; ‘उसके’ हिब्रू प्रत्यय और अश्शूरी वक्ता की विवादात्मक दृष्टि को सुरक्षित रखता है।
- source_word: מִזְבְּחֹתָיו
  choice: उसकी वेदियों
  rationale: हिब्रू का संबंधसूचक प्रत्यय स्पष्ट रूप से रखा गया है; यह वर्णनकर्ता की स्वीकृति नहीं, वक्ता की प्रस्तुति है।
- source_word: וַיֹּאמֶר לִיהוּדָה וְלִירוּשָׁלִַם לֵאמֹר
  choice: और यहूदा और यरूशलेम से कहा
  rationale: हिन्दी में अनावश्यक दोहराव से बचते हुए भाषण-परिचय का पूरा अर्थ स्वाभाविक ढंग से व्यक्त होता है।
- source_word: לִפְנֵי מִזְבֵּחַ אֶחָד
  choice: एक ही वेदी के सामने
  rationale: ‘सामने’ לִפְנֵי का मूल स्थानवाचक अर्थ और ‘एक ही’ केंद्रीकरण पर संख्यात्मक बल बनाए रखता है।
- source_word: תִּשְׁתַּחֲווּ
  choice: दण्डवत् करना
  rationale: यह झुकने या भूमि पर गिरकर उपासना करने की शारीरिक क्रिया को ‘आराधना करना’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
- source_word: וְעָלָיו תַּקְטִירוּ
  choice: और उसी पर धूप जलाना
  rationale: קטר का हिफ़ील धार्मिक प्रसंग में धूप जलाने अथवा भेंट को धुएँ में चढ़ाने का अर्थ दे सकता है; मुख्य पाठ में स्वाभाविक और सामान्य अर्थ चुना गया है तथा विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘ऊँचे स्थानों’ और ‘वेदियों’ पर संबंधसूचक प्रत्यय
  choice: मुख्य पाठ में ‘उसके ऊँचे स्थानों और उसकी वेदियों’ रखा गया
  alternative: ‘ऊँचे स्थानों और वेदियों’
  rationale: हिब्रू प्रत्ययों को हटाने से अश्शूरी वक्ता की विवादात्मक प्रस्तुति मिट जाती। यह कथन उन स्थलों को वास्तव में परमेश्वर-स्वीकृत घोषित नहीं करता।
- issue: एक वेदी पर केंद्रीकृत उपासना
  choice: बिना व्याख्यात्मक बचाव के ‘एक ही वेदी’ कहा गया
  alternative: ‘मन्दिर की एकमात्र वेदी’ कहकर स्पष्ट करना
  rationale: पद में आरोप प्रस्तुत किया गया है, सुधार का धार्मिक स्पष्टीकरण नहीं। इसलिए व्यापक प्रसंग से समाधान आयात किए बिना तनाव सुरक्षित रखा गया है।
- issue: קטר की धार्मिक क्रिया
  choice: मुख्य पाठ में ‘धूप जलाना’
  alternative: ‘भेंटों को धुएँ में चढ़ाना’
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं। हिन्दी में सबसे सहज मुख्य अर्थ चुना गया है, पर व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘वही’, ‘एक ही’ और संबंधसूचक रूप मूल पाठ के बल और वक्ता की दृष्टि को बनाए रखते हैं; ‘दण्डवत्’ परिचित बाइबलीय-धार्मिक शब्दावली है।
