source:
  edition: WLC
  text: וְ/עַתָּ֡ה אַל יַשִּׁיא֩ אֶתְ/כֶ֨ם חִזְקִיָּ֜הוּ וְ/אַל יַסִּ֨ית אֶתְ/כֶ֣ם כָּ/זֹאת֮ וְ/אַל תַּאֲמִ֣ינוּ ל/וֹ֒ כִּי לֹ֣א יוּכַ֗ל כָּל אֱל֨וֹהַ֙ כָּל גּ֣וֹי וּ/מַמְלָכָ֔ה לְ/הַצִּ֥יל עַמּ֛/וֹ מִ/יָּדִ֖/י וּ/מִ/יַּ֣ד אֲבוֹתָ֑/י אַ֚ף כִּ֣י אֱֽלֹהֵי/כֶ֔ם לֹא יַצִּ֥ילוּ אֶתְ/כֶ֖ם מִ/יָּדִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/015.yaml
  text: So now[a], do not let Hezekiah deceive you, and do not let him persuade you like this, and do not believe him; for no god of any nation or kingdom has been able to deliver his people from my hand and from the hand of my fathers[c][b]. How much less will your God deliver you from my hand!
translation:
  language: hi
  text: और अब हिजकिय्याह को तुम्हें धोखा न देने दो, न उसे इस प्रकार तुम्हें बहकाने दो, और उसकी बात पर विश्वास मत करो; क्योंकि किसी भी जाति या राज्य का कोई देवता अपने लोगों को मेरे हाथ और मेरे पुरखाओं के हाथ से नहीं छुड़ा सका है। फिर तुम्हारा परमेश्वर तुम्हें मेरे हाथ से कैसे छुड़ा सकेगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “फिर ... कैसे” हिब्रू के उस मुहावरे को व्यक्त करता है जो तीव्र नकारात्मक निष्कर्ष देता है; वक्ता का दावा है कि तुम्हारा परमेश्वर तुम्हें नहीं छुड़ा सकेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: वक्ता के पिछले तर्क से जुड़ा तत्काल निष्कर्ष और चेतावनी व्यक्त करता है।
- source_word: יַשִּׁיא
  choice: धोखा देना
  rationale: किसी को भटका देने या छलने का सीधा और स्वाभाविक हिन्दी अर्थ।
- source_word: יַסִּית
  choice: बहकाना
  rationale: यहाँ हिजकिय्याह द्वारा लोगों को अपनी बात की ओर उकसाने या फुसलाने का आरोप है; ‘बहकाना’ पहले क्रियापद ‘धोखा देना’ से अर्थगत अंतर भी बनाए रखता है।
- source_word: תַּאֲמִינוּ לוֹ
  choice: उसकी बात पर विश्वास करना
  rationale: संदर्भ में हिजकिय्याह के दावे को सच मानने की बात है; यह हिन्दी में केवल ‘उस पर विश्वास’ से अधिक स्पष्ट है।
- source_word: כָּל אֱלוֹהַ כָּל גּוֹי וּמַמְלָכָה
  choice: किसी भी जाति या राज्य का कोई देवता
  rationale: हिब्रू के सार्वभौमिक नकार को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְהַצִּיל
  choice: छुड़ाना
  rationale: शत्रु की सत्ता से बचाने का सैनिक-संदर्भ वाला अर्थ सहज हिन्दी में व्यक्त करता है।
- source_word: מִיָּדִי וּמִיַּד אֲבוֹתָי
  choice: मेरे हाथ और मेरे पुरखाओं के हाथ से
  rationale: ‘हाथ’ की हिब्रू उपमा को बनाए रखता है, जहाँ इसका अर्थ शक्ति या अधिकार है; ‘पुरखा’ राजकीय पूर्वजों को समेटता है।
- source_word: אַף כִּי
  choice: फिर ... कैसे ... सकेगा
  rationale: पहले कथन से निकले तीव्र नकारात्मक निष्कर्ष को स्वाभाविक हिन्दी के आलंकारिक प्रश्न में व्यक्त करता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूप बहुवचन-सदृश होने पर भी प्रसंग में यह यहूदा के एक परमेश्वर को सूचित करता है।
theological_decisions:
- issue: אֱלֹהֵיכֶם का वचन और संकेत
  choice: एकवचन ‘तुम्हारा परमेश्वर’
  alternative: ‘तुम्हारे देवता’
  rationale: प्रसंग में अश्शूरी वक्ता यहूदा के परमेश्वर को लक्ष्य कर रहा है; व्याकरणिक रूप के कारण बहुवचन करना कथानक के आशय को बिगाड़ेगा।
- issue: अश्शूरी वक्ता के दावे का प्रस्तुतीकरण
  choice: दावे को वक्ता की धृष्ट चुनौती के रूप में यथावत रखना
  alternative: परमेश्वर की वास्तविक सामर्थ्य स्पष्ट करने के लिए व्याख्यात्मक शब्द जोड़ना
  rationale: पद शत्रु के भाषण को उद्धृत करता है; अनुवाद को उसकी गलत धार्मिक धारणा सुधारने के लिए मूल में शब्द नहीं जोड़ने चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिन्दी। ‘हाथ’ की मूल उपमा सुरक्षित रखी गई है। ‘देवता’ अन्य राष्ट्रों के देवों के लिए और ‘परमेश्वर’ यहूदा के परमेश्वर के लिए प्रयुक्त है, जिससे संदर्भ का भेद स्वाभाविक हिन्दी में स्पष्ट रहता है।
