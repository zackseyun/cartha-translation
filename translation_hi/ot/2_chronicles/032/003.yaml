base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/003.yaml
  text: And he consulted with his officials and his mighty men about stopping up the waters of the springs that were outside the city[a], and they helped him.
translation:
  language: hi
  text: उसने अपने अधिकारियों और वीर योद्धाओं के साथ नगर के बाहर के सोतों के जल को बंद कर देने के बारे में विचार-विमर्श किया, और उन्होंने उसकी सहायता की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: उसने ... सलाह की
  rationale: निफ़ाल रूप यहाँ दूसरों के साथ विचार-विमर्श या परामर्श करने का भाव देता है। ‘सलाह की’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक विचार-विमर्श का अर्थ बनाए रखता है।
- source_word: שָׂרָיו
  choice: अपने अधिकारियों
  rationale: שַׂר का अर्थ प्रसंगानुसार शासक, अधिकारी, सेनापति या प्रधान हो सकता है। यहाँ प्रशासनिक-सैन्य संदर्भ में ‘अधिकारियों’ व्यापक अर्थ को व्यक्त करता है और अनावश्यक रूप से राजवंशीय पद का संकेत नहीं देता।
- source_word: גִבֹּרָיו
  choice: वीर योद्धाओं
  rationale: גִּבּוֹר में सामर्थ्य और युद्ध-कौशल दोनों का भाव हो सकता है। ‘वीर योद्धाओं’ से इस प्रसंग की सैनिक छाया स्पष्ट और सहज रहती है।
- source_word: לִסְתּוֹם
  choice: रोक देने के विषय में
  rationale: क्रियार्थक रूप परामर्श की विषयवस्तु अथवा उद्देश्य बताता है। पानी के स्रोतों को शत्रु के उपयोग से रोकने के संदर्भ में ‘रोक देने’ स्वाभाविक है और भौतिक अवरोध का आशय व्यक्त करता है।
- source_word: מֵימֵי הָעֲיָנוֹת
  choice: सोतों का पानी
  rationale: यह रचना शाब्दिक रूप से ‘सोतों का जल’ है। ‘सोतों का पानी’ साधारण आधुनिक हिन्दी में स्पष्ट है और प्राकृतिक जलस्रोतों को दर्शाता है।
- source_word: אֲשֶׁר מִחוּץ לָעִיר
  choice: नगर के बाहर के
  rationale: सम्बन्धवाचक उपवाक्य सोतों को नगर-सीमा के बाहर स्थित बताता है। हिन्दी में विशेषणात्मक रचना संक्षिप्त और स्वाभाविक है।
- source_word: וַיַּעְזְרֻהוּ
  choice: और उन्होंने उसकी सहायता की
  rationale: क्रिया का सीधा अर्थ है कि पहले उल्लिखित अधिकारियों और वीर योद्धाओं ने उसकी सहायता की।
