translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘नगर’ ऐतिहासिक वर्णन के अनुकूल है; ‘सोतों’ प्राकृतिक जलस्रोतों के लिए स्पष्ट है। मूल में לִסְתּוֹם परामर्श की विषयवस्तु और उद्देश्य दोनों की छाया रख सकता है; मुख्य पाठ का ‘के विषय में’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
