source:
  edition: WLC
  text: הֲ/לֹ֤א יְחִזְקִיָּ֨הוּ֙ מַסִּ֣ית אֶתְ/כֶ֔ם לָ/תֵ֣ת אֶתְ/כֶ֔ם לָ/מ֛וּת בְּ/רָעָ֥ב וּ/בְ/צָמָ֖א לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵ֔י/נוּ יַצִּילֵ֕/נוּ מִ/כַּ֖ף מֶ֥לֶךְ אַשּֽׁוּר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/011.yaml
  text: Is not Hezekiah misleading you[a], to give you over to die by famine and by thirst, saying, ‘Yahweh our God will deliver us from the hand of the king of Assyria’?”
translation:
  language: hi
  text: क्या हिजकिय्याह तुम्हें बहका नहीं रहा[a], ताकि वह तुम्हें भूख और प्यास से मरने के लिए छोड़ दे, यह कहकर कि, ‘हमारा परमेश्वर यहोवा हमें अश्शूर के राजा के हाथ से छुड़ा लेगा’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें धोखा दे रहा” अथवा “तुम्हें फुसला रहा।” इब्रानी क्रिया में किसी को भटका देने या गलत बात मानने के लिए उकसाने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाला आरोपात्मक आलंकारिक प्रश्न है; हिन्दी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को बनाए रखता है।
- source_word: מַסִּית
  choice: बहका रहा
  rationale: हिफ़ील रूप किसी को गलत दिशा में ले जाने या अनुचित रूप से फुसलाने का भाव देता है। ‘बहका रहा’ इस आरोप को स्वाभाविक हिन्दी में व्यक्त करता है और ‘धोखा दे रहा’ जैसे अधिक निश्चित आशय को मुख्य पाठ में आरोपित नहीं करता।
- source_word: לָתֵת אֶתְכֶם לָמוּת
  choice: तुम्हें ... मरने के लिए छोड़ दे
  rationale: शाब्दिक ‘तुम्हें मरने के लिए दे दे’ हिन्दी में अस्वाभाविक है। प्रसंग में यह लोगों को मृत्यु के भाग्य के हवाले करने का भाव है, जिसे ‘मरने के लिए छोड़ दे’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּרָעָב וּבְצָמָא
  choice: भूख और प्यास से
  rationale: घेराबंदी के संदर्भ में רָעָב भोजन के अभाव को सूचित करता है; हिन्दी का प्रचलित युग्म ‘भूख और प्यास से’ मृत्यु के साधन को सहज रूप में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त चार अक्षरों वाला व्यक्तिगत परमेश्वर-नाम हिन्दी की स्थापित लिप्यंतरण परंपरा के अनुसार ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: יַצִּילֵנוּ
  choice: हमें ... छुड़ा लेगा
  rationale: נצל का हिफ़ील रूप बचाने या किसी के अधिकार से निकालने का अर्थ देता है। ‘छुड़ा लेगा’ सैन्य संकट और ‘हाथ से’ मुहावरे दोनों के अनुकूल है।
- source_word: מִכַּף מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के हाथ से
  rationale: ‘हाथ से’ शक्ति या नियंत्रण का इब्रानी मुहावरा है और हिन्दी में भी स्वाभाविक तथा बोधगम्य है।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: पद व्यक्तिगत वाचा-नाम का प्रत्यक्ष प्रयोग करता है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: रबशाके के आरोप और हिजकिय्याह के उद्धृत विश्वास के बीच तनाव
  choice: आरोप को प्रश्न और हिजकिय्याह के कथन को सीधे उद्धरण के रूप में रखा
  alternative: आरोप को तथ्यात्मक कथन या उद्धृत वचन को व्याख्यात्मक आश्वासन बनाना
  rationale: मूल वक्ता हिजकिय्याह के विश्वास को भ्रामक बताकर उपहास करता है। अनुवाद यह तय नहीं करता कि वक्ता का आरोप सत्य है, बल्कि मूल का वाग्मितापूर्ण तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है। ‘क्या ... नहीं’ आरोपात्मक आलंकारिक प्रश्न को, और ‘भूख और प्यास से मरने’ का प्रयोग घेराबंदी की कठोरता को स्वाभाविक हिन्दी में बनाए रखता है।
