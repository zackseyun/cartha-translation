base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/005.yaml
  text: And he strengthened himself[a], and built up all the wall that was broken down, and raised it up to the towers, and outside he built another wall, and he strengthened the Millo of the city of David[b], and made weapons and shields in abundance.
translation:
  language: hi
  text: उसने साहस बाँधा और शहरपनाह के सभी टूटे हुए हिस्सों को फिर बनाया, और उसे बुर्जों तक ऊँचा किया। उसके बाहर उसने एक और शहरपनाह बनाई। उसने दाऊद के नगर के मिल्लो[a] को भी मज़बूत किया और बहुत-से हथियार[b] और ढालें बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिल्लो” शायद यरूशलेम की कोई भरावदार किलेबंदी, चबूतरा या सहारा देने वाली संरचना थी; इसका ठीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “फेंककर चलाए जाने वाले अस्त्र,” “बर्छियाँ” अथवा “भाले।” इब्रानी शब्द किसी एक खास प्रकार के हथियार तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזַּק
  choice: उसने साहस बाँधा
  rationale: हित्पाएल रूप यहाँ हिजकिय्याह के दृढ़ होकर रक्षात्मक कार्य में लगने को व्यक्त करता है। हिंदी में ‘साहस बाँधा’ प्रतिवर्ती भाव और प्रसंगगत दृढ़ता को स्वाभाविक रूप से संप्रेषित करता है।
- source_word: וַיִּבֶן ... כָּל הַחוֹמָה הַפְּרוּצָה
  choice: शहरपनाह के टूटे हुए सभी हिस्सों को फिर बनवाया
  rationale: פְּרוּצָה दीवार में टूटे या खुले हुए भागों का बोध कराता है। बहुवचन ‘हिस्सों’ से हिंदी में यह आशय स्पष्ट होता है कि पूरी दीवार नष्ट नहीं थी, बल्कि उसकी दरारों/खंडों की मरम्मत हुई। राजकीय संदर्भ में प्रेरणार्थक ‘बनवाया’ स्वाभाविक है।
- source_word: וַיַּעַל עַל הַמִּגְדָּלוֹת
  choice: उसे बुर्जों तक ऊँचा किया
  rationale: इब्रानी वाक्यांश संक्षिप्त और व्याख्यात्मक रूप से कठिन है। पूर्ववर्ती शहरपनाह को अंतर्निहित कर्म मानकर यह अनुवाद अंग्रेज़ी परामर्श-पाठ की सावधान व्याख्या का अनुसरण करता है और ‘उस पर बुर्ज खड़े किए’ जैसे वैकल्पिक पाठ को मुख्य पाठ में निर्णायक नहीं बनाता।
- source_word: וְלַחוּצָה הַחוֹמָה אַחֶרֶת
  choice: उसके बाहर उसने एक और शहरपनाह बनवाई
  rationale: לַחוּצָה बाहरी ओर को सूचित करता है; प्रसंग से निर्माण-क्रिया की पूर्ति की गई है।
- source_word: הַמִּלּוֹא
  choice: मिल्लो
  rationale: यह यरूशलेम से जुड़ी किसी भरावदार संरचना, चबूतरे या किलेबंदी का अनिश्चित तकनीकी नाम है। लिप्यंतरण ऐतिहासिक शब्द को सुरक्षित रखता और झूठी निश्चितता से बचता है।
- source_word: עִיר דָּוִיד
  choice: दाऊदपुर
  rationale: यह यरूशलेम के विशिष्ट प्राचीन दुर्गीय क्षेत्र का नाम है; संक्षिप्त हिंदी स्थाननाम इसे स्वाभाविक और पहचाने योग्य रखता है।
- source_word: שֶׁלַח
  choice: हथियार
  rationale: शब्द किसी एक निश्चित शस्त्र तक सीमित नहीं है और प्रक्षेपास्त्र, बरछी या अन्य आयुध का बोध करा सकता है; ‘हथियार’ उसकी व्यापकता बनाए रखता है।
- source_word: לָרֹב וּמָגִנִּים
  choice: बहुत-से हथियार और ढालें
  rationale: לָרֹב प्रचुर संख्या व्यक्त करता है और מָגִנִּים का सामान्य आधुनिक हिंदी समतुल्य ‘ढालें’ है।
