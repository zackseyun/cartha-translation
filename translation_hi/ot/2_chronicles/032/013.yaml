base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/013.yaml
  text: Do you not know what I and my fathers have done to all the peoples of the lands? Were the gods of the nations of the lands at all able to deliver their land from my hand?[a]
translation:
  language: hi
  text: क्या तुम नहीं जानते कि मैंने और मेरे पूर्वजों[a] ने सब देशों के लोगों के साथ क्या किया है? क्या उन देशों की जातियों के देवता अपने देश को मेरे हाथ से छुड़ाने में ज़रा भी सक्षम थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे पिताओं”; यहाँ राजवंशीय पूर्ववर्तियों या पुरखों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא תֵדְעוּ
  choice: क्या तुम नहीं जानते
  rationale: नकारात्मक आलंकारिक प्रश्न सहमति की अपेक्षा करता है; यह आधुनिक हिन्दी में स्वाभाविक है और बहुवचन संबोधन को बनाए रखता है।
- source_word: מֶה עָשִׂיתִי
  choice: मैंने ... क्या किया है
  rationale: पूर्ण हो चुके कार्यों की वर्तमान प्रसंग में प्रासंगिकता को हिन्दी का पूर्ण पक्ष स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנִי וַאֲבוֹתַי
  choice: मैंने और मेरे पूर्वजों ने
  rationale: אָבוֹתַי का शाब्दिक अर्थ ‘मेरे पिताओं’ है, पर यहाँ राजवंशीय पूर्ववर्तियों का बोध है; ‘पूर्वजों’ सामान्य आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि पादटिप्पणी स्रोत की पारिवारिक भाषा बताती है।
- source_word: לְכֹל עַמֵּי הָאֲרָצוֹת
  choice: सब देशों के लोगों के साथ
  rationale: बहुवचन ‘देशों’ को सुरक्षित रखा गया है; हिन्दी में ‘क्या किया’ के साथ ‘के साथ’ प्रसंगगत शत्रुतापूर्ण कार्रवाई को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֲיָכוֹל יָכְלוּ
  choice: क्या ... छुड़ा सके थे
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया के जोर को सामर्थ्य पर केंद्रित आलंकारिक प्रश्न से व्यक्त किया गया है; ‘सके थे’ पिछली ऐतिहासिक असफलताओं के संदर्भ में स्वाभाविक है।
- source_word: אֱלֹהֵי גּוֹיֵ הָאֲרָצוֹת
  choice: उन देशों की जातियों के देवता
  rationale: सम्बन्धवाचक शृंखला को स्पष्ट और पठनीय हिन्दी में रखा गया है; ‘देवता’ वक्ता के दावे को बिना व्याख्यात्मक योग्यता जोड़े दर्शाता है।
- source_word: לְהַצִּיל אֶת אַרְצָם
  choice: अपने देश को ... छुड़ा
  rationale: सैन्य संकट में נצל का अर्थ बचाना या छुड़ाना है; प्रतिवाचक ‘अपने’ प्रत्येक जाति और उसके देश के सम्बन्ध को हिन्दी में स्पष्ट करता है।
- source_word: מִיָדִי
  choice: मेरे हाथ से
  rationale: शक्ति और नियंत्रण के लिए प्रयुक्त मूल रूपक को सुरक्षित रखा गया है और यह हिन्दी में भी बोधगम्य है।
theological_decisions:
- issue: एक मूर्तिपूजक राजा की डींग में ‘देवताओं’ का उल्लेख
  choice: אֱלֹהֵי का सीधा अनुवाद ‘देवता’
  alternative: ‘कथित देवता’ या ‘झूठे देवता’
  rationale: वक्ता अन्य जातियों के देवताओं की तुलना यहूदा के परमेश्वर से कर रहा है। अनुवाद को उसकी वाणी प्रस्तुत करनी चाहिए, उसमें धर्मवैज्ञानिक टिप्पणी नहीं मिलानी चाहिए।
