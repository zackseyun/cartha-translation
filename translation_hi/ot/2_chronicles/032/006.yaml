base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/006.yaml
  text: And he appointed military commanders over the people[a], gathered them to himself in the square at the city gate, and spoke to their hearts, saying,
translation:
  language: hi
  text: 'उसने लोगों के ऊपर सैन्य अधिकारियों को नियुक्त किया, उन्हें अपने पास नगर-फाटक के चौक में इकट्ठा किया, और उनका हौसला बढ़ाते हुए कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: नियुक्त किए
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना/रखना’ है, पर अधिकारियों को लोगों के ऊपर रखने के इस प्रयोग में पद पर नियुक्त करना अभिप्रेत है।
- source_word: שָׂרֵי מִלְחָמוֹת
  choice: सेनापति
  rationale: शाब्दिक रूप से ‘युद्धों के अधिकारी’ वाला पदबंध यहाँ सैन्य नेतृत्व करने वाले अधिकारियों को दर्शाता है; ‘सेनापति’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: עַל הָעָם
  choice: लोगों पर
  rationale: नियुक्ति के साथ עַל अधिकार और देखरेख का संबंध बताता है; ‘लोगों पर’ मूल संरचना को बनाए रखता है।
- source_word: וַיִּקְבְּצֵם אֵלָיו
  choice: उन्हें ... अपने पास इकट्ठा किया
  rationale: यह קבץ के ‘इकट्ठा करना’ और אֵלָיו के ‘अपने पास’—दोनों तत्वों को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֶל רְחוֹב שַׁעַר הָעִיר
  choice: नगर के फाटक के चौक में
  rationale: רְחוֹב फाटक से जुड़ा खुला सार्वजनिक स्थान या चौक है; हिन्दी में यह रूप स्वाभाविक ढंग से नागरिक सभा-स्थल दर्शाता है।
- source_word: וַיְדַבֵּר עַל לְבָבָם
  choice: उनके हृदय को ढाढ़स बँधाया
  rationale: शाब्दिक बिंब ‘उनके हृदय से/पर बोलना’ है और प्रसंग में इसका आशय भीतर से उत्साहित तथा दृढ़ करना है; ‘ढाढ़स बँधाया’ उस मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका बाँधता है और वाक्य को खुला रखता है।
