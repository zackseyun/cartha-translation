base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/033.yaml
  text: And Hezekiah slept with his fathers[a], and they buried him in the upper part of the tombs of the sons of David. And all Judah and the inhabitants of Jerusalem honored him at his death, and Manasseh his son reigned in his place.
translation:
  language: hi
  text: और हिजकिय्याह अपने पुरखाओं के साथ सो गया, और उन्होंने उसे दाऊद के पुत्रों[a] की कब्रों के ऊपरी भाग में दफनाया। उसके मरने पर समूचे यहूदा और यरूशलेम के निवासियों ने उसका सम्मान किया। और उसका पुत्र मनश्शे उसके स्थान पर राज्य करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दाऊद के वंशजों की कब्रें’; यहाँ ‘दाऊद के पुत्र’ दाऊदी राजवंश के लोगों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया
  rationale: यह मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी राजकीय मुहावरा है। ‘सो गया’ मूल बिंब को बनाए रखता है, जबकि ‘पुरखाओं’ आधुनिक हिन्दी में वंशगत पूर्वजों का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे ... दफनाया
  rationale: मूल क्रिया सक्रिय बहुवचन में है; अनिर्दिष्ट कर्ता को ‘उन्होंने’ से सुरक्षित रखा गया है।
- source_word: בְּמַעֲלֵה
  choice: के ऊपरी भाग में
  rationale: शब्द चढ़ाई अथवा ऊँचे स्थान का संकेत दे सकता है। दफनाने के प्रसंग में यह चयन स्थलाकृतिक अर्थ देता है, पर किसी अनिश्चित स्थापत्य-विवरण को तय नहीं करता।
- source_word: קִבְרֵי בְנֵי דָוִיד
  choice: दाऊद के पुत्रों की कब्रों
  rationale: मूल अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है; प्रसंग में ‘पुत्रों’ का आशय दाऊद के वंश की राजकीय परंपरा से है।
- source_word: וְכָבוֹד עָשׂוּ לוֹ
  choice: उसका सम्मान किया
  rationale: इब्रानी मुहावरे ‘उसके लिए सम्मान किया’ का यह स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: בְּמוֹתוֹ
  choice: उसके मरने पर
  rationale: यह मृत्यु के समय का सीधा और स्वाभाविक हिन्दी संकेत है।
- source_word: כָּל יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: समूचे यहूदा और यरूशलेम के निवासियों
  rationale: यह सार्वजनिक सम्मान के व्यापक दायरे को स्पष्ट रखते हुए मूल संरचना का अनुसरण करता है।
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: उसके स्थान पर राजा हुआ
  rationale: यह राजकीय उत्तराधिकार के सूत्र का स्वाभाविक हिन्दी रूप है और मनश्शे के शासन ग्रहण करने को स्पष्ट करता है।
theological_decisions:
- issue: मृत्यु के लिए राजकीय मुहावरा
  choice: ‘अपने पुरखाओं के साथ सो गया’ को बनाए रखा गया।
  alternative: ‘मर गया’
  rationale: मूल का पारंपरिक मृत्यु-मुहावरा राजकीय वृत्तांतों की साहित्यिक निरंतरता रखता है; उसे सीधे ‘मर गया’ कर देना इस बिंब को मिटा देता।
- issue: ‘दाऊद के पुत्रों’ का दायरा
  choice: मुख्य पाठ में शाब्दिक वंशगत अभिव्यक्ति ‘दाऊद के पुत्रों’ रखी गई।
  alternative: ‘दाऊद के वंशजों’
  rationale: इब्रानी पाठ ‘पुत्रों’ कहता है और प्रसंग दाऊदी राजवंश की ओर संकेत करता है। हिन्दी में यह अभिव्यक्ति समझने योग्य है, इसलिए व्याख्यात्मक विकल्प को मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मृत्यु के प्राचीन मुहावरे को मूल साहित्यिक स्वर के कारण सुरक्षित रखा गया है। ‘दफनाया’ वर्तमान हिन्दी में ‘गाड़ा’ की तुलना में अधिक स्वाभाविक और सम्मानपूर्ण है।
