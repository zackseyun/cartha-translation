  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ מַלְאָ֔ךְ וַ/יַּכְחֵ֞ד כָּל גִּבּ֥וֹר חַ֨יִל֙ וְ/נָגִ֣יד וְ/שָׂ֔ר בְּ/מַחֲנֵ֖ה מֶ֣לֶךְ אַשּׁ֑וּר וַ/יָּשָׁב֩ בְּ/בֹ֨שֶׁת פָּנִ֜ים לְ/אַרְצ֗/וֹ וַ/יָּבֹא֙ בֵּ֣ית אֱלֹהָ֔י/ו ו/מ/יציא/ו מֵעָ֔י/ו שָׁ֖ם הִפִּילֻ֥/הוּ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/021.yaml
  text: And the LORD sent an angel, who wiped out every mighty warrior, commander, and officer in the camp of the king of Assyria. So he returned to his own land with shame on his face. And when he entered the house of his god, some of those who came from his own body struck him down there with the sword.
translation:
  language: hi
  text: तब यहोवा ने एक स्वर्गदूत भेजा, जिसने अश्शूर के राजा की छावनी में हर वीर योद्धा, सेनानायक और अधिकारी का नाश कर दिया। इसलिए अश्शूर का राजा लज्जित होकर अपने देश लौट गया। जब वह अपने देवता के मंदिर में गया, तब उसकी अपनी ही संतान में से कुछ लोगों ने वहीं उसे तलवार से मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: स्वर्गदूत
  rationale: संदर्भ में यहोवा द्वारा भेजा गया अलौकिक दूत अभिप्रेत है; आधुनिक हिन्दी में ‘स्वर्गदूत’ सहज और स्पष्ट है।
- source_word: וַיַּכְחֵד
  choice: नाश कर दिया
  rationale: क्रिया पूर्णतः मिटा देने या समाप्त कर देने का भाव रखती है; सैन्य प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: גִּבּוֹר חַיִל
  choice: वीर योद्धा
  rationale: पद सामर्थ्यवान युद्धवीर को सूचित करता है; ‘वीर योद्धा’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: נָגִיד
  choice: अगुआ
  rationale: यह नेतृत्व या प्रधानता का व्यापक पद है; निकटवर्ती שָׂר से भेद बनाए रखने के लिए ‘अगुआ’ चुना गया।
- source_word: שָׂר
  choice: सेनापति
  rationale: सैन्य छावनी के संदर्भ में अधिकारी या प्रधान का सैन्य अर्थ प्रमुख है।
- source_word: בְּבֹשֶׁת פָּנִים
  choice: लज्जित होकर
  rationale: शाब्दिक ‘चेहरे की लज्जा के साथ’ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִיצִיאֵי מֵעָיו
  choice: उसकी अपनी ही संतान में से कुछ लोग
  rationale: शाब्दिक रूप से ‘उसके अंतःभाग से निकले हुए’ अर्थात उसकी देह से उत्पन्न वंशज; हिन्दी में अर्थ को स्पष्ट रखते हुए देहगत संबंध सुरक्षित किया गया।
- source_word: הִפִּילֻהוּ בֶחָרֶב
  choice: उसे तलवार से मार डाला
  rationale: हिब्रू मुहावरे ‘तलवार से गिराना’ का आशय वध करना है; हिन्दी में यही स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: हिब्रू पाठ में व्यक्तिगत वाचा-नाम है; ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना हिन्दी पाठकों के लिए पहचाने जाने योग्य रूप में रखता है।
- issue: מַלְאָךְ की प्रकृति
  choice: स्वर्गदूत
  alternative: दूत
  rationale: यहोवा द्वारा भेजे जाकर पूरी सेना पर अलौकिक न्याय करने वाला पात्र संदर्भतः स्वर्गीय दूत है; किसी विशिष्ट नाम या अतिरिक्त धर्मशास्त्रीय पहचान को नहीं जोड़ा गया।
- issue: राजा की हत्या करने वालों की पहचान
  choice: उसकी अपनी ही संतान में से कुछ लोग
  alternative: उसके पुत्र
  rationale: मूल पाठ वंशजों का संकेत देता है, पर इसी पद में स्पष्टतः ‘पुत्र’ नहीं कहता; व्यापकता और मूल रूपक का आशय बनाए रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य-संरचना मूल घटनाक्रम के निकट है, पर अस्वाभाविक हिब्रू मुहावरों को अर्थ-सटीक हिन्दी में व्यक्त किया गया है।
