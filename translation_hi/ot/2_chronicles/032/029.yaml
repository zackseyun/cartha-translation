source:
  edition: WLC
  text: וְ/עָרִים֙ עָ֣שָׂה ל֔/וֹ וּ/מִקְנֵה צֹ֥אן וּ/בָקָ֖ר לָ/רֹ֑ב כִּ֤י נָֽתַן ל/וֹ֙ אֱלֹהִ֔ים רְכ֖וּשׁ רַ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/029.yaml
  text: He also made cities for himself[a], and acquired flocks and herds in abundance, for God had given him very great wealth.
translation:
  language: hi
  text: उसने अपने लिए नगर भी बनाए और बहुत बड़ी संख्या में भेड़-बकरियाँ और गाय-बैल रखे, क्योंकि परमेश्वर ने उसे बहुत अधिक संपत्ति दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָרִים עָשָׂה לוֹ
  choice: उसने अपने लिए नगर भी बनाए
  rationale: शाब्दिक संरचना और पूर्ववर्ती प्रसंग से जुड़ने वाले वाव के योगात्मक भाव को सहज हिन्दी में रखा गया है। עָשָׂה का मूल अर्थ ‘बनाना’ है; ‘अपने लिए’ लाभ अथवा स्वामित्व का भाव व्यक्त करता है।
- source_word: וּמִקְנֵה צֹאן וּבָקָר
  choice: और ... भेड़-बकरियाँ और गाय-बैल रखे
  rationale: מִקְנֶה पशुधन अथवा पशु-संपदा को दर्शाता है। צֹאן में मुख्यतः भेड़-बकरियाँ और בָּקָר में गो-पशु आते हैं; ‘रखे’ हिन्दी में पशुधन के स्वामित्व का स्वाभाविक बोध कराता है।
- source_word: לָרֹב
  choice: बहुत बड़ी संख्या में
  rationale: यह पद पशुधन की अत्यधिक संख्या बताता है; इस अनुवाद से परिमाण स्पष्ट और स्वाभाविक रहता है।
- source_word: כִּי נָתַן לוֹ אֱלֹהִים
  choice: क्योंकि परमेश्वर ने उसे ... दी थी
  rationale: כִּי स्पष्ट कारण प्रस्तुत करता है। हिन्दी का पूर्ण भूतकाल यह दिखाता है कि उसकी समृद्धि परमेश्वर के पहले से दिए हुए वरदान का परिणाम थी।
- source_word: רְכוּשׁ רַב מְאֹד
  choice: बहुत अधिक संपत्ति
  rationale: רְכוּשׁ भौतिक संपत्ति या माल-असबाब को सूचित करता है और רַב מְאֹד उसकी असाधारण प्रचुरता पर बल देता है। ‘संपत्ति’ यहाँ ‘धन’ से अधिक व्यापक और स्रोत-पद के निकट है।
theological_decisions:
- issue: हिजकिय्याह की समृद्धि का कर्ता
  choice: उसकी बहुत अधिक संपत्ति को परमेश्वर का दिया हुआ बताया गया है।
  alternative: संपत्ति को केवल हिजकिय्याह के संचय अथवा उपलब्धि का परिणाम बताना।
  rationale: इब्रानी उपवाक्य כִּי נָתַן לוֹ אֱלֹהִים सीधे परमेश्वर की क्रिया बताता है। अनुवाद इसी कथन तक सीमित रहता है और इससे कोई व्यापक समृद्धि-सिद्धांत नहीं निकालता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘भेड़-बकरियाँ और गाय-बैल’ सामान्य पाठक के लिए ‘छोटे पशु और बड़े पशु’ की अपेक्षा अधिक ठोस और स्वाभाविक है।
