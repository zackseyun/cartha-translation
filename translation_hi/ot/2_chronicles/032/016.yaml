source:
  edition: WLC
  text: וְ/עוֹד֙ דִּבְּר֣וּ עֲבָדָ֔י/ו עַל יְהוָ֖ה הָ/אֱלֹהִ֑ים וְ/עַ֖ל יְחִזְקִיָּ֥הוּ עַבְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/016.yaml
  text: And his servants spoke further against Yahweh God and against his servant Hezekiah[a].
translation:
  language: hi
  text: उसके सेवकों ने याहवे परमेश्वर और उसके सेवक हिजकिय्याह के विरुद्ध और भी बातें कहीं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे परमेश्वर और उसके सेवक हिजकिय्याह के विषय में और भी बातें कहीं।” इब्रानी परसर्ग का अर्थ कभी-कभी अधिक तटस्थ रूप से “के विषय में” हो सकता है, पर यहाँ प्रसंग शत्रुतापूर्ण अर्थ “के विरुद्ध” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: और भी
  rationale: यह पद पहले कही गई बातों को आगे बढ़ाते हुए अतिरिक्त और अधिक शत्रुतापूर्ण वचनों का संकेत देता है; आधुनिक हिन्दी में ‘और भी’ स्वाभाविक है।
- source_word: דִּבְּרוּ
  choice: बातें कहीं
  rationale: पिएल रूप का सामान्य अर्थ ‘बोलना’ है। ‘बातें कहीं’ यहाँ עַל के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजकीय संदर्भ में यह अश्शूरी राजा के अधीन कार्य करने वाले लोगों को दर्शाता है। ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है; ‘अधिकारी’ अर्थ को अनावश्यक रूप से संकीर्ण करता।
- source_word: עַל ... וְעַל
  choice: '... और ... के विरुद्ध'
  rationale: דבר के साथ עַל प्रसंगानुसार ‘के विषय में’ या शत्रुतापूर्ण अर्थ में ‘के विरुद्ध’ हो सकता है। आसपास का निन्दात्मक और धमकीपूर्ण प्रसंग ‘के विरुद्ध’ का समर्थन करता है; दोनों कर्मों के लिए साझा परसर्ग हिन्दी में समानांतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: याहवे के साथ यह ईश्वरीय पदवी है। हिन्दी में ‘याहवे परमेश्वर’ स्वाभाविक और गरिमापूर्ण पदबंध है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: עַבְדּוֹ
  choice: उसके सेवक
  rationale: यहाँ हिजकिय्याह का याहवे के प्रति राजकीय और वाचागत अधीन संबंध अभिप्रेत है; ‘दास’ सामाजिक बन्धन का अपेक्षा से अधिक प्रबल संकेत दे सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ सीधे चार-अक्षरीय वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: हिजकिय्याह के लिए עבד का अर्थ
  choice: उसके सेवक
  alternative: उसके दास
  rationale: इस प्रसंग में यह याहवे के प्रति निष्ठावान राजकीय सेवा का पद है; ‘सेवक’ संबंध को बनाए रखता है और दासत्व की अनावश्यक सामाजिक धारणा नहीं जोड़ता।
- issue: עַל का शत्रुतापूर्ण या तटस्थ अर्थ
  choice: के विरुद्ध
  alternative: के विषय में
  rationale: इब्रानी परसर्ग दोनों अर्थों की अनुमति देता है, पर अध्याय का प्रसंग याहवे और हिजकिय्याह के प्रति निन्दात्मक, विरोधी भाषण का है। वैकल्पिक तटस्थ अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल शैली। ‘याहवे परमेश्वर’ मूल के नाम और पदवी दोनों को बनाए रखता है। वाक्य में दो बार ‘के विरुद्ध’ दोहराने के बजाय साझा परसर्ग रखा गया है, जिससे अर्थ और समानांतर संबंध स्पष्ट रहते हुए हिन्दी स्वाभाविक बनती है।
