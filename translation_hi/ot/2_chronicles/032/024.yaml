  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה יְחִזְקִיָּ֖הוּ עַד לָ/מ֑וּת וַ/יִּתְפַּלֵּל֙ אֶל יְהוָ֔ה וַ/יֹּ֣אמֶר ל֔/וֹ וּ/מוֹפֵ֖ת נָ֥תַן לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/024.yaml
  text: In those days Hezekiah became sick to the point of death[a], and he prayed to Yahweh[b], and he answered him and gave him a sign.
translation:
  language: hi
  text: उन दिनों हिजकिय्याह इतना बीमार पड़ा कि मरने पर था। उसने याहवे से प्रार्थना की, और याहवे ने उसे उत्तर दिया[a] और उसे एक चिह्न[b] दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसने उससे कहा।” इब्रानी क्रिया का अर्थ “कहा” है, पर यहाँ वह हिजकिय्याह की प्रार्थना पर याहवे की प्रतिक्रिया व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या “अद्भुत चिह्न” अथवा “चमत्कार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह प्रचलित कालवाचक अभिव्यक्ति इब्रानी मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: חָלָה ... עַד לָמוּת
  choice: इतना बीमार पड़ा कि मरने पर था
  rationale: यह बीमारी के आरम्भ और उसकी प्राणघातक गंभीरता—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: उसने याहवे से प्रार्थना की
  rationale: प्रार्थना के लिए प्रयुक्त सामान्य इब्रानी क्रिया का सीधा अनुवाद है; יְהוָה को व्यक्तिगत दिव्य नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיֹּאמֶר לוֹ
  choice: याहवे ने उसे उत्तर दिया
  rationale: क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर प्रार्थना के बाद इस प्रसंग में उसका भाव उत्तर देने का है। कर्ता को स्पष्ट करने के लिए ‘याहवे’ दोहराया गया है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מוֹפֵת
  choice: चिह्न
  rationale: यहाँ शब्द उस अलौकिक पुष्टि को दर्शाता है जो हिजकिय्याह को दी गई; ‘चिह्न’ अर्थ की व्यापकता बनाए रखता है और ‘अद्भुत काम’ अथवा ‘शकुन’ की अपेक्षा प्रसंगानुकूल है।
- source_word: נָתַן לוֹ
  choice: उसे ... दिया
  rationale: मूल क्रिया और उसके अप्रत्यक्ष कर्म का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: וַיֹּאמֶר לוֹ में परमेश्वर की प्रतिक्रिया
  choice: याहवे ने उसे उत्तर दिया
  alternative: उसने उससे कहा
  rationale: मूल क्रिया ‘कहना’ है, इसलिए शाब्दिक विकल्प पादटिप्पणी में दिया गया है; किंतु प्रार्थना के तत्काल बाद प्रसंगगत संबंध उत्तर का है। इससे प्रतिक्रिया स्पष्ट होती है, जबकि मूल की शब्दगत विशेषता छिपाई नहीं जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों और स्पष्ट कर्ता से सामान्य पाठक के लिए अर्थ सुबोध है; साथ ही पादटिप्पणियाँ इब्रानी शब्दों की वास्तविक अर्थ-सीमा और शाब्दिक विकल्प सुरक्षित रखती हैं।
