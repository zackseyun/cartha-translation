base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/032/004.yaml
  text: So many people gathered together[a], and they stopped up all the springs and the stream that flowed through the land, saying[b], “Why should the kings of Assyria come and find abundant water?”
translation:
  language: hi
  text: बहुत-से लोग इकट्ठे हुए और उन्होंने सभी सोतों और देश के भीतर बहनेवाली जलधारा को बंद कर दिया। यह कहते हुए, “अश्शूर के राजा[a] आकर इतना अधिक पानी क्यों पाएँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “अश्शूर के राजा” बहुवचन है। संभवतः यह अश्शूर की राजसत्ता या उसके राजवंश की ओर संकेत करता है; तत्काल ऐतिहासिक संदर्भ के कारण कुछ अनुवाद इसे एकवचन “अश्शूर का राजा” करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עַם רָב
  choice: बहुत-से लोग इकट्ठे हुए
  rationale: निफ़अल क्रिया लोगों के एकत्र होने को व्यक्त करती है; עַם רָב यहाँ किसी जातीय समुदाय के बजाय बड़ी संख्या में लोगों को दर्शाता है।
- source_word: וַיִּסְתְּמוּ
  choice: बंद कर दिया
  rationale: जलस्रोतों को रोकने या अवरुद्ध करने का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: כָּל הַמַּעְיָנוֹת
  choice: सभी सोतों
  rationale: מַעְיָן प्राकृतिक जलस्रोत या सोते को सूचित करता है; ‘सोता’ संक्षिप्त और सटीक हिन्दी शब्द है।
- source_word: הַנַּחַל הַשּׁוֹטֵף
  choice: बहनेवाली जलधारा
  rationale: נַחַל नाले, नदी-नाले या जलधारा को और participle הַשּׁוֹטֵף उसके सक्रिय रूप से बहने को व्यक्त करता है। ‘जलधारा’ भौगोलिक प्रकार को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: בְּתוֹךְ הָאָרֶץ
  choice: देश के बीच से
  rationale: यह जलधारा के उस भूभाग के भीतर से होकर बहने का स्थानिक भाव बनाए रखता है।
- source_word: לֵאמֹר
  choice: वे कहने लगे
  rationale: उद्धरण आरम्भ कराने वाले इब्रानी पद को सहज हिन्दी कथन में स्पष्ट करता है।
- source_word: יָבֹאוּ מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजा आकर
  rationale: मूल पाठ के बहुवचन ‘राजा’ को बनाए रखा गया है, भले तत्काल ऐतिहासिक संदर्भ में एक शासक प्रमुख हो।
- source_word: וּמָצְאוּ מַיִם רַבִּים
  choice: इतना अधिक पानी पाएँ
  rationale: रַבִּים पानी की प्रचुर मात्रा बताता है; प्रश्नवाचक वाक्य में ‘इतना अधिक पानी’ स्वाभाविक और रणनीतिक चिंता के अनुरूप है।
