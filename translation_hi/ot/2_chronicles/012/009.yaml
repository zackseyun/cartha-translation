language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַל שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַיִם֮ עַל יְרוּשָׁלִַם֒ וַ/יִּקַּ֞ח אֶת אֹצְר֣וֹת בֵּית יְהוָ֗ה וְ/אֶת אֹֽצְרוֹת֙ בֵּ֣ית הַ/מֶּ֔לֶךְ אֶת הַ/כֹּ֖ל לָקָ֑ח וַ/יִּקַּח֙ אֶת מָגִנֵּ֣י הַ/זָּהָ֔ב אֲשֶׁ֥ר עָשָׂ֖ה שְׁלֹמֹֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/009.yaml
  text: So Shishak king of Egypt came up against Jerusalem and took the treasuries of the house of Yahweh and the treasuries of the king’s house[a]. He took everything[b]; he also took the gold shields that Solomon had made.
translation:
  language: hi
  text: तब मिस्र का राजा शीशक यरूशलेम पर चढ़ आया। उसने याहवे के भवन[a] के भंडार और राजा के भवन[b] के भंडार ले लिए। वह सब कुछ ले गया; उसने सोने की वे ढालें भी ले लीं जो सुलैमान ने बनाई थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का मंदिर।”
    reason: lexical_alternative
  - marker: b
    text: या, “राजमहल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל ... עַל יְרוּשָׁלִַם
  choice: यरूशलेम पर चढ़ आया
  rationale: सैनिक प्रसंग में עלה के साथ עַל किसी नगर के विरुद्ध चढ़ाई करने का भाव देता है। यह हिन्दी प्रयोग मूल मुहावरे और आक्रमण के आशय दोनों को बनाए रखता है।
- source_word: שִׁישַׁק
  choice: शीशक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा
  rationale: समास-वाक्यांश पद और राज्य की सीधी पहचान कराता है।
- source_word: אֹצְרוֹת
  choice: भंडार
  rationale: मंदिर और राजभवन में रखी मूल्यवान वस्तुओं के संग्रह अथवा कोष को दर्शाता है; हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: मूल के ‘याहवे के घर/भवन’ रूपक को सुरक्षित रखता है; प्रसंग में यह मंदिर है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम का हिन्दी लिप्यंतरण, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: मूल की शाब्दिक संरचना और ‘याहवे के भवन’ के साथ उसका समानांतर रूप बनाए रखता है; आशय राजमहल है।
- source_word: אֶת־הַכֹּל לָקָח
  choice: वह सब कुछ ले गया
  rationale: यह पुनरुक्त सार-वाक्य लूट की संपूर्णता पर बल देता है; हिन्दी में बल और प्रवाह दोनों सुरक्षित हैं।
- source_word: מָגִנֵּי הַזָּהָב
  choice: सोने की वे ढालें
  rationale: निश्चितता और सामग्री, दोनों को स्पष्ट करते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: जो सुलैमान ने बनाई थीं
  rationale: संबंधवाचक उपवाक्य को सीधे रखता है और ढालों के पहले बनाए जा चुके होने को स्वाभाविक हिन्दी काल-रूप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में चतुरक्षरीय निजी नाम प्रत्यक्ष है। ‘याहवे’ उस नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि में बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ मूल के समानांतर वाक्य-विन्यास को बचाता है, जबकि पादटिप्पणियाँ अधिक व्याख्यात्मक ‘मंदिर’ और ‘राजमहल’ विकल्प देती हैं।
