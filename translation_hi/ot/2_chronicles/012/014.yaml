  edition: WLC
  text: וַ/יַּ֖עַשׂ הָ/רָ֑ע כִּ֣י לֹ֤א הֵכִין֙ לִבּ֔/וֹ לִ/דְר֖וֹשׁ אֶת יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/014.yaml
  text: And he did what was evil[a], because he had not set his heart to seek Yahweh.
translation:
  language: hi
  text: उसने बुराई की, क्योंकि उसने यहोवा को खोजने के लिए अपने मन को तैयार नहीं किया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन को दृढ़ नहीं किया था।”
    reason: הֵכִין का अर्थ ‘तैयार करना’ के साथ-साथ ‘स्थिर या दृढ़ करना’ भी हो सकता है।
lexical_decisions:
- source_word: וַיַּעַשׂ הָרָע
  choice: उसने वह किया जो बुरा था
  rationale: यह अनुवाद इब्रानी की नैतिक मूल्यांकन वाली अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द रहूबियाम के बुरा करने का कारण बताता है।
- source_word: הֵכִין לִבּוֹ
  choice: अपना मन तैयार नहीं किया था
  rationale: הֵכִין में तैयार करने, स्थिर करने या दृढ़ करने का भाव है; לֵב यहाँ केवल भावनाओं का नहीं, बल्कि आंतरिक इच्छा और संकल्प का द्योतक है, जिसके लिए आधुनिक हिन्दी में 'मन' स्वाभाविक है।
- source_word: לִדְרוֹשׁ
  choice: खोज करने के लिए
  rationale: इतिहास-वृत्तांत के इस धार्मिक प्रयोग में इसका अर्थ यहोवा की ओर मुड़कर उसे खोजना, उसकी इच्छा जानना और उसकी सहायता चाहना है; 'खोज करना' मूल की व्यापकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' उसे सामान्य उपाधि से अलग रखता है।
theological_decisions:
- issue: मन तैयार न करने और बुराई करने के बीच संबंध
  choice: '''क्योंकि'' के द्वारा मूल पाठ का सीधा कारण-संबंध बनाए रखा गया है।'
  alternative: '''क्योंकि उसने यहोवा की खोज करने पर अपना मन नहीं लगाया था'''
  rationale: वचन बुराई को केवल अलग-अलग कर्मों तक सीमित नहीं करता, बल्कि यहोवा को खोजने के लिए आंतरिक संकल्प की कमी से जोड़ता है; अनुवाद इस तनाव को बिना अतिरिक्त व्याख्या के रखता है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यहाँ मूल में सामान्य उपाधि नहीं, विशिष्ट ईश्वरीय नाम है; उसका लिप्यंतरण पाठ की यह विशेषता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मन’ सामान्य हिन्दी पाठक के लिए आंतरिक इच्छा और संकल्प को ‘हृदय’ से अधिक स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी मूल क्रिया के ‘दृढ़ करने’ वाले भाव को सुरक्षित रखती है।
