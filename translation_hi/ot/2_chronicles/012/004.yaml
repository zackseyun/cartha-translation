lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: अधिकार कर लिया
  rationale: लכד युद्ध में किसी नगर को पकड़ लेने या अपने अधिकार में कर लेने को दर्शाता है। ‘अधिकार कर लिया’ आधुनिक हिन्दी में सैन्य विजय का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָרֵי הַמְּצֻרוֹת
  choice: गढ़वाले नगरों
  rationale: यह पद स्पष्ट रूप से किलेबंदी से सुरक्षित नगरों को बताता है। ‘गढ़वाले नगर’ साधारण पाठक के लिए सुबोध है और ‘नगर’ को बनाए रखता है।
- source_word: אֲשֶׁר לִיהוּדָה
  choice: यहूदा के
  rationale: यहाँ ל संबंध या अधिकार सूचित करता है। ‘यहूदा के’ संक्षिप्त और स्वाभाविक हिन्दी में राजनीतिक संबद्धता को व्यक्त करता है, बिना इसे केवल भौगोलिक स्थिति तक सीमित किए।
- source_word: וַיָּבֹא עַד יְרוּשָׁלִָם
  choice: और यरूशलेम तक आ पहुँचा
  rationale: בוא के साथ עַד गति की अंतिम सीमा बताता है। ‘तक आ पहुँचा’ यह स्पष्ट करता है कि वह यरूशलेम तक पहुँचा, पर यह आवश्यक नहीं ठहराता कि उसने नगर में प्रवेश किया।
