  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मृत्यु-संबंधी इब्रानी मुहावरे को मूल रूप में सुरक्षित रखते हुए पाद-टिप्पणी में उसका आशय स्पष्ट किया गया है।
