base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/016.yaml
  text: And Rehoboam slept with his fathers and was buried in the city of David[a], and Abijah his son reigned in his place.
translation:
  language: hi
  text: रहूबियाम अपने पुरखाओं के साथ सो गया[a] और उसे दाऊद के नगर में दफ़नाया गया। उसके स्थान पर उसका पुत्र अबिय्याह राज्य करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह मृत्यु और अपने पैतृक वंश में जा मिलने के लिए प्रयुक्त एक प्रचलित इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया
  rationale: यह राजकीय मृत्यु-सूचना में प्रयुक्त इब्रानी मुहावरे को बनाए रखता है। ‘मर गया’ अर्थ को स्पष्ट करता, पर मूल की साहित्यिक अभिव्यक्ति को समतल कर देता। ‘पुरखाओं’ आधुनिक पाठक के लिए स्वाभाविक है और पैतृक वंश का भाव व्यक्त करता है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: यह इब्रानी के कर्मवाच्य रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: यह स्थान-सूचक पद का सीधा, स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य करने लगा
  rationale: उत्तराधिकार की इस सूचना में यह क्रिया नए राजा के शासनारंभ को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: यह इसी पद में आए इब्रानी नाम אֲבִיָּה का निकट देवनागरी लिप्यंतरण है; इसे अन्यत्र मिलने वाले भिन्न रूप ‘अबियाम’ से नहीं मिलाया गया।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह राजकीय उत्तराधिकार के संदर्भ में इब्रानी पद का निकट और स्वाभाविक अर्थ देता है।
theological_decisions: []
