  text: וַ/יִּתְחַזֵּ֞ק הַ/מֶּ֧לֶךְ רְחַבְעָ֛ם בִּ/ירוּשָׁלִַ֖ם וַ/יִּמְלֹ֑ךְ כִּ֣י בֶן אַרְבָּעִ֣ים וְ/אַחַ֣ת שָׁנָה֩ רְחַבְעָ֨ם בְּ/מָלְכ֜/וֹ וּֽ/שֲׁבַ֨ע עֶשְׂרֵ֥ה שָׁנָ֣ה מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֗ם הָ֠/עִיר אֲשֶׁר בָּחַ֨ר יְהוָ֜ה לָ/שׂ֨וּם אֶת שְׁמ֥/וֹ שָׁם֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וְ/שֵׁ֣ם אִמּ֔/וֹ נַעֲמָ֖ה הָֽ/עַמֹּנִֽית־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/013.yaml
  text: So King Rehoboam strengthened himself in Jerusalem and reigned[a]. Rehoboam was forty-one years old when he began to reign, and he reigned seventeen years in Jerusalem, the city that Yahweh had chosen from all the tribes of Israel to put his name there[b]. And his mother’s name was Naamah the Ammonite.
translation:
  language: hi
  text: 'राजा रहूबियाम ने यरूशलेम में अपनी स्थिति मजबूत की[a] और राज्य किया। जब रहूबियाम राजा बना, तब वह इकतालीस वर्ष का था। उसने यरूशलेम में सत्रह वर्ष तक राज्य किया। यरूशलेम वह नगर था जिसे याहवे ने इस्राएल के सभी गोत्रों में से इसलिए चुना था कि वहाँ अपना नाम रखे। रहूबियाम की माता का नाम नामा था; वह अम्मोनी थी।


    [a] या “अपने आपको दृढ़ किया।” इब्रानी क्रिया का अर्थ शक्तिशाली होना या अपनी स्थिति सुदृढ़ करना हो सकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आपको दृढ़ किया।” इब्रानी क्रिया का अर्थ शक्तिशाली होना या अपनी स्थिति सुदृढ़ करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: अपनी स्थिति मजबूत की
  rationale: हिथपाएल रूप में स्वयं को दृढ़ करने या सुदृढ़ होकर स्थापित होने का भाव है। संदर्भ में यह संकट के बाद रहूबियाम द्वारा अपनी सत्ता सुदृढ़ करने को दर्शाता है; फुटनोट अधिक शाब्दिक विकल्प सुरक्षित रखता है।
- source_word: וַיִּמְלֹךְ
  choice: और राज्य किया
  rationale: यह क्रिया पहले कार्य के बाद कथा को आगे बढ़ाती है और राज करने का सामान्य अर्थ देती है; राज्यारंभ का समय अगली उपवाक्य-रचना में अलग से आता है।
- source_word: בְּמָלְכוֹ
  choice: जब रहूबियाम राजा बना
  rationale: ב के साथ infinitive construct उसके राज्यारोहण के समय को सूचित करता है। यह आधुनिक हिन्दी में स्वाभाविक कालवाचक अभिव्यक्ति है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है, इसलिए इसे उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: कि वहाँ अपना नाम रखे
  rationale: मन्दिर-चुनाव से जुड़ी ठोस इब्रानी अभिव्यक्ति को बनाए रखा गया है और इसे ‘अपनी उपस्थिति स्थापित करे’ जैसे व्याख्यात्मक विस्तार में नहीं बदला गया।
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: מן यहाँ समस्त गोत्रों के बीच से चुनाव का भाव व्यक्त करता है।
- source_word: הָעַמֹּנִית
  choice: वह अम्मोनी थी
  rationale: स्त्रीलिंग जातिवाचक शब्द नामा की जातीय पहचान बताता है; स्वतंत्र उपवाक्य आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पाठ में चार-अक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है। लिप्यंतरण व्यक्तिगत वाचा-नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘वहाँ अपना नाम रखना’ सूत्र
  choice: ठोस मूल मुहावरे को बनाए रखना
  alternative: वहाँ अपनी उपस्थिति स्थापित करना
  rationale: मूल पाठ ‘नाम रखने’ की बात करता है। इसे उपस्थिति या निवास संबंधी विस्तृत धर्मवैज्ञानिक व्याख्या में बदलना पाठ से अधिक कहना होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। लंबे इब्रानी राजकीय-विवरण को स्पष्ट हिन्दी वाक्यों में विभाजित किया गया है, जबकि कालक्रम, यरूशलेम के चुनाव और माता की जातीय पहचान की सारी सूचना सुरक्षित है।
