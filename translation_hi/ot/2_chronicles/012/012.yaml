source:
  edition: WLC
  text: וּ/בְ/הִכָּֽנְע֗/וֹ שָׁ֤ב מִמֶּ֨/נּוּ֙ אַף יְהוָ֔ה וְ/לֹ֥א לְ/הַשְׁחִ֖ית לְ/כָלָ֑ה וְ/גַם֙ בִּֽ/יהוּדָ֔ה הָיָ֖ה דְּבָרִ֥ים טוֹבִֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/012.yaml
  text: And when he humbled himself[a], the anger of Yahweh turned away from him, so as not to destroy him completely[b]; and also in Judah there were good things.
translation:
  language: hi
  text: जब उसने अपने को नम्र किया[a], तब याहवे का क्रोध उस पर से हट गया, और उसने उसका पूरी तरह विनाश नहीं किया; यहूदा में भी अच्छी बातें थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह नम्र हुआ।”
    reason: हिथपएल रूप मुख्यतः आत्मवाचक है—उसने स्वयं को नम्र किया—पर प्रसंग में अवस्था का भाव भी व्यक्त हो सकता है।
  - marker: b
    text: शाब्दिक अर्थ “अच्छी बातें”; यह व्यापक अभिव्यक्ति यहूदा में प्रशंसनीय दशाओं, कामों या अन्य बातों की ओर संकेत कर सकती है।
    reason: דְּבָרִים के व्यापक अर्थ को किसी एक विशिष्ट अर्थ तक सीमित न करने के लिए।
lexical_decisions:
- source_word: וּבְהִכָּנְעוֹ
  choice: जब उसने अपने आपको दीन किया
  rationale: בְּ के साथ infinitive construct यहाँ कालवाचक है। כנע का हिथपएल रूप रहूबियाम के स्वयं को नम्र/दीन करने को व्यक्त करता है; हिन्दी में ‘अपने आपको दीन किया’ इस आत्मवाचक अर्थ को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: שָׁב מִמֶּנּוּ
  choice: उस पर से हट गया
  rationale: क्रोध के संदर्भ में שׁוב और מִן का मेल उससे दूर हो जाने का भाव देता है। ‘हट गया’ दिशात्मक अर्थ रखता है और ‘पछताया’ जैसे अधिक व्याख्यात्मक शब्द से बचता है।
- source_word: אַף יְהוָה
  choice: याहवे का क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह रूढ़िगत रूप से ‘क्रोध’ है। יהוה को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम ‘याहवे’ के रूप में दिया गया है।
- source_word: וְלֹא לְהַשְׁחִית לְכָלָה
  choice: और उसने उसे पूरी तरह नष्ट नहीं किया
  rationale: नकार सहित infinitive पूर्ववर्ती क्रोध के हटने का परिणाम व्यक्त करता है, जबकि לְכָלָה विनाश की पूर्णता पर बल देता है। हिन्दी में कर्ता याहवे और कर्म रहूबियाम को संदर्भ से स्पष्ट किया गया है।
- source_word: וְגַם בִּיהוּדָה
  choice: यहूदा में भी
  rationale: בְּ का स्थानवाचक अर्थ और גַּם का योगसूचक बल संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: הָיָה דְּבָרִים טוֹבִים
  choice: कुछ अच्छी बातें थीं
  rationale: דְּבָרִים व्यापक अर्थ वाला शब्द है और यहाँ अच्छे कामों, दशाओं या अन्य बातों में से किसी एक को निश्चित नहीं करता। ‘कुछ अच्छी बातें’ उसी व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय के कम होने को बिना बढ़ाए या नरम किए व्यक्त करना
  choice: याहवे का क्रोध उस पर से हट गया, और उसने उसे पूरी तरह नष्ट नहीं किया
  alternative: याहवे ने दया की और उसे छोड़ दिया
  rationale: मूल पाठ क्रोध के वास्तविक रूप से हटने और पूर्ण विनाश न होने की बात करता है, पर सभी दण्डात्मक परिणामों के समाप्त हो जाने की नहीं। चुना गया रूप न्याय और दया, दोनों को बनाए रखता है।
- issue: यहूदा में मौजूद ‘अच्छी बातों’ का दायरा
  choice: यहूदा में भी कुछ अच्छी बातें थीं
  alternative: यहूदा की दशा अच्छी थी
  rationale: मूल דְּבָרִים טוֹבִים जानबूझकर व्यापक है। इसे केवल नैतिक सुधार, समृद्धि या विश्वासयोग्य कार्यों तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘अपने आपको दीन किया’ सामान्य पाठक के लिए आत्मवाचक क्रिया को स्पष्ट करता है; ‘अच्छी बातें’ मूल की अर्थगत व्यापकता को सुरक्षित रखता है।
