base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/007.yaml
  text: When Yahweh saw that they had humbled themselves[a], the word of Yahweh came to Shemaiah, saying, “They have humbled themselves; I will not destroy them, but I will grant them some deliverance, and my wrath will not be poured out on Jerusalem by the hand of Shishak.”
translation:
  language: hi
  text: 'जब याहवे ने देखा कि उन्होंने अपने को नम्र किया है, तब याहवे का वचन शमायाह के पास आया: “उन्होंने अपने को नम्र किया है; मैं उनका विनाश नहीं करूँगा, बल्कि उन्हें थोड़ी-सी मुक्ति दूँगा[a], और मेरा प्रकोप शीशक के हाथ से यरूशलेम पर नहीं उंडेला जाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उन्हें बच निकलने का थोड़ा-सा अवसर दूँगा,” अथवा, “मैं उन्हें कुछ बचे हुए लोग दूँगा।” इब्रानी पदबंध संक्षिप्त है और पूर्ण विनाश के बदले सीमित बचाव पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִרְאוֹת יְהוָה
  choice: जब याहवे ने देखा
  rationale: ב के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है। ‘जब ... ने देखा’ आधुनिक हिन्दी में स्वाभाविक है और घटनाक्रम को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: נִכְנָעוּ
  choice: उन्होंने अपने आपको दीन किया है
  rationale: כנע का निफ़अल रूप इस प्रसंग में भविष्यद्वक्ता की चेतावनी के उत्तर में स्वयं को नम्र करने या अधीन होने का भाव देता है।
- source_word: הָיָה דְבַר יְהוָה אֶל שְׁמַעְיָה
  choice: याहवे का वचन शमायाह के पास आया
  rationale: यह भविष्यद्वाणी का मानक सूत्र है; हिन्दी में भी ‘वचन ... के पास आया’ उसके स्रोत-रूपक को सुरक्षित रखता है।
- source_word: לֹא אַשְׁחִיתֵם
  choice: मैं उनका विनाश नहीं करूँगा
  rationale: שׁחת का हिफ़ईल न्याय के प्रसंग में ‘नष्ट करना’ या ‘विनाश करना’ दर्शाता है।
- source_word: וְנָתַתִּי לָהֶם כִּמְעַט לִפְלֵיטָה
  choice: बल्कि उन्हें कुछ हद तक छुटकारा दूँगा
  rationale: संक्षिप्त इब्रानी पदबंध सीमित बचाव, बच निकलने या बचे हुए लोगों का संकेत दे सकता है। मुख्य पाठ में ‘कुछ हद तक छुटकारा’ सीमित राहत का भाव स्वाभाविक हिन्दी में देता है; विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: תִתַּךְ חֲמָתִי
  choice: मेरा प्रकोप ... नहीं उंडेला जाएगा
  rationale: נתך और חמה का संयुक्त प्रयोग प्रकोप उंडेले जाने का रूपक बनाता है। निष्क्रिय वाक्य-रचना मूल पाठ की अभिव्यक्ति को बनाए रखती है।
- source_word: בְּיַד שִׁישָׁק
  choice: शीशक के हाथ से
  rationale: यह साधन या माध्यम बताने वाला इब्रानी मुहावरा है। ‘के हाथ से’ हिन्दी में बोधगम्य रहते हुए मूल रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: כִמְעַט לִפְלֵיטָה में बचाव की सीमा और स्वरूप
  choice: कुछ हद तक छुटकारा
  alternative: थोड़ी-सी बच निकलने की राह; कुछ जीवित बचे हुए लोग
  rationale: इब्रानी पदबंध जानबूझकर संक्षिप्त है और पूर्ण विनाश के बदले सीमित बचाव पर बल दे सकता है। मुख्य पाठ किसी एक संकीर्ण अर्थ को अंतिम नहीं बनाता; वास्तविक विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘दीन किया,’ ‘वचन ... के पास आया,’ और ‘प्रकोप ... उंडेला जाएगा’ जैसे बाइबिलीय मुहावरे स्रोत के स्वर और रूपकों को बचाते हैं, जबकि वाक्य-विन्यास सहज हिन्दी का है। पादटिप्पणी-चिह्न [a] उसी अस्पष्ट पदबंध के बाद रखा गया है जिसकी व्याख्या पादटिप्पणी करती है।
