  text: וַ/יְהִ֗י כְּ/הָכִ֞ין מַלְכ֤וּת רְחַבְעָם֙ וּ/כְ/חֶזְקָת֔/וֹ עָזַ֖ב אֶת תּוֹרַ֣ת יְהוָ֑ה וְ/כָל יִשְׂרָאֵ֖ל עִמּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/001.yaml
  text: And when Rehoboam’s kingdom was established[a], and he had become strong, he abandoned the law of Yahweh—and all Israel with him.
translation:
  language: hi
  text: जब रहूबियाम का राज्य स्थिर हो गया और वह शक्तिशाली हो गया, तब उसने यहोवा की व्यवस्था[a] को त्याग दिया—और सारे इस्राएल ने भी उसके साथ ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा की शिक्षा।’ इब्रानी शब्द ‘तोरा’ का अर्थ प्रसंग के अनुसार ‘व्यवस्था’ या ‘शिक्षा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּהָכִין
  choice: जब ... स्थिर हो गया
  rationale: यह कथात्मक सूत्र समय-संबंधी परिस्थिति प्रस्तुत करता है। राज्य के लिए 'स्थिर हो गया' राजसत्ता के स्थापित और सुदृढ़ हो जाने का स्वाभाविक हिन्दी रूप है।
- source_word: מַלְכוּת רְחַבְעָם
  choice: रहूबियाम का राज्य
  rationale: מַלְכוּת यहाँ राजसत्ता अथवा राज्य, दोनों का संकेत दे सकता है; प्रसंग में 'राज्य' सहज और पर्याप्त रूप से व्यापक है। नाम का रूप प्रचलित हिन्दी बाइबलीय वर्तनी के अनुसार रखा गया है।
- source_word: וּכְחֶזְקָתוֹ
  choice: और वह शक्तिशाली हो गया
  rationale: חזק प्राप्त हुई शक्ति या सुदृढ़ता को व्यक्त करता है। सर्वनाम का संदर्भ रहूबियाम से है, इसलिए उसे हिन्दी में स्पष्ट किया गया है।
- source_word: עָזַב
  choice: त्याग दिया
  rationale: यह क्रिया जान-बूझकर छोड़ देने और वाचा से विमुख होने की गंभीरता व्यक्त करती है; 'त्याग दिया' आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था
  rationale: תּוֹרָה का अर्थ व्यवस्था या शिक्षा हो सकता है। इस ऐतिहासिक-वाचागत प्रसंग में 'व्यवस्था' मुख्य पाठ में स्वाभाविक है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित प्रतिलेखन 'यहोवा' से प्रस्तुत किया गया है।
- source_word: וְכָל יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ सारे इस्राएल ने भी
  rationale: इब्रानी का संक्षिप्त पदबंध रहूबियाम के साथ इस त्याग में इस्राएल की सहभागिता बताता है। हिन्दी में क्रिया निहित रखकर 'ने भी' से संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: विभाजित राजतंत्र के प्रसंग में 'सारा इस्राएल' का दायरा
  choice: '''सारे इस्राएल'' को ज्यों का त्यों रखा गया'
  alternative: '''सारा यहूदा'' या ''उसकी सारी प्रजा'''
  rationale: इतिहास की इस अवस्था में दायरे को लेकर प्रश्न होने पर भी मूल पाठ יִשְׂרָאֵל कहता है। अनुवाद इसे यहूदा तक सीमित करके अंतर्निहित ऐतिहासिक-धर्मवैचारिक तनाव को हल नहीं करता।
- issue: תּוֹרָה का अर्थ
  choice: मुख्य पाठ में 'व्यवस्था'
  alternative: '''शिक्षा'' या ''निर्देश'''
  rationale: प्रसंग में वाचागत आज्ञाओं का भाव प्रबल है, पर शब्द की शिक्षात्मक अर्थ-छाया वास्तविक है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, साधारण पाठक के लिए स्पष्ट किंतु गरिमापूर्ण रखी गई है। डैश अंतिम पदबंध की जोरदार, संक्षिप्त सहभागिता को बनाए रखता है।
