source:
  edition: WLC
  text: וְ/דִבְרֵ֣י רְחַבְעָ֗ם הָ/רִאשֹׁנִים֙ וְ/הָ/אֲ֣חַרוֹנִ֔ים הֲ/לֹא הֵ֨ם כְּתוּבִ֜ים בְּ/דִבְרֵ֨י שְׁמַֽעְיָ֧ה הַ/נָּבִ֛יא וְ/עִדּ֥וֹ הַ/חֹזֶ֖ה לְ/הִתְיַחֵ֑שׂ וּ/מִלְחֲמ֧וֹת רְחַבְעָ֛ם וְ/יָרָבְעָ֖ם כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/015.yaml
  text: The acts of Rehoboam[a], the first and the last, are they not written in the records of Shemaiah the prophet and of Iddo the seer, according to genealogical enrollment? And there were wars between Rehoboam and Jeroboam all their days.
translation:
  language: hi
  text: रहूबियाम के आरम्भ से अन्त तक के काम क्या शमायाह नबी और इद्दो दर्शी के अभिलेखों में वंशावली के अनुसार दर्ज नहीं हैं?[a] रहूबियाम और यारोबाम के बीच उनके पूरे जीवनकाल में युद्ध होते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वंशावली के अभिलेखों में” या “वंशावली में नाम दर्ज करने के लिए” भी हो सकता है। इब्रानी पद कठिन है और सम्भवतः इद्दो से जुड़ी स्रोत-सामग्री के स्वरूप या उद्देश्य का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבְרֵי
  choice: काम
  rationale: राजकीय सार-वाक्यों में यह शब्द राजा के केवल कथनों को नहीं, बल्कि उसके शासनकाल के कार्यों और घटनाओं को दर्शाता है।
- source_word: הָרִאשֹׁנִים וְהָאֲחַרוֹנִים
  choice: आरम्भ से अन्त तक
  rationale: यह स्वाभाविक हिन्दी में राजा के पूरे शासनकाल के कार्यों को समेटता है, जबकि इब्रानी के ‘पहले और बाद के’ सूत्र का आशय बनाए रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या ... दर्ज नहीं हैं?
  rationale: स्रोत-संदर्भ देने वाले इब्रानी आलंकारिक प्रश्न को प्रश्न के रूप में ही सुरक्षित रखा गया है।
- source_word: בְּדִבְרֵי
  choice: अभिलेखों में
  rationale: यहाँ शब्द लिखित ऐतिहासिक स्रोत-सामग्री को सूचित करता है; ‘अभिलेख’ हिन्दी में उस दस्तावेजी अर्थ को स्पष्ट करता है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: נָבִיא के लिए प्रचलित और सहज बाइबलीय हिन्दी पद।
- source_word: הַחֹזֶה
  choice: दर्शी
  rationale: यह חֹזֶה को נָבִיא से शब्दगत रूप से अलग रखते हुए उसके विशिष्ट भविष्यदर्शी पद को व्यक्त करता है।
- source_word: לְהִתְיַחֵשׂ
  choice: वंशावली के अनुसार
  rationale: यह कठिन पद वंश के आधार पर नाम दर्ज करने या सामग्री को वंशावली के रूप में व्यवस्थित करने से जुड़ा है; मुख्य पाठ संभावित अर्थ देता है और पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: וּמִלְחֲמוֹת
  choice: युद्ध होते रहे
  rationale: इब्रानी संज्ञा-वाक्य में निहित कथन को स्वाभाविक हिन्दी क्रियात्मक रूप दिया गया है।
- source_word: כָּל הַיָּמִים
  choice: उनके पूरे जीवनकाल में
  rationale: दोनों राजाओं के समस्त दिनों के इब्रानी मुहावरे को निकटता से व्यक्त करता है; प्रसंग में इसमें उनके शासनकालों का भाव भी सम्मिलित हो सकता है।
