source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ שָׂרֵֽי יִשְׂרָאֵ֖ל וְ/הַ/מֶּ֑לֶךְ וַ/יֹּאמְר֖וּ צַדִּ֥יק יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/006.yaml
  text: Then the leaders of Israel and the king humbled themselves and said[a], “Yahweh is righteous.”
translation:
  language: hi
  text: तब इस्राएल[a] के अगुवों और राजा ने अपने आप को नम्र किया और कहा, “याहवे धर्मी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘इस्राएल के अगुए’ है। इस संदर्भ में कुछ लोग इसे विशेष रूप से रहूबियाम के अधीन यहूदा के अगुओं के लिए प्रयुक्त समझते हैं, पर पाठ स्वयं ‘इस्राएल’ कहता है।
    reason: मूल पाठ के ‘इस्राएल’ और तत्कालीन यहूदा-संबंधी ऐतिहासिक संदर्भ के बीच अंतर को बिना सामंजस्य किए स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: अपने आपको दीन किया
  rationale: निफ़अल रूप यहाँ भविष्यद्वक्ता की फटकार के उत्तर में स्वयं को नम्र करने और अधीन होने की क्रिया व्यक्त करता है। यह हिंदी प्रयोग आत्मवाचक अर्थ और नैतिक-आत्मिक प्रतिक्रिया दोनों को स्वाभाविक ढंग से रखता है।
- source_word: שָׂרֵי
  choice: अगुओं
  rationale: यह शब्द शासकीय प्रधानों या अधिकारियों के लिए है। ‘अगुए’ आधुनिक, सहज और व्यापक पद है; ‘राजकुमार’ यहाँ अनावश्यक रूप से वंशगत अर्थ दे सकता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल इब्रानी पाठ में स्पष्ट रूप से ‘इस्राएल’ है। तत्कालीन ऐतिहासिक संदर्भ यहूदा का होने पर भी पाठ को ‘यहूदा’ करके सामंजस्यपूर्ण नहीं बनाया गया।
- source_word: וְהַמֶּלֶךְ
  choice: और राजा
  rationale: समन्वित संज्ञा-पद का सीधा अनुवाद है, जो राजा को अगुओं से अलग व्यक्ति के रूप में रखता है।
- source_word: וַיֹּאמְרוּ
  choice: और कहा
  rationale: इब्रानी बहुवचन क्रिया संयुक्त कर्ता—अगुओं और राजा—की ओर संकेत करती है। हिंदी में ‘ने ... कहा’ संयुक्त कर्ता के साथ स्वाभाविक है और अलग सर्वनाम आवश्यक नहीं।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यहाँ यह शब्द याहवे के न्याय में उसकी नैतिक सच्चाई और उचितता बताता है। ‘धर्मी’ इसके नैतिक और वाचा-संबंधी भार को बनाए रखता है; ‘न्यायी’ संभव है, पर अर्थ को न्यायिक पक्ष तक सीमित कर सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामटन को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के प्रचलित हिंदी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम को सुरक्षित रखना या उसे किसी उपाधि से अनूदित करना
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में יְהוָה नाम स्वयं आया है। ‘याहवे’ मूल नाम को बनाए रखता है और उसके स्थान पर कोई उपाधि नहीं रखता।
- issue: ऐतिहासिक संदर्भ के कारण ‘इस्राएल’ को ‘यहूदा’ करना या मूल शब्द बनाए रखना
  choice: इस्राएल
  alternative: यहूदा
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘इस्राएल’ कहता है। ‘यहूदा’ करने से व्याख्यात्मक सामंजस्य पाठ में ही जोड़ दिया जाता; इसलिए मूल की तनावपूर्ण शब्दावली सुरक्षित रखी गई है और संदर्भगत प्रश्न पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अगुओं’ प्रशासनिक या राजवंशीय पद को जरूरत से अधिक संकीर्ण नहीं करता, और ‘अपने आपको दीन किया’ आत्मवाचक प्रतिक्रिया को स्पष्ट करता है।
