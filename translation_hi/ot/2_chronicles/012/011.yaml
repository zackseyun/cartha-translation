  text: וַ/יְהִ֛י מִ/דֵּי ב֥וֹא הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה בָּ֤אוּ הָ/רָצִים֙ וּ/נְשָׂא֔וּ/ם וֶ/הֱשִׁב֖וּ/ם אֶל תָּ֥א הָ/רָצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/011.yaml
  text: And whenever the king entered the house of Yahweh[a], the guards would come and carry them[c][b], and then return them to the guards’ chamber.
translation:
  language: hi
  text: जब-जब राजा यहोवा के भवन में जाता था, तब अंगरक्षक आकर उन ढालों को उठा ले जाते और फिर उन्हें अंगरक्षकों के कक्ष में वापस रख देते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִדֵּי בּוֹא
  choice: जब-जब ... जाता था
  rationale: מִדֵּי के साथ क्रिया का यह रूप बार-बार होने वाली घटना व्यक्त करता है; हिन्दी में ‘जब-जब’ इस पुनरावृत्त अर्थ को स्वाभाविक रूप से प्रकट करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ है और यहाँ वह मन्दिर के लिए प्रयुक्त हुआ है; ‘भवन’ मूल अभिव्यक्ति को बनाए रखते हुए गरिमापूर्ण और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे पदवी से अलग बनाए रखता है।
- source_word: הָרָצִים
  choice: अंगरक्षक
  rationale: शाब्दिक अर्थ ‘दौड़नेवाले’ है, पर राजकीय संदर्भ में यह राजा की सुरक्षा-टुकड़ी को सूचित करता है; ‘अंगरक्षक’ उसका कार्य स्पष्ट करता है।
- source_word: וּנְשָׂאוּם
  choice: उन ढालों को उठा ले जाते
  rationale: प्रत्यय का संकेत पिछले पद की काँसे की ढालों की ओर है। संज्ञा को स्पष्ट करना हिन्दी में संदर्भ को सहज बनाता है, और נשׂא का उठाकर ले जाने का भाव सुरक्षित रहता है।
- source_word: וֶהֱשִׁיבוּם
  choice: उन्हें ... वापस रख देते थे
  rationale: שׁוב के हिफ़ईल रूप का अर्थ यहाँ वस्तुओं को उनके स्थान पर लौटा देना है; भंडारण-कक्ष के संदर्भ में ‘वापस रख देते’ स्वाभाविक हिन्दी है।
- source_word: תָּא
  choice: कक्ष
  rationale: תָּא एक छोटे कमरे अथवा कोठरी को दर्शाता है; ‘कक्ष’ मूल अर्थ को बिना अनावश्यक विशिष्टीकरण के व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे ‘प्रभु’ जैसी पदवी में नहीं बदलता; उच्चारण के पुनर्निर्माण से संबंधित अनिश्चितता के कारण ‘याहवे’ भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। अपूर्ण भूतकाल और ‘जब-जब’ से क्रिया की पुनरावृत्ति व्यक्त हुई है। पिछले पद के संकेत को स्पष्ट करने के लिए सर्वनाम के स्थान पर ‘उन ढालों’ का प्रयोग किया गया है।
