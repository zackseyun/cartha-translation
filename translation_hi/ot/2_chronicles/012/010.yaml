translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। 'राजभवन' और 'अंगरक्षक' अर्थ स्पष्ट करते हैं, जबकि पादटिप्पणी הָרָצִים के शाब्दिक और संस्थागत अर्थ को सुरक्षित रखती है। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद रखे गए हैं।
