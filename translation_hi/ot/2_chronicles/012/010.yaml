  text: וַ/יַּ֨עַשׂ הַ/מֶּ֤לֶךְ רְחַבְעָם֙ תַּחְתֵּי/הֶ֔ם מָגִנֵּ֖י נְחֹ֑שֶׁת וְ/הִפְקִ֗יד עַל יַד֙ שָׂרֵ֣י הָ/רָצִ֔ים הַ/שֹּׁ֣מְרִ֔ים פֶּ֖תַח בֵּ֥ית הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/010.yaml
  text: So King Rehoboam made bronze shields in their place and committed them to the care of the commanders of the guards[b][a], who kept watch at the entrance of the king’s house.
translation:
  language: hi
  text: इसलिए राजा रहूबियाम ने उनकी जगह काँसे की ढालें बनवाईं[b] और उन्हें उन अंगरक्षकों[a] के अधिकारियों की देखरेख में सौंप दिया, जो राजभवन के प्रवेश-द्वार पर पहरा देते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘दौड़नेवाले’ है; संभवतः यह उन राजकीय धावकों या संदेशवाहकों का पदनाम था जो अंगरक्षकों के रूप में भी सेवा करते थे।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् वे काँसे की ढालें, जो शीशक द्वारा ले जाई गई सोने की ढालों के स्थान पर बनाई गई थीं; पिछला पद देखें।
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाईं
  rationale: राजा के संदर्भ में यह स्वाभाविक रूप से बताता है कि उसने ढालें तैयार कराईं; इससे हिब्रू עשה का मूल भाव बना रहता है।
- source_word: תַּחְתֵּיהֶם
  choice: उनकी जगह
  rationale: यह पिछले पद में ले जाई गई सोने की ढालों के स्थान पर इन ढालों के बनाए जाने का प्रतिस्थापन-बोध व्यक्त करता है।
- source_word: מָגִנֵּי נְחֹשֶׁת
  choice: काँसे की ढालें
  rationale: हथियार और कवच के संदर्भ में נְחֹשֶׁת के लिए 'काँसा' उपयुक्त और प्रचलित अर्थ है।
- source_word: וְהִפְקִיד עַל יַד
  choice: देखरेख में सौंप दिया
  rationale: हिफ़िल פקד और मुहावरे עַל יַד का संयुक्त अर्थ किसी वस्तु को किसी के प्रभार या संरक्षण में देना है।
- source_word: שָׂרֵי
  choice: अधिकारियों
  rationale: यह सुरक्षा-दल के प्रमुखों को दर्शाता है; 'अधिकारी' आधुनिक हिन्दी में पद और उत्तरदायित्व दोनों स्पष्ट करता है।
- source_word: הָרָצִים
  choice: अंगरक्षकों
  rationale: शाब्दिक अर्थ 'दौड़नेवाले' है, पर राजकीय संदर्भ में यह राजा की सेवा करने वाले धावक-दल अथवा राजकीय रक्षकों का पदनाम है।
- source_word: הַשֹּׁמְרִים
  choice: जो ... पहरा देते थे
  rationale: कृदन्त उनके नियमित और निरंतर सुरक्षा-कार्य को व्यक्त करता है।
- source_word: פֶּתַח בֵּית הַמֶּלֶךְ
  choice: राजभवन के प्रवेश-द्वार पर
  rationale: शाब्दिक 'राजा का घर' यहाँ राजकीय निवास अर्थात राजभवन है; 'प्रवेश-द्वार' פתח को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
