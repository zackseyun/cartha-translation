id: 2CH.12.2
reference: 2 Chronicles 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֤ה הַֽ/חֲמִישִׁית֙ לַ/מֶּ֣לֶךְ רְחַבְעָ֔ם עָלָ֛ה שִׁישַׁ֥ק מֶֽלֶךְ מִצְרַ֖יִם עַל יְרוּשָׁלִָ֑ם כִּ֥י מָעֲל֖וּ בַּ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/002.yaml
  text: And in the fifth year of King Rehoboam[a], Shishak king of Egypt came up against Jerusalem, because they had acted unfaithfully against Yahweh.
translation:
  language: hi
  text: राजा रहूबियाम के पाँचवें वर्ष में मिस्र का राजा शीशक यरूशलेम पर चढ़ आया, क्योंकि उन्होंने यहोवा के प्रति विश्वासघात किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: में
  rationale: इब्रानी कथात्मक सूत्र को हिंदी में अलग से ‘और ऐसा हुआ’ कहना आवश्यक नहीं; कालसूचक वाक्यांश से कथा का प्रवाह स्वाभाविक रूप से आरंभ होता है।
- source_word: בַּשָּׁנָה הַחֲמִישִׁית לַמֶּלֶךְ רְחַבְעָם
  choice: राजा रहूबियाम के पाँचवें वर्ष में
  rationale: यह राजकीय कालगणना का स्वाभाविक और मूल के निकट हिंदी रूप है।
- source_word: עָלָה ... עַל יְרוּשָׁלִָם
  choice: यरूशलेम पर चढ़ आया
  rationale: सैन्य संदर्भ में यह शत्रुतापूर्ण अग्रगमन व्यक्त करता है और ‘आक्रमण किया’ की अपेक्षा इब्रानी मुहावरे को अधिक निकटता से सुरक्षित रखता है।
- source_word: שִׁישַׁק מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा शीशक
  rationale: उपाधि और व्यक्तिनाम को सहज हिंदी क्रम में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आक्रमण का स्पष्ट धर्मवैचारिक कारण प्रस्तुत करता है।
- source_word: מָעֲלוּ בַּיהוָה
  choice: उन्होंने यहोवा के प्रति विश्वासघात किया था
  rationale: मעל विश्वास या वाचा के उल्लंघन का बोध देता है; ‘विश्वासघात किया’ उसके सक्रिय नैतिक-धार्मिक बल को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिंदी में प्रचलित लिप्यंतरण द्वारा दर्शाया गया है।
theological_decisions:
- issue: शीशक के आक्रमण का वाचागत कारण
  choice: क्योंकि उन्होंने यहोवा के प्रति विश्वासघात किया था
  alternative: क्योंकि वे यहोवा के प्रति विश्वासयोग्य नहीं रहे थे
  rationale: मूल पाठ राजनीतिक घटना को लोगों के विश्वास या वाचा के उल्लंघन का परिणाम बताता है। सक्रिय क्रिया ‘विश्वासघात किया’ इस कारण-संबंध और अपराध की गंभीरता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘चढ़ आया’ ऐतिहासिक-सैन्य कथन की स्वाभाविकता और मूल मुहावरे दोनों को सुरक्षित रखता है।
