source:
  edition: WLC
  text: וּֽ/שְׁמַֽעְיָ֤ה הַ/נָּבִיא֙ בָּ֣א אֶל רְחַבְעָ֔ם וְ/שָׂרֵ֣י יְהוּדָ֔ה אֲשֶׁר נֶאֶסְפ֥וּ אֶל יְרוּשָׁלִַ֖ם מִ/פְּנֵ֣י שִׁישָׁ֑ק וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֣ר יְהוָ֗ה אַתֶּם֙ עֲזַבְתֶּ֣ם אֹתִ֔/י וְ/אַף אֲנִ֛י עָזַ֥בְתִּי אֶתְ/כֶ֖ם בְּ/יַד שִׁישָֽׁק־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/005.yaml
  text: 'Then Shemaiah the prophet came to Rehoboam and the officials of Judah who had gathered in Jerusalem because of Shishak[a], and he said to them, “Thus says Yahweh: You have forsaken me, so I also have forsaken you into the hand of Shishak.”'
translation:
  language: hi
  text: 'तब शमायाह नबी रहूबियाम और यहूदा के उन अधिकारियों के पास आया, जो शीशक के कारण[a] यरूशलेम में इकट्ठे हुए थे। उसने उनसे कहा, “याहवे यों कहता है: तुमने मुझे छोड़ दिया है, और मैंने भी तुम्हें शीशक के हाथ में छोड़ दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “शीशक के सामने से”; आशय शीशक के कारण या उसके भय से हो सकता है।
    reason: मूल पदबंध के शाब्दिक रूप और उसके संभावित कारणार्थक अथवा भय-संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וּשְׁמַעְיָה הַנָּבִיא
  choice: तब शमायाह नबी
  rationale: वाव कथानक को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ उपयुक्त है। निश्चित पदबंध को हिन्दी के सहज रूप ‘शमायाह नबी’ में व्यक्त किया गया है।
- source_word: בָּא אֶל
  choice: के पास आया
  rationale: यह पदबंध संबंधित व्यक्तियों के सामने पहुँचने को दर्शाता है; ‘के पास आया’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: וְשָׂרֵי יְהוּדָה
  choice: और यहूदा के उन अधिकारियों
  rationale: שָׂרִים यहाँ शासन से जुड़े उच्च पदाधिकारियों को सूचित करता है। ‘अधिकारी’ न तो अनावश्यक रूप से राजवंशीय अर्थ देता है, न सैनिक भूमिका तक सीमित करता है।
- source_word: אֲשֶׁר נֶאֶסְפוּ אֶל יְרוּשָׁלַםִ
  choice: जो ... यरूशलेम में इकट्ठे हुए थे
  rationale: निफ़अल रूप सामूहिक रूप से एकत्र होने का भाव देता है। हिन्दी में परिणामी स्थान के लिए ‘यरूशलेम में’ अधिक सहज है।
- source_word: מִפְּנֵי שִׁישָׁק
  choice: शीशक के कारण
  rationale: शाब्दिक रूप ‘शीशक के सामने से’ है; संदर्भ में उसके आक्रमण या भय के कारण यरूशलेम में एकत्र होने का भाव है। व्यापक कारणार्थक अनुवाद मूल की संभावित अर्थ-सीमा बनाए रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहता है
  rationale: यह भविष्यवाणी-संदेश का प्रचलित सूत्र है। יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: עֲזַבְתֶּם אֹתִי ... עָזַבְתִּי אֶתְכֶם
  choice: तुमने मुझे छोड़ दिया है ... मैंने भी तुम्हें ... छोड़ दिया है
  rationale: एक ही इब्रानी क्रिया की पुनरावृत्ति को उसी हिन्दी क्रिया से रखा गया है, जिससे अपराध और प्रत्युत्तर की जानबूझकर बनाई गई समानता सुरक्षित रहती है। ‘छोड़ दिया’ सामान्य पाठक के लिए स्पष्ट है और यहाँ त्यागने का गंभीर भाव वहन करता है।
- source_word: וְאַף אֲנִי
  choice: इसलिए मैंने भी
  rationale: यहाँ संयोजन समानुपाती दैवी प्रत्युत्तर व्यक्त करता है; ‘इसलिए ... भी’ उस संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: בְּיַד שִׁישָׁק
  choice: शीशक के हाथ में
  rationale: ‘हाथ में’ किसी की सत्ता या नियंत्रण में सौंपे जाने का इब्रानी रूपक है और हिन्दी में भी समझने योग्य बाइबलीय मुहावरा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ स्रोत-रूप का व्यापक रूप से स्वीकृत लिप्यंतरण है और इसे सामान्य उपाधि में नहीं बदलता।
- issue: עָזַב की परस्पर समानता
  choice: दोनों स्थानों पर ‘छोड़ दिया है’
  alternative: पहले ‘त्याग दिया’ और बाद में ‘हाथ में सौंप दिया’
  rationale: मूल की एक ही क्रिया लोगों के कृत्य और याहवे के न्यायपूर्ण प्रत्युत्तर के बीच तीखी समानता बनाती है। अलग-अलग हिन्दी क्रियाएँ इस धार्मिक और अलंकारिक तनाव को कम कर देतीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘नबी’, ‘अधिकारी’ और ‘हाथ में’ जैसे परिचित शब्द चुने गए हैं। वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम में है, जबकि मूल की कारणात्मकता, पुनरावृत्ति और दैवी न्याय की तीव्रता बनाए रखी गई है।
