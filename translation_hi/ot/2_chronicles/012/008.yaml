  terminology: “दास” appropriately conveys the force of political subjugation in context, and the repeated “सेवा” preserves the Hebrew lexical parallel and its religious-political breadth. The footnote responsibly identifies “उपासना” as a possible narrower contextual rendering without making it the sole meaning.
