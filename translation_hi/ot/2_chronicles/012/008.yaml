  source_fidelity: 'The Hindi accurately represents the Hebrew sequence and contrast: causal כִּי (“क्योंकि”), coming into subjection as servants/slaves (“उसके दास हो जाएँगे”), the purposive/resultative sense of וְיֵדְעוּ (“ताकि ... जानें”), and the deliberate parallel between “मेरी सेवा” and “देश-देश के राज्यों की सेवा.” It retains the plural political sense of מַמְלְכוֹת הָאֲרָצוֹת without over-specifying it.'
