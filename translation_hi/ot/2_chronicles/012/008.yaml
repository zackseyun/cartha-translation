  text: כִּ֥י יִהְיוּ ל֖/וֹ לַ/עֲבָדִ֑ים וְ/יֵדְעוּ֙ עֲב֣וֹדָתִ֔/י וַ/עֲבוֹדַ֖ת מַמְלְכ֥וֹת הָ/אֲרָצֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/008.yaml
  text: For they will become his servants[a], so that they may know my service and the service of the kingdoms of the lands.
translation:
  language: hi
  text: क्योंकि वे उसके दास हो जाएँगे, ताकि वे मेरी सेवा[a] और देश-देश के राज्यों की सेवा को जानें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी उपासना ... और देश-देश के राज्यों की सेवा।” ‘सेवा’ के लिए प्रयुक्त इब्रानी शब्द में उपासना-रूपी सेवा के साथ-साथ दासता या श्रम का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में परमेश्वर की कार्रवाई का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִהְיוּ לוֹ לַעֲבָדִים
  choice: वे उसके दास हो जाएँगे
  rationale: היה के साथ ל का यह प्रयोग किसी अवस्था में आ जाने को दर्शाता है। ‘दास’ यहाँ शिशक के अधीन राजनीतिक पराधीनता को व्यक्त करता है और हिन्दी में सेवक तथा पराधीन व्यक्ति—दोनों अर्थों की छाया रखता है।
- source_word: וְיֵדְעוּ
  choice: ताकि वे ... जानें
  rationale: संदर्भ में वाव सहित अपूर्ण क्रिया पहले कथन के उद्देश्य या परिणाम को व्यक्त कर सकती है। ‘जानें’ मूल क्रिया ידע को बनाए रखते हुए अनुभव से सीखने का भाव भी आने देता है।
- source_word: עֲבוֹדָתִי
  choice: मेरी सेवा
  rationale: עֲבוֹדָה सेवा, श्रम और उपासना-संबंधी सेवा को व्यक्त कर सकता है। ‘सेवा’ धार्मिक निष्ठा और अधीनता दोनों को समेटती है तथा जानबूझकर रखी गई अर्थगत व्यापकता को सुरक्षित रखती है।
- source_word: וַעֲבוֹדַת
  choice: और ... की सेवा
  rationale: पहले עֲבוֹדָה के साथ शब्दगत समानता बनाए रखने से परमेश्वर की सेवा और सांसारिक राज्यों की सेवा के बीच मूल समानांतरता स्पष्ट रहती है।
- source_word: מַמְלְכוֹת הָאֲרָצוֹת
  choice: देश-देश के राज्य
  rationale: यह बहुवचन ‘देशों/भूमियों के राज्यों’ का स्वाभाविक हिन्दी रूप है और अनेक विदेशी राजनीतिक शक्तियों की ओर संकेत करता है; ‘पृथ्वी के राज्य’ यहाँ अनावश्यक रूप से सार्वभौमिक सुनाई देता।
theological_decisions:
- issue: परमेश्वर के संबंध में עֲבוֹדָה को केवल ‘उपासना’ कहा जाए या व्यापक ‘सेवा’
  choice: सेवा
  alternative: उपासना; मेरी सेवा करना
  rationale: पद में यहोवा के प्रति निष्ठापूर्ण सेवा और विदेशी राज्यों के अधीन रहने की सेवा आमने-सामने रखी गई हैं। ‘सेवा’ धार्मिक और राजनीतिक दोनों आयामों को बनाए रखती है और समानांतर शब्दावली को संकीर्ण नहीं करती।
- issue: विदेशी शासक के अधीन עֲבָדִים का सामाजिक-राजनीतिक बल
  choice: दास
  alternative: सेवक
  rationale: संदर्भ में शिशक के अधीन पराधीनता मुख्य है। हिन्दी ‘दास’ उस कठोर अधीनता को व्यक्त करता है, फिर भी इसी धातु से बनी ‘सेवा’ के साथ मूल का शब्दगत संबंध सुनाई देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य रखा गया है। ‘देश-देश के राज्य’ शाब्दिक बहुवचन को सहज बनाता है। ‘सेवा’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है, ताकि मूल का विरोध और अर्थगत तनाव बना रहे।
