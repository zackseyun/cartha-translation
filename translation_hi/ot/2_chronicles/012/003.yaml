reference: 2 Chronicles 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/אֶ֤לֶף וּ/מָאתַ֨יִם֙ רֶ֔כֶב וּ/בְ/שִׁשִּׁ֥ים אֶ֖לֶף פָּרָשִׁ֑ים וְ/אֵ֣ין מִסְפָּ֗ר לָ/עָ֞ם אֲשֶׁר בָּ֤אוּ עִמּ/וֹ֙ מִ/מִּצְרַ֔יִם לוּבִ֥ים סֻכִּיִּ֖ים וְ/כוּשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/012/003.yaml
  text: 'with 1,200 chariots and 60,000 horsemen[a], and the people who came with him from Egypt were without number: Libyans, Sukkites[c][b], and Cushites.'
translation:
  language: hi
  text: वह 1,200 रथों और 60,000 घुड़सवारों के साथ आया। उसके साथ मिस्र से आए लोगों की कोई गिनती न थी[a]—लूबी, सुक्की[b] और कूशी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लोगों की कोई संख्या न थी”; अर्थात वे अनगिनत थे।
    reason: lexical_alternative
  - marker: b
    text: “सुक्की” एक जाति का नाम है जिसकी सटीक पहचान निश्चित नहीं है; इसे “सुक्कीम” भी लिखा जाता है।
    reason: cultural_note
  - marker: c
    text: “कूशी” इब्रानी के प्राचीन जातीय-भौगोलिक नाम “कूश” से बना है; कुछ अनुवादों में “इथियोपियाई” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶלֶף וּמָאתַיִם רֶכֶב
  choice: 1,200 रथों के साथ
  rationale: संख्या के साथ लगा ב सैन्य साधनों की संगति या उपलब्धता दर्शाता है; רֶכֶב को इस गणना में स्वाभाविक रूप से ‘रथ’ कहा गया है।
- source_word: וּבְשִׁשִּׁים אֶלֶף פָּרָשִׁים
  choice: और 60,000 घुड़सवारों
  rationale: פָּרָשִׁים युद्ध में घोड़ों पर सवार सैनिकों को दर्शाता है; ‘घुड़सवार’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: וְאֵין מִסְפָּר לָעָם
  choice: लोगों की कोई गिनती न थी
  rationale: यह चयन इब्रानी मुहावरे की ठोस शब्दावली और अगणनीय विशाल संख्या—दोनों को बनाए रखता है; עָם को अधिक विशिष्ट ‘सेना’ बनाने के बजाय ‘लोग’ रखा गया है।
- source_word: אֲשֶׁר בָּאוּ עִמּוֹ מִמִּצְרַיִם
  choice: उसके साथ मिस्र से आए
  rationale: सम्बन्धवाचक उपवाक्य साथ आने वाले लोगों और उनके प्रस्थान-स्थान को सीधे व्यक्त करता है।
- source_word: לוּבִים
  choice: लूबी
  rationale: यह जाति-सूचक नाम हिन्दी बाइबलीय नाम-परंपरा के अनुरूप लिप्यंतरित है और इसे आधुनिक राजनीतिक भूगोल से अनावश्यक रूप से नहीं बाँधता।
- source_word: סֻכִּיִּים
  choice: सुक्की
  rationale: समूह की सटीक पहचान अनिश्चित है; इसलिए व्याख्यात्मक पहचान के बजाय निकट लिप्यंतरण रखा गया है।
- source_word: כּוּשִׁים
  choice: कूशी
  rationale: यह इब्रानी जातीय-भौगोलिक पद כּוּשׁ को सीधे दर्शाता है और ‘इथियोपियाई’ जैसे संभावित काल-विसंगत आधुनिक भूगोल से बचता है।
