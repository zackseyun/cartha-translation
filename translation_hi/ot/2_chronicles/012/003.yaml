translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ऐतिहासिक-वृत्तांत शैली-रजिस्टर अपनाया गया है। पूर्वपद से निहित कर्ता को हिन्दी में स्पष्ट करने के लिए ‘वह ... आया’ रखा गया है। जाति-नामों में मूल पाठ की ऐतिहासिक अनिश्चितता सुरक्षित रखी गई है।
