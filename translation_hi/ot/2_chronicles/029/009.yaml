source:
  edition: WLC
  text: וְ/הִנֵּ֛ה נָפְל֥וּ אֲבוֹתֵ֖י/נוּ בֶּ/חָ֑רֶב וּ/בָנֵ֨י/נוּ וּ/בְנוֹתֵ֧י/נוּ וְ/נָשֵׁ֛י/נוּ בַּ/שְּׁבִ֖י עַל זֹֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/009.yaml
  text: And behold[a], our fathers have fallen by the sword[b], and our sons and our daughters and our wives are in captivity because of this.
translation:
  language: hi
  text: और देखो[a], हमारे पिता तलवार से मारे गए हैं, और हमारे बेटे, बेटियाँ और पत्नियाँ इस कारण बंदी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ध्यान दो।” इब्रानी का यह कथन-सूचक आगे कही जाने वाली बात की ओर ज़ोर देकर ध्यान खींचता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान खींचने वाला ज़ोरदार कथन-सूचक है। ‘और देखो’ संयोजक और उसके बल—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: נָפְלוּ
  choice: मारे गए हैं
  rationale: मूल अर्थ ‘गिरना’ है, पर तलवार के प्रसंग में यह युद्ध में मारे जाने का रूढ़ प्रयोग है। हिन्दी में ‘तलवार से गिर पड़े’ अस्पष्ट या अस्वाभाविक हो सकता है, इसलिए प्रसंगगत अर्थ स्पष्ट किया गया है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखे
  rationale: यह पूर्व पीढ़ी के पुरुषों को सूचित करता है। ‘पुरखे’ आधुनिक हिन्दी में ‘पिताओं’ की अपेक्षा अधिक स्वाभाविक है और इसे सामान्य, लिंग-निरपेक्ष ‘पूर्वजों’ में नहीं बदलता।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: यह युद्ध में हिंसक मृत्यु का इब्रानी मुहावरा है; हिन्दी में ‘तलवार से मारे गए’ उसका स्पष्ट और गंभीर समतुल्य है।
- source_word: וּבָנֵינוּ וּבְנוֹתֵינוּ
  choice: हमारे बेटे, बेटियाँ
  rationale: मूल पाठ पुत्रों और पुत्रियों को अलग-अलग गिनाता है; उसी भेद को बनाए रखा गया है।
- source_word: וְנָשֵׁינוּ
  choice: हमारी पत्नियाँ
  rationale: अधिकारसूचक पारिवारिक सूची में נָשִׁים का प्रसंगानुकूल अर्थ ‘पत्नियाँ’ है।
- source_word: בַּשְּׁבִי
  choice: बंदी हैं
  rationale: संज्ञात्मक इब्रानी अभिव्यक्ति का अर्थ बंदी दशा में होना है। ‘बंदी हैं’ संक्षिप्त, स्वाभाविक और अर्थपूर्ण हिन्दी है।
- source_word: עַל זֹאת
  choice: इस कारण
  rationale: यह पहले वर्णित अविश्वासयोग्यता और उसके परिणाम की ओर कारणसूचक ढंग से संकेत करता है।
theological_decisions:
- issue: न्याय के प्रसंग में लिंग-विशिष्ट पारिवारिक शब्द
  choice: पुरखे ... बेटे, बेटियाँ और पत्नियाँ
  alternative: पूर्वज ... बच्चे और स्त्रियाँ
  rationale: इब्रानी पाठ परिवार के विशिष्ट समूहों को जानबूझकर अलग-अलग गिनाता है; अनुवाद उन भेदों को सामान्य सामूहिक शब्दों में विलीन नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मारे गए हैं’ ने तलवार के प्रसंग में इब्रानी मुहावरे का आशय स्वाभाविक हिन्दी में व्यक्त किया है; पारिवारिक सूची के लिंग-विशिष्ट भेद सुरक्षित रखे गए हैं।
