  text: וַ/יַּֽאַסְפ֤וּ אֶת אֲחֵי/הֶם֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבֹ֥אוּ כְ/מִצְוַת הַ/מֶּ֖לֶךְ בְּ/דִבְרֵ֣י יְהוָ֑ה לְ/טַהֵ֖ר בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/015.yaml
  text: They gathered their brothers[a], consecrated themselves, and came, according to the command of the king by the words of Yahweh[c][b], to cleanse the house of Yahweh.
translation:
  language: hi
  text: उन्होंने अपने भाइयों को इकट्ठा किया, अपने को पवित्र किया, और राजा की आज्ञा के अनुसार, याहवे के वचनों के द्वारा, याहवे के भवन को शुद्ध करने आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּאַסְפוּ אֶת־אֲחֵיהֶם
  choice: उन्होंने अपने भाइयों को इकट्ठा किया
  rationale: इब्रानी में संबंधवाचक शब्द का शाब्दिक अर्थ ‘उनके भाई’ है; प्रसंग में ये साथी लेवी हैं, पर मूल की अभिव्यक्ति बनाए रखी गई है।
- source_word: וַיִּתְקַדְּשׁוּ
  choice: अपने आप को पवित्र किया
  rationale: हित्पएल रूप यहाँ पवित्र सेवा के लिए स्वयं को विधिपूर्वक तैयार और शुद्ध करने का भाव देता है। आधुनिक हिन्दी में यह सहज और धर्म-सांस्कृतिक संदर्भ के अनुकूल है।
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: क्रिया का सामान्य अर्थ ‘आना’ है; मूल पाठ यहाँ स्पष्ट रूप से ‘भीतर जाना’ नहीं कहता।
- source_word: כְמִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा के अनुसार
  rationale: यह राजकीय आदेश के अनुरूप कार्य करने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בְּדִבְרֵי יְהוָה
  choice: जो यहोवा के वचनों पर आधारित थी
  rationale: בְּ के संबंध और דִבְרֵי के बहुवचन को ध्यान में रखते हुए यह समझ व्यक्त होती है कि राजा की आज्ञा यहोवा के वचनों पर आधारित थी; संबंध की व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित लिप्यंतरण ‘यहोवा’ है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: לְטַהֵר
  choice: शुद्ध करने
  rationale: पिएल रूप मंदिर के विधिक शुद्धीकरण को दर्शाता है; ‘शुद्ध करना’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: शाब्दिक ‘यहोवा का घर/भवन’ में से ‘भवन’ गरिमापूर्ण और स्वाभाविक है तथा मंदिर का आशय सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिन्दी बाइबिलीय प्रयोग में ‘यहोवा’ अधिक व्यापक रूप से पहचाना जाता है, यद्यपि ‘याहवे’ मूल उच्चारण का एक प्रचलित विद्वत्तापूर्ण पुनर्निर्माण है।
- issue: בְּדִבְרֵי יְהוָה का राजा की आज्ञा से संबंध
  choice: राजा की आज्ञा यहोवा के वचनों पर आधारित थी
  alternative: वे यहोवा के वचनों के अनुसार आए
  rationale: शब्दक्रम इस पदबंध को निकटवर्ती ‘राजा की आज्ञा’ से जोड़ने का समर्थन करता है, पर वाक्यरचना दूसरी संबद्धता की संभावना पूर्णतः समाप्त नहीं करती; इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: אֲחֵיהֶם का लैंगिक और प्रसंगगत अर्थ
  choice: अपने भाइयों
  alternative: अपने साथी लेवियों
  rationale: मूल में पुल्लिंग बहुवचन संबंधसूचक शब्द है। प्रसंग लेवियों को स्पष्ट करता है, पर मुख्य पाठ मूल के ‘भाइयों’ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपने आप को पवित्र किया’ धार्मिक-विधिक अर्थ बनाए रखता है। मुख्य वाक्य में डैश से जटिल इब्रानी संबंध स्पष्ट किया गया है, जबकि वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
