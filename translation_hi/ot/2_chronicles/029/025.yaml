base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/025.yaml
  text: He stationed the Levites in the house of Yahweh with cymbals[a], harps, and lyres, according to the command of David and of Gad the king’s seer and Nathan the prophet[b], for the command was from Yahweh through his prophets.
translation:
  language: hi
  text: उसने लेवियों को यहोवा के भवन में झाँझों, तारवाद्यों[a] और किन्नोरों[a] के साथ तैनात किया। यह दाऊद, राजा के दर्शी गाद और नातान नबी की आज्ञा के अनुसार था, क्योंकि यह आज्ञा यहोवा की ओर से उसके नबियों के द्वारा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तारवाद्य” और “किन्नोर” क्रमशः इब्रानी नॆवेल और किन्नोर के लिए हैं। ये दो अलग प्राचीन तारवाद्य थे, पर उनकी ठीक आधुनिक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: नियुक्त स्थानों पर खड़ा किया
  rationale: हिफ़ील रूप केवल खड़ा करने या रखने से अधिक, उपासना-सेवा के लिए नियत स्थान पर तैनात करने का भाव देता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन में
  rationale: इब्रानी के औपचारिक पदबंध ‘यहोवा का भवन’ को बनाए रखता है; ‘मन्दिर’ अर्थतः संभव है, पर स्रोत की अभिव्यक्ति से कम निकट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को व्यक्त करता है, न कि उसे केवल ‘प्रभु’ उपाधि से बदलता है।
- source_word: בִּמְצִלְתַּיִם
  choice: झाँझों
  rationale: वाद्य के लिए मानक और सहज हिन्दी शब्द।
- source_word: בִּנְבָלִים
  choice: सारंगियों
  rationale: נבל एक तारवाला वाद्य था जिसकी ठीक आधुनिक पहचान अनिश्चित है; हिन्दी में एक परिचित भिन्न तारवाद्य-नाम चुना गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: וּבְכִנֹּרוֹת
  choice: और वीणाओं
  rationale: כִּנּוֹר के लिए स्वाभाविक हिन्दी बाइबलीय वाद्य-शब्द; इसे נבל से अलग रखा गया है।
- source_word: גָּד חֹזֵה הַמֶּלֶךְ
  choice: राजा के दर्शी गाद
  rationale: חֹזֶה को ‘दर्शी’ कहने से उसके निकट-संबंधित, पर נָבִיא से अलग, पदनाम का भेद बना रहता है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान नबी
  rationale: सरल पदनाम का प्रत्यक्ष और प्रचलित हिन्दी अनुवाद।
- source_word: בְיַד יְהוָה ... בְיַד נְבִיאָיו
  choice: यहोवा की ओर से उसके नबियों के द्वारा
  rationale: ‘हाथ से’ की इब्रानी पुनरुक्ति को स्वाभाविक हिन्दी में मूल स्रोत और नबियों की मध्यस्थता—दोनों स्पष्ट करते हुए व्यक्त करता है।
theological_decisions:
- issue: दाऊद द्वारा स्थापित उपासना-व्यवस्था और परमेश्वर की आज्ञा का संबंध
  choice: वाद्य-संगीत की व्यवस्था दाऊद, गाद और नातान की आज्ञा के अनुसार थी, पर उसका अंतिम स्रोत यहोवा था और वह नबियों के द्वारा दी गई थी।
  alternative: इसे केवल दाऊद की राजकीय नीति मानना, जिसे बाद में दैवी स्वीकृति दी गई।
  rationale: כִּי בְיַד יְהוָה הַמִּצְוָה בְּיַד נְבִיאָיו स्पष्टतः आज्ञा का स्रोत यहोवा और उसका माध्यम उसके नबियों को बताता है; अनुवाद मानवीय और दैवी अभिकरण दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘दर्शी’ और ‘नबी’ का स्रोतगत भेद सुरक्षित रखा गया है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उचित स्थान पर दिया गया है।
