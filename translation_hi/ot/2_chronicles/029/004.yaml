  text: Then he brought in the priests and the Levites and assembled them in the eastern square[a].
translation:
  language: hi
  text: तब वह याजकों और लेवियों को ले आया और उन्हें पूर्वी चौक में इकट्ठा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: तब उसने ... बुलवाया
  rationale: हिफ़ील रूप का अर्थ किसी को आने के लिए बुलाना या ले आना है। प्रसंग में राजा द्वारा याजकों और लेवियों को एक स्थान पर बुलवाना स्वाभाविक है; ‘तब’ कथानक की क्रमिक प्रगति व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: כהנים के लिए मानक और प्रचलित हिन्दी बाइबलीय पद।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: לוים का मानक रूपांतरण, जो याजकों से अलग लेवीय सेवकों को दर्शाता है।
- source_word: וַיַּאַסְפֵם
  choice: उन्हें ... इकट्ठा किया
  rationale: אסף के अर्थ ‘इकट्ठा करना/एकत्र करना’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִרְחוֹב
  choice: चौक में
  rationale: רחוב यहाँ किसी चौड़ी खुली सार्वजनिक जगह या प्रांगण को सूचित करता है; आधुनिक हिन्दी में ‘चौक’ संक्षिप्त और स्वाभाविक है।
- source_word: הַמִּזְרָח
  choice: पूर्वी
  rationale: מזרח का विशेषणात्मक अर्थ ‘पूर्वी’ है और यह चौक की स्थिति या पहचान बताता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘बुलवाया’ राजकीय पहल और हिफ़ील की कारकता को स्वाभाविक ढंग से व्यक्त करता है; ‘पूर्वी चौक’ मूल की संक्षिप्त संरचना और संभावित स्थान-संबंधी अस्पष्टता को बनाए रखता है।
