    reason: ईश्वरीय नाम की पहचान स्पष्ट करना।
  revision_rationale: Revision removes redundant wording, restores the explicit ‘went up’ nuance of the Hebrew, and clarifies the explanatory footnote while retaining the draft’s appropriate rendering of the divine name and civic officials.
