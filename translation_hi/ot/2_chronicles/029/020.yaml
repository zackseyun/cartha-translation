id: 2CH.29.20
reference: 2 Chronicles 29:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּם֙ יְחִזְקִיָּ֣הוּ הַ/מֶּ֔לֶךְ וַ/יֶּאֱסֹ֕ף אֵ֖ת שָׂרֵ֣י הָ/עִ֑יר וַ/יַּ֖עַל בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/020.yaml
  text: Then King Hezekiah rose early[a], gathered the officials of the city, and went up to the house of Yahweh.
translation:
  language: hi
  text: तब राजा हिजकिय्याह भोर में उठा, नगर के अधिकारियों को इकट्ठा किया, और याहवे[a] के भवन की ओर ऊपर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी ईश्वरीय नाम יהוה का लिप्यन्तरण है।
    reason: ईश्वरीय नाम की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: सवेरे जल्दी उठा
  rationale: हिफ़ील रूप यहाँ दिन में बहुत जल्दी उठने या काम आरम्भ करने का भाव देता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और समय-संबंधी अर्थ को स्पष्ट रखती है।
- source_word: יְחִזְקִיָּהוּ הַמֶּלֶךְ
  choice: राजा हिजकिय्याह
  rationale: हिन्दी की स्वाभाविक पद-व्यवस्था के अनुसार राजकीय उपाधि को नाम से पहले रखा गया है।
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: संदर्भ में क्रिया का अर्थ लोगों को एक स्थान पर एकत्र करना है; यह सामान्य पाठकों के लिए स्पष्ट और स्वाभाविक है।
- source_word: שָׂרֵי הָעִיר
  choice: नगर के अधिकारियों
  rationale: שָׂרִים यहाँ नगर के प्रशासनिक अगुओं या पदाधिकारियों को दर्शाता है। ‘अधिकारी’ वंशानुगत राजकुमार होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וַיַּעַל
  choice: गया
  rationale: मूल क्रिया में ‘ऊपर जाने’ का भाव है, विशेषतः मन्दिर की ओर जाने के लिए। किन्तु ‘भवन में चढ़ गया’ आधुनिक हिन्दी में भ्रामक या अस्वाभाविक हो सकता है, इसलिए गन्तव्य के साथ स्वाभाविक ‘गया’ चुना गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: ‘भवन’ मूल ‘घर’ की उपमा को बनाए रखता है, जबकि याहवे चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का निकट हिन्दी लिप्यन्तरण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है; पाठक की सहायता के लिए पादटिप्पणी दी गई है।
- issue: בֵּית יְהוָה की अभिव्यक्ति
  choice: याहवे का भवन
  alternative: याहवे का मन्दिर
  rationale: ‘भवन’ मूल रूपक को सुरक्षित रखता है। ‘मन्दिर’ संदर्भगत अर्थ स्पष्ट कर सकता है, पर मूल की शाब्दिक अभिव्यक्ति को समतल कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की क्रमिक क्रियाओं को स्पष्ट हिन्दी वाक्य-विन्यास में प्रस्तुत किया गया है। ‘नगर’ और ‘भवन’ औपचारिकता बनाए रखते हैं, जबकि ‘इकट्ठा किया’ सामान्य पाठकों के लिए स्वाभाविक है।
