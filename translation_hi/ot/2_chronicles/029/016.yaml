revisions:
- from: तब याजक शुद्ध करने के लिए यहोवा के भवन के भीतरी भाग में गए। यहोवा के मन्दिर में उन्हें जो भी अशुद्ध वस्तु मिली, उसे वे निकालकर यहोवा के भवन के आँगन में ले आए। फिर लेवियों ने उसे वहाँ से उठाकर बाहर किद्रोन नाले तक पहुँचाया।
  to: तब याजक उसे शुद्ध करने के लिए यहोवा के भवन के भीतर गए। यहोवा के मन्दिर में जो सारी अशुद्धता उन्हें मिली, उसे वे निकालकर यहोवा के भवन के आँगन में ले आए। फिर लेवियों ने उसे लिया, ताकि उसे बाहर किद्रोन की घाटी में ले जाएँ।
  rationale: The revision retains the draft’s clear modern-Hindi register and its distinction between the house, inner temple area, and court. It restores the Hebrew’s collective wording for impurity, represents the Levites’ receiving action without adding “from there,” and renders the final purpose clause directly. No footnote is needed because the wording does not require explanation beyond the text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:07:14Z'
review_pass:
  verdict: revise
  source_fidelity: The sequence and principal locations are correctly represented. However, the Hebrew says that the Levites “received” the uncleanness for the purpose of taking it outside to the Kidron wadi/valley; “वहाँ से उठाकर” adds a locational detail not expressed in the source. Rendering כָּל־הַטֻּמְאָה as “जो भी अशुद्ध वस्तु” unnecessarily narrows the Hebrew collective/abstract expression.
  naturalness: The draft is generally fluent modern Hindi, but “बाहर किद्रोन नाले तक पहुँचाया” is somewhat awkward and less directly reflects the purpose construction. The revision is idiomatic while preserving the narrative sequence.
  terminology: “यहोवा,” “भवन,” “मन्दिर,” “आँगन,” and “लेवी” are suitable and consistently distinguish the Hebrew terms. “किद्रोन की घाटी” appropriately renders the named נחל in this context without overcommitting to a modern hydrological classification.
  issues:
  - severity: medium
    issue: “जो भी अशुद्ध वस्तु” narrows כָּל הַטֻּמְאָה.
    rationale: The Hebrew literally denotes “all the uncleanness/impurity.” Although the context involves removal of contaminating material, “वस्तु” specifies individual objects beyond what the wording explicitly states.
  - severity: low
    issue: “वहाँ से उठाकर” adds an unexpressed locational detail and obscures the verb “received.”
    rationale: The Levites are said to receive it in order to take it outside to the Kidron; the source does not say “from there” or use a verb specifically meaning “lifted.”
  revised_text: तब याजक उसे शुद्ध करने के लिए यहोवा के भवन के भीतर गए। यहोवा के मन्दिर में जो सारी अशुद्धता उन्हें मिली, उसे वे निकालकर यहोवा के भवन के आँगन में ले आए। फिर लेवियों ने उसे लिया, ताकि उसे बाहर किद्रोन की घाटी में ले जाएँ।
  revised_footnotes: []
  revision_rationale: The revision retains the draft’s clear modern-Hindi register and its distinction between the house, inner temple area, and court. It restores the Hebrew’s collective wording for impurity, represents the Levites’ receiving action without adding “from there,” and renders the final purpose clause directly. No footnote is needed because the wording does not require explanation beyond the text.
