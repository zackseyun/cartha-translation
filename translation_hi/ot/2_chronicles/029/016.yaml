language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ הַ֠/כֹּהֲנִים לִ/פְנִ֣ימָה בֵית יְהוָה֮ לְ/טַהֵר֒ וַ/יּוֹצִ֗יאוּ אֵ֤ת כָּל הַ/טֻּמְאָה֙ אֲשֶׁ֤ר מָֽצְאוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה לַ/חֲצַ֖ר בֵּ֣ית יְהוָ֑ה וַֽ/יְקַבְּלוּ֙ הַ/לְוִיִּ֔ם לְ/הוֹצִ֥יא לְ/נַֽחַל קִדְר֖וֹן חֽוּצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/016.yaml
  text: Then the priests went into the inner part of the house of the LORD to cleanse it, and they brought out to the court of the house of the LORD all the uncleanness that they found in the temple of the LORD. Then the Levites received it to carry it outside to the Kidron Valley.
translation:
  language: hi
  text: तब याजक उसे शुद्ध करने के लिए यहोवा के भवन के भीतर गए। यहोवा के मन्दिर में जो सारी अशुद्धता उन्हें मिली, उसे वे निकालकर यहोवा के भवन के आँगन में ले आए। फिर लेवियों ने उसे लिया, ताकि उसे बाहर किद्रोन की घाटी में ले जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנִימָה בֵית יְהוָה
  choice: यहोवा के भवन के भीतरी भाग में
  rationale: לִפְנִימָה स्थान की भीतरी दिशा या भाग को सूचित करता है; यह अनुवाद मूल की स्थानिक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: לְטַהֵר
  choice: शुद्ध करने के लिए
  rationale: पिएल रूप यहाँ भवन को धार्मिक-अनुष्ठानिक अशुद्धता से शुद्ध करने का उद्देश्य व्यक्त करता है।
- source_word: כָּל הַטֻּמְאָה
  choice: जो भी अशुद्ध वस्तु
  rationale: संज्ञा का अर्थ अशुद्धता भी हो सकता है, पर उसे निकालकर ले जाने की क्रियाएँ यहाँ अशुद्ध या अपवित्र सामग्री की ओर संकेत करती हैं।
- source_word: בְּהֵיכַל יְהוָה
  choice: यहोवा के मन्दिर में
  rationale: הֵיכָל भवन के मन्दिर/पवित्र भवन वाले भाग को दर्शाता है; हिन्दी में 'मन्दिर' सहज और प्रसंगानुकूल है।
- source_word: לְנַחַל קִדְרוֹן חוּצָה
  choice: बाहर किद्रोन नाले तक
  rationale: נַחַל मौसमी जलधारा, नाला या घाटी का बोध दे सकता है; 'नाला' भौगोलिक विशेषता को सीधे व्यक्त करता है, और חוּצָה बाहर ले जाने पर बल देता है।
theological_decisions:
- issue: दैवी नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: हिब्रू पाठ में व्यक्तिगत वाचा-नाम स्पष्ट है; 'यहोवा' हिन्दी पाठक के लिए पहचाना हुआ रूप है और नाम तथा उपाधि का भेद बनाए रखता है।
- issue: הַטֻּמְאָה का मूर्त या अमूर्त अर्थ
  choice: अशुद्ध वस्तु
  alternative: अशुद्धता
  rationale: मूल शब्द दोनों अर्थों की गुंजाइश रखता है, किंतु बाहर निकालने, ग्रहण करने और ढोने की क्रमिक क्रियाएँ यहाँ मूर्त सामग्री को प्रमुख बनाती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। 'भवन', 'मन्दिर' और 'आँगन' के द्वारा मूल के स्थानगत भेद को यथासंभव बनाए रखा गया है; अनावश्यक व्याख्या नहीं जोड़ी गई।
