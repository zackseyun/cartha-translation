source:
  edition: WLC
  text: עַתָּה֙ עִם לְבָבִ֔/י לִ/כְר֣וֹת בְּרִ֔ית לַ/יהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְ/יָשֹׁ֥ב מִמֶּ֖/נּוּ חֲר֥וֹן אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/010.yaml
  text: Now it is in my heart to make a covenant with Yahweh[a], the God of Israel, so that his burning anger may turn away from us.
translation:
  language: hi
  text: अब मेरे मन में है कि मैं इस्राएल के परमेश्वर यहोवा के साथ वाचा बाँधूँ[a], ताकि उसका धधकता क्रोध हम पर से हट जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “वाचा काटूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समयसूचक क्रियाविशेषण हिजकिय्याह के संकल्प की तात्कालिकता दिखाता है।
- source_word: עִם לְבָבִי
  choice: मेरे मन में है
  rationale: यह इब्रानी मुहावरा भीतरी इच्छा या दृढ़ संकल्प व्यक्त करता है; हिंदी में यह स्वाभाविक रहते हुए मूल बिंब को बनाए रखता है।
- source_word: לִכְרֹת בְּרִית
  choice: वाचा बाँधूँ
  rationale: शाब्दिक अर्थ ‘वाचा काटना’ है, पर हिंदी का प्रचलित वाचागत मुहावरा ‘वाचा बाँधना’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के साथ
  rationale: लामेद यहाँ वाचा के सहभागी को सूचित करता है; हिंदी में ‘के साथ’ अपेक्षित है। परमेश्वर के निज नाम को ‘यहोवा’ रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधसूचक उपाधि राष्ट्र के परमेश्वर की पहचान कराती है।
- source_word: וְיָשֹׁב
  choice: ताकि ... हट जाए
  rationale: संदर्भ में क्रिया इच्छित परिणाम या उद्देश्य व्यक्त करती है; ‘ताकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִמֶּנּוּ
  choice: हम पर से
  rationale: प्रथम पुरुष बहुवचन प्रत्यय समुदाय को सूचित करता है; क्रोध हटने के साथ हिंदी में ‘हम पर से’ स्वाभाविक है।
- source_word: חֲרוֹן אַפּוֹ
  choice: उसका धधकता क्रोध
  rationale: यह पदबंध क्रोध की तीव्र गर्मी का रूपक रखता है; ‘धधकता क्रोध’ उसकी तीव्रता और बिंब दोनों को संप्रेषित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय निज नाम है। हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि से बदलने के बजाय प्रत्यक्ष रूप में रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: וְיָשֹׁב का प्रयोजन अथवा परिणाम
  choice: ताकि ... हट जाए
  alternative: और ... हट जाएगा
  rationale: वाक्य-संदर्भ हिजकिय्याह की वाचा बाँधने की मंशा के साथ इच्छित परिणाम जोड़ता है; निश्चयात्मक भविष्य कथन करने के बजाय मूल की प्रयोजनात्मक/संभावनात्मक सूक्ष्मता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। ‘मेरे मन में है’ मूल हृदय-बिंब का स्वाभाविक हिंदी रूप है; ‘वाचा बाँधना’ परिचित धार्मिक मुहावरा है।
