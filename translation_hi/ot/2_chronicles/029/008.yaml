base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/008.yaml
  text: So the wrath of Yahweh came upon Judah and Jerusalem[a], and he made them a horror, a desolation, and an object of hissing[b], as you see with your own eyes.
translation:
  language: hi
  text: इसलिए यहूदा और यरूशलेम पर यहोवा का प्रकोप भड़का, और उसने उन्हें भय का कारण, उजाड़, और उपहास में सीटी बजाने का विषय[a] बना दिया, जैसा कि तुम अपनी आँखों से देख रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सीटी बजाने के लिए”; यहाँ उजाड़ देखकर दर्शकों के तिरस्कारपूर्ण ढंग से सीटी बजाने की प्रतिक्रिया अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶצֶף
  choice: प्रकोप
  rationale: यह शब्द न्याय में प्रकट होने वाले तीव्र ईश्वरीय क्रोध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में परिचित रूप रखते हुए व्यक्तिगत ईश्वरीय नाम को सामान्य पदवी से अलग बनाए रखता है।
- source_word: וַיְהִי ... עַל
  choice: पर ... प्रकोप भड़का
  rationale: यह मुहावरा क्रोध के आरम्भ होकर उन पर आने को दर्शाता है; यह हिन्दी में स्वाभाविक ढंग से उसकी तीव्रता भी बनाए रखता है।
- source_word: וַיִּתְּנֵם
  choice: उसने उन्हें ... का विषय बना दिया
  rationale: נתן के साथ ל परिणामस्वरूप बनी सार्वजनिक दशा को व्यक्त करता है; यह रूप कर्ता और परिणाम दोनों को स्पष्ट रखता है।
- source_word: לְזוֹעָה
  choice: दहशत
  rationale: दुर्लभ इब्रानी संज्ञा काँपने या भयावह दृश्य का भाव रखती है; 'दहशत' इस प्रभाव को संक्षेप में व्यक्त करती है।
- source_word: לְשַׁמָּה
  choice: उजाड़
  rationale: न्याय के फलस्वरूप विनाश और उजड़ी दशा को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְלִשְׁרֵקָה
  choice: उपहास की सीटी
  rationale: ठोस सीटी बजाने की छवि और दर्शकों की तिरस्कारपूर्ण प्रतिक्रिया, दोनों को सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר אַתֶּם רֹאִים בְּעֵינֵיכֶם
  choice: जैसा कि तुम अपनी आँखों से देख रहे हो
  rationale: मूल की प्रत्यक्ष, बलयुक्त अपील और जारी वर्तमान अनुभव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय की कठोर भाषा
  choice: यहोवा का प्रकोप भड़का ... उसने उन्हें ... का विषय बना दिया
  alternative: यहोवा उनसे क्रोधित हुआ और उसने उन्हें विनाश के लिए छोड़ दिया
  rationale: चुना गया रूप न्याय की तीव्रता और परमेश्वर की सक्रिय भूमिका को बिना नरम किए व्यक्त करता है, पर मूल से आगे कोई doctrinal व्याख्या नहीं जोड़ता।
- issue: तीन परिणामसूचक संज्ञाओं का संबंध
  choice: दहशत, उजाड़ और उपहास की सीटी का विषय
  alternative: भयावह, उजड़ा और उपहासित बना दिया
  rationale: संज्ञात्मक समानांतरता मूल की सार्वजनिक और दृष्टिगोचर न्याय-दशा को बनाए रखती है; विशेषणों में बदलने से उसका अलंकारिक बल घटता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और श्रव्य-पाठ के अनुकूल है। 'यहोवा' व्यक्तिगत ईश्वरीय नाम के रूप में रखा गया है। 'दहशत, उजाड़ और उपहास की सीटी का विषय' मूल की तीनfold समानांतर न्याय-छवि को यथासंभव सुरक्षित रखता है।
