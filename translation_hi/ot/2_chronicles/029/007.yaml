id: 2CH.29.7
reference: 2 Chronicles 29:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם סָֽגְר֞וּ דַּלְת֣וֹת הָ/אוּלָ֗ם וַ/יְכַבּוּ֙ אֶת הַ/נֵּר֔וֹת וּ/קְטֹ֖רֶת לֹ֣א הִקְטִ֑ירוּ וְ/עֹלָה֙ לֹא הֶעֱל֣וּ בַ/קֹּ֔דֶשׁ לֵ/אלֹהֵ֖י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/007.yaml
  text: They also shut the doors of the vestibule[a], put out the lamps, did not burn incense[b], and did not offer up burnt offerings in the sanctuary to the God of Israel.
translation:
  language: hi
  text: उन्होंने मन्दिर के प्रवेश-कक्ष[a] के द्वार भी बंद कर दिए, दीपक बुझा दिए, धूप नहीं जलाई, और इस्राएल के परमेश्वर के लिए पवित्रस्थान[b] में होमबलि नहीं चढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बरामदे’ अथवा ‘सामने के कक्ष’; इब्रानी शब्द אוּלָם मन्दिर के प्रवेश-भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्र स्थान’; इब्रानी शब्द मन्दिर के पवित्र क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले आरोपों में एक और बात जोड़ता है और इब्रानी के संचयी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָגְרוּ
  choice: बंद कर दिए
  rationale: द्वारों के साथ यह क्रिया आधुनिक हिन्दी में स्वाभाविक है और मूल के ‘बंद करने’ के अर्थ को स्पष्ट रखती है।
- source_word: דַּלְתוֹת הָאוּלָם
  choice: मन्दिर के प्रवेश-कक्ष के द्वार
  rationale: אוּלָם मन्दिर के सामने के प्रवेश-भाग को दर्शाता है। ‘प्रवेश-कक्ष’ सामान्य पाठक के लिए ‘ओसारा’ या ‘बरामदा’ से अधिक स्पष्ट है; ‘मन्दिर के’ को प्रसंग स्पष्ट करने के लिए जोड़ा गया है।
- source_word: וַיְכַבּוּ אֶת הַנֵּרוֹת
  choice: दीपक बुझा दिए
  rationale: यह उपासना में प्रयुक्त दीपकों को बुझाने की ठोस क्रिया को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: וּקְטֹרֶת לֹא הִקְטִירוּ
  choice: धूप नहीं जलाई
  rationale: קטר का हिफ़ील रूप यहाँ उपासना-विधि में धूप जलाने अथवा उसका धुआँ उठाने को दर्शाता है; ‘धूप नहीं जलाई’ स्पष्ट और प्रचलित है।
- source_word: וְעֹלָה לֹא הֶעֱלוּ
  choice: होमबलि नहीं चढ़ाई
  rationale: עֹלָה पूर्णतः जलाई जाने वाली बलि का पारिभाषिक शब्द है, और ‘चढ़ाई’ हिफ़ील क्रिया עלה के बलि अर्पित करने वाले अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है। इब्रानी में संज्ञा एकवचन है, इसलिए हिन्दी में भी एकवचन रखा गया है।
- source_word: בַקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यह मन्दिर के पवित्र क्षेत्र अथवा पवित्र स्थान को सूचित करता है। ‘पवित्रस्थान’ उपासना-संबंधी विशिष्टता बनाए रखता है, पर मूल से अधिक संकीर्ण निर्धारण नहीं करता।
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर के लिए
  rationale: लामेद बलि के समर्पण या उद्देश्य को व्यक्त करता है; ‘के लिए’ हिन्दी में इस समर्पण को स्वाभाविक रूप से बताता है, जबकि ‘को’ भी सम्भव है।
theological_decisions:
- issue: मन्दिर-उपासना की पारिभाषिक शब्दावली
  choice: दीपक, धूप, होमबलि और पवित्रस्थान जैसी ठोस उपासना-संबंधी भाषा को बनाए रखा गया है।
  alternative: इसे सामान्य बनाकर ‘उपासना नहीं की’ या ‘भेंट नहीं चढ़ाई’ कहना।
  rationale: पद सामान्य अधार्मिकता नहीं, बल्कि मन्दिर-सेवा के निश्चित कर्तव्यों की उपेक्षा गिनाता है। विशिष्ट शब्दावली ऐतिहासिक और धर्मवैचारिक तनाव को सुरक्षित रखती है।
- issue: לֵאלֹהֵי יִשְׂרָאֵל में लामेद का सम्बन्ध
  choice: ‘इस्राएल के परमेश्वर के लिए’—इसे होमबलि के समर्पण के रूप में व्यक्त किया गया है।
  alternative: ‘इस्राएल के परमेश्वर को’ होमबलि चढ़ाई।
  rationale: दोनों हिन्दी रूप मूल के लक्ष्य/समर्पण को व्यक्त कर सकते हैं। ‘के लिए’ उद्देश्य और समर्पण को स्पष्ट रखता है, बिना किसी अतिरिक्त धर्मवैचारिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली अपनाई गई है। ‘मन्दिर’ प्रसंग को स्पष्ट करने के लिए निहित रूप से जोड़ा गया है। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘incense’ के बाद था, पर उसकी टिप्पणी בַקֹּדֶשׁ से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [b] ‘पवित्रस्थान’ के बाद रखा गया है।
