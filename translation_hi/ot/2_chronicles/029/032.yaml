  text: וַ/יְהִ֞י מִסְפַּ֣ר הָ/עֹלָה֮ אֲשֶׁ֣ר הֵבִ֣יאוּ הַ/קָּהָל֒ בָּקָ֣ר שִׁבְעִ֔ים אֵילִ֥ים מֵאָ֖ה כְּבָשִׂ֣ים מָאתָ֑יִם לְ/עֹלָ֥ה לַ/יהוָ֖ה כָּל אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/032.yaml
  text: And the number of the burnt offerings that the assembly brought was seventy cattle, one hundred rams, and two hundred lambs; all these were for a burnt offering to the LORD.
translation:
  language: hi
  text: 'और सभा जिन होमबलियों को लाई थी, उनकी संख्या यह थी: सत्तर गाय-बैल, एक सौ मेढ़े और दो सौ मेमने। ये सभी यहोवा के लिए होमबलि थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלָה / לְעֹלָה
  choice: होमबलियाँ / होमबलि
  rationale: यह उस बलिदान का प्रचलित और अर्थपूर्ण हिन्दी पद है जिसे वेदी पर पूर्णतः जलाया जाता था; पहली बार सामूहिक भेंटों के लिए बहुवचन और बाद में विधा के रूप में एकवचन रखा गया है।
- source_word: הַקָּהָל
  choice: सभा
  rationale: यह एकत्र उपासक-समुदाय को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: इब्रानी सामूहिक संज्ञा गोवंश को सूचित करती है और यहाँ केवल नर पशुओं को निश्चित नहीं करती; इसलिए 'बैल' मात्र कहकर अर्थ को संकीर्ण नहीं किया गया।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: यह वयस्क नर भेड़ों के लिए सटीक आधुनिक हिन्दी शब्द है।
- source_word: כְּבָשִׂים
  choice: मेमने
  rationale: यह युवा भेड़ों के लिए सामान्य और सहज हिन्दी पद है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले रूप 'यहोवा' में प्रस्तुत किया गया है।
theological_decisions:
- issue: בָּקָר का लिंग और पशु-वर्ग
  choice: गाय-बैल
  alternative: बैल
  rationale: मूल शब्द सामान्यतः गोवंश की सामूहिक श्रेणी बताता है; पद स्वयं सभी पशुओं को नर घोषित नहीं करता, इसलिए व्यापक अर्थ सुरक्षित रखा गया है।
- issue: दिव्य नाम יהוה का प्रस्तुतीकरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि व्यक्तिगत नाम है; उसे स्पष्ट रूप में रखना स्रोत-पाठ के अधिक निकट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। सूची को स्पष्ट करने के लिए द्विबिंदु और दो वाक्यों का प्रयोग किया गया है; मूल की संख्या और बलिदानी शब्दावली अक्षुण्ण है।
