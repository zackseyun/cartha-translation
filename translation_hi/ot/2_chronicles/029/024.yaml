  yaml_path: translation/ot/2_chronicles/029/024.yaml
  text: The priests slaughtered them and applied their blood to the altar to make atonement for all Israel[b][a], because the king had said that the burnt offering and the sin offering were for all Israel.
translation:
  language: hi
  text: याजकों ने उनका वध किया और सारे इस्राएल के लिए प्रायश्चित करने को उनका लहू वेदी पर लगाया[a], क्योंकि राजा ने कहा था कि होमबलि और पापबलि[b] सारे इस्राएल के लिए थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके लहू से वेदी को शुद्ध किया”; यहाँ प्रयुक्त इब्रानी क्रिया शुद्धिकरण अथवा पापबलि की विधि पूरी करने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “शुद्धिकरण-बलि।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁחָטוּם
  choice: उनका वध किया
  rationale: שׁחט बलिदान के संदर्भ में पशु का विधिपूर्वक वध करने को दर्शाता है; कर्मवाचक प्रत्यय पिछले पद के बकरों की ओर संकेत करता है।
- source_word: וַיְחַטְּאוּ אֶת־דָּמָם הַמִּזְבֵּחָה
  choice: उनका लहू वेदी पर लगाया
  rationale: यह अनुवाद रक्त को वेदी पर लगाने की ठोस अनुष्ठानिक क्रिया व्यक्त करता है और חטא के हिफ़ील रूप में निहित शुद्धिकरण/पापबलि संबंधी भाव को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לְכַפֵּר עַל כָּל־יִשְׂרָאֵל
  choice: सारे इस्राएल के लिए प्रायश्चित करने को
  rationale: बलिदान-संबंधी संदर्भ में כפר के मानक धार्मिक-अनुष्ठानिक अर्थ को बनाए रखता है; עַל लाभ पाने वाले समुदाय को सूचित करता है।
- source_word: הָעוֹלָה
  choice: होमबलि
  rationale: עוֹלָה के लिए प्रचलित और संक्षिप्त हिन्दी बाइबलीय शब्द, जिसमें पूरी तरह जलाए जाने वाले बलिदान का आशय है।
- source_word: וְהַחַטָּאת
  choice: पापबलि
  rationale: बलिदान के संदर्भ में חַטָּאת का पारंपरिक और सहज अर्थ; शुद्धिकरण पर बल देने वाला विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְכָל־יִשְׂרָאֵל אָמַר הַמֶּלֶךְ
  choice: राजा ने कहा था कि ... सारे इस्राएल के लिए हों
  rationale: इब्रानी शब्दक्रम को स्वाभाविक हिन्दी में पुनर्गठित करते हुए राजा की पहले व्यक्त की गई मंशा और दोनों बलियों के व्यापक प्रतिनिधिक दायरे को स्पष्ट करता है।
theological_decisions:
- issue: חטא/חטאת से जुड़े बलिदानी और शुद्धिकरण संबंधी अर्थ
  choice: मुख्य पाठ में रक्त को वेदी पर लगाने की क्रिया और ‘पापबलि’ शब्द रखा गया है।
  alternative: ‘उनके लहू से वेदी को शुद्ध किया’ और ‘शुद्धिकरण-बलि’।
  rationale: इब्रानी मूल पाप से निपटने और अनुष्ठानिक शुद्धिकरण—दोनों से संबंधित हो सकता है। मुख्य पाठ पारंपरिक, सामान्यतः समझी जाने वाली शब्दावली रखता है, जबकि पादटिप्पणियाँ वास्तविक अर्थगत विकल्प सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘लहू’, ‘वेदी’, ‘प्रायश्चित’, ‘होमबलि’ और ‘पापबलि’ जैसे परिचित बाइबलीय शब्द अनुष्ठानिक संदर्भ की सटीकता बनाए रखते हैं।
