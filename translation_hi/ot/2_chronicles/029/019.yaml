source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/כֵּלִ֗ים אֲשֶׁ֣ר הִזְנִיחַ֩ הַ/מֶּ֨לֶךְ אָחָ֧ז בְּ/מַלְכוּת֛/וֹ בְּ/מַעֲל֖/וֹ הֵכַ֣נּוּ וְ/הִקְדָּ֑שְׁנוּ וְ/הִנָּ֕/ם לִ/פְנֵ֖י מִזְבַּ֥ח יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/019.yaml
  text: And all the vessels that King Ahaz cast aside during his reign in his unfaithfulness[a], we have prepared and consecrated; and behold[b], they are before the altar of Yahweh.
translation:
  language: hi
  text: और वे सभी पात्र, जिन्हें राजा आहाज ने अपने राज्यकाल में अपनी बेवफाई में त्याग दिया था[a], हमने तैयार किया और पवित्र किया है; और देखो, वे यहोवा की वेदी के सामने हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अलग कर दिया था’ अथवा ‘उपेक्षित छोड़ दिया था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: पात्र
  rationale: मन्दिर के प्रसंग में כֵּלִים पूजा में प्रयुक्त वस्तुओं या उपकरणों को दर्शाता है; ‘पात्र’ संक्षिप्त, स्वाभाविक और प्रचलित है।
- source_word: הִזְנִיחַ
  choice: अलग रख दिया
  rationale: यह क्रिया किसी वस्तु को त्यागकर अलग कर देने का भाव रखती है। ‘अलग रख दिया’ आहाज के सक्रिय तिरस्कार को व्यक्त करता है, जबकि केवल ‘उपेक्षा की’ अपेक्षाकृत कमजोर होगा।
- source_word: בְּמַלְכוּתוֹ
  choice: अपने राज्यकाल में
  rationale: यहाँ पूर्वसर्ग कालगत है; यह पद आहाज के शासन की अवधि बताता है।
- source_word: בְּמַעֲלוֹ
  choice: जब उसने विश्वासघात किया
  rationale: מַעַל धार्मिक और वाचागत निष्ठा भंग करने का भाव रखता है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उस गंभीर नैतिक-धार्मिक अर्थ को बनाए रखता है।
- source_word: הֵכַנּוּ
  choice: हमने तैयार किया है
  rationale: हिफ़ील रूप का अर्थ तैयार करना या उपयोग के योग्य करना है; प्रसंग में मन्दिर के पात्रों को पुनः व्यवस्थित करने का भाव है।
- source_word: וְהִקְדָּשְׁנוּ
  choice: पवित्र किया है
  rationale: हिफ़ील में קדשׁ किसी वस्तु को पवित्र उपयोग के लिए अलग करने को दर्शाता है। ‘पवित्र किया’ हिन्दी में स्पष्ट और उपासना-संबंधी प्रसंग के अनुकूल है।
- source_word: וְהִנָּם
  choice: और देखो, वे
  rationale: הִנֵּה से बना यह रूप सामने उपस्थित वस्तुओं की ओर ध्यान खींचता है; ‘देखो’ उसके संकेतात्मक बल को बनाए रखता है।
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: यहोवा की वेदी के सामने
  rationale: לִפְנֵי स्थानगत रूप से ‘के सामने’ है, और יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम है। ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: מַעַל में निहित धार्मिक निष्ठाभंग
  choice: विश्वासघात किया
  alternative: अपराध किया
  rationale: ‘विश्वासघात’ केवल नियम-भंग नहीं, बल्कि निष्ठा तोड़ने का भाव भी व्यक्त करता है; इससे शब्द की धार्मिक गंभीरता बनी रहती है, बिना यह तय किए कि यहाँ कोई विशिष्ट तकनीकी अपराध अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में मूल इब्रानी की दीर्घ संरचना को बनाए रखते हुए अल्पविरामों से अर्थ स्पष्ट किया गया है। ‘देखो’ को संकेतात्मक बल के कारण रखा गया है; ‘पात्र’ और ‘वेदी’ मन्दिर-प्रसंग के सहज, प्रचलित शब्द हैं।
