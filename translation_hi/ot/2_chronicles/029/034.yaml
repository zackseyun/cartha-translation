base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/034.yaml
  text: Only the priests were too few[a], and they were not able to skin all the burnt offerings, so their brothers the Levites supported them until the work was finished and until the priests had consecrated themselves[b]. For the Levites were more upright in heart to consecrate themselves than the priests.
translation:
  language: hi
  text: लेकिन याजक बहुत कम थे, और वे सभी होमबलियों की खाल नहीं उतार सकते थे। इसलिए उनके भाई लेवियों ने उनकी सहायता की[a], जब तक काम पूरा न हो गया और याजकों ने अपने को पवित्र न कर लिया। क्योंकि लेवी याजकों की अपेक्षा अपने को पवित्र करने में अधिक खरे मन वाले थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘उन्हें बल दिया’ या ‘उन्हें दृढ़ किया।’ यहाँ आशय काम में सहायता देने से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मन से अधिक निष्कपट।’ शाब्दिक रूप से, ‘हृदय के अधिक सीधे’; हिब्रू पद भीतरी खराई या सच्चाई पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: परन्तु
  rationale: यहाँ यह अव्यय पिछले प्रसंग से विरोध या सीमा का संकेत देता है। हिन्दी में ‘परन्तु’ वाक्य के आरम्भ में स्वाभाविक है और याजकों की अपर्याप्त संख्या पर ध्यान खींचता है।
- source_word: לִמְעָט
  choice: संख्या में बहुत कम
  rationale: היה के साथ यह पद केवल कम संख्या नहीं, बल्कि काम के लिए अपर्याप्त संख्या व्यक्त करता है।
- source_word: לְהַפְשִׁיט
  choice: खाल उतारना
  rationale: बलि-पशुओं की खाल निकालने की क्रिया का स्पष्ट और सामान्य आधुनिक हिन्दी रूप।
- source_word: הָעֹלוֹת
  choice: होमबलियाँ
  rationale: עֹלָה के लिए प्रचलित और सटीक हिन्दी धार्मिक पद, जिसमें पूरी बलि चढ़ाए जाने का भाव निहित है।
- source_word: וַיְחַזְּקוּם
  choice: उन्हें सहारा दिया
  rationale: क्रिया का शाब्दिक अर्थ ‘उन्हें दृढ़/बलवान किया’ है; इस प्रसंग में यह काम पूरा करने हेतु व्यावहारिक सहायता देने को दर्शाती है।
- source_word: אֲחֵיהֶם
  choice: उनके भाई
  rationale: शाब्दिक पारिवारिक संबोधन को बनाए रखता है; अगले पद ‘लेवियों’ से आशय स्पष्ट हो जाता है।
- source_word: עַד כְּלוֹת הַמְּלָאכָה
  choice: जब तक काम पूरा न हो गया
  rationale: निर्माण अवधि को काम की समाप्ति तक व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: יִתְקַדְּשׁוּ
  choice: अपने को पवित्र कर लिया
  rationale: हित्पएल रूप मंदिर की पवित्र सेवा के लिए स्वयं को विधिपूर्वक तैयार या पवित्र करने को व्यक्त करता है।
- source_word: יִשְׁרֵי לֵבָב
  choice: अधिक खरे मन वाले
  rationale: हिब्रू मुहावरे में भीतरी निष्कपटता और नैतिक सिधाई का भाव है; ‘खरे मन वाले’ आधुनिक हिन्दी में उस भाव को स्वाभाविक ढंग से रखता है।
- source_word: לְהִתְקַדֵּשׁ מֵהַכֹּהֲנִים
  choice: अपने को पवित्र करने के लिए ... याजकों की अपेक्षा अधिक
  rationale: מִן के तुलनात्मक बल को स्पष्ट रखता है और तुलना को इसी प्रसंग में आत्म-पवित्रीकरण तक सीमित करता है।
theological_decisions:
- issue: लेवियों और याजकों के बीच तुलना का स्वरूप
  choice: लेवी अपने को पवित्र करने के विषय में याजकों की अपेक्षा अधिक खरे मन वाले थे।
  alternative: लेवी याजकों से अधिक तत्पर या अधिक अच्छी तरह तैयार थे।
  rationale: יִשְׁרֵי לֵבָב मुख्यतः हृदय की सच्चाई या खराई पर बल देता है, केवल गति या प्रशासनिक तैयारी पर नहीं। तुलना को इसी घटना तक सीमित रखा गया है, ताकि समूचे याजकवर्ग के विरुद्ध कोई व्यापक निष्कर्ष न जोड़ा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘होमबलि,’ ‘याजक’ और ‘लेवी’ जैसे परिचित बाइबलीय पद बनाए रखे गए हैं। वाक्य-रचना को स्वाभाविक हिन्दी के अनुरूप किया गया है, जबकि हिब्रू की तुलना और उसके धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
