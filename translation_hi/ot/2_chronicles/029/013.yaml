base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/013.yaml
  text: and from the sons of Elizaphan[a], Shimri and Jeiel; and from the sons of Asaph[b], Zechariah and Mattaniah.
translation:
  language: hi
  text: और एलीसापान के वंशजों[a] में से शिम्री और यऊएल; और आसाप के वंशजों में से जकर्याह और मत्तन्याह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पुत्रों”; यहाँ यह पद किसी व्यापक वंश या कुल के सदस्यों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִן
  choice: और ... में से
  rationale: संयोजक ו और संबंधसूचक מִן को सूची की पिछली कड़ी से जोड़ते हुए स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּנֵי
  choice: वंशजों
  rationale: वंशावली और कुल-सूची के इस संदर्भ में בְּנֵי केवल प्रत्यक्ष पुत्रों के बजाय व्यापक वंश या कुल के सदस्यों को सूचित कर सकता है; ‘वंशजों’ से यही आशय सहज हिन्दी में मिलता है।
- source_word: אֱלִיצָפָן
  choice: एलीसाफान
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: שִׁמְרִי
  choice: शिम्री
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: ו/יעואל
  choice: और यीएल
  rationale: मसोरेटी पाठ के व्यंजन יעואל को नाम यीएल के रूप में प्रस्तुत किया गया; पाठ की वर्तनी को आधार बनाया गया है, न कि अंग्रेज़ी परत में परस्पर-विरोधी टिप्पणी को।
- source_word: בְּנֵי אָסָף
  choice: आसाप के वंशजों
  rationale: आसाप को पूर्वज अथवा गायन-दल के कुलप्रमुख के रूप में रखते हुए कुल-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: זְכַרְיָהוּ
  choice: जकर्याह
  rationale: प्रचलित हिन्दी बाइबलीय रूप, जो इब्रानी नाम के साथ पर्याप्त निकटता रखता है।
- source_word: וּ/מַתַּנְיָהוּ
  choice: और मत्तन्याह
  rationale: संयोजक को बनाए रखते हुए इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: בְּנֵי का संबंधगत दायरा
  choice: वंशजों
  alternative: पुत्रों
  rationale: यह पुरोहितीय/लेवीय कुल-सूची है, इसलिए शब्द का आशय प्रत्यक्ष पुत्रों तक सीमित करना अनावश्यक रूप से संकरा होगा। पादटिप्पणी में मूल शब्द की शाब्दिकता और व्यापक अर्थ दोनों बताए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूची-संगत हिन्दी। पद पूर्ण वाक्य न होकर पिछले पदों से जुड़ी नामावली का अंश है, इसलिए आरंभ का ‘और’ तथा समानांतर संरचना बनाए रखी गई है। अंग्रेज़ी परामर्श-पाठ की दूसरी पादटिप्पणी आसाप पर लगी हुई है पर उसका विषय यीएल की वर्तनी है; इस विसंगति को हिन्दी मसौदे में नहीं दोहराया गया।
