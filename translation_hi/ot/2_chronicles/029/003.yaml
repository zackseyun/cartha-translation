base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/003.yaml
  text: In the first year of his reign[a], in the first month, he opened the doors of the house of Yahweh and repaired them.
translation:
  language: hi
  text: अपने राज्यकाल के पहले वर्ष के पहले महीने में उसने याहवे के भवन के द्वार खोले और उनकी मरम्मत की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें दृढ़ किया,” अर्थात द्वारों को मज़बूत और सुरक्षित बनाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: उसने
  rationale: स्वतंत्र सर्वनाम कर्ता को फिर से स्पष्ट करता है; हिंदी में क्रिया के साथ सामान्य सर्वनाम स्वाभाविक है, अलग से बल देना आवश्यक नहीं।
- source_word: בַשָּׁנָה הָרִאשׁוֹנָה לְמָלְכוֹ
  choice: अपने शासन के पहले वर्ष में
  rationale: यह इब्रानी कालवाचक पदबंध उसके राजत्व के प्रथम वर्ष को दर्शाता है; यह हिंदी में स्पष्ट और स्वाभाविक रूप है।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने में
  rationale: חֹדֶשׁ का यहाँ सीधा अर्थ ‘महीना’ है।
- source_word: פָּתַח
  choice: खोले
  rationale: मंदिर के द्वारों के संदर्भ में क्रिया का सीधा अर्थ ‘खोलना’ है।
- source_word: דַּלְתוֹת
  choice: द्वार
  rationale: यह शब्द यहाँ नगर के फाटकों के बजाय भवन के दरवाज़ों अथवा उनके पल्लों को सूचित करता है; ‘द्वार’ गरिमापूर्ण और सहज है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: मूल पदबंध का शाब्दिक अर्थ ‘याहवे का घर/भवन’ है; ‘भवन’ उपासना-स्थल के संदर्भ में स्वाभाविक रहते हुए स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम य्ह्व्ह को किसी उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: וַיְחַזְּקֵם
  choice: और उनकी मरम्मत की
  rationale: पिएल रूप का मूल भाव ‘दृढ़/मज़बूत करना’ है; द्वारों और मंदिर-पुनर्स्थापन के संदर्भ में ‘मरम्मत की’ उस व्यावहारिक कार्रवाई को सहज हिंदी में व्यक्त करता है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना और स्रोत के भेद को बनाए रखते हुए प्रस्तुत करता है।
- issue: וַיְחַזְּקֵם में मरम्मत और दृढ़ करने के बीच अर्थ-संबंध
  choice: मुख्य पाठ में ‘उनकी मरम्मत की’
  alternative: ‘उन्हें दृढ़ किया’
  rationale: संदर्भ व्यावहारिक पुनर्स्थापन की ओर संकेत करता है, किंतु इब्रानी क्रिया का मूल ‘दृढ़ करना’ है; इसलिए मुख्य पाठ में स्वाभाविक संदर्भगत अर्थ और पादटिप्पणी में शाब्दिक विकल्प रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘भवन’ मूल ‘घर’ की छवि को बनाए रखते हुए मंदिर-संदर्भ में स्वाभाविक है। पादटिप्पणी-चिह्न उस क्रिया के तुरंत बाद रखा गया है जिससे उसका संबंध है।
