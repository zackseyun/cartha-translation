base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/018.yaml
  text: Then they went in to King Hezekiah and said[a], “We have cleansed all the house of Yahweh, the altar of burnt offering and all its utensils, and the table of the rows and all its utensils.”
translation:
  language: hi
  text: तब वे भीतर जाकर राजा हिजकिय्याह के पास आए और बोले, “हमने याहवे के समूचे भवन को शुद्ध कर दिया है—होमबलि की वेदी और उसके सारे पात्रों को, तथा पंक्तियों की मेज़[a] और उसके सारे पात्रों को।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेंट की रोटियों की मेज़,” अर्थात वह मेज़ जिस पर याहवे के सामने रोटियाँ क्रम से सजाकर रखी जाती थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְנִימָה
  choice: भीतर
  rationale: यह क्रियाविशेषण अंदर की ओर जाने को दर्शाता है; ‘भीतर’ प्रसंग में स्वाभाविक और संक्षिप्त है।
- source_word: טִהַרְנוּ
  choice: हमने … शुद्ध कर दिया है
  rationale: मंदिर के प्रसंग में यह क्रिया धार्मिक-विधि के अनुसार शुद्ध करने को व्यक्त करती है; पूर्ण कार्य के वर्तमान परिणाम को भी बनाए रखा गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे का … भवन
  rationale: ‘भवन’ इब्रानी ‘घर’ की उपासना-स्थल संबंधी अभिव्यक्ति को गरिमापूर्ण और स्पष्ट रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִזְבַּח הָעוֹלָה
  choice: होमबलि की वेदी
  rationale: यह उस वेदी का प्रचलित और सटीक हिन्दी नाम है जिस पर पूरी तरह जलाई जाने वाली बलि चढ़ाई जाती थी।
- source_word: כֵּלָיו
  choice: उसके सारे पात्र
  rationale: पवित्रस्थान के प्रसंग में כֵּלִים सेवा में प्रयुक्त पात्रों और उपकरणों के लिए आता है; ‘पात्र’ संक्षिप्त और परिचित धार्मिक शब्द है।
- source_word: שֻׁלְחַן הַמַּעֲרֶכֶת
  choice: पंक्तियों की मेज़
  rationale: מַעֲרֶכֶת का आशय व्यवस्थित विन्यास या पंक्तियों से है। यह अनुवाद उस अभिव्यक्ति को सुरक्षित रखता है और व्याख्यात्मक पहचान को पादटिप्पणी में देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: שֻׁלְחַן הַמַּעֲרֶכֶת की पहचान
  choice: पंक्तियों की मेज़
  alternative: भेंट की रोटियों की मेज़
  rationale: मुख्य पाठ में इब्रानी की वास्तविक शब्दावली और उसका कुछ हद तक खुला अर्थ रखा गया है; प्रसंगगत पहचान पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। मंदिर-संबंधी शब्दावली के लिए ‘शुद्ध’, ‘होमबलि’, ‘वेदी’ और ‘पात्र’ जैसे परिचित शब्द चुने गए हैं।
