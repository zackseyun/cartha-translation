    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן
  choice: और ... में से
  rationale: וְ का संयोजक भाव पिछली सूची से संबंध बनाए रखता है, और מִן के चयनात्मक अर्थ को स्वाभाविक हिन्दी में ‘में से’ व्यक्त किया गया है।
- source_word: בְּנֵי
  choice: पुत्रों
  rationale: वंश अथवा कुल की सूची में इसका सीधा अर्थ ‘पुत्रों’ है; प्रसंग में यह पारिवारिक वंश के सदस्यों को भी समेट सकता है।
- source_word: הֵימָן
  choice: हेमान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יחואל
  choice: यहूएल
  rationale: प्रस्तुत WLC पाठ की व्यंजनात्मक वर्तनी के निकट देवनागरी लिप्यंतरण; अन्य पाठ-परंपराओं में मिलने वाले ‘यहीएल’ को पादटिप्पणी में रखा गया है।
- source_word: וְשִׁמְעִי
  choice: और शिमी
  rationale: सूची की संरचना बनाए रखने के लिए संयोजक को रखा गया और नाम का लिप्यंतरण किया गया है।
- source_word: יְדוּתוּן
  choice: यदूतून
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी नाम के घटकों और उच्चारण को स्पष्ट रखने वाला हिन्दी लिप्यंतरण।
- source_word: וְעֻזִּיאֵל
  choice: और उज्जीएल
  rationale: अंतिम नाम से पहले का संयोजक सुरक्षित रखा गया है और इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
