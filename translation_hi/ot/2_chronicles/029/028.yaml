  yaml_path: translation/ot/2_chronicles/029/028.yaml
  text: And all the assembly was bowing down[a], while the song was being sung and the trumpets were sounding—all this continued until the burnt offering was finished.
translation:
  language: hi
  text: और सारी सभा दण्डवत कर रही थी, गीत गाया जा रहा था और तुरहियाँ बज रही थीं—यह सब होमबलि पूरी होने तक चलता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָּהָל
  choice: सभा
  rationale: यह उपासना के लिए एकत्र समुदाय को दर्शाता है; ‘सभा’ स्वाभाविक है और सामूहिक भाव बनाए रखता है।
- source_word: מִשְׁתַּחֲוִים
  choice: दण्डवत कर रही थी
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि पर दण्डवत करने का संकेत देती है; यह अनुवाद उस दृश्य क्रिया को बनाए रखता है।
- source_word: הַשִּׁיר מְשׁוֹרֵר
  choice: गीत गाया जा रहा था
  rationale: इब्रानी में शाब्दिक रूप से ‘गीत’ के साथ गाने वाला कृदन्त है। हिंदी में कर्मवाच्य प्रयोग अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲצֹצְרוֹת מחצצרים
  choice: तुरहियाँ बज रही थीं
  rationale: यह आराधना में प्रयुक्त सीधे धातु के तुरहीनुमा वाद्यों और उनके बजते रहने को दर्शाता है; ‘तुरहियाँ’ मानक और संक्षिप्त विकल्प है।
- source_word: הַכֹּל
  choice: यह सब
  rationale: यह पहले बताई गई समस्त उपासना-क्रियाओं का समाहार करता है।
- source_word: עַד לִכְלוֹת
  choice: पूरी होने तक
  rationale: यह क्रियाओं के जारी रहने की अंतिम सीमा बताता है और हिंदी में सहज है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: यह उस बलि का प्रचलित हिंदी बाइबलीय पद है जो वेदी पर पूर्णतः जलाई जाती थी।
