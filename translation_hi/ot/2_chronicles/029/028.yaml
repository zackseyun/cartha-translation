  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सहज रूप रखा गया है। ‘दण्डवत’ शारीरिक उपासना-भाव को स्पष्ट करता है, जबकि वाक्य की प्रगतिशील क्रियाएँ मूल में चल रही समकालीन गतिविधियों को सुरक्षित रखती हैं।
