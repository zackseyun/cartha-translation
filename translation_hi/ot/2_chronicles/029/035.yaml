source:
  edition: WLC
  text: וְ/גַם עֹלָ֨ה לָ/רֹ֜ב בְּ/חֶלְבֵ֧י הַ/שְּׁלָמִ֛ים וּ/בַ/נְּסָכִ֖ים לָ/עֹלָ֑ה וַ/תִּכּ֖וֹן עֲבוֹדַ֥ת בֵּית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/035.yaml
  text: And the burnt offerings were also in abundance[a], with the fat of the peace offerings and the drink offerings for the burnt offerings. So the service of the house of Yahweh was established.
translation:
  language: hi
  text: होमबलियाँ भी बहुत बड़ी संख्या में थीं, साथ ही मेलबलियों की चर्बी के भाग और होमबलियों के लिए पेयबलियाँ भी थीं। इस प्रकार याहवे के भवन की सेवा स्थापित हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: पूर्ववर्ती प्रसंग से इसके योगात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹלָה
  choice: होमबलियाँ
  rationale: रूप की दृष्टि से एकवचन होते हुए भी यहाँ यह सामूहिक अर्थ में है; לָרֹב के साथ बहुवचन हिन्दी में आशय अधिक स्पष्ट करता है।
- source_word: לָרֹב
  choice: बहुत बड़ी संख्या में
  rationale: बलियों की प्रचुर मात्रा बताने वाले इब्रानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: בְּחֶלְבֵי
  choice: उनके साथ ... की चर्बी
  rationale: बलिदान-संबंधी प्रसंग में חלב वे चर्बी वाले भाग हैं जो वेदी पर चढ़ाए जाते थे; בְּ का साहचर्यात्मक अर्थ रखा गया है।
- source_word: הַשְּׁלָמִים
  choice: मेलबलियों
  rationale: इस मान्य बलिदान-श्रेणी के लिए संक्षिप्त और परिचित हिन्दी पद है; शब्द में निहित मेल या कुशलता के भाव को बनाए रखता है।
- source_word: וּבַנְּסָכִים
  choice: और ... पेयबलियाँ
  rationale: נְסָכִים वे द्रव-भेंटें हैं जिन्हें उंडेला जाता था; 'पेयबलि' आधुनिक पाठक के लिए स्पष्ट बलिदान-संबंधी पद है।
- source_word: לָעֹלָה
  choice: होमबलियों के लिए
  rationale: पेयबलियों का पहले उल्लिखित होमबलियों से संबंध स्पष्ट करता है और सामूहिक अर्थ बनाए रखता है।
- source_word: וַתִּכּוֹן
  choice: स्थापित हो गई
  rationale: כון का परिणामसूचक भाव है कि सेवा दृढ़ता से व्यवस्थित और पुनः कार्यशील हो गई।
- source_word: עֲבוֹדַת בֵּית יְהוָה
  choice: याहवे के भवन की सेवा
  rationale: इब्रानी संबंध-रचना और मन्दिर की उपासना-सेवा के अर्थ को सीधे बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ के विशिष्ट नाम को नाम के रूप में सुरक्षित रखता है; 'प्रभु' कहने से नाम और उपाधि का भेद मिट जाता।
- issue: बलिदान-संबंधी पद שְׁלָמִים
  choice: मेलबलियाँ
  alternative: संगति-बलियाँ / शान्ति-बलियाँ
  rationale: यह चुनाव इब्रानी बलिदान-श्रेणी को किसी एक संकीर्ण धार्मिक व्याख्या तक सीमित किए बिना उसके मेल के भाव को व्यक्त करता है; वैकल्पिक नाम पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। 'होमबलि', 'मेलबलि' और 'पेयबलि' जैसे संक्षिप्त बलिदान-संबंधी पदों से मूल की धार्मिक शब्दावली तथा वाक्य की स्पष्टता दोनों सुरक्षित हैं।
