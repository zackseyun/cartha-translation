language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/יָּחֵלּוּ בְּ/אֶחָ֞ד לַ/חֹ֣דֶשׁ הָ/רִאשׁוֹן֮ לְ/קַדֵּשׁ֒ וּ/בְ/י֧וֹם שְׁמוֹנָ֣ה לַ/חֹ֗דֶשׁ בָּ֚אוּ לְ/אוּלָ֣ם יְהוָ֔ה וַ/יְקַדְּשׁ֥וּ אֶת בֵּית יְהוָ֖ה לְ/יָמִ֣ים שְׁמוֹנָ֑ה וּ/בְ/י֨וֹם שִׁשָּׁ֥ה עָשָׂ֛ר לַ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן כִּלּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/017.yaml
  text: They began to consecrate on the first day of the first month[a], and on the eighth day of the month they came to the vestibule of Yahweh. Then they consecrated the house of Yahweh in eight days, and on the sixteenth day of the first month they finished.
translation:
  language: hi
  text: उन्होंने पहले महीने के पहले दिन पवित्र करने का काम आरम्भ किया। महीने के आठवें दिन वे याहवे के भवन के बरामदे[a] तक पहुँचे। फिर उन्होंने आठ दिन में याहवे के भवन को पवित्र किया, और पहले महीने के सोलहवें दिन उन्होंने काम पूरा कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुखमण्डप” अथवा “ड्योढ़ी।”
    reason: אוּלָם मन्दिर के सामने के प्रवेश-भाग का वास्तुशिल्पीय शब्द है; विभिन्न हिन्दी पर्याय उसके अर्थ के अलग पहलुओं को व्यक्त करते हैं।
lexical_decisions:
- source_word: וַיָּחֵלּוּ ... לְקַדֵּשׁ
  choice: पवित्र करने का काम आरम्भ किया
  rationale: हिफ़ील क्रिया וַיָּחֵלּוּ का अर्थ ‘आरम्भ करना’ है और לְקַדֵּשׁ मन्दिर को पवित्र उपयोग के योग्य ठहराने की प्रक्रिया बताता है। यह अभिव्यक्ति हिन्दी में स्वाभाविक है और मूल में कर्म के अनुल्लिखित रहने को अनावश्यक रूप से नहीं भरती।
- source_word: בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के पहले दिन
  rationale: इब्रानी तिथि-सूत्र का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: בָּאוּ לְאוּלָם יְהוָה
  choice: याहवे के भवन के बरामदे तक पहुँचे
  rationale: אוּלָם मन्दिर के सामने के ढके हुए प्रवेश-भाग को दर्शाता है। ‘तक पहुँचे’ לְ की दिशात्मकता बनाए रखता है और यह दावा नहीं करता कि वे मुख्य पवित्रस्थान में प्रवेश कर गए। ‘भवन के’ हिन्दी में सम्बन्ध स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
- source_word: וַיְקַדְּשׁוּ אֶת־בֵּית יְהוָה
  choice: उन्होंने याहवे के भवन को पवित्र किया
  rationale: בֵּית יְהוָה मन्दिर को सूचित करता है; ‘याहवे का भवन’ मूल की पारम्परिक संज्ञा को बनाए रखता है। קדשׁ के लिए पूरे पद में ‘पवित्र’ रखकर शब्दगत संगति बनाए रखी गई है।
- source_word: לְיָמִים שְׁמוֹנָה
  choice: आठ दिन में
  rationale: यह उस चरण को पूरा करने में लगे समय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּלּוּ
  choice: काम पूरा कर लिया
  rationale: पिएल रूप का अर्थ ‘समाप्त/पूरा करना’ है। ‘काम’ प्रसंग से प्राप्त है और हिन्दी वाक्य को स्वाभाविक बनाता है, बिना किसी नए धार्मिक कर्म का संकेत दिए।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और अंग्रेज़ी परामर्श-पाठ के Yahweh के अनुरूप है।
- issue: קדשׁ का प्रसंगगत अर्थ
  choice: पवित्र करना
  alternative: शुद्ध करना; अभिषिक्त करना
  rationale: मन्दिर की सफ़ाई प्रसंग का भाग है, पर शब्द स्वयं ‘पवित्र ठहराने/करने’ का व्यापक अर्थ रखता है। ‘पवित्र करना’ इस व्यापकता को बनाए रखता है और इसे केवल भौतिक शुद्धि या अभिषेक तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। तिथियों को स्वाभाविक हिन्दी क्रम में रखा गया है। फुटनोट-चिह्न उसी वास्तुशिल्पीय शब्द के बाद लगाया गया है जिससे उसका सम्बन्ध है।
