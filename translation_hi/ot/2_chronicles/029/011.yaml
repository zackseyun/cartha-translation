id: 2CH.29.11
reference: 2 Chronicles 29:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּנַ֕/י עַתָּ֖ה אַל תִּשָּׁל֑וּ כִּֽי בָ/כֶ֞ם בָּחַ֣ר יְהוָ֗ה לַ/עֲמֹ֤ד לְ/פָנָי/ו֙ לְ/שָׁ֣רְת֔/וֹ וְ/לִ/הְי֥וֹת ל֖/וֹ מְשָׁרְתִ֥ים וּ/מַקְטִרִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/011.yaml
  text: My sons[a], do not be negligent now, for Yahweh has chosen you to stand before him, to minister to him[d][c][b], and to be his ministers and burners of incense.
translation:
  language: hi
  text: हे मेरे बेटो, अब लापरवाह मत रहो,[a] क्योंकि यहोवा ने तुम्हें चुन लिया है कि तुम उसके सामने खड़े रहो,[b] उसकी सेवा करो, और उसके सेवक तथा धूप जलानेवाले बनो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “ढीले मत पड़ो” अथवा “अपने कर्तव्य में असावधान मत रहो।”'
    reason: lexical_alternative
  - marker: b
    text: “उसके सामने खड़े रहना” याजकीय अभिव्यक्ति है, जिसका अर्थ परमेश्वर की उपस्थिति में सेवा के लिए उपस्थित रहना है।
    reason: cultural_note
  - marker: c
    text: 'या: “धूप चढ़ानेवाले।” मूल क्रिया का व्यापक अर्थ किसी अर्पण को धुएँ में चढ़ाना भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנַי
  choice: हे मेरे बेटो
  rationale: शाब्दिक संबोधन ‘मेरे पुत्रो’ है; याजकों और लेवियों को किए गए आत्मीय, पुरुषवाचक संबोधन के लिए ‘हे मेरे बेटो’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עַתָּה אַל תִּשָּׁלוּ
  choice: अब लापरवाह मत रहो
  rationale: यहाँ क्रिया का भाव अपने कर्तव्य में ढीले, असावधान या उपेक्षापूर्ण रहने का है। ‘लापरवाह मत रहो’ व्यावहारिक चेतावनी को स्पष्ट रखता है।
- source_word: בָכֶם בָּחַר יְהוָה
  choice: यहोवा ने तुम्हें चुन लिया है
  rationale: בָכֶם पर बल है—चुने गए लोग ‘तुम’ हो। पूर्ण क्रिया को प्रसंग में वर्तमान परिणाम सहित ‘चुन लिया है’ कहना स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसे किसी उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: לַעֲמֹד לְפָנָיו
  choice: उसके सामने खड़े रहो
  rationale: मूल के चित्र को बनाए रखता है; याजकीय प्रसंग में यह परमेश्वर की उपस्थिति में नियुक्त सेवा के लिए उपस्थित रहने का मुहावरा है।
- source_word: לְשָׁרְתוֹ
  choice: उसकी सेवा करो
  rationale: שרת यहाँ मंदिर की नियुक्त धार्मिक सेवा को दर्शाता है। हिन्दी में ‘सेवा करना’ सहज है और प्रसंग उस सेवा का याजकीय स्वरूप स्पष्ट करता है।
- source_word: וְלִהְיוֹת לוֹ מְשָׁרְתִים וּמַקְטִרִים
  choice: और उसके सेवक तथा धूप जलानेवाले बनो
  rationale: 'दोनों कृदंत भूमिकाओं को समानांतर संज्ञात्मक रूप में रखता है: सेवा करनेवाले और धूप जलानेवाले। ‘धूप जलानेवाले’ मूल के क्रियात्मक चित्र के निकट है।'
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पाठ में वाचा-नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे केवल ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: ‘उसके सामने खड़े रहना’ का अर्थ
  choice: मुख्य पाठ में मूल मुहावरा बनाए रखा
  alternative: उसकी उपस्थिति में सेवा के लिए उपस्थित रहना
  rationale: याजकीय सेवा का आशय महत्त्वपूर्ण है, पर मुख्य पाठ में मूल चित्र को संरक्षित करके उसका अर्थ पादटिप्पणी में बताना अस्पष्टता और सांस्कृतिक गहराई दोनों को बनाए रखता है।
- issue: מַקְטִרִים में धूप या व्यापक धूम-बलि का आशय
  choice: धूप जलानेवाले
  alternative: धूप चढ़ानेवाले / बलि को धुएँ में चढ़ानेवाले
  rationale: मंदिर-सेवा के इस प्रसंग में धूप अभिप्रेत होना स्वाभाविक है, यद्यपि मूल धातु का व्यापक अर्थ किसी अर्पण को धुएँ में चढ़ाना भी हो सकता है। पादटिप्पणी वैकल्पिक अभिव्यक्ति दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हे मेरे बेटो’ आत्मीय संबोधन को, ‘लापरवाह मत रहो’ चेतावनी की स्पष्टता को, और समानांतर ‘सेवक तथा धूप जलानेवाले’ मूल की दो नियुक्त भूमिकाओं को सुरक्षित रखते हैं।
