base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/022.yaml
  text: Then they slaughtered the cattle[a], and the priests received the blood and splashed it against the altar. They slaughtered the rams and splashed the blood against the altar[b]. They slaughtered the lambs and splashed the blood against the altar.
translation:
  language: hi
  text: तब उन्होंने गाय-बैलों का वध किया, और याजकों ने लहू लिया और उसे वेदी पर छिड़का[a]। उन्होंने मेढ़ों का वध किया और उनका लहू वेदी पर छिड़का। उन्होंने मेमनों का वध किया और उनका लहू वेदी पर छिड़का।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लहू वेदी पर उछाला” अथवा “लहू वेदी के विरुद्ध दे मारा।” इब्रानी क्रिया लहू को बलपूर्वक अनुष्ठानिक रीति से लगाने का भाव देती है, केवल हलके छींटे देने का नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: बलि के लिए काटा
  rationale: बलिदान के प्रसंग में שׁחט विधिपूर्वक वध को दर्शाता है। हिंदी में ‘बलि के लिए काटा’ केवल मार डालने के बजाय अनुष्ठानिक अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַבָּקָר
  choice: गाय-बैलों
  rationale: בקר गोवंश के लिए सामूहिक संज्ञा है; ‘गाय-बैल’ लिंग को केवल नर पशुओं तक सीमित किए बिना हिंदी में इस व्यापक अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיְקַבְּלוּ
  choice: लेकर
  rationale: קבל का मूल अर्थ ‘ग्रहण करना/लेना’ है। यहाँ याजक अनुष्ठान में उपयोग के लिए लहू ग्रहण करते हैं; ‘लेकर’ सहज हिंदी में यही प्रक्रिया बताता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: כהנים के लिए प्रचलित और गरिमापूर्ण बाइबलीय हिंदी शब्द।
- source_word: הַדָּם
  choice: लहू
  rationale: דם का सीधा अनुवाद। ‘लहू’ आधुनिक पाठकों के लिए समझने योग्य है और बलिदान-संबंधी बाइबलीय भाषा में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וַיִּזְרְקוּ
  choice: जोर से छिड़का
  rationale: זרק यहाँ लहू के बलपूर्वक अनुष्ठानिक प्रयोग को दर्शाता है, हलके छींटे देने को नहीं। ‘जोर से छिड़का’ क्रिया की शक्ति और हिंदी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप वेदी की ओर गति बताता है और अनुष्ठान में लहू वेदी की सतह या पार्श्व पर लगाया जाता है। हिंदी में ‘वेदी पर’ इसका स्वाभाविक रूप है।
- source_word: הָאֵלִים
  choice: मेढ़ों
  rationale: אילים का मानक अर्थ नर भेड़, अर्थात मेढ़े, है।
- source_word: הַכְּבָשִׂים
  choice: मेमनों
  rationale: כבשים बलिदानी सूचियों में सामान्यतः मेमनों या कम आयु की भेड़ों को दर्शाता है; ‘मेमने’ इस प्रसंग में उपयुक्त है।
