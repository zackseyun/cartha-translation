source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥יד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: hi
  text: उसने यहोवा की दृष्टि में सही काम किया, जैसा उसके पूर्वज दाऊद ने हर बात में किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने किया
  rationale: עשה के क़ाल वय्यिक्तोल का सामान्य कथात्मक अर्थ है; हिन्दी में आरम्भिक संयोजक को न देना स्वाभाविक है।
- source_word: הַיָּשָׁר
  choice: वही ... जो ... सही था
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का अर्थ ‘जो सही था’ है; ‘वही’ आगे आने वाली तुलना के साथ वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह इब्रानी मुहावरे के मूल्यांकनात्मक अर्थ को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह दाऊद के आचरण के अनुरूप होने का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है; כֹל की समग्रता ‘वही’ और ‘ठीक वैसे ही’ के संयुक्त प्रयोग में संप्रेषित होती है।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में स्थापित रूप।
- source_word: אָבִיו
  choice: उसके पुरखे
  rationale: यहाँ אָב तत्काल पिता नहीं, बल्कि राजवंशीय पूर्वज दाऊद को दर्शाता है। ‘पुरखा’ स्रोत के पारिवारिक/वंशगत संबंध को बनाए रखते हुए हिन्दी पाठक के लिए तथ्यात्मक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ रखा गया है, उपाधि ‘प्रभु’ नहीं।
- issue: חזקיה और दाऊद के संबंध में אָבִיו का अर्थ
  choice: उसके पुरखे दाऊद
  alternative: उसके पिता दाऊद
  rationale: दाऊद हिजकिय्याह का तत्काल पिता नहीं बल्कि राजवंशीय पूर्वज था। आधुनिक हिन्दी में ‘पिता’ तत्काल पितृत्व का भ्रामक अर्थ दे सकता है; ‘पुरखा’ मूल की विस्तृत वंशगत अर्थ-सीमा को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘की दृष्टि में’ बाइबलीय रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
