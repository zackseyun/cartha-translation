  yaml_path: translation/ot/2_chronicles/029/026.yaml
  text: Then the Levites stood with the instruments of David[b][a], and the priests with the trumpets.
translation:
  language: hi
  text: तब लेवीय दाऊद के वाद्ययंत्रों[a] के साथ और याजक तुरहियों[b] के साथ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद से संबंधित वाद्ययंत्रों।” इब्रानी वाक्यांश का आशय दाऊद के स्वामित्व वाले, उनके द्वारा निर्धारित, या उनसे संबद्ध वाद्ययंत्र हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् याजकों द्वारा धार्मिक उपासना में बजाई जाने वाली तुरहियाँ। अन्य प्रसंगों में इनके चाँदी के होने का उल्लेख मिलता है, पर यहाँ यह बात नहीं कही गई है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: तब ... खड़े हुए
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ स्वाभाविक कथात्मक क्रम व्यक्त करता है और עמד का मूल अर्थ ‘खड़ा होना’ बनाए रखता है।
- source_word: הַלְוִיִּם
  choice: लेवीय
  rationale: लेवी के वंश और मंदिर-सेवा से जुड़े इस समूह के लिए आधुनिक मानक हिन्दी का प्रचलित बाइबलीय पद।
- source_word: בִּכְלֵי דָוִיד
  choice: दाऊद के वाद्ययंत्रों के साथ
  rationale: כְּלִי का अर्थ व्यापक है, पर मंदिर-संगीत के इस प्रसंग में ‘वाद्ययंत्र’ उपयुक्त है। संबंधकारक रचना को बनाए रखने से दाऊद के साथ इनके संबंध की सटीक प्रकृति अनिर्धारित रहती है।
- source_word: וְהַכֹּהֲנִים
  choice: और याजक
  rationale: दूसरे समन्वित समूह और संयोजक को सीधे रूप में सुरक्षित रखता है।
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियों के साथ
  rationale: חֲצֹצְרוֹת याजकों द्वारा बजाई जाने वाली धार्मिक तुरहियों को दर्शाता है। इस पद में ‘चाँदी की’ नहीं कहा गया, इसलिए वह विवरण मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वाद्ययंत्र’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘तुरही’ धार्मिक-सांस्कृतिक संदर्भ की विशिष्टता बनाए रखती है।
