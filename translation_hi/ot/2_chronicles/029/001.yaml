id: 2CH.29.1
reference: 2 Chronicles 29:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְחִזְקִיָּ֣הוּ מָלַ֗ךְ בֶּן עֶשְׂרִ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה וְ/עֶשְׂרִ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ אֲבִיָּ֖ה בַּת זְכַרְיָֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/001.yaml
  text: Hezekiah became king when he was twenty-five years old, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abijah daughter of Zechariah.
translation:
  language: hi
  text: हिजकिय्याह जब राजा बना, तब वह पच्चीस वर्ष का था। उसने यरूशलेम में उनतीस वर्ष तक राज्य किया। उसकी माता का नाम अबिय्याह था; वह जकर्याह की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: पहला प्रयोग राजसिंहासन पर बैठने या शासन आरम्भ करने का भाव रखता है; हिन्दी में 'राजा बना' स्वाभाविक रूप से यह आरम्भिक अर्थ व्यक्त करता है।
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: तब वह पच्चीस वर्ष का था
  rationale: शाब्दिक 'पच्चीस वर्ष का पुत्र' के स्थान पर इब्रानी आयु-सूचक मुहावरे का स्वाभाविक हिन्दी रूप।
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: उसने ... उनतीस वर्ष तक राज्य किया
  rationale: दूसरा מָלַךְ शासन की अवधि बताता है; 'राज्य किया' और 'तक' हिन्दी में अवधि को स्पष्ट तथा सहज बनाते हैं।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग בְּ का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: सामान्य इब्रानी जीवन-वृत्त सूत्र को अर्थ बनाए रखते हुए स्वाभाविक हिन्दी वाक्य-विन्यास में प्रस्तुत किया गया है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का स्रोत-संगत हिन्दी लिप्यंतरण।
- source_word: בַּת זְכַרְיָהוּ
  choice: वह जकर्याह की बेटी थी
  rationale: वंश-संबंध को स्पष्ट, सहज हिन्दी में व्यक्त करता है; पृथक उपवाक्य पठनीयता बढ़ाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'माता' ने कथात्मक गरिमा बनाए रखी है; नामों के रूप हिन्दी बाइबल-परंपरा और इब्रानी उच्चारण, दोनों को ध्यान में रखकर चुने गए हैं।
