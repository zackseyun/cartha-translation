  text: וּ/כְ/כַלּ֖וֹת לְ/הַעֲל֑וֹת כָּרְע֗וּ הַ/מֶּ֛לֶךְ וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/029.yaml
  text: And when they had finished offering[b][a], the king and all who were present with him knelt down and worshiped.
translation:
  language: hi
  text: जब होमबलि चढ़ाने का काम पूरा हुआ[a], तब राजा और उसके साथ उपस्थित सभी लोगों ने घुटने टेके और दण्डवत् किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ, ‘जब चढ़ाना पूरा हुआ,’ है। इस बलिदानी प्रसंग में आशय होमबलि अर्पित करने की समाप्ति से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘आराधना की’ अथवा ‘झुककर प्रणाम किया।’ इब्रानी क्रिया श्रद्धा से दण्डवत् होने और आराधना करने—दोनों का भाव व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/כְ/כַלּוֹת
  choice: जब ... पूरा हुआ
  rationale: वाव, काफ और כלה के infinitive construct से बना पद समय-सूचक उपवाक्य आरम्भ करता है। यह हिंदी में घटनाओं का क्रम स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְ/הַעֲל֑וֹת
  choice: होमबलि चढ़ाना
  rationale: עלה का Hiphil infinitive शाब्दिक रूप से ‘ऊपर चढ़ाना’ है, पर इस बलिदानी प्रसंग में यह होमबलि अर्पित करने को सूचित करता है। इब्रानी में कर्म निहित है; ‘होमबलि’ निकटवर्ती मंदिर-बलिदान के संदर्भ से स्पष्ट किया गया है।
- source_word: כָּרְע֗וּ
  choice: घुटने टेके
  rationale: כרע घुटना मोड़ने या घुटने टेकने की शारीरिक क्रिया बताता है और अगले क्रियापद से इसका भेद बनाए रखता है।
- source_word: הַ/מֶּ֛לֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा और स्वाभाविक हिंदी अनुवाद।
- source_word: וְ/כָֽל הַ/נִּמְצְאִ֥ים אִתּ֖/וֹ
  choice: और उसके साथ उपस्थित सभी लोग
  rationale: מצא का Niphal participle यहाँ वहाँ मौजूद या उपस्थित लोगों को सूचित करता है।
- source_word: וַ/יִּֽשְׁתַּחֲוֽוּ
  choice: और दण्डवत् किया
  rationale: שחה का यह रूप श्रद्धा में झुकने, दण्डवत् होने या आराधना करने को व्यक्त कर सकता है। ‘दण्डवत् किया’ शारीरिक क्रिया और धार्मिक श्रद्धा दोनों को बनाए रखता है।
theological_decisions:
- issue: मंदिर-उपासना के प्रसंग में שחה का अनुवाद
  choice: दण्डवत् किया
  alternative: आराधना की; झुककर प्रणाम किया
  rationale: यह पद होमबलि पूरी होने पर राजा और सभा की प्रतिक्रिया बताता है। ‘दण्डवत् किया’ मूल क्रिया की शारीरिक मुद्रा और उपासना-संबंधी अर्थ दोनों को सुरक्षित रखता है, बिना केवल अमूर्त ‘आराधना’ तक अर्थ सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘घुटने टेके’ और ‘दण्डवत् किया’ से मूल की दो अलग क्रियाएँ स्पष्ट रहती हैं; संस्कृतनिष्ठता को केवल प्रचलित धार्मिक शब्दावली तक सीमित रखा गया है।
