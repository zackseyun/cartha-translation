  terminology: ‘होमबलि,’ ‘घुटने टेके,’ and ‘दण्डवत् किया’ are appropriate for a dignified modern Hindi biblical register. ‘दण्डवत् किया’ preserves the concrete reverential action without reducing it solely to an abstract act of worship.
