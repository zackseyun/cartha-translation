base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/012.yaml
  text: 'Then the Levites arose: Mahath son of Amasai and Joel son of Azariah[a], from the sons of the Kohathites; and from the sons of Merari, Kish son of Abdi and Azariah son of Jehallelel; and from the Gershonites[b], Joah son of Zimmah and Eden son of Joah.'
translation:
  language: hi
  text: 'तब लेवी उठ खड़े हुए: कहाती के वंशजों में से अमासै का पुत्र महत और अजर्याह का पुत्र योएल; मरारी के वंशजों में से अब्दी का पुत्र कीश और यहल्लेलेल का पुत्र अजर्याह; और गेर्शोनी कुल में से जिम्मा का पुत्र योआह और योआह का पुत्र एदेन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठ खड़े हुए
  rationale: קום का यह कथात्मक रूप राजा की आज्ञा के उत्तर में कार्रवाई आरम्भ करने को व्यक्त करता है; ‘उठ खड़े हुए’ हिन्दी में स्वाभाविक रहते हुए मूल क्रिया का बल बनाए रखता है।
- source_word: הַלְוִיִּם
  choice: ये लेवी
  rationale: לְוִיִּם का मानक जातीय/सेवकीय पदनाम ‘लेवी’ है; ‘ये’ आगे आने वाले नामों की सूची को सहज ढंग से प्रस्तुत करता है।
- source_word: מִן בְּנֵי הַקְּהָתִי
  choice: कहातियों के वंश में से
  rationale: शाब्दिक ‘कहाती के पुत्रों में से’ हिब्रू वंशावली मुहावरा है; आधुनिक हिन्दी में ‘वंश में से’ उसका आशय स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: मरारी के वंश में से
  rationale: मूल की वंशावली संरचना और मरारी कुल से प्रतिनिधित्व को सुरक्षित रखते हुए हिन्दी का स्वाभाविक प्रयोग किया गया है।
- source_word: וּמִן הַגֵּרְשֻׁנִּי
  choice: और गेर्शोनियों में से
  rationale: निश्चित लेख सहित एकवचन कुलवाचक रूप यहाँ सामूहिक अर्थ रखता है; ‘गेर्शोनियों’ उसी कुल-समूह को दर्शाता है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: नामावली में प्रत्यक्ष पिता-पुत्र संबंध का सामान्य और पारदर्शी अनुवाद है; संदर्भ इसे व्यापक ‘वंशज’ करने की माँग नहीं करता।
- source_word: מַחַת; עֲמָשַׂי; יוֹאֵל; עֲזַרְיָהוּ; קִישׁ; עַבְדִּי; יְהַלֶּלְאֵל; יוֹאָח; זִמָּה; עֵדֶן
  choice: महत; अमासै; योएल; अजर्याह; कीश; अब्दी; यहल्लेलेल; योआह; जिम्मा; एदेन
  rationale: व्यक्तिनामों का अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
