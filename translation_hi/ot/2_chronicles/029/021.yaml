id: 2CH.29.21
reference: 2 Chronicles 29:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ פָרִים שִׁבְעָה֩ וְ/אֵילִ֨ים שִׁבְעָ֜ה וּ/כְבָשִׂ֣ים שִׁבְעָ֗ה וּ/צְפִירֵ֨י עִזִּ֤ים שִׁבְעָה֙ לְ/חַטָּ֔את עַל הַ/מַּמְלָכָ֥ה וְ/עַל הַ/מִּקְדָּ֖שׁ וְ/עַל יְהוּדָ֑ה וַ/יֹּ֗אמֶר לִ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים לְ/הַעֲל֖וֹת עַל מִזְבַּ֥ח יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/021.yaml
  text: They brought seven bulls, seven rams, seven lambs, and seven male goats as a sin offering for the kingdom, for the sanctuary, and for Judah. And he told the sons of Aaron, the priests, to offer them on the altar of Yahweh.
translation:
  language: hi
  text: वे सात बैल, सात मेढ़े, सात मेमने और सात बकरे राज्य, पवित्रस्थान और यहूदा के लिए पापबलि के रूप में लाए। तब उसने हारून के पुत्रों अर्थात् याजकों से कहा कि वे उन्हें यहोवा की वेदी पर चढ़ाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: वे ... लाए
  rationale: בוא का हिफ़्ईल रूप यहाँ बलि के पशुओं को लाने की कथात्मक क्रिया व्यक्त करता है; सरल आधुनिक हिन्दी में “लाए” स्वाभाविक है।
- source_word: פָרִים
  choice: बैल
  rationale: बलिदानी सूची में यह अर्पण योग्य गोवंश के नर पशुओं को दर्शाता है; मूल पद इस आयु को स्पष्ट रूप से नहीं बताता, इसलिए “बछड़े” नहीं जोड़ा गया।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: नर भेड़ों के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: כְבָשִׂים
  choice: मेमने
  rationale: बलिदानी संदर्भ में कम आयु की भेड़ों का स्वाभाविक हिन्दी रूप; मूल में इस पद पर लिंग को अलग से स्पष्ट करने की आवश्यकता नहीं।
- source_word: צְפִירֵי עִזִּים
  choice: बकरे
  rationale: यह समास विशेष रूप से नर बकरों को दर्शाता है; हिन्दी में “बकरे” से नरत्व स्पष्ट है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: उपासना-संबंधी संदर्भ में חַטָּאת अमूर्त पाप नहीं, पाप के लिए चढ़ाई जाने वाली विशिष्ट बलि को दर्शाता है।
- source_word: עַל הַמַּמְלָכָה ... וְעַל הַמִּקְדָּשׁ וְעַל יְהוּדָה
  choice: राज्य, पवित्रस्थान और यहूदा के लिए
  rationale: बलिदानी प्रयोग में עַל प्रतिनिधिक लाभ अथवा निमित्त का भाव रखता है; “के लिए” इसे सहज हिन्दी में व्यक्त करता है।
- source_word: לִבְנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्रों अर्थात् याजकों
  rationale: “अर्थात्” समानाधिकरण को स्पष्ट करता है कि हारून के पुत्र ही यहाँ याजक हैं, कोई दूसरा समूह नहीं।
- source_word: לְהַעֲלוֹת
  choice: चढ़ाएँ
  rationale: עלה का हिफ़्ईल रूप बलिदानी संदर्भ में वेदी पर अर्पित करने का अर्थ देता है; “चढ़ाएँ” हिन्दी धार्मिक प्रयोग में संक्षिप्त और स्वाभाविक है।
- source_word: מִזְבַּח יְהוָה
  choice: यहोवा की वेदी
  rationale: समास को स्वाभाविक हिन्दी में संबंधकारक के साथ प्रस्तुत किया गया है; יְהוָה को हिन्दी में प्रचलित व्यक्तिवाचक रूप “यहोवा” दिया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में टेट्राग्रामटन स्पष्ट रूप से है। “यहोवा” आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम है और “प्रभु” की उपाधि से इसे छिपाता नहीं; “याहवे” अधिक संभावित ऐतिहासिक उच्चारण है, पर हिन्दी पाठकों में अपेक्षाकृत कम परिचित है।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: पाप के लिए बलि
  rationale: यहाँ शब्द विशिष्ट बलिदानी श्रेणी को सूचित करता है। “पापबलि” संक्षिप्त है और किसी बाद की प्रायश्चित-संबंधी व्याख्या को पद में नहीं जोड़ता।
- issue: राज्य, पवित्रस्थान और यहूदा के संबंध में עַל
  choice: के लिए
  alternative: की ओर से
  rationale: “की ओर से” प्रतिनिधिक बलि के भाव को अधिक स्पष्ट कर सकता है, पर “के लिए” मूल संबंध की व्यापकता और संभावित अस्पष्टता को बनाए रखते हुए अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ कथात्मक रूप। बलिदानी शब्दावली में “पापबलि,” “याजक,” “वेदी,” और “चढ़ाएँ” जैसे परिचित शब्द रखे गए हैं। वाक्य के दूसरे भाग में आरंभिक וַ को स्वाभाविक क्रमसूचक “तब” से व्यक्त किया गया है।
