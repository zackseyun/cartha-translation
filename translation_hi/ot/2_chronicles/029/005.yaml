  text: וַ/יֹּ֥אמֶר לָ/הֶ֖ם שְׁמָע֣וּ/נִי הַ/לְוִיִּ֑ם עַתָּ֣ה הִֽתְקַדְּשׁ֗וּ וְ/קַדְּשׁוּ֙ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבֹתֵי/כֶ֔ם וְ/הוֹצִ֥יאוּ אֶת הַ/נִּדָּ֖ה מִן הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/005.yaml
  text: And he said to them[a], “Listen to me, Levites. Now consecrate yourselves, and consecrate the house of Yahweh, the God of your fathers[b], and remove the uncleanness from the holy place.”
translation:
  language: hi
  text: उसने उनसे कहा, “हे लेवियो, मेरी सुनो! अब अपने आप को पवित्र करो और अपने पूर्वजों के परमेश्वर याहवे के भवन को पवित्र करो। पवित्र स्थान में से अशुद्धता[a] निकाल दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपवित्र करने वाली वस्तु” अथवा “गन्दगी”; इब्रानी शब्द उस चीज़ या अशुद्धता को सूचित करता है जो पवित्र स्थान को दूषित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: שׁמע के बहुवचन आज्ञार्थक और प्रथम पुरुष एकवचन प्रत्यय को स्वाभाविक आधुनिक हिन्दी में सीधे संबोधन के रूप में व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: हे लेवियो
  rationale: यह लेवीवंशीय सेवकों को किया गया प्रत्यक्ष संबोधन है; हिन्दी संबोधन-रूप वचन और भूमिका दोनों स्पष्ट करता है।
- source_word: עַתָּה
  choice: अब
  rationale: मूल के कालवाचक क्रियाविशेषण और तत्काल आरम्भ करने के आह्वान को बिना अतिरिक्त तीव्रता जोड़े सुरक्षित रखता है।
- source_word: הִתְקַדְּשׁוּ
  choice: अपने आप को पवित्र करो
  rationale: קדשׁ के हित्पएल आज्ञार्थक का आत्मवाचक भाव स्पष्ट करता है और याजकीय तैयारी के संदर्भ में साधारण हिन्दी पाठक के लिए बोधगम्य है।
- source_word: וְקַדְּשׁוּ
  choice: और ... को पवित्र करो
  rationale: पिछली क्रिया के समान हिन्दी मूल का प्रयोग करके मूल इब्रानी में קדשׁ की पुनरावृत्ति बनाए रखता है।
- source_word: בֵּית יְהוָה
  choice: यहवे के भवन
  rationale: शाब्दिक ‘यहवे का घर’ को गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी ‘भवन’ से व्यक्त किया गया है; ‘मन्दिर’ संदर्भतः सही पर अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में सीधा लिप्यंतरण किया गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: संबोधित लोगों के साथ सम्बन्ध को ‘अपने’ से स्वाभाविक हिन्दी में रखा गया है; ‘पूर्वज’ אבות के वंशगत अर्थ को समावेशी और स्पष्ट रूप में व्यक्त करता है।
- source_word: וְהוֹצִיאוּ
  choice: निकाल दो
  rationale: יצא के हिफ़ील आज्ञार्थक का कारणवाचक निष्कासन-अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: הַנִּדָּה
  choice: अशुद्धता
  rationale: यह शब्द यहाँ पवित्रस्थान को दूषित करने वाली धार्मिक/अनुष्ठानिक अशुद्धता को दर्शाता है; केवल भौतिक ‘गन्दगी’ कहना अर्थ को संकुचित कर देता।
- source_word: מִן הַקֹּדֶשׁ
  choice: पवित्रस्थान में से
  rationale: קֹדֶשׁ को इस प्रसंग में पवित्र परिसर या sanctuary के रूप में लिया गया है; ‘में से’ निष्कासन के आरम्भ-बिन्दु को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘यहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הַנִּדָּה का धार्मिक आशय
  choice: अशुद्धता
  alternative: अपवित्रता; गन्दगी
  rationale: शब्द पवित्रस्थान को दूषित करने वाली वस्तु या स्थिति को संकेत कर सकता है। ‘अशुद्धता’ अनुष्ठानिक अर्थ बनाए रखती है और यह अनावश्यक रूप से तय नहीं करती कि आशय केवल मैल है या कोई दूषित करने वाली सामग्री।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण आज्ञार्थक शैली। ‘पवित्र करो’ की पुनरावृत्ति मूल के शब्द-साम्य को बनाए रखती है। संबोधन में ‘हे’ औपचारिकता देता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज रखा गया है।
