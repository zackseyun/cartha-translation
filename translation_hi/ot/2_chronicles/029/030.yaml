  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר יְחִזְקִיָּ֨הוּ הַ/מֶּ֤לֶךְ וְ/הַ/שָּׂרִים֙ לַ/לְוִיִּ֔ם לְ/הַלֵּל֙ לַֽ/יהוָ֔ה בְּ/דִבְרֵ֥י דָוִ֖יד וְ/אָסָ֣ף הַ/חֹזֶ֑ה וַֽ/יְהַלְלוּ֙ עַד לְ/שִׂמְחָ֔ה וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוֽוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/030.yaml
  text: Then Hezekiah the king and the officials told the Levites to praise Yahweh with the words of David and of Asaph the seer[a]. So they praised with gladness[b], and they bowed down and worshiped.
translation:
  language: hi
  text: तब राजा हिजकिय्याह और अधिकारियों ने लेवियों से कहा कि वे दाऊद और दर्शी आसाप के वचनों से[a] यहोवा की स्तुति करें। तब उन्होंने आनन्द के साथ[b] स्तुति की; फिर उन्होंने सिर झुकाया और दण्डवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद और दर्शी आसाप के वचनों के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का शाब्दिक रूप “आनन्द तक” या “आनन्द के लिए” है; आशय सम्भवतः यह है कि उनकी स्तुति आनन्द से भरी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: से कहा कि वे
  rationale: इब्रानी क्रिया का मूल अर्थ ‘कहा’ है, पर infinitive के साथ यहाँ निर्देश का भाव है। यह प्रयोग स्वाभाविक हिन्दी में निर्देश व्यक्त करता है, बिना ‘आज्ञा दी’ की अतिरिक्त कठोरता जोड़े।
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: राजा ... और अधिकारियों
  rationale: שָׂרִים यहाँ शासकीय अगुओं या पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: לְהַלֵּל לַיהוָה
  choice: यहोवा की स्तुति करें
  rationale: הלל का उपासना-संदर्भ में अर्थ स्तुति करना है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּדִבְרֵי דָוִיד וְאָסָף הַחֹזֶה
  choice: दाऊद और दर्शी आसाप के वचनों से
  rationale: בְּ साधन (‘से/के द्वारा’) या मानक (‘के अनुसार’) बता सकता है। मुख्य पाठ में ‘वचनों से’ मूल संरचना के निकट है; दूसरा सम्भव अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַחֹזֶה
  choice: दर्शी
  rationale: यह एक प्रचलित भविष्यद्वक्ताई पदवी है और ‘seer’ के ऐतिहासिक-धार्मिक अर्थ को बनाए रखती है।
- source_word: עַד לְשִׂמְחָה
  choice: आनन्द के साथ
  rationale: शाब्दिक संरचना असामान्य ‘आनन्द तक/के लिए’ है। सन्दर्भ में यह आनन्द से चिह्नित स्तुति का भाव देती है; अस्पष्ट शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּקְּדוּ וַיִּשְׁתַּחֲווּ
  choice: उन्होंने सिर झुकाया और दण्डवत किया
  rationale: 'दो अलग इब्रानी क्रियाओं को अलग रखा गया है: पहली झुकने और दूसरी उपासना में भूमि तक झुकने/दण्डवत करने को व्यक्त करती है।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में टेट्राग्रामटन प्रत्यक्ष है। हिन्दी बाइबलीय परम्परा में परिचित व्यक्तिगत नाम ‘यहोवा’ पाठक के लिए स्पष्ट है और इसे केवल उपाधि में नहीं बदलता।
- issue: अन्तिम दो क्रियाओं का सम्बन्ध
  choice: दो समन्वित क्रियाएँ—‘सिर झुकाया और दण्डवत किया’
  alternative: एक संयुक्त भाव—‘दण्डवत करके आराधना की’
  rationale: इब्रानी में दो पृथक क्रियाएँ हैं। उन्हें अलग रखने से शारीरिक झुकाव और उपासनात्मक दण्डवत, दोनों की अभिव्यक्ति बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय रजिस्टर अपनाया गया है। ‘लेवी’, ‘दर्शी’, ‘स्तुति’ और ‘दण्डवत’ जैसे परिचित धार्मिक शब्द रखे गए हैं। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b] उपस्थित हैं।
