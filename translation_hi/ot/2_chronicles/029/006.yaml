source:
  edition: WLC
  text: כִּֽי מָעֲל֣וּ אֲבֹתֵ֗י/נוּ וְ/עָשׂ֥וּ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֵ֖י/נוּ וַ/יַּֽעַזְבֻ֑/הוּ וַ/יַּסֵּ֧בּוּ פְנֵי/הֶ֛ם מִ/מִּשְׁכַּ֥ן יְהוָ֖ה וַ/יִּתְּנוּ עֹֽרֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/006.yaml
  text: For our fathers acted unfaithfully and did what was evil in the eyes of Yahweh our God[a]. They abandoned him, turned their faces away from the dwelling place of Yahweh[c][b], and turned their backs.
translation:
  language: hi
  text: क्योंकि हमारे पुरखाओं ने विश्वासघात किया और वह किया जो हमारे परमेश्वर यहोवा की दृष्टि में बुरा था। उन्होंने उसे छोड़ दिया, यहोवा के निवासस्थान से अपना मुँह फेर लिया और पीठ फेर ली।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “गरदन दी”; यह मुहावरा हठपूर्वक मुँह फेरने या अस्वीकार करने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעֲלוּ
  choice: विश्वासघात किया
  rationale: क्रिया מעל निष्ठा भंग करने को व्यक्त करती है और यहाँ वाचा तथा उपासना के संदर्भ में धार्मिक विश्वासघात का भाव रखती है।
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: जो ... यहोवा की दृष्टि में बुरा था
  rationale: עשה הרע का स्वाभाविक हिन्दी रूप है, जबकि 'दृष्टि में' मूल इब्रानी रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप 'यहोवा' व्यक्तिगत दिव्य नाम को किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: וַיַּעַזְבֻהוּ
  choice: उन्होंने उसे छोड़ दिया
  rationale: עזב यहाँ परमेश्वर से संबंध और उपासना त्यागने को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיַּסֵּבּוּ פְנֵיהֶם
  choice: अपना मुँह फेर लिया
  rationale: यह मूल के शारीरिक रूपक और जानबूझकर विमुख होने के भाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: מִמִּשְׁכַּן יְהוָה
  choice: यहोवा के निवासस्थान से
  rationale: מִשְׁכָּן का मूल अर्थ निवासस्थान है; इस प्रसंग में यह मंदिर की ओर संकेत करता है, इसलिए 'तंबू' भ्रम उत्पन्न कर सकता है।
- source_word: וַיִּתְּנוּ עֹרֶף
  choice: उसकी ओर पीठ कर ली
  rationale: शाब्दिक रूप से 'गरदन दी'; हिन्दी मुहावरा 'पीठ कर ली' अस्वीकार और विद्रोही विमुखता को स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण 'यहोवा' नाम को उपाधि 'प्रभु' से बदले बिना पठनीय रखता है।
- issue: मंदिर-कालीन संदर्भ में מִשְׁכָּן
  choice: निवासस्थान
  alternative: मिलापवाला तंबू / पवित्रस्थान
  rationale: यह शब्द यहोवा के निवास को बताता है और यहाँ मंदिर संदर्भित है; 'निवासस्थान' शब्दार्थ को बचाते हुए मरुभूमि के तंबू का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। 'पुरखाओं', 'विश्वासघात' और 'निवासस्थान' से ऐतिहासिक, वाचागत और उपासना-संबंधी भाव स्पष्ट रहते हैं; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
