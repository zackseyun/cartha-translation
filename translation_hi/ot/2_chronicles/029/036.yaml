source:
  edition: WLC
  text: וַ/יִּשְׂמַ֤ח יְחִזְקִיָּ֨הוּ֙ וְ/כָל הָ/עָ֔ם עַ֛ל הַ/הֵכִ֥ין הָ/אֱלֹהִ֖ים לָ/עָ֑ם כִּ֥י בְּ/פִתְאֹ֖ם הָיָ֥ה הַ/דָּבָֽר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/036.yaml
  text: And Hezekiah rejoiced[a], and all the people, because God had prepared for the people, for the matter had happened suddenly.
translation:
  language: hi
  text: हिजकिय्याह और सारी प्रजा इस बात पर आनन्दित हुए कि परमेश्वर ने प्रजा के लिए तैयारी की थी[a], क्योंकि यह बात अचानक हुई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने प्रजा के लिए यह स्थापित किया था”; अथवा, “परमेश्वर ने प्रजा को तैयार किया था।”
    reason: इब्रानी में ‘तैयार/स्थापित करने’ का कर्म स्पष्ट नहीं है। לָעָם का सामान्य अर्थ ‘प्रजा के लिए’ है, जबकि संदर्भ में ‘प्रजा को’ भी एक सम्भव व्याख्या है।
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: आनन्दित हुए
  rationale: שׂמח हर्षित या आनन्दित होने को व्यक्त करता है। संयुक्त कर्ता ‘हिजकिय्याह और सारी प्रजा’ के कारण हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: यह नाम आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְכָל הָעָם
  choice: और सारी प्रजा
  rationale: עָם यहाँ एकत्रित समुदाय को दर्शाता है; ‘सारी प्रजा’ वर्तमान, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: עַל
  choice: इस बात पर
  rationale: आनन्द व्यक्त करने वाली क्रिया के बाद עַל आनन्द के कारण या अवसर को सूचित करता है। ‘इस बात पर’ कारण और प्रसंग दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַהֵכִין
  choice: तैयारी कर दी थी
  rationale: כון के हिफ़ील रूप का अर्थ तैयार करना, तैयार कर देना या स्थापित करना हो सकता है। यहाँ उपासना की शीघ्र पुनर्स्थापना के संदर्भ में ‘तैयारी कर दी थी’ सबसे स्वाभाविक है और किसी अनकहे कर्म को जबरन नहीं जोड़ता।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक हिन्दी धार्मिक पद है।
- source_word: לָעָם
  choice: प्रजा के लिए
  rationale: ל यहाँ लाभ या प्रयोजन का भाव देता है। ‘प्रजा के लिए’ मूल की व्याकरणिक बनावट को बनाए रखता है और यह दावा नहीं करता कि स्वयं प्रजा ही प्रत्यक्ष कर्म थी।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले उपवाक्य को व्याख्यात्मक कारण के रूप में प्रस्तुत करता है।
- source_word: בְּפִתְאֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण अप्रत्याशित शीघ्रता या आकस्मिकता को व्यक्त करता है।
- source_word: הָיָה הַדָּבָר
  choice: यह काम ... हो गया था
  rationale: דָּבָר का अर्थ बात, काम, घटना या विषय हो सकता है। संदर्भ में ‘यह काम’ सुधार और उपासना की पुनर्स्थापना की समूची घटना को स्वाभाविक रूप से इंगित करता है।
theological_decisions:
- issue: प्रजा के लिए परमेश्वर की तैयारी का स्वरूप
  choice: परमेश्वर ने प्रजा के लिए तैयारी कर दी थी
  alternative: परमेश्वर ने प्रजा के लिए यह स्थापित किया था; अथवा, परमेश्वर ने प्रजा को तैयार किया था
  rationale: इब्रानी לָעָם स्वाभाविक रूप से ‘प्रजा के लिए’ का अर्थ देता है और הֵכִין का कर्म स्पष्ट नहीं करता। मुख्य पाठ इसलिए परमेश्वर की सक्रिय भूमिका को बनाए रखते हुए अनकहे कर्म की पहचान नहीं करता; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘इस बात पर आनन्दित हुए’ सामान्य पाठक के लिए सहज है, जबकि ‘प्रजा के लिए तैयारी’ मूल इब्रानी की वास्तविक अस्पष्टता को अनावश्यक रूप से हल नहीं करती।
