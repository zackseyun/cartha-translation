base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/031.yaml
  text: Then Hezekiah answered and said[a], “Now you have filled your hand for Yahweh. Come near and bring sacrifices and thank offerings to the house of Yahweh.” And the assembly brought sacrifices and thank offerings, and all who were willing of heart brought burnt offerings.
translation:
  language: hi
  text: तब हिजकिय्याह ने कहा, “अब तुमने यहोवा के लिए अपने आपको पवित्र सेवा में समर्पित कर दिया है।[a] पास आओ और यहोवा के भवन में बलिदान और धन्यवाद-बलि ले आओ।” तब सभा बलिदान और धन्यवाद-बलि लाई, और जो मन से इच्छुक थे, वे होमबलियाँ लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “तुमने यहोवा के लिए अपना हाथ भर लिया है”; यह पवित्र सेवा के लिए प्रतिष्ठित या समर्पित होने का हिब्रानी मुहावरा है।'
    reason: मूल हिब्रानी मुहावरे का शाब्दिक रूप और उसका आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने कहा
  rationale: हिब्रानी कथात्मक युग्म का शाब्दिक रूप ‘उत्तर दिया और कहा’ है, पर यहाँ कोई स्पष्ट प्रश्न नहीं है; आधुनिक हिन्दी में ‘ने कहा’ स्वाभाविक रूप से भाषण का परिचय देता है।
- source_word: מִלֵּאתֶם יֶדְכֶם
  choice: अपने आपको पवित्र सेवा में समर्पित कर दिया है
  rationale: शाब्दिक अर्थ ‘अपना हाथ भर लिया है’ है, किंतु यह पवित्र सेवा के लिए प्रतिष्ठित अथवा समर्पित होने का पारिभाषिक मुहावरा है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी मूल बिंब सुरक्षित रखती है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ समर्पण के लक्ष्य अथवा संबंध को व्यक्त करता है; ‘के लिए’ हिन्दी में इसे स्वाभाविक ढंग से प्रकट करता है।
- source_word: גֹּשׁוּ
  choice: पास आओ
  rationale: क्रिया का अर्थ निकट आना है और इस प्रसंग में आराधना तथा बलि चढ़ाने के लिए आगे आने का भाव रखता है।
- source_word: זְבָחִים
  choice: बलिदान
  rationale: यह वध किए जाने वाले बलिदानों के लिए व्यापक पद है; हिन्दी में ‘बलिदान’ संक्षिप्त और प्रचलित है।
- source_word: תוֹדוֹת
  choice: धन्यवाद-बलि
  rationale: यह धन्यवाद प्रकट करने वाली विशिष्ट बलियों को सूचित करता है; संयुक्त पद सामान्य धन्यवाद से इसके अनुष्ठानिक अर्थ को अलग रखता है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ मूल בית की उपमा और धार्मिक अभिव्यक्ति को सुरक्षित रखता है; गति-सूचक क्रिया ‘लाओ’ के साथ हिन्दी में ‘में’ गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַקָּהָל
  choice: सभा
  rationale: यह एकत्र समुदाय को दर्शाता है; ‘सभा’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: כָל נְדִיב לֵב
  choice: जितनों का मन स्वेच्छा से प्रेरित था
  rationale: वाक्यांश हृदय से उत्पन्न स्वैच्छिक तत्परता अथवा उदारता बताता है; यह अनुवाद स्वेच्छा और आंतरिक प्रेरणा दोनों बनाए रखता है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह पूरी तरह आग में चढ़ाई जाने वाली बलियों का स्थापित हिन्दी धार्मिक पद है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: מִלֵּאתֶם יֶדְכֶם की व्याख्या
  choice: पवित्र सेवा में समर्पित होना
  alternative: अपना हाथ भरना
  rationale: यह याजकीय अथवा पवित्र सेवा के लिए प्रतिष्ठापन का हिब्रानी मुहावरा है। केवल शाब्दिक हिन्दी अर्थ को अपारदर्शी बना देती; इसलिए अर्थ मुख्य पाठ में और वास्तविक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘यहोवा का भवन’, ‘धन्यवाद-बलि’ और ‘होमबलियाँ’ जैसे पद मूल के उपासना-संबंधी स्वर को सुरक्षित रखते हैं, जबकि कठिन हिब्रानी मुहावरे को मुख्य पाठ में सुबोध बनाया गया है।
