source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ לְ/הַעֲל֥וֹת הָ/עֹלָ֖ה לְ/הַ/מִּזְבֵּ֑חַ וּ/בְ/עֵ֞ת הֵחֵ֣ל הָֽ/עוֹלָ֗ה הֵחֵ֤ל שִׁיר יְהוָה֙ וְ/הַ/חֲצֹ֣צְר֔וֹת וְ/עַ֨ל יְדֵ֔י כְּלֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/027.yaml
  text: Then Hezekiah commanded to offer up the burnt offering on the altar[a]. And at the time the burnt offering began, the song of Yahweh began also[b], with the trumpets and by means of the instruments of David king of Israel.
translation:
  language: hi
  text: तब हिजकिय्याह ने वेदी पर होमबलि चढ़ाने की आज्ञा दी[a]। और जिस समय होमबलि चढ़ाना आरम्भ हुआ, उसी समय याहवे का गीत[b] भी आरम्भ हुआ—तुरहियों के साथ और इस्राएल के राजा दाऊद के वाद्ययंत्रों के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कहा कि होमबलि वेदी पर चढ़ाएँ।”
    reason: मूल क्रिया ‘कहा’ है, पर पूरी इब्रानी रचना इस प्रसंग में निर्देश का भाव देती है।
  - marker: b
    text: या, “याहवे के लिए गीत।” इब्रानी में शाब्दिक रूप से “याहवे का गीत” है।
    reason: मूल संबंध-रचना गीत के संबंध या उसकी दिशा को स्पष्ट रूप से सीमित नहीं करती।
lexical_decisions:
- source_word: וַיֹּאמֶר ... לְהַעֲלוֹת
  choice: चढ़ाने की आज्ञा दी
  rationale: यद्यपि אָמַר का सामान्य अर्थ ‘कहना’ है, यहाँ उसके बाद लकारयुक्त धात्वर्थक संज्ञा आने से राजकीय निर्देश का भाव बनता है। यह अनुवाद उस पूरे व्याकरणिक प्रयोग का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलि का मानक पंथ-संबंधी शब्द है जो पूरी तरह जलाकर चढ़ाई जाती थी; आधुनिक हिन्दी बाइबिलीय प्रयोग में ‘होमबलि’ संक्षिप्त और स्पष्ट है।
- source_word: לַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: यह बलि चढ़ाने के स्थान को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֵחֵל ... הֵחֵל
  choice: आरम्भ हुई ... आरम्भ हुआ
  rationale: मूल में एक ही क्रिया की पुनरावृत्ति बलि और गीत के आरम्भ को साथ जोड़ती है; हिन्दी में भी वही पुनरावृत्ति रखी गई है।
- source_word: שִׁיר יְהוָה
  choice: याहवे का गीत
  rationale: यह इब्रानी संबंध-रचना को निकटता से सुरक्षित रखता है और यह तय नहीं करता कि गीत याहवे का, याहवे के लिए, या याहवे को संबोधित था।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण लिप्यंतरण से व्यक्त किया गया है।
- source_word: הַחֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: यहाँ धातु की पंथ-संबंधी तुरहियाँ अभिप्रेत हैं, पर ‘चाँदी की’ मूल पद में स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: וְעַל יְדֵי כְּלֵי דָּוִיד
  choice: दाऊद के वाद्ययंत्रों के द्वारा
  rationale: עַל־יְדֵי के साधनवाचक भाव और उपासना के प्रसंग में כְּלֵי के संगीत-वाद्य अर्थ, दोनों को व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: दाऊद की राजकीय उपाधि को मूल क्रम और अर्थ के अनुरूप रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: שִׁיר יְהוָה में संबंध का अर्थ
  choice: याहवे का गीत
  alternative: याहवे के लिए गीत
  rationale: मूल संबंध-रचना अधिकार, समर्पण या दिशा के बीच पूरी तरह भेद नहीं करती। मुख्य पाठ में उसकी अस्पष्टता रखी गई और स्वाभाविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
- issue: וַיֹּאמֶר ... לְהַעֲלוֹת का निर्देशात्मक बल
  choice: चढ़ाने की आज्ञा दी
  alternative: कहा कि ... चढ़ाएँ
  rationale: सामान्य ‘कहा’ क्रिया यहाँ राजकीय निर्देश देने वाली रचना में प्रयुक्त है। मुख्य पाठ में संदर्भगत बल व्यक्त किया गया, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’, ‘वेदी’, ‘तुरही’ और ‘वाद्ययंत्र’ जैसे स्थापित धार्मिक-सांगीतिक शब्द प्रयुक्त हैं। मूल की दोहरी ‘आरम्भ’ रचना और ‘याहवे का गीत’ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
