  text: וַ/יַּגִּ֨ישׁוּ֙ אֶת שְׂעִירֵ֣י הַֽ/חַטָּ֔את לִ/פְנֵ֥י הַ/מֶּ֖לֶךְ וְ/הַ/קָּהָ֑ל וַ/יִּסְמְכ֥וּ יְדֵי/הֶ֖ם עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/029/023.yaml
  text: Then they brought near the goats for the sin offering before the king and the assembly[b][a], and they laid their hands on them.
translation:
  language: hi
  text: तब वे पापबलि के बकरों को राजा और सभा के सामने ले आए, और उन्होंने अपने हाथ उन पर रखे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''उन्होंने'' का सबसे स्वाभाविक संकेत राजा और सभा की ओर है; संभव है कि सभा की ओर से प्रतिनिधियों ने यह किया हो।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּישׁוּ
  choice: ले आए
  rationale: नגשׁ के हिफ़इल रूप का अर्थ निकट लाना या प्रस्तुत करना है। यहाँ बलिदान के लिए बकरों को सामने लाने की ठोस क्रिया को सहज हिन्दी में व्यक्त किया गया है।
- source_word: שְׂעִירֵי הַחַטָּאת
  choice: पापबलि के बकरों
  rationale: שָׂעִיר नर बकरे को और חַטָּאת इस बलिदान-संबंधी प्रसंग में पाप के लिए चढ़ाए जाने वाले बलिदान को सूचित करता है। 'पापबलि' संक्षिप्त और प्रचलित हिन्दी पारिभाषिक शब्द है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यहाँ यह राजा और एकत्रित सभा की उपस्थिति में बकरों को प्रस्तुत किए जाने का भाव देता है।
- source_word: הַמֶּלֶךְ וְהַקָּהָל
  choice: राजा और सभा
  rationale: קָהָל एकत्रित समुदाय को दर्शाता है। 'सभा' आधुनिक, सहज और अनावश्यक सांप्रदायिक रंग से मुक्त है।
- source_word: וַיִּסְמְכוּ יְדֵיהֶם
  choice: उन्होंने अपने हाथ ... रखे
  rationale: बलिदान के प्रसंग में סמך ידיים पशु पर हाथ रखने की विधिपूर्वक क्रिया है। हिन्दी में 'अपने हाथ रखे' स्वाभाविक है और बहुवचन 'हाथ' मूल के अनुरूप है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: बहुवचन सर्वनाम का संकेत पहले बताए गए बकरों की ओर है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप
  rationale: बकरों को सामने लाने और उन पर हाथ रखने के तत्काल प्रसंग से स्पष्ट है कि यहाँ अमूर्त पाप नहीं, पाप के लिए चढ़ाया जाने वाला बलिदान अभिप्रेत है।
- issue: '''उन्होंने अपने हाथ रखे'' के कर्ता का संदर्भ'
  choice: अनुवाद में अस्पष्ट सर्वनाम 'उन्होंने' बनाए रखा गया; निकटतम संदर्भ राजा और सभा है
  alternative: याजकों ने बकरों पर हाथ रखे
  rationale: इब्रानी में कर्ता व्यक्त नहीं किया गया है। निकटतम पूर्वपद 'राजा और सभा' है, पर यह क्रिया प्रतिनिधियों के माध्यम से भी हुई हो सकती है। मुख्य पाठ मूल की अभिव्यक्ति और उसके तनाव को बिना अतिव्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुकूल। 'पापबलि' जैसी स्थापित बाइबलीय शब्दावली रखी गई है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
