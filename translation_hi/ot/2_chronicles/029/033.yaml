  rationale: मूल की सामान्य संख्या-संरचना का सीधा अनुवाद।
- source_word: וְצֹאן
  choice: और भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू झुंड-पशुओं का सामूहिक शब्द है और इसमें भेड़ तथा बकरियाँ दोनों आ सकती हैं; ‘भेड़-बकरियाँ’ इस व्यापकता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार
  rationale: मूल की सामान्य संख्या-संरचना का सीधा अनुवाद।
