id: 2CH.18.13
reference: 2 Chronicles 18:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֛י אֶת אֲשֶׁר יֹאמַ֥ר אֱלֹהַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/013.yaml
  text: But Micaiah said[a], “As Yahweh lives, whatever my God says, that I will speak.”
translation:
  language: hi
  text: पर मीकायाह ने कहा, “याहवे के जीवन की शपथ[a], मेरे परमेश्वर जो कुछ कहेंगे, मैं वही बोलूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे जीवित हैं; मेरे परमेश्वर जो कहेंगे, मैं वही बोलूँगा।”
    reason: इब्रानी सूत्र חַי יְהוָה को शपथ के रूप में या अधिक शाब्दिक घोषणात्मक वाक्य के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, पर पिछले पद में दूत के दबाव के उत्तर में यहाँ स्पष्ट विरोध है; इसलिए आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह एक प्रचलित इब्रानी शपथ-सूत्र है। यह हिन्दी रूप उसके शपथ-संबंधी बल को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֵת אֲשֶׁר
  choice: जो कुछ
  rationale: वस्तु-सूचक चिह्न और संबंधवाचक पद मिलकर कही जाने वाली समस्त बात को सूचित करते हैं; ‘जो कुछ’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: יֹאמַר
  choice: कहेंगे
  rationale: अपूर्ण क्रिया इस तत्काल प्रसंग में परमेश्वर द्वारा आगे कही जाने वाली बात को व्यक्त करती है। आदरसूचक बहुवचन हिन्दी में परमेश्वर के लिए स्वाभाविक है।
- source_word: אֱלֹהַי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: אֹתוֹ
  choice: वही
  rationale: यह पुनरुक्त वस्तु-सर्वनाम परमेश्वर द्वारा कही गई बात की ओर लौटता है; हिन्दी में ‘वही’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדַבֵּר
  choice: मैं ... बोलूँगा
  rationale: पिएल रूप का अर्थ यहाँ भविष्यवाणी के रूप में ‘बोलना’ है; वचन की गंभीरता और वक्ता की प्रतिबद्धता दोनों सुरक्षित हैं।
theological_decisions:
- issue: शपथ-सूत्र में יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से बदले बिना निकट लिप्यंतरण में सुरक्षित रखता है।
- issue: חַי יְהוָה का वाक्यगत बल
  choice: याहवे के जीवन की शपथ
  alternative: याहवे जीवित हैं
  rationale: प्रसंग में यह नबी की गंभीर प्रतिज्ञा है, इसलिए मुख्य पाठ में शपथ का भाव स्पष्ट किया गया है; शाब्दिक घोषणात्मक संरचना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर’ पिछले पद के दबाव के प्रति मीकायाह के विरोधी उत्तर को दिखाता है; ‘जो कुछ ... वही’ इब्रानी संबंधवाचक और पुनरुक्त सर्वनाम की संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
