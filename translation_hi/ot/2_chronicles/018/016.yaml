  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפוֹצִ֣ים עַל הֶֽ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ן רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/016.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: hi
  text: उसने कहा, “मैंने सारे इस्राएल को पहाड़ों पर तितर-बितर देखा—ऐसी भेड़ों के समान जिनका कोई चरवाहा न हो।[a] याहवे ने कहा, ‘इनके कोई स्वामी नहीं हैं।[b] हर एक अपने घर शांति से लौट जाए।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक संक्षेप में: “चरवाहे के बिना भेड़ों के समान।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इनके कोई स्वामी नहीं हैं”; कुछ अनुवाद सामूहिक अर्थ के कारण एकवचन “कोई स्वामी नहीं है” रखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפוֹצִים
  choice: तितर-बितर
  rationale: यह निष्क्रिय कृदंत पराजय के बाद लोगों के बिखर जाने का चित्र प्रस्तुत करता है; ‘तितर-बितर’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य तथा चरवाही—दोनों संदर्भों के अनुकूल है।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: यह स्थानसूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶן רֹעֶה
  choice: ऐसी भेड़ों के समान जिनका कोई चरवाहा न हो
  rationale: यह इब्रानी उपमा और उसके संबंधवाचक वाक्य की संरचना को गरिमापूर्ण, सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के इब्रानी रूप का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לֹא אֲדֹנִים לָאֵלֶּה
  choice: इनका कोई स्वामी नहीं है
  rationale: हिन्दी में सामूहिक नेतृत्व-विहीनता व्यक्त करने के लिए एकवचन ‘स्वामी’ अधिक स्वाभाविक है; इब्रानी में प्रयुक्त बहुवचन ‘स्वामियों’ की सूचना पादटिप्पणी में सुरक्षित है।
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: हर एक अपने घर ... लौट जाए
  rationale: ‘हर एक’ אִישׁ की वितरणात्मक भावना और ‘लौट जाए’ आदेशार्थक/अनुज्ञार्थक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשָׁלוֹם
  choice: शांति से
  rationale: यह मूल शब्द का निकट अनुवाद है और सुरक्षित तथा बिना आगे संघर्ष के घर लौटने का निहित भाव भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: אֲדֹנִים की संख्या और आशय
  choice: मुख्य पाठ में ‘कोई स्वामी नहीं है’, बहुवचन रूप पादटिप्पणी में
  alternative: इनके कोई स्वामी नहीं हैं
  rationale: इब्रानी संज्ञा रूपतः बहुवचन है, पर प्रसंग राजा की मृत्यु के कारण सामूहिक नेतृत्व के अभाव का है। स्वाभाविक हिन्दी के लिए एकवचन रखा गया और रूपगत तनाव को पादटिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। कथन में दृश्यात्मक चरवाही की उपमा बनी रहती है। ‘याहवे’ द्वारा मूल व्यक्तिगत नाम सुरक्षित है। ‘हर एक’ सामान्य जनसमूह में प्रत्येक व्यक्ति का वितरणात्मक संकेत देता है, बिना अनावश्यक रूप से पुरुषवाचक शब्द जोड़ने के।
