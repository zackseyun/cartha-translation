base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/005.yaml
  text: So the king of Israel gathered the prophets[a], four hundred men, and said to them, “Should we go to Ramoth-gilead for battle, or should I refrain?” And they said, “Go up[b], and God will give it into the hand of the king.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने चार सौ पुरुष नबियों को इकट्ठा किया और उनसे पूछा, “क्या हम युद्ध करने के लिए रामोत-गिलाद जाएँ, या मैं रुक जाऊँ?” उन्होंने उत्तर दिया, “चढ़ाई कीजिए! परमेश्वर उसे[a] राजा[b] के हाथ में सौंप देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में ‘उसे’ के लिए कोई अलग शब्द नहीं है; कर्म प्रसंग से समझा जाता है।
    reason: implicit_object
  - marker: b
    text: हिब्रू में केवल ‘राजा’ है; यह नहीं कहा गया कि ‘आपके हाथ में।’
    reason: preserve_ambiguity
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ इकट्ठा या एकत्र करना है; यह आधुनिक हिन्दी में सहज है।
- source_word: הַנְּבִאִים
  choice: नबियों
  rationale: נביאים के लिए ‘नबी’ मानक, प्रचलित और सन्दर्भानुकूल शब्द है।
- source_word: אַרְבַּע מֵאוֹת אִישׁ
  choice: कुल चार सौ पुरुषों को
  rationale: मूल पाठ संख्या के साथ אִישׁ (‘पुरुष’) भी स्पष्ट रूप से रखता है; ‘कुल’ हिन्दी वाक्य में इसे स्वाभाविक ढंग से जोड़ता है।
- source_word: הֲנֵלֵךְ
  choice: क्या हम ... जाएँ
  rationale: क्रिया प्रथम पुरुष बहुवचन है; इसलिए राजा स्वयं को प्रस्तावित अभियान में सम्मिलित करता है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और संयुक्त नाम को योजक चिह्न से रखा गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: उपसर्ग ל उद्देश्य व्यक्त करता है; यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: אִם אֶחְדָּל
  choice: या मैं रुक जाऊँ
  rationale: यहाँ क्रिया प्रथम पुरुष एकवचन है। ‘हम जाएँ’ से ‘मैं रुक जाऊँ’ का मूल वचन-परिवर्तन जानबूझकर सुरक्षित रखा गया है।
- source_word: עֲלֵה
  choice: चढ़ाई कीजिए
  rationale: עלה का मूल भाव ‘ऊपर जाना/चढ़ना’ है और सैन्य प्रसंग में ‘चढ़ाई करना’ स्वाभाविक हिन्दी अभिव्यक्ति है। आदरसूचक आज्ञार्थक रूप राजा को दिए गए उत्तर के अनुरूप है।
- source_word: וְיִתֵּן
  choice: सौंप देगा
  rationale: נתן का मूल अर्थ ‘देना’ है; ‘हाथ में’ वाले मुहावरे के साथ ‘सौंप देना’ हिन्दी में अधिकार में कर देने का भाव सहज रूप से व्यक्त करता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: रूप आकारतः बहुवचन है, पर इसके साथ क्रिया एकवचन है; अतः यहाँ एकवचन ईश्वर का संकेत है।
- source_word: בְּיַד הַמֶּלֶךְ
  choice: राजा के हाथ में
  rationale: हिब्रू मुहावरे की ‘हाथ’ वाली छवि सुरक्षित है; प्रसंग में इसका अर्थ राजा के अधिकार या वश में सौंपना है।
theological_decisions:
- issue: नबियों के उत्तर में ‘राजा’ का अभिप्रेत व्यक्ति
  choice: मूल पाठ की तरह केवल ‘राजा’ रखा गया है
  alternative: ‘इस्राएल के राजा’ या ‘आपके हाथ में’ कहकर अहाब को स्पष्ट करना
  rationale: हिब्रू में यहाँ केवल הַמֶּלֶךְ (‘राजा’) है। अनुवाद उस व्यक्ति को मूल से अधिक स्पष्ट करके अस्पष्टता का समाधान नहीं करता।
- issue: नबियों के कथन में निहित कर्म
  choice: हिन्दी की सहजता के लिए ‘उसे’ जोड़ा गया है और पादटिप्पणी में इसकी निहितता बताई गई है
  alternative: कर्म को छोड़कर अत्यधिक शाब्दिक, पर अस्वाभाविक हिन्दी वाक्य बनाना
  rationale: हिब्रू में נתן का कर्म व्यक्त नहीं है; प्रसंग रामोत-गिलाद अथवा अभियान के लक्ष्य की ओर संकेत करता है। ‘उसे’ इस संकेत को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजा के प्रश्न में बहुवचन ‘हम जाएँ’ से एकवचन ‘मैं रुक जाऊँ’ का परिवर्तन सुरक्षित है। ‘चढ़ाई कीजिए’ सैन्य प्रसंग को व्यक्त करता है, जबकि ‘राजा के हाथ में’ मूल हिब्रू मुहावरे की छवि बनाए रखता है।
