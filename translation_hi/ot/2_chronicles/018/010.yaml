source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ ל֛/וֹ צִדְקִיָּ֥הוּ בֶֽן כְּנַעֲנָ֖ה קַרְנֵ֣י בַרְזֶ֑ל וַ/יֹּ֨אמֶר֙ כֹּֽה אָמַ֣ר יְהוָ֔ה בְּ/אֵ֛לֶּה תְּנַגַּ֥ח אֶת אֲרָ֖ם עַד כַּלּוֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/010.yaml
  text: 'Then Zedekiah son of Chenaanah made horns of iron for himself and said[b][a], “Thus says Yahweh: With these you will gore Aram until they are finished off.”'
translation:
  language: hi
  text: 'तब कनाना के पुत्र सिदकिय्याह ने अपने लिए लोहे के सींग बनाए और कहा, “याहवे यों कहता है: इनसे तू अराम[b] को सींग मारेगा[a], जब तक उनका अंत न हो जाए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धकेलता जाएगा”; इब्रानी क्रिया सींगधारी पशु के सींग मारने या सींगों से धकेलने की क्रिया बताती है।
    reason: lexical_alternative
  - marker: b
    text: “अराम” से यहाँ अरामी लोग या उनका राज्य भी समझा जा सकता है; बाद के, कम सटीक भौगोलिक नाम से इसे “सीरिया” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: अपने लिए ... बनाए
  rationale: לּוֹ को प्रसंग में कर्ता की ओर लौटने वाले हितार्थक अर्थ में लिया गया है; सिदकिय्याह इन सींगों को भविष्यसूचक प्रतीक-क्रिया के लिए बनाता है।
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: कनाना के पुत्र सिदकिय्याह
  rationale: इब्रानी संरक्षक-नाम संरचना को स्वाभाविक हिन्दी में रखा गया और व्यक्तिनामों का लिप्यंतरण किया गया।
- source_word: קַרְנֵי בַרְזֶל
  choice: लोहे के सींग
  rationale: मूल उपमान और शक्ति/आक्रमण की ठोस छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: भविष्यसूचक संदेश-सूत्र को वर्तमानकालीन रूप और परमेश्वर के निजी नाम के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאֵלֶּה
  choice: इनसे
  rationale: बहुवचन संकेतवाचक लोहे के सींगों की ओर इशारा करता है और בְּ का साधनवाचक अर्थ देता है।
- source_word: תְּנַגַּח
  choice: तू ... सींग मारेगा
  rationale: נגח सींगधारी पशु के सींग मारने या धक्का देने की क्रिया है; सींगों की प्रतीक-क्रिया के कारण ठोस छवि बनाए रखी गई है।
- source_word: אֶת אֲרָם
  choice: अराम को
  rationale: मूल ऐतिहासिक नाम को रखा गया है; प्रसंग में यह अरामी लोगों/राज्य का द्योतक हो सकता है।
- source_word: עַד כַּלּוֹתָם
  choice: जब तक उनका पूरी तरह अंत न हो जाए
  rationale: כלה के समाप्ति अथवा विनाश के परिणाम को व्यक्त करता है और मूल की तरह उस परिणाम को लाने वाले कर्ता को स्पष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में प्रयुक्त चतुरक्षरीय निजी नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- issue: עַד כַּלּוֹתָם में समाप्ति का स्वरूप
  choice: जब तक उनका पूरी तरह अंत न हो जाए
  alternative: जब तक तू उन्हें नष्ट न कर दे
  rationale: चुना गया पाठ विनाश की तीव्रता व्यक्त करता है, पर मूल में अनकहे कर्ता को जोड़कर धार्मिक या कथात्मक तनाव को समय से पहले नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यसूचक सूत्र के लिए “यों कहता है,” प्रतीकात्मक क्रिया के लिए ठोस “सींग मारेगा,” और पूर्ण विनाश के लिए स्वाभाविक किन्तु गंभीर “पूरी तरह अंत” चुना गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
