  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הַ/מֶּ֔לֶךְ עַד כַּ/מֶּ֥ה פְעָמִ֖ים אֲנִ֣י מַשְׁבִּיעֶ֑/ךָ אֲ֠שֶׁר לֹֽא תְדַבֵּ֥ר אֵלַ֛/י רַק אֱמֶ֖ת בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/015.yaml
  text: Then the king said to him, “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: hi
  text: तब राजा ने उससे कहा, “मुझे तुम्हें कितनी बार शपथ दिलानी पड़ेगी कि तुम याहवे के नाम से मुझसे केवल सत्य ही कहो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ क्रम और स्वाभाविक हिन्दी कथाप्रवाह दोनों व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पदवी का सीधा अनुवाद; इब्रानी पाठ व्यक्तिगत नाम नहीं देता।
- source_word: עַד כַּמֶּה פְעָמִים
  choice: कितनी बार
  rationale: यह बार-बार होने से उत्पन्न झुँझलाहट व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: מַשְׁבִּיעֶךָ
  choice: तुम्हें शपथ दिलानी पड़ेगी
  rationale: שבע का हिफ़ील रूप किसी को शपथ खिलाने या शपथ के अधीन करने का अर्थ देता है; ‘पड़ेगी’ प्रश्न की खिन्न और आग्रहपूर्ण शक्ति व्यक्त करता है।
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: कि तुम मुझसे ... केवल सच ही कहो
  rationale: शपथ दिलाने की क्रिया के बाद नकार और רַק का संयुक्त आशय है कि सत्य के अतिरिक्त कुछ न कहा जाए। हिन्दी में सकारात्मक प्रतिबंध ‘केवल सच ही’ अधिक स्वाभाविक है।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम में
  rationale: בְּשֵׁם भविष्यवाणी के कथन की अधिकारपूर्ण और पवित्र आधारभूमि दर्शाता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वतापूर्ण स्वरूप है और पदवी से अलग उस नाम को बनाए रखता है।
- issue: राजा के प्रश्न में शपथ और सत्य की अभिव्यक्ति
  choice: केवल सच ही कहो
  alternative: सत्य के सिवा मुझसे कुछ न कहो
  rationale: मूल की नकारात्मक संरचना का आशय बिना किसी असत्य के केवल सत्य बोलना है। चुना हुआ रूप इसे स्वाभाविक हिन्दी में रखता है और कथन की व्यापकता को किसी विशेष भविष्यवाणी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शपथ दिलानी’ न्यायिक और धार्मिक गंभीरता बनाए रखता है, जबकि ‘केवल सच ही कहो’ सामान्य पाठक के लिए सहज है।
