  text: וַ/אֲמַרְתֶּ֗ם כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ שִׂ֥ימוּ זֶ֖ה בֵּ֣ית הַ/כֶּ֑לֶא וְ/הַאֲכִלֻ֜/הוּ לֶ֤חֶם לַ֨חַץ֙ וּ/מַ֣יִם לַ֔חַץ עַ֖ד שׁוּבִ֥/י בְ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/026.yaml
  text: 'and say[a], ‘Thus says the king: Put this man in the prison, and feed him with bread of affliction and water of affliction until I return in peace.’'
translation:
  language: hi
  text: 'और कहना, ‘राजा यह कहता है: इस आदमी को बन्दीगृह में डाल दो और मेरे सकुशल लौटने तक इसे कष्ट की रोटी और कष्ट का पानी देते रहो।’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कष्ट की रोटी और कष्ट का पानी’ का अनुवाद ‘तंगी की रोटी और तंगी का पानी’ भी हो सकता है; सम्भवतः आशय कारावास में मिलने वाले कम राशन और कठिन दशा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: और कहना
  rationale: बहुवचन आज्ञार्थक भाव में चल रहे आदेश को स्वाभाविक हिन्दी में जारी रखता है।
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा यह कहता है
  rationale: राजकीय सन्देश के मानक सूत्र को वर्तमानकालीन, सहज हिन्दी में व्यक्त करता है।
- source_word: שִׂימוּ זֶה
  choice: इस आदमी को ... डाल दो
  rationale: संकेतवाचक זֶה का व्यक्ति-सन्दर्भ स्पष्ट करता है और मूल के कुछ उपेक्षापूर्ण संकेत को अतिरंजित नहीं करता।
- source_word: בֵּית הַכֶּלֶא
  choice: बन्दीगृह में
  rationale: ‘कैद के घर’ के लिए संक्षिप्त, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी।
- source_word: וְהַאֲכִלֻהוּ
  choice: इसे ... देते रहो
  rationale: हिफ़ील आज्ञार्थक का भाव ‘इसे खिलाओ/दो’ है; पानी के समानान्तर संयुक्त वाक्य में ‘देते रहो’ स्वाभाविक है और ‘तक’ की अवधि को दर्शाता है।
- source_word: לֶחֶם לַחַץ
  choice: कष्ट की रोटी
  rationale: मूल रूपक और לַחַץ के कष्ट, तंगी अथवा उत्पीड़न के अर्थ को सुरक्षित रखता है।
- source_word: וּמַיִם לַחַץ
  choice: कष्ट का पानी
  rationale: रोटी और पानी के बीच मूल समानान्तरता बनाए रखता है; सन्दर्भ में यह कठिन कारावास अथवा अल्प राशन का संकेत हो सकता है।
- source_word: עַד שׁוּבִי בְשָׁלוֹם
  choice: मेरे सकुशल लौटने तक
  rationale: בְשָׁלוֹם का युद्ध से सुरक्षित लौटने का सन्दर्भ हिन्दी में स्वाभाविक रूप से व्यक्त करता और प्रसंगगत विडम्बना बनाए रखता है।
