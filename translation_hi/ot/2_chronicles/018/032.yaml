source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְאוֹת֙ שָׂרֵ֣י הָ/רֶ֔כֶב כִּ֥י לֹא הָיָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל וַ/יָּשֻׁ֖בוּ מֵ/אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/032.yaml
  text: And when the commanders of the chariots saw that he was not the king of Israel[a], they turned back from following him.
translation:
  language: hi
  text: जब रथ-दल के सेनापतियों ने देखा कि वह इस्राएल का राजा नहीं था, तो उन्होंने उसका पीछा करना छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: जब ... ने देखा
  rationale: वाक्य का आरंभ अगली घटना को समय-सूचक ढंग से प्रस्तुत करता है। आधुनिक हिन्दी में ‘जब ... ने देखा’ स्वाभाविक और संक्षिप्त है।
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथ-दल के सेनापति
  rationale: שָׂרֵי सैन्य अधिकारियों को और הָרֶכֶב रथों से बनी सैन्य टुकड़ी को सूचित करता है; ‘रथ-दल के सेनापति’ अर्थ और सैन्य संदर्भ दोनों स्पष्ट रखता है।
- source_word: כִּי לֹא הָיָה מֶלֶךְ יִשְׂרָאֵל
  choice: कि वह इस्राएल का राजा नहीं है
  rationale: इब्रानी में कर्ता व्यक्त नहीं है, पर अगले पदबंध का एकवचन पुल्लिंग प्रत्यय उसी व्यक्ति की ओर संकेत करता है जिसका वे पीछा कर रहे थे। हिन्दी में ‘वह’ आवश्यक और स्वाभाविक है।
- source_word: וַיָּשֻׁבוּ מֵאַחֲרָיו
  choice: तो उन्होंने उसका पीछा करना छोड़ दिया
  rationale: शाब्दिक रूप ‘उसके पीछे से लौट गए’ इस प्रसंग में एक मुहावरा है, जिसका अर्थ उसका पीछा बंद करना है। चुना गया रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘रथ-दल’ प्राचीन सैन्य संदर्भ को स्पष्ट करता है और ‘पीछा करना छोड़ दिया’ इब्रानी मुहावरे का स्वाभाविक अर्थ देता है।
