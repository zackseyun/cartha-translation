  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: hi
  text: 'और सभी भविष्यद्वक्ता इसी प्रकार भविष्यवाणी कर रहे थे: “रामोत-गिलाद पर चढ़ाई कर और सफल हो; यहोवा उसे राजा के हाथ में दे देगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “...यहोवा ने उसे राजा के हाथ में दे दिया है।” हिब्रू में अंतिम क्रिया पूर्ण पक्ष में है और यहाँ निश्चित भविष्य को ऐसे प्रस्तुत कर सकती है मानो वह पहले ही पूरा हो चुका हो।
    reason: हिब्रू क्रिया के पूर्ण पक्ष और भविष्यसूचक निश्चितता—दोनों संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וְכָל הַנְּבִאִים
  choice: और सभी भविष्यद्वक्ता
  rationale: संयोजक, समष्टिवाचक विशेषण और निश्चित बहुवचन संज्ञा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נִבְּאִים
  choice: भविष्यवाणी कर रहे थे
  rationale: हिब्रू कृदंत यहाँ जारी और समकालीन क्रिया दर्शाता है; इसलिए अपूर्ण भूतकाल उपयुक्त है।
- source_word: כֵּן
  choice: इसी प्रकार
  rationale: यह उनके एक ही ढंग से बोलने की ओर संकेत करता है और रीति-वाचक अर्थ बनाए रखता है।
- source_word: עֲלֵה
  choice: चढ़ाई कर
  rationale: עלה का मूल अर्थ ऊपर जाना है, पर इस सैनिक प्रसंग में ‘चढ़ाई कर’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְהַצְלַח
  choice: और सफल हो
  rationale: क्रिया के सफल होने या सफलता पाने के अर्थ को संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: וְנָתַן יְהוָה
  choice: यहोवा उसे ... कर देगा
  rationale: आज्ञार्थक कथनों के बाद आया हिब्रू पूर्ण पक्ष इस भविष्यसूचक प्रसंग में निश्चित भविष्य व्यक्त कर सकता है; हिन्दी में ‘कर देगा’ उस आश्वासन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित न करके हिन्दी के परिचित लिप्यंतरण में रखा गया है।
- source_word: בְּיַד הַמֶּלֶךְ
  choice: राजा के हाथ में
  rationale: अधिकार या नियंत्रण में सौंपने वाले हिब्रू मुहावरे की बिंबात्मकता हिन्दी में भी स्पष्ट रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार-अक्षरीय व्यक्तिगत नाम है; ‘यहोवा’ उसका हिन्दी में व्यापक रूप से समझा जाने वाला लिप्यंतरण है।
- issue: וְנָתַן का काल-पक्ष
  choice: कर देगा
  alternative: कर दिया है
  rationale: रूप पूर्ण पक्ष में है, पर आज्ञाओं के बाद भविष्यसूचक वाणी में निश्चित परिणाम बता सकता है। मुख्य पाठ में स्वाभाविक भविष्य रखा गया है, जबकि पूर्ण हो चुकी घटना की तरह प्रस्तुत करने की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चढ़ाई कर’ सैनिक प्रसंग स्पष्ट करता है; ‘राजा के हाथ में’ मूल मुहावरे को बनाए रखता है।
