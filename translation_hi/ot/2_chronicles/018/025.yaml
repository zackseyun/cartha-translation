  yaml_path: translation/ot/2_chronicles/018/025.yaml
  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city[b], and to Joash the king’s son.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने कहा, “मीकायाह को लेकर नगर के अधिकारी[a] आमोन और राजा के पुत्र योआश के पास वापस ले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नगर के प्रधान” अथवा “नगर के सेनानायक।” इब्रानी पद नागरिक या सैनिक अधिकारी के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: इब्रानी उपाधि को सीधे रखा गया है; संदर्भ में यह अहाब है, पर मूल पाठ यहाँ उसका नाम नहीं देता।
- source_word: קְחוּ אֶת מִיכָיְהוּ וַהֲשִׁיבֻהוּ
  choice: मीकायाह को लेकर ... वापस ले जाओ
  rationale: לקח का सामान्य अर्थ ‘लेना’ और שוב के हिफ़ील रूप का अर्थ ‘वापस पहुँचाना/ले जाना’ है। संयुक्त हिन्दी वाक्यांश आदेश और वापसी, दोनों भावों को सहज रूप से रखता है।
- source_word: שַׂר הָעִיר
  choice: नगर के अधिकारी
  rationale: שַׂר किसी प्रधान, प्रशासक या सेनानायक का पद बता सकता है। ‘अधिकारी’ यहाँ नागरिक अथवा सैनिक भूमिका को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ सुरक्षित रखता है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है; ‘राजकुमार’ कहना पदवी का अतिरिक्त अर्थ जोड़ सकता था।
