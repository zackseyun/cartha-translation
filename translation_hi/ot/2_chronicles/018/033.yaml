base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/033.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to the charioteer, “Turn your hand and take me out of the camp[c][b], for I am wounded.”
translation:
  language: hi
  text: परन्तु एक आदमी ने बिना किसी खास निशाने के धनुष खींचकर तीर चलाया[a], और वह इस्राएल के राजा को कवच की जुड़ी हुई पट्टियों और छाती के कवच के बीच[b] जा लगा। तब राजा ने सारथी से कहा, “रथ मोड़[c] और मुझे छावनी से बाहर ले चल, क्योंकि मैं घायल हो गया हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भोलेपन में” अथवा “अपनी निष्कपटता में।” इब्रानी अभिव्यक्ति सरलता या निष्कपटता का भाव भी दे सकती है, पर यहाँ सम्भवतः इसका अर्थ है कि उसने किसी खास व्यक्ति को निशाना बनाकर तीर नहीं चलाया।
    reason: lexical_alternative
  - marker: b
    text: इन दोनों कवच-भागों का सटीक रूप अनिश्चित है। सम्भव अर्थ है, “कवच के जोड़ और छाती के कवच के बीच”; आशय यह है कि तीर कवच की एक खुली जगह में लगा।
    reason: cultural_note
  - marker: c
    text: शाब्दिक अर्थ “अपना हाथ फेर” या “अपना हाथ मोड़।” सम्भवतः इसका आशय है कि सारथी रथ को मोड़कर लड़ाई से बाहर ले जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: परन्तु एक आदमी
  rationale: וְ कथा को आगे बढ़ाता है और यहाँ पिछले प्रसंग के विपरीत एक अनपेक्षित घटना सामने लाता है; אִישׁ अनिश्चित रूप से किसी एक आदमी को दर्शाता है।
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: धनुष खींचकर तीर चलाया
  rationale: इब्रानी मुहावरा धनुष खींचने और उससे तीर छोड़ने की पूरी क्रिया को व्यक्त करता है; केवल ‘धनुष खींचा’ आधुनिक हिन्दी में अधूरी क्रिया जैसा लग सकता है।
- source_word: לְתֻמּוֹ
  choice: बिना किसी खास निशाने के
  rationale: शब्द का मूल भाव सरलता या निष्कपटता हो सकता है, पर युद्ध के इस प्रसंग में इसका सबसे स्वाभाविक अर्थ है कि तीरंदाज ने किसी विशेष व्यक्ति को लक्ष्य बनाकर तीर नहीं चलाया। यह ‘संयोग से’ की अपेक्षा अधिक स्पष्ट है और यह आभास नहीं देता कि तीर अनजाने में छूट गया था।
- source_word: וַיַּךְ
  choice: जा लगा
  rationale: נכה का अर्थ मारना या प्रहार करना है। तीर के संदर्भ में ‘जा लगा’ स्वाभाविक हिन्दी है; चोट का परिणाम पद के अंत में अलग से बताया गया है।
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: कवच की जुड़ी हुई पट्टियों और छाती के कवच के बीच
  rationale: דְּבָקִים का संबंध आपस में जुड़ी या चिपकी कवच-पट्टियों से और שִׁרְיָן का शरीर अथवा छाती की रक्षा करने वाले कवच से है। सटीक प्राचीन सैन्य शब्दावली अनिश्चित है, इसलिए पाठ अर्थपूर्ण रहते हुए भी इस भेद को कठोरता से परिभाषित नहीं करता।
- source_word: לָרַכָּב
  choice: सारथी से
  rationale: यहाँ संज्ञा रथ चलाने वाले व्यक्ति को दर्शाती है; ‘सारथी’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: הֲפֹךְ יָדֶיךָ
  choice: अपना हाथ मोड़
  rationale: मूल अभिव्यक्ति का शाब्दिक चित्र सुरक्षित रखा गया है। इसका आशय सारथी को रथ मोड़ने या युद्ध से बाहर ले जाने के लिए उसे दूसरी दिशा में चलाने का आदेश देना है।
- source_word: וְהוֹצֵאתַנִי מִן הַמַּחֲנֶה
  choice: मुझे युद्ध से बाहर ले चल
  rationale: מַחֲנֶה शिविर के साथ-साथ सेना या युद्धरत दल को भी दर्शा सकता है। यहाँ लड़ाई जारी है, इसलिए ‘युद्ध से बाहर’ प्रसंगगत आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי הָחֳלֵיתִי
  choice: क्योंकि मैं घायल हो गया हूँ
  rationale: חלה सामान्यतः बीमार या निर्बल होने को कह सकता है, लेकिन तीर लगने के तत्काल प्रसंग में यह घायल होकर अशक्त होने का भाव देता है। ‘घायल हो गया हूँ’ स्पष्ट है और मूल में निहित न होने वाली तीव्रता नहीं जोड़ता।
