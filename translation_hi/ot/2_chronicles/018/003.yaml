base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/003.yaml
  text: And Ahab king of Israel said to Jehoshaphat king of Judah[a], “Will you go with me to Ramoth-gilead?” And he said to him, “I am as you are, and my people as your people[b], and I am with you in the battle.”
translation:
  language: hi
  text: इस्राएल के राजा अहाब ने यहूदा के राजा यहोशापात से कहा, “क्या तुम मेरे साथ रामोत-गिलाद चलोगे?” उसने उससे कहा, “मैं तुम्हारे जैसा हूँ, और जैसे तुम्हारे लोग, वैसे मेरे लोग[a]; और युद्ध में मैं तुम्हारे साथ हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “तुम्हारे लोग मेरे लोग हैं।” इब्रानी में शब्दशः तुलनात्मक रचना है: “और जैसे तुम्हारे लोग, वैसे मेरे लोग।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में अंतिम वाक्यांश संक्षिप्त और क्रियारहित है; शब्दशः: “और युद्ध में तुम्हारे साथ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ עִמִּי
  choice: क्या तुम मेरे साथ ... चलोगे?
