- source_word: רָמֹת גִּלְעָד
  choice: गिलाद के रामोत
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है; संबंध को स्पष्ट करने के लिए ‘गिलाद के’ रखा गया है।
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: जैसा मैं, वैसे तुम
  rationale: इब्रानी की संक्षिप्त तुलनात्मक और पारस्परिक संरचना को बनाए रखते हुए एकजुटता का भाव व्यक्त किया गया है।
- source_word: וּכְעַמְּךָ עַמִּי
  choice: और जैसे तुम्हारे लोग, वैसे मेरे लोग
  rationale: मूल का शब्दक्रम और तुलनात्मक रूप यथासंभव सुरक्षित है। ‘तुम्हारे लोग मेरे लोग हैं’ अधिक मुहावरेदार है, पर तुलना को पूर्ण पहचान में बदल सकता है।
- source_word: וְעִמְּךָ בַּמִּלְחָמָה
  choice: और युद्ध में मैं तुम्हारे साथ हूँ
  rationale: इब्रानी में क्रिया लुप्त है। हिन्दी की स्पष्टता के लिए ‘मैं ... हूँ’ जोड़ा गया, बिना इसे भविष्यकालीन प्रतिज्ञा के रूप में अधिक व्याख्यायित किए।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: कहा ... उत्तर दिया
  rationale: पहले पद में सामान्य कथन-क्रिया रखी गई है; दूसरे में संवाद की भूमिका स्पष्ट करने के लिए स्वाभाविक हिन्दी ‘उत्तर दिया’ प्रयुक्त है, जिसका संदर्भगत आधार स्पष्ट है।
