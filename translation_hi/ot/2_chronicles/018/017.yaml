id: 2CH.18.17
reference: 2 Chronicles 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ יִשְׂרָאֵ֖ל אֶל יְהוֹשָׁפָ֑ט הֲ/לֹא֙ אָמַ֣רְתִּי אֵלֶ֔י/ךָ לֹא יִתְנַבֵּ֥א עָלַ֛/י ט֖וֹב כִּ֥י אִם לְ/רָֽע־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/017.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: hi
  text: तब इस्राएल के राजा ने यहोशापात से कहा, “क्या मैंने तुमसे नहीं कहा था कि वह मेरे विषय में भलाई की नहीं, बल्कि केवल बुराई की भविष्यवाणी करेगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम बनाए रखता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֶל יְהוֹשָׁפָט
  choice: यहोशापात से
  rationale: वाणी के प्राप्तकर्ता को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है; मूल पाठ की तरह कोई अतिरिक्त उपाधि नहीं जोड़ी गई।
- source_word: הֲלֹא אָמַרְתִּי אֵלֶיךָ
  choice: क्या मैंने तुमसे नहीं कहा था
  rationale: הֲלֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; ‘कहा था’ पूर्व कथन को स्पष्ट करता है।
- source_word: לֹא יִתְנַבֵּא
  choice: भविष्यवाणी नहीं करेगा
  rationale: भूतकालीन ‘मैंने कहा था’ के अधीन अपूर्ण क्रिया को भविष्य-में-भूत के भाव में स्वाभाविक हिन्दी रूप दिया गया है।
- source_word: עָלַי
  choice: मेरे विषय में
  rationale: यहाँ עַל भविष्यवाणी के विषय या संदर्भ को दर्शाता है, लाभ को नहीं।
- source_word: טוֹב
  choice: भलाई
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; ‘भलाई’ संक्षिप्त रहते हुए विपरीत पद ‘बुराई’ के साथ मूल विरोध को बचाता है।
- source_word: כִּי אִם
  choice: बल्कि केवल
  rationale: यह पदबंध प्रबल अपवाद और विरोध व्यक्त करता है; दोनों शब्द मिलकर उसके बल को हिन्दी में बनाए रखते हैं।
- source_word: לְרָע
  choice: बुराई
  rationale: यह चयन טוֹב के साथ मूल ‘भलाई—बुराई’ विरोध को सुरक्षित रखता है; प्रसंग में अर्थ राजा के लिए प्रतिकूल या अनिष्टकारी संदेश है।
theological_decisions:
- issue: भविष्यवाणी किए गए संदेश का स्वरूप
  choice: ‘भलाई ... बल्कि केवल बुराई’
  alternative: ‘अच्छी बात ... बल्कि केवल अनिष्ट’
  rationale: यहाँ नैतिक बुराई की तत्त्वमीमांसीय घोषणा नहीं, बल्कि अहाब की शिकायत है कि भविष्यद्वक्ता उसके लिए अनुकूल संदेश नहीं देता। फिर भी मूल इब्रानी का तीखा ‘अच्छा—बुरा’ विरोध अनुवाद में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्यरचना मूल के निकट है, पर ‘यहोशापात से कहा’ और ‘कहा था’ जैसे रूप हिन्दी की स्वाभाविक अभिव्यक्ति के अनुसार हैं।
