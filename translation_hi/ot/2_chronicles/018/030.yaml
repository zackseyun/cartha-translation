source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ אֲרָ֡ם צִוָּה֩ אֶת שָׂרֵ֨י הָ/רֶ֤כֶב אֲשֶׁר ל/וֹ֙ לֵ/אמֹ֔ר לֹ֚א תִּלָּ֣חֲמ֔וּ אֶת הַ/קָּטֹ֖ן אֶת הַ/גָּד֑וֹל כִּ֛י אִֽם אֶת מֶ֥לֶךְ יִשְׂרָאֵ֖ל לְ/בַדּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/030.yaml
  text: The king of Aram had commanded the commanders of the chariots that were his[a], saying, “Do not fight with either small or great, but only with the king of Israel alone.”
translation:
  language: hi
  text: अराम के राजा ने अपने रथों के सेनापतियों को आज्ञा दी थी, “न तो छोटे से और न बड़े से[a] युद्ध करना, बल्कि केवल इस्राएल के राजा से ही करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “चाहे छोटा हो या बड़ा, किसी और से युद्ध न करना; केवल इस्राएल के राजा से ही करना।”
    reason: इब्रानी ‘छोटे…बड़े’ एक मेरिज़्म है, जिसका अर्थ पद या दर्जे की परवाह किए बिना कोई भी व्यक्ति है।
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: अराम के राजा ने
  rationale: וּ narrative connection marks the clause in context, but Hindi does not require an explicit और here. אֲרָם is retained as the proper name अराम.
- source_word: צִוָּה
  choice: आज्ञा दे रखी थी
  rationale: The verb means command/order; this Hindi perfect construction naturally presents the command as prior to the battle action.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: अपने रथों के सेनापतियों को
  rationale: שָׂרֵי denotes commanders or officers, while הָרֶכֶב denotes the chariots/chariot force. अपने naturally incorporates אֲשֶׁר לוֹ, those belonging to or under him.
- source_word: לֵאמֹר
  choice: 'यह आज्ञा ... :'
  rationale: Rather than the wooden कहते हुए, the colon after यह आज्ञा दे रखी थी naturally introduces the content of the command in modern Hindi.
- source_word: לֹא תִּלָּחֲמוּ
  choice: युद्ध करना
  rationale: Within the paired prohibition न तो...न..., the infinitive construction gives a direct and natural plural command in Hindi.
- source_word: אֶת הַקָּטֹן אֶת הַגָּדוֹל
  choice: न तो छोटे से और न बड़े से
  rationale: This preserves the Hebrew merism and its social/rank contrast instead of replacing it outright with किसी से भी नहीं; the idiomatic sense is clarified in the footnote.
- source_word: כִּי אִם
  choice: बल्कि केवल
  rationale: The construction expresses restrictive exception; बल्कि केवल clearly signals contrast and exclusivity.
- source_word: אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: इस्राएल के राजा से ही
  rationale: The supplied postposition से follows युद्ध करना naturally. ही conveys the exclusive force of לְבַדּוֹ without the awkward redundancy केवल...अकेले से.
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण सैन्य-आख्यान शैली रखी गई है। ‘रथों के सेनापति’ सामान्य पाठक के लिए स्पष्ट है, और ‘छोटे...बड़े’ की मूल अभिव्यक्ति को पाठ में रखते हुए उसके मुहावरेदार अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
