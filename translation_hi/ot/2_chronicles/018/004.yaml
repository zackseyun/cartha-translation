source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוֹשָׁפָ֖ט אֶל מֶ֣לֶךְ יִשְׂרָאֵ֑ל דְּרָשׁ נָ֥א כַ/יּ֖וֹם אֶת דְּבַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/004.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: hi
  text: तब यहोशापात ने इस्राएल के राजा से कहा, “कृपया आज याहवे के वचन के बारे में पूछिए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की ओर से कोई वचन पूछिए।”
    reason: דרש और דְּבַר יְהוָה के इस संयोजन का अर्थ किसी विशिष्ट ‘याहवे के वचन’ के बारे में पूछना अथवा ‘याहवे की ओर से कोई वचन’ माँगना हो सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथात्मक रूप को आधुनिक हिन्दी के स्वाभाविक कथा-प्रवाह में व्यक्त करता है; ‘तब’ प्रसंग की क्रमिकता दिखाता है, पर अतिरिक्त कारण नहीं जोड़ता।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा से
  rationale: औपचारिक राजकीय पदनाम को बनाए रखते हुए हिन्दी में ‘कहा’ के साथ स्वाभाविक परसर्ग ‘से’ का प्रयोग किया गया है।
- source_word: דְּרָשׁ
  choice: पूछिए
  rationale: इस प्रसंग में क्रिया का अर्थ परमेश्वर के भविष्यद्वाणी-संबंधी वचन को जानने के लिए पूछना या परामर्श लेना है। आदरसूचक आज्ञार्थक रूप दो राजाओं के संवाद के अनुरूप है।
- source_word: נָא
  choice: कृपया
  rationale: यह विनय-सूचक निपात आज्ञा को नम्र अनुरोध बनाता है; ‘कृपया’ आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य है।
- source_word: כַיּוֹם
  choice: आज ही
  rationale: शब्द यहाँ तत्काल उसी दिन पूछने पर बल देता है; ‘ही’ हिन्दी में उस तात्कालिक आग्रह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת דְּבַר יְהוָה
  choice: यहोवा के वचन के विषय में
  rationale: דרש के साथ जिस वचन को खोजा या पूछा जा रहा है, उसे हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है तथा निश्चित ‘वचन’ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: דְּבַר יְהוָה की निश्चितता
  choice: यहोवा का वचन
  alternative: यहोवा की ओर से कोई वचन
  rationale: इब्रानी में דְּבַר पर अनिश्चित उपपद नहीं है और पदबंध भविष्यद्वाणी-संबंधी स्थापित अभिव्यक्ति हो सकता है। फिर भी प्रसंग में ‘कोई वचन’ की अर्थ-छाया संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजाओं के बीच विनम्र अनुरोध के कारण ‘पूछिए’ चुना गया है। पादटिप्पणी-चिह्न को उसी वाक्यांश के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
