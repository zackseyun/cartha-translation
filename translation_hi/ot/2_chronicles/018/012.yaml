  text: וְ/הַ/מַּלְאָ֞ךְ אֲשֶׁר הָלַ֣ךְ לִ/קְרֹ֣א לְ/מִיכָ֗יְהוּ דִּבֶּ֤ר אֵלָי/ו֙ לֵ/אמֹ֔ר הִנֵּ֞ה דִּבְרֵ֧י הַ/נְּבִאִ֛ים פֶּֽה אֶחָ֥ד ט֖וֹב אֶל הַ/מֶּ֑לֶךְ וִֽ/יהִי נָ֧א דְבָרְ/ךָ֛ כְּ/אַחַ֥ד מֵ/הֶ֖ם וְ/דִבַּ֥רְתָּ טּֽוֹב־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/012.yaml
  text: The messenger who had gone to summon Micaiah spoke to him[a], saying, “Look, the words of the prophets are unanimously favorable to the king. Please let your word be like one of theirs, and speak favorably.”
translation:
  language: hi
  text: जो दूत मीकायाह को बुलाने गया था, उसने उससे कहा, “देखो, भविष्यद्वक्ता एक स्वर में राजा के अनुकूल बातें कह रहे हैं। कृपया तुम्हारी बात भी उनकी बातों में से किसी एक के समान हो, और तुम भी राजा के अनुकूल बात कहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: कथा-संदर्भ में यह मीकायाह को बुलाने भेजा गया मानवीय संदेशवाहक है; इसलिए ‘दूत’ उपयुक्त है।
- source_word: לִקְרֹא
  choice: बुलाने
  rationale: राजा के सामने उपस्थित होने के लिए आधिकारिक बुलावे का भाव संदर्भ से स्पष्ट है; ‘बुलाने’ सहज आधुनिक हिन्दी है।
- source_word: לְמִיכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले अव्यय का सीधा और समकालीन हिन्दी रूप।
- source_word: פֶּה אֶחָד
  choice: एक स्वर में
  rationale: शाब्दिक अर्थ ‘एक मुँह’ है; ‘एक स्वर में’ हिन्दी का स्वाभाविक मुहावरा है और पूर्ण सहमति का भाव बनाए रखता है।
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: राजा के पक्ष में अच्छी बातें
  rationale: यहाँ טוֹב उस वाणी को सूचित करता है जो राजा के अनुकूल या हितकारी है; यह रूप अर्थ और दोहराव दोनों को सुरक्षित रखता है।
- source_word: וִיהִי נָא
  choice: कृपया ... हो
  rationale: आग्रहसूचक क्रियारूप और נָא की विनम्रता को हिन्दी में स्पष्ट करता है।
- source_word: דְבָרְךָ
  choice: तेरी बात
  rationale: इब्रानी एकवचन को बनाए रखते हुए भावी भविष्यवाणी को एक समग्र कथन के रूप में व्यक्त करता है।
- source_word: כְּאַחַד מֵהֶם
  choice: उनमें से किसी एक की बात जैसी
  rationale: तुलना भविष्यद्वक्ताओं की कही बात से है; हिन्दी में संदर्भ स्पष्ट करने के लिए ‘बात’ दोहराई गई है।
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: तू भी राजा के पक्ष में अच्छी बात कहना
  rationale: आज्ञार्थक आग्रह और पहले आए ‘अच्छी’ वाणी के अर्थगत दोहराव को स्वाभाविक हिन्दी में रखता है।
