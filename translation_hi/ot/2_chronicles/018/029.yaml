base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/029.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself, and they went into the battle.
translation:
  language: hi
  text: तब इस्राएल के राजा ने यहोशापात से कहा, “मैं भेष बदलकर युद्ध में जाऊँगा,[a] पर तुम अपने राजकीय वस्त्र पहने रहना।” तब इस्राएल के राजा ने भेष बदल लिया, और वे युद्ध में गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी को शब्दशः “भेष बदलो और युद्ध में जाओ” भी समझा जा सकता है। पर अगला वाक्यांश और आगे का वृत्तांत संकेत करते हैं कि इस्राएल का राजा अपने ही भेष बदलने की बात कर रहा है।
    reason: मूल इब्रानी के संक्षिप्त और व्याकरण की दृष्टि से अस्पष्ट रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: הִתְחַפֵּשׂ וָבוֹא
  choice: मैं भेष बदलकर युद्ध में जाऊँगा
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है और उसके रूपों को आज्ञार्थक भी समझा जा सकता है; फिर भी अगला विरोधसूचक कथन और बाद का वृत्तांत स्पष्ट करते हैं कि इस्राएल का राजा स्वयं भेष बदलता है। इसलिए मुख्य पाठ में संदर्भानुकूल प्रथम पुरुष रखा गया और रूपगत अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
- source_word: בַמִּלְחָמָה
  choice: युद्ध में
  rationale: בוא के साथ यह युद्ध में प्रवेश करने या जाने का भाव देता है; स्वाभाविक हिन्दी में “युद्ध में जाऊँगा/गए” उपयुक्त है।
- source_word: וְאַתָּה
  choice: पर तुम
  rationale: 'सर्वनाम यहाँ स्पष्ट विरोध दिखाता है: इस्राएल का राजा भेष बदलेगा, जबकि यहोशापात पहचाने जाने योग्य वस्त्र पहने रहेगा।'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: अपने राजकीय वस्त्र पहने रहना
  rationale: בְּגָדִים का मूल अर्थ वस्त्र है; राजाओं और युद्धनीति के इस प्रसंग में “राजकीय” उस पहनावे की पहचानयोग्यता स्पष्ट करता है। “पहने रहना” हिन्दी में इस निर्देश का स्वाभाविक भाव व्यक्त करता है।
- source_word: וַיִּתְחַפֵּשׂ
  choice: भेष बदल लिया
  rationale: यह कथात्मक क्रिया पुष्टि करती है कि इस्राएल के राजा ने अपना रूप छिपाया।
- source_word: וַיָּבֹאוּ
  choice: वे युद्ध में गए
  rationale: बहुवचन क्रिया दोनों राजाओं के युद्ध में जाने को बताती है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
