  text: Then the king of Israel called one officer and said[a], “Quickly bring Micaiah son of Imla.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने एक राजकीय अधिकारी[a] को बुलाया और कहा, “यिम्ला के पुत्र मीकायाह को जल्दी ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक खोजा” अथवा “एक दरबारी अधिकारी”; इब्रानी शब्द का अर्थ शाब्दिक रूप से एक खोजा, अथवा अधिक व्यापक अर्थ में राजकीय अधिकारी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: यहाँ क्रिया राज-अधिकारी को संबोधित करके आदेश देने की भूमिका बाँधती है; हिंदी में ‘बुलाकर कहा’ स्वाभाविक कथात्मक प्रयोग है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह सीधा संबंधसूचक पदबंध है और प्रसंग में निश्चित राजा को दर्शाता है।
- source_word: אֶל סָרִיס אֶחָד
  choice: एक राज-अधिकारी
  rationale: סָרִיס का अर्थ शाब्दिक रूप से ‘खोजा’ भी हो सकता है और व्यापक रूप से राजकीय अथवा दरबारी अधिकारी भी। इस प्रसंग में उसका कार्य राजकीय आदेश पूरा करना है; मूल की अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: यह सामान्य कथात्मक वचन-क्रिया है; ‘कहा’ इसका सहज हिंदी रूप है।
- source_word: מַהֵר
  choice: जल्दी ले आओ
  rationale: एकवचन आज्ञार्थक रूप तात्कालिकता व्यक्त करता है। हिंदी में ‘जल्दी ले आओ’ आदेश और उसकी शीघ्रता दोनों को स्वाभाविक ढंग से प्रकट करता है।
- source_word: מיכהו
  choice: मीकायाह
  rationale: हिंदी बाइबलीय नाम-परंपरा के अनुरूप हिब्रू नाम का स्पष्ट लिप्यंतरण।
- source_word: בֶן יִמְלָא
  choice: यिम्ला के पुत्र
  rationale: यह मानक पितृनामसूचक पदबंध है; हिंदी में संबंध को सीधे व्यक्त किया गया है।
