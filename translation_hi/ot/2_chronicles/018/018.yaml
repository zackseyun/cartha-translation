id: 2CH.18.18
reference: 2 Chronicles 18:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שִׁמְע֣וּ דְבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יוֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹֽמְדִ֔ים עַל יְמִינ֖/וֹ וּ/שְׂמֹאלֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/018.yaml
  text: 'And he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing at his right hand and at his left.”'
translation:
  language: hi
  text: 'उसने कहा, “इसलिए याहवे का वचन सुनो: मैंने याहवे को अपने सिंहासन पर बैठे देखा, और स्वर्ग की सारी सेना[a] उसके दाईं और बाईं ओर खड़ी थी।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारा स्वर्गीय समुदाय”; शाब्दिक रूप से “स्वर्ग की सारी सेना।”
    reason: इब्रानी צְבָא संगठित समूह, दल या सेना को सूचित कर सकता है; यहाँ स्वर्गीय दरबार का संदर्भ है।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले संवाद से निष्कर्षात्मक संबंध जोड़ता है और भविष्यद्वाणी की गंभीरता बनाए रखता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है, जो श्रोताओं को भविष्यद्वाणी पर ध्यान देने के लिए बुलाता है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह भविष्यद्वाणी का प्रचलित सूत्र है; ‘वचन’ ईश्वरीय कथन का औपचारिक और धर्मग्रंथीय स्वर बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: दर्शन में देखी हुई घटना की सीधी भूतकालीन अभिव्यक्ति है।
- source_word: יוֹשֵׁב
  choice: बैठे
  rationale: सिंहासन पर याहवे की मुद्रा को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּסְאוֹ
  choice: अपने सिंहासन पर
  rationale: हिन्दी में कर्ता की ओर लौटते स्वामित्व के लिए ‘अपने’ स्वाभाविक है और मूल राजकीय बिंब को सुरक्षित रखता है।
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: स्वर्ग की सारी सेना
  rationale: צָבָא के संगठित समूह अथवा सेना के सामूहिक अर्थ और स्वर्गीय दरबार के दृश्य, दोनों को बनाए रखता है।
- source_word: עֹמְדִים
  choice: खड़ी थी
  rationale: ‘सेना’ हिन्दी में स्त्रीलिंग एकवचन सामूहिक संज्ञा है; यह मूल बहुवचन समूह की खड़े होने की मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל יְמִינוֹ וּשְׂמֹאלוֹ
  choice: उसके दाईं और बाईं ओर
  rationale: सिंहासन के दोनों ओर स्वर्गीय समूह की स्थिति को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उस दर्शन में יְהוָה का अनुवाद जिसमें भविष्यद्वक्ता कहता है कि उसने יְהוָה को देखा
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत चतुरक्षरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करते हुए नाम और उपाधि के बीच भेद बनाए रखता है।
- issue: כָל צְבָא הַשָּׁמַיִם से अभिप्रेत स्वर्गीय समूह की पहचान
  choice: स्वर्ग की सारी सेना
  alternative: सारा स्वर्गीय समुदाय
  rationale: मूल शब्द के सैन्य तथा संगठित स्वर्गीय समूह—दोनों संभावित अर्थों को पूरी तरह किसी एक विशिष्ट प्राणी-वर्ग तक सीमित किए बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वाणी के सूत्र ‘याहवे का वचन सुनो’ और सिंहासन-दर्शन की राजकीय छवि को औपचारिक स्पष्टता के साथ सुरक्षित रखा गया है।
