base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/020.yaml
  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him, ‘By what means?’
translation:
  language: hi
  text: तब वह आत्मा आगे आया और याहवे के सामने खड़ा होकर बोला, “मैं उसे बहकाऊँगा[a]।” याहवे ने उससे कहा, “किस तरह?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसे फुसलाऊँगा,” “मैं उसे मनाऊँगा,” अथवा “मैं उसे धोखा दूँगा।” इब्रानी क्रिया प्रसंग के अनुसार बहकाने, मनाने या धोखा देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרוּחַ
  choice: वह आत्मा
  rationale: स्वर्गीय सभा के इस दृश्य में उसका आगे आना, खड़ा होना और बोलना एक व्यक्तिगत आत्मिक प्राणी की ओर संकेत करता है; इसलिए ‘आत्मा’ प्रसंगानुकूल है। निश्चित उपपद को ‘वह’ से व्यक्त किया गया है।
- source_word: וַיֵּצֵא
  choice: आगे आया
  rationale: יצא का मूल अर्थ निकलना है, पर सभा में स्वयं को प्रस्तुत करने की गति को आधुनिक हिन्दी में ‘आगे आया’ स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: וַיַּעֲמֹד לִפְנֵי
  choice: के सामने खड़ा होकर
  rationale: यह पदबंध किसी की उपस्थिति में औपचारिक रूप से खड़े होने का भाव देता है और स्वर्गीय सभा का दृश्य बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: אֲפַתֶּנּוּ
  choice: मैं उसे बहकाऊँगा
  rationale: पिएल रूप פתה यहाँ किसी को एक मार्ग की ओर फुसलाने, मनाने या छलपूर्वक ले जाने का अर्थ रख सकता है। ‘बहकाऊँगा’ इस व्यापकता और प्रसंग की नैतिक अस्पष्टता को बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: בַּמָּה
  choice: किस तरह?
  rationale: प्रश्न साधन या तरीके के विषय में है। ‘किस तरह?’ आधुनिक हिन्दी में सहज है और इब्रानी की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए प्रचलित रूप ‘यहोवा’ चुना गया है।
- issue: स्वर्गीय सभा के प्रसंग में פתה की नैतिक और धर्मवैज्ञानिक छाया
  choice: बहकाऊँगा
  alternative: फुसलाऊँगा; मनाऊँगा; धोखा दूँगा
  rationale: इस पद में प्रस्ताव बताया गया है, जबकि अगला पद उसका छलपूर्ण साधन स्पष्ट करता है। मुख्य पाठ में ऐसा शब्द रखा गया है जो तनाव को समय से पहले किसी एक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। संवाद संक्षिप्त रखा गया है और स्वर्गीय राजसभा का औपचारिक भाव सुरक्षित है।
