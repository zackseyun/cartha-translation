  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרוֹשׁ֩ אֶת יְהוָ֨ה מֵֽ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/הוּ כִּֽי אֵ֠ינֶ/נּוּ מִתְנַבֵּ֨א עָלַ֤/י לְ/טוֹבָה֙ כִּ֣י כָל יָמָ֣י/ו לְ/רָעָ֔ה ה֖וּא מִיכָ֣יְהוּ בֶן יִמְלָ֑א וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/007.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “There is still one man by whom we may inquire of Yahweh, but I hate him, because he never prophesies good concerning me, but always evil. He is Micaiah son of Imla.” Jehoshaphat said, “Let not the king say so.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने यहोशापात से कहा, “अभी एक व्यक्ति है, जिसके द्वारा हम याहवे से पूछ सकते हैं; पर मैं उससे घृणा करता हूँ, क्योंकि वह मेरे विषय में कभी भलाई की भविष्यवाणी नहीं करता, बल्कि सदा अनिष्ट की ही करता है। वह यिम्ला का पुत्र मीकायाह है।” यहोशापात ने कहा, “राजा ऐसा न कहे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ע֣וֹד אִישׁ אֶחָד
  choice: एक आदमी और है
  rationale: यह वाक्यांश एक शेष उपलब्ध व्यक्ति को दर्शाता है। ‘एक आदमी और है’ स्वाभाविक आधुनिक हिन्दी में ‘अभी एक और व्यक्ति है’ का भाव रखता है।
- source_word: לִדְרוֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: जिसके द्वारा हम यहोवा से पूछ सकते हैं
  rationale: भविष्यद्वक्ता से परामर्श के संदर्भ में דרשׁ का अर्थ यहोवा से पूछना है, और מֵאֹתוֹ उस व्यक्ति की मध्यस्थ भूमिका बताता है।
- source_word: וַאֲנִי שְׂנֵאתִיהוּ
  choice: पर मैं उससे घृणा करता हूँ
  rationale: इब्रानी सिद्ध क्रिया यहाँ राजा की स्थायी वर्तमान मनोवृत्ति व्यक्त करती है; हिन्दी वर्तमान काल इसे स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: כִּי אֵינֶנּוּ מִתְנַבֵּא עָלַי לְטוֹבָה
  choice: क्योंकि वह मेरे विषय में कभी भलाई की भविष्यवाणी नहीं करता
  rationale: नकार के साथ कृदन्त उसकी अभ्यस्त गतिविधि दर्शाता है। ‘कभी ... नहीं करता’ उस चरित्रगत दावे को सुरक्षित रखता है।
- source_word: כִּי כָל־יָמָיו לְרָעָה
  choice: बल्कि अपने जीवन भर बुराई की ही भविष्यवाणी करता है
  rationale: शाब्दिक अर्थ ‘उसके सारे दिनों में बुराई के लिए’ है। ‘अपने जीवन भर’ כָל־יָמָיו को स्पष्ट रूप से रखता है और ‘ही’ राजा के विरोधात्मक जोर को व्यक्त करता है।
- source_word: מִיכָיְהוּ בֶן־יִמְלָא
  choice: यिम्ला का पुत्र मीकायाह
  rationale: दोनों नामों का हिन्दी लिप्यंतरण किया गया है और वंशसूचक संबंध स्पष्ट रखा गया है।
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: राजा ऐसा न कहे
  rationale: אַל के साथ अपूर्ण क्रिया सम्मानपूर्ण, अप्रत्यक्ष निषेध है। तीसरे पुरुष का रूप यहोशापात द्वारा राजा को दिए गए विनम्र सुधार को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित प्रत्यक्ष नाम ‘यहोवा’ से प्रस्तुत किया गया है, उपाधि से नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: ‘बुराई’ का आशय
  choice: बुराई की भविष्यवाणी
  alternative: अनिष्ट की भविष्यवाणी
  rationale: לְרָעָה में नैतिक बुराई अथवा विपत्ति/हानि दोनों की शब्दगत गुंजाइश हो सकती है। ‘बुराई’ मूल की व्यापकता और राजा के आरोप की तीक्ष्णता बनाए रखता है; इसे केवल ‘अनिष्ट’ कहकर सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक है। ‘राजा ऐसा न कहे’ में राजदरबारी विनम्रता बनी रहती है। पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई; अंग्रेज़ी परामर्श-पाठ का [a] चिह्न संभवतः गलत स्थान पर जुड़ा है, जबकि उसका वैकल्पिक अर्थ हिन्दी मुख्य पाठ में सीधे व्यक्त हो गया है।
