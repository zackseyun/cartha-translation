  text: וַ/יָּבֹא֮ אֶל הַ/מֶּלֶךְ֒ וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֵלָ֗י/ו מִיכָה֙ הֲ/נֵלֵ֞ךְ אֶל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּ֨אמֶר֙ עֲל֣וּ וְ/הַצְלִ֔יחוּ וְ/יִנָּתְנ֖וּ בְּ/יֶדְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/014.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should I refrain?” And he said, “Go up and prosper, and they will be given into your hand.”
translation:
  language: hi
  text: तब वह राजा के पास आया। राजा ने उससे कहा, “मीकायाह, क्या हम युद्ध के लिए रामोत-गिलाद जाएँ, या मैं रुक जाऊँ?” उसने उत्तर दिया, “आप लोग चढ़ाई करें और सफल हों; वे[b] आपके हाथ में कर दिए जाएँगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आस-पास के प्रसंग के अनुसार मीकायाह का यह उत्तर संभवतः व्यंग्यात्मक है, हालाँकि इब्रानी वाक्य में व्यंग्य का कोई स्पष्ट चिह्न नहीं है।
    reason: lexical_alternative
  - marker: b
    text: “वे” का संकेत संभवतः शत्रुओं की ओर है; इब्रानी में बहुवचन कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब वह ... आया
  rationale: वय्यिक्तोल कथानक में अगली घटना को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִיכָה
  choice: मीका
  rationale: यह इस प्रसंग के नबी का इब्रानी नाम है; हिन्दी में सरल और प्रचलित लिप्यंतरण रखा गया है।
- source_word: הֲנֵלֵךְ
  choice: क्या हम ... जाएँ
  rationale: प्रथम पुरुष बहुवचन प्रश्न के विचार-विमर्श वाले भाव को सीधे बनाए रखता है।
- source_word: רָמֹת גִּלְעָד
  choice: रामोत-गिलाद
  rationale: स्थान-नाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: उद्देश्यसूचक ל और מלחמה के सैनिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם אֶחְדָּל
  choice: या मैं रुक जाऊँ
  rationale: חדל का अर्थ रुकना या किसी काम से बाज आना है। इब्रानी में ‘हम जाएँ’ से ‘मैं रुक जाऊँ’ की ओर जो वचन-परिवर्तन है, उसे नहीं सँवारा गया।
- source_word: עֲלוּ
  choice: आप लोग चढ़ाई करें
  rationale: बहुवचन आज्ञा और सैन्य अभियान के लिए עלה के ‘ऊपर जाने/चढ़ाई करने’ वाले भाव को व्यक्त करता है।
- source_word: וְהַצְלִיחוּ
  choice: और सफल हों
  rationale: हिफ़ील צלח यहाँ अभियान में सफलता पाने का अर्थ देता है; ‘सफल हों’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְיִנָּתְנוּ בְּיֶדְכֶם
  choice: वे आपके हाथ में कर दिए जाएँगे
  rationale: निफ़ाल बहुवचन को कर्मवाच्य में रखा गया है और ‘हाथ में’ वाला सामर्थ्य अथवा अधिकार का इब्रानी मुहावरा सुरक्षित रखा गया है; अनिर्दिष्ट बहुवचन कर्ता को ‘वे’ से खुला छोड़ा गया है।
theological_decisions:
- issue: मीका के उत्तर में व्यंग्य अथवा विडंबना को मुख्य पाठ में स्पष्ट करना
  choice: ऊपरी तौर पर सकारात्मक कथन को ज्यों का त्यों रखना
  alternative: ‘उसने व्यंग्य से कहा’ जोड़ना या विराम-चिह्नों से व्यंग्य स्पष्ट करना
  rationale: आस-पास का प्रसंग उत्तर को व्यंग्यात्मक समझने का प्रबल आधार देता है, पर इब्रानी वाक्य स्वयं व्यंग्य का कोई स्पष्ट भाषिक चिह्न नहीं देता। इसलिए व्याख्या को मुख्य पाठ में जोड़ने के बजाय टिप्पणी में बताया गया है।
- issue: अंतिम क्रिया के अनिर्दिष्ट बहुवचन कर्ता की पहचान
  choice: ‘वे’ कहकर पहचान अनिर्दिष्ट रखना
  alternative: ‘शत्रु’ या ‘नगर’ जोड़कर आशय स्पष्ट करना
  rationale: इब्रानी क्रिया बहुवचन है, किंतु उसका कर्ता इस वाक्य में व्यक्त नहीं है। किसी विशिष्ट संदर्भ को मुख्य पाठ में जोड़ना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। राजाओं को संबोधित बहुवचन आज्ञाओं के लिए ‘आप लोग’ और सम्मानसूचक क्रियारूप प्रयुक्त हैं। ‘हम’ से ‘मैं’ की मूल वचन-भिन्नता तथा अंतिम वाक्य का अनिर्दिष्ट बहुवचन जानबूझकर सुरक्षित रखा गया है।
