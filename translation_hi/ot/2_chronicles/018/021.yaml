language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ לְ/ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/021.yaml
  text: And he said[a], ‘I will go out and become a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also succeed[b]. Go out and do so.’
translation:
  language: hi
  text: तब उसने कहा, “मैं बाहर जाऊँगा और उसके सभी भविष्यद्वक्ताओं के मुँह में झूठ बोलनेवाली आत्मा[a] बनूँगा।” उसने कहा, “तू उसे बहकाएगा[b] और सफल भी होगा। जा, ऐसा ही कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठ की आत्मा।”
    reason: lexical_alternative
  - marker: b
    text: या, “तू उसे धोखा देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵצֵא
  choice: मैं बाहर जाऊँगा
  rationale: יצא के प्रथम पुरुष रूप में वक्ता का संकल्प व्यक्त है। ‘बाहर जाऊँगा’ दिशात्मक अर्थ को बनाए रखता है और बाद के आदेश ‘जा’ से शब्दगत संबंध भी सुरक्षित रखता है।
- source_word: וְהָיִיתִי
  choice: और ... बनूँगा
  rationale: היה का मूल अर्थ ‘होना’ है, पर यहाँ नए कार्य या भूमिका को ग्रहण करने का भाव है; इसलिए वर्तमान हिन्दी में ‘बनूँगा’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לְרוּחַ שֶׁקֶר
  choice: झूठ बोलनेवाली आत्मा
  rationale: यह पद ऐसी आत्मा का वर्णन करता है जिसका चरित्र या कार्य झूठ कहलवाना है। यह अनुवाद सहज हिन्दी में छलपूर्ण वाणी के प्रसंग को स्पष्ट करता है; अधिक रूपगत विकल्प फुटनोट में दिया गया है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: इब्रानी की ‘मुँह में’ वाली प्रतिमा को बनाए रखा गया है; यहाँ इसका संबंध भविष्यद्वक्ताओं के द्वारा कही जानेवाली बातों से है।
- source_word: כָּל נְבִיאָיו
  choice: उसके सभी भविष्यद्वक्ताओं
  rationale: כָּל और बहुवचन संज्ञा पर लगे तृतीय पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘उसके सभी भविष्यद्वक्ता’ है; संदर्भ में ‘उसके’ का संकेत अहाब की ओर है।
- source_word: תְּפַתֶּה
  choice: तू उसे बहकाएगा
  rationale: पिएल रूप פתה में फुसलाने, भ्रम में डालने या छल से मनवाने का भाव हो सकता है। ‘बहकाएगा’ इस व्यापकता को सहज हिन्दी में रखता है। संदर्भ से निहित कर्म ‘उसे’ हिन्दी में स्पष्ट किया गया है।
- source_word: וְגַם תּוּכָל
  choice: और सफल भी होगा
  rationale: יכל यहाँ केवल सामर्थ्य नहीं, प्रस्तावित कार्य को पूरा कर पाने की प्रभावी क्षमता बताता है। ‘सफल भी होगा’ וגם और प्रसंगगत परिणाम दोनों को व्यक्त करता है।
- source_word: צֵא
  choice: जा
  rationale: יצא की आज्ञार्थक पुनरावृत्ति पहले कथन के गति-संबंधी भाव को बनाए रखती है। हिन्दी में ‘जा’ स्वाभाविक और पर्याप्त है।
- source_word: וַעֲשֵׂה כֵן
  choice: और ऐसा ही कर
  rationale: עשה כן का प्रचलित अर्थ पहले बताई गई रीति के अनुसार कार्य करना है; ‘ऐसा ही कर’ इसका सहज और निकट हिन्दी रूप है।
theological_decisions:
- issue: छल से जुड़ी आत्मा के कार्य को दर्शन में मिलने वाली अनुमति या आज्ञा
  choice: 'दर्शन के कथन को सीधे रखा गया है: आत्मा अपनी छलपूर्ण योजना बताती है और उत्तर में उसे जाने तथा वैसा ही करने को कहा जाता है।'
  alternative: भाषा को नरम करके इसे केवल पूर्वज्ञान, निष्क्रिय सहमति या स्वतंत्र कार्रवाई के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ अनुमति और आदेश की कठोरता को स्पष्ट रूप से सामने रखता है। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी संप्रदायगत व्याख्या से कम या समाप्त नहीं करता।
- issue: दोनों वाक्यों में वक्ता की पहचान
  choice: इब्रानी के समान दोनों बार केवल ‘उसने कहा’ रखा गया है।
  alternative: संदर्भ के आधार पर पहले वक्ता को ‘उस आत्मा’ और दूसरे को ‘यहोवा’ कहकर स्पष्ट करना।
  rationale: संदर्भ से पहचान समझी जा सकती है, पर इस पद में संज्ञाएँ दोबारा नहीं दी गईं। सर्वनाम बनाए रखने से स्रोत की कथात्मक संरचना और उसकी औपचारिक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘भविष्यद्वक्ता’ जैसे परिचित बाइबलीय पद को बनाए रखते हुए वाक्य-विन्यास को सामान्य पाठकों के लिए सरल रखा गया है।
