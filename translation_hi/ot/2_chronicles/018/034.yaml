language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תַּ֤עַל הַ/מִּלְחָמָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא וּ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הָיָ֨ה מַעֲמִ֧יד בַּ/מֶּרְכָּבָ֛ה נֹ֥כַח אֲרָ֖ם עַד הָ/עָ֑רֶב וַ/יָּ֕מָת לְ/עֵ֖ת בּ֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/034.yaml
  text: And the battle intensified on that day[a], and the king of Israel remained standing in the chariot facing Aram until the evening; and he died at the time of the sun’s going down.
translation:
  language: hi
  text: उस दिन युद्ध और भी भयंकर होता गया। इस्राएल के राजा को अराम के सामने रथ में शाम तक खड़ा रखा गया, और सूर्यास्त के समय[a] वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब सूर्य डूब रहा था”।
    reason: לְעֵת בּוֹא הַשָּׁמֶשׁ के अधिक स्पष्ट क्रियात्मक अर्थ को वैकल्पिक रूप में सुरक्षित रखता है।
lexical_decisions:
- source_word: וַתַּעַל הַמִּלְחָמָה
  choice: युद्ध और भी भयंकर होता गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर युद्ध के साथ यह उसकी बढ़ती तीव्रता को व्यक्त करता है। यह रूप जारी वृद्धि को स्वाभाविक हिन्दी में बताता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह सामान्य कालवाचक पदबंध है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: सम्बन्धसूचक इब्रानी रचना का सीधा और स्पष्ट अनुवाद।
- source_word: הָיָה מַעֲמִיד
  choice: खड़ा रखा गया
  rationale: 'היה के साथ हिफ़ईल कृदन्त जारी अवस्था/क्रिया दर्शाता है। यहाँ सकर्मक भाव को बनाए रखा गया है: घायल राजा को रथ में खड़ा रखा गया था; यह केवल उसके स्वयं खड़े रहने की बात नहीं कहता।'
- source_word: בַּמֶּרְכָּבָה
  choice: रथ में
  rationale: निश्चित संज्ञा को प्रसंगानुकूल स्वाभाविक हिन्दी में प्रस्तुत किया गया है; ‘अपने’ जोड़ना आवश्यक नहीं।
- source_word: נֹכַח אֲרָם
  choice: अरामियों के सामने
  rationale: נֹכַח का अर्थ सामने या आमने-सामने है। यहाँ भूभाग के बजाय विरोधी सेना अभिप्रेत है, इसलिए ‘अरामियों’ स्वाभाविक और स्पष्ट है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: काल-सीमा को संक्षिप्त, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּמָת
  choice: और ... वह मर गया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; सीधा कथन मूल की सादगी बनाए रखता है।
- source_word: לְעֵת בּוֹא הַשָּׁמֶשׁ
  choice: सूर्य अस्त होने के समय
  rationale: शाब्दिक ‘सूर्य के आने’ का सन्दर्भ सूर्यास्त से है। चुना गया रूप इस क्रियात्मक अभिव्यक्ति को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
