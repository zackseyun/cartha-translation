  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘खड़ा रखा गया’ मूल के हिफ़ईल रूप को सुरक्षित रखता है और घायल राजा को सहारा देकर खड़ा रखने की सम्भावना को अनावश्यक रूप से मिटाता नहीं।
