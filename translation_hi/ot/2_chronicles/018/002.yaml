base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/002.yaml
  text: After some years[a], he went down to Ahab in Samaria, and Ahab slaughtered sheep and cattle in abundance for him and for the people who were with him[b], and urged him to go up against Ramoth-gilead.
translation:
  language: hi
  text: कुछ वर्षों के बाद वह नीचे शोमरोन में अहाब के पास गया। अहाब ने यहोशापात और उसके साथ के लोगों के लिए बहुत-सी भेड़-बकरियों और गाय-बैलों का वध किया। फिर उसने यहोशापात को गिलाद के रामोत पर चढ़ाई करने के लिए उकसाया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहकाया” अथवा “भड़काया।”
    reason: וַיְסִיתֵהוּ के अर्थ-क्षेत्र में उकसाने के साथ बहकाने या भड़काने का भाव भी संभव है।
  - marker: b
    text: शाब्दिक रूप से “गिलाद के रामोत की ओर ऊपर जाने के लिए”; प्रसंग में आशय उस नगर के विरुद्ध सैन्य अभियान से है।
    reason: मूल इब्रानी दिशा को व्यक्त करता है, जबकि मुख्य पाठ युद्ध-संदर्भ का निहित आशय स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: वह नीचे ... गया
  rationale: ‘नीचे जाना’ यहूदा से शोमरोन की ओर यात्रा के दिशात्मक भाव को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: לְקֵץ שָׁנִים
  choice: कुछ वर्षों के बाद
  rationale: शाब्दिक भाव ‘वर्षों के अंत में’ है; हिन्दी मुहावरे में यह अनिश्चित समयावधि बीतने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּזְבַּח לוֹ אַחְאָב
  choice: अहाब ने ... वध करवाया
  rationale: זבח का अर्थ बलि चढ़ाना या वध करना हो सकता है। यहाँ राजकीय आतिथ्य और भोज का प्रसंग है, इसलिए ‘वध करवाया’ धार्मिक बलिदान का अनावश्यक संकेत दिए बिना कार्य और अहाब की व्यवस्था—दोनों को व्यक्त करता है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियों और गाय-बैलों
  rationale: ये शब्द छोटे पालतू पशुओं और बड़े मवेशियों की सामूहिक श्रेणियाँ हैं; हिन्दी में यह युग्म व्यापक अर्थ स्पष्ट करता है।
- source_word: לָרֹב
  choice: बहुत-सी
  rationale: यह पशुओं की प्रचुर संख्या को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלָעָם אֲשֶׁר עִמּוֹ
  choice: उसके साथ आए लोगों के लिए
  rationale: עָם को केवल सैनिकों तक सीमित न करके मूल की व्यापकता बनाए रखी गई है।
- source_word: וַיְסִיתֵהוּ
  choice: उकसाया
  rationale: סות में साधारण आग्रह से अधिक बहकाने या भड़काने का भाव हो सकता है। ‘उकसाया’ उस प्रबल प्रेरणा को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לַעֲלוֹת אֶל רָמוֹת גִּלְעָד
  choice: गिलाद के रामोत पर चढ़ाई करने के लिए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर युद्ध-संदर्भ में यह नगर के विरुद्ध सैन्य अभियान बताता है। ‘चढ़ाई करना’ दिशा और सैन्य आशय दोनों को स्वाभाविक हिन्दी में रखता है।
