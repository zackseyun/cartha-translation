reference: 2 Chronicles 18:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/022.yaml
  text: And now, look, the LORD has put a lying spirit in the mouth of these prophets of yours, and the LORD has spoken disaster against you.
translation:
  language: hi
  text: और अब देख, यहोवा ने तेरे इन नबियों के मुँह में झूठ बोलने वाली आत्मा डाल दी है, और यहोवा ने तेरे विरुद्ध विपत्ति की घोषणा की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: और अब देख
  rationale: संक्रमण और ध्यान आकर्षित करने वाले दोनों तत्वों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के विशिष्ट नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: רוּחַ שֶׁקֶר
  choice: झूठ बोलने वाली आत्मा
  rationale: शाब्दिक ‘झूठ की आत्मा’ की तुलना में हिन्दी में अधिक स्वाभाविक है और छल कराने वाली आत्मा का भाव सुरक्षित रखता है।
- source_word: בְּפִי נְבִיאֶיךָ אֵלֶּה
  choice: तेरे इन नबियों के मुँह में
  rationale: एकवचन सामूहिक ‘मुँह’ तथा संबोधित राजा से जुड़े ‘तेरे इन नबियों’ के बल को बनाए रखता है।
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: तेरे विरुद्ध विपत्ति की बात कही है
  rationale: עָלֶיךָ के विरोधात्मक अर्थ और רָעָה के प्रसंगगत ‘विपत्ति’ अर्थ को सुरक्षित रखता है; घटना और घोषणा के बीच का अंतर भी बना रहता है।
theological_decisions:
- issue: यहोवा द्वारा झूठ बोलने वाली आत्मा को रखना
  choice: ‘यहोवा ने ... डाल दी है’ को सीधे बनाए रखा गया
  alternative: ‘यहोवा ने ... आने दिया है’
  rationale: मूल क्रिया נָתַן सक्रिय रूप में है; उसे केवल अनुमति के रूप में नरम करना पाठ की ईश्वरीय कर्तृत्व-संबंधी तनाव को अनुचित रूप से हल कर देता।
- issue: ‘विपत्ति’ का स्वरूप
  choice: ‘विपत्ति की बात कही है’
  alternative: ‘तेरा विनाश ठान लिया है’
  rationale: मूल में घोषणा का भाव है और רָעָה व्यापक है; अधिक निश्चित या संकीर्ण व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधे राजकीय संबोधन के कारण ‘तू/तेरे’ रूप, और गंभीर कथात्मक-भविष्यद्वाणी शैली। कोई पादटिप्पणी आवश्यक नहीं।
