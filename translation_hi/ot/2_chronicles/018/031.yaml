id: 2CH.18.31
reference: 2 Chronicles 18:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ מֶ֣לֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֹ֥בּוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֤ק יְהֽוֹשָׁפָט֙ וַֽ/יהוָ֣ה עֲזָר֔/וֹ וַ/יְסִיתֵ֥/ם אֱלֹהִ֖ים מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/031.yaml
  text: And it happened that when the commanders of the chariots saw Jehoshaphat[a], they said, “It is the king of Israel.” So they turned against him to fight, but Jehoshaphat cried out, and Yahweh helped him[b], and God drew them away from him.
translation:
  language: hi
  text: जब रथों के सेनापतियों ने यहोशापात को देखा, तो उन्होंने कहा, “यही इस्राएल का राजा है।” इसलिए वे उससे लड़ने के लिए उसकी ओर मुड़े। तब यहोशापात ने पुकारा, और याहवे ने उसकी सहायता की; परमेश्वर ने उन्हें उससे दूर हटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथों के सेनापति
  rationale: שָׂרֵי सैन्य नेतृत्व को और הָרֶכֶב रथ-दल को सूचित करता है। यह पदबंध आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: यही इस्राएल का राजा है
  rationale: हिब्रू नामवाचक वाक्य यहोशापात की पहचान उस लक्ष्य के रूप में करता है जिसे वे इस्राएल का राजा समझते हैं। ‘यही’ दृश्य पहचान के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּסֹבּוּ עָלָיו
  choice: वे ... उसकी ओर मुड़े
  rationale: סבב यहाँ लक्ष्य की ओर मुड़ने या अपना रुख बदलने का भाव देता है। यह अनुवाद पूर्ण घेराबंदी का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: לְהִלָּחֵם
  choice: उससे लड़ने के लिए
  rationale: यह उद्देश्यसूचक रूप है; ‘लड़ने के लिए’ उसके सीधे सैन्य अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּזְעַק
  choice: पुकारा
  rationale: זעק संकट में ऊँची पुकार का बोध देता है। मूल पाठ पुकार का सम्बोधन स्पष्ट नहीं करता, इसलिए कोई कर्म या सम्बोधन नहीं जोड़ा गया।
- source_word: וַיהוָה עֲזָרוֹ
  choice: याहवे ने उसकी सहायता की
  rationale: עזר का सीधा अर्थ सहायता करना है; יְהוָה को व्यक्तिगत ईश्वरीय नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וַיְסִיתֵם אֱלֹהִים מִמֶּנּוּ
  choice: परमेश्वर ने उन्हें उससे दूर हटा दिया
  rationale: इस प्रसंग में סות का हिफ़ील रूप किसी को लक्ष्य से मोड़ने या दूर हटाने का अर्थ देता है। यह चयन नैतिक रूप से ‘उकसाने’ का अनावश्यक भाव जोड़े बिना ईश्वरीय कर्तृत्व बनाए रखता है।
- source_word: וַיְהִי כִּרְאוֹת
  choice: जब ... देखा
  rationale: यह सामान्य हिब्रू कथात्मक संक्रमण है। हिन्दी में केवल ‘जब’ उसका घटनाक्रम स्वाभाविक ढंग से व्यक्त करता है; ‘और ऐसा हुआ कि’ जोड़ना यहाँ भारी लगता।
theological_decisions:
- issue: एक ही पद में יְהוָה और אֱלֹהִים का अनुवाद
  choice: याहवे ... परमेश्वर
  alternative: प्रभु ... परमेश्वर
  rationale: मूल पाठ दो अलग पदों का प्रयोग करता है। ‘याहवे’ वाचा-संबंधी व्यक्तिगत नाम को और ‘परमेश्वर’ אֱלֹהִים को अलग-अलग बनाए रखता है।
- issue: यहोशापात की पुकार को स्पष्ट प्रार्थना बनाना या नहीं
  choice: यहोशापात ने पुकारा
  alternative: यहोशापात ने याहवे को पुकारा
  rationale: इस पद के हिब्रू पाठ में पुकार का सम्बोधन नहीं दिया गया। अगला खंड याहवे की सहायता बताता है, पर अनुवाद में अप्रकट सम्बोधन जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। वाक्य-संरचना को स्वाभाविक हिन्दी के अनुसार सँवारा गया है, पर सैन्य गति, संकट की पुकार और परमेश्वर के हस्तक्षेप को मूल के क्रम में रखा गया है।
