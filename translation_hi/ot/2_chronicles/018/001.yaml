base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/001.yaml
  text: Jehoshaphat had great wealth and honor[a], and he allied himself by marriage with Ahab.
translation:
  language: hi
  text: यहोशापात के पास बहुत धन और सम्मान था, और उसने अहाब से वैवाहिक संबंध स्थापित किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अहाब का विवाह-संबंधी बन गया”; अथवा, “उसने अहाब के साथ विवाह-संधि की।”
    reason: मूल क्रिया विवाह के द्वारा संबंध या गठबंधन स्थापित करने को व्यक्त कर सकती है; वह संबंध की ठीक-ठीक पारिवारिक व्यवस्था नहीं बताती।
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ क्रियात्मक रूप नए कथात्मक विकास को आगे बढ़ाता है। आधुनिक हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय स्वाभाविक अस्तित्ववाचक वाक्य पर्याप्त है।
- source_word: לִיהוֹשָׁפָט
  choice: यहोशापात के पास
  rationale: हिब्रू की अधिकारसूचक रचना को स्वाभाविक हिन्दी में ‘के पास’ से व्यक्त किया गया है।
- source_word: עֹשֶׁר
  choice: धन
  rationale: यह संज्ञा भौतिक समृद्धि को दर्शाती है; ‘धन’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וְכָבוֹד
  choice: और सम्मान
  rationale: राजकीय और सामाजिक संदर्भ में इसका अर्थ प्रतिष्ठा या आदर है, न कि दिखाई देनेवाली दिव्य महिमा।
- source_word: לָרֹב
  choice: बहुत
  rationale: यह पद धन और सम्मान की प्रचुरता बताता है; हिन्दी में ‘बहुत धन और सम्मान’ इसका स्वाभाविक रूप है।
- source_word: וַיִּתְחַתֵּן
  choice: वैवाहिक संबंध स्थापित किया
  rationale: חתן के हित्पएल रूप का आशय विवाह के द्वारा पारिवारिक या राजवंशीय संबंध में आना है; यह शब्दावली यह नहीं कहती कि यहोशापात ने स्वयं विवाह किया।
- source_word: לְאַחְאָב
  choice: अहाब से
  rationale: संबंध स्थापित करने के अर्थ में हिब्रू संबंधसूचक पद का स्वाभाविक हिन्दी रूप ‘अहाब से’ है।
theological_decisions:
- issue: וַיִּתְחַתֵּן לְאַחְאָב में यहोशापात और अहाब के संबंध का स्वरूप
  choice: उसने अहाब से वैवाहिक संबंध स्थापित किया
  alternative: वह अहाब का विवाह-संबंधी बन गया; उसने अहाब के साथ विवाह-संधि की
  rationale: पद राजवंशीय या पारिवारिक विवाह-संबंध बताता है, पर यह नहीं कहता कि यहोशापात ने व्यक्तिगत रूप से अहाब से या उसके परिवार के किसी सदस्य से विवाह किया। चुना हुआ अनुवाद इस अनिश्चितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘वैवाहिक संबंध स्थापित किया’ सामान्य पाठक के लिए स्पष्ट है और राजवंशीय गठबंधन का भाव व्यक्त करते हुए अनावश्यक ऐतिहासिक विवरण नहीं जोड़ता।
