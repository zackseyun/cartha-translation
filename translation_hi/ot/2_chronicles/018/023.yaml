  text: וַ/יִּגַּשׁ֙ צִדְקִיָּ֣הוּ בֶֽן כְּנַעֲנָ֔ה וַ/יַּ֥ךְ אֶת מִיכָ֖יְהוּ עַל הַ/לֶּ֑חִי וַ/יֹּ֗אמֶר אֵ֣י זֶ֤ה הַ/דֶּ֨רֶךְ֙ עָבַ֧ר רֽוּחַ יְהוָ֛ה מֵ/אִתִּ֖/י לְ/דַבֵּ֥ר אֹתָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/023.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek[a], and said, “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: hi
  text: तब कनाना का पुत्र सिदकियाह पास आया और उसने मीकायाह के गाल पर प्रहार किया। उसने कहा, “याहवे की आत्मा तुझसे बोलने के लिए मुझसे किस रास्ते गई?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: पास आया
  rationale: नגשׁ निकट आने या आगे बढ़ने को व्यक्त करता है; “पास आया” शारीरिक गति और टकराव के प्रसंग दोनों को स्वाभाविक रूप से रखता है।
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: कनाना का पुत्र सिदकियाह
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶן को स्वाभाविक हिन्दी वंश-सूचक रचना “का पुत्र” से व्यक्त किया गया है।
- source_word: וַיַּךְ אֶת מִיכָיְהוּ עַל הַלֶּחִי
  choice: उसने मीकायाह के गाल पर मारा
  rationale: נכה मारने या प्रहार करने का व्यापक क्रियापद है; “मारा” अनावश्यक रूप से इसे थप्पड़ या घूँसा निश्चित नहीं करता। לֶחִי गाल अथवा जबड़े के क्षेत्र को सूचित करता है; यहाँ “गाल” प्रसंगानुकूल और सहज है।
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: किस रास्ते
  rationale: यह वाक्यांश आत्मा के एक वक्ता से दूसरे तक जाने के कथित मार्ग पर व्यंग्यपूर्ण प्रश्न करता है। “किस रास्ते” गति के रूपक को बनाए रखता है।
- source_word: עָבַר
  choice: गया
  rationale: עבר का मूल भाव एक स्थान से दूसरे स्थान की ओर गुजरना है। हिन्दी में “किस रास्ते गया” इस गति-चित्र को सहज ढंग से व्यक्त करता है।
- source_word: רוּחַ יְהוָה
  choice: याहवे का आत्मा
  rationale: भविष्यद्वाणी के प्रसंग में רוּחַ दिव्य आत्मा को सूचित करता है और याहवे के साथ सम्बन्धवाचक रचना हिन्दी में स्वाभाविक है।
- source_word: מֵאִתִּי
  choice: मुझसे निकलकर
  rationale: מֵאִתִּי अलगाव या आरम्भ-बिंदु “मेरे पास से/मुझसे” बताता है। “मुझसे निकलकर” सिदकियाह के व्यंग्य को स्पष्ट करता है, मानो आत्मा उसे छोड़कर मीकायाह के पास गया हो।
- source_word: לְדַבֵּר אֹתָךְ
  choice: तुझसे बात करने के लिए
  rationale: इस प्रसंग में इसका अर्थ मीकायाह से बोलना है। एकवचन सम्बोधन के कारण “तुझसे” मूल की सीधी और अपमानजनक चुनौती का स्वर बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम है। “याहवे” उसे किसी उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है।
- issue: רוּחַ का सन्दर्भ
  choice: आत्मा
  alternative: रूह; हवा
  rationale: यहाँ प्रसंग भविष्यद्वक्ताओं के माध्यम से बोलने वाले याहवे के आत्मा का है। फिर भी वाक्य सिदकियाह के दावे को सत्य घोषित नहीं करता, बल्कि उसकी व्यंग्यपूर्ण चुनौती को ज्यों का त्यों रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन में सामान्य भूतकाल का प्रयोग है। सिदकियाह के व्यंग्यपूर्ण और आक्रामक स्वर को “तुझसे” तथा गति के रूपक से बनाए रखा गया है; उसके दावे की धर्मवैज्ञानिक सत्यता को अनुवाद ने स्वयं निर्णीत नहीं किया।
