source:
  edition: WLC
  text: וּ/מֶ֣לֶךְ יִשְׂרָאֵ֡ל וִֽ/יהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֡ה יוֹשְׁבִים֩ אִ֨ישׁ עַל כִּסְא֜/וֹ מְלֻבָּשִׁ֤ים בְּגָדִים֙ וְ/יֹשְׁבִ֣ים בְּ/גֹ֔רֶן פֶּ֖תַח שַׁ֣עַר שֹׁמְר֑וֹן וְ/כָל הַ֨/נְּבִיאִ֔ים מִֽתְנַבְּאִ֖ים לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/009.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, and sitting at the threshing floor at the entrance of the gate of Samaria[b], and all the prophets were prophesying before them.
translation:
  language: hi
  text: इस्राएल का राजा और यहूदा का राजा यहोशापात अपने-अपने सिंहासनों पर वस्त्र पहने हुए बैठे थे। वे शोमरोन के फाटक के प्रवेश-द्वार पर स्थित खलिहान में बैठे थे, और सभी भविष्यद्वक्ता उनके सामने भविष्यवाणी कर रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: आरंभिक ו को हिन्दी कथात्मक प्रवाह में अलग से ‘और’ कहना आवश्यक नहीं; इससे कोई स्पष्ट कालसूचक अर्थ नहीं जोड़ा गया।
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: और यहूदा का राजा यहोशापात
  rationale: समन्वय को ‘और’ से रखा गया और उपाधि को नाम से पहले रखकर स्वाभाविक आधुनिक हिन्दी बनाई गई।
- source_word: יוֹשְׁבִים ... וְיֹשְׁבִים
  choice: बैठे थे। वे ... बैठे थे
  rationale: इब्रानी में ישׁב की पुनरावृत्ति दृश्य के आसन और स्थान दोनों को बताती है; हिन्दी में दो वाक्यों द्वारा इसे स्पष्ट और स्वाभाविक रूप से सुरक्षित रखा गया।
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: अपने-अपने सिंहासन पर
  rationale: אִישׁ का वितरणात्मक अर्थ ‘प्रत्येक’ है; राजकीय संदर्भ में כִּסֵּא के लिए ‘सिंहासन’ उपयुक्त है।
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: राजसी वस्त्र पहने
  rationale: शाब्दिक अर्थ ‘वस्त्र पहने हुए’ है; राजाओं की औपचारिक सार्वजनिक बैठक के संदर्भ में ‘राजसी वस्त्र’ स्वाभाविक है, यद्यपि विशेष प्रकार के चोगे का दावा नहीं करता।
- source_word: בְּגֹרֶן
  choice: खलिहान में
  rationale: גֹּרֶן अनाज दाँवने/मँड़ाई के स्थान को सूचित करता है; सामान्य आधुनिक हिन्दी में ‘खलिहान’ सहज समतुल्य है।
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: शोमरोन के फाटक के प्रवेश-द्वार के पास
  rationale: संरचना में फाटक के मुख/प्रवेश का स्थान बताया गया है; ‘के पास’ हिन्दी में बְּगֹרֶן के साथ स्थान-संबंध को स्वाभाविक बनाता है।
- source_word: וְכָל הַנְּבִיאִים
  choice: और सभी भविष्यद्वक्ता
  rationale: सरल संयोजन मूल के संचयी दृश्य-वर्णन को बनाए रखता है।
- source_word: מִתְנַבְּאִים לִפְנֵיהֶם
  choice: उनके सामने भविष्यवाणी कर रहे थे
  rationale: हित्पएल रूप यहाँ भविष्यद्वक्ताई क्रिया को दर्शाता है और לִפְנֵיהֶם उनकी उपस्थिति में/उनके सामने होने का भाव देता है।
