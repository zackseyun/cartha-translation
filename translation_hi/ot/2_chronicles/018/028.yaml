- from: तब इस्राएल का राजा और यहूदा का राजा यहोशापात गिलाद के रामोत को चढ़ गए।
  to: तब इस्राएल का राजा और यहोशापात, यहूदा का राजा, रामोत-गिलाद की ओर चढ़ गए।
  rationale: 'The revision standardizes the compound place name, improves Hindi idiom for movement upward toward a destination, and retains all source elements: the king of Israel, Jehoshaphat identified as king of Judah, and their ascent toward Ramoth-gilead. No interpretive military nuance has been introduced.'
