  text: וַ/יַּ֧עַל מֶֽלֶךְ יִשְׂרָאֵ֛ל וִֽ/יהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֶל רָמֹ֥ת גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/028.yaml
  text: So the king of Israel and Jehoshaphat king of Judah went up to Ramoth-gilead.
translation:
  language: hi
  text: तब इस्राएल का राजा और यहोशापात, यहूदा का राजा, रामोत-गिलाद की ओर चढ़ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है। यहाँ दो राजाओं की किसी स्थान की ओर यात्रा के लिए बहुवचन क्रिया स्वाभाविक हिंदी में प्रयुक्त हुई है; इसमें मूल पाठ से अधिक स्पष्ट सैन्य अर्थ नहीं जोड़ा गया।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: यह ज्ञात राजा के लिए प्रयुक्त सामान्य राजकीय पदवी है; यह रूप हिंदी में स्वाभाविक और पारदर्शी है।
- source_word: וִיהוֹשָׁפָט
  choice: और यहूदा का राजा यहोशापात
  rationale: संयोजक का अर्थ 'और' रखा गया है। हिंदी में व्यक्ति की पहचान सहज बनाने के लिए पदवी को नाम से पहले रखा गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: नाम के साथ लगी राजकीय पदवी का अर्थ स्पष्ट रखते हुए हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: אֶל
  choice: को
  rationale: यहाँ परसर्ग गंतव्य की ओर गति बताता है; स्थान-नाम के साथ 'को चढ़ गए' स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: רָמֹת גִּלְעָד
  choice: गिलाद के रामोत
  rationale: यौगिक स्थान-नाम को प्रचलित हिंदी बाइबलीय रूप में प्रस्तुत किया गया है, जो रामोत को गिलाद क्षेत्र से संबद्ध करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। मूल के 'ऊपर जाने' वाले भाव को 'चढ़ गए' से बचाया गया है और कोई अनुल्लिखित सैन्य विवरण नहीं जोड़ा गया।
