  text: Micaiah said[a], “Behold, you will see on that day when you go into an inner room to hide yourself.”
translation:
  language: hi
  text: मीकायाह ने कहा, “देख, उस दिन तू देखेगा, जब तू छिपने के लिए एक अंदरूनी कमरे[a] में जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “कमरे में कमरा” है; इसका अर्थ “एक अंदरूनी कमरे में” या संभवतः “एक कमरे से दूसरे कमरे में” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: देख
  rationale: यह ध्यान खींचने वाला संकेतसूचक पद है। ‘देख’ आधुनिक और स्वाभाविक हिंदी में इसकी तात्कालिकता बनाए रखता है।
- source_word: רֹאֶה
  choice: तू स्वयं देख लेगा
  rationale: यद्यपि इब्रानी रूप कृदंत है, इस प्रसंग में वह भविष्यसूचक अर्थ देता है। ‘स्वयं’ अनुभव द्वारा बात सत्य जान लेने के भाव को स्पष्ट करता है, जबकि देखने की मूल छवि भी बनी रहती है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी कालवाचक मुहावरे का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: אֲשֶׁר תָּבוֹא
  choice: जब तू … जाएगा
  rationale: संबंधवाचक पद और क्रिया यहाँ उस परिस्थिति का परिचय देते हैं जिसमें भविष्यवाणी पूरी होगी।
- source_word: חֶדֶר בְּחֶדֶר
  choice: एक भीतरी कोठरी में
  rationale: शाब्दिक पुनरुक्ति ‘कोठरी में कोठरी’ किसी भीतर की अथवा अधिक सुरक्षित कोठरी में जाने का संकेत दे सकती है। मुख्य पाठ में अर्थ-सुगम रूप रखा गया है और वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: לְהֵחָבֵא
  choice: छिपने के लिए
  rationale: निफ़अल क्रियारूप का आत्मवाचक भाव हिंदी में कर्ता ‘तू’ और ‘छिपने’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
