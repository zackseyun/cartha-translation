  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। एकवचन संबोधन के लिए ‘तू’ चुना गया है, क्योंकि मीकायाह सीधे सिदकिय्याह को उत्तर दे रहा है; इससे मूल पाठ का निकट और टकरावपूर्ण संबोधन बना रहता है।
