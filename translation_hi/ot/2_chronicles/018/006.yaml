source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/006.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh[b], that we may inquire of him?”
translation:
  language: hi
  text: परन्तु यहोशापात ने कहा, “क्या यहाँ याहवे का कोई और[a] नबी नहीं है, जिससे हम पूछें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यहाँ याहवे का कोई नबी अब भी है, जिससे हम पूछें?”
    reason: עוֹד का अर्थ प्रसंग में ‘कोई और’ भी हो सकता है और ‘अब भी’ भी; पादटिप्पणी इस वास्तविक शाब्दिक सम्भावना को सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर यहाँ यहोशापात पिछले नबियों की एकमत बात के विपरीत प्रश्न उठाता है; इसलिए ‘परन्तु’ प्रसंग का विरोध स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: הַאֵין
  choice: क्या ... नहीं है
  rationale: प्रश्नवाचक הֲ और निषेध אֵין मिलकर पुष्टि चाहने वाला नकारात्मक प्रश्न बनाते हैं; हिन्दी में यह संरचना उसी बल को सहज रूप से रखती है।
- source_word: פֹּה
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: נָבִיא
  choice: नबी
  rationale: נָבִיא के लिए सरल, प्रचलित और अर्थ-सटीक हिन्दी बाइबलीय शब्द।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: लामेद यहाँ सम्बन्ध या प्रतिनिधित्व सूचित करता है—याहवे से सम्बन्धित और उसकी ओर से बोलने वाला नबी। परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: עוֹד
  choice: कोई और
  rationale: प्रसंग में यहोशापात पहले से उपस्थित नबियों के अतिरिक्त एक नबी पूछ रहा है। ‘कोई और’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘अब भी’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְנִדְרְשָׁה
  choice: जिससे हम पूछें
  rationale: דרשׁ यहाँ नबी से परमेश्वर की ओर से उत्तर जानने के लिए पूछने का भाव रखता है। प्रथम पुरुष बहुवचन कोहोर्टेटिव को ‘हम पूछें’ प्रस्तावात्मक भाव सहित व्यक्त करता है।
- source_word: מֵאֹתוֹ
  choice: जिससे
  rationale: מִן और सर्वनाम उस व्यक्ति को दर्शाते हैं जिससे उत्तर पूछा जाए। ‘जिससे’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा नबी की मध्यस्थ भूमिका को आवश्यकता से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय विशिष्ट नाम יהוה है। ‘याहवे’ उसका प्रत्यक्ष हिन्दी लिप्यंतरण है और पद में परमेश्वर के वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- issue: नबी से पूछने का आशय
  choice: जिससे हम पूछें
  alternative: जिसके द्वारा हम याहवे से पूछें
  rationale: प्रसंग में नबी के माध्यम से परमेश्वर की इच्छा जानना निहित है, पर मूल वाक्य प्रत्यक्षतः ‘उससे पूछें’ कहता है। मुख्य पाठ उसी संक्षिप्तता को रखता है और निहित मध्यस्थता को जोड़कर स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘परन्तु’ प्रसंगगत विरोध को स्पष्ट करता है; ‘नबी’ सामान्य पाठकों के लिए प्रचलित है। वाक्य को अनावश्यक धार्मिक व्याख्या से मुक्त रखते हुए हिब्रू की संक्षिप्तता और עוֹד की अस्पष्टता सुरक्षित की गई है।
