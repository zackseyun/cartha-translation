base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/027.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” Then he said, “Hear[b], all you peoples!”
translation:
  language: hi
  text: तब मीकायाह ने कहा, “यदि तुम सचमुच कुशल से लौट आओ, तो याहवे ने मेरे द्वारा बात नहीं की है।”[a] फिर उसने कहा, “हे सब जातियों, सुनो!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे ने मेरे माध्यम से बात नहीं की है।’
    reason: ‘मेरे द्वारा’ इब्रानी בִּי के माध्यमवाचक अर्थ को व्यक्त करता है; ‘मेरे माध्यम से’ स्वाभाविक वैकल्पिक हिन्दी रूप है।
  - marker: b
    text: इब्रानी में ‘जातियों’ बहुवचन है; यह केवल उपस्थित लोगों के बजाय व्यापक भविष्यद्वक्ताई संबोधन है।
    reason: עַמִּים के बहुवचन और उसके व्यापक संबोधन-भाव को स्पष्ट करता है।
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: मीकायाह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: यदि तुम सचमुच ... लौट आओ
  rationale: धातु के infinitive absolute और imperfect के संयोजन से आए बल को ‘सचमुच’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּשָׁלוֹם
  choice: कुशल से
  rationale: यहाँ आशय युद्ध से सुरक्षित और अक्षत लौटने का है; ‘कुशल से’ हिन्दी में स्वाभाविक रहते हुए शालोम के भाव को रखता है।
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: यहोवा ने मेरे द्वारा नहीं कहा
  rationale: בִּי के माध्यमवाचक अर्थ को ‘मेरे द्वारा’ से स्पष्ट किया गया है और भविष्यवाणी के दावे की शर्तात्मक चुनौती सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से दर्शाया गया है, किसी उपाधि से नहीं।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा, गरिमापूर्ण और सहज हिन्दी रूप।
- source_word: עַמִּים כֻּלָּם
  choice: हे सब जातियो
  rationale: עַמִּים के बहुवचन को बनाए रखते हुए सम्बोधन का भाव ‘हे’ से और כֻּלָּם का व्यापक अर्थ ‘सब’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है; हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- issue: अंतिम कथन का वक्ता
  choice: फिर उसने कहा
  alternative: तब मीकायाह ने कहा
  rationale: मूल में केवल ‘और उसने कहा’ है और निकटतम स्पष्ट वक्ता मीकायाह है। सर्वनाम मूल की संरचना और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- issue: עַמִּים का विस्तार
  choice: सब जातियो
  alternative: हे सब लोगो
  rationale: मूल का संज्ञा-रूप बहुवचन है और व्यापक भविष्यद्वक्ताई आह्वान सूचित करता है; इसे एक स्थानीय समूह तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यद्वक्ताई शैली। ‘कुशल से लौट आओ’ स्वाभाविक हिन्दी में सुरक्षित लौटने का भाव देता है; अंतिम सम्बोधन में मूल का बहुवचन और व्यापकता सुरक्षित है।
