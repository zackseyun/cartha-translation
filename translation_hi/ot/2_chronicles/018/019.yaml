source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה מִ֤י יְפַתֶּה֙ אֶת אַחְאָ֣ב מֶֽלֶךְ יִשְׂרָאֵ֔ל וְ/יַ֕עַל וְ/יִפֹּ֖ל בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יֹּ֕אמֶר זֶ֚ה אֹמֵ֣ר כָּ֔כָה וְ/זֶ֖ה אֹמֵ֥ר כָּֽכָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/018/019.yaml
  text: And Yahweh said[a], ‘Who will entice Ahab king of Israel, so that he may go up and fall at Ramoth-gilead?’ And one said this, and another said that.
translation:
  language: hi
  text: और यहोवा ने कहा, “कौन इस्राएल के राजा अहाब को बहकाएगा[a], ताकि वह चढ़ाई करे और रामोत-गिलाद में गिरे?” और एक ने ऐसा कहा और दूसरे ने वैसा कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फुसलाएगा,” “मनाएगा” या “धोखा देगा।”
    reason: פתה के पिएल रूप की प्रसंगानुसार सम्भव अर्थ-छायाएँ बताने के लिए।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יְפַתֶּה
  choice: बहकाएगा
  rationale: पिएल रूप यहाँ अहाब को ऐसी कार्रवाई के लिए प्रेरित करने का भाव रखता है जो उसके पतन की ओर ले जाएगी। ‘बहकाना’ प्रलोभन, मनाने और भ्रमित करने की अर्थ-छायाओं को बिना किसी एक को अत्यधिक निश्चित किए बनाए रखता है।
- source_word: וְיַעַל
  choice: ताकि वह चढ़ाई करे
  rationale: संयोजक सहित अपूर्ण क्रिया प्रश्न के बाद अभिप्रेत उद्देश्य या परिणाम व्यक्त करती है; युद्ध के प्रसंग में ‘चढ़ाई करे’ स्वाभाविक हिन्दी है।
- source_word: וְיִפֹּל
  choice: और ... मारा जाए
  rationale: נפל का शाब्दिक अर्थ ‘गिरना’ है, पर युद्ध-संदर्भ में इसका प्रचलित आशय युद्ध में मारा जाना है; हिन्दी में ‘मारा जाए’ इस आशय को स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: בְּרָמוֹת גִּלְעָד
  choice: रामोत-गिलाद में
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण किया गया है और בְ को हिन्दी के स्वाभाविक स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: זֶה אֹמֵר כָּכָה וְזֶה אֹמֵר כָּכָה
  choice: तब किसी ने कुछ कहा और किसी ने कुछ और
  rationale: यह इब्रानी मुहावरा सभा में दिए गए अलग-अलग सुझावों को दर्शाता है। यह हिन्दी रूप पुनरुक्ति को स्वाभाविक रखते हुए भिन्न मतों का भाव सुरक्षित करता है।
theological_decisions:
- issue: अहाब के पतन में यहोवा की भूमिका
  choice: यहोवा को सीधे यह पूछते हुए दिखाया गया है कि अहाब को कौन बहकाएगा।
  alternative: दैवी सक्रियता को नरम करके ‘कौन उसे बहकाने देगा’ या ‘कौन उसे प्रभावित करेगा’ कहना।
  rationale: इब्रानी पाठ में यहोवा स्वयं विचार-विमर्श आरम्भ करते हैं; अनुवाद इस कठिन धार्मिक तनाव को कम या स्पष्ट करने का प्रयास नहीं करता।
- issue: פתה की नैतिक अर्थ-छाया
  choice: मुख्य पाठ में ‘बहकाएगा’।
  alternative: ‘फुसलाएगा’, ‘मनाएगा’ या ‘धोखा देगा’।
  rationale: प्रसंग भ्रामक परामर्श द्वारा अहाब को घातक अभियान की ओर ले जाने का है, पर क्रिया अपने आप में केवल स्पष्ट धोखे तक सीमित नहीं है। ‘बहकाना’ इस अर्थगत व्यापकता को अपेक्षाकृत अच्छी तरह बनाए रखता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्य-रचना स्वाभाविक रखी गई है, जबकि स्वर्गीय सभा और दैवी सक्रियता से जुड़ा मूल पाठ का तनाव सुरक्षित है।
