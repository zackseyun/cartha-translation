base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/013.yaml
  text: And she looked[a], and behold, the king was standing by his pillar at the entrance, and the officials and the trumpets were beside the king; and all the people of the land were rejoicing and blowing trumpets, and the singers with the instruments of song were leading the praise. Then Athaliah tore her clothes and said[b], “Conspiracy! Conspiracy!”
translation:
  language: hi
  text: उसने देखा कि वहाँ राजा प्रवेश-द्वार पर अपने खंभे के पास खड़ा था। अधिकारी और तुरहियाँ[a] राजा के पास थे; देश के सब लोग आनंद मना रहे थे और तुरहियाँ फूँक रहे थे, और गायक वाद्ययंत्रों के साथ स्तुति का संचालन[b] कर रहे थे। तब अतल्याह ने अपने वस्त्र फाड़े और कहा, “षड्यंत्र! षड्यंत्र!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अधिकारी और तुरहियाँ राजा के पास थे” है। कुछ अनुवाद वाद्यों को उन्हें बजानेवालों के लिए प्रयुक्त लक्षणा मानकर “तुरही बजानेवाले” करते हैं।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “स्तुति का निर्देशन” या “स्तुति के लिए संकेत” भी किया जा सकता है। इस संगीतमय प्रसंग में इब्रानी अभिव्यक्ति कुछ मुहावरेदार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: उसने देखा, और देखो
  rationale: ראה के सामान्य अर्थ ‘देखना’ और הִנֵּה की ध्यान आकर्षित करने वाली सजीव शक्ति—दोनों को बनाए रखता है।
- source_word: הַמֶּלֶךְ עוֹמֵד
  choice: राजा ... खड़ा था
  rationale: कृदन्त עוֹמֵד दृश्य की जारी अवस्था बताता है; इसलिए हिन्दी का अपूर्ण भूतकाल स्वाभाविक है।
- source_word: עַל עַמּוּדוֹ
  choice: अपने खम्भे के पास
  rationale: यहाँ עַל राजकीय खम्भे अथवा निर्धारित खड़े होने के स्थान से स्थानीय सम्बन्ध व्यक्त करता है; ‘पास’ प्रसंग में स्वाभाविक है और ‘खम्भे पर’ जैसी भ्रामक छवि से बचाता है।
- source_word: בַּמָּבוֹא
  choice: प्रवेश-द्वार पर
  rationale: מָבוֹא प्रवेश के स्थान को सूचित करता है; यह स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת עַל הַמֶּלֶךְ
  choice: अधिकारी और तुरहियाँ राजा के पास थे
  rationale: שׂרים का व्यापक अर्थ ‘अधिकारी’ है। मसोराई पाठ में व्यक्तियों के बजाय ‘तुरहियाँ’ हैं; सम्भव लक्षणा को मुख्य पाठ में बदले बिना रखा गया है।
- source_word: וְכָל עַם הָאָרֶץ שָׂמֵחַ
  choice: देश के सब लोग आनन्द मना रहे थे
  rationale: सामूहिक पद עַם הָאָרֶץ और विधेयात्मक שָׂמֵחַ सार्वजनिक उत्सव का दृश्य प्रस्तुत करते हैं।
- source_word: וְתוֹקֵעַ בַּחֲצֹצְרוֹת
  choice: और तुरहियाँ फूँक रहे थे
  rationale: תקע עם חצוצרות का यह सीधा और प्रचलित हिन्दी रूप है।
- source_word: וְהַמְשׁוֹרֲרִים בִּכְלֵי הַשִּׁיר
  choice: और गायक वाद्ययंत्रों के साथ
  rationale: מְשׁוֹרֲרִים विशेष रूप से गायकों को और כְּלֵי הַשִּׁיר संगीत के उपकरणों को दर्शाता है; ‘वाद्ययंत्र’ आधुनिक हिन्दी में सहज है।
- source_word: וּמוֹדִיעִים לְהַלֵּל
  choice: स्तुति का संचालन कर रहे थे
  rationale: इस संगीतमय-उपासना प्रसंग में ידע का हिफ़ील रूप स्तुति को निर्देशित कराने या आगे बढ़ाने का भाव देता है; ‘संचालन’ उस कार्यात्मक अर्थ को अनावश्यक निश्चितता के बिना व्यक्त करता है।
- source_word: קֶשֶׁר קָשֶׁר
  choice: षड्यंत्र! षड्यंत्र!
  rationale: קֶשֶׁר सत्ता के विरुद्ध साज़िश या षड्यंत्र को सूचित करता है। दोहराव और विस्मयपूर्ण आरोप दोनों सुरक्षित रखे गए हैं।
