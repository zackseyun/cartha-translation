base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/011.yaml
  text: Then they brought out the king’s son[a], put the crown and the testimony on him, made him king, and anointed him; and Jehoiada and his sons said, “Long live the king!”
translation:
  language: hi
  text: तब वे राजा के पुत्र को बाहर लाए, उस पर मुकुट और साक्ष्य[a] रखा, उसे राजा बनाया और उसका अभिषेक किया; और यहोयादा और उसके पुत्रों ने कहा, “राजा चिरंजीवी हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था” अथवा “वाचा का दस्तावेज़।” इब्रानी शब्द संभवतः राजा के शासन से संबद्ध लिखित वाचागत साक्ष्य की ओर संकेत करता है।
    reason: הָעֵדוּת के अर्थ और राज्याभिषेक में उसकी भूमिका के बारे में वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיּוֹצִיאוּ
  choice: बाहर लाए
  rationale: हिफ़ील रूप का अर्थ किसी को बाहर लाना है; राज्याभिषेक के लिए राजपुत्र को सार्वजनिक रूप से प्रस्तुत करने के प्रसंग में यह स्वाभाविक है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: यह राजवंशीय पहचान को सीधे और स्पष्ट रूप से बनाए रखता है।
- source_word: הַנֵּזֶר
  choice: मुकुट
  rationale: राज्याभिषेक के प्रसंग में यह राजकीय मुकुट या किरीट को दर्शाता है; ‘मुकुट’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: הָעֵדוּת
  choice: साक्षीपत्र
  rationale: यह ‘साक्ष्य/गवाही’ के मूल भाव को रखते हुए राज्याधिकार से जुड़े लिखित वाचा-विधान की संभावित वस्तुगत प्रकृति भी व्यक्त करता है, पर उसका आशय अत्यधिक संकीर्ण नहीं करता।
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: उसे राजा बनाया
  rationale: हिफ़ील का सीधा अर्थ उसे राज्य करने के पद पर स्थापित करना है; इसे मुकुट रखने की अलग क्रिया में नहीं मिलाया गया।
- source_word: וַיִּמְשָׁחֻהוּ
  choice: उसका अभिषेक किया
  rationale: राजकीय स्थापना के संदर्भ में משׁח का परंपरागत और अर्थपूर्ण हिन्दी रूप ‘अभिषेक करना’ है।
- source_word: יְחִי הַמֶּלֶךְ
  choice: राजा चिरंजीवी हो!
  rationale: यह राजकीय जयघोष की कामनार्थक शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राज्याभिषेक में הָעֵדוּת का अर्थ
  choice: मुख्य पाठ में ‘साक्षीपत्र’
  alternative: ‘व्यवस्था’ या ‘वाचा का दस्तावेज़’
  rationale: इब्रानी शब्द साक्ष्य या गवाही का भाव रखता है और संभवतः राजा के वाचागत दायित्वों से जुड़े लिखित विधान की ओर संकेत करता है। ‘साक्षीपत्र’ इस संबंध को बनाए रखता है, जबकि पादटिप्पणी अन्य संभव अर्थों को खुला रखती है।
- issue: अभिषेक करने वाले कर्ता की पहचान
  choice: वाक्य में सामान्य बहुवचन कर्ता को बनाए रखा; अगले वाक्य में यहोयादा और उसके पुत्र जयघोष करते हैं
  alternative: ‘यहोयादा और उसके पुत्रों ने उसका अभिषेक किया’
  rationale: इब्रानी क्रम में अभिषेक की क्रिया के बाद यहोयादा और उसके पुत्रों का उल्लेख आता है। वे अभिषेक के भी कर्ता समझे जा सकते हैं, लेकिन वाक्य-विन्यास को स्पष्ट करने के नाम पर इस संबंध को अनिवार्य नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साक्षीपत्र’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर धार्मिक-राजकीय प्रसंग में उपयुक्त है और मूल शब्द की वाचागत प्रतिध्वनि को बचाता है।
