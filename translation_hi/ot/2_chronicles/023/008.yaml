base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/008.yaml
  text: So the Levites and all Judah did according to all that Jehoiada the priest had commanded[a], and each man took his men, those coming in on the Sabbath together with those going out on the Sabbath, for Jehoiada the priest had not dismissed the divisions.
translation:
  language: hi
  text: तब लेवियों और सारे यहूदा ने वह सब किया जो यहोयादा याजक ने आज्ञा दी थी। हर एक ने अपने-अपने लोगों को लिया—विश्राम-दिन पर आनेवालों को भी और विश्राम-दिन पर जानेवालों को भी—क्योंकि यहोयादा याजक ने दलों[a] को विदा नहीं किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवा-दलों” अथवा “पालियों”; इसका संकेत नियत क्रम से सेवा करनेवाले याजकीय और लेवीय समूहों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ने ... किया
  rationale: यहाँ עשה यहोयादा की आज्ञा का पालन करने को व्यक्त करता है; हिंदी में ‘वह सब किया जो...’ स्वाभाविक और स्रोत के निकट है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवीय धार्मिक-सेवा समुदाय के लिए मानक हिंदी रूप; कर्ता-चिह्न ‘ने’ के कारण परसर्गीय बहुवचन प्रयुक्त है।
- source_word: וְכָל יְהוּדָה
  choice: और सारे यहूदा
  rationale: भौगोलिक-सामूहिक अभिव्यक्ति को बनाए रखता है; ‘यहूदा’ यहाँ उसके लोगों का सामूहिक संकेत है।
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: वह सब ... जो ... ने आज्ञा दी थी
  rationale: आज्ञापालन की पूर्णता और पहले दी गई आज्ञा, दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक
  rationale: व्यक्तिनाम का प्रचलित लिप्यंतरण और כֹּהֵן का मानक बाइबलीय हिंदी अनुवाद।
- source_word: וַיִּקְחוּ אִישׁ אֶת אֲנָשָׁיו
  choice: हर एक ने अपने लोगों को ... अपने साथ लिया
  rationale: אִישׁ का वितरणात्मक अर्थ ‘हर एक’ है और אֲנָשָׁיו अधीनस्थ कर्मियों को सूचित करता है; ‘सैनिक’ कहना अनावश्यक रूप से व्याख्यात्मक होता।
- source_word: בָּאֵי הַשַּׁבָּת
  choice: विश्राम-दिन को आनेवालों
  rationale: आनेवाले साप्ताहिक सेवा-दल की गति को निकटता से व्यक्त करता है।
- source_word: עִם יוֹצְאֵי הַשַּׁבָּת
  choice: और विश्राम-दिन को जानेवालों, दोनों को
  rationale: आनेवाले और जानेवाले दलों की जोड़ी स्पष्ट करता है; ‘दोनों’ עִם के संयुक्त भाव को स्वाभाविक हिंदी में सामने लाता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों समूहों के उपस्थित रहने का कारण प्रस्तुत करता है।
- source_word: לֹא פָטַר
  choice: विदा नहीं किया था
  rationale: इस प्रसंग में פטר का अर्थ सेवा समाप्त होने पर जाने देना है; ‘विदा करना’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הַמַּחְלְקוֹת
  choice: दलों
  rationale: नियत क्रम में सेवा करनेवाले संगठित याजकीय और लेवीय समूहों के लिए सुबोध शब्द; वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किए गए हैं।
