base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/004.yaml
  text: 'This is what you shall do: one third of you who come in on the Sabbath[a], of the priests and of the Levites, shall be gatekeepers of the thresholds.'
translation:
  language: hi
  text: '“तुम्हें यह करना है: तुम में से, अर्थात उन याजकों और लेवियों में से जो सब्त के दिन आते हैं, एक तिहाई चौखटों पर द्वारपाल हों[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चौखटों की रखवाली करें।’ इब्रानी में ‘द्वारपाल’ और ‘चौखटों’ दोनों शब्द साथ हैं, जो प्रवेश-स्थानों की निगरानी का संकेत देते हैं।
    reason: lexical_alternative
