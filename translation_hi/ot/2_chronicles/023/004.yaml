  choice: तुम्हें यह करना है
  rationale: इब्रानी निर्देशात्मक सूत्र को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है और आदेश का बल बनाए रखता है।
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: तुममें से ... उनका एक तिहाई भाग
  rationale: सम्बोधित समूह में से तीसरे हिस्से का अंशवाचक अर्थ स्पष्ट करता है।
- source_word: בָּאֵי הַשַּׁבָּת
  choice: सब्त के दिन सेवा के लिए आएँगे
  rationale: शाब्दिक अर्थ ‘सब्त के दिन आने वाले’ है; प्रसंग में यह सब्त की निर्धारित सेवा के लिए आने वाले दल को सूचित करता है। ‘सेवा के लिए’ हिन्दी में आशय स्पष्ट करता है, बिना किसी विशिष्ट प्रकार की सेवा जोड़ने के।
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: जो याजक और लेवी
  rationale: इस पदबंध को सब्त के दिन आने वाले समूह की पहचान के रूप में लिया गया है; इससे जटिल इब्रानी वाक्य-विन्यास सहज हिन्दी में आता है।
- source_word: לְשֹׁעֲרֵי הַסִּפִּים
  choice: चौखटों पर द्वारपाल हो
  rationale: שֹׁעֲרֵי के ‘द्वारपाल’ और סִפִּים के ‘चौखटें/देहलियाँ’ दोनों ठोस बिंबों को बनाए रखते हुए प्रवेश-स्थानों की रखवाली का अर्थ देता है।
