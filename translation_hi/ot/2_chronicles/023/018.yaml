  text: וַ/יָּשֶׂם֩ יְהוֹיָדָ֨ע פְּקֻדֹּ֜ת בֵּ֣ית יְהוָ֗ה בְּ/יַ֨ד הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ אֲשֶׁ֣ר חָלַ֣ק דָּוִיד֮ עַל בֵּ֣ית יְהוָה֒ לְֽ/הַעֲל֞וֹת עֹל֣וֹת יְהוָ֗ה כַּ/כָּת֛וּב בְּ/תוֹרַ֥ת מֹשֶׁ֖ה בְּ/שִׂמְחָ֣ה וּ/בְ/שִׁ֑יר עַ֖ל יְדֵ֥י דָוִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/018.yaml
  text: And Jehoiada appointed the oversight of the house of Yahweh into the hand of the priests[a], the Levites, whom David had assigned over the house of Yahweh, to offer up burnt offerings to Yahweh, as it is written in the Law of Moses, with rejoicing and with song[c][b], according to the direction of David.
translation:
  language: hi
  text: और यहोयादा ने यहोवा के भवन की देखरेख याजकों—लेवियों[a]—के हाथ में सौंपी, जिन्हें दाऊद ने यहोवा के भवन के लिए दलों में नियुक्त किया था, कि वे मूसा की व्यवस्था में लिखे अनुसार यहोवा को होमबलियाँ चढ़ाएँ, आनन्द और गीत के साथ, दाऊद की व्यवस्था के अनुसार।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का अर्थ “लेवीय याजक” या “याजक और लेवी” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “दाऊद की व्यवस्था के अनुसार” का शाब्दिक रूप है “दाऊद के हाथों/दाऊद के हाथ से”; आशय दाऊद द्वारा ठहराई गई व्यवस्था भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... פְּקֻדֹּת
  choice: देखरेख ... सौंपी
  rationale: שׂים का मूल अर्थ ‘रखना’ है और פְּקֻדּוֹת यहाँ मन्दिर की नियुक्त देखरेख अथवा जिम्मेदारी को दर्शाता है; प्रशासनिक प्रसंग में ‘देखरेख सौंपना’ स्वाभाविक हिन्दी है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: यह अनुवाद इब्रानी रूपक को बनाए रखता है; ‘मन्दिर’ अधिक व्याख्यात्मक होता।
- source_word: בְּיַד
  choice: के हाथ में सौंपी
  rationale: इब्रानी मुहावरे का ‘हाथ’ वाला बिंब भी सुरक्षित रहता है और जिम्मेदारी सौंपने का प्रशासनिक अर्थ भी स्पष्ट होता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: याजकों—लेवियों—के
  rationale: डैश द्वारा इब्रानी के निकट समानाधिकरणात्मक रूप रखा गया है और इसे निर्णायक रूप से न तो ‘लेवीय याजक’ बनाया गया, न ‘याजक और लेवी’।
- source_word: אֲשֶׁר חָלַק דָּוִיד עַל בֵּית יְהוָה
  choice: जिन्हें दाऊद ने यहोवा के भवन की सेवा के लिए दलों में बाँटा था
  rationale: חלק का मूल भाव बाँटना या भागों में नियुक्त करना है; इतिहास की पुस्तकों के याजकीय सेवा-दलों के प्रसंग में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: होमबलियाँ चढ़ाएँ
  rationale: बलिदानी प्रसंग में עלה के हिफ़ील और עֹלוֹת के लिए यह प्रचलित तथा सटीक हिन्दी पदावली है।
- source_word: כַּכָּתוּב בְּתוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था में लिखे अनुसार
  rationale: यह लिखित मूसीय निर्देश की सूत्रात्मक अभिव्यक्ति को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: בְּשִׂמְחָה וּבְשִׁיר
  choice: आनन्द और गीत के साथ
  rationale: दोनों संज्ञाओं और उपासना के उत्सवी स्वर को सुरक्षित रखा गया है।
- source_word: עַל יְדֵי דָוִיד
  choice: दाऊद के निर्देश के अनुसार
  rationale: शाब्दिक अर्थ ‘दाऊद के हाथों/हाथ से’ है; यहाँ प्रसंगतः दाऊद द्वारा ठहराई गई आराधना-व्यवस्था अथवा निर्देश अभिप्रेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם में याजकों और लेवियों का सम्बन्ध
  choice: मुख्य पाठ में ‘याजकों—लेवियों—के’ रखकर इब्रानी-जैसा समानाधिकरण सुरक्षित किया गया।
  alternative: ‘लेवीय याजकों के’ अथवा ‘याजकों और लेवियों के’।
  rationale: इब्रानी अभिव्यक्ति की व्याकरणिक व्याख्या विवादित है; किसी एक संस्थागत सम्बन्ध को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: עַל יְדֵי דָוִיד का आशय
  choice: दाऊद के निर्देश के अनुसार
  alternative: दाऊद के हाथों/द्वारा
  rationale: प्रसंग में दाऊद स्वयं क्रिया का तत्काल कर्ता नहीं, बल्कि मन्दिर की संगीतमय आराधना की पहले से ठहराई व्यवस्था का स्रोत है; पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी बाइबलीय प्रयोग में समझ में आने वाला रूप चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यहोवा का भवन’, ‘होमबलियाँ’ और ‘मूसा की व्यवस्था’ जैसे परिचित बाइबलीय पद स्रोत-पाठ की औपचारिक बनावट बनाए रखते हैं; कठिन इब्रानी अस्पष्टताओं को पादटिप्पणियों में दर्शाया गया है।
