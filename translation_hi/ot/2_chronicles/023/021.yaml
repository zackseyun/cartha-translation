  yaml_path: translation/ot/2_chronicles/023/021.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. And they put Athaliah to death with the sword.
translation:
  language: hi
  text: और देश के सब लोग आनन्दित हुए, और नगर शांत हो गया। और उन्होंने अतल्याह को तलवार से मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: आनन्दित हुए
  rationale: שׂמח सार्वजनिक हर्ष या प्रसन्नता को व्यक्त करता है; ‘आनन्दित हुए’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: כָל עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: यह पदबंध देश की समस्त जनता को सूचित करता है। ‘देश के सब लोग’ हिब्रू अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָעִיר שָׁקָטָה
  choice: और नगर शांत हो गया
  rationale: שׁקט अशांति के बाद शांति या स्थिरता आने का भाव देता है। पूर्ण क्रिया को हिन्दी में ‘शांत हो गया’ स्वाभाविक रूप से व्यक्त करता है; नगर का नाम मूल में नहीं जोड़ा गया।
- source_word: וְאֶת־עֲתַלְיָהוּ הֵמִיתוּ
  choice: और उन्होंने अतल्याह को ... मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ ‘मृत्यु देना/मार डालना’ है। आरम्भिक וְ को उसके साधारण समन्वयात्मक अर्थ ‘और’ में रखा गया है, बिना कारणात्मक संबंध जोड़े।
- source_word: בֶחָרֶב
  choice: तलवार से
  rationale: בְ यहाँ साधन बताता है; ‘तलवार से’ सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। हिब्रू के समन्वयात्मक वाव को ‘और’ रखा गया है तथा नगर को स्पष्ट रूप से ‘यरूशलेम’ नहीं कहा गया, क्योंकि मूल पाठ केवल ‘नगर’ कहता है।
