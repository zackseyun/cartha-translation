  text: וַ/יִּתֵּן֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י הַ/מֵּא֗וֹת אֶת הַֽ/חֲנִיתִים֙ וְ/אֶת הַ/מָּגִנּוֹת֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑יד אֲשֶׁ֖ר בֵּ֥ית הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/009.yaml
  text: Then Jehoiada the priest gave to the commanders of hundreds the spears[a], the shields, and the large shields that belonged to King David[c][b], which were in the house of God.
translation:
  language: hi
  text: तब यहोयादा याजक ने सौ-सौ सैनिकों के दलों के अधिकारियों को वे भाले, ढालें और बड़ी ढालें दीं, जो राजा दाऊद की थीं और परमेश्वर के भवन में रखी हुई थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दीं
  rationale: נתן का सामान्य कथात्मक अर्थ वस्तुएँ देना या सौंपना है; स्त्रीलिंग बहुवचन क्रिया हिन्दी में सूचीबद्ध वस्तुओं के साथ स्वाभाविक है।
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और पदवी का सीधा अनुवाद।
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के दलों के अधिकारियों को
  rationale: शाब्दिक संरचना 'सैकड़ों के प्रधानों' की सैन्य भूमिका को सामान्य आधुनिक हिन्दी में स्पष्ट करता है और रोमी 'शतपति' जैसी अनावश्यक संगति से बचता है।
- source_word: הַחֲנִיתִים
  choice: भाले
  rationale: חנית का सामान्य और स्पष्ट आधुनिक हिन्दी समतुल्य।
- source_word: הַמָּגִנּוֹת
  choice: ढालें
  rationale: מגן के सामान्य रक्षात्मक हथियार का स्वाभाविक हिन्दी नाम।
- source_word: הַשְּׁלָטִים
  choice: बड़ी ढालें
  rationale: यह מגן से भिन्न दूसरे प्रकार की रक्षात्मक वस्तु है; 'बड़ी ढालें' दोनों पदों का भेद बनाए रखता है, यद्यपि वस्तु का ठीक स्वरूप निश्चित नहीं है।
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: जो राजा दाऊद की थीं
  rationale: हिब्रू संबंधवाचक वाक्यांश स्वामित्व बताता है; हिन्दी में सीधा और स्वाभाविक रूप।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: शाब्दिक 'परमेश्वर का घर' का dignified हिन्दी रूप, जो मंदिर का संकेत देते हुए इतिहासकार की मूल अभिव्यक्ति को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सैन्य पद को अर्थ-स्पष्ट रूप में व्यक्त किया गया है; हथियारों के दो हिब्रू पदों का भेद 'ढालें' और 'बड़ी ढालें' से सुरक्षित रखा गया है।
