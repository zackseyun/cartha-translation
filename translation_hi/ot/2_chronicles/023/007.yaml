  text: וְ/הִקִּיפוּ֩ הַ/לְוִיִּ֨ם אֶת הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/בַּ֖יִת יוּמָ֑ת וִֽ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/בֹא֥/וֹ וּ/בְ/צֵאתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/007.yaml
  text: The Levites shall surround the king on every side[a], each man with his weapons in his hand; and whoever enters the house shall be put to death. Be with the king when he comes in and when he goes out.
translation:
  language: hi
  text: लेवी राजा को चारों ओर से घेरे रहें; हर एक के हाथ में अपने हथियार हों। जो कोई भवन[a] में प्रवेश करे, वह मार डाला जाए। जब राजा भीतर आए और बाहर जाए, तब उसके साथ रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर”; इब्रानी में “भवन,” जो इतिहास की पुस्तकों में मंदिर के लिए प्रचलित नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקִּיפוּ הַלְוִיִּם אֶת־הַמֶּלֶךְ סָבִיב
  choice: लेवी राजा को चारों ओर से घेरे रहें
  rationale: हिफ़ील क्रिया यहाँ यहोयादा के निर्देश के रूप में प्रयुक्त है। ‘घेरे रहें’ आदेश और निरंतर सुरक्षात्मक घेरा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘चारों ओर से’ סָבִיב के पूर्ण घेराव को दर्शाता है।
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: हर एक के हाथ में उसके हथियार हों
  rationale: אִישׁ का प्रयोग वितरणात्मक है, अर्थात प्रत्येक व्यक्ति। इस सशस्त्र पहरे के प्रसंग में כֵלָיו का अर्थ सामान्य उपकरण या पात्र नहीं, बल्कि हथियार है।
- source_word: וְהַבָּא אֶל־הַבַּיִת
  choice: जो कोई भवन में प्रवेश करे
  rationale: संज्ञायुक्त कृदंत सामान्य नियम व्यक्त करता है, इसलिए ‘जो कोई’ उपयुक्त है। בוא אל को यहाँ भीतर प्रवेश करने के अर्थ में अनूदित किया गया है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है। इतिहास-वृत्तांत के प्रसंग में यह मंदिर का प्रचलित संकेत हो सकता है, पर मुख्य पाठ में अनावश्यक विशिष्टता जोड़े बिना ‘भवन’ रखा गया है और संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: יוּמָת
  choice: मार डाला जाए
  rationale: होफ़ाल रूप कारक कर्मवाच्य और दंडादेश का भाव देता है। ‘मार डाला जाए’ केवल मर जाने के बजाय किसी के द्वारा मृत्युदंड दिए जाने का अर्थ सुरक्षित रखता है।
- source_word: וִהְיוּ אֶת־הַמֶּלֶךְ
  choice: राजा के साथ रहना
  rationale: היה के बहुवचन निर्देशात्मक रूप के साथ אֶת यहाँ राजा की संगति और पहरेदार उपस्थिति बताता है। हिन्दी का निर्देशात्मक क्रियारूप ‘रहना’ निकट और स्वाभाविक है।
- source_word: בְּבֹאוֹ וּבְצֵאתוֹ
  choice: जब भीतर आए और जब बाहर जाए
  rationale: इन क्रियार्थक संज्ञाओं की युग्मित अभिव्यक्ति राजा की अंदर-बाहर की गतिविधि दर्शाती है। स्पष्टता के लिए निहित कर्ता ‘राजा’ वाक्य में प्रत्यक्ष रखा गया है।
theological_decisions:
- issue: הַבַּיִת की संदर्भगत पहचान
  choice: मुख्य पाठ में ‘भवन’, पादटिप्पणी में ‘मंदिर’ की संभावना
  alternative: मुख्य पाठ में ‘मंदिर’
  rationale: इब्रानी शब्द स्वयं ‘घर/भवन’ कहता है, जबकि इतिहास-वृत्तांत में वह प्रायः मंदिर के लिए आता है। यह प्रस्तुति मूल की शब्दगत व्यापकता और प्रसंगगत संकेत दोनों सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘लेवी’ हिन्दी बाइबल परंपरा में समुदाय के सदस्यों के लिए स्पष्ट है। अर्धविराम सुरक्षात्मक आदेशों के क्रम को पठनीय बनाता है।
