  text: וְ/אַל יָב֣וֹא בֵית יְהוָ֗ה כִּ֤י אִם הַ/כֹּֽהֲנִים֙ וְ/הַ/מְשָׁרְתִ֣ים לַ/לְוִיִּ֔ם הֵ֥מָּה יָבֹ֖אוּ כִּי קֹ֣דֶשׁ הֵ֑מָּה וְ/כָל הָ/עָ֔ם יִשְׁמְר֖וּ מִשְׁמֶ֥רֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/006.yaml
  text: And let no one enter the house of Yahweh except the priests and the ministering Levites[a]; they may enter, because they are holy[b]. And let all the people keep the charge of Yahweh.
translation:
  language: hi
  text: और याहवे के भवन[a] में केवल याजक और सेवा करने वाले लेवी ही प्रवेश करें, क्योंकि वे पवित्र हैं। और सब लोग याहवे के ठहराए हुए दायित्व का पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का मंदिर।” शाब्दिक रूप से, “याहवे का भवन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יָבוֹא
  choice: और ... कोई प्रवेश न करे
  rationale: אַל के साथ युस्सिव रूप निषेध व्यक्त करता है। यह हिन्दी में निर्देशात्मक बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בֵית יְהוָה
  choice: याहवे का भवन
  rationale: यह इब्रानी पद का निकट और स्वाभाविक रूप है; प्रसंग में इससे मंदिर अभिप्रेत है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: כִּי אִם הַכֹּהֲנִים וְהַמְשָׁרְתִים לַלְוִיִּם
  choice: याजकों और सेवा करनेवाले लेवियों को छोड़कर
  rationale: כִּי אִם निषेध के अपवाद को व्यक्त करता है और מְשָׁרְתִים लेवियों की धार्मिक सेवा का वर्णन करता है।
- source_word: הֵמָּה יָבֹאוּ
  choice: वे प्रवेश कर सकते हैं
  rationale: पूर्ववर्ती अपवाद के बाद यह उनके अधिकृत प्रवेश को दर्शाता है, केवल सामान्य भविष्यकाल को नहीं।
- source_word: כִּי קֹדֶשׁ הֵמָּה
  choice: क्योंकि वे पवित्र हैं
  rationale: קֹדֶשׁ यहाँ पवित्र सेवा के लिए अलग किए जाने की स्थिति बताता है; मूल बाइबलीय श्रेणी को बनाए रखने के लिए 'पवित्र' रखा गया है।
- source_word: יִשְׁמְרוּ מִשְׁמֶרֶת יְהוָה
  choice: याहवे की सौंपी हुई ज़िम्मेदारी निभाएँ
  rationale: सजातीय रचना שׁמר משׁמרת किसी निर्धारित दायित्व, पहरे या आदेश का पालन करने को कह सकती है। प्रसंग में केवल पहरा देने तक अर्थ सीमित न करते हुए स्वाभाविक हिन्दी चुनी गई है और विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: याजकों और लेवियों की पवित्रता
  choice: '''पवित्र'' रखा गया, जिसका प्रसंगगत अर्थ पवित्र सेवा के लिए अलग किया जाना है।'
  alternative: '''अभिषिक्त'' या ''अलग किए हुए'''
  rationale: पद मंदिर में प्रवेश के लिए उनकी धार्मिक स्थिति बताता है; यह नैतिक निष्पापता का दावा नहीं करता।
- issue: ईश्वरीय नाम
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को सुरक्षित रखने के लिए 'याहवे' अपनाया गया है।
- issue: מִשְׁמֶרֶת का अर्थ-क्षेत्र
  choice: सौंपी हुई ज़िम्मेदारी
  alternative: पहरा; आदेश; निर्धारित सेवा
  rationale: शब्द में पहरे और निर्धारित धार्मिक दायित्व दोनों की संभावना है। मुख्य पाठ में व्यापक अर्थ रखा गया है और पादटिप्पणी वास्तविक विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। 'याजक', 'लेवी' और 'पवित्र' जैसे स्थापित बाइबलीय शब्द बनाए गए हैं।
