source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת כָּל הַ/קָּהָ֥ל בְּרִ֛ית בְּ/בֵ֥ית הָ/אֱלֹהִ֖ים עִם הַ/מֶּ֑לֶךְ וַ/יֹּ֣אמֶר לָ/הֶ֗ם הִנֵּ֤ה בֶן הַ/מֶּ֨לֶךְ֙ יִמְלֹ֔ךְ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה עַל בְּנֵ֥י דָוִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/003.yaml
  text: And all the assembly made a covenant in the house of God with the king, and he said to them, “Look, the king’s son will reign, just as the LORD spoke concerning the sons of David.”
translation:
  language: hi
  text: और सारी सभा ने परमेश्वर के भवन में राजा के साथ वाचा बाँधी। तब उसने उनसे कहा, “देखो, राजा का पुत्र राज करेगा, जैसा यहोवा ने दाऊद के पुत्रों के विषय में कहा था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: सारी सभा
  rationale: सामूहिक रूप से उपस्थित समुदाय को स्वाभाविक और स्रोत-संगत ढंग से व्यक्त करता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: औपचारिक और बंधनकारी संबंध/प्रतिज्ञा के बाइबिलीय अर्थ को बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: कथन पर ध्यान खींचने वाले हिब्रू उद्गार का सरल, वर्तमान हिन्दी रूप।
- source_word: יִמְלֹךְ
  choice: राज करेगा
  rationale: अपूर्ण क्रिया के प्रसंगगत भाव—भावी राजत्व—को स्पष्ट और सीधा रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְּנֵי דָוִיד
  choice: दाऊद के पुत्रों
  rationale: बहुवचन בְּנֵי को बनाए रखता है और कथन को केवल एक उत्तराधिकारी तक सीमित नहीं करता।
theological_decisions:
- issue: राजा के पुत्र के राज करने की निश्चितता
  choice: “राजा का पुत्र ही राज करेगा”
  alternative: “राजा का पुत्र राज करे”
  rationale: יִמְלֹךְ यहाँ भविष्यसूचक/घोषणात्मक कथन है; इसे आज्ञा या केवल इच्छा के रूप में नहीं लिया गया।
- issue: दाऊद के वंश के विषय में दिव्य प्रतिज्ञा
  choice: “दाऊद के पुत्रों के विषय में”
  alternative: “दाऊद के वंशजों के विषय में”
  rationale: औपचारिक बहुवचन को सुरक्षित रखते हुए मूल की वंशगत व्यापकता और अभिव्यक्ति दोनों बनाए गए हैं।
- issue: “उसने” का संदर्भ
  choice: सर्वनाम को यथावत रखा
  alternative: यहोयादा ने उनसे कहा
  rationale: हिब्रू में वक्ता सर्वनाम से व्यक्त है; निकटवर्ती संदर्भ से पहचान संभव है, इसलिए पद के भीतर नाम जोड़कर अस्पष्टता को कृत्रिम रूप से नहीं हटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सहज है। “वाचा” और “यहोवा” जैसे स्थापित बाइबिलीय पद स्रोत की औपचारिक तथा धर्मवैचारिक विशेषताओं को बनाए रखते हैं।
