  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप रखा गया है। मंदिर के लिए בַּיִת का अनुवाद ‘भवन’ किया गया है ताकि मूल का शब्दचित्र बना रहे; प्रसंग से यह यहोवा का भवन अर्थात मंदिर है।
