base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/010.yaml
  text: And he stationed all the people, each man with his weapon in his hand, from the south side of the house to the north side of the house, by the altar and by the house, around the king.
translation:
  language: hi
  text: उसने सब लोगों को, हर एक को हाथ में अपना हथियार लिए हुए, भवन के दक्षिणी भाग से लेकर भवन के उत्तरी भाग तक, वेदी और भवन के पास, राजा के चारों ओर तैनात कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֶּתֶף הַבַּיִת הַיְמָנִית
  choice: भवन के दक्षिणी भाग से
  rationale: כָּתֵף का मूल अर्थ ‘कंधा/पार्श्व’ है; दिशात्मक प्रयोग में יְמָנִית यहाँ ‘दक्षिणी’ को सूचित करता है। आधुनिक हिन्दी में ‘दक्षिणी भाग’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: עַד כֶּתֶף הַבַּיִת הַשְּׂמָאלִית
  choice: भवन के उत्तरी भाग तक
  rationale: שְׂמָאלִית का शाब्दिक संबंध ‘बाएँ’ से है, पर पूर्वाभिमुख दिशाबोध में यह उत्तर दिशा को सूचित करता है; इसलिए ‘उत्तरी भाग’ स्पष्ट और ऐतिहासिक रूप से उपयुक्त है।
- source_word: שִׁלְחוֹ
  choice: अपना हथियार
  rationale: यह शब्द यहाँ हाथ में धारण किए जाने वाले हथियार के लिए प्रयुक्त है; हथियार का प्रकार अनिर्दिष्ट रहने दिया गया है।
- source_word: וַיַּעֲמֵד
  choice: तैनात कर दिया
  rationale: हिफ़ील रूप का अर्थ लोगों को नियत स्थान पर खड़ा करना है; सैनिक सुरक्षा-व्यवस्था के प्रसंग में ‘तैनात कर दिया’ स्वाभाविक है।
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: राजा के चारों ओर
  rationale: वाक्यांश राजा को घेरे हुए रक्षक-विन्यास व्यक्त करता है; हिन्दी में यही सीधा और स्वाभाविक रूप है।
theological_decisions: []
