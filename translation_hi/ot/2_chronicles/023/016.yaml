  edition: WLC
  text: וַ/יִּכְרֹ֤ת יְהוֹיָדָע֙ בְּרִ֔ית בֵּינ֕/וֹ וּ/בֵ֥ין כָּל הָ/עָ֖ם וּ/בֵ֣ין הַ/מֶּ֑לֶךְ לִ/הְי֥וֹת לְ/עָ֖ם לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/016.yaml
  text: Then Jehoiada made a covenant between himself[a], all the people, and the king[c][b], that they should be Yahweh's people.
translation:
  language: hi
  text: तब यहोयादा ने अपने और सारी प्रजा तथा राजा के बीच एक वाचा बाँधी[a] कि वे याहवे की प्रजा हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाचा काटी।”
    reason: lexical_alternative
  - marker: b
    text: या “कि वे याहवे के लिए एक प्रजा हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרֹת בְּרִית
  choice: वाचा बाँधी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटी’ है, पर आधुनिक हिन्दी में ‘वाचा बाँधी’ स्वाभाविक है और उसकी औपचारिक, गंभीर प्रतिबद्धता को बनाए रखता है। आरम्भ का ‘तब’ कथात्मक וַ־ को व्यक्त करता है।
- source_word: בֵּינוֹ וּבֵין כָּל־הָעָם וּבֵין הַמֶּלֶךְ
  choice: अपने, सारी प्रजा और राजा के बीच
  rationale: इब्रानी पाठ यहोयादा, सारी प्रजा और राजा—इन तीनों को वाचा में सम्मिलित पक्षों के रूप में रखता है। ‘अपने’ का संकेत यहोयादा की ओर है; स्रोत में ‘देश की’ जैसा कोई विस्तार नहीं है।
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: कि वे याहवे की प्रजा हों
  rationale: यह उद्देश्य/परिणाम बताने वाले वाक्यांश का सहज हिन्दी रूप है और याहवे से वाचागत संबंध तथा सम्बद्धता व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: स्रोत में परमेश्वर का विशिष्ट वाचा-नाम है; इसलिए उसका लिप्यंतरण ‘याहवे’ किया गया है।
theological_decisions:
- issue: वाचा के पक्ष और उसका उद्देश्य
  choice: यहोयादा, सारी प्रजा और राजा वाचा के पक्ष हैं; उद्देश्य है कि वे याहवे की प्रजा हों
  alternative: याहवे को एक वाचा-पक्ष मानना
  rationale: इब्रानी व्याकरण ‘उसके बीच’, ‘सारी प्रजा के बीच’ और ‘राजा के बीच’ को समानांतर रखता है। याहवे का नाम बाद के उद्देश्य-वाक्यांश में आता है, न कि वाचा-पक्षों की सूची में।
- issue: לְעָם לַיהוָה में संबंध का स्वरूप
  choice: याहवे की प्रजा
  alternative: याहवे के लिए एक प्रजा
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी द्वारा वाचागत सम्बद्धता व्यक्त की गई है; अधिक रूप-समीपी विकल्प पाद-टिप्पणी में रखा गया है ताकि मूल की संरचना और संभावित बल सुरक्षित रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वाचा बाँधी’ हिन्दी में प्रचलित धार्मिक मुहावरा है; ‘सारी प्रजा’ כָּל־הָעָם का बिना अनावश्यक विस्तार के अनुवाद है।
