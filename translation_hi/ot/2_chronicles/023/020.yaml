source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/אֶת הָֽ/אַדִּירִים֩ וְ/אֶת הַ/מּֽוֹשְׁלִ֨ים בָּ/עָ֜ם וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יּ֤וֹרֶד אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּבֹ֛אוּ בְּ/תֽוֹךְ שַׁ֥עַר הָֽ/עֶלְי֖וֹן בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יּוֹשִׁ֨יבוּ֙ אֶת הַ/מֶּ֔לֶךְ עַ֖ל כִּסֵּ֥א הַ/מַּמְלָכָֽה־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/020.yaml
  text: Then he took the commanders of hundreds[a], the nobles, the rulers of the people, and all the people of the land, and brought the king down from the house of Yahweh[c][b]. They entered through the upper gate of the king’s house and seated the king on the throne of the kingdom.
translation:
  language: hi
  text: तब उसने सैकड़ों के प्रधानों, प्रतिष्ठित लोगों[a], प्रजा के शासकों और देश की सारी प्रजा[b] को साथ लिया और राजा को यहोवा के भवन से नीचे ले आया। वे राजभवन[c] के ऊपरी फाटक से होकर भीतर गए और उन्होंने राजा को राज्य के सिंहासन पर बैठाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सामर्थी लोगों’ अथवा ‘प्रमुख व्यक्तियों’। इब्रानी शब्द प्रतिष्ठित या शक्तिशाली व्यक्तियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘देश के सारे लोग’; राजकीय वृत्तांतों में यह अभिव्यक्ति प्रजा को एक सामाजिक-राजनीतिक समुदाय के रूप में सूचित कर सकती है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से ‘राजा का भवन’; अर्थात राजमहल।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: उसने…को साथ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ यहोयादा के इन समूहों को अपने साथ लेकर चलने का भाव है। यह रूप हिन्दी में स्वाभाविक रहते हुए इब्रानी क्रिया के निकट है।
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सैकड़ों के प्रधानों
  rationale: यह सैन्य पद का औपचारिक और संरचनात्मक रूप से निकट अनुवाद है; ‘सूबेदार’ या रोमी भाव वाला कोई पद अनावश्यक ऐतिहासिक अर्थ जोड़ सकता है।
- source_word: הָאַדִּירִים
  choice: प्रतिष्ठित लोगों
  rationale: אַדִּירִים सामर्थ्यवान, प्रमुख या ऊँचे दर्जे के व्यक्तियों को सूचित कर सकता है। प्रसंग में ‘प्रतिष्ठित लोग’ सामाजिक-राजनीतिक प्रमुखता व्यक्त करता है, पर केवल शारीरिक वीरता नहीं।
- source_word: הַמֹּשְׁלִים בָּעָם
  choice: प्रजा के शासकों
  rationale: यह उन व्यक्तियों को सूचित करता है जो प्रजा के बीच अधिकार रखते थे। यह अनुवाद संक्षिप्त, स्पष्ट और मूल के निकट है।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश की सारी प्रजा
  rationale: राजकीय वृत्तांतों में यह एक सामाजिक-राजनीतिक समुदाय के लिए प्रचलित इब्रानी अभिव्यक्ति है। ‘प्रजा’ राजतंत्रीय प्रसंग में उपयुक्त और सहज है।
- source_word: וַיּוֹרֶד אֶת הַמֶּלֶךְ
  choice: राजा को…नीचे ले आया
  rationale: ירד के हिफ़ईल रूप में ‘नीचे ले जाना’ का दिशात्मक और causative भाव है; मंदिर से राजभवन की ओर गति को यह स्पष्ट रखता है।
- source_word: מִבֵּית יְהוָה
  choice: यहोवा के भवन से
  rationale: בֵּית יְהוָה का निकट रूप ‘यहोवा का भवन’ है; यह मंदिर का संकेत देते हुए मूल की ‘भवन/घर’ वाली अभिव्यक्ति बनाए रखता है।
- source_word: בְּתוֹךְ שַׁעַר הָעֶלְיוֹן
  choice: ऊपरी फाटक से होकर भीतर
  rationale: गतिशील प्रसंग में בְּתוֹךְ का स्थानिक भाव ‘से होकर भीतर’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: शाब्दिक अर्थ ‘राजा का भवन’ है। ‘राजभवन’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ महल/राजकीय निवास का आशय स्पष्ट करता है; निकटतर विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיּוֹשִׁיבוּ
  choice: उन्होंने…बैठाया
  rationale: क्रिया causative है, अर्थात ‘बैठाया’। बहुवचन कर्ता को स्पष्ट करने के लिए हिन्दी में ‘उन्होंने’ रखा गया है।
- source_word: כִּסֵּא הַמַּמְלָכָה
  choice: राज्य के सिंहासन
  rationale: यह כִּסֵּא और מַמְלָכָה दोनों संज्ञाओं को स्पष्ट रखते हुए मूल वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि इसे केवल उपाधि ‘प्रभु’ से बदलकर नाम को अस्पष्ट किया गया है। उच्चारण की अनिश्चितता के कारण ‘याहवे’ भी सम्भव रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथन की क्रमिकता तथा एकवचन से बहुवचन कर्ता में इब्रानी परिवर्तन को हिन्दी में स्पष्ट किया गया है। सभी पादटिप्पणी चिह्न सम्बद्ध शब्दों के ठीक बाद रखे गए हैं।
