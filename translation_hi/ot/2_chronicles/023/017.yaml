base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/017.yaml
  text: Then all the people went to the house of Baal and tore it down, and they smashed his altars and his images, and they killed Mattan the priest of Baal before the altars.
translation:
  language: hi
  text: तब सब लोग बाल के भवन में गए और उसे ढा दिया। उन्होंने उसकी वेदियाँ और उसकी मूर्तियाँ चकनाचूर कर दीं और बाल के पुरोहित मत्तान को वेदियों के सामने मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵית הַבַּעַל
  choice: बाल का भवन
  rationale: यह पद बाल के उपासना-स्थल को सूचित करता है। ‘भवन’ मूल के सामान्य शब्द בֵּית से निकट रहते हुए संदर्भ में मंदिर का अर्थ स्वाभाविक रूप से देता है।
- source_word: וַיִּתְּצֻהוּ
  choice: उसे ढा दिया
  rationale: क्रिया का अर्थ उस भवन को गिराना या ध्वस्त करना है; सर्वनाम का संबंध निकटवर्ती ‘बाल के भवन’ से है।
- source_word: צְלָמָיו
  choice: उसकी मूर्तियाँ
  rationale: צְלָמִים देवता के दृश्य प्रतिरूपों या उपासना में प्रयुक्त मूर्तियों को दर्शाता है; आधुनिक हिन्दी में ‘मूर्तियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: שִׁבֵּרוּ
  choice: चकनाचूर कर दीं
  rationale: यह गहन रूप में तोड़ने की कार्रवाई बताता है और दोनों कर्मों—वेदियों तथा मूर्तियों—पर लागू होता है।
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: वेदियों के सामने
  rationale: לִפְנֵי का सीधा स्थानवाचक अर्थ ‘के सामने’ है और बहुवचन ‘वेदियों’ सुरक्षित रखा गया है।
theological_decisions:
- issue: बाल के लिए पुल्लिंग एकवचन सर्वनाम
  choice: ‘उसकी’ द्वारा बाल से संबंध व्यक्त किया गया
  alternative: ‘उनकी’ या संज्ञा को दोहराना
  rationale: इब्रानी में प्रत्यय पुल्लिंग एकवचन है और बाल देवता की ओर संकेत करता है; इसे बिना समर्थन बहुवचन या आदरसूचक नहीं बनाया गया।
- issue: बाल के उपासना-स्थल की संज्ञा
  choice: ‘बाल का भवन’
  alternative: ‘बाल का मंदिर’
  rationale: ‘मंदिर’ संदर्भगत अर्थ को अधिक स्पष्ट करता, पर ‘भवन’ मूल בית की व्यापकता बनाए रखता है और किसी विशिष्ट धार्मिक स्थापत्य की अतिरिक्त धारणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य-विभाजन हिन्दी में पठनीयता बढ़ाता है, जबकि मूल घटनाक्रम और समानांतर क्रियाएँ सुरक्षित हैं।
