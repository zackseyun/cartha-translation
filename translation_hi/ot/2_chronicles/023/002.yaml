id: 2CH.23.2
reference: 2 Chronicles 23:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּסֹ֨בּוּ֙ בִּֽ/יהוּדָ֔ה וַ/יִּקְבְּצ֤וּ אֶת הַ/לְוִיִּם֙ מִ/כָּל עָרֵ֣י יְהוּדָ֔ה וְ/רָאשֵׁ֥י הָ/אָב֖וֹת לְ/יִשְׂרָאֵ֑ל וַ/יָּבֹ֖אוּ אֶל יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/002.yaml
  text: And they went throughout Judah and gathered the Levites from all the cities of Judah[a], and the heads of the fathers’ houses of Israel, and they came to Jerusalem.
translation:
  language: hi
  text: वे यहूदा भर में घूमे और यहूदा के सभी नगरों से लेवियों तथा इस्राएल के पितृकुलों के मुखियाओं[a] को इकट्ठा किया। फिर वे यरूशलेम आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् कुलों या परिवारों के मुखिया।
    reason: मूल हिब्रू के वंश-संबंधी मुहावरे ‘पितृकुलों के मुखिया’ का सरल स्पष्टीकरण।
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  choice: वे यहूदा भर में घूमे
  rationale: सבב यहाँ किसी क्षेत्र में चारों ओर जाकर कार्य पूरा करने का भाव देता है; ‘यहूदा भर में घूमे’ इस क्षेत्रव्यापी गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְבְּצוּ
  choice: इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ लोगों को एकत्र करना है; यह लेवियों और मुखियाओं, दोनों कर्मों के साथ सहज बैठता है।
- source_word: אֶת־הַלְוִיִּם
  choice: लेवियों
  rationale: यह मानक हिन्दी बाइबलीय जातीय और उपासना-संबंधी पद है।
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: यहूदा के सभी नगरों से
  rationale: מִן स्रोत और כָּל व्यापकता बताते हैं; यह अनुवाद दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: וְרָאשֵׁי הָאָבוֹת
  choice: तथा ... पितृकुलों के मुखियाओं
  rationale: यह वंश अथवा कुल पर आधारित नेतृत्व का पारिभाषिक मुहावरा है। ‘पितृकुलों के मुखिया’ स्रोत की सांस्कृतिक संरचना रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के
  rationale: यहाँ לְ संबंध या संबद्धता प्रकट करता है; ‘इस्राएल के’ मूल की अभिव्यक्ति को बिना यहूदा तक सीमित किए बनाए रखता है।
- source_word: וַיָּבֹאוּ אֶל־יְרוּשָׁלִָם
  choice: फिर वे यरूशलेम आए
  rationale: בוא אֶל का स्वाभाविक अर्थ किसी स्थान पर आना है। ‘फिर’ हिब्रू कथात्मक וַ के क्रमिक भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहूदा-केंद्रित प्रसंग में ‘इस्राएल’ का दायरा
  choice: मुख्य पाठ में ‘इस्राएल’ को यथावत रखा गया है।
  alternative: ‘यहूदा’ अथवा ‘इस्राएल की प्रजा’
  rationale: मूल पाठ स्पष्टतः יִשְׂרָאֵל कहता है। इसे ‘यहूदा’ करना पाठ के व्यापक वाचा-संबंधी शब्द को अनावश्यक रूप से संकुचित कर देता।
- issue: הָאָבוֹת का कुल-संबंधी मुहावरा
  choice: ‘पितृकुलों के मुखिया’ मुख्य पाठ में रखा गया है और पादटिप्पणी में सरल विकल्प दिया गया है।
  alternative: ‘कुलों के मुखिया’ अथवा ‘परिवारों के मुखिया’
  rationale: ‘पितृकुल’ वंशगत और प्रशासनिक संरचना को सुरक्षित रखता है; पादटिप्पणी सामान्य पाठक के लिए इसका आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। एक लंबे हिब्रू समन्वित वाक्य को दो हिन्दी वाक्यों में बाँटकर घटनाक्रम स्पष्ट किया गया है, जबकि सभी सहभागियों और क्रम को सुरक्षित रखा गया है।
