  yaml_path: translation/ot/2_chronicles/023/014.yaml
  text: Then Jehoiada the priest brought out the commanders of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, let him be put to death with the sword.” For the priest had said, “Do not put her to death in the house of Yahweh.”
translation:
  language: hi
  text: तब याजक यहोयादा सेना पर नियुक्त सौ-सौ सैनिकों के अधिकारियों को बाहर ले आया और उनसे कहा, “उसे सैनिक पंक्तियों के बीच से बाहर ले जाओ[a], और जो कोई उसके पीछे आए, उसे तलवार से मार डाला जाए।” क्योंकि याजक ने कहा था, “उसे याहवे के भवन में मत मारना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है। इसका अनुवाद “पंक्तियों के बाहर की ओर ले जाओ” या “पंक्तियों के बीच से ले जाओ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: बाहर बुलाया
  rationale: יצא के हिफ़ील रूप का अर्थ किसी को बाहर आने देना या बाहर लाना है। प्रसंग में यहोयादा अधिकारियों को आदेश देने के लिए सामने बुलाता है; ‘बाहर बुलाया’ स्वाभाविक हिंदी में इस भाव को व्यक्त करता है।
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के प्रधानों
  rationale: यह सौ सैनिकों की टुकड़ियों के अधिकारियों का औपचारिक सैन्य पद है। यह अनुवाद इब्रानी संरचना के निकट रहते हुए रोमी ‘सूबेदार’ जैसे अनपेक्षित संकेत से बचता है।
- source_word: פְּקוּדֵי הַחַיִל
  choice: सेना पर नियुक्त
  rationale: פקד का कर्मवाच्य कृदंत यहाँ उन अधिकारियों को दर्शाता है जिन्हें सैन्य बल के ऊपर दायित्व सौंपा गया था।
- source_word: הוֹצִיאוּהָ
  choice: उसे ... बाहर ले जाओ
  rationale: यह बहुवचन आज्ञार्थक हिफ़ील रूप है, जिसके स्त्रीलिंग प्रत्यय का संकेत अतल्याह की ओर है।
- source_word: אֶל מִבֵּית הַשְּׂדֵרוֹת
  choice: सैनिक पंक्तियों के बीच से बाहर
  rationale: इब्रानी पदबंध कठिन है। सैन्य और मंदिर-संबंधी प्रसंग में שדרות को व्यवस्थित पंक्तियाँ मानते हुए मुख्य पाठ में संभावित अर्थ दिया गया है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: जो कोई उसके पीछे आए
  rationale: कृदंत הבא और אחריה मिलकर उसके पीछे आने वाले किसी भी समर्थक या साथी को सूचित करते हैं; अनुवाद जानबूझकर यह तय नहीं करता कि वह केवल शारीरिक रूप से पीछे आना है या उसका साथ देना।
- source_word: יוּמַת בֶּחָרֶב
  choice: उसे तलवार से मार डाला जाए
  rationale: कर्मवाच्य रूप प्रसंग में आदेशात्मक बल रखता है। यह हिंदी अभिव्यक्ति निष्पादन के औपचारिक आदेश को स्पष्ट रखती है।
- source_word: לֹא תְמִיתוּהָ
  choice: उसे ... मत मारना
  rationale: מות का हिफ़ील रूप ‘मृत्यु देना’ है; वर्तमान वाक्य में सीधा निषेध स्वाभाविक और स्पष्ट हिंदी देता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: בית का मूल चित्र ‘भवन/घर’ रखा गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का हिंदी लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: अतल्याह के पीछे आने वाले व्यक्ति की पहचान
  choice: जो कोई उसके पीछे आए
  alternative: जो कोई उसका साथ दे
  rationale: मूल पदबंध शारीरिक रूप से पीछे आने और समर्थक के रूप में साथ देने—दोनों अर्थों की अनुमति देता है; मुख्य पाठ उसी अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य पदों में अत्यधिक तकनीकी या रोमी शब्दावली से बचा गया है। कठिन स्थान की अनिश्चितता को मुख्य पाठ में संभावित अर्थ और पादटिप्पणी में विकल्प देकर सुरक्षित रखा गया है।
