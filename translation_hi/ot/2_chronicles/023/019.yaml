  text: וַֽ/יַּעֲמֵד֙ הַ/שּׁ֣וֹעֲרִ֔ים עַֽל שַׁעֲרֵ֖י בֵּ֣ית יְהוָ֑ה וְ/לֹֽא יָבֹ֥א טָמֵ֖א לְ/כָל דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/019.yaml
  text: He stationed the gatekeepers at the gates of the house of Yahweh[a], so that no one unclean in any respect might enter.
translation:
  language: hi
  text: उसने यहोवा के भवन के फाटकों पर द्वारपालों को तैनात किया, ताकि अशुद्धता के किसी भी कारण से अशुद्ध व्यक्ति भीतर न आ सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: उसने ... तैनात किया
  rationale: עמד के हिफ़ील रूप में किसी को निर्धारित स्थान पर खड़ा करने का भाव है; पहरे की जिम्मेदारी के संदर्भ में ‘तैनात किया’ स्वाभाविक और सटीक है।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपालों
  rationale: यह संज्ञा प्रवेश-द्वारों की रखवाली के लिए नियुक्त व्यक्तियों को सूचित करती है; ‘द्वारपाल’ मंदिर के संदर्भ में स्पष्ट है।
- source_word: עַל שַׁעֲרֵי
  choice: फाटकों पर
  rationale: नियुक्ति और स्थान के इस संदर्भ में עַל का अर्थ फाटकों पर अथवा उनके पास ड्यूटी पर होना है; हिन्दी में ‘फाटकों पर’ सहज है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘भवन’ स्रोत के בֵּית को बनाए रखता है, जबकि ‘यहोवा’ परमेश्वर के विशिष्ट नाम יהוה को व्यक्त करता है।
- source_word: וְלֹא יָבוֹא
  choice: ताकि ... भीतर न आने पाए
  rationale: संदर्भ में संयोजक और निषेधात्मक अपूर्ण क्रिया द्वारपालों की तैनाती का उद्देश्य या अपेक्षित परिणाम बताते हैं।
- source_word: טָמֵא
  choice: अशुद्ध
  rationale: मंदिर में प्रवेश के संदर्भ में यह धार्मिक-विधि संबंधी अशुद्धता की मानक श्रेणी है।
- source_word: לְכָל דָּבָר
  choice: किसी भी प्रकार से
  rationale: शाब्दिक पदबंध व्यापक है और अशुद्धता के किसी भी कारण या रूप को समेटता है; यह हिन्दी अभिव्यक्ति उसी व्यापकता को स्वाभाविक ढंग से व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों के लिए व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे केवल पदवी ‘प्रभु’ में नहीं बदलता।
- issue: טָמֵא की अशुद्धता का स्वरूप
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यहाँ मंदिर-प्रवेश का संदर्भ धार्मिक-विधि संबंधी अशुद्धता की ओर संकेत करता है; अनुवाद इसे नैतिक दोष तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फाटक’, ‘द्वारपाल’ और ‘तैनात’ मंदिर की सुरक्षा-व्यवस्था को स्पष्ट करते हैं; फुटनोट मूल इब्रानी पदबंध की असामान्य संरचना को सुरक्षित रखता है।
