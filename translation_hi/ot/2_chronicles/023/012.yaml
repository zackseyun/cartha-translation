  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֗הוּ אֶת ק֤וֹל הָ/עָם֙ הָֽ/רָצִ֔ים וְ/הַֽ/מְהַֽלְלִ֖ים אֶת הַ/מֶּ֑לֶךְ וַ/תָּב֥וֹא אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/012.yaml
  text: When Athaliah heard the noise of the people running and praising the king, she came to the people at the house of the LORD.
translation:
  language: hi
  text: जब अतल्याह ने लोगों के दौड़ने और राजा की जयजयकार करने का शोर सुना, तब वह यहोवा के भवन में लोगों के पास आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֤וֹל
  choice: शोर
  rationale: यहाँ קוֹל लोगों के दौड़ने और जयजयकार करने से उत्पन्न सुनाई देने वाली सामूहिक ध्वनि को दर्शाता है; प्रसंग में ‘शोर’ स्वाभाविक है।
- source_word: הָֽרָצִ֔ים
  choice: दौड़ने
  rationale: पुंलिंग बहुवचन कृदंत का क्रियात्मक भाव रखा गया है और इसे लोगों की सुनाई देने वाली गतिविधि के रूप में व्यक्त किया गया है।
- source_word: מְהַֽלְלִ֖ים אֶת הַמֶּלֶךְ
  choice: राजा की जयजयकार करने
  rationale: הלל का मूल भाव प्रशंसा करना है; राजकीय सार्वजनिक उत्सव के इस प्रसंग में ‘जयजयकार करना’ आधुनिक हिन्दी में अधिक स्वाभाविक और सटीक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन में
  rationale: ईश्वरीय नाम को ‘यहोवा’ और मंदिर/पवित्र भवन को गरिमापूर्ण सामान्य हिन्दी ‘भवन’ से व्यक्त किया गया है; सन्दर्भगत स्थानसूचक अर्थ स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिब्रू के दोनों समानांतर कृदंतों—दौड़ने और राजा की प्रशंसा करने—को स्पष्ट क्रियात्मक संरचना में रखा गया है।
