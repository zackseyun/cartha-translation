  text: וּ/בַ/שָּׁנָ֨ה הַ/שְּׁבִעִ֜ית הִתְחַזַּ֣ק יְהוֹיָדָ֗ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ/מֵּא֡וֹת לַ/עֲזַרְיָ֣הוּ בֶן יְרֹחָ֡ם וּ/לְ/יִשְׁמָעֵ֣אל בֶּן יְ֠הוֹחָנָן וְ/לַֽ/עֲזַרְיָ֨הוּ בֶן עוֹבֵ֜ד וְ/אֶת מַעֲשֵׂיָ֧הוּ בֶן עֲדָיָ֛הוּ וְ/אֶת אֱלִישָׁפָ֥ט בֶּן זִכְרִ֖י עִמּ֥/וֹ בַ/בְּרִֽית־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/023/001.yaml
  text: 'In the seventh year Jehoiada strengthened himself and took the commanders of hundreds into covenant with him: Azariah son of Jeroham[a], Ishmael son of Jehohanan, Azariah son of Obed, Maaseiah son of Adaiah, and Elishaphat son of Zichri.'
translation:
  language: hi
  text: सातवें वर्ष यहोयादा ने साहस बाँधा और सौ-सौ सैनिकों की टुकड़ियों के प्रधानों को अपने साथ वाचा में सम्मिलित किया[a]—यरोहाम के पुत्र अजर्याह, यहोहानान के पुत्र इश्माएल, ओबेद के पुत्र अजर्याह, अदायाह के पुत्र मासेयाह और जिक्री के पुत्र एलीशापात।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके साथ वाचा बाँधी” अथवा “उन्हें अपने साथ वाचा में लिया।” इब्रानी में शाब्दिक रूप से ‘लिया’, ‘अपने साथ’ और ‘वाचा में’ का संयोजन है, जो इन अधिकारियों को वाचागत समझौते में सम्मिलित करने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִעִית
  choice: सातवें वर्ष
  rationale: कालसूचक पदबंध का स्वाभाविक और सटीक हिन्दी रूप; आरम्भिक संयोजक को हिन्दी प्रवाह के लिए व्यक्त नहीं किया गया।
- source_word: הִתְחַזַּק
  choice: साहस बाँधा
  rationale: हिथ्पएल रूप की आत्मवाचकता और निर्णायक कदम उठाने के लिए स्वयं को दृढ़ करने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: सम्मिलित किया
  rationale: मूल अर्थ ‘लिया’ है, पर עִמּוֹ בַבְּרִית के साथ यह अधिकारियों को वाचा के संबंध में साथ लेने का भाव देता है; हिन्दी में केवल ‘लिया’ अस्पष्ट होता।
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के प्रधानों
  rationale: यह सौ व्यक्तियों की सैन्य टुकड़ियों पर नियुक्त अधिकारियों की उपाधि है; इस रूप से सैन्य संदर्भ स्पष्ट होता है और रोमी ‘सूबेदार/सेंचुरियन’ जैसा अनैतिहासिक संकेत नहीं आता।
- source_word: עִמּוֹ בַבְּרִית
  choice: अपने साथ वाचा में
  rationale: यहोयादा द्वारा इन अधिकारियों को अपने साथ वाचागत समझौते में लाने का अर्थ सुरक्षित रखता है; निश्चित उपपद का प्रसंगगत बल हिन्दी में अनिवार्य नहीं।
- source_word: לַעֲזַרְיָהוּ ... וּלְיִשְׁמָעֵאל ... וְלַעֲזַרְיָהוּ ... וְאֶת מַעֲשֵׂיָהוּ ... וְאֶת אֱלִישָׁפָט
  choice: अजर्याह ... इश्माएल ... अजर्याह ... मासेयाह ... और एलीशापात
  rationale: व्यक्तिनामों का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है और अजर्याह नाम की पुनरावृत्ति मूल के अनुसार रखी गई है।
- source_word: בֶן
  choice: के पुत्र
  rationale: पितृनाम द्वारा पहचान बताने का मानक और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: עִמּוֹ בַבְּרִית में वाचा का संबंध
  choice: अपने साथ वाचा में सम्मिलित किया
  alternative: उनके साथ वाचा बाँधी
  rationale: मूल वाक्य में ‘लेना’, ‘उसके साथ’ और ‘वाचा में’ का असामान्य संयोजन है। मुख्य पाठ यहोयादा की पहल और अधिकारियों को वाचागत गठबंधन में लेने का भाव रखता है, जबकि पादटिप्पणी संभावित वैकल्पिक अभिव्यक्ति सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वाचा’ धार्मिक-साहित्यिक संदर्भ का स्थापित शब्द है। व्यक्तिनाम प्रचलित हिन्दी बाइबल रूपों के निकट रखे गए हैं।
