  text: one third shall be at the king’s house[a], one third at the Foundation Gate, and all the people in the courts of the house of Yahweh.
translation:
  language: hi
  text: और एक तिहाई राजमहल में, एक तिहाई नींव फाटक[a] पर, और सब लोग याहवे के भवन के आँगनों में रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नींव का फाटक।” सम्भवतः यह किसी विशेष फाटक का नाम था; उसका ठीक अभिप्राय निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: और एक तिहाई
  rationale: यहाँ स्त्रीलिंग क्रमवाचक रूप समूह के वितरण में संज्ञा की तरह प्रयुक्त है; ‘एक तिहाई’ आधुनिक हिन्दी में स्वाभाविक और संख्यात्मक विभाजन के प्रति निष्ठावान है।
- source_word: בְּבֵית הַמֶּלֶךְ
  choice: राजमहल पर
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर इस पहरेदारी और स्थान-निर्धारण के प्रसंग में आशय राजकीय निवास-परिसर है; ‘राजमहल पर’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּשַׁעַר הַיְסוֹד
  choice: नींव फाटक
  rationale: שַׁעַר का अर्थ ‘फाटक’ और יְסוֹד का सामान्य अर्थ ‘नींव/आधार’ है। इसे किसी विशिष्ट फाटक का नाम मानते हुए हिन्दी में अर्थानुवाद किया गया है, जबकि पादटिप्पणी रचनात्मक संबंध की दूसरी सम्भावना सुरक्षित रखती है।
- source_word: וְכָל הָעָם
  choice: और सब लोग
  rationale: עָם के सामान्य कथात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और इसे ‘सभा’ जैसे अधिक व्याख्यात्मक शब्द से सीमित नहीं करता।
- source_word: בְּחַצְרוֹת
  choice: आँगनों में
  rationale: חָצֵר का बहुवचन मंदिर-परिसर के घिरे हुए खुले प्रांगणों को दर्शाता है; ‘आँगनों’ से बहुवचन और स्थान दोनों स्पष्ट रहते हैं।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ बनाए रखा गया है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण हिन्दी लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: בֵּית יְהוָה को ‘भवन’ या ‘मंदिर’ कहना
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: ‘भवन’ मूल के בֵּית को अधिक प्रत्यक्ष रूप से सुरक्षित रखता है; प्रसंग से यह स्पष्ट है कि संकेत मंदिर-परिसर की ओर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी में इस पद के खंडों में क्रिया व्यक्त नहीं है; पिछले पद से निहित आदेश को स्वाभाविक हिन्दी के लिए अंत में ‘रहें’ से स्पष्ट किया गया है।
