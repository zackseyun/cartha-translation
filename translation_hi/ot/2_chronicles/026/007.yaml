  text: וַ/יַּעְזְרֵ֨/הוּ הָֽ/אֱלֹהִ֜ים עַל פְּלִשְׁתִּ֧ים וְ/עַל ה/ערביים הַ/יֹּשְׁבִ֥ים בְּ/גוּר בָּ֖עַל וְ/הַ/מְּעוּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/007.yaml
  text: God helped him against the Philistines[a], against the Arabians who lived in Gur-baal, and against the Meunites.
translation:
  language: hi
  text: परमेश्वर ने पलिश्तियों के विरुद्ध, गूर-बाल में रहने वाले अरबियों के विरुद्ध और मऊनियों[a] के विरुद्ध उसकी सहायता की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “माओनियों।” इब्रानी जातिनाम किसी संबंधित समूह अथवा उसके भिन्न नाम-रूप को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְזְרֵהוּ
  choice: उसकी सहायता की
  rationale: עזר का अर्थ सहायता करना है; तृतीय पुरुष एकवचन प्रत्यय का संदर्भ उज्जियाह से है। यह हिंदी में सीधा और स्वाभाविक कथात्मक प्रयोग है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ सव्याख्य उपपद सहित אֱלֹהִים इस्राएल के परमेश्वर के सामान्य कथात्मक पदनाम के रूप में प्रयुक्त है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: सैन्य संघर्ष के संदर्भ में עַל उन विरोधी समुदायों को सूचित करता है जिनके विरुद्ध परमेश्वर ने उज्जियाह की सहायता की।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह פלשתים जातिनाम का हिंदी में प्रचलित लिप्यंतरण है।
- source_word: הערביים
  choice: अरबियों
  rationale: यह ऐतिहासिक अरब जनसमुदायों को सूचित करने वाला जातिनाम है; हिंदी में ‘अरबियों’ स्पष्ट और स्वाभाविक है।
- source_word: הַיֹּשְׁבִים
  choice: रहने वाले
  rationale: ישב का कृदंत यहाँ किसी स्थान में निवास करने का भाव देता है और अरबियों का विशेषण है।
- source_word: בְּגוּר בָּעַל
  choice: गूर-बाल में
  rationale: यह स्थाननाम है; בְ को निवास के संदर्भ में स्वाभाविक रूप से ‘में’ अनूदित किया गया है।
- source_word: הַמְּעוּנִים
  choice: मऊनियों
  rationale: व्यंजनात्मक इब्रानी रूप מעונים के निकट जातिनाम-लिप्यंतरण चुना गया है। समूह की सटीक पहचान अनिश्चित होने के कारण संबंधित वैकल्पिक रूप पादटिप्पणी में रखा गया है।
