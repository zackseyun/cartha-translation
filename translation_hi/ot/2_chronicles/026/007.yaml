translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण ऐतिहासिक कथन। तीनों विरोधी समूहों के साथ ‘के विरुद्ध’ की पुनरावृत्ति मूल की संरचना और सैन्य संबंध को स्पष्ट रखती है। पादटिप्पणी-चिह्न को उसी विवादित जातिनाम के बाद रखा गया है जिससे वह संबंधित है।
