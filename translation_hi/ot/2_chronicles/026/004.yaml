  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/004.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that Amaziah his father had done.
translation:
  language: hi
  text: उसने वह किया जो याहवे[a] की दृष्टि में सही था, ठीक वैसा ही जैसा उसके पिता अमस्याह ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा’; कुछ पारंपरिक अनुवादों में ‘प्रभु’।
    reason: याहवे नाम के वैकल्पिक हिन्दी लिप्यंतरण और पारंपरिक प्रतिस्थापन को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वय्यिक्तोल रूप कथा की अगली क्रिया बताता है; हिन्दी में आरम्भिक ‘और’ के बिना वाक्य अधिक स्वाभाविक है।
- source_word: הַיָּשָׁר
  choice: वही ... जो ... सही था
  rationale: עשה के साथ यह विशेषण ‘जो सही है वह करना’ का प्रचलित नैतिक मुहावरा बनाता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह स्रोत के दृष्टिकोण से मूल्यांकन व्यक्त करने वाला इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘की दृष्टि में’ स्वाभाविक और अर्थपूर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह रचना अमस्याह के आचरण के पूरे नमूने से अनुरूपता बताती है; ‘ठीक’ כֹל की व्यापकता पर बल देता है।
- source_word: עָשָׂה
  choice: ने किया था
  rationale: ‘था’ से स्पष्ट होता है कि पिता अमस्याह का आचरण वर्णित राजा के आचरण से पहले का नमूना था।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: इस ऐतिहासिक संदर्भ में अमस्याह वास्तव में उज्जियाह का पिता है, इसलिए ‘पिता’ सटीक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से आया है। हिन्दी के सामान्य पाठकों के लिए परिचित ‘यहोवा’ उस नाम को बनाए रखता है; ‘प्रभु’ नाम के स्थान पर उपाधि रख देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘की दृष्टि में’ इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है; तुलना को बोझिल शब्दशः रचना के बजाय स्पष्ट ‘ठीक वैसे ही जैसे’ से व्यक्त किया गया है।
