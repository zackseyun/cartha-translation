id: 2CH.26.16
reference: 2 Chronicles 26:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/כְ/חֶזְקָת֗/וֹ גָּבַ֤הּ לִבּ/וֹ֙ עַד לְ/הַשְׁחִ֔ית וַ/יִּמְעַ֖ל בַּ/יהוָ֣ה אֱלֹהָ֑י/ו וַ/יָּבֹא֙ אֶל הֵיכַ֣ל יְהוָ֔ה לְ/הַקְטִ֖יר עַל מִזְבַּ֥ח הַ/קְּטֹֽרֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/016.yaml
  text: But when he became strong, his heart was lifted up to his destruction, and he acted unfaithfully against Yahweh his God and entered the temple of Yahweh to burn incense on the altar of incense.
translation:
  language: hi
  text: परन्तु जब वह शक्तिशाली हो गया, तो उसका मन घमंड से फूल उठा, अपने ही विनाश के लिए। उसने अपने परमेश्वर यहोवा के विरुद्ध विश्वासघात किया और धूप की वेदी पर धूप जलाने के लिए यहोवा के मंदिर में प्रवेश किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְחֶזְקָתוֹ
  choice: परन्तु जब वह सामर्थी हो गया
  rationale: 'כְּ के साथ भाववाचक संज्ञा यहाँ समय-सूचक है: जब वह शक्तिशाली हुआ। ''सामर्थी हो गया'' स्रोत के बल और स्वाभाविक हिन्दी दोनों को रखता है।'
- source_word: גָּבַהּ לִבּוֹ
  choice: उसका मन घमण्ड से फूल उठा
  rationale: शाब्दिक भाव 'उसका हृदय ऊँचा हुआ' है। हिन्दी मुहावरा 'मन घमण्ड से फूल उठा' गर्व के नैतिक अर्थ को स्पष्ट रखते हुए देहगत हृदय के भ्रम से बचाता है।
- source_word: עַד לְהַשְׁחִית
  choice: यहाँ तक कि उसका विनाश हो गया
  rationale: यह पदबंध विनाशकारी परिणाम की सीमा बताता है। रूप कारण और परिणाम का सम्बन्ध स्पष्ट रखता है, यद्यपि हिब्रू में infinitive का कर्ता व्याकरणतः कुछ संक्षिप्त है।
- source_word: וַיִּמְעַל
  choice: उसने ... के प्रति विश्वासघात किया
  rationale: מעל पवित्र या वाचा-संबंधी दायित्व में बेवफाई का बोध देता है; 'विश्वासघात' साधारण पाठक के लिए स्पष्ट और गंभीर है।
- source_word: בַּיהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा के प्रति
  rationale: מעל के साथ ב लक्ष्य के विरुद्ध/प्रति किए गए विश्वासघात को दर्शाता है। हिन्दी में 'के प्रति विश्वासघात' स्वाभाविक है।
- source_word: הֵיכַל יְהוָה
  choice: यहोवा के मन्दिर
  rationale: היכל यहाँ मन्दिर-भवन को सूचित करता है; 'मन्दिर' आधुनिक हिन्दी में सीधा और परिचित पद है।
- source_word: לְהַקְטִיר
  choice: धूप जलाने के लिए
  rationale: पूजा-संदर्भ में קטר का हिफ़ील धूप जलाने/चढ़ाने को सूचित करता है। वेदी का अगला उल्लेख होने से 'जलाने' का ठोस अर्थ उचित है।
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह धूप के लिए निर्धारित वेदी का स्थापित पूजा-संबंधी पद है और हिन्दी में संक्षिप्त तथा पारदर्शी है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम יהוה स्पष्ट रूप से आया है। हिन्दी पाठकों में प्रचलित व्यक्तिवाचक रूप 'यहोवा' नाम को सामान्य उपाधि से अलग रखता है; 'याहवे' संभावित अधिक शैक्षिक लिप्यंतरण है।
- issue: עַד לְהַשְׁחִית में विनाश और भ्रष्ट आचरण का सम्बन्ध
  choice: यहाँ तक कि उसका विनाश हो गया
  alternative: यहाँ तक कि वह भ्रष्ट हो गया
  rationale: संदर्भ उज्जियाह के गर्व के विनाशकारी परिणाम की ओर बढ़ता है। फिर भी हिब्रू infinitive 'नष्ट करना/भ्रष्ट करना' दोनों अर्थ-क्षेत्रों को छू सकता है; मुख्य पाठ परिणाम को प्रधानता देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। हिब्रू के हृदय-ऊँचा होने के मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है। वाक्य की कारण-परिणाम गति और वाचा-संबंधी विश्वासघात का भार सुरक्षित रखा गया है।
