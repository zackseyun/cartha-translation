revisions:
- from: परन्तु जब वह सामर्थी हो गया, तो उसका मन घमण्ड से फूल उठा—यहाँ तक कि उसका विनाश हो गया। उसने अपने परमेश्वर यहोवा के प्रति विश्वासघात किया और धूप की वेदी पर धूप जलाने के लिए यहोवा के मन्दिर में प्रवेश किया।
  to: परन्तु जब वह शक्तिशाली हो गया, तो उसका मन घमंड से फूल उठा, अपने ही विनाश के लिए। उसने अपने परमेश्वर यहोवा के विरुद्ध विश्वासघात किया और धूप की वेदी पर धूप जलाने के लिए यहोवा के मंदिर में प्रवेश किया।
  rationale: The revision preserves the Hebrew temporal opening and pride idiom while rendering the ruinous force of עַד לְהַשְׁחִית without prematurely asserting that destruction had already been completed. It also uses more current standard Hindi and makes the direction of the covenant breach explicit.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:06:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Uzziah's becoming strong, his pride, his breach of faith against Yahweh, and his entering the temple to burn incense on the incense altar. However, “यहाँ तक कि उसका विनाश हो गया” presents the destruction as already completed at this precise point in the narrative. The Hebrew עַד לְהַשְׁחִית expresses the ruinous outcome/direction of his pride more compactly and does not require that completed-event wording.
  naturalness: The Hindi is generally clear and dignified. “शक्तिशाली” and standard spellings such as “घमंड” and “मंदिर” are slightly more natural for modern standard Hindi than “सामर्थी,” “घमण्ड,” and “मन्दिर.”
  terminology: “यहोवा,” “परमेश्वर,” “विश्वासघात,” “धूप,” and “धूप की वेदी” appropriately preserve the divine name and the cultic vocabulary. “के विरुद्ध विश्वासघात किया” makes the adversative force of מעל ב more explicit than “के प्रति विश्वासघात किया.”
  issues:
  - severity: medium
    issue: “यहाँ तक कि उसका विनाश हो गया” states a completed destruction.
    rationale: The phrase עַד לְהַשְׁחִית marks the destructive result of his exalted heart. Rendering it as a completed event at this point can overstate the temporal aspect of the Hebrew narrative.
  - severity: low
    issue: “सामर्थी” is less current than “शक्तिशाली.”
    rationale: “शक्तिशाली हो गया” is idiomatic modern standard Hindi and retains the meaning of becoming strong.
  revised_text: परन्तु जब वह शक्तिशाली हो गया, तो उसका मन घमंड से फूल उठा, अपने ही विनाश के लिए। उसने अपने परमेश्वर यहोवा के विरुद्ध विश्वासघात किया और धूप की वेदी पर धूप जलाने के लिए यहोवा के मंदिर में प्रवेश किया।
  revised_footnotes: []
