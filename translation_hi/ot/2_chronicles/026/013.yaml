  yaml_path: translation/ot/2_chronicles/026/013.yaml
  text: Under their command was an army of 307,500[a], making war with mighty power, to help the king against the enemy.
translation:
  language: hi
  text: उनकी कमान में 3,07,500 सैनिकों की एक सेना थी। वे बड़े सामर्थ्य से युद्ध करने के लिए तैयार थे, ताकि शत्रु के विरुद्ध राजा की सहायता करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: उनकी कमान में
  rationale: मुहावरा עַל יָדָם यहाँ शाब्दिक ‘उनके हाथ से’ नहीं, बल्कि इन अधिकारियों के अधीन या निर्देशन में होने का भाव देता है।
- source_word: חֵיל צָבָא
  choice: सैनिकों की एक सेना
  rationale: यह संयुक्त पद एक सैन्य दल या सेना को सूचित करता है; ‘सैनिकों की एक सेना’ संख्या को स्वाभाविक रूप से व्यक्त करती है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,07,500
  rationale: इब्रानी संख्याओं का सीधा योग भारतीय अंक-विभाजन पद्धति में प्रस्तुत किया गया है।
- source_word: עוֹשֵׂי מִלְחָמָה
  choice: युद्ध करने के लिए तैयार
  rationale: शाब्दिक अर्थ ‘युद्ध करने वाले’ है; सैन्य गणना के प्रसंग में यह युद्ध-सेवा के लिए तैयार सैनिकों को सूचित करता है, न कि अनिवार्यतः उसी समय चल रहे युद्ध को।
- source_word: בְּכֹחַ חָיִל
  choice: पूरी सामर्थ्य से
  rationale: כֹּחַ और חַיִל का संयोजन शक्तिशाली सैन्य क्षमता पर बल देता है; यह हिन्दी में स्वाभाविक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: לַעְזֹר לַמֶּלֶךְ
  choice: राजा की सहायता करती थी
  rationale: עזר का सीधा अर्थ सहायता करना है; स्त्रीलिंग क्रिया ‘सेना’ के अनुरूप है।
- source_word: עַל הָאוֹיֵב
  choice: शत्रु के विरुद्ध
  rationale: सैन्य प्रसंग में עַל विरोध का संबंध व्यक्त करता है।
