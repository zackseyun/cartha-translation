  yaml_path: translation/ot/2_chronicles/026/005.yaml
  text: He continued to seek God in the days of Zechariah[a], who had understanding in the visions of God; and as long as he sought Yahweh[b], God made him prosper.
translation:
  language: hi
  text: वह जकर्याह के दिनों में, जो परमेश्वर के दर्शनों की समझ रखता था, परमेश्वर की खोज करता रहा[a]। जब तक वह यहोवा[b] की खोज करता रहा, परमेश्वर ने उसे सफल बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर के भय की समझ रखता था” या “जो परमेश्वर का भय मानना सिखाता था।” इब्रानी पद कठिन है; मसोराई पाठ अधिक शाब्दिक रूप से कहता है, “जो परमेश्वर के दर्शनों में समझ रखता था।”
    reason: alternative_reading
  - marker: b
    text: अधिक शाब्दिक रूप से, “और उन दिनों में जब वह यहोवा की खोज करता था।”
    reason: literal_rendering
lexical_decisions:
- source_word: וַיְהִי לִדְרֹשׁ אֱלֹהִים
  choice: वह परमेश्वर की खोज करता रहा
  rationale: היה के साथ infinitive ongoing practice को व्यक्त करता है। ‘खोज करता रहा’ भक्ति, निर्भरता और परमेश्वर की इच्छा जानने के व्यापक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּימֵי זְכַרְיָהוּ
  choice: जकर्याह के दिनों में
  rationale: यह सीधा काल-सूचक पद है; हिन्दी में मूल अभिव्यक्ति को सहज रूप से सुरक्षित रखता है।
- source_word: הַמֵּבִין בִּרְאֹת הָאֱלֹהִים
  choice: जकर्याह को परमेश्वर के दर्शनों की समझ थी
  rationale: מֵבִין समझ या परख रखनेवाले को सूचित करता है, और मसोराई पाठ का רְאֹת देखने/दर्शनों से संबंधित है। वाक्य-विभाजन हिन्दी में अस्पष्ट विशेषण-संबंध से बचते हुए कठिन मूल पाठ को निकटता से प्रस्तुत करता है।
- source_word: וּבִימֵי דָּרְשׁוֹ אֶת־יְהוָה
  choice: जब तक वह यहोवा की खोज करता रहा
  rationale: शाब्दिक ‘उसकी खोज के दिनों में’ यहाँ अवधि और फल के संबंध को दर्शाता है। ‘जब तक’ उस durative nuance को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबिलीय प्रयोग में प्रचलित रूप द्वारा चतुरक्षरीय व्यक्तिगत नाम को उपाधि से अलग रखा गया है।
- source_word: הִצְלִיחוֹ הָאֱלֹהִים
  choice: परमेश्वर उसे सफलता देता रहा
  rationale: צלח का हिफ़ील रूप सफलता/समृद्धि का कारण बनने को दर्शाता है। अपूर्णकालीन ‘देता रहा’ खोज की जारी अवधि के साथ होनेवाली ईश्वरीय क्रिया को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בִּרְאֹת הָאֱלֹהִים का कठिन अर्थ
  choice: परमेश्वर के दर्शनों की समझ
  alternative: परमेश्वर का भय सिखानेवाला / परमेश्वर के भय की समझ रखनेवाला
  rationale: मसोराई स्वरांकन ראה, अर्थात देखने या दर्शन, से संबंधित अर्थ का समर्थन करता है। ‘भय’ वाला पाठ प्राचीन परंपरा और अनेक अनुवादों में मिलता है, पर मुख्य पाठ में उसे अपनाना मसोराई पाठ की कठिनता को चुपचाप सरल कर देगा; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: וּבִימֵי דָּרְשׁוֹ का कालगत या शर्त-सदृश भाव
  choice: जब तक वह यहोवा की खोज करता रहा
  alternative: और उन दिनों में जब वह यहोवा की खोज करता था
  rationale: मूल पद औपचारिक रूप से समयावधि बताता है, पर सन्दर्भ में उसी अवधि तक मिलनेवाली सफलता का संबंध भी उभरता है। ‘जब तक’ इस संबंध को व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘जकर्याह’ और ‘यहोवा’ हिन्दी बाइबिलीय नाम-परंपरा के अनुरूप हैं। कठिन इब्रानी पद की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
