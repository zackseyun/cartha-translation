  text: Uzziah built towers in Jerusalem at the Corner Gate[a], at the Valley Gate, and at the Angle, and he fortified them.
translation:
  language: hi
  text: उज्जियाह ने यरूशलेम में कोने के फाटक, घाटी के फाटक और मोड़[a] पर मीनारें बनाईं और उन्हें सुदृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोने” पर; इब्रानी शब्द किलेबंदी के कोण, कोने या मुड़ने के स्थान को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनवाईं
  rationale: בנה का मूल अर्थ ‘बनाना’ है। राजा को निर्माण का कर्ता बताते हुए हिंदी में ‘बनवाईं’ स्वाभाविक है और यह आवश्यक नहीं ठहराता कि उसने स्वयं हाथ से निर्माण किया।
- source_word: עֻזִּיָּהוּ
  choice: उज्जियाह
  rationale: इब्रानी नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: מִגְדָּלִים
  choice: मीनारें
  rationale: מגדלים का सीधा अर्थ बहुवचन में ऊँची रक्षात्मक संरचनाएँ है; ‘मीनारें’ सहज आधुनिक हिंदी है, जबकि दृढ़ीकरण का भाव अंतिम क्रिया में रखा गया है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक ב का स्वाभाविक हिंदी अनुवाद ‘में’ है।
- source_word: עַל
  choice: पर
  rationale: नगर के फाटकों और किलेबंदी के स्थान के संबंध में עַל को ‘पर’ कहना संक्षिप्त और स्वाभाविक है; इससे जरूरी नहीं कि मीनारें फाटक के ठीक ऊपर थीं।
- source_word: שַׁעַר הַפִּנָּה
  choice: कोने का फाटक
  rationale: यह फाटक के नाम की रचनात्मक संज्ञा है; ‘कोने का फाटक’ अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: שַׁעַר הַגַּיְא
  choice: घाटी का फाटक
  rationale: גיא का अर्थ ‘घाटी’ है; फाटक के नाम के रूप में यह सीधा हिंदी रूप है।
- source_word: הַמִּקְצוֹעַ
  choice: मोड़
  rationale: यह शब्द किलेबंदी के कोण, कोने या मुड़ने के स्थान को सूचित कर सकता है। ‘मोड़’ पहले उल्लिखित ‘कोने के फाटक’ से भेद बनाए रखते हुए स्थलाकृतिक अर्थ देता है।
- source_word: וַיְחַזְּקֵם
  choice: और उन्हें दृढ़ किया
  rationale: पिएल रूप यहाँ मजबूत या किलेबंद करने का भाव देता है। ‘उन्हें’ का सबसे स्वाभाविक पूर्वपद मीनारें हैं; ‘दृढ़ किया’ सैन्य-निर्माण संदर्भ में अर्थपूर्ण और गरिमामय है।
