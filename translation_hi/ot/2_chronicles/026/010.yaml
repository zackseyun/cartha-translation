base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/010.yaml
  text: He built towers in the wilderness and cut out many cisterns[a], for he had much livestock; and in the lowland and in the plain he had farmers and vinedressers, in the hills and in the fertile land[c][b], for he loved the soil.
translation:
  language: hi
  text: उसने निर्जन प्रदेश में मीनारें[a] बनाईं और बहुत-से जलकुंड खोदे, क्योंकि निचले प्रदेश[b] और मैदान में उसके पास बहुत पशुधन था; और पहाड़ियों तथा उपजाऊ भूमि[c] में किसान और दाखबारी-पालक थे, क्योंकि उसे मिट्टी से प्रेम था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरे की मीनारें।”
    reason: lexical_alternative
  - marker: b
    text: या “शफेला”; यह यहूदा की तलहटी का क्षेत्र था।
    reason: cultural_note
  - marker: c
    text: यदि इसे उपजाऊ भूमि के अर्थ में जातिवाचक संज्ञा न मानकर स्थान-नाम माना जाए, तो “कर्मेल में।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִגְדָּלִים
  choice: मीनारें
  rationale: यह शब्द सामान्य रूप से ऊँची संरचनाओं या मीनारों को दर्शाता है। प्रसंग में वे निगरानी के लिए रही होंगी, पर मूल शब्द स्वयं उनके कार्य को स्पष्ट नहीं करता।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר का अर्थ जंगल, स्तेपी या नगर-बस्तियों से बाहर का चरागाही क्षेत्र हो सकता है। ‘निर्जन प्रदेश’ अनावश्यक रूप से रेगिस्तान का अर्थ थोपे बिना इस व्यापक भाव को व्यक्त करता है।
- source_word: וַיַּחְצֹב בֹּרוֹת
  choice: जलकुंड खुदवाए
  rationale: क्रिया काटकर या खोदकर बनाने का बोध देती है और בֹּרוֹת पानी संचित करने के गड्ढों या कुंडों को दर्शाता है। ‘जलकुंड’ यहाँ ‘कुओं’ से अधिक सटीक है।
- source_word: מִקְנֶה רַב
  choice: बहुत पशुधन
  rationale: यह पशुओं की सामूहिक संपत्ति को दर्शाता है; इसे केवल गाय-बैल या किसी एक प्रकार के पशु तक सीमित नहीं किया गया।
- source_word: שְׁפֵלָה
  choice: निचला प्रदेश
  rationale: यह यहूदा के निचले पहाड़ी भूभाग का भौगोलिक नाम भी हो सकता है। मुख्य पाठ में अर्थ का अनुवाद आधुनिक पाठक के लिए अधिक स्पष्ट है।
- source_word: מִישׁוֹר
  choice: मैदान
  rationale: यह समतल भूभाग को दर्शाता है; ‘मैदान’ इसका सहज आधुनिक हिन्दी रूप है।
- source_word: אִכָּרִים
  choice: किसान
  rationale: शब्द भूमि जोतने और खेती करनेवालों को दर्शाता है; ‘किसान’ स्पष्ट और प्रचलित आधुनिक हिन्दी है।
- source_word: כֹרְמִים
  choice: अंगूर की बारियों की देखभाल करनेवाले
  rationale: यह विशेष रूप से दाखबारियों को लगाने और सँभालनेवालों के लिए प्रयुक्त है। वर्णनात्मक हिन्दी इसका विशिष्ट अर्थ स्पष्ट रखती है।
- source_word: בֶּהָרִים
  choice: पहाड़ियों में
  rationale: शब्द पर्वतों या पहाड़ी भूभाग के लिए आ सकता है; कृषि-प्रसंग में ‘पहाड़ियों’ स्वाभाविक है और भूभाग को अनावश्यक रूप से विशाल नहीं बनाता।
- source_word: בַּכַּרְמֶל
  choice: उपजाऊ भूमि में
  rationale: כַּרְמֶל को यहाँ उपजाऊ या बागोंवाली भूमि बतानेवाली जातिवाचक संज्ञा माना गया है। फिर भी ‘कर्मेल’ स्थान-नाम होने की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אֹהֵב אֲדָמָה
  choice: उसे मिट्टी से प्रेम था
  rationale: אֲדָמָה का ठोस अर्थ भूमि या मिट्टी है। यह अनुवाद कृषि से उसके लगाव का चित्र बनाए रखता है और इसे केवल शौक के अर्थ में नहीं बदलता।
