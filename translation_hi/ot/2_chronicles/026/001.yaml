  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֻזִּיָּ֔הוּ וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣יכוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/001.yaml
  text: Then all the people of Judah took Uzziah[a], who was sixteen years old[b], and made him king in place of his father Amaziah.
translation:
  language: hi
  text: तब यहूदा की सारी प्रजा ने उज्जियाह को चुना[a]। वह सोलह वर्ष का था[b]। उन्होंने उसके पिता अमस्याह के स्थान पर उसे राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “लिया।” इस प्रसंग में इसका आशय उसे राजगद्दी के लिए चुनने और आगे करके राजा बनाने से है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक वाक्य-विन्यास: “और वह सोलह वर्ष का था।” इब्रानी संयोजक अपने आप में “यद्यपि” का भाव आवश्यक नहीं करता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: चुना
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर राजगद्दी पर बैठाने के इस प्रसंग में ‘चुना’ आधुनिक हिन्दी में प्रजा की कार्रवाई को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: כָּל עַם יְהוּדָה
  choice: यहूदा की सारी प्रजा
  rationale: यह पदबंध पूरे यहूदी जनसमुदाय पर बल देता है; ‘प्रजा’ राजकीय प्रसंग में עַם के लिए स्वाभाविक हिन्दी है।
- source_word: עֻזִּיָּהוּ
  choice: उज्जियाह
  rationale: यह इसी पद में प्रयुक्त इब्रानी नाम का मानक हिन्दी लिप्यंतरण है; संबंधित पदों का वैकल्पिक नाम ‘अजर्याह’ यहाँ आयात नहीं किया गया।
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: वह सोलह वर्ष का था
  rationale: इब्रानी मुहावरे ‘सोलह वर्ष का पुत्र’ को स्वाभाविक हिन्दी आयु-वाक्य में व्यक्त किया गया है। संयोजक को रियायती ‘यद्यपि’ न बनाकर तटस्थ रखा गया है।
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: उन्होंने ... उसे राजा बनाया
  rationale: מלך के हिफ़ील रूप का अर्थ किसी को राजा बनाना अथवा राज्य करने को स्थापित करना है। यह अनुवाद स्पष्ट है और ऐसी राज्याभिषेक-विधि नहीं जोड़ता जिसका उल्लेख मूल में नहीं है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में इसका अर्थ किसी के स्थान पर पद ग्रहण करना है।
- source_word: אָבִיו אֲמַצְיָהוּ
  choice: उसके पिता अमस्याह
  rationale: पिता-पुत्र संबंध और व्यक्तिनाम का सीधा, मानक हिन्दी रूप।
