base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/008.yaml
  text: The Ammonites gave tribute to Uzziah[a], and his fame spread as far as the entrance of Egypt[b], for he had become exceedingly strong.
translation:
  language: hi
  text: अम्मोनियों ने उज्जियाह को कर दिया, और उसकी कीर्ति मिस्र के प्रवेश-मार्ग[a] तक फैल गई, क्योंकि वह अत्यन्त सामर्थी हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मिस्र के प्रवेश-मार्ग’ से मिस्र की ओर जाने वाला पहुँच-क्षेत्र या उसका सीमा-प्रदेश अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: הָעַמּוֹנִים
  choice: अम्मोनियों
  rationale: यह अम्मोन देश के लोगों का जातीय नाम है; हिन्दी बाइबल-परंपरा और सामान्य प्रयोग में ‘अम्मोनी’ स्पष्ट और संक्षिप्त है।
- source_word: מִנְחָה
  choice: कर
  rationale: विदेशी प्रजा द्वारा राजा को दिए जाने के राजनीतिक संदर्भ में यह सामान्य भेंट या उपासना की भेंट नहीं, बल्कि अधीनता-सूचक कर है।
- source_word: וַיֵּלֶךְ שְׁמוֹ
  choice: उसकी कीर्ति ... फैल गई
  rationale: शाब्दिक अर्थ ‘उसका नाम गया’ है, पर यहाँ ‘नाम’ प्रतिष्ठा या यश का सूचक है; ‘कीर्ति फैल गई’ इस इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד לְבוֹא מִצְרַיִם
  choice: मिस्र के प्रवेश-मार्ग तक
  rationale: ‘प्रवेश’ की मूल छवि को बनाए रखते हुए यह मिस्र की ओर जाने वाले पहुँच-क्षेत्र या सीमा-प्रदेश का संकेत देता है।
- source_word: הֶחֱזִיק
  choice: सामर्थी हो गया था
  rationale: हिफ़ील रूप यहाँ शक्तिशाली बनने या सिद्ध होने का भाव देता है; कारण बताने वाले वाक्य में यह सहज बैठता है।
- source_word: עַד לְמַעְלָה
  choice: अत्यन्त
  rationale: यह पदबंध शक्ति की बहुत ऊँची मात्रा को व्यक्त करने वाला तीव्रताबोधक मुहावरा है।
