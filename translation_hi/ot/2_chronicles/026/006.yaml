  text: וַ/יֵּצֵא֙ וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֔ים וַ/יִּפְרֹ֞ץ אֶת ח֣וֹמַת גַּ֗ת וְ/אֵת֙ חוֹמַ֣ת יַבְנֵ֔ה וְ/אֵ֖ת חוֹמַ֣ת אַשְׁדּ֑וֹד וַ/יִּבְנֶ֣ה עָרִ֔ים בְּ/אַשְׁדּ֖וֹד וּ/בַ/פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/006.yaml
  text: He went out and fought against the Philistines[a], and he broke down the wall of Gath, the wall of Jabneh, and the wall of Ashdod[b]; and he built cities in the territory of Ashdod and among the Philistines.
translation:
  language: hi
  text: वह निकला और पलिश्तियों से लड़ा। उसने गत की शहरपनाह, यब्ने की शहरपनाह और अश्दोद की शहरपनाहों में सेंध लगाई[a]। और उसने अश्दोद के क्षेत्र में और पलिश्तियों के बीच नगर बनाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शहरपनाहों को तोड़ दिया।” हिब्रू क्रिया का अर्थ दीवार में सेंध लगाना या उसे तोड़ गिराना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में, “अश्दोद में और पलिश्तियों के बीच।” यहाँ “अश्दोद” से शहर या उसके आसपास का क्षेत्र अभिप्रेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: वह निकलकर
  rationale: יצא का मूल अर्थ ‘निकलना’ है। ‘निकलकर’ अगले क्रियाकलाप से स्वाभाविक रूप से जुड़ता है और अपने आप सैन्य कूच का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: पलिश्तियों से लड़ा
  rationale: निफ़अल रूप यहाँ युद्ध करने का अर्थ देता है; हिंदी में ‘से लड़ा’ विरोधी पक्ष को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּפְרֹץ
  choice: में सेंध लगाई
  rationale: प्रץ दीवार के संदर्भ में तोड़कर मार्ग या दरार बनाने को दर्शा सकता है। ‘सेंध लगाई’ सैन्य संदर्भ में स्वाभाविक है और पूरी दीवार के ध्वंस का अनावश्यक दावा नहीं करता।
- source_word: חוֹמַת
  choice: की शहरपनाह
  rationale: हर नगर के साथ एकवचन संज्ञा अलग-अलग आई है। ‘शहरपनाह’ नगर को घेरे हुए रक्षात्मक दीवार का सटीक और संक्षिप्त हिंदी शब्द है।
- source_word: גַּת / יַבְנֵה / אַשְׁדּוֹד
  choice: गत / यब्ने / अशदोद
  rationale: नामों को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיִּבְנֶה עָרִים
  choice: उसने नगर बसाए
  rationale: शाब्दिक रूप से ‘नगर बनाए’; आधुनिक हिंदी में नगरों की स्थापना या निर्माण के लिए ‘नगर बसाए’ अधिक स्वाभाविक है। मूल में पुनर्निर्माण स्पष्ट नहीं है, इसलिए ‘फिर से बसाए’ नहीं कहा गया।
- source_word: בְּאַשְׁדּוֹד
  choice: अशदोद के क्षेत्र में
  rationale: एक ही शहर के भीतर अनेक नगर बसाने की अस्वाभाविक धारणा से बचते हुए यह संभावित प्रादेशिक अर्थ व्यक्त करता है; मूल की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וּבַפְּלִשְׁתִּים
  choice: पलिश्तियों के बीच
  rationale: हिब्रू में भूभाग का नाम नहीं, जनसमूह का रूप है। इसलिए ‘पलिश्तियों के बीच’ मूल संरचना को बनाए रखता है।
