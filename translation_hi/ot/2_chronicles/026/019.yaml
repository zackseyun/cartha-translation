base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/019.yaml
  text: Then Uzziah became angry[a], with a censer in his hand to burn incense; and while he was angry with the priests, leprosy broke out on his forehead before the priests in the house of Yahweh, beside the altar of incense.
translation:
  language: hi
  text: तब उज्जियाह क्रोधित हो गया, और धूप जलाने के लिए उसके हाथ में धूपदान था; और जब वह याजकों पर क्रोधित था, तो याहवे के भवन में धूप की वेदी के पास याजकों के सामने उसके माथे पर कुष्ठ रोग[a] प्रकट हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गंभीर त्वचा रोग’। इब्रानी शब्द צָרַעַת कई प्रकार के गंभीर या धार्मिक रूप से अशुद्ध ठहराने वाले त्वचा-रोगों को सूचित कर सकता है; इसका अर्थ केवल आधुनिक कुष्ठ रोग (हैन्सन रोग) नहीं है।
    reason: मूल इब्रानी शब्द की व्यापक अर्थ-सीमा और आधुनिक चिकित्सकीय शब्द से उसके अंतर को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּזְעַף
  choice: क्रोधित हो गया
  rationale: क्रिया क्रोध या रोष प्रकट करती है; ‘हो गया’ कथानक में उसके क्रोधित होने की घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֻזִּיָּהוּ
  choice: उज्जियाह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: מִקְטֶרֶת
  choice: धूपदान
  rationale: धूप चढ़ाने या जलाने के पात्र के लिए संक्षिप्त और सामान्य हिन्दी शब्द।
- source_word: לְהַקְטִיר
  choice: धूप जलाने के लिए
  rationale: इनफिनिटिव का प्रयोजन स्पष्ट करता है और अनुष्ठानिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: וּבְזַעְפּוֹ עִם הַכֹּהֲנִים
  choice: जब वह याजकों पर क्रोधित था
  rationale: यह वाक्यांश उस परिस्थिति को बताता है जिसमें रोग प्रकट हुआ; ‘पर’ याजकों की ओर लक्षित क्रोध को स्पष्ट करता है।
- source_word: הַצָּרַעַת
  choice: कुष्ठ रोग[a]
  rationale: यह पारंपरिक और पहचानने योग्य बाइबलीय पद है; पादटिप्पणी स्पष्ट करती है कि इब्रानी शब्द को आधुनिक हैन्सन रोग तक सीमित नहीं किया जा सकता।
- source_word: זָרְחָה
  choice: फूट निकला
  rationale: मूल क्रिया का शाब्दिक अर्थ चमकने या प्रकट होने से जुड़ा है; त्वचा की दशा के अचानक दिखाई देने के प्रसंग में ‘फूट निकला’ स्वाभाविक है।
- source_word: בְמִצְחוֹ
  choice: उसके माथे पर
  rationale: शरीर के अंग और रोग के प्रकट होने के स्थान का सीधा अनुवाद।
- source_word: לִפְנֵי הַכֹּהֲנִים
  choice: याजकों के सामने
  rationale: रोग का याजकों की उपस्थिति और दृष्टि में प्रकट होना व्यक्त करता है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ इब्रानी अभिव्यक्ति को बनाए रखता है और प्रसंग में मंदिर को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम को किसी उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: מֵעַל לְמִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी के पास
  rationale: संक्षिप्त इब्रानी संबंधबोधक रचना यहाँ घटना का स्थान धूप की वेदी के निकट बताती है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: צָרַעַת का अर्थ
  choice: कुष्ठ रोग[a]
  alternative: गंभीर त्वचा रोग / अशुद्ध करने वाला चर्मरोग
  rationale: ‘कुष्ठ रोग’ पारंपरिक बाइबलीय पहचान बनाए रखता है, पर पादटिप्पणी मूल शब्द के व्यापक अर्थ को सुरक्षित रखती है और आधुनिक चिकित्सकीय निदान को अनिवार्य नहीं बनाती।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बे इब्रानी वाक्य को स्पष्टता के लिए छोटे हिन्दी वाक्यों में बाँटा गया है, जबकि घटनाक्रम, अनुष्ठानिक शब्दावली और स्थान-संबंध सुरक्षित रखे गए हैं।
