base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/011.yaml
  text: And Uzziah had an army fit for war[a], going out to battle by divisions, according to the number of their enrollment, under the direction of Jeiel the scribe and Maaseiah the officer, under the authority of Hananiah[b], one of the king’s commanders.
translation:
  language: hi
  text: उज्जियाह के पास युद्ध के लिए तैयार एक सेना थी। वह दलों में, अपनी पंजीकृत संख्या के अनुसार, सैन्य सेवा के लिए निकलती थी। यह सेना यऊएल लिपिक और मासेयाह अधिकारी के निर्देशन में, तथा राजा के सेनापतियों में से एक हनन्याह के अधीन थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַיִל עֹשֵׂה מִלְחָמָה
  choice: युद्ध के लिए तैयार एक सेना
  rationale: सैन्य प्रसंग में חַיִל का अर्थ सेना है और कृदन्तीय वाक्यांश उसकी युद्ध करने की क्षमता या तत्परता बताता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יוֹצְאֵי צָבָא
  choice: सैनिक ... युद्ध के लिए निकलते थे
  rationale: यह पद सैन्य अभियान या सेवा के लिए निकलने वालों को दर्शाता है। प्रसंग में ‘युद्ध के लिए निकलते थे’ संस्थागत सैन्य अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: לִגְדוּד
  choice: दलों में
  rationale: यहाँ सेना का संगठित सैन्य दलों या टुकड़ियों में विभाजन अभिप्रेत है; ‘दलों में’ सामान्य पाठक के लिए सरल है।
- source_word: בְּמִסְפַּר פְּקֻדָּתָם
  choice: अपनी सैनिक-गणना के अनुसार
  rationale: פְּקֻדָּה यहाँ सैनिकों की आधिकारिक गिनती, नामांकन या मस्टर को सूचित करता है। ‘सैनिक-गणना’ प्रशासनिक और सैन्य दोनों भाव रखता है।
- source_word: בְּיַד
  choice: के निर्देशन में
  rationale: शाब्दिक ‘हाथ में’ के स्थान पर यह मुहावरे का प्रशासनिक निरीक्षण या संचालन वाला अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: הַסּוֹפֵר
  choice: लेखक
  rationale: यह राजकीय लिखने-पढ़ने और अभिलेख रखने वाले अधिकारी का पद है; ‘लेखक’ पारदर्शी और बाइबलीय हिन्दी में परिचित है।
- source_word: הַשּׁוֹטֵר
  choice: अधिकारी
  rationale: यह प्रशासनिक या सैन्य कार्यकारी पदाधिकारी को दर्शाता है; इस प्रसंग में ‘अधिकारी’ अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: עַל יַד
  choice: के अधीन
  rationale: यह अगले स्तर के अधिकार या पर्यवेक्षण को दर्शाता है और पहले आए ‘निर्देशन में’ से आदेश-क्रम का भेद बनाए रखता है।
- source_word: מִשָּׂרֵי הַמֶּלֶךְ
  choice: राजा के सेनापतियों में से एक
  rationale: שַׂר का अर्थ सरदार, अधिकारी या सेनापति हो सकता है। स्पष्ट सैन्य प्रसंग में ‘सेनापति’ उपयुक्त है, जबकि ‘में से एक’ मूल के बहुवचन और चयनात्मक भाव को रखता है।
- source_word: יעואל
  choice: यऊएल
  rationale: यह रूप प्रस्तुत इब्रानी व्यंजन-पाठ के अधिक निकट लिप्यंतरण है; प्रचलित वैकल्पिक नाम-रूप को पादटिप्पणी में बताया गया है।
