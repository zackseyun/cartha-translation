  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण सैन्य-प्रशासनिक भाषा रखी गई है। लम्बे इब्रानी वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, पर सेना, दलों, आधिकारिक सैनिक-गणना और दो स्तरों के निरीक्षण का संबंध सुरक्षित रखा गया है।
