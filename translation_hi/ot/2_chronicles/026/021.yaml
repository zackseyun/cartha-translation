base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/021.yaml
  text: And King Uzziah was leprous until the day of his death[a], and he lived in a separate house, leprous, because he was cut off from the house of Yahweh. And Jotham his son was over the king’s house[b], judging the people of the land.
translation:
  language: hi
  text: राजा उज्जियाह अपनी मृत्यु के दिन तक चर्मरोग से पीड़ित रहा। वह चर्मरोगी होने के कारण एक अलग घर[a] में रहता था, क्योंकि उसे याहवे के भवन से अलग कर दिया गया था[b]। उसका पुत्र योताम राजा के महल का प्रभारी था और देश के लोगों का न्याय करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः शाब्दिक रूप से, “स्वतंत्रता का घर”; यह कठिन इब्रानी पदबंध संभवतः उस पृथक निवास को दर्शाता है जहाँ उज्जियाह अपनी अवस्था के कारण रहता था।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे याहवे के भवन से काट दिया गया था।”
    reason: alternative_reading
lexical_decisions:
- source_word: מְצֹרָע
  choice: चर्मरोग से पीड़ित / चर्मरोगी
  rationale: इब्रानी शब्द צרעת से पीड़ित व्यक्ति को सूचित करता है। यह बाइबलीय रोग आधुनिक चिकित्सकीय कुष्ठ रोग तक सीमित नहीं है; इसलिए ‘चर्मरोग’ अर्थ को अनावश्यक रूप से संकीर्ण किए बिना सामान्य पाठक के लिए स्पष्ट है।
- source_word: בֵּית הַחפשות
  choice: एक अलग घर
  rationale: यह कठिन पदबंध संभवतः ऐसे पृथक निवास को दर्शाता है जहाँ उज्जियाह अपनी अवस्था के कारण रहता था। ‘अलग घर’ संदर्भगत अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: נִגְזַר מִבֵּית יְהוָה
  choice: उसे याहवे के भवन से अलग कर दिया गया था
  rationale: נִגְזַר का भाव काटकर अलग करने या बहिष्कृत करने का है। यह अनुवाद मंदिर में प्रवेश से उसके वंचित किए जाने की गंभीरता को व्यक्त करता है, पर कारण या विधि को पाठ से अधिक निश्चित नहीं करता।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है और संदर्भ में मंदिर को सूचित करता है।
- source_word: עַל בֵּית הַמֶּלֶךְ
  choice: राजमहल की देखरेख करता
  rationale: यह पदबंध राजा के भवन अथवा राजकीय गृह-व्यवस्था पर प्रशासनिक अधिकार दर्शाता है। ‘राजमहल की देखरेख’ आधुनिक हिंदी में स्वाभाविक और संदर्भानुकूल है।
- source_word: שׁוֹפֵט אֶת עַם הָאָרֶץ
  choice: देश के लोगों का न्याय करता था
  rationale: שׁוֹפֵט में न्याय करने के साथ शासकीय कार्य का व्यापक भाव हो सकता है। ‘न्याय करता’ मूल क्रिया से निकटता रखते हुए इस संभावित व्यापकता को खुला छोड़ता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह सीधा और सहज अनुवाद है, जो किसी संकीर्ण सामाजिक या राजनीतिक तकनीकी अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम יְהוָה है। ‘याहवे’ उसका पारदर्शी लिप्यंतरण है और सामान्य उपाधि से उसे प्रतिस्थापित नहीं करता।
- issue: उज्जियाह का याहवे के भवन से संबंध-विच्छेद
  choice: उसे याहवे के भवन से अलग कर दिया गया था
  alternative: वह याहवे के भवन से काट दिया गया था / उसे वहाँ से बाहर रखा गया था
  rationale: यह कर्मवाच्य रूप मूल की अस्पष्टता बनाए रखता है कि उसे किसने अलग किया, और मंदिर तक उसकी पहुँच समाप्त होने की बात को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सहज रखी गई है। ‘चर्मरोग’ आधुनिक चिकित्सकीय कुष्ठ रोग की अनावश्यक पहचान से बचता है। कठिन इब्रानी पदबंधों की वास्तविक अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
