source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י עֻזִּיָּ֔הוּ הָ/רִאשֹׁנִ֖ים וְ/הָ/אֲחֲרֹנִ֑ים כָּתַ֛ב יְשַֽׁעְיָ֥הוּ בֶן אָמ֖וֹץ הַ/נָּבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/022.yaml
  text: The rest of the acts of Uzziah[a], first and last, Isaiah son of Amoz the prophet wrote.
translation:
  language: hi
  text: उज्जियाह के शेष कार्यों का, आरम्भ से अन्त तक, वृत्तांत आमोत्स के पुत्र यशायाह नबी ने लिखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי עֻזִּיָּהוּ
  choice: उज्जियाह के शेष कामों का वर्णन
  rationale: राजकीय इतिहास के इस सूत्र में דִּבְרֵי का आशय राजा के कथनों से नहीं, बल्कि उसके शासनकाल के कामों और घटनाओं से है। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए 'वर्णन' जोड़ा गया है, जबकि 'शेष' יֶתֶר को व्यक्त करता है।
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: आरम्भ से अन्त तक
  rationale: शाब्दिक रूप से 'पहले और बाद के'; युग्म पूरे शासनकाल के विस्तार को दर्शाता है। 'आरम्भ से अन्त तक' आधुनिक हिन्दी में यही अर्थ स्वाभाविक रूप से देता है।
- source_word: כָּתַב
  choice: लिखा
  rationale: क्रिया का सीधा अर्थ 'लिखा' है; अतः अधिक व्याख्यात्मक 'अभिलिखित किया' के बजाय सामान्य और सटीक रूप रखा गया है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ
  choice: आमोस के पुत्र यशायाह
  rationale: व्यक्ति के नाम और पितृनाम को हिन्दी के स्वाभाविक संबंध-क्रम में रखा गया है। אָמוֹץ को भविष्यद्वक्ता आमोस (עָמוֹס) से अलग दिखाने के लिए प्रचलित बाइबलीय रूप 'आमोस' रखा गया है; दोनों नाम हिन्दी में समान दिख सकते हैं, पर सन्दर्भ पहचान स्पष्ट करता है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यह यशायाह के मान्य भविष्यद्वक्ताई पद को सूचित करने वाली निश्चित उपाधि है। 'नबी' आधुनिक हिन्दी बाइबल-प्रयोग में सहज और व्यापक रूप से समझा जाता है।
theological_decisions:
- issue: राजकीय सूत्र में דִּבְרֵי का स्वरूप
  choice: '''कामों'' के रूप में अनुवाद'
  alternative: '''बातों'' या ''वचनों'' के रूप में अनुवाद'
  rationale: यहाँ शब्द राजा के बोले हुए वचनों तक सीमित नहीं, बल्कि उसके शासन से जुड़ी घटनाओं और कार्यों का संकेत करता है। इसलिए 'कामों' से इतिहास-वृत्त का आशय स्पष्ट होता है।
- issue: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים की कालगत व्यापकता
  choice: '''आरम्भ से अन्त तक'''
  alternative: '''पहले और बाद के'''
  rationale: चुना हुआ रूप पूरे कालखंड को व्यक्त करता है, पर स्रोत में निहित कालगत विस्तार से आगे कोई अतिरिक्त दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू का आरम्भिक וְ हिन्दी में अलग से 'और' बनाकर नहीं रखा गया, क्योंकि स्वतंत्र पद के रूप में वह हिन्दी में अस्वाभाविक लगता; वाक्य का संक्रमण बिना उसके स्पष्ट है।
