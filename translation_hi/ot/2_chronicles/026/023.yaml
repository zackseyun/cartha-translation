review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the royal death formula, the indefinite active plural “they buried him,” the association with his fathers, the reason for the burial location, and Jotham’s succession. “चर्मरोग से पीड़ित” appropriately avoids identifying מְצוֹרָע with a specific modern disease.
  naturalness: “कब्रिस्तान के खेत” is not idiomatic modern Hindi and sounds like an ordinary agricultural field belonging to a cemetery. “कब्रिस्तान के मैदान” is more natural while retaining the source’s concrete reference to a burial field/area. Removing “तब” also follows the Hebrew’s simple consecutive narration more closely.
  terminology: “पुरखाओं के साथ सो गया” suitably retains the conventional royal obituary idiom. “चर्मरोग से पीड़ित” is a sound main-text rendering for מְצוֹרָע; a note is needed to prevent it from being read as a precise modern medical diagnosis.
  issues:
  - severity: medium
    issue: “कब्रिस्तान के खेत” is awkward and semantically unclear in Hindi.
    rationale: Although it attempts to render שְׂדֵה הַקְּבוּרָה literally, the phrase is not normal modern Hindi. “कब्रिस्तान के मैदान” naturally communicates a burial field/area without changing the referent.
  - severity: low
    issue: The lexical ambiguity of מְצוֹרָע is unnoted in the translated text.
    rationale: The main rendering is appropriately broad, but a footnote preserves the fact that the Hebrew ritual/skin-condition category does not necessarily equal a particular modern medical condition.
