base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/023.yaml
  text: And Uzziah slept with his fathers[a], and they buried him with his fathers in the burial field that belonged to the kings, for they said, “He is a leper.” And Jotham his son reigned in his place.
translation:
  language: hi
  text: उज्जियाह अपने पुरखाओं के साथ सो गया, और उन्होंने उसे उसके पुरखाओं के साथ उस कब्रिस्तान के मैदान में दफनाया जो राजाओं का था, क्योंकि उन्होंने कहा, “वह चर्मरोग से पीड़ित है।” और उसका पुत्र योताम उसकी जगह राजा हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב עֻזִּיָּהוּ עִם אֲבֹתָיו
  choice: उज्जियाह अपने पुरखाओं के साथ सो गया
  rationale: राजकीय मृत्यु-सूचना के पारंपरिक इब्रानी मुहावरे को बनाए रखता है; हिंदी में ‘सो गया’ मृत्यु का सम्मानपूर्ण रूपक है और ‘पुरखाओं’ से वंशगत पूर्वजों का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे ... दफनाया
  rationale: इब्रानी क्रिया सक्रिय बहुवचन है और कर्ता अनिर्दिष्ट है; इसलिए निष्क्रिय वाक्य के बजाय ‘उन्होंने’ रखा गया है।
- source_word: בִּשְׂדֵה הַקְּבוּרָה
  choice: कब्रिस्तान के खेत में
  rationale: שׂדה के ठोस अर्थ ‘खेत’ और הקבורה के दफन-स्थान संबंधी अर्थ, दोनों को बनाए रखता है।
- source_word: אֲשֶׁר לַמְּלָכִים
  choice: जो राजाओं का था
  rationale: लामेद से व्यक्त स्वामित्व अथवा संबद्धता को सहज हिंदी में रखता है, बिना यह तय किए कि भूमि निजी संपत्ति थी या राजकीय उपयोग के लिए नियत।
- source_word: מְצוֹרָע
  choice: चर्मरोग से पीड़ित
  rationale: यह शब्द צָרַעַת से पीड़ित व्यक्ति को दर्शाता है; इसे आधुनिक हैन्सन रोग तक सीमित करना स्रोत से अधिक विशिष्ट होगा।
- source_word: וַיִּמְלֹךְ יוֹתָם בְּנוֹ תַּחְתָּיו
  choice: तब उसका पुत्र योताम उसकी जगह राजा हुआ
  rationale: राजवंशीय उत्तराधिकार को स्वाभाविक हिंदी में व्यक्त करता है और תחתיו के प्रतिस्थापन-संबंधी अर्थ को ‘उसकी जगह’ से सुरक्षित रखता है।
theological_decisions:
- issue: מְצוֹרָע का अनुष्ठानिक और चिकित्सकीय अर्थ
  choice: वह चर्मरोग से पीड़ित है
  alternative: वह कोढ़ी है
  rationale: इब्रानी צרעת आधुनिक कुष्ठ/हैन्सन रोग से व्यापक श्रेणी हो सकती है। इसलिए मुख्य पाठ में सामान्य किंतु अपेक्षाकृत सटीक ‘चर्मरोग’ रखा गया है, जिससे कोई निश्चित आधुनिक निदान आरोपित न हो।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण कथात्मक शैली। राजकीय मृत्यु-सूत्र का रूपक बनाए रखा गया है। ‘पुरखाओं’ सामान्य पाठक के लिए ‘पितरों’ से अधिक सहज है।
