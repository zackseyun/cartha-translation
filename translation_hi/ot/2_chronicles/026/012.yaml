  text: The total number of the heads of the fathers’ houses, for the mighty men of valor, was two thousand six hundred.
translation:
  language: hi
  text: वीर योद्धाओं के पितृकुलों के मुखियाओं की कुल संख्या दो हज़ार छह सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह इब्रानी पद कुलों या वंशगत घरानों के अगुओं को दर्शाता है; ‘पितृकुल’ आधुनिक हिन्दी में संक्षिप्त रहते हुए इस सामाजिक संरचना को स्पष्ट करता है।
- source_word: לְגִבּוֹרֵי חָיִל
  choice: वीर योद्धाओं के
  rationale: संदर्भ में यह सैन्य वीरों को सूचित करता है। उपसर्ग לְ का संबंध मुखियाओं और योद्धाओं के दल से है; हिन्दी संबंध-रचना इसे स्वाभाविक रूप से व्यक्त करती है।
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: दो हज़ार छह सौ
  rationale: मूल संख्या का सीधा और प्रचलित हिन्दी रूप।
