  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सैन्य-संगठन के संदर्भ के अनुरूप रखी गई है। मूल में ‘पिताओं’ के शाब्दिक रूप के बजाय संस्थागत अर्थ बताने के लिए ‘पितृकुलों’ का प्रयोग किया गया है।
