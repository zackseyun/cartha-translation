base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/015.yaml
  text: In Jerusalem he made devices[a], invented by skillful men, to be on the towers and on the corners, to shoot arrows and large stones. And his fame spread far abroad[c][b], for he was marvelously helped until he became strong.
translation:
  language: hi
  text: उसने यरूशलेम में एक कुशल अभिकल्पक की योजना के अनुसार यंत्र[a] बनवाए, जिन्हें मीनारों और कोनों पर रखने के लिए बनाया गया था, ताकि उनसे तीर और बड़े पत्थर चलाए जाएँ। उसकी कीर्ति दूर-दूर तक फैल गई[b], क्योंकि उसे अद्भुत रीति से सहायता मिली[c], यहाँ तक कि वह शक्तिशाली हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युक्तियाँ” अथवा “मशीनें”—अर्थात किले की मीनारों और कोनों पर उपयोग के लिए बनाए गए सैन्य उपकरण।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका नाम दूर तक निकल गया।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ पाठ सहायता देने वाले का नाम स्पष्ट रूप से नहीं बताता, यद्यपि प्रसंग परमेश्वर की सहायता की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חִשְּׁבֹנוֹת
  choice: यंत्र
  rationale: यह संज्ञा सोच-समझकर बनाई गई युक्तियों अथवा यांत्रिक साधनों को दर्शाती है। सैन्य संदर्भ में ‘यंत्र’ स्वाभाविक है और प्राचीन तकनीक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מַחֲשֶׁבֶת חוֹשֵׁב
  choice: कुशल कारीगरों द्वारा बनाए गए
  rationale: सजातीय पदावली योजनाबद्ध अभिकल्पना और कारीगरी, दोनों पर बल देती है। हिंदी में यह वाक्यांश अर्थ को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל הַמִּגְדָּלִים וְעַל הַפִּנּוֹת
  choice: मीनारों और कोनों पर
  rationale: ‘मीनारें’ और ‘कोने’ मूल के ठोस चित्र को बनाए रखते हैं; ‘परकोटे’ या ‘कोने की बुर्जें’ कहना अधिक व्याख्यात्मक होता।
- source_word: לִירוֹא בַּחִצִּים וּבָאֲבָנִים גְּדֹלוֹת
  choice: ताकि उनसे तीर और बड़े-बड़े पत्थर चलाए जाएँ
  rationale: उद्देश्यसूचक infinitive को स्पष्ट रखा गया है। एक ही हिब्रू क्रिया तीरों और पत्थरों दोनों पर लागू होती है; हिंदी ‘चलाए जाएँ’ दोनों को स्वाभाविक रूप से समेटती है।
- source_word: וַיֵּצֵא שְׁמוֹ עַד לְמֵרָחוֹק
  choice: उसकी कीर्ति दूर-दूर तक फैल गई
  rationale: शाब्दिक ‘उसका नाम दूर तक निकल गया’ ख्याति फैलने का मुहावरा है; ‘कीर्ति’ हिंदी में उस आशय को गरिमापूर्ण और सहज ढंग से व्यक्त करती है।
- source_word: הִפְלִיא לְהֵעָזֵר
  choice: उसे अद्भुत रीति से सहायता मिली
  rationale: मूल की असाधारण अथवा विस्मयकारी सहायता और उसके निष्क्रिय रूप, दोनों को बनाए रखता है तथा सहायता देने वाले को अनकहा छोड़ता है।
- source_word: עַד כִּי חָזָק
  choice: यहाँ तक कि वह शक्तिशाली हो गया
  rationale: यह सहायता के परिणाम अथवा सीमा को व्यक्त करता है। ‘हो गया’ प्राप्त अवस्था को स्वाभाविक आधुनिक हिंदी में दर्शाता है।
theological_decisions:
- issue: राजा को सहायता देने वाले की पहचान
  choice: 'मुख्य पाठ में सहायता देने वाले को अनकहा रखा गया: ‘उसे ... सहायता मिली’'
  alternative: ‘यहोवा ने अद्भुत रीति से उसकी सहायता की’
  rationale: इस उपवाक्य में हिब्रू पाठ सहायता देने वाले का स्पष्ट नाम नहीं लेता, यद्यपि व्यापक प्रसंग परमेश्वर की सहायता की ओर संकेत करता है। निष्क्रिय रचना मूल की इस अंतर्निहितता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘यंत्र’ तकनीक को अत्यधिक विशिष्ट किए बिना सैन्य उपकरण का भाव देता है। मूल की निष्क्रिय रचना और सहायता देने वाले की अस्पष्टता सुरक्षित रखी गई है।
