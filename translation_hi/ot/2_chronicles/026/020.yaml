  yaml_path: translation/ot/2_chronicles/026/020.yaml
  text: Azariah the chief priest turned toward him[a], and all the priests also, and behold, he was leprous on his forehead. So they hurried him out of there, and he himself also hastened to go out[c][b], because Yahweh had struck him.
translation:
  language: hi
  text: तब प्रधान याजक अजर्याह उसकी ओर मुड़कर देखने लगा, और सभी याजक भी; और देखो, उसके माथे पर कोढ़[a] था। इसलिए उन्होंने उसे वहाँ से जल्दी से बाहर निकाला[b]; और वह स्वयं भी बाहर निकलने को जल्दी करने लगा[c], क्योंकि याहवे ने उस पर प्रहार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “कोढ़” उस इब्रानी शब्द का अनुवाद है जो याजकीय अशुद्धता-विधियों में गंभीर त्वचा-विकारों के लिए आता है; यह आवश्यक नहीं कि वह ठीक वही रोग हो जिसे आज हैन्सन रोग कहा जाता है।
    reason: cultural_note
  - marker: b
    text: या, “उन्होंने उसे वहाँ से बाहर निकाल दिया।” इब्रानी क्रिया में तत्काल हटाने का भाव है और वह याजकों की बलपूर्वक कार्रवाई पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसे बाहर निकलने के लिए धकेला गया।” इब्रानी रूप बाहर की ओर विवश किए जाने पर बल दे सकता है, यद्यपि प्रसंग में उसके स्वयं शीघ्र निकलने का भाव भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן אֵלָיו
  choice: उसकी ओर देखा
  rationale: פנה का मूल भाव उसकी ओर मुड़ना है; इस प्रसंग में याजकों द्वारा उज्जियाह की दशा देख लेने की स्वाभाविक हिन्दी अभिव्यक्ति ‘उसकी ओर देखा’ है।
- source_word: עֲזַרְיָהוּ כֹהֵן הָרֹאשׁ
  choice: प्रधान याजक अजर्याह
  rationale: כֹהֵן הָרֹאשׁ का शाब्दिक भाव ‘मुख्य/प्रधान याजक’ है। ‘प्रधान याजक’ पद को अनावश्यक रूप से अधिक तकनीकी बनाए बिना उसका दर्जा स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: और क्या देखते हैं कि
  rationale: यह आधुनिक हिन्दी में अचानक दिखाई पड़ी बात और कथात्मक जीवंतता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְצֹרָע בְּמִצְחוֹ
  choice: उसके माथे पर कोढ़ निकल आया है
  rationale: यह दृश्य त्वचा-विकार को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है; ‘कोढ़’ यहाँ याजकीय अशुद्धता-विधियों के व्यापक इब्रानी पद का पारंपरिक अनुवाद है।
- source_word: וַיַּבְהִלֻהוּ מִשָּׁם
  choice: उन्होंने उसे वहाँ से झटपट बाहर निकाला
  rationale: בהל के हिफ़ील रूप में शीघ्रता कराने अथवा घबराहट में हटाने का भाव है। चुना हुआ वाक्य तात्कालिकता और याजकों की सक्रिय भूमिका दोनों रखता है।
- source_word: וְגַם הוּא נִדְחַף לָצֵאת
  choice: वह स्वयं भी बाहर निकलने के लिए उतावला हुआ
  rationale: נִדְחַף में बाहर की ओर धकेले या प्रेरित किए जाने का भाव हो सकता है। प्रसंग में उज्जियाह की अपनी तत्परता भी सामने आती है; ‘उतावला हुआ’ इस भाव को रखता है, जबकि वैकल्पिक कर्मवाच्य पादटिप्पणी में दिया गया है।
- source_word: כִּי נִגְּעוֹ יְהוָה
  choice: क्योंकि यहोवा ने उसे मारा था
  rationale: यहाँ נגע निष्पक्ष स्पर्श नहीं, दण्डस्वरूप प्रहार या विपत्ति पहुँचाने को दर्शाता है। ‘मारा था’ कारण और दैवी कर्तृत्व को सीधे रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम है; ‘यहोवा’ हिन्दी पाठकों के लिए उसका परिचित लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: כֹהֵן הָרֹאשׁ को तकनीकी पदनाम मानना
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: इब्रानी पद का स्पष्ट अर्थ ‘मुख्य/प्रधान याजक’ है। ‘प्रधान याजक’ मूल शब्दावली को बनाए रखते हुए बाद की तकनीकी पद-संज्ञा को अनावश्यक रूप से आरोपित नहीं करता।
- issue: उज्जियाह के निकलने में स्वैच्छिक शीघ्रता या बाहरी दबाव
  choice: वह स्वयं भी बाहर निकलने के लिए उतावला हुआ
  alternative: उसे बाहर निकलने के लिए धकेला गया
  rationale: निफ़ाल रूप दोनों प्रकार की धारणा दे सकता है। मुख्य पाठ प्रसंग में उसकी अपनी तात्कालिक प्रतिक्रिया को सामने रखता है, जबकि कर्मवाच्य सम्भावना पादटिप्पणी में सुरक्षित है।
