  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘क्या देखते हैं’ अचानक पहचान की जीवंतता देता है। ‘झटपट’ तात्कालिकता को सामान्य पाठक के लिए सहज बनाता है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित दावों के बाद दिए गए हैं; त्वचा-विकार संबंधी सांस्कृतिक टिप्पणी वाक्य के अंत में रखी गई है।
