source:
  edition: WLC
  text: וַ/יָּכֶן֩ לָ/הֶ֨ם עֻזִּיָּ֜הוּ לְ/כָל הַ/צָּבָ֗א מָגִנִּ֤ים וּ/רְמָחִים֙ וְ/כ֣וֹבָעִ֔ים וְ/שִׁרְיֹנ֖וֹת וּ/קְשָׁת֑וֹת וּ/לְ/אַבְנֵ֖י קְלָעִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/014.yaml
  text: And Uzziah prepared for them[a], for the whole army, shields and spears and helmets and coats of armor and bows and slingstones.
translation:
  language: hi
  text: उज्जियाह ने उनके लिए, पूरी सेना के लिए, ढालें, भाले, टोपियाँ, कवच, धनुष और गोफन के पत्थर तैयार किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּכֶן
  choice: तैयार किए
  rationale: हिफ़ील रूप यहाँ सैन्य सामान को तैयार या उपलब्ध कराने का भाव देता है; यह शब्द निर्माण किए जाने का अनावश्यक दावा नहीं करता।
- source_word: לָהֶם לְכָל הַצָּבָא
  choice: उनके लिए, अर्थात् पूरी सेना के लिए
  rationale: सर्वनाम को बनाए रखते हुए अगला पद उसके संदर्भ को स्पष्ट करता है; 'अर्थात्' हिन्दी में मूल की पुनर्व्याख्यात्मक संरचना को स्वाभाविक बनाता है।
- source_word: מָגִנִּים
  choice: ढालें
  rationale: यह युद्ध में प्रयुक्त ढालों का सामान्य और स्पष्ट हिन्दी शब्द है।
- source_word: רְמָחִים
  choice: भाले
  rationale: सैन्य संदर्भ में רֹמַח के लिए प्रचलित, सहज और पर्याप्त व्यापक शब्द।
- source_word: כּוֹבָעִים
  choice: टोप
  rationale: यहाँ सिर की रक्षात्मक सैन्य सामग्री अभिप्रेत है; 'टोप' बाइबिलीय सैन्य संदर्भ में संक्षिप्त और समझने योग्य है।
- source_word: שִׁרְיֹנוֹת
  choice: कवच
  rationale: धड़ की रक्षा करने वाले सैन्य पहनावे के लिए स्वाभाविक हिन्दी शब्द; मूल किसी विशेष प्रकार, जैसे जालीदार कवच, को अनिवार्य नहीं करता।
- source_word: קְשָׁתוֹת
  choice: धनुष
  rationale: बहुवचन सामूहिक सूची में हिन्दी में 'धनुष' स्वाभाविक रूप से प्रयुक्त होता है।
- source_word: אַבְנֵי קְלָעִים
  choice: गोफन के पत्थर
  rationale: इब्रानी का शाब्दिक अर्थ 'गोफनों के पत्थर' है; हिन्दी में यह पद हथियार और उसके लिए प्रयुक्त पत्थरों का संबंध स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण सैन्य-वर्णन। वस्तुओं की क्रमबद्ध सूची और इब्रानी सर्वनाम के संदर्भ को सुरक्षित रखा गया है। अंग्रेज़ी परत में दिया गया पादटिप्पणी-चिह्न वस्तुतः 'for them' के बाद असंगत था और उसका विषय slingstones था; हिन्दी में 'गोफन के पत्थर' स्वयं स्पष्ट तथा मूल के निकट होने के कारण पादटिप्पणी आवश्यक नहीं है।
