base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/018.yaml
  text: They stood against King Uzziah and said to him[a], “It is not for you, Uzziah, to burn incense to Yahweh, but for the priests, the sons of Aaron, who are consecrated to burn incense. Leave the sanctuary, for you have acted unfaithfully[c][b], and it will not be for your honor from Yahweh God.”
translation:
  language: hi
  text: उन्होंने राजा उज्जियाह का सामना किया[a] और उससे कहा, “उज्जियाह, यहोवा के लिए धूप जलाना तेरा काम नहीं है; यह याजकों का काम है—हारून के वंशजों का, जिन्हें धूप जलाने के लिए पवित्र ठहराया गया है। पवित्रस्थान से बाहर निकल जा, क्योंकि तूने विश्वासघात किया है[b]। इससे तुझे यहोवा परमेश्वर की ओर से सम्मान नहीं मिलेगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उसका विरोध किया” अथवा “उन्होंने उसके विरुद्ध डटकर खड़े हुए।”
    reason: lexical_alternative
  - marker: b
    text: या, “तूने पवित्र बात में अपराध किया है।” इब्रानी क्रिया विशेष रूप से परमेश्वर के प्रति निष्ठाभंग या पवित्र व्यवस्था के उल्लंघन का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: शब्दशः, “और तेरे लिए सम्मान के निमित्त नहीं, यहोवा परमेश्वर की ओर से।” यह संक्षिप्त इब्रानी अभिव्यक्ति बताती है कि यह काम परमेश्वर की ओर से उसे सम्मान नहीं दिलाएगा।
    reason: source_clarity
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל
  choice: के सामने डटकर खड़े हो गए
  rationale: यह इब्रानी मुहावरा केवल पास खड़े होने के बजाय विरोध करते हुए सामना करने का भाव देता है। यह हिंदी अभिव्यक्ति उस प्रतिरोध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עֻזִּיָּהוּ הַמֶּלֶךְ
  choice: उज्जियाह राजा
  rationale: नाम के बाद पद रखना बाइबलीय हिंदी में सहज और गरिमापूर्ण है तथा मूल शब्दक्रम की छाया बनाए रखता है।
- source_word: לֹא לְךָ ... לְהַקְטִיר
  choice: यह ... तेरा काम नहीं है
  rationale: यह निर्माण अधिकार अथवा उचित दायित्व के निषेध को व्यक्त करता है। ‘तेरा काम नहीं’ आधुनिक हिंदी में स्पष्ट है और प्रशासनिक ‘अधिकृत नहीं’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: לְהַקְטִיר
  choice: धूप जलाना
  rationale: संदर्भ में हिफ़ील रूप पवित्र धूप चढ़ाने के लिए उसे जलाने को सूचित करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: दिव्य नाम יהוה को प्रचलित हिंदी बाइबल परंपरा के अनुसार ‘यहोवा’ से व्यक्त किया गया है; संबंधसूचक ל यहाँ अर्पण की दिशा/प्राप्तकर्ता बताता है।
- source_word: כִּי לַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: यह काम याजकों का है—हारून के वंशजों का
  rationale: वाक्य धूप चढ़ाने के विशेष अधिकार को हारूनवंशी याजकों तक सीमित करता है। ‘वंशज’ सामूहिक वंशपरंपरा को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: הַמְקֻדָּשִׁים
  choice: जिन्हें ... पवित्र ठहराया गया है
  rationale: निष्क्रिय कृदंत उन लोगों को दर्शाता है जिन्हें पवित्र सेवा के लिए अलग किया गया है।
- source_word: צֵא מִן הַמִּקְדָּשׁ
  choice: पवित्रस्थान से बाहर निकल जा
  rationale: מקדש पवित्र परिसर अथवा sanctuary को दर्शाता है। यह अनुवाद आदेश की तीव्रता और स्थान की पवित्रता दोनों बनाए रखता है।
- source_word: מָעַלְתָּ
  choice: तूने विश्वासघात किया है
  rationale: מעל विशेषकर पवित्र अथवा वाचागत मामले में निष्ठाभंग और अपराध का गंभीर भाव रखता है; ‘विश्वासघात’ उस गंभीरता को सुरक्षित रखता है।
- source_word: וְלֹא לְךָ לְכָבוֹד מֵיְהוָה אֱלֹהִים
  choice: इससे तुझे यहोवा परमेश्वर की ओर से सम्मान नहीं मिलेगा
  rationale: मूल वाक्यांश संक्षिप्त और दीर्घवृत्तात्मक है। हिंदी में ‘इससे’ निहित परिणाम-संबंध को स्पष्ट करता है, जबकि सम्मान के स्रोत के रूप में यहोवा परमेश्वर को बनाए रखता है।
theological_decisions:
- issue: मंदिर में धूप चढ़ाने का याजकीय अधिकार
  choice: धूप जलाने का यह कार्य पवित्र ठहराए गए हारूनवंशी याजकों का है, राजा का नहीं।
  alternative: इसे सामान्य रूप से उपासना की अगुवाई पर कथन मानना।
  rationale: मूल पाठ विशेष रूप से धूप चढ़ाने के संस्कारगत कार्य और हारून के वंशजों का उल्लेख करता है; इसलिए सामान्यीकृत कथन के बजाय ठोस प्रतिबंध को सुरक्षित रखा गया है।
- issue: מָעַלְתָּ की धार्मिक गंभीरता
  choice: ‘विश्वासघात किया है’
  alternative: ‘नियम तोड़ा है’ या ‘अतिक्रमण किया है’
  rationale: यह क्रिया केवल प्रक्रिया की भूल नहीं, बल्कि परमेश्वर द्वारा ठहराई गई पवित्र व्यवस्था के प्रति गंभीर निष्ठाभंग बताती है।
- issue: अंतिम खंड का दीर्घवृत्त
  choice: इस कार्य के फलस्वरूप उज्जियाह को यहोवा परमेश्वर से सम्मान नहीं मिलेगा।
  alternative: 'शब्दशः: ‘और तेरे लिए सम्मान के निमित्त नहीं, यहोवा परमेश्वर की ओर से।’'
  rationale: मूल की अस्पष्ट संक्षिप्तता को अर्थ-विपर्यय के बिना स्वाभाविक हिंदी में खोला गया है; पाठ अपमान की विस्तृत प्रकृति नहीं बताता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठकों के लिए सुबोध शैली। राजकीय संबोधन में ‘तू/तेरा’ मूल के एकवचन प्रत्यक्ष और कठोर संबोधन को दर्शाता है। ‘याजक,’ ‘पवित्रस्थान’ और ‘पवित्र ठहराया’ जैसे परिचित बाइबलीय शब्द संस्कारगत संदर्भ की सटीकता बनाए रखते हैं।
