base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/026/017.yaml
  text: Azariah the priest went in after him[a], and with him were eighty priests of Yahweh, valiant men.
translation:
  language: hi
  text: तब अजर्याह याजक उसके पीछे आया। उसके साथ याहवे के अस्सी याजक थे, जो साहसी पुरुष थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वीर पुरुष।’ इब्रानी मुहावरा בְּנֵי חָיִל ऐसे पुरुषों को सूचित कर सकता है जिनकी पहचान सामर्थ्य, साहस या वीरता से होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אַחֲרָיו
  choice: उसके पीछे भीतर गया
  rationale: בוא संदर्भ में भीतर जाने का भाव देता है और אַחֲרָיו किसी के पीछे जाने का; यह अनुवाद दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲזַרְיָהוּ הַכֹּהֵן
  choice: अजर्याह याजक
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है और הכהן को सीधे ‘याजक’ कहा गया है।
- source_word: וְעִמּוֹ
  choice: उसके साथ ... थे
  rationale: इब्रानी के क्रियारहित संगति-वाक्य को सहज हिन्दी बनाने के लिए ‘थे’ जोड़ा गया है।
- source_word: כֹּהֲנִים לַיהוָה
  choice: याहवे के ... याजक
  rationale: ל संबंध अथवा सेवा-समर्पण दिखाता है; ‘याहवे के याजक’ हिन्दी में स्वाभाविक रूप से दोनों के अनुकूल है।
- source_word: שְׁמוֹנִים
  choice: अस्सी
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: בְּנֵי חָיִל
  choice: साहसी पुरुष
  rationale: शाब्दिक रूप ‘सामर्थ्य/वीरता के पुत्र’ एक मुहावरा है, जो यहाँ राजा का सामना करने वाले याजकों की शक्ति और साहस को व्यक्त करता है। ‘साहसी पुरुष’ वर्तमान हिन्दी में स्पष्ट है, जबकि अन्य संभावित अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है; ‘यहोवा’ पारंपरिक वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי חָיִל में पुरुषवाचक अभिव्यक्ति
  choice: साहसी पुरुष
  alternative: वीर जन; सामर्थी लोग
  rationale: संदर्भ में पुरुष याजकों की बात है और इब्रानी अभिव्यक्ति भी पुल्लिंग है, इसलिए लिंग-सटीक रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले वाक्य में ‘भीतर’ से संदर्भगत प्रवेश स्पष्ट होता है, पर स्थान को मूल से अधिक विशिष्ट नहीं बनाया गया। डैश अंतिम पदबंध को उन अस्सी याजकों का वर्णन बताता है।
