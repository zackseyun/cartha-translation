    reason: cultural_note
lexical_decisions:
- source_word: בָּנָה
  choice: बनाया
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना’ है। ‘फिर से बनाया’ या ‘किलेबंद किया’ संदर्भ से संभव हो सकता है, पर क्रिया में वह अर्थ स्पष्ट रूप से नहीं है।
- source_word: אֵילוֹת
  choice: एलोत
  rationale: यह स्थान-नाम है; ‘एलोत’ यहाँ के इब्रानी रूप का निकट देवनागरी लिप्यंतरण है।
- source_word: וַיְשִׁיבֶהָ
  choice: उसे ... लौटा दिया
  rationale: हिफ़इल रूप का अर्थ यहाँ एलोत को फिर यहूदा के अधिकार में लाना है। ‘लौटा दिया’ causative और directional अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִיהוּדָה
  choice: यहूदा को
  rationale: ל लक्ष्य या प्राप्तकर्ता को दर्शाता है; ‘यहूदा को’ मूल की दिशात्मकता बनाए रखता है।
- source_word: אַחֲרֵי שְׁכַב
  choice: सो जाने के बाद
  rationale: यह राजकीय मृत्यु-वर्णन में प्रयुक्त इब्रानी शिष्टोक्ति है। शाब्दिक बिंब को बनाए रखा गया है और पादटिप्पणी में उसका आशय स्पष्ट किया गया है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ में व्यक्तिगत नाम के बजाय ‘राजा’ है, इसलिए संदर्भ से अमस्याह नाम जोड़कर अस्पष्टता को नहीं हटाया गया।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह पारंपरिक इब्रानी मृत्यु-सूत्र का निकट और समझने योग्य हिन्दी रूप है; ‘पुरखाओं’ आधुनिक पाठक के लिए ‘पितरों’ से अधिक सहज है।
