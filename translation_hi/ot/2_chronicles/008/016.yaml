  text: וַ/תִּכֹּן֙ כָּל מְלֶ֣אכֶת שְׁלֹמֹ֔ה עַד הַ/יּ֛וֹם מוּסַ֥ד בֵּית יְהוָ֖ה וְ/עַד כְּלֹת֑/וֹ שָׁלֵ֖ם בֵּ֥ית יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/016.yaml
  text: Thus all the work of Solomon was prepared from the day the house of Yahweh was founded until it was finished[b][a]. So the house of Yahweh was completed.
translation:
  language: hi
  text: इस प्रकार सुलैमान का सारा काम याहवे के भवन की नींव डाले जाने के दिन से लेकर उसके पूरा होने तक सुव्यवस्थित हुआ[a][b]। तब याहवे का भवन पूरा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुलैमान का सारा काम तैयार हुआ,” अथवा “व्यवस्थित हुआ।” इब्रानी क्रिया का अर्थ स्थापित हुआ, तैयार हुआ, या सुव्यवस्थित हुआ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “याहवे के भवन की नींव डाले जाने के दिन से उसके पूरा होने तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכֹּן
  choice: ठीक रीति से संपन्न हुआ
  rationale: निफ़अल रूप काम के तैयार, स्थापित या सुव्यवस्थित होकर परिणाम तक पहुँचने का भाव देता है। प्रसंग में ‘ठीक रीति से संपन्न हुआ’ स्वाभाविक हिन्दी में परिणामात्मक और व्यवस्थित दोनों भाव व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: כָּל מְלֶאכֶת שְׁלֹמֹה
  choice: सुलैमान का सारा काम
  rationale: מְלָאכָה यहाँ पूरे राजकीय निर्माण-कार्य या उपक्रम को समेटता है; यह हिन्दी अभिव्यक्ति व्यापक और स्वाभाविक है।
- source_word: עַד הַיּוֹם מוּסַד בֵּית יְהוָה וְעַד כְּלֹתוֹ
  choice: याहवे के भवन की नींव डाले जाने के दिन से लेकर उसके पूरा होने तक
  rationale: हिन्दी में आरंभ से अंत तक की समयावधि स्पष्ट करने के लिए ‘से लेकर…तक’ रखा गया है। כְּלֹתוֹ के पुरुषवाचक प्रत्यय का निकटतम संदर्भ भवन है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ इब्रानी ‘घर’ के रूपक को बनाए रखते हुए मन्दिर के संदर्भ में गरिमापूर्ण और समझने योग्य है।
- source_word: שָׁלֵם בֵּית יְהוָה
  choice: याहवे का भवन पूरा हो गया
  rationale: שָׁלֵם यहाँ भवन की पूर्ण अवस्था बताता है; ‘पूरा हो गया’ स्वाभाविक हिन्दी में इस परिणाम को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וַתִּכֹּן की परिणामात्मक अस्पष्टता
  choice: ठीक रीति से संपन्न हुआ
  alternative: तैयार किया गया; व्यवस्थित किया गया; स्थापित हुआ
  rationale: क्रिया तैयार/स्थापित/व्यवस्थित किए जाने का अर्थ दे सकती है। मुख्य पाठ प्रसंगानुकूल स्वाभाविक अर्थ देता है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘मन्दिर’ के बजाय स्रोत के ‘भवन’ को रखा गया है। समयावधि को स्वाभाविक हिन्दी के ‘से लेकर…तक’ ढाँचे में व्यक्त किया गया है।
