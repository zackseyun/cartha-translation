source:
  edition: WLC
  text: וְ/אֶת בַּת פַּרְעֹ֗ה הֶעֱלָ֤ה שְׁלֹמֹה֙ מֵ/עִ֣יר דָּוִ֔יד לַ/בַּ֖יִת אֲשֶׁ֣ר בָּֽנָה לָ֑/הּ כִּ֣י אָמַ֗ר לֹא תֵשֵׁ֨ב אִשָּׁ֥ה לִ/י֙ בְּ/בֵית֙ דָּוִ֣יד מֶֽלֶךְ יִשְׂרָאֵ֔ל כִּי קֹ֣דֶשׁ הֵ֔מָּה אֲשֶׁר בָּֽאָ֥ה אֲלֵי/הֶ֖ם אֲר֥וֹן יְהוָֽה־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/011.yaml
  text: And Solomon brought Pharaoh’s daughter up from the city of David to the house that he had built for her[a], for he said, “My wife shall not live in the house of David king of Israel, because the places to which the ark of Yahweh has come are holy.”
translation:
  language: hi
  text: और सुलैमान फ़िरौन की बेटी को दाऊद के नगर से ऊपर उस भवन में ले गया जिसे उसने उसके लिए बनाया था। उसने कहा, “मेरी पत्नी इस्राएल के राजा दाऊद के भवन में नहीं रहेगी, क्योंकि जिन स्थानों तक यहोवा का सन्दूक पहुँचा है, वे पवित्र हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעֱלָה
  choice: ऊपर ... ले आया
  rationale: हिफ़ील रूप में ‘ऊपर ले जाना/लाना’ का दिशात्मक भाव है; हिन्दी में यह अभिव्यक्ति स्वाभाविक रूप से उसे बनाए रखती है।
- source_word: מֵעִיר דָּוִיד
  choice: दाऊदपुर से
  rationale: ‘दाऊदपुर’ हिन्दी बाइबल परंपरा में ‘दाऊद का नगर’ के लिए संक्षिप्त और सुबोध स्थाननाम है।
- source_word: לַבַּיִת אֲשֶׁר בָּנָה לָהּ
  choice: उस भवन में ... जिसे उसने उसके लिए बनवाया था
  rationale: בַּיִת का मूल अर्थ घर/भवन है; राजकीय संदर्भ में ‘भवन’ स्वाभाविक है। ‘बनवाया’ राजा द्वारा निर्माण कराने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא תֵשֵׁב אִשָּׁה לִי
  choice: मेरी पत्नी ... नहीं रहेगी
  rationale: संदर्भ में אִשָּׁה ‘पत्नी’ है और ישׁב यहाँ निवास करने को सूचित करता है। ‘मेरी पत्नी’ אִשָּׁה לִי का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: קֹדֶשׁ הֵמָּה
  choice: वे पवित्र हैं
  rationale: इब्रानी बहुवचन सर्वनाम और पवित्रता की स्पष्ट विधेयात्मक भाषा दोनों सुरक्षित रखी गई हैं।
- source_word: אֲשֶׁר בָּאָה אֲלֵיהֶם אֲרוֹן יְהוָה
  choice: जिन स्थानों में यहोवा का सन्दूक आया है
  rationale: बहुवचन הֵמָּה और אֲלֵיהֶם के निहित बहुवचन संदर्भ को ‘स्थान’ से स्पष्ट किया गया है। יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
theological_decisions:
- issue: पवित्रता के कारण में निहित बहुवचन संदर्भ
  choice: बहुवचन सर्वनाम का संदर्भ ‘जिन स्थानों में’ कहकर स्पष्ट किया गया।
  alternative: इसे केवल ‘क्योंकि वे पवित्र हैं, जिनमें...’ या पूरे दाऊद के भवन के सामान्य उल्लेख के रूप में रखा जा सकता था।
  rationale: मूल में ‘वे’ और ‘उनमें’ दोनों बहुवचन हैं, पर उनका संज्ञात्मक संदर्भ लुप्त है। ‘स्थान’ जोड़ना व्याकरण स्पष्ट करता है, जबकि दाऊद के पूरे वंश या भवन के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: אִשָּׁה का अर्थ
  choice: पत्नी
  alternative: स्त्री
  rationale: वक्ता फ़िरौन की बेटी और अपने वैवाहिक निवास की बात कर रहा है; इसलिए ‘पत्नी’ संदर्भानुकूल है और सभी स्त्रियों पर व्यापक निषेध का अर्थ उत्पन्न नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘भवन’ राजकीय निवास के संदर्भ में स्वाभाविक है; ‘सन्दूक’ वाचा के पवित्र सन्दूक के लिए परिचित बाइबलीय पद है। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि निहित बहुवचन को मुख्य पाठ में स्पष्ट किया गया है।
