lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाए
  rationale: בנה के वय्यिक्तोल रूप से क्रम में घटित भूतकालीन कार्य व्यक्त होता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: תַּדְמֹר
  choice: तदमोर
  rationale: स्थान-नाम को बाद के यूनानी-लातीनी नाम से बदलने के बजाय मूल रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר उजाड़ या कम आबादी वाले वन्य/मरु क्षेत्र को सूचित कर सकता है; ‘निर्जन प्रदेश’ केवल रेतीले मरुस्थल का अर्थ थोपे बिना इस व्यापकता को रखता है।
- source_word: כָּל עָרֵי הַמִּסְכְּנוֹת
  choice: वे सभी भंडार-नगर
  rationale: यह पदबंध सामग्री और रसद के भंडारण के काम आने वाले नगरों को सूचित करता है; ‘भंडार-नगर’ संक्षिप्त और स्पष्ट आधुनिक हिन्दी है।
- source_word: אֲשֶׁר בָּנָה
  choice: जिन्हें उसने बनवाया था
  rationale: सम्बन्धवाचक उपवाक्य भंडार-नगरों की ओर संकेत करता है। राजकीय निर्माण के प्रसंग में ‘बनवाया’ स्वाभाविक हिन्दी है, जबकि कर्ता की जिम्मेदारी बनी रहती है।
- source_word: בַּחֲמָת
  choice: हमात में
  rationale: ב का सामान्य स्थानीय अर्थ ‘में’ है; इससे हमात नगर अथवा उसके अधीन क्षेत्र की सटीक सीमा अनावश्यक रूप से तय नहीं होती।
