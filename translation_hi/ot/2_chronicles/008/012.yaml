base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/012.yaml
  text: Then Solomon offered up burnt offerings to Yahweh on the altar of Yahweh that he had built before the vestibule[a].
translation:
  language: hi
  text: तब सुलैमान ने यहवे के लिए होमबलियाँ यहवे की उस वेदी पर चढ़ाईं, जिसे उसने मंदिर के प्रवेश-मंडप[a] के सामने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बरामदे” अथवा “ड्योढ़ी”; इब्रानी शब्द मंदिर के प्रवेश-भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह काल-सूचक कथन को अगली घटना से जोड़ता है और स्वाभाविक हिंदी में कथा-क्रम बनाए रखता है।
- source_word: הֶעֱלָה
  choice: चढ़ाईं
  rationale: हिफ़ील रूप यहाँ बलि को वेदी पर अर्पित करने के अर्थ में है; ‘चढ़ाईं’ हिंदी के बलिदानी संदर्भ में स्वाभाविक है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: हिंदी बाइबल परंपरा में इस नाम का प्रचलित रूप।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: पूरी तरह वेदी पर जलाई जाने वाली बलियों के लिए प्रचलित और अर्थ-सटीक हिंदी पद।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: ל समर्पण या उद्देश्य दर्शाता है; ‘के लिए’ बलियों के यहवे को समर्पित होने का भाव स्पष्ट करता है।
- source_word: עַל מִזְבַּח יְהוָה
  choice: यहवे की उस वेदी पर
  rationale: स्थान-संबंध और संबंधवाचक संरचना दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אֲשֶׁר בָּנָה
  choice: जिसे उसने ... बनाया था
  rationale: संबंधवाचक उपवाक्य वेदी की पहचान करता है; ‘बनाया था’ मुख्य क्रिया से पहले की घटना दर्शाता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यहाँ स्थानवाचक अर्थ है और आधुनिक हिंदी में ‘के सामने’ अधिक स्पष्ट है।
- source_word: הָאוּלָם
  choice: मंदिर के प्रवेश-मंडप
  rationale: אוּלָם मंदिर के मुख्य भवन के आगे स्थित प्रवेश-भाग को दर्शाता है; संदर्भगत ‘मंदिर के’ जोड़ने से सामान्य पाठक के लिए आशय स्पष्ट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूपांतरण
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम יהוה दो बार है। ‘यहवे’ उस वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। बलिदानी शब्दावली में प्रचलित ‘होमबलियाँ’ रखा गया है और स्थापत्य पद को पाद-टिप्पणी में विकल्पों सहित स्पष्ट किया गया है।
