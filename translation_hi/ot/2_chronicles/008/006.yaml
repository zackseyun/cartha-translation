base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/006.yaml
  text: and Baalath[a], and all the storage cities that belonged to Solomon, and all the chariot cities, and the cities of the horsemen[c][b], and all that Solomon desired to build in Jerusalem and in Lebanon and throughout all the land of his dominion.
translation:
  language: hi
  text: और बालात, और सुलैमान के सभी भंडार-नगर[a], और रथों के सभी नगर, और घुड़सवारों के नगर[b], और वह सब कुछ जिसे सुलैमान यरूशलेम, लबानोन और अपने शासन के पूरे प्रदेश में बनाना चाहता था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “सामग्री रखने के नगर,” “रसद-नगर” या संभवतः “कोष-नगर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “घोड़ों के नगर” भी हो सकता है; पर हिब्रू शब्द अधिकतर घुड़सवारों या अश्वारोही दल को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शब्दशः, “सुलैमान की सारी इच्छा, जिसकी उसने इच्छा की कि बनाए।” एक ही मूल के शब्दों की पुनरुक्ति सुलैमान की इच्छा या प्रसन्नता पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלָת
  choice: बालात
  rationale: यह स्थान का नाम है; इसे अर्थानुवाद करने के बजाय आधुनिक हिन्दी में निकट ध्वन्यात्मक रूप से लिप्यंतरित किया गया है।
- source_word: עָרֵי הַמִּסְכְּנוֹת
  choice: भंडार-नगर
  rationale: यह पद सामग्री, रसद या उपज संचित करने वाले नगरों को सूचित करता है। ‘भंडार-नगर’ संक्षिप्त, स्वाभाविक और अर्थ की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר הָיוּ לִשְׁלֹמֹה
  choice: सुलैमान के
  rationale: हिब्रू स्वामित्व-संबंध को हिन्दी में सहज और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: עָרֵי הָרֶכֶב
  choice: रथों के नगर
  rationale: रथों अथवा रथ-दल से संबद्ध प्रशासनिक या सैन्य नगरों का निकट और स्पष्ट अनुवाद।
- source_word: עָרֵי הַפָּרָשִׁים
  choice: घुड़सवारों के नगर
  rationale: פָּרָשִׁים सामान्यतः घोड़ों के बजाय घुड़सवारों को दर्शाता है; यह चुनाव उस शब्दगत भेद को सुरक्षित रखता है।
- source_word: כָּל חֵשֶׁק שְׁלֹמֹה אֲשֶׁר חָשַׁק
  choice: वह सब कुछ जिसे सुलैमान ... अपनी इच्छा के अनुसार ... चाहता था
  rationale: मूल में एक ही धातु से बने संज्ञा और क्रिया की पुनरुक्ति इच्छा या प्रसन्नता पर बल देती है। हिन्दी में ‘अपनी इच्छा के अनुसार’ और ‘चाहता था’ उस बल को अपेक्षाकृत स्वाभाविक ढंग से बनाए रखते हैं।
- source_word: לִבְנוֹת
  choice: बनवाना
  rationale: राजकीय निर्माण-कार्य के संदर्भ में सुलैमान स्वयं श्रमिक नहीं, निर्माण कराने वाला है; हिन्दी में ‘बनवाना’ आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल क्रिया का अर्थ ‘बनाना/निर्माण करना’ है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रयोग में सुविख्यात मानक रूप।
- source_word: וּבַלְּבָנוֹן
  choice: लबानोन
  rationale: भौगोलिक नाम का हिन्दी में स्पष्ट लिप्यंतरण।
- source_word: בְכֹל אֶרֶץ מֶמְשַׁלְתּוֹ
  choice: अपने शासन के पूरे प्रदेश में
  rationale: यह रूप भूमि/प्रदेश और सुलैमान के शासनाधिकार—दोनों भावों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
