translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘समुद्र का काम जाननेवाले’ समुद्री विशेषज्ञता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सेवक’ मूल सामाजिक पद को बनाए रखता है। प्राचीन माप ‘किक्कार’ को अनिश्चित आधुनिक भार में परिवर्तित नहीं किया गया।
