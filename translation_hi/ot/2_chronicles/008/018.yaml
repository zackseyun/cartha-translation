  text: וַ/יִּֽשְׁלַֽח ל/וֹ֩ חוּרָ֨ם בְּ/יַד עֲבָדָ֜י/ו אוניות וַ/עֲבָדִים֮ י֣וֹדְעֵי יָם֒ וַ/יָּבֹ֜אוּ עִם עַבְדֵ֤י שְׁלֹמֹה֙ אוֹפִ֔ירָ/ה וַ/יִּקְח֣וּ מִ/שָּׁ֔ם אַרְבַּע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים כִּכַּ֣ר זָהָ֑ב וַ/יָּבִ֖יאוּ אֶל הַ/מֶּ֥לֶךְ שְׁלֹמֹֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/018.yaml
  text: And Huram sent him[a], by the hand of his servants, ships and servants who knew the sea. They went with Solomon’s servants to Ophir, took from there four hundred and fifty talents of gold[c][b], and brought them to King Solomon.
translation:
  language: hi
  text: हूराम ने अपने सेवकों के द्वारा[a] उसके पास जहाज़ और समुद्री काम में निपुण सेवक[b] भेजे। वे सुलैमान के सेवकों के साथ ओपीर गए और वहाँ से सोने के चार सौ पचास किक्कार[c] लेकर राजा सुलैमान के पास ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अपने सेवकों के हाथ से”; यह उनके माध्यम से काम किए जाने का मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या “समुद्र का अनुभव रखनेवाले सेवक” अथवा “नाविक सेवक।” इब्रानी में शाब्दिक रूप से “समुद्र को जाननेवाले सेवक” है।
    reason: lexical_alternative
  - marker: c
    text: “किक्कार” प्राचीन भार की एक बड़ी इकाई थी; उसके ठीक आधुनिक मान के विषय में अनिश्चितता है।
    reason: historical_measure
lexical_decisions:
- source_word: וַיִּשְׁלַח לֹו חוּרָם
  choice: हूराम ने ... उसके पास ... भेजे
  rationale: לֹו का प्राप्तकर्ता-सूचक अर्थ ‘उसके पास’ से स्पष्ट किया गया है; कथात्मक וַיִּשְׁלַח के लिए स्वाभाविक ‘भेजे’ रखा गया है।
- source_word: בְּיַד עֲבָדָיו
  choice: अपने सेवकों के द्वारा
  rationale: शाब्दिक ‘अपने सेवकों के हाथ से’ हिन्दी में अस्वाभाविक हो सकता है; यहाँ בְּיַד माध्यम अथवा अभिकरण का मुहावरा है, इसलिए अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אֳנִיּוֹת
  choice: जहाज़
  rationale: ओपीर तक समुद्री अभियान के संदर्भ में बड़े समुद्री जलयानों के लिए ‘जहाज़’ उपयुक्त है।
- source_word: וַעֲבָדִים יֹדְעֵי יָם
  choice: समुद्र का काम जाननेवाले सेवक
  rationale: ‘सेवक’ और उनके समुद्री अनुभव—दोनों को बनाए रखता है; केवल ‘नाविक’ कहने से עֲבָדִים का सामाजिक संबंध छूट जाता।
- source_word: אוֹפִירָה
  choice: ओपीर गए
  rationale: स्थानवाचक ה दिशागमन बताता है; हिन्दी में ‘ओपीर गए’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: אַרְבַּע מֵאוֹת וַחֲמִשִּׁים כִּכַּר זָהָב
  choice: साढ़े चार सौ किक्कार सोना
  rationale: प्राचीन भार-माप כִּכָּר को आधुनिक इकाई में अनिश्चित रूप से बदलने के बजाय पारंपरिक लिप्यंतरण ‘किक्कार’ रखा गया है।
- source_word: וַיָּבִיאוּ אֶל הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के पास ले आए
  rationale: बहुवचन क्रिया का कर्ता अभियान में गए लोग हैं और निहित कर्म सोना है; हिन्दी में ‘ले आए’ इस गति और परिणाम को संक्षेप में व्यक्त करता है।
