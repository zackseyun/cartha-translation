  yaml_path: translation/ot/2_chronicles/008/010.yaml
  text: 'These were the chiefs of King Solomon’s deputies: two hundred and fifty[b][a], who ruled over the people.'
translation:
  language: hi
  text: 'राजा सुलैमान के नियुक्त अधिकारियों के प्रधान ये थे: ढाई सौ, जो लोगों पर अधिकार रखते थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये थे
  rationale: यह पद ऐतिहासिक वर्णन में अधिकारियों की पहचान कराता है; हिन्दी में भूतकाल का यह रूप स्वाभाविक है।
- source_word: שָׂרֵי הַנְּצִיבִים
  choice: नियुक्त अधिकारियों के प्रधान
  rationale: שָׂרֵי पद और नेतृत्व को दर्शाता है, जबकि נְצִיבִים राजकीय अधिकार के अधीन नियुक्त पदाधिकारियों को; यह अनुवाद सैनिक अर्थ को अनावश्यक रूप से नहीं थोपता।
- source_word: אֲשֶׁר לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के
  rationale: यह वाक्यांश राजा के साथ संबंध अथवा अधीनता व्यक्त करता है; हिन्दी संबंधकारक इसे संक्षिप्त और स्वाभाविक रूप से देता है।
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: ढाई सौ
  rationale: यह 250 का सहज और प्रचलित आधुनिक हिन्दी रूप है।
- source_word: הָרֹדִים בָּעָם
  choice: जो लोगों पर अधिकार रखते थे
  rationale: רדה अधिकार या शासन चलाने का भाव देता है। प्रशासनिक प्रसंग में यह शब्दावली कठोर दमन का अनावश्यक संकेत दिए बिना मूल अर्थ बनाए रखती है।
