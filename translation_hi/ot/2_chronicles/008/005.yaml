  text: And he built Upper Beth-horon and Lower Beth-horon[a], fortified cities with walls, doors[c][b], and bars.
translation:
  language: hi
  text: उसने ऊपरी बेथ-होरोन और निचले बेथ-होरोन को शहरपनाहों, किवाड़ों[a] और अर्गलों[b] से युक्त गढ़वाले नगरों के रूप में बनाया।
  philosophy: optimal-equivalence
  footnotes:
