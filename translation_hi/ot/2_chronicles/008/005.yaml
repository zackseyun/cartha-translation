    text: मूल भाषा में ‘दरवाज़े’ या ‘किवाड़’; आशय संभवतः इन गढ़वाले नगरों के फाटकों के किवाड़ों से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सांकलों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाया
  rationale: בנה का सामान्य अर्थ ‘बनाना’ है; पद स्वयं यह अनिवार्य नहीं करता कि यहाँ ‘फिर से बनाया’ कहा जाए। हिंदी वाक्य में नगरों के निर्माण और किलेबंदी को स्वाभाविक ढंग से एक साथ व्यक्त किया गया है।
- source_word: בֵּית חוֹרוֹן הָעֶלְיוֹן
  choice: ऊपरी बेथ-होरोन
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और ऊँचाई के भेद को बताने वाले विशेषण को स्वाभाविक हिंदी में ‘ऊपरी’ रखा गया है।
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: निचला बेथ-होरोन
  rationale: पहले स्थान-नाम के समानांतर, भौगोलिक ऊँचाई का भेद ‘निचला’ से स्पष्ट किया गया है। मुख्य पाठ में विभक्ति के कारण ‘निचले’ रूप आया है।
- source_word: עָרֵי מָצוֹר
  choice: सुरक्षित नगर
  rationale: इस पद में आगे दी गई शहरपनाह, किवाड़ और बेड़ों की सूची सैन्य किलेबंदी स्पष्ट करती है। ‘सुरक्षित नगर’ साधारण आधुनिक हिंदी में अर्थ संप्रेषित करता है, जबकि संरचना को क्रियात्मक रूप में रखा गया है।
- source_word: חוֹמוֹת
  choice: शहरपनाहों
  rationale: नगरों को घेरने वाली रक्षात्मक दीवारों के लिए ‘शहरपनाह’ सटीक और गरिमापूर्ण हिंदी शब्द है।
- source_word: דְּלָתַיִם
  choice: फाटकों के किवाड़ों
  rationale: मूल शब्द का अर्थ ‘दरवाज़े/किवाड़’ है, सामान्य ‘फाटक’ शब्द नहीं। नगर की किलेबंदी के प्रसंग में आशय फाटकों पर लगे किवाड़ों से है; यह अनुवाद शब्दार्थ और प्रसंग दोनों को बचाता है।
- source_word: וּבְרִיחַ
  choice: और बेड़ों
  rationale: בריח उन आड़े सरियों या बेड़ों को दर्शाता है जिनसे किवाड़ बंद किए जाते थे। ‘बेड़ा’ रक्षात्मक द्वार के प्रसंग में ‘सिटकनी’ की अपेक्षा अधिक उपयुक्त है।
