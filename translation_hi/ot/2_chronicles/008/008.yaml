base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/008.yaml
  text: From their descendants who were left after them in the land—those whom the sons of Israel had not destroyed—Solomon conscripted them for forced labor[b][a], to this day.
translation:
  language: hi
  text: उनके वंशजों में से, जो उनके बाद उस देश में रह गए थे—जिन्हें इस्राएलियों ने नष्ट नहीं किया था—सुलैमान ने उन्हें बेगार के काम में लगाया; यह व्यवस्था आज तक चली आ रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן בְּנֵיהֶם
  choice: उनके वंशजों में से
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ जातीय और पीढ़ीगत संदर्भ में ‘वंशज’ व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר נוֹתְרוּ אַחֲרֵיהֶם
  choice: जो उनके बाद ... रह गए थे
  rationale: נוֹתְרוּ बचे या शेष रह जाने का भाव देता है और אַחֲרֵיהֶם पूर्ववर्ती पीढ़ी के बाद बने रहने का समय-संबंध व्यक्त करता है।
- source_word: בָּאָרֶץ
  choice: उस देश में
  rationale: निर्दिष्ट भूमि का संकेत बनाए रखते हुए आधुनिक हिन्दी में ‘उस देश में’ प्रसंगानुकूल और सहज है।
- source_word: אֲשֶׁר לֹא כִלּוּם בְּנֵי יִשְׂרָאֵל
  choice: जिनका इस्राएलियों ने पूरी तरह नाश नहीं किया था
  rationale: Piel रूप כִלּוּם यहाँ समाप्त कर देने या नष्ट कर देने का अर्थ रखता है; ‘पूरी तरह नाश’ क्रिया की पूर्णता का बल भी बनाए रखता है। בְּנֵי יִשְׂרָאֵל मानक राष्ट्रीय पदनाम है, इसलिए हिन्दी में स्वाभाविक ‘इस्राएलियों’ चुना गया है।
- source_word: וַיַּעֲלֵם ... לְמַס
  choice: उन्हें ... बेगार में लगा दिया
  rationale: עלה का causative रूप לְמַס के साथ किसी पर राजकीय श्रम-भार लगाने का मुहावरेदार अर्थ देता है।
- source_word: לְמַס
  choice: बेगार
  rationale: מַס यहाँ अनिवार्य राजकीय श्रम या श्रम-कर को दर्शाता है। ‘बेगार’ आधुनिक हिन्दी में बिना स्वेच्छा के कराए जाने वाले श्रम का संक्षिप्त और सटीक शब्द है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह लेखक के वर्तमान समय तक स्थिति जारी रहने का मानक इब्रानी मुहावरा है।
