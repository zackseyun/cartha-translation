    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעָם
  choice: वे सभी लोग
  rationale: यह पदबंध यहाँ शेष बची गैर-इस्राएली जनसंख्या की समग्रता को दर्शाता है। ‘सभी लोग’ आधुनिक हिन्दी में स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: הַנּוֹתָר
  choice: बचे हुए
  rationale: निफ़अल कृदंत उन लोगों को सूचित करता है जो पहले की घटनाओं के बाद शेष रह गए थे; ‘बचे हुए’ इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן
  choice: में से
  rationale: सूचीबद्ध जातियों से संबंध या उद्गम को व्यक्त करने के लिए हिन्दी में ‘में से’ सबसे स्वाभाविक है।
- source_word: הַחִתִּי וְהָאֱמֹרִי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: हित्तियों, एमोरियों, परिज्जियों, हिव्वियों और यबूसियों
  rationale: इब्रानी के एकवचन जातिनाम यहाँ सामूहिक अर्थ में हैं, इसलिए हिन्दी में इनके बहुवचन रूप प्रयुक्त किए गए हैं। ये प्रचलित हिन्दी लिप्यंतरण हैं।
- source_word: אֲשֶׁר לֹא מִיִּשְׂרָאֵל הֵמָּה
  choice: जो इस्राएल में से नहीं थे
  rationale: यह अनुवाद מִן की संरचना को बनाए रखता है और मूल की अपेक्षाकृत शाब्दिक, किंचित असामान्य अभिव्यक्ति को सुरक्षित रखता है; आशय यह है कि वे इस्राएली नहीं थे।
