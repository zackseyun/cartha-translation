  rationale: दोनों नाम यहाँ संयुक्त स्थान-नाम के रूप में प्रयुक्त हैं; योजक-चिह्न हिंदी में इस संरचना को स्पष्ट और सहज रखता है।
- source_word: וַיֶּחֱזַק עָלֶיהָ
  choice: उस पर अधिकार कर लिया
  rationale: חזק על का भाव किसी पर प्रबल होकर नियंत्रण स्थापित करना है। राजकीय-सैन्य प्रसंग में यह हिंदी अभिव्यक्ति परिणाम को स्वाभाविक ढंग से बताती है, बिना ‘नष्ट किया’ जैसे अतिरिक्त अर्थ जोड़े।
