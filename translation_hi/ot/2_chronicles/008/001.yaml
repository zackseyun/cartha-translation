base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/001.yaml
  text: And it happened at the end of twenty years[a], during which Solomon had built the house of Yahweh and his own house,
translation:
  language: hi
  text: बीस वर्ष पूरे होने पर, जिनके दौरान सुलैमान ने याहवे का भवन और अपना भवन[a] निर्माण किया था, ऐसा हुआ कि
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना राजमहल।” इब्रानी में शाब्दिक रूप से “अपना भवन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: पूरे होने पर
  rationale: कथा के अगले घटनाक्रम की ओर बढ़ते हुए बीस वर्ष की अवधि समाप्त होने का भाव स्वाभाविक हिंदी में व्यक्त करता है। अलग से ‘और ऐसा हुआ’ कहना इस आश्रित वाक्यांश में अनावश्यक रूप से भारी होता।
- source_word: עֶשְׂרִים שָׁנָה אֲשֶׁר
  choice: बीस वर्ष ... जिनके दौरान
  rationale: सापेक्ष पद אֲשֶׁר को बीस वर्षों की अवधि से जोड़ता है और निर्माण-कार्य उसी अवधि में होने का संबंध बनाए रखता है।
- source_word: בָּנָה
  choice: बनवाया था
  rationale: राजा सुलैमान के संरक्षण और निर्देशन में निर्माण होने के भाव को हिंदी में स्वाभाविक रूप से व्यक्त करता है; ‘था’ बताता है कि यह कार्य उस अवधि के अंत तक पूरा हो चुका था।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ सुरक्षित रहता है और यְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בֵּיתוֹ
  choice: अपना भवन
  rationale: प्रत्यय सुलैमान के स्वामित्व को दर्शाता है और ‘अपना’ यहोवा के भवन के साथ विरोध को स्पष्ट करता है; मूल शब्द अपने आप ‘राजमहल’ को निर्दिष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के चार-अक्षरी व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से रखा गया है।
- issue: בֵּיתוֹ में भवन का प्रकार
  choice: अपना भवन
  alternative: अपना राजमहल
  rationale: संदर्भ में राजमहल संभव है, पर इब्रानी पाठ केवल ‘उसका भवन/घर’ कहता है; इसलिए मुख्य पाठ में व्याख्यात्मक विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। पद अगले पद में जारी रहने वाला आश्रित वाक्य है, इसलिए अंत में अल्पविराम रखा गया है।
