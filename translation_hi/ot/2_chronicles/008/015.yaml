  yaml_path: translation/ot/2_chronicles/008/015.yaml
  text: And they did not turn aside from the king’s command concerning the priests and the Levites in any matter[a], or concerning the treasuries.
translation:
  language: hi
  text: और वे याजकों और लेवियों के विषय में राजा की आज्ञा से किसी भी बात में, और कोषागारों के विषय में भी, नहीं हटे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סָרוּ
  choice: नहीं हटे
  rationale: סור का अर्थ मुड़ना, हटना या विचलित होना है। नकार के साथ “आज्ञा से नहीं हटे” हिब्रू मुहावरे को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा
  rationale: מִצְוָה यहाँ धार्मिक पारिभाषिक अर्थ तक सीमित नहीं, बल्कि प्रशासनिक आदेश के अर्थ में है; “आज्ञा” दोनों पहलुओं को समेटती है।
- source_word: עַל הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों के विषय में
  rationale: עַל यहाँ अधिकार जताने के बजाय आज्ञा के विषय या क्षेत्र को दर्शाता है। दोनों अलग समूहों को स्पष्ट रूप से बनाए रखा गया है।
- source_word: לְכָל דָּבָר
  choice: किसी भी काम में
  rationale: नकारात्मक वाक्य में यह वाक्यांश “किसी भी बात/काम में” के अर्थ में स्वाभाविक है; मन्दिर-सेवा के संदर्भ में “काम” उपयुक्त है।
- source_word: וְלָאֹצָרוֹת
  choice: या कोषागारों के संबंध में
  rationale: אֹצָרוֹת धन-संपत्ति रखने के कोषागारों अथवा सामान्य भंडारगृहों को सूचित कर सकता है। मन्दिर के प्रशासनिक संदर्भ में “कोषागार” अधिक उपयुक्त है। नकारात्मक हिन्दी वाक्य में संयोजक וְ को “या” कहना दोनों क्षेत्रों में तनिक भी विचलन न होने का अर्थ स्वाभाविक ढंग से देता है।
