source:
  edition: WLC
  text: וּ/מִן בְּנֵי֙ יִשְׂרָאֵ֔ל אֲ֠שֶׁר לֹא נָתַ֧ן שְׁלֹמֹ֛ה לַ/עֲבָדִ֖ים לִ/מְלַאכְתּ֑/וֹ כִּי הֵ֜מָּה אַנְשֵׁ֤י מִלְחָמָה֙ וְ/שָׂרֵ֣י שָׁלִישָׁ֔י/ו וְ/שָׂרֵ֥י רִכְבּ֖/וֹ וּ/פָרָשָֽׁי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/009.yaml
  text: But from the sons of Israel Solomon did not make servants for his work[a], for they were men of war, and his officers[c][b], and the commanders of his chariots and his horsemen.
translation:
  language: hi
  text: परन्तु इस्राएल के पुत्रों में से किसी को भी सुलैमान ने अपने काम के लिए दास नहीं बनाया[a], क्योंकि वे योद्धा, उसके सैन्य अधिकारी[b], उसके रथों के सेनापति और उसके घुड़सवार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने काम के लिए दास-श्रम में नहीं लगाया।”
    reason: हिब्रू अभिव्यक्ति किसी को दास बनाकर श्रम में लगाने का भाव रखती है।
  - marker: b
    text: यहाँ प्रयुक्त हिब्रू पद सम्भवतः विशिष्ट सैन्य अधिकारियों या सहायकों को सूचित करता है; इसका ठीक पदनाम अनिश्चित है।
    reason: שָׁלִישׁ के विशिष्ट सैन्य अर्थ को लेकर शाब्दिक अनिश्चितता बनाए रखना आवश्यक है।
lexical_decisions:
- source_word: וּמִן בְּנֵי יִשְׂרָאֵל
  choice: परन्तु इस्राएल के पुत्रों में से किसी को भी
  rationale: וּמִן पिछले पद के विपरीत स्थिति को जोड़ता है; ‘परन्तु’ इस विरोध को व्यक्त करता है। ‘इस्राएल के पुत्र’ हिब्रू जातीय अभिव्यक्ति को सुरक्षित रखता है, और निषेध के साथ ‘किसी को भी’ स्वाभाविक हिन्दी में समूह में से एक भी व्यक्ति न चुने जाने का अर्थ स्पष्ट करता है।
- source_word: לֹא נָתַן שְׁלֹמֹה לַעֲבָדִים לִמְלַאכְתּוֹ
  choice: सुलैमान ने अपने काम के लिए दास नहीं बनाया
  rationale: ‘दास बनाया’ किसी को दास की स्थिति अथवा दास-श्रम में लगाने की इस रचना की शक्ति को ‘सेवक बनाया’ की अपेक्षा अधिक ठीक व्यक्त करता है। מְלָאכָה के लिए ‘काम’ सहज और पर्याप्त व्यापक है।
- source_word: כִּי הֵמָּה אַנְשֵׁי מִלְחָמָה
  choice: क्योंकि वे योद्धा ... थे
  rationale: כִּי कारण प्रस्तुत करता है। ‘योद्धा’ आधुनिक हिन्दी में ‘युद्ध के पुरुष’ से अधिक स्वाभाविक है और सैन्य भूमिका स्पष्ट रखता है।
- source_word: שָׂרֵי שָׁלִישָׁיו
  choice: उसके सैन्य अधिकारी
  rationale: שָׁלִישׁ एक कठिन सैन्य-पदसूचक शब्द है, जो विशिष्ट अधिकारी या सहायक को सूचित कर सकता है। ‘सैन्य अधिकारी’ प्रसंग स्पष्ट करता है, पर ‘कप्तान’ जैसी अनिश्चित विशिष्ट पदवी आरोपित नहीं करता।
- source_word: שָׂרֵי רִכְבּוֹ
  choice: उसके रथों के सेनापति
  rationale: यह रथ-दल पर अधिकार रखने वाले पदाधिकारियों को सूचित करता है; ‘सेनापति’ शासन अथवा कमान का भाव स्पष्ट करता है।
- source_word: וּפָרָשָׁיו
  choice: घुड़सवार
  rationale: פָרָשִׁים का सामान्य सैन्य अर्थ घुड़सवार सैनिक है; सूची में ‘घुड़सवार’ संक्षिप्त और स्वाभाविक है।
