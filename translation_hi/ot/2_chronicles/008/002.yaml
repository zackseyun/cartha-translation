  text: As for the cities that Huram had given to Solomon[c][b][a], Solomon rebuilt them and settled the people of Israel there.
translation:
  language: hi
  text: और हूराम ने सुलैमान को जो नगर दिए थे, सुलैमान ने उन्हें फिर से बनाया[a] और वहाँ इस्राएलियों को बसाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बनाया।” हिब्रू क्रिया का मूल अर्थ “बनाना” है; इस प्रसंग में उसका आशय “फिर से बनाना” या “पुनर्स्थापित करना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  choice: और जो नगर
  rationale: वाव को ‘और’ से व्यक्त करते हुए सापेक्ष उपवाक्य के साथ स्वाभाविक हिन्दी वाक्य-विन्यास रखा गया है।
- source_word: נָתַן חוּרָם לִשְׁלֹמֹה
  choice: हूराम ने सुलैमान को दिए थे
  rationale: हिब्रू पूर्ण क्रिया यहाँ बाद में हुए निर्माण से पहले की घटना बताती है; ‘दिए थे’ उस पूर्वकालिक संबंध को स्पष्ट करता है। חוּרָם का स्रोत-पाठानुसार लिप्यंतरण ‘हूराम’ है।
- source_word: בָּנָה
  choice: फिर से बनवाया
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है, पर दिए जा चुके नगरों के संदर्भ में पुनर्निर्माण अथवा पुनर्स्थापन अभिप्रेत हो सकता है। सुलैमान जैसे राजा के विषय में हिन्दी का प्रेरणार्थक ‘बनवाया’ स्वाभाविक है।
- source_word: וַיּוֹשֶׁב
  choice: बसाया
  rationale: ישׁב का हिफ़ील रूप कारणवाचक है—किसी को वहाँ रहने के लिए बसाना।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों को
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, किन्तु इस प्रसंग में यह समुदाय के लोगों का सामान्य जातिवाचक पद है; ‘इस्राएली’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
