  text: וַ/יַּעֲמֵ֣ד כְּ/מִשְׁפַּ֣ט דָּֽוִיד אָ֠בִי/ו אֶת מַחְלְק֨וֹת הַ/כֹּהֲנִ֜ים עַל עֲבֹדָתָ֗/ם וְ/הַ/לְוִיִּ֣ם עַל מִ֠שְׁמְרוֹתָ/ם לְ/הַלֵּ֨ל וּ/לְ/שָׁרֵ֜ת נֶ֤גֶד הַ/כֹּֽהֲנִים֙ לִ/דְבַר י֣וֹם בְּ/יוֹמ֔/וֹ וְ/הַ/שּׁוֹעֲרִ֥ים בְּ/מַחְלְקוֹתָ֖/ם לְ/שַׁ֣עַר וָ/שָׁ֑עַר כִּ֣י כֵ֔ן מִצְוַ֖ת דָּוִ֥יד אִישׁ הָ/אֱלֹהִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/014.yaml
  text: And according to the ordinance of David his father[a], he appointed the divisions of the priests for their service, and the Levites for their duties, to praise and to minister before the priests, as each day required, and the gatekeepers in their divisions for each gate; for so was the commandment of David[b], the man of God.
translation:
  language: hi
  text: उसने अपने पिता दाऊद[a] के विधान के अनुसार याजकों के दलों को उनकी सेवा के लिए, लेवियों को उनके कर्तव्यों के लिए—कि वे स्तुति करें और याजकों के सामने सेवा करें, हर दिन की निर्धारित आवश्यकता के अनुसार[b]—और द्वारपालों को उनके दलों में, एक-एक द्वार के लिए, नियुक्त किया; क्योंकि परमेश्वर के जन दाऊद की ऐसी ही आज्ञा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “पिता” का अर्थ “पूर्वज” भी हो सकता है; इब्रानी में किसी राजवंशीय पूर्वज के लिए भी “पिता” कहा जाता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर दिन की बात उसके अपने दिन में,” अर्थात प्रत्येक दिन के लिए निर्धारित कार्य के अनुसार।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किया
  rationale: עמד के हिफ़ील रूप का अर्थ यहाँ लोगों को निर्धारित भूमिकाओं में लगाना या स्थापित करना है; मंदिर-प्रशासन के संदर्भ में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: כְּמִשְׁפַּט
  choice: के विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, बल्कि पहले से निर्धारित व्यवस्था या नियम को दर्शाता है; ‘विधान’ इसकी औपचारिकता बनाए रखता है।
- source_word: דָּוִיד אָבִיו
  choice: अपने पिता दाऊद
  rationale: मूल इब्रानी में ‘उसका पिता’ है। राजवंशीय और वंशावली प्रयोग में אָב पूर्वज को भी दर्शा सकता है; मुख्य पाठ स्रोत की अभिव्यक्ति को रखता है और पादटिप्पणी अर्थ-क्षेत्र स्पष्ट करती है।
- source_word: מַחְלְקוֹת
  choice: दल
  rationale: यह याजकों, लेवियों और द्वारपालों के संगठित सेवा-समूहों को दर्शाता है। ‘दल’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: עַל עֲבֹדָתָם
  choice: उनकी सेवा के लिए
  rationale: यह याजकों को सौंपे गए मंदिर-सेवा के क्षेत्र को व्यक्त करता है; ‘सेवा’ उपासना-संबंधी कार्य का भाव बनाए रखती है।
- source_word: מִשְׁמְרוֹתָם
  choice: उनके कर्तव्यों के लिए
  rationale: מִשְׁמֶרֶת सौंपे गए दायित्व, पहरे या कार्यभार को सूचित कर सकता है। लेवियों के कार्यों के संदर्भ में ‘कर्तव्य’ सबसे सहज व्यापक विकल्प है।
- source_word: לְהַלֵּל וּלְשָׁרֵת
  choice: ताकि वे स्तुति करें और ... सेवा करें
  rationale: दोनों उद्देश्यवाचक क्रियाओं को स्पष्ट रखा गया है। שׁרת का मंदिर-संबंधी अर्थ ‘सेवा करना’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: נֶגֶד הַכֹּהֲנִים
  choice: याजकों के सामने
  rationale: נֶגֶד का मूल स्थानिक-संबंधी अर्थ ‘सामने/उपस्थिति में’ है। यह अनावश्यक रूप से ‘साथ’ या ‘अधीन’ का अर्थ निर्धारित नहीं करता।
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन की निर्धारित आवश्यकता के अनुसार
  rationale: शाब्दिक रूप से यह ‘एक दिन की बात उसके दिन में’ है और प्रत्येक दिन के नियत कार्य या आवश्यकता को दर्शाता है। हिन्दी में अर्थ स्पष्ट करते हुए पादटिप्पणी में इसकी संरचना बताई गई है।
- source_word: הַשּׁוֹעֲרִים
  choice: द्वारपाल
  rationale: यह मंदिर के द्वारों पर नियुक्त सेवकों को दर्शाता है; ‘द्वारपाल’ प्रचलित और स्पष्ट हिन्दी शब्द है।
- source_word: לְשַׁעַר וָשָׁעַר
  choice: एक-एक द्वार पर
  rationale: दोहराव वाली इब्रानी रचना वितरण का भाव देती है, जिसे हिन्दी में ‘एक-एक’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצְוַת
  choice: आज्ञा
  rationale: מִצְוָה एक अधिकारपूर्ण आदेश है। ‘आज्ञा’ आधुनिक धार्मिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह दाऊद के लिए प्रयुक्त सम्मानसूचक धार्मिक पदवी है; ‘परमेश्वर का जन’ मूल रूप और बाइबलीय अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: दाऊद के लिए राजवंशीय ‘पिता’ की भाषा
  choice: मुख्य पाठ में ‘अपने पिता दाऊद’ रखा गया है।
  alternative: ‘अपने पूर्वज दाऊद’
  rationale: इब्रानी אָב का शाब्दिक रूप ‘पिता’ है, यद्यपि यहाँ वह राजवंशीय पूर्वज को दर्शाता है। स्रोत की वंशावली भाषा को बनाए रखते हुए संभावित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: लेवियों का याजकों से संबंध
  choice: ‘याजकों के सामने सेवा करें’
  alternative: ‘याजकों के साथ सेवा करें’ या ‘याजकों के अधीन सेवा करें’
  rationale: נֶגֶד संबंध को ‘सामने/उपस्थिति में’ बताता है; पदानुक्रम या सहकर्मिता की अधिक विशिष्ट व्याख्या मूल पाठ से आगे जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘विधान’, ‘याजक’, ‘लेवी’, ‘द्वारपाल’ और ‘परमेश्वर का जन’ जैसे पद गरिमापूर्ण बाइबलीय शैली बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित वाक्यांशों के तुरंत बाद रखे गए हैं।
