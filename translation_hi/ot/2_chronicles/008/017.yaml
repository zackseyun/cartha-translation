source:
  edition: WLC
  text: אָז֩ הָלַ֨ךְ שְׁלֹמֹ֜ה לְ/עֶצְיֽוֹן גֶּ֧בֶר וְ/אֶל אֵיל֛וֹת עַל שְׂפַ֥ת הַ/יָּ֖ם בְּ/אֶ֥רֶץ אֱדֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/017.yaml
  text: Then Solomon went to Ezion-geber and to Eloth[a], on the shore of the sea in the land of Edom.
translation:
  language: hi
  text: तब सुलैमान एस्योन-गेबेर और एदोम देश में समुद्र के तट पर स्थित एलोत[a] को गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एलोत को अंग्रेज़ी में ‘एलात’ या ‘एलत’ भी लिखा जाता है।
    reason: नाम के हिब्रू रूप और प्रचलित वैकल्पिक अंग्रेज़ी वर्तनी की जानकारी देना।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालसूचक कथात्मक चिह्न अगले घटनाक्रम को सामने लाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: הָלַךְ
  choice: गया
  rationale: यहाँ क्रिया सामान्य रूप से किसी स्थान को जाने का अर्थ देती है; ‘चलकर गया’ अनावश्यक रूप से पैदल यात्रा का संकेत दे सकता है।
- source_word: לְעֶצְיוֹן גֶּבֶר
  choice: एस्योन-गेबेर
  rationale: स्थान-नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है और संयुक्त नाम में योजक-चिह्न रखा गया है।
- source_word: וְאֶל אֵילוֹת
  choice: और एलोत
  rationale: संयोजक और दिशासूचक संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘गया’ दोनों स्थानों पर लागू होता है।
- source_word: עַל שְׂפַת הַיָּם
  choice: समुद्र के तट पर
  rationale: शाब्दिक बिंब ‘समुद्र के किनारे/ओंठ पर’ का स्वाभाविक हिन्दी भौगोलिक रूप ‘समुद्र के तट पर’ है।
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: एदोम देश में
  rationale: मूल में ‘देश/भूमि’ स्पष्ट रूप से उपस्थित है, इसलिए उसे अनुवाद में बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। स्थान-नाम मूल हिब्रू के निकट लिप्यंतरित हैं। बहुवचन क्रिया ‘हैं’ निकटवर्ती दोनों नगरों को समुद्र-तट पर स्थित बताने वाले स्वाभाविक पाठ को व्यक्त करती है, यद्यपि हिब्रू में संबंधवाचक उपवाक्य नहीं है।
