  text: וּ/בִ/דְבַר י֣וֹם בְּ/י֗וֹם לְ/הַעֲלוֹת֙ כְּ/מִצְוַ֣ת מֹשֶׁ֔ה לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וְ/לַ/מּ֣וֹעֲד֔וֹת שָׁל֥וֹשׁ פְּעָמִ֖ים בַּ/שָּׁנָ֑ה בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֥ג הַ/סֻּכּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/008/013.yaml
  text: 'according to the daily requirement for offering up sacrifices[a], as Moses commanded, for the Sabbaths, the new moons, and the appointed feasts three times in the year: at the Feast of Unleavened Bread, at the Feast of Weeks[c][b], and at the Feast of Booths.'
translation:
  language: hi
  text: 'वह हर दिन की निर्धारित विधि के अनुसार बलियाँ चढ़ाता था[a], जैसा मूसा ने आज्ञा दी थी—विश्राम-दिनों, नए चाँद के दिनों और नियत पर्वों पर—वर्ष में तीन बार: अखमीरी रोटी के पर्व, सप्ताहों के पर्व[b] और झोपड़ियों के पर्व[c] पर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर दिन के नियम के अनुसार” (शाब्दिक रूप से, “हर दिन की बात उसके दिन में”)।
    reason: lexical_alternative
  - marker: b
    text: “सप्ताहों का पर्व” बाद की यूनानी परंपरा में “पिन्तेकुस्त” कहलाया।
    reason: cross_reference
  - marker: c
    text: या, “तम्बुओं का पर्व”; इब्रानी शब्द का अर्थ “झोपड़ियाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִדְבַר יוֹם בְּיוֹם
  choice: हर दिन की निर्धारित विधि के अनुसार
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘हर दिन की बात उसके दिन में’ है; यहाँ आशय प्रत्येक दिन के लिए निर्धारित उपासना-विधि से है। यह अनुवाद उस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְהַעֲלוֹת
  choice: बलियाँ चढ़ाता था
  rationale: עלה का हिफ़ील रूप इस बलिदान-संबंधी प्रसंग में वेदी पर अर्पण चढ़ाने का अर्थ देता है। हिन्दी में ‘बलियाँ चढ़ाना’ इस आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: כְּמִצְוַת מֹשֶׁה
  choice: जैसा मूसा ने आज्ञा दी थी
  rationale: यह मूसा के द्वारा दी गई व्यवस्था के निर्देश की ओर संकेत करता है; क्रियात्मक रूप हिन्दी में सहज है और आज्ञा का अधिकार बनाए रखता है।
- source_word: לַשַּׁבָּתוֹת
  choice: विश्राम-दिनों ... पर
  rationale: बहुवचन उन सब्त-दिनों को दर्शाता है जिन पर निर्धारित अर्पण चढ़ाए जाते थे। ‘विश्राम-दिन’ अर्थ को सामान्य हिन्दी पाठक के लिए पारदर्शी रखता है।
- source_word: וְלֶחֳדָשִׁים
  choice: नए चाँद के अवसरों ... पर
  rationale: उपासना-पंचांग के इस संदर्भ में חֳדָשִׁים सामान्य महीनों के बजाय अमावस्या अथवा नए चाँद पर होने वाले मासिक धार्मिक अवसरों को सूचित करता है।
- source_word: וְלַמּוֹעֲדוֹת
  choice: नियत पर्वों पर
  rationale: מוֹעֲדִים निर्धारित समयों को दर्शाता है, और आगे बताए गए तीन पर्व इसके उत्सवी अर्थ को स्पष्ट करते हैं। ‘नियत पर्व’ दोनों पक्षों को संक्षेप में बनाए रखता है।
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: जो वर्ष में तीन बार आते थे
  rationale: यह तीन वार्षिक तीर्थ-पर्वों का स्वाभाविक हिन्दी वर्णन है और संख्या तथा आवृत्ति दोनों को सुरक्षित रखता है।
- source_word: בְּחַג הַמַּצּוֹת
  choice: अखमीरी रोटी के पर्व पर
  rationale: מַצּוֹת खमीर रहित रोटियों को दर्शाता है। ‘अखमीरी रोटी का पर्व’ नाम का ठोस और परिचित हिन्दी रूप है।
- source_word: וּבְחַג הַשָּׁבֻעוֹת
  choice: सप्ताहों के पर्व पर
  rationale: इब्रानी नाम का सीधा अर्थ ‘सप्ताहों का पर्व’ है। बाद का यूनानी नाम ‘पिन्तेकुस्त’ मुख्य पाठ में लाने के बजाय पादटिप्पणी में दिया गया है।
- source_word: וּבְחַג הַסֻּכּוֹת
  choice: झोपड़ियों के पर्व पर
  rationale: סֻכּוֹת अस्थायी झोपड़ियों या छप्परों को दर्शाता है। ‘झोपड़ियों का पर्व’ इब्रानी बिंब को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: इस्राएल के तीन वार्षिक पर्वों के नामों का अनुवाद
  choice: अखमीरी रोटी का पर्व / सप्ताहों का पर्व / झोपड़ियों का पर्व
  alternative: फसह का समय / पिन्तेकुस्त / तम्बुओं का पर्व
  rationale: मूल इब्रानी पाठ पर्वों के ये प्रत्यक्ष नाम देता है। मुख्य पाठ में उनके अर्थ को पारदर्शी रखा गया है; बाद के यूनानी नाम और प्रचलित वैकल्पिक नाम पादटिप्पणियों में सुरक्षित हैं, ताकि किसी बाद की धार्मिक शब्दावली को मूल पर न थोपा जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। पद मूल में पिछले वाक्य से व्याकरणिक रूप से जुड़ा है; हिन्दी में पठनीयता के लिए संदर्भगत कर्ता ‘वह’ और पूर्ण क्रिया का प्रयोग किया गया है। पर्वों के नाम अर्थ-पारदर्शी रखे गए हैं, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उनके सही पदों पर दिए गए हैं।
