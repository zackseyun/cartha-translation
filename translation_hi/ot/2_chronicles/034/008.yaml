  text: וּ/בִ/שְׁנַ֨ת שְׁמוֹנֶ֤ה עֶשְׂרֵה֙ לְ/מָלְכ֔/וֹ לְ/טַהֵ֥ר הָ/אָ֖רֶץ וְ/הַ/בָּ֑יִת שָׁ֠לַח אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֜הוּ וְ/אֶת מַעֲשֵׂיָ֣הוּ שַׂר הָ/עִ֗יר וְ֠/אֵת יוֹאָ֤ח בֶּן יֽוֹאָחָז֙ הַ/מַּזְכִּ֔יר לְ/חַזֵּ֕ק אֶת בֵּ֖ית יְהוָ֥ה אֱלֹהָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/008.yaml
  text: In the eighteenth year of his reign[a], when he had cleansed the land and the house, he sent Shaphan son of Azaliah, Maaseiah the governor of the city, and Joah son of Joahaz, the recorder[b], to repair the house of Yahweh his God.
translation:
  language: hi
  text: उसके शासन के अठारहवें वर्ष में, जब वह भूमि और भवन[a] को शुद्ध कर चुका था, उसने अत्सल्याहू के पुत्र शाफान, नगर के अधिकारी मासेयाहू, और योआहाज के पुत्र राजकीय अभिलेखपाल योआह को अपने परमेश्वर याहवे के भवन की मरम्मत करने के लिए भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मन्दिर’; इब्रानी में शाब्दिक रूप से ‘भूमि और भवन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁמוֹנֶה עֶשְׂרֵה לְמָלְכוֹ
  choice: उसके शासन के अठारहवें वर्ष में
  rationale: राजकीय काल-निर्धारण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक וּ कथा की निरन्तरता दर्शाता है, जिसके लिए अलग से ‘और’ आवश्यक नहीं है।
- source_word: לְטַהֵר
  choice: जब वह ... को शुद्ध कर चुका था
  rationale: पूर्ववर्ती कथानक के अनुसार शुद्ध करने का कार्य इस भेजे जाने की पृष्ठभूमि है; यह अनुवाद उद्देश्य के बजाय उस पूर्ण हो चुके चरण को स्पष्ट करता है।
- source_word: הָאָרֶץ וְהַבָּיִת
  choice: देश और भवन
  rationale: ‘भवन’ मूल के ‘घर/भवन’ को बनाए रखता है और आगे आए ‘याहवे के भवन’ से उसका शाब्दिक सम्बन्ध सुरक्षित रखता है; सन्दर्भ में यह मन्दिर है।
- source_word: שַׂר הָעִיר
  choice: नगर का अधिकारी
  rationale: שַׂר नगर पर अधिकार रखने वाले पदाधिकारी को सूचित करता है। ‘अधिकारी’ पद की प्रकृति को अनावश्यक रूप से अधिक विशिष्ट बनाए बिना सहज हिन्दी देता है।
- source_word: הַמַּזְכִּיר
  choice: राजकीय अभिलेखपाल
  rationale: यह राजकीय पद अभिलेख रखने अथवा स्मरण-पत्र प्रस्तुत करने वाले अधिकारी का था; ‘राजकीय अभिलेखपाल’ आधुनिक पाठक के लिए कार्य को स्पष्ट करता है।
- source_word: לְחַזֵּק
  choice: मरम्मत कराने के लिए
  rationale: क्रिया का मूल भाव ‘दृढ़ करना’ है, पर भवन के सन्दर्भ में इसका आशय उसकी मरम्मत या पुनर्स्थापना करना है। भेजे गए अधिकारियों की निरीक्षणकारी भूमिका के कारण ‘कराने’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यन्तरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण और ध्वन्यात्मक रूप से निकट हिन्दी लिप्यन्तरण है; ‘प्रभु’ नाम को उपाधि में बदल देता और ‘यहोवा’ भिन्न पारम्परिक स्वरांकन को दर्शाता।
- issue: לְטַהֵר का कालगत या प्रयोजनगत सम्बन्ध
  choice: जब वह ... शुद्ध कर चुका था
  alternative: देश और भवन को शुद्ध करने के लिए
  rationale: अध्याय के पूर्ववर्ती घटनाक्रम में शुद्धिकरण आरम्भ हो चुका है और यहाँ मन्दिर की मरम्मत का नया चरण आता है। फिर भी इब्रानी infinitive में प्रयोजनगत अर्थ व्याकरणतः सम्भव है; मुख्य पाठ सन्दर्भानुकूल कालगत सम्बन्ध चुनता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। व्यक्तिनामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यन्तरण किया गया है। ‘नगर का अधिकारी’ मूल पद की व्यापकता बनाए रखता है, जबकि ‘राजकीय अभिलेखपाल’ अपरिचित प्रशासनिक पद का कार्य स्पष्ट करता है। फुटनोट चिह्न उन्हीं शब्दों के पास रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
