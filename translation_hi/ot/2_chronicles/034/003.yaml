base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/003.yaml
  text: In the eighth year of his reign[a], while he was still a youth, he began to seek the God of David his father; and in the twelfth year he began to cleanse Judah and Jerusalem from the high places, the Asherim, the carved images[c][b], and the metal images.
translation:
  language: hi
  text: उसके राज्यकाल के आठवें वर्ष में, जब वह अभी किशोर ही था, उसने अपने पिता दाऊद के परमेश्वर[a] की खोज करना आरम्भ किया। और बारहवें वर्ष में उसने यहूदा और यरूशलेम को ऊँचे पूजा-स्थानों, अशेरा-प्रतीकों[b], खुदी हुई मूर्तियों और धातु की ढली हुई मूर्तियों[c] से शुद्ध करना आरम्भ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वज दाऊद के परमेश्वर।” यहाँ “पिता” राजवंशीय भाषा है; दाऊद योशिय्याह का पूर्वज था।
    reason: lexical_alternative
  - marker: b
    text: या “अशेरा के खम्भों।” इब्रानी शब्द अशेरा से जुड़े उपासना-प्रतीकों के लिए है, जो प्रायः लकड़ी के खम्भे या वृक्ष होते थे।
    reason: lexical_alternative
  - marker: c
    text: अर्थात साँचे में धातु ढालकर बनाई गई मूर्तियाँ।
    reason: lexical_clarification
lexical_decisions:
- source_word: וּבִשְׁמוֹנֶה שָׁנִים לְמָלְכוֹ
  choice: उसके राज्यकाल के आठवें वर्ष में
  rationale: वर्ष-सूचक ב को कालवाचक रूप में और לְמָלְכוֹ को राजकीय शासन की अवधि के रूप में व्यक्त किया गया है। यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וְהוּא עוֹדֶנּוּ נַעַר
  choice: जब वह अभी किशोर ही था
  rationale: נַעַר के आयु-संबंधी लचीलेपन को ध्यान में रखते हुए ‘किशोर’ यहाँ न तो उसे छोटा बालक बनाता है, न केवल अस्पष्ट रूप से युवा कहता है; ‘अभी…ही’ עוֹדֶנּוּ का बल बनाए रखता है।
- source_word: הֵחֵל לִדְרוֹשׁ
  choice: उसने … की खोज करना आरम्भ किया
  rationale: परमेश्वर के संबंध में דרשׁ केवल जानकारी पूछने के बजाय भक्तिपूर्वक उसकी ओर मुड़ने और उसे खोजने का भाव रखता है।
- source_word: לֵאלֹהֵי דָּוִיד אָבִיו
  choice: अपने पिता दाऊद के परमेश्वर
  rationale: मुख्य पाठ में אָבִיו का शाब्दिक राजवंशीय संबोधन ‘पिता’ रखा गया है; पादटिप्पणी स्पष्ट करती है कि दाऊद उसका तात्कालिक पिता नहीं, पूर्वज था।
- source_word: הֵחֵל לְטַהֵר
  choice: शुद्ध करना आरम्भ किया
  rationale: טהר यहाँ देश और नगर से उपासना-संबंधी अशुद्धता दूर करने को सूचित करता है; ‘शुद्ध करना’ इसके धार्मिक और नैतिक दोनों आयामों को व्यक्त करता है।
- source_word: מִן הַבָּמוֹת
  choice: ऊँचे पूजा-स्थानों से
  rationale: בָּמוֹת स्थानीय उपासना-स्थलों के लिए प्रचलित पद है। केवल ‘ऊँचे स्थान’ की अपेक्षा यह हिन्दी पाठक को इनके धार्मिक उपयोग को स्पष्ट रूप से समझाता है।
- source_word: וְהָאֲשֵׁרִים
  choice: अशेरा-प्रतीकों
  rationale: बहुवचन אֲשֵׁרִים अशेरा से जुड़े उपासना-चिह्नों को सूचित कर सकता है, जिनका सटीक भौतिक रूप खम्भा, वृक्ष या अन्य प्रतीक हो सकता था। ‘प्रतीक’ इस अनिश्चितता को सुरक्षित रखता है।
- source_word: וְהַפְּסִלִים
  choice: खुदी हुई मूर्तियों
  rationale: פְּסִלִים तराशकर या खोदकर बनाई गई प्रतिमाएँ हैं। यह व्यापक शब्द ‘मूर्तियाँ’ की तुलना में निर्माण-विधि भी व्यक्त करता है।
- source_word: וְהַמַּסֵּכוֹת
  choice: धातु की ढली हुई मूर्तियों
  rationale: מַסֵּכוֹת साँचे में ढालकर बनाई गई प्रतिमाओं को सूचित करता है। हिन्दी में ‘धातु की ढली हुई’ सामग्री और निर्माण-विधि दोनों स्पष्ट करता है।
theological_decisions:
- issue: ‘दाऊद उसके पिता’ में वंश-संबंधी भाषा
  choice: मुख्य पाठ में ‘अपने पिता दाऊद’
  alternative: ‘अपने पूर्वज दाऊद’
  rationale: इब्रानी राजवंशीय भाषा में दूर के पूर्वज को भी ‘पिता’ कहा जा सकता है। इसे मुख्य पाठ में रखने से दाऊदी राजवंश से साहित्यिक और धर्मवैचारिक संबंध बना रहता है, जबकि पादटिप्पणी आधुनिक पाठक के लिए अर्थ स्पष्ट करती है।
- issue: אֲשֵׁרִים का सटीक भौतिक स्वरूप
  choice: अशेरा-प्रतीक
  alternative: अशेरा के खम्भे
  rationale: शब्द अशेरा से जुड़े लकड़ी के खम्भों या वृक्षों का उल्लेख कर सकता है, पर हर प्रसंग में सटीक रूप निश्चित नहीं है। व्यापक अनुवाद मूल की वास्तविक अनिश्चितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘आरम्भ’ और ‘शुद्ध’ धार्मिक-ऐतिहासिक प्रसंग की गरिमा रखते हैं, जबकि ‘किशोर’, ‘पूजा-स्थल’ और ‘ढली हुई’ सामान्य पाठक के लिए स्पष्ट हैं।
