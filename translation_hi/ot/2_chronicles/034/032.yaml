  text: וַ/יַּעֲמֵ֕ד אֵ֛ת כָּל הַ/נִּמְצָ֥א בִ/ירוּשָׁלִַ֖ם וּ/בִנְיָמִ֑ן וַֽ/יַּעֲשׂוּ֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כִּ/בְרִ֥ית אֱלֹהִ֖ים אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/032.yaml
  text: Then he made everyone who was found in Jerusalem and Benjamin stand to it[a], and the inhabitants of Jerusalem acted according to the covenant of God[b], the God of their fathers.
translation:
  language: hi
  text: तब उसने यरूशलेम और बिन्यामीन में पाए गए सभी लोगों को उस वाचा का पालन करने के लिए बाध्य किया[a], और यरूशलेम के निवासियों ने परमेश्वर की वाचा के अनुसार आचरण किया—उस परमेश्वर की, जो उनके पूर्वजों का परमेश्वर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने यरूशलेम और बिन्यामीन में पाए गए सभी लोगों को खड़ा किया।” प्रसंग में इसका अर्थ यह हो सकता है कि उसने उन्हें वाचा के पक्ष में दृढ़ता से खड़ा किया या उसके प्रति प्रतिबद्ध किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: कायम रहने के लिए बाध्य किया
  rationale: हिफ़ील रूप का मूल अर्थ ‘खड़ा किया’ है। वाचा के नवीकरण के इस प्रसंग में यह केवल शारीरिक रूप से खड़ा करने के बजाय वाचा के प्रति प्रतिबद्ध रहने को बाध्य करने का भाव देता है। ‘कायम रहना’ खड़े रहने की मूल छवि और निष्ठा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵת כָּל הַנִּמְצָא
  choice: पाए गए सभी लोगों को
  rationale: यह अनुवाद निष्क्रिय कृदंत נמצא को निकटता से दर्शाता है और वहाँ उपस्थित समस्त लोगों को सूचित करता है।
- source_word: בִירוּשָׁלִַם וּבִנְיָמִן
  choice: यरूशलेम और बिन्यामीन में
  rationale: मूल पाठ दोनों स्थान-नाम सीधे देता है। यहाँ ‘बिन्यामीन’ से सम्भवतः बिन्यामीन का क्षेत्र अभिप्रेत है, पर मुख्य पाठ में मूल की संक्षिप्तता बनाए रखी गई है।
- source_word: וַיַּעֲשׂוּ
  choice: आचरण किया
  rationale: עשה के साथ כִּבְרִית का अर्थ वाचा के अनुरूप कार्य करना है। ‘आचरण किया’ इस भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों
  rationale: यह वहाँ रहने वाले लोगों के लिए स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: כִּבְרִית
  choice: वाचा के अनुसार
  rationale: उपसर्ग כ यहाँ अनुरूपता का भाव देता है; अर्थात उन्होंने वाचा के अनुरूप आचरण किया।
- source_word: אֱלֹהִים אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: परमेश्वर की वाचा … उस परमेश्वर की … जो उनके पूर्वजों का परमेश्वर था
  rationale: मूल की समानाधिकरण रचना परमेश्वर को उनके पूर्वजों के परमेश्वर के रूप में पहचानती है। हिन्दी में पुनरुक्ति अर्थ-संबंध को स्पष्ट रखती है और मूल के बल को सुरक्षित करती है।
theological_decisions:
- issue: वाचा के नवीकरण में योशिय्याह की कार्रवाई का आशय
  choice: उसने उपस्थित लोगों को वाचा पर कायम रहने के लिए बाध्य किया
  alternative: उसने उपस्थित लोगों को केवल शारीरिक रूप से खड़ा किया
  rationale: हिफ़ील וַיַּעֲמֵד का शाब्दिक अर्थ ‘खड़ा किया’ हो सकता है, पर प्रसंग वाचा के प्रति बँधी हुई प्रतिबद्धता की ओर संकेत करता है। मुख्य पाठ प्रसंगगत आशय देता है और पादटिप्पणी शाब्दिक सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वाचा’ बाइबिलीय प्रसंग का मानक और आवश्यक शब्द है; ‘कायम रहना’ मूल की खड़े रहने वाली छवि को स्वाभाविक हिन्दी में बनाए रखता है।
