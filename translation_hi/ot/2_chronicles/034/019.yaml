source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ/שְׁמֹ֣עַ הַ/מֶּ֔לֶךְ אֵ֖ת דִּבְרֵ֣י הַ/תּוֹרָ֑ה וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/019.yaml
  text: And when the king heard the words of the law[a], he tore his clothes.
translation:
  language: hi
  text: जब राजा ने व्यवस्था[a] की बातें सुनीं, तो उसने अपने वस्त्र फाड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा”; इब्रानी शब्द ‘तोराह’ का व्यापक अर्थ शिक्षा या निर्देश भी हो सकता है, यद्यपि यहाँ वह राजा के सामने पढ़ी जा रही वाचा-संबंधी व्यवस्था को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने ... सुनीं
  rationale: वाक्य के आरंभ का וַיְהִי और כ के साथ infinitive construct यहाँ घटना की समयगत परिस्थिति बताते हैं। आधुनिक हिंदी में ‘जब’ से इसे स्वाभाविक रूप से व्यक्त किया गया है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और बोझिल होता।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी पाठ में निश्चित पदवी है। संदर्भ में राजा योशिय्याह है, पर मूल पाठ नाम नहीं देता, इसलिए नाम नहीं जोड़ा गया।
- source_word: דִּבְרֵי
  choice: की बातें
  rationale: Construct plural यहाँ पढ़ी या सुनाई गई विषय-वस्तु को सूचित करता है। ‘बातें’ आधुनिक हिंदी में स्वाभाविक है और मूल के बहुवचन को भी बनाए रखता है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: תורה का व्यापक अर्थ ‘शिक्षा’ या ‘निर्देश’ हो सकता है, किंतु इस प्रसंग में वह राजा के सामने पढ़ी गई वाचा-संबंधी विधि की ओर संकेत करती है। हिंदी बाइबलीय प्रयोग में ‘व्यवस्था’ इस अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: וַיִּקְרַע
  choice: उसने ... फाड़े
  rationale: קרע वस्त्र फाड़ने की क्रिया है, जो प्रसंग में शोक, व्याकुलता या पश्चात्ताप का चिह्न है। अनुवाद क्रिया को सीधे रखता है और उसके आशय की व्याख्या मुख्य पाठ में नहीं जोड़ता।
- source_word: בְּגָדָיו
  choice: अपने वस्त्र
  rationale: בגד सामान्य रूप से कपड़ों या वस्त्रों को दर्शाता है। ‘वस्त्र’ वर्तमान हिंदी में समझने योग्य, संक्षिप्त और इस गंभीर प्रसंग के अनुरूप है; ‘राजसी पोशाक’ कहना मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: योशिय्याह के सुधार के प्रसंग में תורה का अनुवाद
  choice: व्यवस्था
  alternative: शिक्षा; तोराह
  rationale: यहाँ मिले हुए ग्रंथ की वाचा-संबंधी और विधिक विषय-वस्तु प्रमुख है। ‘व्यवस्था’ उस बल को हिंदी में स्थापित और स्पष्ट रूप से व्यक्त करती है, जबकि पाद-टिप्पणी תורה के व्यापक अर्थ ‘शिक्षा’ को सुरक्षित रखती है और अर्थगत तनाव को मिटाती नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘जब ... तो ...’ समय और परिणाम का स्वाभाविक संबंध देता है। मुख्य पाठ संक्षिप्त रखा गया है और תורה की वास्तविक अर्थ-व्याप्ति पाद-टिप्पणी में सुरक्षित की गई है।
