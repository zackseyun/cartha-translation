base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/002.yaml
  text: He did what was right in the eyes of Yahweh[a], and walked in the ways of David his father[b]; he did not turn aside to the right or to the left.
translation:
  language: hi
  text: उसने वही किया जो यहोवा[a] की दृष्टि में सही था। वह अपने पूर्वज दाऊद[b] के मार्गों पर चला और न दाएँ मुड़ा, न बाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा” के स्थान पर “याहवे” रूप भी प्रयुक्त होता है; परंपरागत अनुवादों में “यहोवा की दृष्टि में” के स्थान पर “प्रभु की दृष्टि में” मिलता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “दाऊद उसका पिता”; यहाँ “पिता” का अर्थ राजवंशीय पूर्वज है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: उसने वही किया जो ... सही था
  rationale: यह राजकीय मूल्यांकन-सूत्र का स्वाभाविक हिन्दी रूप है और עשה तथा substantival הַיָּשָׁר दोनों का अर्थ स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मुहावरे की दिव्य मूल्यांकन-वाली भावना को स्वाभाविक हिन्दी में व्यक्त करता है; 'आँखों में' की अस्वाभाविकता से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप 'यहोवा' से व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
- source_word: וַיֵּלֶךְ בְּדַרְכֵי
  choice: मार्गों पर चला
  rationale: הלך और דרך के आचरण-संबंधी मार्ग-रूपक को स्पष्ट और प्रतिष्ठित हिन्दी में बनाए रखता है।
- source_word: דָּוִיד אָבִיו
  choice: अपने पूर्वज दाऊद
  rationale: אָב यहाँ योशिय्याह के प्रत्यक्ष पिता नहीं, राजवंशीय पूर्वज के अर्थ में है; हिन्दी मुख्य पाठ में 'पूर्वज' भ्रम से बचाता है।
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: न दाएँ मुड़ा, न बाएँ
  rationale: किसी भी दिशा में मार्ग से न हटने के स्थिर इब्रानी मुहावरे और उसके रूपक को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के बीच पहचाने जाने वाले नामरूप 'यहोवा' द्वारा इसे नाम के रूप में बनाए रखा गया है; पादटिप्पणी वैकल्पिक उच्चारण और पारंपरिक प्रतिस्थापन बताती है।
- issue: דָּוִיד אָבִיו में אָב का संबंध
  choice: पूर्वज
  alternative: पिता
  rationale: दाऊद योशिय्याह का प्रत्यक्ष पिता नहीं था। राजवंशीय भाषा में אָב का अर्थ पूर्वज हो सकता है; मुख्य पाठ में अर्थ स्पष्ट किया गया है और पादटिप्पणी शाब्दिक रूप दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है और मार्ग पर चलने तथा दाएँ-बाएँ न मुड़ने का मूल रूपक सुरक्षित है।
