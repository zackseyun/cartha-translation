  text: וַ/יְנַתֵּ֣ץ אֶת הַֽ/מִּזְבְּח֗וֹת וְ/אֶת הָ/אֲשֵׁרִ֤ים וְ/הַ/פְּסִלִים֙ כִּתַּ֣ת לְ/הֵדַ֔ק וְ/כָל הַֽ/חַמָּנִ֥ים גִּדַּ֖ע בְּ/כָל אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יָּ֖שָׁב לִ/ירוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/007.yaml
  text: He tore down the altars and the Asherim[a], and he crushed the carved images to powder; he cut down all the incense altars throughout all the land of Israel[b]. Then he returned to Jerusalem.
translation:
  language: hi
  text: उसने वेदियों और अशेरा से जुड़ी उपासना-वस्तुओं[a] को ढा दिया, तराशी हुई प्रतिमाओं को पीसकर चूर कर दिया, और इस्राएल के सारे देश में सभी सूर्य-स्तंभों[b] को काट गिराया। तब वह यरूशलेम लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा के खंभों।” इब्रानी शब्द अशेरा से जुड़ी उपासना-वस्तुओं को दर्शाता है; अलग-अलग प्रसंगों में उनका ठीक रूप भिन्न हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “धूप-वेदियों।” इब्रानी शब्द संभवतः एक प्रकार की उपासना-वस्तु को दर्शाता है, पर उसकी सटीक पहचान विवादित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתֵּץ
  choice: ढा दिया
  rationale: נתץ निर्मित वस्तुओं को तोड़कर गिराने या ध्वस्त करने का बोध देता है; वेदियों के लिए यह स्वाभाविक और सटीक हिन्दी है।
- source_word: הַמִּזְבְּחוֹת
  choice: वेदियों
  rationale: מזבחות का मानक अर्थ वेदियाँ है; प्रसंग में अनुचित उपासना की वेदियाँ नष्ट की जा रही हैं।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-चिह्नों
  rationale: यह अशेरा से जुड़ी उपासना-वस्तुओं का विशिष्ट बहुवचन है। 'चिह्न' वस्तु के ठीक भौतिक रूप को अनावश्यक रूप से निश्चित किए बिना उसका सांप्रदायिक स्वरूप बताता है।
- source_word: הַפְּסִלִים
  choice: खुदी हुई मूर्तियों
  rationale: פסילים तराशी या खोदी गई उपासना-मूर्तियाँ हैं; यह सामान्य 'मूर्तियों' से अधिक विशिष्ट है।
- source_word: כִּתַּת לְהֵדַק
  choice: पीसकर चूर कर दिया
  rationale: यह संयुक्त अभिव्यक्ति वस्तुओं को कूटकर अत्यन्त महीन कर देने का परिणाम व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: הַחַמָּנִים
  choice: धूप-वेदियों
  rationale: חמנים की सटीक पहचान विवादित है और यह धूप-स्थापनाओं अथवा सूर्य से जुड़े खंभों/प्रतिमाओं के लिए प्रयुक्त हो सकता है। मुख्य पाठ में प्रसंगानुकूल 'धूप-वेदियाँ' रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: גִּדַּע
  choice: काट गिराया
  rationale: גדע खड़ी वस्तुओं को काटने या काटकर गिराने का अर्थ देता है।
- source_word: בְּכָל אֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल के सारे देश में
  rationale: यह योशिय्याह की कार्रवाई के पूरे इस्राएली भूभाग में फैलाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשָׁב לִירוּשָׁלִָם
  choice: तब वह यरूशलेम लौट गया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; 'तब' हिन्दी में घटनाक्रम को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक उपासना-वस्तुओं के विशिष्ट नाम
  choice: वेदियाँ, अशेरा-चिह्न, खुदी हुई मूर्तियाँ और धूप-वेदियाँ अलग-अलग रखी गई हैं।
  alternative: सबको सामान्य रूप से 'मूर्तियाँ और पूजा-स्थल' कहना।
  rationale: इब्रानी पाठ अलग-अलग उपासना-वस्तुओं को नाम देता है। उनकी विशिष्टता बनाए रखना योशिय्याह के सुधार की ठोस कार्रवाइयों को सुरक्षित रखता है और पाठ में सामान्यीकरण नहीं करता।
- issue: חמנים की अनिश्चित पहचान
  choice: मुख्य पाठ में 'धूप-वेदियाँ', पादटिप्पणी में 'सूर्य-स्तंभ'।
  alternative: मुख्य पाठ में केवल 'सूर्य-स्तंभ'।
  rationale: शब्द का ठीक संकेत विवादित है। चुना हुआ पाठ प्रसंग में समझने योग्य है, जबकि पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। 'अशेरा' जैसे विशिष्ट प्राचीन सांप्रदायिक पद को व्याख्यात्मक 'चिह्न' के साथ रखा गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
