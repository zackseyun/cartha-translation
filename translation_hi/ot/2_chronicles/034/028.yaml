base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/028.yaml
  text: Behold[a], I am about to gather you to your fathers, and you will be gathered to your graves in peace[c][b], and your eyes will not see all the disaster that I am bringing on this place and on its inhabitants.’ And they brought back word to the king.
translation:
  language: hi
  text: “देख, मैं तुझे तेरे पुरखों के पास मिला दूँगा[a], और तू शान्ति से अपनी कब्रों में पहुँचाया जाएगा[b][c]। तेरी आँखें उस सारी विपत्ति को नहीं देखेंगी जिसे मैं इस स्थान और इसके निवासियों पर लाने वाला हूँ।” तब उन्होंने राजा को यह सन्देश पहुँचा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं तुझे तेरे पितरों के पास इकट्ठा करूँगा।” यह मृत्यु में अपने पूर्वजों से जा मिलने का हिब्रू मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “शान्ति से” का अर्थ सम्भवतः यह है कि योशिय्याह आने वाली विपत्ति को देखने से पहले मर जाएगा, जैसा अगली पंक्ति स्पष्ट करती है; इससे यह आवश्यक नहीं कि उसकी मृत्यु हिंसा के बिना हुई हो।
    reason: cross_reference
  - marker: c
    text: मूल हिब्रू में “कब्रों” बहुवचन है; इसका आशय पैतृक कब्रों या समाधि-स्थल से हो सकता है।
    reason: source_form
lexical_decisions:
- source_word: הִנְנִי
  choice: देख, मैं ... लाने वाला हूँ / मिला दूँगा
  rationale: ‘देख’ हिब्रू के ध्यान आकर्षित करने वाले सूचक को स्वाभाविक हिन्दी में रखता है; आगामी कार्य का भाव निकट भविष्य की अभिव्यक्ति से दिया गया है।
- source_word: אֹסִפְךָ אֶל אֲבֹתֶיךָ
  choice: तुझे तेरे पुरखों के पास मिला दूँगा
  rationale: यह मृत्यु में पूर्वजों से जा मिलने का रूढ़ हिब्रू मुहावरा है। ‘मिला दूँगा’ हिन्दी में अर्थ स्पष्ट रखते हुए एकत्र किए जाने की छवि को काफी हद तक बनाए रखता है।
- source_word: וְנֶאֱסַפְתָּ אֶל קִבְרֹתֶיךָ
  choice: तू ... अपनी कब्रों में पहुँचाया जाएगा
  rationale: कर्मवाच्य रूप सुरक्षित है और קִבְרֹתֶיךָ के व्याकरणिक बहुवचन को ‘कब्रों’ से दर्शाया गया है, जो पैतृक कब्रों अथवा समाधि-स्थल की ओर संकेत कर सकता है।
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: यह שָׁלוֹם की व्यापकता बनाए रखता है और अपने आप यह निष्कर्ष नहीं निकालता कि मृत्यु हिंसक परिस्थितियों में नहीं होगी।
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: तेरी आँखें ... नहीं देखेंगी
  rationale: मूल में ‘तेरी आँखें’ स्पष्ट कर्ता है; उसे बनाए रखने से हिब्रू की सजीवता और बल सुरक्षित रहता है।
- source_word: בְּכֹל הָרָעָה
  choice: उस सारी विपत्ति को
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई के बजाय आने वाली आपदा या विपत्ति बताता है।
- source_word: אֲנִי מֵבִיא
  choice: मैं ... लाने वाला हूँ
  rationale: हिब्रू कृदन्त आसन्न और निश्चित कार्य का भाव देता है; हिन्दी की यह रचना उसी भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיָּשִׁיבוּ אֶת הַמֶּלֶךְ דָּבָר
  choice: तब उन्होंने राजा को यह सन्देश पहुँचा दिया
  rationale: यह पूछताछ के बाद उत्तर अथवा समाचार वापस राजा तक पहुँचाने का मुहावरा है।
theological_decisions:
- issue: योशिय्याह की बाद की युद्ध-मृत्यु के प्रकाश में ‘शान्ति से’ का अर्थ
  choice: पद की अगली पंक्ति के अनुसार, योशिय्याह आने वाली विपत्ति को देखने से बचा रहेगा; अनुवाद यह खुला रखता है कि ‘शान्ति’ मुख्यतः इसी बात को सूचित करती है।
  alternative: इसे ऐसी भविष्यवाणी मानना कि उसकी मृत्यु की बाहरी परिस्थितियाँ अवश्य ही अहिंसक होंगी।
  rationale: ‘तेरी आँखें ... विपत्ति को नहीं देखेंगी’ निकटतम व्याख्यात्मक कथन है। पाठ के तनाव को मिटाए बिना ‘शान्ति से’ का सीधा अनुवाद रखा गया है।
- issue: ‘कब्रों’ के बहुवचन का आशय
  choice: मूल का बहुवचन मुख्य पाठ में रखा गया और सम्भावित पैतृक समाधि-स्थल का अर्थ टिप्पणी में बताया गया।
  alternative: हिन्दी मुहावरे के अनुसार एकवचन ‘कब्र’ करना।
  rationale: बहुवचन पाठ-साक्ष्य का वास्तविक रूप है; फिर भी हिन्दी पाठक के लिए सम्भावित सामूहिक/पैतृक अर्थ स्पष्ट करना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ स्तर रखा गया है। ‘पुरखों’ रूढ़ मृत्यु-मुहावरे को ‘पिताओं’ से अधिक स्वाभाविक बनाता है। ‘देख’ मूल के उद्घोषक הִנְנִי को संक्षिप्त रूप में बनाए रखता है। वर्तनी में ‘शान्ति’ और ‘सन्देश’ जैसे मानक रूप प्रयुक्त हैं।
