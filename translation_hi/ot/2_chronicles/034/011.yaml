base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/011.yaml
  text: And they gave it to the craftsmen and to the builders to buy quarried stone and timber for the supports and for roofing the buildings that the kings of Judah had ruined[a][b][c].
translation:
  language: hi
  text: उन्होंने वह धन कारीगरों और निर्माण करने वालों को दिया, ताकि वे खदान से निकाले हुए पत्थर[a] और लकड़ी खरीदें, जो जोड़ाई के काम[b] और उन भवनों पर छत डालने[c] के लिए थी जिन्हें यहूदा के राजाओं ने बरबाद कर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तराशे हुए पत्थर।” इब्रानी पद निर्माण के लिए खदान से काटकर निकाले गए पत्थर को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द का ठीक अर्थ अनिश्चित है। यह संरचना के जोड़, बन्धनों या ढाँचे के अंगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “कड़ियाँ लगाने” अथवा “ढकने।” इब्रानी क्रिया किसी भवन को लकड़ी की कड़ियों से ढकने या उस पर छत डालने के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
