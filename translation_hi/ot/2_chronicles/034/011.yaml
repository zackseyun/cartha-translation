- source_word: עֵצִים
  choice: लकड़ी
  rationale: निर्माण-संदर्भ में प्रयुक्त सामग्री को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַמְחַבְּרוֹת
  choice: जोड़ाई के काम
  rationale: दुर्बोध शब्द का मूल भाव जोड़ने या संरचनात्मक संबंध बनाने से जुड़ा है। यह चयन किसी विशेष वास्तु-अंग को निश्चित किए बिना उस भाव को बनाए रखता है।
- source_word: וּלְקָרוֹת
  choice: भवनों पर छत डालने
  rationale: निर्माण-संदर्भ में קרה का अर्थ लकड़ी की कड़ियों से ढकना या छत बनाना हो सकता है। हिन्दी में प्रयोजन को क्रियात्मक रूप से व्यक्त किया गया है।
- source_word: הַבָּתִּים
  choice: भवनों
  rationale: मन्दिर की मरम्मत के संदर्भ में यह सामान्य निवासों के बजाय मन्दिर-परिसर के भवनों या संरचनाओं की ओर संकेत करता है।
- source_word: הִשְׁחִיתוּ
  choice: बरबाद कर दिया था
  rationale: שחת के हिफ़ील रूप में नष्ट, खराब या बरबाद करने का भाव है। ‘बरबाद’ गंभीर क्षति को व्यक्त करता है, पर पूर्ण विनाश को अनिवार्य नहीं बनाता।
- source_word: מַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं
  rationale: इब्रानी संबंध-पदबंध का सीधा अनुवाद।
