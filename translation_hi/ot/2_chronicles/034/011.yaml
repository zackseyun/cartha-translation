- source_word: לִקְנוֹת
  choice: खरीदें
  rationale: קנה के infinitive का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: אַבְנֵי מַחְצֵב
  choice: खदान से निकाले हुए पत्थर
