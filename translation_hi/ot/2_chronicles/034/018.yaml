base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/018.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book,” and Shaphan read from it before the king.
translation:
  language: hi
  text: तब शापान, राजकीय लेखक, ने राजा को बताया, “हिल्कियाह याजक ने मुझे एक पुस्तक[a] दी है।” फिर शापान ने उसमें से राजा के सामने पढ़कर सुनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक लपेटा हुआ ग्रंथ।” इब्रानी शब्द सामान्य रूप से किसी लिखित दस्तावेज़ या पुस्तक के लिए आ सकता है; उस समय उसका भौतिक रूप प्रायः एक लपेटा हुआ ग्रंथ होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: हिफ़ील रूप यहाँ सूचना देने या बताने का अर्थ देता है; ‘बताया’ सहज आधुनिक हिन्दी है।
- source_word: הַסּוֹפֵר
  choice: शास्त्री
  rationale: सֹפֵר राजकीय लेखक या सचिव को सूचित कर सकता है। ‘शास्त्री’ बाइबलीय ऐतिहासिक पदनाम को बनाए रखता है, यद्यपि यहाँ उसका कार्य राजकीय लेखक का है।
- source_word: סֵפֶר
  choice: पुस्तक
  rationale: यह शब्द किसी लिखित ग्रंथ या दस्तावेज़ के लिए व्यापक रूप से प्रयुक्त होता है; ‘पुस्तक’ स्वाभाविक है और उसकी भौतिक आकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נָתַן לִי
  choice: मुझे ... दी है
  rationale: पूर्ण हुई क्रिया का वर्तमान प्रसंग से संबंध है, क्योंकि पुस्तक अब शापान के पास है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: हिल्कियाह याजक
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया और पदनाम הַכֹּהֵן को ‘याजक’ अनूदित किया गया।
- source_word: וַיִּקְרָא בוֹ
  choice: उसमें से ... पढ़कर सुनाया
  rationale: בּוֹ को ‘उसमें से’ द्वारा व्यक्त किया गया है और राजकीय श्रोता के सामने ऊँचे स्वर में पढ़ने के भाव को स्वाभाविक हिन्दी में ‘पढ़कर सुनाया’ कहा गया है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: यह राजा की उपस्थिति में पढ़े जाने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
