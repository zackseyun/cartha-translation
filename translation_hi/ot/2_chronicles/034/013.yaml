  text: They were over the burden-bearers and supervised everyone doing work for service after service; and some of the Levites were scribes[a], officers, and gatekeepers.
translation:
  language: hi
  text: वे बोझ ढोनेवालों के ऊपर नियुक्त थे और सेवा के एक-एक काम के लिए हर काम करनेवाले की देखरेख करते थे। लेवियों में से कुछ लिपिक, अधिकारी और द्वारपाल थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל הַסַּבָּלִים
  choice: बोझ ढोनेवालों के ऊपर नियुक्त थे
  rationale: סַבָּלִים विशेष रूप से भार उठाने या ढोनेवालों को दर्शाता है, और עַל यहाँ प्रशासनिक देखरेख अथवा अधिकार का भाव देता है।
- source_word: וּמְנַצְּחִים
  choice: देखरेख करते थे
  rationale: इस प्रसंग में נצח का कृदन्त काम का निरीक्षण और निर्देशन करने का अर्थ देता है।
- source_word: לְכֹל עֹשֵׂה מְלָאכָה
  choice: लगे सभी काम करनेवालों
  rationale: 'वाक्यांश का व्यापक और वितरणात्मक भाव रखा गया है: काम में लगे प्रत्येक व्यक्ति पर उनकी देखरेख थी।'
- source_word: לַעֲבוֹדָה וַעֲבוֹדָה
  choice: सेवा के एक-एक काम
  rationale: इब्रानी में עֲבוֹדָה की पुनरावृत्ति विभिन्न कार्यों में वितरण का भाव देती है। ‘एक-एक काम’ उस पुनरावृत्ति का बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמֵהַלְוִיִּם
  choice: लेवियों में से कुछ
  rationale: מִן का प्रयोग अंशवाचक है; सभी लेवी नहीं, बल्कि उनमें से कुछ आगे बताए पदों पर थे।
- source_word: סוֹפְרִים
  choice: लेखक
  rationale: סֹפְרִים लिखने और अभिलेख रखनेवाले व्यक्तियों को सूचित करता है; ‘लेखक’ आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: שֹׁטְרִים
  choice: अधिकारी
  rationale: यह शब्द प्रशासनिक अथवा पर्यवेक्षकीय जिम्मेदारी रखनेवाले पदाधिकारियों के लिए प्रयुक्त है।
- source_word: שׁוֹעֲרִים
  choice: द्वारपाल
  rationale: यह मंदिर के द्वारों पर नियुक्त सेवकों का सीधा और प्रचलित हिन्दी पद है।
