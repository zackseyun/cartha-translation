  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रशासनिक पदों के लिए प्रचलित हिन्दी शब्द चुने गए हैं, और इब्रानी की असामान्य पुनरावृत्ति का भाव मुख्य पाठ तथा पादटिप्पणी दोनों में सुरक्षित रखा गया है।
