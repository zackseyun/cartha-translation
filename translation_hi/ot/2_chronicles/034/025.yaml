source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי ו/יקטירו לֵֽ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣י יְדֵי/הֶ֑ם וְ/תִתַּ֧ךְ חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/025.yaml
  text: Because they have forsaken me and burned incense to other gods[a], so as to provoke me to anger by all the works of their hands[b], my wrath will be poured out on this place and will not be quenched.
translation:
  language: hi
  text: क्योंकि उन्होंने मुझे त्याग दिया और दूसरे देवताओं[a] को धूप जलाई, ताकि अपने हाथों के सब कामों[b] से मुझे क्रोधित करें, मेरा प्रकोप इस स्थान पर उंडेला जाएगा और वह नहीं बुझेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पराए देवताओं’। इब्रानी में शाब्दिक रूप से ‘दूसरे देवताओं’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने हाथों के सब कामों’ में उनके बनाए हुए और किए हुए कार्य व्यापक रूप से शामिल हो सकते हैं, विशेषकर मनुष्य-निर्मित मूर्तियाँ और उनसे जुड़े कर्म।
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह इब्रानी मुहावरा आने वाले न्याय का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में उसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲזָבוּנִי
  choice: उन्होंने मुझे त्याग दिया
  rationale: עזב का अर्थ ‘त्यागना’ या ‘छोड़ देना’ है। धार्मिक और वाचागत विश्वासघात के इस संदर्भ में ‘त्याग दिया’ गंभीरता को बनाए रखता है।
- source_word: וַיַּקְטִירוּ
  choice: धूप जलाई
  rationale: קטר का हिफ़ील रूप यहाँ देवताओं के लिए धूप अथवा धूम-भेंट जलाने को सूचित करता है; ‘धूप जलाई’ सटीक और सामान्य हिन्दी अभिव्यक्ति है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है। यह चयन मूल की वाचागत और मूर्तिपूजासंबंधी भाषा को बिना व्याख्यात्मक विस्तार के रखता है।
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: ताकि ... मुझे क्रोधित करें
  rationale: לְמַעַן उद्देश्य अथवा परिणाम व्यक्त कर सकता है। ‘ताकि’ उस वास्तविक अस्पष्टता को बनाए रखता है, जबकि ‘मुझे क्रोधित करें’ כעס के हिफ़ील अर्थ को स्पष्ट करता है।
- source_word: בְּכֹל מַעֲשֵׂי יְדֵיהֶם
  choice: अपने हाथों के बनाए सब कामों से
  rationale: यह हाथों से बनाई वस्तुओं तथा किए गए कार्यों—विशेषकर मूर्तियों और उनसे जुड़े कर्मों—दोनों की ओर संकेत कर सकता है। हिन्दी में मुहावरे की दृश्यता और व्यापकता दोनों रखी गई हैं।
- source_word: וְתִתַּךְ חֲמָתִי
  choice: इसलिए मेरा प्रकोप ... उंडेला जाएगा
  rationale: נתך के साथ חֵמָה उंडेले जाने का रूपक प्रस्तुत करता है। ‘प्रकोप’ न्यायपूर्ण तीव्र क्रोध को गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘इसलिए’ कारण से परिणाम की कड़ी स्पष्ट करता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान पर
  rationale: यह न्याय के लक्ष्य के रूप में उस स्थान को दर्शाता है; ‘इस स्थान पर’ स्वाभाविक हिन्दी है।
- source_word: וְלֹא תִכְבֶּה
  choice: और वह नहीं बुझेगा
  rationale: כבה आग बुझने की छवि रखता है। ‘नहीं बुझेगा’ प्रकोप के लिए प्रयुक्त मूल रूपक को संक्षिप्त और स्पष्ट रूप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय की भाषा को न नरम करना, न बाद की धर्मवैज्ञानिक श्रेणियों से अधिक स्पष्ट करना
  choice: मेरा प्रकोप इस स्थान पर उंडेला जाएगा और वह नहीं बुझेगा
  alternative: मेरा कोप इस स्थान पर बरसेगा और शांत नहीं होगा
  rationale: चयन मूल के ‘उंडेले जाने’ और ‘न बुझने’ के संयुक्त रूपकों को बनाए रखता है तथा न्याय की तीव्रता को बिना अतिरिक्त सिद्धान्त जोड़े व्यक्त करता है।
- issue: प्रथम पुरुष में परमेश्वर का संदर्भ
  choice: मुझे / मेरा
  alternative: यहोवा को / यहोवा का
  rationale: इब्रानी पाठ में वक्ता प्रथम पुरुष में बोलता है। इसलिए नाम जोड़ने के बजाय सर्वनाम रखना स्रोत के अधिक निकट है।
- issue: לְמַעַן में उद्देश्य और परिणाम का संबंध
  choice: ताकि ... मुझे क्रोधित करें
  alternative: जिसके परिणामस्वरूप उन्होंने मुझे क्रोधित किया
  rationale: ‘ताकि’ उद्देश्य या अभिप्रेत परिणाम दोनों को खुला रखता है और पाठ की नैतिक तीक्ष्णता को कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पठन के योग्य रूप अपनाया गया है। ‘त्याग दिया’, ‘प्रकोप’ और ‘उंडेला जाएगा’ मूल की गंभीर न्याय-भाषा को रखते हैं; फुटनोट मुहावरे और वैकल्पिक शब्दार्थ को बिना मुख्य पाठ को बोझिल किए स्पष्ट करते हैं।
