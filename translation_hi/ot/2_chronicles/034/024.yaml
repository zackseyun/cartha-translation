  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יוֹשְׁבָ֑י/ו אֵ֤ת כָּל הָ/אָלוֹת֙ הַ/כְּתוּב֣וֹת עַל הַ/סֵּ֔פֶר אֲשֶׁ֣ר קָֽרְא֔וּ לִ/פְנֵ֖י מֶ֥לֶךְ יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/024.yaml
  text: 'Thus says Yahweh: Behold[b][a], I am bringing disaster on this place and on its inhabitants—all the curses written in the book that they have read before the king of Judah.'
translation:
  language: hi
  text: 'यहोवा यह कहता है: “देखो, मैं इस स्थान और इसके निवासियों पर विपत्ति ले आ रहा हूँ—अर्थात् वे सभी शाप[a] जो उस पुस्तक[b] में लिखे हैं, जिसे उन्होंने यहूदा के राजा के सामने पढ़ा है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शपथ-शाप”; यह शपथ से जुड़े दण्डकारी शापों का संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पुस्तक”; यह शब्द किसी स्क्रॉल के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: भविष्यद्वाणी के संदेशवाहक-सूत्र को स्पष्ट, संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: इब्रानी उद्घोषणा की ध्यान आकर्षित करने वाली शक्ति और गंभीरता को बनाए रखता है।
- source_word: מֵבִיא רָעָה
  choice: विपत्ति लाने वाला हूँ
  rationale: संदर्भ में רָעָה नैतिक बुराई नहीं, बल्कि दण्डस्वरूप आने वाली विनाशकारी विपत्ति है। यह चयन आशय को स्पष्ट रखते हुए उसकी गंभीरता बनाए रखता है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान
  rationale: पाठ से आगे बढ़कर यरूशलेम या यहूदा को स्पष्ट रूप से जोड़ने के बजाय संकेतवाचक वाक्यांश को यथावत रखा गया है।
- source_word: יוֹשְׁבָיו
  choice: इसके निवासियों
  rationale: सहभागी संज्ञा और उसके संबंधसूचक प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: אֵת כָּל הָאָלוֹת
  choice: वे सभी शाप
  rationale: אָלָה यहाँ वाचा के उल्लंघन पर लागू होने वाले शापों को दर्शाता है। मुख्य पाठ में सरल ‘शाप’ रखा गया और शपथ-वाचा संबंधी सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: הַכְּתוּבוֹת עַל הַסֵּפֶר
  choice: जो उस पुस्तक में लिखे हैं
  rationale: हिन्दी में किसी लिखित दस्तावेज़ की सामग्री के लिए ‘पुस्तक में लिखे’ स्वाभाविक है; סֵפֶר के ‘ग्रंथ-पत्र’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר קָרְאוּ לִפְנֵי
  choice: जिसे उन्होंने ... के सामने पढ़ा है
  rationale: इब्रानी क्रिया के सक्रिय बहुवचन को अनिर्दिष्ट ‘उन्होंने’ द्वारा सुरक्षित रखा गया है; पूर्ण क्रिया का हाल की घटना से संबंध हिन्दी पूर्णकाल में व्यक्त हुआ है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: इब्रानी संबंध-रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעָה का स्वरूप
  choice: विपत्ति
  alternative: बुराई; अनर्थ
  rationale: यह पद वाचा के उल्लंघन पर आने वाले दण्ड की बात करता है। ‘विपत्ति’ नैतिक बुराई का अर्थ आरोपित किए बिना न्याय की विनाशकारी गंभीरता व्यक्त करती है।
- issue: אָלָה में वाचा और शपथ का भाव
  choice: मुख्य पाठ में ‘शाप’, पादटिप्पणी में शपथ-वाचा का संकेत
  alternative: मुख्य पाठ में ‘शपथ के शाप’
  rationale: ‘शाप’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी मूल शब्द के अधिक तकनीकी वाचागत भाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की उद्घोषणा के अनुरूप गरिमापूर्ण रखी गई है। ‘देखो’ मूल की ध्यानाकर्षक गंभीरता बनाए रखता है। अनिर्दिष्ट सक्रिय बहुवचन ‘उन्होंने’ को कर्मवाच्य बनाकर छिपाया नहीं गया है।
