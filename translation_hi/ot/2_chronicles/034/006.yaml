  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक-वर्णन शैली अपनाई गई है। कठिन अंतिम वाक्यांश को मुख्य पाठ में प्रसंगानुकूल रूप दिया गया है और वास्तविक पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
