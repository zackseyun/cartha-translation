base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/006.yaml
  text: and in the cities of Manasseh and Ephraim and Simeon[a], even as far as Naphtali[b], in their surrounding ruins.
translation:
  language: hi
  text: और मनश्शे, एप्रैम और शिमोन के नगरों में, नप्ताली तक भी, उनके आसपास के उजाड़ स्थानों में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का अंतिम इब्रानी वाक्यांश कठिन है। प्रसंग के आधार पर इसे “उनके आसपास के उजाड़ स्थानों में” समझा जाता है। व्यंजनात्मक पाठ को अधिक शाब्दिक रूप से “उनके घरों में, चारों ओर” भी पढ़ा जा सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/עָרֵי
  choice: और ... के नगरों में
  rationale: संयोजक और स्थानसूचक उपसर्ग दोनों को व्यक्त करता है; ऐतिहासिक वर्णन में עָרִים के लिए ‘नगर’ स्वाभाविक है।
- source_word: מְנַשֶּׁה וְ/אֶפְרַיִם וְ/שִׁמְעוֹן
  choice: मनश्शे, एप्रैम और शिमोन
  rationale: गोत्रीय और भौगोलिक नामों का प्रचलित हिन्दी लिप्यंतरण; मूल के संयोजन को सूची में स्वाभाविक हिन्दी ढंग से रखा गया है।
- source_word: וְ/עַד נַפְתָּלִי
  choice: यहाँ तक कि नप्ताली तक
  rationale: עַד गतिविधि की भौगोलिक सीमा बताता है; यह प्रयोग उस विस्तृत पहुँच पर बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ב/הר בתי/הם סָבִיב
  choice: उनके चारों ओर के उजाड़ स्थानों में
  rationale: यह वाक्यांश पाठ की दृष्टि से कठिन है। व्यंजनात्मक रूप ‘उनके घर’ जैसा पढ़ा जा सकता है, पर प्रसंग उजड़े अथवा ध्वस्त क्षेत्रों की ओर संकेत करता है; ‘चारों ओर’ סָבִיב का अर्थ रखता है।
