  text: וְ/עַצְמוֹת֙ כֹּֽהֲנִ֔ים שָׂרַ֖ף עַל מזבחותים וַ/יְטַהֵ֥ר אֶת יְהוּדָ֖ה וְ/אֶת יְרוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/005.yaml
  text: He burned the bones of the priests on their altars[a], and he cleansed Judah and Jerusalem.
translation:
  language: hi
  text: उसने याजकों की हड्डियाँ उनकी वेदियों[a] पर जला दीं और यहूदा तथा यरूशलेम को शुद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वेदियों।’ यहाँ इब्रानी रूप असामान्य है; आशय यह है कि योशिय्याह ने याजकों की हड्डियाँ उनसे जुड़ी वेदियों पर जलाईं।
    reason: textual_variant
lexical_decisions:
- source_word: וְ/עַצְמוֹת כֹּהֲנִים
  choice: याजकों की हड्डियाँ
  rationale: עַצְמוֹת, עֶצֶם का बहुवचन संबंधसूचक रूप है और यहाँ वास्तविक हड्डियों को दर्शाता है। כֹּהֲנִים का अर्थ ‘याजक’ है; मूल पाठ इस पद में उन्हें अलग से ‘मूर्तिपूजक’ नहीं कहता, इसलिए वह विशेषण नहीं जोड़ा गया। आरंभिक וְ को स्वाभाविक हिन्दी वाक्य-प्रवाह में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: שָׂרַף
  choice: जला दीं
  rationale: यह שׂרף का काल रूप है, जिसका अर्थ ‘जलाना’ है। स्त्रीलिंग बहुवचन कर्म ‘हड्डियाँ’ के अनुरूप ‘जला दीं’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עַל מזבחותים
  choice: उनकी वेदियों पर
  rationale: עַל का सीधा अर्थ ‘पर’ है। מזבחותים का रूप असामान्य है, पर प्रसंग में याजकों से जुड़ी वेदियाँ अभिप्रेत हैं; ‘उनकी वेदियों’ से संभावित सर्वनामिक अर्थ सुरक्षित रहता है और पाठ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाया जाता।
- source_word: וַ/יְטַהֵר
  choice: और ... को शुद्ध किया
  rationale: טהר के पिएल रूप का अर्थ यहाँ उपासना-संबंधी अशुद्धता दूर करके शुद्ध करना है। ‘शुद्ध किया’ आधुनिक हिन्दी में इसके अनुष्ठानिक और नैतिक दोनों आयामों को समेटता है।
- source_word: אֶת יְהוּדָה וְ/אֶת יְרוּשָׁלִָם
  choice: यहूदा तथा यरूशलेम
  rationale: दोनों स्थान प्रत्यक्ष कर्म हैं। मानक हिन्दी बाइबलीय नाम ‘यहूदा’ और ‘यरूशलेम’ रखे गए हैं; ‘तथा’ इस संयुक्त पदबंध में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: शुद्ध करने का स्वरूप
  choice: मूर्तिपूजक उपासना से उत्पन्न धार्मिक-नैतिक अशुद्धता को यहूदा और यरूशलेम से दूर करना
  alternative: केवल अनुष्ठानिक शुद्धि अथवा केवल भौतिक सफाई और विनाश
  rationale: सुधार के इस प्रसंग में טהר अवैध उपासना से जुड़ी अशुद्धता हटाने को दर्शाता है। ‘शुद्ध किया’ इस व्यापक अर्थ को बनाए रखता है, पर पाठ में बाद की कोई विशिष्ट धार्मिक धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘वेदियों’ और ‘शुद्ध किया’ जैसे स्थापित धार्मिक शब्द मूल के उपासना-संबंधी संदर्भ को स्पष्ट रखते हैं।
