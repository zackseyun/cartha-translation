  text: וַ/יָּ֨סַר יֹֽאשִׁיָּ֜הוּ אֶת כָּל הַ/תּוֹעֵב֗וֹת מִֽ/כָּל הָ/אֲרָצוֹת֮ אֲשֶׁ֣ר לִ/בְנֵ֣י יִשְׂרָאֵל֒ וַֽ/יַּעֲבֵ֗ד אֵ֤ת כָּל הַ/נִּמְצָא֙ בְּ/יִשְׂרָאֵ֔ל לַ/עֲב֖וֹד אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם כָּל יָמָ֕י/ו לֹ֣א סָ֔רוּ מֵֽ/אַחֲרֵ֕י יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/033.yaml
  text: And Josiah removed all the abominations from all the lands that belonged to the sons of Israel[a], and he made all who were found in Israel serve Yahweh their God. All his days they did not turn away from following Yahweh[d][c][b], the God of their fathers.
translation:
  language: hi
  text: योशिय्याह ने इस्राएलियों के सभी प्रदेशों से सभी घृणित वस्तुएँ हटा दीं[a] और इस्राएल में उपस्थित सभी लोगों से उनके परमेश्वर यहोवा की सेवा कराई[b]। योशिय्याह के जीवन भर वे अपने पूर्वजों के परमेश्वर यहोवा का अनुसरण करने से नहीं हटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों के सभी प्रदेशों से।” यहाँ आशय इस्राएलियों के अधिकार या निवास वाले प्रदेशों से है। “घृणित वस्तुएँ” में मूर्तिपूजा से जुड़ी घृणित प्रथाएँ भी शामिल हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद “इस्राएल में पाए गए सभी लोगों से” भी हो सकता है। मूल क्रिया कारक है: योशिय्याह ने उनसे यहोवा की सेवा कराई।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: हटा दीं
  rationale: हिफ़ील रूप यहाँ दूर करने या हटा देने का अर्थ देता है; यह सुधार के प्रसंग में सहज और सटीक है।
- source_word: הַתּוֹעֵבוֹת
  choice: घृणित वस्तुएँ
  rationale: यह शब्द मूर्तिपूजा से जुड़ी घृणित वस्तुओं और प्रथाओं को समेट सकता है। ‘वस्तुएँ’ प्रसंग में ठोस उपासना-सामग्री को संकेतित करता है, जबकि टिप्पणी व्यापक अर्थ बताती है।
- source_word: מִכָּל הָאֲרָצוֹת אֲשֶׁר לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के सभी प्रदेशों से
  rationale: बहुवचन אֲרָצוֹת के लिए ‘प्रदेशों’ और בני ישראל के सामुदायिक अर्थ के लिए स्वाभाविक हिन्दी ‘इस्राएलियों’ चुना गया है।
- source_word: וַיַּעֲבֵד
  choice: से ... सेवा कराई
  rationale: עבד का हिफ़ील रूप स्पष्टतः कारक है। ‘सेवा कराई’ योशिय्याह की सक्रिय राजकीय कार्रवाई को बनाए रखता है, पर अनावश्यक रूप से शारीरिक बल का अर्थ नहीं जोड़ता।
- source_word: כָּל הַנִּמְצָא בְּיִשְׂרָאֵל
  choice: इस्राएल में उपस्थित सभी लोगों
  rationale: निफ़ाल कृदंत का शाब्दिक अर्थ ‘पाए गए’ है, पर यहाँ आशय वहाँ मौजूद लोगों से है; ‘उपस्थित’ आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵיהֶם
  choice: उनके परमेश्वर यहोवा की सेवा
  rationale: ‘सेवा’ उपासना सहित व्यापक वाचा-निष्ठा को व्यक्त करती है और मूल क्रिया के अर्थ को ‘आराधना’ तक सीमित नहीं करती।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित, पहचाना जाने वाला व्यक्तिगत नाम ‘यहोवा’ टेट्राग्राम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: כָּל יָמָיו
  choice: उसके जीवन भर
  rationale: मुहावरे का आशय योशिय्याह के जीवित रहने की पूरी अवधि है; यह हिन्दी में ‘उसके सब दिनों’ से अधिक स्वाभाविक है।
- source_word: לֹא סָרוּ מֵאַחֲרֵי יְהוָה
  choice: यहोवा के पीछे चलना छोड़कर नहीं हटे
  rationale: यह रूप ‘पीछे चलने’ की मूल रूपकात्मक भाषा और उससे विमुख न होने, दोनों को बनाए रखता है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: אבות का सामूहिक आशय पिछली पीढ़ियों से है; ‘पूर्वजों’ वर्तमान हिन्दी में स्पष्ट है और वाचा की पीढ़ीगत निरंतरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ नाम को सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: וַיַּעֲבֵד में योशिय्याह की कारक भूमिका
  choice: से ... सेवा कराई
  alternative: सेवा करने को प्रेरित किया / सेवा करने के लिए बाध्य किया
  rationale: कारक रूप को स्पष्ट रखा गया है। ‘प्रेरित किया’ मूल की शक्ति घटाता और ‘बाध्य किया’ संभावित बलपूर्वकता को आवश्यकता से अधिक निश्चित करता।
- issue: अंतिम बहुवचन कर्ता का संदर्भ
  choice: वे
  alternative: इस्राएल में उपस्थित सभी लोग
  rationale: हिब्रू में बहुवचन कर्ता निहित है और निकटतम सामूहिक संदर्भ इस्राएल में उपस्थित लोग हैं। सर्वनाम मूल की संक्षिप्तता और उसके संदर्भ को बनाए रखता है।
- issue: אבות का लिंग-संबंधी रूप
  choice: पूर्वजों
  alternative: पितरों / बाप-दादों
  rationale: यहाँ वाचा-सूत्र पिछली पीढ़ियों को सूचित करता है। ‘पूर्वजों’ अर्थ को बिना किसी निजी धर्मवैज्ञानिक विस्तार के स्वाभाविक आधुनिक हिन्दी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य में राजकीय सुधार की सक्रियता तथा यहोवा के पीछे चलने का हिब्रू रूपक सुरक्षित है; अत्यधिक शाब्दिक और असहज हिन्दी से बचा गया है।
