base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/027.yaml
  text: Because your heart was tender[a], and you humbled yourself before God when you heard his words against this place and against its inhabitants, and because you humbled yourself before me and tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: hi
  text: क्योंकि तुम्हारा हृदय कोमल था[a], और जब तुमने इस स्थान और इसके निवासियों के विरुद्ध परमेश्वर के वचन सुने, तब तुमने अपने आपको उसके सामने नम्र किया; और तुमने मेरे सामने अपने आपको नम्र किया, अपने वस्त्र फाड़े और मेरे सामने रोए—इसलिए मैंने भी तुम्हें सुना है; याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारा हृदय नरम था।” यह इब्रानी मुहावरा ग्रहणशील और विनम्र आंतरिक मनोभाव को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह पद में दिए गए परमेश्वर के उत्तर का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक रूप से कारणसूचक है।
- source_word: רַךְ לְבָבְךָ
  choice: तुम्हारा हृदय कोमल था
  rationale: रַךְ का मूल अर्थ ‘कोमल/नरम’ है। हृदय के साथ यह ग्रहणशील और विनम्र आंतरिक मनोभाव बताता है, न कि दुर्बलता।
- source_word: וַתִּכָּנַע
  choice: तुमने अपने आपको दीन किया
  rationale: כנע का निफ़अल रूप यहाँ स्वेच्छा से स्वयं को नम्र करने का भाव देता है। दोनों आवृत्तियों में एक ही अनुवाद रखकर मूल की पुनरुक्ति सुरक्षित की गई है।
- source_word: מִלִּפְנֵי אֱלֹהִים / לְפָנַי
  choice: परमेश्वर के सामने / मेरे सामने
  rationale: ये पद परमेश्वर की उपस्थिति में विनम्र होने का भाव देते हैं। प्रत्यक्ष ईश्वरीय वाणी में ‘मेरे सामने’ की पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
- source_word: בְּשָׁמְעֲךָ
  choice: जब तुमने ... सुने
  rationale: उपसर्ग ב के साथ infinitive construct यहाँ कालवाचक है; हिन्दी में ‘जब ... सुने’ स्पष्ट और स्वाभाविक है।
- source_word: דְּבָרָיו
  choice: परमेश्वर के वचन
  rationale: सर्वनाम का संदर्भ परमेश्वर से है। हिन्दी में अस्पष्टता से बचाने के लिए संज्ञा दोहराई गई है, जबकि ‘वचन’ मूल के बहुवचन और धार्मिक संदर्भ दोनों के अनुकूल है।
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: इस स्थान और इसके निवासियों के विरुद्ध
  rationale: न्याय के इस संदर्भ में עַל विरोधात्मक दिशा व्यक्त करता है। ‘के विरुद्ध’ आने वाले दंड-वचन का भाव सुरक्षित रखता है।
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: अपने वस्त्र फाड़े
  rationale: यह शोक और पश्चात्ताप का पारंपरिक संकेत है। ‘वस्त्र’ dignified और सामान्य हिन्दी दोनों में सुबोध है।
- source_word: וַתֵּבְךְּ
  choice: रोए
  rationale: בכה गंभीर शोक में रोने को व्यक्त करता है; ‘रोए’ सरल, स्वाभाविक और अर्थ-सटीक है।
- source_word: וְגַם אֲנִי שָׁמַעְתִּי
  choice: इसलिए मैंने भी तुम्हारी सुन ली है
  rationale: ‘भी’ मूल के גַם को सुरक्षित रखता है। निहित कर्म को हिन्दी मुहावरे ‘तुम्हारी सुन ली’ से स्पष्ट किया गया है; ‘इसलिए’ आरंभिक कारण-वाक्य को मुख्य उत्तर से स्वाभाविक रूप से जोड़ता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם औपचारिक ईश्वरीय उद्घोषणा का सूत्र है। ‘घोषणा’ उसका भार बनाए रखती है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: ‘हृदय कोमल था’ का आशय
  choice: शाब्दिक रूपक को बनाए रखा गया
  alternative: तुम ग्रहणशील/विनम्र थे
  rationale: मूल का हृदय-संबंधी रूपक ग्रहणशीलता और नम्रता दोनों का संकेत देता है। मुख्य पाठ में रूपक रखने और पादटिप्पणी में आशय समझाने से इसकी अर्थ-समृद्धि बनी रहती है।
- issue: עַל का न्याय-संदर्भ में संबंध
  choice: के विरुद्ध
  alternative: के विषय में
  rationale: आसपास का संदर्भ इस स्थान और निवासियों पर घोषित न्याय का है। फिर भी ‘के विषय में’ व्याकरणतः संभव है; ‘के विरुद्ध’ प्रसंगगत दिशा अधिक स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। मूल की कारणात्मक संरचना, ‘अपने आपको दीन किया’ की पुनरावृत्ति, शोक के बाहरी संकेत और ईश्वरीय घोषणा का औपचारिक स्वर बनाए रखा गया है।
