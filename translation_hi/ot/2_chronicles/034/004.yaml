base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/004.yaml
  text: They tore down before him the altars of the Baals[a], and he cut down the incense altars that were above them. He shattered and crushed the Asherim, the carved images, and the metal images[b], and scattered them over the graves of those who had sacrificed to them.
translation:
  language: hi
  text: उसके सामने बाल देवताओं की वेदियाँ ढा दी गईं, और उनके ऊपर जो धूप-स्तंभ[a] थे, उन्हें उसने काट गिराया। उसने अशेरिम[b], खुदी हुई मूर्तियों और धातु की ढली हुई मूर्तियों को तोड़कर चूर-चूर कर दिया और उनका चूरा उन लोगों की कब्रों पर बिखेर दिया जो उनके लिए बलि चढ़ाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूर्य-स्तंभ।” इब्रानी शब्द का ठीक अर्थ अनिश्चित है; संभव है कि यह सूर्य-उपासना से जुड़े पूजापरक स्तंभों को दर्शाता हो।
    reason: lexical_alternative
  - marker: b
    text: या, “अशेरा के खंभे।” मूल शब्द अशेरा से जुड़ी पूजापरक वस्तुओं के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַתְּצוּ
  choice: ढा दी गईं
  rationale: इब्रानी क्रिया बहुवचन है, पर कर्ता व्यक्त नहीं है। हिंदी का कर्मवाच्य इस अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक रूप से व्यक्त करता है और योशिय्याह को स्वयं वेदियाँ ढानेवाला नहीं बनाता।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह योशिय्याह की उपस्थिति में कार्य किए जाने का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: מִזְבְּחוֹת הַבְּעָלִים
  choice: बाल देवताओं की वेदियाँ
  rationale: इब्रानी में ‘बाल’ बहुवचन है; ‘बाल देवताओं’ से विभिन्न स्थानीय बाल-रूपों या उपासना-रूपों का संकेत सुरक्षित रहता है।
- source_word: הַחַמָּנִים
  choice: धूप-स्तंभ
  rationale: शब्द का सटीक अर्थ अनिश्चित है और यह संभवतः सूर्य-उपासना से जुड़े पूजापरक स्तंभों को दर्शाता है। ‘धूप-स्तंभ’ प्रसंग में उपासना-सामग्री का बोध कराता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר לְמַעְלָה מֵעֲלֵיהֶם
  choice: उनके ऊपर जो ... थे
  rationale: संबंधवाचक उपवाक्य को निकटवर्ती ‘धूप-स्तंभों’ से जोड़ते हुए उनकी वेदियों के ऊपर की स्थिति स्पष्ट की गई है।
- source_word: גִּדֵּעַ
  choice: काट गिराया
  rationale: क्रिया काटकर गिराने या छाँट देने का भाव रखती है; यह स्तंभनुमा पूजापरक वस्तुओं के विनाश के लिए स्वाभाविक हिंदी है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-चिह्नों
  rationale: यह रूप अशेरा से संबद्ध पूजापरक वस्तुओं को दर्शाता है, पर उन्हें निश्चित रूप से केवल लकड़ी के खंभे मानकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: הַפְּסִלִים
  choice: खुदी हुई मूर्तियों
  rationale: यह तराशी या खोदकर बनाई गई पूजापरक प्रतिमाओं को सामान्य ‘मूर्तियों’ की अपेक्षा अधिक सटीक ढंग से व्यक्त करता है।
- source_word: הַמַּסֵּכוֹת
  choice: धातु की ढली हुई मूर्तियों
  rationale: इब्रानी शब्द साँचे में ढाली गई धातु-प्रतिमाओं को सूचित करता है; यह हिंदी रूप सामग्री और निर्माण-विधि दोनों स्पष्ट करता है।
- source_word: שִׁבַּר וְהֵדַק
  choice: तोड़कर चूर-चूर कर दिया
  rationale: दोनों क्रियाओं की क्रमिक तीव्रता—तोड़ना और बहुत बारीक कर देना—को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: וַיִּזְרֹק
  choice: उनका चूरा ... बिखेर दिया
  rationale: पहले चूर की गई वस्तुओं के अवशेषों को कब्रों पर फेंकने या फैलाने का आशय स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: הָאֲשֵׁרִים का अर्थ
  choice: अशेरा-चिह्न
  alternative: अशेरा के खंभे
  rationale: मूल शब्द अशेरा से संबद्ध पूजापरक वस्तुओं का द्योतक है, किंतु उनकी ठीक बनावट निश्चित नहीं है। मुख्य पाठ व्यापक अर्थ सुरक्षित रखता है और अधिक विशिष्ट व्याख्या पादटिप्पणी में देता है।
- issue: הַחַמָּנִים का अर्थ
  choice: धूप-स्तंभ
  alternative: सूर्य-स्तंभ
  rationale: शब्द का अर्थ विवादित है और संभवतः सूर्य-उपासना से संबद्ध पूजापरक स्तंभों को दर्शाता है। मुख्य पाठ प्रसंगानुकूल रूप देता है, जबकि दूसरी प्रबल संभावना पादटिप्पणी में सुरक्षित है।
- issue: मूर्तिपूजकों की कब्रों पर चूरा बिखेरना
  choice: उन लोगों की कब्रों पर ... जो उनके लिए बलि चढ़ाते थे
  alternative: उनके बलि चढ़ानेवालों की कब्रों पर
  rationale: संबंधवाचक वाक्य मूल के आशय को स्पष्ट करता है, बिना इस न्यायात्मक कार्य की कठोरता को नरम किए या कोई अतिरिक्त धार्मिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाल देवताओं’ से मूल का बहुवचन सुरक्षित है। अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक हिंदी कर्मवाच्य में व्यक्त किया गया है। पाठ में दोनों पादटिप्पणी-चिह्न संबंधित विवादित शब्दों के तुरंत बाद रखे गए हैं।
