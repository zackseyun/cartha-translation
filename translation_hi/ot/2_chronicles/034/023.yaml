base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/023.yaml
  text: 'And she said to them[a], “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: hi
  text: 'उसने उनसे कहा, “इस्राएल का परमेश्वर याहवे यों कहता है: जिस पुरुष ने तुम्हें मेरे पास भेजा है, उससे कहो—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר לָהֶם
  choice: उसने उनसे कहा
  rationale: स्त्रीलिंग क्रिया वक्ता हुल्दा की ओर संकेत करती है; हिन्दी में प्रसंग-सुलभ ‘उसने’ और बहुवचन संबोधन ‘उनसे’ मूल के अनुरूप हैं।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का प्रचलित संदेशवाहक-सूत्र है; हिन्दी में वर्तमानकालीन ‘यों कहता है’ उसके जीवंत और औपचारिक स्वर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह उपाधि नहीं, परमेश्वर का विशिष्ट इब्रानी नाम YHWH है; ‘यहोवा’ सामान्य हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक रचना को स्पष्ट और स्वाभाविक हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: אִמְרוּ לָאִישׁ
  choice: जिस पुरुष ... उससे कहो
  rationale: बहुवचन आज्ञार्थक क्रिया प्रतिनिधिमंडल को संबोधित है और אִישׁ एकवचन पुरुष को दर्शाता है; हिन्दी वाक्यक्रम में सम्बन्धवाचक उपवाक्य के साथ यह रूप अधिक स्वाभाविक है।
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: जिस पुरुष ने तुम्हें मेरे पास भेजा है
  rationale: सम्बन्धवाचक उपवाक्य प्रेषक को उसके कार्य से पहचानता है और ‘मेरे पास’ אֵלַי की दिशा को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निजी नाम YHWH है। मुख्य पाठ में नाम को उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण दिया गया है; वैकल्पिक उच्चारण पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ नबूवत के औपचारिक संदेश-सूत्र को बनाए रखता है। पद का कथन अगले पद में जारी रहता है, इसलिए अंत में डैश और खुला उद्धरण रखा गया है।
