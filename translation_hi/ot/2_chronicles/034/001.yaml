base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/001.yaml
  text: Josiah was eight years old when he became king, and he reigned thirty-one years in Jerusalem.
translation:
  language: hi
  text: योशिय्याह आठ वर्ष का था जब वह राजा बना, और उसने यरूशलेम में इकतीस वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: आठ वर्ष का था
  rationale: इब्रानी का शाब्दिक मुहावरा ‘आठ वर्षों का पुत्र’ आयु बताने का सामान्य ढंग है; आधुनिक हिंदी में ‘आठ वर्ष का था’ उसका स्वाभाविक और सटीक अर्थ देता है।
- source_word: יֹאשִׁיָּהוּ
  choice: योशिय्याह
  rationale: व्यक्तिनाम का रूप इब्रानी उच्चारण के निकट रखते हुए हिंदी बाइबलीय परंपरा के अनुरूप दिया गया है।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रचना उसके राजत्व आरंभ होने का समय बताती है; ‘जब वह राजा बना’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה
  choice: इकतीस वर्ष तक
  rationale: यह योशिय्याह के शासन की अवधि है; ‘तक’ हिंदी में अवधि को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: इब्रानी क्रिया का अर्थ राजा के रूप में शासन करना है; ‘राज किया’ सीधा और प्रचलित हिंदी रूप है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग का सीधा और स्वाभाविक हिंदी अनुवाद है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण ऐतिहासिक गद्य। आयु और शासन-अवधि के इब्रानी मुहावरों को शब्दशः रखने के बजाय स्वाभाविक हिंदी में व्यक्त किया गया है।
