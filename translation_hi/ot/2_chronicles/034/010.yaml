id: 2CH.34.10
reference: 2 Chronicles 34:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּתְּנ֗וּ עַל יַד֙ עֹשֵׂ֣ה הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתְּנ֨וּ אֹת֜/וֹ עוֹשֵׂ֣י הַ/מְּלָאכָ֗ה אֲשֶׁ֤ר עֹשִׂים֙ בְּ/בֵ֣ית יְהוָ֔ה לִ/בְדּ֥וֹק וּ/לְ/חַזֵּ֖ק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/010.yaml
  text: They put it into the hand of the workmen who were appointed over the house of Yahweh[b][a], and the workmen who were working in the house of Yahweh gave it for repairing and strengthening the house.
translation:
  language: hi
  text: उन्होंने वह धन उन कारीगरों के हाथ में सौंप दिया जो यहोवा के भवन[a] की देखरेख के लिए नियुक्त थे। फिर यहोवा के भवन में काम करनेवाले कारीगरों ने उसे भवन की मरम्मत करने और उसे मजबूत बनाने के लिए दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यहोवा का मंदिर।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: सौंप दिया / दे दिया
  rationale: נתן का अर्थ देना, रखना या सौंपना हो सकता है। पहले खंड में जिम्मेदारी के साथ हस्तांतरण के लिए ‘सौंप दिया’ और दूसरे में आगे दिए जाने के लिए ‘दे दिया’ स्वाभाविक है।
- source_word: עַל יַד
  choice: के हाथ में
  rationale: यह मुहावरा किसी के नियंत्रण या जिम्मेदारी में सौंपने को व्यक्त करता है; हिंदी में ‘हाथ में सौंपना’ वही ठोस बिंब और अर्थ रखता है।
- source_word: עֹשֵׂה הַמְּלָאכָה / עוֹשֵׂי הַמְּלָאכָה
  choice: कारीगर
  rationale: निर्माण और भवन-मरम्मत के प्रसंग में ‘कारीगर’ सामान्य ‘कामगार’ से अधिक सटीक और सहज है।
- source_word: הַמֻּפְקָדִים
  choice: देखरेख के लिए नियुक्त थे
  rationale: פקד का निष्क्रिय कृदंत नियुक्त किए गए पर्यवेक्षकों की जिम्मेदारी और अधिकार दोनों बताता है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन की / में
  rationale: पहले प्रयोग में पर्यवेक्षण के संबंध के कारण ‘भवन की’ और दूसरे में कार्यस्थल के कारण ‘भवन में’ रखा गया है। ‘भवन’ मूल के ‘घर’ को गरिमापूर्ण हिंदी में व्यक्त करता है और मंदिर का संकेत पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम पूर्ववर्ती प्रसंग के धन की ओर संकेत करता है; स्पष्टता के लिए आरंभ में ‘वह धन’ कहा गया और यहाँ सर्वनाम रखा गया है।
- source_word: לִבְדּוֹק
  choice: मरम्मत करने
  rationale: यद्यपि בדק अन्य संदर्भों में जाँचने का अर्थ दे सकता है, मंदिर-भवन के इस प्रसंग में संरचनात्मक दोष सुधारना अर्थात मरम्मत करना अभिप्रेत है।
- source_word: וּלְחַזֵּק
  choice: मजबूत बनाने
  rationale: हिफ़ील रूप का अर्थ भवन को दृढ़ या सुदृढ़ करना है; ‘मजबूत बनाने’ से यह सामान्य आधुनिक हिंदी में स्पष्ट रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की नीति के अनुसार चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिंदी पाठकों के बीच पहचाने जाने योग्य व्यक्तिगत नाम ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया, जिससे मूल का व्यक्तिगत वाचा-नाम सुरक्षित रहता है।
- issue: בֵּית יְהוָה का आशय
  choice: यहोवा का भवन
  alternative: यहोवा का मंदिर
  rationale: मुख्य पाठ में मूल ‘भवन/घर’ की अभिव्यक्ति बनाए रखी गई है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ मंदिर अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। लंबे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है। ‘वह धन’ पूर्ववर्ती संदर्भ को स्पष्ट करता है, जबकि मूल सर्वनाम का संबंध बना रहता है।
