base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/031.yaml
  text: Then the king stood in his place and made the covenant before Yahweh[a], to walk after Yahweh and to keep his commandments and his testimonies and his statutes with all his heart and with all his soul, to carry out the words of the covenant that were written in this book.
translation:
  language: hi
  text: तब राजा अपने स्थान पर खड़ा हुआ और उसने याहवे के सामने वाचा बाँधी कि वह याहवे के पीछे चलेगा, और पूरे मन और पूरे प्राण से उसकी आज्ञाओं, साक्ष्य-विधानों और विधियों का पालन करेगा, और इस पुस्तक[a] में लिखी वाचा की बातों को पूरा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ऐतिहासिक रूप से, “इस स्क्रॉल में।” इब्रानी शब्द किसी लिखित दस्तावेज़ का संकेत कर सकता है, विशेषकर स्क्रॉल के रूप में।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד הַמֶּלֶךְ עַל־עָמְדוֹ
  choice: राजा अपने स्थान पर खड़ा हुआ
  rationale: यह पदबंध राजा के निर्धारित स्थान पर खड़े होने को व्यक्त करता है; ‘अपने स्थान पर’ स्वाभाविक है और स्थापत्य संबंधी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: उसने वाचा बाँधी
  rationale: כרת ברית वाचा स्थापित करने का रूढ़ इब्रानी मुहावरा है। हिन्दी में ‘वाचा बाँधना’ उसके औपचारिक और गंभीर स्वर को स्वाभाविक ढंग से रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह औपचारिक कार्य यहोवा की उपस्थिति में किए जाने का भाव रखता है।
- source_word: לָלֶכֶת אַחֲרֵי יְהוָה
  choice: यहोवा के पीछे चलेगा
  rationale: ‘पीछे चलना’ मूल के चलने वाले वाचाई रूपक को सुरक्षित रखता है और निष्ठापूर्वक अनुसरण का अर्थ देता है।
- source_word: לִשְׁמוֹר
  choice: पालन करेगा
  rationale: आज्ञा और व्यवस्था के संदर्भ में שמר का आशय ध्यानपूर्वक मानना और आचरण में लाना है; आधुनिक हिन्दी में ‘पालन करना’ सर्वाधिक स्वाभाविक है।
- source_word: מִצְוֺתָיו וְעֵדְוֺתָיו וְחֻקָּיו
  choice: उसकी आज्ञाओं, चितौनियों और विधियों
  rationale: तीनों अलग कानूनी-वाचाई शब्दों का भेद बनाए रखा गया है। ‘चितौनियाँ’ עֵדוֹת के साक्ष्य/स्मरण कराने वाले निर्देशों का पारंपरिक हिन्दी प्रतिशब्द है, जबकि ‘विधियाँ’ निश्चित नियमों को व्यक्त करता है।
- source_word: בְּכָל־לְבָבוֹ וּבְכָל־נַפְשׁוֹ
  choice: पूरे मन और पूरे प्राण से
  rationale: यह व्यवस्थाविवरणीय वाचाई सूत्र है। हिन्दी में ‘मन’ और ‘प्राण’ मूल के לבב और נפש को पारंपरिक तथा बोधगम्य रूप में सुरक्षित रखते हैं।
- source_word: לַעֲשׂוֹת אֶת־דִּבְרֵי הַבְּרִית
  choice: वाचा की बातों को पूरा करेगा
  rationale: यहाँ עשה का अर्थ लिखी हुई वाचा की बातों को व्यवहार में कार्यान्वित करना है; ‘पूरा करना’ सहज हिन्दी में यही भाव देता है।
- source_word: הַסֵּפֶר הַזֶּה
  choice: इस पुस्तक
  rationale: סֵפֶר लिखित दस्तावेज़ को दर्शाता है और ऐतिहासिक संदर्भ में वह पुस्तकाकार ग्रंथ या लपेटा हुआ पत्र हो सकता है; मुख्य पाठ में सामान्य आधुनिक शब्द रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों में पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय उसकी विशिष्टता सुरक्षित रखता है।
- issue: לָלֶכֶת אַחֲרֵי יְהוָה में वाचाई रूपक
  choice: यहोवा के पीछे चलेगा
  alternative: यहोवा का अनुसरण करेगा
  rationale: मूल का ‘चलने’ वाला रूपक वाचाई निष्ठा और व्यवस्थाविवरणीय प्रतिध्वनि दोनों रखता है; इसलिए उसे सरल गद्य में विलीन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए बोधगम्य रूप अपनाया गया है। वाचाई कानूनी शब्दावली और मूल का ‘पीछे चलना’ रूपक सुरक्षित रखा गया है; वाक्य को हिन्दी में सहज बनाने के लिए क्रियाओं को भविष्यकालीन प्रतिज्ञा के रूप में व्यवस्थित किया गया है।
