  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֡הוּ וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַבְדּ֨וֹן בֶּן מִיכָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סּוֹפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/020.yaml
  text: Then the king commanded Hilkiah[a], Ahikam son of Shaphan, Abdon son of Micah, Shaphan the scribe, and Asaiah the king’s servant, saying[b],
translation:
  language: hi
  text: 'तब राजा ने हिल्किय्याह, शापान के पुत्र अहीकाम, मीका के पुत्र अब्दोन[a], लेखक शापान और राजा के सेवक असायाह[b] को यह आज्ञा दी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोरेटिक पाठ में “मीका के पुत्र अब्दोन” है। 2 राजा 22:12 के समानांतर वर्णन में “मीकायाह के पुत्र अकबोर” है।
    reason: textual_variant
  - marker: b
    text: या “राजा के अधिकारी असायाह।” इब्रानी में शाब्दिक अर्थ “राजा का सेवक” है, जो राजदरबार के किसी अधिकारी को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: तब राजा ने ... आज्ञा दी
  rationale: क्रिया צוה राजकीय अधिकार के साथ दिए गए आदेश को व्यक्त करती है। कथात्मक וַ का स्वाभाविक हिन्दी रूप यहाँ ‘तब’ है।
- source_word: חִלְקִיָּהוּ
  choice: हिल्किय्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אֲחִיקָם בֶּן שָׁפָן
  choice: शापान के पुत्र अहीकाम
  rationale: בן से व्यक्त पितृनाम-संबंध को स्वाभाविक आधुनिक हिन्दी क्रम में रखा गया है।
- source_word: עַבְדּוֹן בֶּן מִיכָה
  choice: मीका के पुत्र अब्दोन
  rationale: मसोरेटिक पाठ के नाम और पितृनाम का अनुसरण किया गया है; समानांतर पाठ का भेद पादटिप्पणी में सुरक्षित है।
- source_word: שָׁפָן הַסּוֹפֵר
  choice: लेखक शापान
  rationale: סֹפֵר लेखक अथवा राजकीय सचिव को सूचित कर सकता है। ‘लेखक’ मूल शब्द के निकट रहते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: राजा के सेवक असायाह
  rationale: עֶבֶד का मूल अर्थ ‘सेवक’ है, यद्यपि राजदरबार के प्रसंग में यह अधिकारी भी हो सकता है; उस विकल्प को पादटिप्पणी में दिया गया है।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा दी:'
  rationale: इब्रानी कथन-परिचायक सूत्र को हिन्दी में आने वाले प्रत्यक्ष कथन की ओर संकेत करने वाले सहज वाक्य-विन्यास और द्विबिंदु से व्यक्त किया गया है।
