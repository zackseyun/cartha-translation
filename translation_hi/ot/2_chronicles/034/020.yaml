translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज कथात्मक शैली अपनाई गई है। नामों को इब्रानी उच्चारण के निकट देवनागरी में लिखा गया है। ‘शास्त्री’ से उत्पन्न हो सकने वाले धार्मिक पद के अर्थ से बचने के लिए סֹפֵר का अनुवाद ‘लेखक’ किया गया है। पाठांतर की पादटिप्पणी का चिह्न संबंधित नाम ‘अब्दोन’ के बाद रखा गया है।
