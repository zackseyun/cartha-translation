base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/012.yaml
  text: And the men were working faithfully in the work[a], and over them were appointed Jahath and Obadiah the Levites, from the sons of Merari, and Zechariah and Meshullam, from the sons of the Kohathites, to oversee; and the Levites[b], all who were skilled with musical instruments.
translation:
  language: hi
  text: वे लोग काम में विश्वासयोग्यता से लगे हुए थे। उनकी देखरेख के लिए मरारी के वंशजों में से लेवी यहत और ओबद्याह, तथा कहातियों के वंशजों में से जकर्याह और मशुल्लाम निरीक्षण करने[a] के लिए नियुक्त किए गए थे; और वे लेवी, जो सभी संगीत के वाद्ययंत्रों में निपुण थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निर्देशन करने के लिए’; इब्रानी क्रिया निरीक्षण या अगुआई करते हुए काम का निर्देशन करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘गीत के वाद्यों की समझ रखने वाले सभी,’ अर्थात् वे सभी जो संगीत के वाद्ययंत्रों में निपुण थे।
    reason: lexical_alternative
