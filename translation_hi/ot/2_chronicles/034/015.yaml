source:
  edition: WLC
  text: וַ/יַּ֣עַן חִלְקִיָּ֗הוּ וַ/יֹּ֨אמֶר֙ אֶל שָׁפָ֣ן הַ/סּוֹפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֧ן חִלְקִיָּ֛הוּ אֶת הַ/סֵּ֖פֶר אֶל שָׁפָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/015.yaml
  text: Then Hilkiah answered and said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan.
translation:
  language: hi
  text: तब हिल्किय्याह ने उत्तर देकर लिपिक शापान से कहा, “मुझे याहवे के भवन में व्यवस्था की पुस्तक[a] मिली है।” फिर हिल्किय्याह ने वह पुस्तक शापान को दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “व्यवस्था का ग्रंथ” भी कहा जा सकता है; इब्रानी सेफ़ेर का अर्थ पुस्तक, दस्तावेज़ या लपेटा हुआ ग्रंथ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने उत्तर देकर ... कहा
  rationale: इब्रानी कथन-सूत्र के दोनों क्रियापदों को बनाए रखता है। यद्यपि ठीक पहले कोई प्रत्यक्ष प्रश्न नहीं है, यह अभिव्यक्ति किसी प्रसंग पर प्रतिक्रिया आरम्भ कर सकती है।
- source_word: הַסּוֹפֵר
  choice: लिपिक
  rationale: סֹפֵר यहाँ राजकीय या प्रशासनिक लेखक-सचिव का पद सूचित कर सकता है। ‘लिपिक’ आधुनिक हिन्दी में स्वाभाविक है और भूमिका को अनावश्यक रूप से सीमित नहीं करता।
- source_word: סֵפֶר הַתּוֹרָה
  choice: व्यवस्था की पुस्तक
  rationale: תּוֹרָה के वाचा-संबंधी विधिक संदर्भ को ‘व्यवस्था’ व्यक्त करता है, जबकि סֵפֶר की पुस्तक, दस्तावेज़ या लपेटे हुए ग्रंथ की अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מָצָאתִי
  choice: मुझे ... मिली है
  rationale: इब्रानी पूर्ण क्रिया हाल ही में पूरी हुई खोज और उसकी वर्तमान प्रासंगिकता व्यक्त करती है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से संप्रेषित करता है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ मंदिर का संकेत है। ‘भवन’ मूल रूपक बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित किया गया है।
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר אֶל שָׁפָן
  choice: वह पुस्तक शापान को दे दी
  rationale: נתן के सामान्य अर्थ ‘देना’ को सीधे और स्वाभाविक हिन्दी में प्रस्तुत करता है; ‘वह’ पहले उल्लिखित पुस्तक को स्पष्ट रूप से पुनः इंगित करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा / निर्देश
  rationale: इस मंदिर और वाचा-संबंधी प्रसंग में ‘व्यवस्था’ खोजे गए विधिक-वाचा ग्रंथ की सम्भावित पहचान को स्वाभाविक रूप से व्यक्त करता है, जबकि शब्द का व्यापक अर्थ ‘शिक्षा’ भी हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। नामों के रूप ‘हिल्किय्याह’ और ‘शापान’ मूल उच्चारण के निकट हैं। इब्रानी के दोहरे कथन-सूत्र को ‘उत्तर देकर ... कहा’ के रूप में सुरक्षित रखा गया है।
