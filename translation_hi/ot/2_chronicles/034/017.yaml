  text: וַ/יַּתִּ֕יכוּ אֶת הַ/כֶּ֖סֶף הַ/נִּמְצָ֣א בְּ/בֵית יְהוָ֑ה וַֽ/יִּתְּנ֗וּ/הוּ עַל יַד֙ הַ/מֻּפְקָדִ֔ים וְ/עַל יַ֖ד עוֹשֵׂ֥י הַ/מְּלָאכָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/017.yaml
  text: They have poured out the silver that was found in the house of Yahweh and have put it into the hands of the overseers and into the hands of those doing the work[a][b].
translation:
  language: hi
  text: उन्होंने यहोवा के भवन में मिली हुई चाँदी निकालकर पर्यवेक्षकों के हाथ में और काम करने वालों के हाथ में सौंप दी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मिली हुई चाँदी उँडेल दी”; इब्रानी क्रिया यहाँ धन को पात्रों से निकालने या भुगतान के लिए जारी करने का अर्थ दे सकती है, न कि अनिवार्य रूप से उसे गलाने का।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा का भवन” अर्थात मंदिर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּתִּיכוּ
  choice: निकालकर
  rationale: संदर्भ में क्रिया का आशय संचित चाँदी को पात्रों से निकालकर भुगतान के लिए उपलब्ध कराना है; यहाँ ‘गलाना’ अगले वाक्यांश में धन सौंपे जाने के साथ कम संगत है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और मंदिर की निधि के संदर्भ में इससे धन भी अभिप्रेत है; ‘चाँदी’ स्रोत की ठोस शब्दावली बनाए रखती है।
- source_word: הַנִּמְצָא
  choice: मिली
  rationale: निफ़अल कृदंत उस चाँदी को सूचित करता है जो प्राप्त या पाई गई थी; हिंदी में ‘मिली’ स्वाभाविक और संक्षिप्त है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: यह मूल अभिव्यक्ति का निकट रूप है; यहाँ ‘भवन’ से मंदिर अभिप्रेत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וַיִּתְּנֻהוּ
  choice: सौंप दी
  rationale: प्रशासनिक संदर्भ में נתן धन को जिम्मेदार व्यक्तियों के अधिकार में देने का भाव रखता है; ‘सौंप दी’ हिंदी में स्वाभाविक है।
- source_word: עַל יַד
  choice: के हाथ में
  rationale: इब्रानी मुहावरा किसी की देखरेख या अधिकार में सौंपने को व्यक्त करता है; हिंदी का ‘हाथ में’ वही बिंब और अर्थ बनाए रखता है।
- source_word: הַמֻּפְקָדִים
  choice: अध्यक्षों
  rationale: ये नियुक्त व्यक्ति काम या निधि की निगरानी के उत्तरदायी थे; ‘अध्यक्ष’ उनकी पर्यवेक्षी भूमिका व्यक्त करता है।
- source_word: עוֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवालों
  rationale: यह व्यापक पदबंध काम में लगे लोगों को दर्शाता है और किसी विशेष कारीगरी को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। हिंदी पाठकों के लिए ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला नामरूप है; इसे ‘प्रभु’ जैसे शीर्षक से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और स्रोत-सन्निकट शैली। प्रशासनिक हस्तांतरण को ‘हाथ में सौंप दी’ से व्यक्त किया गया है; मुख्य पाठ में ‘निकालकर’ संदर्भगत अर्थ स्पष्ट करता है, जबकि क्रिया का उँडेलने वाला बिंब पादटिप्पणी में सुरक्षित है।
