id: 2CH.34.14
reference: 2 Chronicles 34:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/הוֹצִיאָ֣/ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה מָצָא֙ חִלְקִיָּ֣הוּ הַ/כֹּהֵ֔ן אֶת סֵ֥פֶר תּֽוֹרַת יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/014.yaml
  text: And when they brought out the silver that had been brought into the house of Yahweh[a], Hilkiah the priest found the Book of the Law of Yahweh by the hand of Moses.
translation:
  language: hi
  text: जब वे यहोवा के भवन में लाई गई चाँदी बाहर निकाल रहे थे, तब हिल्कियाह याजक को मूसा के हाथ से दी गई यहोवा की व्यवस्था की पुस्तक मिली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְהוֹצִיאָם
  choice: जब वे ... बाहर निकाल रहे थे
  rationale: בְּ + infinitive construct और 3mp प्रत्यय एक कालवाचक उपवाक्य बनाते हैं; हिन्दी में अपूर्ण क्रिया ‘बाहर निकाल रहे थे’ समकालिक परिस्थिति को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का अर्थ ‘चाँदी’ और प्रसंगानुसार ‘धन’ दोनों हो सकता है। ‘चाँदी’ मूल शब्द की ठोस छवि और मंदिर के लिए एकत्र निधि—दोनों को बनाए रखती है।
- source_word: הַמּוּבָא
  choice: लाई गई
  rationale: בוא का होफ़ाल कृदंत निष्क्रिय अर्थ ‘लाई गई’ देता है और चाँदी के पहले भवन में लाए जाने को स्पष्ट करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का निकट अर्थ ‘भवन/घर’ है; यहाँ ‘भवन’ मंदिर-संदर्भ में स्वाभाविक और गरिमापूर्ण है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: מָצָא
  choice: मिली
  rationale: מצא का सामान्य अर्थ ‘पाना/मिलना’ है। हिन्दी वाक्य-विन्यास में ‘हिल्कियाह ... को ... पुस्तक मिली’ सहज है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: חִלְקִיָּהוּ הַכֹּהֵן
  choice: हिल्कियाह याजक
  rationale: नाम का हिन्दी लिप्यंतरण और पदवी की स्वाभाविक समानाधिकरण रचना रखी गई है।
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था की पुस्तक
  rationale: סֵפֶר को ‘पुस्तक’ और תּוֹרָה को इस वाचागत प्रसंग में प्रचलित ‘व्यवस्था’ से व्यक्त किया गया है; मूल संबंध-शृंखला सुरक्षित है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के हाथ से दी गई
  rationale: शाब्दिक ‘मूसा के हाथ से’ को बनाए रखते हुए ‘दी गई’ हिन्दी में उसके माध्यम/एजेंसी-संबंध को पठनीय बनाता है। यह पुस्तक के मूसा के माध्यम से दिए जाने को व्यक्त करता है, बिना निजी लेखकत्व-सिद्धांत थोपे।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम दो बार है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और इसे सामान्य पदवी ‘प्रभु’ में नहीं बदलता।
- issue: בְּיַד מֹשֶׁה में मूसा की भूमिका
  choice: मूसा के हाथ से दी गई
  alternative: मूसा के द्वारा / मूसा के हाथ की
  rationale: यह वाक्यांश माध्यम, प्रदान किए जाने, अथवा संबद्ध लेखकत्व की ओर संकेत कर सकता है। चुना हुआ रूप मूल ‘हाथ’ की छवि और माध्यम का भाव रखता है, पर उससे अधिक विशिष्ट आधुनिक लेखकत्व-दावा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘चाँदी’, ‘भवन’, ‘याजक’ और ‘व्यवस्था की पुस्तक’ मूल की प्रमुख शब्दावली को निकटता से बनाए रखते हैं। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी।
