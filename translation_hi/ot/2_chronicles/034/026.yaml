  text: וְ/אֶל מֶ֣לֶךְ יְהוּדָ֗ה הַ/שֹּׁלֵ֤חַ אֶתְ/כֶם֙ לִ/דְר֣וֹשׁ בַּֽ/יהוָ֔ה כֹּ֥ה תֹאמְר֖וּ אֵלָ֑י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַ/דְּבָרִ֖ים אֲשֶׁ֥ר שָׁמָֽעְתָּ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/026.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: ‘Thus says Yahweh, the God of Israel: As for the words that you have heard—’'
translation:
  language: hi
  text: 'परन्तु यहूदा के उस राजा से, जिसने तुम्हें यहोवा से पूछने[a] के लिए भेजा है, यह कहना: ‘इस्राएल का परमेश्वर यहोवा यों कहता है: जिन वचनों को तुमने सुना है, उनके विषय में—’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहोवा को खोजने’ अथवा ‘यहोवा से परामर्श करने।’ नबी-संदेश के संदर्भ में इब्रानी क्रिया का अर्थ ‘खोजना’ या ‘पूछना’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל מֶלֶךְ יְהוּדָה
  choice: पर यहूदा के राजा से
  rationale: וְ यहाँ पिछले संबोधन से राजा की ओर मोड़ लाता है; आधुनिक हिन्दी में ‘पर’ इस हल्के विरोध/परिवर्तन को स्वाभाविक रूप से व्यक्त करता है, और אֶל को ‘से’ के साथ आगामी कथन ‘यह कहना’ में समाहित किया गया है।
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: जिसने तुम्हें ... भेजा है
  rationale: सवाचक कृदन्त राजा की पहचान कराने वाला विशेषणीय उपवाक्य है; हिन्दी में यह पूर्ण क्रियात्मक रूप स्वाभाविक है।
- source_word: לִדְרוֹשׁ בַּיהוָה
  choice: यहोवा से पूछने के लिए
  rationale: नबी से परामर्श के प्रसंग में דרשׁ ב का अर्थ ईश्वर से उत्तर/मार्गदर्शन पूछना है। ‘पूछने’ से तत्काल दैवी परामर्श का भाव स्पष्ट रहता है, जबकि व्यापक ‘खोजने’ का अर्थ संदर्भ में कम उपयुक्त है।
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: तुम यह कहना
  rationale: כֹּה के निर्देशात्मक बल और बहुवचन תֹאמְרוּ को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: यह नबी-संदेश का पारंपरिक सूत्र है; हिन्दी वर्तमानकालीन ‘यों कहता है’ आने वाली ईशवाणी का परिचय स्वाभाविक ढंग से देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से दर्शाया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: जो वचन तुमने सुने हैं, उनके विषय में—
  rationale: इब्रानी में विषय को आगे रखकर वाक्य अगले पद में पूरा होता है। ‘उनके विषय में—’ और दीर्घ विराम इस अपूर्ण, अगले पद से जुड़ने वाले विन्यास को सुरक्षित रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में टेट्राग्राम है। व्यक्तिवाचक नाम को बनाए रखने के लिए आधुनिक हिन्दी में परिचित ‘यहोवा’ चुना गया; इसे केवल उपाधि ‘प्रभु’ बनाकर मूल की विशिष्टता नहीं मिटाई गई।
- issue: דרשׁ ב में खोज और दैवी परामर्श के बीच अर्थ-संभावना
  choice: यहोवा से पूछने
  alternative: यहोवा को खोजने / यहोवा से परामर्श करने
  rationale: राजा द्वारा प्रतिनिधिमंडल भेजे जाने और नबिया से उत्तर मिलने के प्रसंग में ‘पूछने’ सबसे सीधा है; यह सामान्य भक्ति के अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। नबी-संदेश के सूत्र में ‘यों कहता है’ रखा गया है। अंतिम पदांश को अगले पद में पूर्ण होने वाली इब्रानी विषय-रचना के अनुरूप डैश पर खुला छोड़ा गया है।
