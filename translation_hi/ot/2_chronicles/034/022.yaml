- source_word: אֵשֶׁת שַׁלֻּם
  choice: शल्लूम की पत्नी
  rationale: सम्बन्धवाचक रचना वैवाहिक सम्बन्ध को सीधे व्यक्त करती है।
- source_word: בֶּן תוקהת בֶּן חַסְרָה
  choice: शल्लूम तोखत का पुत्र और हस्रा का पोता था
  rationale: वंशावली की दोनों पीढ़ियाँ सुरक्षित हैं; प्राकृतिक हिन्दी के लिए दूसरे בֶּן को ‘पोता’ से व्यक्त किया गया है।
- source_word: שׁוֹמֵר הַבְּגָדִים
  choice: वस्त्रों के रखवाले
  rationale: मूल का शाब्दिक अर्थ सुरक्षित है; सम्भावित राजकीय पद को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וְהִיא יוֹשֶׁבֶת
  choice: रहती थी
  rationale: कृदन्त यहाँ पृष्ठभूमि में स्थायी निवास बताता है।
- source_word: בַּמִּשְׁנֶה
  choice: दूसरे मुहल्ले
  rationale: यह सम्भवतः यरूशलेम के एक नामित भाग का संकेत है; अर्थ का अनुवाद किया गया और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וַיְדַבְּרוּ אֵלֶיהָ כָּזֹאת
  choice: 'उन्होंने उससे इस प्रकार कहा:'
  rationale: आगे आने वाले कथन का स्वाभाविक हिन्दी परिचय, जिसमें demonstrative force भी बना रहता है।
