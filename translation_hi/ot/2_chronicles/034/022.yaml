base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/022.yaml
  text: 'Then Hilkiah and those whom the king had sent went to Huldah the prophetess[a], the wife of Shallum son of Tokhath, son of Hasrah, keeper of the garments. She lived in Jerusalem in the Second Quarter[b], and they spoke to her thus:'
translation:
  language: hi
  text: 'तब हिल्कियाह और राजा के भेजे हुए लोग हुल्दा नबिया के पास गए, जो शल्लूम की पत्नी थी। शल्लूम तोखत का पुत्र था, और तोखत हस्रा का पुत्र था; शल्लूम वस्त्रों का रखवाला[a] था। हुल्दा यरूशलेम के दूसरे मुहल्ले[b] में रहती थी। उन्होंने उससे इस प्रकार कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पोशाकघर का रखवाला।” इब्रानी में शाब्दिक अर्थ “वस्त्रों का रखवाला” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मिश्नेह; सम्भवतः यरूशलेम के एक मुहल्ले का नाम। परम्परागत अनुवाद “दूसरा मुहल्ला” है।
    reason: cultural_note
