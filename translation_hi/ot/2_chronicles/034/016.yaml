translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजदरबार के प्रसंग में आदरसूचक ‘आपके’ प्रयुक्त हुआ है। मूल इब्रानी मुहावरे की ‘हाथ’ वाली छवि मुख्य पाठ में सुरक्षित है, जबकि पादटिप्पणी अधिक सहज और अधिक शाब्दिक—दोनों रूप स्पष्ट करती है।
