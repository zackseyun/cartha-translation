source:
  edition: WLC
  text: וַ/יָּבֵ֨א שָׁפָ֤ן אֶת הַ/סֵּ֨פֶר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֨שֶׁב ע֧וֹד אֶת הַ/מֶּ֛לֶךְ דָּבָ֖ר לֵ/אמֹ֑ר כֹּ֛ל אֲשֶׁר נִתַּ֥ן בְּ/יַד עֲבָדֶ֖י/ךָ הֵ֥ם עֹשִֽׂים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/016.yaml
  text: Then Shaphan brought the book to the king and also brought back word to the king[a], saying, “All that was committed into the hand of your servants, they are doing.”
translation:
  language: hi
  text: 'तब शापान वह पुस्तक राजा के पास ले आया और उसने राजा को यह समाचार भी दिया: “जो कुछ आपके सेवकों के हाथ में सौंपा गया है[a], वह सब वे कर रहे हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ आपके सेवकों को सौंपा गया है।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “जो कुछ आपके सेवकों के हाथ में दिया गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: ले आया
  rationale: 'בוא के हिफ़ील रूप का कारक भाव व्यक्त करता है: शापान पुस्तक को राजा के पास लाया।'
- source_word: הַסֵּפֶר
  choice: वह पुस्तक
  rationale: סֵפֶר पुस्तक, ग्रंथ या लिखित दस्तावेज़ हो सकता है। प्रसंग में पहले मिली व्यवस्था की पुस्तक का उल्लेख है; ‘पुस्तक’ स्वाभाविक है और उसके भौतिक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיָּשֶׁב עוֹד אֶת־הַמֶּלֶךְ דָּבָר
  choice: उसने राजा को यह समाचार भी दिया
  rationale: שוב + דבר यहाँ वापस सूचना देने या प्रतिवेदन करने का मुहावरा है; עוֹד का भाव ‘भी’ से व्यक्त किया गया है।
- source_word: כֹּל אֲשֶׁר נִתַּן בְּיַד עֲבָדֶיךָ
  choice: जो कुछ आपके सेवकों के हाथ में सौंपा गया है
  rationale: נתן ביד का अर्थ किसी काम या दायित्व को किसी के हाथ सौंपना है। अनुवाद मूल की ‘हाथ’ वाली छवि और सौंपे जाने का आशय दोनों बनाए रखता है।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवकों
  rationale: राजकीय प्रसंग में עבד राजा के सेवकों या अधिकारियों को सूचित करता है। ‘सेवक’ मूल पद के निकट और हिंदी में प्रसंगानुकूल है।
- source_word: הֵם עֹשִׂים
  choice: वह सब वे कर रहे हैं
  rationale: स्पष्ट सर्वनाम और कृदंत चल रही क्रिया पर बल देते हैं। हिंदी में ‘वे कर रहे हैं’ प्रगतिशील भाव रखता है; ‘वह सब’ पहले आए ‘जो कुछ’ का स्वाभाविक सहसंबंध बनाता है।
