  text: וַ/יַּ֣עַל הַ/מֶּ֣לֶךְ בֵּית יְ֠הוָה וְ/כָל אִ֨ישׁ יְהוּדָ֜ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם וְ/הַ/כֹּֽהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הָ/עָ֖ם מִ/גָּד֣וֹל וְ/עַד קָטָ֑ן וַ/יִּקְרָ֣א בְ/אָזְנֵי/הֶ֗ם אֶת כָּל דִּבְרֵי֙ סֵ֣פֶר הַ/בְּרִ֔ית הַ/נִּמְצָ֖א בֵּ֥ית יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/030.yaml
  text: Then the king went up to the house of Yahweh[a], and every man of Judah, and the inhabitants of Jerusalem, and the priests and the Levites, and all the people, from great to small[b]; and he read in their hearing all the words of the book of the covenant that had been found in the house of Yahweh.
translation:
  language: hi
  text: तब राजा, यहूदा के सभी पुरुषों, यरूशलेम के निवासियों, याजकों, लेवियों और बड़े से छोटे तक[b] सारी प्रजा के साथ, याहवे[a] के भवन में गया; और उसने उनके सुनते हुए वाचा की उस पुस्तक की सारी बातें पढ़ीं, जो याहवे के भवन में मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में लिखे परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण है।
    reason: divine_name
  - marker: b
    text: ‘बड़े से छोटे तक’ का अर्थ है हर स्तर या हैसियत के लोग।
    reason: idiom
lexical_decisions:
- source_word: וַיַּעַל
  choice: गया
  rationale: עלה में ‘ऊपर जाने’ का भाव है, पर हिन्दी में मंदिर जाने के लिए केवल ‘गया’ अधिक स्वाभाविक है; भवन का स्थान और प्रसंग दिशा का संकेत देते हैं।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक रूप ‘याहवे का घर/भवन’ है। ‘भवन’ गरिमापूर्ण और स्पष्ट है तथा ‘मन्दिर’ कहकर मूल रूपक को अनावश्यक रूप से नहीं बदलता।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है, किसी उपाधि से उसका स्थानापन्न नहीं।
- source_word: כָל אִישׁ יְהוּדָה
  choice: यहूदा के सभी पुरुष
  rationale: כָל के साथ एकवचन אִישׁ यहाँ वितरणात्मक अर्थ देता है। हिन्दी में ‘सभी पुरुष’ स्वाभाविक ढंग से उसी सामूहिक अर्थ को व्यक्त करता है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: कृदन्त का अर्थ वहाँ रहने वाले लोगों से है; ‘निवासी’ आधुनिक हिन्दी में स्पष्ट सामूहिक पद है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजक, लेवी
  rationale: ये दोनों उपासना-सम्बन्धी समूहों के मानक हिन्दी नाम हैं।
- source_word: מִגָּדוֹל וְעַד קָטָן
  choice: बड़े से छोटे तक
  rationale: यह सामाजिक स्थिति या महत्त्व के पूरे विस्तार को व्यक्त करने वाला इब्रानी मुहावरा है; निकट और बोधगम्य हिन्दी रूप रखा गया है।
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: उसने उन्हें … पढ़कर सुनाईं
  rationale: पुस्तक के प्रसंग में קרא का अर्थ ऊँचे स्वर में पढ़ना है, और ‘उनके कानों में’ का स्वाभाविक हिन्दी मुहावरा ‘उन्हें पढ़कर सुनाना’ है।
- source_word: כָל דִּבְרֵי סֵפֶר הַבְּרִית
  choice: वाचा की उस पुस्तक की सारी बातें
  rationale: דברים का मूल अर्थ ‘शब्द/बातें’ है। ‘सारी बातें’ दस्तावेज़ की सम्पूर्ण विषयवस्तु पर बल देता है और हिन्दी में स्वाभाविक है।
- source_word: הַנִּמְצָא
  choice: जो … मिली थी
  rationale: निफ़अल कृदन्त पुस्तक के पाए जाने को बताता है; हिन्दी में पूर्वघटित घटना के लिए ‘मिली थी’ उपयुक्त है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम ही रहने देता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परम्परा को दर्शाता है।
- issue: כָל אִישׁ יְהוּדָה में लिंग-सूचक भाषा
  choice: यहूदा के सभी पुरुष
  alternative: यहूदा के सभी लोग
  rationale: मूल में אִישׁ स्पष्ट रूप से पुरुष-सूचक है। इसे बनाए रखा गया है, जबकि आगे ‘सारी प्रजा’ सभा की व्यापकता व्यक्त करती है।
- issue: מִגָּדוֹל וְעַד קָטָן का आशय
  choice: बड़े से छोटे तक
  alternative: सबसे प्रतिष्ठित से सबसे साधारण तक
  rationale: मूल का संक्षिप्त मुहावरा बनाए रखने से सामाजिक हैसियत, आयु या महत्त्व में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक पाठ के अनुकूल और गरिमापूर्ण रखी गई है। लम्बी इब्रानी समन्वित वाक्य-रचना को हिन्दी में दो वाक्यों में बाँटा गया है; ‘उसके साथ’ जोड़कर सभी समूहों के राजा के साथ भवन में जाने का सम्बन्ध स्पष्ट किया गया है।
