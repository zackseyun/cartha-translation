base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/021.yaml
  text: Go[a], inquire of Yahweh for me and for the remnant in Israel and in Judah concerning the words of the book that has been found, for great is the wrath of Yahweh that has been poured out on us, because our fathers have not kept the word of Yahweh[c][b], to do according to all that is written in this book.
translation:
  language: hi
  text: “जाओ, और मेरे लिए तथा इस्राएल और यहूदा में बचे हुए लोगों के लिए उस पुस्तक[a] की बातों के विषय में, जो पुस्तक मिली है, यहोवा से पूछो। क्योंकि यहोवा का भयंकर क्रोध हम पर उंडेला गया है, इसलिए कि हमारे पुरखों[b] ने यहोवा के वचन का पालन नहीं किया और इस पुस्तक में लिखी हुई हर बात के अनुसार आचरण नहीं किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस लिपटे हुए ग्रंथ की।” इब्रानी शब्द पुस्तक या लिपटे हुए ग्रंथ, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारे पूर्वजों।” इब्रानी में शाब्दिक अर्थ “हमारे पिताओं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: यहोवा से पूछो
  rationale: राजकीय आदेश के इस प्रसंग में क्रिया का अर्थ परमेश्वर से मार्गदर्शन या उत्तर प्राप्त करना है; ‘से पूछो’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परमेश्वर के विशिष्ट नाम की व्यापक रूप से पहचानी जाने वाली अभिव्यक्ति है और मूल पाठ के नाम को सामान्य उपाधि में नहीं बदलती।
- source_word: הַנִּשְׁאָר
  choice: बचे हुए लोग
  rationale: यह पद इस्राएल और यहूदा में शेष रह गए लोगों को दर्शाता है; यह ‘शेष’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है और सामूहिक अर्थ बनाए रखता है।
- source_word: דִּבְרֵי הַסֵּפֶר
  choice: पुस्तक की बातें
  rationale: דברים यहाँ पुस्तक में लिखे वचनों या विषय-वस्तु को सूचित करता है; ‘बातें’ निकट और सहज हिन्दी है।
- source_word: הַסֵּפֶר
  choice: पुस्तक
  rationale: סֵפֶר पुस्तक अथवा लपेटे हुए ग्रंथ, दोनों को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक ‘पुस्तक’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: גְדוֹלָה חֲמַת יְהוָה
  choice: यहोवा का बड़ा क्रोध
  rationale: חֵמָה तीव्र, दहकते क्रोध को व्यक्त करता है। ‘बड़ा क्रोध’ मूल के परिमाणात्मक बल को सरल हिन्दी में बनाए रखता है।
- source_word: נִתְּכָה בָנוּ
  choice: हम पर उंडेला गया है
  rationale: निफ़अल रूप क्रोध के उंडेले जाने की छवि रखता है; हिन्दी में यह रूपक स्पष्ट और स्वाभाविक है।
- source_word: אֲבוֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: यह पूर्वज पिताओं को सूचित करने वाला पुल्लिंग बहुवचन है। ‘पुरखा’ हिन्दी में ऐतिहासिक पूर्वजों के लिए स्वाभाविक है और स्रोत की लैंगिक अभिव्यक्ति को अनावश्यक रूप से तटस्थ नहीं करता।
- source_word: שָׁמְרוּ אֶת־דְּבַר יְהוָה
  choice: यहोवा के वचन का पालन नहीं किया
  rationale: שׁמר का अर्थ यहाँ कही हुई आज्ञा को मानना और उसके अनुसार चलना है; हिन्दी में ‘वचन का पालन करना’ केवल सुरक्षित रखने के बजाय अपेक्षित आज्ञाकारिता स्पष्ट करता है।
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב
  choice: लिखी हुई सभी बातों के अनुसार नहीं किया
  rationale: यह वचन को मानने के व्यावहारिक आशय को बताता है और כְּכָל के ‘सबके अनुसार’ अर्थ को बनाए रखता है।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में सामान्य उपाधि नहीं, चतुरक्षरीय विशिष्ट नाम है। हिन्दी के सामान्य बाइबलीय पाठक के लिए परिचित ‘यहोवा’ नाम को स्पष्ट रूप से बनाए रखता है; ‘याहवे’ संभावित उच्चारण-आधारित विकल्प है।
- issue: אֲבוֹתֵינוּ को लैंगिक रूप से तटस्थ करना या नहीं
  choice: हमारे पुरखा
  alternative: हमारे पूर्वज
  rationale: मूल शब्द व्याकरणतः पुल्लिंग है और पूर्वकालीन पिताओं को दर्शाता है। ‘पुरखा’ इस रूप को बनाए रखता है, जबकि ‘पूर्वज’ अधिक तटस्थ विकल्प है।
- issue: क्रोध के उंडेले जाने की रूपकात्मक भाषा
  choice: हम पर उंडेला गया है
  alternative: हम पर भड़का है
  rationale: נתך का प्राथमिक चित्र उंडेलने का है। इसे बनाए रखने से दैवी क्रोध की तीव्रता और स्रोत-पाठ का रूपक दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय आदेश के कारण आरंभ में बहुवचन आज्ञार्थ ‘जाओ’ और ‘पूछो’ रखा गया है। मूल वाक्य की कारणात्मक तीव्रता बनाए रखने के लिए दूसरा वाक्य ‘क्योंकि’ से आरंभ होता है।
