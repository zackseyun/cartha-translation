reference: 2 Chronicles 34:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אֶל חִלְקִיָּ֣הוּ הַ/כֹּהֵ֣ן הַ/גָּד֗וֹל וַֽ/יִּתְּנוּ֮ אֶת הַ/כֶּסֶף֮ הַ/מּוּבָ֣א בֵית אֱלֹהִים֒ אֲשֶׁ֣ר אָסְפֽוּ הַ/לְוִיִּם֩ שֹׁמְרֵ֨י הַ/סַּ֜ף מִ/יַּ֧ד מְנַשֶּׁ֣ה וְ/אֶפְרַ֗יִם וּ/מִ/כֹּל֙ שְׁאֵרִ֣ית יִשְׂרָאֵ֔ל וּ/מִ/כָּל יְהוּדָ֖ה וּ/בִנְיָמִ֑ן ו/ישבי יְרֽוּשָׁלִָֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/009.yaml
  text: Then they came to Hilkiah the high priest and gave the money that had been brought into the house of God[a], which the Levites, the keepers of the threshold, had collected from Manasseh and Ephraim and from all the remnant of Israel, and from all Judah and Benjamin and the inhabitants of Jerusalem.
translation:
  language: hi
  text: तब वे महायाजक हिल्कियाह के पास आए और परमेश्वर के भवन में लाया गया धन सौंप दिया। यह धन दहलीज के रखवाले[a] लेवियों ने मनश्शे और एप्रैम से, इस्राएल के सारे बचे हुए लोगों से, और पूरे यहूदा, बिन्यामीन तथा यरूशलेम के निवासियों से इकट्ठा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वारपाल’; शाब्दिक रूप से ‘दहलीज के रखवाले।’
    reason: שֹׁמְרֵי הַסַּף का शाब्दिक रूप और उसका सम्भावित कार्यगत अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रमिक प्रवाह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חִלְקִיָּהוּ
  choice: हिल्कियाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: प्रधान याजकीय पदवी के लिए स्थापित और प्रसंगानुकूल हिन्दी शब्द।
- source_word: וַיִּתְּנוּ
  choice: सौंप दिया
  rationale: मन्दिर की धनराशि हिल्कियाह को देने के प्रसंग में ‘सौंप दिया’ साधारण ‘दिया’ की अपेक्षा क्रिया का व्यावहारिक आशय अधिक स्पष्ट करता है।
- source_word: הַכֶּסֶף
  choice: धन
  rationale: शाब्दिक अर्थ ‘चाँदी’ है, पर मन्दिर-निधि के इस प्रसंग में यह मुद्रा अथवा धनराशि को सूचित करता है।
- source_word: הַמּוּבָא
  choice: लाया गया
  rationale: होफाल कृदन्त के कर्मवाच्य अर्थ को बनाए रखता है और धन के पहले भवन में लाए जाने को व्यक्त करता है।
- source_word: בֵית אֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: इब्रानी पदबंध ‘परमेश्वर का घर/भवन’ को पारदर्शी ढंग से रखता है; प्रसंग में यह मन्दिर है, पर अनुवाद में मूल रूपक सुरक्षित है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: इस गोत्रीय और सेवकीय समूह का मानक हिन्दी रूप।
- source_word: שֹׁמְרֵי הַסַּף
  choice: दहलीज के रखवाले
  rationale: इब्रानी बिंब का निकट अनुवाद; कार्यगत विकल्प ‘द्वारपाल’ को पादटिप्पणी में रखा गया है।
- source_word: מִיַּד
  choice: से
  rationale: शाब्दिक ‘हाथ से’ यहाँ प्राप्ति के स्रोत को बताने वाला मुहावरा है; हिन्दी में ‘से’ स्वाभाविक है।
- source_word: מְנַשֶּׁה וְאֶפְרַיִם
  choice: मनश्शे और एप्रैम
  rationale: गोत्रीय अथवा क्षेत्रीय नामों के प्रचलित हिन्दी रूप।
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: इस्राएल के सारे बचे हुए लोग
  rationale: שְׁאֵרִית के ‘जो शेष रह गए’ अर्थ को सहज हिन्दी में रखता है और केवल ‘बाकी इस्राएल’ कहकर इसकी संभावित वाचाई प्रतिध्वनि को मिटाता नहीं।
- source_word: וִישְׁבֵי יְרוּשָׁלִָם
  choice: यरूशलेम के निवासी
  rationale: नगर में रहने वाले लोगों का सीधा और स्वाभाविक हिन्दी वर्णन।
theological_decisions:
- issue: שְׁאֵרִית (‘शेष/बचे हुए’) में संभावित वाचाई अर्थच्छाया
  choice: इस्राएल के सारे बचे हुए लोग
  alternative: इस्राएल के बाकी सभी लोग
  rationale: ‘बचे हुए लोग’ उत्तरी गोत्रों में शेष लोगों के ऐतिहासिक अर्थ को व्यक्त करता है और ‘रेमनेंट’ की संभावित धर्मवैचारिक प्रतिध्वनि को भी बिना बढ़ा-चढ़ाकर सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लम्बे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, ताकि धन और उसे इकट्ठा करने वालों का सम्बन्ध स्पष्ट रहे। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिससे वह सम्बद्ध है।
