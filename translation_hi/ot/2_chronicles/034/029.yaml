base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/034/029.yaml
  text: Then the king sent and gathered all the elders of Judah and Jerusalem[a].
translation:
  language: hi
  text: तब राजा ने बुलावा भेजा और यहूदा और यरूशलेम के सभी पुरनियों को इकट्ठा किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “तब राजा ने भेजा और यहूदा और यरूशलेम के सभी पुरनियों को इकट्ठा किया।” मूल पाठ यह नहीं बताता कि राजा ने किसे या क्या भेजा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: बुलावा भेजा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘भेजा’ है, पर भेजी गई वस्तु या व्यक्ति का उल्लेख नहीं है। अगले कथन में पुरनियों के इकट्ठा होने के कारण हिंदी में ‘बुलावा भेजा’ प्रसंगानुकूल और स्वाभाविक है; पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल में निश्चित पदवी ‘राजा’ है। प्रसंग से योशिय्याह अभिप्रेत है, फिर भी यहाँ उसका नाम जोड़ना उचित नहीं।
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: אָסף का अर्थ यहाँ लोगों को एक सभा के लिए एकत्र करना है। ‘इकट्ठा किया’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: אֶת כָּל
  choice: सभी
  rationale: אֶת कर्म-चिह्न है और अलग से अनूदित नहीं होता; כָּל सभा की समग्रता व्यक्त करता है।
- source_word: זִקְנֵי
  choice: पुरनियों
  rationale: यह शब्द केवल वृद्ध पुरुषों के लिए नहीं, बल्कि समुदाय के मान्य वरिष्ठ प्रतिनिधियों के लिए प्रयुक्त है। ‘पुरनियों’ से यह संस्थागत भूमिका बनी रहती है।
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: यहूदा और यरूशलेम के
  rationale: यह वाक्यांश दोनों स्थानों से संबंधित पुरनियों की पहचान करता है और भौगोलिक-राजनीतिक विस्तार को बनाए रखता है।
theological_decisions: []
