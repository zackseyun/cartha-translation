source:
  edition: WLC
  text: וַ/יָּ֣רֶם יֹאשִׁיָּ֣הוּ לִ/בְנֵ֪י הָ/עָ֟ם צֹ֞אן כְּבָשִׂ֣ים וּ/בְנֵֽי עִזִּים֮ הַ/כֹּ֣ל לַ/פְּסָחִים֒ לְ/כָל הַ/נִּמְצָ֗א לְ/מִסְפַּר֙ שְׁלֹשִׁ֣ים אֶ֔לֶף וּ/בָקָ֖ר שְׁלֹ֣שֶׁת אֲלָפִ֑ים אֵ֖לֶּה מֵ/רְכ֥וּשׁ הַ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/007.yaml
  text: Josiah contributed to the people from the flock[a], lambs and young goats, all of them for the Passover offerings, for all who were present, to the number of thirty thousand, and three thousand cattle[b]. These were from the king’s possessions.
translation:
  language: hi
  text: योशियाह ने उपस्थित सभी लोगों के लिए झुंड में से मेमने और बकरी के बच्चे दिए—ये सब फसह की बलियों के लिए थे—कुल तीस हज़ार; और तीन हज़ार गाय-बैल भी दिए। ये सब राजा की अपनी संपत्ति में से थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: दिए
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को उठाने के बजाय राजकीय संपत्ति में से योगदान देने या उपलब्ध कराने का अर्थ रखता है। सरल हिंदी में ‘दिए’ स्वाभाविक है और यह नहीं दर्शाता कि योशियाह ने स्वयं बलि चढ़ाई।
- source_word: לִבְנֵי הָעָם
  choice: लोगों को
  rationale: शाब्दिक रूप ‘प्रजा के पुत्रों’ है, पर संदर्भ में इसका आशय सामान्य लोगों या उपस्थित जनसमुदाय से है। ‘लोगों को’ आधुनिक हिंदी में सहज और समावेशी है।
- source_word: צֹאן
  choice: भेड़-बकरियों के झुंड में से
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, को सूचित करती है; अगला पद उनकी जातियों को स्पष्ट करता है।
- source_word: כְּבָשִׂים וּבְנֵי עִזִּים
  choice: मेमने और बकरी के बच्चे
  rationale: यह पशुओं के दोनों वर्गों को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है और बकरियों की कम आयु का संकेत बनाए रखता है।
- source_word: הַכֹּל לַפְּסָחִים
  choice: सभी लोगों के फसह-बलियों के लिए
  rationale: פְּסָחִים का बहुवचन यहाँ सामूहिक रूप से फसह के लिए चढ़ाए जाने वाले पशुओं/बलियों को सूचित करता है। वाक्य-विन्यास में ‘सभी’ को उपस्थित लोगों से जोड़ते हुए बलियों का उद्देश्य स्पष्ट किया गया है।
- source_word: לְכָל הַנִּמְצָא
  choice: उपस्थित सभी लोगों के लिए
  rationale: निफ़अल कृदंत का आशय उत्सव में पाए गए अर्थात उपस्थित सभी सहभागियों से है।
- source_word: לְמִסְפַּר שְׁלֹשִׁים אֶלֶף
  choice: कुल तीस हज़ार
  rationale: यह झुंड से दिए गए मेमनों और बकरी के बच्चों की कुल संख्या को संक्षिप्त और स्वाभाविक हिंदी में बताता है।
- source_word: וּבָקָר שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार गाय-बैल
  rationale: בָּקָר बड़े पालतू पशुओं की सामूहिक संज्ञा है। ‘गाय-बैल’ लिंग को अनावश्यक रूप से सीमित किए बिना हिंदी में इस पशु-वर्ग को स्पष्ट करता है।
- source_word: אֵלֶּה מֵרְכוּשׁ הַמֶּלֶךְ
  choice: ये सब राजा की अपनी संपत्ति में से थे
  rationale: רְכוּשׁ संपत्ति या निजी संसाधनों को दर्शाता है। ‘अपनी’ से स्पष्ट होता है कि पशु राजा के संसाधनों से आए थे।
theological_decisions:
- issue: फसह के बहुवचन פְּסָחִים का आशय
  choice: फसह-बलियाँ
  alternative: फसह के पशु / फसह
  rationale: संदर्भ पशुओं की व्यवस्था का है, इसलिए बहुवचन को अनेक फसह-बलियों के सामूहिक संकेत के रूप में व्यक्त किया गया है; इससे किसी विशिष्ट बलि-विधान का अतिरिक्त विवरण नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे इब्रानी वाक्य को विराम-चिह्नों से व्यवस्थित किया गया है, जबकि संख्या, प्राप्तकर्ता, उद्देश्य और पशुओं के राजकीय संपत्ति से आने का क्रम सुरक्षित रखा गया है।
