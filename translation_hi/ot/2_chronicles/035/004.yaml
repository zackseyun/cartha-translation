  text: Prepare yourselves by your fathers’ houses according to your divisions[b][a], as prescribed in the writing of David king of Israel and in the writing of Solomon his son.
translation:
  language: hi
  text: अपने पैतृक घरानों[a] और अपने-अपने विभागों[b] के अनुसार तैयार हो जाओ, इस्राएल के राजा दाऊद और उसके पुत्र सुलैमान के लेखों के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने पूर्वजों के घरानों के अनुसार।’ इब्रानी पदबंध इस्राएल के पैतृक अथवा पूर्वज-आधारित घरानों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विभागों’ का अनुवाद ‘सेवा-विभागों’ या ‘क्रमों’ भी किया जा सकता है, विशेषकर याजकीय या लेवीय व्यवस्था के संदर्भ में।
    reason: lexical_alternative
