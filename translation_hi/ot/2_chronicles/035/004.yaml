- source_word: בִּכְתָב
  choice: लेख में ... निर्धारित
  rationale: כְּתָב का मूल अर्थ ‘लेख/लिखित दस्तावेज़’ है; यहाँ ב लिखित व्यवस्था के अनुरूप होने का भाव देता है, जिसे ‘लेख में निर्धारित’ स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा दाऊद
  rationale: राजकीय उपाधि और नाम को स्वाभाविक हिन्दी पदक्रम में रखा गया है।
- source_word: וּבְמִכְתַּב
  choice: और ... के लिखित निर्देश में
  rationale: מִכְתָּב लिखित दस्तावेज़ को दर्शाता है। इस प्रसंग में ‘लिखित निर्देश’ उसके संगठनात्मक कार्य को स्पष्ट करता है, जबकि ‘में’ मूल पूर्वसर्ग को बनाए रखता है।
- source_word: שְׁלֹמֹה בְנוֹ
  choice: उसके पुत्र सुलैमान
  rationale: सर्वनाम का संबंध दाऊद से स्पष्ट रखते हुए पुत्र-संबंध को यथावत व्यक्त किया गया है।
