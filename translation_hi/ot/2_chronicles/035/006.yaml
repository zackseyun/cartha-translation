  yaml_path: translation/ot/2_chronicles/035/006.yaml
  text: Slaughter the Passover lamb[a], consecrate yourselves, and prepare for your brothers[b], to do according to the word of Yahweh by the hand of Moses.
translation:
  language: hi
  text: फ़सह के पशु[a] का वध करो, अपने आप को पवित्र करो, और अपने भाइयों के लिए तैयारियाँ करो, कि वे मूसा के माध्यम से दिए गए यहोवा के वचन के अनुसार करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “फ़सह”; इब्रानी शब्द फ़सह के बलिदान या पर्व को सूचित कर सकता है, पर यहाँ वध किए जाने वाले बलि-पशु का अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטוּ
  choice: वध करो
  rationale: שׁחט बलि-संबंधी प्रसंग में पशु का विधिपूर्वक वध करने को दर्शाता है; ‘वध करो’ सामान्य ‘मारो’ की अपेक्षा इस अनुष्ठानिक अर्थ को बेहतर रखता है।
- source_word: הַפָּסַח
  choice: फ़सह के पशु
  rationale: यहाँ פֶּסַח पर्व मात्र नहीं, वध किए जाने वाले फ़सह-बलि के पशु को सूचित करता है। ‘पशु’ मूल में निहित संदर्भ को स्पष्ट करता है, पर ‘मेमना’ कहकर उसकी जाति को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְהִתְקַדְּשׁוּ
  choice: अपने आप को पवित्र करो
  rationale: हित्पएल रूप आत्म-संबंधी पवित्रीकरण अथवा पवित्र सेवा के लिए अनुष्ठानिक तैयारी व्यक्त करता है।
- source_word: וְהָכִינוּ
  choice: तैयारी करो
  rationale: हिफ़ील रूप का अर्थ तैयार करना या तैयार रखना है। इब्रानी में कर्म अव्यक्त है, इसलिए हिन्दी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: לַאֲחֵיכֶם
  choice: अपने भाइयों के लिए
  rationale: शाब्दिक अर्थ ‘तुम्हारे भाइयों के लिए’ है; प्रसंग में ये सह-इस्राएली हैं जिनके लिए लेवी सेवा की तैयारी करते हैं।
- source_word: לַעֲשׂוֹת
  choice: ताकि ... कार्य किया जाए
  rationale: अनंत रूप तैयारी के उद्देश्य या परिणाम को अगले वाक्यांश से जोड़ता है। हिन्दी में अस्पष्ट कर्ता को बनाए रखने के लिए भाववाच्य प्रयोग किया गया है।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: דבר यहाँ अधिकारपूर्ण ईश्वरीय निर्देश है; ‘वचन’ इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा दिए गए
  rationale: शाब्दिक मुहावरा ‘मूसा के हाथ से’ माध्यम को व्यक्त करता है। स्वाभाविक हिन्दी में ‘मूसा के द्वारा दिए गए’ यह स्पष्ट करता है कि वचन मूसा के माध्यम से मिला।
theological_decisions:
- issue: לַאֲחֵיכֶם में लिंगयुक्त पारिवारिक संबोधन
  choice: अपने भाइयों के लिए
  alternative: अपने सह-इस्राएलियों के लिए
  rationale: मूल पाठ पुल्लिंग बहुवचन ‘भाइयों’ कहता है। व्यापक समुदाय संदर्भित हो सकता है, फिर भी मुख्य पाठ मूल की लिंगयुक्त अभिव्यक्ति बनाए रखता है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: चतुरक्षरीय नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके हिन्दी पाठकों में परिचित व्यक्तिगत नाम से प्रस्तुत किया गया है।
- issue: לַעֲשׂוֹת का निहित कर्ता
  choice: ताकि ... कार्य किया जाए
  alternative: ताकि वे ... करें
  rationale: इब्रानी अनंत रूप स्पष्ट नहीं करता कि कार्य करने वाले लेवी हैं या उनके भाई। भाववाच्य हिन्दी इस वास्तविक अस्पष्टता को किसी एक पक्ष में हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘वध’, ‘पवित्र’ और ‘वचन’ धार्मिक प्रसंग की गंभीरता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिन्दी में सहज है।
