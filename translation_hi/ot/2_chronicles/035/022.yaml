source:
  edition: WLC
  text: וְ/לֹֽא הֵסֵב֩ יֹאשִׁיָּ֨הוּ פָנָ֜י/ו מִמֶּ֗/נּוּ כִּ֤י לְ/הִלָּחֵֽם בּ/וֹ֙ הִתְחַפֵּ֔שׂ וְ/לֹ֥א שָׁמַ֛ע אֶל דִּבְרֵ֥י נְכ֖וֹ מִ/פִּ֣י אֱלֹהִ֑ים וַ/יָּבֹ֕א לְ/הִלָּחֵ֖ם בְּ/בִקְעַ֥ת מְגִדּֽוֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/022.yaml
  text: But Josiah did not turn his face away from him[a]; rather, he disguised himself to fight against him. He did not listen to the words of Neco from the mouth of God[c][b], and he came to fight in the Valley of Megiddo.
translation:
  language: hi
  text: परन्तु योशियाह ने उससे अपना मुँह नहीं मोड़ा[a]; बल्कि उससे लड़ने के लिए उसने अपना भेष बदल लिया। उसने नको की उन बातों पर ध्यान नहीं दिया जो परमेश्वर के मुँह से निकली थीं[b], और वह मगिद्दो की घाटी[c] में लड़ने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे नहीं मुड़ा।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “परमेश्वर के मुँह से।”'
    reason: lexical_alternative
  - marker: c
    text: या, “मगिद्दो के मैदान में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסֵב ... פָנָיו מִמֶּנּוּ
  choice: उससे अपना मुँह नहीं मोड़ा
  rationale: यह इब्रानी मुहावरे की मुख-संबंधी छवि को बनाए रखता है और आधुनिक हिन्दी में भी स्वाभाविक तथा बोधगम्य है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ यह पिछले निषेध के विपरीत योशियाह के वास्तविक कार्य का परिचय देता है; इसलिए कारणसूचक अनुवाद के बजाय विरोधसूचक ‘बल्कि’ संदर्भानुकूल है।
- source_word: לְהִלָּחֵם בּוֹ
  choice: उससे लड़ने के लिए
  rationale: यह उद्देश्य को व्यक्त करता है और בּוֹ को सैन्य संदर्भ में स्वाभाविक हिन्दी ‘उससे’ द्वारा प्रस्तुत करता है।
- source_word: הִתְחַפֵּשׂ
  choice: उसने अपना भेष बदल लिया
  rationale: हित्पाएल रूप का आत्मवाचक अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: שָׁמַע אֶל
  choice: पर ध्यान नहीं दिया
  rationale: इस प्रयोग में केवल सुनना नहीं, बल्कि बात मानना या उस पर ध्यान देना निहित है; यह अनुवाद उस व्यापक आशय को बिना ‘आज्ञा मानना’ थोपे व्यक्त करता है।
- source_word: דִּבְרֵי נְכוֹ
  choice: नको की उन बातों
  rationale: ‘बातों’ דִּבְרֵי का सीधा और सहज अनुवाद है; ‘उन’ अगले स्रोतवाचक वाक्यांश से संबंध स्पष्ट करता है।
- source_word: מִפִּי אֱלֹהִים
  choice: जो परमेश्वर के मुँह से निकली थीं
  rationale: यह मूल की ‘परमेश्वर के मुँह से’ वाली सशक्त छवि और नको की बातों के दिव्य स्रोत के दावे को सुरक्षित रखता है।
- source_word: וַיָּבֹא לְהִלָּחֵם
  choice: वह ... लड़ने आया
  rationale: בוא का मूल अर्थ ‘आना’ और उद्देश्यसूचक अनन्त रूप दोनों सीधे रूप में संरक्षित हैं।
- source_word: בְּבִקְעַת מְגִדּוֹ
  choice: मगिद्दो की घाटी में
  rationale: בִּקְעָה चौड़ी घाटी या मैदानी घाटी को सूचित कर सकता है; मुख्य पाठ में ‘घाटी’ स्पष्ट और भौगोलिक रूप से उपयुक्त है।
theological_decisions:
- issue: क्या नको की बातें वास्तव में परमेश्वर से आई हुई प्रस्तुत की गई हैं
  choice: मुख्य पाठ स्पष्ट रूप से कहता है कि वे बातें ‘परमेश्वर के मुँह से’ निकली थीं।
  alternative: इसे केवल ‘परमेश्वर की ओर से’ कहा जा सकता है, या नको के अपने दावे के रूप में समझाया जा सकता है।
  rationale: वचन का कथन इन बातों को दिव्य स्रोत से जोड़ता है। अनुवाद इस कथन और उससे उत्पन्न धार्मिक तनाव को बनाए रखता है, न तो उसे कम करता है और न नको के अप्रमाणित दावे के रूप में बदलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘मुँह मोड़ा’ और ‘परमेश्वर के मुँह से’ जैसी मूल इब्रानी छवियाँ जानबूझकर सुरक्षित रखी गई हैं; अत्यधिक संस्कृतनिष्ठ सैन्य भाषा से बचा गया है।
