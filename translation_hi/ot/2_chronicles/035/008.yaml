source:
  edition: WLC
  text: וְ/שָׂרָ֞י/ו לִ/נְדָבָ֥ה לָ/עָ֛ם לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם הֵרִ֑ימוּ חִלְקִיָּ֨ה וּ/זְכַרְיָ֜הוּ וִֽ/יחִיאֵ֗ל נְגִידֵי֙ בֵּ֣ית הָ/אֱלֹהִ֔ים לַ/כֹּהֲנִ֞ים נָתְנ֣וּ לַ/פְּסָחִ֗ים אַלְפַּ֨יִם֙ וְ/שֵׁ֣שׁ מֵא֔וֹת וּ/בָקָ֖ר שְׁלֹ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/008.yaml
  text: And his officials contributed a freewill offering for the people[a], for the priests, and for the Levites. Hilkiah, Zechariah, and Jehiel, the leaders of the house of God[b], gave to the priests 2,600 Passover offerings and 300 cattle.
translation:
  language: hi
  text: और उसके अधिकारियों ने लोगों, याजकों और लेवियों के लिए स्वेच्छा-भेंट दी। परमेश्वर के भवन के प्रधानों—हिल्कियाह, जकर्याह और यहीएल—ने याजकों को फसह-बलि के 2,600 पशु और 300 मवेशी दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרָיו
  choice: उसके अधिकारियों ने भी
  rationale: שָׂרִים पद और प्रशासनिक अधिकार रखने वालों को सूचित करता है; आधुनिक हिन्दी में “अधिकारी” स्वाभाविक है। וְ को प्रसंगानुकूल “भी” से व्यक्त किया गया है।
- source_word: לִנְדָבָה ... הֵרִימוּ
  choice: स्वेच्छा से भेंट दी
  rationale: נְדָבָה स्वैच्छिक दान को और רום का हिफ़ील यहाँ अंशदान करने को सूचित करता है। संयुक्त हिन्दी वाक्यांश अर्थ को सहज रूप से व्यक्त करता है।
- source_word: לָעָם לַכֹּהֲנִים וְלַלְוִיִּם
  choice: लोगों, याजकों और लेवियों के लिए
  rationale: दोहराया गया ל इन समूहों को लाभार्थी बताता है; “के लिए” इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: חִלְקִיָּה וּזְכַרְיָהוּ וִיחִיאֵל
  choice: हिल्कियाह, जकर्याह और यहीएल
  rationale: नामों का हिन्दी बाइबलीय परंपरा और इब्रानी उच्चारण के अनुरूप लिप्यंतरण किया गया है।
- source_word: נְגִידֵי בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के प्रधानों
  rationale: נְגִידֵי नेतृत्व अथवा प्रमुख पद का बोध कराता है; “प्रधान” मंदिर के प्रशासनिक संदर्भ में उपयुक्त है। “परमेश्वर का भवन” मंदिर के लिए मूल रूपक को बनाए रखता है।
- source_word: לַפְּסָחִים אַלְפַּיִם וְשֵׁשׁ מֵאוֹת
  choice: फसह के बलिदानों के लिए 2,600 पशु
  rationale: לַפְּסָחִים का बहुवचन फसह में बलि किए जाने वाले पशुओं को सूचित कर सकता है। हिन्दी में गिने जाने वाले पद को स्पष्ट करने के लिए “पशु” जोड़ा गया है, जबकि उद्देश्य “फसह के बलिदानों के लिए” से व्यक्त है।
- source_word: וּבָקָר שְׁלֹשׁ מֵאוֹת
  choice: और 300 गाय-बैल
  rationale: בָּקָר मवेशियों के लिए सामूहिक संज्ञा है। “गाय-बैल” आधुनिक हिन्दी में इसे व्यापक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: לַפְּסָחִים की व्याख्या और संख्याओं का वाक्यगत संबंध
  choice: “फसह के बलिदानों के लिए 2,600 पशु और 300 गाय-बैल”
  alternative: “याजकों को फसह के लिए 2,600 और 300 गाय-बैल दिए”
  rationale: मूल में 2,600 के बाद गिनी गई वस्तु प्रत्यक्ष रूप से नहीं लिखी गई; निकटवर्ती संदर्भ के अनुसार ये फसह के पशु हैं। मुख्य पाठ में आवश्यक पूर्ति की गई है, और शाब्दिक संरचना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: לָעָם का संभावित संदर्भ
  choice: “लोगों के लिए”
  alternative: “फसह के बलिदानों के लिए”
  rationale: मासोरेटिक पाठ में לָעָם स्पष्टतः “लोगों के लिए” है। निकटवर्ती לַפְּסָחִים के प्रभाव से पशुओं से संबंधित अर्थ प्रस्तावित हुआ है, पर मुख्य पाठ में प्रत्यक्ष इब्रानी रूप को प्राथमिकता दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “फसह,” “याजक,” और “लेवी” जैसे प्रचलित बाइबलीय पद बनाए गए हैं। मूल की संक्षिप्त और कुछ हद तक अस्पष्ट संख्यात्मक रचना को मुख्य पाठ में पठनीय बनाया गया है तथा वैकल्पिक वाक्य-विन्यास पादटिप्पणी में दिया गया है।
