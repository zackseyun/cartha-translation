source:
  edition: WLC
  text: וְ/הַ/מְשֹֽׁרֲרִ֨ים בְּנֵי אָסָ֜ף עַל מַעֲמָדָ֗/ם כְּ/מִצְוַ֤ת דָּוִיד֙ וְ/אָסָ֞ף וְ/הֵימָ֤ן וִֽ/ידֻתוּן֙ חוֹזֵ֣ה הַ/מֶּ֔לֶךְ וְ/הַ/שֹּׁעֲרִ֖ים לְ/שַׁ֣עַר וָ/שָׁ֑עַר אֵ֣ין לָ/הֶ֗ם לָ/סוּר֙ מֵ/עַ֣ל עֲבֹֽדָתָ֔/ם כִּֽי אֲחֵי/הֶ֥ם הַ/לְוִיִּ֖ם הֵכִ֥ינוּ לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/015.yaml
  text: And the singers[a], the sons of Asaph, were at their stations according to the command of David, Asaph, Heman, and Jeduthun the king’s seer; and the gatekeepers were at each gate. They had no need to depart from their service[b], because their brothers the Levites prepared for them.
translation:
  language: hi
  text: और गायक, अर्थात् आसाप के पुत्र, दाऊद, आसाप, हेमान और राजा के दर्शी यदूतून की आज्ञा के अनुसार अपने-अपने स्थान पर थे; और द्वारपाल हर एक फाटक पर थे। उन्हें अपनी सेवा छोड़कर जाने की आवश्यकता नहीं थी[a], क्योंकि उनके भाई, लेवियों ने, उनके लिए तैयारी कर रखी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “उन्हें अपनी सेवा से हटना नहीं था।” पर अगला उपवाक्य इस अर्थ का समर्थन करता है कि लेवियों की तैयारी के कारण उन्हें वहाँ से जाने की आवश्यकता नहीं थी।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְשֹׁרֲרִים
  choice: गायक
  rationale: यह שׁיר से बना कृदन्त है और मन्दिर में गानेवालों को दर्शाता है; ‘गायक’ सीधा और स्वाभाविक अनुवाद है।
- source_word: בְּנֵי אָסָף
  choice: आसाप के वंशज
  rationale: शाब्दिक अर्थ ‘आसाप के पुत्र’ है, पर यहाँ आसाप से जुड़ी वंश-परम्परा अथवा गायक-दल अभिप्रेत है; आधुनिक हिन्दी में ‘वंशज’ अर्थ अधिक स्पष्ट करता है।
- source_word: עַל מַעֲמָדָם
  choice: अपने-अपने स्थान पर थे
  rationale: מַעֲמָד नियुक्त खड़े होने के स्थान या पद को सूचित करता है; वितरित जिम्मेदारियों के प्रसंग में यह हिन्दी सहज है।
- source_word: כְּמִצְוַת
  choice: की आज्ञा के अनुसार
  rationale: מִצְוָה यहाँ अधिकारपूर्ण निर्देश है; यह अनुवाद उसके बल और वाक्य-संबंध को सुरक्षित रखता है।
- source_word: חוֹזֵה הַמֶּלֶךְ
  choice: राजा के दर्शी
  rationale: חוֹזֶה एक विशेष पदनाम है; ‘दर्शी’ इसे सामान्य ‘भविष्यद्वक्ता’ में विलीन किए बिना ऐतिहासिक भेद बनाए रखता है।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपाल
  rationale: मन्दिर के फाटकों पर नियुक्त सेवकों के लिए यह सटीक और प्रचलित हिन्दी शब्द है।
- source_word: לְשַׁעַר וָשָׁעַר
  choice: हर एक फाटक पर
  rationale: इब्रानी की पुनरुक्त वितरणात्मक रचना प्रत्येक फाटक पर अलग नियुक्ति बताती है।
- source_word: אֵין לָהֶם לָסוּר
  choice: उन्हें ... छोड़कर जाने की आवश्यकता नहीं थी
  rationale: אֵין + ל infinitive यहाँ अवसर अथवा आवश्यकता के अभाव को व्यक्त करता है; अगला कारणवाचक वाक्य इसी अर्थ का समर्थन करता है।
- source_word: מֵעַל עֲבֹדָתָם
  choice: अपनी सेवा
  rationale: עֲבֹדָה का मन्दिर-संबंधी अर्थ ‘सेवा’ है, जो सामान्य ‘काम’ की अपेक्षा प्रसंग को बेहतर रखता है।
- source_word: אֲחֵיהֶם הַלְוִיִּם
  choice: उनके भाई लेवियों
  rationale: ‘भाई’ मूल पाठ के स्पष्ट संबंध-सूचक शब्द को बनाए रखता है, और ‘लेवी’ उनका परिचय देता है।
- source_word: הֵכִינוּ לָהֶם
  choice: उनके लिए तैयारी कर रखी थी
  rationale: הכין का अर्थ तैयार करना है; मूल में तैयार की गई वस्तु नहीं बताई गई, इसलिए अनुवाद भी उसे अनिर्दिष्ट रखता है।
theological_decisions:
- issue: ‘राजा के दर्शी’ का वाक्यगत संबंध
  choice: 'इसे निकटतम नाम यदूतून से जोड़ा गया: ‘राजा के दर्शी यदूतून’।'
  alternative: इसे नामों की पूरी पूर्ववर्ती सूची से अधिक ढीले रूप में संबंधित माना जा सकता है।
  rationale: एकवचन पदबंध חוֹזֵה הַמֶּלֶךְ स्वाभाविक रूप से अपने ठीक पहले आए एकवचन नाम यदूतून का समानाधिकरण है।
- issue: אֵין לָהֶם לָסוּר का बल
  choice: ‘उन्हें ... जाने की आवश्यकता नहीं थी।’
  alternative: ‘उन्हें अपनी सेवा से हटना नहीं था।’
  rationale: यह रचना आवश्यकता या अवसर के अभाव को व्यक्त कर सकती है, और ‘क्योंकि’ से आरम्भ अगला उपवाक्य बताता है कि लेवियों की तैयारी के कारण उन्हें जाना नहीं पड़ा; फिर भी अधिक निषेधात्मक अर्थ संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘दर्शी’ जैसे ऐतिहासिक पदनाम को सुरक्षित रखा गया है। मूल की अस्पष्टता केवल वहीं पादटिप्पणी में दी गई है जहाँ उसका वास्तविक वाक्यगत प्रभाव है।
