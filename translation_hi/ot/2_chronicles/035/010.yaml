base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/010.yaml
  text: So the service was prepared[a], and the priests stood at their stations, and the Levites by their divisions[c][b], according to the command of the king.
translation:
  language: hi
  text: इस प्रकार सेवा की व्यवस्था की गई[a], और याजक अपने-अपने स्थानों पर[b] तथा लेवीय अपने-अपने विभागों के अनुसार[c] खड़े हुए, राजा की आज्ञा के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तैयार की गई” अथवा “स्थापित की गई।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अपने खड़े होने के स्थान पर”; अर्थात अपने नियुक्त स्थानों पर।'
    reason: lexical_alternative
  - marker: c
    text: या “अपने-अपने दलों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: व्यवस्थित की गई
  rationale: כון का रूप यहाँ सेवा के तैयार, स्थापित या सुव्यवस्थित किए जाने को व्यक्त करता है। प्रसंग में ‘व्यवस्थित की गई’ अनुष्ठान की तैयारी और उचित क्रम, दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: הָעֲבוֹדָה
  choice: उपासना की सेवा
  rationale: मन्दिर और फसह के प्रसंग में עֲבוֹדָה पवित्र सेवा या उपासना-संबंधी कर्तव्य को सूचित करता है। ‘उपासना की सेवा’ सामान्य ‘काम’ की अपेक्षा प्रसंग को अधिक स्पष्ट करता है।
- source_word: וַיַּעַמְדוּ
  choice: खड़े हो गए
  rationale: עמד का सीधा अर्थ खड़ा होना या अपना स्थान ग्रहण करना है; आगे के पदबंध नियुक्त स्थान और दल स्पष्ट करते हैं।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर-सेवा के संदर्भ में כֹּהֲנִים का मानक और सुबोध हिन्दी रूप।
- source_word: עַל עָמְדָם
  choice: अपने-अपने निर्धारित स्थानों पर
  rationale: शाब्दिक भाव ‘अपने खड़े होने के स्थान पर’ है। यह चयन नियुक्त सेवास्थानों का आशय स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: הַלְוִיִּם
  choice: लेवीय
  rationale: लेवी गोत्र और मन्दिर-सेवा से संबद्ध समूह के लिए प्रचलित हिन्दी पद।
- source_word: עַל מַחְלְקוֹתָם
  choice: अपने-अपने दलों में
  rationale: מַחְלְקוֹתָם संगठित सेवा-दलों या श्रेणियों को दर्शाता है। ‘दलों में’ व्यवस्था के अनुसार समूहबद्ध नियुक्ति को संक्षेप में व्यक्त करता है।
- source_word: כְּמִצְוַת
  choice: की आज्ञा के अनुसार
  rationale: यहाँ מִצְוָה किसी सामान्य विधि के बजाय राजा के विशिष्ट निर्देश को सूचित करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संदर्भित शासक के लिए सीधा मानक अनुवाद।
theological_decisions:
- issue: עֲבוֹדָה के उपासना-संबंधी अर्थ का अनुवाद
  choice: उपासना की सेवा
  alternative: सेवा; काम; अनुष्ठानिक सेवा
  rationale: फसह और मन्दिर के प्रसंग में पवित्र सेवा का भाव बनाए रखा गया है, पर बाद की किसी विशिष्ट कलीसियाई या सम्प्रदायगत पारिभाषिकता को नहीं जोड़ा गया।
- issue: याजकों और लेवियों की व्यवस्थित नियुक्ति व्यक्त करने वाले मुहावरों का अनुवाद
  choice: अपने-अपने निर्धारित स्थानों पर ... अपने-अपने दलों में
  alternative: अपने स्थान पर ... अपने विभागों के अनुसार
  rationale: यह नियुक्त स्थानों और संगठित सेवा-दलों के मूल भाव को पठनीय आधुनिक हिन्दी में रखता है, बिना अतिरिक्त धार्मिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘उपासना की सेवा’ मन्दिर-संदर्भ को स्पष्ट करती है; ‘निर्धारित स्थानों’ और ‘दलों’ से मूल पाठ की व्यवस्थित सेवा-रचना बनी रहती है।
