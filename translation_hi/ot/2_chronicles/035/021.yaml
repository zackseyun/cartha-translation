  text: וַ/יִּשְׁלַ֣ח אֵלָ֣י/ו מַלְאָכִ֣ים לֵ/אמֹר֩ מַה לִּ֨/י וָ/לָ֜/ךְ מֶ֣לֶךְ יְהוּדָ֗ה לֹא עָלֶ֨י/ךָ אַתָּ֤ה הַ/יּוֹם֙ כִּ֚י אֶל בֵּ֣ית מִלְחַמְתִּ֔/י וֵ/אלֹהִ֖ים אָמַ֣ר לְ/בַֽהֲלֵ֑/נִי חֲדַל לְ/ךָ֛ מֵ/אֱלֹהִ֥ים אֲשֶׁר עִמִּ֖/י וְ/אַל יַשְׁחִיתֶֽ/ךָ׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/021.yaml
  text: But he sent messengers to him[a], saying, “What have I to do with you, king of Judah? I am not coming against you today, but against the house with which I am at war; and God has told me to hurry. Stop opposing God, who is with me, so that he does not destroy you.”
translation:
  language: hi
  text: पर उसने उसके पास दूत भेजकर कहा, “हे यहूदा के राजा, मेरा तुमसे क्या लेना-देना? आज मैं तुम्हारे विरुद्ध नहीं, बल्कि उस घराने के विरुद्ध जा रहा हूँ जिससे मेरा युद्ध है।[a] परमेश्वर ने मुझे जल्दी करने को कहा है। जो परमेश्वर मेरे साथ है, उसका विरोध करना छोड़ दो, कहीं ऐसा न हो कि वह तुम्हें नष्ट कर दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे युद्ध के स्थान की ओर,” अथवा “उस राज्य या राजसत्ता के विरुद्ध जिससे मेरा युद्ध है।” इब्रानी पदबंध कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים
  choice: दूत
  rationale: कथा के इस प्रसंग में ये नको द्वारा भेजे गए मानव संदेशवाहक हैं; ‘दूत’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: מַה לִּי וָלָךְ
  choice: मेरा तुमसे क्या लेना-देना?
  rationale: यह इब्रानी मुहावरा असंबद्धता या हस्तक्षेप न चाहने का भाव व्यक्त करता है; यह हिन्दी मुहावरा उसी बल को सहज ढंग से रखता है।
- source_word: לֹא עָלֶיךָ אַתָּה הַיּוֹם
  choice: आज मैं तुम्हारे विरुद्ध नहीं ... जा रहा हूँ
  rationale: मूल वाक्य लुप्तक्रियात्मक है; ‘जा रहा हूँ’ प्रसंग से निहित गति को स्पष्ट करते हुए अर्थ सुरक्षित रखता है।
- source_word: אֶל בֵּית מִלְחַמְתִּי
  choice: उस राजघराने के विरुद्ध ... जिससे मेरा युद्ध है
  rationale: असामान्य पदबंध में בֵּית का अर्थ घराना, राजवंश या राज्य-सत्ता हो सकता है। ‘राजघराना’ घर/वंश की छवि और राजनीतिक आशय दोनों रखता है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: וֵאלֹהִים
  choice: परमेश्वर
  rationale: साथ की क्रिया אָמַר एकवचन है, और अगले पद में इतिहासकार इन शब्दों को परमेश्वर के मुख से आया बताता है; इसलिए एकवचन ‘परमेश्वर’ उचित है।
- source_word: לְבַהֲלֵנִי
  choice: मुझे शीघ्रता करने को
  rationale: בהל यहाँ तत्काल आगे बढ़ने या जल्दी करने का भाव देता है; ‘शीघ्रता करने’ में आदेश की तात्कालिकता बनी रहती है।
- source_word: חֲדַל לְךָ מֵאֱלֹהִים
  choice: परमेश्वर ... का विरोध करना छोड़ दो
  rationale: यह पदबंध परमेश्वर के कार्य में बाधा देने या उसका प्रतिरोध करने से रुकने की चेतावनी देता है।
- source_word: אֲשֶׁר עִמִּי
  choice: जो परमेश्वर मेरे साथ है
  rationale: यह मूल संबंधवाचक उपवाक्य को बिना यह तय किए सुरक्षित रखता है कि साथ होने का ठीक स्वरूप क्या है।
- source_word: וְאַל יַשְׁחִיתֶךָ
  choice: कहीं ऐसा न हो कि वह तुम्हें नष्ट कर दे
  rationale: אַל वाला उपवाक्य चेतावनीपूर्ण परिणाम व्यक्त करता है; ‘कहीं ऐसा न हो’ उस बल को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: नको के कथन में אֱלֹהִים का संदर्भ
  choice: एकवचन ‘परमेश्वर’
  alternative: ‘कोई देवता’ अथवा ‘देवताओं’
  rationale: एकवचन क्रिया और अगले पद में इतिहासकार की व्याख्या एकवचन परमेश्वर की ओर संकेत करती है। यह अनुवाद नको के निजी धर्मविज्ञान पर कोई अतिरिक्त निष्कर्ष नहीं थोपता।
- issue: בֵּית מִלְחַמְתִּי की व्याख्या
  choice: मुख्य पाठ में ‘उस राजघराने के विरुद्ध ... जिससे मेरा युद्ध है’
  alternative: ‘मेरे युद्ध के स्थान की ओर’ अथवा ‘उस राज्य के विरुद्ध जिससे मेरा युद्ध है’
  rationale: इब्रानी पदबंध कठिन और संदिग्ध है। ‘राजघराना’ संभावित वंश/राज्य-सत्ता का अर्थ देता है, जबकि पादटिप्पणी स्थान और राज्य के विकल्पों को सुरक्षित रखती है।
- issue: אֲשֶׁר עִמִּי में परमेश्वर के साथ होने का स्वरूप
  choice: ‘जो परमेश्वर मेरे साथ है’
  alternative: ‘जो मेरी ओर है’ या ‘जो इस काम में मेरे साथ है’
  rationale: सरल अनुवाद मूल की धार्मिक तनातनी को बनाए रखता है और दिव्य समर्थन के स्वरूप को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष संबोधन में ‘तुम’ रखा गया है; ‘हे यहूदा के राजा’ कथन की औपचारिकता बनाए रखता है।
