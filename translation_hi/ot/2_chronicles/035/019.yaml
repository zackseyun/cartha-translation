lexical_decisions:
- source_word: בִּשְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: अठारहवें वर्ष में
  rationale: בְּ के साथ संख्या और שָׁנָה का प्रयोग समय बताने वाला मुहावरा है; हिंदी में यह स्वाभाविक और सटीक रूप है।
- source_word: לְמַלְכוּת יֹאשִׁיָּהוּ
  choice: योशियाह के शासन के
  rationale: מַלְכוּת यहाँ योशियाह के राजकीय शासनकाल को दर्शाता है; ‘शासन’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: נַעֲשָׂה
  choice: मनाया गया
  rationale: क्रिया का मूल अर्थ ‘किया गया’ है, पर פֶּסַח के साथ इसका आशय धार्मिक पर्व का पालन करना है; ‘मनाया गया’ इस प्रसंग में स्वाभाविक हिंदी है।
- source_word: הַפֶּסַח
  choice: फसह
  rationale: यह इब्रानी पर्व פֶּסַח का हिंदी बाइबलीय नाम है; मूल पाठ में अलग से ‘पर्व’ शब्द नहीं है।
- source_word: הַזֶּה
  choice: यह
  rationale: संकेतवाचक शब्द पहले वर्णित विशिष्ट फसह की ओर लौटकर संकेत करता है।
