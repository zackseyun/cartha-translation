  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וַ/חֲסָדָ֑י/ו כַּ/כָּת֖וּב בְּ/תוֹרַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/026.yaml
  text: 'The rest of the acts of Josiah[a], and his deeds of faithful love, as written in the Law of Yahweh:'
translation:
  language: hi
  text: 'योशियाह के शेष कार्य और उसके निष्ठावान प्रेम के कार्य[a], जैसा कि यहोवा की व्यवस्था में लिखा है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी निष्ठा के कार्य,” “उसकी वफादारी के कार्य,” अथवा “उसकी कृपा के कार्य।” इब्रानी शब्द कृपा, निष्ठा, या वाचा के प्रति विश्वासयोग्यता का भाव व्यक्त कर सकता है।
    reason: חֲסָדָיו के अर्थ-विस्तार और सम्भव अनुवादों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: राजकीय इतिहास के समापन-सूत्र में דִּבְרֵי का अर्थ राजा के कथनों के बजाय उसके कामों या वृत्तांत से है; יֶתֶר शेष सामग्री को सूचित करता है।
- source_word: יֹאשִׁיָּהוּ
  choice: योशियाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַחֲסָדָיו
  choice: और उसके निष्ठापूर्ण प्रेम के कार्य
  rationale: חֶסֶד में प्रेम, निष्ठा और वाचा-संबंधी विश्वसनीयता की अर्थछायाएँ हैं। यह पद केवल सामान्य दयालुता नहीं, बल्कि योशियाह के निष्ठापूर्ण आचरण की ओर संकेत करता है; अर्थ की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: כַּכָּתוּב
  choice: जैसा कि ... लिखा है
  rationale: כְּ और निष्क्रिय कृदंत का स्वाभाविक हिन्दी रूप, जो लिखित प्रमाण की ओर संकेत करता है।
- source_word: בְּתוֹרַת
  choice: की व्यवस्था में
  rationale: यहाँ תּוֹרָה यहोवा की आधिकारिक लिखित व्यवस्था को दर्शाता है; इस ऐतिहासिक प्रसंग में ‘व्यवस्था’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय निज नाम के लिए आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण।
theological_decisions:
- issue: योशियाह के विषय में חֶסֶד का अनुवाद
  choice: निष्ठापूर्ण प्रेम के कार्य
  alternative: निष्ठा के काम; कृपा के काम; वाचा के प्रति निष्ठा के कार्य
  rationale: यह चयन प्रेम और निष्ठा दोनों अर्थछायाएँ बनाए रखता है, पर मूल शब्द को केवल पारस्परिक दया या किसी पूर्ण विकसित तकनीकी वाचाई पद में सीमित नहीं करता। पादटिप्पणी वास्तविक शब्दार्थ-विस्तार बताती है।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: निज नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी पाठकों में स्थापित और सहज पहचाना जाने वाला रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। पद अगले पद की ओर ले जाने वाला अपूर्ण राजकीय समापन-वाक्य है, इसलिए अंत में मूल के अनुरूप द्विबिंदु रखा गया है।
