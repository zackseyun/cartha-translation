id: 2CH.35.16
reference: 2 Chronicles 35:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ֠/תִּכּוֹן כָּל עֲבוֹדַ֨ת יְהוָ֜ה בַּ/יּ֤וֹם הַ/הוּא֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/הַעֲל֣וֹת עֹל֔וֹת עַ֖ל מִזְבַּ֣ח יְהוָ֑ה כְּ/מִצְוַ֖ת הַ/מֶּ֥לֶךְ יֹאשִׁיָּֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/016.yaml
  text: So all the service of Yahweh was prepared on that day, to keep the Passover and to offer burnt offerings on the altar of Yahweh, according to the command of King Josiah.
translation:
  language: hi
  text: इस प्रकार उस दिन यहोवा की सारी सेवा सुव्यवस्थित की गई, ताकि फसह मनाया जाए और राजा योशिय्याह की आज्ञा के अनुसार यहोवा की वेदी पर होमबलियाँ चढ़ाई जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכּוֹן
  choice: सुव्यवस्थित की गई
  rationale: निफ़ाल रूप यहाँ उपासना-संबंधी पूरे कार्य के तैयार और उचित क्रम में रखे जाने का परिणामसूचक भाव देता है।
- source_word: כָּל עֲבוֹדַת יְהוָה
  choice: यहोवा की सारी उपासना-सेवा
  rationale: עֲבוֹדָה मंदिर और बलिदान के संदर्भ में उपासना-संबंधी सेवा या कार्य को दर्शाता है; संयुक्त पद आधुनिक हिन्दी में इस धार्मिक संदर्भ को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित रूप 'यहोवा' से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: कालवाचक पद का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: ताकि फसह मनाया जाए
  rationale: शाब्दिक 'फसह करना' एक इब्रानी धार्मिक मुहावरा है, जिसका अर्थ फसह का विधिपूर्वक पालन या उत्सव मनाना है।
- source_word: וְהַעֲלוֹת עֹלוֹת
  choice: और ... होमबलियाँ चढ़ाई जाएँ
  rationale: עלה के हिफ़ील रूप और עֹלוֹת का संयोग बलिदान चढ़ाने का मानक धार्मिक प्रयोग है; 'होमबलि' पूर्णतः जलाए जाने वाले बलिदान को व्यक्त करता है।
- source_word: עַל מִזְבַּח יְהוָה
  choice: यहोवा की वेदी पर
  rationale: स्थानवाचक संबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּמִצְוַת הַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: राजा योशिय्याह की आज्ञा के अनुसार
  rationale: מִצְוָה यहाँ सामान्य धार्मिक विधान के बजाय प्रसंग में राजा के निर्देश को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी बाइबल-पाठकों के लिए परिचित लिप्यंतरण 'यहोवा' नाम को उपाधि से बदले बिना सुरक्षित रखता है।
- issue: עֲבוֹדַת का धार्मिक दायरा
  choice: उपासना-सेवा
  alternative: काम
  rationale: प्रसंग मंदिर, फसह और बलिदानों का है; इसलिए केवल 'काम' धार्मिक सेवा के आशय को पर्याप्त रूप से नहीं दर्शाता, जबकि 'उपासना-सेवा' इसे अनावश्यक रूप से केवल पुरोहितों तक सीमित भी नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। कर्मवाच्य रचना मूल के परिणामसूचक/निष्पादित भाव को बनाए रखती है; धार्मिक पदों में 'फसह', 'वेदी' और 'होमबलि' जैसे परिचित हिन्दी बाइबलीय शब्द प्रयुक्त हैं।
