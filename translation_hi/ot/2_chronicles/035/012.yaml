source:
  edition: WLC
  text: וַ/יָּסִ֨ירוּ הָ/עֹלָ֜ה לְ֠/תִתָּ/ם לְ/מִפְלַגּ֤וֹת לְ/בֵית אָבוֹת֙ לִ/בְנֵ֣י הָ/עָ֔ם לְ/הַקְרִיב֙ לַ/יהוָ֔ה כַּ/כָּת֖וּב בְּ/סֵ֣פֶר מֹשֶׁ֑ה וְ/כֵ֖ן לַ/בָּקָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/012.yaml
  text: They removed the burnt offerings[a], to give them by divisions of the fathers’ houses to the sons of the people, to present to Yahweh, as it is written in the Book of Moses; and so also with the cattle.
translation:
  language: hi
  text: उन्होंने होमबलियों को अलग किया, ताकि उन्हें प्रजाजनों[a] के पैतृक घरानों के विभागों को दे सकें और यहोवा को चढ़ाएँ, जैसा मूसा की पुस्तक में लिखा है; और गौपशुओं के साथ भी वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “प्रजा के पुत्रों।” यह कुल-आधारित अभिव्यक्ति याजकों और लेवियों से अलग सामान्य प्रजा को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: अलग करके
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को उसके स्थान से हटाकर अलग रखने का भाव देता है; बलिदान की तैयारी और वितरण के प्रसंग में यह स्वाभाविक है।
- source_word: הָעֹלָה
  choice: होमबलि के भागों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ रखता है। प्रसंग में बलिदानी पशुओं से होमबलि के लिए निर्धारित भाग अलग किए जा रहे हैं; इसीलिए केवल ‘होमबलि’ की अपेक्षा ‘होमबलि के भागों’ से प्रक्रिया अधिक स्पष्ट होती है।
- source_word: לְתִתָּם
  choice: दे दिया
  rationale: उद्देश्यसूचक क्रिया वितरण के लिए देने को व्यक्त करती है। हिंदी वाक्य में ‘अलग करके ... दे दिया’ मूल क्रियाक्रम को सहज रूप से प्रकट करता है।
- source_word: לְמִפְלַגּוֹת לְבֵית אָבוֹת
  choice: उनके पितृकुलों के दलों के अनुसार
  rationale: מִפְלַגּוֹת संगठित दलों या विभागों को और בֵית אָבוֹת पैतृक कुल-इकाइयों को दर्शाता है। यह अनुवाद पारिवारिक-प्रशासनिक व्यवस्था को बनाए रखता है।
- source_word: לִבְנֵי הָעָם
  choice: प्रजाजनों
  rationale: शाब्दिक रूप ‘प्रजा के पुत्रों’ है, पर यह सामूहिक पद याजकों और लेवियों से अलग सामान्य प्रजा को सूचित करता है। ‘प्रजाजनों’ आधुनिक हिंदी में इसी प्रतिनिधिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְהַקְרִיב לַיהוָה
  choice: यहोवा को चढ़ाएँ
  rationale: बलिदानी संदर्भ में הקריב का अर्थ निकट लाकर अर्पित करना है। ‘चढ़ाएँ’ हिंदी में प्रचलित, स्पष्ट और संदर्भानुकूल है।
- source_word: כַּכָּתוּב בְּסֵפֶר מֹשֶׁה
  choice: जैसा मूसा की पुस्तक में लिखा है
  rationale: यह लिखित मूसीय निर्देश का स्पष्ट उल्लेख है और मूल सूत्रात्मक अभिव्यक्ति को सहज हिंदी में रखता है।
- source_word: וְכֵן לַבָּקָר
  choice: गौपशुओं के साथ भी उन्होंने ऐसा ही किया
  rationale: संक्षिप्त इब्रानी पद उसी प्रक्रिया को बड़े पालतू पशुओं पर लागू करता है। हिंदी में निहित क्रिया जोड़ने से अर्थ स्पष्ट होता है, जबकि ‘गौपशु’ בקר के गोवंशीय अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला वाचा-नाम प्रत्यक्ष रूप से है। हिंदी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य नामरूप ‘यहोवा’ रखा गया है, न कि उसे ‘प्रभु’ उपाधि से बदला गया है।
- issue: לִבְנֵי הָעָם का प्रतिनिधिक और सामाजिक अर्थ
  choice: प्रजाजनों
  alternative: प्रजा के पुत्रों
  rationale: यह पद सामान्य जनसमुदाय को याजकीय और लेवीय सेवकों से अलग करता है। मुख्य पाठ में स्वाभाविक सामूहिक हिंदी रखी गई है और मूल की पुरुषवाची शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पितृकुलों के दल’ प्राचीन कुल-आधारित संगठन को बनाए रखता है, जबकि ‘प्रजाजन’ अस्वाभाविक शाब्दिकता से बचाता है। पादटिप्पणी का चिह्न [a] मुख्य पाठ में उपस्थित है।
