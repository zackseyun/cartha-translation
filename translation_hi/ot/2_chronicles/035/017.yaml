  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵֽי יִשְׂרָאֵ֧ל הַֽ/נִּמְצְאִ֛ים אֶת הַ/פֶּ֖סַח בָּ/עֵ֣ת הַ/הִ֑יא וְ/אֶת חַ֥ג הַ/מַּצּ֖וֹת שִׁבְעַ֥ת יָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/017.yaml
  text: And the Israelites who were present kept the Passover at that time, and the Feast of Unleavened Bread for seven days.
translation:
  language: hi
  text: जो इस्राएली उपस्थित थे, उन्होंने उस समय फसह मनाया और सात दिन तक अख़मीरी रोटी का पर्व मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: मनाया
  rationale: शाब्दिक अर्थ ‘किया/बनाया’ है, पर पर्व के साथ यह इब्रानी मुहावरा उसका पालन या उत्सव मनाने का भाव देता है। आधुनिक हिन्दी में ‘मनाया’ स्वाभाविक और सटीक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह इस्राएल के लोगों के लिए सामूहिक जातिनाम है; ‘इस्राएली’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הַנִּמְצְאִים
  choice: जो ... वहाँ उपस्थित थे
  rationale: מצא का कृदन्त यहाँ उन लोगों को सूचित करता है जो उस अवसर पर मौजूद थे; शाब्दिक ‘जो पाए गए’ हिन्दी में भ्रामक होगा।
- source_word: הַפֶּסַח
  choice: फसह
  rationale: संदर्भ में यह केवल बलि-पशु नहीं, बल्कि फसह के समूचे अनुष्ठान/उत्सव को दर्शाता है। ‘फसह’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह सीधे समय का संकेत देता है। ‘नियत समय’ कहना मूल से अधिक विशिष्ट अर्थ जोड़ता।
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: חַג का अर्थ ‘पर्व’ और מַצּוֹת का अर्थ खमीर-रहित रोटियाँ है। ‘अख़मीरी रोटी का पर्व’ आधुनिक पाठक के लिए सुबोध और प्रचलित नाम है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पर्व की अवधि बताता है; हिन्दी में ‘सात दिन तक’ स्वाभाविक रूप से अवधि व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मनाया’ की पुनरावृत्ति मूल में दोनों पर्वों पर लागू क्रिया के आशय को स्पष्ट करती है; ‘भी’ दोनों संबद्ध उत्सवों को सहज हिन्दी में जोड़ता है।
