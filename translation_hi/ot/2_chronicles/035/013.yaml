  edition: WLC
  text: וַֽ/יְבַשְּׁל֥וּ הַ/פֶּ֛סַח בָּ/אֵ֖שׁ כַּ/מִּשְׁפָּ֑ט וְ/הַ/קֳּדָשִׁ֣ים בִּשְּׁל֗וּ בַּ/סִּיר֤וֹת וּ/בַ/דְּוָדִים֙ וּ/בַ/צֵּ֣לָח֔וֹת וַ/יָּרִ֖יצוּ לְ/כָל בְּנֵ֥י הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/013.yaml
  text: They cooked the Passover lamb in the fire according to the rule[a], and they boiled the holy offerings in pots, kettles, and bowls, and quickly brought them to all the people.
translation:
  language: hi
  text: उन्होंने फसह-बलि को नियम के अनुसार आग पर पकाया[a], और पवित्र भेंटों को हाँडियों, देगों और कटोरों में उबाला; फिर उन्हें सब लोगों तक शीघ्र पहुँचा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशिष्ट रूप से, “फसह-बलि को आग पर भूना।” हिब्रू क्रिया का व्यापक अर्थ “पकाना” हो सकता है, पर फसह के विधान में फसह-बलि को उबालने के बजाय आग पर भूनना था (देखें निर्गमन 12:8–9)।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַשְּׁלוּ
  choice: पकाया
  rationale: בשׁל का अर्थ व्यापक रूप से पकाना हो सकता है। यहाँ ‘आग पर’ और ‘नियम के अनुसार’ विधि को स्पष्ट करते हैं; इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया है और भूनने का अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַפֶּסַח
  choice: फसह-बलि
  rationale: इस अनुष्ठानिक संदर्भ में ‘फसह’ से पकाया जाने वाला बलिपशु अभिप्रेत है। ‘फसह-बलि’ यह ठोस संदर्भ स्पष्ट करता है, पर स्रोत में स्पष्ट न होने के कारण ‘मेमना’ नहीं जोड़ता।
- source_word: בָּאֵשׁ
  choice: आग पर
  rationale: हिंदी में भोजन को आग से पकाने की विधि के लिए ‘आग पर’ स्वाभाविक है और भूनने की दिशा भी व्यक्त करता है।
- source_word: כַּמִּשְׁפָּט
  choice: नियम के अनुसार
  rationale: यहाँ מִשְׁפָּט निर्धारित धार्मिक विधि या विधान को सूचित करता है; ‘नियम के अनुसार’ सहज आधुनिक हिंदी है।
- source_word: וְהַקֳּדָשִׁים
  choice: पवित्र भेंटों
  rationale: बहुवचन पद फसह-बलि से भिन्न समर्पित बलि-भागों की ओर संकेत करता है; ‘पवित्र भेंटें’ अनुष्ठानिक अर्थ को स्पष्ट रखता है।
- source_word: בִּשְּׁלוּ
  choice: उबाला
  rationale: इसके बाद पात्रों की सूची आने से यहाँ पात्र में उबालकर पकाने का अर्थ उपयुक्त है और पहली तैयारी-विधि से अंतर प्रकट होता है।
- source_word: בַּסִּירוֹת וּבַדְּוָדִים וּבַצֵּלָחוֹת
  choice: हाँडियों, देगों और कटोरों में
  rationale: ये तीन अलग प्रकार के पकाने या परोसने के पात्र हैं। आधुनिक हिंदी में ये निकटतम सहज समतुल्य हैं, यद्यपि अंतिम पात्र का ठीक आकार निश्चित नहीं है।
- source_word: וַיָּרִיצוּ
  choice: शीघ्रता से ... ले गए
  rationale: क्रिया में तेज गति और तत्परता का भाव है; यह हिंदी प्रयोग गति और गंतव्य दोनों को स्पष्ट करता है।
- source_word: לְכָל בְּנֵי הָעָם
  choice: सब लोगों के पास
  rationale: शाब्दिक ‘प्रजा के पुत्रों’ के बजाय यह मुहावरा सामूहिक रूप से सामान्य लोगों को दर्शाता है; हिंदी में ‘सब लोग’ स्वाभाविक है।
theological_decisions:
- issue: בשׁל और फसह-विधान में भूनने की अपेक्षा के बीच संभावित तनाव
  choice: मुख्य पाठ में ‘पकाया’ रखा और ‘आग पर’ को विधि बताने दिया; अधिक विशिष्ट ‘भूना’ पादटिप्पणी में दिया।
  alternative: ‘फसह-बलि को आग पर भूना’
  rationale: इससे हिब्रू क्रिया का व्यापक अर्थ और पद में उल्लिखित विधि दोनों सुरक्षित रहते हैं, जबकि निर्गमन 12:8–9 के साथ संबंध पाठक के लिए स्पष्ट किया जाता है।
- issue: הַקֳּדָשִׁים का संदर्भ
  choice: इसे फसह-बलि से भिन्न अन्य पवित्र भेंटें माना।
  alternative: इसे फसह सहित सभी पवित्र भोजन का सामान्य उल्लेख मानना।
  rationale: वाक्य-विन्यास फसह और पवित्र भेंटों को अलग-अलग रखता है, और उनकी अलग तैयारी-विधियाँ इस भेद का समर्थन करती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फसह-बलि’ अनुष्ठानिक संदर्भ स्पष्ट करता है, जबकि ‘मेमना’ जैसा स्रोत में अप्रकट विवरण नहीं जोड़ता।
