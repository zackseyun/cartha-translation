  yaml_path: translation/ot/2_chronicles/035/027.yaml
  text: His acts[a], first and last, behold[c][b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: hi
  text: उसके आदि से अन्त तक के कार्य[a]—देखो[b], वे इस्राएल और यहूदा के राजाओं की पुस्तक में लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी बातों” अथवा “उससे सम्बन्धित विषयों”; इब्रानी शब्द का अर्थ वचन, विषय या कार्य हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ ध्यान दिलाने वाला शब्द है, जिसका भाव “देखो” या “ध्यान दो” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבָרָיו
  choice: उसके ... कार्यों
  rationale: דבר का अर्थ ‘वचन’, ‘विषय/बात’ या प्रसंगानुसार ‘कार्य’ हो सकता है। राजकीय सारांश के इस सूत्र में राजा के कार्य और वृत्तान्त अभिप्रेत हैं, इसलिए ‘कार्यों’ स्वाभाविक है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: आरम्भ से अन्त तक
  rationale: शाब्दिक ‘पहले और बाद के’ राजा के पूरे जीवनकाल के कार्यों को समेटने वाला इतिहास-वृत्तान्त सूत्र है। हिन्दी में ‘आरम्भ से अन्त तक’ उसी व्यापकता को सहज रूप में व्यक्त करता है।
- source_word: הִנָּם
  choice: '... है'
  rationale: הִנָּם ध्यान दिलाने वाला बलसूचक पद है। अलग से पुरातन ‘देखो’ रखने के बजाय हिन्दी के प्रस्तुतिकरणात्मक ‘... है’ में उसका बल समाहित किया गया है।
- source_word: כְּתוּבִים
  choice: लिखा हुआ है
  rationale: כתב का कर्मवाच्य कृदन्त सीधे लिखित अभिलेख की ओर संकेत करता है। एकवचन ‘वर्णन’ के साथ हिन्दी में ‘लिखा हुआ है’ व्याकरणसम्मत है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: עַל का मूल अर्थ ‘पर’ है, पर किसी लिखित अभिलेख के संदर्भ में हिन्दी मुहावरा ‘पुस्तक में लिखा’ कहता है। ספר यहाँ पुस्तक अथवा प्राचीन ग्रन्थ-पत्र दोनों को सूचित कर सकता है।
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा के राजाओं
  rationale: यह उद्धृत ऐतिहासिक स्रोत का नामसूचक पद है। हिन्दी में दोनों राज्यों को साझा सम्बन्धबोधक ‘के’ के अंतर्गत रखना स्वाभाविक है।
