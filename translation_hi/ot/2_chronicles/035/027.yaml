  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। राजकीय अभिलेख-सूत्र को शब्दशः कठोर बनाने के बजाय स्वाभाविक हिन्दी वाक्य में रखा गया है, जबकि דְּבָרִים की अर्थ-विविधता और הִנֵּה-सदृश बल पादटिप्पणियों में सुरक्षित हैं।
