source:
  edition: WLC
  text: אַחֲרֵ֣י כָל זֹ֗את אֲשֶׁ֨ר הֵכִ֤ין יֹֽאשִׁיָּ֨הוּ֙ אֶת הַ/בַּ֔יִת עָלָ֞ה נְכ֧וֹ מֶֽלֶךְ מִצְרַ֛יִם לְ/הִלָּחֵ֥ם בְּ/כַרְכְּמִ֖ישׁ עַל פְּרָ֑ת וַ/יֵּצֵ֥א לִ/קְרָאת֖/וֹ יֹאשִׁיָּֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/020.yaml
  text: After all this[a], when Josiah had prepared the house, Neco king of Egypt went up to fight at Carchemish on the Euphrates[b], and Josiah went out to meet him.
translation:
  language: hi
  text: इन सब बातों के बाद, जब योशियाह ने मंदिर[a] को तैयार किया था, तब मिस्र का राजा नको फरात के किनारे कर्कमीश में युद्ध करने के लिए चढ़ आया। योशियाह उससे मिलने निकला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “घर” या “भवन” है, जो यहाँ मंदिर को दर्शाता है।
    reason: मूल शब्द के शाब्दिक अर्थ और उसके संदर्भगत अभिप्राय को स्पष्ट करने के लिए।
  - marker: b
    text: या “उसका सामना करने निकला।” इस सैन्य प्रसंग में इसका अर्थ “उसके विरुद्ध निकला” भी हो सकता है।
    reason: इब्रानी पदबंध मिलने, सामने जाने, अथवा विरोध में निकलने का अर्थ दे सकता है।
lexical_decisions:
- source_word: הֵכִין
  choice: तैयार कर लिया था
  rationale: हिफ़ील रूप यहाँ तैयार करने अथवा व्यवस्थित करने का भाव देता है। संदर्भ में यह मंदिर को उचित रीति से कार्य के लिए तैयार किए जाने की ओर संकेत करता है; अनुवाद मूल की व्यापकता बनाए रखता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: शाब्दिक अर्थ ‘घर/भवन’ है और इतिहास-वृत्तांत में इससे मंदिर अभिप्रेत है। ‘भवन’ मूल अभिव्यक्ति को बनाए रखते हुए हिंदी में गरिमापूर्ण और संदर्भानुकूल है।
- source_word: עָלָה
  choice: चढ़ आया
  rationale: मूल क्रिया का सामान्य अर्थ ‘ऊपर जाना/चढ़ना’ है। सैन्य यात्रा के संदर्भ में ‘चढ़ आया’ स्वाभाविक हिंदी है और ‘कूच किया’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: לְהִלָּחֵם
  choice: युद्ध करने के लिए
  rationale: क्रिया का अर्थ युद्ध में भिड़ना है। यह चयन आधुनिक हिंदी में स्पष्ट और स्रोत के अनुरूप है।
- source_word: בְּכַרְכְּמִישׁ
  choice: कर्कमीश में
  rationale: यहाँ ב को स्थानसूचक समझना आगामी ‘फरात के किनारे’ के साथ सबसे स्वाभाविक है।
- source_word: עַל פְּרָת
  choice: फरात के किनारे
  rationale: मुहावरा फरात नदी के पास स्थित स्थान बताता है। हिंदी में ‘किनारे’ भौगोलिक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: उसका सामना करने निकला
  rationale: לִקְרָאתוֹ मिलने, सामने जाने या संदर्भानुसार मुकाबला करने का भाव दे सकता है। सैन्य प्रसंग में ‘सामना करने’ उपयुक्त है, जबकि पादटिप्पणी संभावित तटस्थ अर्थ सुरक्षित रखती है।
theological_decisions:
- issue: योशियाह के बाहर निकलने का उद्देश्य
  choice: उसका सामना करने निकला
  alternative: उससे मिलने निकला
  rationale: सैन्य संदर्भ टकराव का संकेत देता है, फिर भी इब्रानी पदबंध अपने आप में मिलने या सामने जाने का अर्थ भी रख सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; ऐतिहासिक वर्णन के अनुरूप सरल, गरिमापूर्ण शैली। ‘नको’, ‘कर्कमीश’ और ‘फरात’ प्रचलित हिंदी बाइबिलीय नामरूप हैं।
