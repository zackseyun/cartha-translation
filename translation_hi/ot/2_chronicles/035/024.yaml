base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/024.yaml
  text: So his servants removed him from the chariot and set him on the second chariot that belonged to him[a], and brought him to Jerusalem. And he died and was buried in the tombs of his fathers, and all Judah and Jerusalem mourned for Josiah.
translation:
  language: hi
  text: तब उसके सेवकों ने उसे रथ से उतारा और उसके दूसरे रथ पर चढ़ाया[a]। वे उसे यरूशलेम ले गए। फिर उसकी मृत्यु हुई और उसे उसके पूर्वजों की कब्रों में दफ़नाया गया; और समस्त यहूदा और यरूशलेम ने योशिय्याह के लिए शोक मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का शाब्दिक रूप ‘द्वितीय का रथ’ है। सम्भवतः इसका अर्थ योशिय्याह का दूसरा या आरक्षित रथ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירֻהוּ
  choice: उसे रथ से उतारा
  rationale: हिफ़ील रूप यहाँ एक स्थान से दूसरे स्थान पर हटाने का भाव देता है; घायल योशिय्याह को रथ से बाहर निकालने के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: शब्द राजा की सेवा और देखभाल में लगे लोगों को दर्शाता है; ‘सेवक’ पद या सैनिक दर्जा अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּרְכִּיבֻהוּ
  choice: चढ़ाया
  rationale: हिफ़ील रूप का अर्थ चढ़ाना या सवार कराना है; घायल व्यक्ति को दूसरे रथ पर रखे जाने के लिए ‘चढ़ाया’ सहज है।
- source_word: רֶכֶב הַמִּשְׁנֶה אֲשֶׁר לוֹ
  choice: उसके दूसरे रथ
  rationale: शाब्दिक संरचना ‘दूसरे का रथ, जो उसका था’ है। ‘उसके दूसरे रथ’ निकट, संक्षिप्त और स्वाभाविक है, जबकि यह स्पष्ट नहीं करता कि वह निश्चित रूप से आरक्षित रथ था।
- source_word: וַיּוֹלִיכֻהוּ יְרוּשָׁלִַם
  choice: वे उसे यरूशलेम ले गए
  rationale: हिफ़ील रूप यहाँ गंतव्य तक पहुँचाने या ले जाने का अर्थ देता है।
- source_word: וַיָּמָת
  choice: जहाँ उसकी मृत्यु हो गई
  rationale: इब्रानी क्रम के अनुसार मृत्यु यरूशलेम ले जाए जाने के बाद बताई गई है; हिन्दी में ‘जहाँ’ संबंध को स्वाभाविक बनाता है, यद्यपि मूल में यह शब्द प्रत्यक्षतः नहीं है।
- source_word: בְּקִבְרוֹת אֲבֹתָיו
  choice: उसके पूर्वजों की कब्रों में
  rationale: ‘पूर्वज’ आधुनिक हिन्दी में वंशगत अर्थ को ‘पितरों’ या शाब्दिक ‘पिताओं’ से अधिक स्पष्ट रूप से व्यक्त करता है; मूल का बहुवचन ‘कब्रों’ में सुरक्षित है।
- source_word: מִתְאַבְּלִים עַל יֹאשִׁיָּהוּ
  choice: योशिय्याह के लिए शोक मनाया
  rationale: हित्पएल कृदंत शोक की दशा या जारी क्रिया दर्शाता है। कथा-वर्णन में ‘शोक मनाया’ स्वाभाविक हिन्दी है और सामूहिक विलाप का भाव रखता है।
