  edition: WLC
  text: ו/כונניהו וּ/שְׁמַֽעְיָ֨הוּ וּ/נְתַנְאֵ֜ל אֶחָ֗י/ו וַ/חֲשַׁבְיָ֧הוּ וִ/יעִיאֵ֛ל וְ/יוֹזָבָ֖ד שָׂרֵ֣י הַ/לְוִיִּ֑ם הֵרִ֨ימוּ לַ/לְוִיִּ֤ם לַ/פְּסָחִים֙ חֲמֵ֣שֶׁת אֲלָפִ֔ים וּ/בָקָ֖ר חֲמֵ֥שׁ מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/009.yaml
  text: Conaniah[a], and Shemaiah and Nethanel his brothers, and Hashabiah and Jeiel and Jozabad, the chiefs of the Levites, contributed to the Levites for the Passover offerings five thousand and five hundred head of cattle.
translation:
  language: hi
  text: कोनन्याह, उसके भाई शमायाह और नतनेल, तथा हशब्याह, यीएल और योजाबाद—जो लेवियों के प्रधान थे—उन्होंने लेवियों को फसह-बलियों के लिए पाँच हज़ार भेड़-बकरियाँ[a] और पाँच सौ गाय-बैल दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में यहाँ केवल “पाँच हज़ार” है; “भेड़-बकरियाँ” पिछले पद के समानांतर वर्णन से समझी जाती हैं।
    reason: मूल में निहित पशु-संज्ञा को अनुवाद में स्पष्ट करने की सूचना।
lexical_decisions:
- source_word: כונניהו
  choice: कोनन्याह
  rationale: इब्रानी व्यक्ति-नाम का प्रचलित और स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: שְׁמַעְיָהוּ
  choice: शमायाह
  rationale: इब्रानी नाम का स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: נְתַנְאֵל
  choice: नतनेल
  rationale: नाम का स्रोत-सन्निकट हिन्दी रूप।
- source_word: אֶחָיו
  choice: उसके भाई
  rationale: मूल का सामान्य पारिवारिक अर्थ बनाए रखा गया है; यहाँ सर्वनाम को कोनन्याह से जोड़कर स्वाभाविक हिन्दी वाक्य बनाया गया है।
- source_word: חֲשַׁבְיָהוּ
  choice: हशब्याह
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יעיאל
  choice: यीएल
  rationale: व्यक्ति-नाम का स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: יוֹזָבָד
  choice: योजाबाद
  rationale: व्यक्ति-नाम का स्रोत-सन्निकट हिन्दी लिप्यंतरण।
- source_word: שָׂרֵי הַלְוִיִּם
  choice: लेवियों के प्रधान
  rationale: שָׂרֵי पदाधिकार और नेतृत्व को सूचित करता है; ‘प्रधान’ dignified और सहज हिन्दी है।
- source_word: הֵרִימוּ
  choice: दिए
  rationale: हिफ़ील रूप यहाँ अंशदान देने का भाव रखता है। हिन्दी में ‘दिए’ प्रसंगानुकूल और स्वाभाविक है, जबकि दान का उद्देश्य आगे स्पष्ट है।
- source_word: לַפְּסָחִים
  choice: फसह-बलियों के लिए
  rationale: इब्रानी बहुवचन यहाँ अनेक फसह-पशुओं/बलियों को सूचित करता है, न कि अनेक पर्वों को। ‘बलियों’ से उपासना-संबंधी अर्थ स्पष्ट रहता है।
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: पाँच हज़ार भेड़-बकरियाँ
  rationale: मूल में पशु-संज्ञा व्यक्त नहीं है, पर निकटवर्ती समानांतर विवरण में छोटे पशु और गाय-बैल अलग गिने गए हैं। पाठक के लिए निहित संज्ञा जोड़ी गई है और इसे पादटिप्पणी में बताया गया है।
- source_word: וּבָקָר חֲמֵשׁ מֵאוֹת
  choice: और पाँच सौ गाय-बैल
  rationale: בָּקָר बड़े पालतू पशुओं/cattle का सामूहिक पद है। ‘गाय-बैल’ लिंग को अनावश्यक रूप से सीमित किए बिना आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: पाँच हज़ार और पाँच सौ की गणना
  choice: पाँच हज़ार भेड़-बकरियाँ और पाँच सौ गाय-बैल
  alternative: कुल पाँच हज़ार पाँच सौ गाय-बैल
  rationale: इब्रानी वाक्य में पहले ‘पाँच हज़ार’ और फिर अलग से וּבָקָר חֲמֵשׁ מֵאוֹת (‘और गाय-बैल पाँच सौ’) है। इसलिए दोनों संख्याओं को जोड़कर 5,500 गाय-बैल कहना स्रोत के व्याकरण और प्रसंग के विरुद्ध होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण कथात्मक शैली। नामों को देवनागरी में स्रोत-सन्निकट रूप दिया गया है। वाक्य की लंबी नाम-सूची को स्पष्ट रखने के लिए डैश का प्रयोग किया गया है।
