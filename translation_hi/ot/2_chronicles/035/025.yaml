translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, किंतु सहज शैली अपनाई गई है। कथन की जारी परंपरा को दिखाने के लिए ‘आज तक ... करते हैं’ रखा गया है। पादटिप्पणी-चिह्न को उस वाक्यांश के तुरंत बाद रखा गया है जिससे वैकल्पिक अर्थ संबंधित है।
