  terminology: '''विलाप,'' ''विलाप-गीत,'' ''गायक और गायिकाएँ,'' and ''स्थापित रीति'' are appropriate modern-standard Hindi choices. The personal names are accurately represented in Hindi biblical usage. The quotation marks alone do not clearly distinguish a collection title from generic lament songs; ''नामक संग्रह'' resolves this while preserving the alternative in the footnote.'
