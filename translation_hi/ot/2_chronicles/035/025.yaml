  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְקוֹנֵ֣ן יִרְמְיָהוּ֮ עַל יֹאשִׁיָּהוּ֒ וַ/יֹּאמְר֣וּ כָֽל הַ/שָּׁרִ֣ים וְ֠/הַ/שָּׁרוֹת בְּ/קִינ֨וֹתֵי/הֶ֤ם עַל יֹאשִׁיָּ֨הוּ֙ עַד הַ/יּ֔וֹם וַ/יִּתְּנ֥וּ/ם לְ/חֹ֖ק עַל יִשְׂרָאֵ֑ל וְ/הִנָּ֥/ם כְּתוּבִ֖ים עַל הַ/קִּינֽוֹת־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/025.yaml
  text: And Jeremiah lamented for Josiah[a], and all the male singers and female singers speak of Josiah in their laments to this day. And they made them a statute in Israel; behold, they are written in the Laments.
translation:
  language: hi
  text: और यिर्मयाह ने योशिय्याह के लिए विलाप किया। आज तक सभी गायक और गायिकाएँ अपने विलाप-गीतों में योशिय्याह का उल्लेख करते आए हैं। उन्होंने इन गीतों को इस्राएल में एक स्थापित रीति बना दिया; और देखो, वे ‘विलाप-गीतों’ नामक संग्रह में लिखे हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विलाप-गीतों में लिखे हैं,” यदि यह वाक्यांश ‘विलाप-गीतों’ नामक किसी विशेष संग्रह के बजाय सामान्य रूप से विलाप के गीतों की ओर संकेत करता हो।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְקוֹנֵן
  choice: विलाप किया
  rationale: קונן मृतक के लिए विलाप करने या विलाप-गीत गाने को दर्शाता है। यह चुनाव रचना और गायन में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל יֹאשִׁיָּהוּ
  choice: योशिय्याह के लिए
  rationale: विलाप के प्रसंग में עַל का स्वाभाविक हिन्दी रूप ‘के लिए’ है।
- source_word: הַשָּׁרִים וְהַשָּׁרוֹת
  choice: सभी गायक और गायिकाएँ
  rationale: इब्रानी में पुरुष और स्त्री गायकों का स्पष्ट अलग उल्लेख है; हिन्दी में इसे स्वाभाविक ढंग से सुरक्षित रखा गया है।
- source_word: וַיֹּאמְרוּ ... עַד הַיּוֹם
  choice: आज तक ... उल्लेख करते हैं
  rationale: אמר का मूल भाव कहना है, पर विलाप-गीतों के संदर्भ में ‘उल्लेख करते हैं’ स्वाभाविक है। ‘आज तक’ जारी परंपरा को सूचित करता है, इसलिए वर्तमान काल रखा गया है।
- source_word: בְּקִינוֹתֵיהֶם
  choice: अपने विलाप-गीतों में
  rationale: קִינוֹת शोक के अवसर पर गाए या कहे जाने वाले विलाप हैं; ‘विलाप-गीत’ साधारण पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: וַיִּתְּנוּם לְחֹק עַל יִשְׂרָאֵל
  choice: उन्होंने इन गीतों को इस्राएल में एक स्थापित रीति बना दिया
  rationale: חֹק यहाँ विधि, निर्धारित प्रथा या स्थायी रीति को सूचित कर सकता है। संदर्भ में ‘स्थापित रीति’ कठोर कानूनी अर्थ थोपे बिना स्थायित्व व्यक्त करता है।
- source_word: וְהִנָּם
  choice: और देखो, वे
  rationale: הִנֵּה का ध्यान आकर्षित करने वाला बल ‘देखो’ से सुरक्षित रहता है और वर्णन की गरिमा भी बनी रहती है।
- source_word: כְּתוּבִים עַל הַקִּינוֹת
  choice: ‘विलाप-गीतों’ में लिखे हैं
  rationale: यह किसी ज्ञात संग्रह का नाम हो सकता है। उद्धरण-चिह्न शीर्षक-सदृश अर्थ दिखाते हैं, जबकि पादटिप्पणी सामान्य अर्थ की वास्तविक संभावना सुरक्षित रखती है।
