  yaml_path: translation/ot/2_chronicles/035/011.yaml
  text: And they slaughtered the Passover lamb[a], and the priests splashed the blood from their hands[c][b], while the Levites were skinning them.
translation:
  language: hi
  text: उन्होंने फसह-बलि[a] का वध किया। याजकों ने उनके हाथ से रक्त लेकर उसे छिड़का[b], और लेवी खाल उतार रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘फसह का बलि-पशु।’ इब्रानी में यहाँ फसह पर्व के बजाय फसह में बलि के लिए नियत पशु अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: ‘छिड़का’ बलिदान के रक्त को वेदी पर लगाने के लिए प्रयुक्त अनुष्ठानिक क्रिया का अनुवाद है; इसमें रक्त को उछालकर या बौछार के रूप में डालने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: बलि किया
  rationale: שׁחט बलि के पशु को विधिपूर्वक वध करने का मानक शब्द है; यहाँ ‘बलि किया’ सामान्य पाठक के लिए अनुष्ठानिक आशय स्पष्ट रखता है।
- source_word: הַפָּסַח
  choice: फसह-बलि के पशुओं
  rationale: यहाँ פֶּסַח पर्व नहीं, बलि किए जा रहे फसह के बलि-पशुओं को सूचित करता है। बहुवचन संदर्भ आगे खाल उतारने की क्रिया और अध्याय के व्यापक प्रसंग से स्पष्ट है।
- source_word: וַיִּזְרְקוּ
  choice: रक्त लेकर उसे छिड़का
  rationale: זרק बलिदान-संबंधी प्रसंग में वेदी पर रक्त लगाने/उछालकर डालने का पारिभाषिक शब्द है। ‘छिड़का’ प्रचलित और बोधगम्य हिन्दी है; ‘लेकर’ מִיָּדָם के संबंध को स्वाभाविक बनाता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: मन्दिर-सेवा के संदर्भ में כֹּהֲנִים का मानक हिन्दी रूप।
- source_word: מִיָּדָם
  choice: उनके हाथों से ... लेकर
  rationale: शाब्दिक अर्थ ‘उनके हाथ से’ है। संदर्भ में याजकों ने बलि करने वालों से रक्त प्राप्त किया; हिन्दी में ‘हाथों से लेकर’ इस हस्तांतरण को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהַלְוִיִּם מַפְשִׁיטִים
  choice: और लेवी पशुओं की खाल उतारते रहे
  rationale: पार्टिसिपल जारी या साथ-साथ हो रही क्रिया बताता है। פשט यहाँ मारे गए बलि-पशुओं की खाल उतारना है।
