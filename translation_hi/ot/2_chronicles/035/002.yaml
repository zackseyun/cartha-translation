  yaml_path: translation/ot/2_chronicles/035/002.yaml
  text: He appointed the priests to their duties and strengthened them for the service of the house of Yahweh[a][b].
translation:
  language: hi
  text: उसने याजकों को उनके नियत कार्यों पर नियुक्त किया[a] और यहोवा के भवन की सेवा के लिए उन्हें प्रोत्साहित किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके दलों में,” “उनके सेवा-स्थानों पर,” अथवा अधिक शाब्दिक रूप से “उनकी पहरियों पर।”
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें दृढ़ किया” या “उन्हें मजबूत किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: उसने ... नियुक्त किया
  rationale: עמד के हिफ़ील रूप का अर्थ यहाँ लोगों को उनके निर्धारित स्थान या दायित्व पर लगाना है; संदर्भ में राजा योशिय्याह कर्ता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों को
  rationale: यह כהנים का प्रचलित और स्पष्ट हिन्दी रूप है; निश्चितता संदर्भ और वाक्य-विन्यास में स्वाभाविक रूप से व्यक्त होती है।
- source_word: עַל מִשְׁמְרוֹתָם
  choice: उनके निर्धारित कामों पर
  rationale: מִשְׁמָרוֹת पहरे, सेवा-स्थानों, दलों या नियत दायित्वों का संकेत दे सकता है। यह चयन मंदिर-सेवा के प्रशासनिक संदर्भ को सहज हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: וַיְחַזְּקֵם
  choice: और ... उन्हें दृढ़ किया
  rationale: חזק के पिएल रूप में मजबूत करना, दृढ़ करना या प्रोत्साहित करना संभव है। ‘दृढ़ किया’ मूल शब्द की शक्ति-संबंधी छवि और प्रसंगगत समर्थन—दोनों को बनाए रखता है।
- source_word: לַעֲבוֹדַת
  choice: की सेवा के लिए
  rationale: עֲבוֹדָה यहाँ मंदिर से जुड़ी सेवा या कार्य को दर्शाता है; ‘सेवा’ धार्मिक संदर्भ में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בֵּית की ‘भवन’ के रूप में प्रस्तुति मूल इब्रानी रूपक को बनाए रखती है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला व्यक्तिगत नाम है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता। ‘याहवे’ अधिक प्रत्यक्ष लिप्यंतरण का विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘निर्धारित कामों’ से प्रशासनिक अर्थ स्पष्ट होता है; पादटिप्पणी מִשְׁמְרוֹת की वास्तविक अर्थ-व्याप्ति और חזק की प्रसंगगत अस्पष्टता सुरक्षित रखती है।
