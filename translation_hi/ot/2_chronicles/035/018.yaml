language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא נַעֲשָׂ֨ה פֶ֤סַח כָּמֹ֨/הוּ֙ בְּ/יִשְׂרָאֵ֔ל מִ/ימֵ֖י שְׁמוּאֵ֣ל הַ/נָּבִ֑יא וְ/כָל מַלְכֵ֣י יִשְׂרָאֵ֣ל לֹֽא עָשׂ֡וּ כַּ/פֶּ֣סַח אֲשֶׁר עָשָׂ֣ה יֹֽ֠אשִׁיָּהוּ וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם וְ/כָל יְהוּדָה֙ וְ/יִשְׂרָאֵ֣ל הַ/נִּמְצָ֔א וְ/יוֹשְׁבֵ֖י יְרוּשָׁלִָֽם־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/018.yaml
  text: No Passover like it had been kept in Israel since the days of Samuel the prophet[a], and none of the kings of Israel had kept a Passover like the one that Josiah kept, with the priests, the Levites, all Judah, Israel that was present[b], and the inhabitants of Jerusalem.
translation:
  language: hi
  text: शमूएल नबी के दिनों से इस्राएल में ऐसा फसह कभी नहीं मनाया गया था[a], और इस्राएल के किसी भी राजा ने वैसा फसह नहीं मनाया था जैसा योशियाह ने याजकों, लेवियों, समस्त यहूदा, वहाँ उपस्थित इस्राएलियों[b] और यरूशलेम के निवासियों के साथ मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमूएल नबी के दिनों से इस्राएल में इस जैसा फसह नहीं मनाया गया था।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वहाँ उपस्थित इस्राएल”; अर्थात उत्सव के लिए वहाँ मौजूद इस्राएली।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשָׂה / עָשׂוּ / עָשָׂה
  choice: मनाया गया / मनाया
  rationale: עשה के साथ פֶסַח का अर्थ फसह का पालन अथवा उत्सव मनाना है, न कि उसे बनाना। आधुनिक हिन्दी में ‘फसह मनाना’ स्वाभाविक और स्पष्ट है।
- source_word: פֶסַח
  choice: फसह
  rationale: यहाँ शब्द पूरे फसह-उत्सव के पालन को दर्शाता है, केवल बलि-पशु को नहीं। ‘फसह’ हिन्दी बाइबिलीय प्रयोग में स्थापित और पर्याप्त व्यापक है।
- source_word: כָּמֹהוּ
  choice: ऐसा
  rationale: सर्वनाम पहले उल्लिखित फसह की ओर संकेत करता है। हिन्दी में ‘ऐसा फसह’ तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: पूर्वसर्ग यहाँ स्थान अथवा राष्ट्रीय समुदाय का क्षेत्र बताता है; ‘इस्राएल में’ दोनों पहलुओं को सहज रूप से बनाए रखता है।
- source_word: מִימֵי שְׁמוּאֵל הַנָּבִיא
  choice: शमूएल नबी के दिनों से
  rationale: מִן कालगत आरंभ-बिंदु बताता है। ‘के दिनों से’ मूल की पूर्वव्यापी तुलना को सुरक्षित रखता है।
- source_word: וְכָל מַלְכֵי יִשְׂרָאֵל לֹא
  choice: इस्राएल के किसी भी राजा ने ... नहीं
  rationale: इब्रानी ‘सब ... नहीं’ का आशय सार्वभौमिक निषेध है। हिन्दी में ‘किसी भी ... ने नहीं’ स्पष्ट और स्वाभाविक है।
- source_word: וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों, लेवियों ... के साथ
  rationale: योशियाह के बाद दी गई सूची उत्सव में सम्मिलित सहभागियों की है। ‘के साथ’ इस संबंध को स्पष्ट करता है, जबकि सूची का समावेशी भाव बनाए रखता है।
- source_word: וְכָל יְהוּדָה
  choice: समस्त यहूदा
  rationale: सामूहिक राष्ट्रीय पदनाम को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְיִשְׂרָאֵל הַנִּמְצָא
  choice: वहाँ उपस्थित इस्राएली
  rationale: הַנִּמְצָא का आशय उस अवसर पर मौजूद लोगों से है। सामूहिक एकवचन ‘इस्राएल’ को हिन्दी में व्यक्तियों के संदर्भ में स्वाभाविक बहुवचन ‘इस्राएली’ से प्रस्तुत किया गया है।
- source_word: וְיוֹשְׁבֵי יְרוּשָׁלִָם
  choice: यरूशलेम के निवासी
  rationale: यह नगर में रहने वालों के लिए प्रयुक्त सहभागी पद का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: पहले के फसहों के साथ ऐतिहासिक तुलना
  choice: पद को योशियाह के फसह की अनुपम समानता या गुणात्मक विशिष्टता बताने वाली तुलना के रूप में अनूदित किया गया है, बिना तुलना के मानदंड को और संकीर्ण किए।
  alternative: इसे एक पूर्ण ऐतिहासिक दावा माना जाए कि शमूएल से योशियाह तक कोई भी तुलनीय फसह हुआ ही नहीं था।
  rationale: इब्रानी पाठ कहता है कि ‘ऐसा’ फसह नहीं मनाया गया और आगे इस्राएल के राजाओं का उल्लेख करता है। अनुवाद इसी तनाव को बनाए रखता है और हिजकिय्याह जैसे अन्य फसहों के साथ कोई व्याख्यात्मक सामंजस्य मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फसह’, ‘नबी’, ‘याजक’ और ‘लेवी’ स्थापित हिन्दी बाइबिलीय शब्दावली के अनुरूप हैं। वाक्य की दो समानांतर नकारात्मक तुलनाएँ और सहभागियों की विस्तृत सूची मूल के निकट रखते हुए स्वाभाविक हिन्दी क्रम में प्रस्तुत की गई हैं।
