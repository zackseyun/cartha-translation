base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/014.yaml
  text: Afterward they prepared for themselves and for the priests[a], because the priests, the sons of Aaron, were occupied in offering up the burnt offering and the fat portions until night. So the Levites prepared for themselves and for the priests, the sons of Aaron.
translation:
  language: hi
  text: इसके बाद उन्होंने अपने लिए और याजकों के लिए तैयारी की[a], क्योंकि हारून के वंश के याजक रात तक होमबलि और चरबी के भाग चढ़ाने में लगे रहे। इसलिए लेवियों ने अपने लिए और हारून के वंश के याजकों के लिए तैयारी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर “अपने लिए” का अनुवाद “उनके लिए” भी हो सकता है। इब्रानी सर्वनाम अपने-आप में आत्मवाचक नहीं है, पर प्रसंग से प्रबल संकेत मिलता है कि लेवियों ने याजकों के साथ-साथ अपने लिए भी तैयारी की।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह पिछले कार्य के बाद होने वाली अगली क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֵכִינוּ
  choice: भोजन तैयार किया
  rationale: क्रिया का मूल अर्थ ‘तैयार किया’ है; फसह-भोज के संदर्भ में कर्म भोजन निहित है, जिसे हिन्दी में स्पष्ट करना स्वाभाविक है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: व्याकरणतः सर्वनाम केवल ‘उनके लिए’ है, पर प्रसंग और पुनरुक्त वाक्य में लेवियों का स्पष्ट उल्लेख इसे आत्मवाचक अर्थ देता है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּהֲנִים בְּנֵי אַהֲרֹן
  choice: हारून के वंशज याजक
  rationale: ‘हारून के पुत्र’ का वंशगत आशय आधुनिक हिन्दी में स्पष्ट करता है और याजकीय पहचान बनाए रखता है।
- source_word: בְּהַעֲלוֹת
  choice: चढ़ाने में लगे रहे
  rationale: बलिदानी संदर्भ में עלה के हिफ़ील का अर्थ वेदी पर अर्पित करना है; यह रूप लगातार चल रहे कार्य को भी व्यक्त करता है।
- source_word: הָעוֹלָה
  choice: होमबलि
  rationale: यह עֹלָה के लिए प्रचलित और सटीक हिन्दी बलिदानी पद है।
- source_word: וְהַחֲלָבִים
  choice: और चरबी के भाग
  rationale: यह सामान्य चरबी नहीं, बल्कि वेदी पर चढ़ाए जाने वाले निर्धारित चरबी के हिस्सों को दर्शाता है।
- source_word: עַד לָיְלָה
  choice: रात तक
  rationale: לָיְלָה का सीधा समय-सूचक अर्थ बनाए रखता है और ‘साँझ तक’ से अधिक सटीक है।
- source_word: וְהַלְוִיִּם
  choice: इसलिए लेवियों ने
  rationale: संयोजक मुख्य कथन को कारणवाचक उपवाक्य के बाद फिर आरम्भ करता है; ‘इसलिए’ प्रसंगगत परिणाम को स्वाभाविक हिन्दी में प्रकट करता है।
