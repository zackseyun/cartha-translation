  yaml_path: translation/ot/2_chronicles/035/023.yaml
  text: And the archers shot King Josiah[a], and the king said to his servants, “Take me away, for I am severely wounded.”
translation:
  language: hi
  text: धनुर्धारियों ने राजा योशिय्याह को तीर मारे, और राजा ने अपने सेवकों से कहा, “मुझे ले चलो, क्योंकि मैं बहुत बुरी तरह घायल हो गया हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया का व्यापक अर्थ दुर्बल, बीमार, या बुरी तरह पीड़ित होना भी हो सकता है; यहाँ युद्ध के संदर्भ में “घायल” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרוּ הַיֹּרִים
  choice: धनुर्धारियों ने…तीर मारे
  rationale: ירה के हिफ़ील रूप और उसी धातु के कृदंत का युद्ध-संदर्भ धनुष से तीर चलाने का संकेत देता है। ‘धनुर्धारी’ और ‘तीर मारे’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट हैं।
- source_word: לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: राजा योशिय्याह को
  rationale: यहाँ ל लक्ष्य को चिह्नित करता है। आगे योशिय्याह के घायल होने से स्पष्ट है कि तीर उन्हें लगे; इसलिए हिन्दी में ‘को तीर मारे’ स्वाभाविक है।
- source_word: הַעֲבִירוּנִי
  choice: मुझे यहाँ से ले चलो
  rationale: עבר का कारक रूप किसी को उस स्थान से हटाने या ले जाने की आज्ञा व्यक्त करता है। ‘यहाँ से ले चलो’ युद्धभूमि से हटाए जाने की बात को बिना यह जोड़े व्यक्त करता है कि उन्हें अनिवार्य रूप से उठाकर ले जाया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शब्द आज्ञा का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ सीधा और स्वाभाविक है।
- source_word: הָחֳלֵיתִי מְאֹד
  choice: मैं बहुत बुरी तरह घायल हो गया हूँ
  rationale: חלה सामान्यतः बीमार, दुर्बल या पीड़ित होने का व्यापक अर्थ रखता है, पर तीर लगने के युद्ध-संदर्भ में गंभीर रूप से घायल होना अभिप्रेत है। מְאֹד की तीव्रता ‘बहुत बुरी तरह’ से व्यक्त हुई है।
