  text: וַ/יֹּ֣אמֶר לַ֠/לְוִיִּם ה/מבונים לְ/כָל יִשְׂרָאֵ֜ל הַ/קְּדוֹשִׁ֣ים לַ/יהוָ֗ה תְּנ֤וּ אֶת אֲרוֹן הַ/קֹּ֨דֶשׁ֙ בַּ֠/בַּיִת אֲשֶׁ֨ר בָּנָ֜ה שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֵין לָ/כֶ֥ם מַשָּׂ֖א בַּ/כָּתֵ֑ף עַתָּ֗ה עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/אֵ֖ת עַמּ֥/וֹ יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/003.yaml
  text: And he said to the Levites who taught all Israel[a], who were holy to Yahweh, “Put the holy ark in the house that Solomon son of David, king of Israel, built. You no longer have to carry it on your shoulders[c][b]. Now serve Yahweh your God and his people Israel.”
translation:
  language: hi
  text: उसने उन लेवियों से, जो सारे इस्राएल को शिक्षा देते थे[a] और यहोवा के लिए पवित्र थे, कहा, “पवित्र सन्दूक को उस भवन में रखो, जिसे इस्राएल के राजा, दाऊद के पुत्र सुलैमान ने बनाया था। तुम्हें उसे अपने कंधों पर उठाने का भार नहीं है[b]। अब अपने परमेश्वर यहोवा और उसकी प्रजा इस्राएल की सेवा करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सारे इस्राएल को समझ प्रदान करते थे,” अथवा “जो सारे इस्राएल के लिए प्रशिक्षित थे।” इब्रानी शब्द समझदार या प्रशिक्षित होने और दूसरों को समझ देने—दोनों अर्थ व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “तुम्हारे लिए कंधे पर कोई भार नहीं है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ה/מבונים
  choice: जो सारे इस्राएल को शिक्षा देते थे
  rationale: בין के हिफ़ील कृदन्त में समझ रखने/प्रशिक्षित होने अथवा समझ देने का अर्थ सम्भव है। इतिहासवृत्त में लेवियों की शिक्षकीय भूमिका के संदर्भ में सक्रिय अर्थ स्वाभाविक है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: הַ/קְּדוֹשִׁים לַ/יהוָה
  choice: यहोवा के लिए पवित्र थे
  rationale: यह पदबंध यहोवा के लिए अलग किए जाने और उससे सम्बद्ध पवित्र स्थिति, दोनों को व्यक्त करता है; शाब्दिक धार्मिक भाषा को अनावश्यक रूप से व्याख्यायित नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम 'यहोवा' शीर्षक से प्रतिस्थापन किए बिना चतुरक्षरीय दिव्य नाम को दर्शाता है।
- source_word: תְּנוּ אֶת אֲרוֹן הַקֹּדֶשׁ בַּבַּיִת
  choice: पवित्र सन्दूक को उस भवन में रखो
  rationale: נתן का प्रसंगानुकूल अर्थ 'रखना' है। בית को 'भवन' कहा गया है और अगले सम्बन्धवाचक उपवाक्य से स्पष्ट होता है कि संकेत सुलैमान के बनाए मन्दिर की ओर है।
- source_word: אֵין לָכֶם מַשָּׂא בַּכָּתֵף
  choice: अब तुम्हें उसे अपने कंधों पर नहीं उठाना है
  rationale: शाब्दिक वाक्य 'तुम्हारे लिए कंधे पर कोई भार नहीं' है। हिन्दी रूप वास्तविक आशय—सन्दूक को कंधे पर ढोना अब उनका कार्य नहीं—को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַתָּה עִבְדוּ
  choice: अब ... सेवा करो
  rationale: עבד यहाँ उपासना और धार्मिक दायित्व सहित व्यापक सेवा को दर्शाता है; 'सेवा करो' परमेश्वर और उसकी प्रजा, दोनों कर्मों के साथ सहज बैठता है।
- source_word: וְאֵת עַמּוֹ יִשְׂרָאֵל
  choice: और उसकी प्रजा इस्राएल
  rationale: यह रूप इस्राएल को यहोवा की प्रजा के रूप में पहचानता है और वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ה/מבונים में लेवियों की भूमिका
  choice: जो सारे इस्राएल को शिक्षा देते थे
  alternative: जो सारे इस्राएल को समझ देते थे; जो सारे इस्राएल के लिए प्रशिक्षित/समझदार थे
  rationale: व्याकरण सक्रिय रूप से समझ देने और अवस्था के रूप में समझदार या प्रशिक्षित होने, दोनों की अनुमति देता है। प्रसंग सक्रिय शिक्षकीय अर्थ का समर्थन करता है, पर विकल्प पादटिप्पणी में सुरक्षित है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। आधुनिक हिन्दी बाइबलीय पाठकों के लिए परिचित 'यहोवा' नाम को शीर्षक 'प्रभु' से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: लेवियों द्वारा यहोवा और इस्राएल दोनों की सेवा
  choice: अपने परमेश्वर यहोवा और उसकी प्रजा इस्राएल की सेवा करो
  alternative: अपने परमेश्वर यहोवा की उपासना और उसकी प्रजा इस्राएल की सेवा करो
  rationale: मूल में एक ही क्रिया עבד दोनों कर्मों पर लागू होती है। मुख्य पाठ में उसी तनाव और व्यापकता को बनाए रखा गया है, न कि दो अलग क्रियाएँ लगाकर अर्थ को पहले से निर्धारित किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज स्तर रखा गया है। 'पवित्र सन्दूक', 'भवन', 'प्रजा' और 'सेवा' जैसे परिचित बाइबलीय शब्द मूल की धार्मिक भाषा बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
