reference: 2 Chronicles 35:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יֹאשִׁיָּ֧הוּ בִֽ/ירוּשָׁלִַ֛ם פֶּ֖סַח לַ/יהוָ֑ה וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֥דֶשׁ הָ/רִאשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/001.yaml
  text: Josiah kept the Passover to Yahweh in Jerusalem[a], and they slaughtered the Passover on the fourteenth day of the first month.
translation:
  language: hi
  text: योशिय्याह ने यरूशलेम में याहवे के लिए फसह मनाया, और उन्होंने पहले महीने के चौदहवें दिन फसह के बलि-पशु[a] का वध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “फसह” है; यहाँ यह उस फसह-बलि के पशु को दर्शाता है जिसका वध किया गया।
    reason: मूल के लाक्षणिक प्रयोग और हिन्दी में किए गए अर्थ-स्पष्टीकरण को बताना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: मनाया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर פֶּסַח के साथ यह फसह का अनुष्ठान करने या उसे मनाने का मुहावरा है। आधुनिक हिन्दी में ‘मनाया’ स्वाभाविक और स्पष्ट है।
- source_word: פֶּסַח
  choice: फसह
  rationale: पहली बार यह पर्व और उसके अनुष्ठान को समग्र रूप से दर्शाता है; ‘फसह’ इसका प्रचलित हिन्दी रूप है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या उद्देश्य का भाव देता है। ‘के लिए’ इस संबंध को सहज हिन्दी में व्यक्त करता है, और יהוה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: בִירוּשָׁלַםִ
  choice: यरूशलेम में
  rationale: यह स्थानसूचक प्रयोग है; ‘यरूशलेम’ आधुनिक हिन्दी में प्रचलित नाम है।
- source_word: וַיִּשְׁחֲטוּ
  choice: उन्होंने … का वध किया
  rationale: שחט पशु को विधिपूर्वक काटने/वध करने को दर्शाता है। ‘वध किया’ सामान्य ‘मार डाला’ से अधिक सटीक है और ‘बलि चढ़ाई’ की अपेक्षा क्रिया को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: הַפֶּסַח
  choice: फसह के बलि-पशु
  rationale: दूसरी बार פֶּסַח उस पशु के लिए लाक्षणिक रूप से प्रयुक्त है जिसका वध किया गया। ‘बलि-पशु’ हिन्दी में अर्थ स्पष्ट करता है, पर उसे विशेष रूप से ‘मेमना’ नहीं बनाता, क्योंकि इस पद में पशु की जाति नहीं कही गई।
- source_word: בְּאַרְבָּעָה עָשָׂר
  choice: चौदहवें दिन
  rationale: इब्रानी में शाब्दिक रूप से ‘चौदह को’ है; हिन्दी तिथि-प्रयोग में ‘चौदहवें दिन’ स्वाभाविक समतुल्य है।
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के
  rationale: यह बताता है कि चौदहवाँ दिन किस महीने का था; हिन्दी में संबंधकारक रचना सर्वाधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: दूसरे פֶּסַח का आशय
  choice: फसह के बलि-पशु
  alternative: फसह; फसह का मेमना
  rationale: वध की क्रिया से यहाँ पर्व नहीं, उसका बलि-पशु अभिप्रेत है। केवल ‘फसह’ हिन्दी में अस्पष्ट होगा, जबकि ‘मेमना’ इस पद की तुलना में अधिक विशिष्ट है; इसलिए सामान्य ‘बलि-पशु’ चुना गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। वाक्य की इब्रानी क्रमबद्धता और बहुवचन कर्ता ‘उन्होंने’ सुरक्षित रखे गए हैं; संदर्भ से बाहर उसके व्यक्तियों की पहचान नहीं जोड़ी गई।
