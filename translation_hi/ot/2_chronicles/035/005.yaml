source:
  edition: WLC
  text: וְ/עִמְד֣וּ בַ/קֹּ֗דֶשׁ לִ/פְלֻגּוֹת֙ בֵּ֣ית הָֽ/אָב֔וֹת לַ/אֲחֵי/כֶ֖ם בְּנֵ֣י הָ/עָ֑ם וַ/חֲלֻקַּ֥ת בֵּֽית אָ֖ב לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/035/005.yaml
  text: And stand in the holy place according to the divisions of the fathers’ houses of your brothers[a], the sons of the people, and according to the division of a father’s house for the Levites.
translation:
  language: hi
  text: और पवित्र स्थान में अपने भाइयों, अर्थात् इस्राएली प्रजा[a], के पितृकुलों के विभागों के अनुसार, और लेवियों के लिए एक पितृकुल के विभाग के अनुसार स्थित हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रजा के पुत्र।” यहाँ इसका आशय लेवियों से अलग इस्राएली प्रजा से है।
    reason: मूल की शाब्दिक अभिव्यक्ति और उसका प्रसंगगत सामाजिक अर्थ बताना।
lexical_decisions:
- source_word: וְעִמְדוּ
  choice: और ... खड़े हो जाओ
  rationale: यह עמד का बहुवचन आज्ञार्थक रूप है। ‘खड़े हो जाओ’ आधुनिक हिन्दी में सीधी आज्ञा व्यक्त करता है और ‘और’ पूर्ववर्ती निर्देश से संबंध बनाए रखता है।
- source_word: בַקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: सपद उपसर्ग और निश्चित पद यहाँ किसी पवित्र क्षेत्र अथवा मंदिर-परिसर की ओर संकेत करते हैं। ‘पवित्रस्थान’ ठोस उपासना-संबंधी अर्थ रखता है, पर किसी विशेष कक्ष को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לִפְלֻגּוֹת / וַחֲלֻקַּת
  choice: दलों के अनुसार / दल के अनुसार
  rationale: दोनों संज्ञाएँ व्यवस्थित विभागों या समूहों को दर्शाती हैं। हिन्दी में ‘दल’ सहज है और ‘के अनुसार’ व्यवस्था के अनुरूप खड़े होने का भाव स्पष्ट करता है; दूसरे खंड की समानांतर रचना भी सुरक्षित रहती है।
- source_word: בֵּית הָאָבוֹת / בֵּית אָב
  choice: पितृकुलों / प्रत्येक पितृकुल
  rationale: यह वंशावली और सामाजिक संगठन का पारिभाषिक पद है। ‘पितृकुल’ आधुनिक हिन्दी में पैतृक घराने या कुल-इकाई का संक्षिप्त और स्पष्ट रूप है। दूसरे एकवचन को वितरणात्मक अर्थ में ‘प्रत्येक पितृकुल’ किया गया है।
- source_word: לַאֲחֵיכֶם
  choice: अपने भाइयों
  rationale: यह लेवियों के सह-इस्राएलियों के लिए पारिवारिक-सामुदायिक संबोधन है। ‘भाइयों’ स्रोत की लिंगयुक्त कुल-संरचना और वाचा-संबंधी निकटता को बनाए रखता है।
- source_word: בְּנֵי הָעָם
  choice: अर्थात् इस्राएली प्रजा
  rationale: शाब्दिक अर्थ ‘प्रजा के पुत्र’ है, किंतु प्रसंग में यह लेवियों से अलग गैर-लेवी इस्राएलियों को पहचानता है। ‘इस्राएली प्रजा’ हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לַלְוִיִּם
  choice: लेवियों के
  rationale: यह लेवी पितृकुलों से संबंधित समानांतर दल को सूचित करता है। हिन्दी में ‘लेवियों के प्रत्येक पितृकुल के दल’ संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: लिंगयुक्त संबंध-सूचक और सामाजिक पदावली
  choice: मुख्य पाठ में ‘भाइयों’ रखा और ‘בְּנֵי הָעָם’ का प्रसंगगत अर्थ ‘इस्राएली प्रजा’ दिया
  alternative: ‘तुम्हारे साथी इस्राएलियों, अर्थात् प्रजा के पुत्रों’ अथवा केवल ‘लोगों’
  rationale: ‘भाइयों’ मूल के पारिवारिक संबोधन को सुरक्षित रखता है। वहीं ‘प्रजा के पुत्र’ का शब्दशः हिन्दी रूप अस्पष्ट और अस्वाभाविक होता; इसलिए उसके गैर-लेवी इस्राएलियों वाले प्रसंगगत अर्थ को मुख्य पाठ में स्पष्ट किया गया और वास्तविक शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया।
- issue: अंतिम एकवचन पितृकुल-इकाई का अर्थ
  choice: ‘लेवियों के प्रत्येक पितृकुल के दल के अनुसार’
  alternative: ‘लेवियों के एक पितृकुल के दल के अनुसार’
  rationale: एकवचन בֵּית אָב यहाँ वितरणात्मक अथवा प्रतिनिधिक इकाई जान पड़ता है। ‘प्रत्येक’ संगठनात्मक निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशेष लेवी कुल को चुनने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पितृकुल’ और ‘पवित्रस्थान’ जैसे बाइबलीय-सामाजिक पद सटीकता के लिए रखे गए हैं; वाक्य की समानांतर संगठनात्मक संरचना को स्वाभाविक हिन्दी क्रम में प्रस्तुत किया गया है।
