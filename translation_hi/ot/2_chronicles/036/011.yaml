  language: hi
  text: सिदकिय्याह इक्कीस वर्ष का था जब वह राजा बना, और उसने यरूशलेम में ग्यारह वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: इक्कीस वर्ष का था
  rationale: इब्रानी आयु-सूत्र का स्वाभाविक और स्पष्ट हिन्दी रूप; यहाँ בֶּן का अर्थ शाब्दिक ‘पुत्र’ नहीं, बल्कि आयु बताना है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रचना उसके राजत्व आरम्भ होने का समय बताती है; आधुनिक हिन्दी में यह सहज रूप है।
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה
  choice: ग्यारह वर्ष तक
  rationale: यह उसके शासनकाल की अवधि बताता है; ‘तक’ हिन्दी में अवधि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: राजा के रूप में शासन करने के अर्थ का संक्षिप्त और प्रचलित हिन्दी समतुल्य।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग सहित नगर के नाम का प्रचलित हिन्दी रूप।
