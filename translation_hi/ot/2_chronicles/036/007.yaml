  text: וּ/מִ/כְּלֵי֙ בֵּ֣ית יְהוָ֔ה הֵבִ֥יא נְבוּכַדְנֶאצַּ֖ר לְ/בָבֶ֑ל וַ/יִּתְּנֵ֥/ם בְּ/הֵיכָל֖/וֹ בְּ/בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/007.yaml
  text: Nebuchadnezzar also brought some of the vessels of the house of Yahweh to Babylon[a], and put them in his temple in Babylon.
translation:
  language: hi
  text: नबूकदनेस्सर यहोवा के भवन के कुछ पात्र भी बाबेल ले गया और उन्हें बाबेल में अपने मंदिर[a] में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजमहल’; इब्रानी शब्द प्रसंग के अनुसार मंदिर या राजमहल, दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/כְּלֵי
  choice: कुछ पात्र भी
  rationale: מִן का अंशवाचक अर्थ ‘पात्रों में से कुछ’ है और וּ जोड़ का भाव देता है; हिन्दी में ‘कुछ पात्र भी’ स्वाभाविक और स्पष्ट है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: यह मूल के शाब्दिक रूप ‘यहोवा का घर/भवन’ को बनाए रखता है; धार्मिक संदर्भ में ‘भवन’ गरिमापूर्ण और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: הֵבִיא
  choice: ले गया
  rationale: हिफ़ील क्रिया गंतव्य बाबेल की ओर वस्तुएँ पहुँचाने को व्यक्त करती है; हिन्दी कथन में कर्ता की वर्तमान दिशा के अनुसार ‘ले गया’ अधिक स्वाभाविक है।
- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: לְ/בָבֶל
  choice: बाबेल
  rationale: दिशासूचक לְ को ‘बाबेल ले गया’ की हिन्दी रचना में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וַ/יִּתְּנֵם
  choice: और उन्हें ... रख दिया
  rationale: נתן यहाँ वस्तुओं को किसी स्थान पर रखने या जमा करने के अर्थ में है; ‘रख दिया’ सहज आधुनिक हिन्दी है।
- source_word: בְּ/הֵיכָל/וֹ
  choice: अपने मन्दिर में
  rationale: הֵיכָל मन्दिर या राजमहल दोनों को सूचित कर सकता है। पवित्र पात्रों के संदर्भ में ‘मन्दिर’ सम्भावित अर्थ है; प्रत्यय का संबंध नबूकदनेस्सर से स्पष्ट करने के लिए ‘अपने’ चुना गया है।
- source_word: בְּ/בָבֶל
  choice: बाबेल में
  rationale: स्थानवाचक בְּ को सीधे ‘बाबेल में’ प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत नाम है; हिन्दी के सामान्य पाठकों के लिए परिचित रूप ‘यहोवा’ नाम को नाम के रूप में ही सुरक्षित रखता है, उपाधि से प्रतिस्थापित नहीं करता।
- issue: नबूकदनेस्सर के הֵיכָל का अर्थ
  choice: मन्दिर
  alternative: राजमहल
  rationale: शब्द दोनों अर्थ दे सकता है। यहोवा के भवन से लिए गए पवित्र पात्रों का प्रसंग ‘मन्दिर’ का समर्थन करता है, पर वास्तविक शब्दगत अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य मूल की क्रमबद्ध कथा को बनाए रखता है; ‘कुछ’ अंशवाचक अर्थ को और पाद-टिप्पणी הֵיכָל की वास्तविक अस्पष्टता को स्पष्ट करती है।
