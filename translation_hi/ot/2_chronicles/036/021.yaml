base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/021.yaml
  text: to fulfill the word of Yahweh by the mouth of Yirmeyahu[a], until the land had enjoyed its Sabbaths. All the days of its desolation it kept Sabbath[d][c][b], to fulfill seventy years.
translation:
  language: hi
  text: याहवे के उस वचन को पूरा करने के लिए, जो यिर्मयाहू के मुँह से निकला था[a]—जब तक देश ने अपने सब्तों का सुख न भोग लिया। अपने उजाड़ पड़े रहने के पूरे समय उसने सब्त मनाया[d][c][b], ताकि सत्तर वर्ष पूरे हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यिर्मयाहू के द्वारा।” शाब्दिक रूप से, “यिर्मयाहू के मुँह से।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने सब्तों को स्वीकार कर लिया” अथवा “अपने सब्तों की भरपाई कर ली”; भाव यह है कि देश को वह सब्ती विश्राम मिला जिससे उसे वंचित रखा गया था।
    reason: lexical_alternative
  - marker: c
    text: यह भाषा उस वाचा-संबंधी चेतावनी की प्रतिध्वनि है जिसमें निर्वासन के समय देश के अपने सब्तों का सुख भोगने की बात कही गई है (देखें लैव्यव्यवस्था 26:34–35)।
    reason: cross_reference
  - marker: d
    text: या “उसने विश्राम किया।” इब्रानी में ‘अपने सब्तों ... उसने सब्त मनाया’ में एक ही सब्त-संबंधी शब्द-मूल की पुनरावृत्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַלֹּאות
  choice: ताकि ... पूरा हो
  rationale: लामेद सहित infinitive construct यहाँ उद्देश्य अथवा परिणाम व्यक्त करता है। ‘पूरा हो’ भविष्यवाणी के वास्तविक होने और आरंभ तथा अंत में आए מלא की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वह वचन
  rationale: דבר को भविष्यवाणी की पूर्ति के संदर्भ में ‘वचन’ कहना उसके संदेश और अंतरपाठीय संबंध दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּפִי יִרְמְיָהוּ
  choice: यिर्मयाहू के मुँह से कहा गया था
  rationale: ‘मुँह से’ मूल भविष्यद्वक्ताई वाणी की छवि बचाता है; ‘कहा गया था’ हिन्दी में वाक्य को स्पष्ट और स्वाभाविक बनाता है। नाम का रूप इब्रानी उच्चारण के निकट रखा गया है।
- source_word: עַד רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ
  choice: जब तक देश ने अपने सब्तों का सुख न भोग लिया
  rationale: עַד की समय-सीमा और רצה का यहाँ सब्ती विश्राम प्राप्त करने अथवा उसका आनंद लेने का भाव रखा गया है। ‘देश’ से यहूदा की भूमि अभिप्रेत है।
- source_word: כָּל יְמֵי הָשַּׁמָּה
  choice: जितने दिन वह उजाड़ पड़ा रहा, उतने दिन
  rationale: यह रूप उजाड़ की पूरी अवधि को सहज हिन्दी में व्यक्त करता है और देश को कर्ता बनाए रखता है।
- source_word: שָׁבָתָה
  choice: उसने सब्त मनाया
  rationale: सिर्फ ‘विश्राम किया’ कहने के बजाय ‘सब्त मनाया’ preceding שַׁבְּתוֹתֶיהָ के साथ जानबूझकर किया गया शब्द-संबंध सुरक्षित रखता है।
- source_word: לְמַלֹּאות שִׁבְעִים שָׁנָה
  choice: ताकि सत्तर वर्ष पूरे हों
  rationale: यह מלא की आरंभिक पुनरावृत्ति को ‘पूरा’ द्वारा बनाए रखता है और हिन्दी में समयावधि की पूर्णता स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: שַׁבְּתוֹתֶיהָ और שָׁבָתָה में सब्त-संबंधी शब्दक्रीड़ा
  choice: अपने सब्तों ... उसने सब्त मनाया
  alternative: अपने विश्रामों ... उसने विश्राम किया
  rationale: निर्वासन के दौरान भूमि को मिले सब्ती विश्राम की वाचागत धारणा मूल में स्पष्ट है; समान शब्दावली लैव्यव्यवस्था 26 की प्रतिध्वनि को दृश्यमान रखती है।
- issue: רָצְתָה का अर्थ
  choice: सुख भोग लिया
  alternative: स्वीकार कर लिया; भरपाई कर ली
  rationale: क्रिया यहाँ भूमि द्वारा वंचित सब्ती विश्राम प्राप्त करने का अर्थ देती है। पाठ में स्वाभाविक मुख्य अर्थ चुना गया है, जबकि संभावित वैकल्पिक बारीकियाँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’ बाइबलीय पारिभाषिक शब्द के रूप में रखा गया है। वाक्य का आरंभ ‘ताकि’ से मूल के उद्देश्य/परिणाम-सूचक संबंध और पिछले पद से इसकी निरंतरता दिखाता है; डैश आगे की समय-सीमा को मुख्य पूर्ति-वाक्य से जोड़ता है।
