base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/009.yaml
  text: Jehoiachin was eight years old when he began to reign[a], and he reigned three months and ten days in Jerusalem. He did what was evil in the sight of Yahweh.
translation:
  language: hi
  text: यहोयाकीन आठ वर्ष का था जब वह राजा बना[a], और उसने यरूशलेम में तीन महीने और दस दिन राज्य किया। उसने वह किया जो यहोवा की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 राजा 24:8 में ‘आठ वर्ष’ के स्थान पर ‘अठारह वर्ष’ लिखा है।
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שְׁמוֹנֶה שָׁנִים
  choice: आठ वर्ष का था
  rationale: इब्रानी आयु-सूचक मुहावरे ‘आठ वर्षों का पुत्र’ का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: יְהוֹיָכִין
  choice: यहोयाकीन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रचना उसके राज्यारोहण के समय को बताती है; यह हिन्दी में सहज है और ‘राज्य करने लगा’ के समान अर्थ रखती है।
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים וַעֲשֶׂרֶת יָמִים
  choice: तीन महीने और दस दिन
  rationale: राज्यकाल की अवधि का सीधा और स्वाभाविक अनुवाद।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: राजकीय सूचना में מלך का मानक हिन्दी प्रतिरूप।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: स्थानवाचक पदबंध का सीधा अनुवाद।
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वही किया जो ... बुरा था
  rationale: इब्रानी मूल्यांकन-सूत्र का अर्थ और निश्चितता बनाए रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: ‘आँखों में’ रूपक को प्रचलित हिन्दी मुहावरे ‘दृष्टि में’ द्वारा सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: 2 राजा 24:8 से आयु-संबंधी कालक्रमिक/पाठगत तनाव
  choice: मुख्य पाठ में मासोरेटिक पाठ के अनुसार ‘आठ वर्ष’ रखा गया
  alternative: ‘अठारह वर्ष’, जैसा 2 राजा 24:8 में है
  rationale: दिए गए मूल इब्रानी पाठ में ‘आठ वर्ष’ है। समानांतर वृत्तांत से सामंजस्य बैठाने के लिए इसे चुपचाप बदलना उचित नहीं; महत्त्वपूर्ण भिन्नता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। राजकीय सूत्र के लिए ‘राजा बना’ और ‘राज्य किया’ जैसे परिचित पद चुने गए हैं; पाठगत तनाव को स्पष्ट पादटिप्पणी में सुरक्षित रखा गया है।
