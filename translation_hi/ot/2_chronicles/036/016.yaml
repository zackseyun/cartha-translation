  text: וַ/יִּֽהְי֤וּ מַלְעִבִים֙ בְּ/מַלְאֲכֵ֣י הָ/אֱלֹהִ֔ים וּ/בוֹזִ֣ים דְּבָרָ֔י/ו וּ/מִֽתַּעְתְּעִ֖ים בִּ/נְבִאָ֑י/ו עַ֠ד עֲל֧וֹת חֲמַת יְהוָ֛ה בְּ/עַמּ֖/וֹ עַד לְ/אֵ֥ין מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/016.yaml
  text: But they kept mocking the messengers of God[a], despising his words, and scoffing at his prophets, until the wrath of Yahweh rose against his people[b], until there was no remedy.
translation:
  language: hi
  text: पर वे परमेश्वर के दूतों[a] का लगातार उपहास करते, उसके वचनों को तुच्छ जानते और उसके भविष्यद्वक्ताओं की खिल्ली उड़ाते रहे, जब तक कि याहवे का क्रोध उसकी प्रजा पर भड़क न उठा, जब तक कि कोई उपाय न रहा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के स्वर्गदूतों”; यहाँ अगला वाक्यांश “उसके भविष्यद्वक्ताओं” की बात करता है, इसलिए प्रसंग में परमेश्वर के मानवीय दूत अधिक संभावित हैं।
    reason: lexical_alternative
  - marker: b
    text: या “जब तक कोई चंगाई न रही” अथवा “जब तक स्थिति लाइलाज न हो गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: लगातार ... करते रहे
  rationale: इसके बाद आए कृदंतों के साथ यह रचना अतीत में जारी या बार-बार किए गए व्यवहार को व्यक्त करती है।
- source_word: מַלְעִבִים
  choice: उपहास करते
  rationale: यह तिरस्कारपूर्ण मज़ाक का भाव देता है; ‘उपहास’ आधुनिक, गरिमापूर्ण और स्पष्ट है।
- source_word: בְּמַלְאֲכֵי הָאֱלֹהִים
  choice: परमेश्वर के दूतों
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है, पर समानांतर ‘उसके भविष्यद्वक्ताओं’ से यहाँ मानवीय संदेशवाहक अभिप्रेत हैं।
- source_word: וּבוֹזִים דְּבָרָיו
  choice: उसके वचनों को तुच्छ जानते
  rationale: בזה तिरस्कारपूर्वक अस्वीकार करने का भाव रखता है और דְּבָרָיו बहुवचन में ‘उसके वचन’ है।
- source_word: וּמִתַּעְתְּעִים בִּנְבִאָיו
  choice: उसके भविष्यद्वक्ताओं की खिल्ली उड़ाते
  rationale: यह उपहासपूर्ण व्यवहार व्यक्त करता है; ‘खिल्ली उड़ाना’ पहले पद के ‘उपहास’ से संबंधित होते हुए भी शैलीगत भिन्नता बनाए रखता है।
- source_word: חֲמַת יְהוָה
  choice: यहोवा का क्रोध
  rationale: חֵמָה प्रचंड या दहकते क्रोध को दर्शाता है; ‘क्रोध’ स्वाभाविक हिन्दी में न्याय की गंभीरता रखता है, और יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּעַמּוֹ
  choice: उसकी प्रजा पर
  rationale: क्रोध के संदर्भ में ב उस लक्ष्य को दर्शाता है जिस पर न्याय आता है।
- source_word: עַד לְאֵין מַרְפֵּא
  choice: कि कोई उपाय न रहा
  rationale: מַרְפֵּא का अर्थ ‘चंगाई’ या ‘उपाय’ हो सकता है; न्याय के इस संदर्भ में ‘कोई उपाय न रहा’ अंतिमता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के दूतों’ का संदर्भ
  choice: परमेश्वर के मानवीय संदेशवाहक
  alternative: परमेश्वर के स्वर्गदूत
  rationale: निकटवर्ती समानांतर पद ‘उसके भविष्यद्वक्ताओं’ की ओर संकेत करता है, इसलिए यहाँ ऐतिहासिक संदर्भ में भेजे गए मानवीय प्रवक्ता अभिप्रेत हैं; फिर भी शब्द की मूल वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: עַד ... עַד की संरचना
  choice: ‘जब तक ... ऐसा ... कि’ के रूप में एक परिणामी वाक्य
  alternative: दो बार पृथक ‘जब तक’
  rationale: इब्रानी की दोहरी सीमा/परिणति को स्वाभाविक हिन्दी में कारण-परिणाम की चरम स्थिति के रूप में व्यक्त किया गया है, बिना न्याय की अंतिमता घटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। तीनों जारी अपराधों को समानांतर क्रियापदों से व्यक्त किया गया है। ‘प्रजा’ राजकीय-वाचा संबंधी सामूहिक अर्थ रखता है; ‘वचन’ परमेश्वर द्वारा भेजे गए अनेक संदेशों का बहुवचन सुरक्षित रखता है।
