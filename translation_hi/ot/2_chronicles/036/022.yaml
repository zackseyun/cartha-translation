base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/022.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh by the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he made a proclamation throughout all his kingdom, and also in writing, saying:'
translation:
  language: hi
  text: 'फ़ारस के राजा कुस्रू के पहले वर्ष में, यिर्मयाह के मुँह से कहे गए[a] यहोवा के वचन को पूरा करने के लिए, यहोवा ने फ़ारस के राजा कुस्रू के मन को उभारा। उसने अपने सारे राज्य में घोषणा करवाई और उसे लिखित रूप में भी जारी किया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यिर्मयाह के द्वारा”; मूल इब्रानी में शाब्दिक रूप से “यिर्मयाह के मुँह से।”
    reason: मूल मुहावरे का शाब्दिक रूप और उसका स्वाभाविक वैकल्पिक अनुवाद बताना।
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת
  choice: पहले वर्ष में
  rationale: यह कालसूचक राजकीय तिथि-वाक्यांश है। आरंभिक वाव को अलग शब्द से व्यक्त करना हिन्दी में आवश्यक नहीं; प्रसंग क्रमसूचक संबंध बनाए रखता है।
- source_word: לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: फ़ारस के राजा कुस्रू के
  rationale: राजकीय उपाधि सहित नाम को स्वाभाविक हिन्दी संबंध-विन्यास में रखा गया है।
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: यहोवा के वचन को पूरा करने के लिए
  rationale: नबूवत के संदर्भ में infinitive दैवी वचन के पूर्ण होने का प्रयोजन/परिणाम बताता है; 'पूरा करना' सहज हिन्दी है।
- source_word: בְּפִי יִרְמְיָהוּ
  choice: यिर्मयाह के मुँह से कहे गए
  rationale: मूल के 'मुँह से' बिंब को सुरक्षित रखते हुए 'कहे गए' जोड़ने से हिन्दी में वचन के साथ संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: यहोवा ने ... कुस्रू के मन को उभारा
  rationale: רוּחַ यहाँ शासक की भीतरी प्रवृत्ति या प्रेरणा को सूचित करता है। 'मन' सामान्य हिन्दी में यह अर्थ देता है, जबकि 'उभारा' הֵעִיר की प्रेरित/सक्रिय करने की शक्ति बनाए रखता है।
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: तब उसने अपने पूरे राज्य में यह घोषणा करवाई
  rationale: शाब्दिक 'आवाज़ चलवाई' एक मुहावरा है जिसका आशय सार्वजनिक घोषणा प्रसारित करवाना है। causative रूप को 'करवाई' सुरक्षित रखता है।
- source_word: וְגַם בְּמִכְתָּב
  choice: और इसे लिखित रूप में भी जारी किया
  rationale: मौखिक घोषणा के साथ लिखित दस्तावेज़ का माध्यम भी बताया गया है; 'जारी किया' आधुनिक प्रशासनिक हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह अगले पद में आने वाले सीधे कथन की भूमिका है; हिन्दी में कोलन वही कार्य संक्षेप में करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि 'प्रभु' से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों में परिचित रूप 'यहोवा' अपनाया गया है।
- issue: רוּחַ כֹּרֶשׁ का अर्थ
  choice: कुस्रू का मन
  alternative: कुस्रू की आत्मा
  rationale: संदर्भ में यह कुस्रू की आंतरिक प्रवृत्ति और प्रेरणा है। 'मन' अनावश्यक रूप से किसी व्यवस्थित आत्मा-विज्ञान का संकेत दिए बिना अर्थ स्पष्ट करता है; 'आत्मा' मूल रूप के अधिक निकट वैकल्पिक पाठ है।
- issue: दैवी वचन की पूर्ति में कुस्रू की भूमिका
  choice: पूरा करने के लिए ... मन को उभारा
  alternative: पूरा हो जाए, इसलिए ... आत्मा को जगाया
  rationale: मूल प्रयोजन और परिणाम दोनों की छाया दे सकता है। हिन्दी पाठ प्रयोजन व्यक्त करता है, पर यह नहीं बताता कि कुस्रू सचेत रूप से नबूवत पूरी करना चाहता था; पहल यहोवा की रहती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। फ़ारस, कुस्रू और यिर्मयाह के प्रचलित हिन्दी बाइबलीय नाम-रूप रखे गए हैं। पद अगले पद की राजाज्ञा का परिचय है, इसलिए अंत में कोलन रखा गया है।
