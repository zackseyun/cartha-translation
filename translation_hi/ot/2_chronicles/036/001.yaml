  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य में ‘चुना’ जोड़कर לקח का प्रसंगगत भाव स्पष्ट किया गया है, जबकि बलपूर्वक पकड़ने का अर्थ नहीं थोपा गया। पादटिप्पणी-चिह्न मुख्य पाठ में रखा गया है।
