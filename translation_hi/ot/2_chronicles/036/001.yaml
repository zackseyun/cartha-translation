base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/001.yaml
  text: Then the people of the land took Jehoahaz son of Josiah and made him king in Jerusalem in place of his father[a].
translation:
  language: hi
  text: तब देश के लोग[a] योशियाह के पुत्र यहोआहाज़ को ले आए और उसे उसके पिता के स्थान पर यरूशलेम में राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश की सामान्य जनता।” इब्रानी अभिव्यक्ति “देश के लोग” पूरे देश की जनता को और कुछ प्रसंगों में उसके भीतर के किसी विशेष सामाजिक समूह को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: चुना
  rationale: यहाँ לקח किसी व्यक्ति को राजपद के लिए लेने या चुनने का भाव देता है। केवल ‘पकड़ लिया’ अनावश्यक रूप से बलप्रयोग का संकेत दे सकता है; ‘चुना’ प्रसंगगत आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोगों
  rationale: यह अनुवाद इब्रानी अभिव्यक्ति को निकटता से बनाए रखता है और इसे किसी निश्चित सामाजिक वर्ग तक सीमित नहीं करता। इसकी संभावित सामाजिक-सामूहिक अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज़
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן יֹאשִׁיָּהוּ
  choice: योशियाह के पुत्र
  rationale: वंश-संबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּמְלִיכֻהוּ
  choice: उसे राजा बनाया
  rationale: מלך के हिफ़ील रूप का कारणवाचक अर्थ है—किसी को राजा बनाना। यह रूप किसी अनुल्लिखित राज्याभिषेक-विधि को नहीं जोड़ता।
- source_word: תַחַת אָבִיו
  choice: उसके पिता के स्थान पर
  rationale: यहाँ תחת स्थानिक अधीनता नहीं, बल्कि उत्तराधिकार या प्रतिस्थापन व्यक्त करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानसूचक ב का स्वाभाविक हिन्दी अनुवाद।
