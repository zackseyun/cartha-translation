id: 2CH.36.19
reference: 2 Chronicles 36:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יִּשְׂרְפוּ֙ אֶת בֵּ֣ית הָ/אֱלֹהִ֔ים וַֽ/יְנַתְּצ֔וּ אֵ֖ת חוֹמַ֣ת יְרוּשָׁלִָ֑ם וְ/כָל אַרְמְנוֹתֶ֨י/הָ֙ שָׂרְפ֣וּ בָ/אֵ֔שׁ וְ/כָל כְּלֵ֥י מַחֲמַדֶּ֖י/הָ לְ/הַשְׁחִֽית־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/019.yaml
  text: They burned the house of God[a], tore down the wall of Jerusalem, burned all its palaces with fire[b], and destroyed all its precious vessels.
translation:
  language: hi
  text: उन्होंने परमेश्वर के भवन[a] को जला दिया, यरूशलेम की शहरपनाह ढा दी, उसके सभी राजमहलों को आग में जला दिया, और उसकी सभी बहुमूल्य वस्तुओं[b] को नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का मन्दिर।” इब्रानी में शाब्दिक रूप से “परमेश्वर का घर” है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सभी मनभावने सामान” अथवा “उसके सभी बहुमूल्य पात्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרְפוּ
  choice: उन्होंने ... जला दिया
  rationale: שׂרף का सामान्य अर्थ ‘जलाना’ है। तृतीय पुरुष बहुवचन कर्ता को हिन्दी में ‘उन्होंने’ से व्यक्त किया गया है और कथात्मक क्रम के लिए पूर्ण भूतकाल रखा गया है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: इब्रानी का शाब्दिक रूप ‘परमेश्वर का घर/भवन’ है। ‘भवन’ गरिमापूर्ण और स्वाभाविक हिन्दी है तथा मन्दिर के अर्थ को अनावश्यक रूप से पाठ में स्पष्ट नहीं करता।
- source_word: וַיְנַתְּצוּ
  choice: ढा दी
  rationale: נתץ किसी निर्माण को गिराने या ढा देने के अर्थ में है। शहरपनाह के साथ ‘ढा दी’ सहज और सटीक है।
- source_word: חוֹמַת יְרוּשָׁלִָם
  choice: यरूशलेम की शहरपनाह
  rationale: חוֹמָה नगर को घेरे हुए रक्षात्मक दीवार है; ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा इस अर्थ को अधिक स्पष्टता से व्यक्त करती है। एकवचन इब्रानी के अनुरूप रखा गया है।
- source_word: אַרְמְנוֹתֶיהָ
  choice: उसके सभी राजमहल
  rationale: אַרְמוֹן महल अथवा भव्य दुर्गनुमा भवन को सूचित कर सकता है। इस नगरीय विनाश के प्रसंग में ‘राजमहल’ सम्भावित अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। स्त्रीलिंग प्रत्यय का संबंध यरूशलेम से है।
- source_word: שָׂרְפוּ בָאֵשׁ
  choice: आग में जला दिया
  rationale: इब्रानी में आग का स्पष्ट उल्लेख है। हिन्दी में ‘आग में जला दिया’ उस बलाघात को बनाए रखता है, और मूल की ‘जलाने’ वाली पुनरुक्ति भी सुरक्षित रहती है।
- source_word: כְּלֵי מַחֲמַדֶּיהָ
  choice: उसकी सभी बहुमूल्य वस्तुएँ
  rationale: כְּלִי का अर्थ पात्र, उपकरण या व्यापक रूप से वस्तु हो सकता है, और מַחֲמַד मूल्यवान अथवा मनभावनी चीज़ को दर्शाता है। ‘बहुमूल्य वस्तुएँ’ मूल की व्यापकता को ‘पात्रों’ की तुलना में बेहतर बनाए रखता है।
- source_word: לְהַשְׁחִית
  choice: नष्ट कर दिया
  rationale: हिफ़ील क्रिया का अर्थ नष्ट करना है। आशयगत परिणाम को हिन्दी में समन्वित पूर्ण क्रिया के रूप में व्यक्त करना स्वाभाविक है।
theological_decisions:
- issue: בֵּית הָאֱלֹהִים का अनुवाद
  choice: मुख्य पाठ में ‘परमेश्वर का भवन’
  alternative: ‘परमेश्वर का मन्दिर’
  rationale: यह पद ऐतिहासिक रूप से मन्दिर की ओर संकेत करता है, पर मूल अभिव्यक्ति ‘परमेश्वर का घर/भवन’ है। मुख्य पाठ मूल रूप को रखता है और पादटिप्पणी संदर्भगत विकल्प बताती है।
- issue: כְּלֵי מַחֲמַדֶּיהָ का संदर्भ
  choice: व्यापक ‘बहुमूल्य वस्तुएँ’
  alternative: ‘बहुमूल्य पात्र’
  rationale: मूल पदावली केवल उपासना के पात्रों तक अर्थ को निश्चित नहीं करती; इसलिए किसी विशिष्ट धार्मिक श्रेणी को आरोपित किए बिना व्यापक अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को स्पष्ट करता है। मूल की क्रमिक क्रियाएँ और ‘जलाने’ की पुनरुक्ति बनाए रखी गई हैं। दोनों पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
