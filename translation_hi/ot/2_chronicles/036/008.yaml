  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהֽוֹיָקִ֜ים וְ/תֹֽעֲבֹתָ֤י/ו אֲשֶׁר עָשָׂה֙ וְ/הַ/נִּמְצָ֣א עָלָ֔י/ו הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר מַלְכֵ֥י יִשְׂרָאֵ֖ל וִֽ/יהוּדָ֑ה וַ/יִּמְלֹ֛ךְ יְהוֹיָכִ֥ין בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/008.yaml
  text: The rest of the acts of Jehoiakim[a], and the abominations that he did, and what was found against him—behold, they are written in the Book of the Kings of Israel and Judah. And Jehoiachin his son reigned in his place.
translation:
  language: hi
  text: यहोयाकीम के बाकी काम, उसके किए हुए घिनौने काम और जो कुछ उसके विरुद्ध पाया गया[a]—देखो, वे इस्राएल और यहूदा के राजाओं की पुस्तक में लिखे हैं। तब उसका पुत्र यहोयाकीन उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ उसके विषय में पाया गया।” इब्रानी वाक्यांश सामान्य रूप से यहोयाकीम के विषय में ज्ञात हुई बातों को भी सूचित कर सकता है, यद्यपि नकारात्मक संदर्भ में “उसके विरुद्ध” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹיָקִים
  choice: यहोयाकीम के बाकी काम
  rationale: राजकीय इतिहास के सारांश में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि उसके शासन के काम और घटनाएँ है; ‘बाकी काम’ सहज और संक्षिप्त है।
- source_word: וְתֹעֲבֹתָיו אֲשֶׁר עָשָׂה
  choice: उसके किए हुए घिनौने काम
  rationale: תֹּועֵבָה की प्रबल नैतिक और धार्मिक निंदात्मकता को ‘घिनौने काम’ आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהַנִּמְצָא עָלָיו
  choice: और जो कुछ उसके विरुद्ध पाया गया[a]
  rationale: עַל यहाँ प्रतिकूल अर्थ दे सकता है, इसलिए ‘उसके विरुद्ध’ संदर्भानुकूल है; फिर भी ‘उसके विषय में’ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: הִנָּם כְּתוּבִים
  choice: देखो, वे ... लिखे हैं
  rationale: הִנָּם के ध्यान आकर्षित करने वाले बल को ‘देखो’ बनाए रखता है, और כְּתוּבִים का सीधा अर्थ ‘लिखे हैं’ है।
- source_word: סֵפֶר מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा के राजाओं की पुस्तक
  rationale: यह स्रोत-संदर्भ के शीर्षक-सदृश रूप को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וַיִּמְלֹךְ יְהוֹיָכִין בְּנוֹ תַּחְתָּיו
  choice: तब उसका पुत्र यहोयाकीन उसके स्थान पर राजा हुआ
  rationale: וַיִּמְלֹךְ उत्तराधिकार की घटना को आगे बढ़ाता है; ‘राजा हुआ’ हिन्दी में राजगद्दी सँभालने का स्वाभाविक कथन है और תַּחְתָּיו का अर्थ ‘उसके स्थान पर’ स्पष्ट रखता है।
theological_decisions:
- issue: וְהַנִּמְצָא עָלָיו का प्रतिकूल या सामान्य अर्थ
  choice: उसके विरुद्ध पाया गया
  alternative: उसके विषय में पाया गया
  rationale: घिनौने कामों के नकारात्मक संदर्भ में प्रतिकूल अर्थ अधिक उपयुक्त है, पर इब्रानी वाक्यांश सामान्यतः उसके विषय में मिली बातों का संकेत भी दे सकता है; अतः विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज। राजकीय सारांश की संक्षिप्त शैली और मूल के ‘देखो’ वाले संकेतक बल को बनाए रखा गया है।
