  text: וַ/יַּ֨עַל עֲלֵי/הֶ֜ם אֶת מֶ֣לֶךְ כשדיים וַ/יַּהֲרֹ֨ג בַּחוּרֵי/הֶ֤ם בַּ/חֶ֨רֶב֙ בְּ/בֵ֣ית מִקְדָּשָׁ֔/ם וְ/לֹ֥א חָמַ֛ל עַל בָּח֥וּר וּ/בְתוּלָ֖ה זָקֵ֣ן וְ/יָשֵׁ֑שׁ הַ/כֹּ֖ל נָתַ֥ן בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/017.yaml
  text: So he brought up against them the king of the Chaldeans[a], who killed their young men with the sword in the house of their sanctuary, and had no compassion on young man or virgin, old man or aged man[c][b]. He gave all into his hand.
translation:
  language: hi
  text: इसलिए उसने कसदियों के राजा[a] को उनके विरुद्ध चढ़ा लाया। उसने उनके पवित्रस्थान के भवन में उनके युवकों को तलवार से मार डाला और न युवक पर, न कुँवारी[b] पर, न बूढ़े पर, न अति वृद्ध पर दया की[c]। उसने सब उसके हाथ में दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबेलियों के राजा”; इब्रानी में “कसदियों।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द विशेष रूप से किसी कुँवारी, अर्थात अविवाहित युवती, को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या “किसी को नहीं बख्शा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל עֲלֵיהֶם
  choice: उसने ... उनके विरुद्ध चढ़ा लाया
  rationale: हिफ़ईल रूप की कारकता और सैन्य प्रसंग दोनों को बनाए रखता है; कर्ता पिछले पद से परमेश्वर है।
- source_word: מֶלֶךְ כשדיים
  choice: कसदियों के राजा
  rationale: इब्रानी जातिनाम का सीधा प्रतिनिधित्व; बाबेलियों का राजा अर्थगत विकल्प है।
- source_word: וַיַּהֲרֹג בַּחוּרֵיהֶם בַּחֶרֶב
  choice: उसने उनके जवानों को तलवार से मार डाला
  rationale: क्रिया की घातकता तथा हथियार-सूचक वाक्यांश को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּבֵית מִקְדָּשָׁם
  choice: उनके पवित्रस्थान के भवन में
  rationale: ‘उनके पवित्रस्थान के भवन में’ स्रोत की संयुक्त अभिव्यक्ति और उस स्थान में हुए अपवित्रीकरण की तीव्रता को सुरक्षित रखता है।
- source_word: וְלֹא חָמַל
  choice: दया नहीं की
  rationale: חמל में न बख्शने और करुणा न दिखाने दोनों का भाव है; मुख्य पाठ में सहज हिन्दी चुनी गई है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: בָּחוּר וּבְתוּלָה
  choice: जवान ... कुँवारी
  rationale: दोनों आयु और लिंग-सूचक शब्दों को अलग रखता है; בתולה विशेषतः अविवाहित युवती/कुँवारी को सूचित करता है।
- source_word: זָקֵן וְיָשֵׁשׁ
  choice: बूढ़े ... अति वृद्ध
  rationale: आयु की दो समान किंतु तीव्र होती श्रेणियों को हिन्दी में अलग-अलग बनाए रखता है।
- source_word: הַכֹּל נָתַן בְּיָדוֹ
  choice: उसने सबको उसके हाथ में दे दिया
  rationale: संदर्भ में लोगों को दूसरे के अधिकार में सौंपने का अर्थ है; अलग-अलग ‘उसने/उसके’ से परमेश्वर और कसदी राजा के संदर्भ सुरक्षित रहते हैं।
theological_decisions:
- issue: आरंभिक और अंतिम क्रिया का कर्ता
  choice: ‘उसने’ परमेश्वर को सूचित करता है, जो पिछले पद के प्रसंग से आता है।
  alternative: हिन्दी में कर्ता को अनिर्दिष्ट छोड़ना।
  rationale: इब्रानी क्रियाएँ पुल्लिंग एकवचन हैं और उनका कर्ता पूर्ववर्ती प्रसंग से यहोवा है; सर्वनाम कथा-प्रवाह को बनाए रखता है, नाम जोड़कर स्रोत से आगे नहीं जाता।
- issue: ‘उसके हाथ’ का संदर्भ
  choice: ‘उसके’ का संदर्भ कसदियों का राजा है।
  alternative: भावार्थ रूप में ‘उसके अधिकार में’।
  rationale: इब्रानी मुहावरे ‘हाथ में देना’ को सुरक्षित रखते हुए सत्ता में सौंपे जाने का भाव मिलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक रूप रखा गया है। ‘चढ़ा लाया’ सैन्य चढ़ाई और कारक क्रिया को, ‘पवित्रस्थान के भवन’ स्रोत की औपचारिक बनावट को, और ‘बूढ़े ... अति वृद्ध’ इब्रानी समानांतरता को सुरक्षित रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
