source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו לֹ֣א נִכְנַ֗ע מִ/לִּ/פְנֵ֛י יִרְמְיָ֥הוּ הַ/נָּבִ֖יא מִ/פִּ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/012.yaml
  text: He did what was evil in the eyes of Yahweh his God[a], and he did not humble himself before Jeremiah the prophet, who spoke from the mouth of Yahweh.
translation:
  language: hi
  text: उसने अपने परमेश्वर याहवे की दृष्टि में बुराई की, और याहवे के मुख से बोलने वाले यिर्मयाह नबी के सामने अपने आप को नम्र नहीं किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख से।” अर्थात् यिर्मयाह का संदेश याहवे से आया था।
    reason: ‘याहवे के मुख से’ इब्रानी भविष्यद्वाणी-संबंधी अभिव्यक्ति को बनाए रखता है और उसका आशय स्पष्ट करता है।
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने...बुरा किया
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप; यह नैतिक मूल्यांकन को स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर याहवे की दृष्टि में
  rationale: ‘की दृष्टि में’ स्रोत के मूल्यांकन-सूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; ‘अपने परमेश्वर’ संबंधवाचक प्रत्यय का बल बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לֹא נִכְנַע
  choice: अपने आपको दीन नहीं किया
  rationale: निफ़अल रूप यहाँ आत्मवाचक/मध्य अर्थ देता है और सिदकिय्याह द्वारा नम्रता न अपनाने की नैतिक जिम्मेदारी को व्यक्त करता है।
- source_word: מִלִּפְנֵי יִרְמְיָהוּ הַנָּבִיא
  choice: यिर्मयाह नबी के सामने
  rationale: ‘के सामने’ संबंधसूचक पूर्वसर्ग का संक्षिप्त और स्वाभाविक अनुवाद है; नबी की उपाधि स्पष्ट रखी गई है।
- source_word: מִפִּי יְהוָה
  choice: याहवे के मुख से
  rationale: स्रोत की सजीव भविष्यद्वाणी-संबंधी अभिव्यक्ति को बनाए रखा गया है; पादटिप्पणी उसका मुहावरेदार आशय स्पष्ट करती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: לֹא נִכְנַע में कर्तृत्व
  choice: अपने आपको दीन नहीं किया
  alternative: वह दीन नहीं हुआ
  rationale: संदर्भ में यह रूप स्वेच्छा से नम्र न होने या न झुकने का भाव देता है; चुना हुआ रूप उसकी जवाबदेही को स्पष्ट करता है, जबकि क्रिया की आत्मवाचक प्रकृति बनाए रखता है।
- issue: מִפִּי יְהוָה का संबंध
  choice: यिर्मयाह के नबी के रूप में बोलने से संबद्ध
  alternative: इसे केवल ‘याहवे की आज्ञा से’ कहना
  rationale: वाक्यक्रम के अनुसार यह अभिव्यक्ति यिर्मयाह की भविष्यद्वाणी के स्रोत को बताती है। ‘मुख से’ को बनाए रखने से भविष्यद्वाणी की मध्यस्थता का स्रोत-सम्मत चित्र सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘दृष्टि में’, ‘अपने आपको दीन नहीं किया’ और ‘मुख से बोलता था’ स्रोत-पाठ के प्रमुख मुहावरों को समझने योग्य हिन्दी में बनाए रखते हैं।
