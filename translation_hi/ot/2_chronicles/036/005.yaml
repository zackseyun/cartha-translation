  text: בֶּן עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ יְהוֹיָקִ֣ים בְּ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וַ/יַּ֣עַשׂ הָ/רַ֔ע בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/005.yaml
  text: Jehoiakim was twenty-five years old when he became king, and he reigned eleven years in Jerusalem. He did what was evil in the eyes of Yahweh his God.
translation:
  language: hi
  text: जब यहोयाकीम राजा बना, तब वह पच्चीस वर्ष का था। उसने यरूशलेम में ग्यारह वर्ष तक राज किया। उसने वह किया जो उसके परमेश्वर याहवे की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: वह पच्चीस वर्ष का था
  rationale: यह इब्रानी में आयु बताने का सामान्य मुहावरा है; हिंदी में इसका स्वाभाविक अर्थ इसी रूप में व्यक्त होता है।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: नाम का रूप आधुनिक हिंदी बाइबल परंपरा और इब्रानी उच्चारण के निकट रखा गया है।
- source_word: בְּמָלְכוֹ
  choice: जब ... राजा बना
  rationale: בְּ उपसर्ग सहित यह रूप उसके राजपद ग्रहण करने के समय को बताता है; यह आधुनिक हिंदी में सहज है।
- source_word: וְאַחַת עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: उसने ... ग्यारह वर्ष तक राज किया
  rationale: מָלַךְ का अर्थ राज करना या राजा होना है; अवधि के साथ 'राज किया' स्पष्ट और स्वाभाविक है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह उसके शासन का स्थान बताने वाला सीधा स्थानवाचक पद है।
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वही किया जो ... बुरा था
  rationale: यह इब्रानी मूल्यांकन-सूत्र के क्रियात्मक और नैतिक अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह किसी के मूल्यांकन या दृष्टिकोण को व्यक्त करने वाला इब्रानी मुहावरा है; हिंदी में 'की दृष्टि में' गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुर्वर्णीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: एकवचन पुल्लिंग प्रत्यय यहोयाकीम की ओर संकेत करता है; संबंधसूचक अर्थ स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे किसी उपाधि से प्रतिस्थापित न करके हिंदी में निकट और समझने योग्य लिप्यंतरण दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण ऐतिहासिक-वर्णन शैली। राजकीय सूत्र की पुनरावृत्ति और परमेश्वर के सम्मुख नैतिक मूल्यांकन को सुरक्षित रखा गया है।
