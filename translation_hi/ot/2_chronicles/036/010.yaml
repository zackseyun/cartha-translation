  text: וְ/לִ/תְשׁוּבַ֣ת הַ/שָּׁנָ֗ה שָׁלַח֙ הַ/מֶּ֣לֶךְ נְבֽוּכַדְנֶאצַּ֔ר וַ/יְבִאֵ֣/הוּ בָבֶ֔לָ/ה עִם כְּלֵ֖י חֶמְדַּ֣ת בֵּית יְהוָ֑ה וַ/יַּמְלֵךְ֙ אֶת צִדְקִיָּ֣הוּ אָחִ֔י/ו עַל יְהוּדָ֖ה וִֽ/ירוּשָׁלִָֽם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/010.yaml
  text: At the turn of the year[a], King Nebuchadnezzar sent and brought him to Babylon, along with the precious vessels of the house of Yahweh[c][b], and made his brother Zedekiah king over Judah and Jerusalem.
translation:
  language: hi
  text: वर्ष के फिर से आने पर[a] राजा नबूकदनेस्सर ने भेजा और उसे याहवे के भवन के बहुमूल्य पात्रों[b] के साथ बाबेल ले गया। उसने उसके भाई[c] सिदकिय्याह को यहूदा और यरूशलेम पर राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वर्ष के लौटने पर”; यह मुहावरा वर्ष के फिर आ जाने के समय को बताता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “याहवे के भवन के मूल्यवान/बहुमूल्य सामान” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “उसका भाई” है। सिदकिय्याह यहोयाकीन का निकट राजवंशी संबंधी और, अधिक ठीक रूप से, उसका चाचा था।
    reason: cultural_note
lexical_decisions:
- source_word: וְלִתְשׁוּבַת הַשָּׁנָה
  choice: वर्ष के फिर आने के समय
  rationale: यह इब्रानी मुहावरे के ‘वर्ष के लौटने/फिर आने’ के भाव को स्वाभाविक हिन्दी में रखता है और इसे निश्चित रूप से ‘वसंत’ नहीं बनाता।
- source_word: שָׁלַח ... וַיְבִאֵהוּ
  choice: लोग भेजकर उसे ... ले आया
  rationale: यह राजा के भेजने और उसके फलस्वरूप यहोयाकीन को बाबेल लाए जाने—दोनों क्रियाओं को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָבֶלָה
  choice: बाबेल
  rationale: दिशासूचक रूप का अर्थ बाबेल की ओर ले जाना है; हिन्दी वाक्य में ‘बाबेल ले आया’ वही गति प्रकट करता है।
- source_word: כְּלֵי חֶמְדַּת
  choice: बहुमूल्य पात्र
  rationale: כְּלֵי मंदिर के पात्रों/सामानों और חֶמְדַּת उनकी मनोहरता, मूल्य या वांछनीयता को दर्शाता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ इब्रानी ‘घर’ की धार्मिक अभिव्यक्ति को बनाए रखता है, और याहवे मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को दर्शाता है।
- source_word: וַיַּמְלֵךְ
  choice: राजा बनाया
  rationale: हिफ़ील क्रिया का अर्थ किसी को राज्य करने देना अथवा राजा नियुक्त करना है।
- source_word: אָחִיו
  choice: उसके भाई
  rationale: मूल पाठ का सीधा शब्द ‘भाई’ है। वंशावली में सिदकिय्याह अधिक ठीक रूप से यहोयाकीन का चाचा था; इस तनाव को मुख्य पाठ बदलने के बजाय टिप्पणी में स्पष्ट किया गया है।
- source_word: עַל יְהוּדָה וִירוּשָׁלָם
  choice: यहूदा और यरूशलेम पर
  rationale: עַל यहाँ शासन के क्षेत्र को चिह्नित करता है—यहूदा और उसकी राजधानी यरूशलेम।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पद में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है।
- issue: אָחִיו में रिश्ते का वर्णन
  choice: उसके भाई
  alternative: उसके चाचा / उसके निकट संबंधी
  rationale: ‘भाई’ मूल की वास्तविक शब्दावली और उसमें निहित व्यापक संबंध-सूचक प्रयोग को सुरक्षित रखता है; वंशगत विशिष्टता पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वर्ष के फिर आने’ से मूल मुहावरे की अस्पष्टता बनी रहती है; ‘वसंत’ जैसा अधिक विशिष्ट अर्थ मुख्य पाठ में नहीं जोड़ा गया। ‘भाई’ को ज्यों का त्यों रखकर वंशावली संबंधी स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
