source:
  edition: WLC
  text: כֹּה אָמַ֞ר כּ֣וֹרֶשׁ מֶ֣לֶךְ פָּרַ֗ס כָּל מַמְלְכ֤וֹת הָ/אָ֨רֶץ֙ נָ֣תַן לִ֗/י יְהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּֽ/יהוּדָ֑ה מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהוָ֧ה אֱלֹהָ֛י/ו עִמּ֖/וֹ וְ/יָֽעַל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/023.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build for him a house in Jerusalem, which is in Judah. Whoever is among you of all his people, may Yahweh his God be with him[d][c][b], and let him go up.'
translation:
  language: hi
  text: 'फ़ारस का राजा कुस्रू यह कहता है: “स्वर्ग के परमेश्वर यहोवा[a] ने पृथ्वी के सारे राज्य मुझे दिए हैं, और उसी ने मुझे यह दायित्व सौंपा है कि मैं यरूशलेम में, जो यहूदा में है, उसके लिए एक भवन बनाऊँ। तुम में से उसकी प्रजा का जो कोई भी हो, उसका परमेश्वर यहोवा उसके साथ रहे[b], और वह ऊपर जाए[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है; इसे “याहवे” भी लिखा जाता है।
    reason: दिव्य नाम के लिप्यंतरण की जानकारी।
  - marker: b
    text: या, “उसका परमेश्वर यहोवा उसके साथ है।” इब्रानी वाक्य को कथन के रूप में भी समझा जा सकता है, यद्यपि प्रसंग में आशीर्वचन का भाव अधिक स्वाभाविक है।
    reason: मूल की वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखना।
  - marker: c
    text: अर्थात् यरूशलेम जाए। यरूशलेम की यात्रा के लिए “ऊपर जाना” बाइबल का पारंपरिक मुहावरा है।
    reason: सांस्कृतिक और भाषिक मुहावरे का स्पष्टीकरण।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: राजकीय घोषणा के सूत्र को स्वाभाविक आधुनिक हिन्दी में वर्तमानकालिक रूप से व्यक्त करता है।
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: फ़ारस का राजा कुस्रू
  rationale: व्यक्ति और देश के नामों के प्रचलित हिन्दी बाइबलीय रूप रखते हुए उपाधि को सहज हिन्दी क्रम में रखा गया है।
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सारे राज्य
  rationale: यहाँ אֶרֶץ का अर्थ व्यापक भू-राजनीतिक संसार है, केवल यहूदा देश नहीं।
- source_word: נָתַן לִי
  choice: मुझे दिए हैं
  rationale: पूर्ण क्रिया के वर्तमान परिणाम—कुस्रू का राज्यों पर अधिकार—को हिन्दी पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में उसके व्यापक रूप से पहचाने जाने वाले नामरूप में प्रत्यक्ष रखा गया है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: आकाश के परमेश्वर
  rationale: इब्रानी संबंध-पदबंध का सटीक और हिन्दी में प्रचलित अनुवाद।
- source_word: וְהוּא פָקַד עָלַי
  choice: और उसी ने मुझे यह दायित्व सौंपा है
  rationale: פָקַד यहाँ अधिकारपूर्वक कार्य सौंपने का भाव रखता है; ‘दायित्व सौंपा’ आदेश और नियुक्त कार्य दोनों को स्पष्ट करता है।
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: उसके लिए एक भवन बनाऊँ
  rationale: בַיִת के मूल ‘घर/भवन’ अर्थ को ‘मन्दिर’ बनाकर व्याख्यायित किए बिना, परमेश्वर के उपासना-स्थान के लिए गरिमापूर्ण ‘भवन’ चुना गया है।
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: यहूदा के यरूशलेम में
  rationale: इब्रानी सापेक्ष उपवाक्य की भौगोलिक सूचना को अर्थ खोए बिना स्वाभाविक हिन्दी में संक्षिप्त किया गया है।
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: तुममें से जो कोई उसकी सारी प्रजा में से हो
  rationale: 'संक्षिप्त इब्रानी पदबंध में מִן के अंशसूचक भाव को बचाता है: उपस्थित लोगों में से कोई भी जो उसकी प्रजा का सदस्य हो।'
- source_word: יְהוָה אֱלֹהָיו עִמּוֹ
  choice: उसका परमेश्वर यहोवा उसके साथ रहे
  rationale: संदर्भ में इसे आशीर्वचनात्मक कामना मानते हुए हिन्दी संभावनार्थक रूप चुना गया है, जबकि वैकल्पिक विधानात्मक पाठ फुटनोट में सुरक्षित है।
- source_word: וְיָעַל
  choice: और वह ऊपर जाए
  rationale: यरूशलेम जाने के पारंपरिक ‘ऊपर जाने’ वाले बाइबलीय मुहावरे और प्रसंगगत प्रेरणार्थक/कामनार्थक बल को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में आया विशिष्ट वाचा-नाम सामान्य उपाधि में विलीन नहीं किया गया; हिन्दी पाठकों के लिए सुविदित प्रत्यक्ष नामरूप चुना गया है और वैकल्पिक लिप्यंतरण फुटनोट में दिया गया है।
- issue: בַיִת को भवन या मन्दिर कहना
  choice: भवन
  alternative: मन्दिर; घर
  rationale: मूल का शब्द ‘घर/भवन’ है। ‘भवन’ इस उपासना-स्थान के गरिमापूर्ण अर्थ को संप्रेषित करता है, पर ‘मन्दिर’ कहकर निहितार्थ को मूल शब्द के स्थान पर नहीं रखता।
- issue: יְהוָה אֱלֹהָיו עִמּוֹ का व्याकरणिक बल
  choice: 'आशीर्वचनात्मक: ‘उसका परमेश्वर यहोवा उसके साथ रहे’'
  alternative: 'विधानात्मक: ‘उसका परमेश्वर यहोवा उसके साथ है’'
  rationale: वापसी के निमंत्रण के साथ यह वाक्यांश स्वाभाविक रूप से आशीर्वाद/कामना का कार्य करता है, पर क्रियारहित इब्रानी विधानात्मक अर्थ की भी अनुमति देता है; इसलिए विकल्प फुटनोट में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण राजकीय घोषणा की शैली। वाक्यरचना साधारण पाठक के लिए स्वाभाविक रखी गई है; ‘फ़ारस’, ‘कुस्रू’, ‘यरूशलेम’, ‘यहूदा’ और ‘यहोवा’ जैसे परिचित हिन्दी बाइबलीय नामरूप अपनाए गए हैं। स्रोत की संक्षिप्तता और अंतिम आशीर्वचन की अस्पष्टता को फुटनोट सहित सुरक्षित रखा गया है।
