base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/003.yaml
  text: And the king of Egypt deposed him in Jerusalem and imposed on the land a tribute of a hundred talents of silver and a talent of gold[a][b][c].
translation:
  language: hi
  text: और मिस्र के राजा ने उसे यरूशलेम में पद से हटा दिया[a] और देश पर चाँदी के सौ किक्कार और सोने के एक किक्कार का जुर्माना लगाया[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे दूर ले गया”; इब्रानी क्रिया किसी को पद से हटाने या दूर ले जाने, दोनों अर्थों में आ सकती है।
    reason: alternative_reading
  - marker: b
    text: या “देश पर आर्थिक दंड लगाया”; यहाँ प्रयुक्त क्रिया धनराशि के रूप में दंड लगाने को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: किक्कार प्राचीन काल में भार की एक बड़ी इकाई थी; यहाँ उसे आधुनिक भार में बदलने के बजाय मूल माप रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְסִירֵהוּ
  choice: उसे ... पद से हटा दिया
  rationale: स्रोत क्रिया סוּר के हिफ़ील रूप का अर्थ ‘हटा देना’ या ‘दूर कर देना’ हो सकता है। राजकीय संदर्भ में ‘पद से हटा दिया’ स्वाभाविक है, जबकि पादटिप्पणी व्यक्ति को वहाँ से ले जाए जाने की संभावित छाया को सुरक्षित रखती है।
- source_word: מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा
  rationale: यह इब्रानी संबंध-वाचक रचना का सीधा और स्वाभाविक हिन्दी रूप है; पद में न दिए गए राजा के नाम को नहीं जोड़ा गया।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב यहाँ स्थान बताता है; ‘में’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: וַיַּעֲנֹשׁ
  choice: जुर्माना लगाया
  rationale: ענשׁ यहाँ निश्चित धनराशि लगाए जाने के कारण आर्थिक दंड का बोध कराता है। ‘जुर्माना लगाया’ ‘दंड दिया’ से अधिक स्पष्ट है और ‘कर लगाया’ की अपेक्षा दंडात्मक अर्थ बेहतर रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ אָרֶץ से यहूदा का भूभाग अथवा राज्य अभिप्रेत है; सामान्य पाठक के लिए ‘देश’ स्वाभाविक और स्पष्ट है।
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: सौ किक्कार चाँदी
  rationale: כִּכָּר प्राचीन भार-माप है। आधुनिक अनुमान में बदलने के बजाय पारंपरिक हिन्दी बाइबलीय रूप ‘किक्कार’ रखा गया है।
- source_word: וְכִכַּר זָהָב
  choice: और एक किक्कार सोने
  rationale: उसी प्राचीन भार-माप की स्पष्ट एकवचन मात्रा को बनाए रखा गया है।
theological_decisions:
- issue: राजा के विरुद्ध कार्रवाई का स्वरूप
  choice: पद से हटा दिया
  alternative: उसे वहाँ से हटा दिया / उसे ले गया
  rationale: संदर्भ राजकीय पदच्युति का समर्थन करता है, पर इब्रानी क्रिया केवल पदच्युति तक सीमित नहीं है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक कथन। ‘पद से हटा दिया’ राजनीतिक संदर्भ स्पष्ट करता है, ‘जुर्माना लगाया’ आर्थिक दंड को सहज भाषा में व्यक्त करता है, और प्राचीन माप ‘किक्कार’ पादटिप्पणी सहित सुरक्षित रखा गया है।
