reference: 2 Chronicles 36:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֠ם כָּל שָׂרֵ֨י הַ/כֹּהֲנִ֤ים וְ/הָ/עָם֙ הִרְבּ֣וּ לִ/מְעָול מַ֔עַל כְּ/כֹ֖ל תֹּעֲב֣וֹת הַ/גּוֹיִ֑ם וַֽ/יְטַמְּאוּ֙ אֶת בֵּ֣ית יְהוָ֔ה אֲשֶׁ֥ר הִקְדִּ֖ישׁ בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/014.yaml
  text: Also all the leaders of the priests and the people increased in unfaithfulness[a], according to all the abominations of the nations, and they defiled the house of Yahweh[b], which he had consecrated in Jerusalem.
translation:
  language: hi
  text: इसके अलावा, याजकों के सभी अगुवों और लोगों ने भी राष्ट्रों के सारे घिनौने कामों के समान अत्यधिक विश्वासघात करते गए[a] और यहोवा के उस भवन को अशुद्ध कर दिया, जिसे उसने यरूशलेम में पवित्र ठहराया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों के सारे घिनौने कामों के अनुसार।” इब्रानी में यह उनकी करनी की राष्ट्रों के घिनौने कामों से तुलना अथवा उनके अनुरूप होने का भाव दे सकता है।
    reason: כְּכֹל की तुलना और अनुरूपता—दोनों संभावित अर्थ-छायाओं को सुरक्षित रखता है।
  - marker: b
    text: “यहोवा” इब्रानी दिव्य नाम YHWH का लिप्यंतरण है।
    reason: पाठक को व्यक्तिवाचक दिव्य नाम के अनुवाद-संबंधी निर्णय से अवगत कराना।
lexical_decisions:
- source_word: גַּם
  choice: इसके अलावा ... भी
  rationale: यह पिछले प्रसंग से संबंध और सम्मिलित बल दोनों व्यक्त करता है; हिंदी वाक्य में ‘भी’ स्वाभाविक स्थान पर रखा गया है।
- source_word: כָּל שָׂרֵי הַכֹּהֲנִים וְהָעָם
  choice: याजकों के सभी अगुओं और लोगों
  rationale: שָׂרֵי को याजकों के अगुओं के रूप में लिया गया है, न कि बाद के तकनीकी पद ‘प्रधान याजक’ के रूप में; ‘लोगों’ को समानांतर समूह रखा गया है।
- source_word: הִרְבּוּ לִמְעָול מַעַל
  choice: बहुत विश्वासघात किया
  rationale: हिफ़ील क्रिया और सजातीय संज्ञा की तीव्रता को सहज हिंदी में ‘बहुत’ द्वारा रखा गया है; ‘विश्वासघात’ परमेश्वर के प्रति निष्ठा भंग और पवित्र वस्तुओं के संदर्भ, दोनों को समेटता है।
- source_word: כְּכֹל תֹּעֲבוֹת הַגּוֹיִם
  choice: राष्ट्रों के सारे घिनौने कामों के समान
  rationale: כְּ की तुलना अथवा अनुरूपता को ‘के समान’ से स्पष्ट रखा गया है और תּוֹעֵבוֹת का नैतिक-धार्मिक भार ‘घिनौने काम’ में व्यक्त होता है।
- source_word: וַיְטַמְּאוּ
  choice: अशुद्ध कर दिया
  rationale: मंदिर-संदर्भ में यह क्रिया धार्मिक और नैतिक अपवित्रता बताती है; ‘अशुद्ध कर दिया’ सामान्य हिंदी में स्पष्ट है।
- source_word: בֵּית יְהוָה
  choice: यहोवा ... भवन
  rationale: בֵּית का शाब्दिक रूप ‘भवन’ रखा गया है और संबंधवाचक उपवाक्य को स्वाभाविक हिंदी क्रम में उसके साथ जोड़ा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֲשֶׁר הִקְדִּישׁ בִּירוּשָׁלִָם
  choice: यरूशलेम में ... पवित्र ठहराए हुए
  rationale: कर्ता वही, अर्थात यहोवा, समझा गया है; हिंदी में स्वाभाविक विशेषणात्मक रचना से भवन को पवित्र उपयोग के लिए अलग किए जाने का भाव रखा गया है।
theological_decisions:
- issue: מָעַל द्वारा व्यक्त वाचा-संबंधी और पवित्रस्थान-संबंधी अपराध
  choice: विश्वासघात
  alternative: अविश्वासयोग्यता; अपराध; द्रोह
  rationale: ‘विश्वासघात’ परमेश्वर के प्रति निष्ठा तोड़ने का बल बनाए रखता है और इसे केवल कानूनी अपराध तक सीमित नहीं करता।
- issue: כְּכֹל में तुलना अथवा आचरण-अनुरूपता
  choice: सारे घिनौने कामों के समान
  alternative: सारे घिनौने कामों के अनुसार
  rationale: उपसर्ग दोनों अर्थ-छायाएँ दे सकता है; मुख्य पाठ में तुलना रखी गई है और विकल्प पादटिप्पणी में सुरक्षित है।
- issue: יְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिवाचक दिव्य नाम है; इसलिए नाम को शीर्षक ‘प्रभु’ से बदलने के बजाय हिंदी का परिचित लिप्यंतरण रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘याजकों के अगुए’, ‘घिनौने काम’ और ‘अशुद्ध कर दिया’ जैसे पद मूल के धार्मिक संदर्भ को स्पष्ट रखते हैं, जबकि अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हैं।
