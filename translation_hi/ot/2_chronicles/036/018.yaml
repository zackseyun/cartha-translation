id: 2CH.36.18
reference: 2 Chronicles 36:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/כֹל כְּלֵ֞י בֵּ֤ית הָ/אֱלֹהִים֙ הַ/גְּדֹלִ֣ים וְ/הַ/קְּטַנִּ֔ים וְ/אֹֽצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֹצְר֥וֹת הַ/מֶּ֖לֶךְ וְ/שָׂרָ֑י/ו הַ/כֹּ֖ל הֵבִ֥יא בָבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/018.yaml
  text: And all the vessels of the house of God[a], great and small, and the treasures of the house of Yahweh[b], and the treasures of the king and of his officials—all this he brought to Babylon.
translation:
  language: hi
  text: और परमेश्वर के भवन के सभी पात्र—बड़े और छोटे—और याहवे के भवन के खजाने[a], और राजा तथा उसके अधिकारियों[b] के खजाने—यह सब वह बाबेल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खजाने’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘भंडार’ या ‘भंडारगृह’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रधानों’; इब्रानी शब्द शासकों, हाकिमों या उच्च अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל כְּלֵי בֵּית הָאֱלֹהִים
  choice: और परमेश्वर के भवन के सभी पात्र
  rationale: ‘सभी’ सामूहिक व्यापकता व्यक्त करता है। मंदिर के संदर्भ में כְּלֵי पूजा में काम आने वाले पात्रों और अन्य वस्तुओं का व्यापक संकेत है; ‘पात्र’ संक्षिप्त और गरिमापूर्ण है।
- source_word: הַגְּדֹלִים וְהַקְּטַנִּים
  choice: बड़े और छोटे
  rationale: आकार अथवा महत्त्व—दोनों की संभावित व्यापकता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: וְאֹצְרוֹת בֵּית יְהוָה
  choice: और याहवे के भवन के खजाने
  rationale: यहाँ ले जाई जा सकने वाली बहुमूल्य वस्तुएँ संदर्भ में अधिक स्वाभाविक हैं; फिर भी स्थान अथवा भंडारगृह का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאֹצְרוֹת הַמֶּלֶךְ וְשָׂרָיו
  choice: और राजा तथा उसके अधिकारियों के खजाने
  rationale: שָׂרָיו प्रशासनिक पदधारियों, प्रधानों या हाकिमों को सूचित कर सकता है। ‘अधिकारी’ आधुनिक हिंदी में व्यापक और सहज है।
- source_word: הַכֹּל הֵבִיא בָבֶל
  choice: यह सब वह बाबेल ले गया
  rationale: הַכֹּל पिछली पूरी सूची को समेटता है। संदर्भ से एकवचन कर्ता नबूकदनेस्सर है, पर नाम को पद में जोड़ने के बजाय हिब्रू के निहित सर्वनाम को ‘वह’ रखा गया है। गंतव्य के साथ ‘ले गया’ स्वाभाविक हिंदी है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में रखता है और किसी विशेष व्याख्यात्मक परंपरा को पाठ में नहीं जोड़ता।
- issue: בֵּית הָאֱלֹהִים और בֵּית יְהוָה का रूप
  choice: परमेश्वर का भवन; याहवे का भवन
  alternative: परमेश्वर का मंदिर; याहवे का मंदिर
  rationale: ‘भवन’ हिब्रू ‘घर/भवन’ के रूपक को बनाए रखता है, जबकि संदर्भ से मंदिर का आशय स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। सूची की लय और समापन के समष्टिबोधक ‘यह सब’ को बनाए रखने के लिए दीर्घ विराम-चिह्नों का प्रयोग किया गया है।
