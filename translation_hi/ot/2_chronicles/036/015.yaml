  text: וַ/יִּשְׁלַ֡ח יְהוָה֩ אֱלֹהֵ֨י אֲבוֹתֵי/הֶ֧ם עֲלֵי/הֶ֛ם בְּ/יַ֥ד מַלְאָכָ֖י/ו הַשְׁכֵּ֣ם וְ/שָׁל֑וֹחַ כִּֽי חָמַ֥ל עַל עַמּ֖/וֹ וְ/עַל מְעוֹנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/015.yaml
  text: And Yahweh[a], the God of their fathers, sent word to them by the hand of his messengers, rising early and sending[c][b], because he had compassion on his people and on his dwelling place.
translation:
  language: hi
  text: उनके पूर्वजों के परमेश्वर याहवे ने अपने संदेशवाहकों[b] के द्वारा उनके पास बार-बार संदेश भेजे[a], क्योंकि उसने अपनी प्रजा और अपने निवास-स्थान[c] पर दया की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सवेरे उठकर और भेजते हुए”; यह इब्रानी मुहावरा तत्परता और बार-बार भेजने को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने संदेशवाहकों के हाथ से।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात यरूशलेम का मंदिर, जिसे अपनी प्रजा के बीच परमेश्वर का निवास-स्थान माना गया है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी दिव्य नाम का निकट देवनागरी लिप्यंतरण; इसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: उनके पूर्वजों के परमेश्वर
  rationale: यह ऐतिहासिक और वाचागत संबंध बनाए रखता है तथा आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक सहज है।
- source_word: וַיִּשְׁלַח ... עֲלֵיהֶם
  choice: उनके पास ... संदेश भेजे
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है; संदेशवाहकों के प्रसंग में निहित संदेश को हिन्दी में स्पष्ट करना स्वाभाविक है।
- source_word: בְּיַד מַלְאָכָיו
  choice: अपने संदेशवाहकों के द्वारा
  rationale: ‘हाथ से’ यहाँ माध्यम अथवा अभिकरण का इब्रानी मुहावरा है; हिन्दी में ‘के द्वारा’ उसका स्वाभाविक अर्थ देता है।
- source_word: מַלְאָכָיו
  choice: संदेशवाहकों
  rationale: प्रसंग में चेतावनी पहुँचाने वाले मानवीय, विशेषतः नबी-सदृश दूत अभिप्रेत हैं; ‘स्वर्गदूत’ अनावश्यक रूप से अर्थ सीमित करता।
- source_word: הַשְׁכֵּם וְשָׁלוֹחַ
  choice: बार-बार संदेश भेजे
  rationale: शाब्दिक ‘सवेरे उठकर भेजना’ वाला इब्रानी मुहावरा तत्पर और निरंतर पुनरावृत्ति व्यक्त करता है; मुख्य पाठ में उसका अर्थ दिया गया और रूपक पाद-टिप्पणी में रखा गया।
- source_word: כִּי חָמַל
  choice: क्योंकि उसे ... पर दया आती थी
  rationale: חמל ऐसी करुणा या दया बताता है जो बचाने अथवा नष्ट न करने को प्रेरित करती है; यह हिन्दी में कारणवाचक वाक्य के रूप में सहज है।
- source_word: מְעוֹנוֹ
  choice: अपने निवास-स्थान
  rationale: मूल शब्द का अर्थ ‘निवास-स्थान’ है; संदर्भ में मंदिर होने की व्याख्या पाद-टिप्पणी में दी गई है, मुख्य पाठ में नहीं थोपी गई।
theological_decisions:
- issue: ‘उसके संदेशवाहकों’ का संदर्भ
  choice: मानवीय संदेशवाहकों के लिए व्यापक शब्द ‘संदेशवाहक’
  alternative: ‘स्वर्गदूत’
  rationale: आस-पास का प्रसंग परमेश्वर द्वारा नबियों के माध्यम से बार-बार दी गई चेतावनियों का है; फिर भी मूल संज्ञा के सामान्य ‘दूत’ अर्थ को बनाए रखा गया है।
- issue: परमेश्वर के ‘निवास-स्थान’ की पहचान
  choice: मुख्य पाठ में ‘निवास-स्थान’ बनाए रखना
  alternative: सीधे ‘मंदिर’ कहना
  rationale: इससे परमेश्वर की उपस्थिति और मंदिर के बीच मूल पाठ का धर्मवैज्ञानिक संबंध बना रहता है, जबकि ऐतिहासिक संदर्भ पाद-टिप्पणी में स्पष्ट होता है।
- issue: दिव्य करुणा और आने वाला न्याय
  choice: दया को चेतावनी भेजने का कारण बनाए रखना
  alternative: दया का अर्थ केवल तत्काल दंड टालना करना
  rationale: मूल वाक्य करुणा को बार-बार संदेश भेजने का कारण बताता है और करुणा तथा बाद के न्याय के तनाव को स्वयं खड़ा रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली रखी गई है। ‘पूर्वजों’, ‘संदेशवाहकों’ और ‘निवास-स्थान’ जैसे शब्द मूल अर्थ के निकट रहते हुए आज की हिन्दी में स्वाभाविक हैं।
