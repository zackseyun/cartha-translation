  - severity: low
    issue: The expression for the remnant is redundant.
    rationale: “तलवार से बचे हुए शेष लोगों” repeats the survival idea in a cumbersome way. “तलवार से बचा हुआ शेष जन” retains both the collective-remnant meaning and the phrase “from the sword” more smoothly.
