base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/020.yaml
  text: He carried into exile to Babylon the remnant who had escaped the sword[a], and they became servants to him and to his sons until the reign of the kingdom of Persia.
translation:
  language: hi
  text: उसने तलवार से बचा हुआ शेष जन बाबेल में निर्वासन में ले गया। वे उसके और उसके पुत्रों के दास[a] बने रहे, जब तक फ़ारस के राज्य का शासन आरम्भ नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवक।” इब्रानी शब्द का अर्थ “सेवक” या “दास,” दोनों हो सकता है; यहाँ विजय और निर्वासन का प्रसंग बाध्य अधीनता की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  choice: बंदी बनाकर ... ले गया
  rationale: हिफ़ईल रूप का अर्थ जबरन निर्वासन में ले जाना है। यह अभिव्यक्ति निर्वासन और बलपूर्वक स्थानांतरण—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: הַשְּׁאֵרִית מִן הַחֶרֶב
  choice: तलवार से बचे हुए शेष लोगों
  rationale: הַשְּׁאֵרִית बचे हुए शेष समुदाय को और מִן הַחֶרֶב युद्ध में तलवार से बच निकलने को दर्शाता है।
- source_word: אֶל־בָּבֶל
  choice: बाबेल
  rationale: दिशासूचक אֶל को ‘ले गया’ के साथ स्वाभाविक हिन्दी वाक्य-रचना में व्यक्त किया गया है।
- source_word: לַעֲבָדִים
  choice: दास
  rationale: עֲבָדִים का अर्थ सेवक या दास हो सकता है; विजय, निर्वासन और अधीनता के इस प्रसंग में ‘दास’ बाध्य अधीनता को अधिक स्पष्ट करता है।
- source_word: עַד מְלֹךְ מַלְכוּת פָּרָס
  choice: जब तक फ़ारस का राज्य शासन करने न लगा
  rationale: מְלֹךְ शासन आरम्भ होने अथवा शासन करने को सूचित करता है। यह अनुवाद फ़ारसी राज्य के उदय को स्पष्ट रखते हुए इब्रानी की क्रियात्मक संरचना बचाता है।
theological_decisions:
- issue: विजय और निर्वासन के प्रसंग में עֲבָדִים की सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: शब्द दोनों अर्थ ग्रहण कर सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है; पर युद्ध में बचे लोगों के जबरन निर्वासन और राजवंश के अधीन किए जाने के कारण मुख्य पाठ में ‘दास’ अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘बाबेल’ मूल स्थान-नाम की पारंपरिक बाइबिलीय ध्वनि को बनाए रखता है; ‘बंदी बनाकर’ जबरन निर्वासन का भाव स्पष्ट करता है।
