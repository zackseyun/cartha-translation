source:
  edition: WLC
  text: וְ֠/גַם בַּ/מֶּ֤לֶךְ נְבֽוּכַדְנֶאצַּר֙ מָרָ֔ד אֲשֶׁ֥ר הִשְׁבִּיע֖/וֹ בֵּֽ/אלֹהִ֑ים וַ/יֶּ֤קֶשׁ אֶת עָרְפּ/וֹ֙ וַ/יְאַמֵּ֣ץ אֶת לְבָב֔/וֹ מִ/שּׁ֕וּב אֶל יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/036/013.yaml
  text: He also rebelled against King Nebuchadnezzar[a], who had made him swear by God; he stiffened his neck and hardened his heart from turning to Yahweh[b], the God of Israel.
translation:
  language: hi
  text: उसने राजा नबूकदनेस्सर के विरुद्ध भी विद्रोह किया, जिसने उसे परमेश्वर की शपथ दिलाई थी[a]। उसने अपनी गर्दन अकड़ा ली[b] और इस्राएल के परमेश्वर याहवे की ओर लौटने से अपना हृदय कठोर कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने उसे परमेश्वर के सामने शपथ से बाँधा था।” इब्रानी में किसी से परमेश्वर की शपथ दिलाने और परमेश्वर के सम्मुख शपथबद्ध करने—दोनों भाव सम्भव हैं।
    reason: lexical_alternative
  - marker: b
    text: “गर्दन अकड़ा लेना” एक इब्रानी मुहावरा है, जिसका अर्थ हठपूर्वक विरोध करना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह पिछले वर्णन में एक और अपराध जोड़ता है; हिन्दी में कर्ता के बाद ‘भी’ इसका स्वाभाविक समतुल्य है।
- source_word: בַּמֶּלֶךְ נְבוּכַדְנֶאצַּר מָרָד
  choice: राजा नबूकदनेस्सर के विरुद्ध विद्रोह किया
  rationale: מָרַד के साथ ב उस शासक को सूचित करता है जिसके विरुद्ध विद्रोह किया गया।
- source_word: אֲשֶׁר הִשְׁבִּיעוֹ בֵּאלֹהִים
  choice: जिसने उसे परमेश्वर की शपथ दिलाई थी
  rationale: שׁבע का हिफ़ील रूप किसी से शपथ लेने या उसे शपथ दिलाने को व्यक्त करता है; सापेक्ष उपवाक्य का कर्ता नबूकदनेस्सर है।
- source_word: וַיֶּקֶשׁ אֶת־עָרְפּוֹ
  choice: उसने अपनी गर्दन अकड़ा ली
  rationale: मूल शारीरिक रूपक को बनाए रखता है; सन्दर्भ में यह हठी प्रतिरोध का संकेत है।
- source_word: וַיְאַמֵּץ אֶת־לְבָבוֹ
  choice: अपना हृदय ऐसा कठोर कर लिया
  rationale: אָמֵץ सामान्यतः दृढ़ या बलवान करने का अर्थ दे सकता है, पर यहाँ पश्चात्ताप से इनकार के सन्दर्भ में हठपूर्वक कठोर करना अभिप्रेत है।
- source_word: מִשּׁוּב אֶל־יְהוָה
  choice: कि वह … याहवे की ओर न लौटे
  rationale: מִן के साथ infinitive लौटने से रुकने या उससे विमुख रहने का भाव देता है। स्वाभाविक हिन्दी में निषेधात्मक परिणाम/अभिप्राय व्यक्त किया गया है, बिना ‘लौटने’ के पश्चात्ताप-संबंधी रूपक को खोए।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: हृदय कठोर करने और न लौटने के बीच संबंध
  choice: ऐसा कठोर कर लिया कि वह … न लौटे
  alternative: लौटने से अपना हृदय कठोर कर लिया; ताकि वह … न लौटे
  rationale: מִן + infinitive रोक, अलगाव या विमुखता का भाव दे सकता है। हिन्दी रूप मूल संबंध को स्पष्ट करता है, पर इसे किसी विशेष सिद्धान्तगत व्याख्या में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सहज रखी गई है। ‘गर्दन अकड़ा ली’ और ‘हृदय कठोर कर लिया’ जैसे मूल रूपक सुरक्षित रखे गए हैं; पहले रूपक का अर्थ पादटिप्पणी में स्पष्ट किया गया है।
