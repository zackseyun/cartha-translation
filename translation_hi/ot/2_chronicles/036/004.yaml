  yaml_path: translation/ot/2_chronicles/036/004.yaml
  text: And the king of Egypt made Eliakim his brother king over Judah and Jerusalem[a], and changed his name to Jehoiakim. And Neco took his brother Jehoahaz and brought him to Egypt.
translation:
  language: hi
  text: मिस्र के राजा ने यहोआहाज के भाई एल्याकीम को यहूदा और यरूशलेम पर राजा बनाया और उसका नाम बदलकर यहोयाकीम रख दिया। और नको उसके भाई यहोआहाज को मिस्र ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: राजा बनाया
  rationale: 'מלך के हिफ़ील रूप का कारणवाचक अर्थ है: मिस्र के राजा ने एल्याकीम को राजपद पर स्थापित किया।'
- source_word: אֶלְיָקִים אָחִיו
  choice: यहोआहाज के भाई एल्याकीम
  rationale: सर्वनाम के संदर्भ को स्वाभाविक हिन्दी में स्पष्ट किया गया है; एल्याकीम यहोआहाज का भाई था।
- source_word: עַל יְהוּדָה וִירוּשָׁלַם
  choice: यहूदा और यरूशलेम पर
  rationale: עַל यहाँ उस क्षेत्र को दर्शाता है जिस पर उसे शासन के लिए नियुक्त किया गया।
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ יְהוֹיָקִים
  choice: उसका नाम बदलकर यहोयाकीम रख दिया
  rationale: हिब्रू मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप, जिसमें थोपा गया नाम-परिवर्तन बना रहता है।
- source_word: לָקַח
  choice: पकड़कर
  rationale: संदर्भ में नको यहोआहाज को अपने अधिकार में लेकर मिस्र ले गया; 'पकड़कर' इस बलपूर्वक हटाए जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיְבִיאֵהוּ מִצְרָיְמָה
  choice: मिस्र ले गया
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; हिन्दी में कर्ता की दृष्टि से 'ले गया' स्वाभाविक है।
- source_word: נְכוֹ
  choice: नको
  rationale: यह हिब्रू स्वरांकन के निकट हिन्दी लिप्यंतरण है; परंपरागत वैकल्पिक रूप पादटिप्पणी में दिया गया है।
