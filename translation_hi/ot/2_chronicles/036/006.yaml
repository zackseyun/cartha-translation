    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו עָלָה
  choice: उसके विरुद्ध चढ़ आया
  rationale: सैन्य प्रसंग में यह इब्रानी मुहावरा किसी के विरुद्ध आगे बढ़ने को व्यक्त करता है। यह अनुवाद दिशात्मक चित्र और शत्रुतापूर्ण आशय दोनों बनाए रखता है, बिना स्पष्ट रूप से ‘आक्रमण किया’ जोड़ने के।
- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह नाम हिंदी बाइबल परंपरा में प्रचलित और सामान्य पाठकों के लिए परिचित रूप में लिप्यंतरित किया गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: संबंधवाचक इब्रानी पदबंध नबूकदनेस्सर की राजकीय उपाधि बताता है; हिंदी में नाम से पहले यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: וַיַּאַסְרֵהוּ
  choice: उसे ... बाँध दिया
  rationale: क्रिया אָסַר का सीधा अर्थ बाँधना है और इसके बाद आने वाला साधन-वाचक पद काँसे के बंधनों को निर्दिष्ट करता है।
- source_word: בַּנְחֻשְׁתַּיִם
  choice: काँसे की बेड़ियों
  rationale: द्विवचन रूप काँसे के बंधनों या बेड़ियों का संकेत देता है। ‘बेड़ियाँ’ कैदी पर लगाए गए शारीरिक बंधन को स्वाभाविक आधुनिक हिंदी में स्पष्ट करता है; धातु के लिए ‘काँसा’ प्राचीन संदर्भ में उपयुक्त है।
- source_word: לְהֹלִיכוֹ
  choice: ताकि उसे ... ले जाए
  rationale: הלך के हिफ़ील रूप में किसी को चलाकर ले जाने का भाव है। प्रसंग में यह बंदी को बाबेल ले जाने का उद्देश्य व्यक्त करता है।
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक ה गंतव्य को दर्शाता है; हिंदी में ‘बाबेल ले जाए’ स्वाभाविक रूप से ‘बाबेल को/तक’ का अर्थ देता है।
