translation:
  language: hi
  text: बाबेल का राजा नबूकदनेस्सर उसके विरुद्ध चढ़ आया और उसे काँसे की बेड़ियों[a] से बाँध दिया, उसे बाबेल ले जाने के लिए।
  philosophy: optimal-equivalence
