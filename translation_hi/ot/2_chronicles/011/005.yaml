lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישׁב का अर्थ बैठना, रहना या बसना हो सकता है। इस कथात्मक संदर्भ में हिंदी का ‘रहने लगा’ स्वाभाविक है और यरूशलेम में उसके निवास को व्यक्त करता है; ‘बस गया’ स्थायी बसावट पर कुछ अधिक बल देता।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह स्थानसूचक पदबंध है; नाम का प्रचलित हिंदी रूप रखा गया है।
- source_word: וַיִּבֶן
  choice: बनाए
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है। सैनिक संदर्भ के बावजूद इसे सीधे ‘दृढ़ किया’ कहना क्रिया में निहित अर्थ से अधिक विशिष्ट होता।
- source_word: עָרִים
  choice: नगर
  rationale: עִיר के बहुवचन के लिए ‘नगर’ आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द है।
- source_word: לְמָצוֹר
  choice: रक्षा के लिए
  rationale: מָצוֹר यहाँ नगरों के रक्षात्मक उद्देश्य को बताता है और दुर्गीकरण, गढ़ अथवा घेराबंदी से संबंधित रक्षा का भाव रख सकता है। ‘रक्षा के लिए’ इस प्रयोजन को स्पष्ट रखते हुए किसी एक अधिक विशिष्ट अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: यह उन नगरों के निर्माण का क्षेत्र बताने वाला साधारण स्थानसूचक पदबंध है।
