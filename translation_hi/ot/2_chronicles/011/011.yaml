source:
  edition: WLC
  text: וַ/יְחַזֵּ֖ק אֶת הַ/מְּצֻר֑וֹת וַ/יִּתֵּ֤ן בָּ/הֶם֙ נְגִידִ֔ים וְ/אֹצְר֥וֹת מַאֲכָ֖ל וְ/שֶׁ֥מֶן וָ/יָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/011.yaml
  text: He strengthened the fortified places and put commanders in them[a], along with stores of food, oil[c][b], and wine.
translation:
  language: hi
  text: उसने किलेबंद स्थानों[a] को सुदृढ़ किया और उनमें अधिकारियों[b] को नियुक्त किया, तथा भोजन, तेल और दाखमधु के भंडार[c] रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुर्गों’ अथवा ‘गढ़ों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अगुओं,’ ‘शासकों’ अथवा ‘सेनापतियों’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी शब्द का अर्थ ‘भंडारगृह’ या उनमें संचित सामग्री—दोनों हो सकता है; यहाँ आशय सुरक्षित रखी गई रसद से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: सुदृढ़ किया
  rationale: חזק के पिएल रूप में किसी वस्तु को मजबूत या सुरक्षित करने का भाव है। ‘सुदृढ़ किया’ इस क्रिया को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַמְּצֻרוֹת
  choice: किलेबंद स्थानों
  rationale: यह संज्ञा किलेबंद स्थलों, दुर्गों या गढ़ों को सूचित कर सकती है। ‘किलेबंद स्थान’ इसके व्यापक अर्थ को बनाए रखता है और हर स्थल को अनिवार्यतः बड़ा दुर्ग नहीं मानता।
- source_word: וַיִּתֵּן בָּהֶם
  choice: उनमें ... नियुक्त किए / वहाँ ... रखे
  rationale: נתן के साथ ב यहाँ उन स्थानों के भीतर अधिकारियों और सामग्री को रखने का भाव देता है। व्यक्तियों के लिए ‘नियुक्त किए’ और वस्तुओं के लिए ‘रखे’ स्वाभाविक हिन्दी है, जबकि स्थानवाचक अर्थ सुरक्षित रहता है।
- source_word: נְגִידִים
  choice: सेनापति
  rationale: נָגִיד का अर्थ अगुआ, शासक या अधिकारी हो सकता है। किलेबंदी और सैन्य व्यवस्था के इस प्रसंग में ‘सेनापति’ उपयुक्त है, यद्यपि मूल शब्द का अर्थ इससे व्यापक हो सकता है।
- source_word: וְאֹצְרוֹת
  choice: भंडार
  rationale: אֹצָרוֹת भंडारगृहों या संचित सामग्री—दोनों को सूचित कर सकता है। यहाँ खाद्य पदार्थों के संदर्भ में ‘भंडार’ हिन्दी में दोनों संभावनाओं के निकट रहता है।
- source_word: מַאֲכָל
  choice: भोजन
  rationale: यह भोजन या खाद्य-सामग्री के लिए सामान्य शब्द है; संचय का भाव ‘भंडार’ से स्पष्ट होता है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: यह שֶׁמֶן का सामान्य और सीधा हिन्दी अर्थ है; प्रसंग में संभवतः जैतून का तेल है, पर मूल पाठ उसे विशेष रूप से नहीं कहता।
- source_word: יָיִן
  choice: दाखमधु
  rationale: यह יָיִן के अर्थ को स्पष्ट रूप से व्यक्त करता है और बाइबिलीय प्रसंग के लिए गरिमापूर्ण, प्रचलित हिन्दी शब्द है।
