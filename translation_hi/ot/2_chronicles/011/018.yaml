base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/018.yaml
  text: Rehoboam took as wife Mahalath the daughter of Jerimoth son of David[a], and Abihail the daughter of Eliab son of Jesse.
translation:
  language: hi
  text: रहूबियाम ने महलत को पत्नी के रूप में ग्रहण किया। महलत दाऊद के पुत्र यरीमोत और अबीहैल की बेटी थी; अबीहैल यिशै के पुत्र एलीआब की बेटी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वंशावली यहाँ अत्यन्त संक्षिप्त और व्याकरण की दृष्टि से कठिन है। महलत के नाम के बाद इब्रानी में पुल्लिंग “पुत्र” आता है: शब्दों का क्रम लगभग है, “महलत, पुत्र यरीमोत, पुत्र दाऊद, अबीहैल, बेटी एलीआब, पुत्र यिशै।” सम्भवतः आशय यह है कि महलत यरीमोत और अबीहैल की बेटी थी। कुछ व्याख्याकार अबीहैल को इसी वंश-सूचना में किसी दूसरे नाम के रूप में, या कम सम्भावना से रहूबियाम की दूसरी पत्नी के रूप में समझते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח לוֹ ... אִשָּׁה
  choice: अपनी पत्नी बनाया
  rationale: यह इब्रानी विवाह-सूचक मुहावरे ‘अपने लिए स्त्री/पत्नी लेना’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; इससे वैवाहिक अर्थ स्पष्ट रहता है।
- source_word: מָחֲלַת
  choice: महलत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בן יְרִימוֹת בֶּן דָּוִיד
  choice: दाऊद के पुत्र यरीमोत ... की बेटी
  rationale: मसोरेटिक पाठ में महलत के बाद ‘पुत्र’ है, जो स्त्री के नाम के साथ व्याकरण की दृष्टि से कठिन है। वंशावली के आशय को स्पष्ट करने के लिए महलत को यरीमोत की बेटी माना गया है, जबकि पाठगत कठिनाई पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲבִיהַיִל בַּת אֱלִיאָב בֶּן יִשָׁי
  choice: यिशै के पुत्र एलीआब की बेटी अबीहैल
  rationale: इब्रानी वंशसूत्र को स्वाभाविक हिन्दी क्रम में रखा गया है और अबीहैल को महलत की मातृवंशीय पहचान के रूप में समझा गया है।
theological_decisions:
- issue: वंशावली में महलत, यरीमोत और अबीहैल का वाक्यगत संबंध
  choice: महलत को यरीमोत और अबीहैल की बेटी माना गया है; अबीहैल एलीआब की बेटी थी।
  alternative: अबीहैल महलत का दूसरा नाम या उसी सूचना में उल्लिखित दूसरी पत्नी हो सकती है; अथवा कठिन इब्रानी को बिना संबंध स्पष्ट किए ज्यों का त्यों रखा जा सकता है।
  rationale: वचन में ‘पत्नी’ एकवचन है और इतिहासवृत्तांत की संक्षिप्त वंशावली शैली दोनों पैतृक और मातृक वंशों के उल्लेख की अनुमति देती है। फिर भी इब्रानी रचना असामान्य है, इसलिए अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘अपनी पत्नी बनाया’ मूल इब्रानी मुहावरे के निकट रहते हुए सामान्य पाठक के लिए सहज है। कठिन वंश-संबंध को मुख्य पाठ में पठनीय बनाया गया है, पर मूल की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
