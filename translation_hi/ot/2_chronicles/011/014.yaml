base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/014.yaml
  text: For the Levites left their pasturelands and their possessions and went to Judah and Jerusalem[b][a], because Jeroboam and his sons had rejected them from serving as priests to Yahweh.
translation:
  language: hi
  text: क्योंकि लेवियों ने अपने चरागाहों[a] और अपनी संपत्ति को छोड़ दिया और यहूदा और यरूशलेम चले गए, क्योंकि यारोबाम और उसके पुत्रों ने उन्हें यहोवा के लिए याजकों के रूप में सेवा करने से रोक दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने नगरों से लगी खुली भूमियों।” इब्रानी शब्द उन नगरों से लगी खुली भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁיהֶם
  choice: अपनी चरागाहों
  rationale: מִגְרָשׁ लेवीय नगरों से लगी खुली भूमि को दर्शाता है, जो विशेषतः पशु चराने के काम आती थी। ‘चरागाहें’ इस भूमि-उपयोग को सहज और ठोस हिंदी में व्यक्त करता है।
- source_word: אֲחֻזָּתָם
  choice: अपनी संपत्ति
  rationale: אֲחֻזָּה अधिकार में आई भूमि अथवा स्थायी मिल्कियत को दर्शाता है। ‘संपत्ति’ स्वाभाविक हिंदी है और इसे अनावश्यक रूप से ‘विरासत’ के रूप में सीमित नहीं करता।
- source_word: וַיֵּלְכוּ לִיהוּדָה וְלִירוּשָׁלִָם
  choice: यहूदा और यरूशलेम चले गए थे
  rationale: הלך के साथ ל गंतव्य की ओर जाने को बताता है। हिंदी के प्रसंग में ‘चले गए थे’ पूर्ववर्ती कारणात्मक विवरण से संबंध भी स्पष्ट करता है।
- source_word: הִזְנִיחָם
  choice: उन्हें ... हटा दिया था
  rationale: זנח के हिफ़ील रूप में अस्वीकार करने, अलग करने या पद से हटाने का भाव है। अगले מִכַּהֵן के साथ ‘हटा दिया’ संस्थागत बहिष्कार को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מִכַּהֵן
  choice: याजकों के रूप में सेवा करने से
  rationale: מן के साथ כהן का धात्विक infinitive याजकीय सेवा से रोके या हटाए जाने को व्यक्त करता है। यह अनुवाद भूमिका और कार्य दोनों को स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: כהן के साथ ל सेवा के संबंध या लाभार्थी को दर्शाता है। ‘यहोवा के लिए’ हिंदी में स्वाभाविक है और दिव्य नाम को नाम के रूप में बनाए रखता है।
- source_word: כִּי ... כִּי
  choice: क्योंकि ... क्योंकि
  rationale: पहला כִּי पिछले कथन का कारण बताता है और दूसरा लेवियों के चले जाने का कारण। दोहराव मूल की तर्क-संरचना को सुरक्षित रखता है और हिंदी में बोधगम्य है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में टेट्राग्राम יהוה प्रत्यक्ष रूप से आया है। हिंदी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला व्यक्तिनाम है; इसे ‘प्रभु’ बनाने से मूल के नाम और उपाधि का भेद मिट जाता। उच्चारण की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी संभव है।
- issue: हटा दिए जाने की प्रकृति
  choice: याजकों के रूप में सेवा करने से हटा दिया
  alternative: याजकीय सेवा करने से रोक दिया
  rationale: הִזְנִיחָם מִכַּהֵן व्यक्तिगत अस्वीकृति और याजकीय कार्य से संस्थागत बहिष्कार दोनों का संकेत दे सकता है। चुना हुआ रूप पद/सेवा से हटाने का भाव रखता है, बिना यह तय किए कि रोक केवल कानूनी थी या व्यावहारिक।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘लेवीय’ और ‘याजक’ प्रचलित बाइबलीय पद हैं। दोनों कारणसूचक כִּי को बनाए रखकर मूल वाक्य की व्याख्यात्मक संरचना सुरक्षित की गई है।
