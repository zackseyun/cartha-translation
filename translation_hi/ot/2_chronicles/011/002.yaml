  yaml_path: translation/ot/2_chronicles/011/002.yaml
  text: And the word of Yahweh came to Shemaiah the man of God, saying,
translation:
  language: hi
  text: 'तब यहोवा का वचन परमेश्वर का जन शमायाह के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: यह कथात्मक क्रम में अगली घटना प्रस्तुत करता है। हिंदी में ‘तब’ स्वाभाविक संक्रमण देता है और पिछले पद की परिस्थिति में आए ईश्वरीय हस्तक्षेप को स्पष्ट रखता है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह प्रचलित नबी-संबंधी सूत्रवाक्य और इब्रानी संबंध-रचना दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: אֶל
  choice: के पास
  rationale: यह वचन के प्राप्तकर्ता की ओर गति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁמַעְיָהוּ
  choice: शमायाह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह नबी-सदृश व्यक्ति की स्थापित उपाधि को गरिमापूर्ण और स्वाभाविक हिंदी में व्यक्त करता है; ‘जन’ यहाँ किसी समूह के बजाय व्यक्ति को सूचित करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: प्रत्यक्ष कथन की भूमिका को हिंदी में द्विबिंदु स्वाभाविक रूप से व्यक्त करता है; अगले पद में कथन आरंभ होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत नाम सुरक्षित रखा गया है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘यहोवा’ अधिक व्यापक रूप से पहचाना जाता है, यद्यपि ‘याहवे’ संभावित उच्चारण के अधिक निकट माना जाता है।
- issue: אִישׁ הָאֱלֹהִים की उपाधि
  choice: परमेश्वर के जन
  alternative: परमेश्वर का जन
  rationale: संबंधकारक बहुवचन-जैसा रूप ‘के’ हिंदी में सम्मानसूचक एकवचन व्यक्ति के साथ स्वाभाविक है और इसे एक स्थापित धार्मिक उपाधि के रूप में रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण कथात्मक शैली। अगले पद में आने वाले प्रत्यक्ष कथन के कारण ‘कहते हुए’ जैसे कृत्रिम पदबंध के स्थान पर द्विबिंदु रखा गया है।
