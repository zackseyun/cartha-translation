base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/016.yaml
  text: And after them[a], from all the tribes of Israel, those who set their hearts to seek Yahweh, the God of Israel, came to Jerusalem to sacrifice to Yahweh[b], the God of their fathers.
translation:
  language: hi
  text: और उनके पीछे इस्राएल के सभी गोत्रों में से वे लोग, जिन्होंने याहवे, इस्राएल के परमेश्वर, की खोज करने के लिए अपना मन लगाया था[a], यरूशलेम आए[b], ताकि याहवे, अपने पितरों के परमेश्वर, को बलिदान चढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपना हृदय देने वाले’; यह मुहावरा याहवे की खोज के लिए मन लगाने या दृढ़ संकल्प करने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यरूशलेम गए।’ इब्रानी क्रिया का अनुवाद कथा की दृष्टि के अनुसार ‘आए’ या ‘गए’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵיהֶם
  choice: और उनके पीछे
  rationale: वाव के संयोजक भाव और אַחֲרֵי के क्रमसूचक अर्थ को बनाए रखता है तथा पिछले पद में वर्णित लोगों की ओर संकेत करता है।
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: מִן के स्रोत-सूचक अर्थ और सभी गोत्रों को समेटने वाले व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַנֹּתְנִים אֶת לְבָבָם
  choice: जिन्होंने ... अपना मन लगाया था
  rationale: शाब्दिक अर्थ ‘अपना हृदय देने वाले’ है; हिन्दी मुहावरे में ‘मन लगाना’ किसी उद्देश्य की ओर दृढ़ आंतरिक संकल्प को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבַקֵּשׁ
  choice: खोज करने में
  rationale: धार्मिक संदर्भ में इसका अर्थ परमेश्वर को जानने, उसकी ओर मुड़ने और उसकी इच्छा पर चलने के उद्देश्य से उसे खोजना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धसूचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בָּאוּ יְרוּשָׁלִַם
  choice: यरूशलेम आए
  rationale: בוא का अर्थ कथन-दृष्टि के अनुसार ‘आना’ या ‘जाना’ हो सकता है; यहाँ यरूशलेम को कथा का केंद्र मानकर ‘आए’ चुना गया है, और विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִזְבּוֹחַ
  choice: बलिदान चढ़ाने के लिए
  rationale: उद्देश्यसूचक infinitive और बलिदान अर्पित करने की क्रिया को प्रचलित हिन्दी धार्मिक भाषा में स्पष्ट करता है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पुरखाओं के परमेश्वर
  rationale: אָבוֹת के पुरुषवाची पूर्वज-संदर्भ और वाचा-सूचक पारंपरिक अभिव्यक्ति को ‘पुरखाओं’ द्वारा स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना निकट लिप्यंतरण में सुरक्षित रखता है।
- issue: אֱלֹהֵי אֲבוֹתֵיהֶם में पुरुषवाची वाचा-सूत्र
  choice: अपने पुरखाओं के परमेश्वर
  alternative: अपने पूर्वजों के परमेश्वर; अपने पितरों के परमेश्वर
  rationale: ‘पुरखाओं’ से मूल का पुरुषवाची और पैतृक भाव बना रहता है, जबकि आधुनिक हिन्दी में वाक्य सहज भी रहता है।
- issue: परमेश्वर को ‘खोजने’ का धार्मिक भाव
  choice: याहवे की खोज करने में अपना मन लगाया
  alternative: याहवे को ढूँढ़ने लगे; याहवे के प्रति अपना हृदय समर्पित किया
  rationale: यह रूप खोज और आंतरिक संकल्प—दोनों को रखता है, पर खोज को केवल भौतिक तलाश या समर्पण को पूर्णतः व्याख्यायित धर्मशास्त्रीय कथन नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘गोत्र’, ‘बलिदान’ और ‘पुरखा’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं। लंबे इब्रानी वाक्य की संरचना को यथासंभव सुरक्षित रखते हुए हिन्दी के लिए स्पष्ट क्रम दिया गया है।
