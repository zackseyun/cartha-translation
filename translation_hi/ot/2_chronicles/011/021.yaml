base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/021.yaml
  text: Rehoboam loved Maacah the daughter of Absalom more than all his wives and his concubines[a], for he had taken eighteen wives and sixty concubines, and he fathered twenty-eight sons and sixty daughters.
translation:
  language: hi
  text: रहूबियाम माका को, जो अबशालोम की बेटी[a] थी, अपनी सभी पत्नियों और उपपत्नियों से अधिक प्रेम करता था, क्योंकि उसने अठारह पत्नियों से विवाह किया था और साठ उपपत्नियाँ रखी थीं। वह अट्ठाईस बेटों और साठ बेटियों का पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “अबशालोम की वंशज”; वंशावली के संदर्भों में इब्रानी शब्द “बेटी” कभी-कभी अधिक व्यापक अर्थ में भी प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: प्रेम करता था
  rationale: אהב प्रेम या स्नेह को व्यक्त करता है; इसके बाद आने वाला מִכָּל तुलनात्मक अर्थ ‘से अधिक’ देता है।
- source_word: בַת אַבְשָׁלוֹם
  choice: अबशालोम की बेटी
  rationale: בַת का सामान्य और सीधा अर्थ ‘बेटी’ है। वंशावली के संदर्भ में इसके व्यापक अर्थ की संभावना को पादटिप्पणी में रखा गया है।
- source_word: מִכָּל נָשָׁיו וּפִילַגְשָׁיו
  choice: अपनी सभी पत्नियों और उपपत्नियों से अधिक
  rationale: מִכָּל यहाँ तुलना व्यक्त करता है। ‘पत्नियाँ’ और ‘उपपत्नियाँ’ मूल पाठ में मौजूद दो अलग सामाजिक श्रेणियों को बनाए रखते हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए व्याख्यात्मक पृष्ठभूमि प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָשִׁים ... נָשָׂא
  choice: अठारह पत्नियाँ ... रखी थीं
  rationale: नָשָׂא और נָשִׁים का मेल पत्नियाँ ग्रहण करने का अर्थ देता है। ‘रखी थीं’ बहुविवाह के इस विवरण में स्वाभाविक हिन्दी है और पूर्ववर्ती परिस्थिति को भी दर्शाता है।
- source_word: פִּילַגְשִׁים
  choice: उपपत्नियाँ
  rationale: यह शब्द मुख्य पत्नियों से अलग द्वितीयक वैवाहिक श्रेणी को सूचित करता है। ‘उपपत्नियाँ’ अर्थभेद को बनाए रखते हुए गरिमापूर्ण है।
- source_word: וַיּוֹלֶד
  choice: वह ... का पिता बना
  rationale: पुरुष कर्ता के साथ यह क्रिया संतान उत्पन्न करने या उनका पिता होने का भाव देती है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और ‘जन्म दिया’ से उत्पन्न असंगति से बचता है।
- source_word: עֶשְׂרִים וּשְׁמוֹנָה בָּנִים וְשִׁשִּׁים בָּנוֹת
  choice: अट्ठाईस बेटों और साठ बेटियों
  rationale: संख्याएँ और संतान के लिंग मूल पाठ के अनुसार सीधे और स्पष्ट रूप से प्रस्तुत किए गए हैं।
theological_decisions:
- issue: माका को ‘अबशालोम की बेटी’ कहना
  choice: मुख्य पाठ में इब्रानी का सीधा अर्थ ‘अबशालोम की बेटी’ रखा गया
  alternative: ‘अबशालोम की वंशज’ या विशेष रूप से ‘पोती’ समझना
  rationale: वंशावली में ‘बेटी’ कभी-कभी व्यापक वंश-संबंध बता सकता है, पर मूल पद स्वयं ‘बेटी’ कहता है। इसलिए मुख्य पाठ संभावित व्यापक अर्थ को निर्णायक रूप से नहीं अपनाता; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य अपनाया गया है। ‘उपपत्नियाँ’ सामाजिक भेद को स्पष्ट रखता है और अधिक अपमानसूचक विकल्प से बचता है। नामों के रूप ‘रहूबियाम’, ‘अबशालोम’ और ‘माका’ हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
