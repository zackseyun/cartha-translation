  to: इस प्रकार उन्होंने यहूदा के राज्य को सुदृढ़ किया और तीन वर्षों तक सुलैमान के पुत्र रहूबियाम को मज़बूत बनाया[a], क्योंकि तीन वर्षों तक वे दाऊद और सुलैमान के मार्ग पर चले।
