id: 2CH.11.17
reference: 2 Chronicles 11:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יְחַזְּקוּ֙ אֶת מַלְכ֣וּת יְהוּדָ֔ה וַֽ/יְאַמְּצ֛וּ אֶת רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה לְ/שָׁנִ֣ים שָׁל֑וֹשׁ כִּ֣י הָֽלְכ֗וּ בְּ/דֶ֧רֶךְ דָּוִ֛יד וּ/שְׁלֹמֹ֖ה לְ/שָׁנִ֥ים שָׁלֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/017.yaml
  text: So they strengthened the kingdom of Judah and strengthened Rehoboam son of Solomon for three years[a], because for three years they walked in the way of David and Solomon.
translation:
  language: hi
  text: इस प्रकार उन्होंने यहूदा के राज्य को सुदृढ़ किया और तीन वर्षों तक सुलैमान के पुत्र रहूबियाम को मज़बूत बनाया[a], क्योंकि तीन वर्षों तक वे दाऊद और सुलैमान के मार्ग पर चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रहूबियाम को सुदृढ़ किया।”
    reason: इब्रानी क्रिया אמצ का अर्थ किसी को मज़बूत बनाना या सुदृढ़ करना हो सकता है।
lexical_decisions:
- source_word: וַיְחַזְּקוּ
  choice: दृढ़ किया
  rationale: חזק के पिएल रूप का अर्थ किसी वस्तु को मजबूत या स्थिर करना है। यहाँ राज्य के सुदृढ़ होने का भाव है; सैन्य किलेबंदी का अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: מַלְכוּת יְהוּדָה
  choice: यहूदा के राज्य
  rationale: מַלְכוּת का अर्थ राजत्व या राज्य हो सकता है। इस प्रसंग में यहूदा की राजनीतिक सत्ता और राज्य-व्यवस्था अभिप्रेत है।
- source_word: וַיְאַמְּצוּ
  choice: बल दिया
  rationale: אמץ के पिएल रूप में बल देने, दृढ़ करने या समर्थ बनाने का भाव है। रहूबियाम इसका प्रत्यक्ष कर्म है; ‘बल दिया’ स्वाभाविक हिन्दी में अर्थ को रखता है और पहले प्रयुक्त ‘दृढ़ किया’ से शब्दगत भिन्नता भी बनाए रखता है।
- source_word: רְחַבְעָם בֶּן שְׁלֹמֹה
  choice: सुलैमान के पुत्र रहूबियाम
  rationale: हिन्दी की स्वाभाविक संबंध-संरचना अपनाते हुए वंश-संबंध को स्पष्ट और संक्षिप्त रखा गया है।
- source_word: לְשָׁנִים שָׁלוֹשׁ
  choice: तीन वर्ष तक
  rationale: कालावधि व्यक्त करने वाले לְ का स्वाभाविक हिन्दी रूप है। इब्रानी में यह वाक्यांश दो बार आया है, इसलिए दोनों बार रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָלְכוּ בְּדֶרֶךְ
  choice: मार्ग पर चलते रहे
  rationale: यह आचरण के लिए प्रयुक्त इब्रानी रूपक है। हिन्दी में भी यह बोधगम्य है, इसलिए इसे ‘जीवन बिताया’ या ‘अनुसरण किया’ कहकर पूरी तरह व्याख्यायित नहीं किया गया।
- source_word: דָּוִיד וּשְׁלֹמֹה
  choice: दाऊद और सुलैमान
  rationale: प्रचलित हिन्दी बाइबलीय नाम-रूपों का प्रयोग किया गया है।
theological_decisions:
- issue: ‘दाऊद और सुलैमान के मार्ग’ का मूल्यांकन
  choice: मूल रूपक को ज्यों का त्यों रखते हुए उसे केवल उल्लिखित तीन वर्षों तक सीमित रखा गया है।
  alternative: ‘वे यहोवा के प्रति वैसे ही विश्वासयोग्य रहे जैसे दाऊद और सुलैमान थे’ जैसी व्याख्यात्मक भाषा।
  rationale: मूल पाठ उस अवधि के आचरण का सकारात्मक वर्णन करता है, पर पूर्ण जीवन, निष्पापता या व्यापक धार्मिक निष्ठा का दावा नहीं करता। व्याख्यात्मक विस्तार से अनावश्यक धर्मवैज्ञानिक निष्कर्ष जुड़ सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘मार्ग पर चलते रहे’ बाइबलीय रूपक को संरक्षित करता है, जबकि ‘बल दिया’ व्यक्ति के संबंध में स्वाभाविक हिन्दी है।
