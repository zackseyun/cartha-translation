  revision_rationale: The revision replaces the non-idiomatic “बल दिया” with “मज़बूत बनाया,” which directly and naturally represents the causative sense of אמצ with Rehoboam as its object. “सुदृढ़ किया” is retained for strengthening the kingdom, and the repeated three-year duration, causal clause, and “way” metaphor are preserved.
