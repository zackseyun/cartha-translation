  text: और सोरा, अय्यालोन और हेब्रोन भी, जो यहूदा और बिन्यामीन में थे, गढ़वाले नगर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָרְעָה
  choice: सोरा
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אַיָּלוֹן
  choice: अय्यालोन
  rationale: इब्रानी उच्चारण के निकट और हिन्दी में सहज स्थान-नाम लिप्यंतरण।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֲשֶׁר בִּיהוּדָה וּבְבִנְיָמִן
  choice: जो यहूदा और बिन्यामीन में
  rationale: सम्बन्धवाचक उपवाक्य और भौगोलिक स्थिति को बिना स्वामित्व का भाव जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָרֵי מְצֻרוֹת
  choice: गढ़वाले नगर
  rationale: किलेबंदी से सुरक्षित नगरों का स्पष्ट और सामान्य हिन्दी वर्णन; यह निष्कर्षात्मक पद सूचीबद्ध नगरों की विशेषता बताता है।
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: और ... और ... को भी
  rationale: यह पिछले पद से चली आ रही कर्म-सूची है; हिन्दी में अंतिम 'को भी' सभी नामों पर लागू होकर निरंतरता और कर्मचिह्न दोनों व्यक्त करता है।
