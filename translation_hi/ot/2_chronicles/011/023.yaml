base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/023.yaml
  text: And he acted wisely and distributed some of all his sons throughout all the lands of Judah and Benjamin[a], to all the fortified cities[c][b]; and he gave them abundant provisions and sought many wives for them.
translation:
  language: hi
  text: उसने समझ-बूझ से काम लिया[a] और अपने बेटों में से कुछ को यहूदा और बिन्यामीन के सारे इलाकों के सभी किलेबंद नगरों में तैनात कर दिया[b]। उसने उन्हें भरपूर भोजन-सामग्री दी और बहुत-सी पत्नियों की खोज की[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने बुद्धिमानी से काम लिया” अथवा “उसने विवेक दिखाया।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया का अर्थ यहाँ संभवतः यह है कि उसने अपने कुछ बेटों को अलग-अलग किलेबंद नगरों में फैलाकर नियुक्त किया।
    reason: lexical_alternative
  - marker: c
    text: संभवतः आशय है कि उसने अपने बेटों के लिए बहुत-सी पत्नियाँ खोजीं, अर्थात् उनके विवाह की व्यवस्था की। हिब्रू में “उनके लिए” स्पष्ट रूप से नहीं है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֶן
  choice: उसने समझ-बूझ से काम लिया
  rationale: בין के इस रूप का भाव केवल किसी बात को समझना नहीं, बल्कि सूझ-बूझ अथवा विवेक दिखाना है। राजकीय व्यवस्था के इस संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: וַיִּפְרֹץ מִכָּל בָּנָיו
  choice: अपने बेटों में से कुछ को ... तैनात कर दिया
  rationale: פרץ यहाँ स्थानों में फैलाने या बाँटकर रखने का भाव देता है। מן का अंशसूचक भाव ‘में से कुछ’ द्वारा व्यक्त किया गया है; अगले स्थानवाचक पदों के कारण जानबूझकर विभिन्न नगरों में नियुक्त करने का अर्थ संदर्भानुकूल है।
- source_word: לְכָל אַרְצוֹת יְהוּדָה וּבִנְיָמִן
  choice: यहूदा और बिन्यामीन के सारे इलाकों
  rationale: אֲרָצוֹת यहाँ अलग-अलग देशों के बजाय इन क्षेत्रों के भूभागों या प्रशासनिक इलाकों को दर्शाता है।
- source_word: לְכֹל עָרֵי הַמְּצֻרוֹת
  choice: सभी किलेबंद नगरों में
  rationale: מְצֻרוֹת सुदृढ़ या किलेबंद नगरों का बोध कराता है। हिन्दी में गंतव्य/नियुक्ति के साथ ‘नगरों में’ स्वाभाविक है।
- source_word: וַיִּתֵּן לָהֶם הַמָּזוֹן לָרֹב
  choice: उसने उन्हें भरपूर भोजन-सामग्री दी
  rationale: מָזוֹן भोजन अथवा जीवन-निर्वाह की सामग्री है और לָרֹב उसकी प्रचुरता बताता है।
- source_word: וַיִּשְׁאַל הֲמוֹן נָשִׁים
  choice: बहुत-सी पत्नियाँ ढूँढ़ीं
  rationale: שׁאל का मूल भाव माँगना, खोजना या प्राप्त करने का प्रयास करना है। मूल पाठ में ‘उनके लिए’ स्पष्ट रूप से नहीं है, इसलिए मुख्य पाठ में संबंध को अनिर्धारित रखा गया है; संदर्भ में बेटों के विवाह कराने की संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: बहुत-सी पत्नियों का संबंध किससे है
  choice: मुख्य पाठ में केवल ‘बहुत-सी पत्नियाँ ढूँढ़ीं’
  alternative: ‘अपने बेटों के लिए बहुत-सी पत्नियाँ ढूँढ़ीं’
  rationale: हिब्रू वाक्य में ‘उनके लिए’ नहीं है। यद्यपि निकट संदर्भ बेटों के लिए विवाह कराने की ओर संकेत कर सकता है, उसे मुख्य पाठ में जोड़ना अस्पष्टता को समाप्त कर देता; इसलिए संभावित आशय पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य रखा गया है। ‘समझ-बूझ’, ‘इलाके’, ‘किलेबंद नगर’ और ‘भोजन-सामग्री’ सामान्य पाठक के लिए स्पष्ट हैं। हिब्रू की अंतिम पंक्ति में निहित संदर्भगत अस्पष्टता को मुख्य पाठ में बनाए रखा गया है।
