  text: וַ/יַּֽעֲמֵ֨ד לָ/רֹ֧אשׁ רְחַבְעָ֛ם אֶת אֲבִיָּ֥ה בֶֽן מַעֲכָ֖ה לְ/נָגִ֣יד בְּ/אֶחָ֑י/ו כִּ֖י לְ/הַמְלִיכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/022.yaml
  text: And Rehoboam appointed Abijah son of Maacah as chief among his brothers[a], for he intended to make him king.
translation:
  language: hi
  text: रहूबियाम ने माका के पुत्र अबिय्याह को उसके भाइयों में[a] प्रधान और अगुवा नियुक्त किया, क्योंकि वह उसे राजा बनाना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके भाइयों के ऊपर’; हिब्रू संबंधसूचक शब्द भाइयों के बीच उसके प्रमुख स्थान अथवा उन पर उसकी पद-श्रेष्ठता—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किया
  rationale: עמד के हिफ़ील रूप का यहाँ अर्थ किसी व्यक्ति को पद पर स्थापित करना है; ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: לָרֹאשׁ
  choice: प्रधान
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर नेतृत्व के प्रसंग में यह सर्वोच्च या प्रमुख स्थान को दर्शाता है; ‘प्रधान’ उस पद-श्रेष्ठता को स्पष्ट करता है।
- source_word: אֶת אֲבִיָּה בֶן מַעֲכָה
  choice: माका के पुत्र अबिय्याह को
  rationale: हिब्रू की पुत्र-संबंधी रचना को स्वाभाविक हिन्दी क्रम में रखा गया है और व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: לְנָגִיד
  choice: अगुवा
  rationale: נָגִיד अधिकारयुक्त नेता या शासक के लिए प्रयुक्त होता है। ‘अगुवा’ सामान्य पाठक के लिए सुबोध है और यहाँ राजपुत्र होने के बजाय नियुक्त नेतृत्व-पद पर बल देता है।
- source_word: בְּאֶחָיו
  choice: उसके भाइयों में
  rationale: בְּ समूह के भीतर प्रमुख स्थान या उसके सदस्यों के संबंध में श्रेष्ठता व्यक्त कर सकता है। ‘भाइयों में’ मूल की संभावित सामूहिक अर्थछाया बनाए रखता है; ‘भाइयों के ऊपर’ को पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ रहूबियाम के कार्य का कारण बताता है; ‘क्योंकि’ समकालीन हिन्दी में स्पष्ट है।
- source_word: לְהַמְלִיכוֹ
  choice: वह उसे राजा बनाना चाहता था
  rationale: לְ के साथ हिफ़ील क्रियार्थक संज्ञा उद्देश्य या अभिप्राय बताती है। प्रसंग में ‘राजा बनाना चाहता था’ इस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
