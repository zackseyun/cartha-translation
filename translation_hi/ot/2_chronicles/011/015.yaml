base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/015.yaml
  text: And he appointed for himself priests for the high places[a], for the goat-demons, and for the calves that he had made.
translation:
  language: hi
  text: उसने अपने लिए ऊँचे उपासना-स्थलों, बकरे-जैसी दुष्टात्माओं और अपने बनाए हुए बछड़ों के लिए पुरोहित नियुक्त किए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֶד
  choice: नियुक्त किए
  rationale: हिफ़ील रूप यहाँ पुरोहितों को पद पर ठहराने या नियुक्त करने का अर्थ देता है, केवल खड़ा करने का नहीं।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: हितसूचक सर्वनाम का आत्मवाचक भाव स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि यह व्यवस्था उसने स्वयं अपने उद्देश्य से की।
- source_word: כֹּהֲנִים
  choice: पुरोहित
  rationale: उपासना-संबंधी पद के लिए आधुनिक और प्रतिष्ठित हिन्दी शब्द।
- source_word: לַבָּמוֹת
  choice: पूजा-स्थलों के लिए
  rationale: במות से ऊँचे स्थानों पर बने उपासना-स्थल अभिप्रेत हैं; केवल 'ऊँचे स्थान' सामान्य पाठक को भौगोलिक अर्थ दे सकता है, इसलिए कार्यगत अर्थ स्पष्ट किया गया है।
- source_word: לַשְּׂעִירִים
  choice: बकरे-जैसे दुष्टात्माओं
  rationale: इस उपासना-संदर्भ में शब्द साधारण बकरों से अधिक सम्भवतः बकरे के रूप से जुड़े अलौकिक या मूर्तिपूजक प्राणियों को दर्शाता है; 'बकरे-जैसे' मूल बिंब को बनाए रखता है।
- source_word: וְלָעֲגָלִים
  choice: और ... बछड़ों के लिए
  rationale: मूल का साधारण संज्ञा-रूप रखा गया है; प्रसंग से स्पष्ट है कि ये उपासना के लिए बनाई गई प्रतिमाएँ थीं।
- source_word: אֲשֶׁר עָשָׂה
  choice: अपने बनाए हुए
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी कृदन्त-रचना में व्यक्त किया गया है और कर्ता का सम्बन्ध स्पष्ट रखा गया है।
theological_decisions:
- issue: मूर्तिपूजक उपासना के संदर्भ में שְׂעִירִים का अर्थ
  choice: बकरे-जैसे दुष्टात्माओं
  alternative: बकरों; बकरे-जैसे प्राणियों
  rationale: सूची में अवैध पूजा-स्थल और बनाए हुए बछड़े हैं, इसलिए यहाँ साधारण पशुओं के बजाय बकरे-जैसे अलौकिक या पूजित प्राणी अधिक सम्भावित हैं। फिर भी पादटिप्पणी शब्द की वास्तविक अर्थगत अनिश्चितता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'पुरोहित नियुक्त किए' पदस्थापन का भाव स्पष्ट करता है। 'पूजा-स्थल' सामान्य पाठक के लिए 'ऊँचे स्थानों' से अधिक बोधगम्य है, जबकि शְׂעִירִים की अनिश्चितता पादटिप्पणी में सुरक्षित है।
