  text: וְ/אַחֲרֶ֣י/הָ לָקַ֔ח אֶֽת מַעֲכָ֖ה בַּת אַבְשָׁל֑וֹם וַ/תֵּ֣לֶד ל֗/וֹ אֶת אֲבִיָּה֙ וְ/אֶת עַתַּ֔י וְ/אֶת זִיזָ֖א וְ/אֶת שְׁלֹמִֽית־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/020.yaml
  text: After her[a], he took Maacah the daughter of Absalom, and she bore him Abijah, Attai, Ziza, and Shelomith.
translation:
  language: hi
  text: उसके बाद उसने अबशालोम की बेटी[a] माका से विवाह किया। माका ने उसे अबिय्याह, अत्तै, ज़ीज़ा और शलोमीत को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, ‘अबशालोम की बेटी’; ‘बेटी’ शब्द कभी-कभी अधिक दूर की स्त्री वंशज को भी दर्शा सकता है, इसलिए कुछ लोग इसका अर्थ ‘अबशालोम की पोती’ समझते हैं।
    reason: वैकल्पिक वंशावली-संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאַחֲרֶיהָ
  choice: उसके बाद
  rationale: यह पदबंध पहले बताई गई स्त्री की ओर संकेत करता है। हिन्दी में ‘उसके बाद’ स्वाभाविक है और स्त्रीलिंग एकवचन प्रत्यय के संदर्भ को बनाए रखता है।
- source_word: לָקַח
  choice: ब्याह लिया
  rationale: मूल अर्थ ‘लेना’ है, पर पत्नी के संदर्भ में यह विवाह करने का प्रचलित इब्रानी प्रयोग है; ‘ब्याह लिया’ आधुनिक हिन्दी में आशय स्पष्ट और स्वाभाविक बनाता है।
- source_word: מַעֲכָה
  choice: माका
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: בַּת אַבְשָׁלוֹם
  choice: अबशालोम की बेटी
  rationale: मुख्य पाठ में इब्रानी בַּת का सीधा अर्थ ‘बेटी’ रखा गया है; अधिक दूर की स्त्री वंशज का संभावित अर्थ टिप्पणी में दिया गया है।
- source_word: וַתֵּלֶד לוֹ
  choice: माका ने उसके लिए ... को जन्म दिया
  rationale: इब्रानी में स्त्री कर्ता और पुरुष के हित/संबंध को बताने वाला अप्रत्यक्ष कर्म है। नाम दोहराने से हिन्दी में कर्ता स्पष्ट रहता है और ‘उसके लिए’ मूल के לוֹ को सुरक्षित रखता है।
- source_word: אֶת אֲבִיָּה וְאֶת עַתַּי וְאֶת זִיזָא וְאֶת שְׁלֹמִית
  choice: अबिय्याह, अत्तै, ज़ीज़ा और शलोमीत
  rationale: व्यक्तिगत नामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; बार-बार आने वाले कर्म-चिह्न אֶת को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
theological_decisions:
- issue: माका को ‘अबशालोम की बेटी’ कहना
  choice: मुख्य पाठ में ‘अबशालोम की बेटी’
  alternative: अबशालोम की पोती अथवा स्त्री वंशज
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘बेटी’ कहता है। वंशावली में यह शब्द कभी अधिक दूर की स्त्री वंशज के लिए भी प्रयुक्त हो सकता है, इसलिए उस संभावना को मुख्य पाठ में निश्चित किए बिना पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ब्याह लिया’ वैवाहिक संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है। नाम इब्रानी रूपों के निकट देवनागरी में दिए गए हैं।
