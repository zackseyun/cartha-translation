source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֡ה לֹא תַעֲלוּ֩ וְ/לֹא תִלָּ֨חֲמ֜וּ עִם אֲחֵי/כֶ֗ם שׁ֚וּבוּ אִ֣ישׁ לְ/בֵית֔/וֹ כִּ֧י מֵֽ/אִתִּ֛/י נִהְיָ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַֽ/יִּשְׁמְעוּ֙ אֶת דִּבְרֵ֣י יְהוָ֔ה וַ/יָּשֻׁ֖בוּ מִ/לֶּ֥כֶת אֶל יָרָבְעָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/004.yaml
  text: 'Thus says Yahweh: You must not go up or fight against your brothers[a]. Return, each man to his house, for this thing has come from me[c][b]. So they listened to the words of Yahweh and turned back from going against Jeroboam.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “तुम चढ़ाई मत करो और अपने भाइयों[a] से युद्ध मत करो। तुममें से हर एक अपने घर लौट जाए, क्योंकि यह बात मेरी ही ओर से हुई है।”[b] तब उन्होंने याहवे के वचनों को माना और यारोबाम के विरुद्ध जाने से लौट गए।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ से आशय दूसरे पक्ष के साथी इस्राएलियों से है।
    reason: cultural_note
  - marker: b
    text: या, “क्योंकि यह मामला मेरी ओर से है।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “यारोबाम की ओर जाने से लौट गए”; प्रसंग में यह उसके विरुद्ध युद्ध करने के लिए जाना है।
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं का औपचारिक संदेशवाहक-सूत्र है। ‘यों कहता है’ उसके गरिमापूर्ण और प्रत्यक्ष स्वर को बनाए रखता है।
- source_word: לֹא תַעֲלוּ
  choice: तुम चढ़ाई मत करो
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर यहाँ सैन्य प्रसंग में आगे बढ़कर आक्रमण करने का भाव है। ‘चढ़ाई करना’ हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְלֹא תִלָּחֲמוּ עִם אֲחֵיכֶם
  choice: और अपने भाइयों से युद्ध मत करो
  rationale: נלחם युद्ध करने को दर्शाता है। युद्ध के प्रसंग में עִם का स्वाभाविक हिन्दी संबंध ‘से’ है; ‘भाइयों’ से यह भी स्पष्ट रहता है कि विरोधी पक्ष साथी इस्राएली हैं।
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: तुममें से हर एक अपने घर लौट जाए
  rationale: אִישׁ यहाँ वितरणात्मक है। यह रूप मूल के ‘हर व्यक्ति अपने घर’ के अर्थ को सहज आधुनिक हिन्दी में देता है।
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: क्योंकि यह बात मेरी ही ओर से हुई है
  rationale: वाक्य इस घटना को परमेश्वर की ओर से आया हुआ बताता है। ‘मेरी ही ओर से’ स्रोत और दैवी कर्तृत्व पर दिए गए बल को बनाए रखता है, पर उससे आगे कोई व्यवस्थित धर्मसिद्धांत नहीं जोड़ता।
- source_word: וַיִּשְׁמְעוּ אֶת דִּבְרֵי יְהוָה
  choice: तब उन्होंने याहवे के वचनों को माना
  rationale: שׁמע सुनने के साथ आज्ञा मानने का अर्थ भी दे सकता है। अगला खंड उनके अनुपालन को बताता है, इसलिए ‘माना’ प्रसंगानुकूल है; ‘वचनों’ से דִּבְרֵי का बहुवचन भी सुरक्षित रहता है।
- source_word: וַיָּשֻׁבוּ מִלֶּכֶת אֶל יָרָבְעָם
  choice: और यारोबाम के विरुद्ध जाने से लौट गए
  rationale: אל का शाब्दिक अर्थ ‘की ओर’ है, लेकिन सैन्य प्रसंग शत्रुतापूर्ण अभियान दर्शाता है। मुख्य पाठ में ‘के विरुद्ध’ आशय स्पष्ट करता है और पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: ‘याहवे’ इब्रानी व्यक्तिवाचक वाचा-नाम को नाम के रूप में स्पष्ट रखता है और उसे उपाधि में नहीं बदलता।
- issue: מֵאִתִּי נִהְיָה में दैवी कर्तृत्व
  choice: यह बात मेरी ही ओर से हुई है
  alternative: यह बात मेरी ओर से है
  rationale: इब्रानी पाठ राजनीतिक परिस्थिति को स्पष्ट रूप से परमेश्वर की ओर से हुआ बताता है। चुना हुआ रूप इस दावे को सुरक्षित रखता है, किंतु उसके दार्शनिक या धर्मवैज्ञानिक तंत्र की अतिरिक्त व्याख्या नहीं करता।
- issue: שׁמע में सुनना अथवा आज्ञापालन
  choice: वचनों को माना
  alternative: वचनों को सुना
  rationale: क्रिया दोनों अर्थ धारण कर सकती है। तुरंत बाद लौट जाने की क्रिया से यहाँ सुनकर मानने का भाव प्रबल है; फिर भी अनुवाद कोई अतिरिक्त प्रेरणा आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘चढ़ाई’, ‘युद्ध’, ‘वचन’ और ‘लौट गए’ जैसे परिचित शब्द मूल के सैन्य तथा भविष्यद्वक्तापरक स्वर को स्पष्ट रखते हैं। उद्धरण-चिह्न प्रत्यक्ष ईश्वरीय वाणी की सीमा दिखाते हैं।
