  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: और उसने ... जन्म दिया
  rationale: वय्यिक्तोल रूप कथा की अगली घटना बताता है। आधुनिक हिन्दी में “जन्म दिया” स्वाभाविक है और स्त्री कर्ता को बनाए रखता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: लामेद और सर्वनाम-प्रत्यय जन्म-सूत्र में पिता से संबंध व्यक्त करते हैं। “उसके लिए” मूल की संरचना और अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: בָּנִים
  choice: पुत्रों
  rationale: इब्रानी शब्द विशेष रूप से पुरुष संतानों को दर्शाता है, और आगे तीन पुरुष नाम दिए गए हैं।
- source_word: יְעוּשׁ
  choice: यऊश
  rationale: नाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: שְׁמַרְיָה
  choice: शमर्याह
  rationale: नाम के इब्रानी रूप को हिन्दी में स्पष्ट और परंपरासंगत ढंग से लिप्यंतरित किया गया है।
- source_word: זָהַם
  choice: ज़ाहम
  rationale: नाम का स्रोत-पाठ के निकट देवनागरी लिप्यंतरण किया गया है।
