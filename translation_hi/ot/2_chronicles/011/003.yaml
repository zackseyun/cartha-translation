  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘समस्त इस्राएल’ राष्ट्रीय/वाचागत पदनाम को बनाए रखता है। पद अगले कथन की भूमिका है, इसलिए अंत में द्विबिंदु रखा गया है।
