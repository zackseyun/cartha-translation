  text: אֱמֹ֕ר אֶל רְחַבְעָ֥ם בֶּן שְׁלֹמֹ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וְ/אֶל֙ כָּל יִשְׂרָאֵ֔ל בִּ/יהוּדָ֥ה וּ/בִנְיָמִ֖ן לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/003.yaml
  text: Speak to Rehoboam son of Solomon[a], king of Judah, and to all Israel in Judah and Benjamin, saying,
translation:
  language: hi
  text: 'सुलैमान के पुत्र, यहूदा के राजा रहूबियाम से, और यहूदा तथा बिन्यामीन में रहने वाले समस्त इस्राएल से कहो:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱמֹר
  choice: यह कहना
  rationale: आज्ञार्थक रूप किसी संदेश को पहुँचाने का आदेश देता है। हिंदी में अगले पद में आने वाले कथन से सहज संबंध जोड़ने के लिए ‘यह कहना’ स्वाभाविक है और आदेश का बल बनाए रखता है।
- source_word: אֶל
  choice: से
  rationale: यहाँ पूर्वसर्ग वाणी के संबोधित व्यक्तियों को चिह्नित करता है; हिंदी में ‘किसी से कहना’ स्वाभाविक प्रयोग है।
- source_word: רְחַבְעָם
  choice: रहूबियाम
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: בֶּן שְׁלֹמֹה
  choice: सुलैमान के पुत्र
  rationale: इब्रानी संबंधसूचक पदबंध को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: रहूबियाम के राजकीय पद को समानाधिकरण में व्यक्त करता है।
- source_word: וְאֶל כָּל יִשְׂרָאֵל
  choice: और ... समस्त इस्राएल से
  rationale: राष्ट्रीय-वाचक ‘इस्राएल’ को बनाए रखता है; उसे ‘इस्राएलियों’ में बदलकर अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: בִּיהוּדָה וּבִנְיָמִן
  choice: यहूदा तथा बिन्यामीन में रहने वाले
  rationale: ב के स्थानसूचक अर्थ को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है; संदर्भ उन लोगों का है जो इन क्षेत्रों में स्थित हैं।
- source_word: לֵאמֹר
  choice: 'यह कहना:'
  rationale: यह क्रिया का infinitive construct अगले पद में आने वाले संदेश का परिचय देता है। हिंदी में आरंभिक אֱמֹר के साथ एक ही बार ‘यह कहना’ रखकर अनावश्यक पुनरुक्ति से बचते हुए संबंध सुरक्षित रहता है।
theological_decisions: []
