language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֣א רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת בֵּ֨ית יְהוּדָ֜ה וּ/בִנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמוֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם יִשְׂרָאֵ֔ל לְ/הָשִׁ֥יב אֶת הַ/מַּמְלָכָ֖ה לִ/רְחַבְעָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/011/001.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled the house of Judah and Benjamin, one hundred eighty thousand chosen warriors[b], to fight against Israel in order to restore the kingdom to Rehoboam.
translation:
  language: hi
  text: जब रहूबियाम यरूशलेम पहुँचा, तब उसने यहूदा और बिन्यामीन के घराने को इकट्ठा किया—एक लाख अस्सी हज़ार चुने हुए योद्धाओं को—ताकि वे इस्राएल से युद्ध करके राज्य को फिर से रहूबियाम को लौटा दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का कथात्मक रूप गंतव्य यरूशलेम पर आगमन बताता है; आधुनिक हिन्दी में ‘पहुँचा’ स्वाभाविक और स्पष्ट है।
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: קהל के हिफ़ील रूप का अर्थ लोगों को एकत्र या संगठित करना है; यहाँ सैन्य जुटान का संदर्भ है।
- source_word: בֵּית יְהוּדָה וּבִנְיָמִן
  choice: यहूदा और बिन्यामीन के घराने
  rationale: ‘घराना’ בית की सामूहिक और राजनैतिक धारणा को बनाए रखता है और इसे केवल दो व्यक्तियों के रूप में समझने से रोकता है।
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: चुने हुए योद्धाओं
  rationale: सैन्य संदर्भ में בָּחוּר चयनित या श्रेष्ठ पुरुषों को और עֹשֵׂה מִלְחָמָה युद्ध करने वालों को दर्शाता है; संयुक्त अनुवाद संक्षिप्त तथा स्वाभाविक है।
- source_word: לְהִלָּחֵם עִם יִשְׂרָאֵל
  choice: इस्राएल से युद्ध करके
  rationale: शत्रुतापूर्ण संदर्भ में עִם विरोधी पक्ष को सूचित करता है; ‘से युद्ध’ हिन्दी में स्वाभाविक है और मूल ‘इस्राएल’ को बनाए रखता है।
- source_word: לְהָשִׁיב אֶת הַמַּמְלָכָה לִרְחַבְעָם
  choice: राज्य फिर से रहूबियाम के अधिकार में कर दें
  rationale: שוב के हिफ़ील में लौटाने या बहाल करने का भाव है। ‘अधिकार में’ हिन्दी में राजनैतिक नियंत्रण की पुनर्स्थापना को स्पष्ट करता है, जबकि ‘राज्य’ מַמְלָכָה का सामान्य अर्थ रखता है।
theological_decisions:
- issue: विभाजन के बाद ‘इस्राएल’ का संदर्भ
  choice: मुख्य पाठ में ‘इस्राएल’ रखा गया है
  alternative: उत्तरी गोत्र / विद्रोही इस्राएली
  rationale: इब्रानी पाठ स्वयं विरोधी राजनैतिक समुदाय को ‘इस्राएल’ कहता है; व्याख्यात्मक विशेषण जोड़ना इतिहासवृत्तकार की शब्दावली से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संख्या को प्रचलित हिन्दी रूप ‘एक लाख अस्सी हज़ार’ में दिया गया है। वाक्य में दीर्घ सैन्य विशेषण को स्पष्ट करने के लिए डैश प्रयुक्त हैं।
