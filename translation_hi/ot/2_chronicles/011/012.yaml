  yaml_path: translation/ot/2_chronicles/011/012.yaml
  text: And in every city he put shields and spears[a], and he strengthened them very greatly; and Judah and Benjamin belonged to him.
translation:
  language: hi
  text: उसने हर नगर में ढालें और भाले रखे और उन नगरों को अत्यन्त सुदृढ़ किया। और यहूदा और बिन्यामीन उसके अधिकार में थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְ/כָל עִיר וָ/עִיר
  choice: हर नगर में
  rationale: इब्रानी में संज्ञा की पुनरावृत्ति वितरणात्मक है और प्रत्येक नगर पर बल देती है। आधुनिक हिन्दी में “हर नगर में” इसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: צִנּוֹת
  choice: ढालें
  rationale: यह शब्द सैन्य ढालों, सम्भवतः बड़ी ढालों, के लिए प्रयुक्त है; “ढालें” स्पष्ट है और अनावश्यक रूप से आकार निश्चित नहीं करता।
- source_word: וּ/רְמָחִים
  choice: भाले
  rationale: רמח का सामान्य और स्वाभाविक आधुनिक हिन्दी समतुल्य “भाला” है।
- source_word: וַֽ/יְחַזְּקֵם
  choice: उन नगरों को ... सुदृढ़ किया
  rationale: पुल्लिंग बहुवचन प्रत्यय का सन्दर्भ प्रसंगानुसार नगरों से है। “सुदृढ़ किया” חזק के बलवान बनाने के भाव को बनाए रखते हुए दुर्गीकरण के प्रसंग में स्वाभाविक है।
- source_word: לְ/הַרְבֵּה מְאֹד
  choice: अत्यन्त
  rationale: यह तीव्रता सूचक पदबंध क्रिया को बहुत अधिक मात्रा में किए जाने पर बल देता है; “अत्यन्त” संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: וַ/יְהִי ל֖/וֹ יְהוּדָה וּ/בִנְיָמִן
  choice: इस प्रकार यहूदा और बिन्यामीन उसके अधीन रहे
  rationale: इब्रानी स्वामित्वसूचक मुहावरा यहाँ राजनीतिक अधिकार या निष्ठा को दर्शाता है। “उसके अधीन रहे” आधुनिक हिन्दी में इस प्रसंग को स्पष्ट करता है, बिना निजी स्वामित्व का भ्रामक संकेत दिए।
theological_decisions:
- issue: यहूदा और बिन्यामीन के राजा के ‘होने’ का आशय
  choice: उसके अधीन रहे
  alternative: उसके हो गए
  rationale: यह कथन राजनीतिक शासन और निष्ठा से सम्बन्धित है। चुना हुआ पाठ उसी अर्थ को व्यक्त करता है और किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण ऐतिहासिक गद्य। वितरणात्मक पुनरावृत्ति को हिन्दी के स्वाभाविक “हर नगर” से व्यक्त किया गया है। सर्वनाम के सम्भावित अस्पष्ट सन्दर्भ को प्रसंगानुसार “उन नगरों” से स्पष्ट किया गया है।
