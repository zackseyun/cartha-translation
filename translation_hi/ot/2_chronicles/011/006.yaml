  text: उसने बेतलेहेम, एताम और तकोआ का निर्माण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: निर्माण किया
  rationale: काल क्रिया בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। निकटवर्ती प्रसंग नगरों को दृढ़ करने का है, फिर भी इस पद में ‘किलेबंद किया’ जैसी अतिरिक्त स्पष्टता जोड़ने के बजाय मूल क्रिया का सामान्य अर्थ रखा गया है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का व्याकरणिक चिह्न है; हिन्दी में इसका स्वतंत्र अनुवाद आवश्यक नहीं है।
- source_word: בֵּית לֶחֶם
  choice: बैतलहम
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में परिचित और सहज लिप्यंतरण।
- source_word: עֵיטָם
  choice: एताम
  rationale: हिब्रू स्थान-नाम का देवनागरी में निकट और स्वाभाविक लिप्यंतरण।
- source_word: תְּקוֹעַ
  choice: तकोआ
  rationale: हिब्रू स्थान-नाम का देवनागरी लिप्यंतरण; अंतिम व्यंजन को अनावश्यक रूप से ‘ह’ बनाकर नहीं दर्शाया गया।
- source_word: וְ...וְ...וְ
  choice: अल्पविरामों के साथ अंतिम ‘और’
  rationale: हिब्रू में प्रत्येक नाम waw से जुड़ा है; आधुनिक स्वाभाविक हिन्दी में सूची को अल्पविरामों और अंतिम ‘और’ से व्यक्त करना अर्थ और संबंध दोनों सुरक्षित रखता है।
