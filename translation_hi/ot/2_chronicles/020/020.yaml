base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/020.yaml
  text: 'They rose early in the morning and went out to the wilderness of Tekoa[a]. As they were going out, Jehoshaphat stood and said, “Listen to me, Judah and inhabitants of Jerusalem: believe in Yahweh your God, and you will be established; believe in his prophets[c][b], and you will succeed.”'
translation:
  language: hi
  text: वे भोर को जल्दी उठे और तकोआ के निर्जन प्रदेश की ओर निकल गए। उनके निकलते समय यहोशापात खड़ा हुआ और बोला, “हे यहूदा और यरूशलेम के निवासियो, मेरी सुनो! अपने परमेश्वर याहवे पर विश्वास रखो, और तुम दृढ़ बने रहोगे[a]; उसके नबियों पर विश्वास रखो[b], और तुम सफल होगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में “विश्वास रखो” और “दृढ़ बने रहोगे” एक ही मूल धातु אמן से बने हैं; वैकल्पिक अनुवाद: “अपने परमेश्वर याहवे पर भरोसा रखो, और तुम स्थिर रहोगे।”'
    reason: lexical_alternative
  - marker: b
    text: या “उसके नबियों पर भरोसा रखो”; यहाँ वही इब्रानी क्रिया फिर दोहराई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: वे भोर को जल्दी उठे
  rationale: हिफ़िल क्रिया שׁכם और कालसूचक पद का स्वाभाविक हिन्दी रूप; शीघ्र उठने का कथात्मक बल बनाए रखता है।
- source_word: לְמִדְבַּר תְּקוֹעַ
  choice: तकोआ के निर्जन प्रदेश की ओर
  rationale: מִדְבָּר यहाँ अनिवार्यतः रेतीला मरुस्थल नहीं, बल्कि निर्जन अथवा कम आबादी वाला खुला प्रदेश दर्शाता है।
- source_word: וּבְצֵאתָם
  choice: उनके निकलते समय
  rationale: पूर्वसर्ग सहित infinitive construct की कालवाचक भूमिका को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: आज्ञार्थक שמע और प्रथम पुरुष कर्म-प्रत्यय का सीधा, प्रचलित हिन्दी रूप।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: और यरूशलेम के निवासियो
  rationale: संज्ञा के रूप में प्रयुक्त participle को सार्वजनिक संबोधन के अनुरूप व्यक्त करता है।
- source_word: הַאֲמִינוּ בַּיהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा पर विश्वास रखो
  rationale: אמן के हिफ़िल और בְּ का अर्थ विश्वास अथवा भरोसा रखना है; हिन्दी में 'विश्वास रखो' अगले वाक्यांश की पुनरावृत्ति भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम YHWH को हिन्दी बाइबलीय प्रयोग में व्यापक और पहचाने जाने योग्य रूप 'यहोवा' से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: וְתֵאָמֵנוּ
  choice: और तुम दृढ़ बने रहोगे
  rationale: אמן के निफ़ाल का स्थिर/स्थापित होने का भाव देता है और उसी धातु से बने पिछले 'विश्वास रखो' के शब्दालंकार को अर्थतः सुरक्षित रखता है।
- source_word: הַאֲמִינוּ בִנְבִיאָיו
  choice: उसके नबियों पर विश्वास रखो
  rationale: पहले आए उसी इब्रानी क्रिया-रूप की आलंकारिक पुनरावृत्ति को हिन्दी में भी दोहराता है।
- source_word: וְהַצְלִיחוּ
  choice: और तुम सफल होगे
  rationale: צלח के हिफ़िल का यहाँ फलना-सफल होना अथवा सफलता पाना उपयुक्त अर्थ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसे उपाधि 'प्रभु' से बदलने के बजाय हिन्दी पाठकों के बीच स्थापित लिप्यंतरण 'यहोवा' रखा गया है।
- issue: אמן की पुनरावृत्ति और शब्दालंकार
  choice: विश्वास रखो … दृढ़ बने रहोगे; विश्वास रखो
  alternative: भरोसा रखो … स्थिर रहोगे; भरोसा रखो
  rationale: मूल में एक ही धातु की पुनरावृत्ति विश्वास और दृढ़ता को जोड़ती है। हिन्दी में पूरी ध्वन्यात्मक समानता संभव नहीं, इसलिए अर्थगत संबंध और क्रिया की पुनरावृत्ति सुरक्षित रखी गई है।
- issue: नबियों पर विश्वास रखने का आशय
  choice: उसके नबियों पर विश्वास रखो
  alternative: उसके नबियों की बात पर विश्वास रखो
  rationale: मूल में בְּ सीधे 'उसके नबियों' के साथ है। मुख्य पाठ उसकी औपचारिक संरचना रखता है; विस्तारित विकल्प व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सार्वजनिक वाचन के योग्य गरिमापूर्ण किंतु सहज शैली। 'निर्जन प्रदेश' भौगोलिक अर्थ को 'रेगिस्तान' से अधिक ठीक रखता है। संबोधन में 'हे' और बहुवचन 'निवासियो' वक्तव्य की सार्वजनिक तथा तात्कालिक प्रकृति को व्यक्त करते हैं।
