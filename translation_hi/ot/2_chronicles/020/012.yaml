    issue: Slightly awkward constituent order in the clause expressing lack of strength.
    rationale: In modern standard Hindi, ‘इस बड़ी भीड़ का सामना करने की शक्ति हममें नहीं है’ is more idiomatic than placing ‘हममें’ before ‘शक्ति,’ while retaining the Hebrew emphasis on internal incapacity.
