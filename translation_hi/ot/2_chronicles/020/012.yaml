review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the vocative appeal, the judicial sense of ‘judge,’ Israel’s lack of capacity before the approaching large multitude, their uncertainty, and their dependent gaze toward God. The adversative ‘पर’ is a permissible idiomatic rendering of the final כִּי clause in this context and preserves the prayer’s movement without resolving a disputed grammatical nuance beyond what the context supports.
  naturalness: The meaning is clear and the prayerful register is appropriate. However, ‘इस बड़ी भीड़ का सामना करने की हममें शक्ति नहीं है’ has a somewhat strained word order in modern Hindi. Moving ‘हममें’ after ‘शक्ति’ makes the clause more natural and immediately clear.
  terminology: ‘परमेश्वर,’ ‘न्याय,’ and ‘शक्ति’ are suitable established Hindi biblical terms. The singular devotional address ‘तू/तेरी’ is internally consistent and appropriate to the stated register. ‘भीड़’ faithfully avoids over-specifying the Hebrew as an army; ‘हम पर चढ़ी आ रही है’ suitably conveys an advancing hostile force.
  issues:
