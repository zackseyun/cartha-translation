id: 2CH.20.12
reference: 2 Chronicles 20:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֱלֹהֵ֨י/נוּ֙ הֲ/לֹ֣א תִשְׁפָּט בָּ֔/ם כִּ֣י אֵ֥ין בָּ֨/נוּ֙ כֹּ֔חַ לִ֠/פְנֵי הֶ/הָמ֥וֹן הָ/רָ֛ב הַ/זֶּ֖ה הַ/בָּ֣א עָלֵ֑י/נוּ וַ/אֲנַ֗חְנוּ לֹ֤א נֵדַע֙ מַֽה נַּעֲשֶׂ֔ה כִּ֥י עָלֶ֖י/ךָ עֵינֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/012.yaml
  text: Our God[a], will you not judge them? For we have no power before this great multitude that is coming against us. We do not know what to do, but our eyes are on you.
translation:
  language: hi
  text: हे हमारे परमेश्वर, क्या तू उनका न्याय नहीं करेगा? क्योंकि इस बड़ी भीड़ का सामना करने की शक्ति हममें नहीं है, जो हम पर चढ़ी आ रही है। हम नहीं जानते कि क्या करें, पर हमारी आँखें तेरी ओर लगी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर
  rationale: यह प्रार्थना में सीधा संबोधन है। ‘हे’ आधुनिक गरिमापूर्ण हिन्दी में संबोधन को स्पष्ट करता है, और ‘हमारे परमेश्वर’ सामुदायिक संबंध को बनाए रखता है।
- source_word: הֲלֹא תִשְׁפָּט בָּם
  choice: क्या तू उनका न्याय नहीं करेगा?
  rationale: שׁפט का न्यायिक अर्थ सीधे रखा गया है; ‘दण्ड’ कहना अर्थ को अनावश्यक रूप से संकुचित कर देता। प्रश्न विनती और अपेक्षा, दोनों व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी विनती का आधार प्रस्तुत करता है और हिन्दी में कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין בָּנוּ כֹּחַ
  choice: हममें शक्ति नहीं है
  rationale: כֹּחַ के ‘शक्ति/सामर्थ्य’ अर्थ को सरल और स्वाभाविक हिन्दी में रखा गया है; ‘हममें’ मूल की आंतरिक असमर्थता को दर्शाता है।
- source_word: לִפְנֵי
  choice: का सामना करने की
  rationale: शाब्दिक अर्थ ‘के सामने’ है, पर सैन्य संकट में हिन्दी का ‘सामना करना’ वही टकराव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: इस बड़ी भीड़
  rationale: הָמוֹן को ‘सेना’ कहकर जरूरत से अधिक विशिष्ट नहीं बनाया गया। ‘बड़ी भीड़’ विशाल जनसमूह का मूल अर्थ बनाए रखती है।
- source_word: הַבָּא עָלֵינוּ
  choice: जो हम पर चढ़ी आ रही है
  rationale: वर्तमान कृदंत निकट आते खतरे को व्यक्त करता है। ‘चढ़ी आ रही’ हिन्दी में शत्रुतापूर्ण आक्रमण को स्पष्ट करती है।
- source_word: וַאֲנַחְנוּ לֹא נֵדַע מַה נַּעֲשֶׂה
  choice: हम नहीं जानते कि क्या करें
  rationale: मूल की संक्षिप्त, सीधी और असहाय स्वीकारोक्ति को स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: כִּי עָלֶיךָ עֵינֵינוּ
  choice: पर हमारी आँखें तेरी ओर लगी हैं
  rationale: मूल रूपक को सुरक्षित रखते हुए भरोसे और आशाभरी निर्भरता का भाव व्यक्त किया गया है। यहाँ ‘पर’ पिछले वाक्य की असमर्थता और परमेश्वर पर भरोसे के बीच निहित विरोध को स्वाभाविक हिन्दी में दिखाता है।
theological_decisions:
- issue: अंतिम כִּי उपवाक्य का पिछले स्वीकार-वाक्य से संबंध
  choice: ‘पर हमारी आँखें तेरी ओर लगी हैं’ के रूप में निहित विरोध व्यक्त करना
  alternative: ‘क्योंकि हमारी आँखें तेरी ओर लगी हैं’
  rationale: כִּי सामान्यतः कारणसूचक हो सकता है, पर यहाँ प्रार्थना की गति ‘हम नहीं जानते’ से परमेश्वर पर आश्रित रहने की ओर जाती है। ‘पर’ इस प्रसंगगत विरोध को स्पष्ट करता है, जबकि आँखों का मूल रूपक सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थनात्मक स्वर अपनाया गया है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू/तेरी’ रखा गया है, जो बाइबलीय हिन्दी में प्रचलित है। अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘न्याय’, ‘शक्ति’ और ‘सामना’ जैसे सामान्य शब्द चुने गए हैं।
