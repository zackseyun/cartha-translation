  yaml_path: translation/ot/2_chronicles/020/013.yaml
  text: And all Judah was standing before Yahweh[a], even their little ones, their wives, and their children.
translation:
  language: hi
  text: और सारा यहूदा याहवे के सामने खड़ा था; उनके छोटे बच्चे, उनकी पत्नियाँ और उनके बच्चे[a] भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके बेटे।” इब्रानी शब्द विशेष रूप से “बेटे” अथवा प्रसंग के अनुसार व्यापक रूप से “बच्चे” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יְהוּדָה
  choice: और समूचा यहूदा
  rationale: וְ कथा को पिछले वाक्य से जोड़ता है; כָל समग्रता व्यक्त करता है। यहाँ 'यहूदा' सामूहिक रूप से यहूदा के लोगों को दर्शाता है।
- source_word: עֹמְדִים
  choice: खड़ा था
  rationale: कृदंत सभा की जारी अवस्था को दर्शाता है। सामूहिक संज्ञा 'यहूदा' के साथ एकवचन 'खड़ा था' स्वाभाविक हिंदी है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति में होने का भाव देता है। יְהוָה को हिंदी में प्रचलित व्यक्तिगत नाम 'यहोवा' से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: גַּם טַפָּם
  choice: उनके छोटे बच्चे ... भी
  rationale: גַּם इन सदस्यों के सम्मिलित होने पर बल देता है; טַף आश्रित छोटे बच्चों को सूचित करता है। हिंदी में 'भी' को पूरी सूची के अंत में रखना स्वाभाविक है।
- source_word: נְשֵׁיהֶם
  choice: उनकी पत्नियाँ
  rationale: घराने की इस सूची और संबंधवाचक प्रत्यय के संदर्भ में इसका अर्थ पत्नियाँ है।
- source_word: וּבְנֵיהֶם
  choice: और उनके बेटे
  rationale: בנים का मूल और इस स्थान पर संभावित विशिष्ट अर्थ 'बेटे' है। व्यापक अर्थ 'बच्चे' भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। आधुनिक हिंदी बाइबल-पाठकों के लिए 'यहोवा' अधिक परिचित रूप है और इसे 'प्रभु' जैसी उपाधि से नहीं बदलता; 'याहवे' विद्वत्तापरक वैकल्पिक लिप्यंतरण है।
- issue: בְנֵיהֶם में लिंग और व्यापकता
  choice: उनके बेटे
  alternative: उनके बच्चे
  rationale: शब्द विशेष रूप से 'बेटे' कह सकता है, किंतु प्रसंग के अनुसार संतान को व्यापक रूप से भी सूचित कर सकता है। मुख्य पाठ में विशिष्ट शाब्दिक अर्थ और पादटिप्पणी में व्यापक संभावना देकर मूल की अर्थगत गुंजाइश बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। सूची को स्वाभाविक हिंदी क्रम में रखा गया है और बलसूचक 'भी' अंत में आया है।
