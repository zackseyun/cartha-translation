  text: וְ/הִ֨נֵּה הֵ֔ם גֹּמְלִ֖ים עָלֵ֑י/נוּ לָ/בוֹא֙ לְ/גָ֣רְשֵׁ֔/נוּ מִ/יְּרֻשָּׁתְ/ךָ֖ אֲשֶׁ֥ר הֽוֹרַשְׁתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/011.yaml
  text: And behold[a], they are repaying us by coming to drive us out of your possession, which you gave us as an inheritance.
translation:
  language: hi
  text: 'और देखिए, वे हमें इस प्रकार प्रतिफल दे रहे हैं: आकर हमें आपकी उस संपत्ति से निकालने के लिए, जिसे आपने हमें विरासत के रूप में दिया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखिए
  rationale: यह वर्तमान अन्याय की ओर जोर देकर ध्यान खींचता है; आधुनिक, सम्मानपूर्ण हिन्दी में इसका संवादात्मक बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: הֵם
  choice: वे
  rationale: स्वतंत्र सर्वनाम का जोर बनाए रखा गया है, जिससे अपराध करने वालों पर बल पड़ता है।
- source_word: גֹּמְלִים עָלֵינוּ
  choice: वे हमें यह बदला दे रहे हैं
  rationale: यहाँ क्रिया पूर्व उपकार के प्रत्युत्तर में प्रतिफल देने का भाव रखती है; प्रसंग में यह व्यंग्यात्मक और प्रतिकूल प्रत्युत्तर है।
- source_word: לָבוֹא לְגָרְשֵׁנוּ
  choice: कि आकर हमें ... से निकाल देना चाहते हैं
  rationale: आने और निकालने के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है; 'निकाल देना' सैन्य रूप से भूमि से बेदखल करने के अर्थ के अनुकूल है।
- source_word: מִיְּרֻשָּׁתְךָ
  choice: आपकी उस संपत्ति से
  rationale: יְרֻשָּׁה का अधिकार/स्वामित्व वाला अर्थ व्यक्त करते हुए भूमि पर परमेश्वर के मूल अधिकार को बनाए रखता है।
- source_word: אֲשֶׁר הוֹרַשְׁתָּנוּ
  choice: जिसे आपने हमें विरासत में दिया है
  rationale: 'हिफ़ील रूप का कारणात्मक अर्थ स्पष्ट करता है: परमेश्वर ने इस्राएल को भूमि का उत्तराधिकार दिलाया अथवा उसे विरासत के रूप में दिया।'
theological_decisions:
- issue: भूमि पर परमेश्वर का स्वामित्व और इस्राएल को मिली विरासत
  choice: आपकी उस संपत्ति से, जिसे आपने हमें विरासत में दिया है
  alternative: आपकी उस विरासत से, जिसका आपने हमें वारिस बनाया है
  rationale: चुना हुआ पाठ परमेश्वर के मूल स्वामित्व और इस्राएल को उससे प्राप्त विरासत—दोनों को अलग किंतु संबंधित रूप में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना के संदर्भ के अनुरूप आदरसूचक 'आप' और dignified किंतु सहज शब्दावली। 'देखिए' ने हिब्रू उद्घोषणा का बल रखा है, जबकि अत्यधिक पुरातन 'देखो' या 'निहारिए' से बचा गया है।
