base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/001.yaml
  text: After this[a], the Moabites and the Ammonites, and with them some of the Meunites, came against Jehoshaphat for battle.
translation:
  language: hi
  text: इसके बाद मोआबी और अम्मोनी लोग, और उनके साथ कुछ मऊनी[a] लोग, यहोशापात से युद्ध करने आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ ‘कुछ अम्मोनी’ है। संदर्भ और प्राचीन अनुवादों के आधार पर बहुत-से व्याख्याकार इसे अम्मोनियों की पुनरावृत्ति न मानकर मऊनी या उनके समान कोई सहयोगी जाति समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह कथात्मक काल-संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; इब्रानी मुहावरे के ‘और ऐसा हुआ’ को अनावश्यक रूप से शब्दशः नहीं दोहराता।
- source_word: בְנֵי מוֹאָב
  choice: मोआबी
  rationale: यह जातीय पहचान का स्वाभाविक हिन्दी रूप है; ‘मोआब के पुत्र’ यहाँ अत्यधिक शब्दशः होता।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: यह इब्रानी जातीय पद का सहज और प्रचलित हिन्दी समतुल्य है।
- source_word: וְעִמָּהֶם
  choice: और उनके साथ
  rationale: यह अतिरिक्त सहयोगी समूह के पहले दोनों जातियों के साथ आने का संबंध स्पष्ट रूप से बनाए रखता है।
- source_word: מֵהָעַמּוֹנִים
  choice: कुछ मऊनी लोग
  rationale: मसोरेटी स्वरांकन ‘अम्मोनियों में से’ बताता है, पर संदर्भ और प्राचीन अनुवादों के आधार पर यहाँ किसी भिन्न सहयोगी जाति, प्रायः मऊनियों, का उल्लेख समझा जाता है। मुख्य पाठ में संभावित आशय और पादटिप्पणी में वास्तविक पाठगत अनिश्चितता रखी गई है।
- source_word: עַל יְהוֹשָׁפָט
  choice: यहोशापात से
  rationale: ‘युद्ध करने’ के साथ ‘से’ हिन्दी में विरोधी लक्ष्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने
  rationale: उद्देश्यसूचक वाक्यांश को सहज हिन्दी में व्यक्त करता है और सैन्य आशय को बनाए रखता है।
