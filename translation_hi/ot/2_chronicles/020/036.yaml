base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/036.yaml
  text: So he allied himself with him to make ships to go to Tarshish[b][a], and they made ships at Ezion-geber.
translation:
  language: hi
  text: और उसने उसके साथ साझेदारी की[a], ताकि वे तर्शीश जाने के लिए[b] जहाज़ बनाएँ; और उन्होंने एस्योन-गेबेर में जहाज़ बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके साथ मिल गया’ अथवा ‘उससे गठबंधन किया।’ इब्रानी क्रिया किसी के साथ संबंध या साझेदारी में जुड़ने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तर्शीश की ओर समुद्री यात्रा करने के लिए।’ जहाज़रानी के कुछ प्रसंगों में ‘तर्शीश’ वाली भाषा को मुहावरेदार ढंग से समझा जाता है, पर यहाँ इब्रानी वाक्यरचना सबसे स्वाभाविक रूप से तर्शीश को गंतव्य बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבְּרֵהוּ עִמּוֹ
  choice: उसने उसके साथ साझेदारी की
  rationale: हिफ़ील क्रिया यहाँ किसी के साथ व्यावसायिक या राजनीतिक संबंध में जुड़ने का भाव देती है। ‘साझेदारी की’ प्रसंग के संयुक्त जहाज़-निर्माण को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת אֳנִיּוֹת
  choice: जहाज़ बनाएँ
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; जहाज़ों के संदर्भ में ‘बनाना’ आधुनिक हिंदी में स्वाभाविक है और इब्रानी के निकट भी रहता है।
- source_word: לָלֶכֶת תַּרְשִׁישׁ
  choice: तर्शीश जाने के लिए
  rationale: הלך के क्रियार्थक रूप के बाद तर्शीश को सबसे स्वाभाविक रूप से गंतव्य समझा जाता है। ‘जाने’ मूल शब्दावली को बनाए रखता है, जबकि नौयात्रा का भाव जहाज़ों से स्पष्ट है।
- source_word: וַיַּעֲשׂוּ אֳנִיּוֹת
  choice: उन्होंने जहाज़ बनाए
  rationale: बहुवचन क्रिया दोनों साझेदारों की संयुक्त कार्रवाई बताती है और पहले प्रयुक्त ‘बनाएँ’ से शब्दगत संबंध बनाए रखती है।
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: एस्योन-गेबेर में
  rationale: בְ स्थान सूचित करता है; निर्माण-स्थल के लिए हिंदी में ‘में’ स्वाभाविक है। स्थाननाम का लिप्यंतरण किया गया है।
