  text: And they lived in it and built for you in it a sanctuary for your name[a], saying[b],
translation:
  language: hi
  text: वे उसमें बस गए[a] और तेरे लिए, तेरे नाम के निमित्त, उसमें एक पवित्र स्थान[b] बनाया, यह कहते हुए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसमें रहने लगे।’
    reason: lexical_alternative
  - marker: b
    text: ‘तेरे नाम के निमित्त एक पवित्र स्थान’ उस पवित्र स्थान को यहोवा के नाम—अर्थात उसकी प्रकट उपस्थिति और महिमा—के लिए समर्पित बताता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: वे उसमें बस गए
  rationale: ישׁב यहाँ देश में निवास स्थापित करने को दर्शाता है। ‘बस गए’ आरम्भिक बसाव और उसके बाद के निवास—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संकेत पूर्वपद ‘देश/भूमि’ की ओर है; हिन्दी में उसके लिए स्वाभाविक सर्वनाम ‘उसमें’ है।
- source_word: וַיִּבְנוּ
  choice: बनाया
  rationale: בנה का सीधा और सामान्य हिन्दी समतुल्य ‘बनाना’ है; यहाँ कर्ता बहुवचन होने पर भी कर्म ‘एक पवित्र स्थान’ के अनुसार क्रिया ‘बनाया’ आती है।
- source_word: לְךָ
  choice: तेरे लिए
  rationale: 'यहाँ ל समर्पण और प्रयोजन व्यक्त करता है: पवित्र स्थान परमेश्वर के लिए बनाया गया।'
- source_word: מִקְדָּשׁ
  choice: एक पवित्र स्थान
  rationale: מִקְדָּשׁ का अर्थ पवित्र ठहराया गया उपासना-स्थान है। ‘पवित्र स्थान’ आधुनिक हिन्दी में स्पष्ट है और इसे केवल संस्थागत शब्द ‘मन्दिर’ तक सीमित नहीं करता।
- source_word: לְשִׁמְךָ
  choice: तेरे नाम के लिए
  rationale: यह सीधा रूप उस स्थान के परमेश्वर के नाम को समर्पित होने का भाव सुरक्षित रखता है; ‘तेरे नाम में’ साधन या अधिकार का भिन्न अर्थ दे सकता था।
- source_word: לֵאמֹר
  choice: और कहा,
  rationale: यह अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में ‘और कहा,’ स्वाभाविक रूप से उस उद्धरण से जोड़ता है।
theological_decisions:
- issue: ‘तेरे नाम के लिए पवित्र स्थान’ का आशय
  choice: परमेश्वर के नाम, अर्थात उसकी प्रकट उपस्थिति और महिमा, को समर्पित पवित्र स्थान
  alternative: तेरे सम्मान के लिए मन्दिर; अथवा तेरे नाम को धारण करने वाला पवित्र स्थान
  rationale: अनुवाद पुराने नियम की ‘नाम’ सम्बन्धी भाषा को बनाए रखता है और यह संकेत नहीं देता कि परमेश्वर उस भवन में स्थानिक रूप से सीमित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और श्रद्धापूर्ण रखी गई है। प्रार्थना में परमेश्वर को प्रत्यक्ष सम्बोधन होने के कारण ‘तेरे’ रूप को बनाए रखा गया है। दोनों पादटिप्पणी-चिह्न सम्बद्ध शब्दसमूहों के ठीक बाद रखे गए हैं।
