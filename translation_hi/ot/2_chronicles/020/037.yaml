  text: וַ/יִּתְנַבֵּ֞א אֱלִיעֶ֤זֶר בֶּן דֹּדָוָ֨הוּ֙ מִ/מָּ֣רֵשָׁ֔ה עַל יְהוֹשָׁפָ֖ט לֵ/אמֹ֑ר כְּ/הִֽתְחַבֶּרְ/ךָ֣ עִם אֲחַזְיָ֗הוּ פָּרַ֤ץ יְהוָה֙ אֶֽת מַעֲשֶׂ֔י/ךָ וַ/יִּשָּׁבְר֣וּ אֳנִיּ֔וֹת וְ/לֹ֥א עָצְר֖וּ לָ/לֶ֥כֶת אֶל תַּרְשִֽׁישׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/037.yaml
  text: Then Eliezer son of Dodavahu[a], from Mareshah, prophesied against Jehoshaphat, saying, “Because you joined yourself with Ahaziah[b], Yahweh has broken your works.” So the ships were wrecked and were not able to go to Tarshish.
translation:
  language: hi
  text: 'तब मारेशा के निवासी दोदावाहू के पुत्र एलीएज़ेर ने यहोशापात के विरुद्ध भविष्यवाणी की: “तूने अपने को अहज़्याह के साथ मिला लिया है, इसलिए याहवे ने तेरे कामों को विफल कर दिया है।” तब जहाज़ टूट गए और तर्शीश नहीं जा सके।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְנַבֵּא
  choice: भविष्यवाणी की
  rationale: हित्पएल रूप यहाँ भविष्यद्वक्ता के रूप में ईश्वरीय संदेश सुनाने को व्यक्त करता है; यह स्वाभाविक और स्रोत-संगत हिन्दी है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: न्याय और फटकार के इस प्रसंग में यहोशापात के विरुद्ध कही गई भविष्यवाणी का भाव है, केवल उसके विषय में बोलने का नहीं।
- source_word: מִמָּרֵשָׁה
  choice: मारेशा के निवासी
  rationale: מן व्यक्ति के मूल स्थान को सूचित करता है; हिन्दी में यह प्रयोग स्वाभाविक रूप से उसके नगर-संबंध को बताता है।
- source_word: כְּהִתְחַבֶּרְךָ עִם
  choice: तूने ... से हाथ मिलाया है, इसलिए
  rationale: חבר का हित्पएल किसी के साथ स्वयं जुड़ने या साझेदारी करने का भाव देता है। प्रसंग जहाज़ बनाने की संयुक्त योजना का है; ‘हाथ मिलाया’ साझेदारी को सहज हिन्दी में व्यक्त करता है, जबकि כְּ का कारणात्मक भाव ‘इसलिए’ से स्पष्ट होता है।
- source_word: פָּרַץ
  choice: नष्ट कर दिया है
  rationale: מַעֲשֶׂיךָ को कर्म बनाकर פרץ यहाँ उद्यम को तोड़ने, विफल करने या बरबाद करने का अर्थ देता है; जहाज़ों के टूटने से इसका परिणाम स्पष्ट है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे काम को
  rationale: शाब्दिक रूप ‘तेरे कामों’ है, पर प्रसंग में यह जहाज़ बनाने के संयुक्त उद्यम की ओर संकेत करता है; हिन्दी में एकवचन सामूहिक ‘काम’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּשָּׁבְרוּ אֳנִיּוֹת
  choice: तब जहाज़ टूट गए
  rationale: निफ़अल रूप जहाज़ों के टूट जाने को व्यक्त करता है; ‘तब’ भविष्यवाणी में घोषित न्याय के परिणाम को जोड़ता है।
- source_word: וְלֹא עָצְרוּ לָלֶכֶת
  choice: और ... नहीं जा सके
  rationale: עצר यहाँ सामर्थ्य न रहने अथवा रुकावट के कारण जा न सकने का भाव देता है। ‘नहीं जा सके’ हिन्दी में इस वास्तविक परिणाम को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: תַּרְשִׁישׁ
  choice: तर्शीश
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में परिचित व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए अधिक परिचित लिप्यंतरण ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: כְּהִתְחַבֶּרְךָ का कारणात्मक संबंध
  choice: तूने अहज़्याह से हाथ मिलाया है, इसलिए
  alternative: जब तू अहज़्याह से जुड़ा
  rationale: प्रसंग न्याय का कारण यहोशापात की साझेदारी को ठहराता है। कारणात्मक अर्थ स्पष्ट किया गया है, पर साझेदारी को औपचारिक राजनीतिक संधि मानकर अत्यधिक विशिष्ट नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रत्यक्ष वचन में एकवचन ‘तू/तेरे’ हिब्रू के एकवचन संबोधन और भविष्यद्वाणी की सीधी फटकार को बनाए रखता है। व्यक्तिनामों और स्थाननामों के लिए प्रचलित बाइबलीय हिन्दी रूप अपनाए गए हैं।
