  text: וַ/יִּמְלֹ֥ךְ יְהוֹשָׁפָ֖ט עַל יְהוּדָ֑ה בֶּן שְׁלֹשִׁים֩ וְ/חָמֵ֨שׁ שָׁנָ֜ה בְּ/מָלְכ֗/וֹ וְ/עֶשְׂרִ֨ים וְ/חָמֵ֤שׁ שָׁנָה֙ מָלַ֣ךְ בִּֽ/ירוּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ עֲזוּבָ֖ה בַּת שִׁלְחִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/031.yaml
  text: And Jehoshaphat reigned over Judah. He was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: hi
  text: यहोशापात ने यहूदा पर शासन किया। जब वह राजा बना, तब वह पैंतीस वर्ष का था, और उसने यरूशलेम में पच्चीस वर्ष शासन किया। उसकी माता का नाम अज़ूबा था, जो शिल्ही की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: शासन किया
  rationale: מלך का यह रूप राजकीय विवरण आरम्भ करता है। आधुनिक हिन्दी में ‘शासन किया’ स्वाभाविक और सटीक है।
- source_word: עַל יְהוּדָה
  choice: यहूदा पर
  rationale: מלך के साथ עַל उस राज्य या प्रजा को सूचित करता है जिस पर शासन किया गया।
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: पैंतीस वर्ष का था
  rationale: हिब्रू की प्रचलित आयु-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: בְּ के साथ infinitive construct उसके राज्यारोहण का समय बताता है; ‘जब वह राजा बना’ सामान्य हिन्दी में स्पष्ट है।
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה מָלַךְ
  choice: उसने ... पच्चीस वर्ष शासन किया
  rationale: यह राजकाल की अवधि का सीधा कथन है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: यह राजकीय शासन का स्थान बताता है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: हिब्रू सूत्र का अर्थ रखते हुए स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
- source_word: עֲזוּבָה
  choice: अजूबा
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: בַּת שִׁלְחִי
  choice: शिल्ही की बेटी
  rationale: בַּת पुत्री-संबंध व्यक्त करता है; आधुनिक सामान्य हिन्दी में ‘की बेटी’ सहज है।
