  text: וְ/אַחֲרֵי כֵ֗ן אֶתְחַבַּר֙ יְהוֹשָׁפָ֣ט מֶֽלֶךְ יְהוּדָ֔ה עִ֖ם אֲחַזְיָ֣ה מֶֽלֶךְ יִשְׂרָאֵ֑ל ה֖וּא הִרְשִׁ֥יעַ לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/035.yaml
  text: After this[a], Jehoshaphat king of Judah allied himself with Ahaziah king of Israel[b], who acted wickedly in doing so.
translation:
  language: hi
  text: इसके बाद यहूदा के राजा यहोशापात ने इस्राएल के राजा अहज्याह के साथ गठबंधन किया; अहज्याह ने ऐसा करके बुराई की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक अनुवाद है, “वह करने में दुष्टता करता था।” “वह” का संकेत सबसे स्वाभाविक रूप से अहज्याह की ओर है, पर यह वाक्य यहोशापात के गठबंधन करने या संयुक्त उपक्रम की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद पिछले घटनाक्रम के बाद का समय बताता है; यह सहज और संक्षिप्त आधुनिक हिन्दी है।
- source_word: אֶתְחַבַּר
  choice: के साथ गठबंधन किया
  rationale: हित्पाएल रूप यहाँ केवल साथ जुड़ने से अधिक, एक संगठित साझेदारी या संधि में प्रवेश करने का भाव देता है।
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोशापात
  rationale: नाम और राजकीय पदवी को हिन्दी की स्वाभाविक शब्द-व्यवस्था में रखा गया है।
- source_word: עִם אֲחַזְיָה מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा अहज्याह के साथ
  rationale: पूर्वसर्ग, नाम और राजकीय पदवी का सीधा तथा स्वाभाविक अनुवाद।
- source_word: הוּא הִרְשִׁיעַ
  choice: अहज्याह ने ... दुष्टता की
  rationale: स्वतंत्र सर्वनाम का सबसे निकट पूर्वपद अहज्याह है; हिन्दी में अस्पष्ट 'उसने' के बजाय नाम दोहराने से संभावित संदर्भ स्पष्ट रहता है।
- source_word: לַעֲשׂוֹת
  choice: ऐसा करके
  rationale: शाब्दिक 'करने के लिए' यहाँ असहज और अधूरा लगेगा; यह रूप क्रिया की नैतिक बुराई को उसके किए हुए कार्य से जोड़ता है, पर उसके स्वरूप को आवश्यकता से अधिक निर्दिष्ट नहीं करता।
theological_decisions:
- issue: הוּא सर्वनाम का संदर्भ
  choice: इसे अहज्याह के संदर्भ में लिया गया है।
  alternative: इसे यहोशापात, उसके गठबंधन करने के कार्य, या पूरे संयुक्त उपक्रम के संदर्भ में समझा जा सकता है।
  rationale: व्याकरण की दृष्टि से निकटतम पूर्वपद अहज्याह है और प्रसंग भी उसके दुष्ट चरित्र का समर्थन करता है; फिर भी इब्रानी की संक्षिप्त रचना कुछ अस्पष्टता छोड़ती है, जिसे पादटिप्पणी में बताया गया है।
- issue: לַעֲשׂוֹת का गठबंधन से संबंध
  choice: '''ऐसा करके'' को अहज्याह के आचरण से जोड़ा गया है।'
  alternative: इसे अधिक शाब्दिक रूप में 'करने में/करने के लिए' रखा जा सकता है, बिना यह निश्चित किए कि संकेत किस खास कार्य की ओर है।
  rationale: यह सहज हिन्दी देता है, किंतु मूल की संक्षिप्तता और संदर्भगत तनाव को पूरी तरह मिटाने से बचने के लिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। 'गठबंधन' राजनीतिक-सहयोग का भाव स्पष्ट करता है। सर्वनाम-संदर्भ की वास्तविक इब्रानी अस्पष्टता मुख्य पाठ में सर्वाधिक संभावित अर्थ और पादटिप्पणी में विकल्प के द्वारा सुरक्षित रखी गई है।
