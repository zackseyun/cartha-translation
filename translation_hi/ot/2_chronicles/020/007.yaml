source:
  edition: WLC
  text: הֲ/לֹ֣א אַתָּ֣ה אֱלֹהֵ֗י/נוּ הוֹרַ֨שְׁתָּ֙ אֶת יֹשְׁבֵי֙ הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/לִּ/פְנֵ֖י עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַֽ/תִּתְּנָ֗/הּ לְ/זֶ֛רַע אַבְרָהָ֥ם אֹֽהַבְ/ךָ֖ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/007.yaml
  text: Did you not[a], our God, drive out the inhabitants of this land before your people Israel and give it forever to the offspring of Abraham, your friend?
translation:
  language: hi
  text: हे हमारे परमेश्वर, क्या आपने इस देश के निवासियों को अपनी प्रजा इस्राएल के सामने से नहीं निकाल दिया और इस देश को आपसे प्रेम करनेवाले अब्राहम के वंश को सदा के लिए दे दिया?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; आधुनिक हिन्दी में ‘क्या ... नहीं’ इसका स्वाभाविक रूप है।
- source_word: אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर
  rationale: प्रार्थना में प्रत्यक्ष संबोधन को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הוֹרַשְׁתָּ
  choice: निकाल दिया
  rationale: हिफ़ील रूप का अर्थ यहाँ पहले से बसे लोगों को उनके अधिकार-स्थान से हटाना या बेदखल करना है; ‘निकाल दिया’ सहज हिन्दी में विजय और विस्थापन का भाव रखता है।
- source_word: יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: इस देश के निवासी
  rationale: शाब्दिक अर्थ ‘इस देश में रहनेवाले’ है; ‘निवासी’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: מִלִּפְנֵי
  choice: के सामने से
  rationale: मूल स्थानगत मुहावरे को सुरक्षित रखता है और इस्राएल की उपस्थिति या आगे बढ़ने के सामने से हटाए जाने का भाव देता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: वाचक के दृष्टिकोण से ‘अपनी’ हिन्दी में स्वाभाविक है और ‘इस्राएल’ को ‘प्रजा’ के समानाधिकरण के रूप में बनाए रखता है।
- source_word: וַתִּתְּנָהּ
  choice: और यह देश ... दे दिया
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ ‘देश/भूमि’ है; हिन्दी में संदर्भ को ‘यह देश’ कहकर स्पष्ट करना अधिक स्वाभाविक है।
- source_word: לְזֶרַע אַבְרָהָם
  choice: अब्राहम के वंश को
  rationale: זֶרַע सामूहिक एकवचन है; ‘वंश’ आधुनिक हिन्दी में इस सामूहिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: אֹהַבְךָ
  choice: आपसे प्रेम करनेवाले
  rationale: यह אהב का सक्रिय कृदंत है और मूल रूप से उस व्यक्ति को बताता है जो परमेश्वर से प्रेम करता है; यह अनुवाद क्रिया की दिशा को बिना बदले सुरक्षित रखता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: स्थायी या अनंत अवधि का प्रचलित और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: अब्राहम के लिए אֹהַבְךָ का अनुवाद
  choice: आपसे प्रेम करनेवाले
  alternative: आपके मित्र
  rationale: इब्रानी सक्रिय कृदंत का सीधा अर्थ ‘जो आपसे प्रेम करता था’ है। अन्य बाइबलीय प्रसंगों के आधार पर ‘आपके मित्र’ संभव और परिचित अर्थ है, पर मुख्य पाठ में सक्रिय प्रेम की दिशा बनाए रखी गई है और संबंधपरक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थना के अनुकूल रखी गई है। अलंकारिक प्रश्न की एकता बनाए रखने के लिए दोनों समन्वित क्रियाओं के साथ ‘नहीं’ रखा गया है; ‘आपने ही’ इब्रानी में व्यक्त कर्ता-बल को दर्शाता है।
