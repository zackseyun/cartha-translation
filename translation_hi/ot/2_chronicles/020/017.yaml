source:
  edition: WLC
  text: לֹ֥א לָ/כֶ֖ם לְ/הִלָּחֵ֣ם בָּ/זֹ֑את הִתְיַצְּב֣וּ עִמְד֡וּ וּ/רְא֣וּ אֶת יְשׁוּעַת֩ יְהוָ֨ה עִמָּ/כֶ֜ם יְהוּדָ֣ה וִֽ/ירוּשָׁלִַ֗ם אַל תִּֽירְאוּ֙ וְ/אַל תֵּחַ֔תּוּ מָחָר֙ צְא֣וּ לִ/פְנֵי/הֶ֔ם וַ/יהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/017.yaml
  text: You will not need to fight in this battle[a]. Take your positions, stand still, and see the salvation of Yahweh with you, O Judah and Jerusalem. Do not fear or be dismayed. Tomorrow go out before them[b], and Yahweh is with you.
translation:
  language: hi
  text: इस युद्ध में तुम्हें लड़ने की आवश्यकता नहीं होगी। अपना स्थान लो, स्थिर खड़े रहो, और हे यहूदा और यरूशलेम, याहवे का वह उद्धार देखो जो तुम्हारे साथ है[a]। मत डरो और निराश मत हो। कल उनके सामने निकलो; याहवे तुम्हारे साथ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का छुटकारा।” इब्रानी शब्द युद्ध में बचाए जाने के साथ-साथ व्यापक अर्थ में उद्धार भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे तुम्हारे साथ रहेगा।” इब्रानी उपवाक्य में स्पष्ट क्रिया नहीं है, इसलिए इसे वर्तमान या भविष्य के आश्वासन के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא לָכֶם לְהִלָּחֵם בָּזֹאת
  choice: इस युद्ध में तुम्हें लड़ने की आवश्यकता नहीं होगी
  rationale: शाब्दिक अर्थ ‘इसमें लड़ना तुम्हारे लिए नहीं’ है; प्रसंग में आशय है कि युद्ध करने का दायित्व यहूदा पर नहीं होगा। यह रूप स्वाभाविक हिन्दी में वही भाव रखता है।
- source_word: הִתְיַצְּבוּ עִמְדוּ
  choice: अपनी जगह ले लो, स्थिर खड़े रहो
  rationale: 'दोनों आज्ञाओं का क्रम सुरक्षित रखा गया है: पहले दृढ़ता से स्थान ग्रहण करना, फिर वहीं खड़े रहना।'
- source_word: וּרְאוּ אֶת יְשׁוּעַת יְהוָה
  choice: याहवे का उद्धार देखो
  rationale: יְשׁוּעָה तत्काल युद्ध-संबंधी छुटकारे के साथ व्यापक उद्धार का अर्थ भी रखता है; ‘उद्धार’ दोनों आयामों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ / अपने साथ
  rationale: עם ईश्वरीय उपस्थिति और सहायता बताता है। पहले प्रयोग में हिन्दी वाक्य-विन्यास के अनुसार ‘अपने साथ’ और अंतिम आश्वासन में ‘तुम्हारे साथ’ स्वाभाविक है।
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम
  rationale: ये प्रत्यक्ष संबोधन हैं; हिन्दी में नामों को सीधे संबोधन के रूप में रखना स्वाभाविक और स्पष्ट है।
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: मत डरो और निराश मत हो
  rationale: दो समानांतर निषेधों को अलग-अलग बनाए रखा गया है; חתת यहाँ भय से टूटने या हतोत्साहित होने का भाव देता है।
- source_word: מָחָר צְאוּ לִפְנֵיהֶם
  choice: कल उनके सामने निकल जाना
  rationale: לִפְנֵיהֶם का मूल स्थानगत अर्थ ‘उनके सामने’ रखा गया है; युद्ध-प्रसंग में इसका आशय उनका सामना करने निकलना है।
- source_word: וַיהוָה עִמָּכֶם
  choice: याहवे तुम्हारे साथ है
  rationale: इब्रानी उपवाक्य क्रियारहित है। वर्तमानकालीन आश्वासन को मुख्य पाठ में रखा गया है, जबकि भावी अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: יְשׁוּעַת יְהוָה का अर्थ-क्षेत्र
  choice: याहवे का उद्धार
  alternative: याहवे का छुटकारा
  rationale: ‘उद्धार’ तत्काल सैनिक बचाव और व्यापक धार्मिक अर्थ दोनों को खुला रखता है; पादटिप्पणी प्रसंगगत ‘छुटकारा’ बताती है।
- issue: וַיהוָה עִמָּכֶם में काल
  choice: याहवे तुम्हारे साथ है
  alternative: याहवे तुम्हारे साथ रहेगा
  rationale: मूल में स्पष्ट क्रिया नहीं है, इसलिए वर्तमान और भावी दोनों व्याख्याएँ संभव हैं। मुख्य पाठ वर्तमान उपस्थिति का आश्वासन देता है और पादटिप्पणी भावी संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। बहुवचन संबोधन के लिए ‘तुम’ रखा गया है। मूल की क्रमिक आज्ञाएँ, दोनों निषेध और अंतिम क्रियारहित आश्वासन संरक्षित हैं।
