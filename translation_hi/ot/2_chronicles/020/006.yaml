base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/006.yaml
  text: and said[a], “O Yahweh, God of our fathers, are you not God in heaven? And do you not rule over all the kingdoms of the nations? In your hand are power and might[b], and there is none who can stand against you.”
translation:
  language: hi
  text: और उसने कहा, “हे यहोवा, हमारे पुरखों[a] के परमेश्वर, क्या आप ही स्वर्ग में परमेश्वर नहीं हैं? आप सभी राष्ट्रों के राज्यों पर शासन करते हैं। सामर्थ्य और पराक्रम आपके हाथ में हैं, और कोई भी आपके सामने टिक नहीं सकता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हमारे पिताओं”; इसका अर्थ “हमारे पूर्वजों” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कोई भी आपका सामना नहीं कर सकता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: और उसने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; हिन्दी में स्पष्ट कर्ता-सर्वनाम जोड़ना स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का विशिष्ट वाचा-नाम है; हिन्दी में प्रचलित प्रत्यक्ष रूप ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: हमारे पुरखाओं के परमेश्वर
  rationale: ‘पुरखाओं’ से इब्रानी बहुवचन ‘पिताओं/पूर्वज पुरुषों’ का संबंधपरक और वाचागत भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הֲלֹא אַתָּה הוּא אֱלֹהִים בַּשָּׁמַיִם
  choice: क्या आप ही स्वर्ग में परमेश्वर नहीं हैं?
  rationale: ‘क्या…नहीं’ अपेक्षित सकारात्मक उत्तर वाली आलंकारिक प्रश्न-रचना को बनाए रखता है; ‘ही’ אַתָּה הוּא के बल को व्यक्त करता है।
- source_word: מוֹשֵׁל
  choice: शासन करते हैं
  rationale: कृदन्त निरंतर सार्वभौम शासन बताता है; यह आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: जाति-जाति के सब राज्य
  rationale: यह राष्ट्रों/जातियों के समस्त राज्यों को दर्शाता है और हिन्दी बाइबलीय शैली में सहज है।
- source_word: וּבְיָדְךָ
  choice: आपके हाथ में
  rationale: मूल के ‘हाथ’ वाले सजीव रूपक को अमूर्त ‘अधिकार’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: כֹּחַ וּגְבוּרָה
  choice: सामर्थ्य और पराक्रम
  rationale: यह युग्म क्षमता और प्रबल विजयी शक्ति दोनों को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְאֵין עִמְּךָ לְהִתְיַצֵּב
  choice: कोई भी आपके सामने टिक नहीं सकता
  rationale: התיצב के खड़े होने/डटे रहने के बिंब और विरोध के प्रसंगगत अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट वाचा-नाम आया है; इसलिए नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: אֲבֹתֵינוּ में पुरुषवाचक वाचागत भाषा
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों
  rationale: ‘पुरखाओं’ मूल के पुरुषवाचक ‘पिताओं’ को आधुनिक हिन्दी में अपेक्षाकृत स्वाभाविक रखते हुए वंश और वाचा का भाव सुरक्षित करता है।
- issue: अंतिम वाक्य में विरोध का आशय
  choice: आपके सामने टिक नहीं सकता
  alternative: आपका सामना नहीं कर सकता
  rationale: प्रसंग विरोध करने की असमर्थता बताता है; चुना हुआ रूप मूल क्रिया के ‘खड़े होने/डटे रहने’ के बिंब को भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थना के अनुरूप आदरार्थी ‘आप’ और गरिमापूर्ण किंतु सहज शब्दावली के साथ रखी गई है। ‘पुरखाओं’ स्रोत की पुरुषवाचक वंश-भाषा बचाता है; फुटनोट अधिक शाब्दिक और सामान्य विकल्प स्पष्ट करता है।
