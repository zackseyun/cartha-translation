source:
  edition: WLC
  text: וּ/בְ/עֵת֩ הֵחֵ֨לּוּ בְ/רִנָּ֜ה וּ/תְהִלָּ֗ה נָתַ֣ן יְהוָ֣ה מְ֠אָֽרְבִים עַל בְּנֵ֨י עַמּ֜וֹן מוֹאָ֧ב וְ/הַר שֵׂעִ֛יר הַ/בָּאִ֥ים לִֽ/יהוּדָ֖ה וַ/יִּנָּגֵֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/022.yaml
  text: And at the time they began with singing and praise[a], Yahweh set ambushes against the Ammonites, Moab, and Mount Seir, who were coming against Judah[b], and they were struck down.
translation:
  language: hi
  text: जब वे जयगान और स्तुति करने लगे, तब याहवे ने अम्मोनियों, मोआबियों और सेईर पर्वत के लोगों के विरुद्ध घात लगाई[a], जो यहूदा के विरुद्ध आ रहे थे[b]; और वे परास्त किए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे ने घात लगानेवाले नियुक्त किए।” इब्रानी शब्द घात में छिपे व्यक्तियों को भी सूचित कर सकता है और घात की कार्रवाई को भी।
    reason: lexical_alternative
  - marker: b
    text: या “जो यहूदा की ओर आ रहे थे।” इस प्रसंग में उनका आना शत्रुतापूर्ण था, इसलिए मुख्य पाठ में “यहूदा के विरुद्ध” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הֵחֵלּוּ
  choice: जब वे ... करने लगे, तब
  rationale: यह स्वाभाविक हिन्दी में आरम्भ के उसी समय घटित अगली घटना को व्यक्त करता है और मूल के कालगत सम्बन्ध को बनाए रखता है।
- source_word: בְרִנָּה וּתְהִלָּה
  choice: जयगान और स्तुति
  rationale: רִנָּה आनन्दपूर्ण पुकार या गीत का अर्थ दे सकता है; आराधना के प्रसंग में ‘जयगान’ उसकी ध्वनि और आनन्द, दोनों को व्यक्त करता है, जबकि תְּהִלָּה के लिए ‘स्तुति’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: נָתַן ... מְאָרְבִים
  choice: घात लगाई
  rationale: शाब्दिक रूप से ‘घात/घात लगानेवाले दिए’ का हिन्दी सैन्य-सन्दर्भ में स्वाभाविक रूप ‘घात लगाई’ है। सहभागी रूप व्यक्तियों को भी सूचित कर सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְּנֵי עַמּוֹן מוֹאָב וְהַר שֵׂעִיר
  choice: अम्मोनियों, मोआबियों और सेईर पर्वत के लोगों
  rationale: ‘अम्मोन के पुत्र’ का स्वाभाविक जातिनाम ‘अम्मोनी’ है। मोआब और सेईर पर्वत यहाँ उनकी सेनाओं या निवासियों का द्योतक हैं; ‘लोगों’ से हिन्दी में यह सामूहिक आशय स्पष्ट होता है।
- source_word: הַבָּאִים לִיהוּדָה
  choice: जो यहूदा के विरुद्ध आ रहे थे
  rationale: לִיהוּדָה अपने आप में ‘यहूदा की ओर/यहूदा को’ हो सकता है, पर सैन्य प्रसंग में उनका आगमन शत्रुतापूर्ण है; मुख्य पाठ में ‘विरुद्ध’ इसी प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: וַיִּנָּגֵפוּ
  choice: और वे मार गिराए गए
  rationale: נגף का निफ़अल रूप किसी प्रहार से परास्त या धराशायी किए जाने का निष्क्रिय भाव रखता है। ‘मार गिराए गए’ उस तीव्रता और निष्क्रियता को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ इब्रानी पाठ में चार-अक्षरीय विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल किसी उपाधि में नहीं बदलता।
- issue: घात का कर्तृत्व और साधन
  choice: याहवे ने घात लगाई
  alternative: याहवे ने घात लगानेवाले नियुक्त किए
  rationale: मूल पाठ कार्य को याहवे से जोड़ता है, पर מְאָרְבִים यह स्पष्ट नहीं करता कि घात लगानेवाले कौन थे या क्रिया किस माध्यम से हुई। मुख्य पाठ उस अस्पष्टता को यथासम्भव बनाए रखता है और पादटिप्पणी व्यक्ति-सूचक सम्भावना देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘जयगान’, ‘स्तुति’ और ‘घात’ सामान्य धार्मिक तथा कथात्मक हिन्दी में सुबोध हैं। वाक्य की कालगत संरचना ‘जब ... तब’ से स्वाभाविक बनाई गई है, जबकि मूल की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
