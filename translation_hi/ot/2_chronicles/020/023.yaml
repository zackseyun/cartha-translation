  text: וַ֠/יַּֽעַמְדוּ בְּנֵ֨י עַמּ֧וֹן וּ/מוֹאָ֛ב עַל יֹשְׁבֵ֥י הַר שֵׂעִ֖יר לְ/הַחֲרִ֣ים וּ/לְ/הַשְׁמִ֑יד וּ/כְ/כַלּוֹתָ/ם֙ בְּ/יוֹשְׁבֵ֣י שֵׂעִ֔יר עָזְר֥וּ אִישׁ בְּ/רֵעֵ֖/הוּ לְ/מַשְׁחִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/023.yaml
  text: Then the Ammonites and Moabites rose up against the inhabitants of Mount Seir to devote them to destruction and to wipe them out; and when they had finished with the inhabitants of Seir[a], they helped each other to destroy one another.
translation:
  language: hi
  text: तब अम्मोनियों और मोआबियों ने सेईर पर्वत के निवासियों के विरुद्ध उठ खड़े होकर उन्हें विनाश के लिए अर्पित करने और पूरी तरह नष्ट करने का काम किया। जब वे सेईर के निवासियों का अंत कर चुके, तब वे परस्पर एक-दूसरे के विनाश में सहायता करने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ ... עַל
  choice: के विरुद्ध उठ खड़े होकर
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; עַל के साथ इस युद्ध-संदर्भ में यह विरोध में उठ खड़े होने या मोर्चा लेने का भाव व्यक्त करता है।
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב
  choice: अम्मोनियों और मोआबियों
  rationale: जातीय समुदायों के लिए आधुनिक हिन्दी में स्वाभाविक सामूहिक नाम; शाब्दिक ‘अम्मोन के पुत्र’ यहाँ अनावश्यक रूप से अस्वाभाविक होता।
- source_word: יֹשְׁבֵי הַר שֵׂעִיר
  choice: सेईर पर्वत के निवासियों
  rationale: יֹשְׁבֵי का सहभागी-संज्ञात्मक अर्थ ‘निवासी’ है और הַר שֵׂעִיר स्थान-नाम ‘सेईर पर्वत’ है।
- source_word: לְהַחֲרִים
  choice: उन्हें विनाश के लिए अर्पित करने
  rationale: חרם के हिफ़ील रूप में केवल मार डालना नहीं, बल्कि किसी को प्रतिबंध के अधीन करके विनाश के लिए समर्पित करने का धार्मिक-युद्ध संबंधी भाव भी है।
- source_word: וּלְהַשְׁמִיד
  choice: पूरी तरह मिटा देने
  rationale: שׁמד संपूर्ण विनाश का तीव्र भाव देता है; यह चयन पहले आए חרם से शब्दगत भेद भी बनाए रखता है।
- source_word: וּכְכַלּוֹתָם
  choice: जब वे ... का अंत कर चुके
  rationale: כְּ के साथ infinitive construct यहाँ कालवाचक है—‘जब/जैसे ही उन्होंने समाप्त किया’; हिन्दी में पूर्ण हुई पूर्ववर्ती क्रिया स्पष्ट होती है।
- source_word: עָזְרוּ אִישׁ בְּרֵעֵהוּ לְמַשְׁחִית
  choice: उन्होंने एक-दूसरे का नाश करने में एक-दूसरे की सहायता की
  rationale: वितरणात्मक मुहावरा ‘हर व्यक्ति ने अपने साथी की सहायता की’ पारस्परिक विनाश की विडंबना व्यक्त करता है। हिन्दी वाक्य मूल के ‘सहायता’ और पारस्परिकता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: युद्ध-संदर्भ में חרם का अनुवाद
  choice: विनाश के लिए अर्पित करने
  alternative: प्रतिबंध के अधीन करके सर्वथा नष्ट करने
  rationale: मुख्य पाठ में चुना गया रूप חרם के धार्मिक तथा संपूर्ण-विनाश संबंधी भार को सामान्य पाठक के लिए समझने योग्य भाषा में रखता है। अधिक शाब्दिक ‘प्रतिबंध’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘उठ खड़े होकर’ युद्ध-संदर्भ को स्वाभाविक बनाता है। अंतिम वाक्य में जानबूझकर ‘सहायता’ की विडंबनापूर्ण अभिव्यक्ति बनाए रखी गई है, क्योंकि वही इब्रानी पाठ की विशिष्टता है।
