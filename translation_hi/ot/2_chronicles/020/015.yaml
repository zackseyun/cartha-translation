source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר הַקְשִׁ֤יבוּ כָל יְהוּדָה֙ וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם וְ/הַ/מֶּ֖לֶךְ יְהוֹשָׁפָ֑ט כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/כֶ֗ם אַ֠תֶּם אַל תִּֽירְא֤וּ וְ/אַל תֵּחַ֨תּוּ֙ מִ/פְּנֵ֨י הֶ/הָמ֤וֹן הָ/רָב֙ הַ/זֶּ֔ה כִּ֣י לֹ֥א לָ/כֶ֛ם הַ/מִּלְחָמָ֖ה כִּ֥י לֵ/אלֹהִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/015.yaml
  text: 'And he said[a], “Listen, all Judah and inhabitants of Jerusalem, and King Jehoshaphat: Thus says Yahweh to you, ‘Do not fear, and do not be dismayed because of this great multitude, for the battle is not yours, but God''s.’”'
translation:
  language: hi
  text: 'तब उसने कहा, “यहूदा के सभी लोगो, यरूशलेम के निवासियो और राजा यहोशापात, ध्यान से सुनो! याहवे तुमसे यों कहते हैं: ‘इस विशाल जनसमूह के कारण मत डरो और हिम्मत मत हारो, क्योंकि यह लड़ाई तुम्हारी नहीं, बल्कि परमेश्वर की है।’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשִׁיבוּ
  choice: ध्यान से सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया केवल सुनने नहीं, बल्कि ध्यानपूर्वक सुनने का आह्वान करती है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כָל יְהוּדָה
  choice: यहूदा के सभी लोगो
  rationale: यहूदा को सामूहिक रूप से संबोधित किया गया है। हिन्दी में प्रत्यक्ष संबोधन के लिए यह रूप ‘समस्त यहूदा’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियो
  rationale: कृदन्तीय पद यरूशलेम में रहने वालों को दर्शाता है; संबोधन के कारण ‘निवासियो’ उपयुक्त है।
- source_word: כֹּה אָמַר יְהוָה לָכֶם
  choice: याहवे तुमसे यह कहते हैं
  rationale: यह नबी का संदेशवाहक-सूत्र है। हिन्दी शब्दक्रम में इसे स्वाभाविक रखते हुए वर्तमानकालीन घोषणात्मक बल सुरक्षित रखा गया है।
- source_word: אַל תִּירְאוּ וְאַל תֵּחַתּוּ
  choice: मत डरो और हिम्मत मत हारो
  rationale: दो अलग निषेधों और उनके बीच के संयोजक को सुरक्षित रखा गया है। ‘हिम्मत मत हारो’ חתת के भय से टूट जाने या निरुत्साहित होने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הֶהָמוֹן הָרָב הַזֶּה
  choice: इस विशाल जनसमूह
  rationale: הָמוֹן बड़ी भीड़ या विशाल समूह का बोध कराता है। ‘सेना’ कहना प्रसंगानुकूल होता, पर स्रोत से अधिक विशिष्ट अर्थ जोड़ देता।
- source_word: כִּי לֹא לָכֶם הַמִּלְחָמָה כִּי לֵאלֹהִים
  choice: क्योंकि यह लड़ाई तुम्हारी नहीं, बल्कि परमेश्वर की है
  rationale: इब्रानी की स्वामित्वसूचक विपरीतता को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; दूसरे כִּי को प्रसंगानुसार विरोधसूचक ‘बल्कि’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में चतुरक्षरीय निजी नाम सीधे उपस्थित है; लिप्यंतरण उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
- issue: लड़ाई के परमेश्वर की होने का कथन
  choice: यह लड़ाई तुम्हारी नहीं, बल्कि परमेश्वर की है
  alternative: तुम्हें नहीं, परमेश्वर को लड़ना है
  rationale: चुना हुआ रूप स्रोत की स्वामित्वसूचक रचना और उसके धर्मवैचारिक तनाव को बनाए रखता है; वैकल्पिक रूप परमेश्वर के लड़ने को अधिक स्पष्ट करता, पर मूल वाक्य से आगे बढ़ जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। प्रत्यक्ष संबोधन में ‘लोगो’, ‘निवासियो’ और ‘सुनो’ स्वाभाविक हिन्दी रूप हैं। दो अलग निषेधों—डरने और हिम्मत हारने—को मिलाया नहीं गया है।
