  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִֽ/יהוּדָ֛ה בָּ֥א עַל הַ/מִּצְפֶּ֖ה לַ/מִּדְבָּ֑ר וַ/יִּפְנוּ֙ אֶל הֶ֣/הָמ֔וֹן וְ/הִנָּ֧/ם פְּגָרִ֛ים נֹפְלִ֥ים אַ֖רְצָ/ה וְ/אֵ֥ין פְּלֵיטָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/024.yaml
  text: When Judah came to the lookout over the wilderness[a], they turned toward the multitude, and behold, there were corpses lying on the ground, and there was no survivor.
translation:
  language: hi
  text: जब यहूदा जंगल की ओर के निगरानी-स्थान पर पहुँचा, तब वे उस भीड़ की ओर मुड़े; और देखो, भूमि पर शव पड़े हुए थे[a], और एक भी जीवित नहीं बचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “शव, भूमि पर गिरे हुए।”
    reason: मूल इब्रानी की अधिक शाब्दिक अभिव्यक्ति को दर्शाने के लिए।
lexical_decisions:
- source_word: וִיהוּדָה
  choice: यहूदा
  rationale: व्यक्तिवाचक नाम यहाँ सामूहिक रूप से यहूदा के लोगों या सेना को दर्शाता है। मूल में पहले एकवचन और फिर बहुवचन क्रिया का तनाव है; ‘यहूदा ... पहुँचा, तो उन्होंने’ उसे बनाए रखता है।
- source_word: עַל הַמִּצְפֶּה לַמִּדְבָּר
  choice: जंगल की ओर वाले निगरानी-स्थल पर
  rationale: מִצְפֶּה ऊँचे निगरानी-स्थान या चौकसी के बिंदु को दर्शाता है, और לַמִּדְבָּר उसकी दिशा जंगल की ओर बताता है।
- source_word: וַיִּפְנוּ אֶל הֶהָמוֹן
  choice: उन्होंने उस भीड़ की ओर देखा
  rationale: פנה का मूल भाव मुड़ना है, पर इस प्रसंग में दृष्टि या ध्यान उस जनसमूह की ओर करने का आशय है। ‘देखा’ स्वाभाविक हिन्दी में उस क्रिया का प्रसंगगत अर्थ देता है।
- source_word: וְהִנָּם
  choice: और देखो
  rationale: यह आकस्मिक दृश्य पर ध्यान खींचने वाला संकेत है; ‘और देखो’ उसकी कथात्मक तीव्रता बनाए रखता है।
- source_word: פְּגָרִים נֹפְלִים אַרְצָה
  choice: भूमि पर शव पड़े हुए थे
  rationale: פֶּגֶר मृत शरीर या शव है। नֹפְלִים אַרְצָה शाब्दिक रूप से भूमि की ओर गिरे हुए होने को बताता है; हिन्दी में ‘पड़े हुए थे’ परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֵין פְּלֵיטָה
  choice: एक भी जीवित न बचा था
  rationale: פְּלֵיטָה बच निकलने वाले या बचे हुए व्यक्ति को सूचित कर सकता है। युद्धभूमि के प्रसंग में यह वाक्य स्वाभाविक हिन्दी में बताता है कि कोई जीवित नहीं बचा।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘निगरानी-स्थल’ स्थलाकृतिक अर्थ स्पष्ट करता है, जबकि ‘और देखो’ मूल की आकस्मिकता और दृश्यात्मक बल को बनाए रखता है।
