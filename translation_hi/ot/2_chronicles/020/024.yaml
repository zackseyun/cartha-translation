revisions:
- from: जब यहूदा जंगल की ओर वाले निगरानी-स्थल पर पहुँचा, तो उन्होंने उस भीड़ की ओर देखा। और देखो, भूमि पर शव पड़े हुए थे[a], और एक भी जीवित न बचा था।
  to: जब यहूदा जंगल की ओर के निगरानी-स्थान पर पहुँचा, तब वे उस भीड़ की ओर मुड़े; और देखो, भूमि पर शव पड़े हुए थे[a], और एक भी जीवित नहीं बचा था।
  rationale: 'The revision preserves the Hebrew narrative sequence and the collective-singular/plural movement: ‘यहूदा’ arrives, then the people represented by Judah turn toward the multitude. It also makes the Hindi lookout expression more idiomatic. The footnote anchor remains attached to ‘शव पड़े हुए थे,’ where it explains the more literal participial wording.'
