  text: וַ/יְהִי֙ פַּ֣חַד אֱלֹהִ֔ים עַ֖ל כָּל מַמְלְכ֣וֹת הָ/אֲרָצ֑וֹת בְּ/שָׁמְעָ֕/ם כִּ֚י נִלְחַ֣ם יְהוָ֔ה עִ֖ם אוֹיְבֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/029.yaml
  text: And the fear of God came upon all the kingdoms of the lands when they heard that Yahweh had fought against the enemies of Israel[a].
translation:
  language: hi
  text: और जब सभी देशों के राज्यों ने सुना कि याहवे इस्राएल के शत्रुओं से लड़ा था, तब उन पर परमेश्वर का भय[a] छा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की ओर से आया आतंक।” इब्रानी पदबंध परमेश्वर की उपस्थिति या उसके कार्य से जुड़ा भय व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: छा गया
  rationale: यहाँ क्रिया किसी परिणामी अवस्था के आरम्भ को व्यक्त करती है। हिंदी में भय के संदर्भ में ‘छा गया’ स्वाभाविक है और कथा की घटनात्मक गति बनाए रखता है।
- source_word: פַּחַד אֱלֹהִים
  choice: परमेश्वर का भय
  rationale: यह रचना औपचारिक रूप से ‘परमेश्वर का भय’ है और परमेश्वर के प्रत्यक्ष कार्य से उत्पन्न दहशत का संकेत देती है। शब्दावली मूल की संभावित द्विअर्थता को बनाए रखती है।
- source_word: עַל כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: उन सभी देशों के राज्यों पर
  rationale: מַמְלְכוֹת का अर्थ ‘राज्य’ और बहुवचन הָאֲרָצוֹת का अर्थ ‘देश/प्रदेश’ है। प्रसंग आसपास के देशों की ओर संकेत करता है, न कि अनिवार्य रूप से समस्त पृथ्वी की ओर।
- source_word: בְּשָׁמְעָם
  choice: जब उन्होंने सुना
  rationale: पूर्वसर्ग सहित infinitive construct यहाँ कालगत परिस्थिति बताता है; आधुनिक हिंदी में यह सबसे स्पष्ट और स्वाभाविक रूप है।
- source_word: כִּי
  choice: कि
  rationale: ‘सुना’ के बाद यह सुनी गई बात की विषयवस्तु का परिचय देता है।
- source_word: נִלְחַם
  choice: लड़ा था
  rationale: पूर्ण क्रिया उस संपन्न कार्य को बताती है जिसकी खबर बाद में राज्यों ने सुनी; हिंदी का पूर्ण भूतकाल इस संबंध को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עִם
  choice: से
  rationale: לָחַם के साथ यह युद्ध में विरोधी पक्ष को चिह्नित करता है। हिंदी में ‘शत्रुओं से लड़ा’ स्वाभाविक रूप से विरोध का अर्थ देता है।
- source_word: אוֹיְבֵי יִשְׂרָאֵל
  choice: इस्राएल के शत्रुओं
  rationale: यह मूल संबंध-संरचना का सीधा और गरिमापूर्ण हिंदी रूप है।
theological_decisions:
- issue: पदबंध פַּחַד אֱלֹהִים का आशय
  choice: परमेश्वर का भय
  alternative: परमेश्वर की ओर से आया आतंक
  rationale: मुख्य पाठ में मूल संबंध-संरचना और उसकी धार्मिक गूंज सुरक्षित रखी गई है, जबकि पादटिप्पणी यह स्पष्ट करती है कि इब्रानी पदबंध परमेश्वर के कार्य से उत्पन्न आतंक भी सूचित कर सकता है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिंदी में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्यक्रम को हिंदी की स्वाभाविक सूचना-रचना के अनुसार रखा गया है, और ‘छा गया’ भय के अचानक व्यापक होने को स्पष्ट करता है।
