source:
  edition: WLC
  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹא סָ֑רוּ וְ/ע֤וֹד הָ/עָם֙ לֹא הֵכִ֣ינוּ לְבָבָ֔/ם לֵ/אלֹהֵ֖י אֲבֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/033.yaml
  text: However[a], the high places were not removed, and the people still had not set their hearts toward the God of their fathers.
translation:
  language: hi
  text: फिर भी पूजा के ऊँचे स्थान हटाए नहीं गए, और लोगों ने अब तक अपने मन को अपने पूर्वजों के परमेश्वर की ओर स्थिर नहीं किया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन को अपने पूर्वजों के परमेश्वर के लिए तैयार नहीं किया था।”
    reason: כון के हिफ़ील रूप में ‘स्थिर करना’ और ‘तैयार करना’ दोनों अर्थ संभव हैं; ל को दिशा अथवा उद्देश्य के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह यहोशापात के सकारात्मक मूल्यांकन के बाद शेष कमी को दिखाने वाला विरोधसूचक संक्रमण है।
- source_word: הַבָּמוֹת
  choice: पूजा के ऊँचे स्थान
  rationale: यह प्राचीन इस्राएल के ऊँचे पूजा-स्थलों के लिए प्रचलित धार्मिक पद को स्पष्ट करता है, पर हर स्थल की वैधता के विषय में आवश्यकता से अधिक निष्कर्ष नहीं निकालता।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: यद्यपि इब्रानी क्रिया का शाब्दिक भाव ‘दूर नहीं हुए’ है, प्रसंग में इसका स्वाभाविक अर्थ यह है कि वे पूजा-स्थल बने रहे और हटाए नहीं गए।
- source_word: וְעוֹד
  choice: अब तक
  rationale: यह उस अधूरी दशा के लगातार बने रहने का भाव व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यह समस्त प्रजा के लिए प्रयुक्त सामूहिक संज्ञा का स्वाभाविक हिन्दी रूप है।
- source_word: לֹא הֵכִינוּ לְבָבָם
  choice: अपने मन को ... की ओर स्थिर नहीं किया था
  rationale: כון के हिफ़ील रूप और ‘हृदय’ के मेल में तैयार करने, दृढ़ करने और दिशा लगाने के अर्थ संभव हैं। ‘मन को ... की ओर स्थिर करना’ जानबूझकर की गई भीतरी अभिमुखता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֵאלֹהֵי אֲבֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर की ओर
  rationale: ל यहाँ अभिमुखता का भाव देता है। ‘पूर्वजों के परमेश्वर’ वाचा और इतिहास से जुड़ा संदर्भ बनाए रखता है तथा आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: लोगों की कमी का स्वरूप
  choice: बाहरी धार्मिक सुधार अधूरा था और लोगों की भीतरी निष्ठा अब तक अपने पूर्वजों के परमेश्वर की ओर स्थिर नहीं हुई थी।
  alternative: लोगों ने आराधना के लिए केवल भावनात्मक तैयारी नहीं की थी; अथवा वे अनन्य आराधना में दृढ़ता से स्थापित नहीं हुए थे।
  rationale: पद ऊँचे पूजा-स्थलों के बने रहने को हृदय की दशा के साथ जोड़ता है। अनुवाद इसे केवल भावना या किसी बाद की सिद्धान्तगत श्रेणी तक सीमित नहीं करता, बल्कि मूल की व्यापक वाचागत अभिमुखता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘पूजा के ऊँचे स्थान’ ऐतिहासिक धार्मिक पद को स्पष्ट करता है; ‘पूर्वजों’ से मूल का वंशगत-वाचागत संबंध स्वाभाविक रूप में बना रहता है।
