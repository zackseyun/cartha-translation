source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֛רֶךְ אָבִ֥י/ו אָסָ֖א וְ/לֹא סָ֣ר מִמֶּ֑/נָּה לַ/עֲשׂ֥וֹת הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/032.yaml
  text: He walked in the way of his father Asa and did not turn aside from it, doing what was right in the eyes of Yahweh.
translation:
  language: hi
  text: वह अपने पिता आसा के मार्ग पर चला और उससे न हटा; वह याहवे की दृष्टि में जो सही था वही करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: मार्ग पर चला
  rationale: הלך और דרך के संयुक्त रूपक को बनाए रखते हुए यह राजकीय आचरण और जीवन-पद्धति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבִיו אָסָא
  choice: अपने पिता आसा के
  rationale: यह आसा को यहोशापात के पिता के रूप में स्पष्ट करता है और हिन्दी में स्वाभाविक संबंध-विन्यास रखता है।
- source_word: וְלֹא סָר מִמֶּנָּה
  choice: और उससे न हटा
  rationale: סור מן का अर्थ मार्ग से हटना है; यह पहले आए मार्ग-रूपक को बनाए रखता है। स्त्रीलिंग प्रत्यय का संदर्भ דרך से है, जो हिन्दी में 'उससे' द्वारा व्यक्त होता है।
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: उसने वही किया जो ... सही था
  rationale: लाम सहित क्रियार्थक संज्ञा यहाँ उसके मार्ग पर बने रहने का व्यवहारिक परिणाम या अभिव्यक्ति बताती है। स्वतंत्र उपवाक्य आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहवे की दृष्टि में
  rationale: यह इब्रानी के दैवी मूल्यांकन वाले मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; יְהוָה को उसके व्यक्तिवाचक वाचा-नाम 'यहवे' के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय व्यक्तिवाचक नाम सीधे उपस्थित है। 'यहवे' उसका प्रचलित विद्वत पुनर्निर्मित उच्चारण दर्शाता है और उसे उपाधि 'प्रभु' में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। 'मार्ग पर चला' मूल के आचरण-संबंधी रूपक को सुरक्षित रखता है। कोई पादटिप्पणी आवश्यक नहीं।
