  text: וַ/יָּקֻ֧מוּ הַ/לְוִיִּ֛ם מִן בְּנֵ֥י הַ/קְּהָתִ֖ים וּ/מִן בְּנֵ֣י הַ/קָּרְחִ֑ים לְ/הַלֵּ֗ל לַ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל בְּ/ק֥וֹל גָּד֖וֹל לְ/מָֽעְלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/019.yaml
  text: Then the Levites[a], from the sons of the Kohathites and from the sons of the Korahites, stood up to praise Yahweh, the God of Israel, with a very loud voice.
translation:
  language: hi
  text: तब कहातियों के वंशजों में से और कोरहियों के वंशजों में से लेवीय लोग इस्राएल के परमेश्वर यहवे की बहुत ऊँचे स्वर में[a] स्तुति करने के लिए उठ खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक रूप: “अत्यन्त ऊँचे स्वर में।” इब्रानी में “बड़े स्वर” के साथ आया शब्द आवाज़ की तीव्रता पर बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: खड़े हुए
  rationale: קום का यह रूप कथा में उठकर खड़े होने की ठोस क्रिया बताता है; ‘खड़े हुए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: הַלְוִיִּם
  choice: लेवीय लोग
  rationale: लेवी के गोत्र से संबंधित उपासना-सेवकों के लिए प्रचलित और सहज हिन्दी पद।
- source_word: מִן בְּנֵי הַקְּהָתִים וּמִן בְּנֵי הַקָּרְחִים
  choice: कहातियों और कोरहियों के वंशजों में से
  rationale: בני के वंश-संबंधी अर्थ को स्पष्ट करता है और दोनों कुल-नामों की समानांतर रचना बनाए रखता है।
- source_word: לְהַלֵּל
  choice: स्तुति करने लगे
  rationale: הלל का उद्देश्य स्तुति करना है; मुख्य क्रिया के साथ हिन्दी में ‘करने लगे’ कथात्मक प्रवाह को स्वाभाविक बनाता है, बिना गायन को अनावश्यक रूप से निर्दिष्ट किए।
- source_word: לַיהוָה
  choice: यहवे की
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम יהוה को नाम के रूप में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּקוֹל גָּדוֹל לְמָעְלָה
  choice: बहुत ऊँचे स्वर से
  rationale: בְּקוֹל גָּדוֹל आवाज़ की प्रबलता बताता है और לְמָעְלָה यहाँ उसे तीव्र करता है; यह रूप हिन्दी में ऊँची आवाज़ का भाव स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष है; ‘यहवे’ उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक उपासना के प्रसंग के अनुकूल रखी गई है। ‘वंशजों में से’ इब्रानी कुल-संबंध को सामान्य पाठक के लिए स्पष्ट करता है; पद की संभावित स्थानवाचक छाया को पादटिप्पणी में सुरक्षित रखा गया है।
