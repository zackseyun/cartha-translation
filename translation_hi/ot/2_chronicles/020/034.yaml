source:
  edition: WLC
  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י יְהוֹשָׁפָ֔ט הָ/רִאשֹׁנִ֖ים וְ/הָ/אַחֲרֹנִ֑ים הִנָּ֣/ם כְּתוּבִ֗ים בְּ/דִבְרֵי֙ יֵה֣וּא בֶן חֲנָ֔נִי אֲשֶׁ֣ר הֹֽעֲלָ֔ה עַל סֵ֖פֶר מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/034.yaml
  text: The rest of the acts of Jehoshaphat[a], the first and the last, behold, they are written in the records of Jehu son of Hanani[b], which are included in the Book of the Kings of Israel.
translation:
  language: hi
  text: यहोशापात के शेष काम—आरम्भ से अन्त तक—देखो, वे हनानी के पुत्र येहू के वृत्तान्त में लिखे हैं[a], जिसे इस्राएल के राजाओं की पुस्तक में सम्मिलित किया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हनानी के पुत्र येहू के लेख में’; इब्रानी में ‘हनानी के पुत्र येहू के शब्दों/वृत्तान्त में।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी उपवाक्य का शाब्दिक अर्थ लगभग ‘जिसे उसने इस्राएल के राजाओं की पुस्तक पर चढ़ाया’ है। सम्भवतः आशय है कि येहू का वृत्तान्त उस बड़े राजकीय ग्रन्थ में सम्मिलित किया गया था।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: यहोशापात के शेष काम
  rationale: राजकीय सारांशों में דִּבְרֵי केवल कथनों को नहीं, बल्कि राजा के कामों और शासनकाल की घटनाओं को सूचित करता है; ‘शेष काम’ इस सूत्र को सहज हिन्दी में व्यक्त करता है।
- source_word: הָרִאשֹׁנִים וְהָאַחֲרֹנִים
  choice: आरम्भ से अन्त तक
  rationale: शाब्दिक ‘पहले और बाद के’ पूरे शासनकाल को समेटने वाला युग्म है। ‘आरम्भ से अन्त तक’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: הִנָּם כְּתוּבִים
  choice: देखो, वे ... लिखे हैं
  rationale: ‘देखो’ הִנָּם के संकेतात्मक और बलात्मक भाव को बनाए रखता है, जबकि ‘लिखे हैं’ כְּתוּבִים का निकट रूप है।
- source_word: בְּדִבְרֵי יֵהוּא בֶן חֲנָנִי
  choice: हनानी के पुत्र येहू के वृत्तान्त में
  rationale: यहाँ דִּבְרֵי किसी लिखित स्रोत को दर्शाता है। ‘वृत्तान्त’ ‘वचन’ से अधिक स्पष्ट है, पर इसे किसी विशिष्ट अभिलेखीय विधा तक सीमित नहीं करता।
- source_word: אֲשֶׁר הֹעֲלָה עַל סֵפֶר מַלְכֵי יִשְׂרָאֵל
  choice: जिसे इस्राएल के राजाओं की पुस्तक में सम्मिलित किया गया है
  rationale: शाब्दिक रूप से क्रिया ‘ऊपर चढ़ाया/चढ़ा दिया’ है और वाक्यरचना कठिन है। सन्दर्भ में यह येहू के वृत्तान्त के बड़े राजकीय स्रोत में लिए जाने को सबसे स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणी शाब्दिक कठिनाई सुरक्षित रखती है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। ‘देखो’ मूल के बल को बचाता है; डैश सूत्रात्मक ‘आरम्भ से अन्त तक’ को स्पष्ट करते हैं। नामों के रूप ‘यहोशापात’, ‘हनानी’ और ‘येहू’ प्रचलित हिन्दी बाइबलीय लिप्यन्तरण के अनुरूप हैं।
