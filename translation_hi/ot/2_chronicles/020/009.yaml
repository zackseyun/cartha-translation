source:
  edition: WLC
  text: אִם תָּב֨וֹא עָלֵ֜י/נוּ רָעָ֗ה חֶרֶב֮ שְׁפוֹט֮ וְ/דֶ֣בֶר וְ/רָעָב֒ נַֽעַמְדָ֞ה לִ/פְנֵ֨י הַ/בַּ֤יִת הַ/זֶּה֙ וּ/לְ/פָנֶ֔י/ךָ כִּ֥י שִׁמְ/ךָ֖ בַּ/בַּ֣יִת הַ/זֶּ֑ה וְ/נִזְעַ֥ק אֵלֶ֛י/ךָ מִ/צָּרָתֵ֖/נוּ וְ/תִשְׁמַ֥ע וְ/תוֹשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/009.yaml
  text: If disaster comes upon us—sword[a], judgment, pestilence, or famine—we will stand before this house and before you, for your name is in this house, and we will cry out to you from our distress, and you will hear and save.
translation:
  language: hi
  text: यदि हम पर विपत्ति—तलवार, दण्ड, महामारी या अकाल—आ पड़े, तो हम इस भवन के सामने और आपके सामने खड़े होंगे, क्योंकि आपका नाम इस भवन में है। हम अपने संकट में आपको पुकारेंगे, और आप सुनेंगे और बचाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ शब्द नैतिक बुराई नहीं, बल्कि लोगों पर आनेवाली विनाशकारी आपदा को दर्शाता है; आगे दी गई विपत्तियों की सूची भी इसी अर्थ की पुष्टि करती है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: ठोस बिंब और इब्रानी सूची की संक्षिप्तता बनाए रखने के लिए ‘युद्ध’ जैसे अमूर्त रूप के बजाय मूल शब्द रखा गया है।
- source_word: שְׁפוֹט
  choice: न्याय-दण्ड
  rationale: इसे विपत्तियों की सूची में संज्ञा के रूप में समझा गया है। केवल ‘न्याय’ कानूनी प्रक्रिया का अर्थ दे सकता था; ‘न्याय-दण्ड’ दण्डात्मक न्याय का आशय अधिक स्पष्ट करता है, पर उसे केवल ‘सज़ा’ तक सीमित नहीं करता।
- source_word: דֶבֶר
  choice: महामारी
  rationale: यह व्यापक संक्रामक प्रकोप से होनेवाली विपत्ति का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: רָעָב
  choice: अकाल
  rationale: यह व्यक्तिगत भूख नहीं, बल्कि व्यापक खाद्य-संकट को दर्शाता है।
- source_word: נַעַמְדָה
  choice: हम ... खड़े होंगे
  rationale: शर्तवाचक प्रसंग में इस संकल्पसूचक रूप को भविष्य के आश्वासन के रूप में व्यक्त किया गया है।
- source_word: לִפְנֵי הַבַּיִת הַזֶּה
  choice: इस भवन के सामने
  rationale: ‘भवन’ मूल के ‘घर’ संबंधी शब्द और मंदिर-संदर्भ दोनों को गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘सामने’ प्रार्थना के स्थान को सहज रूप से बताता है।
- source_word: וּלְפָנֶיךָ
  choice: और आपके सामने
  rationale: भवन के सामने और परमेश्वर के सामने खड़े होने की मूल समानांतर रचना सुरक्षित रखी गई है।
- source_word: כִּי שִׁמְךָ בַּבַּיִת הַזֶּה
  choice: क्योंकि आपका नाम इस भवन में है
  rationale: परमेश्वर के नाम और भवन के संबंध वाला इब्रानी मुहावरा मुख्य पाठ में सुरक्षित है; उसके स्वामित्व, उपस्थिति या दावे में से किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
- source_word: וְנִזְעַק
  choice: हम ... पुकारेंगे
  rationale: यह संकट में की गई तीव्र विनती को सामान्य ‘प्रार्थना करेंगे’ की तुलना में अधिक सीधे व्यक्त करता है।
- source_word: מִצָּרָתֵנוּ
  choice: अपने संकट में से
  rationale: यह पुकार के संकट से उत्पन्न होने का भाव और मूल पूर्वसर्ग की स्रोत-संबंधी छाया दोनों बनाए रखता है।
- source_word: וְתִשְׁמַע וְתוֹשִׁיעַ
  choice: आप सुनेंगे और बचाएँगे
  rationale: दोनों क्रियाएँ अलग और सीधी रखी गई हैं; ‘बचाएँगे’ छुटकारे के तरीके को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ‘आपका नाम इस भवन में है’ में मंदिर और परमेश्वर के नाम का संबंध
  choice: मुख्य पाठ में इब्रानी मुहावरा ‘आपका नाम इस भवन में है’ बनाए रखा गया।
  alternative: ‘आपका नाम इस भवन पर है,’ अर्थात यह भवन आपके नाम से कहलाता है।
  rationale: यह मुहावरा मंदिर से जुड़े परमेश्वर के वाचा-संबंधी दावे और उपस्थिति को व्यक्त करता है। उसे केवल स्वामित्व या केवल स्थानीय उपस्थिति के अर्थ में सीमित न करके मूल theological tension सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘भवन’ मंदिर के लिए प्रयुक्त मूल ‘घर’ की छवि को बनाए रखता है, जबकि ‘न्याय-दण्ड’ दुर्लभ इब्रानी सूची को अत्यधिक सरल किए बिना समझने योग्य बनाता है। पाद-टिप्पणी का चिह्न उसी नाम-विषयक वाक्यांश पर रखा गया है जिससे उसका वास्तविक संबंध है।
