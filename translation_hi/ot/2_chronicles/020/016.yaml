base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/016.yaml
  text: Tomorrow go down against them. Look[a], they are coming up by the ascent of Ziz, and you will find them at the end of the wadi, before the wilderness of Jeruel.
translation:
  language: hi
  text: कल उनके विरुद्ध नीचे जाओ। देखो, वे सीस की चढ़ाई पर चढ़ते हुए आ रहे हैं, और तुम उन्हें नाले[a] के छोर पर, यरूएल के निर्जन प्रदेश के सामने पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घाटी” अथवा “मौसमी जलधारा।” इब्रानी נחל ऐसी घाटी या जलमार्ग को दर्शा सकता है जिसमें पानी केवल वर्षा के समय बहता हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָחָר
  choice: कल
  rationale: यह समयसूचक क्रियाविशेषण है; मूल पाठ में प्रातः का उल्लेख नहीं है।
- source_word: רְדוּ עֲלֵיהֶם
  choice: उनके विरुद्ध नीचे जाओ
  rationale: बहुवचन आज्ञार्थक क्रिया की दिशात्मकता और सैन्य प्रसंग में עַל के विरोधात्मक भाव, दोनों को सुरक्षित रखता है।
- source_word: הִנָּם
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले इस संकेतक का आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: עֹלִים בְּמַעֲלֵה הַצִּיץ
  choice: वे सीस की चढ़ाई से ऊपर आ रहे हैं
  rationale: चल रही या निकट भविष्य की गति तथा स्थलाकृतिक चढ़ाई का भाव बनाए रखता है; ציץ को स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: וּמְצָאתֶם אֹתָם
  choice: और तुम उन्हें ... पाओगे
  rationale: आज्ञा के बाद आने वाले अपेक्षित परिणाम को सीधे रूप में व्यक्त करता है।
- source_word: בְּסוֹף הַנַּחַל
  choice: नाले के छोर पर
  rationale: סוֹף की अंतिम सीमा और נַחַל की घाटी अथवा मौसमी जलधारा वाली भौगोलिक धारणा को संक्षेप में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: פְּנֵי מִדְבַּר יְרוּאֵל
  choice: यरूएल के निर्जन प्रदेश के सामने
  rationale: स्थान-संबंधी פְּנֵי को 'सामने' और מִדְבָּר को रेतीले मरुस्थल तक सीमित न करके 'निर्जन प्रदेश' कहा गया है।
