  text: וַ/יִּוָּעַץ֙ אֶל הָ/עָ֔ם וַ/יַּעֲמֵ֤ד מְשֹֽׁרֲרִים֙ לַ/יהוָ֔ה וּֽ/מְהַֽלְלִ֖ים לְ/הַדְרַת קֹ֑דֶשׁ בְּ/צֵאת֙ לִ/פְנֵ֣י הֶֽ/חָל֔וּץ וְ/אֹֽמְרִים֙ הוֹד֣וּ לַ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/021.yaml
  text: After consulting with the people[a], he appointed singers to Yahweh, who praised the splendor of holiness as they went out before the vanguard, saying, “Give thanks to Yahweh[c][b], for his steadfast love endures forever.”
translation:
  language: hi
  text: 'लोगों से परामर्श करने के बाद, उसने यहोवा के लिए गायकों को नियुक्त किया, जो पवित्रता के वैभव[a] की स्तुति करते हुए अग्रिम दल[b] के आगे-आगे जा रहे थे और कह रहे थे,


    “यहोवा का धन्यवाद करो,

    क्योंकि उसका अटल प्रेम[c] सदा बना रहता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “पवित्र वैभव” या “पवित्रता की सुंदरता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “आगे बढ़नेवाला सैन्य-दल” अथवा “अगली पंक्ति।”
    reason: lexical_alternative
  - marker: c
    text: या “दया” अथवा “वाचाई निष्ठा।” इब्रानी חֶסֶד में अटल प्रेम, दया और वाचा-संबंधी निष्ठा के भाव शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ אֶל־הָעָם
  choice: लोगों से सलाह करने के बाद
  rationale: निफ़ाल रूप यहाँ लोगों के साथ परामर्श करने का भाव देता है; यह चुनाव क्रम और जन-सहभागिता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किया
  rationale: हिफ़ील में इसका अर्थ खड़ा करना, तैनात करना या नियुक्त करना हो सकता है। यहाँ उपासना के लिए गायकों को दायित्व देने के संदर्भ में ‘नियुक्त किया’ सबसे उपयुक्त है।
- source_word: מְשֹׁרֲרִים
  choice: गानेवालों
  rationale: यह शब्द विशेष रूप से गायकों को सूचित करता है, सामान्य रूप से सभी संगीतकारों को नहीं।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ सेवा अथवा गायन के लक्ष्य को दर्शाता है; ‘के लिए’ सहज हिन्दी है।
- source_word: וּמְהַלְלִים לְהַדְרַת־קֹדֶשׁ
  choice: पवित्रता के वैभव की स्तुति करते हुए
  rationale: यह वाक्यांश गायकों की क्रिया को बताता है और הדרת קדש की औपचारिक निकटता बनाए रखता है; इसकी वैकल्पिक समझ फुटनोट में दी गई है।
- source_word: בְּצֵאת לִפְנֵי הֶחָלוּץ
  choice: अग्रिम सैन्य-दल के आगे निकले
  rationale: בְּצֵאת समकालिक गति को और הֶחָלוּץ आगे बढ़नेवाले सशस्त्र दल को दर्शाता है।
- source_word: הוֹדוּ לַיהוָה
  choice: यहोवा का धन्यवाद करो
  rationale: उपासना के संदर्भ में ידה का हिफ़ील धन्यवाद या प्रशंसा व्यक्त करता है; अगले कारणवाचक वाक्य के कारण ‘धन्यवाद करो’ सटीक है।
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: क्योंकि उसका अटल प्रेम सदा बना रहता है
  rationale: חֶסֶד में स्थिर प्रेम, निष्ठा और दया के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ मुख्य अर्थ को सहज हिन्दी में व्यक्त करता है; ‘बना रहता है’ क्रियारहित इब्रानी वाक्य को स्वाभाविक रूप से पूरा करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה है। ‘यहोवा’ हिन्दी पाठकों में पहचाना जानेवाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: חֶסֶד का अर्थ-क्षेत्र
  choice: अटल प्रेम
  alternative: करुणा; सच्ची निष्ठा; वाचा का प्रेम
  rationale: शब्द में प्रेम, दया और निष्ठा के भाव एक साथ हो सकते हैं। मुख्य पाठ किसी एक संकीर्ण सिद्धान्तगत अर्थ को थोपे बिना इसकी स्थिरता पर बल देता है, और फुटनोट अन्य वास्तविक अर्थों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज शैली रखी गई है। पद्यात्मक उद्घोष को अलग पंक्तियों में रखा गया है। ‘अग्रिम सैन्य-दल’ युद्ध-संदर्भ को स्पष्ट करता है, जबकि कठिन इब्रानी उपासना-वाक्यांश की वास्तविक अस्पष्टता फुटनोट में सुरक्षित है।
