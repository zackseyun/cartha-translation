  text: तब यहोशापात डर गया[a] और उसने याहवे की खोज करने की ठान ली[b]। उसने पूरे यहूदा में उपवास की घोषणा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “भयभीत हो गया” भी हो सकता है; इब्रानी क्रिया कथानक के क्रम में भय उत्पन्न होने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपना मुख ... की ओर किया।” यह मुहावरा किसी उद्देश्य की ओर जान-बूझकर और दृढ़ता से मुड़ने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
