- source_word: לִדְרוֹשׁ
  choice: खोज करने
  rationale: דרש यहाँ सहायता और मार्गदर्शन के लिए परमेश्वर की ओर मुड़ने का व्यापक भाव रखता है; ‘खोज करने’ उस अर्थ को केवल पूछताछ तक सीमित नहीं करता।
- source_word: לַיהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निज नाम יהוה को उसके वाचा-संबंधी नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּקְרָא צוֹם
  choice: उपवास की घोषणा करवाई
  rationale: यह राजकीय सार्वजनिक घोषणा का भाव व्यक्त करता है; कर्तृवाच्य प्रयोजक रूप हिन्दी में राजा द्वारा पूरे क्षेत्र में घोषणा करवाने के प्रसंग के अनुकूल है।
- source_word: עַל כָּל יְהוּדָה
  choice: पूरे यहूदा में
  rationale: यह घोषणा के सम्पूर्ण यहूदा पर लागू होने और उसके व्यापक भौगोलिक-सामुदायिक विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में ईश्वर का निज वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
