  rationale: यह ירא के सामान्य अर्थ ‘डरना’ को स्वाभाविक हिन्दी में व्यक्त करता है और कथानक में भय उत्पन्न होने की सम्भावना को भी बनाए रखता है।
- source_word: וַיִּתֵּן ... אֶת־פָּנָיו
