source:
  edition: WLC
  text: וּ/בַ/יּ֣וֹם הָ/רְבִעִ֗י נִקְהֲלוּ֙ לְ/עֵ֣מֶק בְּרָכָ֔ה כִּי שָׁ֖ם בֵּרֲכ֣וּ אֶת יְהוָ֑ה עַל כֵּ֡ן קָֽרְא֞וּ אֶת שֵׁ֨ם הַ/מָּק֥וֹם הַ/ה֛וּא עֵ֥מֶק בְּרָכָ֖ה עַד הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/026.yaml
  text: On the fourth day they assembled in the Valley of Beracah[a], because there they blessed Yahweh. Therefore they called the name of that place the Valley of Beracah to this day.
translation:
  language: hi
  text: चौथे दिन वे बराका की घाटी[a] में इकट्ठे हुए, क्योंकि वहाँ उन्होंने यहवे को धन्य कहा। इसलिए उन्होंने उस स्थान का नाम बराका की घाटी रखा, और आज तक उसका यही नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बराका” का अर्थ “आशीष” है।
    reason: स्थान-नाम בְּרָכָה का अर्थ स्पष्ट करता है और ‘धन्य कहा’ के साथ हिब्रू शब्दालंकार को समझने में सहायता देता है।
lexical_decisions:
- source_word: נִקְהֲלוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ लोगों के एक साथ जमा होने का अकर्मक भाव व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: עֵמֶק בְּרָכָה
  choice: बराका की घाटी
  rationale: עֵמֶק का अर्थ ‘घाटी’ है और בְּרָכָה को स्थान-नाम के रूप में लिप्यंतरित किया गया है; अर्थ-संबंध पादटिप्पणी और अगले वाक्य के ‘धन्य कहा’ से सुरक्षित रहता है।
- source_word: בֵּרֲכוּ
  choice: धन्य कहा
  rationale: यह प्रयोग यहवे की स्तुति करने या उन्हें धन्य कहने को दर्शाता है। ‘धन्य कहा’ मूल בְּרָכָה के साथ शब्द-संबंध को ‘आशीर्वाद दिया’ की अपेक्षा अधिक उपयुक्त ढंग से बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; इसलिए उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: קָרְאוּ אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम ... रखा
  rationale: हिब्रू नामकरण-वाक्य का अर्थ आधुनिक हिन्दी के स्वाभाविक मुहावरे में व्यक्त किया गया है।
- source_word: עַד הַיּוֹם
  choice: आज तक
  rationale: यह स्थायी नाम के लेखक के समय तक चले आने का मानक हिब्रू मुहावरा है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- issue: मनुष्यों द्वारा यहवे को ‘धन्य’ कहने का भाव
  choice: यहवे को धन्य कहा
  alternative: यहवे की स्तुति की / यहवे को आशीर्वाद दिया
  rationale: ‘धन्य कहा’ मूल क्रिया और स्थान-नाम בְּרָכָה के शब्दालंकार को बनाए रखता है, साथ ही हिन्दी में यह स्पष्ट करता है कि लोग परमेश्वर की प्रशंसा कर रहे थे, उन्हें कोई वरदान प्रदान नहीं कर रहे थे।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। स्थान-नाम का लिप्यंतरण किया गया है, जबकि उसके अर्थ और पद के शब्दालंकार को पादटिप्पणी में बताया गया है। अंतिम हिब्रू मुहावरे को अधिक स्वाभाविक हिन्दी में ‘और आज तक उसका यही नाम है’ के रूप में व्यक्त किया गया है।
