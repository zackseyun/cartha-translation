  text: וַ/תִּשְׁקֹ֖ט מַלְכ֣וּת יְהוֹשָׁפָ֑ט וַ/יָּ֧נַֽח ל֦/וֹ אֱלֹהָ֖י/ו מִ/סָּבִֽיב׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/030.yaml
  text: So the kingdom of Jehoshaphat was at peace[a], and his God gave him rest all around.
translation:
  language: hi
  text: इस प्रकार यहोशापात का राज्य शांत रहा[a], और उसके परमेश्वर ने उसे चारों ओर से विश्राम दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोशापात का राज्य निर्विघ्न रहा’।
    reason: שׁקט शांत, निश्चिंत या उपद्रवरहित रहने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: शांत रहा
  rationale: שׁקט का अर्थ शांत, निर्विघ्न या शांति में होना है। राज्य को कर्ता बनाए रखते हुए ‘शांत रहा’ स्वाभाविक और स्रोत के निकट है।
- source_word: מַלְכוּת
  choice: राज्य
  rationale: यह संज्ञा यहोशापात के राज्य या राज्यक्षेत्र को दर्शाती है; ऐतिहासिक संदर्भ में ‘राज्य’ मानक और सहज है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: नाम का रूप प्रचलित हिन्दी बाइबलीय वर्तनी के अनुसार लिप्यंतरित किया गया है।
- source_word: וַיָּנַח
  choice: विश्राम दिया
  rationale: 'נוח का हिफ़ील रूप यहाँ कारणवाचक है: परमेश्वर ने उसे विश्राम की स्थिति प्रदान की। ‘विश्राम दिया’ इस भाव को स्पष्ट और संक्षिप्त रखता है।'
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: सप्रत्यय रूप का सीधा अर्थ ‘उसका परमेश्वर’ है और संदर्भ यहोशापात की ओर संकेत करता है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह पद आसपास की हर दिशा से मिलने वाली सुरक्षा और विश्राम को व्यक्त करता है; ‘चारों ओर से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַ
  choice: और
  rationale: दूसरे खंड के आरंभिक वाव को ‘और’ से अनूदित किया गया है, ताकि इब्रानी समन्वय बना रहे और व्याख्यात्मक कारण-संबंध अनावश्यक रूप से न जोड़ा जाए।
theological_decisions:
- issue: राज्य की शांति में परमेश्वर की भूमिका
  choice: 'दोनों कथनों को ‘और’ से जोड़ा गया है: राज्य शांत रहा, और परमेश्वर ने यहोशापात को चारों ओर से विश्राम दिया।'
  alternative: 'दूसरे खंड को स्पष्ट कारण के रूप में जोड़ना: ‘क्योंकि उसके परमेश्वर ने…’।'
  rationale: पाठ शांति और परमेश्वर द्वारा दिए गए विश्राम को साथ रखता है, पर इब्रानी संयोजक स्वयं कारण-सूचक संबंध को स्पष्ट नहीं करता। ‘और’ दैवी कर्तृत्व को बनाए रखते हुए इस संबंध की संभावित अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विश्राम दिया’ ऐतिहासिक सुरक्षा और संघर्ष से राहत के बाइबलीय भाव को बनाए रखता है।
