base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/028.yaml
  text: And they came to Jerusalem with harps and lyres and trumpets[b][a], to the house of Yahweh.
translation:
  language: hi
  text: तब वे हार्पों[a], लायरों और तुरहियों के साथ यरूशलेम में याहवे के भवन में पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ल्यूट जैसे वाद्यों के साथ।’ नबाल नाम के प्राचीन तार-वाद्य का ठीक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब वे ... आए
  rationale: वाव-क्रमसूचक रूप कथा की अगली घटना बताता है। ‘तब’ क्रम को स्वाभाविक हिंदी में व्यक्त करता है और ‘आए’ בוא के सामान्य गतिसूचक अर्थ को बनाए रखता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिंदी में प्रचलित लिप्यंतरण।
- source_word: בִּנְבָלִים
  choice: वीणाओं
  rationale: נבל तार वाला प्राचीन वाद्य था, जिसे प्रायः हार्प या ल्यूट-जैसा माना जाता है। ‘वीणा’ हिंदी में सुबोध पारंपरिक समतुल्य है; वाद्य की ठीक पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וּבְכִנֹּרוֹת
  choice: सारंगियों
  rationale: כִּנּוֹר को נבל से अलग तार-वाद्य के रूप में प्रस्तुत करने के लिए अलग हिंदी शब्द चुना गया है। यह आधुनिक सारंगी से पूर्ण ऐतिहासिक समानता का दावा नहीं करता; इसीलिए साझा पादटिप्पणी दी गई है।
- source_word: וּבַחֲצֹצְרוֹת
  choice: और तुरहियों
  rationale: חֲצֹצְרָה उपासना में प्रयुक्त तुरही को दर्शाता है। इस पद में ‘चाँदी की’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: אֶל בֵּית יְהוָה
  choice: याहवे के भवन तक
  rationale: אֶל गंतव्य की ओर गति बताता है और בֵּית का शाब्दिक बिंब ‘भवन’ से बना रहता है। ‘तक’ हिंदी में पूरे वाक्य को स्वाभाविक बनाता है; ‘मंदिर’ अर्थगत विकल्प के रूप में पादटिप्पणी में है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम YHWH का हिंदी लिप्यंतरण, किसी उपाधि से प्रतिस्थापन नहीं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक पारंपरिक वैकल्पिक उच्चारण है।
- issue: בֵּית יְהוָה का रूप
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: ‘भवन’ मूल के ‘घर/भवन’ वाले रूपक को बनाए रखता है। प्रसंग में ‘मंदिर’ आशय स्पष्ट कर सकता है, पर वह अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाद्यों के लिए परिचित हिंदी शब्द प्रयुक्त हैं, पर प्राचीन वाद्यों से उनकी पूर्ण समानता न मानते हुए अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
