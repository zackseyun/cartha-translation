source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד יְהוֹשָׁפָ֗ט בִּ/קְהַ֧ל יְהוּדָ֛ה וִ/ירוּשָׁלִַ֖ם בְּ/בֵ֣ית יְהוָ֑ה לִ/פְנֵ֖י הֶ/חָצֵ֥ר הַ/חֲדָשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/005.yaml
  text: And Jehoshaphat stood in the assembly of Judah and Jerusalem[a], in the house of Yahweh, before the new court.
translation:
  language: hi
  text: तब यहोशापात यहूदा और यरूशलेम की सभा में, याहवे के भवन में, नए आँगन[क] के सामने खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, नया प्रांगण।
    reason: हिब्रू חָצֵר मंदिर-परिसर के आँगन या प्रांगण को सूचित कर सकता है; यह अंग्रेज़ी audit trail के ‘court/courtyard’ विकल्प को प्रतिबिंबित करता है।
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: यह क्रिया कथा में एक साधारण भूतकालीन कार्य बताती है; ‘खड़ा हुआ’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קהל एकत्र हुए समुदाय को दर्शाता है और ב का स्थानवाचक अर्थ ‘में’ स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम
  rationale: मूल के दोनों स्थान/समुदाय-सूचक नाम बिना विस्तार के सीधे रखे गए हैं।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ हिब्रू ‘घर’ की उपासना-स्थल संबंधी अभिव्यक्ति को बनाए रखता है और हिन्दी में गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यहाँ इसका स्थानवाचक अर्थ है; ‘के सामने’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: הֶחָצֵר הַחֲדָשָׁה
  choice: नए आँगन
  rationale: חָצֵר मंदिर-परिसर के खुले आँगन को दर्शाता है; ‘आँगन’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘याहवे के भवन’ से मूल हिब्रू मुहावरा सुरक्षित रखा गया है, जबकि ‘नए आँगन’ मंदिर-परिसर के स्थान को सामान्य पाठक के लिए स्पष्ट करता है।
