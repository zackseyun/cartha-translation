base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/010.yaml
  text: And now[a], behold, the people of Ammon and Moab and Mount Seir[b], whom you did not allow Israel to enter against when they came from the land of Egypt—for they turned away from them and did not destroy them—
translation:
  language: hi
  text: और अब, देख, अम्मोन और मोआब के लोग और सेईर पर्वत के निवासी[a]—जिनके विरुद्ध तूने इस्राएलियों को मिस्र देश से आते समय जाने की अनुमति नहीं दी थी—क्योंकि वे उनसे हट गए और उन्होंने उनका नाश नहीं किया—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अम्मोन की सन्तान और मोआब और सेईर पर्वत।” यहाँ इन नामों से सम्बद्ध लोगों का आशय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה הִנֵּה
  choice: और अब देख
  rationale: संयोजक, वर्तमान स्थिति की ओर संकेत और शिकायत के बल—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּנֵי עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר
  choice: अम्मोन और मोआब के लोग और सेईर पर्वत के निवासी
  rationale: शाब्दिक संरचना असमान है और जातियों/क्षेत्र को साथ रखती है। हिन्दी में आशय स्पष्ट करने के लिए लोगों और निवासियों का प्रयोग किया गया, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר לֹא נָתַתָּה לְיִשְׂרָאֵל לָבוֹא בָהֶם
  choice: जिनके विरुद्ध तूने इस्राएलियों को ... जाने की अनुमति नहीं दी थी
  rationale: ‘जाने देना’ वाले इब्रानी मुहावरे और בָהֶם के विरोधात्मक/सैन्य संदर्भ को बनाए रखता है, पर मुख्य पाठ में ‘आक्रमण’ जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: בְּבֹאָם מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से आते समय
  rationale: कालवाचक infinitive construct का सहज और निकट हिन्दी रूप।
- source_word: כִּי סָרוּ מֵעֲלֵיהֶם
  choice: इसलिए वे उनसे मुड़ गए
  rationale: यहाँ כִּי पूर्व कथन के परिणाम/स्पष्टीकरण की ओर ले जाता है; ‘मुड़ गए’ इस्राएल द्वारा अपना मार्ग बदलने को व्यक्त करता है।
- source_word: וְלֹא הִשְׁמִידוּם
  choice: और उन्होंने उनका नाश नहीं किया
  rationale: हिफ़ील रूप के युद्ध-संदर्भ वाले प्रबल विनाशार्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर को सीधे द्वितीय पुरुष में संबोधन
  choice: तूने ... अनुमति नहीं दी थी
  alternative: यहोवा ने ... अनुमति नहीं दी थी
  rationale: यह पद परमेश्वर से की जा रही सीधी प्रार्थना का भाग है। इब्रानी द्वितीय पुरुष को बनाए रखने से संबोधन की निकटता रहती है और कोई ईश्वरीय नाम अनावश्यक रूप से नहीं जोड़ा जाता।
- issue: सैन्य प्रवेश के अर्थ की स्पष्टता
  choice: जिनके विरुद्ध ... जाने
  alternative: उन पर आक्रमण करने
  rationale: संदर्भ सैन्य है, पर मूल वाक्यांश शाब्दिक रूप से ‘उनमें/उनके विरुद्ध प्रवेश करना’ कहता है। मुख्य पाठ मूल की अभिव्यक्ति को अधिक निकटता से रखता है और पादटिप्पणी संभावित सैन्य आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए ‘तू’ प्रत्यक्ष एकवचन इब्रानी संबोधन को दर्शाता है। पद अगले कथन में जारी रहता है, इसलिए अंत में दीर्घ डैश रखा गया है।
