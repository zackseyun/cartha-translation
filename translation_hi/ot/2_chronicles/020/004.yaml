base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/004.yaml
  text: And Judah gathered together to seek Yahweh[b][a]; they even came from all the cities of Judah to seek Yahweh.
translation:
  language: hi
  text: यहूदा के लोग याहवे से सहायता माँगने के लिए इकट्ठे हुए[a]; और यहूदा के सभी नगरों से लोग भी याहवे की खोज करने आए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “याहवे से माँगने के लिए”; क्या माँगा गया, यह वाक्य में नहीं बताया गया है। प्रसंग में आशय सहायता या छुटकारे से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ “याहवे की खोज करने” के लिए पहले खंड की अपेक्षा थोड़ी भिन्न व्याकरणिक रचना प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ יְהוּדָה
  choice: यहूदा के लोग ... इकट्ठे हुए
  rationale: निफ़ाल क्रिया सामूहिक रूप से एकत्र होने को व्यक्त करती है। यहाँ ‘यहूदा’ राज्य के लोगों का सामूहिक संकेत है, इसलिए स्वाभाविक हिन्दी में ‘यहूदा के लोग’ कहा गया है।
- source_word: לְבַקֵּשׁ מֵיְהוָה
  choice: याहवे से सहायता माँगने के लिए
  rationale: בקשׁ के साथ מִן की रचना का शाब्दिक अर्थ ‘याहवे से माँगना/खोजना’ है; प्रसंग में माँगी जाने वाली बात सहायता या छुटकारा है। मुख्य पाठ में यह निहित आशय स्पष्ट किया गया है और पादटिप्पणी में अधिक शाब्दिक रूप रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: גַּם
  choice: यहाँ तक कि
  rationale: यह पद दूसरे खंड पर बल देता है और पूरे यहूदा के नगरों से व्यापक सहभागिता को उभारता है।
- source_word: מִכָּל עָרֵי יְהוּדָה
  choice: यहूदा के सभी नगरों से
  rationale: यह स्रोत-वाक्यांश की व्यापकता को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּאוּ לְבַקֵּשׁ אֶת יְהוָה
  choice: लोग याहवे की खोज करने आए
  rationale: בוא का सीधा अर्थ ‘आना’ है। यहाँ בקשׁ के साथ सीधा कर्म-सूचक אֵת है, इसलिए पहले खंड से भिन्न रचना को ‘याहवे की खोज करने’ द्वारा सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को शीर्षक से बदलने के बजाय उसका प्रचलित विद्वतापूर्ण लिप्यंतरण रखा गया है।
- issue: בקשׁ की दोनों भिन्न इब्रानी रचनाओं को समान करना या उनका अंतर बनाए रखना
  choice: पहले खंड में ‘याहवे से सहायता माँगने’, दूसरे में ‘याहवे की खोज करने’
  alternative: दोनों स्थानों पर ‘याहवे की खोज करने’
  rationale: पहले खंड में מִן (‘से’) और दूसरे में אֵת (सीधे कर्म का चिह्न) है। भिन्न हिन्दी अभिव्यक्तियाँ सहायता के लिए याहवे की ओर मुड़ने और स्वयं याहवे को खोजने के बीच पाठ में उपस्थित तनाव व सूक्ष्म अंतर को बनाए रखती हैं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यहूदा’ के सामूहिक प्रयोग को हिन्दी पाठक के लिए ‘यहूदा के लोग’ से स्पष्ट किया गया है। अर्धविराम दोनों निकट संबद्ध खंडों को जोड़ते हुए उनकी अलग-अलग अभिव्यक्ति बनाए रखता है।
