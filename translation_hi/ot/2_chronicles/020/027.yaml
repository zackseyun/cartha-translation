  text: וַ֠/יָּשֻׁבוּ כָּל אִ֨ישׁ יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ וִֽ/יהוֹשָׁפָ֣ט בְּ/רֹאשָׁ֔/ם לָ/שׁ֥וּב אֶל יְרוּשָׁלִַ֖ם בְּ/שִׂמְחָ֑ה כִּֽי שִׂמְּחָ֥/ם יְהוָ֖ה מֵֽ/אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/027.yaml
  text: Then all the men of Judah and Jerusalem returned[a], with Jehoshaphat at their head, to return to Jerusalem with joy[b], because Yahweh had made them rejoice over their enemies.
translation:
  language: hi
  text: तब यहूदा और यरूशलेम के सभी पुरुष, और यहोशापात उनके आगे था, आनन्द के साथ यरूशलेम लौटने के लिए वापस मुड़े, क्योंकि याहवे ने उन्हें उनके शत्रुओं पर आनन्दित किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ ... לָשׁוּב אֶל־יְרוּשָׁלִַם
  choice: यरूशलेम लौटे
  rationale: एक ही मूल שוב की पुनरावृत्ति लौटने की गति और उद्देश्य पर बल देती है। हिन्दी में ‘लौटने के लिए लौटे’ अस्वाभाविक है, इसलिए अर्थ और बल को स्वाभाविक रूप से एक ही क्रिया में व्यक्त किया गया; पादटिप्पणी शाब्दिक पुनरावृत्ति बताती है।
- source_word: כָּל אִישׁ יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम के सभी पुरुष
  rationale: शाब्दिक रूप से ‘हर पुरुष’ एक वितरणात्मक सामूहिक प्रयोग है। ‘सभी पुरुष’ हिन्दी में पूरे पुरुष-समूह को स्वाभाविक और लिंग-सटीक ढंग से व्यक्त करता है।
- source_word: וִיהוֹשָׁפָט בְּרֹאשָׁם
  choice: यहोशापात के नेतृत्व में
  rationale: ‘उनके सिर पर’ का इब्रानी मुहावरा अगुवाई अथवा दल के आगे होने को दर्शाता है; ‘के नेतृत्व में’ आधुनिक हिन्दी में यही आशय स्पष्ट करता है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द के साथ
  rationale: संज्ञात्मक रूप और लौटने के उल्लासपूर्ण ढंग, दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय निज नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: שִׂמְּחָם ... מֵאוֹיְבֵיהֶם
  choice: उनके शत्रुओं पर उन्हें आनन्दित किया था
  rationale: पिएल रूप का कारक अर्थ ‘आनन्दित किया’ से सुरक्षित रहता है। מן को प्रसंगानुसार विजय/उल्लास के विषय के अर्थ में ‘शत्रुओं पर’ अनूदित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निज नाम है। हिन्दी बाइबल-परम्परा में सहज पहचाने जाने वाले प्रतिलेखन ‘यहोवा’ से नाम और उपाधि का भेद सुरक्षित रहता है।
- issue: מֵאֹיְבֵיהֶם में מן का सम्बन्ध
  choice: उनके शत्रुओं पर
  alternative: उनके शत्रुओं से; उनके शत्रुओं के कारण
  rationale: व्याकरणतः מן के एक से अधिक सम्बन्ध सम्भव हैं, पर युद्ध-विजय के प्रसंग में शत्रुओं पर हुए जयजनित आनन्द का अर्थ सर्वाधिक उपयुक्त है; इसे ऐसी व्याख्या तक नहीं बढ़ाया गया कि शत्रु स्वयं आनन्द का कारण थे।
- issue: כָּל אִישׁ का सामूहिक और पुरुषवाचक स्वरूप
  choice: सभी पुरुष
  alternative: हर पुरुष; सभी लोग
  rationale: אִישׁ के स्पष्ट पुरुषवाचक रूप को बनाए रखते हुए उसके वितरणात्मक सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय और सामान्य पाठक के लिए सुबोध। ‘आनन्द’ धार्मिक-साहित्यिक प्रसंग में परिचित है; वाक्य-रचना को हिन्दी में स्वाभाविक रखने के लिए अगुवाई वाला पद मुख्य कर्ता के साथ रखा गया है।
