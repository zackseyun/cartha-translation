source:
  edition: WLC
  text: וְ/יַחֲזִיאֵ֡ל בֶּן זְכַרְיָ֡הוּ בֶּן בְּ֠נָיָה בֶּן יְעִיאֵ֧ל בֶּן מַתַּנְיָ֛ה הַ/לֵּוִ֖י מִן בְּנֵ֣י אָסָ֑ף הָיְתָ֤ה עָלָי/ו֙ ר֣וּחַ יְהוָ֔ה בְּ/ת֖וֹךְ הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/014.yaml
  text: And Jahaziel son of Zechariah, son of Benaiah, son of Jeiel, son of Mattaniah, the Levite, from the sons of Asaph—the Spirit of Yahweh came upon him in the midst of the assembly.
translation:
  language: hi
  text: तब आसाप के वंशजों में से लेवीय यहजीएल पर—जो जकर्याह का पुत्र, बनायाह का पुत्र, यीएल का पुत्र और मत्तन्याह का पुत्र था—सभा के बीच यहोवा की आत्मा आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַחֲזִיאֵל
  choice: तब ... यहजीएल
  rationale: वाव कथा को आगे बढ़ाता है; हिन्दी में ‘तब’ प्रसंगगत संबंध को स्वाभाविक रूप से व्यक्त करता है। नाम का लिप्यंतरण ‘यहजीएल’ किया गया है।
- source_word: בֶּן זְכַרְיָהוּ בֶּן בְּנָיָה בֶּן יְעִיאֵל בֶּן מַתַּנְיָה
  choice: मत्तन्याह के पुत्र यीएल के पुत्र बनायाह के पुत्र जकर्याह के पुत्र
  rationale: हिब्रू की चार पीढ़ियों वाली वंशावली को पूरा रखा गया है। हिन्दी में संबंध स्पष्ट रखने के लिए क्रम को स्वाभाविक रूप से पूर्वज से यहजीएल की ओर व्यवस्थित किया गया है।
- source_word: הַלֵּוִי
  choice: लेवीय
  rationale: यह मत्तन्याह की लेवी-सम्बन्धी पहचान बताता है; ‘लेवीय’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: מִן בְּנֵי אָסָף
  choice: आसाप के वंशज
  rationale: בני वंश अथवा कुल-सदस्यता का संकेत देता है; यहाँ ‘वंशज’ शाब्दिक ‘पुत्रों में से’ की तुलना में स्वाभाविक हिन्दी है और सामूहिक वंश-संबंध बनाए रखता है।
- source_word: הָיְתָה עָלָיו רוּחַ יְהוָה
  choice: यहोवा का आत्मा ... पर आया
  rationale: היתה עליו को घटनात्मक रूप में व्यक्त किया गया है, क्योंकि यह भविष्यद्वाणी के लिए आत्मा के आगमन का वर्णन करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से न बदलकर हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בְּתוֹךְ הַקָּהָל
  choice: सभा के बीच
  rationale: यह स्थानगत अर्थ को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: רוּחַ יְהוָה का आशय
  choice: यहोवा का आत्मा
  alternative: यहोवा की प्रेरणा / यहोवा की ओर से एक आत्मा
  rationale: सन्दर्भ में यह परमेश्वर की वह सक्रिय उपस्थिति है जो यहजीएल को भविष्यद्वाणी के लिए समर्थ करती है; इसे केवल मानसिक प्रेरणा बनाना मूल अभिव्यक्ति को संकुचित कर देता।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए पहचाने जाने योग्य रूप ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। लम्बी वंशावली को हिन्दी के स्वाभाविक संबंध-क्रम में रखा गया है, जबकि सभी नाम और पीढ़ियाँ सुरक्षित हैं।
