base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/025.yaml
  text: Then Jehoshaphat and his people came to plunder their spoil[a], and they found among them in abundance goods, garments, and desirable articles; and they took for themselves more than they could carry. They were three days plundering the spoil, because it was so much.
translation:
  language: hi
  text: तब यहोशापात और उसके लोग उनकी लूट लेने आए। उन्हें उनके बीच बहुत-सी संपत्ति, शव[a] और बहुमूल्य वस्तुएँ मिलीं। उन्होंने अपने लिए इतना ले लिया कि वे उसे ढो नहीं सकते थे। वे तीन दिन तक लूट बटोरते रहे, क्योंकि वह बहुत अधिक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मसोराई इब्रानी पाठ में “शव” है। कुछ प्राचीन साक्ष्य और अनुवाद “वस्त्र” जैसे पाठ को दर्शाते हैं या इस शब्द को छोड़ देते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: לָבֹז אֶת שְׁלָלָם
  choice: उनका लूट का माल बटोरने
  rationale: यह उद्देश्यसूचक क्रिया और युद्ध में प्राप्त माल के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है तथा तृतीय पुरुष बहुवचन प्रत्यय को ‘उनका’ से बनाए रखता है।
- source_word: בָהֶם לָרֹב
  choice: उन्हें उनके बीच बहुत-सी
  rationale: ‘उनके बीच’ पराजित शत्रुओं के बीच या उनके पास पड़ी वस्तुओं—दोनों की संभावना को खुला रखता है; ‘बहुत-सी’ प्रचुर मात्रा व्यक्त करता है।
- source_word: רְכוּשׁ
  choice: संपत्ति
  rationale: यह चल संपत्ति और सामान के व्यापक अर्थ को व्यक्त करता है, बिना इसे केवल धन तक सीमित किए।
- source_word: פְגָרִים
  choice: शव
  rationale: मसोराई पाठ में शब्द का सामान्य और प्रत्यक्ष अर्थ ‘शव’ है। सूची में असामान्य लगने पर भी इसे मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: כְלֵי חֲמֻדוֹת
  choice: बहुमूल्य वस्तुएँ
  rationale: यह पद मूल्यवान या मनभावनी वस्तुओं का व्यापक बोध देता है; ‘वस्तुएँ’ इसे केवल पात्रों तक सीमित नहीं करता।
- source_word: וַיְנַצְּלוּ לָהֶם
  choice: उन्होंने अपने लिए ... माल ले लिया
  rationale: संदर्भ में क्रिया शत्रु से लूट उतार लेने या अपने अधिकार में कर लेने को दर्शाती है। सहज हिन्दी के लिए ‘ले लिया’ चुना गया, जबकि ‘अपने लिए’ लाभसूचक भाव बनाए रखता है।
- source_word: לְאֵין מַשָּׂא
  choice: इतना ... कि वे उसे ढो नहीं सकते थे
  rationale: शाब्दिक संरचना भार उठाने की असमर्थता बताती है; यह रूप आधुनिक हिन्दी में मात्रा की अधिकता स्पष्ट करता है।
- source_word: וַיִּהְיוּ יָמִים שְׁלוֹשָׁה בֹּזְזִים
  choice: वे तीन दिन तक ... बटोरते रहे
  rationale: यह तीन दिनों तक जारी रही क्रिया और उसकी अवधि, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִּי רַב הוּא
  choice: क्योंकि वह बहुत अधिक था
  rationale: यह लूट की अत्यधिक मात्रा को तीन दिन लगने का कारण बताता है।
