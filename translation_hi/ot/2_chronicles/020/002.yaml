base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/002.yaml
  text: Then they came and reported to Jehoshaphat[a], saying, “A great multitude is coming against you from beyond the sea, from Aram; and behold, they are in Hazazon-tamar” (that is[b], En-gedi).
translation:
  language: hi
  text: तब कुछ लोग आकर यहोशापात को सूचना देने लगे, “समुद्र के पार से, अराम[a] से, एक विशाल जनसमूह आपके विरुद्ध आ रहा है। देखिए, वे हससोन-तामार में हैं, अर्थात् एन-गदी में।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अराम एक इब्रानी स्थान-नाम है जिसे प्रायः “सीरिया” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ וַיַּגִּידוּ
  choice: तब लोगों ने आकर ... सूचना दी
  rationale: क्रमिक कथन-रूप को स्वाभाविक हिन्दी में रखा गया है। बहुवचन कर्ता हिब्रू में निहित है; ‘लोगों ने’ उसे बिना अनावश्यक विशेषीकरण के व्यक्त करता है।
- source_word: בָּא
  choice: आ रहा है
  rationale: रूप पूर्णकालिक है, पर आसन्न शत्रुतापूर्ण आगमन की सूचना में वर्तमान प्रगतिशील हिन्दी सबसे स्वाभाविक है।
- source_word: הָמוֹן רָב
  choice: एक विशाल जनसमूह
  rationale: यह बड़ी भीड़ या जनसमुदाय को दर्शाता है; संदर्भ सैन्य है, पर ‘सेना’ कहने से स्रोत से अधिक विशिष्टता आ जाती।
- source_word: עָלֶיךָ
  choice: आपके विरुद्ध
  rationale: शत्रुतापूर्ण गति के संदर्भ में על का स्वाभाविक अर्थ ‘विरुद्ध’ है। राजा को संबोधन होने के कारण आदरसूचक ‘आपके’ उपयुक्त है।
- source_word: מֵעֵבֶר לַיָּם
  choice: समुद्र के पार से
  rationale: स्थानिक अर्थ को स्पष्ट और प्रचलित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵאֲרָם
  choice: अराम
  rationale: मसोरेटिक पाठ के स्थान-नाम को सीधे लिप्यंतरित किया गया है; बाद का नाम ‘सीरिया’ मुख्य पाठ में नहीं रखा गया।
- source_word: וְהִנָּם
  choice: देखिए, वे ... में हैं
  rationale: ध्यान आकृष्ट करने और समाचार की तात्कालिकता व्यक्त करने वाले הִנֵּה का वर्तमान, गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: בְּחַצְצוֹן תָּמָר
  choice: हससोन-तामार में
  rationale: स्थान-नाम का हिब्रू-आधारित देवनागरी लिप्यंतरण किया गया है और ב को स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: הִיא עֵין גֶּדִי
  choice: अर्थात् एन-गदी में
  rationale: यह उपवाक्य पहले स्थान की पहचान अधिक परिचित नाम से कराता है; ‘अर्थात्’ इस व्याख्यात्मक संबंध को संक्षेप में स्पष्ट करता है।
