reference: 2 Chronicles 20:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקֹּ֧ד יְהוֹשָׁפָ֛ט אַפַּ֖יִם אָ֑רְצָ/ה וְ/כָל יְהוּדָ֞ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִַ֗ם נָֽפְלוּ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/הִֽשְׁתַּחֲוֺ֖ת לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/020/018.yaml
  text: Then Jehoshaphat bowed with his face to the ground[a], and all Judah and the inhabitants of Jerusalem fell down before Yahweh to worship Yahweh.
translation:
  language: hi
  text: तब यहोशापात ने भूमि पर मुँह झुकाया, और समस्त यहूदा तथा यरूशलेम के निवासी याहवे के सामने गिर पड़े और याहवे की आराधना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: दण्डवत किया
  rationale: यह क्रिया श्रद्धापूर्वक झुकने को व्यक्त करती है; अगले पदबंध में मुँह भूमि की ओर होने से यहाँ गहरे प्रणाम का भाव स्वाभाविक है।
- source_word: אַפַּיִם אָרְצָה
  choice: भूमि की ओर मुँह करके
  rationale: शाब्दिक मुहावरा ‘मुँह/नथुने भूमि की ओर’ पूर्ण विनम्रता से झुकने की मुद्रा बताता है; हिंदी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: וְכָל יְהוּדָה
  choice: समस्त यहूदा
  rationale: ‘यहूदा’ यहाँ सामूहिक रूप से वहाँ के लोगों को दर्शाता है; संक्षिप्त मूल अभिव्यक्ति को बनाए रखा गया है।
- source_word: וְיֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: कृदन्त का सीधा अर्थ वहाँ रहने वाले लोग है; ‘निवासी’ आधुनिक मानक हिंदी में सहज है।
- source_word: נָפְלוּ לִפְנֵי יְהוָה
  choice: यहोवा के सामने गिर पड़े
  rationale: भक्ति के प्रसंग में क्रिया साष्टांग होने का संकेत दे सकती है, पर मूल की ठोस क्रिया ‘गिरना’ को रखते हुए उसके आशय को अगले पदबंध से स्पष्ट होने दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: आराधना की
  rationale: हित्पएल रूप झुककर सम्मान या उपासना करने को दर्शाता है; पहले ही शारीरिक मुद्रा कही गई है, इसलिए यहाँ धार्मिक आशय ‘आराधना’ स्वाभाविक है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: मूल में ईश्वरीय नाम की पुनरावृत्ति है; उसे सर्वनाम से बदलने के बजाय हिंदी में भी बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत नाम स्पष्ट रूप से दो बार आता है। हिंदी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ नाम की प्रकृति और पुनरावृत्ति दोनों सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता।
- issue: לְהִשְׁתַּחֲוֺת में शारीरिक मुद्रा और आराधना का संबंध
  choice: आराधना की
  alternative: दण्डवत करने के लिए / झुककर प्रणाम करने के लिए
  rationale: यह रूप शारीरिक रूप से झुकने और उपासना, दोनों अर्थक्षेत्र रखता है। पूर्ववर्ती ‘गिर पड़े’ शारीरिक क्रिया बताता है, इसलिए ‘आराधना की’ उद्देश्यपूर्ण धार्मिक भाव को स्पष्ट करता है, बिना यह नकारे कि आराधना दण्डवत होकर की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘दण्डवत’ धार्मिक संदर्भ में परिचित है, जबकि वाक्य-विन्यास सरल रखा गया है। मूल की दोनों क्रियाएँ और ईश्वरीय नाम की पुनरावृत्ति सुरक्षित हैं।
