base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/006.yaml
  text: So he returned to Jezreel to recover[a], because of the wounds that they had inflicted on him at Ramah when he fought against Hazael king of Aram. And Azariah son of Jehoram, king of Judah, went down to see Jehoram son of Ahab in Jezreel[b], because he was sick.
translation:
  language: hi
  text: वह यिज्रेल में उन घावों से स्वस्थ होने के लिए लौट आया, जो उसे रामा में अराम के राजा हजाएल से लड़ते समय लगी थीं। और यहूदा के राजा यहोराम का पुत्र अजर्याह[a], अहाब के पुत्र यहोराम को देखने[b] के लिए यिज्रेल में नीचे गया, क्योंकि यहोराम बीमार था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इतिहास की इस पुस्तक के इब्रानी पाठ में यहाँ नाम “अजर्याह” लिखा है; यही राजा अन्य स्थानों पर “अहज्याह” कहलाता है।
    reason: alternative_reading
  - marker: b
    text: या, “उससे मिलने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב לְהִתְרַפֵּא
  choice: इसलिए वह ... लौट गया, ताकि ... चंगा हो सके
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है और hitpael רפא यहाँ घावों से स्वास्थ्य-लाभ को दर्शाता है। ‘चंगा हो सके’ सहज हिन्दी है और उपचार/स्वास्थ्य-लाभ दोनों भाव समेटता है।
- source_word: בְיִזְרְעֶאל
  choice: यिज्रेल ... यिज्रेल
  rationale: पहली बार यह लौटने की मंज़िल है और दूसरी बार भेंट का स्थान; हिन्दी में क्रियाओं और वाक्य-विन्यास से दोनों भूमिकाएँ स्पष्ट हैं।
- source_word: כִּי הַמַּכִּים אֲשֶׁר הִכֻּהוּ
  choice: उन घावों ... जो उसे ... पहुँचाए गए थे
  rationale: מַכִּים यहाँ प्रहारों से हुए घावों को सूचित करता है। कर्मवाच्य हिन्दी अनिर्दिष्ट बहुवचन कर्ता को बनाए रखती है और कृत्रिम ‘उन्होंने’ से बचती है।
- source_word: בָרָמָה
  choice: रामा में
  rationale: मसोरेटी पाठ में स्थान-नाम רמה है; इसे समानांतर वृत्तांत के आधार पर किसी दूसरे नाम से नहीं मिलाया गया।
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: जब वह अराम के राजा हजाएल से लड़ रहा था
  rationale: ב + infinitive construct का समय-सूचक भाव ‘जब’ से स्वाभाविक रूप में व्यक्त हुआ है; לחם के साथ ‘से लड़ना’ स्पष्ट हिन्दी प्रयोग है।
- source_word: וַעֲזַרְיָהוּ
  choice: अजर्याह
  rationale: मुख्य पाठ में WLC का नाम עזריהו रखा गया है; इसे अन्य पदों में प्रचलित ‘अहज्याह’ से चुपचाप नहीं मिलाया गया।
- source_word: יָרַד
  choice: गया
  rationale: यरद में नीचे जाने का दिशात्मक भाव है, पर गंतव्य के संबंध में स्वाभाविक आधुनिक हिन्दी में केवल ‘गया’ अधिक सहज है; भौगोलिक दिशा का अत्यधिक शाब्दिक आरोप टाला गया है।
- source_word: לִרְאוֹת
  choice: को देखने
  rationale: ראה का सीधा अर्थ ‘देखना’ रखा गया है; प्रसंगगत ‘भेंट करने’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: כִּי חֹלֶה הוּא
  choice: क्योंकि वह बीमार था
  rationale: חלה बीमारी अथवा दुर्बल अवस्था को दर्शाता है; ‘बीमार था’ सामान्य, स्पष्ट हिन्दी है और उसके घावों से संबंध प्रसंग से समझ आता है।
theological_decisions:
- issue: इतिहास-वृत्त में राजकीय नाम का रूपांतर
  choice: मुख्य पाठ में ‘अजर्याह’
  alternative: ‘अहज्याह’
  rationale: इस पद का इब्रानी पाठ עזריהו पढ़ता है। स्रोत-पाठ की विशिष्टता बनाए रखते हुए इसे मुख्य पाठ में रखा गया है और उसी राजा के अन्यत्र प्रयुक्त नाम को पारदर्शिता के लिए पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजाओं के समान नामों के कारण संबंधसूचक पद स्पष्ट रूप से बनाए गए हैं। ‘रामा’ और ‘अजर्याह’ को समानांतर वृत्तांतों के अनुसार समरूप किए बिना WLC के रूप में सुरक्षित रखा गया है।
