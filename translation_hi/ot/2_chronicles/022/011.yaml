  text: וַ/תִּקַּח֩ יְהוֹשַׁבְעַ֨ת בַּת הַ/מֶּ֜לֶךְ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ הַ/מּ֣וּמָתִ֔ים וַ/תִּתֵּ֥ן אֹת֛/וֹ וְ/אֶת מֵֽינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/תַּסְתִּירֵ֡/הוּ יְהוֹשַׁבְעַ֣ת בַּת הַ/מֶּ֣לֶךְ יְהוֹרָ֡ם אֵשֶׁת֩ יְהוֹיָדָ֨ע הַ/כֹּהֵ֜ן כִּ֣י הִיא֩ הָיְתָ֨ה אֲח֧וֹת אֲחַזְיָ֛הוּ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הֱמִיתָֽתְ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/011.yaml
  text: But Jehoshabeath[a], the king’s daughter, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, and she put him and his nurse in the bedroom. So Jehoshabeath, the daughter of King Jehoram, the wife of Jehoiada the priest, hid him from Athaliah[c][b], and she did not put him to death.
translation:
  language: hi
  text: परन्तु राजा की बेटी यहोशबात ने अहज्याह के पुत्र योआश को लिया और जिन राजपुत्रों को मार डाला जा रहा था, उनके बीच से उसे चुपके से निकाल ले गई। उसने उसे और उसकी धाय को शयनकक्ष[a] में रखा। इस प्रकार राजा यहोराम की बेटी और यहोयादा याजक की पत्नी यहोशबात ने उसे अतल्याह से छिपा लिया—क्योंकि वह अहज्याह की बहन थी—और उसने उसे नहीं मारा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “पलंगों के कमरे में”; अर्थात् शयनकक्ष या सोने का कमरा।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में अन्तिम क्रिया का कर्ता केवल स्त्रीलिंग रूप से सूचित है। प्रसंग में सम्भवतः अतल्याह अभिप्रेत है: यहोशबात ने योआश को उससे छिपाया, इसलिए वह उसे मार न सकी। व्याकरण की दृष्टि से यहोशबात को भी कर्ता समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: लिया
  rationale: मूल क्रिया לקח का सामान्य अर्थ ‘लेना’ है; प्रसंग में बचाव निहित है, पर उसे क्रिया में जोड़ना अनावश्यक व्याख्या होगी।
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: उसे चुपके से निकाल ले गई
  rationale: גנב चोरी या गुप्त रूप से ले जाने का भाव देता है। हिन्दी में किसी व्यक्ति के लिए यह अभिव्यक्ति गुप्त कार्रवाई को स्वाभाविक ढंग से व्यक्त करती है, बिना अपहरण का अनुचित नकारात्मक भाव जोड़े।
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ הַמּוּמָתִים
  choice: जिन राजपुत्रों को मार डाला जा रहा था, उनके बीच से
  rationale: הַמּוּמָתִים हिफ़ील कर्मवाचक कृदन्त है और यहाँ निष्पादन की चल रही परिस्थिति को दर्शाता है; ‘मारे गए’ कहना सबको पहले ही मृत मान सकता है।
- source_word: מֵינִקְתּוֹ
  choice: उसकी धाय
  rationale: शब्द उस स्त्री को दर्शाता है जो बालक को दूध पिलाती और उसकी देखभाल करती थी। ‘धाय’ संक्षिप्त, सटीक और गरिमापूर्ण हिन्दी है।
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: पलंगों वाले कमरे
  rationale: यह इब्रानी पद का निकट अर्थ है, ‘पलंगों का कमरा’; आधुनिक पाठक की स्पष्टता के लिए शाब्दिक चित्र बनाए रखा गया है और पादटिप्पणी में सम्भावित आशय दिया गया है।
- source_word: וַתַּסְתִּירֵהוּ
  choice: उसे ... छिपा लिया
  rationale: סתר का साधारण अर्थ छिपाना या ओझल रखना है; हिन्दी में ‘छिपा लिया’ संरक्षण के इस प्रसंग में स्वाभाविक है।
- source_word: אֵשֶׁת יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक की पत्नी
  rationale: मूल का परिचयात्मक समानाधिकरण स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: כִּי הִיא הָיְתָה אֲחוֹת אֲחַזְיָהוּ
  choice: क्योंकि वह अहज्याह की बहन थी
  rationale: כִּי यहाँ यहोशबात के कार्य का कारण बताता है; पारिवारिक सम्बन्ध को स्पष्ट रूप से रखा गया है।
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: अतल्याह से
  rationale: מִפְּנֵי का शाब्दिक भाव ‘के सामने/उपस्थिति से’ है, पर इस प्रसंग में ‘अतल्याह से छिपाया’ स्वाभाविक हिन्दी है और उसकी पहुँच से दूर रखने का अर्थ देता है।
- source_word: וְלֹא הֱמִיתָתְהוּ
  choice: और अतल्याह ने उसे नहीं मारा
  rationale: इब्रानी में कर्ता केवल स्त्रीलिंग क्रिया से सूचित है। मुख्य पाठ में प्रसंगानुसार अतल्याह को स्पष्ट किया गया है, जबकि पादटिप्पणी व्याकरणगत अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: अन्तिम क्रिया וְלֹא הֱמִיתָתְהוּ का कर्ता
  choice: 'मुख्य पाठ में अतल्याह को निहित कर्ता माना गया है: ‘अतल्याह ने उसे नहीं मारा।’'
  alternative: 'व्याकरण की दृष्टि से निकटवर्ती स्त्री पात्र यहोशबात को भी कर्ता समझा जा सकता है: ‘उसने उसे नहीं मारा।’'
  rationale: ‘उसे अतल्याह से छिपा लिया’ के तुरन्त बाद परिणामस्वरूप अतल्याह का उसे न मार पाना प्रसंग में सबसे स्वाभाविक है। फिर भी इब्रानी क्रिया स्वयं कर्ता का नाम नहीं देती, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में दर्ज की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। नामों के रूप प्रचलित हिन्दी बाइबलीय वर्तनी के अनुरूप हैं। ‘राजपुत्र’, ‘धाय’ और ‘याजक’ संक्षिप्त तथा प्रसंग-सटीक हैं। मूल इब्रानी की लम्बी संरचना को पठनीयता के लिए तीन वाक्यों में बाँटा गया है, और कारणसूचक उपवाक्य को डैशों के बीच रखकर उसका सम्बन्ध स्पष्ट किया गया है।
