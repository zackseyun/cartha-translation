  text: וַ/יַּמְלִיכוּ֩ יוֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם אֶת אֲחַזְיָ֨הוּ בְנ֤/וֹ הַ/קָּטֹן֙ תַּחְתָּ֔י/ו כִּ֤י כָל הָ/רִאשֹׁנִים֙ הָרַ֣ג הַ/גְּד֔וּד הַ/בָּ֥א בָֽ/עַרְבִ֖ים לַֽ/מַּחֲנֶ֑ה וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בֶן יְהוֹרָ֖ם מֶ֥לֶךְ יְהוּדָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/001.yaml
  text: Then the inhabitants of Jerusalem made Ahaziah[a], his youngest son, king in his place, because the raiding band that came with the Arabs into the camp had killed all the older sons. So Ahaziah son of Jehoram, king of Judah, became king.
translation:
  language: hi
  text: तब यरूशलेम के निवासियों ने उसके सबसे छोटे बेटे अहज्याह को उसके स्थान पर राजा बनाया, क्योंकि अरबों के साथ छावनी में आए लुटेरे दल[a] ने उसके सभी बड़े बेटों को मार डाला था। इस प्रकार यहूदा के राजा यहोराम का पुत्र अहज्याह राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरबों के बीच छावनी में आए दल।” इब्रानी में “अरबों” के साथ प्रयुक्त संबंधबोधक अव्यय को यहाँ एक से अधिक प्रकार से समझा जा सकता है।
    reason: इब्रानी पूर्वसर्ग ב की साहचर्य अथवा स्थानगत व्याख्या से उत्पन्न वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּמְלִיכוּ
  choice: राजा बनाया
  rationale: מלך के हिफ़ील रूप का यहाँ अर्थ किसी को राजपद पर स्थापित करना है; यह चयन उसके कारक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों
  rationale: शाब्दिक अर्थ ‘यरूशलेम में रहनेवाले’ है; ‘निवासियों’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: בְנוֹ הַקָּטֹן
  choice: उसके सबसे छोटे बेटे
  rationale: קָטֹן का मूल अर्थ ‘छोटा/कम उम्र का’ है, पर आगे बड़े बेटों के उल्लेख से यहाँ पुत्रों में सबसे छोटा अभिप्रेत है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में यह प्रतिस्थापन और पदग्रहण दोनों को सहज रूप से व्यक्त करता है।
- source_word: כָל הָרִאשֹׁנִים
  choice: उसके सभी बड़े बेटों
  rationale: शाब्दिक रूप से ‘सभी पहले/पहलेवाले’; निकट संदर्भ स्पष्ट करता है कि ये अहज्याह से बड़े यहोराम के पुत्र हैं। हिन्दी में संदर्भ स्पष्ट करने के लिए ‘बेटों’ जोड़ा गया है।
- source_word: הַגְּדוּד
  choice: लुटेरे दल
  rationale: גְּדוּד किसी सैन्य दल, विशेषकर छापा मारनेवाले दल, को सूचित कर सकता है; प्रसंग में ‘लुटेरे दल’ उसके आक्रमणकारी स्वरूप को व्यक्त करता है।
- source_word: הַבָּא בָעַרְבִים לַמַּחֲנֶה
  choice: अरबों के साथ छावनी में आए
  rationale: ב को मुख्य पाठ में साहचर्य के अर्थ में लिया गया है और ל को छावनी की ओर आने तथा उसमें प्रवेश के प्रसंगानुकूल अर्थ में अनूदित किया गया है; वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הָרַג
  choice: मार डाला था
  rationale: हत्या राजा बनाए जाने से पहले हुई और उसका कारण बताती है; हिन्दी का पूर्ण भूतकाल इस क्रम को स्पष्ट करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राजपद ग्रहण करने की सारांशात्मक सूचना देती है; ‘राजा बना’ प्रवेशात्मक भाव को व्यक्त करता है, केवल शासन की अवधि को नहीं।
- source_word: אֲחַזְיָהוּ בֶן יְהוֹרָם מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोराम का पुत्र अहज्याह
  rationale: हिन्दी शब्दक्रम से स्पष्ट होता है कि ‘यहूदा का राजा’ यहोराम को विशेषित करता है और अहज्याह की वंशावली बताई जा रही है।
