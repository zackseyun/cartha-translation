  text: גַּם ה֣וּא הָלַ֔ךְ בְּ/דַרְכֵ֖י בֵּ֣ית אַחְאָ֑ב כִּ֥י אִמּ֛/וֹ הָיְתָ֥ה יֽוֹעַצְתּ֖/וֹ לְ/הַרְשִֽׁיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/003.yaml
  text: He too walked in the ways of the house of Ahab[a], because his mother was his counselor to act wickedly.
translation:
  language: hi
  text: वह भी अहाब के घराने के मार्गों पर चला, क्योंकि उसकी माँ उसे दुष्टता करने की सलाह देती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם הוּא
  choice: वह भी
  rationale: यह पदबंध राजा को पहले के उसी आचरण-क्रम में सम्मिलित करता है और इब्रानी के योगात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָלַךְ בְּדַרְכֵי
  choice: की चाल पर चला
  rationale: नैतिक आचरण के लिए प्रयुक्त इब्रानी रूपक को हिन्दी के परिचित मुहावरे में सुरक्षित रखता है; यहाँ वास्तविक यात्रा नहीं, जीवन-व्यवहार अभिप्रेत है।
- source_word: בֵּית אַחְאָב
  choice: अहाब के घराने
  rationale: ‘घराना’ पारिवारिक और राजवंशीय दोनों आशयों को व्यक्त करता है, जबकि केवल ‘वंश’ कहना कुछ अधिक व्याख्यात्मक होता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ अव्यय उसके आचरण का कारण प्रस्तुत करता है।
- source_word: אִמּוֹ
  choice: उसकी माँ
  rationale: मूल के सीधे संबंधसूचक अर्थ का स्वाभाविक हिन्दी रूप।
- source_word: הָיְתָה יוֹעַצְתּוֹ
  choice: उसकी सलाहकार थी
  rationale: मूल में एकबारगी ‘सलाह दी’ के बजाय निरंतर भूमिका बताने वाली नामात्मक रचना है; स्त्रीलिंग ‘सलाहकार’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְהַרְשִׁיעַ
  choice: दुष्टता करने के लिए
  rationale: हिफ़ील क्रिया के उद्देश्य अथवा परिणाम की दिशा को बनाए रखते हुए नैतिक निंदा स्पष्ट करता है; प्रसंग में इसका आशय उसे दुष्ट आचरण की ओर सलाह देना है।
theological_decisions:
- issue: माँ की सलाह और राजा के दुष्ट आचरण के बीच संबंध
  choice: स्पष्ट रखा गया कि उसकी माँ दुष्टता करने के लिए उसकी सलाहकार थी।
  alternative: ‘उसकी माँ उसे बुराई करने को उकसाती थी’ या ‘दुष्टता में उसे सलाह देती थी।’
  rationale: मूल पाठ नैतिक निर्णय स्पष्ट रूप से देता है, पर ‘उकसाती थी’ मनोवैज्ञानिक तीव्रता जोड़ सकता है। चुना हुआ रूप मूल की नामात्मक रचना और उद्देश्य/परिणाम संबंध को बिना विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘चाल पर चला’ बाइबिलीय नैतिक-मार्ग रूपक को स्वाभाविक हिन्दी में रखता है; ‘घराना’ पारिवारिक-राजवंशीय अर्थ को सुरक्षित रखता है।
