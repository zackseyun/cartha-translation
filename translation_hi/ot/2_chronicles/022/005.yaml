  text: גַּ֣ם בַּ/עֲצָתָ/ם֮ הָלַךְ֒ וַ/יֵּלֶךְ֩ אֶת יְהוֹרָ֨ם בֶּן אַחְאָ֜ב מֶ֣לֶךְ יִשְׂרָאֵ֗ל לַ/מִּלְחָמָ֛ה עַל חֲזָאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמ֣וֹת גִּלְעָ֑ד וַ/יַּכּ֥וּ הָֽ/רַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/005.yaml
  text: He also walked by their counsel[a], and he went with Jehoram son of Ahab, king of Israel, to war against Hazael king of Aram at Ramoth-gilead[c][b]; and the Arameans wounded Joram.
translation:
  language: hi
  text: वह उनकी सलाह के अनुसार भी चलता था,[a] और इस्राएल के राजा अहाब के पुत्र यहोराम के साथ रामोत-गिलाद में अराम के राजा हजाएल से युद्ध करने गया। अरामियों ने योराम को घायल कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी सलाह में चला”; अर्थात् वह उनकी सलाह के अनुसार आचरण करता था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ पहले “यहो्राम” और पद के अंत में उसका निकट-संबंधित रूप “योराम” इस्तेमाल करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בַּעֲצָתָם הָלַךְ
  choice: वह उनकी सलाह पर भी चलता रहा
  rationale: ‘सलाह पर चलना’ स्वाभाविक हिन्दी मुहावरा है और इब्रानी में किसी की सम्मति के अनुसार आचरण करने का भाव बनाए रखता है। ‘भी’ पिछले प्रसंग से निरंतरता दिखाता है।
- source_word: וַיֵּלֶךְ אֶת
  choice: के साथ ... गया
  rationale: यह रचना यहोराम के साथ जाने या उसका साथ देने को व्यक्त करती है; हिन्दी में ‘के साथ गया’ स्पष्ट और सहज है।
- source_word: יְהוֹרָם ... יוֹרָם
  choice: यहोराम ... योराम
  rationale: इब्रानी पाठ इसी पद में नाम के दो निकट-संबंधित रूप रखता है; अनुवाद में इस भेद को सुरक्षित रखा गया है।
- source_word: לַמִּלְחָמָה עַל
  choice: से युद्ध करने
  rationale: सैन्य प्रसंग में עַל विरोधी लक्ष्य को सूचित करता है। हिन्दी में किसी ‘से युद्ध करना’ स्वाभाविक प्रयोग है।
- source_word: אֲרָם / הָרַמִּים
  choice: अराम / अरामी
  rationale: मूल इब्रानी के ऐतिहासिक जाति-देश नाम को प्राथमिकता दी गई है; ‘सीरिया/सीरियाई’ बाद की पारंपरिक पहचान है।
- source_word: בְּרָמוֹת גִּלְעָד
  choice: गिलाद के रामोत में
  rationale: स्थान-संबंध स्पष्ट करने के लिए प्रचलित हिन्दी रूप रखा गया है; युद्ध के स्थान के लिए ‘में’ सहज है।
- source_word: וַיַּכּוּ
  choice: घायल कर दिया
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ हो सकता है, पर अगले पद के संदर्भ में यहाँ प्रहार का परिणाम योराम का घायल होना है।
theological_decisions:
- issue: אֲרָם और הָרַמִּים का अनुवाद
  choice: अराम / अरामी
  alternative: सीरिया / सीरियाई
  rationale: मूल भाषा की ऐतिहासिक संज्ञा को सुरक्षित रखा गया है और बाद के भू-राजनीतिक नाम को मुख्य पाठ में नहीं लाया गया।
- issue: יְהוֹרָם और יוֹרָם के नाम-रूप
  choice: यहोराम ... योराम
  alternative: दोनों स्थानों पर एक ही रूप
  rationale: मूल पाठ में उपस्थित नामगत भिन्नता को बिना समतल किए बनाए रखा गया है; इससे कोई अतिरिक्त पहचान-संबंधी निष्कर्ष नहीं निकाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘सलाह पर चलना’ मूल रूपक और उसका अर्थ दोनों संप्रेषित करता है। स्थान और व्यक्तिनाम देवनागरी में प्रचलित बाइबलीय रूपों के निकट रखे गए हैं।
