language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲתַלְיָ֨הוּ֙ אֵ֣ם אֲחַזְיָ֔הוּ רָאֲתָ֖ה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֗קָם וַ/תְּדַבֵּ֛ר אֶת כָּל זֶ֥רַע הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/010.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, and she arose and destroyed all the royal offspring of the house of Judah.
translation:
  language: hi
  text: अहज्याह की माता अतल्याह ने देखा कि उसका पुत्र मर चुका था। तब वह उठी और उसने यहूदा के राजघराने के सारे वंशजों का नाश कर दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पाठ में क्रिया का रूप कठिन है; उसका शाब्दिक अर्थ ‘बोली’ है। पर सन्दर्भ और 2 राजा 11:1 का समानान्तर वृत्तान्त ‘नाश कर दिया’ या ‘मरवा डाला’ अर्थ का समर्थन करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וַעֲתַלְיָהוּ
  choice: अतल्याह
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है। आरम्भिक וַ को अलग शब्द से व्यक्त करना आवश्यक नहीं, क्योंकि हिन्दी कथन-प्रवाह में उसका संयोजक बल स्वाभाविक रूप से स्पष्ट है।
- source_word: אֵם אֲחַזְיָהוּ
  choice: अहज्याह की माता
  rationale: सम्बन्धवाचक इब्रानी रचना का स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: רָאֲתָה כִּי מֵת בְּנָהּ
  choice: ने देखा कि उसका पुत्र मर चुका था
  rationale: רָאָה के साथ כִּי किसी तथ्य के प्रत्यक्ष ज्ञान को व्यक्त करता है। ‘मर चुका था’ कथानक के भूतकाल में मृत्यु की पूर्ण अवस्था को स्वाभाविक हिन्दी में बताता है।
- source_word: וַתָּקָם
  choice: तब वह उठी
  rationale: קוּם यहाँ केवल शारीरिक रूप से खड़े होने के बजाय निर्णायक कार्रवाई आरम्भ करने का कथात्मक संकेत देता है; ‘उठी’ मूल क्रिया को बनाए रखता है और ‘तब’ क्रम को सहज बनाता है।
- source_word: וַתְּדַבֵּר
  choice: नाश कर दिया
  rationale: मसोरेटिक स्वरूप सामान्यतः ‘बोली’ से जुड़ता है, पर प्रत्यक्ष कर्म और 2 राजा 11:1 का समानान्तर वृत्तान्त यहाँ विनाश अथवा वध का अर्थ समर्थित करते हैं। ‘नाश कर दिया’ साधन या विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה לְבֵית יְהוּדָה
  choice: यहूदा के राजघराने के सारे वंशजों
  rationale: זֶרַע का मूल अर्थ ‘बीज/सन्तान’ है; राजकीय सन्दर्भ में ‘राजघराने के सारे वंशज’ वंशगत आशय और כָּל की समग्रता दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: कठिन क्रियारूप וַתְּדַבֵּר का अर्थ
  choice: सन्दर्भानुसार ‘नाश कर दिया’
  alternative: ‘बोली’ या ‘विरुद्ध बोली’
  rationale: ‘सारे राजवंशीय वंशजों’ को प्रत्यक्ष कर्म बनाने वाली वाक्यरचना में सामान्य अर्थ ‘बोली’ असंगत है। 2 राजा 11:1 का समानान्तर वृत्तान्त हत्या का स्पष्ट समर्थन करता है। पाठगत कठिनाई को छिपाने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पुत्र’ और ‘राजघराना’ सामान्य पाठक के लिए स्पष्ट रहते हुए प्रसंग की औपचारिकता बनाए रखते हैं। कठिन इब्रानी क्रिया की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
