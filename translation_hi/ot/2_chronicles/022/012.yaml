base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/012.yaml
  text: And he was with them in the house of God[a], hiding himself for six years[b], while Athaliah was reigning over the land.
translation:
  language: hi
  text: और वह उनके साथ परमेश्वर के भवन[a] में छह वर्ष तक छिपा[b] रहा, जबकि अतल्याह देश पर राज्य करती रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मन्दिर और उसका परिसर; शाब्दिक अर्थ, ‘परमेश्वर का भवन।’
    reason: cultural_note
  - marker: b
    text: या ‘अपने को छिपाता हुआ’; इब्रानी कृदन्त का अर्थ आत्मवाचक रूप में ‘अपने को छिपाता हुआ’ हो सकता है, या प्रसंग में उसकी छिपी हुई अवस्था का वर्णन कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִתָּם
  choice: और वह उनके साथ ... रहा
  rationale: यह वाक्यांश योआश के उन लोगों के साथ लगातार रहने को बताता है; ‘रहा’ हिन्दी में इस निरंतर अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: यह इब्रानी अभिव्यक्ति का सीधा और प्रतिष्ठित अनुवाद है; संदर्भ में इससे मन्दिर और उसका परिसर अभिप्रेत है।
- source_word: מִתְחַבֵּא
  choice: छिपा रहा
  rationale: हित्पएल कृदन्त लगातार छिपे रहने अथवा स्वयं को छिपाए रखने का भाव देता है। ‘छिपा रहा’ सहज हिन्दी है और संदर्भ में छिपाए जाने की अवस्था की संभावना को भी पूरी तरह बंद नहीं करता।
- source_word: שֵׁשׁ שָׁנִים
  choice: छह वर्ष तक
  rationale: अवधि को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  choice: जबकि अतल्याह ... राज्य करती रही
  rationale: स्त्रीलिंग कृदन्त उसी अवधि में जारी शासन को दर्शाता है; ‘करती रही’ उसके निरंतर पक्ष को सुरक्षित रखता है।
- source_word: עַל הָאָרֶץ
  choice: देश पर
  rationale: यहाँ הָאָרֶץ से यहूदा का देश अथवा राज्य-क्षेत्र अभिप्रेत है; ‘देश’ मूल शब्द से निकट रहते हुए अनावश्यक विशिष्टीकरण से बचता है।
theological_decisions:
- issue: מִתְחַבֵּא में कर्तृवाचक/मध्यवाचक और छिपी हुई अवस्था के बीच अर्थ-सूक्ष्मता
  choice: मुख्य पाठ में ‘छिपा रहा’
  alternative: ‘छिपाया हुआ रहा’ या ‘अपने को छिपाता रहा’
  rationale: इब्रानी हित्पएल स्वयं छिपने का भाव दे सकता है, पर प्रसंग में दूसरे लोग भी उसे छिपा रहे थे। चुना गया हिन्दी रूप दोनों संदर्भगत पक्षों के बीच तनाव को बनाए रखता है, और पाद-टिप्पणी विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘परमेश्वर का भवन’ मूल इब्रानी रूपक को सुरक्षित रखता है, जबकि पाद-टिप्पणी उसका सांस्कृतिक संदर्भ स्पष्ट करती है।
