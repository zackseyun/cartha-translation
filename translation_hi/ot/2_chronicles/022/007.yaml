base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/007.yaml
  text: Ahaziah’s downfall[a], by his going to Joram, was from God; and when he came, he went out with Jehoram to Jehu son of Nimshi, whom Yahweh had anointed to cut off the house of Ahab.
translation:
  language: hi
  text: योराम के पास जाने के समय अहज्याह का पतन परमेश्वर की ओर से हुआ; और जब वह आया, तो वह यहोराम के साथ निमशी के पुत्र येहू की ओर निकला[a], जिसका अभिषेक यहोवा ने अहाब के घराने का अंत करने के लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “येहू के विरुद्ध निकला” अथवा “येहू से मिलने निकला”; इब्रानी में शाब्दिक रूप से “येहू की ओर” है, यद्यपि प्रसंग शत्रुतापूर्ण मुठभेड़ का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֱלֹהִים
  choice: परमेश्वर की ओर से हुआ
  rationale: מן स्रोत या उद्गम दर्शाता है। यह अनुवाद पतन को परमेश्वर से जोड़ता है, पर यह तय नहीं करता कि वह प्रत्यक्ष आदेश, प्रबंध या अनुमति से हुआ।
- source_word: תְּבוּסַת
  choice: पतन
  rationale: यह संज्ञा पराजय, रौंदे जाने या विनाशकारी परिणाम का बोध देती है; प्रसंग में ‘पतन’ अहज्याह के अंत की व्यापक और स्वाभाविक अभिव्यक्ति है।
- source_word: לָבוֹא אֶל יוֹרָם
  choice: क्योंकि वह योराम के पास गया था
  rationale: ל सहित क्रियारूप उसके पतन से जुड़े अवसर या कारणसूचक परिस्थिति को व्यक्त करता है। हिन्दी में यह रचना संबंध को स्पष्ट और स्वाभाविक बनाती है, यद्यपि इब्रानी का संबंध संक्षिप्त है।
- source_word: וּבְבֹאוֹ
  choice: और वहाँ पहुँचकर
  rationale: ב सहित infinitive construct यहाँ समयसूचक है। ‘वहाँ पहुँचकर’ योराम के पास आने के बाद की घटना को सहज हिन्दी में व्यक्त करता है।
- source_word: יָצָא עִם יְהוֹרָם אֶל יֵהוּא
  choice: वह यहोराम के साथ ... येहू की ओर निकला
  rationale: יָצָא सैन्य संदर्भ में निकलने का संकेत दे सकता है, पर אֶל का मूल अर्थ ‘की ओर/के पास’ है। मुख्य पाठ दिशा को तटस्थ रखता है और संभावित विरोधी या भेंट-संबंधी अर्थ पादटिप्पणी में देता है।
- source_word: יוֹרָם / יְהוֹרָם
  choice: योराम / यहोराम
  rationale: इब्रानी पाठ में इसी व्यक्ति के नाम के दोनों रूप आए हैं; अनुवाद इस पाठगत भिन्नता को समतल नहीं करता।
- source_word: מְשָׁחוֹ
  choice: अभिषेक ... किया था
  rationale: पूर्ण क्रिया मुख्य घटना से पहले हुए अभिषेक को दर्शाती है; ‘किया था’ इस पूर्वकालिक संबंध को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी नामरूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: לְהַכְרִית אֶת בֵּית אַחְאָב
  choice: अहाब के घराने का अंत करने के लिए
  rationale: הכרית का अर्थ काट डालना, मिटाना या समाप्त करना है। ‘घराने का अंत करना’ हिन्दी में वंश/राजघराने के उन्मूलन का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: अहज्याह के पतन में परमेश्वर की कारणात्मक भूमिका
  choice: पतन ‘परमेश्वर की ओर से’ हुआ
  alternative: परमेश्वर ने पतन ठहराया / परमेश्वर ने पतन होने दिया
  rationale: इब्रानी स्पष्टतः पतन का स्रोत परमेश्वर को बताता है, लेकिन कारण की विधि नहीं समझाता। इसलिए अनुवाद प्रत्यक्ष निर्धारण और केवल अनुमति में से किसी एक को नहीं चुनता।
- issue: येहू की ओर निकलने का आशय
  choice: येहू की ओर निकला
  alternative: येहू के विरुद्ध निकला / येहू से मिलने निकला
  rationale: אֶל दिशा बताता है, जबकि प्रसंग शत्रुतापूर्ण सामना सुझा सकता है। मुख्य पाठ मूल की अनिर्णीतता रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘योराम/यहोराम’ की स्रोत-पाठगत नाम-भिन्नता सुरक्षित है। कारणात्मक और सैन्य अस्पष्टताओं को अनावश्यक रूप से निर्णीत नहीं किया गया।
