source:
  edition: WLC
  text: וַ/יְהִ֕י כְּ/הִשָּׁפֵ֥ט יֵה֖וּא עִם בֵּ֣ית אַחְאָ֑ב וַ/יִּמְצָא֩ אֶת שָׂרֵ֨י יְהוּדָ֜ה וּ/בְנֵ֨י אֲחֵ֧י אֲחַזְיָ֛הוּ מְשָׁרְתִ֥ים לַ/אֲחַזְיָ֖הוּ וַ/יַּהַרְגֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/008.yaml
  text: And it happened[a], when Jehu was executing judgment on the house of Ahab, that he found the officials of Judah and the sons of Ahaziah’s brothers, serving Ahaziah[b], and he killed them.
translation:
  language: hi
  text: ऐसा हुआ कि जब येहू अहाब के घराने के विरुद्ध न्याय कर रहा था[a], तब उसने यहूदा के अधिकारियों और अहज्याह के भाइयों के पुत्रों को पाया, जो अहज्याह की सेवा कर रहे थे[b], और उसने उन्हें मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब येहू अहाब के घराने का न्याय कर रहा था।”
    reason: इब्रानी में ‘न्याय करना’ के साथ प्रयुक्त संबंधसूचक पद इस प्रसंग में अहाब के घराने को न्यायिक कार्रवाई का लक्ष्य बताता है; ‘के विरुद्ध’ उस भाव को हिंदी में स्पष्ट करता है।
  - marker: b
    text: शाब्दिक अर्थ “अहज्याह के भाइयों के पुत्र”; अर्थात अहज्याह के भतीजे।
    reason: मुख्य पाठ इब्रानी संबंधसूचक रूप को सुरक्षित रखता है; टिप्पणी उसका स्वाभाविक रिश्ते का नाम स्पष्ट करती है।
lexical_decisions:
- source_word: כְּהִשָּׁפֵט
  choice: जब ... न्याय कर रहा था
  rationale: כְּ के साथ निफ़ाल infinitive construct समय बताता है। ‘न्याय कर रहा था’ शפט के न्यायिक भाव को बनाए रखता है और दंडात्मक कार्रवाई का अर्थ संदर्भ से उभरने देता है।
- source_word: עִם בֵּית אַחְאָב
  choice: अहाब के घराने का
  rationale: यहाँ עִם उस समूह को सूचित करता है जिस पर न्यायिक कार्रवाई हो रही है। हिंदी में ‘घराने का न्याय करना’ स्वाभाविक है; ‘घराना’ पारिवारिक और राजवंशीय दोनों भावों को सुरक्षित रखता है।
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के अधिकारियों
  rationale: שָׂרִים उच्च पदस्थ शासकीय व्यक्तियों के लिए प्रयुक्त हो सकता है। ‘अधिकारी’ प्रसंग के अनुकूल है और अनावश्यक रूप से उन्हें राजकुमार नहीं ठहराता।
- source_word: וּבְנֵי אֲחֵי אֲחַזְיָהוּ
  choice: अहज्याह के भाइयों के पुत्रों
  rationale: यह अनुवाद इब्रानी के स्पष्ट संबंधसूचक वाक्यांश को बनाए रखता है; आशय अहज्याह के भतीजों से है।
- source_word: מְשָׁרְתִים לַאֲחַזְיָהוּ
  choice: जो अहज्याह की सेवा कर रहे थे
  rationale: कृदंत निरंतर सेवा या परिचर्या का भाव देता है। यह अभिव्यक्ति दरबारी अथवा आधिकारिक सेवा को खुला रखती है और अनावश्यक धार्मिक अर्थ नहीं जोड़ती।
- source_word: וַיַּהַרְגֵם
  choice: और उसने उन्हें मार डाला
  rationale: הרג का सीधा अर्थ मार डालना है। यह स्पष्ट है और न तो हिंसा को नरम करता है, न उसे अधिक अलंकृत बनाता है।
- source_word: וַיְהִי
  choice: तब
  rationale: इब्रानी कथात्मक सूत्र को हिंदी की स्वाभाविक काल-संरचना में समाहित किया गया है। अलग से ‘ऐसा हुआ’ जोड़ने की अपेक्षा ‘जब... तब’ वही कथात्मक संबंध अधिक सहजता से व्यक्त करता है।
theological_decisions:
- issue: येहू की कार्रवाई के लिए न्यायिक भाषा
  choice: ‘न्याय कर रहा था’ द्वारा शפט का न्यायिक भाव सुरक्षित रखा गया है।
  alternative: ‘दंड दे रहा था’ या ‘नाश कर रहा था’
  rationale: पद येहू की कार्रवाई को न्याय की भाषा में प्रस्तुत करता है, पर इस वाक्य में प्रत्येक हत्या पर स्पष्ट ईश्वरीय अनुमोदन नहीं जोड़ता। इसलिए अधिक व्याख्यात्मक ‘दंड’ अथवा धार्मिक समर्थन का विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘घराना’, ‘अधिकारी’ और ‘सेवा करना’ सामान्य पाठक के लिए स्पष्ट हैं तथा मूल की पारिवारिक-राजकीय अस्पष्टता बनाए रखते हैं।
