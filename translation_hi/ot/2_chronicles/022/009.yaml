base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/009.yaml
  text: And he sought Ahaziah[a], and they captured him while he was hiding in Samaria, and they brought him to Jehu and put him to death. Then they buried him, for they said, “He is the son of Jehoshaphat[b], who sought Yahweh with all his heart.” And the house of Ahaziah had no power to retain the kingdom.
translation:
  language: hi
  text: उसने अहज्याह को ढूँढ़ा। जब अहज्याह सामरिया में छिपा हुआ था, तब उन्होंने उसे पकड़ लिया और येहू के पास ले आए; फिर उन्होंने उसे मार डाला।[a] इसके बाद उन्होंने उसे दफ़ना दिया, क्योंकि उन्होंने कहा, “वह यहोशापात का पुत्र है, जिसने पूरे मन से याहवे को खोजा था।” और अहज्याह के घराने में राजसत्ता बनाए रखने की सामर्थ्य न थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी क्रिया कारणवाचक है: शाब्दिक अर्थ, “उन्होंने उसे मरने का कारण बनाया।” इसलिए, “उन्होंने उसे मार डाला।”'
    reason: lexical_alternative
  - marker: b
    text: या, “अहज्याह के घराने में राज्य पर अधिकार बनाए रखने की सामर्थ्य न थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבַקֵּשׁ
  choice: उसने ... की खोज की
  rationale: בקש का मूल अर्थ किसी को ढूँढ़ना या उसकी खोज करना है। एकवचन क्रिया को बनाए रखा गया है; कर्ता प्रसंग से येहू समझा जाता है।
- source_word: וַיִּלְכְּדֻהוּ
  choice: उन्होंने उसे पकड़ लिया
  rationale: לכד यहाँ किसी व्यक्ति को खोजकर बंदी बना लेने के अर्थ में है। बहुवचन क्रिया को हिन्दी में भी रखा गया है।
- source_word: מִתְחַבֵּא בְשֹׁמְרוֹן
  choice: सामरिया में छिपा हुआ था
  rationale: हितपाएल कृदन्त छिपे रहने की जारी अवस्था बताता है; हिन्दी में कालगत उपवाक्य इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְבִאֻהוּ אֶל־יֵהוּא
  choice: येहू के पास ले आए
  rationale: हिफ़ील रूप का सीधा अर्थ ‘ले आना’ है; אֶל गंतव्य को दर्शाता है।
- source_word: וַיְמִתֻהוּ
  choice: उसे मार डाला
  rationale: מות का हिफ़ील रूप ‘मरवा देना/मृत्यु का कारण बनना’ व्यक्त करता है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ अनावश्यक रूप से औपचारिक दंडादेश का भाव नहीं जोड़ता।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे दफ़ना दिया
  rationale: קבר का प्रसंगानुकूल सीधा और प्रचलित हिन्दी रूप।
- source_word: אֲשֶׁר דָּרַשׁ אֶת־יְהוָה
  choice: जिसने ... याहवे की खोज की थी
  rationale: דרש जब परमेश्वर के साथ प्रयुक्त होता है तो भक्तिपूर्वक उसकी ओर मुड़ने और उसे खोजने का भाव रखता है। ‘खोज की’ स्रोत की पुनरुक्ति और धार्मिक आशय दोनों को बचाती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּכָל־לְבָבוֹ
  choice: अपने पूरे मन से
  rationale: यह सम्पूर्ण निष्ठा का इब्रानी मुहावरा है। हिन्दी में ‘पूरे मन से’ स्वाभाविक और सहज-बोध्य है।
- source_word: וְאֵין לְבֵית אֲחַזְיָהוּ לַעְצֹר כֹּחַ לְמַמְלָכָה
  choice: अहज्याह के घराने में राज्य को संभालने की शक्ति नहीं रही
  rationale: वाक्य राजवंश की राजसत्ता बनाए रखने की असमर्थता बताता है। ‘घराना’ בית के वंशगत अर्थ को और ‘राज्य को संभालना’ לַעְצֹר ... לְמַמְלָכָה के कार्यात्मक भाव को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। लिप्यंतरण उस नाम को स्पष्ट रखता है और उसे उपाधि में नहीं बदलता।
- issue: अंतिम उपवाक्य में अहज्याह के घराने की दशा
  choice: राज्य को संभालने की शक्ति नहीं रही
  alternative: राज्य पर अधिकार बनाए रखने की सामर्थ्य न थी; राज्य चलाने योग्य कोई न था
  rationale: मूल पाठ घराने में राज्य के संबंध में सामर्थ्य के अभाव की बात करता है। चयन राजवंशीय असमर्थता को व्यक्त करता है, पर यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि कोई उत्तराधिकारी अस्तित्व में ही नहीं था।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। नामों के लिए प्रचलित हिन्दी बाइबलीय वर्तनी रखी गई है। आरम्भ की एकवचन क्रिया और उसके बाद की बहुवचन क्रियाओं का अंतर मूल पाठ के अनुसार सुरक्षित है; कर्ताओं की पहचान स्पष्ट करने के लिए मूल से बाहर कोई संज्ञा नहीं जोड़ी गई।
