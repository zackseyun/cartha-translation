base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/002.yaml
  text: Ahaziah was forty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother’s name was Athaliah[b], the daughter of Omri.
translation:
  language: hi
  text: अहज्याह जब राजा बना, तब वह बयालीस वर्ष का था[a], और उसने यरूशलेम में एक वर्ष तक राज्य किया। उसकी माता का नाम अतल्याह[b] था; वह ओम्री की बेटी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बयालीस वर्ष का’ है। 2 राजा 8:26 के समानांतर विवरण में ‘बाईस वर्ष का’ लिखा है; इसलिए कुछ लोग इसे पाठगत समस्या मानते हैं या संख्या की कोई दूसरी गणना प्रस्तावित करते हैं।
    reason: textual_variant
  - marker: b
    text: या ‘ओम्री की वंशज।’ इब्रानी में ‘बेटी’ शब्द कभी-कभी किसी स्त्री वंशज के लिए अधिक व्यापक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
