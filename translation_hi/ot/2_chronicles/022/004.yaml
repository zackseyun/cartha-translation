  text: וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּי הֵ֜מָּה הָֽיוּ ל֣/וֹ יֽוֹעֲצִ֗ים אַחֲרֵ֛י מ֥וֹת אָבִ֖י/ו לְ/מַשְׁחִ֥ית לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/022/004.yaml
  text: He did what was evil in the sight of Yahweh[a], like the house of Ahab, because they were his counselors after the death of his father, to his destruction.
translation:
  language: hi
  text: उसने अहाब के घराने के समान वही किया जो यहोवा की दृष्टि में बुरा था, क्योंकि उसके पिता की मृत्यु के बाद वे उसके सलाहकार थे—उसके विनाश के लिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘जिसका परिणाम उसका विनाश हुआ’ या ‘उसे नष्ट करने के लिए’ भी हो सकता है। इब्रानी अभिव्यक्ति उनकी सलाह के विनाशकारी परिणाम अथवा उसके उद्देश्य—दोनों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने ... वही किया जो ... बुरा था
  rationale: इब्रानी राजकीय मूल्यांकन-सूत्र का स्वाभाविक हिन्दी रूप; आरम्भिक וַ कथानक का क्रम बताता है, जिसे हिन्दी में अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मुहावरे में परमेश्वर के मूल्यांकन का भाव है। ‘दृष्टि में’ रूपक और स्वाभाविक हिन्दी दोनों को बनाए रखता है; יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से दिया गया है।
- source_word: כְּבֵית אַחְאָב
  choice: अहाब के घराने के समान
  rationale: בֵּית यहाँ केवल भवन नहीं, अहाब के परिवार या राजवंश को दर्शाता है; כְּ तुलना व्यक्त करता है।
- source_word: הֵמָּה הָיוּ לוֹ יוֹעֲצִים
  choice: वे उसके सलाहकार थे
  rationale: मूल की नामवाची संरचना और बहुवचन संकेत को स्पष्ट, सामान्य आधुनिक हिन्दी में रखा गया है।
- source_word: אַחֲרֵי מוֹת אָבִיו
  choice: उसके पिता की मृत्यु के बाद
  rationale: इब्रानी काल-संबंध को औपचारिक किन्तु सहज हिन्दी में सीधे व्यक्त करता है।
- source_word: לְמַשְׁחִית לוֹ
  choice: उसके विनाश के लिए
  rationale: לְ और हिफ़ील क्रियारूप विनाशकारी उद्देश्य अथवा परिणाम—दोनों की ओर संकेत कर सकते हैं। यह संक्षिप्त हिन्दी अभिव्यक्ति उस अस्पष्टता को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिवाचक वाचा-नाम सीधे आया है; इसलिए उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: לְמַשְׁחִית לוֹ में उद्देश्य या परिणाम
  choice: उसके विनाश के लिए
  alternative: उसे नष्ट करने के लिए / जिसका परिणाम उसका विनाश हुआ
  rationale: मूल व्याकरण यह पूरी तरह निश्चित नहीं करता कि सलाहकारों का सचेत उद्देश्य उसे नष्ट करना था या उनकी सलाह का परिणाम उसका विनाश हुआ; मुख्य पाठ और पादटिप्पणी दोनों संभावनाएँ सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ राजवंशीय अर्थ स्पष्ट करता है। अंतिम पदबंध से पहले दीर्घ विराम उसके विनाशकारी संबंध को उभारता है, पर उद्देश्य और परिणाम के बीच मूल की अस्पष्टता नहीं मिटाता।
