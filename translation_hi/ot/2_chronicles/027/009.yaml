language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/עִ֣יר דָּוִ֑יד וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/009.yaml
  text: And Jotham slept with his fathers[a], and they buried him in the city of David. And Ahaz his son reigned in his place.
translation:
  language: hi
  text: और योताम अपने पुरखाओं के साथ सो गया[a], और उन्होंने उसे दाऊद के नगर में दफ़नाया। उसका पुत्र आहाज उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, वह मर गया। इब्रानी में शाब्दिक रूप से “अपने पुरखाओं के साथ सो गया” है; यह राजाओं की मृत्यु के लिए प्रयुक्त एक प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-सूत्र में यह क्रिया मृत्यु का संकेत देती है। ‘सो गया’ इब्रानी रूपक को बनाए रखते हुए स्वाभाविक हिन्दी है; अर्थ-स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह वंशगत मृत्यु-सूत्र है। ‘पुरखाओं’ से पूर्वजों का आशय सामान्य आधुनिक हिन्दी में स्पष्ट होता है और ‘पितरों’ से जुड़ी विशिष्ट धार्मिक ध्वनि से बचा जाता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे ... दफ़नाया
  rationale: इब्रानी में क्रिया सक्रिय बहुवचन है; हिन्दी में अनिर्दिष्ट कर्ता ‘उन्होंने’ उसी व्याकरणिक रूप को सुरक्षित रखता है।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: स्थान-संज्ञा की इब्रानी संबंध-रचना को पारदर्शी और प्रचलित हिन्दी रूप में रखा गया है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूत्र में מלך यहाँ शासन सँभालने का बोध देता है। ‘राजा हुआ’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद राजकीय उत्तराधिकार अथवा प्रतिस्थापन दर्शाता है; ‘उसके स्थान पर’ मूल अर्थ को सीधे सुरक्षित रखता है।
- source_word: יוֹתָם
  choice: योताम
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אָחָז
  choice: आहाज
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: पुत्र-संबंध को स्पष्ट रूप से रखते हुए उत्तराधिकार-सूत्र सुरक्षित किया गया है।
theological_decisions:
- issue: ‘अपने पुरखाओं के साथ सो गया’ मृत्यु का रूपक है या केवल शयन का वर्णन
  choice: मूल राजकीय मृत्यु-सूत्र को रूपक सहित रखा गया
  alternative: ‘मर गया’
  rationale: संदर्भ में मृत्यु निश्चित है, पर मूल पाठ उसे ‘सोने’ की रूढ़ अभिव्यक्ति से कहता है। मुख्य पाठ में उस तनाव को बनाए रखकर पाद-टिप्पणी में अर्थ स्पष्ट करना अधिक स्रोत-निष्ठ है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पुरखाओं’, ‘दफ़नाया’ और ‘राजा हुआ’ सहज वर्तमान हिन्दी के रूप हैं; मृत्यु-सूत्र का मूल रूपक पाद-टिप्पणी सहित सुरक्षित है।
