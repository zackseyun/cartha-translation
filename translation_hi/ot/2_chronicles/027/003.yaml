source:
  edition: WLC
  text: ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְי֑וֹן וּ/בְ/חוֹמַ֥ת הָ/עֹ֛פֶל בָּנָ֖ה לָ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/003.yaml
  text: He built the upper gate of the house of Yahweh[a], and on the wall of the Ophel he built much.
translation:
  language: hi
  text: उसने याहवे के भवन का ऊपरी फाटक बनाया, और ओपेल की दीवार पर बहुत-सा निर्माण किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ओपेल की दीवार पर बड़े पैमाने पर निर्माण किया।”
    reason: לָרֹב निर्माण की मात्रा को ‘बहुत-सा’ अथवा उसकी व्यापकता को ‘बड़े पैमाने पर’ व्यक्त कर सकता है।
lexical_decisions:
- source_word: בָּנָה
  choice: बनाया / निर्माण किया
  rationale: क्रिया का सामान्य अर्थ ‘बनाना, निर्माण करना’ है। पहले खंड में ‘बनाया’ स्वाभाविक है; दूसरे में निर्माण-कार्य की मात्रा व्यक्त करने के लिए ‘निर्माण किया’ अधिक स्पष्ट है। संदर्भ पुनर्निर्माण को अनिवार्य नहीं करता।
- source_word: שַׁעַר
  choice: फाटक
  rationale: यह मंदिर-परिसर के प्रवेश-द्वार को सूचित करता है; ‘फाटक’ आधुनिक हिंदी में स्पष्ट और वास्तु-संदर्भ के अनुकूल है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: यह हिब्रू के शाब्दिक रूप ‘याहवे का घर/भवन’ को बनाए रखता है। पवित्र उपासना-स्थल के लिए ‘भवन’ गरिमापूर्ण और सहज है, जबकि ‘मंदिर’ अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू व्यक्तिवाचक ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: הָעֶלְיוֹן
  choice: ऊपरी
  rationale: यह विशेषण फाटक की स्थिति बताता है; ‘ऊपरी फाटक’ स्वाभाविक और सटीक हिंदी है।
- source_word: וּבְחוֹמַת
  choice: और ... की दीवार पर
  rationale: निर्माण-संदर्भ में ב दीवार पर या उससे संबद्ध किए गए काम को दर्शाता है; हिंदी में ‘दीवार पर’ सबसे स्वाभाविक है।
- source_word: הָעֹפֶל
  choice: ओपेल
  rationale: यह यरूशलेम के ऊँचे, किलेबंद क्षेत्र का स्थाननाम है, इसलिए इसका अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: לָרֹב
  choice: बहुत-सा
  rationale: यह निर्माण-कार्य की बड़ी मात्रा या व्यापकता बताता है। ‘बहुत-सा निर्माण किया’ मूल की संक्षिप्तता को रखते हुए स्वाभाविक हिंदी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिवाचक चतुरक्षरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता; ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: בֵּית יְהוָה का रूप
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: ‘भवन’ स्रोत के ‘घर/भवन’ रूपक को सुरक्षित रखता है, जबकि संदर्भ से स्पष्ट है कि आशय उपासना-स्थल से है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य में हिब्रू की दोहराई गई क्रिया को हिंदी की सहजता के अनुसार पहले ‘बनाया’ और फिर ‘निर्माण किया’ कहा गया है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका lexical विकल्प संबंधित है।
