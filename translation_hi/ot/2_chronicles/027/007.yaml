  yaml_path: translation/ot/2_chronicles/027/007.yaml
  text: The rest of the acts of Jotham[a], and all his wars and his ways—behold[b], they are written in the Book of the Kings of Israel and Judah.
translation:
  language: hi
  text: योताम के बाकी कामों[a], उसके सारे युद्धों और उसके चालचलन[b]—देखो, वे इस्राएल और यहूदा के राजाओं की पुस्तक में लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “योताम की बाकी बातें”; इस राजकीय इतिहास-सूत्र में इसका अर्थ उसके बाकी काम या मामले हैं।
    reason: lexical_alternative
  - marker: b
    text: या “उसके मार्गों”; यहाँ इसका आशय उसके आचरण या जीवन-व्यवहार से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: योताम के बाकी कामों
  rationale: राजकीय इतिहास के इस समापन-सूत्र में דִּבְרֵי का आशय केवल ‘बातों’ या ‘वचनों’ से नहीं, बल्कि राजा के कामों और मामलों से है। ‘बाकी कामों’ सहज हिन्दी में यही अर्थ देता है।
- source_word: מִלְחֲמֹתָיו
  choice: उसके सब युद्धों
  rationale: बहुवचन संज्ञा राजा के युद्धों अथवा सैन्य संघर्षों को सीधे व्यक्त करती है।
- source_word: וּדְרָכָיו
  choice: उसके चालचलन
  rationale: דֶּרֶךְ का मूल बिंब ‘मार्ग’ है, पर यहाँ इसका आशय जीवन-व्यवहार या आचरण से है। ‘चालचलन’ आधुनिक हिन्दी में इस नैतिक-व्यावहारिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנָּם כְּתוּבִים
  choice: का वर्णन ... लिखा हुआ है
  rationale: हिब्रू הִנָּם ध्यान आकर्षित करता है, पर हिन्दी के अभिलेखीय समापन-सूत्र में अलग से ‘देखो’ कहना अस्वाभाविक होगा। ‘लिखा हुआ है’ उपलब्ध अभिलेख की स्थिति को स्पष्ट रखता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप ‘पुस्तक/पत्र पर’ है, किन्तु लिखित स्रोत का उल्लेख करते समय हिन्दी में ‘पुस्तक में लिखा’ स्वाभाविक है।
- source_word: מַלְכֵי יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा के राजाओं की पुस्तक
  rationale: यह ज्ञात राजकीय अभिलेख के शीर्षक-सदृश उल्लेख को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
