base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/006.yaml
  text: So Jotham became strong, because he ordered his ways before the LORD his God.
translation:
  language: hi
  text: इस प्रकार योताम शक्तिशाली हुआ, क्योंकि उसने यहोवा, अपने परमेश्वर, के सामने अपने आचरण को व्यवस्थित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: सामर्थी होता गया
  rationale: हितपएल रूप यहाँ क्रमशः दृढ़ और शक्तिशाली होने का भाव देता है; संदर्भ में राजा की बढ़ती सामर्थ्य स्वाभाविक है।
- source_word: הֵכִין דְּרָכָיו
  choice: अपने चालचलन को सुव्यवस्थित किया
  rationale: הֵכִין का अर्थ तैयार, स्थापित या ठीक क्रम में करना हो सकता है, और דְּרָכָיו रूपकतः जीवन के आचरण को दर्शाता है। यह चयन मूल रूपक और सुनियोजित दृढ़ता दोनों को व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: दिव्य नाम יהוה को 'यहोवा' और לִפְנֵי को जवाबदेही तथा उपस्थिति सूचित करने वाले 'के सामने' से प्रस्तुत किया गया है।
theological_decisions:
- issue: योताम की सामर्थ्य और उसके आचरण के बीच कारण-संबंध
  choice: क्योंकि
  alternative: जबकि / इस कारण से संबंधित था कि
  rationale: मूल כִּי स्पष्टतः कारण बताता है; अनुवाद उसी संबंध को रखता है, पर इससे सार्वभौमिक समृद्धि-सिद्धांत नहीं गढ़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज स्तर रखा गया है। 'चालचलन' से דרך के नैतिक-जीवनगत रूपक को बचाया गया है; 'सुव्यवस्थित किया' सामान्य पाठक के लिए 'अपने मार्ग तैयार किए' से अधिक स्वाभाविक है।
