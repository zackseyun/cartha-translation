lexical_decisions:
- source_word: עָרִים
  choice: नगर
  rationale: यह बहुवचन आबाद बस्तियों को सूचित करता है; राजकीय निर्माण के संदर्भ में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: בָּנָה
  choice: बसाए / बनवाईं
  rationale: मूल क्रिया का अर्थ ‘बनाना’ है। नगरों के लिए हिंदी में ‘बसाए’ और रक्षा-संरचनाओं के लिए ‘बनवाईं’ अधिक स्वाभाविक हैं; कर्ता राजा होने के कारण प्रयोजक भाव भी उपयुक्त है।
- source_word: בְּהַר יְהוּדָה
  choice: यहूदा के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पहाड़ से अधिक भौगोलिक पर्वतीय/पहाड़ी क्षेत्र को दर्शाता है।
- source_word: חֳרָשִׁים
  choice: वन-प्रदेशों
  rationale: शब्द वन, वृक्षाच्छादित भूभाग या झाड़ियों वाले क्षेत्रों को सूचित कर सकता है; ‘वन-प्रदेश’ भूभाग का भाव बनाए रखता है।
- source_word: בִּירָנִיּוֹת
  choice: गढ़
  rationale: यह बहुवचन किलेबंद रक्षात्मक संरचनाओं को दर्शाता है; ‘गढ़’ संक्षिप्त, सहज और ऐतिहासिक संदर्भ के अनुकूल है।
- source_word: מִגְדָּלִים
  choice: मीनारें
  rationale: शब्द ऊँची मीनारनुमा, संभवतः रक्षात्मक संरचनाओं को सूचित करता है; ‘मीनारें’ आधुनिक हिंदी में स्पष्ट है।
