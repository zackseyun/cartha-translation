source:
  edition: WLC
  text: וְ֠/הוּא נִלְחַ֞ם עִם מֶ֣לֶךְ בְּנֵי עַמּוֹן֮ וַ/יֶּחֱזַ֣ק עֲלֵי/הֶם֒ וַ/יִּתְּנוּ ל֨/וֹ בְנֵֽי עַמּ֜וֹן בַּ/שָּׁנָ֣ה הַ/הִ֗יא מֵאָה֙ כִּכַּר כֶּ֔סֶף וַ/עֲשֶׂ֨רֶת אֲלָפִ֤ים כֹּרִים֙ חִטִּ֔ים וּ/שְׂעוֹרִ֖ים עֲשֶׂ֣רֶת אֲלָפִ֑ים זֹ֗את הֵשִׁ֤יבוּ ל/וֹ֙ בְּנֵ֣י עַמּ֔וֹן וּ/בַ/שָּׁנָ֥ה הַ/שֵּׁנִ֖ית וְ/הַ/שְּׁלִשִֽׁית־־־־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/005.yaml
  text: He fought with the king of the Ammonites and prevailed against them[a], and the Ammonites gave him that year one hundred talents of silver, ten thousand cors of wheat, and ten thousand of barley. This the Ammonites paid to him also in the second year and in the third.
translation:
  language: hi
  text: उसने अम्मोनियों के राजा से युद्ध किया और उन पर प्रबल हुआ। तब अम्मोनियों ने उस वर्ष उसे सौ किक्कार चाँदी, दस हज़ार कोर गेहूँ और दस हज़ार कोर[a] जौ दिए। अम्मोनियों ने दूसरे और तीसरे वर्ष भी उसे इतना ही दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दस हज़ार कोर गेहूँ और दस हज़ार जौ’ है; जौ के साथ ‘कोर’ पिछले वाक्यांश से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִלְחַם עִם
  choice: से युद्ध किया
  rationale: निफ़अल रूप और עִם यहाँ किसी के विरुद्ध युद्ध करने को व्यक्त करते हैं; आधुनिक हिन्दी में ‘से युद्ध किया’ स्वाभाविक है।
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के राजा
  rationale: בְּנֵי עַמּוֹן अम्मोनी जाति के लिए प्रचलित जातिनाम है।
- source_word: וַיֶּחֱזַק עֲלֵיהֶם
  choice: उन पर प्रबल हुआ
  rationale: सैनिक प्रसंग में חזק עם־על विरोधी पर बढ़त पाने और विजय प्राप्त करने का भाव देता है; ‘प्रबल हुआ’ मूल रूपक को बनाए रखता है।
- source_word: וַיִּתְּנוּ לוֹ
  choice: उसे ... दिए
  rationale: נתן का मूल अर्थ ‘देना’ है; भेंट की प्रकृति प्रसंग से स्पष्ट होती है, इसलिए पहले कथन में सरल क्रिया रखी गई है।
- source_word: מֵאָה כִּכַּר כֶּסֶף
  choice: सौ किक्कार चाँदी
  rationale: כִּכָּר प्राचीन भार-माप है। हिन्दी बाइबलीय प्रयोग में ‘किक्कार’ इकाई की ऐतिहासिक विशिष्टता बनाए रखता है।
- source_word: עֲשֶׂרֶת אֲלָפִים כֹּרִים חִטִּים
  choice: दस हज़ार कोर गेहूँ
  rationale: כֹּר प्राचीन शुष्क परिमाण है; इसे ‘कोर’ के रूप में लिप्यंतरित किया गया है ताकि अनिश्चित आधुनिक रूपांतरण न थोपा जाए।
- source_word: וּשְׂעוֹרִים עֲשֶׂרֶת אֲלָפִים
  choice: दस हज़ार कोर जौ
  rationale: इब्रानी में जौ के साथ माप का नाम दोहराया नहीं गया, पर पिछले पदबंध से כֹּרִים स्वाभाविक रूप से अध्याहृत है; हिन्दी में अर्थ स्पष्ट रखने के लिए इसे मुख्य पाठ में दोहराया गया और पादटिप्पणी में मूल की संक्षिप्तता बताई गई।
- source_word: זֹאת הֵשִׁיבוּ לוֹ
  choice: उसे इतना ही दिया
  rationale: זֹאת पिछले पूरे परिमाण की ओर संकेत करता है और הֵשִׁיבוּ यहाँ अगले वर्षों में वही अर्पण फिर देने का भाव रखता है। ‘इतना ही दिया’ पुनरावृत्ति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּבַשָּׁנָה הַשֵּׁנִית וְהַשְּׁלִשִׁית
  choice: दूसरे और तीसरे वर्ष भी
  rationale: वही भेंट दोनों अगले वर्षों में जारी रहने का आशय संक्षिप्त और स्पष्ट रूप से व्यक्त होता है।
