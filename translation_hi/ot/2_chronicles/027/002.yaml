source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ הַ/יָּשָׁ֜ר בְּ/עֵינֵ֣י יְהוָ֗ה כְּ/כֹ֤ל אֲשֶׁר עָשָׂה֙ עֻזִּיָּ֣הוּ אָבִ֔י/ו רַ֕ק לֹא בָ֖א אֶל הֵיכַ֣ל יְהוָ֑ה וְ/ע֥וֹד הָ/עָ֖ם מַשְׁחִיתִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/002.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done—except that he did not enter the temple of Yahweh[b]. But the people still acted corruptly.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में वही किया जो सही था, जैसा उसके पिता उज्जियाह ने किया था; केवल उसने याहवे के मंदिर में प्रवेश नहीं किया।[a] फिर भी लोग भ्रष्ट आचरण करते रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह याहवे के मंदिर में नहीं गया।” यह उपवाक्य संभवतः योताम को उज्जियाह से अलग दिखाता है, जिसने अनुचित रीति से मंदिर में प्रवेश किया था (देखें 2 इतिहास 26:16–21)।
    reason: בוא + אֶל के ‘जाना’ वैकल्पिक अनुवाद और निकट संदर्भ में उज्जियाह के मंदिर-प्रवेश से तुलना को स्पष्ट करता है।
  - marker: b
    text: या, “लोग अब भी अपने आपको भ्रष्ट कर रहे थे” अथवा “लोग अब भी भ्रष्ट रीति से व्यवहार कर रहे थे।”
    reason: מַשְׁחִיתִים के जारी रहने वाले भाव तथा संभावित आत्मवाचक/सामान्य नैतिक अर्थ को दर्शाता है।
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: उसने ... वही किया जो सही था
  rationale: क्रिया और संज्ञा के रूप में प्रयुक्त विशेषण का स्वाभाविक हिन्दी रूप; इससे नैतिक मूल्यांकन स्पष्ट रहता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: इब्रानी मुहावरे की दृष्टि-संबंधी छवि को स्वाभाविक हिन्दी में बनाए रखता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה עֻזִּיָּהוּ אָבִיו
  choice: ठीक अपने पिता उज्जियाह के किए हुए सब कामों के अनुसार
  rationale: כְּכֹל की व्यापकता और पिता के आचरण को नमूना मानने का भाव सुरक्षित रहता है।
- source_word: רַק
  choice: बस
  rationale: यह पहले कथन की सीमा अथवा अपवाद को संक्षिप्त और स्वाभाविक ढंग से प्रकट करता है।
- source_word: לֹא בָא אֶל הֵיכַל יְהוָה
  choice: वह याहवे के मंदिर में प्रवेश नहीं किया
  rationale: בוא + אֶל का यहाँ संदर्भानुकूल अर्थ ‘प्रवेश करना’ है; הֵיכָל को ‘मंदिर’ कहना स्पष्ट और प्रचलित है।
- source_word: וְעוֹד הָעָם מַשְׁחִיתִים
  choice: फिर भी लोग भ्रष्ट आचरण करते रहे
  rationale: ‘फिर भी’ राजा और प्रजा के आचरण का विरोध दिखाता है; ‘करते रहे’ जारी अवस्था को और ‘भ्रष्ट आचरण’ שׁחת के नैतिक अर्थ को व्यक्त करता है, बिना अनिर्दिष्ट कर्म को जोड़ने के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: योताम और उज्जियाह के आचरण की तुलना
  choice: मंदिर में प्रवेश न करने को तुलना का स्पष्ट अपवाद रखा गया
  alternative: इसे केवल योताम की सामान्य भक्ति का स्वतंत्र विवरण मानना
  rationale: רַק इस उपवाक्य को पिछली व्यापक तुलना की सीमा बनाता है; संदर्भ में यह उज्जियाह के अनुचित मंदिर-प्रवेश से संभावित विरोध भी बनाता है, पर मुख्य पाठ उस संकेत को व्याख्या के रूप में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘दृष्टि में’ स्रोत की छवि बनाए रखता है; ‘भ्रष्ट आचरण करते रहे’ सामान्य पाठक के लिए सहज है। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न उनके संबंधित वाक्यांशों के बाद रखे गए हैं।
