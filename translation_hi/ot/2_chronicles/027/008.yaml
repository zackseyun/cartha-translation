  text: जब वह राजा बना, तब वह पच्चीस वर्ष का था, और उसने यरूशलेम में सोलह वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: पच्चीस वर्ष का
  rationale: यह इब्रानी में आयु बताने का सामान्य मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक और सटीक रूप ‘पच्चीस वर्ष का’ है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: शाब्दिक संरचना ‘उसके राज करने में वह था’ राजगद्दी संभालते समय की आयु बताती है। ‘जब वह राजा बना’ हिन्दी में इस आशय को सहजता से व्यक्त करता है।
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: सोलह वर्ष तक
  rationale: संख्या और कालावधि को सीधे व्यक्त किया गया है; ‘तक’ हिन्दी में राज करने की अवधि स्पष्ट और स्वाभाविक बनाता है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: यह क्रिया राजा के रूप में शासन करने को सूचित करती है; ‘राज किया’ आधुनिक हिन्दी का सीधा और प्रचलित समतुल्य है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: उपसर्ग ב यहाँ स्थान बताता है; इसलिए ‘यरूशलेम में’ उपयुक्त अनुवाद है।
