base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/027/001.yaml
  text: Jotham was twenty-five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother’s name was Jerushah daughter of Zadok.
translation:
  language: hi
  text: योताम पच्चीस वर्ष का था जब वह राजा बना, और उसने यरूशलेम में सोलह वर्ष राज्य किया। उसकी माता का नाम यरूशा था; वह सादोक की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: पच्चीस वर्ष का था
  rationale: इब्रानी में आयु बताने का यह मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक और अर्थ-सटीक रूप यही है।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रचना उसके राजत्व आरम्भ करने के समय को सूचित करती है। ‘राजा बना’ सामान्य पाठक के लिए सहज है और राज्यारोहण का अर्थ स्पष्ट रखता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ राजा के रूप में शासन करना है; ‘राज्य किया’ हिन्दी के राजकीय वृत्तांत की स्वाभाविक अभिव्यक्ति है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक ב को ‘में’ से व्यक्त किया गया और स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: वंश-सूचना के सूत्र को अर्थपूर्ण, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखा गया।
- source_word: יְרוּשָׁה
  choice: यरूशा
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בַּת צָדוֹק
  choice: सादोक की बेटी
  rationale: इब्रानी संबंध-सूचक पद का सीधा अर्थ सुरक्षित है; ‘बेटी’ आधुनिक सामान्य हिन्दी में ‘पुत्री’ से अधिक सहज है।
