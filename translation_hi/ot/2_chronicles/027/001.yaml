  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। राजकीय वृत्तांत के लिए ‘राजा बना’ और ‘राज्य किया’ जैसे परिचित पद चुने गए हैं। इस पद में किसी पाठगत या धर्मवैज्ञानिक अस्पष्टता के लिए पादटिप्पणी आवश्यक नहीं है।
