base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/018.yaml
  text: And the Philistines had raided the cities of the lowland and the Negeb of Judah[a], and they captured Beth-shemesh, Aijalon, Gederoth, Soko and its villages, Timnah and its villages, and Gimzo and its villages; and they settled there.
translation:
  language: hi
  text: और पलिश्तियों ने यहूदा के निचले प्रदेश और नेगेव के नगरों में छापे मारे थे। उन्होंने बेत-शेमेश, अय्यालोन, गदेरोत, सोको[a] और उसके अधीन गाँवों, तिम्ना और उसके अधीन गाँवों, तथा गिमजो और उसके अधीन गाँवों पर अधिकार कर लिया और वहीं बस गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नाम का एक अन्य रूप “सोखो” है।
    reason: नाम के लिप्यंतरण का वैकल्पिक प्रचलित रूप।
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: और पलिश्तियों ने
  rationale: जाति-सूचक नाम का प्रचलित हिन्दी रूप लिया गया है और आरंभिक संयोजक वाव को कथा-प्रवाह के लिए “और” से व्यक्त किया गया है।
- source_word: פָּשְׁטוּ
  choice: धावा बोला था
  rationale: सैन्य प्रसंग में क्रिया छापामार आक्रमण या चढ़ाई का बोध कराती है; पूर्ण भूतकाल आगे दिए गए नगर-अधिग्रहणों की पृष्ठभूमि स्पष्ट करता है।
- source_word: בְּעָרֵי הַשְּׁפֵלָה וְהַנֶּגֶב לִיהוּדָה
  choice: यहूदा के निचले प्रदेश और नेगेव के नगरों
  rationale: שְׁפֵלָה को पश्चिमी निम्न भूभाग के रूप में “निचला प्रदेश” कहा गया है, जबकि נֶגֶב को केवल “दक्षिण” न बनाकर भौगोलिक नाम “नेगेव” रखा गया है।
- source_word: וַיִּלְכְּדוּ
  choice: पर अधिकार कर लिया
  rationale: नगरों को सैन्य बल से अपने नियंत्रण में लेने का स्वाभाविक और स्पष्ट हिन्दी प्रयोग है।
- source_word: בֵּית שֶׁמֶשׁ / אַיָּלוֹן / הַגְּדֵרוֹת / שׂוֹכוֹ / תִּמְנָה / גִּמְזוֹ
  choice: बेत-शेमेश / अय्यालोन / गदेरोत / सोको / तिम्ना / गिमजो
  rationale: स्थान-नामों को अनुवादित करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण में रखा गया है।
- source_word: וּבְנוֹתֶיהָ / בְּנֹתֶיהָ
  choice: और उसके अधीन गाँवों
  rationale: शाब्दिक अर्थ “उसकी बेटियाँ” है, जो मुख्य नगर पर निर्भर छोटी बस्तियों के लिए प्राचीन मुहावरा है; “अधीन गाँव” उस संबंध को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: और वहीं बस गए
  rationale: यहाँ ישׁב विजय के बाद निवास स्थापित करने का संकेत देता है; “बस गए” केवल अस्थायी ठहराव के बजाय स्थायी कब्जे और निवास को व्यक्त करता है।
