source:
  edition: WLC
  text: וְ֠/עַתָּה בְּנֵֽי יְהוּדָ֤ה וִֽ/ירוּשָׁלִַ֨ם֙ אַתֶּ֣ם אֹמְרִ֔ים לִ/כְבֹּ֛שׁ לַ/עֲבָדִ֥ים וְ/לִ/שְׁפָח֖וֹת לָ/כֶ֑ם הֲ/לֹ֤א רַק אַתֶּם֙ עִמָּ/כֶ֣ם אֲשָׁמ֔וֹת לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/010.yaml
  text: And now[a], you are saying that you will subdue the people of Judah and Jerusalem as male and female servants for yourselves[c][b]. But do not you yourselves also have guilt before Yahweh your God?
translation:
  language: hi
  text: और अब तुम कहते हो कि तुम यहूदा और यरूशलेम के लोगों[a] को अपने लिए दास-दासियाँ बनाने के लिए अपने अधीन करोगे[b]। पर क्या तुम स्वयं भी अपने परमेश्वर यहोवा के सामने दोषी नहीं हो?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा और यरूशलेम के पुत्रों”; इब्रानी में यह पुल्लिंग बहुवचन पद लोगों का सामूहिक उल्लेख करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें अपने लिए दास-दासियों के रूप में अधीन करोगे।”
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी का अंतिम प्रश्न अत्यंत संक्षिप्त और व्याकरणतः कठिन है; शाब्दिक रूप से इसका भाव लगभग यह है: “क्या यहोवा, तुम्हारे परमेश्वर के प्रति तुम्हारे अपने दोष भी नहीं हैं?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालवाचक क्रियाविशेषण दोनों को रखते हुए यह वक्ता की वर्तमान फटकार का स्वाभाविक आरंभ है।
- source_word: בְּנֵי יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम के लोगों
  rationale: शाब्दिक रूप से ‘पुत्र’ है, पर यहाँ दोनों स्थानों के निवासियों का सामूहिक उल्लेख है; ‘लोगों’ आधुनिक हिन्दी में इस आशय को स्पष्ट करता है।
- source_word: אַתֶּם אֹמְרִים
  choice: तुम कहते हो
  rationale: सर्वनाम के साथ कृदन्त वर्तमान कथन के साथ-साथ इरादा भी व्यक्त कर सकता है; हिन्दी में यह पदबंध आरोप की तात्कालिकता बनाए रखता है।
- source_word: לִכְבֹּשׁ
  choice: अपने अधीन करोगे
  rationale: כּבש का मूल अर्थ बलपूर्वक वश में करना या अधीन करना है; दास-दासियाँ बनाने वाला अगला पद परिणाम और उद्देश्य स्पष्ट करता है।
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת לָכֶם
  choice: अपने लिए दास-दासियाँ बनाने के उद्देश्य से
  rationale: युद्धबंदियों की जबरन अधीनता के संदर्भ में ‘दास-दासियाँ’ बंधुआ स्थिति को स्पष्ट करता है और לָכֶם का स्वार्थपरक भाव ‘अपने लिए’ से प्रकट होता है।
- source_word: הֲלֹא רַק אַתֶּם עִמָּכֶם אֲשָׁמוֹת
  choice: पर क्या तुम स्वयं भी ... दोषी नहीं हो?
  rationale: इब्रानी वाक्य संक्षिप्त और असामान्य है। यह अनुवाद आत्म-परीक्षण कराने वाली आलंकारिक फटकार को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी अधिक शाब्दिक संरचना बताती है।
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा के सामने
  rationale: ל यहाँ परमेश्वर के प्रति उत्तरदायित्व अथवा उसकी दृष्टि में दोष को सूचित करता है; ‘सामने’ उस न्यायिक-संबंधपरक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। आधुनिक हिन्दी बाइबल-पाठकों में सुस्थापित रूप ‘यहोवा’ नाम के रूप में इसे बनाए रखता है, न कि उपाधि ‘प्रभु’ से बदलता है।
- issue: עֲבָדִים और שְׁפָחוֹת की सामाजिक स्थिति
  choice: दास-दासियाँ
  alternative: सेवक-सेविकाएँ
  rationale: यहाँ युद्ध में पकड़े गए लोगों को बलपूर्वक निजी अधीनता में लाने की बात है; इसलिए सामान्य सेवा के बजाय दासता सूचित करने वाला पद आवश्यक है।
- issue: अंतिम आलंकारिक प्रश्न की संक्षिप्तता
  choice: क्या तुम स्वयं भी ... दोषी नहीं हो?
  alternative: क्या तुम्हारे साथ केवल दोष-अपराध नहीं हैं?
  rationale: स्वाभाविक हिन्दी में प्रश्न का अभिप्राय दिया गया है, किंतु मूल की असामान्य बहुवचन संज्ञा और रַק से उत्पन्न तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल संबोधन रखा गया है। ‘तुम’ बहुवचन श्रोताओं के लिए है। वाक्य में बलपूर्वक अधीनता और दासता दोनों को अलग-अलग व्यक्त किया गया है; अंतिम प्रश्न की मूल-पाठीय संक्षिप्तता पादटिप्पणी में सुरक्षित है।
