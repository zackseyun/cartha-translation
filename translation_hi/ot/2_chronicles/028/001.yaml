reference: 2 Chronicles 28:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֧ה הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/דָוִ֥יד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/001.yaml
  text: Ahaz was twenty years old when he became king[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh, as David his father had done.
translation:
  language: hi
  text: जब आहाज राजा बना, तब वह बीस वर्ष का था, और उसने यरूशलेम में सोलह वर्ष राज्य किया। उसने वह काम नहीं किया जो याहवे की दृष्टि में सही था, जैसा उसके पूर्वज दाऊद ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: वह बीस वर्ष का था
  rationale: यह इब्रानी में आयु बताने का सामान्य सूत्र है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: בְּמָלְכוֹ
  choice: जब आहाज राजा बना
  rationale: यह पदबंध उसके राजगद्दी पर बैठने के समय को दर्शाता है।
- source_word: מָלַךְ
  choice: उसने ... राज्य किया
  rationale: क्रिया का अर्थ राजा के रूप में शासन करना है; हिन्दी में ‘राज्य किया’ प्रचलित राजकीय सूत्र है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह उसके शासन-स्थान को बताने वाला सीधा स्थानवाचक पदबंध है।
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: उसने वह काम नहीं किया ... जो सही था
  rationale: यह इतिहास-वृत्तांतों का प्रचलित नैतिक मूल्यांकन है और आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहवे की दृष्टि में
  rationale: ‘आँखों में’ के इब्रानी मुहावरे को स्वाभाविक हिन्दी ‘दृष्टि में’ से व्यक्त किया गया है, जो परमेश्वर के मूल्यांकन को दर्शाता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण दिया गया है।
- source_word: כְּדָוִיד אָבִיו
  choice: जैसा उसके पूर्वज दाऊद ने किया था
  rationale: אָבִיו का शाब्दिक अर्थ ‘उसका पिता’ है, पर यहाँ राजवंशीय पूर्वज दाऊद अभिप्रेत है; ‘पूर्वज’ आधुनिक हिन्दी में भ्रम से बचाते हुए आशय को सीधे व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है; ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: דָוִיד אָבִיו में אָבִיו का संबंध
  choice: उसके पूर्वज दाऊद
  alternative: उसके पिता दाऊद
  rationale: दाऊद आहाज का निकट पिता नहीं, बल्कि राजवंशीय पूर्वज था। ‘पूर्वज’ संदर्भगत अर्थ स्पष्ट करता है और गलत जैविक संबंध से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण ऐतिहासिक शैली। राजकीय सूत्रों के लिए ‘राजा बना’ और ‘राज्य किया’ रखा गया है; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
