  text: וַֽ/יִּתְּנֵ֜/הוּ יְהוָ֣ה אֱלֹהָי/ו֮ בְּ/יַ֣ד מֶ֣לֶךְ אֲרָם֒ וַ/יַּ֨כּוּ ב֔/וֹ וַ/יִּשְׁבּ֤וּ מִמֶּ֨/נּוּ֙ שִׁבְיָ֣ה גְדוֹלָ֔ה וַ/יָּבִ֖יאוּ דַּרְמָ֑שֶׂק וְ֠/גַם בְּ/יַד מֶ֤לֶךְ יִשְׂרָאֵל֙ נִתָּ֔ן וַ/יַּךְ בּ֖/וֹ מַכָּ֥ה גְדוֹלָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/005.yaml
  text: Therefore Yahweh his God gave him into the hand of the king of Aram[a], and they struck him and took from him a great number of captives and brought them to Damascus. He was also given into the hand of the king of Israel[c][b], who struck him with a great blow.
translation:
  language: hi
  text: इसलिए उसके परमेश्वर यहोवा ने उसे अराम के राजा के हाथ में कर दिया। उन्होंने उस पर प्रहार किया और उससे बहुत-से लोगों को बंदी बनाकर दमिश्क ले गए। उसे इस्राएल के राजा के हाथ में भी कर दिया गया, जिसने उस पर भारी प्रहार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... בְּיַד
  choice: उसे ... के हाथ में कर दिया
  rationale: נתן के साथ בְּיַד किसी को दूसरे के अधिकार में सौंप देने का मुहावरा है। हिन्दी में यह अभिव्यक्ति मूल बिंब और दैवी कर्तृत्व दोनों बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है, न कि उसे किसी उपाधि से बदलता है।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: इब्रानी के संबंधसूचक रूप को सीधे बनाए रखता है और न्याय के प्रसंग में भी व्यक्त वाचा-संबंध को नहीं हटाता।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: אֲרָם को उसके ऐतिहासिक नाम ‘अराम’ के रूप में रखा गया है; बाद के नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
- source_word: וַיַּכּוּ בוֹ
  choice: अरामियों ने उसे पराजित किया
  rationale: बहुवचन कर्ता को हिन्दी में स्पष्ट करने के लिए ‘अरामियों’ की पूर्ति की गई है। युद्ध-संदर्भ में נכה का स्वाभाविक अर्थ ‘पराजित किया’ है।
- source_word: וַיִּשְׁבּוּ מִמֶּנּוּ שִׁבְיָה גְדוֹלָה
  choice: उसके यहाँ से बहुत-से लोगों को बंदी बनाया
  rationale: שִׁבְיָה גְדוֹלָה सामूहिक रूप से बड़ी संख्या में बंदियों को सूचित करता है। यह हिन्दी में ठोस और सहज रूप से व्यक्त किया गया है।
- source_word: וַיָּבִיאוּ דַּרְמָשֶׂק
  choice: दमिश्क ले गए
  rationale: ले जाए गए बंदियों का कर्म पिछले खंड से स्पष्ट है; हिन्दी में संयुक्त वाक्य-रचना उसी संदर्भ को स्वाभाविक रूप से आगे बढ़ाती है।
- source_word: וְגַם בְּיַד מֶלֶךְ יִשְׂרָאֵל נִתָּן
  choice: वह इस्राएल के राजा के हाथ में भी कर दिया गया
  rationale: निष्क्रिय נִתָּן पहले खंड के נתן को प्रतिध्वनित करता है। ‘भी’ अतिरिक्त दैवी न्याय को व्यक्त करता है।
- source_word: וַיַּךְ בּוֹ מַכָּה גְדוֹלָה
  choice: जिसने उसे बुरी तरह पराजित किया
  rationale: युद्ध-संदर्भ में מַכָּה גְדוֹלָה का आशय भारी पराजय है। यह हिन्दी में मुहावरेदार है और प्रहार के परिणाम को स्पष्ट करता है।
theological_decisions:
- issue: यहूदा की पराजय में दैवी कर्तृत्व
  choice: यहोवा ने उसे विदेशी राजा के हाथ में कर दिया; दूसरी बार निष्क्रिय रूप में भी यही कर्तृत्व निहित रखा गया है।
  alternative: घटना को केवल राजनीतिक या सैनिक पराजय के रूप में प्रस्तुत करना।
  rationale: पद में נתן पहले सक्रिय और फिर निष्क्रिय रूप में आता है, जिससे सैनिक घटनाएँ दैवी न्याय के ढाँचे में रखी जाती हैं। अनुवाद इस कारणता को न तो मिटाता है, न उससे आगे कोई व्याख्या जोड़ता है।
- issue: परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में יהוה व्यक्तिगत नाम है। हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदलने से बचाता है।
- issue: एकवचन ‘उसे’ का संदर्भ
  choice: राजा को व्याकरणिक केंद्र बनाए रखा गया, जबकि पराजय और बंदीकरण उसके राज्य तथा लोगों को भी समेटते हैं।
  alternative: हर सर्वनाम को स्पष्ट रूप से ‘यहूदा’ या ‘आहाज’ से बदल देना।
  rationale: इब्रानी में पुल्लिंग एकवचन सर्वनाम है और निकट संदर्भ में आहाज इसका पूर्वपद है; सैनिक परिणाम सामूहिक हैं। मूल की यह प्रतिनिधिक तनावपूर्णता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘के हाथ में कर दिया’ इब्रानी मुहावरे को बनाए रखता है; युद्ध-संदर्भ में बार-बार शाब्दिक ‘मारा’ कहने के बजाय ‘पराजित किया’ स्वाभाविक हिन्दी देता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
