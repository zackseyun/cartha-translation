language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא שָׁלַ֞ח הַ/מֶּ֧לֶךְ אָחָ֛ז עַל מַלְכֵ֥י אַשּׁ֖וּר לַ/עְזֹ֥ר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/016.yaml
  text: At that time King Ahaz sent to the kings of Assyria for help[a].
translation:
  language: hi
  text: उस समय राजा आहाज ने अश्शूर के राजाओं के पास सहायता के लिए संदेश भेजा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अश्शूर के राजाओं’; कुछ अनुवाद ऐतिहासिक स्थिति से सामंजस्य बैठाने के लिए ‘अश्शूर के राजा’ लिखते हैं।
    reason: मूल पाठ के बहुवचन और ऐतिहासिक रूप से अपेक्षित एकवचन के बीच पाठकीय रूप से महत्त्वपूर्ण अंतर बताना।
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह मानक काल-सूचक अभिव्यक्ति है; ‘उस समय’ स्वाभाविक आधुनिक हिन्दी में कथा की समय-भूमिका को सुरक्षित रखता है।
- source_word: שָׁלַח
  choice: संदेश भेजा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘भेजा’ है और उसका कर्म निहित है। हिन्दी में किसी शासक के पास सहायता माँगने के संदर्भ में अकेला ‘भेजा’ अधूरा लगता है; ‘संदेश भेजा’ बिना दूतों का स्पष्ट उल्लेख जोड़े आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמֶּלֶךְ אָחָז
  choice: राजा आहाज
  rationale: उपाधि और नाम के इस संबंध का स्वाभाविक हिन्दी रूप ‘राजा आहाज’ है।
- source_word: עַל
  choice: के पास
  rationale: שׁלח के साथ यहाँ עַל उस सत्ता की ओर दिशा बताता है जिससे सहायता माँगी गई; ‘के पास’ आधुनिक हिन्दी में यह संबंध स्पष्ट करता है।
- source_word: מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं
  rationale: मसोराई पाठ में संज्ञा बहुवचन है। ऐतिहासिक स्थिति के अनुसार इसे एकवचन बनाने के बजाय स्रोत-पाठ का बहुवचन बनाए रखा गया है।
- source_word: לַעְזֹר לוֹ
  choice: सहायता के लिए
  rationale: उद्देश्यवाचक क्रियारूप आहाज के लिए सहायता पाने का उद्देश्य व्यक्त करता है। ‘सहायता के लिए’ स्वाभाविक हिन्दी है और अनावश्यक रूप से यह नहीं बताता कि सहायता किस ढंग से दी जानी थी।
theological_decisions:
- issue: ऐतिहासिक रूप से अपेक्षित एकवचन के अनुरूप ‘अश्शूर के राजा’ करने या मसोराई बहुवचन बनाए रखने का प्रश्न
  choice: मुख्य पाठ में ‘अश्शूर के राजाओं’ रखा गया
  alternative: अश्शूर के राजा
  rationale: इब्रानी मसोराई पाठ स्पष्ट रूप से बहुवचन पढ़ता है। ऐतिहासिक सामंजस्य के लिए इसे चुपचाप एकवचन करना स्रोत-पाठ की वास्तविक कठिनाई को मिटा देता; इसलिए बहुवचन मुख्य पाठ में और प्रचलित एकवचन पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संदेश भेजा’ हिन्दी में निहित कर्म को स्वाभाविक बनाता है, जबकि सहायता माँगने की क्रिया को मूल से अधिक स्पष्ट नहीं करता। ‘अश्शूर’ नाम का प्रचलित हिन्दी बाइबलीय रूप है।
