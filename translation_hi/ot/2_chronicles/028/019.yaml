source:
  edition: WLC
  text: כִּֽי הִכְנִ֤יעַ יְהוָה֙ אֶת יְהוּדָ֔ה בַּ/עֲב֖וּר אָחָ֣ז מֶֽלֶךְ יִשְׂרָאֵ֑ל כִּ֤י הִפְרִ֨יעַ֙ בִּֽ/יהוּדָ֔ה וּ/מָע֥וֹל מַ֖עַל בַּ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/019.yaml
  text: For Yahweh humbled Judah because of Ahaz king of Israel[b][a], for he had cast off restraint in Judah and had acted very unfaithfully against Yahweh.
translation:
  language: hi
  text: क्योंकि यहोवा ने इस्राएल के राजा आहाज[a] के कारण यहूदा को दीन दशा में कर दिया, क्योंकि उसने यहूदा में अनुशासनहीनता फैला दी[b] और यहोवा के विरुद्ध घोर विश्वासघात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘इस्राएल के राजा आहाज’ है। आहाज यहूदा का राजा था; यहाँ मूल पाठ की शब्दावली को बदलकर ऐतिहासिक सामंजस्य नहीं बैठाया गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘उसने यहूदा में निरंकुश आचरण किया,’ ‘उसने यहूदा में संयम त्याग दिया,’ अथवा ‘उसने यहूदा के लोगों को निरंकुश कर दिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְנִיעַ
  choice: दीन किया
  rationale: हिफ़ील रूप यहूदा को नीचा या दयनीय दशा में लाने की यहोवा की क्रिया बताता है; ‘दीन किया’ कारणवाचक अर्थ और धार्मिक भाव दोनों को संक्षेप में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: בַּעֲבוּר
  choice: के कारण
  rationale: यहाँ पदबंध लाभ नहीं, कारण प्रकट करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: मसोरेटिक पाठ में स्पष्ट रूप से ‘इस्राएल के राजा’ है; इसे ऐतिहासिक सामंजस्य बैठाने के लिए ‘यहूदा के राजा’ नहीं बनाया गया।
- source_word: הִפְרִיעַ
  choice: लोगों को निरंकुश कर दिया
  rationale: प्रע का हिफ़ील यहाँ बंधन हटाने, बेलगाम छोड़ने और अव्यवस्था उत्पन्न करने का भाव देता है। हिन्दी वाक्य में कर्म निहित होने के कारण ‘लोगों को’ अर्थ-स्पष्टीकरण के रूप में जोड़ा गया, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: ב उस क्षेत्र को दर्शाता है जिसमें आहाज की क्रिया हुई।
- source_word: וּמָעוֹל מַעַל
  choice: घोर विश्वासघात किया
  rationale: सजातीय क्रियारूपों का संयोजन מעל के अर्थ को तीव्र करता है; ‘घोर’ उस बलाघात को और ‘विश्वासघात’ वाचा-संबंधी बेवफ़ाई को व्यक्त करता है।
- source_word: בַּיהוָה
  choice: यहोवा के प्रति
  rationale: מעל के साथ यहोवा उस व्यक्ति को दर्शाता है जिसके विरुद्ध वाचा-संबंधी विश्वासघात हुआ; स्वाभाविक हिन्दी में ‘के प्रति’ उपयुक्त है।
theological_decisions:
- issue: आहाज को ‘इस्राएल का राजा’ कहना
  choice: मुख्य पाठ में मसोरेटिक पाठानुसार ‘इस्राएल के राजा आहाज’ रखा गया।
  alternative: ऐतिहासिक पदवी के अनुसार ‘यहूदा के राजा आहाज’ करना।
  rationale: आहाज ऐतिहासिक रूप से यहूदा का राजा था, फिर भी इब्रानी पाठ ‘इस्राएल का राजा’ कहता है। इतिहास से सामंजस्य बैठाकर पाठ को बदलने के बजाय मूल की तनावपूर्ण शब्दावली सुरक्षित रखी गई और स्पष्टीकरण पादटिप्पणी में दिया गया।
- issue: הִפְרִיעַ का कर्म और नैतिक-सामाजिक आशय
  choice: ‘उसने यहूदा में लोगों को निरंकुश कर दिया’
  alternative: ‘उसने यहूदा में स्वयं निरंकुश आचरण किया’ या ‘उसने यहूदा में संयम त्याग दिया।’
  rationale: क्रिया का हिफ़ील रूप किसी को बेलगाम छोड़ने या अव्यवस्था फैलाने का कारणवाचक भाव दे सकता है, पर उसका सटीक आशय विवादित है। मुख्य पाठ में कारणवाचक अर्थ रखा गया और अन्य सम्भावना पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘दीन किया’ और ‘घोर विश्वासघात’ मूल के धार्मिक तथा वाचा-संबंधी बल को व्यक्त करते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदबंधों के तुरंत बाद दिए गए हैं।
