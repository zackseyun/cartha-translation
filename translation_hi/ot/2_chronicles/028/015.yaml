source:
  edition: WLC
  text: וַ/יָּקֻ֣מוּ הָ/אֲנָשִׁים֩ אֲשֶׁר נִקְּב֨וּ בְ/שֵׁמ֜וֹת וַ/יַּחֲזִ֣יקוּ בַ/שִּׁבְיָ֗ה וְ/כָֽל מַעֲרֻמֵּי/הֶם֮ הִלְבִּ֣ישׁוּ מִן הַ/שָּׁלָל֒ וַ/יַּלְבִּשׁ֣וּ/ם וַ֠/יַּנְעִלוּ/ם וַ/יַּאֲכִל֨וּ/ם וַ/יַּשְׁק֜וּ/ם וַ/יְסֻכ֗וּ/ם וַ/יְנַהֲל֤וּ/ם בַּ/חֲמֹרִים֙ לְ/כָל כּוֹשֵׁ֔ל וַ/יְבִיא֛וּ/ם יְרֵח֥וֹ עִיר הַ/תְּמָרִ֖ים אֵ֣צֶל אֲחֵי/הֶ֑ם וַ/יָּשׁ֖וּבוּ שֹׁמְרֽוֹן־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/015.yaml
  text: Then the men who had been designated by name stood up and took charge of the captives[a], and from the spoil they clothed all who were naked among them. They clothed them, put sandals on them, fed them, gave them drink, anointed them, and led all the feeble among them on donkeys. They brought them to Jericho, the city of palm trees, to their brothers; then they returned to Samaria.
translation:
  language: hi
  text: तब वे पुरुष, जिन्हें नाम लेकर नियुक्त किया गया था, उठे और बंदियों की देखभाल की जिम्मेदारी ली। उन्होंने लूट के माल में से उनमें से जो वस्त्रहीन थे, उन सबको कपड़े पहनाए। उन्होंने उन्हें कपड़े और जूतियाँ पहनाईं, उन्हें खिलाया-पिलाया, उनके शरीर पर तेल लगाया और उन सब निर्बलों को गधों पर बैठाकर ले चले। वे उन्हें खजूर के पेड़ों के नगर यरीहो में उनके भाइयों[a] के पास ले आए; फिर वे शोमरोन लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके स्वजन” अथवा “उनके साथी इस्राएली।”
    reason: אֲחֵיהֶם का सीधा अर्थ “उनके भाई” है, लेकिन इस प्रसंग में इसका व्यापक अर्थ उनके स्वजन या साथी इस्राएली भी हो सकता है।
lexical_decisions:
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: जिन्हें नाम लेकर नियुक्त किया गया था
  rationale: निफ़अल रूप विशेष रूप से नामित या निर्धारित किए जाने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए उस औपचारिक पहचान को बनाए रखता है।
- source_word: וַיַּחֲזִיקוּ בַשִּׁבְיָה
  choice: बंदियों की देखभाल अपने हाथ में ली
  rationale: החזיק ב में पकड़ने, संभालने या उत्तरदायित्व लेने का अर्थ हो सकता है। दया और सहायता के प्रसंग में यह बंदियों की जिम्मेदारी लेकर उनकी देखभाल करने का भाव व्यक्त करता है।
- source_word: מַעֲרֻמֵּיהֶם
  choice: जो उनके बीच वस्त्रहीन थे
  rationale: यह बंदियों में से निर्वस्त्र अथवा कपड़ों से वंचित लोगों को दर्शाता है। 'वस्त्रहीन' गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी है।
- source_word: הִלְבִּישׁוּ מִן הַשָּׁלָל
  choice: लूट के माल में से ... कपड़े पहनाए
  rationale: वाक्य स्पष्ट करता है कि वस्त्र लूट के माल से लिए गए थे; हिन्दी में स्वाभाविक क्रम अपनाया गया है।
- source_word: וַיַּלְבִּשׁוּם
  choice: उन्होंने उन्हें कपड़े ... पहनाईं
  rationale: इब्रानी में वस्त्र पहनाने की बात दोहराई गई है; अनुवाद उस जोर को बनाए रखता है।
- source_word: וַיַּנְעִלוּם
  choice: जूतियाँ पहनाईं
  rationale: נעל का संबंध पादत्राण पहनाने से है। 'जूतियाँ' प्राचीन परिवेश में सहज और सामान्य हिन्दी शब्द है।
- source_word: וַיַּאֲכִלוּם וַיַּשְׁקוּם
  choice: उन्हें खिलाया-पिलाया
  rationale: दोनों क्रियाओं का संयुक्त हिन्दी मुहावरा सटीक, संक्षिप्त और स्वाभाविक है, तथा पेय को अनावश्यक रूप से पानी नहीं ठहराता।
- source_word: וַיְסֻכוּם
  choice: उनके शरीर पर तेल लगाया
  rationale: סוך का अर्थ तेल लगाना या मलना है। इस प्रसंग में यह अनुष्ठानिक अभिषेक से अधिक शारीरिक देखभाल और ताज़गी का संकेत देता है।
- source_word: וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל
  choice: उन सब निर्बलों को गधों पर ले चले
  rationale: נהל कोमलता से ले चलने का भाव दे सकता है और כּוֹשֵׁל ठोकर खाते या अशक्त व्यक्ति को दर्शाता है। यह चयन दयापूर्ण ढंग से पहुँचाए जाने का अर्थ रखता है।
- source_word: יְרֵחוֹ עִיר הַתְּמָרִים
  choice: खजूर के पेड़ों का नगर यरीहो
  rationale: यरीहो के पारंपरिक विशेषण का पारदर्शी और स्वाभाविक हिन्दी रूप।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: אֲחֵיהֶם का व्यापक सामुदायिक संबंध
  choice: उनके भाइयों
  alternative: उनके स्वजनों; उनके साथी इस्राएलियों
  rationale: मूल शब्द का सीधा अर्थ 'उनके भाई' है, जबकि प्रसंग में यह यहूदा के लोगों अथवा व्यापक वाचा-समुदाय के सदस्यों को सूचित कर सकता है। मुख्य पाठ शाब्दिक संबंध रखता है और पादटिप्पणी व्यापक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। क्रियाओं की इब्रानी शृंखला और करुणापूर्ण देखभाल का क्रम सुरक्षित है; अत्यधिक संस्कृतनिष्ठ या पुराने शब्दों से बचा गया है।
