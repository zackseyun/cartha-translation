  text: כִּֽי חָלַ֤ק אָחָז֙ אֶת בֵּ֣ית יְהוָ֔ה וְ/אֶת בֵּ֥ית הַ/מֶּ֖לֶךְ וְ/הַ/שָּׂרִ֑ים וַ/יִּתֵּן֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹ֥א לְ/עֶזְרָ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/021.yaml
  text: For Ahaz plundered the house of Yahweh[a], and the house of the king and the princes, and gave it to the king of Assyria[c][b], but it did not help him.
translation:
  language: hi
  text: क्योंकि आहाज़ ने याहवे के भवन, राजभवन और अधिकारियों[b] से धन-संपत्ति ले ली[a] और उन्हें अश्शूर के राजा को दे दिया, पर उससे उसे कोई सहायता नहीं मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द का शाब्दिक अर्थ ‘बाँटना’ या ‘हिस्सों में करना’ भी हो सकता है; यहाँ प्रसंग के अनुसार भाव है कि आहाज़ ने इन स्थानों और लोगों की मूल्यवान संपत्ति निकाल ली।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रधानों’ अथवा ‘सरदारों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָלַק
  choice: लूट लिया
  rationale: मूल अर्थ ‘बाँटना/हिस्सा करना’ हो सकता है, पर इस प्रसंग में आहाज़ द्वारा भवनों और अधिकारियों से मूल्यवान वस्तुएँ निकालकर अश्शूर के राजा को देने का भाव है। ‘लूट लिया’ उस संदर्भगत अर्थ को संक्षेप में व्यक्त करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है और यहाँ मंदिर के लिए स्वाभाविक धार्मिक प्रयोग है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम है; उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: इस संदर्भ में राजा का घर अर्थात राजकीय महल अभिप्रेत है; ‘राजभवन’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: הַשָּׂרִים
  choice: अधिकारी
  rationale: यह शब्द यहाँ राज्य के प्रमुख पदाधिकारियों या सरदारों के लिए है। आधुनिक पाठक के लिए ‘अधिकारी’ स्पष्ट है और इसे केवल राजपुत्रों तक सीमित नहीं करता।
- source_word: וַיִּתֵּן
  choice: और वह धन ... दे दिया
  rationale: हिब्रू में वस्तु को संदर्भ से समझा जाता है। हिन्दी में ‘वह धन’ जोड़ने से स्पष्ट होता है कि लूटी हुई संपत्ति अश्शूर के राजा को दी गई, बिना अर्थ बदले।
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा को
  rationale: राजा और साम्राज्य के नाम का सीधा, प्रचलित हिन्दी रूप।
- source_word: וְלֹא לְעֶזְרָה לוֹ
  choice: फिर भी उससे उसे कोई सहायता नहीं मिली
  rationale: यह भुगतान के निष्फल परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उससे’ दी गई संपत्ति या उस कार्य की ओर सामूहिक रूप से संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे केवल उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: अश्शूर को दिया गया धन सहायता दिलाने में निष्फल रहा
  choice: फिर भी उससे उसे कोई सहायता नहीं मिली
  alternative: पर वह उसकी सहायता के लिए न हुआ
  rationale: मूल कथन परिणाम को संक्षेप में बताता है। अनुवाद यह खुला रखता है कि अपेक्षित सहायता किस रूप में थी और कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘राजभवन’ तथा ‘अधिकारी’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में ‘वह धन’ संदर्भगत पूर्ति है, जो हिब्रू में निहित कर्म को हिन्दी में स्वाभाविक बनाती है।
