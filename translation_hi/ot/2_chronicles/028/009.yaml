base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/009.yaml
  text: There was a prophet of the LORD there, whose name was Oded; and he went out before the army that came to Samaria and said to them, “Look, because the LORD, the God of your fathers, was angry with Judah, he gave them into your hand, but you have killed them in a rage that has reached up to heaven.”
translation:
  language: hi
  text: वहाँ यहोवा का एक नबी था, जिसका नाम ओदेद था। वह सामरिया को आ रही सेना से मिलने बाहर गया और उनसे कहा, “देखो, तुम्हारे पूर्वजों के परमेश्वर यहोवा ने यहूदा पर क्रोधित होकर उन्हें तुम्हारे हाथ में दे दिया था; पर तुमने ऐसे प्रचण्ड क्रोध में उनका वध किया कि वह आकाश तक पहुँच गया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לִפְנֵי הַצָּבָא הַבָּא לְשֹׁמְרוֹן
  choice: सामरिया लौटती हुई सेना से मिलने
  rationale: सेना यहूदा से बंदियों और लूट के साथ सामरिया की ओर आ रही थी; हिन्दी में ‘से मिलने बाहर गया’ उस दिशा और आमने-सामने जाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחֲמַת
  choice: क्रोधित होकर
  rationale: यह पद यहूदा को सौंपे जाने का कारण यहोवा का रोष बताता है; क्रियात्मक हिन्दी वाक्य-विन्यास अधिक स्वाभाविक है।
- source_word: בְזַעַף
  choice: प्रचण्ड क्रोध में
  rationale: זַעַף तीव्र रोष या उग्रता का भाव देता है, जिसे ‘प्रचण्ड क्रोध’ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עַד לַשָּׁמַיִם הִגִּיעַ
  choice: कि वह आकाश तक पहुँच गया है
  rationale: मूल की अतिशयोक्तिपूर्ण छवि को बनाए रखा गया है; ‘वह’ निकटतम भाव ‘प्रचण्ड क्रोध’ की ओर संकेत करता है।
theological_decisions:
- issue: यहूदा की पराजय और इस्राएली सेना के अत्याचार के बीच संबंध
  choice: यहोवा ने यहूदा को उनके हाथ में दिया, पर उनके उग्र वध की निंदा की गई
  alternative: सेना की सारी हिंसा को यहोवा की इच्छा या स्वीकृति मानना
  rationale: मूल पाठ एक साथ यहोवा के न्यायाधीन सौंपे जाने और विजेताओं के सीमा लाँघने को रखता है; ‘पर’ इस नैतिक तनाव को स्पष्ट करता है, मिटाता नहीं।
- issue: ‘आकाश तक पहुँचने’ वाली वस्तु
  choice: प्रचण्ड क्रोध
  alternative: वध या उसका दोष
  rationale: हिब्रू में व्याकरणिक कर्ता अंतर्निहित है और कुछ अस्पष्टता बनी रहती है; निकटवर्ती זַעַף के आधार पर क्रोध को संदर्भ माना गया, जबकि मूल रूपक सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘वध किया’ हिंसा की गंभीरता व्यक्त करता है, और ‘देखो’ हִנֵּה की चेतावनीपूर्ण भूमिका बनाए रखता है।
