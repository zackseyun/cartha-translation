source:
  edition: WLC
  text: וַ/יַּהֲרֹג֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ בִּֽ/יהוּדָ֗ה מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף בְּ/י֥וֹם אֶחָ֖ד הַ/כֹּ֣ל בְּנֵי חָ֑יִל בְּ/עָזְבָ֕/ם אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/006.yaml
  text: And Pekah son of Remaliah killed in Judah one hundred twenty thousand in a single day[a], all of them valiant men, because they had forsaken Yahweh[c][b], the God of their fathers.
translation:
  language: hi
  text: रमल्याह के पुत्र पेकह ने यहूदा में एक ही दिन में[a] एक लाख बीस हज़ार लोगों को मार डाला। वे सभी वीर योद्धा[b] थे, क्योंकि[c] उन्होंने अपने पूर्वजों के परमेश्वर याहवे को छोड़ दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक दिन में।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ ‘वीरता के पुत्र’; अर्थात वीर युद्धरत पुरुष।
    reason: lexical_alternative
  - marker: c
    text: या ‘जब उन्होंने अपने पूर्वजों के परमेश्वर याहवे को छोड़ दिया था।’
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: हिब्रू क्रिया הרג स्पष्ट रूप से जान से मारने को व्यक्त करती है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सीधा है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: पूर्वसर्ग ב यहाँ स्थान बताता है; ऐतिहासिक संदर्भ में ‘यहूदा’ राज्य अथवा भूभाग का मानक नाम है।
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: एक लाख बीस हज़ार
  rationale: यह संख्या का सीधा और आधुनिक हिन्दी में स्वाभाविक रूप है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन में
  rationale: शाब्दिक अर्थ ‘एक दिन में’ है; ‘एक ही दिन में’ इतने बड़े संहार के एक दिन में घटित होने के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַכֹּל
  choice: वे सभी
  rationale: यह पहले बताई गई पूरी संख्या का सार प्रस्तुत करता है और बताता है कि मारे गए सभी लोग आगे वर्णित श्रेणी में थे।
- source_word: בְּנֵי חָיִל
  choice: वीर योद्धा
  rationale: शाब्दिक अभिव्यक्ति ‘वीरता/सामर्थ्य के पुत्र’ है और इस प्रसंग में सक्षम युद्धरत पुरुषों की ओर संकेत करती है। ‘वीर योद्धा’ अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בְּעָזְבָם
  choice: क्योंकि उन्होंने ... छोड़ दिया था
  rationale: इनफिनिटिव कंस्ट्रक्ट के साथ ב परिस्थिति अथवा कारण व्यक्त कर सकता है। यहाँ कारणवाचक अनुवाद इतिहासकार की व्याख्या के अनुरूप है, जबकि वैकल्पिक कालवाचक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह वाचागत पारिवारिक संबंध को बनाए रखता है और आज की हिन्दी में ‘उनके पितरों के परमेश्वर’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: בְּעָזְבָם का संहार से कारणात्मक या कालात्मक संबंध
  choice: 'कारणात्मक: ‘क्योंकि उन्होंने ... छोड़ दिया था’'
  alternative: 'कालात्मक: ‘जब उन्होंने ... छोड़ दिया था’'
  rationale: इब्रानी में दोनों अर्थ संभव हैं। इतिहास-वृत्तांत का प्रसंग सैन्य पराजय को याहवे को छोड़ने का परिणाम बताता प्रतीत होता है, इसलिए मुख्य पाठ में कारणात्मक अर्थ रखा गया है; वास्तविक व्याकरणिक अस्पष्टता पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार डाला’ संहार की स्पष्टता बनाए रखता है; ‘वीर योद्धा’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है। दिव्य नाम को ‘याहवे’ लिखा गया है।
