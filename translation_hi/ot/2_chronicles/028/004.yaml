source:
  edition: WLC
  text: וַ/יְזַבֵּ֧חַ וַ/יְקַטֵּ֛ר בַּ/בָּמ֖וֹת וְ/עַל הַ/גְּבָע֑וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: hi
  text: उसने ऊँचे स्थानों[a] पर, पहाड़ियों पर और हर हरे-भरे पेड़ के नीचे बलि चढ़ाई और धूप जलाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने ऊँचे स्थानों पर, पहाड़ियों पर और हर पत्तों से भरे हुए पेड़ के नीचे बलियाँ चढ़ाईं और भेंटों को जलाकर उनका धुआँ चढ़ाया।”
    reason: זבח और קטר के सम्भव अधिक स्पष्ट तथा व्यापक शाब्दिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: बलि चढ़ाई
  rationale: पिएल क्रिया זבח का अर्थ बलि अर्पित करना है। ‘बलि चढ़ाई’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיְקַטֵּר
  choice: धूप जलाई
  rationale: पिएल קטר धूप अथवा अन्य भेंट को जलाकर उसका धुआँ उठाने का बोध दे सकता है। इस उपासना-संदर्भ में ‘धूप जलाई’ स्वाभाविक और सम्भावित अर्थ है; व्यापक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בַּבָּמוֹת
  choice: ऊँचे स्थानों पर
  rationale: במות उपासना के स्थानीय पवित्र स्थलों के लिए प्रयुक्त पारिभाषिक पद है। ‘ऊँचे स्थान’ उसके स्थानिक चित्र और पुराने नियम में उसकी पारस्परिक गूँज को बनाए रखता है।
- source_word: וְעַל הַגְּבָעוֹת
  choice: पहाड़ियों पर
  rationale: גבעות का सामान्य अर्थ ‘पहाड़ियाँ’ है; यह ऊँचे स्थानों के अतिरिक्त उपासना के भौगोलिक स्थलों का वर्णन करता है।
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: और हर हरे-भरे पेड़ के नीचे
  rationale: רענן ताज़ा, हरा और पत्तों से भरपूर होने का भाव देता है। ‘हरा-भरा पेड़’ हिन्दी में सहज है और मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: अनधिकृत अथवा मूर्तिपूजक उपासना से जुड़े स्थानों की रूढ़ अभिव्यक्ति
  choice: ‘ऊँचे स्थानों’ और ‘हर हरे-भरे पेड़ के नीचे’ जैसी मूल सांस्कृतिक अभिव्यक्तियाँ बनाए रखी गईं।
  alternative: ‘मूर्तिपूजा के पूजा-स्थलों पर’ जैसे अधिक व्याख्यात्मक अनुवाद का प्रयोग करना।
  rationale: मूल पाठ स्वयं इन पदों द्वारा धार्मिक संदर्भ को संकेत करता है, पर इस वाक्य में उसे स्पष्ट व्याख्या में नहीं बदलता। रूढ़ अभिव्यक्तियाँ बनाए रखने से अन्य पुराने नियम के पाठों के साथ संबंध और मूल का धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘ऊँचे स्थान’ पारिभाषिक बाइबलीय पद के रूप में सुरक्षित है, जबकि ‘हरा-भरा’ मूल विशेषण की जीवंतता को स्वाभाविक हिन्दी में व्यक्त करता है।
