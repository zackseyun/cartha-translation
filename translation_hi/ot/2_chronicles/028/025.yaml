  yaml_path: translation/ot/2_chronicles/028/025.yaml
  text: And in every city of Judah he made high places to burn incense to other gods[a], and he provoked Yahweh, the God of his fathers.
translation:
  language: hi
  text: उसने यहूदा के हर नगर में दूसरे देवताओं के लिए धूप जलाने को ऊँचे पूजा-स्थल बनाए और अपने पूर्वजों के परमेश्वर याहवे को क्रोधित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְכָל עִיר וָעִיר לִיהוּדָה
  choice: यहूदा के हर नगर में
  rationale: עִיר וָעִיר एक वितरणसूचक पुनरुक्ति है, जिसका स्वाभाविक हिन्दी अर्थ ‘हर नगर’ है; לִיהוּדָה नगरों का यहूदा से संबंध बताता है।
- source_word: עָשָׂה בָמוֹת
  choice: पूजा-स्थल बनाए
  rationale: בָּמוֹת उपासना के लिए बने ‘ऊँचे स्थानों’ का पारिभाषिक शब्द है। आधुनिक पाठक के लिए ‘पूजा-स्थल’ इसका धार्मिक कार्य स्पष्ट करता है, जबकि עָשָׂה के व्यापक अर्थ को ‘बनाए’ सुरक्षित रखता है।
- source_word: לְקַטֵּר
  choice: धूप जलाने को
  rationale: पिएल रूप यहाँ सुगंधित धूप अथवा बलि का धुआँ चढ़ाने को सूचित करता है; इस प्रसंग में ‘धूप जलाना’ स्पष्ट और स्वाभाविक है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: אֲחֵרִים का सीधा अर्थ ‘दूसरे’ है; ‘विदेशी’ कहना मूल से अतिरिक्त अर्थ जोड़ता। हिन्दी में धूप जलाने के उद्देश्य/प्राप्तकर्ता के लिए ‘के लिए’ स्वाभाविक है।
- source_word: וַיַּכְעֵס
  choice: क्रोधित किया
  rationale: כעס का हिफ़ील रूप किसी को क्रोध दिलाने या क्रोधित करने का कारण बनने को व्यक्त करता है; ‘क्रोधित किया’ हिन्दी में सीधा और अर्थपूर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: अपने पूर्वजों के परमेश्वर
  rationale: אֲבֹתָיו वंशगत पूर्वजों को सूचित करता है; आधुनिक हिन्दी में ‘पूर्वजों’ से अर्थ स्वाभाविक और समावेशी ढंग से स्पष्ट होता है।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है, इसलिए उसे किसी उपाधि से नहीं बदला गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: בָּמוֹת का धार्मिक स्वरूप
  choice: पूजा-स्थल
  alternative: ऊँचे स्थान
  rationale: यहाँ शब्द सामान्य ऊँचाइयों का नहीं, दूसरे देवताओं के लिए धूप जलाने वाले उपासना-स्थलों का द्योतक है। ‘पूजा-स्थल’ प्रसंगगत अर्थ देता है, किंतु स्थल की भौगोलिक ऊँचाई को मुख्य पाठ में निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सहज, संक्षिप्त और गरिमापूर्ण रखा गया है। वितरणसूचक इब्रानी पुनरुक्ति को अस्वाभाविक शब्दशः दोहराने के बजाय ‘हर नगर’ कहा गया है।
