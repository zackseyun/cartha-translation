  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘तब’ से प्रसंगगत परिणाम/अगली कार्रवाई का प्रवाह व्यक्त होता है। पद में किसी आवश्यक पाठगत या अर्थगत टिप्पणी की जरूरत नहीं है।
