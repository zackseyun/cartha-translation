  text: So the armed men left the captives and the plunder before the officials and all the assembly[a][b].
translation:
  language: hi
  text: तब हथियारबंद पुरुषों ने बंदियों और लूट का माल अधिकारियों और सारी सभा के सामने छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: छोड़ दिया
  rationale: עזב का सामान्य अर्थ ‘छोड़ना’ है; यहाँ आशय बंदियों और लूट के माल पर अपना अधिकार छोड़कर उन्हें सार्वजनिक रूप से अधिकारियों और सभा के सामने सौंप देने से है।
- source_word: הֶחָלוּץ
  choice: हथियारबंद पुरुषों
  rationale: यहाँ חלץ से बना रूप युद्ध के लिए सुसज्जित लोगों को सामूहिक रूप से दर्शाता है। ‘हथियारबंद पुरुषों’ से सैन्य संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: הַשִּׁבְיָה
  choice: बंदियों
  rationale: संज्ञा अमूर्त रूप से ‘बंदी अवस्था’ भी बता सकती है, पर इस प्रसंग में युद्ध में पकड़े गए लोगों का ठोस उल्लेख है।
- source_word: הַבִּזָּה
  choice: लूट के माल
  rationale: यह युद्ध में छीनी गई वस्तुओं को दर्शाता है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट है और ‘लूट’ से अधिक ठोस अर्थ देता है।
- source_word: לִפְנֵי
  choice: सामने
  rationale: यह स्थानगत ‘के सामने’ और संबंधित अधिकारियों तथा सभा की उपस्थिति—दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: שׂרים यहाँ मान्य प्राधिकारी व्यक्तियों के लिए है। ‘अधिकारियों’ से अनावश्यक रूप से राजकुमार या केवल सैन्य सेनापति का अर्थ नहीं जुड़ता।
- source_word: כָל הַקָּהָל
  choice: सारी सभा
  rationale: קהל एकत्र समुदाय को दर्शाता है। ‘सारी सभा’ तटस्थ, स्वाभाविक और मूल के समग्रता-बोध को व्यक्त करता है।
