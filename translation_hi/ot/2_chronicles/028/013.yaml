base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/013.yaml
  text: And they said to them[a], “Do not bring the captives here, for you are proposing to add to our sins and to our guilt, bringing guilt from Yahweh upon us, because our guilt is already great[b], and there is fierce anger against Israel.”
translation:
  language: hi
  text: और उन्होंने उनसे कहा, “इन बन्दियों को यहाँ मत लाओ, क्योंकि तुम हमारे पापों और हमारे दोष को और बढ़ाकर हम पर याहवे के विरुद्ध दोष लादना चाहते हो[a]। हमारा दोष पहले ही बहुत बड़ा है, और इस्राएल पर प्रचण्ड क्रोध है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन और संक्षिप्त है। इसका अर्थ यह भी हो सकता है, “क्योंकि याहवे के विरुद्ध दोष हम पर है।” यह याहवे के प्रति दोष, या याहवे के न्याय के अंतर्गत दोषी ठहरने—दोनों में से किसी संबंध पर बल दे सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “क्रोध का जलना”; यह अत्यन्त तीव्र कोप के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁבְיָה
  choice: इन बन्दियों
  rationale: यह संज्ञा बन्दी बनाए जाने की अवस्था या बन्दी लोगों के समूह को सूचित कर सकती है; यहाँ ‘लाना’ क्रिया के कारण लोगों का ठोस अर्थ उपयुक्त है। ‘इन’ प्रसंग में सामने उपस्थित बन्दियों की ओर संकेत करता है।
- source_word: הֵנָּה
  choice: यहाँ
  rationale: यह वक्ताओं के स्थान की ओर गति बताने वाला स्थानवाचक क्रियाविशेषण है।
- source_word: לְאַשְׁמַת יְהוָה עָלֵינוּ
  choice: हम पर याहवे की ओर से दोष लाना
  rationale: इब्रानी वाक्यांश संक्षिप्त और कठिन है। यह याहवे के न्याय से आने वाले दोष-दायित्व या याहवे के प्रति दोष—दोनों पर बल दे सकता है; मुख्य पाठ पहले अर्थ के निकट रहता है और टिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
- source_word: אַתֶּם אֹמְרִים
  choice: तुम ... चाहते हो
  rationale: शाब्दिक अर्थ ‘तुम कह रहे हो’ है, पर यहाँ यह किसी कार्य के इरादे या प्रस्ताव को व्यक्त करता है।
- source_word: לְהֹסִיף עַל
  choice: और बढ़ाकर
  rationale: यह पहले से विद्यमान पाप और दोष में वृद्धि करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַטֹּאתֵינוּ
  choice: हमारे पापों
  rationale: बहुवचन को बनाए रखते हुए अपराधपूर्ण कार्यों का सामान्य अर्थ व्यक्त किया गया है।
- source_word: אַשְׁמָתֵינוּ / אַשְׁמָה
  choice: हमारे दोष / हमारा दोष
  rationale: ‘दोष’ पापमय कार्यों से उत्पन्न दोष-दायित्व को व्यक्त करता है और ‘पापों’ से शब्दगत भेद बनाए रखता है।
- source_word: רַבָּה
  choice: पहले ही बहुत बड़ा
  rationale: मूल अर्थ ‘बहुत बड़ा’ है; ‘पहले ही’ तर्क में निहित उस भाव को स्पष्ट करता है कि नया अपराध मौजूदा दोष को और बढ़ाएगा।
- source_word: וַחֲרוֹן אָף
  choice: प्रचण्ड क्रोध भड़का हुआ है
  rationale: शाब्दिक रूप से ‘क्रोध का जलना’ तीव्र कोप का मुहावरा है; इस हिन्दी अभिव्यक्ति में उसकी अग्निमय छवि और तीव्रता दोनों रहती हैं।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: मूल के पूर्वसर्ग और जाति-नाम को बनाए रखा गया है; प्रसंग स्वयं इसके ऐतिहासिक संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है; उसे उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- issue: לְאַשְׁמַת יְהוָה עָלֵינוּ की धर्मवैचारिक अस्पष्टता
  choice: हम पर याहवे की ओर से दोष लाना
  alternative: याहवे के विरुद्ध हमारा दोष / याहवे के सामने हमें दोषी बनाना
  rationale: वाक्यांश दोष, दायित्व और ईश्वरीय न्याय के संबंध को संक्षिप्त रूप में व्यक्त करता है। मुख्य पाठ एक सम्भावित संबंध चुनता है, पर पादटिप्पणी दूसरे सम्भव संबंध को खुला रखती है।
- issue: इस्राएल का ऐतिहासिक-धर्मवैचारिक संदर्भ
  choice: इस्राएल
  alternative: एप्रैम / उत्तरी राज्य
  rationale: मूल पाठ के व्यापक वाचा-संबंधी नाम को किसी अधिक संकीर्ण ऐतिहासिक व्याख्या से नहीं बदला गया।
