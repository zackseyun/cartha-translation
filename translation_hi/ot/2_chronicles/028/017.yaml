lexical_decisions:
- source_word: וְעוֹד
  choice: भी
  rationale: यह पद अहाज और यहूदा के विरुद्ध हुई शत्रुतापूर्ण घटनाओं की सूची में एक और घटना जोड़ता है; आधुनिक हिंदी में ‘भी’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדוֹמִים
  choice: एदोमी
  rationale: बहुवचन जातिवाचक शब्द एदोम देश के लोगों को सूचित करता है, इसलिए ‘एदोमी’ उपयुक्त है।
- source_word: בָּאוּ
  choice: आए
  rationale: क्रिया पूर्ण हो चुकी घटना बताती है; हिंदी कथा-शैली में सरल भूतकाल ‘आए’ स्वाभाविक है और अनावश्यक कालगत व्याख्या नहीं जोड़ता।
- source_word: וַיַּכּוּ
  choice: हमला किया
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है, पर सैन्य प्रसंग में ‘हमला करना’ स्पष्ट और स्वाभाविक है तथा पूर्ण विजय का अर्थ आरोपित नहीं करता।
- source_word: בִיהוּדָה
  choice: यहूदा पर
  rationale: सैन्य क्रिया के साथ ב को हिंदी में ‘पर’ कहना स्वाभाविक है और यहूदा को आक्रमण का लक्ष्य दिखाता है।
- source_word: וַיִּשְׁבּוּ שֶׁבִי
  choice: लोगों को बंदी बनाकर ले गए
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद का संयुक्त अर्थ बंदियों को पकड़कर ले जाना है; हिंदी में यह अभिव्यक्ति स्पष्ट है और अस्वाभाविक शब्द-पुनरावृत्ति से बचती है।
