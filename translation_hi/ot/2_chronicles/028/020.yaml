  yaml_path: translation/ot/2_chronicles/028/020.yaml
  text: Then Tiglath-pileser king of Assyria came against him and distressed him[a], but did not strengthen him.
translation:
  language: hi
  text: तब अश्शूर का राजा तिग्लत-पिलेसर उस पर चढ़ आया और उसने उसे संकट में डाल दिया,[a] पर उसे मजबूत नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे तंग किया और उसे मजबूत नहीं किया।” इब्रानी में दोनों उपवाक्य सामान्य संयोजक से जुड़े हैं; उनके बीच विरोध का भाव संदर्भ से समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עָלָיו
  choice: उस पर चढ़ आया
  rationale: सैन्य-राजनीतिक प्रसंग में בוא על का भाव विरोधी होकर आक्रमण करने का है; यह हिंदी मुहावरा उस प्रतिकूल कार्रवाई को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּלְּגַת פִּלְנְאֶסֶר
  choice: तिग्लत-पिलेसर
  rationale: राजा के अश्शूरी नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और प्रचलित हिंदी रूप।
- source_word: וַיָּצַר לוֹ
  choice: उसने उसे संकट में डाल दिया
  rationale: צרר यहाँ दबाने, तंग करने या संकट पहुँचाने का व्यापक भाव रखता है; यह अनुवाद केवल औपचारिक घेराबंदी का अर्थ थोपे बिना उसकी शत्रुतापूर्ण कार्रवाई बताता है।
- source_word: וְלֹא חֲזָקוֹ
  choice: पर उसे सामर्थ्य नहीं दी
  rationale: חזק का मूल भाव दृढ़ या समर्थ करना है। 'पर' पिछले हानिकारक कार्य और अपेक्षित सहायता के बीच निहित विरोध स्पष्ट करता है, जबकि क्रिया का रूपक बनाए रखता है।
