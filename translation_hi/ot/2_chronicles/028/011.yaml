base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/011.yaml
  text: Now listen to me[a], and return the captives whom you have taken from your brothers, for the burning anger of Yahweh is upon you.
translation:
  language: hi
  text: अब मेरी सुनो और उन बंदियों को लौटा दो जिन्हें तुमने अपने भाइयों[a] में से बंदी बनाया है, क्योंकि याहवे का क्रोध तुम पर भड़का हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् अपने साथी इस्राएलियों में से। इब्रानी में ‘अपने भाइयों’ कहा गया है; यह एक ही वाचा-समुदाय के लोगों के लिए संबंधसूचक भाषा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह पद सीधे और तत्काल आग्रह की ओर संक्रमण करता है। हिंदी में ‘अब’ स्वाभाविक रूप से यही तात्कालिकता व्यक्त करता है।
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: यह आज्ञार्थक रूप ध्यान देकर मानने की अपील करता है; ‘मेरी सुनो’ आधुनिक हिंदी में स्वाभाविक और प्रभावशाली है।
- source_word: וְהָשִׁיבוּ
  choice: लौटा दो
  rationale: שׁוב का हिफ़ील रूप किसी को वापस जाने देना या लौटाना दर्शाता है। बंदियों के संदर्भ में ‘लौटा दो’ संक्षिप्त और स्पष्ट है।
- source_word: הַשִּׁבְיָה
  choice: बंदियों
  rationale: यह सामूहिक संज्ञा यहाँ युद्ध में पकड़े गए लोगों को सूचित करती है; इसलिए अमूर्त ‘बंधुआई’ की अपेक्षा ‘बंदियों’ अधिक उपयुक्त है।
- source_word: אֲשֶׁר שְׁבִיתֶם
  choice: जिन्हें तुमने ... बंदी बनाया है
  rationale: सापेक्ष उपवाक्य स्पष्ट करता है कि इन्हीं लोगों को संबोधित समुदाय ने पकड़ा था। हिंदी में यह अभिव्यक्ति मूल क्रिया के अर्थ को सीधे रखती है।
- source_word: מֵאֲחֵיכֶם
  choice: अपने भाइयों में से
  rationale: אָח का मूल अर्थ ‘भाई’ है और यहाँ एक ही वाचा-समुदाय के सदस्यों के लिए संबंधसूचक भाषा प्रयुक्त हुई है। व्यापक सामुदायिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: חֲרוֹן אַף יְהוָה עֲלֵיכֶם
  choice: याहवे का क्रोध तुम पर भड़का हुआ है
  rationale: यह हिंदी मुहावरा חרון אף में निहित क्रोध की जलती हुई तीव्रता और עַל द्वारा व्यक्त उसके संबोधित लोगों पर होने—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ स्पष्ट रूप से चतुरक्षरीय व्यक्तिगत नाम का प्रयोग करता है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: ‘भाइयों’ का सामुदायिक विस्तार
  choice: मुख्य पाठ में ‘भाइयों’, पादटिप्पणी में ‘संगी इस्राएली’
  alternative: मुख्य पाठ में केवल ‘संगी इस्राएली’
  rationale: मुख्य पाठ इब्रानी की संबंधसूचक वाचा-भाषा को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि आशय केवल सगे पुरुष भाई नहीं, बल्कि उसी प्रजा के लोग हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक चेतावनी के अनुरूप सीधी रखी गई है। ‘मेरी सुनो’ आग्रह की शक्ति को और ‘क्रोध ... भड़का हुआ है’ मूल इब्रानी की तीव्रता को स्वाभाविक हिंदी में बनाए रखते हैं।
