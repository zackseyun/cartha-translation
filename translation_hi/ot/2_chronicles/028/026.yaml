translation:
  language: hi
  text: उसके शेष कार्य और उसका सारा आचरण, आरम्भ से अन्त तक, देखो, यहूदा और इस्राएल के राजाओं की पुस्तक में लिखे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֶתֶר דְּבָרָיו
  choice: उसके शेष कामों
  rationale: राजकीय वृत्तान्त के समापन-सूत्र में דְּבָרִים राजा के कथनों की अपेक्षा उसके कार्यों या वृत्तान्त को दर्शाता है; ‘शेष कामों’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְכָל דְּרָכָיו
  choice: और उसके सभी चाल-चलन का
  rationale: דֶּרֶךְ का मूल ‘मार्ग’ रूपक यहाँ आचरण और जीवन-क्रम को सूचित करता है। ‘चाल-चलन’ उस भाव को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: הָרִאשֹׁנִים וְהָאַחֲרוֹנִים
  choice: आरम्भ से अन्त तक का
  rationale: यह युग्म पूरे कालक्रम को समेटने वाला मेरिज़्म है। हिन्दी में ‘आरम्भ से अन्त तक’ उसका अर्थ सहज और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: הִנָּם כְּתוּבִים
  choice: देखो, ... लिखा है
  rationale: הִנָּם का संकेतात्मक बल ‘देखो’ से सुरक्षित रहता है; हिन्दी में संयुक्त विषय ‘विवरण’ के कारण एकवचन ‘लिखा है’ स्वाभाविक है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: सन्दर्भ-सूत्र में עַל का स्वाभाविक हिन्दी रूप ‘में’ है; סֵפֶר के लिए ‘पुस्तक’ स्पष्ट और पारंपरिक है।
- source_word: מַלְכֵי יְהוּדָה וְיִשְׂרָאֵל
  choice: यहूदा और इस्राएल के राजाओं की पुस्तक
  rationale: यह इतिहास-वृत्त के स्रोत का नाम है; हिन्दी में यही संबंध-वाचक संरचना स्रोत के शब्दक्रम और आशय को स्पष्ट रखती है।
