  text: וַ/יָּקֻ֨מוּ אֲנָשִׁ֜ים מֵ/רָאשֵׁ֣י בְנֵֽי אֶפְרַ֗יִם עֲזַרְיָ֤הוּ בֶן יְהֽוֹחָנָן֙ בֶּרֶכְיָ֣הוּ בֶן מְשִׁלֵּמ֔וֹת וִֽ/יחִזְקִיָּ֨הוּ֙ בֶּן שַׁלֻּ֔ם וַ/עֲמָשָׂ֖א בֶּן חַדְלָ֑י עַל הַ/בָּאִ֖ים מִן הַ/צָּבָֽא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/012.yaml
  text: 'Then some men from the heads of the sons of Ephraim stood up against those coming from the army: Azariah son of Jehohanan[a], Berechiah son of Meshillemoth, Hezekiah son of Shallum, and Amasa son of Hadlai.'
translation:
  language: hi
  text: 'तब एप्रैमियों के अगुओं में से कुछ पुरुष सेना से आनेवालों के विरुद्ध खड़े हो गए: यहोहानान का पुत्र अजर्याह, मशिल्लेमोत का पुत्र बेरेक्याह, शल्लूम का पुत्र यिहिजकिय्याह, और हदलै का पुत्र अमासा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: खड़े हो गए
  rationale: यह קום के कथात्मक रूप को व्यक्त करता है और प्रसंग में निर्णायक तथा विरोधपूर्ण कार्रवाई का भाव बनाए रखता है।
- source_word: אֲנָשִׁים מֵרָאשֵׁי בְנֵי אֶפְרַיִם
  choice: एप्रैमियों के अगुओं में से कुछ पुरुष
  rationale: ‘कुछ पुरुष’ एक सीमित समूह का परिचय देता है; ‘एप्रैमियों के अगुए’ शाब्दिक ‘एप्रैम के पुत्रों के सिरों’ का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: עֲזַרְיָהוּ ... בֶּרֶכְיָהוּ ... יְחִזְקִיָּהוּ ... עֲמָשָׂא
  choice: अजर्याह ... बेरेक्याह ... यहिजकिय्याह ... अमासा
  rationale: व्यक्तिनामों को अनुवादित करने के बजाय प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: בֶן
  choice: का पुत्र
  rationale: वंशसूचक इब्रानी प्रयोग का स्पष्ट और मानक हिन्दी रूप।
- source_word: עַל
  choice: का सामना करने के लिए
  rationale: קום के साथ עַל यहाँ विरोध या मुठभेड़ का संकेत देता है; यह रूप अस्वाभाविक ‘के विरुद्ध खड़े हुए’ की अपेक्षा हिन्दी में अधिक सहज है और संदर्भगत अर्थ सुरक्षित रखता है।
- source_word: הַבָּאִים מִן הַצָּבָא
  choice: सेना से लौटनेवालों
  rationale: בוא का कृदन्त आनेवालों को दर्शाता है; कथा-संदर्भ में वे अभियान से लौट रहे हैं। ‘सेना से’ मूल מִן הַצָּבָא को निकटता से व्यक्त करता है।
