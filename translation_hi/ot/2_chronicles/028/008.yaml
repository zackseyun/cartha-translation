source:
  edition: WLC
  text: וַ/יִּשְׁבּוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל מֵֽ/אֲחֵי/הֶ֜ם מָאתַ֣יִם אֶ֗לֶף נָשִׁים֙ בָּנִ֣ים וּ/בָנ֔וֹת וְ/גַם שָׁלָ֥ל רָ֖ב בָּזְז֣וּ מֵ/הֶ֑ם וַ/יָּבִ֥יאוּ אֶת הַ/שָּׁלָ֖ל לְ/שֹׁמְרֽוֹן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/008.yaml
  text: And the sons of Israel took captive from their brothers two hundred thousand women[a], sons, and daughters. They also took much spoil from them and brought the spoil to Samaria.
translation:
  language: hi
  text: इस्राएलियों ने अपने भाइयों[a] में से दो लाख स्त्रियों, बेटों और बेटियों को बंदी बना लिया। उन्होंने उनसे बहुत-सा माल भी लूट लिया और वह लूटा हुआ माल शोमरोन ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ का अर्थ यहाँ ‘अपने ही लोगों’ या ‘साथी इस्राएलियों’ से भी हो सकता है। इब्रानी पाठ साझा संबंध पर बल देने के लिए ‘भाइयों’ कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: बंदी बना लिया
  rationale: שבה युद्ध में लोगों को बंदी बनाने का बोध देता है; यह हिंदी प्रयोग सैन्य संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक 'इस्राएल के पुत्रों' के बजाय यह आधुनिक हिंदी में स्वाभाविक सामूहिक नाम है; अगले पदबंध 'अपने भाइयों' से साझा संबंध का बल बना रहता है।
- source_word: מֵאֲחֵיהֶם
  choice: अपने भाइयों में से
  rationale: אָח यहाँ सगे भाइयों से व्यापक अर्थ में सजातीय या साथी इस्राएलियों को सूचित कर सकता है, पर 'भाइयों' मूल का पारिवारिक और नैतिक बल सुरक्षित रखता है।
- source_word: מָאתַיִם אֶלֶף
  choice: दो लाख
  rationale: हिंदी संख्या-पद्धति में 200,000 का सीधा और स्वाभाविक रूप।
- source_word: נָשִׁים בָּנִים וּבָנוֹת
  choice: स्त्रियों, बेटों और बेटियों
  rationale: मूल के तीन अलग समूहों और उसके लिंग-विशिष्ट वर्णन को बिना 'बच्चों' में समेटे सुरक्षित रखा गया है।
- source_word: שָׁלָל רָב בָּזְזוּ מֵהֶם
  choice: उन्होंने उनका बहुत-सा माल भी लूट लिया
  rationale: यह युद्ध में वस्तुओं को लूट के रूप में लेने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַיָּבִיאוּ אֶת־הַשָּׁלָל לְשֹׁמְרוֹן
  choice: वह लूटा हुआ माल शोमरोन ले आए
  rationale: שָׁלָל की पुनरावृत्ति को 'लूटा हुआ माल' से स्पष्ट रखा गया है और स्थान-नाम का प्रचलित हिंदी रूप 'शोमरोन' लिया गया है।
theological_decisions:
- issue: इस्राएल के भीतर हुए संघर्ष में संबंधसूचक भाषा
  choice: अपने भाइयों में से
  alternative: अपने सजातियों में से / अपने साथी इस्राएलियों में से
  rationale: मूल पाठ इस बात पर नैतिक बल देता है कि बंदी विदेशी नहीं, बल्कि साझा वंश और वाचा से जुड़े लोग थे। 'भाइयों' इस तनाव को व्याख्या द्वारा समाप्त किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और कथात्मक है। 'इस्राएलियों' स्वाभाविकता देता है, जबकि 'अपने भाइयों' मूल पाठ के संबंधपरक और नैतिक बल को बनाए रखता है।
