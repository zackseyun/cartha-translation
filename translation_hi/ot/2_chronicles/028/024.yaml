source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֨ף אָחָ֜ז אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֗ים וַ/יְקַצֵּץ֙ אֶת כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יִּסְגֹּ֖ר אֶת דַּלְת֣וֹת בֵּית יְהוָ֑ה וַ/יַּ֨עַשׂ ל֧/וֹ מִזְבְּח֛וֹת בְּ/כָל פִּנָּ֖ה בִּ/ירוּשָׁלִָֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/024.yaml
  text: Ahaz gathered the vessels of the house of God and cut up the vessels of the house of God, and he shut the doors of the house of the LORD and made for himself altars in every corner of Jerusalem.
translation:
  language: hi
  text: आहाज ने परमेश्वर के भवन के पात्र इकट्ठे किए और परमेश्वर के भवन के पात्रों को काटकर टुकड़े-टुकड़े कर दिया। उसने यहोवा के भवन के द्वार बंद कर दिए और यरूशलेम के हर कोने में अपने लिए वेदियाँ बनाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठे किए
  rationale: क्रिया אסף के सामान्य अर्थ ‘एकत्र करना’ को सीधे और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כְּלֵי בֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन के पात्र
  rationale: כְּלֵי का आशय उपासना में प्रयुक्त पात्रों/सामानों से है; यहाँ ‘पात्र’ संक्षिप्त, पारंपरिक और संदर्भानुकूल है।
- source_word: וַיְקַצֵּץ
  choice: काटकर टुकड़े-टुकड़े कर दिया
  rationale: पिएल रूप वस्तुओं को काटकर विखंडित करने की तीव्र कार्रवाई बताता है; यह हिंदी अभिव्यक्ति उसी बल को स्पष्ट रखती है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ के रूप में दर्शाया गया है, ताकि ‘परमेश्वर’ से मूल पाठ का शब्दगत भेद बना रहे।
- source_word: בְּכָל פִּנָּה
  choice: हर कोने में
  rationale: मूल का स्थानवाचक और व्यापक अर्थ सीधे बनाए रखता है।
- source_word: מִזְבְּחוֹת
  choice: वेदियाँ
  rationale: बलि चढ़ाने के लिए बनी संरचनाओं का स्वाभाविक और स्थापित हिंदी धार्मिक पद।
theological_decisions:
- issue: אֱלֹהִים और יהוה के बीच नामगत भेद
  choice: क्रमशः ‘परमेश्वर’ और ‘यहोवा’
  alternative: दोनों स्थानों पर ‘प्रभु/परमेश्वर’
  rationale: मूल इब्रानी में सामान्य पद और व्यक्तिगत नाम का स्पष्ट अंतर है; अनुवाद में इसे बनाए रखना स्रोत-पाठ के प्रति अधिक निष्ठावान है।
- issue: आहाज द्वारा बनाई गई वेदियों का स्वरूप
  choice: केवल ‘वेदियाँ’ कहा गया
  alternative: ‘मूर्तिपूजक वेदियाँ’
  rationale: इस पद में विशेषण नहीं है; संदर्भ नकारात्मक है, पर अनुवाद में वह व्याख्यात्मक विशेषण जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्रोत-सन्निकट वाक्य-विन्यास अपनाया गया है। पुनरुक्ति ‘परमेश्वर के भवन के पात्र’ को मूल के अनुरूप बनाए रखा गया है; दूसरे वाक्य से हिंदी प्रवाह सुधारा गया है।
