base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/007.yaml
  text: And Zikri[a], a mighty man of Ephraim, killed Maaseiah the king’s son, Azrikam the overseer of the house, and Elkanah[c][b], second to the king.
translation:
  language: hi
  text: और एप्रैम के वीर पुरुष जिक्री[a] ने राजा के पुत्र मासेयाह, राजमहल के प्रमुख अधिकारी अज्रीकाम[b], और राजा के बाद दूसरा पद रखनेवाले एल्काना[c] को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एप्रैम का एक योद्धा’ अथवा ‘एक एप्रैमी वीर’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘भवन का प्रधान’; यहाँ ‘भवन’ से संभवतः राजमहल या राजघराना अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या ‘राजा का उपाधिकारी’ अथवा ‘राजा के अधीन दूसरा सर्वोच्च अधिकारी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: הרג का सीधा अर्थ किसी को मार देना है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के पूर्ण, घातक परिणाम को स्पष्ट रखता है।
- source_word: זִכְרִי
  choice: जिक्री
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: גִּבּוֹר אֶפְרַיִם
  choice: एप्रैम के वीर योद्धा
  rationale: גִּבּוֹר में वीरता, सामर्थ्य और योद्धा होने का भाव हो सकता है। युद्ध के इस प्रसंग में ‘वीर योद्धा’ स्वाभाविक है, जबकि पादटिप्पणी अन्य संभव अर्थ सुरक्षित रखती है।
- source_word: מַעֲשֵׂיָהוּ
  choice: मासेयाह
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: इब्रानी संबंध-वाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עַזְרִיקָם
  choice: अज्रीकाम
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: נְגִיד הַבָּיִת
  choice: राजमहल के प्रधान
  rationale: נְגִיד किसी अगुवे, प्रधान या उच्च अधिकारी को दर्शाता है। राजकीय संदर्भ में הַבָּיִת संभवतः राजमहल अथवा राजघराने को सूचित करता है; मुख्य पाठ में ‘राजमहल के प्रधान’ पद और संदर्भ दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶלְקָנָה
  choice: एल्काना
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: מִשְׁנֵה הַמֶּלֶךְ
  choice: राजा के बाद दूसरे पद पर रहनेवाले
  rationale: מִשְׁנֶה पदक्रम में दूसरे स्थान के व्यक्ति को दर्शाता है। यह रूप पदानुक्रम का भाव बनाए रखता है, पर किसी बाद के विशिष्ट प्रशासनिक पदनाम को पाठ में नहीं लाता।
