base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/023.yaml
  text: And he sacrificed to the gods of Damascus that had struck him[a], and he said, “Because the gods of the kings of Aram help them, I will sacrifice to them[c][b], so that they may help me.” But they became the downfall of him and of all Israel.
translation:
  language: hi
  text: और उसने दमिश्क के उन देवताओं को बलि चढ़ाई, जो उसे मार रहे थे[a]। उसने कहा, “अराम के राजाओं के देवता उनकी सहायता करते हैं; इसलिए मैं उन्हें बलि चढ़ाऊँगा, ताकि वे मेरी सहायता करें।” परन्तु वे उसके और सारे इस्राएल के पतन का कारण बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्होंने उसे पराजित किया था।” इब्रानी कृदन्त का अर्थ जारी क्रिया या किसी की विशेषता बताने वाली क्रिया हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: उसने ... बलि चढ़ाई
  rationale: זבח का अर्थ बलि अर्पित करना है; ‘बलि चढ़ाई’ आधुनिक हिन्दी में स्वाभाविक और उपासना-संबंधी क्रिया को स्पष्ट रखने वाला प्रयोग है।
- source_word: לֵאלֹהֵי דַרְמֶשֶׂק
  choice: दमिश्क के ... देवताओं को
  rationale: אֱלֹהֵי यहाँ बहुवचन संबंध-रूप है; मूर्तिपूजक प्रसंग में ‘देवताओं’ उपयुक्त है। दमिश्क मानक हिन्दी स्थान-नाम है।
- source_word: הַמַּכִּים בּוֹ
  choice: जो उसे मार रहे थे
  rationale: निश्चित उपवाक्य में आया कृदन्त जारी अथवा चरितार्थ क्रिया व्यक्त कर सकता है। ‘मार रहे थे’ उसकी पराजय/प्रहार के अर्थ को रखते हुए इस पक्षगत अस्पष्टता को काफी हद तक बचाता है।
- source_word: אֱלֹהֵי מַלְכֵי אֲרָם
  choice: अराम के राजाओं के देवता
  rationale: मूल में ‘राजाओं’ बहुवचन है; उसे एकवचन बनाकर सरल नहीं किया गया।
- source_word: מַעְזְרִים אוֹתָם
  choice: उनकी सहायता करते हैं
  rationale: कृदन्त को सामान्य अथवा चरितार्थ वर्तमान के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לָהֶם אֲזַבֵּחַ וְיַעְזְרוּנִי
  choice: मैं उन्हें बलि चढ़ाऊँगा, ताकि वे मेरी भी सहायता करें
  rationale: अपूर्ण क्रिया अहाज के संकल्प को और अगला वाक्यांश उसके उद्देश्य को व्यक्त करता है; ‘भी’ तुलना को स्वाभाविक हिन्दी में स्पष्ट करता है, कोई नया तात्त्विक दावा नहीं जोड़ता।
- source_word: וְהֵם הָיוּ לוֹ לְהַכְשִׁילוֹ וּלְכָל יִשְׂרָאֵל
  choice: परन्तु वे उसके और सारे इस्राएल के पतन का कारण बने
  rationale: הכשיל का हिफ़ील रूप ठोकर खिलाने अथवा विनाश/पतन का कारण बनने का भाव देता है। प्रसंगगत विरोध के कारण וְ को ‘परन्तु’ कहा गया और दोनों कर्मों का समन्वय सुरक्षित रखा गया।
theological_decisions:
- issue: दमिश्क के देवताओं द्वारा अहाज को मारने का कथन
  choice: कथन को अहाज की मूर्तिपूजक समझ के रूप में बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ऐसा स्पष्ट जोड़ना कि अहाज केवल मानता था कि इन देवताओं ने उसे हराया।
  rationale: मूल वर्णन अहाज की धारणा को उसी के आगामी कथन से प्रकट करता है, पर कथाकार अंत में विडंबनापूर्ण परिणाम बताता है। अनुवाद देवताओं की वास्तविक सत्ता का समर्थन भी नहीं करता और मूल तनाव को व्याख्या से समाप्त भी नहीं करता।
- issue: अंतिम वाक्य में देवताओं की भूमिका
  choice: ‘उसके और सारे इस्राएल के पतन का कारण बने’
  alternative: ‘उन्होंने उसे और सारे इस्राएल को ठोकर खिलाई’ अथवा ‘वे उसके और सारे इस्राएल के लिए विनाशकारी सिद्ध हुए।’
  rationale: यह मूल के कारणवाचक הכשיל और न्याय-संबंधी परिणाम को स्पष्ट, प्राकृतिक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त धार्मिक सिद्धान्त को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘परन्तु’ प्रसंगगत विरोध को उभारता है; ‘सारे इस्राएल’ सामान्य पाठक के लिए स्वाभाविक है। केवल वास्तविक पाठगत/शाब्दिक अस्पष्टता पर एक पादटिप्पणी रखी गई है।
