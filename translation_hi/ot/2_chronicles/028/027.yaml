  text: וַ/יִּשְׁכַּ֨ב אָחָ֜ז עִם אֲבֹתָ֗י/ו וַֽ/יִּקְבְּרֻ֤/הוּ בָ/עִיר֙ בִּ/יר֣וּשָׁלִַ֔ם כִּ֚י לֹ֣א הֱבִיאֻ֔/הוּ לְ/קִבְרֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יְחִזְקִיָּ֥הֽוּ בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/027.yaml
  text: And Ahaz lay down with his fathers[a], and they buried him in the city, in Jerusalem, for they did not bring him into the tombs of the kings of Israel. And Hezekiah his son reigned in his place.
translation:
  language: hi
  text: अहाज अपने पुरखाओं के साथ सो गया, और उन्होंने उसे नगर में, यरूशलेम में दफ़नाया, क्योंकि वे उसे इस्राएल के राजाओं की कब्रों में[a] नहीं ले गए। फिर उसका पुत्र हिजकिय्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “इस्राएल के राजा” है। अहाज यहूदा का राजा था; इसलिए कुछ लोग इसे दाऊदवंशी राजाओं की राजकीय कब्रों का उल्लेख मानते हैं, या यहाँ “यहूदा के राजा” अपेक्षित समझते हैं।
    reason: वैकल्पिक समझ और पाठगत-ऐतिहासिक तनाव को स्पष्ट करना
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया
  rationale: यह राजकीय मृत्यु-वृत्तांत का पारंपरिक इब्रानी मुहावरा है। हिन्दी में “सो गया” मृत्यु का संकेत बनाए रखता है, जबकि “पुरखाओं के साथ” वंशगत सूत्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे ... दफ़नाया
  rationale: इब्रानी क्रिया कर्तृवाच्य बहुवचन में है; इसलिए निष्क्रिय “उसे दफ़नाया गया” के बजाय कर्तृवाच्य रूप रखा गया है।
- source_word: בָעִיר בִּירוּשָׁלִַם
  choice: नगर में, यरूशलेम में
  rationale: मूल पाठ में “नगर में” और “यरूशलेम में” दोनों पद अलग-अलग हैं। अनुवाद इस दोहरे विन्यास को बनाए रखता है और राजकीय कब्रों से अलग, नगर के भीतर दफ़नाए जाने पर बल देता है।
- source_word: הֱבִיאֻהוּ לְקִבְרֵי
  choice: उसे ... कब्रों में नहीं ले गए
  rationale: हिफ़ील क्रिया का ठोस अर्थ “ले जाना” है; इसे केवल “दफ़नाना” बनाकर परिणाम में नहीं समेटा गया। राजकीय दफ़न-स्थलों के लिए “कब्रों” सामान्य और स्पष्ट हिन्दी है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: मसोरेटिक इब्रानी पाठ स्पष्ट रूप से “इस्राएल” कहता है। ऐतिहासिक अपेक्षा के आधार पर इसे “यहूदा” में नहीं बदला गया।
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  choice: उसके स्थान पर राजा हुआ
  rationale: यह उत्तराधिकार का सूत्र है। “राजा हुआ” राजसिंहासन ग्रहण करने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और “उसके स्थान पर” मूल के प्रतिस्थापन/उत्तराधिकार भाव को रखता है।
theological_decisions:
- issue: क्या “इस्राएल के राजाओं” को ऐतिहासिक संदर्भ के कारण “यहूदा के राजाओं” कर देना चाहिए
  choice: मुख्य पाठ में “इस्राएल के राजाओं” बनाए रखना
  alternative: यहूदा के राजाओं
  rationale: प्राप्त इब्रानी पाठ “इस्राएल” कहता है। अहाज यहूदा का राजा था, इसलिए “यहूदा” अपेक्षित लग सकता है; फिर भी पाठ को सामंजस्यपूर्ण बनाने के लिए बदलने के बजाय उसकी वास्तविक शब्दावली और उससे उत्पन्न तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “पुरखाओं के साथ सो गया” पारंपरिक बाइबलीय मृत्यु-मुहावरे को सुरक्षित रखता है। “नगर में, यरूशलेम में” कुछ औपचारिक है, पर मूल इब्रानी की पुनरुक्त संरचना जानबूझकर बनाए रखता है।
