reference: 2 Chronicles 28:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/ה֥וּא הִקְטִ֖יר בְּ/גֵ֣יא בֶן הִנֹּ֑ם וַ/יַּבְעֵ֤ר אֶת בָּנָי/ו֙ בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/003.yaml
  text: He also burned incense in the Valley of Ben-hinnom[a], and he burned his sons in the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: hi
  text: उसने बेन-हिन्नोम की घाटी में भी धूप जलाई और अपने पुत्रों को आग में जला दिया[a], उन राष्ट्रों के घृणित कामों के अनुसार जिन्हें याहवे ने इस्राएलियों के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पुत्रों को आग में से पार कराया।” यहाँ इब्रानी में अधिक सीधे तौर पर “अपने पुत्रों को आग में जला दिया” कहा गया है।
    reason: वैकल्पिक पाठार्थ को दर्ज करते हुए इब्रानी क्रिया के अधिक प्रत्यक्ष अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: הִקְטִיר
  choice: धूप जलाई
  rationale: हिफ़ील रूप बलि के धुएँ या धूप को जलाने का संकेत देता है। इस उपासना-संबंधी प्रसंग में ‘धूप जलाई’ संक्षिप्त और स्वाभाविक है, यद्यपि सामान्य रूप से जलाकर चढ़ाई गई भेंट भी संभव है।
- source_word: בְּגֵיא בֶן־הִנֹּם
  choice: बेन-हिन्नोम की घाटी में
  rationale: यह स्थान-नाम है। लिप्यंतरण बाद की ‘गेहन्ना’ संबंधी धारणाओं को इस ऐतिहासिक प्रसंग में लाने से बचाता है।
- source_word: וַיַּבְעֵר אֶת־בָּנָיו בָּאֵשׁ
  choice: अपने पुत्रों को आग में जला दिया
  rationale: בער का हिफ़ील रूप और ‘आग में’ मिलकर वास्तविक रूप से जलाने का प्रबल अर्थ देते हैं। בָּנָיו बहुवचन और पुल्लिंग है, इसलिए ‘पुत्रों’ रखा गया है।
- source_word: כְּתוֹעֲבוֹת
  choice: इस प्रकार ... घिनौने काम किए
  rationale: शाब्दिक ‘घिनौनी बातों/कामों के अनुसार’ हिंदी में असहज होता। यह रचना तुलना और नैतिक तीव्रता दोनों को स्वाभाविक आधुनिक हिंदी में बनाए रखती है।
- source_word: הַגּוֹיִם
  choice: राष्ट्रों
  rationale: यहाँ इससे देश के वे पूर्ववर्ती राष्ट्र अभिप्रेत हैं जिन्हें निकाला गया था; ‘अन्यजातियों’ की अपेक्षा ‘राष्ट्रों’ कम धर्मशास्त्रीय भार वाला है।
- source_word: הֹרִישׁ
  choice: निकाल दिया था
  rationale: ירש का हिफ़ील यहाँ भूमि से बेदखल करके निकालने का अर्थ देता है। ‘निकाल दिया’ सामान्य पाठक के लिए सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के सामने से
  rationale: यह מִפְּנֵי के स्थानिक मुहावरे को सुरक्षित रखता है और בְּנֵי יִשְׂרָאֵל को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या बाल-बलि के वर्णन को कम प्रत्यक्ष बनाया जाए
  choice: मुख्य पाठ में ‘अपने पुत्रों को आग में जला दिया’
  alternative: ‘अपने पुत्रों को आग में से पार कराया’
  rationale: यहाँ इब्रानी में בער प्रयुक्त है, न कि ‘आग में से पार कराने’ का सामान्य सूत्र। इसलिए पाठ की कठोरता को नरम किए बिना अधिक प्रत्यक्ष अर्थ मुख्य पाठ में रखा गया है और प्रचलित वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घिनौने काम’ תועבות की नैतिक तीव्रता व्यक्त करता है; ‘पुत्रों’ मूल के पुल्लिंग बहुवचन को सुरक्षित रखता है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
