base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/022.yaml
  text: In the time of his distress[a], he continued to act unfaithfully against Yahweh—he, King Ahaz.
translation:
  language: hi
  text: अपने संकट के समय वह यहोवा के विरुद्ध और भी विश्वासघात करता गया[a]—वही राजा आहाज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने यहोवा के विरुद्ध विश्वासघात को और बढ़ाया”; यह इब्रानी मुहावरा है, जिसका अर्थ है कि वह विश्वासघात करता रहा या उसमें और आगे बढ़ा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְעֵת הָצֵר לוֹ
  choice: अपने संकट के समय
  rationale: यह पदबंध उस समय को बताता है जब आहाज संकट में था। यह हिंदी में स्वाभाविक है और मूल की संज्ञात्मक काल-अभिव्यक्ति को बनाए रखता है।
- source_word: וַיּוֹסֶף לִמְעוֹל
  choice: विश्वासघात करता ही गया
  rationale: יסף के साथ क्रिया का infinitive किसी काम को जारी रखने या उसमें और आगे बढ़ने का भाव देता है। ‘करता ही गया’ इस निरंतर और बढ़ती हुई बेवफाई को सहज हिंदी में व्यक्त करता है।
- source_word: לִמְעוֹל
  choice: विश्वासघात करना
  rationale: מעל विश्वास या वाचा के संबंध को तोड़ने वाली बेवफाई को दर्शाता है; ‘विश्वासघात’ उसके नैतिक और धार्मिक बल को स्पष्ट रखता है।
- source_word: בַּיהוָה
  choice: यहोवा के विरुद्ध
  rationale: מעל के साथ ב उस व्यक्ति को चिह्नित करता है जिसके विरुद्ध विश्वासघात किया गया। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הוּא הַמֶּלֶךְ אָחָז
  choice: वही राजा आहाज
  rationale: स्वतंत्र सर्वनाम הוּא विषय पर जोर देता है। ‘वही’ और डैश मूल के emphatic, लगभग विस्मयकारी पुनर्परिचय को हिंदी में बनाए रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है। ‘यहोवा’ सामान्य हिंदी पाठक के लिए पहचाना हुआ रूप है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: מעל में धार्मिक बेवफाई का भाव
  choice: विश्वासघात
  alternative: पाप करना / अपराध करना
  rationale: ‘विश्वासघात’ संबंध और वाचा भंग करने का भाव बचाता है, जबकि सामान्य ‘पाप’ या ‘अपराध’ मूल की विशिष्ट धारणा को कमजोर कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘करता ही गया’ मूल इब्रानी मुहावरे का स्वाभाविक हिंदी रूप है, और अंतिम डैशयुक्त वाक्यांश आहाज की पहचान पर मूल का जोर बनाए रखता है।
