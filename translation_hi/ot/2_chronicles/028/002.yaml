source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דַרְכֵ֖י מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֧ם מַסֵּכ֛וֹת עָשָׂ֖ה לַ/בְּעָלִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/028/002.yaml
  text: He walked in the ways of the kings of Israel[b][a], and he also made cast images for the Baals.
translation:
  language: hi
  text: वह इस्राएल के राजाओं के मार्गों पर चला और उसने बाल देवताओं[b] के लिए ढली हुई मूर्तियाँ[a] भी बनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साँचे में ढालकर बनाई गई मूर्तियाँ।’ इब्रानी शब्द विशेष रूप से ढलाई करके बनाई गई प्रतिमाओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘बाल’ बहुवचन में है; यह बाल-उपासना से जुड़े अनेक स्थानीय रूपों या प्रतिरूपों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: वह ... मार्गों पर चला
  rationale: यह मूल के ‘चलने’ वाले नैतिक रूपक को बनाए रखता है; संदर्भ में इसका अर्थ जीवन-व्यवहार अपनाना है।
- source_word: בְּדַרְכֵי
  choice: के मार्गों पर
  rationale: बहुवचन ‘मार्गों’ को सुरक्षित रखते हुए यह व्यवहार और आचरण की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: यह मूल संबंधवाचक पदबंध और ऐतिहासिक संकेत का सीधा अनुवाद है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पहले आरोप के साथ एक और अपराध जोड़े जाने के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַסֵּכוֹת
  choice: ढली हुई मूर्तियाँ
  rationale: यह केवल सामान्य ‘मूर्तियाँ’ नहीं, बल्कि साँचे में ढालकर बनाई गई प्रतिमाओं का निर्माण-संबंधी अर्थ भी सुरक्षित रखता है।
- source_word: עָשָׂה
  choice: बनाईं
  rationale: सामान्य क्रिया मूल के सीधे अर्थ को स्पष्ट और सहज रूप में व्यक्त करती है।
- source_word: לַבְּעָלִים
  choice: बाल देवताओं के लिए
  rationale: ‘बाल’ का बहुवचन हिन्दी में अस्पष्ट हो सकता है, इसलिए ‘देवताओं’ से मूल का स्पष्ट बहुवचन सुरक्षित और बोधगम्य रहता है।
theological_decisions:
- issue: בְּעָלִים के बहुवचन का अनुवाद
  choice: बाल देवताओं
  alternative: बाल; बाल की मूर्तियाँ
  rationale: मूल पाठ बहुवचन में है। ‘बाल देवताओं’ से अनेक स्थानीय रूपों या उपासना-संबंधी अभिव्यक्तियों की संभावना को बिना किसी एक व्याख्या को निर्णायक बनाए सुरक्षित रखा गया है।
- issue: आचरण के लिए ‘चलने’ के रूपक को बनाए रखना
  choice: इस्राएल के राजाओं के मार्गों पर चला
  alternative: इस्राएल के राजाओं के आचरण का अनुसरण किया
  rationale: मूल का रूपक आधुनिक हिन्दी में समझने योग्य है और पाठ की साहित्यिक बनावट को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मार्गों पर चला’ मूल इब्रानी रूपक को बनाए रखता है, जबकि ‘बाल देवताओं’ हिन्दी में बहुवचन को स्पष्ट करता है।
