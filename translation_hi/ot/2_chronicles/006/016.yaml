source:
  edition: WLC
  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל שְׁ֠מֹר לְ/עַבְדְּ/ךָ֨ דָוִ֤יד אָבִ/י֙ אֵת֩ אֲשֶׁ֨ר דִּבַּ֤רְתָּ לּ/וֹ֙ לֵ/אמֹ֔ר לֹא יִכָּרֵ֨ת לְ/ךָ֥ אִישׁ֙ מִ/לְּ/פָנַ֔/י יוֹשֵׁ֖ב עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל רַ֠ק אִם יִשְׁמְר֨וּ בָנֶ֜י/ךָ אֶת דַּרְכָּ֗/ם לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י כַּ/אֲשֶׁ֥ר הָלַ֖כְתָּ לְ/פָנָֽ/י׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/016.yaml
  text: And now, LORD, God of Israel, keep for your servant David my father what you spoke to him, saying, ‘A man to sit on the throne of Israel before me shall not be cut off from you, if only your sons keep their way by walking in my law, as you have walked before me.’
translation:
  language: hi
  text: 'और अब, हे इस्राएल के परमेश्वर यहोवा, अपने सेवक दाऊद, मेरे पिता, के लिए वह बात पूरी कर जो तूने उससे कही थी: ‘तेरे वंश में ऐसा कोई पुरुष समाप्त न होगा जो मेरे सामने इस्राएल के सिंहासन पर बैठे, बशर्ते कि तेरे पुत्र अपने चालचलन का ध्यान रखें और मेरी व्यवस्था के अनुसार चलें, जैसे तू मेरे सामने चला है।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמֹר
  choice: पूरी कर
  rationale: प्रतिज्ञा को ‘रखने’ के अर्थ में स्वाभाविक हिन्दी; संदर्भ में परमेश्वर से कही हुई बात को पूरा करने की विनती है।
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: तेरा कोई वंशज कभी न मिटेगा
  rationale: शाब्दिक रूप से ‘तेरे लिए कोई पुरुष काटा न जाएगा’; राजवंशीय संदर्भ में सिंहासन पर बैठनेवाले वंशज की निरंतरता अभिप्रेत है।
- source_word: רַק אִם
  choice: बशर्ते कि
  rationale: प्रतिज्ञा से जुड़ी स्पष्ट शर्त को बनाए रखता है।
- source_word: יִשְׁמְרוּ ... אֶת דַּרְכָּם
  choice: अपने चालचलन पर ध्यान रखें
  rationale: हिब्रू मुहावरे में जीवन-पथ की सावधानी से रक्षा करने का भाव है; आधुनिक हिन्दी में ‘चालचलन’ नैतिक जीवन को स्पष्ट करता है।
- source_word: בְּתוֹרָתִי
  choice: मेरी व्यवस्था पर
  rationale: תורה यहाँ परमेश्वर की दी हुई विधि/शिक्षा को सूचित करता है; इतिहास-पुस्तक के इस संदर्भ में ‘व्यवस्था’ स्थापित बाइबिलीय शब्द है।
- source_word: לְפָנָי
  choice: मेरे सामने
  rationale: ईश्वरीय उपस्थिति और जवाबदेही की स्थानिक-रूपक भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: दाऊद से की गई राजवंशीय प्रतिज्ञा की सशर्तता
  choice: ‘बशर्ते कि’ द्वारा शर्त स्पष्ट रखी गई
  alternative: प्रतिज्ञा को बिना शर्त के रूप में प्रस्तुत करना
  rationale: पद में רַק אִם स्पष्टतः पुत्रों के आचरण की शर्त जोड़ता है; इसे किसी व्यवस्थित धर्मवैज्ञानिक समाधान से नरम नहीं किया गया।
- issue: सिंहासन पर बैठनेवाले ‘पुरुष’ की पहचान
  choice: राजवंशीय संदर्भ में ‘वंशज’
  alternative: ‘पुरुष’ या मसीही पहचान को सीधे जोड़ना
  rationale: אִישׁ का निकट अर्थ ‘पुरुष’ है, पर ‘तेरे लिए’ और सिंहासन का संदर्भ उत्तराधिकारी को दर्शाता है; पद स्वयं किसी एक विशिष्ट भावी व्यक्ति की पहचान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, विनयपूर्ण प्रार्थना और राजकीय-वाचा संबंधी गरिमा के साथ। ‘तू’ दाऊद द्वारा परमेश्वर को किए गए सीधे संबोधन की निकटता और पारंपरिक बाइबिलीय शैली बनाए रखता है।
