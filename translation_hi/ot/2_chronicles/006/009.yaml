id: 2CH.6.9
reference: 2 Chronicles 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַ֣ק אַתָּ֔ה לֹ֥א תִבְנֶ֖ה הַ/בָּ֑יִת כִּ֤י בִנְ/ךָ֙ הַ/יּוֹצֵ֣א מֵֽ/חֲלָצֶ֔י/ךָ הֽוּא יִבְנֶ֥ה הַ/בַּ֖יִת לִ/שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/009.yaml
  text: Yet you shall not build the house[a]; rather, your son, who will come from your own body[b], shall build the house for my name.
translation:
  language: hi
  text: फिर भी तू उस भवन[a] को नहीं बनाएगा; बल्कि तेरा पुत्र, जो तेरे ही शरीर से उत्पन्न होगा[b], वही मेरे नाम के लिए उस भवन को बनाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मन्दिर’; हिब्रू में ‘भवन’ (शाब्दिक रूप से ‘घर’) मन्दिर के लिए प्रचलित पद है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘जो तेरी कटि से निकलेगा’; यह प्रत्यक्ष शारीरिक वंशज के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह शब्द पिछले कथन पर रोक या सीमा लगाता है; ‘फिर भी’ उसके विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִבְנֶה הַבָּיִת / יִבְנֶה הַבַּיִת
  choice: उस भवन को बनाएगा
  rationale: हिब्रू में निश्चित ‘भवन/घर’ है और संदर्भ में वही यहोवा का भवन, अर्थात मन्दिर, है। ‘उस भवन’ मूल अभिव्यक्ति को बनाए रखते हुए हिन्दी में संदर्भ स्पष्ट करता है।
- source_word: כִּי
  choice: बल्कि
  rationale: नकारात्मक कथन के बाद यह पुत्र के विषय में विपरीत सकारात्मक कथन प्रस्तुत करता है; ‘बल्कि’ इस सुधारात्मक विरोध को स्पष्ट करता है।
- source_word: בִנְךָ
  choice: तेरा पुत्र
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: הַיּוֹצֵא מֵחֲלָצֶיךָ
  choice: जो तेरे ही शरीर से उत्पन्न होगा
  rationale: शाब्दिक मुहावरा ‘तेरी कटि से निकलने वाला’ प्रत्यक्ष शारीरिक वंशज को दर्शाता है। चुना हुआ रूप आधुनिक हिन्दी में अर्थ स्पष्ट करता है और ‘ही’ निकट जैविक संबंध पर बल रखता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी में ‘वही’ से स्वाभाविक रूप से सुरक्षित रहता है।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: यह भवन को परमेश्वर के नाम को समर्पित और उससे संबद्ध किए जाने का भाव रखता है; अनुवाद मूल रूपक और धार्मिक तनाव को बनाए रखता है।
theological_decisions:
- issue: मन्दिर के लिए प्रयुक्त शब्द
  choice: उस भवन
  alternative: मन्दिर
  rationale: मूल हिब्रू में ‘भवन/घर’ है, जो इस संदर्भ में मन्दिर का सामान्य पद है। मुख्य पाठ में ‘भवन’ रखने से स्रोत की शब्दावली और अन्तर्पाठीय संबंध सुरक्षित रहते हैं; पादटिप्पणी अर्थ स्पष्ट करती है।
- issue: वंश-संबंधी मुहावरा
  choice: तेरे ही शरीर से उत्पन्न होगा
  alternative: तेरी कटि से निकलेगा
  rationale: हिब्रू मुहावरा प्रत्यक्ष जैविक वंश को बताता है। आधुनिक हिन्दी का चयन अर्थ स्पष्ट करता है, पर उससे आगे कोई अतिरिक्त वंशविषयक धर्मसिद्धान्त नहीं जोड़ता।
- issue: स्वतंत्र सर्वनाम का बल
  choice: वही
  alternative: वह
  rationale: הוּא कर्ता पर जोर देता है—दाऊद नहीं, उसका पुत्र भवन बनाएगा। ‘वही’ इस विरोध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। दाऊद को संबोधन के लिए प्रसंगानुकूल एकवचन ‘तू/तेरा’ रखा गया है। ‘भवन’ स्रोत के ‘घर’ रूपक को सुरक्षित रखते हुए ‘घर’ की सम्भावित घरेलू अस्पष्टता से बचाता है; ‘वही’ मूल सर्वनाम का बल व्यक्त करता है।
