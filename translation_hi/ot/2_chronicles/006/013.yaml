source:
  edition: WLC
  text: כִּֽי עָשָׂ֨ה שְׁלֹמֹ֜ה כִּיּ֣וֹר נְחֹ֗שֶׁת וַֽ/יִּתְּנֵ/הוּ֮ בְּ/ת֣וֹךְ הָ/עֲזָרָה֒ חָמֵ֨שׁ אַמּ֜וֹת אָרְכּ֗/וֹ וְ/חָמֵ֤שׁ אַמּוֹת֙ רָחְבּ֔/וֹ וְ/אַמּ֥וֹת שָׁל֖וֹשׁ קוֹמָת֑/וֹ וַ/יַּעֲמֹ֣ד עָלָ֗י/ו וַ/יִּבְרַ֤ךְ עַל בִּרְכָּי/ו֙ נֶ֚גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֔ל וַ/יִּפְרֹ֥שׂ כַּפָּ֖י/ו הַ/שָּׁמָֽיְמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/013.yaml
  text: For Solomon had made a bronze platform and set it in the midst of the court; it was five cubits long[a], five cubits wide, and three cubits high. He stood on it, then knelt on his knees before all the assembly of Israel and spread out his hands toward heaven.
translation:
  language: hi
  text: क्योंकि सुलैमान ने काँसे का एक मंच[a] बनाया और उसे आँगन के बीच में रख दिया था। वह पाँच हाथ लंबा, पाँच हाथ चौड़ा और तीन हाथ ऊँचा था। सुलैमान उस पर खड़ा हुआ, फिर इस्राएल की सारी सभा के सामने घुटने टेके और स्वर्ग की ओर अपने हाथ फैलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द כִּיּוֹר का सामान्य अर्थ ‘हौद’ या ‘धोने का पात्र’ है, पर यहाँ प्रसंग एक ऐसे ऊँचे काँसे के ढाँचे का संकेत देता है जिस पर सुलैमान खड़ा हो सकता था; इसलिए ‘मंच’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले प्रसंग में सुलैमान की स्थिति और मुद्रा का स्पष्टीकरण देता है; इसलिए कारण अथवा व्याख्या सूचित करने वाला ‘क्योंकि’ उपयुक्त है।
- source_word: כִּיּוֹר נְחֹשֶׁת
  choice: काँसे का एक मंच
  rationale: כִּיּוֹר का सामान्य अर्थ ‘हौद’ या ‘धोने का पात्र’ है, पर यहाँ दी गई माप और सुलैमान का उस पर खड़ा होना एक ऊँचे मंच का संकेत देते हैं। असामान्य शब्द-प्रयोग को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּתוֹךְ הָעֲזָרָה
  choice: आँगन के बीच में
  rationale: עֲזָרָה मन्दिर के आँगन को और בְּתוֹךְ उसके भीतर अथवा बीच में होने को दर्शाता है।
- source_word: חָמֵשׁ אַמּוֹת ... וְאַמּוֹת שָׁלֹשׁ
  choice: पाँच हाथ लंबा, पाँच हाथ चौड़ा और तीन हाथ ऊँचा
  rationale: प्राचीन माप אַמָּה के लिए हिन्दी बाइबलीय प्रयोग में स्वाभाविक ‘हाथ’ रखा गया है और तीनों आयाम स्पष्ट, सहज क्रम में दिए गए हैं।
- source_word: וַיִּבְרַךְ עַל בִּרְכָּיו
  choice: घुटने टेके
  rationale: इस रूप और प्रसंग में ברך का अर्थ ‘आशीष देना’ नहीं, बल्कि ‘घुटने टेकना’ है। हिन्दी में ‘घुटने टेके’ शारीरिक मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा के सामने
  rationale: קָהָל सार्वजनिक रूप से एकत्र समुदाय अर्थात ‘सभा’ है और נֶגֶד का स्थानिक भाव ‘के सामने’ से स्पष्ट होता है।
- source_word: וַיִּפְרֹשׂ כַּפָּיו הַשָּׁמָיְמָה
  choice: स्वर्ग की ओर अपने हाथ फैलाए
  rationale: כַּפָּיו का शाब्दिक अर्थ उसकी हथेलियाँ/हाथ है और दिशासूचक הַשָּׁמָיְמָה प्रार्थना की मुद्रा में स्वर्ग की ओर उन्मुख होने को बताता है।
theological_decisions:
- issue: इस प्रसंग में כִּיּוֹר का अर्थ
  choice: संदर्भानुसार ‘मंच’
  alternative: काँसे का हौद; काँसे का आधार
  rationale: यद्यपि इस शब्द का सामान्य अर्थ हौद या धोने का पात्र है, सुलैमान का उस पर खड़ा होना और उसकी माप मंच-जैसी संरचना की ओर संकेत करते हैं। ‘हौद’ दृश्य को भ्रामक बनाएगा; फिर भी मूल शब्द की असामान्यता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘सभा’, ‘स्वर्ग’ और प्राचीन माप ‘हाथ’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
