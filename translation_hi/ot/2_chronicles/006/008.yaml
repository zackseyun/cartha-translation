  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל דָּוִ֣יד אָבִ֔/י יַ֗עַן אֲשֶׁ֤ר הָיָה֙ עִם לְבָ֣בְ/ךָ֔ לִ/בְנ֥וֹת בַּ֖יִת לִ/שְׁמִ֑/י הֱֽטִיב֔וֹתָ כִּ֥י הָיָ֖ה עִם לְבָבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/008.yaml
  text: But Yahweh said to David my father[a], ‘Because it was in your heart to build a house for my name[b], you did well that it was in your heart.’
translation:
  language: hi
  text: पर याहवे ने मेरे पिता दाऊद से कहा, “क्योंकि मेरे नाम के लिए एक भवन[a] बनाने की बात तेरे मन में थी, इसलिए तूने अच्छा किया कि यह बात तेरे मन में थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर।” इब्रानी में शाब्दिक रूप से “भवन” या “घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है; इसे उपाधि से नहीं बदला गया।
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: कारण बताने वाले संयुक्त पद का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: הָיָה עִם לְבָבְךָ
  choice: तेरे मन में थी
  rationale: इब्रानी हृदय-वाचक मुहावरे का अर्थ अभिप्राय या संकल्प है; हिन्दी में ‘मन में’ स्वाभाविक है और आंतरिक इच्छा का भाव बनाए रखता है।
- source_word: לִבְנוֹת בַּיִת לִשְׁמִי
  choice: मेरे नाम के लिए एक भवन बनाने
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। ‘भवन’ यहाँ उपासना-स्थल के संदर्भ में गरिमापूर्ण और स्पष्ट है, जबकि ‘मेरे नाम के लिए’ मूल की धर्मवैचारिक अभिव्यक्ति सुरक्षित रखता है।
- source_word: הֱטִיבוֹתָ
  choice: तूने अच्छा किया
  rationale: हिफ़ील रूप यहाँ दाऊद के अभिप्राय पर स्वीकृति प्रकट करता है; यह हिन्दी में सीधा और स्वाभाविक है।
- source_word: כִּי הָיָה עִם לְבָבֶךָ
  choice: कि यह बात तेरे मन में थी
  rationale: मूल पाठ की जानबूझकर की गई पुनरावृत्ति को बनाए रखता है; ‘यह बात’ हिन्दी में संदर्भ को स्पष्ट करती है।
theological_decisions:
- issue: בַּיִת לִשְׁמִי में मंदिर की अभिव्यक्ति
  choice: मेरे नाम के लिए एक भवन
  alternative: मेरे नाम के लिए एक मंदिर
  rationale: मूल में ‘भवन/घर’ है, केवल ‘मंदिर’ नहीं। मुख्य पाठ मूल रूपक और ‘नाम’ की धर्मवैचारिक महत्ता बनाए रखता है; संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
- issue: अंतिम कारण/विषयवाचक כִּי
  choice: कि यह बात तेरे मन में थी
  alternative: क्योंकि यह बात तेरे मन में थी
  rationale: यहाँ כִּי को ‘कि’ समझने से पहले कथन की पुनरावृत्ति बनी रहती है और वाक्य स्वाभाविक रहता है; ‘क्योंकि’ भी व्याकरणतः संभव है, पर हिन्दी में अनावश्यक रूप से दूसरा कारण-संबंध उत्पन्न कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दाऊद को सीधे संबोधन के कारण एकवचन ‘तू/तेरे’ रखा गया है। मूल की ‘मन में थी’ वाली पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
