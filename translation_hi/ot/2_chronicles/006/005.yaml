source:
  edition: WLC
  text: מִן הַ/יּ֗וֹם אֲשֶׁ֨ר הוֹצֵ֣אתִי אֶת עַמִּ/י֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ לֹא בָחַ֣רְתִּֽי בְ/עִ֗יר מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לִ/בְנ֣וֹת בַּ֔יִת לִ/הְי֥וֹת שְׁמִ֖/י שָׁ֑ם וְ/לֹא בָחַ֣רְתִּֽי בְ/אִ֔ישׁ לִ/הְי֥וֹת נָגִ֖יד עַל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/005.yaml
  text: From the day that I brought my people out of the land of Egypt[a], I have not chosen a city from any of the tribes of Israel to build a house for my name to be there[c][b], nor have I chosen a man to be ruler over my people Israel.
translation:
  language: hi
  text: जिस दिन से मैं अपनी प्रजा को मिस्र देश से निकाल लाया, तब से मैंने इस्राएल के किसी भी गोत्र में से कोई नगर नहीं चुना कि वहाँ एक घर बनाया जाए और मेरा नाम वहाँ रहे[a]; और न मैंने किसी पुरुष को अपनी प्रजा इस्राएल पर शासक होने के लिए चुना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घर’ से आशय मन्दिर है; मूल इब्रानी में सामान्य शब्द ‘घर’ ही प्रयुक्त है, न कि ‘मन्दिर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: जिस दिन से ... उस दिन से
  rationale: यह स्वाभाविक हिन्दी में आरम्भ-बिंदु से अब तक जारी कालगत संबंध को स्पष्ट करता है; दोहराव हिन्दी वाक्य को संभालता है।
- source_word: הוֹצֵאתִי אֶת עַמִּי מֵאֶרֶץ מִצְרַיִם
  choice: मैं अपनी प्रजा को मिस्र देश से निकाल लाया
  rationale: हिफ़ील का कारणवाचक अर्थ और निर्गमन का संकेत सुरक्षित रहता है; ‘निकाल लाया’ वर्तमान वक्ता की दृष्टि से स्वाभाविक है।
- source_word: לֹא בָחַרְתִּי בְעִיר מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: मैंने इस्राएल के किसी भी गोत्र में कोई नगर नहीं चुना
  rationale: नकारात्मक वाक्य में מִכֹּל का वितरणात्मक अर्थ ‘किसी भी’ से स्पष्ट होता है; नगर का किसी गोत्र के क्षेत्र में होना हिन्दी में सहज रूप से व्यक्त है।
- source_word: לִבְנוֹת בַּיִת
  choice: कि वहाँ एक भवन बनाया जाए
  rationale: בַּיִת का मूल अर्थ बनाए रखते हुए ‘भवन’ हिन्दी में उपासना-स्थल के लिए गरिमापूर्ण है और सीधे ‘मन्दिर’ कहकर व्याख्या आरोपित नहीं करता।
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: और मेरा नाम वहाँ रहे
  rationale: हिब्रू के ‘होना’ को ‘रहे’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘वास करे’ जैसा अधिक व्याख्यात्मक विचार नहीं जोड़ा गया।
- source_word: וְלֹא בָחַרְתִּי בְאִישׁ
  choice: और न मैंने किसी पुरुष को ... चुना
  rationale: אִישׁ के पुरुषवाचक एकवचन को सुरक्षित रखा गया है और समानांतर नकार स्पष्ट है।
- source_word: נָגִיד
  choice: प्रधान
  rationale: यह नियुक्त अधिकार रखनेवाले शासकीय अगुवे का अर्थ देता है और ‘राजकुमार’ से जुड़ी वंशगत धारणा से बचता है।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल पर
  rationale: ‘पर’ अधिकार-संबंध और ‘मेरी प्रजा इस्राएल’ की वाचा-संबंधी पहचान दोनों को बनाए रखता है।
theological_decisions:
- issue: पवित्रस्थान की शब्दावली और परमेश्वर के नाम की उपस्थिति
  choice: ‘भवन’ और ‘मेरा नाम वहाँ रहे’
  alternative: ‘मन्दिर’ और ‘मेरी उपस्थिति वहाँ वास करे’
  rationale: मूल पाठ सामान्य संज्ञा ‘घर/भवन’ और नाम के ‘वहाँ होने’ की भाषा प्रयोग करता है। चुना हुआ रूप नाम और उपस्थिति के संबंध को व्याख्यात्मक विस्तार द्वारा तय नहीं करता।
- issue: אִישׁ का लिंग-सटीक अनुवाद
  choice: किसी पुरुष को
  alternative: किसी व्यक्ति को
  rationale: संदर्भ इस्राएल पर नियुक्त एक पुरुष शासक का है; इसलिए मूल का पुल्लिंग एकवचन बनाए रखा गया है।
- issue: पूर्ण क्रियाओं का कालगत बल
  choice: ‘जिस दिन से ... उस दिन से मैंने ... नहीं चुना’
  alternative: ‘जिस दिन ... मैंने ... नहीं चुना’
  rationale: कालगत आरम्भ-बिंदु से भाषण के समय तक बने रहनेवाले दावे को हिन्दी में ‘से’ की रचना स्पष्ट करती है, जबकि क्रिया का पूर्ण घटना-रूप भी बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप। ‘प्रजा’, ‘भवन’ और ‘प्रधान’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल की राजकीय और वाचा-संबंधी भाषा बनाए रखते हैं।
