base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/006.yaml
  text: But I have chosen Jerusalem for my name to be there[a], and I have chosen David to be over my people Israel.
translation:
  language: hi
  text: परन्तु मैंने यरूशलेम को चुना है कि मेरा नाम वहाँ रहे[a], और मैंने दाऊद को चुना है कि वह मेरी प्रजा इस्राएल के ऊपर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने यरूशलेम को चुना ... और मैंने दाऊद को चुना।” इब्रानी क्रियारूपों का अनुवाद सरल भूतकाल में भी किया जा सकता है; मुख्य पाठ में “चुना है” सन्दर्भ में परमेश्वर के स्थापित चुनाव के बने रहने वाले प्रभाव को व्यक्त करता है।
    reason: काल-सम्बन्धी वैकल्पिक अनुवाद
lexical_decisions:
- source_word: וָאֶבְחַר
  choice: मैंने ... को चुना है
  rationale: בחר का अर्थ चुनना है। हिन्दी में पूर्ण वर्तमान ‘चुना है’ परमेश्वर के उस स्थापित चुनाव की वर्तमान प्रासंगिकता व्यक्त करता है; सरल भूतकाल की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम को प्रचलित मानक हिन्दी बाइबलीय रूप में रखा गया है।
- source_word: לִהְיוֹת
  choice: कि ... रहे / कि वह ... हो
  rationale: היה के इस धातुरूप में प्रयोजन या परिणाम का भाव है। दोनों खण्डों में स्वाभाविक हिन्दी के अनुसार ‘कि ... रहे/हो’ कहा गया है।
- source_word: שְׁמִי
  choice: मेरा नाम
  rationale: शाब्दिक और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण मन्दिर-सम्बन्धी अभिव्यक्ति को किसी व्याख्यात्मक पद, जैसे ‘मेरी उपस्थिति’, से नहीं बदला गया।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण को स्पष्ट रूप से बनाए रखा गया है।
- source_word: בְּדָוִיד
  choice: दाऊद को
  rationale: בחר के साथ ב चुने गए व्यक्ति को सूचित करता है; हिन्दी में इसका स्वाभाविक रूप ‘दाऊद को चुना’ है।
- source_word: עַל
  choice: के ऊपर हो
  rationale: यह प्रजा के सम्बन्ध में अधिकार या प्रधानता बताता है। मूल में ‘राजा’ या ‘शासन करना’ स्पष्ट रूप से न होने के कारण उन्हें नहीं जोड़ा गया।
- source_word: עַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल
  rationale: वाचा-सम्बन्धी ‘मेरी प्रजा’ और उसके साथ इस्राएल नाम—दोनों को निकट और स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: וְ
  choice: परन्तु
  rationale: पिछले कथन के निषेध के बाद यह सकारात्मक चुनाव बताता है, इसलिए सन्दर्भगत विरोध को ‘परन्तु’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘मेरा नाम वहाँ रहे’ में मन्दिर-धर्मविज्ञान
  choice: मूल मुहावरे ‘मेरा नाम वहाँ रहे’ को सुरक्षित रखा गया है।
  alternative: ‘मेरी उपस्थिति वहाँ रहे’ अथवा ‘वहाँ मेरी उपासना हो’
  rationale: ‘नाम’ वाचा और मन्दिर से जुड़ी अर्थ-समृद्ध अभिव्यक्ति है। इसका विस्तार करके किसी एक व्याख्या में सीमित करना उचित नहीं होगा।
- issue: ‘मेरी प्रजा इस्राएल के ऊपर हो’ में दाऊद की भूमिका
  choice: अधिकार के सामान्य कथन ‘के ऊपर हो’ को रखा गया है।
  alternative: ‘राजा हो’ अथवा ‘शासन करे’
  rationale: सन्दर्भ राजत्व का है, पर इस पद के इब्रानी पाठ में राजा या शासन के लिए अलग शब्द नहीं है; इसलिए मुख्य पाठ में वह विस्तार नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और मूल-पाठ के निकट रूप अपनाया गया है। ‘मेरा नाम’ और ‘के ऊपर हो’ जैसी अर्थ-समृद्ध इब्रानी अभिव्यक्तियों को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
