  text: then hear from heaven and act[a], and judge your servants, repaying the wicked by bringing his way upon his own head[b], and vindicating the righteous by giving to him according to his righteousness.
translation:
  language: hi
  text: 'तब तू स्वर्ग से सुन, कार्य कर, और अपने सेवकों का न्याय कर: दुष्ट के आचरण को उसी के सिर पर डालकर उसे प्रतिफल दे[a], और धर्मी को सही ठहराकर उसकी धार्मिकता के अनुसार उसे प्रतिफल दे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसका आचरण उसके सिर पर देना।” यह इब्रानी मुहावरा किसी व्यक्ति के आचरण के परिणाम को न्याय के रूप में उसी पर आने को दर्शाता है।'
    reason: cultural_note
  - marker: b
    text: या “धर्मी को धर्मी घोषित करना।” मूल इब्रानी शब्द न्यायालयीन अर्थ में किसी को सही पक्ष में ठहराने या उसके पक्ष में निर्णय देने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמַע מִן הַשָּׁמַיִם
  choice: तू स्वर्ग से सुनकर
  rationale: प्रार्थना में שׁמע केवल ध्वनि सुनने के बजाय ध्यान देकर प्रत्युत्तर देने का भाव रखता है; ‘स्वर्ग से सुन’ इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְעָשִׂיתָ
  choice: कार्रवाई करना
  rationale: व्यापक क्रिया עשׂה यहाँ न्यायिक प्रसंग में परमेश्वर के निर्णायक हस्तक्षेप को दर्शाती है; ‘कार्रवाई करना’ साधारण ‘करना’ से अधिक स्पष्ट है।
- source_word: וְשָׁפַטְתָּ אֶת עֲבָדֶיךָ
  choice: अपने सेवकों का न्याय करना
  rationale: आगे दुष्ट और धर्मी के विपरीत न्यायिक परिणामों के कारण שׁפט का अर्थ यहाँ स्पष्टतः न्याय करना है। עבד के लिए इस प्रार्थनात्मक वाचा-संदर्भ में ‘सेवक’ उपयुक्त है।
- source_word: לְהָשִׁיב לְרָשָׁע
  choice: दुष्ट को उसके किए का फल देना
  rationale: שׁוב का कारक रूप यहाँ प्रतिफल या दंड लौटाने का भाव देता है। हिन्दी में यह अर्थ स्पष्ट करता है, जबकि अगला वाक्यांश मूल चित्र को सुरक्षित रखता है।
- source_word: לָתֵת דַּרְכּוֹ בְּרֹאשׁוֹ
  choice: उसकी चाल उसी के सिर पर लौटाना
  rationale: דרך यहाँ व्यक्ति के आचरण का सूचक है। ‘उसी के सिर पर लौटाना’ कर्म के न्यायिक परिणाम के उसी पर आने की इब्रानी छवि को बनाए रखता है।
- source_word: וּלְהַצְדִּיק צַדִּיק
  choice: धर्मी को सही ठहराना
  rationale: हिफ़ील रूप का न्यायालयीन अर्थ किसी को सही पक्ष में घोषित या सिद्ध करना है। ‘सही ठहराना’ इस भाव को रखता है और बाद की विशिष्ट धर्मवैज्ञानिक शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: לָתֶת לוֹ כְּצִדְקָתוֹ
  choice: उसे उसकी धार्मिकता के अनुसार फल देना
  rationale: ‘के अनुसार’ मूल के अनुपातिक प्रतिफल को सुरक्षित रखता है; ‘फल देना’ हिन्दी में निहित न्यायिक प्रतिदान को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय न्याय का न्यायालयीन अर्थ
  choice: न्याय करना, दुष्ट को प्रतिफल देना और धर्मी को सही ठहराना
  alternative: सामान्य रूप से शासन करना या हस्तक्षेप करना
  rationale: שׁפט, दुष्ट और धर्मी की समानांतर धाराएँ, तथा הצדיק मिलकर स्पष्ट न्यायिक प्रसंग बनाते हैं।
- issue: הצדיק का अनुवाद
  choice: धर्मी को सही ठहराना
  alternative: धर्मी को धर्मी घोषित करना / धर्मी को निर्दोष ठहराना
  rationale: ‘सही ठहराना’ मूल के न्यायालयीन निर्णय को व्यक्त करता है। ‘निर्दोष’ पूर्ण निष्पापता का अतिरिक्त संकेत दे सकता है, जबकि ‘धर्मी घोषित करना’ अधिक शब्दशः पर हिन्दी में कुछ बोझिल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर प्रार्थनात्मक और न्यायिक शैली रखी गई है। निकट संदर्भ में सुलैमान परमेश्वर को एकवचन में संबोधित करता है, इसलिए ‘तू’ का प्रयोग किया गया है; क्रियाओं में आदरार्थी बहुवचन नहीं जोड़ा गया। मूल मुहावरे को मुख्य पाठ में रखा गया और उसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
