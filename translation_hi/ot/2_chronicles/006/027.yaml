base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/027.yaml
  text: then may you hear in heaven and forgive the sin of your servants and of your people Israel[a], when you teach them the good way in which they should walk, and give rain on your land that you have given to your people as an inheritance.
translation:
  language: hi
  text: तब तू स्वर्ग में से सुनकर अपने सेवकों और अपनी प्रजा इस्राएल के पाप को क्षमा कर। जब तू उन्हें वह अच्छा मार्ग सिखाए जिस पर उन्हें चलना चाहिए, तब अपनी उस भूमि पर वर्षा दे जिसे तूने अपनी प्रजा को विरासत के रूप में दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע הַשָּׁמַיִם
  choice: स्वर्ग में सुन
  rationale: इब्रानी में शाब्दिक रूप से ‘स्वर्ग को/स्वर्ग सुन’ है, जो परमेश्वर के अपने स्वर्गीय निवास में सुनने का मुहावरा है। ‘स्वर्ग में सुन’ मूल की संरचना के निकट रहते हुए हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וְסָלַחְתָּ לְחַטַּאת
  choice: पाप क्षमा कर
  rationale: חטאת यहाँ पाप या अपराध को दर्शाता है। ‘पाप क्षमा कर’ सीधा, स्वाभाविक और प्रार्थना के अनुरूप है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: עבד दास या सेवक दोनों अर्थ दे सकता है; यहाँ वाचा-संबंधी प्रार्थना में परमेश्वर की सेवा करने वाली प्रजा के लिए ‘सेवक’ उपयुक्त है।
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: तथा अपनी प्रजा इस्राएल का
  rationale: यह पदबंध ‘सेवकों’ के साथ पाप की क्षमा के संबंध में जुड़ा है। हिन्दी में ‘का’ दोनों को ‘पाप’ से स्वाभाविक रूप से जोड़ता है।
- source_word: כִּי
  choice: जब
  rationale: संदर्भ में यह परमेश्वर के सिखाने और वर्षा देने से जुड़ी परिस्थिति को प्रस्तुत करता है। ‘जब’ प्रवाह को स्पष्ट रखता है; कारणवाचक ‘क्योंकि’ की सम्भावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: תוֹרֵם
  choice: तू उन्हें ... सिखाए
  rationale: ירה का हिफ़ील रूप यहाँ सही मार्ग की शिक्षा देने के अर्थ में है। ‘सिखाए’ आधुनिक हिन्दी में सहज है और शिक्षण का भाव बनाए रखता है।
- source_word: אֶל־הַדֶּרֶךְ הַטּוֹבָה
  choice: वह अच्छा मार्ग
  rationale: यह मूल के नैतिक गुण ‘अच्छा’ और मार्ग-रूपक दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: जिस पर उन्हें चलना चाहिए
  rationale: ‘चलना’ आचरण का बाइबलीय रूपक बनाए रखता है और ‘चाहिए’ अपेक्षित जीवन-पद्धति को व्यक्त करता है।
- source_word: וְנָתַתָּה מָטָר
  choice: वर्षा दे
  rationale: נתן का सीधा अर्थ ‘देना’ है। ‘वर्षा दे’ हिन्दी में प्रार्थना के प्रसंग में स्वाभाविक है और ‘भेज’ की अपेक्षा मूल के अधिक निकट है।
- source_word: עַל־אַרְצְךָ
  choice: अपनी उस भूमि पर
  rationale: मूल का द्वितीय पुरुष संबंधसूचक प्रत्यय भूमि पर परमेश्वर के स्वामित्व को स्पष्ट करता है; ‘उस’ अगले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: אֲשֶׁר נָתַתָּה לְעַמְּךָ לְנַחֲלָה
  choice: जिसे तूने अपनी प्रजा को विरासत के रूप में दिया है
  rationale: נחלה वाचा के अंतर्गत मिली विरासत या स्थायी संपत्ति है। यह अनुवाद भूमि-दान का भाव स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: सुलैमान की प्रार्थना में परमेश्वर की प्रतिक्रिया और כִּי का संबंध
  choice: क्षमा के बाद ‘जब तू उन्हें ... सिखाए’ और फिर वर्षा देने की विनती
  alternative: ‘क्योंकि तू उन्हें अच्छा मार्ग सिखाता है’—कारणवाचक संबंध
  rationale: संदर्भ में सुनना, क्षमा करना, मार्ग सिखाना और वर्षा देना वाचा-पुनर्स्थापन की संयुक्त विनतियाँ हैं। ‘जब’ इस प्रवाह को सहज रखता है, जबकि कारणवाचक सम्भावना को टिप्पणी में स्वीकार किया गया है और किसी विशिष्ट धर्म-सैद्धांतिक क्रम को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू’ का प्रयोग निकटवर्ती प्रार्थना-भाषा और इब्रानी एकवचन के अनुरूप है। वाक्य को दो भागों में बाँटकर सुनने और क्षमा करने की विनती तथा शिक्षा और वर्षा की विनती को साधारण पाठक के लिए स्पष्ट बनाया गया है।
