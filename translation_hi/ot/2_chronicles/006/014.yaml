  text: וַ/יֹּאמַ֗ר יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ אֵין כָּמ֣וֹ/ךָ אֱלֹהִ֔ים בַּ/שָּׁמַ֖יִם וּ/בָ/אָ֑רֶץ שֹׁמֵ֤ר הַ/בְּרִית֙ וְֽ/הַ/חֶ֔סֶד לַ/עֲבָדֶ֕י/ךָ הַ/הֹלְכִ֥ים לְ/פָנֶ֖י/ךָ בְּ/כָל לִבָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/014.yaml
  text: And he said[a], “O Yahweh, God of Israel, there is no God like you in heaven or on earth, keeping the covenant and the steadfast love for your servants who walk before you with all their heart.”
translation:
  language: hi
  text: और उसने कहा, “हे याहवे, इस्राएल के परमेश्वर, स्वर्ग में या पृथ्वी पर आपके समान कोई परमेश्वर नहीं है। आप अपने उन सेवकों के लिए वाचा और अटल प्रेम[a] को निभाते हैं, जो अपने पूरे मन से आपके सामने चलते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवकों के लिए वाचा और वाचा की निष्ठा को निभाते हैं।”
    reason: חֶסֶד का अर्थ इस वाचागत संदर्भ में ‘वाचा की निष्ठा’ भी हो सकता है।
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: और उसने कहा
  rationale: इब्रानी कथात्मक क्रम को सहज हिन्दी में बनाए रखता है और समय-क्रम की अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: אֵין כָּמוֹךָ אֱלֹהִים
  choice: आपके समान कोई परमेश्वर नहीं है
  rationale: याहवे की अतुलनीयता के इब्रानी कथन को स्पष्ट रखता है, बिना ‘देवताओं में’ जैसी सम्भव परन्तु कम स्वाभाविक व्याख्या को मुख्य पाठ में थोपे।
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: स्वर्ग में या पृथ्वी पर
  rationale: नकारात्मक तुलना में ‘या’ हिन्दी में स्वाभाविक है और स्वर्ग तथा पृथ्वी की समग्रता को व्यक्त करता है।
- source_word: שֹׁמֵר
  choice: बनाए रखते हैं
  rationale: कृदन्त द्वारा बताई गई परमेश्वर की निरन्तर और विशेषतापूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבְּרִית
  choice: वाचा
  rationale: परमेश्वर की बंधनकारी प्रतिज्ञा और सम्बन्ध के लिए प्रचलित, अर्थपूर्ण बाइबलीय शब्द।
- source_word: וְהַחֶסֶד
  choice: और अटल प्रेम
  rationale: חֶסֶד में निहित प्रेम, स्थिरता और वाचागत निष्ठा को एक ही संकीर्ण अर्थ में सीमित किए बिना व्यक्त करता है।
- source_word: לַעֲבָדֶיךָ
  choice: अपने उन सेवकों के लिए
  rationale: लाभार्थी सम्बन्ध को स्पष्ट करता है; ‘सेवक’ यहाँ दासत्व से अधिक परमेश्वर के प्रति अधीन सेवा पर बल देता है।
- source_word: הַהֹלְכִים לְפָנֶיךָ
  choice: जो ... आपके सामने चलते हैं
  rationale: परमेश्वर की उपस्थिति में विश्वासयोग्य जीवन के मूल इब्रानी रूपक को सुरक्षित रखता है।
- source_word: בְּכָל לִבָּם
  choice: अपने पूरे मन से
  rationale: सामूहिक एकवचन ‘मन’ के भाव को स्वाभाविक हिन्दी में अविभाजित समर्पण के रूप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: वाचा के सन्दर्भ में חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: करुणा; वाचा की निष्ठा
  rationale: यह रूप प्रेम और स्थायी निष्ठा दोनों को सामने रखता है। चूँकि पद में חֶסֶד ‘वाचा’ के साथ जुड़ा है, वैकल्पिक वाचागत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אֵין כָּמוֹךָ אֱלֹהִים में अतुलनीयता
  choice: आपके समान कोई परमेश्वर नहीं है
  alternative: देवताओं में आपके समान कोई नहीं
  rationale: मुख्य पाठ परमेश्वर की अतुलनीयता को सीधे व्यक्त करता है, जबकि बहुवचन रूप के आधार पर किसी विशिष्ट देवसमूह-सिद्धान्त को अनावश्यक रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, श्रद्धापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर को सम्बोधित करते समय आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘आपके सामने चलते हैं’ जैसे मूल बाइबलीय रूपक को अर्थपूर्ण और समझने योग्य होने के कारण बनाए रखा गया है।
