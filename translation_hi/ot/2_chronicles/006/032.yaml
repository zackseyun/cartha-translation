source:
  edition: WLC
  text: וְ/גַ֣ם אֶל הַ/נָּכְרִ֗י אֲ֠שֶׁר לֹ֥א מֵ/עַמְּ/ךָ֣ יִשְׂרָאֵל֮ הוּא֒ וּ/בָ֣א מֵ/אֶ֣רֶץ רְחוֹקָ֗ה לְמַ֨עַן שִׁמְ/ךָ֤ הַ/גָּדוֹל֙ וְ/יָדְ/ךָ֣ הַ/חֲזָקָ֔ה וּֽ/זְרֽוֹעֲ/ךָ֖ הַ/נְּטוּיָ֑ה וּ/בָ֥אוּ וְ/הִֽתְפַּלְל֖וּ אֶל הַ/בַּ֥יִת הַ/זֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/032.yaml
  text: And also concerning the foreigner[a], who is not from your people Israel, but comes from a distant land because of your great name and your mighty hand and your outstretched arm, when they come and pray toward this house[b],
translation:
  language: hi
  text: और उस परदेशी के विषय में भी, जो तेरी प्रजा इस्राएल का नहीं है और तेरे महान नाम, तेरे शक्तिशाली हाथ और तेरी फैली हुई भुजा के कारण दूर देश से आता है—जब वे[a] आएँ और इस भवन की ओर[b] प्रार्थना करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘परदेशी ... आता है’ एकवचन है, पर इसके बाद ‘वे आएँ और प्रार्थना करें’ बहुवचन आता है। सम्भवतः एक परदेशी को प्रतिनिधि उदाहरण के रूप में रखा गया है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी संबंधबोधक का शाब्दिक अर्थ ‘इस भवन की ओर’ या ‘इस भवन को’ हो सकता है; इस प्रार्थना के प्रसंग में इसका भाव ‘इस भवन की ओर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: परदेशी
  rationale: यह शब्द इस्राएल से बाहर के किसी अन्य जातीय समुदाय के व्यक्ति को दर्शाता है। ‘परदेशी’ आधुनिक हिन्दी में स्वाभाविक है और केवल अपरिचित व्यक्ति का अर्थ देने वाले शब्दों से अधिक ठीक ढंग से इस भेद को बनाए रखता है।
- source_word: אֲשֶׁר לֹא מֵעַמְּךָ יִשְׂרָאֵל הוּא
  choice: जो तेरी प्रजा इस्राएल में से नहीं है
  rationale: यह वाक्यांश परदेशी को इस्राएल से अलग पहचानता है और इस्राएल को परमेश्वर की प्रजा कहने वाली मूल वाचा-संबंधी भाषा बनाए रखता है।
- source_word: וּבָא מֵאֶרֶץ רְחוֹקָה
  choice: बल्कि ... दूर देश से आता है
  rationale: नकारात्मक उपवाक्य के बाद वाव को प्रसंगानुसार विरोधसूचक ‘बल्कि’ से व्यक्त किया गया है। ‘दूर देश’ אֶרֶץ רְחוֹקָה का सरल और सटीक रूप है।
- source_word: לְמַעַן שִׁמְךָ הַגָּדוֹל
  choice: तेरे महान नाम के कारण
  rationale: לְמַעַן यहाँ आने की प्रेरणा या कारण बताता है। ‘महान नाम’ परमेश्वर की ख्याति और प्रकट पहचान से जुड़ी बाइबलीय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וְיָדְךָ הַחֲזָקָה
  choice: तेरे सामर्थी हाथ
  rationale: यह परमेश्वर के सामर्थ्यपूर्ण कार्य की ठोस मानवरूपी छवि है; इसे किसी अमूर्त पद जैसे ‘महान शक्ति’ में नहीं बदला गया।
- source_word: וּזְרֹעֲךָ הַנְּטוּיָה
  choice: तेरी बढ़ाई हुई भुजा
  rationale: यह निर्गमन और वाचा की भाषा में परमेश्वर की सक्रिय शक्ति की परिचित मानवरूपी छवि है। हिन्दी में ‘बढ़ाई हुई भुजा’ उस ठोस चित्र को बनाए रखती है।
- source_word: וּבָאוּ וְהִתְפַּלְלוּ
  choice: जब वे आकर ... प्रार्थना करें
  rationale: मूल पाठ एकवचन परदेशी और ‘आता है’ से बहुवचन क्रियाओं की ओर बदलता है। हिन्दी में ‘वे’ इस वास्तविक संख्या-परिवर्तन को दिखाई देता रहने देता है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर
  rationale: אֶל का मूल अर्थ ‘को/की ओर’ हो सकता है; मन्दिर-प्रार्थना के इस प्रसंग में दिशा का भाव स्वाभाविक है। ‘भवन’ בית को बनाए रखता है और उसे केवल ‘मन्दिर’ कहकर सीमित नहीं करता।
theological_decisions:
- issue: एकवचन ‘परदेशी’ से बहुवचन क्रियाओं की ओर परिवर्तन
  choice: ‘आता है—जब वे आकर ... प्रार्थना करें’ के रूप में संख्या-परिवर्तन बनाए रखा गया
  alternative: ‘जब वह आकर ... प्रार्थना करे’ अथवा ‘जब ऐसे परदेशी आकर ... प्रार्थना करें’
  rationale: इब्रानी पाठ הַנָּכְרִי और וּבָא में एकवचन से וּבָאוּ וְהִתְפַּלְלוּ में बहुवचन की ओर जाता है। सम्भवतः एक परदेशी प्रतिनिधि उदाहरण है; फिर भी अनुवाद ने पाठ के वास्तविक तनाव को चुपचाप एक ही संख्या में नहीं बदला।
- issue: परमेश्वर के सामर्थ्य की मानवरूपी भाषा
  choice: ‘तेरे सामर्थी हाथ और तेरी बढ़ाई हुई भुजा’ को ठोस रूप में रखा गया
  alternative: ‘तेरी महान शक्ति’
  rationale: मूल की हाथ और भुजा वाली भाषा निर्गमन तथा वाचा की धर्मवैचारिक प्रतिध्वनि रखती है। उसे अमूर्त करने से यह साहित्यिक और धर्मवैचारिक बनावट खो जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तेरी’ का प्रयोग प्रार्थना की प्रत्यक्ष संबोधन-शैली के अनुरूप है। वाक्य अगले पद में जारी रहने के कारण अन्त में अल्पविराम रखा गया है। [a] को बहुवचन क्रिया के बाद और [b] को दिशासूचक वाक्यांश के बाद रखा गया है, ताकि दोनों टिप्पणियों का संबंध स्पष्ट रहे।
