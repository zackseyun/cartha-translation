base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/031.yaml
  text: so that they may fear you and walk in your ways all the days that they live on the face of the land that you gave to our fathers[a][b].
translation:
  language: hi
  text: ताकि वे तेरा भय मानें[a] और जब तक वे उस देश में जीवित रहें जिसे तूने हमारे पूर्वजों को दिया था, तब तक तेरे मार्गों पर चलते रहें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे प्रति श्रद्धा रखें” अथवा “तेरे प्रति विस्मयपूर्ण आदर रखें।” यहाँ “भय मानना” आज्ञाकारिता में प्रकट होनेवाली श्रद्धा को भी समेटता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन सभी दिनों में जब वे उस देश की सतह पर जीवित हों।”
    reason: literal_rendering
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: יִירָאוּךָ
  choice: वे तेरा भय मानें
  rationale: हिब्रू ירא परमेश्वर के प्रति भय, श्रद्धा और आज्ञाकारी आदर का व्यापक भाव रखता है; प्रचलित बाइबलीय हिन्दी ‘भय मानना’ इस तनाव को बनाए रखती है।
- source_word: לָלֶכֶת בִּדְרָכֶיךָ
  choice: तेरे मार्गों पर चलते रहें
  rationale: ‘मार्गों पर चलना’ आचरण का परिचित बाइबलीय रूपक है। हिन्दी वाक्य में ‘और’ से जोड़ना हिब्रू क्रियार्थक संज्ञा के आशय को सहजता से व्यक्त करता है, जबकि ‘रहें’ निरंतर आचरण दर्शाता है।
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: जब तक वे ... जीवित रहें, तब तक
  rationale: यह मुहावरेदार हिन्दी में ‘उनके जीवित रहने के सारे दिनों’ अर्थात जीवनभर की अवधि को ठीक से व्यक्त करता है।
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: उस देश में
  rationale: अगला संबंधवाचक उपवाक्य इसे पूर्वजों को दिए गए वाचा के देश के रूप में पहचानता है। ‘में’ आधुनिक हिन्दी में वहाँ रहने का स्वाभाविक स्थानबोध देता है; शब्दशः ‘देश की सतह पर’ असहज होता।
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: जिसे तूने हमारे पूर्वजों को दिया था
  rationale: पूर्ण किए गए दान और इस्राएल के पुरखों के साथ वाचा-संबंध को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर का ‘भय’ और आज्ञाकारिता
  choice: मुख्य पाठ में ‘तेरा भय मानें’ रखा गया है।
  alternative: ‘तेरे प्रति श्रद्धा रखें’ या ‘तेरे विस्मय में रहें’
  rationale: केवल ‘श्रद्धा’ कहने से ירא का भय-संबंधी वजन घट सकता है, जबकि केवल आतंक का अर्थ भी प्रसंग में पर्याप्त नहीं है। आगे का ‘तेरे मार्गों पर चलते रहें’ इसे आज्ञाकारी, श्रद्धापूर्ण भय के रूप में स्पष्ट करता है।
- issue: הָאֲדָמָה का भौगोलिक दायरा
  choice: ‘देश’
  alternative: ‘पृथ्वी’ या ‘भूमि’
  rationale: ‘जिसे तूने हमारे पूर्वजों को दिया’ से आशय प्रतिज्ञात देश है, समस्त पृथ्वी नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक एकवचन संबोधन ‘तू/तेरा’ रखा गया है। वाक्य को हिन्दी की स्वाभाविक काल-रचना के अनुसार पुनर्गठित किया गया है, पर उद्देश्य, जीवनभर की अवधि और प्रतिज्ञात देश का आशय सुरक्षित है।
