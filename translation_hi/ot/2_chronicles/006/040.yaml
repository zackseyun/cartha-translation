source:
  edition: WLC
  text: עַתָּ֣ה אֱלֹהַ֗/י יִֽהְיוּ נָ֤א עֵינֶ֨י/ךָ֙ פְּתֻח֔וֹת וְ/אָזְנֶ֖י/ךָ קַשֻּׁב֑וֹת לִ/תְפִלַּ֖ת הַ/מָּק֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/040.yaml
  text: Now[a], my God, please let your eyes be open and your ears attentive to the prayer of this place.
translation:
  language: hi
  text: अब, हे मेरे परमेश्वर, कृपया तेरी आँखें खुली रहें और तेरे कान इस स्थान की प्रार्थना[a] की ओर लगे रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “इस स्थान में की गई प्रार्थना” या “इस स्थान से की गई प्रार्थना।” इब्रानी में अधिक शाब्दिक रूप से “इस स्थान की प्रार्थना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समय-सूचक और संवाद-संक्रमण पद सुलैमान की समापन विनती आरम्भ करता है; ‘अब’ स्वाभाविक और निकट अनुवाद है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह सीधा संबोधन है; हिन्दी में ‘हे’ संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: יִהְיוּ נָא
  choice: कृपया ... रहें
  rationale: आज्ञार्थक-इच्छार्थक बहुवचन रूप और נָא विनम्र अनुरोध व्यक्त करते हैं। आँखों और कानों की सतत सजगता के इस सन्दर्भ में ‘कृपया ... रहें’ स्वाभाविक है।
- source_word: עֵינֶיךָ פְּתֻחוֹת
  choice: तेरी आँखें खुली रहें
  rationale: परमेश्वर के ध्यान और निगरानी का मूर्त रूपक यथावत रखा गया है; इसे व्याख्यात्मक ढंग से ‘देखता रह’ नहीं बनाया गया।
- source_word: וְאָזְנֶיךָ קַשֻּׁבוֹת
  choice: तेरे कान ... की ओर लगे रहें
  rationale: קַשֻּׁבוֹת सुनने के लिए ध्यान लगाए रहने का भाव देता है। ‘कान ... की ओर लगे रहें’ वर्तमान हिन्दी में स्वाभाविक है और मूल बिंब बनाए रखता है।
- source_word: לִתְפִלַּת
  choice: प्रार्थना की ओर
  rationale: לְ उस प्रार्थना को लक्ष्य बनाता है जिसकी ओर परमेश्वर का ध्यान लगा रहे; हिन्दी वाक्य-विन्यास में ‘की ओर’ इसे स्पष्ट करता है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान की
  rationale: मूल इब्रानी का शाब्दिक सम्बन्ध ‘इस स्थान की प्रार्थना’ है। मुख्य पाठ उसी वास्तविक अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की आँखों और कानों का मानवरूपी वर्णन
  choice: 'ठोस बिंब बनाए रखना: ‘तेरी आँखें खुली रहें और तेरे कान ... की ओर लगे रहें’'
  alternative: 'व्याख्यात्मक रूप: ‘तू ध्यान रख और प्रार्थना सुन’'
  rationale: इब्रानी पाठ परमेश्वर के प्रार्थना पर ध्यान देने को शारीरिक बिंबों द्वारा व्यक्त करता है। बिंब को बनाए रखने से पाठ की साहित्यिक और धर्मवैचारिक बनावट सुरक्षित रहती है, बिना उसे स्थूल शारीरिकता का कथन बनाए।
- issue: ‘इस स्थान की प्रार्थना’ का सम्बन्ध
  choice: मुख्य पाठ में शाब्दिक सम्बन्ध बनाए रखना
  alternative: ‘इस स्थान में की गई प्रार्थना’ या ‘इस स्थान से की गई प्रार्थना’
  rationale: इब्रानी सम्बन्धवाचक रचना यह निर्धारित नहीं करती कि प्रार्थना स्थान में की गई है, वहाँ से उठती है, या उससे सम्बद्ध है। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर के लिए एकवचन आत्मीय सर्वनाम ‘तेरी/तेरे’ रखा गया है, और ‘हे मेरे परमेश्वर’ सीधे संबोधन को स्पष्ट करता है।
