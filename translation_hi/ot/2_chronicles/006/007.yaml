  text: וַ/יְהִ֕י עִם לְבַ֖ב דָּוִ֣יד אָבִ֑/י לִ/בְנ֣וֹת בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/007.yaml
  text: It was in the heart of David my father to build a house for the name of Yahweh[b][a], the God of Israel.
translation:
  language: hi
  text: मेरे पिता दाऊद के मन में इस्राएल के परमेश्वर याहवे के नाम के लिए एक भवन[a] बनाने की इच्छा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक घर’; यहाँ आशय मंदिर से है। ‘नाम के लिए भवन’ मंदिर को परमेश्वर के नाम से संबद्ध स्थान बताने वाली इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ היה का रूप अतीत की स्थिति बताता है। हिन्दी में अलग आरम्भिक संयोजक जोड़ने के बजाय ‘था’ से वही भाव स्वाभाविक रूप में व्यक्त होता है।
- source_word: עִם לְבַב
  choice: के मन में
  rationale: यह मुहावरा किसी के भीतर स्थित विचार या अभिप्राय को दर्शाता है। आधुनिक हिन्दी में ‘मन में’ स्वाभाविक है और मूल के हृदय/अंतरंग भाव को बनाए रखता है।
- source_word: דָּוִיד אָבִי
  choice: मेरे पिता दाऊद
  rationale: हिन्दी में संबंध और नाम का यह क्रम स्वाभाविक है; अर्थ वही रहता है जो शाब्दिक क्रम ‘दाऊद, मेरे पिता’ में है।
- source_word: לִבְנוֹת
  choice: बनाए
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। उद्देश्यवाचक वाक्य में ‘कि वह ... बनाए’ सहज आधुनिक हिन्दी है।
- source_word: בַּיִת
  choice: एक भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है; प्रसंग में यह मंदिर को सूचित करता है। ‘भवन’ मूल रूपक को सुरक्षित रखते हुए धार्मिक इमारत के लिए गरिमापूर्ण और स्पष्ट है।
- source_word: לְשֵׁם
  choice: के नाम के लिए
  rationale: इतिहास-वृत्तांत में यह मंदिर से जुड़ा महत्त्वपूर्ण सूत्र है। ‘नाम’ को बनाए रखने से इसे केवल ‘सम्मान’ जैसे व्याख्यात्मक अर्थ में सीमित नहीं किया जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक संरचना का स्वाभाविक और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: בַּיִת לְשֵׁם יְהוָה में मंदिर और परमेश्वर के ‘नाम’ का संबंध
  choice: याहवे के नाम के लिए एक भवन
  alternative: याहवे का मंदिर / याहवे के सम्मान में एक भवन
  rationale: मूल पाठ भवन को याहवे के ‘नाम’ के लिए बताता है। इस अभिव्यक्ति को बनाए रखने से परमेश्वर की उपस्थिति और उसके नाम के बीच पाठ में निहित संबंध सुरक्षित रहता है तथा उसे केवल संस्था या सम्मान के विचार में नहीं बदला जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे पिता दाऊद’ सामान्य हिन्दी क्रम है। ‘मन में था’ मूल की अंतरंग अभिप्राय-सूचक अभिव्यक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखता है; ‘भवन’ मंदिर के प्रसंग को स्पष्ट करते हुए मूल ‘घर’ से निकट रहता है।
