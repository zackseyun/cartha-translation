id: 2CH.6.24
reference: 2 Chronicles 6:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/אִם יִנָּגֵ֞ף עַמְּ/ךָ֧ יִשְׂרָאֵ֛ל לִ/פְנֵ֥י אוֹיֵ֖ב כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/שָׁ֨בוּ֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ וְ/הִתְפַּֽלְל֧וּ וְ/הִֽתְחַנְּנ֛וּ לְ/פָנֶ֖י/ךָ בַּ/בַּ֥יִת הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/024.yaml
  text: If your people Israel are struck down before an enemy because they have sinned against you[a], and they turn back and confess your name, and pray and plead for favor before you in this house[c][b],
translation:
  language: hi
  text: और यदि आपकी प्रजा इस्राएल आपके विरुद्ध पाप करने के कारण किसी शत्रु के सामने पराजित हो जाए, और फिर लौटकर आपके नाम का अंगीकार करे, और इस भवन में आपके सामने प्रार्थना करे और कृपा की विनती करे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִנָּגֵף
  choice: पराजित हो जाए
  rationale: निफ़अल रूप युद्ध में शत्रु के सामने हारने या मार खाकर परास्त होने का भाव देता है। आधुनिक हिन्दी में ‘पराजित हो जाए’ सैन्य संदर्भ और कर्मवाच्य परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי אוֹיֵב
  choice: किसी शत्रु के सामने
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक रूप है; एकवचन אוֹיֵב यहाँ अनिश्चित अर्थ में है।
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: आपके विरुद्ध पाप करने के कारण
  rationale: כִּי यहाँ पराजय का कारण बताता है और לָךְ को पाप के संदर्भ में स्वाभाविक रूप से ‘आपके विरुद्ध’ कहा गया है।
- source_word: וְשָׁבוּ
  choice: फिर लौटकर
  rationale: שׁוב में लौटने के साथ वाचा-संबंधी पश्चात्ताप का संकेत भी हो सकता है। ‘लौटकर’ मूल बिंब को बनाए रखता है और इसे केवल तकनीकी धार्मिक शब्द तक सीमित नहीं करता।
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: आपके नाम को माने
  rationale: ידה हिफ़ील में स्वीकार करने, अंगीकार करने, स्तुति करने या धन्यवाद देने के अर्थ हो सकते हैं। पाप के बाद लौटने के इस संदर्भ में ‘नाम को मानना’ परमेश्वर को खुले रूप से स्वीकार करने का भाव देता है और मूल की अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: וְהִתְפַּלְלוּ
  choice: प्रार्थना करे
  rationale: हित्पअेल रूप का सामान्य और स्पष्ट हिन्दी अनुवाद। संयुक्त कर्ता ‘प्रजा’ के अनुसार एकवचन क्रिया रखी गई है।
- source_word: וְהִתְחַנְּנוּ
  choice: कृपा की विनती करे
  rationale: חנן के हित्पअेल में अनुग्रह या कृपा पाने के लिए गिड़गिड़ाने का भाव है। यह पदबंध आधुनिक, गरिमापूर्ण और अर्थ-सटीक है।
- source_word: לְפָנֶיךָ
  choice: आपके सामने
  rationale: प्रार्थना में परमेश्वर की उपस्थिति की ओर उन्मुख होने वाला सामान्य इब्रानी मुहावरा निकटता से सुरक्षित है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस भवन में
  rationale: בַּ का साधारण स्थानीय अर्थ ‘में’ है और בַּיִת का ‘भवन’ इस मंदिर-समर्पण संदर्भ में गरिमापूर्ण रहते हुए मूल ‘घर/भवन’ को सुरक्षित रखता है।
theological_decisions:
- issue: וְשָׁבוּ में पश्चात्ताप का भाव
  choice: फिर लौटकर
  alternative: पश्चात्ताप करके
  rationale: संदर्भ में पश्चात्ताप निहित है, पर इब्रानी क्रिया का मूल अर्थ व्यापक रूप से लौटना है। इसलिए अनुवाद मूल बिंब और धर्मवैचारिक तनाव दोनों को बनाए रखता है।
- issue: וְהוֹדוּ אֶת שְׁמֶךָ का बहुअर्थी प्रयोग
  choice: आपके नाम को माने
  alternative: आपके नाम का अंगीकार करे / आपके नाम की स्तुति करे / आपके नाम को धन्यवाद दे
  rationale: ידה का अर्थ संदर्भानुसार स्वीकार, अंगीकार, स्तुति या धन्यवाद हो सकता है। लौटने और प्रार्थना के संदर्भ में ‘नाम को मानना’ स्वीकारोक्ति का भाव देता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्पों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ और सामूहिक एकवचन ‘प्रजा’ के अनुरूप क्रियारूप रखे गए हैं। शैली प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
