  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר֙ דִּבֶּ֣ר בְּ/פִ֔י/ו אֵ֖ת דָּוִ֣יד אָבִ֑/י וּ/בְ/יָדָ֥י/ו מִלֵּ֖א לֵ/אמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/004.yaml
  text: And he said[a], “Blessed be Yahweh, the God of Israel, who spoke with his mouth to David my father and has fulfilled it by his hand, saying,”
translation:
  language: hi
  text: तब उसने कहा, “इस्राएल के परमेश्वर याहवे धन्य हों, जिन्होंने अपने मुँह से मेरे पिता दाऊद से जो कहा था, उसे अपने हाथ से पूरा किया, कहते हुए:[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर के “अपने मुँह से” बोलने और “अपने हाथ से” पूरा करने के बीच जानबूझकर समानांतरता है।
    reason: मूल पाठ में बोलने और कार्य करने के बीच की समानांतरता को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी क्रम में प्रस्तुत करता है और वक्ता के भाषण का आरम्भ स्पष्ट करता है।
- source_word: בָּרוּךְ
  choice: धन्य हैं
  rationale: परमेश्वर के लिए प्रयुक्त स्तुतिपरक आशीर्वचन को गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: דִּבֶּר בְּפִיו
  choice: अपने मुँह से ... जो कहा था
  rationale: ‘मुँह’ का स्पष्ट उल्लेख बनाए रखता है और अगले पदबंध ‘अपने हाथ से’ के साथ जानबूझकर रची गई समानता को सुरक्षित रखता है।
- source_word: אֵת דָּוִיד אָבִי
  choice: मेरे पिता दाऊद से
  rationale: सन्दर्भ में दाऊद को दिव्य वचन का सम्बोधित व्यक्ति समझते हुए हिन्दी में ‘से’ स्वाभाविक है।
- source_word: וּבְיָדוֹ מִלֵּא
  choice: उसे अपने हाथ से पूरा किया
  rationale: अव्यक्त कर्म को हिन्दी में ‘उसे’ से स्पष्ट किया गया है; ‘अपने हाथ से’ परमेश्वर के कथन और कार्य के बीच की समानता बनाए रखता है।
- source_word: לֵאמֹר
  choice: 'उन्होंने कहा था:'
  rationale: अगले पद में आने वाले उद्धरण का स्वाभाविक हिन्दी परिचय; भूतकाल पूर्व में किए गए वचन की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका अधिक प्रत्यक्ष लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: परमेश्वर के ‘मुँह’ और ‘हाथ’ का मानव-सदृश वर्णन
  choice: दोनों बिम्बों को बनाए रखा गया
  alternative: ‘जिसने कहा और पूरा किया’
  rationale: मूल में वचन और कार्य के बीच जानबूझकर समानांतरता है; उसे सरल करके हटाना पाठ की अभिव्यक्ति को दुर्बल करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘धन्य हैं’ स्तुतिपरक शैली को बनाए रखता है; ‘मुँह’ और ‘हाथ’ के ठोस बिम्ब मूल की काव्यात्मक समानता के कारण सुरक्षित रखे गए हैं।
