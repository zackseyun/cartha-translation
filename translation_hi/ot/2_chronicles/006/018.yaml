  text: כִּ֚י הַֽ/אֻמְנָ֔ם יֵשֵׁ֧ב אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם עַל הָ/אָ֑רֶץ הִ֠נֵּה שָׁמַ֜יִם וּ/שְׁמֵ֤י הַ/שָּׁמַ֨יִם֙ לֹ֣א יְכַלְכְּל֔וּ/ךָ אַ֕ף כִּֽי הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/018.yaml
  text: But will God indeed dwell with man on the earth? Behold[a], heaven and the highest heaven cannot contain you, much less this house that I have built.
translation:
  language: hi
  text: पर क्या परमेश्वर सचमुच पृथ्वी पर मनुष्य[क] के साथ वास करेगा? देखो, आकाश और आकाशों का आकाश भी तुझे अपने में समा नहीं सकते; फिर यह भवन, जिसे मैंने बनाया है, तुझे कैसे समा सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: अथवा, “मानवजाति के साथ” या “मनुष्यों के साथ”; हिब्रू में “मनुष्य” शब्द सामान्य रूप से मानव-जाति के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֻמְנָם
  choice: क्या सचमुच
  rationale: विस्मय और अविश्वास से भरे आलंकारिक प्रश्न को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יֵשֵׁב
  choice: वास करेगा
  rationale: यहाँ क्रिया का आशय बैठने से अधिक परमेश्वर की उपस्थितिमय निवास-स्थिति से है।
- source_word: אֶת הָאָדָם
  choice: मनुष्य के साथ
  rationale: אֵת को प्रसंगानुसार संगति-सूचक ‘के साथ’ और प्रतिनिधिक एकवचन אָדָם को ‘मनुष्य’ से व्यक्त किया गया है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: स्थान-सूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाली हिब्रू अभिव्यक्ति की शक्ति को संक्षिप्त, वर्तमान हिन्दी में बनाए रखता है।
- source_word: שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: आकाश, वरन् सबसे ऊँचा आकाश भी
  rationale: ‘आकाशों का आकाश’ वाली हिब्रू परमोत्कर्ष अभिव्यक्ति को समझने योग्य हिन्दी में ऊँचाई के क्रमवर्धन सहित व्यक्त करता है।
- source_word: לֹא יְכַלְכְּלוּךָ
  choice: तुझे समा नहीं सकता
  rationale: स्थान की परमेश्वर को अपने भीतर धारण करने की असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַף כִּי
  choice: फिर ... तो कितना कम
  rationale: यदि आकाश भी परमेश्वर को नहीं समा सकता, तो भवन और भी नहीं—इस अधिक-से-कम तर्क को स्पष्ट रखता है।
- source_word: הַבַּיִת הַזֶּה
  choice: यह भवन
  rationale: ‘भवन’ मूल के ‘घर’ अर्थ और मंदिर-संदर्भ दोनों के लिए गरिमापूर्ण तथा सहज है, बिना सीधे ‘मंदिर’ जोड़ने के।
- source_word: אֲשֶׁר בָּנִיתִי
  choice: जिसे मैंने बनाया है
  rationale: पूर्ण निर्माण और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: परमेश्वर का मनुष्य के साथ पृथ्वी पर वास
  choice: प्रश्न को आलंकारिक और विस्मयपूर्ण रखा गया है
  alternative: इसे सीधा निषेध बनाना कि परमेश्वर मनुष्यों के साथ वास नहीं करता
  rationale: मूल प्रश्न मंदिर में वास्तविक दिव्य उपस्थिति और सृष्टि से परे परमेश्वर की असीमता के तनाव को साथ रखता है; अनुवाद किसी एक पक्ष को समाप्त नहीं करता।
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानवजाति / मनुष्यों
  rationale: ‘मनुष्य’ मूल के एकवचन प्रतिनिधिक रूप को बनाए रखते हुए सामान्य मानवता का बोध करा सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थना के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधित करने में ‘तुझे’ मूल के एकवचन दूसरे पुरुष का निकट और काव्यात्मक स्वर बनाए रखता है।
