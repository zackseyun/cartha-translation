  text: then hear from heaven[a], from the place where you dwell, their prayer and their pleas, and maintain their cause, and forgive your people who have sinned against you.
translation:
  language: hi
  text: तब स्वर्ग से—अपने निवास-स्थान से—उनकी प्रार्थना और उनकी विनतियाँ सुनना, उनके मामले में न्याय करना[a], और अपनी प्रजा को क्षमा करना, जिन्होंने तेरे विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें न्याय दिलाना” अथवा “उनके लिए न्याय करना।” इब्रानी में शाब्दिक रूप से “उनका न्याय करना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: तब ... सुनना
  rationale: पूर्ववर्ती शर्त-संदर्भ की परिणति को व्यक्त करने के लिए ‘तब’ और प्रार्थनात्मक निवेदन के लिए हिंदी में स्वाभाविक आदरसूचक क्रियार्थक रूप ‘सुनना’ रखा गया है।
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתְּךָ
  choice: स्वर्ग से—अपने निवास-स्थान से—
  rationale: दोनों स्रोत-वाक्यांशों को बनाए रखते हुए दूसरा पहले का स्पष्टीकरण है; डैश इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: תְּפִלָּתָם וְאֶת תְּחִנֹּתֵיהֶם
  choice: उनकी प्रार्थना और उनकी विनतियाँ
  rationale: एकवचन ‘प्रार्थना’ और बहुवचन, दया की गंभीर याचनाओं को सूचित करने वाली ‘विनतियाँ’ स्रोत के रूप और अर्थ-भेद को बनाए रखते हैं।
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: उनके मुकदमे का न्याय करना
  rationale: शाब्दिक न्यायिक संरचना ‘उनका न्याय/मुकदमा करना’ को समझने योग्य हिंदी में रखा गया है। यह केवल पक्ष-समर्थन का अर्थ थोपे बिना उनके मामले में न्याय करने का भाव देता है।
- source_word: וְסָלַחְתָּ לְעַמְּךָ
  choice: अपनी प्रजा को क्षमा करना
  rationale: स्रोत के दैवी क्षमा-संदर्भ और संबंधवाचक ‘तेरी प्रजा’ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר חָטְאוּ לָךְ
  choice: जिसने तेरे विरुद्ध पाप किया है
  rationale: ‘प्रजा’ के साथ एकवचन संबंधवाचक रूप स्वाभाविक है; לְ अपराध की दिशा को ‘तेरे विरुद्ध’ से व्यक्त करता है और पूर्ण क्रिया की वर्तमान प्रासंगिकता ‘किया है’ में बनी रहती है।
theological_decisions:
- issue: מִשְׁפָּטָם में न्यायिक भाषा
  choice: उनके मुकदमे का न्याय करना
  alternative: उनका पक्ष बनाए रखना / उन्हें न्याय दिलाना
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘उनका न्याय/मामला करना’ है। चुना हुआ पाठ न्यायिक आयाम और संभावित व्यापकता को बनाए रखता है तथा यह पहले से निर्धारित नहीं करता कि दैवी कार्य केवल पक्ष-समर्थन ही होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। परमेश्वर को संबोधित प्रार्थना में पारंपरिक निकट संबोधन ‘तेरे’ और निवेदनसूचक ‘सुनना/करना’ रखा गया है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
