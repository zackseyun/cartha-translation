base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/015.yaml
  text: You have kept for your servant David my father what you spoke to him[a]; with your mouth you have spoken, and with your hand you have fulfilled it[b], as it is this day.
translation:
  language: hi
  text: तूने अपने सेवक दाऊद, मेरे पिता, के लिए उस बात को निभाया जो तूने उससे कही थी[a]। तूने अपने मुँह से कहा, और अपने हाथ से उसे पूरा किया[b], जैसा आज के दिन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो प्रतिज्ञा तूने उससे की थी।’ इब्रानी में शाब्दिक रूप से, ‘जो तूने उससे कहा था’ है; प्रतिज्ञा का भाव उसके पूरा होने के संदर्भ से निकलता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अपने मुँह से ... और अपने हाथ से।’ यह इब्रानी अभिव्यक्ति परमेश्वर के बोले हुए वचन और उसे कार्यरूप में पूरा करने के बीच संबंध दिखाती है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַרְתָּ
  choice: पूरी की
  rationale: वाचा और प्रतिज्ञा के संदर्भ में क्रिया का अर्थ कही हुई बात को निष्ठापूर्वक निभाना है। हिंदी में ‘बात पूरी की’ स्वाभाविक है और अगले खंड के ‘पूरा किया’ से आशय स्पष्ट होता है।
- source_word: לְעַבְדְּךָ
  choice: अपने सेवक ... के लिए
  rationale: लामेद यहाँ किसी के लिए कही हुई बात को निभाने का भाव देता है। राजकीय प्रार्थना के प्रसंग में עבד के लिए ‘सेवक’ उपयुक्त है।
- source_word: דָּוִיד אָבִי
  choice: मेरे पिता दाऊद
  rationale: यह आधुनिक हिंदी में स्वाभाविक शब्दक्रम है और संबंध को स्पष्ट रखता है।
- source_word: אֵת אֲשֶׁר דִּבַּרְתָּ לוֹ
  choice: वह बात ... जो तूने उससे कही थी
  rationale: यह इब्रानी के ‘जो तूने उससे कहा’ को बनाए रखता है; प्रतिज्ञा का भाव पूर्ति के प्रसंग से समझ में आता है, इसलिए मुख्य पाठ में ‘प्रतिज्ञा’ नहीं जोड़ा गया।
- source_word: וַתְּדַבֵּר בְּפִיךָ
  choice: तूने अपने मुँह से कहा
  rationale: ठोस इब्रानी बिंब को सुरक्षित रखते हुए वचन और कार्य के समानांतर संबंध को बनाए रखता है।
- source_word: וּבְיָדְךָ מִלֵּאתָ
  choice: और अपने हाथ से उसे पूरा किया
  rationale: מלא यहाँ कही हुई बात को कार्यरूप में पूर्ण करने का अर्थ देता है। ‘अपने हाथ से’ प्रभावी कार्य का मूल बिंब सुरक्षित रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज दिखाई दे रहा है
  rationale: यह मुहावरा वर्तमान में प्रत्यक्ष हुई पूर्ति की ओर संकेत करता है। यह हिंदी रूप अर्थ को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए ‘मुँह’ और ‘हाथ’ का मानव-सदृश चित्रण
  choice: ‘अपने मुँह से’ और ‘अपने हाथ से’ दोनों अभिव्यक्तियाँ बनाए रखी गईं
  alternative: इन्हें गतिशील रूप से ‘तूने कहा और उसे कर दिखाया’ अनूदित करना
  rationale: पद जानबूझकर परमेश्वर के बोले हुए वचन और उसके प्रभावी कार्य को समानांतर रखता है। मूल बिंब को बनाए रखना पाठ की अलंकारिक शक्ति सुरक्षित रखता है, बिना देहधारण संबंधी कोई अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज प्रार्थना-रजिस्टर अपनाया गया है। संबोधन में एकवचन आदरपूर्ण बाइबिलीय ‘तू’ रखा गया है। वाक्य में मूल की पुनरुक्ति और ‘मुँह/हाथ’ का समानांतर बिंब जानबूझकर सुरक्षित है।
