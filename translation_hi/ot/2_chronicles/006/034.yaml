base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/034.yaml
  text: If your people go out to battle against their enemies by the way that you send them[a], and they pray to you toward this city that you have chosen and the house that I have built for your name[b],
translation:
  language: hi
  text: यदि तेरे लोग अपने शत्रुओं से युद्ध करने के लिए उस मार्ग से निकलें जिस पर तू उन्हें भेजे, और इस नगर की ओर[a], जिसे तूने चुना है, तथा उस भवन[b] की ओर, जिसे मैंने तेरे नाम के लिए बनाया है, तुझसे प्रार्थना करें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में दिशा अथवा मार्ग की भाषा है; अर्थात् इस नगर की दिशा में उन्मुख होकर।
    reason: lexical_alternative
  - marker: b
    text: यह ‘भवन’ वह मन्दिर है जिसे सुलैमान ने यहोवा के नाम के लिए बनाया था।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: यदि
  rationale: यहाँ सुलैमान की प्रार्थना में एक संभावित परिस्थिति प्रस्तुत की जा रही है; इसलिए शर्तसूचक ‘यदि’ उपयुक्त है।
- source_word: יֵצֵא ... לַמִּלְחָמָה
  choice: युद्ध करने के लिए ... निकलें
  rationale: यह सैन्य प्रसंग में प्रयुक्त स्वाभाविक इब्रानी अभिव्यक्ति है; हिन्दी में यह अनुवाद क्रिया और उद्देश्य दोनों को स्पष्ट रखता है।
- source_word: עַמְּךָ
  choice: तेरे लोग
  rationale: यह परमेश्वर के लोगों के लिए सामूहिक संबोधन है। ‘तेरे लोग’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाली बहुवचन क्रियाओं से मेल खाता है।
- source_word: עַל אֹיְבָיו
  choice: अपने शत्रुओं से
  rationale: इब्रानी में सामूहिक एकवचन प्रत्यय है, पर उसका आशय लोगों के शत्रुओं से है; हिन्दी में ‘अपने’ इस सामूहिक संबंध को सहज रूप से व्यक्त करता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר תִּשְׁלָחֵם
  choice: उस मार्ग से ... जिस पर तू उन्हें भेजे
  rationale: ‘मार्ग’ मूल पाठ की ठोस दिशा अथवा रास्ते की भाषा को बनाए रखता है और भेजने वाले के रूप में परमेश्वर की भूमिका स्पष्ट करता है।
- source_word: וְהִתְפַּלְלוּ אֵלֶיךָ
  choice: तुझसे प्रार्थना करें
  rationale: इब्रानी पूर्वसर्ग אֶל प्रार्थना के संबोधन को दर्शाता है; हिन्दी में ‘तुझसे प्रार्थना करें’ स्पष्ट और स्वाभाविक है।
- source_word: דֶּרֶךְ הָעִיר הַזֹּאת
  choice: इस नगर की ओर
  rationale: प्रार्थना के प्रसंग में דֶּרֶךְ स्थान की दिशा में उन्मुख होने का भाव देता है। ‘की ओर’ उस स्थानिक अर्थ को संक्षेप में बनाए रखता है।
- source_word: אֲשֶׁר בָּחַרְתָּ בָּהּ
  choice: जिसे तूने चुना है
  rationale: यह नगर के परमेश्वर द्वारा चुने जाने को व्यक्त करता है और पूर्ण किए गए चुनाव की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: וְהַבַּיִת
  choice: तथा इस भवन
  rationale: בַּיִת का सीधा अर्थ ‘घर/भवन’ है और यहाँ संदर्भतः मन्दिर अभिप्रेत है। ‘भवन’ मूल रूपक को रखता है, जबकि टिप्पणी संदर्भ स्पष्ट करती है।
- source_word: אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: जिसे मैंने तेरे नाम के लिए बनाया है
  rationale: यह सुलैमान द्वारा बनाए गए भवन के परमेश्वर के नाम के लिए समर्पण की मूल भाषा को सीधे बनाए रखता है।
theological_decisions:
- issue: यरूशलेम और मन्दिर की ओर उन्मुख होकर प्रार्थना करना
  choice: ‘इस नगर की ओर ... तथा इस भवन की ओर’ के रूप में ठोस दिशात्मक भाषा बनाए रखी गई है।
  alternative: इसे ‘इस नगर को ध्यान में रखकर’ जैसे अधिक अमूर्त रूप में अनूदित करना या ‘अपना मुख ... की ओर करके’ कहना।
  rationale: मूल पाठ प्रार्थना की वास्तविक स्थानिक दिशा पर बल देता है। ‘मुख’ जोड़ने से आशय स्पष्ट हो सकता था, पर वह शब्द मूल में प्रत्यक्ष नहीं है; इसलिए दिशात्मकता को बिना अतिरिक्त विवरण के रखा गया है।
- issue: ‘भवन’ का अभिप्राय
  choice: मुख्य पाठ में ‘भवन’ रखा गया है और पादटिप्पणी में मन्दिर की पहचान स्पष्ट की गई है।
  alternative: मुख्य पाठ में सीधे ‘मन्दिर’ लिखना।
  rationale: इससे इब्रानी בַּיִת की ‘घर/भवन’ वाली धार्मिक प्रतिध्वनि बनी रहती है, जबकि पाठक को ऐतिहासिक संदर्भ भी मिल जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, सहज और गरिमापूर्ण शैली रखी गई है। परमेश्वर को संबोधित करते हुए निकटता और मूल की एकवचन संबोधन-शैली बनाए रखने के लिए ‘तू/तेरे’ का प्रयोग किया गया है। वाक्य अगले पद में जारी रहने वाली शर्त और निवेदन का भाग है, इसलिए अंत में अल्पविराम रखा गया है।
