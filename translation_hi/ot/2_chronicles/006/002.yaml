reference: 2 Chronicles 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/אֲנִ֛י בָּנִ֥יתִי בֵית זְבֻ֖ל לָ֑/ךְ וּ/מָכ֥וֹן לְ/שִׁבְתְּ/ךָ֖ עוֹלָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/002.yaml
  text: But I have built for you a lofty house, a place for you to dwell forever.
translation:
  language: hi
  text: परन्तु मैंने आपके लिए एक ऊँचा भवन बनाया है, और आपके सदा निवास के लिए एक स्थिर स्थान बनाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית זְבֻל
  choice: भव्य भवन
  rationale: זְבֻל यहाँ ऊँचे, उत्कृष्ट या राजसी निवास का बोध कराता है। ‘भव्य भवन’ आधुनिक हिन्दी में इस गरिमा को स्वाभाविक रूप से व्यक्त करता है, बिना शब्द को अनावश्यक रूप से केवल भौतिक ऊँचाई तक सीमित किए।
- source_word: מָכוֹן
  choice: स्थायी स्थान
  rationale: מָכוֹן किसी स्थापित, निर्धारित या दृढ़ स्थान को दर्शाता है। ‘स्थायी स्थान’ अगले पदबंध ‘सदा निवास’ के साथ उसके स्थायित्व के भाव को स्पष्ट करता है।
- source_word: לְשִׁבְתְּךָ עוֹלָמִים
  choice: आपके सदा निवास करने के लिए
  rationale: शाब्दिक अर्थ ‘आपके युगों तक रहने के लिए’ है; हिन्दी में ‘सदा निवास करने के लिए’ अनन्त स्थायित्व का भाव सहज और गरिमापूर्ण ढंग से देता है।
- source_word: לָךְ / לְשִׁבְתְּךָ
  choice: आपके / आपके
  rationale: ईश्वर को संबोधित करते हुए आदरसूचक ‘आप’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: क्या मंदिर को परमेश्वर का शाब्दिक और सीमित निवास बताया जाए
  choice: मूल पद की साहसपूर्ण मंदिर-निवास भाषा को बनाए रखा गया
  alternative: इसे केवल परमेश्वर की उपस्थिति या नाम का प्रतीकात्मक स्थान कहना
  rationale: इब्रानी पाठ सीधे ‘आपके निवास करने’ की बात करता है। अगले पदों में निहित धार्मिक तनाव को इस पद में व्याख्यात्मक शब्द जोड़कर पहले से हल नहीं किया गया।
- issue: עוֹלָמִים का कालगत बल
  choice: सदा
  alternative: युगों तक
  rationale: ‘सदा’ सामान्य हिन्दी में मूल के दीर्घकालिक/अनन्त भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है; अवधि की दार्शनिक सीमा को अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप। ‘परन्तु’ पूर्ववर्ती कथन से विरोध दर्शाता है। ‘भव्य भवन’ अंग्रेज़ी consultation layer के ‘lofty house’ और इब्रानी בֵּית זְבֻל की गरिमा को व्यक्त करता है; ‘स्थायी स्थान’ מָכוֹן की स्थापितता को उभारता है।
