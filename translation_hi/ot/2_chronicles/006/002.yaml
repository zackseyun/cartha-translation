    rationale: ‘भव्य’ primarily means grand or splendid; the Hebrew expression denotes a lofty/elevated dwelling. ‘ऊँचा भवन’ more directly preserves the source image and agrees with the English audit trail’s ‘lofty house.’
  - severity: low
