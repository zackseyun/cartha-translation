translation:
  language: hi
  text: तब तू स्वर्ग से उनकी प्रार्थना और अनुग्रह के लिए उनकी विनती सुनना, और उनके पक्ष में न्याय करना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें न्याय दिलाना” अथवा “उनका न्याय करना।” हिब्रू में शाब्दिक रूप से “उनका न्याय करना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: तब तू ... सुनना
  rationale: यह रूप प्रार्थना के संदर्भ में परमेश्वर से की गई विनती व्यक्त करता है। ‘तब’ पिछले पद की शर्त से परिणाम का संबंध स्पष्ट करता है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: हिब्रू में रूप बहुवचन है, पर इस प्रार्थना-सूत्र में आधुनिक हिन्दी का स्वाभाविक मुहावरा ‘स्वर्ग से’ है।
- source_word: תְּפִלָּתָם
  choice: उनकी प्रार्थना
  rationale: सामूहिक एकवचन को हिन्दी में स्वाभाविक रूप से ‘उनकी प्रार्थना’ कहा गया है।
- source_word: תְּחִנָּתָם
  choice: अनुग्रह की उनकी विनती
  rationale: शब्द दया या कृपा पाने के लिए की गई गंभीर विनती को सूचित करता है; यह चयन उस भाव को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: וְעָשִׂיתָ מִשְׁפָּטָם
  choice: उनके पक्ष में न्याय करना
  rationale: शाब्दिक भाव ‘उनका न्याय करना’ है। सन्दर्भ में इसका अर्थ उनकी ओर से न्यायिक कार्रवाई करना या उनके उचित पक्ष को सिद्ध करना है; चुना हुआ रूप कानूनी भाव को बनाए रखते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: प्रार्थना के उत्तर में परमेश्वर की न्यायिक कार्रवाई
  choice: उनके पक्ष में न्याय करना
  alternative: उनका न्याय करना; उन्हें न्याय दिलाना; उनके मुकदमे का समर्थन करना
  rationale: מִשְׁפָּט न्याय, निर्णय, अधिकार या मुकदमे का पक्ष सूचित कर सकता है। अनुवाद परमेश्वर द्वारा उनके हित में न्याय करने का भाव रखता है, पर यह तय नहीं करता कि कार्रवाई का ठीक स्वरूप क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रार्थना के गरिमापूर्ण संबोधन के लिए ‘तू’ और विनतीसूचक ‘सुनना/करना’ रखा गया है। न्यायिक मुहावरे को सहज बनाने के साथ मूल की अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
