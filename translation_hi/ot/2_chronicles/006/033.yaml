source:
  edition: WLC
  text: וְ/אַתָּ֞ה תִּשְׁמַ֤ע מִן הַ/שָּׁמַ֨יִם֙ מִ/מְּכ֣וֹן שִׁבְתֶּ֔/ךָ וְ/עָשִׂ֕יתָ כְּ/כֹ֛ל אֲשֶׁר יִקְרָ֥א אֵלֶ֖י/ךָ הַ/נָּכְרִ֑י לְמַ֣עַן יֵדְעוּ֩ כָל עַמֵּ֨י הָ/אָ֜רֶץ אֶת שְׁמֶ֗/ךָ וּ/לְ/יִרְאָ֤ה אֹֽתְ/ךָ֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל וְ/לָ/דַ֕עַת כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל הַ/בַּ֥יִת הַ/זֶּ֖ה אֲשֶׁ֥ר בָּנִֽיתִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/033.yaml
  text: then hear from heaven[a], from your dwelling place, and do according to all that the foreigner calls to you for, so that all the peoples of the earth may know your name and fear you, as your people Israel do, and may know that your name is called upon this house that I have built.
translation:
  language: hi
  text: तब तू स्वर्ग से, अपने निवास-स्थान से सुनना और वह सब करना जिसके लिए वह विदेशी तुझे पुकारे, ताकि पृथ्वी के सभी राष्ट्र तेरा नाम जानें और तेरी प्रजा इस्राएल के समान तेरा भय मानें, और यह भी जानें कि जिस भवन को मैंने बनाया है, उस पर तेरा नाम पुकारा जाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “यह भवन तेरा नाम धारण करता है” या “यह भवन तेरे नाम से संबद्ध है।” इब्रानी मुहावरे का शाब्दिक रूप है, “तेरा नाम इस भवन पर पुकारा जाता है।”
    reason: इब्रानी मुहावरे के शाब्दिक रूप को बनाए रखते हुए उसका स्वाभाविक आशय स्पष्ट करना।
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: सुनना
  rationale: प्रार्थना के प्रसंग में यह केवल ध्वनि सुनने नहीं, बल्कि ध्यान देकर उत्तर देने का भाव रखता है; आगे आने वाला “करना” इस आशय को स्पष्ट करता है।
- source_word: מִן הַשָּׁמַיִם מִמְּכוֹן שִׁבְתֶּךָ
  choice: स्वर्ग में, अपने निवास-स्थान से
  rationale: “स्वर्ग” को परमेश्वर के निवास-स्थान के रूप में रखते हुए मंदिर और स्वर्ग के बीच मूल पाठ का भेद सुरक्षित रहता है।
- source_word: וְעָשִׂיתָ
  choice: करना
  rationale: मूल क्रिया व्यापक है और प्रार्थना के उत्तर में परमेश्वर की कार्रवाई को अनिर्दिष्ट रखती है।
- source_word: כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ
  choice: वह सब करना जिसके लिए ... तुझे पुकारे
  rationale: यह विनती के लिए परमेश्वर को पुकारने का भाव रखता है, पर उसे केवल “माँगना” या “प्रार्थना करना” कहकर संकुचित नहीं करता।
- source_word: הַנָּכְרִי
  choice: विदेशी
  rationale: यह ऐसे व्यक्ति को दर्शाता है जो इस्राएली समुदाय से नहीं है; आधुनिक हिन्दी में “विदेशी” स्पष्ट और सहज है।
- source_word: כָל עַמֵּי הָאָרֶץ
  choice: पृथ्वी के सब लोग
  rationale: यहाँ सार्वभौमिक संदर्भ है; “पृथ्वी” किसी एक देश के बजाय समस्त जगत को व्यक्त करती है। “सब लोग” विभिन्न जनसमूहों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּלְיִרְאָה אֹתְךָ
  choice: तेरा भय मानें
  rationale: यह परमेश्वर के प्रति श्रद्धायुक्त भय का बाइबलीय भाव बनाए रखता है और उसे केवल सम्मान तक सीमित नहीं करता।
- source_word: כִּי שִׁמְךָ נִקְרָא עַל הַבַּיִת הַזֶּה
  choice: यह भवन ... तेरे नाम से कहलाता है
  rationale: यह हिन्दी में स्वाभाविक ढंग से भवन के परमेश्वर के नाम से संबद्ध होने का अर्थ देता है; मूल इब्रानी मुहावरे का अधिक शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के निवास और मंदिर के संबंध को कैसे व्यक्त किया जाए
  choice: “स्वर्ग में, अपने निवास-स्थान से” और पृथ्वी पर “यह भवन” दोनों को अलग-अलग बनाए रखा गया है।
  alternative: “अपनी स्वर्गीय उपस्थिति से” जैसे व्याख्यात्मक शब्दों का प्रयोग।
  rationale: मूल पाठ परमेश्वर का निवास स्वर्ग में बताता है, जबकि मंदिर को उसके नाम से संबद्ध करता है; अनुवाद इस तनाव को व्यवस्थित धर्मशास्त्रीय व्याख्या से नहीं मिटाता।
- issue: राष्ट्रों द्वारा परमेश्वर का भय मानना
  choice: “तेरा भय मानें”
  alternative: “तेरा आदर करें” या “तेरी श्रद्धा करें”
  rationale: मूल ירא में श्रद्धा और भय दोनों का भार है; “भय मानना” उस धर्मशास्त्रीय गहराई को सुरक्षित रखता है।
- issue: भवन पर परमेश्वर का नाम पुकारे जाने का इब्रानी मुहावरा
  choice: मुख्य पाठ में “तेरे नाम से कहलाता है” और पाद-टिप्पणी में शाब्दिक रूप।
  alternative: मुख्य पाठ में “इस भवन पर तेरा नाम पुकारा जाता है।”
  rationale: शाब्दिक रूप हिन्दी में यह भ्रम पैदा कर सकता है कि भवन में केवल परमेश्वर का नाम उच्चारित किया जाता है। चुना गया रूप भवन के उसके नाम को धारण करने या उससे संबद्ध होने का मुहावरेदार अर्थ देता है, और पाद-टिप्पणी स्रोत-रूप को पारदर्शी रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रार्थना की शैली के अनुरूप परमेश्वर के लिए निकटवर्ती एकवचन “तू/तेरा/तुझे” और आज्ञार्थक-अनुरोधात्मक क्रियारूप “सुनना” तथा “करना” प्रयुक्त हुए हैं।
