id: 2CH.6.10
reference: 2 Chronicles 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣קֶם יְהוָ֔ה אֶת דְּבָר֖/וֹ אֲשֶׁ֣ר דִּבֵּ֑ר וָ/אָק֡וּם תַּחַת֩ דָּוִ֨יד אָבִ֜/י וָ/אֵשֵׁ֣ב עַל כִּסֵּ֣א יִשְׂרָאֵ֗ל כַּ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וָ/אֶבְנֶ֣ה הַ/בַּ֔יִת לְ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/010.yaml
  text: And Yahweh has fulfilled his word that he spoke[a], and I have risen in the place of David my father and sit on the throne of Israel, as Yahweh spoke, and I have built the house for the name of Yahweh[b], the God of Israel.
translation:
  language: hi
  text: और यहोवा ने अपना वह वचन पूरा किया है जो उसने कहा था[a]। मैं अपने पिता दाऊद के स्थान पर उठा और इस्राएल के सिंहासन पर बैठा हूँ, जैसा यहोवा ने कहा था; और मैंने इस्राएल के परमेश्वर यहोवा के नाम के लिए यह भवन बनाया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “अपने वचन को स्थिर किया है” या “अपने वचन को कार्यान्वित किया है” भी हो सकता है। इब्रानी क्रिया का शाब्दिक भाव है, “अपने वचन को खड़ा किया है।”
    reason: lexical_alternative
  - marker: b
    text: “यह भवन” मन्दिर को दर्शाता है। इब्रानी में वाचा से जुड़ी अभिव्यक्ति “यहोवा के नाम के लिए भवन” बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: पूरा किया है
  rationale: हिफ़ील रूप का शाब्दिक भाव किसी वचन को ‘स्थिर करना’ है; इस प्रसंग में इसका स्वाभाविक अर्थ कहे हुए वचन को पूरा करना है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: דְּבָרוֹ אֲשֶׁר דִּבֵּר
  choice: अपना वह वचन ... जो उसने कहा था
  rationale: ‘वचन’ मूल के דָּבָר को सुरक्षित रखता है और ‘कहा था’ समर्पण के वर्तमान अवसर से पहले दिए गए वचन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאָקוּם תַּחַת דָּוִיד אָבִי
  choice: मैं अपने पिता दाऊद के स्थान पर उठा
  rationale: ‘उठा’ पहले क्रियापद קום की शब्दगत प्रतिध्वनि बनाए रखता है; ‘के स्थान पर’ राजवंशीय उत्तराधिकार का अर्थ देता है।
- source_word: וָאֵשֵׁב עַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठा हूँ
  rationale: पूर्ण हुई राजगद्दी-प्राप्ति और उसकी वर्तमान परिणति—सुलैमान का सिंहासन पर होना—दोनों को व्यक्त करता है।
- source_word: וָאֶבְנֶה הַבַּיִת
  choice: मैंने ... यह भवन बनाया है
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ संकेतित मन्दिर को स्पष्ट करने के लिए ‘यह भवन’ स्वाभाविक है, जबकि मूल रूपक को ‘मन्दिर’ से प्रतिस्थापित नहीं किया गया।
- source_word: לְשֵׁם יְהוָה
  choice: यहोवा के नाम के लिए
  rationale: यह जानबूझकर मूल वाचागत अभिव्यक्ति सुरक्षित रखता है और भवन को स्वयं परमेश्वर को समेटने वाला स्थान कहने से बचता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम है; उसे उपाधि से बदलने के बजाय हिन्दी का परिचित लिप्यंतरण रखा गया है।
- issue: הַבַּיִת का मन्दिर-संदर्भ
  choice: यह भवन
  alternative: मन्दिर
  rationale: संदर्भ में भवन मन्दिर है, पर मूल का ‘भवन/घर’ शब्द और ‘नाम के लिए भवन’ की धर्मवैचारिक अभिव्यक्ति सुरक्षित रखी गई है।
- issue: לְשֵׁם יְהוָה की अभिव्यक्ति
  choice: यहोवा के नाम के लिए
  alternative: यहोवा के सम्मान में
  rationale: ‘नाम के लिए’ मूल की विशिष्ट और अर्थपूर्ण भाषा को बनाए रखता है; ‘सम्मान में’ उसका केवल एक व्याख्यात्मक पक्ष व्यक्त करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘वचन’, ‘सिंहासन’ और ‘नाम के लिए’ जैसी बाइबलीय अभिव्यक्तियाँ अर्थगत महत्त्व के कारण सुरक्षित हैं; वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए दो वाक्यों में बाँटा गया है।
