base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/020.yaml
  text: that your eyes may be open toward this house day and night[a], toward the place where you said you would put your name[b], to hear the prayer that your servant prays toward this place.
translation:
  language: hi
  text: कि तेरी आँखें इस भवन की ओर दिन-रात खुली रहें[a]—उस स्थान की ओर, जहाँ तूने कहा था कि अपना नाम रखेगा[b]—और तू उस प्रार्थना को सुने जो तेरा दास इस स्थान की ओर करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा ध्यान इस भवन की ओर दिन-रात लगा रहे।” इब्रानी में शाब्दिक रूप से “तेरी आँखें खुली रहें” है, जो सजग ध्यान का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “अपना नाम वहाँ रखना” मंदिर से परमेश्वर के चुने हुए संबंध को दर्शाने वाला मुहावरा है; इसका अर्थ यह नहीं कि परमेश्वर सचमुच उसी स्थान में सीमित है।
    reason: cultural_note
lexical_decisions:
- source_word: לִהְיוֹת עֵינֶיךָ פְתֻחוֹת
  choice: कि तेरी आँखें ... खुली रहें
  rationale: प्रार्थनात्मक संदर्भ में לִהְיוֹת उद्देश्य/कामना व्यक्त करता है। शाब्दिक शारीरिक बिंब को बनाए रखते हुए हिन्दी में स्वाभाविक विनती के रूप में प्रस्तुत किया गया है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर
  rationale: אֶל की दिशात्मकता को ‘की ओर’ व्यक्त करता है। मंदिर के लिए ‘भवन’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: मूल समाहारात्मक अभिव्यक्ति को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है; इसका आशय निरंतर ध्यान से है।
- source_word: אֲשֶׁר אָמַרְתָּ לָשׂוּם שִׁמְךָ שָׁם
  choice: जिसके विषय में तूने कहा था कि तू अपना नाम वहाँ रखेगा
  rationale: ‘नाम रखना’ की वाचा-मंदिर संबंधी मूल अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: לִשְׁמוֹעַ אֶל הַתְּפִלָּה
  choice: और तू उस प्रार्थना को सुने
  rationale: उद्देश्यसूचक infinitive को हिन्दी में प्रार्थनात्मक समन्वय के रूप में देना अधिक स्वाभाविक है और परमेश्वर द्वारा प्रार्थना सुनने की बाइबलीय अभिव्यक्ति को बनाए रखता है।
- source_word: עַבְדְּךָ
  choice: तेरा दास
  rationale: परमेश्वर को संबोधित विनती में यह विनम्र सेवा और अधीनता का पारंपरिक पद है; ‘दास’ इस धार्मिक प्रयोग में स्वाभाविक है।
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: इस स्थान की ओर मुँह करके
  rationale: मूल में दिशात्मक ‘इस स्थान की ओर’ है। हिन्दी में प्रार्थना की दिशा स्पष्ट और स्वाभाविक करने के लिए ‘मुँह करके’ जोड़ा गया है, बिना स्थान को प्रार्थना का प्राप्तकर्ता बनाए।
theological_decisions:
- issue: 'परमेश्वर के लिए मानवरूपी भाषा: ‘तेरी आँखें ... खुली रहें’'
  choice: मूल मानवरूपी बिंब को मुख्य पाठ में बनाए रखना
  alternative: ‘तू इस भवन की ओर ध्यान लगाए रखे’
  rationale: इब्रानी पाठ परमेश्वर के सजग ध्यान को आँखों के ठोस बिंब द्वारा व्यक्त करता है। इसे बनाए रखना पाठ की काव्यात्मक और धर्मवैचारिक बनावट को सुरक्षित रखता है।
- issue: मंदिर के संबंध में ‘अपना नाम वहाँ रखना’
  choice: मुहावरे को यथावत रखना
  alternative: ‘अपनी उपस्थिति वहाँ स्थापित करना’
  rationale: ‘नाम रखना’ परमेश्वर के चुने हुए संबंध और अधिकार की सघन मंदिर-संबंधी अभिव्यक्ति है। इसे ‘उपस्थिति’ कहकर विस्तृत करना मूल की अर्थगत गुंजाइश को अनावश्यक रूप से सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू/तेरी/तेरा’ प्रयोग किया गया है, जो बाइबलीय हिन्दी की प्रार्थना-परंपरा में स्वाभाविक है। विराम-चिह्नों से बीच की स्थान-संबंधी उपवाक्य-रचना स्पष्ट की गई है।
