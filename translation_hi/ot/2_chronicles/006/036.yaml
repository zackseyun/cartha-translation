  terminology: “मनुष्य” naturally conveys generic אָדָם in modern Hindi; “पाप,” “क्रोधित,” “शत्रु के हाथ में सौंप दें,” and “बंदी” fit the register and source sense. No footnote is needed in Hindi, since “मनुष्य” is already an idiomatic generic term and no ambiguity requiring annotation remains.
