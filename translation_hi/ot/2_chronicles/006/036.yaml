id: 2CH.6.36
reference: 2 Chronicles 6:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י יֶחֶטְאוּ לָ֗/ךְ כִּ֣י אֵ֤ין אָדָם֙ אֲשֶׁ֣ר לֹא יֶחֱטָ֔א וְ/אָנַפְתָּ֣ בָ֔/ם וּ/נְתַתָּ֖/ם לִ/פְנֵ֣י אוֹיֵ֑ב וְ/שָׁב֧וּ/ם שׁוֹבֵי/הֶ֛ם אֶל אֶ֥רֶץ רְחוֹקָ֖ה א֥וֹ קְרוֹבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/036.yaml
  text: When they sin against you—for there is no one who does not sin—and you are angry with them and give them over to an enemy[a], and their captors carry them away to a land far or near,
translation:
  language: hi
  text: जब वे आपके विरुद्ध पाप करें—क्योंकि कोई मनुष्य ऐसा नहीं जो पाप न करता हो—और आप उन पर क्रोधित होकर उन्हें किसी शत्रु के हाथ में सौंप दें, और उनके बंदी बनाने वाले उन्हें दूर या पास के किसी देश में ले जाएँ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: जब वे आपके विरुद्ध पाप करें
  rationale: आरंभिक כִּי यहाँ प्रार्थना के भीतर एक संभावित परिस्थिति प्रस्तुत करता है; साथ का कथन मानव पाप की वास्तविकता मानता है, इसलिए हिंदी में ‘जब’ स्वाभाविक है। חטא के साथ ל संबंधपरक अपराध को दर्शाता है, अतः ‘आपके विरुद्ध’ उपयुक्त है।
- source_word: אֵין אָדָם אֲשֶׁר לֹא יֶחֱטָא
  choice: कोई मनुष्य ऐसा नहीं जो पाप न करता हो
  rationale: אָדָם यहाँ समस्त मानवजाति के किसी भी सदस्य के लिए सामान्य एकवचन है। ‘कोई मनुष्य’ उसके मानवीय और प्रतिनिधिक अर्थ को स्वाभाविक आधुनिक हिंदी में स्पष्ट रखता है।
- source_word: וְאָנַפְתָּ בָם
  choice: और आप उन पर क्रोधित होकर
  rationale: אנף क्रोध को व्यक्त करता है। ‘क्रोधित होकर’ आगामी क्रिया से इसका स्वाभाविक हिंदी संबंध दिखाता है, बिना क्रोध की तीव्रता बढ़ाए।
- source_word: וּנְתַתָּם לִפְנֵי אוֹיֵב
  choice: उन्हें किसी शत्रु के हाथ में सौंप दें
  rationale: נתן לפני אויב का आशय शत्रु के अधिकार में कर देना है। ‘हाथ में सौंप दें’ हिंदी का स्वाभाविक मुहावरा है; अनिश्चित एकवचन אוֹיֵב के लिए ‘किसी शत्रु’ रखा गया है।
- source_word: וְשָׁבוּם שׁוֹבֵיהֶם
  choice: और उन्हें बंदी बनानेवाले उन्हें … ले जाएँ
  rationale: मूल में cognate verb और participle द्वारा बंदी बनाकर ले जाने का भाव है। हिंदी में अनावश्यक पुनरुक्ति से बचते हुए ‘बंदी बनानेवाले … ले जाएँ’ कर्ता और निर्वासन दोनों को बनाए रखता है।
- source_word: אֶל אֶרֶץ רְחוֹקָה אוֹ קְרוֹבָה
  choice: दूर या पास के किसी देश में
  rationale: यह दूरी का सीधा विरोध है और दूरी किस स्थान से है, इसे मूल की तरह अनिर्दिष्ट छोड़ता है।
theological_decisions:
- issue: सार्वभौमिक मानवीय पापशीलता के कथन में सामान्य אָדָם
  choice: कोई मनुष्य ऐसा नहीं जो पाप न करता हो
  alternative: ऐसा कोई नहीं जो पाप न करता हो
  rationale: ‘मनुष्य’ मूल के सामान्य एकवचन אָדָם को स्पष्ट रूप से दर्शाता है और आधुनिक हिंदी में स्त्री-पुरुष सभी मनुष्यों के लिए स्वाभाविक सामान्य शब्द है। इससे कथन की सार्वभौमिकता बनी रहती है।
- issue: ईश्वर का क्रोध और शत्रु को सौंपना
  choice: आप उन पर क्रोधित होकर उन्हें किसी शत्रु के हाथ में सौंप दें
  alternative: आप उनसे क्रोधित हों और उन्हें किसी शत्रु के सामने दे दें
  rationale: पहला रूप दोनों क्रियाओं का संबंध स्वाभाविक हिंदी में व्यक्त करता है, पर क्रोध को केवल भाव या शत्रु को सौंपने को मात्र अनुमति कहकर धार्मिक तनाव कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक संदर्भ के अनुरूप है। परमेश्वर के लिए आदरसूचक ‘आप’ और बहुवचन क्रियारूप रखे गए हैं। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
