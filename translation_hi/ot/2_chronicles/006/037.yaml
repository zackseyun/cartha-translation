revisions:
- from: और जिस देश में वे बंदी बनाकर ले जाए गए हों, वहाँ यदि वे इस बात को अपने मन में फिर ले आएँ[a], और लौटकर अपनी बँधुआई के देश में तुमसे गिड़गिड़ाकर कहें, ‘हमने पाप किया है, हमने टेढ़े काम किए हैं और हमने दुष्टता की है,’
  to: और यदि वे उस देश में, जहाँ उन्हें बंदी बनाकर ले जाया गया हो, अपने मन में विचार करें[a], और लौटें तथा अपने बंदीवास के देश में तुमसे विनती करके कहें, ‘हमने पाप किया है, हमने कुटिलता की है और हमने दुष्टता की है,’
  rationale: The revision corrects the captivity terminology, removes an added object from the Hebrew idiom, and improves the naturalness and moral force of the confession. “लौटें” deliberately preserves the source term’s open sense of returning/turning back; the text does not resolve it as a narrowly theological term.
