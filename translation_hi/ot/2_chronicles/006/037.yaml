  text: וְ/הֵשִׁ֨יבוּ֙ אֶל לְבָבָ֔/ם בָּ/אָ֖רֶץ אֲשֶׁ֣ר נִשְׁבּוּ שָׁ֑ם וְ/שָׁ֣בוּ וְ/הִֽתְחַנְּנ֣וּ אֵלֶ֗י/ךָ בְּ/אֶ֤רֶץ שִׁבְיָ/ם֙ לֵ/אמֹ֔ר חָטָ֥אנוּ הֶעֱוִ֖ינוּ וְ/רָשָֽׁעְנוּ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/037.yaml
  text: and if they come to their senses in the land where they were taken captive[a], and turn back and plead with you in the land of their captivity, saying, ‘We have sinned, we have acted perversely, and we have acted wickedly,’
translation:
  language: hi
  text: और यदि वे उस देश में, जहाँ उन्हें बंदी बनाकर ले जाया गया हो, अपने मन में विचार करें[a], और लौटें तथा अपने बंदीवास के देश में तुमसे विनती करके कहें, ‘हमने पाप किया है, हमने कुटिलता की है और हमने दुष्टता की है,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ, “अपने हृदय में फिर ले आएँ”; यह गहराई से विचार करने या बात को मन में लेने का मुहावरा है।
    reason: मूल इब्रानी मुहावरे की हृदय-संबंधी छवि और उसके आत्मचिंतन के भाव को स्पष्ट करता है।
lexical_decisions:
- source_word: וְהֵשִׁיבוּ אֶל־לְבָבָם
  choice: इस बात को अपने मन में फिर ले आएँ
  rationale: यह इब्रानी मुहावरे की ‘हृदय में फिर लाने’ वाली छवि को बनाए रखते हुए गहरे आत्मचिंतन और अपनी दशा पहचानने का भाव व्यक्त करता है। संदर्भ से ‘इस बात’ का आशय उनकी स्थिति और अपराधबोध है, पर उसे अधिक स्पष्ट करके सीमित नहीं किया गया।
- source_word: בָּאָרֶץ אֲשֶׁר נִשְׁבּוּ שָׁם
  choice: जिस देश में वे बंदी बनाकर ले जाए गए हों
  rationale: निफ़अल रूप बंदी बनाए जाने को व्यक्त करता है; यह हिंदी में स्वाभाविक है और निर्वासन की ठोस परिस्थिति बनाए रखता है।
- source_word: וְשָׁבוּ
  choice: लौटकर
  rationale: ‘लौटना’ शारीरिक वापसी और परमेश्वर की ओर मन फिराने—दोनों संभावित अर्थों को खुला रखता है; इसे केवल ‘पश्चाताप करना’ नहीं बनाया गया।
- source_word: וְהִתְחַנְּנוּ אֵלֶיךָ
  choice: तुमसे गिड़गिड़ाकर
  rationale: हित्पअेल रूप अनुग्रह पाने के लिए विनम्र और अत्यंत आग्रहपूर्ण प्रार्थना को दर्शाता है।
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: अपनी बँधुआई के देश में
  rationale: שְׁבִי की बंदी अवस्था को निकटता से व्यक्त करता है और पहले वाक्यांश के निर्वासन-संदर्भ से जुड़ता है।
- source_word: חָטָאנוּ
  choice: हमने पाप किया है
  rationale: स्वीकारोक्ति के सूत्र का सीधा और प्रचलित हिंदी अनुवाद।
- source_word: הֶעֱוִינוּ
  choice: हमने टेढ़े काम किए हैं
  rationale: עוה में निहित नैतिक टेढ़ेपन की छवि बचती है और यह सामान्य पाठक के लिए ‘कुटिलता की’ से अधिक स्पष्ट है।
- source_word: וְרָשָׁעְנוּ
  choice: हमने दुष्टता की है
  rationale: क्रियात्मक स्वीकारोक्ति और पाप की गंभीरता को बनाए रखता है।
theological_decisions:
- issue: निर्वासन के संदर्भ में שׁוּב का पश्चाताप-संबंधी अर्थ
  choice: लौटकर
  alternative: पश्चाताप करके; फिरकर
  rationale: मूल शब्द वास्तविक लौटने और आत्मिक रूप से परमेश्वर की ओर लौटने के बीच अर्थगत तनाव रखता है। ‘लौटकर’ इस बहुअर्थकता को किसी संकीर्ण धार्मिक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, प्रार्थनात्मक स्वर रखा गया है। ‘बंदी बनाकर ले जाए गए’, ‘मन में फिर ले आएँ’ और ‘गिड़गिड़ाकर’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि मूल की पुनरावृत्ति, नैतिक गंभीरता और लौटने की अर्थगत अस्पष्टता सुरक्षित रहती है।
