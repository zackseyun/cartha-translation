review_pass:
  verdict: revise
  source_fidelity: The draft broadly follows the Hebrew sequence and correctly retains the conditional setting, captivity, turning, supplication, and threefold confession. However, “बँधुआई” denotes bonded labor rather than captivity, and “इस बात” supplies an unspecified object absent from the Hebrew idiom. The revised wording keeps the idiom’s reflective force without adding that object.
  naturalness: 'Several expressions are understandable but not ideal in modern standard Hindi: “अपने मन में फिर ले आएँ” is overly literal, “टेढ़े काम किए हैं” is colloquial and weak for the moral confession, and “गिड़गिड़ाकर” can sound unduly derogatory. The revision is more idiomatic while retaining a dignified prayer register.'
  terminology: “बंदी” / “बंदीवास” accurately conveys captivity. “कुटिलता की है” conveys the moral crookedness of הֶעֱוִינוּ more naturally than “टेढ़े काम किए हैं,” while “दुष्टता की है” preserves the final confession’s gravity. “लौटें” preserves the Hebrew’s potentially literal and spiritual sense without imposing a doctrinal gloss.
  issues:
  - severity: medium
    issue: “अपनी बँधुआई के देश” is not an accurate equivalent for “the land of their captivity.”
    rationale: बँधुआई normally refers to bonded labor or servitude, whereas שְׁבִי denotes captivity/captive status. “अपने बंदीवास के देश” retains the exile-and-captivity sense.
  - severity: low
    issue: “इस बात को” adds an object not stated in the Hebrew.
    rationale: The idiom literally concerns bringing something back to one’s heart; in context it denotes reflection/coming to recognition, but the object is left unexpressed. “अपने मन में विचार करें” avoids specifying it.
  - severity: medium
    issue: “हमने टेढ़े काम किए हैं” is stylistically weak and insufficiently suited to the solemn moral confession.
    rationale: It can suggest merely clumsy or improper actions. “हमने कुटिलता की है” better conveys the moral crookedness of the Hebrew while remaining natural Hindi.
  revised_text: और यदि वे उस देश में, जहाँ उन्हें बंदी बनाकर ले जाया गया हो, अपने मन में विचार करें[a], और लौटें तथा अपने बंदीवास के देश में तुमसे विनती करके कहें, ‘हमने पाप किया है, हमने कुटिलता की है और हमने दुष्टता की है,’
