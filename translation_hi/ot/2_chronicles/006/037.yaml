    reason: मूल इब्रानी मुहावरे की हृदय-संबंधी छवि और उसके आत्मचिंतन के भाव को स्पष्ट करता है।
  revision_rationale: The revision corrects the captivity terminology, removes an added object from the Hebrew idiom, and improves the naturalness and moral force of the confession. “लौटें” deliberately preserves the source term’s open sense of returning/turning back; the text does not resolve it as a narrowly theological term.
