  text: וְ/שָׁ֨מַעְתָּ֜ אֶל תַּחֲנוּנֵ֤י עַבְדְּ/ךָ֙ וְ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יִֽתְפַּֽלְל֖וּ אֶל הַ/מָּק֣וֹם הַ/זֶּ֑ה וְ֠/אַתָּה תִּשְׁמַ֞ע מִ/מְּק֤וֹם שִׁבְתְּ/ךָ֙ מִן הַ/שָּׁמַ֔יִם וְ/שָׁמַעְתָּ֖ וְ/סָלָֽחְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/021.yaml
  text: And hear the pleas of your servant and of your people Israel when they pray toward this place. And may you hear from your dwelling place[a], from heaven, and when you hear, forgive.
translation:
  language: hi
  text: और अपने दास और अपनी प्रजा इस्राएल की विनतियाँ सुनना, जो वे इस स्थान की ओर प्रार्थना करते समय करें। और तू अपने निवास-स्थान से, स्वर्ग से सुनना; और सुनकर क्षमा करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתָּ / תִּשְׁמַע / וְשָׁמַעְתָּ
  choice: सुनना / सुनना / सुनकर
  rationale: मूल में שׁמע की तीन बार हुई पुनरावृत्ति प्रार्थना की संरचना बनाती है। हिन्दी में ‘सुनना’ को दोहराकर यह संरचना रखी गई है, और अंतिम प्रयोग को स्वाभाविक क्रम के लिए ‘सुनकर’ किया गया है।
- source_word: תַּחֲנוּנֵי
  choice: विनतियाँ
  rationale: यह शब्द दया या कृपा पाने के लिए की गई गम्भीर प्रार्थनाओं को दर्शाता है। ‘विनतियाँ’ आधुनिक, सहज और गरिमापूर्ण हिन्दी में इस भाव को व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: अपने दास
  rationale: राजा सुलैमान की परमेश्वर से प्रार्थना के प्रसंग में यह विनम्र, सम्बन्धपरक और सम्मानसूचक आत्म-पदनाम है; इसलिए ‘दास’ उपयुक्त है।
- source_word: וְעַמְּךָ יִשְׂרָאֵל
  choice: और अपनी प्रजा इस्राएल की
  rationale: यह स्पष्ट करता है कि विनतियाँ सुलैमान और इस्राएल, दोनों की हैं, तथा इस्राएल को परमेश्वर की प्रजा के रूप में बनाए रखता है।
- source_word: יִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: वे इस स्थान की ओर प्रार्थना करें
  rationale: क्रिया का अर्थ ‘प्रार्थना करना’ है और אֶל दिशात्मक भाव देता है। ‘इस स्थान की ओर’ मन्दिर की दिशा में प्रार्थना करने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמְּקוֹם שִׁבְתְּךָ מִן הַשָּׁמַיִם
  choice: अपने निवास-स्थान—स्वर्ग से
  rationale: दोनों पदों का निकट सम्बन्ध रखते हुए यह स्पष्ट किया गया है कि परमेश्वर का निवास-स्थान स्वर्ग है। इससे मन्दिर की ओर प्रार्थना और स्वर्ग से परमेश्वर के सुनने—दोनों बातें बनी रहती हैं।
- source_word: סָלָחְתָּ
  choice: क्षमा करना
  rationale: यह पाप या दोष को क्षमा करने की प्रार्थना है। ‘क्षमा करना’ स्पष्ट, प्रचलित और धर्मशास्त्रीय रूप से पारदर्शी है।
theological_decisions:
- issue: परमेश्वर की परात्परता और मन्दिर का स्थान
  choice: लोग ‘इस स्थान की ओर’ प्रार्थना करते हैं, पर परमेश्वर ‘अपने निवास-स्थान—स्वर्ग से’ सुनता है।
  alternative: परमेश्वर को मन्दिर में अधिक प्रत्यक्ष रूप से स्थानीयकृत करना, या मन्दिर के उल्लेख को केवल प्रतीकात्मक मानना।
  rationale: इब्रानी पाठ इन दोनों बातों को साथ रखता है। अनुवाद इस धर्मशास्त्रीय तनाव को बिना मिटाए या अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और प्रार्थनापूर्ण गरिमा वाली है। परमेश्वर के लिए एकवचन निकट-सम्मानसूचक ‘तू’ और उससे मेल खाते क्रियारूप प्रयुक्त हुए हैं। मूल की पुनरावृत्ति को यथासम्भव बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुसार रखा गया है।
