source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ אֲשֶׁ֥ר דִּבַּ֖רְתָּ לְ/עַבְדְּ/ךָ֥ לְ/דָוִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/017.yaml
  text: Now[a], Yahweh, God of Israel, let your word that you spoke to your servant David be confirmed.
translation:
  language: hi
  text: अब, हे याहवे, इस्राएल के परमेश्वर, आपका वह वचन सच्चा सिद्ध हो[a], जो आपने अपने सेवक दाऊद से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दृढ़ स्थापित हो’; अथवा, ‘सत्य सिद्ध हो।’
    reason: יֵאָמֵן में वचन के दृढ़ होने, स्थापित होने, अथवा सत्य प्रमाणित होने का भाव हो सकता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह प्रार्थना में अगली विनती आरम्भ करने वाला कालवाचक/विमर्श-सूचक पद है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह सम्बन्धवाचक पदबंध सीधे और स्वाभाविक ढंग से यहोवा की पहचान इस्राएल के परमेश्वर के रूप में कराता है।
- source_word: יֵאָמֵן
  choice: सच्चा सिद्ध हो
  rationale: אמן के निफ़अल रूप का भाव है कि कहा हुआ वचन अपनी पूर्ति में विश्वसनीय और दृढ़ प्रमाणित हो; ‘सच्चा सिद्ध हो’ इस परिणामात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: דְּבָרְךָ
  choice: आपका वह वचन
  rationale: ‘वचन’ मूल के ‘शब्द/बात’ को बनाए रखता है और प्रसंग में प्रतिज्ञा का संकेत भी देता है; ‘वह’ आगे आने वाले सम्बन्धवाचक उपवाक्य से इसे स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: जो आपने ... कहा था
  rationale: यह मूल के ‘बोलने/कहने’ वाले क्रियार्थ को बनाए रखता है; भूतपूर्व ‘था’ दाऊद से पहले कही गई बात को हिन्दी में स्पष्ट करता है।
- source_word: לְעַבְדְּךָ לְדָוִיד
  choice: अपने सेवक दाऊद से
  rationale: דבר के साथ ל संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक है। עבד के लिए इस राजकीय-वाचागत प्रसंग में ‘सेवक’ उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक पहचाना और सहज रूप है, जबकि ‘याहवे’ स्रोत-उच्चारण के निकट वैकल्पिक लिप्यंतरण है।
- issue: דְּבָרְךָ और יֵאָמֵן के संयुक्त भाव का निरूपण
  choice: वचन सच्चा सिद्ध हो
  alternative: प्रतिज्ञा दृढ़ की जाए / वचन पूरा हो
  rationale: चुना हुआ पाठ ‘वचन’ की शाब्दिकता और उसके सत्य प्रमाणित होने के भाव को बनाए रखता है। ‘प्रतिज्ञा’ प्रसंगानुकूल है, पर संज्ञा में निहित सामान्य अर्थ को अधिक व्याख्यात्मक ढंग से सीमित कर देती है; ‘पूरा हो’ पूर्ति को स्पष्ट करता है, पर יֵאָמֵן के दृढ़/विश्वसनीय सिद्ध होने के तनाव को घटाता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयुक्त हुआ है। वाक्य-विन्यास हिन्दी में स्वाभाविक है, जबकि ‘वचन’ और ‘सेवक’ जैसे गरिमापूर्ण, सामान्यतः समझे जाने वाले बाइबलीय शब्द सुरक्षित रखे गए हैं।
