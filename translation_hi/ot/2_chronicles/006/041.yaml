id: 2CH.6.41
reference: 2 Chronicles 6:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה קוּמָ֞/ה יְהוָ֤ה אֱלֹהִים֙ לְֽ/נוּחֶ֔/ךָ אַתָּ֖ה וַ/אֲר֣וֹן עֻזֶּ֑/ךָ כֹּהֲנֶ֜י/ךָ יְהוָ֤ה אֱלֹהִים֙ יִלְבְּשׁ֣וּ תְשׁוּעָ֔ה וַ/חֲסִידֶ֖י/ךָ יִשְׂמְח֥וּ בַ/טּֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/041.yaml
  text: And now arise[a], O Yahweh God, to your resting place, you and the ark of your strength. Let your priests, O Yahweh God, be clothed with salvation[c][b], and let your faithful ones rejoice in what is good.
translation:
  language: hi
  text: और अब, हे याहवे परमेश्वर, उठ और अपने विश्राम-स्थान में आ—तू और तेरे सामर्थ्य की मंजूषा।[a] हे याहवे परमेश्वर, तेरे याजक उद्धार का वस्त्र पहनें, और तेरे विश्वासयोग्य जन[b] भलाई में आनन्दित हों।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी शक्ति की मंजूषा” अथवा “तेरे पराक्रम की मंजूषा।”
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे भक्त जन” अथवा “तेरे निष्ठावान जन।”
    reason: lexical_alternative
  - marker: c
    text: या, “जो भला है उसमें”; अथवा, “तेरी भलाई में।” इब्रानी में केवल “भले/भलाई में” है; वहाँ “तेरी” स्पष्ट रूप से नहीं लिखा है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालसूचक עַתָּה दोनों को रखते हुए यह अंतिम प्रार्थना की ओर संक्रमण प्रकट करता है।
- source_word: קוּמָה
  choice: उठ
  rationale: קום का एकवचन पुल्लिंग आज्ञार्थक रूप है; परमेश्वर को संबोधित प्रार्थना में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה אֱלֹהִים
  choice: हे याहवे परमेश्वर
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְנוּחֶךָ
  choice: अपने विश्राम-स्थान में
  rationale: यहाँ नूह-सम्बन्धी संज्ञा मंदिर को परमेश्वर और मंजूषा के स्थायी विश्राम-स्थान के रूप में सूचित करती है; ‘विश्राम-स्थान’ गंतव्य और स्थिर निवास दोनों भाव रखता है।
- source_word: אַתָּה וַאֲרוֹן עֻזֶּךָ
  choice: तू और तेरे सामर्थ्य की मंजूषा
  rationale: इब्रानी की समानाधिकरणात्मक संरचना को रखा गया है। עֹז के लिए ‘सामर्थ्य’ गरिमापूर्ण और निकट अर्थ वाला शब्द है।
- source_word: כֹּהֲנֶיךָ
  choice: तेरे याजक
  rationale: बहुवचन और द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा अनुवाद है।
- source_word: יִלְבְּשׁוּ תְשׁוּעָה
  choice: उद्धार का वस्त्र पहनें
  rationale: לבש के पहनने/ओढ़ने के रूपक को स्वाभाविक हिन्दी में स्पष्ट रखा गया है; תְּשׁוּעָה को व्यापक अर्थ वाले ‘उद्धार’ से व्यक्त किया गया है।
- source_word: חֲסִידֶיךָ
  choice: तेरे विश्वासयोग्य जन
  rationale: חסיד में निष्ठा, भक्ति और वाचा-संबंधी विश्वासयोग्यता का भाव है। ‘विश्वासयोग्य जन’ बाद की तकनीकी धार्मिक धारणाएँ थोपे बिना संबंधपरक भाव व्यक्त करता है।
- source_word: יִשְׂמְחוּ בַטּוֹב
  choice: भलाई में आनन्दित हों
  rationale: इब्रानी में निश्चित उपपद सहित ‘भले/भलाई में’ है, पर कोई स्पष्ट संबंधसूचक प्रत्यय नहीं। यह रूप उसी संक्षिप्तता और अर्थगत खुलेपन को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: בַטּוֹב में भलाई किसकी है
  choice: भलाई में
  alternative: जो भला है उसमें; तेरी भलाई में
  rationale: प्रार्थना के संदर्भ में ‘तेरी भलाई’ संभव है, किंतु इब्रानी में ‘तेरी’ का प्रत्यय नहीं है। मुख्य पाठ इस अस्पष्टता को बनाए रखता है और संभावित अर्थों को पादटिप्पणी में देता है।
- issue: חֲסִידֶיךָ की धार्मिक पहचान
  choice: तेरे विश्वासयोग्य जन
  alternative: तेरे भक्त जन; तेरे निष्ठावान जन; तेरे पवित्र जन
  rationale: शब्द परमेश्वर के प्रति निष्ठा और भक्ति से पहचाने जाने वाले लोगों को सूचित करता है। चुना हुआ रूप किसी बाद की साम्प्रदायिक या पदवीगत धारणा को अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रार्थना और मंदिर-संदर्भ के अनुरूप गरिमापूर्ण रखी गई है। ‘तू/तेरे’ का प्रयोग मूल इब्रानी के एकवचन निकट संबोधन और हिन्दी बाइबलीय प्रार्थना-शैली के अनुरूप है। ‘मंजूषा’ वाचा की पवित्र संदूक के लिए संक्षिप्त पारंपरिक शब्द है; वाक्य में पहनने का रूपक और अंतिम पद की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
