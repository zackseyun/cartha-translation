base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/022.yaml
  text: If a man sins against his neighbor[a], and an oath is laid on him to make him swear, and he comes and the oath is before your altar in this house,
translation:
  language: hi
  text: यदि कोई पुरुष अपने पड़ोसी के विरुद्ध पाप करे, और उसे शपथ दिलाने के लिए उस पर शाप-सहित शपथ लगाई जाए,[a] और वह शपथ इस घर में आपकी वेदी के सामने लाई जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर शापयुक्त शपथ लगाई जाए।” इब्रानी शब्द ऐसी शपथ को सूचित कर सकता है जिसमें झूठी शपथ लेने पर शाप निहित हो।
    reason: אָלָה की शपथ और शाप—दोनों अर्थछायाओं वाली न्यायिक संज्ञा की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: אִם יֶחֱטָא אִישׁ
  choice: यदि कोई पुरुष ... पाप करे
  rationale: शर्तसूचक אִם और प्रतिनिधिक पुल्लिंग एकवचन אִישׁ को बनाए रखते हुए חטא की नैतिक-धार्मिक शक्ति को ‘पाप करे’ से व्यक्त किया गया है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: רֵעַ का सामाजिक और पारस्परिक अर्थ ‘पड़ोसी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: וְנָשָׂא בוֹ אָלָה
  choice: उस पर शाप-सहित शपथ रखी जाए
  rationale: न्यायिक मुहावरे में किसी व्यक्ति पर ऐसी शपथ का दायित्व रखा जाता है जिसके उल्लंघन या झूठे होने पर शाप निहित है; शब्द-युग्म के शपथ और शाप दोनों पक्ष सुरक्षित रखे गए हैं।
- source_word: לְהַאֲלֹתוֹ
  choice: उसे शपथ दिलाने के लिए
  rationale: हिफ़ील क्रिया का कारक अर्थ अलग से व्यक्त किया गया है, ताकि पूर्ववर्ती मुहावरे के साथ स्रोत की दोहरी संरचना लुप्त न हो।
- source_word: וּבָא אָלָה לִפְנֵי מִזְבַּחֲךָ
  choice: वह आकर ... आपकी वेदी के सामने वह शपथ ले
  rationale: खंड का आशय व्यक्ति के वेदी के सामने आकर निर्धारित शपथ लेने से है। हिन्दी में ‘शपथ सामने आए’ अस्वाभाविक होता, इसलिए कर्ता और क्रिया को प्रसंगानुकूल स्पष्ट किया गया है।
- source_word: בַּבַּיִת הַזֶּה
  choice: इस भवन में
  rationale: בַּיִת के मूल अर्थ ‘घर/भवन’ को रखा गया है; मंदिर का संदर्भ प्रसंग से स्पष्ट है।
theological_decisions:
- issue: אָלָה का न्यायिक अर्थ
  choice: मुख्य पाठ में ‘शाप-सहित शपथ’
  alternative: ‘शपथ’ अथवा ‘शाप’
  rationale: इस न्यायिक प्रसंग में शब्द ऐसी शपथ को सूचित करता है जिसमें झूठ सिद्ध होने पर शाप का दंड निहित है। केवल ‘शपथ’ शाप की छाया खो सकता है और केवल ‘शाप’ शपथ-विधि को अस्पष्ट कर सकता है।
- issue: וּבָא אָלָה की वाक्यगत व्याख्या
  choice: व्यक्ति आकर वेदी के सामने शपथ ले
  alternative: ‘शपथ आपकी वेदी के सामने आए’
  rationale: हिब्रू की संक्षिप्त रचना में शपथ का वेदी के सामने प्रस्तुत होना कहा गया है; स्वाभाविक हिन्दी में इसका न्यायिक क्रियार्थ स्पष्ट किया गया, बिना परिणाम या दोष का निर्णय जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘आपकी’ प्रार्थना में परमेश्वर के प्रति आदरसूचक संबोधन है। पद अगले पद में पूरी होने वाली शर्त के कारण अल्पविराम पर समाप्त होता है।
