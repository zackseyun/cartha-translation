  text: וְ/שָׁ֣בוּ אֵלֶ֗י/ךָ בְּ/כָל לִבָּ/ם֙ וּ/בְ/כָל נַפְשָׁ֔/ם בְּ/אֶ֥רֶץ שִׁבְיָ֖/ם אֲשֶׁר שָׁב֣וּ אֹתָ֑/ם וְ/הִֽתְפַּֽלְל֗וּ דֶּ֤רֶךְ אַרְצָ/ם֙ אֲשֶׁ֣ר נָתַ֣תָּה לַ/אֲבוֹתָ֔/ם וְ/הָ/עִיר֙ אֲשֶׁ֣ר בָּחַ֔רְתָּ וְ/לַ/בַּ֖יִת אֲשֶׁר בָּנִ֥יתִי לִ/שְׁמֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/038.yaml
  text: and they return to you with all their heart and with all their soul in the land of their captivity[a], where they were taken captive, and pray toward their land that you gave to their fathers, and toward the city that you have chosen, and toward the house that I have built for your name,
translation:
  language: hi
  text: और वे उस देश में, जहाँ उन्हें बंदी बनाकर ले जाया गया था, अपने पूरे मन और अपने पूरे प्राण से आपकी ओर लौटें[a], और अपने उस देश की ओर मुँह करके प्रार्थना करें जिसे आपने उनके पुरखों को दिया था, और उस नगर की ओर जिसे आपने चुना है, और उस भवन की ओर जिसे मैंने आपके नाम के लिए बनाया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी ओर फिरें”; वाचा के प्रसंगों में इस वाक्यांश में पश्चाताप का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁבוּ אֵלֶיךָ
  choice: आपकी ओर लौटें
  rationale: שׁוּב के साथ אֶל का मूल अर्थ किसी की ओर लौटना या फिरना है। यह रूप पश्चाताप का वाचाई भाव भी समेट सकता है, पर मुख्य पाठ में उसी अर्थ को स्पष्ट रूप से थोपता नहीं।
- source_word: בְּכָל לִבָּם וּבְכָל נַפְשָׁם
  choice: अपने पूरे मन और अपने पूरे प्राण से
  rationale: यह इब्रानी युग्म संपूर्ण भीतरी निष्ठा और पूरे अस्तित्व से समर्पण व्यक्त करता है। ‘मन’ और ‘प्राण’ पारंपरिक अर्थ-संबंध को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य हैं।
- source_word: בְּאֶרֶץ שִׁבְיָם
  choice: अपनी बँधुआई के देश में
  rationale: यह रचना उस देश को सूचित करती है जहाँ वे बंदी अवस्था में हैं। ‘बँधुआई’ निर्वासन और बंदी दशा दोनों को संक्षेप में व्यक्त करती है।
- source_word: אֲשֶׁר שָׁבוּ אֹתָם
  choice: जहाँ उन्हें बंदी बनाकर ले जाया गया था
  rationale: क्रिया שׁבה यहाँ उन्हें बंदी बनाने का अर्थ देती है। हिन्दी का कर्मवाच्य मूल आशय को स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְהִתְפַּלְלוּ דֶּרֶךְ אַרְצָם
  choice: अपने उस देश की ओर मुँह करके प्रार्थना करें
  rationale: प्रार्थना की दिशा के प्रसंग में דֶּרֶךְ का अर्थ ‘की ओर’ है; ‘मुँह करके’ हिन्दी में दिशाभिमुख प्रार्थना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲשֶׁר נָתַתָּה לַאֲבוֹתָם
  choice: जिसे आपने उनके पुरखों को दिया था
  rationale: אָבוֹת यहाँ पूर्वजों को सूचित करता है। ‘पुरखे’ आधुनिक हिन्दी में स्वाभाविक है और वाचाई ऐतिहासिक संबंध बनाए रखता है।
- source_word: וְהָעִיר אֲשֶׁר בָּחַרְתָּ
  choice: उस नगर की ओर जिसे आपने चुना है
  rationale: पूर्ण क्रिया परमेश्वर के चुनाव की संपन्न तथा स्थायी महत्ता को दर्शाती है; हिन्दी पूर्ण वर्तमान इसे उपयुक्त रूप से व्यक्त करता है।
- source_word: וְלַבַּיִת אֲשֶׁר בָּנִיתִי לִשְׁמֶךָ
  choice: उस भवन की ओर जिसे मैंने आपके नाम के लिए बनाया है
  rationale: בַּיִת मंदिर को सूचित करता है, किंतु ‘भवन’ मूल रूपक और धार्मिक गरिमा को बनाए रखता है। ‘आपके नाम के लिए’ समर्पण के इब्रानी वाचाई मुहावरे को सुरक्षित रखता है।
theological_decisions:
- issue: שׁוּב אֵלֶיךָ में पश्चाताप का भाव
  choice: आपकी ओर लौटें
  alternative: आपके सामने पश्चाताप करें / आपकी ओर फिरें
  rationale: मूल क्रिया का ठोस अर्थ लौटना या फिरना है। इस प्रार्थना में पश्चाताप निहित है, फिर भी ‘लौटें’ शारीरिक, संबंधपरक और वाचाई अर्थों के बीच की वास्तविक व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। वाक्य को पूर्ववर्ती शर्तीय प्रार्थना से जुड़े होने के कारण ‘और यदि’ से आरंभ किया गया है। भाषा गरिमामय किंतु सामान्य पाठक के लिए सहज रखी गई है।
