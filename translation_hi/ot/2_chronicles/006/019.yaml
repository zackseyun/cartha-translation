  text: וּ/פָנִ֜יתָ אֶל תְּפִלַּ֧ת עַבְדְּ/ךָ֛ וְ/אֶל תְּחִנָּת֖/וֹ יְהוָ֣ה אֱלֹהָ֑/י לִ/שְׁמֹ֤עַ אֶל הָ/רִנָּה֙ וְ/אֶל הַ/תְּפִלָּ֔ה אֲשֶׁ֥ר עַבְדְּ/ךָ֖ מִתְפַּלֵּ֥ל לְ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/019.yaml
  text: Yet turn toward the prayer of your servant and his plea for favor[a], O Yahweh my God[c][b], to hear the cry and the prayer that your servant is praying before you.
translation:
  language: hi
  text: फिर भी, हे यहोवा, मेरे परमेश्वर, अपने दास की प्रार्थना और उसकी कृपा की विनती[a] की ओर ध्यान दे, ताकि तू उस पुकार[b] को और उस प्रार्थना को सुने, जो तेरा दास तेरे सामने कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी गिड़गिड़ाहट।” इब्रानी शब्द दया या कृपा पाने के लिए की गई गहरी विनती दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऊँची पुकार।” इब्रानी शब्द गूँजती हुई पुकार को भी दर्शा सकता है; यहाँ संभवतः सहायता के लिए की गई पुकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתָ
  choice: फिर भी ... ध्यान दे
  rationale: פנה का मूल चित्र ‘मुड़ने’ का है, पर प्रार्थना के प्रसंग में इसका आशय अनुकूलतापूर्वक ध्यान देने से है। पूर्ववर्ती संदर्भ के विपरीत आग्रह को ‘फिर भी’ व्यक्त करता है।
- source_word: תְּפִלַּת
  choice: प्रार्थना
  rationale: תפלה का सामान्य और स्वाभाविक हिन्दी समतुल्य; תחנה से भेद बनाए रखा गया है।
- source_word: עַבְדְּךָ
  choice: अपने दास / तेरा दास
  rationale: ईश्वर को संबोधित राजकीय प्रार्थना में עבד के लिए ‘दास’ गरिमापूर्ण और प्रचलित हिन्दी पद है।
- source_word: תְּחִנָּתוֹ
  choice: उसकी कृपा की विनती
  rationale: תחנה दया या अनुग्रह पाने के लिए की गई गहरी विनती बताता है; यह रूप उस आशय को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रत्यक्ष संबोधन में प्रथम पुरुष संबंधसूचक रूप का सीधा अनुवाद।
- source_word: לִשְׁמֹעַ
  choice: सुन
  rationale: שמע के उद्देश्यात्मक infinitive को स्वाभाविक हिन्दी आग्रह में व्यक्त करता है।
- source_word: הָרִנָּה
  choice: पुकार
  rationale: רנה यहाँ प्रार्थना में उठी तीव्र अथवा ऊँची सहायता-पुकार है; ‘पुकार’ प्रसंगानुकूल है और आनन्द-जयकार का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הַתְּפִלָּה
  choice: प्रार्थना
  rationale: इब्रानी पुनरावृत्ति और समानांतरता बनाए रखने के लिए यही पद दोहराया गया है।
- source_word: מִתְפַּלֵּל
  choice: कर रहा है
  rationale: वर्तमान कृदन्त की जारी क्रिया को हिन्दी के अपूर्ण वर्तमान से व्यक्त किया गया है; ‘प्रार्थना’ पहले ही आने से ‘प्रार्थना कर रहा है’ का अर्थ स्पष्ट है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: ‘तेरी उपस्थिति में’ के अर्थ वाला संक्षिप्त और स्वाभाविक हिन्दी मुहावरा।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ अधिक समीपी वैकल्पिक लिप्यंतरण है।
- issue: פנה के अनुकूल ध्यान का भाव
  choice: की ओर ध्यान दे
  alternative: की ओर फिर
  rationale: शाब्दिक ‘मुड़ना’ सुरक्षित अर्थ-छवि है, पर इस प्रार्थना में वांछित आशय यह है कि परमेश्वर विनती पर अनुकूल ध्यान दें; चुना हुआ रूप कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरा’ संबोधन प्रयुक्त है। वाक्य को हिन्दी की स्वाभाविक संबोधन-व्यवस्था के अनुसार पुनः क्रमित किया गया है, जबकि प्रार्थना, विनती, पुकार और सुनने की इब्रानी समानांतरता सुरक्षित रखी गई है।
