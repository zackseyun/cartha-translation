lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह काल-सूचक कथानक चिह्न सुलैमान के कथन को पिछली घटना के क्रम में प्रस्तुत करता है।
- source_word: אָמַר ... שְׁלֹמֹה
  choice: सुलैमान ने कहा
  rationale: कथन का सरल और स्वाभाविक परिचय; मूल क्रिया पर कोई अतिरिक्त अर्थ नहीं लादा गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אָמַר
  choice: ने कहा है
  rationale: यहाँ पूर्ण क्रिया पूर्व में कही गई और वर्तमान प्रसंग में प्रासंगिक वाणी की ओर संकेत करती है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִשְׁכּוֹן
  choice: कि वह ... निवास करेगा
  rationale: ל सहित धात्वर्थक संज्ञा कही गई बात की विषयवस्तु व्यक्त करती है; अप्रत्यक्ष कथन में भविष्यकालीन ‘निवास करेगा’ स्वाभाविक हिन्दी है।
- source_word: בָּעֲרָפֶל
  choice: घोर अंधकार में
  rationale: यह शब्द सघन बादल, धुंधलके या गहरे अंधकार को सूचित कर सकता है; ‘घोर अंधकार’ दैवी उपस्थिति की निकटता और अगोचरता का तनाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है; इसलिए उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: עֲרָפֶל में दैवी उपस्थिति का बिंब
  choice: घोर अंधकार
  alternative: काला घना बादल
  rationale: चुना गया पाठ दैवी निकटता और छिपे रहने—दोनों को बिना व्याख्यात्मक समाधान के बनाए रखता है; पादटिप्पणी बादल-संबंधी संभावित अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निवास करेगा’ दैवी वास के भाव को बनाए रखता है, और पादटिप्पणी मूल शब्द की वास्तविक अर्थ-व्याप्ति सुरक्षित करती है।
