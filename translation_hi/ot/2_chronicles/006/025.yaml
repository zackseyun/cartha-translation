source:
  edition: WLC
  text: וְ/אַתָּה֙ תִּשְׁמַ֣ע מִן הַ/שָּׁמַ֔יִם וְ/סָ֣לַחְתָּ֔ לְ/חַטַּ֖את עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וַ/הֲשֵׁיבוֹתָ/ם֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לָ/הֶ֖ם וְ/לַ/אֲבֹתֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/025.yaml
  text: then you will hear from heaven[a], and forgive the sin of your people Israel[b], and bring them back to the land that you gave to them and to their fathers.
translation:
  language: hi
  text: तब तू स्वर्ग से सुन, इस्राएल, अपनी प्रजा, के पाप को क्षमा कर, और उन्हें उस भूमि में लौटा ला जिसे तूने उन्हें और उनके पुरखों को दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके पिताओं को।”
    reason: मूल इब्रानी में प्रयुक्त पुल्लिंग वंश-सूचक शब्द को स्पष्ट करना।
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: सुनना
  rationale: प्रार्थना के प्रसंग में यह केवल ध्वनि सुनने नहीं, ध्यान देकर उत्तर देने का भाव रखता है। हिंदी का ‘सुनना’ मूल शब्द को बनाए रखते हुए इस निहित भाव के लिए स्थान छोड़ता है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: इब्रानी रूप बहुवचन है, पर परमेश्वर के निवास के अर्थ में आधुनिक हिंदी में एकवचन ‘स्वर्ग’ स्वाभाविक है।
- source_word: סָלַחְתָּ לְחַטַּאת
  choice: पाप क्षमा करना
  rationale: סלח ईश्वरीय क्षमा का सामान्य क्रिया-पद है और חטאת का एकवचन यहाँ इस्राएल के सामूहिक अपराध को दर्शाता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: यह वाचा-संबंधी ‘तेरी प्रजा’ और इस्राएल नाम, दोनों को स्वाभाविक हिंदी क्रम में रखता है।
- source_word: וַהֲשֵׁיבוֹתָם
  choice: उन्हें ... लौटा लाना
  rationale: 'שׁוב का हिफ़ील रूप कारणवाचक है: परमेश्वर उन्हें वापस आने देता मात्र नहीं, बल्कि वापस लाता है।'
- source_word: אֶל הָאֲדָמָה
  choice: उस भूमि में
  rationale: इस वाचा-संबंधी राष्ट्रीय प्रसंग में אֲדָמָה मिट्टी मात्र नहीं, इस्राएल को दी गई भूमि है। हिंदी में किसी क्षेत्र में लौटने के लिए ‘भूमि में’ स्वाभाविक है।
- source_word: אֲבֹתֵיהֶם
  choice: उनके पुरखों
  rationale: ‘पुरखे’ आधुनिक हिंदी में वंश की पिछली पीढ़ियों का स्वाभाविक और गरिमापूर्ण संकेत है; पादटिप्पणी मूल के शाब्दिक ‘पिता’ को सुरक्षित रखती है।
theological_decisions:
- issue: תִּשְׁמַע और उसके बाद की क्रियाओं का प्रार्थनात्मक बल
  choice: सुनना ... क्षमा करना ... लौटा लाना
  alternative: तू सुनेगा ... क्षमा करेगा ... लौटा लाएगा
  rationale: इब्रानी अपूर्ण क्रिया भविष्य का रूप ले सकती है, किंतु मंदिर-समर्पण की इस विनती में हिंदी के आदरसूचक प्रार्थनात्मक क्रियारूप अधिक स्वाभाविक हैं और आदेश देने की अपेक्षा निवेदन का भाव व्यक्त करते हैं।
- issue: אֲבֹתֵיהֶם का अर्थ
  choice: उनके पुरखों
  alternative: उनके पिताओं
  rationale: मूल संज्ञा ‘पिताओं’ है, पर यहाँ वह पिछली वाचा-पीढ़ियों को सूचित करती है। ‘पुरखों’ से यह वंशगत निरंतरता सहज हिंदी में व्यक्त होती है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रार्थनात्मक रखी गई है। ‘तू’ बाइबिलीय प्रार्थना में परमेश्वर के प्रति निकटता और एकवचन संबोधन व्यक्त करता है; क्रियाओं में अनादर का भाव नहीं है।
