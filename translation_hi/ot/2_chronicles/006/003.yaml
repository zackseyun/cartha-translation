  yaml_path: translation/ot/2_chronicles/006/003.yaml
  text: Then the king turned around and blessed all the assembly of Israel[b][a], while all the assembly of Israel was standing.
translation:
  language: hi
  text: तब राजा ने मुड़कर इस्राएल की सारी सभा[a] को आशीर्वाद दिया, और इस्राएल की सारी सभा खड़ी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सारी मण्डली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב ... אֶת־פָּנָיו
  choice: मुड़कर
  rationale: इब्रानी में शाब्दिक रूप से ‘अपना मुख फेरा’ है; इस प्रसंग में ‘मुड़कर’ उसी शारीरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְבָרֶךְ
  choice: आशीर्वाद दिया
  rationale: ברך का यहाँ सामान्य अर्थ सभा को आशीर्वाद देना है; यह हिन्दी में संक्षिप्त और प्रतिष्ठित प्रयोग है।
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל एकत्र समुदाय को दर्शाता है। ‘सभा’ सार्वजनिक धार्मिक जमावड़े के लिए स्पष्ट और सामान्य हिन्दी शब्द है।
- source_word: עוֹמֵד
  choice: खड़ी थी
  rationale: पुल्लिंग एकवचन कृदंत सामूहिक संज्ञा קהל से मेल खाता है और उस समय सभा की जारी मुद्रा बताता है; हिन्दी में ‘सभा खड़ी थी’ स्वाभाविक है।
- source_word: וְכָל־קְהַל יִשְׂרָאֵל עוֹמֵד
  choice: और इस्राएल की सारी सभा खड़ी थी
  rationale: वाव को ‘और’ रखकर मूल की समन्वयी तथा प्रसंगतः परिस्थितिजन्य संरचना को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
