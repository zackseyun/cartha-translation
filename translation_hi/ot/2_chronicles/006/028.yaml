  text: רָעָ֞ב כִּֽי יִהְיֶ֣ה בָ/אָ֗רֶץ דֶּ֣בֶר כִּֽי יִֽ֠הְיֶה שִׁדָּפ֨וֹן וְ/יֵרָק֜וֹן אַרְבֶּ֤ה וְ/חָסִיל֙ כִּ֣י יִהְיֶ֔ה כִּ֧י יָֽצַר ל֛/וֹ אוֹיְבָ֖י/ו בְּ/אֶ֣רֶץ שְׁעָרָ֑י/ו כָּל נֶ֖גַע וְ/כָֽל מַחֲלָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/028.yaml
  text: If there is famine in the land[a], if there is plague, blight, mildew, locust, or caterpillar; if his enemies besiege him in the land of his gates[b]; whatever plague and whatever sickness there may be—
translation:
  language: hi
  text: यदि देश में अकाल पड़े, यदि महामारी फैले, यदि फसल झुलस जाए और उसमें पीलापन पड़ जाए, यदि टिड्डियाँ और फसल चट करने वाले कीड़े[a] आ जाएँ, यदि उसके शत्रु उसके नगरों[b] में उसे घेर लें—चाहे कोई भी विपत्ति या बीमारी हो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חָסִיל फसल खा जाने वाले किसी कीट को दर्शाता है; उसकी सटीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसके फाटकों के देश में।” यहाँ “फाटक” देश के नगरों या बस्तियों के लिए प्रयुक्त हुआ है।'
    reason: cultural_note
lexical_decisions:
- source_word: רָעָב
  choice: अकाल
  rationale: आपदाओं की इस सूची में यह सामान्य भूख नहीं, बल्कि देशव्यापी खाद्य-संकट को दर्शाता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह व्यापक रूप से फैलनेवाली घातक बीमारी को दर्शाता है; आधुनिक हिन्दी में ‘महामारी’ स्पष्ट और स्वाभाविक है।
- source_word: שִׁדָּפוֹן
  choice: फसल झुलस जाए
  rationale: यह गर्म या विनाशकारी हवा से फसल के झुलसने अथवा इसी प्रकार की क्षति का संकेत देता है।
- source_word: יֵרָקוֹן
  choice: उसमें पीलापन पड़े
  rationale: शब्द वनस्पति के पीले या फीके पड़ने की दशा बताता है; यह अनिश्चित रोग-नाम थोपे बिना मूल अर्थ रखता है।
- source_word: אַרְבֶּה
  choice: टिड्डियाँ
  rationale: आपदा के प्रसंग में यह झुंड बनाकर फसल नष्ट करनेवाली टिड्डियों को दर्शाता है।
- source_word: חָסִיל
  choice: फसल चट करनेवाले कीड़े
  rationale: सटीक कीट-प्रजाति अनिश्चित है; वर्णनात्मक अनुवाद कृषि-विनाश का अर्थ सुरक्षित रखता है और इसे אַרְבֶּה से अलग भी रखता है।
- source_word: כִּי יָצַר לוֹ אֹיְבָיו
  choice: यदि उसके शत्रु ... उसे घेर लें
  rationale: क्रिया शत्रुओं द्वारा दबाने, घेरने या घेराबंदी करने का भाव देती है।
- source_word: בְּאֶרֶץ שְׁעָרָיו
  choice: उसके नगरों में
  rationale: शाब्दिक रूप से ‘उसके फाटकों के देश में’; ‘फाटक’ यहाँ नगरों या बस्तियों के लिए लक्षणा है।
- source_word: כָּל נֶגַע
  choice: कोई भी विपत्ति
  rationale: נֶגַע प्रहार, पीड़ा या विपत्ति का व्यापक शब्द है; ‘महामारी’ की अनावश्यक पुनरावृत्ति से बचते हुए इसका विस्तार रखा गया है।
- source_word: כָל מַחֲלָה
  choice: बीमारी
  rationale: यह रोग या अस्वस्थता का सामान्य और व्यापक पद है।
