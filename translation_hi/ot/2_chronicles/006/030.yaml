reference: 2 Chronicles 6:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/אַתָּה תִּשְׁמַ֨ע מִן הַ/שָּׁמַ֜יִם מְכ֤וֹן שִׁבְתֶּ֨/ךָ֙ וְ/סָ֣לַחְתָּ֔ וְ/נָתַתָּ֤ה לָ/אִישׁ֙ כְּ/כָל דְּרָכָ֔י/ו אֲשֶׁ֥ר תֵּדַ֖ע אֶת לְבָב֑/וֹ כִּ֤י אַתָּה֙ לְ/בַדְּ/ךָ֣ יָדַ֔עְתָּ אֶת לְבַ֖ב בְּנֵ֥י הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/030.yaml
  text: then may you hear from heaven[a], the place of your dwelling, and forgive, and give to each man according to all his ways, whose heart you know—for you alone know the heart of the sons of man—
translation:
  language: hi
  text: तब तू स्वर्ग से, अपने निवास-स्थान से, सुनना, क्षमा करना, और हर एक मनुष्य को उसके सब चालचलन के अनुसार प्रतिफल देना, जिसके हृदय को तू जानता है—क्योंकि केवल तू ही मनुष्यों के हृदय को जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּשְׁמַע
  choice: सुनना
  rationale: प्रार्थना के संदर्भ में अपूर्ण क्रिया विनती का भाव रखती है; हिन्दी में आदरसूचक आज्ञार्थक/विनयात्मक रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַשָּׁמַיִם
  choice: स्वर्ग से
  rationale: इब्रानी रूप व्याकरणतः बहुवचन है, पर इस संदर्भ में आधुनिक हिन्दी का स्वाभाविक और अर्थसंगत रूप ‘स्वर्ग से’ है।
- source_word: מְכוֹן שִׁבְתֶּךָ
  choice: जो तेरे निवास का स्थान है
  rationale: מָכוֹן स्थिर या निर्धारित स्थान का बोध कराता है; यह पदबंध परमेश्वर के स्वर्गीय निवास को स्पष्ट करता है।
- source_word: וְסָלַחְתָּ
  choice: क्षमा करना
  rationale: वाव-संयुक्त सिद्ध क्रिया प्रार्थना में अनुरोधित क्रियाओं की शृंखला जारी रखती है।
- source_word: וְנָתַתָּה לָאִישׁ כְּכָל דְּרָכָיו
  choice: हर एक मनुष्य को उसके सब चालचलन के अनुसार फल देना
  rationale: נתן का मूल अर्थ ‘देना’ है, किंतु न्यायिक संदर्भ में ‘फल देना’ लक्ष्य अर्थ स्पष्ट करता है; דְּרָכָיו का ‘चालचलन’ जीवन-व्यवहार का रूपक सुरक्षित रखता है।
- source_word: אֲשֶׁר תֵּדַע אֶת לְבָבוֹ
  choice: क्योंकि तू उसके हृदय को जानता है
  rationale: אֲשֶׁר को यहाँ कारणात्मक संबंध में समझना प्रसंग और अगले כִּי-वाक्य के साथ सहज है; ‘हृदय’ विचार, इच्छा और भीतरी व्यक्ति के व्यापक इब्रानी भाव को सुरक्षित रखता है।
- source_word: כִּי אַתָּה לְבַדְּךָ יָדַעְתָּ
  choice: केवल तू ही ... जानता है
  rationale: यह परमेश्वर के विशिष्ट हृदय-ज्ञान पर बल देने वाली कारणसूचक उक्ति है।
- source_word: בְּנֵי הָאָדָם
  choice: मनुष्यों
  rationale: शाब्दिक अर्थ ‘आदम/मनुष्य की सन्तान’ है, पर सामूहिक आशय समस्त मानवजाति है; मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में शाब्दिक रूप दिया गया है।
theological_decisions:
- issue: בְּנֵי הָאָדָם में मानवजाति-सूचक प्रतिनिधिक अभिव्यक्ति
  choice: मनुष्यों
  alternative: मनुष्य की सन्तान
  rationale: इब्रानी पद का आशय सभी मनुष्यों से है। हिन्दी में ‘मनुष्यों’ समावेशी सामूहिक अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
- issue: अन्तःकरण का ज्ञान केवल परमेश्वर को होना
  choice: केवल तू ही मनुष्यों के हृदय को जानता है
  alternative: तू अकेला ही मनुष्य की सन्तान के हृदय को जानता है
  rationale: לְבַדְּךָ की विशिष्टता स्पष्ट रखी गई है और לְבָב को ‘हृदय’ के रूप में रखा गया है, बिना उसके विचार, इच्छा और नैतिक अंतःकरण के अर्थ को किसी एक पक्ष तक सीमित किए।
- issue: וְנָתַתָּ का न्यायिक अर्थ
  choice: फल देना
  alternative: देना
  rationale: केवल ‘देना’ हिन्दी में अपूर्ण लग सकता है; ‘चालचलन के अनुसार फल देना’ प्रतिफल/न्याय का प्रसंग स्पष्ट करता है, पर दण्ड या पुरस्कार में से किसी एक को पूर्वनिर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए पारंपरिक एकवचन ‘तू/तेरे’ और विनयात्मक ‘सुनना, क्षमा करना’ प्रयुक्त हैं। ‘चालचलन’ बाइबलीय ‘मार्ग’ रूपक का परिचित हिन्दी रूप है।
