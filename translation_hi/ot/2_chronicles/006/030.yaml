  verdict: revise
  source_fidelity: The draft correctly conveys the prayerful sequence, heaven as God's dwelling, forgiveness, recompense according to conduct, and God's exclusive knowledge of human hearts. However, אֲשֶׁר תֵּדַע אֶת־לְבָבוֹ is a relative clause modifying “each man” (“whose heart you know”), not a causal clause. Rendering it “क्योंकि तू उसके हृदय को जानता है” conflates it with the following כִּי clause and weakens the source syntax.
  naturalness: The proposed revision retains a natural, dignified modern Hindi prayer register. “जिसके हृदय को तू जानता है” clearly attaches to “हर एक मनुष्य,” and an em dash appropriately marks the following explanatory reason.
  terminology: “निवास-स्थान,” “क्षमा करना,” “चालचलन,” “प्रतिफल देना,” and “हृदय” are suitable. “प्रतिफल देना” naturally expresses the judicial force of “give ... according to all his ways” without specifying either reward or punishment. The footnote appropriately preserves the representative expression in בני האדם while the main text uses idiomatic collective Hindi.
  issues:
  - severity: high
    issue: The relative clause אֲשֶׁר תֵּדַע אֶת־לְבָבוֹ is rendered as a causal clause.
