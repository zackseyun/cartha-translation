source:
  edition: WLC
  text: בְּ/הֵעָצֵ֧ר הַ/שָּׁמַ֛יִם וְ/לֹֽא יִהְיֶ֥ה מָטָ֖ר כִּ֣י יֶֽחֶטְאוּ לָ֑/ךְ וְ/הִֽתְפַּלְל֞וּ אֶל הַ/מָּק֤וֹם הַ/זֶּה֙ וְ/הוֹד֣וּ אֶת שְׁמֶ֔/ךָ מֵ/חַטָּאתָ֥/ם יְשׁוּב֖וּ/ן כִּ֥י תַעֲנֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/026.yaml
  text: When the heavens are shut up and there is no rain because they have sinned against you[a], and they pray toward this place and confess your name and turn from their sin because you answer them,
translation:
  language: hi
  text: जब आकाश बंद हो जाए और वर्षा न हो, क्योंकि उन्होंने तेरे विरुद्ध पाप किया है, और वे इस स्थान की ओर प्रार्थना करें, तेरे नाम का अंगीकार करें और अपने पाप से फिरें, क्योंकि तू उन्हें उत्तर देता है[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तू उन्हें दुःख देता है,” अथवा “क्योंकि तू उन्हें दीन करता है।” स्वरांकित हिब्रू पाठ का अर्थ “तू उन्हें उत्तर देता है” है; अस्वरांकित व्यंजन-पाठ को अलग ढंग से स्वर देकर ये वैकल्पिक अर्थ भी लिए गए हैं।
    reason: अंतिम हिब्रू क्रिया के वैकल्पिक पाठगत अर्थ को सटीक रूप में सुरक्षित रखना।
lexical_decisions:
- source_word: בְּהֵעָצֵר הַשָּׁמַיִם
  choice: जब आकाश बन्द हो जाए
  rationale: ב prefixed infinitive temporal clause बनाता है। एकवचन ‘आकाश’ आधुनिक हिन्दी में वर्षा लाने वाले heavens के लिए स्वाभाविक है, जबकि ‘बन्द हो जाए’ मूल बिंब को बनाए रखता है।
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: और वर्षा न हो
  rationale: हिब्रू के सरल अस्तित्ववाचक कथन को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי יֶחֶטְאוּ לָךְ
  choice: क्योंकि उन्होंने तेरे विरुद्ध पाप किया है
  rationale: כִּי कारणसूचक है और לָךְ यहाँ नैतिक विरोध का भाव देता है। हिन्दी का पूर्ण वर्तमान उस पाप को सूखे से पहले की स्थिति के रूप में स्पष्ट करता है।
- source_word: וְהִתְפַּלְלוּ אֶל הַמָּקוֹם הַזֶּה
  choice: और वे इस स्थान की ओर मुँह करके प्रार्थना करें
  rationale: אֶל दिशा बताता है, प्रार्थना के प्राप्तकर्ता को नहीं। ‘मुँह करके’ हिन्दी में मंदिर की दिशा में प्रार्थना करने का आशय सहज रूप से स्पष्ट करता है।
- source_word: וְהוֹדוּ אֶת שְׁמֶךָ
  choice: तेरे नाम का अंगीकार करें
  rationale: ידה हिफ़ील यहाँ परमेश्वर के नाम को सार्वजनिक रूप से स्वीकारने/मानने का भाव रख सकता है। ‘अंगीकार करें’ पश्चात्ताप और प्रार्थना के प्रसंग में उपयुक्त है तथा इसे केवल धन्यवाद तक सीमित नहीं करता।
- source_word: מֵחַטָּאתָם יְשׁוּבוּן
  choice: और अपने पाप से फिरें
  rationale: שוב + מן के मूल ‘से फिरना’ बिंब को बनाए रखता है और ‘पश्चात्ताप करें’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: כִּי תַעֲנֵם
  choice: क्योंकि तू उन्हें उत्तर देता है
  rationale: मसोरेटिक स्वरांकन इसे ענה ‘उत्तर देना’ के रूप में पढ़ता है। यह प्रार्थना और दैवी उत्तर के क्रम के अनुकूल है; व्यंजनात्मक रूप से जुड़े ‘दुःख देना/दीन करना’ के पाठार्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अन्तिम उपवाक्य में ענה का अर्थ
  choice: क्योंकि तू उन्हें उत्तर देता है
  alternative: क्योंकि तू उन्हें दुःख देता है; क्योंकि तू उन्हें दीन करता है
  rationale: WLC का स्वरांकन और प्रार्थना का निकट प्रसंग ‘उत्तर देना’ का समर्थन करते हैं। फिर भी प्राचीन व्यंजनात्मक रूप और इसी धातु-समूह से जुड़े ‘दुःख देना/दीन करना’ अर्थ ने अनुवाद-परम्परा में वास्तविक वैकल्पिक समझ उत्पन्न की है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन निकटवर्ती ‘तू/तेरे’ प्रयोग किया गया है, जो मूल के एकवचन सम्बोधन और हिन्दी बाइबलीय प्रार्थना-शैली के अनुरूप है। पद अगले वाक्यांश में जारी रहता है, इसलिए अन्त में अल्पविराम रखा गया है।
