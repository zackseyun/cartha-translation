source:
  edition: WLC
  text: וַֽ/יַּעֲמֹ֗ד לִ/פְנֵי֙ מִזְבַּ֣ח יְהוָ֔ה נֶ֖גֶד כָּל קְהַ֣ל יִשְׂרָאֵ֑ל וַ/יִּפְרֹ֖שׂ כַּפָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/012.yaml
  text: Then he stood before the altar of Yahweh in front of all the assembly of Israel and spread out his hands[a][b].
translation:
  language: hi
  text: तब वह इस्राएल की सारी सभा के सामने यहोवा की वेदी के आगे खड़ा हुआ और उसने अपने हाथ फैला दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: तब वह ... खड़ा हुआ
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: לִפְנֵי מִזְבַּח יְהוָה
  choice: यहोवा की वेदी के आगे
  rationale: לִפְנֵי यहाँ वेदी के सापेक्ष स्थान बताता है; सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में ‘यहोवा की वेदी’ कहा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: נֶגֶד כָּל קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा के सामने
  rationale: נֶגֶד का स्थानगत अर्थ ‘के सामने’ है और קהל एकत्र समुदाय अथवा सभा को दर्शाता है।
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: और उसने अपने हाथ फैला दिए
  rationale: शाब्दिक रूप से כַּפָּיו ‘अपनी हथेलियाँ’ है, पर פרשׂ के साथ यह प्रार्थना में हाथ फैलाने का स्वाभाविक संकेत है; हिन्दी में ‘हाथ फैला दिए’ अर्थ और दृश्य दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए प्रतिष्ठित लिप्यंतरण ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है और उसे उपाधि ‘प्रभु’ से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘सभा’ सामुदायिक अर्थ रखता है और ‘हाथ फैला दिए’ प्रार्थना की मुद्रा को स्वाभाविक ढंग से व्यक्त करता है।
