source:
  edition: WLC
  text: וָ/אָשִׂ֥ים שָׁם֙ אֶת הָ֣/אָר֔וֹן אֲשֶׁר שָׁ֖ם בְּרִ֣ית יְהוָ֑ה אֲשֶׁ֥ר כָּרַ֖ת עִם בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/011.yaml
  text: And there I have placed the ark[a], in which is the covenant of Yahweh, which he made with the sons of Israel.
translation:
  language: hi
  text: और मैंने वहाँ उस सन्दूक को रखा है, जिसमें याहवे की वह वाचा है, जो उसने इस्राएल के पुत्रों[a] के साथ बाँधी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्राएल के पुत्र” इब्रानी में इस्राएल की समूची वाचा की प्रजा के लिए प्रचलित नाम है; इसे “इस्राएली” या “इस्राएल की सन्तान” भी कहा जा सकता है।
    reason: शाब्दिक रूप ‘पुत्रों’ और उसके सामूहिक आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וָאָשִׂים
  choice: मैंने रखा है
  rationale: שׂוּם का अर्थ ‘रखना/स्थापित करना’ है। हिन्दी का पूर्ण वर्तमान कार्य की पूर्णता और उसके वर्तमान परिणाम—सन्दूक का वहाँ होना—दोनों व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह पिछले प्रसंग में बताए गए मन्दिर के स्थान की ओर संकेत करने वाला सीधा स्थानवाचक क्रियाविशेषण है।
- source_word: הָאָרוֹן
  choice: वह सन्दूक
  rationale: אָרוֹן के लिए ‘सन्दूक’ स्वाभाविक हिन्दी शब्द है; इस प्रसंग में संकेत पहले से पहचाने गए पवित्र सन्दूक की ओर है।
- source_word: אֲשֶׁר שָׁם
  choice: जिसमें … है
  rationale: शाब्दिक ‘जहाँ … है’ की अपेक्षा हिन्दी में यह रचना स्वाभाविक रूप से वाचा को सन्दूक के भीतर स्थित बताती है।
- source_word: בְּרִית יְהוָה
  choice: याहवे की वह वाचा
  rationale: בְּרִית का अर्थ ‘वाचा’ है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है। ‘वह’ विशिष्ट, पहले से ज्ञात वाचा को दर्शाता है।
- source_word: אֲשֶׁר כָּרַת
  choice: जो उसने … के साथ बाँधी थी
  rationale: ‘वाचा बाँधना’ हिन्दी में स्वाभाविक और प्रतिष्ठित मुहावरा है तथा इब्रानी ‘वाचा काटना’ का अर्थ संप्रेषित करता है, उसकी अस्वाभाविक शाब्दिकता नहीं।
- source_word: עִם
  choice: के साथ
  rationale: वाचा के सहभागी पक्ष को व्यक्त करने वाला सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी की पुल्लिंग बहुवचन संरचना को सीधे सुरक्षित रखता है; यहाँ यह समूची इस्राएली प्रजा का प्रचलित सामूहिक नाम है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय लिप्यन्तरित किया गया है।
- issue: בְּנֵי יִשְׂרָאֵל की सामूहिक और लिंगसूचक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की सन्तानों
  rationale: मुख्य पाठ इब्रानी रूप को निकटता से रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि सन्दर्भ केवल पुरुषों तक सीमित नहीं, बल्कि इस्राएल की वाचा-सम्बन्धी प्रजा से है।
- issue: सन्दूक में ‘वाचा’ होने का कथन
  choice: जिसमें याहवे की वह वाचा है
  alternative: जिसमें याहवे की वाचा की पटियाएँ हैं
  rationale: मूल पाठ केवल ‘वाचा’ कहता है; ‘पटियाएँ’ जोड़ना सम्भावित आशय को स्पष्ट तो करता, पर मूल की संक्षिप्त अभिव्यक्ति और उसके तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा’ और ‘सन्दूक’ जैसे स्थापित बाइबलीय शब्द प्रसंग की धार्मिक विशिष्टता बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान ‘ark’ के बाद था, पर उसकी पादटिप्पणी בְּנֵי יִשְׂרָאֵל से सम्बन्धित है; इसलिए हिन्दी मुख्य पाठ में चिह्न सम्बद्ध पद के बाद रखा गया है।
