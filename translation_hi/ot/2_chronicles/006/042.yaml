  text: יְהוָ֣ה אֱלֹהִ֔ים אַל תָּשֵׁ֖ב פְּנֵ֣י מְשִׁיחֶ֑י/ךָ זָכְרָ֕/ה לְ/חַֽסְדֵ֖י דָּוִ֥יד עַבְדֶּֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/042.yaml
  text: O Yahweh God[a], do not turn away the face of your anointed one[c][b]; remember the steadfast love shown to David your servant.
translation:
  language: hi
  text: हे यहोवा परमेश्वर, अपने अभिषिक्त से मुँह न मोड़[a]; अपने सेवक दाऊद पर की हुई अपनी अटल कृपाओं को स्मरण कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने अभिषिक्त को अस्वीकार न कर।” इब्रानी में शाब्दिक रूप से अभिषिक्त के “मुख” को न फेरने/न हटाने की बात है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद के प्रति अपनी वाचा-निष्ठा को स्मरण कर।” इब्रानी पदबंध का अर्थ “दाऊद के प्रति दिखाई गई अटल प्रेमपूर्ण निष्ठा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर
  rationale: प्रत्यक्ष संबोधन में वाचा-सूचक नाम יְהוָה को प्रचलित हिन्दी रूप ‘यहोवा’ और सामान्य ईश्वरीय उपाधि אֱלֹהִים को ‘परमेश्वर’ किया गया है।
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: मुख न फेर
  rationale: इब्रानी मुहावरे के ठोस ‘मुख’ वाले बिंब को रखा गया है; भावार्थ ‘अस्वीकार न कर’ है, पर मुख्य पाठ में उसे रख देने से मूल का काव्यात्मक चित्र मिट जाता।
- source_word: מְשִׁיחֶךָ
  choice: अपने अभिषिक्त
  rationale: इस राजकीय प्रार्थना में शब्द का तात्कालिक संकेत अभिषिक्त राजा की ओर है। ‘अभिषिक्त’ मूल अर्थ को सुरक्षित रखते हुए व्यापक मसीही अनुगूँज को न तो दबाता है, न आवश्यकता से अधिक स्पष्ट करता है।
- source_word: זָכְרָה
  choice: स्मरण कर
  rationale: आज्ञार्थक क्रिया का सीधा और प्रार्थना के गरिमापूर्ण भाव के अनुकूल अनुवाद।
- source_word: לְחַסְדֵי דָּוִיד
  choice: दाऊद के प्रति अपनी अटल करुणाओं को
  rationale: חֶסֶד में करुणा, निष्ठा और वाचागत विश्वसनीयता का अर्थ-क्षेत्र है। बहुवचन को ‘करुणाओं’ से रखा गया और לְ को दाऊद की ओर निर्देशित संबंध के रूप में व्यक्त किया गया।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: यह दाऊद की परमेश्वर के अधीन सेवा और संबंध को व्यक्त करने वाला स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: מְשִׁיחֶךָ का राजकीय तथा संभावित मसीही आशय
  choice: अपने अभिषिक्त
  alternative: अपने मसीह; अपने राजा
  rationale: ‘मसीह’ बाद की अधिक स्पष्ट उपाधिगत या ख्रीष्ट-संबंधी समझ को आगे ला सकता है, जबकि ‘राजा’ अभिषेक की मूल शब्दावली मिटा देता है। ‘अभिषिक्त’ तत्कालीन राजकीय संदर्भ और व्यापक धर्मवैज्ञानिक अनुगूँज दोनों को खुला रखता है।
- issue: חַסְדֵי דָּוִיד में करुणा/वाचा-निष्ठा का संबंध
  choice: दाऊद के प्रति अपनी अटल करुणाओं को
  alternative: दाऊद पर की गई दयाओं को; दाऊद के प्रति अपनी वाचा-निष्ठा को; दाऊद की करुणाओं को
  rationale: संदर्भ में प्रार्थना परमेश्वर से दाऊद के प्रति दिखाई गई उसकी निष्ठावान करुणा स्मरण करने की है। फिर भी पदबंध संक्षिप्त है, इसलिए टिप्पणी में वैकल्पिक अर्थ-छायाएँ दी गई हैं और मुख्य पाठ में ‘अपनी’ जोड़कर संदर्भगत कर्ता स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर प्रार्थना की गरिमा बनाए रखने के लिए ‘स्मरण कर’ और ‘अभिषिक्त’ जैसे परिचित धर्मग्रंथीय शब्द रखे गए हैं। एकवचन संबोधन के अनुरूप क्रियाएँ ‘फेर’ और ‘कर’ हैं।
