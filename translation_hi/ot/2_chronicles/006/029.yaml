  text: כָּל תְּפִלָּ֣ה כָל תְּחִנָּ֗ה אֲשֶׁ֤ר יִהְיֶה֙ לְ/כָל הָ֣/אָדָ֔ם וּ/לְ/כֹ֖ל עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל אֲשֶׁ֣ר יֵדְע֗וּ אִ֤ישׁ נִגְע/וֹ֙ וּ/מַכְאֹב֔/וֹ וּ/פָרַ֥שׂ כַּפָּ֖י/ו אֶל הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/006/029.yaml
  text: whatever prayer[a], whatever plea may be made by any man or by all your people Israel, each knowing his own affliction and his own pain, and spreading out his hands toward this house—
translation:
  language: hi
  text: हर प्रार्थना, हर विनती जो किसी भी मनुष्य[a] की ओर से या आपकी सारी प्रजा इस्राएल की ओर से की जाए, जब हर एक अपना-अपना कष्ट और अपनी पीड़ा पहचानकर इस भवन की ओर अपने हाथ फैलाए—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी भी व्यक्ति।” यहाँ “मनुष्य” के लिए प्रयुक्त इब्रानी शब्द सामान्य अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל תְּפִלָּה כָל תְּחִנָּה
  choice: हर प्रार्थना, हर विनती
  rationale: כָּל की पुनरावृत्ति को बनाए रखते हुए दोनों प्रकार की याचना की व्यापकता व्यक्त होती है। תְּחִנָּה के लिए ‘विनती’ दया या अनुग्रह पाने की गंभीर प्रार्थना का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אֲשֶׁר יִהְיֶה לְכָל הָאָדָם וּלְכֹל עַמְּךָ יִשְׂרָאֵל
  choice: जो किसी भी मनुष्य की ओर से या आपकी सारी प्रजा इस्राएल की ओर से की जाए
  rationale: होने की इब्रानी अभिव्यक्ति को प्रार्थना के संदर्भ में स्वाभाविक हिन्दी ‘की जाए’ से व्यक्त किया गया है। לְ का संबंध प्रार्थना करनेवाले व्यक्ति अथवा समुदाय से है; ‘या’ व्यक्तिगत और सामूहिक स्थितियों को वितरक रूप में प्रस्तुत करता है।
- source_word: אֲשֶׁר יֵדְעוּ אִישׁ
  choice: जब हर एक … जानकर
  rationale: אִישׁ का वितरक भाव ‘हर एक’ से स्पष्ट होता है। ‘जब’ और ‘जानकर’ हिन्दी में अगले क्रियात्मक वाक्यांश से सहज संबंध बनाते हैं, बिना कारणात्मक अर्थ थोपे।
- source_word: נִגְעוֹ וּמַכְאֹבוֹ
  choice: अपने दुःख और अपनी पीड़ा
  rationale: נֶגַע का अर्थ चोट, विपत्ति या क्लेश तक विस्तृत हो सकता है; यहाँ ‘दुःख’ इस व्यापक निजी संकट को व्यक्त करता है। מַכְאוֹב के अनुभवात्मक अर्थ को अलग रखते हुए ‘पीड़ा’ चुना गया है।
- source_word: וּפָרַשׂ כַּפָּיו
  choice: अपने हाथ फैलाए
  rationale: हथेलियाँ फैलाने की इब्रानी प्रार्थना-मुद्रा के लिए यह स्वाभाविक और प्रतिष्ठित हिन्दी अभिव्यक्ति है।
- source_word: אֶל הַבַּיִת הַזֶּה
  choice: इस भवन की ओर
  rationale: אֶל यहाँ दिशा या अभिमुखता बताता है। मन्दिर को संदर्भित करनेवाले בַּיִת के लिए ‘भवन’ गरिमापूर्ण है और ‘की ओर’ प्रार्थना की दिशा स्पष्ट करता है।
theological_decisions:
- issue: הָאָדָם का सामान्यवाची एकवचन प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: इब्रानी शब्द यहाँ किसी भी मानव व्यक्ति को सामान्य रूप से दर्शाता है। ‘मनुष्य’ मूल शब्द के प्रतिनिधिक एकवचन और मानवीय संदर्भ दोनों को बनाए रखता है; पादटिप्पणी आधुनिक पाठक के लिए ‘व्यक्ति’ विकल्प स्पष्ट करती है।
- issue: व्यक्ति और समस्त इस्राएल के बीच संबंध
  choice: या
  alternative: और
  rationale: दोनों इब्रानी לְ-वाक्यांश व्यक्तिगत अथवा सामूहिक प्रार्थना की व्यापक परिस्थितियाँ गिनाते हैं। हिन्दी में ‘या’ इस वितरक अर्थ को स्पष्ट करता है, यद्यपि मूल संयोजक का अधिक शाब्दिक रूप ‘और’ हो सकता है।
- issue: निजी संकट की प्रकृति
  choice: दुःख और पीड़ा
  alternative: व्याधि और पीड़ा
  rationale: נֶגַע को केवल रोग या महामारी तक सीमित न करके उसकी वास्तविक अर्थ-व्याप्ति खुली रखी गई है। इस प्रकार शारीरिक, भावनात्मक या परिस्थितिजन्य कष्ट की संभावनाएँ बनी रहती हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है। ‘आपकी’ द्वारा संबोधन का आदरसूचक रूप अपनाया गया है।
