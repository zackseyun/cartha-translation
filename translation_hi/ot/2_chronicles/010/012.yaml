  text: וַ/יָּבֹ֨א יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִשִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִשִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had said, saying, “Return to me on the third day.”
translation:
  language: hi
  text: तब यारोबाम और सब लोग तीसरे दिन रहूबियाम के पास आए, जैसा राजा ने कहा था, “तीसरे दिन मेरे पास लौट आना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आए
  rationale: בוא का अर्थ संदर्भ और दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। אֶל רְחַבְעָם के साथ यहाँ ‘रहूबियाम के पास आए’ स्वाभाविक है।
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְכָל הָעָם
  choice: और सब लोग
  rationale: עָם यहाँ यारोबाम के साथ आए व्यापक जनसमूह को सूचित करता है, किसी औपचारिक सभा को नहीं।
- source_word: אֶל רְחַבְעָם
  choice: रहूबियाम के पास
  rationale: אֶל किसी व्यक्ति की ओर गमन दर्शाता है; आधुनिक हिन्दी में ‘के पास’ स्वाभाविक है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: हिब्रू कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसे
  rationale: राजा की पहले कही बात और लोगों के कार्य के बीच सटीक अनुरूपता व्यक्त करता है।
- source_word: דִּבֶּר הַמֶּלֶךְ
  choice: राजा ने कहा था
  rationale: דבר सामान्यतः बोलने या कहने के लिए है; ‘कहा था’ पूर्व कथन को हिन्दी में स्पष्ट करता है, बिना इसे अधिक प्रबल ‘आज्ञा दी’ बनाने के।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप राजा के कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में उद्धरण से पहले विसर्ग-सदृश द्विबिंदु संरचना को अधिक स्वाभाविक बनाता है।
- source_word: שׁוּבוּ אֵלַי
  choice: मेरे पास लौट आना
  rationale: שׁוב का मूल भाव लौटना है; प्रसंग में राजा लोगों से तीन दिन बाद फिर उसके पास आने को कहता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू कथन-परिचायक לֵאמֹר का यांत्रिक ‘यह कहते हुए’ न देकर हिन्दी उद्धरण-विन्यास अपनाया गया है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप प्रयुक्त हैं।
