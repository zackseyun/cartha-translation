  text: וַ/יִּשְׁלַ֞ח הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם אֶת הֲדֹרָם֙ אֲשֶׁ֣ר עַל הַ/מַּ֔ס וַ/יִּרְגְּמוּ ב֧/וֹ בְנֵֽי יִשְׂרָאֵ֛ל אֶ֖בֶן וַ/יָּמֹ֑ת וְ/הַ/מֶּ֣לֶךְ רְחַבְעָ֗ם הִתְאַמֵּץ֙ לַֽ/עֲל֣וֹת בַּ/מֶּרְכָּבָ֔ה לָ/נ֖וּס יְרוּשָׁלִָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/018.yaml
  text: Then King Rehoboam sent Hadoram[a], who was over the forced labor, but the sons of Israel stoned him with stones, and he died[d][c][b]. And King Rehoboam strengthened himself to get up into the chariot to flee to Jerusalem.
translation:
  language: hi
  text: तब राजा रहूबियाम ने हदोराम[a] को भेजा, जो बेगार का अधिकारी था[b]। और इस्राएलियों[c] ने उसे पत्थरों से मारा, और वह मर गया। तब राजा रहूबियाम ने हिम्मत जुटाई[d] कि रथ पर चढ़कर यरूशलेम भाग जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘हदोराम’; 1 राजा 12:18 के समानांतर वृत्तांत में ‘अदोराम’ है।
    reason: alternative_reading
  - marker: b
    text: या, ‘जो बेगार की श्रम-सेवा के ऊपर नियुक्त था।’ इब्रानी शब्द थोपी गई श्रम-सेवा को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों ने’; यह इस्राएलियों के लिए प्रयुक्त एक राष्ट्रीय पदनाम है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘अपने को दृढ़ किया।’ कुछ अनुवाद प्रसंग के अनुसार इसे ‘जल्दी की’ कहते हैं, पर इब्रानी में शाब्दिक भाव अपने को मजबूत करने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक प्रसंग में שׁלח का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: राजा रहूबियाम
  rationale: हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है और इब्रानी पदबंध का आशय सुरक्षित रखता है।
- source_word: הֲדֹרָם
  choice: हदोराम
  rationale: इतिहास की पुस्तक के इब्रानी पाठ में दिए नामरूप הֲדֹרָם का सीधा लिप्यंतरण; समानांतर राजाओं के वृत्तांत का भिन्न रूप पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר עַל הַמַּס
  choice: जो बेगार के काम का अधिकारी था
  rationale: מַס यहाँ केवल कर नहीं, थोपी गई श्रम-सेवा को सूचित करता है। ‘बेगार’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וַיִּרְגְּמוּ בוֹ ... אֶבֶן
  choice: उसे पत्थरों से मारा
  rationale: क्रिया और ‘पत्थर’ संज्ञा दोनों को बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति दी गई है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: ‘इस्राएल के पुत्र’ यहाँ राष्ट्र के लोगों के लिए इब्रानी मुहावरा है; हिन्दी में ‘इस्राएली’ उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: इब्रानी की साधारण कथात्मक परिणति को कारणात्मक विस्तार दिए बिना सुरक्षित रखता है।
- source_word: הִתְאַמֵּץ
  choice: हिम्मत जुटाई
  rationale: אמץ के हित्पअेल रूप में अपने को मजबूत या दृढ़ करने का भाव है। ‘हिम्मत जुटाई’ उस आत्म-सुदृढ़ीकरण को स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल शीघ्रता नहीं बनाता।
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: रथ पर चढ़कर
  rationale: עלה की ऊपर चढ़ने की दिशा और रथ पर सवार होने का प्रसंग दोनों स्पष्ट होते हैं।
- source_word: לָנוּס יְרוּשָׁלָם
  choice: यरूशलेम भाग जाए
  rationale: נוּס का मूल भाव खतरे से भागना है; गंतव्य यरूशलेम को स्पष्ट रखा गया है।
theological_decisions:
- issue: הִתְאַמֵּץ में शक्ति/साहस और प्रसंगगत तत्परता का संबंध
  choice: हिम्मत जुटाई
  alternative: जल्दी की
  rationale: मूल धातु दृढ़ या मजबूत होने का भाव देती है, न कि सीधे गति का। प्रसंग में तात्कालिकता निहित है, पर उसे मूल अर्थ के स्थान पर नहीं रखा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण रखी गई है। ‘बेगार’ सामान्य पाठक के लिए बोधगम्य ऐतिहासिक शब्द है। पहले वाक्य की हिंसा को न तो नरम किया गया है, न ‘और वह मर गया’ को कारणात्मक व्याख्या में बदला गया है। दूसरे वाक्य में मूल के आत्म-सुदृढ़ीकरण और प्रसंग की आपात स्थिति के बीच तनाव को ‘हिम्मत जुटाई’ से सुरक्षित रखा गया है।
