  text: וְ/עַתָּ֗ה אָבִ/י֙ הֶעְמִ֤יס עֲלֵי/כֶם֙ עֹ֣ל כָּבֵ֔ד וַ/אֲנִ֖י אֹסִ֣יף עַֽל עֻלְּ/כֶ֑ם אָבִ֗/י יִסַּ֤ר אֶתְ/כֶם֙ בַּ/שּׁוֹטִ֔ים וַ/אֲנִ֖י בָּֽ/עֲקְרַבִּֽים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I with scorpions.
translation:
  language: hi
  text: अब मेरे पिता ने तुम पर भारी जुआ लादा था, पर मैं तुम्हारे जुए का भार और बढ़ाऊँगा। मेरे पिता ने तुम्हें कोड़ों से ताड़ना दी थी, पर मैं तुम्हें बिच्छुओं से[a] ताड़ना दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः ‘बिच्छू-जैसे कोड़ों से’, अर्थात नुकीले सिरों या काँटों वाले कोड़ों से; इब्रानी में शब्दशः ‘बिच्छुओं से’ है।
    reason: lexical_alternative
