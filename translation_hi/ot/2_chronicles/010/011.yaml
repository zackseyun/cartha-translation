  rationale: शाब्दिक ‘तुम्हारे जुए में और जोड़ूँगा’ हिन्दी में अस्पष्ट है; यह रूप उसी वृद्धि के भाव और जुए के रूपक दोनों को स्पष्ट रखता है।
- source_word: יִסַּר
  choice: ताड़ना दी
  rationale: क्रिया में दंड देकर अनुशासित करने का भाव है; ‘ताड़ना देना’ आधुनिक धार्मिक-गंभीर हिन्दी में इस दंडात्मक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: בַּשּׁוֹטִים
  choice: कोड़ों से
  rationale: שׁוֹט के लिए ‘कोड़ा’ स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: בָּעֲקְרַבִּים
  choice: बिच्छुओं से
  rationale: इब्रानी में शब्दशः ‘बिच्छुओं’ है। संभव औजारगत अर्थ को मुख्य पाठ में निश्चित किए बिना पादटिप्पणी में दिया गया है।
