  text: And all Israel[a], because the king did not listen to them, answered the king, saying, “What share do we have in David? We have no inheritance in the son of Jesse. Each man to your tents, O Israel! Now see to your own house[b], David.” So all Israel went to their tents.
translation:
  language: hi
  text: जब राजा ने उनकी बात नहीं मानी, तब सारे इस्राएल ने राजा को उत्तर दिया, “दाऊद में हमारा क्या हिस्सा है? यिशै के पुत्र में हमारी कोई विरासत नहीं। हे इस्राएल, हर एक अपने तंबुओं को लौट जाए![a] अब अपना घर संभाल, हे दाऊद!”[b] तब सारा इस्राएल अपने-अपने तंबुओं को चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अपने तंबुओं को।” यह अपने-अपने निवास-स्थान को लौट जाने का आह्वान है।
    reason: मुहावरे का शाब्दिक चित्र और आशय स्पष्ट करना।
  - marker: b
    text: “घर” के लिए इब्रानी शब्द यहाँ दाऊद के परिवार या राजवंश की ओर भी संकेत कर सकता है।
    reason: मूल शब्द की घरेलू और राजवंशीय अर्थ-संभावना सुरक्षित रखना।
lexical_decisions:
- source_word: שָׁמַע
  choice: बात मानी
  rationale: यहाँ क्रिया का अर्थ केवल सुनना नहीं, बल्कि लोगों की बात पर ध्यान देकर उसे स्वीकार करना है; ‘बात नहीं मानी’ आधुनिक हिन्दी में यही आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּשִׁיבוּ
  choice: उत्तर दिया
  rationale: שוב से बना यह रूप यहाँ मुहावरे के रूप में प्रत्युत्तर देने का अर्थ रखता है।
- source_word: חֵלֶק
  choice: हिस्सा
  rationale: यह दाऊद के साथ राजनीतिक-सामुदायिक भागीदारी को नकारने वाला रूपक है; ‘हिस्सा’ उसे स्पष्ट और स्वाभाविक रखता है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह पैतृक अधिकार, भाग और वंशगत संबंध की भाषा को बनाए रखता है।
- source_word: בְּבֶן יִשַׁי
  choice: यिशै के पुत्र में
  rationale: इब्रानी पूर्वसर्ग और ‘किसी में हिस्सा/विरासत होने’ की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: אִישׁ
  choice: हर एक
  rationale: एकवचन संज्ञा यहाँ वितरणात्मक है। ‘हर एक अपने-अपने’ हिन्दी में प्रत्येक व्यक्ति को संबोधित करने का स्वाभाविक ढंग है, जबकि अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: לְאֹהָלֶיךָ
  choice: अपने-अपने डेरे को
  rationale: मूल का शाब्दिक चित्र ‘डेरों’ का है और इसका मुहावरेदार आशय अपने-अपने स्थान को लौट जाना है; दोनों को पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רְאֵה בֵיתְךָ
  choice: अपने घराने को सँभाल
  rationale: यह दाऊद को अपने ही घर अथवा राजवंश की चिंता करने के लिए कहने वाला तिरस्कारपूर्ण आदेश है। ‘घराना’ घरेलू और वंशगत दोनों संकेतों को धारण कर सकता है।
- source_word: לְאֹהָלָיו
  choice: अपने-अपने डेरे को
  rationale: मूल में सामूहिक ‘सारा इस्राएल’ के बाद रूप व्याकरणतः एकवचन है; वितरणात्मक हिन्दी ‘अपने-अपने’ उसके वास्तविक आशय को स्पष्ट करती है।
theological_decisions:
- issue: दाऊद के साथ संबंध को नकारने वाला राजनीतिक सूत्र
  choice: “दाऊद में हमारा क्या हिस्सा है? यिशै के पुत्र में हमारी कोई विरासत नहीं।”
  alternative: “दाऊद से हमारा क्या लेना-देना? यिशै के पुत्र से हमारा कोई संबंध नहीं।”
  rationale: चुना हुआ पाठ मूल की ‘हिस्सा’ और ‘विरासत’ संबंधी वाचायी तथा वंशगत भाषा को आधुनिक राजनीतिक मुहावरे में विलीन नहीं करता।
- issue: אִישׁ का वितरणात्मक पुल्लिंग रूप
  choice: हर एक अपने-अपने डेरे को जाए
  alternative: हर पुरुष अपने डेरे को जाए
  rationale: इस प्रसंग में संज्ञा वितरणात्मक रूप से समुदाय के प्रत्येक सदस्य के लिए प्रयुक्त है। हिन्दी का पुल्लिंग क्रियारूप स्रोत की व्याकरणिक बनावट से संगत है, जबकि ‘हर पुरुष’ अर्थ को आवश्यकता से अधिक जैविक लिंग तक सीमित कर सकता है।
- issue: בֵיתְךָ में घर और राजवंश का अर्थ-संबंध
  choice: अपने घराने को सँभाल
  alternative: अपने घर की देखभाल कर
  rationale: ‘घराना’ दाऊद के परिवार और उसके राजवंश—दोनों संभावित संकेतों को खुला रखता है और आदेश की तिरस्कारपूर्ण शक्ति भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। संवाद में विद्रोही उद्घोष की संक्षिप्तता और तीखापन बनाए रखा गया है। ‘यिशै’ स्रोत-निकट नामरूप है; ‘डेरे’ ऐतिहासिक चित्र को बचाता है, और पादटिप्पणी उसका मुहावरेदार आशय बताती है।
