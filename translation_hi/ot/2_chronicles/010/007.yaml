  register: आधुनिक मानक हिंदी का सम्मानपूर्ण और सुबोध राजकीय संवाद। राजा के लिए ‘आप’ का प्रयोग किया गया है। ‘प्रजा’ राजनीतिक-सामाजिक संदर्भ को स्पष्ट करता है, और वाक्य की शर्तात्मक संरचना मूल हिब्रू के क्रम के निकट रखी गई है।
