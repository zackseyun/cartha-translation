base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/007.yaml
  text: They spoke to him[a], saying, “If you will be good to this people, and if you please them and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “यदि आप इस प्रजा के साथ भलाई करें, उन्हें प्रसन्न करें[a] और उनसे अच्छी बातें कहें, तो वे सदा[b] आपके सेवक बने रहेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन पर कृपा करें।” हिब्रू क्रिया का अर्थ किसी से प्रसन्न होना या उसके साथ कृपापूर्वक व्यवहार करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वे निरंतर आपकी सेवा करते रहेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּהְיֶה לְטוֹב
  choice: भलाई करें
  rationale: यह हिब्रू मुहावरा इस प्रजा के हित में अच्छा और कृपालु व्यवहार करने का भाव देता है। ‘भलाई करें’ लाभकारी शासन के व्यापक संबंधपरक अर्थ को बनाए रखता है।
- source_word: לְהָעָם הַזֶּה
  choice: इस प्रजा के साथ
  rationale: राजा और उसके अधीन लोगों के राजनीतिक संदर्भ में עָם के लिए ‘प्रजा’ स्वाभाविक है; ‘के साथ’ हिंदी में भला व्यवहार करने का संबंध स्पष्ट करता है।
- source_word: וּרְצִיתָם
  choice: उन्हें प्रसन्न करें
  rationale: רצה यहाँ लोगों को संतुष्ट या प्रसन्न करके उनका अनुग्रह जीतने का भाव दे सकता है। मुख्य पाठ में ‘प्रसन्न करें’ प्रसंगानुकूल और सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְדִבַּרְתָּ אֲלֵהֶם דְּבָרִים טוֹבִים
  choice: उनसे अच्छी बातें कहें
  rationale: यह चयन דבר क्रिया और संज्ञा की अभिव्यक्ति तथा טוֹבִים के ‘अच्छी’ भाव को यथासंभव बनाए रखते हुए स्वाभाविक हिंदी देता है।
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: आपके सेवक बने रहेंगे
  rationale: यहाँ עֲבָדִים राजनीतिक निष्ठा और राजकीय सेवा को दर्शाता है, दासत्व की संस्था को नहीं। ‘सेवक’ संज्ञात्मक संरचना बनाए रखता है और ‘बने रहेंगे’ स्थायी निष्ठा व्यक्त करता है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है, जिसका प्रसंगगत आशय निरंतर या जीवनभर सेवा करना है। आधुनिक हिंदी में ‘सदा’ संक्षिप्त और स्वाभाविक है।
