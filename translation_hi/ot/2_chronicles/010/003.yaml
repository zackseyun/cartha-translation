  yaml_path: translation/ot/2_chronicles/010/003.yaml
  text: So they sent and called for him[a], and Jeroboam and all Israel came and spoke to Rehoboam, saying,
translation:
  language: hi
  text: तब उन्होंने भेजकर उसे बुलाया[a]। यारोबाम और सारा इस्राएल आए और रहूबियाम से बोले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने संदेश भेजकर उसे बुलाया।” इब्रानी में ‘भेजा’ क्रिया का कर्म स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ וַיִּקְרְאוּ לוֹ
  choice: उन्होंने संदेश भेजकर यारोबाम को बुलवाया
  rationale: שׁלח का कर्म इब्रानी में निहित है और उसके बाद קרא ל आता है। हिंदी में ‘संदेश भेजकर ... बुलवाया’ स्वाभाविक रूप से दोनों क्रियाओं को व्यक्त करता है; पादटिप्पणी अधिक निकटवर्ती विकल्प बताती है।
- source_word: וַיָּבֹא יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: यारोबाम और समस्त इस्राएल आए
  rationale: व्यक्तिनामों को प्रचलित हिंदी बाइबलीय रूप में रखा गया है। ‘समस्त इस्राएल’ राष्ट्रीय-सामूहिक अभिव्यक्ति को बनाए रखता है; हिंदी में संयुक्त कर्ता के अनुसार बहुवचन ‘आए’ स्वाभाविक है।
- source_word: וַיְדַבְּרוּ אֶל רְחַבְעָם
  choice: रहूबियाम से बोले
  rationale: דבר אל को स्वाभाविक और गरिमापूर्ण हिंदी में ‘से बोले’ किया गया है, और इससे अगले पद में आने वाले प्रत्यक्ष कथन की भूमिका बनती है।
- source_word: לֵאמֹר
  choice: अल्पविराम द्वारा अगले प्रत्यक्ष कथन से संबंध
  rationale: हिंदी में ‘यह कहते हुए’ जोड़ना यहाँ अनावश्यक और कुछ बोझिल होता। पदांत का अल्पविराम स्रोत में अगले कथन की ओर बढ़ते वाक्य को सुरक्षित रखता है।
