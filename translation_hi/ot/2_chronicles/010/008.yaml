translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बुज़ुर्गों’ और ‘जवानों’ का विरोध मूल पाठ के आयु-आधारित अंतर को बनाए रखता है; दरबारी मुहावरा मुख्य पाठ में सुरक्षित है और पादटिप्पणी में उसका भाव स्पष्ट किया गया है।
