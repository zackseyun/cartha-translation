  yaml_path: translation/ot/2_chronicles/010/008.yaml
  text: But he abandoned the advice of the elders that they had given him[a], and consulted with the young men who had grown up with him, who stood before him.
translation:
  language: hi
  text: परन्तु उसने बुज़ुर्गों की उस सलाह को ठुकरा दिया जो उन्होंने उसे दी थी, और उन युवा पुरुषों से सलाह की जो उसके साथ बड़े हुए थे और उसके सामने खड़े रहते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उसकी सेवा में उपस्थित रहते थे अथवा उसकी सेवा करते थे।
    reason: ‘उसके सामने खड़े रहते थे’ दरबारी मुहावरा है, जो नियमित उपस्थिति या सेवा का संकेत दे सकता है।
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: छोड़ दी
  rationale: עזב का मूल अर्थ छोड़ना या त्यागना है। यहाँ राजा ने बुज़ुर्गों की सलाह न मानकर दूसरी सलाह ली; ‘छोड़ दी’ इस अस्वीकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲצַת הַזְּקֵנִים
  choice: बुज़ुर्गों की ... सलाह
  rationale: עֵצָה के लिए ‘सलाह’ आधुनिक हिन्दी में सहज है, और זְקֵנִים यहाँ आयु तथा वरिष्ठ सलाहकार की भूमिका—दोनों का संकेत देता है।
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: जो उन्होंने उसे दी थी
  rationale: मूल में ‘जिससे उन्होंने उसे सलाह दी’ का भाव है। ‘सलाह’ पहले आ चुका है, इसलिए हिन्दी में अनावश्यक पुनरावृत्ति से बचते हुए यही अर्थ रखा गया है।
- source_word: וַיִּוָּעַץ אֶת
  choice: से सलाह की
  rationale: निफ़अल रूप परस्पर विचार-विमर्श या परामर्श करने को व्यक्त करता है। ‘से सलाह की’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הַיְלָדִים
  choice: जवानों
  rationale: शब्द का शाब्दिक अर्थ बच्चे या लड़के भी हो सकता है, पर प्रसंग में ये राजा के साथ पले-बढ़े वयस्क समवयस्क और दरबारी हैं; इसलिए ‘जवानों’ उपयुक्त है।
- source_word: אֲשֶׁר גָּדְלוּ אִתּוֹ
  choice: जो उसके साथ बड़े हुए थे
  rationale: यह उनके साझा पालन-पोषण और पहले से चले आ रहे संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָעֹמְדִים לְפָנָיו
  choice: उसके सामने खड़े रहते थे
  rationale: शाब्दिक दरबारी बिंब को मुख्य पाठ में रखा गया है; यह नियमित उपस्थिति या सेवा का मुहावरा भी हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
