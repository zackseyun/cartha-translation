  yaml_path: translation/ot/2_chronicles/010/002.yaml
  text: And when Jeroboam son of Nebat heard it (for he was in Egypt[a], where he had fled from before King Solomon)[b], Jeroboam returned from Egypt.
translation:
  language: hi
  text: जब नबात के पुत्र यारोबाम ने यह सुना[a]—उस समय वह मिस्र में था, जहाँ वह राजा सुलैमान के सामने से भाग गया था[b]—तो यारोबाम मिस्र से लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसके विषय में सुना।” इब्रानी में सुनने की बात का कर्म स्पष्ट रूप से नहीं दिया गया है; संदर्भ से पता चलता है कि यारोबाम ने क्या सुना।
    reason: lexical_alternative
  - marker: b
    text: या, “जहाँ वह राजा सुलैमान से बचकर भाग गया था।” शाब्दिक अर्थ है, “राजा सुलैमान के सामने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने यह सुना
  rationale: היה के साथ infinitive construct यहाँ कालसूचक उपवाक्य आरम्भ करता है। आधुनिक हिन्दी में ‘जब ... ने यह सुना’ स्वाभाविक रूप से कथानक की प्रगति व्यक्त करता है; ‘और ऐसा हुआ’ जोड़ना अनावश्यक रूप से शाब्दिक होता।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: वंशसूचक construct phrase को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है; नामों का मानक हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: וְהוּא בְמִצְרַיִם
  choice: उस समय वह मिस्र में था
  rationale: यह पृष्ठभूमि बताने वाला parenthetical clause है। ‘उस समय’ मुख्य ‘जब’ उपवाक्य से इसका संबंध स्पष्ट करता है और हिन्दी में सहज है।
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי שְׁלֹמֹה הַמֶּלֶךְ
  choice: जहाँ वह राजा सुलैमान के सामने से भाग गया था
  rationale: אֲשֶׁר को मिस्र से जोड़ते हुए ‘जहाँ’ किया गया है। מִפְּנֵי का अधिक निकट अर्थ ‘के सामने से’ रखा गया है, जबकि पादटिप्पणी अधिक मुहावरेदार विकल्प बताती है।
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: इस कथात्मक संदर्भ में שוב का अर्थ किसी स्थान से वापस आना है, न कि पश्चात्ताप करना। ‘लौट आया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से
  rationale: מן स्रोत अथवा प्रस्थान-बिंदु को चिह्नित करता है।
