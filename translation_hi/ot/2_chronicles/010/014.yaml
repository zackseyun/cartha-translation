base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/014.yaml
  text: He spoke to them according to the advice of the young men[a], saying, “I will make your yoke heavier, and I will add to it. My father disciplined you with whips, but I with scorpions.”
translation:
  language: hi
  text: उसने युवकों की सलाह के अनुसार उनसे कहा, “मैं तुम्हारा जूआ और भारी करूँगा और उस पर और भार जोड़ूँगा। मेरे पिता ने तुम्हें कोड़ों से ताड़ना दी, पर मैं तुम्हें बिच्छुओं[a] से ताड़ना दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः इसका अर्थ ‘बिच्छू-जैसे कोड़ों’ से है, अर्थात ऐसे कोड़े जिनमें नुकीले सिरे या काँटे लगे हों; इब्रानी में शाब्दिक रूप से ‘बिच्छुओं से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: उसने ... कहा
  rationale: דבר का सामान्य अर्थ ‘बोलना/कहना’ है। यहाँ यह रहूबियाम के उत्तर को प्रस्तुत करता है; हिंदी में ‘उसने उनसे कहा’ स्वाभाविक रहते हुए मूल के निकट है।
- source_word: כַּעֲצַת הַיְלָדִים
  choice: उन जवानों की सलाह के अनुसार
  rationale: עֵצָה ‘सलाह’ है और כ तुल्यता/अनुरूपता व्यक्त करता है। הַיְלָדִים इस प्रसंग में बालकों के बजाय रहूबियाम के युवा सलाहकारों को दर्शाता है, इसलिए ‘जवानों’ उपयुक्त है।
- source_word: אַכְבִּיד אֶת עֻלְּכֶם
  choice: मैं तुम्हारा जूआ और भारी कर दूँगा
  rationale: כבד का हिफ़ील रूप कारणवाचक है। पहले से विद्यमान जुए के भार को बढ़ाने की बात होने के कारण ‘और भारी कर दूँगा’ आशय स्पष्ट करता और जुए का रूपक बनाए रखता है।
- source_word: וַאֲנִי אֹסִיף עָלָיו
  choice: और उसमें और बढ़ाऊँगा
  rationale: יסף עם על का अर्थ किसी वस्तु में और जोड़ना या उसे बढ़ाना है। सर्वनाम का स्वाभाविक पूर्वपद ‘जूआ’ है; इसे स्पष्ट रूप से ‘बोझ’ कहकर रूपक को सीमित नहीं किया गया।
- source_word: יִסַּר
  choice: अनुशासित किया / अनुशासित करूँगा
  rationale: יסר में अनुशासन, ताड़ना और दंड का अर्थ-क्षेत्र है। ‘अनुशासित’ मूल की पुनरावृत्ति और अर्थगत तनाव बनाए रखता है, यद्यपि प्रसंग में कठोर दंड निहित है।
- source_word: בַּשּׁוֹטִים
  choice: कोड़ों से
  rationale: שׁוֹט का अर्थ कोड़ा या चाबुक है। ‘कोड़ों से’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בָּעֲקְרַבִּים
  choice: बिच्छुओं से
  rationale: עַקְרַב का शाब्दिक अर्थ ‘बिच्छू’ है। संभवतः यह नुकीले या काँटेदार कठोर कोड़ों का रूपक है, पर मुख्य पाठ में सजीव हिब्रू अभिव्यक्ति सुरक्षित रखी गई है और संभावित अर्थ पादटिप्पणी में दिया गया है।
