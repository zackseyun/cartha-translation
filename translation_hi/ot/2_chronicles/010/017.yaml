  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל הַ/יֹּֽשְׁבִ֖ים בְּ/עָרֵ֣י יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ עֲלֵי/הֶ֖ם רְחַבְעָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/017.yaml
  text: But Rehoboam reigned over the children of Israel who lived in the cities of Judah[a].
translation:
  language: hi
  text: परन्तु यहूदा के नगरों में रहनेवाले इस्राएलियों पर रहूबियाम ने राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי יִשְׂרָאֵל
  choice: परन्तु ... इस्राएलियों
  rationale: בְּנֵי יִשְׂרָאֵל यहाँ जातिसूचक पद है, इसलिए आधुनिक हिन्दी में स्वाभाविक रूप से ‘इस्राएलियों’ कहा गया है। וּ को पिछले पद में उत्तरी गोत्रों के विद्रोह से विरोध दिखाने के लिए ‘परन्तु’ अनूदित किया गया है।
- source_word: הַיֹּשְׁבִים
  choice: रहनेवाले
  rationale: ישב का कृदन्त यहाँ किसी स्थान में निवास करने का अर्थ देता है; ‘रहनेवाले’ इसकी जारी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: यह सीधा स्थानवाचक संबंध है और यहूदा के भौगोलिक क्षेत्र के नगरों को सूचित करता है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य किया
  rationale: מלך का यह रूप कथा में रहूबियाम द्वारा उन लोगों पर राज करने को बताता है; ‘राज्य किया’ मानक और गरिमापूर्ण हिन्दी है।
- source_word: עֲלֵיהֶם
  choice: उन ... पर
  rationale: על तथा बहुवचन सर्वनाम-प्रत्यय शासन के अधीन लोगों को सूचित करते हैं; हिन्दी वाक्य-रचना में इसका अर्थ ‘इस्राएलियों पर’ में समाहित है।
- source_word: רְחַבְעָם
  choice: रहूबियाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions: []
