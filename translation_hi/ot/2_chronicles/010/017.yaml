  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘इस्राएलियों’ जातिसूचक अर्थ को स्पष्ट करता है और अनावश्यक रूप से शाब्दिक ‘इस्राएल के पुत्रों’ से बचता है।
