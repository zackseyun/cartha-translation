  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ע֛וֹד שְׁלֹ֥שֶׁת יָמִ֖ים וְ/שׁ֣וּבוּ אֵלָ֑/י וַ/יֵּ֖לֶךְ הָ/עָֽם׃ס
