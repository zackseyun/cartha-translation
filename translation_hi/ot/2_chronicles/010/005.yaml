  text: And he said to them[a], “Come back to me in three days.” So the people went away.
translation:
  language: hi
  text: तब उसने उनसे कहा, “तीन दिन बाद मेरे पास फिर आना।” तब लोग चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: तब उसने उनसे कहा
  rationale: वाव-क्रमिक कथन को स्वाभाविक हिन्दी कथाप्रवाह में ‘तब’ से व्यक्त किया गया है; אֲלֵהֶם का अर्थ ‘उनसे’ है।
- source_word: עוֹד שְׁלֹשֶׁת יָמִים
  choice: तीन दिन बाद
  rationale: शाब्दिक रूप ‘अभी/और तीन दिन’ है, पर यहाँ आशय तीन दिन बीतने के बाद लौटने का है; ‘तीन दिन बाद’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וְשׁוּבוּ אֵלָי
  choice: मेरे पास फिर आना
  rationale: שׁוּב के बहुवचन आदेश और אֵלַי की गंतव्य-दिशा को स्वाभाविक हिन्दी में व्यक्त करता है। ‘लौट आना’ भी संभव है, पर ‘फिर आना’ प्रसंग में अधिक सहज है।
- source_word: וַיֵּלֶךְ הָעָם
  choice: तब लोग चले गए
  rationale: הָעָם सामूहिक संज्ञा है; हिन्दी में यहाँ ‘लोग’ स्वाभाविक है। וַיֵּלֶךְ की क्रमिक क्रिया को ‘तब’ से और प्रस्थान के भाव को ‘चले गए’ से व्यक्त किया गया है।
