source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/009.yaml
  text: And he said to them[a], “What do you advise, so that we may answer this people who have spoken to me, saying, ‘Lighten the yoke that your father put on us’?”
translation:
  language: hi
  text: उसने उनसे कहा, “तुम क्या सलाह देते हो कि हम इस प्रजा को उत्तर दें, जिसने मुझसे कहा है, ‘उस जुए को हल्का कर दीजिए[a], जिसे आपके पिता ने हम पर डाल दिया था’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस बोझ को कम कर दीजिए, जिसे आपके पिता ने हम पर डाल दिया था।” इब्रानी में शाब्दिक रूप से, “जुए से हल्का कीजिए” है; ‘जुआ’ कठोर श्रम या दमनकारी शासन का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֽוֹעָצִים
  choice: क्या सलाह देते हो
  rationale: यह יעץ से निकला परामर्श माँगने वाला रूप है; हिंदी में यह सीधा और स्वाभाविक प्रश्न है।
- source_word: וְנָשִׁיב דָּבָר
  choice: कि हम ... उत्तर दें
  rationale: शाब्दिक रूप से ‘वचन लौटाएँ’ यहाँ उत्तर देने का मुहावरा है; ‘कि’ प्रसंग में निहित उद्देश्य को सहजता से व्यक्त करता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: एकवचन सामूहिक संज्ञा के भाव को बनाए रखते हुए ‘प्रजा’ राजकीय प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: דִּבְּרוּ אֵלַי
  choice: जिसने मुझसे कहा है
  rationale: पूर्व में कही गई बात वर्तमान विचार-विमर्श का आधार है; हिंदी पूर्णकाल उसका वर्तमान संबंध बनाए रखता है।
- source_word: לֵאמֹר
  choice: कहा है, ‘...’
  rationale: उद्धरणसूचक रूप को हिंदी में प्रत्यक्ष उद्धरण से स्वाभाविक ढंग से व्यक्त किया गया है; अलग से ‘यह कहते हुए’ अनावश्यक होता।
- source_word: הָקֵל
  choice: हल्का कर दीजिए
  rationale: हिफ़ील आज्ञार्थक का अर्थ किसी भार को हल्का करना है; विनम्र बहुवचन-सम्मानसूचक रूप राजा से की गई प्रजा की विनती के अनुकूल है।
- source_word: מִן הָעֹל
  choice: उस जुए को
  rationale: עֹל का मूल चित्र ‘जुआ’ है, जो कठोर श्रम या दमनकारी शासन का रूपक है; हिंदी में यह बिंब सुरक्षित रखा गया है।
- source_word: נָתַן ... עָלֵינוּ
  choice: हम पर डाल दिया था
  rationale: थोपे गए जुए या भार के लिए यह स्वाभाविक हिंदी मुहावरा है और इब्रानी के अर्थ को बनाए रखता है।
- source_word: אָבִיךָ
  choice: आपके पिता
  rationale: रहूबियाम को संबोधित प्रजा के उद्धरण में सम्मानसूचक ‘आपके’ सामाजिक प्रसंग के अनुरूप है।
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: उसने उनसे कहा
  rationale: कथात्मक क्रम को सरल आधुनिक हिंदी में प्रस्तुत करता है; पद को अलग उद्धृत करने पर अनावश्यक आरंभिक ‘और’ से बचा गया है।
