translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। राजा को उद्धृत विनती में सम्मानसूचक ‘आप’ रखा गया है, जबकि राजा अपने सलाहकारों से ‘तुम’ कहता है। मूल का ‘जुआ’ रूपक मुख्य पाठ में सुरक्षित है।
