  text: इस प्रकार इस्राएल आज तक दाऊद के घराने के विरुद्ध विद्रोह में बना रहा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल ने दाऊद के घराने के विरुद्ध विद्रोह किया।” इब्रानी क्रिया का अनुवाद सामान्य भूतकाल में भी किया जा सकता है; “आज तक” उस विद्रोह से उत्पन्न स्थिति के लेखक के समय तक बने रहने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: विद्रोह करता आया है
  rationale: פשע यहाँ किसी सत्ता के विरुद्ध राजनीतिक विद्रोह को दर्शाता है। ‘विद्रोह करता आया है’ आगे के वाक्यांश ‘आज के दिन तक’ के साथ विद्रोह की अब तक चली आ रही स्थिति व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह नाम यहाँ दाऊद के राजवंश से अलग हुए उत्तरी गोत्रों के सामूहिक समुदाय को सूचित करता है; मुख्य पाठ में इसका विस्तार किए बिना नाम ही रखा गया है।
- source_word: בְּבֵית דָּוִיד
  choice: दाऊद के घराने के विरुद्ध
  rationale: פשע के साथ ב उस पक्ष को चिह्नित करता है जिसके विरुद्ध विद्रोह हुआ। ‘घराना’ यहाँ दाऊद के राजवंश का स्वाभाविक हिंदी संकेत है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह मानक इब्रानी मुहावरा लेखक के समय तक स्थिति के जारी रहने को व्यक्त करता है।
