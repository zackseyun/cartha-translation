  text: וַ/יְדַבְּר֣וּ אִתּ֗/וֹ הַ/יְלָדִים֙ אֲשֶׁ֨ר גָּדְל֣וּ אִתּ/וֹ֮ לֵ/אמֹר֒ כֹּֽה תֹאמַ֡ר לָ/עָם֩ אֲשֶׁר דִּבְּר֨וּ אֵלֶ֜י/ךָ לֵ/אמֹ֗ר אָבִ֨י/ךָ֙ הִכְבִּ֣יד אֶת עֻלֵּ֔/נוּ וְ/אַתָּ֖ה הָקֵ֣ל מֵ/עָלֵ֑י/נוּ כֹּ֚ה תֹּאמַ֣ר אֲלֵ/הֶ֔ם קָֽטָנִּ֥/י עָבָ֖ה מִ/מָּתְנֵ֥י אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/010.yaml
  text: The young men who had grown up with him spoke to him[a], saying, “This is what you shall say to the people who spoke to you, saying, ‘Your father made our yoke heavy, but you make it lighter for us.’ Thus you shall say to them[b], ‘My little finger is thicker than my father’s waist.’”
translation:
  language: hi
  text: 'जो युवक उसके साथ बड़े हुए थे, उन्होंने उससे कहा, “तू उन लोगों से, जिन्होंने तुझसे कहा है, ‘तेरे पिता ने हमारा जूआ भारी कर दिया था, पर तू इसे हम पर से हल्का कर दे,’ यह कहना। तू उनसे यह कहना: ‘मेरी छोटी उँगली[a] मेरे पिता की कमर से अधिक मोटी है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मेरी लघुता मेरे पिता की कमर से मोटी है”; इस अभिव्यक्ति का सामान्य अर्थ “मेरी छोटी उँगली मेरे पिता की कमर से मोटी है” समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים
  choice: जवान
  rationale: यहाँ शब्द छोटे बच्चों के लिए नहीं, बल्कि रहूबियाम के साथ पले-बढ़े युवा साथियों या सलाहकारों के लिए है; ‘जवान’ इस सामाजिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גָּדְלוּ אִתּוֹ
  choice: उसके साथ बड़े हुए थे
  rationale: यह पदबंध साझा परवरिश और साथ-साथ बड़े होने का भाव देता है।
- source_word: כֹּה תֹאמַר
  choice: तू यह कहना
  rationale: यह निर्देशात्मक कथन-सूत्र का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप है।
- source_word: אָבִיךָ הִכְבִּיד אֶת עֻלֵּנוּ
  choice: तेरे पिता ने हमारा जूआ भारी कर दिया था
  rationale: ‘जूआ’ मूल पाठ के ठोस रूपक को बनाए रखता है; क्रिया उसे भारी और बोझिल किए जाने का भाव देती है।
- source_word: הָקֵל מֵעָלֵינוּ
  choice: उसे हमारे ऊपर से हलका कर दे
  rationale: यह रूप מֵעָלֵינוּ के ‘हमारे ऊपर से’ वाले स्थानिक और राहत-सूचक भाव को सुरक्षित रखता है।
- source_word: קָטָנִּי
  choice: मेरी छोटी उँगली
  rationale: शाब्दिक रूप अस्पष्ट ‘मेरी छोटाई’ है, पर समानांतर पद और प्रचलित मुहावरे के आधार पर इसका आशय ‘छोटी उँगली’ समझा जाता है।
- source_word: עָבָה
  choice: से भी मोटी है
  rationale: यह तुलना में अधिक मोटा या स्थूल होने का सीधा अर्थ व्यक्त करता है।
- source_word: מִמָּתְנֵי אָבִי
  choice: मेरे पिता की कमर
  rationale: מָתְנַיִם कमर/कटि के क्षेत्र को दर्शाता है; ‘कमर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
