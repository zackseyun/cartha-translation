base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/015.yaml
  text: So the king did not listen to the people[a], for this turn of events was from God, so that Yahweh might establish his word that he had spoken through Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: hi
  text: इस प्रकार राजा ने लोगों की बात नहीं सुनी, क्योंकि यह घटनाक्रम परमेश्वर की ओर से था[a], ताकि याहवे अपना वह वचन पूरा करे, जो उसने शीलोवासी अहिय्याह के द्वारा नबात के पुत्र यारोबाम से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यह मोड़ परमेश्वर की ओर से था।” इब्रानी संज्ञा किसी मोड़, परिस्थिति या कारणकारी घटनाविकास को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: की बात नहीं सुनी
  rationale: यहाँ अर्थ केवल ध्वनि सुनना नहीं, बल्कि लोगों की विनती पर ध्यान देना है। हिंदी मुहावरा ‘बात सुनना’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है, बिना इसे पूरी तरह ‘आज्ञा मानना’ बना देने के।
- source_word: נְסִבָּה
  choice: घटनाक्रम
  rationale: यह संज्ञा मोड़, परिस्थिति या कारणकारी घटनाविकास को सूचित कर सकती है। ‘घटनाक्रम’ कथा में परिस्थितियों के इस प्रकार घटित होने को सहज हिंदी में व्यक्त करता है।
- source_word: מֵעִם הָאֱלֹהִים
  choice: परमेश्वर की ओर से
  rationale: यह पदबंध घटना के दैवी स्रोत को बताता है। ‘की ओर से’ मूल के स्रोतगत अर्थ को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य सूचित करता है; ‘ताकि’ आधुनिक हिंदी में इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: הָקִים
  choice: पूरा करे
  rationale: हिफ़ील रूप का मूल भाव किसी बात को स्थिर या सिद्ध करना है। वचन के संदर्भ में ‘पूरा करे’ सहज हिंदी है और उस भविष्यवाणी को प्रभावी रूप से घटित करने का आशय देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिंदी लिप्यंतरण किया गया है।
- source_word: דְּבָרוֹ
  choice: अपना वह वचन
  rationale: ‘वचन’ भविष्यद्वक्ता द्वारा पहले कही गई ईश्वरीय घोषणा के व्यापक अर्थ को बनाए रखता है; ‘वह’ पूर्वोक्त वचन की निश्चितता दिखाता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: यह इब्रानी मुहावरा माध्यम या प्रतिनिधि को सूचित करता है। ‘के द्वारा’ अहिय्याह की मध्यस्थ भूमिका को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַשִּׁלוֹנִי
  choice: शीलोवासी
  rationale: यह शीलो से संबद्ध व्यक्ति का जातिवाचक/स्थानवाचक विशेषण है। ‘शीलोवासी’ संक्षिप्त और स्पष्ट हिंदी रूप है।
- source_word: בֶּן נְבָט
  choice: नबात के पुत्र
  rationale: इब्रानी पितृनाम का मानक हिंदी रूप।
theological_decisions:
- issue: दैवी कारणता और मानवीय कार्य
  choice: राजा ने लोगों की बात नहीं सुनी, क्योंकि यह घटनाक्रम परमेश्वर की ओर से था
  alternative: राजा ने लोगों की बात नहीं सुनी, क्योंकि इसका कारण परमेश्वर की ओर से था
  rationale: मूल पाठ राजा के निर्णय को वास्तविक मानवीय कार्य के रूप में बताता है और साथ ही घटनाक्रम का स्रोत परमेश्वर को मानता है। अनुवाद दोनों को साथ रखता है और परमेश्वर को सीधे राजा के इनकार का कर्ता बताकर मूल से आगे नहीं जाता।
- issue: יְהוָה परमेश्वर के नाम का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הָקִים का वचन-संबंधी अर्थ
  choice: अपना वह वचन पूरा करे
  alternative: अपने उस वचन को स्थिर करे
  rationale: ‘स्थिर करे’ मूल क्रिया-चित्र के अधिक निकट है, पर आधुनिक हिंदी में भविष्यद्वाणी के घटित होने के लिए ‘वचन पूरा करे’ अधिक स्पष्ट है। यह वचन की सिद्धि बताता है, उसके स्वरूप को संकीर्ण किए बिना।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘बात नहीं सुनी’ सामान्य पाठक के लिए स्वाभाविक है; ‘घटनाक्रम’ दैवी स्रोत और मानवीय निर्णय के बीच मूल पाठ की तनावपूर्ण संगति को बनाए रखता है।
