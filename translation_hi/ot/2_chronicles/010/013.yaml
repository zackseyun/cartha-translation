  text: और राजा ने उन्हें कठोर उत्तर दिया, और राजा रहूबियाम ने बुज़ुर्गों की सलाह को छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנֵם
  choice: उन्हें ... उत्तर दिया
  rationale: ענה के प्रत्यय में बहुवचन कर्म स्पष्ट है; इसलिए ‘उन्हें उत्तर दिया’ मूल की स्पष्टता बनाए रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संज्ञा पर निश्चित उपपद है; हिन्दी कथा-प्रवाह में ‘राजा’ स्वाभाविक रूप से निश्चित संदर्भ व्यक्त करता है।
- source_word: קָשָׁה
  choice: कठोरता से
  rationale: रूपतः यह ‘कठोर’ विशेषण है, पर यहाँ उत्तर देने की रीति बताता है; ‘कठोरता से’ अर्थ और वाक्यगत कार्य दोनों स्पष्ट करता है।
- source_word: וַיַּעֲזֹב
  choice: ठुकरा दी
  rationale: עזב का मूल अर्थ छोड़ना या त्यागना है; सलाह के संदर्भ में ‘ठुकरा दी’ जानबूझकर अस्वीकार करने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: राजा रहूबियाम
  rationale: मूल का पदबंध राजा की पहचान नाम से कराता है; ‘राजा रहूबियाम’ इसका सहज हिन्दी रूप है।
- source_word: עֲצַת
  choice: सलाह
  rationale: यहाँ עֵצָה से आशय राजकीय निर्णय के लिए दी गई सम्मति है; ‘सलाह’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: संदर्भ में ये केवल वृद्ध पुरुष नहीं, बल्कि मान्य वरिष्ठ सलाहकार हैं; बाइबलीय हिन्दी में ‘पुरनिये’ इस सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
