base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/010/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: hi
  text: तब राजा रहूबियाम ने उन वरिष्ठ जनों से सलाह ली, जो उसके पिता सुलैमान के जीवित रहते सुलैमान के सामने उपस्थित रहते थे[a]। उसने उनसे पूछा, “तुम मुझे क्या सलाह देते हो कि मैं इस प्रजा को क्या उत्तर दूँ[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुलैमान के सामने उपस्थित रहते थे” का अर्थ यह भी हो सकता है कि वे आधिकारिक रूप से उसकी सेवा करते या उसके दरबार में रहते थे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इस प्रजा को एक बात लौटाने के लिए।” यह इब्रानी मुहावरा उत्तर देने या प्रत्युत्तर देने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: सलाह ली
  rationale: निफ़अल रूप यहाँ दूसरों से परामर्श लेने को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: הַזְּקֵנִים
  choice: वरिष्ठ जनों
  rationale: शब्द आयु में बड़े पुरुषों के साथ-साथ नेतृत्व या सलाहकारी भूमिका वाले वरिष्ठ लोगों को भी सूचित कर सकता है; यह चयन दोनों पक्षों को यथासंभव खुला रखता है।
- source_word: אֲשֶׁר הָיוּ עֹמְדִים לִפְנֵי
  choice: जो ... उसके सामने उपस्थित रहते थे
  rationale: यह इब्रानी बिंब को बनाए रखता है और साथ ही दरबार में नियमित उपस्थिति या सेवा की सम्भावना को पूरी तरह तय नहीं करता।
- source_word: שְׁלֹמֹה אָבִיו
  choice: उसके पिता सुलैमान
  rationale: सम्बन्ध को स्पष्ट करते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: בִּהְיוֹתוֹ חַי
  choice: सुलैमान के जीवित रहते
  rationale: यह कालगत अर्थ को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: तुम मुझे क्या सलाह देते हो
  rationale: इब्रानी प्रश्न सलाह माँगता है; हिन्दी में ‘क्या सलाह देते हो’ अधिक स्वाभाविक है, और ‘मुझे’ सन्दर्भ में निहित प्राप्तकर्ता को स्पष्ट करता है।
- source_word: לְהָשִׁיב לָעָם הַזֶּה דָּבָר
  choice: कि मैं इस प्रजा को क्या उत्तर दूँ
  rationale: शाब्दिक ‘इस प्रजा को एक बात लौटाऊँ’ इब्रानी मुहावरा है जिसका आशय उत्तर देना है; हिन्दी में अर्थगत समतुल्यता के लिए ‘उत्तर दूँ’ चुना गया है।
- source_word: לֵאמֹר
  choice: उसने उनसे पूछा
  rationale: कथन आरम्भ कराने वाले इब्रानी रूप को प्रसंगानुसार स्वाभाविक हिन्दी में प्रश्नवाचक वचन के परिचय के रूप में व्यक्त किया गया है।
