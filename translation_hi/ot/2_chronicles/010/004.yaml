  yaml_path: translation/ot/2_chronicles/010/004.yaml
  text: Your father made our yoke heavy[a]. So now lighten the hard service of your father and his heavy yoke that he put on us[b], and we will serve you.
translation:
  language: hi
  text: “आपके पिता ने हमारे जुए को कठिन बना दिया था[a]। इसलिए अब आपके पिता की कठिन सेवा और उनके उस भारी जुए को, जो उन्होंने हम पर रखा था, हल्का कर दीजिए; तब हम आपकी सेवा करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे जुए को कठोर बना दिया था” अथवा “हमारे जुए को अत्यंत कठोर बना दिया था।”
    reason: lexical_alternative
lexical_decisions:
