  choice: कठोर बना दिया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है। यह बाद के הַכָּבֵד (‘भारी’) से शब्दगत भेद भी बनाए रखता है।
- source_word: עֻלֵּנוּ
  choice: हमारे जुए को
  rationale: ‘जुआ’ शासन और बोझ के रूपक को सुरक्षित रखता है, जो पद में आगे भी आता है।
- source_word: הָקֵל
  choice: हल्का कर दीजिए
  rationale: आज्ञार्थक क्रिया बोझ घटाने का अनुरोध व्यक्त करती है और जुए के रूपक के साथ स्वाभाविक है।
- source_word: מֵעֲבֹדַת אָבִיךָ הַקָּשָׁה
  choice: अपने पिता की लगाई हुई कठिन सेवा
  rationale: עֲבֹדָה का अर्थ यहाँ राजकीय शासन के अधीन थोपा गया काम या दायित्व है; ‘लगाई हुई’ संदर्भ को स्पष्ट करती है, जबकि ‘सेवा’ राजनीतिक अधीनता का भाव बनाए रखती है।
- source_word: וּמֵעֻלּוֹ הַכָּבֵד
  choice: और उस भारी जुए को
  rationale: ‘भारी जुआ’ मूल रूपक और כָּבֵד के भार-संबंधी अर्थ को सीधे व्यक्त करता है।
- source_word: אֲשֶׁר נָתַן עָלֵינוּ
  choice: जो उन्होंने हम पर रखा था
  rationale: נתן על की ठोस छवि को सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְנַעַבְדֶךָּ
  choice: तब हम आपकी सेवा करेंगे
  rationale: यह बोझ घटाए जाने पर लोगों की प्रत्युत्तर-प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָבִיךָ
  choice: आपके पिता / अपने पिता
  rationale: सुलैमान के प्रत्यक्ष उल्लेख को बनाए रखते हुए राजा के प्रति आधुनिक हिन्दी का सम्मानसूचक संबोधन अपनाया गया है।
