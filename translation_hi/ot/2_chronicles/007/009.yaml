  text: וַֽ/יַּעֲשׂ֛וּ בַּ/יּ֥וֹם הַ/שְּׁמִינִ֖י עֲצָ֑רֶת כִּ֣י חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ עָשׂוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/הֶ/חָ֖ג שִׁבְעַ֥ת יָמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/009.yaml
  text: On the eighth day they held a solemn assembly[b][a], for they observed the dedication of the altar for seven days and the feast for seven days.
translation:
  language: hi
  text: आठवें दिन उन्होंने एक गंभीर सभा आयोजित की[a], क्योंकि उन्होंने सात दिन तक वेदी के समर्पण का उत्सव मनाया[b] और सात दिन तक पर्व मनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सभा” अथवा “समापन-सभा।” इब्रानी शब्द עֲצָרֶת किसी पवित्र पर्व के संदर्भ में आयोजित विशेष, प्रायः समापनकारी सभा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “वेदी का समर्पण सात दिन तक सम्पन्न किया”; अधिक शाब्दिक रूप से, “किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: इब्रानी पाठ केवल ‘आठवें दिन’ कहता है; संदर्भ से पर्व का संबंध स्पष्ट है, इसलिए अनावश्यक शब्द नहीं जोड़े गए।
- source_word: עֲצָרֶת
  choice: पवित्र सभा
  rationale: यह शब्द धार्मिक पर्व के संदर्भ में एक विशेष, प्रायः समापनकारी सभा को दर्शाता है। ‘पवित्र सभा’ सामान्य पाठक के लिए स्वाभाविक है और उसके धार्मिक स्वर को बनाए रखता है; समापन का संभावित भाव पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ संयोजक आठवें दिन की सभा के संबंध में व्याख्यात्मक या कारणसूचक कथन प्रस्तुत करता है।
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: वेदी के समर्पण
  rationale: यह पदबंध वेदी के अनुष्ठानिक समर्पण या उद्घाटन को व्यक्त करता है; ‘समर्पण’ आधुनिक हिन्दी में स्पष्ट और उपयुक्त है।
- source_word: עָשׂוּ
  choice: उत्सव मनाया
  rationale: क्रिया का मूल अर्थ ‘किया’ है, पर धार्मिक आयोजन को सम्पन्न करने के इस संदर्भ में ‘उत्सव मनाया’ स्वाभाविक हिन्दी है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהֶחָג
  choice: और ... पर्व
  rationale: संज्ञा निश्चित पर्व को दर्शाती है। निकटवर्ती संदर्भ से इसकी पहचान हो सकती है, पर इस पद में उसका नाम नहीं दिया गया, इसलिए केवल ‘पर्व’ रखा गया है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और दोनों सात-दिवसीय उल्लेखों को अलग-अलग बनाए रखता है।
theological_decisions:
- issue: वेदी के समर्पण और पर्व की सात-सात दिन की अवधियों का आपसी कालक्रम
  choice: दोनों अवधियों को पाठ के क्रम में अलग-अलग कहा गया है, बिना यह स्पष्ट किए कि वे एक-दूसरे पर चढ़ती थीं या क्रमशः चलीं।
  alternative: व्याख्यात्मक रूप से कुल दिनों या दोनों आयोजनों के सटीक कालक्रम को स्पष्ट करना।
  rationale: इब्रानी पद स्वयं केवल दोनों के लिए सात दिन बताता है; कालक्रम को अधिक स्पष्ट करना वास्तविक पाठगत तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आयोजित की’ और ‘उत्सव मनाया’ के द्वारा एक ही इब्रानी क्रिया की पुनरावृत्ति को प्रसंगानुसार स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
