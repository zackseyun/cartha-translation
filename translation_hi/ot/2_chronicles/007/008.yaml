base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/008.yaml
  text: At that time Solomon kept the feast for seven days[a], and all Israel with him, a very great assembly[b], from Lebo-hamath to the Brook of Egypt.
translation:
  language: hi
  text: उस समय सुलैमान ने सात दिन तक पर्व मनाया, और उसके साथ समस्त इस्राएल था—एक बहुत बड़ी सभा—लेबो-हमात[a] से लेकर मिस्र के नाले[b] तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमात के प्रवेश-स्थान’। इब्रानी पदबंध को स्थान-नाम (‘लेबो-हमात’) या सीमा बताने वाली वर्णनात्मक अभिव्यक्ति—दोनों प्रकार से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘मिस्र की वादी’। इब्रानी शब्द किसी बड़ी नदी के बजाय मौसमी जलधारा या उसके पाट को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶת־הֶחָג
  choice: पर्व मनाया
  rationale: शाब्दिक अर्थ ‘पर्व किया’ है, पर חָג के साथ क्रिया का स्वाभाविक हिन्दी अर्थ पर्व मनाना है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह सरल और स्वाभाविक काल-सूचक अभिव्यक्ति है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: हिन्दी में अवधि को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכָל־יִשְׂרָאֵל עִמּוֹ
  choice: और उसके साथ समस्त इस्राएल भी था
  rationale: ‘समस्त इस्राएल’ के सामूहिक राष्ट्रीय अर्थ और सुलैमान के साथ उनकी सहभागिता को बनाए रखता है।
- source_word: קָהָל גָּדוֹל מְאֹד
  choice: एक बहुत बड़ी सभा
  rationale: קָהָל यहाँ एकत्र लोगों के समुदाय को दर्शाता है; ‘सभा’ स्वाभाविक है और अनावश्यक रूप से कलीसियाई अर्थ नहीं जोड़ता।
- source_word: מִלְּבוֹא חֲמָת
  choice: लेबो-हमात से
  rationale: इस पदबंध को प्रायः उत्तरी सीमा बताने वाले स्थान-नाम के रूप में समझा जाता है; लिप्यंतरण उसकी स्थलनाम-संबंधी शक्ति को सुरक्षित रखता है।
- source_word: עַד נַחַל מִצְרַיִם
  choice: मिस्र के नाले तक
  rationale: נַחַל प्रायः नदी से छोटी या मौसमी जलधारा/सूखी जलधारा की घाटी को सूचित करता है; ‘नाला’ सामान्य हिन्दी में समझने योग्य है।
