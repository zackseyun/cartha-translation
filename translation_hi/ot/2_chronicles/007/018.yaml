source:
  edition: WLC
  text: וַ/הֲקִ֣ימוֹתִ֔י אֵ֖ת כִּסֵּ֣א מַלְכוּתֶ֑/ךָ כַּ/אֲשֶׁ֣ר כָּרַ֗תִּי לְ/דָוִ֤יד אָבִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹֽא יִכָּרֵ֤ת לְ/ךָ֙ אִ֔ישׁ מוֹשֵׁ֖ל בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/018.yaml
  text: then I will establish the throne of your kingdom[a], as I covenanted with David your father, saying, ‘A man to rule over Israel will not be cut off from you.’
translation:
  language: hi
  text: तब मैं तुम्हारे राज्य का सिंहासन स्थिर करूँगा, जैसा मैंने तुम्हारे पिता दाऊद के साथ वाचा बाँधी थी, यह कहते हुए, “इस्राएल पर शासन करनेवाले पुरुष का तुम्हारे यहाँ अभाव न होगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल पर शासन करनेवाला पुरुष तुमसे काटा न जाएगा।”
    reason: इब्रानी לֹא יִכָּרֵת לְךָ के शाब्दिक ‘काटा न जाएगा’ चित्र को सुरक्षित रखने के लिए; मुख्य पाठ उसका स्वाभाविक हिन्दी मुहावरा देता है।
lexical_decisions:
- source_word: וַהֲקִימוֹתִי
  choice: तब मैं … स्थिर करूँगा
  rationale: हिफ़ील रूप का अर्थ ‘स्थापित करना/स्थिर करना’ है। पिछले पद की शर्त के परिणाम को हिन्दी में स्वाभाविक रूप से दिखाने के लिए वाव का अनुवाद ‘तब’ किया गया है।
- source_word: כִּסֵּא מַלְכוּתֶךָ
  choice: तुम्हारे राज्य का सिंहासन
  rationale: इब्रानी की संबंध-संरचना में ‘सिंहासन’ और ‘राज्य’ दोनों संज्ञाओं को बनाए रखता है।
- source_word: כָּרַתִּי לְדָוִיד אָבִיךָ
  choice: तुम्हारे पिता दाऊद के साथ वाचा बाँधकर
  rationale: כרת का वाचागत प्रयोग हिन्दी के प्रचलित बाइबलीय मुहावरे ‘वाचा बाँधना’ से व्यक्त किया गया है; לְדָוִיד को प्रसंगानुसार ‘दाऊद के साथ’ कहा गया है। ‘पिता’ मूल के वंशगत संबंध को बनाए रखता है।
- source_word: לֹא יִכָּרֵת לְךָ אִישׁ
  choice: पुरुष का तुम्हारे यहाँ कभी अभाव न होगा
  rationale: शाब्दिक ‘तुमसे काटा न जाएगा’ आधुनिक हिन्दी में भ्रामक और अस्वाभाविक हो सकता है। चुना हुआ मुहावरा राजवंशीय उत्तराधिकारी के न चुकने का आशय स्पष्ट करता है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ מוֹשֵׁל בְּיִשְׂרָאֵל
  choice: इस्राएल पर शासन करनेवाला पुरुष
  rationale: אִישׁ की पुल्लिंग एकवचन विशिष्टता और מוֹשֵׁל के कृदन्तीय भाव को बनाए रखा गया है। משל के साथ בְּ का शासन-संबंध हिन्दी में ‘पर’ से स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: दाऊदी राजवंश की प्रतिज्ञा का मुहावरा
  choice: इस्राएल पर शासन करनेवाले पुरुष का तुम्हारे यहाँ कभी अभाव न होगा
  alternative: इस्राएल पर शासन करनेवाला पुरुष तुमसे कभी काटा न जाएगा
  rationale: मुख्य पाठ इब्रानी मुहावरे का राजवंशीय आशय स्वाभाविक हिन्दी में देता है, पर प्रतिज्ञा को किसी अतिरिक्त सिद्धान्त से नहीं जोड़ता। मूल का ‘काटा जाना’ वाला रूप पादटिप्पणी में देकर उसकी छवि और वास्तविक भाषिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा बाँधना’ परिचित बाइबलीय पदावली है। उद्धरण में राजवंशीय प्रतिज्ञा को सहज हिन्दी मुहावरे में व्यक्त किया गया है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक अभिव्यक्ति देती है।
