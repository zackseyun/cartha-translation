  text: וְ/הַ/כֹּהֲנִ֞ים עַל מִשְׁמְרוֹתָ֣/ם עֹמְדִ֗ים וְ/הַ/לְוִיִּ֞ם בִּ/כְלֵי שִׁ֤יר יְהוָה֙ אֲשֶׁ֨ר עָשָׂ֜ה דָּוִ֣יד הַ/מֶּ֗לֶךְ לְ/הֹד֤וֹת לַ/יהוָה֙ כִּֽי לְ/עוֹלָ֣ם חַסְדּ֔/וֹ בְּ/הַלֵּ֥ל דָּוִ֖יד בְּ/יָדָ֑/ם וְ/הַ/כֹּהֲנִים֙ מחצצרים נֶגְדָּ֔/ם וְ/כָל יִשְׂרָאֵ֖ל עֹמְדִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/006.yaml
  text: And the priests were standing at their posts[a], and the Levites with the instruments for the song of Yahweh, which David the king had made to give thanks to Yahweh, for his steadfast love endures forever, when David offered praise by their hand; and the priests were blowing trumpets opposite them[c][b], while all Israel was standing.
translation:
  language: hi
  text: और याजक अपने-अपने नियत स्थानों पर खड़े थे, और लेवी यहोवा के स्तुतिगान के वाद्यों के साथ थे[a], जिन्हें राजा दाऊद ने यहोवा को धन्यवाद देने के लिए बनाए थे—“क्योंकि उसकी अटल करुणा सदा बनी रहती है”[b]—जब दाऊद उनके द्वारा स्तुति करता था[c]। और याजक उनके सामने तुरहियाँ बजा रहे थे, जबकि समस्त इस्राएल खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के संगीत के वाद्यों के साथ।” हिब्रू पदबंध का अर्थ यहोवा को समर्पित वाद्य या यहोवा का स्तुतिगान करने में प्रयुक्त वाद्य हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि उसकी अटल करुणा सदा के लिए है।”
    reason: lexical_alternative
  - marker: c
    text: या, “जब दाऊद उनके माध्यम से स्तुति कर रहा था।” हिब्रू वाक्यांश संक्षिप्त है और सम्भवतः लेवियों को दाऊद की स्तुति प्रस्तुत करनेवाले माध्यम के रूप में दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׁמְרוֹתָם
  choice: अपने-अपने नियुक्त स्थानों पर
  rationale: मंदिर-सेवा में निर्धारित स्थान या पहरे का भाव है; यह रूप व्यवस्थित सेवा और वास्तविक स्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּכְלֵי שִׁיר יְהוָה
  choice: उन वाद्यों के साथ ... जिनसे यहोवा का स्तुतिगान किया जाता था
  rationale: यह अनिश्चित संबंध बनाए रखता है कि वाद्य यहोवा के गीत के लिए अथवा यहोवा को समर्पित संगीत के वाद्य थे; मुख्य पाठ संदर्भानुकूल अर्थ देता है और विकल्प पादटिप्पणी में है।
- source_word: לְהוֹדוֹת לַיהוָה
  choice: यहोवा को धन्यवाद देने के लिए
  rationale: हिफ़ील रूप यहाँ आगामी धन्यवाद-सूत्र के कारण विशेषतः धन्यवाद देने का अर्थ देता है।
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: क्योंकि उसकी अटल करुणा सदा बनी रहती है
  rationale: חֶסֶד में स्थिर प्रेम, करुणा और निष्ठा के संयुक्त भाव हैं; 'अटल करुणा' इन्हें सहज हिन्दी में समेटती है, जबकि 'बनी रहती है' हिब्रू मुहावरे का आवश्यक अर्थ खोलता है।
- source_word: בְּהַלֵּל דָּוִיד בְּיָדָם
  choice: जब दाऊद की स्तुति उनके द्वारा की जा रही थी
  rationale: संक्षिप्त हिब्रू रचना में दाऊद और लेवियों की माध्यमिक भूमिका का संबंध अस्पष्ट है; यह अनुवाद दाऊद-सम्बद्ध स्तुति को लेवियों द्वारा प्रस्तुत होते दिखाता है, बिना यह तय किए कि वह रचना थी या प्रतिनिधिक स्तुति।
- source_word: מחצצרים
  choice: तुरहियाँ बजा रहे थे
  rationale: क्रिया विशेष रूप से तुरही फूँककर बजाने को दर्शाती है; हिन्दी में 'तुरहियाँ बजाना' स्वाभाविक है।
- source_word: נֶגְדָּם
  choice: उनके सामने
  rationale: स्थानगत अर्थ 'सामने/आमने-सामने' है; 'उनके सामने' समारोह में व्यवस्था को स्पष्ट रखता है।
- source_word: עֹמְדִים
  choice: खड़े थे / खड़ा था
  rationale: कृदन्त चल रही दृश्यावस्था बताता है; हिन्दी का अपूर्ण भूतकाल यही स्थायी दृश्य प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम है, इसलिए उसे उपाधि 'प्रभु' से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों में परिचित नामरूप 'यहोवा' अपनाया गया; 'याहवे' संभावित विद्वत्तापरक उच्चारण है।
- issue: חֶסֶד का अर्थक्षेत्र
  choice: अटल करुणा
  alternative: अटल प्रेम / वाचा की निष्ठा
  rationale: शब्द को केवल दया या केवल वाचागत निष्ठा तक सीमित नहीं किया गया; चयन प्रेमपूर्ण करुणा और स्थिरता दोनों को रखता है।
- issue: दाऊद और लेवियों की एजेंसी
  choice: दाऊद की स्तुति उनके द्वारा की जा रही थी
  alternative: दाऊद उनके द्वारा स्तुति कर रहा था
  rationale: בְּיָדָם का शाब्दिक भाव 'उनके हाथ से/उनके माध्यम से' है। मुख्य पाठ सम्भावित अभिप्राय देता है, पर पादटिप्पणी व्यक्तिगत प्रतिनिधिक एजेंसी की वैकल्पिक समझ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'अपने-अपने नियुक्त स्थानों', 'स्तुतिगान', 'तुरहियाँ' और 'समस्त इस्राएल' जैसे पद मंदिर-समारोह की औपचारिकता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
