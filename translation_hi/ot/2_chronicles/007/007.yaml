  text: וַ/יְקַדֵּ֣שׁ שְׁלֹמֹ֗ה אֶת תּ֤וֹךְ הֶֽ/חָצֵר֙ אֲשֶׁר֙ לִ/פְנֵ֣י בֵית יְהוָ֔ה כִּֽי עָ֤שָׂה שָׁם֙ הָֽ/עֹל֔וֹת וְ/אֵ֖ת חֶלְבֵ֣י הַ/שְּׁלָמִ֑ים כִּֽי מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ אֲשֶׁ֣ר עָשָׂ֣ה שְׁלֹמֹ֔ה לֹ֣א יָכ֗וֹל לְ/הָכִ֛יל אֶת הָ/עֹלָ֥ה וְ/אֶת הַ/מִּנְחָ֖ה וְ/אֶת הַ/חֲלָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/007.yaml
  text: Then Solomon consecrated the middle of the court that was before the house of Yahweh[a], because there he offered the burnt offerings and the fat portions of the peace offerings, because the bronze altar that Solomon had made could not hold the burnt offering, the grain offering[c][b], and the fat portions.
translation:
  language: hi
  text: तब सुलैमान ने यहोवा के भवन के सामने के आँगन के मध्य भाग को पवित्र ठहराया, क्योंकि उसने वहाँ होमबलियाँ और मेलबलियों की चर्बी के भाग चढ़ाए; क्योंकि सुलैमान की बनाई हुई काँसे की वेदी होमबलि, अन्नबलि और चर्बी के भागों को समा नहीं सकती थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַדֵּשׁ
  choice: पवित्र ठहराया
  rationale: हिफ़ील रूप यहाँ किसी स्थान को पवित्र उपयोग के लिए अलग करने का भाव देता है; यह हिन्दी में स्वाभाविक और उपासना-संबंधी अर्थ के अनुकूल है।
- source_word: תּוֹךְ הֶחָצֵר
  choice: आँगन के बीच के भाग
  rationale: תּוֹךְ आँगन के मध्य अथवा भीतरी हिस्से को सूचित करता है; 'बीच का भाग' स्थानगत अर्थ को स्पष्ट रखता है।
- source_word: לִפְנֵי בֵית יְהוָה
  choice: यहोवा के भवन के सामने
  rationale: לִפְנֵי यहाँ स्थानगत है, और בֵית יְהוָה के लिए 'यहोवा का भवन' मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम की प्रचलित लिप्यंतरण-परंपरा के अनुसार 'यहोवा' रखा गया है, शीर्षक से प्रतिस्थापित नहीं किया गया।
- source_word: עָשָׂה שָׁם
  choice: उसने वहाँ ... चढ़ाए
  rationale: यद्यपि עשה का मूल अर्थ 'करना/बनाना' है, बलिदानी प्रसंग में इसका मुहावरेदार अर्थ बलि चढ़ाना है।
- source_word: הָעֹלוֹת / הָעֹלָה
  choice: होमबलियाँ / होमबलि
  rationale: עלה के बलिदानी अर्थ के लिए 'होमबलि' स्थापित हिन्दी पद है; पहले रूप की बहुवचनता और दूसरे के वर्गवाचक एकवचन भाव का सम्मान किया गया है।
- source_word: חֶלְבֵי הַשְּׁלָמִים
  choice: मेलबलियों की चर्बी के भाग
  rationale: חלב वास्तविक बलिदानी चर्बी के निर्धारित भागों को दर्शाता है; שְׁלָמִים के लिए 'मेलबलि' प्रचलित और संक्षिप्त है।
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: मन्दिर के उपकरणों के प्रसंग में נְחֹשֶׁת का स्वाभाविक आधुनिक हिन्दी रूप 'काँसा' है।
- source_word: לֹא יָכוֹל לְהָכִיל
  choice: समा नहीं सकती थी
  rationale: यह वेदी की अपर्याप्त क्षमता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: बलिदानी प्रसंग में מִנְחָה का तकनीकी अर्थ अनाज से दी जाने वाली भेंट है; हिन्दी का स्थापित पद 'अन्नबलि' है।
- source_word: הַחֲלָבִים
  choice: चर्बी के भाग
  rationale: बहुवचन रूप बलि के लिए निर्धारित चर्बी के टुकड़ों या भागों का संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे 'प्रभु' जैसे पद से नहीं बदला गया। आधुनिक मानक हिन्दी में 'यहोवा' अधिक व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण किसी वैकल्पिक उच्चारण को निर्णायक रूप से नहीं थोपा गया।
- issue: שְׁלָמִים का बलिदानी अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि
  rationale: शब्द की व्युत्पत्ति और बलिदानी कार्य में शान्ति, कुशलता तथा सहभागिता के जुड़े हुए भाव हैं। 'मेलबलि' इन संबंधपरक भावों को संक्षेप में रखता है, बिना किसी एक व्याख्या को पूर्णतः निर्णायक बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। बलिदानी तकनीकी शब्दों—होमबलि, मेलबलि और अन्नबलि—को उनकी हिन्दी बाइबलीय पहचान के कारण बनाए रखा गया है। मूल के दो कारणसूचक כִּי वाक्यों को हिन्दी में सहज प्रवाह के लिए दो वाक्यों में व्यक्त किया गया है।
