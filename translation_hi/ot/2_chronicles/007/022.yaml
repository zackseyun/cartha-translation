  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। कारण-परिणाम की इब्रानी संरचना तथा दण्डवत करने और सेवा करने के बीच का शब्दगत भेद बनाए रखा गया है।
