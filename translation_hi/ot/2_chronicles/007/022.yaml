base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/022.yaml
  text: And they will say[a], ‘Because they forsook Yahweh, the God of their fathers, who brought them out of the land of Egypt, and embraced other gods, and bowed down to them and served them[b], therefore he has brought all this disaster on them.’
translation:
  language: hi
  text: और वे कहेंगे, “क्योंकि उन्होंने अपने पूर्वजों के परमेश्वर यहवे को छोड़ दिया, जो उन्हें मिस्र देश से निकाल लाया था, और दूसरे देवताओं से लिपट गए[a], उनके आगे दण्डवत किया और उनकी सेवा की; इस कारण उसने यह सारी विपत्ति उन पर ला दी है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरे देवताओं को थाम लिया” अथवा “दूसरे देवताओं को अपना लिया।” इब्रानी क्रिया का शाब्दिक अर्थ “दृढ़ता से पकड़ना” है और यह उनसे जान-बूझकर जुड़ने को व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: “यह सारी विपत्ति” से आशय दण्डस्वरूप आई आपदा है, नैतिक बुराई नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: और वे कहेंगे
  rationale: संयोजक सहित पूर्ण क्रिया यहाँ पिछले पद की भविष्यवाणी को आगे बढ़ाती है; इसलिए हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: עַל אֲשֶׁר
  choice: इसलिए कि
  rationale: यह उजाड़ की दशा का कारण प्रस्तुत करता है और अगले ‘इसी कारण’ के साथ कारण-परिणाम की संरचना बनाए रखता है।
- source_word: עָזְבוּ
  choice: छोड़ दिया
  rationale: यह वाचा के परमेश्वर से विमुख होकर उनका परित्याग करने का गंभीर भाव देता है और आधुनिक हिन्दी में सहज है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह वंशगत और वाचागत निरंतरता व्यक्त करता है; ‘पूर्वज’ आधुनिक हिन्दी में समावेशी और स्पष्ट है।
- source_word: הוֹצִיאָם מֵאֶרֶץ מִצְרַיִם
  choice: जो उन्हें मिस्र देश से निकाल लाया था
  rationale: हिफ़ील क्रिया और निर्गमन-सूत्र दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּחֲזִיקוּ בֵּאלֹהִים אֲחֵרִים
  choice: और दूसरे देवताओं को थाम लिया
  rationale: חזק ב का ‘दृढ़ता से पकड़ने/जुड़ने’ का ठोस रूपक बनाए रखा गया है; पादटिप्पणी भावगत विकल्प स्पष्ट करती है।
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: उनके आगे दण्डवत किया
  rationale: शारीरिक रूप से झुकने या भूमि तक प्रणाम करने का भाव सुरक्षित है और अगली ‘सेवा’ क्रिया से भेद रहता है।
- source_word: וַיַּעַבְדוּם
  choice: और उनकी सेवा की
  rationale: देवताओं के संदर्भ में धार्मिक सेवा/उपासना का अर्थ है, किंतु पूर्ववर्ती दण्डवत करने की क्रिया से शब्दगत भेद बनाए रखा गया है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: त्याग और मूर्तिपूजा से आने वाले परिणाम को स्पष्ट रूप से जोड़ता है।
- source_word: הֵבִיא עֲלֵיהֶם
  choice: उसने ... उन पर ला दी है
  rationale: वर्तमान उजाड़ दशा की व्याख्या करने वाले कथन में पूर्ण परिणाम का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: यह सारी विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, बल्कि दण्डस्वरूप आई विपदा को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘यहवे’ उसे उपाधि में बदले बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट हिन्दी रूप में सुरक्षित रखता है।
- issue: रָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; अनर्थ
  rationale: संदर्भ मंदिर और देश पर आए दैवी न्याय का है, परमेश्वर द्वारा नैतिक बुराई करने का नहीं; अतः आपदा का अर्थ लिया गया है।
