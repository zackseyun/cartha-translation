  text: וּ/נְתַשְׁתִּ֗י/ם מֵ/עַ֤ל אַדְמָתִ/י֙ אֲשֶׁ֣ר נָתַ֣תִּי לָ/הֶ֔ם וְ/אֶת הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הִקְדַּ֣שְׁתִּי לִ/שְׁמִ֔/י אַשְׁלִ֖יךְ מֵ/עַ֣ל פָּנָ֑/י וְ/אֶתְּנֶ֛/נּוּ לְ/מָשָׁ֥ל וְ/לִ/שְׁנִינָ֖ה בְּ/כָל הָ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/020.yaml
  text: then I will uproot them from my land that I have given them[a], and this house that I have consecrated for my name I will cast out of my sight[c][b], and I will make it a proverb and a byword among all peoples.
translation:
  language: hi
  text: तब मैं उन्हें अपनी उस भूमि से उखाड़ दूँगा जो मैंने उन्हें दी है; और इस भवन[a] को, जिसे मैंने अपने नाम के लिए पवित्र ठहराया है, अपनी दृष्टि से निकाल फेंकूँगा[b]। मैं उसे सब जातियों के बीच कहावत और उपहास का विषय बना दूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस मंदिर को।” इब्रानी में “इस घर को।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “अपने मुख के सामने से फेंक दूँगा।”'
    reason: lexical_alternative
  - marker: c
    text: या “ताना और बदनामी की कहावत बना दूँगा।” इन इब्रानी शब्दों में उपहास और सार्वजनिक तिरस्कार का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַשְׁתִּים
  choice: तब मैं उन्हें...उखाड़ दूँगा
  rationale: נתשׁ का मूल बिंब भूमि में से उखाड़ने का है। पिछले पद की शर्त के परिणाम को दिखाने के लिए וּ को प्रसंगानुसार ‘तब’ कहा गया है।
- source_word: מֵעַל אַדְמָתִי אֲשֶׁר נָתַתִּי לָהֶם
  choice: अपनी उस भूमि से...जो मैंने उन्हें दी है
  rationale: אֲדָמָה यहाँ वाचा में दी गई भूमि को सूचित करता है; ‘अपनी’ परमेश्वर के स्वामित्व और ‘दी है’ उसके अनुदान को बनाए रखता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर’ है, पर यहाँ मंदिर-संदर्भ में आधुनिक हिन्दी का ‘भवन’ स्वाभाविक है और स्रोत की ‘house’ संज्ञा से निकटता रखता है।
- source_word: הִקְדַּשְׁתִּי לִשְׁמִי
  choice: जिसे मैंने अपने नाम के लिए पवित्र ठहराया है
  rationale: हिफ़ील रूप अलग करके पवित्र उद्देश्य के लिए नियुक्त करने का भाव देता है। ‘अपने नाम के लिए’ नाम-उपस्थिति की धर्मवैचारिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: אַשְׁלִיךְ מֵעַל פָּנַי
  choice: अपनी दृष्टि से दूर कर दूँगा
  rationale: शाब्दिक ‘अपने मुख के सामने से फेंक दूँगा’ हिन्दी में अस्वाभाविक है। चुना हुआ रूप त्याग और अस्वीकृति का मुहावरेदार अर्थ देता है; शाब्दिक बिंब पादटिप्पणी में है।
- source_word: וְאֶתְּנֶנּוּ
  choice: मैं उसे...बना दूँगा
  rationale: נתן के साथ विधेय संज्ञाएँ यहाँ किसी दशा या प्रतिष्ठा में कर देने का अर्थ देती हैं।
- source_word: לְמָשָׁל וְלִשְׁנִינָה
  choice: कहावत और उपहास का विषय
  rationale: מָשָׁל ‘कहावत/दृष्टांत/ताना’ और שְׁנִינָה उपहासपूर्ण उक्ति या निंदा के विषय को सूचित कर सकता है। यह युग्म सार्वजनिक बदनामी का भाव स्पष्ट रखते हुए दोनों पदों को अलग-अलग व्यक्त करता है।
- source_word: בְּכָל הָעַמִּים
  choice: सब जातियों के बीच
  rationale: עַמִּים बहुवचन ‘peoples’ है; ‘जातियों’ से विभिन्न जनसमूहों का भाव आता है, केवल आधुनिक राजनीतिक राष्ट्रों का नहीं।
theological_decisions:
- issue: मंदिर के लिए בַּיִת का अनुवाद
  choice: इस भवन
  alternative: यह मंदिर / यह घर
  rationale: इब्रानी में सामान्य शब्द ‘घर’ है और प्रसंग में वह मंदिर को सूचित करता है। ‘भवन’ उस स्रोत-रूप को कुछ हद तक बचाते हुए आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है; ‘मंदिर’ पादटिप्पणी में दिया गया है।
- issue: परमेश्वर के मुख के सामने से हटाने का मुहावरा
  choice: अपनी दृष्टि से दूर कर दूँगा
  alternative: अपने मुख के सामने से फेंक दूँगा / अपनी उपस्थिति से निकाल दूँगा
  rationale: यह दिव्य अस्वीकृति का मुहावरा है। ‘दृष्टि से दूर’ अर्थ को स्वाभाविक हिन्दी में देता है, पर ‘उपस्थिति’ कहकर आध्यात्मिक अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: מָשָׁל और שְׁנִינָה की अपमानसूचक शक्ति
  choice: कहावत और उपहास का विषय
  alternative: ताना और कहावत / दृष्टांत और उपहास की उक्ति
  rationale: दोनों शब्दों की अर्थ-सीमा आंशिक रूप से एक-दूसरे से मिलती है। चुना हुआ पाठ ‘कहावत’ की औपचारिक समानता तथा सार्वजनिक तिरस्कार का भाव दोनों रखता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु साधारण पाठक के लिए स्पष्ट। वाक्य में दैवी चेतावनी की गंभीरता और भूमि से ‘उखाड़ने’ का मूल बिंब रखा गया है। ‘अपने नाम के लिए’ को व्याख्यायित किए बिना ज्यों का भाव रखा गया है।
