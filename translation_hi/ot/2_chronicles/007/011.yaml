  text: וַ/יְכַ֧ל שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל הַ/בָּ֜א עַל לֵ֣ב שְׁלֹמֹ֗ה לַ/עֲשׂ֧וֹת בְּ/בֵית יְהוָ֛ה וּ/בְ/בֵית֖/וֹ הִצְלִֽיחַ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/011.yaml
  text: So Solomon finished the house of Yahweh and the house of the king[c][b][a], and everything that came upon Solomon’s heart to do in the house of Yahweh and in his own house he successfully accomplished.
translation:
  language: hi
  text: सुलैमान ने याहवे का भवन और राजा का भवन[a] पूरा किया। और याहवे के भवन और अपने भवन में जो कुछ करने का विचार सुलैमान के मन में आया था[b], उसे उसने सफलतापूर्वक पूरा किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “राजमहल।” इब्रानी में शाब्दिक रूप से “राजा का भवन” है।
    reason: lexical_alternative
  - marker: b
    text: “सुलैमान के मन में आया” एक इब्रानी मुहावरा है, जिसका अर्थ है वह सब जो उसने करने का विचार किया या जिसकी इच्छा की।
    reason: cultural_note
  - marker: c
    text: अथवा “वह सफल हुआ” या “उसने उसे सफल बनाया।” इब्रानी क्रिया के दोनों अर्थ सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: पूरा किया
  rationale: כלה का यह कथात्मक रूप किसी कार्य को समाप्त करके पूर्ण करने को दर्शाता है। ‘पूरा किया’ आधुनिक हिन्दी में स्वाभाविक है और दोनों भवनों को इसके प्रत्यक्ष कर्म के रूप में बनाए रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: शाब्दिक रूप से ‘याहवे का भवन।’ ‘भवन’ मूल के בית को सुरक्षित रखता है; ‘मन्दिर’ यहाँ सम्भव, पर अधिक व्याख्यात्मक है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: यह इब्रानी पद का सीधा अनुवाद है और पहले आए ‘भवन’ की पुनरावृत्ति बनाए रखता है। सन्दर्भ में इससे राजमहल अभिप्रेत है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כָּל הַבָּא עַל לֵב שְׁלֹמֹה
  choice: जो कुछ सुलैमान के मन में … आया था
  rationale: यह अनुवाद इब्रानी हृदय/मन की छवि को स्वाभाविक हिन्दी मुहावरे में रखता है और उसके अभिप्राय या इच्छा का भाव व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: करने के लिए
  rationale: עשה का अर्थ व्यापक है; यहाँ यह सुलैमान द्वारा सोचे गए कार्यों और निर्माणों को पूरा करने के अर्थ में प्रयुक्त है।
- source_word: וּבְבֵיתוֹ
  choice: अपने भवन में
  rationale: सर्वनाम-प्रत्यय सुलैमान की ओर संकेत करता है। ‘अपने’ हिन्दी में कर्ता से उसका सम्बन्ध स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִצְלִיחַ
  choice: सफलतापूर्वक पूरा किया
  rationale: हिफ़ील रूप सफल होने अथवा किसी काम को सफल बनाने का भाव दे सकता है। इस निर्माण-सन्दर्भ में यह चयन कार्यों के सफल निष्पादन को स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ की पुनरावृत्ति मूल इब्रानी की संरचना को सुरक्षित रखती है, जबकि ‘मन में आया’ मूल मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
