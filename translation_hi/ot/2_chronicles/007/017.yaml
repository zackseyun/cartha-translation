id: 2CH.7.17
reference: 2 Chronicles 7:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֞ה אִם תֵּלֵ֣ךְ לְ/פָנַ֗/י כַּ/אֲשֶׁ֤ר הָלַךְ֙ דָּוִ֣יד אָבִ֔י/ךָ וְ/לַ/עֲשׂ֕וֹת כְּ/כֹ֖ל אֲשֶׁ֣ר צִוִּיתִ֑י/ךָ וְ/חֻקַּ֥/י וּ/מִשְׁפָּטַ֖/י תִּשְׁמֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/017.yaml
  text: And as for you[a], if you walk before me as your father David walked, doing all that I have commanded you, and if you keep my statutes and my judgments,
translation:
  language: hi
  text: और तुम, यदि मेरे सामने वैसे चलो जैसे तुम्हारे पिता दाऊद चले थे, और वह सब करो जिसकी आज्ञा मैंने तुम्हें दी है, और मेरी विधियों तथा न्याय-विधानों[a] का पालन करो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियमों।”
    reason: मִשְׁפָּטַי के लिए एक स्वाभाविक वैकल्पिक कानूनी अर्थ।
lexical_decisions:
- source_word: וְאַתָּה
  choice: और जहाँ तक तुम्हारी बात है
  rationale: संयोजक के साथ आगे रखा गया सर्वनाम सुलैमान को दिए गए सीधे और बलयुक्त संबोधन तथा कथन के मोड़ को प्रकट करता है।
- source_word: אִם
  choice: यदि
  rationale: मूल पाठ की वास्तविक शर्त को स्पष्ट और बिना नरम किए बनाए रखता है।
- source_word: תֵּלֵךְ לְפָנַי
  choice: तुम मेरे सामने ... चलो
  rationale: परमेश्वर की उपस्थिति में जीवन बिताने के वाचाई मुहावरे को ‘चलना’ के बिंब सहित सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר הָלַךְ דָּוִיד אָבִיךָ
  choice: जैसे तुम्हारे पिता दाऊद चले थे
  rationale: तुलना को स्पष्ट रखता और पहले खंड के ‘चलना’ बिंब को दोहराता है।
- source_word: וְלַעֲשׂוֹת כְּכֹל אֲשֶׁר צִוִּיתִיךָ
  choice: उन सभी बातों के अनुसार करते हुए जिनकी आज्ञा मैंने तुम्हें दी है
  rationale: इनफिनिटिव रचना को आश्रित सहभागी भाव में व्यक्त करता है और כְּכֹל के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: חֻקַּי
  choice: मेरी विधियों
  rationale: वाचाई और कानूनी संदर्भ में स्थापित, सहज शब्द है तथा अगले पद से अर्थगत भेद बनाए रखता है।
- source_word: וּמִשְׁפָּטַי
  choice: न्याय-विधानों
  rationale: מִשְׁפָּט के न्यायिक और नियामक दोनों पहलुओं को व्यक्त करता है तथा ‘विधियों’ से भेद बनाए रखता है।
- source_word: תִּשְׁמֹר
  choice: पालन करो
  rationale: वाचाई संदर्भ में आज्ञाओं को मानने और सावधानी से निभाने का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: वाचा-संबंधी आज्ञाकारिता को योग्यता-आधारित धर्मशास्त्र जोड़े बिना प्रस्तुत करना
  choice: ‘यदि’ की शर्त और चलने, करने तथा पालन करने की आज्ञाकारिता-संबंधी भाषा को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे केवल सामान्य ‘विश्वासयोग्यता’ कहकर भावानुवाद करना या कर्मों पर बल कम करने के लिए शर्त को नरम करना।
  rationale: यह पद सुलैमान के सामने वास्तविक वाचाई शर्त रखता है; अनुवाद को इस तनाव को किसी बाहरी धर्मवैज्ञानिक व्यवस्था से सुलझाए बिना सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तुम’ सीधे एकवचन संबोधन को स्वाभाविक ढंग से व्यक्त करता है; ‘तू’ की संभावित कठोरता और ‘आप’ द्वारा जोड़े जाने वाले सम्मान-सूचक भाव से बचा गया है। वाक्य का अंतिम अल्पविराम अगले पद में जारी शर्त के अनुरूप रखा गया है।
