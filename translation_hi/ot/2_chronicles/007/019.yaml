  text: וְ/אִם תְּשׁוּב֣וּ/ן אַתֶּ֔ם וַ/עֲזַבְתֶּם֙ חֻקּוֹתַ֣/י וּ/מִצְוֺתַ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶ֑ם וַ/הֲלַכְתֶּ֗ם וַ/עֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/הִשְׁתַּחֲוִיתֶ֖ם לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/019.yaml
  text: But if you turn away and abandon my statutes and my commandments that I have set before you, and go and serve other gods and bow down to them,
translation:
  language: hi
  text: पर यदि तुम मुड़ जाओ और मेरी उन विधियों और आज्ञाओं को छोड़ दो जिन्हें मैंने तुम्हारे सामने रखा है, और जाकर दूसरे देवताओं की सेवा करो और उन्हें दंडवत करो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשׁוּבוּן
  choice: मुझसे फिर जाओगे
  rationale: क्रिया का मूल अर्थ ‘फिरना/लौटना’ है; प्रसंग में ईश्वर से विमुख होने का भाव है। ‘मुझसे’ अर्थ में निहित संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וַעֲזַבְתֶּם
  choice: छोड़ दोगे
  rationale: עזב के त्याग देने के अर्थ को सरल, आधुनिक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: חֻקּוֹתַי
  choice: मेरी विधियों
  rationale: חֹק के निर्धारित विधान या नियम के अर्थ को ‘विधि’ से व्यक्त किया गया है और इसे מִצְוָה ‘आज्ञा’ से अलग रखा गया है।
- source_word: מִצְוֺתַי
  choice: आज्ञाओं
  rationale: מִצְוָה का सीधा और प्रचलित हिंदी समतुल्य ‘आज्ञा’ है।
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: मैंने तुम्हारे सामने रखा है
  rationale: इब्रानी मुहावरे की निकट संरचना और सार्वजनिक रूप से प्रस्तुत किए जाने का भाव सुरक्षित रहता है।
- source_word: וַעֲבַדְתֶּם
  choice: सेवा करोगे
  rationale: עבד धार्मिक संदर्भ में देवताओं की उपासक-सेवा को दर्शाता है; ‘सेवा करना’ स्रोत की शब्दावली को निकटता से रखता है।
- source_word: וְהִשְׁתַּחֲוִיתֶם
  choice: दण्डवत् करोगे
  rationale: यह क्रिया झुककर श्रद्धा/उपासना प्रकट करने को दर्शाती है; ‘दण्डवत् करना’ शारीरिक क्रिया और धार्मिक आशय दोनों को व्यक्त करता है।
theological_decisions:
- issue: תְּשׁוּבוּן में विमुखता का लक्ष्य
  choice: मुझसे फिर जाओगे
  alternative: फिर जाओगे / विमुख हो जाओगे
  rationale: इब्रानी में अलग से ‘मुझसे’ नहीं है, पर प्रथम पुरुष में बोलने वाले परमेश्वर की विधियों को छोड़ने के संदर्भ से लक्ष्य स्पष्ट है। यह हिंदी में अस्पष्ट और अस्वाभाविक ‘फिर जाओगे’ से अधिक बोधगम्य है, जबकि ‘विमुख’ की अपेक्षा स्रोत के ‘फिरने’ वाले रूपक को बचाता है।
- issue: दूसरे देवताओं के प्रति עבד और השתחוה का भेद
  choice: सेवा करोगे और उन्हें दण्डवत् करोगे
  alternative: उनकी उपासना करोगे
  rationale: दो अलग इब्रानी क्रियाओं को एक सामान्य धार्मिक शब्द में समेटने के बजाय सेवा और झुकने की दोनों क्रियाएँ सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन ‘तुम’ स्रोत के द्वितीय पुरुष बहुवचन को दर्शाता है। वाक्य के अंत का अल्पविराम अगले पद में जारी शर्त-वाक्य के अनुरूप है।
