lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: तब राजा
  rationale: आरंभिक וְ कथा को आगे बढ़ाता है; आधुनिक हिन्दी में क्रमिक निरंतरता के लिए ‘तब’ स्वाभाविक है।
- source_word: וְכָל הָעָם
  choice: और सारी प्रजा
  rationale: עָם यहाँ राजा के साथ उपस्थित समस्त जनसमुदाय को सूचित करता है; ‘सारी प्रजा’ प्रसंगानुकूल और सहज है।
- source_word: זֹבְחִים זֶבַח
  choice: बलिदान चढ़ा रहे थे
  rationale: क्रियावाचक कृदंत जारी क्रिया दर्शाता है। हिब्रू का सजातीय प्रयोग शाब्दिक रूप से ‘बलिदान बलि कर रहे थे’ होगा, जिसे हिन्दी में स्वाभाविक रूप से ‘बलिदान चढ़ा रहे थे’ कहा गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह परमेश्वर की उपस्थिति में किए गए उपासना-कर्म का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को नाम के रूप में सुरक्षित रखा गया है; ‘प्रभु’ करने से वह उपाधि बन जाता।
translation_notes:
