source:
  edition: WLC
  text: וְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל רֹאִים֙ בְּ/רֶ֣דֶת הָ/אֵ֔שׁ וּ/כְב֥וֹד יְהוָ֖ה עַל הַ/בָּ֑יִת וַ/יִּכְרְעוּ֩ אַפַּ֨יִם אַ֤רְצָ/ה עַל הָ/רִֽצְפָה֙ וַ/יִּֽשְׁתַּֽחֲו֔וּ וְ/הוֹד֤וֹת לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/003.yaml
  text: 'And all the sons of Israel[a], seeing the fire come down and the glory of Yahweh upon the house, bowed down with their faces to the ground on the pavement, and they worshiped and gave thanks to Yahweh: “For he is good[c][b], for his steadfast love endures forever.”'
translation:
  language: hi
  text: 'और इस्राएल के सभी लोगों[a] ने आग को उतरते हुए और यहोवा की महिमा को भवन[b] पर देखा, तब वे पक्के फर्श पर मुँह भूमि की ओर करके झुक गए। उन्होंने आराधना की और यहोवा को धन्यवाद दिया: “क्योंकि वह भला है, और उसका अटल प्रेम[c] सदा बना रहता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के सभी पुत्र”; यह पूरे इस्राएली समुदाय के लिए प्रयुक्त सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “भवन” से आशय मंदिर है।
    reason: cultural_note
  - marker: c
    text: या “उसकी करुणा” अथवा “उसकी वाचा की निष्ठा।” इब्रानी शब्द חֶסֶד में अटल प्रेम, दया और निष्ठा के भाव शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी लोग
  rationale: शाब्दिक अर्थ ‘इस्राएल के सभी पुत्र’ है, पर यह पूरे इस्राएली समुदाय के लिए प्रचलित सामूहिक अभिव्यक्ति है। आधुनिक हिन्दी में ‘इस्राएल के सभी लोग’ स्वाभाविक और अर्थ-सटीक है।
- source_word: רֹאִים בְּרֶדֶת הָאֵשׁ
  choice: ने आग को उतरते ... देखा
  rationale: कृदन्त और ב के साथ infinitive घटना को उसी समय प्रत्यक्ष देखने का भाव देते हैं; हिन्दी का ‘उतरते देखा’ इस संरचना को सहज रूप से व्यक्त करता है।
- source_word: וּכְבוֹד יְהוָה עַל הַבָּיִת
  choice: और यहोवा की महिमा को भवन पर ठहरते
  rationale: כְבוֹד प्रकट दिव्य महिमा को बताता है। עַל स्थान-संबंध दर्शाता है; प्रसंग में महिमा भवन पर विद्यमान है, इसलिए प्राकृतिक हिन्दी के लिए ‘ठहरते’ जोड़ा गया है।
- source_word: וַיִּכְרְעוּ אַפַּיִם אַרְצָה עַל הָרִצְפָה
  choice: वे पक्के फर्श पर मुँह के बल भूमि तक झुक गए
  rationale: वाक्यांश पूर्ण विनम्रता और दण्डवत् मुद्रा का दृश्य देता है। רִצְפָה मंदिर-परिसर की पक्की सतह या फर्श है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: उन्होंने दण्डवत् किया
  rationale: यह क्रिया शारीरिक रूप से झुककर आराधना करने को व्यक्त करती है। पहले वाक्य में मुद्रा बताई गई है, फिर भी ‘दण्डवत्’ उसके आराधनात्मक अर्थ को संक्षेप में बनाए रखता है।
- source_word: וְהוֹדוֹת לַיהוָה
  choice: यहोवा को धन्यवाद दिया
  rationale: ידה का हिफ़ईल रूप इस स्तुतिगान-सूत्र में धन्यवाद या प्रशंसा व्यक्त करता है; ‘धन्यवाद दिया’ अगले कथन ‘क्योंकि वह भला है’ से स्वाभाविक रूप से जुड़ता है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह भला है
  rationale: यह पारंपरिक आराधनात्मक उद्घोष है। ‘भला’ नैतिक भलाई और उपकारी स्वभाव दोनों को बनाए रखता है।
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: उसका अटल प्रेम सदा बना रहता है
  rationale: חֶסֶד में प्रेम, निष्ठा और वाचा-संबंधी विश्वसनीयता की संयुक्त धारणा है। ‘अटल प्रेम’ इस व्यापकता को संक्षेप और सहज हिन्दी में व्यक्त करता है; ‘बना रहता है’ לְעוֹלָם के साथ निहित स्थायित्व को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। हिन्दी बाइबल-पाठकों में परिचित रूप ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए स्पष्ट करता है; ‘याहवे’ अधिक संभावित विद्वत्तापूर्ण उच्चारण है।
- issue: חַסְדּוֹ का अर्थ
  choice: उसका अटल प्रेम
  alternative: उसकी करुणा / उसकी वाचा की निष्ठा
  rationale: शब्द को केवल भावनात्मक प्रेम या केवल दया तक सीमित न करके उसकी स्थिर, निष्ठावान और संबंधपरक प्रकृति बनाए रखी गई है। विकल्पों को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘भवन’ मूल के ‘घर’ को संदर्भानुकूल रूप से व्यक्त करता है और पादटिप्पणी मंदिर का संकेत स्पष्ट करती है। आराधनात्मक उद्घोष में संक्षिप्त, स्मरणीय लय रखी गई है।
