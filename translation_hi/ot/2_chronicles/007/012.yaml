source:
  edition: WLC
  text: וַ/יֵּרָ֧א יְהוָ֛ה אֶל שְׁלֹמֹ֖ה בַּ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ וּ/בָחַ֜רְתִּי בַּ/מָּק֥וֹם הַ/זֶּ֛ה לִ֖/י לְ/בֵ֥ית זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/012.yaml
  text: Then Yahweh appeared to Solomon by night and said to him[b][a], “I have heard your prayer and have chosen this place for myself as a house of sacrifice.”
translation:
  language: hi
  text: तब यहोवा रात में सुलैमान को दिखाई दिया और उससे कहा, “मैंने तेरी प्रार्थना सुनी है और इस स्थान को अपने लिए बलिदान के लिए एक भवन के रूप में चुन लिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרָא
  choice: दिखाई दिया
  rationale: निफ़अल रूप यहाँ सुलैमान के सामने यहोवा के प्रकट होने को बताता है। ‘दिखाई दिया’ स्वाभाविक हिन्दी है और प्रकट होने के ढंग के बारे में पाठ से अधिक नहीं कहता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בַּלָּיְלָה
  choice: रात में
  rationale: यह समयसूचक पद का सीधा और आधुनिक हिन्दी में स्वाभाविक अनुवाद है।
- source_word: שָׁמַעְתִּי אֶת־תְּפִלָּתֶךָ
  choice: मैंने तेरी प्रार्थना सुन ली है
  rationale: पूर्ण क्रिया का परिणाम वर्तमान में प्रभावी है। ‘सुन ली है’ प्रार्थना के ग्रहण किए जाने का भाव सहज रूप से व्यक्त करता है।
- source_word: וּבָחַרְתִּי
  choice: और ... चुन लिया है
  rationale: यह पूर्ण हो चुके दिव्य चुनाव और उसके बने रहने वाले परिणाम को व्यक्त करता है तथा पूर्ववर्ती पूर्ण क्रिया के समानांतर है।
- source_word: בַּמָּקוֹם הַזֶּה לִי
  choice: इस स्थान को अपने लिए
  rationale: ‘इस स्थान’ मन्दिर के अभी समर्पित स्थल को इंगित करता है, और ‘अपने लिए’ दातृवाचक सर्वनाम के स्वामित्व तथा उद्देश्य के बल को बनाए रखता है।
- source_word: לְבֵית זָבַח
  choice: बलिदान के भवन के रूप में
  rationale: यह ‘बलिदान का/के लिए भवन’ की स्रोत-निकट अभिव्यक्ति को बनाए रखता है और मन्दिर को बलिदानी आराधना के लिए निर्धारित स्थान बताता है, बिना ‘मन्दिर’ शब्द जोड़कर अर्थ को अधिक स्पष्ट करने के।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: לְבֵית זָבַח की प्रकृति
  choice: बलिदान के भवन के रूप में
  alternative: बलिदान चढ़ाने के मन्दिर के रूप में
  rationale: चुना हुआ पाठ इब्रानी संज्ञात्मक संरचना और उसकी कुछ असामान्य तीक्ष्णता को सुरक्षित रखता है; विकल्प अर्थ को समझाता है, पर ‘मन्दिर’ और क्रियात्मक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज कथात्मक शैली। सुलैमान से परमेश्वर के एकवचन प्रत्यक्ष संबोधन के लिए ‘तेरी’ रखा गया है। वाक्य स्रोत की क्रमबद्धता और पूर्ण क्रियाओं के वर्तमान-प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
