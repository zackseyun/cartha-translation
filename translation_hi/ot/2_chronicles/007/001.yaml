  terminology: ‘होमबलि’ appropriately renders עֹלָה. ‘बलियाँ’ adequately renders the broader זְבָחִים. ‘याहवे’ consistently represents Yahweh rather than the traditional but different vocalization ‘यहोवा.’ ‘भवन’ is acceptable for the literal ‘house,’ with a contextual footnote identifying the temple.
