    issue: Divine-name transliteration differs from the stated Yahweh policy
    rationale: The audit trail specifies rendering יהוה as ‘Yahweh.’ In Hindi, ‘याहवे’ is the direct corresponding transliteration; ‘यहोवा’ reflects a different traditional vocalization.
