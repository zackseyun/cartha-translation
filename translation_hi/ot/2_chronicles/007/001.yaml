  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/כְ/כַלּ֤וֹת שְׁלֹמֹה֙ לְ/הִתְפַּלֵּ֔ל וְ/הָ/אֵ֗שׁ יָֽרְדָה֙ מֵֽ/הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל הָ/עֹלָ֖ה וְ/הַ/זְּבָחִ֑ים וּ/כְב֥וֹד יְהוָ֖ה מָלֵ֥א אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/001.yaml
  text: And when Solomon finished praying[a], the fire came down from heaven and consumed the burnt offering and the sacrifices[b], and the glory of Yahweh filled the house.
translation:
  language: hi
  text: जब सुलैमान प्रार्थना कर चुका था, तब आग आकाश से उतरी और उसने होमबलि और बलियों को भस्म कर दिया, और याहवे का तेज भवन[a] में भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मंदिर; इब्रानी में ‘भवन’ (शाब्दिक रूप से, ‘घर’)।
    reason: cultural_note
lexical_decisions:
- source_word: וּכְכַלּוֹת שְׁלֹמֹה לְהִתְפַּלֵּל
  choice: जब सुलैमान प्रार्थना कर चुका
  rationale: कालवाचक infinitive construct को स्वाभाविक हिन्दी में पूर्ण हुई क्रिया के रूप में व्यक्त किया गया है; इससे क्रम स्पष्ट रहता है, पर अनावश्यक तात्कालिकता नहीं जोड़ी जाती।
- source_word: וְהָאֵשׁ יָרְדָה מֵהַשָּׁמַיִם
  choice: तब आग आकाश से उतरी
  rationale: יָרְדָה की नीचे की ओर गति को ‘उतरी’ सीधे व्यक्त करता है। שָׁמַיִם के लिए इस प्रसंग में स्वाभाविक हिन्दी ‘आकाश’ है।
- source_word: וַתֹּאכַל
  choice: उसने ... भस्म कर दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘खा जाना’ है, पर आग के विषय में हिन्दी का स्वाभाविक और सटीक प्रयोग ‘भस्म कर देना’ है।
- source_word: הָעֹלָה וְהַזְּבָחִים
  choice: होमबलि और अन्य बलियों
  rationale: עֹלָה को पारंपरिक और सटीक ‘होमबलि’ कहा गया है। ‘अन्य’ हिन्दी में यह स्पष्ट करता है कि बहुवचन זְבָחִים उससे अलग बलियों की ओर संकेत करता है, बिना कोई विशिष्ट प्रकार जोड़ने के।
- source_word: וּכְבוֹד יְהוָה
  choice: और यहोवा का तेज
  rationale: כָּבוֹד की प्रत्यक्ष दिव्य महिमा के लिए ‘तेज’ सहज, गरिमापूर्ण और बाइबिलीय हिन्दी है। य्ह्व्ह के व्यक्तिगत नाम को ‘यहोवा’ रूप में रखा गया है।
- source_word: מָלֵא אֶת־הַבָּיִת
  choice: भवन में भर गया
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और प्रसंग में मंदिर अभिप्रेत है। ‘भवन’ स्रोत की अभिव्यक्ति को बचाते हुए हिन्दी में गरिमा और स्पष्टता देता है; अर्थ-स्पष्टीकरण पादटिप्पणी में है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ चुना गया; स्वरांकन की प्राचीन अनिश्चितता के कारण ‘याहवे’ भी सम्भव लिप्यंतरण है।
- issue: הַבָּיִת का संदर्भ
  choice: भवन
  alternative: मंदिर
  rationale: मूल शब्द ‘घर/भवन’ कहता है, जबकि प्रसंग से सुलैमान का मंदिर अभिप्रेत है। मुख्य पाठ में स्रोत की शब्द-छवि रखी गई और पादटिप्पणी में संदर्भ स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। बलिदान-संबंधी तकनीकी शब्द ‘होमबलि’ सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ की पहली पादटिप्पणी (‘descended from heaven’) वास्तव में मुख्य अनुवाद का ही शब्द-विकल्प है और दिए गए marker से मेल नहीं खाती, इसलिए हिन्दी में अनावश्यक पादटिप्पणी नहीं बनाई गई; केवल הַבָּיִת के प्रसंगगत अर्थ पर [a] दिया गया है।
