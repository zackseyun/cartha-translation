id: 2CH.7.16
reference: 2 Chronicles 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה בָּחַ֤רְתִּי וְ/הִקְדַּ֨שְׁתִּי֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה לִ/הְיוֹת שְׁמִ֥/י שָׁ֖ם עַד עוֹלָ֑ם וְ/הָי֨וּ עֵינַ֧/י וְ/לִבִּ֛/י שָׁ֖ם כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/016.yaml
  text: And now I have chosen and consecrated this house[a], that my name may be there forever[b], and my eyes and my heart will be there all the days.
translation:
  language: hi
  text: और अब मैंने इस भवन को चुना है और पवित्र ठहराया है[a], ताकि मेरा नाम यहाँ सदा बना रहे[b]; और मेरी आँखें और मेरा हृदय हर समय यहाँ रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, पवित्र उपयोग के लिए अलग किया है।
    reason: lexical_alternative
  - marker: b
    text: “यह भवन” से आशय मंदिर है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को रखते हुए यह परमेश्वर के वचन में आए संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּחַרְתִּי וְהִקְדַּשְׁתִּי
  choice: मैंने ... चुना और पवित्र ठहराया है
  rationale: इब्रानी पूर्ण क्रियाएँ सम्पन्न कार्य और उसकी वर्तमान प्रासंगिकता बताती हैं। ‘पवित्र ठहराया’ का अर्थ पवित्र उपयोग के लिए अलग करना है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन को
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और प्रसंग में यह मन्दिर को सूचित करता है। ‘भवन’ हिन्दी में उस उपासना-स्थल के लिए गरिमापूर्ण और स्पष्ट है, जबकि अर्थ को सीधे ‘मन्दिर’ में नहीं बदलता।
- source_word: לִהְיוֹת שְׁמִי שָׁם
  choice: ताकि मेरा नाम यहाँ ... बना रहे
  rationale: लामेदयुक्त infinitive के उद्देश्य/परिणाम को ‘ताकि’ व्यक्त करता है। हिन्दी में स्थान की निकटता के कारण שָׁם को ‘यहाँ’ कहना स्वाभाविक है; ‘मेरा नाम’ की मन्दिर-विषयक धर्मवैज्ञानिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: यह दीर्घस्थायी, निरन्तर अवधि का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וְהָיוּ עֵינַי וְלִבִּי שָׁם
  choice: और मेरी आँखें और मेरा हृदय ... यहाँ रहेंगे
  rationale: परमेश्वर की सजग दृष्टि और वाचा-संबंधी लगाव दर्शाने वाले मानवरूपी रूपकों को व्याख्यात्मक भावार्थ में बदले बिना रखा गया है।
- source_word: כָּל הַיָּמִים
  choice: हर समय
  rationale: शाब्दिक ‘सभी दिन’ का अर्थ निरन्तरता है; ‘हर समय’ आधुनिक हिन्दी में स्वाभाविक रहते हुए वही बल व्यक्त करता है और ठीक पहले आए עַד עוֹלָם से अनावश्यक पुनरुक्ति से बचता है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा—‘मेरी आँखें और मेरा हृदय’
  choice: मूल बिम्बों को अक्षुण्ण रखा गया
  alternative: ‘मेरा ध्यान और मेरी देखभाल’ के रूप में भावार्थ करना
  rationale: इब्रानी पाठ देह-संबंधी बिम्बों द्वारा परमेश्वर की सजग उपस्थिति और वाचा-संबंधी प्रतिबद्धता व्यक्त करता है; व्याख्यात्मक भावार्थ पाठ की धर्मवैज्ञानिक बनावट को समतल कर देता।
- issue: ‘मेरा नाम’ की मन्दिर-विषयक भाषा
  choice: ‘मेरा नाम’ को ज्यों का त्यों रखा गया
  alternative: ‘मैं यहाँ रहूँ’ अथवा ‘मेरी उपस्थिति यहाँ रहे’
  rationale: שְׁמִי परमेश्वर के आत्म-प्रकाशन और वाचा-संबंधी उपस्थिति की विशिष्ट पुराना नियम अभिव्यक्ति है। इसे ‘उपस्थिति’ या स्वयं परमेश्वर में बदलना मूल की सम्भावित अर्थ-व्याप्ति को समय से पहले निश्चित कर देता।
- issue: עַד עוֹלָם और כָּל הַיָּמִים का सम्बन्ध
  choice: क्रमशः ‘सदा’ और ‘हर समय’
  alternative: दोनों को समान रूप से ‘सदा’ कहना या दूसरे को शाब्दिक ‘सभी दिन’ करना
  rationale: दोनों कालगत अभिव्यक्तियों की अलग शब्दावली और निरन्तरता का बल सुरक्षित रखा गया है, पर हिन्दी को अस्वाभाविक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘पवित्र ठहराया’, ‘मेरा नाम’, ‘मेरी आँखें और मेरा हृदय’ जैसे स्रोत-पाठ के मुख्य धार्मिक बिम्ब सुरक्षित हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली और अस्वाभाविक शाब्दिकता से बचा गया है।
