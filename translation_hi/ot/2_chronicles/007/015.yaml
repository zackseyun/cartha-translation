  text: Now my eyes will be open and my ears attentive to the prayer offered in this place[a].
translation:
  language: hi
  text: अब मेरी आँखें खुली रहेंगी और मेरे कान इस स्थान में की जाने वाली प्रार्थना पर लगे रहेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस स्थान की प्रार्थना।” इसका अर्थ “इस स्थान में की जाने वाली प्रार्थना” या “इस स्थान से की जाने वाली प्रार्थना” भी हो सकता है।
    reason: इब्रानी construct रचना प्रार्थना और स्थान के बीच संबंध को खुला छोड़ती है।
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण पिछले समर्पण-प्रसंग के वर्तमान परिणाम को सूचित करता है। ‘अब’ स्वाभाविक है और ‘अब से’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: עֵינַי
  choice: मेरी आँखें
  rationale: मूल का सजीव, मानवरूपी चित्र ज्यों का त्यों रखा गया है; इसे ‘मैं देखूँगा’ कहकर अमूर्त नहीं बनाया गया।
- source_word: יִהְיוּ פְתֻחוֹת
  choice: खुली रहेंगी
  rationale: היה के अपूर्ण रूप और ‘खुली’ कृदंत का मेल जारी रहनेवाली अवस्था व्यक्त करता है। आधुनिक हिन्दी में ‘खुली रहेंगी’ इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאָזְנַי קַשֻּׁבוֹת
  choice: और मेरे कान … की ओर लगे रहेंगे
  rationale: यह आँखों के खुले रहने के समानांतर ध्यानपूर्वक सुनने की तत्परता बताता है। ‘कान … की ओर लगे रहेंगे’ हिन्दी में मानवरूपी बिंब और सक्रिय ध्यान दोनों बनाए रखता है।
- source_word: לִתְפִלַּת
  choice: प्रार्थना की ओर
  rationale: उपसर्ग ל ध्यान की दिशा बताता है और एकवचन construct रूप को ‘प्रार्थना’ से व्यक्त किया गया है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान में की जानेवाली
  rationale: शाब्दिक रचना ‘इस स्थान की प्रार्थना’ है। मुख्य पाठ में उसका प्रसंगगत अर्थ सहज हिन्दी में दिया गया है, जबकि शाब्दिक और अन्य सम्भव संबंध पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर की अनुभूति के लिए मानवरूपी भाषा
  choice: ‘मेरी आँखें’ और ‘मेरे कान’ को प्रत्यक्ष रूप में बनाए रखना
  alternative: ‘मैं देखता और ध्यान से सुनता रहूँगा’
  rationale: इब्रानी पाठ परमेश्वर के ध्यान को देह-संबंधी बिंबों से व्यक्त करता है। उन्हें बनाए रखने से मूल की संबंधपरक और वाचागत शक्ति सुरक्षित रहती है।
- issue: प्रार्थना और स्थान के बीच संबंध
  choice: मुख्य पाठ में ‘इस स्थान में की जानेवाली प्रार्थना’
  alternative: ‘इस स्थान की प्रार्थना’ अथवा ‘इस स्थान से की जानेवाली प्रार्थना’
  rationale: मूल construct संबंध को स्पष्ट रूप से परिभाषित नहीं करता। मुख्य अनुवाद प्रसंग के अनुकूल स्थानीय संबंध व्यक्त करता है, पर पादटिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘आँखें’ और ‘कान’ के समानांतर बिंब बनाए गए हैं। ‘की जानेवाली’ को संयुक्त रूप में लिखा गया है और वाक्य में परमेश्वर के लगातार ध्यान का भाव रखा गया है।
