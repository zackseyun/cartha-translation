id: 2CH.7.21
reference: 2 Chronicles 7:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/בַּ֤יִת הַ/זֶּה֙ אֲשֶׁ֣ר הָיָ֣ה עֶלְי֔וֹן לְ/כָל עֹבֵ֥ר עָלָ֖י/ו יִשֹּׁ֑ם וְ/אָמַ֗ר בַּ/מֶּ֨ה עָשָׂ֤ה יְהוָה֙ כָּ֔כָה לָ/אָ֥רֶץ הַ/זֹּ֖את וְ/לַ/בַּ֥יִת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/021.yaml
  text: And this house[a], which was exalted, will become a horror to everyone passing by it, and they will say[b], 'Why has Yahweh done thus to this land and to this house?'
translation:
  language: hi
  text: और यह भवन, जो ऊँचा था, उसके पास से गुजरने वाला हर व्यक्ति स्तब्ध रह जाएगा और कहेगा, “याहवे ने इस भूमि और इस भवन के साथ ऐसा क्यों किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַבַּיִת הַזֶּה
  choice: और यह भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; प्रसंग में यह मन्दिर है। ‘भवन’ मूल शब्द की व्यापकता रखते हुए हिन्दी में पवित्र इमारत के लिए स्वाभाविक है।
- source_word: אֲשֶׁר הָיָה עֶלְיוֹן
  choice: जो ऊँचा था
  rationale: עֶלְיוֹן यहाँ ऊँचाई, प्रमुखता या वैभव का संकेत दे सकता है। ‘ऊँचा’ इस संक्षिप्त अभिव्यक्ति की वास्तविक अस्पष्टता बनाए रखता है।
- source_word: לְכָל עֹבֵר עָלָיו יִשֹּׁם
  choice: उसके पास से होकर जानेवाला हर कोई उसे देखकर स्तब्ध रह जाएगा
  rationale: שׁמם उजाड़ होने के साथ उससे उत्पन्न विस्मय या भय को भी व्यक्त कर सकता है। यहाँ राहगीरों की प्रतिक्रिया और अगले प्रश्न को देखते हुए ‘स्तब्ध रह जाएगा’ उपयुक्त है; ‘उसे देखकर’ हिन्दी में निहित सम्बन्ध स्पष्ट करता है।
- source_word: וְאָמַר
  choice: और कहेगा
  rationale: क्रिया एकवचन है और ‘हर कोई’ के साथ स्वाभाविक हिन्दी एकवचन बनाए रखा गया है।
- source_word: בַּמֶּה
  choice: क्यों
  rationale: शाब्दिक अर्थ ‘किस कारण से?’ है; प्रश्न में ‘क्यों’ सहज और सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- source_word: כָּכָה לָאָרֶץ הַזֹּאת וְלַבַּיִת הַזֶּה
  choice: इस देश और इस भवन के साथ ऐसा
  rationale: אֶרֶץ के लिए ‘देश’ यहाँ भूमि और उसके निवास-क्षेत्र दोनों को सहज रूप में व्यक्त करता है; ‘के साथ ऐसा किया’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक दिव्य नाम है; उसका लिप्यन्तरण वाचा-नाम को सुरक्षित रखता है।
- issue: יִשֹּׁם में विनाश और प्रतिक्रिया का सम्बन्ध
  choice: उसे देखकर स्तब्ध रह जाएगा
  alternative: उजाड़ हो जाएगा / भय का कारण बनेगा
  rationale: रूप का अर्थ उजाड़पन और उससे उपजा स्तब्ध भय दोनों समेट सकता है। वाक्य का कर्ता निकटवर्ती ‘हर राहगीर’ समझना व्याकरणतः सम्भव और सन्दर्भानुकूल है, इसलिए प्रतिक्रिया को मुख्य पाठ में रखा गया है।
- issue: עֶלְיוֹן का आशय
  choice: ऊँचा
  alternative: महान / प्रतिष्ठित
  rationale: शब्द भौतिक ऊँचाई और प्रतिष्ठा दोनों का बोध करा सकता है; ‘ऊँचा’ इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ पूरे पद में एकरूप है; ‘कहेगा’ से हिब्रू का वितरणात्मक एकवचन सुरक्षित है।
