source:
  edition: WLC
  text: הֵ֣ן אֶֽעֱצֹ֤ר הַ/שָּׁמַ֨יִם֙ וְ/לֹֽא יִהְיֶ֣ה מָטָ֔ר וְ/הֵן אֲצַוֶּ֥ה עַל חָגָ֖ב לֶ/אֱכ֣וֹל הָ/אָ֑רֶץ וְ/אִם אֲשַׁלַּ֥ח דֶּ֖בֶר בְּ/עַמִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/013.yaml
  text: When I shut up the heavens so that there is no rain[a], or command the locust to devour the land, or send pestilence among my people[b],
translation:
  language: hi
  text: जब मैं आकाश को ऐसा बन्द कर दूँ कि वर्षा न हो[a], या टिड्डियों को भूमि को खा जाने की आज्ञा दूँ, या अपनी प्रजा के बीच महामारी भेजूँ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं आकाश को बन्द कर दूँ ...।” आरम्भिक इब्रानी अव्यय का अधिक शाब्दिक अनुवाद “यदि निश्चय ही” या “देखो, यदि” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “महामारी” के स्थान पर “घातक रोग” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: जब
  rationale: यहाँ यह अव्यय संभावित शर्त या परिस्थिति का आरम्भ करता है। अगले पद में आने वाली प्रतिक्रिया की शर्त के साथ ‘जब’ स्वाभाविक हिन्दी बनाता है; ‘यदि’ भी सम्भव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: אֶעֱצֹר הַשָּׁמַיִם
  choice: मैं आकाश को ऐसा बन्द कर दूँ
  rationale: עצר और ‘आकाश’ का मेल वर्षा रोकने का सजीव रूपक है। ‘बन्द कर दूँ’ मूल बिम्ब बचाता है, और ‘ऐसा’ अगली परिणामसूचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: कि वर्षा न हो
  rationale: यह आकाश बन्द करने का परिणाम बताता है। यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: אֲצַוֶּה עַל חָגָב
  choice: टिड्डियों को ... आज्ञा दूँ
  rationale: חָגָב व्याकरणतः एकवचन होते हुए भी यहाँ सामूहिक अर्थ रखता है। हिन्दी में विनाशकारी दल के लिए बहुवचन ‘टिड्डियों’ अधिक स्वाभाविक है।
- source_word: לֶאֱכֹל הָאָרֶץ
  choice: देश चट कर जाने
  rationale: शाब्दिक अर्थ ‘देश को खाने’ का है। टिड्डियों के सन्दर्भ में ‘चट कर जाना’ विनाशकारी भक्षण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; הָאָרֶץ का आशय यहाँ वाचा से सम्बन्धित देश/भूमि है।
- source_word: אֲשַׁלַּח דֶּבֶר
  choice: महामारी भेजूँ
  rationale: דֶּבֶר व्यापक संक्रामक घातक रोग को सूचित करता है। ‘महामारी’ आधुनिक पाठक के लिए स्पष्ट है और दैवी न्याय की गम्भीरता बनाए रखता है।
- source_word: בְּעַמִּי
  choice: अपनी प्रजा के बीच
  rationale: בְּ यहाँ लोगों के मध्य फैलने का स्थानगत भाव देता है। ‘प्रजा’ परमेश्वर और उसके वाचा-समुदाय के सम्बन्ध को गरिमापूर्ण हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: दैवी दण्डों को शर्तगत परिस्थितियों के रूप में प्रस्तुत करना
  choice: पहली परिस्थिति के लिए ‘जब’ और अगली वैकल्पिक परिस्थितियों के लिए ‘या’
  alternative: ‘यदि मैं आकाश बन्द कर दूँ ...’ अथवा ‘देखो, यदि मैं ...’
  rationale: इब्रानी הֵן सम्भावित परिस्थिति प्रस्तुत कर सकता है और पद 14 की शर्त से जुड़ता है। ‘जब ... या ... या’ सहज हिन्दी में परमेश्वर की प्रत्यक्ष कर्तृता बनाए रखता है, जबकि ‘यदि’ की वास्तविक सम्भावना पाद-टिप्पणी में दी गई है।
- issue: न्याय में परमेश्वर की प्रत्यक्ष कर्तृता
  choice: ‘मैं ... बन्द कर दूँ’, ‘आज्ञा दूँ’, और ‘भेजूँ’ को स्पष्ट रखना
  alternative: निष्क्रिय रूपों में अकाल, टिड्डी-दल या महामारी का केवल घटित होना बताना
  rationale: मूल पाठ तीनों विपत्तियों के लिए परमेश्वर को स्पष्ट कर्ता बताता है; इसे नरम या अप्रत्यक्ष नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘आकाश बन्द करना’ मूल बिम्ब को बनाए रखता है, ‘चट कर जाना’ टिड्डियों के विनाशकारी भक्षण को स्वाभाविक हिन्दी में व्यक्त करता है, और पद के अन्त का अल्पविराम अगले पद से इसके वाक्यगत सम्बन्ध को दर्शाता है।
