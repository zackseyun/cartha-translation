base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/010.yaml
  text: And on the twenty-third day of the seventh month he sent the people to their tents[b][a], rejoicing and glad of heart because of the goodness that Yahweh had shown to David and to Solomon and to Israel his people.
translation:
  language: hi
  text: सातवें महीने के तेईसवें दिन उसने लोगों को अपने तंबुओं[a] को लौटने के लिए विदा किया। वे उस भलाई के कारण आनन्दित और मन से प्रसन्न थे, जो यहोवा[b] ने दाऊद, सुलैमान और अपनी प्रजा इस्राएल के लिए की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अपने घरों को लौटने के लिए।” शाब्दिक: “अपने तंबुओं को।”'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה है; इसका प्राचीन उच्चारण निश्चित नहीं है। इसे प्रायः “याहवे” भी लिखा जाता है।
    reason: textual_or_pronunciation_clarification
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וּשְׁלֹשָׁה לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के तेईसवें दिन
  rationale: हिब्रू तिथि-विन्यास को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; आरम्भिक וּ को हिन्दी कथात्मक प्रवाह में अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: שִׁלַּח
  choice: उसने ... विदा किया
  rationale: पिएल रूप यहाँ एकत्र लोगों को लौटने के लिए विदा करने का अर्थ देता है। हिन्दी में ‘विदा किया’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: לְאָהֳלֵיהֶם
  choice: उनके तंबुओं के लिए
  rationale: मूल का ठोस शब्द ‘तंबू’ सुरक्षित रखा गया है; मुहावरेदार अर्थ ‘घर’ पादटिप्पणी में दिया गया है।
- source_word: שְׂמֵחִים וְטוֹבֵי לֵב
  choice: आनन्दित और मन से प्रसन्न
  rationale: दोनों समानान्तर भावों को अलग रखते हुए טוֹבֵי לֵב के हृदय/अंतरमन-संबंधी मुहावरे को सहज हिन्दी में व्यक्त किया गया है।
- source_word: עַל הַטּוֹבָה אֲשֶׁר עָשָׂה
  choice: उस भलाई के कारण ... जो ... ने ... के लिए की थी
  rationale: עָשָׂה का मूल अर्थ ‘करना’ तथा लाभार्थी לְ को स्पष्ट रखा गया है। ‘भलाई की’ हिन्दी में स्वाभाविक भी है और स्रोत के निकट भी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप द्वारा परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत किया गया है; उच्चारण की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: לְדָוִיד וְלִשְׁלֹמֹה וּלְיִשְׂרָאֵל עַמּוֹ
  choice: दाऊद, सुलैमान और अपनी प्रजा इस्राएल के लिए
  rationale: बार-बार आए לְ को हिन्दी में साझा ‘के लिए’ से स्वाभाविक ढंग से व्यक्त किया गया है; עַמּוֹ को ‘अपनी प्रजा’ कहकर उसका सम्बन्ध यहोवा से स्पष्ट रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत नाम है, इसलिए ‘प्रभु’ जैसा पदनाम नहीं रखा गया। हिन्दी पाठकों के लिए परिचित रूप ‘यहोवा’ मुख्य पाठ में है, जबकि नाम के प्राचीन उच्चारण की अनिश्चितता और ‘याहवे’ विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: दाऊद, सुलैमान और इस्राएल के प्रति की गई ‘भलाई’
  choice: इन तीनों को व्याकरणतः भलाई के लाभार्थियों के रूप में समानान्तर रखा गया
  alternative: भलाई को किसी एक व्यक्ति तक सीमित करना या प्रत्येक के लिए उसका स्वरूप स्पष्ट करना
  rationale: मूल पाठ तीनों के साथ לְ का प्रयोग करता है, पर भलाई का विशिष्ट स्वरूप नहीं बताता; अनुवाद इस खुलापन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘आनन्दित’ और ‘प्रसन्न’ सामान्य पाठक के लिए बोधगम्य हैं; ‘तंबू’ मूल बिंब को बनाए रखता है।
