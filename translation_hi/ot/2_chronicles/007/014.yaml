base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/014.yaml
  text: if my people[a], who are called by my name, humble themselves, and pray and seek my face, and turn from their evil ways, then I will hear from heaven, and I will forgive their sin and heal their land.
translation:
  language: hi
  text: यदि मेरे लोग[a], जो मेरे नाम से पुकारे जाते हैं, अपने को नम्र करें, प्रार्थना करें, मेरा सान्निध्य खोजें और अपने बुरे मार्गों से फिरें, तो मैं स्वर्ग से सुनूँगा, उनके पाप को क्षमा करूँगा और उनकी भूमि को चंगा करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिन पर मेरा नाम पुकारा गया है”; यह हिब्रू मुहावरा परमेश्वर से संबंध रखने या उसका नाम धारण करने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִכָּנְעוּ
  choice: अपने आप को दीन करे
  rationale: निफ़ाल रूप यहाँ शर्त के अंतर्गत स्वेच्छापूर्ण आत्म-दीनता व्यक्त करता है। यह हिंदी में स्वाभाविक है और केवल निष्क्रिय ‘दीन हो जाए’ की अपेक्षा भाव को अधिक स्पष्ट रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: यह परमेश्वर से संबंध रखने वाले सामूहिक समुदाय का वाचक है; ‘प्रजा’ इस वाचा-संबंधी सामूहिक अर्थ को गरिमापूर्ण हिंदी में व्यक्त करती है।
- source_word: אֲשֶׁר נִקְרָא שְׁמִי עֲלֵיהֶם
  choice: जो मेरे नाम से पुकारी जाती है
  rationale: यह हिब्रू मुहावरा परमेश्वर से संबंध और उसकी पहचान धारण करने को दर्शाता है। मुख्य पाठ में सहज हिंदी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְיִתְפַּלְלוּ
  choice: प्रार्थना करे
  rationale: हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है; किससे प्रार्थना की जाती है, यह प्रसंग में स्पष्ट है।
- source_word: וִיבַקְשׁוּ פָנַי
  choice: मेरे मुख को खोजे
  rationale: ‘मुख’ की मूल उपमा को बनाए रखा गया है, जो परमेश्वर की उपस्थिति और अनुग्रह की खोज का समृद्ध भाव रखती है।
- source_word: וְיָשֻׁבוּ מִדַּרְכֵיהֶם הָרָעִים
  choice: अपने बुरे मार्गों से फिरे
  rationale: שׁוב नैतिक दिशा-परिवर्तन का संकेत देता है; ‘फिरना’ पश्चात्ताप के भाव को व्यक्त करता है और ‘मार्गों’ का बहुवचन बनाए रखता है।
- source_word: וַאֲנִי אֶשְׁמַע מִן הַשָּׁמַיִם
  choice: तो मैं स्वर्ग से सुनूँगा
  rationale: ‘तो’ शर्त और परिणाम की संरचना स्पष्ट करता है; ‘स्वर्ग से’ हिब्रू מן הַשָּׁמַיִם के स्थानगत भाव को बनाए रखता है।
- source_word: וְאֶסְלַח לְחַטָּאתָם
  choice: उनका पाप क्षमा करूँगा
  rationale: हिब्रू में ‘पाप’ एकवचन है और सामूहिक दोष का बोध कराता है; हिंदी में भी एकवचन स्वाभाविक है।
- source_word: וְאֶרְפָּא אֶת אַרְצָם
  choice: उनकी भूमि को चंगा करूँगा
  rationale: רפא का मूल उपचारात्मक रूपक ‘चंगा करना’ से सुरक्षित रहता है; इसे अधिक व्याख्यात्मक ‘पुनर्स्थापित करना’ में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय उत्तर की शर्तात्मक संरचना
  choice: आरंभ में ‘यदि’ और परिणाम में ‘तो’ रखकर शर्त-परिणाम संबंध स्पष्ट किया गया।
  alternative: सभी उपवाक्यों को केवल ‘और’ से समन्वित करना।
  rationale: हिब्रू में वाव की शृंखला होने पर भी प्रसंग स्पष्टतः शर्त और उसके बाद ईश्वरीय उत्तर प्रस्तुत करता है; ‘यदि…तो’ हिंदी में उसी तर्क को स्वाभाविक ढंग से व्यक्त करता है।
- issue: परमेश्वर के नाम का वाचा-संबंधी मुहावरा
  choice: ‘जो मेरे नाम से पुकारी जाती है’
  alternative: ‘जिस पर मेरा नाम पुकारा गया है’
  rationale: मुख्य अनुवाद परमेश्वर से संबंध और पहचान का भाव सहज हिंदी में देता है, जबकि अधिक शाब्दिक और कुछ हद तक अस्पष्ट स्थानगत मुहावरा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। सामूहिक कर्ता ‘प्रजा’ के साथ एकवचन क्रियाएँ प्रयुक्त हुई हैं। ‘मेरे मुख को खोजे’ और ‘भूमि को चंगा करूँगा’ जैसे मूल रूपकों को जानबूझकर सुरक्षित रखा गया है।
