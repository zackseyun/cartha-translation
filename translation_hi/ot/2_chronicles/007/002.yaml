id: 2CH.7.2
reference: 2 Chronicles 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֤א יָֽכְלוּ֙ הַ/כֹּ֣הֲנִ֔ים לָ/ב֖וֹא אֶל בֵּ֣ית יְהוָ֑ה כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/002.yaml
  text: And the priests were not able to enter the house of Yahweh[a], because the glory of Yahweh filled the house of Yahweh.
translation:
  language: hi
  text: और याजक याहवे के भवन[a] में प्रवेश नहीं कर सके, क्योंकि याहवे की महिमा ने याहवे के भवन को भर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मंदिर। इब्रानी में शाब्दिक रूप से ‘याहवे का भवन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכְלוּ
  choice: और ... नहीं कर सके
  rationale: संयोजक וְ कथा को आगे बढ़ाता है, और יכל क्षमता व्यक्त करता है। यह हिंदी प्रयोग असमर्थता को स्वाभाविक ढंग से व्यक्त करता है, बिना यह तय किए कि बाधा भौतिक थी या उपासना-संबंधी।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मंदिर और इस्राएली उपासना के संदर्भ में כֹּהֲנִים का प्रचलित और सटीक हिंदी रूप।
- source_word: לָבוֹא אֶל
  choice: में प्रवेश करना
  rationale: בוא के साथ אֶל यहाँ किसी स्थान के भीतर जाने का अर्थ देता है; ‘प्रवेश करना’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: शाब्दिक रूप से ‘याहवे का घर/भवन’। ‘भवन’ मूल रूपक को बनाए रखता है और इस प्रसंग में मंदिर का संकेत देता है। दोनों बार यही रूप रखकर इब्रानी पुनरुक्ति सुरक्षित की गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय दिव्य नाम का हिंदी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי याजकों के प्रवेश न कर सकने का कारण बताता है।
- source_word: מָלֵא
  choice: भर दिया था
  rationale: क्रिया के साथ कर्म-सूचक אֶת आया है, इसलिए इसे सकर्मक रूप में व्यक्त किया गया है। पूर्णभूत रूप पूर्व में घट चुकी उस दशा को स्पष्ट करता है जिसके कारण याजक प्रवेश नहीं कर सके।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: यह संबंधवाचक इब्रानी संरचना का सीधा, स्वाभाविक और धर्मवैचारिक रूप से तटस्थ हिंदी रूप है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
- issue: יְהוָה के ‘भवन’ का आशय
  choice: मुख्य पाठ में ‘भवन’, टिप्पणी में ‘मंदिर’
  alternative: मुख्य पाठ में ‘मंदिर’
  rationale: ‘भवन’ इब्रानी בֵּית की शब्दावली और उसकी पुनरावृत्ति को सुरक्षित रखता है; टिप्पणी सामान्य पाठक के लिए स्पष्ट करती है कि यहाँ मंदिर अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण धार्मिक गद्य। वाक्य ने इब्रानी की कारणात्मक संरचना और ‘याहवे के भवन’ की पुनरावृत्ति को बनाए रखा है।
