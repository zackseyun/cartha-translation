  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּזְבַּ֞ח הַ/מֶּ֣לֶךְ שְׁלֹמֹה֮ אֶת זֶ֣בַח הַ/בָּקָ֗ר עֶשְׂרִ֤ים וּ/שְׁנַ֨יִם֙ אֶ֔לֶף וְ/צֹ֕אן מֵאָ֥ה וְ/עֶשְׂרִ֖ים אָ֑לֶף וַֽ/יַּחְנְכוּ֙ אֶת בֵּ֣ית הָֽ/אֱלֹהִ֔ים הַ/מֶּ֖לֶךְ וְ/כָל הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/007/005.yaml
  text: And King Solomon sacrificed twenty-two thousand cattle and one hundred twenty thousand sheep[a], and the king and all the people dedicated the house of God.
translation:
  language: hi
  text: और राजा सुलैमान ने बाईस हज़ार गाय-बैलों और एक लाख बीस हज़ार भेड़-बकरियों का बलिदान चढ़ाया, और राजा तथा सारी प्रजा ने परमेश्वर के भवन का समर्पण किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: बलिदान चढ़ाया
  rationale: ज़בח का यहाँ धार्मिक बलिदान का अर्थ है; यह हिंदी प्रयोग वध और अर्पण के संयुक्त अनुष्ठानिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זֶבַח הַבָּקָר
  choice: गाय-बैल
  rationale: בקר बड़े पालतू पशुओं, अर्थात गोवंश, का सामूहिक बोध कराता है; 'गाय-बैल' साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: बाईस हज़ार
  rationale: हिब्रू संख्या का मानक आधुनिक हिंदी रूप।
- source_word: וְצֹאן
  choice: भेड़-बकरियों
  rationale: צאן छोटे पालतू पशुओं का सामूहिक शब्द है, जिसमें भेड़ और बकरियाँ दोनों सम्मिलित हो सकती हैं; संयुक्त हिंदी पद मूल की व्यापकता सुरक्षित रखता है।
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: एक लाख बीस हज़ार
  rationale: हिब्रू संख्या 120,000 का स्वाभाविक भारतीय हिंदी रूप।
- source_word: וַיַּחְנְכוּ
  choice: समर्पण किया
  rationale: חנך यहाँ भवन के औपचारिक समर्पण अथवा उद्घाटन को दर्शाता है; मंदिर-संदर्भ में 'समर्पण किया' स्पष्ट और प्रतिष्ठित हिंदी है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: मूल अभिव्यक्ति 'परमेश्वर का भवन' को बनाए रखता है, बिना उसे व्याख्यात्मक रूप से केवल 'मंदिर' कर देने के।
- source_word: הַמֶּלֶךְ וְכָל הָעָם
  choice: राजा और सारी प्रजा
  rationale: पहले सुलैमान का नाम आने के बाद मूल पाठ फिर 'राजा' कहता है; 'सारी प्रजा' עם के सामूहिक अर्थ को सहज हिंदी में व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। צאן की व्यापकता मुख्य पाठ में ही 'भेड़-बकरियों' द्वारा व्यक्त की गई है, इसलिए पादटिप्पणी आवश्यक नहीं। हिब्रू के दूसरे וַ को केवल क्रमसूचक 'और' मानने के बजाय बलिदानों के परिणामस्वरूप हुए सामूहिक समर्पण का संबंध दिखाने हेतु 'इस प्रकार' रखा गया है।
