  text: He made ten basins and set five on the right and five on the left[a], to wash in them; in them they would rinse the things used for the burnt offering[c][b]. But the sea was for the priests to wash in.
translation:
  language: hi
  text: उसने धोने के दस पात्र[a] बनाए और उनमें से पाँच दाहिनी ओर और पाँच बाईं ओर रखे, उनमें धोने के लिए। होमबलि से संबंधित वस्तुओं को उनमें धोकर साफ किया जाता था। परन्तु ‘सागर’[b] याजकों के धोने के लिए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हौद” या “धोने के बड़े पात्र।”
    reason: lexical_alternative
  - marker: b
    text: ‘सागर’ उस विशाल काँसे के जलाशय का नाम था जिसमें याजक धोते थे।
    reason: cultural_note
