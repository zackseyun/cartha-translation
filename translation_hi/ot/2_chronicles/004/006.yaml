  rationale: हिफ़ील रूप धोकर साफ करने या पानी से खंगालने का भाव देता है; अपूर्ण काल को यहाँ नियमित प्रथा के रूप में व्यक्त किया गया है।
- source_word: וְהַיָּם
  choice: ‘सागर’
  rationale: विशाल काँसे के जलाशय का विशिष्ट नाम सुरक्षित रखा गया है; उद्धरण-चिह्न पाठक को संकेत देते हैं कि यह सामान्य समुद्र नहीं, एक नामित पात्र है।
- source_word: לַכֹּהֲנִים
  choice: याजकों के लिए
  rationale: उपयोग या उद्देश्य का संक्षिप्त और स्वाभाविक हिन्दी रूप।
