source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ שְׁלֹמֹ֔ה אֵ֚ת כָּל הַ/כֵּלִ֔ים אֲשֶׁ֖ר בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/אֵת֙ מִזְבַּ֣ח הַ/זָּהָ֔ב וְ/אֶת הַ/שֻּׁלְחָנ֔וֹת וַ/עֲלֵי/הֶ֖ם לֶ֥חֶם הַ/פָּנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/019.yaml
  text: 'And Solomon made all the vessels that were for the house of God: the golden altar[a], the tables, and on them the bread of the Presence.'
translation:
  language: hi
  text: 'सुलैमान ने परमेश्वर के भवन के लिए सारी सामग्री बनाई: सोने की वेदी, मेज़ें, और उन पर उपस्थिति की रोटी[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उपस्थिति की रोटी”; अर्थात् परमेश्वर के सम्मुख रखी रोटी। परंपरागत रूप से, “भेंट की रोटी।”
    reason: लֶחֶם הַפָּנִים के शाब्दिक तकनीकी पद, उसके संदर्भगत अर्थ, और प्रचलित पारंपरिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाए
  rationale: עשה का मूल अर्थ ‘बनाना’ है। राजकीय निर्माण के संदर्भ में सुलैमान के द्वारा कारीगरों से वस्तुएँ तैयार कराए जाने का स्वाभाविक हिन्दी बोध ‘बनवाए’ से व्यक्त होता है।
- source_word: כָּל הַכֵּלִים
  choice: सभी पात्र
  rationale: כֵּלִים उपासना में काम आनेवाले पात्रों और उपकरणों को दर्शाता है। ‘पात्र’ मंदिर-संदर्भ में संक्षिप्त, परिचित और गरिमापूर्ण है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह इब्रानी पद का निकट और स्वाभाविक अनुवाद है; ‘मंदिर’ अर्थ की व्याख्या करता, जबकि ‘भवन’ मूल रूपक को बनाए रखता है।
- source_word: מִזְבַּח הַזָּהָב
  choice: सोने की वेदी
  rationale: सम्बन्धवाचक इब्रानी पदबंध का यह स्वाभाविक हिन्दी रूप है।
- source_word: הַשֻּׁלְחָנוֹת
  choice: मेज़ें
  rationale: बहुवचन को सीधे और स्पष्ट रूप से बनाए रखा गया है।
- source_word: וַעֲלֵיהֶם
  choice: और उन पर
  rationale: मेज़ों पर रोटी रखे जाने का स्थान-संबंध और इब्रानी समन्वय दोनों सुरक्षित हैं।
- source_word: לֶחֶם הַפָּנִים
  choice: परमेश्वर के सामने रखी जानेवाली रोटी
  rationale: शाब्दिक ‘उपस्थिति की रोटी’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है। चुना हुआ रूप मंदिर में परमेश्वर के सम्मुख रखी रोटी का आशय स्पष्ट करता है, और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: בֵּית הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मंदिर
  rationale: ‘भवन’ मूल इब्रानी ‘घर/भवन’ की संज्ञा को सुरक्षित रखता है और प्रसंग से मंदिर का अर्थ स्पष्ट रहता है।
- issue: לֶחֶם הַפָּנִים का अनुवाद
  choice: परमेश्वर के सामने रखी जानेवाली रोटी
  alternative: उपस्थिति की रोटी
  rationale: यह अनुष्ठानिक अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, पर ‘परमेश्वर’ को वाक्य में जोड़ना पद के धार्मिक संदर्भ की व्याख्यात्मक अभिव्यक्ति है; इसलिए अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, किंतु मंदिर-सामग्री की सूची के अनुरूप गरिमापूर्ण। वाक्य-रचना मूल के निकट रखी गई है, जबकि कठिन अनुष्ठानिक पद को अर्थ-स्पष्ट रूप में प्रस्तुत किया गया है।
