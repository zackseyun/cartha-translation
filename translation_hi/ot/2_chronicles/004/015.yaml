translation:
  language: hi
  text: एक “सागर” और उसके नीचे बारह बैल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיָּם
  choice: विशाल हौद, जो “सागर” कहलाता था
  rationale: יָם का शाब्दिक अर्थ ‘सागर’ है, पर मन्दिर के सामान के इस प्रसंग में यह ढले हुए बड़े हौद का नाम है। मुख्य पाठ में वस्तु और उसके नाम दोनों को स्पष्ट करना आधुनिक हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: אֶחָד
  choice: एक
  rationale: यह संख्या ‘सागर’ कहलाने वाले हौद की गिनती बताती है और सूची की संक्षिप्त शैली बनाए रखती है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: בָּקָר गोवंश के लिए सामूहिक शब्द है; यहाँ हौद को सहारा देने वाली बारह गो-आकृतियाँ अभिप्रेत हैं। ‘बैल’ प्रसंग में सहज है, जबकि ‘साँड़’ मूल शब्द से अधिक विशिष्ट होगा।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: संयुक्त संख्या का सीधा और मानक हिन्दी रूप।
- source_word: תַּחְתָּיו
  choice: उसके नीचे
  rationale: पुल्लिंग एकवचन प्रत्यय का संदर्भ ‘सागर’ कहलाने वाले हौद से है; ‘उसके नीचे’ संक्षिप्त और स्वाभाविक है।
- source_word: אֶת ... וְאֶת
  choice: अलग से अनूदित नहीं
  rationale: ये प्रत्यक्ष कर्म-सूचक चिह्न हैं; हिन्दी में कर्मों के क्रम और ‘और’ से उनका कार्य व्यक्त होता है।
