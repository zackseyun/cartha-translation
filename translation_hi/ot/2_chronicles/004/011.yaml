base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/011.yaml
  text: 'Huram made the pots[a], the shovels, and the bowls. So Huram finished the work that he did for King Solomon in the house of God:'
translation:
  language: hi
  text: 'हूराम ने हंडियाँ[a], फावड़े और कटोरे बनाए। और हूराम ने वह काम पूरा किया जो उसने राजा सुलैमान के लिए परमेश्वर के भवन में किया था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में इस नाम की वर्तनी इस पद और संबंधित अंशों में ‘हीराम’ भी मिलती है।
    reason: alternative_reading
lexical_decisions:
- source_word: חוּרָם / חירם
  choice: हूराम
  rationale: पद में मुख्यतः स्वरांकित रूप חוּרָם को दर्शाता है; इसलिए हिन्दी में निकट लिप्यंतरण ‘हूराम’ रखा गया है, जबकि इसी नाम की दूसरी वर्तनी पादटिप्पणी में दी गई है।
- source_word: הַסִּירוֹת
  choice: हंडियाँ
  rationale: यह बहुवचन सामान्यतः धातु के बर्तनों या हंडियों को सूचित करता है। ‘हंडियाँ’ आधुनिक हिन्दी में ठोस और सहज है तथा वस्तु का कार्य अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַיָּעִים
  choice: फावड़े
  rationale: यह वेदी से राख या अन्य पदार्थ हटाने के उपकरणों के लिए प्रयुक्त शब्द है; ‘फावड़े’ मानक और प्रसंगानुकूल हिन्दी है।
- source_word: הַמִּזְרָקוֹת
  choice: कटोरे
  rationale: ये उपासना में प्रयुक्त पात्र थे। ‘कटोरे’ अर्थ को स्पष्ट रखता है, जबकि ‘छिड़काव के कटोरे’ मूल से अधिक व्याख्यात्मक होता।
- source_word: וַיְכַל
  choice: पूरा किया
  rationale: क्रिया का अर्थ किसी काम को समाप्त या पूर्ण करना है; ‘पूरा किया’ स्वाभाविक हिन्दी में कथात्मक अर्थ व्यक्त करता है।
- source_word: אֲשֶׁר עָשָׂה לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के लिए किए गए
  rationale: यह हूराम द्वारा राजा सुलैमान के लिए किए गए नियुक्त कार्य को बताता है। कृदंत-रचना हिन्दी में पुनरुक्ति घटाते हुए सम्बन्ध स्पष्ट करती है।
- source_word: בְּבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: בְּ का सामान्य अर्थ ‘में’ और בֵּית הָאֱלֹהִים का शाब्दिक अर्थ ‘परमेश्वर का भवन’ है; यह अनुवाद मूल की स्थानवाचक अभिव्यक्ति बनाए रखता है।
theological_decisions:
- issue: בְּבֵית הָאֱלֹהִים में स्थान अथवा प्रयोजन
  choice: परमेश्वर के भवन में
  alternative: परमेश्वर के भवन के लिए
  rationale: मूल में בְּ स्वाभाविक रूप से स्थानवाचक ‘में’ पढ़ा जा सकता है। प्रसंग में भवन के लिए वस्तुएँ बनाना भी सम्भव भाव है, पर मुख्य पाठ में स्पष्ट व्याकरणिक मूल्य रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वस्तुओं के नाम ठोस रखे गए हैं, पर उनके अनुष्ठानिक उपयोग को मुख्य पाठ में आवश्यकता से अधिक विशिष्ट नहीं बनाया गया।
