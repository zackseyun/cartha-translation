source:
  edition: WLC
  text: וְ/עָבְי֣/וֹ טֶ֔פַח וּ/שְׂפָת/וֹ֙ כְּ/מַעֲשֵׂ֣ה שְׂפַת כּ֔וֹס פֶּ֖רַח שֽׁוֹשַׁנָּ֑ה מַחֲזִ֣יק בַּתִּ֔ים שְׁלֹ֥שֶׁת אֲלָפִ֖ים יָכִֽיל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/005.yaml
  text: Its thickness was a handbreadth[a], and its rim was like the work of the rim of a cup, like a lily blossom[b]. It could hold three thousand baths.
translation:
  language: hi
  text: उसकी मोटाई एक हथेली भर[a] थी, और उसका किनारा प्याले के किनारे की बनावट के समान था, जैसे सोसन का फूल। उसमें तीन हज़ार बत[b] समा सकते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हथेली’ हाथ की चौड़ाई पर आधारित एक प्राचीन माप था, लगभग चार अँगुल।
    reason: cultural_note
  - marker: b
    text: ‘बत’ प्राचीन इब्रानी द्रव-माप था। 1 राजा 7:26 में इस पात्र की धारिता दो हज़ार बत बताई गई है, जबकि यहाँ तीन हज़ार बत है। यह अंतर संभवतः सामान्य भराव और पूरी धारिता के बीच का हो सकता है, या फिर पाठ-परंपराओं के अंतर को दर्शाता है।
    reason: cultural_note_and_cross_reference
lexical_decisions:
- source_word: עָבְיוֹ
  choice: उसकी मोटाई
  rationale: ढाले हुए विशाल पात्र की दीवार की मोटाई का स्वाभाविक और संदर्भानुकूल वर्णन।
- source_word: טֶפַח
  choice: एक हथेली
  rationale: यह हाथ की चौड़ाई पर आधारित प्राचीन छोटा माप है; ‘हथेली’ सामान्य हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: שְׂפָתוֹ / שְׂפַת כּוֹס
  choice: उसका किनारा / प्याले का किनारा
  rationale: पात्र के ऊपरी घेरे के लिए ‘किनारा’ स्वाभाविक है और इब्रानी में हुई पुनरावृत्ति को भी बनाए रखता है।
- source_word: כְּמַעֲשֵׂה
  choice: की बनावट के समान
  rationale: यह वाक्यांश कारीगरी से बने आकार या रूप की तुलना करता है; अनावश्यक रूप से कोई अतिरिक्त क्रिया नहीं जोड़ी गई।
- source_word: פֶּרַח שׁוֹשַׁנָּה
  choice: सोसन के फूल जैसा
  rationale: फूल के समान बने किनारे की छवि को बनाए रखता है; ‘सोसन’ बाइबलीय हिन्दी में इस पुष्प के लिए प्रचलित नाम है।
- source_word: מַחֲזִיק ... יָכִיל
  choice: उसमें ... समा सकते थे
  rationale: कृदंत और क्रिया दोनों पात्र की धारिता पर बल देते हैं; हिन्दी में यह संयुक्त अभिव्यक्ति अर्थ को स्वाभाविक ढंग से देती है और भद्दी पुनरावृत्ति से बचती है।
- source_word: בַּתִּים שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार बत
  rationale: मूल संख्या और प्राचीन इब्रानी द्रव-माप ‘बत’ को बिना आधुनिक इकाई में अनुमानित रूपांतरण किए सुरक्षित रखा गया है।
theological_decisions:
- issue: 1 राजा 7:26 में दो हज़ार बत और यहाँ तीन हज़ार बत का अंतर
  choice: मुख्य पाठ में WLC के ‘तीन हज़ार बत’ को यथावत रखा और पादटिप्पणी में समानांतर पाठ का अंतर बताया
  alternative: दो हज़ार बत कर देना या दोनों संख्याओं में कृत्रिम सामंजस्य स्थापित करना
  rationale: इतिहासवृत्त के उपलब्ध इब्रानी पाठ की अपनी संख्या को बनाए रखना और वास्तविक पाठगत/वर्णनगत तनाव को पाठक से न छिपाना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्याला’, ‘सोसन’ और ‘बत’ बाइबलीय सांस्कृतिक संदर्भ बनाए रखते हैं; अपरिचित मापों को पादटिप्पणियों में समझाया गया है।
