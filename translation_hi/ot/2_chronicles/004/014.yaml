  text: उसने आधार[a] बनाए, और आधारों पर हौद बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौकियाँ”; इब्रानी शब्द हौदों को थामने वाली संरचनाओं के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְּכֹנוֹת
  choice: आधार
  rationale: यहाँ यह शब्द मंदिर के हौदों को थामने वाली बनाई हुई संरचनाओं को दर्शाता है। ‘आधार’ आधुनिक हिन्दी में स्वाभाविक और कार्य की दृष्टि से स्पष्ट है।
- source_word: עָשָׂה
  choice: बनाए
  rationale: सामान्य क्रिया עשה का सीधा और सहज अर्थ ‘बनाना’ है; इससे मूल की सादी अभिव्यक्ति बनी रहती है।
- source_word: הַכִּיֹּרוֹת
  choice: हौद
  rationale: כִּיּוֹר धुलाई के लिए प्रयुक्त पात्र या हौद को दर्शाता है। मंदिर के साज-सामान के संदर्भ में ‘हौद’ स्पष्ट और गरिमापूर्ण है।
- source_word: עַל
  choice: पर
  rationale: यह संबंध हौदों के आधारों के ऊपर रखे होने को व्यक्त करता है; ‘पर’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: וְאֶת ... וְאֶת
  choice: … और …
  rationale: संयोजक सहित दोहराया गया कर्म-चिह्न बनाई गई वस्तुओं की सूची को जोड़ता है; हिन्दी में दोनों खंडों को ‘और’ से जोड़ना स्वाभाविक है।
