  yaml_path: translation/ot/2_chronicles/004/003.yaml
  text: And beneath it were figures of oxen all around[a], encircling it, ten to the cubit, surrounding the Sea all around. The oxen were in two rows[c][b], cast as one piece with it.
translation:
  language: hi
  text: उसके नीचे चारों ओर बैलों की आकृतियाँ थीं[a]—प्रति हाथ दस[b]—जो समुद्र को चारों ओर घेरे हुए थीं। ये बैल-आकृतियाँ दो पंक्तियों में थीं और समुद्र के साथ एक ही ढलाई में ढाली गई थीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बैलों के प्रतिरूप”; इब्रानी शब्द सजावटी बैल-रूपों को दर्शाता है, जीवित पशुओं को नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “एक हाथ में दस”; सम्भवतः परिधि के प्रत्येक हाथ में दस आकृतियाँ थीं।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से “उसकी ढलाई में ढाले गए”; अर्थात वे समुद्र के साथ उसी ढलाई में बने थे।
    reason: lexical_alternative
