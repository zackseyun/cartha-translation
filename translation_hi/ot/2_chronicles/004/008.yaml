base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/008.yaml
  text: He made ten tables and placed them in the temple[a], five on the right and five on the left; he also made one hundred bowls of gold.
translation:
  language: hi
  text: उसने दस मेज़ें बनाईं और उन्हें मंदिर में रखीं—पाँच दाहिनी ओर और पाँच बाईं ओर। उसने सोने के सौ कटोरे[a] भी बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने के पात्र” अथवा “सोने के छिड़काव के कटोरे”; इब्रानी शब्द मंदिर की सेवा में इस्तेमाल होने वाले अनुष्ठानिक पात्रों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחָנוֹת
  choice: मेज़ें
  rationale: यह संज्ञा सामान्यतः मेज़ों को दर्शाती है; मंदिर की सामग्री के इस प्रसंग में यही सीधा और स्वाभाविक अर्थ है।
- source_word: וַיַּנַּח
  choice: रखा
  rationale: क्रिया वस्तुओं को किसी स्थान पर रखने या स्थापित करने की ठोस क्रिया बताती है; आधुनिक हिन्दी में ‘रखा’ सहज है।
- source_word: בַּהֵיכָל
  choice: मंदिर में
  rationale: इस उपासना-संबंधी प्रसंग में הֵיכָל राजमहल नहीं, मंदिर-भवन को दर्शाता है।
- source_word: מִיָּמִין ... מִשְּׂמֹאול
  choice: दाहिनी ओर ... बाईं ओर
  rationale: यह अनुवाद मूल के स्थान-सूचक विरोध को बनाए रखता है और पाठ में स्पष्ट न किए गए दक्षिण तथा उत्तर जैसे दिशासूचक अर्थ नहीं जोड़ता।
- source_word: מִזְרְקֵי זָהָב
  choice: सोने के ... कटोरे
  rationale: מִזְרָק मंदिर की सेवा में प्रयुक्त कटोरे या पात्र को दर्शाता है। मुख्य पाठ में ‘कटोरे’ स्पष्ट और सहज है, जबकि अनुष्ठानिक प्रयोग की बारीकी पादटिप्पणी में दी गई है।
- source_word: מֵאָה
  choice: सौ
  rationale: संख्या का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूची-वर्णन के अनुरूप शैली रखी गई है। पादटिप्पणी का चिह्न ‘कटोरे’ के बाद रखा गया है, क्योंकि उसका संबंध इब्रानी מִזְרָק से है, न कि ‘मंदिर’ से।
