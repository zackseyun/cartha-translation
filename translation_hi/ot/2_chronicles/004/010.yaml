- source_word: מִכֶּתֶף הַיְמָנִית קֵדְמָה
  choice: दक्षिण-पूर्व की ओर
  rationale: כָּתֵף स्थानसूचक प्रयोग में ‘पार्श्व/ओर’ है; पूर्वाभिमुख इब्रानी दिशा-बोध में ‘दाहिनी ओर’ दक्षिण को सूचित करता है और קֵדְמָה पूर्व की दिशा जोड़ता है। संयुक्त वाक्यांश का आशय दक्षिण-पूर्वी ओर है।
- source_word: מִמּוּל נֶגְבָּה
  choice: दक्षिण के सामने
  rationale: מִמּוּל का मूल संबंधपरक अर्थ ‘सामने/सम्मुख’ है और נֶגְבָּה दक्षिण दिशा बताता है; यह अनुवाद उस स्थानिक संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
