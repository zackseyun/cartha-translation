base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/002.yaml
  text: He made the Sea of cast metal[a], ten cubits from brim to brim, round all around; its height was five cubits[b], and a line of thirty cubits encircled it all around.
translation:
  language: hi
  text: उसने ढली हुई धातु से ‘सागर’[a] बनाया। वह एक किनारे से दूसरे किनारे तक दस हाथ चौड़ा और चारों ओर से गोल था। उसकी ऊँचाई पाँच हाथ थी, और तीस हाथ लंबी एक डोरी उसे चारों ओर से घेरती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “ढला हुआ सागर।” यहाँ “सागर” मन्दिर के बड़े जल-पात्र का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיָּם
  choice: ‘सागर’
  rationale: मन्दिर के सामान के प्रसंग में यह बड़े जल-पात्र का विशिष्ट नाम है। शाब्दिक अर्थ बनाए रखते हुए उद्धरण-चिह्न इसे सामान्य समुद्र के बजाय नामित पात्र के रूप में पहचानने में सहायता करते हैं।
- source_word: מוּצָק
  choice: ढली हुई धातु का
  rationale: निष्क्रिय कृदन्त धातु को साँचे में ढालकर बनाए जाने का भाव देता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: עֶשֶׂר בָּאַמָּה
  choice: दस हाथ चौड़ा
  rationale: प्राचीन माप-इकाई को प्रचलित बाइबलीय हिन्दी ‘हाथ’ से रखा गया है; अगले पदांश से स्पष्ट है कि यह आर-पार की चौड़ाई है।
- source_word: מִשְּׂפָתוֹ אֶל שְׂפָתוֹ
  choice: एक किनारे से दूसरे किनारे तक
  rationale: שָׂפָה का मूल अर्थ होंठ या किनारा है; पात्र के संदर्भ में ‘किनारा’ सहज हिन्दी है।
- source_word: עָגוֹל סָבִיב
  choice: चारों ओर से गोल
  rationale: आकार और चारों ओर होने के दोनों भावों को बिना अनावश्यक पुनरुक्ति के व्यक्त करता है।
- source_word: וְחָמֵשׁ בָּאַמָּה קוֹמָתוֹ
  choice: उसकी ऊँचाई पाँच हाथ थी
  rationale: हिब्रू के नामवाची वाक्य को स्वाभाविक हिन्दी में सहायक क्रिया के साथ प्रस्तुत किया गया है।
- source_word: וְקָו
  choice: एक डोरी
  rationale: קַו यहाँ नापने के लिए प्रयुक्त ठोस डोरी या रेखा को दर्शाता है; ‘डोरी’ उस प्राचीन मापन-चित्र को बनाए रखती है।
- source_word: יָסֹב אֹתוֹ סָבִיב
  choice: उसे चारों ओर से घेरती थी
  rationale: क्रिया का अर्थ चारों ओर जाना या घेरना है; यह हिन्दी रूप नापने की डोरी के चित्र के अनुकूल है।
