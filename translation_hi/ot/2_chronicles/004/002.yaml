translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्राचीन माप ‘हाथ’ को बदले बिना रखा गया है। हिब्रू में व्यास और परिधि के पारंपरिक प्राचीन वर्णन को यथावत प्रस्तुत किया गया है; गणितीय सामंजस्य स्थापित करने का प्रयास नहीं किया गया।
