  yaml_path: translation/ot/2_chronicles/004/018.yaml
  text: Solomon made all these vessels in very great abundance[a], for the weight of the bronze could not be determined.
translation:
  language: hi
  text: सुलैमान ने ये सभी पात्र बहुत बड़ी मात्रा में बनाए, क्योंकि कांसे का भार निर्धारित नहीं किया जा सका[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कांसे के भार का पता नहीं लगाया गया।” इब्रानी क्रिया का अर्थ “जाँचकर पता लगाना” या “निर्धारित करना” हो सकता है। इस प्रसंग में इसका अर्थ यह है कि कांसे का भार निर्धारित या हिसाब में नहीं लाया गया था; अत्यधिक मात्रा इसका कारण हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: बनवाए
  rationale: राजा सुलैमान के संदर्भ में यह क्रिया उसके अधिकार में कराए गए निर्माण को व्यक्त करती है; ‘बनवाए’ आधुनिक हिन्दी में राजकीय अभिकर्तृत्व को स्वाभाविक ढंग से बताता है।
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: ये सभी पात्र
  rationale: मन्दिर की धातु की वस्तुओं के लिए ‘पात्र’ व्यापक, सुबोध और प्रसंगानुकूल शब्द है।
- source_word: לָרֹב מְאֹד
  choice: बहुत अधिक मात्रा में
  rationale: यह पद अत्यधिक बहुलता व्यक्त करता है; यह अनुवाद רֹב और उसके तीव्रक מְאֹד दोनों का अर्थ सहज हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पिछली बात का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: לֹא נֶחְקַר
  choice: निर्धारित नहीं किया जा सका
  rationale: חקר के निफ़अल रूप का अर्थ ‘जाँचा/पता लगाया/निर्धारित किया गया’ हो सकता है; प्रसंग में कांसे की अत्यधिक मात्रा के कारण भार का हिसाब न लग सकना अभिप्रेत है।
- source_word: מִשְׁקַל
  choice: भार
  rationale: यह शब्द किसी वस्तु की मापी गई या मापी जाने वाली वजन-राशि को स्पष्ट रूप से दर्शाता है।
- source_word: הַנְּחֹשֶׁת
  choice: कांसा
  rationale: मन्दिर के उपकरणों के प्रसंग में נְחֹשֶׁת सामान्यतः कांसे को सूचित करता है; ‘कांसा’ आधुनिक मानक हिन्दी का सहज रूप है।
