  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘मन्दिर के मुख्य भवन’ से הֵיכָל की स्थानगत विशिष्टता स्पष्ट की गई है। मूल की दाहिनी/बाईं दिशा तथा כְּמִשְׁפָּטָם की अर्थगत व्यापकता सुरक्षित रखी गई है।
