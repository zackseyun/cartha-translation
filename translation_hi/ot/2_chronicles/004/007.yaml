  text: וַ֠/יַּעַשׂ אֶת מְנֹר֧וֹת הַ/זָּהָ֛ב עֶ֖שֶׂר כְּ/מִשְׁפָּטָ֑/ם וַ/יִּתֵּן֙ בַּֽ/הֵיכָ֔ל חָמֵ֥שׁ מִ/יָּמִ֖ין וְ/חָמֵ֥שׁ מִ/שְּׂמֹֽאול־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/007.yaml
  text: He made ten gold lampstands according to their prescribed design[a], and he placed them in the temple[c][b], five on the right side and five on the left.
translation:
  language: hi
  text: उसने उनके लिए ठहराई हुई विधि[a] के अनुसार सोने के दस दीप-स्तंभ बनाए और उन्हें मंदिर[b] में रखा—पाँच दाहिनी ओर और पाँच बाईं ओर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके निर्धारित नमूने के अनुसार” अथवा “उनके नियम के अनुसार।” इब्रानी शब्द ठहराए हुए नियम, विधि या नमूने को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मुख्य कक्ष में” अथवा “पवित्रस्थान में।” इब्रानी शब्द यहाँ पूरे मंदिर-परिसर के बजाय मंदिर के भवन को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “पाँच दाहिनी ओर और पाँच बाईं ओर” है। मंदिर की दिशा के अनुसार ये संभवतः दक्षिण और उत्तर की ओर संकेत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने बनाए
  rationale: עשה का सामान्य कथात्मक अर्थ ‘बनाना’ है। हिन्दी में कर्ता को एकवचन रखते हुए क्रिया निकटवर्ती बहुवचन कर्म ‘दीपवृक्ष’ के अनुसार ‘बनाए’ है।
- source_word: מְנֹרוֹת הַזָּהָב עֶשֶׂר
  choice: सोने की दस दीपवृक्ष
  rationale: מְנוֹרָה केवल दीप नहीं, दीप रखने वाला वृक्षाकार आधार है; ‘दीपवृक्ष’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और संक्षिप्त है। הַזָּהָב पदार्थ को और עֶשֶׂר संख्या दस को दर्शाता है।
- source_word: כְּמִשְׁפָּטָם
  choice: निर्धारित विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ न्याय के बजाय निर्धारित नियम, विनिर्देश या नमूने को सूचित करता है। ‘विधान’ मूल की व्यापकता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וַיִּתֵּן
  choice: और उन्हें ... रखा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; साज-सामान को किसी स्थान पर स्थापित करने के प्रसंग में ‘रखा’ स्वाभाविक हिन्दी है।
- source_word: בַּהֵיכָל
  choice: मन्दिर के मुख्य भवन में
  rationale: הֵיכָל यहाँ व्यापक मन्दिर-परिसर नहीं, मन्दिर के भवन अथवा मुख्य कक्ष को दर्शाता है। यह अनुवाद उस स्थानगत भेद को स्पष्ट रखता है।
- source_word: חָמֵשׁ מִיָּמִין וְחָמֵשׁ מִשְּׂמֹאול
  choice: पाँच दाहिनी ओर और पाँच बाईं ओर
  rationale: मूल पाठ शाब्दिक रूप से दाहिनी और बाईं ओर कहता है। सम्भावित दक्षिण और उत्तर दिशा को मुख्य पाठ में व्याख्यात्मक रूप से प्रतिस्थापित नहीं किया गया।
