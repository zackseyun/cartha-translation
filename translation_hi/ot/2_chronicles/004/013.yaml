base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/013.yaml
  text: and the four hundred pomegranates for the two latticeworks[a], two rows of pomegranates for each latticework[b], to cover the two bowl-shaped capitals that were on top of the pillars.
translation:
  language: hi
  text: और दोनों जालियों[a] के लिए चार सौ अनार—हर जाली के लिए अनारों की दो-दो पंक्तियाँ—स्तम्भों के ऊपर स्थित स्तम्भ-शीर्षों के दोनों कटोरेनुमा भागों[b] को ढकने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जालीदार सजावटों।” इब्रानी शब्द स्तम्भ-शीर्षों पर बनी जालीनुमा सजावटी कारीगरी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “स्तम्भ-शीर्षों के दोनों कटोरे।” इब्रानी में स्तम्भ-शीर्षों के गोल ऊपरी भागों के लिए कटोरे का बिंब प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רִמּוֹנִים
  choice: अनार
  rationale: शब्द का मूल अर्थ ‘अनार’ है; इस मन्दिर-सज्जा के प्रसंग में ये अनार के आकार की सजावटी आकृतियाँ हैं, पर मूल ठोस बिंब को बनाए रखा गया है।
- source_word: אַרְבַּע מֵאוֹת
  choice: चार सौ
  rationale: मूल संख्या का सीधा और औपचारिक अनुवाद।
- source_word: שְּׂבָכוֹת
  choice: जालियाँ
  rationale: यह शब्द स्तम्भ-शीर्षों पर लगी जाली जैसी सजावटी कारीगरी को दर्शाता है; ‘जालियाँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: שְׁנַיִם טוּרִים
  choice: दो-दो पंक्तियाँ
  rationale: טוּרִים व्यवस्थित पंक्तियों को दर्शाता है। ‘दो-दो’ प्रत्येक जाली के लिए दो पंक्तियों के वितरणात्मक भाव को स्पष्ट करता है।
- source_word: לַשְּׂבָכָה הָאֶחָת
  choice: हर जाली के लिए
  rationale: इब्रानी में शाब्दिक रूप से ‘एक जाली के लिए’ है, पर दोनों जालियों के संदर्भ में इसका भाव वितरणात्मक है; आधुनिक हिन्दी में ‘हर जाली के लिए’ वही अर्थ स्पष्ट करता है।
- source_word: לְכַסּוֹת
  choice: ताकि ... ढकें
  rationale: इनफ़िनिटिव उद्देश्य व्यक्त करता है; ‘ताकि ... ढकें’ हिन्दी में उस प्रयोजन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֻּלּוֹת
  choice: कटोरेनुमा भागों
  rationale: यह स्तम्भ-शीर्षों के गोल, कटोरे जैसे ऊपरी भागों का बिंब देता है; विशेषणात्मक रूप हिन्दी में वास्तु-संबंध को स्पष्ट रखता है।
- source_word: כֹּתָרוֹת
  choice: स्तम्भ-शीर्षों
  rationale: वास्तुशिल्प के संदर्भ में यह स्तम्भों के शीर्ष पर बने capitals को दर्शाता है; ‘स्तम्भ-शीर्ष’ सामान्य पाठक के लिए तकनीकी अर्थ को स्पष्ट करता है।
- source_word: עַל פְּנֵי הָעַמּוּדִים
  choice: स्तम्भों के ऊपर
  rationale: शाब्दिक रूप ‘स्तम्भों की सतह/मुख पर’ है, पर स्तम्भ-शीर्षों के वास्तु-संदर्भ में स्थान स्तम्भों के ऊपर है।
