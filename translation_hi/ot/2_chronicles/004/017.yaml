translation:
  language: hi
  text: यरदन के मैदान में राजा ने उन्हें चिकनी मिट्टी की भूमि में, सुक्कोत और सेरेदा के बीच, ढाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכִכַּר הַיַּרְדֵּן
  choice: यरदन के मैदान में
  rationale: כִּכָּר यहाँ यरदन क्षेत्र के समतल भूभाग को सूचित करता है; ‘मैदान’ सहज आधुनिक हिन्दी में भौगोलिक अर्थ बनाए रखता है।
- source_word: יְצָקָם
  choice: उन्हें ... ढाला
  rationale: יצק का प्रयोग पिघली धातु उंडेलकर वस्तुएँ बनाने के लिए होता है। पिछले संदर्भ की काँसे की वस्तुओं के कारण ‘ढाला’ स्वाभाविक और सटीक है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा संदर्भ में सुलैमान को सूचित करती है; हिन्दी में ‘राजा’ पर्याप्त और स्वाभाविक है।
- source_word: בַּעֲבִי הָאֲדָמָה
  choice: चिकनी मिट्टी की भूमि में
  rationale: עֲבִי का मूल भाव मोटाई या सघनता है; אֲדָמָה के साथ यह साँचे बनाने योग्य घनी, चिकनी मिट्टी वाली भूमि को सूचित करता है। अनिश्चित शाब्दिकता के बजाय प्रसंगगत भौतिक अर्थ व्यक्त किया गया है।
- source_word: בֵּין סֻכּוֹת וּבֵין צְרֵדָתָה
  choice: सुक्कोत और सरेदा के बीच
  rationale: दोनों स्थान-नाम मूल पाठ के रूपों के अनुसार देवनागरी में लिप्यंतरित किए गए हैं। सरेदा के समानांतर पाठ में मिलने वाले भिन्न नाम-रूप को पादटिप्पणी में रखा गया है।
