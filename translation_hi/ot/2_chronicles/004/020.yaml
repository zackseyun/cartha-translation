translation:
  language: hi
  text: और शुद्ध सोने के दीपाधारों तथा उनके दीपकों को भीतरी पवित्रस्थान के सामने विधान के अनुसार जलाने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרוֹת
  choice: दीवटों
  rationale: מְנוֹרָה मंदिर के दीप रखने वाले आधार को दर्शाता है। ‘दीवट’ आधुनिक हिन्दी में संक्षिप्त और प्रसंगानुकूल है।
- source_word: וְנֵרֹתֵיהֶם
  choice: तथा उनके दीपकों को
  rationale: נֵר यहाँ दीवटों पर रखे जाने वाले दीपकों को दर्शाता है; ‘दीपक’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: לְבַעֲרָם
  choice: जिन्हें ... जलना था
  rationale: प्रत्यय सहित क्रियार्थक रूप दीपकों को जलाए रखने के उद्देश्य को व्यक्त करता है। हिन्दी में यह रचना स्वाभाविक रूप से उसी प्रयोजन को बताती है।
- source_word: כַּמִּשְׁפָּט
  choice: विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ उपासना के लिए निर्धारित रीति या नियम को दर्शाता है; ‘विधान के अनुसार’ उसका औपचारिक भाव बनाए रखता है।
- source_word: לִפְנֵי הַדְּבִיר
  choice: भीतरी पवित्रस्थान के सामने
  rationale: דְּבִיר मंदिर के अंतरतम पवित्र कक्ष को दर्शाता है। ‘भीतरी पवित्रस्थान’ अर्थ को स्पष्ट करता है, बिना किसी बाद की पारिभाषिक अभिव्यक्ति को अनिवार्य बनाए।
- source_word: זָהָב סָגוּר
  choice: शुद्ध सोने के
  rationale: यह पद उच्च गुणवत्ता वाले परिशोधित सोने को दर्शाता है। ‘शुद्ध सोना’ स्वाभाविक हिन्दी है और पदार्थ की गुणवत्ता स्पष्ट करता है।
- source_word: וְאֶת
  choice: और
  rationale: संयोजक सहित कर्मसूचक चिह्न पिछली आयत से जारी सूची में एक और वस्तु जोड़ता है; हिन्दी में ‘और’ से सूची का संबंध बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। यह पद पिछली आयतों से चली आ रही सूची का अंश है; हिन्दी वाक्य में स्पष्टता के लिए अंतिम सामग्री-वर्णन को ‘ये सब ... थे’ के रूप में व्यक्त किया गया है।
