- source_word: פֹנִים
  choice: के मुँह ... की ओर थे
  rationale: शाब्दिक ‘मुँह’ को रखते हुए दिशा की ओर उन्मुख होने का आशय स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से ‘समुद्र की ओर’, पर दिशासूचक प्रयोग में इसका अर्थ ‘पश्चिम की ओर’ है।
- source_word: הַיָּם
  choice: सागर
  rationale: सन्दर्भ में यह मन्दिर के विशाल पात्र का विशिष्ट नाम है; ‘सागर’ मूल रूपक और वस्तु की पहचान बनाए रखता है।
- source_word: עֲלֵיהֶם מִלְמָעְלָה
  choice: उनके ऊपर था
  rationale: बैलों के ऊपर सागर की स्थानगत स्थिति को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: אֲחֹרֵיהֶם
  choice: उन सबके पिछले भाग
  rationale: मूल का अर्थ ‘उनके पीछे/पिछले हिस्से’ है; यह चयन अशिष्टता से बचते हुए पशु-प्रतिमाओं की बनावट स्पष्ट करता है।
- source_word: בָּיְתָה
  choice: भीतर की ओर
  rationale: दिशासूचक रूप यहाँ केन्द्र अथवा अन्दर की ओर उन्मुखता बताता है।
