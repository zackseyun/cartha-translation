base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/004.yaml
  text: 'It stood on twelve oxen: three facing north[a], three facing west, three facing south, and three facing east. The Sea was above them[b], and all their rear parts were inward.'
translation:
  language: hi
  text: 'वह बारह बैलों पर रखा था: तीन बैल उत्तर की ओर मुँह किए हुए थे, तीन पश्चिम की ओर,[a] तीन दक्षिण की ओर और तीन पूर्व की ओर। सागर उनके ऊपर था, और उन सबके पिछले भाग भीतर की ओर थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘समुद्र की ओर’ है; यहाँ यह पश्चिम दिशा के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
