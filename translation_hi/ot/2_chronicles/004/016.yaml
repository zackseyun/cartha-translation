  text: וְ/אֶת הַ֠/סִּירוֹת וְ/אֶת הַ/יָּעִ֤ים וְ/אֶת הַ/מִּזְלָגוֹת֙ וְ/אֶת כָּל כְּלֵי/הֶ֔ם עָשָׂ֞ה חוּרָ֥ם אָבִ֛יו לַ/מֶּ֥לֶךְ שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה נְחֹ֖שֶׁת מָרֽוּק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/016.yaml
  text: And Huram-abi made the pots[a], the shovels, the forks, and all their utensils for King Solomon, for the house of Yahweh[c][b], of polished bronze.
translation:
  language: hi
  text: और हूराम-अबी[a] ने राजा सुलैमान के लिए, यहोवा के भवन के लिए, चमकाए हुए काँसे के बर्तन, फावड़े, काँटे और इनसे संबंधित सभी उपकरण बनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “हूराम-अबी”; इसका अनुवाद “हूराम, उसका पिता” भी हो सकता है, पर यहाँ संभवतः यह कारीगर का नाम या उपाधि है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַסִּירוֹת
  choice: बर्तन
  rationale: यह शब्द यहाँ मंदिर के काम में आने वाले पात्रों के लिए है; सामान्य और स्वाभाविक हिन्दी में ‘बर्तन’ उपयुक्त है।
- source_word: הַיָּעִים
  choice: फावड़े
  rationale: ये राख हटाने या अंगारे सँभालने के उपकरण थे; ‘फावड़े’ प्रचलित और संदर्भानुकूल है।
- source_word: הַמִּזְלָגוֹת
  choice: काँटे
  rationale: शब्द काँटे जैसे उपकरणों को दर्शाता है; ‘काँटे’ सरल है और अनावश्यक विशिष्टता से बचता है।
- source_word: כָּל כְּלֵיהֶם
  choice: उनसे संबंधित सभी उपकरण
  rationale: शाब्दिक ‘उनके सभी उपकरण’ हिन्दी में अस्पष्ट हो सकता है; यह रूप सूची से जुड़े अन्य साज-सामान का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חוּרָם אָבִיו
  choice: हूराम-अबी
  rationale: संदर्भ में इसे कारीगर के संयुक्त नाम या उपाधि के रूप में लेना अधिक संभावित है; ‘उसका पिता हूराम’ अर्थ को भटका सकता है।
- source_word: לַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान के लिए
  rationale: लामेद यहाँ सेवा या आदेश के संबंध को दर्शाता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन के
  rationale: ‘भवन’ मूल ‘घर’ की अभिव्यक्ति को बनाए रखता है और मंदिर-संदर्भ में गरिमापूर्ण तथा बोधगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के निजी नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रत्यक्ष रखा गया है।
- source_word: נְחֹשֶׁת מָרוּק
  choice: चमकाए हुए काँसे
  rationale: נְחֹשֶׁת इस धातुकर्म-संदर्भ में काँसा है और מָרוּק का अर्थ चमकाया अथवा माँजा हुआ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में निजी वाचा-नाम स्पष्ट रूप से उपस्थित है; उसका लिप्यंतर नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: חוּרָם אָבִיו की व्याख्या
  choice: हूराम-अबी—संयुक्त नाम या उपाधि
  alternative: हूराम, उसका पिता
  rationale: इतिहास-वृत्तांत के संदर्भ में यह कारीगर का पदनाम प्रतीत होता है; फिर भी व्याकरणतः ‘उसका पिता’ संभव होने के कारण विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। वस्तुओं की सूची को स्पष्ट रखने के लिए वाक्य-विन्यास हिन्दी के अनुसार पुनर्गठित किया गया है।
