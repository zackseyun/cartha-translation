  yaml_path: translation/ot/2_chronicles/004/009.yaml
  text: And he made the court of the priests[a], and the great court, and doors for the court[c][b]; and he overlaid their doors with bronze.
translation:
  language: hi
  text: उसने याजकों का आँगन और बड़ा आँगन बनाया, और आँगन के लिए द्वार[a] बनाए; और उनके[b] द्वारों को काँसे[c] से मढ़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दरवाज़े’ या ‘किवाड़’। इब्रानी शब्द सामान्यतः ‘द्वार’ या ‘दरवाज़े’ के अर्थ में आता है; यहाँ ‘द्वार’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनके द्वारों’। इब्रानी में प्रत्यय बहुवचन है; इसका संकेत पहले बताए गए द्वारों या आँगन की संरचनाओं की ओर हो सकता है।
    reason: grammatical_ambiguity
  - marker: c
    text: या ‘ताँबा’। इब्रानी शब्द ताँबे या काँसे, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... बनाया / बनाए
  rationale: עָשָׂה का सामान्य अर्थ ‘बनाना’ है। हिन्दी में अलग-अलग लिंग और वचन वाले कर्मों के कारण क्रिया को स्वाभाविक रूप से दोहराया गया है।
- source_word: חֲצַר הַכֹּהֲנִים
  choice: याजकों का आँगन
  rationale: חָצֵר मंदिर-परिसर के आँगन को दर्शाता है; यह पदबंध इब्रानी संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וְהָעֲזָרָה הַגְּדוֹלָה
  choice: और बड़ा आँगन
  rationale: मंदिर के संदर्भ में עֲזָרָה एक आँगन या घिरा हुआ परिसर है। ‘बड़ा आँगन’ आधुनिक हिन्दी में सहज है और גְּדוֹלָה का सीधा अर्थ रखता है।
- source_word: וּדְלָתוֹת לָעֲזָרָה
  choice: और आँगन के लिए द्वार बनाए
  rationale: דֶּלֶת सामान्यतः दरवाज़े या किवाड़ को दर्शाता है। मंदिर-स्थापत्य के संदर्भ में ‘द्वार’ गरिमापूर्ण और स्वाभाविक है, जबकि ‘के लिए’ לָ־ के संबंध को बनाए रखता है।
- source_word: וְדַלְתוֹתֵיהֶם
  choice: उनके किवाड़ों
  rationale: प्रत्यय व्याकरणतः बहुवचन ‘उनके’ है। ‘किवाड़ों’ से स्पष्ट होता है कि धातु द्वारों के चलायमान पल्लों पर मढ़ी गई थी, फिर भी बहुवचन संदर्भ सुरक्षित रहता है।
- source_word: צִפָּה
  choice: मढ़ दिया
  rationale: צפה यहाँ किसी वस्तु पर धातु की परत चढ़ाने को व्यक्त करता है; ‘मढ़ दिया’ हिन्दी में स्थापत्य और धातु-काम के लिए स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: נְחֹשֶׁת ताँबे अथवा ताँबा-मिश्रित धातु के लिए प्रयुक्त हो सकता है। मंदिर की साज-सज्जा के संदर्भ में ‘काँसा’ परंपरागत और उपयुक्त है, जबकि विकल्प पाद-टिप्पणी में दिया गया है।
