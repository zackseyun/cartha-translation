translation:
  language: hi
  text: बत्ती काटने की कैंचियाँ, छिड़काव के कटोरे, प्याले और अंगारदान शुद्ध सोने के थे। भवन का प्रवेश-द्वार, उसके भीतरी किवाड़ जो परमपवित्र स्थान के लिए थे, और मुख्य कक्ष[a] के लिए भवन के किवाड़—सब सोने के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर का सभागृह” अथवा “पवित्रस्थान।” यहाँ इब्रानी शब्द उस मुख्य कक्ष को दर्शाता है जो भीतरी परमपवित्र स्थान से अलग था।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזַמְּרוֹת
  choice: बत्तियाँ काटने की कैंचियाँ
  rationale: मन्दिर की दीप-सामग्री के प्रसंग में यह शब्द दीपों की बत्तियाँ काटने या सँवारने के औज़ार को सूचित करता है; यह हिन्दी में कार्य को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִּזְרָקוֹת
  choice: हौदियाँ
  rationale: यह बलि के रक्त को लेने या छिड़कने के लिए प्रयुक्त अपेक्षाकृत बड़े पात्रों का नाम है। ‘हौदियाँ’ अगले छोटे पात्रों से इसका भेद बनाए रखता है।
- source_word: כַּפּוֹת
  choice: प्याले
  rationale: यह छोटे पात्रों या कटोरों को सूचित करता है। ‘प्याले’ पूर्ववर्ती מִזְרָקוֹת से भेद रखते हुए सहज हिन्दी देता है।
- source_word: מַּחְתּוֹת
  choice: अंगारदान
  rationale: ये आग या अंगारे उठाने-ले जाने के पात्र थे। ‘अंगारदान’ धूप जलाने के उपयोग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: זָהָב סָגוּר
  choice: शुद्ध सोना
  rationale: यह पद उच्च कोटि के परिष्कृत सोने को सूचित करता है; ‘शुद्ध सोना’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: פֶּתַח הַבַּיִת
  choice: भवन का प्रवेश-द्वार
  rationale: פֶּתַח प्रवेश या द्वार-मुख को सूचित करता है। यहाँ ‘भवन’ से मन्दिर-भवन अभिप्रेत है और आगे उसके किवाड़ों का विवरण आता है।
- source_word: דַּלְתוֹתָיו הַפְּנִימִיּוֹת
  choice: उसके भीतरी किवाड़
  rationale: बहुवचन जोड़ीदार किवाड़ों या द्वार-पटों को सूचित करता है; ‘भीतरी किवाड़’ अगले द्वारों से उनका स्थानगत भेद स्पष्ट करता है।
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह इब्रानी की महत्तम पवित्रता वाली रचना का स्पष्ट और प्रतिष्ठित हिन्दी रूप है।
- source_word: הֵיכָל
  choice: मुख्य कक्ष
  rationale: यहाँ यह मन्दिर के उस मुख्य कक्ष को सूचित करता है जो भीतरी परमपवित्र स्थान से अलग था; ‘मुख्य कक्ष’ सामान्य पाठक के लिए ‘नैव’ जैसे तकनीकी शब्द से अधिक स्पष्ट है।
- source_word: זָהָב
  choice: सोने के थे
  rationale: पद के अंत का संज्ञात्मक विधान किवाड़ों की सामग्री बताता है; स्वाभाविक हिन्दी वाक्य के लिए ‘के थे’ जोड़ा गया है।
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים का नाम
  choice: परमपवित्र स्थान
  alternative: पवित्रों का परमपवित्र स्थान
  rationale: चुना हुआ रूप इब्रानी के महत्तम अर्थ को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है और किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
- issue: הֵיכָל का स्थानगत अर्थ
  choice: मुख्य कक्ष
  alternative: पवित्रस्थान / मन्दिर का सभागृह
  rationale: सन्दर्भ में यह परमपवित्र स्थान से भिन्न मन्दिर का मुख्य बाहरी कक्ष है। ‘मुख्य कक्ष’ उस भेद को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लम्बी इब्रानी सूची को हिन्दी में दो वाक्यों में बाँटा गया है, पर वस्तुओं और दोनों प्रकार के किवाड़ों का संबंध सुरक्षित है। ‘कैंचियाँ’ के साथ उनका कार्य बताकर दुर्लभ मन्दिर-उपकरण को समझने योग्य बनाया गया है।
