base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/004/012.yaml
  text: the two pillars[a], and the two bowls and the two capitals on top of the pillars, and the two latticeworks to cover the two bowls of the capitals that were on top of the pillars[b];
translation:
  language: hi
  text: दो खंभे; दो कटोरे[a]; खंभों के सिरों पर लगे दो शीर्षभाग; और शीर्षभागों के दोनों कटोरों को ढकने के लिए दो जालियाँ[b], जो खंभों के सिरों पर थे;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गोले” अथवा “गोलाकार आकृतियाँ”; इब्रानी शब्द से सूचित सटीक वास्तु-आकृति अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “जालदार रचनाएँ”।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדִים
  choice: खंभे
  rationale: मंदिर के दो स्वतंत्र वास्तु-स्तंभों के लिए यह आधुनिक हिन्दी का स्पष्ट और स्वाभाविक शब्द है।
- source_word: גֻּלּוֹת
  choice: कटोरे
  rationale: यह शब्द खंभों के ऊपरी भाग से जुड़ी गोल, कटोरे जैसी आकृतियों को सूचित करता है; सटीक वास्तु-आकृति अनिश्चित होने के कारण विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: כֹּתָרוֹת
  choice: शीर्षभाग
  rationale: वास्तु-संदर्भ में यह खंभे के सबसे ऊपरी सजावटी भाग को दर्शाता है। 'शीर्षभाग' सामान्य पाठक के लिए 'कैपिटल' से अधिक सुबोध है और 'मुकुट' की अनावश्यक रूपकात्मकता से बचता है।
- source_word: רֹאשׁ
  choice: सिरों पर
  rationale: मूल अर्थ 'सिर' है और यहाँ खंभों के ऊपरी सिरे का वास्तु-संदर्भ है; हिन्दी में 'खंभों के सिरों पर' स्वाभाविक और चित्रात्मक है।
- source_word: שְּׂבָכוֹת
  choice: जालियाँ
  rationale: यह बुनी हुई अथवा जाल-सदृश सजावटी रचना को दर्शाता है; 'जालियाँ' आधुनिक हिन्दी में ठोस और सहज वास्तु-शब्द है।
- source_word: לְכַסּוֹת
  choice: ढकने के लिए
  rationale: क्रिया का उद्देश्यसूचक भाव स्पष्ट रूप से बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में प्रस्तुत करता है, साथ ही उसके पूर्वपद की मूल अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: שְׁנַיִם / שְׁתַּיִם / שְׁתֵּי
  choice: दो / दोनों
  rationale: मूल की सूचीबद्ध पुनरावृत्ति को बनाए रखा गया है; संदर्भ के अनुसार स्वाभाविक हिन्दी में 'दो' और 'दोनों' प्रयुक्त हैं।
