lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: और उसके पास
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘उसके हाथ की ओर/उसके पास’ है। सैन्य अधिकारियों की इस सूची में यह साथ या निकट नियुक्त होने का संकेत देता है; ‘उसके अधीन’ कहना संभव है, पर वह पदानुक्रम को आवश्यकता से अधिक स्पष्ट कर देगा।
- source_word: יְהוֹזָבָד
  choice: यहोजाबाद
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुरूप रखा गया है।
- source_word: וְעִמּוֹ
  choice: और उसके साथ
  rationale: עִם साथ अथवा संगति का सामान्य अर्थ देता है; हिन्दी वाक्य में यह सैनिकों के यहोजाबाद के साथ होने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵאָה וּשְׁמוֹנִים אֶלֶף
  choice: 1,80,000
  rationale: संख्या को आधुनिक हिन्दी की प्रचलित अंक-विभाजन पद्धति में स्पष्ट रूप से प्रस्तुत किया गया है।
- source_word: חֲלוּצֵי צָבָא
  choice: युद्ध के लिए सुसज्जित सैनिक
  rationale: חֲלוּצֵי से हथियारबंद, तैयार या सुसज्जित होने और צָבָא से सैन्य/युद्ध संबंधी भाव आता है। यह अनुवाद दोनों घटकों को स्वाभाविक हिन्दी में बनाए रखता है।
