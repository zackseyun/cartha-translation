  text: וּ/בִ/שְׁנַ֨ת שָׁל֜וֹשׁ לְ/מָלְכ֗/וֹ שָׁלַ֤ח לְ/שָׂרָי/ו֙ לְ/בֶן חַ֨יִל֙ וּ/לְ/עֹבַדְיָ֣ה וְ/לִ/זְכַרְיָ֔ה וְ/לִ/נְתַנְאֵ֖ל וּ/לְ/מִיכָיָ֑הוּ לְ/לַמֵּ֖ד בְּ/עָרֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/007.yaml
  text: And in the third year of his reign[a], he sent his officials—Ben-hail, Obadiah, Zechariah, Nethanel, and Micaiah—to teach in the cities of Judah.
translation:
  language: hi
  text: अपने शासन के तीसरे वर्ष में उसने अपने अधिकारियों[a]—बेन-हैल, ओबद्याह, जकर्याह, नतनेल और मीकायाह—को यहूदा के नगरों में शिक्षा देने के लिए भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रधानों” अथवा “अगुओं”; इब्रानी शब्द राजकीय या प्रशासनिक पदाधिकारियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת שָׁלוֹשׁ לְמָלְכוֹ
  choice: अपने शासन के तीसरे वर्ष में
  rationale: यह समय-सूचक वाक्यांश राजा के शासनकाल के तीसरे वर्ष को दर्शाता है। हिन्दी कथन में आरम्भिक ו को अलग से “और” कहना आवश्यक नहीं है।
- source_word: שָׁלַח
  choice: उसने ... भेजा
  rationale: सामान्य क्रिया का सीधा और स्वाभाविक हिन्दी रूप; एक समूह को भेजे जाने के कारण हिन्दी में समूहवाचक कर्म के साथ एकवचन क्रिया सहज है।
- source_word: לְשָׂרָיו
  choice: अपने अधिकारियों
  rationale: שַׂר का अर्थ प्रधान, सरदार, शासकीय अधिकारी या अगुआ हो सकता है। इस प्रशासनिक और शिक्षण-संबंधी प्रसंग में “अधिकारियों” स्पष्ट है, पर वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखे गए हैं।
- source_word: לְבֶן חַיִל וּלְעֹבַדְיָה וְלִזְכַרְיָה וְלִנְתַנְאֵל וּלְמִיכָיָהוּ
  choice: बेन-हैल, ओबद्याह, जकर्याह, नतनेल और मीकायाह
  rationale: व्यक्तिनामों का अनुवाद करने के बजाय उनके इब्रानी रूपों के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לְלַמֵּד
  choice: शिक्षा देने के लिए
  rationale: पिएल रूप का अर्थ “सिखाना/शिक्षा देना” है। यहाँ नियुक्त कार्य को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में
  rationale: ב स्थान दर्शाता है; यह अनुवाद मूल के साधारण स्थानीय अर्थ को बनाए रखता है और अनावश्यक रूप से “सभी ओर” का भाव नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। “शासन” सामान्य पाठक के लिए स्वाभाविक है और राजकीय संदर्भ बनाए रखता है। मुख्य पाठ में पदनाम की व्यापकता को “अधिकारियों” से व्यक्त किया गया है तथा मूल की वास्तविक शब्दार्थगत विविधता पाद-टिप्पणी में दी गई है।
