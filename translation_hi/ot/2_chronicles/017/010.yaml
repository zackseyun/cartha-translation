source:
  edition: WLC
  text: וַ/יְהִ֣י פַּ֣חַד יְהוָ֗ה עַ֚ל כָּל מַמְלְכ֣וֹת הָֽ/אֲרָצ֔וֹת אֲשֶׁ֖ר סְבִיב֣וֹת יְהוּדָ֑ה וְ/לֹ֥א נִלְחֲמ֖וּ עִם יְהוֹשָׁפָֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/010.yaml
  text: And the fear of Yahweh came upon all the kingdoms of the lands that were around Judah[a], and they did not make war against Jehoshaphat.
translation:
  language: hi
  text: तब यहूदा के चारों ओर के देशों के सब राज्यों पर यहोवा का भय[a] छा गया, और उन्होंने यहोशापात के विरुद्ध युद्ध नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा की ओर से दहशत” अथवा “यहोवा का आतंक।” इब्रानी वाक्यांश यहोवा से संबंधित या उसके द्वारा उत्पन्न भय को व्यक्त कर सकता है; यहाँ सम्भवतः आसपास के राज्यों पर पड़ी दैवी दहशत अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: छा गया
  rationale: अमूर्त संज्ञा के साथ यह इब्रानी प्रयोग किसी दशा के उत्पन्न होकर लोगों पर प्रभावी होने को व्यक्त करता है; हिंदी में ‘छा गया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: פַּחַד יְהוָה
  choice: यहोवा का भय
  rationale: פַּחַד भय, दहशत या आतंक को सूचित करता है। संबंध-सूचक रचना यहोवा से उत्पन्न भय या यहोवा से जुड़ी दहशत—दोनों अर्थों की गुंजाइश रखती है; मुख्य पाठ इस अस्पष्टता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को आधुनिक हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ में लिप्यंतरित किया गया है।
- source_word: עַל
  choice: पर
  rationale: यहाँ यह उस समूह को चिह्नित करता है जिस पर भय का प्रभाव पड़ा।
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: देशों के सब राज्यों
  rationale: दोनों इब्रानी संज्ञाओं—‘देश/भूमियाँ’ और ‘राज्य’—को बनाए रखते हुए हिंदी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: אֲשֶׁר סְבִיבוֹת יְהוּדָה
  choice: यहूदा के चारों ओर के
  rationale: यह निकटवर्ती देशों की स्थानगत पहचान को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְלֹא נִלְחֲמוּ עִם
  choice: और उन्होंने ... के विरुद्ध युद्ध नहीं किया
  rationale: क्रिया का आशय सैन्य संघर्ष करना है; ‘युद्ध नहीं किया’ राजनीतिक-सैन्य प्रसंग को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिगत नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: ‘यहोवा का भय’ का प्रसंगगत अर्थ
  choice: मुख्य पाठ में संबंध-सूचक अस्पष्टता रखते हुए ऐसा भय जो आसपास के राज्यों पर छा गया
  alternative: यहोवा की ओर से भेजी हुई दहशत; अथवा यहोवा के प्रति भय
  rationale: सैन्य-राजनीतिक प्रसंग में यह भक्ति-भाव वाली श्रद्धा की अपेक्षा शत्रुता रोकने वाली दैवी दहशत अधिक सम्भावित है, पर इब्रानी संबंध-सूचक रचना कारण और विषय को स्पष्ट रूप से अलग नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिंदी। ‘छा गया’ भय के अचानक और व्यापक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है; पद की इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
