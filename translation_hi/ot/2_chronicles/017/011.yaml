base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/011.yaml
  text: 'And some of the Philistines were bringing Jehoshaphat tribute and silver[a], a burden[b]; the Arabians also were bringing him flocks: 7,700 rams and 7,700 male goats.'
translation:
  language: hi
  text: और कुछ पलिश्ती यहोशापात को कर-भेंट और चाँदी का एक बोझ लाते थे[a][b]। अरबी लोग भी उसे भेड़-बकरियों के झुंड लाते थे—7,700 मेढ़े और 7,700 बकरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पलिश्तियों की ओर से”; इब्रानी में यह पद “कुछ पलिश्तियों” के अंशसूचक अर्थ के बजाय स्रोत पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “चाँदी, एक बोझ”; अर्थात् कर-भेंट के रूप में ढोई गई चाँदी।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן פְּלִשְׁתִּים
  choice: और पलिश्तियों में से कुछ लोग
  rationale: מִן को यहाँ अंशसूचक अर्थ में लिया गया है; यह स्वाभाविक हिन्दी है और यह दावा नहीं करता कि प्रत्येक पलिश्ती ऐसा करता था। स्रोतसूचक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: מְבִיאִים
  choice: लाते थे
  rationale: कृदंत इस कथात्मक संदर्भ में जारी या बार-बार होने वाली क्रिया व्यक्त करता है; हिन्दी का अभ्यस्त भूतकाल इसे सहज ढंग से प्रकट करता है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: राजा और विदेशी समुदायों के राजनीतिक संदर्भ में इसका आशय कर अथवा अधीनता-सूचक भेंट है; ‘भेंट’ सामान्य पाठक के लिए स्वाभाविक है और शब्द की व्यापकता बनाए रखता है।
- source_word: וְ/כֶסֶף מַשָּׂא
  choice: और बोझ भर चाँदी
  rationale: כֶסֶף का ठोस अर्थ ‘चाँदी’ और מַשָּׂא का अर्थ ‘बोझ/लदाई’ है। ‘बोझ भर चाँदी’ उस चाँदी की बड़ी, ढोई जाने वाली मात्रा को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: גַּם הָעַרְבִיאִים
  choice: अरबी लोग भी
  rationale: גַּם की योगात्मक शक्ति तथा ऐतिहासिक जनसमूह का संकेत दोनों सुरक्षित रहते हैं।
- source_word: ל/וֹ צֹאן
  choice: उसके पास झुंड
  rationale: צֹאן भेड़-बकरियों का सामूहिक पद है; आगे मेढ़ों और बकरों के स्पष्ट उल्लेख के कारण ‘झुंड’ उपयुक्त शीर्षक है।
- source_word: אֵילִים
  choice: मेढ़े
  rationale: यह वयस्क नर भेड़ों का प्रचलित और सटीक हिन्दी नाम है।
- source_word: שִׁבְעַת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 7,700
  rationale: आधुनिक हिन्दी में अंक संख्या को तुरंत स्पष्ट करते हैं और मूल मात्रा पूर्णतः सुरक्षित रखते हैं।
- source_word: וּ/תְיָשִׁים
  choice: बकरे
  rationale: शब्द विशेष रूप से नर बकरों को सूचित करता है; ‘बकरे’ इसका स्वाभाविक आधुनिक हिन्दी समतुल्य है।
