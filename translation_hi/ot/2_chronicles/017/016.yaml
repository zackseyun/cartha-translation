source:
  edition: WLC
  text: וְ/עַל יָד/וֹ֙ עֲמַסְיָ֣ה בֶן זִכְרִ֔י הַ/מִּתְנַדֵּ֖ב לַ/יהוָ֑ה וְ/עִמּ֛/וֹ מָאתַ֥יִם אֶ֖לֶף גִּבּ֥וֹר חָֽיִל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/016.yaml
  text: And under his command was Amasiah son of Zichri[a], who volunteered himself to Yahweh, and with him were two hundred thousand mighty men of valor.
translation:
  language: hi
  text: और उसके अधीन जिक्री का पुत्र अमस्याह था, जिसने स्वेच्छा से अपने आपको यहोवा को समर्पित किया था[a]; उसके साथ दो लाख वीर योद्धा थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो स्वेच्छा से यहोवा के लिए आगे आया था।” इब्रानी शब्द स्वैच्छिक आत्म-समर्पण पर बल दे सकता है, और संबंधसूचक शब्द का अर्थ “को” या “के लिए” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: और उसके अधीन ... था
  rationale: सैन्य सूची में यह मुहावरा किसी अधिकारी के अधीन स्थान या सेवा को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: עֲמַסְיָה בֶן זִכְרִי
  choice: जिक्री का पुत्र अमस्याह
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בֶן का वंश-संबंध स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: הַמִּתְנַדֵּב
  choice: जिसने स्वेच्छा से अपने आपको ... समर्पित किया था
  rationale: हित्पएल कृदन्त स्वेच्छापूर्ण आत्म-अर्पण या समर्पण का भाव देता है; यह रूप उस आत्मवाचक और ऐच्छिक अर्थ को सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: לְ यहाँ समर्पण की दिशा या उद्देश्य बताता है। יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में 'यहोवा' लिखा गया है।
- source_word: וְעִמּוֹ
  choice: उसके साथ ... थे
  rationale: यह अमस्याह के साथ नियुक्त सैनिकों का परिचय देता है; हिन्दी में क्रिया जोड़ना आवश्यक है।
- source_word: מָאתַיִם אֶלֶף
  choice: दो लाख
  rationale: हिन्दी संख्या-पद्धति में 200,000 का सहज और ठीक रूप।
- source_word: גִּבּוֹר חָיִל
  choice: वीर योद्धा
  rationale: यह प्रचलित सैन्य पद शक्तिशाली, सक्षम और पराक्रमी लड़ाकों को दर्शाता है; 'वीर योद्धा' संक्षिप्त, गरिमापूर्ण और सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप 'यहोवा' से प्रस्तुत किया गया है।
- issue: לַיהוָה के साथ आत्म-समर्पण का संबंध
  choice: अपने आपको यहोवा को समर्पित किया
  alternative: यहोवा के लिए स्वेच्छा से सेवा करने आया
  rationale: मूल कृदन्त स्वैच्छिकता और आत्म-अर्पण दोनों व्यक्त कर सकता है। मुख्य पाठ समर्पण के दिशात्मक भाव को रखता है, जबकि पादटिप्पणी उद्देश्यसूचक वैकल्पिक समझ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण सैन्य-वर्णन। वाक्य में मूल की सूचीगत संरचना रखी गई है, पर अस्पष्ट शाब्दिक मुहावरे के स्थान पर स्पष्ट हिन्दी प्रयोग किया गया है।
