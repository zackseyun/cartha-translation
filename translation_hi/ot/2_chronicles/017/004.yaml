  edition: WLC
  text: כִּ֠י לֵֽ/אלֹהֵ֤י אָבִי/ו֙ דָּרָ֔שׁ וּ/בְ/מִצְוֺתָ֖י/ו הָלָ֑ךְ וְ/לֹ֖א כְּ/מַעֲשֵׂ֥ה יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/004.yaml
  text: but he sought the God of his father and walked in his commandments[b][a], and not according to the deeds of Israel.
translation:
  language: hi
  text: परन्तु[a] वह अपने पिता के परमेश्वर की खोज करता था और उसकी आज्ञाओं पर चलता था, और इस्राएल के आचरण के अनुसार नहीं चलता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह अपने पिता के परमेश्वर की खोज करता था।” इब्रानी संयोजक का अनुवाद “क्योंकि” भी हो सकता है; मुख्य पाठ में पिछले पद से विरोध दिखाने के लिए “परन्तु” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “इस्राएल” से सम्भवतः यहूदा के विपरीत उत्तरी राज्य का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: परन्तु
  rationale: पूर्ववर्ती पद से यहोशापात के आचरण का विरोध स्पष्ट करने के लिए प्रसंगानुकूल विरोधसूचक अनुवाद; मूल संयोजक का अर्थ ‘क्योंकि’ भी हो सकता है।
- source_word: לֵאלֹהֵי אָבִיו
  choice: अपने पिता के परमेश्वर की
  rationale: ל उपसर्ग דָּרַשׁ के कर्म को चिह्नित करता है; हिन्दी में ‘की खोज’ स्वाभाविक है और אָבִיו के एकवचन ‘पिता’ को बनाए रखता है।
- source_word: דָּרָשׁ
  choice: खोज करता था
  rationale: यहाँ अर्थ केवल पूछताछ करना नहीं, बल्कि भक्तिपूर्वक परमेश्वर को खोजना है; अपूर्ण भूतकालीन हिन्दी पदबंध प्रसंग में जीवन के नियमित आचरण को व्यक्त करता है।
- source_word: וּבְמִצְוֺתָיו הָלָךְ
  choice: और उसकी आज्ञाओं पर चलता था
  rationale: הלך की जीवन-चाल वाली रूपकात्मकता सुरक्षित है; आधुनिक हिन्दी में आज्ञाओं ‘पर चलना’ स्वाभाविक और स्पष्ट है।
- source_word: וְלֹא כְּמַעֲשֵׂה
  choice: के कामों के अनुसार नहीं
  rationale: מַעֲשֶׂה को आचरण या किए हुए कामों के अर्थ में निकटता से प्रस्तुत करता है और नकार को स्पष्ट रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ के नाम को बिना व्याख्यात्मक विस्तार के रखा गया है; सम्भावित उत्तरी राज्य का संकेत पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘इस्राएल’ का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में केवल ‘इस्राएल’
  alternative: ‘इस्राएल का उत्तरी राज्य’
  rationale: इब्रानी पाठ केवल יִשְׂרָאֵל कहता है। उत्तरी राज्य का अर्थ प्रसंग से सम्भावित है, पर उसे मुख्य पाठ में जोड़ना वास्तविक अस्पष्टता को समाप्त कर देगा।
- issue: כִּי का वाक्यगत बल
  choice: परन्तु
  alternative: क्योंकि
  rationale: प्रसंग में पिछले पद के आचरण से विरोध प्रमुख है; फिर भी कारणसूचक अर्थ मूल संयोजक के लिए सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘परमेश्वर की खोज’ और ‘आज्ञाओं पर चलता था’ से इब्रानी की भक्तिपरक तथा जीवन-चाल संबंधी भाषा सुरक्षित रखी गई है।
