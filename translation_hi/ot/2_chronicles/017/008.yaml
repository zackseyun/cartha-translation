source:
  edition: WLC
  text: וְ/עִמָּ/הֶ֣ם הַ/לְוִיִּ֗ם שְֽׁמַֽעְיָ֡הוּ וּ/נְתַנְיָ֡הוּ וּ/זְבַדְיָ֡הוּ וַ/עֲשָׂהאֵ֡ל ו/שמרימות וִֽ/יהוֹנָתָן֩ וַ/אֲדֹ֨נִיָּ֧הוּ וְ/טֽוֹבִיָּ֛הוּ וְ/ט֥וֹב אֲדוֹנִיָּ֖ה הַ/לְוִיִּ֑ם וְ/עִמָּ/הֶ֛ם אֱלִישָׁמָ֥ע וִֽ/יהוֹרָ֖ם הַ/כֹּהֲנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/008.yaml
  text: 'And with them were the Levites: Shemaiah[a], Nethaniah, Zebadiah, Asahel, Shemiramoth, Jehonathan, Adonijah, Tobijah, and Tob-adonijah; and with them were Elishama and Jehoram[c][b], the priests.'
translation:
  language: hi
  text: 'और उनके साथ ये लेवी थे: शमायाह, नतन्याह, जबद्याह, असाहेल, शमीरामोत, यहोनातान[a], अदोनियाह, तोबियाह[b] और तोब-अदोनियाह[c]; और उनके साथ एलीशामा और यहोराम याजक थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोनातान’ इब्रानी नाम का पूरा रूप है; इसका छोटा रूप ‘योनातान’ भी प्रचलित है।
    reason: lexical_alternative
  - marker: b
    text: ‘तोबियाह’ इब्रानी नाम के पूरे रूप को दर्शाता है; कुछ अनुवादों में इसका छोटा रूप ‘तोबिया’ मिलता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘तोब अदोनियाह’ दो शब्दों में लिखा है, पर संभवतः यह एक संयुक्त व्यक्तिगत नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: और उनके साथ
  rationale: यह पदबंध साथ आए व्यक्तियों का परिचय देता है। हिन्दी में सहज वाक्य-विन्यास के लिए आगे ‘ये ... थे’ रखा गया है।
- source_word: הַלְוִיִּם
  choice: ये लेवी
  rationale: निश्चित उपपद सहित यह शब्द लेवीय सेवा-वर्ग के सदस्यों को सूचित करता है; हिन्दी में सूची का परिचय देते हुए ‘ये लेवी थे’ स्वाभाविक है।
- source_word: יְהוֹנָתָן
  choice: यहोनातान
  rationale: यहाँ इब्रानी नाम का पूरा रूप יהונתן है; इसलिए छोटे प्रचलित रूप ‘योनातान’ के बजाय पूरा रूप रखा गया है।
- source_word: טוֹבִיָּהוּ
  choice: तोबियाह
  rationale: लिप्यंतरण इब्रानी नाम में उपस्थित -याहू/-याह ईश्वर-सूचक अंत को पहचानने योग्य रूप में बनाए रखता है।
- source_word: טוֹב אֲדוֹנִיָּה
  choice: तोब-अदोनियाह
  rationale: मसोरेटी पाठ इसे दो लिखित घटकों में प्रस्तुत करता है, पर सूची में यह संभवतः एक संयुक्त व्यक्तिगत नाम है; योजक-चिह्न दोनों तथ्यों को स्पष्ट रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह पद एलीशामा और यहोराम की भूमिका बताता है और उन्हें पहले उल्लिखित लेवियों से अलग समूह के रूप में चिह्नित करता है।
theological_decisions:
- issue: लेवियों और याजकों के बीच भेद
  choice: पहले नौ व्यक्तियों को ‘लेवी’ और अंतिम दो को ‘याजक’ के रूप में अलग-अलग पहचानना
  alternative: सभी नामों को बिना भेद किए लेवियों की एक ही सूची मानना
  rationale: इब्रानी वाक्य-विन्यास पहले लेवियों की सूची देता है, फिर וְעִמָּהֶם को दोहराकर एलीशामा और यहोराम को जोड़ता है और उन्हें הַכֹּהֲנִים, ‘याजक’, कहता है। संस्थागत भेद को बनाए रखना पाठ के प्रति निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज सूची-विन्यास रखा गया है। व्यक्तिगत नामों का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है। ‘लेवी’ और ‘याजक’ सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं; स्रोत में उपस्थित समूह-भेद स्पष्ट रखा गया है।
