translation:
  language: hi
  text: ये वे लोग थे जो राजा की सेवा करते थे, उन लोगों के अतिरिक्त जिन्हें राजा ने सारे यहूदा के किलाबंद नगरों में तैनात किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה הַמְשָׁרְתִים אֶת־הַמֶּלֶךְ
  choice: ये वे लोग थे जो राजा की सेवा करते थे
  rationale: यह अभिव्यक्ति पहले गिनाए गए अधिकारियों और सैनिकों की ओर संकेत करती है। ‘सेवा करते थे’ इब्रानी कृदंत का स्वाभाविक हिन्दी रूप है और इस राजकीय-सैनिक प्रसंग में अनावश्यक धार्मिक अर्थ से बचता है।
- source_word: מִלְּבַד
  choice: इनके अलावा ... भी
  rationale: यह पहले बताए गए लोगों से अलग एक अतिरिक्त दल का संकेत देता है; यह हिन्दी में जोड़ के भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר נָתַן הַמֶּלֶךְ
  choice: जिन्हें राजा ने ... तैनात किया था
  rationale: נתן का मूल अर्थ ‘रखा/दिया’ है, पर सैनिकों और किलाबंद नगरों के प्रसंग में ‘तैनात किया’ उसका संदर्भगत अर्थ ठीक से व्यक्त करता है।
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: किलाबंद नगरों में
  rationale: यह रक्षात्मक रूप से सुदृढ़ किए गए नगरों के लिए स्पष्ट और प्रचलित आधुनिक हिन्दी पद है।
- source_word: בְּכָל יְהוּדָה
  choice: पूरे यहूदा के
  rationale: यह यहूदा के समूचे क्षेत्र में वितरण के व्यापक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
