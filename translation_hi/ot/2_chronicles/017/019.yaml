  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संदर्भानुकूल सैनिक-प्रशासनिक शब्द-विन्यास अपनाया गया है। वाक्य-संरचना इब्रानी के दो समूहों के भेद को बनाए रखते हुए हिन्दी में स्वाभाविक रखी गई है।
