- source_word: עָרֵי מִסְכְּנוֹת
  choice: भंडार-नगर
  rationale: यह समास उन नगरों को सूचित करता है जहाँ सामग्री या रसद संचित की जाती थी; ‘भंडार-नगर’ संक्षिप्त और अर्थपूर्ण है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: निर्माण के स्थान को व्यक्त करने वाला सीधा स्थानीय पदबंध।
