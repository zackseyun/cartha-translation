base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/002.yaml
  text: And he stationed forces in all the fortified cities of Judah[a], and he placed garrisons in the land of Judah and in the cities of Ephraim that Asa his father had captured.
translation:
  language: hi
  text: उसने यहूदा के सभी किलाबंद नगरों में सेना तैनात की और यहूदा देश में तथा एप्रैम के उन नगरों में, जिन्हें उसके पिता आसा ने जीत लिया था, सैनिक चौकियाँ[a] स्थापित कीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियुक्त अधिकारी,” “प्रतिनिधि” अथवा “प्रशासक”; इब्रानी शब्द נְצִיבִים नियुक्त अधिकारियों के साथ-साथ सैनिक चौकियों को भी सूचित कर सकता है। यहाँ सैन्य संदर्भ “सैनिक चौकियाँ” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֶּן חַיִל
  choice: सेना तैनात की
  rationale: חַיִל यहाँ किलाबंद नगरों के संदर्भ में सैन्य बल को दर्शाता है; נתן के साथ ‘तैनात की’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּכָל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: यहूदा के सभी किलाबंद नगरों में
  rationale: הַבְּצֻרוֹת का अर्थ रक्षा-प्रबंध से दृढ़ किए गए नगर हैं; ‘किलाबंद’ आधुनिक हिन्दी में सटीक है।
- source_word: נְצִיבִים
  choice: सैनिक चौकियाँ
  rationale: इस शब्द का अर्थ नियुक्त अधिकारी भी हो सकता है, पर सैन्य सुरक्षा और जीते हुए नगरों के संदर्भ में ‘सैनिक चौकियाँ’ अधिक उपयुक्त है; वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: यह नगरों से व्यापक यहूदा के भूभाग को व्यक्त करता है और मूल की स्थान-सूचक रचना बनाए रखता है।
- source_word: וּבְעָרֵי אֶפְרַיִם
  choice: तथा एप्रैम के उन नगरों में
  rationale: यह एप्रैम से संबद्ध नगरों का सीधा भौगोलिक उल्लेख है; ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: אֲשֶׁר לָכַד
  choice: जिन्हें ... ने जीत लिया था
  rationale: לכד नगरों को सैन्य रूप से अपने अधिकार में लेने के लिए प्रयुक्त है; पूर्वकालिकता दिखाने के लिए ‘जीत लिया था’ रखा गया है।
- source_word: אָסָא אָבִיו
  choice: उसके पिता आसा
  rationale: यह यहोशापात के पिता की स्पष्ट पहचान कराता है और हिन्दी में स्वाभाविक पदक्रम है।
