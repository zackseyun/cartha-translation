  text: וַ/יִּמְלֹ֛ךְ יְהוֹשָׁפָ֥ט בְּנ֖/וֹ תַּחְתָּ֑י/ו וַ/יִּתְחַזֵּ֖ק עַל יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/001.yaml
  text: And Jehoshaphat his son became king in his place, and he strengthened himself against Israel.
translation:
  language: hi
  text: उसके स्थान पर उसका पुत्र यहोशापात राजा हुआ, और उसने इस्राएल के विरुद्ध अपनी स्थिति सुदृढ़ की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: हिब्रू क्रिया के राजपद ग्रहण करने के अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: उत्तराधिकार के स्थान-संबंधी भाव का सीधा समतुल्य।
- source_word: וַיִּתְחַזֵּק
  choice: अपनी स्थिति सुदृढ़ की
  rationale: हित्पएल रूप में स्वयं को मजबूत करने या अपनी शक्ति जमाने का भाव है; प्रसंग में राजनीतिक-सैन्य सुदृढ़ीकरण को सहज हिन्दी में व्यक्त किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: यहाँ עַל विरोधी संबंध दर्शाता है; आगे के संदर्भ में उत्तरी राज्य इस्राएल के विरुद्ध सुरक्षा-व्यवस्था का वर्णन है।
theological_decisions:
- issue: עַל का संबंधगत अर्थ
  choice: के विरुद्ध
  alternative: पर / ऊपर
  rationale: राजनीतिक संदर्भ और अगले पद में यहूदा की किलेबंदी विरोधी अर्थ का समर्थन करते हैं; इससे शासन-अधिकार का ऐसा अर्थ नहीं निकलता जो पाठ में अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
