  text: וַ/יָּ֨כֶן יְהוָ֤ה אֶת הַ/מַּמְלָכָה֙ בְּ/יָד֔/וֹ וַ/יִּתְּנ֧וּ כָל יְהוּדָ֛ה מִנְחָ֖ה לִ/יהוֹשָׁפָ֑ט וַֽ/יְהִי ל֥/וֹ עֹֽשֶׁר וְ/כָב֖וֹד לָ/רֹֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/005.yaml
  text: So Yahweh established the kingdom in his hand[a], and all Judah gave tribute to Jehoshaphat; and he had riches and honor in abundance.
translation:
  language: hi
  text: इस प्रकार याहवे ने राज्य को उसके हाथ में दृढ़ कर दिया। सारे यहूदा ने यहोशापात को भेंट[a] दी, और उसके पास बहुत धन और सम्मान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नज़राना,” “कर,” “उपहार” अथवा “चढ़ावा”; इब्रानी शब्द मिंख़ा के ये सभी अर्थ हो सकते हैं। यहाँ राजकीय संदर्भ किसी शासक को दी गई भेंट या कर की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכֶן
  choice: दृढ़ कर दिया
  rationale: हिफ़ील रूप यहाँ राज्य को स्थिर और सुरक्षित रूप से स्थापित करने का भाव देता है; ‘दृढ़ कर दिया’ राजनीतिक स्थिरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: הַמַּמְלָכָה בְּיָדוֹ
  choice: राज्य को उसके हाथ में
  rationale: इब्रानी का ‘उसके हाथ में’ रूपक अधिकार और नियंत्रण दर्शाता है और हिन्दी में भी स्पष्ट है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: शब्द का अर्थ भेंट, उपहार, चढ़ावा या राजकीय नज़राना/कर हो सकता है। राजकीय संदर्भ में अधीनता-सूचक भेंट का भाव है, पर ‘भेंट’ मूल की व्यापकता को बनाए रखता है।
- source_word: לִיהוֹשָׁפָט
  choice: यहोशापात को
  rationale: इब्रानी व्यक्ति-नाम का हिन्दी में प्रचलित और स्रोत-संगत लिप्यंतरण।
- source_word: עֹשֶׁר וְכָבוֹד לָרֹב
  choice: बहुत धन और सम्मान
  rationale: עֹשֶׁר भौतिक संपत्ति और כָבוֹד यहाँ प्रतिष्ठा/सम्मान को सूचित करता है; לָרֹב दोनों की प्रचुरता बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; उसका लिप्यंतरण स्रोत की विशिष्टता बनाए रखता है और उसे किसी उपाधि में नहीं बदलता।
- issue: राज्य को दृढ़ करने में कर्ता और मानवीय अधिकार
  choice: याहवे ने राज्य को उसके हाथ में दृढ़ कर दिया
  alternative: याहवे ने उसका राज्य स्थापित किया
  rationale: यह रूप मूल की ईश्वरीय पहल और ‘उसके हाथ में’ वाले अधिकार-रूपक दोनों को बनाए रखता है, बिना इनके संबंध को अधिक व्याख्यायित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘उसके हाथ में’ मूल इब्रानी बिंब को सुरक्षित रखता है। ‘भेंट’ के साथ पादटिप्पणी देकर מִנְחָה की वास्तविक अर्थ-व्याप्ति और राजकीय संदर्भ दोनों बनाए गए हैं।
