- source_word: מְלָאכָה רַבָּה
  choice: बहुत काम-काज
  rationale: מְלָאכָה का मूल अर्थ काम, कार्य या व्यवसाय है। संदर्भ में यह व्यापक प्रशासनिक अथवा आर्थिक गतिविधि को सूचित कर सकता है; ‘काम-काज’ इस दायरे को स्वाभाविक हिन्दी में बनाए रखता है और इसे केवल संपत्ति नहीं बनाता।
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: युद्ध करनेवाले
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुष’ है; वर्तमान हिन्दी में यह सैनिक भूमिका को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: पराक्रमी वीर
  rationale: यह पद सामर्थ्य, वीरता और युद्ध-कौशल वाले पुरुषों का वर्णन करता है; ‘पराक्रमी वीर’ उसका प्रतिष्ठित और संक्षिप्त हिन्दी रूप है।
