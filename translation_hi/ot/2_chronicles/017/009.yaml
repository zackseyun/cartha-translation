base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/009.yaml
  text: They taught in Judah[a], and the Book of the Law of Yahweh was with them[c][b]; they went around through all the cities of Judah and taught among the people.
translation:
  language: hi
  text: उन्होंने यहूदा में शिक्षा दी, और याहवे की व्यवस्था की पुस्तक उनके साथ थी[a]। वे यहूदा के सभी नगरों में घूमे और लोगों के बीच[b] शिक्षा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की व्यवस्था का ग्रंथ।” इब्रानी शब्द סֵפֶר पुस्तक या स्क्रॉल-जैसे लिखित दस्तावेज़, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “लोगों को शिक्षा दी।” इब्रानी में अधिक शाब्दिक अर्थ “लोगों के बीच शिक्षा दी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְלַמְּדוּ
  choice: उन्होंने शिक्षा दी
  rationale: למד के पिएल रूप का अर्थ ‘सिखाना/शिक्षा देना’ है। ‘शिक्षा दी’ आधुनिक, स्वाभाविक और गरिमापूर्ण है तथा पद में क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: בִּיהוּדָה
  choice: यहूदा में
  rationale: ב यहाँ स्थान का सामान्य अर्थ देता है; आगे सभी नगरों में घूमने की बात विस्तृत क्षेत्रगत भाव स्पष्ट करती है।
- source_word: וְעִמָּהֶם
  choice: और उनके पास … थी
  rationale: इब्रानी में यह क्रियारहित उपवाक्य है, शाब्दिक रूप से ‘और उनके साथ … पुस्तक’। हिंदी में ‘उनके पास … थी’ साथ रखे होने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סֵפֶר תּוֹרַת יְהוָה
  choice: याहवे की व्यवस्था की पुस्तक
  rationale: סֵפֶר लिखित पुस्तक अथवा लपेटे हुए ग्रंथ को सूचित कर सकता है; תּוֹרָה यहाँ याहवे की वाचा-संबंधी व्यवस्था/शिक्षा का बोध कराती है। मुख्य पाठ में प्रचलित ‘व्यवस्था की पुस्तक’ रखा गया और ग्रंथ-रूप की संभावना पादटिप्पणी में दी गई।
- source_word: וַיָּסֹבּוּ
  choice: वे … घूमे
  rationale: סבב इस प्रसंग में स्थान-स्थान जाकर चक्कर लगाने या भ्रमण करने का भाव देता है; ‘घूमे’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: यहूदा के सभी नगरों में
  rationale: गति-सूचक क्रिया के साथ यह वाक्यांश उनके पूरे यहूदा के नगरों में भ्रमण को व्यक्त करता है।
- source_word: וַיְלַמְּדוּ בָּעָם
  choice: और लोगों के बीच शिक्षा दी
  rationale: בָּעָם में ב को बनाए रखते हुए ‘लोगों के बीच’ शिक्षण का क्षेत्र व्यक्त करता है। मुहावरेदार ‘लोगों को शिक्षा दी’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण के निकट प्रचलित लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘व्यवस्था’ बाइबलीय תּוֹרָה के लिए परिचित है, जबकि ‘शिक्षा दी’ साधारण पाठक के लिए सहज है। इब्रानी की समन्वयी वाक्य-रचना और अंतिम पदबंध की अस्पष्टता को यथासंभव सुरक्षित रखा गया है।
