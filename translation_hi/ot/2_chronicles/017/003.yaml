base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/003.yaml
  text: And Yahweh was with Jehoshaphat[a], because he walked in the former ways of David his father and did not seek the Baals.
translation:
  language: hi
  text: और यहोवा यहोशापात के साथ था, क्योंकि वह अपने पूर्वज दाऊद के आरंभिक मार्गों पर चला[a] और उसने बाल देवताओं की खोज नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पूर्वज दाऊद के पूर्वकालीन मार्गों पर चला।” इब्रानी दाऊद के पहले के आचरण को निर्दिष्ट करता है, संभवतः उसे उसकी बाद की विफलताओं से अलग करते हुए।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित यह रूप परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में बनाए रखता है।
- source_word: וַיְהִי ... עִם
  choice: के साथ था
  rationale: यह स्वाभाविक हिन्दी में उपस्थिति, सहायता और अनुग्रह के आशय वाले इब्रानी मुहावरे को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ पद का अगला भाग यहोवा के यहोशापात के साथ होने का कारण बताता है।
- source_word: הָלַךְ בְּדַרְכֵי
  choice: मार्गों पर चला
  rationale: नैतिक आचरण के इब्रानी रूपक को स्पष्ट और परिचित हिन्दी में बनाए रखता है।
- source_word: דָּוִיד אָבִיו
  choice: अपने पूर्वज दाऊद
  rationale: אָבִיו का शाब्दिक अर्थ ‘उसका पिता’ है, पर दाऊद यहोशापात का प्रत्यक्ष पिता नहीं, राजवंशीय पूर्वज था; ‘पूर्वज’ आधुनिक पाठक के लिए संबंध स्पष्ट करता है।
- source_word: הָרִאשֹׁנִים
  choice: पहले के
  rationale: यह दाऊद के आरंभिक आचरण की ओर संकेत करता है और उसके जीवन के बाद के आचरण से निहित अंतर को बनाए रखता है।
- source_word: דָרַשׁ
  choice: खोज की
  rationale: यह क्रिया किसी देवता की ओर मार्गदर्शन, सहायता या आराधना के लिए मुड़ने का व्यापक धार्मिक अर्थ रखती है; ‘खोज’ उस अस्पष्टता को सुरक्षित रखती है।
- source_word: לַבְּעָלִים
  choice: बाल देवताओं की
  rationale: इब्रानी में बहुवचन है; ‘बाल देवताओं’ से विभिन्न स्थानीय बाल-रूपों या पंथों का बहुवचन सामान्य हिन्दी पाठक के लिए स्पष्ट रहता है।
theological_decisions:
- issue: दाऊद को आदर्श मानने की सीमा
  choice: दाऊद के पहले के मार्ग
  alternative: दाऊद के मार्ग
  rationale: הָרִאשֹׁנִים तुलना को दाऊद के आरंभिक आचरण तक सीमित करता है; इसे छोड़ने से उसके पूरे जीवन को निर्विवाद आदर्श मानने का अर्थ निकल सकता है।
- issue: יְהוָה के साथ होने और यहोशापात के आचरण का संबंध
  choice: क्योंकि
  alternative: निश्चय ही / और
  rationale: כִּי का सबसे स्वाभाविक अर्थ यहाँ कारणसूचक है। अनुवाद इस संबंध को व्यक्त करता है, पर इससे अनुग्रह और प्रतिफल के व्यापक धर्मवैज्ञानिक प्रश्नों को आगे नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मार्गों पर चला’ बाइबिलीय नैतिक रूपक को बनाए रखता है। ‘अपने पूर्वज दाऊद’ वंशगत अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी הָרִאשֹׁנִים की कालगत बारीकी सुरक्षित रखती है।
