source:
  edition: WLC
  text: וַ/יִּגְבַּ֥הּ לִבּ֖/וֹ בְּ/דַרְכֵ֣י יְהוָ֑ה וְ/ע֗וֹד הֵסִ֛יר אֶת הַ/בָּמ֥וֹת וְ/אֶת הָ/אֲשֵׁרִ֖ים מִ/יהוּדָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/006.yaml
  text: His heart was exalted in the ways of Yahweh[b][a], and furthermore he removed the high places and the Asherim from Judah.
translation:
  language: hi
  text: याहवे के मार्गों में उसका हृदय निर्भीक हुआ[a]; और उसने यहूदा से ऊँचे पूजा-स्थलों और अशेरिम[b] को भी हटा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के मार्गों में उसका हृदय ऊँचा हुआ।” हिब्रानी मुहावरे का शाब्दिक अर्थ हृदय का ऊँचा होना है; यहाँ प्रसंग घमंड नहीं, बल्कि उत्साह, साहस और दृढ़ संकल्प का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अशेरा-स्तंभ” अथवा “पवित्र खंभे।” हिब्रानी शब्द अशेरा की उपासना से जुड़ी धार्मिक वस्तुओं के लिए है; उनका ठीक भौतिक स्वरूप निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבַּהּ לִבּוֹ
  choice: उसका हृदय ऊँचा उठा
  rationale: यह अनुवाद हिब्रानी के ‘हृदय’ और ‘ऊँचा होने’ के रूपक को बनाए रखता है। प्रसंग इसे घमंड नहीं, बल्कि याहवे के मार्गों पर चलने का उत्साह और दृढ़ साहस बताता है; इस सकारात्मक आशय को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּדַרְכֵי יְהוָה
  choice: याहवे के मार्गों में
  rationale: ‘मार्ग’ आचरण और जीवन-पद्धति का रूपक है। ‘में’ मूल संबंध को निकटता से रखता है, जबकि ‘याहवे’ परमेश्वर के व्यक्तिगत नाम को व्यक्त करता है।
- source_word: וְעוֹד
  choice: भी
  rationale: यह पिछले वर्णन में यहोशापात के एक और सुधार-कार्य को जोड़ता है; आधुनिक हिन्दी में ‘भी’ इस योगात्मक बल को सहज रूप से व्यक्त करता है।
- source_word: הֵסִיר
  choice: हटा दिया
  rationale: हिफ़ील रूप का सीधा अर्थ किसी वस्तु को दूर करना या हटाना है; यह सुधार की कार्रवाई को बिना अतिशयोक्ति व्यक्त करता है।
- source_word: הַבָּמוֹת
  choice: ऊँचे पूजा-स्थलों
  rationale: במות आराधना से जुड़े ऊँचे स्थानों को दर्शाता है। केवल ‘ऊँचे स्थान’ आधुनिक पाठक के लिए अस्पष्ट हो सकता है, इसलिए ‘पूजा-स्थल’ जोड़कर धार्मिक आशय स्पष्ट किया गया है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-स्तंभों
  rationale: यह बहुवचन अशेरा की उपासना से जुड़ी पवित्र लकड़ी की वस्तुओं, खंभों या वृक्ष-सदृश प्रतीकों को दर्शाता है। ‘अशेरा-स्तंभ’ सुबोध है, पर वस्तु का ठीक स्वरूप अनिश्चित होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִיהוּדָה
  choice: यहूदा से
  rationale: מִן हटाने के आरंभिक क्षेत्र को दर्शाता है; ‘यहूदा से’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: וַיִּגְבַּהּ לִבּוֹ का भाव घमंड है या भक्तिपूर्ण साहस और दृढ़ता
  choice: मूल रूपक ‘उसका हृदय ऊँचा उठा’ रखा गया, और संदर्भानुसार सकारात्मक अर्थ पादटिप्पणी में बताया गया
  alternative: याहवे के मार्गों पर चलने में उसका साहस बढ़ा
  rationale: यह पद याहवे के मार्गों के प्रति निष्ठा और उसके बाद मूर्तिपूजक स्थलों को हटाने का वर्णन करता है, इसलिए नकारात्मक घमंड की अपेक्षा उत्साह या दृढ़ साहस अधिक उपयुक्त है। फिर भी मुख्य पाठ में रूपक रखने से हिब्रानी की संभावित अर्थ-छाया बनी रहती है।
- issue: אֲשֵׁרִים का सटीक भौतिक स्वरूप
  choice: अशेरा-स्तंभ
  alternative: अशेरा-चिह्न; पवित्र खंभे; अशेरिम
  rationale: ये अशेरा-उपासना से जुड़ी निषिद्ध धार्मिक वस्तुएँ थीं, पर वे हर प्रसंग में ठीक किस आकार की थीं यह निश्चित नहीं है। मुख्य पाठ सुबोध पद देता है और पादटिप्पणी वास्तविक शब्दगत अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय ऊँचा उठा’ मूल हिब्रानी रूपक और उसकी अर्थगत तन्यता को बनाए रखता है; ‘ऊँचे पूजा-स्थल’ पारंपरिक पद को उसके धार्मिक आशय सहित स्पष्ट करता है।
