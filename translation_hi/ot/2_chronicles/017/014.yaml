base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/014.yaml
  text: 'And these were their mustered divisions by their fathers’ houses: for Judah[a], the commanders of thousands: Adnah the commander, and with him three hundred thousand mighty men of valor.'
translation:
  language: hi
  text: 'उनके पितृकुलों के अनुसार उनकी सैन्य-गणना[a] यह थी: यहूदा के लिए, हज़ारों के अधिकारियों में अदना अधिकारी था, और उसके साथ तीन लाख वीर योद्धा थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनकी संख्या,’ ‘उनका नामांकन,’ अथवा ‘उनकी सैन्य व्यवस्था।’ इब्रानी शब्द जनगणना, सैन्य-भर्ती/नामांकन, या उससे बनी सैन्य व्यवस्था का संकेत कर सकता है।
    reason: पְקֻדָּתָם के सैन्य-संदर्भ में संभव अर्थों को सुरक्षित रखता है।
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: उनकी सैन्य-गणना
  rationale: सैन्य प्रसंग में यह शब्द सैनिकों की गिनती, भरती अथवा गणना से बनी व्यवस्था को दर्शा सकता है। हिंदी में ‘सैन्य-गणना’ मूल अर्थ को स्पष्ट रखती है और आगे दी गई सैनिक-संख्या से स्वाभाविक रूप से जुड़ती है।
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह वंश और कुल के आधार पर प्रशासनिक-सैन्य संगठन का मानक इब्रानी पदबंध है। ‘पितृकुल’ आधुनिक हिंदी में संक्षिप्त और अर्थपूर्ण है।
- source_word: לִיהוּדָה
  choice: यहूदा के
  rationale: यह पद यहूदा से संबंधित सैन्य दल का परिचय देता है; हिंदी वाक्य-संरचना में ‘यहूदा के सहस्रपतियों’ स्वाभाविक है।
- source_word: שָׂרֵי אֲלָפִים
  choice: सहस्रपतियों
  rationale: यह हजार-हजार के सैनिक दलों पर नियुक्त अधिकारियों की उपाधि है। ‘सहस्रपति’ संक्षिप्त, प्रतिष्ठित और सैन्य पद के रूप में बोधगम्य है।
- source_word: עַדְנָה הַשָּׂר
  choice: प्रधान अदना
  rationale: הַשָּׂר अदना को इस प्रविष्टि के अधिकारी या प्रधान के रूप में पहचानता है। ‘प्रधान’ अगले पदबंध के अनावश्यक दोहराव से बचते हुए पद की गरिमा रखता है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: वीर योद्धा
  rationale: यह प्रचलित सैन्य पदबंध सामर्थ्यवान और युद्ध-कुशल पुरुषों को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिंदी में स्वाभाविक और सशक्त है।
- source_word: שְׁלֹשׁ מֵאוֹת אָלֶף
  choice: तीन लाख
  rationale: इब्रानी संख्या का भारतीय संख्या-पद्धति में सीधा और स्वाभाविक हिंदी रूप।
