base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/017/017.yaml
  text: 'And from Benjamin: Eliada[a], a mighty man of valor, and with him two hundred thousand armed with bow and shield.'
translation:
  language: hi
  text: और बिन्यामीन में से पराक्रमी योद्धा एल्यादा था, और उसके साथ धनुष और ढाल से सुसज्जित दो लाख सैनिक थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן בִּנְיָמִן
  choice: और बिन्यामीन में से
  rationale: संयोजक और संबंधबोधक पद पिछली सूची से इस गोत्रीय दल को जोड़ते हैं; यह अनुवाद सूची के प्रवाह और दल के उद्गम दोनों को बनाए रखता है।
- source_word: גִּבּוֹר חַיִל
  choice: पराक्रमी योद्धा
  rationale: यह पदबंध सामर्थ्यवान और वीर युद्ध-पुरुष को दर्शाता है; आधुनिक हिन्दी में ‘पराक्रमी योद्धा’ स्वाभाविक, गरिमापूर्ण और सैन्य संदर्भ के अनुकूल है।
- source_word: אֶלְיָדָע
  choice: एल्यादा
  rationale: व्यक्तिनाम का अर्थानुवाद न करके हिन्दी में ध्वन्यंतरण किया गया है।
- source_word: וְעִמּוֹ
  choice: और उसके साथ
  rationale: यह सेनानायक के बाद उसके अधीन सैनिकों को प्रस्तुत करता है और मूल के संयोजक ढाँचे को बनाए रखता है।
- source_word: נֹשְׁקֵי קֶשֶׁת וּמָגֵן
  choice: धनुष और ढाल से सुसज्जित
  rationale: कृदन्त נשק यहाँ इन हथियारों से लैस या सुसज्जित होने का भाव देता है; ‘सुसज्जित’ आधुनिक हिन्दी में स्पष्ट है और हथियारों के सामूहिक एकवचन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָאתַיִם אָלֶף
  choice: दो लाख
  rationale: यह संख्या का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण सैन्य-वर्णन अपनाया गया है। मूल में ‘सैनिक’ संज्ञा निहित है; संख्या और हथियारबंदी को स्वाभाविक हिन्दी में स्पष्ट करने के लिए इसे जोड़ा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि נשק का आशय मुख्य पाठ में पर्याप्त रूप से व्यक्त है।
