  yaml_path: translation/ot/2_chronicles/013/015.yaml
  text: Then the men of Judah raised a shout, and when the men of Judah shouted, God struck down Jeroboam and all Israel before Abijah and Judah.
translation:
  language: hi
  text: तब यहूदा के पुरुषों ने युद्धघोष किया, और जब यहूदा के पुरुषों ने युद्धघोष किया, तब परमेश्वर ने यारोबाम और सारे इस्राएल को अबिय्याह और यहूदा के सामने परास्त कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרִיעוּ / בְּהָרִיעַ
  choice: युद्धघोष किया
  rationale: रूע धातु यहाँ युद्ध के प्रसंग में ऊँची सामूहिक पुकार या रणघोष को दर्शाती है; ‘युद्धघोष’ आधुनिक हिंदी में प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: נָגַף
  choice: पराजित कर दिया
  rationale: नगף का अर्थ प्रहार करके हरा देना/परास्त करना हो सकता है। इस पद में तत्काल युद्ध-परिणाम व्यक्त है, जबकि अगले पदों में भागने और मारे जाने का अलग वर्णन आता है; इसलिए ‘पराजित कर दिया’ अनावश्यक रूप से ‘मार डाला’ नहीं कहता।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: 'स्थानिक और संघर्ष-संबंधी अर्थ को सीधे बनाए रखता है: यारोबाम और इस्राएल अबिय्याह और यहूदा के सामने पराजित हुए।'
theological_decisions:
- issue: युद्ध में विजय का कर्ता
  choice: परमेश्वर ने ... पराजित कर दिया
  alternative: वे ... पराजित हो गए
  rationale: इब्रानी पाठ स्पष्ट रूप से וְהָאֱלֹהִים को कर्ता बनाता है; इसलिए परमेश्वर की प्रत्यक्ष क्रिया को कर्मवाच्य में धुंधला नहीं किया गया।
- issue: युद्धघोष और परमेश्वर की क्रिया का संबंध
  choice: जब ... तब
  alternative: क्योंकि उन्होंने युद्धघोष किया, इसलिए
  rationale: पाठ कालगत संबंध बताता है, पर स्पष्ट कारणात्मक सिद्धांत नहीं देता; ‘जब...तब’ उस तनाव और सीमित दावे को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों के प्रचलित हिंदी बाइबिलीय रूप ‘अबिय्याह’, ‘यारोबाम’ और ‘इस्राएल’ अपनाए गए हैं।
