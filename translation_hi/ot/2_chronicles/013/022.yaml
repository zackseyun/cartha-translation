base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/022.yaml
  text: The rest of the acts of Abijah[a], and his ways and his sayings, are written in the midrash of the prophet Iddo.
translation:
  language: hi
  text: अबिय्याह के शेष कार्य, उसका आचरण और उसकी बातें नबी इद्दो के मिद्राश[a] में लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘व्याख्या,’ ‘विवेचन’ या अधिक सामान्य अर्थ में ‘अभिलेख।’ यहाँ प्रयुक्त इब्रानी शब्द ‘मिद्राश’ किसी लिखित व्याख्यात्मक या खोजपरक रचना को दर्शाता है; इसका अर्थ यह आवश्यक नहीं कि यह बाद में विकसित हुई रब्बी परंपरा की मिद्राश-विधा ही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אֲבִיָּה
  choice: अभिय्याह के शेष काम
  rationale: राजकीय इतिहास के समापन-सूत्र में דִּבְרֵי का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के कार्य और उससे संबंधित घटनाएँ है; ‘शेष काम’ इस इतिहास-वृत्तात्मक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּדְרָכָיו
  choice: उसका आचरण
  rationale: דֶּרֶךְ का मूल बिंब ‘मार्ग’ है, पर यहाँ बहुवचन रूप व्यक्ति के जीवन-व्यवहार और चालचलन को दर्शाता है। ‘आचरण’ आधुनिक हिंदी में अर्थ को स्पष्ट और गरिमापूर्ण ढंग से देता है।
- source_word: וּדְבָרָיו
  choice: और उसकी बातें
  rationale: पहले आए דִּבְרֵי को राजकीय ‘काम’ के अर्थ में लेने के बाद यहाँ यही शब्द उसके कथनों या कही हुई बातों को सूचित कर सकता है। ‘बातें’ इस संभावित भेद को बनाए रखता है।
- source_word: כְּתוּבִים
  choice: लिखे हुए हैं
  rationale: כתב का कर्मवाच्य कृदंत सीधे किसी लिखित अभिलेख में विद्यमान होने को बताता है; ‘लिखे हुए हैं’ इस रूप और पूर्णावस्था दोनों को सहज हिंदी में बनाए रखता है।
- source_word: בְּמִדְרַשׁ
  choice: मिद्राश
  rationale: विशिष्ट इब्रानी संज्ञा को लिप्यंतरित करने से उसका ऐतिहासिक स्वरूप सुरक्षित रहता है और उसे केवल सामान्य ‘अभिलेख’ मान लेने से बचा जाता है; अर्थ-स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
- source_word: הַנָּבִיא עִדּוֹ
  choice: इद्दो नबी के
  rationale: सम्बन्धवाचक रचना उस ग्रंथ को इद्दो नबी से जोड़ती है। ‘इद्दो नबी के’ हिंदी में स्वाभाविक है और लेखकत्व या स्वामित्व की उस सीमा से अधिक निश्चित दावा नहीं करता जितना मूल पाठ करता है।
