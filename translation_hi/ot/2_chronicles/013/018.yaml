source:
  edition: WLC
  text: וַ/יִּכָּנְע֥וּ בְנֵי יִשְׂרָאֵ֖ל בָּ/עֵ֣ת הַ/הִ֑יא וַ/יֶּֽאֶמְצוּ֙ בְּנֵ֣י יְהוּדָ֔ה כִּ֣י נִשְׁעֲנ֔וּ עַל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/018.yaml
  text: So the sons of Israel were subdued at that time, and the sons of Judah prevailed, because they relied on Yahweh, the God of their fathers.
translation:
  language: hi
  text: इस प्रकार उस समय इस्राएली दबा दिए गए, और यहूदा के लोग प्रबल हुए, क्योंकि उन्होंने याहवे, अपने पूर्वजों के परमेश्वर, पर भरोसा रखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: दबा दिए गए
  rationale: निफ़अल रूप का निष्क्रिय और परिणामसूचक भाव व्यक्त करता है—वे अधीन या परास्त कर दिए गए—पर पूर्ण विनाश का अर्थ नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: आधुनिक हिंदी में उत्तरी राज्य के लोगों या सैनिकों के लिए स्वाभाविक सामूहिक पद है; यहाँ शाब्दिक ‘इस्राएल के पुत्र’ असहज और अनावश्यक रूप से लिंग-विशिष्ट होता।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: इब्रानी कालवाचक वाक्यांश का सहज और सटीक हिंदी रूप।
- source_word: וַיֶּאֶמְצוּ
  choice: प्रबल हुए
  rationale: अमץ के ‘बलवान होना’ भाव और युद्ध में उसके परिणाम—बढ़त या विजय—दोनों को संक्षेप में बनाए रखता है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के लोग
  rationale: इस्राएलियों के समानांतर सामूहिक अर्थ को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है, बिना इसे केवल पुरुष सैनिकों तक सीमित किए।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहूदा के प्रबल होने का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: נִשְׁעֲנוּ עַל
  choice: पर भरोसा रखा था
  rationale: ‘पर टिकना/सहारा लेना’ के रूपक का स्वाभाविक हिंदी अर्थ देता है और निर्भरता के भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला दैवी नाम है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: वंशपरंपरा और वाचा-संबंधी संकेत को बनाए रखते हुए आधुनिक हिंदी में स्वाभाविक है; ‘पितरों’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट।
theological_decisions:
- issue: दैवी नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत दैवी नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। हिंदी पाठकों में स्थापित और पहचाने जाने योग्य रूप ‘यहोवा’ चुना गया; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: यहूदा की सफलता और परमेश्वर पर निर्भरता का संबंध
  choice: कारणसूचक ‘क्योंकि’
  alternative: व्याख्यात्मक ‘इसलिए कि’
  rationale: כִּי यहाँ यहूदा के प्रबल होने का कारण देता है। अनुवाद मूल का धार्मिक दावा बनाए रखता है, पर भरोसे की प्रकृति या विजय के सिद्धांत पर अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘इस्राएली’ और ‘यहूदा के लोग’ स्वाभाविक सामूहिक अभिव्यक्तियाँ हैं; ‘दबा दिए गए’ मूल की अधीन किए जाने वाली निष्क्रियता तथा ‘प्रबल हुए’ युद्ध-संदर्भ में शक्ति और बढ़त को सुरक्षित रखते हैं।
