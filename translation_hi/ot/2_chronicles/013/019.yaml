  yaml_path: translation/ot/2_chronicles/013/019.yaml
  text: 'Abijah pursued Jeroboam and captured from him cities: Bethel and its daughter towns, Jeshanah and its daughter towns, and Ephron and its daughter towns.'
translation:
  language: hi
  text: 'अबिय्याह ने यारोबाम का पीछा किया और उससे ये नगर अपने अधिकार में कर लिए: बेतेल और उसके आसपास के नगर, यशाना और उसके आसपास के नगर, तथा एप्रोन और उसके आसपास के नगर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: पीछा किया
  rationale: हिब्रू क्रिया רדף का सीधा और स्वाभाविक हिंदी अर्थ; सैन्य संदर्भ में भी उपयुक्त।
- source_word: וַיִּלְכֹּד מִמֶּנּוּ
  choice: उससे ... छीन लिए
  rationale: לכד का अर्थ नगरों पर अधिकार करना है और מִמֶּנּוּ बताता है कि वे यारोबाम से लिए गए; ‘छीन लिए’ दोनों भावों को सहज हिंदी में व्यक्त करता है।
- source_word: עָרִים
  choice: नगर
  rationale: बहुवचन ‘नगरों’ को आगे दी गई सूची का परिचय बनाते हुए ‘ये नगर’ के रूप में रखा गया है।
- source_word: בְּנוֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर नगर-संबंधी प्रयोग में आश्रित या आसपास के छोटे नगर अभिप्रेत हैं; ‘अधीन नगर’ उस प्रशासनिक संबंध को स्पष्ट करता है।
- source_word: בֵּית אֵל / יְשָׁנָה / עפרון
  choice: बेतेल / यशाना / एप्रोन
  rationale: स्थान-नामों का आधुनिक हिंदी देवनागरी में स्रोत-निकट लिप्यंतरण किया गया है।
