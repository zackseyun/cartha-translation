source:
  edition: WLC
  text: בִּ/שְׁנַ֛ת שְׁמוֹנֶ֥ה עֶשְׂרֵ֖ה לַ/מֶּ֣לֶךְ יָרָבְעָ֑ם וַ/יִּמְלֹ֥ךְ אֲבִיָּ֖ה עַל יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/001.yaml
  text: In the eighteenth year of King Jeroboam[a], Abijah became king over Judah.
translation:
  language: hi
  text: यारोबाम राजा के अठारहवें वर्ष में अबिय्याह[a] यहूदा का राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 राजा 15:1 के समानांतर वृत्तांत में अबिय्याह को ‘अबिय्याम’ कहा गया है; यहाँ इतिहासवृत्त के पाठ में ‘अबिय्याह’ है।
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁמוֹנֶה עֶשְׂרֵה
  choice: अठारहवें वर्ष में
  rationale: यह इब्रानी राजकीय तिथिक्रम का सूत्र है; संख्या यहाँ क्रमवाचक अर्थ में प्रयुक्त है। आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट रूप है।
- source_word: לַ/מֶּלֶךְ יָרָבְעָם
  choice: यारोबाम राजा के
  rationale: यहाँ ל उस राजा को चिह्नित करता है जिसके शासन-वर्ष की गणना हो रही है। हिन्दी में ‘यारोबाम राजा के अठारहवें वर्ष’ सहज राजकीय तिथि-वाक्य है।
- source_word: וַ/יִּמְלֹךְ
  choice: राजा बना
  rationale: מלך का यह रूप राजगद्दी सँभालने या राजा बनने की आरंभिक घटना बताता है; केवल ‘राज्य किया’ कहने से यह आरंभिक भाव धुँधला पड़ सकता है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: इतिहासवृत्त के इब्रानी पाठ में नाम אֲבִיָּה है; उसका मानक हिन्दी लिप्यंतरण ‘अबिय्याह’ रखा गया है।
- source_word: עַל יְהוּדָה
  choice: यहूदा का
  rationale: מלך के साथ עַל शासन के क्षेत्र को दर्शाता है। हिन्दी में ‘यहूदा का राजा’ ‘यहूदा पर राजा’ की अपेक्षा अधिक स्वाभाविक है और वही अर्थ देता है।
