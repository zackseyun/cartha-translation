source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ עָלָ֗י/ו אֲנָשִׁ֤ים רֵקִים֙ בְּנֵ֣י בְלִיַּ֔עַל וַ/יִּֽתְאַמְּצ֖וּ עַל רְחַבְעָ֣ם בֶּן שְׁלֹמֹ֑ה וּ/רְחַבְעָ֗ם הָ֤יָה נַ֨עַר֙ וְ/רַךְ לֵבָ֔ב וְ/לֹ֥א הִתְחַזַּ֖ק לִ/פְנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/007.yaml
  text: And worthless men[a], sons of Belial, gathered around him and proved stronger than Rehoboam son of Solomon, when Rehoboam was young and fainthearted and had not strengthened himself against them.
translation:
  language: hi
  text: और निकम्मे लोग, बलियाल के पुत्र[a], उसके पास इकट्ठे हो गए और सुलैमान के पुत्र रहूबियाम पर भारी पड़े। उस समय रहूबियाम जवान और दुर्बल मन का था और उसने उनके सामने अपने को दृढ़ नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी मुहावरे का अर्थ “दुष्ट लोग” या “निकम्मे लोग” भी हो सकता है।
    reason: बलियाल के नामवत और वर्णनात्मक अर्थों के बीच वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקָּבְצוּ עָלָיו
  choice: उसके पास इकट्ठे हो गए
  rationale: קבץ के साथ עַל यहाँ किसी के इर्द-गिर्द राजनीतिक समर्थन में जुटने का भाव दे सकता है; 'उसके पास' इस अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि विरोधी आशय प्रसंग से स्पष्ट होता है।
- source_word: אֲנָשִׁים רֵקִים
  choice: निकम्मे लोग
  rationale: רֵקִים का शाब्दिक अर्थ 'खाली' है, पर यहाँ यह नैतिक और सामाजिक रूप से बेकार या चरित्रहीन लोगों के लिए प्रयुक्त मुहावरा है। 'निकम्मे लोग' सामान्य आधुनिक हिन्दी में इस तिरस्कारपूर्ण मूल्यांकन को व्यक्त करता है।
- source_word: בְּנֵי בְלִיַּעַל
  choice: बलियाल के बेटे
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखने से यह अनिश्चितता सुरक्षित रहती है कि בליעל यहाँ नामवत प्रयोग है या निकम्मेपन/दुष्टता का वर्णन। मुहावरे का अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיִּתְאַמְּצוּ עַל
  choice: पर भारी पड़े
  rationale: אמץ का हित्पाएल रूप विरोध में अपने को शक्तिशाली सिद्ध करने का भाव देता है। 'पर भारी पड़े' समकालीन हिन्दी में तुलनात्मक शक्ति और राजनीतिक सफलता को स्पष्ट करता है।
- source_word: נַעַר
  choice: जवान
  rationale: נַעַר बालक, युवक या अपेक्षाकृत अपरिपक्व व्यक्ति को सूचित कर सकता है। रहूबियाम की वास्तविक आयु को देखते हुए 'जवान' वक्ता के आरोपित अपरिपक्वता-बोध को बिना उसे बालक बनाए व्यक्त करता है।
- source_word: רַךְ לֵבָב
  choice: कमजोर दिल का
  rationale: शाब्दिक रूप से 'कोमल हृदय' इस राजनीतिक संदर्भ में करुणा नहीं, बल्कि संकल्प की कमी बताता है। 'कमजोर दिल का' सहज हिन्दी में यही भाव देता है।
- source_word: לֹא הִתְחַזַּק לִפְנֵיהֶם
  choice: उनके सामने अपने को दृढ़ न कर सका
  rationale: यह अभिव्यक्ति उनके सामने अपने को मजबूत या दृढ़ न कर पाने का संकेत देती है। हिन्दी रूप मूल की आत्मवाचक शक्ति-प्राप्ति की छवि रखता है और प्रसंगानुसार असमर्थता को स्वाभाविक ढंग से बताता है।
theological_decisions:
- issue: בְּנֵי בְלִיַּעַל का अर्थ
  choice: बलियाल के बेटे
  alternative: दुष्ट लोग / निकम्मे लोग
  rationale: मुख्य पाठ में शाब्दिक, नामवत रूप रखने से यह निर्णय थोपने से बचा जाता है कि 'बलियाल' केवल अमूर्त निकम्मेपन का पद है या व्यक्ति-सदृश नाम। पादटिप्पणी सामान्य मुहावरेदार अर्थ स्पष्ट करती है।
- issue: रहूबियाम की दुर्बलता में क्षमता और प्रयास का संबंध
  choice: अपने को दृढ़ न कर सका
  alternative: अपने को दृढ़ नहीं किया
  rationale: हिब्रू रूप व्याकरणतः केवल निषेध व्यक्त करता है, पर पूर्ववर्ती 'कमजोर दिल का' और विरोधियों की प्रबलता संदर्भ में असमर्थता का रंग देते हैं। हिन्दी में 'न कर सका' इस संदर्भगत अर्थ को व्यक्त करता है, बिना किसी अतिरिक्त धार्मिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'निकम्मे लोग' मूल के तिरस्कारपूर्ण स्वर को व्यक्त करता है; 'बलियाल के बेटे' शाब्दिक और धर्मवैचारिक अस्पष्टता बचाता है।
