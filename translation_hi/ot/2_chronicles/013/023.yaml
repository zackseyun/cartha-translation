base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/023.yaml
  text: And Abijah slept with his fathers[a], and they buried him in the City of David. And Asa his son reigned in his place. In his days the land had rest for ten years.
translation:
  language: hi
  text: अबिय्याह अपने पुरखाओं के साथ सो गया, और उन्होंने उसे दाऊद के नगर में दफना दिया। आसा, उसका पुत्र, उसके स्थान पर राजा हुआ। उसके दिनों में देश को दस वर्ष तक चैन मिला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश दस वर्ष तक शांत रहा।”
    reason: שָׁקְטָה के ‘चैन मिलने’ और ‘शांत रहने’ दोनों निकट अर्थों को दिखाने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: וַיִּשְׁכַּב עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो गया
  rationale: यह इब्रानी में मृत्यु के लिए प्रयुक्त पारंपरिक राजकीय मुहावरा है। ‘सो गया’ मूल बिंब को बनाए रखता है, जबकि ‘पुरखाओं’ आधुनिक हिन्दी में वंशगत पूर्वजों का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे ... दफ़ना दिया
  rationale: मूल क्रिया सक्रिय बहुवचन में है और कर्ता अनिर्दिष्ट है; ‘उन्होंने’ उसी व्याकरणिक रूप को सुरक्षित रखता है।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: यह स्थानवाचक पद का सीधा और हिन्दी बाइबिलीय प्रयोग में स्वाभाविक रूप है।
- source_word: וַיִּמְלֹךְ אָסָא בְנוֹ תַּחְתָּיו
  choice: उसका पुत्र आसा उसके स्थान पर राज्य करने लगा
  rationale: यह राजवंशीय उत्तराधिकार को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है। ‘उसके स्थान पर’ תַּחְתָּיו के प्रतिस्थापन/उत्तराधिकार भाव को बनाए रखता है।
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: मूल के शाब्दिक समय-सूचक रूप को बनाए रखते हुए यह आसा के शासनकाल की ओर संकेत करता है।
- source_word: שָׁקְטָה הָאָרֶץ
  choice: देश को ... चैन मिला
  rationale: שׁקט यहाँ अशांति या युद्ध से राहत और स्थिरता का भाव देता है। ‘चैन मिला’ आधुनिक हिन्दी में स्वाभाविक है और राष्ट्रीय विश्राम के प्रसंग को व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עֶשֶׂר שָׁנִים
  choice: दस वर्ष तक
  rationale: यह अवधि को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मृत्यु के इब्रानी मुहावरे का बिंब सुरक्षित है; ‘पुरखाओं’ को ‘पितरों’ की अपेक्षा अधिक सामान्य आधुनिक हिन्दी के कारण चुना गया। पादटिप्पणी-चिह्न संबंधित अंतिम कथन के बाद रखा गया है।
