base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/004.yaml
  text: Then Abijah stood on Mount Zemaraim[a], which is in the hill country of Ephraim, and said, “Hear me, Jeroboam and all Israel!”
translation:
  language: hi
  text: तब अबिय्याह समारैम पर्वत पर खड़ा हुआ, जो एप्रैम के पहाड़ी प्रदेश में है[a], और उसने कहा, “यारोबाम और समस्त इस्राएल, मेरी बात सुनो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो एप्रैम के पर्वतीय क्षेत्र में है।” इब्रानी अभिव्यक्ति एप्रैम के पहाड़ी प्रदेश अथवा पर्वतीय क्षेत्र का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: खड़ा हुआ
  rationale: קום का कथात्मक अर्थ ‘उठा/खड़ा हुआ’ हो सकता है। भाषण के प्रसंग में ‘खड़ा हुआ’ स्वाभाविक है और औपचारिक सैन्य मुद्रा का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מֵעַל לְהַר
  choice: पर्वत पर
  rationale: इब्रानी पूर्वसर्गों का क्रम शाब्दिक रूप से जटिल है, पर यहाँ अबिय्याह की पर्वत पर स्थिति बताता है; इसलिए स्वाभाविक स्थानवाचक रूप चुना गया है।
- source_word: צְמָרַיִם
  choice: समारैम
  rationale: स्थान के इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר בְּהַר אֶפְרָיִם
  choice: जो एप्रैम के पहाड़ी प्रदेश में है
  rationale: הַר यहाँ केवल एक शिखर नहीं, बल्कि पहाड़ी अथवा पर्वतीय क्षेत्र को भी सूचित कर सकता है। ‘पहाड़ी प्रदेश’ आधुनिक हिन्दी में क्षेत्रीय अर्थ स्पष्ट करता है।
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: यह सामान्य कथात्मक वचन-परिचायक है; हिन्दी में कर्ता-सर्वनाम जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: यह שמע का बहुवचन आज्ञार्थक रूप है, जिसके साथ प्रथम पुरुष एकवचन प्रत्यय है। ‘मेरी सुनो’ सीधे और प्रभावशाली संबोधन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָרָבְעָם וְכָל יִשְׂרָאֵל
  choice: यारोबाम और समस्त इस्राएल
  rationale: राजा और उत्तरी समुदाय को सीधे संबोधित किया गया है। ‘समस्त इस्राएल’ राष्ट्रीय-वाचक नाम और इतिहासकार की राजनीतिक-वाचा संबंधी भाषा को सुरक्षित रखता है।
theological_decisions:
- issue: विभाजित राज्य के प्रसंग में יִשְׂרָאֵל का अनुवाद
  choice: समस्त इस्राएल
  alternative: सभी इस्राएली
  rationale: मूल पाठ सीधे राष्ट्रीय-वाचा संबंधी नाम का प्रयोग करता है। ‘समस्त इस्राएल’ उत्तरी राज्य के लिए प्रयुक्त पूर्ण राष्ट्रीय पदवी को बनाए रखता है और विभाजित राजतंत्र की राजनीतिक-धर्मवैचारिक जटिलता को केवल जातीय अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली अपनाई गई है। नामों का स्रोत-संगत देवनागरी लिप्यंतरण किया गया है और संबोधन की वक्तृता बनाए रखी गई है।
