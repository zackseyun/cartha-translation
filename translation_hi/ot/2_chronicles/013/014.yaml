source:
  edition: WLC
  text: וַ/יִּפְנ֣וּ יְהוּדָ֗ה וְ/הִנֵּ֨ה לָ/הֶ֤ם הַ/מִּלְחָמָה֙ פָּנִ֣ים וְ/אָח֔וֹר וַֽ/יִּצְעֲק֖וּ לַ/יהוָ֑ה וְ/הַ/כֹּ֣הֲנִ֔ים מחצצרים בַּ/חֲצֹצְרֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/014.yaml
  text: When Judah turned around, behold, the battle was before them and behind them; and they cried out to Yahweh, and the priests were blowing the trumpets.
translation:
  language: hi
  text: यहूदा के लोग मुड़े, तो देखा कि लड़ाई उनके आगे और पीछे थी। उन्होंने याहवे को पुकारा, और याजक तुरहियाँ फूँक रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: मुड़कर देखा
  rationale: פנה यहाँ पीछे की ओर मुड़ने और सामने आई स्थिति को देखने का भाव देता है; प्रसंग में यह स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह सामूहिक व्यक्तिवाचक नाम यहूदा के लोगों या सेना को सूचित करता है; मूल की संक्षिप्तता बनाए रखने के लिए नाम को ज्यों का त्यों रखा गया है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह अभिव्यक्ति अचानक सामने आई स्थिति की ओर ध्यान खींचती है और मूल की कथात्मक सजीवता को बनाए रखती है।
- source_word: הַמִּלְחָמָה
  choice: लड़ाई
  rationale: यहाँ किसी दीर्घकालीन युद्ध के बजाय तत्काल चल रहे सैन्य संघर्ष का उल्लेख है; आधुनिक हिन्दी में ‘लड़ाई’ सहज है।
- source_word: פָּנִים וְאָחוֹר
  choice: उनके आगे और पीछे दोनों ओर
  rationale: यह मूल के दोनों दिशाओं से घिर जाने के भाव को स्पष्ट रूप से व्यक्त करता है, बिना हमले का अतिरिक्त विवरण जोड़े।
- source_word: וַיִּצְעֲקוּ
  choice: दुहाई दी
  rationale: याहवे की ओर संकट में की गई तीव्र पुकार को ‘दुहाई दी’ प्रार्थनापूर्ण और तात्कालिक दोनों रूपों में व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम יהוה को नाम के रूप में पारदर्शी ढंग से लिप्यंतरित किया गया है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह כֹּהֲנִים का प्रचलित, संक्षिप्त और प्रसंगानुकूल हिन्दी रूप है।
- source_word: מחצצרים
  choice: फूँक रहे थे
  rationale: रूप जारी या साथ-साथ हो रही क्रिया बताता है; अपूर्ण भूतकालीन हिन्दी उस कालगत भाव को स्वाभाविक रूप से दर्शाती है।
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: חֲצֹצְרוֹת सीधे धार्मिक और सैनिक प्रयोजन की धातु की तुरहियों को दर्शाता है; इस पद में ‘चाँदी की’ जोड़ना उचित नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में प्रयुक्त विशिष्ट ईश्वरीय नाम को छिपाने या उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है; इससे स्रोत-पाठ का नामात्मक स्वरूप बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तो देखो’ मूल के आकस्मिक ध्यानाकर्षण को बनाए रखता है, जबकि ‘दुहाई दी’ संकट में परमेश्वर को की गई तीव्र पुकार व्यक्त करता है। वाक्य के अंतिम दोनों खंडों को ‘और’ से जोड़ा गया है ताकि इब्रानी समन्वय बना रहे और याजकों की क्रिया को केवल पृष्ठभूमि की घटना न बना दिया जाए।
