id: 2CH.13.6
reference: 2 Chronicles 13:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֨קָם֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט עֶ֖בֶד שְׁלֹמֹ֣ה בֶן דָּוִ֑יד וַ/יִּמְרֹ֖ד עַל אֲדֹנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/006.yaml
  text: Jeroboam son of Nebat[a], a servant of Solomon son of David, rose up and rebelled against his lord.
translation:
  language: hi
  text: नबात का पुत्र यारोबाम, जो दाऊद के पुत्र सुलैमान का सेवक था, उठ खड़ा हुआ और अपने स्वामी[a] के विरुद्ध विद्रोह किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मालिक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: यह क़ूम क्रिया का कथात्मक रूप है और विरोध के लिए आगे आने की क्रिया बताता है; यह अनावश्यक रूप से केवल सैन्य कार्रवाई का अर्थ नहीं जोड़ता।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात का पुत्र यारोबाम
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण किया गया है और इब्रानी वंशसूचक संबंध को स्वाभाविक हिन्दी में रखा गया है।
- source_word: עֶבֶד
  choice: सेवक
  rationale: राजकीय-प्रशासनिक संदर्भ में यह सुलैमान के अधीन यारोबाम की स्थिति बताता है; ‘दास’ यहाँ आवश्यकता से अधिक बंधुआ स्थिति का संकेत दे सकता है।
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: दाऊद के पुत्र सुलैमान
  rationale: नामों के प्रचलित हिन्दी रूप रखते हुए वंशगत बल को सुरक्षित रखा गया है।
- source_word: וַיִּמְרֹד
  choice: विद्रोह किया
  rationale: यह अधिकार के विरुद्ध बगावत को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל אֲדֹנָיו
  choice: अपने स्वामी के विरुद्ध
  rationale: यहाँ प्रत्यय यारोबाम के मानवीय अधिकारी सुलैमान की ओर संकेत करता है। ‘स्वामी’ पदानुक्रम और अधीनता का अर्थ बनाए रखता है।
theological_decisions:
- issue: मानवीय אֲדֹנָיו का अनुवाद
  choice: अपने स्वामी
  alternative: अपने मालिक
  rationale: यह पद परमेश्वर के लिए नहीं, बल्कि यारोबाम के मानवीय अधिकारी सुलैमान के लिए प्रयुक्त है। ‘स्वामी’ अधिकार-संबंध को बनाए रखता है, जबकि पादटिप्पणी में समानार्थी विकल्प दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबंधवाचक उपवाक्य ‘जो ... सेवक था’ हिन्दी में लंबे पदबंध को स्पष्ट करता है और मूल कथन के सभी संबंध सुरक्षित रखता है।
