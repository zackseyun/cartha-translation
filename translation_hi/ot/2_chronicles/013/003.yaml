source:
  edition: WLC
  text: וַ/יֶּאְסֹ֨ר אֲבִיָּ֜ה אֶת הַ/מִּלְחָמָ֗ה בְּ/חַ֨יִל֙ גִּבּוֹרֵ֣י מִלְחָמָ֔ה אַרְבַּע מֵא֥וֹת אֶ֖לֶף אִ֣ישׁ בָּח֑וּר וְ/יָרָבְעָ֗ם עָרַ֤ךְ עִמּ/וֹ֙ מִלְחָמָ֔ה בִּ/שְׁמוֹנֶ֨ה מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ בָּח֖וּר גִּבּ֥וֹר חָֽיִל־־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/003.yaml
  text: Abijah joined battle with an army of four hundred thousand chosen men[a], mighty warriors; and Jeroboam drew up for battle against him with eight hundred thousand chosen men[b], mighty men of valor.
translation:
  language: hi
  text: अबिय्याह चार लाख चुने हुए पुरुषों की सेना के साथ युद्ध में उतरा[a]; वे पराक्रमी योद्धा थे। यारोबाम ने उसके विरुद्ध आठ लाख चुने हुए पुरुषों को युद्ध के लिए पंक्तिबद्ध किया; वे वीर और सामर्थी योद्धा थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शब्दशः अर्थ ‘युद्ध को बाँधा’ है; आशय युद्ध में संलग्न होने या युद्ध में उतरने से है।
    reason: lexical_alternative
  - marker: b
    text: यह इब्रानी सैन्य अभिव्यक्ति वीर, सक्षम और युद्ध-कुशल पुरुषों को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאְסֹר אֶת־הַמִּלְחָמָה
  choice: युद्ध में उतरा
  rationale: אָסַר का सामान्य अर्थ ‘बाँधना’ है, पर מִלְחָמָה के साथ यह सैन्य मुहावरा युद्ध में संलग्न होने का अर्थ देता है। ‘युद्ध में उतरा’ आधुनिक हिंदी में स्वाभाविक है और किसी ऐसे आक्रामक आरम्भ का दावा नहीं करता जिसे इब्रानी अनिवार्य नहीं बनाती।
- source_word: בְּחַיִל
  choice: सेना के साथ
  rationale: यहाँ חַיִל सैनिक बल या सेना को सूचित करता है; इसके बाद सैनिकों की संख्या दी गई है, इसलिए ‘सेना’ प्रसंगानुकूल है।
- source_word: גִּבּוֹרֵי מִלְחָמָה
  choice: पराक्रमी योद्धा
  rationale: यह पद युद्ध में सामर्थी और दक्ष लड़ाकों का वर्णन करता है। ‘पराक्रमी योद्धा’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: בָּחוּר
  choice: चुने हुए
  rationale: सैन्य प्रसंग में בָּחוּר चयनित अथवा उत्तम सैनिकों को दर्शाता है; ‘चुने हुए’ इस भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: עָרַךְ עִמּוֹ מִלְחָמָה
  choice: उसके विरुद्ध ... युद्ध के लिए पंक्तिबद्ध किया
  rationale: सैन्य प्रयोग में עָרַךְ सेना को युद्ध-विन्यास में लगाने को दर्शाता है। ‘पंक्तिबद्ध किया’ तैयारी और सामरिक व्यवस्था दोनों व्यक्त करता है।
- source_word: גִּבּוֹר חָיִל
  choice: वीर और सामर्थी योद्धा
  rationale: यह प्रचलित सैन्य पद वीरता, क्षमता और युद्ध-कौशल से युक्त पुरुषों को दर्शाता है। हिंदी में गुणों को स्पष्ट करके कहना अर्थ को सहज बनाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। विशाल सैन्य संख्याएँ मूल पाठ के अनुसार ज्यों की त्यों दी गई हैं। अर्धविराम और अगले वाक्यांश के माध्यम से सैनिकों के वर्णन को संख्या से स्पष्ट रूप से जोड़ा गया है।
