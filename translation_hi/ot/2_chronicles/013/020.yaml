  text: וְ/לֹֽא עָצַ֧ר כֹּֽחַ יָרָבְעָ֛ם ע֖וֹד בִּ/ימֵ֣י אֲבִיָּ֑הוּ וַ/יִּגְּפֵ֥/הוּ יְהוָ֖ה וַ/יָּמֹֽת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/020.yaml
  text: Jeroboam no longer retained strength in the days of Abijah[a], and Yahweh struck him, and he died.
translation:
  language: hi
  text: अबिय्याह के दिनों में यारोबाम अपना सामर्थ्य बनाए रखने में अब समर्थ न रहा। याहवे ने उस पर प्रहार किया[a], और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘याहवे ने उसे पीड़ित किया’ या ‘याहवे ने उस पर विपत्ति डाली’ भी हो सकता है। इब्रानी पाठ केवल यह कहता है कि याहवे ने यारोबाम पर ‘प्रहार किया’; वह प्रहार किस प्रकार हुआ, यह नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצַר כֹּחַ
  choice: अपना सामर्थ्य बनाए न रख सका
  rationale: עָצַר का मूल भाव थामे रखने या बनाए रखने का है और כֹּחַ का अर्थ सामर्थ्य/शक्ति है। यह अनुवाद केवल सैनिक विजय का अर्थ थोपे बिना यारोबाम के शक्ति बनाए न रख पाने को व्यक्त करता है।
- source_word: עוֹד
  choice: फिर ... न
  rationale: לֹא के साथ עוֹד का अर्थ ‘अब और नहीं’ या ‘फिर नहीं’ है। हिंदी वाक्य में ‘फिर ... न’ इसी नकारात्मक निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּימֵי אֲבִיָּהוּ
  choice: अबिय्याह के दिनों में
  rationale: यह अबिय्याह के जीवनकाल या शासनकाल के दौरान का मानक कालवाचक पद है; निकट और स्पष्ट हिंदी रूप रखा गया है।
- source_word: וַיִּגְּפֵהוּ
  choice: उस पर प्रहार किया
  rationale: נגף ईश्वरीय प्रहार, विपत्ति या पीड़ा का संकेत दे सकता है। ‘प्रहार किया’ क्रिया की व्यापकता बनाए रखता है और बीमारी, युद्ध अथवा किसी अन्य साधन को निश्चित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: सरल इब्रानी कथात्मक क्रम को कारण या तात्कालिकता बढ़ाए बिना सीधे रूप में व्यक्त किया गया है।
theological_decisions:
- issue: וַיִּגְּפֵהוּ יְהוָה में ईश्वरीय कार्य की प्रकृति
  choice: पद सीधे कहता है कि याहवे ने यारोबाम पर प्रहार किया और फिर वह मर गया, पर प्रहार का साधन नहीं बताता।
  alternative: याहवे ने उसे बीमारी से पीड़ित किया, अथवा युद्ध या तत्काल न्याय में उसे मार गिराया।
  rationale: मूल पाठ यारोबाम के पतन और मृत्यु को याहवे के कार्य से जोड़ता है, लेकिन बीमारी, युद्ध-घाव या किसी अन्य माध्यम को निर्दिष्ट नहीं करता। अनुवाद इसी अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘प्रहार किया’ को ‘मारा’ पर इसलिए वरीयता दी गई कि आधुनिक हिंदी में ‘मारा’ स्वयं ‘जान से मार डाला’ समझा जा सकता है और अगले कथन ‘वह मर गया’ से पहले ही परिणाम निश्चित कर देता।
