source:
  edition: WLC
  text: שָׁל֣וֹשׁ שָׁנִ֗ים מָלַךְ֙ בִּ/יר֣וּשָׁלִַ֔ם וְ/שֵׁ֣ם אִמּ֔/וֹ מִיכָיָ֥הוּ בַת אוּרִיאֵ֖ל מִן גִּבְעָ֑ה וּ/מִלְחָמָ֥ה הָיְתָ֛ה בֵּ֥ין אֲבִיָּ֖ה וּ/בֵ֥ין יָרָבְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/002.yaml
  text: He reigned three years in Jerusalem[a], and his mother’s name was Micaiah daughter of Uriel from Gibeah. And there was war between Abijah and Jeroboam.
translation:
  language: hi
  text: उसने यरूशलेम में तीन वर्ष तक राज्य किया। उसकी माता का नाम मीकायाह[a] था; वह गिबा के ऊरीएल की पुत्री थी। और अबिय्याह और यारोबाम के बीच युद्ध हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 राजाओं 15:2 के समानांतर विवरण में अबिय्याह की माता का नाम माका है। इब्रानी में “पुत्री” शब्द कभी-कभी अधिक व्यापक अर्थ में किसी स्त्री वंशज के लिए भी प्रयुक्त हो सकता है; इसलिए दोनों विवरण अलग नाम-रूपों या वंशावली की अलग परंपराओं को दर्शा सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: इब्रानी क्रिया का अर्थ राजा के रूप में शासन करना है; राजकीय काल-विवरण में यह स्वाभाविक और सटीक हिन्दी है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: यह वंश-संबंधी मानक सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: מִיכָיָהוּ
  choice: मीकायाह
  rationale: यह पद में दिए गए इब्रानी नाम-रूप का देवनागरी लिप्यंतरण है; इसे समानांतर पाठ के माका नाम से नहीं मिलाया गया।
- source_word: בַת אוּרִיאֵל
  choice: ऊरीएल की पुत्री
  rationale: मूल पाठ सीधे पुत्री कहता है; व्यापक वंशज का संभावित अर्थ मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: מִן גִּבְעָה
  choice: गिबा के ऊरीएल
  rationale: מִן यहाँ ऊरीएल के स्थान या मूल को सूचित करता है; हिन्दी में यह स्थान-संबंध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וּמִלְחָמָה הָיְתָה
  choice: और ... युद्ध हुआ
  rationale: यह अस्तित्वसूचक सरल कथन का सहज हिन्दी रूप है और युद्ध की अवधि या आरम्भ के बारे में अतिरिक्त पक्ष नहीं जोड़ता।
- source_word: בֵּין ... וּבֵין
  choice: के बीच
  rationale: यह दोनों पक्षों के पारस्परिक विरोध को व्यक्त करने वाला सामान्य हिन्दी प्रयोग है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: इतिहासवृत्त में प्रयुक्त इब्रानी नाम-रूप को रखा गया है; राजाओं की पुस्तक का अबियाम रूप यहाँ नहीं लाया गया।
theological_decisions:
- issue: अबिय्याह की माता के नाम और वंश के विषय में इतिहासवृत्त तथा 1 राजाओं 15:2 के समानांतर विवरण का अंतर
  choice: मुख्य पाठ में इतिहासवृत्त का पाठ—मीकायाह, गिबा के ऊरीएल की पुत्री—ज्यों का त्यों रखा गया।
  alternative: नाम को 1 राजाओं 15:2 के माका से मिलाना, अथवा मुख्य पाठ में पुत्री को पोती/वंशज कहना।
  rationale: अनुवाद को उपलब्ध इब्रानी पाठ का प्रतिनिधित्व करना चाहिए, न कि समानांतर विवरणों के तनाव को चुपचाप सुलझाना चाहिए। בַת कभी व्यापक स्त्री-वंशज का बोध करा सकता है, पर यहाँ पाठ सीधे पुत्री कहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय सूत्र के लिए “राज्य किया,” मातृ-संबंध के लिए “माता,” और व्यक्तिनामों के लिए मूल इब्रानी के निकट प्रचलित देवनागरी रूप चुने गए हैं।
