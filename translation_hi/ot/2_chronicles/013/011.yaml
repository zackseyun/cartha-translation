  text: וּ/מַקְטִרִ֣ים לַ/יהוָ֡ה עֹל֣וֹת בַּ/בֹּֽקֶר בַּ/בֹּ֣קֶר וּ/בָ/עֶֽרֶב בָּ/עֶ֣רֶב וּ/קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת לֶ֜חֶם עַל הַ/שֻּׁלְחָ֣ן הַ/טָּה֗וֹר וּ/מְנוֹרַ֨ת הַ/זָּהָ֤ב וְ/נֵרֹתֶ֨י/הָ֙ לְ/בָעֵר֙ בָּ/עֶ֣רֶב בָּ/עֶ֔רֶב כִּֽי שֹׁמְרִ֣ים אֲנַ֔חְנוּ אֶת מִשְׁמֶ֖רֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אַתֶּ֖ם עֲזַבְתֶּ֥ם אֹתֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/011.yaml
  text: And we offer up burnt offerings to Yahweh morning by morning and evening by evening[a], and fragrant incense, and the arrangement of bread on the pure table, and the golden lampstand with its lamps to burn evening by evening; for we are keeping the charge of Yahweh our God, but you have forsaken him.
translation:
  language: hi
  text: हम हर सुबह और हर शाम यहोवा के लिए होमबलियाँ चढ़ाते और सुगन्धित धूप जलाते हैं; हम शुद्ध मेज़ पर रोटियों को क्रम से रखते हैं[a], और स्वर्ण दीपाधार तथा उसके दीपों को हर शाम जलाए रखते हैं; क्योंकि हम यहोवा, अपने परमेश्वर, की सौंपी हुई सेवा का पालन करते हैं, परन्तु तुमने उसे त्याग दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “भेंट की रोटियाँ” अथवा “उपस्थिति की रोटियाँ।” शाब्दिक अर्थ: “रोटी की क्रमबद्ध सजावट।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַקְטִרִים
  choice: जलाते हैं
  rationale: हिफ़ील रूप वेदी पर चढ़ावे को धुएँ में ऊपर उठाने के लिए जलाने को दर्शाता है। होमबलियों और धूप—दोनों के साथ प्रयुक्त होने के कारण हिन्दी में ‘जलाते हैं’ दोनों कर्मों को स्वाभाविक रूप से समेटता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: वाचा के नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; לְ समर्पण की दिशा बताता है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: עֹלָה के लिए यह मानक हिन्दी धार्मिक पद है और पूर्णतः जलाई जाने वाली बलि का भाव रखता है।
- source_word: בַּבֹּקֶר בַּבֹּקֶר וּבָעֶרֶב בָּעֶרֶב
  choice: हर सुबह और हर शाम
  rationale: हिब्रू की पुनरुक्ति नियमित, प्रतिदिन की क्रिया दर्शाती है। हिन्दी में ‘हर सुबह’ और ‘हर शाम’ इसका स्वाभाविक समतुल्य है।
- source_word: וּקְטֹרֶת סַמִּים
  choice: और सुगन्धित धूप
  rationale: סַמִּים सुगन्धित मसालों या द्रव्यों से बनी धूप का संकेत देता है; ‘सुगन्धित धूप’ स्पष्ट और सहज है।
- source_word: וּמַעֲרֶכֶת לֶחֶם
  choice: रोटियाँ क्रम से सजाते हैं
  rationale: מַעֲרֶכֶת व्यवस्थित पंक्ति या सजावट को दर्शाता है। क्रियात्मक हिन्दी मूल पदबंध का अर्थ स्पष्ट करती है और पारंपरिक व्याख्यात्मक नाम को मुख्य पाठ में नहीं थोपती।
- source_word: עַל הַשֻּׁלְחָן הַטָּהוֹר
  choice: शुद्ध मेज़ पर
  rationale: טָהוֹר यहाँ उपासना-संबंधी शुद्धता बताता है; ‘शुद्ध’ केवल भौतिक सफ़ाई से अधिक उपयुक्त है।
- source_word: וּמְנוֹרַת הַזָּהָב
  choice: और सोने की दीपवृक्ष
  rationale: מְנוֹרָה मंदिर के शाखायुक्त दीप-आधार को दर्शाता है। ‘दीपवृक्ष’ उसके स्वरूप को ‘दीपदान’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וְנֵרֹתֶיהָ לְבָעֵר
  choice: के दीप ... जलाते हैं
  rationale: बत्ती वाले दीपों को जलते रखने की क्रिया को वर्तमान हिन्दी में संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: שֹׁמְרִים אֲנַחְנוּ אֶת מִשְׁמֶרֶת יְהוָה
  choice: हम ... यहोवा की दी हुई सेवा का पालन करते हैं
  rationale: שׁמר משׁמרת किसी सौंपे हुए दायित्व, पहरे या धार्मिक सेवा को निष्ठापूर्वक निभाने का मुहावरा है। ‘दी हुई सेवा का पालन’ मंदिर-सेवा के संदर्भ को स्पष्ट रखता है।
- source_word: וְאַתֶּם עֲזַבְתֶּם אֹתוֹ
  choice: परन्तु तुमने उसे त्याग दिया है
  rationale: प्रत्यक्ष विरोध को ‘परन्तु’ से और עזב के परित्याग के भाव को ‘त्याग दिया’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: मंदिर की रोटियों के पद का अनुवाद
  choice: रोटियाँ क्रम से सजाते हैं
  alternative: भेंट की रोटियाँ / उपस्थिति की रोटी
  rationale: मूल वाक्यांश का शाब्दिक बल रोटियों की क्रमबद्ध सजावट पर है। पारंपरिक नाम संदर्भतः सही हैं, पर अधिक व्याख्यात्मक हैं; इसलिए उन्हें पादटिप्पणी में रखा गया है।
- issue: वाचा के नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में नहीं बदलता।
- issue: מִשְׁמֶרֶת का धार्मिक आशय
  choice: दी हुई सेवा
  alternative: आज्ञा / पहरेदारी / दायित्व
  rationale: संदर्भ याजकीय मंदिर-सेवा का है। यह रूप सौंपे गए पवित्र दायित्व को व्यक्त करता है, पर इसे केवल एक आज्ञा या शारीरिक पहरेदारी तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। हिब्रू की काल-वितरक पुनरुक्ति को सहज हिन्दी ‘हर सुबह/हर शाम’ में व्यक्त किया गया है। लंबे मूल वाक्य को स्पष्टता के लिए अर्धविरामों में बाँटा गया है, और मंदिर-सेवा की तकनीकी शब्दावली को जहाँ संभव हो सामान्य पाठक के लिए बोधगम्य रखा गया है।
