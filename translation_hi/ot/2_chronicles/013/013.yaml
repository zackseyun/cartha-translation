translation:
  language: hi
  text: परन्तु यारोबाम ने घात-दल को घुमाकर उनके पीछे आने के लिए भेज दिया था। तब वे यहूदा के सामने थे, और घात-दल उनके पीछे था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָרָבְעָם
  choice: यारोबाम
  rationale: हिब्रू नाम के उच्चारण के निकट और दिए गए परामर्श-पाठ के अनुरूप लिप्यंतरण।
- source_word: הַמַּאְרָב
  choice: घात लगाए सैनिक
  rationale: यहाँ अमूर्त ‘घात’ की अपेक्षा छिपाकर तैनात सैन्य दल अभिप्रेत है; क्रियाओं और स्थान-सूचक वाक्यांश के साथ यह हिंदी में अधिक स्वाभाविक है।
- source_word: הֵסֵב
  choice: घुमाकर ... भेज दिया था
  rationale: हिफ़ील रूप किसी वस्तु या दल को दूसरी ओर मोड़ने/घुमाने का भाव देता है; संदर्भ में दल को पीछे पहुँचाने की सामरिक कार्रवाई स्पष्ट की गई है।
- source_word: לִפְנֵי יְהוּדָה
  choice: यहूदा के सामने
  rationale: स्थान-संबंधी मूल अर्थ को सीधे सुरक्षित रखता है; संदर्भ में ‘यहूदा’ से यहूदा की सेना अभिप्रेत है।
