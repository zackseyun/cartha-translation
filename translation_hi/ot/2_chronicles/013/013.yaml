translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। हिब्रू की सामरिक स्थान-रचना—सामने मुख्य सेना और पीछे घात-दल—स्पष्ट रखी गई है। ‘मुख्य सेना’ संदर्भगत पूर्ति है, जिससे पहले बहुवचन ‘वे’ का अस्पष्ट संकेत हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
