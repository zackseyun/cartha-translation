base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/021.yaml
  text: And Abijah grew strong[b][a], and he took for himself fourteen wives and fathered twenty-two sons and sixteen daughters.
translation:
  language: hi
  text: अबिय्याह शक्तिशाली होता गया[a]। उसने चौदह स्त्रियों से विवाह किया[b] और वह बाईस पुत्रों और सोलह पुत्रियों का पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामर्थी हो गया”; अथवा, “उसने अपने को दृढ़ किया।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “उसने अपने लिए चौदह पत्नियाँ लीं”; यह विवाह करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: शक्तिशाली होता गया
  rationale: हित्पएल रूप यहाँ बढ़ती हुई शक्ति अथवा सुदृढ़ स्थिति को व्यक्त करता है। यह हिंदी प्रयोग स्वाभाविक है और राजनीतिक या सैनिक शक्ति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲבִיָּהוּ
  choice: अबिय्याह
  rationale: हिब्रू नाम का प्रचलित हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: וַיִּשָּׂא לוֹ נָשִׁים אַרְבַּע עֶשְׂרֵה
  choice: उसने चौदह स्त्रियों से विवाह किया
  rationale: ‘स्त्रियों को अपने लिए लेना’ विवाह करने का हिब्रू मुहावरा है। हिंदी में अर्थ को सहज और स्पष्ट रखने के लिए मुहावरे का स्वाभाविक अनुवाद किया गया है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַיּוֹלֶד
  choice: वह ... का पिता बना
  rationale: हिफ़ील रूप पुरुष कर्ता के विषय में संतान उत्पन्न करने अथवा पिता बनने का अर्थ देता है। ‘पिता बना’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: עֶשְׂרִים וּשְׁנַיִם בָּנִים וְשֵׁשׁ עֶשְׂרֵה בָּנוֹת
  choice: बाईस पुत्रों और सोलह पुत्रियों
  rationale: मूल पाठ की संख्याएँ और पुत्र-पुत्री का स्पष्ट भेद यथावत रखा गया है।
theological_decisions:
- issue: बहुपत्नी विवाह का वर्णन
  choice: 'घटना को बिना नैतिक टिप्पणी के वर्णनात्मक रूप में प्रस्तुत किया गया है: ‘उसने चौदह स्त्रियों से विवाह किया।’'
  alternative: इस प्रथा की प्रशंसा या निंदा का भाव अनुवाद में जोड़ना।
  rationale: यह पद अबिय्याह के कार्य और उसकी संतानों की सूचना देता है, पर स्वयं कोई स्पष्ट नैतिक निर्णय नहीं सुनाता; इसलिए अनुवाद भी ऐसा निर्णय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘पुत्र’ और ‘पुत्री’ मूल पाठ की विशिष्टता बनाए रखते हैं, जबकि ‘पिता बना’ पुरातन ‘उत्पन्न किया’ की तुलना में अधिक स्वाभाविक है।
