source:
  edition: WLC
  text: הֲ/לֹ֤א הִדַּחְתֶּם֙ אֶת כֹּהֲנֵ֣י יְהוָ֔ה אֶת בְּנֵ֥י אַהֲרֹ֖ן וְ/הַ/לְוִיִּ֑ם וַ/תַּעֲשׂ֨וּ לָ/כֶ֤ם כֹּהֲנִים֙ כְּ/עַמֵּ֣י הָ/אֲרָצ֔וֹת כָּל הַ/בָּ֗א לְ/מַלֵּ֨א יָד֜/וֹ בְּ/פַ֤ר בֶּן בָּקָר֙ וְ/אֵילִ֣ם שִׁבְעָ֔ה וְ/הָיָ֥ה כֹהֵ֖ן לְ/לֹ֥א אֱלֹהִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/009.yaml
  text: Have you not driven out the priests of Yahweh[a], the sons of Aaron and the Levites[b], and made priests for yourselves like the peoples of the lands? Whoever comes to fill his hand with a young bull and seven rams becomes a priest of what are not gods.
translation:
  language: hi
  text: क्या तुमने यहोवा के याजकों—हारून के पुत्रों और लेवियों—को निकालकर देशों के लोगों की तरह अपने लिए याजक नियुक्त नहीं कर लिए? जो कोई एक जवान बैल और सात मेढ़े लेकर अपना हाथ भरने[a] आता है, वह ऐसे देवताओं का याजक बन जाता है जो वास्तव में देवता नहीं हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपना हाथ भरने’; यह याजक के रूप में नियुक्त या प्रतिष्ठित किए जाने का पारिभाषिक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘अदेवताओं का’ या ‘झूठे देवताओं का’ भी हो सकता है; इब्रानी शाब्दिक रूप से इन उपास्य वस्तुओं के सचमुच देवता होने का निषेध करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या तुमने ... नहीं
  rationale: यह आलंकारिक प्रश्न सहमति की अपेक्षा करता है और फटकार का भाव रखता है; यह हिंदी में स्वाभाविक प्रश्न-विन्यास है।
- source_word: הִדַּחְתֶּם
  choice: निकाल नहीं दिया
  rationale: हिफ़ील रूप बलपूर्वक हटाने या निष्कासित करने का भाव देता है; ‘निकाल दिया’ सामान्य आधुनिक हिंदी में यही अर्थ स्पष्ट करता है।
- source_word: כֹּהֲנֵי יְהוָה
  choice: यहोवा के याजकों
  rationale: सम्बन्धवाचक इब्रानी पदबंध को सीधे रखा गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּנֵי אַהֲרֹן וְהַלְוִיִּם
  choice: हारून के पुत्रों और लेवियों
  rationale: यह हारूनवंशी याजकों और लेवियों का अलग-अलग उल्लेख बनाए रखता है; ‘पुत्रों’ से मूल का वंशगत और धार्मिक महत्व सुरक्षित रहता है।
- source_word: וַתַּעֲשׂוּ לָכֶם כֹּהֲנִים
  choice: अपने लिए याजक नहीं बना लिए
  rationale: עשה यहाँ नियुक्त करने या याजक बनाने के अर्थ में है; ‘अपने लिए’ לָכֶם में निहित स्वार्थपूर्ण पहलू को बनाए रखता है।
- source_word: כְּעַמֵּי הָאֲרָצוֹת
  choice: देशों के लोगों की तरह
  rationale: यह मूल के जातीय-भौगोलिक पदबंध के निकट है और अनावश्यक रूप से ‘मूर्तिपूजक’ जैसा व्याख्यात्मक शब्द नहीं जोड़ता।
- source_word: כָּל הַבָּא
  choice: जो कोई ... आता है
  rationale: सामान्य एकवचन रचना को सहज हिंदी में व्यक्त करता है और किसी भी व्यक्ति के प्रवेश पा सकने की आलोचना बनाए रखता है।
- source_word: לְמַלֵּא יָדוֹ
  choice: अपना हाथ भरवाने
  rationale: मूल धार्मिक पारिभाषिक मुहावरे ‘उसका हाथ भरना’ को दृश्य रूप में सुरक्षित रखते हुए हिंदी में उस व्यक्ति पर होने वाली प्रतिष्ठापन-क्रिया का संकेत देता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּפַר בֶּן בָּקָר וְאֵילִם שִׁבְעָה
  choice: एक जवान बैल और सात मेढ़े लेकर
  rationale: बलि-सामग्री को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है; בְּ को यहाँ साथ लाई गई प्रतिष्ठापन-सामग्री के रूप में समझा गया है।
- source_word: וְהָיָה כֹהֵן
  choice: याजक बन जाता है
  rationale: यह प्रक्रिया के फलस्वरूप प्राप्त स्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְלֹא אֱלֹהִים
  choice: उनका ... जो देवता हैं ही नहीं
  rationale: यह केवल ‘झूठे देवता’ कहने के बजाय मूल की तीखी धार्मिक अस्वीकृति को बनाए रखता है कि उपासना की वे वस्तुएँ वास्तव में देवता नहीं हैं।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; ‘यहोवा’ इसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में रखता है।
- issue: לְלֹא אֱלֹהִים की धार्मिक धार
  choice: जो देवता हैं ही नहीं
  alternative: झूठे देवताओं के / अदेवताओं के
  rationale: मूल उपासना की इन वस्तुओं के देवत्व का सीधा निषेध करता है। चुना हुआ रूप इस तनाव को सहज हिंदी में सुरक्षित रखता है और उन्हें केवल एक अलग प्रकार के ‘देवता’ के रूप में वर्गीकृत नहीं करता।
- issue: לְמַלֵּא יָדוֹ में याजकीय प्रतिष्ठापन का मुहावरा
  choice: अपना हाथ भरवाने
  alternative: याजक नियुक्त होने / अपना अभिषेक कराने
  rationale: मुख्य पाठ मूल के ठोस मुहावरे को बनाए रखता है, जबकि पादटिप्पणी बताती है कि यह याजकीय नियुक्ति या प्रतिष्ठापन का पारिभाषिक प्रयोग है; इससे व्याख्या पाठ के भीतर चुपचाप नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘याजक’, ‘लेवी’ और ‘यहोवा’ जैसे स्थापित बाइबलीय शब्द धार्मिक संदर्भ की शुद्धता के लिए रखे गए हैं। मूल के असामान्य प्रतिष्ठापन-मुहावरे को पादटिप्पणी सहित सुरक्षित रखा गया है, और अंतिम वाक्य में मूर्त देवताओं के देवत्व का स्पष्ट निषेध बनाए रखा गया है।
