  text: הֲ/לֹ֤א לָ/כֶם֙ לָ/דַ֔עַת כִּ֞י יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל נָתַ֨ן מַמְלָכָ֧ה לְ/דָוִ֛יד עַל יִשְׂרָאֵ֖ל לְ/עוֹלָ֑ם ל֥/וֹ וּ/לְ/בָנָ֖י/ו בְּרִ֥ית מֶֽלַח׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/005.yaml
  text: Do you not know that Yahweh[a], the God of Israel, gave the kingdom over Israel to David forever, to him and to his sons[b], by a covenant of salt?
translation:
  language: hi
  text: क्या तुम नहीं जानते कि इस्राएल के परमेश्वर याहवे[a] ने दाऊद को इस्राएल पर राजसत्ता सदा के लिए दे दी—उसे और उसके पुत्रों[b] को—नमक की वाचा[c] के द्वारा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ उस इब्रानी नाम का लिप्यंतरण है जिसे परमेश्वर ने इस्राएल को प्रकट किया था।
    reason: divine_name
  - marker: b
    text: ‘उसके पुत्रों’ से दाऊद का राजवंश, अर्थात उसके राजकीय उत्तराधिकारी, अभिप्रेत हैं।
    reason: cultural_note
  - marker: c
    text: या ‘नमक की वाचा के साथ।’ यह अभिव्यक्ति संभवतः अटल और चिरस्थायी वाचा को दर्शाती है; गिनती 18:19 से तुलना करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא לָכֶם לָדַעַת
  choice: क्या तुम नहीं जानते
  rationale: यह रचना सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। यह हिन्दी में स्वाभाविक रहते हुए उसके चुनौतीपूर्ण बल को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरीय नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधसूचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נָתַן מַמְלָכָה ... עַל יִשְׂרָאֵל
  choice: इस्राएल पर राजसत्ता ... दे दी
  rationale: संदर्भ में מַמְלָכָה केवल भूभाग नहीं, बल्कि इस्राएल पर शासन करने का राजकीय अधिकार दर्शाता है; ‘राजसत्ता’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: वाचा से जुड़े स्थायी काल के दावे को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לוֹ וּלְבָנָיו
  choice: उसे और उसके पुत्रों को
  rationale: मूल के पुरुषवाचक पारिवारिक शब्द को बनाए रखा गया है; राजकीय संदर्भ में यह दाऊद के वंशगत उत्तराधिकारियों की ओर संकेत करता है।
- source_word: בְּרִית מֶלַח
  choice: नमक की वाचा के द्वारा
  rationale: विशिष्ट इब्रानी रूपक को व्याख्यात्मक अनुवाद से बदलने के बजाय अक्षुण्ण रखा गया है; उसका संभावित आशय पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: दाऊद को दी गई राजसत्ता और वाचा की स्थायित्व-भावना
  choice: ‘सदा के लिए’ और ‘नमक की वाचा’ दोनों अभिव्यक्तियों को मुख्य पाठ में बनाए रखना
  alternative: ‘नमक की वाचा’ को व्याख्यात्मक रूप से ‘स्थायी वाचा’ कहना
  rationale: इब्रानी पाठ לְעוֹלָם और בְּרִית מֶלַח दोनों का प्रयोग करता है। शाब्दिक वाचागत भाषा को बनाए रखने से उसका धर्मवैचारिक भार और संभावित तनाव सुरक्षित रहता है, जबकि मुहावरे का अर्थ पादटिप्पणी में समझाया जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण और मौखिक भाषण के अनुकूल रूप रखा गया है। बहुवचन श्रोताओं के लिए ‘तुम’ प्रयोग हुआ है। डैश मूल वाक्य के ‘उसे और उसके पुत्रों को’ वाले स्पष्टीकरण को साफ़ करता है।
