  text: וְ/עַתָּ֣ה אַתֶּ֣ם אֹֽמְרִ֗ים לְ/הִתְחַזֵּק֙ לִ/פְנֵי֙ מַמְלֶ֣כֶת יְהוָ֔ה בְּ/יַ֖ד בְּנֵ֣י דָוִ֑יד וְ/אַתֶּם֙ הָמ֣וֹן רָ֔ב וְ/עִמָּ/כֶם֙ עֶגְלֵ֣י זָהָ֔ב אֲשֶׁ֨ר עָשָׂ֥ה לָ/כֶ֛ם יָרָבְעָ֖ם לֵ/אלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/008.yaml
  text: And now you are saying that you are strong enough to stand against the kingdom of Yahweh in the hand of the sons of David[c][b][a], because you are a great multitude and have with you the golden calves that Jeroboam made for you as gods.
translation:
  language: hi
  text: और अब तुम कहते हो कि तुम याहवे के उस राज्य के सामने अपने को शक्तिशाली सिद्ध करोगे, जो दाऊद के पुत्रों के हाथ में है[a][b]। तुम एक बहुत बड़ी भीड़ हो, और तुम्हारे साथ सोने के वे बछड़े हैं, जिन्हें यारोबाम ने तुम्हारे लिए देवताओं के रूप में बनाए हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम कहते हो कि तुम याहवे के राज्य के सामने अपनी शक्ति दिखाओगे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “दाऊद के पुत्रों के हाथ में।” यहाँ “हाथ में” का अर्थ दाऊद के वंश के द्वारा शासन या प्रशासन है।
    reason: cultural_note
  - marker: c
    text: या, “देवताओं के लिए।” इब्रानी शब्द बहुवचन है और यारोबाम की बछड़ा-मूर्तियों को विवादात्मक ढंग से देवता कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים
  choice: तुम कहते हो
  rationale: वर्तमान कृदन्त कथन या निकट अभिप्राय व्यक्त कर सकता है। ‘तुम कहते हो’ अबिय्याह के भाषण की प्रत्यक्ष और वाग्मितापूर्ण धार को बनाए रखता है, बिना इसे केवल मन की योजना मान लेने के।
- source_word: לְהִתְחַזֵּק ... לִפְנֵי
  choice: के विरुद्ध अपनी शक्ति दिखाओगे
  rationale: חזק का हित्पएल रूप स्वयं को बलवान बनाने या मुठभेड़ में अपनी शक्ति सिद्ध करने का भाव देता है; सैन्य प्रसंग में לִפְנֵי विरोध का संकेत करता है। यह हिन्दी प्रयोग शक्ति और टकराव दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַמְלֶכֶת יְהוָה
  choice: याहवे का राज्य
  rationale: यह पद राज्य को याहवे का बताता है और इतिहास-वृत्तान्त की महत्वपूर्ण धर्मवैचारिक भाषा को सीधे बनाए रखता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: בְּיַד בְּנֵי דָוִיד
  choice: दाऊद के पुत्रों के हाथ में
  rationale: शाब्दिक ‘हाथ में’ शासन, अधिकार या प्रशासन का मुहावरा है। चित्रात्मक भाषा बनाए रखने से यह तनाव सुरक्षित रहता है कि राज्य याहवे का है, फिर भी उसका संचालन दाऊद के वंश के माध्यम से होता है।
- source_word: הָמוֹן רָב
  choice: एक बहुत बड़ी भीड़
  rationale: यह पद उनकी भारी संख्या और सामूहिक सैन्य बल पर जोर देता है। ‘बहुत बड़ी भीड़’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עֶגְלֵי זָהָב
  choice: सोने के वे बछड़े
  rationale: सन्दर्भ यारोबाम की जानी-पहचानी उपासना-वस्तुओं की ओर संकेत करता है; ‘वे’ इस निश्चित सन्दर्भ को स्पष्ट करता है।
- source_word: לֵאלֹהִים
  choice: देवता
  rationale: इब्रानी बहुवचन इन बछड़ा-मूर्तियों को उपासना के लिए बनाए गए देवताओं के रूप में व्यंग्यात्मक ढंग से प्रस्तुत करता है। हिन्दी में सामूहिक विधेय के रूप में ‘देवता बनाया’ स्वाभाविक है और इस विवादात्मक भाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यन्तरण करता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: दाऊदी राजतन्त्र और याहवे के राज्य का सम्बन्ध
  choice: दाऊद के पुत्रों के हाथ में याहवे का राज्य
  alternative: दाऊद के पुत्रों द्वारा शासित याहवे का राज्य
  rationale: '‘हाथ में’ की मूल छवि बनाए रखने से पाठ का द्विपक्षीय दावा सुरक्षित रहता है: राज्य याहवे का है, किन्तु उसका प्रशासन दाऊद के वंश के हाथ में है।'
- issue: यारोबाम के बछड़ों के लिए אֱלֹהִים का बहुवचन
  choice: देवता
  alternative: ईश्वर; उपासना की वस्तुएँ
  rationale: बहुवचन को बनाए रखना मूर्तियों पर पाठ के विवादात्मक प्रहार को सुरक्षित रखता है और उन्हें एकवचन परमेश्वर के साथ मिला नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट किन्तु भाषण के अनुरूप गरिमापूर्ण रखी गई है। ‘अपनी शक्ति दिखाओगे’ सैन्य टकराव को स्वाभाविक रूप से व्यक्त करता है; ‘हाथ में’ जैसी मूल छवि को धर्मवैचारिक तनाव बनाए रखने के लिए रखा गया है।
