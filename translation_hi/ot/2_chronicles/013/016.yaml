  yaml_path: translation/ot/2_chronicles/013/016.yaml
  text: And the sons of Israel fled before Judah[c][b][a], and God gave them into their hand.
translation:
  language: hi
  text: इस्राएली[a] यहूदा के सामने से भाग गए, और परमेश्वर ने उन्हें यहूदा के हाथ में दे दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “उनके हाथ में”; अर्थात उनके अधिकार में। यहाँ “उनके” से यहूदा के लोग अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנ֥וּסוּ
  choice: भाग गए
  rationale: נוּס युद्ध या संकट में भागने अथवा पीछे हटने को व्यक्त करता है। ‘भाग गए’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर इतिहास-वृत्तांत में यह पद उत्तरी राज्य के इस्राएली लोगों के लिए सामूहिक जातिनाम की तरह प्रयुक्त है। ‘इस्राएली’ अर्थ को स्पष्ट और स्वाभाविक रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִפְּנֵי יְהוּדָה
  choice: यहूदा के सामने से
  rationale: מִפְּנֵי का मूल भाव ‘के सामने से’ है और युद्ध-संदर्भ में विरोधी के सामने से भागने को दर्शाता है। यह अनुवाद दिशा और सैन्य प्रसंग दोनों बनाए रखता है।
- source_word: וַיִּתְּנֵם
  choice: उन्हें ... हाथ में कर दिया
  rationale: נתן का सीधा अर्थ ‘देना’ है; किसी के हाथ में देना सैन्य संदर्भ में उसके अधिकार में कर देने का मुहावरा है। हिन्दी का यह रूप प्रत्यक्ष दैवी कर्तृत्व को बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: मूल में אֱלֹהִים है, न कि यहोवा का विशिष्ट नाम; इसलिए हिन्दी में सामान्य ईश्वरीय पद ‘परमेश्वर’ उपयुक्त है।
- source_word: בְּיָדָם
  choice: यहूदा के हाथ में
  rationale: इब्रानी में बहुवचन प्रत्यय सहित शाब्दिक रूप ‘उनके हाथ में’ है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए उसके आशयगत पूर्वपद ‘यहूदा’ को दोहराया गया है, जबकि ‘हाथ में’ का मूल मुहावरा सुरक्षित है।
theological_decisions:
- issue: युद्ध के परिणाम में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर ने उन्हें यहूदा के हाथ में कर दिया
  alternative: परमेश्वर ने उन्हें यहूदा के हाथ में पड़ने दिया
  rationale: मूल पाठ में परमेश्वर נתן क्रिया का प्रत्यक्ष कर्ता है। केवल अनुमति का भाव जोड़ना दैवी कर्तृत्व को अनावश्यक रूप से नरम कर देता।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह पद यहाँ युद्ध में सम्मिलित इस्राएली समुदाय को सूचित करता है। स्वाभाविक हिन्दी के लिए जातिनाम चुना गया है, जबकि मूल की शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण इतिहास-वृत्तांत की है। ‘यहूदा के हाथ में’ हिन्दी में सर्वनामगत अस्पष्टता दूर करता है, और पादटिप्पणी मूल इब्रानी रूप तथा उसके मुहावरेदार अर्थ दोनों बताती है।
