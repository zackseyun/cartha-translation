source:
  edition: WLC
  text: וְ/הִנֵּה֩ עִמָּ֨/נוּ בָ/רֹ֜אשׁ הָ/אֱלֹהִ֧ים וְ/כֹהֲנָ֛י/ו וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה לְ/הָרִ֣יעַ עֲלֵי/כֶ֑ם בְּנֵ֣י יִשְׂרָאֵ֗ל אַל תִּלָּֽחֲמ֛וּ עִם יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם כִּי לֹ֥א תַצְלִֽיחוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/012.yaml
  text: And behold[a], God is with us at our head, and his priests with the trumpets for the battle cry, to sound the alarm against you. Sons of Israel, do not fight against Yahweh, the God of your fathers, for you will not succeed.
translation:
  language: hi
  text: और देखो, परमेश्वर हमारे साथ है और हमारा अगुवा है; उसके याजक तुम्हारे विरुद्ध रणघोष करने के लिए तुरहियाँ लिए हुए हैं। इस्राएल के पुत्रो[a], अपने पूर्वजों के परमेश्वर याहवे के विरुद्ध युद्ध मत करो, क्योंकि तुम सफल नहीं होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “इस्राएलियो।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रो” है; यहाँ यह इस्राएल के लोगों को किया गया सीधा संबोधन है।
    reason: मूल के लिंगयुक्त शाब्दिक रूप और उसके व्यापक जातीय आशय, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है; ‘देखो’ अबिय्याह के भाषण का जोर बनाए रखता है।
- source_word: עִמָּנוּ בָרֹאשׁ הָאֱלֹהִים
  choice: परमेश्वर हमारे साथ है और वही हमारा अगुवा है
  rationale: शाब्दिक ‘हमारे साथ, सिर पर’ को स्वाभाविक हिन्दी में व्यक्त करते हुए परमेश्वर की उपस्थिति और नेतृत्व—दोनों भाव सुरक्षित रखे गए हैं।
- source_word: וְכֹהֲנָיו
  choice: उसके याजक
  rationale: एकवचन प्रत्यय परमेश्वर की ओर संकेत करता है और याजकों का उससे संबंध स्पष्ट करता है।
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: रणघोष की तुरहियाँ
  rationale: חֲצֹצְרוֹת विशेष प्रकार की तुरहियाँ हैं और תְּרוּעָה यहाँ युद्ध-संकेत अथवा रणघोष को दर्शाता है।
- source_word: לְהָרִיעַ עֲלֵיכֶם
  choice: जिन्हें वे तुम्हारे विरुद्ध बजाएँगे
  rationale: उद्देश्यवाचक क्रिया और विरोधी दिशा को सहज हिन्दी में व्यक्त करता है; तुरहियों के वास्तविक बजाए जाने का सैनिक संदर्भ स्पष्ट रहता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रो
  rationale: मूल के पुल्लिंग बहुवचन संबोधन को सुरक्षित रखा गया है; अधिक प्रचलित अर्थ फुटनोट में दिया गया है।
- source_word: אַל תִּלָּחֲמוּ עִם יְהוָה
  choice: याहवे से युद्ध मत करो
  rationale: לחם के साथ עִם प्रतिकूल अर्थ देता है; हिन्दी में ‘से युद्ध करना’ स्वाभाविक रूप से ‘के विरुद्ध लड़ना’ व्यक्त करता है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: अपने पुरखाओं के परमेश्वर
  rationale: वाचा-संबंधी पारंपरिक अभिव्यक्ति को स्पष्ट, वर्तमान हिन्दी में रखा गया है।
- source_word: כִּי לֹא תַצְלִיחוּ
  choice: क्योंकि तुम सफल नहीं होगे
  rationale: צלח के हिफ़ील रूप का व्यापक अर्थ ‘सफल होना’ है, जो यहाँ सैनिक परिणाम को भी समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; ‘याहवे’ उसका लिप्यंतरण करके इस भेद को सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל में लिंगयुक्त संबोधन
  choice: इस्राएल के पुत्रो
  alternative: इस्राएलियो; इस्राएल की सन्तानो
  rationale: मूल का व्याकरणिक रूप और प्रत्यक्ष वाचिक संबोधन मुख्य पाठ में सुरक्षित है, जबकि उसका व्यापक जातीय आशय फुटनोट में स्पष्ट किया गया है।
- issue: בָרֹאשׁ में नेतृत्व और अग्रस्थान का रूपक
  choice: वही हमारा अगुवा है
  alternative: वह हमारे आगे है; वह हमारे सिर पर है
  rationale: यह चुनाव परमेश्वर की नेतृत्वकारी और अग्रणी भूमिका व्यक्त करता है, बिना हिन्दी में अस्वाभाविक शारीरिक रूपक पैदा किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘रणघोष’, ‘तुरही’ और ‘याजक’ जैसे प्रचलित बाइबलीय-सैनिक शब्द मूल प्रसंग को स्पष्ट रखते हैं; वाक्य-विन्यास स्वाभाविक हिन्दी के लिए हल्का पुनर्गठित किया गया है।
