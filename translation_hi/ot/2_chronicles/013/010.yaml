  text: וַ/אֲנַ֛חְנוּ יְהוָ֥ה אֱלֹהֵ֖י/נוּ וְ/לֹ֣א עֲזַבְנֻ֑/הוּ וְ/כֹ֨הֲנִ֜ים מְשָׁרְתִ֤ים לַֽ/יהוָה֙ בְּנֵ֣י אַהֲרֹ֔ן וְ/הַ/לְוִיִּ֖ם בַּ/מְלָֽאכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/010.yaml
  text: But as for us[a], Yahweh is our God, and we have not forsaken him; and the priests who minister to Yahweh are the sons of Aaron[b], and the Levites are in their work.
translation:
  language: hi
  text: परन्तु जहाँ तक हमारी बात है, यहोवा हमारा परमेश्वर है, और हमने उसे नहीं त्यागा है। यहोवा की सेवा करनेवाले याजक हारून के पुत्र हैं, और लेवीय अपने काम में लगे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: परन्तु जहाँ तक हमारी बात है
  rationale: स्वतंत्र सर्वनाम के साथ वाव यहाँ प्रसंगगत विरोध को उभारता है; यहूदा की स्थिति को उत्तरी राज्य से अलग दिखाने के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से नहीं बदला गया; आधुनिक हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: एकवचन संदर्भ और वाचाई प्रसंग में אֱלֹהִים इस्राएल के परमेश्वर के लिए एकवचन पद है।
- source_word: וְלֹא עֲזַבְנֻהוּ
  choice: और हमने उसे नहीं त्यागा है
  rationale: עזב का अर्थ ‘त्यागना/छोड़ देना’ है। हिन्दी पूर्ण वर्तमान चल रही निष्ठा और वर्तमान परिणाम दोनों को व्यक्त करता है।
- source_word: מְשָׁרְתִים לַיהוָה
  choice: यहोवा की सेवा करनेवाले
  rationale: कृदन्त निरंतर याजकीय सेवा बताता है; हिन्दी में ‘सेवा करनेवाले’ धार्मिक संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: इब्रानी वंशपरंपरागत याजकीय पंक्ति को शाब्दिक रूप से ‘हारून के पुत्र’ कहता है; इसे ‘वंशज’ बनाकर विस्तार नहीं दिया गया।
- source_word: וְהַלְוִיִּם בַּמְלָאכֶת
  choice: और लेवीय अपने काम में लगे हैं
  rationale: मूल का संक्षिप्त ‘लेवीय काम में’ नियुक्त सेवा में सक्रिय लगे रहने का भाव देता है; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- issue: עֲזַבְנֻהוּ का कालगत बल
  choice: हमने उसे नहीं त्यागा है
  alternative: हमने उसे नहीं त्यागा
  rationale: इब्रानी पूर्ण क्रिया इस भाषण में वर्तमान तक बनी हुई वाचा-निष्ठा का दावा करती है; ‘नहीं त्यागा है’ उस वर्तमान प्रासंगिकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘याजक’ और ‘लेवीय’ स्थापित बाइबलीय पद हैं। मूल पाठ के विरोध, वाचाई निष्ठा और नियुक्त मन्दिर-सेवा के भाव को बिना सांप्रदायिक विस्तार के सुरक्षित रखा गया है।
