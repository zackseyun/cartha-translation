id: 2CH.13.17
reference: 2 Chronicles 13:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּכּ֥וּ בָ/הֶ֛ם אֲבִיָּ֥ה וְ/עַמּ֖/וֹ מַכָּ֣ה רַבָּ֑ה וַ/יִּפְּל֤וּ חֲלָלִים֙ מִ/יִּשְׂרָאֵ֔ל חֲמֵשׁ מֵא֥וֹת אֶ֖לֶף אִ֥ישׁ בָּחֽוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/013/017.yaml
  text: Abijah and his people struck them with a great blow[b][a], and five hundred thousand chosen men of Israel fell slain.
translation:
  language: hi
  text: अबिय्याह और उसके लोगों ने उन पर भारी प्रहार किया[a], और इस्राएल के पाँच लाख चुने हुए पुरुष[b] मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत बड़ी मार मारी” अथवा “भारी संहार किया।” इब्रानी पदबंध का शाब्दिक अर्थ “बड़ी मार” है।
    reason: lexical_alternative
  - marker: b
    text: या “चुनिंदा पुरुष।” युद्ध के इस प्रसंग में “चुने हुए योद्धा” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ בָהֶם
  choice: उन पर ... प्रहार किया
  rationale: नכה युद्ध के प्रसंग में मारने या प्रहार करने का सामान्य क्रियापद है। ‘उन पर प्रहार किया’ ठोस सैन्य कार्रवाई को व्यक्त करता है और अगली उपवाक्य में बताए गए मारे जाने के परिणाम को समय से पहले इसमें नहीं मिलाता।
- source_word: אֲבִיָּה וְעַמּוֹ
  choice: अबिय्याह और उसके लोग
  rationale: עַם का मूल अर्थ ‘लोग’ है। यद्यपि यहाँ युद्ध में उसके साथ आए जन अभिप्रेत हैं, ‘उसके लोग’ इब्रानी की व्यापक अभिव्यक्ति को बनाए रखता है और अनावश्यक रूप से इसे केवल ‘सेना’ तक सीमित नहीं करता।
- source_word: מַכָּה רַבָּה
  choice: भारी प्रहार
  rationale: यह पदबंध शाब्दिक रूप से ‘बड़ी मार/प्रहार’ का भाव देता है। ‘भारी प्रहार’ आधुनिक हिन्दी में स्वाभाविक है और अगले वाक्यांश में दिए गए मृतकों के विवरण से इसे अलग रखता है।
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: मारे गए
  rationale: युद्ध-वर्णन में נפל और חֲלָלִים का संयुक्त अर्थ युद्ध में मारे जाने का है। हिन्दी में ‘मारे हुए गिरे’ अस्वाभाविक होता; ‘मारे गए’ उसी परिणाम को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल के
  rationale: यह उन लोगों के समुदाय या पक्ष की पहचान कराता है जिनमें हताहत हुए। ‘इस्राएल के’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: חֲמֵשׁ מֵאוֹת אֶלֶף
  choice: पाँच लाख
  rationale: इब्रानी संख्या का हिन्दी संख्या-पद्धति में सीधा और सटीक रूप। पाठ में दी गई संख्या को बिना घटाए या प्रतीकात्मक बनाए रखा गया है।
- source_word: אִישׁ בָּחוּר
  choice: चुने हुए पुरुष
  rationale: אִישׁ संख्या के साथ वितरणात्मक रूप में प्रयुक्त है और בָּחוּר यहाँ चुने हुए या श्रेष्ठ चयनित पुरुषों का संकेत देता है। ‘चुने हुए पुरुष’ मूल अभिव्यक्ति को बनाए रखता है; ‘सैनिक’ या ‘योद्धा’ प्रसंगानुकूल होते, पर मूल में निहित शब्द से अधिक विशिष्ट हैं।
theological_decisions:
- issue: युद्ध में हताहतों की बहुत बड़ी संख्या
  choice: इब्रानी पाठ में दी गई ‘पाँच लाख’ की संख्या को यथावत रखना।
  alternative: इसे अतिशयोक्ति मानना, संख्या में पाठ-संशोधन करना, या אֶלֶף को कुल/सैन्य-दल के अर्थ में समझना।
  rationale: पद संख्या को सीधे प्रस्तुत करता है और स्वयं उसे प्रतीकात्मक या घटाई हुई संख्या मानने का कोई संकेत नहीं देता। अनुवाद का कार्य स्रोत-पाठ को व्यक्त करना है, न कि मुख्य पाठ में ऐतिहासिक या पाठालोचनात्मक प्रश्न का निर्णय करना।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज युद्ध-वर्णन। ‘भारी प्रहार’ मूल पदबंध की ठोस छवि बनाए रखता है, जबकि ‘मारे गए’ हिन्दी की स्वाभाविक अभिव्यक्ति के अनुसार परिणाम स्पष्ट करता है। परमेश्वर या किसी धर्मसिद्धान्त से सम्बन्धित कोई अतिरिक्त व्याख्या पाठ में नहीं जोड़ी गई है।
