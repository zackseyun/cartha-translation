base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/011.yaml
  text: He also made high places in the hill country of Judah[a], led the inhabitants of Jerusalem into prostitution[b], and led Judah astray.
translation:
  language: hi
  text: उसने यहूदा के पहाड़ी प्रदेश में ऊँचे पूजा-स्थल भी बनाए, यरूशलेम के निवासियों से वेश्यावृत्ति करवाई[a], और यहूदा को भटका दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के निवासियों से व्यभिचार करवाया।” इब्रानी क्रिया वेश्यावृत्ति की छवि का प्रयोग करती है और इस प्रसंग में वाचा के प्रति बेवफ़ाई, अर्थात् धार्मिक धर्मत्याग, का भी संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदा को यहोवा से दूर कर दिया।” इब्रानी में यह स्पष्ट नहीं कहा गया कि उसे किससे दूर किया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: उसने ... भी
  rationale: गַּם के योगात्मक बल और स्वतंत्र सर्वनाम के जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עָשָׂה בָמוֹת
  choice: पूजा के ऊँचे स्थान ... बनाए
  rationale: עָשָׂה का सामान्य अर्थ ‘बनाना’ है और בָמוֹת ऐसे ऊँचे पूजा-स्थलों के लिए प्रचलित ऐतिहासिक शब्द है जो इस प्रसंग में अनुचित उपासना से जुड़े हैं। ‘पूजा के’ जोड़ने से आधुनिक पाठक को ‘ऊँचे स्थान’ का आशय स्पष्ट होता है।
- source_word: בְּהָרֵי יְהוּדָה
  choice: यहूदा के पहाड़ी प्रदेश में
  rationale: הָרִים यहाँ अलग-अलग पहाड़ों के साथ-साथ पूरे पहाड़ी भूभाग का संकेत दे सकता है; ‘पहाड़ी प्रदेश’ इस भौगोलिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיֶּזֶן
  choice: व्यभिचार करवाया
  rationale: זנה का यह कारक रूप दूसरों से वेश्यावृत्ति या व्यभिचार करवाने का बोध देता है। उपासना के प्रसंग में इसमें धार्मिक विश्वासघात का रूपक भी निहित हो सकता है; ‘व्यभिचार’ हिन्दी में इस दोहरे नैतिक और धार्मिक संकेत को बनाए रखता है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों
  rationale: यह पद यरूशलेम में रहने वाले लोगों को सामूहिक रूप से दर्शाता है; ‘निवासियों’ सटीक और सहज है।
- source_word: וַיַּדַּח
  choice: भटका दिया
  rationale: נדח का हिफ़ील रूप दूर कर देने या सही मार्ग और निष्ठा से भटका देने का अर्थ दे सकता है। यहाँ ‘भटका दिया’ धार्मिक पथभ्रष्टता को व्यक्त करता है, पर उस अप्रकट लक्ष्य को मुख्य पाठ में नहीं जोड़ता जिससे वे दूर हुए।
- source_word: אֶת יְהוּדָה
  choice: यहूदा को
  rationale: यहूदा यहाँ राज्य और उसके लोगों के लिए सामूहिक नाम है; सीधा नाम बनाए रखना स्रोत के सामूहिक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: וַיֶּזֶן को शारीरिक यौन अनैतिकता मानें या वाचा-संबंधी धार्मिक विश्वासघात
  choice: मुख्य पाठ में ‘व्यभिचार करवाया’ रखकर दोनों संकेत खुले रखे गए हैं।
  alternative: ‘वेश्यावृत्ति करवाई’ या ‘यहोवा के प्रति विश्वासघाती बनाया’
  rationale: ऊँचे पूजा-स्थलों का प्रसंग धार्मिक धर्मत्याग का प्रबल संकेत देता है, पर क्रिया का यौन अर्थ और वेश्यावृत्ति का रूपक भी वास्तविक है। किसी एक अर्थ को अनिवार्य बनाना स्रोत की अर्थ-व्याप्ति को संकुचित करेगा।
- issue: यहूदा को किससे दूर या किस मार्ग से भटकाया गया
  choice: मुख्य पाठ में लक्ष्य को अप्रकट रखते हुए ‘यहूदा को भटका दिया’
  alternative: ‘यहूदा को यहोवा से दूर कर दिया’
  rationale: प्रसंग यहोवा से दूर होने की ओर संकेत करता है, लेकिन इस पद के इब्रानी पाठ में ‘यहोवा से’ स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ स्रोत की संक्षिप्तता बनाए रखता है और स्पष्टतर अर्थ पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ऐतिहासिक-वर्णनात्मक रूप अपनाया गया है। ‘पूजा के ऊँचे स्थान’ सामान्य पाठक के लिए सांस्कृतिक पद को स्पष्ट करता है, जबकि ‘व्यभिचार’ स्रोत की जानबूझकर रखी गई यौन और धार्मिक द्विअर्थता को पाद-टिप्पणी सहित सुरक्षित रखता है।
