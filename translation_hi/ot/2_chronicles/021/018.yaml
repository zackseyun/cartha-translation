  text: וְ/אַחֲרֵ֖י כָּל זֹ֑את נְגָפ֨/וֹ יְהוָ֧ה בְּ/מֵעָ֛י/ו לָ/חֳלִ֖י לְ/אֵ֥ין מַרְפֵּֽא־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/018.yaml
  text: And after all this[a], Yahweh struck him in his intestines with an incurable disease.
translation:
  language: hi
  text: और इस सब के बाद याहवे ने उसकी आँतों में ऐसा रोग लगाया जिसका कोई इलाज नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַחֲרֵי כָּל זֹאת
  choice: और इस सब के बाद
  rationale: संयोजक וְ और काल-सूचक אַחֲרֵי को रखते हुए, כָּל זֹאת का स्वाभाविक सामूहिक संकेत पिछले सभी घटनाक्रम की ओर किया गया है।
- source_word: נְגָפ/וֹ
  choice: उसने ... लगाया
  rationale: क्रिया यहाँ यहोवा द्वारा सीधे पहुँचाई गई शारीरिक मार या विपत्ति बताती है। हिंदी में रोग के साथ ‘रोग लगाया’ स्वाभाविक है और दैवी कर्तृत्व स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण में रखा गया है।
- source_word: בְּ/מֵעָי/ו
  choice: उसकी आँतों में
  rationale: מֵעֶה यहाँ शरीर के भीतरी अंगों, विशेषकर आँतों, को दर्शाता है; ‘आँतों’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: לָ/חֳלִי
  choice: ऐसा रोग
  rationale: यह पदबंध उस शारीरिक दशा को बताता है जो प्रहार के फलस्वरूप हुई; ‘रोग’ गंभीर बीमारी के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְ/אֵין מַרְפֵּא
  choice: जिसका कोई इलाज नहीं था
  rationale: शाब्दिक भाव ‘जिसके लिए चंगाई/उपचार नहीं’ है। यह हिंदी रूप रोग की असाध्यता को स्पष्ट करता है और ‘इलाज’ तथा ‘चंगाई’ के बीच की अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
theological_decisions:
- issue: יְהוָה नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय ईश-नाम सीधे प्रयुक्त है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसका नामरूप बनाए रखता है, उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। मूल की सीधी दैवी क्रिया तथा रोग की असाध्यता दोनों सुरक्षित रखी गई हैं।
