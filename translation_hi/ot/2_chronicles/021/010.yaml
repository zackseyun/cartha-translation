  text: וַ/יִּפְשַׁ֨ע אֱד֜וֹם מִ/תַּ֣חַת יַד יְהוּדָ֗ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה אָ֣ז תִּפְשַׁ֥ע לִבְנָ֛ה בָּ/עֵ֥ת הַ/הִ֖יא מִ/תַּ֣חַת יָד֑/וֹ כִּ֣י עָזַ֔ב אֶת יְהוָ֖ה אֱלֹהֵ֥י אֲבֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/010.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. At that time Libnah also rebelled from under his hand, because he had forsaken Yahweh[c][b], the God of his fathers.
translation:
  language: hi
  text: इस प्रकार एदोम ने यहूदा के शासन के विरुद्ध विद्रोह किया और आज तक उससे अलग है।[a] उसी समय लिब्ना ने भी उसके शासन के विरुद्ध विद्रोह कर दिया,[b] क्योंकि उसने यहोवा, अपने पूर्वजों के परमेश्वर, को त्याग दिया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा के हाथ के नीचे से विद्रोह किया, आज के दिन तक।” “हाथ के नीचे से” शासन या अधिकार के अधीन होने का मुहावरा है; “आज तक” लेखक के समय तक बनी स्थिति को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “उसके हाथ के नीचे से।” यह इब्रानी मुहावरा उसके शासन या अधिकार से निकलने को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: “क्योंकि” से आरंभ होने वाला खंड यहोराम की विपत्तियों का सामान्य कारण बता सकता है, या विशेष रूप से लिब्ना के विद्रोह का।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע (פשע)
  choice: विद्रोह करके स्वतंत्र है / विद्रोह कर दिया
  rationale: राजनीतिक संदर्भ में क्रिया פשע अधीन सत्ता के विरुद्ध विद्रोह करके उससे अलग हो जाने को व्यक्त करती है। पहले खंड में परिणाम की आज तक निरंतरता स्पष्ट करने के लिए ‘विद्रोह करके ... स्वतंत्र है’ और दूसरे में स्वाभाविक हिंदी के लिए ‘विद्रोह कर दिया’ रखा गया है।
- source_word: מִתַּחַת יַד / מִתַּחַת יָדוֹ
  choice: हाथ के नीचे से
  rationale: इब्रानी मुहावरे का चित्र सुरक्षित रखा गया है; इसका अर्थ किसी के शासन या नियंत्रण से निकलना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: राज्य और गोत्र के नाम का हिंदी बाइबलीय रूप।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह सूत्र लेखक के समय तक स्थिति बने रहने को दर्शाता है; ‘आज तक’ इसका स्वाभाविक और संक्षिप्त हिंदी रूप है।
- source_word: אָז
  choice: उसी समय
  rationale: यह एदोम के विद्रोह से जुड़ी समयावधि को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לִבְנָה
  choice: लिब्ना
  rationale: स्थान-नाम का मानक देवनागरी लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कारणसूचक संबंध को स्पष्ट करता है, पर इसका दायरा वाक्य में अनिर्धारित रहने दिया गया है।
- source_word: עָזַב
  choice: त्याग दिया था
  rationale: यह परमेश्वर से विमुख होने की संबंधपरक और वाचा-संबंधी गंभीरता को आधुनिक, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: अपने पूर्वजों के परमेश्वर
  rationale: ‘पूर्वज’ आधुनिक हिंदी में אבות की वंशगत सामूहिकता को स्वाभाविक रूप से व्यक्त करता है और केवल निकटवर्ती पिताओं तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: विद्रोहों का कारण
  choice: कारणसूचक खंड को बिना अतिरिक्त व्याख्या के रखा गया है, जिससे यह यहोराम की विपत्तियों को व्यापक रूप से समझा सकता है।
  alternative: इसे केवल तुरंत पहले उल्लिखित लिब्ना के विद्रोह का कारण समझा जा सकता है।
  rationale: इब्रानी वाक्य-विन्यास कारण के दायरे को निर्णायक रूप से सीमित नहीं करता। इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित है और पादटिप्पणी दोनों संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। इब्रानी ‘हाथ के नीचे से’ का रूपक मुख्य पाठ में सुरक्षित है और पादटिप्पणी में अर्थ स्पष्ट किया गया है। ‘यहोवा’ हिंदी में प्रचलित दिव्य नाम के रूप में रखा गया है।
