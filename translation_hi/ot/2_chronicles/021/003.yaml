  text: וַ/יִּתֵּ֣ן לָ/הֶ֣ם אֲ֠בִי/הֶם מַתָּנ֨וֹת רַבּ֜וֹת לְ/כֶ֤סֶף וּ/לְ/זָהָב֙ וּ/לְ/מִגְדָּנ֔וֹת עִם עָרֵ֥י מְצֻר֖וֹת בִּֽ/יהוּדָ֑ה וְ/אֶת הַ/מַּמְלָכָ֛ה נָתַ֥ן לִֽ/יהוֹרָ֖ם כִּי ה֥וּא הַ/בְּכֽוֹר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/003.yaml
  text: Their father gave them many gifts of silver[a], gold, and precious things, along with fortified cities in Judah; but he gave the kingdom to Jehoram, because he was the firstborn.
translation:
  language: hi
  text: उनके पिता ने उन्हें चाँदी, सोना और बहुमूल्य वस्तुओं के बहुत-से उपहार दिए, और साथ ही यहूदा में किलेबंद नगर भी दिए; परन्तु राज्य यहोराम को दिया, क्योंकि वह पहलौठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן לָהֶם אֲבִיהֶם
  choice: उनके पिता ने उन्हें ... दिए
  rationale: हिब्रू कथात्मक क्रिया को स्वाभाविक हिन्दी भूतकाल में रखा गया है और कर्ता तथा प्राप्तकर्ताओं का संबंध स्पष्ट रखा गया है।
- source_word: מַתָּנוֹת רַבּוֹת
  choice: बहुत-से उपहार
  rationale: यह पद उपहारों की बड़ी संख्या बताता है; यह आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: לְכֶסֶף וּלְזָהָב
  choice: चाँदी, सोना
  rationale: यहाँ ל उपहारों के प्रकार या मूल्यवान सामग्री की श्रेणियाँ बताता है; हिन्दी में सूची के रूप में कहना स्वाभाविक है।
- source_word: וּלְמִגְדָּנוֹת
  choice: और बहुमूल्य वस्तुओं
  rationale: מִגְדָּנוֹת मूल्यवान या चुनिंदा वस्तुओं का व्यापक संकेत कर सकता है; राजकीय उपहारों के प्रसंग में यह अनुवाद अनावश्यक रूप से भोजन तक अर्थ सीमित नहीं करता।
- source_word: עִם עָרֵי מְצֻרוֹת בִּיהוּדָה
  choice: और साथ ही यहूदा में किलेबंद नगर भी
  rationale: עִם अतिरिक्त रूप से साथ दिए गए नगरों को दर्शाता है; מְצֻרוֹת का अर्थ सुरक्षा-प्रबंध से युक्त, अर्थात किलेबंद, है।
- source_word: וְאֶת הַמַּמְלָכָה נָתַן לִיהוֹרָם
  choice: परन्तु राज्य यहोराम को दिया
  rationale: औपचारिक संयोजक का प्रसंगगत कार्य भाइयों को मिले उपहारों और यहोराम को मिले राज्य के बीच विरोध दिखाना है; हिन्दी में ‘परन्तु’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: כִּי הוּא הַבְּכוֹר
  choice: क्योंकि वह पहलौठा था
  rationale: כִּי कारण बताता है और הַבְּכוֹר पारिवारिक तथा उत्तराधिकार-संबंधी प्रथम-जन्म की स्थिति को व्यक्त करता है।
