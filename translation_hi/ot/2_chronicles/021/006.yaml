source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָ֥יְתָה לּ֖/וֹ אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/006.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife; and he did what was evil in the eyes of Yahweh.
translation:
  language: hi
  text: वह इस्राएल के राजाओं के मार्ग पर चला, जैसा अहाब के घराने ने किया था, क्योंकि अहाब की बेटी उसकी पत्नी थी; और उसने वह किया जो याहवे की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: चाल पर चला
  rationale: यह इब्रानी मुहावरा जीवन के आचरण को दर्शाता है। ‘चाल पर चला’ मार्ग के रूपक को बनाए रखते हुए नैतिक अनुकरण का अर्थ व्यक्त करता है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: यह उत्तरी राज्य के राजाओं को उसके आचरण के नमूने के रूप में संदर्भित करने वाला सीधा संबंधवाचक पद है।
- source_word: כַּאֲשֶׁר עָשׂוּ בֵּית אַחְאָב
  choice: जैसा अहाब के घराने ने किया था
  rationale: ‘घराना’ राजवंश या शाही परिवार—दोनों संभावित अर्थों को स्वाभाविक हिन्दी में समेटता है; ‘किया था’ पूर्वस्थापित आचरण से तुलना व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उसके अहाब के घराने जैसा आचरण करने का कारण प्रस्तुत करता है।
- source_word: בַּת אַחְאָב הָיְתָה לּוֹ אִשָּׁה
  choice: अहाब की बेटी उसकी पत्नी थी
  rationale: यह वैवाहिक संबंध को सीधे व्यक्त करता है और यह संकेत नहीं देता कि विवाह उसी समय हुआ था।
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: संज्ञीकृत הָרַע को ‘वह ... जो बुरा था’ के रूप में व्यक्त किया गया है, जिससे मूल का निश्चित और मूल्यांकनात्मक भाव बना रहता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह सामान्य इब्रानी मूल्यांकन-सूत्र का स्वाभाविक हिन्दी रूप है और मूल के ‘आँखों में’ मुहावरे का अर्थ स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ शीर्षक ‘प्रभु’ के स्थान पर मूल चतुरक्षरीय ईश-नाम को दर्शाता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे केवल उपाधि में नहीं बदलता; ‘याहवे’ ध्वन्यात्मक विकल्प है, जबकि ‘प्रभु’ नाम को उपाधि से प्रतिस्थापित करता है।
- issue: अहाब की बेटी और उसके बुरे आचरण के बीच संबंध
  choice: ‘क्योंकि’ द्वारा मूल का कारणात्मक संबंध बनाए रखा गया
  alternative: सिर्फ घटनाओं को साथ रखना, बिना कारण स्पष्ट किए
  rationale: כִּי स्पष्टतः व्याख्यात्मक/कारणात्मक है। अनुवाद मूल के कथन को रखता है, पर पत्नी को उसके पाप का एकमात्र कारण बताने जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। वाक्य मूल के तीन भागों—आचरण का नमूना, वैवाहिक कारण, और यहोवा का नैतिक मूल्यांकन—को अर्धविराम सहित स्पष्ट रखता है। कोई पादटिप्पणी आवश्यक नहीं है।
