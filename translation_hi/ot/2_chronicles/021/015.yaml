  yaml_path: translation/ot/2_chronicles/021/015.yaml
  text: And you yourself will suffer many illnesses[a], with a disease of your bowels, until your bowels come out because of the disease[b], day after day.
translation:
  language: hi
  text: और तुम स्वयं अनेक रोगों से पीड़ित रहोगे, तुम्हारी आँतों के एक रोग से; यहाँ तक कि उस रोग के कारण तुम्हारी आँतें दिन-प्रतिदिन बाहर निकलती रहेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַתָּה
  choice: और तुम स्वयं
  rationale: स्वतंत्र सर्वनाम אַתָּה यहोराम की ओर सीधे और बलपूर्वक संकेत करता है; ‘तुम स्वयं’ इस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בָּחֳלָיִם רַבִּים
  choice: अनेक रोगों से पीड़ित रहोगे
  rationale: इब्रानी पद अनेक रोगों अथवा बहुत रोगग्रस्त होने की दशा व्यक्त करता है। यह रूप बहुवचन को बनाए रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: בְּמַחֲלֵה מֵעֶיךָ
  choice: तुम्हारी आँतों में एक रोग होगा
  rationale: בְּ को रोग की शारीरिक स्थिति/स्थान के रूप में व्यक्त किया गया है। מֵעֶה यहाँ संदर्भानुसार आँतों की ओर संकेत करता है, यद्यपि इसका अर्थ व्यापक रूप से भीतरी अंग भी हो सकता है।
- source_word: עַד יֵצְאוּ מֵעֶיךָ
  choice: यहाँ तक कि ... तुम्हारी आँतें बाहर निकल आएँगी
  rationale: עַד परिणाम की सीमा बताता है और יצא का सीधा अर्थ ‘बाहर निकलना’ है; मूल कथन की कठोरता को नरम नहीं किया गया।
- source_word: מִן הַחֹלִי
  choice: उस रोग के कारण
  rationale: यहाँ מִן परिणाम के कारण को व्यक्त करता है; ‘के कारण’ हिन्दी में इस कारणवाचक संबंध को स्पष्ट रखता है।
- source_word: יָמִים עַל יָמִים
  choice: दिन-प्रतिदिन
  rationale: शाब्दिक ‘दिनों पर दिन’ एक दीर्घ, लगातार चलने वाली प्रक्रिया का मुहावरा है। ‘दिन-प्रतिदिन’ उसका स्वाभाविक हिन्दी समतुल्य है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। रोग के भयावह परिणाम को मूल इब्रानी की तरह सीधे कहा गया है। יָמִים עַל יָמִים को स्वाभाविक हिन्दी क्रम में रोग की निरंतरता से जोड़ा गया है, जबकि पादटिप्पणी उसका शाब्दिक रूप सुरक्षित रखती है।
