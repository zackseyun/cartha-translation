source:
  edition: WLC
  text: וַ/תֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ מַלְכֵ֣י יִשְׂרָאֵ֔ל וַ/תַּזְנֶ֤ה אֶת יְהוּדָה֙ וְ/אֶת יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם כְּ/הַזְנ֖וֹת בֵּ֣ית אַחְאָ֑ב וְ/גַ֨ם אֶת אַחֶ֧י/ךָ בֵית אָבִ֛י/ךָ הַ/טּוֹבִ֥ים מִמְּ/ךָ֖ הָרָֽגְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/013.yaml
  text: but you have walked in the way of the kings of Israel[a], and have led Judah and the inhabitants of Jerusalem into sexual immorality, as the house of Ahab led them into sexual immorality; and you have also killed your brothers of your father’s house[b], who were better than you.
translation:
  language: hi
  text: परन्तु तुम इस्राएल के राजाओं के मार्ग पर चले हो और तुमने यहूदा और यरूशलेम के निवासियों से व्यभिचार कराया है[a], जैसा अहाब के घराने[b] ने कराया था; और तुमने अपने ही भाइयों को, जो तुम्हारे पिता के घराने के थे, मार डाला, जो तुमसे अच्छे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा और यरूशलेम के निवासियों से वेश्यावृत्ति कराई।” भविष्यद्वक्ताओं की भाषा में यह वाचा के प्रति बेवफ़ाई का रूपक है, जो प्रायः मूर्तिपूजा में प्रकट होती थी।
    reason: lexical_alternative
  - marker: b
    text: “अहाब का घराना” अहाब के राजवंश को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּלֶךְ בְּדֶרֶךְ
  choice: मार्ग पर चले हो
  rationale: इब्रानी आचरण-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है और अपनाई गई जीवन-पद्धति को व्यक्त करता है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: यहूदा और उत्तरी राज्य इस्राएल के बीच ऐतिहासिक भेद को स्पष्ट रखते हुए सीधा संबंधकारक अनुवाद।
- source_word: וַתַּזְנֶה אֶת יְהוּדָה וְאֶת יֹשְׁבֵי יְרוּשָׁלַם
  choice: तुमने यहूदा और यरूशलेम के निवासियों से व्यभिचार कराया है
  rationale: हिफ़ील रूप की कारकता और זנה के प्रबल वेश्यावृत्ति/व्यभिचार रूपक दोनों को सुरक्षित रखता है; सन्दर्भ में यह वाचा-विमुखता और मूर्तिपूजा की ओर संकेत करता है।
- source_word: כְּהַזְנוֹת בֵּית אַחְאָב
  choice: जैसा अहाब के घराने ने कराया था
  rationale: पहले खंड की कारक क्रिया को स्वाभाविक रूप से दोहराता है; निहित कर्म यहूदा और यरूशलेम के निवासी हैं।
- source_word: בֵּית אַחְאָב
  choice: अहाब का घराना
  rationale: यहाँ 'घराना' परिवार से आगे राजवंश का अर्थ भी सहज रूप से दे सकता है।
- source_word: אַחֶיךָ בֵית אָבִיךָ
  choice: अपने पिता के घराने के अपने भाइयों
  rationale: भाइयों को पैतृक राजघराने के सदस्यों के रूप में पहचानता है और इब्रानी संबंध को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: הַטּוֹבִים מִמְּךָ
  choice: जो तुमसे अच्छे थे
  rationale: तुलनात्मक संरचना का संक्षिप्त और सीधा अनुवाद; नैतिक अथवा व्यक्तिगत मूल्य की सम्भावित व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: הָרָגְתָּ
  choice: मार डाला
  rationale: क्रिया का सीधा अर्थ देता है; 'हत्या की' की अपेक्षा कानूनी अभिप्राय कम जोड़ता है।
theological_decisions:
- issue: राजकीय धर्मत्याग के सन्दर्भ में זנה का रूपक
  choice: मुख्य पाठ में 'व्यभिचार कराया' रखकर वेश्यावृत्ति/वैवाहिक बेवफ़ाई के भविष्यद्वक्ताई रूपक को बनाए रखना
  alternative: सीधे 'मूर्तिपूजा कराई' या 'विश्वासघाती बनाया' कहना
  rationale: प्रत्यक्ष व्याख्यात्मक अनुवाद रूपक को केवल मूर्तिपूजा तक सीमित कर देता। चुना गया पाठ मूल की यौन-वफ़ादारी की भाषा और वाचा-विमुखता का तनाव सुरक्षित रखता है; पादटिप्पणी अर्थगत संकेत स्पष्ट करती है।
- issue: הַטּוֹבִים מִמְּךָ में मूल्यांकन का स्वरूप
  choice: तुमसे अच्छे थे
  alternative: तुमसे अधिक योग्य थे
  rationale: मूल विशेषण व्यापक है और नैतिक अच्छाई, योग्यता या समग्र श्रेष्ठता में से किसी एक को स्पष्टतः निर्धारित नहीं करता; इसलिए सामान्य तुलनात्मक भाषा रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'मार्ग पर चले' जैसे परिचित बाइबलीय रूपक को रखा गया है। मुख्य पाठ में कारकता तथा व्यभिचार-रूपक सुरक्षित हैं; पादटिप्पणी उसके भविष्यद्वक्ताई अर्थ को बिना संप्रदायगत व्याख्या के स्पष्ट करती है।
