  to: 'तब उसके पास एलिय्याह नबी की ओर से एक पत्र आया, जिसमें लिखा था: “याहवे, तेरे पुरखे दाऊद का परमेश्वर, यों कहता है: इस कारण कि तू अपने पिता यहोशापात के मार्गों पर न[a] चला, न यहूदा के राजा आसा के मार्गों पर,”'
