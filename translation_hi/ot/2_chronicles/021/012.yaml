source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֵלָי/ו֙ מִכְתָּ֔ב מֵֽ/אֵלִיָּ֥הוּ הַ/נָּבִ֖יא לֵ/אמֹ֑ר כֹּ֣ה אָמַ֣ר יְהוָ֗ה אֱלֹהֵי֙ דָּוִ֣יד אָבִ֔י/ךָ תַּ֗חַת אֲשֶׁ֤ר לֹֽא הָלַ֨כְתָּ֙ בְּ/דַרְכֵי֙ יְהוֹשָׁפָ֣ט אָבִ֔י/ךָ וּ/בְ/דַרְכֵ֖י אָסָ֥א מֶֽלֶךְ יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/012.yaml
  text: 'Then a letter came to him from Elijah the prophet[a], saying, “Thus says Yahweh, the God of David your father: Because you have not walked in the ways of Jehoshaphat your father or in the ways of Asa king of Judah,”'
translation:
  language: hi
  text: 'तब उसके पास एलिय्याह नबी की ओर से एक पत्र आया, जिसमें लिखा था: “याहवे, तेरे पुरखे दाऊद का परमेश्वर, यों कहता है: इस कारण कि तू अपने पिता यहोशापात के मार्गों पर न[a] चला, न यहूदा के राजा आसा के मार्गों पर,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “और” है। नकारात्मक वाक्य में हिन्दी का “न … न” स्वाभाविक रूप से यह अर्थ व्यक्त करता है कि उसने न यहोशापात के मार्गों का अनुसरण किया, न आसा के मार्गों का।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו מִכְתָּב
  choice: तब उसके पास ... एक पत्र आया
  rationale: क्रिया के बाद आने वाला מִכְתָּב वाक्य का कर्ता है। यह अनुवाद इब्रानी वाक्य-विन्यास और कथात्मक वाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאֵלִיָּהוּ הַנָּבִיא
  choice: एलिय्याह नबी की ओर से
  rationale: מִן पत्र के स्रोत को बताता है। ‘की ओर से’ आधुनिक हिन्दी में पत्र के प्रेषक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: जिसमें लिखा था
  rationale: लिखित पत्र के सन्दर्भ में उद्धरण का परिचय देने के लिए यह हिन्दी में स्वाभाविक है और ‘कहते हुए’ की असहजता से बचता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का प्रामाणिक सन्देशवाहक-सूत्र है; वर्तमानकालीन हिन्दी इसकी जारी प्रामाणिकता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי דָּוִיד אָבִיךָ
  choice: तेरे पुरखे दाऊद का परमेश्वर
  rationale: אָבִיךָ यहाँ राजवंशीय पूर्वज को दर्शाता है, न कि तत्कालीन पिता को; ‘पुरखा’ इस अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: תַּחַת אֲשֶׁר
  choice: '[अगले कथन का कारणसूचक विन्यास]'
  rationale: यह वाक्य आगामी दण्ड का कारण प्रस्तुत करता है। हिन्दी में उद्धरण के भीतर सीधे ‘तू ... नहीं चला’ और आगे के पदों के साथ इसका कारणात्मक सम्बन्ध स्वाभाविक रूप से उभरता है; अलग से भारी ‘इस कारण कि’ जोड़ना आवश्यक नहीं।
- source_word: לֹא הָלַכְתָּ בְּדַרְכֵי
  choice: मार्गों पर नहीं चला
  rationale: ‘चलना’ और ‘मार्ग’ आचरण के लिए प्रयुक्त मूल इब्रानी रूपक को हिन्दी में भी स्पष्ट रूप से बनाए रखते हैं।
- source_word: יְהוֹשָׁפָט אָבִיךָ
  choice: अपने पिता यहोशापात
  rationale: यहाँ यहोशापात वास्तव में यहोराम का पिता है, इसलिए אָבִיךָ का सीधा अनुवाद ‘पिता’ उचित है।
- source_word: וּבְדַרְכֵי אָסָא מֶלֶךְ יְהוּדָה
  choice: और यहूदा के राजा आसा के मार्गों पर
  rationale: וּ का औपचारिक अर्थ ‘और’ सुरक्षित रखा गया है। हिन्दी में ‘न ... और ...’ दोनों आदर्शों का अनुसरण न करने का अर्थ दे सकता है; वैकल्पिक ‘या’ को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: दाऊद के लिए אָבִיךָ का सम्बन्ध
  choice: तेरे पुरखे दाऊद
  alternative: तेरे पिता दाऊद
  rationale: यहोराम के सन्दर्भ में दाऊद दूर का राजवंशीय पूर्वज है। इब्रानी אָב व्यापक अर्थ में ‘पूर्वज’ हो सकता है; ‘पुरखा’ हिन्दी पाठक को गलत तत्कालीन पितृत्व समझने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यों कहता है’ नबूवत के औपचारिक सूत्र को बनाए रखता है, जबकि ‘जिसमें लिखा था’ पत्र के प्रसंग में स्वाभाविक हिन्दी देता है। पद के अन्त में अल्पविराम रखा गया है क्योंकि वाक्य और उद्धरण अगले पद में जारी रहते हैं।
