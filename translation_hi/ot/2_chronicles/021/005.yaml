  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: बत्तीस वर्ष का था
  rationale: इब्रानी आयु-सूत्र में בֶּן के साथ संख्या और שָׁנָה व्यक्ति की आयु बताते हैं। आधुनिक हिन्दी में इसका स्वाभाविक रूप ‘बत्तीस वर्ष का था’ है।
- source_word: יְהוֹרָם
  choice: योराम
  rationale: इब्रानी नाम के पूर्ण रूप को प्रचलित हिन्दी बाइबलीय लिप्यंतरण ‘योराम’ से व्यक्त किया गया है।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: בְּ के साथ क्रिया के infinitive construct और सर्वनाम-प्रत्यय का प्रयोग राजसिंहासन पर बैठने का समय बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक कालवाचक अभिव्यक्ति है।
- source_word: וּשְׁמוֹנֶה שָׁנִים
  choice: आठ वर्ष तक
  rationale: यह पदबंध शासन की अवधि बताता है; हिन्दी में ‘तक’ अवधि को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ राजा के रूप में शासन करना है। ‘राज्य किया’ हिन्दी के राजकीय सूत्र में सटीक और प्रचलित है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग בִּ के साथ नगर का नाम उसके शासन के स्थान को सूचित करता है।
