  text: וַ/יְהִ֣י לְ/יָמִ֣ים מִ/יָּמִ֡ים וּ/כְ/עֵת֩ צֵ֨את הַ/קֵּ֜ץ לְ/יָמִ֣ים שְׁנַ֗יִם יָצְא֤וּ מֵעָי/ו֙ עִם חָלְי֔/וֹ וַ/יָּ֖מָת בְּ/תַחֲלֻאִ֣ים רָעִ֑ים וְ/לֹא עָ֨שׂוּ ל֥/וֹ עַמּ֛/וֹ שְׂרֵפָ֖ה כִּ/שְׂרֵפַ֥ת אֲבֹתָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/019.yaml
  text: And after some time[a], at the end of two years, his bowels came out because of his sickness, and he died of severe diseases[b]. And his people made no burning for him like the burning for his fathers.
translation:
  language: hi
  text: कुछ समय बीतने पर, दो वर्ष के अंत में, उसकी बीमारी के कारण उसकी आँतें बाहर निकल आईं, और वह भयंकर रोगों से मर गया। उसकी प्रजा ने उसके लिए वैसा दहन[a] नहीं किया, जैसा उसके पुरखों के लिए किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह संभवतः शवदाह नहीं, बल्कि मृत राजा के सम्मान में सुगंध-द्रव्य आदि जलाने की रस्म थी; इतिहास-वृत्तांत में अन्य राजाओं की अंत्येष्टि से तुलना करें।
    reason: cultural_note
lexical_decisions:
- source_word: לְיָמִים מִיָּמִים
  choice: कुछ समय बीतने पर
  rationale: यह इब्रानी मुहावरा अनिश्चित समय बीतने को दर्शाता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: וּכְעֵת צֵאת הַקֵּץ לְיָמִים שְׁנַיִם
  choice: जब दो वर्ष पूरे होने को आए
  rationale: यह रोग की लगभग दो वर्ष की अवधि के अंत को व्यक्त करता है और मूल के समय-संबंधी भाव को बनाए रखता है।
- source_word: מֵעָיו / יָצְאוּ מֵעָיו
  choice: उसकी आँतें बाहर निकल आईं
  rationale: מֵעָיו भीतर के अंगों, विशेषकर आँतों, को सूचित करता है और יצא का सामान्य अर्थ ‘बाहर निकलना’ है; मूल वर्णन की कठोरता को नरम नहीं किया गया।
- source_word: עִם חָלְיוֹ
  choice: उसकी बीमारी के कारण
  rationale: यद्यपि עִם का सामान्य अर्थ ‘के साथ’ है, यहाँ रोग से जुड़ी कारणात्मक अथवा परिस्थितिजन्य दशा अभिप्रेत है।
- source_word: בְּתַחֲלֻאִים רָעִים
  choice: भयंकर पीड़ाओं में
  rationale: बहुवचन अभिव्यक्ति अत्यंत कष्टदायक रोगावस्था को दर्शाती है; हिंदी में यह स्वाभाविक रहते हुए बहुवचन पीड़ा का भाव रखती है।
- source_word: שְׂרֵפָה / כִּשְׂרֵפַת אֲבֹתָיו
  choice: उसके सम्मान में वैसा अग्नि-संस्कार ... जैसा उसके पुरखों के सम्मान में
  rationale: ‘अग्नि-संस्कार’ यहाँ सम्मानार्थ किए गए दाह को संक्षेप में व्यक्त करता है; ‘सम्मान में’ जोड़ने से इसे शवदाह मानने की संभावना घटती है, जबकि पादटिप्पणी सांस्कृतिक अर्थ स्पष्ट करती है।
theological_decisions:
- issue: राजकीय अंत्येष्टि के प्रसंग में שְׂרֵפָה का स्वरूप
  choice: मृत राजा के सम्मान में किया जाने वाला समारोहिक दाह, संभवतः सुगंध-द्रव्यों का
  alternative: शवदाह अथवा कोई अनिर्दिष्ट दाह-विधि
  rationale: इतिहास-वृत्तांत का जोर उस राजकीय सम्मान पर है जो यहोराम को नहीं मिला, जबकि उसके पुरखों को मिला था। मूल शब्द दाह को सूचित करता है, पर प्रसंग शव जलाने को अनिवार्य नहीं बनाता; इसलिए पाठ और पादटिप्पणी मिलकर अर्थ और अनिश्चितता दोनों सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सहज शैली। वीभत्स चिकित्सकीय विवरण को स्पष्ट रखा गया है। ‘प्रजा’ राजकीय संदर्भ में עַמּוֹ के लिए चुना गया है।
