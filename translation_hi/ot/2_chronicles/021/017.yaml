  text: וַ/יַּעֲל֤וּ בִֽ/יהוּדָה֙ וַ/יִּבְקָע֔וּ/הָ וַ/יִּשְׁבּ֗וּ אֵ֤ת כָּל הָ/רְכוּשׁ֙ הַ/נִּמְצָ֣א לְ/בֵית הַ/מֶּ֔לֶךְ וְ/גַם בָּנָ֖י/ו וְ/נָשָׁ֑י/ו וְ/לֹ֤א נִשְׁאַר ל/וֹ֙ בֵּ֔ן כִּ֥י אִם יְהוֹאָחָ֖ז קְטֹ֥ן בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/017.yaml
  text: They came up against Judah and invaded it[a], and carried away all the possessions found in the king’s house, and also his sons and his wives, so that no son was left to him except Jehoahaz, the youngest of his sons.
translation:
  language: hi
  text: वे यहूदा पर चढ़ आए, उसमें सेंध लगाकर घुस गए, और राजमहल में मिली सारी संपत्ति लूट ले गए; उसके बेटों और पत्नियों को भी बंदी बनाकर ले गए। इस प्रकार यहोआहाज[a] को छोड़कर उसका कोई पुत्र नहीं बचा; वह उसके बेटों में सबसे छोटा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः यह वही व्यक्ति है जिसे अन्य स्थानों पर अहज्याह कहा गया है (तुलना करें 2 राजा 8:24–26; 2 इतिहास 22:1)।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ בִיהוּדָה
  choice: वे यहूदा पर चढ़ आए
  rationale: सैन्य प्रसंग में עלה और ב का यह संयोजन किसी क्षेत्र पर शत्रुतापूर्ण चढ़ाई को व्यक्त करता है। ‘पर चढ़ आए’ मूल बिंब और सैन्य आशय दोनों बनाए रखता है।
- source_word: וַיִּבְקָעוּהָ
  choice: और उसमें घुस गए
  rationale: בקע का मूल अर्थ चीरना या तोड़कर मार्ग बनाना है। यहाँ स्त्रीलिंग कर्म यहूदा है; ‘उसमें घुस गए’ भूमि की सीमाओं या सुरक्षा को भेदकर प्रवेश करने का स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּשְׁבּוּ
  choice: अपने साथ ले गए
  rationale: שבה सामान्यतः बंदी बनाकर ले जाने को दर्शाता है, पर यहाँ क्रिया संपत्ति और राजपरिवार के सदस्यों दोनों पर लागू है। ‘अपने साथ ले गए’ दोनों को समेटता है और लूट तथा बंदी बनाए जाने के संयुक्त प्रसंग को अनावश्यक रूप से विभाजित नहीं करता।
- source_word: כָּל הָרְכוּשׁ
  choice: सारी संपत्ति
  rationale: רכוש चल संपत्ति, माल या धन-सामग्री के लिए व्यापक शब्द है; ‘सारी संपत्ति’ सरल और पर्याप्त व्यापक है।
- source_word: הַנִּמְצָא לְבֵית הַמֶּלֶךְ
  choice: राजमहल में मिली
  rationale: נמצא का अर्थ ‘मिली/पाई गई’ है और בית המלך इस संदर्भ में राजा का भवन, अर्थात राजमहल, है। यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְגַם בָּנָיו וְנָשָׁיו
  choice: और उसके बेटों और पत्नियों को भी
  rationale: גם का योगात्मक बल ‘भी’ से स्पष्ट होता है। बहुवचन रूपों को सीधे बनाए रखा गया है।
- source_word: וְלֹא נִשְׁאַר לוֹ בֵּן כִּי אִם
  choice: को छोड़ उसका कोई बेटा न बचा
  rationale: निफ़अल נשאר बचे रहने को और כי אם एकमात्र अपवाद को व्यक्त करता है। यह हिन्दी संरचना परिणाम और अपवाद दोनों स्पष्ट करती है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: मुख्य पाठ में मसोरेटिक पाठ के नाम-रूप को रखा गया है; समानांतर वृत्तांतों में मिलने वाली पहचान पादटिप्पणी में दी गई है।
- source_word: קְטֹן בָּנָיו
  choice: उसके बेटों में सबसे छोटे
  rationale: पारिवारिक प्रसंग में קטן आयु की दृष्टि से सबसे छोटे पुत्र को दर्शाता है, न कि शारीरिक आकार को।
theological_decisions:
- issue: योराम के जीवित बचे पुत्र का नाम
  choice: मुख्य पाठ में मसोरेटिक पाठ के अनुसार ‘यहोआहाज’
  alternative: समानांतर अंशों के आधार पर ‘अहज्याह’
  rationale: यह मुख्यतः पाठगत और कथात्मक पहचान का प्रश्न है। मूल इब्रानी पाठ को प्राथमिकता देते हुए ‘यहोआहाज’ रखा गया है, जबकि पाठकों की पारदर्शिता के लिए वैकल्पिक पहचान पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘राजमहल’ प्रसंगानुसार בית המלך को स्पष्ट करता है; ‘अपने साथ ले गए’ संपत्ति और व्यक्तियों पर लागू एक ही इब्रानी क्रिया की व्यापकता बनाए रखता है।
