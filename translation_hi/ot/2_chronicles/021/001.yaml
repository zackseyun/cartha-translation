  yaml_path: translation/ot/2_chronicles/021/001.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David[b][a], and Jehoram his son reigned in his place.
translation:
  language: hi
  text: यहोशापात अपने पुरखाओं के साथ सो गया[a] और उसे दाऊद के नगर में उसके पुरखाओं के साथ दफ़नाया गया[b]। उसका पुत्र यहोराम उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, वह मर गया; शाब्दिक रूप से, “अपने पुरखाओं के साथ सो गया।”
    reason: lexical_alternative
  - marker: b
    text: “पुरखाओं के साथ” मृत्यु और दफ़न के द्वारा अपने पूर्वजों से जा मिलने के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-वृत्तांत में प्रयुक्त इब्रानी मुहावरे की स्मारकीय शैली को बनाए रखता है; आशय मृत्यु है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: वंशगत संदर्भ में यह स्वाभाविक आधुनिक हिन्दी है और पूर्वजों से जा मिलने के इब्रानी मुहावरे को बनाए रखता है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: मूल के कर्मवाच्य रूप का सहज हिन्दी अनुवाद।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: इस बाइबलीय स्थान-नाम का प्रचलित और स्रोत-संगत हिन्दी रूप।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के प्रसंग में हिन्दी में स्वाभाविक रूप से बताता है कि यहोराम ने राजपद ग्रहण किया; केवल 'राज्य किया' आरंभिक उत्तराधिकार को कम स्पष्ट करता।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार को निकटता से व्यक्त करता है, बिना अनावश्यक विरोध का भाव जोड़े।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: יְהוֹרָם
  choice: यहोराम
  rationale: यहाँ दिए पूर्ण इब्रानी नाम יְהוֹרָם का सीधा हिन्दी लिप्यंतरण।
