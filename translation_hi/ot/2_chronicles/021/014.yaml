id: 2CH.21.14
reference: 2 Chronicles 21:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִנֵּ֣ה יְהוָ֗ה נֹגֵ֛ף מַגֵּפָ֥ה גְדוֹלָ֖ה בְּ/עַמֶּ֑/ךָ וּ/בְ/בָנֶ֥י/ךָ וּ/בְ/נָשֶׁ֖י/ךָ וּ/בְ/כָל רְכוּשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/014.yaml
  text: Behold[a], Yahweh is striking your people, your sons, your wives, and all your possessions with a great plague.
translation:
  language: hi
  text: देखो[a], यहोवा तुम्हारी प्रजा, तुम्हारे बेटों, तुम्हारी पत्नियों और तुम्हारी सारी सम्पत्ति पर एक बड़ी विपत्ति डालने वाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, यहोवा तुम्हारी प्रजा, तुम्हारे बेटों, तुम्हारी पत्नियों और तुम्हारी सारी सम्पत्ति को एक बड़ी महामारी से मार रहा है/मारेगा।” इब्रानी कृदन्त आसन्न या सामान्य भविष्य भी व्यक्त कर सकता है, और यहाँ प्रयुक्त शब्द महामारी अथवा परमेश्वर द्वारा पहुँचाए गए भारी आघात का अर्थ दे सकता है।
    reason: कालगत और शब्दार्थगत विकल्पों को सुरक्षित रखना
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह भविष्यद्वाणी की गंभीर और ध्यान आकर्षित करने वाली घोषणा है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए उसका जोर बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ से व्यक्त किया गया है।
- source_word: נֹגֵף
  choice: डालने वाला है
  rationale: הִנֵּה के साथ आया कृदन्त आसन्न कार्य का बोध करा सकता है। ‘डालने वाला है’ निकट भविष्य की चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַגֵּפָה גְדוֹלָה
  choice: एक बड़ी विपत्ति
  rationale: מַגֵּפָה महामारी के साथ-साथ परमेश्वर द्वारा पहुँचाए गए प्रचण्ड आघात या विपत्ति को भी सूचित कर सकता है। व्यापक अर्थ बनाए रखने के लिए ‘बड़ी विपत्ति’ चुना गया है।
- source_word: בְּעַמֶּךָ
  choice: तुम्हारी प्रजा पर
  rationale: נגף के साथ ב प्रभावित लक्ष्य को चिह्नित करता है; राजा को संबोधन होने के कारण עַם के लिए ‘प्रजा’ सटीक और स्वाभाविक है।
- source_word: וּבְבָנֶיךָ
  choice: तुम्हारे बेटों
  rationale: בנים यहाँ पुल्लिंग बहुवचन है, इसलिए लिंग-सटीक अनुवाद ‘बेटों’ रखा गया है।
- source_word: וּבְנָשֶׁיךָ
  choice: तुम्हारी पत्नियों
  rationale: सम्बन्धसूचक बहुवचन के इस प्रसंग में נָשִׁים का अर्थ ‘पत्नियाँ’ है।
- source_word: וּבְכָל רְכוּשֶׁךָ
  choice: और तुम्हारी सारी सम्पत्ति
  rationale: רְכוּשׁ धन, माल और अधिकार में रखी वस्तुओं को समेटता है; ‘सारी सम्पत्ति’ כָל की समग्रता भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का निजी वाचा-नाम स्पष्ट रूप से है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को रखा गया है, न कि उसे किसी उपाधि से बदला गया है।
- issue: भविष्यद्वाणी में נֹגֵף कृदन्त का कालगत बल
  choice: आसन्न भविष्य—‘डालने वाला है’
  alternative: वर्तमान—‘डाल रहा है’; सामान्य भविष्य—‘डालेगा’
  rationale: הִנֵּה + कृदन्त निकट आती हुई कार्रवाई की सजीव घोषणा कर सकता है। चुना गया रूप तात्कालिकता रखता है, जबकि अन्य सम्भव कालगत अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: מַגֵּפָה का अर्थ-क्षेत्र
  choice: विपत्ति
  alternative: महामारी; भारी आघात
  rationale: शब्द केवल रोग-महामारी तक सीमित नहीं, बल्कि परमेश्वर द्वारा पहुँचाई गई कठोर मार या संकट भी हो सकता है। मुख्य पाठ में व्यापक ‘विपत्ति’ अनावश्यक संकीर्णता से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजा को संबोधन होने के कारण ‘लोगों’ के स्थान पर ‘प्रजा’ चुना गया है। ‘विपत्ति डालना’ हिन्दी में दैवी दण्ड की स्वाभाविक अभिव्यक्ति है और इब्रानी के व्यापक अर्थ को बनाए रखती है।
