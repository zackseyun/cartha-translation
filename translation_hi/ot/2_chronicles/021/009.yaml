  text: וַ/יַּֽעֲבֹ֤ר יְהוֹרָם֙ עִם שָׂרָ֔י/ו וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַ/יְהִי֙ קָ֣ם לַ֔יְלָה וַ/יַּ֗ךְ אֶת אֱדוֹם֙ הַ/סּוֹבֵ֣ב אֵלָ֔י/ו וְ/אֵ֖ת שָׂרֵ֥י הָ/רָֽכֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/009.yaml
  text: So Jehoram crossed over with his commanders and all the chariots with him. And it happened that he arose by night and struck Edom[a], which had surrounded him, and the commanders of the chariots.
translation:
  language: hi
  text: तब यहोराम अपने सेनापतियों और अपने साथ के सभी रथों को लेकर पार गया। वह रात में उठा और उसने एदोम पर, जो उसे घेरे हुए था, और रथों के सेनापतियों[a] पर प्रहार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रथ-दल के अधिकारियों।” हिब्रू पद विशेष रूप से रथ-सेना के अधिकारियों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: पार गया
  rationale: क्रिया עבר का मूल अर्थ ‘पार जाना’ है। सैन्य प्रसंग में भी यह ठोस गति को व्यक्त करती है, जबकि गंतव्य या युद्धनीति को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: שָׂרָיו
  choice: अपने सेनापतियों
  rationale: שַׂר शासक, अधिकारी या सैन्य प्रधान को सूचित कर सकता है। रथों और युद्ध के इस प्रसंग में ‘सेनापति’ स्वाभाविक है।
- source_word: וְכָל הָרֶכֶב עִמּוֹ
  choice: अपने साथ के सभी रथों को लेकर
  rationale: רֶכֶב यहाँ सामूहिक रूप से रथों अथवा रथ-दल को दर्शाता है। हिंदी में ‘सभी रथों’ से मूल बिंब स्पष्ट और सहज बना रहता है।
- source_word: וַיְהִי קָם לַיְלָה
  choice: रात को वह उठा
  rationale: हिब्रू कथात्मक संरचना को सहज आधुनिक हिंदी में प्रस्तुत किया गया है; इसमें रात के समय उठकर कार्रवाई करने का भाव बना रहता है।
- source_word: וַיַּךְ
  choice: प्रहार किया
  rationale: נכה का अर्थ व्यापक रूप से मारना या प्रहार करना है। ‘प्रहार किया’ युद्ध-संदर्भ के अनुकूल है और ‘हरा दिया’ जैसी परिणाम-संबंधी अतिरिक्त बात नहीं जोड़ता।
- source_word: אֱדוֹם הַסּוֹבֵב אֵלָיו
  choice: उसे चारों ओर से घेरने वाले एदोमियों
  rationale: אֱדוֹם राष्ट्र के लोगों के लिए सामूहिक नाम है; हिंदी में कर्ता के रूप में ‘एदोमियों’ अधिक स्वाभाविक है। סבב का कृदंत घेरकर आसपास होने का भाव देता है।
- source_word: שָׂרֵי הָרָכֶב
  choice: रथों के सेनापतियों
  rationale: यह पद रथों से संबद्ध सैन्य अधिकारियों को दर्शाता है। शाब्दिक संबंध को मुख्य पाठ में रखा गया है और ‘रथ-दल’ की सामूहिक व्याख्या पादटिप्पणी में दी गई है।
