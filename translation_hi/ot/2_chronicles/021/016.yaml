source:
  edition: WLC
  text: וַ/יָּ֨עַר יְהוָ֜ה עַל יְהוֹרָ֗ם אֵ֣ת ר֤וּחַ הַ/פְּלִשְׁתִּים֙ וְ/הָ֣/עַרְבִ֔ים אֲשֶׁ֖ר עַל יַ֥ד כּוּשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/016.yaml
  text: And Yahweh stirred up against Jehoram the spirit of the Philistines and of the Arabians who were near the Cushites[a][b][c].
translation:
  language: hi
  text: और याहवे ने यहोराम के विरुद्ध पलिश्तियों और अरबियों की भावना[a] को भड़का दिया, जो कूशियों के पास थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आत्मा।” इसका अर्थ यहाँ उनकी भीतरी प्रवृत्ति, मनोभाव, या उन्हें कार्रवाई के लिए प्रेरित करने वाली भावना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “कूशियों के पास” का अर्थ भौगोलिक रूप से उनके निकट हो सकता है; इब्रानी मुहावरे का शाब्दिक भाव “कूशियों की बगल में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַר
  choice: भड़का दिया
  rationale: यह क्रिया किसी को सक्रिय रूप से उठाने या शत्रुतापूर्ण कार्रवाई के लिए उकसाने का भाव व्यक्त करती है। ‘भड़का दिया’ आधुनिक हिन्दी में स्वाभाविक है और याहवे की सक्रिय भूमिका को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के चार इब्रानी अक्षरों का हिन्दी लिप्यंतरण किया गया है; इसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: עַל יְהוֹרָם
  choice: यहोराम के विरुद्ध
  rationale: शत्रुतापूर्ण कार्रवाई के संदर्भ में עַל का अर्थ ‘के विरुद्ध’ स्वाभाविक है।
- source_word: רוּחַ
  choice: मन
  rationale: רוּחַ का मूल अर्थ ‘आत्मा/वायु’ है और यहाँ यह लोगों को प्रेरित करने वाली भीतरी प्रवृत्ति या मनोभाव को दर्शाता है। मुख्य पाठ में ‘मन’ सहज हिन्दी देता है; मूल रूपक फुटनोट में सुरक्षित रखा गया है।
- source_word: הַפְּלִשְׁתִּים וְהָעַרְבִים
  choice: पलिश्तियों और उन अरबियों
  rationale: दोनों प्राचीन जाति-समूहों के प्रचलित हिन्दी नाम रखे गए हैं। ‘उन’ से स्पष्ट होता है कि आगे का संबंधवाचक वाक्य निकटतम समूह, अरबियों, का वर्णन करता है।
- source_word: אֲשֶׁר עַל יַד כּוּשִׁים
  choice: जो कूशियों के पास रहते थे
  rationale: עַל יַד का यहाँ सर्वाधिक स्वाभाविक अर्थ भौगोलिक निकटता, अर्थात ‘के पास’, है। ‘रहते थे’ हिन्दी में स्थान-संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: यहोराम के विरुद्ध शत्रु जातियों को उठाने में परमेश्वर की भूमिका
  choice: याहवे ने उनके मन को सक्रिय रूप से भड़का दिया।
  alternative: याहवे ने पहले से मौजूद शत्रुता को केवल प्रकट होने दिया।
  rationale: इब्रानी क्रिया इस कार्रवाई का कर्ता सीधे याहवे को बताती है। अनुवाद इसे केवल अनुमति के रूप में नरम नहीं करता, फिर भी पाठ से आगे जाकर इसका धर्मवैज्ञानिक स्पष्टीकरण नहीं देता।
- issue: רוּחַ का आशय
  choice: मुख्य पाठ में ‘मन’, और फुटनोट में शाब्दिक ‘आत्मा’।
  alternative: ‘शत्रुता’ या ‘विरोध की भावना’।
  rationale: ‘शत्रुता’ कहने से संदर्भगत आशय स्पष्ट होता, पर मूल शब्द की व्यापकता घट जाती। ‘मन’ प्रेरक आंतरिक दशा को स्वाभाविक हिन्दी में व्यक्त करता है और फुटनोट मूल रूपक को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की शुरुआत ‘और’ से करके इब्रानी कथानक-संबंध बनाए रखा गया है। ‘भड़का दिया’ दैवी सक्रियता को स्पष्ट करता है, जबकि ‘मन’ असहज शाब्दिक हिन्दी से बचते हुए רוּחַ के संदर्भगत भाव को व्यक्त करता है।
