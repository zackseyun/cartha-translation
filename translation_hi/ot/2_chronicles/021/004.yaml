  text: וַ/יָּ֨קָם יְהוֹרָ֜ם עַל מַמְלֶ֤כַת אָבִי/ו֙ וַ/יִּתְחַזַּ֔ק וַ/יַּהֲרֹ֥ג אֶת כָּל אֶחָ֖י/ו בֶּ/חָ֑רֶב וְ/גַ֖ם מִ/שָּׂרֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/004.yaml
  text: When Jehoram had risen over his father's kingdom and had strengthened himself[a], he killed all his brothers with the sword, and also some of the princes of Israel.
translation:
  language: hi
  text: जब यहोराम अपने पिता के राज्य पर अधिकार करके अपनी स्थिति मज़बूत कर चुका था[a], तब उसने अपने सभी भाइयों को तलवार से मार डाला और इस्राएल के कुछ अधिकारियों[b] को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ के अधिक निकट: “अपने आपको शक्तिशाली कर लिया।” यहाँ इसका भाव अपनी सत्ता या स्थिति सुदृढ़ करना भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: या “प्रधानों” अथवा “शासकों।” इब्रानी शब्द ऊँचे पद के शासकों या प्रशासकों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם עַל מַמְלֶכַת אָבִיו
  choice: अपने पिता के राज्य पर अधिकार करके
  rationale: राजकीय संदर्भ में קום עם עַל सत्ता सँभालने या राज्य पर अधिकार स्थापित करने को सूचित करता है। यह हिन्दी में स्वाभाविक है और עַל के अधिकार-संबंधी भाव को बनाए रखता है।
- source_word: וַיִּתְחַזַּק
  choice: अपनी स्थिति मज़बूत कर चुका
  rationale: חזק के हित्पएल रूप का आत्मवाचक भाव है। इस संदर्भ में यह सत्ता या स्थिति सुदृढ़ करने का संकेत देता है, पर इसे केवल सैनिक शक्ति तक सीमित नहीं करता।
- source_word: וַיַּהֲרֹג
  choice: मार डाला
  rationale: यह आधुनिक हिन्दी में जान से मारने का स्पष्ट और स्वाभाविक रूप है।
- source_word: אֶת כָּל אֶחָיו
  choice: अपने सभी भाइयों को
  rationale: इब्रानी पाठ पुरुष सहोदरों का स्पष्ट उल्लेख करता है, इसलिए ‘भाइयों’ को बनाए रखा गया है।
- source_word: בֶּחָרֶב
  choice: तलवार से
  rationale: करण कारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִשָּׂרֵי יִשְׂרָאֵל
  choice: इस्राएल के कुछ अधिकारियों
  rationale: מִן यहाँ अंशवाचक है, इसलिए ‘कुछ’ आवश्यक है। שָׂרִים उच्च पदस्थ अधिकारियों, शासकों या प्रधानों को सूचित कर सकता है; ‘अधिकारियों’ आधुनिक हिन्दी में व्यापक और सहज है।
theological_decisions:
- issue: ‘इस्राएल’ का संदर्भ
  choice: इस्राएल
  alternative: यहूदा; राष्ट्र
  rationale: इतिहासवृत्त में ‘इस्राएल’ का प्रयोग व्यापक वाचा-समुदाय या राजवंशीय अर्थ में हो सकता है। स्रोत के शब्द को बनाए रखकर ऐतिहासिक-धर्मवैचारिक तनाव को अनिर्णीत छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जब…तब’ वाक्य-रचना घटनाओं का संबंध सहज बनाती है; आरम्भ में ऐसा कोई अतिरिक्त काल-सूचक शब्द नहीं जोड़ा गया जिसका स्रोत में स्वतंत्र रूप से उल्लेख नहीं है।
