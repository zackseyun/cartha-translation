  edition: WLC
  text: וְ/לֽ/וֹ אַחִ֞ים בְּנֵ֣י יְהוֹשָׁפָ֗ט עֲזַרְיָ֤ה וִֽ/יחִיאֵל֙ וּ/זְכַרְיָ֣הוּ וַ/עֲזַרְיָ֔הוּ וּ/מִיכָאֵ֖ל וּ/שְׁפַטְיָ֑הוּ כָּל אֵ֕לֶּה בְּנֵ֥י יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/002.yaml
  text: 'And he had brothers[a], the sons of Jehoshaphat: Azariah, Jehiel, Zechariah, Azariahu, Michael, and Shephatiah[b]. All these were the sons of Jehoshaphat king of Israel.'
translation:
  language: hi
  text: 'और उसके भाई भी थे, जो यहोशापात के पुत्र थे: अजर्याह, यहीएल, जकर्याह, अजर्याहू[a], मीकाएल और शपत्याह। ये सभी इस्राएल के राजा[b] यहोशापात के पुत्र थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले नाम ‘अजर्याह’ और चौथे नाम ‘अजर्याहू’ की वर्तनी हिब्रू में अलग-अलग है; हिन्दी में भी यह अंतर रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘इस्राएल के राजा’ है। इतिहास में यहोशापात को सामान्यतः यहूदा का राजा माना जाता है; यहाँ ‘इस्राएल’ शब्द संभवतः व्यापक वाचा-संबंधी अर्थ में प्रयुक्त हुआ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֽ/וֹ אַחִים
  choice: और उसके भाई
  rationale: शाब्दिक रूप से ‘और उसके लिए भाई थे’ हिब्रू में संबंध या अधिकार व्यक्त करने वाला मुहावरा है। आधुनिक हिन्दी में ‘और उसके भाई’ स्वाभाविक है और कथात्मक संयोजक भी बनाए रखता है।
- source_word: בְּנֵי יְהוֹשָׁפָט
  choice: यहोशापात के पुत्र
  rationale: यह संबंधवाचक पद भाइयों को यहोशापात के पुत्रों के रूप में स्पष्ट करता है और वंशावली की औपचारिक शैली को बनाए रखता है।
- source_word: עֲזַרְיָה ... וַ/עֲזַרְיָהוּ
  choice: अजर्याह ... अजर्याहू
  rationale: हिब्रू में पहले और चौथे नाम की वर्तनी अलग है; हिन्दी रूपों में अंतिम ‘ऊ’ रखकर यह भेद सुरक्षित किया गया है।
- source_word: וִֽ/יחִיאֵל
  choice: यहीएल
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित और पहचानने योग्य हिन्दी लिप्यंतरण।
- source_word: וּ/זְכַרְיָהוּ
  choice: जकर्याह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप, जो सामान्य पाठक के लिए सहज है।
- source_word: וּ/מִיכָאֵל
  choice: मीकाएल
  rationale: हिब्रू उच्चारण और प्रचलित हिन्दी बाइबलीय रूप के निकट लिप्यंतरण।
- source_word: וּ/שְׁפַטְיָהוּ
  choice: शपत्याह
  rationale: व्यक्तिगत नाम का संक्षिप्त, प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: सूची का स्वाभाविक हिन्दी में समाहार करने वाला सीधा पद।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: मसोरेटिक हिब्रू पाठ स्पष्ट रूप से ‘इस्राएल के राजा’ कहता है; अनुवाद इसे ‘यहूदा के राजा’ करके समरस नहीं करता।
theological_decisions:
- issue: यहोशापात की उपाधि מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  alternative: यहूदा के राजा
  rationale: हिब्रू स्रोत में ‘इस्राएल’ है। ऐतिहासिक रूप से यहोशापात को सामान्यतः यहूदा का राजा कहा जाता है, पर यहाँ ‘यहूदा’ रखना स्रोत-पाठ का व्याख्यात्मक सामंजस्यकरण होता। ‘इस्राएल’ रखने से इतिहासकार की व्यापक वाचागत या सामुदायिक शब्दावली की संभावना खुली रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों में प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं, पर जहाँ हिब्रू पाठ दो समान नामों की वर्तनी में भेद करता है वहाँ वह भेद सुरक्षित है। डैश से ‘यहोशापात के पुत्र’ को स्पष्टीकरण के रूप में स्वाभाविक ढंग से जोड़ा गया है।
