    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: यह इब्रानी काल-सूचक मुहावरा यहोराम के शासनकाल को दर्शाता है; यह रूप मूल अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: פָּשַׁע
  choice: विद्रोह कर दिया
  rationale: राजनीतिक प्रसंग में क्रिया का अर्थ यहूदा के अधीन शासन से बगावत करके अलग होना है, न कि सामान्य नैतिक अपराध।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: स्थान और जाति के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: מִתַּחַת יַד יְהוּדָה
  choice: यहूदा के हाथ के नीचे से
  rationale: मुख्य पाठ में इब्रानी का सजीव मुहावरा सुरक्षित रखा गया है; इसका आशय यहूदा के अधिकार या नियंत्रण से बाहर होना है।
- source_word: וַיַּמְלִיכוּ
  choice: राजा बना लिया
  rationale: हिफ़ील रूप का अर्थ किसी को राजा के रूप में स्थापित करना है; हिन्दी में ‘राजा बना लिया’ स्वाभाविक और स्पष्ट है।
- source_word: עֲלֵיהֶם
  choice: अपने ऊपर
  rationale: तीसरे पुरुष बहुवचन प्रत्यय का आशय है कि एदोमियों ने स्वयं पर शासन करने के लिए राजा स्थापित किया।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: इब्रानी में संज्ञा अनिश्चित है; हिन्दी में ‘एक राजा’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
