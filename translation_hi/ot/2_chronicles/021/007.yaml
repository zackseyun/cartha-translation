  text: וְ/לֹא אָבָ֣ה יְהוָ֗ה לְ/הַשְׁחִית֙ אֶת בֵּ֣ית דָּוִ֔יד לְמַ֣עַן הַ/בְּרִ֔ית אֲשֶׁ֥ר כָּרַ֖ת לְ/דָוִ֑יד וְ/כַ/אֲשֶׁ֣ר אָמַ֗ר לָ/תֵ֨ת ל֥/וֹ נִ֛יר וּ/לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/021/007.yaml
  text: Yet Yahweh was not willing to destroy the house of David[a], because of the covenant that he had made with David[c][b], and as he had said that he would give to him and to his sons a lamp for all days.
translation:
  language: hi
  text: फिर भी यहोवा दाऊद के घराने को नष्ट करने को इच्छुक न था, क्योंकि उसने दाऊद के साथ वाचा बाँधी थी; और जैसा उसने कहा था, वह दाऊद और उसके पुत्रों को सब दिनों तक एक दीपक[a][b] देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दीपक’ दाऊद के वंश या उसके शासन के बने रहने का रूपक है। इसे ‘ज्योति’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में शाब्दिक अर्थ ‘सब दिनों तक’ है; इसका अनुवाद ‘सदा’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: फिर भी ... तैयार न हुआ
  rationale: אָבָה इच्छा या सहमति को व्यक्त करता है। प्रसंग में וְ को हल्के विरोध के रूप में ‘फिर भी’ कहना स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को सुरक्षित रखता है।
- source_word: לְהַשְׁחִית אֶת בֵּית דָּוִיד
  choice: दाऊद के घराने को नष्ट करने
  rationale: ‘घराना’ בֵּית के वंशगत अर्थ को स्पष्ट करते हुए दाऊदी राजवंश की बाइबिलीय अभिव्यक्ति बनाए रखता है।
- source_word: הַבְּרִית אֲשֶׁר כָּרַת לְדָוִיד
  choice: उसने दाऊद के साथ वाचा बाँधी थी
  rationale: ‘वाचा बाँधना’ हिन्दी में כרת ברית का स्थापित और अर्थपूर्ण मुहावरा है; ‘के साथ’ वाचागत संबंध बताता है।
- source_word: וְכַאֲשֶׁר אָמַר לָתֵת
  choice: और कहा था कि वह ... देगा
  rationale: हिब्रू के पूर्व कथन और देने की प्रतिज्ञात्मक विषयवस्तु को सहज हिन्दी वाक्य में रखता है, बिना मुख्य पाठ में ‘प्रतिज्ञा’ शब्द जोड़ने के।
- source_word: לוֹ נִיר וּלְבָנָיו
  choice: दाऊद और उसके पुत्रों को ... एक दीपक
  rationale: לוֹ का संदर्भ दाऊद के रूप में स्पष्ट किया गया है; נִיר का राजवंशीय रूपक ‘दीपक’ के रूप में सुरक्षित है।
- source_word: כָּל הַיָּמִים
  choice: सब दिनों तक
  rationale: हिब्रू अभिव्यक्ति ‘सभी दिन’ को निकटता से रखता है और ‘सदा’ या ‘सर्वदा’ द्वारा संभावित अर्थ को अधिक निर्णायक नहीं बनाता।
theological_decisions:
- issue: दाऊदी वाचा में נִיר का राजवंशीय रूपक
  choice: दीपक
  alternative: ज्योति; राजवंश
  rationale: ‘दीपक’ मूल रूपक और दाऊद के वंश तथा शासन की निरंतरता से जुड़े अंतर्पाठीय संकेत को बनाए रखता है; ‘राजवंश’ अर्थ खोल देता, जबकि ‘ज्योति’ वस्तुगत रूपक को कुछ धुंधला करती।
- issue: כָּל הַיָּמִים की कालगत सीमा
  choice: सब दिनों तक
  alternative: सदा; सर्वदा
  rationale: यह मूल हिब्रू की अभिव्यक्ति को बनाए रखकर उसके दीर्घकालिक या अनंत आशय को व्याख्या द्वारा पूरी तरह तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना,’ ‘वाचा बाँधना’ और ‘दीपक’ जैसे बाइबिलीय पद मूल के वंशगत तथा वाचागत स्वर को सुरक्षित रखते हैं।
