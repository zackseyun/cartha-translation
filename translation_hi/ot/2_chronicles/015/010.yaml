  text: आसा के शासनकाल के पंद्रहवें वर्ष के तीसरे महीने में वे यरूशलेम में इकट्ठे हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: इसलिए वे ... इकट्ठे हुए
  rationale: קבץ के निफ़अल रूप में सामूहिक रूप से एकत्र होने का भाव है। कथा-संदर्भ में וַ का परिणामसूचक संबंध स्वाभाविक हिन्दी में ‘इसलिए’ से व्यक्त किया गया है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: तीसरे महीने में
  rationale: निश्चित क्रमवाचक काल-सूचना का निकट और स्वाभाविक हिन्दी रूप।
- source_word: לִשְׁנַת חֲמֵשׁ עֶשְׂרֵה
  choice: पंद्रहवें वर्ष के
  rationale: राजकीय काल-गणना में לְ का मुहावरेदार हिन्दी रूप; अगले पद ‘शासन’ के साथ मिलकर ‘शासन के पंद्रहवें वर्ष’ बनता है।
- source_word: לְמַלְכוּת אָסָא
  choice: आसा के शासन
  rationale: מַלְכוּת यहाँ राजत्व की अमूर्त धारणा से अधिक शासनकाल-सूचक सूत्र का भाग है; ‘शासन’ सामान्य पाठक के लिए स्पष्ट और संक्षिप्त है।
