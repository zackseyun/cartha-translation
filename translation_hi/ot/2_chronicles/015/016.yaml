source:
  edition: WLC
  text: וְ/גַֽם מַעֲכָ֞ה אֵ֣ם אָסָ֣א הַ/מֶּ֗לֶךְ הֱסִירָ/הּ֙ מִ/גְּבִירָ֔ה אֲשֶׁר עָשְׂתָ֥ה לַ/אֲשֵׁרָ֖ה מִפְלָ֑צֶת וַ/יִּכְרֹ֤ת אָסָא֙ אֶת מִפְלַצְתָּ֔/הּ וַ/יָּ֕דֶק וַ/יִּשְׂרֹ֖ף בְּ/נַ֥חַל קִדְרֽוֹן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/016.yaml
  text: Even Maacah[a], the mother of King Asa, he removed from being queen mother, because she had made a dreadful image for Asherah; and Asa cut down her dreadful image, crushed it[c][b], and burned it in the Kidron Valley.
translation:
  language: hi
  text: राजा आसा ने अपनी माता माका को भी राजमाता के पद से हटा दिया, क्योंकि उसने अशेरा के लिए एक घिनौनी मूर्ति[a] बनाई थी। आसा ने उसकी उस घिनौनी मूर्ति को काट डाला, चूर-चूर कर दिया और किद्रोन की घाटी[b] में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक भयावह वस्तु” अथवा “एक घृणित प्रतिमा।” इब्रानी शब्द किसी घृणा या भय उत्पन्न करने वाली उपासना-वस्तु को दर्शाता है। “अशेरा” देवी अथवा उससे जुड़े उपासना-चिह्न की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “किद्रोन के नाले में।” इब्रानी शब्द घाटी, बरसाती नाले या जलधारा के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह पूर्ववर्ती सुधारों में एक और, विशेष रूप से उल्लेखनीय कार्य जोड़ता है; ‘भी’ हिन्दी में स्वाभाविक रूप से इस बल को व्यक्त करता है।
- source_word: מַעֲכָה
  choice: माका
  rationale: इब्रानी व्यक्तिगत नाम का सरल देवनागरी लिप्यंतरण।
- source_word: אֵם אָסָא הַמֶּלֶךְ
  choice: राजा आसा की माता
  rationale: सम्बन्ध और राजकीय पहचान को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: הֱסִירָהּ מִגְּבִירָה
  choice: राजमाता के पद से हटा दिया
  rationale: राजदरबार के संदर्भ में גְּבִירָה मान्य राजकीय पद या प्रतिष्ठा को सूचित करता है; ‘पद से’ हटाने की क्रिया को स्पष्ट करता है।
- source_word: אֲשֶׁר עָשְׂתָה לַאֲשֵׁרָה
  choice: क्योंकि उसने अशेरा के लिए ... बनाई थी
  rationale: उपवाक्य हटाए जाने का कारण देता है; ‘अशेरा के लिए’ देवी और उससे जुड़े उपासना-चिह्न के बीच मूल पाठ की सम्भावित अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִפְלָצֶת
  choice: एक घिनौनी मूर्ति
  rationale: शब्द भयावह या अत्यन्त घृणित उपासना-वस्तु का बोध कराता है। ‘मूर्ति’ प्रसंग से पूरित है, क्योंकि उसे काटा, चूर किया और जलाया जाता है।
- source_word: וַיִּכְרֹת
  choice: काट डाला
  rationale: क्रिया का अर्थ काटना या काट गिराना है; निर्मित उपासना-वस्तु के लिए यह स्वाभाविक हिन्दी है।
- source_word: וַיָּדֶק
  choice: चूर-चूर कर दिया
  rationale: क्रिया वस्तु को बहुत छोटे टुकड़ों या चूर्ण में बदलने का अर्थ देती है।
- source_word: וַיִּשְׂרֹף
  choice: जला दिया
  rationale: जलाने की क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּנַחַל קִדְרוֹן
  choice: किद्रोन की घाटी में
  rationale: נחל यहाँ घाटी, नाला या मौसमी जलधारा का क्षेत्र हो सकता है; ‘घाटी’ आधुनिक पाठक के लिए भौगोलिक रूप से सहज है और विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֲשֵׁרָה का आशय
  choice: अशेरा
  alternative: अशेरा-खम्भा; उपवन
  rationale: नाम को बनाए रखने से प्राचीन कनानी उपासना-संदर्भ सुरक्षित रहता है और शब्द को केवल देवी या केवल किसी विशिष्ट प्रकार के प्रतीक तक सीमित नहीं किया जाता।
- issue: גְּבִירָה की राजकीय उपाधि
  choice: राजमाता के पद
  alternative: प्रधान महिला; स्वामिनी
  rationale: यहूदा के राजकीय संदर्भ में यह राजा की माता अथवा उस भूमिका में कार्यरत वरिष्ठ राजपरिवार की महिला की मान्य स्थिति को सबसे स्वाभाविक रूप से व्यक्त करता है।
- issue: מִפְלָצֶת का स्वरूप
  choice: घिनौनी मूर्ति
  alternative: भयावह वस्तु; घृणित प्रतिमा
  rationale: मूल शब्द उपासना-वस्तु के प्रति भय या घृणा का भाव रखता है, पर उसके ठीक स्वरूप को नहीं बताता; इसलिए विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। ‘राजमाता के पद’ ऐतिहासिक भूमिका स्पष्ट करता है; ‘अशेरा’ का लिप्यंतरण प्राचीन धार्मिक संदर्भ और मूल की अस्पष्टता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
