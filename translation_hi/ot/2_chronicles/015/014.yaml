  yaml_path: translation/ot/2_chronicles/015/014.yaml
  text: And they swore to Yahweh with a loud voice[a], with shouting, and with trumpets and horns.
translation:
  language: hi
  text: उन्होंने ऊँचे स्वर में, उद्घोष के साथ, तुरहियों और शोफ़ारों[a] के साथ यहोवा के प्रति शपथ ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘शोफ़ार’; सामान्यतः मेढ़े के सींग से बना फूँक-वाद्य। मूल पाठ इन्हें ठीक पहले उल्लिखित ‘तुरहियों’ से अलग बताता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבְעוּ
  choice: उन्होंने ... शपथ खाई
  rationale: निफ़अल रूप यहाँ शपथ लेने का अर्थ देता है। ‘शपथ खाई’ स्वाभाविक आधुनिक हिन्दी है और वाचा-संबंधी औपचारिकता बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: לְ उस व्यक्ति को चिह्नित करता है जिसके प्रति शपथ ली गई। हिन्दी में ‘यहोवा की शपथ खाई’ लक्ष्य-संबंध को स्वाभाविक रूप से व्यक्त करता है और दिव्य नाम को नाम के रूप में रखता है।
- source_word: בְּקוֹל גָּדוֹל
  choice: ऊँची आवाज़ से
  rationale: यह पदबंध प्रबल, सुनाई देने वाली सामूहिक वाणी को दर्शाता है; शाब्दिक ‘बड़ी आवाज़’ की अपेक्षा यह स्वाभाविक हिन्दी है।
- source_word: וּבִתְרוּעָה
  choice: जयघोष करते हुए
  rationale: תְּרוּעָה ऊँचे सामूहिक उद्घोष या हर्षध्वनि को दर्शा सकता है। प्रसंग में यह युद्धघोष नहीं बल्कि सार्वजनिक, उत्सवपूर्ण अभिपुष्टि है; ‘जयघोष’ अर्थ को बिना अत्यधिक विस्तार के व्यक्त करता है।
- source_word: וּבַחֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: חֲצֹצְרוֹת सीधे धातु के धार्मिक वाद्य थे। ‘तुरही’ हिन्दी में इनके लिए स्पष्ट और प्रचलित शब्द है।
- source_word: וּבְשׁוֹפָרוֹת
  choice: नरसिंगे
  rationale: שׁוֹפָרוֹת को חֲצֹצְרוֹת से अलग वाद्य के रूप में रखना आवश्यक है। ‘नरसिंगा’ सींग-जैसे फूँक-वाद्य का सहज हिन्दी नाम है; पादटिप्पणी मूल शब्द की अधिक सटीक सांस्कृतिक पहचान बताती है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे उपाधि ‘प्रभु’ से अलग नाम के रूप में सुरक्षित रखता है; स्वरांकन की ऐतिहासिक अनिश्चितता बनी रहती है।
- issue: תְּרוּעָה का भाव
  choice: जयघोष
  alternative: ऊँचा उद्घोष
  rationale: सभा, शपथ और वाद्यों का प्रसंग उत्सवपूर्ण सामूहिक उद्घोष की ओर संकेत करता है। फिर भी मूल शब्द अपने आप में युद्धघोष या केवल हर्ष का स्पष्ट निर्धारण नहीं करता; ‘जयघोष’ प्रसंगानुकूल है, जबकि विकल्प अधिक तटस्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक उपासना के अनुकूल शैली। वाक्य को हिन्दी में स्वाभाविक बनाने के लिए वाद्य बजाने का निहित भाव स्पष्ट किया गया है; सभी ध्वनियाँ शपथ लेने की सामूहिक रीति से जुड़ी हैं।
