  yaml_path: translation/ot/2_chronicles/015/011.yaml
  text: 'On that day they sacrificed to Yahweh from the spoil they had brought: seven hundred cattle and seven thousand sheep[a][b].'
translation:
  language: hi
  text: उस दिन उन्होंने अपनी लाई हुई लूट में से यहोवा के लिए बलि चढ़ाई—सात सौ गाय-बैल और सात हज़ार भेड़-बकरियाँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: उन्होंने ... बलि चढ़ाई
  rationale: זבח यहाँ उपासना-संबंधी पशुबलि चढ़ाने को दर्शाता है; यह हिंदी में स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל बलि के प्राप्तकर्ता को सूचित करता है और יהוה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह आधुनिक हिंदी में इस समय-सूचक वाक्यांश का सीधा और स्वाभाविक रूप है।
- source_word: מִן הַשָּׁלָל הֵבִיאוּ
  choice: अपनी लाई हुई लूट में से
  rationale: שׁלל युद्ध में प्राप्त लूट को दर्शाता है और הֵבִיאוּ बताता है कि वे उसे पहले ला चुके थे; कृदंत-रचना हिंदी में काल-संबंध को सहज रूप से व्यक्त करती है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: यह सामूहिक संज्ञा गोवंश को दर्शाती है; 'गाय-बैल' केवल बैलों तक अर्थ को सीमित किए बिना सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְצֹאן
  choice: और ... भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू झुंड-पशुओं की सामूहिक संज्ञा है, जिसमें भेड़ और बकरियाँ दोनों आ सकती हैं; इसलिए व्यापक मूल अर्थ मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। हिंदी में परिचित नाम-रूप 'यहोवा' नाम और उपाधि के भेद को बनाए रखता है; 'प्रभु' मूल के नाम को उपाधि में बदल देता, जबकि 'याहवे' अधिक निकट लिप्यंतरण है पर सामान्य हिंदी पाठकों के लिए अपेक्षाकृत कम परिचित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। मूल की शब्द-क्रमगत कठोरता से बचते हुए युद्ध-लूट, बलि और पशु-वर्गों का अर्थ स्पष्ट रखा गया है।
