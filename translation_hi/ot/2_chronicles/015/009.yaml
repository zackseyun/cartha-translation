base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/009.yaml
  text: And he gathered all Judah and Benjamin[a], and the sojourners with them from Ephraim, Manasseh, and Simeon, because many from Israel had fallen to him when they saw that Yahweh his God was with him.
translation:
  language: hi
  text: और उसने पूरे यहूदा और बिन्यामीन को, तथा एप्रैम, मनश्शे और शिमोन से आए हुए उनके साथ रहनेवाले प्रवासियों को इकट्ठा किया; क्योंकि इस्राएल से बहुत-से लोग उसका साथ देने आ मिले थे[a], जब उन्होंने देखा कि यहोवा उसका परमेश्वर उसके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी ओर आ गए थे”; अधिक शाब्दिक रूप में, “उस पर गिरे थे।” यह इब्रानी मुहावरा आसा के पक्ष में आकर उसके प्रति निष्ठा बदलने को दर्शाता है।
    reason: नָפְלוּ עָלָיו के राजनीतिक निष्ठा-परिवर्तन वाले मुहावरे का वैकल्पिक और अधिक शाब्दिक रूप देना।
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: उसने ... इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ लोगों को एकत्र करना है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: כָּל יְהוּדָה וּבִנְיָמִן
  choice: पूरे यहूदा और बिन्यामीन को
  rationale: गोत्रों अथवा क्षेत्रों के नाम यहाँ उनके लोगों के लिए लाक्षणिक रूप से प्रयुक्त हैं; संक्षिप्त रूप मूल की शैली बनाए रखता है।
- source_word: וְהַגָּרִים עִמָּהֶם
  choice: उनके बीच रहने आए ... लोगों को
  rationale: גרים ऐसे गैर-स्थानीय निवासियों को दर्शाता है जो उनके साथ रह रहे थे। सन्दर्भ में ये उत्तरी गोत्रों से आए लोग हैं; यह अभिव्यक्ति आधुनिक हिन्दी में 'परदेशी' से अधिक स्पष्ट है।
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה וּמִשִּׁמְעוֹן
  choice: एप्रैम, मनश्शे और शिमोन के लोगों को
  rationale: מִן उनके उद्गम को बताता है; हिन्दी में 'के लोग' के साथ 'रहने आए' इस स्रोत-भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָפְלוּ עָלָיו
  choice: उसका साथ देने आ मिले थे
  rationale: राजनीतिक संदर्भ में यह मुहावरा पक्ष अथवा निष्ठा बदलकर किसी से जा मिलने का अर्थ देता है। चुना हुआ रूप अर्थ स्पष्ट करता है, जबकि पादटिप्पणी उसका अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: מִיִּשְׂרָאֵל לָרֹב
  choice: इस्राएल से बहुत-से लोग
  rationale: לָרֹב बड़ी संख्या सूचित करता है; यह हिन्दी में संक्षिप्त और सहज है।
- source_word: בִּרְאֹתָם
  choice: जब उन्होंने देखा
  rationale: ב के साथ infinitive construct यहाँ समय और परिस्थिति व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप 'यहोवा' व्यक्तिगत दिव्य नाम को उपाधि से अलग रखते हुए स्पष्ट रूप से प्रस्तुत करता है।
- source_word: אֱלֹהָיו עִמּוֹ
  choice: उसका परमेश्वर यहोवा उसके साथ है
  rationale: यह मूल के दिव्य उपस्थिति और सहायता के कथन को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों रूप चतुरक्षरीय दिव्य नाम को दर्शाते हैं। आधुनिक हिन्दी पाठकों में व्यापक पहचान और गरिमापूर्ण बाइबलीय प्रयोग के कारण 'यहोवा' चुना गया, न कि इसे केवल 'प्रभु' जैसी उपाधि से बदला गया।
- issue: נָפְלוּ עָלָיו में निष्ठा-परिवर्तन
  choice: उसका साथ देने आ मिले थे
  alternative: उसकी ओर आ गए थे / शाब्दिक रूप से उसके ऊपर गिर पड़े थे
  rationale: सन्दर्भ आसा के प्रति राजनीतिक-धार्मिक निष्ठा बदलने का है। मुख्य पाठ अर्थ को स्वाभाविक हिन्दी में देता है और पादटिप्पणी मुहावरे की भाषिक अनिश्चितता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। जनसमूह के लिए गोत्र-नामों का मूल-सदृश संक्षिप्त प्रयोग रखा गया है; केवल גרים को संदर्भानुकूल स्पष्ट किया गया है।
