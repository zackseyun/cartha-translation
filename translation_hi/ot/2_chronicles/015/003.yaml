id: 2CH.15.3
reference: 2 Chronicles 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָמִ֥ים רַבִּ֖ים לְ/יִשְׂרָאֵ֑ל לְ/לֹ֣א אֱלֹהֵ֣י אֱמֶ֗ת וּ/לְ/לֹ֛א כֹּהֵ֥ן מוֹרֶ֖ה וּ/לְ/לֹ֥א תוֹרָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/003.yaml
  text: For many days Israel was without the true God[a], without a teaching priest[b], and without the law.
translation:
  language: hi
  text: बहुत दिनों तक इस्राएल सच्चे परमेश्वर[a] के बिना, शिक्षा देने वाले याजक के बिना और शिक्षा[b] के बिना रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “सत्य के परमेश्वर”; इसका अर्थ “विश्वासयोग्य परमेश्वर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “व्यवस्था”; इब्रानी शब्द तोराह का अर्थ प्रसंग के अनुसार “शिक्षा,” “उपदेश” या “व्यवस्था” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह पदबंध लम्बी अवधि बताता है। आरम्भिक וְ को हिन्दी में अलग से ‘और’ कहना आवश्यक नहीं, क्योंकि यहाँ वह कथन को पिछले प्रसंग से जोड़ता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल ... रहा
  rationale: यहाँ לְ किसी अवस्था या सम्बन्ध को सूचित करता है। हिन्दी में कर्ता और सहायक क्रिया जोड़कर इस भाव को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: לְלֹא אֱלֹהֵי אֱמֶת
  choice: सच्चे परमेश्वर के बिना
  rationale: לְלֹא का अर्थ ‘के बिना’ है। אֱלֹהֵי אֱמֶת का स्वाभाविक अर्थ ‘सच्चा परमेश्वर’ है, जबकि उसका अधिक शाब्दिक रूप ‘सत्य का परमेश्वर’ पादटिप्पणी में रखा गया है।
- source_word: וּלְלֹא כֹּהֵן מוֹרֶה
  choice: शिक्षा देने वाले याजक के बिना
  rationale: מוֹרֶה एक कृदन्त है और याजक की शिक्षा देने की सतत भूमिका बताता है। ‘शिक्षा देने वाला याजक’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּלְלֹא תוֹרָה
  choice: शिक्षा के बिना
  rationale: תּוֹרָה का मूल अर्थ शिक्षा या निर्देश है; इस प्रसंग में याजक के शिक्षा देने के कार्य के साथ इसका निकट सम्बन्ध है। ‘व्यवस्था’ सम्भव पारम्परिक अनुवाद है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: אֱלֹהֵי אֱמֶת का अर्थ और निश्चितता
  choice: सच्चे परमेश्वर
  alternative: सत्य के परमेश्वर; विश्वासयोग्य परमेश्वर
  rationale: प्रसंग इस्राएल और उसके परमेश्वर के सम्बन्ध की बात करता है, इसलिए हिन्दी में ‘सच्चे परमेश्वर’ सबसे स्वाभाविक है। फिर भी इब्रानी אֱמֶת में सत्यता और विश्वासयोग्यता दोनों का भाव हो सकता है; इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תּוֹרָה का अनुवाद
  choice: शिक्षा
  alternative: व्यवस्था; उपदेश
  rationale: यह शब्द केवल विधि-संहिता तक सीमित नहीं है और यहाँ शिक्षा देने वाले याजक के उल्लेख के साथ आता है। इसलिए मुख्य पाठ में व्यापक अर्थ ‘शिक्षा’ रखा गया है, बिना पारम्परिक ‘व्यवस्था’ को अस्वीकार किए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल इब्रानी में बार-बार आए ‘के बिना’ के समानान्तर ढाँचे को हिन्दी में भी बनाए रखा गया है।
