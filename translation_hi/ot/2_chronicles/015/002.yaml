source:
  edition: WLC
  text: וַ/יֵּצֵא֮ לִ/פְנֵ֣י אָסָא֒ וַ/יֹּ֣אמֶר ל֔/וֹ שְׁמָע֕וּ/נִי אָסָ֖א וְ/כָל יְהוּדָ֣ה וּ/בִנְיָמִ֑ן יְהוָ֤ה עִמָּ/כֶם֙ בִּֽ/הְיֽוֹתְ/כֶ֣ם עִמּ֔/וֹ וְ/אִֽם תִּדְרְשֻׁ֨/הוּ֙ יִמָּצֵ֣א לָ/כֶ֔ם וְ/אִם תַּעַזְבֻ֖/הוּ יַעֲזֹ֥ב אֶתְ/כֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/002.yaml
  text: 'He went out to meet Asa and said to him[a], “Hear me, Asa, and all Judah and Benjamin: Yahweh is with you while you are with him. If you seek him, he will be found by you; but if you forsake him, he will forsake you.”'
translation:
  language: hi
  text: वह आसा से मिलने निकला और उससे कहा, “हे आसा और समस्त यहूदा और बिन्यामीन, मेरी सुनो! याहवे तुम्हारे साथ है, जब तुम उसके साथ हो। यदि तुम उसे खोजोगे, तो वह तुम्हें मिल जाएगा[a]; पर यदि तुम उसे छोड़ दोगे, तो वह तुम्हें छोड़ देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह तुम्हारे द्वारा पाया जाएगा।”
    reason: इब्रानी के निफ़अल रूप को अधिक औपचारिक ढंग से दर्शाने वाला विकल्प।
lexical_decisions:
- source_word: וַיֵּצֵא לִפְנֵי אָסָא
  choice: वह आसा से मिलने निकला
  rationale: गति के इस प्रसंग में לִפְנֵי का आशय केवल ‘सामने’ नहीं, बल्कि आसा से मिलने के लिए बाहर निकलना है।
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: बहुवचन आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय को स्वाभाविक तथा सीधे भविष्यवाणी-संबंधी संबोधन में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: עִמָּכֶם ... עִמּוֹ
  choice: तुम्हारे साथ ... उसके साथ
  rationale: मूल की पुनरावृत्ति और पारस्परिक संरचना को सुरक्षित रखा गया है।
- source_word: תִּדְרְשֻׁהוּ
  choice: उसे खोजोगे
  rationale: धार्मिक-वाचा के संदर्भ में דרש का अर्थ परमेश्वर को मन लगाकर खोजना है, केवल उससे पूछताछ करना नहीं।
- source_word: יִמָּצֵא לָכֶם
  choice: वह तुम्हें मिल जाएगा
  rationale: निफ़अल रूप ‘पाया जाएगा’ को सहज आधुनिक हिन्दी में व्यक्त करता है और परमेश्वर के खोजे जाने योग्य होने का भाव बनाए रखता है।
- source_word: תַּעַזְבֻהוּ ... יַעֲזֹב אֶתְכֶם
  choice: तुम उसे छोड़ दोगे ... वह तुम्हें छोड़ देगा
  rationale: दोनों खंडों में एक ही क्रिया रखकर मूल की पारस्परिकता और शब्द-पुनरावृत्ति सुरक्षित की गई है।
theological_decisions:
- issue: वाचा-संबंधी शर्त और पारस्परिकता
  choice: याहवे का उनके साथ होना, उनके उसके साथ होने से सीधे जोड़ा गया है; खोजने और छोड़ने के परिणाम भी स्पष्ट रूप से रखे गए हैं।
  alternative: इन कथनों को केवल मनुष्य के अनुभव का वर्णन मानकर उनकी शर्तात्मकता को नरम करना।
  rationale: इब्रानी पाठ स्पष्ट शर्तात्मक उपवाक्यों और पारस्परिक वाचा-भाषा का प्रयोग करता है। पद से आगे बढ़कर धर्मवैज्ञानिक निष्कर्ष निकाले बिना इस तनाव को बनाए रखा गया है।
- issue: יִמָּצֵא में दैवी उपलब्धता
  choice: वह तुम्हें मिल जाएगा
  alternative: वह अपने को तुम्हारे द्वारा पाए जाने देगा
  rationale: मुख्य पाठ में निफ़अल की स्वाभाविक हिन्दी दी गई है। वैकल्पिक रूप दैवी अनुमति का भाव स्पष्ट करता है, पर मूल से अधिक व्याख्यात्मक और हिन्दी में भारी है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘समस्त’ सामूहिक संबोधन की गंभीरता बनाए रखता है, जबकि ‘मेरी सुनो’ और ‘मिल जाएगा’ स्वाभाविक आधुनिक हिन्दी हैं।
