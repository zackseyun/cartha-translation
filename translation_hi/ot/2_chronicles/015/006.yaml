source:
  edition: WLC
  text: וְ/כֻתְּת֥וּ גוֹי בְּ/ג֖וֹי וְ/עִ֣יר בְּ/עִ֑יר כִּֽי אֱלֹהִ֥ים הֲמָמָ֖/ם בְּ/כָל צָרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/006.yaml
  text: Nation was crushed by nation[a], and city by city, for God troubled them with every kind of distress.
translation:
  language: hi
  text: एक राष्ट्र दूसरे राष्ट्र के हाथों कुचला गया[a], और एक नगर दूसरे नगर के हाथों; क्योंकि परमेश्वर ने उन्हें हर प्रकार की विपत्ति से व्याकुल कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक राष्ट्र दूसरे राष्ट्र के विरुद्ध, और एक नगर दूसरे नगर के विरुद्ध कुचला गया।”
    reason: ב की विरोधी भूमिका को “के हाथों” के स्थान पर “के विरुद्ध” से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וְכֻתְּתוּ
  choice: कुचली गई
  rationale: כתת के पुअल रूप में टूटने या कुचले जाने का प्रबल भाव है। निकटवर्ती एकवचन सामूहिक संज्ञा 'जाति' के अनुरूप हिंदी में एकवचन स्त्रीलिंग रखा गया है।
- source_word: גוֹי בְּגוֹי
  choice: जाति जाति के हाथों
  rationale: ב यहाँ विरोधी या कारक संबंध दिखाता है। यह प्रयोग एक जाति के दूसरी जाति द्वारा कुचले जाने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְעִיר בְּעִיר
  choice: और नगर नगर के हाथों
  rationale: पहले वाक्यांश की संक्षिप्त समानांतर रचना बनाए रखता है और नगरों के परस्पर संघर्ष का भाव देता है; दोहराए गए 'कुचला गया' को हिंदी में अध्याहृत रहने दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विनाश का कारण प्रस्तुत करता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग एक परमेश्वर की ओर संकेत करते हैं; आधुनिक हिंदी बाइबिलीय शैली में 'परमेश्वर' स्पष्ट और स्वाभाविक है।
- source_word: הֲמָמָם
  choice: उन्हें ... व्याकुल कर दिया
  rationale: המם उथल-पुथल, घबराहट या भ्रम उत्पन्न करने का अर्थ दे सकता है। 'व्याकुल कर दिया' इस व्यापक भाव को सहज हिंदी में रखता है, जबकि वैकल्पिक 'भ्रम में डाल दिया' पादटिप्पणी में सुरक्षित है।
- source_word: בְּכָל צָרָה
  choice: हर प्रकार के संकट से
  rationale: ב को साधनवाचक मानकर और כל की व्यापकता को व्यक्त करते हुए यह बताता है कि सब प्रकार के संकट उस व्याकुलता का माध्यम थे।
theological_decisions:
- issue: विपत्तियों में परमेश्वर की भूमिका
  choice: परमेश्वर ने उन्हें ... व्याकुल कर दिया
  alternative: परमेश्वर ने उन्हें व्याकुल होने दिया
  rationale: इब्रानी में परमेश्वर सक्रिय एकवचन क्रिया का कर्ता है। इसलिए अनुवाद प्रत्यक्ष दैवी कर्तृत्व को बनाए रखता है और उसे केवल अनुमति देने के अर्थ में नरम नहीं करता।
- issue: הֲמָמָם की अर्थ-व्याप्ति
  choice: व्याकुल कर दिया
  alternative: भ्रम में डाल दिया
  rationale: मूल क्रिया में व्याकुलता, घबराहट और भ्रम की परस्पर जुड़ी धारणाएँ हैं। मुख्य पाठ पठनीय व्यापक पद चुनता है और वास्तविक शाब्दिक विकल्प को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'जाति' यहाँ आधुनिक सामाजिक जाति-व्यवस्था नहीं, बल्कि जनसमुदाय या राष्ट्र के अर्थ में प्रयुक्त है। समानांतर इब्रानी रचना की संक्षिप्तता बचाने के लिए दूसरे खंड में क्रिया अध्याहृत है।
