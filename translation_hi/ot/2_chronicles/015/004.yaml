  edition: WLC
  text: וַ/יָּ֨שָׁב֙ בַּ/צַּר ל֔/וֹ עַל יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יְבַקְשֻׁ֖/הוּ וַ/יִּמָּצֵ֥א לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/004.yaml
  text: But in their distress they returned to Yahweh[a], the God of Israel, and sought him[b], and he was found by them.
translation:
  language: hi
  text: परन्तु अपने संकट में वे[a] याहवे, इस्राएल के परमेश्वर, की ओर लौटे और उन्होंने उसे खोजा; और वह उन्हें मिल गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसके संकट में वह ... लौटा”; यहाँ एकवचन सामूहिक रूप से इस्राएल को सूचित करता है।
    reason: collective_singular
  - marker: b
    text: अधिक शाब्दिक रूप में, “वह उनके द्वारा पाया गया।” इसका अर्थ यह भी हो सकता है कि उसने स्वयं को उनके द्वारा पाया जाने दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौटे
  rationale: שׁוּב का मूल भाव ‘लौटना/फिरना’ है। यहाँ परमेश्वर से दूर हो जाने के बाद उसकी ओर फिरने का आशय है; सामूहिक कर्ता के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: בַּצַּר לוֹ
  choice: अपने संकट में
  rationale: צַר यहाँ तंगी या मुसीबत के अर्थ में है। एकवचन प्रत्यय को प्रसंग में सामूहिक इस्राएल का सूचक समझते हुए स्वाभाविक हिन्दी में ‘अपने संकट में’ कहा गया है; औपचारिक एकवचन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל יְהוָה
  choice: याहवे की ओर
  rationale: שׁוּב के साथ עַל दिशा और संबंध की ओर लौटने का भाव देता है। ‘की ओर लौटे’ हिन्दी में इस प्रयोग का स्वाभाविक समतुल्य है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध का सीधा और स्वाभाविक अनुवाद, जो याहवे की इस्राएल के परमेश्वर के रूप में पहचान बनाए रखता है।
- source_word: וַיְבַקְשֻׁהוּ
  choice: उन्होंने उसे खोजा
  rationale: בקשׁ किसी व्यक्ति, विशेषतः परमेश्वर, को खोजने या उसकी ओर सहायता और भक्ति से उन्मुख होने को व्यक्त कर सकता है। ‘खोजा’ स्रोत की संक्षिप्तता और व्यापक अर्थ को बनाए रखता है।
- source_word: וַיִּמָּצֵא לָהֶם
  choice: वह उन्हें मिल गया
  rationale: מצא का निफ़अल रूप ‘पाया गया/मिल गया’ का भाव देता है। ‘उन्हें मिल गया’ स्वाभाविक हिन्दी है और इब्रानी के לָהֶם को भी व्यक्त करता है, बिना यह स्पष्ट रूप से जोड़ने के कि उसने स्वयं को मिलने दिया।
theological_decisions:
- issue: आरम्भिक एकवचन और बाद के बहुवचन का संबंध
  choice: इस्राएल को सामूहिक रूप से समझकर मुख्य पाठ में बहुवचन ‘वे’
  alternative: 'अधिक रूपात्मक अनुवाद: ‘अपने संकट में वह ... लौटा’'
  rationale: וַיָּשָׁב और לוֹ एकवचन हैं, जबकि आगे וַיְבַקְשֻׁהוּ तथा לָהֶם बहुवचन हैं। प्रसंग सामूहिक इस्राएल की ओर संकेत करता है; हिन्दी में बहुवचन अर्थ को स्पष्ट और प्रवाहपूर्ण बनाता है, जबकि एकवचन रूप पादटिप्पणी में रखा गया है।
- issue: וַיִּמָּצֵא לָהֶם में परमेश्वर की उपलब्धता और सक्रियता
  choice: ‘वह उन्हें मिल गया’
  alternative: ‘उसने अपने को उन्हें पाने दिया’ अथवा ‘वह उनके द्वारा पाया गया’
  rationale: इब्रानी निफ़अल व्याकरणतः निष्क्रिय ‘पाया गया’ हो सकता है और प्रसंग में परमेश्वर के खोजने वालों को उपलब्ध होने का भाव भी रख सकता है। मुख्य पाठ किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से स्पष्ट नहीं करता; पादटिप्पणी अधिक रूपात्मक विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘परन्तु’ विरोध को, ‘की ओर लौटे’ पश्चात्ताप/पुनः उन्मुख होने के संबंधपरक भाव को, और अर्धविराम क्रम के अंतिम परिणाम को स्पष्ट करता है।
