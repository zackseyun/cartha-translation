base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/008.yaml
  text: And when Asa heard these words and the prophecy of Oded the prophet[a], he took courage and removed the detestable things from all the land of Judah and Benjamin, and from the cities that he had captured in the hill country of Ephraim; and he renewed the altar of Yahweh that was before the vestibule of Yahweh.
translation:
  language: hi
  text: जब आसा ने ये बातें और ओदेद नबी की भविष्यवाणी[a] सुनी, तो उसने साहस बटोरा और यहूदा और बिन्यामीन के सारे प्रदेश से, तथा एप्रैम के पहाड़ी प्रदेश के उन नगरों से जिन्हें उसने जीत लिया था, घृणित वस्तुओं को हटा दिया। उसने याहवे की उस वेदी का नवीनीकरण किया जो याहवे के द्वारमण्डप के सामने थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ: “ओदेद नबी की भविष्यवाणी।” आसपास के प्रसंग के कारण कुछ व्याख्याकार और पाठालोचक इसे ओदेद के पुत्र अजर्याह से जोड़ते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: וְכִשְׁמֹעַ
  choice: जब ... सुनी
  rationale: संयोजक और infinitive construct मिलकर कालवाचक उपवाक्य बनाते हैं; आधुनिक हिन्दी में यह स्वाभाविक रूप से क्रम को व्यक्त करता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דברים का अर्थ ‘शब्द’ या ‘बातें’ हो सकता है; यहाँ पहले दिए गए संदेश के संदर्भ में ‘ये बातें’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: וְהַנְּבוּאָה
  choice: और ... भविष्यवाणी
  rationale: नबी द्वारा मिले प्रकाशन के औपचारिक अर्थ को बनाए रखते हुए נבואה का सीधा अनुवाद है।
- source_word: עֹדֵד הַנָּבִיא
  choice: ओदेद नबी की
  rationale: मसोरेटिक पाठ में स्पष्ट रूप से ‘ओदेद नबी’ है; आसपास के संदर्भ के साथ तनाव को मुख्य पाठ में सामंजस्य बैठाकर नहीं मिटाया गया।
- source_word: הִתְחַזַּק
  choice: उसने साहस बटोरा
  rationale: Hitpael रूप स्वयं को दृढ़ करने अथवा उत्साहित होने का भाव देता है; यह आधुनिक हिन्दी में उसके प्रत्युत्तर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּעֲבֵר הַשִּׁקּוּצִים
  choice: घृणित वस्तुओं को हटा दिया
  rationale: שקוצים प्रायः मूर्तिपूजा से जुड़ी घृणित वस्तुओं को दर्शाता है। ‘वस्तुओं’ से वास्तविक उपासना-सामग्री का संकेत मिलता है, पर स्रोत से अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: מִכָּל אֶרֶץ יְהוּדָה וּבִנְיָמִן
  choice: यहूदा और बिन्यामीन के सारे प्रदेश से
  rationale: इस भौगोलिक संदर्भ में ארץ को ‘प्रदेश’ कहना आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּמִן הֶעָרִים אֲשֶׁר לָכַד מֵהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में उन नगरों से भी जिन्हें उसने जीत लिया था
  rationale: לכד का अर्थ जीतना या अधिकार में लेना है। מן के साथ आए भौगोलिक पद को यहाँ मुहावरेदार हिन्दी में स्थानसूचक ‘में’ से व्यक्त किया गया है; ‘भी’ दोनों क्षेत्रों की सूची स्पष्ट करता है।
- source_word: וַיְחַדֵּשׁ
  choice: जीर्णोद्धार किया
  rationale: Piel रूप का अर्थ नया करना या पुनःस्थापित करना है। वेदी के संदर्भ में ‘जीर्णोद्धार’ भौतिक मरम्मत और पुनर्स्थापन दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִזְבַּח יְהוָה
  choice: याहवे की ... वेदी
  rationale: construct संबंध और परमेश्वर के व्यक्तिगत नाम दोनों को सीधे व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामाटन को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֲשֶׁר לִפְנֵי אוּלָם יְהוָה
  choice: जो याहवे के भवन के बरामदे के सामने थी
  rationale: אולם मंदिर के प्रवेश-बरामदे को दर्शाता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘भवन’ जोड़ा गया है; इसका आशय प्रसंग में याहवे का मंदिर है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: स्रोत में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: ‘ओदेद नबी’ और आसपास के संदर्भ का पाठगत तनाव
  choice: मुख्य पाठ में मसोरेटिक पाठ के अनुसार ‘ओदेद नबी’
  alternative: आसपास के संदर्भ के आधार पर ‘ओदेद के पुत्र अजर्याह नबी’
  rationale: दिए गए WLC पाठ को बिना सामंजस्यकारी संशोधन के अनूदित किया गया है; संदर्भगत कठिनाई को पाद-टिप्पणी में सुरक्षित रखा गया है।
