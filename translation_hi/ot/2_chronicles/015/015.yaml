id: 2CH.15.15
reference: 2 Chronicles 15:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׂמְח֨וּ כָל יְהוּדָ֜ה עַל הַ/שְּׁבוּעָ֗ה כִּ֤י בְ/כָל לְבָבָ/ם֙ נִשְׁבָּ֔עוּ וּ/בְ/כָל רְצוֹנָ֣/ם בִּקְשֻׁ֔/הוּ וַ/יִּמָּצֵ֖א לָ/הֶ֑ם וַ/יָּ֧נַח יְהוָ֛ה לָ/הֶ֖ם מִ/סָּבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/015.yaml
  text: And all Judah rejoiced over the oath[a], because they had sworn with all their heart and sought him with all their will, and he let himself be found by them, and Yahweh gave them rest all around.
translation:
  language: hi
  text: और समूचा यहूदा उस शपथ के कारण आनन्दित हुआ, क्योंकि उन्होंने अपने पूरे मन से शपथ खाई थी और अपनी पूरी इच्छा से उसे खोजा था। वह उन्हें मिल गया[a], और याहवे ने उन्हें चारों ओर से विश्राम दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “वह उनके द्वारा पाया गया।”
    reason: निफ़अल रूप की अधिक शाब्दिक कर्मवाच्य अभिव्यक्ति और मूल की सूक्ष्म अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: आनन्दित हुआ
  rationale: שׂמח सामुदायिक हर्ष को व्यक्त करता है; एकवचन ‘हुआ’ सामूहिक ‘समूचा यहूदा’ के अनुरूप है।
- source_word: כָל יְהוּדָה
  choice: समूचा यहूदा
  rationale: यह यहूदा के लोगों/राज्य का सामूहिक उल्लेख है; ‘समूचा यहूदा’ संक्षिप्त और ऐतिहासिक संदर्भ के अनुकूल है।
- source_word: עַל הַשְּׁבוּעָה
  choice: उस शपथ के कारण
  rationale: आनन्द के क्रियापद के साथ עַל यहाँ आनन्द के कारण या विषय को बताता है।
- source_word: בְכָל לְבָבָם
  choice: अपने पूरे मन से
  rationale: यह सम्पूर्ण आंतरिक निष्ठा का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: נִשְׁבָּעוּ
  choice: शपथ खाई थी
  rationale: इब्रानी पूर्ण क्रिया मुख्य वर्णन से पहले पूरी हुई क्रिया को दर्शाती है।
- source_word: וּבְכָל רְצוֹנָם
  choice: अपनी पूरी इच्छा से
  rationale: רָצוֹן यहाँ इच्छाशक्ति और तत्पर अभिलाषा का भाव रखता है; ‘पूरी इच्छा से’ संज्ञात्मक समानांतरता बनाए रखता है।
- source_word: בִּקְשֻׁהוּ
  choice: उसे खोजा था
  rationale: सर्वनाम संदर्भ में याहवे की ओर संकेत करता है; इब्रानी की सर्वनामात्मक रचना सुरक्षित रखी गई है।
- source_word: וַיִּמָּצֵא לָהֶם
  choice: वह उन्हें मिल गया
  rationale: निफ़अल रूप का स्वाभाविक हिन्दी अनुवाद है और इस बात को अनावश्यक रूप से स्पष्ट नहीं करता कि उसने स्वयं को मिलने दिया या वे उसे पा सके।
- source_word: וַיָּנַח יְהוָה לָהֶם
  choice: याहवे ने उन्हें ... विश्राम दिया
  rationale: נוח के हिफ़इल रूप का अर्थ यहाँ विश्राम प्रदान करना है और यह इतिहास-वृत्त में शत्रुओं से मिली शान्ति को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: מִסָּבִיב
  choice: चारों ओर से
  rationale: यह आसपास के सभी पक्षों से शान्ति और सुरक्षा मिलने का स्वाभाविक हिन्दी मुहावरा है।
theological_decisions:
- issue: וַיִּמָּצֵא לָהֶם में ईश्वरीय सक्रियता और व्याकरणिक कर्मवाच्यता
  choice: वह उन्हें मिल गया
  alternative: उसने अपने आपको उन्हें पाने दिया / वह उनके द्वारा पाया गया
  rationale: मुख्य पाठ सहज हिन्दी में निफ़अल का भाव देता है, जबकि पादटिप्पणी अधिक शाब्दिक कर्मवाच्य को सुरक्षित रखती है; इस प्रकार परमेश्वर की अनुग्रहपूर्ण उपलब्धता को न तो नकारा गया है, न व्याकरण से अधिक स्पष्ट किया गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में प्रयुक्त वाचा-नाम को नाम के रूप में बनाए रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक-वाचक रूप अपनाया गया है। ‘समूचा यहूदा’ ऐतिहासिक सामूहिकता को बनाए रखता है; ‘चारों ओर से विश्राम’ इतिहास-वृत्त की वाचा-संबंधी शान्ति की भाषा को स्वाभाविक हिन्दी में व्यक्त करता है।
