  text: 'He brought into the house of God his father''s holy gifts and his own holy gifts: silver, gold, and vessels.'
translation:
  language: hi
  text: वह अपने पिता की पवित्र भेंटें और अपनी पवित्र भेंटें—चाँदी, सोना और पात्र—परमेश्वर के भवन में ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָדְשֵׁי אָבִיו וְקָדָשָׁיו
  choice: अपने पिता की पवित्र भेंटें और अपनी पवित्र भेंटें
  rationale: קֹדֶשׁ का बहुवचन यहाँ परमेश्वर के लिए अलग रखी और अर्पित वस्तुओं को सूचित करता है; ‘पवित्र भेंटें’ इस भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: राजाओं/इतिहास-वृत्तांत के संदर्भ में यह मंदिर को दर्शाता है; ‘भवन’ स्रोत की रूपकात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: כֶּסֶף וְזָהָב וְכֵלִים
  choice: चाँदी, सोना और पात्र
  rationale: כֵּלִים सामान्यतः उपयोग की वस्तुओं या पात्रों को सूचित कर सकता है; मंदिर-संबंधी सूची में ‘पात्र’ संक्षिप्त और उपयुक्त है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और स्रोत के निकट वाक्य-विन्यास। ‘पवित्र भेंटें’ से समर्पित वस्तुओं का धार्मिक संदर्भ स्पष्ट होता है, जबकि पिता और पुत्र की भेंटों के बीच मूल पाठ का भेद सुरक्षित रहता है।
