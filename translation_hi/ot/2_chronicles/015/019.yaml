  text: וּ/מִלְחָמָ֖ה לֹ֣א הָיָ֑תָה עַ֛ד שְׁנַת שְׁלֹשִׁ֥ים וְ/חָמֵ֖שׁ לְ/מַלְכ֥וּת אָסָֽא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/019.yaml
  text: And there was no war until the thirty-fifth year of Asa’s reign[a].
translation:
  language: hi
  text: और आसा के शासन के पैंतीसवें वर्ष तक कोई युद्ध नहीं हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आसा के शासन के वर्ष पैंतीस तक।” संबंधित अंशों के साथ कालक्रम का सामंजस्य बैठाने के लिए कुछ व्याख्याकार इस संख्या को केवल आसा के शासन-वर्षों के बजाय एक व्यापक कालगणना के अनुसार समझते हैं।
    reason: वैकल्पिक अभिव्यक्ति और कालक्रम-संबंधी व्याख्यात्मक कठिनाई को स्पष्ट करना।
lexical_decisions:
- source_word: וּ/מִלְחָמָה לֹא הָיָתָה
  choice: और ... कोई युद्ध नहीं हुआ
  rationale: संयोजक וּ को ‘और’ से रखा गया है। מִלְחָמָה, निषेध לֹא और अस्तित्वसूचक היה का यह स्वाभाविक हिन्दी रूप है; इससे युद्ध न होने का स्पष्ट भाव बना रहता है।
- source_word: עַד
  choice: तक
  rationale: यह युद्धरहित अवधि की समय-सीमा बताता है; हिन्दी में ‘तक’ सबसे स्वाभाविक समतुल्य है।
- source_word: שְׁנַת שְׁלֹשִׁים וְחָמֵשׁ
  choice: पैंतीसवें वर्ष
  rationale: रचनात्मक संज्ञा שְׁנַת के बाद संख्या आई है और वह राजकीय वर्ष का संकेत देती है; हिन्दी में क्रमवाचक रूप उपयुक्त है।
- source_word: לְמַלְכוּת
  choice: के शासन के
  rationale: यहाँ מַלְכוּת राजा के शासनकाल को दर्शाता है। ‘शासन’ आधुनिक, सहज और प्रसंगानुकूल है।
- source_word: אָסָא
  choice: आसा
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: आसा-वृत्तांत के अन्य कालक्रम-संबंधी कथनों के साथ संख्या का संबंध
  choice: मुख्य पाठ में इब्रानी राजकीय-वर्ष सूत्र को सीधे ‘आसा के शासन के पैंतीसवें वर्ष’ के रूप में रखा गया है।
  alternative: इसे राज्य-विभाजन से आरम्भ होने वाली किसी व्यापक कालगणना का पैंतीसवाँ वर्ष मानना, अथवा अन्य अंशों से सामंजस्य बैठाने के लिए संख्या में संशोधन करना।
  rationale: मसोरेटिक पाठ स्पष्ट रूप से पैंतीसवें वर्ष को आसा के शासन से जोड़ता है। अनुवाद में कालक्रम की कठिनाई को चुपचाप सुलझाने के बजाय पाठगत कथन और व्याख्यात्मक तनाव दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘राज्यकाल’ की अपेक्षा ‘शासन’ अधिक परिचित है, जबकि मूल का राजकीय-वर्ष संबंध स्पष्ट बना रहता है। विराम-चिह्न को पद के अर्थ का भाग न मानते हुए प्रकाशित हिन्दी शैली अपनाई गई है।
