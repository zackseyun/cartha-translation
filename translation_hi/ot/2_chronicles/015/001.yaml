- source_word: הָיְתָה עָלָיו
  choice: पर ... उतरा
  rationale: शाब्दिक अर्थ ‘उस पर था’ है, पर भविष्यद्वाणी की प्रेरणा के इस प्रसंग में यह अभिव्यक्ति आत्मा के किसी व्यक्ति पर आने को सूचित करती है। ‘उतरा’ सहज हिन्दी में उस घटनात्मक भाव को व्यक्त करता है; स्थिर अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: इस भविष्यद्वाणी-संबंधी प्रसंग में रचना परमेश्वर के आत्मा को सूचित करती है। हिन्दी बाइबलीय प्रयोग के अनुरूप निश्चित अर्थ में ‘परमेश्वर का आत्मा’ रखा गया है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים को ‘परमेश्वर का आत्मा’ माना जाए या अनिश्चित रूप से ‘परमेश्वर की ओर से कोई आत्मा’
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की ओर से एक आत्मा
  rationale: इतिहासकार की यह अभिव्यक्ति नामित व्यक्ति को भविष्यद्वाणी के लिए मिलने वाली ईश्वरीय प्रेरणा का परिचय देती है। निश्चित अनुवाद प्रसंग और इब्रानी रचना के सर्वाधिक संभावित अर्थ को व्यक्त करता है, बिना पाठ से आगे कोई व्यवस्थित धर्मवैज्ञानिक दावा जोड़े।
