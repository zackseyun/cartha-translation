  rationale: वाव यहाँ कथा को आगे बढ़ाता है; आधुनिक हिन्दी में अलग आरम्भिक संयोजक जोड़ना आवश्यक नहीं। नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
