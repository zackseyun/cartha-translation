  text: וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יִדְרֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל יוּמָ֑ת לְ/מִן קָטֹן֙ וְ/עַד גָּד֔וֹל לְ/מֵ/אִ֖ישׁ וְ/עַד אִשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/013.yaml
  text: And everyone who would not seek Yahweh[a], the God of Israel, was to be put to death, from small to great[b], from man to woman.
translation:
  language: hi
  text: और जो कोई इस्राएल के परमेश्वर यहोवा की खोज न करे[a], उसे मार डाला जाए—छोटे से बड़े तक[b], पुरुष से स्त्री तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा को न ढूँढ़े।” यहाँ इब्रानी क्रिया परमेश्वर की ओर मुड़ने और उसकी इच्छा जानने का भाव भी रखती है; संदर्भ वाचा की शपथ की शर्त का है।
    reason: lexical_alternative
  - marker: b
    text: या “सबसे छोटे से सबसे बड़े तक।” यह इब्रानी मुहावरा पूरे समुदाय के समावेश को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: और जो कोई
  rationale: यह व्यापक संबंधवाचक पदबंध है; ‘जो कोई’ स्वाभाविक हिन्दी में इसके सार्वभौमिक दायरे को बनाए रखता है।
- source_word: לֹא יִדְרֹשׁ
  choice: खोज न करे
  rationale: דרשׁ इतिहास-वृत्तान्त में परमेश्वर की ओर मुड़ने, उसे ढूँढ़ने और उसकी इच्छा जानने का वाचा-संबंधी भाव रखता है। विधिक शपथ के संदर्भ में ‘न करे’ इसकी अपेक्षित शर्त को व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, जिससे व्यक्तिवाचक नाम बना रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधसूचक पदबंध सीधे उस परमेश्वर की पहचान इस्राएल के परमेश्वर के रूप में करता है।
- source_word: יוּמָת
  choice: उसे मार डाला जाए
  rationale: מות का होफ़ाल रूप कारणवाचक कर्मवाच्य है और स्पष्ट रूप से मृत्युदंड बताता है, केवल मर जाने को नहीं।
- source_word: לְמִן קָטֹן וְעַד גָּדוֹל
  choice: छोटे से बड़े तक
  rationale: यह इब्रानी मुहावरे के निकट रहते हुए पूरे समुदाय का समावेश बताता है और इसे केवल आयु तक सीमित नहीं करता।
- source_word: לְמֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुष से स्त्री तक
  rationale: एकवचन वितरणात्मक जोड़ी को बनाए रखते हुए यह पूरे स्त्री-पुरुष समुदाय को समेटता है।
theological_decisions:
- issue: वाचा की शपथ में उल्लिखित कठोर दंड
  choice: मृत्युदंड को स्पष्ट रूप में ‘उसे मार डाला जाए’ कहना
  alternative: ‘वह मर जाए’ कहना या इसे बहिष्कार/प्रतीकात्मक शाप के रूप में समझाना
  rationale: इब्रानी कर्मवाच्य-कारणवाचक क्रिया स्पष्ट रूप से किसी को मृत्युदंड दिए जाने की बात कहती है। अनुवाद इसकी कठोरता को न नरम करता है, न उससे आगे कोई व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक वाचा-विधान का स्वर रखा गया है। वाक्य सहज है, पर ‘खोज’ जैसे इतिहास-वृत्तान्त के प्रमुख धर्मवैचारिक शब्द और मूल पाठ की कठोर दंडात्मक भाषा सुरक्षित हैं।
