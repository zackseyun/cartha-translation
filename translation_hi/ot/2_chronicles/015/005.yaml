translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘जानेवाले’ और ‘आनेवाले’ की संयुक्त वर्तनी प्रवाह बनाए रखती है। मूल की व्यापकता और बहुवचन ‘देशों’ को सुरक्षित रखा गया है; मुहावरे और बहुअर्थी מְהוּמָה को पादटिप्पणियों में स्पष्ट किया गया है।
