  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם אֵ֥ין שָׁל֖וֹם לַ/יּוֹצֵ֣א וְ/לַ/בָּ֑א כִּ֚י מְהוּמֹ֣ת רַבּ֔וֹת עַ֥ל כָּל יוֹשְׁבֵ֖י הָ/אֲרָצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/005.yaml
  text: And in those times there was no peace for the one going out or for the one coming in[b][a], because many disturbances were upon all the inhabitants of the lands.
translation:
  language: hi
  text: और उन दिनों बाहर जानेवाले और भीतर आनेवाले किसी के लिए भी शांति नहीं थी,[b] क्योंकि सभी देशों के निवासियों पर बहुत-सी उथल-पुथल छाई हुई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बहुत-सी उथल-पुथल’ का अनुवाद ‘बड़े उपद्रव’ भी हो सकता है; इब्रानी शब्द उथल-पुथल, भ्रम या घबराहट का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बाहर जाना और भीतर आना’ सामान्य दैनिक आवागमन, विशेषकर यात्रा या सार्वजनिक गतिविधि के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: और उन दिनों
  rationale: बहुवचन काल-सूचक वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और प्रसंग की निरन्तरता बनाए रखता है।
- source_word: אֵין שָׁלוֹם
  choice: कोई शान्ति नहीं थी
  rationale: שָׁלוֹם शान्ति, कुशल और सुरक्षा का व्यापक भाव रखता है; ‘शान्ति’ मूल की व्यापकता बचाती है, जबकि आगे का वाक्य व्यावहारिक असुरक्षा स्पष्ट करता है।
- source_word: לַיּוֹצֵא וְלַבָּא
  choice: बाहर जानेवाले या भीतर आनेवाले के लिए
  rationale: एकवचन कृदन्तों के सामान्य, प्रतिनिधिक अर्थ को बनाए रखता है। नकारात्मक हिन्दी वाक्य में ‘या’ दोनों स्थितियों में किसी के भी सुरक्षित न होने का अर्थ स्वाभाविक रूप से देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: शान्ति के अभाव का कारण प्रस्तुत करनेवाले स्पष्ट कारणवाचक सम्बन्ध को व्यक्त करता है।
- source_word: מְהוּמֹת רַבּוֹת
  choice: बहुत-सी उथल-पुथलें
  rationale: מְהוּמָה में अव्यवस्था, भ्रम, घबराहट और कोलाहल की अर्थ-सीमा है; ‘उथल-पुथल’ सामाजिक अस्थिरता को आधुनिक और व्यापक हिन्दी में व्यक्त करती है। बहुवचन रूप मूल के רַבּוֹת को प्रतिबिम्बित करता है।
- source_word: עַל כָּל יוֹשְׁבֵי הָאֲרָצוֹת
  choice: सभी देशों के निवासियों पर ... छाई हुई थीं
  rationale: עַל की ‘ऊपर/पर’ वाली छवि को ‘पर ... छाई हुई’ से बनाए रखा गया है। הָאֲרָצוֹת बहुवचन है, इसलिए ‘देशों’ चुना गया, जो अनेक भूभागों या क्षेत्रों को सूचित कर सकता है।
