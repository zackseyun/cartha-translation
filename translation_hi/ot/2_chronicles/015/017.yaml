  yaml_path: translation/ot/2_chronicles/015/017.yaml
  text: But the high places were not removed from Israel; nevertheless, Asa’s heart was whole all his days.
translation:
  language: hi
  text: परन्तु इस्राएल में से ऊँचे स्थान हटाए नहीं गए; फिर भी आसा का हृदय जीवन भर खरा रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह बामोत के लिए प्रचलित और स्रोत-संगत पद है; संदर्भ में ये उपासना-स्थल हैं, पर मूल पाठ यहाँ उनकी प्रकृति को और स्पष्ट नहीं करता।
- source_word: לְבַב ... שָׁלֵם
  choice: हृदय ... निष्कपट रहा
  rationale: शालेम का मूल भाव अखंडता, संपूर्णता और अविभाजित निष्ठा है। आधुनिक हिन्दी में ‘निष्कपट’ नैतिक एवं भक्तिपरक अखंडता को स्वाभाविक ढंग से व्यक्त करता है, बिना पूर्ण पापरहितता का दावा किए।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: शाब्दिक ‘उसके सब दिनों’ का सहज आधुनिक हिन्दी रूप।
- source_word: רַק
  choice: फिर भी
  rationale: पहले कथन और आसा के हृदय के सकारात्मक मूल्यांकन के बीच विरोधात्मक संबंध को व्यक्त करता है।
theological_decisions:
- issue: ऊँचे स्थानों के न हटने और आसा के हृदय के शालेम होने के बीच तनाव
  choice: तनाव को ‘फिर भी’ के साथ यथावत रखा गया
  alternative: आसा को ऊँचे स्थान न हटाने के दोष से स्पष्टतः मुक्त करना या उसके हृदय को ‘पूरी तरह समर्पित’ कहना
  rationale: मूल पाठ सामूहिक स्थिति और आसा के अंतःकरण का सकारात्मक मूल्यांकन साथ रखता है, पर उनके संबंध की व्याख्या नहीं करता। अनुवाद को यह तनाव सुलझाना नहीं चाहिए।
- issue: שָׁלֵם का धार्मिक अर्थ
  choice: निष्कपट
  alternative: पूर्ण / पूरी तरह समर्पित / खरा
  rationale: ‘निष्कपट’ यहाँ अखंड निष्ठा का संकेत देता है और इसे निरपेक्ष नैतिक सिद्धता या पापरहितता में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘परन्तु’ और ‘फिर भी’ से हिब्रू वाक्य का द्विस्तरीय विरोध स्पष्ट रखा गया है।
