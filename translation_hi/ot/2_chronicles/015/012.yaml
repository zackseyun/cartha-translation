  yaml_path: translation/ot/2_chronicles/015/012.yaml
  text: And they entered into the covenant to seek Yahweh[a], the God of their fathers[b], with all their heart and with all their soul.
translation:
  language: hi
  text: उन्होंने अपने पुरखाओं के परमेश्वर याहवे[b] को अपने पूरे मन और अपने पूरे प्राण से खोजने के लिए उस वाचा में प्रवेश किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने वाचा में अपने को बाँध लिया।”
    reason: lexical_alternative
  - marker: b
    text: “पुरखाओं के परमेश्वर” से आशय उस वाचा के परमेश्वर से है जिसकी आराधना उनके पुरखे करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ בַבְּרִית
  choice: उस वाचा में प्रवेश किया
  rationale: בוא के मूल ‘आना/प्रवेश करना’ अर्थ और בַּבְּרִית के वाचागत मुहावरे, दोनों को बनाए रखता है। ‘उस’ प्रसंग में निर्दिष्ट वाचा को व्यक्त करता है।
- source_word: לִדְרוֹשׁ
  choice: खोजने के लिए
  rationale: धार्मिक-वाचागत संदर्भ में דרש का अर्थ परमेश्वर को निष्ठापूर्वक खोजना है, केवल उनसे पूछताछ करना नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पुरखाओं के परमेश्वर
  rationale: ‘पुरखाओं’ से इब्रानी के पुरुषवाची पैतृक संदर्भ और पूर्वजों के वाचागत परमेश्वर का भाव स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: בְּכָל לְבָבָם
  choice: अपने पूरे मन से
  rationale: लेवाव यहाँ अंतःकरण, इच्छा और संकल्प को दर्शाता है; हिन्दी में ‘पूरे मन से’ इसका स्वाभाविक समतुल्य है।
- source_word: וּבְכָל נַפְשָׁם
  choice: अपने पूरे प्राण से
  rationale: נפש जीवन, प्राण अथवा संपूर्ण व्यक्ति को सूचित कर सकता है। ‘पूरे प्राण से’ वाचागत सूत्र और संपूर्ण समर्पण का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचागत नाम का प्रयोग करता है; ‘याहवे’ उसे शीर्षक में बदले बिना प्रस्तुत करता है।
- issue: אֲבוֹתֵיהֶם में पैतृक भाषा
  choice: अपने पुरखाओं
  alternative: अपने पूर्वजों
  rationale: ‘पुरखाओं’ मूल के पुरुषवाची बहुवचन को बनाए रखते हुए सामान्य आधुनिक हिन्दी में समझने योग्य है।
- issue: נפש का अर्थ-क्षेत्र
  choice: प्राण
  alternative: समूचे अस्तित्व अथवा जीवन
  rationale: ‘प्राण’ पारंपरिक वाचागत जोड़ी ‘मन और प्राण’ को बनाए रखता है, पर मूल शब्द के व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘वाचा’, ‘याहवे’ और ‘प्राण’ जैसे धर्मग्रंथ-संबंधी शब्द मूल की वाचागत भाषा और अर्थगत तनाव को सुरक्षित रखते हैं।
