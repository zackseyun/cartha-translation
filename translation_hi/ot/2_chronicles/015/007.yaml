source:
  edition: WLC
  text: וְ/אַתֶּ֣ם חִזְק֔וּ וְ/אַל יִרְפּ֖וּ יְדֵי/כֶ֑ם כִּ֛י יֵ֥שׁ שָׂכָ֖ר לִ/פְעֻלַּתְ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/015/007.yaml
  text: But as for you[a], be strong, and do not let your hands grow weak, for there is a reward for your work.
translation:
  language: hi
  text: पर तुम दृढ़ बने रहो और तुम्हारे हाथ ढीले न पड़ें,[a] क्योंकि तुम्हारे काम का प्रतिफल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे हाथ ढीले न पड़ें।” यह हिब्रू मुहावरा शक्ति, संकल्प या साहस खो देने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: पर तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम पिछले संदर्भ की तुलना में बलयुक्त विरोध दर्शाते हैं; ‘पर तुम’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: חִזְקוּ
  choice: दृढ़ बने रहो
  rationale: बहुवचन आज्ञार्थक रूप शक्ति, साहस और संकल्प में स्थिर रहने का आह्वान करता है; प्रसंग में ‘दृढ़ बने रहो’ स्वाभाविक और स्पष्ट है।
- source_word: וְ/אַל יִרְפּוּ יְדֵי/כֶם
  choice: और तुम्हारे हाथ ढीले न पड़ें
  rationale: हिब्रू मुहावरे की शारीरिक छवि को बनाए रखते हुए यह संकल्प, साहस या कार्यक्षमता न खोने का भाव व्यक्त करता है।
- source_word: כִּי יֵשׁ
  choice: क्योंकि ... है
  rationale: כִּי कारण प्रस्तुत करता है और יֵשׁ अस्तित्व बताता है; मूल पाठ भविष्यकाल को स्पष्ट रूप से नहीं कहता।
- source_word: שָׂכָר
  choice: प्रतिफल
  rationale: यह शब्द पुरस्कार, मजदूरी या बदले में मिलने वाले फल का अर्थ दे सकता है; ‘प्रतिफल’ नैतिक-उपदेशात्मक प्रसंग में व्यापक अर्थ को सुरक्षित रखता है।
- source_word: לִ/פְעֻלַּתְ/כֶם
  choice: तुम्हारे काम का
  rationale: פְעֻלָּה काम, श्रम या कार्य को दर्शाता है; ‘तुम्हारे काम का’ हिन्दी में सहज है और कर्म के ठोस भाव को बनाए रखता है।
theological_decisions:
- issue: प्रतिफल की प्रकृति
  choice: क्योंकि तुम्हारे काम का प्रतिफल है
  alternative: क्योंकि तुम्हारे काम का फल तुम्हें मिलेगा
  rationale: मूल पाठ प्रतिफल के अस्तित्व का सीधा आश्वासन देता है, पर उसके समय, स्वरूप या योग्यता-सिद्धांत को स्पष्ट नहीं करता। चुना गया अनुवाद इन बातों को जोड़े बिना कथन और उसके धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘दृढ़ बने रहो’ और ‘हाथ ढीले न पड़ें’ सामान्य पाठक के लिए बोधगम्य हैं; मूल मुहावरे की छवि तथा प्रतिफल-वचन की अनिर्दिष्टता सुरक्षित रखी गई है।
