id: 2CH.5.2
reference: 2 Chronicles 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָז֩ יַקְהֵ֨יל שְׁלֹמֹ֜ה אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אֶת כָּל רָאשֵׁ֨י הַ/מַּטּ֜וֹת נְשִׂיאֵ֧י הָ/אָב֛וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל אֶל יְרוּשָׁלִָ֑ם לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מֵ/עִ֥יר דָּוִ֖יד הִ֥יא צִיּֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/002.yaml
  text: Then Solomon assembled the elders of Israel and all the heads of the tribes[a], the leaders of the fathers’ houses of the sons of Israel, at Jerusalem, to bring up the ark of the covenant of Yahweh from the city of David[b], that is Zion.
translation:
  language: hi
  text: तब सुलैमान ने इस्राएल के पुरनियों, गोत्रों के सभी मुखियाओं और इस्राएलियों के पितृकुलों के प्रधानों को यरूशलेम में इकट्ठा किया, ताकि वे याहवे की वाचा का सन्दूक दाऊद के नगर से, अर्थात् सिय्योन से, ऊपर ले आएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह अगले घटनाक्रम को आरम्भ करने वाला कालसूचक शब्द है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יַקְהֵיל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप का अर्थ किसी सभा को एकत्र करना है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों
  rationale: ‘पुरनिये’ मान्य नेतृत्व-समूह को दर्शाता है और हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: כָּל רָאשֵׁי הַמַּטּוֹת
  choice: गोत्रों के सभी मुखियाओं
  rationale: מַטּוֹת यहाँ इस्राएल के गोत्रीय विभाजनों को और רָאשֵׁי उनके प्रमुखों को दर्शाता है।
- source_word: נְשִׂיאֵי הָאָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पितृकुलों के प्रधानों
  rationale: ‘पितृकुल’ पैतृक/वंशगत सामाजिक संरचना को बनाए रखता है, जबकि ‘इस्राएली’ हिन्दी में בְּנֵי יִשְׂרָאֵל का स्वाभाविक सामुदायिक रूप है।
- source_word: אֶל יְרוּשָׁלִָם
  choice: यरूशलेम में
  rationale: सभा के एकत्र होने के स्थान के रूप में हिन्दी में ‘में’ सहज है, यद्यपि इब्रानी אֶל में गंतव्य का भाव भी है।
- source_word: לְהַעֲלוֹת
  choice: ऊपर ले आएँ
  rationale: यह सन्दूक को दाऊदपुर/सिय्योन से मंदिर की ओर ऊँचाई पर ले जाने की दिशा को सुरक्षित रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का सन्दूक
  rationale: इब्रानी संबंध-श्रृंखला को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का प्रचलित प्रतिलेखन है और नाम को उपाधि से नहीं बदलता।
- source_word: מֵעִיר דָּוִיד
  choice: दाऊदपुर से
  rationale: ‘दाऊदपुर’ עִיר דָּוִיד का संक्षिप्त और प्रतिष्ठित हिन्दी रूप है।
- source_word: הִיא צִיּוֹן
  choice: अर्थात् सिय्योन
  rationale: यह दाऊदपुर की सिय्योन के रूप में की गई अपपदात्मक पहचान को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में विशिष्ट वाचा-नाम है; हिन्दी के व्यापक और गरिमापूर्ण प्रचलन के अनुसार ‘यहोवा’ चुना गया, न कि सामान्य उपाधि ‘प्रभु’।
- issue: בְּנֵי יִשְׂרָאֵל और הָאָבוֹת में वंशगत संरचना
  choice: इस्राएलियों के पितृकुलों
  alternative: इस्राएल के पुत्रों के पिताओं के घरानों
  rationale: ‘पितृकुल’ मूल की पैतृक-वंशगत संरचना को सुरक्षित रखता है, पर हिन्दी में असहज शब्दशः वाक्यांश से बचता है।
- issue: הִיא צִיּוֹן का संबंध
  choice: दाऊदपुर की पहचान सिय्योन के रूप में
  alternative: जो सिय्योन है
  rationale: दोनों रूप मूल की अपपदात्मक पहचान व्यक्त करते हैं; ‘अर्थात्’ आधुनिक हिन्दी में अधिक स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। प्रशासनिक और वंशगत पदों के लिए ‘पुरनिये’, ‘मुखिया’, ‘पितृकुल’ और ‘प्रधान’ रखे गए हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
