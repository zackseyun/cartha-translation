id: 2CH.5.9
reference: 2 Chronicles 5:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּאֲרִיכוּ֮ הַ/בַּדִּים֒ וַ/יֵּרָאוּ֩ רָאשֵׁ֨י הַ/בַּדִּ֤ים מִן הָ/אָרוֹן֙ עַל פְּנֵ֣י הַ/דְּבִ֔יר וְ/לֹ֥א יֵרָא֖וּ הַ/ח֑וּצָ/ה וַֽ/יְהִי שָׁ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/009.yaml
  text: And the poles were so long that the heads of the poles were seen from the ark before the inner sanctuary[a], but they could not be seen from outside; and they are there to this day.
translation:
  language: hi
  text: और डंडों को इतना लम्बा किया गया था कि उनके सिरे सन्दूक से पवित्रतम स्थान के सामने[a] दिखाई देते थे, परन्तु बाहर से दिखाई नहीं देते थे। वे आज तक वहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भीतरी पवित्रस्थान के सामने’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲרִיכוּ
  choice: इतना लम्बा किया गया था
  rationale: हिफ़ील रूप के कारणवाचक भाव को बनाए रखते हुए परिणाम भी स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: הַבַּדִּים
  choice: डंडों
  rationale: यह सन्दूक को उठाकर ले जाने के लिए लगाए गए डंडों को दर्शाता है; आधुनिक हिन्दी में यह स्पष्ट और सहज है।
- source_word: רָאשֵׁי הַבַּדִּים
  choice: उनके सिरे
  rationale: शाब्दिक अर्थ ‘डंडों के सिर’ है, पर भौतिक छोरों के लिए ‘सिरे’ स्वाभाविक और सटीक हिन्दी है।
- source_word: מִן הָאָרוֹן
  choice: सन्दूक से
  rationale: מִן उस स्थान-बिन्दु को दर्शाता है जहाँ से डंडों के सिरे दिखाई पड़ते थे; संक्षिप्त अनुवाद मूल की स्थानिक अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
- source_word: עַל פְּנֵי הַדְּבִיר
  choice: पवित्रतम स्थान के सामने
  rationale: דְּבִיר मन्दिर के भीतरी पवित्रस्थान को सूचित करता है, और עַל־פְּנֵי यहाँ स्थानिक रूप से ‘के सामने’ है।
- source_word: וְלֹא יֵרָאוּ הַחוּצָה
  choice: परन्तु बाहर से दिखाई नहीं देते थे
  rationale: भीतर से दिखाई देने और बाहर से न दिखाई देने के विरोध को सहज हिन्दी में बनाए रखता है।
- source_word: וַיְהִי שָׁם עַד הַיּוֹם הַזֶּה
  choice: वे आज तक वहीं हैं
  rationale: एकवचन क्रिया के अस्तित्वसूचक प्रयोग को बहुवचन डंडों के संदर्भ में स्वाभाविक हिन्दी से व्यक्त किया गया है; ‘आज तक’ लेखक के समय तक निरन्तर स्थिति दर्शाता है।
theological_decisions:
- issue: הַדְּבִיר के वास्तु-संबंधी अर्थ का अनुवाद
  choice: पवित्रतम स्थान
  alternative: भीतरी पवित्रस्थान
  rationale: सुलैमान के मन्दिर के संदर्भ में यह सबसे भीतरी कक्ष को सूचित करता है। मुख्य पाठ में परिचित पद रखा गया है और वैध शाब्दिक विकल्प को पादटिप्पणी में दिया गया है; इससे किसी सम्प्रदायगत व्याख्या का आयात नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली। कारणवाचक क्रिया, डंडों के सिरों की दृश्यता और स्थानिक संबंध को मूल के निकट रखते हुए हिन्दी वाक्य-विन्यास स्वाभाविक बनाया गया है।
