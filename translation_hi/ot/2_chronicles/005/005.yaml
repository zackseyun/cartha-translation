  edition: WLC
  text: וַ/יַּעֲל֤וּ אֶת הָ/אָרוֹן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת כָּל כְּלֵ֥י הַ/קֹּ֖דֶשׁ אֲשֶׁ֣ר בָּ/אֹ֑הֶל הֶעֱל֣וּ אֹתָ֔/ם הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/005.yaml
  text: And they brought up the ark[a], the tent of meeting, and all the holy vessels that were in the tent; the Levitical priests brought them up.
translation:
  language: hi
  text: वे सन्दूक, मिलाप का तम्बू और तम्बू में जो सभी पवित्र वस्तुएँ थीं, उन्हें ऊपर ले गए; लेवीय याजक[a] उन्हें ऊपर ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याजक, लेवी।”
    reason: मूल इब्रानी में दोनों संज्ञाएँ समानाधिकरण में हैं; मुख्य पाठ उनके सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וַיַּעֲלוּ / הֶעֱלוּ
  choice: ऊपर पहुँचाईं / ऊपर ले आए
  rationale: हिफ़ील रूप यहाँ पवित्र वस्तुओं को मन्दिर तक ऊपर ले जाने का भाव देता है। हिन्दी में अनावश्यक दोहराव से बचते हुए दोनों पदबंध दिशात्मक अर्थ बनाए रखते हैं; दूसरे प्रयोग में इब्रानी की पुनरुक्ति भी स्पष्ट रहती है।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: मूल पाठ में केवल ‘सन्दूक’ है, ‘वाचा का सन्दूक’ नहीं; इसलिए संक्षिप्त रूप रखा गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तम्बू
  rationale: यह पदबंध इब्रानी शब्दों के अर्थ को सीधे और हिन्दी बाइबलीय प्रयोग में सुबोध ढंग से व्यक्त करता है।
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: सभी पवित्र वस्तुएँ
  rationale: כְּלִים एक व्यापक शब्द है, जिसमें पात्र, उपकरण और अन्य सामग्री आ सकती है; ‘वस्तुएँ’ मूल की व्यापकता को बनाए रखता है।
- source_word: אֲשֶׁר בָּאֹהֶל
  choice: तम्बू में रखी
  rationale: सम्बन्धवाचक उपवाक्य पवित्र वस्तुओं का स्थान बताता है। ‘रखी’ हिन्दी में स्वाभाविक है और मूल में निहित अवस्थिति को व्यक्त करता है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजक
  rationale: यह स्वाभाविक हिन्दी में याजकों की लेवीय पहचान बताता है, बिना यह संकेत दिए कि सभी लेवी याजक थे। मूल की अधिक शाब्दिक समानाधिकरणीय रचना को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: הַכֹּהֲנִים הַלְוִיִּם का सम्बन्ध
  choice: लेवीय याजक
  alternative: याजक—लेवी
  rationale: मुख्य पाठ में यह रूप याजकों और लेवियों के बीच भेद मिटाए बिना वाक्य को स्वाभाविक रखता है। मूल की समानाधिकरणीय रचना और उसकी सम्भावित व्याख्यात्मक खुलावट पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सन्दूक,’ ‘मिलाप का तम्बू’ और ‘याजक’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। पादटिप्पणी का चिह्न उसी पदबंध के साथ है जिससे वह सम्बन्धित है।
