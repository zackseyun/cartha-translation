  text: And when the priests came out of the Holy Place—for all the priests who were present had consecrated themselves[a], without regard to divisions—
translation:
  language: hi
  text: और जब याजक पवित्रस्थान से बाहर निकले—क्योंकि वहाँ उपस्थित सभी याजकों ने अपने को पवित्र किया था; दल-विभागों के अनुसार क्रम का पालन नहीं किया गया था[a]—
  philosophy: optimal-equivalence
  footnotes:
