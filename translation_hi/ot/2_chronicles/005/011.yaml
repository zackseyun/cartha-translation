    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּצֵאת
  choice: और जब ... बाहर निकले
  rationale: וַיְהִי के साथ בְּצֵאת अगली घटना के लिए कालवाचक उपवाक्य बनाता है। यह हिन्दी में स्वाभाविक है और कथा की निरंतरता बनाए रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर में सेवा करने वाले כהנים के लिए प्रचलित और सटीक हिन्दी पद।
- source_word: מִן הַקֹּדֶשׁ
  choice: पवित्रस्थान से
  rationale: मन्दिर के पवित्र भाग के लिए प्रयुक्त הַקֹּדֶשׁ का संक्षिप्त और संदर्भानुकूल अनुवाद।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन से जुड़ी परिस्थिति का स्पष्टीकरण देता है।
- source_word: כָּל הַכֹּהֲנִים הַנִּמְצְאִים
  choice: वहाँ उपस्थित सभी याजकों
  rationale: הַנִּמְצְאִים का संदर्भगत अर्थ उस अवसर पर मौजूद या उपलब्ध लोगों से है; 'वहाँ उपस्थित' इसे सहज हिन्दी में व्यक्त करता है।
- source_word: הִתְקַדָּשׁוּ
  choice: अपने को पवित्र किया था
  rationale: हित्पएल रूप याजकों की विधिपूर्वक आत्म-तैयारी या शुद्धीकरण को दर्शाता है। यह हिन्दी में समझने योग्य है और क्रिया की आत्मवाचकता बचाता है।
- source_word: אֵין לִשְׁמֹר לְמַחְלְקוֹת
  choice: वे अपने दल-विभागों के क्रम का पालन नहीं कर रहे थे
  rationale: यह पद सामान्य याजकीय दलों या सेवा-क्रमों को उस अवसर पर न मानने की बात कहता है। हिन्दी वाक्य स्रोत के नकारात्मक भाव और संस्थागत संदर्भ दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: याजकों की धार्मिक-विधि संबंधी तैयारी
  choice: अपने को पवित्र किया था
  alternative: अपने को शुद्ध किया था / अपने को समर्पित किया था
  rationale: यहाँ क्रिया मन्दिर-सेवा से पहले की विधिपूर्वक तैयारी बताती है। चुना हुआ अनुवाद नैतिक सिद्धता या किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा को आरोपित किए बिना मूल के קדש शब्द-समूह से संबंध बनाए रखता है।
- issue: याजकीय दलों की व्यवस्था
  choice: अपने दल-विभागों के क्रम का पालन नहीं कर रहे थे
  alternative: दल-विभागों का विचार किए बिना
  rationale: מַחְלְקוֹת से याजकों के संगठित सेवा-दल अभिप्रेत हैं। अनुवाद इस प्रशासनिक-विधिक अर्थ को प्रकट करता है, पर यह दावा नहीं करता कि व्यवस्था स्थायी रूप से रद्द कर दी गई थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के अंत में दीर्घ विराम-चिह्न रखा गया है, क्योंकि इब्रानी वाक्य की रचना अगले पद में आगे बढ़ती है। 'दल-विभाग' के साथ 'क्रम' सामान्य याजकीय सेवा-पारियों का आशय स्पष्ट करता है।
