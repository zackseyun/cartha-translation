  text: אֵ֚ין בָּֽ/אָר֔וֹן רַ֚ק שְׁנֵ֣י הַ/לֻּח֔וֹת אֲשֶׁר נָתַ֥ן מֹשֶׁ֖ה בְּ/חֹרֵ֑ב אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִם בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/010.yaml
  text: There was nothing in the ark except the two tablets that Moses put there at Horeb[b][a], where Yahweh made a covenant with the people of Israel when they came out of Egypt.
translation:
  language: hi
  text: सन्दूक में उन दो पटियाओं के सिवा और कुछ नहीं था, जिन्हें मूसा ने होरेब में रखा था।[a] होरेब में ही याहवे ने इस्राएलियों के साथ वाचा की थी, जब वे मिस्र से निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का शाब्दिक अर्थ ‘दिया’ है; इस प्रसंग में इसका अर्थ पटियाओं को रखना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין בָּאָרוֹן רַק
  choice: सन्दूक में ... के सिवा और कुछ नहीं था
  rationale: हिब्रू के अस्तित्ववाचक निषेध और सीमाबोधक רַק को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁנֵי הַלֻּחוֹת
  choice: दो पटियाएँ
  rationale: לֻחוֹת का सामान्य अर्थ ‘पटियाएँ’ है; इस पद में ‘पत्थर की’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: אֲשֶׁר נָתַן מֹשֶׁה
  choice: जिन्हें मूसा ने ... उसमें रखा था
  rationale: נָתַן का मूल अर्थ ‘दिया’ है, पर सन्दूक के भीतर रखी वस्तुओं के इस प्रसंग में इसका स्थानवाचक भाव ‘रखा’ है। ‘उसमें’ जोड़ने से हिन्दी में सन्दूक से सम्बन्ध स्पष्ट और स्वाभाविक होता है।
- source_word: בְּחֹרֵב
  choice: होरेब में
  rationale: हिब्रू स्थाननाम होरेब को ज्यों का त्यों रखा गया है; इसे सीनै से समरूप बनाकर नहीं बदला गया।
- source_word: אֲשֶׁר כָּרַת יְהוָה עִם
  choice: वहीं याहवे ने ... के साथ ... वाचा बाँधी थी
  rationale: כָּרַת के साथ ‘वाचा’ पाठ में निहित है। हिन्दी का प्रचलित बाइबलीय मुहावरा ‘वाचा बाँधना’ हिब्रू ‘काटना’ की मुहावरेदार शक्ति को स्वाभाविक रूप से व्यक्त करता है। ‘वहीं’ निकटतम स्थानवाचक पूर्वपद होरेब की ओर संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को पदवी से बदलने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ का यहाँ सामूहिक अर्थ है; ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और समावेशी जातिवाचक रूप है।
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: जब वे मिस्र से निकले थे
  rationale: समयवाचक בְּ और क्रियार्थक रूप को सहज हिन्दी उपवाक्य में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ विशिष्ट चतुरक्षरीय नाम का प्रयोग करता है; ‘याहवे’ उसे पदवी में बदले बिना सुरक्षित रखता है।
- issue: אֲשֶׁר כָּרַת में निहित वाचा
  choice: वाचा बाँधी
  alternative: '[जिसे] काटा'
  rationale: हिब्रू में בְּרִית (‘वाचा’) व्यक्त नहीं, पर כָּרַת ... עִם का सन्दर्भ वाचा बाँधने का मुहावरा है। हिन्दी में ‘वाचा’ स्पष्ट करना अर्थ को सामने लाता है, कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्दूक’, ‘पटियाएँ’ और ‘वाचा बाँधी’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। दो वाक्यों में विभाजन हिन्दी में स्पष्टता देता है, जबकि ‘वहीं’ दूसरे सम्बन्धवाचक उपवाक्य को होरेब से जोड़ता है।
