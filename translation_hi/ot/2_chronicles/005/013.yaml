  text: וַ/יְהִ֣י כְ֠/אֶחָד ל/מחצצרים וְ/לַ/מְשֹֽׁרֲרִ֜ים לְ/הַשְׁמִ֣יעַ קוֹל אֶחָ֗ד לְ/הַלֵּ֣ל וּ/לְ/הֹדוֹת֮ לַ/יהוָה֒ וּ/כְ/הָרִ֣ים ק֠וֹל בַּ/חֲצֹצְר֨וֹת וּ/בִ/מְצִלְתַּ֜יִם וּ/בִ/כְלֵ֣י הַ/שִּׁ֗יר וּ/בְ/הַלֵּ֤ל לַ/יהוָה֙ כִּ֣י ט֔וֹב כִּ֥י לְ/עוֹלָ֖ם חַסְדּ֑/וֹ וְ/הַ/בַּ֛יִת מָלֵ֥א עָנָ֖ן בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/013.yaml
  text: And it came about[a], as the trumpeters and the singers were as one, to make one sound in praising and giving thanks to Yahweh, and when they lifted up their voice with trumpets and cymbals and instruments for song, and in praising Yahweh, “For he is good, for his steadfast love endures forever,” the house, the house of Yahweh[c][b], was filled with a cloud.
translation:
  language: hi
  text: और ऐसा हुआ कि तुरही बजानेवाले और गायक एक होकर[a] याहवे की स्तुति करने और धन्यवाद देने के लिए एक ही स्वर उत्पन्न कर रहे थे; और जब उन्होंने तुरहियों, झाँझों और संगीत के वाद्यों के साथ ऊँचा स्वर उठाया और याहवे की स्तुति की[b]—“क्योंकि वह भला है, क्योंकि उसका अटल प्रेम[c] सदा बना रहता है”—तब भवन—याहवे का भवन—बादल से भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एकजुट होकर” या “एक स्वर में।”
    reason: כְאֶחָד सहभागी समूहों की एकता को दर्शाता है; आगे “एक ही स्वर” संयुक्त ध्वनि को व्यक्त करता है।
  - marker: b
    text: या, “याहवे की स्तुति करते हुए, ‘क्योंकि वह भला है...’” मूल पाठ में “कहते हुए” का अलग क्रियापद नहीं है।
    reason: वाक्यांश וּבְהַלֵּל לַיהוָה उद्धृत स्तुति से कैसे जुड़ता है, इसमें अनुवादगत विकल्प है।
  - marker: c
    text: “अटल प्रेम” इब्रानी חֶסֶד का अनुवाद है; इसमें निष्ठावान प्रेम, करुणा और दया के भाव शामिल हो सकते हैं।
    reason: प्रमुख इब्रानी शब्द की अर्थ-व्याप्ति स्पष्ट करना।
lexical_decisions:
- source_word: כְאֶחָד ... קוֹל אֶחָד
  choice: एक होकर ... एक ही स्वर
  rationale: ‘एक’ की पुनरावृत्ति गायकों और तुरही बजानेवालों की एकता तथा उनसे निकलनेवाली संयुक्त ध्वनि—दोनों को बनाए रखती है।
- source_word: למחצצרים וְלַמְשֹׁרֲרִים
  choice: तुरही बजानेवाले और गायक
  rationale: दोनों सहभागी समूहों को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में अलग-अलग व्यक्त करता है।
- source_word: לְהַלֵּל וּלְהֹדוֹת לַיהוָה
  choice: याहवे की स्तुति और उसका धन्यवाद करने के लिए
  rationale: दोनों उद्देश्यवाचक क्रियाओं को अलग बनाए रखता है; ‘उसका धन्यवाद’ हिन्दी में स्वाभाविक है।
- source_word: וּכְהָרִים קוֹל
  choice: और जब उन्होंने ... ऊँचा स्वर उठाकर
  rationale: एकवचन קוֹל की सामूहिक ध्वनि को ‘स्वर’ से व्यक्त करते हुए खंड का कालगत संबंध सुरक्षित रखा गया है।
- source_word: בַּחֲצֹצְרוֹת וּבִמְצִלְתַּיִם וּבִכְלֵי הַשִּׁיר
  choice: तुरहियों, झाँझों और संगीत के वाद्यों के साथ
  rationale: वाद्यों की तीन श्रेणियाँ सुरक्षित रहती हैं और כְּלֵי הַשִּׁיר का अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: כִּי טוֹב כִּי לְעוֹלָם חַסְדּוֹ
  choice: क्योंकि वह भला है, क्योंकि उसका अटल प्रेम सदा बना रहता है
  rationale: उपासना-सूत्र में दोनों כִּי खंडों को रखा गया है; ‘अटल प्रेम’ חֶסֶד की स्थायी, निष्ठावान भलाई को सुबोध हिन्दी में व्यक्त करता है।
- source_word: וְהַבַּיִת מָלֵא עָנָן בֵּית יְהוָה
  choice: तब भवन, अर्थात् याहवे का भवन, बादल से भर गया
  rationale: ‘भवन’ की इब्रानी पुनरुक्ति को स्पष्टीकरणात्मक पदबंध में सुरक्षित रखा गया है और अनिश्चित עָנָן को ‘बादल’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को उपाधि में बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- issue: חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: करुणा; दया; विश्वासयोग्य प्रेम
  rationale: यह चयन प्रेमपूर्ण भलाई के साथ उसकी स्थिरता और निष्ठा को भी व्यक्त करता है, बिना किसी एक संप्रदायगत व्याख्या को थोपे।
- issue: וּבְהַלֵּל לַיהוָה के बाद उद्धृत वचन का संबंध
  choice: याहवे की स्तुति की—“क्योंकि...”
  alternative: याहवे की स्तुति करते हुए कहने लगे, “क्योंकि...”
  rationale: मूल में ‘कहना’ क्रिया स्पष्ट नहीं है; मुख्य पाठ उसे जोड़े बिना उद्धरण को स्तुति की विषयवस्तु के रूप में प्रस्तुत करता है, जबकि वैकल्पिक स्वाभाविक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना के प्रसंग के अनुकूल रखी गई है। लंबे इब्रानी वाक्य को हिन्दी में प्रवाह देने के लिए ‘जब ... और जब ... तब’ संरचना तथा उद्धरण के चारों ओर डैश का प्रयोग किया गया है।
