base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/001.yaml
  text: Thus all the work that Solomon had done for the house of Yahweh was finished. Then Solomon brought in the holy things of David his father[a], and the silver, the gold, and all the vessels; he put them into the treasuries of the house of God.
translation:
  language: hi
  text: इस प्रकार वह सारा काम पूरा हो गया जो सुलैमान ने याहवे के भवन के लिए किया था। तब सुलैमान अपने पिता दाऊद की पवित्र वस्तुएँ[a]—चाँदी, सोना और सभी पात्र—भीतर ले आया और उन्हें परमेश्वर के भवन के भंडारों में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता दाऊद द्वारा समर्पित वस्तुएँ”; अथवा, “अपने पिता दाऊद की पवित्र की हुई वस्तुएँ।”
    reason: कָדְשֵׁי का अर्थ पवित्र, समर्पित, या पवित्र उपयोग के लिए अलग रखी हुई वस्तुएँ हो सकता है; दाऊद के साथ संबंध को मुख्य पाठ में खुला रखा गया है।
