  text: וַ/יִּהְי֤וּ הַ/כְּרוּבִים֙ פֹּרְשִׂ֣ים כְּנָפַ֔יִם עַל מְק֖וֹם הָ/אָר֑וֹן וַ/יְכַסּ֧וּ הַ/כְּרוּבִ֛ים עַל הָ/אָר֥וֹן וְ/עַל בַּדָּ֖י/ו מִ/לְ/מָֽעְלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/008.yaml
  text: And the cherubim were spreading out their wings over the place of the ark[a], and the cherubim covered the ark and its poles from above.
translation:
  language: hi
  text: और करूब सन्दूक के स्थान के ऊपर अपने पंख फैलाए हुए थे[a], और करूब सन्दूक और उसके डंडों को ऊपर से ढके हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सन्दूक के स्थान के ऊपर पंख फैलाए हुए थे।’
    reason: शब्दक्रम का वैकल्पिक रूप; ‘सन्दूक का स्थान’ और उसके ऊपर पंख फैलाने का मूल अर्थ यथावत रहता है।
lexical_decisions:
- source_word: וַיִּהְיוּ ... פֹּרְשִׂים
  choice: फैलाए हुए थे
  rationale: היה के साथ वर्तमान कृदन्त यहाँ लगातार बनी हुई मुद्रा या अवस्था व्यक्त करता है; हिन्दी में ‘फैलाए हुए थे’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַכְּרוּבִים
  choice: करूब
  rationale: मन्दिर और सन्दूक से जुड़े इन स्वर्गीय प्राणियों के लिए प्रचलित बाइबलीय लिप्यन्तरण ‘करूब’ रखा गया है; हिन्दी में यही रूप बहुवचन सन्दर्भ में भी स्वाभाविक है।
- source_word: כְּנָפַיִם
  choice: अपने पंख
  rationale: मूल में ‘पंख’ हैं; सम्बन्धवाचक ‘अपने’ हिन्दी में कर्ता करूबों से उनका सम्बन्ध स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַל מְקוֹם הָאָרוֹן
  choice: सन्दूक के स्थान के ऊपर
  rationale: מָקוֹם का शाब्दिक अर्थ ‘स्थान’ सुरक्षित रखा गया है, क्योंकि अगली उपवाक्य में स्वयं सन्दूक का अलग उल्लेख है।
- source_word: וַיְכַסּוּ
  choice: ढके हुए थे
  rationale: כסה का सामान्य अर्थ ‘ढकना’ है। यहाँ पंखों की स्थिर स्थिति का वर्णन होने के कारण हिन्दी में अवस्थासूचक रूप उपयुक्त है।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: वाचा के पवित्र पात्र के लिए स्पष्ट, प्रतिष्ठित और सामान्य हिन्दी बाइबलीय पद।
- source_word: בַּדָּיו
  choice: उसके डण्डों
  rationale: ये सन्दूक को उठाकर ले जाने वाले डण्डे हैं; ‘डण्डे’ आधुनिक पाठक के लिए सहज है और मूल वस्तु को सीधे व्यक्त करता है।
- source_word: מִלְמָעְלָה
  choice: ऊपर से
  rationale: उपसर्गयुक्त क्रियाविशेषण आवरण की दिशा अथवा स्थिति ‘ऊपर से’ बताता है।
