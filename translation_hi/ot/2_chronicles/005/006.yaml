  text: וְ/הַ/מֶּ֣לֶךְ שְׁלֹמֹ֗ה וְ/כָל עֲדַ֧ת יִשְׂרָאֵ֛ל הַ/נּוֹעָדִ֥ים עָלָ֖י/ו לִ/פְנֵ֣י הָ/אָר֑וֹן מְזַבְּחִים֙ צֹ֣אן וּ/בָקָ֔ר אֲשֶׁ֧ר לֹֽא יִסָּפְר֛וּ וְ/לֹ֥א יִמָּנ֖וּ מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/006.yaml
  text: And King Solomon and all the assembly of Israel who had assembled before him[a], before the ark[b], were sacrificing sheep and cattle that could not be counted or numbered because of their great number.
translation:
  language: hi
  text: राजा सुलैमान और इस्राएल की सारी सभा, जो उसके साथ इकट्ठी हुई थी[a], सन्दूक के सामने इतनी भेड़-बकरियाँ और गाय-बैल बलि चढ़ा रहे थे कि बहुतायत के कारण न तो उनकी गिनती हो सकती थी, न उनका लेखा लगाया जा सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके सामने इकट्ठी हुई थी।” इब्रानी पदबंध का अर्थ सुलैमान के साथ इकट्ठा होना या उसकी उपस्थिति में उसके सामने इकट्ठा होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: ‘सभा’ एकत्र समुदाय के सामूहिक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; כָל का भाव ‘सारी’ से स्पष्ट होता है।
- source_word: הַנּוֹעָדִים עָלָיו
  choice: जो उसके साथ इकट्ठी हुई थी
  rationale: निफ़अल रूप एकत्र होने को दर्शाता है। עָלָיו यहाँ सुलैमान की उपस्थिति में या उसके साथ इकट्ठे होने का अर्थ दे सकता है; मुख्य पाठ में सहज ‘उसके साथ’ रखा गया और दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: לִפְנֵי הָאָרוֹן
  choice: सन्दूक के सामने
  rationale: स्थान-सूचक वाक्यांश का सीधा, स्पष्ट अनुवाद है; प्रसंग से यह वाचा का पवित्र सन्दूक है।
- source_word: מְזַבְּחִים
  choice: बलि कर रही थी
  rationale: कृदन्त दृश्य में चल रही क्रिया को व्यक्त करता है; ‘बलि कर रही थी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: צֹאן व्यापक रूप से छोटे पालतू पशुओं, विशेषतः भेड़-बकरियों, को और בָּקָר बड़े मवेशियों को दर्शाता है; यह अनुवाद दोनों वर्गों को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: אֲשֶׁר לֹא יִסָּפְרוּ וְלֹא יִמָּנוּ
  choice: उन्हें गिना या उनकी संख्या ठहराई नहीं जा सकती थी
  rationale: दो निकटार्थक इब्रानी क्रियाओं की जोरदार पुनरुक्ति को हिन्दी में दो अलग अभिव्यक्तियों से बनाए रखा गया है।
- source_word: מֵרֹב
  choice: उनकी बहुतायत के कारण
  rationale: यह पशुओं को न गिन पाने का कारण बताता है और मूल की संक्षिप्तता तथा औपचारिकता बनाए रखता है।
theological_decisions:
- issue: सभा और सुलैमान के सम्बन्ध में עָלָיו की अस्पष्टता
  choice: उसके साथ इकट्ठी हुई थी
  alternative: उसके सामने इकट्ठी हुई थी
  rationale: इब्रानी पदबंध सुलैमान के साथ एकत्र होने या उसकी उपस्थिति में उसके सामने एकत्र होने—दोनों अर्थों की अनुमति देता है। किसी एक अर्थ को सिद्धान्तगत रूप से निर्णायक न बनाते हुए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘सन्दूक’ इस निकट प्रसंग में पर्याप्त स्पष्ट है; पशु-वर्गों को ‘भेड़-बकरियाँ और गाय-बैल’ कहकर צֹאן וּבָקָר की व्यापकता बचाई गई है।
