  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֣יאוּ הַ֠/כֹּהֲנִים אֶת אֲר֨וֹן בְּרִית יְהוָ֧ה אֶל מְקוֹמ֛/וֹ אֶל דְּבִ֥יר הַ/בַּ֖יִת אֶל קֹ֣דֶשׁ הַ/קְּדָשִׁ֑ים אֶל תַּ֖חַת כַּנְפֵ֥י הַ/כְּרוּבִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/007.yaml
  text: Then the priests brought the ark of the covenant of Yahweh to its place[a], into the inner sanctuary of the house, into the Most Holy Place, under the wings of the cherubim.
translation:
  language: hi
  text: तब याजक याहवे की वाचा का संदूक उसके स्थान पर ले आए—मंदिर के भीतरी पवित्रस्थान में, परमपवित्र स्थान में[a], करूबों के पंखों के नीचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रों का पवित्र स्थान।”
    reason: קֹדֶשׁ הַקְּדָשִׁים की तीव्रतासूचक इब्रानी रचना का अधिक निकट वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: ले आए
  rationale: हिफ़ील रूप का अर्थ ‘लाना’ है। संदूक को भवन के भीतर निर्धारित स्थान तक पहुँचाने के प्रसंग में ‘ले आए’ स्वाभाविक और सटीक है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: निश्चित बहुवचन संज्ञा का सीधा और प्रचलित हिन्दी रूप।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: इब्रानी संबंध-श्रृंखला को स्वाभाविक हिन्दी में रखते हुए संदूक का वाचा और याहवे से संबंध स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מְקוֹמוֹ
  choice: उसके स्थान पर
  rationale: प्रत्यय का संदर्भ संदूक से है। यह अनुवाद उसके निर्धारित स्थान का भाव बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: דְּבִיר הַבַּיִת
  choice: भवन के भीतरी पवित्रस्थान में
  rationale: דְּבִיר मंदिर के सबसे भीतरी कक्ष को दर्शाता है। ‘भीतरी पवित्रस्थान’ उसके धार्मिक कार्य को स्पष्ट करता है, जबकि ‘भवन’ בַּיִת के रूपक को बनाए रखता है।
- source_word: קֹדֶשׁ הַקְּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: इब्रानी की तीव्रतासूचक संबंध-रचना का स्पष्ट, प्रचलित और आधुनिक हिन्दी रूप।
- source_word: תַּחַת כַּנְפֵי הַכְּרוּבִים
  choice: करूबों के पंखों के नीचे
  rationale: पूर्वसर्ग और संबंध-रचना को निकटता से रखा गया है; כְּרוּבִים के लिए प्रचलित धार्मिक लिप्यंतरण ‘करूब’ अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। डैश और ‘अर्थात’ से मְקוֹמוֹ, דְּבִיר और קֹדֶשׁ הַקְּדָשִׁים के क्रमिक स्थान-विवरण का संबंध स्पष्ट किया गया है।
