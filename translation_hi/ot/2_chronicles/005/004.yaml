lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא के क्रमिक कथात्मक रूप को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּל
  choice: सभी
  rationale: इस्राएल के पुरनियों की समग्रता को स्पष्ट रूप से बनाए रखता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनिए
  rationale: ‘पुरनिए’ यहाँ आयु-मात्र नहीं, बल्कि समुदाय के मान्य वरिष्ठ अगुवों को सूचित करता है और बाइबलीय पद की प्रतिनिधिक भावना को बनाए रखता है।
- source_word: וַיִּשְׂאוּ
  choice: उठाकर ले चले
  rationale: נשׂא यहाँ सन्दूक को उठाकर एक स्थान से दूसरे स्थान तक ले जाने की क्रिया बताता है; यह हिन्दी में केवल ‘उठाया’ की अपेक्षा प्रसंगगत गति को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लֵוִיִּם के लिए प्रचलित और सटीक हिन्दी जाति-समूह नाम है।
- source_word: אֶת הָאָרוֹן
  choice: सन्दूक
  rationale: मूल पाठ में केवल ‘सन्दूक’ है। प्रसंग में यह वाचा का सन्दूक है, पर मुख्य पाठ में स्रोत से अधिक विस्तार नहीं जोड़ा गया।
theological_decisions:
- issue: ‘सन्दूक’ की पहचान
  choice: मुख्य पाठ में केवल ‘सन्दूक’
  alternative: ‘वाचा का सन्दूक’
  rationale: हिब्रू पद में केवल הָאָרוֹן है। संदर्भ से उसकी पहचान स्पष्ट है, इसलिए अतिरिक्त पहचान को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरनिए’ को इस्राएल के मान्य वरिष्ठ अगुवों के संस्थागत अर्थ में लिया गया है। पादटिप्पणी का चिह्न ‘सन्दूक’ के बाद रखा गया है, क्योंकि टिप्पणी उसी की पहचान स्पष्ट करती है।
