base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/012.yaml
  text: And the Levites who were the singers—all of them[a], Asaph, Heman, Jeduthun, and their sons and their brothers—were clothed in fine linen, with cymbals, harps, and lyres, standing east of the altar[b]; and with them were one hundred twenty priests blowing trumpets.
translation:
  language: hi
  text: और गायक लेवी—वे सब, अर्थात् आसाप, हेमान और यदूतून, तथा उनके पुत्र और उनके भाई—महीन लिनन के वस्त्र पहने हुए, झाँझ, हार्प[a] और वीणाएँ लिए, वेदी के पूर्व में[b] खड़े थे; और उनके साथ एक सौ बीस याजक तुरहियाँ बजा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हार्प जैसे वाद्य”; यहाँ प्रयुक्त दोनों प्राचीन तारवाद्यों के बीच ठीक-ठीक अंतर निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “वेदी की पूर्वी ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְוִיִּם הַמְשֹׁרֲרִים
  choice: गायक लेवी
  rationale: निश्चित पद और भूमिका-सूचक कृदंत को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְכֻלָּם
  choice: वे सभी
  rationale: यह स्पष्ट करता है कि बताए गए अगुवे और उनसे जुड़े पुत्र तथा भाई सभी सम्मिलित थे।
- source_word: לְאָסָף לְהֵימָן לִידוּתוּן
  choice: आसाप, हेमान और यदूतून
  rationale: व्यक्तिवाचक नामों का प्रचलित हिंदी लिप्यंतरण।
- source_word: וְלִבְנֵיהֶם וְלַאֲחֵיהֶם
  choice: तथा उनके पुत्र और भाई
  rationale: मूल के पारिवारिक शब्दों को बनाए रखता है; प्रसंग में ‘भाई’ सहकर्मी कुल-सदस्यों को भी सूचित कर सकता है।
- source_word: מְלֻבָּשִׁים בּוּץ
  choice: महीन सन के वस्त्र पहने
  rationale: पवित्र सेवा में प्रयुक्त उत्तम गुणवत्ता के लिनन और निष्क्रिय वेशभूषा-सूचक भाव को स्पष्ट करता है।
- source_word: בִּמְצִלְתַּיִם
  choice: झाँझ
  rationale: इस तालवाद्य का मानक और सर्वबोध्य हिंदी नाम।
- source_word: וּבִנְבָלִים
  choice: हार्प
  rationale: नֶבֶל के लिए व्यापक रूप से समझा जाने वाला पारंपरिक समतुल्य; प्राचीन वाद्य की सटीक बनावट अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: וְכִנֹּרוֹת
  choice: वीणाएँ
  rationale: कִנּוֹר को दूसरे तारवाद्य नֶבֶל से अलग रखते हुए स्वाभाविक हिंदी वाद्य-शब्द देता है।
- source_word: עֹמְדִים מִזְרָח לַמִּזְבֵּחַ
  choice: वेदी के पूर्व में खड़े थे
  rationale: स्थान-सूचक प्रयोग को सीधे रखता है और उसकी संभावित व्याख्या पादटिप्पणी में सुरक्षित करता है।
- source_word: וְעִמָּהֶם כֹּהֲנִים לְמֵאָה וְעֶשְׂרִים מחצררים בַּחֲצֹצְרוֹת
  choice: उनके साथ एक सौ बीस याजक तुरहियाँ बजा रहे थे
  rationale: संख्या, साथ होने का संबंध और तुरही बजाने की जारी क्रिया को स्वाभाविक हिंदी वाक्य में व्यक्त करता है।
