id: 2CH.5.14
reference: 2 Chronicles 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹא יָֽכְל֧וּ הַ/כֹּהֲנִ֛ים לַ/עֲמ֥וֹד לְ/שָׁרֵ֖ת מִ/פְּנֵ֣י הֶ/עָנָ֑ן כִּֽי מָלֵ֥א כְבוֹד יְהוָ֖ה אֶת בֵּ֥ית הָ/אֱלֹהִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/005/014.yaml
  text: and the priests could not stand to minister because of the cloud[a], for the glory of Yahweh filled the house of God.
translation:
  language: hi
  text: और बादल के कारण याजक सेवा करने के लिए खड़े न रह सके, क्योंकि याहवे की महिमा से परमेश्वर का भवन[a] भर गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का मन्दिर।” शाब्दिक अर्थ, “परमेश्वर का भवन।”
    reason: शाब्दिक पद ‘भवन’ प्रसंग में मन्दिर को सूचित करता है; वैकल्पिक अर्थ पाठक को स्पष्ट किया गया है।
lexical_decisions:
- source_word: יָכְלוּ
  choice: सके
  rationale: यह क्रिया सामर्थ्य या क्षमता बताती है; निषेध के साथ ‘न रह सके’ स्वाभाविक हिन्दी में उनकी असमर्थता व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह निश्चित बहुवचन संज्ञा मन्दिर में सेवा करने वाले याजकों को सूचित करती है।
- source_word: לַעֲמוֹד
  choice: खड़े न रह सके
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; प्रसंग में बादल के कारण अपने सेवा-स्थान पर खड़े न रह पाने का भाव है।
- source_word: לְשָׁרֵת
  choice: सेवा करने के लिए
  rationale: याजकीय प्रसंग में שרת उपासना-सम्बन्धी सेवा को दर्शाता है; ‘सेवा करना’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: מִפְּנֵי הֶעָנָן
  choice: बादल के कारण
  rationale: מִפְּנֵי यहाँ कारण व्यक्त करता है; हिन्दी में यह वाक्यांश उसी सम्बन्ध को सहज रूप से प्रकट करता है।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: सम्बन्धवाचक इब्रानी पदबंध को सीधे और स्वाभाविक ढंग से प्रस्तुत किया गया है तथा व्यक्तिगत दिव्य नाम को लिप्यन्तरित किया गया है।
- source_word: מָלֵא ... אֶת בֵּית הָאֱלֹהִים
  choice: महिमा से परमेश्वर का भवन भर गया था
  rationale: इब्रानी में महिमा भवन को भरती है; हिन्दी का ‘से ... भर गया’ निर्माण अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह पदबंध का निकट शाब्दिक अनुवाद है और प्रसंग में मन्दिर को सूचित करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खड़े न रह सके’ मूल के ठोस बिम्ब को बनाए रखता है, जबकि ‘सेवा करने’ से याजकीय कार्य का प्रसंग स्पष्ट रहता है।
