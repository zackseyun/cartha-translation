base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/009.yaml
  text: And behold[a], for the woodcutters, the cutters of the trees, I have given to your servants twenty thousand kors of crushed wheat, and twenty thousand kors of barley, and twenty thousand baths of wine[c][b], and twenty thousand baths of oil.
translation:
  language: hi
  text: और देखो, तुम्हारे सेवकों—लकड़ी काटनेवालों, अर्थात पेड़ काटनेवालों—के लिए मैंने बीस हज़ार कोर[b] कूटा हुआ गेहूँ[a], बीस हज़ार कोर जौ, बीस हज़ार बत[c] दाखमधु और बीस हज़ार बत तेल दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू अभिव्यक्ति असामान्य है; इसका अर्थ सम्भवतः “भोजन के लिए गेहूँ” या “कुचला हुआ गेहूँ” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कोर सूखी वस्तुओं को नापने की एक प्राचीन इकाई थी।
    reason: cultural_note
  - marker: c
    text: बत तरल पदार्थों को नापने की एक प्राचीन इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: संयोजक और ध्यान आकर्षित करनेवाले हिब्रू पद, दोनों को सहज किंतु गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: לַחֹטְבִים לְכֹרְתֵי הָעֵצִים
  choice: लकड़ी काटनेवालों—अर्थात पेड़ काटनेवाले
  rationale: दो निकटार्थक कृदंत अभिव्यक्तियों को मिटाने के बजाय दूसरी को पहली का स्पष्टीकरण बनाकर संरक्षित किया गया है; प्रसंग में पेड़ इमारती लकड़ी के लिए काटे जा रहे हैं।
- source_word: נָתַתִּי
  choice: मैंने ... दिया है
  rationale: हिब्रू पूर्ण क्रिया पत्र में की गई निश्चित व्यवस्था या प्रतिबद्धता व्यक्त करती है; हिन्दी पूर्ण वर्तमान इस भाव को स्वाभाविक रूप से देता है।
- source_word: חִטִּים מַכּוֹת
  choice: कूटा हुआ गेहूँ
  rationale: मַכּוֹת असामान्य और पाठगत रूप से कठिन है; इसे प्रसंस्कृत या कूटे हुए गेहूँ के रूप में समझा गया है, जबकि अन्य सम्भावना पादटिप्पणी में रखी गई है।
- source_word: לַעֲבָדֶיךָ
  choice: तुम्हारे सेवकों के लिए
  rationale: लामेद को लाभार्थक अर्थ में लिया गया है; सेवक यहाँ श्रमिकों के रूप में काम कर रहे हैं, फिर भी मूल शब्द का सामान्य अर्थ बनाए रखा गया है।
- source_word: כֹּרִים
  choice: कोर
  rationale: प्राचीन सूखी मात्रा को अनिश्चित आधुनिक इकाई में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בַּתִּים
  choice: बत
  rationale: प्राचीन तरल मात्रा को स्रोत-संस्कृति की इकाई के रूप में लिप्यंतरित रखा गया है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יַיִן के लिए स्पष्ट, प्रतिष्ठित और आधुनिक हिन्दी बाइबलीय शब्द; किण्वित पेय का अर्थ सुरक्षित रखता है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: मूल में केवल 'तेल' है; सम्भावित जैतून का तेल जोड़कर अनावश्यक विशिष्टता नहीं लाई गई।
- source_word: עֶשְׂרִים אֶלֶף
  choice: बीस हज़ार
  rationale: हर सामग्री के साथ दी गई संख्या को अक्षरशः बनाए रखा गया है।
