source:
  edition: WLC
  text: וְ/עַתָּ֗ה שָׁלַ֧חְתִּי אִישׁ חָכָ֛ם יוֹדֵ֥עַ בִּינָ֖ה לְ/חוּרָ֥ם אָבִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/012.yaml
  text: And now I have sent a wise man[a], skilled in understanding, Huram-abi.
translation:
  language: hi
  text: और अब मैंने एक बुद्धिमान और समझ-बूझ रखनेवाले व्यक्ति को भेजा है—हूराम-अबी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: हूराम-अबी। अंतिम शब्द का शाब्दिक अर्थ ‘मेरे पिता’ है, पर यहाँ वह संभवतः सम्मानसूचक उपाधि या कारीगर के पदनाम का अंग है; 2 इतिहास 4:16 में ‘हूराम, उसके पिता’ से तुलना करें।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण को रखते हुए यह राजा के उत्तर में अगले कदम को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: שָׁלַחְתִּי
  choice: मैंने ... भेजा है
  rationale: इब्रानी पूर्ण क्रिया यहाँ पूरी हो चुकी किंतु वर्तमान संदर्भ में प्रासंगिक कार्रवाई व्यक्त करती है; हिन्दी का पूर्ण वर्तमान इसके अनुकूल है।
- source_word: אִישׁ
  choice: व्यक्ति
  rationale: संदर्भ में पुरुष कारीगर है, पर आधुनिक हिन्दी में विशेषण-समूह के साथ ‘व्यक्ति’ अधिक स्वाभाविक और गरिमापूर्ण है; नाम से उसकी विशिष्ट पहचान स्पष्ट है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह मूल अर्थ ‘बुद्धिमान’ को बनाए रखता है; कारीगरी के संदर्भ में निहित व्यावहारिक कुशलता को अगले पदबंध से बल मिलता है।
- source_word: יוֹדֵעַ בִּינָה
  choice: समझ-बूझ रखनेवाला
  rationale: शाब्दिक ‘समझ को जाननेवाला’ की अपेक्षा यह सहज हिन्दी है और बौद्धिक अंतर्दृष्टि तथा व्यावहारिक योग्यता दोनों का संकेत देती है।
- source_word: לְחוּרָם אָבִי
  choice: हूराम-अबी
  rationale: कठिन पदबंध को कारीगर के नाम अथवा सम्मानसूचक पदनाम के रूप में लिप्यंतरित करने से ‘मेरे पिता’ जैसी संभावित भ्रामक पारिवारिक व्याख्या मुख्य पाठ पर थोपी नहीं जाती और मूल की अस्पष्टता बनी रहती है।
theological_decisions:
- issue: לְחוּרָם אָבִי में אָבִי का अर्थ
  choice: कारीगर के नाम/पदनाम के अंग के रूप में ‘हूराम-अबी’
  alternative: ‘हूराम, मेरे पिता’ अथवा ‘हूराम, मेरा प्रधान कारीगर’
  rationale: ‘पिता’ शब्द जैविक संबंध के अतिरिक्त किसी गुरु, सलाहकार या उच्च अधिकारी के सम्मानसूचक पद के रूप में भी प्रयुक्त हो सकता है। लिप्यंतरण किसी एक विवादित अर्थ को निर्णायक बनाए बिना इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘समझ-बूझ रखनेवाला’ सामान्य पाठक के लिए स्वाभाविक है। कठिन नाम-पदनाम को मुख्य पाठ में लिप्यंतरित कर पादटिप्पणी में उसकी शाब्दिक और संभावित सम्मानसूचक व्याख्या दी गई है।
