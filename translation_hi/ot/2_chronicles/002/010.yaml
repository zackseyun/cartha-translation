  text: וַ/יֹּ֨אמֶר חוּרָ֤ם מֶֽלֶךְ צֹר֙ בִּ/כְתָ֔ב וַ/יִּשְׁלַ֖ח אֶל שְׁלֹמֹ֑ה בְּ/אַהֲבַ֤ת יְהוָה֙ אֶת עַמּ֔/וֹ נְתָנְ/ךָ֥ עֲלֵי/הֶ֖ם מֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/010.yaml
  text: 'Then Huram king of Tyre answered in a letter that he sent to Solomon: “Because Yahweh loves his people[c][b][a], he has made you king over them.”'
translation:
  language: hi
  text: 'तब सोर के राजा हूराम[a] ने एक पत्र में सुलैमान को यह उत्तर भेजा: “याहवे के अपने लोगों से प्रेम के कारण उसने तुम्हें उनका राजा बनाया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: हूराम; पारंपरिक रूप: हीराम।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... यह उत्तर दिया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। निकटवर्ती संदर्भ में यह सुलैमान के संदेश का प्रत्युत्तर है, इसलिए सामान्य ‘कहा’ के स्थान पर ‘उत्तर दिया’ प्रसंगानुकूल है।
- source_word: חוּרָם
  choice: हूराम
  rationale: मसोरेटिक पाठ में नाम חוּרָם है; ‘हूराम’ उसी रूप का निकट देवनागरी लिप्यंतरण है।
- source_word: מֶלֶךְ צֹר
  choice: सोर के राजा
  rationale: यह रचनात्मक संबंध हूराम के पद और राज्य को बताता है; आधुनिक हिन्दी में ‘सोर के राजा’ स्वाभाविक है।
- source_word: בִּכְתָב
  choice: एक पत्र में
  rationale: शब्द लिखित संदेश या दस्तावेज़ का बोध कराता है। प्रसंग में ‘एक पत्र में’ स्पष्ट और सहज है।
- source_word: וַיִּשְׁלַח אֶל שְׁלֹמֹה
  choice: जिसे उसने सुलैमान को भेजा था
  rationale: इब्रानी में भेजी गई वस्तु संदर्भ से समझी जाती है। हिन्दी में ‘जिसे’ जोड़कर पत्र को उसका स्वाभाविक कर्म बनाया गया है और दो क्रियाओं को सहज रूप से जोड़ा गया है।
- source_word: בְּאַהֲבַת
  choice: अपने लोगों से प्रेम करता है, इसलिए
  rationale: בְּ के साथ भाववाचक संज्ञा यहाँ कारण व्यक्त कर सकती है। हिन्दी में कारण और परिणाम को इस प्रकार व्यक्त करना स्पष्ट है, जबकि वैकल्पिक संज्ञात्मक रचना पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत नाम, चतुरक्षरीय नाम יהוה, है; अतः किसी उपाधि से बदलने के बजाय ‘याहवे’ रूप में प्रस्तुत किया गया है।
- source_word: עַמּוֹ
  choice: अपने लोगों
  rationale: प्रत्यय का संकेत याहवे की ओर है। ‘अपने लोगों’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְתָנְךָ
  choice: उसने तुम्हें ... बनाया है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर किसी व्यक्ति को राजपद के साथ रखने की इस रचना में इसका अर्थ नियुक्त या स्थापित करना है। ‘राजा बनाया है’ स्वाभाविक हिन्दी है।
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: उन पर राजा
  rationale: על यहाँ लोगों पर शासन का संबंध दिखाता है; ‘उन पर राजा’ संक्षिप्त और अर्थनिष्ठ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ मूल नाम को प्रत्यक्ष रखता है और उसे किसी संप्रदायगत व्याख्या से नहीं बदलता।
- issue: याहवे के प्रेम और सुलैमान के राजपद के बीच संबंध
  choice: प्रेम को सुलैमान के राजा बनाए जाने का कारण बताया गया
  alternative: ‘अपने लोगों के प्रति याहवे के प्रेम के कारण उसने तुम्हें उन पर राजा बनाया है’
  rationale: בְּאַהֲבַת का यहाँ कारणवाचक अर्थ सबसे उपयुक्त है। मुख्य पाठ क्रियात्मक हिन्दी में वही संबंध व्यक्त करता है; वैकल्पिक संज्ञात्मक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘उत्तर दिया’ प्रसंग को स्पष्ट करता है; पादटिप्पणियाँ नाम के पारंपरिक रूप, इब्रानी क्रिया-संरचना और कारणवाचक पदबंध की वास्तविक वैकल्पिक अभिव्यक्तियाँ सुरक्षित रखती हैं।
