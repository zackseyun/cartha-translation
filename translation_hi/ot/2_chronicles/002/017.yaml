  text: וַ/יַּ֨עַשׂ מֵ/הֶ֜ם שִׁבְעִ֥ים אֶ֨לֶף֙ סַבָּ֔ל וּ/שְׁמֹנִ֥ים אֶ֖לֶף חֹצֵ֣ב בָּ/הָ֑ר וּ/שְׁלֹ֤שֶׁת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת מְנַצְּחִ֖ים לְ/הַעֲבִ֥יד אֶת הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/017.yaml
  text: From them he made seventy thousand burden-bearers[a], and eighty thousand stonecutters in the hill country, and three thousand six hundred overseers to make the people work.
translation:
  language: hi
  text: उसने उनमें से सत्तर हज़ार बोझ ढोनेवाले, अस्सी हज़ार पहाड़ी प्रदेश में पत्थर काटनेवाले[a], और तीन हज़ार छह सौ लोगों से काम कराने के लिए निरीक्षक नियुक्त किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पहाड़/पहाड़ी प्रदेश में काटनेवाले”; क्या काटा जाता था, यह मूल पाठ में नहीं कहा गया, पर भवन-निर्माण के प्रसंग से पत्थर का अर्थ समझ में आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ מֵהֶם
  choice: उसने उनमें से … नियुक्त किया
  rationale: यहाँ इस इब्रानी प्रयोग का अर्थ किसी समूह में से लोगों को विशेष काम के लिए ठहराना है। ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक रूप से यह भाव व्यक्त करता है।
- source_word: סַבָּל
  choice: बोझ ढोनेवाले
  rationale: यह संज्ञा भार उठाने या ढोनेवाले व्यक्ति को दर्शाती है; यह सामान्य ‘मज़दूर’ की अपेक्षा अधिक सटीक है।
- source_word: חֹצֵב בָּהָר
  choice: पहाड़ी प्रदेश में पत्थर काटनेवाले
  rationale: חצב का अर्थ काटना या तराशना है और भवन-निर्माण के प्रसंग में निहित कर्म पत्थर है। בָּהָר को सामूहिक भौगोलिक अर्थ में ‘पहाड़ी प्रदेश में’ कहा गया है।
- source_word: מְנַצְּחִים
  choice: निरीक्षक
  rationale: इस प्रशासनिक प्रसंग में यह शब्द काम का निर्देशन और देखरेख करनेवालों के लिए प्रयुक्त है।
- source_word: לְהַעֲבִיד אֶת הָעָם
  choice: लोगों से काम करानेवाले
  rationale: עבד के हिफ़ील रूप का कारक भाव—काम करवाना—सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल पाठ के व्यापक शब्द ‘लोग’ को बनाए रखा गया है; प्रसंग से स्पष्ट है कि ये काम करनेवाले लोग हैं।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर संख्यात्मक संरचना को स्पष्ट करने के लिए प्रत्येक समूह के साथ ‘को’ लगाया गया है।
