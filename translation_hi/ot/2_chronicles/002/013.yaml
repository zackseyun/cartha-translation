  text: בֶּן אִשָּׁ֞ה מִן בְּנ֣וֹת דָּ֗ן וְ/אָבִ֣י/ו אִישׁ צֹרִ֡י יוֹדֵ֡עַ לַ/עֲשׂ֣וֹת בַּ/זָּֽהָב וּ֠/בַ/כֶּסֶף בַּ/נְּחֹ֨שֶׁת בַּ/בַּרְזֶ֜ל בָּ/אֲבָנִ֣ים וּ/בָ/עֵצִ֗ים בָּ/אַרְגָּמָ֤ן בַּ/תְּכֵ֨לֶת֙ וּ/בַ/בּ֣וּץ וּ/בַ/כַּרְמִ֔יל וּ/לְ/פַתֵּ֨חַ֙ כָּל פִּתּ֔וּחַ וְ/לַ/חְשֹׁ֖ב כָּל מַחֲשָׁ֑בֶת אֲשֶׁ֤ר יִנָּֽתֶן ל/וֹ֙ עִם חֲכָמֶ֔י/ךָ וְֽ/חַכְמֵ֔י אֲדֹנִ֖/י דָּוִ֥יד אָבִֽי/ךָ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/013.yaml
  text: the son of a woman from the daughters of Dan[a], and his father was a man of Tyre, skilled to work in gold and silver, bronze and iron, stone and wood, purple, blue, fine linen, and crimson, and to engrave every kind of engraving and to devise every kind of design that may be assigned to him[b], with your skilled men and the skilled men of my lord David your father.
translation:
  language: hi
  text: वह दान की बेटियों में से किसी स्त्री का पुत्र है[a], और उसका पिता सोर का निवासी था। वह सोने, चाँदी, काँसे, लोहे, पत्थर और लकड़ी का काम करने में, तथा बैंगनी, नीले, महीन सन के और किरमिज़ी[b] रंग के कपड़ों का काम करने में कुशल है। वह हर प्रकार की नक्काशी करने और हर प्रकार की योजना बनाने में कुशल है, जो उसे तुम्हारे कुशल कारीगरों और मेरे प्रभु, तुम्हारे पिता दाऊद के कुशल कारीगरों के साथ सौंपी जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दान की बेटियों में से” का आशय संभवतः यह है कि उसकी माता दान गोत्र की थी।
    reason: cultural_note
  - marker: b
    text: या, “सुर्ख लाल रंग का कपड़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן אִשָּׁה מִן בְּנוֹת דָּן
  choice: दान की बेटियों में से एक स्त्री का पुत्र
  rationale: हिब्रू की वंश-संबंधी अभिव्यक्ति को निकटता से रखता है; इसका आशय संभवतः यह है कि उसकी माता दान गोत्र की थी, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְאָבִיו אִישׁ צֹרִי
  choice: उसका पिता सोर का निवासी था
  rationale: צֹרִי का भौगोलिक अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יוֹדֵעַ לַעֲשׂוֹת
  choice: काम करने में ... कुशल
  rationale: यह केवल जानकारी नहीं, बल्कि कारीगरी की व्यावहारिक दक्षता को दर्शाता है।
- source_word: בַּזָּהָב וּבַכֶּסֶף בַּנְּחֹשֶׁת בַּבַּרְזֶל בָּאֲבָנִים וּבָעֵצִים
  choice: सोने, चाँदी, काँसे, लोहे, पत्थर और लकड़ी का काम
  rationale: सभी कार्य-सामग्रियों को स्पष्ट और स्वाभाविक हिन्दी सूची के रूप में प्रस्तुत करता है।
- source_word: בָּאַרְגָּמָן בַּתְּכֵלֶת וּבַבּוּץ וּבַכַּרְמִיל
  choice: बैंगनी, नीले, सन के महीन और किरमिज़ी कपड़े
  rationale: रंगों और वस्त्र-सामग्री के भेद को बनाए रखते हुए בּוּץ को सन के महीन कपड़े के रूप में स्पष्ट करता है।
- source_word: וּלְפַתֵּחַ כָּל פִּתּוּחַ
  choice: हर प्रकार की नक्काशी कर सकता
  rationale: सजातीय हिब्रू क्रिया-संज्ञा प्रयोग का अर्थ सहज हिन्दी में नक्काशी की व्यापक कुशलता के रूप में व्यक्त होता है।
- source_word: וְלַחְשֹׁב כָּל מַחֲשָׁבֶת
  choice: हर प्रकार की कलाकृति की रूपरेखा बना सकता
  rationale: कारीगरी के प्रसंग में חשׁב कलात्मक योजना या अभिकल्प तैयार करने को दर्शाता है।
- source_word: אֲשֶׁר יִנָּתֶן לוֹ
  choice: जो उसे सौंपी जाए
  rationale: हिब्रू कर्मवाच्य की अनिश्चितता बनाए रखता है कि कार्य कौन सौंपता है।
theological_decisions:
- issue: कारीगरों के लिए पुल्लिंग बहुवचन חֲכָמֶיךָ / חַכְמֵי
  choice: तुम्हारे कुशल कारीगरों ... के कुशल कारीगरों
  alternative: तुम्हारे कुशल कामगारों
  rationale: कारीगरी के प्रसंग और स्रोत के पुल्लिंग बहुवचन दोनों को स्पष्ट रखता है।
- issue: मानवीय सम्मानसूचक אֲדֹנִי
  choice: मेरे प्रभु, तुम्हारे पिता दाऊद
  alternative: मेरे स्वामी, तुम्हारे पिता दाऊद
  rationale: यहाँ शब्द दाऊद के लिए राजकीय सम्मानसूचक है, परमेश्वर के लिए उपाधि नहीं; ‘मेरे प्रभु’ उस दरबारी संबोधन को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। धातु, पत्थर और लकड़ी की कारीगरी तथा रंगीन वस्त्रों के काम को अलग वाक्यांशों में रखा गया है। अंतिम वाक्य में निहित सहकार्य को स्वाभाविक हिन्दी में स्पष्ट किया गया है, जबकि कार्य सौंपने वाले की पहचान अनिश्चित ही रखी गई है।
