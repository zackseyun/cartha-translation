source:
  edition: WLC
  text: הִנֵּה֩ אֲנִ֨י בֽוֹנֶה בַּ֜יִת לְ/שֵׁ֣ם יְהוָ֣ה אֱלֹהָ֗/י לְ/הַקְדִּ֣ישׁ ל֡/וֹ לְ/הַקְטִ֣יר לְ/פָנָ֣י/ו קְטֹֽרֶת סַמִּים֩ וּ/מַעֲרֶ֨כֶת תָּמִ֤יד וְ/עֹלוֹת֙ לַ/בֹּ֣קֶר וְ/לָ/עֶ֔רֶב לַ/שַּׁבָּתוֹת֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּֽ/לְ/מוֹעֲדֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ לְ/עוֹלָ֖ם זֹ֥את עַל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/003.yaml
  text: Behold[a], I am building a house for the name of Yahweh my God, to consecrate it to him, to burn fragrant incense before him, and to set out the regular arrangement of bread, and burnt offerings morning and evening, on the Sabbaths, at the new moons[b], and at the appointed feasts of Yahweh our God[c]. This is forever for Israel.
translation:
  language: hi
  text: देखो, मैं अपने परमेश्वर याहवे के नाम के लिए एक भवन[a] बना रहा हूँ, ताकि उसे उनके लिए पवित्र ठहराऊँ, उनके सामने सुगंधित धूप जलाऊँ, नित्य रोटियाँ सजाकर रखूँ[b], और हर सुबह और शाम, सब्तों, नए चाँद के दिनों और हमारे परमेश्वर याहवे के नियत पर्वों पर होमबलियाँ चढ़ाऊँ। इस्राएल के लिए यह सदा की विधि है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भवन’ से मन्दिर अभिप्रेत है। इब्रानी में शाब्दिक रूप से ‘याहवे के नाम के लिए एक भवन’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘नित्य व्यवस्था’ या ‘नित्य सजाई हुई पाँत’ है; इससे परमेश्वर के सामने नियमित रूप से रखी जाने वाली रोटियाँ अभिप्रेत हैं, जिन्हें परम्परागत रूप से ‘भेंट की रोटी’ कहा जाता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, ‘यह सदा के लिए इस्राएल पर है’; भाव यह है कि यह इस्राएल का स्थायी दायित्व है।
    reason: ambiguity
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक शब्द है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी उद्घोषणात्मक शक्ति बनाए रखता है।
- source_word: בּוֹנֶה
  choice: बना रहा हूँ
  rationale: इब्रानी कृदंत यहाँ चल रही या आरम्भ होने वाली क्रिया व्यक्त करता है; हिन्दी का वर्तमान प्रगतिशील रूप इसे सहज ढंग से व्यक्त करता है।
- source_word: בַּיִת
  choice: भवन
  rationale: मूल अर्थ ‘घर/भवन’ है और सन्दर्भ में यह मन्दिर है। ‘भवन’ इब्रानी रूपक को बचाते हुए उपासना-स्थल के लिए गरिमापूर्ण और स्वाभाविक है।
- source_word: לְשֵׁם יְהוָה
  choice: याहवे के नाम के लिए
  rationale: ‘नाम के लिए’ वाली महत्त्वपूर्ण धर्मवैचारिक अभिव्यक्ति को स्पष्ट रूप से बनाए रखा गया है; याहवे को उपाधि से नहीं बदला गया।
- source_word: לְהַקְדִּישׁ לוֹ
  choice: उसे उनके लिए पवित्र ठहराऊँ
  rationale: हिफ़ील रूप का आशय भवन को परमेश्वर के लिए पवित्र उपयोग हेतु अलग करना है। आदरसूचक हिन्दी सर्वनाम स्वाभाविक धार्मिक शैली के अनुरूप है।
- source_word: קְטֹרֶת סַמִּים
  choice: सुगंधित धूप
  rationale: यह विशेष सुगंधित पदार्थों से बनी उपासना-संबंधी धूप को संक्षेप और सहज हिन्दी में व्यक्त करता है।
- source_word: מַעֲרֶכֶת תָּמִיד
  choice: नित्य रोटियाँ सजाकर रखूँ
  rationale: शाब्दिक रूप से यह ‘नित्य व्यवस्था/सजावट’ है; मन्दिर के सन्दर्भ में नियमित रूप से सजाकर रखी जाने वाली रोटियाँ अभिप्रेत हैं। क्रियात्मक हिन्दी वाक्यांश पाठक को प्रथा समझने देता है, जबकि पादटिप्पणी शाब्दिकता और पारम्परिक नाम सुरक्षित रखती है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह पूर्णतः जलाए जाने वाले बलिदानों के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: לַבֹּקֶר וְלָעֶרֶב
  choice: हर सुबह और शाम
  rationale: यह दैनिक बलिदान के नियमित समय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לֶחֳדָשִׁים
  choice: नए चाँद के दिनों
  rationale: बहुवचन पद प्रत्येक नए चाँद से जुड़े उपासना-दिवसों को सूचित करता है; यह अनुवाद आधुनिक पाठक के लिए स्पष्ट है।
- source_word: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל
  choice: इस्राएल के लिए यह सदा की विधि है
  rationale: इब्रानी का संक्षिप्त वाक्य इस प्रथा के इस्राएल पर स्थायी दायित्व को व्यक्त करता है। ‘विधि’ अर्थ को हिन्दी में पूर्ण करता है, और शाब्दिक संरचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका हिन्दी लिप्यन्तरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בַּיִת को ‘भवन’ या ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: सन्दर्भ निस्सन्देह मन्दिर का है, पर ‘याहवे के नाम के लिए भवन’ मूल पाठ की अर्थपूर्ण अभिव्यक्ति है। मुख्य पाठ में मूल रूपक रखा और पादटिप्पणी में सन्दर्भ स्पष्ट किया गया है।
- issue: מַעֲרֶכֶת תָּמִיד में रोटी को स्पष्ट करना
  choice: नित्य रोटियाँ सजाकर रखूँ
  alternative: नित्य व्यवस्था करूँ / भेंट की रोटी नित्य रखूँ
  rationale: पद में ‘रोटी’ प्रत्यक्षतः नहीं है, पर मन्दिर-उपासना के सन्दर्भ में नियमित रूप से रखी जाने वाली रोटियों की पाँत अभिप्रेत है। मुख्य पाठ बोधगम्य है और पादटिप्पणी मूल की संक्षिप्तता बताती है।
- issue: לְעוֹלָם זֹאת עַל יִשְׂרָאֵל का दायित्वसूचक अर्थ
  choice: इस्राएल के लिए यह सदा की विधि है
  alternative: यह सदा इस्राएल पर है
  rationale: ‘पर’ दायित्व का भाव दे सकता है, पर शाब्दिक हिन्दी अस्पष्ट होती। ‘सदा की विधि’ स्थायी धार्मिक दायित्व बताता है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज रखी गई है। बलिदान-संबंधी आवश्यक पद ‘धूप’ और ‘होमबलियाँ’ बनाए गए हैं। परमेश्वर के लिए आदरसूचक बहुवचन सर्वनाम प्रयुक्त हुआ है, जबकि क्रियाओं में वक्ता सुलैमान का एकवचन स्पष्ट है।
