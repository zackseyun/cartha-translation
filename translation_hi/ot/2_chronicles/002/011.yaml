reference: 2 Chronicles 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ חוּרָם֒ בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר עָשָׂ֔ה אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָ֑רֶץ אֲשֶׁ֣ר נָתַן֩ לְ/דָוִ֨יד הַ/מֶּ֜לֶךְ בֵּ֣ן חָכָ֗ם יוֹדֵ֨עַ֙ שֵׂ֣כֶל וּ/בִינָ֔ה אֲשֶׁ֤ר יִבְנֶה בַּ֨יִת֙ לַ/יהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/011.yaml
  text: Then Huram said[a], “Blessed be Yahweh, the God of Israel, who made the heavens and the earth, who has given King David a wise son, who knows discretion and understanding[c][b], who will build a house for Yahweh and a house for his kingdom.”
translation:
  language: hi
  text: तब हूराम ने कहा[a], “इस्राएल का परमेश्वर यहोवा धन्य हो, जिसने आकाश और पृथ्वी को बनाया और राजा दाऊद को एक बुद्धिमान पुत्र दिया, जो सूझ-बूझ और समझ रखता है[b] और जो यहोवा के लिए एक भवन और अपने राज्य के लिए एक भवन बनाएगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर वृत्तांत 1 राजाओं में इस नाम का रूप ‘हीराम’ है; यहाँ इतिहास की पुस्तक के इब्रानी पाठ में ‘हूराम’ है।
    reason: alternative_reading
  - marker: b
    text: या, “जिसमें सूझ-बूझ और समझ है।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात उसके राजकीय शासन के लिए भवन; सम्भवतः राजमहल या राजमहल-परिसर का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: חוּרָם
  choice: हूराम
  rationale: इतिहास की पुस्तक में प्रयुक्त इब्रानी रूप חוּרָם का लिप्यंतरण किया गया है और 1 राजाओं के ‘हीराम’ से सामंजस्य नहीं बैठाया गया।
- source_word: בָּרוּךְ יְהוָה
  choice: यहोवा धन्य हो
  rationale: आशीर्वाद-सूत्र का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप, जिसमें परमेश्वर का व्यक्तिगत नाम सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामटन को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עָשָׂה אֶת־הַשָּׁמַיִם וְאֶת־הָאָרֶץ
  choice: जिसने आकाश और पृथ्वी को बनाया
  rationale: इब्रानी सृष्टि-वाक्यांश का स्पष्ट, स्वाभाविक हिन्दी रूप। हिन्दी में ‘आकाश’ सामूहिक अर्थ में मूल के बहुवचन को सहज रूप से व्यक्त करता है।
- source_word: בֵּן חָכָם
  choice: एक बुद्धिमान पुत्र
  rationale: חָכָם की व्यापक व्यावहारिक और बौद्धिक बुद्धि को ‘बुद्धिमान’ सहज रूप से व्यक्त करता है।
- source_word: יוֹדֵעַ שֵׂכֶל וּבִינָה
  choice: जो सूझ-बूझ और समझ रखता है
  rationale: प्रतिभागी रूप और दोनों निकटार्थक संज्ञाओं को स्वाभाविक हिन्दी में रखते हुए व्यावहारिक विवेक तथा समझ का भेद यथासंभव सुरक्षित किया गया है।
- source_word: בַּיִת לַיהוָה
  choice: यहोवा के लिए एक भवन
  rationale: मूल में ‘घर/भवन’ है; ‘मन्दिर’ कहकर निहितार्थ को स्पष्ट करने के बजाय स्रोत की अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: בַּיִת לְמַלְכוּתוֹ
  choice: अपने राज्य के लिए एक भवन
  rationale: प्रत्यय का निकटतम व्याकरणिक संकेत सुलैमान की ओर है; ‘राज्य’ मूल מַלְכוּת को बनाए रखता है, जबकि संभावित राजमहल-सन्दर्भ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: לְמַלְכוּתוֹ में प्रत्यय और ‘राज्य’ का आशय
  choice: अपने राज्य के लिए एक भवन
  alternative: उसके राजकीय शासन के लिए एक भवन; एक राजमहल
  rationale: ‘अपने’ का निकटतम सम्बन्ध उस बुद्धिमान पुत्र से है जो निर्माण करेगा। מַלְכוּת का शाब्दिक अर्थ ‘राज्य/राजकीय शासन’ है; इसे सीधे ‘राजमहल’ करना सम्भावित आशय को निश्चित कर देता, इसलिए वह सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ गद्य। ‘भवन’ से स्रोत के בַּיִת को बनाए रखा गया है; ‘सूझ-बूझ और समझ’ व्यावहारिक विवेक तथा बोध की युग्मित धारणा व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
