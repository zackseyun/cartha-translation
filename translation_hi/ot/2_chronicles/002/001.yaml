  text: וַ/יִּסְפֹּ֨ר שְׁלֹמֹ֜ה שִׁבְעִ֥ים אֶ֨לֶף֙ אִ֣ישׁ סַבָּ֔ל וּ/שְׁמוֹנִ֥ים אֶ֛לֶף אִ֖ישׁ חֹצֵ֣ב בָּ/הָ֑ר וּ/מְנַצְּחִ֣ים עֲלֵי/הֶ֔ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וְ/שֵׁ֥שׁ מֵאֽוֹת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/001.yaml
  text: Solomon counted seventy thousand men as burden-bearers[a], and eighty thousand men as stonecutters in the hill country, and over them three thousand six hundred overseers.
translation:
  language: hi
  text: सुलैमान ने सत्तर हज़ार बोझ ढोने वाले पुरुषों, पहाड़ी प्रदेश में पत्थर काटने वाले अस्सी हज़ार पुरुषों[a], और उनके ऊपर तीन हज़ार छह सौ निरीक्षकों को गिना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “पहाड़ में काटने वाले”; निर्माण के संदर्भ में पत्थर काटना अभिप्रेत है।
    reason: मूल में काटी जाने वाली वस्तु व्यक्त नहीं की गई है, इसलिए अनुवाद में स्पष्ट किए गए ‘पत्थर’ के साथ शाब्दिक रूप भी दिया गया है।
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: गिना
  rationale: ספר का यहाँ स्वाभाविक अर्थ लोगों की गिनती करना है। ‘गिना’ मूल क्रिया को सुरक्षित रखता है; ‘नियुक्त किया’ संदर्भानुकूल हो सकता है, पर वह मूल में स्पष्ट नहीं है।
- source_word: אִישׁ סַבָּל
  choice: पुरुषों को बोझ ढोने के लिए
  rationale: סַבָּל बोझ उठाने या ढोने वाला व्यक्ति है। यह अभिव्यक्ति आधुनिक हिन्दी में श्रम की भूमिका स्पष्ट करती है और אִישׁ के पुरुषवाचक अर्थ को बनाए रखती है।
- source_word: חֹצֵב בָּהָר
  choice: पहाड़ी प्रदेश में पत्थर काटने के लिए
  rationale: חצב का अर्थ काटना या तराशना है और निर्माण-संदर्भ में निहित वस्तु पत्थर है। בָּהָר स्थान को दर्शाता है; ‘पहाड़ी प्रदेश में’ आधुनिक हिन्दी में स्वाभाविक है। निहित ‘पत्थर’ को स्पष्ट करने के साथ शाब्दिक अनिश्चितता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: וּמְנַצְּחִים עֲלֵיהֶם
  choice: उन पर निगरानी रखने के लिए
  rationale: इस प्रशासनिक संदर्भ में נצח का कृदंत मजदूरों के काम की देखरेख या निर्देशन करने वालों को सूचित करता है। ‘उन पर’ עֲלֵיהֶם का संबंध बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: तीन हज़ार छह सौ
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप।
