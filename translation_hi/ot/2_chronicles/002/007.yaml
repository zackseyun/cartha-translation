  text: וּֽ/שְׁלַֽח לִ/י֩ עֲצֵ֨י אֲרָזִ֜ים בְּרוֹשִׁ֣ים וְ/אַלְגּוּמִּים֮ מֵֽ/הַ/לְּבָנוֹן֒ כִּ֚י אֲנִ֣י יָדַ֔עְתִּי אֲשֶׁ֤ר עֲבָדֶ֨י/ךָ֙ יֽוֹדְעִ֔ים לִ/כְר֖וֹת עֲצֵ֣י לְבָנ֑וֹן וְ/הִנֵּ֥ה עֲבָדַ֖/י עִם עֲבָדֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/007.yaml
  text: Send me cedar[a], cypress, and algum timber from Lebanon, for I know that your servants know how to cut timber in Lebanon. And behold[b], my servants will be with your servants.
translation:
  language: hi
  text: मेरे लिए लबानोन से देवदार, सरू[a] और अलगूम[b] की लकड़ी भेजें, क्योंकि मैं जानता हूँ कि आपके सेवक लबानोन के पेड़ काटना जानते हैं। और देखिए, मेरे सेवक आपके सेवकों के साथ रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सरू’ के स्थान पर ‘जूनिपर’ या ‘फ़िर’ भी सम्भव है; इब्रानी शब्द בְּרוֹשִׁים से अभिप्रेत वृक्ष की ठीक जाति अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: ‘अलगूम’ को ‘अलमुग’ भी लिखा जाता है। कुछ लोग इसे चन्दन मानते हैं, पर इसकी ठीक जाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁלַח לִי
  choice: मेरे लिए ... भेज दे
  rationale: संयोजक वाव के बाद एकवचन पुल्लिंग आज्ञार्थक क्रिया है। हिन्दी में ‘मेरे लिए ... भेज दे’ अनुरोध को स्वाभाविक रूप से व्यक्त करता है; अलग से ‘अब’ जोड़ने का स्रोत में आधार नहीं है।
- source_word: עֲצֵי אֲרָזִים
  choice: देवदार ... की लकड़ी
  rationale: निर्माण-सामग्री के प्रसंग में बहुवचन संज्ञा और construct phrase का आशय देवदार की इमारती लकड़ी है।
- source_word: בְּרוֹשִׁים
  choice: सरो
  rationale: यह बहुमूल्य वृक्ष/लकड़ी का नाम है, पर इसकी ठीक वनस्पति-जाति अनिश्चित है। ‘सरो’ एक प्रचलित सम्भावित अनुवाद है; अन्य पहचानों को पादटिप्पणी में रखा गया है।
- source_word: וְאַלְגּוּמִּים
  choice: और अलगूम
  rationale: वनस्पति की निश्चित पहचान न होने के कारण अनुमानित ‘चन्दन’ थोपने के बजाय इब्रानी नाम का देवनागरी लिप्यन्तरण रखा गया है।
- source_word: מֵהַלְּבָנוֹן
  choice: लबानोन से
  rationale: भौगोलिक स्रोत को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי אֲנִי יָדַעְתִּי
  choice: क्योंकि मैं जानता हूँ
  rationale: इब्रानी पूर्ण क्रिया यहाँ वर्तमान में विद्यमान ज्ञान व्यक्त करती है।
- source_word: אֲשֶׁר עֲבָדֶיךָ יֹדְעִים לִכְרוֹת
  choice: कि तेरे सेवक ... काटना जानते हैं
  rationale: ידע के साथ infinitive का अर्थ किसी काम को करना जानना है; हिन्दी संरचना उसी आशय को स्पष्ट और स्वाभाविक रखती है।
- source_word: עֲצֵי לְבָנוֹן
  choice: लबानोन के पेड़
  rationale: यहाँ כרת के साथ खड़े वृक्षों को काटने का प्रत्यक्ष बिम्ब है, इसलिए पहले खंड की ‘लकड़ी’ के विपरीत ‘पेड़’ अधिक सटीक है।
- source_word: וְהִנֵּה
  choice: और देख
  rationale: ध्यान आकृष्ट करने वाले इब्रानी अव्यय का बल बनाए रखता है, बिना उसे केवल तार्किक संयोजक में बदलने के।
- source_word: עֲבָדַי עִם עֲבָדֶיךָ
  choice: मेरे सेवक तेरे सेवकों के साथ रहेंगे
  rationale: इब्रानी में व्यक्त क्रिया नहीं है; अनुरोध और भावी कार्य-व्यवस्था के प्रसंग में हिन्दी की भविष्यकालीन पूर्ति ‘रहेंगे’ उपयुक्त है।
