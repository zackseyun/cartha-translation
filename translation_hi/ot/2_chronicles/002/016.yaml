base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/016.yaml
  text: Then Solomon counted all the resident foreigners who were in the land of Israel[a], after the census that David his father had taken of them, and they were found to be one hundred fifty-three thousand six hundred.
translation:
  language: hi
  text: तब सुलैमान ने इस्राएल देश में रहने वाले सभी निवासी परदेशियों[a] की गिनती की, उस गणना के बाद जो उसके पिता दाऊद ने उनकी की थी; और वे एक लाख तिरपन हज़ार छह सौ पाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परदेशी निवासी” अथवा “परदेशी।” इब्रानी शब्द उन गैर-इस्राएलियों के लिए है जो इस्राएली भूभाग में रहते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְפֹּר
  choice: गिनती की
  rationale: यहाँ क्रिया का अर्थ लोगों को गिनना है; ‘गिनती की’ स्वाभाविक हिन्दी है और आगे उल्लिखित पिछली गणना से भी मेल खाती है।
- source_word: הָאֲנָשִׁים הַגֵּירִים
  choice: रहनेवाले सभी परदेशियों
  rationale: גֵּרִים उन गैर-इस्राएली परदेशियों को सूचित करता है जो इस्राएली भूभाग में निवास करते थे, केवल यात्रा करनेवालों को नहीं। ‘रहनेवाले परदेशी’ इस अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश में
  rationale: यह रूप אֶרֶץ के भौगोलिक अर्थ को बनाए रखता है और केवल ‘इस्राएल में’ की अपेक्षा मूल अभिव्यक्ति के अधिक निकट है।
- source_word: אַחֲרֵי הַסְּפָר
  choice: उस गणना के बाद
  rationale: वाक्यांश पहले की गई जनगणना या गिनती की ओर संकेत करता है। ‘के बाद’ मूल के कालगत अर्थ को सुरक्षित रखता है, यद्यपि संदर्भ में पुराने अभिलेख के अनुसार पुनर्गणना का भाव भी संभव है।
- source_word: אֲשֶׁר סְפָרָם דָּוִיד אָבִיו
  choice: जो उसके पिता दाऊद ने उनकी कराई थी
  rationale: हिन्दी में लोगों की औपचारिक गणना ‘कराना’ स्वाभाविक है; पूर्ण भूतकाल दाऊद की पहले की कार्रवाई को स्पष्ट करता है।
- source_word: וַיִּמָּצְאוּ
  choice: वे ... पाए गए
  rationale: यह निफ़अल रूप गणना से प्राप्त परिणाम को निष्क्रिय/परिणामसूचक ढंग से बताता है; ‘पाए गए’ उसी भाव को बनाए रखता है।
- source_word: מֵאָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: एक लाख तिरपन हज़ार छह सौ
  rationale: संख्या 153,600 को भारतीय हिन्दी संख्या-पद्धति में ठीक और सहज रूप से व्यक्त किया गया है।
