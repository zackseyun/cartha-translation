  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִ֤י יַעֲצָר כֹּ֨חַ֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת כִּ֧י הַ/שָּׁמַ֛יִם וּ/שְׁמֵ֥י הַ/שָּׁמַ֖יִם לֹ֣א יְכַלְכְּלֻ֑/הוּ וּ/מִ֤י אֲנִי֙ אֲשֶׁ֣ר אֶבְנֶה לּ֣/וֹ בַ֔יִת כִּ֖י אִם לְ/הַקְטִ֥יר לְ/פָנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/005.yaml
  text: But who has the strength to build a house for him[a], since the heavens, even the highest heavens, cannot contain him? And who am I, that I should build a house for him[b], except to burn incense before him?
translation:
  language: hi
  text: पर उसके लिए भवन बनाने की सामर्थ्य किसमें है? क्योंकि आकाश, वरन् सबसे ऊँचे आकाश भी, उसे समा नहीं सकते। और मैं कौन हूँ कि उसके लिए भवन बनाऊँ, केवल उसके सामने धूप जलाने के लिए? [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने भेंट को धुएँ में चढ़ाने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲצָר כֹּחַ
  choice: सामर्थ्य किसमें है
  rationale: यह इब्रानी मुहावरा किसी कार्य के लिए पर्याप्त शक्ति या क्षमता होने को व्यक्त करता है; प्रश्नात्मक हिंदी में यह स्वाभाविक है।
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: उसके लिए भवन बनाने
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। मंदिर का संदर्भ स्पष्ट है, पर ‘भवन’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: आकाश, वरन् सबसे ऊँचे आकाश भी
  rationale: ‘आकाशों के आकाश’ वाली इब्रानी उत्कृष्टतासूचक अभिव्यक्ति को सहज हिंदी में प्रस्तुत करते हुए उसकी दो-खंडीय बलाघात संरक्षित की गई है।
- source_word: לֹא יְכַלְכְּלֻהוּ
  choice: उसे समा नहीं सकते
  rationale: संदर्भ में क्रिया का आशय परमेश्वर को अपने भीतर समेट या धारण कर सकने से है; ‘समा नहीं सकते’ स्वाभाविक आधुनिक हिंदी है।
- source_word: וּמִי אֲנִי
  choice: और मैं कौन हूँ
  rationale: सरल संयोजक और विनम्रता से भरे अलंकारिक प्रश्न—दोनों को बनाए रखा गया है।
- source_word: כִּי אִם לְהַקְטִיר לְפָנָיו
  choice: मैं तो केवल उसके सामने धूप जलाने के लिए ही ऐसा कर सकता हूँ
  rationale: כִּי אִם सीमित उद्देश्य बताता है। הקטיר किसी वस्तु को धुएँ में चढ़ाने का अर्थ भी दे सकता है; मंदिर-संदर्भ में ‘धूप जलाना’ संभावित और सहज है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर की असीमता और भवन से उसका संबंध
  choice: भवन परमेश्वर को समेट नहीं सकता; उसका सीमित उद्देश्य परमेश्वर के सामने आराधनात्मक धूप जलाना है।
  alternative: भवन को परमेश्वर का ऐसा निवास मानना जो उसे अपने भीतर सीमित रूप से समेटता हो।
  rationale: ‘सबसे ऊँचे आकाश भी उसे समा नहीं सकते’ मंदिर में स्थानीयकरण की धारणा को नियंत्रित करता है, जबकि अंतिम वाक्यांश भवन के उपासना-संबंधी उद्देश्य को बनाए रखता है।
- issue: הקטיר का अनिर्दिष्ट कर्म
  choice: धूप जलाना
  alternative: भेंट को धुएँ में चढ़ाना
  rationale: मंदिर-संदर्भ में ‘धूप जलाना’ उचित है, पर मूल क्रिया का अर्थ केवल धूप तक अनिवार्य रूप से सीमित नहीं है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भवन’ मूल के ‘घर’ अर्थ को रखते हुए मंदिर-संदर्भ में अधिक स्वाभाविक है। ‘वरन्’ से इब्रानी अभिव्यक्ति का बलाघात प्रकट किया गया है।
