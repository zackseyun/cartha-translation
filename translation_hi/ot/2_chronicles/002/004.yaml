  text: And the house that I am building will be great[b][a], for our God is greater than all gods.
translation:
  language: hi
  text: और जो भवन मैं बना रहा हूँ, वह महान होगा[a], क्योंकि हमारा परमेश्वर सब देवताओं से महान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मन्दिर मैं बना रहा हूँ, वह महान होगा।” इब्रानी में शाब्दिक रूप से ‘घर’ है।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारा परमेश्वर सब देवताओं के ऊपर महान है।” इब्रानी में ‘महान’ के साथ ‘सब देवताओं से’ का प्रयोग तुलना व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הַ/בַּיִת
  choice: और जो भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ वह पवित्रस्थान के भवन को दर्शाता है। ‘भवन’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा ‘मन्दिर’ की अपेक्षा इब्रानी शब्दावली के अधिक निकट रहता है।
- source_word: אֲנִי בוֹנֶה
  choice: मैं बना रहा हूँ
  rationale: कर्तृवाचक सर्वनाम और कृदन्त मिलकर जारी या आरम्भ की गई निर्माण-क्रिया व्यक्त करते हैं; ‘मैं बना रहा हूँ’ इसे स्वाभाविक हिन्दी में रखता है।
- source_word: גָּדוֹל
  choice: महान
  rationale: यह विशेषण आकार, महत्त्व और प्रतिष्ठा—तीनों का बोध करा सकता है। ‘महान’ केवल भौतिक विशालता तक अर्थ को सीमित नहीं करता और पद में दोहराए गए मूल शब्द को भी बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस सम्बन्ध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: इस्राएल के परमेश्वर के लिए אֱלֹהִים का मानक और प्रसंगानुकूल हिन्दी रूप ‘परमेश्वर’ है; प्रत्यय को ‘हमारा’ से व्यक्त किया गया है।
- source_word: גָדוֹל ... מִכָּל
  choice: सब ... से महान
  rationale: यद्यपि विशेषण पर तुलनात्मक रूप का अलग चिह्न नहीं है, מִן के साथ यह स्पष्ट तुलना बनाता है। ‘सब ... से महान’ हिन्दी का सीधा तुलनात्मक प्रयोग है।
- source_word: הָאֱלֹהִים
  choice: देवताओं
  rationale: इस तुलना में शब्द अन्य देवताओं को सूचित करता है। ‘देवताओं’ मूल कथन की धार्मिक और वाग्मितापूर्ण धार को बनाए रखता है, बिना यह तय किए कि उनका तात्त्विक स्वरूप क्या है।
theological_decisions:
- issue: अन्य देवताओं के साथ तुलना
  choice: हमारा परमेश्वर सब देवताओं से महान है
  alternative: हमारा परमेश्वर सब देवताओं के ऊपर महान है
  rationale: इब्रानी גָדוֹל ... מִכָּל सीधी तुलना व्यक्त करता है। चुना हुआ पाठ इस दावे को बनाए रखता है, पर ‘देवताओं’ को मूर्तियाँ, झूठे देवता या स्वर्गीय प्राणी मानकर तनाव का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘भवन’ मूल के ‘घर’ अर्थ और मन्दिर-सन्दर्भ के बीच संतुलन रखता है; ‘महान’ की पुनरावृत्ति इब्रानी शैली और पद के तर्क को सुरक्षित रखती है।
