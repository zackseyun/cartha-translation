- source_word: וְעַתָּה
  choice: और अब
  rationale: यह व्यावहारिक अनुरोध की ओर ले जाने वाला संवाद-सूचक पद है; ‘और अब’ संयोजक ו और עתה दोनों का बल बनाए रखता है।
