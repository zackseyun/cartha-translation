translation:
  language: hi
  text: और अब मेरे स्वामी ने जिन गेहूँ, जौ, तेल[a] और दाखमधु की बात कही है[b], वे उन्हें अपने सेवकों को भेज दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस आपूर्ति के संदर्भ में “तेल” से विशेष रूप से “जैतून का तेल” अभिप्रेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जिनकी बात उन्होंने कही थी”; इब्रानी क्रिया में “जिनकी उन्होंने प्रतिज्ञा की थी” का अधिक प्रबल अर्थ आवश्यक नहीं है।
    reason: lexical_alternative
