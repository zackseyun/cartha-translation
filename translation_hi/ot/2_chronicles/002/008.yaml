  text: और मेरे लिए बहुत-सी इमारती लकड़ी तैयार करें, क्योंकि जो भवन[a] मैं बना रहा हूँ, वह बड़ा और अद्भुत[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मन्दिर’; इब्रानी में शाब्दिक अर्थ ‘घर’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘महान और आश्चर्यजनक’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהָכִין
  choice: और … तैयार करें
  rationale: संयोजक और पूर्वसर्ग से युक्त infinitive construct पिछले अनुरोध को आगे बढ़ाता है; हिन्दी में आदरसूचक अनुरोध के रूप में ‘तैयार करें’ स्वाभाविक है।
- source_word: לִי
  choice: मेरे लिए
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित पूर्वसर्ग लाभार्थक अर्थ देता है।
- source_word: עֵצִים
  choice: इमारती लकड़ी
  rationale: निर्माण के प्रसंग में यह सामान्य ‘लकड़ी’ या शाब्दिक ‘पेड़ों’ के बजाय निर्माण योग्य लकड़ी को स्पष्ट करता है।
- source_word: לָרֹב
  choice: बहुतायत में
  rationale: यह वाक्यांश बड़ी मात्रा व्यक्त करता है और स्रोत की संज्ञात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लकड़ी की बड़ी मात्रा के अनुरोध का कारण प्रस्तुत करता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: मूल शब्द का शाब्दिक अर्थ ‘घर/भवन’ है; प्रसंग में मन्दिर अभिप्रेत है, पर ‘भवन’ स्रोत की व्यापक शब्दावली को सुरक्षित रखता है।
- source_word: אֲשֶׁר אֲנִי בוֹנֶה
  choice: जो … मैं बना रहा हूँ
  rationale: कर्ता-सर्वनाम और participle चालू अथवा आसन्न निर्माण को व्यक्त करते हैं; हिन्दी में वर्तमान प्रगतिशील रूप दोनों के अनुकूल है।
- source_word: גָּדוֹל
  choice: महान
  rationale: यह केवल आकार नहीं, बल्कि भव्यता और महत्त्व भी व्यक्त कर सकता है।
- source_word: וְהַפְלֵא
  choice: और अद्भुत
  rationale: पלא मूल असाधारण अथवा विस्मयकारी होने का भाव देता है; ‘अद्भुत’ उस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
