  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। पद पिछले अनुरोध की निरन्तरता है, इसलिए आरम्भ में ‘और’ तथा ‘तैयार करें’ रखा गया है। ‘भवन’ के साथ पादटिप्पणी मूल के ‘घर’ और प्रसंगगत ‘मन्दिर’ के बीच का संबंध स्पष्ट करती है।
