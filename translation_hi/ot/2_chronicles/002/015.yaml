  text: וַ֠/אֲנַחְנוּ נִכְרֹ֨ת עֵצִ֤ים מִן הַ/לְּבָנוֹן֙ כְּ/כָל צָרְכֶּ֔/ךָ וּ/נְבִיאֵ֥/ם לְ/ךָ֛ רַפְסֹד֖וֹת עַל יָ֣ם יָפ֑וֹ וְ/אַתָּ֛ה תַּעֲלֶ֥ה אֹתָ֖/ם יְרוּשָׁלִָֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/015.yaml
  text: And we will cut timber from Lebanon[a], as much as you need, and bring it to you as rafts by sea to Joppa[c][b]; and you will take it up to Jerusalem.
translation:
  language: hi
  text: हम लबानोन से जितनी लकड़ी आपको चाहिए उतनी काटेंगे और उसे बेड़े बनाकर[a] समुद्र के रास्ते याफा[b] तक आपके पास पहुँचाएँगे; फिर आप उसे यरूशलेम तक ऊपर[c] ले जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे बेड़ों में” अथवा “तैरते हुए लकड़ी के गट्ठरों के रूप में।”
    reason: lexical_alternative
  - marker: b
    text: याफा वह समुद्री बंदरगाह है जिसे बाद में जाफा कहा गया।
    reason: cultural_note
  - marker: c
    text: हिब्रू में “यरूशलेम को ऊपर ले जाएँगे”; “ऊपर” यरूशलेम की अधिक ऊँचाई को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִכְרֹת עֵצִים
  choice: लकड़ी काटेंगे
  rationale: वृक्षों को काटकर निर्माण-सामग्री तैयार करने के प्रसंग में यह स्वाभाविक हिन्दी है; ‘लकड़ी’ यहाँ सामूहिक अर्थ में प्रयुक्त है।
- source_word: מִן הַלְּבָנוֹן
  choice: लबानोन से
  rationale: यह उस प्रसिद्ध पर्वतीय और वन-प्रदेश का पारंपरिक बाइबलीय नाम है जहाँ से निर्माण की लकड़ी लाई जाती थी।
- source_word: כְּכָל צָרְכֶּךָ
  choice: जितनी लकड़ी आपको चाहिए उतनी
  rationale: यह सुलैमान की पूरी आवश्यकता के अनुसार मात्रा का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וּנְבִיאֵם לְךָ
  choice: उसे ... आपके लिए पहुँचा देंगे
  rationale: हिब्रू प्रत्यय बहुवचन है, पर हिन्दी में ‘लकड़ी’ सामूहिक एकवचन है। לְךָ को ‘आपके लिए’ कहना इस तथ्य के अनुकूल है कि माल याफा तक पहुँचाया जाएगा, सीधे सुलैमान के निवास तक नहीं।
- source_word: רַפְסֹדוֹת
  choice: बेड़े बनाकर
  rationale: यह बँधी हुई लकड़ियों को पानी पर तैराकर ले जाने की विधि को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַל יָם יָפוֹ
  choice: समुद्र के रास्ते याफा तक
  rationale: वाक्यांश समुद्री मार्ग और याफा को गंतव्य बताता है।
- source_word: תַּעֲלֶה אֹתָם
  choice: उसे ... ऊपर ले जाएँगे
  rationale: עלה में ऊपर चढ़ाकर ले जाने का दिशात्मक भाव है; यरूशलेम की अधिक ऊँचाई के कारण ‘ऊपर’ को बनाए रखा गया है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लकड़ी’ को सामूहिक संज्ञा मानकर उसके लिए एकवचन सर्वनाम प्रयुक्त हुआ है। खंड के भविष्यकालीन कथन को आज्ञार्थक न बनाकर भविष्यकाल में ही रखा गया है।
