  text: וְ/עַתָּ֡ה שְֽׁלַֽח לִ֣/י אִישׁ חָכָ֡ם לַ/עֲשׂוֹת֩ בַּ/זָּהָ֨ב וּ/בַ/כֶּ֜סֶף וּ/בַ/נְּחֹ֣שֶׁת וּ/בַ/בַּרְזֶ֗ל וּ/בָֽ/אַרְגְּוָן֙ וְ/כַרְמִ֣יל וּ/תְכֵ֔לֶת וְ/יֹדֵ֖עַ לְ/פַתֵּ֣חַ פִּתּוּחִ֑ים עִם הַֽ/חֲכָמִ֗ים אֲשֶׁ֤ר עִמִּ/י֙ בִּֽ/יהוּדָ֣ה וּ/בִֽ/ירוּשָׁלִַ֔ם אֲשֶׁ֥ר הֵכִ֖ין דָּוִ֥יד אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/002/006.yaml
  text: Send me a skilled man to work in gold[a], silver, bronze, iron, purple, crimson, and blue, and who knows how to engrave engravings, to be with the skilled men who are with me in Judah and Jerusalem[c][b], whom my father David prepared.
translation:
  language: hi
  text: अब मेरे पास एक कुशल कारीगर भेजिए, जो सोने, चाँदी, काँसे, लोहे तथा बैंगनी, किरमिजी[a] और नीले रंग की सामग्री में काम कर सके, नक्काशियाँ उकेरना[b] जानता हो, और यहूदा तथा यरूशलेम में मेरे साथ के कुशल कारीगरों के साथ काम कर सके, जिन्हें मेरे पिता दाऊद ने तैयार किया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाल/स्कारलेट रंग की सामग्री।”
    reason: כַּרְמִיל गहरे लाल, किरमिजी या स्कारलेट रंग की सामग्री का द्योतक हो सकता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उत्कीर्णन उत्कीर्ण करना”; यह एक ही मूल के क्रिया और संज्ञा का बलयुक्त प्रयोग है।
    reason: मूल की सजातीय क्रिया-संज्ञा अभिव्यक्ति को पाठक के लिए दर्ज करना।
  - marker: c
    text: या “नियुक्त किया था” अथवा “तैयार रखा था।”
    reason: הֵכִין प्रसंग के अनुसार तैयारी, तैयार रखने या किसी काम के लिए नियुक्त करने का भाव दे सकता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: इब्रानी में संयोजक וְ के साथ स्पष्ट कालवाचक עַתָּה (‘अब’) है। प्रसंग में यह पिछले कथन से निष्कर्षात्मक अनुरोध की ओर बढ़ता है, इसलिए ‘इसलिए अब’ स्वाभाविक हिन्दी है और मूल के ‘अब’ को सुरक्षित रखता है।
- source_word: שְׁלַח לִי
  choice: मेरे पास ... भेजिए
  rationale: यह हूराम से किया गया सीधा अनुरोध है। सम्मानसूचक आज्ञार्थ आधुनिक हिन्दी पत्र-शैली में स्वाभाविक और गरिमापूर्ण है।
- source_word: אִישׁ חָכָם
  choice: एक कुशल कारीगर
  rationale: शिल्प के संदर्भ में חָכָם बौद्धिक ‘बुद्धिमान’ से अधिक तकनीकी दक्षता बताता है। ‘कारीगर’ आगे गिनाई गई धातुओं और रंगीन सामग्री के साथ काम करने की भूमिका स्पष्ट करता है।
- source_word: לַעֲשׂוֹת בַּזָּהָב וּבַכֶּסֶף וּבַנְּחֹשֶׁת וּבַבַּרְזֶל
  choice: सोने, चाँदी, काँसे, लोहे ... पर काम कर सके
  rationale: בְ यहाँ कारीगरी की सामग्री दर्शाता है। נְחֹשֶׁת को इस ऐतिहासिक शिल्प-संदर्भ में ‘काँसा’ किया गया है।
- source_word: אַרְגְּוָן וְכַרְמִיל וּתְכֵלֶת
  choice: बैंगनी, किरमिजी तथा नीले रंग की सामग्री
  rationale: ये शब्द बहुमूल्य रंगों से रँगी सामग्री को सूचित करते हैं, पर इस पद में ‘धागा’ या ‘कपड़ा’ स्पष्ट रूप से नहीं कहा गया। ‘सामग्री’ हिन्दी में कार्य-सूची को स्वाभाविक बनाता है, जबकि किसी विशेष वस्त्र-रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יֹדֵעַ לְפַתֵּחַ פִּתּוּחִים
  choice: नक्काशियाँ उकेरना जानता हो
  rationale: मूल में एक ही धातु से बने क्रिया-संज्ञा का बलयुक्त प्रयोग है, शाब्दिक रूप से ‘उत्कीर्णन उत्कीर्ण करना’। हिन्दी में ‘नक्काशियाँ उकेरना’ उस बल और अर्थ दोनों को स्वाभाविक ढंग से रखता है।
- source_word: עִם הַחֲכָמִים אֲשֶׁר עִמִּי
  choice: मेरे साथ रहनेवाले उन कुशल कारीगरों के साथ काम करे
  rationale: पहला עִם सहयोग बताता है और दूसरा राजा के पास/साथ मौजूद कारीगरों को। ‘काम करे’ वाक्य में निहित सहयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר הֵכִין דָּוִיד אָבִי
  choice: जिन्हें मेरे पिता दाऊद ने तैयार किया था
  rationale: हिफ़ील הֵכִין का मूल अर्थ ‘तैयार करना/तैयार रखना’ है। सम्बन्धवाचक उपवाक्य निकटतम बहुवचन ‘कुशल कारीगरों’ से जोड़ा गया है; ‘नियुक्त किया’ सम्भव अर्थ है, पर उसे मुख्य पाठ में निश्चित नहीं किया गया।
