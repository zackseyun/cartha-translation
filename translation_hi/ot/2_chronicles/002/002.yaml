  yaml_path: translation/ot/2_chronicles/002/002.yaml
  text: Then Solomon sent to Huram king of Tyre[a], saying, “As you dealt with David my father and sent him cedars to build himself a house to dwell in, so do with me.”
translation:
  language: hi
  text: 'तब सुलैमान ने सोर के राजा हूराम[a] के पास यह कहलवा भेजा: “जैसा तुमने मेरे पिता दाऊद के साथ किया और उनके रहने के लिए घर बनाने को उन्हें देवदार की लकड़ी भेजी थी—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पाठ में नाम का रूप ‘हूराम’ है; राजाओं की पुस्तक के समानांतर वर्णन में सामान्यतः ‘हीराम’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... यह संदेश भेजा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। प्रत्यक्ष कथन के संदर्भ में ‘संदेश भेजा’ केवल ‘भेजा’ की अपेक्षा अधिक सहज है।
- source_word: חוּרָם
  choice: हूराम
  rationale: मुख्य पाठ इतिहासवृत्त में प्रयुक्त इब्रानी नाम-रूप חוּרָם का अनुसरण करता है; अधिक परिचित ‘हीराम’ को पाद-टिप्पणी में रखा गया है।
- source_word: מֶלֶךְ צֹר
  choice: सोर के राजा
  rationale: रचनात्मक संबंध को स्वाभाविक हिन्दी में पदवी और स्थान के रूप में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: 'यह संदेश ... :'
  rationale: इब्रानी कथन-परिचायक का शब्दशः ‘यह कहते हुए’ हिन्दी में बोझिल होता; विराम-चिह्न सहित यह रूप उसके कार्य को स्वाभाविक ढंग से निभाता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा ... वैसा ही
  rationale: तुलना का पूर्वपक्ष मूल में स्पष्ट है, जबकि उत्तरपक्ष प्रसंग से निहित है; हिन्दी में तुलनात्मक संरचना को स्पष्ट और सहज रखा गया है।
- source_word: עָשִׂיתָ עִם דָּוִיד אָבִי
  choice: तुमने मेरे पिता दाऊद के साथ ... व्यवहार किया
  rationale: עשה עם का व्यापक अर्थ ‘किसी के साथ व्यवहार/कार्य करना’ है; आगे का वाक्य उस व्यवहार को स्पष्ट करता है।
- source_word: וַתִּשְׁלַח לוֹ אֲרָזִים
  choice: देवदार की लकड़ी भेजी थी
  rationale: निर्माण-संदर्भ में बहुवचन אֲרָזִים देवदार की निर्माण-सामग्री को दर्शाता है; हिन्दी में ‘देवदार की लकड़ी’ ‘देवदार भेजे’ से अधिक स्वाभाविक और स्पष्ट है।
- source_word: לִבְנוֹת לוֹ בַיִת לָשֶׁבֶת בּוֹ
  choice: उनके रहने के लिए भवन बनवाने को
  rationale: दोनों उद्देश्य/हितसूचक प्रयोगों और निवास के आशय को संक्षिप्त हिन्दी में सुरक्षित रखा गया है। भेजी गई लकड़ी के कारण यहाँ ‘बनवाने’ से दाऊद का हित और निर्माण का प्रयोजन व्यक्त होता है, न कि यह कि दाऊद ने अकेले स्वयं निर्माण किया।
- source_word: ellipsis after לָשֶׁבֶת בּוֹ
  choice: वैसा ही मेरे साथ भी करो
  rationale: इब्रानी पद का लिखित रूप तुलना का उत्तरपक्ष स्पष्ट रूप से नहीं कहता और वाक्य अगले पद में आगे बढ़ता है। स्वतंत्र पद के रूप में पठनीयता हेतु निहित निवेदन मुख्य पाठ में पूरा किया गया है, पर इस पूर्ति को पाद-टिप्पणी में बताया गया है।
