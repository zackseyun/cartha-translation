base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/019.yaml
  text: And his prayer[a], and how he was entreated, and all his sin and his unfaithfulness, and the places where he built high places and set up the Asherim and the carved images before he humbled himself—behold[b], they are written in the records of the seers.
translation:
  language: hi
  text: और उसकी प्रार्थना, और कैसे उसकी विनती सुनी गई, और उसके सारे पाप और उसका विश्वासघात, और वे स्थान जहाँ उसने अपने दीन होने से पहले ऊँचे पूजा-स्थल बनाए और अशेरा-प्रतीक[a] तथा खुदी हुई मूर्तियाँ खड़ी कीं—देखो, वे दर्शियों के वृत्तांतों[b] में लिखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा के खंभे।” हिब्रू शब्द अशेरा से जुड़ी उपासना-वस्तुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “होजै के वृत्तांत में।” अंतिम हिब्रू वाक्यांश में सामान्य शब्द “दर्शी” के बजाय “होजै” नाम हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תְפִלָּתוֹ
  choice: उसकी प्रार्थना
  rationale: תְּפִלָּה का सामान्य और स्वाभाविक हिन्दी अर्थ ‘प्रार्थना’ है; यह संदर्भ में की गई विनती को भी समेटता है।
- source_word: הֵעָתֶר לוֹ
  choice: कैसे उसकी विनती सुनी गई
  rationale: यह रूप प्रार्थना पर अनुकूल प्रत्युत्तर को दर्शाता है। हिन्दी में यह निष्क्रिय अभिव्यक्ति मूल में कर्ता के अनुल्लेख को बनाए रखते हुए अर्थ स्पष्ट करती है।
- source_word: כָל חַטָּאתוֹ
  choice: उसके सारे पाप
  rationale: हिब्रू में एकवचन सामूहिक अर्थ रख सकता है; स्वाभाविक हिन्दी में बहुवचन ‘सारे पाप’ उसी समग्रता को स्पष्ट रूप से व्यक्त करता है।
- source_word: מַעְלוֹ
  choice: उसका विश्वासघात
  rationale: מעל धार्मिक और वाचागत निष्ठा के उल्लंघन का बोध देता है; ‘विश्वासघात’ उसके नैतिक-धार्मिक बल को बनाए रखता है।
- source_word: בָּמוֹת
  choice: ऊँचे पूजा-स्थल
  rationale: ‘ऊँचे स्थान’ अकेले हिन्दी पाठक के लिए केवल भौगोलिक ऊँचाई जता सकता है; ‘पूजा-स्थल’ जोड़ने से इनके उपासना-केंद्र होने का अर्थ स्पष्ट होता है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरा-प्रतीक
  rationale: यह बहुवचन अशेरा से जुड़े उपासना-विषयक प्रतीकों को सूचित करता है, पर उनकी ठीक बनावट निश्चित नहीं करता; इसलिए ‘खंभे’ जैसे अधिक विशिष्ट रूप से बचा गया है।
- source_word: הַפְּסִלִים
  choice: खुदी हुई मूर्तियाँ
  rationale: פסילים का ठोस अर्थ तराशी या खोदकर बनाई गई उपासना-मूर्तियाँ है; यह अनुवाद केवल ‘मूरतों’ या ‘देवताओं’ की अपेक्षा उस अर्थ को बनाए रखता है।
- source_word: לִפְנֵי הִכָּנְעוֹ
  choice: उसके दीन होने से पहले
  rationale: हिब्रू रूप के आत्मवाचक/अकर्मक भाव को ‘दीन होने’ से स्वाभाविक हिन्दी में रखा गया है, बिना यह तय किए कि उसे बाहरी रूप से दीन किया गया था।
- source_word: הִנָּם
  choice: देखो
  rationale: यह प्रस्तुतिपरक अव्यय ध्यान आकर्षित करता है; ‘देखो’ आधुनिक हिन्दी में बोधगम्य रहते हुए मूल का साहित्यिक बल रखता है।
- source_word: עַל דִּבְרֵי חוֹזָי
  choice: दर्शियों के अभिलेखों में
  rationale: व्यंजन-पाठ को सामान्य संज्ञा के रूप में पढ़ने पर ‘दर्शियों के वृत्तांत/अभिलेख’ अर्थ बनता है। लिखित स्रोत के संदर्भ में ‘अभिलेखों’ स्वाभाविक है; ‘होजै’ नाम की वैकल्पिक सम्भावना पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הִכָּנְעוֹ में मनश्शे के दीन होने की प्रकृति
  choice: उसके दीन होने से पहले
  alternative: उसे दीन किए जाने से पहले
  rationale: हिब्रू रूप आत्मवाचक अथवा अकर्मक अर्थ का समर्थन करता है और इतिहास-वृत्तांत में मनश्शे के दीन होने पर बल देता है। चयन यह अनावश्यक रूप से निर्धारित नहीं करता कि पहल पूर्णतः उसकी थी या बाहरी परिस्थिति से हुई।
- issue: प्रार्थना का उत्तर देने वाले की स्पष्ट पहचान
  choice: कैसे उसकी विनती सुनी गई
  alternative: कैसे परमेश्वर ने उसकी विनती सुनी
  rationale: संदर्भ में परमेश्वर निहित हैं, पर इस पद के संबंधित वाक्यांश में कर्ता स्पष्ट नहीं है। निष्क्रिय हिन्दी मूल की संक्षिप्तता और निहितता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की अभिलेखीय शैली बनाए रखते हुए लंबे हिब्रू समन्वय को हिन्दी विराम-चिह्नों से व्यवस्थित किया गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
