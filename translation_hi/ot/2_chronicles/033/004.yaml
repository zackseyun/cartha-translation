  yaml_path: translation/ot/2_chronicles/033/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem my name will be forever.”
translation:
  language: hi
  text: उसने याहवे के भवन[a] में वेदियाँ बनाईं। याहवे ने इस भवन के बारे में कहा था[b], “यरूशलेम में मेरा नाम सदा रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “याहवे के मंदिर में।” शाब्दिक अर्थ: “याहवे के भवन में।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “मेरा नाम सदा रहेगा।” बाइबल में इससे मिलती-जुलती सामान्य अभिव्यक्ति है, “मेरा नाम वहाँ सदा रहेगा।”'
    reason: cross_reference
lexical_decisions:
- source_word: וּבָנָה
  choice: उसने … बनाईं
  rationale: בנה का काल रूप पूर्ण की गई क्रिया बताता है। आरंभिक ו को अलग से ‘और’ कहना हिन्दी कथन-प्रवाह में आवश्यक नहीं है।
- source_word: מִזְבְּחוֹת
  choice: वेदियाँ
  rationale: מִזְבֵּחַ का बहुवचन है और बलि चढ़ाने की वेदियों के लिए प्रचलित, स्वाभाविक हिन्दी शब्द है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ है और यहाँ उससे मंदिर अभिप्रेत है। ‘भवन’ मूल रूपक को रखते हुए धार्मिक संदर्भ में गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में ध्वन्यंतरित किया गया है।
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: इसी भवन के विषय में याहवे ने कहा था
  rationale: אֲשֶׁר का संबंध निकटतम पूर्वपद ‘याहवे के भवन’ से है। हिन्दी में दो वाक्यों द्वारा ‘इसी भवन के विषय में’ कहना इस संबंध को स्पष्ट और स्वाभाविक रखता है। ‘कहा था’ पूर्ववर्ती दिव्य कथन को कथा की वर्तमान घटना से पहले का दिखाता है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग בְּ और स्थाननाम का सीधा अनुवाद है; आरंभिक स्थान-वाचक पद मूल क्रम और बल को बनाए रखता है।
- source_word: יִהְיֶה שְּׁמִי לְעוֹלָם
  choice: मेरा नाम सदा रहेगा
  rationale: वाक्यांश का सीधा अर्थ यही है। मूल पाठ में ‘वहाँ’ नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ निजी ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे किसी उपाधि से बदले बिना अधिक निकटता से ध्वन्यंतरित करता है।
- issue: ‘मेरा नाम सदा रहेगा’ में ‘वहाँ’ जोड़ना या न जोड़ना
  choice: ‘मेरा नाम सदा रहेगा’—‘वहाँ’ जोड़े बिना
  alternative: ‘मेरा नाम वहाँ सदा रहेगा’
  rationale: इस पद के इब्रानी पाठ में שָׁם (‘वहाँ’) नहीं है। समान बाइबलीय अभिव्यक्तियों के आधार पर शब्द जोड़ने के बजाय पाठ की संक्षिप्तता और संभावित तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और शैली सहज किंतु गरिमापूर्ण रखी गई है। ‘भवन’ मूल इब्रानी रूपक को बनाए रखता है, जबकि पादटिप्पणी में अधिक व्याख्यात्मक ‘मंदिर’ दिया गया है। मूल के संबंधवाचक वाक्य को दो हिन्दी वाक्यों में बाँटकर उसके आशय को स्पष्ट किया गया है।
