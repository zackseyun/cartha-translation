  text: ו/יכן אֶת מִזְבַּ֣ח יְהוָ֔ה וַ/יִּזְבַּ֣ח עָלָ֔י/ו זִבְחֵ֥י שְׁלָמִ֖ים וְ/תוֹדָ֑ה וַ/יֹּ֨אמֶר֙ לִֽ/יהוּדָ֔ה לַ/עֲב֕וֹד אֶת יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/016.yaml
  text: Then he restored the altar of Yahweh and sacrificed on it sacrifices of peace offerings and thanksgiving[a], and he told Judah to serve Yahweh[b], the God of Israel.
translation:
  language: hi
  text: तब उसने याहवे की वेदी को फिर से स्थापित किया और उस पर मेल-बलियाँ[a] और धन्यवाद-बलियाँ[b] चढ़ाईं। उसने यहूदा के लोगों से कहा कि वे इस्राएल के परमेश्वर याहवे की सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शांति-बलियाँ’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘धन्यवाद’; इस बलिदान-संदर्भ में आशय ‘धन्यवाद-बलियाँ’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יכן
  choice: फिर से ठीक किया
  rationale: हिफ़ील रूप का मूल भाव वेदी को उचित दशा में तैयार या स्थापित करना है; निकटवर्ती प्रसंग में वेदी की पुनर्स्थापना अभिप्रेत है। ‘फिर से ठीक किया’ आधुनिक हिंदी में इस संदर्भगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִזְבַּח יְהוָה
  choice: यहोवा की वेदी
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिंदी रूप; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַ/יִּזְבַּח עָלָיו
  choice: उस पर … चढ़ाईं
  rationale: זבח बलिदान करने या बलि चढ़ाने को बताता है, और ‘उस पर’ का संकेत वेदी की ओर है। बलियों के साथ ‘चढ़ाईं’ हिंदी धार्मिक प्रसंग में स्वाभाविक है।
- source_word: זִבְחֵי שְׁלָמִים
  choice: मेल-बलियाँ
  rationale: यह एक विशिष्ट बलि-श्रेणी है जिसका सम्बन्ध शांति, कुशलता और सहभागी भोज से है। ‘मेल-बलियाँ’ संक्षिप्त और प्रचलित है; वैकल्पिक अर्थछाया पादटिप्पणी में रखी गई है।
- source_word: וְ/תוֹדָה
  choice: और धन्यवाद-बलियाँ
  rationale: תודה का अर्थ धन्यवाद है और इस बलिदान-संदर्भ में धन्यवाद की भेंट या बलि अभिप्रेत है। हिंदी में बहुवचन प्रयोग पूर्ववर्ती बलि चढ़ाने की क्रिया और सूची के साथ स्वाभाविक है।
- source_word: וַ/יֹּאמֶר לִ/יהוּדָה
  choice: उसने यहूदा के लोगों से कहा
  rationale: शाब्दिक रूप ‘यहूदा से कहा’ है; यहाँ ‘यहूदा’ सामूहिक रूप से उसके लोगों को दर्शाता है। स्पष्टता के लिए ‘यहूदा के लोगों’ कहा गया, पर क्रिया की शक्ति को ‘आज्ञा दी’ बनाकर नहीं बढ़ाया गया।
- source_word: לַ/עֲבוֹד
  choice: सेवा करें
  rationale: עבד परमेश्वर के संबंध में आराधना को समाहित करता है, पर उसका व्यापक अर्थ ‘सेवा करना’ है। इससे वाचागत निष्ठा का पूरा दायरा बना रहता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक पदबंध का पारदर्शी हिंदी रूप, जो परमेश्वर की वाचागत पहचान को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिंदी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे नाम के रूप में सुरक्षित रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया है।
- issue: עבד का धार्मिक आशय
  choice: सेवा करें
  alternative: आराधना करें
  rationale: परमेश्वर की ‘सेवा’ में आराधना शामिल है, लेकिन इब्रानी शब्द केवल उपासना-विधि तक सीमित नहीं है। व्यापक शब्द चुनने से वाचागत आज्ञाकारिता और आराधना दोनों की अर्थ-सम्भावना बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘फिर से ठीक किया’ पुनर्स्थापना के प्रसंग को सामान्य पाठक के लिए स्पष्ट करता है। सामूहिक स्थान-नाम ‘यहूदा’ को ‘यहूदा के लोगों’ के रूप में खोला गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध शब्दों के तुरंत बाद दिए गए हैं।
