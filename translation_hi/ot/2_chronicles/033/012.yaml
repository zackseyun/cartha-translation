  text: וּ/כְ/הָצֵ֣ר ל֔/וֹ חִלָּ֕ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יִּכָּנַ֣ע מְאֹ֔ד מִ/לִּ/פְנֵ֖י אֱלֹהֵ֥י אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/012.yaml
  text: And when he was in distress[b][a], he sought the favor of Yahweh his God and humbled himself greatly before the God of his fathers.
translation:
  language: hi
  text: जब वह संकट में पड़ा, तब उसने अपने परमेश्वर याहवे से कृपा की याचना की[a] और अपने पुरखाओं के परमेश्वर के सामने अपने आप को बहुत दीन किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर याहवे से गिड़गिड़ाकर विनती की”; इब्रानी मुहावरे का शाब्दिक भाव है, “किसी के मुख को अनुकूल करना।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने पितरों के परमेश्वर”; इब्रानी में पुरुषवाची ‘पुरखाओं/पितरों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְהָצֵר לוֹ
  choice: जब वह संकट में पड़ा
  rationale: यह रचना समय और परिस्थिति दोनों बताती है। ‘संकट में पड़ा’ आधुनिक हिन्दी में स्वाभाविक है और पीड़ा में घिरने का भाव बनाए रखता है।
- source_word: חִלָּה אֶת־פְּנֵי
  choice: से कृपा की याचना की
  rationale: इब्रानी मुहावरे का शब्दशः संबंध ‘मुख को कोमल/अनुकूल करने’ से है, पर प्रसंग में इसका अर्थ किसी से अनुग्रह माँगना या विनती करना है। यह चयन प्रार्थनापूर्ण निवेदन और अनुकूलता चाहने—दोनों भावों को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהָיו
  choice: अपने परमेश्वर
  rationale: मूल का अर्थ ‘उसका परमेश्वर’ है; हिन्दी में कर्ता की ओर लौटता ‘अपने’ वही संबंध अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּכָּנַע מְאֹד
  choice: अपने आपको बहुत दीन किया
  rationale: निफ़अल रूप को इस पश्चात्तापपूर्ण प्रसंग में आत्मवाचक समझना उचित है; מְאֹד की तीव्रता ‘बहुत’ से स्पष्ट होती है।
- source_word: מִלִּפְנֵי
  choice: के सामने
  rationale: शब्दशः ‘मुख के सामने से’ यहाँ उपस्थिति के अर्थ में प्रयुक्त मुहावरा है; ‘के सामने’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: अपने पुरखाओं के परमेश्वर
  rationale: ‘पुरखाओं’ से इब्रानी के पुरुषवाची, वाचा-इतिहास से जुड़े परंपरागत पदबंध का भाव बना रहता है और यह सामान्य पाठक के लिए भी सुबोध है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण प्रस्तुत करता है, यद्यपि प्राचीन उच्चारण पूर्णतः निश्चित नहीं है।
- issue: אֱלֹהֵי אֲבֹתָיו में पूर्वज-संबंधी भाषा
  choice: अपने पुरखाओं के परमेश्वर
  alternative: अपने पूर्वजों के परमेश्वर / अपने पितरों के परमेश्वर
  rationale: ‘पुरखाओं’ स्रोत के पुरुषवाची रूप और उसके वाचा-ऐतिहासिक स्वर को रखता है; ‘पूर्वजों’ अधिक समावेशी हो सकता है, जबकि ‘पितरों’ आधुनिक सामान्य पाठक के लिए कुछ अधिक संस्कृतनिष्ठ है।
- issue: וַיִּכָּנַע का वाच्य
  choice: अपने आपको बहुत दीन किया
  alternative: बहुत दीन हो गया / बहुत अधीन हो गया
  rationale: रूप को व्याकरणतः निष्क्रिय या मध्यवाच्य समझना संभव है, लेकिन प्रसंग मनश्शे की जानबूझकर की गई पश्चात्तापपूर्ण प्रतिक्रिया की ओर संकेत करता है; आत्मवाचक हिन्दी इस तनाव को सबसे स्वाभाविक रूप से रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याचना’ और ‘दीन किया’ धार्मिक प्रसंग के अनुरूप हैं, पर अत्यधिक पुरातन नहीं। ‘पुरखाओं’ स्रोत के पुरुषवाची ऐतिहासिक पदबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
