base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/015.yaml
  text: He removed the foreign gods and the idol from the house of Yahweh[a], and all the altars that he had built on the mountain of the house of Yahweh and in Jerusalem[b], and he threw them outside the city.
translation:
  language: hi
  text: उसने यहोवा के भवन से विदेशी देवताओं और मूर्ति[a] को, और यहोवा के भवन के पर्वत पर तथा यरूशलेम में उसके द्वारा बनाई गई सभी वेदियों को हटा दिया और उन्हें नगर के बाहर फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रतिमा’। इब्रानी शब्द उपासना में प्रयुक्त मूर्ति या प्रतिमा को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: हटा दिया
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को दूर करने का अर्थ देता है; ‘हटा दिया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: पराए देवताओं
  rationale: यह पदबंध यहोवा से भिन्न, विदेशी देवताओं को सूचित करता है; ‘पराए देवता’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: הַסֶּמֶל
  choice: मूर्ति
  rationale: यह शब्द उपासना में प्रयुक्त प्रतिमा या मूर्ति को दर्शा सकता है; ‘मूर्ति’ धार्मिक प्रसंग को स्पष्ट रखते हुए शब्द की व्यापकता बनाए रखता है।
- source_word: מִבֵּית יְהוָה
  choice: यहोवा के भवन से
  rationale: ‘भवन’ मूल इब्रानी अभिव्यक्ति को सुरक्षित रखता है और इस प्रसंग में मंदिर के रूप में सहज समझा जाता है।
- source_word: וְכָל הַמִּזְבְּחוֹת
  choice: सभी वेदियों
  rationale: बहुवचन संज्ञा और ‘सब’ का सीधा, स्वाभाविक अनुवाद।
- source_word: אֲשֶׁר בָּנָה
  choice: बनाई हुई
  rationale: वेदियाँ पहले बनाई गई थीं; हिन्दी का कृदंत रूप घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּהַר בֵּית יְהוָה
  choice: यहोवा के भवन के पर्वत पर
  rationale: ‘पर्वत’ הַר का निकट अनुवाद है और ‘मंदिर पर्वत’ जैसी व्याख्यात्मक संक्षिप्ति से बचता है।
- source_word: וּבִירוּשָׁלָם
  choice: और यरूशलेम में
  rationale: स्थान-सूचक पदबंध का सीधा अनुवाद।
- source_word: וַיַּשְׁלֵךְ
  choice: फेंक दिया
  rationale: क्रिया बलपूर्वक बाहर कर देने या फेंकने का जीवंत भाव रखती है।
- source_word: חוּצָה לָעִיר
  choice: नगर के बाहर
  rationale: दिशा और गंतव्य दोनों का स्वाभाविक हिन्दी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ उस नाम को उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबी इब्रानी समन्वयी संरचना को दो हिन्दी वाक्यों में बाँटा गया है, जबकि सभी वस्तुओं को हटाने और नगर के बाहर फेंकने का आशय सुरक्षित है।
