base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/013.yaml
  text: He prayed to him[a], and he was moved by his entreaty, heard his supplication, and brought him back to Jerusalem to his kingdom[c][b]. Then Manasseh knew that Yahweh is God.
translation:
  language: hi
  text: उसने उनसे प्रार्थना की, और उन्होंने उसकी विनती स्वीकार की, उसकी दीन विनती सुनी, और उसे यरूशलेम में उसके राजपद पर वापस ले आए। तब मनश्शे ने जान लिया कि यहोवा ही परमेश्वर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל אֵלָיו
  choice: उसने उनसे प्रार्थना की
  rationale: हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है। आदरसूचक ‘उनसे’ हिंदी में परमेश्वर की ओर व्यक्तिगत संबोधन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיֵּעָתֶר לוֹ
  choice: उन्होंने उसकी विनती स्वीकार की
  rationale: निफ़अल रूप का भाव है कि परमेश्वर ने विनती पर अनुकूल उत्तर दिया। यह प्रयोग हिंदी में स्पष्ट है और केवल भावुक होने का अर्थ आरोपित नहीं करता।
- source_word: וַיִּשְׁמַע תְּחִנָּתוֹ
  choice: उसकी गिड़गिड़ाहट सुनी
  rationale: תְּחִנָּה दया या कृपा के लिए की गई गंभीर याचना है; ‘गिड़गिड़ाहट’ उसकी तीव्रता और विनम्रता को व्यक्त करती है।
- source_word: וַיְשִׁיבֵהוּ יְרוּשָׁלַםִ לְמַלְכוּתוֹ
  choice: उसे यरूशलेम लौटा कर फिर उसके राजपद पर स्थापित किया
  rationale: हिफ़इल क्रिया ‘लौटाना’ दर्शाती है और לְמַלְכוּתוֹ उसके शाही शासन की बहाली को सूचित करता है। ‘राजपद’ हिंदी में इसे भौगोलिक राज्य समझे जाने से बचाता है।
- source_word: וַיֵּדַע מְנַשֶּׁה
  choice: तब मनश्शे ने जान लिया
  rationale: ‘तब’ कथानक में परिणाम को स्वाभाविक रूप से जोड़ता है, और ‘जान लिया’ अर्जित पहचान के भाव को व्यक्त करता है।
- source_word: כִּי יְהוָה הוּא הָאֱלֹהִים
  choice: कि यहोवा ही परमेश्वर है
  rationale: יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से रखा गया है। स्वतंत्र सर्वनाम הוּא का बल हिंदी के ‘ही’ से व्यक्त होता है; ‘एकमात्र’ नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिंदी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: כִּי יְהוָה הוּא הָאֱלֹהִים में הוּא का बल
  choice: यहोवा ही परमेश्वर है
  alternative: यहोवा परमेश्वर है / केवल यहोवा ही परमेश्वर है
  rationale: ‘ही’ हिब्रू के बलाघाती सर्वनाम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है। ‘केवल’ या ‘एकमात्र’ जोड़ना मूल की स्पष्ट अभिव्यक्ति से आगे जाता।
- issue: וַיֵּעָתֶר לוֹ में परमेश्वर की प्रतिक्रिया
  choice: उन्होंने उसकी विनती स्वीकार की
  alternative: वे उसकी विनती से द्रवित हुए / उन्होंने उसे अनुकूल उत्तर दिया
  rationale: चुना हुआ पाठ अनुकूल ईश्वरीय प्रत्युत्तर को स्पष्ट करता है, पर परमेश्वर में किसी विशेष भावात्मक परिवर्तन का सिद्धांत आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन क्रियारूप प्रयुक्त हैं। समानांतर हिब्रू क्रियाओं को प्रवाहपूर्ण श्रृंखला में रखा गया है।
