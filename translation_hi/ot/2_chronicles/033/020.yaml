  yaml_path: translation/ot/2_chronicles/033/020.yaml
  text: And Manasseh slept with his fathers[a], and they buried him in his house. And Amon his son reigned in his place.
translation:
  language: hi
  text: और मनश्शे अपने पुरखाओं के साथ सो गया, और उन्होंने उसे उसके घर[a] में दफना दिया। तब उसका पुत्र आमोन उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके राजमहल में।’ इब्रानी में ‘उसका घर’ है; राजकीय संदर्भ में इसका अर्थ राजमहल या महल-परिसर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी राजकीय मृत्यु-सूत्र की निद्रा-संबंधी छवि को बनाए रखता है; केवल ‘मर गया’ कहना इस रूपक को समतल कर देता।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह मृत्यु के लिए प्रयुक्त पारंपरिक सूत्र है। आधुनिक हिन्दी में ‘पुरखाओं’ स्वाभाविक है और पूर्वज पुरुषों की ओर संकेत करने वाले אֲבֹתָיו का भाव रखता है।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उन्होंने उसे ... दफना दिया
  rationale: इब्रानी में क्रिया सक्रिय बहुवचन है और उसके साथ एकवचन कर्म-प्रत्यय है; इसलिए कर्तृवाच्य बहुवचन रखा गया है।
- source_word: בֵּיתוֹ
  choice: उसके भवन में
  rationale: בַּיִת का मूल अर्थ घर है, पर राजा के संदर्भ में यह राजनिवास या महल-परिसर को सूचित कर सकता है। ‘भवन’ मूल की व्यापकता को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस सूत्र में क्रिया का अर्थ राजसत्ता ग्रहण करना है; ‘राजा हुआ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के संदर्भ में תַּחַת का अर्थ किसी के स्थान पर शासन ग्रहण करना है।
