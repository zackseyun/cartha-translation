source:
  edition: WLC
  text: וְ/לֹ֣א אוֹסִ֗יף לְ/הָסִיר֙ אֶת רֶ֣גֶל יִשְׂרָאֵ֔ל מֵ/עַל֙ הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר הֶֽעֱמַ֖דְתִּי לַ/אֲבֹֽתֵי/כֶ֑ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת אֵ֚ת כָּל אֲשֶׁ֣ר צִוִּיתִ֔י/ם לְ/כָל הַ/תּוֹרָ֛ה וְ/הַֽ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים בְּ/יַד מֹשֶֽׁה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/008.yaml
  text: And I will no longer remove the foot of Israel from upon the land that I appointed for your fathers[a], if only they are careful to do all that I commanded them[b], according to all the law and the statutes and the judgments given through Moses.
translation:
  language: hi
  text: और मैं इस्राएल का पाँव उस भूमि पर से फिर कभी नहीं हटाऊँगा, जिसे मैंने तुम्हारे पूर्वजों के लिए ठहराया था—बशर्ते कि वे मेरी दी हुई हर आज्ञा का पालन करने में सावधान रहें, अर्थात् मूसा के द्वारा दी गई सारी व्यवस्था, विधियों और न्याय-विधानों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוֹסִיף לְהָסִיר
  choice: फिर कभी नहीं हटाऊँगा
  rationale: नकार के साथ יסף और הסיר का योग दोबारा हटाने या आगे हटाते रहने से इनकार व्यक्त करता है। यह हिन्दी में स्वाभाविक रूप से उसी भाव को रखता है।
- source_word: רֶגֶל יִשְׂרָאֵל
  choice: इस्राएल
  rationale: शाब्दिक रूप ‘इस्राएल का पाँव’ भूमि में इस्राएल की उपस्थिति का मुहावरा है। मुख्य पाठ में आशय स्पष्ट और स्वाभाविक रखा गया है, जबकि ठोस मूल रूप को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: מֵעַל הָאֲדָמָה
  choice: उस भूमि पर से
  rationale: ‘पर से’ מֵעַל की स्थानवाचक शक्ति को बनाए रखता है, और वाचा-संबंधी प्रसंग में אֲדָמָה के लिए ‘भूमि’ उपयुक्त है।
- source_word: אֲשֶׁר הֶעֱמַדְתִּי לַאֲבֹתֵיכֶם
  choice: जिसे मैंने तुम्हारे पूर्वजों के लिए ठहराया था
  rationale: हिफ़ील הֶעֱמַדְתִּי यहाँ स्थापित या नियत करने का भाव देता है। ‘ठहराया’ दैवी निर्धारण को व्यक्त करता है और अस्वाभाविक शाब्दिकता से बचता है।
- source_word: רַק אִם
  choice: बशर्ते कि
  rationale: यह पदबंध कड़ी और वास्तविक शर्त प्रस्तुत करता है। ‘बशर्ते कि’ आधुनिक हिन्दी में उसका प्रतिबंधात्मक बल स्पष्ट करता है।
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: करने में सावधान रहें
  rationale: यह रचना केवल जानने नहीं, बल्कि ध्यानपूर्वक पालन करने का अर्थ देती है।
- source_word: כָּל אֲשֶׁר צִוִּיתִים
  choice: उन सब बातों को ... जिनकी मैंने उन्हें आज्ञा दी है
  rationale: समग्रता और कर्म-संबंधी सर्वनाम, दोनों को स्पष्ट रूप से रखा गया है।
- source_word: לְכָל הַתּוֹרָה
  choice: उस पूरी व्यवस्था के अनुसार
  rationale: विधियों और न्याय-विधानों के साथ कानूनी सूची में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त है; לְ को मानक या अनुरूपता के अर्थ में ‘के अनुसार’ किया गया है।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: यह חֻקִּים के विधिक अर्थ को सहज हिन्दी में रखता और पास के अन्य कानूनी पदों से अलग पहचान बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: यह מִשְׁפָּטִים की न्यायिक और नियमात्मक दोनों छायाओं को व्यक्त करता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: ‘हाथ से’ का इब्रानी मुहावरा यहाँ माध्यम या प्रतिनिधित्व बताता है। ‘के द्वारा’ आधुनिक हिन्दी में यही अर्थ स्पष्ट करता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: भूमि में इस्राएल के बने रहने की सशर्तता
  choice: भूमि से न हटाए जाने की बात को आज्ञापालन की वास्तविक शर्त से जोड़ा गया है।
  alternative: इसे स्थायी और बिना शर्त अधिकार की प्रतिज्ञा समझना, या शर्त को केवल आलंकारिक मानना।
  rationale: रַק אִם स्पष्ट रूप से शर्त लगाता है। अनुवाद व्यापक वाचा-संबंधी धर्मवैज्ञानिक प्रश्नों का निर्णय किए बिना पद में उपस्थित प्रतिज्ञा और शर्त, दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी पदों में ‘व्यवस्था, विधियाँ और न्याय-विधान’ का भेद सुरक्षित है; लंबे इब्रानी वाक्य को डैश और ‘अर्थात’ से स्पष्ट किया गया है।
