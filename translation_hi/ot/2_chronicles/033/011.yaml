base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/011.yaml
  text: So Yahweh brought against them the commanders of the army of the king of Assyria[a], and they captured Manasseh with hooks, bound him with bronze chains, and took him to Babylon.
translation:
  language: hi
  text: तब याहवे अश्शूर के राजा के सेनापतियों को उनके विरुद्ध ले आया। उन्होंने मनश्शे को अंकुशों[a] से जकड़ लिया, उसे काँसे की बेड़ियों से बाँधा और उसे बाबेल ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काँटों से” अथवा “एक अंकुश से”; इब्रानी शब्द काँटों या हुक जैसे अंकुशों का बोध करा सकता है और यहाँ बंदी को वश में रखने के किसी साधन के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: וַיָּבֵא ... עֲלֵיהֶם
  choice: उनके विरुद्ध ले आया
  rationale: हिफ़ील क्रिया के कारक अर्थ और आक्रमण के संदर्भ में עַל के विरोधसूचक अर्थ—दोनों को बनाए रखता है।
- source_word: שָׂרֵי הַצָּבָא אֲשֶׁר לְמֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के सेनापतियों
  rationale: सैन्य अधिकारियों और अश्शूर के राजा से उनके संबंध को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּלְכְּדוּ
  choice: पकड़ लिया
  rationale: सैन्य संदर्भ में לכד का अर्थ पकड़ना या बंदी बनाना है; अगला पद बंदी बनाने की रीति बताता है।
- source_word: בַּחֹחִים
  choice: अंकुशों
  rationale: חֹחִים के काँटे अथवा हुक जैसे उपकरण के ठोस बिंब को रखता है; संख्या और उपकरण की सटीक प्रकृति संदिग्ध होने के कारण पाद-टिप्पणी दी गई है।
- source_word: וַיַּאַסְרֻהוּ בַּנְחֻשְׁתַּיִם
  choice: उसे काँसे की बेड़ियों से बाँधा
  rationale: אסר के बाँधने के अर्थ तथा נְחֻשְׁתַּיִם के धातु से बने बंदीकरण के साधनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיּוֹלִיכֻהוּ בָּבֶלָה
  choice: बाबेल ले गए
  rationale: हिफ़ील क्रिया और दिशासूचक प्रत्यय दोनों का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अश्शूरी आक्रमण में परमेश्वर की भूमिका
  choice: याहवे सेनापतियों को उनके विरुद्ध ले आया
  alternative: याहवे ने उन्हें आने दिया
  rationale: मूल पाठ की हिफ़ील क्रिया इस घटना का सीधा कारक याहवे को बताती है; अनुवाद इसे केवल अनुमति देने के अर्थ में नरम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “अंकुशों” प्राचीन बंदीकरण के ठोस बिंब को बनाए रखता है, जबकि उसकी वास्तविक बनावट संबंधी अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
