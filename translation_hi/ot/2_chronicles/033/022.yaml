  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשָׂ֖ה מְנַשֶּׁ֣ה אָבִ֑י/ו וּֽ/לְ/כָל הַ/פְּסִילִ֗ים אֲשֶׁ֤ר עָשָׂה֙ מְנַשֶּׁ֣ה אָבִ֔י/ו זִבַּ֥ח אָמ֖וֹן וַ/יַּֽעַבְדֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/022.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done[b]. Amon sacrificed to all the carved images that Manasseh his father had made and served them.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुराई की, जैसा उसके पिता मनश्शे ने किया था। आमोन ने उन सभी तराशी हुई प्रतिमाओं[a] को बलियाँ चढ़ाईं, जिन्हें उसके पिता मनश्शे ने बनाया था, और उनकी सेवा की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्तियों।” हिब्रू शब्द विशेष रूप से खोदकर या काटकर बनाई गई प्रतिमाओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी उपासना की।” हिब्रू क्रिया का शाब्दिक अर्थ “सेवा करना” है और इसका प्रयोग धार्मिक सेवा के लिए भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: वही किया जो बुरा था
  rationale: यह हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है और कार्य के नैतिक मूल्यांकन को स्पष्ट रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह दिव्य मूल्यांकन व्यक्त करने वाले हिब्रू मुहावरे का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: ठीक वैसे ही जैसे ... ने किया था
  rationale: यह आमोन के आचरण और मनश्शे के पहले के आचरण के बीच स्पष्ट तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְנַשֶּׁה אָבִיו
  choice: उसके पिता मनश्शे
  rationale: सम्बन्ध और व्यक्ति का नाम स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: הַפְּסִילִים
  choice: खुदी हुई प्रतिमाओं
  rationale: यह शब्द विशेष रूप से काटकर या खोदकर बनाई गई धार्मिक प्रतिमाओं को दर्शाता है; सामान्य ‘मूर्तियों’ की अपेक्षा ठोस अर्थ अधिक सुरक्षित रहता है।
- source_word: זִבַּח
  choice: बलि चढ़ाई
  rationale: उपासना-संबंधी प्रसंग में क्रिया का अर्थ बलि अर्पित करना है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וַיַּעַבְדֵם
  choice: उनकी सेवा की
  rationale: यह मूल क्रिया ‘सेवा करना’ के निकट है और प्रसंग से उसकी धार्मिक, मूर्तिपूजक प्रकृति स्पष्ट होती है।
- source_word: אָמֹון
  choice: आमोन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: मूर्तिपूजा के प्रसंग में עבד का अर्थ
  choice: उनकी सेवा की
  alternative: उनकी उपासना की
  rationale: ‘सेवा की’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है, जबकि प्रसंग धार्मिक उपासना का भाव स्वयं स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘दृष्टि में,’ ‘बलि चढ़ाई’ और ‘सेवा की’ जैसे पद मूल की धार्मिक भाषा तथा अर्थगत तनाव को बनाए रखते हैं; दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
