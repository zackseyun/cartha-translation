  text: וַ/יֶּ֣תַע מְנַשֶּׁ֔ה אֶת יְהוּדָ֖ה וְ/יֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/009.yaml
  text: So Manasseh led Judah and the inhabitants of Jerusalem astray[a], to do more evil than the nations whom Yahweh had destroyed before the sons of Israel.
translation:
  language: hi
  text: इस प्रकार मनश्शे ने यहूदा और यरूशलेम के निवासियों को भटका दिया, ताकि वे उन जातियों से भी बढ़कर बुराई करें, जिन्हें याहवे ने इस्राएलियों[a] के सामने से नष्ट कर दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּתַע
  choice: ऐसा भटका दिया कि
  rationale: हिफ़ील रूप का कारक अर्थ—दूसरों को भटकाना—स्पष्ट करता है और अगले उद्देश्यवाचक वाक्यांश को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: יְהוּדָה וְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: यहूदा और यरूशलेम के निवासियों को
  rationale: दोनों कर्मों—यहूदा के सामूहिक समुदाय और यरूशलेम में रहने वालों—को स्पष्ट रूप से बनाए रखता है।
- source_word: לַעֲשׂוֹת רָע מִן־הַגּוֹיִם
  choice: उन्होंने उन जातियों से भी बढ़कर बुराई की
  rationale: מִן के तुलनात्मक अर्थ को स्पष्ट करते हुए ‘बुराई करना’ की इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: सन्दर्भ में यह आसपास की कनानी जातियों को सूचित करता है; ‘गैर-यहूदी’ जैसा बाद का धार्मिक भेद यहाँ नहीं थोपा गया।
- source_word: אֲשֶׁר הִשְׁמִיד יְהוָה
  choice: जिन्हें याहवे ने ... नष्ट कर दिया था
  rationale: הִשְׁמִיד की प्रबलता को ‘नष्ट कर दिया’ व्यक्त करता है; पूर्वकालिक क्रिया के लिए ‘था’ रखा गया है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: विजय और निष्कासन के इस प्रसंग में इब्रानी स्थानवाचक मुहावरे का निकट और सुबोध प्रतिरूप है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के शाब्दिक, प्रतिनिधिक पुल्लिंग बहुवचन को मुख्य पाठ में सुरक्षित रखता है; सामूहिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: उपाधि से बदलने के बजाय वाचा के व्यक्तिगत नाम का लिप्यंतरण किया गया है; ‘याहवे’ आधुनिक हिन्दी में Yahweh का सीधा रूप है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक और लिंगसूचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल की प्रतिनिधिक पुल्लिंग अभिव्यक्ति मुख्य पाठ में रखी गई है, जबकि उसका समावेशी सामूहिक आशय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘ऐसा भटका दिया कि’ कारक क्रिया और उसके परिणाम को स्वाभाविक ढंग से जोड़ता है; ‘से भी बढ़कर’ मूल की तुलना को स्पष्ट करता है।
