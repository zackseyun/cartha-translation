  yaml_path: translation/ot/2_chronicles/033/001.yaml
  text: Manasseh was twelve years old when he began to reign, and he reigned fifty-five years in Jerusalem.
translation:
  language: hi
  text: मनश्शे बारह वर्ष का था जब वह राजा बना, और उसने यरूशलेम में पचपन वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: बारह वर्ष का था
  rationale: यह इब्रानी में आयु बताने का सामान्य सूत्र है; हिन्दी में यह स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: नाम का रूप मूल इब्रानी उच्चारण के निकट रखते हुए हिन्दी बाइबल परंपरा के परिचित रूप में दिया गया है।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: इस राजकीय सूत्र में यह पद राज्यारोहण के समय को दर्शाता है। यह हिन्दी में स्वाभाविक है और 'राज्य करने लगा' के समान मूल भाव व्यक्त करता है।
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: पचपन वर्ष तक
  rationale: इब्रानी के 'पचास और पाँच' को आधुनिक हिन्दी की सामान्य संख्या-रचना में व्यक्त किया गया है; 'तक' शासन की अवधि स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: संदर्भ में क्रिया का अर्थ राजा के रूप में शासन करना है; 'राज्य किया' संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी समतुल्य है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग स्थान दर्शाता है; यह सीधा और स्वाभाविक हिन्दी अनुवाद है।
