source:
  edition: WLC
  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הַ/סֶּ֖מֶל אֲשֶׁ֣ר עָשָׂ֑ה בְּ/בֵ֣ית הָ/אֱלֹהִ֗ים אֲשֶׁ֨ר אָמַ֤ר אֱלֹהִים֙ אֶל דָּוִיד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִֽ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עֵילֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/007.yaml
  text: He put the carved image[a], the idol that he had made, in the house of God, of which God had said to David and to Solomon his son, “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: hi
  text: उसने उस खुदी हुई मूर्ति, अर्थात् उस देवप्रतिमा को जो उसने बनाई थी, परमेश्वर के भवन में रख दिया, जिसके विषय में परमेश्वर ने दाऊद और उसके पुत्र सुलैमान से कहा था, “इस भवन में और यरूशलेम में, जिसे मैंने इस्राएल के सब गोत्रों में से चुना है, मैं अपना नाम सदा के लिए रखूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: उसने ... रख दिया
  rationale: कथात्मक रूप में שׂים का सहज आधुनिक हिन्दी रूप; ‘रख दिया’ सम्पन्न घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פֶּסֶל הַסֶּמֶל
  choice: खुदी हुई मूर्ति, उस प्रतिमा
  rationale: दो निकटार्थी इब्रानी संज्ञाओं को अलग-अलग दिखाई देता रखा गया है। ‘खुदी हुई मूर्ति’ פֶּסֶל की निर्माण-विधि को और ‘प्रतिमा’ הַסֶּמֶל को व्यक्त करता है; इनके सम्भावित संबंध की सूचना पाद-टिप्पणी में है।
- source_word: אֲשֶׁר עָשָׂה
  choice: अपनी बनाई हुई
  rationale: कर्ता मनश्शे ही है; हिन्दी में कृदन्तीय पद मुख्य क्रिया से पहले स्वाभाविक है और पूर्ववर्ती निर्माण को स्पष्ट करता है।
- source_word: בְּבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: בית को ‘मन्दिर’ में व्याख्यायित करने के बजाय ‘भवन’ रखा गया है, जिससे आगे उद्धरण में इसी शब्द की पुनरावृत्ति बनी रहती है।
- source_word: אֲשֶׁר אָמַר אֱלֹהִים
  choice: जिसके विषय में परमेश्वर ने ... कहा था
  rationale: सापेक्ष उपवाक्य को परमेश्वर के भवन से जोड़ता है और मुख्य कथात्मक घटना से पहले कही गई बात को ‘कहा था’ द्वारा व्यक्त करता है।
- source_word: אֶל דָּוִיד וְאֶל שְׁלֹמֹה בְנוֹ
  choice: दाऊद और उसके पुत्र सुलैमान से
  rationale: दोनों व्यक्तियों और सुलैमान के पुत्र-संबंध को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלַם
  choice: इस भवन में और यरूशलेम में
  rationale: दोनों स्थान-सूचक पदों को बनाए रखता और בית के लिए पहले प्रयुक्त ‘भवन’ को दोहराता है।
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: जिसे मैंने इस्राएल के सब गोत्रों में से चुना है
  rationale: מן को ‘में से’ द्वारा और चुनाव के बने रहने वाले परिणाम को ‘चुना है’ द्वारा व्यक्त किया गया है; निकटतम स्त्रीलिंग पूर्वपद यरूशलेम से संबंध हिन्दी में सहज है।
- source_word: אָשִׂים אֶת שְׁמִי
  choice: मैं अपना नाम ... रखूँगा
  rationale: परमेश्वर द्वारा अपना नाम रखने की ठोस वाचाई अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
- source_word: לְעֵילֹום
  choice: सदा के लिए
  rationale: לְעוֹלָם का सामान्य, गरिमापूर्ण और सहज हिन्दी समतुल्य।
theological_decisions:
- issue: ईश्वरीय नाम/उपाधि
  choice: परमेश्वर
  alternative: यहोवा
  rationale: मूल पाठ में אֱלֹהִים है, יהוה नहीं; इसलिए वाचाई नाम को आयात किए बिना ‘परमेश्वर’ रखा गया है।
- issue: परमेश्वर का नाम रखने की मन्दिर-संबंधी अभिव्यक्ति
  choice: मैं अपना नाम सदा के लिए रखूँगा
  alternative: मैं अपने नाम को सदा के लिए वहाँ स्थापित करूँगा / मैं अपने नाम को सदा निवास कराऊँगा
  rationale: इब्रानी पाठ की अभिव्यक्ति को बनाए रखा गया है और उसे परमेश्वर की उपस्थिति या निवास की विस्तृत धर्मवैज्ञानिक व्याख्या में नहीं बदला गया।
- issue: אֲשֶׁר का निकटतम संबंध
  choice: यरूशलेम, जिसे मैंने ... चुना है
  alternative: इस भवन और यरूशलेम, जिन्हें मैंने ... चुना है
  rationale: एकवचन सापेक्ष रूप और वाक्य का निकटतम पूर्वपद यरूशलेम की ओर संकेत करते हैं; हिन्दी में स्त्रीलिंग ‘जिसे’ यह संबंध स्पष्ट करता है, जबकि व्यापक चुनाव-भाव को अतिरिक्त रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमेश्वर का भवन’ मूल के בית को सुरक्षित रखता है; ‘खुदी हुई मूर्ति, उस प्रतिमा’ में इब्रानी के दोनों निकटार्थी पद दिखाई देते हैं। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में सम्मिलित है।
