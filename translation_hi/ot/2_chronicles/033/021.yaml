lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: बाईस वर्ष का था
  rationale: इब्रानी आयु-सूचक मुहावरे का स्वाभाविक और सटीक आधुनिक हिन्दी रूप।
- source_word: אָמ֣וֹן
  choice: आमोन
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: ב उपसर्ग और מלך के क्रियार्थक संज्ञा-रूप से राजगद्दी संभालने का समय व्यक्त होता है; यह हिन्दी में स्वाभाविक रूप से उसी अर्थ को बताता है।
- source_word: וּשְׁתַּיִם שָׁנִים
  choice: दो वर्ष
  rationale: राज्यकाल की अवधि बताने वाली सरल संख्या-संज्ञा रचना।
- source_word: מָלַךְ
  choice: उसने ... राज्य किया
  rationale: इस प्रसंग में क्रिया का अर्थ एक निश्चित अवधि तक राजकीय शासन करना है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग सहित नगर के नाम का स्वाभाविक हिन्दी रूप।
