lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाईं
  rationale: בנה के क़ाल वय्यिक्तोल रूप से मनश्शे की बीती हुई कथात्मक क्रिया व्यक्त होती है; हिंदी में सामान्य भूतकाल स्वाभाविक है। आरंभिक וַ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: מִזְבְּחוֹת
  choice: वेदियाँ
  rationale: מזבח का बहुवचन बलि या धूप चढ़ाने की वेदियों के लिए मानक शब्द है; ‘वेदियाँ’ इसका प्रचलित और सीधा हिंदी समतुल्य है।
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: आकाश के सारे गण के लिए
  rationale: צְבָא הַשָּׁמַיִם आकाशीय पिंडों अथवा शक्तियों के समूह को सूचित करता है जिनकी नक्षत्र-उपासना में पूजा होती थी। ‘आकाश के सारे गण’ बाइबलीय मुहावरे और उसकी सामूहिक धारणा को बनाए रखता है; לְ का अर्थ यहाँ उनके सम्मान या उपासना के लिए वेदियाँ बनाना है।
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: दोनों आँगनों में
  rationale: בִּשְׁתֵּי ठीक दो आँगनों का संकेत देता है। ‘दोनों आँगनों में’ आधुनिक हिंदी में ‘दो आँगनों में’ से अधिक स्वाभाविक रूप से उन ज्ञात दोनों आँगनों को दर्शाता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है और संदर्भ मंदिर का है। ‘यहोवा के भवन’ मूल अभिव्यक्ति को बनाए रखते हुए हिंदी में गरिमापूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिंदी बाइबल परंपरा में पहचाने जाने योग्य ‘यहोवा’ उसका नाम-रूप बनाए रखता है, न कि उसे उपाधि ‘प्रभु’ से बदलता है; ‘याहवे’ अधिक संभावित शैक्षिक उच्चारण है।
- issue: צְבָא הַשָּׁמָיִם का आशय
  choice: आकाश के सारे गण
  alternative: सारी आकाशीय सेना
  rationale: अभिव्यक्ति खगोलीय पिंडों या आकाशीय शक्तियों—जिनकी यहाँ उपासना की गई—के लिए प्रयुक्त हो सकती है। मुख्य पाठ में पारंपरिक सामूहिक मुहावरा रखा गया है और टिप्पणी में संदर्भगत अर्थ स्पष्ट किया गया है, बिना यह निश्चित किए कि केवल तारे या केवल आत्मिक प्राणी अभिप्रेत हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली अपनाई गई है। ‘भवन’, ‘आँगन’ और ‘वेदियाँ’ सामान्य पाठक के लिए समझने योग्य रहते हुए मंदिर-संदर्भ को बनाए रखते हैं।
