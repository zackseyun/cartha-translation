translation:
  language: hi
  text: उसके सेवकों ने उसके विरुद्ध षड्यंत्र किया और उसी के घर में उसे मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: उसके विरुद्ध षड्यंत्र किया
  rationale: קשר על राजकीय हत्या के प्रसंग में किसी के विरुद्ध षड्यंत्र रचने का अर्थ देता है। यह चयन विरोध और गुप्त योजना, दोनों भावों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: राजदरबार के संदर्भ में עבד राजा के सेवकों या अधीनस्थ अधिकारियों को सूचित कर सकता है। ‘सेवकों’ मूल पद की व्यापकता बनाए रखता है और पद या दासत्व को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיְמִיתֻהוּ
  choice: उसे मार डाला
  rationale: מות का हिफ़ील रूप यहाँ मृत्यु का कारण बनने, अर्थात हत्या करने, को व्यक्त करता है। ‘मार डाला’ आधुनिक हिंदी में स्पष्ट, गंभीर और स्वाभाविक है।
- source_word: בְּבֵיתוֹ
  choice: उसी के घर में
  rationale: ב स्थान को और प्रत्यय उसके घर को सूचित करता है। ‘उसी के’ स्वाभाविक हिंदी में इस बात पर बल देता है कि हत्या उसके अपने घर में हुई, बिना अर्थ बदले।
