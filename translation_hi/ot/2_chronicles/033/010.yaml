reference: 2 Chronicles 33:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מְנַשֶּׁ֥ה וְ/אֶל עַמּ֖/וֹ וְ/לֹ֥א הִקְשִֽׁיבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/010.yaml
  text: And Yahweh spoke to Manasseh and to his people[a], but they did not listen.
translation:
  language: hi
  text: याहवे ने मनश्शे और उसकी प्रजा से बात की, पर उन्होंने ध्यान नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: बात की
  rationale: पिएल रूप में דבר का अर्थ यहाँ किसी से बोलना है; אֶל के साथ आधुनिक हिन्दी में ‘से बात की’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: עַם राजकीय कथा के इस संदर्भ में मनश्शे के अधीन लोगों को दर्शाता है; ‘प्रजा’ इस संबंध को सहज हिन्दी में व्यक्त करती है।
- source_word: וְלֹא
  choice: पर ... नहीं
  rationale: वाव यहाँ परमेश्वर के बोलने और उनकी प्रतिक्रिया के अभाव के बीच विरोध दिखाता है; हिन्दी में ‘पर’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִקְשִׁיבוּ
  choice: ध्यान नहीं दिया
  rationale: קשב के हिफ़ील रूप में ध्यान लगाकर सुनने और उसके अनुरूप प्रतिक्रिया देने का भाव है; ‘ध्यान नहीं दिया’ इस पद में केवल ध्वनि सुनने से अधिक व्यापक आशय रखता है।
theological_decisions:
- issue: बहुवचन क्रिया הִקְשִׁיבוּ का कर्ता
  choice: ‘उन्होंने’ से मनश्शे और उसकी प्रजा दोनों अभिप्रेत हैं।
  alternative: बहुवचन केवल प्रजा को सूचित करे, जबकि मनश्शे अलग संबोधित व्यक्ति हो।
  rationale: दोनों संबोधित पक्षों—मनश्शे और उसकी प्रजा—के बाद बहुवचन क्रिया आती है; सबसे सीधा पाठ दोनों को सम्मिलित करता है। हिन्दी सर्वनाम ‘उन्होंने’ मूल की संक्षिप्तता बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘याहवे’ में ईश्वरीय नाम सुरक्षित रखा गया है और ‘ध्यान नहीं दिया’ attentive listening की अर्थ-छाया व्यक्त करता है।
