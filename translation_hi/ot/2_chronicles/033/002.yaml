  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/002.yaml
  text: He did what was evil in the sight of Yahweh[a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुरा किया, उन जातियों के घिनौने कामों के अनुसार जिन्हें याहवे ने इस्राएल के पुत्रों[a] के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक मुहावरेदार रूप में, “इस्राएली।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने ... बुरा किया
  rationale: עשה के साथ विशेषण הרע यहाँ संज्ञात्मक अर्थ देता है—‘उसने वह किया जो बुरा था।’ हिंदी में ‘बुरा किया’ इसी नैतिक मूल्यांकन को स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: हिब्रू के मूल्यांकन-सूचक मुहावरे ‘याहवे की आँखों में’ का स्वाभाविक हिंदी रूप ‘याहवे की दृष्टि में’ है; इससे मूल रूपक का आशय बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिंदी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כְּתוֹעֲבוֹת
  choice: घिनौने कामों के अनुसार चला
  rationale: תועבות का नैतिक और उपासना-संबंधी तीखा भाव ‘घिनौने काम’ से व्यक्त होता है। अकेला ‘घिनौनी वस्तुएँ’ अस्पष्ट होता; ‘के अनुसार चला’ כְּ द्वारा सूचित अनुरूप आचरण को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: संदर्भ में यह देश की गैर-इस्राएली प्रजा-जातियों को बताता है; ‘जातियाँ’ ऐतिहासिक संदर्भ में सीधा और परिचित हिंदी रूप है।
- source_word: הוֹרִישׁ
  choice: निकाल दिया था
  rationale: हिफ़ील रूप यहाँ देश के पूर्व निवासियों को बेदखल करने या खदेड़ने का अर्थ देता है। पूर्वकालिक घटना को ‘निकाल दिया था’ से स्पष्ट किया गया है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: निष्कासन की क्रिया के साथ यह हिब्रू मुहावरा ‘उनके सामने से’ या ‘उनके मार्ग से हटाकर’ का भाव देता है; निकट रूपक हिंदी में भी समझ में आता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल का पुरुषवाची पारिवारिक पदबंध औपचारिक रूप से सुरक्षित रखा गया है; अधिक मुहावरेदार सामूहिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। ‘याहवे’ मूल नाम का निकट और आधुनिक हिंदी लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग और सामूहिक अर्थ
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की संतान
  rationale: मूल का शाब्दिक पुरुषवाची पारिवारिक रूप मुख्य पाठ में रखा गया है, जबकि उसके व्यापक जातीय-सामूहिक अर्थ को पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घिनौने काम’ תועבות की प्रबल नैतिक-उपासना संबंधी निंदा को बनाए रखता है, और ‘के अनुसार चला’ हिंदी में आचरण की अनुरूपता स्पष्ट करता है।
