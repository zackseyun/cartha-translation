base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/006.yaml
  text: He made his sons pass through the fire in the Valley of the Son of Hinnom[a], practiced soothsaying and divination and sorcery, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[b], provoking him to anger.
translation:
  language: hi
  text: उसने अपने पुत्रों को बेन-हिन्नोम की घाटी में आग में से पार कराया[a]। उसने शुभ-अशुभ समय देखे, शकुन-विचार किया और जादू-टोना किया। उसने ओझाओं और आत्माओं से संपर्क करनेवालों से भी संबंध रखा[b]। उसने याहवे की दृष्टि में बहुत बुराई की और उसे क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक स्पष्ट अर्थ हो सकता है, “उसने अपने पुत्रों को आग में बलि चढ़ाया।” हिब्रू मुहावरे का शाब्दिक अर्थ है, “उसने अपने पुत्रों को आग में से पार कराया।”
    reason: lexical_alternative
  - marker: b
    text: “ओझाओं और आत्माओं से संपर्क करनेवालों” के लिए प्रयुक्त हिब्रू शब्द मृतकों या आत्माओं से परामर्श लेने से जुड़ी प्रथाओं और उनके साधकों को सूचित करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הֶעֱבִיר אֶת־בָּנָיו בָּאֵשׁ
  choice: अपने पुत्रों को ... आग के बीच से पार कराया
  rationale: हिब्रू के स्थापित मुहावरे को मुख्य पाठ में बनाए रखता है; यह पुत्र-बलि की ओर संकेत करता है, पर अनुवाद उस अर्थ को पाठ से अधिक स्पष्ट बनाकर नहीं थोपता।
- source_word: בְּגֵי בֶן־הִנֹּם
  choice: हिन्नोम के पुत्र की घाटी में
  rationale: स्थान-नाम के हिब्रू अर्थ को पारदर्शी ढंग से प्रस्तुत करते हुए ‘हिन्नोम’ नाम को सुरक्षित रखता है।
- source_word: וְעוֹנֵן
  choice: शुभ-अशुभ समय का विचार किया
  rationale: समय अथवा संकेतों के आधार पर भावी परिणाम जानने की इस प्रथा को साधारण आधुनिक हिन्दी में व्यक्त करता है और अगले पद נחש से कुछ भेद बनाए रखता है।
- source_word: וְנִחֵשׁ
  choice: शकुन देखे
  rationale: शकुनों अथवा संकेतों से भावी घटनाएँ जानने की क्रिया का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: וְכִשֵּׁף
  choice: जादू-टोना किया
  rationale: मंत्र-तंत्र और जादुई क्रियाओं के अर्थ को आधुनिक पाठक के लिए स्पष्ट तथा गंभीर भाषा में व्यक्त करता है।
- source_word: וְעָשָׂה אוֹב וְיִדְּעוֹנִי
  choice: ओझाओं और आत्माओं से संपर्क करनेवालों से भी व्यवहार रखा
  rationale: कठिन हिब्रू पदबंध में ऐसे साधकों अथवा प्रथाओं से संलग्नता निहित है। ‘व्यवहार रखा’ परामर्श लेने, नियुक्त करने या अन्य प्रकार से संलग्न होने के बीच अनावश्यक रूप से निर्णय नहीं करता।
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: बहुत बुराई की
  rationale: हिफ़ील רבה और क्रियार्थक संज्ञा से व्यक्त प्रचुरता या तीव्रता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में बहुत बुराई
  rationale: हिब्रू के प्रचलित मूल्यांकन-सूत्र ‘की आँखों में’ को हिन्दी के स्वाभाविक समतुल्य ‘की दृष्टि में’ से व्यक्त करता है।
- source_word: לְהַכְעִיסוֹ
  choice: उसे क्रोधित किया
  rationale: कारक अर्थ को संक्षिप्त रूप से व्यक्त करता है और इस बात पर अत्यधिक निर्णय नहीं करता कि क्रोध दिलाना उद्देश्य था या कर्मों का परिणाम।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: पुत्रों को आग से पार कराने के मुहावरे में बलि का निहितार्थ
  choice: मुहावरे को मुख्य पाठ में बनाए रखना
  alternative: अपने पुत्रों को आग में बलि चढ़ाया
  rationale: यह हिब्रू मुहावरा पुत्र-बलि के अनुष्ठान की ओर प्रबल संकेत करता है, फिर भी मूल वाक्य की अभिव्यक्ति को बनाए रखना उसके शब्दों और निहितार्थ के बीच का तनाव सुरक्षित रखता है। स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- issue: לְהַכְעִיסוֹ में उद्देश्य अथवा परिणाम
  choice: उसे क्रोधित किया
  alternative: उसे क्रोधित करने के लिए
  rationale: हिब्रू रचना उद्देश्य या परिणाम दोनों की छाया रख सकती है। चुना हुआ रूप कारक परिणाम बताता है, पर जानबूझकर परमेश्वर को क्रोधित करना ही उसका घोषित उद्देश्य था—यह अतिरिक्त दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। गूढ़ प्रथाओं की सूची में तीन अलग हिब्रू क्रियाओं का भेद यथासंभव सुरक्षित है। मुख्य पाठ में पुत्र-बलि का अर्थ अत्यधिक स्पष्ट न करके मूल मुहावरे की तनावपूर्ण अभिव्यक्ति बनाए रखी गई है।
