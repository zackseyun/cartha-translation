  text: For he rebuilt the high places that Hezekiah his father had torn down[a], and he set up altars to the Baals, and made Asherah poles[d][c][b], and bowed down to all the host of heaven and served them.
translation:
  language: hi
  text: उसने उन ऊँचे स्थानों को फिर से बनाया जिन्हें उसके पिता हिजकिय्याह ने ढा दिया था[a]। उसने बाल देवताओं के लिए वेदियाँ खड़ी कीं[b] और अशेरा-स्तंभों को बनाया[c]। उसने आकाश की सारी सेना के आगे दण्डवत् किया और उनकी सेवा की[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह लौटा और उसने बनाया”; इन दो इब्रानी क्रियाओं का संयुक्त भाव है कि उसने ढाए गए स्थानों को दोबारा बनाया।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी में “बाल” बहुवचन में है; यह बाल के विभिन्न स्थानीय रूपों, उपाधियों या प्रतिमाओं की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “अशेरा-चिह्नों”; इब्रानी पद अशेरा देवी से जुड़ी धार्मिक वस्तुओं या प्रतीकों के लिए प्रयुक्त हो सकता है, जिनका ठीक स्वरूप हर प्रसंग में निश्चित नहीं है।
    reason: lexical_alternative
  - marker: d
    text: यहाँ “आकाश की सारी सेना” से सूर्य, चन्द्रमा और तारों जैसे खगोलीय पिंड अभिप्रेत हैं, जिनकी उपासना की जाती थी; 2 राजा 21:3 देखें।
    reason: cross_reference
