  text: וַ/יַּכּוּ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּֽשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/025.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[b][a], and the people of the land made Josiah his son king in his place.
translation:
  language: hi
  text: परन्तु देश के लोगों[b] ने राजा आमोन के विरुद्ध षड्यंत्र करने वाले सभी लोगों को[a] मार डाला, और देश के लोगों ने आमोन के पुत्र योशिय्याह को आमोन के स्थान पर राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी षड्यंत्रकारियों को।”
    reason: lexical_alternative
  - marker: b
    text: “देश के लोग” एक हिब्रू अभिव्यक्ति है, जो देश की जनता को सूचित कर सकती है और जिसके सामाजिक-राजनीतिक निहितार्थ भी हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: मार डाला
  rationale: נכה का यह रूप कथा-संदर्भ में प्राणघातक प्रहार को व्यक्त करता है; यहाँ षड्यंत्रकारियों के दंड-वध का आशय स्वाभाविक है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह हिब्रू की एक स्थापित सामाजिक-राजनीतिक अभिव्यक्ति है। यह अनुवाद उसके संभावित विशिष्ट सामाजिक अर्थ को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: כָּל הַקֹּשְׁרִים
  choice: उन सभी को ... जिन्होंने ... षड्यंत्र किया था
  rationale: קשר का कृदन्त उन लोगों को दर्शाता है जो मिलकर राज-विरोधी षड्यंत्र में सम्मिलित हुए थे; वाक्यांश आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: राजा आमोन के विरुद्ध
  rationale: קשר के साथ עַל षड्यंत्र के लक्ष्य का बोध कराता है, इसलिए 'के विरुद्ध' स्पष्ट और सटीक है।
- source_word: וַיַּמְלִיכוּ
  choice: राजा बनाया
  rationale: מלך का हिफ़ील रूप किसी को राजा ठहराने या राज करने देने का अर्थ देता है; 'राजा बनाया' किसी अनुल्लिखित राज्याभिषेक-विधि को नहीं जोड़ता।
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: उसके पुत्र योशिय्याह को
  rationale: समाधिकरण-संबंध योशिय्याह की पहचान आमोन के पुत्र के रूप में कराता है; हिन्दी में यह क्रम सहज है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद राजकीय उत्तराधिकार अथवा प्रतिस्थापन दर्शाता है।
- source_word: וַ
  choice: परन्तु / फिर
  rationale: पहला वाव पिछले पद की घटना के विपरीत जन-प्रतिक्रिया दिखाता है, जबकि दूसरा कथा को आगे बढ़ाता है।
