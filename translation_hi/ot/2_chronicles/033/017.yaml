  text: Nevertheless[a], the people still sacrificed at the high places, but only to Yahweh their God.
translation:
  language: hi
  text: फिर भी[a] लोग अब भी ऊँचे स्थानों पर बलि चढ़ाते थे, पर केवल अपने परमेश्वर, याहवे, के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेकिन लोग अब भी ऊँचे स्थानों पर बलियाँ चढ़ाते थे—केवल अपने परमेश्वर, याहवे, के लिए।”
    reason: אֲבָל के विरोधात्मक बल और वाक्य-विन्यास का वैकल्पिक स्वाभाविक प्रस्तुतीकरण।
lexical_decisions:
- source_word: אֲבָל
  choice: फिर भी
  rationale: पिछले सुधारों के विपरीत बनी रही स्थिति को सहज और स्पष्ट विरोधात्मक ढंग से व्यक्त करता है।
- source_word: עוֹד
  choice: अब भी
  rationale: यह चलती आ रही प्रथा की निरंतरता दिखाता है।
- source_word: הָעָם
  choice: लोग
  rationale: कथा के संदर्भ में राष्ट्र के लोगों के लिए स्वाभाविक सामूहिक पद।
- source_word: זֹבְחִים
  choice: बलि चढ़ाते थे
  rationale: हिब्रू कृदंत यहाँ जारी अथवा प्रचलित कार्य को दर्शाता है; हिंदी का अपूर्ण भूतकाल इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּבָּמוֹת
  choice: ऊँचे स्थानों पर
  rationale: בָּמוֹת के लिए प्रचलित बाइबलीय पद, जो स्थानीय उपासना-स्थलों को सूचित करता है।
- source_word: רַק
  choice: पर केवल
  rationale: यह बलि के स्थान को नहीं, उसके प्राप्तकर्ता को सीमित करता है और वाक्य की सुधारात्मक बारीकी बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग बलि के प्राप्तकर्ता को दर्शाता है; יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिंदी में कर्ता की ओर लौटते संबंध को ‘अपने’ स्वाभाविक रूप से व्यक्त करता है और यहोवा की पहचान लोगों के परमेश्वर के रूप में करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिंदी पाठकों के लिए परिचित ‘यहोवा’ नाम को रखते हुए इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया।
- issue: ऊँचे स्थानों पर बलि चढ़ाने वाले उपवाक्य का आशय
  choice: लोग ऊँचे स्थानों पर बलि चढ़ाते रहे, लेकिन बलियाँ केवल यहोवा को चढ़ाई जाती थीं।
  alternative: लोग केवल यहोवा को समर्पित ऊँचे स्थानों पर बलि चढ़ाते थे।
  rationale: हिब्रू में רַק לַיהוָה אֱלֹהֵיהֶם बलि के प्राप्तकर्ता को सीमित करता है, स्थान को नहीं। इससे सुधार की अपूर्णता और उपासना के केवल यहोवा की ओर निर्देशित होने का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘ऊँचे स्थान’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है, और अपूर्ण भूतकाल निरंतर प्रथा को स्पष्ट करता है।
