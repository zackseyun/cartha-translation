base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/023.yaml
  text: But he did not humble himself before Yahweh as his father Manasseh humbled himself[a], for he, Amon, increased guilt.
translation:
  language: hi
  text: परन्तु उसने याहवे के सामने अपने को नम्र नहीं किया, जैसा कि उसके पिता मनश्शे ने अपने को नम्र किया था[a]; क्योंकि आमोन ने बहुत अधिक दोष बढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा कि उसके पिता मनश्शे ने याहवे के सामने अपने को नम्र किया था।”
    reason: ‘याहवे के सामने’ को तुलनात्मक उपवाक्य के साथ भी समझा जा सकता है और स्पष्टता के लिए वहाँ दोहराया जा सकता है।
lexical_decisions:
- source_word: נִכְנַע
  choice: दीन नहीं हुआ
  rationale: निफ़अल रूप यहाँ अपने को नम्र करने अथवा दीन होने का भाव देता है। पश्चात्ताप के प्रसंग में यह सहज हिंदी है और मनश्शे से किए गए विरोधात्मक तुलनात्मक संबंध को बनाए रखती है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: מִלִּפְנֵי किसी की उपस्थिति या उसके सामने होने का मुहावरा है; याहवे परमेश्वर के निजी नाम יהוה का सीधा लिप्यंतरण है।
- source_word: כְּהִכָּנַע
  choice: जैसे ... दीन हुआ था
  rationale: तुलनात्मक כְ और כנע के infinitive construct को हिंदी की स्वाभाविक तुलनात्मक रचना में व्यक्त किया गया है तथा पहले खंड की शब्दावली दोहराई गई है।
- source_word: מְנַשֶּׁה אָבִיו
  choice: उसका पिता मनश्शे
  rationale: संबंध और नाम दोनों को स्पष्ट तथा स्वाभाविक हिंदी शब्दक्रम में रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन को पिछले कथन की व्याख्या या कारण के रूप में प्रस्तुत करता है; संभावित बलाघाती अर्थ को संदर्भ में अत्यधिक निर्णायक ढंग से नहीं खोला गया।
- source_word: הוּא אָמוֹן
  choice: उसने—आमोन ने—
  rationale: सर्वनाम और नाम के बलाघात को डैशयुक्त पुनरुक्ति से रखा गया है, जो हिंदी में आमोन की ओर विशेष संकेत करती है।
- source_word: הִרְבָּה אַשְׁמָה
  choice: अपना दोष बहुत बढ़ाया
  rationale: हिफ़इल הִרְבָּה वृद्धि का भाव देता है और אַשְׁמָה यहाँ बलिदान नहीं, नैतिक दोष या अपराधिता है। यह वाक्यांश मूल की तीव्रता को स्पष्ट हिंदी में रखता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी निजी नाम सीधे आया है; 'याहवे' उसे किसी उपाधि में बदले बिना सुरक्षित रखता है।
- issue: आमोन के दोष की अभिव्यक्ति
  choice: अपना दोष बहुत बढ़ाया
  alternative: और भी अधिक दोषी होता गया
  rationale: चुना हुआ रूप הִרְבָּה के सक्रिय कारक भाव और אַשְׁמָה की संज्ञात्मकता दोनों को बनाए रखता है; विकल्प अधिक मुहावरेदार है, पर व्याकरणिक रूप को कुछ बदल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दीन हुआ’ पश्चात्तापपूर्ण नम्रता को व्यक्त करता है; डैश आमोन पर मूल पाठ के बलाघात को दर्शाते हैं।
