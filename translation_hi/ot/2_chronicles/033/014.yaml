base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/014.yaml
  text: After this he built an outer wall for the city of David[a], west of Gihon in the valley, as far as the entrance of the Fish Gate; it went around Ophel, and he made it very high[c][b]. He also placed military commanders in all the fortified cities in Judah.
translation:
  language: hi
  text: इसके बाद उसने दाऊद के नगर के लिए एक बाहरी दीवार बनाई, जो घाटी में गीहोन के पश्चिम की ओर से मछली फाटक के प्रवेश तक थी। उसने ओपेल[a] को चारों ओर से घेरा और उसे बहुत ऊँचा किया। उसने यहूदा के सभी किलाबंद नगरों में सैन्य अधिकारियों को भी नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ओपेल’ यरूशलेम का एक स्थान-नाम है; संभवतः यह मन्दिर-पर्वत के दक्षिण की ऊँची जगह थी।
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह कथा में अगले कार्य का समय-सूचक है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָּנָה
  choice: बनाई
  rationale: मूल क्रिया का सामान्य अर्थ ‘बनाना’ है; प्रसंग से पुनर्निर्माण संभव है, पर मूल क्रिया उसे अनिवार्य नहीं करती।
- source_word: חוֹמָה חִיצוֹנָה
  choice: एक बाहरी शहरपनाह
  rationale: ‘बाहरी’ חִיצוֹנָה को और ‘शहरपनाह’ नगर की रक्षात्मक חוֹמָה को स्पष्ट तथा संक्षिप्त रूप से व्यक्त करता है।
- source_word: לְעִיר דָּוִיד
  choice: दाऊदपुर के लिए
  rationale: לְ को निर्माण के उद्देश्य अथवा नगर से संबंध के रूप में लिया गया है; ‘के लिए’ हिन्दी में स्वाभाविक है।
- source_word: מַעְרָבָה לְגִיחוֹן בַּנַּחַל
  choice: घाटी में गीहोन के पश्चिम से
  rationale: स्थलाकृतिक दिशा को सरल हिन्दी में व्यक्त करता है; נחל के लिए यहाँ ‘घाटी’ उपयुक्त है।
- source_word: וְלָבוֹא בְשַׁעַר הַדָּגִים
  choice: मछली फाटक के प्रवेश तक
  rationale: यह पद शहरपनाह की स्थानिक सीमा या पहुँच बताता है; ‘तक’ उस भाव को सहजता से देता है।
- source_word: וְסָבַב לָעֹפֶל
  choice: ओपेल को चारों ओर से घेरती थी
  rationale: סבב का घेरने वाला अर्थ लिया गया है। हिन्दी वाक्य में शहरपनाह को स्पष्ट कर्ता बनाना स्थल-विन्यास और अगले स्त्रीलिंग प्रत्यय से मेल खाता है।
- source_word: וַיַּגְבִּיהֶהָ מְאֹד
  choice: उसने उसे बहुत ऊँचा बनाया
  rationale: स्त्रीलिंग कर्म-प्रत्यय शहरपनाह की ओर संकेत करता है और מְאֹד का बल ‘बहुत’ से सुरक्षित रहता है।
- source_word: שָׂרֵי חַיִל
  choice: सेनापतियों
  rationale: यह सैन्य अधिकारियों या कमांडरों के लिए आधुनिक, प्रतिष्ठित और सुबोध हिन्दी शब्द है।
- source_word: בְּכָל הֶעָרִים הַבְּצֻרוֹת
  choice: सभी किलाबंद नगरों में
  rationale: वितरणात्मक अर्थ और नगरों की सुदृढ़ सुरक्षा दोनों को सीधे व्यक्त करता है।
