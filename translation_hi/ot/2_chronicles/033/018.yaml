  text: וְ/יֶ֨תֶר דִּבְרֵ֣י מְנַשֶּׁה֮ וּ/תְפִלָּת֣/וֹ אֶל אֱלֹהָי/ו֒ וְ/דִבְרֵי֙ הַֽ/חֹזִ֔ים הַֽ/מְדַבְּרִ֣ים אֵלָ֔י/ו בְּ/שֵׁ֥ם יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל הִנָּ֕/ם עַל דִּבְרֵ֖י מַלְכֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/033/018.yaml
  text: The rest of the acts of Manasseh[a], and his prayer to his God, and the words of the seers who spoke to him in the name of Yahweh, the God of Israel—behold, they are written among the records of the kings of Israel.
translation:
  language: hi
  text: मनश्शे के शेष कार्य, उसकी वह प्रार्थना जो उसने अपने परमेश्वर से की, और उन दर्शियों की बातें जिन्होंने इस्राएल के परमेश्वर यहवे के नाम से उससे बात की थी—देखो, वे इस्राएल के राजाओं के अभिलेखों में लिखे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के राजाओं की पुस्तक/इतिहास-पुस्तिका में।” इब्रानी का यह उद्धरण-सूत्र किसी लिखित राजकीय स्रोत की ओर संकेत करता है।
    reason: ‘अभिलेखों’ के पीछे निहित लिखित राजकीय स्रोत और सम्भव वैकल्पिक अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: मनश्शे के शेष कार्य
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי केवल बोले गए शब्द नहीं, बल्कि राजा के कार्यों और घटनाओं को दर्शाता है; ‘शेष कार्य’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: תְפִלָּתוֹ אֶל אֱלֹהָיו
  choice: अपने परमेश्वर से की गई उसकी प्रार्थना
  rationale: इब्रानी के संबंधवाचक रूप और אֶל की दिशा दोनों को रखते हुए यह स्पष्ट करता है कि मनश्शे ने अपने परमेश्वर से प्रार्थना की।
- source_word: הַחֹזִים
  choice: दर्शियों
  rationale: ‘दर्शी’ विशिष्ट भविष्यद्वक्तापरक पदवी חֹזֶה को सुरक्षित रखता है; सामान्य ‘भविष्यद्वक्ता’ कहना मूल के भेद को समतल कर देता।
- source_word: בְּשֵׁם יְהוָה
  choice: यहवे के नाम से
  rationale: यह सीधा और प्रचलित अर्थ है, जो ईश्वरीय प्रतिनिधित्व और अधिकार का भाव बनाए रखता है।
- source_word: הִנָּם
  choice: देखो, वे
  rationale: ध्यान आकर्षित करने वाले इब्रानी संकेतक का बल बनाए रखने के लिए ‘देखो’ रखा गया है।
- source_word: עַל דִּבְרֵי מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के वृत्तांत में लिखे हैं
  rationale: यह राजकीय लिखित स्रोत की ओर संकेत करने वाला उद्धरण-सूत्र है; ‘वृत्तांत’ आधुनिक हिन्दी में अभिलेखित ऐतिहासिक विवरण का स्वाभाविक बोध देता है, और ‘लिखे हैं’ सूत्र में निहित लेखबद्धता को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय ईश्वरीय नाम है; ‘यहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: उद्धृत स्रोत में ‘इस्राएल के राजा’
  choice: इस्राएल के राजाओं
  alternative: यहूदा के राजाओं
  rationale: मनश्शे यहूदा का राजा था, फिर भी मसोराई पाठ स्पष्ट रूप से ‘इस्राएल’ पढ़ता है; अनुवाद संभावित ऐतिहासिक अपेक्षा के आधार पर इसे ‘यहूदा’ नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक शैली रखी गई है। ‘दर्शी’ और ‘देखो’ जैसे कुछ बाइबिलीय शब्द मूल की विशिष्टता और बल बचाने के लिए रखे गए हैं; वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट रखा गया है।
