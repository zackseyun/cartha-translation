language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א אֶל פָּנָ֗י/ו יֵה֣וּא בֶן חֲנָ֘נִי֮ הַ/חֹזֶה֒ וַ/יֹּ֨אמֶר֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹשָׁפָ֔ט הֲ/לָ/רָשָׁ֣ע לַ/עְזֹ֔ר וּ/לְ/שֹׂנְאֵ֥י יְהוָ֖ה תֶּאֱהָ֑ב וּ/בָ/זֹאת֙ עָלֶ֣י/ךָ קֶּ֔צֶף מִ/לִּ/פְנֵ֖י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/002.yaml
  text: Jehu son of Hanani the seer went out to meet him and said to King Jehoshaphat[a], “Should you help the wicked and love those who hate Yahweh? Because of this[b], wrath is upon you from the presence of Yahweh.”
translation:
  language: hi
  text: तब द्रष्टा हनानी का पुत्र येहू उससे मिलने निकला और राजा यहोशापात से बोला, “क्या आपको दुष्ट की सहायता करनी चाहिए और यहोवा से घृणा करनेवालों से प्रेम करना चाहिए? इस कारण यहोवा की ओर से आप पर क्रोध है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא אֶל־פָּנָיו
  choice: उससे मिलने निकला
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘उसके मुख/उपस्थिति की ओर निकला’ है, पर यहाँ यह किसी से मिलने के लिए बाहर जाने का स्वाभाविक मुहावरा है।
- source_word: הַחֹזֶה
  choice: द्रष्टा
  rationale: חֹזֶה एक विशिष्ट भविष्यवाणी-संबंधी पदवी है; ‘द्रष्टा’ इसे सामान्य ‘भविष्यद्वक्ता’ में विलीन किए बिना सुरक्षित रखता है।
- source_word: הֲלָרָשָׁע לַעְזֹר
  choice: क्या आपको दुष्ट की सहायता करनी चाहिए
  rationale: प्रश्नवाचक रूप तीखी फटकार व्यक्त करता है। निश्चित विशेषण को सामूहिक नैतिक श्रेणी ‘दुष्ट’ के रूप में रखा गया है, न कि अहाब का नाम जोड़कर।
- source_word: וּלְשֹׂנְאֵי יְהוָה תֶּאֱהָב
  choice: और यहोवा से घृणा करनेवालों से प्रेम करना चाहिए
  rationale: कृदंत שֹׂנְאֵי की क्रियात्मक शक्ति ‘घृणा करनेवालों’ में बनी रहती है; इसे केवल ‘शत्रुओं’ के रूप में व्याख्यायित नहीं किया गया।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וּבָזֹאת
  choice: इस कारण
  rationale: यह पदबंध यहोशापात के पूर्वोक्त आचरण को आनेवाले क्रोध का कारण बताता है।
- source_word: עָלֶיךָ קֶּצֶף
  choice: आप पर क्रोध है
  rationale: इब्रानी की ठोस रचना ‘तुम पर क्रोध’ को सहज और गंभीर हिन्दी में बनाए रखा गया है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: यहोवा की ओर से
  rationale: शाब्दिक ‘यहोवा के सम्मुख से’ यहाँ क्रोध के स्रोत को सूचित करनेवाला मुहावरा है; ‘की ओर से’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप रखा गया है।
- issue: ‘दुष्ट’ और ‘यहोवा से घृणा करनेवाले’ का दायरा
  choice: मूल की व्यापक नैतिक श्रेणियाँ बनाए रखना
  alternative: अहाब का नाम स्पष्ट रूप से जोड़ना
  rationale: ऐतिहासिक संदर्भ अहाब की ओर संकेत करता है, किन्तु इब्रानी फटकार व्यापक नैतिक शब्दों में है; इसलिए अनुवाद उस तनाव और सामान्य अनुप्रयोग को संकीर्ण नहीं करता।
- issue: מִלִּפְנֵי יְהוָה का भाव
  choice: यहोवा की ओर से
  alternative: यहोवा की उपस्थिति से
  rationale: यह पदबंध स्रोत को व्यक्त करता है। विकल्प मूल बिंब के अधिक निकट है, पर मुख्य पाठ में ‘उपस्थिति से क्रोध’ हिन्दी में अस्वाभाविक और संभावित रूप से अस्पष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक संबोधन और गरिमापूर्ण कथात्मक शैली। ‘द्रष्टा’ जैसी विशिष्ट बाइबलीय पदवी सुरक्षित रखी गई है, जबकि इब्रानी मुहावरों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
