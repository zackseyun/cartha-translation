source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יְהוֹשָׁפָ֖ט בִּ/ירוּשָׁלִָ֑ם וַ/יָּ֜שָׁב וַ/יֵּצֵ֣א בָ/עָ֗ם מִ/בְּאֵ֥ר שֶׁ֨בַע֙ עַד הַ֣ר אֶפְרַ֔יִם וַ/יְשִׁיבֵ֕/ם אֶל יְהוָ֖ה אֱלֹהֵ֥י אֲבוֹתֵי/הֶֽםס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/004.yaml
  text: So Jehoshaphat lived in Jerusalem[a], and he went out again among the people from Beersheba to the hill country of Ephraim and brought them back to Yahweh[b], the God of their fathers.
translation:
  language: hi
  text: यहोशापात यरूशलेम में रहता था। फिर वह लोगों के बीच बेर्शेबा से लेकर एप्रैम के पहाड़ी प्रदेश तक निकला और उन्हें उनके पूर्वजों के परमेश्वर याहवे[a] के पास वापस ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे” इब्रानी ईश्वरीय नाम YHWH का लिप्यंतरण है; पारंपरिक रूप “यहोवा” भी मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישׁב यहाँ बैठने की शाब्दिक क्रिया नहीं, बल्कि यरूशलेम में निवास करने का अर्थ देता है।
- source_word: וַיָּשָׁב וַיֵּצֵא
  choice: फिर वह ... निकला
  rationale: लगातार आए שוב और יצא नए सिरे से या पुनः बाहर निकलने की क्रिया व्यक्त करते हैं; स्वाभाविक हिन्दी में ‘फिर’ इसे स्पष्ट करता है।
- source_word: וַיֵּצֵא בָעָם
  choice: लोगों के बीच निकला
  rationale: בָעָם में ב को लोगों के बीच होकर भ्रमण करने के अर्थ में लिया गया है, केवल उनकी ओर जाने के अर्थ में नहीं।
- source_word: מִבְּאֵר שֶׁבַע עַד הַר אֶפְרַיִם
  choice: बेर्शेबा से लेकर एप्रैम के पहाड़ी प्रदेश तक
  rationale: מִן...עַד यात्रा की भौगोलिक सीमा बताता है और הַר אֶפְרַיִם एक पहाड़ी भूभाग का नाम है।
- source_word: וַיְשִׁיבֵם
  choice: उसने उन्हें ... की ओर फिराया
  rationale: שוב का हिफ़ील रूप किसी को लौटाने या फिराने की सकर्मक क्रिया बताता है; यह अनुवाद पश्चाताप या परिवर्तन जैसा अतिरिक्त पारिभाषिक अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम YHWH का व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ है; पादटिप्पणी ‘याहवे’ विकल्प बताती है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: उनके पुरखों के परमेश्वर
  rationale: यह स्रोत के संबंधसूचक वाक्यांश और पूर्वजों से जुड़े वाचागत भाव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में सामान्य उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। मुख्य पाठ में परिचित हिन्दी रूप रखा गया और वैकल्पिक उच्चारण पादटिप्पणी में दिया गया।
- issue: וַיְשִׁיבֵם אֶל־יְהוָה में यहोशापात की भूमिका
  choice: उसने उन्हें ... की ओर फिराया
  alternative: उसने उन्हें मन फिराने को प्रेरित किया
  rationale: हिफ़ील क्रिया यहोशापात की प्रेरक भूमिका बताती है, पर मूल यह स्पष्ट नहीं करता कि हर व्यक्ति का आंतरिक परिवर्तन किस प्रकार हुआ; इसलिए अधिक विशिष्ट धर्मशास्त्रीय भाषा से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘पुरखों’ से पारंपरिक संबंध बना रहता है, जबकि ‘पहाड़ी प्रदेश’ आधुनिक पाठक के लिए भौगोलिक अर्थ स्पष्ट करता है।
