  text: וְ/גַ֣ם בִּ֠/ירוּשָׁלִַם הֶעֱמִ֨יד יְהוֹשָׁפָ֜ט מִן הַ/לְוִיִּ֣ם וְ/הַ/כֹּהֲנִ֗ים וּ/מֵ/רָאשֵׁ֤י הָ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לְ/מִשְׁפַּ֥ט יְהוָ֖ה וְ/לָ/רִ֑יב וַ/יָּשֻׁ֖בוּ יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/008.yaml
  text: Also in Jerusalem[a], Jehoshaphat appointed some of the Levites, the priests, and the heads of the fathers’ houses of Israel for the judgment of Yahweh and for disputes[b]; and they returned to Jerusalem.
translation:
  language: hi
  text: यरूशलेम में भी यहोशापात ने कुछ लेवियों, याजकों और इस्राएल के पितृकुलों के मुखियाओं को यहोवा के न्याय और विवादों के लिए नियुक्त किया; और वे यरूशलेम लौट आए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का शाब्दिक अर्थ है, “और वे यरूशलेम लौट आए।” संदर्भ में यह कथन कुछ अप्रत्याशित है। कुछ लोग इसे “और वे यरूशलेम में रहने लगे” अथवा “बैठे” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם בִּירוּשָׁלִַם
  choice: यरूशलेम में भी
  rationale: योगात्मक וְגַם और स्थानवाचक בִּירוּשָׁלִַם को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֶעֱמִיד
  choice: नियुक्त किया
  rationale: इस प्रशासनिक और न्यायिक संदर्भ में हिफ़ईल रूप लोगों को पद अथवा दायित्व पर ठहराने का अर्थ देता है।
- source_word: מִן הַלְוִיִּם וְהַכֹּהֲנִים וּמֵרָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: कुछ लेवियों, याजकों और इस्राएल के पितृकुलों के मुखियाओं को
  rationale: מִן/מֵ का अंशवाचक भाव ‘कुछ’ से स्पष्ट होता है; ‘पितृकुल’ प्राचीन इस्राएली पारिवारिक-सामाजिक संरचना को संक्षिप्त और बोधगम्य ढंग से रखता है।
- source_word: לְמִשְׁפַּט יְהוָה
  choice: यहोवा के न्याय
  rationale: यह न्याय यहोवा से संबंधित, उसके विधान से शासित अथवा उसके अधिकार में किया गया हो सकता है; संबंधकारक रचना मूल की व्यापकता बनाए रखती है।
- source_word: וְלָרִיב
  choice: और विवादों का निर्णय करने
  rationale: רִיב न्यायिक संदर्भ में विवाद या मुकदमे को दर्शाता है। क्रियात्मक हिन्दी वाक्यांश नियुक्ति के उद्देश्य को सहज रूप से स्पष्ट करता है।
- source_word: וַיָּשֻׁבוּ יְרוּשָׁלִָם
  choice: और वे यरूशलेम लौट आए
  rationale: प्राप्त इब्रानी पाठ में שוב का सामान्य अर्थ ‘लौटना’ है, यद्यपि संदर्भ में यह वाक्यांश अप्रत्याशित लगता है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और मूल पाठ के व्यक्तिवाचक ईश्वरीय नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: לְמִשְׁפַּט יְהוָה का आशय
  choice: यहोवा के न्याय
  alternative: यहोवा की ओर से न्याय करने
  rationale: चुना हुआ संबंधकारक रूप इस अस्पष्टता को बनाए रखता है कि बात यहोवा के विधानाधीन मामलों, उसके अपने न्याय, या उसके अधिकार से किए जाने वाले न्याय की है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। न्यायिक संदर्भ को स्पष्ट करने के लिए ‘विवादों का निर्णय करने’ अपनाया गया है, जबकि ‘यहोवा के न्याय’ में मूल संबंधकारक की अर्थगत व्यापकता सुरक्षित है।
