source:
  edition: WLC
  text: אֲבָ֕ל דְּבָרִ֥ים טוֹבִ֖ים נִמְצְא֣וּ עִמָּ֑/ךְ כִּֽי בִעַ֤רְתָּ הָ/אֲשֵׁרוֹת֙ מִן הָ/אָ֔רֶץ וַ/הֲכִינ֥וֹתָ לְבָבְ/ךָ֖ לִ/דְרֹ֥שׁ הָֽ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/003.yaml
  text: Nevertheless[a], good things have been found in you[b], because you have cleared the Asherah poles out of the land and have set your heart to seek God.
translation:
  language: hi
  text: फिर भी, तुममें अच्छी बातें पाई गई हैं, क्योंकि तुमने देश से अशेरा की पूजा-वस्तुओं[a] को हटा दिया है और परमेश्वर की खोज करने के लिए अपना मन तैयार किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अशेरोत’; अर्थात देवी अशेरा से जुड़ी पूजा-वस्तुएँ।
    reason: सांस्कृतिक और शब्दार्थ संबंधी स्पष्टीकरण; वस्तुओं के सटीक भौतिक रूप को निश्चित नहीं करता।
  - marker: b
    text: या, ‘परमेश्वर की खोज में अपना मन लगाया है।’
    reason: स्वाभाविक वैकल्पिक अनुवाद
lexical_decisions:
- source_word: אֲבָל
  choice: फिर भी
  rationale: यह पिछले पद की फटकार के बाद रियायती विरोध और अब मिलने वाली प्रशंसा की ओर मोड़ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דְּבָרִים טוֹבִים
  choice: कुछ अच्छी बातें
  rationale: इब्रानी पदबंध व्यापक है; इसे केवल ‘अच्छे काम’ तक सीमित न करके गुणों और कार्यों दोनों के लिए खुला रखा गया है। हिन्दी में ‘कुछ’ निहित अनिश्चितता को सहज बनाता है।
- source_word: נִמְצְאוּ עִמָּךְ
  choice: तुझमें ... पाई गई हैं
  rationale: शाब्दिक ‘तेरे साथ’ के बजाय मूल्यांकन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; एकवचन संबोधन के अनुरूप ‘तुझमें’ रखा गया है।
- source_word: בִעַרְתָּ
  choice: हटा दिया है
  rationale: क्रिया निर्णायक रूप से दूर करने या मिटाने का अर्थ दे सकती है। ‘हटा दिया’ परिणाम को स्पष्ट करता है, पर विनाश की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָאֲשֵׁרוֹת
  choice: अशेरा-स्तंभों
  rationale: यह अशेरा से जुड़े बहुवचन पूजनीय प्रतीकों को दर्शाता है। ‘अशेरा’ नाम को बनाए रखते हुए ‘स्तंभ’ सामान्य पाठक को इनके भौतिक पूजा-चिह्न होने का संकेत देता है; सांस्कृतिक विवरण पादटिप्पणी में दिया गया है।
- source_word: מִן הָאָרֶץ
  choice: देश से
  rationale: उस भूभाग से इन पूजा-चिह्नों को निकाल देने का अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַהֲכִינוֹתָ לְבָבְךָ
  choice: अपना मन तैयार किया है
  rationale: इब्रानी क्रिया के ‘तैयार/स्थिर करना’ भाव और आंतरिक संकल्प, दोनों को बनाए रखता है; ‘हृदय’ की अपेक्षा इस मुहावरे में ‘मन’ अधिक सहज आधुनिक हिन्दी है।
- source_word: לִדְרֹשׁ הָאֱלֹהִים
  choice: परमेश्वर की खोज करने के लिए
  rationale: इतिहास-वृत्तांत में यह पदबंध केवल परमेश्वर से जानकारी पूछने का नहीं, बल्कि उनकी ओर मुड़कर उन्हें ढूँढ़ने और उनके प्रति समर्पित होने का व्यापक भाव रखता है।
theological_decisions:
- issue: הָאֲשֵׁרוֹת का स्वरूप
  choice: अशेरा-स्तंभों
  alternative: अशेरा-पूजा के प्रतीकों / अशेरोत
  rationale: मुख्य पाठ सामान्य पाठक के लिए वस्तुओं के पूजागत स्वरूप को संकेत करता है, जबकि पादटिप्पणी बताती है कि इब्रानी बहुवचन शब्द देवी अशेरा से जुड़े पूजा-चिह्नों के लिए है; इनके सटीक आकार को सिद्धांतगत रूप से निश्चित नहीं किया गया।
- issue: לִדְרֹשׁ הָאֱלֹהִים का आशय
  choice: परमेश्वर की खोज करने के लिए
  alternative: परमेश्वर से पूछने के लिए
  rationale: इस प्रसंग और इतिहास-वृत्तांत की प्रचलित शब्दावली में यह परमेश्वर की ओर सचेत अभिमुखता और भक्ति का व्यापक भाव रखता है, इसलिए इसे केवल परामर्श माँगने तक सीमित नहीं किया गया।
- issue: וַהֲכִינוֹתָ לְבָבְךָ में मानवीय संकल्प
  choice: अपना मन तैयार किया है
  alternative: अपना मन लगाया है / अपना हृदय स्थिर किया है
  rationale: मूल पाठ यहोशापात की जानबूझकर की गई आंतरिक तैयारी की प्रशंसा करता है। अनुवाद इस कथन को बनाए रखता है और अनुग्रह तथा मानवीय उत्तरदायित्व के व्यापक धर्मवैज्ञानिक संबंध को यहाँ अतिरिक्त रूप से नहीं सुलझाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। राजा से सीधे एकवचन संबोधन के कारण ‘तू/तुझमें’ प्रयुक्त है, जो बाइबिलीय कथन में सीधा है पर अपमानसूचक आशय नहीं रखता। वाक्य मूल की फटकार-पश्चात प्रशंसा, कारणसूचक संबंध और परमेश्वर की खोज के प्रमुख भाव को सुरक्षित रखता है।
