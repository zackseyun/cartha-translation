translation:
  language: hi
  text: उसने देश में[a], यहूदा के सभी गढ़वाले नगरों में, नगर-नगर न्यायियों को नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सारे देश में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किए
  rationale: עמד के हिफ़ईल रूप का अर्थ यहाँ लोगों को केवल खड़ा करना नहीं, बल्कि न्यायिक पद पर ठहराना या नियुक्त करना है।
- source_word: שֹׁפְטִים
  choice: न्यायी
  rationale: यह संज्ञा न्याय करने वाले अधिकारियों को दर्शाती है; ‘न्यायी’ हिन्दी बाइबलीय संदर्भ में परिचित और सटीक पद है।
- source_word: בָּאָרֶץ
  choice: देश में
  rationale: यह पद नियुक्तियों का क्षेत्र बताता है। मूल पूर्वसर्ग का निकट रूप ‘देश में’ है, जबकि आगे का वाक्यांश उसके व्यापक वितरण को स्पष्ट करता है।
- source_word: בְּכָל עָרֵי יְהוּדָה
  choice: यहूदा के सभी ... नगरों में
  rationale: यह न्यायियों की नियुक्ति के विस्तार को व्यक्त करता है और ‘सभी’ द्वारा समग्रता बनाए रखता है।
- source_word: הַבְּצֻרוֹת
  choice: गढ़वाले
  rationale: यह विशेषण सुरक्षित या किलेबंद नगरों का वर्णन करता है; ‘गढ़वाले नगर’ स्वाभाविक और साधारण पाठक के लिए स्पष्ट हिन्दी है।
- source_word: לְעִיר וָעִיר
  choice: एक-एक नगर के लिए
  rationale: यह वितरणसूचक इब्रानी मुहावरा प्रत्येक नगर के लिए अलग नियुक्ति पर बल देता है; यह रूप हिन्दी में उस पुनरुक्ति और आशय को स्वाभाविक ढंग से व्यक्त करता है।
