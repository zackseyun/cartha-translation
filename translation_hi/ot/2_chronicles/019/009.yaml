id: 2CH.19.9
reference: 2 Chronicles 19:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַ֥ו עֲלֵי/הֶ֖ם לֵ/אמֹ֑ר כֹּ֤ה תַעֲשׂוּ/ן֙ בְּ/יִרְאַ֣ת יְהוָ֔ה בֶּ/אֱמוּנָ֖ה וּ/בְ/לֵבָ֥ב שָׁלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/009.yaml
  text: And he commanded them[a], saying, “Thus you shall act in the fear of Yahweh[d][c][b], in faithfulness and with a whole heart.”
translation:
  language: hi
  text: और उसने उन्हें आज्ञा दी, “तुम इस प्रकार याहवे के भय[a] में, निष्ठा[b] से और पूरे मन[c] से कार्य करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् याहवे के प्रति श्रद्धापूर्ण भय में।
    reason: lexical_alternative
  - marker: b
    text: या “विश्वासयोग्यता से” अथवा “ईमानदारी से।”
    reason: lexical_alternative
  - marker: c
    text: या “अविभाजित मन से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו עֲלֵיהֶם לֵאמֹר
  choice: और उसने उन्हें आज्ञा दी
  rationale: צוה का सामान्य अर्थ आज्ञा देना है; על यहाँ आज्ञा पाने वालों को चिह्नित करता है। हिन्दी में प्रत्यक्ष कथन से पहले अलग से ‘कहते हुए’ जोड़ना अनावश्यक है।
- source_word: כֹּה תַעֲשׂוּן
  choice: तुम यह काम ... करना
  rationale: כה निर्देशित रीति को और עשה कार्य/आचरण को व्यक्त करता है। न्यायिक संदर्भ में यह स्वाभाविक हिन्दी निर्देश है।
- source_word: בְּיִרְאַת יְהוָה
  choice: यहोवा के भय में
  rationale: यह अभिव्यक्ति परमेश्वर के प्रति भय-मिश्रित श्रद्धा को व्यक्त करती है। יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: न्यायाधीशों को दिए निर्देश में אֱמוּנָה का आशय विश्वसनीय, निष्ठापूर्ण आचरण है, न कि मुख्यतः अंतर्मन का विश्वास।
- source_word: וּבְלֵבָב שָׁלֵם
  choice: और पूरे मन से
  rationale: यह चयन לֵבָב की हृदय/अंतरात्मा संबंधी छवि और שָׁלֵם की पूर्णता या अविभाजित निष्ठा—दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चतुराक्षरी व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य रूप ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक निकट लिप्यंतरण है।
- issue: אֱמוּנָה का न्यायिक संदर्भ में अर्थ
  choice: विश्वासयोग्यता
  alternative: निष्ठा / ईमानदारी
  rationale: यहाँ न्यायाधीशों के भरोसेमंद और निष्ठापूर्ण कर्तव्य-पालन पर बल है; इसे सैद्धान्तिक ‘विश्वास’ तक सीमित नहीं किया गया।
- issue: לֵבָב שָׁלֵם की व्यापकता
  choice: पूरे मन से
  alternative: अविभाजित मन से
  rationale: ‘पूरे मन से’ समग्र आंतरिक समर्पण और निष्कपटता की मूल छवि को सुरक्षित रखता है; ‘अविभाजित मन’ उसी भाव को अधिक स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज न्यायिक निर्देश। ‘भय’ की बाइबलीय अभिव्यक्ति बनाए रखते हुए पादटिप्पणी में उसका श्रद्धापूर्ण आशय स्पष्ट किया गया है।
