review_pass:
  verdict: revise
  source_fidelity: The draft conveys the three governing qualities in the Hebrew—reverent fear of YHWH, faithfulness, and wholeheartedness. However, it omits the explicit directive particle כֹּה (“thus/this is how”), and the imperative construction “तुम ... करना” is grammatically unsuitable for the plural addressees. The divine name should also align with the audit trail’s chosen rendering, Yahweh.
  naturalness: “तुम ... करना” is not natural modern standard Hindi in this direct plural instruction. “तुम इस प्रकार ... कार्य करो” is clear, dignified, and idiomatic. “निष्ठा से” is more natural than the abstract “विश्वासयोग्यता से” while retaining the judicial sense of אֱמוּנָה.
  terminology: Render YHWH as “याहवे,” corresponding to the audit trail’s “Yahweh,” rather than using the traditional but less source-transparent “यहोवा.” “याहवे का भय” retains the established biblical expression; the note appropriately clarifies its reverential sense. “निष्ठा” communicates faithful and trustworthy conduct without reducing the term to doctrinal belief.
  issues:
  - severity: medium
    issue: The phrase כֹּה (“thus/this is how”) is not represented.
    rationale: The draft’s “तुम यह काम ... करना” gives the action but does not preserve the Hebrew’s manner-of-action directive. “इस प्रकार” restores it without overtranslation.
  - severity: high
    issue: “तुम ... करना” is an ungrammatical/unnatural imperative for the plural addressees in this context.
    rationale: The Hebrew has a plural directive. Modern standard Hindi requires a finite imperative such as “करो” (or a formal plural construction), not the infinitive “करना.”
  - severity: medium
    issue: The rendering “यहोवा” does not follow the English POB audit trail’s selected personal-name form “Yahweh.”
    rationale: “याहवे” is the direct Devanagari transliteration of the stipulated rendering and distinguishes the divine name from a title.
