source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל הַ/שֹּֽׁפְטִ֗ים רְאוּ֙ מָֽה אַתֶּ֣ם עֹשִׂ֔ים כִּ֣י לֹ֧א לְ/אָדָ֛ם תִּשְׁפְּט֖וּ כִּ֣י לַ/יהוָ֑ה וְ/עִמָּ/כֶ֖ם בִּ/דְבַ֥ר מִשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/006.yaml
  text: And he said to the judges[a], “See what you are doing, for you are not judging for man, but for Yahweh[b], and he is with you in the matter of judgment.”
translation:
  language: hi
  text: और उसने न्यायाधीशों से कहा, “ध्यान दो कि तुम क्या कर रहे हो, क्योंकि तुम मनुष्य के लिए नहीं, बल्कि यहोवा के लिए न्याय करते हो; और वह न्याय के मामले में तुम्हारे साथ है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न्याय करते समय वह तुम्हारे साथ है।” हिब्रू पदबंध न्याय करने की क्रिया अथवा न्यायिक मामलों को सामान्य रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁפְטִים
  choice: न्यायियों
  rationale: שׁפט का कृदन्त यहाँ संज्ञा के रूप में नियुक्त न्यायिक अधिकारियों को सूचित करता है; ‘न्यायियों’ प्रसंगानुकूल और सहज है।
- source_word: רְאוּ מָה אַתֶּם עֹשִׂים
  choice: ध्यान दो कि तुम क्या कर रहे हो
  rationale: शाब्दिक ‘देखो’ यहाँ अपने न्यायिक आचरण पर सावधानी से विचार करने की आज्ञा है; ‘ध्यान दो’ आधुनिक हिन्दी में यही बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְאָדָם
  choice: मनुष्य के लिए
  rationale: एकवचन אָדָם यहाँ सामान्य अर्थ में मानव को यहोवा के विपरीत रखता है; ‘मनुष्य’ हिन्दी में इस सामान्य एकवचन को बनाए रखता है।
- source_word: תִּשְׁפְּטוּ
  choice: न्याय करते हो
  rationale: क्रिया न्यायिक निर्णय देने और न्याय करने को सूचित करती है; वर्तमानकालीन अभिव्यक्ति नियुक्त न्यायियों के चल रहे दायित्व के अनुकूल है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ न्यायियों के कार्य को यहोवा की ओर से और उसके प्रति उत्तरदायी सेवा के रूप में प्रस्तुत करता है; वाचा का नाम स्पष्ट रखा गया है।
- source_word: וְעִמָּכֶם
  choice: वह तुम्हारे साथ है
  rationale: हिब्रू में निहित संयोजक क्रिया हिन्दी में जोड़ी गई है; निकटतम पूर्वपद यहोवा है, इसलिए ‘वह’ स्वाभाविक है।
- source_word: בִּדְבַר מִשְׁפָּט
  choice: न्याय करते समय
  rationale: דבר משפט न्यायिक विषय, कार्यवाही या निर्णय के प्रसंग को सूचित कर सकता है। इस वाक्य में यहोवा की उपस्थिति को न्याय करने की क्रिया से जोड़ना सहज है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित व्यक्तिनाम ‘यहोवा’ प्रयोग किया गया है, न कि उपाधि ‘प्रभु’; सम्भावित उच्चारण ‘याहवे’ वैकल्पिक है।
- issue: सामान्य एकवचन אָדָם
  choice: मनुष्य
  alternative: मनुष्यों
  rationale: ‘मनुष्य’ मूल के एकवचन सामान्य अर्थ और यहोवा के साथ उसके आलंकारिक विरोध को बनाए रखता है; बहुवचन भी आशय बता सकता है, पर रूपात्मक तनाव कम कर देता है।
- issue: न्याय में ईश्वरीय उपस्थिति
  choice: न्याय करते समय वह तुम्हारे साथ है
  alternative: न्याय के विषय में वह तुम्हारे साथ है
  rationale: वाक्य न्यायियों के कार्य में यहोवा की उपस्थिति की पुष्टि करता है, पर यह अपने-आप उनके हर निर्णय के अनुमोदन का दावा नहीं करता। בִּדְבַר מִשְׁפָּט की व्यापक न्यायिक अर्थ-सीमा पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी संबोधन-शैली रखी गई है। ‘ध्यान दो’ चेतावनी का व्यावहारिक बल व्यक्त करता है; ‘न्यायियों’ और ‘न्याय’ कानूनी प्रसंग को स्पष्ट रखते हैं।
