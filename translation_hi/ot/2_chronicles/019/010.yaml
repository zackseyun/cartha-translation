  text: וְ/כָל רִיב֩ אֲשֶׁר יָב֨וֹא עֲלֵי/כֶ֜ם מֵ/אֲחֵי/כֶ֣ם הַ/יֹּשְׁבִ֣ים בְּ/עָרֵי/הֶ֗ם בֵּֽין דָּ֣ם לְ/דָם֮ בֵּין תּוֹרָ֣ה לְ/מִצְוָה֮ לְ/חֻקִּ֣ים וּ/לְ/מִשְׁפָּטִים֒ וְ/הִזְהַרְתֶּ֣ם אֹתָ֔/ם וְ/לֹ֤א יֶאְשְׁמוּ֙ לַ/יהוָ֔ה וְ/הָֽיָה קֶ֥צֶף עֲלֵי/כֶ֖ם וְ/עַל אֲחֵי/כֶ֑ם כֹּ֥ה תַעֲשׂ֖וּ/ן וְ/לֹ֥א תֶאְשָֽׁמוּ־־׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/010.yaml
  text: And every dispute that comes before you from your brothers who live in their cities—whether between blood and blood[a], between law and commandment, statutes and judgments—you shall warn them, so that they may not incur guilt before Yahweh; otherwise wrath will come upon you and upon your brothers. Do this, and you will not incur guilt.
translation:
  language: hi
  text: जब भी तुम्हारे उन भाइयों की ओर से, जो अपने-अपने नगरों में रहते हैं, कोई विवाद तुम्हारे सामने आए—चाहे वह खून और खून के बीच[a], व्यवस्था और आज्ञा के बीच, विधियों और न्याय-विधानों के बीच का मामला हो—तो उन्हें चेतावनी देना, ताकि वे याहवे के सामने दोषी न हों; नहीं तो तुम पर और तुम्हारे भाइयों पर कोप आएगा। ऐसा ही करना, तब तुम दोषी न होगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘खून और खून के बीच’; संभवतः रक्तपात या हत्या से जुड़े अलग-अलग प्रकार के मामलों की ओर संकेत है।
    reason: मूल की तकनीकी और कुछ हद तक अस्पष्ट अभिव्यक्ति का संभावित अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: רִיב
  choice: विवाद
  rationale: यह शब्द न्यायिक विवाद या मुकदमे का बोध कराता है; ‘विवाद’ आधुनिक हिन्दी में स्वाभाविक है और औपचारिक मुकदमे का अर्थ अनावश्यक रूप से नहीं थोपता।
- source_word: יָבוֹא עֲלֵיכֶם
  choice: तुम्हारे सामने आए
  rationale: न्यायिक संदर्भ में यह किसी मामले के न्यायाधीशों के विचाराधीन आने का मुहावरा है।
- source_word: מֵאֲחֵיכֶם
  choice: तुम्हारे ... भाइयों की ओर से
  rationale: मूल का वाचा-समुदाय संबंधी पारिवारिक शब्द ‘भाइयों’ के रूप में सुरक्षित रखा गया है।
- source_word: הַיֹּשְׁבִים בְּעָרֵיהֶם
  choice: जो अपने-अपने नगरों में रहते हैं
  rationale: ‘अपने-अपने नगरों’ से वितरक भाव स्पष्ट होता है और वाक्य आधुनिक हिन्दी में स्वाभाविक रहता है।
- source_word: בֵּין דָּם לְדָם
  choice: खून और खून के बीच
  rationale: मूल की संक्षिप्त और संभवतः तकनीकी अभिव्यक्ति को सुरक्षित रखा गया है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: בֵּין תּוֹרָה לְמִצְוָה לְחֻקִּים וּלְמִשְׁפָּטִים
  choice: व्यवस्था और आज्ञा के बीच, या विधियों और न्याय-विधानों के बीच
  rationale: कानूनी शिक्षा की अलग-अलग श्रेणियों को एक सामान्य शब्द में समतल किए बिना हिन्दी में स्पष्ट समानांतर संरचना दी गई है।
- source_word: וְהִזְהַרְתֶּם אֹתָם
  choice: उन्हें सावधान करना
  rationale: हिफ़ील रूप यहाँ गलत आचरण और उसके दोष से बचाने के लिए चेताने का अर्थ देता है; ‘सावधान करना’ निर्देश और चेतावनी दोनों के अनुकूल है।
- source_word: יֶאְשְׁמוּ לַיהוָה
  choice: वे याहवे के सामने दोषी न ठहरें
  rationale: यह दोषी होने और परमेश्वर के प्रति उत्तरदायी होने, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: קֶצֶף
  choice: कोप
  rationale: यह दैवी न्याय के गंभीर क्रोध को गरिमापूर्ण और प्रचलित बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: כֹּה תַעֲשׂוּן
  choice: ऐसा ही करना
  rationale: यह पूर्ववर्ती न्यायिक दायित्व का संक्षिप्त, स्वाभाविक निर्देश है।
- source_word: וְלֹא תֶאְשָׁמוּ
  choice: तुम दोषी न ठहरोगे
  rationale: पहले आए אשׁם के समान दोष-संबंधी अर्थ को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: वाचा-समुदाय के लिए אֲחֵיכֶם का अनुवाद
  choice: तुम्हारे भाई
  alternative: तुम्हारे साथी इस्राएली / तुम्हारे स्वजन
  rationale: मूल का पारिवारिक और वाचागत संबंध सुरक्षित रखा गया है; इसे लिंग-निरपेक्ष सामुदायिक शब्द से नहीं बदला गया।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिगत दिव्य नाम है; इसलिए उपाधि ‘प्रभु’ रखने के बजाय उसका लिप्यंतरण किया गया है।
- issue: אשׁם और दैवी उत्तरदायित्व
  choice: याहवे के सामने दोषी ठहरना
  alternative: याहवे के विरुद्ध दोषी होना / याहवे के प्रति दोष उठाना
  rationale: इब्रानी संबंधसूचक प्रयोग की दिशा में कुछ अस्पष्टता है; चुना गया रूप दैवी न्याय के समक्ष उत्तरदायित्व व्यक्त करता है, पर किसी विशिष्ट प्रायश्चित्त-सिद्धांत को पाठ में नहीं जोड़ता।
