lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: שׁוב का अर्थ लौटना है। यरूशलेम और अपने घर की ओर वापसी के इस कथात्मक प्रसंग में ‘लौट आया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: इब्रानी संबंधवाचक पदबंध और यहोशापात के राजकीय पद को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל בֵּיתוֹ
  choice: अपने घर
  rationale: בַּיִת के ठोस अर्थ ‘घर’ को रखा गया है; प्रत्यय को कर्ता की ओर संकेत करने वाले ‘अपने’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: בְּשָׁלוֹם
  choice: कुशल से
  rationale: שָׁלוֹם यहाँ शांति, सकुशलता और सुरक्षित वापसी का भाव समेटता है। ‘कुशल से’ हिन्दी में सहज है और केवल बाहरी सुरक्षा तक अर्थ को सीमित नहीं करता।
- source_word: לִירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: इब्रानी לְ दिशा सूचित करता है, पर ‘अपने घर’ के साथ हिन्दी में ‘यरूशलेम में अपने घर लौट आया’ स्वाभाविक है और घर का स्थान यरूशलेम बताता है।
