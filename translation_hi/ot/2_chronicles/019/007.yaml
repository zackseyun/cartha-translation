source:
  edition: WLC
  text: וְ/עַתָּ֕ה יְהִ֥י פַֽחַד יְהוָ֖ה עֲלֵי/כֶ֑ם שִׁמְר֣וּ וַ/עֲשׂ֔וּ כִּֽי אֵ֞ין עִם יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַוְלָ֛ה וּ/מַשֹּׂ֥א פָנִ֖ים וּ/מִקַּח שֹֽׁחַד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/007.yaml
  text: Now then[a], let the fear of Yahweh be upon you. Be careful and act, for with Yahweh our God there is no injustice, no partiality, and no taking of a bribe.
translation:
  language: hi
  text: अब यहोवा का भय तुम पर बना रहे। सावधान रहो और करो, क्योंकि यहोवा, हमारे परमेश्वर, में न अन्याय है, न पक्षपात[a], और न रिश्वत लेना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चेहरा उठाना”; यह किसी व्यक्ति की हैसियत देखकर उसका पक्ष लेने का इब्रानी मुहावरा है।
    reason: मूल मुहावरे की शब्द-छवि और अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले निर्देश का निष्कर्ष और आगे का आग्रह प्रस्तुत करता है; ‘इसलिए अब’ इसके संयोजक तथा तात्कालिक दोनों बलों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהִי פַחַד יְהוָה עֲלֵיכֶם
  choice: यहोवा का भय तुम पर बना रहे
  rationale: आज्ञार्थक/कामनार्थक יְהִי को ‘बना रहे’ से व्यक्त किया गया है। ‘भय’ मूल शब्द की गंभीरता और परमेश्वर के प्रति श्रद्धामिश्रित भय, दोनों की संभावना बनाए रखता है।
- source_word: שִׁמְרוּ וַעֲשׂוּ
  choice: सावधान रहो और अपना काम करो
  rationale: न्यायाधीशों के संदर्भ में שִׁמְרוּ सतर्कता की आज्ञा है और עֲשׂוּ सौंपे गए न्यायिक दायित्व को पूरा करने का आग्रह। ‘अपना काम’ संदर्भगत निहित कर्म को स्पष्ट करता है, पर कोई नया विशिष्ट कार्य नहीं जोड़ता।
- source_word: כִּי אֵין עִם יְהוָה אֱלֹהֵינוּ
  choice: क्योंकि हमारे परमेश्वर यहोवा में ... नहीं है
  rationale: עִם का शाब्दिक अर्थ ‘साथ’ है, पर यहाँ आशय परमेश्वर के चरित्र और व्यवहार में इन बुराइयों के न पाए जाने से है; हिन्दी में ‘में’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: न्यायाधीशों की नियुक्ति के प्रसंग में यह नैतिक बुराई के साथ न्याय-विकृति को विशेष रूप से व्यक्त करता है।
- source_word: מַשֹּׂא פָנִים
  choice: पक्षपात
  rationale: शाब्दिक रूप से ‘चेहरा उठाना’ व्यक्ति की हैसियत देखकर उसका पक्ष लेने का मुहावरा है; ‘पक्षपात’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: מִקַּח שֹׁחַד
  choice: रिश्वत लेना
  rationale: संज्ञात्मक पदबंध रिश्वत स्वीकार करने की क्रिया बताता है; हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: परमेश्वर के भय का स्वरूप
  choice: भय
  alternative: श्रद्धा / श्रद्धामिश्रित भय
  rationale: פַחַד का सीधा अर्थ भय है। केवल ‘श्रद्धा’ कहना मूल की चेतावनीपूर्ण गंभीरता घटा सकता है; ‘भय’ प्रसंग में श्रद्धा और जवाबदेही दोनों समेट सकता है।
- issue: परमेश्वर और अन्याय का संबंध
  choice: हमारे परमेश्वर यहोवा में न तो अन्याय है
  alternative: हमारे परमेश्वर यहोवा के साथ अन्याय नहीं है
  rationale: इब्रानी עִם (‘साथ’) को यांत्रिक रूप से रखने के बजाय अर्थानुसार ‘में’ किया गया है, जिससे यह कथन स्पष्ट होता है कि अन्याय परमेश्वर के चरित्र और न्याय में नहीं पाया जाता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम को बनाए रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक पहचाना जाने वाला रूप है; यह चयन उच्चारण-पुनर्निर्माण पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली रखी गई है। ‘तुम’ बहुवचन न्यायाधीशों को संबोधित करता है। वाक्य की त्रिस्तरीय निषेध-रचना—अन्याय, पक्षपात और रिश्वत—सुरक्षित रखी गई है।
