revisions:
- from: और देखो, प्रधान याजक[a] अमर्याह याहवे से संबंधित हर मामले में तुम्हारे ऊपर नियुक्त है, और इश्माएल का पुत्र जबद्याह, जो यहूदा के घराने का शासक है, राजा से संबंधित हर मामले में तुम्हारे ऊपर नियुक्त है। लेवीय तुम्हारे सामने अधिकारी के रूप में उपस्थित रहेंगे। दृढ़ हो जाओ और अपना काम करो; और याहवे भले जन के साथ रहे[b]।
  to: और देखो, प्रधान याजक[a] अमर्याह और इश्माएल का पुत्र जबद्याह, जो यहूदा के घराने का शासक है, तुम्हारे ऊपर हैं—अमर्याह याहवे से संबंधित हर मामले के लिए, और जबद्याह राजा से संबंधित हर मामले के लिए। लेवीय अधिकारी तुम्हारे सामने हैं। दृढ़ रहो और कार्य करो; याहवे भले व्यक्ति के साथ रहे[b]।
  rationale: The revision removes the unsupported addition “नियुक्त,” makes explicit in one coordinated Hindi construction that both named officials exercise oversight, and keeps the Hebrew’s parallel allocation of Yahweh-related and royal matters. It renders the Levite clause as a present nominal statement, avoids the added possessive in the imperative, and uses a clear singular-generic rendering for הַטּוֹב while retaining the collective possibility in the footnote.
