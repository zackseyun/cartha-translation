source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אֲמַרְיָ֣הוּ כֹהֵן֩ הָ/רֹ֨אשׁ עֲלֵי/כֶ֜ם לְ/כֹ֣ל דְּבַר יְהוָ֗ה וּ/זְבַדְיָ֨הוּ בֶן יִשְׁמָעֵ֜אל הַ/נָּגִ֤יד לְ/בֵית יְהוּדָה֙ לְ/כֹ֣ל דְּבַר הַ/מֶּ֔לֶךְ וְ/שֹׁטְרִ֥ים הַ/לְוִיִּ֖ם לִ/פְנֵי/כֶ֑ם חִזְק֣וּ וַ/עֲשׂ֔וּ וִ/יהִ֥י יְהוָ֖ה עִם הַ/טּֽוֹב־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/019/011.yaml
  text: And behold[a], Amariah the chief priest is over you in every matter of Yahweh, and Zebadiah son of Ishmael, the ruler of the house of Judah, for every matter of the king; and the Levites will serve as officers before you. Be strong and act[b], and may Yahweh be with the good.
translation:
  language: hi
  text: और देखो, प्रधान याजक[a] अमर्याह और इश्माएल का पुत्र जबद्याह, जो यहूदा के घराने का शासक है, तुम्हारे ऊपर हैं—अमर्याह याहवे से संबंधित हर मामले के लिए, और जबद्याह राजा से संबंधित हर मामले के लिए। लेवीय अधिकारी तुम्हारे सामने हैं। दृढ़ रहो और कार्य करो; याहवे भले व्यक्ति के साथ रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महायाजक।”
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे भले लोगों के साथ रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाले इब्रानी संवाद-सूचक का स्वाभाविक हिन्दी रूप है और नई प्रशासनिक व्यवस्था पर बल बनाए रखता है।
- source_word: כֹהֵן הָרֹאשׁ
  choice: प्रधान याजक
  rationale: शाब्दिक अर्थ ‘मुख्य/प्रधान याजक’ है। यह प्रशासनिक प्रसंग में पद की प्रधानता बताता है, पर ‘महायाजक’ के अधिक पारिभाषिक अर्थ को मुख्य पाठ में अनिवार्य नहीं करता।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे ऊपर नियुक्त है
  rationale: न्यायिक व्यवस्था में पर्यवेक्षण और अधिकार का भाव स्पष्ट करता है; ‘नियुक्त’ हिन्दी में निहित संबंधवाचक वाक्य को स्वाभाविक बनाता है। समानांतर दूसरे खंड में इसे स्पष्टता के लिए दोहराया गया है।
- source_word: לְכֹל דְּבַר יְהוָה
  choice: याहवे से संबंधित हर मामले में
  rationale: דָּבָר के व्यापक अर्थ—मामला, विषय या विवाद—को सुरक्षित रखता है और इसे केवल मुकदमे तक सीमित नहीं करता।
- source_word: הַנָּגִיד לְבֵית יְהוּדָה
  choice: यहूदा के घराने का शासक
  rationale: נָגִיד के नेतृत्व और प्रशासनिक अधिकार को ‘शासक’ व्यक्त करता है; בֵית को हटाए बिना ‘घराना’ रखा गया है।
- source_word: לְכֹל דְּבַר הַמֶּלֶךְ
  choice: राजा से संबंधित हर मामले में
  rationale: पहले खंड के समानांतर ढाँचे को बनाए रखते हुए राजकीय मामलों को याहवे से संबंधित मामलों से अलग दिखाता है।
- source_word: וְשֹׁטְרִים הַלְוִיִּם לִפְנֵיכֶם
  choice: लेवीय तुम्हारे सामने अधिकारी के रूप में उपस्थित रहेंगे
  rationale: שֹׁטְרִים प्रशासनिक अधिकारियों को दर्शाता है और לִפְנֵיכֶם उनकी उपस्थित तथा सहायक सेवा की भूमिका को बनाए रखता है।
- source_word: חִזְקוּ וַעֲשׂוּ
  choice: दृढ़ हो जाओ और अपना काम करो
  rationale: आदेश का साहसपूर्ण स्वर रखता है और עשה को इस प्रसंग में सौंपा गया दायित्व पूरा करने के अर्थ में स्वाभाविक हिन्दी देता है।
- source_word: וִיהִי יְהוָה עִם הַטּוֹב
  choice: और याहवे भले जन के साथ रहे
  rationale: וִיהִי की कामनासूचक शक्ति को ‘रहे’ से व्यक्त किया गया है। הַטּוֹב को किसी भले व्यक्ति के सामान्य उल्लेख के रूप में लिया गया है, जबकि उसकी व्यापक सामूहिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय उसका आधुनिक हिन्दी लिप्यंतरण दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: כֹהֵן הָרֹאשׁ को पारिभाषिक पद मानना
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: इब्रानी पदबंध का सीधा अर्थ ‘मुख्य/प्रधान याजक’ है। प्रसंग प्रशासनिक अधिकार पर केंद्रित है, इसलिए अधिक पारिभाषिक ‘महायाजक’ को सम्भव विकल्प के रूप में पादटिप्पणी में रखा गया है।
- issue: הַטּוֹב का आशय
  choice: भला जन
  alternative: भले लोग
  rationale: विशेषण के संज्ञात्मक एकवचन रूप को मुख्य पाठ में सामान्य भले व्यक्ति के रूप में रखा गया है; इसे सामूहिक अर्थ में समझना भी सम्भव है और वह पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। न्यायिक-प्रशासनिक समानांतरता को दोनों खंडों में समान वाक्य-विन्यास से उभारा गया है। ‘प्रधान याजक’ और अंतिम ‘भले जन’ की वास्तविक अर्थ-सम्भावनाएँ पादटिप्पणियों में सुरक्षित हैं।
