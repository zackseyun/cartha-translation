  text: וַ/יַּֽעַזְב֗וּ אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֔ם וַ/יַּֽעַבְד֥וּ אֶת הָ/אֲשֵׁרִ֖ים וְ/אֶת הָֽ/עֲצַבִּ֑ים וַֽ/יְהִי קֶ֗צֶף עַל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם בְּ/אַשְׁמָתָ֖/ם זֹֽאת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/018.yaml
  text: And they abandoned the house of Yahweh[a], the God of their fathers, and served the Asherim and the idols. So wrath came upon Judah and Jerusalem because of this guilt of theirs.
translation:
  language: hi
  text: उन्होंने अपने पूर्वजों के परमेश्वर याहवे का भवन छोड़ दिया और अशेरीम[a] तथा मूर्तियों की सेवा की। इसलिए उनके इस दोष के कारण यहूदा और यरूशलेम पर प्रकोप आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशेरा-खंभों’। हिब्रानी शब्द अशेरा से जुड़ी पूजा-वस्तुओं के लिए है और देवी अशेरा की ओर भी संकेत कर सकता है।
    reason: शब्दार्थ का सम्भव वैकल्पिक अनुवाद और सांस्कृतिक सन्दर्भ स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: छोड़ दिया
  rationale: עזב का मूल अर्थ छोड़ना या त्याग देना है। यहाँ ‘छोड़ दिया’ सहज आधुनिक हिन्दी में जानबूझकर मुँह मोड़ने का भाव व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: शाब्दिक अर्थ ‘याहवे का घर’ है और प्रसंग में मन्दिर अभिप्रेत है। ‘भवन’ हिब्रानी रूपक को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय उसका प्रचलित लिप्यंतरण रखा गया है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: यह पारिवारिक और वाचागत सम्बन्ध दोनों को बनाए रखता है तथा आधुनिक पाठक के लिए ‘पितरों के परमेश्वर’ से अधिक सहज है।
- source_word: וַיַּעַבְדוּ
  choice: सेवा करने लगे
  rationale: עבד देवताओं या उपास्य वस्तुओं के साथ धार्मिक सेवा अथवा उपासना का अर्थ दे सकता है। ‘सेवा’ मूल क्रिया के निकट रहते हुए धार्मिक आशय को प्रसंग से उभरने देती है।
- source_word: הָאֲשֵׁרִים
  choice: अशेरीम
  rationale: बहुवचन हिब्रानी सांस्कृतिक शब्द को लिप्यंतरित करने से यह अनिश्चितता बनी रहती है कि जोर अशेरा से जुड़ी पूजा-वस्तुओं पर है या देवी अशेरा से उनके सम्बन्ध पर।
- source_word: הָעֲצַבִּים
  choice: मूर्तियों
  rationale: यह शब्द पूजा के लिए बनाई गई प्रतिमाओं या देवमूर्तियों के लिए प्रयुक्त होता है और प्रायः निन्दात्मक भाव रखता है; ‘मूर्तियाँ’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וַיְהִי קֶצֶף
  choice: प्रकोप आया
  rationale: हिब्रानी में केवल ‘प्रकोप हुआ/आया’ कहा गया है। यह चयन संक्षिप्त परिणामसूचक कथन और उसके निहित न्यायभाव को बनाए रखता है।
- source_word: עַל יְהוּדָה וִירוּשָׁלִַם
  choice: यहूदा और यरूशलेम पर
  rationale: प्रकोप के साथ עַל का स्वाभाविक हिन्दी रूप ‘पर’ है और न्याय के उन पर आने का भाव देता है।
- source_word: בְּאַשְׁמָתָם זֹאת
  choice: उनके इस दोष के कारण
  rationale: אַשְׁמָה दोष, अपराध या उससे उत्पन्न दोषीपन का संकेत देती है। ‘उनके इस दोष के कारण’ कारणवाचक ב, संकेतवाचक ‘इस’ और सम्बन्धवाचक प्रत्यय—तीनों को व्यक्त करता है।
theological_decisions:
- issue: ‘प्रकोप’ का कर्ता या स्रोत
  choice: मुख्य पाठ में ‘प्रकोप आया’ रखकर दिव्य स्रोत को निहित रहने दिया गया
  alternative: ‘परमेश्वर का प्रकोप आया’ या ‘याहवे का प्रकोप आया’
  rationale: प्रसंग से प्रकोप का दिव्य होना स्पष्ट है, पर हिब्रानी पद में परमेश्वर का नाम या स्वत्वसूचक पद स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में जोड़ा नहीं गया।
- issue: אֲשֵׁרִים का सन्दर्भ
  choice: मुख्य पाठ में ‘अशेरीम’
  alternative: ‘अशेरा-खम्भे’, ‘अशेरा-स्तम्भ’ या ‘अशेरा की पूजा-वस्तुएँ’
  rationale: यह बहुवचन अशेरा से सम्बद्ध पंथीय वस्तुओं को सूचित कर सकता है और देवी अशेरा की ओर भी संकेत कर सकता है। लिप्यंतरण इस वास्तविक अनिश्चितता को सुरक्षित रखता है, जबकि पादटिप्पणी पाठक को अर्थ बताती है।
- issue: עבד का धार्मिक अर्थ
  choice: ‘सेवा करने लगे’
  alternative: ‘उपासना करने लगे’
  rationale: इस प्रसंग में उपासना निश्चय ही सम्मिलित है, पर ‘सेवा’ हिब्रानी क्रिया के व्यापक अर्थ और अधीनता के भाव को अधिक सीधे सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘पूर्वजों’ सामान्य पाठक के लिए स्वाभाविक है; ‘अशेरीम’ जैसे अपरिचित सांस्कृतिक शब्द को पादटिप्पणी से समझाया गया है। वाक्य की हिब्रानी क्रमिकता को हिन्दी में दो वाक्यों द्वारा स्पष्ट किया गया है।
