base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/021.yaml
  text: So they conspired against him and stoned him at the command of the king[c][b][a], in the court of the house of Yahweh.
translation:
  language: hi
  text: उन्होंने उसके विरुद्ध षड्यंत्र रचा और राजा की आज्ञा से यहोवा के भवन के आँगन में उसे पत्थरों से मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו
  choice: उन्होंने उसके विरुद्ध षड्यंत्र रचा
  rationale: קשר עם עַל यहाँ किसी के विरुद्ध मिलकर शत्रुतापूर्ण योजना बनाने का अर्थ देता है; यह हिंदी में स्वाभाविक और सटीक है।
- source_word: וַיִּרְגְּמֻהוּ אֶבֶן
  choice: उसे पत्थरवाह करके मार डाला
  rationale: רגם אבן पत्थर मारकर दंड देने और इस प्रसंग में हत्या किए जाने को व्यक्त करता है। 'पत्थरवाह करके मार डाला' हिंदी पाठक के लिए घटना का घातक परिणाम स्पष्ट करते हुए मूल क्रिया को सुरक्षित रखता है।
- source_word: בְּמִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा से
  rationale: מִצְוָה यहाँ अधिकारपूर्ण आदेश है; यह पदबंध राजा की प्रत्यक्ष जिम्मेदारी को बनाए रखता है।
- source_word: בַּחֲצַר
  choice: आँगन में
  rationale: חָצֵר भवन से घिरे खुले प्रांगण को दर्शाता है; 'आँगन' सामान्य आधुनिक हिंदी में सहज है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בֵּית का औपचारिक अनुरूप 'भवन' और יהוה का प्रचलित हिंदी नामरूप 'यहोवा' लिया गया है, जिससे मूल अभिव्यक्ति बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम יהוה है। 'यहोवा' आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि 'प्रभु' से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। वाक्य-क्रम मूल के निकट है, किंतु हिंदी प्रवाह के लिए स्थान-सूचक पदबंध अंत में रखा गया है।
