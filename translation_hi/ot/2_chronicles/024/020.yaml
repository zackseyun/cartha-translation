base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/020.yaml
  text: 'And the Spirit of God clothed Zechariah son of Jehoiada the priest[a], and he stood above the people and said to them, “Thus says God: Why are you transgressing the commandments of Yahweh, so that you do not prosper? Because you have forsaken Yahweh[b], he has also forsaken you.”'
translation:
  language: hi
  text: 'तब परमेश्वर की आत्मा ने यहोयादा याजक के पुत्र जकर्याह को वस्त्र की तरह पहन लिया[a]। वह लोगों के ऊपर खड़ा हुआ और उनसे बोला, “परमेश्वर यह कहता है: तुम क्यों याहवे की आज्ञाओं का उल्लंघन कर रहे हो, और तुम सफल नहीं होगे?[b] क्योंकि तुमने याहवे को छोड़ दिया है, इसलिए उसने भी तुम्हें छोड़ दिया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जकर्याह पर आ गई”; शाब्दिक रूप से, “जकर्याह को पहन लिया।”
    reason: lexical_alternative
  - marker: b
    text: या, “जिससे तुम सफल नहीं होते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ אֱלֹהִים
  choice: तब परमेश्वर के आत्मा ने
  rationale: प्रसंग में यह पद भविष्यद्वाणी के लिए परमेश्वर के आत्मा द्वारा सामर्थ्य दिए जाने को व्यक्त करता है। हिन्दी में ‘आत्मा’ को व्यक्तिगत कर्ता के रूप में रखा गया है। आरम्भिक וְ को कथानक के स्वाभाविक प्रवाह में ‘तब’ कहा गया है।
- source_word: לָבְשָׁה אֶת זְכַרְיָה
  choice: जकर्याह को अपने वस्त्र की तरह ओढ़ लिया
  rationale: לבשׁ के वस्त्र-वाले सजीव रूपक को बनाए रखा गया है। हिब्रू संरचना में आत्मा जकर्याह को मानो पहन लेता है; इसलिए केवल ‘उस पर आया’ कहकर रूपक को समतल नहीं किया गया।
- source_word: זְכַרְיָה בֶּן יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक के पुत्र जकर्याह
  rationale: הַכֹּהֵן निकटतम नाम यहोयादा का परिचय देता है। हिन्दी शब्दक्रम में संबंध स्पष्ट और स्वाभाविक रखा गया है।
- source_word: וַיַּעֲמֹד מֵעַל לָעָם
  choice: वह लोगों से ऊँचे स्थान पर खड़ा हुआ
  rationale: מֵעַל की ऊर्ध्व स्थान-सूचक बारीकी सुरक्षित है; सम्भवतः जकर्याह किसी ऊँचे स्थान से लोगों को संबोधित कर रहा था। ‘लोगों के सामने’ इस बारीकी को खो देता।
- source_word: כֹּה אָמַר הָאֱלֹהִים
  choice: परमेश्वर यह कहता है
  rationale: भविष्यद्वक्ताओं की संदेशवाहक उद्घोषणा को आधुनिक, गरिमापूर्ण और सहज हिन्दी में व्यक्त किया गया है।
- source_word: לָמָה אַתֶּם עֹבְרִים אֶת מִצְוֺת יְהוָה
  choice: तुम क्यों यहोवा की आज्ञाओं का उल्लंघन कर रहे हो
  rationale: आज्ञाओं के साथ עבר का अर्थ सीमा लाँघना, अर्थात उनका उल्लंघन करना है। ‘उल्लंघन’ वाचा-संबंधी नैतिक गंभीरता बनाए रखता है।
- source_word: וְלֹא תַצְלִיחוּ
  choice: जिससे तुम सफल नहीं हो रहे
  rationale: संदर्भ में इसे आज्ञा-उल्लंघन के परिणाम के रूप में समझा गया है। हिब्रू וְ साधारण संयोजन भी हो सकता है, इसलिए वैकल्पिक पाठ फुटनोट में सुरक्षित है।
- source_word: כִּי עֲזַבְתֶּם אֶת יְהוָה וַיַּעֲזֹב אֶתְכֶם
  choice: क्योंकि तुमने यहोवा को छोड़ दिया है, इसलिए उसने भी तुम्हें छोड़ दिया है
  rationale: עזב की पुनरावृत्ति और पारस्परिकता को दोनों बार ‘छोड़ दिया’ कहकर बनाए रखा गया है। ‘इसलिए’ और ‘भी’ इस कारण-परिणाम और प्रत्युत्तर को स्वाभाविक हिन्दी में स्पष्ट करते हैं।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि उसे पदवी ‘प्रभु’ से बदलकर नाम को छिपाया गया।
- issue: רוּחַ אֱלֹהִים का आशय
  choice: परमेश्वर के आत्मा
  alternative: परमेश्वर की ओर से एक आत्मा
  rationale: यहाँ भविष्यद्वाणी की सामर्थ्य देने वाला कर्ता परमेश्वर का आत्मा है। अनिश्चित ‘एक आत्मा’ प्रसंग में कम स्वाभाविक है और दिव्य कर्तृत्व को अनावश्यक रूप से अस्पष्ट करता है।
- issue: परमेश्वर द्वारा छोड़ दिए जाने की पारस्परिक भाषा
  choice: उसने भी तुम्हें छोड़ दिया है
  alternative: वह तुम्हें दंड देगा
  rationale: मूल की तनावपूर्ण और सीधी भाषा को उसी रूप में रखा गया है; इसे केवल दंड की व्याख्यात्मक भाषा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक-पैगंबरी स्तर अपनाया गया है। वस्त्र का असामान्य मूल रूपक जानबूझकर सुरक्षित रखा गया है और फुटनोट में उसका आशय स्पष्ट किया गया है। दिव्य नाम के लिए ‘यहोवा’ तथा כהן के लिए प्रचलित ‘याजक’ प्रयुक्त हुआ है। सभी फुटनोट चिह्न मुख्य पाठ में अपने संबंधित खंडों पर रखे गए हैं।
