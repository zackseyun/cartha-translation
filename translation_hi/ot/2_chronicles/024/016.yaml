base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/016.yaml
  text: And they buried him in the city of David among the kings[a], because he had done good in Israel[b], and toward God and his house.
translation:
  language: hi
  text: और उन्होंने उसे दाऊद के नगर में राजाओं के बीच[a] दफ़नाया, क्योंकि उसने इस्राएल में और परमेश्वर तथा उसके भवन के लिए भलाई की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजाओं के साथ।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसने परमेश्वर और परमेश्वर के भवन, यानी मंदिर, के लिए भलाई की थी।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבְּרֻהוּ
  choice: और उन्होंने उसे दफ़नाया
  rationale: क्रिया सक्रिय बहुवचन है और उसके साथ तृतीय पुरुष एकवचन पुल्लिंग कर्म-प्रत्यय है; इसलिए अनिर्दिष्ट बहुवचन कर्ता को बनाए रखते हुए सक्रिय अनुवाद किया गया है।
- source_word: בְעִיר דָּוִיד
  choice: दाऊद के नगर में
  rationale: यह परिचित स्थान-नाम की अभिव्यक्ति है और हिब्रू संरचना को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: עִם הַמְּלָכִים
  choice: राजाओं के बीच
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर दफ़नाने के प्रसंग में ‘के बीच’ राजाओं की समाधियों अथवा उनकी संगति में सम्मानजनक दफ़नाए जाने का भाव अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ संयोजक उसके सम्मानपूर्ण दफ़न का कारण बताता है।
- source_word: עָשָׂה טוֹבָה
  choice: भलाई की थी
  rationale: यह वाक्यांश अच्छे अथवा हितकारी कार्य करने को व्यक्त करता है; हिन्दी में ‘भलाई की थी’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: पूर्वसर्ग को उसके सीधे स्थान अथवा कार्य-क्षेत्र संबंधी अर्थ में रखा गया है।
- source_word: וְעִם הָאֱלֹהִים
  choice: और परमेश्वर ... के लिए
  rationale: शाब्दिक ‘परमेश्वर के साथ’ की अपेक्षा ‘के लिए’ यहाँ परमेश्वर की ओर निर्देशित हितकारी और भक्तिपूर्ण कार्य का भाव हिन्दी में अधिक स्पष्ट करता है।
- source_word: וּבֵיתוֹ
  choice: तथा उसके भवन के लिए
  rationale: प्रत्यय का निकटतम पूर्वपद परमेश्वर है; ‘उसके भवन’ से परमेश्वर का भवन अर्थात मंदिर अभिप्रेत है, जबकि सर्वनाम को मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘उसके भवन’ का संदर्भ
  choice: ‘उसके’ का संदर्भ परमेश्वर से है और भवन से मंदिर अभिप्रेत है
  alternative: यह यहोयादा के अपने घराने को संदर्भित करता है
  rationale: निकटतम पूर्वपद ‘परमेश्वर’ है और व्यापक प्रसंग मंदिर के संबंध में यहोयादा की विश्वासयोग्य सेवा पर केंद्रित है; फिर भी व्याख्यात्मक विस्तार को मुख्य पाठ में जोड़ने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। वाक्य में हिब्रू के अनिर्दिष्ट बहुवचन कर्ता और ‘उसके भवन’ वाले सर्वनाम को बनाए रखा गया है; पाद-टिप्पणियाँ वैकल्पिक शाब्दिक अर्थ और प्रसंगगत संदर्भ स्पष्ट करती हैं।
