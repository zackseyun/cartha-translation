base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/009.yaml
  text: And they made a proclamation in Judah and Jerusalem to bring to Yahweh the levy of Moses the servant of God for Israel in the wilderness[a].
translation:
  language: hi
  text: तब उन्होंने यहूदा और यरूशलेम में घोषणा की कि परमेश्वर के सेवक मूसा का वह निर्धारित अंशदान याहवे के पास लाया जाए, जो इस्राएल के लिए जंगल में था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा, परमेश्वर के सेवक, का वह निर्धारित अंशदान जो जंगल में इस्राएल पर था”; अथवा “कर/भेंट।” इब्रानी वाक्यांश संक्षिप्त है और मूसा, इस्राएल तथा जंगल के बीच संबंध को कुछ हद तक खुला छोड़ता है। “निर्धारित अंशदान” ऐसे देय योगदान को सूचित करता है जो लगाया गया हो।
    reason: मַשְׂאַת के वैकल्पिक अर्थों और עַל יִשְׂרָאֵל बַּמִּדְבָּר के संक्षिप्त, कुछ हद तक अनिश्चित संबंध को सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיִּתְּנוּ קוֹל
  choice: उन्होंने ... घोषणा करवाई
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘आवाज़ दी’ है, पर यहाँ पूरे क्षेत्र में सार्वजनिक और आधिकारिक घोषणा करवाने का भाव है।
- source_word: בִּיהוּדָה וּבִירוּשָׁלַם
  choice: यहूदा और यरूशलेम में
  rationale: घोषणा के भौगोलिक विस्तार को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: לְהָבִיא
  choice: लाया जाए
  rationale: घोषणा के उद्देश्य को हिन्दी में स्वाभाविक कर्मवाच्य रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित रूप में सुरक्षित रखता है।
- source_word: מַשְׂאַת
  choice: कर
  rationale: यह शब्द स्वैच्छिक दान के बजाय निर्धारित या आरोपित अंशदान को सूचित करता है। आधुनिक हिन्दी में ‘कर’ उसके बाध्यकारी स्वरूप को संक्षेप में व्यक्त करता है; अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: מֹשֶׁה עֶבֶד הָאֱלֹהִים
  choice: परमेश्वर के सेवक मूसा
  rationale: मूसा की उपाधि को बिना विस्तार या सांप्रदायिक व्याख्या के सुरक्षित रखता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर ठहराया था
  rationale: עַל और ‘कर’ का मेल इस्राएल पर निर्धारित दायित्व का भाव देता है। हिन्दी में केवल ‘इस्राएल पर’ अधूरा होता, इसलिए निहित संबंध को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר का आशय अनिवार्यतः रेतीला मरुस्थल नहीं है। ‘निर्जन प्रदेश’ आधुनिक पाठक के लिए उस व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा का व्यक्तिगत नाम स्पष्ट रूप से है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: मूसा के कर और इस्राएल के बीच संबंध
  choice: जिसे ... मूसा ने ... इस्राएल पर ठहराया था
  alternative: इस्राएल के लिए मूसा का कर
  rationale: निर्माण מַשְׂאַת מֹשֶׁה עַל יִשְׂרָאֵל संक्षिप्त है और संबंध कुछ हद तक अस्पष्ट रह सकता है, पर עַל तथा संदर्भ निर्धारित दायित्व का समर्थन करते हैं। वैकल्पिक समझ को पाद-टिप्पणी में संकेतित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘घोषणा करवाई’, ‘कर’ और ‘निर्जन प्रदेश’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘इस्राएल पर ठहराया’ मूल के आरोपित दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
