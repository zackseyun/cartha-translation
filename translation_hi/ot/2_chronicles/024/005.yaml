base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/005.yaml
  text: So he gathered the priests and the Levites and said to them[a], “Go out to the cities of Judah and collect silver from all Israel to repair the house of your God year by year[b], and you must act quickly in this matter.” But the Levites did not act quickly.
translation:
  language: hi
  text: तब उसने याजकों और लेवियों को इकट्ठा करके उनसे कहा, “यहूदा के नगरों में जाओ और अपने परमेश्वर के भवन की मरम्मत[b] के लिए सारे इस्राएल से हर साल चाँदी[a] इकट्ठी करो। और इस काम में जल्दी करो।” परन्तु लेवियों ने जल्दी नहीं की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन।” इब्रानी में शाब्दिक शब्द “चाँदी” है, जिसका प्रयोग मुद्रा के अर्थ में भी होता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मज़बूत करने”; यहाँ आशय परमेश्वर के भवन को दुरुस्त या पुनः सुदृढ़ करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा करके
  rationale: कבץ का अर्थ लोगों को एकत्र करना है; कृदन्तीय रचना हिन्दी में अगले कथन से स्वाभाविक रूप से जुड़ती है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों
  rationale: मन्दिर-सेवा से जुड़े दोनों अलग समूहों को मूल पाठ के अनुसार स्पष्ट रखा गया है।
- source_word: צְאוּ לְעָרֵי יְהוּדָה
  choice: यहूदा के नगरों में जाओ
  rationale: आज्ञार्थक क्रिया और गन्तव्य दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְקִבְצוּ
  choice: इकट्ठी करो
  rationale: धन या चाँदी एकत्र करने के सन्दर्भ में यह स्वाभाविक हिन्दी प्रयोग है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: सारे इस्राएल से
  rationale: मूल पाठ की व्यापक और सम्भवतः वाचा-सम्बन्धी अभिव्यक्ति को यहूदा तक सीमित किए बिना सुरक्षित रखता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: मूल ठोस संज्ञा का अर्थ चाँदी है, यद्यपि वह मुद्रा या धन के अर्थ में भी प्रयुक्त हो सकती है।
- source_word: לְחַזֵּק
  choice: मरम्मत कराने
  rationale: חזק का मूल भाव मजबूत करना है; भवन के सन्दर्भ में आशय उसे संरचनात्मक रूप से ठीक या पुनः सुदृढ़ करना है।
- source_word: בֵּית אֱלֹהֵיכֶם
  choice: अपने परमेश्वर के भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है और यहाँ परमेश्वर के मन्दिर के लिए स्वाभाविक है।
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: साल-दर-साल
  rationale: नियमित वार्षिक पुनरावृत्ति को संक्षिप्त और सहज ढंग से व्यक्त करता है।
- source_word: וְאַתֶּם תְּמַהֲרוּ לַדָּבָר
  choice: तुम इस काम में जल्दी करो
  rationale: आदेश की तात्कालिकता को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְלֹא מִהֲרוּ הַלְוִיִּם
  choice: परन्तु लेवियों ने जल्दी नहीं की
  rationale: पूर्ववर्ती आदेश में प्रयुक्त מהר की पुनरावृत्ति को समान शब्दावली से बनाए रखता है।
theological_decisions:
- issue: ‘सारे इस्राएल’ का दायरा
  choice: मुख्य पाठ में ‘सारे इस्राएल से’
  alternative: ‘सभी इस्राएलियों से’ अथवा इसे केवल यहूदा के लोगों तक सीमित करना
  rationale: इतिहास-वृत्तान्तकार ‘इस्राएल’ को व्यापक वाचा-समुदाय के अर्थ में भी प्रयोग करता है। शाब्दिक अभिव्यक्ति ऐतिहासिक और धर्मवैचारिक तनाव को बिना संकुचित किए सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘याजक’, ‘लेवी’, ‘इस्राएल’ और ‘परमेश्वर का भवन’ जैसी परिचित बाइबलीय शब्दावली रखी गई है; आदेश और उसके पालन में हुई देरी के बीच मूल पाठ की पुनरुक्ति भी सुरक्षित है।
