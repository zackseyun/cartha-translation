  text: וַ/יְהִ֣י לִ/תְקוּפַ֣ת הַ/שָּׁנָ֗ה עָלָ֣ה עָלָי/ו֮ חֵ֣יל אֲרָם֒ וַ/יָּבֹ֗אוּ אֶל יְהוּדָה֙ וִ/יר֣וּשָׁלִַ֔ם וַ/יַּשְׁחִ֛יתוּ אֶת כָּל שָׂרֵ֥י הָ/עָ֖ם מֵ/עָ֑ם וְ/כָל שְׁלָלָ֥/ם שִׁלְּח֖וּ לְ/מֶ֥לֶךְ דַּרְמָֽשֶׂק׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/023.yaml
  text: At the turn of the year[a], the army of Aram came up against him. They came to Judah and Jerusalem, and destroyed all the leaders of the people from among the people[c][b], and sent all their spoil to the king of Damascus.
translation:
  language: hi
  text: वर्ष के बदलने के समय[a], अराम[b] की सेना ने उसके विरुद्ध चढ़ाई की। वे यहूदा और यरूशलेम में आए और प्रजा में से प्रजा के सभी अगुओं को नष्ट कर दिया। फिर उन्होंने उनकी सारी लूट[c] दमिश्क के राजा के पास भेज दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “वर्ष के अंत में” भी हो सकता है; इब्रानी मुहावरा वर्ष के मोड़ या ऋतु-चक्र की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “अराम” वही इब्रानी नाम है जिसका अनुवाद प्रायः “सीरिया” किया जाता है।
    reason: cultural_note
  - marker: c
    text: या “लूट का सारा माल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקוּפַת הַשָּׁנָה
  choice: वर्ष के बदलने के समय
  rationale: תְּקוּפָה वर्ष के चक्र, मोड़ या ऋतु-परिवर्तन को दर्शाता है। यह अनुवाद इब्रानी मुहावरे को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल वर्ष का अंत मानकर सीमित किए।
- source_word: עָלָה עָלָיו
  choice: उसके विरुद्ध चढ़ाई की
  rationale: सैनिक प्रसंग में עָלָה עַל किसी के विरुद्ध सेना लेकर बढ़ने या आक्रमण करने का भाव देता है। ‘चढ़ाई की’ हिन्दी ऐतिहासिक वर्णन में स्वाभाविक है।
- source_word: חֵיל אֲרָם
  choice: अराम की सेना
  rationale: חֵיל यहाँ सैन्य दल या सेना है। प्राचीन स्थान-नाम ארם को बाद के भूराजनीतिक नाम ‘सीरिया’ से बदलने के बजाय ‘अराम’ रखा गया है।
- source_word: וַיָּבֹאוּ אֶל יְהוּדָה וִירוּשָׁלַם
  choice: वे यहूदा और यरूशलेम आए
  rationale: בוא का सामान्य अर्थ ‘आना/प्रवेश करना’ है। सैनिक परिस्थिति आसपास के वाक्य से स्पष्ट है, इसलिए क्रिया में अनावश्यक रूप से ‘आक्रमण किया’ नहीं जोड़ा गया।
- source_word: וַיַּשְׁחִיתוּ
  choice: नष्ट कर दिया
  rationale: हिफ़ील रूप यहाँ व्यक्तियों के विनाश को बताता है। ‘नष्ट कर दिया’ घातक विध्वंस का भाव रखता है, पर मृत्यु की रीति के बारे में अतिरिक्त बात नहीं जोड़ता।
- source_word: כָּל שָׂרֵי הָעָם
  choice: उसके सभी अगुओं
  rationale: שָׂרִים शासकों, अधिकारियों या अगुओं के लिए प्रयुक्त हो सकता है। ‘अगुए’ स्पष्ट है और ‘राजकुमारों’ जैसे भ्रामक वंशगत अर्थ से बचता है।
- source_word: מֵעָם
  choice: प्रजा के बीच से
  rationale: מן के साथ עָם बड़े जनसमूह के बीच से अलग किए जाने का भाव देता है। हिन्दी वाक्य में ‘प्रजा के बीच से’ इस सूक्ष्मता को बनाए रखता है।
- source_word: וְכָל שְׁלָלָם
  choice: उनकी सारी लूट
  rationale: שָׁלָל युद्ध में छीना हुआ माल है। ‘लूट’ आधुनिक हिन्दी में स्वाभाविक है, और ‘उनकी’ मूल के सर्वनाम-संबंध को बिना अनावश्यक रूप से स्पष्ट किए सुरक्षित रखता है।
- source_word: שִׁלְּחוּ לְמֶלֶךְ דַּרְמָשֶׂק
  choice: दमिश्क के राजा के पास भेज दी
  rationale: यह वाक्य लूट को दमिश्क-केंद्रित राजा के पास भेजे जाने को दर्शाता है। ‘के पास’ हिन्दी में प्राप्तकर्ता को सहज रूप से व्यक्त करता है।
