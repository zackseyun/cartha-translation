base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/014.yaml
  text: When they had finished[a], they brought the rest of the silver before the king and Jehoiada, and with it he made articles for the house of Yahweh, articles for ministry and for offering up, and bowls, and articles of gold and silver[c][b]. And they were offering burnt offerings in the house of Yahweh continually all the days of Jehoiada.
translation:
  language: hi
  text: जब उन्होंने काम पूरा कर लिया[a], तब वे बची हुई चाँदी राजा और यहोयादा के सामने ले आए। उसने उससे यहोवा के भवन के लिए पात्र बनाए—सेवा के पात्र, चढ़ाने के पात्र, कटोरे, और सोने-चाँदी के पात्र[c][b]। यहोयादा के सारे दिनों तक यहोवा के भवन में नियमित रूप से होमबलियाँ चढ़ाई जाती रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “जब वे समाप्त कर चुके।” मूल इब्रानी में ‘पूरा करने’ का कर्म नहीं बताया गया है।'
    reason: lexical_alternative
  - marker: b
    text: या, “सेवा के सामान।”
    reason: lexical_alternative
  - marker: c
    text: मूल में केवल “चढ़ाने के लिए” है; यहाँ चढ़ाई जाने वाली वस्तु नहीं बताई गई है। वचन के अंत में “होमबलियाँ” स्पष्ट रूप से आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכַלּוֹתָם
  choice: जब उन्होंने काम पूरा कर लिया
  rationale: यह कालवाचक रचना अगले कार्य की परिस्थिति बताती है। कर्म मूल में व्यक्त नहीं है; हिन्दी में स्वाभाविकता के लिए सामान्य ‘काम’ जोड़ा गया है, जिसका संकेत भवन-मरम्मत के प्रसंग से मिलता है।
- source_word: שְׁאָר הַכֶּסֶף
  choice: बची हुई चाँदी
  rationale: כֶּסֶף का अर्थ धन भी हो सकता है, पर इसी वाक्य में उससे धातु के पात्र बनाए जाने के कारण ‘चाँदी’ अधिक उपयुक्त है।
- source_word: וַיַּעֲשֵׂהוּ
  choice: उससे उसने ... पात्र बनवाए
  rationale: क्रिया और प्रत्यय एकवचन हैं; ‘उससे’ बची हुई चाँदी को और ‘उसने’ सम्भवतः यहोयादा को संदर्भित करता है। ‘बनवाए’ यह स्पष्ट किए बिना कार्य की व्यवस्था कराने का स्वाभाविक हिन्दी रूप है कि कारीगर कौन थे।
- source_word: כֵלִים
  choice: पात्र
  rationale: मन्दिर-सामग्री के प्रसंग में यह व्यापक और परिचित हिन्दी शब्द है, यद्यपि मूल शब्द औज़ारों अथवा अन्य वस्तुओं को भी समेट सकता है।
- source_word: כְּלֵי שָׁרֵת
  choice: सेवा ... के पात्र
  rationale: שׁרת यहाँ उपासना-सम्बन्धी सेवा को दर्शाता है; ‘सेवा के पात्र’ संक्षिप्त और सहज है।
- source_word: וְהַעֲלוֹת
  choice: चढ़ाने के पात्र
  rationale: मूल में עלה का भाव ‘ऊपर चढ़ाना/अर्पित करना’ है और उसका कर्म नहीं बताया गया; इसलिए यहाँ ‘बलियाँ’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: וְכַפּוֹת
  choice: कटोरे
  rationale: כַּפּוֹת धार्मिक उपयोग के कटोरों या प्यालों जैसे पात्रों को बता सकता है; सटीक आकार अनिश्चित होने के कारण सामान्य शब्द चुना गया है।
- source_word: וַיִּהְיוּ מַעֲלִים עֹלוֹת ... תָּמִיד
  choice: नियमित रूप से होमबलियाँ चढ़ाई जाती रहीं
  rationale: यह रचना यहोयादा के जीवन भर जारी रही नियमित धार्मिक क्रिया को व्यक्त करती है; हिन्दी का यह रूप उसकी निरन्तर/आवर्ती प्रकृति सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का स्थापित और सामान्य रूप ‘यहोवा’ है; इसे उपाधि से नहीं बदला गया।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के बीच सुस्थापित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है।
- issue: बलिदान चढ़ाने की अवधि और प्रकृति
  choice: यहोयादा के जीवन भर ... नियमित रूप से ... चढ़ाई जाती रहीं
  alternative: यहोयादा के दिनों में निरन्तर होमबलियाँ चढ़ाते रहे
  rationale: מַעֲלִים के साथ תָּמִיד चलती हुई अथवा नियमित प्रथा दर्शाता है। अनुवाद इसे एक बार की घटना नहीं बनाता, पर ‘निरन्तर’ को हर क्षण होने का अर्थ भी नहीं देता।
- issue: וַיַּעֲשֵׂהוּ का कर्ता
  choice: उसने ... बनवाए
  alternative: उससे पात्र बनाए गए; उन्होंने उससे पात्र बनाए
  rationale: एकवचन क्रिया के कारण एकवचन कर्ता रखा गया है, सम्भवतः निकटवर्ती यहोयादा; फिर भी अनुवाद कोई नया नाम दोहराकर संदर्भ को मूल से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज धार्मिक गद्य। ‘भवन’, ‘पात्र’ और ‘होमबलियाँ’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं। मूल की सूची को पठनीय बनाने के लिए डैश और ‘अन्य’ का प्रयोग किया गया है; अस्पष्ट ‘चढ़ाने’ का कर्म नहीं जोड़ा गया।
