  edition: WLC
  text: וַ/יְהִ֖י אַחֲרֵי כֵ֑ן הָיָה֙ עִם לֵ֣ב יוֹאָ֔שׁ לְ/חַדֵּ֖שׁ אֶת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/004.yaml
  text: After this[b][a], it was in the heart of Joash to restore the house of Yahweh.
translation:
  language: hi
  text: इसके बाद योआश के मन में यह विचार आया कि वह याहवे के भवन[a] का जीर्णोद्धार[b] करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मंदिर। मूल में ‘याहवे का घर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘नवीकरण करे’ अथवा ‘मरम्मत करे’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद कथा में अगले चरण का संकेत देता है। ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के कालक्रम-सूचक भाव को बनाए रखता है।
- source_word: הָיָה עִם לֵב יוֹאָשׁ
  choice: योआश के मन में यह विचार आया
  rationale: शाब्दिक रूप से यह बात योआश के ‘हृदय के साथ’ होने की बात है और उसके भीतरी विचार या इरादे को व्यक्त करती है। यह हिन्दी अभिव्यक्ति उस भाव को स्वाभाविक ढंग से देती है, बिना संकल्प की तीव्रता को अनावश्यक रूप से बढ़ाए।
- source_word: לְחַדֵּשׁ
  choice: जीर्णोद्धार करे
  rationale: क्रिया का अर्थ किसी वस्तु को फिर नया करना या उसका नवीकरण करना है। भवन के संदर्भ में ‘जीर्णोद्धार’ व्यापक पुनर्स्थापन का स्वाभाविक और सटीक हिन्दी शब्द है; केवल ‘मरम्मत’ कहना अर्थ को कुछ संकरा कर सकता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: यह इब्रानी पदबंध के ‘याहवे के घर/भवन’ रूप को बनाए रखता है। संदर्भ में इससे मंदिर अभिप्रेत है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יְהוָה है। ‘याहवे’ उस नाम का लिप्यंतरण करता है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक पारंपरिक वैकल्पिक रूप है।
- issue: योआश की भीतरी मंशा की तीव्रता
  choice: मन में यह विचार आया
  alternative: मन में ठान लिया
  rationale: הָיָה עִם לֵב आंतरिक विचार या इरादा व्यक्त करता है, पर अपने आप में अनिवार्यतः दृढ़ प्रतिज्ञा का भाव नहीं देता। इसलिए अधिक प्रबल ‘ठान लिया’ नहीं चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘भवन’ मूल की ‘घर’ वाली छवि को पर्याप्त रूप से बनाए रखते हुए मंदिर-संदर्भ में स्वाभाविक है; ‘जीर्णोद्धार’ निर्माण-संबंधी संदर्भ में स्पष्ट है।
