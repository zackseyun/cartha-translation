base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/006.yaml
  text: Then the king called Jehoiada the chief and said to him, “Why have you not required the Levites to bring from Judah and from Jerusalem the tax of Moses the servant of the LORD and of the assembly of Israel for the tent of the testimony?”
translation:
  language: hi
  text: तब राजा ने प्रधान यहोयादा को बुलाकर उससे कहा, “तुमने लेवियों से यह क्यों नहीं कहा कि वे यहूदा और यरूशलेम से साक्षी के तंबू के लिए यहोवा के दास मूसा और इस्राएल की सभा का कर वसूल करके लाएँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: यह उपाधि यहोयादा की प्रमुख नेतृत्व-स्थिति बताती है; संदर्भ से अधिक विशिष्ट पद जोड़ना उचित नहीं।
- source_word: דָרַשְׁתָּ עַל הַלְוִיִּם
  choice: लेवियों से ... माँगा
  rationale: इस प्रसंग में क्रिया का भाव लेवियों से आधिकारिक रूप से कर मँगवाने या वसूल करवाने का है; सहज हिंदी में ‘माँगा’ इसे व्यक्त करता है।
- source_word: מַשְׂאַת
  choice: कर
  rationale: यहाँ संदर्भ पवित्रस्थान के लिए मूसा द्वारा निर्धारित देय राशि का है; ‘कर’ सामान्य पाठक के लिए स्पष्ट है, यद्यपि शब्द में अंशदान/लेवी का भाव भी संभव है।
- source_word: אֹהֶל הָעֵדוּת
  choice: साक्षी का तंबू
  rationale: पारंपरिक बाइबलीय पदावली को बनाए रखते हुए इब्रानी संज्ञा-सम्बन्ध का सीधा अनुवाद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत वाचा-नाम को हिंदी में प्रचलित रूप ‘यहोवा’ से दर्शाया गया है।
theological_decisions:
- issue: मूसा और सभा का ‘कर’ से व्याकरणिक संबंध
  choice: ‘जिसे यहोवा के दास मूसा और इस्राएल की सभा ने ... ठहराया था’
  alternative: ‘यहोवा के दास मूसा का और इस्राएल की सभा का कर’
  rationale: इब्रानी में दोनों पद ‘कर’ से जुड़े हैं और संबंध कुछ संक्षिप्त है। हिंदी में चुना गया रूप कर की व्यवस्था से दोनों को जोड़ता है तथा पद का अभिप्राय स्पष्ट करता है, बिना किसी सांप्रदायिक अर्थ के।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण, सहज और सार्वजनिक पाठ के अनुकूल। ‘लेवी’ की अपेक्षा ‘कर’ सामान्य पाठक के लिए अधिक स्पष्ट रखा गया है।
