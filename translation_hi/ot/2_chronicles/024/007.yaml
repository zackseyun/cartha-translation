  text: כִּ֤י עֲתַלְיָ֨הוּ֙ הַ/מִּרְשַׁ֔עַת בָּנֶ֥י/הָ פָרְצ֖וּ אֶת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/גַם֙ כָּל קָדְשֵׁ֣י בֵית יְהוָ֔ה עָשׂ֖וּ לַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/007.yaml
  text: For Athaliah[a], that wicked woman, and her sons had broken into the house of God and had also made all the holy things of the house of Yahweh for the Baals.
translation:
  language: hi
  text: क्योंकि उस दुष्ट स्त्री अतल्याह और उसके बेटों ने परमेश्वर के भवन को तोड़-फोड़कर नुकसान पहुँचाया था और याहवे के भवन की सारी पवित्र वस्तुओं को बाल-देवताओं के लिए इस्तेमाल किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बाल-देवताओं के लिए बनाया/किया था।” यहाँ इब्रानी क्रिया का सामान्य अर्थ “बनाना” या “करना” है, लेकिन संदर्भ में संभवतः भाव यह है कि उन्होंने मंदिर की पवित्र वस्तुओं को बाल-उपासना के लिए इस्तेमाल किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲתַלְיָהוּ הַמִּרְשַׁעַת
  choice: उस दुष्ट स्त्री अतल्याह
  rationale: स्त्रीलिंग रूप और निंदात्मक विशेषण दोनों को स्पष्ट रखते हुए नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: בָּנֶיהָ
  choice: उसके बेटों ने
  rationale: इब्रानी में स्पष्ट रूप से ‘बेटे’ हैं, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: פָרְצוּ אֶת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन में तोड़-फोड़ की थी
  rationale: פרץ यहाँ भवन को बलपूर्वक तोड़ने, उसमें दरारें डालने या उसे क्षति पहुँचाने का भाव दे सकता है। अध्याय के मरम्मत-संदर्भ में ‘तोड़-फोड़’ केवल प्रवेश करने की अपेक्षा अधिक उपयुक्त है और क्रिया की हिंसक शक्ति भी बनाए रखता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: मूल के ‘परमेश्वर के घर/भवन’ को औपचारिक किंतु सहज हिन्दी में रखता है और आगे ‘याहवे के भवन’ के साथ समानता बनाए रखता है।
- source_word: כָּל קָדְשֵׁי בֵית יְהוָה
  choice: याहवे के भवन की सारी पवित्र वस्तुएँ
  rationale: קָדְשֵׁי से उपासना के लिए पवित्र ठहराई गई वस्तुएँ अभिप्रेत हैं; ‘पवित्र वस्तुएँ’ स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत वाचा-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: עָשׂוּ לַבְּעָלִים
  choice: बाल देवताओं के काम में लगा दिया था
  rationale: सामान्य क्रिया עשה का शाब्दिक अर्थ ‘बनाना/करना’ है, पर पवित्र वस्तुओं के साथ इस संदर्भ में उन्हें बाल-उपासना के लिए लगा देने या इस्तेमाल करने का अर्थ अधिक स्वाभाविक है। בְּעָלִים के बहुवचन को ‘बाल देवताओं’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: בְּעָלִים का बहुवचन
  choice: बाल देवताओं
  alternative: बाल / बाल की मूर्तियों
  rationale: इब्रानी बहुवचन को बनाए रखा गया है, जो बाल के अनेक स्थानीय रूपों, प्रतिमाओं या पंथों की ओर संकेत कर सकता है; पाठ स्वयं इनमें से किसी एक अर्थ को निश्चित नहीं करता।
- issue: मंदिर की वस्तुओं के संबंध में עשה का आशय
  choice: काम में लगा दिया
  alternative: बना दिया
  rationale: वस्तुएँ पहले से याहवे के भवन की पवित्र वस्तुएँ थीं, इसलिए संदर्भ उनके बाल-उपासना में उपयोग या विनियोग की ओर संकेत करता है। फिर भी मूल क्रिया का अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ मंदिर-संदर्भ की औपचारिकता तथा मूल की समानांतर अभिव्यक्तियों को बनाए रखता है; ‘तोड़-फोड़’ अध्याय में आवश्यक मरम्मत के संदर्भ से मेल खाता है।
