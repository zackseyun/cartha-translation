  text: וַ/יְהִ֡י בְּ/עֵת֩ יָבִ֨יא אֶת הָֽ/אָר֜וֹן אֶל פְּקֻדַּ֣ת הַ/מֶּלֶךְ֮ בְּ/יַ֣ד הַ/לְוִיִּם֒ וְ/כִ/רְאוֹתָ֞/ם כִּי רַ֣ב הַ/כֶּ֗סֶף וּ/בָ֨א סוֹפֵ֤ר הַ/מֶּ֨לֶךְ֙ וּ/פְקִיד֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וִ/יעָ֨רוּ֙ אֶת הָ֣/אָר֔וֹן וְ/יִשָּׂאֻ֖/הוּ וִֽ/ישִׁיבֻ֣/הוּ אֶל מְקֹמ֑/וֹ כֹּ֤ה עָשׂוּ֙ לְ/י֣וֹם בְּ/י֔וֹם וַ/יַּֽאַסְפוּ כֶ֖סֶף לָ/רֹֽב־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/011.yaml
  text: And whenever the chest was brought by the Levites to the king’s oversight[a], and when they saw that the money was abundant, the king’s scribe and the chief priest’s officer would come and empty the chest, then carry it and return it to its place. Thus they did day by day[b], and they gathered money in abundance.
translation:
  language: hi
  text: जब-जब लेवी उस सन्दूक को राजा की देखरेख में[a] ले आते, और जब यह देखा जाता कि उसमें बहुत धन[b] है, तब राजा का मुंशी और प्रधान याजक का अधिकारी आकर सन्दूक को खाली करते; फिर उसे उठाकर उसके स्थान पर वापस रख देते। वे दिन-प्रतिदिन ऐसा ही करते रहे और उन्होंने बहुत अधिक धन इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा के निरीक्षण में”; इब्रानी पद का अर्थ राजकीय देखरेख, निरीक्षण या आधिकारिक नियंत्रण हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “चाँदी”; यहाँ इसका अर्थ इकट्ठा किया गया धन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: सन्दर्भ में यह भेंट का धन इकट्ठा करने वाला पात्र है, वाचा का सन्दूक नहीं। ‘सन्दूक’ ऐतिहासिक वस्तु के लिए स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: פְּקֻדַּת הַמֶּלֶךְ
  choice: राजा के निरीक्षण के लिए
  rationale: פְּקֻדָּה यहाँ राजकीय निरीक्षण, देखरेख या आधिकारिक नियंत्रण का भाव रखता है। ‘निरीक्षण के लिए’ प्रशासनिक प्रसंग में स्वाभाविक है और अर्थ को किसी विशेष कार्यालय तक सीमित नहीं करता।
- source_word: בְּיַד הַלְוִיִּם
  choice: लेवी ... ले आते
  rationale: בְּיַד कर्ता/माध्यम को सूचित करता है; हिन्दी में क्रिया के कर्ता के रूप में ‘लेवी’ कहना इस भाव को सहज रूप से व्यक्त करता है।
- source_word: וְכִרְאוֹתָם
  choice: वे देखते
  rationale: इन्फिनिटिव कंस्ट्रक्ट पर लगा बहुवचन प्रत्यय ‘उनके देखने पर’ का अर्थ देता है। मूल में सर्वनाम का पूर्वपद पूरी तरह स्पष्ट नहीं है, इसलिए हिन्दी में भी सामान्य बहुवचन ‘वे’ रखा गया है।
- source_word: כֶּסֶף
  choice: धन
  rationale: शब्द का शाब्दिक अर्थ ‘चाँदी’ भी हो सकता है, पर चढ़ावे के प्रशासनिक प्रसंग में यह मुद्रा/धन को दर्शाता है।
- source_word: סוֹפֵר הַמֶּלֶךְ
  choice: राजा का मुंशी
  rationale: סוֹפֵר राजकीय लेखा और अभिलेख से जुड़े अधिकारी को सूचित करता है। ‘मुंशी’ आधुनिक हिन्दी पाठक के लिए ऐतिहासिक प्रशासनिक पद का स्पष्ट शब्द है।
- source_word: פְקִיד כֹּהֵן הָרֹאשׁ
  choice: प्रधान याजक का अधिकारी
  rationale: यह प्रधान याजक के अधीन नियुक्त अधिकारी है; ‘अधिकारी’ उसके पद को अनावश्यक रूप से ‘प्रतिनिधि’ या ‘उपाधिकारी’ नहीं बनाता।
- source_word: וִיעָרוּ אֶת הָאָרוֹן
  choice: सन्दूक को खाली करते
  rationale: क्रिया यहाँ सन्दूक में जमा सामग्री निकालने का बोध देती है; ‘खाली करते’ हिन्दी में सीधा और प्रसंगानुकूल है।
- source_word: וְיִשָּׂאֻהוּ וִישִׁיבֻהוּ אֶל מְקֹמוֹ
  choice: उसे उठाकर उसके स्थान पर वापस रख देते
  rationale: נשא में उठाने/ले जाने और שוב के हिफ़ईल रूप में वापस पहुँचाने का भाव है। संयुक्त हिन्दी वाक्य क्रियाओं के क्रम को स्पष्ट रखता है।
- source_word: כֹּה עָשׂוּ לְיוֹם בְּיוֹם
  choice: वे दिन-प्रतिदिन ऐसा ही करते रहे
  rationale: लְיוֹם בְּיוֹם दोहराई जाने वाली दैनिक कार्रवाई दर्शाता है; अपूर्ण अतीत की पुनरावृत्ति ‘करते रहे’ से स्वाभाविक रूप में आती है।
- source_word: וַיַּאַסְפוּ כֶסֶף לָרֹב
  choice: उन्होंने बहुत अधिक धन इकट्ठा किया
  rationale: אָסַף संग्रह करने और לָרֹב बड़ी मात्रा का बोध देता है; यह हिन्दी में परिणाम को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: सन्दूक की पहचान
  choice: इसे भेंट इकट्ठा करने वाला ‘सन्दूक’ माना गया है।
  alternative: ‘वाचा का सन्दूक’ समझना
  rationale: निकटवर्ती प्रसंग और उसे खाली करके पुनः स्थान पर रखने की कार्रवाई दिखाती है कि यह संग्रह-पात्र है; मूल शब्द की सामान्य धार्मिक संगति के कारण इसे वाचा का सन्दूक कहना यहाँ भ्रामक होगा।
- issue: וְכִרְאוֹתָם में ‘वे’ का पूर्वपद
  choice: मूल की तरह सामान्य बहुवचन ‘वे’ बनाए रखा गया है।
  alternative: स्पष्ट रूप से ‘लेवियों ने देखा’ या ‘अधिकारियों ने देखा’ कहना
  rationale: प्रत्यय बहुवचन है, पर तत्काल वाक्य-विन्यास उसके पूर्वपद को निर्णायक रूप से नहीं बताता। किसी एक समूह को नामित करने से मूल की वास्तविक अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सहज शैली रखी गई है। ‘राजा का मुंशी’, ‘प्रधान याजक का अधिकारी’ और ‘दिन-प्रतिदिन’ प्रशासनिक तथा ऐतिहासिक वातावरण बनाए रखते हैं। मूल की वास्तविक सर्वनामगत अस्पष्टता को नहीं सुलझाया गया है।
