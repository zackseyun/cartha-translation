source:
  edition: WLC
  text: וַ/יִּתְּנֵ֨/הוּ הַ/מֶּ֜לֶךְ וִֽ/יהוֹיָדָ֗ע אֶל עוֹשֵׂה֙ מְלֶ֨אכֶת֙ עֲבוֹדַ֣ת בֵּית יְהוָ֔ה וַ/יִּֽהְי֤וּ שֹׂכְרִים֙ חֹצְבִ֣ים וְ/חָרָשִׁ֔ים לְ/חַדֵּ֖שׁ בֵּ֣ית יְהוָ֑ה וְ֠/גַם לְ/חָרָשֵׁ֤י בַרְזֶל֙ וּ/נְחֹ֔שֶׁת לְ/חַזֵּ֖ק אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/012.yaml
  text: And the king and Jehoiada gave it to those doing the work of the service of the house of Yahweh[a], and they hired stonecutters and craftsmen to restore the house of Yahweh[c][b], and also craftsmen in iron and bronze to strengthen the house of Yahweh.
translation:
  language: hi
  text: राजा और यहोयादा ने उसे[a] याहवे के भवन[b] की सेवा का काम करनेवालों को सौंप दिया। उन्होंने याहवे के भवन का जीर्णोद्धार करने के लिए पत्थर काटनेवालों और कारीगरों को मजदूरी पर रखा, और याहवे के भवन को सुदृढ़ करने के लिए लोहे और काँसे के कारीगरों[c] को भी रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसे’ से आशय पिछले प्रसंग में एकत्र किए गए धन से है। इसका अनुवाद ‘वह धन’ भी किया जा सकता है।
    reason: referent_clarification
  - marker: b
    text: अर्थात मंदिर। इब्रानी में शाब्दिक रूप से ‘याहवे का भवन’ है।
    reason: lexical_clarification
  - marker: c
    text: या ‘लोहे और काँसे के लोहारों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ
  choice: उसे सौंप दिया
  rationale: क्रिया נתן के साथ लगा एकवचन पुल्लिंग सर्वनाम पिछले प्रसंग में एकत्र किए गए धन की ओर संकेत करता है। ‘उसे सौंप दिया’ मूल के सर्वनाम को बनाए रखते हुए लेन-देन का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל עוֹשֵׂה מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: याहवे के भवन की सेवा का काम करनेवालों को
  rationale: इब्रानी पदबंध की परतदार रचना—‘भवन की सेवा का काम करनेवाले’—को पठनीय हिंदी में रखा गया है; ‘निरीक्षकों’ जैसा अर्थ मूल में स्पष्ट न होने के कारण नहीं जोड़ा गया।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ इब्रानी בַּיִת का सीधा समतुल्य है और यहाँ मंदिर का संकेत करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: וַיִּהְיוּ שֹׂכְרִים
  choice: मजदूरी पर रखा
  rationale: היה और कृदंत की रचना यहाँ कामगारों को वेतन देकर नियुक्त करने की क्रिया बताती है; यह अभिव्यक्ति आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: חֹצְבִים
  choice: पत्थर काटनेवालों
  rationale: मंदिर की मरम्मत के प्रसंग में यह शब्द पत्थर काटने या तराशनेवाले कामगारों के लिए है।
- source_word: חָרָשִׁים
  choice: कारीगरों
  rationale: חרש कुशल शिल्पकारों के लिए व्यापक शब्द है; इसे केवल बढ़ई मान लेना अनावश्यक रूप से संकीर्ण होगा।
- source_word: לְחַדֵּשׁ
  choice: जीर्णोद्धार करने के लिए
  rationale: पिएल रूप का भाव भवन को फिर से नया करना या पुरानी दशा से बहाल करना है; ‘जीर्णोद्धार’ मरम्मत और नवीनीकरण दोनों को समेटता है।
- source_word: לְחָרָשֵׁי בַרְזֶל וּנְחֹשֶׁת
  choice: लोहे और काँसे के कारीगरों
  rationale: पदबंध धातु पर काम करनेवाले कुशल लोगों को दर्शाता है। ‘कारीगर’ मूल की व्यापकता रखता है, जबकि ‘लोहार’ एक संभव अधिक विशिष्ट अनुवाद है।
- source_word: לְחַזֵּק
  choice: सुदृढ़ करने के लिए
  rationale: חזק का कारक रूप ‘मजबूत बनाना’ बताता है; भवन के संरचनात्मक प्रसंग में ‘सुदृढ़ करना’ सटीक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम יְהוָה है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, और ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीर्णोद्धार’ और ‘सुदृढ़’ भवन-निर्माण के प्रसंग में सटीक हैं; आसपास के सरल वाक्य-विन्यास से उनका अर्थ स्पष्ट रहता है।
