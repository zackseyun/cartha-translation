  yaml_path: translation/ot/2_chronicles/024/015.yaml
  text: And Jehoiada grew old and was full of days[a], and he died. He was one hundred and thirty years old at his death.
translation:
  language: hi
  text: यहोयादा बूढ़ा हो गया और उसने भरपूर आयु पाई[a]; फिर वह मर गया। वह अपनी मृत्यु के समय एक सौ तीस वर्ष का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह दिनों से तृप्त हुआ”; अर्थात उसने भरपूर आयु पाई।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְקַן
  choice: बूढ़ा हो गया
  rationale: यह अभिव्यक्ति उम्र बढ़ने की प्रक्रियात्मक छाया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: יְהוֹיָדָע
  choice: यहोयादा
  rationale: नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: וַיִּשְׂבַּע יָמִים
  choice: उसकी आयु पूरी हुई
  rationale: इब्रानी मुहावरे का अर्थ पूर्ण जीवनकाल है। यह हिन्दी में स्वाभाविक है, जबकि मूल के ‘दिनों से तृप्त’ बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיָּמֹת
  choice: तब वह मर गया
  rationale: कथात्मक क्रम को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֶּן מֵאָה וּשְׁלֹשִׁים שָׁנָה
  choice: उसकी आयु एक सौ तीस वर्ष थी
  rationale: इब्रानी में शाब्दिक रूप से ‘एक सौ तीस वर्ष का पुत्र’ है; हिन्दी में आयु बताने का स्वाभाविक ढंग अपनाया गया है।
- source_word: בְּמוֹתוֹ
  choice: मृत्यु के समय
  rationale: पूर्वसर्ग, ‘मृत्यु’ संज्ञा और सर्वनामिक प्रत्यय के संयुक्त कालवाचक अर्थ को सहज हिन्दी में व्यक्त करता है।
