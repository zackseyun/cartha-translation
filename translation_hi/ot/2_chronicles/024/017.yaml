  text: וְ/אַֽחֲרֵ֥י מוֹת֙ יְה֣וֹיָדָ֔ע בָּ֚אוּ שָׂרֵ֣י יְהוּדָ֔ה וַ/יִּֽשְׁתַּחֲו֖וּ לַ/מֶּ֑לֶךְ אָ֛ז שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֲלֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/017.yaml
  text: After the death of Jehoiada[a], the officials of Judah came and bowed down to the king[b]. Then the king listened to them.
translation:
  language: hi
  text: यहोयादा की मृत्यु के बाद यहूदा के अधिकारी[a] आए और राजा के सामने दण्डवत् हुए। तब राजा ने उनकी बात सुनी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के प्रधान” अथवा “यहूदा के अगुए।”
    reason: lexical_alternative
  - marker: b
    text: “उनकी बात सुनी” का अर्थ “उनकी बात पर ध्यान दिया” या “उनकी बात मान ली” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי מוֹת יְהוֹיָדָע
  choice: यहोयादा की मृत्यु के बाद
  rationale: कालक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक संयोजक וְ को अलग से अनूदित करना आवश्यक नहीं है।
- source_word: בָּאוּ
  choice: आए
  rationale: सामान्य गति-सूचक क्रिया का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: שָׂרֵי יְהוּדָה
  choice: यहूदा के अधिकारी
  rationale: שָׂרִים शासकीय पद और नेतृत्व दोनों का बोध करा सकता है। ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और ‘राजकुमारों’ जैसी अनावश्यक वंशगत धारणा नहीं जोड़ता।
- source_word: וַיִּשְׁתַּחֲווּ לַמֶּלֶךְ
  choice: राजा के सामने दण्डवत् हुए
  rationale: यह शारीरिक रूप से झुकने या भूमि तक नतमस्तक होने का भाव सुरक्षित रखता है, पर इसे परमेश्वर की उपासना नहीं ठहराता।
- source_word: אָז
  choice: तब
  rationale: घटनाक्रम के अगले और परिणामस्वरूप चरण को संक्षेप में व्यक्त करता है।
- source_word: שָׁמַע הַמֶּלֶךְ אֲלֵיהֶם
  choice: राजा ने उनकी बात सुनी
  rationale: שׁמע אל में सुनने से लेकर ध्यान देने अथवा मान लेने तक का अर्थ हो सकता है। ‘बात सुनी’ हिन्दी में इस अर्थ-सीमा को काफी हद तक खुला रखता है।
theological_decisions:
- issue: अधिकारियों द्वारा राजा के सामने किए गए कार्य का स्वरूप
  choice: राजा के सामने दण्डवत् हुए
  alternative: राजा की उपासना की; राजा को प्रणाम किया
  rationale: हिब्रू क्रिया आदर, अधीनता या उपासना के प्रसंगों में झुकने का संकेत दे सकती है। यहाँ कर्म एक मानव राजा है, इसलिए ‘उपासना’ कहना अति-व्याख्या होगी; ‘दण्डवत् हुए’ शारीरिक क्रिया और उसके संभावित राजनीतिक आशय को सुरक्षित रखता है।
- issue: राजा की प्रतिक्रिया की तीव्रता
  choice: उनकी बात सुनी
  alternative: उनकी बात मान ली
  rationale: मुहावरा आज्ञापालन या सहमति का प्रबल संकेत दे सकता है, पर केवल इसी पद में वह अर्थ पूर्णतः स्पष्ट नहीं किया गया। मुख्य पाठ में अपेक्षाकृत खुला अनुवाद और पादटिप्पणी में प्रबल विकल्प दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दण्डवत् हुए’ बाइबलीय प्रसंग में परिचित है और मूल की शारीरिक मुद्रा को ‘उपासना’ का अर्थ दिए बिना व्यक्त करता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी अर्थगत वैकल्पिकता वे स्पष्ट करते हैं।
