language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹא זָכַ֞ר יוֹאָ֣שׁ הַ/מֶּ֗לֶךְ הַ/חֶ֨סֶד֙ אֲשֶׁ֨ר עָשָׂ֜ה יְהוֹיָדָ֤ע אָבִי/ו֙ עִמּ֔/וֹ וַֽ/יַּהֲרֹ֖ג אֶת בְּנ֑/וֹ וּ/כְ/מוֹת֣/וֹ אָמַ֔ר יֵ֥רֶא יְהוָ֖ה וְ/יִדְרֹֽשׁ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/022.yaml
  text: But King Joash did not remember the kindness that Jehoiada his father had shown him[a], and he killed his son. As he was dying, he said[c][b], “May Yahweh see and require it.”
translation:
  language: hi
  text: परन्तु राजा योआश ने उस उपकार को याद नहीं रखा जो उसके पिता यहोयादा ने उस पर किया था[a][b], और उसने यहोयादा के पुत्र को मार डाला। जब यहोयादा का पुत्र मर रहा था, तब उसने कहा, “याहवे देखे और इसका लेखा ले।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उपकार’ का अनुवाद ‘भलाई,’ ‘निष्ठा,’ या ‘निष्ठापूर्ण प्रेम’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके पिता’ सम्भवतः योआश के प्रति यहोयादा की पिता-समान भूमिका को दर्शाता है, न कि जैविक पितृत्व को।
    reason: cultural_note
  - marker: c
    text: '‘इसका लेखा ले’ का अर्थ है: इस अपराध की जाँच करके दोषी को उत्तरदायी ठहराए।'
    reason: lexical_clarification
lexical_decisions:
- source_word: הַחֶסֶד
  choice: करुणा
  rationale: חֶסֶד यहाँ मनुष्य के प्रति दिखाई गई कृपालु और निष्ठापूर्ण भलाई को व्यक्त करता है। ‘करुणा’ सहज हिन्दी है; वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: זָכַר
  choice: याद नहीं रखा
  rationale: यह मूल के ‘स्मरण करना’ को बनाए रखता है और प्रसंग में कृतज्ञतापूर्वक ध्यान रखने में विफलता का संकेत भी देता है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: मूल पाठ का संबंधसूचक पद ज्यों का त्यों रखा गया है; यहाँ जैविक पितृत्व के बजाय यहोयादा की पिता-समान भूमिका अभिप्रेत हो सकती है।
- source_word: וַיַּהֲרֹג אֶת־בְּנוֹ
  choice: और उसने उसके पुत्र को मार डाला
  rationale: यह सीधा और स्वाभाविक अनुवाद है तथा न्यायिक मृत्युदंड जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: וּכְמוֹתוֹ
  choice: मरते समय
  rationale: यह मृत्यु की प्रक्रिया के दौरान बोले गए अंतिम शब्दों का स्वाभाविक कालगत अनुवाद है।
- source_word: יֵרֶא יְהוָה
  choice: याहवे देखे
  rationale: इच्छार्थक/आह्वानात्मक बल को संक्षिप्त हिन्दी में सुरक्षित रखता है, न कि इसे केवल भविष्यवाणी बना देता है।
- source_word: וְיִדְרֹשׁ
  choice: और इसका लेखा ले
  rationale: דרש के जाँचने, जवाब माँगने और न्यायिक रूप से उत्तरदायी ठहराने के अर्थ को आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल प्रतिशोध तक सीमित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उपाधि से प्रतिस्थापित नहीं।
theological_decisions:
- issue: जकर्याह के अंतिम शब्दों में दैवी न्याय की अपील
  choice: याहवे से अन्याय को देखने और उसका लेखा लेने की प्रार्थना
  alternative: सीधे बदला लेने की प्रार्थना; अथवा केवल यह कथन कि याहवे देखता है
  rationale: इच्छार्थक क्रियाएँ अपील व्यक्त करती हैं और דרש न्यायिक जवाबदेही का संकेत देता है; अनुवाद प्रतिशोध की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- issue: यहोयादा को ‘उसके पिता’ कहना
  choice: मूल का ‘उसके पिता’ बनाए रखना
  alternative: ‘उसके पिता-समान संरक्षक’ के रूप में मुख्य पाठ में स्पष्ट करना
  rationale: मूल की संबंधगत और सम्भवतः सम्मानसूचक भाषा को सुरक्षित रखा गया है; सम्भावित पिता-समान भूमिका पादटिप्पणी में समझाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी कथात्मक शैली अपनाई गई है। ‘परन्तु’, ‘करुणा’ और ‘लेखा ले’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की नैतिक और न्यायिक गंभीरता को बनाए रखते हैं।
