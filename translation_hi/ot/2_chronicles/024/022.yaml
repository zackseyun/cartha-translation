    issue: Referents are ambiguous in the main text.
    rationale: In ‘उसने उसके पुत्र को मार डाला’ and ‘मरते समय उसने कहा,’ Hindi pronouns can obscure that Joash killed Jehoiada’s son and that Jehoiada’s son was the speaker at his death. Naming the referents improves fidelity to the narrative without changing meaning.
  - severity: low
    issue: ‘करुणा’ is an imprecise contextual rendering of חֶסֶד.
    rationale: The context concerns Jehoiada’s beneficent treatment of Joash, not primarily pity or compassion. ‘उपकार’ is more idiomatic and contextually accurate, while the note can retain alternatives such as loyalty and faithful love.
