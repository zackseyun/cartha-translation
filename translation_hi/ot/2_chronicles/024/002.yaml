id: 2CH.24.2
reference: 2 Chronicles 24:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ יוֹאָ֛שׁ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כָּל יְמֵ֖י יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/002.yaml
  text: Joash did what was right in the eyes of Yahweh all the days of Jehoiada the priest.
translation:
  language: hi
  text: योआश ने यहोयादा याजक के जीवन भर वही किया जो यहोवा की दृष्टि में सही था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עשה का सामान्य अर्थ ‘करना’ है; הַיָּשָׁר के साथ हिंदी में स्वाभाविक अभिव्यक्ति ‘वही किया जो… सही था’ है।
- source_word: הַיָּשָׁר
  choice: जो… सही था
  rationale: יָשָׁר का अर्थ ‘सीधा, सही, खरा’ है। राजाओं के मूल्यांकन के इस सूत्र में ‘जो… सही था’ सहज और अर्थनिष्ठ है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: शाब्दिक बिंब ‘आँखों में’ हिंदी में अस्वाभाविक हो सकता है; ‘की दृष्टि में’ उसी मूल्यांकनपरक अर्थ को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כָּל יְמֵי
  choice: के जीवन भर
  rationale: शाब्दिक अर्थ ‘के सभी दिनों में’ है; किसी व्यक्ति के संदर्भ में आधुनिक हिंदी का ‘के जीवन भर’ वही पूर्ण कालावधि स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוֹיָדָע
  choice: यहोयादा
  rationale: इब्रानी व्यक्तिगत नाम का हिंदी में स्थापित लिप्यंतरण।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: כֹּהֵן के पदनाम के लिए बाइबलीय हिंदी में स्पष्ट और प्रचलित शब्द ‘याजक’ है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से उसका प्रतिस्थापन नहीं किया गया। आधुनिक हिंदी पाठकों में अधिक पहचाने जाने वाले नामरूप ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक विद्वत्तापरक लिप्यंतरण है।
- issue: योआश के सही आचरण की समय-सीमा
  choice: यहोयादा याजक के जीवन भर
  alternative: जब तक यहोयादा याजक जीवित रहा
  rationale: כָּל־יְמֵי की पूरी कालावधि सुरक्षित रखी गई है। पाठ केवल यहोयादा के जीवनकाल में योआश के आचरण का मूल्यांकन करता है; बाद के व्यवहार के बारे में निहित संकेत को विस्तार देकर स्पष्ट निष्कर्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सरल और गरिमापूर्ण है। ‘वही किया जो…’ मूल इब्रानी मूल्यांकन-सूत्र को स्वाभाविक हिंदी वाक्य-विन्यास में रखता है। कोई पादटिप्पणी आवश्यक नहीं है।
