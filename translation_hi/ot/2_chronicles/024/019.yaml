  text: וַ/יִּשְׁלַ֤ח בָּ/הֶם֙ נְבִאִ֔ים לַ/הֲשִׁיבָ֖/ם אֶל יְהוָ֑ה וַ/יָּעִ֥ידוּ בָ֖/ם וְ/לֹ֥א הֶאֱזִֽינוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/019.yaml
  text: Yet he sent prophets among them to bring them back to Yahweh[a], and they testified against them, but they would not listen.
translation:
  language: hi
  text: फिर भी उसने उनके बीच भविष्यद्वक्ताओं को भेजा, ताकि वे लोगों को याहवे की ओर फिर लौटा लाएँ। भविष्यद्वक्ताओं ने उनके विरुद्ध गवाही दी[a], पर लोगों ने ध्यान नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उन्हें गंभीर चेतावनी दी।” इब्रानी क्रिया में गंभीर चेतावनी देने का अर्थ हो सकता है; यहाँ उसमें उनके विरुद्ध साक्ष्य देने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח בָּהֶם נְבִאִים
  choice: उसने उनके बीच भविष्यद्वक्ताओं को भेजा
  rationale: בָּהֶם को यहाँ समूह के बीच भेजने के अर्थ में लिया गया है। यह वाक्यांश स्वाभाविक हिन्दी में भविष्यद्वक्ताओं की नियुक्ति और लोगों के बीच उनकी उपस्थिति दोनों व्यक्त करता है।
- source_word: לַהֲשִׁיבָם אֶל יְהוָה
  choice: ताकि वे उन्हें याहवे के पास लौटा लाएँ
  rationale: שׁוב के हिफ़ील रूप का कारणवाचक बल ‘लौटा लाएँ’ से सुरक्षित रहता है; אֶל संबंध और दिशा दोनों दिखाता है, इसलिए ‘के पास’ चुना गया।
- source_word: וַיָּעִידוּ בָם
  choice: उन्होंने उनके विरुद्ध गवाही दी
  rationale: עוד के हिफ़ील रूप में गंभीर चेतावनी और साक्ष्य देने, दोनों का भाव हो सकता है। בָם के साथ ‘विरुद्ध गवाही दी’ प्रसंग के न्यायिक भाव को सुरक्षित रखता है।
- source_word: וְלֹא הֶאֱזִינוּ
  choice: पर उन्होंने कान न लगाया
  rationale: यह प्रचलित और गरिमापूर्ण हिन्दी मुहावरा ध्यान देकर सुनने से इनकार या उपेक्षा का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपस्थित व्यक्तिगत दिव्य नाम को स्पष्ट रूप से बनाए रखा गया है और किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
- issue: וַיָּעִידוּ בָם का न्यायिक या चेतावनी-संबंधी बल
  choice: उन्होंने उनके विरुद्ध गवाही दी
  alternative: उन्होंने उन्हें चेतावनी दी
  rationale: मुख्य पाठ में न्यायिक/वाचा-संबंधी साक्ष्य का भाव रखा गया है, जबकि क्रिया में निहित चेतावनी के संभावित अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली अपनाई गई है। ‘कान न लगाया’ स्वाभाविक हिन्दी मुहावरा है, जबकि ‘उनके विरुद्ध गवाही दी’ मूल की गंभीर न्यायिक छाया को बनाए रखता है।
