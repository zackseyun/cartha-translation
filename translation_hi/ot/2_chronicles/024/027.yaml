base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/027.yaml
  text: His sons[a], the many oracles against him, and the founding of the house of God—behold, they are written in the Midrash of the Book of the Kings[b]. And Amaziah his son reigned in his place.
translation:
  language: hi
  text: उसके पुत्रों, उसके विरुद्ध बहुत-सी घोषणाओं[a] और परमेश्वर के भवन की नींव के विषय में—देखो, ये सब ‘राजाओं की पुस्तक के मिद्राश’ में लिखे हुए हैं[b]। और उसका पुत्र अमस्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ का इब्रानी वाक्यांश कठिन है। इसका अनुवाद इस प्रकार भी हो सकता है: “उस पर पड़े भारी बोझ,” “उसके विरुद्ध बहुत-से दैवी वचन,” या “उस पर लगाया गया भारी कर।” מַשָּׂא का अर्थ “बोझ,” “दैवी वचन/भविष्यवाणी,” और कुछ संदर्भों में थोपा गया भार हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मिद्राश” सम्भवतः राजाओं की पुस्तक से सम्बद्ध किसी व्याख्यात्मक अभिलेख, विवेचन या टीका को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבָנָיו
  choice: उसके पुत्रों
  rationale: बहुवचन संज्ञा और तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा अनुवाद; वाव का संयोजक बल आगे की सूची से स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְרֹב הַמַּשָּׂא עָלָיו
  choice: उसके विरुद्ध बहुत-सी भविष्यवाणियों
  rationale: מַשָּׂא का अर्थ बोझ अथवा दैवी वचन/भविष्यवाणी हो सकता है; यहाँ עָלָיו और योआश के प्रतिकूल संदर्भ के कारण 'उसके विरुद्ध ... भविष्यवाणियों' चुना गया है। कठिन और बहुअर्थी पदबंध के अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וִיסוֹד בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन की नींव रखे जाने का विवरण
  rationale: יסד के मूलार्थ 'नींव रखना/स्थापित करना' को बनाए रखता है और अध्याय में भवन-संबंधी कार्य के संदर्भ में स्वाभाविक हिन्दी देता है; 'विवरण' वाक्य की सूची को लिखित स्रोत से स्पष्टतः जोड़ता है।
- source_word: הִנָּם כְּתוּבִים
  choice: देखो, ये सब ... लिखे हैं
  rationale: הִנָּם के संकेतात्मक जोर को 'देखो' से और बहुवचन संदर्भ को 'ये सब' से व्यक्त किया गया है।
- source_word: עַל מִדְרַשׁ סֵפֶר הַמְּלָכִים
  choice: ‘राजाओं की पुस्तक के मिद्राश’ में
  rationale: מִדְרַשׁ को लिप्यंतरित कर विधा को अनावश्यक रूप से निश्चित नहीं किया गया; सम्भावित अर्थ पादटिप्पणी में समझाया गया है। עַל यहाँ लिखित स्रोत के संदर्भ में हिन्दी के स्वाभाविक 'में' से व्यक्त है।
- source_word: וַיִּמְלֹךְ אֲמַצְיָהוּ בְנוֹ תַּחְתָּיו
  choice: तब उसका पुत्र अमस्याह उसके स्थान पर राजा हुआ
  rationale: राजकीय उत्तराधिकार के सूत्र का स्वाभाविक आधुनिक हिन्दी रूप; 'तब' वाव-क्रम के कथात्मक संक्रमण को व्यक्त करता है।
theological_decisions:
- issue: מַשָּׂא का अर्थ
  choice: भविष्यवाणियाँ
  alternative: बोझ; उसके विरुद्ध घोषणा; उस पर लगाया गया भारी कर
  rationale: संदर्भ दैवी न्याय-संबंधी वचनों की ओर संकेत कर सकता है, पर इब्रानी पदबंध कठिन है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं और अनिश्चितता नहीं छिपाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। 'परमेश्वर का भवन' स्रोत की उपमा को बनाए रखता है; 'मिद्राश' को लिप्यंतरित कर पादटिप्पणी में समझाया गया है। मुख्य पाठ के दोनों पादटिप्पणी चिह्न [a], [b] उपस्थित हैं।
