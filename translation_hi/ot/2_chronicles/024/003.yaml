  text: Jehoiada took for him two wives[a], and he fathered sons and daughters.
translation:
  language: hi
  text: यहोयादा ने उसके लिए दो पत्नियाँ लीं[a], और उसके बेटे-बेटियाँ हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कम संभावना के साथ: “यहोयादा ने दो पत्नियाँ लीं, और उसके बेटे-बेटियाँ हुए,” यदि पूरे पद में यहोयादा को ही कर्ता माना जाए।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא ל֥וֹ
  choice: उसके लिए ... लीं
  rationale: נשׂא का विवाह-संदर्भ में अर्थ ‘पत्नी लेना’ है; לּוֹ लाभार्थी को दिखाता है। यहाँ आशय है कि यहोयादा ने योआश के लिए विवाह की व्यवस्था की। हिंदी में ‘उसके लिए ... लीं’ मूल वाक्य-विन्यास और उसकी संदर्भगत अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: יְהוֹיָדָע
  choice: यहोयादा
  rationale: नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: נָשִׁים שְׁתָּיִם
  choice: दो पत्नियाँ
  rationale: विवाह-संदर्भ में נָשִׁים का अर्थ ‘पत्नियाँ’ है; संख्या को स्पष्ट रूप से बनाए रखा गया है।
- source_word: וַיּוֹלֶד
  choice: उससे ... उत्पन्न हुए
  rationale: हिफ़िल रूप का मूल अर्थ ‘जन्म देना/संतान उत्पन्न करना’ है। संदर्भ में योआश को संतान होने का आशय स्वाभाविक हिंदी में व्यक्त किया गया है, जबकि कर्ता-संबंधी वैकल्पिक पठन पादटिप्पणी में सुरक्षित है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: इब्रानी में पुत्रों और पुत्रियों का अलग-अलग उल्लेख है; आधुनिक सहज हिंदी में यही भेद संक्षेप और स्पष्टता से बना रहता है।
theological_decisions:
- issue: सर्वनाम और अंतिम क्रिया का संदर्भ
  choice: यहोयादा ने राजा योआश के लिए दो पत्नियों की व्यवस्था की, और योआश से बेटे-बेटियाँ उत्पन्न हुए।
  alternative: यहोयादा ने स्वयं दो पत्नियाँ लीं और उसके बेटे-बेटियाँ उत्पन्न हुए।
  rationale: निकटवर्ती कथा का विषय योआश है और לּוֹ (‘उसके लिए’) यह संकेत देता है कि यहोयादा ने योआश की ओर से कार्य किया। फिर भी अंतिम क्रिया का निकटतम स्पष्ट कर्ता यहोयादा है, इसलिए कम संभावित वैकल्पिक पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेटे-बेटियाँ’ साधारण पाठक के लिए ‘पुत्र-पुत्रियाँ’ से अधिक स्वाभाविक है। मुख्य पाठ संदर्भगत प्रमुख पठन देता है और मूल की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखता है।
