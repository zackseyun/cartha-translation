  text: כִּי֩ בְ/מִצְעַ֨ר אֲנָשִׁ֜ים בָּ֣אוּ חֵ֣יל אֲרָ֗ם וַֽ/יהוָה֙ נָתַ֨ן בְּ/יָדָ֥/ם חַ֨יִל֙ לָ/רֹ֣ב מְאֹ֔ד כִּ֣י עָֽזְב֔וּ אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וְ/אֶת יוֹאָ֖שׁ עָשׂ֥וּ שְׁפָטִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/024.yaml
  text: For the army of Aram came with few men[a], but Yahweh gave a very great army into their hand, because they had forsaken Yahweh, the God of their fathers[c][b]. Thus they executed judgment on Joash.
translation:
  language: hi
  text: क्योंकि अराम की सेना बहुत कम सैनिकों[a] के साथ आई, फिर भी याहवे ने एक बहुत बड़ी सेना उनके हाथ में सौंप दी[b], क्योंकि उन्होंने अपने पूर्वजों के परमेश्वर याहवे को त्याग दिया था। और उन्होंने योआश को न्याय-दण्ड दिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत कम लोगों के साथ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके हाथ में सौंप दी”; यह किसी के अधिकार या वश में कर देने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या, “उन्होंने योआश पर न्याय किए।”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמִצְעַר אֲנָשִׁים
  choice: बहुत थोड़े सैनिकों के साथ
  rationale: यह पदबंध संख्या की अत्यल्पता बताता है। यह हिन्दी में स्वाभाविक है और आगे उल्लिखित विशाल सेना के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: חֵיל אֲרָם
  choice: अराम की सेना
  rationale: इस सैन्य प्रसंग में חֵיל का अर्थ सेना है। मूल इब्रानी नाम के अनुरूप ‘अराम’ रखा गया है।
- source_word: נָתַן בְּיָדָם
  choice: उनके हाथ में कर दी
  rationale: इब्रानी मुहावरा किसी को दूसरे के अधिकार या वश में कर देने को व्यक्त करता है। हिन्दी का यह समान मुहावरा मूल बिंब और आशय दोनों को सुरक्षित रखता है।
- source_word: חַיִל לָרֹב מְאֹד
  choice: एक बहुत विशाल सेना
  rationale: חַיִל यहाँ सैन्य बल को और לָרֹב מְאֹד उसकी अत्यधिक बड़ी संख्या को दर्शाता है।
- source_word: עָזְבוּ
  choice: त्याग दिया था
  rationale: क्रिया यहाँ केवल छोड़कर चले जाने के बजाय परमेश्वर से विमुख होने का गंभीर भाव रखती है; ‘त्याग दिया’ उस भार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: ‘पूर्वजों’ से वंशगत और वाचागत संबंध बना रहता है तथा आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: עָשׂוּ שְׁפָטִים
  choice: दण्ड दिया
  rationale: बहुवचन שְׁפָטִים यहाँ योआश के विरुद्ध किए गए दण्डात्मक न्याय-कर्मों को सूचित करता है। मुख्य पाठ में ‘दण्ड दिया’ स्वाभाविक हिन्दी है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: अरामियों की विजय और योआश पर न्याय
  choice: याहवे ने सेना उनके हाथ में कर दी ... और उन्होंने योआश को दण्ड दिया
  alternative: इस प्रकार उन्होंने योआश पर न्याय किया
  rationale: अनुवाद विजय को याहवे के कार्य और इस्राएल के त्याग से जोड़ता है, जैसा मूल पाठ करता है, पर अन्तिम वाक्य में ‘इस प्रकार’ जोड़कर संबंध को मूल से अधिक स्पष्ट या व्यवस्थित नहीं करता।
- issue: שְׁפָטִים का बहुवचन
  choice: दण्ड दिया
  alternative: न्याय-दण्डों को कार्यान्वित किया
  rationale: इब्रानी बहुवचन कई दण्डात्मक कार्रवाइयों अथवा न्यायिक प्रतिफल का संकेत दे सकता है। स्वाभाविक हिन्दी मुख्य पाठ में सामूहिक अर्थ रखा गया है और शाब्दिक बहुवचन पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। सैन्य विरोध, ईश्वरीय नाम, इब्रानी ‘हाथ’ वाले मुहावरे और अन्तिम दण्डात्मक न्याय का भाव सुरक्षित रखा गया है।
