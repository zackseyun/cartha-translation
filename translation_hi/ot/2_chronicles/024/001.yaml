  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजकीय सूत्र को हिन्दी की स्वाभाविक वाक्य-रचना में प्रस्तुत किया गया है; कोई व्याख्यात्मक या सम्प्रदायगत विस्तार नहीं जोड़ा गया।
