base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/001.yaml
  text: Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah from Beer-sheba.
translation:
  language: hi
  text: योआश जब राजा बना, तब वह सात वर्ष का था, और उसने यरूशलेम में चालीस वर्ष तक राज्य किया। उसकी माता का नाम सिब्या था, जो बेर्शेबा की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֶׁבַע שָׁנִים
  choice: वह सात वर्ष का था
  rationale: इब्रानी आयु-सूत्र का शाब्दिक रूप ‘सात वर्षों का पुत्र’ है; आधुनिक हिन्दी में इसका स्वाभाविक और सटीक अर्थ ‘सात वर्ष का था’ है।
- source_word: בְּמָלְכוֹ
  choice: जब राजा बना
  rationale: यह रूप उसके राजत्व आरम्भ होने के समय को बताता है। ‘जब राजा बना’ आधुनिक हिन्दी में सहज है और संदर्भतः स्पष्ट है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ ‘राजा होना/शासन करना’ है। राजकीय सारांश की शैली में ‘राज्य किया’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב यहाँ स्थानसूचक है; इसलिए ‘यरूशलेम में’ सीधा अनुवाद है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: यह प्रचलित वंशावली-सूत्र है। ‘माता’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: צִבְיָה
  choice: सिब्या
  rationale: व्यक्तिवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִבְּאֵר שָׁבַע
  choice: वह बेर्शेबा की रहनेवाली थी
  rationale: מִן मूल स्थान को सूचित करता है। हिन्दी में किसी व्यक्ति के नगर से संबंध को ‘की रहनेवाली’ कहना ‘से थी’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
