  text: וּ/בְ/לֶכְתָּ֣/ם מִמֶּ֗/נּוּ כִּֽי עָזְב֣וּ אֹת/וֹ֮ ב/מחליים רַבִּים֒ הִתְקַשְּׁר֨וּ עָלָ֜י/ו עֲבָדָ֗י/ו בִּ/דְמֵי֙ בְּנֵי֙ יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן וַ/יַּֽהַרְגֻ֥/הוּ עַל מִטָּת֖/וֹ וַ/יָּמֹ֑ת וַֽ/יִּקְבְּרֻ֨/הוּ֙ בְּ/עִ֣יר דָּוִ֔יד וְ/לֹ֥א קְבָרֻ֖/הוּ בְּ/קִבְר֥וֹת הַ/מְּלָכִֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/025.yaml
  text: When they departed from him—for they left him with many diseases—his servants conspired against him because of the blood of the sons of Jehoiada the priest[a], and they killed him on his bed, and he died. They buried him in the city of David, but they did not bury him in the tombs of the kings.
translation:
  language: hi
  text: जब वे उसके पास से चले गए—क्योंकि वे उसे अनेक रोगों से पीड़ित छोड़ गए थे—तब उसके सेवकों ने यहोयादा याजक के पुत्रों के खून के कारण[a] उसके विरुद्ध षड्यंत्र रचा और उसे उसके बिस्तर पर मार डाला, और वह मर गया। उन्होंने उसे दाऊद के नगर में दफ़नाया, पर उसे राजाओं की कब्रों में नहीं दफ़नाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “यहोयादा याजक के पुत्रों के खून के कारण।” प्रसंग में इसका विशेष संकेत “यहोयादा के पुत्र,” अर्थात् जकर्याह, की ओर हो सकता है (24:20–22)।
    reason: मसोराई बहुवचन और प्रसंग से अपेक्षित एकवचन के बीच पाठगत-व्याख्यात्मक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: וּבְלֶכְתָּם מִמֶּנּוּ
  choice: जब वे उसके पास से चले गए
  rationale: ב के साथ infinitive construct का कालवाचक अर्थ ‘जब वे चले गए’ है; מִמֶּנּוּ योआश से दूर जाने को व्यक्त करता है।
- source_word: כִּי עָזְבוּ אֹתוֹ בְּמַחֳלָיִם רַבִּים
  choice: क्योंकि वे उसे अनेक रोगों से पीड़ित छोड़ गए थे
  rationale: כִּי को कारणसूचक रखा गया है। מַחֳלָיִם के बहुवचन को ‘अनेक रोगों’ से सुरक्षित रखते हुए स्वाभाविक हिन्दी के लिए ‘से पीड़ित’ जोड़ा गया है।
- source_word: הִתְקַשְּׁרוּ עָלָיו עֲבָדָיו
  choice: उसके सेवकों ने ... उसके विरुद्ध षड्यंत्र रचा
  rationale: हित्पएल הִתְקַשְּׁרוּ यहाँ मिलकर षड्यंत्र करने का अर्थ देता है; עֲבָדָיו का सीधा अर्थ ‘उसके सेवक’ रखा गया है।
- source_word: בִּדְמֵי בְּנֵי יְהוֹיָדָע הַכֹּהֵן
  choice: यहोयादा याजक के पुत्रों के खून के कारण
  rationale: בִּדְמֵי में कारण अथवा रक्त-दोष का भाव है। मुख्य पाठ में मसोराई बहुवचन בְּנֵי ‘पुत्रों’ को बनाए रखा गया है।
- source_word: וַיַּהַרְגֻהוּ עַל מִטָּתוֹ
  choice: उसके बिस्तर पर ही उसे मार डाला
  rationale: הרג का सामान्य अर्थ ‘मार डालना’ है। ‘ही’ हत्या के बिस्तर पर होने की प्रसंगगत प्रमुखता को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיָּמֹת
  choice: इस प्रकार वह मर गया
  rationale: मूल में मृत्यु का स्पष्ट कथन अलग से है; हत्या के बाद इसे अनावश्यक पुनरुक्ति बनने से बचाते हुए परिणामसूचक ढंग से बनाए रखा गया है।
- source_word: וַיִּקְבְּרֻהוּ בְּעִיר דָּוִיד
  choice: उन्होंने उसे दाऊद के नगर में दफ़नाया
  rationale: कथात्मक क्रम और स्थान का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: וְלֹא קְבָרֻהוּ בְּקִבְרוֹת הַמְּלָכִים
  choice: पर राजाओं की कब्रों में नहीं दफ़नाया
  rationale: וְלֹא का विरोधसूचक भाव ‘पर’ से व्यक्त है; राजकीय समाधि-स्थल से बहिष्कार का अपमानजनक विरोध सुरक्षित है।
theological_decisions:
- issue: मसोराई पाठ में ‘यहोयादा के पुत्रों’ का बहुवचन, जबकि निकट प्रसंग में एक पुत्र जकर्याह का उल्लेख है
  choice: मुख्य पाठ में ‘यहोयादा याजक के पुत्रों’ रखा गया है।
  alternative: ‘यहोयादा याजक के पुत्र’ अर्थात् जकर्याह
  rationale: प्रदत्त इब्रानी पाठ स्पष्ट रूप से बहुवचन בְּנֵי पढ़ता है। 24:20–22 का प्रसंग एक पुत्र जकर्याह की ओर संकेत करता है, इसलिए तनाव को चुपचाप सुलझाने के बजाय मुख्य पाठ में बहुवचन और पाद-टिप्पणी में प्रासंगिक एकवचन संभावना रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथात्मक रूप अपनाया गया है। ‘याजक,’ ‘षड्यंत्र,’ ‘दाऊद का नगर’ और ‘राजाओं की कब्रें’ बाइबलीय संदर्भ के परिचित पद हैं। मुख्य पाठ में मूल के बहुवचन को बिना सामंजस्य किए रखा गया है।
