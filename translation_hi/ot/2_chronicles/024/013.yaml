base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/024/013.yaml
  text: So the workmen labored[a], and the repair work progressed by their hand[b]; they restored the house of God to its proper condition and strengthened it.
translation:
  language: hi
  text: कारीगर काम में लगे रहे, और उनके हाथों मरम्मत का काम आगे बढ़ता गया[a]। उन्होंने परमेश्वर के भवन को उसकी उचित अवस्था में[b] पुनः स्थापित किया और उसे मज़बूत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ऐसा शब्द है जिसका अर्थ ‘चंगाई’ या ‘बहाली’ भी हो सकता है; भवन के संदर्भ में यह उसकी मरम्मत और पुनःस्थापना को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके निर्धारित स्वरूप में’ अथवा ‘उसकी मूल दशा में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ עֹשֵׂי הַמְּלָאכָה
  choice: कारीगर काम में लगे रहे
  rationale: शाब्दिक रूप ‘काम करनेवालों ने काम किया’ हिन्दी में अनावश्यक पुनरुक्ति होती। चुना हुआ रूप कार्य में उनकी निरंतर सक्रियता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתַּעַל אֲרוּכָה לַמְּלָאכָה
  choice: मरम्मत का काम आगे बढ़ता गया
  rationale: אֲרוּכָה का मूल अर्थ चंगाई, बहाली या मरम्मत हो सकता है। भवन के संदर्भ में ‘मरम्मत’ ठोस अर्थ देता है, और עלה यहाँ प्रगति को सूचित करता है।
- source_word: בְּיָדָם
  choice: उनके हाथों
  rationale: यह एजेंसी या माध्यम बतानेवाला इब्रानी मुहावरा है। ‘उनके हाथों’ स्रोत की सजीव छवि को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: וַיַּעֲמִידוּ
  choice: फिर खड़ा किया
  rationale: हिफ़ील रूप का मूल भाव ‘खड़ा करना’ है। जीर्णोद्धार के संदर्भ में ‘फिर खड़ा किया’ संरचना की बहाली को स्पष्ट करता और स्रोत की अभिव्यक्ति को बनाए रखता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह ‘परमेश्वर के घर’ का निकट अर्थ है और यहाँ मन्दिर के लिए प्रयुक्त पद को गरिमापूर्ण, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: עַל מַתְכֻּנְתּוֹ
  choice: उसकी उचित दशा में
  rationale: מַתְכֹּנֶת किसी निर्धारित विन्यास, स्वरूप या उचित अवस्था को सूचित करता है। संदर्भ में यह भवन को उसकी समुचित दशा में बहाल करने का भाव देता है, बिना यह निश्चित किए कि केवल उसका बिल्कुल मूल रूप ही अभिप्रेत है।
- source_word: וַיְאַמְּצֻהוּ
  choice: उसे दृढ़ किया
  rationale: פיעל रूप यहाँ भवन को मजबूत या सुदृढ़ करने का अर्थ देता है। ‘दृढ़ किया’ संक्षिप्त और संदर्भानुकूल है।
