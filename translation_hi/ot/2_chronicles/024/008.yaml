  yaml_path: translation/ot/2_chronicles/024/008.yaml
  text: Then the king commanded[a], and they made one chest and placed it outside at the gate of the house of Yahweh.
translation:
  language: hi
  text: तब राजा ने आज्ञा दी, और उन्होंने एक सन्दूक[a] बनाकर उसे याहवे के भवन के फाटक के बाहर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘एक सन्दूक’; ‘एक’ संभवतः चंदा इकट्ठा करने के लिए एक ही निर्धारित सन्दूक पर बल देता है।
    reason: अर्थगत बल को स्पष्ट करना
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: आज्ञा दी
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहा’ है, पर इस प्रशासनिक प्रसंग में उसके बाद तत्काल कार्य किए जाने से वह आदेश देने का भाव व्यक्त करती है।
- source_word: וַיַּעֲשׂוּ
  choice: उन्होंने … बनाया
  rationale: बहुवचन कर्ता को मूल पाठ की तरह अनिर्दिष्ट रखते हुए भौतिक वस्तु बनाने का सीधा अर्थ व्यक्त किया गया है।
- source_word: אֲרוֹן אֶחָד
  choice: एक सन्दूक
  rationale: אֲרוֹן यहाँ वस्तुएँ रखने वाला सन्दूक है, वाचा का सन्दूक नहीं। אֶחָד के ‘एक’ को बनाए रखा गया है, जो संभवतः एक ही निर्धारित संग्रह-पात्र पर बल देता है।
- source_word: וַיִּתְּנֻהוּ
  choice: उसे … रख दिया
  rationale: इस स्थान-संबंधी प्रसंग में נתן का स्वाभाविक हिन्दी अर्थ ‘रख दिया’ है।
- source_word: בְּשַׁעַר בֵּית יְהוָה חוּצָה
  choice: यहोवा के भवन के फाटक के बाहर
  rationale: यह पदबंध सन्दूक के बाहरी स्थान को बताता है; हिन्दी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना हिन्दी में प्रचलित रूप से प्रस्तुत करता है।
- issue: אֲרוֹן को धार्मिक पारिभाषिक शब्द मानना
  choice: सन्दूक
  alternative: वाचा का सन्दूक
  rationale: प्रसंग में यह चंदा इकट्ठा करने का पात्र है। ‘वाचा का सन्दूक’ कहना पाठ में निहित न होने वाला धार्मिक अर्थ जोड़ देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सन्दूक’ सामान्य पाठक के लिए स्पष्ट है और प्रसंग को वाचा के सन्दूक से भ्रमित नहीं करता।
