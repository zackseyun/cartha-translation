  yaml_path: translation/ot/2_chronicles/024/010.yaml
  text: Then all the officials and all the people rejoiced[a], and they brought their contributions and threw them into the chest until it was full.
translation:
  language: hi
  text: तब सभी अधिकारी और सारी प्रजा आनन्दित हुए, और वे भेंटें लाकर उस संदूक में डालते गए, जब तक कि वह भर नहीं गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक काम पूरा नहीं हुआ।” इब्रानी अभिव्यक्ति का अधिक व्यापक अर्थ “पूर्ण होने तक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: आनन्दित हुई
  rationale: שׂמח सामूहिक हर्ष को व्यक्त करता है; ‘आनन्दित हुई’ आधुनिक, गरिमापूर्ण कथात्मक हिन्दी है। संयुक्त कर्ता का निकटतम और प्रधान सामूहिक पद ‘प्रजा’ स्त्रीलिंग एकवचन होने के कारण यह क्रियारूप स्वाभाविक है।
- source_word: כָל הַשָּׂרִים
  choice: सभी अधिकारी
  rationale: שׂרים यहाँ शासन से जुड़े पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक पाठक के लिए ‘राजकुमारों’ से अधिक स्पष्ट है।
- source_word: וְכָל הָעָם
  choice: और सारी प्रजा
  rationale: עם का सामूहिक अर्थ सुरक्षित रहता है और राजकीय-वृत्तांत के प्रसंग में ‘प्रजा’ स्वाभाविक है।
- source_word: וַיָּבִיאוּ
  choice: अपना-अपना अंशदान लाकर
  rationale: मूल क्रिया का अर्थ ‘वे लाए’ है और उसका कर्म अप्रकट है। तत्कालीन चन्दा-संग्रह के प्रसंग में ‘अंशदान’ इस निहित कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है; ‘अपना-अपना’ सहभागी वितरण को व्यक्त करता है।
- source_word: וַיַּשְׁלִיכוּ
  choice: डालते गए
  rationale: שלך का मूल बोध फेंकने/डालने का है। धन को संदूक में रखने के प्रसंग में ‘डालते गए’ ठोस क्रिया और निरन्तरता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לָאָרוֹן
  choice: उस संदूक में
  rationale: אָרוֹן यहाँ भेंट एकत्र करने का पात्र है, वाचा का सन्दूक नहीं; इसलिए ‘संदूक’ प्रसंगानुकूल और स्पष्ट है।
- source_word: עַד לְכַלֵּה
  choice: जब तक कि वह भर नहीं गया
  rationale: כלה समाप्ति अथवा पूर्णता तक पहुँचने को सूचित करता है। संग्रह-संदूक के प्रसंग में उसके भर जाने का अर्थ सम्भावित और स्वाभाविक है, पर व्यापक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
