  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। मूल में लोगों की बहुत बड़ी संख्या को दो बार रेखांकित किया गया है; हिन्दी में ‘बहुत बड़ी संख्या’ और ‘बहुत विशाल सभा’ द्वारा यह बल बनाए रखा गया है।
