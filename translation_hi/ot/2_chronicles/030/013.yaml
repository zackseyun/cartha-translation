base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/013.yaml
  text: A great many people gathered in Jerusalem to keep the Festival of Unleavened Bread in the second month[b][a], a very great assembly.
translation:
  language: hi
  text: दूसरे महीने में अख़मीरी रोटी का पर्व मनाने के लिए बहुत बड़ी संख्या में लोग यरूशलेम में इकट्ठे हुए—यह एक बहुत विशाल सभा थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ लोगों के एक स्थान पर जमा होने की घटना व्यक्त करता है; ‘इकट्ठे हुए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עַם רָב
  choice: बहुत बड़ी संख्या में लोग
  rationale: इब्रानी पद लोगों की बहुलता पर बल देता है; यह अनुवाद उस मात्रात्मक ज़ोर को स्पष्ट और सहज रूप में रखता है।
- source_word: לַעֲשׂוֹת
  choice: मनाने के लिए
  rationale: शाब्दिक अर्थ ‘करना/बनाना’ है, पर पर्व के साथ यह मुहावरेदार ढंग से पर्व मनाने या उसका पालन करने को दर्शाता है।
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: חַג एक धार्मिक पर्व को और מַצּוֹת बिना ख़मीर की रोटियों को दर्शाता है; ‘अख़मीरी रोटी’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और समझने योग्य है।
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने में
  rationale: मूल का सीधा काल-सूचक वाक्यांश है और प्रसंग की असामान्य तिथि के कारण इसे यथावत रखना आवश्यक है।
- source_word: קָהָל לָרֹב מְאֹד
  choice: यह एक बहुत विशाल सभा थी
  rationale: קָהָל एकत्र समुदाय को दर्शाता है और לָרֹב מְאֹד उसकी अत्यधिक संख्या पर बल देता है; स्वतंत्र उपवाक्य हिन्दी में मूल की पुनरुक्तिपूर्ण तीव्रता सुरक्षित रखता है।
