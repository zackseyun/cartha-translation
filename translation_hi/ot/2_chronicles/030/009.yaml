  text: כִּ֣י בְ/שׁוּבְ/כֶ֞ם עַל יְהוָ֗ה אֲחֵי/כֶ֨ם וּ/בְנֵי/כֶ֤ם לְ/רַחֲמִים֙ לִ/פְנֵ֣י שֽׁוֹבֵי/הֶ֔ם וְ/לָ/שׁ֖וּב לָ/אָ֣רֶץ הַ/זֹּ֑את כִּֽי חַנּ֤וּן וְ/רַחוּם֙ יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/לֹא יָסִ֤יר פָּנִים֙ מִ/כֶּ֔ם אִם תָּשׁ֖וּבוּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/009.yaml
  text: For when you return to Yahweh[a], your brothers and your sons will find compassion before their captors and return to this land. For Yahweh your God is gracious and compassionate[c][b], and he will not turn his face away from you if you return to him.
translation:
  language: hi
  text: क्योंकि जब तुम याहवे की ओर लौटोगे, तो तुम्हारे भाई और बेटे अपने बंदी बनानेवालों के सामने दया पाएँगे और इस देश में लौट आएँगे। क्योंकि तुम्हारा परमेश्वर याहवे अनुग्रहकारी और करुणामय है; यदि तुम उसकी ओर लौटोगे, तो वह तुमसे अपना मुख नहीं फेरेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּשׁוּבְכֶם עַל יְהוָה
  choice: यदि तुम याहवे की ओर लौटोगे
  rationale: שׁוּב यहाँ दिशा-सूचक संबंध के साथ परमेश्वर की ओर संबंध और वाचा की निष्ठा में लौटने का भाव देता है। ‘लौटोगे’ पद के अंत में इसी मूल की पुनरावृत्ति भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֲחֵיכֶם וּבְנֵיכֶם
  choice: तुम्हारे भाई और बेटे
  rationale: मूल पाठ के स्पष्ट पुल्लिंग संबंधवाची शब्दों ‘भाइयों’ और ‘बेटों’ को बनाए रखा गया है।
- source_word: לְרַחֲמִים לִפְנֵי שׁוֹבֵיהֶם
  choice: उन्हें बंदी बनानेवालों की दृष्टि में दया पाएँगे
  rationale: यह रचना उन लोगों के सामने दया के पात्र होने का भाव व्यक्त करती है जो उन्हें बंदी बनाकर ले गए थे। हिन्दी में ‘दृष्टि में दया पाएँगे’ इस संबंधपरक बिंब को स्वाभाविक ढंग से रखता है।
- source_word: וְלָשׁוּב לָאָרֶץ הַזֹּאת
  choice: और इस देश में लौट आएँगे
  rationale: अनन्त क्रिया दया मिलने से जुड़े परिणाम या उद्देश्य को व्यक्त कर सकती है। यह अनुवाद लौटने के परिणाम को स्पष्ट करता है, पर किसी अनकही बाहरी कर्तृता को नहीं जोड़ता।
- source_word: חַנּוּן וְרַחוּם
  choice: अनुग्रहकारी और करुणामय
  rationale: दोनों विशेषण परमेश्वर की कृपा और गहरी दया को अलग-अलग किंतु संबंधित रूप में व्यक्त करते हैं।
- source_word: לֹא יָסִיר פָּנִים מִכֶּם
  choice: वह तुमसे अपना मुख नहीं फेरेगा
  rationale: ‘मुख’ का मूल इब्रानी बिंब सुरक्षित रखा गया है; यह परमेश्वर के संबंधपरक अनुग्रह और स्वीकार का संकेत देता है।
- source_word: אִם תָּשׁוּבוּ אֵלָיו
  choice: यदि तुम उसकी ओर लौटोगे
  rationale: आरंभिक שׁוּב की पुनरावृत्ति रखते हुए पश्चात्ताप और संबंध की बहाली का भाव व्यक्त किया गया है।
theological_decisions:
- issue: שׁוּב में पश्चात्ताप और वाचा की ओर वापसी
  choice: याहवे की ओर लौटोगे / उसकी ओर लौटोगे
  alternative: याहवे की ओर फिरोगे / उसकी ओर फिरोगे
  rationale: ‘लौटना’ पद में दोहराए गए इब्रानी मूल और बहाली के भाव को सुरक्षित रखता है, बिना बाद की धर्मवैज्ञानिक शब्दावली आरोपित किए।
- issue: परिवार के लिंग-सूचक शब्द
  choice: तुम्हारे भाई और बेटे
  alternative: तुम्हारे भाई और बच्चे
  rationale: मूल पाठ में दोनों संज्ञाएँ पुल्लिंग हैं; इसलिए मुख्य पाठ में उन्हें लिंग-निरपेक्ष नहीं बनाया गया।
- issue: बंधुओं की वापसी में दया की भूमिका
  choice: दया पाएँगे और इस देश में लौट आएँगे
  alternative: उन पर दया की जाएगी, ताकि वे इस देश में लौट सकें
  rationale: इब्रानी वाक्यरचना उद्देश्य और परिणाम दोनों की छाया रख सकती है। मुख्य पाठ स्वाभाविक हिन्दी में घटनाओं का संबंध बनाए रखता है, पर उसे कठोर कारणात्मक सूत्र में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुख फेरना’ जैसे परिचित हिन्दी मुहावरे से इब्रानी संबंधपरक बिंब सुरक्षित है। वाक्य-विन्यास को दो वाक्यों में रखा गया है ताकि लंबा कारणवाचक कथन स्पष्ट रहे।
