language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי רַבַּ֥ת בַּ/קָּהָ֖ל אֲשֶׁ֣ר לֹא הִתְקַדָּ֑שׁוּ וְ/הַ/לְוִיִּ֞ם עַל שְׁחִיטַ֣ת הַ/פְּסָחִ֗ים לְ/כֹל֙ לֹ֣א טָה֔וֹר לְ/הַקְדִּ֖ישׁ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/017.yaml
  text: For many in the assembly had not sanctified themselves[a], and the Levites were over the slaughter of the Passover lambs for everyone who was not clean[c][b], to consecrate them to Yahweh.
translation:
  language: hi
  text: क्योंकि सभा में बहुत-से लोगों ने अपने आपको पवित्र नहीं किया था[a], और जो कोई शुद्ध नहीं था[b], उसके लिए फ़सह के बलि-पशुओं[c] का वध करने और उन्हें याहवे के लिए पवित्र करने का दायित्व लेवियों पर था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आपको समर्पित नहीं किया था।’ इब्रानी में पवित्र करने की भाषा है, यद्यपि तत्काल प्रसंग संस्कारगत शुद्धता का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो-जो अशुद्ध थे।’ यहाँ शुद्धता से आशय उपासना के लिए संस्कारगत शुद्धता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘फ़सहों’; अर्थात फ़सह के बलि-पशु।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में ‘पवित्र करने’ का कर्म स्पष्ट नहीं है। यहाँ ‘उन्हें’ से फ़सह के बलि-पशु समझे गए हैं; इसे अशुद्ध लोगों के लिए संकेत मानना भी संभव है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: רַבַּת בַּקָּהָל
  choice: सभा में बहुत-से लोग
  rationale: यह पदबंध एकत्र समुदाय के भीतर बड़ी संख्या को व्यक्त करता है; ‘सभा’ आधुनिक और उपासना-संदर्भ के अनुकूल है।
- source_word: הִתְקַדָּשׁוּ
  choice: अपने आपको पवित्र नहीं किया था
  rationale: हित्पएल रूप उपासना के लिए स्वयं को पवित्र अथवा समर्पित करने का भाव रखता है; केवल ‘शुद्ध’ कहना קדשׁ और טהר के बीच का भेद मिटा देता।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: इस जातीय और उपासना-संबंधी समूह के नाम का प्रचलित हिन्दी रूप।
- source_word: עַל שְׁחִיטַת
  choice: वध करने का दायित्व ... पर था
  rationale: यहाँ עַל उत्तरदायित्व या कार्यभार दर्शाता है और שְׁחִיטָה बलि-पशु के विधिपूर्वक वध को।
- source_word: הַפְּסָחִים
  choice: फ़सह के बलि-पशुओं
  rationale: शाब्दिक रूप बहुवचन ‘फ़सह’ है, पर प्रसंग में उससे फ़सह के लिए चढ़ाए जाने वाले पशु अभिप्रेत हैं; ‘बलि-पशु’ जाति को अनावश्यक रूप से केवल मेमनों तक सीमित नहीं करता।
- source_word: לְכֹל לֹא טָהוֹר
  choice: जो कोई शुद्ध नहीं था, उसके लिए
  rationale: टेक्स्ट के नकारात्मक कथन को बनाए रखते हुए यह संस्कारगत शुद्धता के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: לְהַקְדִּישׁ לַיהוָה
  choice: उन्हें याहवे के लिए पवित्र करने
  rationale: קדשׁ की पवित्रता/समर्पण संबंधी भाषा बनाए रखी गई है। हिन्दी में ‘उन्हें’ जोड़ा गया है; निकटतम संभावित संदर्भ फ़सह के बलि-पशु हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण, किसी पदवी से उसका प्रतिस्थापन नहीं।
theological_decisions:
- issue: फ़सह के प्रसंग में קדשׁ और טהר का संबंध
  choice: קדשׁ के लिए ‘पवित्र करना’ और טהר के लिए ‘शुद्ध होना’ रखकर दोनों शब्दों में भेद बनाए रखना
  alternative: दोनों को केवल संस्कारगत शुद्धि की भाषा में अनूदित करना
  rationale: प्रसंग संस्कारगत पात्रता का है, फिर भी मूल पाठ पवित्रता और शुद्धता के लिए अलग शब्द प्रयोग करता है; अनुवाद इस तनाव को समाप्त नहीं करता।
- issue: לְהַקְדִּישׁ का अनुक्त कर्म
  choice: मुख्य पाठ में ‘उन्हें’ जोड़ना और इसे निकटवर्ती फ़सह के बलि-पशुओं से संबद्ध समझना
  alternative: इसे अशुद्ध लोगों के पवित्रीकरण के रूप में समझना, अथवा कर्म को बिल्कुल अनिर्दिष्ट रखना
  rationale: इब्रानी में कर्म स्पष्ट नहीं है। बलि-पशु निकटतम और प्रसंगानुकूल संदर्भ हैं, लेकिन वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वध’ बलि-संदर्भ की औपचारिकता बनाए रखता है; ‘दायित्व ... पर था’ עַל के उत्तरदायित्व-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
