  text: וְ/אַל תִּֽהְי֗וּ כַּ/אֲבֽוֹתֵי/כֶם֙ וְ/כַ֣/אֲחֵי/כֶ֔ם אֲשֶׁ֣ר מָעֲל֔וּ בַּ/יהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵי/הֶ֑ם וַ/יִּתְּנֵ֣/ם לְ/שַׁמָּ֔ה כַּ/אֲשֶׁ֖ר אַתֶּ֥ם רֹאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/007.yaml
  text: Do not be like your fathers and like your brothers[a], who were unfaithful to Yahweh, the God of their fathers, and he made them a desolation, as you see.
translation:
  language: hi
  text: और अपने पुरखों और अपने भाइयों[a] के समान न बनो, जिन्होंने अपने पुरखों के परमेश्वर यहोवा के प्रति विश्वासघात किया, और उसने उन्हें उजाड़[b] बना दिया, जैसा तुम देख रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयों’ का अर्थ यहाँ उत्तरी इस्राएल के उनके बंधु या सजातीय लोग भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘भय या विस्मय का दृश्य’; हिब्रू शब्द उजाड़ के साथ उस भयानक दशा को भी सूचित कर सकता है जिसे देखकर लोग स्तब्ध हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל תִּהְיוּ
  choice: और ... न बनो
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। तुलना के संदर्भ में आधुनिक हिन्दी में ‘के समान न बनो’ स्वाभाविक है; आरम्भिक וְ को ‘और’ से रखा गया है।
- source_word: כַאֲבוֹתֵיכֶם
  choice: अपने पुरखों के समान
  rationale: אָבוֹת यहाँ पिछली पीढ़ियों को सूचित करता है। ‘पुरखे’ आधुनिक पाठक के लिए ‘पिता’ से अधिक स्पष्ट रूप से पूर्वजों का अर्थ देता है।
- source_word: וְכַאֲחֵיכֶם
  choice: और अपने भाइयों के समान
  rationale: אָח का अर्थ सगे भाई अथवा व्यापक बंधु-समुदाय हो सकता है। ‘भाइयों’ से मूल की पारिवारिक और वाचा-संबंधी भाषा सुरक्षित रहती है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מָעֲלוּ
  choice: विश्वासघात किया
  rationale: מעל परमेश्वर के प्रति निष्ठा भंग करने का वाचागत भाव रखता है। ‘विश्वासघात किया’ इस सक्रिय और गंभीर अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: בַּיהוָה
  choice: यहोवा से
  rationale: מעל के साथ ב लक्ष्य के विरुद्ध या उसके प्रति विश्वासघात को दर्शाता है। हिन्दी मुहावरे में ‘यहोवा से विश्वासघात किया’ स्वाभाविक है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पुरखों के परमेश्वर
  rationale: यह वाचागत सूत्र मूल के संबंध को सीधे बनाए रखता है और पहले आए ‘पुरखों’ को प्रतिध्वनित करता है।
- source_word: וַיִּתְּנֵם לְשַׁמָּה
  choice: तब उसने उन्हें उजाड़ और भयावह दशा में डाल दिया
  rationale: נתן के साथ לְשַׁמָּה का अर्थ उन्हें ऐसी दशा में पहुँचा देना है जो उजाड़ भी है और देखने वालों के लिए भयावह भी। ‘डाल दिया’ परिणामसूचक निर्माण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַאֲשֶׁר אַתֶּם רֹאִים
  choice: जैसा तुम देख रहे हो
  rationale: वर्तमान कृदन्त एक प्रत्यक्ष और अभी दिखाई देने वाली स्थिति की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम יהוה है, इसलिए उसे उपाधि ‘प्रभु’ से नहीं बदला गया। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया, जबकि ‘याहवे’ अधिक प्रत्यक्ष ध्वन्यात्मक विकल्प है।
- issue: दण्ड के कर्ता की पहचान
  choice: ‘उसने’ का संदर्भ यहोवा से है
  alternative: नाम को दोहराकर ‘यहोवा ने’
  rationale: हिब्रू में एकवचन कर्ता क्रिया में निहित है और निकटतम स्पष्ट एकवचन संदर्भ यहोवा है। सर्वनाम मूल की शैली और क्रम को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और जनसुलभ रखी गई है। ‘पुरखे’, ‘विश्वासघात’ और ‘उजाड़ और भयावह दशा’ मूल के ऐतिहासिक, वाचागत और दण्डात्मक आयामों को बिना संप्रदायगत व्याख्या जोड़े व्यक्त करते हैं।
