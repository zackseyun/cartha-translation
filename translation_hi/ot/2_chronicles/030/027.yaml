  text: וַ/יָּקֻ֜מוּ הַ/כֹּהֲנִ֤ים הַ/לְוִיִּם֙ וַ/יְבָרֲכ֣וּ אֶת הָ/עָ֔ם וַ/יִּשָּׁמַ֖ע בְּ/קוֹלָ֑/ם וַ/תָּב֧וֹא תְפִלָּתָ֛/ם לִ/מְע֥וֹן קָדְשׁ֖/וֹ לַ/שָּׁמָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/027.yaml
  text: Then the priests[a], the Levites, stood up and blessed the people, and their voice was heard, and their prayer came to his holy dwelling[c][b], to heaven.
translation:
  language: hi
  text: तब लेवीय याजक उठे और उन्होंने लोगों को आशीर्वाद दिया। उनकी आवाज़ सुनी गई[a], और उनकी प्रार्थना उसके पवित्र निवास तक, अर्थात् स्वर्ग तक पहुँची[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी आवाज़ पर ध्यान दिया गया”; निष्क्रिय प्रयोग से संदर्भतः परमेश्वर द्वारा सुनना अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: या “स्वर्ग में उसके पवित्र निवास तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठे
  rationale: קום का कालक्रमिक रूप यहाँ उठ खड़े होने की ठोस क्रिया बताता है; आधुनिक हिन्दी में ‘उठे’ स्वाभाविक और संक्षिप्त है।
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: लेवीय याजक
  rationale: दोनों निश्चित संज्ञाओं का संबंध संभवतः समानाधिकरण का है, अर्थात याजकों की पहचान लेवियों के रूप में की गई है; ‘लेवीय याजक’ इसे दो अलग समूह बनाए बिना स्पष्ट करता है।
- source_word: וַיְבָרֲכוּ אֶת־הָעָם
  choice: उन्होंने लोगों को आशीर्वाद दिया
  rationale: ברך यहाँ लोगों के ऊपर आशीर्वाद बोलने को दर्शाता है; हिन्दी का प्रचलित धार्मिक पदबंध मूल अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיִּשָּׁמַע בְּקוֹלָם
  choice: उनकी आवाज़ सुनी गई
  rationale: निफ़अल रूप की निष्क्रिय अभिव्यक्ति सुरक्षित रखी गई है और परमेश्वर को स्पष्ट कर्ता बनाकर मूल से अधिक नहीं कहा गया।
- source_word: תְפִלָּתָם
  choice: उनकी प्रार्थना
  rationale: एकवचन संज्ञा बहुवचन संबंधसूचक प्रत्यय के साथ सामूहिक प्रार्थना को दर्शाती है; हिन्दी में यही सीधा और स्वाभाविक रूप है।
- source_word: לִמְעוֹן קָדְשׁוֹ
  choice: उसके पवित्र निवास में
  rationale: מָעוֹן का अर्थ निवास-स्थान है। लक्ष्यसूचक ל को हिन्दी में ‘पहुँची’ के साथ गंतव्य के रूप में ‘में’ कहना स्वाभाविक है।
- source_word: לַשָּׁמָיִם
  choice: स्वर्ग तक
  rationale: यह वाक्यांश पूर्ववर्ती ‘उसके पवित्र निवास’ के साथ गंतव्य अथवा व्याख्यात्मक समानाधिकरण में है। ‘स्वर्ग तक’ गति का बिंब और पृथक हिब्रू पद दोनों बनाए रखता है।
theological_decisions:
- issue: क्या ‘सुनी गई’ का कर्ता परमेश्वर को स्पष्ट रूप से बनाया जाए
  choice: निष्क्रिय अभिव्यक्ति ‘उनकी आवाज़ सुनी गई’ रखी गई।
  alternative: परमेश्वर ने उनकी आवाज़ सुनी।
  rationale: संदर्भ में परमेश्वर द्वारा सुनना निहित है, पर हिब्रू वाक्य निष्क्रिय है और यहाँ परमेश्वर का नाम स्पष्ट कर्ता के रूप में नहीं देता।
- issue: ‘याजक’ और ‘लेवी’ का पारस्परिक संबंध
  choice: एक ही वर्ग की पहचान बताते हुए ‘लेवीय याजक’।
  alternative: ‘याजक, अर्थात लेवी’ अथवा ‘याजक और लेवी’।
  rationale: हिब्रू में संयोजक ‘और’ नहीं है और समानाधिकरण संभावित है। दो अलग समूहों का संकेत देने से बचते हुए मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई।
- issue: पवित्र निवास और स्वर्ग के बीच संबंध
  choice: दोनों पदों को ‘उसके पवित्र निवास में, स्वर्ग तक’ के रूप में बनाए रखा।
  alternative: ‘स्वर्ग में उसके पवित्र निवास तक’।
  rationale: मूल में दोनों पद अलग-अलग ל उपसर्ग के साथ हैं। चुना गया रूप पुनरुक्त गंतव्य-बिंब को बचाता है, जबकि पादटिप्पणी समानाधिकरण की दूसरी स्वाभाविक समझ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘लेवीय याजक’ सामान्य पाठक के लिए समानाधिकरण से अधिक सहज है। छोटे वाक्यों से लंबी हिब्रू श्रृंखला को स्पष्ट किया गया है, जबकि निष्क्रिय ‘सुनी गई’ और अंतिम स्थानगत द्विरुक्ति की मूल तनावशीलता सुरक्षित रखी गई है।
