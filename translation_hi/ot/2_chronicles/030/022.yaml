base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/022.yaml
  text: And Hezekiah spoke encouragingly to all the Levites who showed good understanding in the service of Yahweh[a]. And they ate the feast for seven days, sacrificing peace offerings and giving thanks to Yahweh[d][c][b], the God of their fathers.
translation:
  language: hi
  text: हिजकिय्याह ने उन सब लेवियों से उत्साह बढ़ाने वाली बातें कीं[a], जो याहवे की सेवा में अच्छी समझ दिखाते थे[b]। और उन्होंने सात दिन तक पर्व का भोजन किया, शांति-बलियाँ[c] चढ़ाईं और अपने पूर्वजों के परमेश्वर याहवे का धन्यवाद किया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब लेवियों के हृदय को संबोधित करके बात की।” इसका अर्थ उनसे उत्साह बढ़ाने वाली, सांत्वना देने वाली या स्नेहपूर्ण बातें करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “जिन्हें याहवे के विषय में अच्छी सूझ-बूझ थी” या “जो याहवे से संबंधित काम में कुशल थे” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में एक विशेष प्रकार की बलियाँ; इनका अनुवाद “मेल-बलियाँ” या “कुशल-क्षेम की बलियाँ” भी किया जाता है।
    reason: lexical_alternative
  - marker: d
    text: इस क्रिया का अर्थ “अंगीकार करना” या “स्तुति करना” भी हो सकता है; यहाँ उपासना में धन्यवाद देने का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר עַל־לֵב
  choice: हौसला बढ़ाया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘हृदय से/हृदय पर बात की’ है, पर प्रसंग में इसका आशय उत्साह और सामर्थ्य देने वाली बात कहना है। ‘हौसला बढ़ाया’ आधुनिक हिन्दी में स्वाभाविक रूप से यही अर्थ देता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: इस विशिष्ट गोत्रीय और उपासना-संबंधी समूह के लिए प्रचलित नाम सुरक्षित रखा गया है।
- source_word: הַמַּשְׂכִּילִים שֵׂכֶל טוֹב
  choice: अच्छी समझ दिखाते थे
  rationale: एक ही मूल से बने कृदंत और संज्ञा का मेल समझ, सूझ-बूझ और कुशलता पर बल देता है। सक्रिय कृदंत के कारण ‘दिखाते थे’ केवल स्थायी गुण नहीं, बल्कि उनकी सेवा में प्रकट योग्यता को व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे की सेवा में
  rationale: ל संबंध अथवा दिशा बता सकता है। लेवियों और पर्व के उपासना-संदर्भ में यह समझ याहवे से संबंधित पवित्र सेवा में प्रकट होती है; फिर भी वैकल्पिक अधिक शाब्दिक अर्थ फुटनोट में रखा गया है।
- source_word: וַיֹּאכְלוּ אֶת־הַמּוֹעֵד שִׁבְעַת הַיָּמִים
  choice: उन्होंने सातों दिन पर्व का भोज खाया
  rationale: क्रिया का अर्थ वास्तव में ‘खाया’ है और מוֹעֵד उसका सीधा कर्म है। हिन्दी में ‘पर्व को खाया’ अस्वाभाविक होगा, इसलिए ‘पर्व का भोज खाया’ मूल की ठोस भोज-संबंधी अभिव्यक्ति को स्वाभाविक ढंग से व्यक्त करता है; ‘सातों दिन’ अवधि बताता है।
- source_word: מְזַבְּחִים זִבְחֵי שְׁלָמִים
  choice: शांति-बलियाँ चढ़ाईं
  rationale: זִבְחֵי שְׁלָמִים एक निश्चित बलिदान-श्रेणी है। ‘शांति-बलियाँ’ संक्षिप्त और पारंपरिक है, जबकि मेल-मिलाप अथवा कुशल-क्षेम से जुड़े संभावित अर्थ फुटनोट में दिए गए हैं।
- source_word: וּמִתְוַדִּים
  choice: धन्यवाद किया
  rationale: ידה का हित्पएल रूप अंगीकार करना, धन्यवाद करना या स्तुति करना व्यक्त कर सकता है। आनंदमय पर्व और बलिदानों के इस संदर्भ में ‘धन्यवाद किया’ सबसे संभावित है, पर वास्तविक शब्दार्थगत अस्पष्टता फुटनोट में सुरक्षित है।
- source_word: אֱלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: ‘पूर्वजों’ से वंश और वाचा से जुड़ी मूल अभिव्यक्ति आधुनिक, सहज और लिंग की दृष्टि से समावेशी हिन्दी में व्यक्त होती है।
theological_decisions:
- issue: יהוה परमेश्वर के निजी नाम का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का वाचा-नाम सीधे आया है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण को हिन्दी में लिप्यंतरित करता है और उसे केवल उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: וּמִתְוַדִּים में धन्यवाद और अंगीकार के बीच अर्थ
  choice: धन्यवाद किया
  alternative: अंगीकार किया; स्तुति की
  rationale: पर्वीय उपासना और शांति-बलियों का सकारात्मक संदर्भ धन्यवाद के अर्थ का समर्थन करता है, पर क्रिया में ‘अंगीकार करना’ का अर्थ भी संभव होने के कारण उसे फुटनोट में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हौसला बढ़ाया’ और ‘पर्व का भोज खाया’ मूल इब्रानी मुहावरों को सहज हिन्दी में व्यक्त करते हैं। ‘शांति-बलियाँ’ धार्मिक पारिभाषिकता बनाए रखता है, और जहाँ इब्रानी में वास्तविक अर्थगत विस्तार है वहाँ फुटनोट दिए गए हैं।
