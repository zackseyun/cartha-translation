source:
  edition: WLC
  text: כִּ֣י מַרְבִּ֣ית הָ/עָ֡ם רַ֠בַּת מֵֽ/אֶפְרַ֨יִם וּ/מְנַשֶּׁ֜ה יִשָּׂשכָ֤ר וּ/זְבֻלוּן֙ לֹ֣א הִטֶּהָ֔רוּ כִּֽי אָכְל֥וּ אֶת הַ/פֶּ֖סַח בְּ/לֹ֣א כַ/כָּת֑וּב כִּי֩ הִתְפַּלֵּ֨ל יְחִזְקִיָּ֤הוּ עֲלֵי/הֶם֙ לֵ/אמֹ֔ר יְהוָ֥ה הַ/טּ֖וֹב יְכַפֵּ֥ר בְּעַֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/018.yaml
  text: For a great many of the people[a], many from Ephraim and Manasseh, Issachar and Zebulun, had not purified themselves, yet they ate the Passover otherwise than as it is written. But Hezekiah prayed for them, saying, “May Yahweh, who is good[b], make atonement for them—”
translation:
  language: hi
  text: क्योंकि लोगों में से बहुत बड़ी संख्या—एप्रैम, मनश्शे, इस्साकार और जबूलून के बहुत-से लोग—अपने आप को शुद्ध नहीं किए थे, फिर भी उन्होंने फसह का भोजन उस विधि के अनुसार नहीं खाया जो लिखी हुई है।[a] परन्तु हिजकिय्याह ने उनके लिए प्रार्थना की, “याहवे, जो भला है, उनके लिए प्रायश्चित करे—”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लिखे हुए के अनुसार नहीं।”
    reason: मूल इब्रानी अभिव्यक्ति का अधिक शाब्दिक रूप बताना।
  - marker: b
    text: यह प्रार्थना पद 19 में आगे जारी रहती है; इब्रानी वाक्य इस पद के अंत में अधूरा है।
    reason: पद-विभाजन के कारण अधूरी रह गई वाक्य-संरचना स्पष्ट करना।
lexical_decisions:
- source_word: מַרְבִּית הָעָם רַבַּת
  choice: लोगों में से बहुत-से लोग—विशेषकर ... के बहुत-से लोग
  rationale: दोनों पद बड़ी संख्या पर बल देते हैं। हिन्दी में पुनरुक्ति को स्वाभाविक रखते हुए अंशवाचक अर्थ और इब्रानी बल दोनों सुरक्षित किए गए हैं; इसे निश्चित ‘बहुमत’ नहीं बनाया गया।
- source_word: מֵאֶפְרַיִם וּמְנַשֶּׁה יִשָּׂשכָר וּזְבֻלוּן
  choice: एप्रैम, मनश्शे, इस्साकार और जबूलून के
  rationale: गोत्रों के नाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं और सूची का क्रम सुरक्षित रखा गया है।
- source_word: לֹא הִטֶּהָרוּ
  choice: अपने आप को शुद्ध नहीं कर पाए थे
  rationale: हित्पएल रूप का आत्मवाचक और अनुष्ठानिक शुद्धता-संबंधी अर्थ व्यक्त होता है। प्रसंग में समयाभाव के कारण तैयारी पूरी न हो पाने का भाव भी स्वाभाविक हिन्दी में आता है, बिना दोषमुक्ति का दावा किए।
- source_word: אָכְלוּ אֶת הַפֶּסַח
  choice: फसह का भोजन ... किया
  rationale: ‘फसह खाया’ का शाब्दिक रूप हिन्दी में अस्वाभाविक है। ‘फसह का भोजन किया’ भोजन/अनुष्ठान का अर्थ रखता है और मूल में स्पष्ट न किए गए ‘मेमने’ को नहीं जोड़ता।
- source_word: בְּלֹא כַכָּתוּב
  choice: उस विधि के अनुसार नहीं ... जो लिखी हुई है
  rationale: लिखित विधान के अनुरूप न होने का अर्थ स्पष्ट रहता है और ‘व्यवस्था के विरुद्ध’ जैसी अधिक व्याख्यात्मक भाषा से बचा गया है।
- source_word: הִתְפַּלֵּל ... עֲלֵיהֶם
  choice: उनके लिए ... प्रार्थना की
  rationale: दूसरों की ओर से की गई प्रार्थना का सीधा, स्वाभाविक अर्थ देता है; ‘मध्यस्थता’ जैसा अधिक तकनीकी शब्द आवश्यक नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- source_word: הַטּוֹב
  choice: जो भला है
  rationale: विशेषण को याहवे के गुणवाचक विशेषण के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יְכַפֵּר
  choice: प्रायश्चित करे
  rationale: फसह और अनुष्ठानिक शुद्धता के प्रसंग में पिएल क्रिया का प्रायश्चितकारी अर्थ सुरक्षित रहता है; केवल ‘क्षमा करे’ कहने से इसका अनुष्ठानिक आयाम घट जाता।
- source_word: בְּעַד
  choice: उनके लिए
  rationale: पूर्वसर्ग का अर्थ ‘की ओर से/के लिए’ है। यद्यपि इसका व्याकरणिक पूरक अगले पद में आता है, वर्तमान पद के संदर्भित अशुद्ध लोगों को हिन्दी में सर्वनाम द्वारा स्वाभाविक रूप से संकेत किया गया है और अपूर्ण वाक्य को डैश से चिह्नित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में बनाए रखना मूल पाठ के प्रत्यक्ष प्रयोग को सुरक्षित रखता है; किसी उपाधि को नहीं रखा गया।
- issue: כפר की धार्मिक-अनुष्ठानिक भाषा
  choice: प्रायश्चित करे
  alternative: क्षमा करे
  rationale: यहाँ फसह और शुद्धता का अनुष्ठानिक संदर्भ है। ‘प्रायश्चित’ मूल की धार्मिक तनावपूर्ण भाषा को रखता है और उसे केवल सामान्य क्षमा में सीमित नहीं करता।
- issue: पद के अंत में अधूरा वाक्य
  choice: डैश के साथ अगले पद में जारी प्रार्थना
  alternative: अगले पद का आशय जोड़कर वाक्य पूरा करना
  rationale: इब्रानी वाक्य इस पद के अंत में पूरा नहीं होता। डैश मूल की संरचना और अगले पद पर निर्भरता दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। अनुष्ठानिक पदों ‘शुद्ध’, ‘फसह’ और ‘प्रायश्चित’ को सुरक्षित रखा गया है। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न [a] और [b] संबंधित स्थानों पर उपस्थित हैं।
