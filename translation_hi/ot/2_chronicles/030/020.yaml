  yaml_path: translation/ot/2_chronicles/030/020.yaml
  text: And Yahweh listened to Hezekiah and healed the people[a][b].
translation:
  language: hi
  text: याहवे ने हिजकिय्याह की बात सुनी[a] और लोगों को चंगा किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिजकिय्याह की सुनी।” इस रचना में इब्रानी क्रिया का अर्थ केवल “सुनना” ही नहीं, बल्कि ध्यान देकर अनुकूल उत्तर देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “चंगा किया” का आशय याहवे द्वारा लोगों के अनुचित रीति से अनुष्ठान में भाग लेने से जुड़े कष्ट या न्याय को दूर करना भी हो सकता है; यह आवश्यक नहीं कि केवल शारीरिक बीमारी की चंगाई हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: की सुनी
  rationale: שׁמע के साथ אֶל यहाँ केवल ध्वनि सुनने के बजाय किसी की विनती सुनने और उस पर अनुकूल प्रतिक्रिया देने का भाव रखता है। पिछले पदों में हिजकिय्याह की प्रार्थना के संदर्भ में ‘की सुनी’ स्वाभाविक हिंदी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण में रखा गया है।
- source_word: יְחִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम का मानक और मूल उच्चारण के निकट हिंदी बाइबलीय लिप्यंतरण।
- source_word: וַיִּרְפָּא
  choice: चंगा किया
  rationale: רפא का सामान्य अर्थ चंगा करना है। संदर्भ में यह अनुचित रीति-दशा से जुड़े कष्ट या दंड को दूर करने तक विस्तृत हो सकता है; ‘चंगा किया’ मूल रूपक को सुरक्षित रखता है।
- source_word: הָעָם
  choice: लोगों को
  rationale: עם यहाँ एकत्र इस्राएली समुदाय को दर्शाता है; ‘लोग’ आधुनिक हिंदी में सहज और पर्याप्त व्यापक है।
theological_decisions:
- issue: ‘लोगों को चंगा किया’ में चंगाई का स्वरूप
  choice: मूल चंगाई की भाषा को बिना संकुचित किए बनाए रखा गया।
  alternative: लोगों को क्षमा किया / बचा लिया / बहाल किया
  rationale: निकट संदर्भ अशुद्ध दशा में फसह खाने वालों और उनके लिए क्षमा की प्रार्थना से जुड़ा है, पर पद स्पष्टतः רפא (‘चंगा करना’) का प्रयोग करता है। इसलिए इसे केवल शारीरिक स्वास्थ्य या केवल क्षमा के अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘की सुनी’ प्रार्थना स्वीकार करने का स्वाभाविक मुहावरा है, जबकि पादटिप्पणी मूल क्रिया की व्यापकता बनाए रखती है।
