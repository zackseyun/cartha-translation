  text: כִּ֣י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְ֠הוּדָה הֵרִ֨ים לַ/קָּהָ֜ל אֶ֣לֶף פָּרִים֮ וְ/שִׁבְעַ֣ת אֲלָפִ֣ים צֹאן֒ וְ/הַ/שָּׂרִ֞ים הֵרִ֤ימוּ לַ/קָּהָל֙ פָּרִ֣ים אֶ֔לֶף וְ/צֹ֖אן עֲשֶׂ֣רֶת אֲלָפִ֑ים וַ/יִּֽתְקַדְּשׁ֥וּ כֹהֲנִ֖ים לָ/רֹֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/024.yaml
  text: For Hezekiah king of Judah gave to the assembly one thousand bulls and seven thousand sheep[a], and the officials gave to the assembly one thousand bulls and ten thousand sheep[b]; and priests consecrated themselves in great numbers.
translation:
  language: hi
  text: क्योंकि यहूदा के राजा हिजकिय्याह ने सभा को एक हज़ार बैल और सात हज़ार भेड़-बकरियाँ दिए[a], और अधिकारियों ने सभा को एक हज़ार बैल और दस हज़ार भेड़-बकरियाँ दिए; और बहुत-से याजकों ने अपने आपको पवित्र किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सभा को” का अनुवाद “सभा के लिए” भी किया जा सकता है; इस प्रसंग में इब्रानी संबंधबोधक दोनों अर्थों की अनुमति देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है; इसलिए कारणसूचक संबंध को स्पष्ट रखा गया है।
- source_word: הֵרִים / הֵרִימוּ
  choice: दीं
  rationale: हिफ़ील रूप यहाँ सभा के सामूहिक उपासना-कार्य के लिए पशु उपलब्ध कराने का भाव देता है; सहज हिन्दी में ‘दीं’ इस आशय को बिना अनावश्यक तकनीकी विशेषीकरण के व्यक्त करता है।
- source_word: לַקָּהָל
  choice: सभा को
  rationale: קהל एकत्र समुदाय को सूचित करता है। לְ को ‘को’ कहना मूल संरचना के निकट और हिन्दी में स्वाभाविक है, यद्यपि प्रसंग में ‘सभा के लिए’ भी सम्भव है।
- source_word: פָּרִים
  choice: बैल
  rationale: यह बलि में प्रयुक्त गोवंशीय नर पशुओं का सीधा और प्रचलित हिन्दी रूप है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं के झुंड, विशेषकर भेड़ और बकरियों, दोनों को समेट सकती है; ‘भेड़-बकरियाँ’ मूल की व्यापकता बचाती है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: यहाँ उच्च पदस्थ अगुओं या शासकीय पदाधिकारियों का संकेत है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और वंशानुगत राजकुमार का अनावश्यक अर्थ नहीं लाता।
- source_word: וַיִּתְקַדְּשׁוּ כֹהֲנִים
  choice: याजकों ने अपने आपको पवित्र किया
  rationale: हित्पएल रूप आत्मवाचक है और याजकीय सेवा के लिए विधिपूर्वक अपने को पवित्र या अलग करने का भाव रखता है।
- source_word: לָרֹב
  choice: बहुत-से
  rationale: यह बड़ी संख्या पर बल देता है; हिन्दी में संज्ञा से पहले ‘बहुत-से’ स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: याजकों के आत्म-पवित्रीकरण का विधिक अर्थ
  choice: अपने आपको पवित्र किया
  alternative: अपने आपको शुद्ध किया
  rationale: קדשׁ का केंद्र पवित्र ठहरने या सेवा के लिए अलग होने पर है। ‘शुद्ध किया’ सम्भव अनुष्ठानिक प्रक्रिया को दर्शाता, पर मूल क्रिया के पवित्रीकरण-वाले अर्थ को संकुचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘भेड़-बकरियाँ’ द्वारा צֹאן की व्यापकता मुख्य पाठ में ही सुरक्षित रखी गई है, इसलिए उसके लिए अलग पादटिप्पणी आवश्यक नहीं है।
