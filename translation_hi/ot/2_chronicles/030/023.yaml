  text: तब पूरी सभा ने मिलकर निश्चय किया कि वे इसे सात दिन और मनाएँ[a], और उन्होंने उसे सात दिन तक आनंद के साथ मनाया।
  philosophy: optimal-equivalence
  footnotes:
