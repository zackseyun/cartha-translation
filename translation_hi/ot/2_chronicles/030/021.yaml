  text: וַ/יַּעֲשׂ֣וּ בְנֵֽי יִ֠שְׂרָאֵל הַ/נִּמְצְאִ֨ים בִּ/ירוּשָׁלִַ֜ם אֶת חַ֧ג הַ/מַּצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֣ה גְדוֹלָ֑ה וּֽ/מְהַלְלִ֣ים לַ֠/יהוָה י֣וֹם בְּ/י֞וֹם הַ/לְוִיִּ֧ם וְ/הַ/כֹּהֲנִ֛ים בִּ/כְלֵי עֹ֖ז לַ/יהוָֽה־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/021.yaml
  text: And the sons of Israel who were found in Jerusalem kept the Feast of Unleavened Bread for seven days with great joy[b][a], and the Levites and the priests praised Yahweh day by day with mighty instruments to Yahweh.
translation:
  language: hi
  text: यरूशलेम में उपस्थित इस्राएलियों ने सात दिन तक बड़े आनन्द के साथ अख़मीरी रोटी का पर्व मनाया, और लेवीय तथा याजक प्रतिदिन बल के वाद्यों[a] के साथ यहोवा की स्तुति करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बल/सामर्थ्य के वाद्यों के साथ यहोवा के लिये।” इसका अर्थ “सामर्थ्यशाली वाद्यों से” या “ऊँचे स्वर वाले वाद्यों से” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: मनाया
  rationale: חַג के साथ यह क्रिया किसी पर्व को मनाने या उसका पालन करने का मुहावरेदार अर्थ देती है। आधुनिक हिन्दी में ‘पर्व मनाया’ स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: ऐतिहासिक प्रसंग में यह पद उपस्थित इस्राएली समुदाय को सूचित करता है; शाब्दिक ‘इस्राएल के पुत्र’ की अपेक्षा यह आधुनिक हिन्दी में अधिक सहज है।
- source_word: הַנִּמְצְאִים
  choice: उपस्थित
  rationale: शाब्दिक अर्थ ‘पाए गए’ है, पर यहाँ आशय यरूशलेम में मौजूद लोगों से है; ‘उपस्थित’ वही संदर्भगत अर्थ स्पष्ट रूप से देता है।
- source_word: חַג הַמַּצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: यह स्थापित पर्वनाम है; ‘अख़मीरी’ बिना खमीर की रोटी का संक्षिप्त और प्रचलित बाइबलीय पद है।
- source_word: בְשִׂמְחָה גְדוֹלָה
  choice: बड़े आनन्द के साथ
  rationale: मूल के ‘महान आनन्द’ को स्वाभाविक और गरिमामय हिन्दी में व्यक्त करता है।
- source_word: וּמְהַלְלִים
  choice: स्तुति करते रहे ... गुणगान करते रहे
  rationale: कृदन्त जारी और साथ-साथ होने वाली क्रिया दर्शाता है। अन्तिम לַיהוָה सहित कठिन वाक्य-विन्यास को स्पष्ट करने के लिए हिन्दी में स्तुति की क्रिया दोहराई गई है।
- source_word: יוֹם בְּיוֹם
  choice: प्रतिदिन
  rationale: वितरणात्मक मुहावरे ‘दिन-प्रतिदिन’ का सहज आधुनिक हिन्दी रूप।
- source_word: בִּכְלֵי עֹז
  choice: सामर्थ्यशाली वाद्यों से
  rationale: शाब्दिक रूप ‘सामर्थ्य के उपकरणों/वाद्यों से’ है। सन्दर्भ संगीत-वाद्यों का संकेत देता है, पर עֹז की असामान्य विशेषता को ‘सामर्थ्यशाली’ में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को हिन्दी में सुविख्यात लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों में स्थापित ‘यहोवा’ नाम की पहचान बनाए रखता है; ‘याहवे’ अधिक ध्वन्यात्मक विकल्प है।
- issue: בִּכְלֵי עֹז לַיהוָה का कठिन सम्बन्ध
  choice: सामर्थ्यशाली वाद्यों से यहोवा का गुणगान
  alternative: यहोवा के लिए सामर्थ्य के वाद्यों से स्तुति
  rationale: मूल पदबंध व्याकरण और अर्थ की दृष्टि से असामान्य है। मुख्य पाठ सम्भावित वाद्य-संगीत का अर्थ देता है, जबकि टिप्पणी शाब्दिकता और अन्य सम्भावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज ऐतिहासिक-वर्णन शैली और गरिमामय धार्मिक शब्दावली। कठिन इब्रानी पदबंध को मुख्य पाठ में पठनीय रखा गया है और उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
