id: 2CH.30.15
reference: 2 Chronicles 30:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁחֲט֣וּ הַ/פֶּ֔סַח בְּ/אַרְבָּעָ֥ה עָשָׂ֖ר לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֑י וְ/הַ/כֹּהֲנִ֨ים וְ/הַ/לְוִיִּ֤ם נִכְלְמוּ֙ וַ/יִּֽתְקַדְּשׁ֔וּ וַ/יָּבִ֥יאוּ עֹל֖וֹת בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/015.yaml
  text: And they slaughtered the Passover lamb on the fourteenth day of the second month. Then the priests and the Levites were ashamed and consecrated themselves[a], and they brought burnt offerings to the house of Yahweh.
translation:
  language: hi
  text: उन्होंने दूसरे महीने के चौदहवें दिन फसह के मेमने[a] का वध किया। तब याजक और लेवी लज्जित हुए, उन्होंने अपने को पवित्र किया और याहवे के भवन में होमबलियाँ लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल ‘फसह’ है; यहाँ उसका अर्थ फसह के लिए वध किया जाने वाला बलि-पशु, अर्थात् मेमना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: वध किया
  rationale: שׁחט पशु के वध को दर्शाता है, विशेषकर बलिदान के प्रसंग में। ‘वध किया’ अनुष्ठानिक संदर्भ को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: הַפֶּסַח
  choice: फसह के मेमने
  rationale: मूल में शब्दशः ‘फसह’ है, पर यहाँ उससे वध किए जाने वाले फसह-बलि के पशु का बोध होता है। प्रसंग में मेमना अभिप्रेत है; मूल की संक्षिप्तता को पादटिप्पणी में बताया गया है।
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने के चौदहवें दिन
  rationale: यह इब्रानी तिथि-सूचक पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मन्दिर और बलिदान के संदर्भ में כֹּהֲנִים का मानक हिन्दी अनुवाद।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: यह लेवी गोत्र के मन्दिर-सेवकों को याजकों से अलग समूह के रूप में दर्शाता है।
- source_word: נִכְלְמוּ
  choice: लज्जित हुए
  rationale: निफ़अल रूप यहाँ लज्जा या अपमान अनुभव करने का भाव देता है; ‘लज्जित हुए’ सीधा और प्रसंगानुकूल है।
- source_word: וַיִּתְקַדְּשׁוּ
  choice: अपने को पवित्र किया
  rationale: यह मन्दिर-सेवा के लिए अनुष्ठानिक आत्म-शुद्धि अथवा समर्पण को दर्शाता है। ‘अपने को पवित्र किया’ धार्मिक अर्थ को सहज हिन्दी में रखता है।
- source_word: וַיָּבִיאוּ עֹלוֹת
  choice: होमबलियाँ लाए
  rationale: עֹלוֹת पूर्णतः अग्नि पर चढ़ाई जाने वाली बलियों के लिए प्रचलित अनुष्ठानिक पद है; ‘होमबलियाँ’ इस विशिष्ट अर्थ को बनाए रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: בֵּית का औपचारिक रूप ‘भवन’ रखा गया है और בֵּית के साथ गन्तव्य/प्रवेश का भाव हिन्दी में ‘में’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसे उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है; ‘यहोवा’ पारंपरिक वैकल्पिक उच्चारण है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
- issue: וַיִּתְקַדְּשׁוּ में पवित्रता का स्वरूप
  choice: अपने को पवित्र किया
  alternative: अपने को शुद्ध किया; अपने को समर्पित किया
  rationale: मूल क्रिया अनुष्ठानिक तैयारी, शुद्धि और पवित्रीकरण के व्यापक भाव को समेटती है। चुना हुआ रूप किसी एक प्रक्रिया को अत्यधिक सीमित किए बिना इस धार्मिक अर्थ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘याजक’, ‘लेवी’, ‘फसह’ और ‘होमबलियाँ’ जैसे स्थापित बाइबलीय शब्द अनुष्ठानिक सटीकता के लिए बनाए गए हैं।
