  text: עַתָּ֕ה אַל תַּקְשׁ֥וּ עָרְפְּ/כֶ֖ם כַּ/אֲבוֹתֵי/כֶ֑ם תְּנוּ יָ֣ד לַ/יהוָ֗ה וּ/בֹ֤אוּ לְ/מִקְדָּשׁ/וֹ֙ אֲשֶׁ֣ר הִקְדִּ֣ישׁ לְ/עוֹלָ֔ם וְ/עִבְדוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם וְ/יָשֹׁ֥ב מִ/כֶּ֖ם חֲר֥וֹן אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/008.yaml
  text: Do not stiffen your neck as your fathers did[a]. Give your hand to Yahweh, and come to his sanctuary, which he has consecrated forever, and serve Yahweh your God[b], so that his burning anger may turn away from you.
translation:
  language: hi
  text: अब अपनी गर्दन अपने पुरखों की तरह कठोर मत करो। यहोवा को अपना हाथ दो[a] और उसके पवित्र स्थान में आओ, जिसे उसने सदा के लिए पवित्र ठहराया है। अपने परमेश्वर यहोवा की सेवा करो, ताकि उसका धधकता क्रोध तुम पर से हट जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहोवा को हाथ दो।” यह समर्पण, निष्ठा की प्रतिज्ञा, या उसके अधीन होने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “और उसका धधकता क्रोध तुम पर से हट जाएगा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: मसोराई पाठ में स्पष्ट कालवाचक शब्द עַתָּה है; इसलिए इसे हिन्दी में ‘अब’ के रूप में रखा गया है।
- source_word: תַּקְשׁוּ עָרְפְּכֶם
  choice: हठीले मत बनो
  rationale: शाब्दिक चित्र ‘अपनी गर्दन कठोर न करो’ है और इसका आशय अड़ियल विरोध से है। स्वाभाविक आधुनिक हिन्दी में ‘हठीले मत बनो’ वही अर्थ स्पष्ट करता है।
- source_word: כַּאֲבוֹתֵיכֶם
  choice: अपने पुरखों की तरह
  rationale: यह पिछली पीढ़ियों से तुलना करता है। ‘पुरखे’ सामान्य हिन्दी में पूर्वजों को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: תְּנוּ יָד לַיהוָה
  choice: यहोवा के अधीन हो जाओ
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘यहोवा को हाथ दो’ है, पर यहाँ वह समर्पण या अधीनता प्रकट करता है। मुख्य पाठ में अर्थ दिया गया है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: לַיהוָה / יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִקְדָּשׁוֹ
  choice: उसके पवित्रस्थान
  rationale: מִקְדָּשׁ किसी पवित्र किए हुए स्थान या धाम को दर्शाता है। ‘पवित्रस्थान’ इसके धार्मिक अर्थ को बनाए रखता है और इसे केवल भवन तक सीमित नहीं करता।
- source_word: הִקְדִּישׁ לְעוֹלָם
  choice: सदा के लिए पवित्र ठहराया है
  rationale: यह चयन किसी स्थान को पवित्र उपयोग के लिए अलग करने का अर्थ और לְעוֹלָם की दीर्घकालिकता दोनों बनाए रखता है।
- source_word: וְעִבְדוּ
  choice: सेवा करो
  rationale: परमेश्वर के संबंध में עבד में उपासना सहित निष्ठापूर्ण सेवा का व्यापक भाव है; ‘सेवा करो’ इस विस्तार को खुला रखता है।
- source_word: וְיָשֹׁב מִכֶּם
  choice: ताकि ... तुम पर से हट जाए
  rationale: आज्ञाओं के बाद यह उपवाक्य अपेक्षित या अभिप्रेत परिणाम व्यक्त करता है। ‘ताकि ... हट जाए’ हिन्दी में इस परिणामसूचक, संभावनात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: חֲרוֹן אַפּוֹ
  choice: उसका धधकता क्रोध
  rationale: इब्रानी पद तीव्र, जलते हुए क्रोध का रूपक रखता है। ‘धधकता क्रोध’ उसकी उग्रता और ताप-चित्र दोनों व्यक्त करता है।
theological_decisions:
- issue: תְּנוּ יָד לַיהוָה मुहावरे का अर्थ
  choice: यहोवा के अधीन हो जाओ
  alternative: यहोवा को अपना हाथ दो
  rationale: इस प्रसंग में वाक्यांश समर्पण, अधीनता या निष्ठा की प्रतिज्ञा दर्शाता है। शाब्दिक हिन्दी अस्पष्ट हो सकती है, इसलिए मुख्य पाठ अर्थ स्पष्ट करता है, जबकि पाद-टिप्पणी मूल चित्र और निकट विकल्प सुरक्षित रखती है।
- issue: וְיָשֹׁב का विधि/परिणामसूचक बल
  choice: ताकि उसका धधकता क्रोध तुम पर से हट जाए
  alternative: और उसका धधकता क्रोध तुम पर से हट जाएगा
  rationale: क्रिया आज्ञात्मक क्रम के बाद आती है और अपेक्षित परिणाम की ओर संकेत करती है। ‘ताकि ... हट जाए’ इसे बिना किसी यांत्रिक, निरपेक्ष गारंटी में बदलने के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल पाठ के स्पष्ट עַתָּה के कारण आरम्भ में ‘अब’ रखा गया है। छोटे वाक्यों से exhortation की सीधी, आग्रहपूर्ण लय बनी रहती है।
