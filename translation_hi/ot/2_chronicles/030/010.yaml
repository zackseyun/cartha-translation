source:
  edition: WLC
  text: וַ/יִּֽהְי֨וּ הָ/רָצִ֜ים עֹבְרִ֨ים מֵ/עִ֧יר לָ/עִ֛יר בְּ/אֶֽרֶץ אֶפְרַ֥יִם וּ/מְנַשֶּׁ֖ה וְ/עַד זְבֻל֑וּן וַ/יִּֽהְיוּ֙ מַשְׂחִיקִ֣ים עֲלֵי/הֶ֔ם וּ/מַלְעִגִ֖ים בָּֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/010.yaml
  text: So the couriers went from city to city in the land of Ephraim and Manasseh[a], as far as Zebulun[b]; but they were laughing at them and mocking them.
translation:
  language: hi
  text: इस प्रकार दूत एप्रैम और मनश्शे के प्रदेश में नगर-नगर होते हुए जबूलून तक गए; परन्तु लोग उन पर हँसते और उनका उपहास करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרָצִים
  choice: दूत
  rationale: मूल शब्द का शाब्दिक संबंध ‘दौड़ने वालों’ से है, पर यहाँ ये शीघ्रता से राजकीय संदेश पहुँचाने वाले अधिकारी हैं। आधुनिक हिन्दी में ‘दूत’ इस भूमिका को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹבְרִים מֵעִיר לָעִיר
  choice: नगर-नगर होते हुए ... गए
  rationale: यह प्रयोग एक नगर से दूसरे नगर तक लगातार यात्रा करने का वितरक भाव और עֹבְרִים का ‘होकर गुजरने’ का अर्थ दोनों व्यक्त करता है।
- source_word: בְּאֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה וְעַד זְבֻלוּן
  choice: एप्रैम और मनश्शे के प्रदेश में ... जबूलून तक
  rationale: भौगोलिक विस्तार को सीधे और स्वाभाविक हिन्दी में रखता है; וְעַד का सीमासूचक अर्थ ‘तक’ से स्पष्ट होता है।
- source_word: מַשְׂחִיקִים עֲלֵיהֶם
  choice: उन पर हँसते
  rationale: संदर्भ में क्रिया साधारण हँसी नहीं, किसी को तुच्छ समझकर उस पर हँसने का भाव रखती है। ‘उन पर हँसते’ इसे सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַלְעִגִים בָּם
  choice: उनका उपहास करते
  rationale: לעג तिरस्कारपूर्ण ठट्ठे या उपहास को दर्शाता है। यह पहले पद के साथ दोहरे और तीव्र तिरस्कार को बनाए रखता है।
- source_word: וַיִּהְיוּ ... מַשְׂחִיקִים ... וּמַלְעִגִים
  choice: हँसते और ... उपहास करते रहे
  rationale: היה के साथ कृदंत जारी या बार-बार होने वाली प्रतिक्रिया का संकेत देता है; ‘करते रहे’ इस पक्षगत बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दूत’ को संदर्भ से पर्याप्त स्पष्ट माना गया है, इसलिए अनावश्यक पादटिप्पणी नहीं जोड़ी गई। दो अलग इब्रानी तिरस्कारसूचक क्रियाओं को ‘हँसते’ और ‘उपहास करते’ के रूप में अलग-अलग सुरक्षित रखा गया है।
