base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/019.yaml
  text: everyone whose heart was set to seek God[a], Yahweh, the God of his fathers, though not according to the purification required for the holy place.
translation:
  language: hi
  text: हर वह व्यक्ति जिसने परमेश्वर—याहवे, अपने पूर्वजों के परमेश्वर—को खोजने के लिए अपने हृदय को तैयार किया, भले ही वह पवित्रस्थान[a] के लिए अपेक्षित शुद्धि के अनुसार शुद्ध न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्तु अथवा पवित्र क्षेत्र से संबंधित शुद्धि।” यहाँ इब्रानी शब्द קֹדֶשׁ पवित्रस्थान का उल्लेख कर सकता है, पर उसका अर्थ अधिक व्यापक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל לְבָבוֹ
  choice: हर वह व्यक्ति जिसने ... अपना हृदय
  rationale: वितरणात्मक एकवचन का स्वाभाविक हिन्दी रूप; इससे प्रत्येक व्यक्ति पर अलग-अलग बल बना रहता है।
- source_word: הֵכִין
  choice: अपना हृदय लगाया
  rationale: כון के हिफ़ील का भाव हृदय को दृढ़तापूर्वक किसी ओर लगाने या उन्मुख करने का है; हिन्दी में यह भक्ति-संकल्प को सहज रूप से व्यक्त करता है।
- source_word: לִדְרוֹשׁ
  choice: खोजने के लिए
  rationale: דרש यहाँ परमेश्वर की ओर उपासना, भक्ति और पूछताछ के भाव से मुड़ने को समेटता है; ‘खोजना’ इसकी व्यापकता बनाए रखता है।
- source_word: הָאֱלֹהִים יְהוָה
  choice: परमेश्वर को—याहवे
  rationale: समानाधिकरण संरचना में जिस परमेश्वर को खोजा जा रहा है, उसकी पहचान याहवे के रूप में होती है; दोनों पद सुरक्षित रखे गए हैं।
- source_word: אֱלֹהֵי אֲבוֹתָיו
  choice: अपने पूर्वजों के परमेश्वर को
  rationale: एकवचन प्रत्यय वितरणात्मक ‘हर व्यक्ति’ से मेल खाता है; ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक और समावेशी वंशगत संदर्भ देता है।
- source_word: וְלֹא כְּטָהֳרַת
  choice: भले ही वह ... अपेक्षित शुद्धि के अनुसार शुद्ध न था
  rationale: संयोजक का concessive संबंध और כְּ का मानक-अनुरूपता भाव स्पष्ट किया गया है। ‘शुद्ध न था’ हिन्दी में अधूरे विशेषणात्मक खंड से बचते हुए अनुष्ठानिक स्थिति बताता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: यह उपासना-संबंधी पवित्र स्थल का पारदर्शी हिन्दी रूप है; ‘पवित्र वस्तु/क्षेत्र’ की संभावित व्यापकता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; उसका लिप्यंतरण पहचान को सुरक्षित रखता है।
- issue: हृदय की तत्परता और अनुष्ठानिक अशुद्धि का तनाव
  choice: सच्चे मन से खोजने और अपेक्षित शुद्धि के अभाव—दोनों को साथ रखा गया है
  alternative: अशुद्धि को गौण कर देना या हृदय की तत्परता को निष्प्रभावी कर देना
  rationale: इब्रानी पाठ दोनों बातों को साथ रखता है और उनके धर्मवैज्ञानिक संबंध का पूर्ण समाधान नहीं करता; अनुवाद भी इस तनाव को नहीं मिटाता।
- issue: טָהֳרַת הַקֹּדֶשׁ का आशय
  choice: पवित्रस्थान के लिए अपेक्षित शुद्धि
  alternative: पवित्रस्थान की शुद्धि; पवित्र वस्तु की शुद्धि
  rationale: כְּ मानक के अनुरूपता का भाव देता है और संदर्भ अनुष्ठानिक पात्रता का है; फिर भी קֹדֶשׁ की शब्दार्थगत व्यापकता पादटिप्पणी में दर्शाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘अपना हृदय लगाया’ स्वाभाविक हिन्दी मुहावरा है और मूल की आंतरिक दृढ़ता को व्यक्त करता है। ‘शुद्धि’ और ‘पवित्रस्थान’ उपासना-संबंधी संदर्भ को स्पष्ट रखते हैं।
