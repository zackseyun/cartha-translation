  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּֽעַמְד֤וּ עַל עָמְדָ/ם֙ כְּ/מִשְׁפָּטָ֔/ם כְּ/תוֹרַ֖ת מֹשֶׁ֣ה אִישׁ הָ/אֱלֹהִ֑ים הַ/כֹּֽהֲנִים֙ זֹרְקִ֣ים אֶת הַ/דָּ֔ם מִ/יַּ֖ד הַ/לְוִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/016.yaml
  text: They stood in their place according to their custom[a], according to the law of Moses the man of God. The priests were sprinkling the blood received from the hand of the Levites.
translation:
  language: hi
  text: वे अपने-अपने स्थान पर, उनके लिए ठहराई गई विधि के अनुसार, परमेश्वर के जन मूसा की व्यवस्था के अनुसार खड़े हुए। याजक लेवियों के हाथ से रक्त लेकर उसे छिड़क रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַמְדוּ עַל־עָמְדָם
  choice: वे अपने-अपने स्थान पर ... खड़े हुए
  rationale: यह पदबंध नियुक्त स्थान या सेवा-स्थान पर खड़े होने को व्यक्त करता है; ‘अपने-अपने स्थान’ सामूहिक व्यवस्था को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כְּמִשְׁפָּטָם
  choice: उनके लिए ठहराई गई विधि के अनुसार
  rationale: मन्दिर-सेवा के प्रसंग में מִשְׁפָּט केवल प्रचलित रीति नहीं, बल्कि निर्धारित प्रक्रिया को सूचित करता है। यह अनुवाद उस औपचारिक अर्थ को सहज हिन्दी में रखता है।
- source_word: כְּתוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था के अनुसार
  rationale: यहाँ תּוֹרָה फसह के अनुष्ठान को नियंत्रित करने वाली मूसा की विधि/शिक्षा है; ‘व्यवस्था’ मानक और प्रसंगानुकूल है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह मूसा की प्रतिष्ठित बाइबलीय उपाधि है और हिन्दी में स्वाभाविक, गरिमापूर्ण रूप है।
- source_word: הַכֹּהֲנִים זֹרְקִים אֶת־הַדָּם
  choice: याजक ... रक्त ... छिड़क रहे थे
  rationale: बलिदानी प्रसंग में זרק वेदी पर रक्त के विधिपूर्वक प्रयोग को दर्शाता है; ‘छिड़कना’ हिन्दी का स्थापित अनुष्ठानिक पद है।
- source_word: מִיַּד הַלְוִיִּם
  choice: लेवियों के हाथ से रक्त लेकर
  rationale: शाब्दिक अर्थ ‘लेवियों के हाथ से’ है। हिन्दी में ‘लेकर’ निहित हस्तांतरण को स्पष्ट करता है और अस्वाभाविकता से बचाता है।
theological_decisions:
- issue: बलिदानी रक्त पर की गई क्रिया
  choice: रक्त ... छिड़क रहे थे
  alternative: रक्त फेंक रहे थे
  rationale: זרק का सामान्य अर्थ फेंकना हो सकता है, पर बलिदानी विधान में यह रक्त के अनुष्ठानिक प्रयोग का तकनीकी क्रियापद है। ‘छिड़कना’ अनुष्ठान को स्पष्ट करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
- issue: כְּמִשְׁפָּטָם का नियामक बल
  choice: उनके लिए ठहराई गई विधि
  alternative: उनकी रीति
  rationale: प्रसंग मूसा की व्यवस्था के अधीन निर्धारित मन्दिर-सेवा का है। इसलिए केवल सामाजिक ‘रीति’ की अपेक्षा निर्धारित विधि का भाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अपने-अपने’, ‘ठहराई गई विधि’ और ‘लेकर’ से हिब्रू वाक्य के निहित संबंध स्वाभाविक हिन्दी में स्पष्ट किए गए हैं।
