base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/006.yaml
  text: So the couriers went with the letters from the hand of the king and his officials throughout all Israel and Judah[a], according to the command of the king, saying, “Sons of Israel, return to Yahweh, the God of Abraham, Isaac, and Israel[b], that he may return to the remnant that has escaped and remains to you from the hand of the kings of Assyria.”
translation:
  language: hi
  text: तब हरकारे राजा और उसके अधिकारियों की ओर से पत्र लेकर, राजा की आज्ञा के अनुसार, पूरे इस्राएल और यहूदा में गए। उन्होंने कहा, “इस्राएल के पुत्रों, अब्राहम, इसहाक और इस्राएल[a] के परमेश्वर याहवे के पास लौट आओ, ताकि वह उस बचे हुए शेष जनसमूह की ओर लौटे, जो अश्शूर के राजाओं के हाथ से बच निकला और तुम्हारे लिए शेष रह गया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ अधिक परिचित ‘याकूब’ नहीं, बल्कि ‘इस्राएल’ है।
    reason: alternative_reading
  - marker: b
    text: 'या: ‘तुम्हारे लिए बचा हुआ वह शेष जनसमूह, जो अश्शूर के राजाओं के हाथ से बच निकला है।’'
    reason: alternative_rendering
lexical_decisions:
- source_word: הָרָצִים
  choice: हरकारे
  rationale: यहाँ शब्द का शाब्दिक अर्थ दौड़ने वाले है, पर राजकीय पत्र पहुँचाने के प्रशासनिक संदर्भ में ‘हरकारे’ उसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: בָּאִגְּרוֹת מִיַּד הַמֶּלֶךְ וְשָׂרָיו
  choice: राजा और उसके अधिकारियों के दिए हुए पत्र लेकर
  rationale: यह रूप पत्रों, राजकीय प्राधिकरण और अधिकारियों की सहभागिता—तीनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל יִשְׂרָאֵל וִיהוּדָה
  choice: पूरे इस्राएल और यहूदा में
  rationale: यह हरकारों की यात्रा और संदेश के भौगोलिक विस्तार को स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रो
  rationale: सम्बोधन में प्रयुक्त इब्रानी पुल्लिंग बहुवचन और वंशगत अभिव्यक्ति को सीधे बनाए रखा गया है।
- source_word: שׁוּבוּ אֶל יְהוָה
  choice: याहवे के पास लौट आओ
  rationale: ‘लौट आओ’ שׁוב में निहित सम्बन्धगत और वाचा-संबंधी वापसी को व्यक्त करता है तथा आगे परमेश्वर के लौटने की पारस्परिक भाषा बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל
  choice: अब्राहम, इसहाक और इस्राएल के परमेश्वर
  rationale: मूल पाठ में परिचित ‘याकूब’ के स्थान पर स्पष्टतः ‘इस्राएल’ है; इसलिए उसका सामंजस्यीकरण नहीं किया गया।
- source_word: וְיָשֹׁב אֶל
  choice: और वह ... की ओर लौटे
  rationale: आज्ञार्थक आह्वान के बाद आने वाली क्रिया को ऐसी रीति से रखा गया है कि पारस्परिक प्रतिफल और अभिलाषा/परिणाम का भाव बना रहे, बिना उसे निश्चयात्मक प्रतिज्ञा में बदलने के।
- source_word: הַפְּלֵיטָה הַנִּשְׁאֶרֶת לָכֶם
  choice: तुम्हारे उन बचे हुओं ... जो ... बचकर शेष रह गए हैं
  rationale: यह रूप פלט के बच निकलने और שׁאר के शेष रहने—दोनों भावों को व्यक्त करता है तथा לָכֶם को ‘तुम्हारे’ द्वारा बनाए रखता है।
- source_word: מִכַּף מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं के हाथ से
  rationale: ‘हाथ से’ मूल रूपक को बनाए रखता है और उनके अधिकार तथा दमनकारी शक्ति से बच निकलने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण उसे उपाधि से प्रतिस्थापित नहीं करता।
- issue: पितृपुरुषों की सूची में יִשְׂרָאֵל
  choice: इस्राएल
  alternative: याकूब
  rationale: यद्यपि ‘अब्राहम, इसहाक और याकूब’ अधिक परिचित सूत्र है, इस पद का इब्रानी पाठ ‘इस्राएल’ कहता है।
- issue: וְיָשֹׁב का भाव
  choice: और वह ... की ओर लौटे
  alternative: ताकि वह ... की ओर लौटे / तब वह ... की ओर लौटेगा
  rationale: चुना हुआ रूप आज्ञा के प्रत्युत्तर में परमेश्वर के लौटने की पारस्परिकता को रखता है और उद्देश्य, परिणाम तथा प्रत्याशा के बीच मूल तनाव को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हरकारे’ राजकीय संदेशवाहकों के लिए संक्षिप्त तथा प्रसंगानुकूल है। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए कथन-परिचय अलग वाक्य में रखा गया है, जबकि मूल की पारस्परिक ‘लौटने’ की शब्दावली सुरक्षित है।
