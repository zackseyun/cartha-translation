base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/002.yaml
  text: Then the king and his officials and all the assembly in Jerusalem decided to keep the Passover in the second month[a].
translation:
  language: hi
  text: तब राजा, उसके अधिकारियों और यरूशलेम में सारी सभा ने दूसरे महीने में फसह मनाने[a] का निर्णय किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “फसह करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: निर्णय किया
  rationale: निफ़अल रूप यहाँ मिलकर विचार करने से निकले सामूहिक निर्णय को व्यक्त करता है। ‘निर्णय किया’ आधुनिक हिन्दी में स्वाभाविक है और संयुक्त कर्ताओं से सामूहिकता स्पष्ट होती है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का सीधा अनुवाद; इब्रानी इस वाक्य में हिजकिय्याह का नाम नहीं, उसकी उपाधि देता है।
- source_word: וְשָׂרָיו
  choice: उसके अधिकारियों
  rationale: שָׂרִים शासकीय पदधारियों या उच्च अधिकारियों को सूचित करता है। ‘अधिकारियों’ आधुनिक पाठक के लिए स्पष्ट है और ‘राजकुमारों’ की तरह राजपुत्र होने का भ्रामक संकेत नहीं देता।
- source_word: וְכָל הַקָּהָל
  choice: और ... सारी सभा
  rationale: קָהָל एकत्र समुदाय को दर्शाता है। ‘सारी सभा’ उसके सामूहिक अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में उपस्थित
  rationale: स्थानवाचक अर्थ को स्वाभाविक हिन्दी वाक्यक्रम में स्पष्ट किया गया है; ‘उपस्थित’ इब्रानी में निहित सभा के यरूशलेम में होने को व्यक्त करता है, किसी अतिरिक्त यात्रा या स्थायी निवास का अर्थ नहीं जोड़ता।
- source_word: לַעֲשׂוֹת הַפֶּסַח
  choice: फसह मनाने
  rationale: शाब्दिक अर्थ ‘फसह करना’ है, पर यह पर्व का विधिपूर्वक पालन करने का मुहावरा है। ‘फसह मनाना’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने में
  rationale: समय-सूचक पदबंध का सीधा अनुवाद; प्रसंगगत असामान्यता की व्याख्या पद में नहीं जोड़ी गई।
theological_decisions:
- issue: फसह के पालन से जुड़े इब्रानी मुहावरे का अनुवाद
  choice: फसह मनाने
  alternative: फसह का पालन करने / फसह करने
  rationale: इब्रानी पद का आशय फसह-विधि संपन्न करना है। ‘मनाने’ सामान्य आधुनिक हिन्दी में पर्व के पालन को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है और कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘राजा’ और ‘अधिकारी’ जैसे स्पष्ट प्रशासनिक शब्द अपनाए गए हैं; सामूहिक निर्णय तथा यरूशलेम में सभा की स्थिति स्वाभाविक हिन्दी वाक्यक्रम में व्यक्त की गई है।
