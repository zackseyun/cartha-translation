source:
  edition: WLC
  text: כִּ֣י לֹ֧א יָכְל֛וּ לַ/עֲשֹׂת֖/וֹ בָּ/עֵ֣ת הַ/הִ֑יא כִּ֤י הַ/כֹּהֲנִים֙ לֹֽא הִתְקַדְּשׁ֣וּ לְ/מַ דַּ֔י וְ/הָ/עָ֖ם לֹא נֶאֶסְפ֥וּ לִֽ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/003.yaml
  text: For they could not do it at that time[a], because the priests had not consecrated themselves sufficiently[b], and the people had not gathered to Jerusalem.
translation:
  language: hi
  text: क्योंकि वे उस समय उसे मना नहीं सके; याजकों ने पर्याप्त रूप से अपने आपको पवित्र नहीं किया था,[a] और लोग यरूशलेम में इकट्ठे नहीं हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर्याप्त संख्या में याजकों ने अपने आपको पवित्र नहीं किया था।” इब्रानी अभिव्यक्ति का अर्थ यह भी हो सकता है कि तैयार याजकों की संख्या पर्याप्त नहीं थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָכְלוּ
  choice: सके
  rationale: यह क्रिया सामर्थ्य या क्षमता दर्शाती है; नकार के साथ ‘नहीं सके’ स्वाभाविक हिन्दी है।
- source_word: לַעֲשֹׂתוֹ
  choice: उसे मना
  rationale: सर्वनाम प्रसंग में फसह के आयोजन की ओर संकेत करता है। हिन्दी में पर्व के लिए ‘मनाना’ स्वाभाविक है, जबकि केवल ‘करना’ अस्पष्ट और असहज होता।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह पहले निर्धारित फसह के समय की ओर संकेत करता है; ‘उस समय’ मूल की संक्षिप्तता बनाए रखता है।
- source_word: הִתְקַדְּשׁוּ
  choice: अपने आपको पवित्र किया
  rationale: हित्पएल रूप याजकों द्वारा उपासना के लिए स्वयं को विधिपूर्वक तैयार या पवित्र करने को व्यक्त करता है। ‘पवित्र किया’ आधुनिक पाठकों के लिए बोधगम्य है और धार्मिक संदर्भ भी बनाए रखता है।
- source_word: לְמַדַּי
  choice: पर्याप्त रूप से
  rationale: यह संक्षिप्त क्रियाविशेषण पर्याप्त मात्रा या सीमा बताता है। मुख्य पाठ गुणात्मक अर्थ रखता है, जबकि संभव संख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: נֶאֶסְפוּ
  choice: इकट्ठे नहीं हुए थे
  rationale: निफ़अल रूप यहाँ लोगों के एकत्र होने को व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: לִירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यद्यपि उपसर्ग दिशात्मक ‘को/की ओर’ हो सकता है, इकट्ठा होने के परिणामस्वरूप स्थान को हिन्दी में स्वाभाविक रूप से ‘यरूशलेम में’ कहा जाता है।
theological_decisions:
- issue: לְמַדַּי का गुणात्मक या संख्यात्मक आशय
  choice: याजकों ने पर्याप्त रूप से अपने आपको पवित्र नहीं किया था
  alternative: पर्याप्त संख्या में याजकों ने अपने आपको पवित्र नहीं किया था
  rationale: इब्रानी पदबंध दोनों आशयों की गुंजाइश रखता है। मुख्य पाठ उसकी क्रियाविशेषणीय रचना को निकटता से दर्शाता है और वैकल्पिक संख्यात्मक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसे मना’ पिछले प्रसंग में उल्लिखित फसह की ओर संकेत करता है; ‘अपने आपको पवित्र किया’ याजकीय अनुष्ठानिक तैयारी को व्यक्त करता है।
