  text: וַֽ/יִּשְׂמְח֣וּ כָּל קְהַ֣ל יְהוּדָ֗ה וְ/הַ/כֹּהֲנִים֙ וְ/הַ/לְוִיִּ֔ם וְ/כָל הַ/קָּהָ֖ל הַ/בָּאִ֣ים מִ/יִּשְׂרָאֵ֑ל וְ/הַ/גֵּרִ֗ים הַ/בָּאִים֙ מֵ/אֶ֣רֶץ יִשְׂרָאֵ֔ל וְ/הַ/יּוֹשְׁבִ֖ים בִּ/יהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/025.yaml
  text: And all the assembly of Judah rejoiced[a], along with the priests and the Levites, and all the assembly who had come from Israel, and the sojourners who had come from the land of Israel, and those living in Judah.
translation:
  language: hi
  text: तब यहूदा की सारी सभा, याजक और लेवी, इस्राएल से आई सारी सभा, इस्राएल देश से आए परदेशी निवासी[a], और यहूदा में रहनेवाले सभी लोग आनन्दित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परदेशी।” इब्रानी शब्द גֵּרִים उन परदेशियों को सूचित करता है जो इस्राएलियों के बीच निवास करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: आनन्दित हुए
  rationale: שׂמח आनन्द या प्रसन्नता व्यक्त करता है। ‘आनन्दित हुए’ वर्तमान मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा उत्सव मनाने की किसी विशेष रीति को अनावश्यक रूप से नहीं जोड़ता।
- source_word: כָּל קְהַל יְהוּדָה
  choice: यहूदा की सारी सभा
  rationale: קהל एकत्र समुदाय को दर्शाता है। ‘सभा’ यहाँ कलीसियाई अर्थ वाले किसी संप्रदायगत शब्द की अपेक्षा अधिक तटस्थ है और इब्रानी संरचना को निकटता से रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: כֹּהֲנִים के लिए मानक बाइबलीय हिन्दी शब्द; प्रसंग में इसे बदलने का कोई कारण नहीं है।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: लैव्य समूह को याजकों से अलग रखते हुए לְוִיִּם का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: כָל הַקָּהָל הַבָּאִים מִיִּשְׂרָאֵל
  choice: इस्राएल से आई सारी सभा
  rationale: הַבָּאִים उन एकत्र लोगों को पहचानता है जो इस्राएल से आए थे। स्त्रीलिंग ‘आई’ हिन्दी में ‘सभा’ के अनुरूप है और कथात्मक पूर्वता स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֵּרִים
  choice: परदेशी निवासी
  rationale: גֵּרִים गैर-मूल निवासी लोगों को दर्शाता है जो इस्राएलियों के बीच रहते थे। ‘परदेशी निवासी’ उनकी बाहरी उत्पत्ति और स्थानीय निवास दोनों को स्पष्ट करता है; संक्षिप्त वैकल्पिक शब्द ‘प्रवासी’ पादटिप्पणी में रखा गया है।
- source_word: הַבָּאִים מֵאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश से आए
  rationale: אֶרֶץ יִשְׂרָאֵל भौगोलिक उद्गम को यहूदा से अलग करता है। ‘इस्राएल देश’ स्पष्ट और स्रोत के निकट है।
- source_word: הַיּוֹשְׁבִים בִּיהוּדָה
  choice: यहूदा में रहनेवाले सभी लोग
  rationale: ישׁב का कृदन्त निवास करने का भाव देता है। ‘रहनेवाले’ आधुनिक हिन्दी में सहज है; ‘सभी लोग’ आरम्भिक כָּל के व्यापक दायरे को हिन्दी वाक्य में स्पष्ट करता है।
