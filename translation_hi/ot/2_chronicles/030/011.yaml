  yaml_path: translation/ot/2_chronicles/030/011.yaml
  text: Nevertheless, some men from Asher, Manasseh, and Zebulun humbled themselves and came to Jerusalem.
translation:
  language: hi
  text: फिर भी आशेर, मनश्शे और जबूलून के कुछ पुरुष नम्र हुए और यरूशलेम आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: पिछले पद में बहुतों द्वारा उपहास किए जाने के विपरीत इन लोगों की प्रतिक्रिया दिखाने के लिए यह स्वाभाविक विरोधसूचक पदबंध है।
- source_word: אֲנָשִׁים
  choice: कुछ पुरुषों
  rationale: पुल्लिंग बहुवचन संज्ञा यहाँ नामित गोत्रों के लोगों में से एक अनिश्चित छोटे समूह को सूचित करती है।
- source_word: מֵאָשֵׁר וּמְנַשֶּׁה וּמִזְּבֻלוּן
  choice: आशेर, मनश्शे और जबूलून के
  rationale: हिन्दी में ‘के’ इन गोत्रों से संबंध अथवा उद्गम को सहज ढंग से व्यक्त करता है। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: נִכְנְעוּ
  choice: अपने आपको दीन किया
  rationale: כנע के निफ़अल रूप में स्वयं को नम्र या दीन करने का भाव है; प्रसंग में यह बुलावे के प्रति उनकी स्वैच्छिक विनम्र प्रतिक्रिया को व्यक्त करता है।
- source_word: וַיָּבֹאוּ
  choice: और ... आए
  rationale: कथात्मक क्रम में בוא का सीधा अर्थ गंतव्य की ओर आना है।
- source_word: לִירוּשָׁלִָם
  choice: यरूशलेम
  rationale: ल उपसर्ग की गंतव्य-सूचकता हिन्दी क्रिया ‘आए’ और वाक्य-विन्यास में स्वाभाविक रूप से निहित है।
theological_decisions:
- issue: נִכְנְעוּ में कर्मवाच्य और आत्मवाचक अर्थ की संभावना
  choice: अपने आपको दीन किया
  alternative: दीन किए गए / दब गए
  rationale: निफ़अल दोनों प्रकार का अर्थ दे सकता है, पर बुलावे को स्वीकार कर यरूशलेम आने की अगली क्रिया यहाँ स्वैच्छिक आत्म-दीनता को अधिक उपयुक्त बनाती है; किसी विशेष मत-सिद्धांत को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप। ‘दीन किया’ बाइबलीय संदर्भ में परिचित है और मूल की विनम्रता/अधीनता की गंभीरता बनाए रखता है।
