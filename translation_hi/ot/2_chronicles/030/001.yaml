id: 2CH.30.1
reference: 2 Chronicles 30:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יְחִזְקִיָּ֜הוּ עַל כָּל יִשְׂרָאֵ֣ל וִֽ/יהוּדָ֗ה וְ/גַֽם אִגְּרוֹת֙ כָּתַב֙ עַל אֶפְרַ֣יִם וּ/מְנַשֶּׁ֔ה לָ/ב֥וֹא לְ/בֵית יְהוָ֖ה בִּֽ/ירוּשָׁלִָ֑ם לַ/עֲשׂ֣וֹת פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/001.yaml
  text: Then Hezekiah sent word to all Israel and Judah[a], and also wrote letters to Ephraim and Manasseh, to come to the house of Yahweh in Jerusalem to keep the Passover to Yahweh[c][b], the God of Israel.
translation:
  language: hi
  text: फिर हिजकिय्याह ने सारे इस्राएल और यहूदा में[a] संदेश भेजा। उसने एप्रैम और मनश्शे को भी पत्र लिखे कि वे यरूशलेम में यहोवा के भवन में आएँ और इस्राएल के परमेश्वर यहोवा के लिए फसह मनाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारे इस्राएल और यहूदा को”; इब्रानी संबंधबोधक शब्द संदेश की दिशा या पूरे क्षेत्र में उसके प्रसार—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “फसह करें”; यह फसह पर्व का पालन करने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: मूल क्रिया का अर्थ ‘भेजना’ है; यहाँ लोगों/प्रदेशों की ओर भेजने के प्रसंग में संप्रेषित बुलावे को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना दूतों का अनावश्यक उल्लेख किए।
- source_word: עַל כָּל יִשְׂרָאֵל וִיהוּדָה
  choice: सारे इस्राएल और यहूदा में
  rationale: עַל यहाँ संदेश भेजने की दिशा अथवा भौगोलिक विस्तार बता सकता है। ‘में’ पूरे क्षेत्र में संदेश पहुँचाने का स्वाभाविक हिन्दी रूप है; वैकल्पिक व्यक्ति-केंद्रित अर्थ पादटिप्पणी में रखा गया है।
- source_word: אִגְּרוֹת כָּתַב
  choice: पत्र लिखे
  rationale: लिखित पत्राचार के लिए सीधा, आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: עַל אֶפְרַיִם וּמְנַשֶּׁה
  choice: एप्रैम और मनश्शे को
  rationale: यहाँ עַל पत्रों के लक्षित प्राप्तकर्ताओं अथवा उनके क्षेत्रों को सूचित करता है; ‘को’ हिन्दी में संबोधन को स्पष्ट रखता है।
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: यहोवा के भवन में आएँ
  rationale: ‘आना’ बुलावे का उद्देश्य व्यक्त करता है और ‘यहोवा का भवन’ मूल ‘YHWH का घर’ को बनाए रखता है, जबकि ‘मन्दिर’ की व्याख्यात्मक अदला-बदली नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि ‘प्रभु’ से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: לַעֲשׂוֹת פֶּסַח
  choice: फसह मनाएँ
  rationale: शाब्दिक ‘फसह करना/बनाना’ पर्व के विधिपूर्वक पालन का इब्रानी मुहावरा है; ‘फसह मनाना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहोवा के लिए
  rationale: לְ को समर्पण/हित के अर्थ में ‘के लिए’ दिया गया है और ‘इस्राएल के परमेश्वर’ को यहोवा के विशेषणात्मक परिचय के रूप में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही बनाए रखता है; इसे उपाधि से नहीं बदलता।
- issue: לַיהוָה में समर्पण का संबंध
  choice: यहोवा के लिए
  alternative: यहोवा को
  rationale: לְ दातृवाचक दिशा अथवा सम्मान/समर्पण दोनों व्यक्त कर सकता है। ‘के लिए’ हिन्दी में पर्व को यहोवा के सम्मान में मनाने का भाव स्वाभाविक रूप से देता है, पर किसी अतिरिक्त अनुष्ठानिक सिद्धान्त को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘भवन’ मूल रूपक को सुरक्षित रखता है, ‘फसह मनाना’ हिन्दी मुहावरे के अनुरूप है, और छोटे वाक्य-विभाजन से लंबी इब्रानी संरचना को स्पष्ट किया गया है।
