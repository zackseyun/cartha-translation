base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/005.yaml
  text: So they established a decree to send a proclamation throughout all Israel[a], from Beersheba to Dan, that they should come to keep the Passover to Yahweh, the God of Israel, at Jerusalem; for they had not kept it in great numbers as it is written.
translation:
  language: hi
  text: इसलिए उन्होंने यह आदेश दिया कि पूरे इस्राएल में, बेरशेबा से दान तक, यह घोषणा कराई जाए कि लोग यरूशलेम में इस्राएल के परमेश्वर याहवे के लिये फसह मनाने आएँ; क्योंकि उन्होंने उसे जैसा लिखा है वैसा बड़ी संख्या में नहीं मनाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: “क्योंकि बहुतों ने फसह नहीं मनाया था, जैसा लिखा है।” वाक्यांश या तो भाग लेनेवालों की कम संख्या पर, या लिखे हुए निर्देश के अनुरूप फसह न मनाए जाने पर बल दे सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמִידוּ דָבָר
  choice: उन्होंने यह आदेश दिया
  rationale: शाब्दिक अर्थ ‘किसी बात को स्थिर करना’ है; प्रसंग में यह शासकीय निर्णय या आदेश को प्रभावी करने का मुहावरा है।
- source_word: לְהַעֲבִיר קוֹל
  choice: यह घोषणा कराई जाए
  rationale: शाब्दिक रूप से ‘आवाज़ को फिराना’ पूरे क्षेत्र में किसी सार्वजनिक संदेश को प्रसारित कराने का बोध देता है।
- source_word: בְּכָל יִשְׂרָאֵל
  choice: पूरे इस्राएल में
  rationale: यह घोषणा के समूचे इस्राएली क्षेत्र में प्रसार को व्यक्त करता है।
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: बेरशेबा से दान तक
  rationale: दक्षिण से उत्तर तक पूरे देश को सूचित करने वाला भौगोलिक युग्म मूल रूप में रखा गया है।
- source_word: לָבוֹא לַעֲשׂוֹת פֶּסַח
  choice: आकर ... फसह मनाएँ
  rationale: ‘फसह करना’ उत्सव का पालन करने का मुहावरा है; ‘मनाएँ’ सहज आधुनिक हिन्दी है और आने के उद्देश्य को स्पष्ट करता है।
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर याहवे के लिए
  rationale: सम्बन्धवाचक संरचना को स्वाभाविक हिन्दी में रखा गया है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम
  rationale: ‘आकर’ के साथ गन्तव्य का अर्थ हिन्दी में बिना अलग परसर्ग के स्वाभाविक रूप से स्पष्ट है।
- source_word: כִּי לֹא לָרֹב עָשׂוּ כַּכָּתוּב
  choice: क्योंकि उन्होंने उसे लिखे हुए विधान के अनुसार बड़ी संख्या में नहीं मनाया था
  rationale: לָרֹב का प्राथमिक मात्रात्मक भाव ‘बहुतायत/बड़ी संख्या में’ रखा गया है। ‘लिखे हुए विधान’ से כַּכָּתוּב में निहित लिखित धार्मिक निर्देश स्पष्ट होता है, जबकि वाक्य की संक्षिप्तता से उत्पन्न अर्थगत तनाव पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिवाचक नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण ध्वन्यांकन है और वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- issue: अन्तिम उपवाक्य में संख्या और विधि का सम्बन्ध
  choice: सामूहिक रूप से बड़ी संख्या में न मनाए जाने को मुख्य पाठ में रखा
  alternative: बहुतों द्वारा लिखित विधान के अनुसार न मनाया जाना
  rationale: לָרֹב का स्वाभाविक अर्थ मात्रात्मक है, पर संक्षिप्त इब्रानी वाक्यरचना כַּכָּתוּב को सहभागियों की संख्या अथवा विधि-विधान के पालन से जोड़ने की गुंजाइश देती है; इसलिए वैकल्पिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी अपनाई गई है। ‘फसह’, ‘इस्राएल’, ‘यरूशलेम’ और ‘याहवे’ जैसे बाइबलीय नाम बनाए रखे गए हैं; प्रशासनिक भाषा को अनावश्यक रूप से शाब्दिक या पुरातन नहीं बनाया गया।
