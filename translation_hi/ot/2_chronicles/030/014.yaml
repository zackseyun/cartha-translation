language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּקֻ֕מוּ וַ/יָּסִ֨ירוּ֙ אֶת הַֽ/מִּזְבְּח֔וֹת אֲשֶׁ֖ר בִּ/ירוּשָׁלִָ֑ם וְ/אֵ֤ת כָּל הַֽ/מְקַטְּרוֹת֙ הֵסִ֔ירוּ וַ/יַּשְׁלִ֖יכוּ לְ/נַ֥חַל קִדְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/014.yaml
  text: They arose and removed the altars that were in Jerusalem[b][a], and they removed all the incense altars and threw them into the Kidron Valley.
translation:
  language: hi
  text: तब वे उठे और यरूशलेम में जो वेदियाँ थीं, उन्हें हटा दिया। उन्होंने धूप जलाने की सभी वेदियाँ[a] भी हटा दीं और उन्हें किद्रोन की घाटी[b] में फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धूप जलाने के सभी स्थान’ अथवा ‘धूपदान की सभी चौकियाँ।’ इब्रानी शब्द धूप जलाने से जुड़ी उपासना-संरचनाओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘किद्रोन का नाला/खड्ड/घाटी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: तब वे उठे
  rationale: קום का यह कथात्मक रूप निर्णायक कार्रवाई के आरम्भ को दिखाता है। ‘तब वे उठे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस कथात्मक गति को बनाए रखता है।
- source_word: וַיָּסִירוּ / הֵסִירוּ
  choice: हटा दिया / हटा दीं
  rationale: हिफ़ील में סור का अर्थ ‘हटाना’ है। हिन्दी में लिंग और वचन के अनुसार रूप बदलते हुए दोनों प्रयोगों में वही क्रिया रखी गई है।
- source_word: הַמִּזְבְּחוֹת
  choice: वेदियाँ
  rationale: מִזְבֵּחַ का सामान्य अर्थ वेदी है। प्रसंग से इनके अनधिकृत उपासना-स्थल होने का संकेत मिलता है, इसलिए मूल पाठ से अधिक विशिष्ट विशेषण नहीं जोड़ा गया।
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: यरूशलेम में जो ... थीं
  rationale: इब्रानी सम्बन्धवाचक उपवाक्य और वेदियों के स्थान, दोनों को स्पष्ट एवं स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: הַמְקַטְּרוֹת
  choice: धूप जलाने की ... वेदियाँ
  rationale: קטר से बना यह शब्द धूप जलाने से जुड़ी उपासना-संरचनाओं को सूचित करता है। ‘वेदियाँ’ प्रसंग में स्पष्ट है, पर शब्द की सम्भावित व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיַּשְׁלִיכוּ
  choice: फेंक दिया
  rationale: שׁלך बलपूर्वक फेंकने या डाल देने को व्यक्त करता है। ‘फेंक दिया’ सहज आधुनिक हिन्दी है और नष्ट करने के उद्देश्य से किए गए निपटान की तीव्रता रखता है।
- source_word: לְנַחַל קִדְרוֹן
  choice: किद्रोन की घाटी में
  rationale: נחל घाटी, खड्ड या मौसमी जलधारा का क्षेत्र हो सकता है। सामान्य पाठक के लिए ‘घाटी’ सुबोध है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
