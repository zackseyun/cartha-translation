language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם בִּ/יהוּדָ֗ה הָֽיְתָה֙ יַ֣ד הָ/אֱלֹהִ֔ים לָ/תֵ֥ת לָ/הֶ֖ם לֵ֣ב אֶחָ֑ד לַ/עֲשׂ֞וֹת מִצְוַ֥ת הַ/מֶּ֛לֶךְ וְ/הַ/שָּׂרִ֖ים בִּ/דְבַ֥ר יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/012.yaml
  text: Also in Judah the hand of God was on them to give them one heart to carry out the command of the king and the officials[a], according to the word of Yahweh.
translation:
  language: hi
  text: यहूदा में भी परमेश्वर का हाथ उन पर था, ताकि वह उन्हें एक मन[a] दे कि वे यहोवा के वचन के अनुसार राजा और अधिकारियों की आज्ञा का पालन करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘एक हृदय’; अर्थात एकजुट मन या संकल्प।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם בִּיהוּדָה
  choice: यहूदा में भी
  rationale: यह पद पिछले वर्णन में यहूदा को जोड़ता है; यह स्वाभाविक हिंदी में योगात्मक अर्थ और स्थानवाचक भाव दोनों रखता है।
- source_word: הָיְתָה יַד הָאֱלֹהִים
  choice: परमेश्वर का हाथ उन पर था
  rationale: मूल इब्रानी बिंब को बनाए रखते हुए यह परमेश्वर की सक्रिय सामर्थ्य और प्रभाव को व्यक्त करता है।
- source_word: לָתֵת לָהֶם
  choice: ताकि वह उन्हें ... दे
  rationale: उद्देश्यसूचक infinitive को स्पष्ट करता है और दैवी क्रिया को उसी रूप में रखता है।
- source_word: לֵב אֶחָד
  choice: एक मन
  rationale: शाब्दिक अर्थ ‘एक हृदय’ है, पर आधुनिक हिंदी में सामूहिक एकता और समान संकल्प के लिए ‘एक मन’ अधिक सहज है; मूल रूप का संकेत पादटिप्पणी में दिया गया है।
- source_word: לַעֲשׂוֹת מִצְוַת
  choice: आज्ञा का पालन करें
  rationale: आज्ञा को व्यवहार में पूरा करने का भाव आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַמֶּלֶךְ וְהַשָּׂרִים
  choice: राजा और अधिकारियों
  rationale: שָּׂרִים यहाँ प्रशासनिक अगुओं या पदाधिकारियों को सूचित करता है; ‘अधिकारी’ वर्तमान हिंदी में स्पष्ट है।
- source_word: בִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: यह राजा और अधिकारियों की आज्ञा का यहोवा के वचन के अनुरूप होना बताता है, केवल माध्यम नहीं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ‘परमेश्वर का हाथ उन पर था’ में दैवी क्रिया का स्वरूप
  choice: परमेश्वर की सक्रिय क्रिया से लोगों को एक मन मिलने का दृढ़ कथन
  alternative: इसे केवल ‘परमेश्वर ने उनकी सहायता की’ कहना, या इसे किसी विशिष्ट दार्शनिक अर्थ में अनिवार्य और अप्रतिरोध्य कारणता बताना
  rationale: इब्रानी पाठ एकता को स्पष्टतः परमेश्वर की सक्रियता से जोड़ता है, पर उस सक्रियता की आगे की सैद्धांतिक प्रणाली नहीं बताता; इसलिए कथन की शक्ति और उसकी सीमा दोनों रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर का हाथ’ मूल बिंब को सुरक्षित रखता है, जबकि ‘आज्ञा का पालन करें’ स्वाभाविक हिंदी में क्रियात्मक आज्ञाकारिता व्यक्त करता है।
