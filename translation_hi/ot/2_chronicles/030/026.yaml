  text: וַ/תְּהִ֥י שִׂמְחָֽה גְדוֹלָ֖ה בִּֽ/ירוּשָׁלִָ֑ם כִּ֠י מִ/ימֵ֞י שְׁלֹמֹ֤ה בֶן דָּוִיד֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל לֹ֥א כָ/זֹ֖את בִּ/ירוּשָׁלִָֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/030/026.yaml
  text: So there was great joy in Jerusalem, for since the days of Solomon son of David, king of Israel, there had been nothing like this in Jerusalem.
translation:
  language: hi
  text: इस प्रकार यरूशलेम में बड़ा आनन्द हुआ, क्योंकि दाऊद के पुत्र और इस्राएल के राजा सुलैमान के दिनों से यरूशलेम में ऐसा कुछ नहीं हुआ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: इस प्रकार ... हुआ
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाते हुए पिछले प्रसंग का परिणाम बताता है; ‘इस प्रकार’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׂמְחָה גְדוֹלָה
  choice: बड़ा आनन्द
  rationale: संज्ञा और विशेषण का सीधा अर्थ तीव्र तथा सामुदायिक आनन्द है; यह पद संक्षिप्त, गरिमापूर्ण और सहज है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב का स्थानवाचक अर्थ आधुनिक हिन्दी में ‘में’ से स्वाभाविक रूप से व्यक्त होता है; पद की पुनरावृत्ति भी इब्रानी के बलाघात के अनुसार रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: מִימֵי
  choice: के दिनों से
  rationale: यह अभिव्यक्ति अतीत के एक काल से वर्तमान प्रसंग तक की तुलनात्मक अवधि दर्शाती है।
- source_word: שְׁלֹמֹה בֶן דָּוִיד
  choice: दाऊद के पुत्र ... सुलैमान
  rationale: सम्बन्धवाचक रचना को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है और व्यक्तिनामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह सुलैमान की समानाधिकरण पहचान है; हिन्दी में इसे नाम से पहले रखना स्पष्ट और स्वाभाविक है।
- source_word: לֹא כָזֹאת
  choice: ऐसा कुछ नहीं हुआ था
  rationale: शाब्दिक अर्थ ‘ऐसा नहीं’ है; प्रसंग में निहित घटना को ‘हुआ’ से व्यक्त करना सहज हिन्दी है और तुलना का बल बनाए रखता है।
