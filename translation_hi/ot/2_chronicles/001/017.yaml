  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। व्यापारिक संदर्भ को स्पष्ट किया गया है, किंतु मूल की प्रति-इकाई कीमतें और अराम नाम सुरक्षित रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
