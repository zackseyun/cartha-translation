base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/017.yaml
  text: They imported from Egypt a chariot for six hundred shekels of silver[a], and a horse for one hundred fifty[c][b]; and so they exported them to all the kings of the Hittites and the kings of Aram.
translation:
  language: hi
  text: वे मिस्र से एक रथ छह सौ शेकेल चाँदी में और एक घोड़ा डेढ़ सौ शेकेल चाँदी में मंगवाते थे; और इसी तरह वे उनके हाथों से[a] उन्हें हित्तियों के सभी राजाओं और अराम के राजाओं तक पहुँचाते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “उनके हाथ से” है, अर्थात उनके माध्यम से या उनके एजेंटों के द्वारा।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “अराम”; परंपरागत अनुवादों में “सीरिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲלוּ וַיּוֹצִיאוּ מִמִּצְרַיִם
  choice: वे मिस्र से ... मँगवाते थे
  rationale: दोनों गति-सूचक क्रियाएँ व्यापारिक संदर्भ में मिस्र से माल बाहर लाकर आयात करने का भाव देती हैं। हिंदी में 'मँगवाते थे' स्वाभाविक है और अपूर्ण भूतकाल नियमित व्यापार को व्यक्त करता है।
- source_word: מֶרְכָּבָה
  choice: एक रथ
  rationale: एक वस्तु की प्रति-इकाई कीमत बताई गई है; इसलिए एकवचन रखा गया है।
- source_word: בְּשֵׁשׁ מֵאוֹת כֶּסֶף
  choice: छह सौ शेकेल चाँदी में
  rationale: मूल में केवल 'छह सौ चाँदी' है; प्राचीन भार-मुद्रा की निहित इकाई 'शेकेल' स्पष्टता के लिए जोड़ी गई है।
- source_word: וְסוּס בַּחֲמִשִּׁים וּמֵאָה
  choice: और एक घोड़ा डेढ़ सौ शेकेल चाँदी में
  rationale: '''घोड़ा'' सामान्य अर्थ है। पिछले मूल्य-वाक्य से निहित शेकेल और चाँदी को हिंदी में स्पष्टता के लिए दोहराया गया है।'
- source_word: וְכֵן
  choice: और इसी तरह
  rationale: यह उसी व्यापारिक प्रक्रिया के अगले चरण को जोड़ता है।
- source_word: לְכָל מַלְכֵי הַחִתִּים וּמַלְכֵי אֲרָם
  choice: हित्तियों के सभी राजाओं और अराम के राजाओं को
  rationale: जातीय नाम और स्थान-नाम मूल के अनुरूप रखे गए हैं; אֲרָם को बाद के नाम 'सीरिया' से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיָדָם יוֹצִיאוּ
  choice: उनके व्यापारी उन्हें ... पहुँचाते थे
  rationale: '''उनके हाथ से'' एजेंसी का इब्रानी मुहावरा है। निकटवर्ती संदर्भ (पद 16) के व्यापारियों को स्पष्ट करते हुए हिंदी में स्वाभाविक व्यावसायिक आपूर्ति का भाव दिया गया है।'
