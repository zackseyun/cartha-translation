source:
  edition: WLC
  text: עַתָּ֗ה חָכְמָ֤ה וּ/מַדָּע֙ תֶּן לִ֔/י וְ/אֵֽצְאָ֛ה לִ/פְנֵ֥י הָֽ/עָם הַ/זֶּ֖ה וְ/אָב֑וֹאָה כִּֽי מִ֣י יִשְׁפֹּ֔ט אֶת עַמְּ/ךָ֥ הַ/זֶּ֖ה הַ/גָּדֽוֹל־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/010.yaml
  text: Now give me wisdom and knowledge[a], so that I may go out and come in before this people[b], for who can judge this great people of yours?
translation:
  language: hi
  text: अब मुझे बुद्धि और ज्ञान दे, ताकि इस प्रजा के आगे मेरा आना-जाना हो[a]; क्योंकि तेरी इस महान प्रजा[b] का न्याय कौन कर सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रजा के आगे आना-जाना’ सार्वजनिक रूप से अगुवाई और शासन करने का हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या ‘विशाल प्रजा’; हिब्रू शब्द संख्या या आकार की विशालता और महत्त्व—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह सुलैमान की विनती का आरम्भ करने वाला स्वाभाविक काल-सूचक शब्द है।
- source_word: חָכְמָה וּמַדָּע
  choice: बुद्धि और ज्ञान
  rationale: दोनों अलग हिब्रू संज्ञाओं को अलग रखते हुए राजकीय और न्यायिक योग्यता का भाव सुरक्षित रहता है।
- source_word: תֶּן לִי
  choice: मुझे ... दे
  rationale: आज्ञार्थक क्रिया का सीधा और सहज हिन्दी रूप।
- source_word: וְאֵצְאָה ... וְאָבוֹאָה לִפְנֵי הָעָם הַזֶּה
  choice: ताकि इस प्रजा के आगे मेरा आना-जाना हो
  rationale: हिब्रू के ‘निकलना और आना’ वाले नेतृत्व-सूचक मुहावरे तथा ‘प्रजा के आगे’ की छवि को अपेक्षाकृत स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִי יִשְׁפֹּט
  choice: न्याय कौन कर सकता है
  rationale: יִשְׁפֹּט का मूल न्यायिक अर्थ सुरक्षित है, जबकि ‘कर सकता है’ प्रश्न में निहित सामर्थ्य की असमर्थता को व्यक्त करता है।
- source_word: עַמְּךָ הַזֶּה הַגָּדוֹל
  choice: तेरी इस महान प्रजा
  rationale: ईश्वर को किए गए एकवचन सम्बोधन, संकेतवाचक ‘इस,’ और גָּדוֹל के व्यापक ‘महान’ अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: सुलैमान की राजकीय नेतृत्व-भूमिका को व्यक्त करने वाला मुहावरा
  choice: ‘इस प्रजा के आगे मेरा आना-जाना हो’ के रूप में मूल छवि बनाए रखी गई।
  alternative: ‘मैं इस प्रजा की अगुवाई कर सकूँ’ या ‘मैं इस प्रजा पर शासन कर सकूँ।’
  rationale: स्पष्ट व्याख्यात्मक विकल्प अर्थ बताते हैं, पर मूल पाठ की गतिशील छवि को मिटा देते हैं; मुख्य पाठ और पादटिप्पणी साथ मिलकर अर्थ को स्पष्ट रखते हैं।
- issue: גָּדוֹל का अर्थ
  choice: महान
  alternative: विशाल
  rationale: यह शब्द संख्या/आकार और महत्त्व दोनों का संकेत दे सकता है; ‘महान’ व्यापक अर्थ को बनाए रखता है और पादटिप्पणी दूसरा सम्भव बल बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सीधा स्वर रखा गया है। राजकीय सन्दर्भ में ‘लोगों’ के बजाय ‘प्रजा’ और न्यायिक क्रिया के लिए ‘न्याय करना’ चुना गया है। ईश्वर के लिए एकवचन ‘तेरी’ मूल सम्बोधन के निकट और हिन्दी बाइबिलीय शैली में स्वाभाविक है।
