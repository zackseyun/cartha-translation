  text: וַ/יֹּ֤אמֶר שְׁלֹמֹה֙ לֵֽ/אלֹהִ֔ים אַתָּ֗ה עָשִׂ֛יתָ עִם דָּוִ֥יד אָבִ֖/י חֶ֣סֶד גָּד֑וֹל וְ/הִמְלַכְתַּ֖/נִי תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/008.yaml
  text: And Solomon said to God[a], “You have shown great covenant faithfulness to David my father, and you have made me king in his place.”
translation:
  language: hi
  text: तब सुलैमान ने परमेश्वर से कहा, “आपने मेरे पिता दाऊद के प्रति महान अटल प्रेम[a] दिखाया है और उनके स्थान पर मुझे राजा बनाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महान वाचा-निष्ठा” अथवा “बड़ी कृपा।” इब्रानी शब्द חֶסֶד में प्रायः अटल प्रेम, दया और वाचा अथवा संबंध के प्रति निष्ठा का भाव होता है।
    reason: חֶסֶד की अर्थ-व्याप्ति और वाचागत संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; आधुनिक हिन्दी कथा में ‘तब’ स्वाभाविक है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर से
  rationale: यहाँ אֱלֹהִים उस एक परमेश्वर के लिए है जिसे सुलैमान संबोधित करता है; ‘परमेश्वर से कहा’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: עָשִׂיתָ עִם ... חֶסֶד גָּדוֹל
  choice: के प्रति महान अटल प्रेम दिखाया है
  rationale: חֶסֶד में प्रेम, कृपा और संबंध अथवा वाचा के प्रति स्थिर निष्ठा के परस्पर जुड़े भाव हैं। ‘अटल प्रेम’ मूल की स्थायित्वपूर्ण संबंधपरकता को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी इसकी वाचागत निष्ठा और दया वाली संभावनाएँ स्पष्ट करती है।
- source_word: דָּוִיד אָבִי
  choice: मेरे पिता दाऊद
  rationale: यह हिन्दी में स्वाभाविक है और पारिवारिक संबंध को स्पष्ट रखता है।
- source_word: וְהִמְלַכְתַּנִי
  choice: और ... मुझे राजा बनाया है
  rationale: מלך का हिफ़ील रूप राज करने का कारण बनने अथवा राजा बनाने का भाव देता है; यह अनुवाद परमेश्वर की कर्तृता स्पष्ट रखता है।
- source_word: תַּחְתָּיו
  choice: उनके स्थान पर
  rationale: राजकीय उत्तराधिकार के संदर्भ में इसका अर्थ किसी के स्थान पर होना है; ‘उनके स्थान पर’ बलपूर्वक हटाए जाने का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: दाऊद के संदर्भ में חֶסֶד का अनुवाद
  choice: महान अटल प्रेम
  alternative: महान वाचा-निष्ठा; बड़ी कृपा
  rationale: दाऊद के साथ परमेश्वर के संबंध में वाचागत आयाम मौजूद है, पर חֶסֶד को केवल अमूर्त ‘निष्ठा’ कहना उसके प्रेम और कृपा के आयाम को संकुचित कर सकता है। ‘अटल प्रेम’ मुख्य पाठ में व्यापक अर्थ बनाए रखता है और पादटिप्पणी वाचागत निष्ठा को स्पष्ट करती है।
- issue: राजकीय उत्तराधिकार में परमेश्वर की कर्तृता
  choice: उनके स्थान पर मुझे राजा बनाया है
  alternative: उनके बाद मुझे राज्य करने दिया है
  rationale: हिफ़ील क्रिया की कारक शक्ति को स्पष्ट रखते हुए यह नहीं कहा गया कि परमेश्वर ने केवल अनुमति दी; साथ ही ‘स्थान पर’ उत्तराधिकार का मूल भाव रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ और ‘उनके’ का प्रयोग किया गया है। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है; ‘अटल प्रेम’ सहज बोधगम्य है और पादटिप्पणी मूल शब्द की धर्मवैचारिक गहराई सुरक्षित रखती है।
