base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/001.yaml
  text: And Solomon son of David strengthened himself over his kingdom[b][a], and Yahweh his God was with him and made him exceedingly great.
translation:
  language: hi
  text: दाऊद का पुत्र सुलैमान अपने राज्य पर दृढ़ता से स्थापित हुआ[a]। याहवे, उसका परमेश्वर, उसके साथ था और उसने उसे अत्यन्त महान बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने राज्य पर सशक्त हुआ” अथवा “अपने राज्य पर अपना अधिकार दृढ़ किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: अपने को दृढ़ किया
  rationale: हित्पएल रूप आत्मवाचक या अकर्मक अर्थ देता है। ‘अपने को दृढ़ किया’ सुलैमान की सक्रियता को बनाए रखता है, जबकि ‘दृढ़ हो गया’ भी सम्भव है।
- source_word: עַל מַלְכוּתוֹ
  choice: अपने राज्य पर
  rationale: עַל अधिकार या प्रभुत्व का भाव देता है; ‘अपने राज्य पर’ इब्रानी रूपक को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम YHWH का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: אֱלֹהָיו
  choice: उसका परमेश्वर
  rationale: यह सीधा संबंधवाचक विन्यास है और सुलैमान तथा परमेश्वर के व्यक्तिगत संबंध को व्यक्त करता है।
- source_word: עִמּוֹ
  choice: उसके साथ था
  rationale: यह ईश्वरीय उपस्थिति और अनुग्रह की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וַיְגַדְּלֵהוּ
  choice: उसे ... महान बनाया
  rationale: 'גדל के पिएल रूप और कर्म-प्रत्यय का कारणवाचक अर्थ सुरक्षित है: परमेश्वर ने सुलैमान को महान बनाया।'
- source_word: לְמָעְלָה
  choice: अत्यन्त
  rationale: यहाँ यह क्रियाविशेषणात्मक तीव्रतासूचक है; ‘अत्यन्त’ सहज हिन्दी में उच्च मात्रा व्यक्त करता है।
- source_word: בֶן דָּוִיד
  choice: दाऊद के पुत्र
  rationale: शाब्दिक पुत्र-संबंध और इतिहासकार द्वारा प्रमुख बनाए गए राजवंशीय संबंध, दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण नाम को उपाधि से बदले बिना सुरक्षित रखता है।
- issue: सुलैमान की उन्नति में कर्तृत्व
  choice: सुलैमान के आत्मवाचक दृढ़ होने और परमेश्वर द्वारा उसे महान बनाए जाने—दोनों को बनाए रखना
  alternative: पहले खंड को केवल कर्मवाच्य ‘दृढ़ किया गया’ या व्याख्यात्मक ‘राज्य में स्थापित हुआ’ कहना
  rationale: इब्रानी पाठ एक ओर सुलैमान की सक्रियता और दूसरी ओर याहवे की उपस्थिति तथा कारणकारी कार्य रखता है; अनुवाद इस तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘अपने राज्य पर अपने को दृढ़ किया’ कुछ औपचारिक है, पर मूल के आत्मवाचक भाव और עַל के प्रभुत्व-संबंध को सुरक्षित रखता है।
