  terminology: ‘परमेश्वर’ appropriately renders אֱלֹהִים in this singular theophany context. ‘सुलैमान’ is the established Hindi biblical form. The direct-address forms ‘माँग’ and ‘तुझे’ suit the narrative’s direct divine speech without being disrespectful.
