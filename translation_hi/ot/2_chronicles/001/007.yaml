base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/007.yaml
  text: That night God appeared to Solomon and said to him[a], “Ask what I should give you.”
translation:
  language: hi
  text: उस रात परमेश्वर सुलैमान को दिखाई दिया और उससे कहा, “माँग कि मैं तुझे क्या दूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: यह स्वाभाविक आधुनिक हिन्दी में उसी निश्चित रात का संकेत देता है और इब्रानी के कालवाचक अर्थ को सुरक्षित रखता है।
- source_word: נִרְאָה
  choice: दिखाई दिया
  rationale: निफ़अल रूप यहाँ दिव्य दर्शन के प्रसंग में ‘प्रकट हुआ/दिखाई दिया’ का अर्थ देता है। ‘दिखाई दिया’ सहज है और ‘अपने को प्रकट किया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: शब्द के साथ क्रिया एकवचन है और प्रसंग इस्राएल के एक परमेश्वर को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לִשְׁלֹמֹה
  choice: सुलैमान को
  rationale: ל यहाँ उस व्यक्ति को चिह्नित करता है जिसके सामने परमेश्वर दिखाई दिया।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: यह इब्रानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: שְׁאַל
  choice: माँग
  rationale: इस प्रसंग में आज्ञार्थक क्रिया इच्छित वर या वस्तु माँगने का खुला निमंत्रण है; ‘माँग’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מָה אֶתֶּן לָךְ
  choice: मैं तुझे क्या दूँ?
  rationale: यह इब्रानी शब्दक्रम और प्रत्यक्ष प्रश्न की शक्ति को निकटता से सुरक्षित रखता है। ‘तुझे’ एक राजकीय व्यक्ति से परमेश्वर के सीधे संबोधन में स्वाभाविक है और असम्मानसूचक नहीं।
theological_decisions:
- issue: दिव्य दर्शन के प्रसंग में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवता
  rationale: एकवचन क्रिया और कथानक का संदर्भ एक ही परमेश्वर को स्पष्ट करते हैं; बहुवचन या अनिश्चित अर्थ यहाँ स्रोत-पाठ के व्याकरण के अनुरूप नहीं है।
- issue: נִרְאָה में आत्म-प्रकाशन की व्याख्या
  choice: दिखाई दिया
  alternative: अपने को प्रकट किया
  rationale: चुना हुआ रूप घटना को व्यक्त करता है, पर यह निर्धारित नहीं करता कि दर्शन किस रीति से हुआ; इससे पाठ की संक्षिप्तता और संभावित अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। परमेश्वर के सुलैमान से सीधे संबोधन में ‘तुझे’ और ‘माँग’ निकट तथा स्वाभाविक हैं; भाषा न तो अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की अनौपचारिकता लिए हुए।
