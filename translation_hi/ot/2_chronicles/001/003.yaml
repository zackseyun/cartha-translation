  edition: WLC
  text: וַ/יֵּלְכ֗וּ שְׁלֹמֹה֙ וְ/כָל הַ/קָּהָ֣ל עִמּ֔/וֹ לַ/בָּמָ֖ה אֲשֶׁ֣ר בְּ/גִבְע֑וֹן כִּי שָׁ֣ם הָיָ֗ה אֹ֤הֶל מוֹעֵד֙ הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר עָשָׂ֛ה מֹשֶׁ֥ה עֶֽבֶד יְהוָ֖ה בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/003.yaml
  text: So Solomon and all the assembly with him went to the high place that was at Gibeon[a], because the tent of meeting of God was there, which Moses the servant of Yahweh had made in the wilderness.
translation:
  language: hi
  text: सुलैमान और उसके साथ की सारी सभा गिबोन के उस ऊँचे स्थान पर गए[a], क्योंकि परमेश्वर का मिलाप का तंबू वहाँ था, जिसे याहवे के सेवक मूसा ने निर्जन प्रदेश में बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए कि परमेश्वर का मिलाप का तंबू वहाँ था।”
    reason: इब्रानी כִּי कारण बताता है; ‘क्योंकि’ के स्थान पर ‘इसलिए कि’ एक स्वाभाविक हिंदी विकल्प है।
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: गई
  rationale: यह क्रिया कथा की अगली मुख्य घटना बताती है। संयुक्त कर्ता के बावजूद हिंदी में निकटवर्ती मुख्य संज्ञा ‘सभा’ के अनुसार स्त्रीलिंग एकवचन रूप स्वाभाविक है।
- source_word: הַקָּהָל
  choice: सारी सभा
  rationale: यह एकत्र समुदाय को दर्शाता है; ‘सभा’ आधुनिक हिंदी में स्पष्ट है और सामूहिक भाव बनाए रखता है।
- source_word: לַבָּמָה
  choice: ऊँचे स्थान पर
  rationale: במה उपासना के लिए प्रयुक्त ऊँचे स्थान को दर्शाता है। अनुवाद इस प्रसंग में उस स्थान को अपने आप अनुचित नहीं ठहराता।
- source_word: בְּגִבְעוֹן
  choice: गिबोन में स्थित
  rationale: स्थाननाम का लिप्यंतरण किया गया है और संबंधवाचक वाक्यांश को स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सुलैमान के वहाँ जाने का कारण प्रस्तुत करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्रस्थान के लिए प्रचलित और साधारण पाठकों के लिए पहचाना जाने वाला हिंदी पद है, जहाँ परमेश्वर और उसकी प्रजा के मिलने का भाव है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर का
  rationale: इब्रानी संबंध-रचना को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עָשָׂה
  choice: बनाया था
  rationale: पूर्णभूत रूप बताता है कि मूसा द्वारा तंबू बनाया जाना मुख्य घटना से पहले हुआ था।
- source_word: עֶבֶד יְהוָה
  choice: याहवे के सेवक
  rationale: मूसा के सम्मानसूचक पद में עֶבֶד के लिए ‘सेवक’ स्वाभाविक है और विश्वासयोग्य सेवा का भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से बाहर के वीरान भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिंदी में स्पष्ट है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: मंदिर बनने से पहले वैध उपासना के प्रसंग में במה का अनुवाद
  choice: ऊँचा स्थान
  alternative: पूजा-स्थान; पहाड़ी मंदिर
  rationale: शब्द का सीधा अर्थ रखा गया है और इस प्रसंग में उस स्थान पर नकारात्मक धार्मिक निर्णय नहीं थोपा गया।
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: אֹהֶל מוֹעֵד का हिंदी रूप
  choice: मिलापवाला तंबू
  alternative: भेंट का तंबू; मिलने का तंबू
  rationale: प्रचलित पवित्रस्थान-संज्ञा को रखा गया है, पर इसे बलि की ‘भेंट’ तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘ऊँचा स्थान’ और ‘मिलापवाला तंबू’ जैसी प्रमुख बाइबलीय संज्ञाएँ बिना अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखी गई हैं।
