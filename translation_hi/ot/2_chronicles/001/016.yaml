base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/016.yaml
  text: And the source of Solomon’s horses was Egypt and Kue[b][a], and the king’s merchants would obtain them from Kue for a price.
translation:
  language: hi
  text: सुलैमान के घोड़ों का स्रोत मिस्र और कूए[a] था, और राजा के व्यापारी उन्हें कूए से दाम देकर प्राप्त करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मिस्र और किसी संग्रह-स्थान से।” इब्रानी शब्द מִקְוֵא कठिन है; इसे स्थान-नाम “कूए” के बजाय संग्रह या भंडार के स्थान के अर्थ में भी समझा गया है। इस समझ के अनुसार अंतिम वाक्यांश का अर्थ हो सकता है: “राजा के व्यापारी उन्हें संग्रह-स्थान से दाम देकर प्राप्त करते थे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וּמוֹצָא
  choice: से आते थे
  rationale: यह शब्द घोड़ों के निकलने के स्थान, उद्गम या स्रोत को सूचित करता है। हिंदी में व्यापार के इस संदर्भ में ‘से आते थे’ स्वाभाविक ढंग से स्रोत का भाव व्यक्त करता है।
- source_word: הַסּוּסִים אֲשֶׁר לִשְׁלֹמֹה
  choice: सुलैमान के घोड़े
  rationale: לִשְׁלֹמֹה यहाँ स्वामित्व या संबंध बताता है; ‘सुलैमान के घोड़े’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र
  rationale: स्थान-नाम का प्रचलित हिंदी रूप।
- source_word: וּמִקְוֵא / מִקְוֵא
  choice: और कूए / कूए से
  rationale: संदर्भ और समानांतर व्यापार-वर्णन के आधार पर कठिन पद מִקְוֵא को दोनों बार स्थान-नाम ‘कूए’ माना गया है; वैकल्पिक जातिवाचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: סֹחֲרֵי הַמֶּלֶךְ
  choice: राजा के व्यापारी
  rationale: व्यापारिक संदर्भ में संज्ञा की तरह प्रयुक्त कृदंत का स्पष्ट और सामान्य हिंदी अनुवाद।
- source_word: יִקְחוּ
  choice: प्राप्त करते थे
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर यहाँ व्यापारिक लेन-देन में ‘प्राप्त करना’ उपयुक्त है और क्रिया को अनावश्यक रूप से केवल ‘खरीदना’ तक सीमित नहीं करता।
- source_word: בִּמְחִיר
  choice: दाम देकर
  rationale: यह भुगतान के बदले वस्तु प्राप्त करने का भाव बताता है; ‘दाम देकर’ सहज आधुनिक हिंदी है।
