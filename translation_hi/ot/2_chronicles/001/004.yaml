base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/004.yaml
  text: But David had brought up the ark of God from Kiriath-jearim to the place David had prepared for it[a], for he had pitched a tent for it in Jerusalem.
translation:
  language: hi
  text: परन्तु दाऊद परमेश्वर के सन्दूक को किर्यत-यारीम से उस स्थान पर ले आया था, जो उसने उसके लिए तैयार किया था[a], क्योंकि उसने उसके लिए यरूशलेम में एक तम्बू खड़ा किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जहाँ दाऊद ने उसके लिए तैयार किया था”; इब्रानी अभिव्यक्ति संक्षिप्त है और आशय उस स्थान से है जिसे दाऊद ने सन्दूक के लिए तैयार किया था।
    reason: lexical_alternative
