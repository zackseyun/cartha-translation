- source_word: הֶעֱלָה
  choice: ले आया था
  rationale: हिफ़ील रूप यहाँ सन्दूक को एक स्थान से दूसरे स्थान तक लाने का बोध देता है; पूर्णभूत काल पूर्व में हो चुकी घटना को स्पष्ट करता है।
- source_word: מִקִּרְיַת יְעָרִים
  choice: किर्यत-यारीम से
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखते हुए מִן का अर्थ ‘से’ व्यक्त किया गया है।
- source_word: בַּהֵכִין לוֹ דָוִיד
  choice: उस स्थान पर जिसे उसने उसके लिए तैयार किया था
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त है और तैयार किए गए गंतव्य का संकेत देती है; ‘स्थान’ जोड़ने से अर्थ सहज होता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: अगला उपवाक्य उस स्थान को तैयार करने की व्याख्या करता है।
- source_word: נָטָה לוֹ אֹהֶל
  choice: उसने उसके लिए एक तम्बू खड़ा किया था
  rationale: נטה और אֹהֶל का संयुक्त अर्थ तम्बू लगाना या खड़ा करना है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह स्थानवाचक पूर्वसर्ग सहित मानक हिन्दी लिप्यंतरण है।
