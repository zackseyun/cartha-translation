  text: וַ/יֹּ֣אמֶר אֱלֹהִ֣ים לִ/שְׁלֹמֹ֡ה יַ֣עַן אֲשֶׁר֩ הָיְתָ֨ה זֹ֜את עִם לְבָבֶ֗/ךָ וְ/לֹֽא שָׁ֠אַלְתָּ עֹ֣שֶׁר נְכָסִ֤ים וְ/כָבוֹד֙ וְ/אֵת֙ נֶ֣פֶשׁ שֹׂנְאֶ֔י/ךָ וְ/גַם יָמִ֥ים רַבִּ֖ים לֹ֣א שָׁאָ֑לְתָּ וַ/תִּֽשְׁאַל לְ/ךָ֙ חָכְמָ֣ה וּ/מַדָּ֔ע אֲשֶׁ֤ר תִּשְׁפּוֹט֙ אֶת עַמִּ֔/י אֲשֶׁ֥ר הִמְלַכְתִּ֖י/ךָ עָלָֽי/ו־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/011.yaml
  text: And God said to Solomon[a], “Because this was in your heart, and you did not ask for wealth, possessions, or honor, or for the life of those who hate you, nor did you ask for many days, but asked for wisdom and knowledge for yourself[b], that you might judge my people over whom I have made you king,”
translation:
  language: hi
  text: तब परमेश्वर ने सुलैमान से कहा, “क्योंकि यह बात तेरे मन में थी, और तूने न तो धन-संपत्ति और आदर माँगा, न तुझसे बैर रखने वालों का प्राण[a], और न ही बहुत दिनों की आयु[b] माँगी, बल्कि अपने लिए बुद्धि और ज्ञान माँगा, ताकि तू मेरी उस प्रजा का न्याय करे, जिसके ऊपर मैंने तुझे राजा बनाया है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे शत्रुओं का जीवन”; शाब्दिक रूप से “तुझसे बैर रखने वालों का प्राण।”
    reason: lexical_alternative
  - marker: b
    text: या “लंबी आयु”; शाब्दिक रूप से “बहुत दिन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह परमेश्वर के उत्तर का कारण बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָיְתָה זֹאת עִם לְבָבֶךָ
  choice: यह बात तेरे मन में थी
  rationale: हृदय के भीतर की अभिलाषा या मंशा का संकेत देता है; हिन्दी में ‘मन में’ मूल भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹשֶׁר נְכָסִים
  choice: धन-संपत्ति
  rationale: दोनों निकटवर्ती शब्दों—धन और भौतिक मिल्कियत—का संक्षिप्त किन्तु स्पष्ट हिन्दी युग्म है।
- source_word: כָבוֹד
  choice: आदर
  rationale: राजकीय प्रतिष्ठा और सम्मान के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נֶפֶשׁ שֹׂנְאֶיךָ
  choice: अपने बैरियों का प्राण
  rationale: एकवचन ‘प्राण/जीवन’ और ‘घृणा करने वालों’ के शत्रुतापूर्ण अर्थ को निकटता से रखता है; मुहावरे का आशय उनके प्राण लिए जाने से है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों की आयु
  rationale: मूल के ‘बहुत दिन’ को बनाए रखते हुए हिन्दी में माँगी जाने वाली दीर्घ आयु का आशय स्पष्ट करता है।
- source_word: חָכְמָה וּמַדָּע
  choice: बुद्धि और ज्ञान
  rationale: दोनों अलग संकल्पनाओं को बनाए रखता है और प्रचलित, सुबोध हिन्दी देता है।
- source_word: אֲשֶׁר תִּשְׁפּוֹט
  choice: ताकि तू … न्याय करे
  rationale: प्रयोजन का भाव व्यक्त करता है और שׁפט के न्याय करने वाले मूल अर्थ को शासन मात्र में विलीन नहीं करता।
- source_word: הִמְלַכְתִּיךָ עָלָיו
  choice: जिस पर मैंने तुझे राजा बनाया है
  rationale: परमेश्वर द्वारा सुलैमान को प्रजा के ऊपर राजा नियुक्त करने का अर्थ सीधे बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय वक्ता אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: यहाँ אֱלֹהִים है, यहोवा नाम नहीं; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट और सम्मानपूर्ण है।
- issue: राजकीय कार्य में שׁפט का अर्थ
  choice: न्याय करे
  alternative: शासन करे
  rationale: राजा के शासन का संदर्भ उपस्थित है, फिर भी मूल क्रिया विशेष रूप से न्याय करने को व्यक्त करती है; इसलिए व्यापक ‘शासन’ से इसे बदलना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ऐतिहासिक राजकीय संबोधन में एकवचन ‘तू/तेरे’ रखा गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
