source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֣ה לְ/כָל יִשְׂרָאֵ֡ל לְ/שָׂרֵי֩ הָ/אֲלָפִ֨ים וְ/הַ/מֵּא֜וֹת וְ/לַ/שֹּֽׁפְטִ֗ים וּ/לְ/כֹ֛ל נָשִׂ֥יא לְ/כָל יִשְׂרָאֵ֖ל רָאשֵׁ֥י הָ/אָבֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/002.yaml
  text: And Solomon spoke to all Israel—to the commanders of thousands and of hundreds[a], to the judges, and to every leader in all Israel[b], the heads of the fathers’ houses.
translation:
  language: hi
  text: सुलैमान ने समस्त इस्राएल को—हज़ारों और सैकड़ों के प्रधानों को, न्यायियों को, और समस्त इस्राएल के प्रत्येक अगुवे को, पितृकुलों के मुखियाओं को—संबोधित किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: बात की
  rationale: क्रिया का मूल अर्थ ‘कहा’ है, पर अनेक संबोधित समूहों के साथ यहाँ सार्वजनिक रूप से ‘बात की’ स्वाभाविक हिंदी है।
- source_word: לְכָל יִשְׂרָאֵל
  choice: समस्त इस्राएल से
  rationale: राष्ट्रीय समुदाय के सामूहिक अर्थ को बनाए रखता है; संबोधन के साथ हिंदी में ‘से’ स्वाभाविक है।
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: हज़ारों और सैकड़ों के प्रधानों
  rationale: שָׂרֵי के प्रशासनिक या सैनिक नेतृत्वार्थ को ‘प्रधान’ व्यक्त करता है और इकाइयों की मूल संख्यात्मक अभिव्यक्ति सुरक्षित रहती है।
- source_word: וְלַשֹּׁפְטִים
  choice: न्यायियों
  rationale: यह शׁפט से बने स्थापित प्रशासनिक पद का सीधा और स्पष्ट अनुवाद है।
- source_word: וּלְכֹל נָשִׂיא
  choice: प्रत्येक अगुवे
  rationale: נָשִׂיא के व्यापक नेतृत्वार्थ को व्यक्त करता है और आधुनिक हिंदी में ‘राजकुमार’ जैसे भ्रामक राजवंशीय अर्थ से बचता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखियाओं
  rationale: पैतृक वंश पर आधारित सामाजिक-प्रशासनिक समूहों का ऐतिहासिक अर्थ बनाए रखते हुए हिंदी में सुबोध है।
theological_decisions:
- issue: הָאָבוֹת में निहित पितृवंशीय सामाजिक अभिव्यक्ति
  choice: पितृकुलों
  alternative: वंशों / परिवारों
  rationale: मूल के पुरुष-चिह्नित ऐतिहासिक सामाजिक ढाँचे को सामान्यीकृत किए बिना सुरक्षित रखता है; यहाँ कोई विशिष्ट सांप्रदायिक अर्थ आरोपित नहीं किया गया।
- issue: רָאשֵׁי הָאָבוֹת का पूर्ववर्ती נָשִׂיא से संबंध
  choice: ‘अर्थात्’ द्वारा समानाधिकरण
  alternative: इसे सूची का एक अलग अतिरिक्त वर्ग मानना
  rationale: इब्रानी में संयोजक के अभाव और वाक्य-संरचना के आधार पर इसे ‘प्रत्येक अगुवे’ की व्याख्या के रूप में लेना अधिक स्वाभाविक है, यद्यपि अलग वर्ग की संभावना पूर्णतः असंभव नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘समस्त इस्राएल’ सामूहिक राष्ट्रीय पद को बनाए रखता है; ‘पितृकुल’ ऐतिहासिक सामाजिक संरचना को संक्षिप्त और सुबोध रूप में व्यक्त करता है।
