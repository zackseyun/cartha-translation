  text: וַ/יֶּאֱסֹ֣ף שְׁלֹמֹה֮ רֶ֣כֶב וּ/פָרָשִׁים֒ וַֽ/יְהִי ל֗/וֹ אֶ֤לֶף וְ/אַרְבַּע מֵאוֹת֙ רֶ֔כֶב וּ/שְׁנֵים עָשָׂ֥ר אֶ֖לֶף פָּרָשִׁ֑ים וַ/יַּנִּיחֵ/ם֙ בְּ/עָרֵ֣י הָ/רֶ֔כֶב וְ/עִם הַ/מֶּ֖לֶךְ בִּ/ירֽוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/014.yaml
  text: And Solomon gathered chariots and horsemen[a], and he had 1,400 chariots and 12,000 horsemen[b]; and he stationed them in the chariot cities and with the king in Jerusalem.
translation:
  language: hi
  text: सुलैमान ने रथ और घुड़सवार[a] इकट्ठे किए। उसके पास 1,400 रथ और 12,000 घुड़सवार थे। उसने उन्हें रथों के नगरों[b] में और यरूशलेम में राजा के साथ तैनात किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घुड़सवार सेना।” इब्रानी शब्द घोड़ों पर सवार लोगों को दर्शाता है; “घुड़सवार” अधिक सीधा अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसे निर्धारित नगर जहाँ रथ रखे जाते थे या रथ-दल तैनात रहता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठे किए
  rationale: אסף का सामान्य अर्थ इकट्ठा करना या जमा करना है। सैन्य साधनों और लोगों को जुटाने के इस संदर्भ में ‘इकट्ठे किए’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: רֶכֶב
  choice: रथ
  rationale: यह शब्द सामूहिक रूप से रथ-दल को भी सूचित कर सकता है, पर यहाँ उनकी निश्चित संख्या दी गई है; इसलिए ठोस संज्ञा ‘रथ’ स्पष्ट है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: यह संज्ञा सामान्यतः घोड़ों पर सवार लोगों को दर्शाती है, न कि केवल घोड़ों को। ‘घुड़सवार’ इब्रानी के निकट और आधुनिक हिन्दी में सहज है।
- source_word: וַיְהִי לוֹ
  choice: उसके पास ... थे
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘उसके लिए थे’ है; हिन्दी में स्वामित्व बताने के लिए ‘उसके पास ... थे’ स्वाभाविक है।
- source_word: אֶלֶף וְאַרְבַּע מֵאוֹת רֶכֶב
  choice: 1,400 रथ
  rationale: मूल पाठ की ठीक संख्या को आधुनिक, सरल अंक-शैली में रखा गया है।
- source_word: וּשְׁנֵים עָשָׂר אֶלֶף פָּרָשִׁים
  choice: 12,000 घुड़सवार
  rationale: मूल पाठ की ठीक संख्या और ‘सवारों’ का अर्थ दोनों सुरक्षित रखे गए हैं।
- source_word: וַיַּנִּיחֵם
  choice: उसने उन्हें ... तैनात किया
  rationale: हिफ़ील रूप यहाँ सैन्य संसाधनों को निर्धारित स्थानों पर रखे जाने का भाव देता है; ‘तैनात किया’ प्रसंगानुकूल है।
- source_word: בְּעָרֵי הָרֶכֶב
  choice: रथों के नगरों में
  rationale: यह रथों को रखने या उनकी छावनी के लिए निर्धारित नगरों को सूचित करता है। ‘रथों के नगर’ संक्षिप्त है और मूल की रचना को बनाए रखता है।
- source_word: וְעִם הַמֶּלֶךְ
  choice: और राजा के पास
  rationale: मूल पाठ केवल ‘और राजा के साथ/पास’ कहता है। ‘कुछ’ जोड़कर वितरण को अधिक स्पष्ट नहीं किया गया, ताकि मूल की संक्षिप्तता बनी रहे।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप और उपयुक्त परसर्ग प्रयोग किया गया है।
