  text: וַ/יִּתֵּ֨ן הַ/מֶּ֜לֶךְ אֶת הַ/כֶּ֧סֶף וְ/אֶת הַ/זָּהָ֛ב בִּ/ירוּשָׁלִַ֖ם כָּ/אֲבָנִ֑ים וְ/אֵ֣ת הָ/אֲרָזִ֗ים נָתַ֛ן כַּ/שִּׁקְמִ֥ים אֲשֶׁר בַּ/שְּׁפֵלָ֖ה לָ/רֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/015.yaml
  text: The king made the silver and the gold in Jerusalem as plentiful as stones[b][a], and he made the cedars as plentiful as the sycamore trees that are in the lowland.
translation:
  language: hi
  text: राजा ने यरूशलेम में चाँदी और सोने को पत्थरों के समान बहुतायत में कर दिया[a], और देवदारों को शफेला के निचले इलाके के गूलर के पेड़ों के समान बहुतायत में कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका शाब्दिक रूप है, “पत्थरों के समान।” इब्रानी में यह तुलना असाधारण बहुतायत व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: “शफेला” यहूदा के पहाड़ी देश और तटीय मैदान के बीच का पाद-पहाड़ी, निचला क्षेत्र था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתֵּן / נָתַן
  choice: बहुतायत में कर दिया
  rationale: 'נתן का सामान्य अर्थ ‘देना’ या ‘रखना’ है, पर यहाँ तुलना और לָרֹב के साथ यह परिणामसूचक अर्थ देता है: राजा ने इन वस्तुओं को अत्यंत प्रचुर कर दिया।'
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: चाँदी और सोना
  rationale: दोनों धातुओं को वस्तु/संपदा के रूप में स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; हिन्दी में निश्चित उपपद की आवश्यकता नहीं है।
- source_word: כָּאֲבָנִים
  choice: पत्थरों के समान बहुतायत में
  rationale: शाब्दिक तुलना ‘पत्थरों के समान’ है; ‘बहुतायत में’ जोड़ने से तुलना का आशय—असाधारण प्रचुरता—स्पष्ट होता है।
- source_word: הָאֲרָזִים
  choice: देवदार की लकड़ी
  rationale: संदर्भ राजकीय संपदा और निर्माण-सामग्री का है, इसलिए बहुवचन ‘देवदारों’ की अपेक्षा ‘देवदार की लकड़ी’ हिन्दी में अधिक स्वाभाविक है, यद्यपि स्रोत केवल ‘देवदार’ कहता है।
- source_word: כַּשִּׁקְמִים
  choice: गूलर के पेड़ों के समान
  rationale: שִׁקְמָה क्षेत्र का sycamore-fig वृक्ष है; हिन्दी में ‘गूलर’ निकट और समझने योग्य वृक्ष-नाम है, तथा ‘पेड़ों’ से अर्थ स्पष्ट किया गया है।
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: तराई के
  rationale: שְׁפֵלָה यहूदा के पहाड़ी देश और तटीय मैदान के बीच का नीचा, पाद-पहाड़ी क्षेत्र है; मुख्य पाठ में सहज ‘तराई’ और टिप्पणी में भौगोलिक स्पष्टीकरण दिया गया है।
- source_word: לָרֹב
  choice: बहुतायत में
  rationale: यह पद प्रचुरता व्यक्त करता है और हिन्दी में दोनों तुलनात्मक वाक्यांशों के आशय को स्वाभाविक रूप से स्पष्ट करता है।
