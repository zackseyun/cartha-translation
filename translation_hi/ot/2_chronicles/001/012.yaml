base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/012.yaml
  text: Wisdom and knowledge are given to you[a], and I will give you riches and possessions and honor such as no kings before you have had, and none after you will have the like.
translation:
  language: hi
  text: बुद्धि और ज्ञान तुम्हें दिए गए हैं। मैं तुम्हें धन, संपत्ति और सम्मान भी दूँगा—ऐसे वरदान तुमसे पहले के राजाओं को नहीं मिले, और तुम्हारे बाद भी किसी को नहीं मिलेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जो तुमसे पहले के राजाओं के लिए ऐसा नहीं था, और तुम्हारे बाद भी ऐसा नहीं होगा।”'
    reason: इब्रानी तुलना की संक्षिप्त शब्दशः संरचना को सुरक्षित रखने वाला वैकल्पिक रूप।
lexical_decisions:
- source_word: הַחָכְמָה וְהַמַּדָּע
  choice: बुद्धि और ज्ञान
  rationale: दोनों अमूर्त संज्ञाओं का प्रचलित और स्वाभाविक हिन्दी रूप; निश्चित उपपदों को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: נָתוּן לָךְ
  choice: तुम्हें दिए गए हैं
  rationale: निष्क्रिय कृदंत प्राप्त अनुदान की वर्तमान अवस्था बताता है; संयुक्त विषय के अनुसार हिन्दी में बहुवचन रखा गया है।
- source_word: עֹשֶׁר
  choice: धन
  rationale: राजकीय संदर्भ में संपन्नता या दौलत का स्पष्ट, सामान्य आधुनिक हिन्दी शब्द।
- source_word: נְכָסִים
  choice: संपत्ति
  rationale: माल-मिल्कियत या possessions का स्वाभाविक हिन्दी रूप, जो preceding ‘धन’ से संबंधित होते हुए भी अलग अर्थ रखता है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: राजा को मिलने वाली प्रतिष्ठा के संदर्भ में उपयुक्त; ‘महिमा’ से जुड़ी अनावश्यक दैवी ध्वनि से बचता है।
- source_word: אֶתֶּן לָךְ
  choice: मैं तुम्हें ... दूँगा
  rationale: अपूर्ण क्रिया यहाँ परमेश्वर की भावी प्रतिज्ञा व्यक्त करती है।
- source_word: אֲשֶׁר לֹא הָיָה כֵן לַמְּלָכִים אֲשֶׁר לְפָנֶיךָ
  choice: जैसा तुमसे पहले किसी राजा को नहीं मिला
  rationale: शाब्दिक ‘राजाओं के लिए ऐसा नहीं था’ को अर्थ-संगत और स्वाभाविक हिन्दी तुलना में व्यक्त किया गया है।
- source_word: וְאַחֲרֶיךָ לֹא יִהְיֶה כֵן
  choice: और न तुम्हारे बाद किसी को मिलेगा
  rationale: भविष्य के राजाओं से की गई निहित तुलना को सहज हिन्दी में स्पष्ट करता है, बिना तुलना का दायरा बढ़ाए।
theological_decisions:
- issue: अद्वितीयता की तुलना का दायरा
  choice: तुलना को निकटतम सूची ‘धन, संपत्ति और सम्मान’ से जोड़ा गया है।
  alternative: तुलना को बुद्धि और ज्ञान सहित पद में बताए गए सभी वरदानों, अथवा सुलैमान के पूरे व्यक्तित्व और शासन, पर लागू करना।
  rationale: इब्रानी वाक्य-विन्यास में संबंधवाचक उपवाक्य तुरंत धन, संपत्ति और सम्मान के बाद आता है। अनुवाद इससे आगे बढ़कर सुलैमान की हर दृष्टि से निरपेक्ष अद्वितीयता का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धन, संपत्ति और सम्मान’ राजकीय वरदानों की तीन अलग किन्तु संबंधित श्रेणियाँ बनाए रखता है; ‘भी’ पहली प्रतिज्ञा और अतिरिक्त वरदानों के बीच संबंध स्पष्ट करता है।
