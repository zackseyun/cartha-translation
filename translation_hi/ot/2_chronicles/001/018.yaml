language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁלֹמֹ֗ה לִ/בְנ֥וֹת בַּ֨יִת֙ לְ/שֵׁ֣ם יְהוָ֔ה וּ/בַ֖יִת לְ/מַלְכוּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/018.yaml
  text: And Solomon said to build a house for the name of Yahweh[b][a], and a house for his kingdom.
translation:
  language: hi
  text: तब सुलैमान ने याहवे के नाम के लिए एक भवन और अपने राज्य के लिए एक भवन बनाने का निश्चय किया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “सुलैमान ने ... बनाने को कहा।” इस इब्रानी रचना का अर्थ “बनाने का निश्चय किया” या “बनाने की आज्ञा दी” भी हो सकता है।'
    reason: मूल क्रिया ‘कहा’ और प्रसंगगत ‘निश्चय/आज्ञा’ के बीच वास्तविक अर्थगत संभावना को सुरक्षित करना।
  - marker: b
    text: इब्रानी में दोनों जगह एक ही शब्द “भवन/घर” आया है; प्रसंग के अनुसार पहला मंदिर और दूसरा राजमहल है।
    reason: मूल पाठ की शब्द-पुनरावृत्ति तथा अधिक स्पष्ट प्रसंगगत अनुवाद—दोनों से पाठक को अवगत कराना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: निश्चय किया
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहा’ है, पर उसके बाद प्रयुक्त לִבְנוֹת (‘बनाने’) के साथ यह रचना यहाँ सुलैमान के निर्णय या संकल्प को व्यक्त करती है। ‘निश्चय किया’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शब्दशः विकल्प पादटिप्पणी में रखा गया है।
- source_word: לִבְנוֹת
  choice: बनाने
  rationale: בנה के infinitive construct का सीधा अर्थ ‘बनाना/निर्माण करना’ है। हिन्दी वाक्य-विन्यास में ‘बनाने का निश्चय किया’ स्रोत की आशयगत संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּיִת ... וּבַיִת
  choice: एक भवन ... एक भवन
  rationale: दोनों स्थानों पर एक ही हिन्दी शब्द रखकर मूल इब्रानी की पुनरावृत्ति सुरक्षित की गई है। प्रसंग में पहला भवन मंदिर और दूसरा राजमहल है, पर मुख्य पाठ में इन व्याख्यात्मक अर्थों को आरोपित नहीं किया गया।
- source_word: לְשֵׁם יְהוָה
  choice: याहवे के नाम के लिए
  rationale: यह मंदिर से जुड़ी महत्वपूर्ण धर्मवैचारिक अभिव्यक्ति है। ‘नाम के लिए’ को बनाए रखने से यह संकेत सुरक्षित रहता है कि भवन याहवे के नाम से संबंधित है; यह नहीं कहा गया कि परमेश्वर स्वयं किसी भवन में सीमित हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है, शीर्षक से प्रतिस्थापित नहीं किया गया।
- source_word: לְמַלְכוּתוֹ
  choice: अपने राज्य के लिए
  rationale: מַלְכוּת का सामान्य अर्थ ‘राज्य’ या ‘राजत्व’ है। प्रत्यय का कर्ता सुलैमान है, इसलिए हिन्दी में ‘अपने राज्य के लिए’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम और मंदिर-सूत्र
  choice: याहवे के नाम के लिए
  alternative: याहवे के सम्मान के लिए / प्रभु के नाम के लिए
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम और ‘नाम के लिए’ वाली विशिष्ट अभिव्यक्ति दोनों रखता है। मुख्य पाठ इन्हें सुरक्षित रखता है और ‘सम्मान’ जैसी व्याख्यात्मक सीमाबद्धता से बचता है।
- issue: दोनों भवनों की पहचान
  choice: एक भवन ... एक भवन
  alternative: एक मंदिर ... एक राजमहल
  rationale: स्रोत दोनों खंडों में בַּיִת को दोहराता है। समान शब्दावली उस साहित्यिक पुनरावृत्ति को बनाए रखती है, जबकि प्रसंगगत पहचान पादटिप्पणी में दी जाती है।
- issue: וַיֹּאמֶר के साथ infinitive का बल
  choice: निश्चय किया
  alternative: कहा / बनाने की आज्ञा दी
  rationale: निर्माण करने के infinitive के साथ यह रचना निर्णय, उद्देश्य या आदेश का संकेत दे सकती है। ‘निश्चय किया’ प्रसंग और स्वाभाविक हिन्दी के अनुकूल है, किंतु मूल क्रिया के शब्दशः अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ ने ‘घर’ की अपेक्षा सार्वजनिक और राजकीय निर्माणों के संदर्भ में अधिक उपयुक्त औपचारिकता दी है। वाक्य में दो बार ‘एक भवन’ जानबूझकर रखा गया है ताकि इब्रानी पुनरावृत्ति बनी रहे।
