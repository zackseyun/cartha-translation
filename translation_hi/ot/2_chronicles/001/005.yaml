source:
  edition: WLC
  text: וּ/מִזְבַּ֣ח הַ/נְּחֹ֗שֶׁת אֲשֶׁ֤ר עָשָׂה֙ בְּצַלְאֵל֙ בֶּן אוּרִ֣י בֶן ח֔וּר שָׂ֕ם לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה וַ/יִּדְרְשֵׁ֥/הוּ שְׁלֹמֹ֖ה וְ/הַ/קָּהָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/005.yaml
  text: And the bronze altar that Bezalel son of Uri[a], son of Hur, had made was there before the tabernacle of Yahweh, and Solomon and the assembly sought it there.
translation:
  language: hi
  text: और काँसे की वह वेदी, जिसे ऊरी के पुत्र, हूर के पुत्र बसलेल ने बनाया था, यहोवा के निवास-तंबू के सामने थी; और सुलैमान तथा सभा ने उसकी खोज की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुलैमान तथा सभा ने वहाँ उस वेदी को ढूँढ़ा।” इब्रानी में सर्वनाम का संदर्भ अस्पष्ट है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: और काँसे की वह वेदी
  rationale: מִזְבַּח का स्वाभाविक हिन्दी रूप ‘वेदी’ है और נְחֹשֶׁת को इस उपासना-सामग्री के संदर्भ में ‘काँसा’ कहना उपयुक्त है। आरंभिक וּ को कथा की निरंतरता के लिए ‘और’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जिसे ... ने बनाया था
  rationale: सम्बन्धवाचक उपवाक्य वेदी की पहचान कराता है; ‘बनाया था’ मुख्य कथन से पहले पूर्ण हुए कार्य को सहज हिन्दी में दिखाता है।
- source_word: בְּצַלְאֵל בֶּן אוּרִי בֶן חוּר
  choice: ऊरी के पुत्र और हूर के पोते बसलेल
  rationale: वंश-संबंध को आधुनिक हिन्दी में स्पष्ट और सहज बनाया गया है; दूसरे בֶּן का आशय यहाँ वंशक्रम में ‘पोता’ है। नामों के प्रचलित हिन्दी रूप रखे गए हैं।
- source_word: שָׂם
  choice: वहीं थी
  rationale: क्रिया का परिणामगत स्थानार्थ व्यक्त किया गया है। कोई कर्ता स्पष्ट न होने के कारण ‘रखी गई थी’ कहकर अनावश्यक कर्मवाच्य कर्तृत्व नहीं जोड़ा गया।
- source_word: לִפְנֵי מִשְׁכַּן יְהוָה
  choice: यहोवा के पवित्र निवास के सामने
  rationale: לִפְנֵי स्थानवाचक ‘सामने’ है। מִשְׁכָּן का मूल भाव निवास-स्थान है; इस उपासना-संदर्भ में ‘पवित्र निवास’ आधुनिक पाठक के लिए अर्थपूर्ण है। परमेश्वर का व्यक्तिगत नाम יְהוָה ‘यहोवा’ रखा गया है।
- source_word: וַיִּדְרְשֵׁהוּ
  choice: वहाँ उसकी खोज की
  rationale: דרשׁ का अर्थ ‘खोजना/ढूँढ़ना’ है और पुल्लिंग एकवचन प्रत्यय का निकटवर्ती सम्भावित संदर्भ यहोवा भी हो सकता है। ‘उसकी’ हिन्दी में व्यक्ति और वस्तु दोनों के संदर्भ की व्याकरणिक अस्पष्टता बनाए रखता है; वैकल्पिक वस्तु-संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שְׁלֹמֹה וְהַקָּהָל
  choice: सुलैमान तथा सभा
  rationale: קָהָל यहाँ उपासना के लिए एकत्र समुदाय है; ‘सभा’ संक्षिप्त, वर्तमान और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: וַיִּדְרְשֵׁהוּ में सर्वनाम-प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसकी खोज की’, जो यहोवा को संदर्भित कर सकता है और हिन्दी में कुछ अस्पष्टता भी बनाए रखता है।
  alternative: प्रत्यय को काँसे की वेदी के लिए मानकर ‘उसे ढूँढ़ा/उसकी खोज की’, अथवा स्थानगत अर्थ में ‘वहाँ उसकी खोज की’।
  rationale: דרשׁ प्रायः परमेश्वर को खोजने के लिए प्रयुक्त होता है और निकट प्रसंग में ‘यहोवा’ उपस्थित है; फिर भी व्याकरणतः प्रत्यय वेदी को भी संदर्भित कर सकता है। इसलिए किसी एक अर्थ को पूर्णतः बंद नहीं किया गया और वैकल्पिक समझ पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘पवित्र निवास’ मूल מִשְׁכָּן के निवासार्थ को व्यक्त करता है; नाम ‘यहोवा’ स्रोत में आए व्यक्तिगत ईश्वरीय नाम को प्रत्यक्ष रखता है।
