reference: 2 Chronicles 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַתָּה֙ יְהוָ֣ה אֱלֹהִ֔ים יֵֽאָמֵן֙ דְּבָ֣רְ/ךָ֔ עִ֖ם דָּוִ֣יד אָבִ֑/י כִּ֤י אַתָּה֙ הִמְלַכְתַּ֔/נִי עַל עַ֕ם רַ֖ב כַּ/עֲפַ֥ר הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/009.yaml
  text: Now[a], Yahweh God, let your word to David my father be confirmed, for you have made me king over a people as numerous as the dust of the earth.
translation:
  language: hi
  text: अब, याहवे परमेश्वर, मेरे पिता दाऊद से कहा हुआ आपका वचन स्थिर हो[a], क्योंकि आपने मुझे ऐसी प्रजा का राजा बनाया है जो पृथ्वी की धूल के समान असंख्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता दाऊद से की हुई आपकी प्रतिज्ञा पूरी हो।”
    reason: דָּבָר यहाँ संदर्भानुसार प्रतिज्ञा का भाव रख सकता है, और יֵאָמֵן स्थापित अथवा पूरा होने का भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समय और संवाद—दोनों का संकेत देने वाला पद है और सुलैमान की विनती का आरम्भ करता है।
- source_word: יְהוָה אֱלֹהִים
  choice: याहवे परमेश्वर
  rationale: याहवे वाचा-संबंधी व्यक्तिगत नाम को दर्शाता है, और परमेश्वर אֱלֹהִים की स्वाभाविक तथा गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: יֵאָמֵן
  choice: दृढ़ हो
  rationale: अमन के निफ़अल रूप में यहाँ इच्छा व्यक्त होती है कि परमेश्वर का वचन प्रमाणित, स्थिर या पूरा होकर दृढ़ ठहरे।
- source_word: דְּבָרְךָ עִם דָּוִיד אָבִי
  choice: मेरे पिता दाऊद से कहा हुआ आपका वचन
  rationale: शाब्दिक 'आपका वचन ... के साथ' को हिन्दी में स्वाभाविक बनाते हुए उस वचन के दाऊद को कहे जाने का सम्बन्ध सुरक्षित रखा गया है।
- source_word: הִמְלַכְתַּנִי
  choice: आपने मुझे ... का राजा बनाया है
  rationale: हिफ़इल रूप का कारक अर्थ स्पष्ट करता है कि परमेश्वर ने सुलैमान को राजा बनाया।
- source_word: עַל עַם רַב כַּעֲפַר הָאָרֶץ
  choice: ऐसी प्रजा का ... जो पृथ्वी की धूल के समान असंख्य है
  rationale: רַב का संख्यात्मक भाव अगले उपमान से स्पष्ट है; 'असंख्य' सहज हिन्दी में उसी आशय को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: דְּבָרְךָ को 'वचन' या 'प्रतिज्ञा' कहना
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: संदर्भ में यह दाऊद से की गई प्रतिज्ञा है, पर मूल शब्द व्यापक रूप से 'वचन' है; मुख्य पाठ मूल की व्यापकता रखता है और पादटिप्पणी प्रतिज्ञात्मक अर्थ बताती है।
- issue: יֵאָמֵן का आशय
  choice: दृढ़ हो
  alternative: पूरा हो; सत्य प्रमाणित हो
  rationale: रूप में स्थिर किए जाने और सत्य सिद्ध होने की अर्थ-छाया है। 'दृढ़ हो' यह तनाव बनाए रखता है, जबकि पादटिप्पणी संदर्भगत पूर्ति का विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थी प्रार्थना-शैली अपनाई गई है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; 'प्रजा' राजकीय संदर्भ को और 'असंख्य' धूल के उपमान का संख्यात्मक भाव स्पष्ट करता है।
