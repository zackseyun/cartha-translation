  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעַל֩ שְׁלֹמֹ֨ה שָׁ֜ם עַל מִזְבַּ֤ח הַ/נְּחֹ֨שֶׁת֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר לְ/אֹ֣הֶל מוֹעֵ֑ד וַ/יַּ֧עַל עָלָ֛י/ו עֹל֖וֹת אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/006.yaml
  text: And Solomon went up there to the bronze altar before Yahweh[a], which was at the tent of meeting, and offered on it a thousand burnt offerings.
translation:
  language: hi
  text: तब सुलैमान वहाँ याहवे[a] के सामने काँसे की वेदी तक गया, जो मिलाप के तंबू के पास थी, और उसने उस पर एक हज़ार होमबलियाँ चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम ‘याहवे’ है।
    reason: मूल भाषा के ईश्वरीय नाम की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַל ... שָׁם
  choice: वहाँ ... के पास गया
  rationale: עלה में ऊपर जाने का भाव है, पर यहाँ वेदी पर चढ़ने का अर्थ देना हिंदी में भ्रामक होगा। संदर्भानुसार सुलैमान का वेदी तक जाना स्वाभाविक हिंदी में व्यक्त किया गया है; שָׁם को ‘वहाँ’ रखा गया है।
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: नְחֹשֶׁת ताँबे अथवा ताँबा-मिश्रित धातु के लिए प्रयुक्त हो सकता है; इस उपासना-संबंधी संदर्भ में ‘काँसे की वेदी’ प्रचलित और स्पष्ट पद है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי उपस्थिति अथवा सम्मुख स्थिति बताता है। ‘के सामने’ मूल संरचना और धार्मिक आशय दोनों को सहज हिंदी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר לְאֹהֶל מוֹעֵד
  choice: जो मिलापवाले तंबू के पास थी
  rationale: यह संबंधवाचक उपवाक्य वेदी का मिलापवाले तंबू से स्थानिक अथवा संबद्धतामूलक संबंध बताता है। ‘के पास थी’ संदर्भ में स्वाभाविक है और ‘की थी’ जैसे स्वामित्व के अधिक निश्चित अर्थ से बचता है।
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: उस पर ... होमबलियाँ चढ़ाईं
  rationale: दूसरा עלה बलिदान चढ़ाने की रूढ़ धार्मिक अभिव्यक्ति है। हिंदी में ‘होमबलियाँ चढ़ाईं’ उसी क्रिया को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह עֹלָה का बहुवचन है और पूरी तरह जलाकर अर्पित किए जाने वाले बलिदानों के लिए हिंदी बाइबलीय परंपरा में समझा जाने वाला संक्षिप्त पद है।
- source_word: אָלֶף
  choice: एक हज़ार
  rationale: मूल पाठ की निश्चित संख्या को सीधे और स्पष्ट रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम יְהוָה है। ‘याहवे’ उसे उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है; पाठक की सहायता के लिए पादटिप्पणी में इसकी पहचान दी गई है।
- issue: אֲשֶׁר לְאֹהֶל מוֹעֵד में वेदी और तंबू का संबंध
  choice: मिलापवाले तंबू के पास थी
  alternative: मिलापवाले तंबू की थी
  rationale: לְ यहाँ स्थान अथवा संबद्धता दोनों का संकेत दे सकता है। संदर्भ स्थानिक संबंध का समर्थन करता है, जबकि स्वामित्व को निश्चित मानना मूल की संभावित अस्पष्टता को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मिलापवाला तंबू’, ‘वेदी’ और ‘होमबलि’ जैसे परिचित बाइबलीय पदों का प्रयोग किया गया है। ‘वेदी के पास गया’ चुना गया है ताकि पाठ से यह गलत अर्थ न निकले कि सुलैमान स्वयं वेदी के ऊपर चढ़ गया था।
