base_translation:
  language: en
  yaml_path: translation/ot/2_chronicles/001/013.yaml
  text: Then Solomon came to Jerusalem from the high place that was at Gibeon[a], from before the tent of meeting[c][b], and he reigned over Israel.
translation:
  language: hi
  text: तब सुलैमान गिबोन में स्थित ऊँचे स्थान से, मिलाप के तम्बू के सामने से, यरूशलेम लौट आया[a], और उसने इस्राएल पर राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आया”; इब्रानी क्रिया को वर्णन के दृष्टिकोण के अनुसार “आना” या “जाना” कहा जा सकता है। यहाँ प्रसंग यरूशलेम लौटने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: लौट आया
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। पूर्ववर्ती प्रसंग में सुलैमान गिबोन गया था; अब यरूशलेम उसकी वापसी का गंतव्य है, इसलिए ‘लौट आया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: לַבָּמָה
  choice: ऊँचे स्थान
  rationale: במה उपासना से जुड़े ऊँचे स्थान को दर्शाता है। मानक पद ‘ऊँचा स्थान’ यहाँ बिना अनावश्यक नकारात्मक मूल्यांकन के अर्थ सुरक्षित रखता है।
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: गिबोन के
  rationale: हिन्दी में ‘गिबोन के ऊँचे स्थान’ स्वाभाविक रूप से उसी स्थान को गिबोन में स्थित बताता है; विस्तृत संबंधवाचक उपवाक्य आवश्यक नहीं है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: मसोराई शब्दक्रम संक्षिप्त है, पर प्रसंग और वाक्य-संबंध यरूशलेम को गंतव्य बताते हैं।
- source_word: מִלִּפְנֵי
  choice: के सामने से
  rationale: यह मूल स्थानिक अभिव्यक्ति ‘के सामने से’ को सुरक्षित रखता है और पवित्रस्थान के क्षेत्र से प्रस्थान का भाव देता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह स्थापित, पारदर्शी हिन्दी अभिव्यक्ति है, जो אהל מועד के दोनों घटकों और उसके उपासना-संबंधी अर्थ को बनाए रखती है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य करने लगा
  rationale: מלך का अर्थ ‘राज्य करना’ है। यहाँ कथानक सुलैमान के शासन के आगे बढ़ने की ओर मुड़ता है; ‘राज्य करने लगा’ हिन्दी में इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है, बिना यह कहे कि इसी क्षण वह पहली बार राजा बना।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: מלך के साथ על का सामान्य अर्थ ‘पर राज्य करना’ है।
theological_decisions:
- issue: संक्षिप्त इब्रानी शब्दक्रम में ‘यरूशलेम’ का वाक्यगत संबंध
  choice: सुलैमान गिबोन के ऊँचे स्थान से यरूशलेम लौट आया
  alternative: सुलैमान यरूशलेम से गिबोन के ऊँचे स्थान पर आया
  rationale: पूर्ववर्ती प्रसंग में सुलैमान गिबोन गया था और अब वहाँ से लौटता है। अतः यरूशलेम को गंतव्य मानना प्रसंग तथा वाक्य-संबंध के अनुकूल है।
- issue: मिलापवाले तम्बू से जुड़े गिबोन के במה का वर्णन
  choice: ऊँचा स्थान
  alternative: ऊँचे स्थान का मंदिर
  rationale: मूल पद को शाब्दिक-स्वाभाविक रूप में रखा गया है। इस प्रसंग में अनावश्यक निंदा या किसी संप्रदायगत मूल्यांकन को नहीं जोड़ा गया।
- issue: וַיִּמְלֹךְ का कालगत आशय
  choice: वह इस्राएल पर राज्य करने लगा
  alternative: उसने इस्राएल पर राज्य किया
  rationale: सुलैमान पहले से राजा है; अभिव्यक्ति को उसके शासन की कथात्मक शुरुआत या आगे बढ़ने के रूप में रखा गया है, न कि अनिवार्यतः इसी क्षण उसके राजा बनने के रूप में।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। इब्रानी की संक्षिप्त रचना को स्पष्ट हिन्दी क्रम में रखा गया है। डैशों से ‘मिलापवाले तम्बू के सामने से’ को उसी प्रस्थान-स्थल की व्याख्या के रूप में दिखाया गया है।
