base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/009.yaml
  text: Do not be quick in your spirit to become angry[a], for anger rests in the bosom of fools.
translation:
  language: hi
  text: अपने मन में क्रोधित होने में जल्दी न कर, क्योंकि क्रोध मूर्खों की गोद में टिका रहता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘गोद में’ के लिए ‘वक्ष/छाती के निकट’ भी कहा जा सकता है। इब्रानी बिंब में क्रोध मूर्खों के भीतर, उनके बहुत निकट, टिककर रहने वाली चीज़ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל
  choice: जल्दी न कर
  rationale: पिएल रूप के साथ निषेध आवेगपूर्ण उतावलेपन से रोकता है; अगले पदबंध से स्पष्ट है कि बात भयभीत होने की नहीं, शीघ्र क्रोधित होने की है।
- source_word: בְּרוּחֲךָ
  choice: अपने मन में
  rationale: यहाँ רוּחַ व्यक्ति की भीतरी प्रवृत्ति या अंतर्मन को सूचित करता है। आधुनिक हिन्दी में ‘अपने मन में’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִכְעוֹס
  choice: क्रोध करने
  rationale: यह क्रोध की अवस्था में प्रवेश करने का भाव देता है; ‘क्रोध करने की जल्दी’ उस आरंभिक और आवेगपूर्ण भाव को स्पष्ट रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले निषेध का कारण प्रस्तुत करता है।
- source_word: כַעַס
  choice: क्रोध
  rationale: संदर्भ में यह संज्ञा रोष या क्रोध का सीधा अर्थ देती है और पहले खंड की क्रिया से शब्दगत संबंध बनाए रखती है।
- source_word: בְּחֵיק
  choice: गोद में
  rationale: חֵיק का मूल बिंब गोद या छाती के पास के स्थान का है, जहाँ कोई वस्तु निकट रखी जाती है। ‘गोद में’ उस अंतरंग निकटता के रूपक को बनाए रखता है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: यह ज्ञान-साहित्य का प्रचलित शब्द है, जो केवल कम बुद्धि नहीं बल्कि नैतिक और व्यावहारिक विवेकहीनता भी दर्शाता है।
- source_word: יָנוּחַ
  choice: ठहरा रहता है
  rationale: נוח विश्राम करने, टिकने या बस जाने का अर्थ दे सकता है। ‘ठहरा रहता है’ बताता है कि क्रोध मूर्ख के पास क्षणिक अतिथि नहीं, बल्कि टिके रहने वाला है।
