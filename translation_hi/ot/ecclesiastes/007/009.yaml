review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition against impulsive anger, the causal connection, and the image of anger lodging with fools. However, ‘क्रोध करने’ is less precise than the inceptive Hebrew infinitive (‘to become angry’), and the footnote's proposed ‘छाती से लगा हुआ’ is interpretively awkward and does not function as a clean lexical alternative.
  naturalness: The verse is generally clear and proverbial in modern Hindi. ‘अपने मन में क्रोधित होने में जल्दी न कर’ is more idiomatic and directly represents being quick to become angry than ‘क्रोध करने की जल्दी न कर.’
  terminology: ‘क्रोध,’ ‘मूर्खों,’ and ‘गोद में’ are appropriate. ‘अपने मन में’ naturally conveys the inner-disposition sense of רוּחַ in this context. ‘टिका रहता है’ is a natural rendering of the image of resting/settling.
  issues:
  - severity: medium
    issue: The phrase ‘क्रोध करने की जल्दी न कर’ weakens the inceptive sense of לִכְעוֹס.
    rationale: The Hebrew warns against being hasty to enter anger, not broadly against the act of expressing or doing anger. ‘क्रोधित होने में जल्दी न कर’ retains this nuance in natural Hindi.
  - severity: low
    issue: The footnote includes ‘मूर्खों की छाती से लगा हुआ’ as an alternative.
    rationale: This is not a natural lexical rendering of בְּחֵיק and may suggest a different physical image. The note should simply explain that ‘गोद’ can also be understood as ‘वक्ष/छाती के निकट’ in the sense of something held close.
  revised_text: अपने मन में क्रोधित होने में जल्दी न कर, क्योंकि क्रोध मूर्खों की गोद में टिका रहता है[a]।
