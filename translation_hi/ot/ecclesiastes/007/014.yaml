  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/י֤וֹם טוֹבָה֙ הֱיֵ֣ה בְ/ט֔וֹב וּ/בְ/י֥וֹם רָעָ֖ה רְאֵ֑ה גַּ֣ם אֶת זֶ֤ה לְ/עֻמַּת זֶה֙ עָשָׂ֣ה הָֽ/אֱלֹהִ֔ים עַל דִּבְרַ֗ת שֶׁ/לֹּ֨א יִמְצָ֧א הָֽ/אָדָ֛ם אַחֲרָ֖י/ו מְאֽוּמָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/014.yaml
  text: 'In a day of prosperity[a], be joyful; and in a day of adversity, consider: God has made the one as well as the other[c][b], so that man may not find out anything that will come after him.'
translation:
  language: hi
  text: 'सुख के समय सुखी रहो; और विपत्ति के समय विचार करो: परमेश्वर ने एक को दूसरे के सम्मुख बनाया है,[a] ताकि मनुष्य अपने बाद आने वाली किसी भी बात को जान न सके।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने एक को दूसरे के अनुरूप रखा है।”
    reason: alternative_reading
  - marker: b
    text: “अपने बाद आने वाली” का अर्थ सामान्य रूप से “भविष्य में होने वाली” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם טוֹבָה
  choice: सुख के दिन
  rationale: यहाँ יוֹם किसी कैलेंडर-दिन से अधिक परिस्थिति या समय को दर्शाता है, और טוֹבָה अनुकूल दशा का संकेत देता है।
- source_word: הֱיֵה בְטוֹב
  choice: सुखी रहो
  rationale: इब्रानी मुहावरा अनुकूल समय में आनंदपूर्वक रहने या भलाई का उपभोग करने का आह्वान करता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וּבְיוֹם רָעָה
  choice: और विपत्ति के दिन
  rationale: सन्दर्भ में רָעָה नैतिक बुराई नहीं, बल्कि संकट या प्रतिकूल परिस्थिति है।
- source_word: רְאֵה
  choice: विचार करो
  rationale: यह आज्ञार्थक क्रिया केवल आँखों से देखने के बजाय ध्यान देकर समझने का भाव रखती है।
- source_word: גַּם אֶת־זֶה לְעֻמַּת זֶה
  choice: इसे भी उसके साथ
  rationale: वाक्यांश सुख और विपत्ति को परस्पर अनुरूप या आमने-सामने रखी हुई वास्तविकताओं के रूप में प्रस्तुत करता है; सर्वनाम मूल की संक्षिप्तता बनाए रखते हैं।
- source_word: עָשָׂה הָאֱלֹהִים
  choice: परमेश्वर ने ... बनाया है
  rationale: עָשָׂה का सामान्य अर्थ बनाना या करना है; पूर्ण वर्तमान प्रभाव परमेश्वर की स्थापित व्यवस्था को व्यक्त करता है।
- source_word: עַל דִּבְרַת
  choice: ताकि
  rationale: यह पदबंध यहाँ उद्देश्य अथवा परिणाम का परिचय देता है।
- source_word: שֶׁלֹּא יִמְצָא הָאָדָם
  choice: ताकि मनुष्य ... पता न लगा सके
  rationale: מצא यहाँ खोज निकालने या जान लेने के अर्थ में है; הָאָדָם प्रतिनिधिक एकवचन में मानव को दर्शाता है।
- source_word: אַחֲרָיו מְאוּמָה
  choice: अपने बाद होनेवाली किसी भी बात
  rationale: אַחֲרָיו में व्यक्ति के बाद या उसके भविष्य में आनेवाली बात का सम्भावित अर्थ है, और नकारात्मक वाक्य में מְאוּמָה ‘किसी भी बात’ है।
theological_decisions:
- issue: सुख और विपत्ति में परमेश्वर की कर्तृता
  choice: परमेश्वर ने इसे भी उसके साथ बनाया है
  alternative: परमेश्वर ने एक को दूसरे के अनुरूप रखा है
  rationale: मूल पाठ दोनों विपरीत परिस्थितियों को परमेश्वर के कार्य से जोड़ता है। अनुवाद इस कठिन धार्मिक तनाव को नरम किए बिना रखता है, पर उससे आगे कोई व्यापक दार्शनिक निष्कर्ष नहीं जोड़ता।
- issue: הָאָדָם का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति; व्यक्ति
  rationale: मूल संज्ञा व्याकरणतः पुल्लिंग एकवचन है और यहाँ समस्त मानवता के प्रतिनिधि रूप में प्रयुक्त हुई है; ‘मनुष्य’ हिन्दी में इस दोनों पक्षों को बनाए रखता है।
- issue: אַחֲרָיו की सन्दर्भगत अस्पष्टता
  choice: अपने बाद होनेवाली
  alternative: उसके बाद; भविष्य में होनेवाली
  rationale: यह पद व्यक्ति के बाद आनेवाली घटनाओं या सामान्यतः भविष्य की ओर संकेत कर सकता है। मुख्य पाठ सम्भावित व्यक्तिगत सम्बन्ध बनाए रखता है और पाद-टिप्पणी व्यापक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली अपनाई गई है। ‘सुखी रहो’ सामान्य पाठक के लिए स्वाभाविक है; ‘विचार करो’ मूल आज्ञा के चिंतनशील बल को बनाए रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
