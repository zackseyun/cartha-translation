  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֥י הָ/עֹ֖שֶׁק יְהוֹלֵ֣ל חָכָ֑ם וִֽ/יאַבֵּ֥ד אֶת לֵ֖ב מַתָּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/007.yaml
  text: For oppression drives a wise man mad[b][a], and a bribe destroys the heart.
translation:
  language: hi
  text: क्योंकि अत्याचार बुद्धिमान मनुष्य को भी पागल बना देता है, और रिश्वत[a] हृदय[b] को नष्ट कर देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भेंट हृदय को नष्ट कर देती है।’ इब्रानी शब्द का सामान्य अर्थ ‘भेंट’ भी हो सकता है, पर यहाँ संदर्भ ‘रिश्वत’ के नकारात्मक अर्थ का प्रबल समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी प्रयोग में ‘हृदय’ प्रायः मनुष्य के भीतरी व्यक्तित्व को दर्शाता है, जिसमें उसका विवेक, समझ और इच्छा शामिल हैं।
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעֹשֶׁק
  choice: अत्याचार
  rationale: यह शब्द दमनकारी शोषण और अन्यायपूर्ण दबाव को सूचित करता है। ‘अत्याचार’ आधुनिक हिन्दी में इसके सामाजिक और नैतिक बल को स्पष्ट रखता है।
- source_word: יְהוֹלֵל
  choice: पागल बना देता है
  rationale: यहाँ क्रिया किसी को विवेकहीन या उन्मत्त कर देने का भाव देती है। ‘पागल बना देता है’ इस कारणात्मक और मुहावरेदार अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: חָכָם
  choice: बुद्धिमान मनुष्य
  rationale: एकवचन पुल्लिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमान मनुष्य’ उसके नीतिवचन-सदृश एकवचन रूप को बनाए रखता है।
- source_word: וִיאַבֵּד
  choice: नष्ट कर देती है
  rationale: हिफ़ील रूप किसी वस्तु को बरबाद या नष्ट कर देने का तीव्र भाव रखता है; ‘नष्ट कर देती है’ हृदय पर पड़ने वाले गंभीर प्रभाव को बनाए रखता है।
- source_word: אֶת לֵב
  choice: हृदय
  rationale: इब्रानी में ‘हृदय’ मनुष्य के भीतर के विवेक, समझ और इच्छा को भी समेटता है। मूल रूपक को मुख्य पाठ में बनाए रखा गया है और उसका व्यापक भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מַתָּנָה
  choice: रिश्वत
  rationale: शब्द का सामान्य अर्थ ‘भेंट’ हो सकता है, पर इस संदर्भ में अत्याचार के समानांतर उसका भ्रष्ट करने वाला नकारात्मक अर्थ प्रमुख है; इसलिए ‘रिश्वत’ सबसे उपयुक्त है।
