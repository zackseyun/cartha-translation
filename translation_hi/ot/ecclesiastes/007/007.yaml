  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘को भी’ हिन्दी में इस आश्चर्यजनक बात पर स्वाभाविक बल देता है कि अत्याचार बुद्धिमान मनुष्य तक को विवेकहीन कर सकता है। मूल ‘हृदय’ रूपक को बदलकर केवल ‘मन’ या ‘समझ’ नहीं किया गया।
