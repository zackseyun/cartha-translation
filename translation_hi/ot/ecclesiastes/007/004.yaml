  yaml_path: translation/ot/ecclesiastes/007/004.yaml
  text: The heart of the wise is in the house of mourning[a], but the heart of fools is in the house of mirth.
translation:
  language: hi
  text: बुद्धिमानों का मन शोक के घर में रहता है, पर मूर्खों का मन आनंद[a] के घर में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर्ष’ अथवा ‘उत्सवी उल्लास’। इब्रानी शब्द व्यापक रूप से आनंद या प्रसन्नता को दर्शा सकता है, पर यहाँ शोक के विपरीत संभवतः उत्सव की मौज-मस्ती का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: मन
  rationale: यहाँ לֵב केवल भावना नहीं, बल्कि व्यक्ति के भीतरी ध्यान, झुकाव और चिंतन को दर्शाता है। आधुनिक हिन्दी में इस आशय के लिए ‘मन’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमानों’ संक्षिप्त नीतिवचन शैली और लिंग-समावेशी अर्थ को बनाए रखता है।
- source_word: בֵית
  choice: घर
  rationale: ‘घर’ मूल इब्रानी बिंब को सीधे बनाए रखता है और ‘शोक के घर’ तथा ‘आनंद के घर’ की समानांतर रचना को सुरक्षित रखता है।
- source_word: אֵבֶל
  choice: शोक
  rationale: यह शब्द विशेषतः मृत्यु या वियोग के कारण किए जाने वाले मातम को दर्शाता है। ‘शोक’ वर्तमान प्रसंग में संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: וְ
  choice: पर
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु यहाँ दोनों पंक्तियों के स्पष्ट विरोध को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘पर’ चुना गया है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: ज्ञान-साहित्य में यह नैतिक और बौद्धिक विवेकहीनता की श्रेणी को दर्शाता है; ‘मूर्खों’ इसका प्रचलित और उपयुक्त हिन्दी रूप है।
- source_word: שִׂמְחָה
  choice: आनंद
  rationale: इस शब्द का व्यापक अर्थ आनंद या प्रसन्नता है। यहाँ शोक के विपरीत उत्सवी उल्लास अभिप्रेत है; ‘आनंद’ मूल की व्यापकता को बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
