source:
  edition: WLC
  text: כִּ֣י כְ/ק֤וֹל הַ/סִּירִים֙ תַּ֣חַת הַ/סִּ֔יר כֵּ֖ן שְׂחֹ֣ק הַ/כְּסִ֑יל וְ/גַם זֶ֖ה הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/006.yaml
  text: For like the crackling of thorns under a pot[a], so is the laughter of the fool[b]; this too is vapor.
translation:
  language: hi
  text: क्योंकि जैसे हाँडी के नीचे काँटों की चटचटाहट होती है[a], वैसे ही मूर्ख की हँसी होती है; यह भी वाष्प है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाँडी के नीचे काँटों की आवाज़।” प्रसंग जलते हुए काँटों की तीखी चटचटाहट की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी हेवेल; इसका अर्थ “साँस” या “वाष्प” भी हो सकता है और इसे प्रायः “व्यर्थता” कहा जाता है। यहाँ “वाष्प” किसी क्षणभंगुर और पकड़ में न आने वाली वस्तु की मूल छवि को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण देने वाली उपमा आरम्भ करता है; ‘क्योंकि’ उसके संयोजक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: כְקוֹל הַסִּירִים
  choice: जैसे ... काँटों की चटचटाहट
  rationale: קוֹל का मूल अर्थ ‘आवाज़’ है, पर जलते काँटों के प्रसंग में ‘चटचटाहट’ उस तीखी, क्षणिक ध्वनि को स्वाभाविक और सजीव रूप से व्यक्त करती है।
- source_word: הַסִּירִים
  choice: काँटों
  rationale: यहाँ बहुवचन काँटेदार पौधों या झाड़ियों को सूचित करता है जिन्हें शीघ्र जलने वाले ईंधन के रूप में इस्तेमाल किया जाता था; ‘काँटे’ सरल और परिचित है।
- source_word: תַּחַת הַסִּיר
  choice: हाँडी के नीचे
  rationale: סִיר खाना पकाने का पात्र है। ‘हाँडी’ उपमा के घरेलू चूल्हे वाले दृश्य को स्पष्ट और सहज बनाती है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमा और उसके अभिप्राय के बीच समानता को स्पष्ट करता है।
- source_word: שְׂחֹק הַכְּסִיל
  choice: मूर्ख की हँसी
  rationale: שְׂחֹק ठोस श्रव्य छवि के अनुरूप ‘हँसी’ है, और כְּסִיל बुद्धि-साहित्य में नैतिक तथा बौद्धिक विवेकहीन व्यक्ति के लिए प्रचलित पद ‘मूर्ख’ है।
- source_word: וְגַם זֶה
  choice: यह भी
  rationale: मूल के संक्षिप्त, योगात्मक मूल्यांकन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָבֶל
  choice: भाप
  rationale: सभोपदेशक का यह प्रमुख शब्द साँस, भाप या वाष्प जैसी क्षणभंगुर और पकड़ में न आने वाली वस्तु की छवि जगाता है। ‘भाप’ उस मूर्त रूपक को सामान्य आधुनिक हिन्दी में सुरक्षित रखती है।
theological_decisions:
- issue: הָבֶל के रूपक और उसके व्याख्यात्मक अर्थ के बीच संबंध
  choice: मुख्य पाठ में ‘भाप’ रखकर मूल की मूर्त और बहुअर्थी छवि को बनाए रखा गया।
  alternative: ‘व्यर्थता’ या ‘निरर्थकता’
  rationale: अमूर्त विकल्प पद के किसी एक व्याख्यात्मक पहलू को निश्चित कर देते, जबकि ‘भाप’ क्षणभंगुरता, अस्थिरता और पकड़ में न आने का तनाव खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चटचटाहट’ उपमा की श्रव्य तीव्रता व्यक्त करती है, जबकि ‘भाप’ सभोपदेशक के प्रमुख रूपक को अमूर्त निष्कर्ष में बदले बिना सामान्य पाठक तक पहुँचाती है।
