  yaml_path: translation/ot/ecclesiastes/007/019.yaml
  text: Wisdom gives strength to a wise man more than ten rulers who were in a city[a].
translation:
  language: hi
  text: बुद्धि बुद्धिमान को दस शासकों से अधिक सामर्थ्य देती है, जो नगर में थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस नगर में।” इब्रानी में निश्चित उपपद है, पर यह कथन किसी विशेष नगर के बजाय सामान्य नीतिवचन भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחָכְמָה
  choice: बुद्धि
  rationale: यह अमूर्त संज्ञा सभोपदेशक की नीतिपरक शैली में सामान्य रूप से प्रयुक्त है; हिन्दी में ‘बुद्धि’ स्वाभाविक है और अनावश्यक व्यक्तिकरण नहीं करती।
- source_word: תָּעֹז
  choice: सामर्थ्य देती है
  rationale: यह क्रिया बलवान करने या बल देने का भाव व्यक्त करती है। ‘सामर्थ्य देती है’ उसके causative भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: לֶחָכָם
  choice: बुद्धिमान को
  rationale: ל उपसर्ग यहाँ प्राप्तकर्ता अथवा हित का बोध कराता है; एकवचन रूप को ‘बुद्धिमान को’ से संक्षिप्त और नीतिवचन-सुलभ ढंग से रखा गया है।
- source_word: מֵעֲשָׂרָה
  choice: दस ... से अधिक
  rationale: מִן यहाँ तुलना सूचित करता है; हिन्दी में ‘से अधिक’ इसी तुलनात्मक संबंध को सीधे व्यक्त करता है।
- source_word: שַׁלִּיטִים
  choice: शासकों
  rationale: यह शब्द अधिकार या प्रभुत्व रखनेवालों को दर्शाता है। नगर के संदर्भ में ‘शासक’ व्यापक, स्पष्ट और स्वाभाविक विकल्प है।
- source_word: אֲשֶׁר הָיוּ בָּעִיר
  choice: नगर में रहनेवाले
  rationale: सापेक्ष उपवाक्य दस शासकों का वर्णन करता है। हिन्दी का कृदंत-रूप अर्थ को संक्षेप में और सहजता से व्यक्त करता है; ‘नगर’ विशिष्टता को अनिर्धारित छोड़ सकता है।
