  yaml_path: translation/ot/ecclesiastes/007/022.yaml
  text: For your heart knows that many times you yourself have also cursed others[a].
translation:
  language: hi
  text: क्योंकि तुम्हारा मन जानता है कि तुमने भी कई बार दूसरों को कोसा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरों की निंदा की है” अथवा “दूसरों के विरुद्ध बुरा कहा है।” इब्रानी क्रिया का अर्थ वाणी से कोसना हो सकता है, पर इस प्रसंग में यह अधिक व्यापक रूप से अपमान करने या किसी के विरुद्ध बोलने को भी सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַּם פְּעָמִים רַבּוֹת
  choice: भी कई बार
  rationale: पहला גַּם और ‘बहुत बार’ का पदबंध मिलकर श्रोता के अपने बार-बार किए गए व्यवहार को सामने लाते हैं; हिन्दी शब्दक्रम में ‘भी कई बार’ सहज है।
- source_word: יָדַע לִבֶּךָ
  choice: तुम्हारा मन जानता है
  rationale: इब्रानी ‘हृदय’ यहाँ अंतर्मन, विचार और आत्मचेतना का बोध कराता है। आधुनिक हिन्दी में ‘मन’ इस अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘जानता है’ स्थिर व्यक्तिगत जानकारी को बनाए रखता है।
- source_word: גַּם אַתָּה
  choice: तुमने भी
  rationale: स्वतंत्र सर्वनाम के साथ גַּם श्रोता को दूसरों के समान दोषी ठहराने पर बल देता है; ‘तुमने भी’ हिन्दी में यह समावेशी जोर स्पष्ट रखता है।
- source_word: קִלַּלְתָּ
  choice: कोसा है
  rationale: क्रिया वाणी से शाप देने, निंदा करने या अपमानजनक ढंग से बोलने को व्यक्त कर सकती है। प्रसंग और सामान्य आधुनिक हिन्दी में ‘कोसा है’ उचित तीव्रता रखता है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲחֵרִים
  choice: दूसरों को
  rationale: यह अनिश्चित बहुवचन में अन्य व्यक्तियों को सूचित करता है; ‘दूसरों को’ संक्षिप्त और स्वाभाविक है।
