  text: רְאֵה֙ זֶ֣ה מָצָ֔אתִי אָמְרָ֖ה קֹהֶ֑לֶת אַחַ֥ת לְ/אַחַ֖ת לִ/מְצֹ֥א חֶשְׁבּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/027.yaml
  text: See, this is what I found, says Qoheleth, adding one thing to another to find the sum.
translation:
  language: hi
  text: 'देखो, कोहेलेत कहती है, “मैंने यह पाया: हिसाब निकालने के लिए एक बात को दूसरी बात से जोड़ते जाना।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हिसाब” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “लेखा,” “गणना,” “योजना,” या तर्क से निकला “निष्कर्ष” भी हो सकता है।
    reason: חֶשְׁבּוֹן की अर्थ-व्याप्ति और पद में बनी हुई अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: קֹהֶלֶת
  choice: सभोपदेशक
  rationale: यह पारंपरिक और सामान्य हिन्दी पदनाम है; यहाँ स्त्रीलिंग क्रिया אָמְרָה के कारण ‘कहती है’ रखा गया है, जबकि पदनाम की भूमिका/पहचान को अलग से स्त्री व्यक्ति के रूप में निश्चित नहीं किया गया।
- source_word: אַחַת לְאַחַת
  choice: एक बात को दूसरी बात से जोड़ते जाना
  rationale: शाब्दिक ‘एक से एक’ की गणनात्मक और क्रमिक प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶשְׁבּוֹן
  choice: कुल परिणाम
  rationale: संज्ञा का अर्थ गणना, लेखा या तर्क से निकले निष्कर्ष तक फैलता है; संदर्भ में अलग-अलग बातों को जोड़कर प्राप्त समग्र परिणाम उपयुक्त है।
- source_word: רְאֵה זֶה מָצָאתִי
  choice: देखो, मैंने यह पाया है
  rationale: आह्वान ‘देखो’ और प्रथम पुरुष खोज-वक्तव्य दोनों को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: קֹהֶלֶת की पहचान और व्याकरणिक लिंग
  choice: पारंपरिक पदनाम ‘सभोपदेशक’ के साथ पाठ में उपस्थित स्त्रीलिंग ‘कहती है’
  alternative: ‘उपदेशक कहता है’ या लिप्यंतरण ‘कोहेलेत कहती है’
  rationale: मसोरेटी पाठ की स्त्रीलिंग क्रिया को मिटाए बिना हिन्दी पाठकों के परिचित पदनाम को बनाए रखा गया; इससे वक्ता की ऐतिहासिक पहचान या जैविक लिंग पर अनावश्यक निष्कर्ष नहीं थोपा जाता।
- issue: חֶשְׁבּוֹן का आशय
  choice: कुल परिणाम
  alternative: हिसाब, योजना, या स्पष्टीकरण
  rationale: इस पद की खोज-प्रक्रिया में ‘एक बात को दूसरी से जोड़ने’ के साथ गणनात्मक अर्थ सबसे सहज है, फिर भी टिप्पणी में अर्थ-सीमा स्वीकार की गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य की खोजपरक तथा गणनात्मक गति बनाए रखी गई है; ‘सभोपदेशक’ परिचित पदनाम है, जबकि स्त्रीलिंग क्रिया मूल पाठ के असामान्य व्याकरण को दर्शाती है।
