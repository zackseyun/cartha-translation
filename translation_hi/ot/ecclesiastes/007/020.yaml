  yaml_path: translation/ot/ecclesiastes/007/020.yaml
  text: For there is no righteous man on the earth who does good and does not sin[a].
translation:
  language: hi
  text: क्योंकि पृथ्वी पर कोई ऐसा धर्मी मनुष्य[a] नहीं है, जो भलाई करे और पाप न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य’ एकवचन है, पर यहाँ वह समस्त मानवता का प्रतिनिधित्व करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले कथन का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में उस तार्किक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन संज्ञा प्रतिनिधिक और सार्वभौमिक अर्थ में है। ‘मनुष्य’ हिन्दी में स्त्री-पुरुष सभी को समेटते हुए एकवचन की नीतिवचनात्मक शक्ति बनाए रखता है।
- source_word: אֵין צַדִּיק
  choice: कोई ऐसा धर्मी मनुष्य नहीं है
  rationale: अस्तित्ववाचक निषेध אֵין को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है, और צַדִּיק के लिए पारदर्शी धार्मिक-मौखिक शब्द ‘धर्मी’ रखा गया है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: सभोपदेशक के व्यापक मानवीय संदर्भ में इसका अर्थ किसी विशेष देश के बजाय समूची पृथ्वी पर मानव जीवन है।
- source_word: יַעֲשֶׂה טּוֹב
  choice: भलाई करे
  rationale: यह संक्षिप्त अभिव्यक्ति मूल की नीतिवचनात्मक शैली और नैतिक अर्थ दोनों को बनाए रखती है।
- source_word: וְלֹא יֶחֱטָא
  choice: और पाप न करे
  rationale: समन्वयी रचना को स्पष्ट रखा गया है और क्रिया के पक्ष को ‘कभी पाप न करे’ कहकर अनावश्यक रूप से अधिक निश्चित नहीं बनाया गया।
theological_decisions:
- issue: प्रतिनिधिक एकवचन में मानवता के विषय में सार्वभौमिक कथन
  choice: मनुष्य
  alternative: व्यक्ति / मानवजाति
  rationale: אָדָם व्याकरणिक रूप से एकवचन है, पर यहाँ पूरी मानवता का प्रतिनिधित्व करता है। ‘मनुष्य’ इस सार्वभौमिक अर्थ के साथ एकवचन रूप और गरिमापूर्ण शैली दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और नीतिवचनात्मक शैली। ‘धर्मी’, ‘भलाई’ और ‘पाप’ जैसे परिचित शब्द मूल पाठ के नैतिक और धर्मवैचारिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखते हैं।
