id: ECC.7.2
reference: Ecclesiastes 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ט֞וֹב לָ/לֶ֣כֶת אֶל בֵּֽית אֵ֗בֶל מִ/לֶּ֨כֶת֙ אֶל בֵּ֣ית מִשְׁתֶּ֔ה בַּ/אֲשֶׁ֕ר ה֖וּא ס֣וֹף כָּל הָ/אָדָ֑ם וְ/הַ/חַ֖י יִתֵּ֥ן אֶל לִבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/002.yaml
  text: It is better to go to a house of mourning than to go to a house of feasting[a], because that is the end of every person, and the living should take it to heart.
translation:
  language: hi
  text: शोक के घर जाना दावत के घर जाने से अच्छा है, क्योंकि यही हर मनुष्य[a] का अंत है, और जो जीवित है वह इस बात को मन में रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त मानवजाति का अंत।” हिब्रू शब्द אָדָם यहाँ पूरी मानवता के लिए सामान्य अर्थ में प्रयुक्त है।
    reason: मूल के सामान्य मानवीय अर्थ और उसके सामूहिक वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह तुलनात्मक बुद्धि-वचन है; ‘...से अच्छा है’ आधुनिक हिन्दी में तुलना को स्वाभाविक और स्पष्ट बनाता है।
- source_word: לָלֶכֶת / מִלֶּכֶת
  choice: जाना ... जाने से
  rationale: इस प्रसंग में הלך का अर्थ किसी स्थान या अवसर पर ‘जाना’ है; ‘चलना’ अनावश्यक रूप से शाब्दिक होता।
- source_word: בֵּית אֵבֶל
  choice: शोक का घर
  rationale: यह मूल रचना ‘शोक का घर’ को निकटता से रखता है और मृत्यु के कारण शोक मनाए जाने वाले घर का स्वाभाविक हिन्दी बोध देता है।
- source_word: בֵּית מִשְׁתֶּה
  choice: दावत का घर
  rationale: מִשְׁתֶּה भोज और प्रायः पान सहित उत्सव को सूचित करता है; ‘दावत’ शोक के विपरीत सामूहिक उत्सव का सहज आधुनिक हिन्दी रूप है।
- source_word: בַּאֲשֶׁר
  choice: क्योंकि
  rationale: यह तुलना का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके कारणवाचक बल को साफ रखता है।
- source_word: סוֹף כָּל הָאָדָם
  choice: हर मनुष्य का अंत
  rationale: כָּל के साथ הָאָדָם यहाँ समस्त मानवता के प्रत्येक सदस्य को सामान्य रूप से दर्शाता है; ‘हर मनुष्य’ हिन्दी में समावेशी और मूल के निकट है।
- source_word: וְהַחַי
  choice: जो जीवित है
  rationale: लेखयुक्त एकवचन का प्रयोग सामान्य वर्ग के लिए है; ‘जो जीवित है’ उस सामूहिक-सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: יִתֵּן אֶל לִבּוֹ
  choice: इस बात को मन में रखे
  rationale: शाब्दिक अर्थ ‘अपने हृदय की ओर दे’ है। हिन्दी मुहावरा ‘मन में रखना’ गंभीरता से विचार और स्मरण करने का आशय देता है; ‘रखे’ ज्ञान-साहित्य की उपदेशात्मक शक्ति को बनाए रखता है।
theological_decisions:
- issue: הָאָדָם का सार्वभौमिक मानवीय अर्थ
  choice: हर मनुष्य
  alternative: समस्त मानवजाति
  rationale: यहाँ אָדָם किसी पुरुष-विशेष या केवल पुरुषों के लिए नहीं, बल्कि नश्वर मानवता के लिए सामान्य रूप से आया है। ‘हर मनुष्य’ व्यक्तिगत सार्वभौमिकता को बनाए रखता है; पादटिप्पणी सामूहिक विकल्प स्पष्ट करती है।
- issue: הוּא (‘यही’) का संदर्भ
  choice: यही हर मनुष्य का अंत है
  alternative: मृत्यु हर मनुष्य का अंत है
  rationale: मूल पाठ सर्वनाम के द्वारा संदर्भ देता है और ‘मृत्यु’ शब्द को स्पष्ट रूप से नहीं जोड़ता। ‘यही’ शोक-घर में सामने आने वाली मृत्यु की वास्तविकता की ओर संकेत करते हुए मूल की संक्षिप्तता और कुछ संदर्भगत खुलापन बचाता है।
- issue: יִתֵּן का उपदेशात्मक या भविष्यसूचक बल
  choice: मन में रखे
  alternative: मन में रखेगा
  rationale: अपूर्ण क्रिया-रूप को केवल भविष्यवाणी मानना आवश्यक नहीं; ज्ञान-वचन के प्रसंग में यह उचित मानवीय प्रतिक्रिया बताता है। ‘रखे’ उस उपदेशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शोक का घर’ और ‘दावत का घर’ मूल के समानांतर रूप को बनाए रखते हैं; वाक्य में अनावश्यक व्याख्यात्मक शब्द नहीं जोड़े गए हैं।
