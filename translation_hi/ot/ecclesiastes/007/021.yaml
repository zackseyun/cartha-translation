base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/021.yaml
  text: Also[a], do not give your heart to every word that is spoken[b], lest you hear your servant cursing you.
translation:
  language: hi
  text: साथ ही, कही जाने वाली हर बात को मन पर मत लो,[a] कहीं ऐसा न हो कि तुम अपने सेवक[b] को तुम्हें कोसते सुनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “उनकी कही हुई हर बात को अपना हृदय मत दो।”
    reason: lexical_alternative
  - marker: b
    text: “सेवक” का अनुवाद “दास” भी किया जा सकता है; इब्रानी शब्द עֶבֶד प्रसंग के अनुसार दोनों अर्थ रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: फिर
  rationale: यह आसपास के उपदेश से जुड़ी एक और बुद्धिमानी की बात प्रस्तुत करता है; ‘फिर’ आधुनिक हिन्दी में इसके योगात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְכָל הַדְּבָרִים אֲשֶׁר יְדַבֵּרוּ
  choice: कही जानेवाली हर बात को
  rationale: דְּבָרִים का अर्थ ‘बातें/वचन/विषय’ हो सकता है; आगे ‘सुनो’ आने के कारण यहाँ बोली गई बातें अभिप्रेत हैं। इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है, जिसे हिन्दी का कर्मवाच्य स्वाभाविक रूप से बनाए रखता है।
- source_word: אַל תִּתֵּן לִבֶּךָ
  choice: मन पर मत लो
  rationale: शाब्दिक अर्थ ‘अपना हृदय मत दो’ है, पर यहाँ मुहावरे का आशय किसी बात को भीतर तक ग्रहण करना या उस पर गंभीर ध्यान देना है। ‘मन पर मत लो’ हिन्दी में स्वाभाविक है और आंतरिक प्रभाव की छवि भी बचाता है।
- source_word: אֲשֶׁר לֹא תִשְׁמַע
  choice: कहीं ऐसा न हो कि तुम ... सुनो
  rationale: निषेध के बाद यह अवांछित परिणाम की चेतावनी देता है; यह हिन्दी संरचना उस आशंका को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: עַבְדְּךָ
  choice: अपने सेवक
  rationale: עֶבֶד सेवक या दास दोनों को सूचित कर सकता है। इस प्रसंग में अधीनस्थ घरेलू व्यक्ति का संबंध प्रमुख है, इसलिए मुख्य पाठ में ‘सेवक’ उपयुक्त है और ‘दास’ को पादटिप्पणी में रखा गया है।
- source_word: מְקַלְלֶךָ
  choice: तुम्हें कोसते हुए
  rationale: קלל यहाँ कोसने, अपमानित करने या बुरा कहने के अर्थ में है। ‘कोसना’ सीधा, वर्तमान और प्रसंगानुकूल हिन्दी रूप है।
