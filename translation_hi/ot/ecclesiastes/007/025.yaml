  text: סַבּ֨וֹתִֽי אֲנִ֤י וְ/לִבִּ/י֙ לָ/דַ֣עַת וְ/לָ/ת֔וּר וּ/בַקֵּ֥שׁ חָכְמָ֖ה וְ/חֶשְׁבּ֑וֹן וְ/לָ/דַ֨עַת֙ רֶ֣שַׁע כֶּ֔סֶל וְ/הַ/סִּכְל֖וּת הוֹלֵלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/025.yaml
  text: I turned[a], I and my heart, to know and to search out and seek wisdom and an explanation[c][b], and to know that wickedness is folly and foolishness is madness.
translation:
  language: hi
  text: मैंने—मैंने और मेरे मन ने—बुद्धि और विवेचना[a] को जानने, जाँचने और खोजने की ओर रुख किया, और यह जानने की ओर भी कि दुष्टता मूर्खता है और नासमझी पागलपन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिसाब,” “योजना,” अथवा “तर्कसंगत विवरण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סַבּוֹתִי
  choice: मैंने ... रुख किया
  rationale: क्रिया סבב के मुड़ने या दिशा बदलने के ठोस बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲנִי וְלִבִּי
  choice: मैंने और मेरे मन ने
  rationale: हिब्रू में वक्ता और उसके 'हृदय' का स्पष्ट समन्वय है। हिन्दी में बौद्धिक खोज के संदर्भ में 'मन' स्वाभाविक है और भीतरी विचार तथा संकल्प, दोनों को व्यक्त करता है।
- source_word: לָדַעַת
  choice: जानने
  rationale: ידע की पुनरावृत्ति को दोनों स्थानों पर 'जानना' रखकर मूल की लय और उद्देश्य सुरक्षित किए गए हैं।
- source_word: לָתוּר
  choice: जाँचने
  rationale: תור की खोजबीन या छानबीन की भावना को व्यक्त करता है और इसके बाद आने वाले בקש से अलग क्रिया बना रहता है।
- source_word: וּבַקֵּשׁ
  choice: खोजने
  rationale: בקש का सामान्य अर्थ तलाशना या खोजना है; संचित खोजपरक क्रियाओं की शैली बनाए रखी गई है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: सभोपदेशक के ज्ञान-साहित्यिक संदर्भ में חכמה का मानक और सुबोध हिन्दी समतुल्य।
- source_word: חֶשְׁבּוֹן
  choice: तर्कपूर्ण विवेचना
  rationale: शब्द में गणना, हिसाब, योजना और तार्किक निष्कर्ष की अर्थ-सीमा है। यह चयन बौद्धिक पड़ताल के संदर्भ के अनुकूल है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: नैतिक बुराई और दोष के अर्थ को व्यापक 'बुराई' की तुलना में अधिक स्पष्टता से व्यक्त करता है।
- source_word: כֶּסֶל
  choice: मूर्खता
  rationale: ज्ञान-साहित्य में नैतिक रूप से आवेशित मूढ़ता का स्वाभाविक हिन्दी रूप।
- source_word: הַסִּכְלוּת
  choice: नासमझी
  rationale: निकटार्थी शब्द כסל से हिन्दी में भेद रखते हुए बौद्धिक और नैतिक अविवेक की भावना व्यक्त करता है।
- source_word: הוֹלֵלוֹת
  choice: पागलपन
  rationale: सभोपदेशक में विवेकहीन उन्माद के लिए स्वाभाविक और स्थापित अर्थ देता है।
theological_decisions:
- issue: לֵב की मानवशास्त्रीय भाषा
  choice: मुख्य पाठ में 'मन'
  alternative: '''हृदय'''
  rationale: हिब्रू 'हृदय' विचार, विवेक और संकल्प का केंद्र है। आधुनिक हिन्दी में इस बौद्धिक प्रसंग में 'मन' वही कार्य अधिक स्वाभाविक ढंग से संप्रेषित करता है; इसे केवल भावना के अर्थ में सीमित नहीं किया गया।
- issue: अंतिम दो संज्ञा-खंडों का संबंध
  choice: '''दुष्टता मूर्खता है और नासमझी पागलपन'' के रूप में विधेयात्मक कथन'
  alternative: '''मूर्खता की दुष्टता और पागलपन की नासमझी'' अथवा कर्म-समानाधिकरण'
  rationale: हिब्रू में क्रियारहित, संक्षिप्त नाममात्र अभिव्यक्तियाँ हैं। हिन्दी में 'है' जोड़ना संभावित विधेयात्मक अर्थ को स्पष्ट करता है, पर अर्थगत तनाव को अतिरिक्त धर्मशास्त्रीय व्याख्या से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की आत्मपरक पुनरुक्ति और खोज से जुड़ी क्रियाओं की शृंखला को यथासंभव बनाए रखा गया है।
