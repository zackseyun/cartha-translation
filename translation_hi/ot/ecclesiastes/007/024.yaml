lexical_decisions:
- source_word: רָחוֹק
  choice: बहुत दूर
  rationale: यह विधेयात्मक विशेषण दूरी और पहुँच से परे होने का बोध देता है। हिन्दी में ‘बहुत दूर’ स्वाभाविक है और अगम्यता का रूपक बनाए रखता है।
- source_word: מַה שֶּׁהָיָה
  choice: जो कुछ हुआ है
  rationale: היה के पूर्ण रूप सहित यह सम्बन्धवाचक पदबंध ‘जो हो चुका है’ या ‘जो अस्तित्व में आया है’ की ओर संकेत करता है। ‘जो कुछ हुआ है’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: וְעָמֹק עָמֹק
  choice: और अत्यन्त गहरा
  rationale: विशेषण की पुनरावृत्ति अर्थ को तीव्र करती है। ‘अत्यन्त गहरा’ आधुनिक हिन्दी में इस बल को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक पुनरावृत्ति पाद-टिप्पणी में दी गई है।
- source_word: מִי
  choice: कौन
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला सामान्य प्रश्नवाचक सर्वनाम है।
- source_word: יִמְצָאֶנּוּ
  choice: उसे कौन खोज सकता है
  rationale: מצא का अर्थ ‘खोजना’ या ‘पता लगाना’ है। पुल्लिंग एकवचन प्रत्यय यहाँ पहले वर्णित विषय या वास्तविकता की ओर लौटता है; ‘उसे’ हिन्दी में उस अस्पष्ट संदर्भ को बनाए रखता है। ‘सकता है’ प्रश्न की असमर्थता-सूचक आलंकारिक शक्ति व्यक्त करता है।
