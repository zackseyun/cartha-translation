    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִית
  choice: अंत
  rationale: यह शब्द किसी बात के अंतिम भाग या परिणाम को सूचित कर सकता है। यहाँ רֵאשִׁית (‘आरंभ’) के साथ सीधे विरोध के कारण ‘अंत’ सबसे स्वाभाविक है, जबकि परिणाम का भाव भी संदर्भ में बना रहता है।
- source_word: דָּבָר
  choice: बात
  rationale: דָּבָר का अर्थ शब्द, वस्तु, विषय या मामला हो सकता है। इस नीतिवचन में ‘बात’ सामान्य और सहज हिंदी में किसी विषय, कार्य या घटनाक्रम को समेटती है।
- source_word: מֵרֵאשִׁיתוֹ
  choice: उसके आरंभ से
  rationale: מִן यहाँ तुलना व्यक्त करता है, और प्रत्यय उसी ‘बात’ की ओर संकेत करता है; इसलिए ‘उसके आरंभ से’ स्रोत की तुलना को स्पष्ट रखता है।
- source_word: אֶרֶךְ רוּחַ
  choice: धीरज रखनेवाला
  rationale: शाब्दिक रूप से ‘आत्मा/मन में लंबा’ यह इब्रानी मुहावरा धैर्य, सहनशीलता या क्रोध करने में धीमे होने को दर्शाता है। व्यक्ति-सूचक हिंदी अभिव्यक्ति समानांतर ‘घमंडी’ के साथ स्वाभाविक बैठती है।
- source_word: מִגְּבַהּ רוּחַ
  choice: घमंडी से
  rationale: ‘ऊँची आत्मा/मन वाला’ यहाँ सकारात्मक उत्साह नहीं, बल्कि अभिमानी या अहंकारी स्वभाव दर्शाता है। ‘घमंडी’ आधुनिक हिंदी में इस नकारात्मक भाव को स्पष्ट करता है।
- source_word: טוֹב
  choice: अच्छा है
  rationale: दोनों खंडों में טוֹב, מִן के साथ तुलनात्मक अर्थ देता है। हिंदी में ‘से अच्छा है’ इस तुलना को स्वाभाविक रूप से व्यक्त करता है।
