source:
  edition: WLC
  text: כִּ֛י בְּ/צֵ֥ל הַֽ/חָכְמָ֖ה בְּ/צֵ֣ל הַ/כָּ֑סֶף וְ/יִתְר֣וֹן דַּ֔עַת הַֽ/חָכְמָ֖ה תְּחַיֶּ֥ה בְעָלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/012.yaml
  text: For wisdom is a shelter just as money is a shelter[b][a], but the advantage of knowledge is that wisdom preserves the life of its possessors.
translation:
  language: hi
  text: क्योंकि बुद्धि की छाया में होना धन की छाया में होने के समान है[a]; पर ज्ञान का लाभ यह है कि बुद्धि जो उसे रखते हैं, उन्हें जीवित रखती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में अक्षरशः, “क्योंकि बुद्धि की छाया में, धन की छाया में।” यहाँ “छाया” सुरक्षा या आश्रय का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अनुवाद यह भी हो सकता है, “बुद्धि जो उसे रखते हैं, उन्हें जीवन देती है।” इब्रानी क्रिया का अर्थ “जीवित रखना” या “जीवन देना” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּצֵל הַחָכְמָה בְּצֵל הַכָּסֶף
  choice: बुद्धि छाया देती है, जैसे धन छाया देता है
  rationale: मूल में अक्षरशः ‘बुद्धि की छाया में, धन की छाया में’ है। ‘छाया देती है’ सुरक्षा के चित्र को बनाए रखते हुए हिन्दी में लुप्त क्रिया और तुलना को स्पष्ट करता है।
- source_word: הַחָכְמָה
  choice: बुद्धि
  rationale: सभोपदेशक में חָכְמָה के व्यावहारिक और जीवन-संबंधी अर्थ के लिए मानक तथा सहज हिन्दी शब्द।
- source_word: הַכָּסֶף
  choice: धन
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, पर यहाँ आर्थिक साधन या संपत्ति अभिप्रेत है; ‘धन’ आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: וְיִתְרוֹן דַּעַת
  choice: पर ज्ञान का लाभ
  rationale: יִתְרוֹן लाभ, बढ़त या विशेष फायदा दर्शाता है। ‘पर’ पहले समानता के बाद बुद्धि के अतिरिक्त लाभ को उभारता है, जबकि कठिन संबंध ‘ज्ञान का लाभ’ के रूप में बिना अधिक व्याख्या के रखा गया है।
- source_word: תְּחַיֶּה
  choice: जीवन बचाए रखती है
  rationale: חיה के पिएल रूप में ‘जीवित रखना’, ‘जीवन देना’ या ‘जीवन बनाए रखना’ संभव है। संदर्भ में संरक्षण का भाव उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בְעָלֶיהָ
  choice: अपने रखनेवालों
  rationale: शाब्दिक अर्थ ‘उसके स्वामी/धारक’ है और स्त्रीलिंग प्रत्यय बुद्धि की ओर लौटता है। ‘अपने रखनेवालों’ साधारण हिन्दी में उस स्वामित्व-संबंध को बनाए रखता है।
