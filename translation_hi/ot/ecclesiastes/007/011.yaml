  yaml_path: translation/ot/ecclesiastes/007/011.yaml
  text: Wisdom is good with an inheritance[b][a], and an advantage to those who see the sun.
translation:
  language: hi
  text: विरासत के साथ बुद्धि अच्छी है[a], और सूर्य को देखने वालों के लिए लाभदायक है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि विरासत के समान अच्छी है।” इब्रानी वाक्यरचना बुद्धि की विरासत से तुलना कर सकती है, या विरासत के साथ बुद्धि की भलाई बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: “सूर्य को देखने वाले” जीवित लोगों के लिए प्रयुक्त मुहावरा है, अर्थात इस संसार में जीवित रहने वाले।
    reason: cultural_note
lexical_decisions:
- source_word: טוֹבָה
  choice: अच्छी है
  rationale: यह विधेय विशेषण सामान्यतः ‘अच्छी’ का अर्थ देता है। इब्रानी में क्रिया व्यक्त नहीं है, इसलिए स्वाभाविक हिन्दी के लिए ‘है’ जोड़ा गया है; स्पष्ट तुलनात्मक रूप न होने के कारण मुख्य पाठ में ‘बेहतर’ नहीं अपनाया गया।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: सभोपदेशक में यह व्यावहारिक विवेक और जीवन-कौशल को दर्शाता है; ‘बुद्धि’ इसका प्रचलित और सहज हिन्दी रूप है।
- source_word: עִם
  choice: के साथ
  rationale: यहाँ पूर्वसर्ग संगति या साथ होने का भाव सबसे स्वाभाविक रूप से व्यक्त करता है, यद्यपि रचना में तुलना की संभावना भी है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: शब्द का मूल अर्थ उत्तराधिकार में मिली संपत्ति या भाग है; ‘विरासत’ इस अर्थ को व्यापक ‘धन’ की अपेक्षा अधिक ठीक रखता है।
- source_word: וְיֹתֵר
  choice: और … लाभ है
  rationale: יֹתֵר यहाँ ‘लाभ’ या ‘फायदा’ के संज्ञात्मक अर्थ में लिया जा सकता है। हिन्दी वाक्य में इससे आगे आनेवाला ‘के लिए’ पद स्वाभाविक रूप से जुड़ता है।
- source_word: לְרֹאֵי
  choice: देखनेवालों के लिए
  rationale: לְ को लाभ के संबंध में ‘के लिए’ और कृदंत को ‘देखनेवालों’ के रूप में रखा गया है।
- source_word: הַשָּׁמֶשׁ
  choice: सूर्य
  rationale: मूल बिंब को बनाए रखने के लिए शाब्दिक रूप ‘सूर्य’ रखा गया है; पूरे पदबंध का आशय जीवित लोगों से है।
theological_decisions:
- issue: बुद्धि और विरासत के संबंध में इब्रानी रचना की अस्पष्टता
  choice: 'मुख्य पाठ में संगति का अर्थ: ‘विरासत के साथ बुद्धि अच्छी है’'
  alternative: 'तुलनात्मक अर्थ: ‘बुद्धि विरासत के समान अच्छी है’'
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है, पर यह वाक्यरचना तुलना का संकेत भी दे सकती है। मुख्य पाठ अधिक सीधा अर्थ रखता है और पादटिप्पणी वास्तविक वैकल्पिक संभावना सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। मूल का ‘सूर्य को देखनेवाले’ बिंब सुरक्षित है, जबकि उसका मुहावरेदार आशय पादटिप्पणी में स्पष्ट किया गया है।
