source:
  edition: WLC
  text: לְ/בַד֙ רְאֵה זֶ֣ה מָצָ֔אתִי אֲשֶׁ֨ר עָשָׂ֧ה הָ/אֱלֹהִ֛ים אֶת הָ/אָדָ֖ם יָשָׁ֑ר וְ/הֵ֥מָּה בִקְשׁ֖וּ חִשְּׁבֹנ֥וֹת רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/029.yaml
  text: 'Only see this: I have found that God made man upright[b][a], but they have sought out many schemes.'
translation:
  language: hi
  text: देखो, मैंने केवल यही पाया है कि परमेश्वर ने मनुष्य को सीधा बनाया था,[a] पर उन्होंने अनेक युक्तियों की खोज की।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति को सीधा बनाया था।” यहाँ “मनुष्य” समस्त मानवता के लिए है।
    reason: alternative_reading
  - marker: b
    text: “युक्तियाँ” का अर्थ “योजनाएँ,” “उपाय,” “चालें” या “गणनाएँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַד רְאֵה זֶה
  choice: केवल यह देखो
  rationale: यह पद के निष्कर्ष की ओर ध्यान खींचने वाला सीमितकारी वाक्यांश है; यह अनुवाद इब्रानी की प्रत्यक्षता और बल दोनों बनाए रखता है।
- source_word: מָצָאתִי
  choice: मैंने यह पाया है
  rationale: पूर्ण क्रिया उस निष्कर्ष को व्यक्त करती है जिस तक वक्ता पहुँच चुका है और जो वर्तमान कथन के लिए प्रासंगिक है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस संदर्भ में निश्चित रूप का स्वाभाविक और मानक हिन्दी अनुवाद।
- source_word: עָשָׂה ... אֶת־הָאָדָם יָשָׁר
  choice: मनुष्य को सीधा बनाया था
  rationale: יָשָׁר का मूल बिंब ‘सीधा’ है और यहाँ नैतिक खरेपन का अर्थ रखता है। ‘मनुष्य’ הָאָדָם के जातिवाचक एकवचन को बनाए रखता है। पूर्वकालिक ‘था’ अगले विरोधी खंड से पहले की स्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְהֵמָּה
  choice: पर उन्होंने
  rationale: बहुवचन सर्वनाम सामूहिक मानवजाति की ओर लौटता है। ‘पर’ मूल संयोजक में निहित प्रबल विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּקְשׁוּ
  choice: खोज निकालीं
  rationale: मूल अर्थ ‘ढूँढ़ना/खोजना’ है; ‘खोज निकालीं’ जानबूझकर अनेक उपाय गढ़ने या अपनाने का भाव सहज हिन्दी में देता है।
- source_word: חִשְּׁבֹנוֹת רַבִּים
  choice: अनेक युक्तियाँ
  rationale: यह बहुअर्थी पद योजनाओं, उपायों, गणनाओं या चालों को सूचित कर सकता है। ‘युक्तियाँ’ आविष्कृत उपायों का व्यापक अर्थ रखता है और मूल की कुछ अस्पष्टता बचाता है।
theological_decisions:
- issue: הָאָדָם का जातिवाचक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में निश्चित एकवचन यहाँ समस्त मानवता का प्रतिनिधित्व करता है। ‘मनुष्य’ उसके व्याकरणिक रूप को निकटता से रखता है, जबकि पादटिप्पणी सामूहिक अर्थ स्पष्ट करती है।
- issue: יָשָׁר का नैतिक आशय
  choice: सीधा
  alternative: खरा / धर्मनिष्ठ
  rationale: ‘सीधा’ इब्रानी के स्थानिक रूपक और नैतिक अर्थ दोनों को खुला रखता है; अधिक स्पष्ट विकल्प अर्थ को केवल नैतिक श्रेणी तक सीमित कर सकते हैं।
- issue: חִשְּׁבֹנוֹת में नैतिक नकारात्मकता की मात्रा
  choice: युक्तियाँ
  alternative: चालें / षड्यंत्र
  rationale: संदर्भ मानव के मूल सीधेपन से विरोध दिखाता है, पर संज्ञा स्वयं केवल दुष्ट षड्यंत्र तक सीमित नहीं है। इसलिए ऐसा शब्द चुना गया है जो योजनाबद्ध उपाय का भाव दे, बिना नकारात्मकता को जरूरत से अधिक तीखा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘देखो’ ध्यानाकर्षक आज्ञा की प्रत्यक्षता बनाए रखता है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
