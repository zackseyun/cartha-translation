  text: אַל תְּהִ֤י צַדִּיק֙ הַרְבֵּ֔ה וְ/אַל תִּתְחַכַּ֖ם יוֹתֵ֑ר לָ֖/מָּה תִּשּׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/016.yaml
  text: Do not be overly righteous[a], and do not make yourself too wise[b]. Why should you ruin yourself?
translation:
  language: hi
  text: अत्यधिक धर्मी मत बनो[a], और अपने आपको बहुत अधिक बुद्धिमान मत बनाओ। तुम क्यों उजड़ जाओगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत अधिक धर्मी मत बनो।”
    reason: lexical_alternative
  - marker: b
    text: या “तुम क्यों नष्ट हो जाओगे?” इब्रानी क्रिया का अर्थ उजड़ जाना या स्तब्ध रह जाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: मत बनो
  rationale: निषेधवाचक אַל के साथ היה का रूप चेतावनीपूर्ण निषेध व्यक्त करता है; हिंदी में “मत बनो” स्वाभाविक और सीधा है।
- source_word: צַדִּיק הַרְבֵּה
  choice: अत्यधिक धर्मी
  rationale: צַדִּיק के नैतिक-धार्मिक अर्थ को “धर्मी” सुरक्षित रखता है और הַרְבֵּה यहाँ अति का भाव देता है। यह अनुवाद कथन की असहजता और तनाव को मिटाता नहीं।
- source_word: תִּתְחַכַּם יוֹתֵר
  choice: अपने आपको बहुत अधिक बुद्धिमान बनाओ
  rationale: חכם का हित्पएल रूप आत्म-संबंधी प्रयास या स्वयं को बुद्धिमान बनाने का भाव दे सकता है; “अपने आपको” उस सूक्ष्मता को बनाए रखता है और יוֹתֵר अति सूचित करता है।
- source_word: לָמָּה
  choice: क्यों
  rationale: यह परिणाम के विषय में चेतावनी देने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: תִּשּׁוֹמֵם
  choice: अपने आपको उजाड़ दोगे
  rationale: שמם का यह रूप उजड़ने, तबाह होने या स्तब्ध रह जाने का अर्थ दे सकता है। “अपने आपको उजाड़ दोगे” मूल की उजाड़/विनाश संबंधी छवि और संदर्भगत आत्म-विनाश दोनों को बनाए रखता है।
theological_decisions:
- issue: “अत्यधिक धर्मी” और “बहुत अधिक बुद्धिमान” होने के विरुद्ध चेतावनी का आशय
  choice: 'पाठ को उसके तनाव सहित रखा गया है: यह अत्यधिक धर्मी बनने और स्वयं को अत्यधिक बुद्धिमान बनाने के विरुद्ध चेतावनी देता है।'
  alternative: इसे केवल आत्मधार्मिकता, दिखावटी भक्ति या झूठी बुद्धिमत्ता के विरुद्ध स्पष्ट कर देना।
  rationale: मूल पाठ स्वयं इन विशेष व्याख्यात्मक शब्दों का प्रयोग नहीं करता। अतिशयता बताने वाले הַרְבֵּה और יוֹתֵר को स्पष्ट रखा गया है, पर यह तय नहीं किया गया कि अति का स्वरूप केवल पाखंड या दिखावा है।
- issue: תִּשּׁוֹמֵם का परिणाम
  choice: “अपने आपको उजाड़ दोगे”
  alternative: “अपने आपको नष्ट कर दोगे” या “स्तब्ध क्यों रह जाओगे?”
  rationale: क्रिया के अर्थक्षेत्र में उजड़ना, विनष्ट होना और स्तब्ध/चकित होना सम्मिलित हैं। मुख्य पाठ में उजाड़ की छवि रखी गई है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, चेतावनीपूर्ण और गरिमापूर्ण शैली रखी गई है। “धर्मी” बाइबलीय नैतिक-धार्मिक शब्दावली को बनाए रखता है, जबकि “अपने आपको” हित्पएल रूप की आत्म-संबंधी सूक्ष्मता स्पष्ट करता है।
