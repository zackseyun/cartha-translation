reference: Ecclesiastes 7:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מוֹצֶ֨א אֲנִ֜י מַ֣ר מִ/מָּ֗וֶת אֶת הָֽ/אִשָּׁה֙ אֲשֶׁר הִ֨יא מְצוֹדִ֧ים וַ/חֲרָמִ֛ים לִבָּ֖/הּ אֲסוּרִ֣ים יָדֶ֑י/הָ ט֞וֹב לִ/פְנֵ֤י הָ/אֱלֹהִים֙ יִמָּלֵ֣ט מִמֶּ֔/נָּה וְ/חוֹטֵ֖א יִלָּ֥כֶד בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/026.yaml
  text: And I find more bitter than death the woman whose heart is traps and nets[a], and whose hands are chains. The one who is good before God will escape from her[b], but the sinner will be caught by her.
translation:
  language: hi
  text: और मुझे वह स्त्री मृत्यु से भी अधिक कड़वी लगती है, जिसका हृदय फंदे और जाल[a] हैं और जिसके हाथ बेड़ियाँ हैं। जो परमेश्वर के सामने भला है, वह उससे बच निकलेगा[b], पर पापी उसके द्वारा पकड़ा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका हृदय फाँसने वाले जाल और शिकारी जाल हैं।”
    reason: इब्रानी के दोनों पकड़ने वाले शब्दों के बीच सम्भावित सूक्ष्म भेद को दर्शाने वाला शाब्दिक विकल्प।
  - marker: b
    text: या, “जो परमेश्वर को प्रसन्न करता है, वह उससे बच निकलेगा।”
    reason: ‘परमेश्वर के सामने भला’ वाक्यांश का सम्भावित मुहावरेदार अर्थ।
lexical_decisions:
- source_word: וּמוֹצֶא אֲנִי
  choice: और मुझे ... लगती है
  rationale: इब्रानी कृदन्त और स्पष्ट कर्ता वक्ता के वर्तमान-जैसे निजी निष्कर्ष को व्यक्त करते हैं। हिन्दी में ‘मुझे ... लगती है’ इस मूल्यांकन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַר מִמָּוֶת
  choice: मृत्यु से भी अधिक कड़वी
  rationale: विशेषण के साथ מִן की तुलनात्मक रचना को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: इब्रानी में निश्चित उपपद है। ‘वह स्त्री’ किसी विशिष्ट पहचान का निर्णय किए बिना उसकी निश्चितता और एकवचन को बनाए रखता है।
- source_word: מְצוֹדִים וַחֲרָמִים
  choice: फंदे और जाल
  rationale: दोनों संज्ञाएँ पकड़ने और उलझाने की छवि रखती हैं। यह युग्म हिन्दी में सजीव तथा सहज है।
- source_word: לִבָּהּ
  choice: जिसका हृदय ... है
  rationale: ‘हृदय’ को बनाए रखने से इच्छा, अभिप्राय और भीतरी व्यक्ति-केंद्र की इब्रानी छवि सुरक्षित रहती है।
- source_word: אֲסוּרִים יָדֶיהָ
  choice: जिसके हाथ बेड़ियाँ हैं
  rationale: अֲסוּרִים बंधनों या बाँधने वाली वस्तुओं को सूचित करता है। ‘बेड़ियाँ’ पकड़ और बंधन की समानांतर छवि को ठोस रूप देता है।
- source_word: טוֹב לִפְנֵי הָאֱלֹהִים
  choice: जो परमेश्वर के सामने भला है
  rationale: यह शाब्दिक अर्थ ‘परमेश्वर के सामने भला’ को सुरक्षित रखता है और ‘परमेश्वर को प्रसन्न करता है’ जैसे अधिक व्याख्यात्मक अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: יִמָּלֵט מִמֶּנָּה
  choice: वह उससे बच निकलेगा
  rationale: निफ़अल रूप का अर्थ बच निकलना है; यह चुनाव पकड़ने के रूपक के साथ स्वाभाविक बैठता है।
- source_word: וְחוֹטֵא
  choice: पर पापी
  rationale: कृदन्त संज्ञात्मक है और पिछले नैतिक वर्णन के साथ स्पष्ट विरोध बनाता है।
- source_word: יִלָּכֶד בָּהּ
  choice: उसके फंदे में पकड़ा जाएगा
  rationale: לכד का निष्क्रिय अर्थ ‘पकड़ा जाना’ है। בָּהּ ‘उसमें/उसके द्वारा’ दोनों का भाव दे सकता है; ‘उसके फंदे में’ पहले की पकड़ने वाली छवि को स्वाभाविक हिन्दी में जोड़ता है।
theological_decisions:
- issue: ‘उस स्त्री’ के चित्रण को सामान्यीकृत या नरम किया जाए या नहीं
  choice: इब्रानी के एकवचन और निश्चित रूप ‘वह स्त्री’ को बनाए रखा गया
  alternative: ‘एक स्त्री’, ‘बहकाने वाली स्त्री’, या ‘मूर्तिमान मूर्खता’
  rationale: पाठ स्वयं यह तय नहीं करता कि वह कोई विशिष्ट अनैतिक स्त्री, एक प्रकार, या मूर्तिमान मूर्खता है। अनुवाद इस तनाव को व्याख्यात्मक रूप से हल नहीं करता और न इसे सभी स्त्रियों पर लागू करता है।
- issue: טוֹב לִפְנֵי הָאֱלֹהִים का अर्थ
  choice: जो परमेश्वर के सामने भला है
  alternative: जो परमेश्वर को प्रसन्न करता है
  rationale: पहला रूप मूल शब्दावली और उसकी सम्भावित न्यायिक अथवा नैतिक छाया को सुरक्षित रखता है; मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- issue: בָּהּ को साधन अथवा स्थान के रूप में प्रस्तुत करना
  choice: उसके फंदे में पकड़ा जाएगा
  alternative: उसके द्वारा पकड़ा जाएगा
  rationale: पूर्ववर्ती फंदों और जालों की छवि के कारण हिन्दी में स्थानगत रूप अधिक स्वाभाविक है, जबकि स्त्री को पकड़ का स्रोत मानने का भाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कड़वी’, ‘फंदे’, ‘जाल’ और ‘बेड़ियाँ’ मूल की तीखी पकड़ तथा बंधन की छवियों को बनाए रखते हैं। स्त्री की पहचान का व्याख्यात्मक निर्णय नहीं किया गया है।
