source:
  edition: WLC
  text: ט֕וֹב לִ/שְׁמֹ֖עַ גַּעֲרַ֣ת חָכָ֑ם מֵ/אִ֕ישׁ שֹׁמֵ֖עַ שִׁ֥יר כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/005.yaml
  text: It is better to hear the rebuke of a wise man than to hear the song of fools[a].
translation:
  language: hi
  text: मूर्खों का गीत सुनने से बुद्धिमान व्यक्ति की डाँट सुनना अच्छा है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान व्यक्ति की डाँट सुनना, मूर्खों का गीत सुनते हुए मनुष्य से अच्छा है।” इब्रानी की दूसरी पंक्ति का शाब्दिक रूप है, “मूर्खों का गीत सुनता हुआ मनुष्य।”
    reason: मूल इब्रानी में אִישׁ (‘मनुष्य’) और उसके साथ कृदंत שֹׁמֵעַ (‘सुनता हुआ’) स्पष्ट हैं; मुख्य पाठ स्वाभाविक हिंदी के लिए इस रचना को क्रियात्मक तुलना के रूप में प्रस्तुत करता है।
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह विशेषण तुलनात्मक रचना में विधेय के रूप में प्रयुक्त है; हिंदी में ‘…से … अच्छा है’ स्वाभाविक ढंग से वरीयता व्यक्त करता है।
- source_word: לִשְׁמֹעַ
  choice: सुनना
  rationale: लामेद सहित क्रिया का infinitive रूप वरीय कार्य बताता है। ‘सुनना’ आगे के שֹׁמֵעַ के साथ मूल पाठ की शब्दगत कड़ी भी बनाए रखता है।
- source_word: גַּעֲרַת
  choice: डाँट
  rationale: यह संज्ञा तीखी मौखिक फटकार या सुधार को दर्शाती है। ‘डाँट’ आधुनिक सामान्य हिंदी में स्पष्ट और स्वाभाविक है तथा कथन की तीक्ष्णता बनाए रखती है।
- source_word: חָכָם
  choice: बुद्धिमान व्यक्ति
  rationale: एकवचन रूप किसी बुद्धिमान जन का संकेत करता है। ‘बुद्धिमान व्यक्ति’ वर्तमान हिंदी में स्वाभाविक है और अनावश्यक रूप से केवल पुरुष तक अर्थ सीमित नहीं करता।
- source_word: מֵאִישׁ
  choice: …से
  rationale: מִן तुलना चिह्नित करता है। मुख्य पाठ में हिंदी की संतुलित तुलना के लिए ‘मूर्खों का गीत सुनने से’ रखा गया है; אִישׁ की स्पष्ट उपस्थिति को पादटिप्पणी में बताया गया है।
- source_word: שֹׁמֵעַ
  choice: सुनने
  rationale: मूल में यह कृदंत है, पर हिंदी में ‘गीत सुनने से’ तुलना को सहज और संक्षिप्त बनाता है तथा पहले ‘सुनना’ के साथ समानांतरता रखता है।
- source_word: שִׁיר
  choice: गीत
  rationale: एकवचन संज्ञा यहाँ सामान्य या सामूहिक अर्थ में प्रयुक्त हो सकती है। ‘गीत’ सीधा और चित्रात्मक अनुवाद है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: बहुवचन शब्द ज्ञान-साहित्य में नैतिक और व्यावहारिक विवेक से रहित लोगों को बताता है। ‘मूर्खों’ उसका संक्षिप्त और प्रचलित हिंदी समतुल्य है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘डाँट’ सामान्य पाठक के लिए ‘भर्त्सना’ या ‘ताड़ना’ से अधिक स्वाभाविक है, जबकि मूल की सुधारात्मक तीक्ष्णता भी बचाती है। मुख्य पाठ में हिंदी की स्वाभाविक समानांतर रचना अपनाई गई है और असामान्य इब्रानी वाक्य-विन्यास को पादटिप्पणी में सुरक्षित रखा गया है।
