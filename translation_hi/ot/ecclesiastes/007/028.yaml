  edition: WLC
  text: אֲשֶׁ֛ר עוֹד בִּקְשָׁ֥ה נַפְשִׁ֖/י וְ/לֹ֣א מָצָ֑אתִי אָדָ֞ם אֶחָ֤ד מֵ/אֶ֨לֶף֙ מָצָ֔אתִי וְ/אִשָּׁ֥ה בְ/כָל אֵ֖לֶּה לֹ֥א מָצָֽאתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/028.yaml
  text: 'which my soul still sought[a], but I did not find: one man among a thousand I found[b], but a woman among all these I did not find.'
translation:
  language: hi
  text: 'जिसकी मेरे मन को अब भी तलाश थी, पर मैंने उसे नहीं पाया: हज़ार में एक पुरुष मिला, पर इन सब में[a] मुझे एक भी स्त्री नहीं मिली।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इन सब” से आशय संभवतः उस पूरे समूह से है जिसकी वह जाँच कर रहा था। यह वचन उसकी खोज में मिले परिणाम को बताता है; यह आवश्यक नहीं कि यह हर स्थान और हर समय की सभी स्त्रियों के बारे में सार्वभौमिक कथन हो।
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר עוֹד בִּקְשָׁה נַפְשִׁי
  choice: जिसे मेरा मन अब भी खोज रहा था
  rationale: अֲשֶׁר पिछले विचार से जुड़े संबंधवाचक उपवाक्य को आरंभ करता है; עוֹד निरंतर खोज को व्यक्त करता है। נַפְשִׁי का यहाँ स्वाभाविक हिन्दी मुहावरा ‘मेरा मन’ है, जो व्यक्ति के भीतरी खोजी भाव को रखता है।
- source_word: וְלֹא מָצָאתִי
  choice: पर मैंने नहीं पाया
  rationale: वाव को खोज और न मिलने के विरोध के कारण ‘पर’ से व्यक्त किया गया है; क्रिया का सीधा अर्थ सुरक्षित है।
- source_word: אָדָם אֶחָד מֵאֶלֶף
  choice: हज़ार पुरुषों में मुझे एक पुरुष मिला
  rationale: स्त्री के साथ स्पष्ट विरोध होने के कारण אָדָם यहाँ लिंग-विशिष्ट ‘पुरुष’ है। ‘हज़ार में एक’ की संख्यात्मक अभिव्यक्ति भी बनी रहती है।
- source_word: וְאִשָּׁה בְכָל אֵלֶּה לֹא מָצָאתִי
  choice: पर इन सब में मुझे एक भी स्त्री नहीं मिली
  rationale: ‘पर’ पिछले निष्कर्ष से विरोध दिखाता है। ‘इन सब में’ בְכָל אֵלֶּה के संदर्भ को जानबूझकर खुला रखता है, और ‘एक भी’ हिन्दी में निषेध का स्वाभाविक बल व्यक्त करता है।
theological_decisions:
- issue: वचन को सभी स्त्रियों पर सार्वभौमिक निर्णय मानने की संभावना
  choice: वक्ता की अपनी खोज में प्राप्त निष्कर्ष के रूप में कथन को सीधे रखा गया है
  alternative: इसे सभी स्त्रियों के चरित्र पर सार्वभौमिक नैतिक निर्णय के रूप में विस्तार देना, या असुविधा घटाने के लिए कथन को नरम कर देना
  rationale: इब्रानी पाठ Qoheleth की खोज का प्रतिवेदन देता है। अनुवाद न तो उसके स्पष्ट कथन को कम करता है, न उसे समस्त स्त्रियों के विषय में सार्वभौमिक सिद्धांत बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरा मन’ सामान्य हिन्दी में נַפְשִׁי का स्वाभाविक रूप है; ‘इन सब’ मूल के संदर्भगत खुलेपन को बनाए रखता है।
