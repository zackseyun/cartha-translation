source:
  edition: WLC
  text: ט֥וֹב כַּ֖עַס מִ/שְּׂחֹ֑ק כִּֽי בְ/רֹ֥עַ פָּנִ֖ים יִ֥יטַב לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/003.yaml
  text: Sorrow is better than laughter[b][a], for by a sad face the heart is made better.
translation:
  language: hi
  text: दुःख हँसी से अच्छा है,[a] क्योंकि चेहरे की उदासी से हृदय बेहतर होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोध हँसी से अच्छा है।” इब्रानी शब्द का अर्थ “क्रोध,” “खिन्नता” या “दुःख” हो सकता है। यहाँ प्रसंग के कारण “दुःख” लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि चेहरे की खराबी से हृदय अच्छा होता है।” यह इब्रानी मुहावरा उदास या व्यथित चेहरे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: מִן के साथ यह तुलनात्मक अर्थ देता है; हिन्दी में ‘हँसी से अच्छा’ स्वाभाविक रूप से ‘better than laughter’ व्यक्त करता है।
- source_word: כַּעַס
  choice: दुःख
  rationale: इस प्रसंग में हँसी के विपरीत गंभीर दुःख तथा उसके लाभकारी प्रभाव की बात है। शब्द ‘क्रोध’ या ‘खिन्नता’ भी व्यक्त कर सकता है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִשְּׂחֹק
  choice: हँसी से
  rationale: שְׂחוֹק का सीधा और आधुनिक हिन्दी समतुल्य ‘हँसी’ है; מִן तुलना को ‘से’ द्वारा व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है।
- source_word: בְרֹעַ פָּנִים
  choice: चेहरे की उदासी से
  rationale: शाब्दिक रूप से ‘चेहरे की बुराई/खराबी से’; यह इब्रानी मुहावरा उदास या व्यथित मुख-मुद्रा को दर्शाता है। चुना हुआ रूप बिंब और साधनवाचक अर्थ दोनों बनाए रखता है।
- source_word: יִיטַב
  choice: बेहतर होता है
  rationale: יטב का अर्थ अच्छा होना या बेहतर होना है। यह रूप हृदय पर पड़ने वाले लाभकारी प्रभाव को व्यक्त करता है, बिना इसे केवल ‘प्रसन्न होना’ मानने के।
- source_word: לֵב
  choice: हृदय
  rationale: ज्ञान-साहित्य में यह विचार, मनोवृत्ति और भीतरी व्यक्ति का व्यापक संकेत है; ‘हृदय’ इस बहुअर्थकता को सुरक्षित रखता है।
