  text: Do not say[b][a], “Why were the former days better than these?” For it is not from wisdom that you ask this.
translation:
  language: hi
  text: यह मत कहो, “बीते हुए दिन इन दिनों से अच्छे क्यों थे?”[a] क्योंकि इस विषय में तुम्हारा पूछना बुद्धि से प्रेरित नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “क्या बात थी कि पहले के दिन इन दिनों से अच्छे थे?”'
    reason: इब्रानी प्रश्न की शाब्दिक बनावट दिखाने और उसके कारणवाचक अर्थ को सुरक्षित रखने के लिए।
  - marker: b
    text: या, “क्योंकि तुमने इस विषय में बुद्धि से प्रेरित होकर नहीं पूछा है।”
    reason: שָׁאַלְתָּ के पूर्णकालीन रूप की संभावित अभिव्यक्ति तथा מֵחָכְמָה के स्रोत/प्रेरणा के भाव को दर्शाने के लिए।
lexical_decisions:
- source_word: אַל תֹּאמַר
