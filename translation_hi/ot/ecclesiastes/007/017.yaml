source:
  edition: WLC
  text: אַל תִּרְשַׁ֥ע הַרְבֵּ֖ה וְ/אַל תְּהִ֣י סָכָ֑ל לָ֥/מָּה תָמ֖וּת בְּ/לֹ֥א עִתֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/017.yaml
  text: Do not be excessively wicked, and do not be a fool. Why should you die before your time?
translation:
  language: hi
  text: अत्यधिक दुष्ट मत बनो[a], और मूर्ख मत बनो। तुम अपने समय से पहले क्यों मरोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत दुष्ट मत बनो।” इब्रानी में परिमाण बताने वाला शब्द है। इससे आस-पास के संदर्भ में जानबूझकर एक तनावपूर्ण अभिव्यक्ति बनती है; इसका अर्थ यह नहीं कि कुछ दुष्टता स्वीकार्य है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उस समय में नहीं जो तुम्हारा है”; अर्थात अपने उचित या अपेक्षित समय से पहले।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּרְשַׁע
  choice: दुष्ट मत बनो
  rationale: रשע के क़ाल रूप को नैतिक आचरण और चरित्र की श्रेणी बनाए रखते हुए संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַרְבֵּה
  choice: बहुत अधिक
  rationale: यह निषेध को परिमाण की दृष्टि से विशेषित करता है। ‘बहुत अधिक’ मूल की जानबूझकर रखी गई तनावपूर्ण अभिव्यक्ति को बिना मिटाए सहज आधुनिक हिन्दी देता है।
- source_word: תְּהִי סָכָל
  choice: मूर्ख मत बनो
  rationale: היה + संज्ञा की रचना का स्वाभाविक हिन्दी रूप है और סכל की संज्ञात्मक शक्ति को बनाए रखता है।
- source_word: לָמָּה
  choice: क्यों
  rationale: चेतावनी देने वाले आलंकारिक प्रश्न को सरल और स्वाभाविक ढंग से आरम्भ करता है।
- source_word: תָמוּת
  choice: तुम ... मरो
  rationale: מות के क़ाल अपूर्ण रूप को आलंकारिक प्रश्न में सम्भावित परिणाम की चेतावनी के रूप में व्यक्त करता है।
- source_word: בְּלֹא עִתֶּךָ
  choice: अपने समय से पहले
  rationale: शाब्दिक ‘अपने समय में नहीं’ का स्पष्ट और मुहावरेदार हिन्दी रूप है; मूल से परे ‘नियुक्त’ जैसी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: क्या पद का अनुवाद ऐसा हो कि वह सीमित मात्रा में दुष्टता की स्वीकृति जैसा लगे
  choice: मूल के परिमाण-सूचक शब्द को ‘बहुत अधिक’ के रूप में बनाए रखकर उसकी आलंकारिक तनावपूर्णता संरक्षित की गई है।
  alternative: ‘बिलकुल दुष्ट मत बनो’ या ‘अति दुष्ट मत बनो’
  rationale: इब्रानी पाठ स्पष्ट रूप से परिमाण-सूचक הַרְבֵּה रखता है और पिछले पद की ‘बहुत अधिक धर्मी’ वाली चेतावनी के समानांतर है। अनुवाद इसे मिटाता नहीं, पर पादटिप्पणी स्पष्ट करती है कि यह किसी मात्रा में दुष्टता की स्वीकृति नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक स्वर रखा गया है। ‘बहुत अधिक दुष्ट’ मूल की असहज किंतु अर्थपूर्ण तनावपूर्णता को सुरक्षित रखता है; ‘मूर्ख मत बनो’ सामान्य पाठक के लिए स्वाभाविक है।
