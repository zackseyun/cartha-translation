  rationale: दो छोटे शैलीगत परिवर्तन आधुनिक मानक हिन्दी में प्रवाह सुधारते हैं। ‘अत्यधिक’ मूल के परिमाण-सूचक शब्द को स्पष्टता से बनाए रखता है, और ‘क्यों मरोगे?’ चेतावनीपूर्ण आलंकारिक प्रश्न के लिए स्वाभाविक हिन्दी भविष्य-रूप है। पादटिप्पणी a में विकल्प को संशोधित मुख्य-पाठ से अलग रखा गया है; दोनों पादटिप्पणी-चिह्न अपने संबंधित अंशों पर बने रहते हैं।
