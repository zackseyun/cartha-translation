source:
  edition: WLC
  text: ט֚וֹב אֲשֶׁ֣ר תֶּאֱחֹ֣ז בָּ/זֶ֔ה וְ/גַם מִ/זֶּ֖ה אַל תַּנַּ֣ח אֶת יָדֶ֑/ךָ כִּֽי יְרֵ֥א אֱלֹהִ֖ים יֵצֵ֥א אֶת כֻּלָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/018.yaml
  text: It is good that you should grasp this[a], and also not let your hand rest from that; for the one who fears God will come out with them all.
translation:
  language: hi
  text: अच्छा है कि तुम इस बात को थामे रहो, और उससे भी अपना हाथ ढीला न पड़ने दो; क्योंकि परमेश्वर का भय मानने वाला उन सबके साथ निकल आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सबमें से निकल आएगा,” अर्थात इन सभी बातों के बीच से सफलतापूर्वक पार निकलेगा। कुछ लोग इसका अधिक व्याख्यात्मक अर्थ “उन सबसे बचेगा” समझते हैं।
    reason: अंतिम इब्रानी पदबंध संक्षिप्त और अर्थ की दृष्टि से विवादित है; पादटिप्पणी उसके मुख्य वैकल्पिक अर्थों को सुरक्षित रखती है।
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: विधेय विशेषण के मूल्यांकनात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר תֶּאֱחֹז בָּזֶה
  choice: कि तुम इस बात को थामे रहो
  rationale: אָחַז के ‘पकड़ना/थामना’ रूपक और प्रसंग के उपदेशात्मक भाव—दोनों को बनाए रखता है। ‘इस बात’ पिछले कथन की ओर संकेत स्पष्ट करता है।
- source_word: וְגַם מִזֶּה אַל תַּנַּח אֶת יָדֶךָ
  choice: और उस बात पर से भी अपना हाथ ढीला न पड़ने दो
  rationale: हाथ और पकड़ के रूपक को बनाए रखते हुए נוח के ‘विश्राम देने/ढीला छोड़ने’ वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है; इसे किसी भिन्न क्रिया के अधिक निर्णायक ‘हाथ हटा लेना’ अर्थ में नहीं बदलता।
- source_word: יְרֵא אֱלֹהִים
  choice: परमेश्वर का भय माननेवाला
  rationale: यह सहभागी पद किसी ऐसे व्यक्ति को दर्शाता है जिसकी स्थायी पहचान परमेश्वर का भय मानना है; हिन्दी बाइबलीय प्रयोग में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: יֵצֵא אֶת כֻּלָּם
  choice: उन सबके साथ निकल आएगा
  rationale: יָצָא के मूल ‘निकलना’ बिंब और कठिन אֶת־כֻּלָּם रचना को यथासंभव खुला रखता है, बिना इसे मुख्य पाठ में ‘बच जाएगा’ या ‘दोनों कर्तव्य पूरे करेगा’ जैसे अधिक व्याख्यात्मक अर्थ में सीमित किए।
theological_decisions:
- issue: अंतिम उपवाक्य का अर्थ
  choice: परमेश्वर का भय माननेवाला ‘उन सबके साथ निकल आएगा,’ जिससे मूल की संक्षिप्त और विवादित अभिव्यक्ति खुली रहती है।
  alternative: वह उन सबमें से सफलतापूर्वक निकल आएगा अथवा दोनों अतियों से बचेगा।
  rationale: इब्रानी יֵצֵא אֶת כֻּלָּם का संबंध और मुहावरेदार बल अनिश्चित है। मुख्य पाठ ‘निकलने’ का बिंब बचाता है और पादटिप्पणी प्रमुख वैकल्पिक समझ बताती है, इसलिए किसी एक धर्मवैचारिक निष्कर्ष को अनावश्यक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर रखा गया है। ‘इस बात…उस बात’ दो संबंधित परामर्शों का भेद दिखाता है; ‘हाथ ढीला न पड़ने दो’ मूल के हाथ वाले रूपक को सहज हिन्दी में बनाए रखता है।
