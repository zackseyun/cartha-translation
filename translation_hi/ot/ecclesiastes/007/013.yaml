id: ECC.7.13
reference: Ecclesiastes 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רְאֵ֖ה אֶת מַעֲשֵׂ֣ה הָ/אֱלֹהִ֑ים כִּ֣י מִ֤י יוּכַל֙ לְ/תַקֵּ֔ן אֵ֖ת אֲשֶׁ֥ר עִוְּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/013.yaml
  text: Consider the work of God[a], for who can straighten what he has made crooked?
translation:
  language: hi
  text: परमेश्वर के काम पर विचार कर, क्योंकि जिसे उसने टेढ़ा कर दिया है, उसे कौन सीधा कर सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे उसने झुका दिया है, उसे कौन सीधा कर सकता है?”
    reason: עוה के लिए ‘टेढ़ा कर दिया’ के साथ ‘झुका दिया’ भी एक सम्भव शाब्दिक विकल्प है।
lexical_decisions:
- source_word: רְאֵה
  choice: विचार कर
  rationale: यह आज्ञार्थक क्रिया यहाँ केवल आँखों से देखने के बजाय परमेश्वर के काम पर मननपूर्वक ध्यान देने को कहती है।
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: परमेश्वर के काम
  rationale: एकवचन पदबंध का अर्थ व्यापक रूप से परमेश्वर के किए हुए कार्य से है; ‘काम’ सहज, व्यापक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले आलंकारिक प्रश्न को पहली आज्ञा का कारण बताने वाली उक्ति के रूप में जोड़ता है।
- source_word: מִי יוּכַל לְתַקֵּן
  choice: कौन सीधा कर सकता है
  rationale: यह सामर्थ्य के विषय में आलंकारिक प्रश्न है। ‘सीधा’ आगे आने वाले ‘टेढ़ा’ के साथ मूल पाठ की ठोस विरोधी छवि बनाए रखता है।
- source_word: אֵת אֲשֶׁר עִוְּתוֹ
  choice: जिसे उसने टेढ़ा कर दिया है
  rationale: क्रिया और उसके पुंलिंग एकवचन कर्तृ-सूचक रूप को स्पष्ट रखते हुए परमेश्वर की ओर संकेत किया गया है; ‘टेढ़ा’ मूल रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: עִוְּתוֹ में निहित तृतीय पुरुष एकवचन कर्ता का संदर्भ
  choice: '‘उसने’ का संदर्भ परमेश्वर से है: जिसे परमेश्वर ने टेढ़ा किया है, उसे कोई सीधा नहीं कर सकता।'
  alternative: ‘जो टेढ़ा हो गया है’ जैसे कर्मवाच्य और कर्ता को अस्पष्ट रखने वाले अनुवाद।
  rationale: निकटतम संदर्भ ‘परमेश्वर के काम’ का है और इब्रानी क्रियारूप व्यक्तिगत कर्ता को व्यक्त करता है। ‘उसने’ मूल पाठ की व्याकरणिक स्पष्टता तथा परमेश्वर की प्रभुता से जुड़ा धर्मवैचारिक तनाव—दोनों को बिना नरम किए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। एकवचन अनौपचारिक आज्ञार्थ ‘विचार कर’ मूल इब्रानी के एकवचन आदेश को सुरक्षित रखता है; वाक्य में ठोस ‘टेढ़ा/सीधा’ विरोध भी बनाए रखा गया है।
