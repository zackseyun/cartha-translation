base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/015.yaml
  text: 'I have seen it all in the days of my vanity: there is a righteous man perishing in his righteousness[c][b][a], and there is a wicked man prolonging his life in his evil.'
translation:
  language: hi
  text: 'अपने क्षणभंगुर दिनों[c] में मैंने यह सब देखा है: कोई धर्मी अपनी धार्मिकता में नाश हो जाता है,[a] और कोई दुष्ट अपनी बुराई में लंबा जीवन जीता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी धार्मिकता के बावजूद नाश हो जाता है।” इब्रानी वाक्यांश एक से अधिक अर्थ दे सकता है; मुख्य पाठ उसकी अस्पष्टता को बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: या, “अपनी बुराई के बावजूद लंबा जीवन जीता है,” अथवा “अपनी बुराई में अपने दिन बढ़ाता है।”
    reason: alternative_reading
  - marker: c
    text: या, “मेरे क्षणिकता के दिनों में” या “मेरे भाप-समान दिनों में।” इब्रानी शब्द हेबेल सभोपदेशक का एक प्रमुख शब्द है, जो अस्थायित्व, पकड़ में न आने वाली प्रकृति, और निराशाजनक विसंगति का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַכֹּל רָאִיתִי
  choice: मैंने यह सब देखा है
  rationale: यह स्वाभाविक हिन्दी में इब्रानी की व्यापकता और उपदेशक के अनुभवपरक चिंतन, दोनों को व्यक्त करता है।
- source_word: בִּימֵי הֶבְלִי
  choice: अपने क्षणभंगुर जीवन के दिनों में
  rationale: הֶבֶל का मूल बिंब भाप या सांस की तरह अल्पस्थायी और पकड़ में न आने वाली वस्तु का है। यहाँ हिन्दी का ‘क्षणभंगुर जीवन’ नैतिक अहंकार का भ्रामक अर्थ लिए बिना वक्ता के नश्वर जीवन को स्पष्ट करता है।
- source_word: יֵשׁ ... וְיֵשׁ
  choice: कोई ... और कोई
  rationale: यह हिन्दी में दो देखे गए प्रतिनिधि मामलों को सहज और संतुलित ढंग से सामने रखता है।
- source_word: צַדִּיק אֹבֵד
  choice: कोई धर्मी ... नाश हो जाता है
  rationale: ‘धर्मी’ संज्ञा के रूप में स्वाभाविक है और אֹבֵד के व्यापक अर्थ—नष्ट होना या असमय मिट जाना—को ‘मर जाता है’ तक सीमित नहीं करता।
- source_word: בְּצִדְקוֹ
  choice: अपनी धार्मिकता में
  rationale: ‘में’ इब्रानी ב की परिस्थिति, विरोध अथवा कारण संबंधी अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: רָשָׁע מַאֲרִיךְ
  choice: कोई दुष्ट ... लंबा जीवन जीता है
  rationale: हिफ़ील रूप का आशय दीर्घकाल तक बने रहने या जीवन बढ़ने से है; हिन्दी में यह अभिव्यक्ति स्वाभाविक है।
- source_word: בְּרָעָתוֹ
  choice: अपनी बुराई में भी
  rationale: ‘में’ मूल संबंध को रखता है, जबकि ‘भी’ अपेक्षित नैतिक परिणाम के विपरीत स्थिति को स्वाभाविक हिन्दी में संकेत करता है; कारण का दावा नहीं किया गया है।
theological_decisions:
- issue: הֶבְלִי का आशय
  choice: अपने क्षणभंगुर जीवन के दिनों में
  alternative: अपने व्यर्थता के दिनों में; अपने भाप-समान दिनों में
  rationale: संदर्भ वक्ता के नैतिक घमंड की नहीं, जीवन की नश्वरता, पकड़ में न आने वाली प्रकृति और निराशाजनक विसंगति की बात करता है।
- issue: בְּצִדְקוֹ और בְּרָעָתוֹ में ב का बल
  choice: मुख्य पाठ में ‘में’ रखकर संबंध को खुला छोड़ा गया है
  alternative: अपनी धार्मिकता के बावजूद / अपनी बुराई के बावजूद; अपनी धार्मिकता के कारण / अपनी बुराई के कारण
  rationale: इब्रानी पूर्वसर्ग परिस्थिति, रियायत या साधन/कारण का भाव दे सकता है। अनुवाद किसी एक धर्मवैज्ञानिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्षणभंगुर जीवन’ सभोपदेशक में הֶבֶל के नश्वरता-वाले भाव को स्पष्ट करता है। दोनों समांतर खंडों में नैतिक विसंगति और मूल की अर्थगत खिंचाव को सुरक्षित रखा गया है।
