  - marker: b
    text: या “मैं बुद्धिमान होऊँगा” अथवा “मैं बुद्धि प्राप्त करूँगा।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात्, बुद्धि मुझसे दूर रही या मेरी पहुँच से परे थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹה
  choice: इन सब बातों को
  rationale: כָּל के साथ एकवचन संकेतवाचक זֹה पिछली बातों को समग्र रूप से दर्शाता है। हिन्दी में “इन सब बातों को” उस संदर्भ को स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: נִסִּיתִי
  choice: मैंने ... परखा
  rationale: पिएल रूप यहाँ जाँचने या कसौटी पर रखने का भाव देता है; “परखा” सभोपदेशक की खोजपरक प्रक्रिया को व्यक्त करता है।
- source_word: בַחָכְמָה
  choice: बुद्धि के द्वारा
  rationale: उपसर्ग ב यहाँ साधन सूचित करता है। “बुद्धि के द्वारा” मूल के साधनात्मक भाव को सीधे बनाए रखता है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: सामान्य क्रिया “कहना” को बनाए रखा गया है; संदर्भ में यह स्वयं से कही गई आकांक्षा या संकल्प भी हो सकता है।
- source_word: אֶחְכָּמָה
  choice: मैं बुद्धिमान बनूँगा
  rationale: यह रूप बुद्धि प्राप्त करने की आकांक्षा या निश्चय व्यक्त करता है। “बनूँगा” अभी न पाई गई अवस्था की ओर बढ़ने का भाव सुरक्षित रखता है।
- source_word: וְהִיא
  choice: पर वह
  rationale: ו औपचारिक रूप से संयोजक है, पर यहाँ अपेक्षा और परिणाम के बीच विरोध है। स्त्रीलिंग “वह” का संबंध हिन्दी के स्त्रीलिंग शब्द “बुद्धि” से स्वाभाविक रूप से बैठता है।
- source_word: רְחוֹקָה מִמֶּנִּי
  choice: मुझसे दूर थी
  rationale: विशेषण और מן का यह सीधा अनुवाद दूरी को बनाए रखता है और “मेरी पहुँच से बाहर” जैसी व्याख्यात्मक अभिव्यक्ति को मुख्य पाठ में नहीं लाता।
theological_decisions:
- issue: क्या बुद्धि की दूरी को असंभवता या केवल वक्ता की असफलता के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल “वह मुझसे दूर थी” रखा गया
  alternative: “वह मेरी पहुँच से बाहर रही”
  rationale: मूल पाठ दूरी का रूपक देता है, पर उसकी दार्शनिक या धर्मवैज्ञानिक सीमा को स्पष्ट नहीं करता। सीधा अनुवाद इस तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निकट-औपचारिक शैली अपनाई गई है। “बुद्धि के द्वारा” मूल के साधनात्मक प्रयोग को बनाए रखता है, जबकि “पर वह मुझसे दूर थी” हिब्रू की संक्षिप्तता और रूपकात्मक तनाव दोनों सुरक्षित रखता है।
