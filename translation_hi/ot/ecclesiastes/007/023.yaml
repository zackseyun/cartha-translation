  text: यह सब मैंने बुद्धि के द्वारा परखा।[a] मैंने कहा, “मैं बुद्धिमान बनूँगा,”[b] पर वह मुझसे दूर थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सब मैंने बुद्धि के साथ परखा।”
