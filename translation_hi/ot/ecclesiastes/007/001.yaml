base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/007/001.yaml
  text: A good name is better than good oil[a], and the day of death than the day of one's birth.
translation:
  language: hi
  text: अच्छा नाम उत्तम तेल से बढ़कर है[a], और मृत्यु का दिन जन्म के दिन से बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्तम सुगंधित तेल से” अथवा “बहुमूल्य इत्र से”; इब्रानी में शाब्दिक रूप से “अच्छे तेल से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב שֵׁם
  choice: अच्छा नाम
  rationale: शाब्दिक रूप से ‘अच्छा नाम’; ज्ञान-साहित्य में ‘नाम’ प्रतिष्ठा या नेकनामी का भी बोध कराता है। हिंदी में मूल रूपक और निहित अर्थ दोनों बने रहते हैं।
- source_word: מִשֶּׁמֶן טוֹב
  choice: उत्तम तेल से बढ़कर
  rationale: שֶׁמֶן का मूल अर्थ ‘तेल’ है और טוֹב यहाँ उसकी उत्तमता बताता है। तुलनार्थक מִן को स्वाभाविक हिंदी में ‘से बढ़कर’ कहा गया है; संदर्भ में सुगंधित तेल संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וְיוֹם הַמָּוֶת
  choice: और मृत्यु का दिन
  rationale: निश्चित पदबंध को संक्षिप्त, लोकोक्तिपरक हिंदी में रखा गया है।
- source_word: מִיּוֹם הִוָּלְדוֹ
  choice: जन्म के दिन से
  rationale: शाब्दिक अर्थ ‘उसके जन्म लेने के दिन से’ है। हिंदी में ‘जन्म के दिन से’ सार्वजनीन प्रतिनिधिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; दूसरे खंड में ‘बढ़कर है’ का लोप इब्रानी समानांतरता को सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे खंड में मृत्यु-दिन और जन्म-दिन की तुलना
  choice: और मृत्यु का दिन जन्म के दिन से।
  alternative: और मृत्यु का दिन उसके जन्म के दिन से बढ़कर है।
  rationale: इब्रानी में दूसरे खंड का तुलनात्मक विधेय पहले खंड से समझा जाता है। उसे स्पष्ट व्याख्या से नरम या सीमित किए बिना संक्षिप्त समानांतर संरचना रखी गई है, जिससे पद का जानबूझकर चौंकाने वाला ज्ञान-वचन बना रहता है।
- issue: הִוָּלְדוֹ में तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय
  choice: जन्म के दिन
  alternative: उसके जन्म के दिन
  rationale: प्रत्यय शाब्दिक रूप से ‘उसका’ है, किंतु यहाँ प्रतिनिधिक व्यक्ति का संकेत देता है। आधुनिक हिंदी में बिना स्वामीसूचक सर्वनाम के ‘जन्म का दिन’ यही सार्वजनीन अर्थ अधिक स्वाभाविक रूप से देता है और किसी खास पुरुष तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली। ‘अच्छा नाम’ मूल शब्दचित्र को रखता है, जबकि ‘उत्तम तेल’ मूल्यवान या सुगंधित तेल की सांस्कृतिक छवि को बिना अति-व्याख्या के प्रस्तुत करता है।
