source:
  edition: WLC
  text: שׁוֹמֵ֣ר מִצְוָ֔ה לֹ֥א יֵדַ֖ע דָּבָ֣ר רָ֑ע וְ/עֵ֣ת וּ/מִשְׁפָּ֔ט יֵדַ֖ע לֵ֥ב חָכָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/005.yaml
  text: Whoever keeps a command will not know an evil thing[b][a], and a wise heart knows the proper time and judgment.
translation:
  language: hi
  text: जो आज्ञा मानता है, वह किसी बुरी बात का अनुभव नहीं करेगा[a]; और बुद्धिमान हृदय उचित समय और निर्णय को जानता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बुरी/अनिष्ट बात’। इसका अर्थ नैतिक बुराई भी हो सकता है, पर यहाँ संभवतः विपत्ति, संकट या हानिकारक परिणाम अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘समय और न्याय’, अर्थात् उचित समय और सही निर्णय अथवा प्रक्रिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר מִצְוָה
  choice: जो आज्ञा मानता है
  rationale: शाब्दिक अर्थ ‘आज्ञा की रक्षा/पालन करने वाला’ है। आधुनिक हिन्दी में ‘आज्ञा मानता है’ आज्ञापालन का स्वाभाविक और सामान्य अर्थ व्यक्त करता है; एकवचन यहाँ किसी भी व्यक्ति के लिए सामान्य कथन है।
- source_word: לֹא יֵדַע
  choice: अनुभव नहीं करेगा
  rationale: मूल क्रिया का सीधा अर्थ ‘नहीं जानेगा’ है, पर किसी बुरी घटना के संदर्भ में ‘जानना’ अनुभव करने का भाव भी रखता है। हिन्दी में ‘अनुभव नहीं करेगा’ उस मुहावरेदार आशय को स्पष्ट करता है, बिना इसे केवल बौद्धिक जानकारी मानने के।
- source_word: דָּבָר רָע
  choice: किसी बुरी बात
  rationale: यह पदबंध शाब्दिक रूप से ‘बुरी/अनिष्ट बात’ है और नैतिक बुराई, विपत्ति या हानिकारक परिणाम का संकेत दे सकता है। ‘बुरी बात’ मूल की व्यापकता बनाए रखती है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְעֵת
  choice: उचित समय
  rationale: עֵת का अर्थ ‘समय’ या ‘अवसर’ है। इस ज्ञान-साहित्यिक संदर्भ में समय की उपयुक्तता निहित है, इसलिए ‘उचित समय’ स्वाभाविक हिन्दी में आशय स्पष्ट करता है।
- source_word: וּמִשְׁפָּט
  choice: न्याय
  rationale: מִשְׁפָּט का अर्थ न्याय, निर्णय, विधि या उचित प्रक्रिया हो सकता है। मुख्य पाठ में ‘न्याय’ इसकी व्यापक और पारंपरिक अर्थ-सीमा बनाए रखता है; संदर्भगत विकल्प पादटिप्पणी में है।
- source_word: יֵדַע לֵב חָכָם
  choice: बुद्धिमान हृदय ... जानता है
  rationale: इब्रानी में हृदय समझ, विवेक और निर्णय का केंद्र है। ‘बुद्धिमान हृदय’ इस मानवशास्त्रीय बिंब को बनाए रखता है, उसे केवल ‘बुद्धिमान व्यक्ति’ कहकर सपाट नहीं करता।
theological_decisions:
- issue: לֵב חָכָם में हृदय का मानवशास्त्रीय बिंब
  choice: बुद्धिमान हृदय
  alternative: बुद्धिमान व्यक्ति; बुद्धिमान का मन
  rationale: ‘हृदय’ को बनाए रखने से इब्रानी धारणा सुरक्षित रहती है कि अंतःकरण समझ और विवेक का केंद्र है; यह पाठ को किसी आधुनिक मन-बुद्धि विभाजन में नहीं बाँधता।
- issue: आज्ञा मानने वाले के लिए ‘बुरी बात’ न जानने का कथन
  choice: बुरी बात का अनुभव नहीं करेगा
  alternative: कोई बुराई नहीं जानेगा; उसे कोई हानि नहीं होगी
  rationale: यह रूप सामान्य ज्ञान-वचन के परिणाम को व्यक्त करता है, पर ‘हानि’ कहकर नैतिक बुराई या विपत्ति के बीच की मूल अस्पष्टता को पूरी तरह समाप्त नहीं करता। पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
- issue: מִשְׁפָּט की अर्थ-सीमा
  choice: न्याय
  alternative: सही निर्णय; उचित प्रक्रिया; सही रीति
  rationale: पद को केवल न्यायिक, नैतिक या प्रक्रियात्मक अर्थ में सीमित नहीं किया गया। ‘न्याय’ मूल शब्द की तनावपूर्ण व्यापकता बनाए रखता है, जबकि पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘आज्ञा मानता है’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘बुद्धिमान हृदय’ और ‘न्याय’ मूल इब्रानी के प्रमुख बिंब और अर्थ-व्याप्ति को सुरक्षित रखते हैं।
