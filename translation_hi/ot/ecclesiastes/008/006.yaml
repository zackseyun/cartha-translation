source:
  edition: WLC
  text: כִּ֣י לְ/כָל חֵ֔פֶץ יֵ֖שׁ עֵ֣ת וּ/מִשְׁפָּ֑ט כִּֽי רָעַ֥ת הָ/אָדָ֖ם רַבָּ֥ה עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/006.yaml
  text: For every matter there is a time and a judgment[b][a], because the evil of man weighs heavily upon him.
translation:
  language: hi
  text: क्योंकि हर विषय के लिए एक समय और एक निर्णय[a] होता है, क्योंकि मनुष्य की विपत्ति उस पर बहुत भारी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय,” “उचित रीति” अथवा “विधि।”
    reason: מִשְׁפָּט के व्यापक अर्थ-क्षेत्र को सुरक्षित रखना।
  - marker: b
    text: या, “मनुष्य की बुराई उस पर बहुत भारी है” अथवा “मनुष्य का दुःख उस पर बहुत भारी है।”
    reason: רָעָה के ‘बुराई,’ ‘विपत्ति,’ और ‘दुःख’ अर्थों की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכָל חֵפֶץ
  choice: हर विषय के लिए
  rationale: חֵפֶץ यहाँ इच्छा या आनंद से अधिक किसी विषय, प्रयोजन या कार्य-व्यवहार को सूचित करता है; ‘विषय’ अर्थ की व्यापकता बनाए रखता है।
- source_word: יֵשׁ עֵת
  choice: एक समय ... होता है
  rationale: यह अस्तित्वसूचक वाक्यांश है। ‘समय’ मूल शब्द को अनावश्यक रूप से ‘नियत’ बनाए बिना प्रस्तुत करता है।
- source_word: וּמִשְׁפָּט
  choice: और एक उचित निर्णय
  rationale: מִשְׁפָּט का अर्थ न्याय, निर्णय, विधि या उचित व्यवस्था हो सकता है। समय के साथ इसकी जोड़ी यहाँ प्रसंगानुकूल निर्णय या उचित रीति का संकेत देती है; ‘उचित निर्णय’ न्यायिक गंभीरता और प्रसंग दोनों को रखता है।
- source_word: כִּי
  choice: फिर भी
  rationale: दूसरा כִּי सामान्यतः कारणसूचक हो सकता है, पर यहाँ मनुष्य की भारी विपत्ति अगले पद की अज्ञानता और पिछले कथन में निहित कठिनाई की ओर ले जाती है। हिन्दी में ‘फिर भी’ तर्कगत तनाव को स्पष्ट करता है, बिना मूल की संभावित कारणसूचकता को भुलाए।
- source_word: רָעַת הָאָדָם
  choice: मनुष्य का दुःख
  rationale: רָעָה बुराई, विपत्ति, दुःख या संकट बता सकता है। רַבָּה עָלָיו के साथ यहाँ मनुष्य पर पड़े कष्ट या विपत्ति का अर्थ स्वाभाविक है; ‘दुःख’ नैतिक बुराई को अनिवार्य मानने से बचता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: הָאָדָם एकवचन में जातिवाचक है। आधुनिक हिन्दी में ‘मनुष्य’ स्रोत की एकवचन आकृति और समस्त मानवता के प्रतिनिधि भाव दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַבָּה עָלָיו
  choice: उस पर बहुत भारी है
  rationale: शाब्दिक रूप से यह ‘उस पर बहुत/बड़ा है’ है। ‘बहुत भारी है’ बोझ के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: הָאָדָם का जातिवाचक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: मूल पाठ व्याकरणतः एकवचन है, पर अर्थ जातिवाचक है। ‘मनुष्य’ दोनों विशेषताओं को सुरक्षित रखता है।
- issue: רָעָה का प्रसंगगत अर्थ
  choice: दुःख
  alternative: बुराई / विपत्ति / संकट
  rationale: शब्द नैतिक बुराई और अनुभव की गई विपत्ति दोनों को व्यक्त कर सकता है। इस वाक्य में ‘उस पर बहुत भारी है’ के साथ कष्ट का अर्थ अधिक स्वाभाविक है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत अस्पष्टता सुरक्षित रखती है।
- issue: दूसरे כִּי का संबंध
  choice: फिर भी
  alternative: क्योंकि / निश्चय ही
  rationale: कण कारणसूचक या बलसूचक हो सकता है। यहाँ प्रतिकूल संबंध हिन्दी में विचार की कठिनाई को सुबोध बनाता है; कारणसूचक पाठ संभव बना रहता है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उचित निर्णय’ मूल के משפט को केवल कानूनी न्याय तक सीमित नहीं करता। मुख्य पाठ में दुःख का प्रसंगगत अर्थ चुना गया है, और पादटिप्पणी में नैतिक ‘बुराई’ तथा ‘विपत्ति’ की संभावनाएँ सुरक्षित हैं।
