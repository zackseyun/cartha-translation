source:
  edition: WLC
  text: אֲשֶׁ֣ר חֹטֶ֗א עֹשֶׂ֥ה רָ֛ע מְאַ֖ת וּ/מַאֲרִ֣יךְ ל֑/וֹ כִּ֚י גַּם יוֹדֵ֣עַ אָ֔נִי אֲשֶׁ֤ר יִהְיֶה טּוֹב֙ לְ/יִרְאֵ֣י הָ/אֱלֹהִ֔ים אֲשֶׁ֥ר יִֽירְא֖וּ מִ/לְּ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/012.yaml
  text: Though a sinner does evil a hundred times and prolongs his life[a], yet I also know that it will be well for those who fear God[b], who fear before him.
translation:
  language: hi
  text: चाहे पापी सौ बार बुराई करे और अपनी आयु बढ़ाता रहे[a], फिर भी मैं यह भी जानता हूँ कि परमेश्वर का भय मानने वालों का भला होगा[b]—उनका जो उसके सामने भय मानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और बहुत दिनों तक जीवित रहे।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का भय मानने वालों के लिए अच्छा होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: चाहे
  rationale: संदर्भ में यह पद रियायती उपवाक्य आरंभ करता है; ‘चाहे’ आगे आनेवाले विरोधाभासी कथन से स्वाभाविक संबंध बनाता है।
- source_word: חֹטֶא
  choice: पापी
  rationale: कृदंत ऐसे व्यक्ति को दर्शाता है जिसकी पहचान पाप करने से होती है; एकवचन और संक्षिप्तता सुरक्षित रखी गई है।
- source_word: עֹשֶׂה רָע
  choice: बुराई करे
  rationale: यह सीधा और स्वाभाविक हिंदी रूप है, जो किसी अधिक व्याख्यात्मक अभिव्यक्ति के बिना क्रियात्मक अर्थ बनाए रखता है।
- source_word: מְאַת
  choice: सौ बार
  rationale: ‘सौ’ को यहाँ क्रिया की पुनरावृत्ति बतानेवाले क्रियाविशेषणीय अर्थ में लिया गया है; निश्चित संख्या का बल बनाए रखा गया है।
- source_word: וּמַאֲרִיךְ לוֹ
  choice: और अपनी आयु बढ़ाता रहे
  rationale: इब्रानी में ‘अपने लिए लंबा करना’ का भाव है। यह अनुवाद दीर्घ जीवन के संदर्भ को स्पष्ट करता है और क्रिया की मूल छवि भी बचाता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כִּי גַּם
  choice: फिर भी मैं यह भी जानता हूँ
  rationale: ‘फिर भी’ पिछले रियायती कथन के साथ विरोध को और ‘भी’ גַּם के योगात्मक बल को व्यक्त करता है।
- source_word: אֲשֶׁר יִהְיֶה טּוֹב
  choice: कि … का भला होगा
  rationale: यह हिंदी में स्वाभाविक रूप से बताता है कि संबंधित लोगों के साथ अंततः भलाई होगी, जबकि भविष्यकालीन आश्वासन सुरक्षित रहता है।
- source_word: לְיִרְאֵי הָאֱלֹהִים
  choice: परमेश्वर का भय माननेवालों
  rationale: यह कृदंत-संज्ञा का सहज आधुनिक हिंदी रूप है और भय को श्रद्धायुक्त आचरण के रूप में व्यक्त करता है।
- source_word: אֲשֶׁר יִירְאוּ מִלְּפָנָיו
  choice: जो उसके सामने भय मानते हैं
  rationale: ‘भय’ की पुनरावृत्ति जानबूझकर बनाए रखी गई है और ‘उसके सामने’ इब्रानी की उपस्थिति-संबंधी छवि को सुरक्षित रखता है।
theological_decisions:
- issue: מִלְּפָנָיו में सर्वनाम का संदर्भ
  choice: ‘उसके सामने,’ जहाँ ‘उसके’ का संदर्भ परमेश्वर है
  alternative: स्पष्टता के लिए ‘परमेश्वर के सामने’
  rationale: निकटतम और सबसे स्वाभाविक पूर्वपद ‘परमेश्वर’ है। सर्वनाम रखने से इब्रानी वाक्य की संबद्धता बनी रहती है और अनावश्यक पुनरुक्ति से बचा जाता है।
- issue: दीर्घ जीवन और परमेश्वर का भय माननेवालों की भलाई के बीच तनाव
  choice: पापी के लंबे जीवन की संभावना और परमेश्वर का भय माननेवालों के भले—दोनों कथनों को साथ रखा गया है
  alternative: ‘भला होगा’ को केवल परलोक या केवल सांसारिक समृद्धि के अर्थ में स्पष्ट करना
  rationale: पद स्वयं भलाई का समय या स्वरूप निर्धारित नहीं करता। किसी विशिष्ट धर्मवैचारिक समाधान को आरोपित किए बिना उपदेशक के कथन का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘परमेश्वर का भय मानना’ बाइबिलीय पदबंध की पहचान और इब्रानी मूल की पुनरावृत्ति दोनों को बनाए रखता है। मुख्य पाठ में दीर्घायु वाले कठिन मुहावरे को अपेक्षाकृत औपचारिक रूप में रखा गया है और अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
