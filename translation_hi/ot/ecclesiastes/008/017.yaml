source:
  edition: WLC
  text: וְ/רָאִיתִי֮ אֶת כָּל מַעֲשֵׂ֣ה הָ/אֱלֹהִים֒ כִּי֩ לֹ֨א יוּכַ֜ל הָ/אָדָ֗ם לִ/מְצוֹא֙ אֶת הַֽ/מַּעֲשֶׂה֙ אֲשֶׁ֣ר נַעֲשָׂ֣ה תַֽחַת הַ/שֶּׁ֔מֶשׁ בְּ֠/שֶׁ/ל אֲשֶׁ֨ר יַעֲמֹ֧ל הָ/אָדָ֛ם לְ/בַקֵּ֖שׁ וְ/לֹ֣א יִמְצָ֑א וְ/גַ֨ם אִם יֹאמַ֤ר הֶֽ/חָכָם֙ לָ/דַ֔עַת לֹ֥א יוּכַ֖ל לִ/מְצֹֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/017.yaml
  text: 'Then I saw all the work of God: that man cannot find out the work that is done under the sun[a]. However much man labors to seek it out, he will not find it; and even if the wise man says he knows[b], he cannot find it out.'
translation:
  language: hi
  text: 'तब मैंने परमेश्वर के सारे काम को देखा: मनुष्य उस काम की थाह नहीं पा सकता जो सूर्य के नीचे किया जाता है। उसे खोजने के लिए मनुष्य चाहे जितना परिश्रम करे, वह उसकी थाह नहीं पाएगा; और यदि कोई बुद्धिमान कहे भी कि वह जानता है[a], तो भी वह उसकी थाह नहीं पा सकता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जानने का दावा करे।”
    reason: लָדַעַת के साथ יֹאמַר की संक्षिप्त इब्रानी रचना साधारण कथन या ज्ञान के दावे—दोनों रूपों में समझी जा सकती है।
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: तब मैंने ... देखा और जाना
  rationale: वाव के प्रसंगगत क्रम को “तब” से व्यक्त किया गया है। हिंदी में अगले כִּי-वाक्य को स्वाभाविक रूप से जोड़ने और अवलोकन से निकले निष्कर्ष को स्पष्ट करने के लिए “देखा और जाना” रखा गया है।
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: परमेश्वर के सारे काम
  rationale: מַעֲשֶׂה काम, कार्य या गतिविधि को सूचित करता है। “काम” सरल और व्यापक है तथा आगे उसी शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: इब्रानी का एकवचन यहाँ समस्त मानवजाति का प्रतिनिधित्व करता है। आधुनिक हिंदी में “मनुष्य” उसी सामान्य मानवीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִמְצוֹא
  choice: थाह पाना
  rationale: प्रसंग में बात किसी वस्तु को केवल ढूँढ़ लेने की नहीं, बल्कि परमेश्वर के कार्य को पूरी तरह समझ लेने की है। “थाह पाना” खोज और बोध, दोनों की सीमा व्यक्त करता है।
- source_word: הַמַּעֲשֶׂה אֲשֶׁר נַעֲשָׂה תַחַת הַשֶּׁמֶשׁ
  choice: वह काम जो सूर्य के नीचे किया जाता है
  rationale: मूल के संज्ञात्मक “काम,” कर्मवाच्य रूप, और सभोपदेशक के प्रमुख पदबंध “सूर्य के नीचे”—तीनों को सुरक्षित रखा गया है।
- source_word: בְּשֶׁל אֲשֶׁר יַעֲמֹל הָאָדָם לְבַקֵּשׁ
  choice: उसे खोजने के लिए मनुष्य चाहे जितना परिश्रम करे
  rationale: यहाँ पदबंध मानवीय प्रयास की मात्रा और उसके बावजूद होने वाली विफलता पर बल देता है। “चाहे जितना” उस concessive भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְגַם אִם יֹאמַר הֶחָכָם לָדַעַת
  choice: और यदि कोई बुद्धिमान कहे भी कि वह जानता है
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और कुछ हद तक दीर्घवृत्तीय है। मुख्य पाठ में उसके सीधे अर्थ को रखा गया है; दावे का भाव पादटिप्पणी में दिया गया है।
- source_word: לֹא יוּכַל לִמְצֹא
  choice: वह उसकी थाह नहीं पा सकता
  rationale: यह आरंभ में कही गई मानवीय असमर्थता को दोहराकर पद को बलपूर्वक समाप्त करता है; “थाह पाना” से शब्दगत और विषयगत संगति बनी रहती है।
theological_decisions:
- issue: הָאָדָם का सामान्य मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति / कोई व्यक्ति
  rationale: वचन किसी विशेष पुरुष के विषय में नहीं, बल्कि परमेश्वर के कार्य को पूर्णतः समझ पाने में समस्त मानवता की सीमा के विषय में है। “मनुष्य” इब्रानी के प्रतिनिधिक एकवचन और हिंदी के सामान्य प्रयोग दोनों को बनाए रखता है।
- issue: बुद्धिमान के ज्ञान-वचन का स्वर
  choice: कहे कि वह जानता है
  alternative: जानने का दावा करे
  rationale: मुख्य पाठ मूल की अपेक्षाकृत तटस्थ अभिव्यक्ति को सुरक्षित रखता है और उसे अनिवार्य रूप से अहंकारी दावा नहीं ठहराता; अधिक संशयात्मक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “सूर्य के नीचे” को सभोपदेशक के प्रमुख आवर्ती पदबंध के रूप में अक्षरशः सुरक्षित रखा गया है। “थाह पाना” बौद्धिक खोज तथा मानवीय सीमा को स्वाभाविक हिंदी में व्यक्त करता है।
