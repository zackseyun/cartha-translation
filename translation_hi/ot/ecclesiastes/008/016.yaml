source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר נָתַ֤תִּי אֶת לִבִּ/י֙ לָ/דַ֣עַת חָכְמָ֔ה וְ/לִ/רְאוֹת֙ אֶת הָ֣/עִנְיָ֔ן אֲשֶׁ֥ר נַעֲשָׂ֖ה עַל הָ/אָ֑רֶץ כִּ֣י גַ֤ם בַּ/יּוֹם֙ וּ/בַ/לַּ֔יְלָה שֵׁנָ֕ה בְּ/עֵינָ֖י/ו אֵינֶ֥/נּוּ רֹאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/016.yaml
  text: When I applied my heart to know wisdom and to observe the activity that is done on the earth—for even by day and by night his eyes do not see sleep—[a]
translation:
  language: hi
  text: जब मैंने बुद्धि को जानने और पृथ्वी पर किए जानेवाले कामकाज को देखने के लिए अपना मन लगाया—क्योंकि दिन और रात उसकी आँखें नींद तक नहीं देखतीं—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद: “उसे दिन-रात नींद नहीं आती।” मुख्य पाठ हिब्रू की छवि को बनाए रखता है, जिसका शाब्दिक भाव है, “उसकी आँखें नींद नहीं देखतीं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यह वक्ता के मन लगाने की परिस्थिति का परिचय देता है; यहाँ कालवाचक अर्थ स्वाभाविक है।
- source_word: נָתַתִּי אֶת־לִבִּי
  choice: मैंने ... अपना मन लगाया
  rationale: हिब्रू मुहावरा जान-बूझकर ध्यान केंद्रित करने को व्यक्त करता है। आधुनिक हिन्दी में ‘मन लगाना’ स्वाभाविक है और हृदय/अंतरमन की मूल छवि को पूरी तरह बौद्धिक ‘दिमाग’ तक सीमित नहीं करता।
- source_word: לָדַעַת חָכְמָה
  choice: बुद्धि को जानने
  rationale: ‘जानना’ ידע का सीधा अर्थ बनाए रखता है, जबकि ‘बुद्धि’ חָכְמָה के लिए प्रचलित और गरिमापूर्ण शब्द है।
- source_word: וְלִרְאוֹת
  choice: और ... देखने
  rationale: मूल क्रिया ‘देखना’ है; प्रसंग में इसका आशय ध्यानपूर्वक निरीक्षण करना है, जो हिन्दी में भी समझ में आता है।
- source_word: הָעִנְיָן
  choice: कामकाज
  rationale: सभोपदेशक में यह शब्द मानवीय व्यस्तता, कार्य या उद्यम को दर्शाता है। ‘कामकाज’ व्यापारिक अर्थ तक सीमित हुए बिना इस व्यापक भाव को व्यक्त करता है।
- source_word: אֲשֶׁר נַעֲשָׂה עַל־הָאָרֶץ
  choice: पृथ्वी पर किए जानेवाले
  rationale: यह निष्क्रिय रचना और संसार में चल रहे मानवीय कार्यों के व्यापक क्षेत्र को बनाए रखता है।
- source_word: כִּי גַם
  choice: क्योंकि
  rationale: यह व्याख्यात्मक कारण प्रस्तुत करता है। हिन्दी वाक्य में ‘दिन और रात’ स्वयं निरंतरता और बल को पर्याप्त रूप से व्यक्त करता है।
- source_word: בַּיּוֹם וּבַלַּיְלָה
  choice: दिन और रात
  rationale: निरंतर अवधि व्यक्त करने वाला सहज आधुनिक हिन्दी रूप।
- source_word: שֵׁנָה בְּעֵינָיו אֵינֶנּוּ רֹאֶה
  choice: उसकी आँखें नींद नहीं देखतीं
  rationale: यह जानबूझकर मूल की सजीव और असामान्य छवि को सुरक्षित रखता है; इसे केवल ‘नींद नहीं आती’ कहकर समतल नहीं किया गया।
theological_decisions:
- issue: ‘उसकी आँखें’ में तृतीय पुरुष एकवचन का संदर्भ
  choice: तृतीय पुरुष रूप ‘उसकी’ को बिना किसी स्पष्ट नए कर्ता की पहचान किए बनाए रखा गया
  alternative: इसे वक्ता के लिए ‘मेरी आँखें’ या सामान्य मनुष्य के लिए ‘किसी को नींद नहीं आती’ समझना
  rationale: मसोरेटिक पाठ में प्रथम पुरुष नहीं, बल्कि तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है। उसका संदर्भ अस्पष्ट है; अनुवाद इस अस्पष्टता को किसी अनुमान से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। पद का वाक्य अगले पद की ओर बढ़ता है, इसलिए डैश के द्वारा इसकी अपूर्ण/संबद्ध संरचना और बीच की व्याख्यात्मक बात को बनाए रखा गया है।
