  edition: WLC
  text: וְ/שִׁבַּ֤חְתִּֽי אֲנִי֙ אֶת הַ/שִּׂמְחָ֔ה אֲשֶׁ֨ר אֵֽין ט֤וֹב לָֽ/אָדָם֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כִּ֛י אִם לֶ/אֱכ֥וֹל וְ/לִ/שְׁתּ֖וֹת וְ/לִ/שְׂמ֑וֹחַ וְ/ה֞וּא יִלְוֶ֣/נּוּ בַ/עֲמָל֗/וֹ יְמֵ֥י חַיָּ֛י/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/015.yaml
  text: So I commended joy[a], because there is nothing better for man under the sun than to eat and to drink and to rejoice[c][b]; and this will accompany him in his labor during the days of his life that God has given him under the sun.
translation:
  language: hi
  text: इसलिए मैंने आनन्द को सराहा,[a] क्योंकि सूर्य के नीचे मनुष्य के लिए खाने, पीने और आनन्द मनाने से बढ़कर और कुछ अच्छा नहीं है; और यही उसके परिश्रम में, उसके जीवन के उन दिनों के दौरान, जो परमेश्वर ने उसे सूर्य के नीचे दिए हैं, उसका साथ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने आनन्द की प्रशंसा की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּחְתִּי
  choice: इसलिए मैंने ... को सराहा
  rationale: पिएल रूप यहाँ किसी वस्तु का सकारात्मक मूल्यांकन करने, अर्थात उसकी प्रशंसा या सराहना करने का भाव देता है। ‘सराहा’ आधुनिक हिन्दी में स्वाभाविक है और आनन्द के विषय में उपदेशक के निष्कर्ष को स्पष्ट रखता है। आरम्भिक וְ को प्रसंगानुकूल निष्कर्षसूचक ‘इसलिए’ से व्यक्त किया गया है।
- source_word: הַשִּׂמְחָה
  choice: आनन्द
  rationale: यह शब्द प्रसन्नता और जीवन से मिलने वाले सुख का व्यापक भाव रखता है; ‘आनन्द’ गरिमापूर्ण, सहज और सभोपदेशक के आवर्ती विषय के अनुकूल है।
- source_word: אֵין טוֹב לָאָדָם
  choice: मनुष्य के लिए ... से बढ़कर और कुछ अच्छा नहीं है
  rationale: इब्रानी मुहावरे का यहाँ तुलनात्मक अर्थ है। यह हिन्दी रूप शाब्दिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है और कथन को परम या सार्वकालिक दार्शनिक सिद्धान्त से अधिक प्रसंगगत मूल्यांकन के रूप में रहने देता है।
- source_word: לָאָדָם
  choice: मनुष्य के लिए
  rationale: אָדָם यहाँ जातिवाचक एकवचन है और सामान्य मानव को सूचित करता है। हिन्दी ‘मनुष्य’ स्रोत के एकवचन रूप और समावेशी मानवीय अर्थ दोनों को सहजता से रखता है।
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक का प्रमुख आवर्ती पद है, जो वर्तमान सांसारिक जीवन-क्षेत्र की ओर संकेत करता है; स्थापित शाब्दिक रूप विषयगत संगति बनाए रखता है।
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת וְלִשְׂמוֹחַ
  choice: खाने, पीने और आनन्द मनाने
  rationale: तीनों समानान्तर क्रियार्थक रूपों को हिन्दी में समान संरचना के साथ रखा गया है। ‘आनन्द मनाने’ से क्रियात्मक भाव बना रहता है।
- source_word: וְהוּא יִלְוֶנּוּ
  choice: और यही ... उसका साथ देगा
  rationale: יִלְוֶנּוּ का अर्थ ‘उसके साथ रहेगा/चलेगा’ है। पुल्लिंग सर्वनाम הוּא का निकटतम व्याकरणिक पूर्वपद ‘आनन्द’ है; हिन्दी ‘यही’ पिछले वर्णित आनन्दमय भोग को भी समेट सकता है और अनावश्यक रूप से किसी व्यक्तिगत कर्ता का अर्थ नहीं देता।
- source_word: בַעֲמָלוֹ
  choice: उसके परिश्रम में
  rationale: עָמָל में श्रम और उसके बोझ दोनों का भाव हो सकता है। ‘परिश्रम’ गरिमापूर्ण और सामान्य हिन्दी है, जबकि अत्यधिक नकारात्मक अर्थ आरोपित नहीं करता।
- source_word: יְמֵי חַיָּיו
  choice: उसके जीवन के उन दिनों के दौरान
  rationale: यह जीवनकाल की अवधि बताता है। ‘उन दिनों’ अगले सम्बन्धवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: जो परमेश्वर ने उसे ... दिए हैं
  rationale: जीवन के दिन परमेश्वर द्वारा दिए हुए उपहार के रूप में प्रस्तुत हैं। हिन्दी पूर्ण वर्तमान ‘दिए हैं’ उस दिए हुए जीवन और उसकी वर्तमान अवधि का सम्बन्ध बनाए रखता है।
theological_decisions:
- issue: אָדָם के जातिवाचक एकवचन का अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति / मानवजाति
  rationale: यह कथन केवल पुरुषों तक सीमित नहीं है। ‘मनुष्य’ हिन्दी में जातिवाचक एकवचन को बनाए रखते हुए सामान्य मानव का अर्थ स्वाभाविक रूप से देता है।
- issue: וְהוּא का पूर्वपद
  choice: ‘यही’—अर्थात आनन्द या अभी वर्णित आनन्दमय जीवन-भोग
  alternative: ‘वह’—किसी पुरुष कर्ता के रूप में; अथवा ‘आनन्द’ को स्पष्ट रूप से दोहराना
  rationale: व्याकरणतः הַשִּׂמְחָה पुल्लिंग है और स्वाभाविक पूर्वपद है, पर सर्वनाम पूरे पूर्ववर्ती विचार का सार भी हो सकता है। ‘यही’ इस सीमित अस्पष्टता को बनाए रखते हुए हिन्दी में स्पष्ट और सहज है।
- issue: आनन्द की सराहना का धार्मिक आशय
  choice: पाठ के सीमित, ‘सूर्य के नीचे’ वाले जीवन-सन्दर्भ में सकारात्मक मूल्यांकन
  alternative: आनन्द को जीवन का परम या एकमात्र उद्देश्य घोषित करना
  rationale: मूल कथन भोजन, पेय और आनन्द को परिश्रम के बीच मनुष्य का अच्छा भाग बताता है, किन्तु उसे परम सिद्धान्त नहीं बनाता। अनुवाद उसी तनाव और सीमा को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘सूर्य के नीचे’ जैसे पुस्तक-विशिष्ट पद को अक्षुण्ण रखा गया है। मुख्य पाठ का [a] चिह्न सम्बद्ध वैकल्पिक अनुवाद की पाद-टिप्पणी से मेल खाता है।
