id: ECC.8.11
reference: Ecclesiastes 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲשֶׁר֙ אֵין נַעֲשָׂ֣ה פִתְגָ֔ם מַעֲשֵׂ֥ה הָ/רָעָ֖ה מְהֵרָ֑ה עַל כֵּ֡ן מָלֵ֞א לֵ֧ב בְּֽנֵי הָ/אָדָ֛ם בָּ/הֶ֖ם לַ/עֲשׂ֥וֹת רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/011.yaml
  text: Because the sentence against an evil deed is not carried out quickly[b][a], therefore the heart of the sons of man is fully set in them to do evil.
translation:
  language: hi
  text: क्योंकि बुरे काम के विरुद्ध दण्डादेश शीघ्र लागू नहीं किया जाता, इसलिए मनुष्यों का मन बुराई करने पर पूरी तरह तुला रहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִתְגָם
  choice: दण्डादेश
  rationale: यहाँ शब्द बुरे काम के विरुद्ध आधिकारिक न्यायिक आदेश को दर्शाता है; ‘दण्डादेश’ आधुनिक हिन्दी में उसके दण्ड-संबंधी आशय को स्पष्ट रखता है।
- source_word: מַעֲשֵׂה הָרָעָה
  choice: बुरे काम
  rationale: इब्रानी एकवचन को सामान्य अर्थ में रखते हुए सहज हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: אֵין נַעֲשָׂה ... מְהֵרָה
  choice: शीघ्र लागू नहीं किया जाता
  rationale: न्यायिक आदेश के केवल होने नहीं, बल्कि उसके कार्यान्वयन का भाव व्यक्त करता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: विलंबित न्याय और बुराई के लिए बढ़े हुए निश्चय के बीच परिणाम-संबंध स्पष्ट करता है।
- source_word: לֵב בְּנֵי הָאָדָם
  choice: मनुष्यों का मन
  rationale: לֵב यहाँ इच्छा और संकल्प के भीतरी केंद्र को दर्शाता है; हिन्दी में ‘मन’ इस प्रयोग में ‘हृदय’ से अधिक स्वाभाविक है। בְּנֵי הָאָדָם समस्त मानवजाति के लोगों के लिए रूढ़ अभिव्यक्ति है।
- source_word: מָלֵא ... לַעֲשׂוֹת רָע
  choice: बुराई करने के लिए पूरी तरह दृढ़ हो जाता है
  rationale: शाब्दिक ‘भर जाता है’ के पीछे स्थित दृढ़ अथवा निर्भीक हुए संकल्प का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: בְּנֵי הָאָדָם का प्रतिनिधिक मानवीय अर्थ
  choice: मनुष्यों
  alternative: मनुष्य के पुत्रों
  rationale: यह उपदेशक में मानवजाति के लोगों के लिए सामान्य अभिव्यक्ति है। हिन्दी में शाब्दिक ‘मनुष्य के पुत्रों’ से केवल पुरुष वंशजों का भ्रामक अर्थ निकल सकता है; ‘मनुष्यों’ स्रोत का सार्वभौमिक आशय सुरक्षित रखता है।
- issue: מָלֵא לֵב मुहावरे की व्याख्या
  choice: मन ... पूरी तरह दृढ़ हो जाता है
  alternative: मन ... भर जाता है
  rationale: शाब्दिक रूपक हिन्दी में लक्ष्य अस्पष्ट छोड़ सकता है। ‘पूरी तरह दृढ़’ बुराई की ओर जमे संकल्प को व्यक्त करता है, पर इसे केवल बाहरी साहस या दण्ड-मुक्ति के किसी संकीर्ण सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। न्यायिक प्रसंग के लिए ‘दण्डादेश’ और उसके कार्यान्वयन के लिए ‘लागू’ का प्रयोग किया गया है; अनावश्यक संस्कृतनिष्ठता तथा अस्वाभाविक शाब्दिकता से बचा गया है।
