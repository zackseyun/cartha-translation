base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/010.yaml
  text: And so I saw the wicked buried[a]; they had come and gone from the holy place, and they were forgotten in the city where they had done so[c][b]. This too is vanity.
translation:
  language: hi
  text: और इस प्रकार मैंने दुष्टों को दफन होते देखा। वे पवित्र स्थान[b] में आते और वहाँ से चले जाते थे, और जिस नगर में उन्होंने ऐसा किया था, वहाँ वे भुला दिए गए[a]। यह भी व्यर्थ है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन अनुवादों और इब्रानी पाठ की भिन्न समझ के अनुसार: “और जिस नगर में उन्होंने ऐसा किया था, वहाँ उनकी प्रशंसा हुई।”'
    reason: textual_variant
  - marker: b
    text: “पवित्र स्थान” से आशय मंदिर का परिसर या कोई अन्य पवित्र स्थान हो सकता है।
    reason: cultural_note
  - marker: c
    text: इब्रानी शब्द हेवेल का अर्थ “भाप” या “वाष्प” भी हो सकता है; यह किसी क्षणभंगुर या पकड़ में न आने वाली वस्तु का बिंब प्रस्तुत करता है।
    reason: lexical_alternative
