theological_decisions:
- issue: दुष्टों, पवित्र स्थान और नगर के बीच कठिन संबंध
  choice: दुष्ट पवित्र स्थान में आते-जाते थे और उसी नगर में भुला दिए गए जहाँ उन्होंने ऐसा किया था।
  alternative: इस कथन को उनके धार्मिक पाखंड, किसी विशिष्ट अपराध, या धर्मियों के साथ स्पष्ट विरोध के रूप में समझना।
  rationale: इब्रानी वाक्य-विन्यास कठिन और संक्षिप्त है। अनुवाद दुष्टों के पवित्र स्थान से संबंध को बताता है, पर उनके आचरण या अपराध को मूल से अधिक स्पष्ट नहीं करता।
- issue: וְיִשְׁתַּכְּחוּ का पाठ और अर्थ
  choice: उन्हें भुला दिया गया
  alternative: वहाँ उनकी प्रशंसा हुई
  rationale: मसोरेटिक पाठ का सीधा अर्थ मुख्य पाठ में रखा गया है, जबकि कुछ प्राचीन अनुवादों से समर्थित वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कठिन इब्रानी वाक्य को पठनीय बनाने के लिए दो वाक्यों में रखा गया है, पर उसकी संदर्भगत और पाठगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
