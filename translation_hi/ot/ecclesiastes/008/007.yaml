  text: For he does not know what will be, for who can tell him how it will be?
translation:
  language: hi
  text: क्योंकि वह नहीं जानता कि क्या होगा; क्योंकि वह कैसे होगा, यह उसे कौन बता सकता है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: आरंभिक conjunction पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसका स्वाभाविक explanatory बल बनाए रखता है।
- source_word: אֵינֶנּוּ יֹדֵעַ
  choice: वह नहीं जानता
  rationale: निषेध के साथ तृतीय पुरुष एकवचन रूप और ידע का सामान्य अर्थ ‘जानना’ यहाँ भविष्य के विषय में मानवीय अज्ञान को व्यक्त करते हैं।
- source_word: מַה שֶּׁיִּהְיֶה
  choice: क्या होगा
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और ‘जो होने वाला है’ की अपेक्षा हिब्रू प्रश्नवाचक संरचना को अधिक सीधे रूप में रखता है।
- source_word: כַּאֲשֶׁר יִהְיֶה
  choice: वह कैसे होगा
  rationale: यह पदबंध आने वाली बात के स्वरूप या ढंग की ओर संकेत कर सकता है। ‘कैसे’ पहले खंड के ‘क्या’ से अलंकारिक भेद बनाए रखता है, जबकि अस्पष्टता को पादटिप्पणी में स्वीकार किया गया है।
- source_word: מִי יַגִּיד לוֹ
  choice: यह उसे कौन बता सकता है
  rationale: נגד के हिफ़ील का अर्थ ‘बताना/ज्ञात कराना’ है। ‘बता सकता है’ प्रश्न में निहित मानवीय असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
