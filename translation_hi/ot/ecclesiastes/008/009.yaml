source:
  edition: WLC
  text: אֶת כָּל זֶ֤ה רָאִ֨יתִי֙ וְ/נָת֣וֹן אֶת לִבִּ֔/י לְ/כָֽל מַעֲשֶׂ֔ה אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ עֵ֗ת אֲשֶׁ֨ר שָׁלַ֧ט הָ/אָדָ֛ם בְּ/אָדָ֖ם לְ/רַ֥ע לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/009.yaml
  text: All this I have seen[a], while applying my heart to every deed that is done under the sun, at a time when man has ruled over man to his harm.
translation:
  language: hi
  text: यह सब मैंने देखा और सूर्य के नीचे किए जाने वाले हर काम पर ध्यानपूर्वक विचार किया—उस समय जब एक मनुष्य दूसरे पर शासन करता था, जिससे उसका अहित होता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसका” शासित व्यक्ति के अहित की ओर संकेत कर सकता है; या अर्थ हो सकता है, “अपने ही अहित के लिए,” अर्थात् शासन करने वाले के अहित के लिए।
    reason: pronoun_ambiguity
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने देखा
  rationale: इब्रानी पूर्ण क्रिया यहाँ सभोपदेशक के संचित प्रत्यक्ष अनुभव को बताती है; हिन्दी का सामान्य पूर्ण रूप स्वाभाविक और सीधा है।
- source_word: וְנָתוֹן אֶת־לִבִּי
  choice: और ... अपना मन लगाया
  rationale: यह मुहावरा ध्यानपूर्वक विचार करने को व्यक्त करता है। हिन्दी में ‘मन लगाना’ स्रोत के हृदय/अंतरमन के बिंब को कुछ हद तक बनाए रखते हुए स्वाभाविक अर्थ देता है।
- source_word: מַעֲשֶׂה אֲשֶׁר נַעֲשָׂה
  choice: किए जाने वाले हर काम
  rationale: यह व्यापक रूप से उन कार्यों को सूचित करता है जो होते या किए जाते हैं; ‘काम’ इसे केवल किसी विशेष कर्म या पेशे तक सीमित नहीं करता।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट और बार-बार आने वाली अभिव्यक्ति को परिचित शाब्दिक रूप में रखा गया है।
- source_word: עֵת אֲשֶׁר
  choice: उस समय, जब
  rationale: यह अनुवाद temporal noun ‘समय’ को स्पष्ट रखता और आगे बताई परिस्थिति से जोड़ता है।
- source_word: שָׁלַט
  choice: शासन करता है
  rationale: क्रिया अधिकार या प्रभुत्व चलाने का अर्थ देती है; ‘शासन करना’ न तो अर्थ को कमजोर करता है, न अनावश्यक रूप से अत्याचार का भाव जोड़ता है।
- source_word: הָאָדָם בְּאָדָם
  choice: एक मनुष्य दूसरे पर
  rationale: यहाँ אָדָם मानव व्यक्ति के प्रतिनिधिक अर्थ में है। हिन्दी में ‘एक मनुष्य दूसरे पर’ मूल संबंध को स्पष्ट, गरिमापूर्ण और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְרַע לוֹ
  choice: जिससे उसका अहित होता है
  rationale: यह परिणामस्वरूप होने वाली हानि को स्वाभाविक हिन्दी में व्यक्त करता है। ‘उसका’ मूल सर्वनाम की संदर्भगत अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: הָאָדָם בְּאָדָם में प्रतिनिधिक אָדָם
  choice: एक मनुष्य दूसरे पर
  alternative: आदमी आदमी पर
  rationale: संदर्भ सामान्य मानव-संबंध की बात करता है। ‘एक मनुष्य दूसरे पर’ इब्रानी एकवचन और परस्पर मानवीय संबंध को स्पष्ट रखता है, बिना कथन को केवल पुरुषों तक सीमित किए।
- issue: לְרַע לוֹ में हानि किसकी है
  choice: जिससे उसका अहित होता है
  alternative: अपने ही अहित के लिए
  rationale: इब्रानी לוֹ का संदर्भ व्याकरणतः पूरी तरह निश्चित नहीं है; यह सामान्यतः शासित व्यक्ति की हानि समझा जाता है, पर शासक की अपनी हानि भी संभव है। हिन्दी ‘उसका’ इस तनाव को मुख्य पाठ में बनाए रखता है और पाद-टिप्पणी वैकल्पिक पाठ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चिंतनशील रूप अपनाया गया है। सभोपदेशक की विशिष्ट अभिव्यक्ति ‘सूर्य के नीचे’ सुरक्षित रखी गई है; वाक्य की कालगत संरचना और अंतिम सर्वनाम की वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
