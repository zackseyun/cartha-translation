source:
  edition: WLC
  text: וְ/טוֹב֙ לֹֽא יִהְיֶ֣ה לָֽ/רָשָׁ֔ע וְ/לֹֽא יַאֲרִ֥יךְ יָמִ֖ים כַּ/צֵּ֑ל אֲשֶׁ֛ר אֵינֶ֥/נּוּ יָרֵ֖א מִ/לִּ/פְנֵ֥י אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/013.yaml
  text: But it will not go well for the wicked[a], and he will not prolong his days like a shadow[b], because he does not fear before God.
translation:
  language: hi
  text: पर दुष्ट का भला नहीं होगा, और वह छाया के समान अपने दिन लंबे नहीं करेगा[a], क्योंकि वह परमेश्वर का भय नहीं मानता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके दिन, जो छाया के समान हैं, लंबे नहीं होंगे।”
    reason: כַּצֵּל (‘छाया के समान’) का संबंध क्रिया से माना जाए या दिनों की क्षणभंगुरता से, इस पर वैकल्पिक व्याकरणिक समझ संभव है।
  - marker: b
    text: या, “क्योंकि वह परमेश्वर की उपस्थिति के प्रति श्रद्धाभय नहीं रखता।”
    reason: मִלִּפְנֵי אֱלֹהִים का उपस्थिति-संबंधी भाव अधिक स्पष्ट रूप में व्यक्त किया गया है।
lexical_decisions:
- source_word: וְטוֹב לֹא יִהְיֶה לָרָשָׁע
  choice: पर दुष्ट का भला नहीं होगा
  rationale: טוֹב के साथ היה यहाँ अनुकूल परिणाम या कुशल-मंगल को व्यक्त करता है। पिछले पद से विरोध दिखाने के लिए וְ को ‘पर’ कहा गया है।
- source_word: וְלֹא יַאֲרִיךְ יָמִים
  choice: और वह अपने दिन लंबे नहीं करेगा
  rationale: ארך के हिफ़ील रूप और יָמִים की इब्रानी अभिव्यक्ति को यथासंभव सुरक्षित रखा गया है; यह केवल ‘जल्दी मर जाएगा’ कहने की अपेक्षा स्रोत के अधिक निकट है।
- source_word: כַּצֵּל
  choice: छाया की तरह
  rationale: छाया का मूल उपमान बनाए रखा गया है। इसका संबंध क्रिया से है या ‘दिनों’ की क्षणभंगुरता से, इसमें कुछ व्याकरणिक अस्पष्टता है; वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ אֲשֶׁר दुष्ट के परिणाम का कारण प्रस्तुत करता समझा गया है, इसलिए स्वाभाविक हिन्दी में ‘क्योंकि’ उपयुक्त है।
- source_word: אֵינֶנּוּ יָרֵא
  choice: वह भय नहीं मानता
  rationale: यह अभिव्यक्ति परमेश्वर के प्रति श्रद्धामय भय की निरंतर अनुपस्थिति बताती है। ‘भय नहीं मानता’ आधुनिक हिन्दी में स्वाभाविक है और केवल भावनात्मक डर तक अर्थ को सीमित नहीं करती।
- source_word: מִלִּפְנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: शाब्दिक भाव ‘परमेश्वर के मुख के सामने से’ है; ‘परमेश्वर के सामने’ उसकी उपस्थिति और उत्तरदायित्व—दोनों का भाव स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में दैवी प्रतिफल का स्वरूप
  choice: पद को इस सामान्य नैतिक कथन के रूप में रखा गया है कि दुष्ट का अंततः भला नहीं होगा और उसके दिन सचमुच लंबे नहीं होंगे।
  alternative: इसे या तो हर दुष्ट के इसी जीवन में अनिवार्य रूप से शीघ्र मरने की कठोर प्रतिज्ञा, या किसी वास्तविक नैतिक व्यवस्था से रहित केवल अस्तित्वगत कथन माना जा सकता है।
  rationale: सभोपदेशक अनुभव में दिखाई देने वाले तनावों को साथ रखता है। अनुवाद मूल कथन की दृढ़ता बनाए रखता है, पर उसमें ऐसे स्पष्टीकरण नहीं जोड़ता जो उसे पूर्णतः यांत्रिक नियम बना दें या निर्बल कर दें।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दुष्ट’, ‘भला होना’, ‘दिन लंबे करना’ और ‘परमेश्वर के सामने भय मानना’ ज्ञान-साहित्य की नैतिक तथा रूपकात्मक भाषा को बनाए रखते हैं।
