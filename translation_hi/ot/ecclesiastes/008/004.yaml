    text: या, “क्योंकि जहाँ राजा का वचन है, वहाँ अधिकार है।” इब्रानी आरंभ को अधिक शाब्दिक रूप से इस प्रकार भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּאֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध पिछले उपदेश का कारण प्रस्तुत करता है। ‘क्योंकि’ आधुनिक हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि अधिक शाब्दिक स्थानवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: דְּבַר
  choice: वचन
  rationale: ‘वचन’ मूल के ‘शब्द/बात’ को बनाए रखता है और राजकीय प्रसंग में आदेशात्मक बल का संकेत भी देता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: मूल में निश्चित उपपद नहीं है और कथन सामान्य, नीतिवचनात्मक है; हिन्दी में ‘राजा’ बिना ‘एक’ के भी इस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁלְטוֹן
  choice: अधिकार
  rationale: यह संज्ञा शासन करने की सामर्थ्य या प्राधिकार को दर्शाती है। ‘अधिकार’ बताता है कि राजा का वचन बाध्यकारी बल रखता है।
- source_word: וּמִי
  choice: और कौन
  rationale: संयोजक और प्रश्नवाचक को सीधे रखते हुए आलंकारिक प्रश्न सुरक्षित रहता है।
- source_word: יֹאמַר לוֹ
  choice: उससे कह सकता है
  rationale: अपूर्ण क्रिया यहाँ भविष्य से अधिक संभावना या सामर्थ्य व्यक्त करती है; ‘कह सकता है’ हिन्दी में उसी चुनौती देने की संभावना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַה תַּעֲשֶׂה
  choice: आप यह क्या कर रहे हैं?
  rationale: यह रूप राजा के कार्य पर सीधे प्रश्न उठाने का भाव देता है। ‘आप’ राजकीय संबोधन के अनुरूप सम्मानसूचक है, जबकि ‘यह क्या’ चुनौती के स्वर को स्पष्ट करता है।
