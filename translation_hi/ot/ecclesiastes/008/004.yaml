  yaml_path: translation/ot/ecclesiastes/008/004.yaml
  text: For the word of a king is authority[a], and who may say to him, “What are you doing?”
translation:
  language: hi
  text: क्योंकि राजा के वचन में अधिकार है[a], और कौन उससे कह सकता है, “आप क्या कर रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
