  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣ין אָדָ֞ם שַׁלִּ֤יט בָּ/ר֨וּחַ֙ לִ/כְל֣וֹא אֶת הָ/ר֔וּחַ וְ/אֵ֤ין שִׁלְטוֹן֙ בְּ/י֣וֹם הַ/מָּ֔וֶת וְ/אֵ֥ין מִשְׁלַ֖חַת בַּ/מִּלְחָמָ֑ה וְ/לֹֽא יְמַלֵּ֥ט רֶ֖שַׁע אֶת בְּעָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/008.yaml
  text: No man has power over the wind to restrain the wind[a], and there is no authority over the day of death, and there is no discharge in war, and wickedness will not deliver its master.
translation:
  language: hi
  text: किसी मनुष्य का हवा पर ऐसा अधिकार नहीं कि वह उसे रोक सके[a]; न मृत्यु के दिन पर किसी का अधिकार है, न युद्ध में कोई छुट्टी होती है; और दुष्टता अपने स्वामी को नहीं बचाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘आत्मा’: “किसी मनुष्य को आत्मा को रोकने का अधिकार नहीं है।” इब्रानी शब्द רוּחַ का अर्थ हवा, आत्मा या प्राणवायु हो सकता है।'
    reason: मूल इब्रानी शब्द की वास्तविक बहुअर्थकता और वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन का प्रयोग सामान्य रूप से समस्त मानवजाति के प्रत्येक व्यक्ति के लिए है; ‘मनुष्य’ आधुनिक हिन्दी में इस व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׁלִּיט
  choice: अधिकार
  rationale: यह शब्द किसी वस्तु पर प्रभुत्व या नियंत्रण रखने की सामर्थ्य बताता है; ‘अधिकार’ अगले सजातीय शब्द שִׁלְטוֹן से संबंध भी बनाए रखता है।
- source_word: רוּחַ
  choice: हवा
  rationale: रोकने के क्रियापद और मनुष्य के नियंत्रण से बाहर की बातों की श्रृंखला के कारण मुख्य पाठ में प्राकृतिक अर्थ ‘हवा’ उपयुक्त है; ‘आत्मा/प्राणवायु’ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: לִכְלוֹא
  choice: रोक सके
  rationale: मूल क्रिया बंद रखने या नियंत्रित करके थामने का भाव देती है; हवा के साथ ‘रोकना’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: שִׁלְטוֹן
  choice: अधिकार
  rationale: यह शासन, प्रभुत्व या नियंत्रण की शक्ति को सूचित करता है। मृत्यु के दिन पर मानवीय नियंत्रण न होने का भाव अक्षुण्ण रखा गया है।
- source_word: בְּיוֹם הַמָּוֶת
  choice: मृत्यु के दिन पर
  rationale: पूर्वसर्ग को ‘अधिकार’ से जोड़कर उस दिन पर नियंत्रण के अभाव के रूप में प्रस्तुत किया गया है, न कि केवल उस दिन की परिस्थिति के रूप में।
- source_word: מִשְׁלַחַת
  choice: छुट्टी
  rationale: युद्ध के प्रसंग में इसका अर्थ सेवा या दायित्व से छोड़ा जाना है। ‘छुट्टी’ साधारण पाठक के लिए सहज है और यहाँ सैन्य दायित्व से मुक्ति का अर्थ देती है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह मूल के व्यापक युद्ध-संदर्भ को सीधे और संक्षेप में व्यक्त करता है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: मूल का भाववाचक संज्ञा-रूप बनाए रखा गया है; इसे ‘दुष्ट जन’ बनाकर व्यक्तिगत नहीं किया गया।
- source_word: יְמַלֵּט
  choice: नहीं बचाएगी
  rationale: क्रिया संकट से सुरक्षित निकालने या छुड़ाने का भाव देती है; ‘बचाना’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: בְּעָלָיו
  choice: अपने स्वामी को
  rationale: मूल शब्द स्वामी या मालिक का अर्थ देता है। दुष्टता का मानवीकरण बनाए रखते हुए ‘अपने स्वामी’ उस व्यक्ति को दर्शाता है जो उसके अधीन या उसमें लिप्त है।
theological_decisions:
- issue: आरंभिक खंड में רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा अथवा प्राणवायु
  rationale: संज्ञा की पुनरावृत्ति, उसे रोकने की क्रिया और हवा, मृत्यु तथा युद्ध जैसी अनियंत्रित वास्तविकताओं की श्रृंखला मुख्य पाठ में ‘हवा’ का समर्थन करती है। फिर भी इब्रानी शब्द बहुअर्थी है और मानव-आत्मा या जीवन-श्वास का संकेत संभव है, इसलिए इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर नकारात्मक खंडों को ‘न... न...’ से जोड़ा गया है, जबकि अंतिम खंड को अर्धविराम के बाद रखा गया है ताकि मूल की ज्ञान-साहित्यिक लय और निष्कर्षात्मक बल बना रहे।
