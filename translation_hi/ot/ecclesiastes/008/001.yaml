id: ECC.8.1
reference: Ecclesiastes 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֚י כְּ/הֶ֣/חָכָ֔ם וּ/מִ֥י יוֹדֵ֖עַ פֵּ֣שֶׁר דָּבָ֑ר חָכְמַ֤ת אָדָם֙ תָּאִ֣יר פָּנָ֔י/ו וְ/עֹ֥ז פָּנָ֖י/ו יְשֻׁנֶּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/001.yaml
  text: Who is like the wise man[a], and who knows the interpretation of a matter? A man's wisdom lights up his face[b], and the hardness of his face is changed.
translation:
  language: hi
  text: बुद्धिमान के समान कौन है,[a] और कौन किसी बात का अर्थ जानता है? मनुष्य की बुद्धि उसके चेहरे को चमका देती है, और उसके चेहरे की कठोरता बदल जाती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान जैसा कौन है?”
    reason: तुलनात्मक इब्रानी वाक्यांश के स्वाभाविक हिन्दी रूपों का विकल्प।
  - marker: b
    text: “चेहरे की कठोरता” का अनुवाद “चेहरे का तेज,” “दृढ़ भाव” या “सख्त भाव” भी हो सकता है। इब्रानी अभिव्यक्ति का आशय निश्चित नहीं है।
    reason: עֹז פָּנָיו की वास्तविक शब्दार्थगत और मुहावरेदार अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מִי כְּהֶחָכָם
  choice: बुद्धिमान के समान कौन है
  rationale: מִי प्रश्नवाचक सर्वनाम है और כְּ तुलना व्यक्त करता है। הֶחָכָם निश्चित एकवचन संज्ञात्मक विशेषण है; हिन्दी में ‘बुद्धिमान’ इसका स्वाभाविक प्रतिनिधिक रूप है।
- source_word: יוֹדֵעַ פֵּשֶׁר דָּבָר
  choice: कौन किसी बात का अर्थ जानता है
  rationale: יוֹדֵעַ का सीधा अर्थ ‘जानता है’ है। פֵּשֶׁר व्याख्या अथवा अर्थ और דָּבָר यहाँ व्यापक रूप से ‘बात/विषय’ है; सहज हिन्दी में ‘किसी बात का अर्थ’ निर्माण-संबंध को स्पष्ट रखता है।
- source_word: חָכְמַת אָדָם
  choice: मनुष्य की बुद्धि
  rationale: אָדָם यहाँ जातिवाचक एकवचन है। ‘मनुष्य की बुद्धि’ हिन्दी में उसके सामान्य मानवीय और एकवचन-प्रतिनिधिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָּאִיר פָּנָיו
  choice: उसके चेहरे को चमका देती है
  rationale: אור का हिफ़ील रूप प्रकाशमान करने का कारणवाचक भाव देता है। ‘चमका देती है’ वर्तमान हिन्दी में चेहरे पर पड़ने वाले प्रभाव को स्पष्ट करता है।
- source_word: עֹז פָּנָיו
  choice: उसके चेहरे की कठोरता
  rationale: עֹז का मूल भाव शक्ति/दृढ़ता है, पर चेहरे के साथ यह कठोर, तीखा या सख्त भाव सूचित कर सकता है। ‘कठोरता’ इस मुहावरे के संभावित आशय को संक्षेप में व्यक्त करती है।
- source_word: יְשֻׁנֶּא
  choice: बदल जाती है
  rationale: שנה का यह रूप निष्क्रिय अथवा मध्यवाच्य अर्थ ‘बदला जाना/बदल जाना’ देता है। ‘बदल जाती है’ हिन्दी में स्वाभाविक है और परिवर्तन की दिशा को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: אָדָם के जातिवाचक एकवचन का अनुवाद
  choice: मनुष्य की बुद्धि
  alternative: किसी पुरुष की बुद्धि
  rationale: इस ज्ञान-सूक्ति में אָדָם समस्त मानव जाति का प्रतिनिधिक एकवचन है। ‘मनुष्य’ उस सामान्य अर्थ को बनाए रखता है और हिन्दी में इसे केवल पुरुष-लिंग तक सीमित नहीं करता।
- issue: עֹז פָּנָיו और יְשֻׁנֶּא के संबंध का अर्थ
  choice: उसके चेहरे की कठोरता बदल जाती है
  alternative: उसके चेहरे का तेज बदल जाता है
  rationale: इब्रानी पदबंध में עֹז ‘बल/दृढ़ता’ भी हो सकता है और चेहरे की कठोरता या तीखेपन का संकेत भी। मुख्य पाठ प्रसंगानुकूल ‘कठोरता’ रखता है, जबकि पादटिप्पणी वास्तविक शब्दार्थगत अस्पष्टता बताती है; परिवर्तन को ‘नरम पड़ना’ कहकर दिशा निर्धारित नहीं की गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेहरा’ को पुरातन ‘मुखमंडल’ पर प्राथमिकता दी गई है। प्रश्नों की काव्यात्मक समानांतरता और दूसरे वाक्य का कारण-परिणाम भाव बनाए रखा गया है।
