source:
  edition: WLC
  text: יֶשׁ הֶבֶל֮ אֲשֶׁ֣ר נַעֲשָׂ֣ה עַל הָ/אָרֶץ֒ אֲשֶׁ֣ר יֵ֣שׁ צַדִּיקִ֗ים אֲשֶׁ֨ר מַגִּ֤יעַ אֲלֵ/הֶם֙ כְּ/מַעֲשֵׂ֣ה הָ/רְשָׁעִ֔ים וְ/יֵ֣שׁ רְשָׁעִ֔ים שֶׁ/מַּגִּ֥יעַ אֲלֵ/הֶ֖ם כְּ/מַעֲשֵׂ֣ה הַ/צַּדִּיקִ֑ים אָמַ֕רְתִּי שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/014.yaml
  text: 'There is a vanity that is done on the earth: there are righteous people to whom it happens according to the deeds of the wicked[a], and there are wicked people to whom it happens according to the deeds of the righteous. I said that this too is vanity.'
translation:
  language: hi
  text: 'पृथ्वी पर एक व्यर्थता है जो होती है: ऐसे धर्मी लोग हैं जिन्हें दुष्टों के कर्मों के अनुरूप परिणाम मिलता है, और ऐसे दुष्ट लोग हैं जिन्हें धर्मियों के कर्मों के अनुरूप परिणाम मिलता है। मैंने कहा कि यह भी व्यर्थता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: व्यर्थता
  rationale: सभोपदेशक में यह एक प्रमुख और बार-बार आने वाला शब्द है। यहाँ यह केवल ‘अर्थहीनता’ नहीं, बल्कि क्षणभंगुरता, पकड़ में न आने और नैतिक परिणामों की निराशाजनक विसंगति को भी व्यक्त करता है।
- source_word: נַעֲשָׂה
  choice: होती है
  rationale: निफ़अल रूप पृथ्वी पर घटने या होने वाली बात को दर्शाता है; ‘होती है’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से किसी कर्ता को नहीं जोड़ता।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: यह इब्रानी पद का सीधा अर्थ है; ‘देश में’ अर्थ को अनावश्यक रूप से स्थानीय बना देता और ‘सूर्य के नीचे’ यहाँ मूल पाठ के शब्द नहीं हैं।
- source_word: צַדִּיקִים
  choice: धर्मी लोग
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘धर्मी लोग’ नैतिक श्रेणी को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַגִּיעַ אֲלֵהֶם
  choice: उन्हें … परिणाम मिलता है
  rationale: शाब्दिक अर्थ ‘उन तक पहुँचता है’ है, पर प्रसंग में किसी व्यक्ति के हिस्से आने वाले परिणाम या दशा का भाव है। ‘परिणाम मिलता है’ इस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּמַעֲשֵׂה
  choice: कर्मों के अनुरूप
  rationale: यह तुलना व्यक्ति के आचरण और उससे जुड़े परिणाम के बीच है। ‘कर्मों के अनुरूप’ तुलना को बनाए रखता है और कर्मफल की कोई विस्तृत धार्मिक व्यवस्था आरोपित नहीं करता।
- source_word: רְשָׁעִים
  choice: दुष्ट लोग
  rationale: ज्ञान-साहित्य में नैतिक रूप से दोषी लोगों के लिए यह मानक और स्पष्ट हिन्दी अभिव्यक्ति है तथा ‘धर्मी लोग’ के साथ समानांतर है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: सरल प्रथम-पुरुष पूर्ण क्रिया का सीधा अनुवाद है; ‘मैंने निष्कर्ष निकाला’ जैसी व्याख्यात्मक तीव्रता नहीं जोड़ी गई।
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: कि यह भी व्यर्थता है
  rationale: ‘भी’ גם के भाव को स्वाभाविक रूप से रखता है और सभोपदेशक की आवर्ती उक्ति की लय बनाए रखता है।
theological_decisions:
- issue: सभोपदेशक में הֶבֶל का अनुवाद
  choice: व्यर्थता
  alternative: भाप; निष्फलता; अर्थहीनता
  rationale: ‘व्यर्थता’ पुस्तक की आवर्ती उक्ति के लिए संक्षिप्त और परिचित है, पर इसे पूर्ण अर्थहीनता तक सीमित नहीं किया गया। पादटिप्पणी शब्द के क्षणभंगुर, पकड़ में न आने वाले और विसंगत पहलुओं को खुला रखती है।
- issue: धर्मी और दुष्ट को मिलने वाले परिणाम का संबंध
  choice: कर्मों के अनुरूप परिणाम
  alternative: दुष्टों/धर्मियों के कर्म ही उनके साथ होते हैं
  rationale: मूल वाक्य यह नहीं बताता कि परिणाम किस विशिष्ट घटना या दैवी निर्णय से आता है। अनुवाद नैतिक उलटाव को स्पष्ट करता है, पर न्याय, दंड या प्रतिफल की कोई अतिरिक्त सैद्धांतिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पृथ्वी पर’ मूल पद के निकट है। समानांतर वाक्य-विन्यास धर्मी और दुष्ट के परिणामों के उलटाव को उभारता है, जबकि ‘परिणाम’ मूल मुहावरे को हिन्दी में समझने योग्य बनाता है।
