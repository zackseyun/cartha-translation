source:
  edition: WLC
  text: אֲנִי֙ פִּי מֶ֣לֶךְ שְׁמ֔וֹר וְ/עַ֕ל דִּבְרַ֖ת שְׁבוּעַ֥ת אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/002.yaml
  text: I say[a], keep the king’s command[c][b], because of your oath before God.
translation:
  language: hi
  text: 'मैं कहता हूँ[a]: राजा की आज्ञा[b] मानो, परमेश्वर के सामने खाई हुई अपनी शपथ के कारण[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है। इसका वाक्य-विन्यास इस प्रकार भी समझा जा सकता है: “राजा की आज्ञा मानो, और परमेश्वर की शपथ के कारण ऐसा करो।”'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “राजा का मुँह” है, अर्थात राजा का कहा हुआ वचन या आदेश।
    reason: lexical_alternative
  - marker: c
    text: “परमेश्वर के सामने खाई हुई शपथ” का अर्थ “परमेश्वर से की गई शपथ” या “परमेश्वर की शपथ” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: मैं कहता हूँ
  rationale: इब्रानी पाठ केवल स्वतंत्र सर्वनाम ‘मैं’ से अचानक आरम्भ होता है और क्रिया अध्याहृत है। सहज आधुनिक हिन्दी के लिए न्यूनतम पूर्ति के रूप में ‘कहता हूँ’ जोड़ा गया है; वैकल्पिक वाक्य-विन्यास पादटिप्पणी में रखा गया है।
- source_word: פִּי מֶלֶךְ
  choice: राजा की आज्ञा
  rationale: शाब्दिक अर्थ ‘राजा का मुँह’ है, पर यह राजा के कहे हुए अधिकारपूर्ण वचन या आदेश के लिए मुहावरा है। ‘आज्ञा’ हिन्दी में उसके आशय और अधिकार—दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: שְׁמֹר
  choice: मानो
  rationale: क्रिया का अर्थ ‘रखना, चौकसी करना, पालन करना’ हो सकता है। आज्ञा के साथ हिन्दी में ‘मानो’ स्वाभाविक है और यहाँ अपेक्षित आज्ञापालन का भाव स्पष्ट करता है।
- source_word: וְעַל דִּבְרַת
  choice: के कारण
  rationale: यह संक्षिप्त संयोजन प्रसंग में आधार या कारण बताता प्रतीत होता है। ‘के कारण’ सम्भावित कारणवाचक अर्थ देता है, जबकि ‘और ... के कारण’ वाला वैकल्पिक वाक्य-विन्यास पादटिप्पणी में सुरक्षित है।
- source_word: שְׁבוּעַת אֱלֹהִים
  choice: परमेश्वर के सामने खाई हुई अपनी शपथ
  rationale: 'समास अस्पष्ट है: शपथ परमेश्वर के सामने, परमेश्वर से, या परमेश्वर की हो सकती है। आज्ञार्थक द्वितीय पुरुष के प्रसंग में श्रोता की परमेश्वर को साक्षी मानकर खाई गई शपथ सर्वाधिक सुसंगत है; ‘अपनी’ उस निहित सम्बन्ध को स्पष्ट करता है, और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।'
theological_decisions:
- issue: राजकीय आज्ञापालन के आधार के रूप में שְׁבוּעַת אֱלֹהִים का अर्थ
  choice: श्रोता द्वारा परमेश्वर के सामने खाई गई शपथ, जो राजा की आज्ञा मानने का आधार है
  alternative: परमेश्वर से की गई शपथ; अथवा परमेश्वर की शपथ
  rationale: आज्ञार्थक प्रसंग में यह अर्थ सबसे सुसंगत है, पर इब्रानी समास अन्य अर्थों की भी अनुमति देता है। इसलिए मुख्य पाठ में सम्भावित अर्थ रखा गया है और पादटिप्पणी में अस्पष्टता बचाई गई है, ताकि पद को बिना शर्त राजकीय अधिकार की व्यापक शिक्षा न बना दिया जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञा मानो’ सामान्य हिन्दी में स्पष्ट है; इब्रानी की संक्षिप्तता तथा शपथ-सम्बन्धी वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित रखी गई है।
