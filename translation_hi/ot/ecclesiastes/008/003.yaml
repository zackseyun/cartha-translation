  text: אַל תִּבָּהֵ֤ל מִ/פָּנָי/ו֙ תֵּלֵ֔ךְ אַֽל תַּעֲמֹ֖ד בְּ/דָבָ֣ר רָ֑ע כִּ֛י כָּל אֲשֶׁ֥ר יַחְפֹּ֖ץ יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/008/003.yaml
  text: Do not be hasty to leave his presence[a]. Do not take your stand in an evil matter[b], for he does whatever he pleases.
translation:
  language: hi
  text: उसके सामने से जाने की जल्दी मत कर[a]। किसी बुरे मामले में डटा मत रह[b], क्योंकि वह जो चाहता है, वही करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घबराकर उसके सामने से मत जा।” इब्रानी क्रिया जल्दबाज़ी के साथ-साथ व्याकुलता या घबराहट का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “किसी बुरे मामले का पक्ष मत ले,” अथवा “किसी बुरी बात में बना मत रह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּבָּהֵל
  choice: उतावली न कर
  rationale: בהל में घबराहट या व्याकुलता के कारण जल्दबाज़ी करने का भाव हो सकता है। यहाँ जाने की क्रिया के साथ ‘उतावली न कर’ व्यावहारिक चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि भावगत विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִפָּנָיו תֵּלֵךְ
  choice: उसके सामने से जाने में
  rationale: शाब्दिक अर्थ ‘उसके सामने से जा’ है। यह रूप राज-दरबार की उपस्थिति का संकेत बनाए रखता है और हिन्दी में सहज है।
- source_word: תַּעֲמֹד
  choice: अड़ मत जा
  rationale: עמד यहाँ केवल शारीरिक रूप से खड़े होने के बजाय किसी स्थिति या काम पर टिके रहने अथवा उसे दृढ़ता से अपनाने का अर्थ देता है। ‘अड़ मत जा’ चेतावनी के बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּדָבָר רָע
  choice: किसी बुरी बात पर
  rationale: דבר का अर्थ बात, मामला, विषय या काम हो सकता है। ‘बुरी बात’ इसकी व्यापकता और רע की नैतिक नकारात्मकता दोनों को बनाए रखता है।
- source_word: כִּי כָּל אֲשֶׁר יַחְפֹּץ יַעֲשֶׂה
  choice: क्योंकि वह जो चाहता है, वही करता है
  rationale: यह राजा की अपनी इच्छा को कार्यान्वित करने की प्रभावी सामर्थ्य पर बल देता है। हिन्दी वाक्य स्वाभाविक रहते हुए मूल की व्यापकता को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अंतिम कथन को पहले दिए गए निषेधों का कारण बताने वाली व्याख्या के रूप में स्पष्ट करता है।
theological_decisions:
- issue: एकवचन तृतीय पुरुष सर्वनामों का संदर्भ
  choice: सर्वनाम निकटवर्ती संदर्भ के राजा को सूचित करते हैं, पर अनुवाद में केवल ‘उसके/वह’ रखा गया है।
  alternative: इन्हें सामान्य रूप से किसी शासक या अधिकारी के लिए समझना।
  rationale: सभोपदेशक 8:2 और 8:4 में राजा और उसके अधिकार की चर्चा होने से राजा सबसे स्वाभाविक संदर्भ है। फिर भी मूल की तरह सर्वनाम रखना अनावश्यक स्पष्टता जोड़ने से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन एकवचन अनौपचारिक/सामान्य आज्ञार्थक रूप में है, जो इब्रानी के एकवचन संबोधन को दर्शाता है। ‘अड़ मत जा’ मुहावरेदार है, पर पादटिप्पणी में ‘पक्ष लेना’ और ‘बने रहना’ जैसे संभावित अर्थ सुरक्षित रखे गए हैं।
