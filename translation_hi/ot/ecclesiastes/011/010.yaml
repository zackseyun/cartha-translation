source:
  edition: WLC
  text: וְ/הָסֵ֥ר כַּ֨עַס֙ מִ/לִּבֶּ֔/ךָ וְ/הַעֲבֵ֥ר רָעָ֖ה מִ/בְּשָׂרֶ֑/ךָ כִּֽי הַ/יַּלְד֥וּת וְ/הַֽ/שַּׁחֲר֖וּת הָֽבֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/010.yaml
  text: So remove vexation from your heart, and put away harm from your flesh, for youth and the dawn of life are vapor.
translation:
  language: hi
  text: इसलिए अपने मन से खीझ दूर कर और अपने शरीर से हानि दूर कर, क्योंकि बाल्यावस्था और यौवन[a] भाप के समान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काले बालों का समय”; अर्थात आरंभिक यौवन।
    reason: हिब्रू שַׁחֲרוּת दुर्लभ है और इसका संबंध काले बालों अथवा जीवन के आरंभिक यौवन से समझा जाता है; पादटिप्पणी इस व्याख्यात्मक अनिश्चितता को सुरक्षित रखती है।
lexical_decisions:
- source_word: כַּעַס
  choice: खीझ
  rationale: यह शब्द यहाँ मन की झुँझलाहट, खिन्नता या व्याकुलता का भाव देता है; ‘खीझ’ आदेश के संदर्भ में स्वाभाविक और सामान्य हिन्दी है।
- source_word: רָעָה
  choice: कष्ट
  rationale: शब्द का अर्थ बुराई, विपत्ति या हानि हो सकता है। शरीर से हटाने के संदर्भ में ‘कष्ट’ नैतिक बुराई तक अर्थ को सीमित किए बिना शारीरिक हानि/दुःख का भाव व्यक्त करता है।
- source_word: הַשַּׁחֲרוּת
  choice: जीवन की भोर
  rationale: यह दुर्लभ शब्द संभवतः काले बालों अथवा जीवन के प्रभात, अर्थात आरंभिक यौवन, की ओर संकेत करता है। संदर्भ और अंग्रेज़ी परामर्श-पाठ के अनुरूप काव्यात्मक ‘जीवन की भोर’ चुना गया है।
- source_word: הָבֶל
  choice: भाप के समान
  rationale: הבל क्षणभंगुर, पकड़ में न आने वाली भाप/साँस का बिंब है। ‘भाप के समान’ युवावस्था की क्षणभंगुरता बनाए रखता है और केवल ‘व्यर्थ’ कहकर अर्थ को दार्शनिक निष्कर्ष तक सीमित नहीं करता।
theological_decisions:
- issue: רָעָה को नैतिक ‘बुराई’ या अनुभवगत ‘कष्ट/हानि’ समझना
  choice: कष्ट
  alternative: बुराई
  rationale: ‘अपने शरीर से ... हटा दे’ का समानांतर प्रयोग अनुभवगत हानि, पीड़ा या कष्ट के पक्ष में है; फिर भी मूल शब्द की व्यापकता को संकीर्ण चिकित्सकीय अर्थ में नहीं बाँधा गया।
- issue: הָבֶל का अर्थ
  choice: भाप के समान
  alternative: व्यर्थ
  rationale: सभोपदेशक में यह शब्द क्षणभंगुरता, अस्थिरता और अगम्यता की तनावपूर्ण छवि रखता है; ‘भाप’ उस मूल रूपक को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। एकवचन संबोधन के अनुरूप ‘कर/हटा दे’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
