revisions:
- from: हे जवान, अपनी युवावस्था में आनन्द मना, और अपनी जवानी के दिनों में तेरा मन तुझे प्रसन्न करे। अपने मन के मार्गों पर चल और जो कुछ तेरी आँखों को भाए, उसके अनुसार चल;[a] पर यह जान रख कि इन सब बातों के लिए परमेश्वर तुझे न्याय के सामने लाएगा।[b]
  to: हे युवक, अपनी युवावस्था में आनन्द मना, और अपनी जवानी के दिनों में तेरा मन तुझे प्रसन्न करे। अपने मन के मार्गों पर और अपनी आँखों को जो दिखाई देता है उसके अनुसार चल;[a] पर यह जान रख कि इन सब बातों के लिए परमेश्वर तुझे न्याय के लिए लाएगा।[b]
  rationale: The revision avoids making the ‘sight of your eyes’ explicitly mean whatever pleases the eyes, preserves the single imperative governing both parallel phrases, and uses a clearer masculine form of address. It retains the source’s unresolved tension between enjoyment and accountability.
