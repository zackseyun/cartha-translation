base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/009.yaml
  text: Rejoice[a], young man, in your youth, and let your heart cheer you in the days of your young manhood. Walk in the ways of your heart and in the sight of your eyes[d][c][b], but know that for all these things God will bring you into judgment.
translation:
  language: hi
  text: हे युवक, अपनी युवावस्था में आनन्द मना, और अपनी जवानी के दिनों में तेरा मन तुझे प्रसन्न करे। अपने मन के मार्गों पर और अपनी आँखों को जो दिखाई देता है उसके अनुसार चल;[a] पर यह जान रख कि इन सब बातों के लिए परमेश्वर तुझे न्याय के लिए लाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आँखों के दृश्यों में [चल]।” इसका अर्थ “अपनी आँखों को जो दिखाई देता है उसके अनुसार चल” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: सभोपदेशक यहाँ जीवन का आनन्द लेने और परमेश्वर के सामने जवाबदेह होने—दोनों को साथ रखता है। इसे न्याय की चेतावनी से सीमित अनुमति या चेतावनी-भरे प्रोत्साहन, दोनों रूपों में पढ़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמַח
  choice: आनन्द मना
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक क्रिया है और सक्रिय हर्ष का आह्वान करती है। यह सभोपदेशक में जीवन का आनन्द लेने के बार-बार आने वाले आग्रह के अनुरूप है।
- source_word: בָּחוּר
  choice: हे जवान
  rationale: मूल शब्द पुल्लिंग एकवचन में सीधे एक युवक को सम्बोधित करता है। ‘हे जवान’ आधुनिक, स्वाभाविक और लिंग-सटीक सम्बोधन है।
- source_word: בְּיַלְדוּתֶיךָ
  choice: अपनी युवावस्था में
  rationale: इस सन्दर्भ में शब्द केवल बचपन नहीं, बल्कि जीवन की युवा अवस्था को दर्शाता है।
- source_word: וִיטִיבְךָ לִבְּךָ
  choice: तेरा मन तुझे प्रसन्न करे
  rationale: हिफ़ील रूप में ‘तेरा मन’ कर्ता है और वह प्रसन्नता या भलाई उत्पन्न करता है। इस अनुवाद में उसका कारणवाचक भाव बना रहता है।
- source_word: בִּימֵי בְחוּרוֹתֶךָ
  choice: अपनी जवानी के दिनों में
  rationale: यह युवावस्था के जोश और सामर्थ्य के समय को सूचित करता है। ‘जवानी के दिन’ पहले वाक्यांश से हल्का अर्थगत भेद बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְהַלֵּךְ
  choice: चल
  rationale: यह आचरण के लिए प्रयुक्त आज्ञार्थक रूप है। ‘चल’ इब्रानी के मार्ग-रूपक को सुरक्षित रखता है।
- source_word: בְּדַרְכֵי לִבְּךָ
  choice: अपने मन के मार्गों पर
  rationale: यह ‘मार्गों’ के रूपक और मन को इच्छा तथा अभिप्राय के केन्द्र के रूप में प्रस्तुत करने वाली इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: וּבְמַרְאֵי עֵינֶיךָ
  choice: जो कुछ तेरी आँखों को भाए, उसके अनुसार
  rationale: शाब्दिक अभिव्यक्ति ‘तेरी आँखों के दृश्य/दिखाई देने वाली बातों में’ है। प्रसंग में यह आँखों को आकर्षक या मनभावन लगने वाली बातों के अनुसार चलने का भाव देती है; पाद-टिप्पणी शाब्दिक सम्भावना को सुरक्षित रखती है।
- source_word: וְדָע
  choice: पर यह जान रख
  rationale: वाव का मूल अर्थ ‘और’ है, पर यहाँ यह आनन्द के आह्वान के साथ जवाबदेही की चेतावनी को सन्तुलित करता है। ‘पर’ उस प्रवचनात्मक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל כָּל אֵלֶּה
  choice: इन सब बातों के लिए
  rationale: न्यायिक सन्दर्भ में पूर्वसर्ग इन सभी आचरणों के विषय में जवाबदेही व्यक्त करता है।
- source_word: יְבִיאֲךָ הָאֱלֹהִים בַּמִּשְׁפָּט
  choice: परमेश्वर तुझे न्याय के सामने लाएगा
  rationale: यह परमेश्वर द्वारा मनुष्य को न्यायिक जाँच में लाए जाने का गम्भीर भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या पद स्वेच्छाचारी सुख को स्वीकृति देता है या परमेश्वर के प्रति जवाबदेही के अधीन जीवन के आनन्द का आह्वान करता है
  choice: मुख्य पाठ आनन्द मनाने की सकारात्मक आज्ञाओं और परमेश्वर के न्याय की चेतावनी—दोनों को साथ रखता है।
  alternative: सारी आज्ञाएँ व्यंग्यात्मक हैं और मुख्यतः युवा भोग-विलास की निन्दा करती हैं; अथवा वे जीवन का आनन्द लेने की सीधी अनुमति हैं, जिसकी नैतिक सीमा न्याय है।
  rationale: सभोपदेशक जीवन के आनन्द और परमेश्वर के सामने जवाबदेही को प्रायः साथ रखता है। इब्रानी पाठ स्पष्ट रूप से व्यंग्य घोषित नहीं करता, इसलिए अनुवाद तनाव को हल किए बिना सुरक्षित रखता है।
- issue: सम्बोधित व्यक्ति का लिंग
  choice: पुल्लिंग एकवचन सम्बोधन को ‘हे जवान’ से व्यक्त किया गया है।
  alternative: हे युवा व्यक्ति; हे युवक
  rationale: इब्रानी संज्ञा और सम्बद्ध प्रत्यय पुल्लिंग एकवचन हैं; इसलिए अनुवाद उस व्याकरणिक और संवादगत विशेषता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘मन के मार्गों पर चल’ में बाइबलीय रूपक सुरक्षित है, जबकि आँखों वाले समानान्तर वाक्यांश को अर्थ-स्पष्ट बनाया गया है और उसका अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
