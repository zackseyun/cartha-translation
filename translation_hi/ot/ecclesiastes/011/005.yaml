reference: Ecclesiastes 11:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר אֵֽינְ/ךָ֤ יוֹדֵ֨עַ֙ מַה דֶּ֣רֶךְ הָ/ר֔וּחַ כַּ/עֲצָמִ֖ים בְּ/בֶ֣טֶן הַ/מְּלֵאָ֑ה כָּ֗כָה לֹ֤א תֵדַע֙ אֶת מַעֲשֵׂ֣ה הָֽ/אֱלֹהִ֔ים אֲשֶׁ֥ר יַעֲשֶׂ֖ה אֶת הַ/כֹּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/005.yaml
  text: Just as you do not know the way of the wind[a], or how the bones form in the womb of a pregnant woman, so you do not know the work of God[b], who makes everything.
translation:
  language: hi
  text: जैसे तुम नहीं जानते कि हवा किस राह चलती है[a], या गर्भवती स्त्री के गर्भ में हड्डियाँ कैसे बनती हैं[b], वैसे ही तुम परमेश्वर—जो सब कुछ करता है—के कार्य को नहीं जानते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आत्मा किस राह चलती है’ अथवा ‘श्वास कैसे जाती है’; इब्रानी शब्द רוּחַ का अर्थ ‘हवा,’ ‘श्वास’ या ‘आत्मा’ हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: ‘भरी हुई के गर्भ में’; यह गर्भवती स्त्री के लिए प्रयुक्त मुहावरा है।'
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ הָרוּחַ
  choice: हवा किस राह चलती है
  rationale: רוּחַ के अर्थ ‘हवा,’ ‘श्वास’ और ‘आत्मा’ हो सकते हैं। सृष्टि की छिपी प्रक्रियाओं के इस संदर्भ में ‘हवा’ सबसे स्वाभाविक है; ‘राह’ דֶּרֶךְ की छवि को बनाए रखता है।
- source_word: כַּעֲצָמִים
  choice: हड्डियाँ कैसे बनती हैं
  rationale: इब्रानी वाक्यांश संक्षिप्त और लुप्त क्रिया वाला है। हिन्दी में निहित भाव को स्पष्ट करने के लिए ‘कैसे बनती हैं’ जोड़ा गया है।
- source_word: בְּבֶטֶן הַמְּלֵאָה
  choice: गर्भवती स्त्री के गर्भ में
  rationale: शाब्दिक अर्थ ‘भरी हुई के गर्भ में’ है, जो गर्भवती स्त्री के लिए प्रयुक्त मुहावरा है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מַעֲשֵׂה הָאֱלֹהִים
  choice: परमेश्वर का वह काम
  rationale: यह रूप इब्रानी रचना के ‘परमेश्वर के काम’ को सुरक्षित रखते हुए अगले संबंधवाचक उपवाक्य से सहजता से जुड़ता है।
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת־הַכֹּל
  choice: जो सब कुछ करता है
  rationale: עָשָׂה का अर्थ संदर्भानुसार ‘करना’ या ‘बनाना’ हो सकता है। ‘सब कुछ करता है’ उसी व्यापकता और क्रियात्मक अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: इस पद में רוּחַ का अर्थ
  choice: हवा
  alternative: श्वास या आत्मा
  rationale: संदर्भ मनुष्य द्वारा सृष्टि और परमेश्वर के कार्यों की छिपी प्रक्रियाएँ न जान पाने पर बल देता है, इसलिए ‘हवा’ सर्वाधिक उपयुक्त है। फिर भी मूल शब्द की वास्तविक बहुअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: अंतिम उपवाक्य में עָשָׂה का आशय
  choice: जो सब कुछ करता है
  alternative: जो सब कुछ बनाता है
  rationale: ‘करता है’ परमेश्वर की समस्त गतिविधि को समेट सकता है और उसी धातु से बने ‘काम’ के साथ शब्दगत संबंध बनाए रखता है; ‘बनाता है’ संभव है, पर अर्थ को केवल सृजन की ओर अधिक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन के लिए ‘तुम’ प्रयोग किया गया है। समानांतर ‘जैसे… वैसे ही’ संरचना मूल तर्क को स्पष्ट रखती है; वास्तविक शब्दार्थगत अस्पष्टताएँ पादटिप्पणी और निर्णयों में सुरक्षित हैं।
