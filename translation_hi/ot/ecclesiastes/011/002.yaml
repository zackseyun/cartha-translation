base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/002.yaml
  text: Give a portion to seven[a], and even to eight, for you do not know what disaster will happen on the earth.
translation:
  language: hi
  text: सात को हिस्सा दे, और आठ को भी; क्योंकि तू नहीं जानता कि पृथ्वी[a] पर कौन-सी विपत्ति आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि पर।” इब्रानी शब्द אֶרֶץ का अर्थ संदर्भ के अनुसार “पृथ्वी,” “भूमि” या “देश” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּן
  choice: दे
  rationale: यह נתן का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘दे’ सीधी और स्वाभाविक आज्ञा को बनाए रखता है।
- source_word: חֵלֶק
  choice: हिस्सा
  rationale: חֵלֶק का अर्थ भाग या हिस्सा है। ‘हिस्सा’ संसाधनों को बाँटने के इस संदर्भ में ठोस और सहज है।
- source_word: לְשִׁבְעָה וְגַם לִשְׁמוֹנָה
  choice: सात को ... बल्कि आठ को भी
  rationale: मूल पाठ की सात-आठ वाली संख्यात्मक साहित्यिक उक्ति को बिना सामान्यीकृत किए सुरक्षित रखा गया है; ‘बल्कि ... भी’ विस्तार और उदारता का भाव व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले उपदेश का कारण प्रस्तुत करता है।
- source_word: לֹא תֵדַע
  choice: तू नहीं जानता
  rationale: नकार सहित क्रिया ज्ञान के अभाव को सीधे व्यक्त करती है; एकवचन संबोधन भी सुरक्षित है।
- source_word: מַה יִּהְיֶה
  choice: कैसी ... आएगी
  rationale: היה यहाँ भविष्य में घटित होने का बोध देता है। हिंदी में विपत्ति के साथ ‘आएगी’ स्वाभाविक है और मूल के भाव को स्पष्ट रखता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ शब्द नैतिक बुराई के बजाय हानिकारक घटना या संकट को दर्शाता है; ‘विपत्ति’ इसी प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: עַל הָאָרֶץ
  choice: पृथ्वी पर
  rationale: Qoheleth के व्यापक ज्ञान-साहित्यिक संदर्भ में ‘पृथ्वी’ सामान्य मानवीय क्षेत्र को दर्शाती है, जबकि ‘देश’ या ‘भूमि’ भी भाषाई रूप से संभव है।
theological_decisions:
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश या भूमि
  rationale: मूल शब्द व्यापक ‘पृथ्वी’ अथवा अधिक सीमित ‘देश/भूमि’ दोनों अर्थ दे सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज शैली अपनाई गई है। एकवचन इब्रानी संबोधन के अनुरूप ‘तू’ रखा गया है। मूल की संख्यात्मक उक्ति और पृथ्वी/देश की अर्थगत अस्पष्टता सुरक्षित रखी गई है।
