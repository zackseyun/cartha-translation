source:
  edition: WLC
  text: שַׁלַּ֥ח לַחְמְ/ךָ֖ עַל פְּנֵ֣י הַ/מָּ֑יִם כִּֽי בְ/רֹ֥ב הַ/יָּמִ֖ים תִּמְצָאֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/001.yaml
  text: Cast your bread upon the surface of the waters, for after many days you will find it.
translation:
  language: hi
  text: अपनी रोटी जल पर डाल दे[a], क्योंकि बहुत दिनों बाद तू उसे पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी रोटी जल पर भेज दे।” इब्रानी चित्र उदारता, निवेश, या दोनों की ओर संकेत कर सकता है; इसलिए मुख्य पाठ में रूपक को खुला रखा गया है।
    reason: शाब्दिक विकल्प और रूपक की वास्तविक अर्थ-संभावनाएँ बताना।
lexical_decisions:
- source_word: שַׁלַּח
  choice: छोड़ दे
  rationale: आज्ञार्थक क्रिया का मूल भाव ‘भेजना/जाने देना’ है। ‘छोड़ दे’ जल पर रोटी रखने या बहने देने की सजीव, किंतु अनिर्णीत, छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַחְמְךָ
  choice: अपनी रोटी
  rationale: לֶחֶם का ठोस और सामान्य अर्थ ‘रोटी’ है; व्यापक ‘भोजन’ की अपेक्षा यही नीतिवचन की मूल छवि सुरक्षित रखता है।
- source_word: עַל פְּנֵי הַמָּיִם
  choice: जल के ऊपर
  rationale: पदबंध का शाब्दिक भाव ‘जल के मुख/सतह पर’ है। ‘जल के ऊपर’ आधुनिक हिन्दी में सहज है और सतह की स्थानगत छवि को पर्याप्त रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहली आज्ञा का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक हिन्दी संयोजक है।
- source_word: בְרֹב הַיָּמִים
  choice: बहुत दिनों के बाद
  rationale: यह अनुवाद विलंबित समय का भाव बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: תִּמְצָאֶנּוּ
  choice: तू उसे पाएगा
  rationale: क्रिया का अर्थ ‘पाना/ढूँढ़ पाना’ है और पुल्लिंग एकवचन प्रत्यय का स्वाभाविक पूर्वपद ‘रोटी’ है। ‘वापस पाएगा’ कहना लौटने का भाव अनावश्यक रूप से जोड़ देता।
theological_decisions:
- issue: जल पर रोटी छोड़ने की नीतिवचनात्मक छवि की व्याख्या
  choice: मुख्य पाठ में रूपक को यथावत रखा गया है और उसे उदारता, व्यापार या जोखिम उठाने की किसी एक व्याख्या तक सीमित नहीं किया गया।
  alternative: इसे स्पष्ट रूप से दान देने की शिक्षा अथवा व्यापारिक निवेश और जोखिम उठाने का निर्देश बताना।
  rationale: इब्रानी कथन जानबूझकर चित्रात्मक है और एक से अधिक अर्थ-संभावनाएँ रखता है; अनुवाद में उस वास्तविक अस्पष्टता को सुरक्षित रखना उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और नीतिवचन-सुलभ हिन्दी। मूल पद में एकवचन अनौपचारिक संबोधन होने के कारण ‘तू’ रखा गया है; वाक्य संक्षिप्त है और रूपक की अस्पष्टता सुरक्षित है।
