  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמֵר
  choice: नज़र रखता रहता है
  rationale: यह कृदन्त लगातार या आदतन ध्यान देने का भाव व्यक्त करता है। ‘नज़र रखता रहता है’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ सुरक्षा करने के बजाय मौसम को ध्यान से देखते रहने का अर्थ देता है।
- source_word: רוּחַ
  choice: हवा
  rationale: बोआई और बादलों के कृषि-संदर्भ में इसका मौसम-संबंधी अर्थ ‘हवा’ स्पष्ट है; ‘आत्मा’ या ‘श्वास’ यहाँ अनुपयुक्त होंगे।
- source_word: יִזְרָע
  choice: बीज नहीं बोएगा
  rationale: अपूर्ण क्रिया-रूप यहाँ सामान्य नीतिवचनात्मक परिणाम बताता है। भविष्यत् रूप ‘नहीं बोएगा’ उस परिणाम को सहज हिन्दी में व्यक्त करता है। ‘बीज बोना’ सामान्य और स्पष्ट कृषि-अभिव्यक्ति है।
- source_word: וְרֹאֶה
  choice: और जो ... देखता रहता है
  rationale: यह कृदन्त पहले खंड के कृदन्त के समान एक सामान्य व्यक्ति को दर्शाता है। ‘देखता रहता है’ निरंतर निरीक्षण का भाव बनाए रखता है।
- source_word: בֶעָבִים
  choice: बादलों को
  rationale: देखने की क्रिया के साथ हिन्दी में ‘बादलों को’ स्वाभाविक है और मूल के मौसम-संबंधी चित्र को सीधे रखता है।
- source_word: יִקְצוֹר
  choice: फसल नहीं काटेगा
  rationale: क्रिया का अर्थ काटना या कटनी करना है। ‘फसल काटेगा’ साधारण आधुनिक हिन्दी में स्पष्ट है और बोआई-कटनी के समानांतर भाव को बनाए रखता है।
