source:
  edition: WLC
  text: כִּ֣י אִם שָׁנִ֥ים הַרְבֵּ֛ה יִחְיֶ֥ה הָ/אָדָ֖ם בְּ/כֻלָּ֣/ם יִשְׂמָ֑ח וְ/יִזְכֹּר֙ אֶת יְמֵ֣י הַ/חֹ֔שֶׁךְ כִּֽי הַרְבֵּ֥ה יִהְי֖וּ כָּל שֶׁ/בָּ֥א הָֽבֶל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/008.yaml
  text: For if a man lives many years[a], let him rejoice in them all; but let him remember the days of darkness, for they will be many. All that comes is vapor.
translation:
  language: hi
  text: क्योंकि यदि कोई मनुष्य बहुत वर्षों तक जीवित रहे, तो वह उन सभी वर्षों में आनन्द मनाए; पर वह अंधकार के दिनों को स्मरण रखे, क्योंकि वे बहुत होंगे। जो कुछ आता है, वह वाष्प[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साँस’; परंपरागत रूप से ‘व्यर्थता।’ हिब्रू शब्द हेवेल सभोपदेशक में बार-बार आता है और ऐसी वस्तु का बोध करा सकता है जो क्षणभंगुर, सारहीन या पकड़ में न आनेवाली हो।
    reason: הָבֶל की मूर्त उपमा और उसके प्रमुख पारंपरिक तथा शाब्दिक विकल्पों को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले विचार से कारणसूचक संबंध रखते हुए एक शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों पहलुओं को बनाए रखता है।
- source_word: הָאָדָם
  choice: कोई मनुष्य
  rationale: यहाँ एकवचन संज्ञा सामान्य प्रतिनिधि अर्थ में है। ‘कोई मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और कथन को समस्त मानव जीवन पर लागू रहने देता है।
- source_word: בְּכֻלָּם יִשְׂמָח
  choice: वह उन सभी वर्षों में आनन्द मनाए
  rationale: सर्वनाम का संकेत ‘बहुत वर्षों’ की ओर स्पष्ट किया गया है, और क्रिया के उपदेशात्मक भाव को ‘आनन्द मनाए’ से व्यक्त किया गया है।
- source_word: יְמֵי הַחֹשֶׁךְ
  choice: अंधकार के दिनों
  rationale: मूल रूपक को बिना किसी एक व्याख्या—विपत्ति, वृद्धावस्था, मृत्यु या कब्र—तक सीमित किए ज्यों का त्यों रखा गया है।
- source_word: כָּל שֶׁבָּא
  choice: जो कुछ आता है
  rationale: यह व्यापक, सामान्य कथन है। ‘आता है’ हिब्रू अभिव्यक्ति के खुले कालगत और अर्थगत संकेत को अनावश्यक रूप से केवल भविष्य तक सीमित नहीं करता।
- source_word: הָבֶל
  choice: वाष्प
  rationale: सभोपदेशक की इस आवर्ती मूर्त उपमा में क्षणभंगुरता, अस्थिरता और पकड़ में न आने का भाव है। ‘वाष्प’ इसे ‘व्यर्थ’ जैसे अधिक व्याख्यात्मक शब्द से बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: הָאָדָם का सामान्य प्रतिनिधि अर्थ
  choice: कोई मनुष्य
  alternative: कोई व्यक्ति; मानवजाति
  rationale: मूल का एकवचन रूप रखा गया है, पर इसका आशय किसी केवल पुरुष-विशेष तक सीमित नहीं किया गया।
- issue: सभोपदेशक में הָבֶל का अर्थ
  choice: वाष्प
  alternative: साँस; व्यर्थता
  rationale: ‘वाष्प’ मूल रूपक और उसकी अर्थगत व्यापकता को बनाए रखता है; ‘व्यर्थता’ कथन को ‘अर्थहीनता’ की ओर आवश्यकता से अधिक निर्धारित कर सकती है।
- issue: ‘अंधकार के दिन’ का संकेत
  choice: रूपक को अनिर्धारित रखा गया
  alternative: इसे केवल विपत्ति, वृद्धावस्था या मृत्यु के रूप में स्पष्ट करना
  rationale: हिब्रू वाक्यांश में अनेक संभावित संकेत हैं; अनुवाद किसी एक को मूल पाठ से अधिक निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘आनन्द मनाए’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘अंधकार के दिन’ और ‘वाष्प’ पुस्तक के काव्यात्मक रूपकों को सुरक्षित रखते हैं।
