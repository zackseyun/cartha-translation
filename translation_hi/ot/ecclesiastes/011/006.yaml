  yaml_path: translation/ot/ecclesiastes/011/006.yaml
  text: In the morning sow your seed[a], and in the evening do not let your hand rest, for you do not know which will succeed, this or that[b], or whether both alike will be good.
translation:
  language: hi
  text: सुबह अपना बीज बो, और शाम को भी अपना हाथ मत रोक[a], क्योंकि तुम नहीं जानते कि कौन-सा सफल होगा, यह या वह, या क्या दोनों ही एक समान अच्छे सिद्ध होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपना हाथ मत रोक’ काम करना बंद न करने के लिए प्रयुक्त एक हिब्रू मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: यह दिन के पहले भाग को सूचित करने वाला स्वाभाविक और संक्षिप्त आधुनिक हिन्दी प्रयोग है।
- source_word: זְרַע אֶת זַרְעֶךָ
  choice: अपना बीज बो
  rationale: क्रिया और संज्ञा के कृषि-संबंधी बिंब को सीधे बनाए रखता है और कथन के व्यापक ज्ञानपरक अर्थ को सीमित नहीं करता।
- source_word: וְלָעֶרֶב
  choice: और शाम को भी
  rationale: सुबह के समानांतर दूसरे समय को दिखाता है; ‘भी’ निरंतर परिश्रम के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל תַּנַּח יָדֶךָ
  choice: अपने हाथ को विश्राम मत दो
  rationale: हिब्रू के ठोस मुहावरे को बनाए रखते हुए काम बंद न करने का आशय समझने योग्य रहता है।
- source_word: כִּי אֵינְךָ יוֹדֵעַ
  choice: क्योंकि तुम नहीं जानते
  rationale: आज्ञा के पीछे का कारण स्पष्ट करता है और एकवचन संबोधन को सहज आधुनिक हिन्दी में रखता है।
- source_word: אֵי זֶה יִכְשָׁר
  choice: कौन सफल होगा
  rationale: दो प्रयासों में से किसका परिणाम अनुकूल होगा, इस अनिश्चितता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֲזֶה אוֹ זֶה
  choice: यह या वह
  rationale: दो संभावनाओं के बीच हिब्रू के स्पष्ट संकेतात्मक विरोध को ज्यों का त्यों रखता है।
- source_word: וְאִם שְׁנֵיהֶם כְּאֶחָד טוֹבִים
  choice: या दोनों ही एक समान अच्छे सिद्ध होंगे
  rationale: इस तीसरी संभावना को खुला रखता है कि दोनों प्रयास समान रूप से अच्छा परिणाम दें।
