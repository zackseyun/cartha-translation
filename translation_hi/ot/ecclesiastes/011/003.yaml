  text: אִם יִמָּלְא֨וּ הֶ/עָבִ֥ים גֶּ֨שֶׁם֙ עַל הָ/אָ֣רֶץ יָרִ֔יקוּ וְ/אִם יִפּ֥וֹל עֵ֛ץ בַּ/דָּר֖וֹם וְ/אִ֣ם בַּ/צָּפ֑וֹן מְק֛וֹם שֶׁ/יִּפּ֥וֹל הָ/עֵ֖ץ שָׁ֥ם יְהֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/011/003.yaml
  text: If the clouds are full of rain[a], they pour it out on the earth; and if a tree falls to the south or to the north, in the place where the tree falls, there it will lie.
translation:
  language: hi
  text: यदि बादल बारिश से भर जाएँ, तो वे उसे धरती पर बरसा देते हैं; और यदि कोई पेड़ दक्षिण की ओर या उत्तर की ओर गिरे, तो पेड़ जिस जगह गिरे, वहीं पड़ा रहेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वहीं होगा।” इब्रानी क्रिया का साधारण अर्थ “होना” है; गिरे हुए पेड़ के संदर्भ में “पड़ा रहेगा” हिन्दी में अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: भर जाएँ
  rationale: निफ़अल अपूर्ण क्रिया भर जाने या भर दिए जाने की अवस्था व्यक्त करती है। ‘भर जाएँ’ शर्त की स्वाभाविक हिन्दी है और बादलों के पूर्णतः भरने का भाव बनाए रखती है।
- source_word: הֶעָבִים גֶּשֶׁם
  choice: बादल बारिश के पानी से
  rationale: मौसम के इस प्रसंग में עָבִים का अर्थ ‘बादल’ और גֶּשֶׁם का अर्थ ‘बारिश’ है। ‘बारिश के पानी से’ हिन्दी में पूर्णता के संबंध को स्पष्ट और सहज बनाता है।
- source_word: יָרִיקוּ
  choice: उसे ... बरसा देते हैं
  rationale: ריק का हिफ़इल रूप खाली करने या उँडेलने का बोध देता है। बादलों के लिए ‘बरसा देते हैं’ स्वाभाविक हिन्दी है; ‘उसे’ का संकेत पहले बताए गए बारिश के पानी की ओर है।
- source_word: עַל הָאָרֶץ
  choice: धरती पर
  rationale: यहाँ אֶרֶץ का व्यापक अर्थ उपयुक्त है; ‘धरती पर’ प्राकृतिक घटना का सामान्य, लोकोक्तिपरक चित्र बनाए रखता है।
- source_word: יִפּוֹל עֵץ
  choice: कोई पेड़ ... गिरे
  rationale: अपूर्ण क्रिया शर्तवाचक और सामान्य कथन में है। हिन्दी में ‘यदि कोई पेड़ ... गिरे’ इसी बल को सहज रूप से व्यक्त करता है।
- source_word: בַּדָּרוֹם ... בַּצָּפוֹן
  choice: दक्षिण की ओर ... उत्तर की ओर
  rationale: नפל के साथ दिशात्मक अर्थ प्रसंगानुकूल है और गिरते हुए पेड़ की दिशा स्पष्ट करता है।
- source_word: מְקוֹם שֶׁיִּפּוֹל הָעֵץ
  choice: वह जहाँ गिरेगा
  rationale: हिन्दी में स्थान-संबंधी उपवाक्य को स्वाभाविक रखते हुए मूल के ‘जहाँ पेड़ गिरे’ का अर्थ सुरक्षित रखा गया है।
- source_word: שָׁם יְהוּא
  choice: वहीं पड़ा रहेगा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘होना’ है, पर गिरे हुए पेड़ के लिए हिन्दी में ‘पड़ा रहेगा’ परिणामी अवस्था को स्वाभाविक रूप से व्यक्त करता है। शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
