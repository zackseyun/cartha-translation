  text: And the light is sweet[b][a], and it is good for the eyes to see the sun.
translation:
  language: hi
  text: प्रकाश मधुर[a] है, और सूर्य को देखना आँखों के लिए अच्छा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘मनभावना’: ‘प्रकाश मनभावना है।’'
    reason: lexical_alternative
  - marker: b
    text: ‘सूर्य को देखना’ एक शाब्दिक अभिव्यक्ति है, जो जीवित होने और इस संसार में जीवन का आनंद लेने की ओर भी संकेत कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמָתוֹק
  choice: मधुर
  rationale: מָתוֹק का मूल अर्थ ‘मीठा’ है और यहाँ यह रूपक के रूप में सुखद या मनभावना होने का भाव देता है। ‘मधुर’ हिन्दी में इस रूपक और काव्यात्मक संक्षिप्तता दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הָאוֹר
  choice: प्रकाश
  rationale: सप्रत्यय הָאוֹר यहाँ दिखाई देने वाले जीवनदायी प्रकाश को दर्शाता है। हिन्दी में ‘प्रकाश’ बिना अनावश्यक विशिष्टीकरण के मूल बिंब को सुरक्षित रखता है।
- source_word: וְטוֹב
  choice: अच्छा
  rationale: טוֹב का अर्थ अच्छा, सुखद या लाभकारी हो सकता है। ‘अच्छा’ व्यापक अर्थ-क्षेत्र और मूल कथन की सादगी बनाए रखता है।
- source_word: לָעֵינַיִם
  choice: आँखों के लिए
  rationale: लामेद यहाँ संबंध या हित का भाव देता है। ‘आँखों के लिए’ इब्रानी मुहावरे को निकटता से रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: לִרְאוֹת
  choice: देखना
  rationale: ראה के इस infinitive का सीधा और स्वाभाविक हिन्दी रूप ‘देखना’ है।
- source_word: אֶת־הַשָּׁמֶשׁ
  choice: सूर्य को
  rationale: यह निश्चित प्रत्यक्ष कर्म ‘सूर्य’ है। ‘सूर्य को देखना’ मूल के ठोस काव्यात्मक बिंब को बनाए रखता है।
theological_decisions:
- issue: क्या ‘सूर्य को देखना’ का जीवन का आनंद लेने संबंधी निहित अर्थ मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति ‘सूर्य को देखना’ रखी गई
  alternative: ‘जीवन का आनंद लेना’
  rationale: सभोपदेशक में सूर्य-संबंधी भाषा सांसारिक जीवन और जीवित होने की ओर संकेत कर सकती है, पर यहाँ इब्रानी कथन ठोस और काव्यात्मक है। शाब्दिक बिंब को रखने से उसका जीवन-पुष्टिकारक संकेत बना रहता है और पाठक पर एक व्याख्या थोपी नहीं जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मधुर’ मूल के मिठास-वाले रूपक को सुरक्षित रखता है; ‘आँखों के लिए अच्छा’ इब्रानी की असामान्य किंतु अर्थपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
