source:
  edition: WLC
  text: יֵ֣שׁ אֶחָד֩ וְ/אֵ֨ין שֵׁנִ֜י גַּ֣ם בֵּ֧ן וָ/אָ֣ח אֵֽין ל֗/וֹ וְ/אֵ֥ין קֵץ֙ לְ/כָל עֲמָל֔/וֹ גַּם עיני/ו לֹא תִשְׂבַּ֣ע עֹ֑שֶׁר וּ/לְ/מִ֣י אֲנִ֣י עָמֵ֗ל וּ/מְחַסֵּ֤ר אֶת נַפְשִׁ/י֙ מִ/טּוֹבָ֔ה גַּם זֶ֥ה הֶ֛בֶל וְ/עִנְיַ֥ן רָ֖ע הֽוּא־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/008.yaml
  text: There is one man[a], and he has no second; he has neither son nor brother, and there is no end to all his labor[c][b]. Yet his eyes are not satisfied with wealth, and he says, “And for whom am I laboring and depriving myself of good?” This too is vanity and a grievous business.
translation:
  language: hi
  text: 'एक व्यक्ति है[a], और उसका कोई दूसरा नहीं; उसका न बेटा है, न भाई, और उसके सारे परिश्रम का कोई अंत नहीं। उसकी आँखें भी धन से तृप्त नहीं होतीं: “और मैं किसके लिए परिश्रम कर रहा हूँ और अपने आप को[b] भलाई से वंचित कर रहा हूँ?” यह भी व्यर्थता[c] और दुःखद काम है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक अकेला व्यक्ति है” अथवा “एक है, और कोई दूसरा नहीं।”
    reason: इब्रानी पदबंध एक ऐसे व्यक्ति को प्रस्तुत करता है जिसका ‘कोई दूसरा नहीं’ है; ‘अकेला’ उसका सहज व्याख्यात्मक विकल्प है।
  - marker: b
    text: शाब्दिक, “अपने प्राण को भलाई से वंचित कर रहा हूँ।” यहाँ “प्राण” व्यक्ति या स्वयं के अर्थ में है।
    reason: इब्रानी נֶפֶשׁ इस संदर्भ में किसी तकनीकी देह-आत्मा भेद के बजाय व्यक्ति स्वयं को सूचित करता है।
  - marker: c
    text: “व्यर्थता” के लिए प्रयुक्त इब्रानी शब्द “वाष्प” या “साँस” का भाव भी दे सकता है, और निष्फलता अथवा क्षणभंगुरता का संकेत करता है।
    reason: הֶבֶל सभोपदेशक का प्रमुख बहुअर्थी शब्द है; मुख्य पाठ में विषयगत संगति और पादटिप्पणी में उसका ठोस बिंब सुरक्षित रखा गया है।
lexical_decisions:
- source_word: יֵשׁ אֶחָד וְאֵין שֵׁנִי
  choice: एक मनुष्य है, और उसका कोई दूसरा साथी नहीं
  rationale: אֶחָד पुरुषवाचक एक अकेले व्यक्ति को प्रस्तुत करता है; וְאֵין שֵׁנִי का शाब्दिक बिंब ‘दूसरा नहीं’ है, पर हिन्दी में ‘दूसरा साथी’ प्रसंगगत आशय को स्वाभाविक और स्पष्ट बनाता है।
- source_word: גַּם בֵּן וָאָח אֵין לוֹ
  choice: उसका न तो बेटा है, न भाई
  rationale: निकट पुरुष संबंधियों की मूल सूची को सामान्यीकृत किए बिना रखा गया है।
- source_word: וְאֵין קֵץ לְכָל עֲמָלוֹ
  choice: फिर भी उसके सारे परिश्रम का कोई अंत नहीं
  rationale: עָמָל श्रम की बोझिलता लिए हुए है; ‘परिश्रम’ उसी मूल को आगे के प्रश्न से जोड़ता है। ‘फिर भी’ अकेलेपन और अंतहीन श्रम के प्रसंगगत विरोध को व्यक्त करता है।
- source_word: גַּם עֵינָיו לֹא תִשְׂבַּע עֹשֶׁר
  choice: उसकी आँखें भी धन से तृप्त नहीं होतीं
  rationale: गַּם को ‘भी’ और बहुवचन ‘आँखें’ को बनाए रखा गया है; तृप्त न होना लालसा की असंतुष्टि का स्वाभाविक हिन्दी मुहावरा है।
- source_word: וּלְמִי אֲנִי עָמֵל
  choice: मैं किसके लिए परिश्रम कर रहा हूँ
  rationale: לְמִי के लाभार्थक अर्थ ‘किसके लिए’ और עמל की पुनरावृत्ति को सुरक्षित रखा गया है।
- source_word: וּמְחַסֵּר אֶת נַפְשִׁי מִטּוֹבָה
  choice: अपने आपको सुख से वंचित कर रहा हूँ
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति/स्वयं का सूचक है। טוֹבָה प्रसंग में जीवन के उपभोग योग्य सुख या अच्छी चीज़ को दर्शाता है; ‘सुख’ हिन्दी में अधिक स्वाभाविक है।
- source_word: גַּם זֶה הֶבֶל
  choice: यह भी व्यर्थता है
  rationale: הֶבֶל का मूल बिंब वाष्प/साँस है और अर्थक्षेत्र क्षणभंगुरता तथा निष्फलता तक फैला है; ‘व्यर्थता’ सभोपदेशक की विषयगत भाषा को स्पष्ट रखता है, जबकि बिंब पादटिप्पणी में दिया गया है।
- source_word: וְעִנְיַן רָע הוּא
  choice: और दुःखद काम है
  rationale: עִנְיָן किसी काम, कार्य-व्यापार या व्यस्तता को और רָע यहाँ उसके कष्टदायक स्वरूप को बताता है; ‘दुःखद काम’ सरल और गरिमापूर्ण है।
theological_decisions:
- issue: נַפְשִׁי का मानव-स्वरूप संबंधी अर्थ
  choice: अपने आपको
  alternative: अपने प्राण को / अपनी आत्मा को
  rationale: ज्ञान-साहित्य के इस मुहावरे में נֶפֶשׁ व्यक्ति स्वयं को दर्शाता है; ‘अपने आपको’ अनावश्यक देह-आत्मा विभाजन आरोपित नहीं करता।
- issue: הֶבֶל का विषयगत अनुवाद
  choice: व्यर्थता
  alternative: वाष्प / निष्फलता
  rationale: शब्द की बहुअर्थी तनाव-रेखा को मुख्य पाठ में ‘व्यर्थता’ और पादटिप्पणी में उसके ठोस बिंब व व्यापक अर्थक्षेत्र के द्वारा सुरक्षित रखा गया है।
- issue: अप्रत्यक्ष आत्मचिंतन की प्रस्तुति
  choice: वह सोचता है
  alternative: बिना किसी परिचय के सीधा प्रश्न
  rationale: इब्रानी में कथन-क्रिया व्यक्त नहीं है, पर प्रथम पुरुष प्रश्न तीसरे पुरुष वर्णन के भीतर आता है। हिन्दी में वक्ता-परिवर्तन स्पष्ट करने के लिए ‘वह सोचता है’ न्यूनतम पूरक है; इसे ‘वह कहता है’ की अपेक्षा अंतर्मुखी प्रश्न के अनुरूप चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साधारण पाठकों के लिए सहज किंतु गरिमापूर्ण। ‘बेटा’, ‘भाई’, ‘आँखें’, ‘धन’ और ‘परिश्रम’ मूल की ठोस भाषा को बनाए रखते हैं। मुख्य पाठ के सभी पादटिप्पणी चिह्न [a], [b], [c] उपस्थित हैं।
