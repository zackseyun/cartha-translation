  text: The fool folds his hands and eats his own flesh[a][b].
translation:
  language: hi
  text: मूर्ख हाथ पर हाथ धरे रहता है[a] और अपना ही मांस खाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, ‘अपने हाथों को आपस में जकड़े रहता है’; यह आलस्य और निष्क्रियता का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, वह अपनी मूर्खता या आलस्य के कारण अपना ही विनाश करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּסִיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह शब्द केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति को दर्शाता है। ‘मूर्ख’ स्वाभाविक और कहावत-सदृश हिन्दी है।
- source_word: חֹבֵק
  choice: बाँधे रहता है
  rationale: क्रिया का मूल अर्थ ‘आलिंगन करना/जकड़ना’ है; हाथों के साथ यह हाथ बाँधकर निष्क्रिय बैठे रहने का चित्र प्रस्तुत करती है। ‘रहता है’ कृदन्त की सामान्य, निरंतर प्रवृत्ति को व्यक्त करता है।
- source_word: יָדָיו
  choice: अपने हाथ
  rationale: शाब्दिक अर्थ ‘उसके हाथ’ है। हिन्दी में कर्ता के अपने अंगों के लिए ‘अपने हाथ’ स्वाभाविक है और प्रत्यक्ष चित्र को बनाए रखता है।
- source_word: וְאֹכֵל
  choice: और ... खाता है
  rationale: कृदन्त यहाँ सामान्य कहावत-सदृश कथन को जारी रखता है; सामान्य वर्तमान काल इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשָׂרוֹ
  choice: अपना ही मांस
  rationale: शाब्दिक ‘उसका मांस’ को आत्म-विनाश के सजीव रूपक के रूप में सुरक्षित रखा गया है। ‘ही’ उसके स्वयं को हानि पहुँचाने की प्रतिवर्ती तीव्रता स्पष्ट करता है।
theological_decisions:
- issue: ‘अपना ही मांस खाता है’ का रूपकात्मक आशय
  choice: मुख्य पाठ में शाब्दिक और सजीव रूपक बनाए रखना
  alternative: व्याख्यात्मक रूप से ‘अपने आपको नष्ट करता है’ या ‘अपना सर्वनाश करता है’ कहना
  rationale: इब्रानी पाठ अमूर्त व्याख्या के बजाय चौंकाने वाला शारीरिक रूपक देता है। इसे बनाए रखने से मूर्खता अथवा आलस्य के आत्म-विनाशकारी परिणाम का अर्थ खुला रहता है और कोई संकीर्ण व्याख्या मुख्य पाठ में आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कहावत-सदृश शैली। ‘हाथ बाँधे रहता है’ सामान्य पाठक के लिए निष्क्रियता का चित्र सहज बनाता है, जबकि पादटिप्पणी मूल क्रिया की अधिक शाब्दिक छवि सुरक्षित रखती है।
