  text: וְ/טוֹב֙ מִ/שְּׁנֵי/הֶ֔ם אֵ֥ת אֲשֶׁר עֲדֶ֖ן לֹ֣א הָיָ֑ה אֲשֶׁ֤ר לֹֽא רָאָה֙ אֶת הַ/מַּעֲשֶׂ֣ה הָ/רָ֔ע אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/003.yaml
  text: But better than both of them is the one who has not yet been[a], who has not seen the evil deed that is done under the sun.
translation:
  language: hi
  text: परन्तु उन दोनों से अच्छा वह है जो अभी तक अस्तित्व में नहीं आया है[a], जिसने वह बुरा काम नहीं देखा जो सूर्य के नीचे किया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “जो अभी तक जन्मा नहीं।” हिब्रू में अधिक शाब्दिक रूप से, “जो अभी तक था ही नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטוֹב
  choice: परन्तु ... अच्छा
  rationale: सन्दर्भ में यह पद जीवितों और मृतकों के विषय में पिछले कथन से आगे बढ़कर एक विरोधात्मक तुलना करता है; इसलिए ‘परन्तु’ और तुलनात्मक ‘अच्छा’ स्वाभाविक हैं।
- source_word: מִשְּׁנֵיהֶם
  choice: उन दोनों से
  rationale: यह पद 2 में बताए गए जीवित और मृत—इन दोनों समूहों के साथ तीसरे की स्पष्ट तुलना करता है।
- source_word: אֵת אֲשֶׁר עֲדֶן לֹא הָיָה
  choice: वह ... जो अभी तक अस्तित्व में नहीं आया
  rationale: हिब्रू का अधिक शाब्दिक अर्थ ‘जो अभी तक नहीं हुआ/था’ है। ‘अस्तित्व में नहीं आया’ आधुनिक हिन्दी में बोधगम्य रहते हुए जन्म का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר לֹא רָאָה
  choice: जिसने ... नहीं देखा
  rationale: हिब्रू पूर्ण क्रिया को सरल और स्वाभाविक हिन्दी में प्रस्तुत करता है तथा उस व्यक्ति के अनुभवहीन होने की बात बनाए रखता है।
- source_word: הַמַּעֲשֶׂה הָרָע
  choice: वह बुरा काम
  rationale: מַעֲשֶׂה किसी काम, कार्य या कर्म को दर्शाता है; ‘बुरा काम’ साधारण पाठक के लिए सहज है और दुष्ट गतिविधि का अर्थ रखता है।
- source_word: אֲשֶׁר נַעֲשָׂה
  choice: जो ... किया जाता है
  rationale: यह सामान्यतः और लगातार घटने वाले दुष्कर्म की निष्क्रिय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक में बार-बार आने वाले इस सूत्र का परिचित और सुसंगत हिन्दी रूप है।
theological_decisions:
- issue: לֹא הָיָה का आशय
  choice: मुख्य पाठ में ‘अस्तित्व में नहीं आया’
  alternative: ‘जन्मा नहीं’
  rationale: सन्दर्भ अजन्मे व्यक्ति की ओर संकेत करता है, पर हिब्रू क्रिया स्वयं सामान्यतः ‘होना/अस्तित्व रखना’ कहती है। मुख्य पाठ मूल की व्यापकता रखता है और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप; सभोपदेशक के आवर्ती वाक्यांश ‘सूर्य के नीचे’ को बनाए रखा गया है। ‘अस्तित्व में नहीं आया’ कुछ औपचारिक है, पर मूल की जानबूझकर व्यापक अभिव्यक्ति और सन्दर्भगत अर्थ के बीच उचित संतुलन रखता है।
