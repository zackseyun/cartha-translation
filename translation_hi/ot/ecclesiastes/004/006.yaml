  choice: कठिन परिश्रम
  rationale: सभोपदेशक में यह शब्द श्रम के साथ उसकी कष्टदायक और थकाऊ प्रकृति भी व्यक्त करता है; ‘कठिन परिश्रम’ दोनों पहलुओं को संप्रेषित करता है।
- source_word: וּרְעוּת רוּחַ
  choice: और हवा के पीछे भागना
  rationale: यह आवर्ती रूपक निष्फल प्रयास या ऐसी वस्तु का पीछा करने को दर्शाता है जिसे पकड़ा नहीं जा सकता। ‘हवा के पीछे भागना’ रूपक को बिना व्याख्यात्मक रूप से हल किए बनाए रखता है।
