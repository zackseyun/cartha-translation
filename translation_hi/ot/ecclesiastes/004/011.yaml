  yaml_path: translation/ot/ecclesiastes/004/011.yaml
  text: Again[a], if two lie down together, they keep warm; but how can one keep warm alone?
translation:
  language: hi
  text: फिर, यदि दो जन साथ लेटें, तो उन्हें गरमी मिलती है[a]; पर अकेला जन कैसे गरम होगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तो वे गरम रहते हैं’; इब्रानी में शाब्दिक भाव है, ‘उनके लिए गरमी होती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: फिर
  rationale: यह पिछले कथन के बाद एक और सहायक उदाहरण जोड़ता है; ‘फिर’ हिन्दी में क्रम और योग—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם
  choice: यदि
  rationale: इब्रानी की शर्त अथवा स्थिति बताने वाली रचना को सीधे सुरक्षित रखता है।
- source_word: יִשְׁכְּבוּ שְׁנַיִם
  choice: दो जन साथ लेटें
  rationale: שׁכב का मूल अर्थ ‘लेटना’ है; ‘सोना’ कहने से अर्थ अनावश्यक रूप से संकुचित होता। ‘साथ’ प्रसंग में निहित संयुक्त स्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְחַם לָהֶם
  choice: तो उन्हें गरमी मिलती है
  rationale: शाब्दिक रचना ‘उनके लिए गरमी होती है’ के निकट रहते हुए यह आधुनिक हिन्दी में सहज है और गरमी के पारस्परिक लाभ को व्यक्त करती है।
- source_word: וּלְאֶחָד
  choice: पर अकेला जन
  rationale: ‘एक के लिए’ का दो जनों से स्पष्ट विरोध है। ‘पर’ विरोध को और ‘अकेला जन’ हिन्दी में निहित एकाकी स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵיךְ יֵחָם
  choice: कैसे गरम होगा?
  rationale: प्रश्न की आलंकारिक कठिनाई को बनाए रखता है; יֵחָם के गरम होने के भाव को अनावश्यक व्याख्या के बिना व्यक्त करता है।
