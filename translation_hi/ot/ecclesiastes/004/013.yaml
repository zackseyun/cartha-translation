  text: ט֛וֹב יֶ֥לֶד מִסְכֵּ֖ן וְ/חָכָ֑ם מִ/מֶּ֤לֶךְ זָקֵן֙ וּ/כְסִ֔יל אֲשֶׁ֛ר לֹא יָדַ֥ע לְ/הִזָּהֵ֖ר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/013.yaml
  text: Better is a poor but wise youth than an old and foolish king who no longer knows how to heed warning[a].
translation:
  language: hi
  text: एक गरीब परन्तु बुद्धिमान युवक एक बूढ़े और मूर्ख राजा से अच्छा है, जो अब चेतावनी मानना नहीं जानता[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो अब शिक्षा ग्रहण करना नहीं जानता’ अथवा ‘जो अब समझाया जाना स्वीकार नहीं करता।’
    reason: לְהִזָּהֵר के यहाँ चेतावनी मानने, शिक्षा ग्रहण करने, या समझाए जाने को स्वीकार करने के निकटवर्ती अर्थ सम्भव हैं।
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: '... से अच्छा है'
  rationale: טוֹב के साथ तुलनात्मक מִן होने के कारण हिन्दी में स्वाभाविक तुलनात्मक रचना ‘... से अच्छा है’ अपनाई गई।
- source_word: יֶלֶד
  choice: युवक
  rationale: यह शब्द यहाँ एक युवा व्यक्ति को सूचित करता है और זָקֵן ‘बूढ़े’ के साथ आयु-विरोध को स्पष्ट रखता है; ‘बालक’ अनावश्यक रूप से कम आयु का संकेत दे सकता है।
- source_word: מִסְכֵּן
  choice: गरीब
  rationale: सन्दर्भ में आर्थिक अभाव अथवा निम्न सामाजिक स्थिति मुख्य भाव है; ‘गरीब’ सामान्य और स्पष्ट हिन्दी है।
- source_word: וְחָכָם
  choice: परन्तु बुद्धिमान
  rationale: मूल संयोजक वाव है, पर गरीबी और बुद्धिमानी के बीच रियायती विरोध हिन्दी में ‘परन्तु’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: מֶלֶךְ זָקֵן וּכְסִיל
  choice: बूढ़े और मूर्ख राजा
  rationale: विशेषणों का सीधा अर्थ और ज्ञान-साहित्य में כְּסִיל का व्यावहारिक-नैतिक मूर्खता का भाव सुरक्षित रखा गया है।
- source_word: אֲשֶׁר לֹא יָדַע ... עוֹד
  choice: जो अब ... नहीं जानता
  rationale: नकार के साथ עוֹד वर्तमान में पहले की स्थिति के समाप्त हो जाने का भाव देता है; हिन्दी में ‘अब ... नहीं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהִזָּהֵר
  choice: चेतावनी मानना
  rationale: निफ़अल रूप इस सन्दर्भ में चेताए या सुधारे जाने को स्वीकार करने का भाव रखता है। ‘चेतावनी मानना’ इस ग्रहणशीलता को सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘परन्तु’ औपचारिक किन्तु सामान्यतः बोधगम्य है; मुख्य पाठ में मूल की तुलना और राजा की सुधार न मानने की स्थिति स्पष्ट रखी गई है।
