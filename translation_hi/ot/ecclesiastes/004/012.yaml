  yaml_path: translation/ot/ecclesiastes/004/012.yaml
  text: And if someone overpowers one[a], two will stand against him; and a threefold cord is not quickly broken.
translation:
  language: hi
  text: और यदि कोई एक व्यक्ति पर भारी पड़े, तो दो उसका सामना करेंगे; और तिहरी डोरी जल्दी नहीं टूटती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: यदि
  rationale: यह पिछले कथन को आगे बढ़ाने वाली शर्त प्रस्तुत करता है। हिन्दी में ‘यदि’ स्वाभाविक रूप से शर्त और प्रसंग की निरंतरता दोनों व्यक्त करता है।
- source_word: יִתְקְפוֹ הָאֶחָד
  choice: कोई एक व्यक्ति पर भारी पड़े
  rationale: תקף का भाव किसी के विरुद्ध बलवान होकर उस पर हावी होने का है। ‘भारी पड़े’ आक्रमण का अनावश्यक विशेषीकरण किए बिना यही अर्थ सहज हिन्दी में देता है; ‘एक व्यक्ति’ पिछले प्रसंग के अकेले मनुष्य की ओर संकेत करता है।
- source_word: הַשְּׁנַיִם יַעַמְדוּ נֶגְדּוֹ
  choice: दो उसका सामना कर सकते हैं
  rationale: शाब्दिक चित्र ‘दो उसके विरुद्ध खड़े होंगे’ है। ‘उसका सामना कर सकते हैं’ विरोध में डटे रहने का भाव और एक-दो का नीतिवचनात्मक अंतर स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהַחוּט
  choice: और ... डोरी
  rationale: חוּט धागे या डोरी को दर्शाता है। सामर्थ्य की उपमा में ‘डोरी’ अधिक उपयुक्त है और संयोजक ו को ‘और’ से सुरक्षित रखा गया है।
- source_word: הַמְשֻׁלָּשׁ
  choice: तीन लड़ों वाली
  rationale: यह रूप किसी वस्तु के तीनहरा किए जाने या तीन भागों से बने होने का संकेत देता है। डोरी के संदर्भ में ‘तीन लड़ों वाली’ स्पष्ट और स्वाभाविक है; अधिक शाब्दिक ‘तिहरी की गई’ को टिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹא בִמְהֵרָה יִנָּתֵק
  choice: जल्दी नहीं टूटती
  rationale: בִמְהֵרָה का मूल अर्थ ‘शीघ्र/जल्दी’ और נתק के निफ़अल का अर्थ टूटना या अलग खिंच जाना है। यह अनुवाद मूल की गति-संबंधी अभिव्यक्ति को बनाए रखते हुए हिन्दी में सहज है।
