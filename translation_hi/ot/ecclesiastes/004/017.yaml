source:
  edition: WLC
  text: שְׁמֹ֣ר רגלי/ך כַּ/אֲשֶׁ֤ר תֵּלֵךְ֙ אֶל בֵּ֣ית הָ/אֱלֹהִ֔ים וְ/קָר֣וֹב לִ/שְׁמֹ֔עַ מִ/תֵּ֥ת הַ/כְּסִילִ֖ים זָ֑בַח כִּֽי אֵינָ֥/ם יוֹדְעִ֖ים לַ/עֲשׂ֥וֹת רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/017.yaml
  text: Guard your steps when you go to the house of God[a], and draw near to listen rather than to offer the sacrifice of fools[c][b], for they do not know that they are doing evil.
translation:
  language: hi
  text: जब तुम परमेश्वर के भवन में जाओ, तो अपने कदमों पर ध्यान दो[a]। मूर्खों का बलिदान चढ़ाने के बजाय सुनने के लिए निकट आओ[b], क्योंकि वे नहीं जानते कि वे बुरा कर रहे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पैरों की रक्षा करो।”
    reason: lexical_alternative
  - marker: b
    text: “सुनने” का अर्थ यहाँ ध्यान देकर सुनना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “क्योंकि वे बुरा करना नहीं जानते।” इसका आशय संभवतः यह है कि उन्हें बोध नहीं कि उनका कर्म बुरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר רגליך
  choice: अपने कदमों पर ध्यान दो
  rationale: शाब्दिक रूप से ‘अपने पैरों की रक्षा करो’; प्रसंग में यह परमेश्वर के भवन में जाते समय अपने आचरण और ढंग के प्रति सावधान रहने की चेतावनी है। ‘कदमों पर ध्यान दो’ देहगत बिंब और व्यावहारिक अर्थ दोनों को बनाए रखता है।
- source_word: כַּאֲשֶׁר תֵּלֵךְ
  choice: जब तुम ... जाओ
  rationale: यहाँ कालवाचक अर्थ स्वाभाविक है और उपासना के स्थान की ओर जाने के अवसर पर लागू चेतावनी व्यक्त करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: मूल इब्रानी अभिव्यक्ति को रखा गया है; ‘मन्दिर’ कहना संभव है, पर वह मूल से अधिक विशिष्ट व्याख्या जोड़ता।
- source_word: וְקָרוֹב
  choice: निकट आओ
  rationale: संक्षिप्त इब्रानी रूप को पिछले आदेश के क्रम में आदेशात्मक अर्थ में लिया गया है। यह उपासना में परमेश्वर के सामने आने का भाव बनाए रखता है।
- source_word: לִשְׁמֹעַ
  choice: सुनने के लिए
  rationale: שׁמע केवल ध्वनि सुनने से आगे ध्यानपूर्वक और ग्रहणशील होकर सुनने का संकेत दे सकता है; हिन्दी में ‘सुनना’ इस संदर्भ में पर्याप्त रूप से स्वाभाविक और व्यापक है।
- source_word: מִתֵּת ... זָבַח
  choice: बलिदान चढ़ाने के बजाय
  rationale: נתן का मूल अर्थ ‘देना’ है, पर זבח के साथ इसका आशय बलिदान प्रस्तुत या अर्पित करना है। तुलना को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: הַכְּסִילִים
  choice: मूर्खों
  rationale: ज्ञान-साहित्य में यह शब्द केवल कम बुद्धि वाले नहीं, बल्कि नैतिक और आत्मिक समझ से रहित लोगों को दर्शाता है; ‘मूर्ख’ इसका प्रचलित और सशक्त समतुल्य है।
- source_word: כִּי אֵינָם יוֹדְעִים לַעֲשׂוֹת רָע
  choice: क्योंकि वे नहीं जानते कि वे बुरा कर रहे हैं
  rationale: इब्रानी वाक्यांश संक्षिप्त है—शाब्दिक रूप से ‘क्योंकि वे बुरा करना नहीं जानते।’ चुना हुआ रूप उस संभावित अर्थ को व्यक्त करता है कि उन्हें अपने कर्म की बुराई का बोध नहीं है, जबकि टिप्पणी में मूल की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: सुनने और बलिदान के बीच विरोध
  choice: पद विचारहीन या मूर्खतापूर्ण बलिदानी उपासना की अपेक्षा ध्यानपूर्वक सुनने को प्राथमिकता देता है; यह अपने-आप में हर बलिदान का निषेध नहीं करता।
  alternative: इसे सभी बलिदानों का पूर्ण निषेध, या केवल अनुष्ठान की तकनीक का अंतर माना जा सकता है।
  rationale: मूल पाठ सामान्यतः बलिदान नहीं, बल्कि ‘मूर्खों के बलिदान’ की तुलना सुनने से करता है। अंतिम खंड उनके कर्म की नैतिक समस्या दिखाता है, इसलिए अनुवाद को इससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ना चाहिए।
- issue: לַעֲשׂוֹת רָע की कर्तृगत अस्पष्टता
  choice: मुख्य पाठ में इसे इस अर्थ में व्यक्त किया गया है कि मूर्खों को बोध नहीं कि उनका अपना कर्म बुरा है।
  alternative: इसे अधिक शाब्दिक रूप से ‘वे बुरा करना नहीं जानते’ भी कहा जा सकता है, अथवा कुछ लोग इसे इस अर्थ में समझ सकते हैं कि वे अज्ञानतावश बुराई करते हैं।
  rationale: वाक्य-विन्यास संकुचित और कुछ हद तक अस्पष्ट है। प्रसंग मूर्खों के बलिदान को लक्ष्य करता है, इसलिए चुना अर्थ संभावित है, पर पादटिप्पणी शाब्दिक रूप और तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और चेतावनीपूर्ण शैली रखी गई है। ‘परमेश्वर का भवन’ मूल धार्मिक अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘अपने कदमों पर ध्यान दो’ सामान्य पाठक के लिए मुहावरेदार है।
