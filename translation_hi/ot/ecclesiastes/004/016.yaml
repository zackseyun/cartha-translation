base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/016.yaml
  text: There was no end to all the people[a], to all who were before them; yet those who come later will not rejoice in him[c][b]. For this too is vanity and a chasing after wind.
translation:
  language: hi
  text: सभी लोगों की संख्या का कोई अंत नहीं था—उन सबकी, जो उनसे पहले थे[a]। फिर भी बाद में आने वाले उसके विषय में आनन्दित नहीं होंगे[b]। क्योंकि यह भी व्यर्थता[c] और हवा के पीछे भागना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब लोगों का कोई अंत नहीं है—उन सबका, जो उनसे पहले गए थे।” इस उपवाक्य का इब्रानी वाक्य-विन्यास कठिन है और इसे एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “उससे प्रसन्न नहीं होंगे” अथवा “उसके विषय में आनन्द नहीं मनाएँगे।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘हेवेल’; सभोपदेशक का एक प्रमुख शब्द, जो क्षणभंगुर, खोखली या निराशाजनक बात का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין קֵץ
  choice: संख्या का कोई अंत नहीं था
  rationale: यह पदबंध सीमा या अंत के अभाव को व्यक्त करता है और यहाँ लोगों की असंख्यता का भाव देता है। भूतकाल निकटवर्ती वर्णन के अनुकूल है, यद्यपि इब्रानी में वर्तमानकाल भी संभव है।
- source_word: לְכָל הָעָם
  choice: उन सब लोगों की संख्या
  rationale: ל संबंध या संदर्भ सूचित करता है। स्वाभाविक हिन्दी में असंख्यता स्पष्ट करने के लिए ‘लोगों की संख्या’ कहा गया है।
- source_word: לְכֹל אֲשֶׁר הָיָה לִפְנֵיהֶם
  choice: उन सबकी, जो उनसे पहले थे
  rationale: इब्रानी वाक्य-विन्यास कठिन और संक्षिप्त है। यह रूप मूल के ‘पहले’ और बहुवचन सर्वनाम को बनाए रखते हुए उसके संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הָאַחֲרוֹנִים
  choice: बाद में आनेवाले
  rationale: यह विशेषण बाद के लोगों या अगली पीढ़ियों को सूचित करता है और पहले वालों के साथ कालगत विरोध बनाए रखता है।
- source_word: לֹא יִשְׂמְחוּ בוֹ
  choice: उससे आनन्दित नहीं होंगे
  rationale: क्रिया का अर्थ आनन्दित या प्रसन्न होना है। ‘उससे’ इब्रानी בּוֹ के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और निकटवर्ती युवक या शासक की ओर संकेत करता है।
- source_word: הֶבֶל
  choice: व्यर्थता
  rationale: सभोपदेशक में यह प्रमुख शब्द क्षणभंगुरता, खोखलेपन और निष्फलता के संयुक्त भाव रखता है। ‘व्यर्थता’ किसी एक भाव तक अर्थ को सीमित नहीं करती।
- source_word: רַעְיוֹן רוּחַ
  choice: हवा के पीछे भागना
  rationale: यह सभोपदेशक का आवर्ती रूपक है, जो ऐसी चेष्टा को दर्शाता है जिसका फल हाथ नहीं आता। यह हिन्दी में सहज और चित्रात्मक है।
theological_decisions:
- issue: इस कठिन पद में सर्वनामों के संदर्भ
  choice: ‘उनसे’ और ‘उससे’ के संदर्भ को मूल की तरह कुछ हद तक खुला रखा गया है।
  alternative: वाक्य को स्पष्ट रूप से उस दूसरे युवक के विषय में समझना जो राजा बना, अथवा ‘जिनके आगे वह था’ के रूप में उसके शासन को स्पष्ट करना।
  rationale: इब्रानी पाठ का वाक्य-विन्यास संक्षिप्त और विवादित है। किसी विशेष शासक-संबंधी व्याख्या को पाठ में जोड़ने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। कठिन पहले उपवाक्य को पढ़ने योग्य बनाने के लिए ‘संख्या’ जोड़ा गया है, जबकि वैकल्पिक अधिक शाब्दिक पाठ पादटिप्पणी में दिया गया है। सर्वनामों और पद की धार्मिक-व्याख्यात्मक अनिश्चितता को जानबूझकर खुला रखा गया है।
