lexical_decisions:
- source_word: וְשַׁבֵּחַ
  choice: अधिक सुखी माना
  rationale: पिएल रूप का मूल अर्थ ‘प्रशंसा करना/सराहना’ है, पर यहाँ संदर्भ उत्पीड़ित जीवितों की तुलना में मृतकों की दशा को बेहतर ठहराने का है। ‘अधिक सुखी माना’ इस मूल्यांकन और तुलनात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֲנִי
  choice: मैंने
  rationale: मूल में स्पष्ट प्रथम-पुरुष सर्वनाम वक्ता के निजी मूल्यांकन पर बल देता है; हिन्दी में ‘मैंने’ इसे बनाए रखता है।
- source_word: אֶת הַמֵּתִים
  choice: उन मृतकों को
  rationale: यह रूप मृत लोगों को एक वर्ग के रूप में दर्शाता है। ‘मृतकों’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: שֶׁכְּבָר מֵתוּ
  choice: जो पहले ही मर चुके हैं
  rationale: כבר का ‘पहले ही’ और पूर्ण क्रिया का संपन्न अवस्था वाला भाव दोनों सुरक्षित रखे गए हैं।
- source_word: מִן הַחַיִּים
  choice: उन जीवित लोगों से अधिक सुखी
  rationale: यहाँ מִן तुलना दर्शाता है। हिन्दी में ‘से अधिक’ द्वारा तुलनात्मक संबंध स्पष्ट किया गया है।
- source_word: הַחַיִּים
  choice: जीवित लोगों
  rationale: यह जीवित व्यक्तियों के वर्ग को सूचित करता है। ‘जीवित लोगों’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר הֵמָּה חַיִּים
  choice: जो ... जीवित हैं
  rationale: मूल की पुनरुक्ति जीवितों की वर्तमान दशा पर बल देती है; उसे हटाया नहीं गया।
- source_word: עֲדֶנָה
  choice: अब तक
  rationale: यह क्रियाविशेषण ‘अभी भी/अब तक’ का भाव देता है। ‘अब तक’ वर्तमान तक जारी अवस्था को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: मृतकों और जीवितों के बीच अस्तित्वगत तुलना
  choice: उपदेशक उत्पीड़न के संदर्भ में मृतकों को जीवितों से अधिक सुखी मानता है।
  alternative: इसे मृत्यु के बाद मृतकों की धन्य अवस्था पर व्यवस्थित धर्मसैद्धांतिक कथन मानना, अथवा तुलना को केवल अतिशयोक्ति समझना।
  rationale: निकटवर्ती संदर्भ (4:1–3) ‘सूर्य के नीचे’ होने वाले उत्पीड़न पर केंद्रित है। अनुवाद तुलनात्मक निर्णय को बनाए रखता है, पर परलोक के विषय में कोई अतिरिक्त सिद्धांत नहीं जोड़ता और न कथन की तीक्ष्णता घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। मूल की जानबूझकर की गई पुनरुक्ति—‘मृतकों...मर चुके’ और ‘जीवित...जीवित हैं’—अर्थगत बल बनाए रखने के लिए सुरक्षित रखी गई है।
