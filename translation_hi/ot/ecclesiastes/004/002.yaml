    text: या, “और मैंने उन मृतकों को, जो पहले ही मर चुके हैं, उन जीवित लोगों की अपेक्षा अधिक सराहा, जो अभी भी जीवित हैं।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “प्रशंसा करना” या “सराहना करना” है; यहाँ यह मृतकों की दशा को जीवितों की दशा से बेहतर ठहराती है।
