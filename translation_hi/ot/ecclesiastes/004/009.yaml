  register: भाषा आधुनिक, संक्षिप्त और नीतिवचनात्मक रखी गई है। ‘एक से दो’ सामान्य व्यक्तियों की ओर संकेत करता है, किसी विशेष पहले से उल्लिखित जोड़ी की ओर नहीं। ‘परिश्रम’ गरिमापूर्ण किन्तु सामान्य हिन्दी है, और ‘प्रतिफल’ मजदूरी तक अर्थ को सीमित नहीं करता।
