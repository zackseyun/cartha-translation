source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת כָּל הַ֣/חַיִּ֔ים הַֽ/מְהַלְּכִ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ עִ֚ם הַ/יֶּ֣לֶד הַ/שֵּׁנִ֔י אֲשֶׁ֥ר יַעֲמֹ֖ד תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/015.yaml
  text: I saw all the living[a], those walking under the sun, with the second youth who would stand in his place.
translation:
  language: hi
  text: मैंने सूर्य के नीचे चलने-फिरनेवाले सभी जीवित लोगों को उस दूसरे युवक[a] के साथ देखा, जो उसके स्थान पर खड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूसरे बच्चे/युवा”; इब्रानी अभिव्यक्ति उस उत्तराधिकारी की ओर संकेत कर सकती है जो पहले शासक का स्थान लेता है।
    reason: יֶלֶד की आयु-संबंधी व्यापकता और הַשֵּׁנִי के विवादित संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: रָאָה के काल रूप का सीधा और स्वाभाविक अनुवाद; यह सभोपदेशक के प्रत्यक्ष अवलोकन को व्यक्त करता है।
- source_word: כָּל הַחַיִּים
  choice: सभी जीवित लोगों
  rationale: शाब्दिक अर्थ ‘सभी जीवित’ है; हिन्दी में ‘लोगों’ जोड़ने से मानव-संदर्भ स्पष्ट और वाक्य स्वाभाविक रहता है।
- source_word: הַמְהַלְּכִים
  choice: चलने-फिरनेवाले
  rationale: कृदंत का निरंतर गतिविधि वाला भाव बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की बार-बार आनेवाली विशिष्ट अभिव्यक्ति का संगत और निकट अनुवाद।
- source_word: עִם
  choice: के साथ
  rationale: मूल पूर्वसर्ग का सामान्य अर्थ रखता है और यह तय नहीं करता कि लोग युवक के समर्थक थे या केवल उसके साथ संबद्ध दिखाई दिए।
- source_word: הַיֶּלֶד הַשֵּׁנִי
  choice: उस दूसरे युवक
  rationale: יֶלֶד बच्चे या युवक को सूचित कर सकता है; शासन-उत्तराधिकार के संदर्भ में ‘युवक’ उपयुक्त है, जबकि ‘दूसरे’ से मूल क्रमवाचक और उसकी अस्पष्टता बनी रहती है।
- source_word: אֲשֶׁר יַעֲמֹד
  choice: जो ... खड़ा होगा
  rationale: עָמַד के अपूर्ण रूप और ‘खड़ा होना/स्थान ग्रहण करना’ के चित्र को बनाए रखता है, बिना इसे केवल ‘राज करेगा’ बनाकर अर्थ सीमित किए।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: उत्तराधिकार के संदर्भ में यह मुहावरा किसी के स्थान को ग्रहण करने का अर्थ देता है; ‘उसके अधीन’ की तुलना में प्रसंगानुकूल और स्पष्ट है।
