  text: וְ/שַׁ֣בְתִּֽי אֲנִ֗י וָ/אֶרְאֶה֙ אֶת כָּל הָ֣/עֲשֻׁקִ֔ים אֲשֶׁ֥ר נַעֲשִׂ֖ים תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֣ה דִּמְעַ֣ת הָ/עֲשֻׁקִ֗ים וְ/אֵ֤ין לָ/הֶם֙ מְנַחֵ֔ם וּ/מִ/יַּ֤ד עֹֽשְׁקֵי/הֶם֙ כֹּ֔חַ וְ/אֵ֥ין לָ/הֶ֖ם מְנַחֵֽם־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/001.yaml
  text: 'Then I turned and saw all the oppressions that are done under the sun: and behold[a], the tears of the oppressed, and they had no comforter. Power was in the hand of their oppressors[b], and they had no comforter.'
translation:
  language: hi
  text: फिर मैं मुड़ा और मैंने उन सारे अत्याचारों को देखा जो सूर्य के नीचे किए जाते हैं। और देखो[a], सताए हुओं के आँसू थे, और उन्हें सांत्वना देने वाला कोई न था। उनके अत्याचारियों के हाथ में शक्ति थी[b], और उन्हें सांत्वना देने वाला कोई न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने सूर्य के नीचे सताए जा रहे सभी लोगों को देखा।” इब्रानी कर्मवाचक कृदन्त का अर्थ सताए हुए लोग भी हो सकता है और विस्तार से अत्याचार के कृत्य भी।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “और उनके अत्याचारियों के हाथ से—शक्ति।” इब्रानी वाक्यांश संक्षिप्त है और अत्याचारियों की ओर स्थित शक्ति को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי אֲנִי וָאֶרְאֶה
  choice: फिर मैंने मुड़कर ... देखा
  rationale: שוב यहाँ किसी स्थान पर सचमुच लौटने के बजाय एक नए या दोबारा किए गए अवलोकन की ओर संकेत करता है। ‘मुड़कर देखा’ मूल रूपक और उपदेशक के विमर्श की गति, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כָּל הָעֲשֻׁקִים אֲשֶׁר נַעֲשִׂים
  choice: उन सारे अत्याचारों को ... जो ... किए जाते हैं
  rationale: עֲשֻׁקִים रूपतः कर्मवाचक कृदन्त है और ‘सताए हुए लोगों’ अथवा विस्तार से ‘अत्याचारों’ की ओर संकेत कर सकता है। साथ का נַעֲשִׂים (‘किए जाते हैं’) मुख्य पाठ में अत्याचार के कृत्यों को स्वाभाविक बनाता है; मानवीय संदर्भ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक की विशिष्ट और बार-बार आने वाली अभिव्यक्ति है; इसलिए इसका परिचित शाब्दिक रूप रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה पाठक का ध्यान आगे के मार्मिक दृश्य की ओर खींचता है। ‘और देखो’ आधुनिक हिन्दी में इसकी दृष्टिगोचर और आलंकारिक शक्ति बनाए रखता है।
- source_word: דִּמְעַת הָעֲשֻׁקִים
  choice: सताए हुओं के आँसू बह रहे थे
  rationale: דִּמְעַת व्याकरणतः एकवचन भाव रखता है, पर सामूहिक पीड़ा के लिए हिन्दी में बहुवचन ‘आँसू’ स्वाभाविक है। ‘बह रहे थे’ दृश्य को पूर्ण हिन्दी वाक्य में व्यक्त करता है, बिना पीड़ा का कारण जोड़े।
- source_word: וְאֵין לָהֶם מְנַחֵם
  choice: पर उन्हें सांत्वना देने वाला कोई न था
  rationale: इब्रानी अस्तित्ववाचक रचना का आशय किसी सांत्वना देने वाले की पूर्ण अनुपस्थिति है। यही वाक्यांश दोनों बार समान रखा गया है ताकि मूल की करुण पुनरावृत्ति बनी रहे।
- source_word: וּמִיַּד עֹשְׁקֵיהֶם כֹּחַ
  choice: उनके अत्याचारियों के हाथ में शक्ति थी
  rationale: खंडित इब्रानी रचना अत्याचारियों और शक्ति के संबंध को अग्रभूमि में रखती है। हिन्दी में ‘हाथ में शक्ति’ मूल बिंब और सत्ता-असंतुलन को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֹשְׁקֵיהֶם
  choice: उनके अत्याचारियों
  rationale: עשק का सक्रिय कृदन्त उन लोगों को बताता है जो दूसरों को सताते या उनका शोषण करते हैं। ‘अत्याचारी’ आरंभिक ‘अत्याचारों’ से शब्दार्थगत संबंध भी बनाए रखता है।
theological_decisions:
- issue: आरंभिक הָעֲשֻׁקִים का संदर्भ
  choice: मुख्य पाठ में ‘सारे अत्याचार’
  alternative: ‘सभी सताए हुए लोग’
  rationale: रूप अपने आप में सताए हुए व्यक्तियों को बता सकता है, किंतु ‘जो ... किए जाते हैं’ के साथ अत्याचार के कृत्य मुख्य पाठ में अधिक सहज हैं। अगला खंड फिर पीड़ित व्यक्तियों के आँसुओं पर केंद्रित होता है। वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट रखी गई है।
- issue: सांत्वना देने वाले की अनुपस्थिति का काल
  choice: भूतकालीन वर्णन—‘कोई न था’
  alternative: वर्तमान अथवा सार्वकालिक कथन—‘कोई नहीं है’
  rationale: वक्ता इसे अपने देखे हुए दृश्य की भूतकालीन रिपोर्ट के रूप में कहता है। भूतकाल उस कथात्मक ढाँचे के अनुकूल है और कथन की व्यापक नैतिक गंभीरता को सीमित नहीं करता।
- issue: अत्याचारियों और शक्ति का संबंध
  choice: ‘अत्याचारियों के हाथ में शक्ति थी’
  alternative: अधिक शाब्दिक, किंतु अस्पष्ट—‘अत्याचारियों के हाथ से शक्ति’
  rationale: मुख्य पाठ सत्ता-असंतुलन को व्यक्त करता है, पर इब्रानी पूर्वसर्ग और संक्षिप्त वाक्य-विन्यास को पादटिप्पणी में रखा गया है ताकि मूल की असामान्य संरचना छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘सूर्य के नीचे’ जैसी पुस्तक-विशिष्ट अभिव्यक्ति शाब्दिक रखी गई है। ‘सांत्वना देने वाला कोई न था’ की हूबहू पुनरावृत्ति मूल की करुण लय बनाए रखती है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
