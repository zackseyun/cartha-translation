source:
  edition: WLC
  text: וְ/רָאִ֨יתִֽי אֲנִ֜י אֶת כָּל עָמָ֗ל וְ/אֵת֙ כָּל כִּשְׁר֣וֹן הַֽ/מַּעֲשֶׂ֔ה כִּ֛י הִ֥יא קִנְאַת אִ֖ישׁ מֵ/רֵעֵ֑/הוּ גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/004.yaml
  text: And I saw that all labor and all skillful work come from a man's envy of his neighbor[c][b][a]. This too is vanity and a chasing after wind.
translation:
  language: hi
  text: और मैंने देखा कि सारा परिश्रम और काम की सारी कुशलता[a] मनुष्य की अपने पड़ोसी से ईर्ष्या[b] के कारण होते हैं। यह भी व्यर्थता और हवा के पीछे भागना[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘काम की सारी सफलता’; हिब्रू शब्द कुशलता, निपुणता या उससे मिलने वाली सफलता को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, ‘एक मनुष्य की अपने पड़ोसी से ईर्ष्या।’ यहाँ एकवचन पुल्लिंग का प्रयोग सम्भवतः सभी लोगों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘हवा को पकड़ने का प्रयास।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמָל
  choice: परिश्रम
  rationale: यह शब्द सभोपदेशक में प्रायः कठिन और बोझिल मानवीय श्रम को दर्शाता है। ‘परिश्रम’ स्वाभाविक हिन्दी है और श्रम के भाव को बिना अनावश्यक विस्तार के रखता है।
- source_word: כִּשְׁרוֹן הַמַּעֲשֶׂה
  choice: काम की सारी कुशलता
  rationale: כִּשְׁרוֹן में कुशलता, निपुणता या उससे मिलने वाली सफलता का भाव हो सकता है। यह अनुवाद मूल की संबंधवाचक बनावट और उसके अर्थ-विस्तार को यथासंभव बनाए रखता है।
- source_word: כִּי הִיא
  choice: के कारण होती है
  rationale: शाब्दिक रूप ‘क्योंकि यह ... है’ है, पर सन्दर्भ में ईर्ष्या को श्रम और कुशलता की प्रेरक शक्ति बताया गया है। हिन्दी में कारण-संबंध स्पष्ट करने के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: קִנְאַת
  choice: ईर्ष्या
  rationale: यहाँ लोगों के बीच तुलना और प्रतिद्वंद्विता का प्रसंग है; इसलिए ‘ईर्ष्या’ सबसे स्पष्ट आधुनिक हिन्दी विकल्प है।
- source_word: אִישׁ מֵרֵעֵהוּ
  choice: मनुष्य की अपने पड़ोसी से
  rationale: यह मूल के एकवचन पुल्लिंग और प्रतिनिधिक प्रयोग को बनाए रखता है तथा पारस्परिक तुलना का भाव स्पष्ट करता है।
- source_word: הֶבֶל
  choice: व्यर्थता
  rationale: सभोपदेशक का यह प्रमुख विषयगत शब्द क्षणभंगुरता, निष्फलता और असारता के अर्थ समेटता है। ‘व्यर्थता’ किसी एक अर्थ तक इसे सीमित नहीं करता।
- source_word: רְעוּת רוּחַ
  choice: हवा के पीछे भागना
  rationale: यह चित्र निष्फल प्रयास और ऐसी वस्तु का पीछा करने का भाव देता है जिसे पाया नहीं जा सकता। यह आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
theological_decisions:
- issue: क्या पद सभी श्रम को सार्वभौमिक रूप से ईर्ष्या-जनित घोषित करता है?
  choice: मूल के व्यापक कथन को बिना नरम किए रखा गया है।
  alternative: ‘बहुत-सा परिश्रम’ या ‘अक्सर’ जोड़कर कथन को सीमित करना।
  rationale: हिब्रू में ‘सारा/हर’ का व्यापक कथन है; उसे व्याख्यात्मक सीमाओं से संकुचित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विषयगत रूप से सुसंगत शैली रखी गई है। ‘व्यर्थता’ सभोपदेशक के आवर्ती प्रमुख शब्द के रूप में सुरक्षित है; ‘हवा के पीछे भागना’ मूल रूपक को सहज हिन्दी में व्यक्त करता है।
