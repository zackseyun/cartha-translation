lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: फिर मैंने मुड़कर
  rationale: שׁוב का मूल अर्थ ‘मुड़ना/लौटना’ है और यहाँ यह एक नए अवलोकन की ओर संक्रमण भी कराता है। ‘फिर मैंने मुड़कर’ ठोस बिंब और प्रवचनगत क्रम, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲנִי
  choice: मैंने
  rationale: स्वतंत्र सर्वनाम אֲנִי कर्ता पर कुछ बल देता है। हिन्दी में ‘मैंने’ स्पष्ट रूप से रखकर कर्ता को व्यक्त किया गया है; ‘मैं स्वयं’ कहना संदर्भ से अधिक बल देता।
- source_word: וָאֶרְאֶה
  choice: देखी
  rationale: ראה का सीधा अर्थ ‘देखना’ है। ‘देखी’ सरल और स्रोत-सन्निकट है; ‘अवलोकन किया’ अपेक्षाकृत औपचारिक और अधिक व्याख्यात्मक होता।
- source_word: הֶבֶל
  choice: व्यर्थता
  rationale: הֶבֶל सभोपदेशक का प्रमुख और बहुअर्थी शब्द है, जिसमें भाप/साँस जैसी क्षणभंगुरता तथा निष्फलता का भाव शामिल हो सकता है। ‘व्यर्थता’ हिन्दी में इसकी संदर्भगत निष्फलता को व्यक्त करती है, जबकि पादटिप्पणी इसके व्यापक रूपक को सुरक्षित रखती है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक में पृथ्वी पर मानवीय जीवन के क्षेत्र के लिए बार-बार आने वाला निश्चित वाक्यांश है। ‘सूर्य के नीचे’ इसका सीधा, स्वाभाविक और पारंपरिक हिन्दी रूप है।
