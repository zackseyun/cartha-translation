- source_word: כִּי ... כִּי
  choice: क्योंकि ... यद्यपि
  rationale: पहला כִּי पिछले कथन का कारण देता है। दूसरे को सन्दर्भानुसार रियायती अर्थ में ‘यद्यपि’ किया गया है, जिससे पद का तनाव बना रहता है।
