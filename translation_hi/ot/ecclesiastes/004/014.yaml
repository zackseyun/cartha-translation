- source_word: בְּמַלְכוּתוֹ
  choice: अपने ही राज्य में
  rationale: מַלְכוּת का अर्थ ‘राज्य’, ‘राजत्व’ या ‘शासनकाल’ हो सकता है। मुख्य पाठ में स्थानवाचक अर्थ रखा गया है और कालवाचक विकल्प पादटिप्पणी में दिया गया है।
- source_word: נוֹלַד רָשׁ
