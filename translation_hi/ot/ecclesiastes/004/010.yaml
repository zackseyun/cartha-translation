base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/004/010.yaml
  text: For if they fall[a], one will lift up his companion[b]; but woe to the one who falls when there is not a second to lift him up.
translation:
  language: hi
  text: क्योंकि यदि वे गिरें, तो एक अपने साथी[a] को उठा देगा; पर हाय उस पर जो गिरे, और उसे उठाने के लिए कोई दूसरा न हो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मित्र’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और उसे उठाने के लिए कोई दूसरा नहीं है।’
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन—दो का एक से अच्छा होना—का कारण बताते हुए शर्त प्रस्तुत करता है; इसलिए ‘क्योंकि यदि’ दोनों संबंधों को बनाए रखता है।
- source_word: יִפֹּלוּ
  choice: वे गिरें
  rationale: नפל के ठोस ‘गिरने’ के बिंब को सुरक्षित रखता है और बाद के एकवचन ‘गिरे’ के साथ शब्दगत संबंध बनाए रखता है।
- source_word: הָאֶחָד
  choice: एक
  rationale: दो व्यक्तियों के संदर्भ में इसका स्वाभाविक वितरणात्मक अर्थ ‘एक’ है।
- source_word: יָקִים
  choice: उठा देगा
  rationale: קום के हिफ़ील रूप का अर्थ किसी को उठाकर खड़ा करना है; यह अनुवाद भौतिक बिंब और परिणाम दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶת חֲבֵרוֹ
  choice: अपने साथी को
  rationale: חבר यहाँ साथ रहने या काम करने वाले व्यक्ति के लिए व्यापक शब्द है; ‘साथी’ अनावश्यक रूप से घनिष्ठ मित्रता नहीं जोड़ता।
- source_word: וְאִילוֹ
  choice: पर हाय
  rationale: यह विस्मयादिबोधक शोक और चेतावनी की तीव्रता व्यक्त करता है; ‘पर हाय’ विरोध और गंभीरता दोनों बनाए रखता है।
- source_word: הָאֶחָד שֶׁיִּפּוֹל
  choice: उस अकेले पर जो गिरे
  rationale: शाब्दिक ‘उस एक’ का प्रसंगगत आशय जोड़ी के विपरीत अकेला व्यक्ति है; ‘अकेले’ से हिन्दी में यह विरोध स्पष्ट और स्वाभाविक होता है।
- source_word: וְאֵין שֵׁנִי
  choice: और ... कोई दूसरा न हो
  rationale: ‘दूसरा’ मूल के संख्यात्मक विरोध को बनाए रखता है, जबकि वाक्य-विन्यास आधुनिक हिन्दी में सहज है।
- source_word: לַהֲקִימוֹ
  choice: उसे उठाने के लिए
  rationale: पहले प्रयुक्त קום की पुनरावृत्ति को ‘उठाने’ से बनाए रखा गया है और कर्मवाचक प्रत्यय को ‘उसे’ से स्पष्ट किया गया है।
