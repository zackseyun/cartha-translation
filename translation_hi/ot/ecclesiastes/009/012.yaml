source:
  edition: WLC
  text: כִּ֡י גַּם֩ לֹֽא יֵדַ֨ע הָ/אָדָ֜ם אֶת עִתּ֗/וֹ כַּ/דָּגִים֙ שֶׁ/נֶּֽאֱחָזִים֙ בִּ/מְצוֹדָ֣ה רָעָ֔ה וְ/כַ֨/צִּפֳּרִ֔ים הָ/אֲחֻז֖וֹת בַּ/פָּ֑ח כָּ/הֵ֗ם יֽוּקָשִׁים֙ בְּנֵ֣י הָֽ/אָדָ֔ם לְ/עֵ֣ת רָעָ֔ה כְּ/שֶׁ/תִּפּ֥וֹל עֲלֵי/הֶ֖ם פִּתְאֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/012.yaml
  text: 'For man does not even know his time: like fish that are caught in a cruel net[a], and like birds that are caught in a snare, so the sons of man are trapped at an evil time[c][b], when it suddenly falls upon them.'
translation:
  language: hi
  text: क्योंकि मनुष्य अपना समय भी नहीं जानता। जैसे मछलियाँ विनाशकारी जाल में पकड़ी जाती हैं और पक्षी फंदे में फँसते हैं, वैसे ही मनुष्य[a] विपत्ति के समय[b] फँस जाते हैं, जब वह अचानक उन पर आ पड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मनुष्य के पुत्र’; यह मनुष्यों के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘बुरे समय में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन जातिवाचक संज्ञा पूरी मानवजाति के प्रतिनिधि के रूप में प्रयुक्त है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए एकवचन को बनाए रखता है।
- source_word: עִתּוֹ
  choice: अपना समय
  rationale: शाब्दिक अर्थ ‘उसका समय’ है; हिन्दी में कर्ता ‘मनुष्य’ के साथ ‘अपना समय’ अधिक स्वाभाविक है और अज्ञात निर्णायक समय का भाव सुरक्षित रखता है।
- source_word: מְצוֹדָה רָעָה
  choice: विनाशकारी जाल
  rationale: רָעָה यहाँ जाल की नैतिक बुराई नहीं, उसके हानिकारक या घातक स्वरूप को बताता है; ‘विनाशकारी’ अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּח
  choice: फंदा
  rationale: पक्षियों को पकड़ने वाले जाल या फंदे के लिए यह सहज हिन्दी शब्द है और समानांतर बिंब बनाए रखता है।
- source_word: יֽוּקָשִׁים
  choice: फँस जाते हैं
  rationale: निफ़अल रूप पकड़े या फँसाए जाने का भाव देता है; हिन्दी में ‘फँस जाते हैं’ स्पष्ट है और जाल-फंदे के बिंब से मेल खाता है।
- source_word: בְּנֵי הָאָדָם
  choice: मनुष्य
  rationale: इब्रानी मुहावरे का आशय मानव-समुदाय है। हिन्दी में शाब्दिक ‘मनुष्य के पुत्र’ भ्रामक होगा; बहुवचन क्रिया ‘फँस जाते हैं’ सामूहिक अर्थ स्पष्ट करती है।
- source_word: לְעֵת רָעָה
  choice: विपत्ति के समय
  rationale: शाब्दिक ‘बुरे समय’ के बजाय यह प्रसंगगत आपदा या अनिष्ट का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: כְּשֶׁתִּפּוֹל עֲלֵיהֶם פִּתְאֹם
  choice: जब वह अचानक उन पर आ पड़ता है
  rationale: स्त्रीलिंग एकवचन क्रिया का पूर्वपद עֵת ‘समय’ है; ‘वह’ इस व्याकरणिक संबंध और मूल की अस्पष्टता को बनाए रखता है, बिना ‘विपत्ति’ को दोहराकर स्पष्ट किए।
theological_decisions:
- issue: जातिवाचक אָדָם और मुहावरे בְּנֵי הָאָדָם का अनुवाद
  choice: पहले ‘मनुष्य’ और बाद में भी सामूहिक ‘मनुष्य’
  alternative: ‘मानवजाति’ अथवा शाब्दिक ‘मनुष्य के पुत्र’
  rationale: ‘मनुष्य’ प्रतिनिधिक एकवचन तथा सामूहिक मानवीय संदर्भ दोनों को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है। शाब्दिक ‘मनुष्य के पुत्र’ हिन्दी में वंश या किसी विशिष्ट उपाधि का गलत संकेत दे सकता है।
- issue: अंतिम स्त्रीलिंग सर्वनाम-संदर्भ
  choice: ‘वह’ द्वारा ‘समय’ की ओर संकेत बनाए रखना
  alternative: ‘जब विपत्ति अचानक उन पर आ पड़ती है’
  rationale: मूल में क्रिया संभवतः स्त्रीलिंग עֵת ‘समय’ की ओर लौटती है। स्पष्ट संज्ञा जोड़ने से मूल की सूक्ष्म व्याकरणिक और अर्थगत तनाव अनावश्यक रूप से हल हो जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मछली, पक्षी, जाल और फंदे का काव्यात्मक समानांतर सुरक्षित है। ‘विनाशकारी जाल’ नैतिक ‘बुराई’ के बजाय घातक परिणाम व्यक्त करता है; ‘वह’ अंतिम उपवाक्य में मूल के संदर्भ-संबंध को खुला रखता है।
