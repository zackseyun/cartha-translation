  edition: WLC
  text: הַ/כֹּ֞ל כַּ/אֲשֶׁ֣ר לַ/כֹּ֗ל מִקְרֶ֨ה אֶחָ֜ד לַ/צַּדִּ֤יק וְ/לָ/רָשָׁע֙ לַ/טּוֹב֙ וְ/לַ/טָּה֣וֹר וְ/לַ/טָּמֵ֔א וְ/לַ/זֹּבֵ֔חַ וְ/לַ/אֲשֶׁ֖ר אֵינֶ֣/נּוּ זֹבֵ֑חַ כַּ/טּוֹב֙ כַּֽ/חֹטֶ֔א הַ/נִּשְׁבָּ֕ע כַּ/אֲשֶׁ֖ר שְׁבוּעָ֥ה יָרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/002.yaml
  text: 'All is the same for all: one fate comes to the righteous and to the wicked[a], to the good and to the clean and to the unclean, to the one who sacrifices and to the one who does not sacrifice; as the good one, so the sinner[b]; the one who swears is as the one who fears an oath.'
translation:
  language: hi
  text: 'सबके लिए सब कुछ एक-सा है: धर्मी और दुष्ट के लिए, भले के लिए, शुद्ध और अशुद्ध के लिए, बलि चढ़ाने वाले और बलि न चढ़ाने वाले के लिए एक ही भाग्य[a] है; जैसा भला, वैसा ही पापी; शपथ लेने वाला वैसा ही है जैसा वह जो शपथ से डरता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ही घटना” अथवा “एक ही नियति।”
    reason: מִקְרֶה אֶחָד के वैकल्पिक अर्थों को दर्ज करता है।
  - marker: b
    text: या “जो शपथ लेने से डरता है।”
    reason: अंतिम इब्रानी वाक्यांश का अधिक स्पष्ट वैकल्पिक अर्थ देता है।
lexical_decisions:
- source_word: הַכֹּל כַּאֲשֶׁר לַכֹּל
  choice: सबके साथ एक ही बात होती है
  rationale: इब्रानी की संक्षिप्त और कुछ अंश तक लुप्तपदीय आरंभिक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और सब पर समान रूप से घटित होने की बात बनाए रखता है।
- source_word: מִקְרֶה אֶחָד
  choice: एक ही परिणाम
  rationale: सभोपदेशक के निकट संदर्भ में सब मनुष्यों पर आनेवाले समान अंतिम परिणाम, विशेषकर मृत्यु, की ओर संकेत करता है; साथ ही नियतिवाद का अनावश्यक भाव नहीं जोड़ता।
- source_word: לַצַּדִּיק וְלָרָשָׁע
  choice: धर्मी और दुष्ट
  rationale: इब्रानी के मानक नैतिक विरोध को परिचित और स्पष्ट बाइबलीय हिन्दी में बनाए रखता है।
- source_word: לַטּוֹב
  choice: भले
  rationale: ‘धर्मी’ से मिलती-जुलती पर अलग श्रेणी को बनाए रखता है, जैसा इब्रानी की आलंकारिक सूची में है।
- source_word: לַטָּהוֹר וְלַטָּמֵא
  choice: शुद्ध और अशुद्ध
  rationale: नैतिक अर्थ तक सीमित किए बिना धार्मिक-अनुष्ठान संबंधी शुद्धता और अशुद्धता की सम्भावना को बनाए रखता है।
- source_word: לַזֹּבֵחַ וְלַאֲשֶׁר אֵינֶנּוּ זֹבֵחַ
  choice: बलि चढ़ानेवाले और बलि न चढ़ानेवाले
  rationale: दोनों कृदन्तीय पक्षों को समानांतर, स्पष्ट और वर्तमान हिन्दी में प्रस्तुत करता है।
- source_word: כַּטּוֹב כַּחֹטֶא
  choice: जैसा भला, वैसा ही पापी
  rationale: इब्रानी की सूक्तिपरक तुलनात्मक संरचना को बनाए रखता है।
- source_word: הַנִּשְׁבָּע כַּאֲשֶׁר שְׁבוּעָה יָרֵא
  choice: शपथ खानेवाला उस व्यक्ति के समान है जो शपथ से डरता है
  rationale: अंतिम वाक्यांश की जानबूझकर अस्पष्ट भाषा को बनाए रखता है—यह शपथ लेने से डरने या शपथ के प्रति श्रद्धामिश्रित भय रखने, दोनों का संकेत दे सकती है।
theological_decisions:
- issue: מִקְרֶה אֶחָד का आशय
  choice: एक ही परिणाम
  alternative: एक ही घटना; एक ही नियति
  rationale: संदर्भ में समान अंतिम परिणति, सम्भवतः मृत्यु, प्रमुख है। ‘परिणाम’ इस दिशा को व्यक्त करता है, पर किसी दार्शनिक नियतिवाद को नहीं थोपता।
- issue: शुद्ध और अशुद्ध की श्रेणियाँ
  choice: शुद्ध और अशुद्ध
  alternative: पवित्र और अपवित्र; धार्मिक रीति से शुद्ध और अशुद्ध
  rationale: अनुष्ठानिक और व्यापक अर्थों के बीच तनाव को खुला रखता है तथा मुख्य पाठ में व्याख्यात्मक विस्तार नहीं जोड़ता।
- issue: शपथ संबंधी अंतिम तुलना
  choice: जो शपथ से डरता है
  alternative: जो शपथ खाने से डरता है; जो शपथ का आदर करता है
  rationale: इब्रानी में भय, सावधानी या श्रद्धा के बीच विद्यमान अर्थगत अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। नैतिक तथा अनुष्ठानिक विरोधों की क्रमिक सूची और अंतिम वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
