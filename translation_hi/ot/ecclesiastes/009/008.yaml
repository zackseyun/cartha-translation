  yaml_path: translation/ot/ecclesiastes/009/008.yaml
  text: Let your garments always be white[b][a], and do not let oil be lacking on your head.
translation:
  language: hi
  text: तेरे वस्त्र सदा सफेद[a] रहें, और तेरे सिर पर तेल की कमी न हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर समय तेरे वस्त्र सफेद रहें।”
    reason: lexical_alternative
  - marker: b
    text: सफेद वस्त्र और सिर पर तेल शोक के विपरीत उत्सव, आनन्द और कुशल-क्षेम का बिंब प्रस्तुत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־עֵת
  choice: सदा
  rationale: इस वाक्यांश का शाब्दिक अर्थ ‘हर समय’ है; ‘सदा’ उसके निरंतर भाव को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: יִהְיוּ
  choice: रहें
  rationale: संदर्भ में अपूर्ण क्रिया का प्रयोग इच्छार्थक/उपदेशात्मक है; ‘रहें’ इस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: בְגָדֶיךָ
  choice: तेरे वस्त्र
  rationale: ‘वस्त्र’ ठोस बहुवचन संज्ञा को सुरक्षित रखता है और ज्ञान-साहित्य की गरिमापूर्ण, फिर भी सुबोध शैली के अनुकूल है।
- source_word: לְבָנִים
  choice: उजले
  rationale: मूल विशेषण का अर्थ ‘श्वेत’ है। वस्त्रों के लिए ‘उजले’ आधुनिक हिन्दी में स्वाभाविक है और रंग/चमक की छवि को बिना उसका प्रतीकात्मक अर्थ मुख्य पाठ में जोड़े बनाए रखता है।
- source_word: וְשֶׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल ‘तेल’ कहता है; जैतून का तेल या अभिषेक का तेल कहना अनावश्यक विशिष्टीकरण होगा।
- source_word: עַל־רֹאשְׁךָ
  choice: तेरे सिर पर
  rationale: पूर्वसर्गीय पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַל־יֶחְסָר
  choice: की कमी न हो
  rationale: निषेध के साथ अपूर्ण क्रिया अभाव न होने की उपदेशात्मक कामना व्यक्त करती है; यह रूप अर्थ और लहजे दोनों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: उजले वस्त्रों और सिर पर तेल की प्रतीकात्मकता
  choice: मुख्य पाठ में ठोस बिंब बनाए रखकर सांस्कृतिक संकेत को पादटिप्पणी में समझाया गया है।
  alternative: मुख्य पाठ में सीधे ‘आनन्दित रह’ या ‘उत्सव मनाता रह’ कहना।
  rationale: मूल इब्रानी आनन्द, उत्सव और कुशल-क्षेम का बिंब प्रस्तुत करती है, पर उसका अर्थ स्पष्ट कथन में नहीं बदलती; इसलिए काव्यात्मक तनाव और सांस्कृतिक छवि सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली अपनाई गई है। एकवचन सम्बोधन के लिए ‘तेरे’ रखा गया है, जो उपदेशात्मक ज्ञान-साहित्य में स्वाभाविक है। पादटिप्पणी [a] को सम्बद्ध पद के तुरंत बाद और सांस्कृतिक टिप्पणी [b] को पूरे वाक्य के बाद रखा गया है।
