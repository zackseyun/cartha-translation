source:
  edition: WLC
  text: שַׁ֜בְתִּי וְ/רָאֹ֣ה תַֽחַת הַ/שֶּׁ֗מֶשׁ כִּ֣י לֹא֩ לַ/קַּלִּ֨ים הַ/מֵּר֜וֹץ וְ/לֹ֧א לַ/גִּבּוֹרִ֣ים הַ/מִּלְחָמָ֗ה וְ֠/גַם לֹ֣א לַ/חֲכָמִ֥ים לֶ֨חֶם֙ וְ/גַ֨ם לֹ֤א לַ/נְּבֹנִים֙ עֹ֔שֶׁר וְ/גַ֛ם לֹ֥א לַ/יֹּדְעִ֖ים חֵ֑ן כִּי עֵ֥ת וָ/פֶ֖גַע יִקְרֶ֥ה אֶת כֻּלָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/011.yaml
  text: I again saw under the sun that the race is not to the swift[a], nor the battle to the mighty, and also bread is not to the wise, nor riches to the discerning, nor favor to those who know; for time and chance happen to them all.
translation:
  language: hi
  text: मैंने फिर सूर्य के नीचे देखा कि दौड़ में जीत केवल तेज़ दौड़नेवालों को नहीं मिलती, और युद्ध में जीत केवल वीरों को नहीं मिलती; रोटी केवल बुद्धिमानों को नहीं मिलती, धन केवल समझदारों को नहीं मिलता, और अनुकूलता केवल ज्ञान रखनेवालों को नहीं मिलती; क्योंकि समय और संयोग[a] सब पर आ पड़ते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समय और आकस्मिक घटना,” “समय और अनहोनी,” अथवा “समय और परिस्थिति।” हिब्रू अभिव्यक्ति इस बात पर बल देती है कि अप्रत्याशित परिस्थितियाँ सबको आ घेरती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבְתִּי וְרָאֹה
  choice: मैंने फिर ... देखा
  rationale: शाब्दिक अर्थ ‘मैं लौटा और देखा’ है, पर सभोपदेशक में यह मुहावरा किसी नए या दोबारा किए गए अवलोकन का परिचय देता है। ‘मैंने फिर देखा’ आधुनिक हिन्दी में स्वाभाविक रूप से पुनरावृत्ति व्यक्त करता है।
- source_word: תַחַת הַשֶּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक की विशिष्ट अभिव्यक्ति है और पृथ्वी पर मानवीय जीवन के क्षेत्र को दर्शाती है; परिचित बिंब को यथावत रखा गया है।
- source_word: לַקַּלִּים הַמֵּרוֹץ
  choice: तेज़ दौड़नेवाले ही दौड़ जीतते हैं
  rationale: हिब्रू में शाब्दिक रूप से ‘दौड़ तेज़ लोगों की नहीं’ है। हिन्दी में दौड़ के परिणाम का आशय स्पष्ट करने के लिए ‘जीतते हैं’ निहितार्थ के रूप में व्यक्त किया गया है, जबकि ‘ही’ अपेक्षित योग्यता और वास्तविक परिणाम के बीच विरोध बनाए रखता है।
- source_word: לַגִּבּוֹרִים הַמִּלְחָמָה
  choice: वीर ही युद्ध जीतते हैं
  rationale: גִּבּוֹרִים बलवानों या वीरों को दर्शाता है। युद्ध के संदर्भ में ‘वीर’ स्वाभाविक है; ‘जीतते हैं’ हिब्रू के परिणाम-संबंधी संक्षिप्त कथन को हिन्दी में स्पष्ट करता है।
- source_word: לַחֲכָמִים לֶחֶם
  choice: बुद्धिमानों को ही रोटी मिलती है
  rationale: לֶחֶם का ठोस बिंब ‘रोटी’ के रूप में सुरक्षित रखा गया है; यहाँ यह भोजन और जीविका दोनों का संकेत दे सकता है।
- source_word: לַנְּבֹנִים עֹשֶׁר
  choice: समझदारों को ही धन
  rationale: נְבֹנִים विवेक और समझ रखनेवालों को दर्शाता है। ‘समझदार’ सामान्य आधुनिक हिन्दी है और עֹשֶׁר के लिए ‘धन’ सहज तथा स्पष्ट है।
- source_word: לַיֹּדְעִים חֵן
  choice: ज्ञान रखनेवालों को ही कृपा-दृष्टि
  rationale: יֹדְעִים को व्यापक अर्थ में ‘ज्ञान रखनेवाले’ रखा गया है। חֵן यहाँ अनुग्रहपूर्ण स्वीकृति या अनुकूलता है; ‘कृपा-दृष्टि’ धार्मिक अर्थ तक सीमित हुए बिना किसी की अनुकूल दृष्टि को व्यक्त करती है।
- source_word: עֵת וָפֶגַע
  choice: समय और संयोग
  rationale: עֵת ‘समय’ है, और פֶגַע ऐसी आकस्मिक घटना या परिस्थिति को दर्शाता है जो मनुष्य के नियंत्रण से बाहर उससे आ मिलती है। ‘संयोग’ अनिश्चितता बनाए रखता है, पर इसे दार्शनिक रूप से अंधे भाग्य का दावा नहीं बनाता।
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: सब पर आ पड़ते हैं
  rationale: क्रिया का भाव केवल ‘घटित होना’ नहीं, बल्कि लोगों को आ मिलने या उन्हें अपनी चपेट में लेने का भी है। ‘सब पर आ पड़ते हैं’ अप्रत्याशित परिस्थितियों की व्यापकता व्यक्त करता है।
theological_decisions:
- issue: क्या ‘समय और संयोग’ परमेश्वर की प्रभुता का निषेध बताते हैं
  choice: पद को ‘सूर्य के नीचे’ मानवीय अनुभव में परिणामों की अनिश्चितता के अवलोकन के रूप में रखा गया है।
  alternative: जीवन को केवल अंधे संयोग द्वारा संचालित बताने वाला दार्शनिक दावा।
  rationale: हिब्रू पाठ अप्रत्याशित परिस्थितियों के सब पर आने की बात कहता है, पर स्पष्ट रूप से न तो परमेश्वर की प्रभुता का निषेध करता है, न यहाँ उसकी व्याख्या देता है। अनुवाद इस तनाव को खुला रखता है।
- issue: योग्यता और सफलता के संबंध का स्वरूप
  choice: ‘ही’ के द्वारा यह व्यक्त किया गया है कि स्वाभाविक योग्यता परिणाम की गारंटी नहीं देती।
  alternative: तेज़, वीर, बुद्धिमान या समझदार लोगों को कभी सफलता या साधन नहीं मिलते—ऐसा निरपेक्ष निषेध।
  rationale: पद का क्रम अपेक्षित मानवीय लाभ और वास्तविक जीवन के अनिश्चित परिणाम में विरोध दिखाता है; इसे उन समूहों के बारे में सार्वभौमिक नकार के रूप में नहीं पढ़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्य-रचना और बार-बार आनेवाला ‘ही’ मूल पद की लय तथा इस विचार को सुरक्षित रखते हैं कि क्षमता सफलता की निश्चित गारंटी नहीं है। फुटनोट का चिह्न उसी अभिव्यक्ति के बाद रखा गया है जिसकी वह व्याख्या करता है।
