id: ECC.9.4
reference: Ecclesiastes 9:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי מִי֙ אֲשֶׁ֣ר יבחר אֶ֥ל כָּל הַ/חַיִּ֖ים יֵ֣שׁ בִּטָּח֑וֹן כִּֽי לְ/כֶ֤לֶב חַי֙ ה֣וּא ט֔וֹב מִן הָ/אַרְיֵ֖ה הַ/מֵּֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/004.yaml
  text: For whoever is joined to all the living has hope[b][a], because a living dog is better than a dead lion.
translation:
  language: hi
  text: क्योंकि जो कोई जीवितों में शामिल है, उसके लिए आशा है[b][a]; क्योंकि जीवित कुत्ता मरे हुए सिंह से अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जो कोई जीवितों में चुना गया है, उसे भरोसा है।” आरंभिक उपवाक्य का इब्रानी रूप कठिन है और उसका अर्थ अलग ढंग से भी समझा जाता है।
    reason: alternative_reading
  - marker: b
    text: “आशा” का अनुवाद “भरोसा” या “सुरक्षा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יבחר
  choice: शामिल है
  rationale: व्यंजनात्मक रूप सामान्यतः ‘चुना जाए’ की ओर संकेत कर सकता है, पर यह पाठ कठिन है। प्रसंग और प्राचीन अनुवादों के आधार पर यहाँ जीवितों की संगति में बने रहने का भाव अधिक सुसंगत है।
- source_word: אֶל כָּל הַחַיִּים
  choice: जीवितों में
  rationale: यह पदबंध जीवित लोगों के समुदाय से संबंध दर्शाता है। ‘जीवितों में शामिल’ स्वाभाविक हिन्दी में संबंधसूचक अर्थ को व्यक्त करता है।
- source_word: בִּטָּחוֹן
  choice: आशा
  rationale: शब्द का अर्थ ‘भरोसा’ या ‘सुरक्षा’ भी हो सकता है, पर मृत्यु के विपरीत जीवन में बची संभावना पर बल होने के कारण ‘आशा’ प्रसंगानुकूल है।
- source_word: לְכֶלֶב חַי
  choice: जीवित कुत्ता
  rationale: मूल के सीधे और लोकोक्तिपरक चित्र को सुरक्षित रखता है।
- source_word: טוֹב מִן
  choice: से अच्छा है
  rationale: यह सामान्य तुलनात्मक रचना है; सरल लोकोक्तिपरक शैली को बनाए रखती है।
- source_word: הָאַרְיֵה הַמֵּת
  choice: मरे हुए सिंह
  rationale: हिन्दी में यह तुलना स्वाभाविक है और दीन समझे जाने वाले जीवित प्राणी तथा प्रतिष्ठित किंतु मृत प्राणी के बीच विरोध को स्पष्ट रखती है।
theological_decisions:
- issue: प्रारंभिक उपवाक्य में יבחר का अर्थ
  choice: जो कोई जीवितों में शामिल है
  alternative: जो कोई जीवितों में चुना गया है
  rationale: मसोरेटिक स्वरांकन के अनुसार ‘चुना गया’ संभव है, किंतु वाक्य कठिन रहता है। प्रसंग उस व्यक्ति की ओर संकेत करता है जो अब भी जीवितों में गिना जाता है और इसलिए उसके लिए आशा शेष है। वैकल्पिक पाठ को पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और लोकोक्तिपरक शैली। मूल पाठ की कठिनता तथा בִּטָּחוֹן की अर्थ-सीमा पादटिप्पणियों में सुरक्षित रखी गई है।
