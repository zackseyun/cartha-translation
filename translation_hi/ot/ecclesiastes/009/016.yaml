id: ECC.9.16
reference: Ecclesiastes 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַ֣רְתִּי אָ֔נִי טוֹבָ֥ה חָכְמָ֖ה מִ/גְּבוּרָ֑ה וְ/חָכְמַ֤ת הַ/מִּסְכֵּן֙ בְּזוּיָ֔ה וּ/דְבָרָ֖י/ו אֵינָ֥/ם נִשְׁמָעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/016.yaml
  text: And I said[a], “Wisdom is better than strength,” but the wisdom of the poor man is despised[c][b], and his words are not heard.
translation:
  language: hi
  text: तब मैंने कहा, “बुद्धि बल[a] से अच्छी है,” फिर भी उस निर्धन मनुष्य[b] की बुद्धि तुच्छ समझी जाती है, और उसकी बातें नहीं सुनी जातीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सामर्थ्य’ अथवा ‘पराक्रम’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘उस निर्धन मनुष्य’; संभवतः यह पिछले पद के निर्धन बुद्धिमान मनुष्य की ओर संकेत करता है।
    reason: cross_reference
  - marker: c
    text: या ‘उन पर ध्यान नहीं दिया जाता’ अथवा ‘वे अनसुनी रह जाती हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי
  choice: तब मैंने कहा
  rationale: संयोजक वाव और प्रथम पुरुष पूर्ण क्रिया यहाँ वक्ता के निष्कर्ष या मनन को आगे बढ़ाते हैं। ‘तब मैंने कहा’ हिन्दी में स्वाभाविक है और प्रसंगगत क्रम को बिना अधिक व्याख्या जोड़े व्यक्त करता है।
- source_word: טוֹבָה חָכְמָה מִגְּבוּרָה
  choice: बुद्धि बल से अच्छी है
  rationale: तुलनात्मक מִן के साथ यह वाक्य बुद्धि की श्रेष्ठता बताता है। ‘बल’ גְּבוּרָה के शारीरिक या प्रभावकारी सामर्थ्य के सामान्य अर्थ को संक्षेप में रखता है।
- source_word: וְחָכְמַת
  choice: फिर भी ... की बुद्धि
  rationale: वाव का मूल अर्थ ‘और’ है, पर यहाँ पहले कथन और बाद की विडंबनापूर्ण वास्तविकता के बीच विरोध है। ‘फिर भी’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּסְכֵּן
  choice: उस निर्धन मनुष्य
  rationale: निश्चित उपपद और पुल्लिंग एकवचन प्रसंग में पिछले पद के निर्धन बुद्धिमान मनुष्य की ओर संकेत करते हैं। ‘उस’ इस अनाफोरिक संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּזוּיָה
  choice: तुच्छ समझी जाती है
  rationale: यह रूप अवमानना और अनादर की दशा व्यक्त करता है। ‘तुच्छ समझी जाती है’ आधुनिक हिन्दी में स्पष्ट है और केवल उपेक्षा से अधिक, मूल्यहीन मानने का भाव रखता है।
- source_word: וּדְבָרָיו
  choice: और उसकी बातें
  rationale: बहुवचन דְּבָרִים यहाँ उस व्यक्ति के कहे हुए वचनों या परामर्श को दर्शाता है। ‘उसकी बातें’ साधारण आधुनिक हिन्दी में प्रत्यक्ष और सहज है।
- source_word: אֵינָם נִשְׁמָעִים
  choice: नहीं सुनी जातीं
  rationale: नकारात्मक अस्तित्वसूचक रूप और निफ़अल कृदंत बताते हैं कि उसकी बातों को सुनवाई नहीं मिलती। हिन्दी अभिव्यक्ति सुनने और ध्यान देने—दोनों संभावित अर्थों को खुला रखती है।
