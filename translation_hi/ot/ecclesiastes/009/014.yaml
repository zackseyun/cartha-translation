  yaml_path: translation/ot/ecclesiastes/009/014.yaml
  text: There was a small city[a], and few men were in it; and a great king came against it, surrounded it, and built great siegeworks against it.
translation:
  language: hi
  text: एक छोटा-सा नगर था, और उसमें थोड़े ही पुरुष थे। एक बड़ा राजा उस पर चढ़ आया, उसने उसे घेर लिया और उसके विरुद्ध घेराबंदी की बड़ी-बड़ी संरचनाएँ[a] बनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विरुद्ध बड़ी-बड़ी दुर्गबंदियाँ” अथवा “उसके विरुद्ध घेराबंदी के बड़े-बड़े चढ़ाव।” इब्रानी शब्द מְצוֹדִים व्यापक रूप से घेराबंदी की संरचनाओं या किलेबंदियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר קְטַנָּה
  choice: एक छोटा-सा नगर
  rationale: यह पदबंध नगर के छोटे आकार को सीधे व्यक्त करता है। ‘छोटा-सा नगर’ स्वाभाविक आधुनिक हिन्दी है और आगे के ‘बड़े राजा’ के साथ मूल का विरोध बनाए रखता है।
- source_word: וַאֲנָשִׁים בָּהּ מְעָט
  choice: और उसमें थोड़े ही पुरुष थे
  rationale: अֲנָשִׁים पुल्लिंग बहुवचन है; इसलिए इसे सामान्यीकृत ‘लोग’ न करके ‘पुरुष’ रखा गया है। ‘थोड़े ही’ उनकी अल्प संख्या पर बल देता है।
- source_word: וּבָא אֵלֶיהָ
  choice: उस पर चढ़ आया
  rationale: शाब्दिक अर्थ ‘उसके पास आया’ हो सकता है, पर घेरने और घेराबंदी के निर्माण का सैन्य प्रसंग विरोधी आक्रमण स्पष्ट करता है। ‘चढ़ आया’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מֶלֶךְ גָּדוֹל
  choice: एक बड़ा राजा
  rationale: ‘बड़ा’ גָּדוֹל का सीधा और स्वाभाविक प्रतिरूप है तथा छोटे नगर के साथ मूल का अलंकारिक विरोध सुरक्षित रखता है।
- source_word: וְסָבַב אֹתָהּ
  choice: उसने उसे घेर लिया
  rationale: סבב का यहाँ अर्थ चारों ओर से घेरना है; ‘घेर लिया’ सैन्य प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: וּבָנָה עָלֶיהָ
  choice: और उसके विरुद्ध ... बनाए
  rationale: בנה का अर्थ ‘बनाना/निर्माण करना’ है और עַל यहाँ नगर के विरुद्ध किए गए शत्रुतापूर्ण निर्माण को दर्शाता है।
- source_word: מְצוֹדִים גְּדֹלִים
  choice: घेराबंदी के बड़े-बड़े मोर्चे
  rationale: מְצוֹדִים घेराबंदी में प्रयुक्त सैन्य संरचनाओं या दुर्गबंदियों को व्यापक रूप से सूचित कर सकता है। ‘मोर्चे’ पर्याप्त व्यापक है, जबकि पादटिप्पणी अन्य संभावित ठोस अर्थ सुरक्षित रखती है; ‘बड़े-बड़े’ גְּדֹלִים को और पहले आए ‘बड़े राजा’ की प्रतिध्वनि को बनाए रखता है।
