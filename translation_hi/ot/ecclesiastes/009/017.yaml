- source_word: מוֹשֵׁל
  choice: किसी शासक
  rationale: शासन या अधिकार रखने वाले व्यक्ति का व्यापक अर्थ देता है; अनिश्चितता व्यक्त करने के लिए हिन्दी में ‘किसी’ जोड़ा गया है।
- source_word: בַּכְּסִילִים
  choice: मूर्खों के बीच
  rationale: पूर्वसर्ग ב को यहाँ स्थान या संगति के अर्थ में लेना सबसे स्वाभाविक है; ‘के बीच’ शासक को मूर्खों की संगति में दिखाता है।
