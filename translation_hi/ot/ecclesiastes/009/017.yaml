  text: The words of the wise are heard in quiet more than the shouting of a ruler among fools[a][b].
translation:
  language: hi
  text: बुद्धिमानों की बातें शान्ति में सुनी जाती हैं—मूर्खों के बीच एक शासक की चिल्लाहट से अधिक।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शान्ति में सुनी जाने वाली बुद्धिमानों की बातें, मूर्खों के बीच एक शासक की चिल्लाहट से उत्तम हैं।” इब्रानी तुलना को “से अधिक” अथवा निहित श्रेष्ठता के अर्थ में “से उत्तम” कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मूर्खों के बीच” को कुछ लोग “मूर्खों पर” भी समझते हैं, पर यहाँ पूर्वसर्ग का स्थान या संगति सूचक अर्थ अधिक स्वाभाविक है।
    reason: lexical_alternative
