- source_word: נִשְׁמָעִים
  choice: सुनी जाती हैं
  rationale: שׁמע के निफ़अल कृदन्त का कर्मवाच्य अर्थ सीधे व्यक्त करता है; ‘मानी जाती हैं’ कहने से निहित स्वीकृति को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: מִזַּעֲקַת
  choice: चिल्लाने से अधिक
