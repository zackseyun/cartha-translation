  text: לֵ֣ךְ אֱכֹ֤ל בְּ/שִׂמְחָה֙ לַחְמֶ֔/ךָ וּֽ/שֲׁתֵ֥ה בְ/לֶב ט֖וֹב יֵינֶ֑/ךָ כִּ֣י כְבָ֔ר רָצָ֥ה הָ/אֱלֹהִ֖ים אֶֽת מַעֲשֶֽׂי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/007.yaml
  text: Go[a], eat your bread with joy, and drink your wine with a glad heart, for God has already approved your works.
translation:
  language: hi
  text: जा, आनन्द से अपनी रोटी खा और प्रसन्न मन से अपना दाखरस पी, क्योंकि परमेश्वर तेरे कामों को पहले ही स्वीकार कर चुका है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तेरे कामों से प्रसन्न है।’
    reason: רָצָה का अर्थ किसी को या किसी वस्तु को अनुकूलतापूर्वक स्वीकार करना अथवा उससे प्रसन्न होना हो सकता है।
lexical_decisions:
- source_word: לֵךְ
  choice: जा
  rationale: यह एकवचन आज्ञार्थक क्रिया यहाँ अगले उपदेश को आरम्भ करने वाले मुहावरे के रूप में प्रयुक्त है। ‘जा’ इब्रानी की सीधी और संक्षिप्त अभिव्यक्ति को बनाए रखता है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द से
  rationale: पूर्वसर्ग यहाँ रीति बताता है। ‘आनन्द से’ आधुनिक हिन्दी में स्वाभाविक है और मूल संज्ञा का भाव बनाए रखता है।
- source_word: לַחְמֶךָ
  choice: अपनी रोटी
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है; यद्यपि यह सामान्य भोजन का भी द्योतक हो सकता है, यहाँ ठोस चित्र को बनाए रखना उचित है।
- source_word: בְלֶב טוֹב
  choice: प्रसन्न मन से
  rationale: शाब्दिक ‘अच्छे हृदय से’ हिन्दी में अपेक्षित अर्थ स्पष्ट नहीं करता। यह इब्रानी मुहावरा भीतरी प्रसन्नता दर्शाता है, जिसे ‘प्रसन्न मन से’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֵינֶךָ
  choice: अपना दाखमधु
  rationale: यह יַיִן का सन्दर्भानुकूल और स्पष्ट हिन्दी रूप है; इसे सामान्य ‘पेय’ बनाकर मूल चित्र को व्यापक नहीं किया गया।
- source_word: כְבָר
  choice: पहले ही
  rationale: यह परमेश्वर की अनुकूल स्वीकृति को इन आज्ञाओं से पूर्व की या पहले से विद्यमान वास्तविकता के रूप में दिखाता है।
- source_word: רָצָה
  choice: स्वीकार कर चुका है
  rationale: क्रिया अनुकूलतापूर्वक स्वीकार करने या प्रसन्न होने का अर्थ दे सकती है। पूर्ण पक्ष को ‘कर चुका है’ से व्यक्त किया गया है, और वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: מַעֲשֶׂיךָ
  choice: तेरे कामों
  rationale: מַעֲשִׂים व्यक्ति के किए हुए कामों या कार्यों को दर्शाता है। ‘कामों’ सामान्य आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की ठोस और मूल्यांकनात्मक भाषा को बनाए रखता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में परमेश्वर की स्वीकृति का अर्थ
  choice: पद कहता है कि परमेश्वर संबोधित व्यक्ति के कामों को पहले ही अनुकूलतापूर्वक स्वीकार कर चुका है; यही जीवन के उपहारों का आनन्द लेने के उपदेश का आधार है।
  alternative: ‘परमेश्वर तेरे कामों से प्रसन्न है’—यह सामान्य ईश्वरीय प्रसन्नता पर बल देता है; एक अन्य सम्भावना उपासना-संबंधी कार्यों या भेंटों की स्वीकृति है।
  rationale: רָצָה के साथ מַעֲשִׂים अनुकूल स्वीकृति या प्रसन्नता दोनों व्यक्त कर सकता है। अनुवाद मूल के मूल्यांकनात्मक कथन को बनाए रखता है, पर यह अपने आप में कर्मों द्वारा उद्धार की शिक्षा नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी में संबोधन पुल्लिंग एकवचन है, इसलिए ‘जा’, ‘खा’, ‘पी’ और ‘तेरे’ का प्रयोग किया गया है। ‘प्रसन्न मन’ मूल की हृदय-संबंधी अभिव्यक्ति का हिन्दी में स्वाभाविक समतुल्य है।
