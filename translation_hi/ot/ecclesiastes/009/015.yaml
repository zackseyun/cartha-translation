source:
  edition: WLC
  text: וּ/מָ֣צָא בָ֗/הּ אִ֤ישׁ מִסְכֵּן֙ חָכָ֔ם וּ/מִלַּט ה֥וּא אֶת הָ/עִ֖יר בְּ/חָכְמָת֑/וֹ וְ/אָדָם֙ לֹ֣א זָכַ֔ר אֶת הָ/אִ֥ישׁ הַ/מִּסְכֵּ֖ן הַ/הּֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/015.yaml
  text: And there was found in it a poor wise man[a], and he delivered the city by his wisdom; yet no one remembered that poor man.
translation:
  language: hi
  text: उस नगर में एक गरीब बुद्धिमान पुरुष मिला[a], और उसने अपनी बुद्धि से नगर को बचाया; फिर भी किसी ने उस गरीब पुरुष को याद नहीं रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उस नगर में एक गरीब बुद्धिमान पुरुष पाया।”
    reason: मूल क्रिया को सक्रिय रूप में पढ़ने और पिछले पद के राजा को उसका कर्ता मानने की संभावना।
lexical_decisions:
- source_word: וּמָצָא בָהּ
  choice: उस नगर में ... मिला
  rationale: मूल क्रिया रूपतः सक्रिय, तृतीय पुरुष एकवचन है, पर यहाँ अनिश्चित व्यक्ति के मिलने/पाए जाने का भाव भी स्वाभाविक है। हिंदी का ‘मिला’ इस प्रसंग में सहज अस्तित्वसूचक अर्थ देता है; रूपगत सक्रिय पाठ को पादटिप्पणी में रखा गया है।
- source_word: אִישׁ מִסְכֵּן חָכָם
  choice: एक गरीब बुद्धिमान पुरुष
  rationale: אִישׁ यहाँ एक पुरुष को सूचित करता है; מִסְכֵּן उसकी निर्धन या निम्न सामाजिक स्थिति और חָכָם उसकी बुद्धिमत्ता बताता है। शब्दक्रम को स्वाभाविक हिंदी के अनुसार रखा गया है।
- source_word: וּמִלַּט הוּא אֶת־הָעִיר
  choice: और उसने ... नगर को बचाया
  rationale: Piel रूप מִלַּט, नगर को कर्म के रूप में लेकर, छुड़ाने या बचाने का अर्थ देता है। आधुनिक हिंदी में ‘बचाया’ सबसे सहज और स्पष्ट है।
- source_word: בְּחָכְמָתוֹ
  choice: अपनी बुद्धि से
  rationale: בְּ यहाँ साधन का बोध कराता है। कर्ता वही बुद्धिमान पुरुष है, इसलिए हिंदी में ‘अपनी’ स्वाभाविक आत्मवाचक रूप है।
- source_word: וְאָדָם לֹא זָכַר
  choice: फिर भी किसी ने ... याद नहीं रखा
  rationale: אָדָם इस नकारात्मक अनिश्चित वाक्य में सामान्य मानव के अर्थ में है। ‘किसी ने नहीं’ आधुनिक हिंदी में स्वाभाविक रूप से ‘कोई व्यक्ति नहीं’ का भाव देता है। וְ का प्रसंगगत विरोध ‘फिर भी’ से व्यक्त हुआ है।
- source_word: הָאִישׁ הַמִּסְכֵּן הַהוּא
  choice: उस गरीब पुरुष को
  rationale: निश्चित उपपदों और संकेतवाचक הַהוּא से पहले उल्लिखित उसी व्यक्ति पर बल है; ‘उस गरीब पुरुष’ यह विशिष्ट संदर्भ बनाए रखता है।
theological_decisions:
- issue: וּמָצָא का कर्ता और अस्तित्वसूचक अर्थ
  choice: मुख्य पाठ में ‘उस नगर में ... मिला’
  alternative: ‘उसने उस नगर में एक गरीब बुद्धिमान पुरुष पाया’
  rationale: व्यंजनयुक्त पाठ का रूप सक्रिय ‘उसने पाया’ हो सकता है और उसका कर्ता पिछले पद का शक्तिशाली राजा समझा जा सकता है; किंतु वाक्य प्रसंग में किसी ऐसे पुरुष के वहाँ मिलने/उपस्थित होने का अनिश्चित भाव भी संभव है। मुख्य पाठ स्वाभाविक हिंदी में दूसरा भाव देता है, जबकि पादटिप्पणी रूपगत विकल्प सुरक्षित रखती है।
- issue: אָדָם का सामान्य अर्थ
  choice: किसी ने ... नहीं
  alternative: किसी मनुष्य ने ... नहीं
  rationale: यहाँ אָדָם किसी विशेष पुरुष के बजाय किसी भी मानव को सूचित करता है। ‘किसी ने नहीं’ अर्थ को बिना पुरुष-मात्र तक सीमित किए सहज हिंदी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगर’ सभोपदेशक के वर्णनात्मक स्वर के अनुकूल है; ‘बचाया’ कृत्रिम रूप से धार्मिक अर्थ जोड़े बिना उद्धार का सामान्य प्रसंगगत भाव देता है।
