  text: Wisdom is better than weapons of war[a], but one sinner destroys much good.
translation:
  language: hi
  text: बुद्धि युद्ध के हथियारों से बेहतर है, परन्तु[a] एक पापी बहुत भलाई नष्ट कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एक पापी बहुत भलाई नष्ट कर देता है।” इब्रानी संयोजक का अर्थ केवल “और” भी हो सकता है, यद्यपि इस प्रसंग में विरोध का भाव प्रतीत होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה חָכְמָה
  choice: बुद्धि अच्छी है
  rationale: מִן के साथ טוֹבָה तुलनात्मक अर्थ देता है। हिन्दी में ‘से ... अच्छी है’ स्वाभाविक रूप से ‘बेहतर’ का भाव व्यक्त करता है और सभोपदेशक में חָכְמָה के आवर्ती विषय को बनाए रखता है।
- source_word: מִכְּלֵי קְרָב
  choice: युद्ध के हथियारों से
  rationale: כְּלֵי का अर्थ उपकरण या सामग्री है और קְרָב के साथ यह युद्ध में प्रयुक्त हथियारों अथवा सैन्य साधनों को दर्शाता है; ‘युद्ध के हथियार’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְחוֹטֶא אֶחָד
  choice: परन्तु एक पापी
  rationale: וְ का मूल अर्थ ‘और’ है, किन्तु प्रसंग में अगला वाक्य बुद्धि की भलाई के विपरीत एक पापी की विनाशकारी शक्ति रखता है; इसलिए ‘परन्तु’ संबंध को स्वाभाविक ढंग से व्यक्त करता है। אֶחָד का जोर बनाए रखने के लिए ‘एक’ स्पष्ट रखा गया है।
- source_word: יְאַבֵּד
  choice: नष्ट कर देता है
  rationale: अब्द धातु के पिएल रूप में नष्ट करने या मिटा देने का कारक अर्थ है; यह चयन कथन की तीव्रता और नीतिवचन-सदृश चेतावनी को बनाए रखता है।
- source_word: טוֹבָה הַרְבֵּה
  choice: बहुत-सी भलाई
  rationale: यह पद बड़ी मात्रा में हुए लाभ या भले परिणाम को दर्शाता है। ‘बहुत-सी भलाई’ नैतिक और व्यावहारिक दोनों प्रकार की अच्छाई के लिए पर्याप्त व्यापक है।
theological_decisions:
- issue: וְ के द्वारा दोनों उपवाक्यों का संबंध
  choice: परन्तु
  alternative: और
  rationale: इब्रानी संयोजक सामान्यतः ‘और’ हो सकता है, पर यहाँ प्रसंग विरोधात्मक संबंध सुझाता है। मुख्य पाठ में स्वाभाविक विरोध रखा गया है और वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सदृश शैली रखी गई है। ‘बुद्धि’ और ‘भलाई’ सामान्य पाठकों के लिए सहज हैं; ‘परन्तु’ औपचारिकता बनाए रखते हुए स्पष्ट विरोध व्यक्त करता है।
