  naturalness: The revision uses a more idiomatic Hindi verbal expression, ‘आनंद से बिताओ,’ for enjoying the days of life, while retaining the literary but accessible register appropriate to Ecclesiastes. It also avoids the slightly awkward sequence ‘जीवन के ... दिनों में जीवन का आनंद लो.’
  terminology: ‘पत्नी,’ ‘क्षणभंगुर,’ ‘सूर्य के नीचे,’ ‘भाग,’ and ‘परिश्रम’ are suitable modern-standard Hindi equivalents. ‘परमेश्वर’ remains confined to the explanatory footnote, preserving the Hebrew clause’s implicit subject.
