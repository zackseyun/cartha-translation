  text: רְאֵ֨ה חַיִּ֜ים עִם אִשָּׁ֣ה אֲשֶׁר אָהַ֗בְתָּ כָּל יְמֵי֙ חַיֵּ֣י הֶבְלֶ֔/ךָ אֲשֶׁ֤ר נָֽתַן לְ/ךָ֙ תַּ֣חַת הַ/שֶּׁ֔מֶשׁ כֹּ֖ל יְמֵ֣י הֶבְלֶ֑/ךָ כִּ֣י ה֤וּא חֶלְקְ/ךָ֙ בַּֽ/חַיִּ֔ים וּ/בַ/עֲמָ֣לְ/ךָ֔ אֲשֶׁר אַתָּ֥ה עָמֵ֖ל תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/009.yaml
  text: Enjoy life with the wife whom you love all the days of your fleeting life that he has given you under the sun—all your fleeting days—for that is your portion in life and in your labor at which you toil under the sun[a][b][c].
translation:
  language: hi
  text: जिस पत्नी से तुम प्रेम करते हो, उसके साथ उस क्षणभंगुर जीवन के सारे दिन आनंद से बिताओ[a][b], जो उसने तुम्हें सूर्य के नीचे दिया है—अपने क्षणभंगुर जीवन के सारे दिन। क्योंकि जीवन में और उस परिश्रम में, जो तुम सूर्य के नीचे करते हो, यही तुम्हारा भाग है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जीवन को देखो।” इस इब्रानी मुहावरे का अर्थ जीवन का अनुभव करना या उसका आनंद लेना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द हेवेल का अर्थ मूलतः “वाष्प” या “सांस” है; इसका अनुवाद प्रायः “व्यर्थता” भी किया जाता है। यहाँ यह जीवन की क्षणभंगुर और अस्थिर प्रकृति व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: “उसने” का कर्ता इब्रानी में निहित है। व्यापक संदर्भ परमेश्वर की ओर संकेत करता है, यद्यपि इस उपवाक्य में उसका नाम नहीं लिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: רְאֵה חַיִּים
  choice: जीवन का आनंद लो
  rationale: शाब्दिक अर्थ ‘जीवन को देखो’ है, पर इस प्रयोग में मुहावरे का आशय जीवन का अनुभव करना या आनंद लेना है। स्वाभाविक हिन्दी में ‘जीवन का आनंद लो’ इस भाव को स्पष्ट रखता है।
- source_word: עִם אִשָּׁה אֲשֶׁר אָהַבְתָּ
  choice: जिस पत्नी से तुम प्रेम करते हो, उसके साथ
  rationale: אִשָּׁה बिना निश्चित उपपद के है, फिर भी संबोधन और संबंधवाचक उपवाक्य के संदर्भ में अपनी पत्नी अभिप्रेत है। पूर्णकालिक क्रिया यहाँ वर्तमान और निरंतर प्रेम का भाव दे सकती है।
- source_word: חַיֵּי הֶבְלֶךָ / יְמֵי הֶבְלֶךָ
  choice: अपने क्षणभंगुर जीवन / तुम्हारे सभी क्षणभंगुर दिनों
  rationale: הֶבֶל का मूल बिंब वाष्प या सांस-जैसी अस्थिरता है। ‘क्षणभंगुर’ जीवन की अल्पता और अस्थायित्व व्यक्त करता है, बिना इसे केवल ‘व्यर्थ’ या ‘अर्थहीन’ ठहराए।
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: जो उसने तुम्हें ... दिए हैं
  rationale: इब्रानी में कर्ता तीसरे पुरुष एकवचन में निहित है, पर इस उपवाक्य में परमेश्वर का नाम नहीं है। ‘उसने’ मूल की इस अप्रकटता को बनाए रखता है।
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट अभिव्यक्ति को सीधे और परिचित रूप में रखा गया है; यह वर्तमान सांसारिक जीवन-क्षेत्र को सूचित करती है।
- source_word: כִּי הוּא חֶלְקְךָ
  choice: क्योंकि ... यही तुम्हारा भाग है
  rationale: חֵלֶק किसी व्यक्ति को मिले या ठहराए गए हिस्से को दर्शाता है। ‘भाग’ हिन्दी में इस आवंटित हिस्से के रूपक को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: וּבַעֲמָלְךָ אֲשֶׁר אַתָּה עָמֵל
  choice: और उस परिश्रम में, जो तुम ... करते हो
  rationale: संज्ञा और उससे संबद्ध कृदंत की पुनरुक्ति हिन्दी में हूबहू रखने पर बोझिल होती। ‘परिश्रम ... करते हो’ श्रमसाध्य, निरंतर कार्य का भाव सुरक्षित रखता है।
theological_decisions:
- issue: נָתַן का अप्रकट कर्ता
  choice: मुख्य पाठ में ‘उसने’ रखा गया है।
  alternative: स्पष्टता के लिए ‘परमेश्वर ने’ जोड़ा जा सकता है।
  rationale: व्यापक संदर्भ में देने वाला परमेश्वर समझा जाता है, लेकिन इस उपवाक्य में उसका नाम स्पष्ट रूप से नहीं है। इसलिए मुख्य पाठ मूल की संयमित अभिव्यक्ति को सुरक्षित रखता है और पादटिप्पणी संदर्भ बताती है।
- issue: הֶבֶל का अर्थ
  choice: ‘क्षणभंगुर’
  alternative: ‘व्यर्थ’, ‘वाष्प-समान’ या ‘अर्थहीन’
  rationale: यहाँ जीवन की अल्पकालिक और अस्थिर प्रकृति प्रमुख है। ‘अर्थहीन’ कहने से सभोपदेशक की बहुअर्थी धर्मवैचारिक तनावपूर्ण भाषा अनावश्यक रूप से एक अर्थ में सीमित हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किंतु सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘पत्नी’, ‘क्षणभंगुर’, ‘परिश्रम’ और ‘भाग’ जैसे शब्द साहित्यिक गरिमा रखते हुए व्यापक रूप से बोधगम्य हैं। मूल की पुनरावृत्ति और ‘सूर्य के नीचे’ वाली विशिष्ट अभिव्यक्ति को बनाए रखा गया है।
