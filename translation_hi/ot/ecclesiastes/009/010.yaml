reference: Ecclesiastes 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֠ל אֲשֶׁ֨ר תִּמְצָ֧א יָֽדְ/ךָ֛ לַ/עֲשׂ֥וֹת בְּ/כֹחֲ/ךָ֖ עֲשֵׂ֑ה כִּי֩ אֵ֨ין מַעֲשֶׂ֤ה וְ/חֶשְׁבּוֹן֙ וְ/דַ֣עַת וְ/חָכְמָ֔ה בִּ/שְׁא֕וֹל אֲשֶׁ֥ר אַתָּ֖ה הֹלֵ֥ךְ שָֽׁמָּ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/010.yaml
  text: Whatever your hand finds to do, do it with your strength, for there is no work or planning or knowledge or wisdom in Sheol, where you are going.
translation:
  language: hi
  text: जो कुछ तुम्हारे हाथ में करने को आए, उसे अपनी शक्ति से करो, क्योंकि शिओल[a] में—जहाँ तुम जा रहे हो—न काम है, न योजना, न ज्ञान, न बुद्धि।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “मृतकों का लोक।” इब्रानी शब्द “शिओल” पुराने नियम में मृतकों के स्थान या अवस्था को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: यह अनिश्चित और व्यापक संबंधवाचक वाक्यांश है; ‘जो कुछ’ उसके समावेशी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: תִּמְצָא יָדְךָ
  choice: तुम्हारे हाथ को ... मिले
  rationale: ‘हाथ’ को बनाए रखने से उपलब्ध अवसर और व्यावहारिक सामर्थ्य का इब्रानी बिंब सुरक्षित रहता है।
- source_word: לַעֲשׂוֹת ... עֲשֵׂה
  choice: करने के लिए ... करो
  rationale: עשה का व्यापक अर्थ और आज्ञार्थक पुनरुक्ति दोनों स्पष्ट रूप से व्यक्त होते हैं।
- source_word: בְּכֹחֲךָ
  choice: अपनी पूरी शक्ति से
  rationale: यह उपलब्ध सामर्थ्य लगाकर कार्य करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है; ‘पूरी’ निहित समग्र प्रयत्न को स्पष्ट करती है, यद्यपि अलग से ‘सब’ शब्द मूल में नहीं है।
- source_word: מַעֲשֶׂה
  choice: काम
  rationale: संदर्भ में यह व्यावहारिक क्रिया या कार्य को दर्शाता है; ‘काम’ आधुनिक हिन्दी में सहज और व्यापक है।
- source_word: חֶשְׁבּוֹן
  choice: योजना
  rationale: यहाँ गणना, विचार या आयोजन के अर्थों में से ‘योजना’ प्रसंग और शब्द-श्रृंखला में सर्वाधिक स्वाभाविक है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: संज्ञानात्मक अर्थ का सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: सभोपदेशक के ज्ञानपरक संदर्भ में यह חָכְמָה का स्वाभाविक हिन्दी रूप है; ‘ज्ञान’ से इसका भेद भी बना रहता है।
- source_word: בִּשְׁאוֹל
  choice: अधोलोक
  rationale: ‘अधोलोक’ मृतकों के स्थान या अवस्था की पुरानी इब्रानी धारणा को ‘कब्र’ तक सीमित किए बिना हिन्दी में संक्षेप से व्यक्त करता है और ‘नरक’ जैसी बाद की विशिष्ट धारणा आरोपित नहीं करता।
- source_word: אֲשֶׁר אַתָּה הֹלֵךְ שָׁמָּה
  choice: जहाँ तुम जा रहे हो
  rationale: यह गंतव्य और इब्रानी कृदंत के जारी गति-भाव को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शिओल
  rationale: यह पद मृतकों की उस अवस्था या लोक की बात करता है जहाँ सांसारिक कार्य और विचार-विवेक नहीं रहते। ‘अधोलोक’ मूल अवधारणा की व्यापकता बनाए रखता है, जबकि पादटिप्पणी विकल्प स्पष्ट करती है और इसे ‘नरक’ के अर्थ में सीमित होने से रोकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल के ‘हाथ’ वाले बिंब को जानबूझकर बनाए रखा गया है; चार अनुपस्थित तत्वों की सूची को हिन्दी में स्पष्ट समानांतर संरचना दी गई है।
