review_pass:
  verdict: revise
  source_fidelity: 'The rendering follows the Hebrew structure and sense closely: the practical ‘hand’ idiom, imperative, rationale, fourfold list, and destination clause are retained. However, ‘पूरी’ (‘whole/full’) adds an explicit totalizing element not present in בְּכֹחֲךָ (‘with your strength/power’).'
  naturalness: The Hindi is generally clear and dignified. ‘तुम्हारे हाथ को ... मिले’ is understandable but somewhat less idiomatic than ‘तुम्हारे हाथ में ... आए’; the latter preserves the hand idiom while reading more naturally. ‘अधोलोक’ is intelligible but can suggest a cosmological underworld more specifically than the Hebrew term’s deliberately broad range.
  terminology: ‘काम,’ ‘योजना,’ ‘ज्ञान,’ and ‘बुद्धि’ appropriately distinguish the Hebrew terms in modern Hindi. Transliteration ‘शिओल’ best preserves the lexical and conceptual range of שְׁאוֹל, while an explanatory note can give ‘कब्र’ and ‘मृतकों का लोक’ as contextual alternatives without importing ‘नरक.’
  issues:
  - severity: medium
    issue: ‘अपनी पूरी शक्ति से’ adds ‘पूरी.’
    rationale: The Hebrew says ‘with your strength’ (בְּכֹחֲךָ) and does not explicitly say ‘with all/your whole strength.’ Removing ‘पूरी’ avoids adding emphasis not stated in the source.
  - severity: low
    issue: ‘तुम्हारे हाथ को करने के लिए मिले’ is slightly awkward modern Hindi.
    rationale: ‘तुम्हारे हाथ में करने को आए’ is more idiomatic while retaining the Hebrew image of the hand finding an available task.
  - severity: low
    issue: ‘अधोलोक’ may over-specify Sheol.
    rationale: Although it avoids ‘नरक,’ ‘अधोलोक’ can evoke a defined subterranean cosmology. ‘शिओल’ preserves the Hebrew term, with the note supplying accessible alternatives.
  revised_text: जो कुछ तुम्हारे हाथ में करने को आए, उसे अपनी शक्ति से करो, क्योंकि शिओल[a] में—जहाँ तुम जा रहे हो—न काम है, न योजना, न ज्ञान, न बुद्धि।
