- from: जो कुछ तुम्हारे हाथ को करने के लिए मिले, उसे अपनी पूरी शक्ति से करो, क्योंकि अधोलोक[a], जहाँ तुम जा रहे हो, वहाँ न कोई काम है, न योजना, न ज्ञान और न बुद्धि।
  to: जो कुछ तुम्हारे हाथ में करने को आए, उसे अपनी शक्ति से करो, क्योंकि शिओल[a] में—जहाँ तुम जा रहे हो—न काम है, न योजना, न ज्ञान, न बुद्धि।
  rationale: The revision removes the added intensifier ‘पूरी,’ improves the naturalness of the hand idiom, and transliterates שְׁאוֹל to preserve its semantic breadth. The em dashes make the final relative clause clearly modify ‘शिओल’ while retaining the source sequence and emphasis.
