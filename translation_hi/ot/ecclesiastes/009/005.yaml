  to: क्योंकि जीवित लोग जानते हैं कि वे मरेंगे, पर मरे हुए कुछ भी नहीं जानते[a]; और उनके लिए फिर कोई प्रतिफल नहीं है, क्योंकि उनका स्मरण भुला दिया गया है।
