source:
  edition: WLC
  text: כִּ֧י הַֽ/חַיִּ֛ים יוֹדְעִ֖ים שֶׁ/יָּמֻ֑תוּ וְ/הַ/מֵּתִ֞ים אֵינָ֧/ם יוֹדְעִ֣ים מְא֗וּמָה וְ/אֵֽין ע֤וֹד לָ/הֶם֙ שָׂכָ֔ר כִּ֥י נִשְׁכַּ֖ח זִכְרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/005.yaml
  text: For the living know that they will die[a], but the dead know nothing at all, and there is no longer any reward for them, because their memory is forgotten.
translation:
  language: hi
  text: क्योंकि जीवित लोग जानते हैं कि वे मरेंगे, पर मरे हुए कुछ भी नहीं जानते[a]; और उनके लिए फिर कोई प्रतिफल नहीं है, क्योंकि उनका स्मरण भुला दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “कोई भी बात नहीं जानते।” इब्रानी अभिव्यक्ति निषेध पर जोर देती है: “कुछ भी नहीं।”'
    reason: इब्रानी नकार के साथ מְאוּמָה के जोरदार अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחַיִּים
  choice: जीवित लोग
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में सभी जीवित मनुष्यों को सामूहिक रूप से दर्शाता है।
- source_word: יוֹדְעִים שֶׁיָּמֻתוּ
  choice: जानते हैं कि वे मरेंगे
  rationale: ידע का सीधा अर्थ ‘जानना’ है और अपूर्ण क्रिया יָמֻתוּ यहाँ भविष्य में होने वाली मृत्यु को व्यक्त करती है।
- source_word: וְהַמֵּתִים
  choice: पर मरे हुए
  rationale: वाव का संबंध यहाँ पिछले खंड के विपरीत है; ‘पर’ उस विरोध को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: אֵינָם יוֹדְעִים מְאוּמָה
  choice: कुछ भी नहीं जानते
  rationale: नकार के साथ מְאוּמָה का अर्थ ‘कुछ भी’ है; यह हिन्दी अभिव्यक्ति इब्रानी कथन के जोर को बनाए रखती है।
- source_word: וְאֵין עוֹד לָהֶם שָׂכָר
  choice: और अब उनके लिए कोई प्रतिफल नहीं है
  rationale: עוֹד यहाँ ‘अब और/अब’ तथा שָׂכָר ‘प्रतिफल, मेहनताना या पुरस्कार’ का भाव देता है; ‘प्रतिफल’ प्रसंग के लिए पर्याप्त व्यापक है।
- source_word: כִּי נִשְׁכַּח זִכְרָם
  choice: क्योंकि उनकी स्मृति भुला दी गई है
  rationale: निफ़अल נִשְׁכַּח के निष्क्रिय भाव और זִכְרָם के ‘उनकी स्मृति/उनका स्मरण’ अर्थ को बनाए रखता है।
theological_decisions:
- issue: क्या पद को मृतकों के सर्वथा अस्तित्वहीन या हर अर्थ में अचेत होने का व्यवस्थित सिद्धान्त बनाकर प्रस्तुत किया जाए
  choice: 'उपदेशक के कथन को उसके तीखे, सीधे रूप में रखा गया है: ‘मरे हुए कुछ भी नहीं जानते’ और उनके लिए अब कोई प्रतिफल नहीं है।'
  alternative: ‘सूरज के नीचे जो होता है, उसके विषय में मरे हुए कुछ नहीं जानते’ जैसी व्याख्यात्मक सीमा जोड़ना, अथवा अन्य बाइबलीय अंशों से सामंजस्य बैठाने के लिए कथन को नरम करना।
  rationale: इब्रानी पाठ ऐसी कोई सीमा स्पष्ट रूप से नहीं जोड़ता। अनुवाद को साहित्यिक और धर्मवैज्ञानिक तनाव बनाए रखना चाहिए, पर इस एक कथन को उसकी सीमा से आगे बढ़ाकर पूर्ण व्यवस्थित सिद्धान्त भी नहीं बनाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली अपनाई गई है। ‘मरे हुए’ सामान्य पाठक के लिए ‘मृतक’ से अधिक सहज है, जबकि ‘प्रतिफल’ שָׂכָר के व्यापक अर्थ को बनाए रखता है।
