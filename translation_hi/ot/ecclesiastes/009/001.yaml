reference: Ecclesiastes 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י אֶת כָּל זֶ֞ה נָתַ֤תִּי אֶל לִבִּ/י֙ וְ/לָ/ב֣וּר אֶת כָּל זֶ֔ה אֲשֶׁ֨ר הַ/צַּדִּיקִ֧ים וְ/הַ/חֲכָמִ֛ים וַ/עֲבָדֵי/הֶ֖ם בְּ/יַ֣ד הָ/אֱלֹהִ֑ים גַּֽם אַהֲבָ֣ה גַם שִׂנְאָ֗ה אֵ֤ין יוֹדֵ֨עַ֙ הָֽ/אָדָ֔ם הַ/כֹּ֖ל לִ/פְנֵי/הֶֽם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/001.yaml
  text: 'For I laid all this to my heart[a], even to examine all this: that the righteous and the wise and their works are in the hand of God. Whether love or hate, man does not know[b]; everything is before them.'
translation:
  language: hi
  text: 'क्योंकि मैंने इन सब बातों पर मन लगाया और इन सबकी जाँच की: धर्मी और बुद्धिमान तथा उनके काम[a] परमेश्वर के हाथ में हैं। प्रेम हो या घृणा, मनुष्य नहीं जानता[b]; सब कुछ उनके सामने है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी रूप को “उनके सेवक” भी पढ़ा जा सकता है; बहुत-से अनुवादक यहाँ इसका अर्थ “उनके काम” या “उनके कर्म” समझते हैं।
    reason: alternative_reading
  - marker: b
    text: अंतिम इब्रानी वाक्यांश कठिन है। इसका अर्थ यह हो सकता है कि मनुष्य पहले से नहीं जानता कि प्रेम या घृणा में से क्या उसके आगे है, या यह कि वर्तमान परिस्थितियों से पता नहीं चलता कि उससे प्रेम किया जाता है या घृणा।
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתִּי אֶל לִבִּי
  choice: मैंने … पर मन लगाया
  rationale: यह गंभीरतापूर्वक विचार करने का इब्रानी मुहावरा है। हिंदी में ‘मन लगाया’ मूल के हृदय/मन-रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וְלָבוּר
  choice: जाँच की
  rationale: यह मानसिक रूप से छानबीन और परीक्षण करने का भाव देता है; सभोपदेशक की विचारशील खोज के अनुरूप है।
- source_word: הַצַּדִּיקִים
  choice: धर्मी
  rationale: नैतिक और धार्मिक अर्थ को बनाए रखने वाला प्रचलित तथा सहज हिंदी शब्द।
- source_word: הַחֲכָמִים
  choice: बुद्धिमान
  rationale: ज्ञान-साहित्य के संदर्भ में व्यावहारिक और चिंतनशील बुद्धि, दोनों को समेटता है।
- source_word: וַעֲבָדֵיהֶם
  choice: उनके काम
  rationale: प्रसंग में धर्मियों और बुद्धिमानों के कर्मों/कार्यों का अर्थ सुसंगत है, यद्यपि मसोराई स्वरांकन ‘उनके सेवक’ पढ़ने की वास्तविक संभावना देता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: בְּיַד הָאֱלֹהִים
  choice: परमेश्वर के हाथ में
  rationale: मूल का सजीव रूपक बनाए रखता है और परमेश्वर के अधिकार, नियंत्रण तथा संरक्षण में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: גַּם אַהֲבָה גַם שִׂנְאָה
  choice: प्रेम हो या घृणा
  rationale: दो विपरीत संभावनाओं को व्यक्त करता है, जबकि यह निश्चित नहीं करता कि प्रेम और घृणा किसकी ओर से हैं।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन सामूहिक शब्द को स्वाभाविक हिंदी में मानव व्यक्ति के सामान्य संदर्भ के रूप में प्रस्तुत करता है।
- source_word: הַכֹּל לִפְנֵיהֶם
  choice: सब कुछ उनके सामने है
  rationale: कठिन और संक्षिप्त इब्रानी वाक्यांश के निकट रहता है तथा यह संभावना खुली रखता है कि सारी भावी स्थितियाँ उनके आगे पड़ी हैं।
theological_decisions:
- issue: וַעֲבָדֵיהֶם का अर्थ
  choice: उनके काम
  alternative: उनके सेवक
  rationale: प्रसंग धर्मियों और बुद्धिमानों तथा परमेश्वर के हाथ में उनकी स्थिति पर केंद्रित है; ‘काम’ विचार-प्रवाह में सहज बैठता है। फिर भी मसोराई पाठ का स्वरांकन ‘उनके सेवक’ का समर्थन करता है, इसलिए इस वास्तविक पाठगत/शाब्दिक संभावना को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: प्रेम और घृणा वाले अंतिम कथन का आशय
  choice: 'मुख्य पाठ को संक्षिप्त और खुला रखा गया है: मनुष्य नहीं जानता; सब कुछ उनके सामने है'
  alternative: मनुष्य पहले से नहीं जानता कि प्रेम या घृणा उसका इंतजार कर रही है; अथवा वर्तमान परिस्थितियों से नहीं जान सकता कि उससे प्रेम किया जाता है या घृणा
  rationale: इब्रानी कथन संकुचित और अस्पष्ट है। अनुवाद यह निर्धारित नहीं करता कि प्रेम/घृणा परमेश्वर की है, दूसरे मनुष्यों की है, या आगे आने वाला अनुभव है; संभावित आशयों को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘पर मन लगाया’, ‘जाँच की’ और ‘हाथ में’ जैसे रूप मूल के बिंबों को स्वाभाविक हिंदी में रखते हैं। कठिन अंतिम उपवाक्य को जानबूझकर पूरी तरह स्पष्ट नहीं किया गया, ताकि मूल की वास्तविक अस्पष्टता बनी रहे।
