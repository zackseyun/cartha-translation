id: ECC.9.6
reference: Ecclesiastes 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם אַהֲבָתָ֧/ם גַּם שִׂנְאָתָ֛/ם גַּם קִנְאָתָ֖/ם כְּבָ֣ר אָבָ֑דָה וְ/חֵ֨לֶק אֵין לָ/הֶ֥ם עוֹד֙ לְ/עוֹלָ֔ם בְּ/כֹ֥ל אֲשֶֽׁר נַעֲשָׂ֖ה תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/006.yaml
  text: Their love[a], their hatred, and their jealousy have already perished, and they no longer have a share forever in anything that is done under the sun.
translation:
  language: hi
  text: उनका प्रेम भी, उनकी घृणा भी और उनकी ईर्ष्या[a] भी पहले ही मिट चुके हैं। सूर्य के नीचे जो कुछ किया जाता है, उसमें अब फिर कभी उनका कोई हिस्सा नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनका जोश’ अथवा ‘उनकी जलन।’
    reason: इब्रानी קִנְאָה प्रसंग के अनुसार ईर्ष्या, जलन या उत्साह/जोश का अर्थ दे सकता है।
lexical_decisions:
- source_word: גַּם ... גַּם ... גַּם
  choice: भी ... भी ... भी
  rationale: तीन बार आए גַּם की संचयी और बलात्मक शैली को स्वाभाविक हिन्दी में प्रत्येक संज्ञा के साथ ‘भी’ दोहराकर सुरक्षित रखा गया है।
- source_word: אַהֲבָתָם
  choice: उनका प्रेम
  rationale: यह 3 पुं. बहु. प्रत्यय वाली संज्ञा का सीधा और स्वाभाविक अनुवाद है।
- source_word: שִׂנְאָתָם
  choice: उनकी घृणा
  rationale: ‘घृणा’ अमूर्त संज्ञा के रूप को बनाए रखती है और ‘प्रेम’ तथा ‘ईर्ष्या’ के साथ शैलीगत समानता रखती है।
- source_word: קִנְאָתָם
  choice: उनकी ईर्ष्या
  rationale: קִנְאָה ईर्ष्या, जलन या उत्साह/जोश का भाव व्यक्त कर सकता है। यहाँ प्रेम और घृणा जैसी मानवीय भावनाओं के साथ ‘ईर्ष्या’ प्रसंगानुकूल और सामान्य हिन्दी है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: כְּבָר אָבָדָה
  choice: पहले ही मिट चुके हैं
  rationale: כְּבָר पूर्व में पूर्ण हो चुकी दशा बताता है और אבד के नष्ट हो जाने के भाव को ‘मिट चुके हैं’ सहज हिन्दी में व्यक्त करता है। इब्रानी में क्रिया स्त्रीलिंग एकवचन है, जो पूरी त्रयी को सामूहिक रूप से देखती है; हिन्दी में संयुक्त कर्ता के साथ बहुवचन स्वाभाविक है।
- source_word: וְחֵלֶק אֵין לָהֶם עוֹד לְעוֹלָם
  choice: अब फिर कभी उनका कोई हिस्सा नहीं होगा
  rationale: ‘हिस्सा’ सभोपदेशक में חֵלֶק के जीवन और कार्यों में भाग या अंश के अर्थ को स्पष्ट करता है। ‘अब फिर कभी ... नहीं’ עוֹד और לְעוֹלָם की स्थायी समाप्ति को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה
  choice: जो कुछ किया जाता है, उसमें
  rationale: यह व्यापकता और נַעֲשָׂה के कर्मवाच्य भाव दोनों को बनाए रखता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक का प्रमुख मुहावरा है, जो सांसारिक जीवन और गतिविधियों के क्षेत्र को दर्शाता है; इसका पारंपरिक शाब्दिक रूप हिन्दी में भी स्पष्ट है।
theological_decisions:
- issue: मृतकों का पृथ्वी के कार्यों से संबंध
  choice: कथन को ‘सूर्य के नीचे’ किए जाने वाले कार्यों में मृतकों की आगे कोई भागीदारी न होने तक सीमित रखा गया है।
  alternative: इसे मृतकों की हर अर्थ में पूर्ण अचेतनता के बारे में व्यापक तत्त्वमीमांसात्मक कथन मानना।
  rationale: पद में स्वयं उपस्थित ‘सूर्य के नीचे’ कथन की सीमा निर्धारित करता है। अनुवाद उस सीमा को बनाए रखता है और मृत्यु के बाद की अवस्था के विषय में कोई अतिरिक्त सैद्धांतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भी ... भी ... भी’ मूल की पुनरावृत्ति और बल को बनाए रखता है, जबकि ‘अब फिर कभी’ स्थायी रूप से भाग समाप्त होने का भाव सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
