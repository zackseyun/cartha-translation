base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/009/003.yaml
  text: 'This is the evil in all that is done under the sun: that one fate comes to all[a]. Also, the heart of the sons of man is full of evil, and madness is in their hearts during their lives—and afterward[c][b], they go to the dead.'
translation:
  language: hi
  text: 'सूरज के नीचे जो कुछ किया जाता है, उसमें यह बुराई है: सबके साथ एक ही घटना घटती है।[a] मनुष्यों का हृदय भी बुराई से भरा है, और जब तक वे जीवित रहते हैं, उनके हृदय में पागलपन रहता है—और उसके बाद वे मरे हुओं के पास जाते हैं।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सबकी एक ही नियति है।” इब्रानी शब्द का अर्थ वह घटना या नियति हो सकता है जो किसी पर आती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अंतिम वाक्य अचानक और संक्षिप्त है; शाब्दिक रूप से, “और उसके बाद—मरे हुओं के पास।” यहाँ “जाते हैं” अर्थ में निहित है।
    reason: source_ambiguity
lexical_decisions:
- source_word: זֶה רָע
  choice: इसमें यह बुराई है
  rationale: प्रदर्शक और विशेषण के मुहावरेदार प्रयोग को संदर्भ की किसी विशेष दुःखद बुराई के रूप में व्यक्त करता है।
- source_word: בְּכֹל אֲשֶׁר נַעֲשָׂה תַּחַת הַשֶּׁמֶשׁ
  choice: सूरज के नीचे जो कुछ किया जाता है
  rationale: सभोपदेशक के विशिष्ट सूत्र ‘सूरज के नीचे’ और इब्रानी के कर्मवाच्य भाव को बनाए रखता है।
- source_word: כִּי מִקְרֶה אֶחָד לַכֹּל
  choice: सबका एक ही अंजाम होता है
  rationale: מִקְרֶה यहाँ सब पर घटने वाले समान परिणाम या नियति की ओर संकेत करता है; ‘अंजाम’ मृत्यु-संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לֵב בְּנֵי הָאָדָם
  choice: मनुष्यों का हृदय
  rationale: בְּנֵי הָאָדָם समस्त मानवजाति के लिए प्रतिनिधिक अभिव्यक्ति है। हिंदी में ‘मनुष्यों का हृदय’ उसके सामूहिक एकवचन और मानवीय व्यापकता दोनों को सहज रूप में रखता है।
- source_word: מָלֵא רָע
  choice: बुराई से भरा है
  rationale: नैतिक बुराई और हानिकारक प्रवृत्ति दोनों को बिना अनावश्यक संकीर्णता के व्यक्त करता है।
- source_word: וְהוֹלֵלוֹת בִּלְבָבָם
  choice: उनके हृदय में पागलपन रहता है
  rationale: הוֹלֵלוֹת की विवेकहीन और उन्मत्त प्रवृत्ति को ‘पागलपन’ व्यक्त करता है तथा हृदय की इब्रानी छवि बनाए रखता है।
- source_word: בְּחַיֵּיהֶם
  choice: जब तक वे जीवित रहते हैं
  rationale: जीवनकाल के समयवाचक भाव को स्पष्ट, स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְאַחֲרָיו אֶל הַמֵּתִים
  choice: और उसके बाद वे मरे हुओं के पास जाते हैं
  rationale: मूल की आकस्मिक और क्रियारहित अभिव्यक्ति को समझने योग्य हिंदी बनाने के लिए निहित गति-क्रिया जोड़ी गई है; ‘उसके बाद’ प्रत्यय की हल्की संदर्भगत अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: בְּנֵי הָאָדָם का मानवशास्त्रीय और लिंग-संबंधी अर्थ
  choice: मनुष्यों का हृदय
  alternative: मनुष्य के पुत्रों का हृदय
  rationale: यह पद केवल पुरुषों को नहीं, सामान्यतः मानवजाति को दर्शाता है। हिंदी में शाब्दिक ‘मनुष्य के पुत्र’ अर्थ को भटका सकता है; ‘मनुष्यों’ से सामूहिक मानवीय संदर्भ सुरक्षित रहता है।
- issue: מִקְרֶה का अर्थ
  choice: एक ही अंजाम
  alternative: एक ही घटना / एक ही नियति
  rationale: निकट संदर्भ में साझा अंजाम मृत्यु है, पर शब्द का अर्थ केवल दार्शनिक नियतिवाद नहीं है; इसलिए वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिया गया है।
- issue: अंतिम खंड की अपूर्णता
  choice: वे मरे हुओं के पास जाते हैं
  alternative: उसके बाद—मरे हुओं के पास
  rationale: इब्रानी में क्रिया निहित है और वाक्य आकस्मिक है। हिंदी में अर्थबोध के लिए ‘जाते हैं’ जोड़ा गया है, बिना मृत्योत्तर अवस्था का अतिरिक्त सिद्धांत आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘सूरज के नीचे’ पुस्तक की बार-बार आने वाली ठोस अभिव्यक्ति को बनाए रखता है। मुख्य पाठ में अनावश्यक शाब्दिक कठोरता से बचते हुए मूल की सामूहिक मानव-दृष्टि, नैतिक तीव्रता और अंतिम खंड की हल्की अस्पष्टता सुरक्षित रखी गई है।
