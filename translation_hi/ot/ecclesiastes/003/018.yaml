source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י עַל דִּבְרַת֙ בְּנֵ֣י הָ/אָדָ֔ם לְ/בָרָ֖/ם הָ/אֱלֹהִ֑ים וְ/לִ/רְא֕וֹת שְׁ/הֶם בְּהֵמָ֥ה הֵ֖מָּה לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/018.yaml
  text: I said in my heart concerning the sons of man, that God is testing them, and to show them that they themselves are beasts.
translation:
  language: hi
  text: मैंने मनुष्य के पुत्रों[a] के विषय में अपने मन में कहा कि परमेश्वर उन्हें परखता है, ताकि वे देख सकें कि वे स्वयं पशु हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्यों।” इब्रानी में शाब्दिक रूप से “मनुष्य के पुत्रों” है; यह पुल्लिंग अभिव्यक्ति प्रतिनिधिक अर्थ में सभी मनुष्यों को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “और देखने के लिए” है। इसे “ताकि वे देख सकें,” “ताकि वह उन्हें दिखाए,” या “और यह देखने के लिए कि वे स्वयं पशु हैं” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: मैंने अपने मन में कहा
  rationale: यह इब्रानी मुहावरा भीतर किए गए विचार को व्यक्त करता है। ‘अपने मन में’ स्रोत के हृदय/अंतर के बिंब को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: עַל דִּבְרַת
  choice: के विषय में
  rationale: यह पद उस विषय का परिचय देता है जिस पर सभोपदेशक विचार कर रहा है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: בְּנֵי הָאָדָם
  choice: मनुष्य के पुत्रों
  rationale: यह इब्रानी की पुल्लिंग अभिव्यक्ति और उसके समस्त मानवजाति को सूचित करने वाले प्रतिनिधिक बल को बनाए रखता है। अधिक स्वाभाविक समावेशी अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְבָרָם
  choice: परमेश्वर उन्हें परखता है
  rationale: यह कठिन रूप यहाँ जाँचने, परखने या कसौटी पर रखने के अर्थ में समझा गया है। ‘परखता है’ आधुनिक हिन्दी में स्पष्ट है और शोधन या छाँटने का अनावश्यक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: וְלִרְאוֹת
  choice: ताकि वे देख सकें
  rationale: शाब्दिक रूप ‘और देखने के लिए’ है। प्रसंग में इसे मनुष्यों के अपनी दशा पहचानने के प्रयोजन/परिणाम के रूप में प्रस्तुत किया गया है; अन्य संभव व्याकरणिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: שֶׁהֵם בְּהֵמָה הֵמָּה לָהֶם
  choice: कि वे स्वयं पशु हैं
  rationale: दोहराया हुआ सर्वनाम कथन पर बल देता है, जिसे ‘स्वयं’ व्यक्त करता है। इब्रानी सीधा विधेय-वाक्य कहता है, केवल ‘पशुओं के समान’ नहीं; इसलिए उसकी कठोरता और धर्मवैचारिक तनाव बनाए रखा गया है।
theological_decisions:
- issue: मनुष्यों और पशुओं के बीच कथन का मानवशास्त्रीय बल
  choice: मनुष्यों को मृत्यु और सांसारिक दशा के संदर्भ में सीधे ‘पशु’ कहा गया है
  alternative: वे पशुओं के समान हैं
  rationale: इब्रानी में तुलना-सूचक शब्द नहीं है। ‘समान’ जोड़ने से कथन नरम पड़ जाता और सभोपदेशक द्वारा साझा नश्वरता तथा प्राणी-दशा पर दिया गया जोर घट जाता।
- issue: בְּנֵי הָאָדָם की लिंग-सूचक अभिव्यक्ति
  choice: मनुष्य के पुत्रों
  alternative: मनुष्यों; मानवजाति
  rationale: मुख्य पाठ स्रोत की पुल्लिंग, प्रतिनिधिक रचना को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि अभिप्राय सामान्यतः सभी मनुष्य हैं।
- issue: וְלִרְאוֹת का कर्ता और वाच्य
  choice: ताकि वे देख सकें
  alternative: और देखने के लिए; ताकि परमेश्वर उन्हें दिखाए
  rationale: इब्रानी अनिश्चितता की अनुमति देता है। मुख्य पाठ इसे मनुष्यों द्वारा अपनी दशा देखने के रूप में पढ़ता है, पर पादटिप्पणी शाब्दिक रूप और कारक अर्थ वाली वैकल्पिक समझ दोनों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध शैली रखी गई है। ‘मनुष्य के पुत्रों’ स्रोत-रूप को जानबूझकर सुरक्षित रखता है; कठिन वाक्यांश וְלִרְאוֹת की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
