  text: עֵ֤ת לִ/בְכּוֹת֙ וְ/עֵ֣ת לִ/שְׂח֔וֹק עֵ֥ת סְפ֖וֹד וְ/עֵ֥ת רְקֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/004.yaml
  text: A time to weep[a], and a time to laugh; a time to mourn[b], and a time to dance.
translation:
  language: hi
  text: रोने का समय[a], और हँसने का समय; विलाप करने का समय[b], और नाचने का समय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पूरे पद में ‘समय’ के स्थान पर ‘अवसर’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विलाप करने’ का अनुवाद ‘शोक मनाने’ भी किया जा सकता है, विशेषकर मृत्यु के प्रसंग में।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: समय
  rationale: עֵת किसी समय, अवसर या उपयुक्त काल को दर्शाता है। ‘समय’ आधुनिक हिन्दी में सीधा, स्वाभाविक और पद की आवर्ती काव्यात्मक संरचना के अनुकूल है।
- source_word: לִבְכּוֹת
  choice: रोने का
  rationale: בכה का अर्थ रोना है। ‘रोने का समय’ सहज हिन्दी है और ‘हँसने’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: לִשְׂחוֹק
  choice: हँसने का
  rationale: שׂחק का यहाँ सीधा अर्थ हँसना है; यह रोने के विपरीत भाव को ठीक प्रकार व्यक्त करता है।
- source_word: סְפוֹד
  choice: विलाप करने का
  rationale: ספד शोक में विलाप करने, विशेषकर मृत्यु-संबंधी मातम, को व्यक्त कर सकता है। ‘विलाप करने’ से इसकी विशिष्ट शोकपूर्ण तीव्रता बनी रहती है।
- source_word: רְקוֹד
  choice: नाचने का
  rationale: רקד का अर्थ नाचना है। ‘नाचने का समय’ स्वाभाविक है और विलाप के साथ काव्यात्मक विरोध को सुरक्षित रखता है।
