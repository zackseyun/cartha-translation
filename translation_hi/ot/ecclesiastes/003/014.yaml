source:
  edition: WLC
  text: יָדַ֗עְתִּי כִּ֠י כָּל אֲשֶׁ֨ר יַעֲשֶׂ֤ה הָ/אֱלֹהִים֙ ה֚וּא יִהְיֶ֣ה לְ/עוֹלָ֔ם עָלָי/ו֙ אֵ֣ין לְ/הוֹסִ֔יף וּ/מִמֶּ֖/נּוּ אֵ֣ין לִ/גְרֹ֑עַ וְ/הָ/אֱלֹהִ֣ים עָשָׂ֔ה שֶׁ/יִּֽרְא֖וּ מִ/לְּ/פָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/014.yaml
  text: I know that whatever God does will endure forever; there is nothing to add to it[a], and there is nothing to take from it. God has done it so that they may fear before him.
translation:
  language: hi
  text: मैं जानता हूँ कि परमेश्वर जो कुछ करता है, वह सदा बना रहेगा। उसमें कुछ जोड़ा नहीं जा सकता और उसमें से कुछ घटाया नहीं जा सकता। परमेश्वर ने यह इसलिए किया है कि लोग उसके सामने भय मानें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सामने विस्मय और श्रद्धा में रहें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: काल में पूर्ण क्रिया वक्ता की स्थिर अनुभूति बताती है; वर्तमान हिन्दी में ‘मैं जानता हूँ’ उसके परिणामी ज्ञान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל אֲשֶׁר יַעֲשֶׂה הָאֱלֹהִים
  choice: परमेश्वर जो कुछ करता है
  rationale: כָּל + אֲשֶׁר का सार्वभौमिक भाव बना रहता है और हिन्दी में यह सहज है।
- source_word: הוּא יִהְיֶה לְעוֹלָם
  choice: वह सदा बना रहेगा
  rationale: सर्वनाम परमेश्वर के किए हुए काम की ओर लौटता है; ‘सदा बना रहेगा’ स्थायित्व के भाव को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: עָלָיו אֵין לְהוֹסִיף
  choice: उसमें न कुछ जोड़ा जा सकता है
  rationale: इब्रानी मुहावरा जोड़ने की असम्भवता व्यक्त करता है; कर्मवाच्य हिन्दी में यह अर्थ स्पष्ट है।
- source_word: וּמִמֶּנּוּ אֵין לִגְרֹעַ
  choice: न उसमें से कुछ घटाया जा सकता है
  rationale: גרע का अर्थ घटाना या कम करना है; यह पिछले वाक्यांश के साथ समानान्तरता भी बनाए रखता है।
- source_word: וְהָאֱלֹהִים עָשָׂה
  choice: परमेश्वर ने ऐसा ... किया है
  rationale: पूर्ण क्रिया सम्पन्न कार्य और उसके वर्तमान परिणाम को दर्शाती है; ‘ऐसा किया है’ अगले उद्देश्यवाचक उपवाक्य से सहजता से जुड़ता है।
- source_word: שֶׁיִּרְאוּ
  choice: कि लोग ... भय मानें
  rationale: יִרְאוּ का कर्ता अनिर्दिष्ट बहुवचन है, जिसे हिन्दी में ‘लोग’ स्वाभाविक रूप से व्यक्त करता है। ‘भय मानें’ डर के साथ श्रद्धा और आदर की सम्भावना को भी खुला रखता है।
- source_word: מִלְּפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक अर्थ ‘उसके मुख के सामने से’ है; प्रसंग में ‘उसके सामने’ परमेश्वर की उपस्थिति में होने का स्वाभाविक हिन्दी मुहावरा है।
theological_decisions:
- issue: परमेश्वर का भय मानने का अर्थ
  choice: मुख्य पाठ में ‘भय मानें’
  alternative: ‘श्रद्धा से विस्मित रहें’ या ‘उसका आदर करें’
  rationale: इब्रानी ירא में भय, श्रद्धा और विस्मय जुड़े हैं। ‘भय मानें’ मूल शब्द का भार और सभोपदेशक की धर्मवैचारिक तान बनाए रखता है; पादटिप्पणी अधिक कोमल सम्भावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमेश्वर’ और ‘भय मानें’ बाइबलीय स्वर बनाए रखते हैं, जबकि वाक्य-संरचना स्वाभाविक हिन्दी में है।
