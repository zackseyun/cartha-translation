  text: a time to tear[a], and a time to sew; a time to keep silent, and a time to speak[b];
translation:
  language: hi
  text: 'फाड़ने का समय[a], और सीने का समय;

    चुप रहने का समय, और बोलने का समय[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फाड़ने’ से शायद शोक, सदमे या मातम के चिह्न के रूप में वस्त्र फाड़ने की प्रथा की ओर संकेत हो, हालाँकि इब्रानी पाठ में यह नहीं बताया गया कि क्या फाड़ना है।
    reason: cultural_note
  - marker: b
    text: या ‘मौन रहने का समय।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: समय
  rationale: यह शब्द किसी समय-बिंदु या समय-अवधि को दर्शाता है। ‘समय’ स्वाभाविक हिन्दी है और पद की दोहरावपूर्ण काव्य-लय बनाए रखता है।
- source_word: לִקְרוֹעַ
  choice: फाड़ने
  rationale: क्रिया का मूल अर्थ ‘फाड़ना’ है और प्रायः वस्त्र फाड़ने के लिए प्रयुक्त होती है। कर्म को अनकहा रखकर हिन्दी अनुवाद इब्रानी की संभावित शोक-संबंधी ओर-संकेत को बिना अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: לִתְפּוֹר
  choice: सीने
  rationale: इस क्रिया का सीधा अर्थ ‘सीना’ है। यह ‘फाड़ने’ के साथ संक्षिप्त और स्पष्ट विरोध बनाता है; ‘मरम्मत करने’ से अधिक अर्थ जोड़ जाता।
- source_word: לַחֲשׁוֹת
  choice: चुप रहने
  rationale: क्रिया का अर्थ चुप होना या चुप रहना है। ‘चुप रहने’ से प्रसंगानुकूल संयम का भाव आता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְדַבֵּר
  choice: बोलने
  rationale: यह ‘बोलना’ की सामान्य क्रिया है। ‘बोलने’ का चयन चुप्पी के साथ सीधा विरोध और पद का गरिमापूर्ण, सहज स्वर बनाए रखता है।
