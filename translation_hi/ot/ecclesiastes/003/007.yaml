translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। प्रत्येक खंड में ‘समय’ दोहराकर मूल की लय रखी गई है; अव्यक्त कर्म और मौन संबंधी हल्की अर्थ-भिन्नता को पादटिप्पणियों में सुरक्षित रखा गया है।
