base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/001.yaml
  text: For everything there is a season[a], and a time for every matter under the heavens.
translation:
  language: hi
  text: हर बात का एक नियत समय है, और आकाश के नीचे हर काम[a] का एक समय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर विषय” अथवा “हर प्रयोजन”; इब्रानी शब्द חֵפֶץ का अर्थ काम, विषय या प्रयोजन हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכֹּל
  choice: हर बात का
  rationale: לְ + כֹּל का व्यापक अर्थ यहाँ ‘हर बात/हर चीज़ के लिए’ है। स्वाभाविक हिन्दी में संबंधसूचक ‘हर बात का’ अगले पद ‘एक निश्चित समय है’ के साथ सहज बैठता है।
- source_word: זְמָן
  choice: एक निश्चित समय
  rationale: זְמָן किसी नियत, उपयुक्त या निर्धारित अवसर को सूचित करता है। ‘निश्चित समय’ इसे अगले सामान्य עֵת से अलग रखते हुए अनावश्यक रूप से कठोर पूर्वनियति नहीं जोड़ता।
- source_word: וְעֵת
  choice: और ... एक समय
  rationale: עֵת सामान्यतः ‘समय’ या ‘अवसर’ है। हिन्दी वाक्य में ‘एक समय’ निकट-समानार्थी काव्यात्मक समानांतरता बनाए रखता है।
- source_word: לְכָל חֵפֶץ
  choice: हर कार्य का
  rationale: חֵפֶץ का अर्थ इच्छा, विषय, प्रयोजन या गतिविधि हो सकता है। आगे 3:2–8 में मानवीय क्रियाओं और घटनाओं की सूची को देखते हुए ‘कार्य’ व्यापक और स्वाभाविक है, पर इसकी अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: תַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे
  rationale: यह सभोपदेशक की पृथ्वी पर मानव जीवन के क्षेत्र को सूचित करने वाली विशिष्ट अभिव्यक्ति है। हिन्दी में ‘आकाश के नीचे’ स्वाभाविक है और मूल बहुवचन रूप को हिन्दी की प्रचलित संख्या-प्रयोग के अनुसार व्यक्त करता है।
theological_decisions:
- issue: क्या חֵפֶץ को ‘उद्देश्य’ कहकर प्रत्येक घटना में स्पष्ट प्रयोजन या प्रबल विधानीय आशय व्यक्त किया जाए
  choice: मुख्य पाठ में ‘कार्य’
  alternative: ‘उद्देश्य’ या ‘प्रयोजन’
  rationale: इस संदर्भ में शब्द गतिविधि, मामला अथवा प्रयोजन को सूचित कर सकता है। ‘कार्य’ मूल की व्यापकता बनाए रखता है और पद में उससे अधिक प्रयोजनवाद नहीं जोड़ता जितना स्वयं शब्द निश्चित रूप से कहता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। ‘निश्चित समय’ और ‘समय’ से זְמָן तथा עֵת का सूक्ष्म अंतर रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
