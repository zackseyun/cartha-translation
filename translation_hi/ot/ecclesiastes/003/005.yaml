source:
  edition: WLC
  text: עֵ֚ת לְ/הַשְׁלִ֣יךְ אֲבָנִ֔ים וְ/עֵ֖ת כְּנ֣וֹס אֲבָנִ֑ים עֵ֣ת לַ/חֲב֔וֹק וְ/עֵ֖ת לִ/רְחֹ֥ק מֵ/חַבֵּֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/005.yaml
  text: A time to throw stones[a], and a time to gather stones; a time to embrace, and a time to refrain from embracing.
translation:
  language: hi
  text: पत्थर फेंकने का समय[a], और पत्थर इकट्ठे करने का समय; गले लगाने का समय, और गले लगाने से दूर रहने का समय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘पत्थर डालने का समय, और पत्थर बटोरने का समय’ भी कहा जा सकता है। इब्रानी बिंब का शाब्दिक अर्थ लिया जा सकता है, हालाँकि कुछ व्याख्याकार इसे मानवीय संबंधों, खेती या युद्ध के रूपक के रूप में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: समय
  rationale: यह शब्द किसी समय-बिंदु या समयावधि को दर्शाता है। कविता की दोहराई गई संरचना में ‘समय’ स्वाभाविक और सुसंगत है।
- source_word: לְהַשְׁלִיךְ
  choice: फेंकने
  rationale: हिफ़ील infinitive का मूल अर्थ ‘फेंकना’ है; यह आधुनिक हिन्दी में स्पष्ट है और ठोस बिंब को बनाए रखता है।
- source_word: אֲבָנִים
  choice: पत्थर
  rationale: אֶבֶן का सामान्य अर्थ ‘पत्थर’ है; इससे इब्रानी का मूल बिंब सुरक्षित रहता है।
- source_word: כְּנוֹס
  choice: इकट्ठे करने
  rationale: यह infinitive इकट्ठा या संग्रह करने को व्यक्त करता है और ‘पत्थर फेंकने’ के साथ संक्षिप्त काव्यात्मक समानांतर बनाता है।
- source_word: לַחֲבוֹק
  choice: गले लगाने
  rationale: חבק का अर्थ आलिंगन करना है। ‘गले लगाना’ आधुनिक साधारण हिन्दी में स्वाभाविक है और शाब्दिक तथा संबंधपरक दोनों अर्थों के लिए पर्याप्त व्यापक है।
- source_word: לִרְחֹק מֵחַבֵּק
  choice: गले लगाने से दूर रहने
  rationale: רחק का अर्थ दूर रहना है, और מן के साथ यह गले लगाने के कार्य से दूरी बनाए रखने को व्यक्त करता है। यह अनुवाद इब्रानी की ‘दूर’ वाली छवि को बचाते हुए स्पष्ट हिन्दी देता है।
theological_decisions:
- issue: पत्थर फेंकने और इकट्ठे करने के बिंब की व्याख्या
  choice: बिंब को शाब्दिक और अनिर्दिष्ट रखा गया
  alternative: इसे मानवीय संबंधों, खेती या युद्ध के किसी विशेष रूपक के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ स्वयं बिंब का आशय निर्धारित नहीं करता; किसी एक व्याख्या को मुख्य पाठ में रखना मूल अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; उपदेशक 3 की समानांतर काव्यात्मक संरचना बनाए रखने के लिए प्रत्येक खंड में ‘का समय’ दोहराया गया है। ‘आलिंगन’ की अपेक्षा ‘गले लगाना’ आम पाठक के लिए अधिक स्वाभाविक है, जबकि भाव की गरिमा बनी रहती है।
