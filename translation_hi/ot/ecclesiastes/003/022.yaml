id: ECC.3.22
reference: Ecclesiastes 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רָאִ֗יתִי כִּ֣י אֵ֥ין טוֹב֙ מֵ/אֲשֶׁ֨ר יִשְׂמַ֤ח הָ/אָדָם֙ בְּֽ/מַעֲשָׂ֔י/ו כִּי ה֖וּא חֶלְק֑/וֹ כִּ֣י מִ֤י יְבִיאֶ֨/נּוּ֙ לִ/רְא֔וֹת בְּ/מֶ֖ה שֶׁ/יִּהְיֶ֥ה אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/022.yaml
  text: So I saw that there is nothing better than that a man should rejoice in his works[a], for that is his portion. For who can bring him to see what will be after him?
translation:
  language: hi
  text: इसलिए मैंने देखा कि मनुष्य के लिए इससे अच्छा और कुछ नहीं कि वह अपने कामों में आनन्द करे, क्योंकि यही उसका भाग है। भला कौन उसे यह देखने के लिए ले आ सकता है कि उसके बाद क्या होगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चले जाने के बाद क्या होगा?”
    reason: मूल के ‘उसके बाद’ का आशय उसके जीवन के बाद का समय भी हो सकता है; यह अधिक स्पष्ट वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: इसलिए मैंने देखा
  rationale: यह प्रथम पुरुष एकवचन क्रिया उपदेशक के निष्कर्षात्मक अवलोकन को प्रस्तुत करती है; ‘इसलिए’ प्रसंग में इसके निष्कर्षसूचक बल को व्यक्त करता है।
- source_word: אֵין טוֹב מֵאֲשֶׁר
  choice: इससे अच्छा और कुछ नहीं कि
  rationale: यह सभोपदेशक में तुलनात्मक मूल्यांकन का मुहावरा है, न कि नैतिक भलाई के पूर्ण अभाव का कथन।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם प्रतिनिधिक, सामान्य एकवचन है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और समस्त मानवजाति पर लागू सामान्य अर्थ बनाए रखता है।
- source_word: יִשְׂמַח
  choice: आनन्दित हो
  rationale: अपूर्ण क्रिया यहाँ उस बात की विषयवस्तु बताती है जिसे बेहतर कहा गया है; यह रूप मूल्यांकन व्यक्त करता है, सीधी आज्ञा नहीं।
- source_word: בְּמַעֲשָׂיו
  choice: अपने कामों में
  rationale: מַעֲשֶׂה काम, कार्य या गतिविधि के व्यापक क्षेत्र को दर्शाता है; बहुवचन ‘कामों’ मूल के रूप और व्यापकता को बनाए रखता है।
- source_word: חֶלְקוֹ
  choice: उसका भाग
  rationale: सभोपदेशक में חֵלֶק जीवन में किसी को मिले या ठहराए गए हिस्से को दर्शाता है; ‘भाग’ इस आवर्ती भाव को संक्षेप में सुरक्षित रखता है।
- source_word: מִי יְבִיאֶנּוּ
  choice: कौन उसे ... ला सकता है
  rationale: בוא का हिफ़ील रूप ‘ले आना’ है; आलंकारिक प्रश्न मानवीय असमर्थता का संकेत देता है, जिसे ‘ला सकता है’ व्यक्त करता है।
- source_word: לִרְאוֹת
  choice: देखने के लिए
  rationale: शाब्दिक ‘देखना’ रखा गया है; प्रसंग में इसका अर्थ जानना या अनुभव करना भी हो सकता है, पर मूल की सजीव अभिव्यक्ति को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: בְּמֶה שֶׁיִּהְיֶה אַחֲרָיו
  choice: कि उसके बाद क्या होगा
  rationale: यह मूल के ‘उसके बाद जो होगा’ को स्वाभाविक हिन्दी में व्यक्त करता है और इस बात को खुला रखता है कि संकेत उसके जीवन के बाद की घटनाओं की ओर है या सामान्यतः उसके बाद आने वाली बातों की ओर।
theological_decisions:
- issue: सामान्य एकवचन אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदमी / मानवजाति
  rationale: ‘मनुष्य’ हिन्दी में व्याकरणतः एकवचन और प्रतिनिधिक है, इसलिए मूल की सामान्य मानवीय व्याप्ति को बनाए रखता है; ‘मानवजाति’ एकवचन व्यक्ति की छवि को मिटा देता, जबकि ‘आदमी’ अपेक्षाकृत बोलचाल का और पुरुष-विशेष समझा जा सकता है।
- issue: אַחֲרָיו की कालगत और मरणोत्तर अस्पष्टता
  choice: उसके बाद
  alternative: उसके चले जाने के बाद
  rationale: मुख्य पाठ में ‘उसके बाद’ मूल की व्यापकता और अस्पष्टता बनाए रखता है; अधिक स्पष्ट मरणोत्तर अर्थ को पादटिप्पणी में दिया गया है, ताकि पाठ किसी एक व्याख्या को अनिवार्य न बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आनन्दित हो’ और ‘उसका भाग’ सभोपदेशक की चिंतनशील शैली तथा प्रमुख विषयगत शब्दावली को बनाए रखते हैं।
