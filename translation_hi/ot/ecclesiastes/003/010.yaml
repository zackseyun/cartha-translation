base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/010.yaml
  text: I have seen the task that God has given to the sons of man to be occupied with[a].
translation:
  language: hi
  text: मैंने उस काम को देखा है, जिसे परमेश्वर ने मनुष्यों को उसमें लगे रहने के लिए दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिससे वे कष्ट पाएँ,” अथवा “जिसमें वे परिश्रम करें।” इब्रानी अभिव्यक्ति कठिन है और इसका बल उस काम में लगे रहने या उससे बोझिल होने—दोनों में से किसी पर हो सकता है।
    reason: लַעֲנוֹת בּוֹ की वास्तविक शाब्दिक और सन्दर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: कालवेत्ता का पूर्ण रूप वक्ता के चिंतनपूर्ण अवलोकन को व्यक्त करता है। हिन्दी का पूर्ण वर्तमान उस देखे हुए तथ्य की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: הָעִנְיָן
  choice: उस काम
  rationale: सभोपदेशक में यह शब्द सौंपे गए काम, व्यस्तता या दायित्व का बोध कराता है। ‘काम’ साधारण पाठक के लिए स्वाभाविक है और सन्दर्भ में बोझिल मानवीय गतिविधि को भी समेट सकता है।
- source_word: אֲשֶׁר נָתַן אֱלֹהִים
  choice: जिसे परमेश्वर ने ... दिया है
  rationale: यह सम्बन्धवाचक उपवाक्य उस काम को स्पष्ट करता है। ‘परमेश्वर’ אֱלֹהִים का मानक और सन्दर्भानुकूल अनुवाद है।
- source_word: לִבְנֵי הָאָדָם
  choice: मनुष्यों को
  rationale: शाब्दिक रूप ‘मनुष्य की सन्तानों’ है, पर यहाँ इब्रानी मुहावरा सामूहिक रूप से मानवजाति के सदस्यों को दर्शाता है। ‘मनुष्यों’ हिन्दी में स्वाभाविक रहते हुए उसी प्रतिनिधिक अर्थ को व्यक्त करता है।
- source_word: לַעֲנוֹת בּוֹ
  choice: उसमें लगे रहने के लिए
  rationale: यह कठिन पद काम में लगे या व्यस्त रहने का अर्थ दे सकता है, पर इससे कष्ट पाने अथवा उसमें परिश्रम करने का भाव भी सम्भव है। मुख्य पाठ में अपेक्षाकृत व्यापक अर्थ रखा गया है और अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: לִבְנֵי הָאָדָם का रूप
  choice: मनुष्यों को
  alternative: मनुष्य की सन्तानों को
  rationale: मूल पद व्याकरण की दृष्टि से पुल्लिंग मुहावरा है, पर उसका सन्दर्भगत अर्थ सामान्य मानवजाति है। हिन्दी में शाब्दिक रूप अस्वाभाविक और वंशगत अर्थ वाला लग सकता है; ‘मनुष्यों’ मूल के सामूहिक, प्रतिनिधिक बल को स्पष्ट रूप से बनाए रखता है।
- issue: לַעֲנוֹת בּוֹ का अर्थ
  choice: उसमें लगे रहने के लिए
  alternative: उससे कष्ट पाने के लिए; उसमें परिश्रम करने के लिए
  rationale: इब्रानी अभिव्यक्ति अर्थ की दृष्टि से कठिन है और सभोपदेशक में मनुष्य को दिए गए काम की व्यस्तता तथा बोझ—दोनों की ओर संकेत कर सकती है। मुख्य पाठ किसी एक अधिक तीखे अर्थ को निर्णायक नहीं बनाता; वास्तविक विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और चिंतनशील स्वर रखा गया है। वाक्यरचना मूल के निकट है, पर ‘मनुष्य की सन्तानों’ जैसे अस्वाभाविक हिन्दी मुहावरे से बचा गया है।
