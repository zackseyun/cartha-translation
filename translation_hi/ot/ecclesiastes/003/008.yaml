  text: प्रेम करने का समय[a], और घृणा करने का समय[b]; युद्ध का समय, और शांति का समय[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अवसर।’ इब्रानी עֵת समय या अवसर को सूचित कर सकता है; कविता की दोहराई गई लय में ‘समय’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘घृणा’ इब्रानी क्रिया का सीधा अनुवाद है। इस ज्ञान-साहित्यिक संदर्भ में इसका अर्थ प्रेम के विपरीत प्रबल विमुखता या विरोध भी हो सकता है; इसका आशय अनिवार्य रूप से पापपूर्ण द्वेष नहीं है।
    reason: lexical_alternative
  - marker: c
    text: ‘शांति’ इब्रानी שָׁלוֹם का अनुवाद है, जिसका अर्थ ‘कल्याण’ या ‘संपूर्णता’ भी हो सकता है; यहाँ युद्ध के साथ विरोध के कारण ‘शांति’ उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: समय
  rationale: यह शब्द किसी समय-बिंदु या समयावधि को दर्शा सकता है। कविता की दोहराई गई लय में ‘समय’ सबसे स्वाभाविक और सीधा है; ‘ऋतु’ या ‘अवसर’ सम्भव अर्थ हैं, पर यहाँ कम उपयुक्त हैं।
- source_word: לֶאֱהֹב
  choice: प्रेम करने
  rationale: אָהֵב के क्रियार्थक रूप का सीधा अर्थ ‘प्रेम करना’ है और यह ‘समय’ के साथ स्वाभाविक हिन्दी पदबंध बनाता है।
- source_word: לִשְׂנֹא
  choice: घृणा करने
  rationale: שָׂנֵא का सामान्य अर्थ ‘घृणा करना’ है। इसे नरम करके ‘विरोध करना’ कहने के बजाय मूल कविता का तीखा विरोध बनाए रखा गया है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह शब्द युद्ध या सशस्त्र संघर्ष को सूचित करता है; शान्ति के साथ इसके प्रत्यक्ष विरोध में ‘युद्ध’ स्पष्ट और स्वाभाविक है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם का व्यापक अर्थ कुशलता, कल्याण या पूर्णता भी हो सकता है, पर युद्ध के प्रतिलोम के रूप में यहाँ ‘शान्ति’ संदर्भानुकूल है।
theological_decisions:
- issue: ज्ञान-साहित्य के इस विरोध में ‘घृणा’ का नैतिक आशय
  choice: मुख्य पाठ में ‘घृणा’ को बिना नरम किए बनाए रखना।
  alternative: ‘प्रेम न करने’ या ‘विरोध करने’ का समय।
  rationale: पद जीवन में आने वाले विपरीत समयों का काव्यात्मक वर्णन करता है; यह घृणा करने की निरपेक्ष नैतिक आज्ञा नहीं देता। सीधा शब्द मूल की धार्मिक और नैतिक तनातनी को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता रखी गई है। ‘प्रेम करने का समय … घृणा करने का समय’ तथा ‘युद्ध का समय … शान्ति का समय’ मूल इब्रानी संरचना और लय को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
