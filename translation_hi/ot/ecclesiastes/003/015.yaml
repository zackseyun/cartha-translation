  yaml_path: translation/ot/ecclesiastes/003/015.yaml
  text: What has been already is[a], and what is to be has already been; and God seeks what has been driven away.
translation:
  language: hi
  text: जो है, वह पहले भी हो चुका है; और जो होने वाला है, वह पहले ही हो चुका है। परमेश्वर उसे खोजता है जिसे खदेड़ दिया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर उसे खोजता है जिसका पीछा किया जाता है”; अथवा, “परमेश्वर बीती हुई बात का लेखा लेता है।” अंतिम खंड का इब्रानी पाठ कठिन है। वह खदेड़ दी गई या बीत चुकी बात की ओर, अथवा उस व्यक्ति या बात की ओर संकेत कर सकता है जिसका पीछा किया जा रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: जो हो चुका है
  rationale: यह सामान्य रूप से बीती हुई वास्तविकता या घटनाओं की ओर संकेत करता है। यह हिन्दी में स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: כְּבָר הוּא
  choice: वह अब भी है
  rationale: כְּבָר पूर्वता का बोध कराता है, जबकि הוּא विधेयात्मक है। प्रसंग के चक्रीय भाव को ध्यान में रखते हुए यह अनुवाद पहले घट चुके के वर्तमान अस्तित्व को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ मूल की संक्षिप्तता के कारण कुछ अस्पष्टता बनी रहती है।
- source_word: וַאֲשֶׁר לִהְיוֹת
  choice: जो होनेवाला है
  rationale: यह वाक्यांश आगे होनेवाली बात की ओर संकेत करता है और पहले खंड के समानांतर संक्षिप्त शैली रखता है।
- source_word: כְּבָר הָיָה
  choice: पहले ही हो चुका है
  rationale: כְּבָר की पूर्वता और הָיָה के भूतकालीन भाव को स्पष्ट, मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: सभोपदेशक में यह एकमात्र सच्चे ईश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: יְבַקֵּשׁ
  choice: खोजता है
  rationale: בקשׁ का मूल अर्थ ‘खोजना’ है। यह चयन संभावित न्यायिक या पुनःप्राप्ति संबंधी अर्थ को मुख्य पाठ में निश्चित किए बिना मूल शब्दार्थ बचाता है।
- source_word: אֶת נִרְדָּף
  choice: उसे जिसे खदेड़ दिया गया है
  rationale: נִרְדָּף, רדף का निफ़अल कृदंत है और निष्क्रिय अर्थ ‘जिसका पीछा किया गया/जिसे खदेड़ा गया’ दे सकता है। यह रूप कठिन इब्रानी को अत्यधिक व्याख्यायित किए बिना व्यक्त करता है।
theological_decisions:
- issue: וְהָאֱלֹהִים יְבַקֵּשׁ אֶת נִרְדָּף की व्याख्या
  choice: परमेश्वर उसे खोजता है जिसे खदेड़ दिया गया है
  alternative: परमेश्वर उसका खोजी है जिसका पीछा किया जाता है; अथवा परमेश्वर बीती हुई बात का लेखा लेता है
  rationale: इब्रानी खंड अत्यंत संक्षिप्त और अर्थ की दृष्टि से कठिन है। मुख्य पाठ בקשׁ के ‘खोजना’ और נרדף के निष्क्रिय भाव को रखता है, जबकि न्याय, संरक्षण, या बीती बात को फिर सामने लाने जैसे अधिक विशिष्ट निष्कर्षों को आरोपित नहीं करता। प्रमुख वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘होनेवाला’ को संयुक्त रूप में लिखकर सहज बाइबिलीय गद्य बनाए रखा गया है। अंतिम खंड की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित है।
