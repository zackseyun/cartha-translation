  text: עֵ֥ת לָ/לֶ֖דֶת וְ/עֵ֣ת לָ/מ֑וּת עֵ֣ת לָ/טַ֔עַת וְ/עֵ֖ת לַ/עֲק֥וֹר נָטֽוּעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/002.yaml
  text: A time to be born[a], and a time to die; a time to plant, and a time to uproot what is planted.
translation:
  language: hi
  text: जन्म देने का एक समय है[a], और मरने का एक समय; रोपने का एक समय है, और जो रोपा गया है उसे उखाड़ने का एक समय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जन्म लेने का एक समय है।”
    reason: हिब्रू क्रिया सामान्यतः “जन्म देना” व्यक्त करती है, पर “मरने” के साथ इसकी जोड़ी प्रसंग में “जन्म लेना” समझे जाने की गुंजाइश देती है।
lexical_decisions:
- source_word: עֵת
  choice: एक समय
  rationale: עֵת किसी समय या नियत अवसर को दर्शाता है। कविता की आवर्ती संरचना में “एक समय” स्वाभाविक और स्पष्ट है।
- source_word: לָלֶדֶת
  choice: जन्म देने का
  rationale: ילד का क़ाल infinitive मूलतः संतान उत्पन्न करने या जन्म देने को व्यक्त करता है। “जन्म देने” से क्रिया का सक्रिय रूप सुरक्षित रहता है; प्रसंग के कारण “जन्म लेने” का अर्थ भी समझा गया है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: לָמוּת
  choice: मरने का
  rationale: מות का सीधा अर्थ “मरना” है और यह पहली पंक्ति में जीवन के आरंभ के विपरीत रखा गया है।
- source_word: לָטַעַת
  choice: रोपने का
  rationale: נטע का अर्थ पौधा लगाना या रोपना है। कृषि-चित्र को सीधे और आधुनिक हिन्दी में बनाए रखने के लिए “रोपना” चुना गया है।
- source_word: לַעֲקוֹר
  choice: उखाड़ने का
  rationale: עקר जड़ समेत निकालने को दर्शाता है। “उखाड़ना” आधुनिक हिन्दी में स्वाभाविक है और मूल कृषि-चित्र को सुरक्षित रखता है।
- source_word: נָטוּעַ
  choice: रोपे हुए को
  rationale: נטע का निष्क्रिय कृदन्त उस वस्तु को सूचित करता है जिसे पहले रोपा गया है। “रोपे हुए को” किसी अनुल्लिखित संज्ञा को जोड़े बिना मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: לָלֶדֶת में कर्तृवाचक क्रिया और प्रसंगगत जीवनारंभ के बीच तनाव
  choice: मुख्य पाठ में “जन्म देने का”
  alternative: “जन्म लेने का”
  rationale: हिब्रू रूप क़ाल में है और सक्रिय अर्थ “जन्म देना” अधिक सीधा है, जबकि “मरने” के साथ विरोधी जोड़ी होने के कारण अनेक अनुवाद इसे व्यक्ति के जन्म लेने के अर्थ में प्रस्तुत करते हैं। मुख्य पाठ रूपगत अर्थ रखता है और विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। “एक समय है” की पुनरावृत्ति हिब्रू पद्य की लय और समानांतर संरचना को बनाए रखती है।
