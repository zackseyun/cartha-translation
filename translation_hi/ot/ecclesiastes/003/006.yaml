- source_word: אבד
  choice: खो देने
  rationale: इस क्रिया का अर्थ विभिन्न संदर्भों में नष्ट होना या नष्ट करना भी हो सकता है, पर यहाँ ‘ढूँढ़ने’ के प्रतिलोम में ‘खो देना’ सबसे उपयुक्त है; यह कर्ता की भूमिका को पूरी तरह निश्चित भी नहीं करता।
- source_word: שׁמר
  choice: सँभालकर रखने
  rationale: इसका अर्थ रखना, रक्षा करना या सुरक्षित रखना हो सकता है। ‘फेंक देने’ के विपरीत यहाँ वस्तु को अपने पास बनाए रखने का भाव है, जिसे ‘सँभालकर रखना’ सहज रूप से व्यक्त करता है।
- source_word: השליך
  choice: फेंक देने
  rationale: हिफ़ील रूप का मूल अर्थ फेंकना है। इस संदर्भ में ‘फेंक देना’ त्याग या निपटान का सामान्य आधुनिक हिन्दी भाव देता है और ‘सँभालकर रखने’ का स्पष्ट प्रतिलोम बनता है।
