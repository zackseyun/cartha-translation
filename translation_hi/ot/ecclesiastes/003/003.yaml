translation:
  language: hi
  text: मार डालने का समय[a], और चंगा करने का समय; ढा देने का समय[b], और बनाने का समय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘समय’ के प्रत्येक प्रयोग के लिए ‘ऋतु’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तोड़ने का समय, और बनाने का समय।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵת
  choice: समय
  rationale: עֵת किसी समय, अवसर या नियत घड़ी को दर्शाता है। ‘समय’ आधुनिक हिन्दी में स्वाभाविक है और कविता की बार-बार दोहराई गई लय को बनाए रखता है; ‘ऋतु’ या ‘अवसर’ यहाँ अधिक व्याख्यात्मक होंगे।
- source_word: לַהֲרוֹג
  choice: मार डालने
  rationale: הרג का सामान्य अर्थ मारना या प्राण लेना है। ‘मार डालने’ से मूल की कठोरता स्पष्ट रहती है और इसे किसी विशेष न्यायिक या युद्ध-संबंधी अर्थ तक सीमित नहीं किया जाता।
- source_word: לִרְפּוֹא
  choice: चंगा करने
  rationale: רפא का अर्थ चंगा करना या स्वस्थ करना है। ‘चंगा करने’ हत्या के विपरीत जीवन और स्वास्थ्य की पुनर्स्थापना को स्वाभाविक तथा व्यापक ढंग से व्यक्त करता है।
- source_word: לִפְרֹוץ
  choice: ढा देने
  rationale: פרץ के अर्थों में तोड़ना, तोड़कर गिराना और सेंध लगाना शामिल हैं। בנה के साथ विरोधी जोड़ी में यहाँ निर्माण को गिराने का भाव सबसे उपयुक्त है; ‘ढा देने’ से यह संक्षेप और स्पष्टता से व्यक्त होता है।
- source_word: לִבְנוֹת
  choice: बनाने
  rationale: בנה का मूल अर्थ बनाना या निर्माण करना है। ‘बनाने’ से ‘ढा देने’ के साथ स्पष्ट विरोध बनता है और हिन्दी में अनावश्यक विस्तार के बिना मूल अर्थ रहता है।
theological_decisions:
- issue: क्या ‘मार डालने’ को नैतिक कठिनाई से बचने के लिए नरम किया जाए
  choice: इसे सभोपदेशक द्वारा विभिन्न समयों के वर्णन की एक कठोर वास्तविकता के रूप में यथावत रखना
  alternative: ‘वध करने’ या किसी नरम, अधिक सीमित अभिव्यक्ति का प्रयोग
  rationale: यह पद जीवन में आने वाले विपरीत कार्यों और स्थितियों की सूची देता है; वह हर कार्य को स्पष्ट रूप से नैतिक स्वीकृति नहीं देता। मूल क्रिया को नरम करना पाठ में मौजूद तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। समानांतर वाक्य-विन्यास तथा काव्यात्मक पुनरावृत्ति सुरक्षित रखी गई है। ‘मार डालने’ मूल की तीव्रता को बनाए रखता है, जबकि ‘ढा देने/बनाने’ की जोड़ी निर्माण-विनाश के विरोध को स्वाभाविक हिन्दी में व्यक्त करती है।
