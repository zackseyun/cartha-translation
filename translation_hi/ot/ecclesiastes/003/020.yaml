source:
  edition: WLC
  text: הַ/כֹּ֥ל הוֹלֵ֖ךְ אֶל מָק֣וֹם אֶחָ֑ד הַ/כֹּל֙ הָיָ֣ה מִן הֶֽ/עָפָ֔ר וְ/הַ/כֹּ֖ל שָׁ֥ב אֶל הֶ/עָפָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/020.yaml
  text: All go to one place[a]. All came from the dust[b], and all return to the dust.
translation:
  language: hi
  text: सब एक ही स्थान पर जाते हैं। सब मिट्टी से आए थे[a][b], और सब मिट्टी में लौट जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सब मिट्टी से थे।” यहाँ “आए थे” उत्पत्ति का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “मिट्टी” मनुष्य की नश्वरता की ओर संकेत करती है और उत्पत्ति 3:19 की याद दिलाती है।
    reason: cross_reference
lexical_decisions:
- source_word: הַכֹּל
  choice: सब
  rationale: संदर्भ में यह मनुष्यों और पशुओं, दोनों को समग्र रूप से समेटता है। बार-बार आया हुआ “सब” इसकी व्यापकता और पद की संक्षिप्तता बनाए रखता है।
- source_word: הוֹלֵךְ
  choice: जाते हैं
  rationale: इब्रानी कृदंत एक सामान्य और निरंतर सत्य व्यक्त करता है; हिन्दी में सामान्य वर्तमान काल स्वाभाविक है।
- source_word: מָקוֹם אֶחָד
  choice: एक ही स्थान
  rationale: यह “एक स्थान” के अर्थ को रखते हुए स्पष्ट करता है कि सबका गंतव्य समान है, बिना उस स्थान की प्रकृति को अधिक परिभाषित किए।
- source_word: הָיָה מִן־הֶעָפָר
  choice: मिट्टी से आए थे
  rationale: शाब्दिक रूप “मिट्टी से थे” है, पर यहाँ उत्पत्ति और लौटने के समानांतर भाव को आधुनिक हिन्दी में “मिट्टी से आए थे” अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָפָר
  choice: मिट्टी
  rationale: इस प्रसंग में यह धरती के उस पदार्थ को दर्शाता है जिससे प्राणी बने और जिसमें मृत्यु पर लौटते हैं; “मिट्टी” सामान्य हिन्दी में स्वाभाविक है और उत्पत्ति 3:19 की प्रतिध्वनि भी बनाए रखती है।
- source_word: שָׁב אֶל־הֶעָפָר
  choice: मिट्टी में लौट जाते हैं
  rationale: “लौटना” שׁוב का प्रत्यावर्तन-संबंधी अर्थ ठीक रखता है; हिन्दी में किसी मूल अवस्था या पदार्थ के लिए “में लौटना” सहज प्रयोग है।
theological_decisions:
- issue: संदर्भ में “सब” का मानवशास्त्रीय दायरा
  choice: यह पद मनुष्यों और पशुओं की साझा नश्वरता बताता है, पर मृत्यु के बाद की अवस्था पर कोई अतिरिक्त सिद्धान्त घोषित नहीं करता।
  alternative: इसे केवल मनुष्यों के विषय में मानना, या इससे मृत्यु के परे किसी भी भेद का भौतिकवादी निषेध निकालना।
  rationale: सभोपदेशक 3:18–21 का निकट संदर्भ मनुष्यों और पशुओं के समान सांसारिक अंत पर बल देता है। अनुवाद इस कथन को बनाए रखता है, पर आत्मा या परलोक के विषय में वह निष्कर्ष नहीं जोड़ता जो इस पद में स्पष्ट रूप से नहीं दिया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “सब” की पुनरावृत्ति इब्रानी की लय और सार्वभौमिक दायरे को बनाए रखती है; बहुवचन क्रियाएँ हिन्दी व्याकरण के अनुसार स्वाभाविक हैं।
