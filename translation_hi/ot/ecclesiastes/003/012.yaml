  choice: भलाई करें
  alternative: अपना सुख भोगें / अच्छे से रहें
  rationale: עשה טוב का सीधा अर्थ नैतिक रूप से ‘भलाई करना’ हो सकता है, किन्तु सभोपदेशक में טוב अनुभवजन्य कल्याण या जीवन का आनन्द लेने को भी सूचित कर सकता है। मुख्य पाठ एक अर्थ रखता है और पादटिप्पणी दूसरे को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, मननशील और गरिमापूर्ण शैली। ‘आनन्द मनाएँ’ सामान्य पाठक के लिए सहज है, और ‘भलाई करें’ मूल की नैतिक सम्भावना को बिना अतिव्याख्या के बनाए रखता है।
