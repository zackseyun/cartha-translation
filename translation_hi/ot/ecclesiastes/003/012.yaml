- source_word: לִשְׂמוֹחַ
  choice: आनन्द मनाएँ
  rationale: यह שמח के आनन्दित होने या प्रसन्न रहने के क्रियात्मक भाव को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְלַעֲשׂוֹת טוֹב
  choice: और ... भलाई करें
  rationale: शाब्दिक और स्वाभाविक नैतिक अर्थ को मुख्य पाठ में रखा गया है; अनुभवात्मक अर्थ की वास्तविक सम्भावना पादटिप्पणी में दी गई है।
- source_word: בְּחַיָּיו
  choice: अपने जीवन में
  rationale: मूल में प्रत्यय एकवचन है, जबकि पहले आया संकेत बहुवचन है; हिन्दी का ‘अपने जीवन में’ समूह के प्रत्येक व्यक्ति पर लागू होने वाला वितरणात्मक भाव सुरक्षित रखता है।
theological_decisions:
