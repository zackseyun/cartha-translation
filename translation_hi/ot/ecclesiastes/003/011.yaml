base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/011.yaml
  text: He has made everything beautiful in its time. He has also put eternity in their heart[a], yet so that man cannot find out the work that God has done from beginning to end.
translation:
  language: hi
  text: उसने हर बात को उसके समय में सुन्दर बनाया है। उसने मनुष्यों के हृदय में अनन्तकाल भी रखा है[a], फिर भी मनुष्य परमेश्वर के किए हुए काम का आरम्भ से अन्त तक पता नहीं लगा सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संसार” अथवा “युग”; यहाँ प्रयुक्त इब्रानी शब्द עוֹלָם का अर्थ निश्चित करना कठिन है। यह समय के समूचे विस्तार, या मनुष्य के तत्काल अनुभव से परे जगत के बोध की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: हर वस्तु
  rationale: यह परमेश्वर द्वारा बनाई या व्यवस्थित की गई समस्त वस्तुओं और घटनाओं की व्यापकता व्यक्त करता है।
- source_word: יָפֶה
  choice: सुन्दर
  rationale: यह मूल शब्द के सौन्दर्य और उपयुक्तता—दोनों सम्भावित भावों को खुला रखता है; प्रसंग में प्रत्येक बात का अपने समय में उचित होना भी निहित है।
- source_word: בְעִתּוֹ
  choice: उसके समय में
  rationale: यह अध्याय में बार-बार आए नियत समय के विषय को बनाए रखता है और प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָעֹלָם
  choice: अनन्तकाल
  rationale: यह तत्काल वर्तमान से परे समय के विस्तृत आयाम के प्रति मनुष्य की चेतना और परमेश्वर के सम्पूर्ण कार्य को न जान पाने के बीच के तनाव को सुरक्षित रखता है; शब्द की कठिनाई के कारण अन्य अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: בְּלִבָּם
  choice: मनुष्यों के हृदय में
  rationale: हिब्रू में ‘हृदय’ विचार, इच्छा और भीतरी चेतना का केन्द्र भी है। स्पष्ट हिन्दी के लिए बहुवचन प्रत्यय का संदर्भ ‘मनुष्यों’ से व्यक्त किया गया है।
- source_word: מִבְּלִי אֲשֶׁר לֹא
  choice: फिर भी ... नहीं सकता
  rationale: यह निर्माण मनुष्य की सीमा और पूर्व कथन के साथ उसका विरोधाभासी सम्बन्ध व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यह प्रतिनिधिक एकवचन को बनाए रखते हुए सम्पूर्ण मानवजाति के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִמְצָא
  choice: खोज नहीं सकता
  rationale: यहाँ क्रिया का अर्थ परमेश्वर के कार्य का पूरा पता लगाना या उसे समझ पाना है; ‘खोज’ मूल क्रिया की छवि को भी बनाए रखता है।
- source_word: הַמַּעֲשֶׂה
  choice: किए हुए काम
  rationale: यह परमेश्वर की समग्र गतिविधि को सूचित करने वाले एकवचन सामूहिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵרֹאשׁ וְעַד סוֹף
  choice: आरम्भ से अन्त तक
  rationale: यह सम्पूर्ण विस्तार बताने वाली मूल सामासिक अभिव्यक्ति का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: הָעֹלָם का अर्थ और उसका मनुष्य के ज्ञान तथा परमेश्वर के सार्वभौम कार्य से सम्बन्ध
  choice: मुख्य पाठ में ‘अनन्तकाल’
  alternative: ‘संसार’, ‘युग’, अथवा तत्काल अनुभव से परे समय और जगत के समूचे विस्तार का बोध
  rationale: पद मनुष्य के भीतर तत्काल वर्तमान से परे पहुँचने वाली चेतना और परमेश्वर के कार्य को आरम्भ से अन्त तक न जान सकने की सीमा को साथ रखता है। मुख्य पाठ इस तनाव को सुरक्षित रखता है, जबकि विवादित वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘सुन्दर’ पारम्परिक अर्थ को रखते हुए ‘उचित’ होने की प्रसंगगत छाया भी बनाए रखता है। ‘मनुष्यों के हृदय’ और फिर ‘मनुष्य’ से सामूहिक मानवता तथा प्रतिनिधिक एकवचन दोनों स्पष्ट होते हैं।
