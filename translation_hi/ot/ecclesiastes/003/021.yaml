source:
  edition: WLC
  text: מִ֣י יוֹדֵ֗עַ ר֚וּחַ בְּנֵ֣י הָ/אָדָ֔ם הָ/עֹלָ֥ה הִ֖יא לְ/מָ֑עְלָ/ה וְ/ר֨וּחַ֙ הַ/בְּהֵמָ֔ה הַ/יֹּרֶ֥דֶת הִ֖יא לְ/מַ֥טָּה לָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/021.yaml
  text: Who knows whether the spirit of the sons of man goes upward[b][a], and whether the spirit of the beast goes down to the earth?
translation:
  language: hi
  text: कौन जानता है कि मनुष्यों की आत्मा[a][b] ऊपर जाती है और पशु की आत्मा नीचे धरती की ओर उतरती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य की संतानों की आत्मा”; यह पुरुषवाची इब्रानी अभिव्यक्ति यहाँ समस्त मानवजाति के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: दोनों स्थानों पर “आत्मा” के बदले “श्वास” भी संभव है; इब्रानी רוּחַ के अर्थ यहाँ एक-दूसरे से जुड़े हुए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: कौन जानता है
  rationale: इब्रानी प्रश्नवाचक अभिव्यक्ति को सीधे और स्वाभाविक रूप में रखता है तथा पद की अनिश्चितता बनाए रखता है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: मनुष्य और पशु की मृत्यु तथा उनकी दिशा के प्रसंग में यह जीवनदायी तत्त्व को व्यक्त करता है; फिर भी 'प्राणवायु' अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: בְּנֵי הָאָדָם
  choice: मनुष्यों
  rationale: शाब्दिक अर्थ 'आदम की संतान/मनुष्य के पुत्र' है, पर यहाँ अभिव्यक्ति समस्त मानवजाति के लिए प्रतिनिधिक रूप से प्रयुक्त है; आधुनिक हिन्दी में 'मनुष्यों' स्वाभाविक और सटीक है।
- source_word: הָעֹלָה הִיא לְמָעְלָה
  choice: ऊपर जाती है
  rationale: ऊर्ध्व दिशा में गति को सरल हिन्दी में व्यक्त करता है और इब्रानी कृदन्तीय रचना का आशय सुरक्षित रखता है।
- source_word: רוּחַ הַבְּהֵמָה
  choice: पशु की आत्मा
  rationale: בְּהֵמָה का एकवचन यहाँ पशु-जगत के प्रतिनिधिक अर्थ में है; 'पशु' मनुष्य के साथ मूल विरोध को स्पष्ट रखता है।
- source_word: הַיֹּרֶדֶת הִיא לְמַטָּה
  choice: नीचे ... जाती है
  rationale: '''ऊपर जाती है'' के समानांतर दिशात्मक विरोध को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।'
- source_word: לָאָרֶץ
  choice: धरती में
  rationale: नीचे उतरकर धरती/मिट्टी में जाने का मृत्यु-संबंधी चित्र व्यक्त करता है; 'धरती पर' भी व्याकरणतः संभव है, पर यहाँ गंतव्य का भाव प्रमुख है।
theological_decisions:
- issue: क्या पद मनुष्य और पशु की मृत्यु के बाद की गति को निश्चित कथन के रूप में कहता है या उस पर प्रश्न उठाता है
  choice: '''कौन जानता है कि...'' के रूप में अनिश्चितता व्यक्त करने वाला प्रश्न'
  alternative: मनुष्य की आत्मा ऊपर और पशु की आत्मा नीचे जाती है—इसे निश्चित कथन मानना
  rationale: מִי יוֹדֵעַ स्पष्टतः 'कौन जानता है?' से आरम्भ होता है। प्रश्नचिह्न और 'कि' के अधीन दोनों समानांतर खंड रखने से उपदेशक की ज्ञान-संबंधी अनिश्चितता बनी रहती है और कोई अतिरिक्त सिद्धान्त आरोपित नहीं होता।
- issue: दूसरे खंड की प्रश्नवाचकता को हिन्दी में कैसे व्यक्त किया जाए
  choice: एक ही 'कि' के अधीन दोनों खंडों को संयुक्त प्रश्न में रखना
  alternative: दूसरे खंड के पहले 'क्या' या 'और क्या' दोहराना
  rationale: इब्रानी में दूसरे खंड के आगे अलग प्रश्नवाचक अव्यय नहीं है। हिन्दी में संयुक्त संरचना स्वाभाविक है और प्रश्न का प्रभाव दोनों खंडों पर स्पष्टतः बना रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रश्नात्मक अनिश्चितता तथा ऊपर/नीचे का समानांतर विरोध सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित पदबंध के तुरंत बाद दिए गए हैं।
