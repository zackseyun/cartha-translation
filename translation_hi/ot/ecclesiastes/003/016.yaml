  text: וְ/ע֥וֹד רָאִ֖יתִי תַּ֣חַת הַ/שָּׁ֑מֶשׁ מְק֤וֹם הַ/מִּשְׁפָּט֙ שָׁ֣מָּ/ה הָ/רֶ֔שַׁע וּ/מְק֥וֹם הַ/צֶּ֖דֶק שָׁ֥מָּ/ה הָ/רָֽשַׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/016.yaml
  text: And I also saw under the sun that in the place of justice[a], there was wickedness, and in the place of righteousness, there was wickedness.
translation:
  language: hi
  text: 'और मैंने सूर्य के नीचे यह भी देखा: न्याय के स्थान में दुष्टता थी, और धार्मिकता[a] के स्थान में भी दुष्टता थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय”; यहाँ प्रयुक्त इब्रानी शब्द (צֶדֶק) पिछले वाक्यांश के “न्याय” वाले शब्द (מִשְׁפָּט) से अलग है, यद्यपि दोनों के अर्थ एक-दूसरे से मिलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעוֹד
  choice: फिर ... यह भी
  rationale: यह सभोपदेशक के क्रम में एक और अवलोकन जोड़ता है। ‘फिर’ और ‘भी’ मिलकर इसके योगात्मक तथा क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: प्रत्यक्ष अनुभव और अवलोकन की ठोस शैली बनाए रखता है; ‘निरीक्षण किया’ अपेक्षाकृत व्याख्यात्मक और औपचारिक होता।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट अभिव्यक्ति का सीधा, परिचित और अर्थपूर्ण हिन्दी रूप।
- source_word: מְקוֹם הַמִּשְׁפָּט
  choice: न्याय के स्थान पर
  rationale: מִשְׁפָּט यहाँ उस क्षेत्र या स्थान को सूचित करता है जहाँ न्याय किया जाना चाहिए। यह अनुवाद कानूनी और नैतिक दोनों अर्थों को बनाए रखता है।
- source_word: שָׁמָּה
  choice: '... के स्थान पर ... थी'
  rationale: इब्रानी ‘वहाँ’ उसी निर्दिष्ट स्थान में पाई गई दशा पर बल देता है। हिन्दी में ‘के स्थान पर ... थी’ उस स्थानीय और विरोधात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרֶשַׁע / הָרָשַׁע
  choice: दुष्टता
  rationale: समानांतर रचना दोनों occurrences में अमूर्त अर्थ ‘दुष्टता’ का समर्थन करती है। इससे पद का संतुलन और न्यायिक क्षेत्र में नैतिक भ्रष्टता का भाव बना रहता है।
- source_word: מְקוֹם הַצֶּדֶק
  choice: धार्मिकता के स्थान पर
  rationale: צֶדֶק और पहले आए מִשְׁפָּט के बीच शब्दगत भेद बनाए रखने के लिए ‘धार्मिकता’ चुना गया है। यहाँ इसका अर्थ नैतिक सहीपन है, केवल धार्मिक अनुष्ठान नहीं।
theological_decisions:
- issue: צֶדֶק को מִשְׁפָּט से अलग कैसे व्यक्त किया जाए
  choice: मुख्य पाठ में ‘धार्मिकता’
  alternative: ‘न्याय’ या ‘जो उचित है’
  rationale: इब्रानी में दो निकटार्थी पर अलग शब्द हैं। ‘धार्मिकता’ शब्दगत भेद और व्यापक नैतिक अर्थ बचाता है, जबकि पादटिप्पणी प्रसंगानुकूल ‘न्याय’ की संभावना बताती है; इससे किसी संप्रदायगत अर्थ को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और मूल की समानांतर संरचना के निकट रखी गई है। ‘धार्मिकता’ को नैतिक सहीपन के अर्थ में लिया गया है।
