  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י אֶת הַ/צַּדִּיק֙ וְ/אֶת הָ֣/רָשָׁ֔ע יִשְׁפֹּ֖ט הָ/אֱלֹהִ֑ים כִּי עֵ֣ת לְ/כָל חֵ֔פֶץ וְ/עַ֥ל כָּל הַֽ/מַּעֲשֶׂ֖ה שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/017.yaml
  text: I said in my heart[a], “God will judge the righteous and the wicked[b], for there is a time for every matter and for every deed there.”
translation:
  language: hi
  text: मैंने अपने मन में कहा, “परमेश्वर धर्मी और दुष्ट, दोनों का न्याय करेगा, क्योंकि हर विषय और हर काम[a] के लिए वहाँ[b] एक समय है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर उद्देश्य और हर कार्य।” इब्रानी शब्दों का अर्थ प्रसंग के अनुसार “विषय/उद्देश्य” और “काम/कार्य” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “वहाँ” स्पष्ट रूप से लिखा है। यह परमेश्वर के न्याय के स्थान या अवसर की ओर संकेत कर सकता है, पर इसका सटीक आशय निश्चित नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: मैंने अपने मन में कहा
  rationale: यह इब्रानी मुहावरा भीतर किए गए विचार को व्यक्त करता है। हिंदी में ‘अपने मन में कहा’ हृदय/मन में बोलने के मूल रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הַצַּדִּיק
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में उस व्यक्ति या वर्ग को दर्शाता है जो धर्मी है। ‘धर्मी’ प्रचलित और स्पष्ट नैतिक श्रेणी है।
- source_word: הָרָשָׁע
  choice: दुष्ट
  rationale: यह संज्ञा के रूप में प्रयुक्त विशेषण ‘धर्मी’ के विपरीत नैतिक वर्ग को दर्शाता है; ‘दुष्ट’ कानूनी दोष से अधिक व्यापक नैतिक अर्थ बनाए रखता है।
- source_word: יִשְׁפֹּט
  choice: न्याय करेगा
  rationale: संदर्भ में अपूर्ण क्रिया भावी ईश्वरीय निर्णय की ओर संकेत करती है। ‘न्याय करेगा’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह सच्चे परमेश्वर को सूचित करता है; ‘परमेश्वर’ गरिमापूर्ण और सामान्य हिंदी बाइबलीय पद है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ उस व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: עֵת
  choice: एक समय
  rationale: यह अध्याय में बार-बार आने वाले ‘समय’ के विषय से साहित्यिक संबंध बनाए रखता है और किसी अतिरिक्त व्याख्या को नहीं जोड़ता।
- source_word: לְכָל חֵפֶץ
  choice: हर विषय के लिए
  rationale: חֵפֶץ इच्छा, उद्देश्य, विषय या कार्य-व्यापार का अर्थ दे सकता है। यहाँ ‘विषय’ पर्याप्त व्यापक है और संदर्भ में स्वाभाविक बैठता है।
- source_word: וְעַל כָּל הַמַּעֲשֶׂה
  choice: और हर काम के लिए
  rationale: מַעֲשֶׂה काम, कर्म या कार्य को दर्शाता है। ‘काम’ मूल की व्यापकता रखता है और केवल नैतिक कर्म तक अर्थ को सीमित नहीं करता।
- source_word: שָׁם
  choice: वहाँ
  rationale: इब्रानी में स्थानवाचक क्रियाविशेषण स्पष्ट रूप से उपस्थित है। ‘वहाँ’ को बनाए रखने से उसके स्थान, क्षेत्र या न्याय के अवसर की ओर संकेत करने की अस्पष्टता सुरक्षित रहती है।
theological_decisions:
- issue: अंतिम क्रियाविशेषण שָׁם का परमेश्वर के न्याय से संबंध
  choice: मुख्य पाठ में ‘वहाँ’ को स्पष्ट रूप से बनाए रखा गया है।
  alternative: इसे छोड़ देना, या ‘तब’, ‘उस स्थान पर’ अथवा ‘न्याय के समय’ कहकर इसका अर्थ निश्चित कर देना।
  rationale: मूल इब्रानी पाठ में שָׁם उपस्थित है, पर उसका सटीक संकेत विवादित है। वह परमेश्वर के न्याय के स्थान, क्षेत्र या अवसर की ओर संकेत कर सकता है। ‘वहाँ’ मूल पाठ की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने मन में कहा’ मूल मुहावरे को स्वाभाविक हिंदी में सुरक्षित रखता है। ‘वहाँ’ से उत्पन्न हल्की असामान्यता जानबूझकर रखी गई है ताकि कठिन इब्रानी वाक्य को व्याख्या द्वारा समतल न किया जाए।
