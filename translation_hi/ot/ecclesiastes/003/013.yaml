  yaml_path: translation/ot/ecclesiastes/003/013.yaml
  text: And also that every man should eat and drink and see good in all his labor—this is the gift of God[a][b].
translation:
  language: hi
  text: और यह भी कि हर मनुष्य खाए-पीए और अपने सारे परिश्रम में सुख पाए[a]—यह परमेश्वर की देन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भलाई देखे”; इसका अर्थ “भलाई का अनुभव करे” या “आनंद पाए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और यह भी कि
  rationale: यह पद पिछले विचार से जुड़कर उसमें एक और बात जोड़ता है; यह अभिव्यक्ति उस संयोजक और योगात्मक बल को बनाए रखती है।
- source_word: כָּל הָאָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ किसी एक पुरुष के लिए नहीं, बल्कि प्रत्येक मानव के लिए प्रयुक्त सामान्य एकवचन है। ‘हर मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस व्यापक अर्थ को व्यक्त करता है।
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: खाए-पीए
  rationale: संयुक्त क्रियाएँ जीवन की सामान्य मानवीय भलाई और परमेश्वर से मिली अनुमति/सामर्थ्य को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करती हैं, बिना विधि या संभावना को आवश्यकता से अधिक निश्चित किए।
- source_word: וְרָאָה טוֹב
  choice: और … सुख पाए
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘भलाई देखे’ है, पर सभोपदेशक में इसका आशय भलाई का अनुभव या आनंद लेना है। ‘सुख पाए’ सामान्य हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक चित्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּכָל עֲמָלוֹ
  choice: अपने सारे परिश्रम में
  rationale: עָמָל श्रम और उससे जुड़ी कठिनाई दोनों का संकेत देता है। ‘परिश्रम’ इस भाव को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है, और בְ का संबंध ‘में’ से व्यक्त होता है।
- source_word: מַתַּת אֱלֹהִים הִיא
  choice: यह परमेश्वर की देन है
  rationale: वाक्य का अंतिम संज्ञात्मक कथन पहले कही गई पूरी वास्तविकता को परमेश्वर से प्राप्त उपहार ठहराता है। ‘देन’ आधुनिक हिन्दी में स्वाभाविक है और दिव्य प्रदत्तता पर बल बनाए रखती है।
theological_decisions:
- issue: אָדָם का मानवजाति के लिए सामान्य प्रयोग
  choice: हर मनुष्य
  alternative: हर पुरुष
  rationale: यहाँ व्याकरणिक रूप पुल्लिंग है, पर कथन का आशय प्रत्येक मानव से है। ‘हर मनुष्य’ स्रोत के सामान्य मानवीय अर्थ को सटीक रूप से व्यक्त करता है और कथन को केवल पुरुषों तक सीमित नहीं करता।
- issue: भोजन, पेय और परिश्रम के सुख का परमेश्वर से संबंध
  choice: पूरे अनुभव को ‘परमेश्वर की देन’ कहा गया है
  alternative: केवल परिश्रम के फल को देन समझना
  rationale: स्त्रीलिंग सर्वनाम הִיא निकटवर्ती स्त्रीलिंग संज्ञा מַתַּת के साथ विधेय संरचना में है और पूर्ववर्ती पूरे कथन की ओर संकेत करता है। हिन्दी में ‘यह’ जानबूझकर व्यापक रखा गया है ताकि भोजन, पीना और परिश्रम में सुख पाना—समूचा अनुभव—दिव्य देन समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘खाए-पीए’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘परिश्रम’ सभोपदेशक के श्रम-संबंधी गंभीर भाव को बनाए रखता है।
