base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/003/019.yaml
  text: 'For the fate of the sons of man and the fate of the beast is one fate for them: as this one dies[a], so dies that one, and one breath is for all. Man has no advantage over the beast, for all is vapor.'
translation:
  language: hi
  text: 'क्योंकि मनुष्यों का भाग्य और पशुओं का भाग्य—दोनों का भाग्य एक ही है: जैसे एक मरता है, वैसे ही दूसरा भी मरता है; और सबमें एक ही श्वास[a] है। मनुष्य को पशु से कोई बढ़त नहीं है, क्योंकि सब कुछ वाष्प है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सबमें एक ही आत्मा है।” इब्रानी शब्द רוּחַ का अर्थ “श्वास,” “वायु” या “आत्मा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְרֶה
  choice: भाग्य
  rationale: यहाँ इसका आशय उस समान परिणाम से है जो मनुष्यों और पशुओं, दोनों पर आता है—मृत्यु। ‘भाग्य’ पद की अस्तित्वगत और तुलनात्मक शक्ति को संक्षेप में व्यक्त करता है।
- source_word: בְנֵי הָאָדָם
  choice: मनुष्य
  rationale: इब्रानी पद शाब्दिक रूप से ‘आदम की सन्तान’ है, पर यहाँ समस्त मनुष्यों के लिए प्रयुक्त है। आधुनिक हिन्दी में ‘मनुष्य’ सामूहिक और स्वाभाविक है तथा अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: הַבְּהֵמָה
  choice: पशु
  rationale: एकवचन संज्ञा यहाँ सामूहिक अर्थ में पशु-जगत को सूचित करती है। हिन्दी में ‘पशु’ इसी प्रकार स्वाभाविक सामूहिक प्रयोग है।
- source_word: וּמִקְרֶה אֶחָד לָהֶם
  choice: दोनों का भाग्य एक ही है
  rationale: यह अनुवाद इब्रानी ‘एक’ पर बल बनाए रखते हुए मनुष्य और पशु के समान परिणाम को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּמוֹת זֶה כֵּן מוֹת זֶה
  choice: जैसे एक मरता है, वैसे ही दूसरा भी मरता है
  rationale: संतुलित इब्रानी तुलना और दोनों की समान मृत्यु को हिन्दी की समानान्तर संरचना में सुरक्षित रखा गया है।
- source_word: רוּחַ
  choice: श्वास
  rationale: साझी नश्वरता के इस प्रसंग में ‘श्वास’ जीवन-श्वास के अर्थ को सबसे सहज रूप से व्यक्त करता है और मनुष्य तथा पशु की आत्मिक प्रकृति के बारे में पद से आगे कोई निष्कर्ष नहीं जोड़ता।
- source_word: אֶחָד לַכֹּל
  choice: सबकी श्वास एक ही है
  rationale: यह एकवचन ‘एक’ और सार्वभौमिक ‘सब’ दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: מוֹתַר
  choice: बढ़त
  rationale: यहाँ शब्द तुलना में लाभ, श्रेष्ठता या अतिरिक्त स्थिति को दर्शाता है। ‘बढ़त’ साधारण आधुनिक हिन्दी में इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन सामूहिक रूप में समस्त मानवजाति का प्रतिनिधित्व करता है और ‘पशु’ के साथ मूल विरोध को बनाए रखता है।
- source_word: הַכֹּל
  choice: सब कुछ
  rationale: यह व्यापक, सूक्तिपरक कथन की सार्वभौमिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָבֶל
  choice: वाष्प
  rationale: ‘वाष्प’ क्षणभंगुरता, अस्थिरता और पकड़ में न आने की मूल उपमा को बनाए रखता है; केवल ‘व्यर्थता’ कहने से मूल का ठोस बिंब खो जाता।
theological_decisions:
- issue: मनुष्य और पशु की तुलना में רוּחַ का अर्थ
  choice: श्वास
  alternative: आत्मा
  rationale: निकट प्रसंग दोनों की साझा नश्वरता और जीवन-श्वास पर बल देता है। ‘श्वास’ चुनने से विवादित मानवशास्त्रीय प्रश्न को अनावश्यक रूप से हल नहीं किया जाता; ‘आत्मा’ को पादटिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
- issue: אָדָם / בְנֵי הָאָדָם का सामूहिक आशय
  choice: मनुष्य
  alternative: आदम की सन्तान / मानवजाति
  rationale: यहाँ मूल पद समस्त मानव समुदाय को सूचित करता है। ‘मनुष्य’ आधुनिक हिन्दी में प्रतिनिधिक सामूहिक अर्थ रखता है, मूल के मानव-पशु विरोध को सुरक्षित करता है और उसे केवल पुरुषों तक सीमित नहीं करता।
- issue: הָבֶל की प्रमुख उपमा
  choice: वाष्प
  alternative: व्यर्थता
  rationale: ‘वाष्प’ मूल रूपक और सभोपदेशक की जानबूझकर बहुअर्थी भाषा को बनाए रखता है—क्षणभंगुर, अस्थिर और पकड़ में न आने वाला—जबकि ‘व्यर्थता’ अर्थ को केवल मूल्यांकनात्मक दिशा में सीमित कर सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की समानान्तर तुलना, ‘एक’ की पुनरावृत्त धारणा और ‘वाष्प’ की ठोस उपमा सुरक्षित हैं। पादटिप्पणी-चिह्न उसी शब्द ‘श्वास’ पर रखा गया है जिससे उसका lexical विकल्प सम्बद्ध है।
