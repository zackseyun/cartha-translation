  text: What profit has the worker from that in which he labors?[a]
translation:
  language: hi
  text: काम करनेवाले को उस काम से क्या लाभ होता है, जिसमें वह परिश्रम करता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस काम में वह परिश्रम करता है, उससे काम करनेवाले को क्या लाभ होता है?”
    reason: בַּאֲשֶׁר और עָמֵל के संबंध को हिन्दी में वैकल्पिक शब्द-क्रम द्वारा व्यक्त करता है, बिना मूल में न होने वाला ‘सारे’ जोड़ने के।
lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: यह संक्षिप्त प्रश्नवाचक शब्द आलंकारिक प्रश्न आरम्भ करता है; ‘क्या’ उसकी सीधी और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: יִתְרוֹן
  choice: लाभ
  rationale: सभोपदेशक में यह एक प्रमुख आवर्ती शब्द है, जिसका अर्थ परिश्रम से मिलनेवाला अतिरिक्त फल, फायदा या बढ़त है। ‘लाभ’ आर्थिक रूपक और पुस्तक के मुख्य प्रश्न—अंततः क्या बचता है—दोनों को बनाए रखता है।
- source_word: הָעֹשֶׂה
  choice: काम करनेवाला
  rationale: עשה का यह संज्ञार्थक कृदंत शाब्दिक रूप से ‘करनेवाला’ है। परिश्रम के संदर्भ में ‘काम करनेवाला’ स्वाभाविक है और इसे किसी विशिष्ट पेशे के मजदूर तक सीमित नहीं करता।
- source_word: בַּאֲשֶׁר
  choice: उस काम से … जिसमें
  rationale: ב और אֲשֶׁר का मेल उस कार्य या क्षेत्र को बताता है जिसमें व्यक्ति परिश्रम करता है। हिन्दी में यह रचना लाभ के स्रोत और परिश्रम के क्षेत्र, दोनों संबंधों को स्पष्ट रखती है।
- source_word: הוּא
  choice: वह
  rationale: स्पष्ट पुरुषवाचक सर्वनाम पहले आए ‘काम करनेवाले’ को फिर से ग्रहण करता है और इब्रानी के एकवचन पुल्लिंग रूप को सुरक्षित रखता है।
- source_word: עָמֵל
  choice: परिश्रम करता है
  rationale: עמל कठिन श्रम या toil का भाव देता है। ‘परिश्रम करता है’ आधुनिक, गरिमापूर्ण और व्यापक हिन्दी है तथा साधारण ‘काम करता है’ से अधिक मूल भाव प्रकट करता है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: काम करनेवाले … वह
  alternative: काम करनेवालों … वे
  rationale: इब्रानी पाठ संज्ञार्थक कृदंत और सर्वनाम, दोनों में पुल्लिंग एकवचन रखता है। हिन्दी में उसी प्रतिनिधिक एकवचन को बनाए रखा गया है, बिना उसका आशय केवल पुरुषों तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली संक्षिप्त, प्रश्नात्मक और गरिमापूर्ण है। ‘काम करनेवाला’ सामान्य पाठक के लिए सहज है, जबकि ‘लाभ’ सभोपदेशक के आवर्ती मुख्य शब्द को स्थिर रखता है।
