base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/014.yaml
  text: The wise man has his eyes in his head[a], but the fool walks in darkness. Yet I also knew that one fate happens to them all.
translation:
  language: hi
  text: बुद्धिमान की आँखें उसके सिर में रहती हैं, पर मूर्ख अँधेरे में चलता है। फिर भी मैंने यह भी जाना कि एक ही घटना[a] उन सब पर घटती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही गति” या “एक ही परिणति।” इब्रानी מִקְרֶה का अर्थ प्रसंग के अनुसार किसी पर घटने वाली घटना, भाग्य, या परिणति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָכָם
  choice: बुद्धिमान
  rationale: यह व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ मूर्ख के साथ प्रतिनिधिक विरोध में एक बुद्धिमान व्यक्ति को सूचित करता है।
- source_word: עֵינָיו בְּרֹאשׁוֹ
  choice: उसकी आँखें उसके सिर में रहती हैं
  rationale: इब्रानी की सजीव और ठोस अभिव्यक्ति को बनाए रखा गया है; इसका आशय बुद्धिमान की सूझ-बूझ है, पर उसे व्याख्यात्मक रूप से खोलकर नहीं कहा गया।
- source_word: וְהַכְּסִיל
  choice: पर मूर्ख
  rationale: वाव को इस विरोधात्मक समानांतरता में स्वाभाविक हिन्दी के लिए ‘पर’ किया गया है।
- source_word: בַּחֹשֶׁךְ הוֹלֵךְ
  choice: अँधेरे में चलता है
  rationale: चलने और अँधेरे—दोनों मूल रूपकों को बनाए रखा गया है; अँधेरे को नैतिक या बौद्धिक अर्थ तक सीमित नहीं किया गया।
- source_word: וְיָדַעְתִּי גַם אֲנִי
  choice: फिर भी मैं यह जानता था
  rationale: ‘फिर भी’ पहले बताए गए ज्ञान के लाभ और अब सामने आने वाली समान परिणति के बीच विरोध को व्यक्त करता है; प्रथम पुरुष का बल स्पष्ट रखा गया है।
- source_word: שֶׁמִּקְרֶה אֶחָד
  choice: कि एक ही गति
  rationale: מִקְרֶה उस घटना या परिणति को दर्शाता है जो किसी पर घटती है। प्रसंग में ‘गति’ सबकी साझा परिणति को संक्षेप में व्यक्त करती है, बिना उसे पद में सीधे ‘मृत्यु’ कहकर सीमित किए।
- source_word: יִקְרֶה אֶת כֻּלָּם
  choice: उन सबकी होती है
  rationale: קרה और מקרה की हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए, वाक्य स्वाभाविक रखा गया और כֻּלָּם का सार्वभौमिक विस्तार सुरक्षित किया गया।
theological_decisions:
- issue: ‘एक ही गति’ को स्पष्ट रूप से मृत्यु कहना
  choice: पद में व्यापक ‘एक ही गति’ रखा गया
  alternative: उन सबकी मृत्यु होती है
  rationale: आस-पास का प्रसंग मृत्यु की ओर संकेत कर सकता है, पर इस पद का מִקְרֶה स्वयं ‘घटना/परिणति/भाग्य’ की व्यापकता रखता है; अनुवाद उस तनाव को खुला छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। मूल की बुद्धिमान/मूर्ख तथा आँखें/अँधेरा वाली समानांतर छवियाँ सुरक्षित रखी गई हैं। फुटनोट-चिह्न उसी पदांश के बाद रखा गया है जिसकी शब्दार्थ-संबंधी वैकल्पिक व्याख्या दी गई है।
