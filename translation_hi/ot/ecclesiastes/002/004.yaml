  rationale: यह व्यापक शब्द निर्माण और रोपण सहित आगे बताए गए विविध उपक्रमों को समेटता है तथा इब्रानी के निकट रहता है।
- source_word: בָּנִיתִי
  choice: बनाए
  rationale: בנה के सामान्य निर्माणार्थ का सहज और सीधा हिन्दी रूप।
- source_word: לִי
  choice: अपने लिए
  rationale: व्यक्तिगत लाभ अथवा स्वामित्व के आत्मवाचक भाव को स्पष्ट करता है।
- source_word: בָּתִּים
  choice: घर
  rationale: मूल शब्द का सामान्य अर्थ ‘घर’ है; राजमहल कहना पाठ से अधिक विशिष्ट होगा।
- source_word: נָטַעְתִּי
  choice: लगाईं
  rationale: पौधे या दाख की बारी स्थापित करने के संदर्भ में נטע का स्वाभाविक हिन्दी रूप।
- source_word: כְּרָמִים
  choice: दाख की बारियाँ
  rationale: अंगूर की खेती वाली भूमि के लिए सामान्य, स्पष्ट और सटीक हिन्दी अभिव्यक्ति।
