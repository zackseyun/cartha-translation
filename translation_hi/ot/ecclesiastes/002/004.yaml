lexical_decisions:
- source_word: הִגְדַּלְתִּי
  choice: विशाल बनाया
  rationale: हिफ़िल रूप का कारक अर्थ बनाए रखता है और कामों को बड़े पैमाने पर करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעֲשָׂי
