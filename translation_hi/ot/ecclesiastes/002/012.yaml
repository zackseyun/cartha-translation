source:
  edition: WLC
  text: וּ/פָנִ֤יתִֽי אֲנִי֙ לִ/רְא֣וֹת חָכְמָ֔ה וְ/הוֹלֵל֖וֹת וְ/סִכְל֑וּת כִּ֣י מֶ֣ה הָ/אָדָ֗ם שֶׁ/יָּבוֹא֙ אַחֲרֵ֣י הַ/מֶּ֔לֶךְ אֵ֥ת אֲשֶׁר כְּבָ֖ר עָשֽׂוּ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/012.yaml
  text: So I turned to consider wisdom[a], madness, and folly; for what can the man do who comes after the king? Only what has already been done.
translation:
  language: hi
  text: और मैं बुद्धि, पागलपन और मूर्खता पर विचार करने को मुड़ा; क्योंकि जो मनुष्य राजा के बाद आएगा, वह क्या कर सकता है? केवल वही, जो पहले ही किया जा चुका है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अंतिम भाग कठिन है। अधिक शाब्दिक रूप से: “राजा के बाद आने वाला मनुष्य क्या है? जो कुछ उन्होंने उसे/इसे पहले ही बनाया या किया है।” बहुवचन कर्ता और एकवचन प्रत्यय का संबंध अस्पष्ट है। इसका अर्थ “केवल वही, जो पहले ही किया जा चुका है” भी समझा जा सकता है।'
    reason: मूल इब्रानी में बहुवचन कर्ता और एकवचन कर्म-सर्वनाम के कारण अंतिम खंड का संबंध और आशय अस्पष्ट है।
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: तब मैं ... विचार करने लगा
  rationale: यह वाक्य विचार के एक नए विषय की ओर मुड़ने को दिखाता है; हिन्दी में यह अभिव्यक्ति उस संक्रमण को स्वाभाविक रूप से व्यक्त करती है।
- source_word: לִרְאוֹת
  choice: पर विचार करने
  rationale: अमूर्त विषयों के साथ ראה का अर्थ यहाँ केवल देखना नहीं, बल्कि जाँचना या विचार करना है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: सभोपदेशक में חָכְמָה के लिए यह प्रचलित और अर्थानुकूल हिन्दी शब्द है।
- source_word: הוֹלֵלוֹת
  choice: पागलपन
  rationale: यह शब्द विवेकहीन या उन्मत्त व्यवहार का बोध देता है और बुद्धि के साथ तीखा विरोध बनाए रखता है।
- source_word: סִכְלוּת
  choice: मूर्खता
  rationale: यह अविवेक या मूर्खता को व्यक्त करता है और पिछले शब्द 'पागलपन' से भेद बनाए रखता है।
- source_word: מֶה הָאָדָם
  choice: जो मनुष्य ... वह क्या कर सकता है?
  rationale: मूल पदबंध संक्षिप्त और कठिन है। प्रसंग में यह राजा के बाद आने वाले व्यक्ति की सीमित क्षमता पर आलंकारिक प्रश्न है।
- source_word: שֶׁיָּבוֹא אַחֲרֵי הַמֶּלֶךְ
  choice: जो मनुष्य राजा के बाद आएगा
  rationale: भविष्यकालीन क्रिया राजा के बाद आने वाले उत्तराधिकारी की ओर संकेत करती है।
- source_word: אֵת אֲשֶׁר כְּבָר עָשׂוּהוּ
  choice: केवल वही, जो पहले ही किया जा चुका है
  rationale: इब्रानी खंड व्याकरणतः कठिन है; यह चयन प्रसंगानुकूल प्रमुख अर्थ देता है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता सुरक्षित रखती है।
theological_decisions:
- issue: אָדָם का एकवचन, प्रतिनिधिक प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति; आदमी; मानवजाति
  rationale: यहाँ किसी अमूर्त मानवजाति की अपेक्षा राजा के बाद आने वाला एक व्यक्ति दृष्टि में है। 'मनुष्य' व्याकरणिक एकवचन और प्रतिनिधिक अर्थ दोनों बनाए रखता है।
- issue: अंतिम खंड की कठिन व्याकरणिक रचना
  choice: केवल वही, जो पहले ही किया जा चुका है
  alternative: जो कुछ उन्होंने पहले ही उसके साथ/उसे किया है
  rationale: मुख्य पाठ में संभावित प्रसंगानुकूल अर्थ रखा गया है, पर मूल के कर्म-सर्वनाम और बहुवचन कर्ता की अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है; इससे पाठ किसी एक व्याख्या को अनुचित रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और चिंतनशील शैली रखी गई है। 'बुद्धि, पागलपन और मूर्खता' मूल की तीन अलग संज्ञाओं और उनके विरोध को बनाए रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
