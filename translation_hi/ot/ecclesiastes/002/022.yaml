  yaml_path: translation/ot/ecclesiastes/002/022.yaml
  text: For what does a man gain from all his labor and from the striving of his heart with which he toils under the sun?[a]
translation:
  language: hi
  text: क्योंकि मनुष्य को अपने सारे परिश्रम और अपने हृदय की उस लगन से क्या मिलता है, जिसके साथ वह सूर्य के नीचे परिश्रम करता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हृदय की व्याकुलता से,” अथवा “अपने हृदय की धुन/चिंता से।” इब्रानी शब्द רַעְיוֹן सभोपदेशक में भीतरी प्रयास, मानसिक खोज, या व्यग्र उलझन के अर्थ-संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶה הֹוֶה לָאָדָם
  choice: मनुष्य को ... क्या मिलता है
  rationale: शाब्दिक रूप से ‘मनुष्य के लिए क्या होता/आता है’; इस प्रसंग में मुहावरेदार अर्थ यह है कि उसके श्रम से अंततः उसे क्या प्राप्त होता है।
- source_word: לָאָדָם
  choice: मनुष्य को
  rationale: אָדָם यहाँ सामान्य मानव का प्रतिनिधि एकवचन है। ‘मनुष्य’ हिन्दी में गरिमापूर्ण और व्यापक है तथा एकवचन प्रश्न-विन्यास को बनाए रखता है।
- source_word: בְּכָל עֲמָלוֹ
  choice: अपने सारे परिश्रम
  rationale: עָמָל कठिन श्रम या परिश्रम को दर्शाता है; ‘सारे परिश्रम’ उसकी समग्रता को बनाए रखता है। हिन्दी वाक्य में ‘से’ आगे के संयुक्त पदबंध पर लागू होता है।
- source_word: וּבְרַעְיוֹן לִבּוֹ
  choice: और अपने हृदय के उस प्रयास से
  rationale: רַעְיוֹן मानसिक प्रयास, व्यग्र चिंतन, धुन या उलझन का भाव रख सकता है। ‘हृदय का प्रयास’ सक्रिय आंतरिक श्रम को व्यक्त करता है और शब्द की अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
- source_word: לִבּוֹ
  choice: अपने हृदय
  rationale: ‘हृदय’ मूल भाषा की मानव-अंतरंगता संबंधी छवि को बनाए रखता है; यहाँ इसमें विचार और इच्छा भी सम्मिलित हैं।
- source_word: שֶׁהוּא עָמֵל
  choice: जो वह ... करता है
  rationale: सम्बन्धवाचक उपवाक्य हृदय के प्रयास को उसके निरंतर परिश्रम से जोड़ता है। हिन्दी में ‘प्रयास ... करता है’ स्वाभाविक है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक का यह आवर्ती प्रमुख पद पृथ्वी पर मानव जीवन के क्षेत्र को सूचित करता है; इसका पारंपरिक और पारदर्शी रूप सुरक्षित रखा गया है।
