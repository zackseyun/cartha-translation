source:
  edition: WLC
  text: אָמַ֤רְתִּֽי אֲנִי֙ בְּ/לִבִּ֔/י לְכָ/ה נָּ֛א אֲנַסְּ/כָ֛ה בְ/שִׂמְחָ֖ה וּ/רְאֵ֣ה בְ/ט֑וֹב וְ/הִנֵּ֥ה גַם ה֖וּא הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/001.yaml
  text: I said in my heart[a], “Come now, I will test you with pleasure; so enjoy what is good.” But look[c][b], this too is vapor.
translation:
  language: hi
  text: मैंने अपने मन में कहा, “चल, अब मैं तुझे आनंद से परखूँगा; और जो अच्छा है उसका आनंद ले।” पर देख, यह भी वाष्प[a] ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साँस” अथवा “व्यर्थता”; इब्रानी शब्द सभोपदेशक में बार-बार आने वाला उस चीज़ का रूपक है जो क्षणभंगुर या पकड़ में न आने वाली है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי אֲנִי בְּלִבִּי
  choice: मैंने अपने मन में कहा
  rationale: यह हृदय के भीतर स्वयं से बात करने का इब्रानी मुहावरा है। ‘अपने मन में कहा’ उसके आंतरिक आत्म-संवाद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְכָה נָּא
  choice: आ, अब
  rationale: यह स्वयं को आगे बढ़ने के लिए उकसाने वाला मुहावरेदार आह्वान है। ‘आ, अब’ आग्रह और तत्परता दोनों को संक्षेप में रखता है।
- source_word: אֲנַסְּכָה
  choice: मैं ... तुझे परखूँगा
  rationale: נסה का मूल अर्थ जाँचना या परखना है। द्वितीय पुरुष रूप को बनाए रखने से अपने ही मन/स्व को प्रयोग का विषय बनाने की छवि सुरक्षित रहती है।
- source_word: בְשִׂמְחָה
  choice: आनंद के द्वारा
  rationale: שִׂמְחָה हर्ष, आनंद अथवा उल्लास को सूचित करता है। प्रसंग में आनंद वह साधन या अनुभव है जिसके द्वारा वक्ता स्वयं को परखता है।
- source_word: וּרְאֵה בְטוֹב
  choice: इसलिए भलाई का सुख ले
  rationale: शाब्दिक रूप ‘और भलाई देख’ है, पर ‘भलाई देखना’ यहाँ उसका अनुभव करना या उसका सुख लेना है। हिन्दी में यह अर्थ स्पष्ट करते हुए ‘भलाई’ की नैतिक और अनुभवगत व्यापकता बनाए रखी गई है।
- source_word: וְהִנֵּה
  choice: पर देख
  rationale: הִנֵּה ध्यान खींचकर निष्कर्ष प्रस्तुत करता है। प्रसंगगत विरोध को ‘पर’ और आधुनिक आह्वान को ‘देख’ व्यक्त करते हैं।
- source_word: גַם הוּא
  choice: यह भी
  rationale: यह तुरंत पहले बताए गए आनंद और भलाई के प्रयोग की ओर संकेत करता है।
- source_word: הָבֶל
  choice: भाप
  rationale: הֶבֶל मूलतः साँस, वाष्प या भाप जैसी क्षणभंगुर और पकड़ में न आने वाली वस्तु का बिंब है। ‘भाप’ ठोस रूपक को बनाए रखता है और ‘व्यर्थ’ जैसे एकार्थी निष्कर्ष से बचता है।
theological_decisions:
- issue: सभोपदेशक में הָבֶל का अनुवाद
  choice: भाप
  alternative: व्यर्थता; साँस; निरर्थक
  rationale: पुस्तक में यह बार-बार आने वाला रूपक क्षणभंगुरता, अस्थिरता और पकड़ में न आने के भावों को एक साथ खुला रखता है। ‘भाप’ इस तनाव को सुरक्षित रखता है; ‘निरर्थक’ पाठ का अर्थ पहले ही तय कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आंतरिक आत्म-संवाद और द्वितीय पुरुष ‘तुझे’ को मूल की असामान्य किंतु अर्थपूर्ण संरचना के कारण बनाए रखा गया है। केवल वास्तविक अनुवाद-विकल्प के लिए पाद-टिप्पणी दी गई है और उसका चिह्न मुख्य पाठ में उपस्थित है।
