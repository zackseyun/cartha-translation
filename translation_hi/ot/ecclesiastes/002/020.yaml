  register: आधुनिक मानक हिंदी; शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। “अपने मन को निराशा में डाल दिया” थोड़ी असामान्य पर जानबूझकर स्रोत-समीपी अभिव्यक्ति है, जबकि पादटिप्पणी अधिक स्वाभाविक वैकल्पिक अर्थ देती है।
