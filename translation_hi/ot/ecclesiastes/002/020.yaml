  yaml_path: translation/ot/ecclesiastes/002/020.yaml
  text: So I turned to despair in my heart over all the labor at which I had labored under the sun[a][b].
translation:
  language: hi
  text: तब मैंने अपने मन को उस सारे परिश्रम को लेकर निराश कर दिया, जो मैंने सूर्य के नीचे किया था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब मैंने अपने मन को निराश कर दिया” अथवा “तब मैंने मन ही मन हार मान ली।” हिब्रानी मुहावरा संक्षिप्त है और इसके कई निकट अर्थ संभव हैं।
    reason: lexical_alternative
  - marker: b
    text: “सूर्य के नीचे” सभोपदेशक में बार-बार आने वाला पदबंध है, जो वर्तमान संसार और उसके सांसारिक जीवन-क्षेत्र की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: וְסַבּוֹתִי
  choice: इसलिए मैंने ... डाल दिया
  rationale: סבב का यह प्रयोग विचार या रुख में बदलाव दिखाता है। हिंदी वाक्य में परिणामसूचक “इसलिए” और मुख्य क्रिया के साथ यह बदलाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְיַאֵשׁ אֶת־לִבִּי
  choice: अपने मन को ... निराशा में डाल दिया
  rationale: हिब्रानी रचना सकर्मक है—वक्ता अपने ‘हृदय’ को निराश करता या निराशा के हवाले करता है। “मन” यहाँ भीतरी व्यक्ति, विचार और भाव को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है; अनुवाद जानबूझकर इस कारणवाचक तनाव को बनाए रखता है।
- source_word: עַל
  choice: के कारण
  rationale: यहाँ עַל उस विषय या कारण को प्रस्तुत करता है जिसके चलते निराशा हुई। हिंदी में “के कारण” संबंध को स्पष्ट और सहज रखता है।
- source_word: כָּל־הֶעָמָל שֶׁעָמַלְתִּי
  choice: उस सारे परिश्रम ... जो मैंने ... किया था
  rationale: עָמָל श्रम की कठिन और बोझिल प्रकृति सूचित करता है। “परिश्रम” गरिमापूर्ण और सामान्य हिंदी है। संज्ञा-क्रिया की हिब्रानी पुनरुक्ति हिंदी में अक्षरशः दोहराने पर अस्वाभाविक होती, इसलिए अर्थ को सहज वाक्य में रखा गया है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक का बार-बार आने वाला प्रमुख पदबंध है; इसे निकट और सुसंगत रूप में सुरक्षित रखा गया है।
