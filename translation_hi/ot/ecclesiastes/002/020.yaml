- from: इसलिए मैंने अपने मन को उस सारे परिश्रम के कारण निराशा में डाल दिया, जो मैंने सूर्य के नीचे किया था।[a][b]
  to: तब मैंने अपने मन को उस सारे परिश्रम को लेकर निराश कर दिया, जो मैंने सूर्य के नीचे किया था।[a][b]
  rationale: The revision replaces the overly inferential connective with a sequential-turning expression, renders the object of despair more broadly as “को लेकर,” and uses a more natural causative Hindi expression. It also corrects the grammar of the lexical-alternative footnote while retaining the source's compact ambiguity.
