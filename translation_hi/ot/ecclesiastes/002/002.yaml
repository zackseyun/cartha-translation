  yaml_path: translation/ot/ecclesiastes/002/002.yaml
  text: I said of laughter[a], “It is madness,” and of pleasure, “What does this accomplish?”
translation:
  language: hi
  text: हँसी के विषय में मैंने कहा, “यह पागलपन है,” और आनंद के विषय में, “यह क्या करता है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे हँसी, मैंने कहा, ‘तू पागल है,’ और हे आनंद, ‘तू क्या करता है?’”
    reason: לִשְׂחוֹק और וּלְשִׂמְחָה को संबोधन के रूप में भी समझा जा सकता है, और מְהוֹלָל को विशेषण रूप में अनूदित किया जा सकता है।
lexical_decisions:
- source_word: לִשְׂחוֹק
  choice: हँसी के विषय में
  rationale: שְׂחוֹק का अर्थ हँसी या विनोद है। אמר के साथ ל उस विषय को चिह्नित कर सकता है जिसके बारे में कुछ कहा जा रहा है; इसलिए आधुनिक हिन्दी में ‘के विषय में’ स्वाभाविक है।
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: यह אמר का सरल काल पूर्ण, प्रथम पुरुष एकवचन रूप है। पद में ‘अपने आप से’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: מְהוֹלָל
  choice: यह पागलपन है
  rationale: यह शब्द मूर्ख, उन्मत्त या पागल होने का भाव व्यक्त करता है। हिन्दी में हँसी पर मूल्यांकन के रूप में ‘यह पागलपन है’ स्वाभाविक है और मूल की तीखी नकारात्मकता बनाए रखता है।
- source_word: וּלְשִׂמְחָה
  choice: और आनंद के विषय में
  rationale: שִׂמְחָה आनंद, प्रसन्नता या सुख-भोग को सूचित कर सकता है। संदर्भ में आनंद की परख हो रही है; ‘आनंद’ मूल शब्द की व्यापकता और धार्मिक रूप से तटस्थ भाव को बनाए रखता है।
- source_word: מַה זֹּה עֹשָׂה
  choice: यह क्या करता है?
  rationale: शाब्दिक प्रश्न ‘यह क्या करता है?’ आनंद के प्रभाव, परिणाम या उपयोगिता के बारे में मूल की खुली और अलंकारिक पूछताछ को बिना ‘लाभ’ जैसी अतिरिक्त धारणा जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: आनंद के मूल्य के बारे में प्रश्न की सीमा
  choice: 'प्रश्न को खुला रखा गया: ‘यह क्या करता है?’'
  alternative: ‘इससे क्या लाभ होता है?’
  rationale: ‘लाभ’ संदर्भगत अर्थ हो सकता है, पर वह मूल के व्यापक עשה (‘करना/बनाना’) को एक विशेष निष्कर्ष तक सीमित कर देता है। खुला प्रश्न सभोपदेशक की जानबूझकर रखी गई तनावपूर्ण पूछताछ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर इब्रानी रचना को ‘के विषय में’ की पुनरावृत्ति से सुरक्षित रखा गया है; मुख्य पाठ अर्थ-केंद्रित है, जबकि संबोधन वाला अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
