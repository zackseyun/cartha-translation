  choice: मैंने अपने लिए ... बनाए
  rationale: עשה के प्रथम पुरुष एकवचन और लाभ/स्वामित्व सूचक לִי को स्वाभाविक हिन्दी में अलग रखते हुए आत्म-केंद्रित उपलब्धि का भाव सुरक्षित किया गया है।
- source_word: בְּרֵכוֹת מָיִם
  choice: पानी के जलाशय
  rationale: בְּרֵכוֹת पानी एकत्र करने वाले तालों अथवा जलाशयों को दर्शाता है। सिंचाई के संदर्भ में ‘जलाशय’ उद्देश्यपूर्ण जल-संग्रह को स्पष्ट करता है, जबकि मूल से आगे नहीं जाता।
- source_word: לְהַשְׁקוֹת מֵהֶם
  choice: ताकि उनसे ... सींचूँ
  rationale: שקה का हिफ़ील रूप पानी देने/सींचने का अर्थ देता है और מֵהֶם उन जलाशयों को जल के स्रोत के रूप में इंगित करता है। हिन्दी में ‘उनसे सींचूँ’ संक्षिप्त और स्वाभाविक है।
- source_word: יַעַר
  choice: वनखंड
  rationale: יַעַר का सामान्य अर्थ वन या वृक्षाच्छादित क्षेत्र है। सिंचित और विकसित परिसर के संदर्भ में ‘वनखंड’ मूल के वनार्थ को बचाते हुए नियंत्रित वृक्ष-क्षेत्र के लिए उपयुक्त है।
- source_word: צוֹמֵחַ עֵצִים
  choice: जिसमें पेड़ उग रहे थे
  rationale: यह पदबंध वृक्षों के बढ़ने/उगने की जारी अवस्था बताता है। संबंधवाचक उपवाक्य हिन्दी में अस्पष्ट हिब्रू संरचना का स्वाभाविक अर्थ देता है।
