  text: וְ/כֹל֙ אֲשֶׁ֣ר שָֽׁאֲל֣וּ עֵינַ֔/י לֹ֥א אָצַ֖לְתִּי מֵ/הֶ֑ם לֹֽא מָנַ֨עְתִּי אֶת לִבִּ֜/י מִ/כָּל שִׂמְחָ֗ה כִּֽי לִבִּ֤/י שָׂמֵ֨חַ֙ מִ/כָּל עֲמָלִ֔/י וְ/זֶֽה הָיָ֥ה חֶלְקִ֖/י מִ/כָּל עֲמָלִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/010.yaml
  text: And whatever my eyes desired I did not withhold from them[a]; I did not keep my heart from any pleasure, for my heart rejoiced in all my labor[c][b], and this was my portion from all my labor.
translation:
  language: hi
  text: मेरी आँखों ने जो कुछ चाहा, उससे मैंने उन्हें वंचित नहीं रखा[a]। मैंने अपने हृदय को किसी भी आनंद से नहीं रोका[b], क्योंकि मेरा हृदय अपने सारे परिश्रम में आनंदित रहा; और मेरे सारे परिश्रम से यही मेरा भाग था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आँखों ने जो कुछ माँगा, उससे मैंने उन्हें वंचित नहीं रखा।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने अपने हृदय को किसी भी खुशी से वंचित नहीं रखा।”
    reason: lexical_alternative
  - marker: c
    text: दोनों स्थानों पर “परिश्रम” का अनुवाद “कठिन मेहनत” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ עֵינַי
  choice: मेरी आँखों ने जो कुछ चाहा
  rationale: שׁאל का मूल अर्थ ‘माँगना’ है, पर आँखों के कर्ता होने पर यह दृश्य लालसा या इच्छा का मुहावरा है। ‘चाहा’ स्वाभाविक हिन्दी में अर्थ देता है और ‘आँखों’ की मूल छवि भी बनाए रखता है।
- source_word: לֹא אָצַלְתִּי מֵהֶם
  choice: उसे मैंने उनसे दूर नहीं रखा
  rationale: אָצַל यहाँ रोक रखने या वंचित रखने का भाव देता है। ‘उनसे’ का संबंध आँखों से रखकर इब्रानी वाक्य-विन्यास और मानवीकरण सुरक्षित रखा गया है।
- source_word: לֹא מָנַעְתִּי אֶת לִבִּי
  choice: मैंने अपने हृदय को ... नहीं रोका
  rationale: מנע रोकने या वंचित रखने को व्यक्त करता है। ‘हृदय’ मूल पाठ में भीतरी व्यक्ति और अनुभव के केंद्र की छवि को सुरक्षित रखता है।
- source_word: שִׂמְחָה
  choice: आनंद
  rationale: संदर्भ में यह उपभोग से मिलने वाले सुख और हर्ष दोनों को समेटता है; ‘आनंद’ आधुनिक, गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: לִבִּי שָׂמֵחַ
  choice: मेरा हृदय ... आनंदित हुआ
  rationale: यह हृदय को हर्ष के केंद्र के रूप में बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: עֲמָלִי
  choice: मेरा सारा परिश्रम
  rationale: עָמָל मेहनत के साथ उसकी कठिनता और श्रमसाध्यता का भाव भी रखता है। ‘परिश्रम’ दोनों occurrences में सुसंगत रूप से प्रयुक्त है।
- source_word: חֶלְקִי
  choice: मेरा भाग
  rationale: חֵלֶק उस हिस्से या प्रतिफल को दर्शाता है जो किसी को प्राप्त होता है। ‘भाग’ सभोपदेशक की चिंतनशील भाषा और अर्थगत खुलापन बनाए रखता है।
