- from: मेरी आँखों ने जो कुछ चाहा, उसे मैंने उनसे दूर नहीं रखा[a]। मैंने अपने हृदय को किसी भी आनंद से नहीं रोका[b], क्योंकि मेरा हृदय मेरे सारे परिश्रम से आनंदित हुआ; और मेरे सारे परिश्रम से मिला मेरा भाग यही था[c]।
  to: मेरी आँखों ने जो कुछ चाहा, उससे मैंने उन्हें वंचित नहीं रखा[a]। मैंने अपने हृदय को किसी भी आनंद से नहीं रोका[b], क्योंकि मेरा हृदय अपने सारे परिश्रम में आनंदित रहा; और मेरे सारे परिश्रम से यही मेरा भाग था[c]।
  rationale: 'The revision improves idiomatic Hindi while retaining the Hebrew’s anthropomorphic imagery: the eyes are not deprived of what they desire, and the heart is not restrained from joy. It also renders rejoicing as taking place in the sphere of all the speaker’s labor and makes the concluding demonstrative (‘this’) explicit. Footnote anchors and the lexical alternatives are retained and aligned with their respective clauses.'
