source:
  edition: WLC
  text: וְ/רָאִ֣יתִי אָ֔נִי שֶׁ/יֵּ֥שׁ יִתְר֛וֹן לַֽ/חָכְמָ֖ה מִן הַ/סִּכְל֑וּת כִּֽ/יתְר֥וֹן הָ/א֖וֹר מִן הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/013.yaml
  text: And I saw that wisdom has an advantage over folly[a], as light has an advantage over darkness.
translation:
  language: hi
  text: और मैंने स्वयं देखा कि बुद्धि को मूर्खता पर उतनी ही बढ़त है, जितनी प्रकाश को अंधकार पर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאִיתִי אָ֔נִי
  choice: और मैंने देखा
  rationale: रָאִיתִי अनुभव से प्राप्त निरीक्षण को व्यक्त करता है। स्वतंत्र सर्वनाम אָ֔נִי बल देता है, पर हिन्दी में अलग से ‘मैंने स्वयं’ कहना यहाँ अस्वाभाविक रूप से भारी होता; सामान्य कर्ता-रचना प्रसंगानुसार पर्याप्त है।
- source_word: שֶׁיֵּ֥שׁ יִתְר֛וֹן לַֽחָכְמָ֖ה
  choice: कि ... बुद्धि का लाभ है
  rationale: יֵשׁ अस्तित्व बताता है और לַחָכְמָה उस लाभ को बुद्धि से सम्बद्ध करता है। ‘लाभ’ יִתְרוֹן के अतिरिक्तता, प्राप्ति और श्रेष्ठता के अर्थ-क्षेत्र को संक्षेप में रखता है।
- source_word: מִן הַסִּכְל֑וּת
  choice: मूर्खता की अपेक्षा
  rationale: तुलनात्मक מִן को स्वाभाविक हिन्दी ‘की अपेक्षा’ से व्यक्त किया गया है; סִכְלוּת के लिए ‘मूर्खता’ सीधा और वर्तमान प्रयोग है।
- source_word: כִּֽיתְר֥וֹן הָא֖וֹר מִן הַחֹֽשֶׁךְ
  choice: जैसे अन्धकार की अपेक्षा प्रकाश का लाभ है
  rationale: כְּ तुलना प्रस्तुत करता है। हिन्दी में तुलना का क्रम स्वाभाविक बनाने के लिए ‘अन्धकार की अपेक्षा प्रकाश’ रखा गया, जबकि इब्रानी का समानान्तर भाव और יִתְרוֹן की पुनरावृत्ति सुरक्षित है।
theological_decisions:
- issue: יִתְרוֹן में आर्थिक ‘मुनाफ़ा’ और सामान्य तुलनात्मक श्रेष्ठता के बीच अर्थ
  choice: लाभ
  alternative: बढ़त; मुनाफ़ा
  rationale: प्रकाश और अन्धकार की उपमा यहाँ सामान्य श्रेष्ठता या उपयोगिता दिखाती है। ‘लाभ’ शब्द इब्रानी की प्राप्ति/फ़ायदे की छाया बनाए रखता है, पर अर्थ को केवल आर्थिक मुनाफ़े तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘की अपेक्षा’ से दोनों तुलनाएँ स्पष्ट और समानान्तर रखी गई हैं; ‘अन्धकार’ का मानक साहित्यिक रूप अपनाया गया है।
