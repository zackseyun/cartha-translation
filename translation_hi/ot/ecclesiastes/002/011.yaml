  text: וּ/פָנִ֣יתִֽי אֲנִ֗י בְּ/כָל מַעֲשַׂ/י֙ שֶֽׁ/עָשׂ֣וּ יָדַ֔/י וּ/בֶֽ/עָמָ֖ל שֶׁ/עָמַ֣לְתִּי לַ/עֲשׂ֑וֹת וְ/הִנֵּ֨ה הַ/כֹּ֥ל הֶ֨בֶל֙ וּ/רְע֣וּת ר֔וּחַ וְ/אֵ֥ין יִתְר֖וֹן תַּ֥חַת הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/011.yaml
  text: Then I turned to consider all the works that my hands had done[a], and the labor that I had labored to do; and behold, all was vanity and a chasing after wind[c][b], and there was no profit under the sun.
translation:
  language: hi
  text: तब मैंने मुड़कर उन सब कामों पर विचार किया जिन्हें मेरे हाथों ने किया था, और उस परिश्रम पर भी जो मैंने करने के लिए किया था। और देखो, सब कुछ व्यर्थ[a] था और हवा का पीछा करने जैसा[b] था; सूर्य के नीचे कोई लाभ[c] नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाष्प” अथवा “साँस”; इब्रानी शब्द हेवेल प्रायः उस बात को दर्शाता है जो क्षणभंगुर, असार, या निराशाजनक रूप से पकड़ में न आने वाली होती है।
    reason: lexical_alternative
  - marker: b
    text: या “हवा के पीछे प्रयत्न करना।” इब्रानी मुहावरा निष्फल प्रयास या पीछा करने का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: c
    text: या “प्राप्ति” अथवा “बढ़त”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָנִיתִי
  choice: तब मैंने मुड़कर ... विचार किया
  rationale: क्रिया का मूल अर्थ ‘मुड़ना’ है, जबकि प्रसंग में यह अपने किए हुए कामों का चिंतनपूर्ण मूल्यांकन करने की ओर मुड़ने को दर्शाती है। हिंदी में यह रूप दोनों बातों को बनाए रखता है।
- source_word: מַעֲשַׂי שֶׁעָשׂוּ יָדַי
  choice: उन सब कामों ... जिन्हें मेरे हाथों ने किया था
  rationale: यह अनुवाद ‘मेरे हाथों’ की ठोस इब्रानी अभिव्यक्ति और वक्ता की निजी भूमिका पर दिए गए बल को सुरक्षित रखता है।
- source_word: וּבֶעָמָל שֶׁעָמַלְתִּי
  choice: और उस परिश्रम पर भी जो मैंने ... किया था
  rationale: संज्ञा और उसी मूल की क्रिया से बनी इब्रानी पुनरुक्ति को हिंदी में ‘परिश्रम’ और ‘किया’ के स्वाभाविक संयोजन द्वारा अर्थपूर्ण ढंग से व्यक्त किया गया है; कृत्रिम ‘जिस परिश्रम को मैंने परिश्रम किया’ से बचा गया है।
- source_word: הֶבֶל
  choice: व्यर्थ
  rationale: यह सभोपदेशक का प्रमुख बहुअर्थी शब्द है, जिसमें क्षणभंगुरता, असारता और निष्फलता के भाव हैं। ‘व्यर्थ’ इस प्रसंग के मूल्यांकन को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘वाष्प/साँस’ की ठोस छवि पादटिप्पणी में सुरक्षित है।
- source_word: וּרְעוּת רוּחַ
  choice: और हवा का पीछा करना
  rationale: यह मुहावरा ऐसे प्रयत्न की तस्वीर देता है जिसका फल हाथ नहीं आता। ‘हवा का पीछा करना’ आधुनिक हिंदी में उस चित्र और निष्फलता दोनों को स्पष्ट रखता है।
- source_word: וְאֵין יִתְרוֹן
  choice: कोई लाभ नहीं था
  rationale: יִתְרוֹן किसी बची हुई बढ़त, प्राप्ति या लाभ को दर्शाता है। ‘लाभ’ पुस्तक के मूल्यांकनात्मक स्वर के अनुकूल और सामान्य हिंदी में स्पष्ट है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की इस आवर्ती और विषयगत अभिव्यक्ति को उसके ठोस रूप में रखा गया है।
theological_decisions:
- issue: सभोपदेशक में הֶבֶל का अनुवाद
  choice: व्यर्थ
  alternative: वाष्प; साँस; असार
  rationale: शब्द को केवल ‘अर्थहीन’ कहना मूल से अधिक व्यापक निरर्थकता का दावा कर सकता है। ‘व्यर्थ’ इस पद में निष्फलता को व्यक्त करता है, और पादटिप्पणी शब्द की क्षणभंगुर तथा पकड़ में न आने वाली छवि को बनाए रखती है।
- issue: רְעוּת רוּחַ की अस्पष्ट छवि
  choice: हवा का पीछा करना
  alternative: हवा के पीछे प्रयत्न करना; हवा को चराना
  rationale: इब्रानी अभिव्यक्ति की व्युत्पत्ति/समझ में पीछा करने, प्रयत्न करने या चराने की छवियाँ प्रस्तावित हैं। मुख्य पाठ में सहज मुहावरे द्वारा निष्फल प्रयास व्यक्त किया गया है और विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और देखो’ मूल के וְהִנֵּה की अचानक निष्कर्ष प्रस्तुत करने वाली शक्ति को बनाए रखता है। ‘मेरे हाथों’ और ‘सूर्य के नीचे’ जैसी पुस्तक की ठोस, आवर्ती अभिव्यक्तियाँ सुरक्षित रखी गई हैं।
