source:
  edition: WLC
  text: וְ/שָׂנֵ֤אתִֽי אֲנִי֙ אֶת כָּל עֲמָלִ֔/י שֶׁ/אֲנִ֥י עָמֵ֖ל תַּ֣חַת הַ/שָּׁ֑מֶשׁ שֶׁ֣/אַנִּיחֶ֔/נּוּ לָ/אָדָ֖ם שֶׁ/יִּהְיֶ֥ה אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/018.yaml
  text: And I hated all my labor in which I toiled under the sun[a], because I must leave it to the man who will come after me.
translation:
  language: hi
  text: और मैंने अपने उस सारे परिश्रम से घृणा की, जिसमें मैं सूर्य के नीचे परिश्रम करता रहा, क्योंकि मुझे उसे उस मनुष्य[a] को छोड़ जाना होगा जो मेरे बाद होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी मनुष्य को, जो मेरे बाद होगा।”
    reason: לָאָדָם में लेखयुक्त विशिष्ट ‘उस मनुष्य’ और सामान्य/अनिश्चित ‘किसी मनुष्य’—दोनों अर्थ-संभावनाएँ हैं।
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: और मैंने ... से घृणा की
  rationale: क़ाल पूर्ण, प्रथम पुरुष एकवचन, वक्ता की दृढ़ प्रतिक्रिया व्यक्त करता है। आरंभिक וְ को सामान्य कथानक-संबंध ‘और’ से रखा गया है।
- source_word: כָּל־עֲמָלִי ... שֶׁאֲנִי עָמֵל
  choice: अपने उस सारे परिश्रम ... जिसके लिए मैंने ... परिश्रम किया था
  rationale: संज्ञा עָמָל और उसी मूल की क्रिया की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी ‘परिश्रम’ दोहराकर सुरक्षित रखा गया है; भूतकालीन प्रसंग में ‘किया था’ स्वाभाविक है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट और पहचानी जाने वाली अभिव्यक्ति का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: שֶׁאַנִּיחֶנּוּ
  choice: क्योंकि मुझे उसे ... छोड़ जाना होगा
  rationale: हिफ़ील रूप यहाँ ‘छोड़ जाना’ बताता है। प्रसंग मृत्यु और उत्तराधिकार की अनिवार्यता दिखाता है, इसलिए ‘मुझे ... होगा’ उपयुक्त है; שֶׁ को कारणसूचक ‘क्योंकि’ समझा गया है।
- source_word: לָאָדָם
  choice: उस मनुष्य के लिए
  rationale: लेखयुक्त एकवचन אָדָם को एक विशेष मानवीय उत्तराधिकारी के रूप में रखा गया है। हिन्दी में ‘उस मनुष्य’ आगामी संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: שֶׁיִּהְיֶה אַחֲרָי
  choice: जो मेरे बाद होगा
  rationale: इब्रानी के शाब्दिक और किंचित खुले अर्थ ‘जो मेरे बाद होगा’ को सुरक्षित रखा गया है; ‘मेरा उत्तराधिकारी होगा’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: אָדָם का विशिष्ट अथवा अनिश्चित अर्थ
  choice: उस मनुष्य
  alternative: किसी मनुष्य
  rationale: लेख הַ एक विशिष्ट भाव का समर्थन करता है और अगला उपवाक्य उस व्यक्ति को चिह्नित करता है। फिर भी אָדָם सामान्य/अनिश्चित व्यक्ति को भी सूचित कर सकता है, इसलिए वैकल्पिक पाठ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। मूल की ‘परिश्रम’ वाली पुनरावृत्ति जानबूझकर रखी गई है और उत्तराधिकारी के अर्थ को स्पष्ट करने के बजाय ‘मेरे बाद होगा’ की मूल अस्पष्टता सुरक्षित रखी गई है।
