source:
  edition: WLC
  text: כִּ֤י לְ/אָדָם֙ שֶׁ/טּ֣וֹב לְ/פָנָ֔י/ו נָתַ֛ן חָכְמָ֥ה וְ/דַ֖עַת וְ/שִׂמְחָ֑ה וְ/לַ/חוֹטֶא֩ נָתַ֨ן עִנְיָ֜ן לֶ/אֱס֣וֹף וְ/לִ/כְנ֗וֹס לָ/תֵת֙ לְ/טוֹב֙ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֔ים גַּם זֶ֥ה הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/026.yaml
  text: For to the man who is good before him he has given wisdom and knowledge and joy[a], but to the sinner he has given the task of gathering and collecting, to give to the one who is good before God[b]. This too is vanity and a chasing after wind.
translation:
  language: hi
  text: क्योंकि जो मनुष्य उसकी दृष्टि में अच्छा है[a], उसे उसने बुद्धि, ज्ञान और आनन्द दिया है; परन्तु पापी को उसने बटोरने और जमा करने का काम दिया है, ताकि वह उसे परमेश्वर की दृष्टि में अच्छे व्यक्ति को दे दे। यह भी व्यर्थता और हवा के पीछे भागना है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसे प्रसन्न करता है,” अर्थात् “जो परमेश्वर को प्रसन्न करता है।” इब्रानी में शाब्दिक अर्थ है, “जो उसके सामने अच्छा है।”
    reason: alternative_reading
  - marker: b
    text: या, “हवा के पीछे दौड़ना है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: मनुष्य को / जो मनुष्य
  rationale: यहाँ एक व्यक्ति का उल्लेख पापी के साथ विरोध में है। ‘मनुष्य’ आधुनिक मानक हिन्दी में स्वाभाविक है और इब्रानी के व्यक्तिगत, प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: שֶׁטּוֹב לְפָנָיו
  choice: जो उसकी दृष्टि में अच्छा है
  rationale: यह इब्रानी के शाब्दिक मूल्यांकन, ‘उसके सामने अच्छा’, को स्वाभाविक हिन्दी मुहावरे में रखता है और ‘उसे प्रसन्न करता है’ अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: נָתַן
  choice: दिया है
  rationale: पूर्ण क्रिया को उपदेशक के चिंतनात्मक, सामान्य सत्य वाले कथन के अनुरूप वर्तमान पूर्ण रूप में व्यक्त किया गया है।
- source_word: חָכְמָה וְדַעַת וְשִׂמְחָה
  choice: बुद्धि, ज्ञान और आनन्द
  rationale: तीनों संज्ञाओं के सीधे और प्रचलित हिन्दी समतुल्य चुने गए हैं; ‘आनन्द’ परमेश्वर से मिलने वाले जीवन-सुख की पुस्तकगत थीम के अनुकूल है।
- source_word: לַחוֹטֶא
  choice: पापी को
  rationale: संज्ञात्मक कृदन्त यहाँ केवल एक पाप-कर्म नहीं, बल्कि पापी व्यक्ति को भले मनुष्य के विपरीत प्रस्तुत करता है।
- source_word: עִנְיָן
  choice: काम
  rationale: इस प्रसंग में यह सौंपे गए कार्य या व्यस्तता को दर्शाता है। ‘काम’ सामान्य पाठक के लिए स्पष्ट है; ‘बोझ’ कहना नकारात्मक भाव को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: לֶאֱסוֹף וְלִכְנוֹס
  choice: बटोरने और जमा करने
  rationale: निकटार्थी क्रियाओं की जोड़ी संचय पर बल देती है। हिन्दी में यह युग्म पुनरुक्ति और क्रमिक संचय दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָתֵת לְטוֹב לִפְנֵי הָאֱלֹהִים
  choice: ताकि वह उसे दे दे जो परमेश्वर की दृष्टि में अच्छा है
  rationale: उद्देश्यसूचक infinitive को स्पष्ट हिन्दी उपवाक्य में व्यक्त किया गया है और पहले आए ‘दृष्टि में अच्छा’ वाक्यांश की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: הֶבֶל
  choice: व्यर्थता
  rationale: यह उपदेशक का प्रमुख विषयगत शब्द है। ‘व्यर्थता’ अस्थिरता और निष्फलता दोनों का संकेत देता है, जबकि ‘अर्थहीनता’ अत्यधिक निर्णायक होती।
- source_word: רְעוּת רוּחַ
  choice: हवा के पीछे भागना
  rationale: यह असम्भव और निष्फल प्रयत्न का रूपक स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; इब्रानी पद की दुर्लभता के कारण निकट वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: נָתַן (‘दिया है’) का निहित कर्ता
  choice: पूरे पद में परमेश्वर निहित देने वाला है
  alternative: अव्यक्त या सामान्य कर्ता
  rationale: 2:24 में ‘परमेश्वर के हाथ’ का निकट संदर्भ और इसी पद में परमेश्वर का स्पष्ट उल्लेख इस पाठ को सबसे उपयुक्त बनाते हैं। फिर भी प्रथम खंड में इब्रानी की सर्वनामात्मक अभिव्यक्ति को रखते हुए नाम अनावश्यक रूप से नहीं जोड़ा गया।
- issue: טוב לפניו / טוב לפני האלהים का अर्थ
  choice: उसकी/परमेश्वर की दृष्टि में अच्छा
  alternative: उसे/परमेश्वर को प्रसन्न करने वाला
  rationale: इब्रानी मुहावरा प्रसन्न करने का भाव दे सकता है, पर मुख्य पाठ ‘अच्छा’ के नैतिक-मूल्यांकनात्मक शब्द को सुरक्षित रखता है और संभावित व्याख्या को पादटिप्पणी में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल पर गरिमापूर्ण रखी गई है। ‘उसकी दृष्टि में अच्छा’ और ‘परमेश्वर की दृष्टि में अच्छा’ के बीच इब्रानी की पुनरावृत्ति तथा पहले उल्लेख में निहित संदर्भ सुरक्षित है। सभी पादटिप्पणी-चिह्न संबंधित पदांशों पर लगाए गए हैं।
