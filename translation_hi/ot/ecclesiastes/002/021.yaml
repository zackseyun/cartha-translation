source:
  edition: WLC
  text: כִּי יֵ֣שׁ אָדָ֗ם שֶׁ/עֲמָל֛/וֹ בְּ/חָכְמָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כִשְׁר֑וֹן וּ/לְ/אָדָ֞ם שֶׁ/לֹּ֤א עָֽמַל בּ/וֹ֙ יִתְּנֶ֣/נּוּ חֶלְק֔/וֹ גַּם זֶ֥ה הֶ֖בֶל וְ/רָעָ֥ה רַבָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/021.yaml
  text: For there is a man whose labor is with wisdom and with knowledge and with skill[a], yet he must give his portion to a man who has not labored in it[b]. This also is vapor and a great evil.
translation:
  language: hi
  text: क्योंकि एक मनुष्य है जो बुद्धि, ज्ञान और कौशल से परिश्रम[a] करता है, फिर भी उसे अपना भाग ऐसे मनुष्य को देना पड़ता है जिसने उसमें परिश्रम नहीं किया। यह भी भाप[b] है और बहुत बड़ी बुराई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कठिन परिश्रम।” सभोपदेशक में इब्रानी शब्द עָמָל प्रायः थका देने वाले श्रम का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: “व्यर्थता।” यहाँ अनूदित इब्रानी शब्द הֶבֶל का मूल अर्थ “भाप” या “साँस” है और यह किसी क्षणभंगुर, अस्थिर या पकड़ से बाहर वस्तु का बिंब प्रस्तुत करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विचार का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: יֵשׁ אָדָם
  choice: कोई मनुष्य
  rationale: यह इब्रानी मुहावरा एक व्यक्तिगत उदाहरण सामने रखता है; आधुनिक हिन्दी में ‘कोई मनुष्य’ स्वाभाविक है।
- source_word: עֲמָלוֹ / עָמַל
  choice: परिश्रम करता है / परिश्रम नहीं किया
  rationale: עָמָל में श्रम के साथ थकानेवाले कठिन परिश्रम का भाव भी हो सकता है; ‘परिश्रम’ पठनीय रहते हुए इस बल को बनाए रखता है।
- source_word: בְּחָכְמָה וּבְדַעַת וּבְכִשְׁרוֹן
  choice: बुद्धि, ज्ञान और कौशल से
  rationale: तीनों अलग गुणों को बनाए रखा गया है और בְּ को कार्य करने की रीति बतानेवाले ‘से’ द्वारा व्यक्त किया गया है।
- source_word: וּלְאָדָם שֶׁלֹּא עָמַל בּוֹ
  choice: उस मनुष्य को ... जिसने उसमें परिश्रम नहीं किया
  rationale: ‘उसमें’ בּוֹ की संदर्भगत अस्पष्टता को बनाए रखता है; यह परिश्रम, काम या उससे उपजी संपत्ति की ओर संकेत कर सकता है।
- source_word: יִתְּנֶנּוּ חֶלְקוֹ
  choice: उसे अपना भाग ... देना पड़ता है
  rationale: संदर्भ में क्रिया केवल भविष्य नहीं, बल्कि मृत्यु के कारण उत्पन्न अनिवार्यता व्यक्त करती है; ‘देना पड़ता है’ उस भाव को स्पष्ट करता है।
- source_word: הֶבֶל
  choice: भाप
  rationale: ठोस इब्रानी बिंब को सुरक्षित रखा गया है—ऐसी वस्तु जो क्षणभंगुर, पकड़ से बाहर और अस्थिर है।
- source_word: רָעָה רַבָּה
  choice: बहुत बड़ी बुराई
  rationale: यह स्थिति की गंभीर नकारात्मक और नैतिक-अस्तित्वगत विवेचना को बनाए रखता है; इसे केवल दुर्भाग्य तक सीमित नहीं करता।
theological_decisions:
- issue: सभोपदेशक में הֶבֶל का अनुवाद
  choice: भाप
  alternative: व्यर्थता
  rationale: ‘भाप’ मूल इब्रानी रूपक को बनाए रखती है और शब्द को केवल निरर्थकता के एक अर्थ में सीमित नहीं करती।
- issue: אָדָם का अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: पद एकवचन में एक मानवीय उदाहरण देता है। ‘मनुष्य’ मूल के रूप और हिन्दी की स्वाभाविकता दोनों को बनाए रखता है।
- issue: בּוֹ का पूर्वपद
  choice: उसमें
  alternative: उसके लिए
  rationale: सर्वनाम का सटीक संदर्भ पूरी तरह स्पष्ट नहीं है; ‘उसमें’ इस वास्तविक अस्पष्टता को अनावश्यक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘भाप’ सामान्य पाठक के लिए सहज है और सभोपदेशक के मुख्य इब्रानी रूपक को प्रत्यक्ष रखती है; ‘अपना भाग’ पुस्तक में חֵלֶק की विषयगत प्रतिध्वनि बनाए रखता है।
