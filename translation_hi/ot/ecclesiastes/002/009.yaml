  text: So I became great and increased more than all who were before me in Jerusalem[b][a]; also my wisdom remained with me.
translation:
  language: hi
  text: इस प्रकार मैं महान हो गया और यरूशलेम में मुझसे पहले जितने भी थे, उन सबसे बढ़कर हो गया[a]। साथ ही, मेरी बुद्धि मेरे साथ बनी रही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यरूशलेम में मुझसे पहले जितने भी थे, उन सबसे अधिक बढ़ गया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मेरी बुद्धि मेरे लिए खड़ी रही।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגָדַלְתִּי
  choice: इस प्रकार मैं महान हो गया
  rationale: גדל के काल रूप में महानता, प्रतिष्ठा या महत्त्व में बढ़ने का भाव है। ‘महान हो गया’ परिणामसूचक अर्थ को बनाए रखता है; आरंभिक וְ को प्रसंगगत क्रम/परिणाम के रूप में स्वाभाविक हिन्दी ‘इस प्रकार’ से व्यक्त किया गया है।
- source_word: וְהוֹסַפְתִּי מִכֹּל
  choice: उन सबसे बढ़कर हो गया
  rationale: יסף के हिफ़ील रूप का मूल भाव ‘और बढ़ना/जोड़ना’ है, पर מִן के तुलनात्मक प्रयोग के साथ यह दूसरों से आगे बढ़ने या उन्हें पार करने का अर्थ देता है। चुना हुआ हिन्दी वाक्य इस तुलना को सहज रूप में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שֶׁהָיָה לְפָנַי
  choice: मुझसे पहले जितने भी थे
  rationale: राजकीय और आत्मकथात्मक प्रसंग में यह वाक्यांश यरूशलेम के पूर्ववर्तियों को सूचित करता है। ‘जितने भी थे’ כֹּל की व्यापकता बनाए रखता है, जबकि ‘मुझसे पहले’ कालगत पूर्वता को स्पष्ट करता है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग בְּ और नगर के नाम का मानक हिन्दी रूप।
- source_word: אַף
  choice: साथ ही
  rationale: यहाँ אַף पिछले कथन में एक अतिरिक्त तथ्य जोड़ता है। ‘साथ ही’ इस संयोजक बल को बिना अनावश्यक तीव्रता के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָכְמָתִי
  choice: मेरी बुद्धि
  rationale: संज्ञा חָכְמָה और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय का सीधा और प्रचलित हिन्दी रूप।
- source_word: עָמְדָה לִּי
  choice: मेरे साथ बनी रही
  rationale: शाब्दिक संरचना ‘मेरे लिए/पास खड़ी रही’ है, पर मुहावरे का आशय बुद्धि के कायम रहने और वक्ता के पास उपलब्ध रहने से है। ‘मेरे साथ बनी रही’ इस भाव को स्पष्ट रखता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
