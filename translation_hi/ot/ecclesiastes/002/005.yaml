- source_word: פַרְדֵּסִים
  choice: उपवन
  rationale: यह घिरे हुए, सँवारे गए आनंद-स्थलों या वृक्षों वाले बड़े उद्यानों को सूचित कर सकता है। ‘उपवन’ आधुनिक हिन्दी में इस व्यापक अर्थ को व्यक्त करता है, जबकि ‘फलोद्यान’ सम्भव पर कुछ संकीर्ण विकल्प है।
- source_word: וְנָטַעְתִּי בָהֶם
  choice: और उनमें ... लगाए
  rationale: נטע का अर्थ पौधे या पेड़ लगाना है; בָהֶם पीछे आए दोनों बहुवचन स्थानों की ओर संकेत करता है। हिन्दी में कर्ता को दोहराए बिना वाक्य स्वाभाविक और स्पष्ट रहता है।
- source_word: עֵץ כָּל־פֶּרִי
  choice: हर प्रकार के फलदार पेड़
  rationale: शाब्दिक संरचना ‘हर फल का पेड़’ है। यहाँ सामूहिक और वितरणात्मक भाव को सहज हिन्दी में ‘हर प्रकार के फलदार पेड़’ व्यक्त करता है।
