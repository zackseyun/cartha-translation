base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/003.yaml
  text: I searched in my heart to draw my flesh along with wine[a], while my heart was guiding me with wisdom, and to lay hold of folly[b], until I might see what was good for the sons of man to do under the heavens during the number of the days of their lives.
translation:
  language: hi
  text: मैंने अपने मन में खोजबीन की कि दाखमधु के सहारे अपने शरीर को खींचूँ[a]—मेरा मन बुद्धि से मेरा मार्गदर्शन करता हुआ—और मूर्खता को थामूँ, जब तक कि मैं यह न देखूँ कि मनुष्यों[b] के लिए आकाश के नीचे अपने जीवन के जितने दिन हैं, उनमें क्या करना अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है; उसका अधिक शाब्दिक रूप है, “दाखमधु के सहारे अपने शरीर को खींचूँ।” सम्भवतः भाव यह है कि वह बुद्धि का नियंत्रण बनाए रखते हुए दाखमधु से मिलने वाले शारीरिक सुख को परख रहा था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य की संतानों।” यह अभिव्यक्ति यहाँ सामान्य रूप से पूरी मानवजाति के लिए है।
    reason: alternative_reading
lexical_decisions:
- source_word: תַּרְתִּי בְלִבִּי
  choice: मैंने अपने मन में खोजबीन की
  rationale: תור जान-बूझकर जाँचने या खोजने का भाव देता है, और לֵב यहाँ भावना मात्र नहीं बल्कि विचार और इच्छा के भीतरी केंद्र को दर्शाता है। यह अनुवाद सभोपदेशक के चिंतनशील और प्रयोगात्मक स्वर को बनाए रखता है।
- source_word: לִמְשׁוֹךְ בַּיַּיִן אֶת־בְּשָׂרִי
  choice: अपने शरीर को दाखमधु से कैसे बहलाऊँ
  rationale: यह इब्रानी पदबंध कठिन और कुछ अस्पष्ट है। शाब्दिक रूप से इसमें ‘अपने मांस/शरीर को दाखमधु से खींचना’ आता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘बहलाऊँ’ रखा गया है, जबकि पादटिप्पणी शाब्दिक चित्र और सम्भावित आशय दोनों सुरक्षित रखती है।
- source_word: וְלִבִּי נֹהֵג בַּחָכְמָה
  choice: जबकि मेरा मन बुद्धि के साथ मेरा मार्गदर्शन कर रहा था
  rationale: נהג का मूल भाव चलाना या मार्गदर्शन करना है। वाक्य यह तनाव बनाए रखता है कि दाखमधु और मूर्खता की जाँच करते समय भी वक्ता का मन बुद्धि के निर्देशन में था।
- source_word: וְלֶאֱחֹז בְּסִכְלוּת
  choice: और मूर्खता को कैसे पकड़ूँ
  rationale: אחז का अर्थ पकड़ना या थामना है, और סכלות सभोपदेशक में बुद्धि के विपरीत आने वाला प्रमुख विषयगत शब्द है। ‘पकड़ूँ’ प्रयोग की जान-बूझकर की गई प्रकृति को व्यक्त करता है।
- source_word: לִבְנֵי הָאָדָם
  choice: मनुष्यों के लिए
  rationale: यह इब्रानी में शाब्दिक रूप से ‘आदम/मनुष्य की संतानों के लिए’ है, पर सन्दर्भ में पूरी मानवजाति के लिए प्रयुक्त सामान्य अभिव्यक्ति है। ‘मनुष्यों’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: תַּחַת הַשָּׁמַיִם
  choice: आकाश के नीचे
  rationale: इब्रानी में ‘आकाशों’ बहुवचन है, पर आधुनिक हिन्दी में स्थापित और स्वाभाविक मुहावरा ‘आकाश के नीचे’ है; यह सभोपदेशक की सांसारिक जीवन-सीमा को व्यक्त करता है।
- source_word: מִסְפַּר יְמֵי חַיֵּיהֶם
  choice: अपने जीवन के जितने दिन हैं, उनमें
  rationale: מִסְפַּר दिनों की निश्चित, सीमित संख्या पर बल देता है। यह हिन्दी रूप उस सीमाबद्धता को बनाए रखता है, पर मूल में स्पष्ट न होने के कारण ‘थोड़े’ या ‘गिने-चुने’ दिन नहीं जोड़ता।
theological_decisions:
- issue: दाखमधु, बुद्धि और मूर्खता के बीच सम्बन्ध
  choice: वक्ता दाखमधु और मूर्खता की जाँच करता है, जबकि उसका मन बुद्धि से उसका मार्गदर्शन करता रहता है
  alternative: वक्ता बुद्धि को छोड़कर मदिरा और मूर्खता में डूब जाता है
  rationale: 'इब्रानी समकालिक तनाव को स्पष्ट रूप से रखता है: उसका मन बुद्धि से मार्गदर्शन कर रहा था, फिर भी वह मूर्खता को पकड़ने का प्रयोग कर रहा था। पाठ इस तनाव को सुलझाए बिना सुरक्षित रखता है।'
- issue: בני האדם का सामान्य मानवीय अर्थ
  choice: मनुष्यों
  alternative: मनुष्य की संतानें
  rationale: यहाँ पुल्लिंग इब्रानी पदबंध प्रतिनिधिक रूप से मानवजाति को दर्शाता है। हिन्दी में ‘मनुष्यों’ अर्थ को सही और स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय साहित्यिक पद के रूप में चुना गया है। कठिन इब्रानी मुहावरे को मुख्य पाठ में अत्यधिक शाब्दिक और अस्वाभाविक बनाने के बजाय पादटिप्पणी में उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
