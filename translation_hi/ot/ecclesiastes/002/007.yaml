  text: קָנִ֨יתִי֙ עֲבָדִ֣ים וּ/שְׁפָח֔וֹת וּ/בְנֵי בַ֖יִת הָ֣יָה לִ֑/י גַּ֣ם מִקְנֶה֩ בָקָ֨ר וָ/צֹ֤אן הַרְבֵּה֙ הָ֣יָה לִ֔/י מִ/כֹּ֛ל שֶֽׁ/הָי֥וּ לְ/פָנַ֖/י בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/007.yaml
  text: I acquired male servants and female servants[a], and homeborn servants were mine; I also had great herds of cattle and flocks[b], more than all who were before me in Jerusalem.
translation:
  language: hi
  text: मैंने दास और दासियाँ प्राप्त किए, और मेरे घराने में जन्मे दास भी मेरे थे[a]। मेरे पास गाय-बैलों और भेड़-बकरियों के बहुत-से झुंड थे—यरूशलेम में मुझसे पहले रहनेवाले सभी लोगों से अधिक[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “घर के पुत्र”; अर्थात घराने के भीतर जन्मे लोग—इस प्रसंग में संभवतः वहीं जन्मे दास।
    reason: cultural_note
  - marker: b
    text: या, “पशुधन—गाय-बैल और भेड़-बकरियाँ—बहुतायत में था”; हिब्रू में पशुओं की संपत्ति के लिए सामूहिक शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתִי
  choice: मोल लीं
  rationale: यहाँ קנה का सामान्य अर्थ खरीदना या अर्जित करना है। दास-दासियों के संदर्भ में 'मोल लीं' स्वाभाविक है और प्राप्त करने के आर्थिक पक्ष को स्पष्ट रखता है।
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: दास और दासियाँ
  rationale: युग्म पुरुष और स्त्री दोनों की दास स्थिति को स्पष्ट करता है; केवल 'सेवक-सेविकाएँ' कहना सामाजिक स्थिति को अनावश्यक रूप से नरम कर सकता है।
- source_word: וּבְנֵי בַיִת
  choice: मेरे घर में जन्मे दास
  rationale: शाब्दिक अर्थ 'घर के पुत्र' है, जो इस प्रसंग में घराने के भीतर जन्मे बंधुआ लोगों की ओर संकेत करता है। मुख्य पाठ संदर्भगत अर्थ देता है और पादटिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: הָיָה לִי
  choice: मेरे थे / मेरे पास ... थे
  rationale: हिब्रू स्वामित्व-सूत्र को प्रसंग के अनुसार स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מִקְנֶה בָקָר וָצֹאן
  choice: गाय-बैलों और भेड़-बकरियों के झुंड
  rationale: בקר बड़े पशुओं और צאן छोटे पशुओं के सामूहिक वर्ग हैं। हिन्दी में दोनों वर्गों को ठोस और सहज रूप से व्यक्त करने के लिए यह विस्तृत पदावली चुनी गई है।
- source_word: הַרְבֵּה
  choice: बहुतायत में
  rationale: यह बड़ी संख्या अथवा प्रचुरता बताता है; 'बहुतायत में' सूची की गरिमामय शैली के अनुकूल है।
- source_word: מִכֹּל שֶׁהָיוּ לְפָנַי
  choice: उन सभी से अधिक, जो मुझसे पहले ... थे
  rationale: तुलना को बिना यह तय किए सुरक्षित रखा गया है कि पूर्ववर्ती लोग राजा थे या सामान्य धनवान निवासी।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थाननाम का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: घर में जन्मे लोगों की सामाजिक स्थिति
  choice: मुख्य पाठ में 'दास'
  alternative: घर के सदस्य / घर में जन्मे सेवक
  rationale: निकटवर्ती दास-दासियों की सूची और प्राचीन घराने की संरचना दास स्थिति का प्रबल संकेत देती है, पर मूल मुहावरे का शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: यरूशलेम में पहले रहे लोगों की पहचान
  choice: सामान्य पद 'उन सभी'
  alternative: मेरे सभी पूर्ववर्ती राजा
  rationale: हिब्रू पाठ केवल 'जो मुझसे पहले थे' कहता है; उन्हें विशेष रूप से राजा कहना पाठ से अधिक निश्चितता जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमामय कथन-शैली। 'दास और दासियाँ' ऐतिहासिक सामाजिक स्थिति को स्पष्ट रखता है। पशुधन की श्रेणियों को सामान्य हिन्दी पाठक के लिए 'गाय-बैल' और 'भेड़-बकरियाँ' कहकर खोला गया है।
