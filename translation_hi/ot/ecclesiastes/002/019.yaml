source:
  edition: WLC
  text: וּ/מִ֣י יוֹדֵ֗עַ הֶֽ/חָכָ֤ם יִהְיֶה֙ א֣וֹ סָכָ֔ל וְ/יִשְׁלַט֙ בְּ/כָל עֲמָלִ֔/י שֶֽׁ/עָמַ֥לְתִּי וְ/שֶׁ/חָכַ֖מְתִּי תַּ֣חַת הַ/שָּׁ֑מֶשׁ גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/019.yaml
  text: And who knows whether he will be wise or foolish? Yet he will rule over all my labor in which I labored and used wisdom under the sun[a]. This too is vanity.
translation:
  language: hi
  text: और कौन जानता है कि वह बुद्धिमान होगा या मूर्ख? फिर भी वह मेरे उस सारे परिश्रम पर अधिकार करेगा, जिसमें मैंने सूर्य के नीचे परिश्रम किया और बुद्धिमानी से काम किया। यह भी व्यर्थता[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह भी भाप है,’ जिससे क्षणभंगुरता पर बल पड़ता है; इसका अर्थ ‘यह भी निष्फल है’ भी हो सकता है। सभोपदेशक में हिब्रू शब्द हेवेल के अर्थों का दायरा व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי יוֹדֵעַ
  choice: और कौन जानता है
  rationale: संयोजक וּ को बनाए रखते हुए पूर्ववर्ती विचार से प्रवाह जोड़ा गया है; प्रश्न भावी उत्तराधिकारी के चरित्र के विषय में वास्तविक अनिश्चितता व्यक्त करता है।
- source_word: הֶחָכָם יִהְיֶה אוֹ סָכָל
  choice: कि वह बुद्धिमान होगा या मूर्ख
  rationale: हिब्रू के अप्रत्यक्ष प्रश्न और बुद्धिमान–मूर्ख के स्पष्ट विरोध को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וְיִשְׁלַט
  choice: फिर भी ... उसी का अधिकार होगा
  rationale: क्रिया का अर्थ शासन या नियंत्रण रखना है। प्रसंग में विरोध यह है कि उसका स्वभाव चाहे जैसा हो, वक्ता के परिश्रम पर अधिकार उसी को मिलेगा।
- source_word: בְּכָל עֲמָלִי שֶׁעָמַלְתִּי
  choice: मेरे उस सारे परिश्रम पर ... जिसके लिए मैंने ... परिश्रम किया
  rationale: עָמָל की संज्ञा और क्रिया की जानबूझकर की गई पुनरावृत्ति को ‘परिश्रम’ दोहराकर सुरक्षित रखा गया है।
- source_word: וְשֶׁחָכַמְתִּי
  choice: और बुद्धि से काम लिया
  rationale: यह केवल बुद्धिमान होने के बजाय कार्य में बुद्धि लगाने या बुद्धिमानी से काम करने का भाव व्यक्त करता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की प्रमुख और बार-बार आने वाली अभिव्यक्ति को परिचित, शाब्दिक रूप में रखा गया है।
- source_word: גַּם זֶה הָבֶל
  choice: यह भी व्यर्थता है
  rationale: הֶבֶל की प्रसंगगत निरर्थकता/निष्फलता को ‘व्यर्थता’ व्यक्त करती है, जबकि मूल शब्द के ‘भाप’ या क्षणभंगुरता-संबंधी रूपक को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: सभोपदेशक में הֶבֶל का अनुवाद
  choice: व्यर्थता
  alternative: भाप; क्षणभंगुरता; निष्फलता
  rationale: हिब्रू शब्द में भाप, अस्थिरता और निष्फलता की परस्पर जुड़ी अर्थ-छायाएँ हैं। मुख्य पाठ में ‘व्यर्थता’ पुस्तक के आवर्ती विषय को स्वाभाविक हिन्दी में रखती है, पर पादटिप्पणी उसके रूपक और अर्थ-विस्तार को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परिश्रम’ की पुनरावृत्ति हिब्रू की आलंकारिक पुनरुक्ति को बचाती है; ‘उसी का अधिकार होगा’ स्वाभाविक हिन्दी में भावी उत्तराधिकारी के निश्चित नियंत्रण को व्यक्त करता है।
