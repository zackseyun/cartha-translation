source:
  edition: WLC
  text: וְ/שָׂנֵ֨אתִי֙ אֶת הַ֣/חַיִּ֔ים כִּ֣י רַ֤ע עָלַ/י֙ הַֽ/מַּעֲשֶׂ֔ה שֶׁ/נַּעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁ֑מֶשׁ כִּֽי הַ/כֹּ֥ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/017.yaml
  text: So I hated life[a], because the work that is done under the sun was grievous to me[b]; for everything is vapor and a chasing after wind.
translation:
  language: hi
  text: इसलिए मैंने जीवन से घृणा की, क्योंकि सूर्य के नीचे जो काम किया जाता है, वह मुझे कष्टदायक लगा; क्योंकि सब कुछ वाष्प[a] है और हवा के पीछे भागना[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यर्थता” अथवा “साँस”; इब्रानी शब्द हेवेल किसी क्षणभंगुर, सारहीन या हाथ न आने वाली वस्तु का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: या “हवा के पीछे प्रयास करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂנֵאתִי
  choice: इसलिए मैंने ... से घृणा की
  rationale: प्रथम पुरुष एकवचन सिद्ध क्रिया वक्ता की दृढ़ प्रतिक्रिया व्यक्त करती है। आरंभिक संयोजक को पिछले विचार के परिणाम से जोड़ने के लिए “इसलिए” किया गया है।
- source_word: הַחַיִּים
  choice: जीवन
  rationale: इब्रानी में रूप बहुवचन है, पर यहाँ प्रचलित मुहावरे के अनुसार इसका अर्थ समग्र रूप से “जीवन” है।
- source_word: רַע עָלַי
  choice: मुझे दुःखद लगा
  rationale: शाब्दिक अर्थ “मुझ पर बुरा था” है; हिंदी में यह चयन वक्ता के लिए उस काम के कष्टकर और अप्रिय होने का अनुभव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּעֲשֶׂה שֶׁנַּעֲשָׂה
  choice: जो काम किया जाता है
  rationale: यह मानव गतिविधि को सामूहिक और सामान्य अर्थ में बताता है; वर्तमानकालिक कर्मवाच्य उसकी निरंतर प्रकृति बनाए रखता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट और बार-बार आने वाली स्थान-संबंधी अभिव्यक्ति को सीधे सुरक्षित रखा गया है।
- source_word: הַכֹּל
  choice: सब कुछ
  rationale: यह पद समग्रता व्यक्त करता है; आधुनिक हिंदी में “सब कुछ” स्वाभाविक और व्यापक है।
- source_word: הֶבֶל
  choice: वाष्प
  rationale: मूल ठोस बिंब क्षणभंगुर, सारहीन और हाथ न आने वाली वस्तु का संकेत देता है। “वाष्प” उस बिंब को केवल अमूर्त “व्यर्थता” में बदलने से बचाता है।
- source_word: וּרְעוּת רוּחַ
  choice: और हवा के पीछे भागना
  rationale: यह चयन ऐसी वस्तु का पीछा करने का सजीव बिंब देता है जिसे पकड़ा नहीं जा सकता, जबकि पद की वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הֶבֶל का अर्थ-क्षेत्र
  choice: वाष्प
  alternative: व्यर्थता; साँस
  rationale: ठोस इब्रानी रूपक को बनाए रखा गया है, ताकि पाठक क्षणभंगुरता, असारता और पकड़ में न आने के संयुक्त भाव को ग्रहण कर सके; इसे केवल नैतिक अहंकार या निरर्थकता तक सीमित नहीं किया गया।
- issue: רְעוּת רוּחַ की अस्पष्टता
  choice: हवा के पीछे भागना
  alternative: हवा को साधने का प्रयत्न
  rationale: मुख्य पाठ में सहज और सजीव हिंदी दी गई है, पर मूल पद में संभव “प्रयत्न/साधने” की छाया को पादटिप्पणी में रखा गया है; इस प्रकार व्यर्थ प्रयास के भाव को किसी संकीर्ण सिद्धांत में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। “वाष्प” मूल रूपक को बनाए रखता है, और वाक्य की दो कारणसूचक धाराओं को “क्योंकि” द्वारा स्पष्ट रखा गया है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
