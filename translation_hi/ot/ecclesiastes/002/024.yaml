  text: אֵֽין ט֤וֹב בָּ/אָדָם֙ שֶׁ/יֹּאכַ֣ל וְ/שָׁתָ֔ה וְ/הֶרְאָ֧ה אֶת נַפְשׁ֛/וֹ ט֖וֹב בַּ/עֲמָל֑/וֹ גַּם זֹה֙ רָאִ֣יתִי אָ֔נִי כִּ֛י מִ/יַּ֥ד הָ/אֱלֹהִ֖ים הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/024.yaml
  text: There is nothing better for a man than that he should eat and drink and show himself good in his labor[b][a]. I also saw that this is from the hand of God.
translation:
  language: hi
  text: मनुष्य के लिए इससे अच्छा और कुछ नहीं[b] कि वह खाए-पीए और अपने परिश्रम में सुख का अनुभव करे।[a] मैंने यह भी देखा कि यह परमेश्वर के हाथ से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राण को अपने परिश्रम में भलाई दिखाए”; अर्थात अपने परिश्रम में भलाई या सुख का अनुभव करे।
    reason: lexical_alternative
  - marker: b
    text: आरंभिक वाक्यांश का अधिक शाब्दिक अनुवाद यह भी हो सकता है, “मनुष्य में कोई भलाई नहीं कि वह खाए-पीए...”; पर संदर्भ तुलनात्मक अर्थ, “मनुष्य के लिए इससे अच्छा और कुछ नहीं...,” का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵין טוֹב בָּאָדָם
  choice: मनुष्य के लिए इससे अच्छा और कुछ नहीं
  rationale: इस कठिन इब्रानी वाक्यांश को प्रसंगानुसार तुलनात्मक अर्थ में लिया गया है। ‘मनुष्य’ אָדָם के सामान्य, समस्त मानवों पर लागू अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁיֹּאכַל וְשָׁתָה
  choice: कि वह खाए-पीए
  rationale: आश्रित उपवाक्य की संरचना और खाने-पीने की संयुक्त क्रिया को संक्षिप्त, सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְהֶרְאָה אֶת נַפְשׁוֹ טוֹב
  choice: और ... सुख का अनुभव करे
  rationale: शाब्दिक चित्र ‘अपने प्राण को भलाई दिखाए’ हिन्दी में अस्पष्ट होगा; इब्रानी मुहावरे का आशय स्वयं भलाई या सुख का अनुभव करना है।
- source_word: בַּעֲמָלוֹ
  choice: अपने परिश्रम में
  rationale: עָמָל के श्रमसाध्य काम के भाव को ‘परिश्रम’ बनाए रखता है और בְּ का संबंध ‘में’ द्वारा व्यक्त होता है।
- source_word: גַּם זֹה רָאִיתִי אָנִי
  choice: मैंने यह भी देखा
  rationale: मूल के बलयुक्त प्रथम पुरुष और ‘भी’ को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है।
- source_word: מִיַּד הָאֱלֹהִים
  choice: परमेश्वर के हाथ से
  rationale: स्रोत या दान को व्यक्त करने वाला इब्रानी ‘हाथ’ रूपक सुरक्षित रखा गया है।
- source_word: הִיא
  choice: यह ... मिलता है
  rationale: स्त्रीलिंग सर्वनाम पूरे पूर्ववर्ती अनुभव की ओर संकेत करता है; हिन्दी में क्रिया को ‘सुख का अनुभव’/लाभ की धारणा के अनुरूप स्वाभाविक बनाया गया है।
theological_decisions:
- issue: אֵין טוֹב בָּאָדָם का अर्थ
  choice: 'तुलनात्मक अर्थ: ‘मनुष्य के लिए इससे अच्छा और कुछ नहीं’'
  alternative: 'शाब्दिक/निरपेक्ष अर्थ: ‘मनुष्य में कोई भलाई नहीं कि वह खाए-पीए...’'
  rationale: तुलनात्मक अर्थ निकटवर्ती संदर्भ, सभोपदेशक के आवर्ती आनंद-विषय और इस निष्कर्ष से मेल खाता है कि ऐसा अनुभव परमेश्वर के हाथ से मिलता है; फिर भी वास्तविक पाठगत कठिनाई पादटिप्पणी में रखी गई है।
- issue: परिश्रम के सुख का स्रोत
  choice: ‘परमेश्वर के हाथ से मिलता है’
  alternative: केवल ‘परमेश्वर से है’
  rationale: मूल का ‘हाथ’ रूपक बनाए रखते हुए हिन्दी में यह स्पष्ट किया गया है कि आनंद का यह अनुभव परमेश्वर-प्रदत्त है, बिना किसी अतिरिक्त सिद्धान्त को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘खाए-पीए’ सामान्य पाठक के लिए स्वाभाविक है; ‘परिश्रम’ पुस्तक के श्रम/कठिन परिश्रम वाले प्रमुख शब्द को बनाए रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम [a][b] में दिए गए हैं जिसमें संबंधित वाक्यांशों की व्याख्या आती है।
