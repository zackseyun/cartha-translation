reference: Ecclesiastes 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּנַ֤סְתִּי לִ/י֙ גַּם כֶּ֣סֶף וְ/זָהָ֔ב וּ/סְגֻלַּ֥ת מְלָכִ֖ים וְ/הַ/מְּדִינ֑וֹת עָשִׂ֨יתִי לִ֜/י שָׁרִ֣ים וְ/שָׁר֗וֹת וְ/תַעֲנוּגֹ֛ת בְּנֵ֥י הָ/אָדָ֖ם שִׁדָּ֥ה וְ/שִׁדּֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/008.yaml
  text: I also gathered for myself silver and gold[a], and the treasure of kings and provinces. I acquired for myself male singers and female singers[b], and the delights of the sons of man—a concubine and concubines.
translation:
  language: hi
  text: मैंने अपने लिए चाँदी और सोना, और राजाओं तथा प्रान्तों का खजाना भी इकट्ठा किया। मैंने अपने लिए गायक और गायिकाएँ, और मनुष्यों के सुख-विलास[a]—एक उपपत्नी और उपपत्नियाँ[b]—भी प्राप्त किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानवजाति के सुख-विलास।” इब्रानी में शाब्दिक रूप से “मनुष्य की संतानों के सुख-विलास” है।
    reason: lexical_alternative
  - marker: b
    text: “एक उपपत्नी और उपपत्नियाँ” के लिए प्रयुक्त इब्रानी पद का अर्थ अनिश्चित है। अन्य सम्भव अर्थ हैं “एक रखैल और रखैलें,” “पुरुष और स्त्री साक़ी,” या सामान्य रूप से “हर प्रकार का विलास।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּנַסְתִּי לִי
  choice: मैंने अपने लिए ... इकट्ठी की
  rationale: क्रिया का अर्थ वस्तुओं को एकत्र या संचित करना है; ‘अपने लिए’ आत्मकेंद्रित अर्जन पर मूल पाठ के बल को बनाए रखता है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: बहुमूल्य धातुओं और उनसे सूचित धन के लिए सीधा और स्वाभाविक हिन्दी रूप।
- source_word: סְגֻלַּת מְלָכִים וְהַמְּדִינוֹת
  choice: राजाओं तथा प्रान्तों की बहुमूल्य सम्पत्ति
  rationale: סְגֻלָּה विशेष रूप से मूल्यवान निजी सम्पत्ति या खजाने को सूचित करता है; מְדִינוֹת प्रशासनिक प्रान्त हैं।
- source_word: עָשִׂיתִי לִי
  choice: मैंने अपने लिए ... रखीं/रखे
  rationale: शाब्दिक ‘बनाया’ इस सन्दर्भ में अस्वाभाविक होगा; यहाँ भाव अपने मनोरंजन और विलास के लिए लोगों या साधनों को उपलब्ध रखने का है।
- source_word: שָׁרִים וְשָׁרוֹת
  choice: गायक और गायिकाएँ
  rationale: मूल के पुल्लिंग और स्त्रीलिंग युग्म को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखता है।
- source_word: תַעֲנוּגֹת בְּנֵי הָאָדָם
  choice: मनुष्य की संतानों के मनोविनोद
  rationale: תַעֲנוּגֹת सुख, विलास या आनन्ददायक वस्तुओं को दर्शाता है। ‘मनुष्य की संतानें’ मूल के בְּנֵי הָאָדָם की रूपक-संरचना को बनाए रखती हैं, यद्यपि ‘मानवजाति के विलास’ अधिक मुहावरेदार विकल्प है।
- source_word: שִׁדָּה וְשִׁדּוֹת
  choice: एक उपपत्नी और अनेक उपपत्नियाँ
  rationale: यह अत्यन्त दुर्लभ और अनिश्चित पद है। एक प्राचीन और सन्दर्भानुकूल व्याख्या इसे राजकीय हरम या यौन-विलास से जोड़ती है; एकवचन-बहुवचन का क्रम हिन्दी में ‘एक ... और अनेक ...’ से व्यक्त किया गया है, जबकि अनिश्चितता पादटिप्पणी में स्पष्ट है।
theological_decisions:
- issue: בְּנֵי הָאָדָם का लिंग और सामान्य मानवीय अर्थ
  choice: मनुष्य की संतानों
  alternative: मानवजाति के; मनुष्यों के
  rationale: मुख्य पाठ मूल की ‘मनुष्य की संतानें’ संरचना को बनाए रखता है, पर इसे केवल पुरुषों तक सीमित नहीं समझा जाना चाहिए; पादटिप्पणी सामान्य मानवीय अर्थ स्पष्ट करती है।
- issue: שִׁדָּה וְשִׁדּוֹת की अनिश्चित व्याख्या
  choice: एक उपपत्नी और अनेक उपपत्नियाँ
  alternative: एक रखैल और अनेक रखैलें; पुरुष और स्त्री पिलानेवाले; हर प्रकार का विलास
  rationale: राजकीय धन, गायन और मानवीय विलास का निकट सन्दर्भ उपपत्नियों वाली पारम्परिक व्याख्या को सम्भव बनाता है, पर शब्द का अर्थ निश्चित नहीं है; इसलिए मुख्य पाठ किसी विकल्प को निर्विवाद नहीं ठहराता और प्रमुख विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। ‘बहुमूल्य सम्पत्ति’ और ‘रखे’ स्वाभाविक हिन्दी देते हैं, जबकि ‘मनुष्य की संतानों’ तथा अंतिम दुर्लभ पद में मूल की संरचना और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
