  text: כִּי֩ אֵ֨ין זִכְר֧וֹן לֶ/חָכָ֛ם עִֽם הַ/כְּסִ֖יל לְ/עוֹלָ֑ם בְּ/שֶׁ/כְּבָ֞ר הַ/יָּמִ֤ים הַ/בָּאִים֙ הַ/כֹּ֣ל נִשְׁכָּ֔ח וְ/אֵ֛יךְ יָמ֥וּת הֶ/חָכָ֖ם עִֽם הַ/כְּסִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/016.yaml
  text: For there is no lasting remembrance of the wise man any more than of the fool[a], since in the days to come everything will already have been forgotten[b]. And how the wise man dies just like the fool!
translation:
  language: hi
  text: क्योंकि बुद्धिमान का स्मरण मूर्ख के स्मरण से अधिक स्थायी नहीं होता; आनेवाले दिनों में सब कुछ पहले ही भुला दिया गया होगा। और यह कैसी विडंबना है कि बुद्धिमान मूर्ख के समान मरता है![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “और कैसे बुद्धिमान मूर्ख के साथ मरता है!” यह विस्मयपूर्ण कथन उस पीड़ादायक तथ्य को व्यक्त करता है कि बुद्धिमान भी मूर्ख के समान मरता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוֹן
  choice: स्मरण
  rationale: यह संज्ञा किसी के याद रखे जाने या उसकी स्मृति बने रहने को दर्शाती है; ‘स्मरण’ सभोपदेशक के प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: לֶחָכָם / הֶחָכָם
  choice: बुद्धिमान
  rationale: इब्रानी में विशेषण संज्ञा के रूप में प्रयुक्त है। हिन्दी में ‘बुद्धिमान’ प्रतिनिधि एकवचन और मूल की संक्षिप्त शैली बनाए रखता है।
- source_word: עִם הַכְּסִיל
  choice: न तो बुद्धिमान का और न मूर्ख का / मूर्ख के समान
  rationale: עִם का शाब्दिक अर्थ ‘के साथ’ है, पर यहाँ दोनों की समान दशा और साझा नियति अभिप्रेत है; दोनों खंडों में स्वाभाविक हिन्दी के अनुसार इसे व्यक्त किया गया है।
- source_word: לְעוֹלָם
  choice: सदा बना रहेगा
  rationale: यहाँ बात चिरस्थायी स्मरण की है। यह चयन मूल के कालगत बल को स्पष्ट रूप से बनाए रखता है।
- source_word: בְּשֶׁכְּבָר
  choice: आनेवाले दिनों में
  rationale: संक्षिप्त इब्रानी रचना आगामी समय में भुला दिए जाने का आधार प्रस्तुत करती है; हिन्दी वाक्य में उसका कालगत भाव अगले पद के साथ स्वाभाविक रूप से व्यक्त हुआ है।
- source_word: הַיָּמִים הַבָּאִים
  choice: आनेवाले दिनों में
  rationale: यह मूल के भविष्याभिमुख सहभागी पदबंध का सीधा और प्रचलित हिन्दी रूप है।
- source_word: הַכֹּל נִשְׁכָּח
  choice: सब कुछ भुला दिया जाएगा
  rationale: निफ़अल रूप का निष्क्रिय अर्थ सुरक्षित रखते हुए आगामी दिनों के संदर्भ में भविष्यकाल स्वाभाविक है। ‘सब कुछ’ सामूहिक הַכֹּל का स्पष्ट हिन्दी रूप है।
- source_word: וְאֵיךְ
  choice: और कैसी विडंबना है कि
  rationale: यह साधारण प्रश्न नहीं, बल्कि शोकपूर्ण विस्मय प्रकट करता है। यह हिन्दी रूप उस विस्मयादिबोधक बल को स्पष्ट करता है, बिना उसमें कोई अतिरिक्त सिद्धांत जोड़े।
- source_word: יָמוּת
  choice: मरता है
  rationale: यह अपूर्ण क्रिया यहाँ मृत्यु की सामान्य, सार्वभौमिक वास्तविकता बताती है; हिन्दी का सामान्य वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: बुद्धिमान और मूर्ख की मृत्यु में समानता
  choice: बुद्धिमान भी मूर्ख के समान मरता है
  alternative: बुद्धिमान मूर्ख के साथ मरता है
  rationale: प्रसंग सांसारिक मृत्यु की साझा नियति पर बल देता है। ‘के समान’ तुलनात्मक अर्थ स्पष्ट करता है, पर मृत्यु के बाद उनकी दशा के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और चिंतनशील शैली रखी गई है। मूल की पुनरुक्ति, साझा नियति और अंतिम विस्मयात्मक स्वर सुरक्षित हैं।
