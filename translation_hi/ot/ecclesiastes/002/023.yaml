  edition: WLC
  text: כִּ֧י כָל יָמָ֣י/ו מַכְאֹבִ֗ים וָ/כַ֨עַס֙ עִנְיָנ֔/וֹ גַּם בַּ/לַּ֖יְלָה לֹא שָׁכַ֣ב לִבּ֑/וֹ גַּם זֶ֖ה הֶ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/023.yaml
  text: For all his days are pains[a], and his occupation is vexation; even in the night his heart does not lie down[b]. This too is vapor.
translation:
  language: hi
  text: क्योंकि उसके सारे दिन पीड़ाओं से भरे हैं, और उसका काम क्लेशमय है; रात में भी उसका हृदय चैन नहीं पाता[a]। यह भी वाष्प है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका हृदय लेटता नहीं।” इसका आशय उस भीतरी बेचैनी से है जो रात में भी बनी रहती है।
    reason: literal_rendering
  - marker: b
    text: या “व्यर्थता” अथवा “साँस।” इब्रानी הֶבֶל उस चीज़ का चित्र प्रस्तुत करता है जो क्षणभंगुर और पकड़ में न आने वाली है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל יָמָיו
  choice: उसके सारे दिन
  rationale: इब्रानी के ठोस काल-सूचक मुहावरे को बनाए रखता है और हिन्दी में सहज है।
- source_word: מַכְאֹבִים
  choice: पीड़ादायक
  rationale: मूल बहुवचन संज्ञा ‘पीड़ाएँ’ को हिन्दी वाक्य में स्वाभाविक विशेषणात्मक रूप देकर शारीरिक या मानसिक दोनों प्रकार की पीड़ा की गुंजाइश रखी गई है।
- source_word: וָכַעַס
  choice: खीझ से भरा
  rationale: यहाँ शब्द केवल क्रोध नहीं, बल्कि काम से उपजी आंतरिक झुँझलाहट और संताप को दर्शाता है।
- source_word: עִנְיָנוֹ
  choice: उसका काम
  rationale: शब्द व्यक्ति के कार्य, दायित्व या व्यवसाय को सूचित करता है; ‘काम’ सामान्य हिन्दी में व्यापक और प्रसंगानुकूल है।
- source_word: גַּם בַּלַּיְלָה
  choice: रात में भी
  rationale: גַּם की योगात्मक और बलात्मक शक्ति तथा समय-सूचक वाक्यांश दोनों को सहज हिन्दी में रखता है।
- source_word: לֹא שָׁכַב לִבּוֹ
  choice: उसका हृदय चैन नहीं पाता
  rationale: शाब्दिक चित्र ‘उसका हृदय लेटता नहीं’ हिन्दी में अस्वाभाविक है; चुना हुआ रूप रात भर जारी आंतरिक अशांति को व्यक्त करता है, जबकि पादटिप्पणी मूल रूपक बताती है।
- source_word: לִבּוֹ
  choice: उसका हृदय
  rationale: मूल मानवशास्त्रीय चित्र को बनाए रखता है; यहाँ हृदय विचारों और भीतरी जीवन का केंद्र भी है।
- source_word: גַּם זֶה
  choice: यह भी
  rationale: सभोपदेशक में बार-बार आने वाले योगात्मक कथन का सीधा और स्वाभाविक अनुवाद है।
- source_word: הֶבֶל
  choice: भाप
  rationale: ‘भाप’ क्षणभंगुर और पकड़ में न आने वाली वस्तु का मूल चित्र बनाए रखती है; केवल अमूर्त ‘व्यर्थता’ कहने से यह रूपक खो जाता।
theological_decisions:
- issue: הֶבֶל को अमूर्त निष्कर्ष या ठोस रूपक के रूप में प्रस्तुत करना
  choice: भाप
  alternative: व्यर्थता
  rationale: मूल शब्द के ठोस, क्षणभंगुर और पकड़ में न आने वाले चित्र को बनाए रखा गया है, ताकि पुस्तक की व्यापक धर्मवैचारिक तनातनी को केवल ‘निरर्थकता’ तक सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हृदय चैन नहीं पाता’ मूल रूपक का स्वाभाविक हिन्दी रूप है, और ‘भाप’ सभोपदेशक के आवर्ती ठोस बिंब को सुरक्षित रखती है।
