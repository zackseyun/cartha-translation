source:
  edition: WLC
  text: כִּ֣י מִ֥י יֹאכַ֛ל וּ/מִ֥י יָח֖וּשׁ ח֥וּץ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/025.yaml
  text: For who can eat[a], and who can enjoy[b], apart from him?
translation:
  language: hi
  text: क्योंकि मेरे बिना[a] कौन खा सकता है और कौन आनन्द ले सकता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का शाब्दिक अर्थ “मेरे बिना” है। कुछ प्राचीन अनुवादों और आसपास के प्रसंग के आधार पर इसे “उसके बिना,” अर्थात परमेश्वर के बिना, भी समझा गया है।
    reason: textual_variant
  - marker: b
    text: इस इब्रानी क्रिया का अर्थ कठिन है। इसके अनुवाद “कौन शीघ्रता कर सकता है?” या “कौन अनुभव कर सकता है?” भी किए जा सकते हैं; यहाँ प्रसंग के अनुसार इसे आनन्द लेने के अर्थ में समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִי יֹאכַל
  choice: कौन खा सकता है
  rationale: अपूर्ण क्रिया इस आलंकारिक प्रश्न में सामर्थ्य या संभावना व्यक्त करती है।
- source_word: וּמִי יָחוּשׁ
  choice: और कौन आनन्द ले सकता है
  rationale: יָחוּשׁ का अर्थ कठिन और विवादित है। भोजन और परमेश्वर से मिलने वाले सुख के निकट प्रसंग में ‘आनन्द लेना’ सबसे संगत है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: חוּץ מִמֶּנִּי
  choice: मेरे बिना
  rationale: मसोरेटिक इब्रानी पाठ का सीधा अर्थ ‘मेरे बिना’ है। प्रसंगगत वैकल्पिक समझ ‘उसके बिना’ को मुख्य पाठ में चुपचाप अपनाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अन्तिम सर्वनाम מִמֶּנִּי का पाठ और संदर्भ
  choice: मेरे बिना
  alternative: उसके बिना, अर्थात परमेश्वर के बिना
  rationale: WLC का स्वरांकित पाठ प्रथम पुरुष ‘मुझसे/मेरे बिना’ देता है। फिर भी पद 24 और 26 में आनन्द का स्रोत परमेश्वर होने के कारण कुछ प्राचीन अनुवाद और अनेक व्याख्याकार तृतीय पुरुष समझते हैं। मुख्य पाठ मूल इब्रानी को रखता है और संदर्भगत विकल्प को पादटिप्पणी में स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न की समानान्तर रचना बनाए रखी गई है। ‘आनन्द’ सामान्य पाठक के लिए स्पष्ट है और सभोपदेशक के निकट प्रसंग में भोजन तथा सुख के संबंध को स्वाभाविक रूप से व्यक्त करता है।
