source:
  edition: WLC
  text: וְ/אָמַ֨רְתִּֽי אֲנִ֜י בְּ/לִבִּ֗/י כְּ/מִקְרֵ֤ה הַ/כְּסִיל֙ גַּם אֲנִ֣י יִקְרֵ֔/נִי וְ/לָ֧/מָּה חָכַ֛מְתִּי אֲנִ֖י אָ֣ז יוֹתֵ֑ר וְ/דִבַּ֣רְתִּי בְ/לִבִּ֔/י שֶׁ/גַּם זֶ֖ה הָֽבֶל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/002/015.yaml
  text: And I said in my heart[a], "As happens to the fool, so it will happen to me also. Why then was I more wise?" And I said in my heart that this too is vanity.
translation:
  language: hi
  text: और मैंने अपने मन में कहा, “मूर्ख के साथ जो होता है, वही मेरे साथ भी होगा। तो फिर मैं अधिक बुद्धिमान क्यों हुआ?” और मैंने अपने मन में कहा कि यह भी व्यर्थ[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाष्प” अथवा “साँस।” इब्रानी הָבֶל सभोपदेशक में बार-बार आने वाला शब्द है, जो क्षणभंगुर, पकड़ में न आने वाली, या निष्फल चीज़ को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתִּי אֲנִי בְּלִבִּי
  choice: तब मैंने अपने मन में कहा
  rationale: यह इब्रानी आत्मचिंतन की अभिव्यक्ति है। ‘अपने मन में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए हृदय/अंतरात्मा की मूल छवि को पर्याप्त रूप से बनाए रखता है; आरंभिक וְ को प्रसंगगत क्रम के अनुसार ‘तब’ कहा गया है।
- source_word: כְּמִקְרֵה הַכְּסִיל גַּם אֲנִי יִקְרֵנִי
  choice: मूर्ख के साथ जो होता है, वही मेरे साथ भी होगा
  rationale: מִקְרֶה और קָרָה किसी घटना या घटित होने को व्यक्त करते हैं। यह अनुवाद ‘भाग्य’ जैसा अधिक दार्शनिक अर्थ थोपे बिना तुलना और भविष्यसूचक क्रिया दोनों को स्पष्ट करता है।
- source_word: הַכְּסִיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह नैतिक और बौद्धिक विवेकहीनता के लिए मानक शब्द है; ‘मूर्ख’ इसका स्वाभाविक और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: וְלָמָּה חָכַמְתִּי אֲנִי אָז יוֹתֵר
  choice: तो फिर मैं इतना अधिक बुद्धिमान क्यों हुआ?
  rationale: ‘तो फिर’ אָז के निष्कर्षात्मक बल को व्यक्त करता है। חָכַמְתִּי को ‘बुद्धिमान हुआ’ कहना क्रियात्मक रूप बनाए रखता है, और יוֹתֵר को ‘इतना अधिक’ से स्पष्ट किया गया है; प्रश्न की जानबूझकर असहज और तनावपूर्ण प्रकृति को लाभ-केंद्रित व्याख्या में नहीं बदला गया।
- source_word: וְדִבַּרְתִּי בְלִבִּי
  choice: और मैंने अपने मन में कहा
  rationale: דבר का मूल अर्थ बोलना है, पर आंतरिक विचार के प्रसंग में हिन्दी में ‘मन में कहा’ अधिक स्वाभाविक है और मूल आशय सुरक्षित रखता है।
- source_word: שֶׁגַּם זֶה הָבֶל
  choice: कि यह भी व्यर्थ है
  rationale: ‘यह भी’ additive גַּם को बनाए रखता है। הָבֶל के लिए ‘व्यर्थ’ क्षणभंगुरता, निष्फलता और पकड़ में न आने के व्यापक भाव को किसी एक दार्शनिक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: सभोपदेशक में הָבֶל का अनुवाद
  choice: व्यर्थ
  alternative: वाष्प; साँस; निष्फलता
  rationale: इब्रानी शब्द का ठोस बिंब वाष्प या साँस है, पर पुस्तक में यह क्षणभंगुर, पकड़ में न आने वाला और निष्फल होने के भाव भी समेटता है। ‘व्यर्थ’ हिन्दी में पुस्तक के साहित्यिक और धर्मवैचारिक तनाव को बनाए रखता है, जबकि पादटिप्पणी मूल बिंब और अर्थ-परास बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की पुनरावृत्ति और आत्मसंवाद की संरचना मूल इब्रानी के अनुरूप सुरक्षित है। पादटिप्पणी-चिह्न הָבֶל के अनुवाद ‘व्यर्थ’ पर रखा गया है।
