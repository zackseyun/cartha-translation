  text: זְב֣וּבֵי מָ֔וֶת יַבְאִ֥ישׁ יַבִּ֖יעַ שֶׁ֣מֶן רוֹקֵ֑חַ יָקָ֛ר מֵ/חָכְמָ֥ה מִ/כָּב֖וֹד סִכְל֥וּת מְעָֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/001.yaml
  text: Dead flies make a perfumer’s oil stink and bubble up[b][a]; so a little folly outweighs wisdom and honor.
translation:
  language: hi
  text: मरी हुई मक्खियाँ इत्र बनाने वाले के तेल को दुर्गन्धित कर देती हैं और उसमें बुलबुले उठा देती हैं[a]; इसी तरह थोड़ी-सी मूर्खता बुद्धि और सम्मान पर भारी पड़ती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे खमीरित कर देती हैं,’ ‘उसमें झाग उठा देती हैं,’ अथवा सामान्य अर्थ में ‘उसे बिगाड़ देती हैं।’ इब्रानी क्रिया बिगड़े हुए तेल से कुछ निकलने या उसमें बुलबुले उठने का संकेत दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बुद्धि और सम्मान से अधिक मूल्यवान होती है।’ इब्रानी शब्द मूल्य की तुलना भी व्यक्त कर सकता है; यहाँ उसका अर्थ ‘अधिक भारी’ अथवा ‘अधिक प्रभावशाली’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבוּבֵי מָוֶת
  choice: मरी हुई मक्खियाँ
  rationale: शाब्दिक रचना ‘मृत्यु की मक्खियाँ’ है, पर प्रसंग में तेल को दूषित करने वाली मरी हुई मक्खियाँ अभिप्रेत हैं; हिन्दी में यह रूप चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: יַבְאִישׁ
  choice: दुर्गन्धित कर देती हैं
  rationale: באש के हिफ़ील रूप का कारणवाचक अर्थ ‘दुर्गन्ध पैदा करना’ है; चुना हुआ रूप तेल के बिगड़ने और बदबू देने, दोनों को स्पष्ट करता है।
- source_word: יַבִּיעַ
  choice: उसमें बुलबुले उठा देती हैं
  rationale: क्रिया में बाहर निकलने, उफनने या बुलबुले उठने का भाव हो सकता है। यह अनुवाद बिगड़े हुए तेल की सक्रिय प्रतिक्रिया का दृश्य बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שֶׁמֶן רוֹקֵחַ
  choice: इत्र बनाने वाले का तेल
  rationale: शाब्दिक अर्थ मिश्रण या सुगंध तैयार करने वाले कारीगर का तेल है। यह आधुनिक पाठक के लिए स्पष्ट है और कारीगर-संबंधी अर्थ बनाए रखता है।
- source_word: יָקָר
  choice: पर भारी पड़ती है
  rationale: יָקָר सामान्यतः ‘बहुमूल्य/मूल्यवान’ है, पर तुलनात्मक रचना में अधिक वजन या प्रभाव का अर्थ संभव है। हिन्दी मुहावरा ‘पर भारी पड़ना’ थोड़ी मूर्खता के अनुपातहीन दुष्प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵחָכְמָה מִכָּבוֹד
  choice: बुद्धि और सम्मान पर
  rationale: दोनों पूर्वसर्गयुक्त पदों को उन गुणों की संयुक्त जोड़ी माना गया है जिन पर थोड़ी मूर्खता भारी पड़ती है। मानवीय-सामाजिक प्रसंग में כָּבוֹד के लिए ‘सम्मान’ उपयुक्त है।
- source_word: סִכְלוּת מְעָט
  choice: थोड़ी-सी मूर्खता
  rationale: संज्ञा और विशेषण का सीधा, स्वाभाविक अनुवाद है; ‘थोड़ी-सी’ इस सूक्ति के विरोधाभास और अनुपातहीन परिणाम पर बल देता है।
theological_decisions:
- issue: יָקָר के तुलनात्मक अर्थ की अस्पष्टता
  choice: मूर्खता ‘बुद्धि और सम्मान पर भारी पड़ती है’
  alternative: मूर्खता ‘बुद्धि और सम्मान से अधिक मूल्यवान है’
  rationale: प्रसंग दूषित तेल के रूपक से थोड़ी मूर्खता के हानिकारक और अनुपातहीन प्रभाव की ओर संकेत करता है। फिर भी ‘अधिक मूल्यवान/कीमती’ वाला शाब्दिक अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है और पाठ में अनावश्यक धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘इत्र बनाने वाला’ कारीगर का अर्थ स्पष्ट करता है; ‘पर भारी पड़ती है’ सूक्ति की संक्षिप्तता और वजन-संबंधी अर्थ दोनों को बनाए रखता है। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
