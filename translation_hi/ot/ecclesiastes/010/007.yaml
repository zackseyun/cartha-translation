source:
  edition: WLC
  text: רָאִ֥יתִי עֲבָדִ֖ים עַל סוּסִ֑ים וְ/שָׂרִ֛ים הֹלְכִ֥ים כַּ/עֲבָדִ֖ים עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/007.yaml
  text: I have seen servants on horses[c][b][a], and princes walking on the ground like servants.
translation:
  language: hi
  text: मैंने दासों[a] को घोड़ों पर सवार और सरदारों[b] को दासों के समान धरती पर[c] चलते देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवकों’; इब्रानी עֲבָדִים दासों या सेवकों, दोनों के लिए प्रयुक्त हो सकता है। यहाँ सामाजिक पद के तीखे उलटाव के कारण ‘दासों’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजकुमारों’, ‘कुलीनों’ अथवा ‘उच्च पदाधिकारियों’; इब्रानी שָׂרִים ऊँचे पद या अधिकार वाले लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘धरती/भूमि पर’; यहाँ आशय घोड़े पर सवार होने के विपरीत पैदल चलने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: यह ראה का काल रूप, प्रथम पुरुष एकवचन है। सभोपदेशक में यह निजी अनुभव से प्राप्त ऐसी देखी हुई बात व्यक्त करता है जिसकी प्रासंगिकता बनी हुई है; इसलिए हिंदी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: עֲבָדִים
  choice: दासों
  rationale: עֶבֶד का बहुवचन यहाँ निम्न और बंधुआ सामाजिक स्थिति को सूचित करता है। पद में सामाजिक पदों के तीखे उलटाव के कारण अपेक्षाकृत नरम ‘सेवकों’ की बजाय ‘दासों’ उपयुक्त है।
- source_word: עַל סוּסִים
  choice: घोड़ों पर सवार
  rationale: शाब्दिक अर्थ ‘घोड़ों पर’ है। आधुनिक हिंदी में ‘घोड़ों पर सवार’ स्वाभाविक है और ऊँचे दर्जे तथा सुविधा का दृश्य स्पष्ट करता है।
- source_word: שָׂרִים
  choice: सरदारों
  rationale: यह शब्द ऊँचे पद, अधिकार या प्रतिष्ठा वाले लोगों को दर्शाता है। ‘सरदार’ सामाजिक श्रेणी के विरोध को बनाए रखता है और किसी खास शासकीय पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הֹלְכִים
  choice: चलते
  rationale: הלך का कृदंत चल रही क्रिया का चित्र प्रस्तुत करता है। ‘चलते’ घोड़ों पर सवार होने के विपरीत दृश्य को सहज रूप से व्यक्त करता है।
- source_word: כַּעֲבָדִים
  choice: दासों के समान
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है; सरदारों को वास्तव में दास नहीं कहा गया, बल्कि उनकी दशा या ढंग की तुलना दासों से की गई है।
- source_word: עַל הָאָרֶץ
  choice: धरती पर
  rationale: शाब्दिक अर्थ ‘धरती/भूमि पर’ है। यह घोड़ों पर बैठे लोगों के विपरीत जमीन पर चलने का ठोस चित्र सुरक्षित रखता है; ‘पैदल’ अधिक मुहावरेदार पर कुछ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: सामाजिक पदों का उलटाव
  choice: दासों और सरदारों के स्पष्ट विरोध को बनाए रखा गया है।
  alternative: इसे केवल सेवकों और अधिकारियों के प्रशासनिक उलटाव के रूप में प्रस्तुत करना।
  rationale: इब्रानी चित्र सामाजिक है, पर पद स्वयं इस उलटाव का नैतिक या ईश्वरीय कारण नहीं बताता; अनुवाद उस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में ‘घोड़ों पर सवार’ और ‘धरती पर चलते’ का दृश्यात्मक विरोध सुरक्षित है। ‘सरदार’ सामान्य पाठक के लिए बोधगम्य है और इब्रानी शब्द के व्यापक अर्थ को किसी एक सरकारी पद तक सीमित नहीं करता।
