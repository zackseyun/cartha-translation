  text: Whoever digs a pit will fall into it[b][a], and whoever breaks through a wall will be bitten by a snake.
translation:
  language: hi
  text: जो गड्ढा खोदता है, वह उसी में गिर पड़ेगा; और जो दीवार[a] में सेंध लगाता है, उसे साँप काटेगा।
  philosophy: optimal-equivalence
  footnotes:
