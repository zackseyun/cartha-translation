    text: या “बाड़।” प्राचीन परिवेश में इससे खेत या सीमा के चारों ओर बनी पत्थर की दीवार भी अभिप्रेत हो सकती है।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: חֹפֵר גּוּמָּץ
  choice: जो गड्ढा खोदता है
  rationale: कृदंत यहाँ सामान्य, नीतिवचनात्मक कर्ता को व्यक्त करता है। ‘जो…खोदता है’ आधुनिक हिन्दी में स्वाभाविक है और גּוּמָּץ के खोदे हुए गड्ढे का अर्थ बनाए रखता है।
- source_word: בּוֹ יִפּוֹל
  choice: वह उसी में गिर पड़ेगा
  rationale: ‘उसी में’ इस विडंबना पर बल देता है कि खोदने वाला अपने ही खोदे गड्ढे में गिरता है; ‘गिर पड़ेगा’ नीतिवचन में संभावित/निश्चित परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּפֹרֵץ גָּדֵר
  choice: और जो दीवार में सेंध लगाता है
  rationale: פרץ किसी अवरोध को तोड़कर उसमें रास्ता बनाने का भाव रखता है। ‘सेंध लगाता है’ हिन्दी में इस क्रिया को संक्षिप्त और चित्रात्मक रूप से व्यक्त करता है। גָּדֵר दीवार अथवा बाड़ हो सकती है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִשְּׁכֶנּוּ נָחָשׁ
  choice: उसे साँप काटेगा
  rationale: नשך का सीधा अर्थ ‘काटना’ है और प्रत्यय ‘उसे’ दीवार तोड़ने वाले की ओर संकेत करता है। हिन्दी का कर्ता–कर्म क्रम हिब्रू के आशय को स्पष्ट और स्वाभाविक रखता है।
- source_word: נָחָשׁ
  choice: साँप
  rationale: ‘साँप’ सामान्य आधुनिक हिन्दी का स्पष्ट शब्द है और प्रसंग में अनावश्यक प्रतीकात्मक या धार्मिक अर्थ नहीं जोड़ता।
