  text: The labor of fools wearies them[a], for he does not know how to go to the city.
translation:
  language: hi
  text: मूर्खों का परिश्रम उस व्यक्ति को थका देता है जो नहीं जानता कि नगर कैसे जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲמַל
  choice: परिश्रम
  rationale: यह शब्द श्रमसाध्य प्रयास या कठिन मेहनत को दर्शाता है। ‘परिश्रम’ उसके ठोस अर्थ को बनाए रखता है और उसे केवल ‘परेशानी’ नहीं बनाता।
- source_word: הַכְּסִילִים
  choice: मूर्खों
  rationale: ज्ञान-साहित्य में כְּסִיל केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति को दर्शाता है। ‘मूर्ख’ इसका प्रचलित और उपयुक्त हिन्दी रूप है; बहुवचन बनाए रखा गया है।
- source_word: תְּיַגְּעֶנּוּ
  choice: उसे थका देता है
  rationale: पिएल रूप का अर्थ ‘थका देना’ या ‘निढाल कर देना’ है। स्त्रीलिंग क्रिया का कर्ता עֲמַל है और प्रत्यय पुल्लिंग एकवचन है; इसलिए ‘उसे’ मूल व्याकरण को सुरक्षित रखता है। हिन्दी में विधेय सामान्यतः निकटवर्ती ‘परिश्रम’ के अनुसार पुल्लिंग रखा गया है।
- source_word: אֲשֶׁר לֹא יָדַע
  choice: क्योंकि वह नहीं जानता
  rationale: सम्बन्धवाचक अव्यय यहाँ पहले आए एकवचन व्यक्ति की आगे की विशेषता या कारण बताता है। नीतिवचन-सदृश कथन में पूर्ण रूप יָדַע को वर्तमानकालीन सामान्य अवस्था के रूप में देना स्वाभाविक है।
- source_word: לָלֶכֶת
  choice: कैसे जाए
  rationale: ידע के साथ इस क्रियार्थक रूप का भाव ‘जाना जानना’ या ‘कैसे जाना है, यह जानना’ है। ‘कैसे जाए’ हिन्दी में सहज रहते हुए मूल मुहावरे का अर्थ देता है।
- source_word: אֶל עִיר
  choice: नगर
  rationale: इब्रानी में ‘नगर’ अनिश्चित और सामान्य है। हिन्दी में बिना किसी अतिरिक्त निर्धारक के ‘नगर’ वही लोकोक्तिपरक, सामान्य भाव व्यक्त करता है।
theological_decisions:
- issue: बहुवचन ‘मूर्खों’ और एकवचन कर्म-प्रत्यय के बीच संख्या का तनाव
  choice: मुख्य पाठ में एकवचन ‘उसे/वह’ रखा गया है।
  alternative: ‘मूर्खों का परिश्रम उन्हें थका देता है, क्योंकि वे नगर जाने का रास्ता नहीं जानते।’
  rationale: मसोरेटी पाठ में תְּיַגְּעֶנּוּ का कर्म-प्रत्यय एकवचन पुल्लिंग है और अगली क्रिया יָדַע भी एकवचन है। इसलिए मुख्य पाठ सबसे सीधा व्याकरणिक सम्बन्ध बनाए रखता है, जबकि पंक्ति के सामूहिक आशय की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नगर’ ज्ञान-साहित्य के लोकोक्तिपरक स्वर के अनुकूल है। मुख्य पाठ मूल के असामान्य बहुवचन–एकवचन तनाव को मिटाने के बजाय सुरक्षित रखता है।
