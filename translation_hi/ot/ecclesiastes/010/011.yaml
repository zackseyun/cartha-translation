  text: אִם יִשֹּׁ֥ךְ הַ/נָּחָ֖שׁ בְּ/לוֹא לָ֑חַשׁ וְ/אֵ֣ין יִתְר֔וֹן לְ/בַ֖עַל הַ/לָּשֽׁוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/011.yaml
  text: If the snake bites before it is charmed[b][a], there is no advantage for the charmer.
translation:
  language: hi
  text: यदि साँप मन्त्र फूँके जाने से पहले ही काट ले, तो सपेरे को कोई लाभ नहीं होता।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जीभ के स्वामी को।” प्रसंग में यह सम्भवतः मन्त्र या उच्चारण द्वारा साँप को वश में करने में निपुण व्यक्ति, अर्थात् सपेरे, के लिए है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “यदि साँप बिना मन्त्र के काट ले, तो जीभ के स्वामी को कोई लाभ नहीं होता।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह एक शर्त या उदाहरणात्मक स्थिति प्रस्तुत करता है; लोकोक्तिपरक कथन में ‘यदि’ स्वाभाविक है।
- source_word: יִשֹּׁךְ
  choice: काट ले
  rationale: נשׁך साँप के काटने के लिए सामान्य क्रिया है; ‘काट ले’ यहाँ घटना के घट जाने का भाव सहज रूप से व्यक्त करता है।
- source_word: הַנָּחָשׁ
  choice: साँप
  rationale: प्रसंग में वास्तविक साँप का चित्र है; आधुनिक हिन्दी में ‘साँप’ स्वाभाविक और अनावश्यक धार्मिक संकेतों से मुक्त है।
- source_word: בְּלוֹא לָחַשׁ
  choice: मन्त्र फूँके जाने से पहले ही
  rationale: לחש फुसफुसाए जाने वाले मन्त्र, जादुई उच्चारण या साँप को वश में करने की क्रिया का संकेत दे सकता है। ‘से पहले ही’ प्रसंग में निहित व्यावहारिक-कालिक अर्थ को व्यक्त करता है, जबकि शब्दगत ‘बिना मन्त्र के’ को पादटिप्पणी में रखा गया है।
- source_word: וְאֵין יִתְרוֹן
  choice: कोई लाभ नहीं होता
  rationale: יתרון सभोपदेशक का प्रमुख शब्द है, जिसका अर्थ लाभ, बढ़त या फायदा है। ‘लाभ’ संक्षिप्त, स्वाभाविक और विषयगत अर्थ के अनुरूप है।
- source_word: לְבַעַל הַלָּשׁוֹן
  choice: सपेरे को
  rationale: शाब्दिक अर्थ ‘जीभ/वाणी का स्वामी’ है। साँप और לחש के संदर्भ में यह सम्भवतः वाणी या मन्त्र में निपुण साँप वश करने वाले व्यक्ति को दर्शाता है; ‘सपेरा’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
