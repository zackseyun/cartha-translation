base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/005.yaml
  text: 'There is an evil I have seen under the sun[a], like an error that goes out from before the ruler:'
translation:
  language: hi
  text: 'एक बुराई मैंने सूर्य के नीचे देखी है—वह ऐसी भूल के समान है जो शासक के पास से निकलती है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵשׁ רָעָה
  choice: एक बुराई है
  rationale: अस्तित्वसूचक आरंभ को बनाए रखता है और רָעָה के नैतिक बुराई, अनुचित बात या दुःखद स्थिति जैसे व्यापक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: सभोपदेशक की विचारपूर्ण, अनुभव-आधारित टिप्पणी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की आवर्ती अभिव्यक्ति का निकट और हिन्दी में सुबोध रूप है।
- source_word: כִּשְׁגָגָה
  choice: ऐसी भूल के समान
  rationale: כְּ के तुलनात्मक भाव और שְׁגָגָה के भूल अथवा अनजाने में हुई चूक के अर्थ को सुरक्षित रखता है; यह निश्चित नहीं करता कि भूल सचमुच अनजाने में हुई थी या केवल वैसी मानी गई।
- source_word: שֶׁיֹּצָא מִלִּפְנֵי
  choice: जो ... के सामने से निकलती है
  rationale: יצא के निकलने और מִלִּפְנֵי के सामने अथवा उपस्थिति से आने के दरबारी बिंब को निकटता से बनाए रखता है।
- source_word: הַשַּׁלִּיט
  choice: शासक
  rationale: अधिकार रखने वाले व्यक्ति के लिए व्यापक, स्पष्ट और वर्तमान हिन्दी शब्द है।
theological_decisions:
- issue: शासक से निकली ‘भूल’ की प्रकृति
  choice: पाठ में ‘भूल के समान’ रखकर तुलना और अनिश्चितता सुरक्षित रखी गई है।
  alternative: इसे सीधे शासक की अनजाने में हुई गलती या जानबूझकर किए अन्याय के रूप में प्रस्तुत करना।
  rationale: इब्रानी כִּשְׁגָגָה वास्तविक असावधानी और भूल जैसी मानी जाने वाली बात—दोनों की गुंजाइश छोड़ता है; प्रसंग इस तनाव को पूरी तरह हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद के अंत का विसर्ग अगले पद में जारी विचार को दर्शाता है।
