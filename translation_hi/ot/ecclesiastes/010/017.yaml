id: ECC.10.17
reference: Ecclesiastes 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַשְׁרֵ֣י/ךְ אֶ֔רֶץ שֶׁ/מַּלְכֵּ֖/ךְ בֶּן חוֹרִ֑ים וְ/שָׂרַ֨יִ/ךְ֙ בָּ/עֵ֣ת יֹאכֵ֔לוּ בִּ/גְבוּרָ֖ה וְ/לֹ֥א בַ/שְּׁתִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/017.yaml
  text: Happy are you[a], O land, when your king is a son of nobles, and your princes eat at the proper time[c][b], for strength and not for drunkenness.
translation:
  language: hi
  text: हे देश, तू सुखी है[a], जब तेरा राजा कुलीनों का पुत्र[b] हो और तेरे अधिकारी उचित समय पर खाएँ—बल पाने के लिए, मदहोश होने के लिए नहीं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तू धन्य है’ या ‘तू सौभाग्यशाली है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ‘जिसका राजा कुलीन वंश का हो’; शाब्दिक रूप से ‘कुलीनों का पुत्र’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘बल के लिए, पीने के लिए नहीं’; यहाँ आशय स्फूर्ति के लिए खाने से है, न कि नशे में डूबने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵיךְ
  choice: तू सुखी है
  rationale: यह पद ईर्ष्या योग्य सुख-समृद्धि या सौभाग्य की दशा व्यक्त करता है। नागरिक सुशासन के इस संदर्भ में ‘सुखी है’ स्वाभाविक है और स्पष्ट ईश्वरीय आशीष का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֶרֶץ
  choice: हे देश
  rationale: राजा और अधिकारियों के उल्लेख के कारण यहाँ राजनीतिक भू-क्षेत्र अभिप्रेत है। ‘हे देश’ सीधे संबोधन और काव्यात्मक गरिमा दोनों को बनाए रखता है।
- source_word: שֶׁמַּלְכֵּךְ
  choice: जब तेरा राजा
  rationale: सम्बन्धवाचक रचना का शाब्दिक रूप ‘जिसका राजा’ हो सकता है, पर इस मंगल-वचन जैसी संरचना में ‘जब तेरा राजा’ आधुनिक हिन्दी में अधिक सहज है और वर्णित परिस्थिति का भाव सुरक्षित रखता है।
- source_word: בֶּן חוֹרִים
  choice: कुलीनों का पुत्र
  rationale: חוֹרִים कुलीन अथवा स्वतंत्र जन्म वाले लोगों को सूचित करता है। ‘कुलीनों का पुत्र’ इब्रानी रूपक के निकट रहता है और पिछले पद के ‘दास’ से निहित विरोध को बनाए रखता है।
- source_word: וְשָׂרַיִךְ
  choice: और तेरे अधिकारी
  rationale: שָׂרִים राजकीय प्रधानों, शासकों या अधिकारियों के लिए प्रयुक्त हो सकता है। ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और ‘राजकुमार’ कहकर रक्त-संबंध का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בָּעֵת
  choice: उचित समय पर
  rationale: यह केवल किसी समय का नहीं, प्रसंगानुकूल समय का संकेत देता है और पिछले पद में सुबह भोज करने के विपरीत संयमित समय को व्यक्त करता है।
- source_word: יֹאכֵלוּ
  choice: खाएँ
  rationale: मूल क्रिया का साधारण अर्थ ‘खाना’ है; दरबारी भोज का संदर्भ होते हुए भी ‘भोज करें’ जैसी व्याख्यात्मक वृद्धि आवश्यक नहीं है।
- source_word: בִּגְבוּרָה
  choice: बल पाने के लिए
  rationale: גְּבוּרָה का अर्थ बल, सामर्थ्य या स्फूर्ति है। यहाँ भोजन का उद्देश्य देहबल पाना है; हिन्दी में प्रयोजन स्पष्ट करने के लिए ‘बल पाने के लिए’ स्वाभाविक है।
- source_word: וְלֹא בַשְּׁתִי
  choice: मदहोश होने के लिए नहीं
  rationale: שְׁתִי का शाब्दिक संबंध पीने से है, पर विरोध भोजन-पान और मद्यपान के बीच नहीं, बल्कि शक्ति के लिए खाने और असंयमित नशे के बीच है। यह अनुवाद संदर्भगत आशय स्पष्ट करता है।
