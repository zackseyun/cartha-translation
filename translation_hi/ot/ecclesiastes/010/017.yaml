  register: आधुनिक मानक हिन्दी में सीधे संबोधन की काव्यात्मक गरिमा रखी गई है। ‘तू/तेरा/तेरे’ देश को एकवचन सम्बोधन के अनुरूप हैं और अपमानसूचक नहीं। वाक्य साधारण पाठक के लिए सहज है, जबकि ‘कुलीनों का पुत्र’ मूल की ठोस अभिव्यक्ति को सुरक्षित रखता है।
