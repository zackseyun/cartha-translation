lexical_decisions:
- source_word: נִתַּן
  choice: रखी जाती है
  rationale: निफ़अल रूप का निष्क्रिय अर्थ ‘रखी/स्थापित की जाती है’ है। यह अभिकर्ता को अनिर्दिष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: הַסֶּכֶל
  choice: मूर्खता
  rationale: यह संज्ञा किसी एक मूर्ख व्यक्ति के बजाय मूर्खता या विवेकहीनता को दर्शाती है; ‘मूर्खता’ सभोपदेशक में बुद्धि के साथ विषयगत विरोध भी बनाए रखती है।
- source_word: בַּמְּרוֹמִים רַבִּים
  choice: अनेक ऊँचे स्थानों पर
  rationale: मूल का स्थान-संबंधी बिंब सुरक्षित रखा गया है। प्रसंग में ये ‘ऊँचे स्थान’ प्रतिष्ठा, पद या सामाजिक हैसियत का रूपक हैं; ‘अनेक’ רַבִּים को व्यक्त करता है।
- source_word: וַעֲשִׁירִים
  choice: और धनवान लोग
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धनवान लोग’ वर्ग-संदर्भ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּשֵּׁפֶל
  choice: नीची जगह पर
  rationale: यह शब्द नीचाई या निम्न स्थान/दशा दर्शाता है। यह चयन पहले खंड के ‘ऊँचे स्थानों’ के साथ स्थान-संबंधी विरोध बनाए रखता है।
- source_word: יֵשֵׁבוּ
  choice: बैठते हैं
  rationale: ישב का सामान्य अर्थ ‘बैठना’ है; यहाँ सामाजिक स्थान ग्रहण करने का भाव भी संभव है। शाब्दिक बिंब को बनाए रखते हुए अति-व्याख्या से बचा गया है।
