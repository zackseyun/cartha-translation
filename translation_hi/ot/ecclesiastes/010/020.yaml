id: ECC.10.20
reference: Ecclesiastes 10:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּ֣ם בְּ/מַדָּֽעֲ/ךָ֗ מֶ֚לֶךְ אַל תְּקַלֵּ֔ל וּ/בְ/חַדְרֵי֙ מִשְׁכָּ֣בְ/ךָ֔ אַל תְּקַלֵּ֖ל עָשִׁ֑יר כִּ֣י ע֤וֹף הַ/שָּׁמַ֨יִם֙ יוֹלִ֣יךְ אֶת הַ/קּ֔וֹל וּ/בַ֥עַל ה/כנפים יַגֵּ֥יד דָּבָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/020.yaml
  text: Even in your thoughts[a], do not curse a king, and in your bedroom do not curse a rich man, for a bird of the heavens may carry the sound[c][b], and a winged creature may report the matter.
translation:
  language: hi
  text: अपने मन में भी[a] किसी राजा को शाप मत दो, और अपने शयनकक्ष में भी[b] किसी धनी व्यक्ति को शाप मत दो; क्योंकि आकाश का कोई पक्षी[c] उस आवाज़ को ले जा सकता है, और कोई पंखोंवाला जीव उस बात को बता सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘अपने विचारों में’ या ‘अपने ज्ञान में’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अक्षरशः, ‘अपने सोने के कक्षों में’; अर्थात घर के अत्यंत निजी स्थान में।
    reason: cultural_note
  - marker: c
    text: अक्षरशः, ‘आकाश का पक्षी।’ यह नीतिवचनात्मक चित्र बताता है कि अत्यंत गोपनीय कही गई बात भी फैल सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּמַדָּעֲךָ
  choice: अपने मन में
  rationale: מַדָּע का अर्थ ज्ञान, विचार या मन हो सकता है। यहाँ अत्यंत निजी स्थानों में भी सावधानी रखने की चेतावनी है, इसलिए ‘अपने मन में’ स्वाभाविक हिन्दी में आंतरिक विचार का भाव व्यक्त करता है।
- source_word: מֶלֶךְ
  choice: किसी राजा
  rationale: इब्रानी में निश्चित उपपद नहीं है; ‘किसी राजा’ कहने से यह उक्ति किसी एक विशेष राजा तक सीमित न रहकर सामान्य चेतावनी बनी रहती है।
- source_word: תְּקַלֵּל
  choice: शाप मत दो
  rationale: पिएल रूप में קלל का सीधा अर्थ शाप देना या तिरस्कारपूर्वक बुरा कहना है। ‘शाप मत दो’ दोनों समानांतर निषेधों में मूल की तीव्रता बनाए रखता है।
- source_word: בְחַדְרֵי מִשְׁכָּבְךָ
  choice: अपने शयनकक्ष में
  rationale: वाक्यांश का अक्षरशः अर्थ ‘अपने सोने के कक्षों में’ है और वह घर के सर्वाधिक निजी स्थान की ओर संकेत करता है। ‘शयनकक्ष’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: עָשִׁיר
  choice: किसी धनी व्यक्ति
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘किसी धनी व्यक्ति’ एक व्यक्ति का संकेत और कहावत की सामान्य प्रयोज्यता दोनों बनाए रखता है।
- source_word: עוֹף הַשָּׁמַיִם
  choice: आकाश का कोई पक्षी
  rationale: यह ‘आकाश का पक्षी’ का निकट और स्वाभाविक हिन्दी रूप है; ‘कोई’ संभाव्य, सामान्य चेतावनी के अनुरूप है।
- source_word: יוֹלִיךְ אֶת הַקּוֹל
  choice: उस आवाज़ को ले जा सकता है
  rationale: קוֹל का मूल अर्थ आवाज़ या ध्वनि है। ‘ले जा सकता है’ मूल बिंब को बनाए रखते हुए इस नीतिवचन की संभाव्य चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַעַל הַכְּנָפַיִם
  choice: कोई पंखोंवाला जीव
  rationale: अक्षरशः ‘पंखों का स्वामी/धारक’ एक पंखयुक्त प्राणी के लिए मुहावरेदार अभिव्यक्ति है। ‘पंखोंवाला जीव’ पक्षी के समानांतर बिंब को सुरक्षित रखता है।
- source_word: יַגֵּיד דָּבָר
  choice: उस बात को बता सकता है
  rationale: נגד का अर्थ बताना या प्रकट करना और דָבָר का अर्थ यहाँ कही गई बात है। यह चयन निजी कथन के दूसरों तक पहुँच जाने की चेतावनी स्पष्ट करता है।
