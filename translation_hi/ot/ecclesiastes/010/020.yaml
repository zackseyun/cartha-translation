translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘शाप मत दो’ मूल निषेध की तीव्रता बनाए रखता है, जबकि ‘मन’, ‘शयनकक्ष’ और ‘बता सकता है’ सामान्य पाठक के लिए सहज हैं। वाक्य की दो समानांतर चेतावनियाँ और पक्षी/पंखोंवाले जीव का काव्यात्मक बिंब सुरक्षित रखा गया है।
