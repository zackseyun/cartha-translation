  yaml_path: translation/ot/ecclesiastes/010/002.yaml
  text: A wise man's heart is at his right hand[a], but a fool's heart is at his left.
translation:
  language: hi
  text: बुद्धिमान का हृदय उसकी दाहिनी ओर[a] होता है, पर मूर्ख का हृदय उसकी बाईं ओर होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी दाहिनी ओर … उसकी बाईं ओर।” इब्रानी मुहावरे में दाहिनी और बाईं ओर प्रतीकात्मक रूप से प्रयुक्त हैं; संभवतः वे सुदृढ़ निर्णय और खराब निर्णय का संकेत देती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: यहाँ לֵב मनुष्य के विचार, विवेक और भीतरी प्रवृत्ति को समेटता है। ‘हृदय’ मूल रूपक को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमान’ प्रतिनिधिक पुल्लिंग एकवचन को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִימִינוֹ
  choice: उसकी दाहिनी ओर
  rationale: לְ के साथ ‘दाहिना’ दिशा या पक्ष बताता है। यह अनुवाद स्थान-संबंधी रूपक को बिना उसका अर्थ निश्चित किए सुरक्षित रखता है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में כְּסִיל नैतिक और बौद्धिक अविवेक वाले व्यक्ति को दर्शाता है; ‘मूर्ख’ इसका मानक और गरिमापूर्ण हिन्दी प्रतिशब्द है।
- source_word: לִשְׂמֹאלוֹ
  choice: उसकी बाईं ओर
  rationale: यह ‘दाहिनी ओर’ के समानांतर स्थान-संबंधी अभिव्यक्ति है और मूल विरोध को स्पष्ट रूप से बनाए रखती है।
theological_decisions:
- issue: ज्ञान-सूक्ति में पुल्लिंग एकवचन विशेषणों का संज्ञात्मक प्रयोग
  choice: ‘बुद्धिमान’ और ‘मूर्ख’ के रूप में प्रतिनिधिक पुल्लिंग एकवचन बनाए रखना
  alternative: ‘बुद्धिमान व्यक्ति’ और ‘मूर्ख व्यक्ति’
  rationale: इब्रानी में दोनों पद पुल्लिंग एकवचन हैं और सामान्य मानवीय प्रकारों को सामने रखते हैं। संक्षिप्त हिन्दी रूप मूल की समानांतर रचना और प्रतिनिधिक प्रयोग दोनों को सुरक्षित रखता है।
- issue: दाहिनी और बाईं ओर के प्रतीकात्मक अर्थ
  choice: स्थान-संबंधी रूपक को मुख्य पाठ में ज्यों का त्यों रखना
  alternative: ‘बुद्धिमान सही दिशा में चलता है, पर मूर्ख गलत दिशा में’
  rationale: मूल पाठ प्रतीक की व्याख्या स्पष्ट रूप से नहीं करता। व्याख्यात्मक अर्थ को मुख्य पाठ में रखने से वास्तविक रूपक और उसकी कुछ अनिश्चितता मिट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मूल के समानांतर वाक्य-विन्यास वाला अनुवाद। ‘हृदय’ तथा दाहिनी-बाईं ओर की छवि को जानबूझकर बनाए रखा गया है; व्याख्या पादटिप्पणी तक सीमित है।
