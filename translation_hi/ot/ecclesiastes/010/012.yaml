  yaml_path: translation/ot/ecclesiastes/010/012.yaml
  text: The words of the mouth of a wise man are gracious[a], but the lips of a fool swallow him up.
translation:
  language: hi
  text: बुद्धिमान के मुँह की बातें मनभावनी होती हैं[a], पर मूर्ख के होंठ उसी को निगल जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान के मुँह की बातें अनुग्रहकारी हैं।” यहाँ חֵן का अर्थ अधिक ठोस रूप में “कृपा,” “अनुग्रह,” या “पक्ष” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי פִי חָכָם
  choice: बुद्धिमान के मुँह की बातें
  rationale: यह अनुवाद संबंधसूचक रचना और ‘मुँह’ के ठोस बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है। חָכָם पुल्लिंग एकवचन में संज्ञा के समान प्रयुक्त है; ‘बुद्धिमान’ उसका सामान्य और गरिमापूर्ण रूप है।
- source_word: חֵן
  choice: मनभावनी
  rationale: חֵן यहाँ विधेय संज्ञा के रूप में कृपा, अनुग्रह, आकर्षण या प्रियता का भाव दे सकता है। ‘मनभावनी होती हैं’ बुद्धिमान की बातों के प्रिय और अनुकूल प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक ठोस ‘कृपा/अनुग्रह दिलाती हैं’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שִׂפְתוֹת כְּסִיל
  choice: मूर्ख के होंठ
  rationale: ‘होंठ’ का काव्यात्मक बिंब पहले खंड के ‘मुँह’ के समानांतर रखा गया है; כְּסִיל के लिए ज्ञान-साहित्य में प्रचलित ‘मूर्ख’ उपयुक्त है।
- source_word: תְּבַלְּעֶנּוּ
  choice: उसी को निगल जाते हैं
  rationale: בלע के सजीव रूपक ‘निगलना’ को बनाए रखा गया है। प्रत्यय का संकेत मूर्ख की ओर है; ‘उसी को’ स्पष्ट करता है कि उसका अपना वचन उसे विनाश की ओर ले जाता है, बिना रूपक को खोलकर व्याख्या किए।
