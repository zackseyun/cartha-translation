source:
  edition: WLC
  text: אִם קֵהָ֣ה הַ/בַּרְזֶ֗ל וְ/הוּא֙ לֹא פָנִ֣ים קִלְקַ֔ל וַ/חֲיָלִ֖ים יְגַבֵּ֑ר וְ/יִתְר֥וֹן הכשיר חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/010.yaml
  text: If the iron is dull and one has not sharpened its edge[a], then he must use more strength[b]; but wisdom brings success.
translation:
  language: hi
  text: यदि लोहा कुंद हो और किसी ने उसकी धार तेज़ न की हो,[a] तो अधिक बल लगाना पड़ता है; पर बुद्धि सफलता दिलाती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि लोहा कुंद हो और उसने उसकी सतह/धार को ठीक न किया हो।” यहाँ “लोहा” सम्भवतः लोहे की धार या काटने वाले औज़ार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम खंड का अनुवाद यह भी हो सकता है: “बुद्धि का लाभ यह है कि वह सफलता दिलाती है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֵהָה
  choice: कुंद हो
  rationale: यह शब्द धार के भोथरे या कुंद होने को व्यक्त करता है; आधुनिक हिन्दी में ‘कुंद’ इस औज़ार-संबंधी चित्र को स्वाभाविक रूप से बताता है।
- source_word: הַבַּרְזֶל
  choice: लोहे का औज़ार
  rationale: शाब्दिक रूप ‘लोहा’ है, पर प्रसंग में इसका संकेत किसी लोहे की धार या काटने वाले औज़ार की ओर है; हिन्दी में ‘लोहे का औज़ार’ अर्थ स्पष्ट रखता है।
- source_word: פָנִים
  choice: उसकी धार
  rationale: शाब्दिक अर्थ ‘मुख/सतह’ है, पर यहाँ औज़ार के काम करने वाले किनारे, अर्थात उसकी धार, का बोध होता है।
- source_word: קִלְקַל
  choice: धार तेज़ न की गई हो
  rationale: दुर्लभ क्रिया का प्रसंगगत अर्थ धार को ठीक या तैयार करना है; ‘तेज़ करना’ कुंद औज़ार के चित्र को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וַחֲיָלִים יְגַבֵּר
  choice: अधिक बल लगाना पड़ता है
  rationale: यह पदबंध बढ़ी हुई शक्ति या जोर लगाने की आवश्यकता बताता है; निर्वैयक्तिक हिन्दी वाक्य मूल की अनिर्दिष्ट कर्तृवाचकता को बनाए रखता है।
- source_word: וְיִתְרוֹן הכשיר חָכְמָה
  choice: पर बुद्धि सफलता दिलाती है
  rationale: अंतिम खंड में ‘लाभ/बढ़त’ और ‘सफल या उपयुक्त बनाने’ के विचार जुड़े हैं। यह अनुवाद व्यावहारिक बुद्धि से मिलने वाले प्रभावी परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम खंड में बुद्धि के ‘लाभ’ और ‘सफल बनाने’ का संबंध
  choice: पर बुद्धि सफलता दिलाती है
  alternative: और सफल होने का लाभ बुद्धि में है
  rationale: हिब्रू वाक्यरचना अत्यंत संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ में सम्भावित व्यावहारिक आशय दिया गया है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित रखी गई है; इसे किसी विशेष धर्मसैद्धांतिक दावे में नहीं बदला गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। औज़ार के रूपक को स्पष्ट करने के लिए ‘लोहा’ के स्थान पर ‘लोहे का औज़ार’ रखा गया है। मूल की अनिर्दिष्ट कर्तृवाचकता को ‘लगाना पड़ता है’ से सुरक्षित रखा गया है, और अंतिम संक्षिप्त हिब्रू खंड की वैकल्पिक समझ पादटिप्पणी में दी गई है।
