  language: hi
  text: जो पत्थर हटाता है, उसे उनसे चोट लग सकती है, और जो लकड़ी के लट्ठे चीरता है, वह उनसे खतरे में पड़ सकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַסִּיעַ אֲבָנִים
  choice: जो पत्थर हटाता है
  rationale: מַסִּיעַ का मूल भाव पत्थरों को हटाना या खिसकाना है; केवल ‘खदान से निकालना’ कहना प्रसंग को आवश्यकता से अधिक संकीर्ण कर देता।
- source_word: יֵעָצֵב בָּהֶם
  choice: उसे उनसे चोट लग सकती है
  rationale: क्रिया पीड़ा या चोट सहने का भाव देती है; सामान्य कार्य-संबंधी जोखिम व्यक्त करने के लिए संभावनार्थक रूप स्वाभाविक है।
- source_word: בּוֹקֵעַ עֵצִים
  choice: जो लकड़ी के लट्ठे चीरता है
  rationale: בקע का अर्थ चीरना है और עֵצִים यहाँ चीरने योग्य लकड़ी या लट्ठों को दर्शाता है।
- source_word: יִסָּכֶן בָּם
  choice: वह उनसे खतरे में पड़ सकता है
  rationale: प्राचीन अनुवादों और पद के समानांतर ढाँचे के अनुरूप इसे संकट में पड़ने के अर्थ में लिया गया है; ‘उनसे’ बहुवचन लकड़ी के लट्ठों की ओर संकेत करता है।
