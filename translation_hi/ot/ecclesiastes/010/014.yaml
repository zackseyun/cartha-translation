  text: וְ/הַ/סָּכָ֖ל יַרְבֶּ֣ה דְבָרִ֑ים לֹא יֵדַ֤ע הָ/אָדָם֙ מַה שֶׁ/יִּֽהְיֶ֔ה וַ/אֲשֶׁ֤ר יִֽהְיֶה֙ מֵֽ/אַחֲרָ֔י/ו מִ֖י יַגִּ֥יד לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/014.yaml
  text: And the fool multiplies words[a]. A man does not know what will be[b], and who can tell him what will be after him?
translation:
  language: hi
  text: और मूर्ख बहुत बोलता जाता है। मनुष्य[a] नहीं जानता कि क्या होगा; और उसके बाद क्या होगा[b]—यह उसे कौन बता सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ एक प्रतिनिधि एकवचन है; आशय सामान्य रूप से मानवजाति से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके चले जाने के बाद क्या होगा।’ इब्रानी वाक्यांश का अर्थ किसी व्यक्ति के समय के बाद, विशेषकर उसके जीवन के बाद, होने वाली बातें हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַסָּכָל
  choice: और मूर्ख
  rationale: निश्चित एकवचन संज्ञा הַסָּכָל का सीधा अर्थ ‘मूर्ख’ है। וְ को ‘और’ के रूप में रखकर पूर्ववर्ती विचार से प्रवाह बनाए रखा गया है।
- source_word: יַרְבֶּה דְבָרִים
  choice: अपनी बातें बढ़ाता जाता है
  rationale: רבה के हिफ़ील रूप और דְבָרִים का मुहावरा बहुत बोलने अथवा शब्दों को बढ़ाते जाने का भाव देता है। यह अनुवाद इब्रानी बिंब को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא יֵדַע הָאָדָם
  choice: मनुष्य नहीं जानता
  rationale: הָאָדָם यहाँ किसी विशेष पुरुष के बजाय समस्त मानवता का प्रतिनिधि एकवचन है। ‘मनुष्य’ एकवचन रूप और सामान्य अर्थ दोनों को बनाए रखता है।
- source_word: מַה שֶׁיִּהְיֶה
  choice: क्या होगा
  rationale: यह भविष्य के विषय में खुली और संक्षिप्त अभिव्यक्ति है; ‘क्या होगा’ स्वाभाविक हिन्दी है और मूल की अनिश्चितता बनाए रखती है।
- source_word: וַאֲשֶׁר יִהְיֶה מֵאַחֲרָיו
  choice: और उसके बाद क्या होगा
  rationale: मूल वाक्यांश व्यक्ति के बाद आने वाली बातों को दर्शाता है, पर यह स्पष्ट नहीं करता कि आशय केवल उसकी मृत्यु के बाद का है या सामान्यतः उसके समय के बाद का। अनुवाद इस अस्पष्टता को सुरक्षित रखता है।
- source_word: מִי יַגִּיד לוֹ
  choice: यह उसे कौन बता सकता है?
  rationale: प्रश्नवाचक מִי और נגד के हिफ़ील रूप का यहाँ आलंकारिक अर्थ है कि भविष्य बताने में कोई समर्थ नहीं। ‘कौन बता सकता है?’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: מֵאַחֲרָיו में समय-संबंधी अस्पष्टता
  choice: उसके बाद
  alternative: उसके चले जाने के बाद / उसकी मृत्यु के बाद
  rationale: मूल पाठ व्यक्ति की मृत्यु को स्पष्ट रूप से नहीं कहता। इसलिए मुख्य पाठ व्यापक वाक्यांश रखता है और संभावित मरणोत्तर अर्थ को पादटिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी बातें बढ़ाता जाता है’ मूल के ‘शब्द बढ़ाना’ बिंब को हिन्दी में समझने योग्य बनाता है। अर्धविराम और दीर्घ विराम वचन की दो परस्पर जुड़ी बातों तथा अंतिम आलंकारिक प्रश्न को स्पष्ट करते हैं।
