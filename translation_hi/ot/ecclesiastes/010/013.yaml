review_pass:
  verdict: revise
  source_fidelity: Draft conveys the overall antithetical progression, but ‘सनक’ commonly denotes a whim, eccentric fixation, or caprice and does not adequately convey הוֹלֵלוּת, the intensified irrationality/madness in the Hebrew. The first clause’s ‘मुँह से निकले’ is a permissible idiomatic expansion, but repeating ‘मुँह की बातें’ better preserves the deliberate Hebrew parallelism.
  naturalness: ‘उसके मुँह की बातों का आरम्भ ... और उसके मुँह की बातों का अन्त ...’ is clear, dignified modern Hindi and retains the verse’s compact poetic symmetry. ‘बुरा उन्माद’ is more faithful to the source than ‘बुरी सनक’ and is suitably forceful in this wisdom-saying context.
  terminology: ‘मूर्खता’ accurately renders סִכְלוּת. ‘उन्माद’ appropriately renders הוֹלֵלוּת as something stronger than ordinary folly. ‘बुरा’ preserves the moral sense of רָעָה while the note retains the possible broader sense ‘हानिकारक.’
  issues:
  - severity: medium
    issue: ‘सनक’ for הוֹלֵלוּת is insufficiently strong and can suggest mere caprice.
    rationale: The Hebrew term denotes madness, irrationality, or extreme folly; ‘उन्माद’ communicates this intensification more accurately.
  - severity: low
    issue: The repeated ‘उसका मुँह’ is softened differently in the two clauses.
    rationale: Hindi can naturally retain the repetition as ‘उसके मुँह की बातें,’ preserving the Hebrew’s emphatic poetic parallelism without awkwardness.
  revised_text: उसके मुँह की बातों का आरम्भ मूर्खता है, और उसके मुँह की बातों का अन्त बुरा उन्माद है[a]।
  revised_footnotes:
