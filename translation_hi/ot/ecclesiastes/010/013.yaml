  yaml_path: translation/ot/ecclesiastes/010/013.yaml
  text: The beginning of the words of his mouth is foolishness[a], and the end of his speech is evil madness.
translation:
  language: hi
  text: उसके मुँह की बातों का आरम्भ मूर्खता है, और उसके मुँह की बातों का अन्त बुरा उन्माद है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हानिकारक उन्माद।’ इब्रानी में ‘उसका मुँह’ दोहराया गया है, और רָעָה का अर्थ ‘बुरा’ अथवा व्यापक अर्थ में ‘हानिकारक’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבְרֵי פִיהוּ
  choice: उसके मुँह से निकले शब्दों का आरम्भ
  rationale: यह रूप ‘उसके मुँह के शब्दों का आरम्भ’ की मूल छवि और संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: סִכְלוּת
  choice: मूर्खता
  rationale: यह सभोपदेशक में बुद्धि के विपरीत आचरण और सोच को स्पष्ट, प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וְאַחֲרִית פִיהוּ
  choice: और उसकी बातों का अन्त
  rationale: इब्रानी में ‘उसके मुँह’ की पुनरावृत्ति है, पर यहाँ आशय उसके कथन के अंतिम चरण से है; ‘उसकी बातों’ हिन्दी में स्वाभाविक रहते हुए समानांतरता बनाए रखता है।
- source_word: הוֹלֵלוּת
  choice: सनक
  rationale: यह शब्द साधारण मूर्खता से बढ़कर विवेकहीन और उन्मत्त अवस्था का संकेत देता है; ‘सनक’ आधुनिक हिन्दी में इस तीव्रता को सहज रूप से प्रकट करता है।
- source_word: רָעָה
  choice: बुरी
  rationale: यह विशेषण नैतिक रूप से बुरे तथा हानिकारक—दोनों संभावित अर्थों को कुछ हद तक खुला रखता है।
