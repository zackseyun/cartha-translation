  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। देश को स्त्रीलिंग एकवचन में प्रत्यक्ष संबोधन (‘तुझ’, ‘तेरा’) दिया गया है। ‘हाकिम’ उच्च शासकीय अधिकारियों को व्यक्त करता है और ‘राजकुमार’ की संभावित वंशगत संकीर्णता से बचता है।
