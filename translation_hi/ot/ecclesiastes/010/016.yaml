base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/016.yaml
  text: Woe to you[a], O land[b], when your king is a youth and your princes eat in the morning.
translation:
  language: hi
  text: हे देश, तुझ पर हाय[a], जब तेरा राजा युवक हो और तेरे अधिकारी सुबह खाते हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी अनुवाद किया जा सकता है: “हे देश, तेरे लिए हाय, जिसका राजा बालक है।” इब्रानी शब्द נַעַר का अर्थ बालक, युवक या जवान आदमी हो सकता है; यहाँ यह संभवतः शासन में अपरिपक्वता का संकेत देता है।'
    reason: lexical_alternative
  - marker: b
    text: अधिकारियों का सुबह खाना संभवतः अनुचित समय पर भोग-विलास के लिए दावत करने का संकेत है; अगले पद में इसके विपरीत संयमित आचरण की प्रशंसा की गई है।
    reason: cultural_note
lexical_decisions:
- source_word: אִי לָךְ
  choice: तुझ पर हाय
  rationale: यह संबोधित देश के लिए शोक और धिक्कारसूचक चेतावनी है; हिन्दी में ‘तुझ पर हाय’ उसका बल और प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: אֶרֶץ
  choice: देश
  rationale: यहाँ अर्थ समूची पृथ्वी नहीं, बल्कि राजा और हाकिमों के अधीन राजनीतिक भूभाग या राष्ट्र है; आधुनिक हिन्दी में ‘देश’ सर्वाधिक स्वाभाविक है।
- source_word: שֶׁמַּלְכֵּךְ
  choice: जब तेरा राजा
  rationale: सम्बन्धवाचक שֶׁ को प्रसंगानुसार परिस्थितिसूचक ‘जब’ से व्यक्त करना हिन्दी में स्वाभाविक है और भाव को नहीं बदलता।
- source_word: נָעַר
  choice: अपरिपक्व युवक
  rationale: נַעַר बालक, युवक या जवान व्यक्ति को सूचित कर सकता है। प्रसंग में शासन की अपरिपक्वता प्रमुख है; ‘अपरिपक्व युवक’ आयु और आशय दोनों को स्पष्ट करता है, जबकि शाब्दिक विस्तार पादटिप्पणी में सुरक्षित है।
- source_word: וְשָׂרַיִךְ
  choice: और तेरे हाकिम
  rationale: שָׂרִים राजा के अधीन उच्च पदाधिकारी या शासक हैं। ‘हाकिम’ सामान्य आधुनिक हिन्दी में समझने योग्य है और अनिवार्य वंशगत राजकुमार होने का भ्रम नहीं देता।
- source_word: בַּבֹּקֶר
  choice: सुबह ही
  rationale: मूल का अर्थ ‘सुबह’ है; ‘ही’ अनुचित समय पर खाने के प्रसंगगत संकेत को स्वाभाविक हिन्दी में उभारता है, बिना क्रिया को स्पष्ट रूप से ‘दावत उड़ाना’ बनाने के।
- source_word: יֹאכֵלוּ
  choice: खाने बैठ जाएँ
  rationale: मूल क्रिया का सामान्य अर्थ ‘खाना’ है। हिन्दी मुहावरा ‘खाने बैठ जाएँ’ संदर्भ में नियमित भोजन से अधिक शासन छोड़कर भोजन में लगने का संकेत देता है, पर अतिव्याख्या से बचता है।
