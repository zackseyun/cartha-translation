source:
  edition: WLC
  text: וְ/גַם בַּ/דֶּ֛רֶךְ כ/ש/ה/סכל הֹלֵ֖ךְ לִבּ֣/וֹ חָסֵ֑ר וְ/אָמַ֥ר לַ/כֹּ֖ל סָכָ֥ל הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/003.yaml
  text: Even on the road[a], when the fool walks, his heart lacks sense, and he says to everyone that he is a fool.
translation:
  language: hi
  text: मूर्ख जब रास्ते पर[a] भी चलता है, तो उसके मन में समझ की कमी है, और वह हर किसी से कहता है कि वह मूर्ख है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह हर किसी से कहता है, ‘वह मूर्ख है।’” इब्रानी का अर्थ या तो यह हो सकता है कि मूर्ख स्वयं को मूर्ख प्रकट करता है, या यह कि वह दूसरों को मूर्ख कहता है। प्रसंग में पहला अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: तब भी
  rationale: यह पद सार्वजनिक और साधारण परिस्थिति में भी मूर्खता प्रकट होने पर बल देता है; हिंदी वाक्यक्रम में ‘तब भी’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּדֶּרֶךְ
  choice: रास्ते पर
  rationale: स्थान-सूचक चित्र को सीधे और सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: כשהסכל הֹלֵךְ
  choice: मूर्ख जब ... चलता है
  rationale: כ + ש को काल-सूचक ‘जब’ और הֹלֵךְ को रास्ते के चित्र के अनुरूप ‘चलता है’ किया गया है।
- source_word: לִבּוֹ חָסֵר
  choice: उसके मन में समझ की कमी होती है
  rationale: इब्रानी ‘हृदय’ यहाँ बुद्धि, विवेक या निर्णय-क्षमता का केंद्र है। ‘मन में समझ की कमी’ मूल रूपक की कुछ झलक रखते हुए हिंदी में अभिप्राय स्पष्ट करता है।
- source_word: וְאָמַר לַכֹּל
  choice: और वह हर किसी को बता देता है
  rationale: אָמַר का मूल अर्थ ‘कहना’ है, पर इस संदर्भ में उसकी चाल-ढाल या वाणी स्वयं उसकी मूर्खता प्रकट करती है; ‘बता देता है’ इस आत्म-प्रकाशन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: סָכָל הוּא
  choice: कि वह मूर्ख है
  rationale: सर्वनाम को उसी मूर्ख की ओर संकेत मानते हुए संज्ञात्मक ‘मूर्ख’ रखा गया है। इब्रानी में इसका दूसरा संभावित अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: סָכָל הוּא में सर्वनाम का संदर्भ
  choice: मूर्ख अपनी ही मूर्खता प्रकट करता है—‘कि वह मूर्ख है’
  alternative: वह दूसरों के विषय में कहता है, ‘वह मूर्ख है’
  rationale: सर्वनाम का संदर्भ व्याकरणतः अस्पष्ट है। आत्म-प्रकाशन वाला अर्थ प्रसंग में अधिक स्वाभाविक है, पर वैकल्पिक अर्थ को दबाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘हृदय’ का अत्यधिक शाब्दिक प्रयोग न करके बौद्धिक-विवेक संबंधी अर्थ के लिए ‘मन में समझ’ रखा गया है; अंतिम इब्रानी वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
