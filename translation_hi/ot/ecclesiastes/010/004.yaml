base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/010/004.yaml
  text: If the ruler’s anger rises against you[a], do not leave your place[d][c][b], for calmness lays great offenses to rest.
translation:
  language: hi
  text: यदि शासक का क्रोध[a] तुम पर भड़क उठे, तो अपना स्थान[b] मत छोड़ो, क्योंकि शांतचित्तता[c] बड़े-बड़े दोषों[d] को भी थमा देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “शासक की आत्मा”; इसका अर्थ “शासक का मिज़ाज” भी हो सकता है। यहाँ संभवतः उसके भड़के हुए क्रोध का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारा स्थान”; इसका अर्थ तुम्हारा पद या नियुक्त जगह भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “कोमलता,” “चंगाई,” अथवा “शांत व्यवहार।” इब्रानी शब्द में शांत करने और चंगा करने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “बड़े-बड़े पापों,” “बड़े-बड़े अपराधों,” अथवा “गंभीर दोषों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: क्रोध
  rationale: इस शब्द का मूल अर्थ ‘आत्मा’, ‘हवा’ या ‘मनोभाव’ है, पर ‘तुम पर चढ़ उठे’ के साथ यहाँ यह शासक के भड़के हुए क्रोध को दर्शाता है।
- source_word: הַמּוֹשֵׁל
  choice: शासक
  rationale: यह उस व्यक्ति को दर्शाता है जो शासन या अधिकार करता है; ‘शासक’ व्यापक और सीधा हिन्दी समतुल्य है।
- source_word: תַּעֲלֶה עָלֶיךָ
  choice: तुम पर भड़क उठे
  rationale: शाब्दिक रूप से ‘तुम पर चढ़े’; क्रोध के संदर्भ में ‘भड़क उठे’ स्वाभाविक हिन्दी है और अचानक तीव्र होने का भाव बनाए रखता है।
- source_word: מְקוֹמְךָ
  choice: अपना स्थान
  rationale: शाब्दिक अर्थ ‘तुम्हारा स्थान’ है। यह पद या नियुक्त जगह की ओर संकेत कर सकता है, लेकिन मूल की व्यापकता बनाए रखने के लिए ‘स्थान’ रखा गया है।
- source_word: אַל תַּנַּח
  choice: मत छोड़ो
  rationale: इस संदर्भ में क्रिया का अर्थ अपने स्थान को त्यागना या छोड़ देना है; निषेधात्मक आज्ञा को सरल, सीधी हिन्दी में व्यक्त किया गया है।
- source_word: מַרְפֵּא
  choice: शांत व्यवहार
  rationale: संज्ञा में चंगाई, शमन या कोमलता का भाव है। तनावपूर्ण परिस्थिति में संयत और शांत प्रतिक्रिया का व्यावहारिक अर्थ बताने के लिए ‘शांत व्यवहार’ चुना गया है।
- source_word: יַנִּיחַ
  choice: शांत कर देता है
  rationale: हित्पील रूप का भाव किसी चीज़ को विश्राम देना, थमा देना या शांत करना है; यह चयन मूल के शमनकारी चित्र को सहज हिन्दी में रखता है।
- source_word: חֲטָאִים גְּדוֹלִים
  choice: बड़े-बड़े अपराधों
  rationale: यह पद ‘बड़े पापों’ या ‘गंभीर दोषों’ को भी व्यक्त कर सकता है। शासक के प्रसंग में ‘अपराध’ प्रशासनिक और नैतिक दोनों भार को बनाए रखता है।
