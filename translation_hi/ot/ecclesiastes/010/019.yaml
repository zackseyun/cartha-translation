  yaml_path: translation/ot/ecclesiastes/010/019.yaml
  text: They make bread for laughter[a], and wine gladdens life[b], and money answers everything.
translation:
  language: hi
  text: वे हँसी-मज़ाक के लिए भोजन बनाते हैं,[a] और दाखमधु जीवन को प्रसन्न करता है; धन हर बात का उत्तर देता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “रोटी बनाते हैं”; यहाँ “रोटी” से सामान्यतः भोजन या भोज का आशय हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “धन हर चीज़ का उत्तर देता है।” इसका आशय “धन हर आवश्यकता पूरी करता है” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׂחוֹק עֹשִׂים לֶחֶם
  choice: हँसी-मज़ाक के लिए भोजन तैयार किया जाता है
  rationale: לִשְׂחוֹק उद्देश्य या परिणाम बताता है और यहाँ आमोद-प्रमोद का भाव है। עֹשִׂים का कर्ता अनिश्चित है, इसलिए हिन्दी में स्वाभाविक भाववाच्य रखा गया। לֶחֶם का शाब्दिक अर्थ ‘रोटी’ है, पर इस प्रसंग में वह व्यापक रूप से भोजन को सूचित कर सकता है।
- source_word: וְיַיִן יְשַׂמַּח חַיִּים
  choice: और दाखमधु जीवन को आनन्दित करता है
  rationale: שׂמח के पिएल रूप का अर्थ ‘आनन्दित करना’ है और חַיִּים को यहाँ ‘जीवन’ समझना इस सूक्तिपरक कथन की संक्षिप्तता बनाए रखता है।
- source_word: וְהַכֶּסֶף
  choice: धन
  rationale: כֶּסֶף का अर्थ ‘चाँदी’ या ‘धन’ हो सकता है; यहाँ आर्थिक अर्थ प्रसंग के अधिक अनुकूल है।
- source_word: יַעֲנֶה אֶת־הַכֹּל
  choice: हर बात का उत्तर देता है
  rationale: ענה का मूल भाव ‘उत्तर देना’ है। यह चयन इब्रानी की तीखी, संक्षिप्त अभिव्यक्ति को बनाए रखता है और उसे ‘हर आवश्यकता पूरी करता है’ जैसे अधिक व्याख्यात्मक रूप में नहीं बदलता।
theological_decisions:
- issue: अन्तिम उपवाक्य का स्वर और अभिप्राय
  choice: धन हर बात का उत्तर देता है
  alternative: धन हर आवश्यकता पूरी करता है; अथवा ‘लोग समझते हैं कि धन हर बात का उत्तर है’
  rationale: इब्रानी पाठ कथन को बिना किसी स्पष्ट व्यंग्य-सूचक या सीमाबोधक शब्द के सीधे रखता है। अतः मुख्य पाठ में न तो व्यंग्य आरोपित किया गया और न कथन को व्यावहारिक सीमाओं में बाँधा गया; सभोपदेशक के व्यापक साहित्यिक सन्दर्भ को तनाव स्पष्ट करने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘हँसी-मज़ाक’ שְׂחוֹק के आमोदपूर्ण भाव को सामान्य पाठक तक पहुँचाता है; ‘दाखमधु’ बाइबलीय गरिमा बनाए रखता है। भाववाच्य अनिश्चित बहुवचन कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है।
