source:
  edition: WLC
  text: בִּ/רְבוֹת֙ הַ/טּוֹבָ֔ה רַבּ֖וּ אוֹכְלֶ֑י/הָ וּ/מַה כִּשְׁרוֹן֙ לִ/בְעָלֶ֔י/הָ כִּ֖י אִם ראית עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/010.yaml
  text: When goods increase[a], those who consume them increase[b]; and what advantage is there to their owners except the seeing of their eyes?
translation:
  language: hi
  text: जब सम्पत्ति बढ़ती है[a], तो उसे उपभोग करनेवाले भी बढ़ जाते हैं; और उसके मालिकों को उसे अपनी आँखों से देखने के सिवा क्या लाभ होता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अच्छी वस्तुएँ,” “समृद्धि,” अथवा “धन।” इब्रानी शब्द भौतिक वस्तुओं या व्यापक समृद्धि को सूचित कर सकता है; निकटवर्ती संदर्भ ऐसी सम्पत्ति की ओर संकेत करता है जिसका उपभोग किया जा सकता है और जो किसी के स्वामित्व में होती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी आँखों का देखना।” इब्रानी अभिव्यक्ति का आशय यह हो सकता है कि मालिक को केवल अपनी सम्पत्ति को देख पाने भर का लाभ मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: जब ... बढ़ती है
  rationale: ב के साथ רבה का infinitive construct यहाँ समय-सूचक है; ‘जब ... बढ़ती है’ स्वाभाविक हिन्दी में यह अर्थ रखता है।
- source_word: הַטּוֹבָה
  choice: सम्पत्ति
  rationale: טוֹבָה भलाई, अच्छी वस्तुओं या समृद्धि को सूचित कर सकता है; उपभोग और स्वामित्व के आर्थिक संदर्भ में ‘सम्पत्ति’ उपयुक्त सामूहिक अर्थ देता है।
- source_word: רַבּוּ
  choice: भी बढ़ जाते हैं
  rationale: पहले רבה के साथ मूल पाठ की पुनरुक्ति और समानांतरता को ‘बढ़ती... बढ़ जाते’ द्वारा बनाए रखा गया है।
- source_word: אֹכְלֶיהָ
  choice: उसे उपभोग करनेवाले
  rationale: शाब्दिक अर्थ ‘उसे खानेवाले’ है, पर सम्पत्ति के व्यापक संदर्भ में ‘उपभोग करनेवाले’ आश्रितों और उसका उपयोग करनेवालों दोनों को समेटता है।
- source_word: וּמַה כִּשְׁרוֹן
  choice: क्या लाभ होता है
  rationale: כִּשְׁרוֹן यहाँ लाभ या फ़ायदे के अर्थ में है; प्रश्नवाचक हिन्दी में ‘क्या लाभ होता है’ सहज और स्पष्ट है।
- source_word: לִבְעָלֶיהָ
  choice: उसके मालिकों को
  rationale: בעל स्वामी या मालिक को दर्शाता है। सामूहिक ‘सम्पत्ति’ के साथ मूल के बहुवचन मालिकों को सुरक्षित रखा गया है।
- source_word: כִּי אִם
  choice: के सिवा
  rationale: अलंकारिक प्रश्न के बाद यह पदबंध एकमात्र अपवाद बताता है; ‘के सिवा’ वही सीमित अर्थ देता है।
- source_word: רְאִית עֵינָיו
  choice: उसे अपनी आँखों से देखने
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से ‘उसकी आँखों का देखना’ है। हिन्दी मुहावरे में ‘अपनी आँखों से देखने’ अर्थ को स्वाभाविक रखते हुए मात्र दृष्टि तक सीमित लाभ का संकेत बचाता है।
