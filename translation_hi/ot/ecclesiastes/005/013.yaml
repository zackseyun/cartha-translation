  text: וְ/אָבַ֛ד הָ/עֹ֥שֶׁר הַ/ה֖וּא בְּ/עִנְיַ֣ן רָ֑ע וְ/הוֹלִ֣יד בֵּ֔ן וְ/אֵ֥ין בְּ/יָד֖/וֹ מְאֽוּמָה׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/013.yaml
  text: And that wealth was lost in a bad venture[b][a], and he fathered a son and had nothing in his hand.
translation:
  language: hi
  text: और वह धन किसी हानिकारक उद्यम के कारण नष्ट हो गया[a]। और वह एक पुत्र का पिता बना, और उसके हाथ में कुछ भी नहीं था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी दुखद मामले के कारण” अथवा “किसी दुर्भाग्यपूर्ण परिस्थिति में।” इब्रानी पदबंध किसी हानिकारक उद्यम, मामले या परिस्थिति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके हाथ में कुछ भी नहीं है”; यह उसके पास कुछ भी न होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד
  choice: नष्ट हो गया
  rationale: यहाँ क़ाल पूर्ण रूप का कर्ता ‘धन’ है। ‘नष्ट हो गया’ धन के हाथ से निकल जाने का परिणाम स्वाभाविक हिन्दी में व्यक्त करता है और किसी स्पष्ट बाहरी कर्ता को नहीं जोड़ता।
- source_word: הָעֹשֶׁר הַהוּא
  choice: वह धन
  rationale: עֹשֶׁר का अर्थ धन या संपत्ति है; निश्चित उपपद और संकेतवाचक के मेल को ‘वह धन’ सीधे रूप में दर्शाता है।
- source_word: בְּעִנְיַן רָע
  choice: किसी बुरे उपक्रम में
  rationale: עִנְיָן किसी काम, मामले, उद्यम या परिस्थिति को सूचित कर सकता है। आर्थिक प्रसंग में ‘उपक्रम’ उपयुक्त है, जबकि पादटिप्पणी मूल पदबंध की व्यापकता बनाए रखती है।
- source_word: וְהוֹלִיד בֵּן
  choice: वह एक पुत्र का पिता बना
  rationale: हिफ़ील रूप पुरुष के पुत्र उत्पन्न करने अर्थात पिता बनने को व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और בֵּן की पुरुषवाचक विशिष्टता बनाए रखता है।
- source_word: וְאֵין בְּיָדוֹ מְאוּמָה
  choice: पर उसके हाथ में कुछ भी न रहा
  rationale: यह मूल के ठोस मुहावरे ‘उसके हाथ में कुछ भी नहीं’ को बनाए रखता है और प्रसंग में पूर्ण अभाव का अर्थ स्पष्ट करता है। ‘पर’ पुत्र के होने और उसके लिए कुछ न बचने के निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
