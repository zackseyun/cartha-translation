base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/001.yaml
  text: Do not be hasty with your mouth[a], and do not let your heart be quick to bring forth a word before God, for God is in heaven and you are on earth. Therefore let your words be few.
translation:
  language: hi
  text: अपने मुँह से बोलने में जल्दबाज़ी न कर, और परमेश्वर के सामने कोई बात कहने[a] के लिए अपने मन को उतावला न होने दे; क्योंकि परमेश्वर स्वर्ग में है और तू पृथ्वी पर है। इसलिए तेरे शब्द कम हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई बात निकालने के लिए”; प्रसंग में इसमें उतावली में मन्नत मानना भी शामिल हो सकता है, पर यहाँ इब्रानी शब्द परमेश्वर के सामने बोलने के बारे में अधिक व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּבַהֵל עַל־פִּיךָ
  choice: अपने मुँह से बोलने में उतावली न कर
  rationale: यह अनावश्यक रूप से जल्दबाज़ या उतावला होकर बोलने की मनाही है। हिंदी में ‘अपने मुँह से बोलने में’ मुख की इब्रानी छवि और वाणी का आशय दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִבְּךָ
  choice: अपने मन
  rationale: इब्रानी ‘हृदय’ यहाँ भीतरी विचार और इच्छा का केंद्र है। आधुनिक हिंदी में इस अर्थ के लिए ‘मन’ अधिक सहज है और इसे केवल भावनाओं तक सीमित नहीं करता।
- source_word: אַל־יְמַהֵר
  choice: जल्दबाज़ी न करने दे
  rationale: क्रिया का अर्थ शीघ्रता करना है; इस निषेधात्मक विधान में ‘जल्दबाज़ी न करने दे’ भीतरी आवेग पर संयम का भाव रखता है।
- source_word: לְהוֹצִיא דָבָר
  choice: कोई बात कहने के लिए
  rationale: शाब्दिक अर्थ ‘कोई शब्द बाहर निकालना’ है। सहज हिंदी में ‘कोई बात कहना’ उसी व्यापक वाणी-संदर्भ को रखता है और इसे केवल मन्नत तक सीमित नहीं करता।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में कही जाने वाली बात का सीधा और गरिमापूर्ण हिंदी रूप है।
- source_word: בַּשָּׁמַיִם
  choice: स्वर्ग में
  rationale: इब्रानी बहुवचन रूप यहाँ स्थानवाचक मुहावरे के रूप में है; ‘स्वर्ग में’ हिंदी में स्वाभाविक है और स्वर्ग-पृथ्वी का विरोध बनाए रखता है।
- source_word: עַל־הָאָרֶץ
  choice: पृथ्वी पर
  rationale: यह स्वर्ग के साथ स्थानगत विरोध को सीधे बनाए रखता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: यह परमेश्वर और मनुष्य की स्थिति के अंतर से निकलने वाला व्यावहारिक निष्कर्ष स्पष्ट करता है।
- source_word: יִהְיוּ דְבָרֶיךָ מְעַטִּים
  choice: तेरे शब्द थोड़े हों
  rationale: यह इच्छार्थक-आज्ञार्थक बल और वाणी में संयम दोनों को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: क्या वचन को केवल मन्नतों या प्रतिज्ञाओं तक सीमित किया जाए
  choice: मुख्य पाठ में परमेश्वर के सामने कही जाने वाली बात का व्यापक अर्थ रखा गया है।
  alternative: इसे विशेष रूप से उतावली में मन्नत मानने की चेतावनी के रूप में अनूदित करना।
  rationale: निकटवर्ती प्रसंग में उपासना और मन्नतों की चर्चा है, पर इस पद का इब्रानी पाठ व्यापक रूप से ‘कोई बात निकालने’ की बात करता है। इसलिए अनुवाद प्रसंगगत संभावना को स्वीकारते हुए मुख्य पाठ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। एकवचन संबोधन में ‘तू/तेरे’ रखा गया है, जो इब्रानी के एकवचन रूप और पारंपरिक ज्ञान-साहित्य की सीधी चेतावनी को व्यक्त करता है।
