id: ECC.5.9
reference: Ecclesiastes 5:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֹהֵ֥ב כֶּ֨סֶף֙ לֹא יִשְׂבַּ֣ע כֶּ֔סֶף וּ/מִֽי אֹהֵ֥ב בֶּ/הָמ֖וֹן לֹ֣א תְבוּאָ֑ה גַּם זֶ֖ה הָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/009.yaml
  text: Whoever loves silver will not be satisfied with silver[a], nor whoever loves abundance with income[b]; this too is vapor.
translation:
  language: hi
  text: जो चाँदी से प्रेम करता है, वह चाँदी से तृप्त नहीं होगा; और जो बहुतायत से प्रेम करता है, वह आय से तृप्त नहीं होगा[a]। यह भी वाष्प है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरा खंड इब्रानी में वाक्यरचनात्मक रूप से कठिन है। इसका अर्थ यह भी हो सकता है: “जो धन से प्रेम करता है, वह लाभ से तृप्त नहीं होता।” “बहुतायत” को “धन-संपत्ति” और “आय” को “बढ़ोतरी,” “उपज” या “लाभ” भी समझा जा सकता है।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी: “वाष्प” (परंपरागत अनुवाद “व्यर्थता”)। सभोपदेशक में यह बार-बार आने वाला शब्द है, जो क्षणभंगुर, पकड़ में न आने वाली या अस्थिर वस्तु का बोध कराता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: जो … से प्रेम करता है
  rationale: इब्रानी कृदंत सामान्य रूप से ऐसे किसी भी व्यक्ति का वर्णन करता है जिसकी पहचान उस वस्तु के प्रेम से होती है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके सामान्य अर्थ को बनाए रखता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: शब्द का मूल अर्थ ‘चाँदी’ है और यहाँ वह धन के लिए लक्षणा भी हो सकता है। ‘चाँदी’ रखने से मूल बिंब और दोनों बार की काव्यात्मक पुनरावृत्ति सुरक्षित रहती है।
- source_word: יִשְׂבַּע
  choice: तृप्त नहीं होगा
  rationale: क्रिया भर जाने, संतुष्ट होने या पर्याप्त पाने का भाव व्यक्त करती है। ‘तृप्त नहीं होगा’ धन की कभी न मिटने वाली लालसा को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וּמִי
  choice: और जो
  rationale: कठिन दूसरे खंड में इसे शाब्दिक प्रश्न के बजाय पहले कथन के समानांतर एक सामान्य कथन के आरम्भ के रूप में लिया गया है। ‘और जो’ इब्रानी संयोजक का रूप बनाए रखता है और हिन्दी में सहज है।
- source_word: בֶּהָמוֹן
  choice: बहुतायत
  rationale: הָמוֹן बहुतायत, बड़ी मात्रा या धन-संपत्ति का बोध करा सकता है। ‘बहुतायत’ इस व्यापकता को बनाए रखता है और अर्थ को अनावश्यक रूप से केवल धन तक सीमित नहीं करता।
- source_word: תְבוּאָה
  choice: आय
  rationale: संज्ञा का मूल क्षेत्र उपज, बढ़ोतरी या प्राप्त लाभ है। धन-विषयक इस प्रसंग में ‘आय’ आधुनिक पाठक के लिए स्पष्ट है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: הָבֶל
  choice: वाष्प
  rationale: सभोपदेशक में यह बार-बार आने वाला प्रमुख रूपक है, जो क्षणभंगुर, पकड़ में न आने वाली और अस्थिर वस्तु का बोध कराता है। ‘वाष्प’ रूपक को सुरक्षित रखता है और अर्थ को केवल ‘व्यर्थ’ या ‘अर्थहीन’ तक सीमित नहीं करता।
theological_decisions:
- issue: सभोपदेशक के आवर्ती शब्द הָבֶל का अनुवाद
  choice: वाष्प
  alternative: व्यर्थता; साँस; अर्थहीनता
  rationale: ‘वाष्प’ मूल मूर्त रूपक और उसकी अर्थगत खुली बनावट को बनाए रखता है—क्षणभंगुरता, अस्थिरता और हाथ न आने का भाव—बिना उसे एक ही अमूर्त निष्कर्ष में बदल दिए।
- issue: दूसरे खंड की कठिन वाक्यरचना
  choice: पहले खंड से ‘तृप्त नहीं होगा’ को समानांतर रूप से पूरा करना
  alternative: खंड को प्रश्न की तरह पढ़ना; ‘बहुतायत’ और ‘आय’ को क्रमशः ‘धन’ और ‘लाभ/बढ़ोतरी’ समझना
  rationale: मसोरेटिक पाठ का दूसरा खंड संक्षिप्त और वाक्यरचनात्मक रूप से कठिन है। पहले खंड की क्रिया को अध्याहृत मानना समानांतरता और अर्थ को स्वाभाविक बनाता है, पर अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चाँदी’ तथा ‘वाष्प’ जैसे मूर्त बिंब मूल पाठ की काव्यात्मकता बनाए रखते हैं; कठिन दूसरे खंड को पठनीय बनाने के लिए समानांतर क्रिया स्पष्ट रूप से दोहराई गई है।
