base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/007.yaml
  text: If you see the oppression of the poor and the robbery of justice and righteousness in the province, do not be astonished at the matter; for a high official is watched by one higher, and there are even higher ones over them.
translation:
  language: hi
  text: यदि तुम किसी प्रान्त में गरीबों पर अत्याचार[a] और न्याय तथा नीति की लूट[b] होते देखो, तो इस बात पर अचंभित मत होना; क्योंकि एक उच्च अधिकारी पर उससे ऊँचा अधिकारी नज़र रखता है, और उनके ऊपर ऊँचे अधिकारी हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गरीबों का शोषण।’ इब्रानी शब्द सामान्य अत्याचार के साथ-साथ जबरन छीनने या शोषण करने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय और नीति का हरण।’
    reason: lexical_alternative
  - marker: c
    text: इब्रानी का शाब्दिक अर्थ है, ‘क्योंकि एक ऊँचा व्यक्ति एक ऊँचे व्यक्ति के ऊपर निगरानी रखता है, और उनके ऊपर ऊँचे लोग हैं।’ यह मानवीय अधिकारियों के कई स्तरों की ओर संकेत कर सकता है और अन्तिम ईश्वरीय निगरानी का भाव भी दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֹשֶׁק
  choice: अत्याचार
  rationale: यह संज्ञा दमनकारी शोषण अथवा जबरन छीनने का भाव रखती है; ‘अत्याचार’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है।
- source_word: רָשׁ
  choice: गरीबों
  rationale: यह निर्धन व्यक्ति या निर्धन वर्ग को सूचित करता है; बहुवचन ‘गरीबों’ हिन्दी में सामान्य वर्ग-सन्दर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵזֶל
  choice: लूट
  rationale: इस शब्द में बलपूर्वक छीनने या लूटने का भाव है; न्याय और धार्मिकता के हरण को ‘लूट’ सजीव ढंग से व्यक्त करती है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: प्रशासनिक अन्याय के प्रसंग में यह उचित कानूनी न्याय को दर्शाता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: מִשְׁפָּט के साथ यह नैतिक सहीपन का आयाम जोड़ता है; ‘धार्मिकता’ उस नैतिक अर्थ को बनाए रखती है।
- source_word: מְדִינָה
  choice: प्रान्त
  rationale: यह किसी प्रशासनिक क्षेत्र या प्रान्त को दर्शाता है; पदानुक्रम वाले इस प्रसंग में ‘प्रान्त’ उपयुक्त है।
- source_word: תִּתְמַהּ
  choice: अचम्भा न करना
  rationale: क्रिया विस्मित या चकित होने का अर्थ देती है; यह रूप स्पष्ट, सहज और गरिमापूर्ण है।
- source_word: הַחֵפֶץ
  choice: इस बात
  rationale: यहाँ संज्ञा पहले वर्णित परिस्थिति या मामले की ओर संकेत करती है; ‘इस बात’ स्वाभाविक हिन्दी है।
- source_word: גָבֹהַּ מֵעַל גָּבֹהַּ
  choice: एक ऊँचे अधिकारी पर उससे ऊँचा अधिकारी
  rationale: दोनों विशेषण संज्ञा के रूप में ऊँचे पद वालों के लिए प्रयुक्त हैं; ‘अधिकारी’ प्रशासनिक पदानुक्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: שֹׁמֵר
  choice: नज़र रखता है
  rationale: कृदन्त का अर्थ देखना, निगरानी करना या ध्यान रखना है; सक्रिय रूप मूल इब्रानी संरचना के निकट और हिन्दी में सहज है।
- source_word: וּגְבֹהִים עֲלֵיהֶם
  choice: उन दोनों के ऊपर और भी ऊँचे अधिकारी हैं
  rationale: बहुवचन आगे के ऊँचे स्तरों को दर्शाता है; ‘उन दोनों’ बहुवचन सर्वनाम का सम्भावित संदर्भ स्पष्ट करता है, जबकि अंतिम अधिकारियों की पहचान खुली रखी गई है।
theological_decisions:
- issue: क्या अंतिम ‘ऊँचे’ को मुख्य पाठ में स्पष्ट रूप से परमेश्वर कहा जाए
  choice: मुख्य पाठ में अधिकारियों के पदानुक्रम की भाषा रखी गई और परमेश्वर का नाम नहीं जोड़ा गया।
  alternative: अंतिम उच्च सत्ता को परमेश्वर अथवा परमेश्वर की सर्वोच्च निगरानी के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ लगातार ‘ऊँचे’ व्यक्तियों की बात करता है, पर इस पद में परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। अतः मानवीय प्रशासन और अंतिम ईश्वरीय निगरानी—दोनों की सम्भावना को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘अधिकारी’ प्रसंग के प्रशासनिक पदानुक्रम को स्पष्ट करता है, जबकि पादटिप्पणी मूल की अधिक शाब्दिक और धर्मवैचारिक रूप से खुली भाषा सुरक्षित रखती है।
