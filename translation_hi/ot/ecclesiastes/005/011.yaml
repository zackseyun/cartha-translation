    reason: lexical_alternative
lexical_decisions:
- source_word: מְתוּקָה
  choice: मीठी
  rationale: इब्रानी के ठोस रूपक ‘मीठी’ को बनाए रखता है और सुखद, चैनभरी नींद का स्वाभाविक हिन्दी बोध देता है।
- source_word: שְׁנַת הָעֹבֵד
  choice: काम करनेवाले की नींद
  rationale: सम्बन्धवाचक रचना और कृदन्त ‘काम करनेवाला’—दोनों को सरल, आधुनिक हिन्दी में व्यक्त करता है; ‘मज़दूर’ की अपेक्षा इसका अर्थ अनावश्यक रूप से संकरा नहीं होता।
- source_word: אִם מְעַט וְאִם הַרְבֵּה יֹאכֵל
  choice: चाहे वह थोड़ा खाए या बहुत
  rationale: इब्रानी की विकल्पसूचक रचना को स्वाभाविक हिन्दी में रखते हुए यह स्पष्ट करता है कि भोजन की मात्रा चाहे जो हो, उसकी नींद मीठी है।
- source_word: וְהַשָּׂבָע
  choice: पर ... भरपूरी
  rationale: यह शब्द भराव, तृप्ति या प्रचुरता का बोध दे सकता है। ‘भरपूरी’ धनवान की बहुतायत और उसके अति-भरे होने—दोनों संभावित भावों को अपेक्षाकृत खुला रखती है।
- source_word: לֶעָשִׁיר
  choice: धनवान की
  rationale: लामेद को यहाँ स्वामित्व-संबंध के रूप में समझकर धनवान से जुड़ी भरपूरी व्यक्त की गई है और इब्रानी के एकवचन को बनाए रखा गया है।
- source_word: אֵינֶנּוּ מַנִּיחַ לוֹ לִישׁוֹן
  choice: उसे सोने नहीं देती
  rationale: कारणवाचक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है; स्त्रीलिंग क्रिया ‘भरपूरी’ से मेल खाती है।
