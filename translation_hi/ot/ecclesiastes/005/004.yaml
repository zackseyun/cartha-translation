lexical_decisions:
- source_word: טוֹב אֲשֶׁר לֹא תִדֹּר
  choice: अच्छा है कि तुम मन्नत ही न मानो
  rationale: טוֹב यहाँ तुलनात्मक मूल्यांकन व्यक्त करता है। हिंदी में ‘...से अच्छा है कि...’ स्वाभाविक तुलना है; ‘ही’ मन्नत न मानने और मानकर पूरी न करने के विरोध को स्पष्ट करता है।
- source_word: מִשֶּׁתִּדּוֹר
  choice: मन्नत मानकर
  rationale: מִן + אֲשֶׁר तुलना का दूसरा पक्ष प्रस्तुत करता है। हिंदी वाक्य-विन्यास में कृदंत रूप ‘मानकर’ दोनों संबंधित क्रियाओं को सहजता से जोड़ता है।
- source_word: וְלֹא תְשַׁלֵּם
  choice: उसे पूरा न करने
  rationale: שלם का पिएल रूप मन्नत के संदर्भ में उसे चुकाने अथवा पूरा करने का अर्थ देता है। ‘पूरा करना’ आधुनिक हिंदी में मन्नत के लिए स्पष्ट और स्वाभाविक मुहावरा है; ‘उसे’ का संदर्भ मन्नत से है।
