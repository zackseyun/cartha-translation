source:
  edition: WLC
  text: וְ/גַם זֹה֙ רָעָ֣ה חוֹלָ֔ה כָּ/ל עֻמַּ֥ת שֶׁ/בָּ֖א כֵּ֣ן יֵלֵ֑ךְ וּ/מַה יִּתְר֣וֹן ל֔/וֹ שֶֽׁ/יַּעֲמֹ֖ל לָ/רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/015.yaml
  text: 'This too is a grievous evil: exactly as he came[a], so he will go. And what profit is there for him who toils for the wind?'
translation:
  language: hi
  text: 'यह भी एक घोर बुराई है: वह जैसा आया था, ठीक वैसा ही चला जाएगा। और हवा[a] के लिए परिश्रम करने से उसे क्या लाभ है?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साँस के लिए’ अथवा ‘आत्मा के लिए’; इब्रानी רוּחַ का अर्थ ‘हवा’, ‘साँस’ या ‘आत्मा’ हो सकता है। यहाँ निष्फल परिश्रम के संदर्भ में ‘हवा’ सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה חוֹלָה
  choice: घोर बुराई
  rationale: यह पदबंध शाब्दिक बीमारी के बजाय अत्यंत गंभीर और पीड़ादायक बुराई का मुहावरेदार भाव देता है। ‘घोर बुराई’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: כָּל עֻמַּת שֶׁבָּא
  choice: वह जैसा आया था, ठीक वैसा ही
  rationale: עֻמַּת सटीक अनुरूपता या समानता व्यक्त करता है; ‘ठीक वैसा ही’ इस तुलनात्मक बल को स्पष्ट रखता है।
- source_word: יֵלֵךְ
  choice: चला जाएगा
  rationale: यहाँ अपूर्ण क्रिया मनुष्य की मृत्यु के समय होने वाली निश्चित विदाई को सामान्य सत्य के रूप में व्यक्त करती है।
- source_word: יִתְרוֹן
  choice: लाभ
  rationale: सभोपदेशक में यह आवर्ती शब्द श्रम से बचने वाले अधिशेष, फायदे या उपलब्धि का बोध देता है; ‘लाभ’ सरल और संदर्भानुकूल है।
- source_word: שֶׁיַּעֲמֹל
  choice: परिश्रम करने
  rationale: עמל कठिन, थकाने वाले श्रम का भाव रखता है; ‘परिश्रम’ इस गंभीर ज्ञान-साहित्यिक शैली के अनुकूल है।
- source_word: לָרוּחַ
  choice: हवा के लिए
  rationale: רוּחַ का अर्थ हवा, साँस या आत्मा हो सकता है। यहाँ निरर्थक श्रम के संदर्भ में ‘हवा’ उस वस्तु के लिए प्रयास करने की ठोस छवि बनाए रखती है जिसे पकड़ा या संचित नहीं किया जा सकता।
theological_decisions:
- issue: ज्ञान-साहित्य और व्यर्थता के संदर्भ में רוּחַ का अर्थ
  choice: हवा
  alternative: साँस या आत्मा
  rationale: यह पद मृत्यु के समय धन-संपत्ति से कोई स्थायी लाभ न मिलने की बात करता है। ‘हवा’ निष्फल प्रयास की ठोस छवि को सुरक्षित रखता है और संदर्भ से असमर्थित आध्यात्मिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की तुलनात्मक समरूपता और सभोपदेशक की लाभ-हानि संबंधी शब्दावली सुरक्षित रखी गई है। पादटिप्पणी-चिह्न को רוּחַ के अनुवाद ‘हवा’ से संबंधित स्थान पर लगाया गया है।
