source:
  edition: WLC
  text: כִּ֚י לֹ֣א הַרְבֵּ֔ה יִזְכֹּ֖ר אֶת יְמֵ֣י חַיָּ֑י/ו כִּ֧י הָ/אֱלֹהִ֛ים מַעֲנֶ֖ה בְּ/שִׂמְחַ֥ת לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/019.yaml
  text: For he will not remember much the days of his life[b][a], because God keeps him occupied with the joy of his heart.
translation:
  language: hi
  text: क्योंकि वह अपने जीवन के दिनों को बहुत याद नहीं करेगा,[a] क्योंकि परमेश्वर उसे उसके हृदय के आनन्द में व्यस्त रखता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने जीवन के दिनों पर अधिक विचार नहीं करेगा।” यहाँ ‘याद करना’ लगातार मन लगाए रखने या विचार करते रहने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, “क्योंकि परमेश्वर उसके हृदय के आनन्द के द्वारा उसे उत्तर देता है।” इब्रानी क्रिया का अर्थ ‘उत्तर देना’ भी हो सकता है, पर इस संदर्भ में सम्भवतः आशय उसे आनन्द में व्यस्त या तल्लीन रखने से है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי (पहला)
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא הַרְבֵּה יִזְכֹּר
  choice: बहुत याद नहीं करेगा
  rationale: זכר का मूल अर्थ ‘याद करना’ है और הַרְבֵּה क्रिया की मात्रा को सीमित करता है। यह अनुवाद व्याख्यात्मक ‘अधिक सोचता नहीं रहेगा’ की अपेक्षा मूल के अधिक निकट है।
- source_word: אֶת יְמֵי חַיָּיו
  choice: अपने जीवन के दिनों को
  rationale: यह इब्रानी अभिव्यक्ति और सभोपदेशक की शैली को बनाए रखता है, फिर भी आधुनिक हिन्दी में समझने योग्य है।
- source_word: כִּי (दूसरा)
  choice: क्योंकि
  rationale: यह पहले उपवाक्य के पीछे परमेश्वर की क्रिया को कारण के रूप में प्रस्तुत करता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इस संदर्भ में संज्ञा सीधे परमेश्वर को सूचित करती है; ‘परमेश्वर’ हिन्दी बाइबिलीय गद्य में स्वाभाविक और गरिमापूर्ण है।
- source_word: מַעֲנֶה
  choice: उसे लगाए रखता है
  rationale: हिफ़ील रूप का संदर्भगत अर्थ किसी को व्यस्त या तल्लीन रखना हो सकता है। ‘लगाए रखता है’ आनन्द में ध्यान लगे रहने की सकारात्मक धारणा को सरल हिन्दी में व्यक्त करता है।
- source_word: בְּשִׂמְחַת לִבּוֹ
  choice: उसके मन के आनन्द में
  rationale: בְ साधन या क्षेत्र सूचित कर सकता है। यह चयन मूल की ‘हृदय/मन के आनन्द’ वाली छवि को बनाए रखता है और ‘लगाए रखता है’ के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: מַעֲנֶה में परमेश्वर की क्रिया का अर्थ
  choice: परमेश्वर व्यक्ति को उसके मन के आनन्द में लगाए रखता है
  alternative: परमेश्वर उसके मन के आनन्द के द्वारा उसे उत्तर देता है
  rationale: 5:18–20 में भोजन, पेय और श्रम का आनन्द परमेश्वर का उपहार है; इसलिए व्यक्ति को आनन्द में लगाए रखने का सकारात्मक अर्थ संदर्भ के अनुकूल है। फिर भी ‘उत्तर देता है’ अधिक शाब्दिक रूप से संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबिलीय गद्य। मूल के दो कारणसूचक उपवाक्यों और ‘जीवन के दिनों’ की अभिव्यक्ति को बनाए रखा गया है। ‘मन’ सामान्य पाठक के लिए स्वाभाविक है और לֵב के आन्तरिक भाव-बोध को व्यक्त करता है।
