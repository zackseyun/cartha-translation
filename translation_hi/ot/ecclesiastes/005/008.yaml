  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुख्य पाठ प्रवाहपूर्ण है, जबकि मूल इब्रानी की असाधारण संक्षिप्तता और वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
