  text: The land’s profit is for everyone; even a king is served by the field.[a]
translation:
  language: hi
  text: भूमि का लाभ सबके लिए है; राजा भी खेत से पोषित होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का अर्थ निश्चित करना विशेष रूप से कठिन है। इसका एक और संभव अनुवाद है, “हर प्रकार से भूमि के लिए लाभ यह है कि राजा खेती किए गए खेतों से जुड़ा हुआ हो।” अंतिम वाक्यांश का अर्थ यह भी हो सकता है, “राजा भी खेत पर निर्भर है।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְרוֹן אֶרֶץ
  choice: भूमि का लाभ
  rationale: יִתְרוֹן सभोपदेशक में बार-बार आने वाला शब्द है, जिसका अर्थ लाभ, बढ़त या फायदा हो सकता है। ‘भूमि का लाभ’ इस शब्दावली को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: בַּכֹּל
  choice: सबके लिए है
  rationale: मुख्य पाठ में इसे भूमि से मिलने वाले लाभ के सब लोगों तक पहुँचने के अर्थ में लिया गया है। ‘हर प्रकार से’ वाला क्रियाविशेषणात्मक अर्थ संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֶלֶךְ לְשָׂדֶה נֶעֱבָד
  choice: राजा भी खेत के द्वारा ही पोषित होता है
  rationale: संक्षिप्त इब्रानी वाक्यांश में נֶעֱבָד को निष्क्रिय रूप में राजा से जोड़ते हुए खेत को उसके भरण-पोषण का साधन समझा गया है। हिंदी में ‘सेवा की जाती है’ कृत्रिम और भ्रामक लगता; ‘पोषित होता है’ कृषि-उपज पर राजा की निर्भरता को स्वाभाविक रूप से व्यक्त करता है। अन्य संभव व्याकरणिक विन्यास पादटिप्पणी में दिया गया है।
