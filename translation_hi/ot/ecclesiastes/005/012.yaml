  yaml_path: translation/ot/ecclesiastes/005/012.yaml
  text: 'There is a grievous evil that I have seen under the sun: wealth kept by its owner to his harm[a].'
translation:
  language: hi
  text: 'मैंने सूर्य के नीचे एक घोर बुराई देखी है: धन, जो उसके मालिक के लिए उसके नुकसान के लिए सँभालकर रखा गया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन, जो उसके मालिक द्वारा उसके नुकसान के लिए सँभालकर रखा गया है।” इब्रानी के पूर्वसर्गों को थोड़ा भिन्न ढंग से समझा जा सकता है, पर मूल अर्थ नहीं बदलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ רָעָה חוֹלָה
  choice: एक घोर बुराई
  rationale: अस्तित्वसूचक יֵשׁ के साथ רָעָה חוֹלָה एक गंभीर और पीड़ादायक बुराई का परिचय देता है। हिंदी में वाक्य को स्वाभाविक बनाने के लिए इसे רָאִיתִי के कर्म के रूप में रखा गया है; ‘घोर’ חוֹלָה की तीव्रता व्यक्त करता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखी है
  rationale: पूर्ण क्रिया वक्ता के प्रत्यक्ष अनुभव पर बल देती है; वर्तमान पूर्ण रूप हिंदी में इस देखे हुए अनुभव की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की आवर्ती अभिव्यक्ति को शाब्दिक, स्पष्ट और एकरूप रूप में सुरक्षित रखा गया है।
- source_word: עֹשֶׁר
  choice: धन
  rationale: यह आधुनिक हिंदी में संपत्ति या वैभव के लिए सहज और व्यापक शब्द है।
- source_word: שָׁמוּר
  choice: सँभालकर रखता है
  rationale: निष्क्रिय कृदंत धन को बचाकर या रोककर रखने का भाव देता है। स्वाभाविक हिंदी में संबंधवाचक उपवाक्य और कर्तृवाच्य प्रयोग किया गया है, बिना ‘जमा करने’ या ‘लोभ से रखने’ का अतिरिक्त आशय जोड़े।
- source_word: לִבְעָלָיו
  choice: उसका मालिक
  rationale: בעל यहाँ स्वामी या अधिकारी है। प्रत्यय धन की ओर संकेत करता है; इसलिए ‘उसका मालिक’ स्वामित्व को स्पष्ट रखता है।
- source_word: לְרָעָתוֹ
  choice: अपने ही नुकसान के लिए
  rationale: לְ हानिकारक परिणाम या दिशा व्यक्त कर सकता है। ‘अपने ही’ विडंबना और मालिक पर लौटने वाली हानि को स्वाभाविक हिंदी में उभारता है।
