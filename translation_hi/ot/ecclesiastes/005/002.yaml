  yaml_path: translation/ot/ecclesiastes/005/002.yaml
  text: For a dream comes with much preoccupation[a], and a fool’s voice with many words.
translation:
  language: hi
  text: क्योंकि अधिक व्यस्तता से स्वप्न आता है[a], और बहुत-सी बातों से मूर्ख की आवाज़ आती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि बहुत काम-काज के साथ स्वप्न आता है, और बहुत-सी बातों के साथ मूर्ख की आवाज़ आती है।”
    reason: עִנְיָן का अर्थ ‘व्यस्तता’, ‘काम-काज’ या मन को घेरे रखने वाला विषय हो सकता है; दोनों खंडों में בְּ कारणात्मक (‘से’) अथवा सहचारी (‘के साथ’) संबंध व्यक्त कर सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या आधार बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּא
  choice: आता है
  rationale: यहाँ पूर्ण क्रिया का प्रयोग सामान्य, नीतिपरक सत्य के लिए है; वर्तमान काल का ‘आता है’ हिन्दी में उपयुक्त है।
- source_word: הַחֲלוֹם
  choice: स्वप्न
  rationale: लेखयुक्त संज्ञा यहाँ सामान्य श्रेणी का बोध कराती है। ‘स्वप्न’ गरिमापूर्ण और सामान्य हिन्दी है तथा नीतिवचन-सदृश संक्षिप्तता बनाए रखता है।
- source_word: בְּרֹב עִנְיָן
  choice: बहुत अधिक व्यस्तता से
  rationale: עִנְיָן काम-काज, गतिविधि या मन को घेरे रखने वाली व्यस्तता का बोध करा सकता है। ‘से’ स्वप्न के उत्पन्न होने की कारणात्मक छाया को व्यक्त करता है, पर अर्थ को केवल ‘चिंता’ तक सीमित नहीं करता।
- source_word: וְקוֹל כְּסִיל
  choice: और ... मूर्ख की आवाज़ सुनाई देती है
  rationale: शाब्दिक रूप से ‘और मूर्ख की आवाज़’; दूसरे खंड में क्रिया निहित है। हिन्दी में ‘सुनाई देती है’ जोड़ने से समानांतर कथन स्पष्ट और स्वाभाविक बनता है।
- source_word: בְּרֹב דְּבָרִים
  choice: बहुत-सी बातों से
  rationale: यह पहले खंड के בְּרֹב के समानांतर है और अत्यधिक वाणी को मूर्ख की पहचान के रूप में रखता है।
