source:
  edition: WLC
  text: אַל תִּתֵּ֤ן אֶת פִּ֨י/ךָ֙ לַ/חֲטִ֣יא אֶת בְּשָׂרֶ֔/ךָ וְ/אַל תֹּאמַר֙ לִ/פְנֵ֣י הַ/מַּלְאָ֔ךְ כִּ֥י שְׁגָגָ֖ה הִ֑יא לָ֣/מָּה יִקְצֹ֤ף הָֽ/אֱלֹהִים֙ עַל קוֹלֶ֔/ךָ וְ/חִבֵּ֖ל אֶת מַעֲשֵׂ֥ה יָדֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/005.yaml
  text: Do not let your mouth cause your flesh to sin[a], and do not say before the messenger, “It was a mistake.” Why should God be angry at your voice and destroy the work of your hands?
translation:
  language: hi
  text: अपने मुँह को अपने शरीर को पाप में डालने का कारण न बनने दो, और दूत[a] के सामने यह न कहना, “यह भूल थी।” परमेश्वर तुम्हारी आवाज़ के कारण क्यों क्रोधित हो और तुम्हारे हाथों के काम को नष्ट कर दे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गदूत।” इब्रानी शब्द מַלְאָךְ किसी मानवीय दूत या स्वर्गीय दूत, दोनों के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּתֵּן אֶת־פִּיךָ
  choice: अपने मुँह को ... न करवाने दो
  rationale: इब्रानी मुहावरे का शाब्दिक रूप ‘अपना मुँह न दो’ हिन्दी में अस्वाभाविक है। ‘न करवाने दो’ निषेध और कारणवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַחֲטִיא אֶת־בְּשָׂרֶךָ
  choice: अपने शरीर से पाप न करवाने दो
  rationale: हिफ़ील रूप का कारणवाचक अर्थ और בָּשָׂר का देहगत भाव दोनों बनाए रखे गए हैं; ‘अपने आपको दोषी न ठहराओ’ जैसे अर्थ-विस्तार से बचा गया है।
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: यह शब्द मानवीय संदेशवाहक या स्वर्गीय दूत, दोनों के लिए प्रयुक्त हो सकता है। ‘दूत’ मुख्य पाठ में इस व्यापकता को यथासंभव बनाए रखता है, जबकि ‘स्वर्गदूत’ को पादटिप्पणी में रखा गया है।
- source_word: שְׁגָגָה
  choice: भूल से हो गया था
  rationale: यह अनजाने में हुई भूल या चूक को दर्शाता है। यह वाक्यांश उतावली में मानी गई मन्नत के बाद दिए जाने वाले बहाने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: קוֹלֶךָ
  choice: तुम्हारी आवाज़
  rationale: मूल का ठोस शब्द ‘आवाज़’ सुरक्षित रखा गया है; प्रसंग में इसका संकेत कही हुई मन्नत या बहाने की ओर है।
- source_word: וְחִבֵּל
  choice: नष्ट कर दे
  rationale: क्रिया बिगाड़ने, बरबाद करने या नष्ट करने का प्रबल अर्थ रखती है। ‘नष्ट कर दे’ दैवी न्याय की गंभीरता व्यक्त करता है।
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: तुम्हारे हाथों के काम
  rationale: यह इब्रानी अभिव्यक्ति व्यक्ति के परिश्रम और उसकी उपलब्धियों को दर्शाती है; हिन्दी में इसका निकट और बोधगम्य रूप बनाए रखा गया है।
theological_decisions:
- issue: मन्नत के प्रसंग में הַמַּלְאָךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: मंदिर और मन्नत के प्रसंग में किसी मानवीय दूत या अधिकारी का अर्थ संभव है, पर इब्रानी शब्द स्वर्गीय दूत को भी दर्शा सकता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक व्याख्यात्मक तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और ज्ञान-साहित्य के अनुकूल शैली रखी गई है। ‘शरीर,’ ‘आवाज़’ और ‘हाथों के काम’ जैसे मूल के ठोस रूपकों को अर्थ स्पष्ट रहते हुए सुरक्षित रखा गया है। पादटिप्पणी-चिह्न को ‘दूत’ के बाद रखा गया है, क्योंकि वैकल्पिक पाठ उसी शब्द से संबंधित है।
