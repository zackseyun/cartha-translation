source:
  edition: WLC
  text: הִנֵּ֞ה אֲשֶׁר רָאִ֣יתִי אָ֗נִי ט֣וֹב אֲשֶׁר יָפֶ֣ה לֶֽ/אֶכוֹל וְ֠/לִ/שְׁתּוֹת וְ/לִ/רְא֨וֹת טוֹבָ֜ה בְּ/כָל עֲמָל֣/וֹ שֶׁ/יַּעֲמֹ֣ל תַּֽחַת הַ/שֶּׁ֗מֶשׁ מִסְפַּ֧ר יְמֵי חי/ו אֲשֶׁר נָֽתַן ל֥/וֹ הָ/אֱלֹהִ֖ים כִּי ה֥וּא חֶלְקֽ/וֹ־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/017.yaml
  text: Behold[a], what I myself have seen to be good and fitting is to eat and to drink and to see good in all the labor at which he labors under the sun during the number of the days of his life that God has given him, for this is his portion.
translation:
  language: hi
  text: देखो, मैंने स्वयं जो अच्छा और उचित देखा है, वह यह है कि मनुष्य खाए-पिए और अपने उस सारे परिश्रम में, जो वह सूर्य के नीचे करता है, भलाई का अनुभव करे[a]—अपने जीवन के जितने दिन परमेश्वर ने उसे दिए हैं, उन दिनों में—क्योंकि यही उसका भाग है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भलाई देखे”; इसका अर्थ “भलाई का आनन्द ले” भी हो सकता है।
    reason: इब्रानी मुहावरे के शाब्दिक रूप और अर्थगत विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह पद पर बल देते हुए एक निष्कर्षात्मक अवलोकन प्रस्तुत करता है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक और गरिमापूर्ण संकेत है।
- source_word: רָאִיתִי אָ֗נִי
  choice: मैंने स्वयं ... पाया है
  rationale: अलग से आए सर्वनाम אֲנִי का बल ‘स्वयं’ से व्यक्त किया गया है; सन्दर्भ में ‘पाया है’ देखे-परखे निष्कर्ष को स्वाभाविक हिन्दी में बताता है।
- source_word: טוֹב אֲשֶׁר יָפֶה
  choice: अच्छा और उचित
  rationale: यह युग्म अच्छाई और उपयुक्तता दोनों व्यक्त करता है; ‘उचित’ यहाँ ‘सुन्दर’ की तुलना में प्रसंगानुकूल है।
- source_word: לֶאֱכוֹל וְלִשְׁתּוֹת
  choice: खाए-पिए
  rationale: दोनों समानान्तर क्रियाओं को संक्षिप्त, सहज हिन्दी में रखा गया है।
- source_word: וְלִרְאוֹת טוֹבָה
  choice: भलाई का अनुभव करे
  rationale: शाब्दिक अर्थ ‘भलाई देखे’ है, पर इस इब्रानी मुहावरे का आशय भलाई का अनुभव करना या उसका आनन्द लेना है; शाब्दिक रूप और दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּכָל עֲמָלוֹ שֶׁיַּעֲמֹל
  choice: अपने सारे परिश्रम में
  rationale: संज्ञा और उसी मूल की क्रिया की पुनरुक्ति हिन्दी में असहज होती; ‘अपने सारे परिश्रम में’ अधिकार, कार्य और उसके क्षेत्र को स्पष्ट रखता है।
- source_word: תַּחַת הַשֶּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक का प्रमुख आवर्ती पदबंध होने के कारण औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: מִסְפַּר יְמֵי חַיָּו
  choice: अपने जीवन के उन दिनों की गिनती भर में
  rationale: मूल में ‘उसके जीवन के दिनों की संख्या’ है; ‘गिनती भर’ सीमित अवधि का भाव रखता है, पर मूल में न आए ‘थोड़े’ को नहीं जोड़ता।
- source_word: אֲשֶׁר נָתַן לוֹ הָאֱלֹהִים
  choice: जो परमेश्वर ने उसे दिए हैं
  rationale: सम्बन्धवाचक उपवाक्य और परमेश्वर द्वारा दिए गए जीवन-दिनों का अर्थ सीधे रखा गया है।
- source_word: כִּי הוּא חֶלְקוֹ
  choice: क्योंकि यही उसका भाग है
  rationale: חֵלֶק व्यक्ति को जीवन में मिले हिस्से को दर्शाता है; ‘भाग’ इस आवर्ती विषय को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: वचन में निहित सामान्य पुरुषवाचक एकवचन
  choice: मनुष्य ... अपने ... उसे ... उसका
  alternative: वह ... अपने ... उसे ... उसका
  rationale: इब्रानी रूप पुरुषवाचक एकवचन हैं और ज्ञान-साहित्य में प्रतिनिधिक अर्थ रखते हैं। हिन्दी में ‘मनुष्य’ इस सामान्य मानवीय आशय को स्पष्ट करता है, जबकि आगे एकवचन सर्वनाम मूल की संरचना बनाए रखते हैं।
- issue: וְלִרְאוֹת טוֹבָה का मुहावरेदार अर्थ
  choice: भलाई का अनुभव करे
  alternative: भलाई देखे; भलाई का आनन्द ले
  rationale: शाब्दिक ‘भलाई देखना’ हिन्दी में अस्पष्ट या दृष्टि-मात्र का अर्थ दे सकता है। ‘अनुभव करे’ मुहावरे का व्यापक आशय देता है और ‘आनन्द’ तक अर्थ को सीमित नहीं करता; अन्य सम्भावनाएँ पादटिप्पणी में हैं।
- issue: מִסְפַּר יְמֵי חַיָּו में जीवन की अवधि
  choice: जीवन के उन दिनों की गिनती भर में
  alternative: जीवन के थोड़े दिनों में; जीवन भर
  rationale: मूल पाठ दिनों को स्पष्ट रूप से ‘थोड़े’ नहीं कहता और न ही केवल ‘जीवन भर’ कहता है। अनुवाद संख्या/गिनती की असामान्य अभिव्यक्ति और सीमितता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सूर्य के नीचे’ और ‘भाग’ जैसे सभोपदेशक के प्रमुख आवर्ती पदों को बनाए रखा गया है। मुख्य पाठ में एक ही पादटिप्पणी-चिह्न [a] प्रयुक्त है।
