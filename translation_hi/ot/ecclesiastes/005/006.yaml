source:
  edition: WLC
  text: כִּ֣י בְ/רֹ֤ב חֲלֹמוֹת֙ וַ/הֲבָלִ֔ים וּ/דְבָרִ֖ים הַרְבֵּ֑ה כִּ֥י אֶת הָ/אֱלֹהִ֖ים יְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/006.yaml
  text: For in many dreams and vanities there are also many words[b][a]; but fear God.
translation:
  language: hi
  text: क्योंकि बहुत-से सपनों और व्यर्थताओं के साथ बहुत-सी बातें होती हैं[b][a]; परन्तु परमेश्वर का भय मान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “क्योंकि बहुत-से सपनों में व्यर्थताएँ और बहुत-सी बातें होती हैं; परन्तु परमेश्वर का भय मान।” इब्रानी वाक्य अण्डाकार है, और दूसरा “क्योंकि” विरोध अथवा निष्कर्ष का भाव दे सकता है।'
    reason: alternative_reading
  - marker: b
    text: “व्यर्थताएँ” इब्रानी हेवेल के बहुवचन का अनुवाद है। सभोपदेशक में यह बार-बार आने वाला शब्द किसी क्षणभंगुर, सारहीन या खोखली वस्तु का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछली चेतावनी का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: בְרֹב חֲלֹמוֹת
  choice: बहुत-से सपनों में
  rationale: בְרֹב मात्रा अथवा बहुतायत बताता है। यह रूप इब्रानी की संक्षिप्त, अण्डाकार अभिव्यक्ति के निकट रहते हुए सहज हिन्दी देता है।
- source_word: הֲבָלִים
  choice: व्यर्थताओं
  rationale: הֶבֶל सभोपदेशक का आवर्ती प्रमुख शब्द है, जो क्षणभंगुर, सारहीन या खोखली वस्तु की ओर संकेत कर सकता है। बहुवचन ‘व्यर्थताओं’ यहाँ उसके रूप और साहित्यिक संबंध को बनाए रखता है।
- source_word: וּדְבָרִים הַרְבֵּה
  choice: बहुत-सी बातें भी होती हैं
  rationale: शाब्दिक अर्थ ‘और बहुत-से शब्द/वचन’ है। अण्डाकार वाक्य में निहित क्रिया को ‘होती हैं’ से पूरा किया गया और ו के संबंध को ‘भी’ से स्वाभाविक बनाया गया।
- source_word: כִּי
  choice: परन्तु
  rationale: दूसरे כִּי का संबंध कठिन है; प्रसंग में इसे विपरीतार्थक या निष्कर्षसूचक समझा जा सकता है। मुख्य पाठ में ‘परन्तु’ चेतावनी और आदेश के बीच विरोध को स्पष्ट करता है, जबकि अन्य संभावना पादटिप्पणी में दी गई है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर का
  rationale: यह יְרָא का कर्म है। हिन्दी मुहावरे ‘परमेश्वर का भय मान’ में संबंधकारक रूप स्वाभाविक है।
- source_word: יְרָא
  choice: भय मान
  rationale: यह ירא का एकवचन आदेश है। ‘भय मान’ ज्ञान-साहित्य में श्रद्धायुक्त भय, अधीनता और विस्मय का गहन धार्मिक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में ירא का अनुवाद
  choice: परमेश्वर का भय मान
  alternative: परमेश्वर का आदर कर / परमेश्वर के प्रति श्रद्धा रख
  rationale: ‘भय मान’ बाइबलीय ज्ञान-परम्परा की प्रमुख अभिव्यक्ति को सुरक्षित रखता है और इसे केवल सम्मान तक सीमित नहीं करता; प्रसंग में इसका आशय आतंक मात्र नहीं, बल्कि श्रद्धायुक्त अधीनता है।
- issue: दूसरे כִּי का संबंध
  choice: परन्तु
  alternative: निश्चय ही / इसलिए
  rationale: इब्रानी वाक्य अण्डाकार है और दूसरा כִּי विपरीतार्थक अथवा निष्कर्षसूचक हो सकता है। मुख्य पाठ में प्रसंगगत विरोध चुना गया है, पर अस्पष्टता को पादटिप्पणी में स्पष्टतः सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन आदेश ‘मान’ मूल इब्रानी के एकवचन रूप को रखता है। मुख्य पाठ इब्रानी की संक्षिप्तता बनाए रखता है, जबकि निहित क्रिया जोड़कर वाक्य को हिन्दी में बोधगम्य बनाया गया है।
