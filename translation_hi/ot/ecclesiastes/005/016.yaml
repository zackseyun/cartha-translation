base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/016.yaml
  text: Also[a], all his days he eats in darkness[b], with much vexation and sickness and anger.
translation:
  language: hi
  text: और वह अपने सारे दिन अँधेरे में[a], बहुत झुँझलाहट, बीमारी और क्रोध के साथ खाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अँधेरे में’ को शाब्दिक रूप में भी समझा जा सकता है और एक निराश, आनन्दहीन जीवन के बिंब के रूप में भी।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी वाक्यांश संकुचित है। ‘बहुत झुँझलाहट’ का अर्थ संताप, खीझ या कुंठा भी हो सकता है; संज्ञाओं का ‘खाता है’ से संबंध इब्रानी में संक्षेप में व्यक्त है।
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: גַּם
  choice: और
  rationale: यह पिछले वर्णन में इस दुःखद दशा का एक और पहलू जोड़ता है; हिंदी में ‘और’ इसके योगात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל יָמָיו
  choice: अपने सारे दिन
  rationale: यह इब्रानी मुहावरे के रूप और सभोपदेशक की शैली को बनाए रखता है; अर्थ है उसके जीवन के समस्त दिन।
- source_word: בַּחֹשֶׁךְ
  choice: अँधेरे में
  rationale: ठोस इब्रानी बिंब को सुरक्षित रखा गया है, ताकि इसे शाब्दिक दशा अथवा उदास और आनन्दहीन जीवन के रूपक—दोनों रूपों में समझा जा सके।
- source_word: יֹאכֵל
  choice: खाता है
  rationale: संदर्भ में अपूर्ण क्रिया नियमित अथवा चरित्रगत कार्य बताती है; हिंदी का सामान्य वर्तमान काल इसे सहजता से व्यक्त करता है।
- source_word: וְכָעַס הַרְבֵּה
  choice: बहुत खीझ
  rationale: ‘खीझ’ भीतर की झुँझलाहट, संताप और कुंठा के अर्थ-क्षेत्र को संक्षेप में व्यक्त करती है; वाक्यांश की इब्रानी रचना संकुचित और व्याकरण की दृष्टि से कठिन है।
- source_word: חָלְיוֹ
  choice: बीमारी
  rationale: यह रोग अथवा अस्वस्थता का ठोस अर्थ देता है; हिंदी में ‘बीमारी’ सामान्य और स्पष्ट है।
- source_word: וָקָצֶף
  choice: और क्रोध
  rationale: यहाँ शब्द मनुष्य की क्रुद्ध या कटु अवस्था को सूचित करता है; ‘क्रोध’ अनावश्यक रूप से इसे परमेश्वर के प्रकोप के रूप में निर्धारित नहीं करता।
theological_decisions:
- issue: अँधेरे का आशय
  choice: ‘अँधेरे में’ के बिंब को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: इसे केवल ‘उदासी में’ या ‘आनन्दहीन जीवन बिताते हुए’ कहना।
  rationale: मूल पाठ शाब्दिक और रूपकात्मक अर्थ के बीच खुलापन रखता है; अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज पर गरिमापूर्ण शैली रखी गई है। ‘अपने सारे दिन’ और ‘अँधेरे में’ जैसे मूल बिंब सुरक्षित हैं, जबकि अंतिम संकुचित पदबंध को स्वाभाविक हिंदी बनाने के लिए ‘में रहता है’ जोड़ा गया है।
