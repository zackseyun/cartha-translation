source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר יָצָא֙ מִ/בֶּ֣טֶן אִמּ֔/וֹ עָר֛וֹם יָשׁ֥וּב לָ/לֶ֖כֶת כְּ/שֶׁ/בָּ֑א וּ/מְא֨וּמָה֙ לֹא יִשָּׂ֣א בַ/עֲמָל֔/וֹ שֶׁ/יֹּלֵ֖ךְ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/014.yaml
  text: As he came from his mother’s womb[a], naked he will return, going as he came; and he will carry away nothing from his labor that he can take in his hand.
translation:
  language: hi
  text: जैसा वह अपनी माँ के गर्भ से निकला था, नंगा ही वह लौट जाएगा—जैसा आया था, वैसा ही चला जाएगा; और अपने परिश्रम में से वह कुछ भी ऐसा नहीं ले जाएगा जिसे वह हाथ में लेकर जा सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और अपने परिश्रम में से वह कुछ भी नहीं उठाएगा, जो उसके हाथ में जाए।”'
    reason: हिब्रू שֶׁיּוֹלֵךְ בְּיָדוֹ का शब्दशः रूप हिन्दी में अस्वाभाविक और कुछ हद तक अस्पष्ट है। मुख्य पाठ ‘हाथ में लेकर जा सके’ द्वारा मूल की ठोस ‘हाथ’ वाली छवि बनाए रखते हुए उसका प्रसंगानुकूल अर्थ देता है।
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा
  rationale: यह जन्म के समय आने और मृत्यु के समय जाने की दशा के बीच तुलना आरम्भ करता है; ‘जैसा’ तुलनात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: יָצָא מִבֶּטֶן אִמּוֹ
  choice: वह अपनी माँ के गर्भ से निकला था
  rationale: जन्म की ठोस छवि और मातृ-संबंध दोनों सुरक्षित रहते हैं; ‘निकला था’ हिन्दी में प्रसंगानुकूल और स्पष्ट है।
- source_word: עָרוֹם
  choice: नंगा ही
  rationale: शब्दशः नग्नता को व्यक्त करता है और ‘ही’ जन्म तथा मृत्यु की समान असहाय दशा पर बल देता है।
- source_word: יָשׁוּב לָלֶכֶת
  choice: वह लौट जाएगा … चला जाएगा
  rationale: יָשׁוּב के लौटने और לָלֶכֶת के जाने—दोनों गतिसूचक तत्वों को बनाए रखते हुए स्वाभाविक हिन्दी वाक्य बनाया गया है।
- source_word: כְּשֶׁבָּא
  choice: जैसा आया था, वैसा ही
  rationale: आगमन और प्रस्थान की समानता तथा मूल की संक्षिप्त समानांतर रचना को सुरक्षित रखता है।
- source_word: וּמְאוּמָה לֹא יִשָּׂא
  choice: कोई भी चीज़ वह अपने साथ नहीं ले जाएगा
  rationale: पूर्ण निषेध को ‘कोई भी … नहीं’ से व्यक्त किया गया है; मृत्यु के प्रसंग में יִשָּׂא का आशय साथ ले जाने का है।
- source_word: בַעֲמָלוֹ
  choice: अपने परिश्रम की
  rationale: עָמָל में श्रम और उसके कष्टपूर्ण स्वर दोनों निहित हो सकते हैं; ‘परिश्रम’ गरिमापूर्ण, सामान्य और सभोपदेशक की शब्दावली के अनुकूल है।
- source_word: שֶׁיֹּלֵךְ בְּיָדוֹ
  choice: जिसे वह हाथ में लेकर जा सके
  rationale: हाथ की ठोस छवि को बनाए रखते हुए हिब्रू के असामान्य मुहावरे का स्वाभाविक हिन्दी अर्थ दिया गया है।
theological_decisions:
- issue: ‘लौट जाएगा’ का गंतव्य
  choice: गंतव्य को अनकहा रखा गया है
  alternative: मिट्टी में लौट जाएगा / मृत्यु को चला जाएगा
  rationale: इस पद में लौटने का गंतव्य स्पष्ट रूप से नहीं बताया गया; उसे जोड़ना प्रसंग की सम्भावित व्याख्या को पाठ में मिला देता।
- issue: मनुष्य अपने परिश्रम से क्या साथ ले जा सकता है
  choice: भौतिक रूप से हाथ में लेकर जाने की मूल छवि सुरक्षित रखी गई है
  alternative: वह अपनी उपलब्धियों में से कुछ भी मृत्यु के पार नहीं ले जा सकता
  rationale: विस्तृत धर्मवैचारिक अर्थ को स्पष्ट करके मूल की ठोस और कुछ हद तक तनावपूर्ण अभिव्यक्ति को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कहावत-जैसी लय रखी गई है। ‘नंगा’ सामान्य पाठक के लिए ‘निर्वस्त्र’ से अधिक सीधा है, जबकि ‘परिश्रम’ पुस्तक की चिंतनशील शैली के अनुकूल है।
