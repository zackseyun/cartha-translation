base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/003.yaml
  text: When you make a vow to God[a], do not delay in paying it, for he takes no pleasure in fools[b]. Pay what you vow.
translation:
  language: hi
  text: जब तुम परमेश्वर के प्रति कोई मन्नत मानो, तो उसे पूरा करने में देर न करो[a], क्योंकि मूर्खों से वह प्रसन्न नहीं होता[b]। जो मन्नत तुम मानो, उसे पूरा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे अदा करने में।” इब्रानी क्रिया का अर्थ मन्नत को अदा करना, पूरा करना या निभाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि मूर्खों में कोई प्रसन्नता नहीं है”; इब्रानी में कर्ता स्पष्ट नहीं है। सन्दर्भ से आशय है कि परमेश्वर मूर्खों से प्रसन्न नहीं होता।
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जब
  rationale: यह मन्नत मानने के अवसर से जुड़ी कालवाचक परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक और सीधा है।
- source_word: תִּדֹּר נֶדֶר
  choice: कोई मन्नत मानो
  rationale: इब्रानी की सजातीय क्रिया-संज्ञा रचना का हिन्दी में स्वाभाविक धार्मिक समतुल्य ‘मन्नत मानना’ है।
- source_word: לֵאלֹהִים
  choice: परमेश्वर से
  rationale: सन्दर्भ इस्राएल के परमेश्वर की उपासना का है। हिन्दी में मन्नत के साथ ‘परमेश्वर से’ स्वाभाविक प्रयोग है और लक्ष्य-संबंध को व्यक्त करता है।
- source_word: אַל תְּאַחֵר
  choice: देर न करो
  rationale: यह निषेध मन्नत पूरी करने को टालने के विरुद्ध है; ‘देर न करो’ संक्षिप्त और स्पष्ट है।
- source_word: לְשַׁלְּמוֹ
  choice: उसे पूरा करने में
  rationale: שׁלם यहाँ मन्नत को चुकाने, पूरा करने या निभाने का अर्थ दे सकता है। हिन्दी में ‘मन्नत पूरी करना’ सर्वाधिक स्वाभाविक है; वैकल्पिक ठोस अर्थ पादटिप्पणी में रखा गया है।
- source_word: כִּי אֵין חֵפֶץ
  choice: क्योंकि ... वह प्रसन्न नहीं होता
  rationale: इब्रानी वाक्य में कर्ता व्यक्त नहीं है; निकट सन्दर्भ के आधार पर ‘वह’ परमेश्वर की ओर संकेत करता है, पर पादटिप्पणी मूल की निरपेक्ष रचना सुरक्षित रखती है।
- source_word: בַּכְּסִילִים
  choice: मूर्खों से
  rationale: ज्ञान-साहित्य में यह नैतिक और आत्मिक मूर्खता का वर्ग है, केवल बुद्धि की कमी नहीं; ‘मूर्ख’ इस अर्थ को संक्षेप में बनाए रखता है।
- source_word: אֵת אֲשֶׁר תִּדֹּר שַׁלֵּם
  choice: जो मन्नत तुम मानो, उसे पूरा करो
  rationale: यह शब्द-क्रम आगे रखे गए कर्म और अन्तिम आज्ञा के बल को बनाए रखते हुए हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘मूर्खों से कोई प्रसन्नता नहीं’ वाले उपवाक्य का निहित कर्ता
  choice: मुख्य पाठ में परमेश्वर की ओर संकेत करने वाला ‘वह’ रखा गया है।
  alternative: ‘क्योंकि मूर्खों में कोई प्रसन्नता नहीं होती।’
  rationale: तत्काल सन्दर्भ परमेश्वर से मानी गई मन्नत का है, इसलिए परमेश्वर निहित कर्ता होने की सबसे सम्भावित समझ है। फिर भी इब्रानी व्याकरण कर्ता को स्पष्ट नहीं करता, इसलिए शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: כְּסִילִים का नैतिक अर्थ
  choice: मूर्खों
  alternative: नासमझ लोगों
  rationale: ‘मूर्ख’ सभोपदेशक के ज्ञान-साहित्य संबंधी नैतिक वर्ग को सुरक्षित रखता है; ‘नासमझ’ इसे केवल बौद्धिक कमी तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। ‘मन्नत मानना’ और ‘मन्नत पूरी करना’ सामान्य पाठकों के लिए स्वाभाविक धार्मिक अभिव्यक्तियाँ हैं; मूल की कर्ता-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
