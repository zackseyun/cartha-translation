base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/005/018.yaml
  text: Also[a], every man to whom God has given wealth and possessions, and has empowered him to eat from them, and to take his portion[c][b], and to rejoice in his labor—this is the gift of God.
translation:
  language: hi
  text: इसके अलावा, हर वह मनुष्य[a] जिसे परमेश्वर ने धन-संपत्ति दी है और उसमें से खाने, अपना भाग ग्रहण करने[c], और अपने परिश्रम में आनन्दित होने की सामर्थ्य दी है[b]—यह परमेश्वर का वरदान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘हर व्यक्ति’ या ‘हर कोई।’ इब्रानी में पुल्लिंग एकवचन ‘मनुष्य’ समस्त मनुष्यों के लिए सामान्य अर्थ में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अधिकार दिया है’ अथवा ‘योग्य बनाया है।’ इब्रानी क्रिया परमेश्वर द्वारा दी गई उस क्षमता पर बल देती है जिसके द्वारा मनुष्य अपनी संपत्ति का उपभोग कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपना हिस्सा स्वीकार करने।’ ‘भाग’ सभोपदेशक में जीवन में मनुष्य को मिलने वाले हिस्से के लिए बार-बार प्रयुक्त महत्त्वपूर्ण शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: इसके अलावा
  rationale: यह पिछले विचार से जोड़ने वाला योगसूचक शब्द है; आधुनिक हिन्दी में संबंध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כָּל הָאָדָם
  choice: हर वह मनुष्य
  rationale: इब्रानी का पुल्लिंग एकवचन यहाँ सामान्य और वितरणात्मक अर्थ रखता है; ‘मनुष्य’ उसके प्रतिनिधिक रूप को बनाए रखता है।
- source_word: עֹשֶׁר וּנְכָסִים
  choice: धन-संपत्ति
  rationale: दोनों निकटार्थी शब्दों को सुबोध हिन्दी युग्म में रखा गया है, जिसमें भौतिक समृद्धि और स्वामित्व की वस्तुएँ दोनों समाहित हैं।
- source_word: וְהִשְׁלִיטוֹ
  choice: सामर्थ्य दी है
  rationale: हिफ़ील रूप परमेश्वर द्वारा किसी को अधिकार या क्षमता देने का भाव व्यक्त करता है; प्रसंग में अपनी संपत्ति का उपभोग कर पाने की क्षमता प्रमुख है।
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: उसमें से खाने
  rationale: इब्रानी के ठोस ‘खाने’ वाले बिंब को बनाए रखा गया है; हिन्दी एकवचन सर्वनाम संयुक्त ‘धन-संपत्ति’ की ओर संकेत करता है।
- source_word: וְלָשֵׂאת אֶת חֶלְקוֹ
  choice: अपना भाग ग्रहण करने
  rationale: חלק सभोपदेशक में जीवन में मिला या निर्धारित हिस्सा है; ‘ग्रहण करना’ נשׂא की क्रिया को बिना अनावश्यक व्याख्या के स्वाभाविक हिन्दी में देता है।
- source_word: וְלִשְׂמֹחַ בַּעֲמָלוֹ
  choice: अपने परिश्रम में आनन्दित होने
  rationale: ‘परिश्रम’ עמל के श्रम और कठिन प्रयास के भार को रखता है, जबकि ‘आनन्दित होना’ שמח के स्पष्ट आनन्द-बोध को व्यक्त करता है।
- source_word: זֹה מַתַּת אֱלֹהִים הִיא
  choice: यह परमेश्वर का वरदान है
  rationale: संपूर्ण वर्णित क्षमता को परमेश्वर से मिला उपहार बताने वाला सीधा और गरिमापूर्ण कथन।
theological_decisions:
- issue: הָאָדָם का सामान्य पुल्लिंग प्रयोग
  choice: हर वह मनुष्य
  alternative: हर व्यक्ति / हर कोई
  rationale: मूल का पुल्लिंग एकवचन प्रतिनिधिक रूप में समस्त मनुष्यों पर लागू है; मुख्य पाठ में इसे ‘मनुष्य’ से रखा गया और पादटिप्पणी में समावेशी अर्थ स्पष्ट किया गया।
- issue: וְהִשְׁלִיטוֹ में परमेश्वर द्वारा प्रदान की गई क्षमता
  choice: सामर्थ्य दी है
  alternative: अधिकार दिया है / योग्य बनाया है
  rationale: वचन केवल अनुमति नहीं, बल्कि मिली हुई वस्तुओं का उपभोग कर सकने की परमेश्वर-प्रदत्त क्षमता पर बल देता है; ‘सामर्थ्य’ इस तनाव को अति-व्याख्या के बिना रखता है।
- issue: חֶלְקוֹ में जीवन का निर्धारित हिस्सा
  choice: अपना भाग
  alternative: अपना हिस्सा / अपना नियत भाग
  rationale: ‘भाग’ सभोपदेशक के आवर्ती विचार को संक्षेप में रखता है, पर ‘नियत’ जोड़कर पूर्वनिर्धारण का अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सुबोध, गरिमापूर्ण और ज्ञान-साहित्य के अनुरूप है। ‘धन-संपत्ति’ तथा ‘परिश्रम’ सामान्य पाठक के लिए सहज हैं, जबकि मूल के ठोस ‘खाने’ और आवर्ती ‘भाग’ को सुरक्षित रखा गया है।
