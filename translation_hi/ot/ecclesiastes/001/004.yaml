source:
  edition: WLC
  text: דּ֤וֹר הֹלֵךְ֙ וְ/ד֣וֹר בָּ֔א וְ/הָ/אָ֖רֶץ לְ/עוֹלָ֥ם עֹמָֽדֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/004.yaml
  text: A generation goes[a], and a generation comes[b], but the earth stands forever.
translation:
  language: hi
  text: एक पीढ़ी जाती है, और दूसरी पीढ़ी आती है, पर पृथ्वी सदा बनी रहती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सदा खड़ी रहती है।” यहाँ “सदा” पीढ़ियों के आते-जाते रहने की तुलना में पृथ्वी की दीर्घस्थायी स्थिरता पर बल देता है।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: यह शब्द एक ही समय में जीवित लोगों की पीढ़ी को दर्शाता है; इसकी पुनरावृत्ति इब्रानी समानांतरता को बनाए रखती है।
- source_word: הֹלֵךְ
  choice: जाती है
  rationale: वर्तमान कृदंत यहाँ निरंतर घटने वाले सामान्य सत्य को व्यक्त करता है। सरल क्रिया ‘जाती है’ मूल बिंब को बिना अतिरिक्त व्याख्या के रखती है।
- source_word: בָּא
  choice: आती है
  rationale: यह ‘जाती है’ के संतुलित प्रतिपक्ष के रूप में मूल की संक्षिप्त लय बनाए रखता है। हिंदी में ‘दूसरी’ जोड़ने से पीढ़ियों का क्रम स्वाभाविक और स्पष्ट होता है, बिना अर्थ बदले।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: इस सार्वभौमिक चिंतन में आशय किसी विशेष देश या भूभाग से नहीं, बल्कि पृथ्वी से है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह पीढ़ियों के आते-जाते रहने के विपरीत दीर्घस्थायित्व को व्यक्त करने वाला स्वाभाविक हिंदी पर्याय है।
- source_word: עֹמָדֶת
  choice: बनी रहती है
  rationale: इब्रानी क्रिया का शाब्दिक बिंब ‘खड़ी रहती है’ है, पर पृथ्वी के लिए ‘बनी रहती है’ आधुनिक हिंदी में अधिक स्वाभाविक ढंग से स्थिरता और निरंतरता व्यक्त करता है।
theological_decisions:
- issue: לְעוֹלָם को निरपेक्ष तत्त्वमीमांसक अनंतता मानना या दीर्घस्थायित्व की अलंकारिक अभिव्यक्ति
  choice: मुख्य पाठ में ‘सदा’ रखा गया है, ताकि इब्रानी मुहावरे का स्वाभाविक बल और क्षणभंगुर पीढ़ियों के साथ उसका विरोध बना रहे।
  alternative: युगों-युगों तक; बहुत लंबे समय तक
  rationale: यह सभोपदेशक का प्रेक्षणात्मक ज्ञान-वचन है, व्यवस्थित ब्रह्मांड-विज्ञान का कथन नहीं। इसलिए पाठ की धार्मिक और साहित्यिक तनातनी को बिना सीमित या निरपेक्ष किए सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘एक… दूसरी…’ हिंदी में पीढ़ियों के क्रम को स्वाभाविक बनाता है; ‘पर’ मूल के विरोध को संक्षेप में व्यक्त करता है।
