  text: דִּבַּ֨רְתִּי אֲנִ֤י עִם לִבִּ/י֙ לֵ/אמֹ֔ר אֲנִ֗י הִנֵּ֨ה הִגְדַּ֤לְתִּי וְ/הוֹסַ֨פְתִּי֙ חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁר הָיָ֥ה לְ/פָנַ֖/י עַל יְרוּשָׁלִָ֑ם וְ/לִבִּ֛/י רָאָ֥ה הַרְבֵּ֖ה חָכְמָ֥ה וָ/דָֽעַת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/016.yaml
  text: I said in my heart, saying, “I—look—I have become great and increased in wisdom beyond all who were before me over Jerusalem, and my heart has seen much wisdom and knowledge.”
translation:
  language: hi
  text: मैंने अपने मन में यह कहते हुए कहा, “मैं—देखो—यरूशलेम पर मुझसे पहले रहे सभी लोगों से बढ़कर महान हुआ हूँ और मैंने बुद्धि बढ़ाई है; मेरे मन ने बहुत बुद्धि और ज्ञान देखा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבַּרְתִּי אֲנִי עִם לִבִּי
  choice: मैंने अपने मन में कहा
  rationale: हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप; आत्म-संवाद का भाव सुरक्षित रहता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: वक्ता के आत्म-वक्तव्य में बल और ध्यानाकर्षण को स्पष्ट रखता है।
- source_word: הִגְדַּלְתִּי וְהוֹסַפְתִּי חָכְמָה
  choice: महानता और बुद्धि प्राप्त की है
  rationale: 'दो क्रियाओं के बल को पठनीय हिन्दी में व्यक्त करता है: वक्ता अपनी महान उपलब्धि और बढ़ी हुई बुद्धि, दोनों का दावा करता है।'
- source_word: עַל כָּל אֲשֶׁר הָיָה לְפָנַי עַל יְרוּשָׁלָם
  choice: अपने से पहले यरूशलेम पर शासन करनेवाले सभी लोगों से बढ़कर
  rationale: यहाँ עַל יְרוּשָׁלָם पद राजकीय अधिकार का संकेत देता है; तुलना पूर्ववर्ती शासकों से है।
- source_word: וְלִבִּי רָאָה
  choice: मेरे मन ने ... अनुभव किया है
  rationale: शाब्दिक ‘देखा’ हिन्दी में अस्वाभाविक हो सकता है; ज्ञान के व्यापक प्रत्यक्ष अनुभव का भाव व्यक्त किया गया है।
- source_word: חָכְמָה וָדָעַת
  choice: बुद्धि और ज्ञान
  rationale: दोनों संबंधित किंतु अलग अवधारणाओं को अलग रखा गया है।
theological_decisions:
- issue: वक्ता की पहचान और पूर्ववर्ती शासकों का दायरा
  choice: राजकीय संदर्भ को व्यक्त किया, पर किसी ऐतिहासिक राजा का नाम नहीं जोड़ा
  alternative: ‘मुझसे पहले यरूशलेम में रहनेवाले सभी लोगों’ या स्पष्टतः ‘राजाओं’ कहना
  rationale: मूल पाठ ‘यरूशलेम पर’ कहता है, जो शासन का संकेत देता है, लेकिन पद में ‘राजा’ संज्ञा नहीं है; इसलिए पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: आत्म-प्रशंसा का स्वर
  choice: दावे को बिना नरम किए प्रत्यक्ष रखा
  alternative: इसे केवल निष्पक्ष उपलब्धि-विवरण के रूप में हल्का करना
  rationale: ‘देखो’ और प्रथम पुरुष की पुनरुक्ति वक्ता के जोरदार आत्म-मूल्यांकन को सामने रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज। ‘देखो’ मूल के बल को रखता है। वाक्य में अनावश्यक संस्कृतनिष्ठता से बचते हुए राजकीय संदर्भ स्पष्ट किया गया है।
