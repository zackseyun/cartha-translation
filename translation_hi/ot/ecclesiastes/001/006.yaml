source:
  edition: WLC
  text: הוֹלֵךְ֙ אֶל דָּר֔וֹם וְ/סוֹבֵ֖ב אֶל צָפ֑וֹן סוֹבֵ֤ב סֹבֵב֙ הוֹלֵ֣ךְ הָ/ר֔וּחַ וְ/עַל סְבִיבֹתָ֖י/ו שָׁ֥ב הָ/רֽוּחַ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/006.yaml
  text: Going toward the south and turning toward the north[a], turning and turning goes the wind[b]; and on its circuits the wind returns.
translation:
  language: hi
  text: हवा[a] दक्षिण की ओर जाती है और उत्तर की ओर घूमती है; घूमती ही घूमती चलती जाती है, और अपने चक्रों[b] में फिर लौट आती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी רוּחַ का अर्थ ‘आत्मा’ या ‘साँस’ भी हो सकता है; यहाँ प्राकृतिक चक्रों का संदर्भ ‘हवा’ अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘चक्रों’ के स्थान पर ‘फेरों’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: जाती / चलती जाती है
  rationale: הלך का मूल अर्थ ‘जाना/चलना’ है। दोनों प्रयोग हवा की निरंतर गति व्यक्त करते हैं; ‘बहना’ जोड़ने के बजाय मूल क्रिया की गति-संबंधी व्यापकता रखी गई है।
- source_word: דָּרוֹם / צָפוֹן
  choice: दक्षिण / उत्तर
  rationale: אֶל के साथ ये दिशासूचक संज्ञाएँ हैं; इसलिए ‘दक्षिण की ओर’ और ‘उत्तर की ओर’ सीधा और स्वाभाविक अनुवाद है।
- source_word: וְסוֹבֵב / סוֹבֵב סֹבֵב
  choice: घूमती हुई / घूमती ही घूमती
  rationale: סבב का अर्थ घूमना, मुड़ना या चक्कर लगाना हो सकता है। ‘घूमती ही घूमती’ इब्रानी पुनरुक्ति और निरंतर चक्रीय गति के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָרוּחַ
  choice: हवा
  rationale: רוּחַ के अर्थ हवा, आत्मा या साँस हो सकते हैं, पर सभोपदेशक 1:5–7 में प्राकृतिक चक्रों का संदर्भ ‘हवा’ को सबसे उपयुक्त बनाता है।
- source_word: סְבִיבֹתָיו
  choice: अपने चक्रों में
  rationale: बहुवचन रूप घूमने या परिक्रमा के मार्गों को दर्शाता है। ‘चक्रों’ से चक्रीय बिंब और סבב से शब्दार्थगत संबंध दोनों बने रहते हैं; हिन्दी में गति के प्रसंग में ‘में’ स्वाभाविक है।
- source_word: שָׁב
  choice: फिर लौट आती है
  rationale: שוב लौटने या वापस आने को व्यक्त करता है। ‘फिर’ चक्रीय पुनरावृत्ति स्पष्ट करता है, जबकि ‘लौट आती है’ सामान्य आधुनिक हिन्दी है।
theological_decisions:
- issue: इस पद में רוּחַ का अर्थ
  choice: मौसम-संबंधी ‘हवा’
  alternative: ‘आत्मा’ या ‘साँस’
  rationale: आसपास के पद सूर्य, हवा और नदियों जैसे दिखाई देने वाले प्राकृतिक चक्रों का वर्णन करते हैं। इसलिए यहाँ ‘हवा’ संदर्भानुकूल है, पर शब्द की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, साहित्यिक किंतु सहज हिन्दी में रखी गई है। ‘घूमती ही घूमती’ मूल की पुनरुक्ति और लय को स्वाभाविक ढंग से व्यक्त करता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
