source:
  edition: WLC
  text: רָאִ֨יתִי֙ אֶת כָּל הַֽ/מַּעֲשִׂ֔ים שֶֽׁ/נַּעֲשׂ֖וּ תַּ֣חַת הַ/שָּׁ֑מֶשׁ וְ/הִנֵּ֥ה הַ/כֹּ֛ל הֶ֖בֶל וּ/רְע֥וּת רֽוּחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/014.yaml
  text: I have seen all the works that are done under the sun[a], and behold[b], all is vanity and a striving after wind.
translation:
  language: hi
  text: मैंने सूर्य के नीचे किए जाने वाले सभी कामों को देखा है, और देखो, सब कुछ वाष्प[a] है और हवा के पीछे भागने जैसा[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साँस,” “क्षणभंगुरता,” अथवा “व्यर्थता।” सभोपदेशक में इब्रानी הֶבֶל उस वस्तु का संकेत करता है जो थोड़े समय की, सारहीन और निराश करनेवाली है; इसका अर्थ केवल “अर्थहीन” नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “हवा को पाने का प्रयत्न।” इब्रानी पद רְעוּת רוּחַ सम्भवतः निष्फल पीछा करने का भाव देता है; अधिक शाब्दिक सम्भावना है, “हवा को चराना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा है
  rationale: काल और प्रसंग वक्ता के उस चिंतनपूर्ण अवलोकन को व्यक्त करते हैं जिसका निष्कर्ष वर्तमान कथन में प्रासंगिक है; हिन्दी का पूर्ण वर्तमान यहाँ स्वाभाविक है।
- source_word: כָּל הַמַּעֲשִׂים שֶׁנַּעֲשׂוּ
  choice: किए जानेवाले सभी कामों
  rationale: מַעֲשִׂים मानवीय कामों और उपक्रमों की व्यापक श्रेणी को दर्शाता है; कर्मवाच्य संबंधवाचक पद सामान्य रूप से संसार में होनेवाले कामों को बताता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक में यह पृथ्वी पर मानवीय जीवन और गतिविधि के क्षेत्र का प्रमुख मुहावरा है; शाब्दिक हिन्दी स्पष्ट और स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה ध्यान खींचकर निष्कर्ष पर बल देता है। “देखो” आधुनिक हिन्दी में इस आलंकारिक बल को बनाए रखता है।
- source_word: הַכֹּל
  choice: सब कुछ
  rationale: यह पहले बताए गए सभी कामों की समग्रता की ओर लौटता है; “सब कुछ” हिन्दी में संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הֶבֶל
  choice: वाष्प
  rationale: मूल शब्द का ठोस बिंब क्षणभंगुरता, सारहीनता और निराशाजनक निष्फलता को एक साथ खुला रखता है; केवल “अर्थहीन” या “व्यर्थ” कहने से उसका अर्थ समय से पहले संकुचित हो जाता।
- source_word: רְעוּת רוּחַ
  choice: हवा के पीछे भागना
  rationale: यह कठिन मुहावरा सम्भवतः निष्फल पीछा या प्रयत्न दर्शाता है। यह हिन्दी रूप हवा के बिंब और प्रयास की निरर्थकता दोनों को सहज रूप में रखता है।
theological_decisions:
- issue: הֶבֶל को पूर्ण अर्थहीनता के दार्शनिक दावे के रूप में लेना
  choice: वाष्प के मूल बिंब को बनाए रखा गया
  alternative: सब कुछ अर्थहीन है
  rationale: इब्रानी शब्द क्षणभंगुरता, पकड़ में न आने और निष्फलता के बीच अर्थगत तनाव रखता है; पद को केवल सर्वथा अर्थहीनता का सिद्धान्त बनाना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “वाष्प” जानबूझकर कुछ चौंकानेवाला रूपक है, क्योंकि मूल इब्रानी भी ठोस और बहुअर्थी बिंब प्रस्तुत करता है। फुटनोट-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी व्याख्या वे करते हैं।
