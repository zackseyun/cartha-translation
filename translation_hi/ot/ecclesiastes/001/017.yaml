base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/017.yaml
  text: And I set my heart to know wisdom[a], and to know madness and folly; I came to know that this too is a chasing after wind.
translation:
  language: hi
  text: मैंने बुद्धि को, और पागलपन तथा मूर्खता को जानने में अपना मन लगाया। मैंने जाना कि यह भी हवा के पीछे भागना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हवा को पकड़ने की कोशिश”; परंपरागत अनुवाद, “मन की कुढ़न।”
    reason: इब्रानी पदबंध רַעְיוֹן רוּחַ का सटीक अर्थ अनिश्चित है; मुख्य पाठ उसके निष्फल प्रयास के रूपक को सामने रखता है, जबकि अन्य संभावित और परंपरागत अर्थ यहाँ सुरक्षित रखे गए हैं।
