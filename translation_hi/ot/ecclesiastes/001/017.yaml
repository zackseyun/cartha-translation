- source_word: רַעְיוֹן רוּחַ
  choice: हवा के पीछे भागना
  rationale: यह असंभव और निष्फल प्रयत्न का रूपक सहज आधुनिक हिंदी में व्यक्त करता है। पदबंध की शाब्दिक तथा परंपरागत व्याख्याएँ अनिश्चित हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
