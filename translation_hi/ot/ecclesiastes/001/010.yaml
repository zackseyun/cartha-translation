base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/010.yaml
  text: Is there a thing of which one says[a], “See, this is new”? It has already been in the ages before us.
translation:
  language: hi
  text: क्या कोई ऐसी चीज़ है जिसके बारे में कहा जाए, “देखो, यह नई है”? वह तो हमसे पहले के युगों में पहले ही मौजूद थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्वाभाविक रूप में, “वह तो पहले ही हमसे पहले के युगों में मौजूद थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: क्या कोई ... है
  rationale: संदर्भ में यह अस्तित्ववाचक अभिव्यक्ति आलंकारिक प्रश्न आरम्भ करती है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: דָּבָר
  choice: ऐसी चीज़
  rationale: यहाँ शब्द का व्यापक अर्थ किसी भी कथित नई वस्तु, बात या घटना को समेटता है; ‘चीज़’ सामान्य पाठक के लिए सहज रहते हुए अर्थ को खुला रखता है।
- source_word: שֶׁיֹּאמַר
  choice: जिसके बारे में कहा जाए
  rationale: अनिश्चित और सामान्य कर्ता का भाव कर्मवाच्य हिन्दी में स्वाभाविक ढंग से व्यक्त होता है, बिना किसी खास वक्ता को जोड़ने के।
- source_word: רְאֵה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली आज्ञा का सीधा, आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: חָדָשׁ הוּא
  choice: यह नई है
  rationale: मूल के संकेतवाचक सर्वनाम और विशेषण को उद्धृत दावे के रूप में बनाए रखता है। ‘चीज़’ के अनुसार स्त्रीलिंग सामंजस्य रखा गया है।
- source_word: כְּבָר הָיָה
  choice: पहले से ही ... मौजूद थी
  rationale: पूर्व अस्तित्व पर दिए गए बल को ‘पहले से ही’ व्यक्त करता है; ‘मौजूद थी’ हिन्दी में अस्तित्व का स्वाभाविक रूप है।
- source_word: לְעֹלָמִים
  choice: उन युगों में
  rationale: बहुवचन के दीर्घ काल-विस्तार को बनाए रखता है और इसे अनन्तता के अर्थ में गलत ढंग से निश्चित नहीं करता।
- source_word: אֲשֶׁר הָיָה מִלְּפָנֵינוּ
  choice: जो हमसे पहले थे
  rationale: वर्तमान पीढ़ी से पहले के युगों का सीधा बोध देता है और मूल के सापेक्ष उपवाक्य को सुरक्षित रखता है।
