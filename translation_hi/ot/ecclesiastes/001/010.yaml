translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आलंकारिक प्रश्न और कथित नवीनता के खंडन का तनाव सुरक्षित है। ‘युगों’ द्वारा मूल के बहुवचन काल-संकेत को बनाए रखा गया है; पादटिप्पणी अधिक मुहावरेदार विकल्प देती है।
