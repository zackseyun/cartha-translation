source:
  edition: WLC
  text: כִּ֛י בְּ/רֹ֥ב חָכְמָ֖ה רָב כָּ֑עַס וְ/יוֹסִ֥יף דַּ֖עַת יוֹסִ֥יף מַכְאֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/018.yaml
  text: For with much wisdom comes much vexation[b][a], and he who increases knowledge increases pain.
translation:
  language: hi
  text: क्योंकि बहुत बुद्धि के साथ बहुत क्लेश होता है[a], और जो ज्ञान बढ़ाता है, वह पीड़ा बढ़ाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत बुद्धि में बहुत दुःख है”; इब्रानी शब्द כָּעַס का अर्थ दुःख, क्लेश, खीझ या रोष हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और ज्ञान जोड़ने वाला पीड़ा जोड़ता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: בְּרֹב חָכְמָה
  choice: बहुत बुद्धि के साथ
  rationale: בְּ यहाँ परिस्थिति या सहवर्तिता व्यक्त कर सकता है। यह अनुवाद ‘बहुत बुद्धि’ और उसके साथ जुड़े परिणाम का संबंध बनाए रखता है, बिना कारणता को मूल से अधिक कठोर बनाए।
- source_word: רָב כָּעַס
  choice: बहुत क्लेश होता है
  rationale: כָּעַס दुःख, खीझ, झुँझलाहट या मनस्ताप का भाव दे सकता है। ‘क्लेश’ इस व्यापक भावात्मक पीड़ा को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְיוֹסִיף דַּעַת
  choice: और जो ज्ञान बढ़ाता है
  rationale: हिफ़िल रूप ज्ञान में वृद्धि करने का भाव देता है। सम्बन्धवाचक रचना हिन्दी में सूक्तिपरक कथन को स्वाभाविक बनाती है।
- source_word: יוֹסִיף מַכְאוֹב
  choice: वह पीड़ा बढ़ाता है
  rationale: दोनों खंडों में יסף की पुनरावृत्ति को ‘बढ़ाता है’ दोहराकर सुरक्षित रखा गया है। מַכְאוֹב शारीरिक या मानसिक पीड़ा दोनों को समेट सकता है।
theological_decisions: []
