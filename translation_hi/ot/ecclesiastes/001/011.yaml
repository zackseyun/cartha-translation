  text: אֵ֥ין זִכְר֖וֹן לָ/רִאשֹׁנִ֑ים וְ/גַ֨ם לָ/אַחֲרֹנִ֜ים שֶׁ/יִּהְי֗וּ לֹֽא יִהְיֶ֤ה לָ/הֶם֙ זִכָּר֔וֹן עִ֥ם שֶׁ/יִּהְי֖וּ לָ/אַחֲרֹנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/011.yaml
  text: There is no remembrance of the former ones[a], and even of the later ones who will be, there will be no remembrance among those who will come afterward.
translation:
  language: hi
  text: पहले के लोगों का कोई स्मरण नहीं रहता[a], और बाद में होनेवाले लोगों का भी उनके बाद आनेवालों के बीच कोई स्मरण नहीं रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले की बातों की कोई स्मृति नहीं रहती; और जो बाद में होंगे, उन्हें भी उनके बाद आनेवालों के बीच याद नहीं रखा जाएगा।”
    reason: हिब्रू के बहुवचन विशेषण ‘पहले के’ और ‘बाद के’ का संकेत लोगों या पहले की बातों/कालों की ओर समझा जा सकता है; साथ ही ‘स्मरण’ स्मृति होने या याद किए जाने, दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: אֵין
  choice: नहीं रहता
  rationale: अस्तित्वसूचक निषेध को स्वाभाविक हिन्दी में व्यक्त करता है और इस प्रसंग में स्मरण के टिके न रहने का भाव देता है।
- source_word: זִכְרוֹן / זִכָּרוֹן
  choice: स्मरण
  rationale: यह शब्द याद किए जाने अथवा स्मृति बने रहने, दोनों का भाव रखता है; ‘स्मरण’ पद्य की पुनरावृत्ति और अमूर्त अर्थ को बनाए रखता है।
- source_word: לָרִאשֹׁנִים
  choice: पहले के लोगों का
  rationale: बहुवचन विशेषण के व्यापक मानवीय संकेत को बनाए रखता है; इसे केवल किसी खास पीढ़ी या वस्तुओं तक सीमित नहीं करता।
- source_word: וְגַם
  choice: और ... भी
  rationale: समन्वय के साथ बलाघात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָאַחֲרֹנִים שֶׁיִּהְיוּ
  choice: बाद में होनेवाले लोगों का
  rationale: आगे अस्तित्व में आनेवाले लोगों का अर्थ देता है और पहले तथा बाद के लोगों के बीच कालगत समानांतरता बनाए रखता है।
- source_word: לֹא יִהְיֶה לָהֶם זִכָּרוֹן
  choice: कोई स्मरण नहीं रहेगा
  rationale: हिब्रू की अस्तित्वसूचक/अधिकारसूचक रचना को सुबोध हिन्दी में प्रस्तुत करता है।
- source_word: עִם
  choice: के बीच
  rationale: उन आगामी लोगों के समुदाय को दर्शाता है जिनमें स्मरण बना रहता या मिट जाता है।
- source_word: שֶׁיִּהְיוּ לָאַחֲרֹנָה
  choice: उनके बाद आनेवालों
  rationale: पहले बताए गए भावी लोगों से भी बाद की पीढ़ी का कालगत क्रम स्पष्ट करता है।
