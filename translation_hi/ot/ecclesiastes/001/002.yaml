source:
  edition: WLC
  text: הֲבֵ֤ל הֲבָלִים֙ אָמַ֣ר קֹהֶ֔לֶת הֲבֵ֥ל הֲבָלִ֖ים הַ/כֹּ֥ל הָֽבֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/002.yaml
  text: Breath of breaths[a], says Qoheleth[b]; breath of breaths, all is mere breath.
translation:
  language: hi
  text: 'कोहेलेत[b] कहता है: “साँसों की साँस[a], साँसों की साँस—सब कुछ मात्र साँस है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶבֶל
  choice: साँस
  rationale: इस इब्रानी शब्द का ठोस अर्थ ‘साँस’ या ‘वाष्प’ है। सभोपदेशक में यह क्षणभंगुरता, पकड़ में न आने और अपेक्षा तथा परिणाम के विडंबनापूर्ण अंतर—इन जुड़े हुए भावों को एक साथ जगाता है। ‘साँस’ मूल बिंब को सुरक्षित रखता है; ‘व्यर्थता’ या ‘अर्थहीनता’ इनमें से केवल एक भाव को प्रमुख बनाते हैं।
- source_word: הֲבֵל הֲבָלִים
  choice: साँसों की साँस
  rationale: ‘X का/की X’ वाला यह इब्रानी संबंध-वाचक विन्यास परमोत्कर्ष सूचित करता है, जैसे ‘गीतों का गीत’। ‘साँसों की साँस’ उसी रूप और ठोस बिंब दोनों को बनाए रखता है।
- source_word: אָמַר
  choice: कहता है
  rationale: यद्यपि इब्रानी क्रिया का रूप पूर्ण पक्ष का है, साहित्यिक कथन-सूत्र में वर्तमान काल हिंदी में उक्त घोषणा को जीवंत और स्वाभाविक रखता है।
- source_word: קֹהֶלֶת
  choice: कोहेलेत
  rationale: पदवी/नाम का लिप्यंतरण उसके अनिश्चित अर्थ-क्षेत्र को खुला रखता है; ‘उपदेशक’ या ‘शिक्षक’ उसके अर्थ को समय से पहले संकीर्ण कर देंगे।
- source_word: הַכֹּל
  choice: सब कुछ
  rationale: यह आधुनिक हिंदी में व्यापक और सर्वसमावेशी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָבֶל
  choice: मात्र साँस
  rationale: विधेय में ‘मात्र’ कथन के मूल्यांकनात्मक और निष्फल कर देने वाले बल को व्यक्त करता है, ताकि इसे वस्तु की बनावट के बारे में शाब्दिक दावा न समझा जाए; साथ ही ‘साँस’ का मूल बिंब बना रहता है।
theological_decisions:
- issue: पुस्तक के केंद्रीय रूपक הֶבֶל का अनुवाद
  choice: ठोस बिंब ‘साँस’ को बनाए रखना—परमोत्कर्ष में ‘साँसों की साँस’ और विधेय में ‘मात्र साँस’।
  alternative: व्यर्थता; अर्थहीनता; निस्सारता; क्षणभंगुरता; विडंबना
  rationale: मूल शब्द क्षणभंगुर, अगम्य और विडंबनापूर्ण होने के भावों को साथ रखता है। कोई एक अमूर्त हिंदी शब्द इस तनाव को सुरक्षित नहीं रखता; विशेषकर ‘अर्थहीनता’ पाठ में ऐसा सर्वनिषेध ला सकती है जिसे इब्रानी अनिवार्य नहीं करता।
- issue: קֹהֶלֶת को पदवी मानकर अर्थानुवाद करना या खुला रखना
  choice: ‘कोहेलेत’ के रूप में लिप्यंतरण।
  alternative: उपदेशक; शिक्षक; सभा बुलाने वाला
  rationale: शब्द की ठीक भूमिका और व्युत्पत्तिगत छाया विवादित है। लिप्यंतरण किसी एक व्याख्या को पाठ पर थोपे बिना इस खुलेपन को बचाता है।
translation_notes:
  register: भाषा आधुनिक, साहित्यिक और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘साँसों की साँस’ जानबूझकर असामान्य, काव्यात्मक परमोत्कर्ष है और मूल इब्रानी की पुनरावृत्ति को बचाता है। ‘मात्र साँस’ अंतिम खंड को शून्यवाद की स्पष्ट घोषणा बनाए बिना उसका तीखा, मूल्यांकनात्मक प्रभाव व्यक्त करता है।
