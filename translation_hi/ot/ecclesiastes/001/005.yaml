  text: And the sun rises[a], and the sun goes down, and hastening to its place, it rises there again.
translation:
  language: hi
  text: सूरज उगता है और सूरज डूबता है; अपने स्थान की ओर हाँफता हुआ, वहीं वह उगता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अपने स्थान की ओर वह तेज़ी से बढ़ता है; वहीं वह उगता है।” इब्रानी शब्द שׁוֹאֵף का अर्थ “हाँफता है” या, अधिक मुहावरेदार ढंग से, “तेज़ी से बढ़ता है” समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָרַח הַשֶּׁמֶשׁ
  choice: सूरज उगता है
  rationale: यद्यपि זָרַח पूर्ण रूप में है, उपदेशक के सामान्य, बार-बार घटने वाले अवलोकन में हिन्दी का सामान्य वर्तमान स्वाभाविक है।
- source_word: וּבָא הַשָּׁמֶשׁ
  choice: और सूरज डूबता है
  rationale: בוא का मूल अर्थ आना या भीतर जाना है, पर सूर्य के विषय में यह अस्त होने का मुहावरा है; ‘डूबता है’ गति-चित्र को बनाए रखते हुए सहज हिन्दी है।
- source_word: וְאֶל מְקוֹמוֹ
  choice: फिर अपने स्थान की ओर
  rationale: מָקוֹם का सीधा अर्थ ‘स्थान’ है और प्रत्यय सूर्य की ओर संकेत करता है। ‘फिर’ इब्रानी में स्पष्ट शब्द नहीं, पर चक्रीय गति और वाक्य-संबंध को हिन्दी में व्यक्त करता है।
- source_word: שׁוֹאֵף
  choice: हाँफता हुआ जाता है
  rationale: שׁאף का कृदन्त हाँफने, तीव्र आकांक्षा या शीघ्रता से बढ़ने का बिंब दे सकता है। ‘हाँफता हुआ’ सजीव मानवीकरण को बचाता है; ‘जाता है’ हिन्दी वाक्य को पूर्ण और स्वाभाविक बनाता है।
- source_word: זוֹרֵחַ הוּא שָׁם
  choice: वहीं वह फिर उगता है
  rationale: זוֹרֵחַ निरंतर/पुनरावर्ती उगने को व्यक्त करता है; הוּא विषय को फिर सामने लाता है और שָׁם ‘वहाँ’ है। ‘वहीं’ स्थान पर बल देता है, जबकि ‘फिर’ प्रसंग की पुनरावृत्ति स्पष्ट करता है।
