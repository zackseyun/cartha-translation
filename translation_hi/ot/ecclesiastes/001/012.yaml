  text: אֲנִ֣י קֹהֶ֗לֶת הָיִ֥יתִי מֶ֛לֶךְ עַל יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/012.yaml
  text: I[a], Qoheleth, was king over Israel in Jerusalem.
translation:
  language: hi
  text: मैं, कोहेलेत[a], यरूशलेम में इस्राएल का राजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कोहेलेत” का अनुवाद “शिक्षक” या “उपदेशक” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैं
  rationale: प्रथम पुरुष एकवचन सर्वनाम को स्पष्ट रूप से रखा गया है, क्योंकि वाक्य के आरम्भ में यह वक्ता के आत्म-परिचय पर बल देता है।
- source_word: קֹהֶלֶת
  choice: कोहेलेत
  rationale: इस विशिष्ट पदनाम का सटीक अर्थ विवादित है। लिप्यंतरण करने से ‘शिक्षक,’ ‘उपदेशक’ या सभा से जुड़े किसी अन्य अर्थ में से एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: הָיִיתִי
  choice: था
  rationale: यह היה का काल रूप प्रथम पुरुष एकवचन पूर्ण क्रिया है और यहाँ पिछले राजपद का सीधा, स्वाभाविक वर्णन करता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह पद היה के साथ विधेय संज्ञा है; हिन्दी में ‘राजा था’ स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: यहाँ पूर्वसर्ग शासन और अधिकार का संबंध व्यक्त करता है; ‘इस्राएल पर राजा’ मूल की संरचना और अर्थ दोनों को बनाए रखता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: ב का स्थानवाचक अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से ‘में’ से व्यक्त होता है।
theological_decisions:
- issue: קֹהֶלֶת को अर्थानुवादित उपाधि बनाया जाए या लिप्यंतरित विशिष्ट पदनाम रखा जाए
  choice: कोहेलेत
  alternative: शिक्षक; उपदेशक; सभा को संबोधित करनेवाला
  rationale: यह इब्रानी शब्द अर्थ की दृष्टि से विवादित है और पुस्तक के वक्ता के विशिष्ट पदनाम जैसा कार्य करता है। लिप्यंतरण मूल की अस्पष्टता को सुरक्षित रखता है और किसी एक संप्रदायगत या व्याख्यात्मक अर्थ को थोपने से बचता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘कोहेलेत’ को पाठ में बनाए रखकर अर्थगत अनिश्चितता को पादटिप्पणी में समझाया गया है; ‘इस्राएल पर राजा’ मूल इब्रानी के शासन-संबंधी पूर्वसर्ग को प्रत्यक्ष रूप से दर्शाता है।
