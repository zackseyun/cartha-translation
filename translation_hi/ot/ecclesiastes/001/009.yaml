source:
  edition: WLC
  text: מַה שֶּֽׁ/הָיָה֙ ה֣וּא שֶׁ/יִּהְיֶ֔ה וּ/מַה שֶׁ/נַּֽעֲשָׂ֔ה ה֖וּא שֶׁ/יֵּעָשֶׂ֑ה וְ/אֵ֥ין כָּל חָדָ֖שׁ תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/009.yaml
  text: What has been is what will be[a], and what has been done is what will be done; and there is nothing new under the sun.
translation:
  language: hi
  text: जो हो चुका है, वही होगा[a], और जो किया जा चुका है, वही किया जाएगा; सूर्य के नीचे कुछ भी नया नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो था, वही होगा, और जो किया गया था, वही किया जाएगा।”
    reason: मूल की पूर्ण क्रिया को हिन्दी में साधारण भूतकाल से भी व्यक्त किया जा सकता है; यह विकल्प दोनों समानांतर उपवाक्यों को पूरा रखता है।
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: जो हो चुका है
  rationale: यह सम्बन्धवाचक रचना अतीत में घटित या अस्तित्व में रही बात को वर्तमान प्रासंगिकता सहित व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और सूक्तिपरक है।
- source_word: הוּא שֶׁיִּהְיֶה
  choice: वही फिर होगा
  rationale: सर्वनाम הוּא की समानतासूचक शक्ति को ‘वही’ बनाए रखता है, जबकि ‘फिर’ पुनरावृत्ति का वह भाव स्पष्ट करता है जो हिन्दी में इस कथन के आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמַה שֶׁנַּעֲשָׂה
  choice: और जो किया जा चुका है
  rationale: עשה के निफ़अल रूप का कर्मवाच्य/परिणामसूचक भाव सुरक्षित रखा गया है और पहले उपवाक्य के साथ समानांतरता बनी रहती है।
- source_word: הוּא שֶׁיֵּעָשֶׂה
  choice: वही फिर किया जाएगा
  rationale: निफ़अल अपूर्ण रूप के कर्मवाच्य भाव को बनाए रखते हुए भविष्य की पुनरावृत्ति व्यक्त की गई है; इसे व्यापक ‘वही घटेगा’ नहीं बनाया गया।
- source_word: וְאֵין כָּל חָדָשׁ
  choice: कुछ भी नया नहीं है
  rationale: אֵין + כָּל की सार्वभौमिक निषेधात्मक शक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की प्रमुख स्थानगत/दृष्टिकोणसूचक अभिव्यक्ति का पारदर्शी और परंपरागत हिन्दी रूप है।
theological_decisions:
- issue: सभोपदेशक की विश्वदृष्टि में इस कथन का दायरा
  choice: इसे ‘सूर्य के नीचे’ दिखाई देने वाले सांसारिक जीवन में दोहराए जाने वाले ढाँचों के सामान्य अवलोकन के रूप में रखा गया है।
  alternative: इसे हर अर्थ में किसी भी प्रकार की नवीनता का पूर्ण तत्त्वमीमांसात्मक निषेध मानना।
  rationale: ‘सूर्य के नीचे’ कथन के क्षेत्र को प्रत्यक्ष सांसारिक जीवन तक सीमित करता है। अनुवाद पद की प्रबल सार्वभौमिक भाषा को बनाए रखता है, पर उसके बाहर कोई व्याख्यात्मक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों समानांतर उपवाक्यों में ‘वही फिर’ द्वारा सूक्तिपरक लय और पुनरावृत्ति का भाव सुरक्षित है; ‘सूर्य के नीचे’ पुस्तक की प्रमुख अभिव्यक्ति के रूप में यथावत रखा गया है।
