base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/007.yaml
  text: All the streams flow into the sea[a], yet the sea is not full; to the place where the streams flow[b], there they return to flow again.
translation:
  language: hi
  text: सारी जलधाराएँ समुद्र में बहती हैं[a], फिर भी समुद्र भरता नहीं। जिस स्थान को जलधाराएँ बहती हैं[b], वहीं वे फिर बहने के लिए लौटती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नदियाँ।” हिब्रू शब्द जलधाराओं, नदियों, बरसाती नालों या उनके पाटों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिस स्थान को जलधाराएँ जाती हैं, वहीं वे जाने के लिए लौटती हैं।” यह कथन जल की आवर्ती गति का संकेत दे सकता है, पर उसकी प्रक्रिया स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: नदियाँ
  rationale: यह शब्द नदी, धारा, बरसाती नाला या जलधारा को सूचित कर सकता है। इस व्यापक, काव्यात्मक संदर्भ में ‘नदियाँ’ सहज हिन्दी है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הֹלְכִים
  choice: बहती हैं
  rationale: मूल क्रिया का सामान्य अर्थ ‘जाना’ है, पर जलधाराओं के लिए हिन्दी में ‘बहना’ स्वाभाविक और अर्थसंगत है।
- source_word: יָם
  choice: समुद्र
  rationale: यह हिब्रू शब्द का सामान्य और प्रत्यक्ष अर्थ है; ‘महासागर’ अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: אֵינֶנּוּ מָלֵא
  choice: भरता नहीं
  rationale: यह समुद्र के न भरने की स्थिति को सीधे व्यक्त करता है और मूल में निहित निरंतरता को ‘कभी नहीं’ जोड़कर बढ़ाता नहीं।
- source_word: מְקוֹם
  choice: स्थान
  rationale: मूल पाठ ‘स्थान’ कहता है, ‘स्रोत’ नहीं; इसलिए जलचक्र की कोई व्याख्यात्मक धारणा मुख्य पाठ में नहीं जोड़ी गई।
- source_word: שָׁם
  choice: वहीं
  rationale: यह मूल के स्थान-सूचक बल को बनाए रखता है और हिन्दी में पुनरुक्त संरचना को स्वाभाविक बनाता है।
- source_word: שָׁבִים
  choice: लौटती हैं
  rationale: यह क्रिया के सामान्य अर्थ ‘लौटना’ और पद में आवर्तन के भाव—दोनों को सुरक्षित रखता है।
- source_word: לָלָכֶת
  choice: फिर बहने के लिए
  rationale: शाब्दिक अर्थ ‘जाने के लिए’ है, किंतु नदियों के संदर्भ में ‘बहने के लिए’ स्वाभाविक है। ‘फिर’ लौटने और दोबारा बहने के आवर्ती भाव को स्पष्ट करता है।
