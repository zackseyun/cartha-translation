lexical_decisions:
- source_word: מְעֻוָּת
  choice: जो टेढ़ा है
  rationale: עוה के इस निष्क्रिय कृदन्त का अर्थ टेढ़ी, मुड़ी या विकृत वस्तु है। ‘जो टेढ़ा है’ नीतिवचन-सदृश अमूर्तता और अगले क्रियापद के साथ रूपक दोनों बनाए रखता है।
- source_word: לֹא יוּכַל לִתְקֹן
  choice: उसे सीधा नहीं किया जा सकता
  rationale: यह रचना असमर्थता व्यक्त करती है और תקן यहाँ सीधा करने या व्यवस्थित करने का भाव रखता है। ‘सीधा नहीं किया जा सकता’ टेढ़ेपन की मूल छवि को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְחֶסְרוֹן
  choice: और जो नहीं है
  rationale: חֶסְרוֹן कमी, अभाव या अनुपस्थित वस्तु को दर्शाता है। गिनने के संदर्भ में ‘जो नहीं है’ इस कहावत का स्वाभाविक हिन्दी रूप है, यद्यपि ‘जिसकी कमी है’ अधिक शाब्दिक विकल्प है।
- source_word: לְהִמָּנוֹת
  choice: गिना नहीं जा सकता
  rationale: מנה का निफ़अल रूप गिने या संख्या में शामिल किए जाने का अर्थ देता है। ‘गिना नहीं जा सकता’ आधुनिक हिन्दी में सीधा और सहज है।
