  text: כָּל הַ/דְּבָרִ֣ים יְגֵעִ֔ים לֹא יוּכַ֥ל אִ֖ישׁ לְ/דַבֵּ֑ר לֹא תִשְׂבַּ֥ע עַ֨יִן֙ לִ/רְא֔וֹת וְ/לֹא תִמָּלֵ֥א אֹ֖זֶן מִ/שְּׁמֹֽעַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/008.yaml
  text: All things are wearisome; a man cannot speak of it. The eye is not satisfied with seeing, nor is the ear filled with hearing.
translation:
  language: hi
  text: सब बातें थका देनेवाली हैं;[a] मनुष्य उनका वर्णन नहीं कर सकता।[b] आँख देखने से तृप्त नहीं होती, और कान सुनने से नहीं भरता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब शब्द थका देनेवाले हैं” अथवा “सब विषय थकाऊ हैं”; इब्रानी शब्द דְּבָרִים का अर्थ “शब्द,” “बातें,” “विषय,” या “चीज़ें” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मनुष्य कह नहीं सकता”; इब्रानी का अर्थ यह हो सकता है कि कोई मनुष्य इन बातों को पूरी तरह व्यक्त नहीं कर सकता, या यह विषय इतना थकाऊ है कि उसका वर्णन नहीं किया जा सकता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַדְּבָרִים
  choice: सब बातें
  rationale: דְּבָרִים का अर्थ ‘बातें,’ ‘वचन,’ ‘विषय,’ या ‘चीज़ें’ हो सकता है। यहाँ ‘सब बातें’ व्यापक संदर्भ को समेटता है और हिन्दी में स्वाभाविक है; शब्दगत अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: יְגֵעִים
  choice: थका देनेवाली हैं
  rationale: יגע से निकला यह विशेषण थकान और श्रमसाध्यता का भाव देता है। ‘थका देनेवाली’ अनुभव और उसका वर्णन—दोनों की क्लांति को खुला रखता है।
- source_word: לֹא יוּכַל אִישׁ לְדַבֵּר
  choice: मनुष्य उन्हें पूरी तरह कह नहीं सकता
  rationale: אִישׁ को सामान्य अर्थ में ‘मनुष्य’ रखा गया है। मूल में कर्म स्पष्ट नहीं है; ‘उन्हें’ पूर्ववर्ती बहुवचन की ओर संकेत करता है और ‘पूरी तरह’ उस संभावित भाव को व्यक्त करता है कि इन बातों को पर्याप्त रूप से कहा नहीं जा सकता। वैकल्पिक, अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לֹא תִשְׂבַּע עַיִן לִרְאוֹת
  choice: आँख देखते-देखते तृप्त नहीं होती
  rationale: שׂבע का मूल भाव तृप्त या संतुष्ट होना है। ‘देखते-देखते’ निरंतर अनुभव और उससे न भरने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: וְלֹא תִמָּלֵא אֹזֶן מִשְּׁמֹעַ
  choice: और कान सुनते-सुनते भरता नहीं
  rationale: מלא के ‘भरना’ अर्थ को बनाए रखा गया है, जिससे पिछले खंड के ‘तृप्त’ से मूल का शब्दगत अंतर सुरक्षित रहता है।
