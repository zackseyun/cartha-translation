  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַ֣תִּי אֶת לִבִּ֗/י לִ/דְר֤וֹשׁ וְ/לָ/תוּר֙ בַּֽ/חָכְמָ֔ה עַ֛ל כָּל אֲשֶׁ֥ר נַעֲשָׂ֖ה תַּ֣חַת הַ/שָּׁמָ֑יִם ה֣וּא עִנְיַ֣ן רָ֗ע נָתַ֧ן אֱלֹהִ֛ים לִ/בְנֵ֥י הָ/אָדָ֖ם לַ/עֲנ֥וֹת בּֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/001/013.yaml
  text: And I set my heart to seek and to explore by wisdom all that is done under heaven[b][a]. It is an unhappy task God has given to the sons of man to be occupied with.
translation:
  language: hi
  text: और मैंने अपना मन लगाया कि बुद्धि के द्वारा उस सबकी खोज और छानबीन करूँ जो आकाश के नीचे किया जाता है। यह एक दुःखद काम है, जिसे परमेश्वर ने मनुष्यों को दिया है कि वे उसमें लगे रहें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वे उससे पीड़ित रहें” अथवा “उसमें कठिन परिश्रम करते रहें।” इब्रानी अभिव्यक्ति किसी काम में लगे रहने और उससे बोझिल होने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי אֶת לִבִּי
  choice: और मैंने अपना मन लगाया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘मैंने अपना हृदय दिया’ है। आधुनिक हिन्दी में ‘मन लगाया’ बौद्धिक संकल्प और इच्छाशक्ति, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִדְרוֹשׁ וְלָתוּר
  choice: खोज और छानबीन करूँ
  rationale: 'दोनों निकटार्थी क्रियाओं को बनाए रखा गया है: पहली खोजने/पूछताछ करने और दूसरी गहराई से जाँचने का भाव देती है।'
- source_word: בַּחָכְמָה
  choice: बुद्धि के द्वारा
  rationale: यहाँ ב साधन या रीति बताता है; बुद्धि जाँच का माध्यम है।
- source_word: עַל כָּל אֲשֶׁר נַעֲשָׂה
  choice: उस सबकी ... जो ... किया जाता है
  rationale: निष्क्रिय क्रिया और कथन के सामान्य, व्यापक दायरे को सुरक्षित रखता है।
- source_word: תַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे
  rationale: सभोपदेशक में बार-बार आने वाले मानव जीवन-क्षेत्र के इस पदबंध का स्वाभाविक हिन्दी रूप।
- source_word: עִנְיַן רָע
  choice: एक दुःखद काम
  rationale: עִנְיַן व्यस्त रखने वाले काम/कार्य को और רָע यहाँ उसकी कष्टकर प्रकृति को व्यक्त करता है; ‘दुःखद’ नैतिक बुराई का अनावश्यक दावा नहीं करता।
- source_word: לִבְנֵי הָאָדָם
  choice: मनुष्यों को
  rationale: शाब्दिक रूप ‘आदम की संतानों/मनुष्य के पुत्रों’ का सामूहिक आशय मानवजाति है। हिन्दी में ‘मनुष्यों’ से वह सामान्य अर्थ बिना अस्वाभाविक पुरुष-विशेष अर्थ के स्पष्ट होता है।
- source_word: לַעֲנוֹת בּוֹ
  choice: कि वे उसमें लगे रहें
  rationale: क्रिया में किसी काम में लगे रहने तथा उससे दबे या पीड़ित होने, दोनों की संभावना है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया और बोझ/पीड़ा का वैकल्पिक संकेत पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: क्या רָע को परमेश्वर द्वारा दिए गए नैतिक रूप से ‘बुरे’ काम के रूप में अनूदित किया जाए
  choice: दुःखद काम
  alternative: बुरा काम
  rationale: संदर्भ मानव प्रयत्न की कष्टकर और निराशाजनक दशा पर केंद्रित है। ‘दुःखद’ नकारात्मक मूल्यांकन बनाए रखता है, पर परमेश्वर को नैतिक बुराई का दाता बताने वाला निष्कर्ष अनुवाद में नहीं जोड़ता।
- issue: לַעֲנוֹת בּוֹ की सक्रियता और पीड़ा के बीच अर्थगत तनाव
  choice: उसमें लगे रहें, साथ में पादटिप्पणी
  alternative: उससे पीड़ित रहें / उसमें परिश्रम करते रहें
  rationale: मूल क्रिया के अर्थ-क्षेत्र में व्यस्त रहना और कष्ट उठाना दोनों शामिल हो सकते हैं। मुख्य पाठ एक अर्थ चुनता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन लगाया’, ‘खोज और छानबीन’ तथा ‘आकाश के नीचे’ मूल के मुहावरे और दोहरी जाँच-क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
