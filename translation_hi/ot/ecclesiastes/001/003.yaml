  text: What profit does man have in all his labor at which he toils under the sun?[a]
translation:
  language: hi
  text: मनुष्य[a] को अपने सारे परिश्रम से क्या लाभ होता है, जो वह सूर्य के नीचे करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” एकवचन में है, पर उसका प्रयोग प्रतिनिधिक रूप से पूरी मानवजाति के किसी भी व्यक्ति के लिए हुआ है।
    reason: मूल हिब्रू के व्याकरणिक एकवचन और उसके सार्वभौमिक आशय को स्पष्ट करना।
lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: प्रश्नवाचक शब्द पद की संक्षिप्त और आलंकारिक प्रश्न-शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִתְרוֹן
  choice: लाभ
  rationale: यह सभोपदेशक का प्रमुख शब्द है, जो परिश्रम के बाद बचने वाले वास्तविक या स्थायी फायदे की धारणा व्यक्त करता है। ‘लाभ’ आर्थिक रूपक और व्यापक अर्थ—दोनों को सँभालता है।
- source_word: לָאָדָם
  choice: मनुष्य को
  rationale: אָדָם व्याकरण की दृष्टि से एकवचन है, पर यहाँ प्रतिनिधिक और सार्वभौमिक अर्थ रखता है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक generic संज्ञा है।
- source_word: בְּכָל עֲמָלוֹ
  choice: अपने उस सारे परिश्रम से
  rationale: संदर्भ में परिश्रम से मिलने वाले लाभ का प्रश्न है; इसलिए हिन्दी का ‘से’ परिणाम या प्राप्ति का संबंध स्वाभाविक रूप से व्यक्त करता है। ‘सारे’ कुल परिश्रम पर बल बनाए रखता है।
- source_word: שֶׁיַּעֲמֹל
  choice: जो वह ... करता है
  rationale: यह संबंधवाचक उपवाक्य मूल रचना को बनाए रखता है। हिन्दी में ‘परिश्रम करता है’ संज्ञा और क्रिया की हिब्रू पुनरुक्ति को समझने योग्य रूप में प्रतिध्वनित करता है।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: यह सभोपदेशक का कार्यक्रमात्मक वाक्यांश है और दृश्य, सांसारिक जीवन-क्षेत्र को दर्शाता है; शाब्दिक हिन्दी स्पष्ट और प्रचलित है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: मानवजाति; कोई व्यक्ति
  rationale: मूल का एकवचन रूप रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि कथन केवल पुरुषों तक सीमित नहीं, बल्कि सामान्य मानव अनुभव के विषय में है।
- issue: יִתְרוֹן में लाभ की प्रकृति
  choice: लाभ
  alternative: बढ़त; फायदा; शेष रहने वाला लाभ
  rationale: पद स्वयं यह निश्चित नहीं करता कि लाभ आर्थिक, अस्तित्वगत या स्थायी है। ‘लाभ’ इस अर्थगत विस्तार और पुस्तक के धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्न की संक्षिप्त आलंकारिक शक्ति तथा ‘लाभ’, ‘परिश्रम’ और ‘सूर्य के नीचे’ जैसे सभोपदेशक के प्रमुख पद सुरक्षित रखे गए हैं।
