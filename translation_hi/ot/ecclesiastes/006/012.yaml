source:
  edition: WLC
  text: כִּ֣י מִֽי יוֹדֵעַ֩ מַה טּ֨וֹב לָֽ/אָדָ֜ם בַּֽ/חַיִּ֗ים מִסְפַּ֛ר יְמֵי חַיֵּ֥י הֶבְל֖/וֹ וְ/יַעֲשֵׂ֣/ם כַּ/צֵּ֑ל אֲשֶׁר֙ מִֽי יַגִּ֣יד לָֽ/אָדָ֔ם מַה יִּהְיֶ֥ה אַחֲרָ֖י/ו תַּ֥חַת הַ/שָּֽׁמֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/012.yaml
  text: For who knows what is good for man in life, during the number of the days of his fleeting life, which he spends like a shadow? For who can tell man what will be after him under the sun?
translation:
  language: hi
  text: क्योंकि कौन जानता है कि मनुष्य के लिए जीवन में क्या अच्छा है—उसके क्षणभंगुर[a] जीवन के गिने-चुने दिनों में, जिन्हें वह छाया के समान बिता देता है? और कौन मनुष्य को बता सकता है कि उसके बाद सूर्य के नीचे क्या होगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का मूल अर्थ “भाप” या “साँस” है; प्रसंग के अनुसार यह क्षणभंगुर, पकड़ में न आने वाला या व्यर्थ होने का भाव दे सकता है।
    reason: सभोपदेशक के प्रमुख शब्द הֶבֶל के मूल बिंब और अर्थगत बहुलता को पाठक के लिए सुरक्षित रखना।
lexical_decisions:
- source_word: הֶבְל֖וֹ (hevlo)
  choice: उसके क्षणभंगुर जीवन
  rationale: הֶבֶל का मूल बिंब भाप या साँस है और यहाँ जीवन की अल्पस्थायिता तथा पकड़ में न आने वाली प्रकृति पर बल है। ‘क्षणभंगुर’ इस संदर्भ में स्वाभाविक हिन्दी में उस बिंब का आशय व्यक्त करता है, जबकि पादटिप्पणी मूल रूपक और उसकी अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: מִסְפַּר יְמֵי (mispar yemei)
  choice: गिनती के दिनों में
  rationale: ‘दिनों की संख्या’ के शाब्दिक ढाँचे को जड़ हिन्दी में रखने के बजाय ‘गिनती के दिन’ सीमित, गिने जा सकने वाले जीवनकाल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיַעֲשֵׂם כַּצֵּל (veya'asem katsel)
  choice: जिन्हें वह छाया के समान बिता देता है
  rationale: क्रिया का शाब्दिक भाव ‘उन्हें छाया के समान करता है’ है; प्रसंग में इसका स्वाभाविक अर्थ उन दिनों को छाया की तरह बिताना है। ‘छाया’ का मूल उपमान यथावत रखा गया है।
- source_word: אַחֲרָיו (acharav)
  choice: उसके बाद
  rationale: यह पद मनुष्य के चले जाने या मरने के बाद की घटनाओं के विषय में है; मूल की संक्षिप्तता और संभावित व्यापकता को बनाए रखने के लिए ‘उसके बाद’ रखा गया है।
- source_word: תַּחַת הַשָּׁמֶשׁ (tachat hashemesh)
  choice: सूर्य के नीचे
  rationale: सभोपदेशक की विशिष्ट और बार-बार आने वाली अभिव्यक्ति को सीधे तथा सुसंगत रूप में रखा गया है।
theological_decisions:
- issue: הֶבֶל को ‘व्यर्थ’ या ‘क्षणभंगुर’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘क्षणभंगुर’, पादटिप्पणी में मूल बिंब और अन्य अर्थ-संभावनाएँ
  alternative: ‘व्यर्थ जीवन’
  rationale: इस वाक्य में दिनों और छाया का उल्लेख समय की अस्थिरता को प्रमुख बनाता है। केवल ‘व्यर्थ’ कहने से नैतिक या निष्फलता का अर्थ अनावश्यक रूप से निर्णायक हो सकता है; पादटिप्पणी पुस्तक के व्यापक अर्थ-संकेत को खुला रखती है।
- issue: ‘उसके बाद’ का आशय
  choice: अस्पष्टता बनाए रखते हुए ‘उसके बाद’
  alternative: ‘उसकी मृत्यु के बाद’ या ‘उसके जाने के बाद’
  rationale: मूल पाठ मृत्यु को स्पष्ट रूप से नहीं कहता। इसलिए भविष्य, उत्तराधिकार और मृत्यु-पश्चात स्थिति के बीच की वास्तविक अर्थगत खुलावट को संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के योग्य है। दो प्रश्नों की समानांतर रचना तथा दोनों आरम्भिक כִּי का ‘क्योंकि’ के रूप में पुनरावर्तन रखा गया है।
