source:
  edition: WLC
  text: כִּ֛י יֵשׁ דְּבָרִ֥ים הַרְבֵּ֖ה מַרְבִּ֣ים הָ֑בֶל מַה יֹּתֵ֖ר לָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/011.yaml
  text: For there are many words that increase vanity; what advantage is there for man?
translation:
  language: hi
  text: क्योंकि बहुत-सी बातें हैं जो व्यर्थता को बढ़ाती हैं; मनुष्य को क्या लाभ है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבָרִים
  choice: बातें
  rationale: इस बहुवचनीय शब्द का अर्थ ‘बातें/वचन’ या ‘विषय/चीज़ें’ हो सकता है। निकटवर्ती संदर्भ में वाणी की अधिकता और बहस की ओर संकेत होने के कारण ‘बातें’ स्वाभाविक है और ‘शब्द’ से अधिक व्यापक मूल अस्पष्टता भी कुछ हद तक बनाए रखता है।
- source_word: מַרְבִּים הָבֶל
  choice: व्यर्थता को बढ़ाती हैं
  rationale: हिफ़ील कृदंत का कारणवाचक भाव सीधे रखा गया है; הֶבֶל को सभोपदेशक में बार-बार आने वाले मुख्य भाव के अनुरूप ‘व्यर्थता’ कहा गया है।
- source_word: מַה־יֹּתֵר לָאָדָם
  choice: मनुष्य को इससे क्या लाभ होता है?
  rationale: יֹתֵר यहाँ लाभ या बढ़त का प्रश्न उठाता है। ‘इससे’ हिन्दी में संबंध स्पष्ट करता है, पर उत्तर आरोपित नहीं करता।
theological_decisions:
- issue: הֶבֶל के अर्थ की व्याख्या
  choice: व्यर्थता
  alternative: भाप / क्षणभंगुरता
  rationale: ‘व्यर्थता’ पुस्तक के पारंपरिक और प्रसंगानुकूल धर्मवैचारिक तनाव को बनाए रखती है; इसे केवल क्षणभंगुरता या निरर्थकता में सीमित नहीं किया गया।
- issue: דְּבָרִים का संदर्भ
  choice: बातें
  alternative: चीज़ें / विषय
  rationale: मसोरेटिक पाठ में अर्थगत विस्तार संभव है, पर इस पद में ‘बहुत-सी बातें’ अंग्रेज़ी परामर्श-पाठ और संभावित वाचिक संदर्भ से मेल खाता है। ‘बातें’ ‘शब्दों’ की अपेक्षा मूल की व्यापकता को बेहतर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। अलंकारिक प्रश्न और पद की निराशावादी-चिंतनशील धार सुरक्षित रखी गई है।
