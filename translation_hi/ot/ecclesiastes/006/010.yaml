base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/010.yaml
  text: Whatever has come to be has already been named[a], and it is known what man is[b]; and he cannot contend with one stronger than he.
translation:
  language: hi
  text: जो कुछ अस्तित्व में आया है, उसका नाम पहले ही रखा जा चुका है; और यह ज्ञात है कि मनुष्य[a] क्या है, और वह अपने से अधिक शक्तिशाली व्यक्ति[b] के साथ विवाद नहीं कर सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ एकवचन में समस्त मानवजाति का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शक्तिशाली व्यक्ति से आशय संभवतः परमेश्वर है, यद्यपि हिब्रू पाठ यहाँ उसे स्पष्ट रूप से परमेश्वर नहीं कहता।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה שֶּׁהָיָה
  choice: जो कुछ अस्तित्व में आया है
  rationale: यह व्यापक अभिव्यक्ति अस्तित्व में आने वाली या घटित होने वाली हर वस्तु या बात को समेटती है और היה के पूर्णतासूचक भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כְּבָר
  choice: पहले ही
  rationale: यह पूर्वता और पहले से निर्धारित होने के नीतिवचन-सदृश भाव को संक्षेप में व्यक्त करता है।
- source_word: נִקְרָא שְׁמוֹ
  choice: उसका नाम ... रखा जा चुका है
  rationale: हिब्रू की कर्मवाच्य नामकरण-अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए नाम देने अथवा ठहराए जाने की छवि सुरक्षित की गई है।
- source_word: וְנוֹדָע אֲשֶׁר הוּא אָדָם
  choice: और यह ज्ञात है कि मनुष्य क्या है
  rationale: यह अनुवाद स्थापित ज्ञान के भाव तथा मानव की दशा या पहचान से जुड़े कथन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसकी सीमा को अनावश्यक रूप से तय किए।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन אָדָם समस्त मानवजाति का प्रतिनिधित्व करता है; ‘मनुष्य’ आधुनिक हिन्दी में इस सामूहिक प्रतिनिधि अर्थ को सहजता से व्यक्त करता है।
- source_word: וְלֹא יוּכַל לָדִין
  choice: विवाद नहीं कर सकता
  rationale: דין यहाँ केवल औपचारिक मुकदमेबाजी नहीं, बल्कि प्रतिवाद या संघर्ष में उतरने का व्यापक अर्थ रखता है; ‘विवाद’ उस अर्थ को अनावश्यक कानूनी रंग दिए बिना व्यक्त करता है।
- source_word: עִם שֶׁהִתְקִיף מִמֶּנּוּ
  choice: अपने से अधिक शक्तिशाली व्यक्ति के साथ
  rationale: तुलनात्मक शक्ति का अर्थ स्पष्ट रखा गया है, पर उस अधिक शक्तिशाली व्यक्ति की पहचान मुख्य पाठ में परमेश्वर के रूप में नहीं की गई, क्योंकि हिब्रू उसे स्पष्टतः नामित नहीं करता।
theological_decisions:
- issue: अधिक शक्तिशाली व्यक्ति की पहचान क्या परमेश्वर के रूप में स्पष्ट की जाए
  choice: मुख्य पाठ में पहचान को अनिर्दिष्ट रखना
  alternative: ‘परमेश्वर, जो उससे अधिक शक्तिशाली है’ कहना
  rationale: संदर्भ में संकेत संभवतः परमेश्वर की ओर है, पर हिब्रू पाठ परमेश्वर का नाम स्पष्ट रूप से नहीं लेता। इसलिए मूल की निहितता और धार्मिक तनाव को बनाए रखा गया है।
- issue: אָדָם को किसी एक पुरुष के रूप में लेना या मानवजाति के प्रतिनिधि एकवचन के रूप में
  choice: ‘मनुष्य’—मानवजाति का प्रतिनिधि एकवचन
  alternative: ‘मानवजाति’ या ‘एक मनुष्य’
  rationale: ज्ञान-साहित्य के इस सामान्य कथन में אָדָם किसी विशिष्ट पुरुष के बजाय मानवीय दशा और समस्त मानवजाति का प्रतिनिधित्व करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की नीतिवचन-सदृश संक्षिप्तता बनाए रखते हुए ‘अस्तित्व में आया है’, ‘ज्ञात है’ और ‘विवाद’ जैसे सामान्यतः समझे जाने वाले शब्द चुने गए हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी [a] का विषय उसके चिह्न से मेल नहीं खाता था; हिन्दी मसौदे में चिह्नों को उनके वास्तविक विषय—‘मनुष्य’ और ‘अधिक शक्तिशाली व्यक्ति’—पर रखा गया है।
