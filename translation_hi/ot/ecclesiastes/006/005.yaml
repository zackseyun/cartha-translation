  yaml_path: translation/ot/ecclesiastes/006/005.yaml
  text: Though it has not seen the sun or known anything[b][a], it has more rest than that man.
translation:
  language: hi
  text: यद्यपि उसने न तो सूर्य देखा[b], न ही कुछ जाना, फिर भी इसे उस मनुष्य से अधिक चैन है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इसको उससे अधिक चैन है।” दोनों संकेतवाचक शब्द क्रमशः मृत-जन्मे शिशु और पिछले पदों में बताए गए मनुष्य की ओर संकेत करते हैं।
    reason: lexical_alternative
  - marker: b
    text: “सूर्य देखना” एक इब्रानी अभिव्यक्ति है, जिसका अर्थ इस संसार में जीवन का अनुभव करना है।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם
  choice: यद्यपि … फिर भी
  rationale: 'प्रसंग में यह शब्द रियायती भाव प्रकट करता है: जीवन का कोई अनुभव न होने पर भी मृत-जन्मे बच्चे को उस मनुष्य से अधिक चैन है।'
- source_word: שֶׁמֶשׁ לֹא רָאָה
  choice: उसने न तो सूर्य देखा
  rationale: मूल बिंब को बनाए रखा गया है। सभोपदेशक में ‘सूर्य देखना’ इस संसार में जीवन का अनुभव करने का संकेत है।
- source_word: וְלֹא יָדָע
  choice: न कुछ जाना
  rationale: क्रिया यहाँ सामान्य ज्ञान, चेतना या अनुभव को सूचित करती है; ‘कुछ’ हिन्दी में निहित कर्म को स्वाभाविक रूप से व्यक्त करता है, बिना अर्थ को अनावश्यक रूप से सीमित किए।
- source_word: נַחַת
  choice: चैन
  rationale: यहाँ शब्द विश्राम, शांति या कष्ट से मुक्त अवस्था का बोध कराता है। आधुनिक हिन्दी में ‘चैन’ इस तुलना को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: לָזֶה מִזֶּה
  choice: इसे उस मनुष्य से अधिक
  rationale: मूल में शाब्दिक रूप से ‘इसको उस से अधिक’ है। ‘इसे’ मृत-जन्मे बच्चे की ओर संकेत करता है, जबकि प्रसंग के आधार पर दूसरे संकेतवाचक को ‘उस मनुष्य’ किया गया है।
