  text: אִ֣ישׁ אֲשֶׁ֣ר יִתֶּן ל֣/וֹ הָ/אֱלֹהִ֡ים עֹשֶׁר֩ וּ/נְכָסִ֨ים וְ/כָב֜וֹד וְֽ/אֵינֶ֨/נּוּ חָסֵ֥ר לְ/נַפְשׁ֣/וֹ מִ/כֹּ֣ל אֲשֶׁר יִתְאַוֶּ֗ה וְ/לֹֽא יַשְׁלִיטֶ֤/נּוּ הָֽ/אֱלֹהִים֙ לֶ/אֱכֹ֣ל מִמֶּ֔/נּוּ כִּ֛י אִ֥ישׁ נָכְרִ֖י יֹֽאכֲלֶ֑/נּוּ זֶ֥ה הֶ֛בֶל וָ/חֳלִ֥י רָ֖ע הֽוּא־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/002.yaml
  text: There is a man to whom God gives riches[a], possessions, and honor, so that he lacks nothing for himself of all that he desires, yet God does not empower him to eat from them, because a foreign man eats them[c][b]. This is vanity and a grievous sickness.
translation:
  language: hi
  text: एक मनुष्य है जिसे परमेश्वर धन, संपत्ति और सम्मान देता है, और जिस किसी वस्तु की वह इच्छा करता है उसकी उसे कोई कमी नहीं होती; फिर भी परमेश्वर उसे उनमें से खाने का सामर्थ्य नहीं देता,[a] बल्कि एक परदेशी व्यक्ति उन्हें खाता है।[c] यह व्यर्थता[b] और एक बुरी बीमारी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनमें से खाने का सामर्थ्य नहीं देता”; यहाँ खाने का अर्थ अपनी संपत्ति का उपभोग करना या उससे आनंद पाना भी है।
    reason: lexical_alternative
  - marker: b
    text: “व्यर्थता” के लिए प्रयुक्त इब्रानी शब्द हेवेल का अर्थ “भाप,” “क्षणभंगुरता” या “निष्फलता” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “परदेशी व्यक्ति” के लिए इब्रानी पद का अर्थ “विदेशी,” “अजनबी” या “बाहरी व्यक्ति” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: एक मनुष्य है जिसे
  rationale: इब्रानी की अनिश्चित एकवचन और सामान्य ज्ञान-वचनात्मक कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֹשֶׁר וּנְכָסִים וְכָבוֹד
  choice: धन, संपत्ति और सम्मान
  rationale: तीनों अलग अवधारणाओं—समृद्धि, भौतिक स्वामित्व और सामाजिक प्रतिष्ठा—को स्पष्ट तथा संक्षिप्त रूप में रखता है।
- source_word: וְאֵינֶנּוּ חָסֵר לְנַפְשׁוֹ מִכֹּל אֲשֶׁר יִתְאַוֶּה
  choice: उसके मन की चाही हुई किसी भी वस्तु की उसे कमी नहीं होती
  rationale: נפש को यहाँ तकनीकी अर्थ में ‘आत्मा’ न बनाकर व्यक्ति की इच्छा/मन के मुहावरे के रूप में व्यक्त करता है।
- source_word: וְלֹא יַשְׁלִיטֶנּוּ הָאֱלֹהִים
  choice: फिर भी परमेश्वर उसे ... का सामर्थ्य नहीं देता
  rationale: शלט के हिफ़ील रूप की कारणवाचक शक्ति को केवल ‘अनुमति नहीं देता’ कहने की अपेक्षा अधिक निकटता से व्यक्त करता है।
- source_word: לֶאֱכֹל מִמֶּנּוּ
  choice: उनमें से खाने
  rationale: सभोपदेशक की ठोस ‘खाने’ की छवि को सुरक्षित रखता है; इसका आशय संपत्ति का उपभोग या आनंद लेना भी है।
- source_word: אִישׁ נָכְרִי
  choice: कोई पराया मनुष्य
  rationale: איש और נכרי दोनों को व्यक्त करते हुए ऐसे दूसरे व्यक्ति का बोध देता है जो उस धन का अपना अधिकारी नहीं है; ‘विदेशी’ भी संभव है।
- source_word: זֶה הֶבֶל
  choice: यह व्यर्थता है
  rationale: הבל के प्रसंगगत निष्फलता/निरर्थकता के भाव को हिन्दी में स्वाभाविक रूप से देता है, जबकि उसकी ‘भाप’ जैसी क्षणभंगुर छवि को पादटिप्पणी में रखा गया है।
- source_word: וָחֳלִי רָע
  choice: और एक बुरी बीमारी
  rationale: חֳלִי के ठोस ‘बीमारी’ अर्थ को बनाए रखता है और רָע को ‘बुरी’ के रूप में सीधे व्यक्त करता है।
theological_decisions:
- issue: לְנַפְשׁוֹ का मानव-स्वरूप संबंधी अर्थ
  choice: उसके मन की चाही हुई
  alternative: अपनी आत्मा के लिए
  rationale: इस प्रसंग में נֶפֶשׁ व्यक्ति की इच्छा या स्वयं व्यक्ति का मुहावरेदार संकेत है; ‘आत्मा’ अनावश्यक तकनीकी द्वैतवाद का आभास दे सकता है।
- issue: परमेश्वर द्वारा उपभोग का सामर्थ्य न दिया जाना
  choice: सामर्थ्य नहीं देता
  alternative: अनुमति नहीं देता
  rationale: मूल का कारणवाचक क्रियारूप क्षमता/अधिकार प्रदान करने की बात करता है; अनिष्ट का कारण परमेश्वर से जुड़ा रहने दिया गया है, बिना उसका दार्शनिक समाधान किए।
- issue: אִישׁ נָכְרִי की पहचान
  choice: कोई पराया मनुष्य
  alternative: कोई विदेशी मनुष्य
  rationale: मूल यह स्पष्ट नहीं करता कि वह जातीय विदेशी है, अपरिचित है, या संपत्ति से असंबद्ध दूसरा व्यक्ति; ‘पराया’ इस अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘सामर्थ्य नहीं देता’ कारणवाचक मूल को रखता है, ‘खाने’ की ठोस उपमा सुरक्षित है, और ‘बुरी बीमारी’ अंतिम इब्रानी पदबंध का औपचारिक रूप है।
