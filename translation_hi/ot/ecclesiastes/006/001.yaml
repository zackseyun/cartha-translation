base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/001.yaml
  text: 'There is an evil that I have seen under the sun[a], and it is heavy upon man:'
translation:
  language: hi
  text: 'मैंने सूर्य के नीचे एक बुराई देखी है, और वह मनुष्य[a] पर बहुत भारी पड़ती है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवजाति।” इब्रानी में यहाँ ‘मनुष्य’ जातिवाचक एकवचन है और सामान्य रूप से समस्त मानवता को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: एक ... है
  rationale: यह अस्तित्वसूचक अव्यय किसी देखी गई वास्तविकता का परिचय देता है; हिन्दी में इस वाक्य-विन्यास में ‘एक ... है’ स्वाभाविक है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द बुरी, दुःखद या अनिष्टकारी स्थिति को सूचित कर सकता है। ‘बुराई’ उसके व्यापक नैतिक और अनुभवगत भार को बनाए रखता है, बिना अर्थ को केवल ‘विपत्ति’ तक सीमित किए।
- source_word: אֲשֶׁר רָאִיתִי
  choice: जिसे मैंने ... देखा है
  rationale: सम्बन्धवाचक उपवाक्य और प्रथम पुरुष एकवचन पूर्ण क्रिया का सहज, चिंतनशील हिन्दी रूप।
- source_word: תַּחַת הַשָּׁמֶשׁ
  choice: सूर्य के नीचे
  rationale: सभोपदेशक का आवर्ती मुहावरा है, जो इस संसार में मानवीय जीवन और गतिविधि के क्षेत्र को दर्शाता है; शाब्दिक रूप हिन्दी में भी स्वाभाविक है।
- source_word: וְרַבָּה הִיא
  choice: और वह ... भारी है
  rationale: רַבָּה का मूल भाव ‘बड़ी/बहुत’ है, पर עַל के साथ यहाँ उसका बोझिल या गंभीर होना व्यक्त होता है। ‘भारी है’ स्रोत की संरचना और अर्थगत तनाव दोनों को बनाए रखता है।
- source_word: עַל הָאָדָם
  choice: मनुष्य पर
  rationale: אָדָם यहाँ जातिवाचक एकवचन है और सामान्य मानवता की ओर संकेत करता है। ‘मनुष्य’ हिन्दी में एकवचन रूप तथा समावेशी सामान्य अर्थ दोनों को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: הָאָדָם का जातिवाचक अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: इब्रानी में जातिवाचक एकवचन रूप है। ‘मनुष्य’ उस व्याकरणिक रूप को बनाए रखते हुए हिन्दी में समस्त मानवता का सामान्य अर्थ दे सकता है; ‘मानवजाति’ अर्थ को अधिक स्पष्ट करता, पर मूल के एकवचन रूप को खो देता।
- issue: רָעָה का अर्थ-क्षेत्र
  choice: बुराई
  alternative: विपत्ति
  rationale: संदर्भ किसी दुःखद या अनिष्टकारी दशा की ओर जा सकता है, लेकिन मूल शब्द नैतिक और अनुभवगत दोनों अर्थों के लिए खुला है। ‘बुराई’ उस व्यापकता को संरक्षित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘सूर्य के नीचे’ पुस्तक के विशिष्ट मुहावरे को बनाए रखता है। पद के अंत में द्विबिंदु अगले कथन से इसके निकट संबंध को दर्शाता है।
