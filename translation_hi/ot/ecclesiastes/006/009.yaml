base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/009.yaml
  text: Better is the sight of the eyes than the wandering of the soul[c][b][a]; this too is vapor and a chasing after wind.
translation:
  language: hi
  text: आँखों के सामने जो है[a], वह लालसा[b] के भटकते रहने से अच्छा है। यह भी भाप के समान है और हवा के पीछे दौड़ना[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आँखों का देखना” या “आँखों का दृश्य।”
    reason: lexical_alternative
  - marker: b
    text: या “मन,” “इच्छा” अथवा “प्राण।” यहाँ प्रयुक्त इब्रानी शब्द नेफ़ेश उस चाहने वाले मन या अतृप्त अभिलाषा की ओर संकेत कर सकता है जो भटकती रहती है।
    reason: lexical_alternative
  - marker: c
    text: या “हवा को साधने का प्रयत्न।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב ... מִן
  choice: '... से अच्छा है'
  rationale: तुलनात्मक इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַרְאֵה עֵינַיִם
  choice: आँखों के सामने जो है
  rationale: शाब्दिक चित्र को बनाए रखते हुए आधुनिक हिन्दी में ‘आँखों का दृश्य’ की अपेक्षा अधिक सहज है।
- source_word: מֵהֲלָךְ
  choice: के भटकते रहने से
  rationale: הלך से बने इस रूप में चलने या घूमते रहने का भाव है; प्रसंग में यह अस्थिर, निरंतर भटकती चाह को दर्शाता है।
- source_word: נָפֶשׁ
  choice: लालसा
  rationale: यहाँ נֶפֶשׁ संभवतः अमूर्त ‘आत्मा’ के बजाय चाहने वाले मन या अतृप्त अभिलाषा को सूचित करता है; ‘लालसा’ इस प्रसंगगत अर्थ को स्पष्ट रखता है।
- source_word: גַּם זֶה
  choice: यह भी
  rationale: सभोपदेशक के बार-बार आने वाले मूल्यांकन-सूत्र का संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: הֶבֶל
  choice: भाप के समान
  rationale: क्षणभंगुरता और पकड़ में न आने की मूल ठोस उपमा को बनाए रखता है; ‘व्यर्थता’ कहने से उपमा खो जाती।
- source_word: וּרְעוּת רוּחַ
  choice: और हवा के पीछे दौड़ना
  rationale: निष्फल प्रयत्न की छवि को सरल आधुनिक हिन्दी में सुरक्षित रखता है, जबकि इब्रानी पद की व्युत्पत्तिगत कठिनाई को पादटिप्पणी में स्वीकार किया गया है।
theological_decisions:
- issue: נָפֶשׁ का अर्थ
  choice: मुख्य पाठ में ‘लालसा’
  alternative: ‘प्राण’, ‘मन’ या ‘इच्छा’
  rationale: प्रसंग वर्तमान में दिखाई देने वाली वस्तु और इधर-उधर भटकती चाह के बीच तुलना करता है। ‘आत्मा’ लिखना बाद की दार्शनिक या धर्मवैज्ञानिक धारणा को अनावश्यक रूप से आरोपित कर सकता है; फिर भी मूल शब्द की व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आँखों के सामने जो है’ तथा ‘हवा के पीछे दौड़ना’ ठोस काव्यात्मक चित्रों को साधारण पाठक के लिए सहज बनाते हैं। ‘भाप के समान’ הֶבֶל की मूल उपमा को सुरक्षित रखता है।
