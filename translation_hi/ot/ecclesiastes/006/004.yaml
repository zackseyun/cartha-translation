  rationale: मूल में यह शब्द दो बार आया है; दोनों बार एक ही शब्द रखकर उसकी पुनरुक्ति और अस्पष्टता/गुमनामी की रूपकात्मक ध्वनि सुरक्षित रखी गई है।
- source_word: יֵלֵךְ
