  rationale: यह प्रस्थान को व्यक्त करता है। इसे स्पष्ट रूप से ‘मर जाता है’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: שְׁמוֹ
  choice: उसका नाम
  rationale: शाब्दिक रूप सुरक्षित रखा गया है; प्रसंग में नाम पहचान या स्मृति का संकेत दे सकता है।
- source_word: יְכֻסֶּה
  choice: ढक जाता है
  rationale: यह नाम के आवृत या ओझल हो जाने की निष्क्रिय छवि को स्वाभाविक हिन्दी में रखता है। ‘छिप जाता है’ भी संभव है, पर उससे मूल का ‘ढकना’ वाला बिंब कम स्पष्ट होता।
