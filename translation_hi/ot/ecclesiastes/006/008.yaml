source:
  edition: WLC
  text: כִּ֛י מַה יּוֹתֵ֥ר לֶ/חָכָ֖ם מִֽן הַ/כְּסִ֑יל מַה לֶּ/עָנִ֣י יוֹדֵ֔עַ לַ/הֲלֹ֖ךְ נֶ֥גֶד הַ/חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/008.yaml
  text: For what advantage does the wise man have over the fool? What does the poor man have who knows how to conduct himself before the living?[a]
translation:
  language: hi
  text: क्योंकि बुद्धिमान को मूर्ख से बढ़कर क्या लाभ है? गरीब को क्या मिलता है, जो जीवित लोगों के सामने व्यवहार करना जानता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शब्दशः: “गरीब को क्या मिलता है, जो जीवित लोगों के सामने चलना जानता है?” यहाँ “चलना” व्यवहार या जीवन-ढंग के लिए मुहावरे के रूप में प्रयुक्त हो सकता है।'
    reason: शाब्दिक रूप और मुहावरेदार अर्थ दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछली बात का आधार या कारण प्रस्तुत करता है; ‘क्योंकि’ उपदेशक के तर्क-प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַה יּוֹתֵר
  choice: बढ़कर क्या लाभ
  rationale: यह पदबंध अतिरिक्त लाभ या बढ़त के विषय में प्रश्न करता है। ‘बढ़कर क्या लाभ’ तुलना और पुस्तक में बार-बार आने वाली लाभ की धारणा, दोनों को बनाए रखता है।
- source_word: לֶחָכָם ... מִן הַכְּסִיל
  choice: बुद्धिमान को मूर्ख से
  rationale: מִן तुलनात्मक अर्थ देता है। हिन्दी में संज्ञा-रूप ‘बुद्धिमान’ और ‘मूर्ख’ स्वाभाविक हैं तथा मूल के एकवचन प्रतिनिधि प्रयोग को सुरक्षित रखते हैं।
- source_word: מַה לֶּעָנִי
  choice: उस गरीब को क्या मिलता है
  rationale: इब्रानी वाक्य संक्षिप्त है और क्रिया को स्पष्ट नहीं करता। ‘क्या मिलता है’ हिन्दी में सुबोध है, पर पहले प्रश्न के ‘लाभ’ को दूसरी पंक्ति में स्पष्ट रूप से जोड़कर मूल की संभावित अस्पष्टता को समाप्त नहीं करता।
- source_word: עָנִי
  choice: गरीब
  rationale: संदर्भ में आर्थिक-सामाजिक अर्थ सबसे संभावित है; शब्द का ‘दीन/पीड़ित’ अर्थ भी संभव है, पर यहाँ ‘गरीब’ अधिक सीधा है।
- source_word: יוֹדֵעַ לַהֲלֹךְ
  choice: ठीक ढंग से चलना जानता है
  rationale: הלך का मूल अर्थ ‘चलना’ है और यह आचरण का मुहावरा भी हो सकता है। ‘ठीक ढंग से चलना’ मूल रूपक को बनाए रखते हुए हिन्दी पाठक को आचरण का संकेत देता है।
- source_word: נֶגֶד הַחַיִּים
  choice: जीवित लोगों के सामने
  rationale: נֶגֶד का अर्थ ‘सामने/उपस्थिति में’ और הַחַיִּים का सामूहिक अर्थ ‘जीवित लोग’ है। यह असामान्य किंतु वास्तविक इब्रानी अभिव्यक्ति को अनावश्यक रूप से ‘समाज में’ नहीं बदलता।
theological_decisions:
- issue: दूसरे प्रश्न में पहले प्रश्न के ‘लाभ’ की पूर्ति
  choice: ‘क्या मिलता है’ रखा गया
  alternative: ‘क्या लाभ है’
  rationale: दूसरे खंड में ‘लाभ’ शब्द प्रत्यक्ष रूप से नहीं है, यद्यपि समानांतरता से उसका भाव समझा जा सकता है। चुना हुआ पाठ इस संबंध को संकेतित करता है, पर उसे निश्चित बनाकर मूल की संक्षिप्तता और व्याख्यात्मक तनाव को मिटाता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मूल की प्रश्नात्मक समानांतरता, ‘चलना’ रूपक और दूसरे प्रश्न की अपूर्ण/संक्षिप्त रचना को यथासंभव सुरक्षित रखा गया है।
