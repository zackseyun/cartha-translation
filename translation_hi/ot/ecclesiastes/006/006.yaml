- source_word: אֶלֶף שָׁנִים פַּעֲמַיִם
  choice: दो बार एक-एक हज़ार वर्ष
  rationale: इब्रानी के शाब्दिक बल ‘एक हज़ार वर्ष, दो बार’ को पठनीय हिन्दी में बनाए रखता है; इसका अर्थ दो हज़ार वर्ष भी कहा जा सकता है।
- source_word: וְטוֹבָה לֹא רָאָה
  choice: पर भलाई न देखे
  rationale: ‘देखना’ क्रिया और ‘भलाई’ की व्यापक अर्थ-सीमा को सुरक्षित रखता है; मुहावरे में आशय भलाई का अनुभव या आनंद पाना है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל מָקוֹם אֶחָד
  choice: एक ही स्थान को
  rationale: मूल के ‘एक स्थान’ को सुरक्षित रखते हुए ‘एक ही’ सभी के समान गंतव्य का भाव स्वाभाविक रूप से देता है, पर स्थान की पहचान स्पष्ट नहीं करता।
- source_word: הַכֹּל הוֹלֵךְ
  choice: सभी ... जाते
  rationale: संदर्भ में सभी मनुष्यों के सामान्य गंतव्य की सार्वकालिक वास्तविकता व्यक्त होती है।
theological_decisions:
- issue: ‘एक स्थान’ का निहित गंतव्य
  choice: मुख्य पाठ में ‘एक ही स्थान’ रखकर गंतव्य को अनिर्दिष्ट छोड़ा गया।
  alternative: कब्र, अधोलोक या मृत्यु
  rationale: इब्रानी पाठ केवल ‘एक स्थान’ कहता है। संदर्भ मृत्यु में समान गंतव्य की ओर संकेत करता है, पर किसी विशिष्ट शब्द को मुख्य पाठ में जोड़ना मूल की संयमित अभिव्यक्ति को अनावश्यक रूप से स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक-ज्ञानसाहित्य के अनुकूल रूप। ‘भलाई देखे’ मूल इब्रानी मुहावरे को बनाए रखता है, जबकि पादटिप्पणी उसका सामान्य अर्थ स्पष्ट करती है।
