base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/006.yaml
  text: Even if he should live a thousand years twice over and not see good[c][b][a], do not all go to one place?
translation:
  language: hi
  text: चाहे वह एक हज़ार वर्ष दो बार जीए[a] और भलाई न देखे[b]—क्या सभी एक ही स्थान को नहीं जाते?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो हज़ार वर्ष”; शाब्दिक रूप से, “एक हज़ार वर्ष, दो बार।”
    reason: lexical_alternative
  - marker: b
    text: “भलाई देखना” एक इब्रानी मुहावरा है, जिसका अर्थ भलाई का अनुभव करना या उसका आनंद पाना है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात मृत्यु में वही गंतव्य; इब्रानी पाठ केवल “एक स्थान” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִלּוּ
  choice: चाहे
  rationale: यह concessive/hypothetical भाव व्यक्त करता है; आधुनिक हिन्दी में ‘चाहे’ इस वाक्य-संरचना में स्वाभाविक है।
- source_word: חָיָה
