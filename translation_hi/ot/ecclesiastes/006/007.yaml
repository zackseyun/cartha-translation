base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/007.yaml
  text: All a man's labor is for his mouth[a], yet even his appetite is not filled.
translation:
  language: hi
  text: मनुष्य का सारा परिश्रम उसके मुँह के लिए होता है, फिर भी उसकी भूख नहीं मिटती[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर भी उसका प्राण नहीं भरता।” यहाँ “भूख” के लिए आया हिब्रू शब्द प्राण, जीवन या इच्छा का अर्थ भी दे सकता है; “नहीं मिटती” का शाब्दिक अर्थ “नहीं भरती” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: सारा
  rationale: यह परिमाण की समग्रता बताता है; ‘सारा परिश्रम’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: עֲמַל
  choice: परिश्रम
  rationale: सभोपदेशक में यह शब्द श्रमसाध्य और बोझिल मानवीय प्रयास का भाव रखता है; ‘परिश्रम’ उसे सामान्य ‘काम’ से बेहतर व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य का
  rationale: यहाँ אָדָם किसी विशेष पुरुष का नहीं, बल्कि प्रतिनिधिक रूप से सामान्य मानव का बोध कराता है। ‘मनुष्य’ हिन्दी में इस नीतिवचन-सदृश कथन की व्यापकता बनाए रखता है।
- source_word: לְפִיהוּ
  choice: उसके मुँह के लिए
  rationale: मूल का ठोस चित्र शाब्दिक रूप से सुरक्षित रखा गया है; आशय भोजन या जीवन-निर्वाह से है, पर उसे मुख्य पाठ में व्याख्यायित नहीं किया गया।
- source_word: וְגַם
  choice: फिर भी
  rationale: 'संदर्भ में संयोजक और योगसूचक कण विडंबनापूर्ण विरोध उत्पन्न करते हैं: मुँह के लिए इतना परिश्रम होने पर भी चाह तृप्त नहीं होती।'
- source_word: הַנֶּפֶשׁ
  choice: भूख
  rationale: मुँह, खाने और भरने के निकट संदर्भ में נֶפֶשׁ इच्छा या भूख को दर्शाता है। ‘भूख’ स्वाभाविक हिन्दी में इस संदर्भगत अर्थ को व्यक्त करती है, जबकि व्यापक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לֹא תִמָּלֵא
  choice: नहीं मिटती
  rationale: हिब्रू का शाब्दिक अर्थ ‘नहीं भरती’ है। हिन्दी में भूख के साथ ‘नहीं मिटती’ अधिक स्वाभाविक है और निरंतर अतृप्ति का भाव स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सामान्य कथन में אָדָם का अनुवाद
  choice: मनुष्य का
  alternative: आदमी का; मानव का
  rationale: वचन समस्त मानव-अनुभव के विषय में नीतिवचन-सदृश कथन करता है। ‘मनुष्य’ हिब्रू के एकवचन और प्रतिनिधिक व्यापकता दोनों को बनाए रखता है, बिना इसे केवल पुरुषों तक सीमित किए।
- issue: भूख और प्राण/जीवन के अर्थक्षेत्र वाले נֶפֶשׁ का अनुवाद
  choice: भूख
  alternative: प्राण; इच्छा; मन
  rationale: यहाँ ‘मुँह’ और ‘भरने’ की भाषा नֶפֶשׁ के इच्छा अथवा भूख वाले अर्थ को प्रमुख बनाती है। फिर भी यह शब्द केवल शारीरिक भूख से व्यापक हो सकता है; इसलिए वैकल्पिक ‘प्राण’ और शाब्दिक ‘नहीं भरता’ को पादटिप्पणी में रखा गया है, ताकि मूल की अर्थगत व्यापकता न खोए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और नीतिवचन-सदृश वाक्य रखा गया है। ‘मुँह’ की ठोस मूल-छवि सुरक्षित है; ‘भूख नहीं मिटती’ हिन्दी की स्वाभाविक अभिव्यक्ति है, जबकि נֶפֶשׁ और מלא की व्यापक तथा अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
