id: ECC.6.3
reference: Ecclesiastes 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם יוֹלִ֣יד אִ֣ישׁ מֵאָ֡ה וְ/שָׁנִים֩ רַבּ֨וֹת יִֽחְיֶ֜ה וְ/רַ֣ב שֶׁ/יִּהְי֣וּ יְמֵֽי שָׁנָ֗י/ו וְ/נַפְשׁ/וֹ֙ לֹא תִשְׂבַּ֣ע מִן הַ/טּוֹבָ֔ה וְ/גַם קְבוּרָ֖ה לֹא הָ֣יְתָה לּ֑/וֹ אָמַ֕רְתִּי ט֥וֹב מִמֶּ֖/נּוּ הַ/נָּֽפֶל־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/006/003.yaml
  text: If a man fathers a hundred children and lives many years[a], however many the days of his years may be, but his soul is not satisfied with good, and he does not even have burial[c][b], I say that the stillborn child is better off than he.
translation:
  language: hi
  text: यदि कोई पुरुष सौ बच्चों का पिता बने और बहुत वर्षों तक जीवित रहे—उसके जीवन के दिन चाहे कितने ही अधिक हों—फिर भी उसका मन अच्छी वस्तुओं से तृप्त न हो,[a] और उसे दफ़नाया तक न जाए, तो मैं कहता हूँ[b] कि उससे मृत-जन्मा बच्चा[c] अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका नेफ़ेश अच्छी वस्तुओं से तृप्त न हो।” नेफ़ेश का अर्थ यहाँ “मन,” “स्वयं,” “प्राण” या “लालसा” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने कहा।”
    reason: lexical_alternative
  - marker: c
    text: या, “गर्भपात” अथवा “असमय जन्म।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह एक काल्पनिक परिस्थिति प्रस्तुत करता है; ‘यदि’ उसके शर्तसूचक रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹלִיד אִישׁ מֵאָה
  choice: कोई पुरुष सौ बच्चों का पिता बने
  rationale: हिफ़ील रूप संतान उत्पन्न करने का भाव रखता है। ‘पिता बने’ आधुनिक हिन्दी में स्पष्ट है और पुरुषवाचक स्रोत-रूप को बनाए रखता है।
- source_word: וְשָׁנִים רַבּוֹת יִחְיֶה
  choice: बहुत वर्षों तक जीवित रहे
  rationale: यह दीर्घायु को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרַב שֶׁיִּהְיוּ יְמֵי שָׁנָיו
  choice: उसके जीवन के दिन चाहे कितने ही अधिक हों
  rationale: यह पिछले कथन को बल देने वाले स्रोत के पुनरुक्त और रियायती भाव को सुरक्षित रखता है।
- source_word: וְנַפְשׁוֹ
  choice: उसका मन
  rationale: נפשׁ यहाँ व्यक्ति की भीतरी चाह या अनुभवशील स्व को सूचित करता है। ‘मन’ साधारण हिन्दी में स्वाभाविक है; शाब्दिक ‘प्राण’ इस संदर्भ में असहज और ‘आत्मा’ अनावश्यक रूप से तकनीकी हो सकता है।
- source_word: לֹא תִשְׂבַּע מִן הַטּוֹבָה
  choice: अच्छी वस्तुओं से तृप्त न हो
  rationale: ‘तृप्त’ שבע के भर जाने या संतुष्ट होने के भाव को रखता है; ‘अच्छी वस्तुएँ’ जीवन की सुखद और लाभकारी बातों के व्यापक अर्थ को व्यक्त करती हैं।
- source_word: וְגַם קְבוּרָה לֹא הָיְתָה לּוֹ
  choice: उसे दफ़नाया तक न जाए
  rationale: यह burial से वंचित रहने की अतिरिक्त दुर्दशा और גַם के ‘तक’ वाले बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָמַרְתִּי
  choice: मैं कहता हूँ
  rationale: यद्यपि रूप पूर्णकालिक है, यहाँ यह उपदेशक के वर्तमान मूल्यांकन को प्रस्तुत करने वाला कथन हो सकता है।
- source_word: טוֹב מִמֶּנּוּ
  choice: उससे ... अच्छा है
  rationale: तुलना नैतिक गुण की नहीं, अवस्था की है; हिन्दी में संदर्भ इसे स्पष्ट करता है।
- source_word: הַנָּפֶל
  choice: मरा हुआ जन्मा बच्चा
  rationale: यह गर्भपात या मृत-जन्मे शिशु को सूचित करता है। चुना हुआ रूप साधारण पाठक के लिए ठोस और स्पष्ट है, जबकि विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: मुख्य पाठ में ‘मन’
  alternative: ‘प्राण’, ‘आत्मा’, या ‘उसकी लालसा’
  rationale: यहाँ कोई व्यवस्थित आत्मा-सिद्धान्त नहीं सिखाया जा रहा; शब्द व्यक्ति की भीतरी तृप्ति या चाह को दर्शाता है। ‘मन’ अर्थ को सहज रखता है, और व्यापक शब्दार्थ पादटिप्पणी में सुरक्षित है।
- issue: प्रतिनिधिक पुरुषवाचक भाषा
  choice: ‘कोई पुरुष’
  alternative: ‘कोई व्यक्ति’
  rationale: मूल में אִישׁ स्पष्ट रूप से पुरुषवाचक एकवचन है; इसे बनाए रखने से काल्पनिक उदाहरण का स्रोत-रूप सुरक्षित रहता है।
- issue: אָמַרְתִּי का कालगत मूल्य
  choice: ‘मैं कहता हूँ’
  alternative: ‘मैंने कहा’
  rationale: इब्रानी पूर्ण रूप भूतकालीन कथन या वर्तमान विमर्श-सूत्र, दोनों प्रकार समझा जा सकता है; मुख्य पाठ में संदर्भानुकूल वर्तमान रखा गया और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। स्रोत की काल्पनिक संरचना, दीर्घायु की पुनरुक्ति, अतृप्ति, दफ़न से वंचित होने की लज्जा और मृत-जन्मे बच्चे के साथ कठोर तुलना सुरक्षित रखी गई है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
