  text: וְ/יָשֹׁ֧ב הֶ/עָפָ֛ר עַל הָ/אָ֖רֶץ כְּ/שֶׁ/הָיָ֑ה וְ/הָ/ר֣וּחַ תָּשׁ֔וּב אֶל הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר נְתָנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/007.yaml
  text: and the dust returns to the earth as it was[a], and the spirit returns to God who gave it.
translation:
  language: hi
  text: और धूल धरती पर लौट जाती है, जैसी वह पहले थी, और आत्मा[a] उस परमेश्वर के पास लौट जाती है जिसने उसे दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘श्वास’। इब्रानी רוּחַ का अर्थ ‘आत्मा’, ‘श्वास’ या ‘वायु’ हो सकता है। यहाँ मृत्यु के संदर्भ में ‘आत्मा’ उपयुक्त प्रतीत होता है, फिर भी ‘श्वास’ एक संभव अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: और ... लौट जाती है
  rationale: शׁוב के क़ाल अपूर्ण रूप को यहाँ मृत्यु के अनिवार्य परिणाम को सजीव, सामान्य सत्य के रूप में व्यक्त करने वाला माना गया है; वर्तमान काल हिंदी में स्वाभाविक है और וְ द्वारा जुड़ा क्रम भी बना रहता है।
- source_word: הֶעָפָר
  choice: धूल
  rationale: यह मानव शरीर के भौतिक तत्व को सूचित करता है और सृष्टि तथा नश्वरता की भाषा की प्रतिध्वनि है। हिंदी में इस संदर्भ में बिना अतिरिक्त निर्धारक के ‘धूल’ स्वाभाविक है।
- source_word: עַל הָאָרֶץ
  choice: धरती में
  rationale: यद्यपि עַל का मूल अर्थ ‘पर’ है, שוב के साथ यह लौटने के गंतव्य को व्यक्त करता है। मृत्यु के संदर्भ में ‘धरती में लौटना’ स्वाभाविक हिंदी है और אֶרֶץ को ‘धरती’ के रूप में बनाए रखता है।
- source_word: כְּשֶׁהָיָה
  choice: जैसी थी, वैसी ही
  rationale: यह पूर्व अवस्था में लौटने का भाव सीधे और सहज हिंदी में व्यक्त करता है; स्त्रीलिंग रूप ‘धूल’ के अनुरूप है।
- source_word: וְהָרוּחַ
  choice: और आत्मा[a]
  rationale: רוּחַ के अर्थ ‘आत्मा’, ‘श्वास’ और ‘वायु’ हो सकते हैं। शरीर की धूल में वापसी के समानांतर और परमेश्वर द्वारा दिए जाने के उल्लेख के कारण मुख्य पाठ में ‘आत्मा’ उपयुक्त है; ‘श्वास’ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: תָּשׁוּב
  choice: लौट जाती है
  rationale: पहले खंड के שוב के समान अनुवाद से धूल और आत्मा के लौटने का काव्यात्मक समानांतर बना रहता है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर के पास
  rationale: אֶל गंतव्य की ओर गति बताता है। आधुनिक हिंदी में किसी व्यक्ति के पास लौटने के लिए ‘के पास’ स्वाभाविक है; הָאֱלֹהִים के लिए ‘परमेश्वर’ मानक और गरिमापूर्ण है।
- source_word: אֲשֶׁר נְתָנָהּ
  choice: उसे देनेवाले
  rationale: संबंधवाचक उपवाक्य परमेश्वर को आत्मा के दाता के रूप में पहचानता है। कृदंतीय हिंदी रचना संक्षिप्त, स्वाभाविक और मूल अर्थ के अनुरूप है; ‘उसे’ का संकेत आत्मा की ओर है।
theological_decisions:
- issue: मानव मृत्यु के संबंध में רוּחַ का अर्थ
  choice: आत्मा
  alternative: श्वास
  rationale: पद धूल में लौटने वाले शारीरिक तत्व और परमेश्वर के पास लौटने वाले जीवन-तत्व के बीच समानांतर अंतर रखता है। ‘आत्मा’ इस अंतर को सुरक्षित रखती है, पर मानव-स्वरूप के विषय में पाठ से अधिक परिभाषा नहीं जोड़ती। רוּחַ की ‘श्वास’ अर्थ-संभावना पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी की सहज, गरिमापूर्ण काव्यात्मक गद्य-शैली अपनाई गई है। दोनों खंडों में ‘लौट जाती है’ दोहराकर मूल का समानांतर रखा गया है। ‘जैसी थी, वैसी ही’ सामान्य पाठक के लिए स्पष्ट है, और ‘उसे देनेवाले परमेश्वर’ संबंधवाचक वाक्य को बिना अर्थ-वृद्धि के संक्षिप्त बनाता है।
