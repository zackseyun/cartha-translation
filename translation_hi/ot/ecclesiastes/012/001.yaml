id: ECC.12.1
reference: Ecclesiastes 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/זְכֹר֙ אֶת בּ֣וֹרְאֶ֔י/ךָ בִּ/ימֵ֖י בְּחוּרֹתֶ֑י/ךָ עַ֣ד אֲשֶׁ֤ר לֹא יָבֹ֨אוּ֙ יְמֵ֣י הָֽ/רָעָ֔ה וְ/הִגִּ֣יעוּ שָׁנִ֔ים אֲשֶׁ֣ר תֹּאמַ֔ר אֵֽין לִ֥/י בָ/הֶ֖ם חֵֽפֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/001.yaml
  text: And remember your Creator in the days of your youth[a], before the evil days come and the years arrive of which you will say, “I have no pleasure in them.”
translation:
  language: hi
  text: और अपनी जवानी के दिनों में अपने सृष्टिकर्ता[a] को याद रख, इससे पहले कि बुरे दिन आएँ और वे वर्ष आ पहुँचें जिनके विषय में तू कहेगा, “इनमें मुझे कोई आनंद नहीं मिलता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “अपने सृष्टिकर्ता” के लिए प्रयुक्त शब्द का रूप बहुवचन है—शाब्दिक रूप से “अपने सृष्टिकर्ताओं”; पर इस संदर्भ में यह परमेश्वर के लिए एकवचन उपाधि, “अपने सृष्टिकर्ता,” के अर्थ में प्रयुक्त है।
    reason: मूल हिब्रू की उल्लेखनीय वचन-संबंधी विशेषता और संभावित शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וּזְכֹר
  choice: और ... याद रख
  rationale: זכר का काल आज्ञार्थक एकवचन है; आरंभिक וְ को पिछले प्रसंग से प्रवाह बनाए रखने के लिए “और” से व्यक्त किया गया है।
- source_word: אֶת בּוֹרְאֶיךָ
  choice: अपने सृष्टिकर्ता को
  rationale: रूप व्याकरणतः बहुवचन है, पर इस एकेश्वरवादी ज्ञान-साहित्यिक संदर्भ में अभिप्रेत व्यक्ति एक परमेश्वर है। हिंदी में एकवचन अर्थ स्पष्ट करता है; असामान्य रूप को पादटिप्पणी में रखा गया है।
- source_word: בִּימֵי בְּחוּרֹתֶיךָ
  choice: अपनी जवानी के दिनों में
  rationale: यह पदबंध युवा अवस्था और उसके उत्साहपूर्ण काल को दर्शाता है; चयन हिब्रू के कालगत बिंब को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: עַד אֲשֶׁר לֹא יָבֹאוּ
  choice: इससे पहले कि ... आएँ
  rationale: यहाँ पदबंध आने वाली अप्रिय अवस्था से पहले की समय-सीमा बताता है; शाब्दिक “जब तक न” की तुलना में यह हिंदी में आशय अधिक स्वाभाविक ढंग से देता है।
- source_word: יְמֵי הָרָעָה
  choice: बुरे दिन
  rationale: רָעָה यहाँ अगले पदों में वर्णित वृद्धावस्था की विपत्ति, कष्ट और दुःख का संकेत देती है। “बुरे दिन” मूल की संक्षिप्तता और गंभीर स्वर बनाए रखता है।
- source_word: וְהִגִּיעוּ שָׁנִים
  choice: और वे वर्ष आ पहुँचें
  rationale: हिफ़ील क्रिया पहुँचने या आ लगने का भाव देती है; “आ पहुँचें” वर्षों के व्यक्ति पर आ जाने की सजीवता को सुरक्षित रखता है।
- source_word: אֲשֶׁר תֹּאמַר
  choice: जिनके विषय में तू कहेगा
  rationale: संबंधवाचक उपवाक्य “वर्षों” को विशेषित करता है; यह अनुवाद संबंध को स्पष्ट रखते हुए भविष्यकाल भी सुरक्षित रखता है।
- source_word: אֵין לִי בָהֶם חֵפֶץ
  choice: इनमें मुझे कोई आनंद नहीं मिलता
  rationale: חֵפֶץ आनंद, प्रसन्नता या रुचि को व्यक्त करता है। चयन वर्तमान हिंदी में स्वाभाविक है और उन वर्षों के प्रति व्यक्तिगत अनुभव को बनाए रखता है।
theological_decisions:
- issue: 'בּוֹרְאֶיךָ का वचन: “तेरा सृष्टिकर्ता” या “तेरे सृष्टिकर्ता”'
  choice: 'एकवचन: “अपने सृष्टिकर्ता”'
  alternative: 'रूपानुसार बहुवचन: “अपने सृष्टिकर्ताओं”'
  rationale: हिब्रू शब्दरूप बहुवचन-जैसा है, किंतु संदर्भ में वह इस्राएल के एक परमेश्वर को संबोधित उपाधि के रूप में प्रयुक्त है। हिंदी में बहुवचन बहुदेववाद का अनपेक्षित संकेत दे सकता है, इसलिए मुख्य पाठ में एकवचन और पादटिप्पणी में रूपगत विशेषता दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सरल स्तर रखा गया है। मूल संबोधन एकवचन पुरुष से है, इसलिए “तू/अपने/कहेगा” की संगति रखी गई है। “जवानी के दिनों,” “बुरे दिन,” और “वर्ष आ पहुँचें” द्वारा हिब्रू की समयगत एवं काव्यात्मक छवियाँ सुरक्षित हैं।
