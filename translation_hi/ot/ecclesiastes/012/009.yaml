reference: Ecclesiastes 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֹתֵ֕ר שֶׁ/הָיָ֥ה קֹהֶ֖לֶת חָכָ֑ם ע֗וֹד לִמַּד דַּ֨עַת֙ אֶת הָ/עָ֔ם וְ/אִזֵּ֣ן וְ/חִקֵּ֔ר תִּקֵּ֖ן מְשָׁלִ֥ים הַרְבֵּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/009.yaml
  text: And beyond that[a], because Qoheleth was wise, he still taught the people knowledge; he also weighed, searched out, and arranged many proverbs.
translation:
  language: hi
  text: और इसके अतिरिक्त[a], क्योंकि कोहेलेत बुद्धिमान था, उसने लोगों को ज्ञान भी सिखाया; उसने बहुत-से नीतिवचनों को ध्यान से परखा, उनकी छानबीन की और उन्हें क्रमबद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इतना ही नहीं, कोहेलेत बुद्धिमान था और उसने लोगों को ज्ञान भी सिखाया; उसने बहुत-से नीतिवचनों पर विचार किया, उनकी छानबीन की और उन्हें क्रम में रखा।”
    reason: हिब्रू आरम्भिक वाक्यांश וְיֹתֵר और सम्बन्धसूचक שֶׁ की वाक्यगत भूमिका, तथा וְאִזֵּן के अर्थ में कुछ लचीलापन है। यह विकल्प अतिरिक्त कथन और विचार के भाव को सामने रखता है।
lexical_decisions:
- source_word: וְיֹתֵר
  choice: और इसके अतिरिक्त
  rationale: यह पद पिछले कथन में एक और निष्कर्ष या प्रशंसा जोड़ता है। ‘और इसके अतिरिक्त’ संयोजक बल और आगे कुछ जोड़ने का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שֶׁהָיָה
  choice: क्योंकि ... था
  rationale: שֶׁ सम्बन्ध या कारण दोनों व्यक्त कर सकता है। यहाँ कोहेलेत की बुद्धिमानी को उसके शिक्षण और साहित्यिक परिश्रम का आधार समझना सन्दर्भानुकूल है; वैकल्पिक संरचना पादटिप्पणी में रखी गई है।
- source_word: קֹהֶלֶת
  choice: कोहेलेत
  rationale: यह पुस्तक में व्यक्ति-सदृश विशिष्ट पदनाम के रूप में आता है। लिप्यंतरण ‘कोहेलेत’ इसके हिब्रू रूप को बनाए रखता है और ‘उपदेशक’ या ‘शिक्षक’ जैसे किसी एक अर्थ तक इसे सीमित नहीं करता।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विधेय विशेषण का सीधा, प्रतिष्ठित और सहज हिन्दी रूप है।
- source_word: עוֹד
  choice: भी ... रहा
  rationale: यह अतिरिक्त अथवा जारी कार्य का भाव देता है। ‘भी सिखाता रहा’ कोहेलेत के बुद्धिमान होने के अतिरिक्त उसके निरन्तर शिक्षण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִמַּד דַּעַת אֶת־הָעָם
  choice: लोगों को ज्ञान ... सिखाता रहा
  rationale: यह למד और דעת को क्रमशः ‘सिखाना’ और ‘ज्ञान’ के रूप में रखता है तथा חָכָם के ‘बुद्धिमान’ से शब्दार्थ का भेद बनाए रखता है।
- source_word: וְאִזֵּן
  choice: ध्यान से परखा
  rationale: दुर्लभ क्रिया में तौलने, विचारने या मूल्यांकन करने का भाव है। शाब्दिक ‘तौला’ हिन्दी में नीतिवचनों के साथ असहज हो सकता है; ‘ध्यान से परखा’ रूपक के मूल्यांकन-भाव को स्पष्ट रखता है।
- source_word: וְחִקֵּר
  choice: खोजबीन की
  rationale: यह सावधानी से जाँचने और खोजने की सक्रिय प्रक्रिया व्यक्त करता है।
- source_word: תִּקֵּן
  choice: क्रमबद्ध किया
  rationale: क्रिया का सीधा करना, व्यवस्थित करना या क्रम में रखना अर्थ यहाँ नीतिवचनों के संपादकीय विन्यास को दर्शाता है, बिना यह अनिवार्य ठहराए कि उसने उन सभी की रचना की।
- source_word: מְשָׁלִים הַרְבֵּה
  choice: बहुत-से नीतिवचन
  rationale: यह संख्या और संज्ञा का संक्षिप्त, स्पष्ट तथा प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: कोहेलेत को पदवी के अर्थ से अनूदित करना या विशिष्ट पदनाम मानकर लिप्यंतरित करना
  choice: कोहेलेत
  alternative: उपदेशक / शिक्षक
  rationale: हिब्रू शब्द की भूमिका और सटीक अर्थ पर मतभेद है। लिप्यंतरण उस अस्पष्टता को बनाए रखता है और किसी विशेष धार्मिक कार्य या सेवकाई का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण गद्य अपनाया गया है। ‘कोहेलेत’ को नाम-सदृश पदनाम मानकर रखा गया है; अन्य क्रियाएँ साधारण पाठक के लिए सहज रखते हुए हिब्रू की जाँच, खोज और व्यवस्था की त्रिक प्रक्रिया को सुरक्षित करती हैं।
