base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/011.yaml
  text: The words of the wise are like goads[a], and like firmly planted nails are the collected sayings[b]; they are given by one shepherd.
translation:
  language: hi
  text: बुद्धिमानों के वचन अंकुशों के समान हैं, और संकलनों के स्वामी मजबूती से गड़ी हुई कीलों के समान हैं[a]; वे एक चरवाहे की ओर से दिए गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध कठिन है। इसका अर्थ ‘संकलनों के स्वामी’ हो सकता है; इसे ‘सभाओं के अगुए’ या ‘संकलित उक्तियों के संकलक’ भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: ‘एक चरवाहा’ ज्ञान के अंतिम स्रोत के रूप में परमेश्वर की ओर संकेत कर सकता है, पर इस पद में चरवाहे की पहचान स्पष्ट नहीं की गई है।
    reason: theological_ambiguity
lexical_decisions:
- source_word: דִּבְרֵי חֲכָמִים
  choice: बुद्धिमानों की बातें
  rationale: यह पदबंध बुद्धिमान व्यक्तियों के वचनों या शिक्षाओं को सूचित करता है। ‘बातें’ व्यापक और सहज है तथा लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: כַּדָּרְבֹנוֹת
  choice: अंकुशों के समान
  rationale: דָּרְבֹן पशुओं को आगे बढ़ाने के लिए प्रयुक्त नुकीले उपकरण को दर्शाता है। ‘अंकुश’ हिन्दी में इस प्रेरक और चुभने वाले रूपक को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּכְמַשְׂמְרוֹת נְטוּעִים
  choice: मजबूती से गड़ी हुई कीलों के समान
  rationale: מַשְׂמְרוֹת कीलें या खूंटियाँ हो सकती हैं और נְטוּעִים का शाब्दिक भाव ‘रोपी हुई’ है। कीलों के संदर्भ में ‘मजबूती से गड़ी हुई’ रूपक का आशय स्पष्ट करते हुए उसके स्थिरता-बोध को बनाए रखता है।
- source_word: בַּעֲלֵי אֲסֻפּוֹת
  choice: संकलित वचन
  rationale: इब्रानी पदबंध कठिन है और शाब्दिक रूप से ‘संकलनों/सभाओं के स्वामी’ समझा जा सकता है। साहित्यिक संदर्भ में इसे संकलित ज्ञान-वचनों के रूप में प्रस्तुत करना स्वाभाविक है; वैकल्पिक विश्लेषण पादटिप्पणी में रखा गया है।
- source_word: נִתְּנוּ מֵרֹעֶה אֶחָד
  choice: वे एक ही चरवाहे की ओर से दिए गए हैं
  rationale: נִתְּנוּ का कर्मवाच्य भाव ‘दिए गए’ से और מִן का स्रोत-बोध ‘की ओर से’ से व्यक्त होता है। אֶחָד के लिए ‘एक ही’ साझा स्रोत पर बल को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: ‘एक ही चरवाहे’ की पहचान
  choice: मुख्य पाठ में पहचान अस्पष्ट रखी गई है
  alternative: इसे परमेश्वर, सभोपदेशक/सुलैमान, या ज्ञान-शिक्षा के किसी एकीकृत स्रोत का संकेत मानना
  rationale: पद स्वयं चरवाहे की पहचान स्पष्ट नहीं करता। इसलिए परमेश्वर का नाम जोड़ना या ‘चरवाहे’ को विशेष रूप से चिह्नित करना पाठ की वास्तविक धार्मिक अस्पष्टता को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘अंकुश’, ‘गड़ी हुई कीलें’ और ‘चरवाहा’ मूल के ठोस रूपकों को बनाए रखते हैं; कठिन בַּעֲלֵי אֲסֻפּוֹת का वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
