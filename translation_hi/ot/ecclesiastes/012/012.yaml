source:
  edition: WLC
  text: וְ/יֹתֵ֥ר מֵ/הֵ֖מָּה בְּנִ֣/י הִזָּהֵ֑ר עֲשׂ֨וֹת סְפָרִ֤ים הַרְבֵּה֙ אֵ֣ין קֵ֔ץ וְ/לַ֥הַג הַרְבֵּ֖ה יְגִעַ֥ת בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/012.yaml
  text: 'And beyond these[a], my son, be warned: of making many books there is no end, and much study is a weariness of the flesh.'
translation:
  language: hi
  text: 'और इनसे आगे, मेरे बेटे, सावधान रहना: बहुत-सी पुस्तकें रचने का कोई अन्त नहीं, और बहुत अध्ययन[a] शरीर को थका देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत पढ़ना’ अथवा ‘बहुत तल्लीन रहना’; यहाँ ‘अध्ययन’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका अर्थ पुस्तकों या शब्दों में डूबे रहने से अधिक व्यापक रूप से जुड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹתֵר מֵהֵמָּה
  choice: और इनसे आगे
  rationale: यह पद पिछले कथनों से जुड़ते हुए उनसे आगे जाने के विषय में चेतावनी देता है। यह अनुवाद तुलनात्मक भाव और सम्बन्ध—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: इब्रानी में शाब्दिक अर्थ ‘मेरे बेटे’ है और यहाँ यह पिता-सदृश सम्बोधन के रूप में प्रयुक्त हुआ है।
- source_word: הִזָּהֵר
  choice: सावधान रहना
  rationale: निफ़अल आज्ञार्थक रूप आत्म-सावधानी या चेतावनी ग्रहण करने का भाव देता है। ‘सावधान रहना’ आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाली चेतावनी से सुचारु रूप से जुड़ता है।
- source_word: עֲשׂוֹת סְפָרִים הַרְבֵּה
  choice: बहुत-सी पुस्तकें रचने
  rationale: ‘रचने’ में पुस्तकों को तैयार करने, संकलित करने या लिखने का व्यापक भाव है और यह ‘लिखने’ की अपेक्षा स्रोत के עֲשׂוֹת को कम संकुचित करता है।
- source_word: אֵין קֵץ
  choice: कोई अन्त नहीं
  rationale: यह इब्रानी अस्तित्व-निषेध और ‘अन्त’ के लिए सटीक तथा प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: וְלַהַג הַרְבֵּה
  choice: और बहुत अध्ययन[a]
  rationale: לַהַג एक दुर्लभ और अर्थ की दृष्टि से अनिश्चित शब्द है। पुस्तकों के निकट सन्दर्भ में ‘अध्ययन’ सबसे सहज मुख्य-पाठ विकल्प है; अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित रखी गई हैं।
- source_word: יְגִעַת בָּשָׂר
  choice: शरीर को थका देता है
  rationale: यह पदबंध शारीरिक श्रान्ति बताता है। यह हिन्दी रूप अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, जबकि בָּשָׂר के शारीरिक आशय को ‘शरीर’ से बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की उपदेशात्मक ध्वनि बनाए रखने के लिए ‘मेरे बेटे, सावधान रहना’ रखा गया है; दुर्लभ इब्रानी शब्द לַהַג की अनिश्चितता को मुख्य पाठ में कृत्रिम रूप से निश्चित करने के बजाय पाद-टिप्पणी में स्पष्ट किया गया है।
