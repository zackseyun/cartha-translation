lexical_decisions:
- source_word: הֲבֵל הֲבָלִים
  choice: भाप-ही-भाप
  rationale: यह इब्रानी की ठोस छवि और उसकी तीव्रतासूचक रचना को बनाए रखता है। ‘भाप’ किसी ऐसी वस्तु का बोध कराती है जो क्षणिक, पकड़ से बाहर और ठहरनेवाली नहीं है; इस प्रकार अर्थ को केवल ‘व्यर्थता’ तक सीमित नहीं किया गया।
- source_word: אָמַר
  choice: कहता है
  rationale: यहाँ कथन पुस्तक के निष्कर्ष में दोहराए गए सूत्र या जीवंत सार्वकालिक घोषणा के रूप में आता है; इसलिए वर्तमान काल स्वाभाविक है।
- source_word: הַקּוֹהֶלֶת
  choice: उपदेशक
  rationale: यह पदवी सभा को संबोधित करके शिक्षा देनेवाले व्यक्ति की भूमिका बताती है। ‘उपदेशक’ आधुनिक हिन्दी में स्पष्ट है और केवल लिप्यंतरण करने से अधिक अर्थ देता है।
- source_word: הַכֹּל
  choice: सब कुछ
  rationale: यह पूर्ण समष्टि को व्यक्त करनेवाला स्वाभाविक आधुनिक हिन्दी पद है।
- source_word: הָבֶל
  choice: भाप
  rationale: मुख्य इब्रानी शब्द की वही ठोस और बहुअर्थी छवि दोहराई गई है, जिससे क्षणभंगुरता, अस्थिरता और पकड़ में न आने का भाव बना रहता है।
theological_decisions:
- issue: सभोपदेशक में मुख्य शब्द הבל का अनुवाद
  choice: भाप
  alternative: व्यर्थता; निष्फलता; साँस
  rationale: ‘भाप’ मूल रूपक को बनाए रखती है और पाठ के अर्थ को किसी एक अमूर्त निष्कर्ष में नहीं बाँधती। इससे क्षणभंगुरता, सारहीनता और दुर्बोधता के बीच का साहित्यिक तथा धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘भाप-ही-भाप’ हिन्दी में तीव्रता को स्वाभाविक ढंग से व्यक्त करते हुए इब्रानी रूपक को सामने रखता है; पदवी के लिए परिचित ‘उपदेशक’ चुना गया है।
