id: ECC.12.14
reference: Ecclesiastes 12:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י אֶת כָּל מַֽעֲשֶׂ֔ה הָ/אֱלֹהִ֛ים יָבִ֥א בְ/מִשְׁפָּ֖ט עַ֣ל כָּל נֶעְלָ֑ם אִם ט֖וֹב וְ/אִם רָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/014.yaml
  text: For God will bring every deed into judgment[a], with every hidden thing, whether good or evil.
translation:
  language: hi
  text: क्योंकि परमेश्वर हर काम को न्याय के सामने लाएगा[a]—हर छिपी हुई बात को भी, चाहे वह अच्छी हो या बुरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर छिपी हुई बात के विषय में”; अथवा, “हर गुप्त बात के संबंध में।”
    reason: עַל כָּל נֶעְלָם में पूर्वसर्ग עַל कामों के साथ छिपी बातों के समावेश को या उनके विषय में न्याय किए जाने को व्यक्त कर सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के उपदेश का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת כָּל מַעֲשֶׂה
  choice: हर काम
  rationale: כָּל के वितरणात्मक अर्थ को ‘हर’ व्यक्त करता है। ‘काम’ सामान्य पाठक के लिए स्वाभाविक है और यहाँ नैतिक रूप से जाँचे जाने वाले प्रत्येक कर्म को समेटता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: इब्रानी के निश्चित रूप को हिन्दी में प्रचलित, गरिमापूर्ण एकेश्वरवादी संबोधन ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: יָבִא בְמִשְׁפָּט
  choice: न्याय के सामने लाएगा
  rationale: בוא के हिफ़ील रूप और בְמִשְׁפָּט के न्यायिक भाव को मिलाकर यह वाक्य किसी काम को दैवी न्यायिक जाँच के अधीन लाने का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: עַל כָּל נֶעְלָם
  choice: हर छिपी हुई बात को भी
  rationale: נֶעְלָם का व्यापक अर्थ ‘जो छिपा हुआ है’ रखा गया है, उसे केवल मन के रहस्य तक सीमित नहीं किया गया। עַל का सटीक संबंध संदिग्ध है; मुख्य पाठ में ‘भी’ समावेशी अर्थ को सहज रूप से व्यक्त करता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: אִם טוֹב וְאִם רָע
  choice: चाहे वह अच्छी हो या बुरी
  rationale: यह इब्रानी मुहावरा नैतिक क्षेत्र की पूर्ण व्यापकता बताता है; हिन्दी में लिंग-सामंजस्य ‘बात’ के अनुसार रखा गया है।
theological_decisions:
- issue: दैवी न्याय का समय और स्वरूप
  choice: पद को व्यापक दैवी न्याय के कथन के रूप में रखा गया है, उसके समय या प्रक्रिया को निश्चित किए बिना।
  alternative: इसे केवल अंतिम न्याय, अथवा इतिहास के भीतर के दैवी न्याय और अंतिम न्याय—दोनों—का स्पष्ट उल्लेख मानना।
  rationale: इब्रानी पाठ हर काम और छिपी बात के न्याय की व्यापकता कहता है, पर यह स्पष्ट नहीं करता कि यहाँ केवल अंतकालीन न्याय अभिप्रेत है या ऐतिहासिक न्याय भी। अनुवाद इस तनाव को खुला रखता है।
- issue: עַל כָּל נֶעְלָם का संबंध
  choice: हर छिपी हुई बात को भी न्याय के दायरे में सम्मिलित माना गया है।
  alternative: ‘हर छिपी हुई बात के विषय में’ या ‘हर गुप्त बात के संबंध में’ समझना।
  rationale: पूर्वसर्ग עַל यहाँ संबंध अथवा समावेश—दोनों तरह समझा जा सकता है। मुख्य पाठ सहज समावेशी अर्थ देता है और पादटिप्पणी वास्तविक भाषिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘हर काम’ और ‘छिपी हुई बात’ सामान्य पाठक के लिए सहज हैं, जबकि ‘न्याय के सामने लाएगा’ मूल की न्यायिक छवि बनाए रखता है।
