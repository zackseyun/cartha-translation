id: ECC.12.13
reference: Ecclesiastes 12:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ס֥וֹף דָּבָ֖ר הַ/כֹּ֣ל נִשְׁמָ֑ע אֶת הָ/אֱלֹהִ֤ים יְרָא֙ וְ/אֶת מִצְוֺתָ֣י/ו שְׁמ֔וֹר כִּי זֶ֖ה כָּל הָ/אָדָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/013.yaml
  text: 'The end of the matter, when all has been heard: fear God and keep his commandments, for this is the whole of man.[a]'
translation:
  language: hi
  text: 'सारी बात सुन ली गई; निष्कर्ष यह है: परमेश्वर का भय मान और उसकी आज्ञाओं का पालन कर, क्योंकि मनुष्य के लिए यही सब कुछ है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि यही समूचा मनुष्य है।” इसका अर्थ “यही मनुष्य के जीवन का सार है,” “यही मनुष्य का पूरा कर्तव्य है,” या “यह हर मनुष्य पर लागू होता है” भी समझा जा सकता है।
    reason: כָּל־הָאָדָם की संक्षिप्त हिब्रू अभिव्यक्ति में वास्तविक अर्थगत अस्पष्टता है, जिसे केवल एक व्याख्या चुनकर मिटाना उचित नहीं होगा।
lexical_decisions:
- source_word: סוֹף דָּבָר
  choice: निष्कर्ष यह है
  rationale: शाब्दिक अर्थ ‘बात का अंत’ है; यहाँ यह पूरे विचार-विमर्श के अंतिम निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְרָא
  choice: भय मान
  rationale: मूल शब्द श्रद्धा, विस्मय और उत्तरदायी भय का भाव रखता है; ‘भय मान’ बाइबलीय अभिव्यक्ति और उसके नैतिक भार को बनाए रखता है।
- source_word: מִצְוֺתָיו שְׁמוֹר
  choice: उसकी आज्ञाओं का पालन कर
  rationale: שמר का मूल भाव ‘रखना/सावधानी से मानना’ है; आज्ञाओं के संदर्भ में ‘पालन कर’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: כָּל־הָאָדָם
  choice: मनुष्य के लिए यही सब कुछ है
  rationale: हिब्रू पदबंध अत्यंत संक्षिप्त और अर्थ की दृष्टि से खुला है। यह चयन ‘मनुष्य का समूचा कर्तव्य’ जोड़ने से बचता है और मनुष्य के संपूर्ण जीवन/अस्तित्व से उसके संबंध को व्यक्त करता है।
theological_decisions:
- issue: כִּי זֶה כָּל־הָאָדָם का आशय
  choice: क्योंकि मनुष्य के लिए यही सब कुछ है
  alternative: क्योंकि यही हर मनुष्य का पूरा कर्तव्य है / क्योंकि यह सब मनुष्यों पर लागू होता है
  rationale: मूल पाठ में ‘कर्तव्य’ के लिए कोई स्पष्ट संज्ञा नहीं है। मुख्य पाठ उस शब्द को जोड़कर अर्थ सीमित नहीं करता; पादटिप्पणी प्रमुख वैकल्पिक समझों को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। एकवचन हिब्रू आज्ञार्थों के अनुरूप ‘मान’ और ‘कर’ प्रयुक्त हैं; भाषा सामान्य पाठक के लिए सहज है, पर मूल की गंभीरता बनाए रखती है।
