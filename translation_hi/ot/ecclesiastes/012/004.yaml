base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/004.yaml
  text: and the doors on the street are shut when the sound of the grinding is low[a], and one rises at the sound of a bird[c][b], and all the daughters of song are brought low.
translation:
  language: hi
  text: और सड़क की तरफ़ के द्वार बंद हो जाते हैं, जब पीसने की आवाज़ धीमी पड़ जाती है[a]; पक्षी की आवाज़ से वह उठ जाता है, और गीत की सभी बेटियाँ झुक जाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दो द्वार।” बहुत-से व्याख्याकार इस काव्य में ‘द्वारों’ को होंठ या मुँह का रूपक मानते हैं। “पीसने की आवाज़ धीमी पड़ जाती है” का अनुवाद “चक्की की आवाज़ मंद हो जाती है” भी किया जा सकता है; इसे दाँत कम हो जाने के कारण चबाने की क्षमता घटने का चित्र भी समझा जाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “गीत की सभी बेटियाँ झुक जाती हैं।” इसका संकेत गायिकाओं, गाने की क्षमता, स्वर, या गीत से जुड़ी ध्वनियों की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסֻגְּרוּ
  choice: बंद हो जाते हैं
  rationale: सगर का निष्पन्न निष्क्रिय भाव व्यक्त करता है और वृद्धावस्था के क्रमिक काव्यात्मक वर्णन में स्वाभाविक हिन्दी देता है।
- source_word: דְלָתַיִם בַּשּׁוּק
  choice: सड़क की ओर खुलनेवाले द्वार
  rationale: द्विवचन संज्ञा का प्रत्यक्ष बिंब 'द्वार' रखता है; בַּשּׁוּק को बाहरी सड़क की दिशा/स्थान से जोड़कर हिन्दी में संबंध स्पष्ट किया गया है, बिना इसे होंठ या मुँह मान लेने के।
- source_word: בִּשְׁפַל קוֹל הַטַּחֲנָה
  choice: जब चक्की पीसने की आवाज़ धीमी पड़ जाती है
  rationale: שְׁפַל की न्यूनता और טַחֲנָה की पीसने/चक्की की क्रिया दोनों को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: וְיָקוּם לְקוֹל הַצִּפּוֹר
  choice: पक्षी की आवाज़ सुनते ही वह उठ जाता है
  rationale: एकवचन पुल्लिंग क्रिया के कारण 'वह' रखा गया है; לְקוֹל को प्रसंगानुकूल 'आवाज़ सुनते ही' कहा गया है, जो हल्की ध्वनि पर जाग उठने का भाव देता है पर उसे स्पष्ट व्याख्या नहीं बनाता।
- source_word: וְיִשַּׁחוּ כָּל בְּנוֹת הַשִּׁיר
  choice: गीत की सभी बेटियाँ धीमी पड़ जाती हैं
  rationale: काव्यात्मक पद 'गीत की बेटियाँ' अक्षुण्ण है; שׁחח के नीचा/क्षीण होने के भाव को स्वर-संबंधी बिंब में स्वाभाविक 'धीमी पड़ जाती हैं' से व्यक्त किया गया है।
theological_decisions:
- issue: सभोपदेशक 12 में वृद्धावस्था के रूपक की व्याख्या
  choice: मुख्य पाठ में द्वार, चक्की, पक्षी और गीत की बेटियों के काव्यात्मक बिंब बनाए रखना
  alternative: द्वार को होंठ, पीसने को दाँतों से चबाना, और गीत की बेटियों को स्वर अथवा श्रवण-क्षमता के रूप में सीधे अनूदित करना
  rationale: समूचा अनुच्छेद वृद्धावस्था का चित्र माना जा सकता है, पर प्रत्येक बिंब का ठीक शारीरिक संदर्भ विवादित है। प्रत्यक्ष बिंब रखने से मूल की वास्तविक अस्पष्टता और काव्यात्मक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज काव्यात्मक गद्य। मूल बिंबों को अनावश्यक रूप से शारीरिक अर्थों में नहीं खोला गया है। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न क्रम से उपस्थित हैं।
