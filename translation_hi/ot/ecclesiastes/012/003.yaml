source:
  edition: WLC
  text: בַּ/יּ֗וֹם שֶׁ/יָּזֻ֨עוּ֙ שֹׁמְרֵ֣י הַ/בַּ֔יִת וְ/הִֽתְעַוְּת֖וּ אַנְשֵׁ֣י הֶ/חָ֑יִל וּ/בָטְל֤וּ הַ/טֹּֽחֲנוֹת֙ כִּ֣י מִעֵ֔טוּ וְ/חָשְׁכ֥וּ הָ/רֹא֖וֹת בָּ/אֲרֻבּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/003.yaml
  text: on the day when the keepers of the house tremble[a], and the men of strength are bent, and the grinders cease because they are few, and those looking through the windows grow dark[b],
translation:
  language: hi
  text: उस दिन, जब घर के रखवाले काँपेंगे[a], बलवान पुरुष झुक जाएँगे, पीसनेवालियाँ, क्योंकि वे कम हो गई हैं, पीसना बंद कर देंगी, और खिड़कियों से देखनेवालियों को धुँधला दिखाई देने लगेगा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह चित्र संभवतः वृद्धावस्था में शरीर के क्षीण होने का है: “घर के रखवाले” बाँहें या हाथ, “बलवान पुरुष” पैर, “पीसनेवालियाँ” दाँत और खिड़कियों से देखनेवालियाँ आँखें हो सकती हैं।'
    reason: alternative_reading
  - marker: b
    text: या “झरोखों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם
  choice: उस दिन, जब
  rationale: इब्रानी के काल-सूचक ढाँचे को बनाए रखते हुए हिन्दी में आगामी उपवाक्यों से स्वाभाविक रूप से जोड़ता है।
- source_word: יָזֻעוּ
  choice: काँपेंगे
  rationale: शारीरिक थरथराहट का सीधा और सहज हिन्दी रूप है तथा वृद्धावस्था के काव्यात्मक चित्र के अनुकूल है।
- source_word: שֹׁמְרֵי הַבַּיִת
  choice: घर के रखवाले
  rationale: रूपक को शरीर के किसी अंग के रूप में स्पष्ट किए बिना मूल घरेलू बिंब सुरक्षित रखता है।
- source_word: הִתְעַוְּתוּ
  choice: झुक जाएँगे
  rationale: टेढ़े या कुबड़े हो जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर रूपक को अनावश्यक रूप से नहीं खोलता।
- source_word: אַנְשֵׁי הֶחָיִל
  choice: बलवान पुरुष
  rationale: मूल के पुरुषवाची पद और बल पर उसके जोर, दोनों को संक्षिप्त तथा काव्यात्मक ढंग से रखता है।
- source_word: בָטְלוּ
  choice: काम करना छोड़ देंगी
  rationale: निष्क्रिय हो जाने या रुक जाने का आशय आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: הַטֹּחֲנוֹת
  choice: पीसनेवालियाँ
  rationale: मूल के स्त्रीलिंग बहुवचन और पीसने के घरेलू बिंब को सुरक्षित रखता है; मुख्य पाठ में इसे दाँत नहीं कहा गया।
- source_word: כִּי מִעֵטוּ
  choice: थोड़ी रह जाने के कारण
  rationale: संख्या घट जाने के कारण को स्वाभाविक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: חָשְׁכוּ הָרֹאוֹת
  choice: देखनेवालियों को धुँधला दिखाई देने लगेगा
  rationale: शाब्दिक ‘देखनेवालियाँ अँधेरी हो जाएँगी’ की अस्वाभाविकता से बचते हुए दृष्टि मंद पड़ने का भाव देता है और स्त्रीलिंग सहभागिता बनाए रखता है।
- source_word: בָּאֲרֻבּוֹת
  choice: खिड़कियों से
  rationale: आर-पार देखने के प्रसंग में सहज अर्थ देता है; ‘झरोखों’ की वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: शरीर-रूपी घर के रूपक को मुख्य पाठ में स्पष्ट करना या नहीं
  choice: घरेलू काव्य-बिंब को ज्यों का त्यों रखना
  alternative: रखवालों को हाथ/बाँहें, बलवान पुरुषों को पैर, पीसनेवालियों को दाँत और देखनेवालियों को आँखें कहना
  rationale: संदर्भ वृद्धावस्था की क्षीणता की ओर संकेत करता है, पर इब्रानी पाठ स्वयं प्रत्येक बिंब को किसी निश्चित अंग से नहीं जोड़ता; इसलिए वास्तविक व्याख्यात्मक अनिश्चितता सुरक्षित रखी गई है।
- issue: אַנְשֵׁי הֶחָיִל का लिंग-सूचक अनुवाद
  choice: बलवान पुरुष
  alternative: बलवान लोग
  rationale: मूल में पुरुषवाची मानवीय पद है; रूपकात्मक प्रयोग के बावजूद उसका लिंग-सूचक रूप बनाए रखना स्रोत के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। घरेलू रूपक को मुख्य पाठ में नहीं खोला गया। स्त्रीलिंग ‘पीसनेवालियाँ’ और ‘देखनेवालियाँ’ मूल के व्याकरणिक तथा चित्रात्मक संकेत को बनाए रखते हैं। पद के आगे जारी रहने के कारण अंत में अल्पविराम रखा गया है।
