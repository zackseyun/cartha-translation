  text: before the sun and the light and the moon and the stars grow dark[a], and the clouds return after the rain.
translation:
  language: hi
  text: इससे पहले कि सूर्य, प्रकाश, चन्द्रमा और तारे अँधेरे हो जाएँ[a], और वर्षा के बाद बादल फिर लौट आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इससे पहले कि सूर्य, दिन का उजाला, चन्द्रमा और तारे अँधियारे हो जाएँ।’
    reason: וְהָאוֹר का अर्थ ‘दिन का उजाला’ भी हो सकता है, और תֶחְשַׁךְ को ‘अँधियारे हो जाएँ’ के रूप में भी व्यक्त किया जा सकता है; यह वैकल्पिक शब्दार्थ और अभिव्यक्ति को सुरक्षित रखता है।
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: इससे पहले कि
  rationale: यह इब्रानी मुहावरा इस प्रसंग में उस समय के आने से पहले कुछ करने का संकेत देता है; आधुनिक हिन्दी में ‘इससे पहले कि’ स्वाभाविक है और पिछले पद से संबंध बनाए रखता है।
- source_word: תֶחְשַׁךְ
  choice: अँधेरे पड़ जाएँ
  rationale: क़ाल रूप यहाँ अँधेरा होने या ज्योति मंद पड़ने का भाव देता है। ‘अँधेरे पड़ जाएँ’ अकर्मक परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַשֶּׁמֶשׁ
  choice: सूर्य
  rationale: मूल शब्द का सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: וְהָאוֹר
  choice: प्रकाश
  rationale: אוֹר का व्यापक अर्थ ‘प्रकाश’ है। यह शब्द मूल की सरलता और काव्यात्मक क्रम को बनाए रखता है तथा इसे केवल दिन के उजाले तक सीमित नहीं करता।
- source_word: וְהַיָּרֵחַ
  choice: चन्द्रमा
  rationale: मूल शब्द का सीधा, आधुनिक मानक हिन्दी समतुल्य।
- source_word: וְהַכּוֹכָבִים
  choice: तारे
  rationale: मूल बहुवचन का सहज हिन्दी समतुल्य।
- source_word: וְשָׁבוּ
  choice: फिर लौट आएँ
  rationale: שׁוב का मूल भाव लौटना है। ‘फिर’ बादलों की पुनरावृत्ति और लगातार छाए रहने वाले संकटपूर्ण दृश्य को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: הֶעָבִים
  choice: बादल
  rationale: मूल शब्द का सीधा हिन्दी समतुल्य।
- source_word: אַחַר הַגָּשֶׁם
  choice: वर्षा के बाद
  rationale: सीधा पूर्वसर्गीय अनुवाद, जो वर्षा के बीतने पर बादलों के फिर लौटने की असामान्य और काव्यात्मक छवि को सुरक्षित रखता है।
theological_decisions:
- issue: ब्रह्मांडीय प्रकाश के अँधेरा पड़ने और वर्षा के बाद बादलों के लौटने की व्याख्यात्मक छवि
  choice: मुख्य पाठ में काव्यात्मक छवि को बिना व्याख्या के बनाए रखा गया है।
  alternative: इसे वृद्धावस्था और क्षीण होती इन्द्रियों का रूपक, जीवन के पतन का चित्र, या बार-बार आने वाली विपत्तियों का संकेत बताना।
  rationale: पद स्वयं चित्र प्रस्तुत करता है, उसकी व्याख्या निश्चित नहीं करता। इसलिए अनुवाद इसे वृद्धावस्था, न्याय या मानसिक अवसाद के किसी एक अर्थ तक सीमित नहीं करता और मूल की व्याख्यात्मक तथा धर्मवैचारिक तनावशीलता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण और काव्यात्मक रखी गई है। ‘सूर्य, प्रकाश, चन्द्रमा और तारे’ की सूची में मूल का संयोजन और लय सुरक्षित है; ‘फिर लौट आएँ’ पुनरावृत्ति की छवि को स्पष्ट करता है।
