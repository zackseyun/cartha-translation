source:
  edition: WLC
  text: עַ֣ד אֲשֶׁ֤ר לֹֽא ירחק חֶ֣בֶל הַ/כֶּ֔סֶף וְ/תָרֻ֖ץ גֻּלַּ֣ת הַ/זָּהָ֑ב וְ/תִשָּׁ֤בֶר כַּד֙ עַל הַ/מַּבּ֔וּעַ וְ/נָרֹ֥ץ הַ/גַּלְגַּ֖ל אֶל הַ/בּֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/006.yaml
  text: before the silver cord is snapped[a], and the golden bowl is shattered, and the jar is broken at the spring[d][c][b], and the wheel is crushed at the pit.
translation:
  language: hi
  text: इससे पहले कि चाँदी की डोरी टूट जाए[a], सोने का कटोरा चकनाचूर हो जाए, सोते पर घड़ा[b] टूट जाए, और पहिया[c] गड्ढे[d] में चूर-चूर हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अलग कर दी जाए,” “काट दी जाए,” अथवा परंपरागत रूप से “ढीली हो जाए”; यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ इस संदर्भ में कठिन है।
    reason: lexical_alternative
  - marker: b
    text: “घड़ा” के लिए “गागर” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: यह “पहिया” अधिक विशेष रूप से कुएँ की चरखी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: “गड्ढे” के स्थान पर “कुएँ” या “जलकुंड” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד אֲשֶׁר לֹא
  choice: इससे पहले कि
  rationale: यह पद पिछले आग्रह के साथ जुड़कर उस समय का परिचय देता है जब जीवन का अंत आ पहुँचता है; आधुनिक हिन्दी में यह मुहावरा उसके आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ירחק
  choice: टूट जाए
  rationale: इस कठिन क्रिया का सामान्य अर्थ इस संदर्भ में सहज नहीं बैठता। विनाश के समानांतर चित्रों के बीच ‘टूट जाए’ काव्यात्मक आशय को स्पष्ट रखता है, जबकि अन्य संभावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: חֶבֶל הַכֶּסֶף
  choice: चाँदी की डोरी
  rationale: यह संबंधवाचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप है और मूल बिंब को बनाए रखता है।
- source_word: וְתָרֻץ
  choice: चकनाचूर हो जाए
  rationale: רצץ जोर से तोड़ने या कुचलने का भाव देता है; नाजुक कटोरे के लिए ‘चकनाचूर’ सजीव और काव्यात्मक है।
- source_word: גֻּלַּת הַזָּהָב
  choice: सोने का कटोरा
  rationale: גֻּלָּה कटोरे या पात्र को, कभी दीपक के तेल-पात्र को, सूचित कर सकता है। ‘कटोरा’ कार्य को अनावश्यक रूप से निश्चित किए बिना दृश्य को सुरक्षित रखता है।
- source_word: וְתִשָּׁבֶר כַּד
  choice: घड़ा टूट जाए
  rationale: כַּד पानी भरने का घड़ा या गागर है; ‘घड़ा’ साधारण आधुनिक हिन्दी में स्पष्ट और संदर्भानुकूल है।
- source_word: עַל הַמַּבּוּעַ
  choice: सोते पर
  rationale: מַבּוּעַ जल के फूटने के स्थान, अर्थात सोते या झरने के स्रोत, को दर्शाता है। ‘सोता’ संक्षिप्त और सटीक है।
- source_word: וְנָרֹץ
  choice: चूर-चूर हो जाए
  rationale: यह भी רצץ से है और हिंसक टूटने का भाव रखता है। ‘चूर-चूर’ अर्थ को बनाए रखते हुए पिछली पंक्ति की हूबहू पुनरावृत्ति से बचाता है।
- source_word: הַגַּלְגַּל
  choice: पहिया
  rationale: मूल संज्ञा का व्यापक अर्थ ‘पहिया’ है; इस प्रसंग में कुएँ की चरखी होने की अधिक विशिष्ट संभावना पाद-टिप्पणी में रखी गई है।
- source_word: אֶל הַבּוֹר
  choice: गड्ढे के पास
  rationale: בּוֹר गड्ढा, जलकुंड या कुआँ हो सकता है। मुख्य पाठ व्यापक ‘गड्ढा’ रखता है और जल-संबंधी विकल्पों को पाद-टिप्पणी में सुरक्षित करता है; हिन्दी में ‘के पास’ दृश्य-संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: इस पद के बिंबों की व्याख्या
  choice: टूटी हुई डोरी, कटोरे, घड़े और पहिए के क्रम को मृत्यु की ओर संकेत करने वाले काव्यात्मक बिंबों के रूप में ज्यों का त्यों रखना
  alternative: हर वस्तु को वृद्ध होते मानव शरीर के किसी विशेष अंग से जोड़कर अनुवाद करना
  rationale: समग्र चित्र जीवन के अंत की ओर संकेत करता है, पर प्रत्येक वस्तु शरीर के किस अंग को दर्शाती है, इस पर सहमति नहीं है। इसलिए अनुवाद विस्तृत शारीरिक रूपक थोपे बिना मूल काव्यात्मक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर उपवाक्यों में ‘हो जाए’ मृत्यु से पहले घटने वाले विनाश के क्रम को सहज बनाता है। ‘सोता’, ‘घड़ा’ और ‘पहिया’ सामान्य पाठक के लिए बोधगम्य हैं; विवादित अर्थ पाद-टिप्पणियों में सुरक्षित हैं।
