source:
  edition: WLC
  text: גַּ֣ם מִ/גָּבֹ֤הַּ יִרָ֨אוּ֙ וְ/חַתְחַתִּ֣ים בַּ/דֶּ֔רֶךְ וְ/יָנֵ֤אץ הַ/שָּׁקֵד֙ וְ/יִסְתַּבֵּ֣ל הֶֽ/חָגָ֔ב וְ/תָפֵ֖ר הָֽ/אֲבִיּוֹנָ֑ה כִּֽי הֹלֵ֤ךְ הָ/אָדָם֙ אֶל בֵּ֣ית עוֹלָמ֔/וֹ וְ/סָבְב֥וּ בָ/שּׁ֖וּק הַ/סֹּפְדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ecclesiastes/012/005.yaml
  text: Also they are afraid of heights[a], and terrors are on the road; the almond tree blossoms, the grasshopper drags itself along, and the caper berry fails, because man is going to his eternal house[c][b], and the mourners go about in the street.
translation:
  language: hi
  text: ऊँचाई से भी वे डरते हैं, और रास्ते में भय हैं; बादाम का पेड़ फूलता है, टिड्डा घिसटता हुआ चलता है[a], और केपर की बेरी बेअसर हो जाती है[b]; क्योंकि मनुष्य अपने चिरस्थायी घर को जा रहा है, और विलाप करनेवाले[c] सड़क पर घूमते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टिड्डा बोझ बन जाता है।” हिब्रू अभिव्यक्ति कठिन है; इसका चित्र दुर्बल गति या वृद्धावस्था में छोटी-सी वस्तु के भी बोझ बन जाने पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इच्छा समाप्त हो जाती है।” हिब्रू में शाब्दिक रूप से “केपर की बेरी” का उल्लेख है, जिसे संभवतः भूख या उत्तेजना से जोड़ा गया है।
    reason: lexical_alternative
  - marker: c
    text: “विलाप करनेवाले” में वे पेशेवर मातम करनेवाले भी शामिल हो सकते हैं जो मृतक के लिए सार्वजनिक रूप से शोक प्रकट करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: מִגָּבֹהַּ יִרָאוּ
  choice: ऊँचाई से भी वे डरते हैं
  rationale: מִן के कारण भय का स्रोत व्यक्त होता है। बहुवचन क्रिया को बनाए रखते हुए यह वृद्धावस्था में ऊँचाई के भय का स्वाभाविक हिन्दी रूप है।
- source_word: חַתְחַתִּים בַּדֶּרֶךְ
  choice: रास्ते में आतंक होते हैं
  rationale: दुर्लभ बहुवचन संज्ञा חַתְחַתִּים को उसकी तीव्रता सहित 'आतंक' से व्यक्त किया गया है; בַּדֶּרֶךְ ठोस मार्ग-संबंधी चित्र रखता है।
- source_word: יָנֵאץ הַשָּׁקֵד
  choice: बादाम का पेड़ फूलता है
  rationale: क्रिया कठिन है, पर प्रसंग में प्राचीन और व्यापक अर्थ 'फूलना' वृद्धावस्था के चित्र—संभवतः सफेद बाल—के अनुकूल है।
- source_word: יִסְתַּבֵּל הֶחָגָב
  choice: टिड्डा घिसटता हुआ चलता है
  rationale: दुर्बल गति का अर्थ संदर्भ में सहज है, किंतु हिब्रू अभिव्यक्ति अनिश्चित होने से वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: תָפֵר הָאֲבִיּוֹנָה
  choice: कबीट का फल निष्फल हो जाता है
  rationale: אֲבִיּוֹנָה को ठोस वनस्पति-चित्र के रूप में रखा गया है। 'निष्फल हो जाता है' उसके उत्तेजक अथवा भूखवर्धक प्रभाव के चुक जाने को व्यक्त करता है, बिना सीधे 'इच्छा' मान लेने के।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधि मानव व्यक्ति की मृत्यु-यात्रा का वर्णन है। आधुनिक हिन्दी में 'मनुष्य' लिंग-समावेशी होने के साथ एकवचन और गंभीर शैली बनाए रखता है।
- source_word: בֵּית עוֹלָמוֹ
  choice: अपने सदा के घर
  rationale: शाब्दिक रूप से 'उसके अनंतकाल का घर'; यह रूप मृत्यु के निवास-रूपक और उसकी गंभीरता को सुरक्षित रखता है, पर परलोक की प्रकृति को अतिरिक्त रूप से परिभाषित नहीं करता।
- source_word: סָבְבוּ בַשּׁוּק
  choice: गली में घूम रहे हैं
  rationale: סבב का सार्वजनिक रूप से इधर-उधर फिरना और שׁוּק का सार्वजनिक मार्ग—दोनों सहज आधुनिक हिन्दी में व्यक्त होते हैं।
theological_decisions:
- issue: הָאָדָם का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: आदमी
  rationale: पद किसी केवल पुरुष व्यक्ति के बजाय मृत्यु की ओर जाते प्रतिनिधि मानव को चित्रित करता है। 'मनुष्य' मूल के एकवचन सामान्य अर्थ को बनाए रखता है और अनावश्यक लैंगिक संकीर्णता से बचता है।
- issue: בֵּית עוֹלָמוֹ की मृत्यु-संबंधी उपमा
  choice: अपने सदा के घर
  alternative: अपनी अंतिम कब्र
  rationale: मूल पाठ 'घर' और दीर्घकाल/अनंतता की भाषा रखता है; उसे सीधे 'कब्र' कहना संभावित संकेत को निश्चित व्याख्या बना देता।
- issue: הָאֲבִיּוֹנָה का अर्थ
  choice: कबीट का फल
  alternative: इच्छा
  rationale: ठोस वनस्पति-संज्ञा को मुख्य पाठ में सुरक्षित रखा गया है; यौन इच्छा, भूख या सामान्य कामना में से किसी एक को निर्णायक मानना मूल की अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। वृद्धावस्था और मृत्यु के मूल रूपकों को समझाने के बजाय मुख्य पाठ में यथासंभव सुरक्षित रखा गया है। 'कबीट' अपेक्षाकृत अपरिचित शब्द है, इसलिए उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
