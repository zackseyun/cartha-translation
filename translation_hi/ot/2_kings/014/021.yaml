  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
translation:
  language: hi
  text: तब यहूदा के सब लोगों ने अजर्याह को लिया—वह सोलह वर्ष का था—और उसके पिता अमस्याह के स्थान पर उसे राजा बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अजर्याह को अन्य स्थानों पर उज्जियाह भी कहा गया है; यहाँ इब्रानी पाठ में ‘अजर्याह’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: लिया
  rationale: לקח का सीधा अर्थ ‘लेना’ है। राज्यारोहण के इस प्रसंग में ‘लिया’ लोगों द्वारा अजर्याह को आगे लाकर राजा बनाने की कार्रवाई को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: כָּל עַם יְהוּדָה
  choice: यहूदा के सब लोगों
  rationale: मूल वाक्यांश में ‘यहूदा के सब लोग’ स्पष्ट रूप से है; यह प्रदेश मात्र नहीं, बल्कि सामूहिक रूप से लोगों की राजनीतिक कार्रवाई दिखाता है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: इस पद के इब्रानी पाठ में नाम अजर्याह है। अन्य स्थानों पर मिलने वाला उज्जियाह नाम पादटिप्पणी में बताया गया है।
- source_word: וְהוּא בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: वह सोलह वर्ष का था
  rationale: यह आयु बताने वाला सीधा कथन है; आधुनिक हिन्दी में यह स्वाभाविक है और मूल की व्याख्यात्मक, प्रसंगांतरित सूचना को सुरक्षित रखता है।
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: उसे राजा बनाया
  rationale: מלך का हिफ़ील रूप किसी को राज्य करने वाला बनाने, अर्थात राजा बनाने, का अर्थ देता है। ‘मुकुट पहनाया’ किसी अनुल्लिखित समारोह को जोड़ता, जबकि ‘घोषित किया’ कार्रवाई को केवल घोषणा तक सीमित कर देता।
- source_word: תַּחַת אָבִיו
  choice: उसके पिता के स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में תחת का अर्थ ‘के स्थान पर’ है; यह केवल कालक्रम नहीं, बल्कि पद पर उत्तराधिकार व्यक्त करता है।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और मूल के निकट भाषा रखी गई है। डैश आयु-सूचना के प्रसंगांतरित स्वरूप को स्पष्ट करते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
