id: 2KI.14.18
reference: 2 Kings 14:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י אֲמַצְיָ֑הוּ הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/018.yaml
  text: The rest of the acts of Amaziah[a], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: अमस्याह के बाकी काम क्या ‘यहूदा के राजाओं के इतिहास की पुस्तक’[a] में लिखे हुए नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहूदा के राजाओं के वार्षिक वृत्तांत की पुस्तक।’
    reason: דִּבְרֵי הַיָּמִים राजकीय इतिहास अथवा वार्षिक अभिलेख, दोनों अर्थों में समझा जा सकता है; पादटिप्पणी इस शब्दगत विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी/शेष’ है, और राजकीय सारांश के इस सूत्र में דִּבְרֵי राजा के कथनों तक सीमित न होकर उसके कार्यों और मामलों को दर्शाता है। हिंदी में ‘बाकी काम’ सहज और स्पष्ट है।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: इब्रानी नाम का प्रचलित हिंदी लिप्यंतरण अपनाया गया है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है; ‘क्या ... नहीं’ हिंदी में उसी बल को बनाए रखता है।
- source_word: הֵם כְּתוּבִים
  choice: लिखे हुए नहीं हैं
  rationale: निष्क्रिय कृदंत के ‘लिखे हुए’ भाव को निकटता से रखते हुए स्वाभाविक हिंदी वाक्य बनाया गया है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: यद्यपि עַל का मूल अर्थ ‘पर’ है, अभिलेख में सामग्री दर्ज होने के अर्थ में हिंदी का स्वाभाविक प्रयोग ‘पुस्तक में’ है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास
  rationale: यह पदबंध राजाओं से संबंधित कालानुक्रमिक राजकीय अभिलेख को दर्शाता है। ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी अधिक तकनीकी विकल्प देती है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। मूल के राजकीय-सारांश सूत्र और आलंकारिक प्रश्न को बनाए रखा गया है; आरंभिक וְ को अलग से ‘और’ कहने के बजाय हिंदी के स्वाभाविक संदर्भ-संक्रमण में समाहित किया गया है।
