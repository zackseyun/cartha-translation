base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
translation:
  language: hi
  text: परन्तु यहोवा ने आकाश के नीचे से इस्राएल का नाम मिटा देने की बात नहीं कही थी[a]; इसलिए उसने योआश के पुत्र यारोबाम के द्वारा[b] उन्हें बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल का नाम मिटा डालने।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, ‘यारोबाम के हाथ से’; अर्थात, ‘यारोबाम के द्वारा’ या ‘यारोबाम के माध्यम से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की हिन्दी परंपरा के अनुरूप परमेश्वर के वाचा-नाम को सामान्य उपाधि से बदलने के बजाय प्रचलित रूप में रखा गया है।
- source_word: דִבֶּר
  choice: कहा था
  rationale: דבר का सामान्य अर्थ ‘कहना/बोलना’ है। भूतपूर्व ‘कहा था’ अगले कथात्मक कार्य से पहले की घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִמְחוֹת
  choice: मिटा देगा
  rationale: מחה यहाँ पूर्णतः हटा देने या समाप्त कर देने का भाव रखता है। ‘नाम’ के साथ ‘मिटा देना’ स्वाभाविक भी है और इब्रानी बिंब को बनाए रखता है।
- source_word: שֵׁם יִשְׂרָאֵל
  choice: इस्राएल का नाम
  rationale: यह निकटवर्ती अनुवाद उस इब्रानी मुहावरे को बनाए रखता है जिसमें ‘नाम’ इस्राएल के अस्तित्व और पहचान का प्रतिनिधित्व करता है।
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: आकाश के नीचे से
  rationale: यह संसार में अस्तित्व के क्षेत्र से पूरी तरह हटा दिए जाने का इब्रानी मुहावरा है; इसका शाब्दिक बिंब व्याख्यात्मक ‘पृथ्वी पर से’ की अपेक्षा सुरक्षित रखा गया है।
- source_word: וַיּוֹשִׁיעֵם
  choice: इसलिए उसने ... उनका उद्धार किया
  rationale: Hifil रूप बचाने या छुड़ाने की क्रिया बताता है। ‘उद्धार किया’ धार्मिक अर्थ तक सीमित हुए बिना संकट से छुड़ाने का भाव देता है; ‘इसलिए’ दोनों कथनों के प्रसंगगत परिणाम-संबंध को स्पष्ट करता है।
- source_word: בְּיַד
  choice: के हाथ से
  rationale: इब्रानी मुहावरा माध्यम या मानवीय प्रतिनिधि को सूचित करता है। हिन्दी का समान बाइबलीय मुहावरा मूल बिंब और यारोबाम की साधनात्मक भूमिका दोनों को बनाए रखता है।
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ
  choice: योआश के पुत्र यारोबाम
  rationale: व्यक्तिनामों के प्रचलित हिन्दी रूप और स्वाभाविक हिन्दी वंश-सूचक क्रम का प्रयोग किया गया है।
theological_decisions:
- issue: इस्राएल को बचाने में परमेश्वर की मंशा और कार्य
  choice: यहोवा ने इस्राएल का नाम मिटाने की बात नहीं कही थी; इसलिए उसने यारोबाम को माध्यम बनाकर उनका उद्धार किया।
  alternative: दोनों खंडों को केवल ‘और’ से जोड़कर उनके बीच के परिणाम-संबंध को अनिर्दिष्ट छोड़ा जा सकता है।
  rationale: इब्रानी पाठ यहोवा द्वारा विनाश की बात न कहने के बाद उसके उद्धारकारी कार्य को रखता है। ‘इसलिए’ इस कथात्मक तर्क को व्यक्त करता है, पर इसे किसी अधिक विस्तृत धर्मवैज्ञानिक आदेश या अपरिवर्तनीय घोषणा में नहीं बदलता। साथ ही पाठ का यह तनाव बना रहता है कि यहोवा ने एक त्रुटिपूर्ण राजा को उद्धार का माध्यम बनाया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘यहोवा’, ‘उद्धार’ और ‘के हाथ से’ जैसे परिचित बाइबलीय पद मूल के वाचा-संबंधी और साधनात्मक स्वर को बनाए रखते हैं; जहाँ आवश्यक है, मुहावरे का अर्थ पादटिप्पणी में स्पष्ट किया गया है।
