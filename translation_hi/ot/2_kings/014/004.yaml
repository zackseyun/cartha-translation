reference: 2 Kings 14:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/004.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: hi
  text: फिर भी ऊँचे स्थान[a] हटाए नहीं गए; लोग अब भी उन ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात स्थानीय पूजा-स्थल, जो प्रायः ऊँची जगहों पर बने होते थे।
    reason: सांस्कृतिक और शब्दार्थ-संबंधी स्पष्टीकरण
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह शब्द पिछले कथन में अपवाद या सीमा जोड़ता है। ‘फिर भी’ आधुनिक हिन्दी में उसके विरोधात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थान
  rationale: בָּמוֹת स्थानीय उपासना-स्थलों के लिए प्रयुक्त पारिभाषिक शब्द है, जो प्रायः ऊँची जगहों पर होते थे। ‘ऊँचे स्थान’ मूल रूपक को बनाए रखता है; पादटिप्पणी इसका सांस्कृतिक अर्थ स्पष्ट करती है।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: ऊँचे स्थानों को कर्ता मानकर यह वाक्यांश उनके न हटाए या समाप्त न किए जाने का अर्थ देता है।
- source_word: עוֹד
  choice: अब भी
  rationale: यह लोगों के बलि चढ़ाने और धूप जलाने की जारी प्रथा को दर्शाता है।
- source_word: הָעָם
  choice: लोग
  rationale: सामूहिक संज्ञा का सहज और स्पष्ट हिन्दी रूप।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते थे
  rationale: हिब्रू कृदन्त निरन्तर या प्रचलित क्रिया सूचित करता है; हिन्दी का अपूर्ण भूतकाल इस भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמְקַטְּרִים
  choice: और धूप जलाते थे
  rationale: उपासना-संबंधी सन्दर्भ में קטר सामान्यतः धूप या सुगन्धित सामग्री जलाने को व्यक्त करता है; समानान्तर अपूर्ण भूतकाल जारी प्रथा को बनाए रखता है।
- source_word: בַּבָּמוֹת
  choice: उन ऊँचे स्थानों पर
  rationale: בְ यहाँ स्थानवाचक है। ‘उन’ पहले उल्लिखित स्थलों की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: ऊँचे स्थानों पर होने वाली उपासना का मूल्यांकन
  choice: मुख्य पाठ में ऐतिहासिक वर्णन ‘ऊँचे स्थान’ रखा गया है, बिना उन्हें स्पष्ट रूप से अवैध या मूर्तिपूजक कहे।
  alternative: स्थानीय पूजा-स्थल; अनधिकृत उपासना-स्थल
  rationale: व्यापक साहित्यिक सन्दर्भ में इन स्थलों की आलोचना निहित हो सकती है, पर यह पद स्वयं केवल उनके बने रहने और वहाँ जारी उपासना का वर्णन करता है। अनुवाद को उससे अधिक स्पष्ट धार्मिक निर्णय नहीं जोड़ना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बलि चढ़ाते’ और ‘धूप जलाते’ प्रचलित धार्मिक अभिव्यक्तियाँ हैं; अपूर्ण भूतकाल हिब्रू कृदन्तों में निहित जारी या अभ्यस्त क्रिया को व्यक्त करता है।
