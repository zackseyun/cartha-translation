source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
translation:
  language: hi
  text: उसी ने इस्राएल की सीमा को लेबो-हमात[a] से अराबा के सागर[b] तक पुनः स्थापित किया, इस्राएल के परमेश्वर याहवे के उस वचन के अनुसार, जो उसने अपने सेवक अमित्तै के पुत्र योना नबी के माध्यम से कहा था। योना गात-हेपेर का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “हमात के प्रवेश-स्थान से।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात, संभवतः मृत सागर।
    reason: alternative_reading
lexical_decisions:
- source_word: הֵשִׁיב
  choice: फिर से स्थापित कर दी
  rationale: हिफ़ील रूप यहाँ इस्राएल की राजनीतिक-भौगोलिक सीमा को उसकी पूर्व स्थिति में लौटाने का भाव देता है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: यह शब्द यहाँ राज्य की भौगोलिक सीमा को सूचित करता है।
- source_word: מִלְּבוֹא חֲמָת
  choice: लबो-हमात से
  rationale: बाइबलीय प्रयोग में इसे एक निश्चित स्थान-नाम मानकर लिप्यंतरित किया गया है; शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָם הָעֲרָבָה
  choice: अराबा के सागर
  rationale: इब्रानी भौगोलिक अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है; संभावित पहचान पादटिप्पणी में दी गई है।
- source_word: כִּדְבַר
  choice: उस वचन के अनुसार
  rationale: यह पहले कहे गए परमेश्वर के वचन के अनुरूप घटना घटने का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: इब्रानी मुहावरा माध्यम या अभिकर्ता दर्शाता है; आधुनिक हिन्दी में ‘के द्वारा’ इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: नबी और परमेश्वर के संबंध के इस प्रसंग में ‘सेवक’ उपयुक्त और प्रचलित हिन्दी है।
- source_word: הַנָּבִיא
  choice: नबी
  rationale: यह योना की भूमिका बताने वाली सीधी पदवी है।
- source_word: מִגַּת הַחֵפֶר
  choice: गत-हेपेर का रहनेवाला
  rationale: מן मूल स्थान को दर्शाता है; हिन्दी में यह अभिव्यक्ति स्वाभाविक ढंग से योना का नगर बताती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को लिप्यंतरित करके सुरक्षित रखा गया है; उसे किसी उपाधि से नहीं बदला गया।
- issue: יָם הָעֲרָבָה की भौगोलिक पहचान
  choice: अराबा के सागर
  alternative: मृत सागर
  rationale: मुख्य पाठ में इब्रानी अभिव्यक्ति की वास्तविक अस्पष्टता रखी गई है, जबकि उसकी संभावित पहचान पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल इब्रानी का लंबा वाक्य हिन्दी में स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी पाठ में [a] को लबो-हमात और [b] को अराबा के सागर के साथ रखा गया है।
