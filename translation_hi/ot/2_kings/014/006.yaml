  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
translation:
  language: hi
  text: 'परन्तु उसने मारनेवालों के बेटों को मृत्युदण्ड नहीं दिया[a], जैसा मूसा की व्यवस्था की पुस्तक में लिखा है, जिसमें याहवे ने यह कहते हुए आज्ञा दी थी: “बेटों के कारण पिता मृत्युदण्ड न पाएँ, और पिताओं के कारण बेटे मृत्युदण्ड न पाएँ; बल्कि हर एक अपने ही पाप के कारण मरे।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मारनेवालों के बेटे।” इसका अनुवाद “हत्यारों की सन्तान” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण व्यवस्थाविवरण 24:16 से है।
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  choice: मार डालनेवालों के बेटों
  rationale: בְּנֵי का पुरुषवाचक अर्थ ‘बेटे’ रखा गया है। נכה के कृदन्त का प्रसंगगत अर्थ उन लोगों से है जिन्होंने राजा के पिता को मार डाला था; ‘मार डालनेवाले’ अर्थ को स्पष्ट रखते हुए अनावश्यक कानूनी विशेषण नहीं जोड़ता।
- source_word: לֹא הֵמִית
  choice: मृत्युदण्ड नहीं दिया
  rationale: מות के हिफ़ील रूप का अर्थ ‘मरवा देना/मृत्यु देना’ है; राजकीय न्याय के इस प्रसंग में ‘मृत्युदण्ड देना’ स्वाभाविक और न्यायिक भाव वाला हिन्दी रूप है।
- source_word: כַּכָּתוּב
  choice: जैसा ... लिखा है
  rationale: यह मुहावरा लिखित व्यवस्था के अनुरूप आचरण को सूचित करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: בְּסֵפֶר תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था की पुस्तक में
  rationale: סֵפֶר और תּוֹרָה दोनों को स्पष्ट रखते हुए मान्य हिन्दी बाइबलीय पदावली अपनाई गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यन्तरण द्वारा रखा गया है।
- source_word: לֹא יוּמְתוּ
  choice: मृत्युदण्ड न पाएँ
  rationale: कानूनी निषेध और कर्मवाच्य भाव दोनों सुरक्षित रहते हैं; इसका अर्थ केवल सामान्य मृत्यु नहीं, दण्डस्वरूप मार दिया जाना है।
- source_word: אָבוֹת ... בָּנִים
  choice: पिता ... बेटे
  rationale: मूल के पुरुषवाचक बहुवचन को सामान्यीकृत ‘माता-पिता/बच्चे’ में नहीं बदला गया है।
- source_word: עַל
  choice: के कारण
  rationale: यहाँ עַל दण्ड के आधार या कारण को बताता है; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: पूर्व निषेध के विपरीत व्यक्तिगत उत्तरदायित्व का सिद्धान्त प्रस्तुत करने वाला विरोधात्मक बल सुरक्षित है।
- source_word: אִישׁ
  choice: हर एक
  rationale: इब्रानी एकवचन का वितरणात्मक अर्थ व्यक्त होता है। हिन्दी में ‘हर एक’ स्वाभाविक है और आगे के पुल्लिंग क्रियारूप से मूल का व्याकरणिक रूप भी बना रहता है।
- source_word: בְּחֶטְאוֹ
  choice: अपने ही पाप के कारण
  rationale: ‘अपने ही’ प्रत्ययगत स्वामित्व और दूसरे के पाप के साथ निहित विरोध को स्पष्ट करता है; ‘के कारण’ दण्ड के आधार को व्यक्त करता है।
- source_word: יָמוּת
  choice: मरे
  rationale: अन्तिम क्रिया मूल में सामान्य Qal ‘मरना’ है, पहले प्रयुक्त मृत्युदण्ड दिलाने वाले causative/passive रूप से अलग; हिन्दी में यह रूपगत बदलाव सुरक्षित रखा गया है।
theological_decisions:
- issue: व्यक्तिगत और पारिवारिक दण्ड-दायित्व
  choice: पिता और बेटे को एक-दूसरे के पाप के कारण मृत्युदण्ड न देने तथा हर एक के अपने पाप के कारण मरने का न्यायिक सिद्धान्त
  alternative: इसे पाप के सभी सामुदायिक या पीढ़ीगत परिणामों का व्यापक निषेध समझना
  rationale: पद की शब्दावली न्यायिक मृत्युदण्ड और व्यक्तिगत दोष से सम्बन्धित है। अनुवाद इसी कानूनी दायरे को रखता है और अन्य स्थानों में वर्णित पाप के सामुदायिक परिणामों के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ता।
- issue: अन्तिम יָמוּת का न्यायिक आशय और रूपगत भेद
  choice: ‘मरे’ द्वारा सामान्य Qal क्रिया को बनाए रखना
  alternative: समानान्तर कानूनी प्रसंग के कारण ‘मृत्युदण्ड पाए’ कहना
  rationale: प्रसंग में न्यायिक मृत्यु निहित हो सकती है, पर मूल ने पहले के causative/passive रूप के बजाय यहाँ Qal का प्रयोग किया है। ‘मरे’ इस वास्तविक भाषिक तनाव को बिना मिटाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। न्यायिक प्रसंग में ‘मृत्युदण्ड’ प्रयुक्त है, जबकि मूल की अन्तिम सामान्य क्रिया के लिए ‘मरे’ रखा गया है। उद्धरण की वाक्य-संरचना औपचारिक है, पर अत्यधिक संस्कृतनिष्ठ नहीं।
