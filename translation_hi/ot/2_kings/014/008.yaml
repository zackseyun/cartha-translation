  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
translation:
  language: hi
  text: तब अमस्याह ने इस्राएल के राजा, येहू के पुत्र यहोआहाज के पुत्र यहोआश के पास दूतों को यह कहकर भेजा, “आओ, हम आमने-सामने मिलें।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ है, “हम चेहरे देखें।” यहाँ यह मुहावरा सीधे आमने-सामने मिलने की चुनौती देता है; प्रसंग में इसका संकेत सैन्य मुठभेड़ की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कथा में अगली घटना को आरम्भ करने वाला स्वाभाविक काल-सूचक शब्द है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्य-संदेशवाहक अभिप्रेत हैं; ‘दूत’ ऐतिहासिक राजकीय प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: יְהוֹאָשׁ בֶּן יְהוֹאָחָז בֶּן יֵהוּא
  choice: येहू के पुत्र यहोआहाज के पुत्र यहोआश
  rationale: हिब्रू की वंशावली-श्रृंखला को स्पष्टता सहित बनाए रखा गया है और नामों का स्रोत-सन्निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: हिंदी कथाशैली में ‘दूत भेजकर कहा’ प्रत्यक्ष कथन की स्वाभाविक भूमिका बाँधता है; शाब्दिक ‘यह कहते हुए’ की कृत्रिमता से बचता है।
- source_word: לְכָה
  choice: आओ
  rationale: यह आमंत्रण के रूप में व्यक्त चुनौती है; आधुनिक मानक हिंदी में ‘आओ’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: נִתְרָאֶה פָנִים
  choice: हम आमने-सामने हों
  rationale: यह अभिव्यक्ति हिब्रू के ‘चेहरे देखें’ रूपक को स्वाभाविक हिंदी में बनाए रखती है और युद्ध का अर्थ मुख्य पाठ में अनिवार्य रूप से जोड़ने के बजाय प्रसंगगत तनाव सुरक्षित रखती है।
theological_decisions:
- issue: नִתְרָאֶה פָנִים में सैन्य चुनौती को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘हम आमने-सामने हों’
  alternative: ‘हम युद्ध में एक-दूसरे का सामना करें’
  rationale: प्रसंग सैन्य मुठभेड़ की ओर संकेत करता है, पर हिब्रू में ‘युद्ध’ शब्द प्रत्यक्ष नहीं है। इसलिए मुख्य पाठ रूपक और उसकी तीव्रता को सुरक्षित रखता है तथा टिप्पणी प्रसंगगत आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी रखी गई है। राजकीय वंश-परिचय की हिब्रू संरचना सुरक्षित है; अंतिम चुनौती को अति-व्याख्यात्मक बनाए बिना उसका मुहावरेदार बल बनाए रखा गया है।
