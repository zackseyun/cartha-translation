source:
  edition: WLC
  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
translation:
  language: hi
  text: क्योंकि यहोवा ने देखा कि इस्राएल की पीड़ा बहुत ही तीव्र थी[a], और न कोई बँधा हुआ था, न कोई स्वतंत्र[b], और इस्राएल का कोई सहायक नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत ही गंभीर थी” अथवा “बहुत ही कष्टदायक थी।” यहाँ का इब्रानी पद कठिन है, पर वह इस्राएल की पीड़ा की तीव्रता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में यह एक कठिन मुहावरा है: “न बँधा हुआ, न स्वतंत्र।” इसका सम्भव अर्थ है कि कोई भी नहीं था, अथवा सहायता करने के लिए कोई वर्ग शेष नहीं था।'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप से सुरक्षित रखा गया है।
- source_word: עֳנִי
  choice: दुःख
  rationale: यहाँ शब्द इस्राएल की राष्ट्रीय दुर्दशा और पीड़ा को व्यापक रूप से व्यक्त करता है; केवल आर्थिक निर्धनता इसका आशय सीमित कर देती।
- source_word: מֹרֶה מְאֹד
  choice: अत्यन्त कटु था
  rationale: कठिन इब्रानी पद को इस्राएल की पीड़ा की तीव्रता के रूप में प्रस्तुत किया गया है; अनिश्चितता को पादटिप्पणी में रखा गया है।
- source_word: אֶפֶס
  choice: न कोई ... न कोई
  rationale: दोनों कृदन्तों के साथ यह पूर्ण अभाव पर बल देता है और हिन्दी में युग्मित निषेध स्वाभाविक है।
- source_word: עָצוּר
  choice: बँधा हुआ
  rationale: विवादित युग्म के पहले पद का मूल चित्र सुरक्षित रखता है और किसी निश्चित सामाजिक वर्ग की व्याख्या आरोपित नहीं करता।
- source_word: עָזוּב
  choice: खुला छोड़ा हुआ
  rationale: पहले पद के विपरीत दिखाई देने वाले मूल चित्र को सुरक्षित रखता है; युग्म का सम्भावित मुहावरेदार अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: עֹזֵר
  choice: सहायक
  rationale: सहायता करने वाले व्यक्ति के लिए प्रयुक्त इब्रानी कृदन्त का सीधा और प्रसंगानुकूल अनुवाद है।
theological_decisions:
- issue: कठिन मुहावरा עָצוּר וְעָזוּב
  choice: न कोई बँधा हुआ बचा था, न कोई खुला छोड़ा हुआ
  alternative: न दास बचा था, न स्वतंत्र; अथवा कोई भी शेष नहीं था
  rationale: मूल के विरोधी-से प्रतीत होने वाले पदों को मुख्य पाठ में बनाए रखा गया है, पर हिन्दी में उनके अस्तित्व के पूर्ण अभाव का आशय स्पष्ट करने के लिए ‘बचा था’ जोड़ा गया है। ठीक सामाजिक या मुहावरेदार अर्थ अनिश्चित होने के कारण वैकल्पिक समझ पादटिप्पणी में दी गई है।
- issue: מֹרֶה מְאֹד का अर्थ
  choice: अत्यन्त कटु था
  alternative: अत्यन्त भारी था; अत्यन्त कठोर था
  rationale: पद की शाब्दिक कठिनाई को मिटाए बिना यह इस्राएल की चरम पीड़ा व्यक्त करता है; सम्भव अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। कठिन इब्रानी अभिव्यक्तियों की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखी गई है; विराम-चिह्न हिन्दी के स्वाभाविक प्रवाह के अनुसार हैं।
