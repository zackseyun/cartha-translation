  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण ऐतिहासिक-वृत्तांत वाला रूप। राजकीय काल-निर्धारण को स्पष्ट करने के लिए ‘शासन के’ जोड़ा गया है; कोई सांप्रदायिक या व्याख्यात्मक विस्तार नहीं किया गया।
