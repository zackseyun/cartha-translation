base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/023.yaml
  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: hi
  text: यहूदा के राजा योआश के पुत्र अमस्याह के शासन के पंद्रहवें वर्ष में, इस्राएल के राजा योआश का पुत्र यारोबाम शोमरोन में राजा बना और उसने इकतालीस वर्ष तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: शासन के पंद्रहवें वर्ष में
  rationale: राजकीय काल-निर्धारण के इस सूत्र में संख्या पद क्रमवाचक अर्थ देता है; हिंदी में राजा के शासन का स्पष्ट उल्लेख स्वाभाविक और अर्थ-सटीक है।
- source_word: לַאֲמַצְיָהוּ בֶן־יוֹאָשׁ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा योआश के पुत्र अमस्याह के
  rationale: सम्बन्धसूचक और उपाधि-सम्बन्धी संरचना को स्वाभाविक हिंदी क्रम में रखा गया है, जिससे अमस्याह की वंशावली और पद दोनों स्पष्ट रहें।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राजगद्दी पर बैठने या राजत्व आरम्भ करने की सूचना देती है; इसे बाद में दी गई शासन-अवधि से अलग रखने के लिए ‘राजा बना’ चुना गया है।
- source_word: יָרָבְעָם בֶּן־יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा योआश का पुत्र यारोबाम
  rationale: व्यक्तिनामों का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है और पद-सम्बन्ध को स्वाभाविक हिंदी क्रम में व्यक्त किया गया है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: स्थानवाचक ב को ‘में’ से व्यक्त किया गया है; शोमरोन उत्तरी राज्य की राजधानी के रूप में शासन का स्थान है।
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  choice: इकतालीस वर्ष तक
  rationale: शासन की अवधि को आधुनिक, सहज हिंदी संख्या-रूप में व्यक्त किया गया है।
