  text: परन्तु अमस्याह ने बात नहीं मानी[a]। तब इस्राएल का राजा यहोआश चढ़ गया, और वह तथा यहूदा का राजा अमस्याह बेत-शेमेश में, जो यहूदा का था, आमने-सामने हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
