  text: He rebuilt Elath and restored it to Judah after the king lay down with his fathers.
translation:
  language: hi
  text: उसने एलात को फिर से बनाया और राजा के अपने पुरखाओं के साथ सो जाने के बाद उसे यहूदा को लौटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנָה
  choice: फिर से बनाया
  rationale: क्रिया का मूल अर्थ ‘बनाना’ है; प्रसंग में पहले से विद्यमान नगर एलात के पुनर्निर्माण का भाव है, इसलिए ‘फिर से बनाया’ स्वाभाविक और सटीक है।
- source_word: וַיְשִׁבֶהָ לִיהוּדָה
  choice: उसे यहूदा के अधीन फिर कर दिया
  rationale: שׁוב के हिफ़ील रूप में लौटाने/पुनः स्थापित करने का भाव है। לִיהוּדָה संबंध या अधिकार को दर्शाता है; ‘यहूदा के अधीन’ आधुनिक हिन्दी में राजनीतिक पुनर्स्थापन स्पष्ट करता है।
- source_word: שְׁכַב ... עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ सो जाने
  rationale: राजकीय मृत्यु-सूत्र के स्रोत-रूपक को बनाए रखा गया है; ‘सो जाना’ मृत्यु के लिए प्रयुक्त शिष्ट बाइबलीय अभिव्यक्ति है।
theological_decisions:
- issue: ‘अपने पुरखाओं के साथ सो जाना’ का अर्थ
  choice: स्रोत-पाठ का मृत्यु-संबंधी रूपक ज्यों का त्यों रखा
  alternative: ‘मर जाने’
  rationale: शाब्दिक मुहावरा राजाओं की पुस्तकों की शैली और दफन/वंशगत संबद्धता की संभावित अर्थ-छाया सुरक्षित रखता है; इसे केवल सपाट ‘मरना’ बनाना अनावश्यक व्याख्यात्मक संकुचन होता।
- issue: ‘राजा’ की पहचान
  choice: स्रोत की तरह केवल ‘राजा’ रखा
  alternative: ‘उसके पिता राजा अमस्याह’
  rationale: इस पद में राजा का नाम नहीं दिया गया; संदर्भ से पहचान संभव है, पर अनुवाद में नाम जोड़ना स्रोत की निहितता को स्पष्ट कथन में बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सामान्य-पाठक-सुलभ शैली। ‘एलात’ और ‘यहूदा’ प्रचलित बाइबलीय नामरूप हैं। वाक्यक्रम को हिन्दी में स्वाभाविक रखा गया है, जबकि मूल का मृत्यु-मुहावरा संरक्षित है।
