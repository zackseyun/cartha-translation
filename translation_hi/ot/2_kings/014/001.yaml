  text: בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ בֶּן יוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ אֲמַצְיָ֥הוּ בֶן יוֹאָ֖שׁ מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/001.yaml
  text: In the second year of Joash son of Jehoahaz, king of Israel, Amaziah son of Joash became king of Judah.
translation:
  language: hi
  text: इस्राएल के राजा यहोआहाज के पुत्र योआश के राज्य के दूसरे वर्ष में, योआश का पुत्र अमस्याह यहूदा का राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם
  choice: के शासन के दूसरे वर्ष में
  rationale: यह इब्रानी राजकीय कालगणना का सूत्र है। שְׁתַּיִם रूपतः ‘दो’ है, पर इस प्रयोग में क्रमवाचक अर्थ ‘दूसरा’ देता है; ‘शासन के’ जोड़ने से आधुनिक हिन्दी में स्पष्ट होता है कि वर्ष राजा के राज्यकाल का है।
- source_word: לְ/יוֹאָשׁ
  choice: योआश के
  rationale: राजकीय वर्ष के इस सूत्र में לְ उस राजा को सूचित करता है जिसके शासन-वर्ष की गणना हो रही है; हिन्दी में संबंधकारक ‘के’ स्वाभाविक है।
- source_word: בֶּן יוֹאָחָז
  choice: यहोआहाज के पुत्र
  rationale: वंश-सूचक पद का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: राजकीय उपाधि और राज्य को हिन्दी की स्वाभाविक संबंध-रचना में व्यक्त किया गया है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: इस प्रसंग में क्रिया राजसिंहासन पर आरूढ़ होने या शासन आरम्भ करने की घटना बताती है; ‘राजा बना’ संक्षिप्त, सहज और अर्थानुकूल है।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶן יוֹאָשׁ
  choice: योआश का पुत्र
  rationale: अमस्याह की पहचान बताने वाला वंश-सूचक पद; वाक्य में विभक्ति-सामंजस्य के अनुसार ‘का पुत्र’।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: मूल में यह पद योआश की उपाधि है; इसे अमस्याह के पिता की पहचान के साथ रखा गया है, ताकि दोनों योआशों के बीच भेद स्पष्ट रहे।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की राजकीय कालगणना और दोनों समान-नाम वाले योआशों की पहचान सुरक्षित रखी गई है।
