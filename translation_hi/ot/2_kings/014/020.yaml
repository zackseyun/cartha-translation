  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
translation:
  language: hi
  text: वे उसे घोड़ों पर लादकर ले गए,[a] और उसे यरूशलेम में दाऊद के नगर में उसके पुरखाओं के साथ दफ़नाया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘घोड़ों पर’। इब्रानी कथन यह स्पष्ट नहीं करता कि देह सीधे घोड़ों पर रखी गई थी या घोड़ों से चलने वाले किसी वाहन पर।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके पुरखाओं के साथ’ राजवंशीय पूर्वजों के साथ दफ़न होने का एक पारंपरिक सूत्र है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: वे उसे लादकर ले गए
  rationale: נשׂא का मूल भाव उठाने और ढोने का है। मृत देह को घोड़ों पर ले जाने के संदर्भ में ‘लादकर ले गए’ स्वाभाविक हिंदी है और ठोस क्रिया को बनाए रखता है।
- source_word: עַל הַסּוּסִים
  choice: घोड़ों पर
  rationale: עַל का सीधा अर्थ ‘पर’ है। यह अनुवाद इब्रानी अभिव्यक्ति की अस्पष्टता बनाए रखता है कि देह ठीक किस प्रकार के घोड़ा-आधारित साधन से पहुँचाई गई।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: निफ़अल का कर्मवाच्य रूप हिंदी में कर्मवाच्य द्वारा व्यक्त किया गया है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग और प्रचलित हिंदी नाम-रूप का सीधा अनुवाद।
- source_word: עִם אֲבֹתָיו
  choice: उसके पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से पारिवारिक और राजवंशीय दफ़न-सूत्र का भाव बना रहता है तथा यह आधुनिक हिंदी में ‘पितरों’ की अपेक्षा अधिक सहज और कम धार्मिक रूप से चिह्नित है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यरूशलेम के भीतर दफ़नाने के विशिष्ट स्थान को बताने वाले स्थाननाम का प्रचलित हिंदी रूप।
