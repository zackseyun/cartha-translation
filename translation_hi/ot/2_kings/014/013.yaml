  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। राजाओं और स्थानों के नाम प्रचलित बाइबलीय हिंदी रूपों में हैं। प्राचीन माप के लिए ‘हाथ’ रखा गया है और स्पष्टता हेतु ‘लंबा भाग’ जोड़ा गया है।
