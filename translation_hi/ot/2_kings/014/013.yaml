source:
  edition: WLC
  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
translation:
  language: hi
  text: इस्राएल के राजा यहोआश ने यहूदा के राजा अमस्याह को, जो यहोआश का पुत्र, अहज्याह का पुत्र था, बेत-शेमेश में पकड़ लिया। फिर वह यरूशलेम आया[a] और उसने यरूशलेम की शहरपनाह में एप्रैम फाटक से लेकर कोने के फाटक तक चार सौ हाथ लंबा भाग तोड़ डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू व्यंजनात्मक पाठ में ‘फिर वे यरूशलेम आए’ है, पर संदर्भ और इसके बाद आने वाली एकवचन क्रिया ‘उसने…तोड़ डाला’ ‘फिर वह यरूशलेम आया’ अर्थ का समर्थन करती हैं; यहाँ ‘वह’ यहोआश है।
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  choice: पकड़ लिया
  rationale: सैन्य प्रसंग में यह क्रिया किसी व्यक्ति को बलपूर्वक पकड़ने या बंदी बनाने का अर्थ देती है; ‘पकड़ लिया’ सहज हिंदी है और राजा के बंदी बनाए जाने का भाव रखती है।
- source_word: בְּבֵית שָׁמֶשׁ
  choice: बेत-शेमेश में
  rationale: स्थानवाचक בְּ का स्वाभाविक हिंदी रूप ‘में’ है; स्थान-नाम का लिप्यंतरण स्रोत के निकट रखा गया है।
- source_word: ו/יבאו
  choice: फिर वह यरूशलेम आया
  rationale: व्यंजनात्मक पाठ बहुवचन ‘वे आए’ दर्शाता है, किंतु संदर्भ और इसके बाद की एकवचन क्रिया यहोआश को कर्ता मानने का समर्थन करती है। पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיִּפְרֹץ
  choice: तोड़ डाला
  rationale: दीवार के संदर्भ में क्रिया का अर्थ उसमें सेंध लगाना या उसे तोड़ना है; ‘तोड़ डाला’ ध्वंस की पूर्णता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּחוֹמַת יְרוּשָׁלִַם
  choice: यरूशलेम की शहरपनाह में
  rationale: ‘शहरपनाह’ नगर की रक्षात्मक दीवार के लिए स्पष्ट और प्रतिष्ठित हिंदी शब्द है; ‘में’ मूल पूर्वसर्ग को भी दर्शाता है।
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  choice: एप्रैम फाटक से लेकर कोने के फाटक तक
  rationale: यह संरचना तोड़े गए हिस्से की सीमा बताती है; हिंदी में ‘से लेकर…तक’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  choice: चार सौ हाथ लंबा भाग
  rationale: אַמָּה प्राचीन माप ‘हाथ’ है। ‘लंबा भाग’ जोड़ने से स्पष्ट होता है कि संख्या शहरपनाह के तोड़े गए विस्तार की माप है।
- source_word: בֶּן יְהוֹאָשׁ בֶּן אֲחַזְיָהוּ
  choice: यहोआश का पुत्र और अहज्याह का पोता
  rationale: हिब्रू में दो बार ‘पुत्र’ है, पर आधुनिक हिंदी में वास्तविक वंश-संबंध को ‘पुत्र…पोता’ कहना अधिक स्पष्ट और स्वाभाविक है।
