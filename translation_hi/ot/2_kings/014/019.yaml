source:
  edition: WLC
  text: וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַֽחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִתֻ֖/הוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
translation:
  language: hi
  text: तब उन्होंने यरूशलेम में उसके विरुद्ध षड्यंत्र रचा। वह लाकीश भाग गया; और उन्होंने उसके पीछे लाकीश तक लोगों को भेजा[a] और वहीं उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने उसके पीछे लाकीश की ओर भेजा।” इब्रानी में यह नहीं बताया गया है कि किसे भेजा गया; इसका अर्थ “उन्होंने उसका पीछा करने के लिए लोगों को भेजा” हो सकता है।
    reason: इब्रानी में भेजे गए व्यक्तियों या वस्तु का कर्म व्यक्त नहीं है; मुख्य पाठ स्वाभाविक हिन्दी के लिए ‘लोगों को’ स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्तता सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  choice: उन्होंने उसके विरुद्ध षड्यंत्र रचा
  rationale: क्रिया और उसी मूल की संज्ञा से बना यह इब्रानी मुहावरा राजनीतिक षड्यंत्र का बोध कराता है। ‘षड्यंत्र रचा’ स्वाभाविक हिन्दी में उसी अर्थ को व्यक्त करता है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग और नगर के नाम का सीधा अनुवाद।
- source_word: וַיָּנָס
  choice: वह ... भाग गया
  rationale: נוּס का सामान्य अर्थ संकट से ‘भागना’ है; कथा में यह स्वाभाविक और सीधा है।
- source_word: לָכִישָׁה
  choice: लाकीश
  rationale: दिशासूचक ה नगर की ओर गति बताता है; हिन्दी वाक्य-रचना में ‘लाकीश भाग गया’ और ‘लाकीश तक’ से यह दिशा स्पष्ट होती है।
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  choice: उन्होंने उसके पीछे ... लोगों को भेजा
  rationale: इब्रानी का शाब्दिक रूप ‘उन्होंने उसके पीछे भेजा’ है और भेजे गए व्यक्तियों का उल्लेख नहीं करता। सुबोध हिन्दी के लिए ‘लोगों को’ जोड़ा गया है, जबकि पादटिप्पणी मूल की संक्षिप्तता और संभावित अर्थ को सुरक्षित रखती है।
- source_word: וַיְמִתֻהוּ
  choice: उसे मार डाला
  rationale: מות का कारक रूप जानबूझकर मृत्यु देने या मार डालने का अर्थ रखता है। प्रसंग में ‘मार डाला’ स्पष्ट, स्वाभाविक और पर्याप्त रूप से सशक्त है।
- source_word: שָׁם
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण पहले बताए गए लाकीश की ओर संकेत करता है; ‘वहीं’ उस संदर्भ को स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज ऐतिहासिक-कथात्मक शैली रखी गई है। इब्रानी के क्रमिक संयोजक को विरोधसूचक ‘लेकिन’ न बनाकर ‘और’ से व्यक्त किया गया है।
