base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: The rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: यहोआश के शेष काम, जो कुछ उसने किया, उसका पराक्रम, और यहूदा के राजा अमस्याह के साथ उसका युद्ध[a]—क्या ये सब इस्राएल के राजाओं के इतिहास की पुस्तक[b] में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अमस्याह के विरुद्ध उसका युद्ध।’ इब्रानी पूर्वसर्ग का शाब्दिक अर्थ ‘साथ’ है, पर युद्ध के संदर्भ में इसका अर्थ विरोध में युद्ध करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘इस्राएल के राजाओं के राजकीय वृत्तांतों की पुस्तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: बाकी कामों
  rationale: राजाओं की पुस्तक में यह राजकीय सारांश का प्रचलित सूत्र है। यहाँ דְּבָרִים का अर्थ केवल ‘बातें’ नहीं, बल्कि राजा के कार्य और घटनाएँ हैं।
- source_word: יְהוֹאָשׁ
  choice: यहोआश
  rationale: यह पूर्ण इब्रानी नाम יְהוֹאָשׁ का सीधा देवनागरी लिप्यंतरण है और छोटे रूप ‘योआश’ से इसे अलग रखता है।
- source_word: אֲשֶׁר עָשָׂה
  choice: अर्थात उसने जो कुछ किया
  rationale: इस संबंधवाचक उपवाक्य को स्पष्ट रूप से रखा गया है, ताकि मूल पाठ का कोई घटक छूटे नहीं; ‘अर्थात’ इसे पिछले ‘कामों’ से स्वाभाविक रूप से जोड़ता है।
- source_word: וּגְבוּרָתוֹ
  choice: उसकी वीरता
  rationale: גְּבוּרָה शक्ति, पराक्रम या वीरता सूचित कर सकता है। युद्ध-संबंधी संदर्भ में ‘वीरता’ स्वाभाविक है और शौर्य तथा सामर्थ्य दोनों का भाव रखती है।
- source_word: וַאֲשֶׁר נִלְחַם עִם
  choice: उसने ... के साथ जो युद्ध किया
  rationale: עִם का मूल अर्थ ‘साथ’ है; युद्ध के संदर्भ में विरोध स्वतः स्पष्ट है। विकल्प ‘के विरुद्ध’ को पादटिप्पणी में दिया गया है।
- source_word: אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अमस्याह
  rationale: राजकीय उपाधि और नाम को आधुनिक हिन्दी की स्वाभाविक पद-रचना में रखा गया है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वह ... नहीं लिखा है?
  rationale: मूल का आलंकारिक प्रश्न सुरक्षित है। हिन्दी में निकटवर्ती सामूहिक संज्ञा ‘वर्णन’ के कारण एकवचन क्रिया स्वाभाविक है, जबकि सभी उल्लिखित बातों का सामूहिक आशय बना रहता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक
  rationale: यह राजकीय अभिलेख के शीर्षक का सुबोध हिन्दी रूप है। शाब्दिक ‘दिनों की बातों की पुस्तक’ हिन्दी में अर्थ स्पष्ट नहीं करता; ‘इतिहास’ घटनाक्रम के लिखित राजकीय अभिलेख को व्यक्त करता है।
