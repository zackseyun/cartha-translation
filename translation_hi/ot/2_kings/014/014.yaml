base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
translation:
  language: hi
  text: उसने सारा सोना-चाँदी, यहोवा के भवन और राजभवन के भंडारों में पाए गए सभी पात्र, और बंधकों[a] को ले लिया और शोमरोन लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जमानत के पुत्र” या “जमानतदारों के पुत्र”; संभवतः आशय ऐसे लोगों से है जिन्हें सुरक्षा के रूप में रखा गया था—अर्थात बंधक।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: उसने ... ले लिया
  rationale: इब्रानी कथानक में यह अगली क्रमिक कार्रवाई है; हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  choice: सारा सोना-चाँदी
  rationale: כָּל की समग्रता को रखते हुए यह आधुनिक हिन्दी का स्वाभाविक और संक्षिप्त प्रयोग है।
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים בֵּית יְהוָה
  choice: यहोवा के भवन में पाए गए सभी पात्र
  rationale: כֵּלִים का मंदिर-संदर्भ में उपयुक्त अर्थ ‘पात्र’ है; ‘भवन’ मूल के בֵּית को बनाए रखता है।
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: और राजभवन के भंडारों में जो कुछ था
  rationale: पूर्ववर्ती כָּל הַכֵּלִים और स्थान-सूचक वाक्यांश का आशय सहज हिन्दी में व्यक्त किया गया है; בֵּית הַמֶּלֶךְ को ‘राजभवन’ कहना आधुनिक पाठक के लिए स्पष्ट है।
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  choice: बंधकों
  rationale: शाब्दिक रूप कठिन है और प्रसंग में सुरक्षा अथवा जमानत के रूप में रखे गए व्यक्तियों, अर्थात बंधकों, का संकेत देता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיָּשָׁב שֹׁמְרוֹנָה
  choice: और शोमरोन लौट गया
  rationale: שוב और दिशासूचक प्रत्यय का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘यहोवा’ हिन्दी में पहचाना जाने वाला पारंपरिक लिप्यंतरण है और नाम को उपाधि में परिवर्तित नहीं करता।
