base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/002.yaml
  text: He was twenty-five years old when he became king[a], and he reigned twenty-nine years in Jerusalem. His mother’s name was Jehoaddin, from Jerusalem.
translation:
  language: hi
  text: जब वह राजा बना, तब वह पच्चीस वर्ष का था, और उसने यरूशलेम में उनतीस वर्ष तक राज किया। उसकी माता का नाम यहोअद्दीन[a] था; वह यरूशलेम की रहनेवाली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का परंपरागत रूप “यहोअद्दान” भी मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: पच्चीस वर्ष का था
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; हिंदी में इसका स्वाभाविक अर्थ इसी प्रकार व्यक्त होता है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: राजकीय अभिषेक अथवा शासनारंभ के इस सूत्र को आधुनिक हिंदी में स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וְעֶשְׂרִים וָתֵשַׁע שָׁנָה מָלַךְ
  choice: उसने ... उनतीस वर्ष तक राज किया
  rationale: מָלַךְ यहाँ शासन की अवधि बताता है; 'राज किया' हिंदी बाइबलीय गद्य में सटीक और सहज है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग בִּ का सीधा और स्वाभाविक अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: मूल के मातृ-परिचय सूत्र को गरिमापूर्ण, आधुनिक हिंदी में रखा गया है।
- source_word: יהועדין
  choice: यहोअद्दीन
  rationale: डब्ल्यूएलसी के स्वरांकन יְהוֹעַדִּין के अनुरूप नाम का लिप्यंतरण किया गया है; परंपरागत वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִן יְרוּשָׁלָם
  choice: वह यरूशलेम की रहनेवाली थी
  rationale: מִן मूलतः उद्गम या संबंध बताता है। व्यक्ति के परिचय में 'यरूशलेम की रहनेवाली' आधुनिक हिंदी में 'यरूशलेम से' की अपेक्षा अधिक स्पष्ट है, जबकि मूल आशय सुरक्षित रहता है।
