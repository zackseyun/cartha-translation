  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: The rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: यारोबाम के बाकी कामों का वर्णन, उसने जो कुछ किया, उसका पराक्रम—कि वह कैसे लड़ा और कैसे उसने दमिश्क और हमात को इस्राएल में यहूदा के लिए फिर से प्राप्त किया[a]—क्या यह सब इस्राएल के राजाओं के इतिहास की पुस्तक में नहीं लिखा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘यहूदा के लिए, इस्राएल में’ है। यह पदबंध कठिन है। इसका अर्थ इस्राएल के लिए वह क्षेत्र फिर से प्राप्त करना हो सकता है जो कभी यहूदा का था, या इसमें कोई पुराना भू-राजनीतिक नाम सुरक्षित हो सकता है। मुख्य पाठ इस अस्पष्टता का समाधान किए बिना इब्रानी पदबंध को यथासंभव निकटता से रखता है।
    reason: मूल इब्रानी पदबंध की वास्तविक ऐतिहासिक और व्याकरणिक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יָרָבְעָם
  choice: यारोबाम के बाकी कामों का वर्णन
  rationale: यह राजकीय सारांश का प्रचलित सूत्र है। דִּבְרֵי का शाब्दिक अर्थ ‘बातें/विषय’ हो सकता है, पर इस इतिहास-वर्णन में ‘काम’ स्वाभाविक और संदर्भानुकूल है। वाक्य-संरचना को सहज बनाने के लिए ‘वर्णन’ जोड़ा गया है, जिसका आधार अंत में आने वाला ‘लिखा है’ है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: यह עשה के व्यापक अर्थ को बिना सीमित किए सीधे व्यक्त करता है।
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחָם
  choice: जिस वीरता से वह लड़ा
  rationale: גְּבוּרָה यहाँ युद्ध-संबंधी सामर्थ्य या पराक्रम को दर्शाता है; ‘वीरता’ और उसके साथ ‘लड़ा’ हिंदी में संक्षिप्त तथा स्वाभाविक संयोजन है।
- source_word: וַאֲשֶׁר הֵשִׁיב
  choice: और कैसे उसने ... फिर से प्राप्त किया
  rationale: हिफ़ील הֵשִׁיב का अर्थ लौटाना, पुनः स्थापित करना या फिर से प्राप्त करना हो सकता है। भू-राजनीतिक संदर्भ में ‘फिर से प्राप्त किया’ उपयुक्त है और यह स्पष्ट नहीं करता कि उसने इन्हें ठीक किस पक्ष को लौटाया।
- source_word: אֶת דַּמֶּשֶׂק וְאֶת חֲמָת
  choice: दमिश्क और हमात को
  rationale: स्थान-नामों के प्रचलित हिंदी रूप रखे गए हैं।
- source_word: לִיהוּדָה בְּיִשְׂרָאֵל
  choice: इस्राएल में यहूदा के लिए
  rationale: इब्रानी पदबंध कठिन और संक्षिप्त है। यह रूप לִיהוּדָה (‘यहूदा के लिए/को’) और בְּיִשְׂרָאֵל (‘इस्राएल में’) दोनों को निकटता से रखता है और किसी एक ऐतिहासिक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाता।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या यह सब ... नहीं लिखा है?
  rationale: यह राजकीय वृत्तांतों के अंत में प्रयुक्त आलंकारिक प्रश्न का स्वाभाविक हिंदी रूप है। बहुवचन संदर्भ को ‘यह सब’ समेटता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक में
  rationale: यह अभिलेखीय स्रोत के शीर्षक का पठनीय हिंदी रूप है। ‘इतिहास’ דִּבְרֵי הַיָּמִים के घटनावृत्त/राजकीय अभिलेख के भाव को व्यक्त करता है।
theological_decisions:
- issue: לִיהוּדָה בְּיִשְׂרָאֵל का ऐतिहासिक-भौगोलिक संबंध
  choice: मुख्य पाठ में ‘इस्राएल में यहूदा के लिए’ रखकर अस्पष्टता बनाए रखी गई।
  alternative: ‘इस्राएल के लिए वे क्षेत्र फिर से प्राप्त किए जो यहूदा के थे’ अथवा ‘दमिश्क और हमात को इस्राएल के लिए फिर से प्राप्त किया’
  rationale: मसोराई पाठ कठिन है और यह स्पष्ट नहीं करता कि ‘यहूदा’ पुराने स्वामित्व, किसी भू-राजनीतिक पदनाम या लाभार्थी को सूचित करता है। किसी एक सामंजस्यकारी अर्थ को चुनना मूल पाठ से अधिक निश्चितता पैदा करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय सारांश की औपचारिकता बनाए रखते हुए वाक्य को हिंदी की स्वाभाविक प्रश्नात्मक संरचना में ढाला गया है। कठिन भू-राजनीतिक पदबंध को जानबूझकर कुछ असामान्य रखा गया है और पादटिप्पणी से स्पष्ट किया गया है।
