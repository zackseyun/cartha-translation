  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
translation:
  language: hi
  text: उसने वही किया जो यहोवा[a] की दृष्टि में सही था, फिर भी[b] उसने अपने पिता दाऊद[c] के समान नहीं किया। उसने हर बात में वैसा ही किया जैसा उसके पिता योआश[d] ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा’ परमेश्वर के इब्रानी व्यक्तिगत नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: divine_name
  - marker: b
    text: या, ‘केवल इतना कि उसने अपने पिता दाऊद के समान नहीं किया।’ इब्रानी רַק सकारात्मक कथन पर सीमा लगाता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘पिता’ का अर्थ वंश का पूर्वज है; दाऊद उसका तत्काल पिता नहीं था।
    reason: cultural_note
  - marker: d
    text: ‘योआश’ नाम को कुछ अनुवादों में ‘यहोआश’ भी लिखा जाता है।
    reason: lexical_alternative
