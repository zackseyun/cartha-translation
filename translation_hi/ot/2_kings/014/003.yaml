  rationale: सकारात्मक मूल्यांकन के बाद आने वाली सीमा अथवा विरोध को सहज रूप से व्यक्त करता है; ‘केवल’ भी सम्भव है।
- source_word: לֹא כְּדָוִד אָבִיו
