- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: हर बात में ... वैसा ही किया जैसा ... ने किया था
  rationale: כְּכֹל की व्यापकता और तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹאָשׁ אָבִיו
  choice: उसके पिता योआश
  rationale: यहाँ יוֹאָשׁ का सीधा हिन्दी लिप्यंतरण ‘योआश’ है और ‘पिता’ तत्काल पारिवारिक सम्बन्ध बताता है।
theological_decisions:
- issue: राजकीय मूल्यांकन में प्रशंसा और सीमा का संतुलन
  choice: अमस्याह ने यहोवा की दृष्टि में सही किया, पर वह दाऊद के समान नहीं था और उसका आचरण योआश के नमूने के अनुरूप था।
  alternative: आरम्भिक प्रशंसा पर इतना बल देना कि दाऊद से तुलना की सीमा गौण हो जाए, अथवा सीमा पर इतना बल देना कि सकारात्मक मूल्यांकन केवल औपचारिक लगे।
  rationale: इब्रानी वाक्य पहले वास्तविक सकारात्मक मूल्यांकन देता है और फिर רַק द्वारा उसे सीमित करता है; अनुवाद दोनों पक्षों का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘की दृष्टि में’ मूल मुहावरे को बनाए रखता है, जबकि ‘हर बात में वैसा ही’ तुलना को सहज हिन्दी में व्यक्त करता है।
