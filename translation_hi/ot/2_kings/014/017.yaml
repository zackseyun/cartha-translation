  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
translation:
  language: hi
  text: यहूदा का राजा, योआश[a] का पुत्र अमस्याह, इस्राएल के राजा यहोआहाज के पुत्र यहोआश की मृत्यु के बाद पंद्रह वर्ष जीवित रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘योआश’ और ‘यहोआश’ एक ही नाम की दो अलग इब्रानी वर्तनियों को दर्शाते हैं। दोनों रूप अलग रखे गए हैं, ताकि यहूदा के राजा और इस्राएल के राजा के बीच भ्रम न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: जीवित रहा
  rationale: यह क्रिया यहाँ किसी दूसरे राजा की मृत्यु के बाद एक निश्चित अवधि तक जीवन जारी रहने की बात कहती है। ‘जीवित रहा’ स्वाभाविक है और ‘उससे अधिक जीवित रहा’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: בֶן
  choice: का पुत्र
  rationale: राजकीय परिचय में यह सीधा पिता-पुत्र संबंध व्यक्त करता है।
- source_word: יוֹאָשׁ
  choice: योआश
  rationale: यहूदा के राजा के नाम की इस पद में प्रयुक्त संक्षिप्त इब्रानी वर्तनी को दर्शाता है और इस्राएल के ‘यहोआश’ से भेद बनाए रखता है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: पद और राज्य का सीधा तथा स्वाभाविक हिन्दी निरूपण।
- source_word: אַחֲרֵי מוֹת
  choice: की मृत्यु के बाद
  rationale: इब्रानी के संबंधसूचक संज्ञा-वाक्यांश को निकटता से सुरक्षित रखता है।
- source_word: יְהוֹאָשׁ
  choice: यहोआश
  rationale: इस्राएल के राजा के नाम की इस पद में प्रयुक्त पूर्ण इब्रानी वर्तनी को दर्शाता है और ‘योआश’ से भेद स्पष्ट रखता है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: उत्तरी राज्य और राजकीय पद का सीधा हिन्दी निरूपण।
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: पंद्रह वर्ष
  rationale: अवधि बताने वाली इब्रानी संख्या का मानक हिन्दी रूप।
