  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
translation:
  language: hi
  text: तूने निश्चय ही एदोम को मारा है, और तेरा मन घमंड से भर गया है।[a] इसी सम्मान में संतुष्ट रह[b] और अपने घर में बैठा रह। तू क्यों विपत्ति मोल लेता है, जिससे तू गिर पड़े—तू और तेरे साथ यहूदा भी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तेरे हृदय ने तुझे उठा लिया है।” यह अभिमान का इब्रानी मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: या “अपना गौरव कर” अथवा “सम्मानित हो।” आशय संभवतः एदोम पर विजय से मिले सम्मान को पर्याप्त मानना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  choice: तूने निश्चय ही ... मारा है
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की तीव्रता को ‘निश्चय ही’ से व्यक्त किया गया है; ‘मारा’ נכה के निकट रहता है और सैन्य संदर्भ में स्वाभाविक है।
- source_word: אֶת אֱדוֹם
  choice: एदोम को
  rationale: प्रत्यक्ष कर्म के रूप में राष्ट्र एदोम को सरलता से प्रस्तुत करता है।
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  choice: तेरा मन घमंड से भर गया है
  rationale: शाब्दिक चित्र ‘तेरे हृदय ने तुझे उठा लिया’ अभिमान का इब्रानी मुहावरा है। आधुनिक हिन्दी में अर्थ स्पष्ट रखने के लिए मुहावरे का आशय मुख्य पाठ में दिया गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: הִכָּבֵד
  choice: इसी सम्मान में संतुष्ट रह
  rationale: निफ़अल आज्ञार्थक का संदर्भगत भाव विजय से मिले सम्मान को पर्याप्त मानने का है। यह अस्पष्ट ‘सम्मानित हो’ से अधिक स्वाभाविक है, पर ‘डींग मार’ जैसा अधिक नकारात्मक अर्थ नहीं जोड़ता।
- source_word: וְשֵׁב בְּבֵיתֶךָ
  choice: और अपने घर में बैठा रह
  rationale: इब्रानी संरचना और आगे युद्ध न छेड़ने की सलाह—दोनों को बनाए रखता है।
- source_word: תִתְגָּרֶה בְּרָעָה
  choice: विपत्ति को ललकारता है
  rationale: हितपाएल क्रिया में स्वयं संघर्ष भड़काने या चुनौती देने का भाव है; רָעָה यहाँ नैतिक बुराई के बजाय अनिष्ट या विपत्ति है।
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  choice: कि तू गिर पड़े—तू और तेरे साथ यहूदा भी
  rationale: राजा के पतन के साथ यहूदा के पतन पर दिए गए बल और परिणामसूचक संबंध को सुरक्षित रखता है।
