  yaml_path: translation/ot/2_kings/014/007.yaml
  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
translation:
  language: hi
  text: उसने नमक की घाटी में एदोम के दस हज़ार लोगों को मार गिराया। उसने युद्ध में सेला[a] को अपने अधिकार में कर लिया और उसका नाम योक्तेल रखा; वह आज तक इसी नाम से जाना जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेला” का शाब्दिक अर्थ “चट्टान” या “खड़ी चट्टान” भी हो सकता है; यहाँ संभवतः यह एक स्थान का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: मार गिराया
  rationale: सैन्य प्रसंग में क्रिया का प्रहार और घातक पराजय का भाव स्वाभाविक रूप से व्यक्त होता है, पर अनावश्यक विस्तार नहीं जुड़ता।
- source_word: אֱדוֹם ... עֲשֶׂרֶת אֲלָפִים
  choice: एदोम के दस हज़ार लोगों
  rationale: मूल में शाब्दिक रूप से ‘एदोम’ है; संख्या के साथ आशय वहाँ के लोगों से है। यह रूप मूल संरचना और सहज हिन्दी दोनों को बनाए रखता है।
- source_word: בְּגֵיא הַמֶּלַח
  choice: नमक की तराई में
  rationale: भौगोलिक पदबंध का स्पष्ट और आधुनिक हिन्दी रूप; ‘तराई’ גיא के घाटी-सदृश निम्न भूभाग को व्यक्त करती है।
- source_word: וְתָפַשׂ
  choice: अपने अधिकार में कर लिया
  rationale: युद्ध में किसी स्थान को पकड़ने या जीतकर कब्ज़े में लेने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַסֶּלַע
  choice: सेला
  rationale: प्रसंग में इसे स्थान-नाम मानना सबसे संभावित है; ‘चट्टान’ का शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: मूल सैन्य परिस्थिति का सीधा और संक्षिप्त अनुवाद।
- source_word: וַיִּקְרָא אֶת שְׁמָהּ
  choice: उसका नाम ... रखा
  rationale: इब्रानी नामकरण सूत्र का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: יָקְתְאֵל
  choice: योक्तेल
  rationale: इब्रानी स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक चला आ रहा है
  rationale: यह स्पष्ट करता है कि लेखक के समय तक वही नाम प्रचलित था।
