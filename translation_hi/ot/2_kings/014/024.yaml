id: 2KI.14.24
reference: 2 Kings 14:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
translation:
  language: hi
  text: उसने वह किया जो याहवे की दृष्टि में बुरा था। वह नबात के पुत्र यारोबाम के किसी भी पाप से नहीं फिरा[a], जिसने इस्राएल से पाप करवाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नबात के पुत्र यारोबाम के किसी भी पाप से नहीं फिरा, जिनके द्वारा यारोबाम ने इस्राएल से पाप करवाया था।” इब्रानी संबंधवाचक उपवाक्य को सीधे यारोबाम से, या उसके पापों को साधन मानकर, समझा जा सकता है।
    reason: संबंधवाचक उपवाक्य के पूर्वपद की व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वही किया जो ... बुरा था
  rationale: इब्रानी मुहावरे ‘बुरा करना’ को स्वाभाविक हिन्दी में नैतिक मूल्यांकन के रूप में व्यक्त किया गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: ‘आँखों में’ का भावार्थ दैवी मूल्यांकन है; ‘दृष्टि में’ हिन्दी का निकट और स्वाभाविक समतुल्य है। परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ रूप में रखा गया है।
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: किसी भी पाप से नहीं फिरा
  rationale: नकार के साथ מִכָּל व्यापक अर्थ देता है—उसने उन पापों में से एक को भी नहीं छोड़ा। ‘नहीं फिरा’ סור के मार्ग या आचरण से हटने के भाव को बनाए रखता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: वंश-संबंध को सामान्य, गरिमापूर्ण हिन्दी क्रम में व्यक्त किया गया है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप הֶחֱטִיא का कारणवाचक अर्थ ‘पाप करवाना’ है। मुख्य पाठ में संबंधवाचक उपवाक्य को यारोबाम से जोड़ा गया है, जो निकटवर्ती व्यक्तिगत पूर्वपद और पारंपरिक सूत्र के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है; अतः उसका लिप्यंतरण किया गया है।
- issue: אֲשֶׁר उपवाक्य का पूर्वपद
  choice: 'सीधे यारोबाम से संबद्ध: ‘जिसने इस्राएल से पाप करवाया था’'
  alternative: 'पापों/रीतियों को साधन मानकर: ‘जिनके द्वारा उसने इस्राएल से पाप करवाया था’'
  rationale: अव्यय אֲשֶׁר अपने आप वचन स्पष्ट नहीं करता। वाक्य का निकटतम व्यक्तिगत कर्ता यारोबाम है और राजाओं की पुस्तक का सूत्र भी इसी अर्थ का समर्थन करता है; फिर भी साधनवाचक संबंध व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘याहवे’, ‘इस्राएल’, ‘यारोबाम’ और ‘नबात’ मूल नामों के प्रचलित निकट लिप्यंतरण हैं; ‘पाप करवाया’ कारणवाचक इब्रानी रूप को सामान्य पाठक के लिए स्पष्ट करता है।
