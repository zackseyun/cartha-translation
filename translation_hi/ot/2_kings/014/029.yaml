  text: וַ/יִּשְׁכַּ֤ב יָֽרָבְעָם֙ עִם אֲבֹתָ֔י/ו עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ זְכַרְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
translation:
  language: hi
  text: और यारोबाम अपने पुरखों के साथ सो गया[a], इस्राएल के राजाओं के साथ[b]; और उसका पुत्र जकर्याह उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पुरखों के साथ लेट गया”; यह इब्रानी मुहावरा किसी राजा की मृत्यु बताने वाला पारंपरिक वाक्यांश है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएल के राजाओं के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: यह राजाओं की मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी मुहावरा है। ‘सो गया’ मूल साहित्यिक रूपक को बनाए रखता है; केवल ‘मर गया’ कहना उसके मुहावरेदार रूप को मिटा देता।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखों के साथ
  rationale: ‘पुरखे’ आधुनिक हिन्दी में वंश के पहले लोगों को स्वाभाविक ढंग से व्यक्त करता है और राजकीय मृत्यु-सूत्र की गरिमा बनाए रखता है।
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के साथ
  rationale: दोहराए गए עִם को ‘साथ’ से व्यक्त किया गया है। वाक्यांश मृत इस्राएली राजाओं के समूह से यारोबाम का संबंध बताता है, पर उसका ठीक आशय कुछ हद तक खुला है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य करने लगा
  rationale: राजकीय उत्तराधिकार के इस प्रसंग में यह स्वाभाविक हिन्दी है और क्रिया के राजत्व-संबंधी अर्थ को स्पष्ट रखती है।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: यह इस इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय रूप है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: मूल के सीधे पुत्र-संबंध को यथावत व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के संदर्भ में यह मूल पद का सीधा और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ‘अपने पुरखों के साथ सो गया’ का आशय
  choice: मृत्यु के पारंपरिक राजकीय मुहावरे को शाब्दिक रूपक सहित रखा गया
  alternative: ‘मर गया’
  rationale: पाठ मृत्यु की बात करता है, पर इब्रानी जानबूझकर ‘सोने’ का मुहावरा अपनाता है। अनुवाद उस रूपक को किसी विशिष्ट परलोक-सिद्धांत में बदले बिना सुरक्षित रखता है।
- issue: ‘इस्राएल के राजाओं के साथ’ का संबंध
  choice: עִם का सीधा अर्थ ‘के साथ’ रखा गया
  alternative: ‘इस्राएल के राजाओं के बीच’
  rationale: मूल वाक्यांश संगति या समूह में सम्मिलित होने—दोनों की छाया रख सकता है; मुख्य पाठ में सीधा रूप और पादटिप्पणी में विकल्प देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरखों’ और ‘सो गया’ से मूल राजकीय मृत्यु-सूत्र का रूप बना रहता है, जबकि पादटिप्पणियाँ उसके अर्थ और वास्तविक भाषिक विकल्प स्पष्ट करती हैं।
