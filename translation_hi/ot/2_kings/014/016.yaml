  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय मृत्यु और उत्तराधिकार के सूत्रबद्ध स्वरूप को बनाए रखते हुए वाक्य-विन्यास स्वाभाविक हिन्दी के अनुसार किया गया है।
