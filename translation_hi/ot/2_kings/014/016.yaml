  text: וַ/יִּשְׁכַּ֤ב יְהוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יָרָבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: hi
  text: और यहोआश अपने पुरखाओं के साथ सो गया[a] और सामरिया में इस्राएल के राजाओं के साथ दफ़नाया गया। उसका पुत्र यारोबाम उसके स्थान पर राज्य करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उसकी मृत्यु हो गई। यह राजाओं की मृत्यु बताने का एक परंपरागत इब्रानी ढंग है।
    reason: ‘अपने पुरखाओं के साथ सो गया’ के रूपक को बनाए रखते हुए आधुनिक पाठक के लिए उसका मृत्यु-संबंधी आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजकीय मृत्यु-वृत्तांत में यह क्रिया ‘अपने पुरखाओं के साथ’ के साथ मिलकर मृत्यु का परंपरागत रूपक है। ‘सो गया’ मूल रूपक और सूत्रबद्ध शैली को बनाए रखता है; फुटनोट उसका आशय स्पष्ट करता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह राजाओं की मृत्यु से जुड़ा प्रचलित इब्रानी सूत्र है। ‘पुरखाओं’ सहज आधुनिक हिन्दी में पूर्ववर्ती पितरों/पूर्वजों का भाव व्यक्त करता है और ‘पिताओं’ की संभावित जैविक संकीर्णता से बचता है।
- source_word: וַיִּקָּבֵר
  choice: दफ़नाया गया
  rationale: निफ़अल का कर्मवाच्य रूप हिन्दी में स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: यहाँ בְ स्थानसूचक है; ‘में’ दफ़नाने के स्थान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के साथ
  rationale: עִם का सीधा भाव ‘के साथ’ है और यह अन्य इस्राएली राजाओं के संग दफ़नाए जाने का संबंध बनाए रखता है।
- source_word: וַיִּמְלֹךְ
  choice: राज्य करने लगा
  rationale: उत्तराधिकार के इस प्रसंग में מלך नए शासन के आरंभ को बताता है। हिन्दी में ‘राज्य करने लगा’ घटना-क्रम और शासन, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद केवल कालक्रम नहीं, बल्कि पद पर उत्तराधिकार और प्रतिस्थापन बताता है; ‘उसके स्थान पर’ इस अर्थ को सुरक्षित रखता है।
