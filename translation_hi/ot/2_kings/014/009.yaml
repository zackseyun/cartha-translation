base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
translation:
  language: hi
  text: 'तब इस्राएल के राजा यहोआश ने यहूदा के राजा अमस्याह के पास यह संदेश भेजा: “लबानोन की कँटीली झाड़ी[a] ने लबानोन के देवदार के पास यह संदेश भेजा, ‘अपनी बेटी का विवाह मेरे बेटे से कर दे।’ और लबानोन का एक जंगली पशु[b] वहाँ से गुजरा और उसने उस कँटीली झाड़ी को रौंद डाला।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काँटेदार पौधा” अथवा “कँटीला झाड़”; यहाँ प्रयुक्त इब्रानी शब्द किसी काँटेदार पौधे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “मैदान का पशु,” अर्थात कोई जंगली पशु।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... यह संदेश भेजा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी क्रम व्यक्त करता है। प्रसंग में भेजी गई वस्तु वाणी/संदेश है, इसलिए ‘संदेश भेजा’ स्पष्ट और स्वाभाविक है।
- source_word: הַחוֹחַ
  choice: कँटीली झाड़ी
  rationale: חוֹחַ किसी काँटेदार पौधे को दर्शाता है; ‘कँटीली झाड़ी’ देवदार के साथ उसके छोटेपन और तुच्छता के विरोध को बनाए रखती है, पर किसी निश्चित वनस्पति-जाति का दावा नहीं करती।
- source_word: הָאֶרֶז
  choice: देवदार
  rationale: אֶרֶז का प्रचलित और संदर्भानुकूल हिन्दी रूप; दृष्टान्त में वैभव और ऊँचाई का विरोध सुरक्षित रहता है।
- source_word: בַּלְּבָנוֹן
  choice: लबानोन में / लबानोन का
  rationale: स्थान-सूचक प्रयोग को हिन्दी वाक्य-संरचना के अनुसार स्वाभाविक ढंग से व्यक्त किया गया है और मूल की पुनरावृत्ति बनाए रखी गई है।
- source_word: תְּנָה אֶת־בִּתְּךָ לִבְנִי לְאִשָּׁה
  choice: अपनी बेटी का विवाह मेरे बेटे से कर दे
  rationale: शाब्दिक अर्थ ‘अपनी बेटी मेरे बेटे को पत्नी के रूप में दे’ है; चुना हुआ रूप आधुनिक हिन्दी में वही विवाह-संबंधी आशय स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: חַיַּת הַשָּׂדֶה
  choice: जंगली पशु
  rationale: शाब्दिक वाक्यांश ‘मैदान का पशु’ सामान्यतः वन्य जीव को सूचित करता है; ‘जंगली पशु’ दृष्टान्त की सजीवता और अनिश्चित प्रजाति दोनों बनाए रखता है।
- source_word: וַתַּעֲבֹר
  choice: उधर से निकला
  rationale: पशु के वहाँ से गुजरने की आकस्मिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּרְמֹס
  choice: रौंद डाला
  rationale: רמס का पैरों तले कुचलने का सजीव बल हिन्दी में स्पष्ट रूप से व्यक्त होता है।
