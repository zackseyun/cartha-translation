base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
translation:
  language: hi
  text: तब एलिय्याह ने अपना लबादा[a] लिया, उसे लपेटा और पानी पर प्रहार किया। पानी इधर और उधर बँट गया[b], और वे दोनों सूखी भूमि पर पार चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चोगा।’ इब्रानी शब्द एलिय्याह के बाहरी वस्त्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘इधर और उधर बँट गया,’ अर्थात् दोनों विपरीत ओर।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  choice: अपनी चादर
  rationale: यह शब्द एलिय्याह के विशिष्ट बाहरी वस्त्र को दर्शाता है। आधुनिक हिन्दी में ‘चादर’ सहज है और उसे लेने, लपेटने तथा उससे प्रहार करने की क्रियाओं के अनुकूल है।
- source_word: וַיִּגְלֹם
  choice: उसे लपेटा
  rationale: क्रिया वस्त्र को समेटकर या लपेटकर प्रहार के लिए तैयार करने का संकेत देती है; ‘लपेटा’ स्वाभाविक और संक्षिप्त है।
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: पानी पर मारा
  rationale: नכה का मूल अर्थ प्रहार करना है। ‘पानी पर मारा’ हिन्दी में स्वाभाविक ढंग से बलयुक्त क्रिया को बनाए रखता है।
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: पानी दो विपरीत दिशाओं में बँट गया
  rationale: बहुवचन क्रिया का आशय जल से है और הֵנָּה וָהֵנָּה उसके दोनों ओर हटने को व्यक्त करता है। यह अनुवाद अस्पष्ट ‘इधर-उधर’ के बजाय प्रसंगगत दिशा स्पष्ट करता है, बिना घटना में कुछ जोड़े।
- source_word: וַיַּעַבְרוּ שְׁנֵיהֶם
  choice: वे दोनों ... पार चले गए
  rationale: ‘दोनों’ मूल के स्पष्ट द्वैत बल को सुरक्षित रखता है।
- source_word: בֶּחָרָבָה
  choice: सूखी भूमि पर होकर
  rationale: यह शब्द पानी हटने से प्रकट सूखे स्थल को दर्शाता है; वाक्यांश चमत्कारी पारगमन के प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: וַיִּקַּח
  choice: तब एलिय्याह ने ... ली
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को सहजता से व्यक्त करता है।
theological_decisions:
- issue: पानी का चमत्कारी रूप से विभाजित होना
  choice: 'घटना को सीधे ऐतिहासिक कथा के रूप में प्रस्तुत किया गया है: एलिय्याह के पानी पर मारने के बाद पानी बँटता है और दोनों सूखी भूमि पर पार जाते हैं।'
  alternative: घटना को प्राकृतिक कारण से समझाना या ‘पानी हट गया’ जैसे अधिक व्याख्यात्मक शब्दों में कहना।
  rationale: इब्रानी पाठ प्रहार, पानी के विभाजन और सूखी भूमि पर पार जाने का सीधा वर्णन करता है। अनुवाद न घटना को स्वाभाविक बनाता है, न उसमें धार्मिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली। ‘चादर’ सामान्य पाठक के लिए सहज है; पादटिप्पणी वैकल्पिक ‘ओढ़ना’ और मूल पदबंध की शाब्दिक संरचना सुरक्षित रखती है।
