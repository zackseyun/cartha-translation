  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ का प्रयोग निकट गुरु-शिष्य संबंध के अनुकूल है; अत्यधिक पुरातन ‘तू/तेरा’ और औपचारिक बहुवचन ‘आप’ से बचा गया है। कर्मवाच्य ‘उठा लिया जाऊँ’ मूल पाठ की अनिर्दिष्ट कर्ता-रचना को सुरक्षित रखता है।
