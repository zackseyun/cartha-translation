  verdict: revise
  source_fidelity: The draft accurately represents the completed crossing, Elijah's imperative offer, the passive sense of his being taken away, the polite force of נא, and Elisha's request for a double share of Elijah's spirit. ‘मुझ पर हो’ is possible biblical phrasing, but the Hebrew preposition is more directly ‘to me’; ‘मुझे मिले’ is both natural Hindi and closer to that wording without deciding the precise mechanism of transmission.
  naturalness: The wording ‘माँगो कि मैं तुम्हारे लिए क्या करूँ’ is understandable but syntactically stiff in modern Hindi. Recasting it as a direct question is more idiomatic. ‘मुझे मिले’ is more natural than ‘मुझ पर हो’ in this request.
  terminology: ‘आत्मा’ appropriately preserves the Hebrew ambiguity and does not impose a technical identification with the Holy Spirit. ‘दुगुना भाग’ correctly retains the double-share idiom and its possible inheritance resonance. Names are consistently rendered as एलिय्याह and एलीशा.
