base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
translation:
  language: hi
  text: जब वे पार पहुँच गए, तब एलिय्याह ने एलीशा से कहा, “इससे पहले कि मैं तुम्हारे पास से उठा लिया जाऊँ, माँगो, मैं तुम्हारे लिए क्या करूँ?” एलीशा ने कहा, “कृपा करके, तुम्हारी आत्मा[a] का दुगुना भाग[b] मुझे मिले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारी आत्मा” से आशय एलिय्याह से जुड़ी भविष्यद्वक्ताई आत्मा या सामर्थ्य है। कुछ लोग इसे एलिय्याह की भविष्यद्वक्ताई शक्ति से दुगुनी शक्ति माँगना समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “तुम्हारी आत्मा के दो हिस्से।” यह हिब्रू मुहावरा “दुगुना भाग” दर्शाता है और संभवतः पहलौठे को मिलने वाले विरासत के हिस्से की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְעָבְרָם
  choice: जब वे पार पहुँच गए
  rationale: עבר के 3 पुं. बहु. प्रत्यय से एलिय्याह और एलीशा दोनों अभिप्रेत हैं। यह उपवाक्य पार जाने की क्रिया पूरी होने के बाद की घटना बताता है; इसलिए ‘पार पहुँच गए’ क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: שְׁאַל
  choice: माँगो
  rationale: שאל का सीधा आज्ञार्थ है। इस प्रसंग में ‘माँगो’ उस अनुरोध को व्यक्त करता है जिसे एलिय्याह पूरा करने की पेशकश कर रहा है।
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: कि मैं तुम्हारे लिए क्या करूँ
  rationale: यह वाक्यांश एलिय्याह की पेशकश को व्यक्त करता है। ‘क्या करूँ’ हिब्रू की विचारात्मक/संभावनात्मक छाया को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  choice: इससे पहले कि मैं तुम्हारे पास से उठा लिया जाऊँ
  rationale: 'לקח का निफ़अल रूप कर्मवाच्य है: एलिय्याह को उठाया जाएगा। ‘तुम्हारे पास से’ मूल पाठ में व्यक्त संबंध-विच्छेद को सुरक्षित रखता है, और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।'
- source_word: וִיהִי נָא
  choice: कृपा करके ... हो
  rationale: निवेदनसूचक रूप के साथ נָא अनुरोध को विनम्र बनाता है। ‘कृपा करके ... हो’ उस विनीत याचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּי שְׁנַיִם
  choice: दुगुना भाग
  rationale: यह मुहावरा शाब्दिक रूप से ‘दो का मुँह/माप’ है और सामान्यतः दुगुने हिस्से को दर्शाता है, विशेषकर विरासत में पहलौठे के हिस्से की पृष्ठभूमि में। ‘दुगुना भाग’ इस अर्थ और उसकी संभावित विरासत-संबंधी प्रतिध्वनि दोनों को बनाए रखता है।
- source_word: בְּרוּחֲךָ
  choice: तुम्हारी आत्मा
  rationale: यहाँ רוּחַ एलिय्याह से जुड़ी आत्मा अथवा उसकी भविष्यद्वक्ताई सामर्थ्य/सेवा को सूचित करती है। ‘तुम्हारी आत्मा’ संबंधसूचक प्रत्यय को बनाए रखता है और ‘पवित्र आत्मा’ जैसी अधिक विशिष्ट धर्मवैज्ञानिक पहचान पाठ पर आरोपित नहीं करता।
- source_word: אֵלָי
  choice: मुझ पर हो
  rationale: शाब्दिक अर्थ ‘मेरी ओर/मुझे’ है। आत्मा के संदर्भ में ‘मुझ पर हो’ स्वाभाविक बाइबलीय हिन्दी है और निहित क्रिया के साथ अनुरोध का आशय स्पष्ट करता है।
theological_decisions:
- issue: פִּי שְׁנַיִם בְּרוּחֲךָ में एलीशा के अनुरोध का अर्थ
  choice: एलीशा एलिय्याह की आत्मा का दुगुना भाग माँगता है, जिसमें संभवतः पहलौठे की विरासत के हिस्से की प्रतिध्वनि है।
  alternative: एलीशा एलिय्याह की तुलना में ठीक दुगुनी भविष्यद्वक्ताई शक्ति माँगता है।
  rationale: פִּי שְׁנַיִם का सबसे स्वाभाविक अर्थ दुगुना हिस्सा है। अनुवाद तुलना की शक्ति को निश्चित नहीं करता, बल्कि मूल पाठ की विरासत-संबंधी संभावना और अर्थगत तनाव को खुला रखता है।
- issue: ‘तुम्हारी आत्मा’ का संकेत
  choice: एलिय्याह से संबद्ध आत्मा या भविष्यद्वक्ताई वरदान/सामर्थ्य अभिप्रेत है।
  alternative: यह पद सीधे और तकनीकी अर्थ में त्रिएक परमेश्वर के व्यक्ति पवित्र आत्मा का नाम लेता है।
  rationale: संबंधसूचक प्रत्यय उस आत्मा की ओर संकेत करता है जो एलिय्याह से जुड़ी या उसकी विशेषता है। ‘तुम्हारी आत्मा’ मूल की अस्पष्टता बचाता है और उससे अधिक विशिष्ट धर्मसिद्धान्त नहीं जोड़ता।
