  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
translation:
  language: hi
  text: इस प्रकार जल चंगा हो गया और आज तक चंगा है, एलीशा के कहे हुए वचन के अनुसार[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुनः ठीक हो गया” अथवा “शुद्ध हो गया।” हिब्रू क्रिया सामान्यतः “चंगा होने” के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  choice: चंगा बना रहा
  rationale: רפא सामान्यतः ‘चंगा करना/होना’ है। यहाँ जल के स्वास्थ्यकर हो जाने और उस दशा के जारी रहने का भाव है; ‘चंगा’ मूल रूपक को बनाए रखता है।
- source_word: הַמַּיִם
  choice: जल
  rationale: हिब्रू מַיִם रूप की दृष्टि से बहुवचन है, पर आधुनिक मानक हिन्दी में इस जलस्रोत या जल-आपूर्ति के लिए सामूहिक एकवचन ‘जल’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: यह कथावाचक के वर्तमान समय तक परिणाम बने रहने को व्यक्त करने वाला हिब्रू मुहावरा है।
- source_word: כִּדְבַר
  choice: वचन के अनुसार
  rationale: דבר यहाँ पिछले पद में कही गई भविष्यद्वक्तापूर्ण घोषणा को सूचित करता है; ‘वचन’ कथन और उसकी पूर्ति के ठोस संबंध को सुरक्षित रखता है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: हिब्रू नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲשֶׁר דִּבֵּר
  choice: जो उसने कहा था
  rationale: संबंधवाचक उपवाक्य उस विशिष्ट कथन की पहचान करता है; हिन्दी में पूर्वकालिकता स्पष्ट करने के लिए ‘कहा था’ स्वाभाविक है।
theological_decisions:
- issue: जल के लिए चंगाई की भाषा
  choice: मुख्य पाठ में ‘चंगा’ का रूपक बनाए रखा गया।
  alternative: जल शुद्ध हो गया / जल स्वास्थ्यकर हो गया
  rationale: हिब्रू में רפא चंगा करने का सामान्य क्रियापद है। इसे बनाए रखने से भविष्यद्वक्ता के वचन द्वारा बहाली का पाठगत चित्र सुरक्षित रहता है, जबकि कोई अतिरिक्त सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘जल’ हिन्दी में सामूहिक संज्ञा के रूप में स्वाभाविक है। ‘ठीक ... के अनुसार’ prophetic speech और परिणाम के संबंध को स्पष्ट रखता है।
