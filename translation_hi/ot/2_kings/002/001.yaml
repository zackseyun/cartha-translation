  text: וַ/יְהִ֗י בְּ/הַעֲל֤וֹת יְהוָה֙ אֶת אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָ֑יִם וַ/יֵּ֧לֶךְ אֵלִיָּ֛הוּ וֶ/אֱלִישָׁ֖ע מִן הַ/גִּלְגָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/001.yaml
  text: It happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
translation:
  language: hi
  text: जब यहोवा एलिय्याह को बवंडर[a] में आकाश[b] में उठा ले जाने वाला था, तब एलिय्याह और एलीशा गिलगाल से चल पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आँधी में” अथवा “तूफ़ानी हवा में”; इसका अनुवाद “बवंडर के द्वारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग में।” इब्रानी में शाब्दिक रूप से “आकाशों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: तब
  rationale: यह कथात्मक सूत्र नए प्रसंग को आगे बढ़ाता है। हिन्दी में अलग से ‘ऐसा हुआ’ जोड़ने के बजाय ‘जब… तब…’ की स्वाभाविक रचना उसी कथात्मक संबंध को स्पष्ट करती है।
- source_word: בְּהַעֲלוֹת
  choice: जब ... उठा ले जाने वाला था
  rationale: ב के साथ infinitive construct समयगत परिस्थिति बताता है। आगे वर्णित आसन्न घटना के कारण भावी/निकटवर्ती अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है, किसी उपाधि से नहीं बदला गया।
- source_word: בַּסְעָרָה
  choice: बवंडर में
  rationale: סְעָרָה आँधी, तूफ़ान या बवंडर को सूचित कर सकता है। इस प्रसंग में ‘बवंडर’ उपयुक्त है; ב को माध्यम/परिवेश के अर्थ में ‘में’ रखा गया है।
- source_word: הַשָּׁמָיִם
  choice: आकाश की ओर
  rationale: बहुवचन रूप שׁמים यहाँ ऊपर की दिशा या आकाशीय गंतव्य बताता है। ‘आकाश की ओर’ प्राकृतिक हिन्दी है और ‘स्वर्ग’ का अर्थ भी पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיֵּלֶךְ
  choice: चल पड़े
  rationale: הלך यात्रा आरम्भ करने या आगे बढ़ने को बताता है; ‘चल पड़े’ इस कथात्मक गति को सहज हिन्दी में व्यक्त करता है।
- source_word: מִן הַגִּלְגָּל
  choice: गिलगाल से
  rationale: מן प्रस्थान-बिंदु बताता है; इसलिए सीधा अनुवाद ‘गिलगाल से’ है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम יהוה है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नाम-रूप रखा गया है।
- issue: הַשָּׁמָיִם का अर्थ
  choice: आकाश की ओर
  alternative: स्वर्ग में
  rationale: इब्रानी शब्द आकाश/आकाशों और स्वर्ग—दोनों भाव रख सकता है। मुख्य पाठ में दृश्य ऊर्ध्व दिशा को स्वाभाविक रूप से व्यक्त किया गया है, जबकि संभावित ‘स्वर्ग’ अर्थ पाद-टिप्पणी में दिया गया है; इससे पाठ अनावश्यक रूप से किसी विशिष्ट ब्रह्माण्ड-विज्ञान को निश्चित नहीं करता।
- issue: סְעָרָה के साथ ב का संबंध
  choice: बवंडर में
  alternative: बवंडर के द्वारा
  rationale: पूर्वसर्ग ב साधन या साथ/परिवेश दोनों बता सकता है। ‘में’ मूल की इस लचीली संबंध-भावना को अधिक निकटता से रखता है, जबकि साधनार्थ विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जब… तब…’ रचना इब्रानी कथात्मक सूत्र को अनावश्यक पुरातन शैली के बिना व्यक्त करती है। नामों के मानक हिन्दी रूप ‘एलिय्याह’, ‘एलीशा’ और ‘गिलगाल’ प्रयुक्त हुए हैं।
