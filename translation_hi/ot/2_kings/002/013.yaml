- source_word: אֵלִיָּהוּ
  choice: एलिय्याह
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप रखा गया है।
- source_word: אֲשֶׁר נָפְלָה מֵעָלָיו
  choice: जो उसके ऊपर से गिर गई थी
  rationale: מֵעָלָיו का ठोस अर्थ ‘उसके ऊपर से’ सुरक्षित रखा गया है, और ‘गिर गई थी’ मुख्य क्रिया से पहले हुई घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשָׁב
  choice: फिर वह लौटकर
  rationale: שׁוב का अर्थ लौटना है; ‘फिर’ कथा-क्रम को और ‘लौटकर’ अगली क्रिया से संबंध को सहज बनाता है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד के साधारण अर्थ ‘खड़ा होना’ को स्वाभाविक हिन्दी कथन में प्रस्तुत किया गया है।
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  choice: यरदन के तट पर
  rationale: שׂפה नदी के किनारे या तट को बताता है। ‘तट’ संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी है।
