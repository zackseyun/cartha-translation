  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह ... गया
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब ... गया’ स्वाभाविक क्रमबोध देता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह पहले उल्लिखित स्थान से प्रस्थान को व्यक्त करता है; ‘वहाँ से’ इसका स्पष्ट और निकट हिन्दी समतुल्य है।
- source_word: אֶל
  choice: पर
  rationale: पर्वत को गंतव्य बताने के लिए हिन्दी में ‘पर्वत पर गया’ स्वाभाविक प्रयोग है।
- source_word: הַר הַכַּרְמֶל
  choice: कर्मेल पर्वत
  rationale: नामित पर्वत के लिए यह मानक, स्पष्ट हिन्दी रूप है और हिब्रू संरचना का अर्थ सुरक्षित रखता है।
- source_word: וּמִשָּׁם
  choice: और वहाँ से
  rationale: यह संयोजक और स्थानवाचक क्रियाविशेषण यात्रा के अगले चरण को उसी पुनरुक्त शैली में जोड़ते हैं।
- source_word: שָׁב
  choice: लौट आया
  rationale: यात्रा-संदर्भ में שׁוּב का अर्थ लौटना है; कर्ता के पूर्व संबद्ध स्थान शोमरोन की ओर वापसी के लिए ‘लौट आया’ स्वाभाविक हिन्दी है।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: यह स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण है।
