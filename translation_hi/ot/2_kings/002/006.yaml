base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
translation:
  language: hi
  text: तब एलियाह ने उससे कहा, “कृपया यहीं ठहरो, क्योंकि यहोवा ने मुझे यरदन की ओर[a] भेजा है।” पर एलीशा ने कहा, “जीवित यहोवा की और आपके जीवन की शपथ[b], मैं आपको नहीं छोड़ूँगा।” तब वे दोनों आगे चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन नदी की ओर।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक शपथ-सूत्र है: “यहोवा के जीवन की और आपके जीवन की शपथ, यदि मैं आपको छोड़ूँ …।” इसका अर्थ है, “मैं निश्चय ही आपको नहीं छोड़ूँगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  choice: कृपया यहीं ठहरो
  rationale: ישׁב का संदर्भगत अर्थ यहाँ बैठना नहीं, बल्कि इसी स्थान पर रुक जाना है; נָא विनम्र आग्रह व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण क्रिया उस आदेश को बताती है जो दिया जा चुका है और वर्तमान यात्रा पर लागू है; हिन्दी पूर्ण वर्तमान स्वाभाविक है।
- source_word: הַיַּרְדֵּנָה
  choice: यरदन
  rationale: दिशासूचक ה गंतव्य की ओर गति दर्शाता है; नदी का नाम अकेला हिन्दी में स्वाभाविक है, जबकि ‘यरदन नदी’ भी संभव है।
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: जीवित यहोवा की और आपके जीवन की शपथ
  rationale: यह शपथ-सूत्र यहोवा और संबोधित व्यक्ति के जीवन को साक्षी बनाता है। हिन्दी में ‘की शपथ’ जोड़ने से इसका वाक्यगत कार्य स्पष्ट और गरिमापूर्ण रहता है।
- source_word: אִם אֶעֶזְבֶךָּ
  choice: मैं आपको नहीं छोड़ूँगा
  rationale: शपथ में אִם एक लुप्त आत्म-शाप वाली शर्त आरम्भ करता है; उसका आशय दृढ़ निषेध है। इसे शाब्दिक ‘यदि मैं छोड़ूँ’ करने से हिन्दी में अर्थ अधूरा और भ्रामक होगा।
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  choice: तब वे दोनों आगे चले गए
  rationale: שְׁנֵיהֶם दोनों व्यक्तियों के साथ बने रहने पर बल देता है; प्रसंग में ‘आगे चले गए’ यात्रा जारी रखने का भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: अधूरी शपथ-शर्त אִם אֶעֶזְבֶךָּ
  choice: 'अर्थगत दृढ़ निषेध: ‘मैं आपको नहीं छोड़ूँगा’'
  alternative: 'रूपगत: ‘यदि मैं आपको छोड़ूँ...’'
  rationale: मूल में परिणाम अथवा आत्म-शाप अनकहा है। मुख्य पाठ में अभिप्रेत निषेध दिया गया है, और पादटिप्पणी में इब्रानी संरचना सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक संबोधन और गरिमापूर्ण कथा-शैली अपनाई गई है। ‘ठहरो’ में एलियाह का आग्रह स्वाभाविक है, जबकि एलीशा के उत्तर में ‘आप’ गुरु के प्रति सम्मान दर्शाता है।
