source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
translation:
  language: hi
  text: एलिय्याह ने एलीशा से कहा, “कृपया यहीं ठहरो, क्योंकि याहवे ने मुझे बेतेल तक भेजा है[a]।” पर एलीशा ने कहा, “याहवे के जीवन की और आपके जीवन की शपथ, मैं आपको नहीं छोड़ूँगा[b]।” तब वे बेतेल तक उतर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ है, “मुझे बेतेल तक भेजा है”; इसे “मुझे बेतेल भेजा है” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू शपथ-विधि का शाब्दिक रूप है, “याहवे के जीवन और आपके जीवन की शपथ, यदि मैं आपको छोड़ूँ…”। इसका अभिप्राय है, “मैं आपको निश्चय ही नहीं छोड़ूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: कृपया यहीं ठहरो
  rationale: ישׁב का मूल अर्थ ‘बैठना’ भी हो सकता है, पर इस प्रसंग में एलिय्याह एलीशा से आगे साथ न आने और उसी स्थान पर रहने को कहता है। נָא की विनम्रता ‘कृपया’ से व्यक्त की गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: שְׁלָחַנִי עַד בֵּית אֵל
  choice: मुझे बेतेल तक भेजा है
  rationale: עַד की सीमांत अथवा गंतव्य-संबंधी बारीकी को ‘तक’ सुरक्षित रखता है और यात्रा के क्रमिक पड़ाव का भाव भी व्यक्त करता है।
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: जीवित याहवे की और आपके जीवन की शपथ
  rationale: यह हिब्रू की गंभीर शपथ-विधि है। हिंदी में ‘शपथ’ स्पष्ट करना इसके वाक्यगत कार्य को स्वाभाविक ढंग से व्यक्त करता है; נֶפֶשׁ यहाँ मनुष्य के जीवन को सूचित करता है, किसी तकनीकी आत्मा-विज्ञान को नहीं।
- source_word: אִם אֶעֶזְבֶךָּ
  choice: मैं आपको नहीं छोड़ूँगा
  rationale: शपथ के बाद אִם से आरंभ होने वाला वाक्यांश अधूरी नकारात्मक शपथ है—शाब्दिक रूप से ‘यदि मैं आपको छोड़ूँ…’। हिंदी में उसका अभिप्रेत दृढ़ निषेध स्पष्ट किया गया है।
- source_word: וַיֵּרְדוּ
  choice: वे ... उतर गए
  rationale: ירד में नीचे जाने अथवा उतरने का दिशात्मक भाव है, जिसे केवल ‘गए’ कहने के बजाय सुरक्षित रखा गया है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का मानक हिंदी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: एलीशा की शपथ में अधूरा सशर्त वाक्य
  choice: मैं आपको नहीं छोड़ूँगा
  alternative: यदि मैं आपको छोड़ूँ…
  rationale: हिब्रू की शपथ-विधि दंड-वचन को अनकहा छोड़ती है और दृढ़ निषेध व्यक्त करती है। स्वाभाविक हिंदी में निषेध स्पष्ट किया गया, जबकि पादटिप्पणी मूल संरचना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। गुरु-सदृश वरिष्ठ एलिय्याह के प्रति एलीशा के संबोधन में सम्मानसूचक ‘आप’ रखा गया है, जबकि एलिय्याह की ओर से ‘ठहरो’ प्रसंगानुकूल निकटता और वरिष्ठता दिखाता है। हिब्रू शपथ की गंभीरता को स्वाभाविक हिंदी में बनाए रखा गया है।
