  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
translation:
  language: hi
  text: पर वे उससे तब तक आग्रह करते रहे जब तक कि वह लज्जित न हो गया[a]। तब उसने कहा, “उन्हें भेज दो।” इसलिए उन्होंने पचास आदमी भेजे। उन्होंने तीन दिन तक उसकी खोज की, पर वे उसे नहीं ढूँढ़ पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह शर्मिंदा हो गया।” इब्रानी में शाब्दिक रूप से “लज्जित होने तक” है; यह उनके बार-बार आग्रह करने से उत्पन्न सामाजिक दबाव को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ בוֹ
  choice: वे उस पर इतना ज़ोर डालते रहे
  rationale: פצר लगातार आग्रह करने या दबाव डालने को व्यक्त करता है। यह रूप उनकी बार-बार की ज़िद और उससे उत्पन्न दबाव दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: עַד בֹּשׁ
  choice: कि वह लज्जित हो गया
  rationale: בוש का मूल भाव लज्जा या संकोच है। अनुवाद सामाजिक दबाव से उत्पन्न लज्जा को बनाए रखता है और अस्पष्ट सूक्ष्मता को पादटिप्पणी में स्पष्ट करता है।
- source_word: שְׁלָחוּ
  choice: भेज दो
  rationale: यह बहुवचन आज्ञार्थक रूप है। प्रसंग से खोज-दल को भेजना स्पष्ट है; हिन्दी में निहित कर्म को दोहराए बिना यह स्वाभाविक है।
- source_word: חֲמִשִּׁים אִישׁ
  choice: पचास पुरुष
  rationale: इब्रानी पाठ इसी पद में केवल ‘पचास पुरुष’ कहता है; प्रसंग से अतिरिक्त पहचान जोड़ना आवश्यक नहीं है।
- source_word: וַיְבַקְשׁוּ שְׁלֹשָׁה יָמִים
  choice: वे तीन दिन तक उसकी खोज करते रहे
  rationale: בקש यहाँ किसी व्यक्ति को ढूँढ़ने के अर्थ में है। ‘तीन दिन तक’ अवधि और ‘खोज करते रहे’ निरंतर प्रयास को सहज हिन्दी में व्यक्त करते हैं।
- source_word: וְלֹא מְצָאֻהוּ
  choice: पर उसे नहीं पाया
  rationale: מצא का अर्थ ‘पाना’ है। वाव को यहाँ परिणाम-विरोधी ‘पर’ से व्यक्त करना असफल खोज की कथा-गत दिशा को स्पष्ट करता है।
