  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him, “Look, your servants have fifty able men. Please let them go and search for your master. Perhaps the Spirit of Yahweh[a] has carried him away and thrown him onto one of the mountains or into one of the valleys.” But he said, “Do not send them.”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “देखिए, आपके सेवकों में पचास सक्षम पुरुष हैं। कृपया उन्हें जाने दीजिए कि वे आपके स्वामी को ढूँढ़ें। हो सकता है कि यहोवा का आत्मा[a] उन्हें उठाकर ले गया हो और किसी पहाड़ पर या किसी घाटी में फेंक दिया हो।” पर उसने कहा, “उन्हें मत भेजो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की हवा उन्हें उड़ाकर ले गई हो।” जिस इब्रानी शब्द का अनुवाद “आत्मा” किया गया है, उसका अर्थ “हवा” भी हो सकता है।
    reason: רוּחַ के ‘आत्मा’ और ‘हवा’ दोनों सम्भव अर्थों को सुरक्षित रखता है।
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: देखिए
  rationale: यह प्रस्ताव की ओर विनम्रता से ध्यान खींचने वाला पदबंध है; आधुनिक हिन्दी में आदरसूचक ‘देखिए’ स्वाभाविक है।
- source_word: יֵשׁ אֶת עֲבָדֶיךָ חֲמִשִּׁים אֲנָשִׁים בְּנֵי חַיִל
  choice: आपके सेवकों में पचास योग्य पुरुष हैं
  rationale: अस्तित्ववाचक रचना सेवकों में उपलब्ध पुरुषों को इंगित करती है। בְּנֵי חַיִל यहाँ खोज के लिए सक्षम और योग्य पुरुषों का बोध कराता है, अनिवार्यतः योद्धाओं का नहीं।
- source_word: יֵלְכוּ נָא
  choice: कृपया उन्हें जाने दीजिए
  rationale: निवेदनसूचक נָא और एलीशा से अनुमति माँगने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וִיבַקְשׁוּ אֶת אֲדֹנֶיךָ
  choice: कि वे आपके स्वामी को ढूँढ़ें
  rationale: בקשׁ यहाँ किसी लापता व्यक्ति को खोजने के अर्थ में है; אֲדֹנֶיךָ एलीशा के गुरु और स्वामी एलिय्याह को दर्शाता है।
- source_word: פֶּן
  choice: हो सकता है कि
  rationale: इस प्रसंग में यह आशंका अथवा अनिश्चित अनुमान प्रस्तुत करता है, न कि रोकने योग्य परिणाम; इसलिए ‘कहीं ऐसा न हो’ की अपेक्षा ‘हो सकता है कि’ उपयुक्त है।
- source_word: נְשָׂאוֹ רוּחַ יְהוָה
  choice: यहोवा का आत्मा उन्हें उठाकर ले गया हो
  rationale: רוּחַ का प्रमुख प्रसंगगत अर्थ यहाँ परमेश्वर का आत्मा है और נשׂא उठाकर ले जाने को व्यक्त करता है; ‘हवा’ वाला वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיַּשְׁלִכֵהוּ
  choice: डाल दिया हो
  rationale: क्रिया फेंकने अथवा डाल देने का भाव रखती है; हिन्दी में किसी स्थान पर पहुँचा दिए जाने के इस कथन में ‘डाल दिया’ स्वाभाविक और स्पष्ट है।
- source_word: בְּאַחַד הֶהָרִים אוֹ בְּאַחַת הַגֵּאָיוֹת
  choice: किसी पहाड़ पर या किसी घाटी में
  rationale: एक अनिर्दिष्ट पहाड़ अथवा घाटी का भाव संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है; स्थान के अनुसार ‘पर’ और ‘में’ प्रयुक्त हैं।
theological_decisions:
- issue: רוּחַ יְהוָה का अर्थ
  choice: यहोवा का आत्मा
  alternative: यहोवा की हवा
  rationale: एलिय्याह के असाधारण रूप से उठा लिए जाने के प्रसंग में दैवी कर्तृत्व ‘आत्मा’ के पक्ष में है। फिर भी רוּחַ का ‘हवा’ अर्थ सम्भव है, इसलिए अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
- issue: यְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे
  rationale: आम हिन्दी बाइबलीय पाठकों के लिए पहचाना जाने वाला व्यक्तिवाचक रूप ‘यहोवा’ रखा गया है और इसे सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संवाद और सहज कथात्मक शैली। ‘योग्य पुरुष’ क्षमता को व्यक्त करता है और अनावश्यक सैनिक अर्थ से बचता है। पादटिप्पणी का चिह्न ठीक उसी पदबंध के बाद रखा गया है जिसकी व्याख्या वह करती है।
