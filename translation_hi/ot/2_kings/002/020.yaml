lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: वय्यिक्तोल कथा-रूप यहाँ एलीशा के कथन का परिचय देता है। आधुनिक हिन्दी में क्रम स्पष्ट होने के कारण आरम्भिक संयोजक आवश्यक नहीं है।
- source_word: קְחוּ לִי
  choice: मेरे लिए ... लाओ
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर לִי के साथ इस आज्ञार्थक प्रसंग में स्वाभाविक अर्थ माँगी गई वस्तु को वक्ता के पास लाना है।
- source_word: צְלֹחִית
  choice: कटोरा
  rationale: यह शब्द किसी छोटे पात्र को दर्शाता है। नमक रखने के प्रसंग में ‘कटोरा’ सहज हिन्दी है, यद्यपि पात्र का ठीक आकार स्रोत में निश्चित नहीं है।
- source_word: חֲדָשָׁה
  choice: नया
  rationale: विशेषण पात्र को नया बताता है और सीधे रूप में सुरक्षित रखा गया है।
- source_word: וְשִׂימוּ שָׁם מֶלַח
  choice: और उसमें नमक डालो
  rationale: שׂים का अर्थ ‘रखना/डालना’ और שָׁם का शाब्दिक अर्थ ‘वहाँ’ है; यहाँ ‘उसमें’ पिछले उल्लिखित पात्र का स्वाभाविक हिन्दी संकेत है।
- source_word: וַיִּקְחוּ אֵלָיו
  choice: तब वे उसे उसके पास ले आए
  rationale: לקח यहाँ माँगा गया पात्र एलीशा तक पहुँचाने की क्रिया व्यक्त करता है। ‘उसे’ प्रसंग से निहित वस्तु को स्पष्ट करता है और ‘तब’ कथा के क्रम को दर्शाता है।
