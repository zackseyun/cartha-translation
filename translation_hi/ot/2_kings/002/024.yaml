    issue: The attack is rendered only as severe injury.
    rationale: '''बुरी तरह घायल कर दिया'' describes a possible result but omits the lexical force of בקע, which depicts rending/tearing. A rendering should retain that imagery while avoiding an unwarranted statement that all forty-two died.'
