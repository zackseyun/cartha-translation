reference: 2 Kings 2:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּ֤פֶן אַֽחֲרָי/ו֙ וַ/יִּרְאֵ֔/ם וַֽ/יְקַלְלֵ֖/ם בְּ/שֵׁ֣ם יְהוָ֑ה וַ/תֵּצֶ֨אנָה שְׁתַּ֤יִם דֻּבִּים֙ מִן הַ/יַּ֔עַר וַ/תְּבַקַּ֣עְנָה מֵ/הֶ֔ם אַרְבָּעִ֥ים וּ/שְׁנֵ֖י יְלָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/024.yaml
  text: He turned around and saw them, and he cursed them in the name of the LORD. Then two she-bears came out of the forest and mauled forty-two of the boys.
translation:
  language: hi
  text: उसने पीछे मुड़कर उन्हें देखा और यहोवा के नाम से उन्हें शाप दिया। तब जंगल से दो मादा भालू निकलीं और उन्होंने उन लड़कों में से बयालीस को बुरी तरह नोच डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַלְלֵם
  choice: उन्हें शाप दिया
  rationale: क्रिया קלל यहाँ स्पष्ट रूप से शाप देने का अर्थ रखती है; इसे केवल डाँटने या कोसने तक सीमित करना स्रोत की गंभीरता घटाता।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: पूर्वसर्ग בְּ को साधन/अधिकार के भाव में स्वाभाविक हिन्दी से व्यक्त किया गया है और परमेश्वर के व्यक्तिगत नाम יהוה को 'यहोवा' के रूप में रखा गया है।
- source_word: שְׁתַּיִם דֻּבִּים
  choice: दो मादा भालू
  rationale: स्त्रीलिंग संख्या और संज्ञा का रूप भालुओं के मादा होने को स्पष्ट करता है।
- source_word: וַתְּבַקַּעְנָה
  choice: बुरी तरह घायल कर दिया
  rationale: בקע का मूल भाव चीरना/फाड़ना है; इस प्रसंग में आक्रमण से गंभीर रूप से घायल करने का स्वाभाविक हिन्दी वर्णन चुना गया है, बिना यह अनिवार्य मानने के कि सभी मारे गए।
- source_word: יְלָדִים
  choice: लड़कों
  rationale: यह शब्द बच्चों या युवकों के लिए प्रयुक्त हो सकता है; निकटवर्ती प्रसंग में पुरुषवाचक समूह के लिए स्वाभाविक 'लड़कों' रखा गया है, पर इससे उनकी सटीक आयु निर्धारित नहीं होती।
theological_decisions:
- issue: यहोवा के नाम से शाप देने में भविष्यद्वक्ता की भूमिका
  choice: वाक्य को बिना व्याख्यात्मक नरमी के सीधे रखा गया है
  alternative: इसे केवल व्यक्तिगत अपमान के प्रत्युत्तर में एलीशा की निजी बद्दुआ बताना
  rationale: मूल पाठ कार्य को 'यहोवा के नाम से' बताता है, पर इस एक वाक्य में दैवी स्वीकृति, उद्देश्य या नैतिक विवेचना अलग से स्पष्ट नहीं करता; अनुवाद को उस तनाव को बनाए रखना चाहिए।
- issue: हमले का परिणाम
  choice: गंभीर घायल करना, मृत्यु को अनिर्दिष्ट रखना
  alternative: बयालीस को मार डालना या चीरकर टुकड़े कर देना
  rationale: मूल क्रिया हिंसक रूप से चीरने को दर्शाती है, पर पद स्पष्ट रूप से मृत्यु नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। क्रम और वाक्य-संबंध हिब्रू के निकट रखे गए हैं; अस्वाभाविक शब्दशः संरचना से बचा गया है।
