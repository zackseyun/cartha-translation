base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: hi
  text: तब यरीहो में जो भविष्यद्वक्ताओं के पुत्र थे, वे एलीशा के पास आए और उससे बोले, “क्या तुम जानते हो कि आज यहोवा तुम्हारे स्वामी को तुम्हारे सिर के ऊपर से ले लेनेवाला है?[a]” उसने कहा, “हाँ, मैं भी जानता हूँ; चुप रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम पर से”; हिब्रू में शाब्दिक रूप से “तुम्हारे सिर के ऊपर से” है। यह सम्भवतः अपने अधीन किसी पर अधिकार रखनेवाले व्यक्ति को उससे अलग कर दिए जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: पास आए
  rationale: नגשׁ निकट आने या पास पहुँचने का भाव देता है; ‘पास आए’ स्वाभाविक आधुनिक हिन्दी है और एलीशा की ओर गति को बनाए रखता है।
- source_word: בְנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के पुत्र
  rationale: हिब्रू पदबंध को औपचारिक रूप से सुरक्षित रखा गया है। सम्भवतः इसका संकेत किसी भविष्यद्वक्ता-समुदाय या शिष्य-मंडली की ओर है, पर मुख्य पाठ में उस व्याख्या को आरोपित नहीं किया गया।
- source_word: אֲשֶׁר בִּירִיחוֹ
  choice: यरीहो में रहनेवाले
  rationale: सम्बन्धवाचक उपवाक्य उस समूह को यरीहो में स्थित बताता है; यह हिन्दी में स्थान और समूह की पहचान दोनों स्पष्ट करता है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הֲיָדַעְתָּ
  choice: क्या तुम जानते हो
  rationale: सन्दर्भ में हिब्रू पूर्ण रूप वर्तमान जानकारी या जागरूकता पूछता है; हिन्दी वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: לֹקֵחַ
  choice: उठा लेनेवाला है
  rationale: कृदन्त आसन्न क्रिया का भाव देता है। इस प्रसंग में ‘उठा लेनेवाला है’ क्रिया की निकटता और एलिय्याह के असाधारण प्रस्थान, दोनों के लिए स्वाभाविक है।
- source_word: אֲדֹנֶיךָ
  choice: तुम्हारे स्वामी
  rationale: मानवीय अधिकार-सम्बन्ध में ‘स्वामी’ एलिय्याह की एलीशा पर वरिष्ठता को व्यक्त करता है, बिना इसे परमेश्वर के लिए प्रयुक्त उपाधि समझे।
- source_word: מֵעַל רֹאשֶׁךָ
  choice: तुम्हारे सिर के ऊपर से
  rationale: हिब्रू की ठोस और कुछ असामान्य छवि को मुख्य पाठ में सुरक्षित रखा गया है; सम्भावित अधिकार-सम्बन्ध का स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: हाँ, मैं भी जानता हूँ
  rationale: ‘मैं भी’ गַּם और बलसूचक सर्वनाम दोनों का भाव रखता है; ‘हाँ’ उत्तर को हिन्दी संवाद में स्वाभाविक बनाता है।
- source_word: הֶחֱשׁוּ
  choice: चुप रहो
  rationale: बहुवचन आज्ञार्थक का संक्षिप्त और दृढ़ भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: परमेश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू में व्यक्तिगत परमेश्वरीय नाम प्रत्यक्ष रूप से है। हिन्दी पाठक-परम्परा में व्यापक रूप से पहचाने जानेवाले ‘यहोवा’ को उपाधि ‘प्रभु’ के स्थान पर रखा गया है, ताकि नाम की प्रकृति बनी रहे।
- issue: מֵעַל רֹאשֶׁךָ को मुख्य पाठ में मुहावरे के रूप में खोलना या ठोस रूपक बनाए रखना
  choice: ‘तुम्हारे सिर के ऊपर से’ ठोस अभिव्यक्ति बनाए रखी गई
  alternative: ‘तुम्हारे ऊपर से उसका अधिकार हटाकर’ अथवा ‘तुम्हारे ऊपर से’
  rationale: यह पद एलिय्याह के एलीशा के ऊपर अधिकार या नेतृत्व से हटाए जाने का संकेत दे सकता है, पर मुख्य पाठ में अधिक विशिष्ट अर्थ थोपने के बजाय मूल छवि सुरक्षित रखी गई है और सम्भावित अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘भविष्यद्वक्ताओं के पुत्र’ और ‘सिर के ऊपर से’ जैसे स्रोत-सापेक्ष पदबंध जानबूझकर सुरक्षित हैं; आवश्यक व्याख्या केवल पादटिप्पणी में दी गई है।
