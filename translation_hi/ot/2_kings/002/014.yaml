base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
translation:
  language: hi
  text: तब उसने एलिय्याह का वह लबादा उठाया जो उससे गिर पड़ा था। उसने पानी पर प्रहार किया और कहा, “याहवे, एलिय्याह का परमेश्वर, कहाँ है?”[a] फिर उसने पानी पर प्रहार किया, और पानी दोनों ओर बँट गया; तब एलीशा पार चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ एक संक्षिप्त पदबंध है जिसका शाब्दिक अर्थ “वह भी” या “स्वयं वही” हो सकता है। इसे इस प्रकार भी समझा जा सकता है: “याहवे, एलिय्याह का परमेश्वर—वही कहाँ है?” यह सम्भवतः इस बात पर बल देता है कि एलिय्याह के साथ रहने वाला वही परमेश्वर अब भी उपस्थित है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  choice: चादर
  rationale: यह एलिय्याह के विशिष्ट बाहरी वस्त्र को दर्शाता है। ‘चादर’ आधुनिक हिन्दी में सहज और ठोस है तथा वस्त्र की छवि बनाए रखता है।
- source_word: נָפְלָה מֵעָלָיו
  choice: उसके ऊपर से गिर गई थी
  rationale: सम्बन्धवाचक उपवाक्य पहले घट चुकी घटना बताता है; ‘गिर गई थी’ कथा-क्रम स्पष्ट करता है और מֵעָלָיו के ‘उसके ऊपर से’ भाव को रखता है।
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  choice: पानी पर मारा
  rationale: नכה की प्रहार वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; सन्दर्भ से स्पष्ट है कि प्रहार चादर से किया गया।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: स्थान अथवा उपस्थिति पूछने वाले सीधे प्रश्न को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का लिप्यन्तरण है, न कि उसे किसी उपाधि से बदलना।
- source_word: אֱלֹהֵי אֵלִיָּהוּ
  choice: एलिय्याह का परमेश्वर
  rationale: इब्रानी सम्बन्धसूचक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַף הוּא
  choice: मुख्य पाठ में विस्तार नहीं; पादटिप्पणी में ‘वह भी’
  rationale: यह अत्यन्त संक्षिप्त और विवादित पदबंध है। इसे सहज मुख्य वाक्य में जबरन जोड़ने से अर्थ अनावश्यक रूप से निश्चित हो जाता; पादटिप्पणी इब्रानी अभिव्यक्ति और सम्भावित सम्बन्ध सुरक्षित रखती है।
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  choice: पानी दोनों ओर बँट गया
  rationale: दिशासूचक युग्म का स्वाभाविक हिन्दी समतुल्य है और नदी के पानी के दो ओर हटने की छवि स्पष्ट रखता है।
- source_word: וַיַּעֲבֹר
  choice: पार चला गया
  rationale: नदी पार करने के प्रसंग में עבר का स्वाभाविक कथात्मक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: אַף הוּא की संक्षिप्त और संदिग्ध अभिव्यक्ति
  choice: मुख्य पाठ में प्रश्न को सहज रूप में रखा और पदबंध को पादटिप्पणी में बताया
  alternative: “एलिय्याह का परमेश्वर याहवे कहाँ है—वह भी?” अथवा “वह भी कहाँ है?”
  rationale: इब्रानी אַף הוּא (‘वह भी/स्वयं वही’) का वाक्यगत सम्बन्ध अनिश्चित है। अस्पष्ट हिन्दी को मुख्य पाठ में रखकर कृत्रिम अर्थ बनाने के बजाय पादटिप्पणी मूल की संक्षिप्तता और सम्भावित बलाघात—एलिय्याह के साथ रहने वाला वही परमेश्वर अब भी उपस्थित है—को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘चादर’, ‘पानी पर मारा’ और ‘दोनों ओर बँट गया’ सामान्य पाठक के लिए सहज हैं। नामों के रूप ‘एलिय्याह’ और ‘एलीशा’ रखे गए हैं; ईश्वरीय नाम ‘याहवे’ के रूप में लिप्यन्तरित है।
