  text: וַ/יָּשֻׁ֣בוּ אֵלָ֔י/ו וְ/ה֖וּא יֹשֵׁ֣ב בִּ/ירִיח֑וֹ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם הֲ/לֽוֹא אָמַ֥רְתִּי אֲלֵי/כֶ֖ם אַל תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/018.yaml
  text: When they returned to him[a], he was sitting in Jericho, and he said to them, “Did I not tell you, ‘Do not go’?”
translation:
  language: hi
  text: जब वे उसके पास लौटे[a], तब वह यरीहो में बैठा हुआ था। उसने उनसे कहा, “क्या मैंने तुमसे नहीं कहा था, ‘मत जाओ’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और वे उसके पास लौटे, और वह यरीहो में बैठा हुआ था।”'
    reason: वाव-क्रम और साथ चल रही परिस्थिति का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: जब वे उसके पास लौटे
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, और इसके बाद की परिस्थिति के साथ इसका समय-संबंध हिन्दी में ‘जब’ से स्वाभाविक रूप से व्यक्त होता है। אֵלָיו का सीधा अर्थ ‘उसके पास’ है; संदर्भ में वह एलीशा है।
- source_word: וְהוּא יֹשֵׁב
  choice: तब वह ... बैठा हुआ था
  rationale: יֹשֵׁב का मूल और इस प्रसंग में सहज अर्थ ‘बैठा हुआ था’ है, यद्यपि इसका अर्थ ‘ठहरा हुआ था’ भी हो सकता है। ‘तब’ हिन्दी वाक्य में समकालिक परिस्थिति को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בִּירִיחוֹ
  choice: यरीहो में
  rationale: स्थाननाम יְרִיחוֹ का प्रचलित हिन्दी रूप ‘यरीहो’ है और בְּ को ‘में’ से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: उसने उनसे कहा
  rationale: אָמַר सामान्य कथन-क्रिया है; हिन्दी में ‘उसने उनसे कहा’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  choice: क्या मैंने तुमसे नहीं कहा था
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न बनाता है और यहाँ हल्की झिड़की का भाव रखता है। हिन्दी में यह रचना उसी बल को बनाए रखती है।
- source_word: אַל תֵּלֵכוּ
  choice: मत जाओ
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। ‘मत जाओ’ आधुनिक हिन्दी में सीधा, स्वाभाविक और पर्याप्त रूप से दृढ़ निषेध है।
