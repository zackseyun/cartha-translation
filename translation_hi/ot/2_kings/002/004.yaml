language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֵלִיָּ֜הוּ אֱלִישָׁ֣ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי יְרִיח֔וֹ וַ/יֹּ֕אמֶר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּבֹ֖אוּ יְרִיחֽוֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/004.yaml
  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: hi
  text: तब एलियाह ने उससे कहा, “एलीशा, कृपया यहीं ठहरो, क्योंकि याहवे ने मुझे यरीहो भेजा है।” तब उसने कहा, “याहवे के जीवन की शपथ और आपके जीवन की शपथ, मैं आपको नहीं छोड़ूँगा।” तब वे यरीहो पहुँचे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  choice: कृपया यहीं ठहरो
  rationale: ישׁב का आदेशात्मक रूप इस प्रसंग में बैठने के बजाय आगे साथ न जाने और उसी स्थान पर रहने का भाव देता है। נָא विनम्र अनुरोध प्रकट करता है और פֹה स्थानसूचक ‘यहीं’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: שְׁלָחַנִי יְרִיחוֹ
  choice: मुझे यरीहो भेजा है
  rationale: पूर्ण क्रिया का वर्तमान परिस्थिति से जारी संबंध हिन्दी में ‘भेजा है’ से स्वाभाविक रूप से व्यक्त होता है; יְרִיחוֹ गंतव्य है।
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: याहवे के जीवन की और आपके जीवन की शपथ
  rationale: यह गंभीर शपथ-सूत्र है। נֶפֶשׁ यहाँ अलग अमूर्त ‘आत्मा’ नहीं, स्वयं व्यक्ति के जीवन को सूचित करता है। अनुवाद दोनों समानांतर पदों और शपथ के बल को बनाए रखता है।
- source_word: אִם אֶעֶזְבֶךָּ
  choice: मैं आपको नहीं छोड़ूँगा
  rationale: शपथ-सूत्र में אִם के साथ कथन संक्षिप्त रूप से नकारात्मक प्रतिज्ञा व्यक्त करता है—शाब्दिक ‘यदि मैं आपको छोड़ूँ’ का आशय ‘मैं आपको निश्चय ही नहीं छोड़ूँगा’ है।
- source_word: וַיָּבֹאוּ יְרִיחוֹ
  choice: तब वे यरीहो पहुँचे
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। गंतव्य के साथ בוא का स्वाभाविक हिन्दी रूप ‘पहुँचे’ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
- issue: נֶפֶשׁ का अर्थ शपथ-सूत्र में
  choice: आपके जीवन
  alternative: आपकी आत्मा
  rationale: यहाँ נֶפֶשׁ पूरे जीवित व्यक्ति और उसके जीवन का द्योतक है; ‘आत्मा’ कहने से शरीर से पृथक तत्व का अनावश्यक धर्मवैज्ञानिक अर्थ जुड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। एलियाह के प्रति एलीशा के उत्तर में आदरसूचक ‘आप’ प्रयुक्त है, जबकि गुरु का शिष्य से संबोधन ‘ठहरो’ स्वाभाविक संबंध-सूचक रूप में है।
