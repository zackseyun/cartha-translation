base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/003.yaml
  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
translation:
  language: hi
  text: तब बेतेल में रहनेवाले भविष्यद्वक्ताओं के शिष्य निकलकर एलीशा के पास आए और उससे बोले, “क्या तुम्हें मालूम है कि आज याहवे तुम्हारे स्वामी को तुम्हारे सिर के ऊपर से ले लेनेवाला है[a]?” उसने कहा, “हाँ, मैं भी जानता हूँ; चुप रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे सिर के ऊपर से।” यह किसी ऐसे व्यक्ति को हटा लिए जाने का मुहावरा है जो दूसरे के ऊपर अधिकार रखता है।
    reason: मूल इब्रानी रूपक तथा उसके अधिकार-संबंधी आशय को स्पष्ट करना।
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के शिष्य
  rationale: शाब्दिक ‘भविष्यद्वक्ताओं के पुत्र’ आधुनिक हिन्दी में जैविक पुत्रों का भ्रामक अर्थ दे सकता है। यहाँ इब्रानी संबंधसूचक मुहावरा भविष्यद्वक्ताओं के समुदाय या प्रशिक्षण में रहनेवालों को दर्शाता है; ‘शिष्य’ इस आशय को सहज रूप में व्यक्त करता है।
- source_word: אֲשֶׁר בֵּית אֵל
  choice: बेतेल में रहनेवाले
  rationale: यह उपवाक्य समूह की पहचान उसके स्थान से करता है। ‘बेतेल में रहनेवाले’ हिन्दी में स्वाभाविक है और स्थान-संबंध स्पष्ट करता है।
- source_word: הֲיָדַעְתָּ
  choice: क्या तुम्हें मालूम है
  rationale: संदर्भ में इब्रानी पूर्ण क्रिया वर्तमान जानकारी के विषय में प्रश्न करती है; यह आधुनिक हिन्दी का सहज समतुल्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹקֵחַ
  choice: उठा लेनेवाला है
  rationale: कृदंत उसी दिन होनेवाली निकटवर्ती क्रिया बताता है। प्रसंग में एलिय्याह के असाधारण रूप से उठा लिए जाने की ओर संकेत रखते हुए यह हिन्दी में स्वाभाविक है।
- source_word: אֲדֹנֶיךָ
  choice: तुम्हारे स्वामी
  rationale: यहाँ शब्द एलीशा पर अधिकार रखनेवाले गुरु एलिय्याह के लिए है, परमेश्वर के लिए नहीं; ‘स्वामी’ संबंध और पद दोनों व्यक्त करता है।
- source_word: מֵעַל רֹאשֶׁךָ
  choice: तुम्हारे सिर के ऊपर से
  rationale: मूल रूपक को मुख्य पाठ में सुरक्षित रखा गया है। इसका आशय एलीशा के ऊपर अधिकार या नेतृत्व रखनेवाले व्यक्ति को हटा लेना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: גַּם אֲנִי יָדַעְתִּי
  choice: हाँ, मैं भी जानता हूँ
  rationale: ‘मैं भी’ इब्रानी גַּם אֲנִי को स्पष्ट रूप से सुरक्षित रखता है, जबकि ‘हाँ’ संवाद में स्वाभाविक स्वीकारोक्ति देता है।
- source_word: הֶחֱשׁוּ
  choice: चुप रहो
  rationale: बहुवचन आज्ञा समूह को संबोधित है। ‘चुप रहो’ आधुनिक हिन्दी में सीधा और पर्याप्त गंभीर आदेश है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ व्यक्तिगत नाम को बनाए रखता है और उसे केवल उपाधि में नहीं बदलता।
- issue: מֵעַל רֹאשֶׁךָ में अधिकार-संबंध
  choice: मूल रूपक ‘तुम्हारे सिर के ऊपर से’ सुरक्षित रखा
  alternative: तुम्हारे ऊपर से/तुम्हारा अगुवा होना समाप्त करके
  rationale: वाक्यांश शारीरिक दिशा और अधिकार-संबंध दोनों का संकेत दे सकता है। मुख्य पाठ में रूपक और पादटिप्पणी में उसका मुहावरेदार आशय देना इस अर्थ-तनाव को बिना अनावश्यक रूप से तय किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘भविष्यद्वक्ताओं के शिष्य’ जैविक पुत्रों की गलतफहमी से बचाता है; ‘चुप रहो’ आदेश की संक्षिप्तता बनाए रखता है। पादटिप्पणी-चिह्न [a] संबंधित वाक्यांश के तुरंत बाद मुख्य पाठ में दिया गया है।
