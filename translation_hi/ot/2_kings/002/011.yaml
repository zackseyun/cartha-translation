source:
  edition: WLC
  text: וַ/יְהִ֗י הֵ֣מָּה הֹלְכִ֤ים הָלוֹךְ֙ וְ/דַבֵּ֔ר וְ/הִנֵּ֤ה רֶֽכֶב אֵשׁ֙ וְ/ס֣וּסֵי אֵ֔שׁ וַ/יַּפְרִ֖דוּ בֵּ֣ין שְׁנֵי/הֶ֑ם וַ/יַּ֨עַל֙ אֵ֣לִיָּ֔הוּ בַּֽ/סְעָרָ֖ה הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
translation:
  language: hi
  text: 'जब वे चलते-चलते बातें कर रहे थे, तभी देखो, आग का एक रथ और आग के घोड़ों ने उन दोनों को एक-दूसरे से अलग कर दिया[b]; और एलिय्याह बवंडर के द्वारा[a] स्वर्ग की ओर ऊपर चला गया।


    [a] इसका अनुवाद “बवंडर में” भी हो सकता है। इब्रानी उपसर्ग यहाँ साधन, साथ या स्थान का भाव दे सकता है।


    [b] मूल पाठ कहता है कि आग के रथ और आग के घोड़ों ने एलिय्याह और एलीशा को एक-दूसरे से अलग कर दिया और एलिय्याह बवंडर के द्वारा या उसमें ऊपर चला गया। वह स्पष्ट रूप से यह नहीं कहता कि एलिय्याह रथ पर सवार था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “बवंडर में” भी हो सकता है। इब्रानी उपसर्ग यहाँ साधन, साथ या स्थान का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल पाठ कहता है कि आग के रथ और आग के घोड़ों ने एलिय्याह और एलीशा को एक-दूसरे से अलग कर दिया और एलिय्याह बवंडर के द्वारा या उसमें ऊपर चला गया। वह स्पष्ट रूप से यह नहीं कहता कि एलिय्याह रथ पर सवार था।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  choice: जब वे चलते-चलते बातें कर रहे थे
  rationale: यह अभिव्यक्ति जारी गति और साथ-साथ हो रही बातचीत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: וְהִנֵּה
  choice: तभी देखो
  rationale: यह नाटकीय तात्कालिकता और श्रोता का ध्यान खींचने वाला बल बनाए रखता है।
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  choice: आग का एक रथ और आग के घोड़े
  rationale: रचना की समानांतर और सजीव छवि को बनाए रखते हुए ‘आग’ को केवल विशेषण बनाकर उसका आशय सीमित नहीं किया गया।
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵיהֶם
  choice: उन दोनों को एक-दूसरे से अलग कर दिया
  rationale: बहुवचन क्रिया को रथ और घोड़ों के सामूहिक कर्ता से जोड़ता है तथा שְׁנֵיהֶם के स्पष्ट द्विव्यक्ति-संबंध को सुरक्षित रखता है।
- source_word: וַיַּעַל
  choice: ऊपर चला गया
  rationale: עלה की सक्रिय गति को बिना निष्क्रिय अर्थ जोड़े स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: בַּסְעָרָה
  choice: बवंडर के द्वारा
  rationale: मुख्य पाठ में ב के साधनसूचक अर्थ को व्यक्त किया गया है; ‘बवंडर में’ की स्थान या साथ-संबंधी संभावना पादटिप्पणी में रखी गई है।
- source_word: הַשָּׁמָיִם
  choice: स्वर्ग की ओर
  rationale: दिशात्मक गति और प्रसंग के ऊर्ध्वलोक-संबंधी साहित्यिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या आग का रथ एलिय्याह को लेकर गया, या बवंडर उसके ऊपर जाने का माध्यम था
  choice: मुख्य पाठ केवल यह कहता है कि आग के रथ और घोड़ों ने दोनों व्यक्तियों को अलग किया और एलिय्याह बवंडर के द्वारा ऊपर गया।
  alternative: एलिय्याह आग के रथ पर सवार होकर ऊपर गया।
  rationale: इब्रानी पाठ रथ और घोड़ों द्वारा दोनों को अलग किए जाने तथा बवंडर से संबद्ध एलिय्याह के ऊपर जाने को अलग-अलग बताता है; वह एलिय्याह के रथ पर सवार होने की बात स्पष्ट रूप से नहीं कहता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। ‘तभी देखो’ ने הִנֵּה का ध्यानाकर्षक बल रखा है। सक्रिय ‘ऊपर चला गया’ मूल क्रिया का वाच्य सुरक्षित रखता है। पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं; अक्षरक्रम स्रोत परामर्श-पाठ के अनुसार है।
