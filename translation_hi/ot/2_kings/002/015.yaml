  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
translation:
  language: hi
  text: जब यरीहो में रहने वाले नबियों के शिष्यों ने उसे दूर से देखा[a], तो वे बोले, “एलिय्याह की आत्मा एलीशा पर आ ठहरी है।”[b] तब वे उससे मिलने आए और उसके सामने भूमि पर दण्डवत किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके सामने, दूसरी ओर से”; इब्रानी अभिव्यक्ति सामने अथवा दूसरी ओर दिखाई देने की स्थिति भी बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में यह एलिय्याह की भविष्यद्वक्ताई आत्मा या सामर्थ्य को एलीशा में पहचाने जाने की ओर संकेत करती है।
    reason: cross_reference
  - marker: c
    text: या “उसके सामने भूमि तक झुक गए।” यह भाव गहरा सम्मान और अधीनता भी व्यक्त कर सकता है; इससे अनिवार्य रूप से आराधना का अर्थ नहीं निकलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: नबियों के शिष्य
  rationale: शाब्दिक रूप ‘नबियों के पुत्र’ हिन्दी में जैविक पुत्रों का भ्रम पैदा कर सकता है; प्रसंग में यह नबियों के समुदाय के प्रशिक्षुओं अथवा सदस्यों के लिए प्रयुक्त इब्रानी मुहावरा है।
- source_word: מִנֶּגֶד
  choice: दूर से
  rationale: यहाँ शब्द सामने अथवा दूसरी ओर स्थित होकर दिखाई देने का स्थानिक भाव रखता है। सहज हिन्दी में ‘दूर से’ मुख्य दृश्य को स्पष्ट करता है, और पादटिप्पणी स्थानिक विकल्प सुरक्षित रखती है।
- source_word: נָחָה
  choice: आ ठहरी है
  rationale: पूर्ण क्रिया किसी घटित बात से बनी वर्तमान स्थिति व्यक्त करती है; ‘आ ठहरी है’ आगमन और स्थायी रूप से ठहरने, दोनों भावों को रखता है।
- source_word: רוּחַ אֵלִיָּהוּ
  choice: एलिय्याह की आत्मा
  rationale: यह रचना इब्रानी पद का सीधा और जानबूझकर खुला अनुवाद है; इसे केवल सामर्थ्य अथवा व्यक्तिगत जीवात्मा के रूप में पाठ के भीतर सीमित नहीं किया गया।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: यह प्रचलित इब्रानी प्रयोग किसी के पास जाकर उससे मिलने का भाव देता है।
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  choice: उसके सामने भूमि तक झुक गए
  rationale: यह शारीरिक रूप से भूमि की ओर गहराई से झुकने और सम्मान प्रकट करने का भाव रखता है, बिना इसे अनिवार्य रूप से आराधना ठहराए।
theological_decisions:
- issue: ‘एलिय्याह की आत्मा’ का अर्थ
  choice: मुख्य पाठ में मूल अभिव्यक्ति की व्यापकता बनाए रखी गई है; पादटिप्पणी में भविष्यद्वक्ताई बुलाहट और सामर्थ्य का प्रसंग बताया गया है।
  alternative: इसे ‘एलिय्याह का भविष्यद्वक्ताई सामर्थ्य’ कहना, या एलिय्याह की व्यक्तिगत आत्मा का एलीशा में स्थानांतरण समझना।
  rationale: निकटवर्ती प्रसंग उत्तराधिकार और भविष्यद्वक्ताई सामर्थ्य की पहचान की ओर संकेत करता है, पर मूल पद ‘आत्मा’ को अधिक संकुचित व्याख्यात्मक शब्द से बदलना उचित नहीं।
- issue: एलीशा के सामने झुकने का स्वरूप
  choice: एलीशा के अधिकार और पद के प्रति गहरा सम्मान।
  alternative: एलीशा की दिव्य आराधना।
  rationale: इब्रानी क्रिया मनुष्यों और परमेश्वर, दोनों के सामने झुकने के लिए आ सकती है; यहाँ मानवीय पात्र और उत्तराधिकार का प्रसंग सम्मान तथा अधीनता का संकेत देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबियों के शिष्य’ हिन्दी पाठक के लिए समूह की प्रकृति स्पष्ट करता है; ‘आत्मा’ मूल की धर्मवैचारिक व्यापकता बनाए रखता है।
