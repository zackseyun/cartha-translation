source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
translation:
  language: hi
  text: और भविष्यद्वक्ताओं के पुत्रों में से पचास पुरुष[a] गए और कुछ दूरी पर उनके सामने[b][c] खड़े हो गए, जबकि वे दोनों यरदन के किनारे खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भविष्यद्वक्ताओं के पुत्र’ भविष्यद्वाणी की सेवा से जुड़े एक मान्य समूह के सदस्यों के लिए प्रयुक्त पदनाम था।
    reason: cultural_note
  - marker: b
    text: या ‘उनके आमने-सामने’।
    reason: lexical_alternative
  - marker: c
    text: या ‘दूर से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  choice: और ... पचास पुरुष
  rationale: इब्रानी संख्या और אִישׁ का स्वाभाविक तथा लिंग-सटीक अर्थ ‘पचास पुरुष’ है।
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के पुत्रों में से
  rationale: मूल पदबंध का औपचारिक रूप सुरक्षित रखा गया है; यह भविष्यद्वाणी की सेवा से जुड़े एक मान्य समूह का पदनाम है। आधुनिक पाठक के लिए इसका सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָלְכוּ
  choice: जाकर
  rationale: הלך यहाँ सामान्य कथात्मक गति दर्शाता है; संयुक्त क्रिया ‘जाकर ... खड़े हो गए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיַּעַמְדוּ
  choice: खड़े हो गए
  rationale: עמד का सरल कथात्मक अर्थ रखा गया है; ‘मोर्चा लिया’ जैसे विकल्प अनावश्यक बल जोड़ते।
- source_word: מִנֶּגֶד
  choice: उनके सामने
  rationale: यह स्थानिक रूप से सामने या दूसरी ओर होने का भाव देता है। सर्वनाम उन दोनों, अर्थात् एलिय्याह और एलीशा, को स्पष्ट रूप से सूचित करता है।
- source_word: מֵרָחוֹק
  choice: कुछ दूरी पर
  rationale: यह स्थानिक दूरी व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है; ‘दूर से’ देखने की क्रिया का भाव ला सकता था।
- source_word: וּשְׁנֵיהֶם
  choice: और वे दोनों
  rationale: इब्रानी का स्पष्ट द्विवचन-सदृश अर्थ सुरक्षित है और यह एलिय्याह तथा एलीशा की ओर संकेत करता है।
- source_word: עָמְדוּ עַל הַיַּרְדֵּן
  choice: यरदन के किनारे खड़े थे
  rationale: नदी के साथ עַל का प्रसंगगत अर्थ ‘के पास/किनारे’ है; ‘किनारे’ दृश्य को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
