  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘चढ़ना’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है। स्थान-नाम के बाद लगा [a] आयु-विषयक टिप्पणी से संबद्ध है, यद्यपि अर्थ की दृष्टि से उसे ‘छोटे लड़के’ के बाद होना चाहिए; प्रकाशन-पाठ में मार्कर को उसी पदबंध के बाद रखना अधिक स्पष्ट होगा।
