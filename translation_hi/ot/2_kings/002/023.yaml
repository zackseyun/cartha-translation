  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
translation:
  language: hi
  text: तब वह वहाँ से बेतेल को चढ़ गया। जब वह मार्ग पर चढ़ता जा रहा था, तो नगर से छोटे लड़के[a] निकल आए और उसका उपहास किया और उससे कहा, “चढ़ जा, गंजे! चढ़ जा[b], गंजे!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश का अनुवाद “किशोर लड़के” या “युवक” भी हो सकता है; यह आवश्यक नहीं कि वे बहुत छोटे बच्चे ही रहे हों।
    reason: lexical_alternative
  - marker: b
    text: दोहराया गया “चढ़ जा” केवल एक ताना हो सकता है, लेकिन यह एलिय्याह के ऊपर उठा लिए जाने की ओर संकेत भी कर सकता है।
    reason: alternative_reading
