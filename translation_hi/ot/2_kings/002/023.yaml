- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְהוּא עֹלֶה בַדֶּרֶךְ
  choice: जब वह मार्ग पर चढ़ता जा रहा था
  rationale: सर्वनाम और कृदंत से प्रकट जारी क्रिया को बनाए रखता है तथा आगे के עֲלֵה के साथ शब्दगत पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: נְעָרִים קְטַנִּים
  choice: छोटे लड़के
  rationale: קטנים का बल बनाए रखते हुए נְעָרִים को युवा पुरुषों के लिए सामान्य आधुनिक हिन्दी शब्द से व्यक्त करता है; व्यापक आयु-सीमा पादटिप्पणी में दी गई है।
- source_word: יָצְאוּ מִן הָעִיר
  choice: नगर से ... निकल आए
  rationale: יצא की बाहर निकलने की गति और कथावाचक के दृष्टिकोण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְקַלְּסוּ בוֹ
  choice: उसका उपहास करते हुए
  rationale: Hitpael रूप में निहित तिरस्कारपूर्ण उपहास को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: עֲלֵה
  choice: चढ़ जा
  rationale: आज्ञार्थक עלה का सीधा अर्थ और पद में बार-बार आने वाला 'चढ़ना' सुरक्षित रहता है; अस्पष्ट संकेत को मुख्य पाठ में नहीं खोला गया।
- source_word: קֵרֵחַ
  choice: गंजे
  rationale: सम्बोधन में प्रयुक्त अपमानजनक विशेषण का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ताना मारते समय दोहराए गए עֲלֵה का सम्भावित सांकेतिक अर्थ
  choice: मुख्य पाठ में शाब्दिक ‘चढ़ जा’ रखा गया
  alternative: ‘यहाँ से निकल जा’ अथवा ‘एलिय्याह की तरह ऊपर चला जा’
  rationale: इब्रानी में मूल अर्थ ‘ऊपर चढ़’ है, पर ताने का सटीक आशय विवादित है। इसलिए सम्भावित एलिय्याह-संकेत को पादटिप्पणी में रखा गया है।
- issue: נְעָרִים קְטַנִּים से सूचित आयु
  choice: मुख्य पाठ में ‘छोटे लड़के’
  alternative: किशोर लड़के, युवक अथवा युवा जन
  rationale: वाक्यांश युवा पुरुषों को सूचित करता है, पर आयु बिल्कुल निश्चित नहीं करता; व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
