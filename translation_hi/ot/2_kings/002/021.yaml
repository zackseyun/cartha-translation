  text: וַ/יֵּצֵא֙ אֶל מוֹצָ֣א הַ/מַּ֔יִם וַ/יַּשְׁלֶךְ שָׁ֖ם מֶ֑לַח וַ/יֹּ֜אמֶר כֹּֽה אָמַ֣ר יְהוָ֗ה רִפִּ֨אתִי֙ לַ/מַּ֣יִם הָ/אֵ֔לֶּה לֹֽא יִהְיֶ֥ה מִ/שָּׁ֛ם ע֖וֹד מָ֥וֶת וּ/מְשַׁכָּֽלֶת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
translation:
  language: hi
  text: 'तब वह पानी के उद्गम[a] पर गया और वहाँ नमक फेंककर बोला, “याहवे यह कहता है: ‘मैंने इस पानी को चंगा कर दिया है। अब इससे फिर कभी मृत्यु या गर्भपात[b] नहीं होगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पानी का सोता।”
    reason: lexical_alternative
  - marker: b
    text: या, “संतान की हानि” अथवा “निष्फलता।” इब्रानी शब्द संतान खोने या फलहीन होने/करने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  choice: पानी का उद्गम
  rationale: מוֹצָא उस स्थान को दर्शाता है जहाँ से पानी निकलता है। ‘उद्गम’ स्रोत या सोते के मुख—दोनों अर्थों को समेटता है और अनावश्यक रूप से किसी एक भौतिक रूप को निश्चित नहीं करता।
- source_word: מֶלַח
  choice: नमक
  rationale: यह मूल शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: רִפִּאתִי לַמַּיִם הָאֵלֶּה
  choice: मैंने इस पानी को चंगा कर दिया है
  rationale: रפא का सामान्य अर्थ ‘चंगा करना’ है। पानी के लिए यह सजीव रूपक मूल पाठ की अभिव्यक्ति को बनाए रखता है; हिन्दी में एक स्थानीय जल-आपूर्ति के लिए एकवचन ‘पानी’ स्वाभाविक है।
- source_word: לֹא יִהְיֶה מִשָּׁם עוֹד
  choice: अब इससे फिर न ... होगी
  rationale: यह हानिकारक परिणामों के उसी जल-स्रोत से आगे न निकलने की बात कहता है। ‘इससे’ हिन्दी में स्रोत और कारण, दोनों की संगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल पाठ केवल ‘मृत्यु’ कहता है; अनुवाद इसे किसी खास प्रकार की मृत्यु तक सीमित नहीं करता।
- source_word: מְשַׁכָּלֶת
  choice: गर्भपात
  rationale: שׁכל से बना यह रूप संतान की हानि कराने या फलहीन करने का भाव रखता है। प्रसंग में ‘गर्भपात’ एक ठोस और स्वाभाविक अर्थ है, जबकि व्यापक अर्थ-संभवता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निज नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: पानी को ‘चंगा’ करने की भाषा
  choice: रूपक को ज्यों का त्यों बनाए रखना
  alternative: पानी को शुद्ध/पीने योग्य कर दिया
  rationale: ईश्वरीय घोषणा में רפא की चंगाई-वाली सजीव भाषा है। इसे केवल जल-शुद्धि की तकनीकी व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यवाणी-सूत्र ‘याहवे यह कहता है’ को स्पष्ट रखा गया है, और ईश्वरीय प्रत्यक्ष वचन को भीतरी उद्धरण-चिह्नों में रखा गया है।
