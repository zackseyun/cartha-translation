  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
translation:
  language: hi
  text: उसने कहा, “तुमने कठिन बात माँगी है। यदि तुम मुझे तुम्हारे पास से ले जाया जाते देखोगे,[a] तो तुम्हारे लिए ऐसा ही होगा; पर यदि नहीं, तो ऐसा नहीं होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम मुझे उस समय देखोगे जब मुझे तुम्हारे पास से ले जाया जाएगा।”
    reason: कर्मवाच्य कृदंत לֻקָּח को जारी घटना (“ले जाया जाते”) अथवा घटना के समय को सूचित करने वाले उपवाक्य (“उस समय… जब”) के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  choice: तुमने कठिन बात माँगी है
  rationale: हिफ़ील क्रिया और उसके साथ आए infinitive का संयुक्त मुहावरा यहाँ किसी कठिन या बड़ी माँग को व्यक्त करता है। हिंदी में यह रूप अर्थ और प्रसंग दोनों को स्वाभाविक ढंग से रखता है।
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  choice: यदि तुम मुझे अपने पास से उठा लिया जाते देखोगे
  rationale: לֻקָּח एक कर्मवाच्य कृदंत है। ‘उठा लिया जाते देखोगे’ घटना की जारी प्रक्रिया और अज्ञात कर्ता को बनाए रखता है; ‘अपने पास से’ מֵאִתָּךְ के अलग किए जाने के भाव को व्यक्त करता है।
- source_word: יְהִי לְךָ כֵן
  choice: तो तुम्हारे लिए ऐसा ही होगा
  rationale: यह निकट औपचारिक समतुल्य रूप माँगी हुई बात के पूरा होने का अर्थ देता है, बिना यह स्पष्ट किए कि उसे कौन पूरा करेगा।
- source_word: וְאִם אַיִן
  choice: पर यदि नहीं
  rationale: 'אַיִן यहाँ लुप्त कथन के साथ प्रयुक्त है: यदि तुम मुझे उठा लिया जाते न देखो। हिंदी में संक्षिप्त रूप मूल की दीर्घवृत्तता बनाए रखता है।'
- source_word: לֹא יִהְיֶה
  choice: तो ऐसा नहीं होगा
  rationale: माँगी हुई बात के पूरा न होने का आशय संदर्भ से स्पष्ट है। ‘ऐसा’ जोड़ने से हिंदी स्वाभाविक बनती है और पहले खंड के כֵן से संबंध भी बना रहता है।
