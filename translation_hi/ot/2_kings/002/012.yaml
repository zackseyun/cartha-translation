  to: एलीशा देख रहा था और पुकार रहा था, “हे मेरे पिता! हे मेरे पिता! इस्राएल का रथ और उसके घुड़सवार!”[a] फिर एलीशा ने उसे फिर नहीं देखा। तब उसने अपने वस्त्रों को पकड़ लिया और उन्हें फाड़कर दो टुकड़े कर दिए।
