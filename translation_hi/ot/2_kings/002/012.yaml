  text: וֶ/אֱלִישָׁ֣ע רֹאֶ֗ה וְ/ה֤וּא מְצַעֵק֙ אָבִ֣/י אָבִ֗/י רֶ֤כֶב יִשְׂרָאֵל֙ וּ/פָ֣רָשָׁ֔י/ו וְ/לֹ֥א רָאָ֖/הוּ ע֑וֹד וַֽ/יַּחֲזֵק֙ בִּ/בְגָדָ֔י/ו וַ/יִּקְרָעֵ֖/ם לִ/שְׁנַ֥יִם קְרָעִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/012.yaml
  text: And Elisha was watching[a], and he was crying out, “My father, my father! The chariot of Israel and its horsemen!” Then he saw him no more, and he took hold of his own clothes and tore them into two pieces.
translation:
  language: hi
  text: एलीशा देख रहा था और पुकार रहा था, “हे मेरे पिता! हे मेरे पिता! इस्राएल का रथ और उसके घुड़सवार!”[a] फिर एलीशा ने उसे फिर नहीं देखा। तब उसने अपने वस्त्रों को पकड़ लिया और उन्हें फाड़कर दो टुकड़े कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस उद्गार का आशय अनिश्चित है। यह एलिय्याह को इस्राएल की सामर्थ्य और रक्षा के रूप में संबोधित कर सकता है, या एलीशा के देखे हुए स्वर्गीय रथ और घुड़सवारों की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאֶה
  choice: देख रहा था
  rationale: वर्तमान कृदंत चल रही क्रिया को व्यक्त करता है; एलीशा उस घटना को घटते हुए देख रहा था।
- source_word: מְצַעֵק
  choice: पुकार रहा था
  rationale: कृदंत की कालगत निरंतरता और भावनात्मक तीव्रता दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: אָבִי אָבִי
  choice: हे मेरे पिता! हे मेरे पिता!
  rationale: प्रथम पुरुष एकवचन प्रत्यय और भावपूर्ण पुनरुक्ति दोनों सुरक्षित रखे गए हैं; संबोधन शिष्य और भविष्यद्वक्ता के संबंध को दर्शाता है।
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: इस्राएल का रथ और उसके घुड़सवार
  rationale: एकवचन ‘रथ’, बहुवचन ‘घुड़सवार’ और पुल्लिंग एकवचन संबंधसूचक प्रत्यय का सीधा, स्वाभाविक अनुवाद है; वाक्यांश की संदिग्ध व्याख्या को नहीं सुलझाया गया।
- source_word: וְלֹא רָאָהוּ עוֹד
  choice: फिर वह उसे दिखाई नहीं दिया
  rationale: हिन्दी में स्वाभाविक रूप से यह व्यक्त करता है कि एलीशा ने एलिय्याह को इसके बाद फिर नहीं देखा।
- source_word: וַיַּחֲזֵק בִּבְגָדָיו
  choice: अपने वस्त्र पकड़कर
  rationale: वस्त्र एलीशा के ही थे; ‘अपने’ हिन्दी में कर्ता की ओर प्रत्यावर्तन को स्पष्ट और सहज बनाता है।
- source_word: וַיִּקְרָעֵם לִשְׁנַיִם קְרָעִים
  choice: उन्हें फाड़ डाला और दो टुकड़े कर दिए
  rationale: शोक में वस्त्र फाड़ने की क्रिया और उसके परिणाम—दो भाग—दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: “इस्राएल का रथ और उसके घुड़सवार” का आशय
  choice: मुख्य पाठ में रूपकात्मक उद्गार को बिना व्याख्या के यथावत रखा गया।
  alternative: यह एलिय्याह को इस्राएल की वास्तविक सामर्थ्य और रक्षा कह सकता है, अथवा एलीशा द्वारा देखे जा रहे स्वर्गीय रथ और घोड़ों की ओर संकेत कर सकता है।
  rationale: इब्रानी दोनों संभावनाओं की अनुमति देता है; किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की वास्तविक व्याख्यात्मक और धर्मवैज्ञानिक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘वस्त्र’ शोक-संकेत के प्रसंग में ‘कपड़े’ से अधिक उपयुक्त और फिर भी सामान्य पाठक के लिए बोधगम्य है। मुख्य पाठ में कोई पाद-टिप्पणी चिह्न नहीं है, क्योंकि अंग्रेज़ी में दिया गया [a] ‘was watching’ के बाद स्थित होकर ऐसी टिप्पणी से जुड़ता है जो वास्तव में बाद के उद्गार की व्याख्या करती है; उस गलत स्थान को हिन्दी में नहीं दोहराया गया।
