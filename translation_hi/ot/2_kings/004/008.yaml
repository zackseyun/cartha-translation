  to: एक दिन एलीशा शूनेम से होकर गुज़रा। वहाँ एक प्रतिष्ठित स्त्री[a] थी। उसने उसे रोटी खाने[b] के लिए बहुत आग्रह किया। और जब-जब वह वहाँ से गुज़रता, वह रोटी खाने के लिए वहाँ मुड़ जाता था।
