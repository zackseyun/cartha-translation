  text: וַ/יְהִ֨י הַ/יּ֜וֹם וַ/יַּעֲבֹ֧ר אֱלִישָׁ֣ע אֶל שׁוּנֵ֗ם וְ/שָׁם֙ אִשָּׁ֣ה גְדוֹלָ֔ה וַ/תַּחֲזֶק בּ֖/וֹ לֶ/אֱכָל לָ֑חֶם וַֽ/יְהִי֙ מִ/דֵּ֣י עָבְר֔/וֹ יָסֻ֥ר שָׁ֖מָּ/ה לֶ/אֱכָל לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
translation:
  language: hi
  text: एक दिन एलीशा शूनेम से होकर गुज़रा। वहाँ एक प्रतिष्ठित स्त्री[a] थी। उसने उसे रोटी खाने[b] के लिए बहुत आग्रह किया। और जब-जब वह वहाँ से गुज़रता, वह रोटी खाने के लिए वहाँ मुड़ जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक बड़ी स्त्री’; यहाँ इसका आशय संभवतः सामाजिक प्रतिष्ठा, प्रभाव या साधन-संपन्नता से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘रोटी खाने’; यह अभिव्यक्ति भोजन करने के अर्थ में भी प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन
  rationale: यह इब्रानी कथा का प्रचलित काल-सूचक आरंभ है; आधुनिक हिन्दी में ‘एक दिन’ स्वाभाविक रूप से वही भाव व्यक्त करता है।
- source_word: וַיַּעֲבֹר אֱלִישָׁע אֶל שׁוּנֵם
  choice: एलीशा शूनेम से होकर गुज़रा
  rationale: यात्रा के इस प्रसंग में עבר नगर से होकर जाने का भाव देता है; यह अनुवाद बाद में बार-बार वहाँ से गुज़रने के उल्लेख से भी मेल खाता है।
- source_word: אִשָּׁה גְדוֹלָה
  choice: एक प्रतिष्ठित स्त्री
  rationale: शाब्दिक अर्थ ‘एक बड़ी स्त्री’ है, पर यहाँ גְדוֹלָה संभवतः सामाजिक प्रतिष्ठा, प्रभाव या साधन-संपन्नता का द्योतक है। ‘प्रतिष्ठित’ धनवान होने का अनावश्यक रूप से निश्चित दावा नहीं करता।
- source_word: וַתַּחֲזֶק בּוֹ
  choice: उसने उससे ... बहुत आग्रह किया
  rationale: इस मुहावरे में किसी पर ज़ोर डालने या उसे मनाने का भाव है। ‘बहुत आग्रह किया’ आतिथ्य के संदर्भ में उसकी प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֶאֱכָל לָחֶם
  choice: रोटी खाने
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, जबकि पूरा पद भोजन करने के लिए भी प्रयुक्त होता है। मुख्य पाठ में स्रोत का ठोस शब्द रखा गया है और व्यापक मुहावरेदार अर्थ पादटिप्पणी में बताया गया है।
- source_word: מִדֵּי עָבְרוֹ
  choice: जब-जब वह उधर से गुज़रता
  rationale: यह रचना बार-बार होने वाले अवसर को व्यक्त करती है; ‘जब-जब’ उसका आवृत्तिमूलक अर्थ स्पष्ट और सहज बनाता है।
- source_word: יָסֻר שָׁמָּה
  choice: वह ... उसके यहाँ मुड़ जाता था
  rationale: סור में मार्ग से हटकर किसी स्थान पर जाने का दिशात्मक भाव है। ‘मुड़ जाता था’ उस भाव और दोहराई जाने वाली क्रिया, दोनों को बनाए रखता है।
