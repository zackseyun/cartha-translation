  text: וּ/בָ֗את וְ/סָגַ֤רְתְּ הַ/דֶּ֨לֶת֙ בַּעֲדֵ֣/ךְ וּ/בְעַד בָּנַ֔יִ/ךְ וְ/יָצַ֕קְתְּ עַ֥ל כָּל הַ/כֵּלִ֖ים הָ/אֵ֑לֶּה וְ/הַ/מָּלֵ֖א תַּסִּֽיעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
translation:
  language: hi
  text: फिर भीतर जाकर अपने और अपने बेटों के पीछे दरवाज़ा बंद कर लेना। तब इन सब बरतनों में उंडेलना, और जो बरतन भर जाए, उसे अलग रख देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָאת
  choice: फिर भीतर जाकर
  rationale: בוא यहाँ घर के भीतर जाने का निर्देश देता है; ‘फिर’ क्रमसूचक वाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  choice: द्वार बंद कर लेना
  rationale: סגר का सीधा अर्थ बंद करना है; ‘कर लेना’ निर्देश के क्रमिक और पूर्ण किए जाने वाले कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּעֲדֵךְ וּבְעַד בָּנַיִךְ
  choice: अपने और अपने बेटों के पीछे
  rationale: द्वार बंद करने के संदर्भ में בעד का स्थानगत अर्थ ‘पीछे’ है, जिससे स्त्री और उसके बेटों के भीतर तथा अन्य लोगों के बाहर रहने का भाव आता है।
- source_word: וְיָצַקְתְּ עַל
  choice: में तेल उंडेलना
  rationale: יצק का अर्थ उंडेलना है और बरतनों के साथ हिन्दी में ‘में’ स्वाभाविक है। ‘तेल’ निकटवर्ती संदर्भ से स्पष्ट, इब्रानी में अव्यक्त कर्म है, जिसे हिन्दी वाक्य की स्पष्टता के लिए व्यक्त किया गया है।
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: इन सब बरतनों
  rationale: כְּלִים व्यापक शब्द है, पर इस प्रसंग में तेल रखने वाले पात्र अभिप्रेत हैं; आधुनिक हिन्दी में ‘बरतन’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: וְהַמָּלֵא
  choice: जो बरतन भर जाए
  rationale: लेखयुक्त एकवचन विशेषण ‘भरा हुआ [बरतन]’ के अर्थ में संज्ञावत् प्रयुक्त है। हिन्दी का यह रूप प्रत्येक भरने वाले बरतन पर लागू होने वाला सामान्य निर्देश स्पष्ट करता है।
- source_word: תַּסִּיעִי
  choice: उसे अलग रख देना
  rationale: נסע के हिफ़ील रूप का यहाँ अर्थ भरे बरतन को उंडेलने की जगह से हटाकर अलग रखना है।
