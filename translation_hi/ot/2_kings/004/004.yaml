translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्री को संबोधित एकवचन निर्देशों को हिन्दी के स्वाभाविक आज्ञार्थक रूप में व्यक्त किया गया है। इब्रानी के संज्ञावत् एकवचन ‘भरा हुआ’ को सामूहिक बहुवचन बनाने के बजाय ‘जो बरतन भर जाए’ कहा गया है, जिससे उसका सामान्य और क्रमिक आशय सुरक्षित रहता है।
