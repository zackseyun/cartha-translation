base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
translation:
  language: hi
  text: तब उसने गेहजी से कहा, “कमर कस लो[a], मेरी लाठी अपने हाथ में लो और जाओ। यदि तुम्हें कोई मिले, तो उसे नमस्कार न करना[b]; और यदि कोई तुम्हें नमस्कार करे, तो उसे उत्तर न देना। मेरी लाठी लड़के के चेहरे पर रख देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “अपनी कमर बाँध लो”; यह शीघ्रता से काम के लिए तैयार होने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे आशीष न देना”; इसी प्रकार आगे, “यदि कोई तुम्हें आशीष दे।” इस प्रसंग में इब्रानी क्रिया संभवतः राह में अभिवादन के आदान-प्रदान को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  choice: कमर कस लो
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपनी कमर बाँध लो’ है और यह शीघ्रता से काम के लिए तैयार होने को दर्शाता है। ‘कमर कस लो’ आधुनिक हिन्दी का स्वाभाविक और अर्थ-संगत मुहावरा है।
- source_word: מִשְׁעַנְתִּי
  choice: मेरी लाठी
  rationale: यह संज्ञा सहारे के लिए प्रयुक्त डंडे या लाठी को सूचित करती है। इस कथानक में ‘लाठी’ सहज और स्पष्ट है।
- source_word: וָלֵךְ
  choice: और जाओ
  rationale: यह चलने की सीधी आज्ञा है; यह अनुवाद आज्ञाओं के क्रम और प्रसंग की तात्कालिकता को बनाए रखता है।
- source_word: כִּי תִמְצָא אִישׁ
  choice: यदि तुम्हें कोई मिले
  rationale: אִישׁ का मूल अर्थ ‘पुरुष/मनुष्य’ है, पर यहाँ उसका प्रयोग सामान्य अर्थ में रास्ते में मिलने वाले किसी भी व्यक्ति के लिए हुआ है। हिन्दी का ‘कोई’ इस सामान्य बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  choice: उसे नमस्कार न करना / यदि कोई तुम्हें नमस्कार करे
  rationale: ברך का मूल अर्थ ‘आशीष देना’ है, पर मिलने-जुलने के इस प्रसंग में यह अभिवादन करने या नमस्कार कहने के अर्थ में प्रयुक्त है। दोनों स्थानों पर एक ही हिन्दी शब्द रखने से मूल की पुनरावृत्ति भी बनी रहती है।
- source_word: לֹא תַעֲנֶנּוּ
  choice: उसे उत्तर न देना
  rationale: ענה यहाँ किसी के अभिवादन का उत्तर देने या प्रत्युत्तर करने को दर्शाता है। ‘उत्तर न देना’ सीधा और संक्षिप्त है।
- source_word: וְשַׂמְתָּ מִשְׁעַנְתִּי עַל פְּנֵי הַנָּעַר
  choice: मेरी लाठी लड़के के चेहरे पर रख देना
  rationale: שׂים का अर्थ ‘रखना’ है और עַל־פְּנֵי का शाब्दिक आशय ‘चेहरे पर’ है। अनुवाद मूल की ठोस क्रिया और शारीरिक संकेत को बनाए रखता है।
- source_word: הַנָּעַר
  choice: लड़का
  rationale: נַעַר लड़के, किशोर या युवक को सूचित कर सकता है। यहाँ शूनेमी स्त्री के बेटे के लिए ‘लड़का’ प्रसंगानुकूल और सामान्य आधुनिक हिन्दी है।
