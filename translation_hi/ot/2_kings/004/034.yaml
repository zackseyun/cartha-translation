base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
translation:
  language: hi
  text: तब वह ऊपर गया और बालक पर लेट गया। उसने अपना मुँह उसके मुँह पर, अपनी आँखें उसकी आँखों पर और अपनी हथेलियाँ उसकी हथेलियों पर रखीं। और वह उसके ऊपर झुक गया[a], और बालक का शरीर गरम हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसके ऊपर अपने को फैलाया।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और बालक के ऊपर झुकने या अपने को फैलाने की मुद्रा बता सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: तब वह ऊपर गया
  rationale: עלה का सीधा अर्थ ‘ऊपर जाना/चढ़ना’ है। ऊपर के कमरे का संकेत प्रसंग में है, पर इस पद में वह स्पष्ट रूप से नहीं कहा गया।
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  choice: बालक पर लेट गया
  rationale: שׁכב और עַל की ठोस शारीरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיָּשֶׂם פִּיו עַל פִּיו וְעֵינָיו עַל עֵינָיו וְכַפָּיו עַל כַּפָּיו
  choice: अपना मुँह उसके मुँह पर, अपनी आँखें उसकी आँखों पर और अपनी हथेलियाँ उसकी हथेलियों पर रखीं
  rationale: अंगों के आमने-सामने रखे जाने की इब्रानी समानांतर रचना सुरक्षित है; כַּף को अधिक विशिष्ट ‘हथेली’ अनूदित किया गया है।
- source_word: וַיִּגְהַר עָלָיו
  choice: उसके ऊपर झुककर फैल गया
  rationale: दुर्लभ גהר झुकने या शरीर फैलाकर ऊपर होने की मुद्रा बताता है। संयुक्त अभिव्यक्ति प्रसंग की शारीरिक मुद्रा व्यक्त करती है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  choice: बालक का शरीर गरम हो गया
  rationale: חם के परिणामसूचक अर्थ ‘गरम हो जाना’ को स्पष्ट करता है। בשר का यहाँ स्वाभाविक हिन्दी शारीरिक समतुल्य ‘शरीर’ है; ‘मांस’ अनावश्यक रूप से अस्वाभाविक लगेगा।
- source_word: הַיֶּלֶד / הַיָּלֶד
  choice: बालक
  rationale: יֶלֶד इस प्रसंग में पुत्र/लड़के को सूचित करता है; ‘बालक’ आधुनिक, गरिमापूर्ण और सटीक है।
theological_decisions:
- issue: मृत बालक के प्रति एलीशा की क्रिया का स्वरूप
  choice: शारीरिक क्रियाओं को ठोस रूप में वर्णित करना, पर उनकी कार्यविधि की व्याख्या न करना
  alternative: इसे मुँह-से-मुँह पुनर्जीवन या किसी संस्कारात्मक क्रिया के रूप में बताना
  rationale: इब्रानी पाठ क्रियाओं का वर्णन करता है, किंतु यह नहीं बताता कि वे किसी चिकित्सकीय तकनीक या संस्कार की तरह कैसे काम करती हैं। अनुवाद किसी बाद की अवधारणा को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सहज। शारीरिक क्रिया की ठोसता रखी गई है, पर अस्पष्ट दुर्लभ क्रिया को पादटिप्पणी सहित प्रस्तुत किया गया है।
