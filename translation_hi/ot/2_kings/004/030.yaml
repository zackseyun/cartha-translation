id: 2KI.4.30
reference: 2 Kings 4:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
translation:
  language: hi
  text: तब लड़के की माँ ने कहा[a], “याहवे के जीवन की और आपके जीवन की शपथ, मैं आपको नहीं छोड़ूँगी।” तब वह उठकर उसके पीछे चल पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह एक इब्रानी शपथ-सूत्र है; इसका भाव है, “जितना निश्चित है कि याहवे जीवित हैं और आप जीवित हैं, उतना ही निश्चित है कि मैं आपको नहीं छोड़ूँगी।”
    reason: मूल शपथ-सूत्र की भाषा और आशय स्पष्ट करना।
lexical_decisions:
- source_word: אֵם הַנַּעַר
  choice: लड़के की माँ
  rationale: इब्रानी संबंधवाचक पदबंध का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप।
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: याहवे के जीवन की और आपके जीवन की शपथ
  rationale: यह मानक इब्रानी शपथ-सूत्र है। हिन्दी में ‘की शपथ’ जोड़ने से इसका आशय स्पष्ट होता है, जबकि याहवे और संबोधित व्यक्ति—दोनों के जीवन का उल्लेख बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אִם אֶעֶזְבֶךָּ
  choice: मैं आपको नहीं छोड़ूँगी
  rationale: शपथ के बाद אִם नकारात्मक दृढ़ कथन का कार्य करता है; हिन्दी में सीधे निषेध से अर्थ स्वाभाविक और स्पष्ट रहता है। स्त्रीलिंग क्रिया वक्ता, लड़के की माँ, के अनुरूप है।
- source_word: וַיָּקָם
  choice: तब वह उठा
  rationale: क्रमिक आख्यान में एलीशा की प्रतिक्रिया व्यक्त होती है; ‘उठा’ קום का सहज हिन्दी रूप है।
- source_word: וַיֵּלֶךְ אַחֲרֶיהָ
  choice: उसके पीछे चल पड़ा
  rationale: शाब्दिक ‘उसके पीछे गया’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि एलीशा उसके साथ जाने लगा।
theological_decisions:
- issue: शपथ-सूत्र में יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: נַפְשְׁךָ का अर्थ
  choice: आपके जीवन की
  alternative: आपके प्राण की / जैसे आप जीवित हैं
  rationale: נפש यहाँ व्यक्ति के ‘जीवन’ को सूचित करता है। ‘आपके जीवन की शपथ’ मूल की संरचना और शपथ के अर्थ—दोनों को स्पष्ट रखता है, बिना ‘आत्मा’ संबंधी अतिरिक्त तात्त्विक अर्थ आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’, और गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। शपथ-सूत्र की मूल छवि को यथासंभव बनाए रखते हुए हिन्दी में उसका अर्थ स्पष्ट किया गया है।
