lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: बड़ा हुआ
  rationale: גדל यहाँ बालक के बढ़ने को व्यक्त करता है। ‘बड़ा हुआ’ स्वाभाविक हिन्दी है और ‘पूरी तरह बड़ा हो गया’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הַיָּלֶד
  choice: बालक
  rationale: יֶלֶד का अर्थ ‘बालक’ या ‘बच्चा’ हो सकता है। प्रसंग में पुरुष लिंग स्पष्ट है; ‘बालक’ dignified और आयु के विषय में अपेक्षाकृत खुला है।
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन
  rationale: यह इब्रानी कथात्मक मुहावरा किसी विशेष अवसर का परिचय देता है। ‘एक दिन’ आधुनिक हिन्दी में उसका स्वाभाविक समतुल्य है।
- source_word: וַיֵּצֵא
  choice: बाहर गया
  rationale: יצא में बाहर निकलने की दिशात्मक धारणा है, जिसे ‘बाहर गया’ बनाए रखता है।
- source_word: אֶל אָבִיו
  choice: अपने पिता के पास
  rationale: אֶל गंतव्य की ओर गति बताता है। कर्ता के साथ स्वाभाविक हिन्दी के लिए ‘अपने पिता के पास’ उपयुक्त है।
- source_word: אֶל הַקֹּצְרִים
  choice: कटनी करनेवालों के पास
  rationale: קֹצְרִים अनाज काटनेवाले लोग हैं। ‘कटनी करनेवाले’ सामान्य पाठक के लिए स्पष्ट है और दोहराए गए אֶל की संरचना को भी बनाए रखता है।
