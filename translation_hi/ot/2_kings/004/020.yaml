  text: וַ/יִּשָּׂאֵ֔/הוּ וַ/יְבִיאֵ֖/הוּ אֶל אִמּ֑/וֹ וַ/יֵּ֧שֶׁב עַל בִּרְכֶּ֛י/הָ עַד הַֽ/צָּהֳרַ֖יִם וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
translation:
  language: hi
  text: तब वह उसे उठाकर उसकी माँ के पास ले आया। वह दोपहर तक उसकी गोद में[a] बैठा रहा; फिर वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके घुटनों पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  choice: उसे उठाकर
  rationale: נשׂא का अर्थ उठाना, ढोना या ले जाना हो सकता है। यहाँ अगले क्रियापद ‘ले आया’ के साथ ‘उठाकर’ स्वाभाविक रूप से आरंभिक क्रिया व्यक्त करता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: וַיְבִיאֵהוּ
  choice: ले आया
  rationale: ביא के हिफ़ील रूप का सामान्य अर्थ ‘लाना’ है; ‘माँ के पास ले आया’ दिशा को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: אֶל אִמּוֹ
  choice: उसकी माँ के पास
  rationale: यह संबंध और गंतव्य दोनों को सीधी, आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיֵּשֶׁב
  choice: बैठा रहा
  rationale: ישׁב का अर्थ यहाँ बैठना है; ‘दोपहर तक’ की अवधि के कारण ‘बैठा रहा’ हिंदी में निरंतर अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל בִּרְכֶּיהָ
  choice: उसकी गोद में
  rationale: इब्रानी में शाब्दिक रूप से ‘उसके घुटनों पर’ है, पर बच्चे के संदर्भ में आधुनिक हिंदी का स्वाभाविक समतुल्य ‘उसकी गोद में’ है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: עַד הַצָּהֳרַיִם
  choice: दोपहर तक
  rationale: צָהֳרַיִם मध्याह्न या दोपहर को दर्शाता है; ‘दोपहर तक’ सामान्य आधुनिक हिंदी है।
- source_word: וַיָּמֹת
  choice: फिर वह मर गया
  rationale: वाव-क्रमिक रूप कथा की अगली घटना बताता है; ‘फिर’ उस क्रम को स्वाभाविक हिंदी में व्यक्त करता है।
