language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
translation:
  language: hi
  text: तब उसने अपने पति से कहा, “देखो, मैं जानती हूँ कि यह परमेश्वर का पवित्र जन है, जो नियमित रूप से[a] हमारे यहाँ से होकर जाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सदा” या “लगातार।”
    reason: תָּמִיד का अर्थ ‘सदा/लगातार’ भी हो सकता है, पर इस प्रसंग में बार-बार की नियमित यात्रा अभिप्रेत जान पड़ती है।
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל אִישָׁהּ
  choice: अपने पति से
  rationale: इस घरेलू प्रसंग में प्रत्यययुक्त אִישׁ का अर्थ स्वाभाविक रूप से ‘उसका पति’ है; हिन्दी में कर्ता के संदर्भ में ‘अपने पति’ उचित है।
- source_word: הִנֵּה נָא
  choice: देखो, अब
  rationale: यह ध्यान आकर्षित करने वाला विनम्र या बलाघाती पदबंध है। ‘देखो, अब’ इसके संकेतात्मक बल को आधुनिक हिन्दी में सहज रखता है।
- source_word: יָדַעְתִּי
  choice: मैं जान गई हूँ
  rationale: पूर्ण रूप बार-बार के अनुभव से प्राप्त और अब स्थापित पहचान को दर्शाता है; स्त्री वक्ता के लिए ‘जान गई हूँ’ स्वाभाविक है।
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह पूर्ववर्ती नबियों में नबी या परमेश्वर से नियुक्त व्यक्ति के लिए प्रचलित उपाधि है; ‘परमेश्वर का जन’ इसकी साहित्यिक और धार्मिक शक्ति बनाए रखता है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह अलग ठहराए जाने या पवित्रता को व्यक्त करता है और व्यक्ति के लिए मानक हिन्दी रूप है।
- source_word: עֹבֵר עָלֵינוּ
  choice: हमारे यहाँ से होकर जाता है
  rationale: यात्रा के इस संदर्भ में पदबंध उनके स्थान के पास से गुजरने को बताता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: תָּמִיד
  choice: नियमित रूप से
  rationale: यहाँ आशय निरंतर बिना रुके होने से नहीं, बल्कि बार-बार होने वाली आदतन यात्रा से है। ‘नियमित रूप से’ उस भाव को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: אִישׁ אֱלֹהִים की उपाधि का अनुवाद
  choice: परमेश्वर का जन
  alternative: भक्त पुरुष; परमेश्वर से संबंधित व्यक्ति
  rationale: ‘परमेश्वर का जन’ मान्य बाइबलीय उपाधि को सुरक्षित रखता है और पाठ से परे कोई बाद की धर्मसैद्धांतिक धारणा नहीं जोड़ता।
- issue: קָדוֹשׁ का उपाधि से संबंध
  choice: परमेश्वर का पवित्र जन
  alternative: पवित्र व्यक्ति, जो परमेश्वर का जन है
  rationale: मूल वाक्य में ‘पवित्र’ उसी ‘परमेश्वर के जन’ का वर्णन करता है। संयुक्त हिन्दी पदबंध इस संबंध को बनाए रखता है, बिना यह तय किए कि उसकी पवित्रता का सटीक धर्मसैद्धांतिक स्वरूप क्या है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यक्ति’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘परमेश्वर का जन’ पारंपरिक बाइबलीय उपाधि को सुरक्षित रखता है।
