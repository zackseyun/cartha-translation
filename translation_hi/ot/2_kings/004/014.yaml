  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
translation:
  language: hi
  text: तब उसने कहा[a], “तो उसके लिए क्या किया जाए?” गेहजी ने कहा, “असल में, उसका कोई बेटा नहीं है[b], और उसका पति बूढ़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए क्या किया जाना चाहिए?”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक इब्रानी: “उसके लिए कोई बेटा नहीं है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  choice: तो उसके लिए क्या किया जाए?
  rationale: प्रश्नवाचक अभिव्यक्ति और उसके हित में किए जाने वाले कार्य का भाव स्वाभाविक तथा अर्थनिष्ठ हिन्दी में रखा गया है।
- source_word: גֵּיחֲזִי
  choice: गेहजी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲבָל
  choice: असल में
  rationale: यहाँ पद प्रबल विरोध के बजाय विचारपूर्वक बताई गई वास्तविक परिस्थिति प्रस्तुत करता है।
- source_word: בֵּן אֵין לָהּ
  choice: उसका कोई बेटा नहीं है
  rationale: इब्रानी अस्तित्ववाचक रचना को स्वाभाविक हिन्दी अधिकार-सूचक वाक्य में व्यक्त किया गया है; בֵּן का विशिष्ट अर्थ ‘बेटा’ सुरक्षित है।
- source_word: וְאִישָׁהּ זָקֵן
  choice: और उसका पति बूढ़ा है
  rationale: संदर्भ में אִישׁ का अर्थ ‘पति’ है और זָקֵן उसकी वृद्ध अवस्था का सीधा कथन है।
