translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। शाब्दिक ‘उँडेलो’ के बजाय भोजन के प्रसंग में स्वाभाविक ‘परोस दो’ चुना गया है; कोई सांप्रदायिक या व्याख्यात्मक विस्तार नहीं जोड़ा गया।
