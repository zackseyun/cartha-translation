  to: तब उसने कहा, “कुछ आटा लाओ।” उसने उसे हाँड़ी में डाल दिया और कहा, “लोगों को परोस दो, ताकि वे खाएँ।” तब हाँड़ी में कोई हानिकारक चीज़ नहीं थी।
