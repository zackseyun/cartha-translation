base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/041.yaml
  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
translation:
  language: hi
  text: तब उसने कहा, “कुछ आटा लाओ।” उसने उसे हाँड़ी में डाल दिया और कहा, “लोगों को परोस दो, ताकि वे खाएँ।” तब हाँड़ी में कोई हानिकारक चीज़ नहीं थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है।
- source_word: וּקְחוּ קֶמַח
  choice: कुछ आटा लाओ
  rationale: बहुवचन आज्ञार्थक לקח प्रसंग में वस्तु लाने का निर्देश है; קֶמַח के लिए सामान्य आधुनिक शब्द ‘आटा’ उपयुक्त है।
- source_word: וַיַּשְׁלֵךְ אֶל־הַסִּיר
  choice: उसने उसे हाँड़ी में डाल दिया
  rationale: שׁלך का मूल भाव फेंकना/डालना है; आटे के प्रसंग में ‘डाल दिया’ स्वाभाविक है और क्रिया की स्पष्टता बनाए रखता है।
- source_word: הַסִּיר
  choice: हाँड़ी
  rationale: यह पकाने का पात्र है; ‘हाँड़ी’ हिन्दी में खाद्य पकाने वाले बर्तन को स्पष्ट और संक्षिप्त रूप से दर्शाता है।
- source_word: צַק לָעָם
  choice: लोगों के लिए परोस दो
  rationale: יצק का शाब्दिक अर्थ उँडेलना है, पर यहाँ हाँड़ी से भोजन बाँटने की क्रिया अभिप्रेत है; ‘परोस दो’ प्रसंगगत अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: וְיֹאכֵלוּ
  choice: ताकि वे खाएँ
  rationale: संयोजक सहित अपूर्ण क्रिया आज्ञा के उद्देश्य/परिणाम को व्यक्त करती है।
- source_word: וְלֹא הָיָה דָבָר רָע בַּסִּיר
  choice: तब हाँड़ी में कोई हानिकारक चीज़ नहीं रही
  rationale: דָבָר רָע का शाब्दिक अर्थ ‘बुरी चीज़’ है, किंतु विषैले भोजन के निकट प्रसंग में भौतिक हानि अभिप्रेत है; ‘नहीं रही’ पहले की हानिकारक दशा के समाप्त होने को स्वाभाविक रूप से व्यक्त करता है।
