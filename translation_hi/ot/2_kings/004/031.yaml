  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
translation:
  language: hi
  text: गेहजी उनसे आगे चला गया और उसने वह लाठी लड़के के चेहरे पर रख दी, पर न कोई आवाज़ थी, न कोई प्रतिक्रिया[a]। तब वह एलीशा से मिलने के लिए लौट आया और उससे कहा, “लड़का नहीं जागा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, ‘न कोई आवाज़ थी और न ध्यान देने या सुनने का कोई संकेत।’
    reason: हिब्रू वाक्यांश ‘न कोई आवाज़ और न काशेव’ में दूसरे शब्द का अर्थ ध्यान देना अथवा सुनने की प्रतिक्रिया भी हो सकता है।
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  choice: उन दोनों से आगे निकल गया
  rationale: यह मुहावरा बताता है कि गेहजी एलीशा और स्त्री के आगे चला गया। ‘उन दोनों से’ बहुवचन प्रत्यय को संदर्भानुसार स्पष्ट करता है।
- source_word: הַמִּשְׁעֶנֶת
  choice: वह लाठी
  rationale: यह एलीशा की पहले उल्लिखित लाठी है; ‘लाठी’ आधुनिक हिन्दी में स्वाभाविक और वस्तु के लिए पर्याप्त रूप से सटीक है।
- source_word: עַל פְּנֵי הַנַּעַר
  choice: लड़के के चेहरे पर
  rationale: פָּנִים का ठोस अर्थ ‘चेहरा’ है और इस प्रसंग में נַעַר के लिए ‘लड़का’ उपयुक्त है।
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  choice: न कोई आवाज़ हुई, न कोई प्रतिक्रिया
  rationale: קוֹל को ‘आवाज़’ के रूप में सीधे रखा गया है; קָשֶׁב का मूल भाव ध्यान देने या सुनने का है, जो यहाँ प्रसंगतः प्रत्युत्तर न मिलने को दर्शाता है।
- source_word: וַיָּשָׁב לִקְרָאתוֹ
  choice: वह एलीशा से मिलने के लिए लौट आया
  rationale: ‘लौट आया’ गति को और ‘मिलने के लिए’ לִקְרָאתוֹ के उद्देश्य को व्यक्त करता है। सर्वनाम की जगह एलीशा का नाम हिन्दी में संदर्भ स्पष्ट रखता है।
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: और उससे कहा
  rationale: हिब्रू का कथन-सूत्र हिन्दी में शब्दशः ‘बताकर कहा’ करने पर अनावश्यक रूप से भारी लगता; सीधा कथन अर्थ को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: לֹא הֵקִיץ הַנָּעַר
  choice: लड़का जागा नहीं है
  rationale: हिफ़ील क्रिया यहाँ अकर्मक अर्थ में ‘जागना’ देती है; पूर्ण क्रिया के परिणामगत भाव को हिन्दी के ‘जागा नहीं है’ से व्यक्त किया गया है।
