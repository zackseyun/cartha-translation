translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘प्रतिक्रिया’ प्रसंग में सहज है, किंतु ‘आवाज़’ को बनाए रखकर मृत्यु या जीवन के संकेत जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
