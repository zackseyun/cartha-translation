base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
translation:
  language: hi
  text: जब बरतन भर गए[a], तब उसने अपने बेटे से कहा, “मेरे पास एक और बरतन ले आ।” लेकिन उसके बेटे ने उससे कहा, “अब कोई और बरतन नहीं है।” तब तेल बहना रुक गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पात्र भर गए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तेल ठहर गया।” आशय है कि तेल बहना बंद हो गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת
  choice: जब ... भर गए
  rationale: כ के साथ infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। हिंदी में ‘जब बरतन भर गए’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: הַכֵּלִים / כֶּלִי
  choice: बरतन
  rationale: כְּלִי एक व्यापक शब्द है, जो यहाँ तेल रखने के पात्रों को दर्शाता है। ‘बरतन’ आधुनिक हिंदी में सहज है और ‘घड़ा’ जैसे किसी विशेष आकार या पदार्थ को नहीं जोड़ता।
- source_word: הַגִּישָׁה אֵלַי
  choice: मेरे पास ले आ
  rationale: नגשׁ के हिफ़ील आज्ञार्थक का मूल भाव पास लाना या प्रस्तुत करना है। प्रसंग में बेटा अगला बरतन स्त्री के पास लाता है।
- source_word: עוֹד
  choice: एक और / अब कोई और
  rationale: एकवचन כֶּלִי के साथ עוֹד किसी अतिरिक्त बरतन का बोध कराता है। उत्तर में ‘अब’ प्रसंगगत समाप्ति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֵין עוֹד כֶּלִי
  choice: अब कोई और बरतन नहीं है
  rationale: אֵין अस्तित्व के अभाव को व्यक्त करता है; यह अनुवाद बताता है कि भरने के लिए कोई अतिरिक्त बरतन उपलब्ध नहीं रहा।
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  choice: तब तेल बहना रुक गया
  rationale: עמד का शाब्दिक अर्थ ‘खड़ा होना/ठहरना’ है, पर यहाँ आशय तेल का बहना बंद हो जाना है। मुख्य पाठ में निहित क्रिया को स्पष्ट करके स्वाभाविक हिंदी दी गई है।
