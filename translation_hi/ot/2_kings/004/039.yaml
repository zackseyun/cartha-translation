base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
translation:
  language: hi
  text: तब उनमें से एक आदमी खेत में साग-पात बटोरने[a] गया। वहाँ उसे एक जंगली बेल मिली, और उसने उससे जंगली कद्दू[b] बटोरकर अपना वस्त्र भर लिया। फिर वह आया और उन्हें काटकर हाँडी में पक रहे झोल में डाल दिया, क्योंकि वे नहीं जानते थे कि वे क्या थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘साग-पात’ का अनुवाद ‘खाने योग्य हरी पत्तियाँ’ भी हो सकता है। इब्रानी शब्द खेत से बटोरे जाने वाले खाद्य पौधों के लिए व्यापक रूप से प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘खेत की बेल’ और ‘खेत के कद्दू’। आशय जंगली बेल और उस पर लगे जंगली कद्दू-जैसे फलों से है; संभवतः ये कोलोसिन्थ थे।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी संयोजक का अनुवाद ‘क्योंकि’ या ‘इसलिए कि’ किया जा सकता है; यह उनकी अज्ञानता को कारण या व्याख्या के रूप में प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָד
  choice: उनमें से एक आदमी
  rationale: यहाँ संख्या ‘एक’ समूह के किसी एक पुरुष सदस्य के लिए संज्ञा के समान प्रयुक्त हुई है। ‘उनमें से’ प्रसंगगत संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְלַקֵּט אֹרֹת
  choice: साग-पात बटोरने
  rationale: אֹרֹת खेत से जुटाए जाने वाले खाद्य पौधों अथवा हरी पत्तियों का व्यापक संकेत देता है। ‘साग-पात’ सामान्य पाठक के लिए स्वाभाविक है और किसी खास वनस्पति का अनावश्यक निर्धारण नहीं करता।
- source_word: גֶּפֶן שָׂדֶה
  choice: एक जंगली बेल
  rationale: शाब्दिक अभिव्यक्ति ‘खेत की बेल’ है, जिसका आशय असंवर्धित रूप से उगने वाली बेल है। ‘जंगली बेल’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: פַּקֻּעֹת שָׂדֶה
  choice: जंगली कद्दू
  rationale: यह शब्द बेल पर लगे जंगली कद्दू-जैसे फलों को सूचित करता है, संभवतः कोलोसिन्थ; मुख्य पाठ में तकनीकी वनस्पति-नाम देने के बजाय व्यापक और बोधगम्य पद चुना गया है।
- source_word: מְלֹא בִגְדוֹ
  choice: इतने ... कि उसका वस्त्र भर गया
  rationale: इब्रानी मुहावरा मात्रा बताता है और उस चित्र को बनाए रखता है कि बाहरी वस्त्र को पात्र की तरह भर लिया गया था।
- source_word: וַיְפַלַּח
  choice: उन्हें काट-काटकर
  rationale: क्रिया का अर्थ चीरना, फाँकना या टुकड़े करना है। पूर्वोक्त फलों को कर्म के रूप में स्पष्ट करना हिन्दी में स्वाभाविक है।
- source_word: סִיר הַנָּזִיד
  choice: पकवान की हाँडी
  rationale: נָזִיד पकाकर तैयार किए गए गाढ़े खाद्य पदार्थ को दर्शाता है। ‘पकवान की हाँडी’ सरल है और ‘शोरबा’, ‘खिचड़ी’ या ‘दाल’ जैसे अधिक विशिष्ट अर्थ आरोपित नहीं करता।
- source_word: כִּי לֹא יָדָעוּ
  choice: क्योंकि वे नहीं जानते थे कि वे क्या थे
  rationale: כִּי को उसके सामान्य व्याख्यात्मक/कारणसूचक अर्थ में लिया गया है। ‘कि वे क्या थे’ इब्रानी में निहित कर्म को हिन्दी में स्पष्ट करता है, पर यह तय नहीं करता कि अज्ञान पौधे की पहचान, गुण या विषाक्तता के विषय में था।
