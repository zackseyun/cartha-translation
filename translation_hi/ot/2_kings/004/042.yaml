base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
translation:
  language: hi
  text: एक मनुष्य बाल-शालीशा से आया और परमेश्वर के जन के पास पहली उपज की रोटी—अर्थात जौ की बीस रोटियाँ—और अपनी थैली[b] में ताज़ा अनाज[a] लाया। तब उसने कहा, “इसे लोगों को दे दो, ताकि वे खाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भुना हुआ अनाज।” इब्रानी शब्द केवल ताज़े अनाज के बजाय खाने के लिए तैयार किए गए अनाज को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और इसका ठीक अर्थ अनिश्चित है; इससे थैला, झोला, कोई लपेटने वाली वस्तु, या संभवतः अनाज का छिलका अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: एक मनुष्य
  rationale: यह संज्ञा यहाँ एक पुरुष व्यक्ति को सूचित करती है; ‘एक मनुष्य’ स्रोत के निकट और स्वाभाविक है।
- source_word: מִבַּעַל שָׁלִשָׁה
  choice: बाल-शालीशा से
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी के लिए प्रयुक्त इब्रानी उपाधि है। केवल ‘नबी’ कहने के बजाय मूल अभिव्यक्ति की साहित्यिक प्रतिध्वनि बनाए रखी गई है।
- source_word: לֶחֶם בִּכּוּרִים
  choice: पहली उपज की रोटी
  rationale: यह पदबंध पहली उपज से जुड़ी रोटी को दर्शाता है; यह चयन उसके संभावित अर्पण-संबंधी भाव को बिना अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: עֶשְׂרִים לֶחֶם שְׂעֹרִים
  choice: जौ की बीस रोटियाँ
  rationale: गिनती के इस संदर्भ में לֶחֶם अलग-अलग रोटियों को दर्शाता है; हिंदी में यह सहज और स्पष्ट है।
- source_word: כַרְמֶל
  choice: ताज़ा अनाज
  rationale: यहाँ शब्द कर्मेल पर्वत का नाम नहीं, बल्कि नई अथवा खाने के लिए तैयार की गई अनाज की अवस्था को दर्शाता है। व्यापक अर्थ मुख्य पाठ में रखा गया है और ‘भुना हुआ अनाज’ पादटिप्पणी में दिया गया है।
- source_word: בְּצִקְלֹנוֹ
  choice: अपनी थैली में
  rationale: यह दुर्लभ और अनिश्चित शब्द संभवतः किसी थैले, झोले या लपेटने वाली वस्तु को दर्शाता है। ‘थैली’ संदर्भ में स्पष्ट है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: תֵּן לָעָם וְיֹאכֵלוּ
  choice: इसे लोगों को दे दो, ताकि वे खाएँ
  rationale: आज्ञार्थक क्रिया के बाद की क्रिया उद्देश्य अथवा अपेक्षित परिणाम बताती है; यह हिंदी रचना उस संबंध को स्वाभाविक रूप से व्यक्त करती है।
