base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
translation:
  language: hi
  text: तब उन्होंने पुरुषों के खाने के लिए उसे परोस दिया। लेकिन जब वे उस पकवान में से खा रहे थे, तो वे चिल्ला उठे और बोले, “हे परमेश्वर के जन, हाँड़ी में मौत[a] है!” और वे खा न सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “हाँड़ी में मौत है।” इसका आशय संभवतः यह है कि पकवान घातक या विषैला था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  choice: परोस दिया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘उँडेलना’ है, पर पके हुए तरल पकवान को लोगों के लिए निकालने के प्रसंग में ‘परोस दिया’ स्वाभाविक हिन्दी है और क्रिया का आशय सुरक्षित रखता है।
- source_word: לַאֲנָשִׁים
  choice: पुरुषों को
  rationale: אֲנָשִׁים यहाँ उपस्थित पुरुषों को सूचित करता है; इसलिए सामान्यीकृत ‘लोगों’ के बजाय लिंग-सटीक अनुवाद रखा गया है।
- source_word: מֵהַנָּזִיד
  choice: उस पकवान में से
  rationale: נָזִיד उबाले हुए गाढ़े व्यंजन अथवा स्टू को सूचित करता है। ‘पकवान’ आधुनिक हिन्दी में सुबोध है और निकटवर्ती प्रसंग में हाँड़ी में पकाए गए मिश्रण को दर्शाता है।
- source_word: צָעָקוּ
  choice: चिल्ला उठे
  rationale: क्रिया भय और तात्कालिकता से भरी ऊँची पुकार को व्यक्त करती है; ‘चिल्ला उठे’ आकस्मिक प्रतिक्रिया को स्वाभाविक ढंग से बताता है।
- source_word: מָוֶת בַּסִּיר
  choice: हाँड़ी में मौत है
  rationale: मूल का सजीव और जानबूझकर तीखा कथन अक्षुण्ण रखा गया है; इसे मुख्य पाठ में व्याख्यात्मक रूप से ‘ज़हर’ नहीं बनाया गया।
- source_word: אִישׁ הָאֱלֹהִים
  choice: हे परमेश्वर के जन
  rationale: यह एलीशा की प्रचलित उपाधि और यहाँ प्रत्यक्ष संबोधन है। ‘हे’ हिन्दी में संबोधन को स्वाभाविक और स्पष्ट बनाता है।
- source_word: וְלֹא יָכְלוּ לֶאֱכֹל
  choice: और वे खा न सके
  rationale: मूल में कर्म स्पष्ट रूप से दोहराया नहीं गया है; हिन्दी में भी बिना अतिरिक्त ‘उसे’ जोड़े वाक्य स्वाभाविक और मूल के निकट है।
theological_decisions:
- issue: ‘हाँड़ी में मौत’ का अर्थ
  choice: रूपक-सदृश मूल अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया
  alternative: ‘हाँड़ी में ज़हर है’
  rationale: वाक्य संभवतः पकवान के घातक या विषैला होने को व्यक्त करता है, किंतु मूल शब्द ‘मौत’ है। उसका सीधे ‘ज़हर’ अनुवाद करना वास्तविक शाब्दिक और व्याख्यात्मक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाँड़ी’ घरेलू पकाने के पात्र के लिए स्वाभाविक है; ‘परमेश्वर का जन’ बाइबलीय उपाधि को स्पष्ट रखता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि ‘हाँड़ी में मौत है’ का मूल चित्र मुख्य पाठ में ही सुरक्षित है।
