translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कथात्मक रखी गई है। ‘नया चाँद’ और ‘सब्त’ धार्मिक-पंचांगीय प्रसंग को सुरक्षित रखते हैं। स्त्री का उत्तर जानबूझकर संक्षिप्त रखा गया है, जिससे मूल पाठ की संभावित आश्वस्ति, टालने की मुद्रा और कथात्मक तनाव में से किसी एक को निर्णायक रूप से न थोपा जाए।
