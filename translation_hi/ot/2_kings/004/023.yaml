source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
translation:
  language: hi
  text: उसने कहा, “तुम आज उसके पास क्यों जा रही हो? आज न तो नया चाँद है, न सब्त।” उसने कहा, “कुशल है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब कुशल है।” इब्रानी में शाब्दिक अर्थ “शान्ति” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: यह कारण पूछने वाला सामान्य प्रश्नवाचक शब्द है; आधुनिक हिन्दी में ‘क्यों’ स्वाभाविक और सटीक है।
- source_word: אתי הלכתי
  choice: तुम ... जा रही हो
  rationale: पाठ में रूप अनियमित है, पर आशय स्त्रीलिंग एकवचन सम्बोधन में तत्काल होने वाली यात्रा का है; ‘जा रही हो’ प्रसंग के अनुकूल है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: सर्वनाम प्रसंग में एलीशा की ओर संकेत करता है; नाम जोड़ने के बजाय मूल का सर्वनाम बनाए रखा गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह आधुनिक हिन्दी में स्वाभाविक कालवाचक रूप है।
- source_word: לֹא חֹדֶשׁ וְלֹא שַׁבָּת
  choice: आज न तो नया चाँद है, न सब्त
  rationale: ‘न तो...न...’ दोनों पवित्र अवसरों के निषेध को सहज हिन्दी में व्यक्त करता है। स्पष्टता के लिए ‘आज’ को वाक्य में दोहराया गया है।
- source_word: חֹדֶשׁ
  choice: नया चाँद
  rationale: यहाँ शब्द केवल ‘महीना’ नहीं, नए चाँद के धार्मिक अवसर को सूचित करता है।
- source_word: שַׁבָּת
  choice: सब्त
  rationale: इस्राएली विश्राम-दिन के लिए प्रचलित बाइबिलीय हिन्दी पद।
- source_word: שָׁלוֹם
  choice: कुशल है
  rationale: संक्षिप्त उत्तर में यह शब्द कुशल-मंगल का आश्वासन देने वाले मुहावरे की तरह काम करता है; हिन्दी में ‘कुशल है’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है। शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
