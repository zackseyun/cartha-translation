  text: Then he said[a], “Call her.” So he called her, and she stood in the doorway.
translation:
  language: hi
  text: तब उसने कहा, “उसे बुलाओ।” उसने उसे बुलाया, और वह द्वार पर खड़ी हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल क्रमिक कथानक की अगली क्रिया बताता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קְרָא לָהּ
  choice: उसे बुलाओ
  rationale: קרא का पुरुष एकवचन आज्ञार्थक रूप यहाँ गेहजी को स्त्री को बुलाने की सीधी आज्ञा देता है; ‘बुलाओ’ सरल और प्रसंगानुकूल है।
- source_word: וַיִּקְרָא לָהּ
  choice: उसने उसे बुलाया
  rationale: यह आज्ञा के प्रत्युत्तर में हुई अगली क्रिया है; हिन्दी में कर्ता प्रसंग से स्पष्ट है और वाक्य स्वाभाविक रहता है।
- source_word: וַתַּעֲמֹד
  choice: वह ... आ खड़ी हुई
  rationale: עמד का मूल अर्थ ‘खड़ा होना/स्थान लेना’ है। हिन्दी का ‘आ खड़ी हुई’ उसके बुलाए जाने पर द्वार पर स्थान लेने को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी अतिरिक्त विस्तृत गतिविधि का दावा किए।
- source_word: בַּפָּתַח
  choice: द्वार पर
  rationale: פתח द्वार, द्वारस्थान या प्रवेश-स्थान को दर्शाता है। ‘द्वार पर’ आधुनिक हिन्दी में स्वाभाविक है और स्थान की सटीक सूक्ष्मता को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions: []
translation_notes:
  register: सरल, गरिमापूर्ण आधुनिक मानक हिन्दी; कथात्मक क्रम स्पष्ट रखा गया है। ‘द्वार पर’ हिब्रू स्थानवाचक अभिव्यक्ति की स्वाभाविक और पर्याप्त रूप से व्यापक प्रस्तुति है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
