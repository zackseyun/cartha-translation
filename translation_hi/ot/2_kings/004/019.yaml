lexical_decisions:
- source_word: וַיֹּאמֶר אֶל אָבִיו
  choice: उसने अपने पिता से कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है; संकट की तीव्रता दोहराए गए उद्गार से व्यक्त होती है, इसलिए ‘चिल्लाया’ नहीं जोड़ा गया।
- source_word: רֹאשִׁי רֹאשִׁי
  choice: मेरा सिर, मेरा सिर!
  rationale: मूल की संक्षिप्त पुनरुक्ति और पीड़ा की तीव्रता सुरक्षित रखी गई है; ‘दुख रहा है’ जैसी व्याख्यात्मक सामग्री नहीं जोड़ी गई।
- source_word: אֶל הַנַּעַר
  choice: उस जवान से
  rationale: נַעַר लड़के, युवक, परिचारक या सेवक को सूचित कर सकता है। यहाँ वह बच्चे को उठा ले जाने योग्य अधीनस्थ पुरुष है; ‘जवान’ आयु-संकेत को रखता है और सेवक होने को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שָׂאֵהוּ אֶל אִמּוֹ
  choice: इसे उठाकर इसकी माँ के पास ले जाओ
  rationale: נשׂא यहाँ बच्चे को शारीरिक रूप से उठाकर ले जाने की आज्ञा है। हिंदी में यह वाक्यांश स्वाभाविक रूप से उस गति और गंतव्य दोनों को व्यक्त करता है।
