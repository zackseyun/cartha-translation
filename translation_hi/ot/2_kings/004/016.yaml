base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
translation:
  language: hi
  text: तब उसने कहा, “अगले वर्ष इसी नियत समय पर[a] तुम एक बेटे को गोद में लिए हुए होगी।” पर वह बोली, “नहीं, मेरे स्वामी, परमेश्वर के जन! अपनी दासी को धोखा न दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अधिक शाब्दिक रूप है, “जीवन के समय के अनुसार”; इस प्रसंग में आशय अगले वर्ष इसी समय से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  choice: इसी नियत समय पर
  rationale: מוֹעֵד किसी ठहराए या निश्चित समय को दर्शाता है। ‘नियत समय’ उसके निश्चित होने के भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כָּעֵת חַיָּה
  choice: अगले वर्ष
  rationale: यह इब्रानी मुहावरा इस प्रसंग में अगले वर्ष के इसी समय की ओर संकेत करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אתי
  choice: तुम
  rationale: पाठ में स्वतंत्र स्त्रीलिंग सर्वनाम बल देता है। हिन्दी में ‘तुम’ को स्पष्ट रखने से संबोधन बना रहता है; अलग से ‘तुम स्वयं’ कहना अनावश्यक रूप से भारी होता।
- source_word: חֹבֶקֶת
  choice: गोद में लिए होगी
  rationale: क्रिया का भाव बाहों में लेने या आलिंगन करने का है। शिशु के संदर्भ में ‘गोद में लिए होगी’ वर्तमान हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: בֵּן
  choice: एक बेटे
  rationale: इब्रानी शब्द विशेष रूप से पुत्र को दर्शाता है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: אַל
  choice: नहीं
  rationale: उत्तर के आरम्भ में पहला אַל भावपूर्ण निषेध या विनती है, न कि पूर्ण निषेधात्मक आज्ञा; ‘नहीं’ उस प्रतिक्रिया को सहज रूप में व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह एलीशा के लिए आदरसूचक मानवीय संबोधन है। ‘मेरे स्वामी’ सम्मान बनाए रखता है और यहाँ ईश्वरीय संबोधन का संकेत नहीं देता।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह नबी के लिए प्रयुक्त स्थापित इब्रानी उपाधि है। ‘परमेश्वर के जन’ हिन्दी में उसका सम्मानपूर्ण और स्पष्ट रूप है।
- source_word: תְּכַזֵּב
  choice: धोखा न दीजिए
  rationale: क्रिया झूठ बोलने, धोखा देने या बात के झूठे सिद्ध होने का भाव रखती है। यहाँ स्त्री झूठी आशा दिए जाने के भय से विनती करती है; ‘धोखा न दीजिए’ मूल अर्थ और भावनात्मक तनाव दोनों को बनाए रखता है।
- source_word: בְּשִׁפְחָתֶךָ
  choice: अपनी दासी को
  rationale: שִׁפְחָה स्त्रीलिंग सेविका को दर्शाता है। ‘दासी’ वक्ता के स्त्री होने और उसकी विनम्र आत्म-संज्ञा दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: אֲדֹנִי का मानवीय आदरसूचक प्रयोग
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: संबोधन एलीशा से है, परमेश्वर से नहीं। ‘स्वामी’ सामाजिक आदर को बनाए रखते हुए अनावश्यक दिव्य अर्थ से बचाता है।
- issue: תְּכַזֵּב में झूठ और निराशा का संयुक्त भाव
  choice: धोखा न दीजिए
  alternative: झूठ न बोलिए
  rationale: शाब्दिक अर्थ झूठ बोलने से जुड़ा है, पर प्रसंग में पुत्र की आशा के झूठी निकलने का भय भी उपस्थित है। ‘धोखा’ इस तनाव को बिना किसी सिद्धान्तगत निष्कर्ष के खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण और कथात्मक रखी गई है। एलीशा के लिए ‘तुम’ और स्त्री के उत्तर में ‘दीजिए’ प्रसंग के सामाजिक अंतर को स्वाभाविक रूप से व्यक्त करते हैं। ‘दासी’ मूल के स्त्रीलिंग और विनम्र भाव को बनाए रखता है।
