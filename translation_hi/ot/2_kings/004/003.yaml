base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
translation:
  language: hi
  text: तब उसने कहा, “जा, अपने सभी पड़ोसियों से अपने लिए खाली बरतन उधार माँग ले। बहुत कम मत लेना[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कम मत करना” या “कम मत पड़ने देना।” प्रसंग में आशय है कि केवल थोड़े-से बरतन न लिए जाएँ। इब्रानी क्रिया का सामान्य अर्थ “माँगना” भी हो सकता है; यहाँ पड़ोसियों से कुछ समय के लिए बरतन उधार लेने का भाव संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכִי
  choice: जा
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप है; आधुनिक हिंदी में स्त्री को सीधे भेजने के लिए ‘जा’ स्वाभाविक और स्पष्ट है।
- source_word: שַׁאֲלִי
  choice: माँग ला
  rationale: שאל का मूल अर्थ ‘माँगना’ है और प्रसंग में पड़ोसियों से अस्थायी उपयोग के लिए बरतन लेने का भाव है। ‘माँग ला’ मूल की व्यापकता बनाए रखता है; उधार लेने का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כֵּלִים
  choice: बरतन
  rationale: כְּלִי व्यापक रूप से वस्तु, पात्र या उपकरण को दर्शा सकता है। तेल रखने के प्रसंग में ‘बरतन’ सामान्य हिंदी पाठक के लिए स्वाभाविक है और ‘घड़े’ जैसा अनावश्यक रूप से विशिष्ट नहीं।
- source_word: לָךְ
  choice: अपने लिए
  rationale: लाभार्थक स्त्रीलिंग सर्वनाम का व्यक्तिगत लाभ और सहभागिता का भाव स्पष्ट करता है।
- source_word: מִן הַחוּץ
  choice: बाहर
  rationale: शाब्दिक अर्थ ‘बाहर से’ है; हिंदी वाक्य में ‘बाहर ... से’ घर के बाहर जाकर पड़ोसियों से लेने का आशय सहजता से व्यक्त करता है।
- source_word: מֵאֵת כָּל שכנכי
  choice: अपने सब पड़ोसियों से
  rationale: निकट रहने वाले सभी लोगों के सामूहिक उल्लेख को सीधी और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כֵּלִים רֵקִים
  choice: खाली बरतन
  rationale: विशेषण बताता है कि बरतन खाली होने चाहिए। ‘बरतन’ की पुनरावृत्ति इब्रानी के जोर को बनाए रखती है।
- source_word: אַל תַּמְעִיטִי
  choice: थोड़े मत लाना
  rationale: מעט के हिफ़ील निषेध का शाब्दिक भाव ‘कम न करना’ है। प्रसंग में इसका आशय बहुत कम संख्या में बरतन न लाने से है; यह हिंदी रूप संक्षिप्त और स्वाभाविक है।
