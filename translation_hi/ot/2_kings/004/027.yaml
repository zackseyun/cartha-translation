base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
translation:
  language: hi
  text: जब वह पहाड़ पर परमेश्वर के जन के पास पहुँची, तो उसने उसके पैर पकड़ लिए। गेहजी उसे धकेलकर हटाने के लिए आगे बढ़ा, पर परमेश्वर के जन ने कहा, “उसे छोड़ दो, क्योंकि उसका मन गहरी पीड़ा में है[a]। याहवे ने यह बात मुझसे छिपाई है और मुझे नहीं बताई।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका प्राण उसके लिए कड़वा है”; यह गहरी भीतरी व्यथा का इब्रानी मुहावरा है।
    reason: मूल मुहावरे और נֶפֶשׁ के शब्दचित्र को सुरक्षित रखना।
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी के लिए प्रयुक्त इब्रानी उपाधि का निकट और हिन्दी बाइबलीय परंपरा में सुबोध रूप है; केवल ‘नबी’ कहने से मूल अभिव्यक्ति का स्वरूप मिट जाता।
- source_word: אֶל הָהָר
  choice: पहाड़ पर
  rationale: स्त्री उस पहाड़ पर स्थित परमेश्वर के जन के पास पहुँचती है। हिन्दी में ‘पहाड़ पर ... के पास पहुँची’ गति और स्थान दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  choice: उसने उसके पैर पकड़ लिए
  rationale: חזק के साथ ב दृढ़ता से पकड़ने का भाव देता है। ‘पैर पकड़ लिए’ तत्कालता और शारीरिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּגַּשׁ גֵּיחֲזִי לְהָדְפָהּ
  choice: गेहजी उसे धकेलकर हटाने के लिए आगे बढ़ा
  rationale: נגש निकट आने या आगे बढ़ने और הדף बलपूर्वक परे करने का अर्थ देता है। संयुक्त रूप हिन्दी में दृश्य की गति और बल दोनों बनाए रखता है।
- source_word: הַרְפֵּה לָהּ
  choice: उसे छोड़ दो
  rationale: इस प्रसंग में आज्ञा का अर्थ उसके साथ हस्तक्षेप बंद करना है। ‘उसे छोड़ दो’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: נַפְשָׁהּ מָרָה לָהּ
  choice: उसका मन गहरी पीड़ा में है
  rationale: शाब्दिक अभिव्यक्ति ‘उसका नेफेश उसके लिए कड़वा है’ गहरे आंतरिक संताप का मुहावरा है। ‘मन’ यहाँ आंतरिक व्यक्तित्व को सामान्य आधुनिक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल बिंब सुरक्षित रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चतुरक्षर יהוה है; हिन्दी में उसका सीधा लिप्यंतरण ‘याहवे’ किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: הֶעְלִים מִמֶּנִּי וְלֹא הִגִּיד לִי
  choice: यह बात मुझसे छिपाई है और मुझे नहीं बताई
  rationale: दोनों समानांतर क्रियाएँ छिपाने और न बताने पर बल देती हैं। ‘यह बात’ हिन्दी में उस अज्ञात संकट के निहित कर्म को स्पष्ट करता है, बिना उसकी प्रकृति निर्धारित किए।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: पद में व्यक्तिगत नाम प्रत्यक्ष रूप से आया है। लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: נפשׁ और ‘कड़वाहट’ वाले मुहावरे का अर्थ
  choice: उसका मन गहरी पीड़ा में है
  alternative: उसका प्राण उसके लिए कड़वा है
  rationale: मुख्य पाठ में मुहावरे का भाव स्वाभाविक हिन्दी में दिया गया है, पर मूल का मानवशास्त्रीय और भावात्मक बिंब पादटिप्पणी में रखा गया है; इससे ‘मन’ को किसी संकीर्ण दार्शनिक परिभाषा में नहीं बाँधा जाता।
- issue: एलीशा से बात छिपाए जाने का कथन
  choice: याहवे ने यह बात मुझसे छिपाई है और मुझे नहीं बताई
  alternative: याहवे ने इसे मुझसे गुप्त रखा और मुझ पर प्रकट नहीं किया
  rationale: मूल पाठ एलीशा के ज्ञान की सीमा को स्पष्ट रूप से स्वीकार करता है। अनुवाद इस तनाव को बनाए रखता है और यह नहीं बताता कि परमेश्वर ने ऐसा क्यों किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘परमेश्वर का जन’ मूल उपाधि को बनाए रखता है; ‘पैर पकड़ लिए’ और ‘धकेलकर हटाने’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं। केवल वास्तविक इब्रानी मुहावरे के लिए पादटिप्पणी दी गई है; अंग्रेज़ी परामर्श-पाठ की पहाड़ से जुड़ी असंगत पादटिप्पणी नहीं अपनाई गई।
