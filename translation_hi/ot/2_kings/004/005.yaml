base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
translation:
  language: hi
  text: तब वह उसके पास से चली गई और उसने अपने और अपने बेटों के पीछे दरवाज़ा बंद कर लिया। वे उसके पास बरतन लाते रहे[a], और वह तेल उँडेलती रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “वे उसके पास लाते रहे” है; “बरतन” पिछले पदों में बताए गए खाली बरतनों के संदर्भ से जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: तब वह उसके पास से चली गई
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; מֵאִתּוֹ का स्वाभाविक हिंदी रूप ‘उसके पास से’ है।
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  choice: उसने अपने और अपने बेटों के पीछे दरवाज़ा बंद कर लिया
  rationale: סגר का अर्थ ‘बंद करना’ है और בְּעַד इस प्रसंग में भीतर मौजूद व्यक्तियों के पीछे दरवाज़ा बंद करने को व्यक्त करता है। हिंदी में ‘अपने’ स्त्री को स्वयं संदर्भित करता है और दोहराई हुई संरचना को संक्षेप में स्वाभाविक रखता है।
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  choice: वे उसके पास बरतन लाते रहे
  rationale: बहुवचन कृदंत लगातार चल रही क्रिया दिखाता है। कर्म मूल वाक्य में अनुक्त है, पर पिछले पदों के खाली बरतनों से स्पष्ट होने के कारण हिंदी में ‘बरतन’ जोड़ा गया है।
- source_word: וְהִיא מיצקת
  choice: और वह तेल उँडेलती रही
  rationale: कृदंत समानांतर जारी क्रिया को दिखाता है। संदर्भ से तेल स्पष्ट है; ‘उँडेलती रही’ बरतनों में लगातार डालने की प्रक्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
