  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। लगातार क्रियाओं के लिए ‘लाते रहे’ और ‘उँडेलती रही’ प्रयुक्त हैं; ‘दरवाज़ा’ सामान्य आधुनिक रूप है।
