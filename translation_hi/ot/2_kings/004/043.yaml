base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
translation:
  language: hi
  text: 'पर उसके सेवक ने कहा[a], “मैं इसे सौ आदमियों के सामने कैसे परोसूँ?” उसने कहा, “इसे लोगों को दे दो, और वे खाएँ, क्योंकि याहवे यों कहता है: ‘वे खाएँगे और कुछ बच भी जाएगा।’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इसे सौ आदमियों को कैसे दूँ?” हिब्रू का शाब्दिक रूप है, “मैं इसे सौ आदमियों के सामने क्या दूँ?”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक भाव है, “खाएँ और बचा छोड़ें”; यह एक मुहावरा है, जिसका अर्थ है कि उनके खाने के बाद भी भोजन बचा रहेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  choice: उसके सेवक
  rationale: यह शब्द किसी व्यक्ति की निजी या आधिकारिक सेवा करने वाले को दर्शाता है; एलीशा के अधीन व्यक्ति के लिए ‘सेवक’ स्वाभाविक और संदर्भानुकूल है।
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  choice: मैं इसे सौ आदमियों के सामने कैसे परोसूँ?
  rationale: शाब्दिक संरचना असामान्य है, पर संदर्भ में भोजन सामने रखने का भाव है। ‘परोसूँ’ इस ठोस क्रिया और सेवक के आश्चर्य दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: आदमियों
  rationale: सौ की संख्या के बाद एकवचन रूप वितरणात्मक अर्थ में है और यहाँ पुरुषों का संकेत देता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: תֵּן לָעָם
  choice: इसे लोगों को दे दो
  rationale: עָם एक सामूहिक संज्ञा है; ‘लोगों’ से मूल पाठ में אִישׁ से עָם की ओर हुए बदलाव को बनाए रखा गया है।
- source_word: וְיֹאכֵלוּ
  choice: और वे खाएँ
  rationale: आज्ञार्थक क्रिया के बाद यह रूप इच्छार्थक/परिणामसूचक बल रखता है; ‘वे खाएँ’ हिन्दी में उस आज्ञात्मक प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי כֹה אָמַר יְהוָה
  choice: क्योंकि यहोवा यों कहता है
  rationale: मानक भविष्यद्वक्तीय संदेश-सूत्र को पहचानने योग्य और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के परमेश्वर के विशिष्ट वाचा-नाम को सामान्य पदवी में बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: אָכֹל וְהוֹתֵר
  choice: वे खाएँगे और कुछ बच भी जाएगा
  rationale: यह संरचना खाने और उसके बाद भोजन शेष रहने के निश्चित परिणाम को व्यक्त करती है; स्पष्ट कर्ता जोड़कर मुहावरे का अर्थ सहज हिन्दी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: पाठ में विशिष्ट ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम तथा उपाधि का भेद बनाए रखता है; ‘याहवे’ स्रोत उच्चारण का निकटतर विकल्प है।
- issue: भोजन बचने की भविष्यवाणी का बल
  choice: वे खाएँगे और कुछ बच भी जाएगा
  alternative: वे खाएँ और कुछ छोड़ दें
  rationale: इसे लोगों को भोजन जानबूझकर छोड़ने की आज्ञा न मानकर पर्याप्तता और शेष बचने के निश्चित परिणाम के रूप में प्रस्तुत किया गया है, जो प्रसंग और हिब्रू मुहावरे के अनुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘परोसूँ’ भोजन सामने रखने के प्रसंग को स्वाभाविक बनाता है; भविष्यद्वक्तीय सूत्र के लिए ‘यों कहता है’ रखा गया है।
