base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/044.yaml
  text: So he set it before them[a], and they ate and had some left over, according to the word of Yahweh.
translation:
  language: hi
  text: उसने भोजन उनके सामने रख दिया। उन्होंने खाया और कुछ बच भी गया[a], याहवे के वचन के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने कुछ बचा छोड़ दिया।”
    reason: וַיּוֹתִרוּ Hiphil रूप का सकर्मक भाव ‘उन्होंने कुछ बचा छोड़ दिया’ के रूप में व्यक्त किया जा सकता है; मुख्य पाठ स्वाभाविक हिंदी में उसका परिणाम बताता है।
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ... रख दिया
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है; לִפְנֵיהֶם के साथ भोजन परोसने के प्रसंग में ‘उनके सामने रख दिया’ स्वाभाविक और स्रोत के निकट है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: यह पदबंध स्थान और भोजन परोसने की क्रिया—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיֹּאכְלוּ
  choice: उन्होंने खाया
  rationale: कथात्मक क्रम में אכל का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיּוֹתִרוּ
  choice: कुछ बचा भी छोड़ा
  rationale: Hiphil रूप का सकर्मक भाव ‘कुछ बचा छोड़ना’ बनाए रखता है; ‘भी’ पहले कही गई भविष्यवाणी की आश्चर्यजनक पूर्ति को स्वाभाविक हिंदी में उभारता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: כִּדְבַר
  choice: के वचन के अनुसार
  rationale: ‘वचन’ रखने से यह स्पष्ट रहता है कि घटना पहले कही गई दिव्य बात के अनुरूप हुई, और मूल की औपचारिक अभिव्यक्ति सुरक्षित रहती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: כִּדְבַר יְהוָה में दिव्य कथन का स्वरूप
  choice: याहवे के वचन के अनुसार
  alternative: जैसा याहवे ने कहा था
  rationale: ‘वचन’ मूल संज्ञा דָּבָר को बनाए रखता है और भविष्यद्वाणी की पूर्ति तथा दिव्य कथन के बीच औपचारिक संबंध सुरक्षित करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। पिछले पद से स्पष्ट कर्म को ‘भोजन’ के रूप में जोड़ा गया है। छोटे कथात्मक वाक्य मूल की गति बनाए रखते हैं।
