translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखा’ हिन्नֵה की दृश्यात्मकता को व्यक्त करता है, और ‘मरा हुआ ... पड़ा था’ मूल की अवस्थात्मक संरचना बनाए रखता है।
