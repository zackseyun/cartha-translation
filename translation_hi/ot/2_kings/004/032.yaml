  text: וַ/יָּבֹ֥א אֱלִישָׁ֖ע הַ/בָּ֑יְתָ/ה וְ/הִנֵּ֤ה הַ/נַּ֨עַר֙ מֵ֔ת מֻשְׁכָּ֖ב עַל מִטָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
translation:
  language: hi
  text: जब एलीशा घर के भीतर आया, तो उसने देखा कि लड़का मरा हुआ उसकी खाट पर पड़ा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: वय्यिक्तोल कथा को साधारण भूतकाल में आगे बढ़ाता है। दिशासूचक ה का भाव ‘घर के भीतर’ से व्यक्त किया गया है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַבָּיְתָה
  choice: घर के भीतर
  rationale: בית के साथ लगा दिशासूचक ה घर की ओर और उसके अंदर जाने का संकेत देता है; आधुनिक हिन्दी में ‘घर के भीतर आया’ स्वाभाविक है।
- source_word: וְהִנֵּה
  choice: तो उसने देखा कि
  rationale: הִנֵּה दृश्य को सजीव ढंग से सामने लाकर ध्यान खींचता है। इस प्रसंग में ‘तो उसने देखा कि’ उसका कथात्मक प्रभाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַנַּעַר
  choice: लड़का
  rationale: नַעַר के अनेक अर्थ हो सकते हैं, पर यहाँ शूनेमी स्त्री के बेटे के लिए ‘लड़का’ संदर्भानुकूल है।
- source_word: מֵת
  choice: मरा हुआ
  rationale: यह लड़के की उस समय दिखाई देने वाली मृत अवस्था बताता है, न कि केवल पहले घट चुकी मृत्यु की घटना।
- source_word: מֻשְׁכָּב
  choice: पड़ा था
  rationale: पुअल कृदंत निष्क्रिय अथवा परिणामी अवस्था—लिटाया हुआ या पड़ा हुआ—दर्शाता है। हिन्दी में ‘पड़ा था’ उस दृश्य अवस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל מִטָּתוֹ
  choice: उसकी खाट पर
  rationale: מִטָּה के लिए प्रसंगानुकूल ‘खाट’ चुना गया है; अधिकारसूचक प्रत्यय को ‘उसकी’ से व्यक्त किया गया है।
