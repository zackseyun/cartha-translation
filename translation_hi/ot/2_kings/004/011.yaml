lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन
  rationale: यह इब्रानी कथात्मक मुहावरा किसी अवसर का परिचय देता है; ‘एक दिन’ आधुनिक हिन्दी में स्वाभाविक और समय-सूचक है।
- source_word: וַיָּבֹא שָׁמָּה
  choice: वह वहाँ आया
  rationale: בוא का सामान्य अर्थ ‘आना/प्रवेश करना’ है और שָׁמָּה के स्थान-सूचक भाव को ‘वहाँ’ सुरक्षित रखता है।
- source_word: וַיָּסַר
  choice: मुड़कर गया
  rationale: סור यहाँ अपने मार्ग से हटकर किसी विशेष स्थान की ओर जाने का भाव देता है; यह हिन्दी में उस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל הָעֲלִיָּה
  choice: ऊपर के कमरे में
  rationale: עֲלִיָּה घर के ऊपरी भाग में बने कमरे को सूचित करता है; ‘ऊपर का कमरा’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: וַיִּשְׁכַּב שָׁמָּה
  choice: वहाँ लेट गया
  rationale: שׁכב का अर्थ लेटना या प्रसंगानुसार सोना हो सकता है; ‘लेट गया’ अधिक व्यापक अर्थ रखकर मूल की अस्पष्टता बचाता है।
