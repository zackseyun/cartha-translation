  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
translation:
  language: hi
  text: तब वह आई और उसके पाँवों पर गिर पड़ी और भूमि पर दण्डवत हुई[a]। फिर उसने अपने बेटे को उठाया और बाहर चली गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि तक झुकी।” इब्रानी क्रिया का अर्थ कुछ प्रसंगों में “आराधना करना” भी हो सकता है, पर यहाँ संभवतः एलीशा के सामने गहरे आदर और कृतज्ञता की मुद्रा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא
  choice: तब वह भीतर आई
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। प्रसंग में स्त्री उस कमरे में आती है जहाँ एलीशा और बालक हैं, इसलिए आधुनिक हिन्दी में ‘भीतर आई’ स्वाभाविक और संदर्भानुकूल है।
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: उसके पाँवों पर गिरकर
  rationale: इब्रानी अभिव्यक्ति गहरी विनम्रता और आदर की शारीरिक मुद्रा बताती है। ‘पाँवों पर गिरकर’ हिन्दी में स्वाभाविक है और मूल के עַל को भी निकटता से रखती है।
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: भूमि तक झुकी
  rationale: שׁחה यहाँ भूमि की ओर गहराई से झुकने या दण्डवत होने का संकेत देता है। यह अनुवाद शारीरिक भाव को स्पष्ट रखता है और अनिवार्य रूप से धार्मिक आराधना का अर्थ नहीं जोड़ता।
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  choice: अपने बेटे को उठाया
  rationale: נשא का अर्थ उठाना, ले लेना या ढोना हो सकता है। इस दृश्य में ‘बेटे को उठाया’ ठोस क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתֵּצֵא
  choice: बाहर चली गई
  rationale: יצא का सामान्य अर्थ बाहर जाना है। स्त्री के लिए ‘बाहर चली गई’ स्वाभाविक हिन्दी है और कथा की सीधी गति बनाए रखता है।
theological_decisions:
- issue: एलीशा के सामने וַתִּשְׁתַּחוּ का अर्थ
  choice: कृतज्ञता और गहरे आदर में भूमि तक झुकना
  alternative: ‘दण्डवत किया’ या धार्मिक अर्थ में ‘आराधना की’
  rationale: इब्रानी क्रिया प्रसंग के अनुसार आराधना अथवा किसी व्यक्ति के सामने आदरपूर्वक दण्डवत होने—दोनों को व्यक्त कर सकती है। यहाँ एलीशा के सामने पुत्र की पुनर्प्राप्ति के बाद की मुद्रा है; इसलिए शारीरिक क्रिया का अनुवाद करना उचित है, बिना इसे स्पष्टतः ईश्वरीय आराधना ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘भूमि तक झुकी’ औपचारिक गरिमा बनाए रखते हुए दृश्य को स्पष्ट करती है; फुटनोट इब्रानी क्रिया की व्यापक अर्थ-सीमा सुरक्षित रखता है।
