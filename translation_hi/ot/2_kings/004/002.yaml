base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
translation:
  language: hi
  text: तब एलीशा ने उससे कहा, “मैं तुम्हारे लिए क्या करूँ? मुझे बताओ, तुम्हारे घर में क्या है?” उसने कहा, “आपकी दासी के घर में तेल की एक छोटी कुप्पी[a] को छोड़कर कुछ भी नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेल की एक छोटी शीशी” अथवा “तेल का एक छोटा पात्र”; इब्रानी शब्द אָסוּךְ तेल रखने के एक छोटे पात्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: मैं तुम्हारे लिए क्या करूँ?
  rationale: यह स्वाभाविक हिन्दी में उस विचार-विमर्शात्मक प्रश्न को व्यक्त करता है कि एलीशा उसकी ओर से क्या करे।
- source_word: הַגִּידִי לִי
  choice: मुझे बताओ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: מַה יֶּשׁ לָכִי בַּבָּיִת
  choice: तुम्हारे घर में क्या है?
  rationale: यֵשׁ के साथ ל स्वामित्व व्यक्त करता है; हिन्दी में यह प्रश्न इसी रूप में सहज है और घरेलू संदर्भ भी बना रहता है।
- source_word: לְשִׁפְחָתְךָ
  choice: आपकी दासी
  rationale: स्त्री का एलीशा के प्रति आदरसूचक आत्म-संबोधन सुरक्षित रहता है; आधुनिक हिन्दी में ‘दासी’ संक्षिप्त और संदर्भानुकूल है।
- source_word: אֵין ... כֹל
  choice: कुछ भी नहीं है
  rationale: यह नकार की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אִם
  choice: को छोड़कर
  rationale: यह पहले कथन के एकमात्र अपवाद को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: אָסוּךְ שָׁמֶן
  choice: तेल की एक छोटी कुप्पी
  rationale: दुर्लभ पात्र-संज्ञा אָסוּךְ तेल रखने के छोटे पात्र की ओर संकेत करती है; ‘कुप्पी’ आकार को अनावश्यक रूप से निश्चित किए बिना छोटे तेल-पात्र का बोध कराती है।
