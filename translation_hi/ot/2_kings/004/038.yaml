base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
translation:
  language: hi
  text: फिर एलीशा गिलगाल लौटा। देश में अकाल पड़ा था। नबियों के पुत्र[a] उसके सामने बैठे हुए थे। उसने अपने सेवक से कहा, “बड़ी हाँडी आग पर चढ़ा और नबियों के पुत्रों के लिए स्टू पका।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात नबियों के शिष्य, या नबी-समुदाय के सदस्य।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: लौट आया
  rationale: क्रिया का सामान्य अर्थ पहले के स्थान पर वापस आना है; हिंदी कथा-शैली में यह स्वाभाविक है।
- source_word: הַגִּלְגָּלָה
  choice: गिलगाल
  rationale: दिशासूचक ה गति को गिलगाल की ओर दिखाता है; हिंदी में ‘गिलगाल लौट आया’ से दिशा स्वाभाविक रूप से व्यक्त होती है।
- source_word: וְהָרָעָב בָּאָרֶץ
  choice: उस समय देश में अकाल पड़ा था
  rationale: क्रियारहित उपवाक्य कथा की पृष्ठभूमि बताता है; ‘उस समय’ परिस्थितिजन्य संबंध को स्पष्ट करता है और ‘अकाल पड़ा था’ आधुनिक हिंदी मुहावरा है।
- source_word: בְנֵי הַנְּבִיאִים
  choice: नबियों के चेले
  rationale: शाब्दिक ‘नबियों के पुत्र’ हिंदी में जैविक पुत्रों का भ्रामक अर्थ दे सकता है। प्रसंग में यह नबी-समुदाय के शिष्यों या सदस्यों के लिए प्रयुक्त पद है; ‘चेले’ सामान्य पाठक के लिए सहज है।
- source_word: יֹשְׁבִים לְפָנָיו
  choice: उसके सामने बैठे हुए थे
  rationale: वर्तमान कृदंत चल रही दृश्यावस्था दिखाता है; ‘सामने’ उपस्थिति और शिष्यवत बैठने, दोनों के लिए स्वाभाविक हिंदी है।
- source_word: לְנַעֲרוֹ
  choice: अपने सेवक से
  rationale: נַעַר युवक, परिचारक या सेवक हो सकता है; यहाँ सौंपे गए घरेलू कार्य के कारण ‘सेवक’ उपयुक्त है।
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  choice: बड़ी हाँडी चढ़ा
  rationale: यह आज्ञा पकाने के लिए बड़े पात्र को आग पर रखने की है; ‘हाँडी चढ़ाना’ संक्षिप्त और स्वाभाविक हिंदी प्रयोग है।
- source_word: וּבַשֵּׁל נָזִיד
  choice: साग पकाओ
  rationale: נָזִיד उबाला या पकाया हुआ गाढ़ा व्यंजन है। अगले पदों में जंगली लता और फल/लौकियाँ काटकर इसी में डाली जाती हैं; ‘साग’ भारतीय हिंदी बाइबल परंपरा में इस प्रसंग के व्यंजन को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘दमपुख्त/शोरबा’ संभावित विकल्प हैं।
theological_decisions:
- issue: בְנֵי הַנְּבִיאִים का सामुदायिक पद
  choice: नबियों के चेले
  alternative: नबियों के पुत्र
  rationale: इब्रानी पारिवारिक मुहावरे को शब्दशः रखने पर आधुनिक हिंदी पाठक वास्तविक पुत्र समझ सकता है। अर्थगत रूप से ये नबियों के शिष्य या नबी-समुदाय के सदस्य हैं। पादटिप्पणी इस संस्थागत विस्तार को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण कथात्मक हिंदी। ‘हाँडी चढ़ा’ घरेलू पाक-क्रिया को सहज रूप में व्यक्त करता है। ‘चेले’ सामान्य बोलचाल में बोधगम्य है, जबकि पादटिप्पणी अधिक औपचारिक ‘शिष्य’ और सामुदायिक अर्थ बताती है।
