  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
translation:
  language: hi
  text: तब वह आई और उसने परमेश्वर के जन को बताया। उसने कहा, “जा, तेल बेच और अपने कर्ज़ चुका दे[a]। और तू और तेरे बेटे बचे हुए से अपना निर्वाह करोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने लेनदार को भुगतान कर दे”; मूल इब्रानी रूप को देय कर्ज़ के बजाय उस व्यक्ति के लिए भी समझा जा सकता है जिसे भुगतान करना है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “तू और तेरे बेटे बचे हुए से जीवित रहोगे।”'
    reason: literal_rendering
