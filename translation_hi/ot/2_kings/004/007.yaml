- source_word: וְאַתְּ וּבָנַיִךְ
  choice: तू और तेरे बेटे
  rationale: मूल में स्पष्ट रूप से ‘बेटे’ हैं; एकवचन अनौपचारिक सम्बोधन आज्ञाओं के साथ संगत है।
- source_word: תִחְיִי בַּנּוֹתָר
  choice: जो बच जाए, उससे ... अपना जीवन चलाना
  rationale: यह स्वाभाविक हिन्दी में बचे हुए धन से निर्वाह का भाव व्यक्त करता है, जबकि शाब्दिक भविष्यवाची संरचना पादटिप्पणी में सुरक्षित है।
