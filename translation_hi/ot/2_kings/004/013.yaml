  text: וַ/יֹּ֣אמֶר ל֗/וֹ אֱמָר נָ֣א אֵלֶי/הָ֮ הִנֵּ֣ה חָרַ֣דְתְּ אֵלֵי/נוּ֮ אֶת כָּל הַ/חֲרָדָ֣ה הַ/זֹּאת֒ מֶ֚ה לַ/עֲשׂ֣וֹת לָ֔/ךְ הֲ/יֵ֤שׁ לְ/דַבֶּר לָ/ךְ֙ אֶל הַ/מֶּ֔לֶךְ א֖וֹ אֶל שַׂ֣ר הַ/צָּבָ֑א וַ/תֹּ֕אמֶר בְּ/ת֥וֹךְ עַמִּ֖/י אָנֹכִ֥י יֹשָֽׁבֶת־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
translation:
  language: hi
  text: उसने अपने सेवक से कहा, “कृपया उससे कहो, ‘देखो, तुमने हमारे लिए इतनी चिंता करके इतना कष्ट उठाया है। तुम्हारे लिए क्या किया जाए? क्या तुम्हारी ओर से राजा या सेनापति से कुछ कहा जाए?’” उस स्त्री ने उत्तर दिया, “मैं तो अपने ही लोगों के बीच रहती हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उसके उत्तर का आशय संभवतः यह है कि वह अपने समुदाय में बसी हुई है और उसे राजा या सेनापति से किसी विशेष कृपा की आवश्यकता नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  choice: इतनी चिंता करके इतना कष्ट उठाया है
  rationale: धातु और संज्ञा का मूल भाव काँपने, व्याकुल होने या चिंता करने का है; इस आतिथ्य-संदर्भ में यह उनके लिए बड़ी सावधानी और परिश्रम करने का मुहावरा है। अनुवाद चिंता और किए गए कष्ट दोनों को सामने रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: आगे कही जाने वाली बात की ओर ध्यान खींचने वाला स्वाभाविक आधुनिक हिन्दी शब्द।
- source_word: מֶה לַעֲשׂוֹת לָךְ
  choice: तुम्हारे लिए क्या किया जाए?
  rationale: हिब्रू की अनिर्दिष्ट कर्ता वाली रचना और विनम्र, औपचारिक प्रश्न दोनों सुरक्षित रहते हैं।
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  choice: क्या तुम्हारी ओर से ... कुछ कहा जाए?
  rationale: यह उसके पक्ष में बोलने या निवेदन करने का भाव देता है और हिब्रू की अपेक्षाकृत अप्रत्यक्ष अभिव्यक्ति को बनाए रखता है।
- source_word: שַׂר הַצָּבָא
  choice: सेनापति
  rationale: सेना के प्रधान अधिकारी के लिए स्पष्ट, वर्तमान और संक्षिप्त हिन्दी पद।
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  choice: मैं तो अपने ही लोगों के बीच रहती हूँ
  rationale: समुदाय के बीच बसे और सुरक्षित होने का सीधा कथन है। ‘तो’ प्रस्तावित राजकीय या सैनिक सहायता के विपरीत उसके उत्तर का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָא
  choice: कृपया
  rationale: आज्ञार्थक कथन को विनम्र बनाने वाले कण का स्वाभाविक आधुनिक हिन्दी समतुल्य।
- source_word: וַיֹּאמֶר לוֹ
  choice: उसने अपने सेवक से कहा
  rationale: सर्वनाम का संदर्भ निकट प्रसंग में गेहजी/सेवक है; नाम जोड़े बिना ‘सेवक’ कहने से हिन्दी में संदर्भ स्पष्ट होता है।
theological_decisions:
- issue: स्त्री के अंतिम उत्तर का निहितार्थ
  choice: मुख्य पाठ में केवल उसका कथन रखा गया और संभावित सामाजिक अर्थ पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में जोड़ना कि उसे किसी विशेष सहायता की आवश्यकता नहीं थी।
  rationale: हिब्रू प्रत्यक्ष रूप से केवल यह कहता है कि वह अपने लोगों के बीच रहती है; सुरक्षा, संतोष या संरक्षण का भाव संभावित है, पर उसे मुख्य पाठ में निश्चित बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक किंतु गरिमापूर्ण रखा गया है। חָרַדְתְּ/חֲרָדָה की असामान्य पुनरुक्ति का भाव ‘चिंता करके इतना कष्ट’ में सुरक्षित है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उपस्थित है।
