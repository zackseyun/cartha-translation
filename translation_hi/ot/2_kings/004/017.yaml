  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
translation:
  language: hi
  text: तब वह स्त्री गर्भवती हुई और उसने उस नियत समय पर—अर्थात् अगले वर्ष लगभग इसी समय—एक पुत्र को जन्म दिया, जैसा एलीशा ने उससे कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हिब्रू क्रिया הרה यहाँ गर्भधारण करने को दर्शाती है; आधुनिक हिन्दी में ‘गर्भवती हुई’ सहज और स्पष्ट है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; प्रसंग में पहले से परिचित शूनेमवासी स्त्री की ओर संकेत है, इसलिए ‘वह स्त्री’ उपयुक्त है।
- source_word: וַתֵּלֶד בֵּן
  choice: एक पुत्र को जन्म दिया
  rationale: यह प्रसव का सामान्य हिब्रू प्रयोग है; ‘एक पुत्र को जन्म दिया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לַמּוֹעֵד הַזֶּה
  choice: ठीक उसी नियत समय पर
  rationale: מוֹעֵד निश्चित या ठहराए हुए समय को व्यक्त करता है। ‘उसी’ पहले कही गई समय-सीमा की ओर लौटता है और ‘नियत समय’ मूल भाव सुरक्षित रखता है।
- source_word: כָּעֵת חַיָּה
  choice: अगले वर्ष लगभग इसी समय
  rationale: यह मुहावरा अगले वर्ष के लगभग इसी समय या इसी ऋतु को सूचित करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  choice: जैसा एलीशा ने उससे कहा था
  rationale: यह उपवाक्य एलीशा के पहले कहे वचन की पूर्ति दर्शाता है; हिन्दी में ‘कहा था’ कालक्रम और भाव दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
