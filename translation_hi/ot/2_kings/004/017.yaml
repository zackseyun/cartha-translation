  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समय-संबंधी हिब्रू अभिव्यक्तियों की पुनरुक्ति को डैश के माध्यम से स्पष्ट किया गया है, जबकि मूल मुहावरे की असामान्यता पाद-टिप्पणी में सुरक्षित है।
