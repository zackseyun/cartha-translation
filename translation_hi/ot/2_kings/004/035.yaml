  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
translation:
  language: hi
  text: तब वह लौटकर घर में कभी इधर, कभी उधर चला।[a] फिर वह ऊपर गया और लड़के के ऊपर झुक गया।[b] लड़के को सात बार छींक आई, और उसने अपनी आँखें खोल दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक बार इधर और एक बार उधर”; अर्थात वह घर में इधर-उधर चला।
    reason: मूल इब्रानी मुहावरे का अधिक शाब्दिक रूप बताना।
  - marker: b
    text: या, “उसने अपने को उसके ऊपर फैला दिया।” इब्रानी क्रिया किसी के ऊपर झुकने या नत होने को व्यक्त कर सकती है।
    reason: शारीरिक मुद्रा के सम्भव वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: तब वह लौटकर
  rationale: שׁוּב का अर्थ यहाँ लौटना है; ‘तब’ कथानक के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה
  choice: घर में कभी इधर, कभी उधर चला
  rationale: यह घर के भीतर एक ओर और फिर दूसरी ओर चलने का वर्णन करता है। हिन्दी वाक्यांश मूल इब्रानी बिंब को बनाए रखते हुए स्वाभाविक है।
- source_word: וַיַּעַל
  choice: फिर वह ऊपर गया
  rationale: עלה का स्थान-संबंधी अर्थ सुरक्षित रखा गया है; प्रसंग में वह ऊपर उस स्थान पर गया जहाँ लड़का पड़ा था।
- source_word: וַיִּגְהַר עָלָיו
  choice: लड़के के ऊपर झुक गया
  rationale: גהר किसी के ऊपर झुकने या नत होने की शारीरिक मुद्रा बताता है। यह मूल क्रिया के निकट है और चमत्कार की किसी प्रक्रिया की व्याख्या नहीं जोड़ता।
- source_word: וַיְזוֹרֵר הַנַּעַר עַד שֶׁבַע פְּעָמִים
  choice: लड़के को सात बार छींक आई
  rationale: दुर्लभ क्रिया וַיְזוֹרֵר को परंपरागत और कोशगत अर्थ ‘छींकना’ में लिया गया है। ‘छींक आई’ आधुनिक हिन्दी में सहज अभिव्यक्ति है; संख्या पूर्ण सात घटनाएँ बताती है।
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  choice: उसने अपनी आँखें खोल दीं
  rationale: פקח עיניים आँखें खोलने का सामान्य इब्रानी मुहावरा है। सर्वनाम से अनावश्यक पुनरावृत्ति टलती है और कर्ता स्पष्ट रहता है।
theological_decisions:
- issue: एलीशा की लड़के के ऊपर की गई शारीरिक क्रिया का स्वरूप
  choice: क्रिया को वर्णनात्मक रूप से ‘लड़के के ऊपर झुक गया’ कहा गया है।
  alternative: ‘अपने को उसके ऊपर फैला दिया’ या ‘उसके ऊपर लेट गया’
  rationale: इब्रानी पाठ शारीरिक मुद्रा बताता है, पर यह नहीं समझाता कि चमत्कार किस रीति से हुआ। इसलिए अनुवाद न तो किसी जादुई या संस्कारात्मक प्रक्रिया का संकेत देता है, न क्रिया को मूल से अधिक विशिष्ट बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘लड़का’ נַעַר के लिए प्रसंगानुकूल है। ‘कभी इधर, कभी उधर’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल की शाब्दिक संरचना सुरक्षित रखती है।
