  text: उसने कहा, “क्या मैंने अपने स्वामी से पुत्र माँगा था? क्या मैंने नहीं कहा था, ‘मुझे धोखा मत दीजिए[a]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे झूठी आशा मत दिलाइए।” इब्रानी क्रिया किसी को भ्रम में डालने या ऐसी आशा जगाने का अर्थ दे सकती है जो अंततः व्यर्थ सिद्ध हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाते हुए उसके कथन का परिचय देता है; हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: הֲשָׁאַלְתִּי
  choice: क्या मैंने ... माँगा था?
  rationale: प्रश्नवाचक रूप एक आलंकारिक प्रश्न है, जिसमें वह याद दिलाती है कि उसने पुत्र की माँग नहीं की थी।
- source_word: בֵן
  choice: पुत्र
  rationale: इब्रानी शब्द विशेष रूप से ‘पुत्र’ को सूचित करता है, केवल सामान्य अर्थ में ‘संतान’ को नहीं।
- source_word: מֵאֵת אֲדֹנִי
  choice: अपने स्वामी से
  rationale: ‘से’ मूल पूर्वसर्ग को स्वाभाविक हिन्दी में व्यक्त करता है। ‘स्वामी’ एलीशा के लिए आदरसूचक संबोधन है, यहाँ परमेश्वर की उपाधि नहीं।
- source_word: הֲלֹא אָמַרְתִּי
  choice: क्या मैंने नहीं कहा था
  rationale: यह दूसरा आलंकारिक प्रश्न उसके पहले कहे हुए विरोध को याद करता है; ‘कहा था’ मूल क्रिया के निकट और हिन्दी में स्वाभाविक है।
- source_word: לֹא תַשְׁלֶה אֹתִי
  choice: मुझे धोखा मत दीजिए
  rationale: हिफ़ील रूप यहाँ भ्रमित करने या ऐसी आशा जगाने का भाव रखता है जो अंततः झूठी सिद्ध हो; आदरसूचक ‘दीजिए’ संबोधन के अनुरूप है।
