  text: וַ/יָּבֹ֕א וַ/יִּסְגֹּ֥ר הַ/דֶּ֖לֶת בְּעַ֣ד שְׁנֵי/הֶ֑ם וַ/יִּתְפַּלֵּ֖ל אֶל יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/033.yaml
  text: He went in and shut the door behind the two of them[a], and prayed to Yahweh.
translation:
  language: hi
  text: फिर वह भीतर गया, उन दोनों के पीछे दरवाज़ा बंद किया[a] और याहवे से प्रार्थना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन दोनों को भीतर बंद कर दिया,” अर्थात वह स्वयं और बालक कमरे में अकेले थे।
    reason: בְּעַד के साथ प्रयुक्त अभिव्यक्ति का वैकल्पिक, अधिक स्पष्ट अर्थ देना।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: फिर वह भीतर गया
  rationale: בוא का क्रमिक कथात्मक रूप कमरे के भीतर जाने की अगली क्रिया बताता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  choice: दरवाज़ा बंद किया
  rationale: סגר और דלת का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
- source_word: בְּעַד שְׁנֵיהֶם
  choice: उन दोनों के पीछे
  rationale: בְּעַד यहाँ दरवाज़ा बंद करके भीतर मौजूद दोनों व्यक्तियों—एलीशा और बालक—को एकांत में रखने का भाव देता है; स्रोत की अभिव्यक्ति और उसकी हल्की अस्पष्टता बनाए रखी गई है।
- source_word: וַיִּתְפַּלֵּל אֶל יְהוָה
  choice: याहवे से प्रार्थना की
  rationale: התפלל का अर्थ ‘प्रार्थना करना’ है; אֶל को हिन्दी में इस क्रिया के साथ स्वाभाविक रूप से ‘से’ कहा गया है, और יהוה को व्यक्तिगत दिव्य नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: कमरे में उपस्थित ‘दोनों’ की पहचान
  choice: पाठ में केवल ‘उन दोनों’ रखा गया
  alternative: एलीशा और बालक
  rationale: मूल पद व्यक्तियों के नाम दोबारा नहीं बताता; संदर्भ से उनकी पहचान स्पष्ट होती है। अनुवाद में नाम जोड़ने के बजाय मूल की संक्षिप्तता रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘भीतर गया,’ ‘दरवाज़ा बंद किया’ और ‘प्रार्थना की’ सामान्य हिन्दी कथात्मक प्रयोग हैं; स्रोत की क्रमिक शैली और ‘दोनों’ की संदर्भगत संक्षिप्तता सुरक्षित है।
