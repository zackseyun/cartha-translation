  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
translation:
  language: hi
  text: तब वह गई और कर्मेल पर्वत पर परमेश्वर के जन के पास पहुँची। जब परमेश्वर के जन ने उसे दूर से[a] देखा, तो उसने अपने सेवक गेहज़ी से कहा, “देखो, वह शूनेमी स्त्री।”
  philosophy: optimal-equivalence
  footnotes:
