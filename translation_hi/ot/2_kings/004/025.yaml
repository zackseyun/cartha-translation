- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले निपात की तात्कालिकता आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होती है।
- source_word: הַשּׁוּנַמִּית הַלָּז
  choice: वह शूनेमी स्त्री
  rationale: भौगोलिक पहचान और दूरी सूचित करने वाले संकेतवाचक—दोनों को बनाए रखा गया है।
- source_word: וַיֹּאמֶר
  choice: उसने ... कहा
  rationale: कर्ता ‘परमेश्वर का जन’ हिन्दी में निकटवर्ती पुल्लिंग एकवचन सर्वनाम से स्पष्ट है और अनावश्यक पुनरावृत्ति से बचता है।
