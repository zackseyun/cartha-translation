base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
translation:
  language: hi
  text: तब उसने अपने पति को बुलाकर कहा, “कृपया मेरे साथ युवकों[a] में से एक और गधियों में से एक भेज दो, ताकि मैं परमेश्वर के जन के पास दौड़कर[b] जाऊँ और लौट आऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘युवक’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘सेवक’ या ‘परिचारक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का शाब्दिक अर्थ ‘दौड़ना’ है और यहाँ वह शीघ्रता का भाव भी व्यक्त करती है; अनुवाद ‘जल्दी जाऊँ’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא אֶל־אִישָׁהּ
  choice: तब उसने अपने पति को बुलाकर
  rationale: कथात्मक क्रम को ‘तब’ से स्वाभाविक रूप में व्यक्त किया गया है; इस घरेलू प्रसंग में אִישָׁהּ का अर्थ स्पष्टतः ‘उसका पति’ है।
- source_word: שִׁלְחָה־נָא לִי
  choice: कृपया मेरे लिए ... भेज दो
  rationale: आज्ञार्थक रूप के साथ נָא विनम्र अनुरोध व्यक्त करता है; ‘कृपया’ उसी भाव को सुरक्षित रखता है।
- source_word: אֶחָד מִן־הַנְּעָרִים
  choice: युवकों में से एक
  rationale: נַעַר युवक, परिचारक या सेवक को सूचित कर सकता है। मुख्य पाठ में ‘युवक’ मूल शब्द का व्यापक अर्थ बनाए रखता है, जबकि प्रसंगगत संभावना पादटिप्पणी में दी गई है।
- source_word: וְאַחַת הָאֲתֹנוֹת
  choice: और गधियों में से एक
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है, इसलिए स्त्रीलिंग भेद और ‘में से एक’ का अंशात्मक भाव दोनों सुरक्षित रखे गए हैं।
- source_word: וְאָרוּצָה
  choice: ताकि मैं ... दौड़कर जाऊँ
  rationale: प्रथम पुरुष कोहोर्टेटिव अनुरोध के उद्देश्य और वक्ता के निश्चय को व्यक्त करता है। हिन्दी में ‘दौड़कर जाऊँ’ शाब्दिक गति के साथ प्रसंग की शीघ्रता भी बताता है।
- source_word: עַד־אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन के पास
  rationale: गति के इस प्रसंग में עַד गंतव्य सूचित करता है। אִישׁ הָאֱלֹהִים की पारंपरिक और अर्थपूर्ण हिन्दी अभिव्यक्ति ‘परमेश्वर का जन’ रखी गई है।
- source_word: וְאָשׁוּבָה
  choice: और लौट आऊँ
  rationale: दूसरा कोहोर्टेटिव वक्ता की अभिप्रेत वापसी को व्यक्त करता है; ‘लौट आऊँ’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים की उपाधि
  choice: परमेश्वर का जन
  alternative: नबी
  rationale: मूल पाठ की विशिष्ट उपाधि को बनाए रखा गया है; उसे ‘नबी’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। विनम्र अनुरोध, कथात्मक क्रम, स्त्रीलिंग ‘गधी’, दोनों कोहोर्टेटिव क्रियाओं और मूल उपाधि ‘परमेश्वर का जन’ को यथासंभव स्पष्ट रूप से सुरक्षित रखा गया है।
