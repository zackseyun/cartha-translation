  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
translation:
  language: hi
  text: तब वह ऊपर गई और उसने उसे परमेश्वर के जन के पलंग पर लिटा दिया। फिर वह उसे भीतर छोड़कर द्वार बंद कर बाहर चली गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעַל
  choice: तब वह ऊपर गई
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है। ‘तब’ क्रमिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है और सम्भवतः ऊपर के कमरे की ओर जाने की गति को बनाए रखता है।
- source_word: וַתַּשְׁכִּבֵהוּ
  choice: उसने उसे ... लिटा दिया
  rationale: यह causative क्रिया किसी को लेटाने का भाव देती है; ‘लिटा दिया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: מִטַּת
  choice: पलंग
  rationale: מִטָּה सोने के पलंग या बिछौने को दर्शाता है। इस घरेलू प्रसंग में ‘पलंग’ सहज और स्पष्ट है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: इब्रानी उपाधि का सीधा अनुवाद रखा गया है; ‘नबी’ कहना प्रसंगानुकूल होते हुए भी स्रोत की अभिव्यक्ति को अधिक विशिष्ट बना देता।
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  choice: वह उसे भीतर छोड़कर द्वार बंद कर
  rationale: בְּעַד के साथ סגר का आशय किसी को भीतर रखकर द्वार बंद करने से है। ‘उसके पीछे द्वार बंद किया’ हिन्दी में ऐसा संकेत दे सकता है मानो वह स्वयं द्वार से होकर गया हो; चुना हुआ रूप वास्तविक क्रिया और स्थानिक अर्थ को स्पष्ट करता है।
- source_word: וַתֵּצֵא
  choice: बाहर चली गई
  rationale: יצא का ठोस अर्थ ‘बाहर जाना’ है। स्त्री कर्ता और कथा-प्रवाह के अनुसार ‘बाहर चली गई’ स्वाभाविक है।
