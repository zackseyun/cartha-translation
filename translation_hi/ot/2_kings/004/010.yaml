  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
translation:
  language: hi
  text: आइए, हम एक छोटा-सा दीवार वाला ऊपरी कमरा[a] बनाएँ और वहाँ उसके लिए एक पलंग, एक मेज़, एक कुर्सी और एक दीपदान रख दें। फिर जब भी वह हमारे यहाँ आए, तो वहाँ ठहर सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दीवार पर एक छोटा-सा ऊपरी कमरा,” अथवा केवल “एक छोटा-सा ऊपरी कमरा।” इब्रानी पदबंध संक्षिप्त है और उसकी ठीक संरचना कुछ अस्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह वहाँ मुड़ जाए।” यहाँ क्रिया का अर्थ यात्रा के बीच ठहरने के लिए मुड़ना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  choice: आइए, हम ... बनवाएँ
  rationale: प्रथम पुरुष बहुवचन के इच्छासूचक रूप और विनम्रता-सूचक נָא को स्वाभाविक आधुनिक हिन्दी में विनम्र प्रस्ताव के रूप में व्यक्त करता है। निर्माण स्वयं करने के बजाय करवाने का घरेलू-संदर्भगत भाव ‘बनवाएँ’ से स्वाभाविक बनता है।
- source_word: עֲלִיַּת קִיר קְטַנָּה
  choice: दीवार पर एक छोटा-सा ऊपरी कमरा
  rationale: עֲלִיָּה का अर्थ ‘ऊपरी कमरा’ और קִיר का ठोस अर्थ ‘दीवार’ सुरक्षित रखा गया है। संक्षिप्त इब्रानी पदबंध की संरचनात्मक अस्पष्टता को पादटिप्पणी में दर्शाया गया है।
- source_word: וְנָשִׂים לוֹ שָׁם
  choice: उसमें उसके लिए ... रख दें
  rationale: שׂים के ‘रखना/स्थापित करना’ अर्थ, स्थानवाचक ‘वहाँ’ और लाभार्थी ‘उसके लिए’—तीनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: מִטָּה
  choice: पलंग
  rationale: अतिथि के सोने के लिए घरेलू साज-सामान के अर्थ में ‘पलंग’ सामान्य और स्पष्ट हिन्दी है।
- source_word: שֻׁלְחָן
  choice: मेज़
  rationale: घरेलू साज-सामान के सामान्य अर्थ का सीधा आधुनिक हिन्दी समतुल्य।
- source_word: כִסֵּא
  choice: कुर्सी
  rationale: व्यापक ‘आसन’ की अपेक्षा घरेलू साज-सामान के प्रसंग में ‘कुर्सी’ अधिक स्वाभाविक है।
- source_word: מְנוֹרָה
  choice: दीपदान
  rationale: यह शब्द केवल दीपक नहीं, उसे धारण करने वाले आधार/स्थान को सूचित करता है; ‘दीपदान’ इस भेद को संक्षेप में बनाए रखता है।
- source_word: וְהָיָה בְּבֹאוֹ אֵלֵינוּ
  choice: फिर जब भी वह हमारे यहाँ आए
  rationale: इब्रानी भावी परिस्थिति और बार-बार आने की प्रसंगगत संभावना को सहज हिन्दी में व्यक्त करता है।
- source_word: יָסוּר שָׁמָּה
  choice: तो वहाँ ठहर सके
  rationale: סוּר का मूल भाव ‘मुड़ना/अलग हटना’ है, पर यात्रा और आतिथ्य के प्रसंग में इसका आशय ठहरने के लिए मुड़ना है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
