  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
translation:
  language: hi
  text: तब उसने अपने सेवक गेहजी से कहा, “इस शूनेमी स्त्री को बुलाओ।” उसने उसे बुलाया, और वह उसके सामने खड़ी हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֵּחֲזִי
  choice: गेहजी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: נַעֲרוֹ
  choice: अपने सेवक
  rationale: נַעַר का अर्थ युवक, सेवक या परिचारक हो सकता है; यहाँ गेहजी की एलीशा के अधीन सेवा-भूमिका संदर्भ से स्पष्ट है।
- source_word: קְרָא
  choice: बुलाओ
  rationale: यह आज्ञार्थक रूप किसी को अपने पास बुलाने का निर्देश देता है; “बुलाओ” सहज और अर्थानुकूल है।
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  choice: इस शूनेमी स्त्री को
  rationale: यह पद स्त्री की पहचान शूनेम नगर से उसके संबंध द्वारा कराता है। हिन्दी में “शूनेमी स्त्री” स्पष्ट और स्वाभाविक है, और “इस” הַזֹּאת को दर्शाता है।
- source_word: וַיִּקְרָא לָהּ
  choice: उसने उसे बुलाया
  rationale: आज्ञा के पालन को उसी मूल क्रिया के अनुरूप सीधे ढंग से व्यक्त किया गया है।
- source_word: וַתַּעֲמֹד
  choice: आकर खड़ी हो गई
  rationale: मूल क्रिया का प्रधान अर्थ “खड़ी हुई” है। हिन्दी संदर्भ में बुलाए जाने के बाद सामने उपस्थित होने की स्वाभाविक गति को “आकर” व्यक्त करता है, यद्यपि गति मूल क्रिया में अलग से स्पष्ट नहीं है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह स्थान अथवा उपस्थिति का सामान्य अर्थ देता है; “उसके सामने” आधुनिक हिन्दी में स्वाभाविक है।
