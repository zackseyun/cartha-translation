  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
translation:
  language: hi
  text: तब उसने गधी पर काठी कसी और अपने सेवक से कहा, “इसे हाँकता चल। जब तक मैं तुझसे न कहूँ, मेरे कारण इसकी चाल धीमी मत करना[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में क्रिया का अर्थ ‘रोकना,’ ‘थामना’ या ‘बाधित करना’ हो सकता है; वाक्यांश का आशय है, ‘मेरे सवारी करते समय मेरे कारण मत रुकना/मत धीमे पड़ना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  choice: उसने गधी पर काठी कसी
  rationale: חבש यहाँ सवारी के लिए पशु को तैयार करने, अर्थात काठी कसने, के अर्थ में है। אָתוֹן विशेष रूप से मादा गधे को दर्शाता है, इसलिए ‘गधी’ स्वाभाविक और सटीक है।
- source_word: נַעֲרָהּ
  choice: अपने सेवक
  rationale: נַעַר यहाँ युवा पुरुष परिचारक या सेवक को सूचित करता है। हिंदी में ‘सेवक’ उसकी कथात्मक भूमिका को सहज ढंग से व्यक्त करता है।
- source_word: נְהַג וָלֵךְ
  choice: इसे हाँकता चल
  rationale: נהג पशु को आगे हाँकने का बोध देता है और וָלֵךְ निरंतर आगे बढ़ते रहने पर बल देता है। संयुक्त हिंदी अभिव्यक्ति तात्कालिकता और लगातार गति दोनों को रखती है।
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  choice: मेरे कारण इसकी चाल धीमी मत करना
  rationale: עצר का अर्थ रोकना, थामना या गति बाधित करना हो सकता है। לִי और לִרְכֹּב के साथ आशय है कि उसकी सवारी उसके कारण धीमी या बाधित न की जाए। सहज हिंदी में यह भाव स्पष्ट है, जबकि पादटिप्पणी मूल की व्यापक अर्थ-सीमा बताती है।
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  choice: जब तक मैं तुझसे न कहूँ
  rationale: निषेध के बाद כִּי אִם अपवाद की शर्त प्रस्तुत करता है। हिंदी में ‘जब तक मैं तुझसे न कहूँ’ स्वाभाविक रूप से ‘मेरे कहने के सिवा नहीं’ का अर्थ देता है।
