  text: וְ/אִשָּׁ֣ה אַחַ֣ת מִ/נְּשֵׁ֣י בְנֵֽי הַ֠/נְּבִיאִים צָעֲקָ֨ה אֶל אֱלִישָׁ֜ע לֵ/אמֹ֗ר עַבְדְּ/ךָ֤ אִישִׁ/י֙ מֵ֔ת וְ/אַתָּ֣ה יָדַ֔עְתָּ כִּ֣י עַבְדְּ/ךָ֔ הָיָ֥ה יָרֵ֖א אֶת יְהוָ֑ה וְ/הַ֨/נֹּשֶׁ֔ה בָּ֗א לָ/קַ֜חַת אֶת שְׁנֵ֧י יְלָדַ֛/י ל֖/וֹ לַ/עֲבָדִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/001.yaml
  text: One woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as servants.”
translation:
  language: hi
  text: भविष्यद्वक्ताओं के चेलों की पत्नियों में से एक स्त्री ने एलीशा से दुहाई देकर कहा, “आपका सेवक, मेरा पति, मर गया है। आप जानते हैं कि आपका सेवक यहोवा का भय मानता था। अब लेनदार मेरे दोनों बच्चों[a] को अपने लिए दास बनाने के लिए लेने आया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे दोनों बेटों।” हिब्रू में “मेरे दोनों बच्चे” है, जिसे प्रसंग में अधिक विशेष रूप से “बेटे” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  choice: एक स्त्री
  rationale: यह पद एक अनिश्चित स्त्री पात्र का परिचय देता है। आरंभिक וְ कथा को आगे बढ़ाता है; हिंदी में अलग संयोजक जोड़ना आवश्यक नहीं।
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के चेलों की पत्नियों में से
  rationale: בְנֵי הַנְּבִיאִים का शाब्दिक रूप ‘भविष्यद्वक्ताओं के पुत्र’ है, पर यहाँ यह भविष्यद्वक्ताओं के समुदाय या शिष्य-मंडली का पारिभाषिक नाम है; ‘चेले’ आधुनिक हिंदी में आशय स्पष्ट करता है। ‘पत्नियों’ बनाए रखने से पाठ उसे समय से पहले ‘विधवा’ नहीं कहता।
- source_word: צָעֲקָה אֶל
  choice: के सामने दुहाई देकर कहा
  rationale: क्रिया संकट में सहायता की तीव्र पुकार व्यक्त करती है। ‘दुहाई देकर’ सामान्य ‘पुकारकर’ की अपेक्षा उसकी विवश अपील को अधिक स्वाभाविक हिंदी में रखता है।
- source_word: עַבְדְּךָ אִישִׁי
  choice: तेरा सेवक, मेरा पति
  rationale: 'हिब्रू क्रम और दोनों संबंधों को स्पष्ट रखा गया है: वह एलीशा का सेवक और स्त्री का पति था।'
- source_word: הָיָה יָרֵא אֶת יְהוָה
  choice: यहोवा का भय मानता था
  rationale: यह स्थापित बाइबलीय मुहावरा श्रद्धापूर्ण भय और निष्ठा के धार्मिक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: הַנֹּשֶׁה
  choice: साहूकार
  rationale: यह ऋण देने और उसे वसूलने वाले व्यक्ति को दर्शाता है; प्रसंग में ‘साहूकार’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: בָּא לָקַחַת
  choice: लेने आया है
  rationale: पूर्ण क्रिया के वर्तमान संकटकारी परिणाम को हिंदी का पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁנֵי יְלָדַי
  choice: मेरे दोनों बच्चों
  rationale: יְלָדִים लिंग की दृष्टि से अधिक व्यापक ‘बच्चे’ कहता है; प्रसंग से ‘बेटे’ संभव है, पर मुख्य पाठ अनावश्यक रूप से अर्थ संकीर्ण नहीं करता।
- source_word: לַעֲבָדִים
  choice: दास बनाने के लिए
  rationale: यह ऋण के कारण बच्चों को सेवा-दासता में ले जाने की बात है; ‘दास’ हिब्रू शब्द की कठोर सामाजिक वास्तविकता को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को ‘प्रभु’ जैसे शीर्षक से प्रतिस्थापित नहीं करता।
- issue: ‘यहोवा का भय मानना’ का अर्थ
  choice: मुहावरे को यथावत रखा
  alternative: यहोवा का आदर करता था
  rationale: ‘आदर’ अर्थ को केवल श्रद्धा तक सीमित कर सकता है। ‘भय मानना’ मूल धार्मिक मुहावरे की श्रद्धा, आज्ञाकारिता और जवाबदेही की संयुक्त धारणा तथा उसकी अंतर्निहित तनावपूर्ण भाषा को सुरक्षित रखता है।
- issue: ऋणदाता द्वारा बच्चों को लेना
  choice: दास बनाने के लिए
  alternative: सेवक बनाने के लिए
  rationale: ‘सेवक’ कठोर ऋण-दासता को हल्का कर सकता है। ‘दास’ मूल עֲבָדִים की सामाजिक और कानूनी गंभीरता को अधिक स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज हिंदी अपनाई गई है। संबोधन में ‘तेरा/तू’ रखा गया है, क्योंकि प्राचीन निकट संबोधन का एकवचन रूप है; इसका आशय अनादर नहीं। ‘भविष्यद्वक्ताओं के चेले’ पारिभाषिक समूह को सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘पत्नियों’ मूल की सामाजिक पहचान बनाए रखता है।
