  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
translation:
  language: hi
  text: तब एलीशा ने गेहजी को बुलाकर कहा, “इस शूनेमी स्त्री को बुलाओ।” गेहजी ने उसे बुलाया, और वह एलीशा के पास आई। तब एलीशा ने कहा, “अपने बेटे को उठा लो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶל גֵּיחֲזִי
  choice: तब उसने गेहजी को बुलाकर
  rationale: क़रा का रूप कथा में अगली क्रमिक क्रिया बताता है। ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; אֶל के साथ ‘को बुलाया’ मुहावरेदार है।
- source_word: קְרָא
  choice: बुलाओ
  rationale: आज्ञार्थक रूप का सीधा और प्रसंगानुकूल अनुवाद; ‘बुलवा भेजो’ की अपेक्षा मूल क्रिया के अधिक निकट है।
- source_word: הַשֻּׁנַמִּית הַזֹּאת
  choice: उस शूनेमी स्त्री को
  rationale: स्त्रीलिंग जातिवाचक शब्द शूनेम की स्त्री को सूचित करता है। हिन्दी में संदर्भगत संकेत के लिए ‘उस’ स्वाभाविक है, जबकि ‘स्त्री’ निहित अर्थ को स्पष्ट करता है।
- source_word: וַיִּקְרָאֶהָ
  choice: उसने उसे बुलाया
  rationale: मूल में ‘बुलाना’ क्रिया की पुनरावृत्ति गेहजी की आज्ञाकारिता को स्पष्ट रूप से बयान करती है, इसलिए इसे संक्षिप्त नहीं किया गया।
- source_word: וַתָּבוֹא אֵלָיו
  choice: और वह उसके पास आई
  rationale: בוא + אֶל व्यक्ति की ओर आने को दर्शाता है; मूल किसी कमरे में प्रवेश को अनिवार्य नहीं करता।
- source_word: שְׂאִי
  choice: उठा लो
  rationale: नसा का स्त्रीलिंग एकवचन आज्ञार्थक रूप यहाँ जीवित किए गए बेटे को अपने पास उठाने का निर्देश देता है। ‘उठा लो’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया का भाव बनाए रखता है।
- source_word: בְנֵךְ
  choice: अपने बेटे को
  rationale: בן तथा स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय का विशिष्ट अर्थ ‘तुम्हारा बेटा’ है। प्रत्यक्ष आज्ञा में हिन्दी का ‘अपने बेटे को’ अधिक स्वाभाविक है।
