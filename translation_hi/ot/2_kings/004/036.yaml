  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। पात्र का नाम प्रचलित हिन्दी बाइबलीय रूप ‘गेहजी’ और स्थान-संबंधी स्त्रीवाचक रूप ‘शूनेमी स्त्री’ रखा गया है। किसी पाठगत या धर्मवैज्ञानिक अस्पष्टता को अलग से समझाने की आवश्यकता नहीं पड़ी।
