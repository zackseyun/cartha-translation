  text: לַ/דָּבָ֣ר הַ/זֶּ֔ה יִסְלַ֥ח יְהוָ֖ה לְ/עַבְדֶּ֑/ךָ בְּ/ב֣וֹא אֲדֹנִ֣/י בֵית רִמּוֹן֩ לְ/הִשְׁתַּחֲוֺ֨ת שָׁ֜מָּ/ה וְ/ה֣וּא נִשְׁעָ֣ן עַל יָדִ֗/י וְ/הִֽשְׁתַּחֲוֵ֨יתִי֙ בֵּ֣ית רִמֹּ֔ן בְּ/הִשְׁתַּחֲוָיָ֨תִ/י֙ בֵּ֣ית רִמֹּ֔ן יִסְלַח נא יְהוָ֥ה לְ/עַבְדְּ/ךָ֖ בַּ/דָּבָ֥ר הַ/זֶּֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
translation:
  language: hi
  text: 'इस बात में[a] यहोवा आपके दास को क्षमा करे: जब मेरा स्वामी रिम्मोन के भवन में वहाँ दण्डवत् करने जाए और वह मेरे हाथ का सहारा ले, और मैं भी रिम्मोन के भवन में दण्डवत् करूँ—जब मैं रिम्मोन के भवन में दण्डवत् करूँ[b], तब यहोवा, कृपया, इस बात में आपके दास को क्षमा करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मामले में।”
    reason: ‘बात’ के लिए प्रयुक्त इब्रानी शब्द किसी विशेष विषय या मामले का बोध करा सकता है।
  - marker: b
    text: “रिम्मोन का भवन” अरामी देवता रिम्मोन के मन्दिर या देवस्थान को दर्शाता है।
    reason: सांस्कृतिक सन्दर्भ स्पष्ट करने के लिए।
lexical_decisions:
- source_word: יִסְלַח
  choice: क्षमा करे
  rationale: यहाँ क्रिया विनती या कामना व्यक्त करती है; ‘क्षमा करे’ आधुनिक हिन्दी में स्वाभाविक रूप से दैवी क्षमा की प्रार्थना प्रकट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְעַבְדֶּךָ
  choice: आपके दास को
  rationale: दरबारी आत्म-संबोधन में ‘दास’ आदरपूर्ण और स्वाभाविक है तथा यहाँ सामाजिक दासत्व पर अनावश्यक बल नहीं देता।
- source_word: בְּבוֹא אֲדֹנִי
  choice: जब मेरा स्वामी ... जाए
  rationale: בְּ सहित infinitive construct कालगत परिस्थिति बताता है; ‘स्वामी’ उस राजा को सूचित करता है जिसकी नामान सेवा करता है।
- source_word: בֵית רִמּוֹן
  choice: रिम्मोन का भवन
  rationale: यह इब्रानी के शाब्दिक ‘रिम्मोन के घर’ को निकटता से रखता है; प्रसंग में यह देवता रिम्मोन का मन्दिर या देवस्थान है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: दण्डवत् करने
  rationale: यह शारीरिक रूप से झुकने या भूमि पर प्रणाम करने का बोध देता है और यह निश्चित नहीं करता कि नामान का कार्य अन्तःकरण से उपासना था।
- source_word: נִשְׁעָן עַל יָדִי
  choice: वह मेरे हाथ का सहारा ले
  rationale: ‘हाथ का सहारा लेना’ मूल चित्र को बनाए रखते हुए हिन्दी में स्वाभाविक रूप से किसी सेवक के सहारे झुकने को व्यक्त करता है।
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: तो मुझे भी ... दण्डवत् करना पड़े
  rationale: सन्दर्भ में राजा को सहारा देते हुए नामान के साथ झुकने का परिणाम निहित है; ‘करना पड़े’ उसकी पदगत विवशता को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि मूल में यह भाव प्रत्यक्ष रूप से अलग शब्द से नहीं कहा गया।
- source_word: נָא
  choice: कृपया
  rationale: विनम्र आग्रह के कण को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या הִשְׁתַּחֲוָה को ‘उपासना करना’ कहा जाए या शारीरिक क्रिया के रूप में प्रस्तुत किया जाए
  choice: दण्डवत् करना
  alternative: उपासना करना; झुकना
  rationale: इब्रानी क्रिया उपासना और शारीरिक दण्डवत्—दोनों का अर्थ दे सकती है। ‘दण्डवत् करना’ बाहरी क्रिया को स्पष्ट करता है, पर नामान की आन्तरिक निष्ठा के विषय में पाठ से अधिक निर्णय नहीं करता और धार्मिक तनाव को बनाए रखता है।
- issue: नामान की सहभागिता को स्वैच्छिक या पदगत विवशता के रूप में कैसे व्यक्त किया जाए
  choice: ‘मुझे भी ... दण्डवत् करना पड़े’ द्वारा प्रसंगगत विवशता व्यक्त की गई
  alternative: ‘और मैं भी ... दण्डवत् करूँ’
  rationale: राजा के उसके हाथ पर सहारा लेने से साथ झुकना परिस्थिति का परिणाम है। फिर भी इसे केवल बाहरी, निर्दोष कर्म घोषित नहीं किया गया, क्योंकि नामान स्वयं इसी बात के लिए क्षमा माँगता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, कथात्मक शैली रखी गई है। नामान एलीशा को ‘आप’ कहकर स्वयं को ‘आपका दास’ कहता है। ‘दण्डवत् करना’ जानबूझकर चुना गया है ताकि शारीरिक झुकने और धार्मिक उपासना के बीच मूल की अर्थगत खुली गुंजाइश बनी रहे।
