source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
translation:
  language: hi
  text: अराम[c] के राजा का सेनापति नामान अपने स्वामी की दृष्टि में एक महान और अत्यंत सम्मानित व्यक्ति था, क्योंकि उसके द्वारा यहोवा ने अराम को विजय[a] दिलाई थी। वह वीर योद्धा था, पर उसे कोढ़[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छुटकारा’ अथवा ‘उद्धार’; यहाँ इब्रानी शब्द सैन्य सफलता के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द प्राचीन संदर्भ में एक गंभीर चर्मरोग-संबंधी अवस्था को सूचित करता है; यह आधुनिक चिकित्सकीय कोढ़ (हैन्सन रोग) के ठीक समान होना आवश्यक नहीं है।
    reason: cultural_note
  - marker: c
    text: परंपरागत रूप से ‘सीरिया’; इब्रानी में ‘अराम’।
    reason: alternative_reading
lexical_decisions:
- source_word: שַׂר צְבָא
  choice: सेनापति
  rationale: यह पद सेना के प्रधान अधिकारी को सूचित करता है; ‘सेनापति’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: अर्थात् प्राचीन अरामी राज्य का राजा; मूल इब्रानी ‘अराम’ को पारंपरिक ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
- source_word: אִישׁ גָּדוֹל לִפְנֵי אֲדֹנָיו וּנְשֻׂא פָנִים
  choice: अपने स्वामी की दृष्टि में एक महान और अत्यंत सम्मानित व्यक्ति
  rationale: यह राजदरबार में नामान के ऊँचे पद, प्रतिष्ठा और सम्मान को व्यक्त करता है तथा לִפְנֵי के ‘की दृष्टि में’ भाव को बनाए रखता है।
- source_word: בּוֹ נָתַן יְהוָה תְּשׁוּעָה לַאֲרָם
  choice: उसके द्वारा यहोवा ने अराम को विजय दिलाई
  rationale: בּוֹ को साधनसूचक ‘उसके द्वारा’ और सैन्य प्रसंग में תְּשׁוּעָה को ‘विजय’ कहा गया है; ईश्वर के नाम को ‘यहोवा’ रूप में रखा गया है।
- source_word: גִּבּוֹר חַיִל
  choice: वीर योद्धा
  rationale: यह नामान की युद्धक क्षमता और पराक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מְצֹרָע
  choice: उसे कोढ़ था
  rationale: यह पारंपरिक और कथा में पहचाना जाने वाला पद है; पादटिप्पणी स्पष्ट करती है कि प्राचीन रोग-संज्ञा आधुनिक हैन्सन रोग के ठीक समान होना आवश्यक नहीं।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से मूल पाठ के निज नाम को उपाधि से प्रतिस्थापित किए बिना व्यक्त किया गया है।
- issue: अराम की विजय यहोवा द्वारा दिए जाने का कथन
  choice: उसके द्वारा यहोवा ने अराम को विजय दिलाई थी
  alternative: उसके द्वारा यहोवा ने अराम का उद्धार किया था
  rationale: मूल पाठ विदेशी राष्ट्र की सैन्य सफलता भी यहोवा को देता है। इस धर्मवैचारिक तनाव को बिना नरम किए सुरक्षित रखा गया है; सैन्य प्रसंग के कारण ‘विजय’ उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास ने नामान की प्रतिष्ठा, यहोवा द्वारा अराम को दी गई विजय और उसके रोग के बीच मूल पाठ का तीखा विरोध सुरक्षित रखा है।
