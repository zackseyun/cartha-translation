reference: 2 Kings 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
translation:
  language: hi
  text: परन्तु परमेश्वर के जन एलीशा के सेवक गेहजी ने कहा, “देखो, मेरे स्वामी ने नामान, इस अरामी को, उसके हाथ से वह वस्तु न लेकर बख्श दिया है जो वह लाया था। यहोवा के जीवन की शपथ, मैं उसके पीछे दौड़ूँगा और उससे कुछ ले लूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעַר
  choice: सेवक
  rationale: यहाँ शब्द गेहजी की आयु से अधिक एलीशा के अधीन उसकी सेवकीय भूमिका बताता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी के लिए प्रयुक्त पारंपरिक उपाधि है और हिन्दी बाइबलीय भाषा में स्पष्ट तथा स्वाभाविक है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह गेहजी की तीखी प्रतिक्रिया और कथन पर जोर को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָשַׂךְ ... מִקַּחַת
  choice: नहीं ली ... इस प्रकार उन्होंने उसे छोड़ दिया
  rationale: मूल में रोक रखने/लेने से बख्श देने का भाव है। हिन्दी वाक्य में पहले न लेने की क्रिया और फिर नामान को छोड़ देने का परिणाम स्पष्ट किया गया है।
- source_word: הָאֲרַמִּי
  choice: अरामी
  rationale: यह मूल जातीय-भौगोलिक पद का सीधा रूप है; ‘सीरियाई’ की अपेक्षा प्राचीन संदर्भ को अधिक ठीक रखता है।
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: यह प्रतिज्ञात्मक शपथ-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता और दिव्य नाम को बनाए रखता है।
- source_word: רַצְתִּי אַחֲרָיו
  choice: मैं उसके पीछे दौड़कर
  rationale: मूल की तात्कालिक और सजीव पीछा करने की क्रिया सुरक्षित रहती है।
- source_word: מְאוּמָה
  choice: कुछ न कुछ
  rationale: संदर्भ में गेहजी की मंशा नामान से कोई वस्तु प्राप्त करने की है; यह अनिश्चितता और आग्रह दोनों व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए उसे ‘प्रभु’ जैसे पद से नहीं बदला गया। आधुनिक हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ रखा गया; ‘याहवे’ अधिक निकट लिप्यंतरण है।
- issue: गेहजी की शपथ का स्वरूप
  choice: जीवित यहोवा की शपथ
  alternative: यहोवा के जीवन की शपथ
  rationale: मूल शपथ-सूत्र का धार्मिक भार बनाए रखते हुए हिन्दी में समझ आने वाला मुहावरा चुना गया; इससे शपथ का अनुमोदन नहीं, केवल गेहजी के कथन का वर्णन होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘परन्तु’, ‘स्वामी’ और ‘परमेश्वर का जन’ बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए स्पष्ट है।
