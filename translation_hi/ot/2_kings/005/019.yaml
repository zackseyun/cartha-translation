base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/019.yaml
  text: And he said to him[a], “Go in peace.” So he went from him some distance.
translation:
  language: hi
  text: तब उसने उससे कहा, “शान्ति से जाओ।” और वह उसके पास से कुछ दूर[a] चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भूमि की एक दूरी।” इब्रानी अभिव्यक्ति यात्रा की कुछ दूरी बताती है, पर उसका ठीक माप नहीं बताती।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: तब उसने उससे कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी क्रम देता है, और दोनों सर्वनामों को मूल के अनुसार बनाए रखता है।
- source_word: לֵךְ לְשָׁלוֹם
  choice: शान्ति से जाओ
  rationale: यह विदाई के समय प्रयुक्त आशीर्वादात्मक रूढ़ि है। यह अनुवाद שָׁלוֹם के अर्थ और सूत्र की संक्षिप्तता दोनों को सुरक्षित रखता है।
- source_word: וַיֵּלֶךְ מֵאִתּוֹ
  choice: और वह उसके पास से ... चला गया
  rationale: यह क्रमिक कथन उसके एलीशा की उपस्थिति से चले जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּבְרַת אָרֶץ
  choice: कुछ दूर
  rationale: यह पद यात्रा की एक अनिर्दिष्ट दूरी बताता है; ‘कुछ दूर’ मात्रा को बढ़ा-चढ़ाकर बताए बिना उसी अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: रिम्मोन के भवन में नमन के प्रस्तावित आचरण के बाद एलीशा के उत्तर का आशय
  choice: केवल ‘शान्ति से जाओ’ कहना
  alternative: इसे नमन के प्रस्ताव की स्पष्ट स्वीकृति अथवा अस्वीकृति के रूप में विस्तार देना
  rationale: इब्रानी पाठ में केवल प्रचलित आशीर्वादात्मक विदाई है। अनुवाद न तो नैतिक अनुमोदन जोड़ता है, न निन्दा; इस प्रकार मूल की धर्मवैचारिक अनिर्णीतता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सर्वनाम मूल पाठ के अनुरूप हैं; ‘शान्ति से जाओ’ परिचित आशीर्वादात्मक विदाई है। फुटनोट-चिह्न को उसी पद के बाद रखा गया है जिसे वह स्पष्ट करता है।
