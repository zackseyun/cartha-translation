source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
translation:
  language: hi
  text: “क्या दमिश्क की नदियाँ, अबाना[a] और परपर, इस्राएल के सारे जल से अच्छी नहीं हैं? क्या मैं उनमें नहाकर शुद्ध नहीं हो सकता?” तब वह मुड़ा और क्रोध से भरा हुआ चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपराओं में इस नदी का नाम “अमाना” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं हैं? / क्या ... नहीं हो सकता?
  rationale: दोनों अलंकारिक प्रश्नों को ऐसे स्वाभाविक हिन्दी प्रश्नों में रखा गया है जिनमें सकारात्मक उत्तर की अपेक्षा है।
- source_word: טוֹב ... מִכֹּל
  choice: सारे ... से अच्छी
  rationale: तुलनात्मक रचना को हिन्दी में ‘से अच्छी’ द्वारा व्यक्त किया गया है; बहुवचन ‘नदियाँ’ के साथ स्त्रीलिंग बहुवचन क्रिया रखी गई है।
- source_word: אבנה
  choice: अबाना
  rationale: मसोरेटिक पाठ के भौगोलिक नाम का निकट देवनागरी लिप्यंतरण; वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
- source_word: וּפַרְפַּר
  choice: और परपर
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण, अनावश्यक अंग्रेज़ी-प्रभावित ‘फरपर’ से बचते हुए।
- source_word: נַהֲרוֹת דַּמֶּשֶׂק
  choice: दमिश्क की नदियाँ
  rationale: सम्बन्धवाचक हिब्रू पदबंध का स्वाभाविक हिन्दी रूप।
- source_word: מִכֹּל מֵימֵי יִשְׂרָאֵל
  choice: इस्राएल के सारे जल से
  rationale: हिब्रू के व्यापक ‘जल’ और पूर्णतावाची ‘सारे’ को बनाए रखा गया है; इसे केवल नदियों तक सीमित नहीं किया गया।
- source_word: אֶרְחַץ בָּהֶם
  choice: मैं उनमें नहाकर
  rationale: רחץ के स्नान/धोने के अर्थ को इस प्रसंग में स्वाभाविक ‘नहाकर’ से व्यक्त किया गया है और बहुवचन सर्वनाम सुरक्षित है।
- source_word: וְטָהָרְתִּי
  choice: शुद्ध नहीं हो सकता
  rationale: शारीरिक और व्यापक शुद्धता—दोनों अर्थों की गुंजाइश बनाए रखने के लिए ‘शुद्ध’ चुना गया है।
- source_word: וַיִּפֶן וַיֵּלֶךְ
  choice: वह मुड़ा और ... चला गया
  rationale: दोनों क्रमिक क्रियाओं को स्पष्ट और स्वाभाविक हिन्दी में अलग-अलग बनाए रखा गया है।
- source_word: בְּחֵמָה
  choice: क्रोध से भरा हुआ
  rationale: חֵמָה के तीव्र क्रोध को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शुद्ध होने की प्रकृति
  choice: शुद्ध नहीं हो सकता
  alternative: साफ़ नहीं हो सकता / पवित्र नहीं हो सकता
  rationale: ‘शुद्ध’ त्वचा-रोग से मुक्त और व्यापक शुद्धता, दोनों की अर्थ-छाया सुरक्षित रखता है; ‘साफ़’ अर्थ को बहुत भौतिक और ‘पवित्र’ बहुत धार्मिक रूप से विशिष्ट कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। वक्ता के आक्रोश को अलंकारिक प्रश्नों और अंतिम वाक्य में सुरक्षित रखा गया है। मुख्य पाठ का एकमात्र पादटिप्पणी-चिह्न [a] पादटिप्पणी से मेल खाता है।
