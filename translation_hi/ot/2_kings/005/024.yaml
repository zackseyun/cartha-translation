lexical_decisions:
- source_word: הָעֹפֶל
  choice: टीले के पास
  rationale: עֹפֶל किसी ऊँची उठी हुई जगह, टीले या किलेबंद ऊँचाई को सूचित कर सकता है। इस प्रसंग में स्थलाकृतिक अर्थ स्वाभाविक है; विभक्ति אֶל के कारण ‘के पास पहुँचा’ गति के लक्ष्य को सहज हिन्दी में व्यक्त करता है।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: इब्रानी में יָד एकवचन रूप में बहुवचन संबंधसूचक प्रत्यय के साथ है। ‘उनके हाथ से’ वस्तुओं को सीधे उनसे लेने की ठोस छवि और सामूहिक प्रयोग—दोनों को बनाए रखता है।
- source_word: וַיִּפְקֹד
  choice: रख दिया
  rationale: यहाँ פקד का व्यापक अर्थ-संसार संदर्भ के अनुसार सामान को सुरक्षित रूप से जमा या रख देने की ओर संकेत करता है। ‘रख दिया’ सामान्य पाठक के लिए स्वाभाविक है और क्रिया को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: בַּבָּיִת
  choice: घर में
  rationale: בַּבָּיִת यहाँ सबसे स्वाभाविक रूप से उस भौतिक घर को बताता है जिसमें सामान रखा गया।
- source_word: הָאֲנָשִׁים
  choice: उन आदमियों
  rationale: मूल पाठ सामान्य संज्ञा ‘आदमी’ का प्रयोग करता है। यद्यपि प्रसंग में वे नामान के सेवक हैं, अनुवाद मूल से अधिक विशिष्ट पहचान नहीं जोड़ता।
