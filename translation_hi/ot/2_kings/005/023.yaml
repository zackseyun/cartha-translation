base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
translation:
  language: hi
  text: नामान ने कहा, “कृपा करके चाँदी के दो किक्कार[a] ले लीजिए।” फिर उसने उससे बहुत आग्रह किया। उसने चाँदी के दो किक्कार दो थैलियों में बाँध दिए और दो जोड़े वस्त्र भी दिए। उसने यह सामान अपने दो सेवकों को सौंप दिया, और वे उसे गिहजी के आगे-आगे लेकर चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: किक्कार प्राचीन भार-माप था। इसका ठीक भार अलग-अलग समय और स्थान में भिन्न था; यहाँ दो किक्कार से बहुत बड़ी मात्रा में चाँदी का बोध होता है।
    reason: cultural_note
lexical_decisions:
- source_word: הוֹאֵל קַח
  choice: कृपया ... ले लो
  rationale: विनम्र आग्रह के बाद आए सीधे आदेश का स्वाभाविक आधुनिक हिन्दी रूप; इससे नामान का आग्रहपूर्ण किंतु शिष्ट स्वर बना रहता है।
- source_word: כִּכָּרָיִם / כִּכְּרַיִם כֶּסֶף
  choice: चाँदी के दो किक्कार
  rationale: किक्कार प्राचीन भार-माप का पारंपरिक हिन्दी बाइबलीय नाम है; ‘चाँदी के’ से स्पष्ट होता है कि यहाँ गिनी हुई मुद्राएँ नहीं, तौली गई चाँदी है।
- source_word: וַיִּפְרָץ בּוֹ
  choice: उसने उससे बहुत आग्रह किया
  rationale: यह मुहावरा किसी को स्वीकार करने के लिए जोर देकर मनाने का भाव देता है; ‘बहुत आग्रह किया’ आधुनिक हिन्दी में उस दबाव को स्पष्ट करता है।
- source_word: וַיָּצַר ... בִּשְׁנֵי חֲרִטִים
  choice: दो थैलियों में बाँधे
  rationale: क्रिया बाँधकर सुरक्षित करने और संज्ञा मूल्यवान वस्तु रखने की थैलियों को सूचित करती है।
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  choice: दो जोड़े वस्त्र
  rationale: अभिव्यक्ति बदलने के लिए पूरे वस्त्र-समूहों की ओर संकेत करती है; ‘दो जोड़े वस्त्र’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: שְׁנֵי נְעָרָיו
  choice: अपने दो सेवकों
  rationale: नַעַר का अर्थ युवक, परिचारक या सेवक हो सकता है; सामान ढोने के लिए नियुक्त अधीनस्थों के इस प्रसंग में ‘सेवक’ कार्यगत अर्थ को ठीक व्यक्त करता है।
- source_word: וַיִּשְׂאוּ לְפָנָיו
  choice: वे उसे उसके आगे-आगे लेकर चले
  rationale: मूल वाक्य का स्थान-संबंध बनाए रखा गया है। एकवचन ‘उसे’ समूचे सामान को और ‘उसके’ गिहजी को संदर्भित करता है; संभावित सर्वनामगत अस्पष्टता फुटनोट में स्पष्ट की गई है।
