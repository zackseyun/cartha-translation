translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘किक्कार’ को मूल सांस्कृतिक भार-माप के रूप में बनाए रखकर फुटनोट में समझाया गया है। सर्वनामों को अनावश्यक रूप से नामों से नहीं बदला गया, पर अंतिम वाक्य के संभावित संदर्भ को फुटनोट में स्पष्ट किया गया है।
