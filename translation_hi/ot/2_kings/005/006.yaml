  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राजकीय पत्र का औपचारिक स्वर ‘आपके’ और ‘देखिए’ से व्यक्त होता है। ‘पत्र में लिखा था’ हिन्दी में उद्धरण का स्वाभाविक परिचय है।
