base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
translation:
  language: hi
  text: वह पत्र इस्राएल के राजा के पास ले गया। पत्र में लिखा था, “अब जब यह पत्र आपके पास पहुँचे, तो देखिए, मैंने अपने सेवक नामान को आपके पास भेजा है, ताकि आप उसका चर्मरोग दूर कर दें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे उसके कोढ़ से चंगा कर दें।” इब्रानी में असामान्य अभिव्यक्ति का शाब्दिक अर्थ लगभग “उसे उसके चर्मरोग से समेट लें” है।
    reason: אָסַף के असामान्य मुहावरे और צָרַעַת के पारंपरिक अनुवाद—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיָּבֵא
  choice: वह ... ले गया
  rationale: हिफ़ील रूप में ‘पत्र’ कर्म है; ‘ले गया’ causative भाव को स्वाभाविक हिन्दी में व्यक्त करता है। कर्ता का नाम पद में नहीं है, इसलिए ‘वह’ रखा गया है।
- source_word: הַסֵּפֶר
  choice: पत्र
  rationale: दो राजाओं के बीच भेजे गए इस लिखित संदेश के लिए आधुनिक हिन्दी में ‘पत्र’ सबसे स्वाभाविक है।
- source_word: לֵאמֹר
  choice: पत्र में लिखा था
  rationale: यहाँ कथन पत्र की विषयवस्तु का परिचय देता है; हिन्दी में ‘पत्र में लिखा था’ स्पष्ट और स्वाभाविक है।
- source_word: וְעַתָּה
  choice: अब
  rationale: राजकीय संदेश के संक्रमण-सूचक भाव को बनाए रखता है; हिन्दी में आरम्भिक ‘और’ आवश्यक नहीं है।
- source_word: כְּבוֹא הַסֵּפֶר הַזֶּה אֵלֶיךָ
  choice: जब यह पत्र आपके पास पहुँचे
  rationale: כְּ के साथ infinitive construct का कालवाचक अर्थ सरल और सटीक हिन्दी में व्यक्त किया गया है।
- source_word: הִנֵּה
  choice: तो देखिए
  rationale: ध्यान आकर्षित करने वाले औपचारिक कण का भाव बनाए रखता है और राजकीय पत्र के अनुकूल है।
- source_word: שָׁלַחְתִּי
  choice: मैंने ... भेजा है
  rationale: पत्र प्राप्त होने के समय तक बनी हुई परिणति को हिन्दी पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַעֲמָן
  choice: नामान
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: राजकीय संदर्भ में עֶבֶד अधीनस्थ अधिकारी को भी सूचित कर सकता है; ‘सेवक’ पद या दासत्व को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַאֲסַפְתּוֹ
  choice: ताकि आप ... दूर कर दें
  rationale: אָסַף का मूल भाव ‘इकट्ठा करना/समेटना’ है, पर यहाँ מִן के साथ रोग हटाने का असामान्य मुहावरा है। ‘दूर कर दें’ रोग को हटाने की छवि बचाते हुए हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक असामान्यता पादटिप्पणी में दी गई है।
- source_word: מִצָּרַעְתּוֹ
  choice: उसका चर्मरोग
  rationale: צָרַעַת आधुनिक हैन्सन रोग तक सीमित नहीं है; ‘चर्मरोग’ भ्रामक चिकित्सकीय विशिष्टता से बचता है।
theological_decisions:
- issue: צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कोढ़
  rationale: इब्रानी शब्द अनेक प्रकार की त्वचा-संबंधी अवस्थाओं को समेट सकता है और आधुनिक ‘कोढ़’ से ठीक-ठीक समान नहीं है। पारंपरिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אָסַף के असामान्य रोग-संबंधी मुहावरे का अनुवाद
  choice: चर्मरोग दूर कर दें
  alternative: चंगा कर दें / शाब्दिक रूप से ‘उसे उसके चर्मरोग से समेट लें’
  rationale: मुख्य पाठ में अर्थ समझने योग्य रखते हुए ‘रोग हटाने’ का ठोस भाव बचाया गया है; पादटिप्पणी मूल अभिव्यक्ति की असामान्यता और संभावित अर्थ दोनों बताती है।
