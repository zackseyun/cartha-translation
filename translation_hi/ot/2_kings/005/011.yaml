  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
translation:
  language: hi
  text: परन्तु नामान क्रोधित होकर वहाँ से चला गया और कहने लगा, “देखो, मैंने अपने मन में कहा था, ‘वह निश्चय ही बाहर मेरे पास आएगा, खड़ा होकर अपने परमेश्वर यहोवा का नाम पुकारेगा, उस स्थान के ऊपर अपना हाथ घुमाएगा और कोढ़ से पीड़ित व्यक्ति को चंगा कर देगा।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस स्थान के ऊपर अपना हाथ घुमाकर कोढ़ को दूर कर देगा।” इब्रानी में अंतिम शब्द का शाब्दिक अर्थ ‘कोढ़ से पीड़ित व्यक्ति’ है; क्रिया का संदर्भगत भाव उसे रोग से मुक्त करना है। यहाँ “कोढ़” प्राचीन चर्मरोगों की श्रेणी को दर्शाता है; यह आवश्यक नहीं कि आधुनिक हैन्सन रोग ही हो।
    reason: मुख्य पाठ के स्वाभाविक व्यक्ति-संदर्भ को बनाए रखते हुए क्रिया के रोग-हटाने वाले वैकल्पिक अनुवाद और प्राचीन रोग-श्रेणी संबंधी सावधानी को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: क्रोधित हो गया
  rationale: קצף क्रोध को व्यक्त करता है; यह स्वाभाविक हिन्दी में प्रसंग के आरम्भिक भाव को बिना अनावश्यक तीव्रता बढ़ाए रखता है।
- source_word: וַיֵּלַךְ
  choice: वहाँ से चला गया
  rationale: הלך यहाँ एलीशा के घर से रोषपूर्वक चले जाने को सूचित करता है; ‘वहाँ से’ प्रसंग में निहित प्रस्थान को स्पष्ट करता है।
- source_word: הִנֵּה אָמַרְתִּי אֵלַי
  choice: देखो, मैंने अपने मन में कहा था
  rationale: הִנֵּה कथन पर बल देता है और אָמַרְתִּי אֵלַי का अर्थ स्वयं से कहना है; हिन्दी मुहावरे में ‘अपने मन में कहा’ स्वाभाविक है।
- source_word: יֵצֵא יָצוֹא
  choice: निश्चय ही बाहर ... आएगा
  rationale: क्रिया के साथ infinitive absolute अपेक्षा की निश्चितता पर बल देता है, जिसे ‘निश्चय ही’ व्यक्त करता है।
- source_word: וְקָרָא בְּשֵׁם יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा का नाम पुकारेगा
  rationale: קרא בשם का अर्थ नाम लेकर पुकारना अथवा आह्वान करना है; यह अनुवाद इब्रानी मुहावरे और संबंधसूचक ‘अपने परमेश्वर’ दोनों को बनाए रखता है।
- source_word: וְהֵנִיף יָדוֹ אֶל הַמָּקוֹם
  choice: उस स्थान के ऊपर अपना हाथ घुमाएगा
  rationale: הניף हाथ हिलाने या घुमाने की क्रिया बताता है; उपचार की कल्पित मुद्रा के संदर्भ में ‘ऊपर ... घुमाएगा’ स्वाभाविक है।
- source_word: וְאָסַף הַמְּצֹרָע
  choice: कोढ़ से पीड़ित व्यक्ति को चंगा कर देगा
  rationale: אסף का मूल अर्थ समेटना/हटा देना है, पर इस प्रसंग में रोग हटाकर स्वस्थ करने का भाव है। הַמְּצֹרָע व्याकरणतः ‘रोगग्रस्त व्यक्ति’ भी हो सकता है; मुख्य पाठ में व्यक्ति-संदर्भ स्वाभाविक रखा गया है और अस्पष्टता टिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: הַמְּצֹרָע का व्यक्ति अथवा रोग के रूप में बोध
  choice: कोढ़ से पीड़ित व्यक्ति
  alternative: कोढ़/चर्मरोग को दूर करना
  rationale: रूप का अर्थ ‘कोढ़ग्रस्त व्यक्ति/वस्तु’ हो सकता है और אסף इस रोग को हटाने का मुहावरा भी हो सकता है। मुख्य पाठ व्यक्ति-संदर्भ लेता है, पर पाठ की वास्तविक lexical ambiguity पादटिप्पणी में सुरक्षित है।
- issue: צרע-संबंधी शब्द के आधुनिक चिकित्सकीय अर्थ
  choice: कोढ़ से पीड़ित
  alternative: चर्मरोग से पीड़ित
  rationale: ‘कोढ़’ पारंपरिक और सामान्य हिन्दी शब्द है, पर प्राचीन צרעת को आधुनिक हैन्सन रोग के साथ पूर्णतः समान नहीं मानना चाहिए; यह सावधानी पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष वचन में नामान की दृढ़ अपेक्षा को ‘निश्चय ही’ से व्यक्त किया गया है। ‘चंगा कर देगा’ साधारण पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी इब्रानी की व्यक्ति/रोग संबंधी अस्पष्टता बताती है।
