  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
translation:
  language: hi
  text: परन्तु उसने कहा, “जीवित याहवे की शपथ, जिसके सामने मैं खड़ा रहता हूँ, मैं इसे नहीं लूँगा।” तब नामान ने उससे इसे लेने के लिए बहुत आग्रह किया, परन्तु उसने मना कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-शैली है। यह रूप आधुनिक हिन्दी में उसके गंभीर और बाध्यकारी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: जिसके सामने मैं खड़ा रहता हूँ
  rationale: यह मूल के ‘जिसके सामने मैं खड़ा हूँ/रहा हूँ’ को बनाए रखता है और परमेश्वर की उपस्थिति में भविष्यद्वक्ता की सेवा का निहित भाव बिना खुली व्याख्या के व्यक्त करता है।
- source_word: אִם אֶקָּח
  choice: मैं इसे स्वीकार नहीं करूँगा
  rationale: शपथ-वाक्य में אִם प्रबल निषेध व्यक्त करता है। सन्दर्भ में उपहार ग्रहण करने की बात है, इसलिए हिन्दी में ‘स्वीकार’ स्वाभाविक है और ‘इसे’ सन्दर्भ से पूरित है।
- source_word: וַיִּפְצַר בּוֹ
  choice: उसने उससे ... बहुत आग्रह किया
  rationale: פצר साधारण अनुरोध से अधिक, ज़ोर देकर मनाने या आग्रह करने का भाव रखता है; ‘बहुत आग्रह किया’ उसका बल स्पष्ट करता है।
- source_word: לָקַחַת
  choice: इसे स्वीकार करने का
  rationale: यहाँ वस्तु उपहार है; हिन्दी में उपहार को ‘स्वीकार करना’ अधिक स्वाभाविक है और पहले आए क्रियार्थ से संगति रखता है।
- source_word: וַיְמָאֵן
  choice: उसने इनकार कर दिया
  rationale: यह מאן के स्पष्ट अस्वीकार के भाव को सीधी, आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से रखा गया है।
- issue: אִם אֶקָּח की शपथगत अपूर्ण रचना
  choice: मैं इसे स्वीकार नहीं करूँगा
  alternative: यदि मैं इसे स्वीकार करूँ
  rationale: इब्रानी शपथ में दण्ड-वाक्य लुप्त है और אִם प्रबल निषेध का काम करता है। शाब्दिक ‘यदि’ हिन्दी में आशय अस्पष्ट कर देता, इसलिए निहित निषेध स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘खड़ा रहता हूँ’ भविष्यद्वक्ता की निरन्तर सेवकीय स्थिति का संकेत देता है; ‘स्वीकार’ उपहार के प्रसंग में ‘लेना’ से अधिक स्वाभाविक है।
