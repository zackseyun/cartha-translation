  text: וְ/צָרַ֤עַת נַֽעֲמָן֙ תִּֽדְבַּק בְּ/ךָ֔ וּֽ/בְ/זַרְעֲ/ךָ לְ/עוֹלָ֑ם וַ/יֵּצֵ֥א מִ/לְּ/פָנָ֖י/ו מְצֹרָ֥ע כַּ/שָּֽׁלֶג־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/027.yaml
  text: So Naaman’s skin disease will cling to you and to your offspring forever.” And he went out from his presence diseased[a], white as snow.
translation:
  language: hi
  text: इसलिए नामान का चर्मरोग तुझसे और तेरे वंशजों से सदा चिपका रहेगा।” तब वह उसके सामने से निकला; वह चर्मरोग से पीड़ित[a] और बर्फ के समान सफेद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “नामान का कोढ़ तुझे ... लगा रहेगा ... और वह कोढ़ी होकर, बर्फ के समान सफेद, बाहर निकला।” इब्रानी शब्द צָרַעַת और מְצֹרָע अधिक व्यापक रूप से किसी गंभीर चर्मरोग या त्वचा की दशा को दर्शाते हैं; वे आवश्यक रूप से आधुनिक कोढ़ (हैन्सन रोग) को नहीं दर्शाते।'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी शब्द कई प्रकार के गंभीर त्वचा-रोगों या दशाओं को दर्शा सकता है; इसे आधुनिक हैन्सन रोग तक सीमित करना उचित नहीं। ‘चर्मरोग’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: נַעֲמָן
  choice: नामान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: תִּדְבַּק
  choice: चिपका रहेगा
  rationale: דבק के निकटता से लगे रहने के सजीव भाव और शाप की निरंतरता को व्यक्त करता है।
- source_word: וּבְזַרְעֲךָ
  choice: और तेरे वंशजों से
  rationale: זֶרַע यहाँ भावी संतति के अर्थ में है; ‘वंशज’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: न्याय की इस घोषणा में दीर्घस्थायी, अनवरत बने रहने का भाव देता है।
- source_word: וַיֵּצֵא מִלְּפָנָיו
  choice: तब वह उसके सामने से निकला
  rationale: मूल के ठोस स्थानगत भाव को रखते हुए एलीशा की उपस्थिति से निकलने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְצֹרָע
  choice: चर्मरोग से पीड़ित
  rationale: צָרַעַת के समान शब्द-क्षेत्र को बनाए रखता है और किसी अनिश्चित आधुनिक रोग-निदान को आरोपित नहीं करता।
- source_word: כַּשָּׁלֶג
  choice: बर्फ के समान सफेद
  rationale: मूल में ‘बर्फ के समान’ है; प्रसंग में निहित सफेदी को स्पष्ट करना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: צָרַעַת / מְצֹרָע का रोग-संबंधी अर्थ
  choice: चर्मरोग / चर्मरोग से पीड़ित
  alternative: कोढ़ / कोढ़ी
  rationale: मूल शब्द आधुनिक हैन्सन रोग को अनिवार्य रूप से निर्दिष्ट नहीं करते। व्यापक शब्दावली मूल की अनिश्चितता बनाए रखती है, जबकि पारंपरिक रूप पाद-टिप्पणी में दिया गया है।
- issue: वंशगत न्याय की अवधि
  choice: तेरे वंशजों से सदा चिपका रहेगा
  alternative: तेरे वंश को लंबे समय तक लगा रहेगा
  rationale: לְעוֹלָם की प्रबल और खुली अवधि को नरम किए बिना रखा गया है; पाठ में उपस्थित धर्मवैचारिक तनाव को अनुवाद में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। शाप की प्रत्यक्षता बनाए रखने के लिए ‘तुझसे/तेरे’ का प्रयोग किया गया है। ‘चर्मरोग’ चिकित्सकीय अति-विशिष्टता से बचता है; पारंपरिक ‘कोढ़’ पाद-टिप्पणी में सुरक्षित है।
