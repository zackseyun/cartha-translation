  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: When Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
translation:
  language: hi
  text: जब परमेश्वर के जन एलीशा ने सुना कि इस्राएल के राजा ने अपने वस्त्र फाड़े हैं, तो उसने राजा के पास यह संदेश भेजा, “तुमने अपने वस्त्र क्यों फाड़े हैं? उसे मेरे पास आने दो,[a] तब वह जान लेगा कि इस्राएल में एक नबी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसे” से आशय नामान है, इस्राएल के राजा से नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने सुना
  rationale: इब्रानी कथात्मक सूत्र अगले प्रसंग को समयसूचक रूप से आरम्भ करता है। आधुनिक हिन्दी में ‘जब ... ने सुना’ स्वाभाविक है और अनावश्यक ‘अब’ नहीं जोड़ता।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी बाइबल में नबी के लिए प्रयुक्त स्थापित उपाधि है; यह केवल उसकी भक्ति नहीं, बल्कि परमेश्वर के प्रतिनिधि के रूप में उसकी भूमिका व्यक्त करती है।
- source_word: קָרַע ... אֶת בְּגָדָיו
  choice: अपने वस्त्र फाड़े हैं
  rationale: קָרַע का अर्थ ‘फाड़ना’ है। ‘वस्त्र फाड़ना’ शोक या गहरे संकट के परिचित सांस्कृतिक संकेत को सीधे बनाए रखता है।
- source_word: וַיִּשְׁלַח אֶל הַמֶּלֶךְ לֵאמֹר
  choice: राजा के पास यह संदेश भेजा
  rationale: इब्रानी में शाब्दिक रूप से ‘राजा के पास भेजा, यह कहते हुए’ है। हिन्दी में ‘यह संदेश भेजा’ उसी संप्रेषण को स्वाभाविक ढंग से व्यक्त करता है, बिना किसी संदेशवाहक को स्पष्ट रूप से जोड़ने के।
- source_word: לָמָּה קָרַעְתָּ בְּגָדֶיךָ
  choice: तुमने अपने वस्त्र क्यों फाड़े हैं?
  rationale: सीधे प्रश्न और हाल की क्रिया के वर्तमान परिणाम—दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יָבֹא נָא אֵלַי
  choice: उस व्यक्ति को मेरे पास आने दो
  rationale: क्रिया तीसरे पुरुष एकवचन में है और נָא निवेदन को कोमल बनाता है। हिन्दी में ‘आने दो’ निवेदनात्मक भाव रखता है; ‘उस व्यक्ति’ स्पष्ट करता है कि संकेत नामान की ओर है, राजा की ओर नहीं।
- source_word: וְיֵדַע
  choice: तब वह जान लेगा
  rationale: अपूर्ण क्रिया यहाँ अपेक्षित परिणाम व्यक्त करती है। ‘तब’ हिन्दी में उस परिणाम-संबंध को स्वाभाविक रूप से दिखाता है।
- source_word: כִּי יֵשׁ נָבִיא בְּיִשְׂרָאֵל
  choice: कि इस्राएल में एक नबी है
  rationale: יֵשׁ अस्तित्व का बोध कराता है; यह अनुवाद मूल कथन के बल और सरलता को बनाए रखता है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים की नबूवत-संबंधी उपाधि
  choice: परमेश्वर का जन
  alternative: परमेश्वर का मनुष्य; भक्त पुरुष
  rationale: यह वाक्यांश एलीशा की निजी धर्मपरायणता का मात्र वर्णन नहीं, बल्कि परमेश्वर के नबी और प्रतिनिधि की उपाधि है। ‘परमेश्वर का जन’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक रूप से इस भूमिका को सुरक्षित रखता है।
- issue: יָבֹא और וְיֵדַע में तीसरे पुरुष का संकेत
  choice: दोनों सर्वनामों को नामान के संदर्भ में रखा गया
  alternative: पहले को नामान और दूसरे को राजा के संदर्भ में समझना
  rationale: 'निकटतम और प्रसंगानुकूल संकेत नामान है: वही एलीशा के पास आएगा और इस्राएल में नबी होने की बात जानेगा। फिर भी मुख्य पाठ में नामान का नाम जोड़ने के बजाय ‘उस व्यक्ति/वह’ रखकर मूल की सर्वनामिक अभिव्यक्ति सुरक्षित की गई है।'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कपड़े’ की अपेक्षा ‘वस्त्र’ चुना गया क्योंकि ‘वस्त्र फाड़ना’ शोक और संकट की पारंपरिक क्रिया को संक्षेप में स्पष्ट करता है। मुख्य पाठ में प्रत्येक पादटिप्पणी-चिह्न को कोष्ठक सहित रखा गया है।
