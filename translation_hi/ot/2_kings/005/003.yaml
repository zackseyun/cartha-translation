  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
translation:
  language: hi
  text: उसने अपनी स्वामिनी से कहा, “काश, मेरे स्वामी उस नबी के सामने होते जो सामरिया में है! तब वह उन्हें उनके कोढ़[b] से छुड़ा देता[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का शाब्दिक अर्थ “इकट्ठा करना” या “समेट लेना” है; यहाँ इसका आशय रोग को दूर करके स्वस्थ कर देना है।
    reason: lexical_alternative
  - marker: b
    text: “कोढ़” हिब्रू צָרַעַת का पारंपरिक अनुवाद है; यह शब्द आधुनिक हैनसेन रोग से अधिक व्यापक प्रकार के गंभीर त्वचा-रोग को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  choice: अपनी स्वामिनी
  rationale: यह स्त्री-स्वामी या घर की उच्च पदस्थ महिला को दर्शाता है; ‘स्वामिनी’ आधुनिक हिंदी में सम्मान और सामाजिक संबंध दोनों व्यक्त करता है।
- source_word: אַחֲלֵי
  choice: काश
  rationale: यह इच्छा और लालसा प्रकट करने वाला अव्यय है; ‘काश’ हिंदी में इसके भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: लड़की नामान के लिए आदरसूचक संबोधन करती है; ‘मेरे स्वामी’ अधिकार और सम्मान दोनों को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने होते
  rationale: हिब्रू मुहावरा किसी की उपस्थिति में होने को दर्शाता है; हिंदी में यह रूप सहज है और मूल बिंब भी बनाए रखता है।
- source_word: הַנָּבִיא
  choice: उस नबी
  rationale: मूल में व्यक्ति का नाम नहीं, पदवी है; संकेतवाचक ‘उस’ हिंदी में लड़की द्वारा किसी विशिष्ट नबी की ओर संकेत को स्वाभाविक बनाता है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: स्थान-नाम का प्रचलित हिंदी रूप।
- source_word: יֶאֱסֹף
  choice: छुड़ा देता
  rationale: क्रिया का मूल अर्थ ‘इकट्ठा करना/समेट लेना’ है, पर रोग के साथ इस प्रयोग का आशय रोग को दूर कर पुनः स्वस्थ करना है। ‘छुड़ा देता’ परिणाम को स्वाभाविक हिंदी में व्यक्त करते हुए ‘से’ वाले हिब्रू संबंध को बनाए रखता है।
- source_word: מִצָּרַעְתּוֹ
  choice: उनके कोढ़ से
  rationale: ‘कोढ़’ צָרַעַת का पारंपरिक और व्यापक रूप से पहचाना जाने वाला बाइबलीय अनुवाद है; आधुनिक हैनसेन रोग से इसकी पूर्ण समानता अनिश्चित होने के कारण टिप्पणी दी गई है।
