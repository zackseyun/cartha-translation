id: 2KI.5.13
reference: 2 Kings 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּגְּשׁ֣וּ עֲבָדָי/ו֮ וַ/יְדַבְּר֣וּ אֵלָי/ו֒ וַ/יֹּאמְר֗וּ אָבִי֙ דָּבָ֣ר גָּד֗וֹל הַ/נָּבִ֛יא דִּבֶּ֥ר אֵלֶ֖י/ךָ הֲ/ל֣וֹא תַעֲשֶׂ֑ה וְ/אַ֛ף כִּֽי אָמַ֥ר אֵלֶ֖י/ךָ רְחַ֥ץ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
translation:
  language: hi
  text: तब उसके सेवक उसके पास आए और उससे बोले, “हे मेरे पिता, यदि भविष्यद्वक्ता ने आपसे कोई बड़ा काम करने को कहा होता, तो क्या आप उसे न करते? फिर जब वह आपसे कहता है, ‘धोइए और शुद्ध हो जाइए,’ तो आप यह क्यों न करें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: उसके पास आए
  rationale: क्रिया का मूल अर्थ निकट आना है; यह प्रयोग शारीरिक रूप से पास आने और आदरपूर्वक बात आरम्भ करने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: सन्दर्भ में ये नामान के अधीनस्थ परिचारक हैं; ‘सेवक’ सामाजिक अधीनता को व्यक्त करता है, पर अनावश्यक रूप से दासत्व को निश्चित नहीं करता।
- source_word: אָבִי
  choice: हे मेरे पिता
  rationale: यह शाब्दिक पितृत्व नहीं, बल्कि अधीनस्थों द्वारा वरिष्ठ के लिए प्रयुक्त आदरसूचक सम्बोधन है; मूल रूपक को बनाए रखा गया है।
- source_word: דָּבָר גָּדוֹל
  choice: कोई बड़ा काम
  rationale: वाक्यांश किसी असाधारण, कठिन या भारी माँग को सूचित करता है; ‘बड़ा काम’ हिन्दी में तुलना का आशय सहज रखता है।
- source_word: הֲלוֹא תַעֲשֶׂה
  choice: तो क्या आप उसे न करते?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा वाला आलंकारिक प्रश्न प्रस्तुत करता है; हिन्दी रूप उसी बल को बनाए रखता है।
- source_word: וְאַף כִּי
  choice: फिर ... तो आप यह क्यों न करें?
  rationale: इब्रानी मुहावरा बड़े से छोटे की ओर तर्क को और प्रबल करता है। हिन्दी में पूरा प्रश्नात्मक रूप इस ‘कितना अधिक’ वाले तर्क को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רְחַץ
  choice: धोइए
  rationale: सरल आज्ञा का आदरसूचक हिन्दी रूप है और नदी में अपने को धोने के प्रसंग के अनुकूल है।
- source_word: וּטְהָר
  choice: और शुद्ध हो जाइए
  rationale: טהר का अर्थ स्वच्छ अथवा शुद्ध अवस्था में आना हो सकता है। ‘शुद्ध हो जाइए’ रोगमुक्ति और शुद्धता, दोनों की प्रतिध्वनि रखता है।
theological_decisions:
- issue: नामान की चंगाई में טהר का अर्थ
  choice: शुद्ध हो जाइए
  alternative: स्वच्छ हो जाइए / शुद्ध किए जाइए
  rationale: यह प्रसंग चर्मरोग से चंगाई का है, जिसमें शुद्धता का भाव भी जुड़ा है। चुना हुआ रूप दोनों पहलुओं को बनाए रखता है और किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा को आरोपित नहीं करता।
- issue: וְאַף כִּי के बड़े-से-छोटे तर्क का रूप
  choice: फिर जब वह ... कहता है ... तो आप यह क्यों न करें?
  alternative: तो फिर कितना अधिक, जब उसने ... कहा है
  rationale: मूल का तर्क सुरक्षित रखते हुए स्वाभाविक आधुनिक हिन्दी अपनाई गई है; वाक्य को केवल कारणात्मक कथन में बदलकर उसकी आलंकारिक शक्ति समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण संवाद और कथात्मक गरिमा। नामान के लिए ‘आप’ तथा आदरसूचक आज्ञार्थ ‘धोइए’ रखा गया है। ‘हे मेरे पिता’ मूल के असामान्य किन्तु अर्थपूर्ण आदरसूचक रूपक को सुरक्षित रखता है।
