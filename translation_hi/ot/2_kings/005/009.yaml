  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
translation:
  language: hi
  text: तब नामान अपने घोड़ों और रथों[a] के साथ आया और एलीशा के घर के प्रवेश-द्वार पर खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपने घोड़े और अपने रथ के साथ’; यहाँ एकवचन रूपों का सामूहिक अर्थ सम्भव है, इसलिए ‘घोड़ों और रथों’ अनुवाद किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: कथात्मक क्रम में בוא यहाँ नामान के एलीशा के स्थान पर आने को बताता है; सरल और स्वाभाविक हिन्दी में ‘आया’ उपयुक्त है।
- source_word: נַעֲמָן
  choice: नामान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּסוּסוֹ
  choice: अपने घोड़ों
  rationale: रूप व्याकरणतः एकवचन है, पर इस सैन्य-प्रतिष्ठित प्रसंग में इसे सामूहिक अर्थ में समझना स्वाभाविक है; इसीलिए हिन्दी में बहुवचन रखा गया है।
- source_word: וּבְרִכְבּוֹ
  choice: और रथों
  rationale: רֶכֶב एक रथ या सामूहिक रथ-दल दोनों का बोध करा सकता है; घोड़ों के समानांतर यहाँ सामूहिक बहुवचन स्वाभाविक है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का मूल दृश्यात्मक अर्थ ‘खड़ा होना’ है; हिन्दी कथन में ‘खड़ा हो गया’ आगमन के बाद उसकी स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פֶּתַח הַבַּיִת
  choice: घर के प्रवेश-द्वार पर
  rationale: פֶּתַח घर के खुले प्रवेश-स्थान को दर्शाता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לֶאֱלִישָׁע
  choice: एलीशा के घर
  rationale: यहाँ ל घर के एलीशा से संबंध अथवा स्वामित्व को सूचित करता है; हिन्दी में संबंधकारक ‘के’ अर्थ को स्पष्ट करता है।
