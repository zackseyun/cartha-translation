base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
translation:
  language: hi
  text: उसने कहा, “सब कुशल है। मेरे स्वामी ने मुझे यह कहने के लिए भेजा है, ‘देखो, अभी-अभी एप्रैम के पहाड़ी प्रदेश से भविष्यद्वक्ताओं के समुदाय में से दो युवक मेरे पास आए हैं[a]। कृपया उन्हें चाँदी का एक किक्कार[b] और कपड़ों के दो जोड़े दे दीजिए।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भविष्यद्वक्ताओं के पुत्रों में से”; यह भविष्यद्वक्ताओं के समुदाय के सदस्यों के लिए प्रचलित अभिव्यक्ति थी।
    reason: cultural_note
  - marker: b
    text: “किक्कार” बहुमूल्य धातुओं को तौलने की एक बड़ी भार-इकाई थी।
    reason: cultural_note
