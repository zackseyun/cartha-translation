- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: गेहजी अपने सेवक-स्वामी संबंध में एलीशा का उल्लेख करता है; यह सम्मान और संबंध दोनों व्यक्त करता है।
- source_word: הִנֵּה עַתָּה זֶה
  choice: देखो, अभी-अभी
  rationale: इससे ध्यान आकर्षित करने वाला संकेत और घटना की तात्कालिकता दोनों बनी रहती हैं।
- source_word: נְעָרִים
  choice: जवान
  rationale: संदर्भ में ये भविष्यद्वक्ता-समुदाय के युवा सदस्य हैं; ‘लड़के’ या ‘सेवक’ की अपेक्षा यह कम भ्रामक है।
- source_word: מֵהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश से
  rationale: यह अभिव्यक्ति सामान्यतः किसी एक पर्वत के बजाय एप्रैम के पहाड़ी भूभाग को सूचित करती है।
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के चेलों में से
  rationale: शाब्दिक ‘भविष्यद्वक्ताओं के पुत्र’ आधुनिक हिन्दी में जैविक पुत्रों का भ्रम पैदा कर सकता है; यहाँ भविष्यद्वक्ता-समुदाय के सदस्यों का आशय है।
- source_word: תְּנָה נָּא
  choice: कृपया ... दे दीजिए
  rationale: आज्ञार्थक क्रिया के साथ נָא से व्यक्त विनम्र अनुरोध को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: כִּכַּר כֶּסֶף
  choice: एक किक्कार चाँदी
  rationale: मूल भार-माप को पारंपरिक हिन्दी बाइबलीय शब्द में सुरक्षित रखा गया है; उसका अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: חֲלִפוֹת בְּגָדִים
  choice: दो जोड़ी कपड़े
  rationale: दो बदल पहनने योग्य पूर्ण वस्त्र-समूहों का आशय सहज आधुनिक हिन्दी में व्यक्त होता है।
