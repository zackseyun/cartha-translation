  yaml_path: translation/ot/2_kings/005/025.yaml
  text: But he went in and stood before his master[a], and Elisha said to him, “Where have you been, Gehazi?” And he said[b], “Your servant did not go anywhere.”
translation:
  language: hi
  text: पर वह भीतर आया और अपने स्वामी के सामने खड़ा हो गया। तब एलीशा ने उससे पूछा, “गेहज़ी, तुम कहाँ से आ रहे हो?” उसने उत्तर दिया, “आपका सेवक कहीं नहीं गया।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוּא
  choice: पर वह
  rationale: संयोजक और सर्वनाम कथा को गेहज़ी के गुप्त कामों के बाद हल्के विरोध के साथ आगे बढ़ाते हैं; आधुनिक हिन्दी में ‘पर वह’ यह मोड़ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָא
  choice: भीतर आया
  rationale: क्रिया का मूल अर्थ ‘आया’ है; प्रसंग में गेहज़ी एलीशा की उपस्थिति में प्रवेश करता है, इसलिए ‘भीतर आया’ निहित गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  choice: अपने स्वामी के सामने खड़ा हो गया
  rationale: यह सेवक के अपने अधिकारी के सामने उपस्थित होने का भाव देता है। ‘स्वामी’ यहाँ मनुष्य एलीशा के लिए सामाजिक संबंधसूचक शब्द है, ईश्वरीय उपाधि नहीं।
- source_word: מֵאָן
  choice: तुम कहाँ से आ रहे हो?
  rationale: शाब्दिक अर्थ ‘कहाँ से?’ है। प्रसंग में हाल की गतिविधि पूछी जा रही है; हिन्दी में ‘तुम कहाँ से आ रहे हो?’ स्रोत की दिशा और प्रश्न की स्वाभाविकता दोनों बनाए रखता है।
- source_word: גֵּחֲזִי
  choice: गेहज़ी
  rationale: व्यक्तिनाम को मानक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: לֹא הָלַךְ עַבְדְּךָ
  choice: आपका सेवक कहीं नहीं गया था
  rationale: आत्म-संदर्भित आदरसूचक ‘आपका सेवक’ को सुरक्षित रखा गया है; पूर्ण हुई हाल की घटना के निषेध को हिन्दी में ‘नहीं गया था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָנֶה וָאָנָה
  choice: कहीं
  rationale: मुहावरे का अर्थ ‘इधर या उधर/कहीं भी’ है। निषेध के साथ ‘कहीं नहीं’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण है। सेवक–स्वामी संबंध और गेहज़ी की आदरसूचक आत्म-अभिव्यक्ति को बनाए रखा गया है। किसी पंथगत व्याख्या को नहीं जोड़ा गया।
