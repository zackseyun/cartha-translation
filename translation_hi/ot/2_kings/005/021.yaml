source:
  edition: WLC
  text: וַ/יִּרְדֹּ֥ף גֵּיחֲזִ֖י אַחֲרֵ֣י נַֽעֲמָ֑ן וַ/יִּרְאֶ֤ה נַֽעֲמָן֙ רָ֣ץ אַחֲרָ֔י/ו וַ/יִּפֹּ֞ל מֵ/עַ֧ל הַ/מֶּרְכָּבָ֛ה לִ/קְרָאת֖/וֹ וַ/יֹּ֥אמֶר הֲ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
translation:
  language: hi
  text: तब गेहजी नामान के पीछे दौड़ा। जब नामान ने उसे अपने पीछे दौड़ते देखा, तो वह उससे मिलने के लिए रथ से उतर गया और पूछा, “सब कुशल तो है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “क्या शांति है?” यहाँ ‘शांति’ (शालोम) कुशल-क्षेम पूछने के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: पीछे दौड़ा
  rationale: רדף का अर्थ पीछा करना है; इस प्रसंग में गेहजी सचमुच दौड़ रहा था, इसलिए ‘पीछे दौड़ा’ स्वाभाविक है और शत्रुतापूर्ण पीछा करने का अनावश्यक भाव नहीं जोड़ता।
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  choice: उसे अपने पीछे दौड़ते देखा
  rationale: यह इब्रानी की संक्षिप्त दृष्टि-क्रिया और जारी दौड़ने की क्रिया, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  choice: रथ से उतर गया
  rationale: यद्यपि נפל का मूल अर्थ ‘गिरना’ है, वाहन से उतरने के प्रसंग में यह जानबूझकर, सम्भवतः शीघ्रता से उतरने का मुहावरा है; ‘उतर गया’ आकस्मिक गिरने का गलत संकेत नहीं देता।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने के लिए
  rationale: לקראת किसी की ओर जाकर उससे मिलने को व्यक्त करता है; यह अर्थ हिन्दी में सहज रूप से आता है।
- source_word: הֲשָׁלוֹם
  choice: सब कुशल तो है?
  rationale: שלום यहाँ शांति का सिद्धान्तगत कथन नहीं, बल्कि स्थिति या कुशल-क्षेम पूछने का प्रचलित संक्षिप्त प्रश्न है। ‘सब कुशल तो है?’ आधुनिक हिन्दी में उसी प्रयोजन को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथानक को आगे बढ़ाता है; ‘तब’ हिन्दी में क्रम को सहज रूप से दर्शाता है।
