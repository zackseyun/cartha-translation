reference: 2 Kings 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
translation:
  language: hi
  text: तब नामान ने कहा, “यदि नहीं, तो कृपया आपके सेवक को उतनी मिट्टी दे दी जाए जितनी दो खच्चर ढो सकें[a], क्योंकि अब आपका सेवक यहोवा[b] को छोड़ किसी और देवता को न तो होमबलि चढ़ाएगा, न बलिदान[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दो खच्चरों के भार जितनी मिट्टी।” आशय उतनी मिट्टी से है जितनी खच्चरों की एक जोड़ी ढो सकती थी।
    reason: lexical_alternative
  - marker: b
    text: “यहोवा” इब्रानी नाम יהוה (YHWH) का हिन्दी रूप है; इसका प्रतिलेखन “याहवे” भी किया जाता है।
    reason: alternative_reading
  - marker: c
    text: नामान ने इस्राएल की मिट्टी क्यों माँगी, यह पाठ स्पष्ट नहीं करता। यह किसी देवता को किसी विशेष भूमि से जोड़ने की प्राचीन धारणा को दिखा सकता है, या इस्राएली मिट्टी पर यहोवा की आराधना करने की उसकी इच्छा को।
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  choice: यदि नहीं
  rationale: पिछले पद में एलीशा द्वारा भेंट अस्वीकार किए जाने के उत्तर में यह विनम्र, शर्तसूचक और कुछ अंश तक लुप्त कथन है; ‘यदि नहीं’ उस प्रसंगगत अर्थ को बनाए रखता है।
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  choice: कृपया आपके सेवक को ... दे दी जाए
  rationale: निष्क्रिय क्रियारूप और נָא की विनम्रता दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  choice: उतनी मिट्टी ... जितनी दो खच्चर ढो सकें
  rationale: वाक्यांश का आशय दो खच्चरों द्वारा ढोई जा सकने वाली मिट्टी की मात्रा है; यह हिन्दी में स्पष्ट और सहज है, जबकि मूल का भार-संबंध भी बना रहता है।
- source_word: עֹלָה וָזֶבַח
  choice: होमबलि ... बलिदान
  rationale: עֹלָה के लिए प्रचलित और विशिष्ट ‘होमबलि’ तथा זֶבַח के लिए व्यापक ‘बलिदान’ चुना गया है।
- source_word: לֵאלֹהִים אֲחֵרִים כִּי אִם לַיהוָה
  choice: यहोवा को छोड़ किसी और देवता को
  rationale: כִּי אִם की अपवादात्मक विशिष्टता को स्वाभाविक हिन्दी में व्यक्त करता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
theological_decisions:
- issue: יהוה का प्रतिलेखन
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिवाचक रूप ‘यहोवा’ से वाचा-नाम को सामान्य पदवी ‘प्रभु’ में बदले बिना सुरक्षित रखा गया है; वैकल्पिक प्रतिलेखन पादटिप्पणी में दिया गया है।
- issue: नामान द्वारा इस्राएली मिट्टी माँगने का कारण
  choice: मुख्य पाठ में कारण की व्याख्या नहीं की गई
  alternative: इसे भूमि से देवता के प्राचीन संबंध या इस्राएली मिट्टी पर वेदी बनाने की इच्छा के रूप में स्पष्ट करना
  rationale: मूल पाठ मिट्टी की माँग को केवल यहोवा की आराधना से जोड़ता है, पर नामान की धारणा या उद्देश्य स्पष्ट नहीं करता; इसलिए संभावनाएँ पादटिप्पणी तक सीमित रखी गई हैं।
- issue: बलिदान की विशिष्टता
  choice: ‘यहोवा को छोड़ किसी और देवता को न तो ... न ...’
  alternative: ‘केवल यहोवा को’
  rationale: दोनों अर्थतः उचित हैं; चुना हुआ रूप मूल के निषेध और अपवाद को हिन्दी में स्पष्ट रखते हुए होमबलि और बलिदान दोनों पर लागू करता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नामान का आत्मविनम्र संबोधन ‘आपका सेवक’ और अनुरोध का निष्क्रिय, विनीत स्वर सुरक्षित है। ‘खच्चरों की एक जोड़ी’ के बजाय मुख्य पाठ में ‘दो खच्चर’ सहजता के लिए है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
