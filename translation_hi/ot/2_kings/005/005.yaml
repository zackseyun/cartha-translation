base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
translation:
  language: hi
  text: तब अराम के राजा ने कहा, “जाओ, और मैं इस्राएल के राजा के पास एक पत्र भेजूँगा।” तब वह गया और अपने साथ चाँदी के दस किक्कार, सोने के छह हज़ार सिक्के[a] और दस जोड़े वस्त्र ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘छह हज़ार सोना’ है; गिनी गई इकाई स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶךְ בֹּא
  choice: जाओ
  rationale: दो आज्ञार्थक क्रियाओं का यह संयोग प्रस्थान की तत्पर अनुमति अथवा प्रोत्साहन व्यक्त करता है। हिन्दी में केवल ‘जाओ’ स्वाभाविक है; ‘जाओ, आओ’ मूल अर्थ को भ्रामक बना सकता है।
- source_word: סֵפֶר
  choice: एक पत्र
  rationale: दो राजाओं के बीच इस राजनयिक प्रसंग में इसका अर्थ लिखित संदेश अर्थात पत्र है।
- source_word: בְּיָדוֹ
  choice: अपने साथ
  rationale: शाब्दिक अर्थ ‘अपने हाथ में’ है, पर यहाँ यह अपने अधिकार में रखकर साथ ले जाने का मुहावरा है; इतनी बड़ी मात्रा के लिए ‘अपने साथ’ स्वाभाविक हिन्दी है।
- source_word: כִּכְּרֵי כֶסֶף
  choice: चाँदी के दस किक्कार
  rationale: किक्कार प्राचीन भार-माप है। अनुमानित आधुनिक रूपांतरण से बचते हुए पारंपरिक बाइबलीय इकाई रखी गई है।
- source_word: שֵׁשֶׁת אֲלָפִים זָהָב
  choice: सोने के छः हज़ार सिक्के
  rationale: इब्रानी में केवल ‘छः हज़ार सोना’ है और गिनी जाने वाली इकाई स्पष्ट नहीं है। सहज हिन्दी के लिए ‘सिक्के’ जोड़ा गया है, पर इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: दस जोड़ी वस्त्र
  rationale: यह वाक्यांश बदलकर पहनने योग्य वस्त्रों के दस पूर्ण सेट दर्शाता है; ‘जोड़ी वस्त्र’ आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम के राजा
  rationale: मूल इब्रानी स्थान-नाम अराम को रखा गया है, न कि बाद का भौगोलिक नाम सीरिया।
