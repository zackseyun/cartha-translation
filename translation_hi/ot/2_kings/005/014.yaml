base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
translation:
  language: hi
  text: तब वह नीचे गया और उसने परमेश्वर के जन के वचन के अनुसार यरदन में सात बार डुबकी लगाई[a], और उसका शरीर फिर एक छोटे बालक के शरीर के समान हो गया, और वह शुद्ध हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को डुबोया।” इब्रानी क्रिया का अर्थ डुबकी लगाना या अपने आप को जल में डुबोना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: तब वह नीचे गया
  rationale: क्रियाओं की कथात्मक शृंखला को स्वाभाविक हिन्दी में आगे बढ़ाता है और ירד की नीचे जाने की ठोस गति को बनाए रखता है।
- source_word: וַיִּטְבֹּל
  choice: डुबकी लगाई
  rationale: טבל का अर्थ डुबाना या डुबकी लगाना हो सकता है। यहाँ कर्ता स्वयं नदी में यह क्रिया करता है; हिन्दी में ‘डुबकी लगाई’ स्वाभाविक है और क्रिया की रीति को अनावश्यक रूप से अधिक निश्चित नहीं करती।
- source_word: בַּיַּרְדֵּן
  choice: यरदन में
  rationale: नदी के पारंपरिक हिन्दी नाम को रखते हुए पूर्वसर्ग नदी के भीतर की गई क्रिया को स्पष्ट करता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: दोहराई गई क्रिया की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: כִּדְבַר
  choice: के वचन के अनुसार
  rationale: דבר के ‘वचन’ और निर्देश—दोनों भावों को रखता है, बिना इसे केवल ‘आज्ञा’ तक सीमित किए।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी बाइबल में भविष्यद्वक्ता के लिए प्रयुक्त विशिष्ट उपाधि है; इसका स्थापित हिन्दी रूप धार्मिक और कथात्मक भार बनाए रखता है।
- source_word: וַיָּשָׁב בְּשָׂרוֹ
  choice: उसका शरीर ... फिर हो गया
  rationale: שוב के लौटने या पूर्व दशा में आने के भाव को ‘फिर हो गया’ व्यक्त करता है। בשר को यहाँ स्वाभाविक हिन्दी में ‘शरीर’ कहा गया है।
- source_word: כִּבְשַׂר נַעַר קָטֹן
  choice: एक छोटे बालक के शरीर जैसा
  rationale: נער קטן की कम आयु और तुलना की सजीवता दोनों सुरक्षित रहती हैं; בשר की पुनरावृत्ति ‘शरीर’ से भी बनी रहती है।
- source_word: וַיִּטְהָר
  choice: वह शुद्ध हो गया
  rationale: क्रिया के परिणामी भाव—अशुद्धता से शुद्ध अवस्था में आने—को व्यक्त करता है और शारीरिक चंगाई तथा शुद्धता के आयामों को एक-दूसरे में नहीं मिलाता।
theological_decisions:
- issue: नामान की बहाली का स्वरूप
  choice: शारीरिक बहाली और शुद्ध हो जाने—दोनों को अलग-अलग कथनों में बनाए रखा गया है।
  alternative: केवल ‘वह चंगा हो गया’ कहकर पूरे परिणाम को चिकित्सकीय भाषा में समेटना।
  rationale: मूल पाठ पहले शरीर के लौट आने का वर्णन करता है और फिर טהר से शुद्ध होने का; अनुवाद दोनों आयामों को सुरक्षित रखता है और कोई संस्कारवादी या प्रतीकात्मक व्याख्या नहीं जोड़ता।
- issue: וַיִּטְהָר का परिणामी पक्ष
  choice: वह शुद्ध हो गया
  alternative: वह शुद्ध था / उसे शुद्ध किया गया
  rationale: इब्रानी रूप को अवस्था-परिवर्तन या शुद्धता के प्राप्त परिणाम के रूप में समझा जा सकता है। ‘शुद्ध हो गया’ कर्ता या साधन के बारे में अनावश्यक दावा किए बिना परिणाम को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक ढंग अपनाया गया है। ‘परमेश्वर का जन’ पारंपरिक बाइबिलीय उपाधि के रूप में रखा गया है; शेष वाक्यरचना सामान्य पाठक के लिए सहज बनाई गई है।
