base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
translation:
  language: hi
  text: अरामियों के छापामार दल निकले थे और इस्राएल देश से एक छोटी-सी लड़की[a] को बंदी बनाकर ले गए थे। वह नामान की पत्नी की सेवा में रहती थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक कम उम्र की लड़की।” इब्रानी पदबंध उसके कम उम्र और छोटेपन पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह नामान की पत्नी के सामने रहती थी,” अर्थात् वह उसकी परिचारिका बनकर सेवा करती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרָם ... גְדוּדִים
  choice: अराम के छापामार दल
  rationale: अराम स्थान का नाम है, पर बहुवचन क्रिया मानव सैन्य दलों को सूचित करती है। גְדוּדִים छोटे सैन्य अथवा छापामार दलों को दर्शाता है; इसलिए यह अनुवाद कर्ता और गतिविधि दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יָצְאוּ
  choice: निकले थे
  rationale: यह पूर्ववर्ती पृष्ठभूमि की कार्रवाई है, जिसके बाद लड़की को बंदी बनाए जाने का वर्णन आता है।
- source_word: וַיִּשְׁבּוּ
  choice: बंदी बनाकर ले आए थे
  rationale: क्रिया का अर्थ केवल पकड़ना नहीं, बल्कि किसी को बंदी बनाकर ले जाना है। हिन्दी में संयुक्त पदबंध इस आशय को स्पष्ट करता है।
- source_word: מֵאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश से
  rationale: מֵאֶרֶץ में भौगोलिक भूमि अथवा देश का भाव स्पष्ट है; ‘इस्राएल देश’ मूल अभिव्यक्ति के निकट और सहज है।
- source_word: נַעֲרָה קְטַנָּה
  choice: एक छोटी-सी लड़की
  rationale: दोनों शब्द उसके लड़की होने और कम उम्र अथवा छोटेपन पर बल देते हैं। ‘छोटी-सी’ आधुनिक हिन्दी में इस बल को सहजता से व्यक्त करता है।
- source_word: וַתְּהִי לִפְנֵי
  choice: सेवा में रहती थी
  rationale: शाब्दिक अर्थ ‘के सामने रहती थी’ है, पर इस प्रसंग में यह किसी की उपस्थिति में रहकर उसकी सेवा करने का मुहावरा है। ‘सेवा में रहती थी’ कार्यगत अर्थ और रहने की निरंतर स्थिति दोनों को रखता है।
- source_word: אֵשֶׁת נַעֲמָן
  choice: नामान की पत्नी
  rationale: यह इब्रानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप है।
