  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
translation:
  language: hi
  text: जब इस्राएल के राजा ने पत्र पढ़ा, तो उसने अपने वस्त्र फाड़े और कहा, “क्या मैं परमेश्वर हूँ कि मार डालूँ और जीवित करूँ? यह मेरे पास एक मनुष्य को उसके कुष्ठ रोग[a] से चंगा करने के लिए भेजता है! तुम ज़रा ध्यान दो और देखो कि वह मुझसे झगड़ा करने का बहाना ढूँढ़ रहा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द किसी गंभीर चर्मरोग को भी सूचित कर सकता है; यह आवश्यक नहीं कि वह विशेष रूप से आधुनिक हैन्सेन रोग ही हो।
    reason: lexical_alternative
  - marker: b
    text: या “वह मेरे विरुद्ध कोई अवसर ढूँढ़ रहा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  choice: पत्र
  rationale: पिछले प्रसंग में यह अराम के राजा द्वारा भेजा गया लिखित संदेश है; इसलिए आधुनिक हिन्दी में ‘पत्र’ सबसे स्वाभाविक है।
- source_word: וַיִּקְרַע בְּגָדָיו
  choice: उसने अपने वस्त्र फाड़े
  rationale: यह गहरे संकट और व्याकुलता प्रकट करने वाली प्राचीन क्रिया है; ‘वस्त्र फाड़े’ मूल बिंब और गरिमा बनाए रखता है।
- source_word: הַאֱלֹהִים אָנִי
  choice: क्या मैं परमेश्वर हूँ
  rationale: राजा जीवन और मृत्यु पर परमेश्वर के विशिष्ट अधिकार की ओर संकेत करता है; निश्चित रूप ‘परमेश्वर’ प्रसंग के अनुकूल है।
- source_word: לְהָמִית וּלְהַחֲיוֹת
  choice: मार डालूँ और जीवित करूँ
  rationale: यह मूल के संतुलित विरोधी युग्म को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שֹׁלֵחַ אֵלַי
  choice: मेरे पास यह संदेश ... भेज रहा है
  rationale: पत्र का उल्लेख पहले हो चुका है; हिन्दी में संवादात्मक आशय को स्पष्ट करने के लिए ‘संदेश भेजना’ स्वाभाविक है।
- source_word: לֶאֱסֹף אִישׁ מִצָּרַעְתּוֹ
  choice: एक मनुष्य को उसके कुष्ठ रोग से चंगा करूँ
  rationale: यहाँ אָסַף रोग की दशा से मुक्त करने के अर्थ में प्रयुक्त है; ‘चंगा करूँ’ मुहावरे का आशय स्पष्ट करता है।
- source_word: צָּרַעַת
  choice: कुष्ठ रोग
  rationale: यह प्रचलित बाइबलीय पद है, पर इब्रानी शब्द आधुनिक हैन्सेन रोग से अधिक व्यापक चर्मरोगों को भी सूचित कर सकता है; इसलिए पादटिप्पणी दी गई है।
- source_word: דְּעוּ נָא וּרְאוּ
  choice: तुम ज़रा ध्यान दो और देखो
  rationale: यह बहुवचन आग्रह दोनों आज्ञार्थक क्रियाओं—जानने/ध्यान देने और देखने—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִתְאַנֶּה ... לִי
  choice: मुझसे झगड़ा करने का बहाना ढूँढ़ रहा है
  rationale: यह विरोधी पक्ष द्वारा टकराव का अवसर या आधार खोजने की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: הָאֱלֹהִים का निश्चित या अनिश्चित अर्थ
  choice: परमेश्वर
  alternative: कोई देवता
  rationale: इस्राएली कथा-संदर्भ में जीवन लेने और देने का अधिकार एकमात्र परमेश्वर का माना गया है; फिर भी वाक्य को राजा के आलंकारिक प्रश्न के रूप में ही रखा गया है।
- issue: צָּרַעַת की चिकित्सीय पहचान
  choice: कुष्ठ रोग
  alternative: गंभीर चर्मरोग
  rationale: परंपरागत और कथा में पहचाने जाने योग्य पद मुख्य पाठ में रखा गया है, जबकि मूल शब्द की व्यापक और अनिश्चित चिकित्सीय सीमा पादटिप्पणी में सुरक्षित है।
- issue: מִתְאַנֶּה का आशय
  choice: झगड़ा करने का बहाना ढूँढ़ना
  alternative: मेरे विरुद्ध अवसर ढूँढ़ना
  rationale: क्रिया में शत्रुतापूर्ण अवसर या बहाना खोजने का भाव है; मुख्य पाठ उस आशय को स्पष्ट करता है, बिना किसी विशिष्ट राजनीतिक मंशा को निर्णायक बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वस्त्र फाड़े’ जैसे स्थापित बाइबलीय मुहावरे को बनाए रखते हुए कठिन इब्रानी पदों का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है। पादटिप्पणी-चिह्न उनके वास्तविक विषय—रोग और शत्रुतापूर्ण अवसर—के तुरंत बाद रखे गए हैं।
