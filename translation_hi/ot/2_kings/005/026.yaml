base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/026.yaml
  text: But he said to him[a], “Did not my heart go when the man turned from his chariot to meet you? Is this the time to take silver, and to take garments, and olive orchards and vineyards, and sheep and cattle[b], and male servants and female servants?”
translation:
  language: hi
  text: पर उसने उससे कहा, “जब वह आदमी अपने रथ से मुड़कर तुझसे मिलने आया, तब क्या मेरा मन[a] नहीं गया था? क्या यह चाँदी, वस्त्र, जैतून के बाग, दाख की बारियाँ, भेड़-बकरियाँ, गाय-बैल, दास और दासियाँ[b] लेने का समय है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “जब वह आदमी अपने रथ से मुड़कर तुझसे मिलने आया, तब क्या मैं आत्मा में वहाँ उपस्थित नहीं था?”
    reason: lexical_alternative
  - marker: b
    text: या “सेवक-सेविकाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי הָלַךְ
  choice: मेरा मन तेरे साथ नहीं गया था
  rationale: इब्रानी मुहावरे ‘मेरा हृदय गया’ को हिन्दी में बोधगम्य बनाते हुए एलीशा की आंतरिक जानकारी अथवा उपस्थिति का भाव रखा गया है। ‘मन’ आधुनिक हिन्दी में इस मुहावरे के लिए ‘हृदय’ से अधिक स्वाभाविक है; ‘तेरे साथ’ प्रसंग में निहित दिशा को स्पष्ट करता है। अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: כַּאֲשֶׁר הָפַךְ אִישׁ מֵעַל מֶרְכַּבְתּוֹ לִקְרָאתֶךָ
  choice: जब वह आदमी अपने रथ से मुड़कर तुझसे मिलने आया
  rationale: הָפַךְ का मूल भाव ‘मुड़ना’ सुरक्षित है। ‘वह आदमी’ प्रसंग में विशिष्ट व्यक्ति को सूचित करता है, पर मूल में नाम न होने के कारण नामान का नाम नहीं जोड़ा गया।
- source_word: הָעֵת
  choice: क्या यह ... समय है?
  rationale: मूल में प्रश्नवाचक अव्यय न होने पर भी प्रसंग और वाक्य-विन्यास धिक्कारपूर्ण प्रश्न का संकेत देते हैं; हिन्दी में इसे स्पष्ट प्रश्न के रूप में रखना स्वाभाविक है।
- source_word: לָקַחַת אֶת־הַכֶּסֶף
  choice: चाँदी ... लेने
  rationale: כֶּסֶף का ठोस अर्थ ‘चाँदी’ रखा गया है, जो यहाँ धन अथवा भुगतान के रूप में भी समझा जा सकता है।
- source_word: בְּגָדִים
  choice: वस्त्र
  rationale: ‘वस्त्र’ आधुनिक, गरिमापूर्ण और सूची के स्तर के अनुरूप हिन्दी है।
- source_word: זֵיתִים
  choice: जैतून के बाग
  rationale: दाख की बारियों और अन्य संपत्ति के साथ सूचीबद्ध होने से यहाँ फल की अपेक्षा जैतून की उत्पादक भूमि अथवा वृक्ष-समूह अभिप्रेत है।
- source_word: כְרָמִים
  choice: दाख की बारियाँ
  rationale: यह अंगूर की खेती वाली भूमि के लिए स्वाभाविक हिन्दी पद है और कृषि-संपत्ति का भाव बनाए रखता है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: दोनों सामूहिक इब्रानी पशु-श्रेणियों को हिन्दी के प्रचलित युग्मों से व्यक्त किया गया है; इससे छोटे और बड़े पालतू पशुओं का भेद स्पष्ट रहता है।
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: दास-दासियाँ
  rationale: लिंग-भेद और अधीन सामाजिक स्थिति दोनों को संक्षिप्त तथा ऐतिहासिक रूप से उपयुक्त हिन्दी में सुरक्षित रखा गया है। व्यापक ‘सेवक-सेविकाएँ’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: לִבִּי הָלַךְ में एलीशा की अलौकिक जानकारी अथवा आत्मिक उपस्थिति
  choice: मेरा मन तेरे साथ नहीं गया था
  alternative: क्या मैं आत्मा में वहाँ उपस्थित नहीं था
  rationale: मुख्य पाठ मूल के देह-अंग संबंधी मुहावरे और उसकी अस्पष्टता को यथासंभव रखता है; अधिक व्याख्यात्मक रूप को मुख्य पाठ में रखकर किसी निश्चित कार्यविधि को आरोपित नहीं किया गया।
- issue: עֲבָדִים וּשְׁפָחוֹת की सामाजिक स्थिति
  choice: दास-दासियाँ
  alternative: सेवक-सेविकाएँ
  rationale: यह सूची अर्जित संपत्ति और घराने के आश्रितों के संदर्भ में है। ‘दास-दासियाँ’ बंधी हुई सेवा की ऐतिहासिक संभावना और मूल के लिंगयुक्त युग्म को स्पष्ट रखता है, जबकि व्यापक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक स्तर रखा गया है। गुरु द्वारा अपने सेवक को संबोधन होने के कारण एकवचन ‘तू’ के रूप ‘तुझसे/तेरे’ प्रयुक्त हैं; इन्हें अपमानसूचक बोलचाल नहीं, बल्कि प्राचीन संबंध और प्रत्यक्ष फटकार के रूप में समझना चाहिए। कृषि और पशुधन की सूची के लिए सामान्य भारतीय बाइबलीय शब्दावली अपनाई गई है।
