lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब वह भीतर गया
  rationale: בוא का अर्थ संदर्भ के अनुसार आना, जाना या प्रवेश करना हो सकता है। अपने स्वामी को सूचना देने के प्रसंग में ‘भीतर गया’ स्वाभाविक रूप से प्रवेश का भाव व्यक्त करता है; וַ־ को कथा-क्रम में ‘तब’ से दर्शाया गया है।
- source_word: וַיַּגֵּד לַאדֹנָיו
  choice: और अपने स्वामी को बताया
  rationale: Hiphil נגד का अर्थ बताना या सूचना देना है। אָדוֹן यहाँ नामान के अधिकारी/स्वामी के लिए है, इसलिए ‘स्वामी’ सम्मान और संबंध दोनों को बनाए रखता है।
- source_word: כָּזֹאת וְכָזֹאת
  choice: ऐसा-ऐसा
  rationale: यह इब्रानी मुहावरा कही गई बात को शब्दशः दोहराए बिना उसका सार प्रस्तुत करता है। ‘ऐसा-ऐसा’ आधुनिक हिन्दी में इस संक्षिप्त उद्धरण-भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּבְּרָה הַנַּעֲרָה
  choice: उस लड़की ने ... कहा है
  rationale: נַעֲרָה का सीधा अर्थ लड़की/युवती है; यद्यपि संदर्भ में वह दासी है, इस पद में शब्द स्वयं दासी नहीं कहता। हिन्दी के प्रत्यक्ष कथन में पूर्ण हुई सूचना के लिए ‘कहा है’ स्वाभाविक है।
- source_word: אֲשֶׁר מֵאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश की उस लड़की
  rationale: इब्रानी संबंधवाचक उपवाक्य का अर्थ सुरक्षित रखते हुए हिन्दी में विशेषणात्मक रचना अधिक स्वाभाविक है। אֶרֶץ के देश/भूमि भाव को ‘देश’ से स्पष्ट किया गया है।
