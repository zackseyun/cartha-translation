id: 2KI.5.10
reference: 2 Kings 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
translation:
  language: hi
  text: तब एलीशा ने उसके पास एक संदेशवाहक भेजकर कहलाया, “जाकर यरदन नदी में सात बार स्नान कर। तब तेरा शरीर फिर पहले जैसा हो जाएगा[a], और तू शुद्ध हो जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तेरा मांस तेरे पास लौट आएगा।” यह इब्रानी मुहावरा शरीर के फिर पहले जैसी स्वस्थ दशा में आ जाने को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “तू निर्मल हो जाएगा” भी किया जा सकता है। मूल क्रिया शारीरिक रोगमुक्ति के साथ शुद्धता का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֵלָיו
  choice: उसके पास ... भेजकर
  rationale: यह वाक्यांश नामान की ओर संदेशवाहक भेजने की दिशा स्पष्ट करता है और हिंदी कथात्मक शैली में स्वाभाविक है।
- source_word: מַלְאָךְ
  choice: संदेशवाहक
  rationale: इस मानवीय कथानक में यह स्वर्गदूत नहीं, एलीशा का संदेश पहुँचाने वाला व्यक्ति है; इसलिए ‘संदेशवाहक’ अर्थ को स्पष्ट रखता है।
- source_word: לֵאמֹר
  choice: कहलाया
  rationale: इब्रानी के कथन-परिचायक सूत्र को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָלוֹךְ וְרָחַצְתָּ
  choice: जाकर ... स्नान कर
  rationale: आज्ञार्थक बल और क्रियाओं का क्रम सुरक्षित रहता है; ‘स्नान कर’ स्वयं को पानी में धोने के प्रसंग में सहज है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: मूल संख्या का सीधा और स्पष्ट अनुवाद।
- source_word: בַּיַּרְדֵּן
  choice: यरदन नदी में
  rationale: ‘यरदन’ मूल स्थान-नाम है; हिंदी पाठक के लिए ‘नदी’ जोड़ने से संदर्भ तुरंत स्पष्ट होता है, बिना अर्थ बदले।
- source_word: וְיָשֹׁב בְּשָׂרְךָ לְךָ
  choice: तेरा शरीर फिर पहले जैसा हो जाएगा
  rationale: शाब्दिक ‘तेरा मांस तेरे पास लौट आएगा’ हिंदी में अस्वाभाविक है। चुना हुआ रूप पूर्व स्वस्थ दशा की बहाली का इब्रानी मुहावरेदार अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וּטְהָר
  choice: तू शुद्ध हो जाएगा
  rationale: ‘शुद्ध’ शारीरिक रोगमुक्ति और शुद्धता—दोनों संभावित अर्थ-छायाओं को बनाए रखता है; केवल ‘स्वस्थ’ कहना शुद्धता की ध्वनि मिटा देता।
theological_decisions:
- issue: בְּשָׂרְךָ को ‘मांस’ या स्वाभाविक हिंदी में ‘शरीर’ कहना
  choice: शरीर
  alternative: मांस
  rationale: मुख्य पाठ में ‘शरीर फिर पहले जैसा हो जाएगा’ बहाली के मुहावरेदार आशय को स्पष्ट और स्वाभाविक रूप से देता है। ‘मांस’ की ठोस मूल छवि पादटिप्पणी में सुरक्षित है।
- issue: טהר को केवल शारीरिक स्वच्छता या व्यापक शुद्धता के रूप में व्यक्त करना
  choice: तू शुद्ध हो जाएगा
  alternative: तू साफ़ हो जाएगा / तुझे शुद्ध किया जाएगा
  rationale: यह क्रिया रोग से मुक्त होकर शुद्ध होने का परिणाम बताती है और शारीरिक तथा धार्मिक शुद्धता के बीच मूल तनाव को अनावश्यक रूप से नहीं सुलझाती।
translation_notes:
  register: आधुनिक मानक हिंदी, संबोधन के प्रसंग के अनुरूप एकवचन ‘तू/तेरा’ और सीधी आज्ञार्थक शैली। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है।
