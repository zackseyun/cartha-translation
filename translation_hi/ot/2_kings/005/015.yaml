base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
translation:
  language: hi
  text: तब वह अपने पूरे दल के साथ परमेश्वर के जन के पास लौट आया। वह आकर उसके सामने खड़ा हुआ और बोला, “देखिए, अब मैं जान गया हूँ कि इस्राएल को छोड़ सारी पृथ्वी पर कहीं कोई परमेश्वर नहीं है। और अब, कृपया अपने सेवक की यह भेंट[a] स्वीकार कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘आशीष’ है; यहाँ इब्रानी शब्द का आशय भेंट या उपहार से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी में नबी अथवा परमेश्वर के प्रतिनिधि की प्रचलित उपाधि है। ‘परमेश्वर का जन’ मूल मुहावरे और कथा की साहित्यिक प्रतिध्वनि को बनाए रखता है।
- source_word: מַחֲנֵהוּ
  choice: अपने पूरे दल के साथ
  rationale: शाब्दिक अर्थ ‘उसकी छावनी’ है, पर यहाँ आशय नामान के साथ आए लोगों के समूह से है; ‘पूरा दल’ आधुनिक हिन्दी में स्वाभाविक सामूहिक अर्थ देता है।
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: उसके सामने खड़ा हुआ
  rationale: यह किसी की उपस्थिति में आकर खड़े होने की पारंपरिक अभिव्यक्ति है और हिन्दी में मूल रूप को स्पष्टता से बनाए रखती है।
- source_word: הִנֵּה נָא יָדַעְתִּי
  choice: अब मैं जान गया हूँ
  rationale: הִנֵּה נָא ध्यान और जोर प्रकट करता है, जबकि पूर्ण क्रिया יָדַעְתִּי नई अनुभूति से उत्पन्न वर्तमान ज्ञान बताती है। संयुक्त अनुवाद हिन्दी में स्वाभाविक रूप से दोनों भाव व्यक्त करता है।
- source_word: אֵין אֱלֹהִים בְּכָל הָאָרֶץ כִּי אִם בְּיִשְׂרָאֵל
  choice: इस्राएल को छोड़ सारी पृथ्वी पर कहीं कोई परमेश्वर नहीं है
  rationale: यह मूल के प्रबल निषेध और ‘इस्राएल में’ स्थित अपवाद को बिना ‘इस्राएल के परमेश्वर’ जैसे अतिरिक्त शब्द जोड़े सुरक्षित रखता है। ‘पृथ्वी’ इस व्यापक दावे के अनुरूप है।
- source_word: קַח נָא
  choice: कृपया ... स्वीकार कीजिए
  rationale: शाब्दिक ‘कृपया ले’ यहाँ भेंट ग्रहण करने का अनुरोध है; आदरसूचक ‘स्वीकार कीजिए’ प्रसंग और सामाजिक संबोधन के अनुकूल है।
- source_word: בְרָכָה
  choice: भेंट
  rationale: मूल शब्द का शाब्दिक अर्थ ‘आशीष’ है, लेकिन उपहार देने के प्रसंग में यह भेंट अथवा उपहार को सूचित करता है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: यहाँ शब्द अधीनता की विनम्र आत्म-संज्ञा है, दासत्व की कानूनी स्थिति पर जोर नहीं; इसलिए ‘सेवक’ उचित है।
theological_decisions:
- issue: नामान की स्वीकारोक्ति कि इस्राएल को छोड़ कहीं कोई परमेश्वर नहीं है
  choice: इसे इस्राएल के परमेश्वर की अद्वितीयता की सीधी और प्रबल स्वीकारोक्ति के रूप में रखा गया है।
  alternative: ‘इस्राएल के परमेश्वर को छोड़ कोई परमेश्वर नहीं’ कहकर वाक्य का विस्तार करना, अथवा ‘कोई देवता नहीं’ कहना।
  rationale: इब्रानी पाठ का दावा स्पष्ट और अनन्य है, पर उसका शब्द-विन्यास ‘इस्राएल में’ को सुरक्षित रखना चाहिए। अनुवाद न तो दावे को नरम करता है, न उसे व्यवस्थित धर्मवैज्ञानिक व्याख्या से विस्तृत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज कथात्मक शैली अपनाई गई है। नामान के विनम्र संबोधन के लिए ‘कीजिए’ और ‘अपने सेवक’ रखा गया है।
