  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
translation:
  language: hi
  text: परन्तु येहू ने पूरे मन से यहोवा, इस्राएल के परमेश्वर, की व्यवस्था के अनुसार चलने में सावधानी नहीं बरती।[a] वह यारोबाम के उन पापों से दूर नहीं हुआ,[b] जिनके द्वारा यारोबाम ने इस्राएल से पाप करवाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की व्यवस्था के अनुसार चलते रहने का ध्यान नहीं रखा।” इब्रानी क्रिया सावधानी से पालन करने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यारोबाम द्वारा स्थापित मूर्तिपूजक उपासना-व्यवस्था से जुड़े पाप; राजाओं की पुस्तकों में यह बात बार-बार कही गई है।
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר לָלֶכֶת
  choice: चलने में सावधानी नहीं बरती
  rationale: שׁמר के साथ infinitive यहाँ ध्यानपूर्वक पालन करने या सावधान रहने का भाव देता है; यह हिन्दी में स्वाभाविक रहते हुए निर्माण की शक्ति को व्यक्त करता है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: इस वाचा-संबंधी प्रसंग में תּוֹרָה परमेश्वर की विधि और निर्देश को सूचित करती है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्थापित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: בְּכָל לְבָבוֹ
  choice: पूरे मन से
  rationale: यह सम्पूर्ण आन्तरिक निष्ठा का मुहावरा है; ‘पूरे मन से’ आधुनिक हिन्दी में सहज है।
- source_word: לֹא סָר מֵעַל
  choice: से दूर नहीं हुआ
  rationale: यह पापों को त्यागने या उनसे हट जाने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חַטֹּאות
  choice: पापों
  rationale: बहुवचन को सीधे बनाए रखा गया है और राजाओं की पुस्तक में यारोबाम से जुड़ी आवर्ती धार्मिक विफलता की भाषा सुरक्षित है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: हिफ़ईल रूप की कारणवाचक शक्ति तथा पूर्ववर्ती ‘पापों’ से सम्बन्ध दोनों को व्यक्त करता है; कर्ता यारोबाम ही रहता है।
- source_word: וְיֵהוּא
  choice: परन्तु येहू
  rationale: सन्दर्भ में यह बाल-पूजा के विरुद्ध येहू के कार्य और उसकी अधूरी वाचा-निष्ठा के बीच विरोध दिखाता है।
theological_decisions:
- issue: येहू की वाचा-निष्ठा का मूल्यांकन
  choice: पद येहू की पहले की धार्मिक कार्रवाई के बावजूद उसकी अधूरी और गैर-सम्पूर्ण आज्ञाकारिता को प्रस्तुत करता है।
  alternative: आलोचना को केवल अधूरे राजनीतिक सुधार तक सीमित समझना।
  rationale: ‘पूरे मन से’ और यारोबाम के पापों से दूर न होने की भाषा नैतिक-धार्मिक तथा वाचा-संबंधी मूल्यांकन करती है; अनुवाद इस तनाव को बिना बढ़ाए बनाए रखता है।
- issue: अन्तिम सम्बन्धवाचक उपवाक्य का आशय
  choice: यारोबाम ने उन पापों के द्वारा इस्राएल से पाप करवाया।
  alternative: उपवाक्य को केवल उन पापों की पहचान बताने वाला अनिर्दिष्ट कथन मानना।
  rationale: אֲשֶׁר का पूर्वपद बहुवचन ‘पाप’ है और कारणवाचक הֶחֱטִיא यारोबाम को इस्राएल के पाप का प्रेरक बताता है; ‘जिनके द्वारा’ साधनात्मक सम्बन्ध को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। ‘चलना’ मूल इब्रानी आचरण-रूपक को सुरक्षित रखता है, जबकि ‘सावधानी नहीं बरती’ उसके साथ स्वाभाविक हिन्दी बनाता है।
