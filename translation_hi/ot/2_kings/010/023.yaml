source:
  edition: WLC
  text: וַ/יָּבֹ֥א יֵה֛וּא וִ/יהוֹנָדָ֥ב בֶּן רֵכָ֖ב בֵּ֣ית הַ/בָּ֑עַל וַ/יֹּ֜אמֶר לְ/עֹבְדֵ֣י הַ/בַּ֗עַל חַפְּשׂ֤וּ וּ/רְאוּ֙ פֶּן יֶשׁ פֹּ֤ה עִמָּ/כֶם֙ מֵ/עַבְדֵ֣י יְהוָ֔ה כִּ֛י אִם עֹבְדֵ֥י הַ/בַּ֖עַל לְ/בַדָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
translation:
  language: hi
  text: तब येहू और रेकाब का पुत्र यहोनादाब बाल के भवन[a] में गए। उसने बाल के उपासकों से कहा, “अच्छी तरह खोजो और देखो कि कहीं यहाँ तुम्हारे बीच याहवे का कोई सेवक न हो, केवल बाल के उपासक ही हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाल का मंदिर।” इब्रानी में शाब्दिक अर्थ “बाल का घर” है।
    reason: ‘भवन’ स्रोत की औपचारिक अभिव्यक्ति को रखता है, जबकि ‘मंदिर’ प्रसंगगत अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: में गए
  rationale: בוא यहाँ किसी भवन के भीतर जाने को व्यक्त करता है; बहुवचन कर्ताओं के साथ स्वाभाविक हिन्दी में ‘में गए’ उपयुक्त है।
- source_word: בֵּית הַבָּעַל
  choice: बाल का भवन
  rationale: यह इब्रानी के शाब्दिक अर्थ ‘बाल का घर/भवन’ को सुरक्षित रखता है; प्रसंग में यह उपासना-स्थल अर्थात मंदिर है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עֹבְדֵי הַבַּעַל
  choice: बाल के उपासक
  rationale: עבד का मूल अर्थ सेवा करना है, पर बाल के उपासना-भवन में इकट्ठे धार्मिक अनुयायियों के लिए ‘उपासक’ उसका सांप्रदायिक-धार्मिक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַפְּשׂוּ וּרְאוּ
  choice: अच्छी तरह खोजकर देखो
  rationale: दोनों आज्ञार्थक क्रियाओं में खोज और पुष्टि का भाव है; यह हिन्दी अभिव्यक्ति दोनों को सहज और स्पष्ट रूप में रखती है।
- source_word: פֶּן יֶשׁ פֹּה עִמָּכֶם
  choice: कि यहाँ तुम्हारे बीच ... कोई ... न हो
  rationale: פֶּן सावधानीपूर्वक सुनिश्चित करने का निषेधात्मक भाव देता है; यह संरचना हिन्दी में स्वाभाविक है और ‘कहीं ... न हो’ का आशय बनाए रखती है।
- source_word: מֵעַבְדֵי יְהוָה
  choice: यहोवा का कोई सेवक
  rationale: यह अंशतः बहुवचन संरचना है, जिसका अर्थ समुदाय में से एक भी सेवक न होना है; हिन्दी में ‘कोई सेवक’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में यह परमेश्वर के विशिष्ट नाम को पहचानने योग्य रूप में प्रस्तुत करता है और बाल के साथ व्यक्तिनाम के स्तर पर विरोध को बनाए रखता है।
- source_word: כִּי אִם ... לְבַדָּם
  choice: केवल ... ही हों
  rationale: 'यह दोहरे बल के साथ पूर्ण अपवर्जन व्यक्त करता है: यहोवा का कोई सेवक नहीं, बल्कि केवल बाल के उपासक।'
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ इस्राएल के परमेश्वर के प्रति निष्ठा और बाल के प्रति निष्ठा का सीधा विरोध है। ‘यहोवा’ आधुनिक हिन्दी के व्यापक बाइबलीय प्रयोग में विशिष्ट नाम को स्पष्ट रखता है; ‘प्रभु’ शीर्षक होता, जबकि ‘याहवे’ स्रोत उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है।
- issue: עבד के बाल और यहोवा के संदर्भों में रूपांतर
  choice: बाल के लिए ‘उपासक’, यहोवा के लिए ‘सेवक’
  alternative: दोनों स्थानों पर ‘सेवक’
  rationale: 'एक ही इब्रानी मूल की पुनरावृत्ति स्वीकार करते हुए भी प्रसंगगत अर्थ अलग है: बाल के मंदिर में उपस्थित लोग धार्मिक उपासक हैं, जबकि ‘यहोवा का सेवक’ एक स्थापित निष्ठा-संबंधी अभिव्यक्ति है। यह भेद अर्थ को स्पष्ट करता है, किसी धर्मसिद्धान्तीय निष्कर्ष को नहीं जोड़ता।'
- issue: וַיֹּאמֶר के एकवचन कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ द्वारा स्रोत की अनिर्दिष्टता बनाए रखना
  alternative: ‘येहू ने कहा’
  rationale: इब्रानी में क्रिया एकवचन है, पर इसी वाक्य में दो पुरुष आए हैं। प्रसंग येहू की ओर संकेत करता है, फिर भी नाम जोड़ने के बजाय ‘उसने’ स्रोत की व्याकरणिक अनिर्दिष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अच्छी तरह खोजकर देखो’ आदेश की तत्परता को बोलचाल की ढील के बिना व्यक्त करता है। नामों के रूप हिन्दी बाइबलीय परंपरा के अनुरूप रखे गए हैं।
