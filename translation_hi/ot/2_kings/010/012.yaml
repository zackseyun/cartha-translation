    text: ‘बेत-एकेद’ का अर्थ सम्भवतः ‘इकट्ठा करने का घर’ जैसा कुछ हो सकता है। स्थान-नाम की कुछ व्याख्याएँ इसे चरवाहों द्वारा ऊन कतरने या बाँधने के स्थान से जोड़ती हैं। इब्रानी में इसे मुख्य पाठ में स्थान-नाम मानना सबसे उचित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: फिर वह उठा
  rationale: קום का क़ाल वय्यिक्तोल कथा में अगली क्रिया आरम्भ करता है। ‘उठा’ मूल क्रिया को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וַיָּבֹא
  choice: रवाना हुआ
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ अगली क्रिया और गंतव्य के साथ यात्रा आरम्भ करने का भाव है; ‘रवाना हुआ’ हिन्दी में क्रियाओं के क्रम को स्पष्ट और स्वाभाविक रखता है।
- source_word: וַיֵּלֶךְ שֹׁמְרוֹן
  choice: शोमरोन की ओर चला
  rationale: הלך के साथ स्थान का नाम शोमरोन की दिशा में गति बताता है। ‘की ओर’ उस समय जारी यात्रा को व्यक्त करता है और यह दावा नहीं करता कि वह इसी पद में गंतव्य पर पहुँच गया।
- source_word: הוּא
  choice: वह … में था
  rationale: स्वतंत्र सर्वनाम यहाँ स्थान-सूचक, क्रियारहित उपवाक्य का कर्ता है। हिन्दी में ‘था’ जोड़ना आवश्यक और अर्थानुकूल है।
- source_word: בֵּית עֵקֶד
  choice: बेत-एकेद
  rationale: यह स्थान-नाम के रूप में प्रयुक्त है। עקד से जुड़ी व्युत्पत्ति और पूरे नाम का आशय अनिश्चित है, इसलिए मुख्य पाठ में अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: הָרֹעִים
  choice: चरवाहों के
  rationale: רֹעִים का सीधा अर्थ ‘चरवाहे’ है। संबंधकारक रूप स्थान-नाम के साथ मूल इब्रानी संरचना बनाए रखता है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग में
  rationale: यह स्थान को शोमरोन की यात्रा के मार्ग पर स्थित बताता है। ‘मार्ग में’ संक्षिप्त, स्वाभाविक और संदर्भानुकूल है।
