  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
translation:
  language: hi
  text: फिर वह उठा, रवाना हुआ और शोमरोन की ओर चला। मार्ग में वह चरवाहों के बेत-एकेद[a] में था।
  philosophy: optimal-equivalence
  footnotes:
