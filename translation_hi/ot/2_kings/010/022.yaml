  text: וַ/יֹּ֗אמֶר לַֽ/אֲשֶׁר֙ עַל הַ/מֶּלְתָּחָ֔ה הוֹצֵ֣א לְב֔וּשׁ לְ/כֹ֖ל עֹבְדֵ֣י הַ/בָּ֑עַל וַ/יֹּצֵ֥א לָ/הֶ֖ם הַ/מַּלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
translation:
  language: hi
  text: उसने वस्त्र-भंडार के अधिकारी से कहा, “बाल के सभी उपासकों के लिए वस्त्र निकाल लाओ।” तब उसने उनके लिए वस्त्र निकाल दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמֶּלְתָּחָה
  choice: वस्त्र-भंडार
  rationale: यह संज्ञा वस्त्र रखने के स्थान या विभाग को सूचित करती है। ‘वस्त्र-भंडार’ आधुनिक हिंदी में स्पष्ट है और बाद की कलीसियाई धारणाएँ नहीं जोड़ता।
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  choice: वस्त्र-भंडार के अधिकारी से
  rationale: ‘जो ... के ऊपर था’ प्रशासनिक उत्तरदायित्व का मुहावरा है; हिंदी में ‘के अधिकारी’ उसी अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הוֹצֵא
  choice: निकाल लाओ
  rationale: हिफ़ील आज्ञार्थक रूप भंडार से वस्त्र बाहर लाने की आज्ञा देता है; ‘निकाल लाओ’ इस प्रसंग में सहज हिंदी है।
- source_word: לְבוּשׁ / הַמַּלְבּוּשׁ
  choice: वस्त्र
  rationale: दोनों शब्द पहनावे के लिए सामूहिक अर्थ में प्रयुक्त हैं। ‘वस्त्र’ गरिमापूर्ण, प्रचलित और यहाँ एकवचन सामूहिकता को सहजता से वहन करता है।
- source_word: עֹבְדֵי הַבָּעַל
  choice: बाल के ... उपासकों
  rationale: शाब्दिक अर्थ ‘बाल के सेवक’ हो सकता है, पर देवता के संदर्भ में यह उसकी आराधना में लगे लोगों को सूचित करता है; ‘उपासक’ धार्मिक आशय को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: וַיֹּצֵא לָהֶם הַמַּלְבּוּשׁ
  choice: तब उसने उनके लिए वस्त्र निकाल दिए
  rationale: वाव-क्रम कथा के अगले कार्य को आगे बढ़ाता है। ‘निकाल दिए’ आज्ञा के पालन और वस्त्रों के उनके लिए उपलब्ध करा दिए जाने को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: עֹבְדֵי הַבָּעַל का धार्मिक आशय
  choice: बाल के उपासक
  alternative: बाल के सेवक
  rationale: ‘सेवक’ अधिक शाब्दिक है, किंतु इस सांप्रदायिक उपासना-प्रसंग में ‘उपासक’ अभिप्रेत धार्मिक सेवा को अधिक स्पष्ट करता है और कोई अतिरिक्त पंथगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथा-शैली रखी गई है। ‘वस्त्र-भंडार’ अस्पष्ट या पुरातन पद के स्थान पर ठोस अर्थ देता है; ‘बाल’ नाम का प्रचलित हिंदी बाइबलीय रूप है।
