source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יֵהוּא֙ עִם אֲבֹתָ֔י/ו וַ/יִּקְבְּר֥וּ אֹת֖/וֹ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יְהוֹאָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: hi
  text: फिर येहू अपने पुरखाओं के साथ सो गया[a], और उन्होंने उसे शोमरोन में दफ़नाया। उसका पुत्र यहोआहाज़ उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, वह मर गया; यह राजाओं की मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: ‘सो गया’ को सामान्य नींद न समझा जाए और मूल राजकीय मुहावरा भी बना रहे।
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: शाब्दिक अर्थ ‘लेटना/सोना’ है और राजकीय मृत्यु-वृत्तांतों में यह मृत्यु का प्रचलित शिष्टोक्ति-मूलक मुहावरा है। हिंदी में ‘सो गया’ इस बिंब को स्वाभाविक रूप से बनाए रखता है; पादटिप्पणी अर्थ स्पष्ट करती है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: यह मानक राजकीय सूत्र है। ‘पुरखाओं’ से पूर्वजों और वंश-परंपरा, दोनों का भाव सहज आधुनिक हिंदी में व्यक्त होता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे दफ़नाया
  rationale: इब्रानी में अनिर्दिष्ट कर्ता के साथ सक्रिय बहुवचन क्रिया है; हिंदी अनुवाद उसी सक्रिय रूप और अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: ב यहाँ स्थानसूचक है; ‘में’ दफ़नाने के स्थान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूचना में क्रिया राजपद ग्रहण करने को सूचित करती है, न कि पूरे शासनकाल को; ‘राजा हुआ’ इस परिवर्तन को संक्षेप में व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद पूर्व राजा के पद पर उत्तराधिकार को दर्शाता है; हिंदी में यह निकट और स्वाभाविक समतुल्य है।
- source_word: יֵהוּא
  choice: येहू
  rationale: इब्रानी नाम יֵהוּא का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज़
  rationale: इब्रानी नाम יְהוֹאָחָז का ध्वन्यात्मक देवनागरी लिप्यंतरण।
theological_decisions:
- issue: मृत्यु के राजकीय मुहावरे का अर्थ
  choice: मुख्य पाठ में ‘अपने पुरखाओं के साथ सो गया’ रखकर पादटिप्पणी में मृत्यु का अर्थ स्पष्ट किया गया।
  alternative: ‘मर गया’
  rationale: मूल इब्रानी का पारंपरिक बिंब और वंशगत सूत्र सुरक्षित रहता है, जबकि पादटिप्पणी आधुनिक पाठक के लिए संभावित भ्रम दूर करती है; इससे पुनरुत्थान या मृत्यु की अवस्था के विषय में कोई अतिरिक्त सिद्धांत आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-संरचना इब्रानी राजकीय सारांश की संक्षिप्तता बनाए रखती है; ‘दफ़नाया’ वर्तमान मानक हिंदी में स्वाभाविक है।
