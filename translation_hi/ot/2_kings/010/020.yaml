translation:
  language: hi
  text: तब येहू ने कहा, “बाल के लिए एक पवित्र सभा ठहराओ।” फिर उन्होंने उसकी घोषणा की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: קַדְּשׁוּ
  choice: पवित्र ... बुलाने की घोषणा करो
  rationale: बहुवचन आज्ञार्थक रूप सभा को धार्मिक प्रयोजन के लिए विधिवत अलग ठहराने/आयोजित करने का भाव देता है। हिन्दी में संपूर्ण वाक्यांश उस अनुष्ठानिक और सार्वजनिक आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲצָרָה
  choice: एक पवित्र सभा
  rationale: यह संज्ञा औपचारिक धार्मिक जमावड़े को सूचित करती है; ‘पवित्र सभा’ अर्थ को स्पष्ट रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: לַבַּעַל
  choice: बाल के लिए
  rationale: यहाँ ל संबंध अथवा प्रयोजन बताता है—सभा बाल के सम्मान या उसकी उपासना के लिए है।
- source_word: וַיִּקְרָאוּ
  choice: तब उन्होंने उसकी घोषणा कर दी
  rationale: इस प्रसंग में קרא का अर्थ सार्वजनिक रूप से घोषणा करना है; ‘उसकी’ का संदर्भ पूर्वोक्त सभा से स्वाभाविक रूप से स्पष्ट है।
