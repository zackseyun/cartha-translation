base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/030.yaml
  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
translation:
  language: hi
  text: तब यहोवा ने येहू से कहा, “चूँकि तुमने वह करने में अच्छा किया जो मेरी दृष्टि में सही है, और अहाब के घराने के साथ ठीक वैसा ही किया जैसा मेरे मन में था, इसलिए तुम्हारे पुत्र चौथी पीढ़ी तक[a] इस्राएल के सिंहासन पर बैठेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “पुत्र, चौथों के [पुत्र]”; यह मुहावरा चार पीढ़ियों तक चलने वाले राजवंश को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
