  choice: चूँकि
  rationale: यह पद में दिए गए कारण और उसके बाद की प्रतिज्ञा के बीच स्पष्ट कारणात्मक संबंध बनाए रखता है।
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת הַיָּשָׁר בְּעֵינַי
  choice: तुमने वह करने में अच्छा किया जो मेरी दृष्टि में सही है
  rationale: हिफ़ील क्रिया की प्रशंसात्मक शक्ति और ‘मेरी दृष्टि में सही’ की इब्रानी मूल्यांकन-सूत्रावली दोनों सुरक्षित रहती हैं।
- source_word: כְּכֹל אֲשֶׁר בִּלְבָבִי
  choice: ठीक वैसा ही ... जैसा मेरे मन में था
  rationale: לֵבָב यहाँ भावना से अधिक इच्छा या अभिप्राय दर्शाता है; आधुनिक हिन्दी में ‘मन में था’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָשִׂיתָ לְבֵית אַחְאָב
  choice: अहाब के घराने के साथ ... किया
  rationale: ‘घराना’ राजवंश का भाव देता है और वाक्यांश को इस निर्णय से आगे बढ़ाकर अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: בְּנֵי רְבִעִים
  choice: तुम्हारे वंशज चौथी पीढ़ी तक
  rationale: शाब्दिक ‘चौथों के पुत्र’ एक वंशगत मुहावरा है; ‘वंशज चौथी पीढ़ी तक’ उसका अर्थ साधारण हिन्दी पाठक के लिए स्पष्ट करता है।
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठेंगे
  rationale: राजकीय सिंहासन पर बैठने का मूल रूपक बनाए रखा गया है; לְךָ का वंशगत हित ‘तुम्हारे वंशज’ में स्वाभाविक रूप से समाहित है।
theological_decisions:
- issue: येहू के कार्यों पर परमेश्वर की स्वीकृति
  choice: प्रशंसा को अहाब के घराने के विरुद्ध किए गए कार्य तक सीमित रखा गया है।
  alternative: इसे येहू के पूरे शासन और चरित्र की व्यापक नैतिक स्वीकृति मानना, अथवा कथन को नरम करना।
  rationale: इब्रानी पाठ स्पष्ट रूप से अहाब के घराने के साथ किए गए कार्य को परमेश्वर की दृष्टि में सही और उसके अभिप्राय के अनुरूप बताता है, पर येहू के समस्त आचरण पर निर्णय नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘मेरी दृष्टि में सही’ और ‘सिंहासन पर बैठेंगे’ जैसे प्रमुख इब्रानी रूपक सुरक्षित रखे गए हैं; वंशगत मुहावरे को मुख्य पाठ में स्पष्ट करके शाब्दिक रूप पादटिप्पणी में दिया गया है।
