base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
translation:
  language: hi
  text: तब येहू ने सारे इस्राएल में संदेश भेजा, और बाल के सभी उपासक आ गए। एक भी पुरुष ऐसा नहीं रहा जो न आया था। वे बाल के भवन में प्रवेश किए, और बाल का भवन एक छोर से दूसरे छोर तक[a] भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मुँह से मुँह तक”; यह मुहावरा पूरे भवन के पूरी तरह भर जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  choice: येहू ने सारे इस्राएल में संदेश भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है; בְּכָל יִשְׂרָאֵל के साथ यहाँ पूरे इस्राएल में सूचना या बुलावा भेजने का भाव है। ‘संदेश’ संदर्भ से निहित कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עֹבְדֵי הַבַּעַל
  choice: बाल के सभी उपासक
  rationale: עבד का कृदन्त धार्मिक संदर्भ में बाल की उपासना और सेवा करने वालों को दर्शाता है; ‘उपासक’ आधुनिक हिन्दी में इस आराधनात्मक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  choice: एक भी ऐसा पुरुष न बचा जो न आया हो
  rationale: यह दोहरे निषेध द्वारा सबके उपस्थित होने पर बल देता है। ‘पुरुष’ אִישׁ के पुल्लिंग एकवचन रूप को बनाए रखता है और वाक्य हिन्दी में स्वाभाविक रहता है।
- source_word: וַיָּבֹאוּ בֵּית הַבַּעַל
  choice: वे बाल के भवन में गए
  rationale: בוא किसी भवन के साथ उसमें आने या प्रवेश करने का अर्थ देता है। ‘में गए’ सहज हिन्दी है और प्रवेश का भाव व्यक्त करता है।
- source_word: בֵּית הַבַּעַל
  choice: बाल का भवन
  rationale: בֵּית का औपचारिक अर्थ ‘घर/भवन’ है। यहाँ यह उपासना-स्थल है, पर ‘भवन’ स्रोत की अभिव्यक्ति को ‘मन्दिर’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: וַיִּמָּלֵא
  choice: भर गया
  rationale: מלא का निफ़अल रूप यहाँ भवन के पूर्ण रूप से भर जाने को दर्शाता है; ‘भर गया’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: פֶּה לָפֶה
  choice: एक छोर से दूसरे छोर तक
  rationale: इस मुहावरे का शाब्दिक रूप ‘मुँह से मुँह तक’ है, पर संदर्भ में इसका अर्थ पूरे स्थान का आर-पार भर जाना है। हिन्दी मुहावरेदार अनुवाद अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: एक भी ऐसा पुरुष न बचा जो न आया हो
  alternative: एक भी ऐसा व्यक्ति न बचा जो न आया हो
  rationale: मूल पाठ में पुल्लिंग एकवचन אִישׁ है। ‘पुरुष’ स्रोत-रूप को सुरक्षित रखता है; यहाँ इससे कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं निकाला गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बाल का भवन’ स्रोत के בֵּית को निकटता से दर्शाता है, जबकि पादटिप्पणी दुर्बोध इब्रानी मुहावरे को स्पष्ट करती है।
