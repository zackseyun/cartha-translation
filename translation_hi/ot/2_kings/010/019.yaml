base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
translation:
  language: hi
  text: “अब बाल के सभी नबियों, उसके सभी उपासकों और उसके सभी याजकों को मेरे पास बुलाओ। एक भी व्यक्ति अनुपस्थित न रहे[a], क्योंकि मैं बाल के लिए एक बड़ा बलिदान करने वाला हूँ। जो कोई अनुपस्थित रहेगा, वह जीवित नहीं बचेगा।” परन्तु येहू ने यह काम छल से[b] किया, ताकि वह बाल के उपासकों का नाश कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोई आदमी अनुपस्थित न रहे।” इब्रानी में एकवचन पुल्लिंग रूप प्रतिनिधिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “कपट से” अथवा “चालाकी से”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: וְעַתָּה में स्पष्ट कालसूचक ‘अब’ है; इसलिए इसे अनूदित किया गया है, साथ ही वाक्य के प्रसंगगत संक्रमण को भी बनाए रखा गया है।
- source_word: נְבִיאֵי הַבַּעַל
  choice: बाल के सभी नबियों
  rationale: यह संबंधवाचक रचना बाल से जुड़े नबियों को दर्शाती है; ‘बाल के नबी’ स्वाभाविक और सटीक हिन्दी है।
- source_word: עֹבְדָיו
  choice: उसके सभी उपासकों
  rationale: धार्मिक संदर्भ में עבד बाल की उपासना और सेवा करने वालों को सूचित करता है; ‘उपासक’ केवल सामान्य सेवक की अपेक्षा आशय को अधिक स्पष्ट करता है।
- source_word: כֹּהֲנָיו
  choice: उसके सभी याजकों
  rationale: כֹּהֵן के लिए ‘याजक’ प्रचलित धार्मिक पद है और एकवचन पुंल्लिंग प्रत्यय बाल की ओर संकेत करता है।
- source_word: קִרְאוּ אֵלַי
  choice: मेरे पास बुलाओ
  rationale: बहुवचन आज्ञार्थक रूप लोगों को येहू की उपस्थिति में बुलाने को कहता है; यह हिन्दी में स्वाभाविक प्रशासनिक आदेश है।
- source_word: אִישׁ אַל יִפָּקֵד
  choice: एक भी व्यक्ति अनुपस्थित न रहे
  rationale: פקד का निफ़अल यहाँ गिनती या सभा में अनुपस्थित होने का अर्थ देता है। ‘एक भी व्यक्ति’ स्रोत के प्रत्येक व्यक्ति पर दिए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זֶבַח גָּדוֹל לִי לַבַּעַל
  choice: मुझे बाल के लिए एक बड़ा बलिदान चढ़ाना है
  rationale: זבח बलिदान को दर्शाता है। हिन्दी में ‘बलिदान चढ़ाना’ धार्मिक क्रिया को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּל אֲשֶׁר יִפָּקֵד לֹא יִחְיֶה
  choice: जो कोई अनुपस्थित रहेगा, वह जीवित नहीं बचेगा
  rationale: पहले आए פקד का वही अर्थ रखा गया है और לֹא יִחְיֶה की कठोर धमकी को बिना नरम किए व्यक्त किया गया है।
- source_word: בְעָקְבָה
  choice: छल से
  rationale: यह संज्ञा छल, कपट या चालाक युक्ति का भाव दे सकती है। ‘छल से’ संक्षिप्त और स्वाभाविक है तथा कथावाचक के मूल्यांकन को बनाए रखता है।
- source_word: לְמַעַן הַאֲבִיד
  choice: ताकि वह ... का नाश कर दे
  rationale: यह उद्देश्यवाचक रचना और אבד के हिफ़ील रूप की विनाशकारी शक्ति दोनों को स्पष्ट करती है।
theological_decisions:
- issue: येहू के कार्य पर कथावाचक का मूल्यांकन
  choice: येहू ने यह काम छल से किया था
  alternative: येहू ने यह काम चतुराई से किया था
  rationale: पाठ स्वयं येहू की घोषणा को भ्रामक रणनीति बताता है। ‘छल’ नैतिक और कथात्मक तनाव को बनाए रखता है और उसके व्यवहार को निर्दोष चतुराई बनाकर प्रस्तुत नहीं करता।
- issue: אִישׁ का प्रतिनिधिक एकवचन पुंल्लिंग प्रयोग
  choice: एक भी व्यक्ति अनुपस्थित न रहे
  alternative: एक भी आदमी अनुपस्थित न रहे
  rationale: स्रोत का אִישׁ एकवचन पुंल्लिंग है, पर यहाँ सभा में अपेक्षित हर व्यक्ति के लिए प्रतिनिधिक रूप में प्रयुक्त है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में बताया गया है।
- issue: येहू का विनाशकारी उद्देश्य
  choice: ताकि वह बाल के उपासकों का नाश कर दे
  alternative: बाल के उपासकों को मिटा देने के लिए
  rationale: उद्देश्यवाचक उपवाक्य को स्पष्ट रखा गया है, बिना येहू के कार्य को धार्मिक रूप से उचित या अनुचित ठहराने वाला अतिरिक्त निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक स्तर अपनाया गया है। ‘नबी,’ ‘उपासक,’ ‘याजक’ और ‘बलिदान चढ़ाना’ सामान्य पाठकों के लिए परिचित धार्मिक शब्दावली है। स्रोत में उपस्थित וְעַתָּה के कारण आरम्भ में ‘अब’ रखा गया है।
