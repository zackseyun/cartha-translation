  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
translation:
  language: hi
  text: “और अब जब यह पत्र तुम्हारे पास पहुँचे[a]—तुम्हारे स्वामी के पुत्र तुम्हारे साथ हैं[b], और रथ, घोड़े, एक किलाबंद नगर[c] और हथियार भी तुम्हारे पास हैं—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब यह लिखित संदेश तुम्हारे पास पहुँचे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारे स्वामी के पुत्र”; अर्थात उस राजा के पुत्र, जिसकी पत्र पानेवाले सेवा करते थे।
    reason: cultural_note
  - marker: c
    text: या “एक गढ़वाला नगर।” इसका आशय एक ऐसे सुरक्षित नगर से है जो उनके पास उपलब्ध था और जिसकी रक्षा की जा सकती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
