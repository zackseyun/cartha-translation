  rationale: यह संदेश में अगले चरण का परिचय देने वाला कथन-सूचक है; हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: כְּבֹא הַסֵּפֶר הַזֶּה אֲלֵיכֶם
  choice: जब यह पत्र तुम्हारे पास पहुँचे
  rationale: כְּבֹא समय का भाव देता है, और राजकीय पत्राचार के प्रसंग में סֵפֶר का अर्थ ‘पत्र’ है।
- source_word: בְּנֵי אֲדֹנֵיכֶם
  choice: तुम्हारे स्वामी के पुत्र
  rationale: राजनीतिक प्रसंग में אֲדֹנֵיכֶם प्राप्तकर्ताओं के राजकीय स्वामी को दर्शाता है; ‘स्वामी’ ईश्वरीय उपाधि का भ्रम उत्पन्न किए बिना संबंध बनाए रखता है।
- source_word: הָרֶכֶב וְהַסּוּסִים
  choice: रथ, घोड़े
  rationale: ये उपलब्ध सैन्य साधनों के सामूहिक उल्लेख हैं; सीधा हिन्दी रूप स्पष्ट और स्वाभाविक है।
- source_word: עִיר מִבְצָר
  choice: एक गढ़वाला नगर
  rationale: यह ऐसा नगर दर्शाता है जिसे किलेबंदी के कारण बचाया जा सकता है; ‘गढ़वाला नगर’ सामान्य पाठक के लिए सहज है।
- source_word: הַנָּשֶׁק
  choice: हथियार
  rationale: यहाँ शब्द सामान्य रूप से युद्ध-सामग्री अथवा शस्त्रों को सूचित करता है; ‘हथियार’ आधुनिक हिन्दी में सर्वाधिक स्पष्ट है।
- source_word: וְאִתְּכֶם
  choice: तुम्हारे साथ हैं / तुम्हारे पास हैं
  rationale: इब्रानी की क्रियारहित परिस्थितिवाचक सूची को हिन्दी में स्पष्ट करने के लिए उपयुक्त सहायक क्रिया जोड़ी गई है; नगर और सैन्य संसाधनों के लिए ‘तुम्हारे पास’ स्वाभाविक है।
