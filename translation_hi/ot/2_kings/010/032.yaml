  yaml_path: translation/ot/2_kings/010/032.yaml
  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
translation:
  language: hi
  text: उन दिनों यहोवा ने इस्राएल के हिस्से अलग करना शुरू किया[a], और हज़ाएल ने इस्राएल के पूरे क्षेत्र में[b] उन पर प्रहार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल को घटाना शुरू किया।” हिब्रू क्रिया इस्राएल की क्रमिक कटौती का बोध देती है, सम्भवतः उसके भूभाग छिनने के द्वारा।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल की पूरी सीमा पर।” हिब्रू शब्द का अर्थ ‘सीमा’ या ‘क्षेत्र’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह प्रचलित कालवाचक अभिव्यक्ति हिब्रू के बहुवचन मुहावरे को स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम चतुरक्षरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: הֵחֵל לְקַצּוֹת בְּיִשְׂרָאֵל
  choice: इस्राएल के हिस्से काटकर अलग करने शुरू किए
  rationale: הֵחֵל आरम्भ को व्यक्त करता है और לְקַצּוֹת यहाँ पूर्ण विनाश के बजाय इस्राएल की क्रमिक कटौती, सम्भवतः भूभाग छिनने, का बोध देता है; हिन्दी वाक्यांश काटने के रूपक को बनाए रखता है।
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: सैनिक प्रसंग में נכה प्रहार करके परास्त या मार गिराने का प्रबल अर्थ रखता है; बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से स्पष्ट किया गया है।
- source_word: חֲזָאֵל
  choice: हज़ाएल
  rationale: व्यक्तिवाचक नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल के पूरे क्षेत्र में
  rationale: גְּבוּל का अर्थ सीमा या सीमाबद्ध भूक्षेत्र दोनों हो सकता है; युद्ध-भौगोलिक प्रसंग में ‘पूरे क्षेत्र में’ हमले के विस्तार को स्वाभाविक ढंग से बताता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से है। उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; आधुनिक हिन्दी पाठकों में पहचाने जाने वाले पारंपरिक लिप्यंतरण ‘यहोवा’ को अपनाया गया है।
- issue: इस्राएल की कटौती में यहोवा की भूमिका
  choice: यहोवा ने ... शुरू किए
  alternative: इस्राएल के हिस्से कटने लगे
  rationale: हिब्रू वाक्य यहोवा को आरम्भ कराने वाले कर्ता के रूप में रखता है। सक्रिय रचना उस कठिन धर्मवैचारिक कथन को निष्प्रभावी किए बिना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हिस्से काटकर अलग करना’ मूल रूपक तथा क्षेत्रीय हानि के संकेत दोनों को बचाता है। प्रत्येक पादटिप्पणी-चिह्न मुख्य पाठ में उसके सम्बद्ध पदांश के बाद रखा गया है।
