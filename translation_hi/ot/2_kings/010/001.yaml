  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
translation:
  language: hi
  text: 'अहाब के सत्तर बेटे सामरिया में थे। येहू ने पत्र लिखे और उन्हें सामरिया भेजा—यिज्रेल के अधिकारियों[a], पुरनियों और अहाब के बेटों के संरक्षकों[b] के नाम—यह कहते हुए:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “यिज्रेल के अधिकारियों” है। पत्र सामरिया भेजे गए थे, इसलिए कुछ लोग इसका अर्थ वहाँ रहने वाले यिज्रेल से जुड़े अधिकारी समझते हैं; कुछ प्राचीन अनुवाद और व्याख्याकार “सामरिया के अधिकारी” पाठ का समर्थन करते हैं। मुख्य पाठ मसोरेटिक पाठ को सुरक्षित रखता है।
    reason: textual_variant
  - marker: b
    text: या “पालन-पोषण करने वालों” अथवा “देखभाल करने वालों।” इब्रानी शब्द उन लोगों के लिए है जो अहाब के बेटों के पालन-पोषण या देखरेख के उत्तरदायी थे।
    reason: lexical_alternative
