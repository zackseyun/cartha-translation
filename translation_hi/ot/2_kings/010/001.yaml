  rationale: लामेदयुक्त संबंधवाचक रचना यहाँ अहाब के पास बेटों के होने की परिस्थिति बताती है। हिंदी में ‘अहाब के सत्तर बेटे थे’ स्वाभाविक है और בָּנִים का पुरुषवाचक अर्थ बनाए रखता है।
