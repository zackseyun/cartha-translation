- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह केवल वृद्ध पुरुषों का नहीं, मान्य नागरिक अगुओं का पदसूचक शब्द है; ‘पुरनिये’ हिंदी बाइबलीय प्रयोग में इस संस्था को स्पष्ट करता है।
- source_word: הָאֹמְנִים אַחְאָב
  choice: अहाब के बेटों के संरक्षकों
  rationale: אֹמְנִים उन लोगों को दर्शाता है जिन्हें राजपुत्रों के पालन-पोषण या देखरेख का दायित्व सौंपा गया था। प्रसंग से निहित ‘बेटों’ को हिंदी में स्पष्ट किया गया है।
- source_word: לֵאמֹר
