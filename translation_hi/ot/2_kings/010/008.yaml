base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
translation:
  language: hi
  text: तब संदेशवाहक ने आकर उसे बताया, “राजा के पुत्रों के सिर लाए गए हैं।” उसने कहा, “उन्हें फाटक के प्रवेश पर दो ढेरों[a] में सुबह तक रख दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो राशियों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: संदेशवाहक
  rationale: इस कथात्मक संदर्भ में यह समाचार पहुँचाने वाला मनुष्य है, कोई स्वर्गदूत नहीं। ‘संदेशवाहक’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  choice: उसे बताया
  rationale: हिब्रू का आशय सूचना देने से है। हिन्दी में इसके बाद प्रत्यक्ष कथन होने के कारण अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और अस्वाभाविक होता।
- source_word: הֵבִיאוּ
  choice: लाए गए हैं
  rationale: कर्ता अनिर्दिष्ट है और पूरी हो चुकी क्रिया का वर्तमान परिणाम सामने है। हिन्दी का कर्मवाच्य इस अनिर्दिष्ट कर्ता को स्वाभाविक रूप से बनाए रखता है।
- source_word: רָאשֵׁי בְנֵי הַמֶּלֶךְ
  choice: राजा के पुत्रों के सिर
  rationale: बहुवचन और संबंधसूचक रचना को सीधे रखा गया है; प्रसंग में ये काटे गए सिर हैं, पर ‘काटे गए’ मूल पद में अलग से नहीं है।
- source_word: שִׂימוּ אֹתָם
  choice: उन्हें … रख दो
  rationale: आज्ञार्थक क्रिया का सरल और स्वाभाविक हिन्दी रूप है।
- source_word: שְׁנֵי צִבֻּרִים
  choice: दो ढेरों में
  rationale: צִבֻּרִים वस्तुओं के ढेर या राशियों को दर्शाता है। ‘दो ढेरों में’ इस दृश्य को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: פֶּתַח הַשַּׁעַר
  choice: फाटक के प्रवेश-द्वार पर
  rationale: यह फाटक के खुलने या प्रवेश करने के स्थान को दर्शाता है। ‘प्रवेश-द्वार’ स्थान को ठोस और स्पष्ट रखता है।
- source_word: עַד הַבֹּקֶר
  choice: सुबह तक
  rationale: यह अगले प्रातःकाल तक की अवधि बताता है; ‘सुबह तक’ इसका स्वाभाविक आधुनिक हिन्दी रूप है।
