translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। हिंसक विवरण को न तो नरम किया गया है और न मूल से अधिक स्पष्ट बनाया गया है। प्रत्यक्ष कथन में हिन्दी की स्वाभाविक शैली अपनाते हुए לֵאמֹר का अलग, यांत्रिक अनुवाद नहीं जोड़ा गया।
