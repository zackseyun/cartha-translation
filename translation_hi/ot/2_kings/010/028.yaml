  text: So Jehu destroyed Baal from Israel[a][b].
translation:
  language: hi
  text: इस प्रकार येहू ने इस्राएल में से बाल को मिटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  choice: नामोनिशान मिटा दिया
  rationale: हिफ़ील रूप किसी को नष्ट कर देने या हटा देने का प्रबल अर्थ व्यक्त करता है। प्रसंग में यह स्वाभाविक हिन्दी अभिव्यक्ति बाल को इस्राएल से मिटा देने की बात स्पष्ट करती है।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַבַּעַל
  choice: बाल
  rationale: हिब्रू में निश्चित उपपद है, पर हिन्दी में देवता के व्यक्तिनाम के साथ उसकी आवश्यकता नहीं है। केवल 'बाल' रखना स्रोत के अनुरूप है और 'बाल की उपासना' जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल में से
  rationale: מִן अलगाव या निष्कासन दर्शाता है; 'इस्राएल में से' बाल को देश/राज्य से हटाए जाने का सीधा और स्वाभाविक अनुवाद है।
- source_word: וַ
  choice: इस प्रकार
  rationale: वाव कथानक को आगे बढ़ाता है और पिछले कार्यों के परिणाम को यहाँ समेटता है; 'इस प्रकार' प्रसंगगत निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: '''बाल'' का आशय'
  choice: देवता/पंथ के नाम को केवल 'बाल' के रूप में रखा गया है।
  alternative: '''बाल की उपासना'' या ''बाल-पूजा'''
  rationale: मूल पाठ का कर्म 'बाल' ही है। व्यापक प्रसंग से उसके पंथ के दमन का अर्थ सामने आता है, पर अनुवाद में उसे स्पष्ट करके मूल से आगे जाना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'नामोनिशान मिटा दिया' प्रबल किंतु प्रचलित मुहावरा है; वाक्य संक्षिप्त रखा गया है।
