base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
translation:
  language: hi
  text: इस प्रकार येहू ने यिज्रेल में अहाब के घराने के बचे हुए सभी लोगों को, और उसके सभी प्रमुख व्यक्तियों[a], उसके निकट सहयोगियों[b] और उसके याजकों को मार डाला; यहाँ तक कि उसने उसका कोई भी जीवित व्यक्ति नहीं छोड़ा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके सभी सरदारों’ अथवा ‘उसके सभी बड़े लोगों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके परिचितों’ अथवा ‘उसके अंतरंग लोगों’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘जब तक कि उसने उसके लिए कोई जीवित बचा हुआ न छोड़ा।’ ‘उसका’ अहाब या अहाब के घराने की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: इस वर्णन में נכה प्राणघातक हिंसा को दर्शाता है; आधुनिक हिन्दी में ‘मार डाला’ स्पष्ट और स्वाभाविक है।
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  choice: अहाब के घराने के सभी बचे हुए लोगों
  rationale: यह पदबंध अहाब के राजवंश या घराने से संबद्ध उन लोगों को बताता है जो अब तक जीवित बचे थे।
- source_word: בְּיִזְרְעֶאל
  choice: यिज्रेल में
  rationale: नगर के स्थानवाचक प्रयोग को ‘में’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְּדֹלָיו
  choice: उसके सभी बड़े लोगों
  rationale: शब्द सामाजिक या राजनीतिक रूप से प्रमुख व्यक्तियों को दर्शाता है; ‘बड़े लोग’ मूल की व्यापकता बनाए रखता है।
- source_word: מְיֻדָּעָיו
  choice: उसके घनिष्ठ परिचितों
  rationale: ידע से बना यह रूप उन लोगों की ओर संकेत करता है जो उसके जाने-पहचाने, संभवतः निकट संबंधी या सहयोगी थे; ‘घनिष्ठ परिचित’ इस संबंधपरक अर्थ को बनाए रखता है।
- source_word: כֹהֲנָיו
  choice: उसके याजकों
  rationale: मूल का सीधा अर्थ ‘उसके याजक’ है; उन्हें किसी अधिक संकीर्ण पदाधिकारी-वर्ग के रूप में परिभाषित करना आवश्यक नहीं।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: जब तक कि उसने उसके लिए एक भी जीवित न छोड़ा
  rationale: यह वाक्यांश पूर्ण विनाश व्यक्त करता है। ‘उसके लिए’ לוֹ की संक्षिप्त और कुछ हद तक अस्पष्ट संदर्भ-रचना को बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में לוֹ का संदर्भ
  choice: ‘उसके लिए’ रखकर एकवचन सर्वनाम की अस्पष्टता बनाए रखी गई
  alternative: ‘अहाब के घराने में’ या ‘अहाब का’ कहकर संदर्भ स्पष्ट करना
  rationale: इब्रानी में सर्वनाम अहाब अथवा उसके घराने की ओर संकेत कर सकता है। मुख्य पाठ में किसी एक संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। राजवंशीय अर्थ के लिए ‘घराना’, धार्मिक पद के लिए प्रचलित बाइबलीय शब्द ‘याजक’, और पूर्ण संहार के लिए स्वाभाविक ‘एक भी जीवित न छोड़ा’ प्रयोग किया गया है।
