- source_word: וַיִּשְׂרְפוּהָ
  choice: और उन्हें जला दिया
  rationale: इब्रानी में कर्म-प्रत्यय एकवचन स्त्रीलिंग है, जबकि निकटवर्ती संज्ञा ‘स्तंभ’ बहुवचन है। हिन्दी में आशय के अनुसार बहुवचन ‘उन्हें’ स्वाभाविक है; इस व्याकरणिक असंगति को पाद-टिप्पणी में सुरक्षित रखा गया है।
