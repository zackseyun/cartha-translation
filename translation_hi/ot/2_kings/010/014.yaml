id: 2KI.10.14
reference: 2 Kings 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ תִּפְשׂ֣וּ/ם חַיִּ֔ים וַֽ/יִּתְפְּשׂ֖וּ/ם חַיִּ֑ים וַֽ/יִּשְׁחָט֞וּ/ם אֶל בּ֣וֹר בֵּֽית עֵ֗קֶד אַרְבָּעִ֤ים וּ/שְׁנַ֨יִם֙ אִ֔ישׁ וְ/לֹֽא הִשְׁאִ֥יר אִ֖ישׁ מֵ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
translation:
  language: hi
  text: उसने कहा, “उन्हें जीवित पकड़ लो।” तब उन्होंने उन्हें जीवित पकड़ लिया और बेत-एकेद[b] के गड्ढे के पास[a] उन बयालीस पुरुषों का वध कर दिया। उसने उनमें से एक भी पुरुष बाकी नहीं छोड़ा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “गड्ढे में” या “गड्ढे की ओर” भी हो सकता है। यहाँ प्रयुक्त इब्रानी संबंधबोधक शब्द स्थान-संबंध के एक से अधिक अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: बेत-एकेद एक स्थान का नाम है। इब्रानी नाम का संबंध संभवतः “बाँधने” या “इकट्ठा करने के घर” से है, पर यहाँ यह व्यक्तिवाचक स्थान-नाम के रूप में प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: 'इब्रानी में अक्षरशः: “उसने उनमें से एक पुरुष भी नहीं छोड़ा”; अर्थात उनमें से कोई जीवित नहीं बचा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם
  choice: उन्हें पकड़ लो
  rationale: תפשׂ का अर्थ पकड़ना या काबू में करना है। प्रसंग में यह आदेश उन्हें मारने से पहले जीवित बंदी बनाने का है; इसलिए ‘पकड़ लो’ सहज और सटीक है।
- source_word: חַיִּים
  choice: जीवित
  rationale: यहाँ यह क्रियाविशेषण की तरह प्रयुक्त है और बताता है कि उन्हें तत्काल मारने के बजाय जीवित पकड़ा जाना था।
- source_word: וַיִּשְׁחָטוּם
  choice: उनका वध कर दिया
  rationale: שׁחט सामान्य ‘मारना’ से अधिक विशिष्ट और कठोर शब्द है। ‘वध’ घटना की निर्ममता को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: אֶל־בּוֹר
  choice: गड्ढे के पास
  rationale: אֶל सामान्यतः ‘की ओर’ का बोध देता है, पर इस स्थान-सूचक प्रयोग में ‘के पास’ स्वाभाविक है। ‘गड्ढे में’ भी संभव है, इसलिए अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: בֵּית עֵקֶד
  choice: बेत-एकेद
  rationale: यहाँ यह स्थान-नाम है, इसलिए इसके संभावित शाब्दिक अर्थ का अनुवाद करने के बजाय इसका लिप्यंतरण किया गया है।
- source_word: אַרְבָּעִים וּשְׁנַיִם אִישׁ
  choice: बयालीस पुरुष
  rationale: אִישׁ के साथ यह संख्या-वाक्यांश पुरुषों की गिनती करता है; ‘पुरुष’ लिंग-सटीक और स्वाभाविक है।
- source_word: וְלֹא הִשְׁאִיר אִישׁ מֵהֶם
  choice: उसने उनमें से एक भी पुरुष बाकी नहीं छोड़ा
  rationale: एकवचन क्रिया का कर्ता येहू है, इसलिए बहुवचन ‘उन्होंने’ के बजाय ‘उसने’ रखा गया है। ‘एक भी पुरुष’ विनाश की संपूर्णता को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘वध’ मूल क्रिया की कठोरता बचाता है, जबकि छोटे, सीधे वाक्य सामान्य पाठक के लिए स्पष्टता बनाए रखते हैं।
