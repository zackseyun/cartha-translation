translation:
  language: hi
  text: येहू ने शोमरोन में इस्राएल पर अट्ठाईस वर्ष राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר
  choice: '[समूचे वाक्य को स्वाभाविक अवधि-वाचक रूप में व्यक्त किया]'
  rationale: शाब्दिक अर्थ ‘और वे दिन जो’ है, पर राजकीय सारांश में यह मुहावरा शासन की अवधि बताता है। हिंदी में ‘अट्ठाईस वर्ष राज्य किया’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: यह राजकीय संदर्भ में מלך का मानक और स्पष्ट हिंदी रूप है तथा केवल सामान्य शासन नहीं, राजत्व को व्यक्त करता है।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: מלך के साथ עַל उस प्रजा या राज्य को सूचित करता है जिस पर राजा ने राज्य किया।
- source_word: עֶשְׂרִים וּשְׁמֹנֶה שָׁנָה
  choice: अट्ठाईस वर्ष
  rationale: संख्या और अवधि का सीधा, आधुनिक हिंदी रूप।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में रहकर
  rationale: स्थानवाचक בְּ का अर्थ ‘शोमरोन में’ है। ‘रहकर’ जोड़ने से यह स्पष्ट और स्वाभाविक होता है कि शोमरोन उसके शासन का केंद्र था, न कि इस्राएल केवल वहीं स्थित था।
