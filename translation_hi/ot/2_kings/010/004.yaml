base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/004.yaml
  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
translation:
  language: hi
  text: पर वे बहुत, बहुत डर गए और कहने लगे, “देखो, वे दोनों राजा उसके सामने टिक नहीं सके; फिर हम कैसे टिकेंगे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: वे डर गए
  rationale: ירא के कथात्मक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और घटनाक्रम में उत्पन्न भय को स्पष्ट रखता है।
- source_word: מְאֹד מְאֹד
  choice: बहुत, बहुत
  rationale: दोहराए गए क्रियाविशेषण की तीव्रता और इब्रानी की आलंकारिक पुनरावृत्ति दोनों सुरक्षित रहती हैं।
- source_word: הִנֵּה
  choice: देखो
  rationale: आगे कही जाने वाली बात की ओर ध्यान खींचने वाला स्वाभाविक और वर्तमान हिन्दी प्रयोग है।
- source_word: שְׁנֵי הַמְּלָכִים
  choice: वे दोनों राजा
  rationale: निश्चित पद पूर्वप्रसंग में उल्लिखित दोनों राजाओं की ओर संकेत करता है; ‘वे’ इस संदर्भसूचकता को हिन्दी में सहज बनाता है।
- source_word: לֹא עָמְדוּ לְפָנָיו
  choice: उसके सामने टिक नहीं सके
  rationale: עמד לפני का प्रसंगगत अर्थ विरोध में ठहर या सामना कर सकना है। ‘टिक नहीं सके’ इस अर्थ को स्वाभाविक हिन्दी में देता है और ‘सामने’ मूल बिंब को बनाए रखता है।
- source_word: וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  choice: फिर हम कैसे टिकेंगे?
  rationale: ‘फिर’ पूर्व कथन से निकलने वाले निष्कर्ष को व्यक्त करता है; ‘टिकेंगे’ पहले खंड के עמד की पुनरावृत्ति और प्रश्न की भावी/संभाव्य शक्ति को बनाए रखता है।
