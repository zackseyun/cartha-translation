base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
translation:
  language: hi
  text: जब उसने होमबलि चढ़ाना समाप्त किया, तब येहू ने अंगरक्षकों और सैन्य अधिकारियों से कहा, “भीतर जाओ और उन्हें मार डालो; एक भी आदमी बाहर न निकलने पाए।” तब उन्होंने उन्हें तलवार की धार से मार डाला। अंगरक्षकों और सैन्य अधिकारियों ने उन्हें बाहर फेंक दिया और बाल के भवन के भीतरी परिसर[a] तक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “बाल के भवन के नगर/दुर्ग तक”; इसका अर्थ मंदिर-परिसर का कोई भीतरी किलाबंद या पवित्र भाग हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לַעֲשׂוֹת הָעֹלָה
  choice: जब उसने होम-बलि चढ़ाना समाप्त किया
  rationale: כְּ के साथ infinitive construct समयसूचक है—‘जब उसने समाप्त किया’; עֹלָה के लिए प्रचलित और यज्ञ-संबंधी विशिष्ट पद ‘होम-बलि’ रखा गया है।
- source_word: לָרָצִים
  choice: अंगरक्षकों
  rationale: रָצִים का शाब्दिक अर्थ ‘दौड़नेवाले’ है, पर राजकीय संदर्भ में यह राजा के अंगरक्षकों अथवा संदेशवाहक सैनिकों के लिए प्रयुक्त होता है; यहाँ सशस्त्र कार्रवाई के कारण ‘अंगरक्षकों’ स्वाभाविक है।
- source_word: לַשָּׁלִשִׁים
  choice: सैन्य अधिकारियों
  rationale: שָׁלִישׁ किसी उच्च सैनिक अथवा रथ-संबंधी अधिकारी को सूचित कर सकता है; ‘सैन्य अधिकारी’ पद को अनावश्यक रूप से संकीर्ण किए बिना भूमिका स्पष्ट करता है।
- source_word: בֹּאוּ הַכּוּם
  choice: भीतर जाओ और उन्हें मार डालो
  rationale: בֹּאוּ इस प्रसंग में भवन में प्रवेश करने की आज्ञा है; נכה यहाँ तलवार से घातक प्रहार का सूचक है, इसलिए ‘मार डालो’ परिणाम और आदेश की तीव्रता स्पष्ट करता है।
- source_word: אִישׁ אַל יֵצֵא
  choice: एक भी आदमी बाहर न निकलने पाए
  rationale: एकवचन אִישׁ का यहाँ वितरणात्मक अर्थ है; यह हिन्दी में निषेधात्मक आदेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: शाब्दिक मुहावरा ‘तलवार के मुँह से’ है; ‘तलवार की धार से’ हिन्दी का सजीव और अर्थसंगत समतुल्य है।
- source_word: וַיַּשְׁלִכוּ
  choice: उन्हें बाहर फेंक दिया
  rationale: क्रिया का अर्थ ‘फेंकना’ है; कर्म और बाहर की दिशा प्रसंग से ग्रहण की गई है, जहाँ वध के बाद शव हटाए जा रहे हैं।
- source_word: עַד עִיר בֵּית־הַבָּעַל
  choice: बाल के भवन के भीतरी दुर्ग[a] तक
  rationale: עִיר सामान्यतः ‘नगर’ है, पर इस मंदिर-परिसर के स्थापत्य संदर्भ में किसी भीतरी सुरक्षित या दुर्गनुमा भाग का संकेत दे सकता है। मुख्य पाठ में प्रसंगानुकूल अर्थ और पादटिप्पणी में शाब्दिक अनिश्चितता सुरक्षित रखी गई है।
