  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: The rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: येहू के बाकी काम, और उसने जो कुछ किया, और उसका सारा पराक्रम[a]—क्या वे इस्राएल के राजाओं के इतिहास-वृत्तांत की पुस्तक[b] में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सभी पराक्रमी कार्य।”
    reason: lexical_alternative
  - marker: b
    text: यह इस्राएल के राजाओं के राजकीय वार्षिक अभिलेखों का उल्लेख है; यह आवश्यक नहीं कि इसका आशय बाइबल की इतिहास-वृत्तांत की पुस्तकों से हो।
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  choice: येहू के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में דִּבְרֵי का आशय केवल ‘बातों’ से नहीं, बल्कि राजा के कामों और शासन-संबंधी वृत्तांत से है। ‘बाकी काम’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: यह כָל की व्यापकता और इब्रानी संबंधवाचक उपवाक्य दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: וְכָל גְּבוּרָתוֹ
  choice: और उसका सारा पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, वीरता अथवा उस सामर्थ्य से किए गए पराक्रमी कामों को सूचित कर सकता है। ‘पराक्रम’ इसकी संक्षिप्तता और अर्थगत विस्तार को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में नकारात्मक प्रश्न उसका रूप और बल सुरक्षित रखता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: इतिहास की पुस्तक में
  rationale: शाब्दिक रूप से ‘दिनों के वृत्तांत की पुस्तक’ राजकीय वार्षिक अभिलेख को दर्शाता है। ‘इतिहास की पुस्तक’ सामान्य पाठक के लिए स्वाभाविक है, जबकि स्रोत की प्रकृति पादटिप्पणी में स्पष्ट की गई है।
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के
  rationale: शीर्षक-सूत्र में לְ संबंध प्रकट करता है; हिन्दी में संबंधकारक ‘के’ उपयुक्त है।
