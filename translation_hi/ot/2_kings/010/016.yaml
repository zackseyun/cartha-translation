  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
translation:
  language: hi
  text: तब उसने कहा, “मेरे साथ चलो और याहवे के लिए मेरा उत्साह[a] देखो।” तब उन्होंने उसे उसके रथ में बैठा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के लिए मेरी जलन।” इब्रानी संज्ञा प्रसंग के अनुसार उत्साह या जलन, दोनों अर्थ व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה אִתִּי
  choice: मेरे साथ चलो
  rationale: הלך का एकवचन आज्ञार्थक यहाँ साथ आने के निमंत्रण के रूप में प्रयुक्त है। आधुनिक हिन्दी में “मेरे साथ चलो” स्वाभाविक और सीधा है।
- source_word: וּרְאֵה
  choice: और ... देखो
  rationale: ראה के आज्ञार्थक का सीधा अर्थ “देखो” है; इससे येहू का अपने उत्साह को प्रत्यक्ष दिखाने का दावा बना रहता है।
- source_word: בְּקִנְאָתִי
  choice: मेरा उत्साह
  rationale: קִנְאָה प्रसंग के अनुसार उत्साह, प्रबल निष्ठा या ईर्ष्यापूर्ण जलन व्यक्त कर सकता है। यहाँ याहवे के प्रति सक्रिय निष्ठा के दावे के लिए “उत्साह” सबसे स्वाभाविक है, जबकि दूसरी सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל संबंध अथवा लक्ष्य बताता है, और יהוה को उसके व्यक्तिगत वाचा-नाम “याहवे” के रूप में रखा गया है।
- source_word: וַיַּרְכִּיבוּ אֹתוֹ
  choice: उन्होंने उसे ... चढ़ा लिया
  rationale: רכב का हिफ़ील रूप सवारी करवाने या वाहन पर चढ़ाने का अर्थ देता है। क्रिया का बहुवचन “उन्होंने” के रूप में सुरक्षित रखा गया है, भले ही निकट प्रसंग में इसका कर्ता स्पष्ट नहीं है।
- source_word: בְּרִכְבּוֹ
  choice: उसके रथ पर
  rationale: רֶכֶב यहाँ रथ है और प्रत्यय एकवचन पुल्लिंग स्वामित्व बताता है। हिन्दी में रथ के साथ “पर चढ़ा लिया” स्वाभाविक प्रयोग है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। “याहवे” नाम को प्रत्यक्ष रखता है; “प्रभु” नाम को उपाधि में बदल देता, और “यहोवा” अपेक्षाकृत उत्तरकालीन स्वर-संयोग पर आधारित रूप है।
- issue: קִנְאָה में उत्साह और ईर्ष्यापूर्ण जलन का तनाव
  choice: मुख्य पाठ में “उत्साह,” वैकल्पिक अर्थ पाद-टिप्पणी में
  alternative: मेरी जलन; मेरी ईर्ष्यापूर्ण निष्ठा
  rationale: प्रसंग येहू के याहवे के लिए प्रबल सक्रिय समर्पण के दावे की ओर संकेत करता है, पर इब्रानी शब्द में जलन/ईर्ष्या का अर्थ भी सम्भव है। पाद-टिप्पणी उस वास्तविक अर्थ-व्याप्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में “चलो” और “देखो” सामान्य हिन्दी के स्वाभाविक आज्ञार्थक हैं। अंतिम क्रिया का इब्रानी बहुवचन “उन्होंने” जानबूझकर सुरक्षित रखा गया है।
