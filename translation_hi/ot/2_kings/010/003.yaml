source:
  edition: WLC
  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
translation:
  language: hi
  text: तब अपने स्वामी के पुत्रों में से जो सबसे अच्छा और सबसे सीधा हो, उसे चुनो[a], उसे उसके पिता की राजगद्दी पर बैठाओ, और अपने स्वामी के राजघराने[b] के लिए लड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “देखो कि तुम्हारे स्वामी के पुत्रों में सबसे अच्छा और सबसे सीधा कौन है।” यहाँ “देखना” परखकर चुनने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: “राजघराना” से आशय शासक का घराना या राजवंश है, केवल कोई भवन नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: उसे चुनो
  rationale: क्रिया का मूल अर्थ ‘देखना’ है, पर इस प्रसंग में उम्मीदवारों को परखकर चुनने का भाव है। हिंदी में ‘चुनो’ अपेक्षित कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: जो सबसे अच्छा और योग्य हो
  rationale: दोनों विशेषण चयन के संदर्भ में गुण और उपयुक्तता बताते हैं। ‘सबसे अच्छा’ संदर्भगत श्रेष्ठता को और ‘योग्य’ शासन के लिए उचित होने को सहज हिंदी में व्यक्त करता है, बिना नैतिक आयाम को पूरी तरह मिटाए।
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  choice: अपने स्वामी के पुत्रों में से
  rationale: מִן चयन के समूह को सूचित करता है। אֲדֹנֵיכֶם का संदर्भ मानवीय राजकीय स्वामी से है, इसलिए ‘स्वामी’ उपयुक्त है।
- source_word: וְשַׂמְתֶּם עַל כִּסֵּא אָבִיו
  choice: उसे उसके पिता की राजगद्दी पर बैठाओ
  rationale: यह मुहावरा उसे उत्तराधिकारी राजा के रूप में स्थापित करने को दर्शाता है। ‘राजगद्दी पर बैठाओ’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: וְהִלָּחֲמוּ עַל בֵּית אֲדֹנֵיכֶם
  choice: अपने स्वामी के राजघराने के लिए लड़ो
  rationale: בֵּית यहाँ भवन नहीं, शासक का घराना या राजवंश है। ‘राजघराना’ इस प्रसंगगत अर्थ को मुख्य पाठ में स्पष्ट करता है।
theological_decisions:
- issue: אֲדֹנֵיכֶם का संबोधन
  choice: स्वामी
  alternative: प्रभु / मालिक
  rationale: यहाँ शब्द परमेश्वर के लिए नहीं, मानवीय राजकीय अधिपति के लिए प्रयुक्त है। ‘स्वामी’ गरिमापूर्ण है और दिव्य उपाधि से अनावश्यक भ्रम नहीं पैदा करता।
- issue: הַיָּשָׁר का अर्थ
  choice: योग्य
  alternative: सीधा / धर्मी / उचित
  rationale: शब्द में ‘सीधा, सही, उचित’ का नैतिक भाव हो सकता है, किंतु यहाँ राजकीय उम्मीदवार के चयन का प्रसंग है। ‘योग्य’ उस संदर्भगत उपयुक्तता को व्यक्त करता है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; कथात्मक संदर्भ के अनुरूप स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज। बहुवचन आज्ञाओं को हिंदी के प्रचलित सामूहिक संबोधन ‘चुनो… बैठाओ… लड़ो’ से व्यक्त किया गया है।
