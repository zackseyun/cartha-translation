  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
translation:
  language: hi
  text: येहू वहाँ से आगे बढ़ा और उसे रेकाब का पुत्र यहोनादाब उससे मिलने आता हुआ मिला। उसने उसका अभिवादन किया[a] और उससे कहा, “क्या तुम्हारा हृदय मेरे प्रति उतना ही खरा है, जितना मेरा हृदय तुम्हारे प्रति है?”[b] यहोनादाब ने कहा, “हाँ, है।” येहू ने कहा, “यदि ऐसा है, तो अपना हाथ मुझे दो।”[c] यहोनादाब ने अपना हाथ उसे दिया, और येहू उसे अपने रथ में अपने पास चढ़ा ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसे आशीर्वाद दिया।” हिब्रू क्रिया का अर्थ “आशीर्वाद देना” भी है, पर इस भेंट के प्रसंग में सम्भवतः इसका अर्थ अभिवादन करना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्या तुम्हारा हृदय सीधा है, जैसे मेरा हृदय तुम्हारे हृदय के साथ है?” यह वाक्य पारस्परिक निष्ठा या उद्देश्य की एकता का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “है, और है; अपना हाथ दो” है। इसे “हाँ, निश्चय ही है” जैसी जोरदार पुष्टि मानकर अगला कथन येहू का समझा जा सकता है; अथवा दूसरे “है” को “यदि ऐसा है” के अर्थ में लेकर वर्तमान मुख्य-पाठ की तरह पढ़ा जा सकता है।
    reason: textual_ambiguity
