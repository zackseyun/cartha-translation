- source_word: וַיִּמְצָא אֶת־יְהוֹנָדָב בֶּן־רֵכָב לִקְרָאתוֹ
  choice: उसे रेकाब का पुत्र यहोनादाब उससे मिलने आता हुआ मिला
  rationale: מצא का मूल भाव ‘मिलना/पाना’ रखा गया है और לִקְרָאתוֹ से यह स्पष्ट किया गया है कि यहोनादाब उसकी ओर मिलने आ रहा था।
- source_word: וַיְבָרְכֵהוּ
  choice: उसने उसका अभिवादन किया
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ है, पर भेंट के इस प्रसंग में यह अभिवादन करने के अर्थ में प्रयुक्त हो सकता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הֲיֵשׁ אֶת־לְבָבְךָ יָשָׁר כַּאֲשֶׁר לְבָבִי עִם־לְבָבֶךָ
  choice: क्या तुम्हारा हृदय मेरे प्रति सच्चा है, जैसे मेरा हृदय तुम्हारे प्रति है?
  rationale: हिब्रू में ‘हृदय’ आंतरिक निष्ठा या उद्देश्य का सूचक है और יָשָׁר सीधेपन/खरेपन को व्यक्त करता है। ‘मेरे प्रति सच्चा’ पारस्परिक निष्ठा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
- source_word: יֵשׁ וָיֵשׁ תְּנָה אֶת־יָדֶךָ
  choice: “हाँ, है।” तब उसने कहा, “यदि ऐसा है, तो अपना हाथ मुझे दो।”
  rationale: पहला יֵשׁ सकारात्मक उत्तर है। दूसरा וָיֵשׁ प्रसंग में ‘और यदि ऐसा है’ के रूप में समझा जा सकता है, जिसके बाद हाथ देने की आज्ञा आती है। पाठ की दूसरी सम्भव समझ—दोहराकर जोर देना—पादटिप्पणी में दी गई है।
- source_word: וַיִּתֵּן יָדוֹ
  choice: उसने अपना हाथ उसे दिया
  rationale: यह תְּנָה אֶת־יָדֶךָ का सीधा प्रत्युत्तर है और हाथ बढ़ाने अथवा सहमति प्रकट करने की क्रिया को बनाए रखता है।
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל־הַמֶּרְכָּבָה
  choice: उसने उसे अपने पास रथ पर चढ़ा लिया
  rationale: עלה का हिफ़ील रूप किसी को ऊपर चढ़ाने का भाव देता है; אֵלָיו से ‘अपने पास’ और אֶל־הַמֶּרְכָּבָה से रथ पर चढ़ाने का स्थान व्यक्त होता है।
theological_decisions:
- issue: यहोनादाब के उत्तर के बाद וָיֵשׁ का अर्थ और वक्ता
  choice: इसे अगले कथन से जोड़कर ‘यदि ऐसा है’ समझा गया है और वक्ता को अस्पष्ट सर्वनाम ‘उसने’ से व्यक्त किया गया है।
  alternative: इसे यहोनादाब के उत्तर की जोरदार पुनरुक्ति—‘है, निश्चय ही है’—समझा जा सकता है; इसके बाद ‘अपना हाथ मुझे दो’ कहने वाला प्रसंगतः येहू है।
  rationale: हिब्रू में प्रत्यक्ष रूप से नया वक्ता नहीं बताया गया और וָיֵשׁ दोनों प्रकार से समझा गया है। मुख्य पाठ एक प्राचीन और संदर्भ-संगत व्याख्या देता है, जबकि पादटिप्पणी वास्तविक पाठगत/वाक्यगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘हृदय’ बाइबलीय रूपक को बनाए रखता है, जबकि ‘मेरे प्रति सच्चा’ उसका आशय सामान्य पाठक के लिए स्पष्ट करता है। अन्तिम वाक्यों में हिब्रू के समान सर्वनाम रखे गए हैं; स्पष्टता के लिए अनावश्यक रूप से ‘येहू’ नहीं जोड़ा गया।
