  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
translation:
  language: hi
  text: यहू की भेंट यहूदा के राजा अहज्याह के भाइयों[a] से हुई। उसने पूछा, “तुम कौन हो?” उन्होंने उत्तर दिया, “हम अहज्याह के भाई हैं। हम राजा के बेटों और राजमाता[c] के बेटों का कुशल-क्षेम पूछने[b] नीचे आए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाई” का अर्थ निकट संबंधी या एक ही राजवंश के पुरुष भी हो सकता है; केवल सगे भाई होना आवश्यक नहीं।
    reason: lexical_alternative
  - marker: b
    text: या “यह देखने कि राजा के बेटे और राजमाता के बेटे कुशल से हैं या नहीं।”
    reason: lexical_alternative
  - marker: c
    text: “राजमाता” इब्रानी शब्द गबीरा का अनुवाद है, जो राजदरबार में राजा की माता की उपाधि थी।
    reason: cultural_note
lexical_decisions:
- source_word: מָצָא
  choice: भेंट हुई
  rationale: यहाँ क्रिया का अर्थ रास्ते में मिलने या सामना होने से है। ‘भेंट हुई’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत encounter का भाव स्पष्ट करती है।
- source_word: אֲחֵי אֲחַזְיָהוּ
  choice: अहज्याह के भाई
  rationale: मूल इब्रानी में ‘भाई’ है। राजकीय वंश-वर्णन में इसका अर्थ निकट संबंधी भी हो सकता है, इसलिए मूल शब्द मुख्य पाठ में रखकर व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: राजकीय उपाधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מִי אַתֶּם
  choice: तुम कौन हो?
  rationale: मूल के संक्षिप्त प्रत्यक्ष प्रश्न का सहज आधुनिक हिन्दी रूप।
- source_word: וַנֵּרֶד
  choice: हम ... नीचे आए हैं
  rationale: भौगोलिक उतरने की गति को बनाए रखते हुए वक्ताओं के दृष्टिकोण से स्वाभाविक संवादात्मक रूप चुना गया है।
- source_word: לִשְׁלוֹם
  choice: कुशल-क्षेम पूछने
  rationale: इस प्रसंग में अभिव्यक्ति किसी के हाल-चाल या भलाई की जानकारी लेने का संकेत देती है; केवल अभिवादन करना इसका पूरा भाव नहीं देता।
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: राजा के बेटे
  rationale: इब्रानी की पुरुषवाचक संज्ञा को सामान्यीकृत किए बिना स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: הַגְּבִירָה
  choice: राजमाता
  rationale: यहूदा के राजदरबार के प्रसंग में यह शब्द राजा की माता की संस्थागत उपाधि है; ‘राजमाता’ हिन्दी में इसका सटीक और संक्षिप्त रूप है।
- source_word: וּבְנֵי הַגְּבִירָה
  choice: राजमाता के बेटे
  rationale: मूल पाठ में राजा के बेटों के समानांतर एक अलग पदबंध है, इसलिए संभावित संदर्भगत समानता के बावजूद इसे अलग ही रखा गया है।
