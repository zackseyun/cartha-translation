  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध भौगोलिक वर्णन। यह पद पिछले पद की क्रिया को आगे बढ़ाता है; इसलिए इसे जानबूझकर एक वाक्यांश के रूप में रखा गया है। जनजातीय नामों को हिन्दी बहुवचन में और स्थान-नामों को प्रचलित बाइबलीय लिप्यंतरण में दिया गया है।
