base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/033.yaml
  text: from the Jordan eastward[a], all the land of Gilead—the Gadites, the Reubenites, and the Manassites—from Aroer, which is by the Arnon Valley, even Gilead and Bashan.
translation:
  language: hi
  text: यरदन से पूर्व की ओर, गिलाद का सारा देश—गादियों, रूबेनियों और मनश्शेइयों का देश—अरोएर से, जो अर्नोन की घाटी[a] के पास है, तथा गिलाद और बाशान तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्नोन के नाले के पास”; इब्रानी शब्द का अर्थ घाटी, वादी या मौसमी जलधारा का पाट भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַיַּרְדֵּן מִזְרַח הַשֶּׁמֶשׁ
  choice: यरदन के पूर्व में
  rationale: शाब्दिक भाव ‘यरदन से सूर्य के उदय की दिशा में’ है। भौगोलिक वर्णन में ‘यरदन के पूर्व में’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: אֵת כָּל אֶרֶץ הַגִּלְעָד
  choice: गिलाद का सारा देश
  rationale: אֵת पिछले पद की क्रिया का कर्म सूचित करता है; ‘गिलाद का सारा देश’ क्षेत्रीय नाम और व्यापकता दोनों को बनाए रखता है।
- source_word: הַגָּדִי וְהָרֻאובֵנִי וְהַמְנַשִּׁי
  choice: गादियों, रूबेनियों और मनश्शेइयों का क्षेत्र
  rationale: ये एकवचन रूप में आए जातिवाचक विशेषण सामूहिक रूप से तीन गोत्रों के निवास-क्षेत्र को बताते हैं। ‘क्षेत्र’ जोड़ने से हिन्दी में उनका पिछले वाक्यांश से संबंध स्पष्ट होता है।
- source_word: מֵעֲרֹעֵר
  choice: अरोएर से
  rationale: מִן भौगोलिक सीमा का आरम्भ-बिंदु बताता है; स्थान-नाम का प्रचलित लिप्यंतरण ‘अरोएर’ रखा गया है।
- source_word: אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: अर्नोन की घाटी के पास के
  rationale: עַל यहाँ स्थान-संबंध में ‘के पास’ हो सकता है। נַחַל घाटी, वादी अथवा मौसमी जलधारा के पाट को दर्शा सकता है; मुख्य पाठ में सहज ‘घाटी’ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְהַגִּלְעָד וְהַבָּשָׁן
  choice: गिलाद और बाशान तक
  rationale: अंतिम दो क्षेत्रनाम भूभाग के विस्तार को पूरा करते हैं। हिन्दी में ‘तक’ आरम्भ-बिंदु ‘अरोएर से’ के साथ स्वाभाविक सीमा-रचना बनाता है, जबकि संयोजक का योगात्मक बल बना रहता है।
