base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
translation:
  language: hi
  text: 'तब राजमहल के अधिकारी, नगर के अधिकारी, पुरनियों और संरक्षकों[a] ने येहू के पास यह संदेश भेजा: “हम आपके सेवक हैं। आप हमसे जो कुछ कहेंगे, हम करेंगे। हम किसी को राजा नहीं बनाएँगे। जो आपकी दृष्टि में अच्छा हो, वही कीजिए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पालक पिता” अथवा “देखभाल करने वाले।” इब्रानी शब्द उन लोगों के लिए है जिन्हें राजकुमारों की देखभाल सौंपी गई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: राजमहल के अधिकारी
  rationale: यह पदबंध राजघराने अथवा महल का प्रबंध सँभालने वाले अधिकारी को सूचित करता है। हिंदी में यह सहज है और पद के सटीक स्वरूप को आवश्यकता से अधिक निर्धारित नहीं करता।
- source_word: וַאֲשֶׁר עַל הָעִיר
  choice: नगर के अधिकारी
  rationale: इब्रानी में यह औपचारिक पदनाम के बजाय नगर पर नियुक्त अधिकारी का वर्णन है; इसलिए सामान्य पद-वर्णन बनाए रखा गया है।
- source_word: הַזְּקֵנִים
  choice: पुरनियों
  rationale: यह इस्राएली समाज के मान्य वरिष्ठ अगुओं की सामाजिक-राजनीतिक भूमिका के लिए प्रचलित बाइबलीय हिंदी शब्द है।
- source_word: הָאֹמְנִים
  choice: राजकुमारों के संरक्षकों
  rationale: संदर्भ में ये अहाब के राजवंशीय पुत्रों की देखभाल के लिए नियुक्त व्यक्ति हैं। 'संरक्षक' पालन-पोषण और अभिरक्षा दोनों की व्यापकता रखता है; 'राजकुमारों के' संदर्भ को स्पष्ट करता है।
- source_word: עֲבָדֶיךָ
  choice: आपके सेवक
  rationale: यहाँ यह राजनीतिक अधीनता और विनम्रता व्यक्त करने वाला आत्म-संबोधन है, दासत्व की कानूनी स्थिति पर बल नहीं।
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלֵינוּ נַעֲשֶׂה
  choice: आप हमसे जो कुछ कहेंगे, हम करेंगे
  rationale: प्रत्यक्ष और स्वाभाविक हिंदी में आज्ञापालन की पूर्ण प्रतिज्ञा सुरक्षित रहती है।
- source_word: לֹא נַמְלִיךְ אִישׁ
  choice: हम किसी को राजा नहीं बनाएँगे
  rationale: हिफ़ील रूप के कारणवाचक अर्थ—किसी को राजपद पर स्थापित करना—को सीधे व्यक्त किया गया है।
- source_word: הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: जो आपकी दृष्टि में अच्छा हो, वही कीजिए
  rationale: मूल इब्रानी मुहावरे 'आँखों में अच्छा' को गरिमापूर्ण और समझने योग्य हिंदी 'दृष्टि में अच्छा' से सुरक्षित रखा गया है।
