  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
translation:
  language: hi
  text: वे बलिदान और होमबलि चढ़ाने के लिए भीतर गए। येहू ने बाहर अस्सी आदमी तैनात कर रखे थे और कहा, “यदि उन आदमियों में से कोई, जिन्हें मैं तुम्हारे हाथों में सौंप रहा हूँ, तुम्हारे पहरे से भाग निकले, तो उसके प्राण उस भाग निकलने वाले के प्राण के बदले लिए जाएँगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके प्राण के बदले उसके प्राण।” आशय यह है कि जिस पहरेदार के पहरे से कोई व्यक्ति भाग निकलेगा, उस भाग निकलने वाले के प्राण के बदले पहरेदार के प्राण लिए जाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: वे ... भीतर गए
  rationale: בוא का प्रसंगानुसार अर्थ भवन या उपासना-स्थल के भीतर जाना है; ‘भीतर गए’ स्वाभाविक हिन्दी में दिशा स्पष्ट करता है।
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלוֹת
  choice: बलिदान और होमबलि चढ़ाने के लिए
  rationale: עשה बलिदान-संबंधी कर्म में ‘चढ़ाना/अर्पित करना’ व्यक्त करता है; זְבָחִים के लिए ‘बलिदान’ और עֹלוֹת के लिए प्रचलित विशिष्ट पद ‘होमबलि’ रखा गया है।
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  choice: बाहर अपने लिए अस्सी पुरुष तैनात कर रखे थे
  rationale: שׂים का सुरक्षा-संदर्भ में अर्थ तैनात करना है। לוֹ को ‘अपने लिए’ से बनाए रखा गया है और אִישׁ को पाठ से अधिक विशिष्ट ‘सैनिक’ न बनाकर ‘पुरुष’ कहा गया है।
- source_word: הָאִישׁ אֲשֶׁר יִמָּלֵט מִן הָאֲנָשִׁים
  choice: यदि तुममें से किसी के हाथ से उन पुरुषों में से कोई बच निकला
  rationale: मूल कथन पहरेदार की जिम्मेदारी में होने वाले पलायन को व्यक्त करता है। हिन्दी मुहावरा ‘किसी के हाथ से ... बच निकलना’ इस उत्तरदायित्व को स्वाभाविक रूप से व्यक्त करता है, बिना מלט को प्रत्यक्ष रूप से सकर्मक बनाए।
- source_word: אֲשֶׁר אֲנִי מֵבִיא עַל יְדֵיכֶם
  choice: जिन्हें मैं तुम्हारे हाथों में सौंप रहा हूँ
  rationale: ‘हाथों में लाना’ अधिकार और निगरानी में सौंपने का इब्रानी मुहावरा है; ‘तुम्हारे हाथों में सौंपना’ अर्थ और मूल बिंब दोनों रखता है।
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  choice: उसके प्राण के बदले तुम्हारे प्राण लिए जाएँगे
  rationale: 'נפש यहाँ जीवन/प्राण को दर्शाता है और תחת प्रतिस्थापन का भाव देता है। संदर्भानुसार सर्वनामों को स्पष्ट किया गया है: ‘उसके’ से भागने वाला और ‘तुम्हारे’ से उत्तरदायी पहरेदार अभिप्रेत है।'
