  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
translation:
  language: hi
  text: जब वह पत्र उनके पास पहुँचा, तब उन्होंने राजा के पुत्रों को लिया और उन सत्तर पुरुषों को मार डाला। फिर उन्होंने उनके सिर पात्रों में रखे[a] और उन्हें यिज्रेल में उसके पास भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टोकरियों में,” “हाँडियों में,” अथवा “मर्तबानों में”; इब्रानी शब्द विभिन्न प्रकार के पात्रों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
