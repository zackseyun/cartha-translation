- source_word: שִׁבְעִים אִישׁ
  choice: उन सत्तर पुरुषों
  rationale: אִישׁ पुरुष व्यक्तियों की गणना करता है; ‘उन’ से स्पष्ट होता है कि संख्या राजा के पुत्रों की है।
- source_word: רָאשֵׁיהֶם
  choice: उनके सिर
  rationale: मूल के प्रत्यक्ष और वीभत्स अर्थ को बिना नरम किए रखा गया है।
- source_word: בַּדּוּדִים
  choice: बड़े बरतनों में
  rationale: דּוּד विभिन्न प्रकार के पात्र, जैसे टोकरी, हाँडी या मर्तबान, का संकेत दे सकता है; सामान्य अभिव्यक्ति मूल की अनिश्चितता बचाती है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: सर्वनाम का संकेत तत्काल संदर्भ में येहू की ओर है; मूल की सर्वनामात्मक अभिव्यक्ति रखी गई है।
- source_word: יִזְרְעֶאלָה
  choice: यिज्रेल में
  rationale: दिशासूचक रूप यिज्रेल की ओर भेजे जाने को बताता है; हिंदी में ‘यिज्रेल में उसके पास भेज दिया’ गंतव्य और वहाँ उपस्थित व्यक्ति दोनों को स्वाभाविक रूप से व्यक्त करता है।
