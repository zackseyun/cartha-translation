base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/027.yaml
  text: They tore down the pillar of Baal[a], and they tore down the house of Baal, and made it a latrine to this day.
translation:
  language: hi
  text: उन्होंने बाल के पूजा-स्तंभ को ढा दिया और बाल के भवन[a] को भी ढा दिया। फिर उन्होंने उसे शौचालय बना दिया, और वह आज तक वैसा ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाल के मंदिर।” इब्रानी में शाब्दिक रूप से “बाल का घर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  choice: ढा दिया
  rationale: נתץ किसी संरचना या उपासना-वस्तु को बलपूर्वक गिराने अथवा नष्ट करने को व्यक्त करता है। ‘ढा दिया’ पूजा-स्तंभ और भवन—दोनों के लिए स्वाभाविक और स्पष्ट है।
- source_word: מַצְּבַת
  choice: पूजा-स्तंभ
  rationale: מַצֵּבָה यहाँ बाल से जुड़ा खड़ा पवित्र पत्थर या स्तंभ है। केवल ‘स्तंभ’ की अपेक्षा ‘पूजा-स्तंभ’ उसके उपासना-संबंधी कार्य को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: הַבָּעַל
  choice: बाल
  rationale: यह कनानी देवता का नाम अथवा उपाधि है; हिंदी में प्रचलित लिप्यंतरण ‘बाल’ रखा गया है।
- source_word: בֵּית הַבַּעַל
  choice: बाल का भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और इस उपासना-संदर्भ में मंदिर भी हो सकता है। ‘भवन’ मूल अभिव्यक्ति की व्यापकता बनाए रखता है; ‘मंदिर’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: וַיְשִׂמֻהוּ
  choice: उसे … बना दिया
  rationale: שׂוּם के साथ ל किसी वस्तु को किसी रूप या उपयोग में बदल देने का अर्थ देता है। हिंदी में यह संरचना सीधी और स्वाभाविक है।
- source_word: למחראות
  choice: शौचालय
  rationale: यह शब्द मलत्याग के स्थान को दर्शाता है। ‘शौचालय’ आधुनिक हिंदी में स्पष्ट है और स्थल के जानबूझकर किए गए अपवित्रीकरण को बिना अनावश्यक शिष्टोक्ति के व्यक्त करता है।
- source_word: עַד הַיּוֹם
  choice: आज तक
  rationale: यह इब्रानी मुहावरा कथाकार के समय तक स्थिति बने रहने को दर्शाता है; ‘आज तक’ इसका स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: בֵּית הַבַּעַל का अर्थ
  choice: बाल का भवन
  alternative: बाल का मंदिर
  rationale: उपासना-संदर्भ में ‘मंदिर’ अर्थ की दृष्टि से उचित है, पर ‘भवन’ इब्रानी ‘घर/भवन’ की अभिव्यक्ति और उसकी कुछ व्यापकता को बनाए रखता है। इससे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
- issue: למחראות द्वारा व्यक्त अपवित्रीकरण
  choice: शौचालय
  alternative: मलत्याग का स्थान
  rationale: पाठ बाल के उपासना-स्थल के पूर्ण अपमान और अपवित्रीकरण को सीधे व्यक्त करता है। आधुनिक पाठक के लिए ‘शौचालय’ स्पष्ट, गरिमापूर्ण और पर्याप्त रूप से प्रत्यक्ष है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘पूजा-स्तंभ’ से सांस्कृतिक वस्तु की प्रकृति स्पष्ट होती है, जबकि ‘भवन’ के साथ पादटिप्पणी मूल इब्रानी और संदर्भगत अर्थ दोनों सुरक्षित रखती है।
