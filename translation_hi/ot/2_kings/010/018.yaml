  text: तब येहू ने सब लोगों को इकट्ठा करके उनसे कहा[a], “अहाब ने बाल की थोड़ी सेवा की[b]; येहू उसकी सेवा बहुत करेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'संदर्भ में येहू का यह कथन व्यंग्यपूर्ण है: वह कहता है कि वह बाल की सेवा “बहुत” करेगा, पर आगे का वृत्तांत दिखाता है कि यह बाल के उपासकों को इकट्ठा करने की चाल थी।'
    reason: cross_reference
  - marker: b
    text: या “बाल की थोड़ी उपासना की”; यहाँ “सेवा करना” अनुवादित हिब्रू क्रिया धार्मिक उपासना या भक्ति के अर्थ में भी प्रयुक्त होती है। इसी प्रकार आगे “उसकी उपासना बहुत करेगा” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
