- source_word: כָּל הָעָם
  choice: सब लोगों को
  rationale: यह पद व्यापक रूप से ‘सारे लोगों’ को सूचित करता है; ‘सब लोगों’ से इसकी व्यापकता बनी रहती है।
- source_word: עָבַד אֶת הַבַּעַל
  choice: बाल की सेवा की
  rationale: देवता के साथ עבד धार्मिक सेवा या उपासना को सूचित कर सकता है। ‘सेवा की’ हिब्रू रूपक के अधिक निकट है और धार्मिक अर्थ को संदर्भ में खुला रखता है।
- source_word: מְעָט
  choice: थोड़ी ही
  rationale: यह मात्रा या परिमाण बताता है और הַרְבֵּה के साथ तीखा विरोध बनाता है। ‘ही’ हिन्दी में कथन के व्यंग्यात्मक जोर को स्वाभाविक बनाता है, बिना उसका अर्थ बदले।
- source_word: יַעַבְדֶנּוּ
  choice: उसकी सेवा करेगा
  rationale: प्रत्यय बाल की ओर संकेत करता है। हिन्दी में ‘उसकी सेवा करेगा’ स्वाभाविक है और मूल के सर्वनाम-संदर्भ को बनाए रखता है।
- source_word: הַרְבֵּה
  choice: बहुत
  rationale: यह क्रियाविशेषण रूप में מְעָט के विपरीत मात्रा बताता है; ‘बहुत’ संक्षिप्त समानांतरता को सुरक्षित रखता है।
- source_word: יֵהוּא
  choice: येहू
  rationale: नाम को प्रचलित हिन्दी बाइबिलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: הַבַּעַל
  choice: बाल
  rationale: हिब्रू में निश्चित उपपद है, पर हिन्दी में इस देवता का नाम सामान्यतः बिना उपपद के ‘बाल’ कहा जाता है।
theological_decisions:
- issue: बाल की सेवा करने के विषय में येहू की घोषणा
  choice: मुख्य पाठ में कथन को सीधे येहू के अपने शब्दों के रूप में प्रस्तुत किया गया है।
  alternative: ‘येहू ने सेवा करने का बहाना किया’ या ‘सेवा करने का दावा किया’ जैसे संकेत जोड़ना।
  rationale: आगे का प्रसंग स्पष्ट करता है कि यह बाल के उपासकों को जुटाने की चाल थी, पर इस पद के हिब्रू शब्द स्वयं केवल उसके कथन को दर्ज करते हैं। इसलिए व्यंग्य और छल का संदर्भ टिप्पणी में दिया गया है, मुख्य पाठ में नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘थोड़ी ही…बहुत’ से मूल की संक्षिप्त विरोधात्मक समानांतरता बनी रहती है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
