base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/009.yaml
  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
translation:
  language: hi
  text: सुबह वह बाहर निकला, खड़ा हुआ और सब लोगों से कहा, “तुम निर्दोष[a] हो। देखो, मैंने अपने स्वामी के विरुद्ध षड्यंत्र किया और उसे मार डाला; पर इन सबको किसने मारा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम धर्मी हो” अथवा “तुम सही हो।” हिब्रू शब्द न्यायी होने या दोष से मुक्त होने—दोनों का भाव दे सकता है; यहाँ सार्वजनिक न्यायिक संदर्भ में “निर्दोष” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: सुबह
  rationale: हिन्दी कथा-शैली में समयसूचक वाक्यांश स्वाभाविक रूप से पद के आरम्भ में आता है; וַיְהִי की कथात्मक भूमिका को अलग से ‘ऐसा हुआ’ कहे बिना क्रम में व्यक्त किया गया है।
- source_word: וַיֵּצֵא וַיַּעֲמֹד
  choice: वह बाहर निकला और खड़ा होकर
  rationale: दोनों क्रमिक क्रियाओं को बनाए रखता है और सार्वजनिक रूप से बोलने की मुद्रा को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सब लोगों
  rationale: व्यापक सार्वजनिक संबोधन का सरल और स्वाभाविक हिन्दी रूप।
- source_word: צַדִּקִים אַתֶּם
  choice: तुम निर्दोष हो
  rationale: צדיק का मूल अर्थ ‘धर्मी/न्यायी’ हो सकता है, पर यहाँ सार्वजनिक और न्यायिक संदर्भ में लोगों को इस हत्या के दोष से मुक्त बताना प्रमुख है। वास्तविक अर्थ-विकल्प को पादटिप्पणी में रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी प्रयोग।
- source_word: קָשַׁרְתִּי עַל
  choice: मैंने ... के विरुद्ध षड्यंत्र किया
  rationale: קשר עם על का राजनीतिक अर्थ किसी के विरुद्ध षड्यंत्र करना है।
- source_word: אֲדֹנִי
  choice: अपने स्वामी
  rationale: यह मानवीय राजकीय अधिकारी के लिए है, परमेश्वर की उपाधि नहीं; ‘स्वामी’ उस संबंध को स्पष्ट रखता है।
- source_word: וָאֶהְרְגֵהוּ
  choice: उसे मार डाला
  rationale: הרג का प्राणघातक अर्थ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וּמִי הִכָּה אֶת כָּל אֵלֶּה
  choice: पर इन सबको किसने मारा?
  rationale: संदर्भ में וּ विरोधात्मक है; נכה यहाँ घातक प्रहार को सूचित करता है। ‘इन सब’ मूल की संदर्भगत खुली अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: צַדִּקִים का नैतिक अथवा न्यायिक आशय
  choice: मुख्य पाठ में ‘निर्दोष’
  alternative: ‘धर्मी’ या ‘तुम ठीक पक्ष में हो’
  rationale: येहू लोगों की सामान्य नैतिक धार्मिकता घोषित नहीं कर रहा, बल्कि हत्याओं के संबंध में उनके दोष की तुलना अपने स्वीकार किए हुए कृत्य से कर रहा है। फिर भी हिब्रू की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
