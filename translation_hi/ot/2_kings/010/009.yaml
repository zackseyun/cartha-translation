  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण सार्वजनिक भाषण। कथात्मक हिब्रू क्रम को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है और अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
