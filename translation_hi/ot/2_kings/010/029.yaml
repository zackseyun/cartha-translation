  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
translation:
  language: hi
  text: फिर भी[a] येहू नबात के पुत्र यारोबाम के उन पापों से नहीं फिरा[b], जिनके द्वारा यारोबाम ने इस्राएल से पाप करवाया था—अर्थात् सोने के वे बछड़े, जो बेतेल और दान में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “केवल”; यहाँ अर्थ “परन्तु” या “फिर भी” है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका अनुसरण करना नहीं छोड़ा”; इब्रानी मुहावरा शाब्दिक रूप से “उनके पीछे से नहीं फिरा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यहाँ यह शब्द पिछली सकारात्मक कार्रवाइयों के बाद एक सीमित करने वाला विरोध प्रस्तुत करता है। आधुनिक हिन्दी में ‘फिर भी’ इस प्रसंगगत बल को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक विकल्प फुटनोट में दिया गया है।
- source_word: חֲטָאֵי
  choice: पापों
  rationale: बहुवचन रचना यारोबाम की उपासना-संबंधी नीति से जुड़े विशिष्ट पापों को सूचित करती है; ‘पापों’ सीधा और पारदर्शी अनुवाद है।
- source_word: הֶחֱטִיא
  choice: पाप करवाया
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है: यारोबाम ने इस्राएल को पाप करने का कारण बनाया।'
- source_word: לֹא סָר ... מֵאַחֲרֵיהֶם
  choice: उन पापों से नहीं फिरा
  rationale: इब्रानी मुहावरे का आशय किसी मार्ग या आचरण को त्याग न देना है। यह हिन्दी में स्वाभाविक है, जबकि अधिक शाब्दिक रूप फुटनोट में सुरक्षित है।
- source_word: עֶגְלֵי הַזָּהָב
  choice: सोने के वे बछड़े
  rationale: यह पद यारोबाम के पापों को ठोस रूप से स्पष्ट करता है और मूल के दृश्य उपासना-विषय को बनाए रखता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: דָּן
  choice: दान
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ‘यारोबाम के पापों’ और ‘सोने के बछड़ों’ का संबंध
  choice: ‘अर्थात्’ और दीर्घ विराम के द्वारा सोने के बछड़ों को उन पापों की व्याख्यात्मक पहचान के रूप में प्रस्तुत किया गया है।
  alternative: इसे वाक्य-विन्यास में आए विराम के बाद दोहराकर दी गई स्वतंत्र स्पष्टोक्ति माना जा सकता है।
  rationale: इब्रानी पाठ अमूर्त ‘पापों’ से ठोस ‘सोने के बछड़ों’ की ओर बढ़ता है। यह रूप उस व्याख्यात्मक संबंध को दिखाता है, पर उससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: הֶחֱטִיא में कर्ता और कारणवाचकता
  choice: कर्ता यारोबाम है और उसने इस्राएल से पाप करवाया।
  alternative: भावार्थ में ‘इस्राएल को पाप में लगाया’ कहा जा सकता है।
  rationale: एकवचन क्रिया निकटवर्ती यारोबाम की ओर लौटती है और हिफ़ील की कारणवाचक शक्ति को ‘पाप करवाया’ स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फिर भी’ प्रसंग का विरोधात्मक मोड़ व्यक्त करता है; ‘पाप करवाया’ मूल की कारणवाचक क्रिया को स्पष्ट रखता है। दोनों फुटनोट-चिह्न मुख्य पाठ में उपस्थित हैं।
