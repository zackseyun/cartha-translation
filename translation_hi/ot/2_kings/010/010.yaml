source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
translation:
  language: hi
  text: इसलिए जान लो कि यहोवा ने अहाब के घराने के विरुद्ध जो वचन कहा था, उसका एक भी अंश धरती पर नहीं गिरेगा[a]। यहोवा ने वही किया है जो उसने अपने सेवक एलिय्याह के द्वारा कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “धरती पर नहीं गिरेगा”; यह मुहावरा बताता है कि वचन का कोई भाग निष्फल नहीं होगा या पूरा हुए बिना नहीं रहेगा।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अपने सेवक एलिय्याह के हाथ से”; अर्थात् “अपने सेवक एलिय्याह के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  choice: इसलिए जान लो
  rationale: बहुवचन आज्ञार्थक דְּעוּ श्रोताओं को तथ्य स्वीकार करने के लिए सीधे संबोधित करता है; אֵפוֹא का निष्कर्षसूचक बल ‘इसलिए’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: יִפֹּל ... אַרְצָה
  choice: भूमि पर नहीं गिरेगा
  rationale: हिब्रू का सजीव मुहावरा बनाए रखा गया है; आशय है कि वचन निष्फल या अधूरा नहीं रहेगा।
- source_word: מִדְּבַר יְהוָה
  choice: यहोवा ने ... जो वचन कहा था, उसमें से एक भी
  rationale: विभाजक מִן का बल ‘उसमें से एक भी’ में आता है और यह स्पष्ट करता है कि भविष्यवाणी का कोई अंश विफल नहीं होगा।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलिप्यंतरण द्वारा परमेश्वर का व्यक्तिगत वाचा-नाम रखा गया है, किसी उपाधि से बदला नहीं गया।
- source_word: עַל בֵּית אַחְאָב
  choice: अहाब के घराने के विरुद्ध
  rationale: न्याय की भविष्यवाणी के प्रसंग में עַל का विरोधात्मक अर्थ ‘के विरुद्ध’ उपयुक्त है; ‘घराना’ वंश और राजवंश दोनों का संकेत बनाए रखता है।
- source_word: וַיהוָה עָשָׂה
  choice: यहोवा ने ... किया है
  rationale: पूर्ण हो चुकी क्रिया और वर्तमान भाषण-स्थिति में उसकी प्रासंगिकता को पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  choice: अपने सेवक एलिय्याह के द्वारा
  rationale: בְּיַד यहाँ माध्यम या अभिकरण का मुहावरा है; स्वाभाविक हिन्दी में ‘के द्वारा’ वही अर्थ देता है।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: भविष्यद्वक्ता की नियुक्त सेवा के संदर्भ में ‘सेवक’ आधुनिक हिन्दी का उपयुक्त और प्रतिष्ठित शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम प्रत्यक्ष रूप से आया है। हिन्दी पाठकों में स्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना पहचानने योग्य रखता है।
- issue: भविष्यवाणी की पूर्ति का मुहावरा
  choice: एक भी भूमि पर नहीं गिरेगा
  alternative: एक भी निष्फल नहीं होगा
  rationale: मूल रूपक को सुरक्षित रखा गया है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है; इससे भविष्यवाणी की निश्चित और पूर्ण पूर्ति पर बल बना रहता है।
- issue: בְּיַד में भविष्यद्वक्ता की मध्यस्थ भूमिका
  choice: के द्वारा
  alternative: के हाथ से
  rationale: यह अभिकरण या माध्यम दर्शाता है। ‘के द्वारा’ स्वाभाविक हिन्दी है और यह दावा नहीं करता कि एलिय्याह ने स्वयं इन घटनाओं को क्रियान्वित किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक घोषणा के अनुरूप रखी गई है। ‘घराना’ राजवंशीय अर्थ को सहज हिन्दी में व्यक्त करता है। मुख्य हिब्रू मुहावरे को पाठ में रखते हुए पादटिप्पणी में अर्थ स्पष्ट किया गया है।
