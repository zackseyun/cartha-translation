base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/017.yaml
  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
translation:
  language: hi
  text: जब वह शोमरोन पहुँचा, तो उसने शोमरोन में अहाब के जितने लोग बचे रह गए थे, उन सबको मार डाला, यहाँ तक कि उसने उसे नष्ट कर दिया[a]। उसने ऐसा यहोवा के उस वचन के अनुसार किया, जो उसने एलिय्याह से कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसे’; इब्रानी का एकवचन प्रत्यय संभवतः अहाब के घराने को एक सामूहिक इकाई के रूप में दर्शाता है।
    reason: मूल इब्रानी के एकवचन प्रत्यय और उसके संभावित सामूहिक संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: जब वह शोमरोन पहुँचा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘जब…पहुँचा’ अगले कार्य से स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: इस प्रसंग में נכה घातक प्रहार को सूचित करता है; आधुनिक हिन्दी में ‘मार डाला’ स्पष्ट और स्वाभाविक है।
- source_word: כָּל הַנִּשְׁאָרִים לְאַחְאָב
  choice: अहाब के जितने लोग बचे थे, उन सबको
  rationale: לְ यहाँ संबंध या संबद्धता दिखाता है। यह अनुवाद अहाब से जुड़े बचे हुए लोगों को दर्शाता है और अनावश्यक रूप से ‘शेष’ की धर्मवैज्ञानिक धारणा नहीं जोड़ता।
- source_word: עַד הִשְׁמִידוֹ
  choice: जब तक कि उसने उसे पूरी तरह नष्ट न कर दिया
  rationale: שׁמד पूर्ण विनाश को व्यक्त करता है। एकवचन पुल्लिंग प्रत्यय को ‘उसे’ के रूप में बनाए रखा गया है, ताकि मूल की व्याकरणिक अस्पष्टता न मिटे; संभवतः अहाब के घराने को सामूहिक इकाई माना गया है।
- source_word: כִּדְבַר יְהוָה
  choice: इस प्रकार यहोवा का वह वचन पूरा हुआ
  rationale: मूल का अर्थ यह है कि कार्य यहोवा के वचन के अनुरूप हुआ। हिन्दी में यह रूप भविष्यद्वाणी की पूर्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר דִּבֶּר אֶל אֵלִיָּהוּ
  choice: जो उसने एलिय्याह से कहा था
  rationale: पूर्व में दिए गए भविष्यसूचक वचन को दर्शाने के लिए पूर्ण भूतकाल स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; हिन्दी की प्रचलित बाइबिलीय वर्तनी ‘यहोवा’ इसे उपाधि में बदले बिना व्यक्त करती है।
- issue: הִשְׁמִידוֹ के एकवचन प्रत्यय का संदर्भ
  choice: उसे
  alternative: उन सबको / अहाब के घराने को
  rationale: एकवचन को बनाए रखने से मूल की व्याकरणिक और धर्मवैज्ञानिक तनावपूर्ण अस्पष्टता सुरक्षित रहती है; संदर्भ में यह अहाब या उसके घराने को सामूहिक रूप से सूचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘शोमरोन’, ‘अहाब’, ‘यहोवा’ और ‘एलिय्याह’ के प्रचलित हिन्दी बाइबिलीय रूप रखे गए हैं। मूल में शोमरोन की पुनरावृत्ति निष्ठापूर्वक बनाए रखी गई है।
