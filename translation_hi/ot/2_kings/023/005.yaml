base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
translation:
  language: hi
  text: उसने उन पुरोहितों[a] को हटा दिया, जिन्हें यहूदा के राजाओं ने यहूदा के नगरों और यरूशलेम के आस-पास के ऊँचे स्थानों पर धूप जलाने के लिए नियुक्त किया था, और उन लोगों को भी जो बाल को, सूर्य को, चन्द्रमा को, तारामंडलों[b] को और आकाश की सारी सेना[c] को धूप जलाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द ऐसे पुरोहितों को सूचित करता है जो अनधिकृत या मूर्तिपरक उपासना से जुड़े थे, न कि यहोवा के वैध पुरोहितों को।
    reason: lexical_alternative
  - marker: b
    text: या “राशिचक्र के चिह्नों।” इब्रानी शब्द संभवतः तारामंडलों या अन्य खगोलीय समूहों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: “आकाश की सेना” यहाँ उपासना के विषय बने आकाशीय पिंडों के समूचे समूह को सूचित करती है।
    reason: lexical_alternative
