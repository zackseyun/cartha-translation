- source_word: וְלַמַּזָּלוֹת
  choice: नक्षत्रों[b]
  rationale: מַזָּלוֹת संभवतः तारामंडलों या राशिचक्र के खगोलीय समूहों को सूचित करता है। 'नक्षत्र' सहज हिन्दी है और अनावश्यक अति-विशिष्टता से बचता है।
- source_word: וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: आकाश की सारी सेना[c]
  rationale: यह इब्रानी रूढ़ पद का औपचारिक रूप बनाए रखता है। संदर्भ में इसका आशय उपासित आकाशीय पिंडों के समूचे समुदाय से है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: הַכְּמָרִים को सामान्य 'पुरोहित' कहना या अनुचित/मूर्तिपूजक उपासना से संबद्ध दिखाना
  choice: मुख्य पाठ में 'पुरोहितों' और पादटिप्पणी में उसका विशिष्ट अर्थ
  alternative: '''मूर्तिपूजक पुरोहितों'' या ''अन्यदेवों के पुरोहितों'''
  rationale: शब्द का प्रयोग वैध यहोवा-याजकों से भिन्न, अनुचित उपासना से जुड़े कर्मियों के लिए होता है; फिर भी मुख्य पाठ में 'मूर्तिपूजक' जोड़ना संदर्भ की व्याख्या को प्रत्यक्ष संज्ञा बना देता। पादटिप्पणी स्रोत-शब्द की विशेषता को बिना अति-निर्णय के सुरक्षित रखती है।
- issue: צְבָא הַשָּׁמָיִם को शाब्दिक 'आकाश की सेना' या व्याख्यात्मक 'आकाशीय पिंड' कहना
  choice: आकाश की सारी सेना
  alternative: सारे आकाशीय पिंड
  rationale: रूढ़ इब्रानी बिंब को मुख्य पाठ में बनाए रखा गया है, जबकि इस प्रसंग में उसके खगोलीय अर्थ को पादटिप्पणी स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। लम्बे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर दोनों कर्म-समूह और उनकी समान क्रिया सुरक्षित हैं। 'पुरोहित' को 'याजक' के बजाय चुना गया ताकि इस विशेष अवैध उपासना-वर्ग को वैध इस्राएली याजकपद से सहज रूप से अलग रखा जा सके।
