  choice: उसने ... हटा दिया
  rationale: שׁבת के हिफ़ील रूप का अर्थ यहाँ किसी पद या कार्य को समाप्त कर देना है। संदर्भ में योशिय्याह द्वारा इन पुरोहितों को हटाना अभिप्रेत है; यह सहज हिन्दी में कारणवाचक भाव व्यक्त करता है।
- source_word: הַכְּמָרִים
  choice: पुरोहितों[a]
  rationale: यह विशिष्ट इब्रानी शब्द अनुचित अथवा मूर्तिपूजक उपासना से जुड़े पुरोहितों के लिए प्रयुक्त होता है। मुख्य पाठ में संक्षिप्त शब्द रखा गया है और अर्थगत विशेषता पादटिप्पणी में स्पष्ट की गई है।
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה
  choice: जिन्हें यहूदा के राजाओं ने ... नियुक्त किया था
  rationale: इस रचना में נתן का अर्थ नियुक्त या स्थापित करना है। पूर्ण भूतकाल पूर्ववर्ती नियुक्ति को स्पष्ट करता है।
- source_word: וַיְקַטֵּר / הַמְקַטְּרִים
  choice: धूप जलाने / धूप जलाते थे
  rationale: קטר यहाँ धूप अथवा धूम-बलि चढ़ाने को दर्शाता है। 'धूप जलाना' सामान्य पाठक के लिए स्पष्ट और संदर्भानुकूल है।
- source_word: בַּבָּמוֹת
  choice: ऊँचे स्थानों पर
  rationale: במה स्थानीय पूजा-स्थल के लिए पारंपरिक पद है; 'ऊँचे स्थान' इसकी स्थानिक और उपासना-संबंधी धारणा बनाए रखता है।
- source_word: בְּעָרֵי יְהוּדָה וּמְסִבֵּי יְרוּשָׁלִָם
  choice: यहूदा के नगरों और यरूशलेम के आस-पास
  rationale: מְסִבֵּי यरूशलेम से लगे चारों ओर के क्षेत्र को सूचित करता है।
- source_word: לַבַּעַל
  choice: बाल के लिए
  rationale: बाल देवता के नाम का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: לַשֶּׁמֶשׁ וְלַיָּרֵחַ
  choice: सूर्य, चन्द्रमा
