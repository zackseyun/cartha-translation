  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
translation:
  language: hi
  text: तब राजा खम्भे के पास खड़ा हुआ और उसने यहोवा के सामने वाचा बाँधी कि वह यहोवा के पीछे चलेगा और पूरे मन और पूरे प्राण से उसकी आज्ञाओं, चितौनियों और विधियों का पालन करेगा, और इस पुस्तक[a] में लिखी इस वाचा की बातों को पूरा करेगा। और सभी लोग उस वाचा में सम्मिलित हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस लपेटे हुए लेख में।” इब्रानी शब्द पुस्तक, दस्तावेज़ या लपेटे हुए लेख के लिए प्रयुक्त हो सकता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “वाचा में खड़े हुए।” इसका आशय वाचा को स्वीकार करके उसके प्रति प्रतिबद्ध होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  choice: खम्भे के पास खड़ा हुआ
  rationale: עַל स्थान-सूचक अर्थ में ‘के पास/निकट’ हो सकता है; राजकीय अनुष्ठान के संदर्भ में खम्भे के ऊपर खड़ा होना अपेक्षित नहीं है।
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  choice: वाचा बाँधी
  rationale: כרת ברית का अर्थ वाचा स्थापित या संपन्न करना है; ‘वाचा बाँधना’ स्वाभाविक हिन्दी मुहावरा है और शाब्दिक ‘काटना’ से अधिक स्पष्ट है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने/की उपस्थिति में’ है और यहाँ अनुष्ठान की गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לָלֶכֶת אַחַר יְהוָה
  choice: यहोवा के पीछे चलेगा
  rationale: यह इब्रानी की चलने वाली वाचा-संबंधी उपमा को सुरक्षित रखता है; केवल ‘अनुसरण करेगा’ कहने से वह चित्र लुप्त हो जाता।
- source_word: לִשְׁמֹר
  choice: पालन करेगा
  rationale: विधिक और वाचा-संबंधी संदर्भ में שׁמר का आशय आज्ञाओं को मानना और आचरण में लाना है।
- source_word: מִצְוֺתָיו וְאֶת עֵדְוֺתָיו וְאֶת חֻקֹּתָיו
  choice: उसकी आज्ञाओं, चितौनियों और विधियों
  rationale: तीनों अलग विधिक शब्दों का भेद बनाए रखा गया है। ‘चितौनियाँ’ עֵדוֹת के साक्षी/स्मरण कराने वाले वाचा-विधानों का पारंपरिक और संक्षिप्त हिन्दी रूप है।
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  choice: पूरे मन और पूरे प्राण से
  rationale: यह वाचा-संबंधी सूत्र के दोनों मानवशास्त्रीय पदों को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: לְהָקִים
  choice: पूरा करेगा
  rationale: यहाँ अर्थ लिखी हुई वाचा की बातों को प्रभावी रूप से आचरण में लाना है; ‘स्थापित करना’ हिन्दी में संदर्भ को अस्पष्ट कर सकता है।
- source_word: הַסֵּפֶר הַזֶּה
  choice: इस पुस्तक
  rationale: סֵפֶר पुस्तक, ग्रन्थ, दस्तावेज़ या पुस्तकाकार लपेटे हुए पत्र का संकेत कर सकता है; मुख्य पाठ में सामान्य हिन्दी ‘पुस्तक’ और पादटिप्पणी में विकल्प रखा गया है।
- source_word: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית
  choice: सभी लोग उस वाचा में दृढ़ खड़े रहे
  rationale: यह ‘वाचा में खड़े होने’ की मूल उपमा को बचाते हुए उसके प्रतिबद्धता-सूचक आशय को आधुनिक पाठक के लिए स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित नामरूप रखा गया है।
- issue: וַיַּעֲמֹד כָּל־הָעָם בַּבְּרִית में लोगों की वाचा-संबंधी प्रतिक्रिया
  choice: उस वाचा में दृढ़ खड़े रहे
  alternative: उस वाचा में सम्मिलित हो गए
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से ‘वाचा में खड़े हुए’ है। मुख्य पाठ में ‘दृढ़’ जोड़कर प्रतिबद्धता का आशय स्पष्ट किया गया, पर औपचारिक खड़े होने और वाचा स्वीकारने के बीच की संभावित अर्थ-व्याप्ति को पूर्णतः मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘वाचा’, ‘चितौनियाँ’ और ‘विधियाँ’ जैसे पारंपरिक बाइबलीय पद विधिक शब्दावली के भेद को बनाए रखते हैं; वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए सरल किया गया है।
