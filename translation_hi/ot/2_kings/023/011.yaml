  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
translation:
  language: hi
  text: उसने उन घोड़ों को हटा दिया जिन्हें यहूदा के राजाओं ने सूर्य को समर्पित किया था—याहवे के भवन के प्रवेश-द्वार से लेकर नतन-मेलेक नामक दरबारी अधिकारी[a] की उस कोठरी तक, जो बाहरी परिसर[b] में थी। उसने सूर्य के रथों को आग में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नपुंसक’; इब्रानी शब्द का अर्थ नपुंसक अथवा राजकीय/दरबारी अधिकारी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और संभवतः मन्दिर-परिसर के बाहरी या सीमावर्ती भाग को दर्शाता है; इसके अन्य सम्भव अर्थ ‘उपनगरीय भाग’ या ‘स्तम्भों वाला बरामदा’ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  choice: उसने ... हटा दिया
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु का उपयोग बंद करा देना या उसे हटा देना है; योशिय्याह के सुधारों के संदर्भ में यह स्वाभाविक और सटीक है।
- source_word: אֲשֶׁר נָתְנוּ מַלְכֵי יְהוּדָה לַשֶּׁמֶשׁ
  choice: जिन्हें यहूदा के राजाओं ने सूर्य को अर्पित किया था
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘देना’ है, पर उपासना-संबंधी संदर्भ में ‘अर्पित करना’ अभिप्रेत संबंध को स्पष्ट करता है।
- source_word: מִבֹּא בֵית יְהוָה אֶל לִשְׁכַּת
  choice: याहवे के भवन के प्रवेश-द्वार के पास ... कोठरी की ओर
  rationale: स्थान-सूचक संक्षिप्त इब्रानी विन्यास को सहज हिन्दी में प्रस्तुत करते हुए ‘प्रवेश-द्वार’ और אֶל की दिशात्मकता ‘की ओर’ दोनों सुरक्षित रखे गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को हिन्दी लिपि में प्रतिलिपित किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: נְתַן מֶלֶךְ
  choice: नतन-मेलेक
  rationale: व्यक्तिवाचक नाम का मसोरेटी स्वरांकन के अनुरूप देवनागरी लिप्यंतरण किया गया है।
- source_word: הַסָּרִיס
  choice: राजदरबारी
  rationale: यह पद राजकीय अधिकारी या नपुंसक दोनों को सूचित कर सकता है। मुख्य पाठ में संदर्भानुकूल व्यापक अर्थ लिया गया और दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: בַּפַּרְוָרִים
  choice: बाहरी परिसर में
  rationale: दुर्लभ स्थापत्य-सूचक पद संभवतः मन्दिर-परिसर के बाहरी या सीमावर्ती भाग को दर्शाता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: מַרְכְּבוֹת הַשֶּׁמֶשׁ
  choice: सूर्य के रथों
  rationale: शाब्दिक उपासना-संबंधी बिंब को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: שָׂרַף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: मूल पाठ में अग्नि का स्पष्ट उल्लेख है; हिन्दी में ‘आग में जला दिया’ उसे स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में परमेश्वर का व्यक्तिवाचक नाम है; उसे उपाधि में बदलने के बजाय हिन्दी में प्रतिलिपित किया गया है।
- issue: सूर्य से जुड़े घोड़ों और रथों का धार्मिक संबंध
  choice: सूर्य को अर्पित किए गए घोड़े; सूर्य के रथ
  alternative: सूर्य-देवता को समर्पित घोड़े और रथ
  rationale: उपासना-संबंधी संदर्भ स्पष्ट है, पर मूल में ‘देवता’ शब्द नहीं है; इसलिए मुख्य पाठ मूल की संयत अभिव्यक्ति रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। मूल के दुर्लभ स्थापत्य पद और סָרִיס की अर्थगत अनिश्चितता पादटिप्पणियों में रखी गई है।
