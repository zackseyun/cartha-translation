  yaml_path: translation/ot/2_kings/023/018.yaml
  text: And he said[a], “Leave him alone; let no man disturb his bones.” So they let his bones alone, along with the bones of the prophet who had come from Samaria.
translation:
  language: hi
  text: उसने कहा, “उसे रहने दो; कोई भी उसकी हड्डियों को न छेड़े।” इसलिए उन्होंने उसकी हड्डियों को, शोमरोन से आए नबी की हड्डियों समेत, अछूता छोड़ दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस प्रकार उन्होंने उसकी हड्डियाँ और शोमरोन से आए नबी की हड्डियाँ बचा लीं।”
    reason: וַיְמַלְּטוּ का अर्थ ‘अछूता छोड़ दिया’ या अधिक प्रत्यक्ष रूप से ‘बचा लिया/बख्श दिया’ हो सकता है; साथ ही אֵת दूसरे प्रत्यक्ष कर्म को प्रस्तुत करता है।
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  choice: उसे रहने दो
  rationale: यह आदेश मृत व्यक्ति के अवशेषों के विरुद्ध आगे कोई कार्रवाई न करने को कहता है। यह हिंदी में स्वाभाविक है और इब्रानी मुहावरे का आशय बनाए रखता है।
- source_word: אִישׁ אַל יָנַע
  choice: कोई भी ... न छेड़े
  rationale: אִישׁ यहाँ सामान्य निषेध में ‘कोई भी’ के अर्थ में है। נוע का संदर्भ हड्डियों को उनकी जगह से हिलाने या बाधित करने का है; ‘न छेड़े’ इस प्रसंग में सहज और स्पष्ट है।
- source_word: עַצְמֹתָיו
  choice: उसकी हड्डियों
  rationale: मूल पाठ के ठोस शब्द ‘हड्डियाँ’ को बनाए रखा गया है; सामान्यीकृत ‘अवशेष’ नहीं अपनाया गया।
- source_word: וַיְמַלְּטוּ עַצְמֹתָיו
  choice: उन्होंने उसकी हड्डियों को ... सुरक्षित छोड़ दिया
  rationale: पिएल रूप यहाँ हानि से बचाने या सुरक्षित रहने देने का भाव देता है। यह अनुवाद पिछले आदेश से संबंध भी स्पष्ट करता है और संरक्षण का आशय भी रखता है।
- source_word: אֵת עַצְמוֹת הַנָּבִיא
  choice: नबी की हड्डियों के साथ
  rationale: वाक्य में नबी की हड्डियाँ भी उसी संरक्षण की सहभागी वस्तु हैं; ‘के साथ’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  choice: शोमरोन से आए
  rationale: यह नबी के पहले शोमरोन से आने का वर्णन करता है। स्थाननाम שֹׁמְרוֹן का मानक हिंदी बाइबलीय रूप ‘शोमरोन’ रखा गया है।
