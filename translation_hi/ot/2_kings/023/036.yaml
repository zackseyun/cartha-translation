translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। राजकीय सूत्र को शब्दशः जड़ता से बचाते हुए अर्थ-सटीक ढंग से प्रस्तुत किया गया है। मूल पाठ में זבידה के बाद ‘बेटी’ स्त्रीलिंग है, इसलिए अंतिम वाक्य में सर्वनाम का आशय जबीदा रखा गया है, जबकि ‘रूमा से’ को स्वाभाविक वंशावली अर्थ के अनुसार पदायाह के निवास से जोड़ा गया है।
