base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
translation:
  language: hi
  text: यहोयाकीम जब राजा बना, तब वह पच्चीस वर्ष का था और उसने यरूशलेम में ग्यारह वर्ष तक राज किया। उसकी माता का नाम ज़बीदा था। वह रूमा के रहनेवाले पदायाह की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: वह पच्चीस वर्ष का था
  rationale: यह आयु बताने वाला प्रचलित इब्रानी मुहावरा है; हिंदी में स्वाभाविक रूप से आयु व्यक्त की गई है।
- source_word: בְּמָלְכוֹ
  choice: जब राजा बना
  rationale: यह पद उसके राजपद ग्रहण करने के समय को बताता है; यह हिंदी में सहज और सटीक है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: क्रिया राजकीय शासन करने की अवधि को व्यक्त करती है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह उसके शासन-स्थान को सूचित करने वाला स्थानवाचक पद है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम
  rationale: वंशावली-संबंधी सूत्र को स्पष्ट, गरिमापूर्ण आधुनिक हिंदी में रखा गया है।
- source_word: זבידה
  choice: जबीदा
  rationale: WLC के केतिव זבידה की व्यंजनात्मक आकृति के अनुरूप हिंदी लिप्यंतरण चुना गया है।
- source_word: בַת פְּדָיָה
  choice: पदायाह की बेटी
  rationale: पिता-पुत्री का संबंध सीधे और स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: מִן רוּמָה
  choice: रूमा के रहनेवाले
  rationale: מִן यहाँ मूल स्थान या निवास-संबंध दर्शाता है; वाक्य-विन्यास में संभावित संबंध को सुरक्षित रखते हुए इसे पदायाह से जोड़ा गया है।
