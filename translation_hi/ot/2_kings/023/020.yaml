source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
translation:
  language: hi
  text: उसने ऊँचे स्थानों के उन सभी याजकों का, जो वहाँ थे, वेदियों पर वध कर डाला[a] और उन पर मनुष्यों की हड्डियाँ जला दीं। फिर वह यरूशलेम लौट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बलि के रूप में वध कर दिया।” इब्रानी क्रिया बलि चढ़ाने के लिए किए गए वध का अर्थ भी दे सकती है; यहाँ प्रसंग अवैध उपासना को मिटाने के दौरान हुई हिंसक हत्या का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: मार डाला
  rationale: זבח का अर्थ बलि चढ़ाना या वध करना हो सकता है। यहाँ अवैध उपासना-स्थलों के याजकों की हिंसक हत्या का प्रसंग है; ‘मार डाला’ स्वाभाविक हिन्दी में घटना को स्पष्ट रखता है, जबकि बलि-संबंधी संभावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ऊँचे स्थानों के ... याजकों
  rationale: बָּמוֹת राजाओं की पुस्तकों में स्थानीय उपासना-स्थलों के लिए प्रचलित धार्मिक पद है। ‘ऊँचे स्थान’ इस ऐतिहासिक पद को बनाए रखता है।
- source_word: אֲשֶׁר שָׁם
  choice: वहाँ के
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में उन याजकों को उन्हीं स्थलों पर उपस्थित या उनसे संबद्ध बताता है।
- source_word: עַל הַמִּזְבְּחוֹת
  choice: वेदियों पर
  rationale: עַל का सीधा स्थानवाचक अर्थ ‘पर’ है; अगली क्रिया में भी वेदियाँ अपवित्र किए जाने का स्थान हैं।
- source_word: עַצְמוֹת אָדָם
  choice: मनुष्यों की हड्डियाँ
  rationale: אָדָם यहाँ मानव जाति को सामान्य रूप से सूचित करता है, किसी विशेष पुरुष को नहीं। बहुवचन ‘मनुष्यों की’ हिन्दी में स्वाभाविक है और अस्थियों के मानवीय होने को स्पष्ट करता है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: सर्वनाम का सबसे स्वाभाविक पूर्वपद वेदियाँ हैं; हिन्दी में वही संदर्भ स्पष्ट बना रहता है।
- source_word: וַיָּשָׁב יְרוּשָׁלָם
  choice: फिर वह यरूशलेम लौट गया
  rationale: ‘फिर’ कथानक की क्रमिकता व्यक्त करता है और ‘लौट गया’ पूर्ण हुई वापसी को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: וַיִּזְבַּח में याजकों के वध का संभावित बलिदान-संबंधी भाव
  choice: मुख्य पाठ में ‘मार डाला’
  alternative: ‘बलि चढ़ा दिया’ या ‘वध किया’
  rationale: ‘बलि चढ़ा दिया’ वैध धार्मिक अर्पण या परमेश्वर की स्वीकृति का ऐसा संकेत दे सकता है जिसे पाठ स्पष्ट रूप से नहीं कहता। मुख्य पाठ हिंसक हत्या को स्पष्ट करता है, जबकि पादटिप्पणी इब्रानी क्रिया की वास्तविक बलिदान-संबंधी अर्थ-छाया को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। ‘ऊँचे स्थान’ और ‘याजक’ जैसे स्थापित बाइबलीय पद रखे गए हैं। हिंसा को न नरम किया गया है, न उसे वैध बलिदान बताकर धार्मिक अनुमोदन जोड़ा गया है।
