  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
translation:
  language: hi
  text: उससे पहले उसके समान कोई राजा नहीं था, जो अपने सारे मन, अपने सारे प्राण और अपनी सारी सामर्थ्य से मूसा की पूरी व्यवस्था के अनुसार यहोवा की ओर फिरा[a][b]; और उसके बाद भी उसके समान कोई नहीं उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा की ओर फिरा” का अनुवाद “यहोवा के पास लौट आया” भी हो सकता है। इब्रानी क्रिया में वाचा की निष्ठा और पश्चात्ताप के साथ लौटने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने सारे मन, अपने सारे प्राण और अपनी सारी सामर्थ्य से” व्यवस्थाविवरण 6:5 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וְכָמֹהוּ לֹא הָיָה לְפָנָיו מֶלֶךְ
  choice: उससे पहले उसके समान कोई राजा नहीं हुआ
  rationale: इब्रानी की आरंभिक तुलनात्मक प्रमुखता और योशिय्याह की अद्वितीयता को स्वाभाविक हिन्दी क्रम में सुरक्षित रखता है।
- source_word: שָׁב אֶל יְהוָה
  choice: यहोवा की ओर फिरा
  rationale: שׁוב के मुड़ने अथवा लौटने—दोनों सम्भव भावों को खुला रखता है और वाचा-निष्ठा की दिशा व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से अलग पहचान देता है।
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  choice: अपने सारे मन, अपने सारे प्राण और अपनी सारी सामर्थ्य से
  rationale: व्यवस्थाविवरण 6:5 की त्रयी की पहचान बनाए रखते हुए आधुनिक, गरिमापूर्ण हिन्दी देता है; מְאֹד के समग्र सामर्थ्य/क्षमता के भाव को ‘सामर्थ्य’ व्यक्त करता है।
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  choice: मूसा की पूरी व्यवस्था के अनुसार
  rationale: כְּכֹל की सम्पूर्णता और इस राजकीय मूल्यांकन में תּוֹרָה के मूसा की व्यवस्था-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  choice: और उसके बाद भी उसके समान कोई नहीं उठा
  rationale: קָם की ‘उठा/प्रकट हुआ’ अभिव्यक्ति और बाद के किसी तुल्य राजा के न होने का पूर्ण दावा सुरक्षित रहता है।
theological_decisions:
- issue: योशिय्याह के समर्पण में व्यवस्थाविवरण 6:5 की प्रतिध्वनि
  choice: ‘सारे मन… सारे प्राण… सारी सामर्थ्य’ की त्रयी बनाए रखी
  alternative: ‘पूरे मन… पूरे प्राण… पूरी शक्ति’
  rationale: मूल पाठ जानबूझकर व्यवस्थाविवरणीय वाचा-आदर्श को प्रतिध्वनित करता है; परिचित त्रयी इस अंतर्पाठीय संबंध को बिना व्याख्यात्मक विस्तार के सुनाई देती है।
- issue: שָׁב אֶל का धार्मिक-वाचागत भाव
  choice: ‘यहोवा की ओर फिरा’
  alternative: ‘यहोवा के पास लौट आया’ अथवा ‘यहोवा के सामने पश्चात्ताप किया’
  rationale: ‘फिरा’ दिशा, वापसी और पश्चात्ताप-संबंधी निष्ठा की सम्भावना बनाए रखता है, पर मूल से अधिक विशिष्ट धर्मशास्त्रीय अर्थ आरोपित नहीं करता।
- issue: दिव्य नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे अथवा प्रभु
  rationale: व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित न करते हुए हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला रूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य मूल की दोहरी तुलना—पहले और बाद में कोई समान राजा नहीं—को बनाए रखता है। ‘फिरा’ मूल की अर्थगत खुली जगह को सुरक्षित रखता है।
