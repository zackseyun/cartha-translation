base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
translation:
  language: hi
  text: फ़िरौन नको ने उसे हमात देश के रिबला में बंदी बना लिया[a], ताकि वह यरूशलेम में राज्य न करे[b]। फिर उसने देश पर एक सौ किक्कार चाँदी और एक किक्कार सोने का कर लगाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाँध लिया” अथवा “नज़रबंद कर दिया।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रू अभिव्यक्ति का अनुवाद “यरूशलेम में राज्य करने से रोक दिया” भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “दंड” अथवा “जुर्माना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  choice: उसे ... बंदी बना लिया
  rationale: אסר का मूल अर्थ बाँधना है और प्रसंग में किसी को हिरासत या बंदी अवस्था में रखना है। ‘बंदी बना लिया’ आधुनिक हिन्दी में राजनीतिक निरुद्धता को स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: פַרְעֹה נְכֹה
  choice: फ़िरौन नको
  rationale: राजकीय उपाधि ‘फ़िरौन’ रखी गई है और נְכֹה का हिन्दी लिप्यंतरण ‘नको’ किया गया है।
- source_word: בְרִבְלָה
  choice: रिबला में
  rationale: स्थानवाचक रूप को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּאֶרֶץ חֲמָת
  choice: हमात देश के
  rationale: אֶרֶץ यहाँ हमात के भौगोलिक क्षेत्र को दर्शाता है; ‘हमात देश’ स्पष्ट और पारंपरिक भौगोलिक अभिव्यक्ति है।
- source_word: במלך בִּירוּשָׁלָם
  choice: ताकि वह यरूशलेम में राज्य न करे
  rationale: प्रसंग और मसोरी परंपरा में समझे गए क्रियार्थक रूप के अनुसार यह बंदी बनाए जाने के निरोधात्मक उद्देश्य या परिणाम को व्यक्त करता है। वाक्यांश की वैकल्पिक संरचना पादटिप्पणी में दी गई है।
- source_word: וַיִּתֶּן עֹנֶשׁ
  choice: कर लगाया
  rationale: עֹנֶשׁ दंड, जुर्माना या आरोपित भुगतान हो सकता है। देश पर निश्चित मात्रा में चाँदी और सोना लगाए जाने के राजनीतिक-आर्थिक प्रसंग में ‘कर’ स्वाभाविक है; दंडात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל הָאָרֶץ
  choice: देश पर
  rationale: यहाँ הָאָרֶץ से यहूदा देश अभिप्रेत है, जिस पर भुगतान का भार डाला गया। ‘देश पर’ मूल की सामूहिक-भौगोलिक अभिव्यक्ति बनाए रखता है।
- source_word: מֵאָה כִכַּר כֶּסֶף
  choice: एक सौ किक्कार चाँदी
  rationale: כִכָּר प्राचीन भार-माप है। अनुमानित आधुनिक रूपांतरण देने के बजाय प्रचलित बाइबिलीय हिन्दी ‘किक्कार’ रखा गया है।
- source_word: וְכִכַּר זָהָב
  choice: एक किक्कार सोना
  rationale: मूल का एकवचन और वही प्राचीन भार-माप सुरक्षित रखा गया है।
