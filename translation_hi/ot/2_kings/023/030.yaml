source:
  edition: WLC
  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
translation:
  language: hi
  text: उसके सेवक उसके शव को मगिद्दो से यरूशलेम ले आए[a] और उसे उसकी कब्र में दफना दिया। तब देश के लोगों[b] ने योशियाह के पुत्र यहोआहाज को लिया, उसका अभिषेक किया और उसके पिता के स्थान पर उसे राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे सवारी कराई”; यहाँ इसका अर्थ योशियाह के शव को मगिद्दो से ले आना है।
    reason: lexical_alternative
  - marker: b
    text: “देश के लोग” इब्रानी की एक औपचारिक अभिव्यक्ति है, जो यहाँ राजनीतिक रूप से सामूहिक कार्रवाई करने वाले स्थानीय जनसमुदाय को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ
  choice: उसके शव को ... ले आए
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘उसे सवारी कराई’ है, पर מֵת से स्पष्ट है कि योशियाह मृत था; इसलिए आधुनिक हिन्दी में शव को ढोकर लाने का भाव स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: यह शब्द सेवकों के साथ राजकीय अधिकारियों या परिचारकों को भी सूचित कर सकता है; ‘सेवक’ सीधा और प्रसंगानुकूल है।
- source_word: מֵת
  choice: शव
  rationale: मूल में ‘मृत’ उसकी अवस्था बताता है। हिन्दी में ‘उसके शव को’ स्पष्ट और स्वाभाविक ढंग से वही अर्थ देता है।
- source_word: בִּקְבֻרָתוֹ
  choice: उसकी कब्र में
  rationale: संज्ञा का अर्थ दफनाने का स्थान है; ‘कब्र’ सामान्य आधुनिक हिन्दी में स्पष्ट है और राजकीय दफन-स्थान के अर्थ को नहीं रोकता।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह एक सामाजिक-राजनीतिक समूह के रूप में कार्यरत स्थानीय जनसमुदाय के लिए प्रयुक्त औपचारिक इब्रानी अभिव्यक्ति है; इसे ‘साधारण लोग’ कहने से अनावश्यक व्याख्या जुड़ती।
- source_word: וַיִּקַּח
  choice: लिया
  rationale: मूल क्रिया का सीधा अर्थ ‘लेना’ है। इससे राजपद के लिए उसे ग्रहण करने का भाव बना रहता है, बिना ‘चुना’ या ‘पकड़ा’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  choice: उसका अभिषेक किया
  rationale: यह राजकीय प्रतिष्ठापन में तेल से अभिषेक करने की विशिष्ट क्रिया है; ‘नियुक्त किया’ इसके अनुष्ठानिक और राजनीतिक अर्थ को घटा देता।
- source_word: תַּחַת אָבִיו
  choice: उसके पिता के स्थान पर
  rationale: यह उत्तराधिकार का सीधा संकेत है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: राजकीय अभिषेक की भाषा
  choice: उसका अभिषेक किया
  alternative: उसे नियुक्त किया
  rationale: इब्रानी पाठ अभिषेक की विशिष्ट क्रिया का प्रयोग करता है। अनुवाद उसके राजकीय और अनुष्ठानिक महत्व को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में मूल घटनाक्रम और समन्वयी संरचना सुरक्षित है; ‘शव’ का प्रयोग मृत अवस्था और परिवहन दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
