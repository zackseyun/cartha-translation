base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
translation:
  language: hi
  text: फिर भी, याहवे अपने बड़े, धधकते क्रोध से नहीं फिरा[a], जो यहूदा के विरुद्ध भड़क उठा था[b], उन सब उकसाने वाली बातों के कारण जिनसे मनश्शे ने उसे क्रोधित किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने महान जलते क्रोध से नहीं फिरा।” इब्रानी में शाब्दिक रूप से ‘नाक/क्रोध के जलने’ का मुहावरा है, जो तीव्र क्रोध को व्यक्त करता है।
    reason: शाब्दिक रूप और मुहावरे का वैकल्पिक अनुवाद
  - marker: b
    text: शाब्दिक रूप से “यहूदा में।” क्रोध के लक्ष्य के लिए हिन्दी में “यहूदा के विरुद्ध” अधिक स्वाभाविक है।
    reason: पूर्वसर्ग का शाब्दिक विकल्प
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: योशिय्याह के सुधारों के बावजूद बनी हुई स्थिति का प्रबल विरोधाभास स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא שָׁב
  choice: पीछे नहीं हटा
  rationale: मूल क्रिया ‘फिरना/लौटना’ का रूपक बनाए रखते हुए हिन्दी में यह स्पष्ट करता है कि याहवे अपने क्रोध से नहीं फिरा; ‘शांत नहीं हुआ’ मूल रूपक को अधिक व्याख्यायित कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम YHWH का हिन्दी लिप्यंतरण।
- source_word: מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  choice: अपने प्रचंड, धधकते क्रोध से
  rationale: חֲרוֹן אַף के जलते या धधकते क्रोध के बिंब को सुरक्षित रखता है, और הַגָּדוֹל की तीव्रता को स्वाभाविक हिन्दी में ‘प्रचंड’ से व्यक्त करता है।
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  choice: उसका क्रोध ... भड़क उठा था
  rationale: मूल में क्रोध और उसके जलने की पुनरुक्ति को बनाए रखता है; अलग वाक्य हिन्दी में भारी संबंधवाचक रचना से बचाता है।
- source_word: בִּיהוּדָה
  choice: यहूदा पर
  rationale: पूर्वसर्ग בְ का शाब्दिक अर्थ ‘में’ हो सकता है, पर क्रोध के लक्ष्य के लिए हिन्दी में ‘पर’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: עַל כָּל הַכְּעָסִים
  choice: उन सब कामों से
  rationale: यहाँ बहुवचन संज्ञा उन कार्यों को दर्शाती है जो क्रोध भड़काते हैं। सहज हिन्दी के लिए ‘कामों’ का प्रयोग किया गया है, जबकि अगली क्रिया उनके उकसाने वाले स्वरूप को स्पष्ट करती है।
- source_word: הִכְעִיסוֹ
  choice: उसे क्रोधित किया था
  rationale: हिफ़ील रूप का कारणवाचक अर्थ, अर्थात किसी को क्रोध दिलाना, सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: परमेश्वर के क्रोध के मानवीय देह-बिंब का अनुवाद
  choice: ‘प्रचंड, धधकते क्रोध’ और ‘भड़क उठा’ के रूप में अग्नि-बिंब बनाए रखा गया।
  alternative: ‘भारी अप्रसन्नता’ या केवल ‘प्रकोप’
  rationale: मूल पाठ חֲרוֹן אַף और חָרָה אַפּוֹ में तीव्र, जलते क्रोध की भाषा दोहराता है। इसे नरम करना या अमूर्त बनाना पाठ की तनावपूर्ण भाषा को घटा देता।
- issue: दिव्य नाम का रूप
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: व्यक्तिगत दिव्य नाम יהוה को उपाधि में बदले बिना लिप्यंतरित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की तीव्र क्रोध-भाषा तथा ‘धधकते/भड़क’ की पुनरुक्ति सुरक्षित है, लेकिन भारी इब्रानी संबंधवाचक संरचना को दो हिन्दी वाक्यों में बाँटा गया है।
