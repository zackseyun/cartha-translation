- source_word: הַבָּמוֹת
  choice: ऊँचे पूजा-स्थलों
  rationale: यह पद उपासना के लिए प्रयुक्त ऊँचे स्थानों को सूचित करता है। केवल ‘ऊँचे स्थान’ की अपेक्षा ‘ऊँचे पूजा-स्थल’ आधुनिक हिन्दी में इसका धार्मिक आशय स्पष्ट करता है।
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  choice: यरूशलेम के सामने
  rationale: इब्रानी मुहावरे का स्थान-संबंधी अर्थ ‘के सामने/सम्मुख’ है। मुख्य पाठ में अपेक्षाकृत शाब्दिक रूप रखा गया है और सम्भावित भौगोलिक अर्थ ‘पूर्व में’ पादटिप्पणी में दिया गया है।
- source_word: מִימִין לְהַר הַמַּשְׁחִית
  choice: विनाश-पर्वत की दाहिनी ओर
  rationale: מִימִין का मूल अर्थ ‘दाहिनी ओर’ है। दिशात्मक अभिमुखता के आधार पर सम्भावित ‘दक्षिण में’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַר הַמַּשְׁחִית
  choice: विनाश-पर्वत
  rationale: इब्रानी नाम का अर्थ ‘विनाश/भ्रष्टता का पहाड़’ है। इसे जैतून पर्वत से सीधे बदलने के बजाय स्रोत का निंदात्मक नाम सुरक्षित रखा गया है।
- source_word: לְעַשְׁתֹּרֶת
  choice: अश्तोरेत के लिए
  rationale: देवी के इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: שִׁקֻּץ צִידֹנִים
  choice: सीदोनियों की घृणित देवी
  rationale: שִׁקּוּץ की तीखी धार्मिक निंदा को ‘घृणित’ से व्यक्त किया गया है; अश्तोरेत के संदर्भ में ‘देवी’ स्वाभाविक हिन्दी देता है।
- source_word: לִכְמוֹשׁ
  choice: कमोश के लिए
  rationale: मोआबी देवता के नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: שִׁקֻּץ מוֹאָב
  choice: मोआब के घृणित देवता
  rationale: मूल की निंदात्मक शक्ति बनाए रखते हुए हिन्दी में स्वाभाविक जातीय संबंध व्यक्त किया गया है।
- source_word: לְמִלְכֹּם
  choice: मिल्कोम के लिए
  rationale: व्यंजनात्मक इब्रानी पाठ मिल्कोम पढ़ता है; इसे मुख्य पाठ में मोलेक से नहीं मिलाया गया।
- source_word: תּוֹעֲבַת בְּנֵי עַמּוֹן
  choice: अम्मोनियों के घृणित देवता
  rationale: תּוֹעֵבָה की प्रबल निंदा ‘घृणित’ से और ‘अम्मोन के पुत्रों’ का स्वाभाविक जातिवाचक अर्थ ‘अम्मोनियों’ से व्यक्त किया गया है।
- source_word: טִמֵּא
  choice: अशुद्ध कर दिया
  rationale: पिएल रूप यहाँ पूजा-स्थलों को धार्मिक रूप से अपवित्र और उपासना के अयोग्य बनाने को दर्शाता है; ‘अशुद्ध कर दिया’ इस अनुष्ठानिक अर्थ को बनाए रखता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ केवल उपाधि देता है; संदर्भगत नाम योशिय्याह को पद में नहीं जोड़ा गया।
theological_decisions:
- issue: विदेशी देवताओं के लिए प्रयुक्त निंदात्मक पद
  choice: שִׁקּוּץ और תּוֹעֵבָה को ‘घृणित देवी/देवता’ के रूप में व्यक्त करना
  alternative: ‘घृणित वस्तु’ अथवा तटस्थ ‘देवी/देवता’
  rationale: मूल पाठ जानबूझकर इन आराध्यों की धार्मिक निंदा करता है। ‘घृणित’ उस तीव्रता को बनाए रखता है, जबकि देवी/देवता जोड़ने से आधुनिक हिन्दी में संदर्भ स्पष्ट और वाक्य स्वाभाविक रहता है।
- issue: הַר הַמַּשְׁחִית की स्थलाकृतिक पहचान
  choice: विनाश-पर्वत
  alternative: भ्रष्टता-पर्वत; जैतून पर्वत
  rationale: स्रोत में प्रयुक्त निंदात्मक पदनाम को अनूदित किया गया है; सम्भावित ऐतिहासिक पहचान को मुख्य पाठ पर आरोपित नहीं किया गया।
- issue: מִימִין का दिशात्मक अर्थ
  choice: दाहिनी ओर
  alternative: दक्षिण में
  rationale: मुख्य पाठ में मूल का प्रत्यक्ष अर्थ रखा गया है और प्राचीन दिशात्मक अभिमुखता से निकलने वाला अर्थ पादटिप्पणी में दिया गया है, जिससे वास्तविक अस्पष्टता बनी रहती है।
