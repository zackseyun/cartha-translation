  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
translation:
  language: hi
  text: राजा ने यरूशलेम के सामने[a] स्थित उन ऊँचे उपासना-स्थलों को अपवित्र कर दिया, जो विनाश-पर्वत[b] की दाहिनी ओर[c] थे और जिन्हें इस्राएल के राजा सुलैमान ने सीदोनियों की घृणित वस्तु अश्तोरेत, मोआब की घृणित वस्तु कमोश और अम्मोनियों की घृणित वस्तु मिल्कोम[d] के लिए बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के पूर्व में।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “यरूशलेम के सामने” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “विनाश-पर्वत”; सम्भवतः वह पहाड़ी जिसे बाद में जैतून पर्वत के नाम से पहचाना गया।
    reason: cross_reference
  - marker: c
    text: या, “दक्षिण में,” यदि दिशात्मक अभिव्यक्ति को पूर्व की ओर मुख करके समझा जाए। इब्रानी में शाब्दिक रूप से “दाहिनी ओर” है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी पाठ में “मिल्कोम” है; कुछ पाठक इस देवता को “मोलेक” से जोड़ते हैं।
    reason: alternative_reading
