  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
translation:
  language: hi
  text: और उसने तोफेत को, जो बेन-हिन्नोम की घाटी में था, अशुद्ध कर दिया, ताकि कोई भी अपने बेटे या बेटी को मोलेक को आग में से पार न कराए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने बेटे या बेटी को आग में से पार कराना” मोलेक से जुड़े एक धार्मिक अनुष्ठान का इब्रानी मुहावरा है; संभवतः इसका आशय बच्चों की बलि चढ़ाना है।
    reason: cultural_note
  - marker: b
    text: या संभवतः, “राजा को।” स्वरांकित इब्रानी पाठ में “मोलेक” पढ़ा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  choice: और उसने ... अशुद्ध कर दिया
  rationale: पिएल रूप का अर्थ किसी वस्तु को अशुद्ध या अपवित्र करना है। यहाँ योशिय्याह ने उस उपासना-स्थल को अनुष्ठान के अयोग्य बनाया; ‘अशुद्ध कर दिया’ स्रोत के धार्मिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַתֹּפֶת
  choice: तोपेत
  rationale: यह स्थान का नाम है, इसलिए इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: בְּגֵי בני הִנֹּם
  choice: बेन-हिन्नोम की घाटी में
  rationale: ‘घाटी’ גֵי का अर्थ है और ‘बेन-हिन्नोम’ पारंपरिक स्थान-नाम को सुरक्षित रखता है; ‘हिन्नोम के पुत्रों की घाटी’ हिन्दी में अनावश्यक रूप से शाब्दिक लगेगा।
- source_word: לְבִלְתִּי לְהַעֲבִיר
  choice: ताकि ... पार न कराए
  rationale: यह निषेधात्मक उद्देश्य बताता है। हिफ़ील रूप ‘पार कराना’ कारणवाचक अर्थ को बनाए रखता है और मूल धार्मिक मुहावरे को स्पष्ट किए बिना सुरक्षित रखता है।
- source_word: אִישׁ
  choice: कोई भी
  rationale: यद्यपि इब्रानी में पुल्लिंग एकवचन ‘मनुष्य’ है, यहाँ उसका अर्थ सामान्य और अनिश्चित है। आधुनिक हिन्दी में ‘कोई भी’ उसी व्यापक निषेध को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנוֹ וְאֶת־בִּתּוֹ
  choice: अपने बेटे या बेटी को
  rationale: नकारात्मक उद्देश्य-वाक्य में हिन्दी का ‘या’ दोनों में से किसी भी संतान पर लागू निषेध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּאֵשׁ
  choice: आग में से
  rationale: ‘पार कराना’ के साथ यह मूल मुहावरे के स्थानगत रूप को बनाए रखता है; केवल ‘आग में’ कहने पर पार कराने की गति कम स्पष्ट होती।
- source_word: לַמֹּלֶךְ
  choice: मोलेक के लिए
  rationale: संदर्भ में מֹלֶךְ को देवता के नाम के रूप में लेना सर्वाधिक संभावित है। ל उपसर्ग अनुष्ठान के अभिप्रेत प्राप्तकर्ता को दर्शाता है, जिसके लिए हिन्दी में ‘के लिए’ स्वाभाविक है।
theological_decisions:
- issue: बाल-बलि से जुड़े धार्मिक मुहावरे को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘आग में से पार न कराए’ बनाए रखा गया
  alternative: ‘आग में बलि न चढ़ाए’
  rationale: संदर्भ संभवतः बाल-बलि का है, पर इब्रानी पाठ स्वयं ‘पार कराने’ का मुहावरा प्रयोग करता है। मुख्य पाठ में इसे बनाए रखने और टिप्पणी में अर्थ समझाने से स्रोत की अस्पष्टता तथा गंभीर आशय दोनों सुरक्षित रहते हैं।
- issue: אִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: कोई भी
  alternative: कोई पुरुष
  rationale: यहाँ एकवचन पुल्लिंग शब्द का बल किसी भी व्यक्ति पर लागू निषेध पर है, न कि केवल पुरुषों पर। ‘कोई भी’ आधुनिक हिन्दी में इस सामान्य अर्थ को ठीक और सहज ढंग से पहुँचाता है।
- issue: לַמֹּלֶךְ की पहचान
  choice: मोलेक के लिए
  alternative: राजा के लिए
  rationale: धार्मिक संदर्भ और पारंपरिक स्वरांकन इसे मोलेक देवता का नाम समझने के पक्ष में हैं, यद्यपि व्यंजनों को ‘राजा’ के रूप में पढ़ना संभव माना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान-नामों का देवनागरी लिप्यंतरण किया गया है और मूल पाठ के धार्मिक मुहावरे को व्याख्यात्मक टिप्पणी सहित सुरक्षित रखा गया है।
