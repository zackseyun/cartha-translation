base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
translation:
  language: hi
  text: उसके दिनों में मिस्र का राजा फ़िरौन नको अश्शूर के राजा के विरुद्ध फ़रात नदी तक चढ़कर गया। तब राजा योशिय्याह उससे मिलने गया[a], और उसने उसे मगिद्दो में मार डाला, जब उसने उसे देखा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसका सामना करने गया।”
    reason: लिक़रातो का अर्थ किसी से मिलने के लिए आगे जाना या उसका सामना करने जाना हो सकता है।
  - marker: b
    text: 'इब्रानी में यहाँ तीसरे पुरुष के सर्वनाम अस्पष्ट हैं। अर्थ को स्पष्ट करके अनुवाद किया जाए तो वाक्य हो सकता है: “जब योशिय्याह फ़िरौन नको से मिलने गया, तब फ़िरौन ने उसे मगिद्दो में मार डाला।” योशिय्याह की मृत्यु के समानांतर वृत्तांत के लिए 2 इतिहास 35:20–24 देखें।'
    reason: वैकल्पिक व्याख्यात्मक पठन और समानांतर संदर्भ देकर मूल पाठ की सर्वनाम-संदिग्धता पारदर्शी बनाना।
lexical_decisions:
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: इब्रानी काल-सूचक मुहावरे को निकटता से रखता है और योशिय्याह के शासनकाल की ओर संकेत करता है।
- source_word: עָלָה ... עַל
  choice: के विरुद्ध ... चढ़ आया
  rationale: सैन्य प्रसंग में עלה का आगे बढ़ने/चढ़ आने और עַל का विरोध की दिशा बताने वाला स्वाभाविक अर्थ सुरक्षित है।
- source_word: פַרְעֹה נְכֹה
  choice: फ़िरौन नको
  rationale: उपाधि और व्यक्तिगत नाम का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: עַל נְהַר פְּרָת
  choice: फ़रात नदी तक
  rationale: यहाँ दूसरा עַל गंतव्य अथवा भौगोलिक लक्ष्य बताता है; ‘तक’ आधुनिक हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उसका सामना करने
  rationale: לקראת मिलने के लिए आगे जाने से लेकर सामना करने तक अर्थ दे सकता है; सैन्य प्रसंग में ‘सामना करने’ स्वाभाविक है, पर इससे युद्ध के विस्तृत उद्देश्य नहीं जोड़े जाते।
- source_word: וַיְמִיתֵהוּ
  choice: उसने उसे ... मार डाला
  rationale: מות के हिफ़ील रूप का कारणात्मक अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בִּמְגִדּוֹ
  choice: मगिद्दो में
  rationale: घटना-स्थल का सामान्य हिन्दी स्थानीय प्रयोग।
- source_word: כִּרְאֹתוֹ אֹתוֹ
  choice: उसे देखते ही
  rationale: क्रिया और दोनों तृतीय पुरुष सर्वनामों की संक्षिप्तता रखी गई है; कर्ता और कर्म के संदर्भ को नाम देकर नहीं सुलझाया गया।
theological_decisions:
- issue: अंतिम खंड में तृतीय पुरुष सर्वनामों की संदिग्धता
  choice: मुख्य पाठ में ‘उसने उसे’ और ‘उसे’ रखकर इब्रानी की संदिग्धता सुरक्षित रखना
  alternative: फ़िरौन नको ने योशिय्याह को मगिद्दो में मार डाला, जब योशिय्याह उसका सामना करने गया
  rationale: इब्रानी वाक्य में पुरुषवाचक एकवचन सर्वनामों के संदर्भ व्याकरणतः संकुचित और अस्पष्ट हैं। समानांतर वृत्तांत के आधार पर उन्हें मुख्य पाठ में स्पष्ट कर देना मूल की वास्तविक अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। व्यक्तिनामों में प्रचलित बाइबलीय हिन्दी रूप ‘योशिय्याह’, ‘अश्शूर’, ‘फ़रात’ और ‘मगिद्दो’ रखे गए हैं।
