base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
translation:
  language: hi
  text: यहोयाकीम ने चाँदी और सोना फ़िरौन को दिया, पर फ़िरौन के आदेश[b] के अनुसार चाँदी देने के लिए उसने देश पर कर लगाया[a]। उसने देश के लोगों से, हर एक के निर्धारित आकलन के अनुसार[c], चाँदी और सोना ज़बरन वसूल किया, ताकि वह फ़िरौन नको[d] को दे सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने देश पर भुगतान का आकलन निर्धारित किया।” इब्रानी क्रिया कर या भुगतान के लिए आकलन ठहराने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “फ़िरौन के मुँह के अनुसार,” अर्थात् फ़िरौन के आदेश के अनुसार।
    reason: lexical_alternative
  - marker: c
    text: या “हर एक के आकलन के अनुसार”; अधिक व्याख्यात्मक रूप में, “हर एक की सामर्थ्य के अनुसार।”
    reason: lexical_alternative
  - marker: d
    text: इस नाम का लिप्यंतरण “नकोह” भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֶעֱרִיךְ
  choice: देश पर कर लगाया
  rationale: हिफ़ील रूप, ‘देश’ कर्म और भुगतान के संदर्भ में यह केवल मूल्य आँकने के बजाय राजकीय कर-निर्धारण को दर्शाता है। यह हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी मूल क्रिया की व्यापकता सुरक्षित रखती है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ राजनीतिक-भौगोलिक क्षेत्र अभिप्रेत है। आधुनिक हिन्दी में ‘देश’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है और ‘देश के लोगों’ के साथ शब्दगत संबंध बनाए रखता है।
- source_word: עַל־פִּי פַרְעֹה
  choice: फ़िरौन के आदेश के अनुसार
  rationale: शाब्दिक रूप ‘फ़िरौन के मुँह के अनुसार’ है, पर यह इब्रानी मुहावरा आदेश अथवा निर्देश के अनुसार कार्य करने को दर्शाता है।
- source_word: אִישׁ כְּעֶרְכּוֹ
  choice: हर एक पर किए गए आकलन के अनुसार
  rationale: वाक्यांश व्यक्ति-व्यक्ति के लिए निर्धारित आकलन को दर्शाता है। यह ‘हर एक की सामर्थ्य के अनुसार’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: נָגַשׂ
  choice: ज़बरन वसूल किया
  rationale: क्रिया में भुगतान के लिए दबाव डालने या कठोरता से वसूलने का भाव है; केवल ‘इकट्ठा किया’ उस बलपूर्ण अर्थ को कम कर देता।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह मूल पद का सीधा और स्पष्ट रूप है तथा बिना पर्याप्त आधार इसे केवल ‘साधारण जनता’ जैसे विशिष्ट सामाजिक वर्ग तक सीमित नहीं करता।
- source_word: פַרְעֹה נְכֹה
  choice: फ़िरौन नको
  rationale: इब्रानी व्यंजनरूप נְכֹה का हिन्दी लिप्यंतरण ‘नको’ किया गया है; वैकल्पिक परंपरागत रूप पादटिप्पणी में दिया गया है।
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  choice: चाँदी और सोना
  rationale: मूल पाठ दोनों बहुमूल्य धातुओं का स्पष्ट नाम लेता है। ‘चाँदी’ उस समय मुद्रा का काम कर सकती थी, फिर भी इसे ‘धन’ करना मूल की ठोस समानांतर भाषा को खो देता।
- source_word: נָתַן
  choice: दिया
  rationale: यह मूल क्रिया का सीधा अर्थ है। संदर्भ में यह राजकीय भुगतान है, पर ‘दिया’ पाठ की सामान्य अभिव्यक्ति को सुरक्षित रखता है।
