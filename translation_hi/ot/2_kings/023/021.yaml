id: 2KI.23.21
reference: 2 Kings 23:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַ֤ו הַ/מֶּ֨לֶךְ֙ אֶת כָּל הָ/עָ֣ם לֵ/אמֹ֔ר עֲשׂ֣וּ פֶ֔סַח לַֽ/יהוָ֖ה אֱלֹֽהֵי/כֶ֑ם כַּ/כָּת֕וּב עַ֛ל סֵ֥פֶר הַ/בְּרִ֖ית הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
translation:
  language: hi
  text: 'तब राजा ने सारी प्रजा को यह आज्ञा दी: “जैसा इस वाचा की पुस्तक में लिखा है, वैसे ही अपने परमेश्वर यहोवा के लिए फसह मनाओ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה का सीधा अर्थ आदेश देना है; हिन्दी कथात्मक शैली में ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: כָּל הָעָם
  choice: सारी प्रजा
  rationale: עם यहाँ सामूहिक रूप से राजा के अधीन लोगों को दर्शाता है; ‘सारी प्रजा’ राजकीय प्रसंग में स्वाभाविक है।
- source_word: עֲשׂוּ פֶסַח
  choice: फसह मनाओ
  rationale: शाब्दिक रूप से ‘फसह करो/बनाओ’ एक इब्रानी मुहावरा है; हिन्दी में पर्व के पालन के लिए ‘फसह मनाओ’ स्पष्ट और सहज है।
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर यहोवा के लिए
  rationale: ל समर्पण या उद्देश्य बताता है; ‘के लिए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। प्रत्यय ‘तुम्हारे’ को आज्ञार्थक सम्बोधन में ‘अपने’ से सहज रूप दिया गया है।
- source_word: כַּכָּתוּב
  choice: जैसा ... लिखा है, वैसे ही
  rationale: यह लिखित निर्देश के अनुरूप कार्य करने का सूत्र है; सहसम्बन्धी हिन्दी रचना अनुपालन के भाव को स्पष्ट रखती है।
- source_word: עַל סֵפֶר הַבְּרִית הַזֶּה
  choice: इस वाचा की पुस्तक में
  rationale: כתב के साथ עַל दस्तावेज़ में लिखी सामग्री को इंगित करता है; हिन्दी में ‘पुस्तक में’ स्वाभाविक है। ‘इस’ संकेतवाचक को सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; हिन्दी में परिचित नामरूप ‘यहोवा’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में टेट्राग्रामटन प्रत्यक्ष रूप से आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ रखा गया है; ‘याहवे’ भी सम्भव लिप्यंतरण है।
- issue: פֶסַח का आशय
  choice: फसह मनाओ
  alternative: फसह का पालन करो; फसह बलि चढ़ाओ
  rationale: मुहावरा पूरे फसह-पालन को सूचित कर सकता है और सन्दर्भ में उत्सव तथा बलि दोनों जुड़े हैं। ‘मनाओ’ व्यापक अर्थ को खुला रखता है, जबकि केवल ‘बलि चढ़ाओ’ अर्थ को अनावश्यक रूप से संकुचित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण राजकीय-कथात्मक शैली। ‘वाचा’ और ‘फसह’ स्थापित बाइबलीय शब्द हैं; वाक्यक्रम को सहज हिन्दी के लिए बदला गया है, जबकि आदेश, लिखित मानक और वाचा-नाम सभी सुरक्षित हैं।
