  rationale: बहुवचन प्रत्यय पीछे उल्लिखित नष्ट की गई उपासना-वस्तुओं की ओर संकेत करता है; ‘उनके स्थानों’ में यह सम्बन्ध बना रहता है।
- source_word: עַצְמוֹת אָדָם
  choice: मनुष्यों की हड्डियों
  rationale: यहाँ אָדָם सामान्य रूप से मनुष्य को दर्शाता है, किसी विशेष पुरुष को नहीं। हिन्दी में बहुवचन ‘मनुष्यों की हड्डियों’ स्वाभाविक और अर्थ-सटीक है।
