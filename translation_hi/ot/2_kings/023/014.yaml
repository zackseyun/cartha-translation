  text: He shattered the pillars[a], cut down the Asherim, and filled their places with human bones.
translation:
  language: hi
  text: उसने उपासना-स्तम्भों को चकनाचूर कर दिया, अशेरा-प्रतीकों[a] को काट गिराया, और उनके स्थानों को मनुष्यों की हड्डियों से भर दिया।
  philosophy: optimal-equivalence
  footnotes:
