  alternative: मनुष्य की हड्डियों
  rationale: यहाँ शब्द मानव जाति के सदस्य को सामान्य अर्थ में दर्शाता है, न कि विशेष रूप से वयस्क पुरुष को। बहुवचन हिन्दी प्रयोग हड्डियों के मानवीय होने को सहज रूप से व्यक्त करता है।
- issue: אֲשֵׁרִים का स्वरूप
  choice: अशेरा-प्रतीकों
  alternative: अशेरा-खम्भों
  rationale: मूल शब्द अशेरा से सम्बद्ध उपासना-वस्तुओं का द्योतक है, लेकिन अकेला शब्द उनकी भौतिक आकृति निश्चित नहीं करता; इसलिए मुख्य पाठ में व्यापक पद रखा गया और प्रचलित विकल्प पाद-टिप्पणी में दिया गया।
