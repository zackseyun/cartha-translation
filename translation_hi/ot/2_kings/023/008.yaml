  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
translation:
  language: hi
  text: वह यहूदा के नगरों से सभी याजकों को ले आया और गेबा से बेर्शेबा तक उन ऊँचे स्थानों को अशुद्ध कर दिया, जहाँ याजक धूप जलाते थे। उसने फाटकों के उन ऊँचे स्थानों को भी ढा दिया[a], जो नगर के अधिकारी यहोशू के फाटक के प्रवेश पर थे और नगर के फाटक पर किसी व्यक्ति की बाईं ओर थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक अर्थ-स्पष्ट रूप में, “फाटकों के पास के पूजा-स्थलों को।” इब्रानी में शाब्दिक रूप से “फाटकों के ऊँचे स्थान” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्यांश कठिन है और शाब्दिक अर्थ है, “जो नगर के फाटक पर किसी व्यक्ति की बाईं ओर थे।” सम्भवतः आशय फाटक में प्रवेश करते समय बाईं ओर से है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבֵא
  choice: बुलवा लिया
  rationale: हिफ़ील रूप का अर्थ ‘ले आना/आने को बुलाना’ है। प्रसंग में योशिय्याह द्वारा यहूदा के नगरों से याजकों को अपने पास मँगवाना अभिप्रेत है; ‘बुलवा लिया’ सहज हिन्दी में कारक भाव व्यक्त करता है।
- source_word: וַיְטַמֵּא
  choice: अशुद्ध कर दिया
  rationale: पिएल रूप उपासना-स्थलों को धार्मिक रीति से अपवित्र अथवा अनुपयोगी बनाने को दर्शाता है। ‘अशुद्ध कर दिया’ सामान्य पाठक के लिए स्पष्ट और स्रोत के निकट है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थानों
  rationale: במה स्थानीय उपासना-स्थल के लिए पारंपरिक पद है। ‘ऊँचे स्थान’ उसकी भौतिक और धार्मिक दोनों संगतियों को अनावश्यक व्याख्या के बिना बनाए रखता है।
- source_word: קִטְּרוּ שָׁמָּה
  choice: जहाँ याजक धूप जलाते थे
  rationale: קטר यहाँ धूप अथवा धुएँवाली भेंट जलाने का बोध देता है। ‘धूप जलाते थे’ स्वाभाविक हिन्दी है और शמה को सम्बन्धवाचक ‘जहाँ’ में व्यक्त करता है।
- source_word: מִגֶּבַע עַד בְּאֵר שָׁבַע
  choice: गेबा से लेकर बेर्शेबा तक
  rationale: यह यहूदा के उत्तर-दक्षिण विस्तार का भौगोलिक संकेत है। स्थान-नामों का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְנָתַץ
  choice: ढा दिया
  rationale: נתץ का अर्थ किसी संरचना को गिराना या ध्वस्त करना है। ‘ढा दिया’ संक्षिप्त, सजीव और स्वाभाविक है।
- source_word: בָּמוֹת הַשְּׁעָרִים
  choice: फाटकों के उन ऊँचे स्थानों
  rationale: इब्रानी का संक्षिप्त संबंधसूचक पदबंध ‘फाटकों के ऊँचे स्थान’ के रूप में निकटता से रखा गया है। सम्भावित अर्थ ‘फाटकों के पास के पूजा-स्थल’ पादटिप्पणी में दिया गया है।
- source_word: שַׂר הָעִיר
  choice: नगर के अधिकारी
  rationale: שׂר civic context में प्रधान, प्रशासक या अधिकारी हो सकता है। ‘नगर का अधिकारी’ राजकीय पद का अत्यधिक विशिष्टीकरण किए बिना अर्थ देता है।
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ בְּשַׁעַר הָעִיר
  choice: नगर के फाटक में प्रवेश करनेवाले व्यक्ति की बाईं ओर
  rationale: मूल वाक्यांश कठिन और दीर्घवृत्तीय है—शाब्दिक रूप से ‘जो नगर के फाटक में किसी व्यक्ति की बाईं ओर [था/थे]’। मुख्य पाठ सम्भावित दिशात्मक अर्थ को पठनीय बनाता है और अनिश्चितता पादटिप्पणी में सुरक्षित रखता है।
