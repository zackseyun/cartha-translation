id: 2KI.23.22
reference: 2 Kings 23:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לֹ֤א נַֽעֲשָׂה֙ כַּ/פֶּ֣סַח הַ/זֶּ֔ה מִ/ימֵי֙ הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר שָׁפְט֖וּ אֶת יִשְׂרָאֵ֑ל וְ/כֹ֗ל יְמֵ֛י מַלְכֵ֥י יִשְׂרָאֵ֖ל וּ/מַלְכֵ֥י יְהוּדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/022.yaml
  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
translation:
  language: hi
  text: क्योंकि इस फसह के समान कोई फसह[a] इस्राएल का न्याय करने वाले न्यायियों के दिनों से लेकर इस्राएल के राजाओं और यहूदा के राजाओं के पूरे काल में कभी नहीं मनाया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस फसह के समान”; भाव है, “ऐसा फसह।”
    reason: तुलनात्मक इब्रानी पदबंध का शाब्दिक रूप और उसका स्वाभाविक भाव स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: נַעֲשָׂה
  choice: मनाया गया था
  rationale: क्रिया का मूल अर्थ ‘किया गया’ है, पर फसह के अनुष्ठान के संदर्भ में ‘मनाया गया’ आधुनिक हिन्दी का स्वाभाविक और सटीक प्रयोग है।
- source_word: כַּפֶּסַח הַזֶּה
  choice: इस फसह के समान कोई फसह
  rationale: तुलनार्थक כְּ और ‘यह फसह’ को स्पष्ट रूप से व्यक्त करता है। इससे यह अर्थ नहीं निकलता कि पहले कभी फसह मनाया ही नहीं गया था, बल्कि यह कि इस जैसा फसह नहीं मनाया गया था।
- source_word: מִימֵי הַשֹּׁפְטִים
  choice: न्यायियों के दिनों से लेकर
  rationale: מִן कालगत आरंभ-बिंदु बताता है; आगे राजाओं के पूरे काल तक फैली तुलना के साथ ‘से लेकर’ हिन्दी में सहज है।
- source_word: אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  choice: इस्राएल का न्याय करने वाले
  rationale: ‘न्यायियों’ और ‘न्याय करने’ के बीच इब्रानी शब्द-संबंध सुरक्षित रहता है और उनके ऐतिहासिक पद का संकेत भी बना रहता है।
- source_word: וְכֹל יְמֵי מַלְכֵי יִשְׂרָאֵל וּמַלְכֵי יְהוּדָה
  choice: इस्राएल के राजाओं और यहूदा के राजाओं के पूरे काल में
  rationale: दोनों राज्यों के राजाओं का अलग-अलग उल्लेख सुरक्षित रखता है और ‘सभी दिनों’ को स्वाभाविक हिन्दी में ‘पूरे काल’ के रूप में व्यक्त करता है।
theological_decisions:
- issue: ऐतिहासिक तुलना का दायरा
  choice: योशिय्याह के फसह के समान कोई फसह न्यायियों के समय से लेकर इस्राएल और यहूदा के राजाओं के पूरे काल में नहीं मनाया गया था।
  alternative: इन युगों में कोई फसह बिल्कुल भी नहीं मनाया गया था।
  rationale: כַּפֶּסַח הַזֶּה में स्पष्ट तुलना है—‘इस फसह के समान।’ इसलिए पद पहले के सभी फसह-पालन का निषेध नहीं करता, बल्कि इस फसह की असाधारणता बताता है; कथन की ऐतिहासिक प्रकृति या संभावित अतिशयोक्ति का प्रश्न अनावश्यक रूप से नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘न्यायी,’ ‘फसह’ और ‘इस्राएल/यहूदा’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; वाक्य में इब्रानी की ऐतिहासिक तुलना और दोनों राजतंत्रों का पृथक उल्लेख सुरक्षित है।
