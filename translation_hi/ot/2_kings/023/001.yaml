  yaml_path: translation/ot/2_kings/023/001.yaml
  text: Then the king sent[a], and all the elders of Judah and Jerusalem were gathered to him.
translation:
  language: hi
  text: तब राजा ने संदेश भेजा[a], और यहूदा और यरूशलेम के सभी बुज़ुर्ग उसके पास इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्पष्ट रूप से, “तब राजा ने यहूदा और यरूशलेम के सभी बुज़ुर्गों को बुलावा भेजा, और वे उसके पास इकट्ठे हुए।”
    reason: हिब्रू क्रिया का कर्म स्पष्ट नहीं है; प्रसंग में संदेश या बुलावा भेजना निहित हो सकता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है; यहाँ कोई स्पष्ट कर्म नहीं दिया गया। ‘संदेश भेजा’ राजकीय बुलावे का प्रसंग स्वाभाविक रूप से व्यक्त करता है, पर बुलाने की बात को मुख्य पाठ में अत्यधिक स्पष्ट नहीं करता।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित उपाधि को प्रसंगानुसार ‘राजा’ कहा गया है; पद में योशिय्याह का नाम जोड़ना उचित नहीं।
- source_word: וַיַּאַסְפוּ אֵלָיו
  choice: उसके पास इकट्ठे हुए
  rationale: हिब्रू क्रिया सक्रिय बहुवचन है और אֵלָיו दिशा को बताता है; इसलिए सक्रिय हिंदी वाक्य मूल संरचना और अर्थ दोनों को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: כָּל זִקְנֵי
  choice: सभी पुरनिये
  rationale: כָּל की समग्रता को ‘सभी’ और संस्थागत नागरिक अगुओं के अर्थ वाले זִקְנֵי को प्रतिष्ठित बाइबलीय हिंदी ‘पुरनिये’ से व्यक्त किया गया है।
- source_word: יְהוּדָה וִירוּשָׁלִָם
  choice: यहूदा और यरूशलेम
  rationale: दोनों स्थान-नामों के प्रचलित हिंदी बाइबलीय रूप रखे गए हैं; वाव को ‘और’ से व्यक्त किया गया है।
