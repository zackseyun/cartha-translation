base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
translation:
  language: hi
  text: तब उसने कहा, “वह स्मारक[a] क्या है जो मुझे दिखाई दे रहा है?” नगर के लोगों ने उससे कहा, “वह परमेश्वर के उस जन की कब्र है, जो यहूदा से आया था और जिसने उन बातों की घोषणा की थी जो आपने बेतेल की वेदी के विरुद्ध किए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चिह्न,” “स्मृति-चिह्न,” अथवा “कब्र का निशान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּיּוּן
  choice: स्मारक
  rationale: यह संज्ञा किसी स्थान को पहचान देने वाले चिह्न या स्मृति-चिह्न को दर्शाती है। प्रसंग में यह कब्र से जुड़ा दिखाई देने वाला चिह्न है; ‘स्मारक’ वस्तु का रूप अनावश्यक रूप से निश्चित किए बिना अर्थ व्यक्त करता है।
- source_word: הַלָּז
  choice: वह
  rationale: यह दृश्य वस्तु की ओर संकेत करने वाला शब्द है। हिंदी में दूर या सामने दिखाई दे रही वस्तु के लिए ‘वह’ स्वाभाविक है।
- source_word: אֲנִי רֹאֶה
  choice: मुझे दिखाई दे रहा है
  rationale: यह वर्तमान में दिखाई पड़ने की क्रिया को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: הַקֶּבֶר
  choice: कब्र
  rationale: चिह्नित दफ़न-स्थान के इस प्रसंग में ‘कब्र’ स्पष्ट और सामान्य हिंदी शब्द है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: हिब्रू उपाधि का पारदर्शी अनुवाद रखा गया है; इसे अधिक संकीर्ण रूप से ‘भविष्यद्वक्ता’ नहीं बनाया गया।
- source_word: מִיהוּדָה
  choice: यहूदा से
  rationale: भौगोलिक उद्गम का सीधा और प्रचलित हिंदी रूप।
- source_word: וַיִּקְרָא
  choice: घोषणा की
  rationale: 1 राजा 13 की पृष्ठभूमि में यह वेदी के विषय में सार्वजनिक भविष्यसूचक उद्घोषणा है। ‘घोषणा की’ उस बल को व्यक्त करता है, जबकि वैकल्पिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: उन बातों
  rationale: यह अभिव्यक्ति बोले गए वचनों और उनके द्वारा बताई गई घटनाओं, दोनों की ओर संकेत कर सकती है; ‘बातों’ इस व्यापकता को बनाए रखता है।
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: जिन्हें आपने पूरा किया है
  rationale: प्रसंग में योशिय्याह के हाल के कार्य पहले की घोषणा की पूर्ति हैं। हिंदी में ‘पूरा किया है’ संबंध को स्पष्ट और स्वाभाविक बनाता है, यद्यपि अधिक शाब्दिक विकल्प पाद-टिप्पणी योग्य है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी के विरुद्ध
  rationale: प्रसंग में घोषणा वेदी के न्याय और विनाश के विषय में है; ‘के विरुद्ध’ संबंध के प्रतिकूल भाव को बनाए रखता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
theological_decisions:
- issue: यहाँ स्मरण की गई भविष्यसूचक वाणी की पहचान
  choice: וַיִּקְרָא को ‘घोषणा की’ कहा गया, जिससे परमेश्वर के जन की भविष्यसूचक सार्वजनिक घोषणा प्रकट हो, पर 1 राजा 13 से अतिरिक्त विवरण न जोड़ा जाए।
  alternative: ‘पुकारकर कहा’ या ‘के विरुद्ध पुकारा’
  rationale: पद बेतेल की वेदी के विरुद्ध पहले की भविष्यवाणी की ओर संकेत करता है। चुना गया रूप भविष्यसूचक बल को स्पष्ट रखता है और मूल पाठ से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। संवाद में सम्मानसूचक ‘आपने’ नगरवासियों द्वारा राजा को संबोधित करने के अनुरूप है। ‘परमेश्वर का जन’ पारंपरिक बाइबलीय पदवी को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
