base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/031.yaml
  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: hi
  text: जब यहोआहाज राजा बना, तब वह तेईस वर्ष का था। उसने यरूशलेम में तीन महीने तक राज्य किया। उसकी माता का नाम हमूतल था, जो लिब्ना के यिर्मयाह की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: वह तेईस वर्ष का था
  rationale: यह आयु बताने का मानक इब्रानी मुहावरा है; हिंदी में इसका स्वाभाविक और सटीक रूप यही है।
- source_word: בְּמָלְכוֹ
  choice: जब यहोआहाज राजा बना
  rationale: ב prefixed infinitive accession का समय बताता है। 'राजा बना' आधुनिक हिंदी में स्वाभाविक है और राजत्व आरंभ होने का भाव स्पष्ट करता है।
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: उसने ... तीन महीने तक राज्य किया
  rationale: कालवाचक पद राजत्व की अवधि बताता है; 'तक' अवधि को हिंदी में सहज रूप से व्यक्त करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह राज्य करने के स्थान को बताने वाला सीधा स्थानवाचक पद है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: राजाओं की पुस्तक में प्रयुक्त वंश-सूचना के सूत्र को गरिमापूर्ण और स्वाभाविक हिंदी में रखा गया है।
- source_word: חֲמוּטַל
  choice: हमूतल
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण मूल उच्चारण के निकट रखा गया है।
- source_word: בַּת יִרְמְיָהוּ
  choice: यिर्मयाह की बेटी
  rationale: בַּת सीधे पुत्री-संबंध को व्यक्त करता है; पिता के नाम का प्रचलित हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: מִלִּבְנָה
  choice: लिब्ना के
  rationale: מן यहाँ यिर्मयाह के मूल स्थान अथवा नगर-संबंध को बताता है; हिंदी में 'लिब्ना के यिर्मयाह' इस पहचान-सूत्र का सहज रूप है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, संक्षिप्त और गरिमापूर्ण राजकीय विवरण। 'माता' औपचारिक कथात्मक शैली बनाए रखता है, जबकि 'बेटी' संबंध को सामान्य पाठक के लिए सहज बनाता है।
