  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
translation:
  language: hi
  text: उसने यहोवा के भवन में स्थित पंथ-संबंधी वेश्यावृत्ति में लगे पुरुषों के घर ढा दिए, जहाँ स्त्रियाँ अशेरा[c] के लिए आवरण[b] बुनती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “पर्दे”; अधिक शाब्दिक रूप से “घर।” संभवतः आशय अशेरा की पूजा से जुड़े बुने हुए आवरणों या कपड़े से बने मंदिरनुमा ढाँचों से है।
    reason: alternative_reading
  - marker: c
    text: “अशेरा” से आशय अशेरा देवी या उससे जुड़ी पूजावस्तु हो सकता है, जिसे कभी-कभी “अशेरा-स्तंभ” कहा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  choice: ढा दिए
  rationale: נתץ का अर्थ किसी संरचना को गिराना या ध्वस्त करना है; ‘ढा दिए’ सहज और सशक्त हिन्दी है।
- source_word: בָּתֵּי הַקְּדֵשִׁים
  choice: देवदासी पुरुषों के कक्ष
  rationale: בָּתֵּי का मूल अर्थ ‘घर’ है, पर मंदिर-परिसर में आशय कक्षों या निवास-स्थानों से है। קְדֵשִׁים पुल्लिंग बहुवचन है और यहाँ निषिद्ध उपासना-संबंधी यौन आचरण में लगे पुरुषों को सूचित करता है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘भवन’ בית की पारदर्शी अभिव्यक्ति है और יְהוָה को परियोजना के अनुसार ‘यहोवा’ रखा गया है।
- source_word: הַנָּשִׁים אֹרְגוֹת שָׁם
  choice: वहीं स्त्रियाँ ... बुने हुए ... बनाती थीं
  rationale: स्त्रीलिंग बहुवचन कृदन्त निरंतर या प्रचलित कार्य का बोध देता है; ‘वहीं’ शָׁם को रखते हुए मंदिर के भीतर के स्थान पर बल देता है।
- source_word: בָּתִּים לָאֲשֵׁרָה
  choice: अशेरा के लिए बुने हुए आवरण
  rationale: בָּתִּים का शाब्दिक अर्थ ‘घर’ है, किंतु बुनाई के संदर्भ में इसका आशय आवरणों, पर्दों अथवा कपड़े से बने मंदिरनुमा ढाँचों से हो सकता है। मुख्य पाठ में ‘आवरण’ अर्थ को सुबोध रखता है और पादटिप्पणी अनिश्चितता बताती है।
- source_word: לָאֲשֵׁרָה
  choice: अशेरा के लिए
  rationale: אֲשֵׁרָה देवी अथवा उससे जुड़ी पूजावस्तु—दोनों का संकेत कर सकता है; केवल ‘अशेरा’ इस द्वयर्थता को यथासंभव बनाए रखता है।
theological_decisions:
- issue: יְהוָה का रूपान्तरण
  choice: यहोवा
  alternative: याहवे
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और व्यक्तिगत ईश्वरीय नाम को नाम के रूप में रखता है।
- issue: אֲשֵׁרָה का आशय
  choice: अशेरा
  alternative: अशेरा देवी / अशेरा-स्तंभ
  rationale: मूल शब्द देवी या उससे जुड़ी पूजावस्तु का द्योतक हो सकता है; मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: הַקְּדֵשִׁים की पहचान
  choice: देवदासी पुरुष
  alternative: पंथ-वेश्याएँ / समर्पित जन
  rationale: पुल्लिंग बहुवचन को स्पष्ट रखा गया है और संदर्भगत निषिद्ध धार्मिक-यौन भूमिका व्यक्त की गई है; ‘समर्पित जन’ सकारात्मक पवित्रता का भ्रामक भाव दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य को दो भागों में बाँटकर जटिल इब्रानी संबंधवाचक संरचना स्वाभाविक की गई है। ‘देवदासी पुरुष’ असामान्य किंतु आवश्यक रूप से स्पष्ट पद है, क्योंकि मूल का व्याकरणिक रूप पुरुषों की ओर संकेत करता है।
