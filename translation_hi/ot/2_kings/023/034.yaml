base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
translation:
  language: hi
  text: फ़िरौन नको ने योशियाह के पुत्र एल्याकीम को उसके पिता योशियाह के स्थान पर राजा बनाया और उसका नाम बदलकर यहोयाकीम रखा। लेकिन वह यहोआहाज को अपने साथ ले गया, और यहोआहाज मिस्र आया[a] और वहीं मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘यहोआहाज मिस्र गया’ भी अनुवाद किया जा सकता है; इब्रानी में शाब्दिक रूप से ‘मिस्र आया’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  choice: राजा बनाया
  rationale: 'हिफ़ील रूप का कारणवाचक अर्थ है: फ़िरौन ने एल्याकीम को राजपद पर बैठाया। ‘राजा बनाया’ स्वाभाविक हिन्दी में इस अर्थ को स्पष्ट रखता है।'
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: राजकीय उत्तराधिकार के इस प्रसंग में यह शब्द किसी के बदले या उसके स्थान पर आने का भाव देता है।
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: उसका नाम बदलकर ... रखा
  rationale: इब्रानी मुहावरे का आशय नाम बदलना है; यह हिन्दी अभिव्यक्ति अर्थ और कथा-क्रम दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְאֶת־יְהוֹאָחָז לָקָח
  choice: लेकिन उसने यहोआहाज को ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग में बंदी बनाकर ले जाने का संकेत हो सकता है, पर पाठ स्वयं अधिक विशिष्ट क्रिया नहीं अपनाता; इसलिए अनावश्यक व्याख्या से बचते हुए सरल अभिव्यक्ति रखी गई है।
- source_word: וַיָּבֹא מִצְרַיִם
  choice: और वह मिस्र आया
  rationale: मूल क्रिया का सीधा अर्थ ‘आया’ है। हिन्दी में कथावाचक दृष्टिकोण से ‘गया’ अधिक सहज लग सकता है, पर मुख्य पाठ मूल की दिशा-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וַיָּמָת שָׁם
  choice: और वहीं मर गया
  rationale: यह मूल के संक्षिप्त और निर्णायक कथन का सीधा, स्वाभाविक हिन्दी रूप है।
