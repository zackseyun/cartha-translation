translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय स्थापना के लिए ‘राजा बनाया’ चुना गया है। अंतिम खंड में मूल के ‘आया’ को मुख्य पाठ में बनाए रखते हुए हिन्दी की स्वाभाविक वैकल्पिक दिशा ‘गया’ को पादटिप्पणी में दिया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी विषयवस्तु से मेल नहीं खाता था; हिन्दी प्रारूप में [a] को संबंधित शब्द ‘आया’ के बाद रखा गया है और अनावश्यक नाम-परिवर्तन टिप्पणी नहीं जोड़ी गई।
