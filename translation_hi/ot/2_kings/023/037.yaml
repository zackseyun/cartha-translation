  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुरा किया, ठीक वैसा ही जैसा उसके पूर्वजों[a] ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके पिता’; यहाँ इसका अर्थ ‘उसके पूर्वज’ या ‘पुरखे’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने किया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; हिन्दी में वाक्य-क्रम स्वयं इस निरंतरता को स्वाभाविक रूप से व्यक्त करता है, इसलिए अलग से ‘और’ आवश्यक नहीं है।
- source_word: הָרַע
  choice: वही जो बुरा था
  rationale: עשה הרע एक स्थापित मूल्यांकनात्मक मुहावरा है। यह रूप हिन्दी में स्वाभाविक रहते हुए ‘बुरा किया’ की अपेक्षा मूल के संज्ञीकृत भाव को अधिक स्पष्ट करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह किसी के मूल्यांकन या दृष्टिकोण को व्यक्त करने वाला इब्रानी मुहावरा है; ‘की दृष्टि में’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पूर्वजों के आचरण से पूर्ण अनुरूपता व्यक्त करता है। ‘ठीक वैसे ही जैसे’ हिन्दी में इस तुलनात्मक बल को स्वाभाविक ढंग से रखता है।
- source_word: עָשׂוּ
  choice: ने किया था
  rationale: ‘किया था’ वर्तमान में वर्णित राजा के काम से पहले उसके पुरखों द्वारा किए गए काम को स्पष्ट करता है।
- source_word: אֲבֹתָיו
  choice: उसके पुरखों
  rationale: राजकीय संदर्भ में אָבוֹת केवल तत्कालीन पिता नहीं, बल्कि पूर्वजों को भी सूचित करता है। ‘पुरखे’ सामान्य आधुनिक पाठक के लिए इस अर्थ को स्पष्ट रखता है; मूल का शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; अथवा ‘प्रभु’ जैसी प्रतिस्थापित उपाधि
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: अֲבֹתָיו का दायरा
  choice: उसके पुरखे
  alternative: उसके पिता
  rationale: राजा के मूल्यांकन के इस सूत्र में शब्द वंशगत पूर्वजों या पहले के राजाओं की ओर संकेत कर सकता है। ‘पुरखे’ इसी व्यापक अर्थ को व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। राजकीय मूल्यांकन के पारंपरिक सूत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है, और ईश्वरीय नाम को ‘याहवे’ के रूप में सुरक्षित रखा गया है।
