base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
translation:
  language: hi
  text: फिर बेतेल में जो वेदी थी—वह ऊँचा पूजा-स्थान जिसे नबात के पुत्र यारोबाम ने बनाया था—वही यारोबाम जिसने इस्राएल से पाप कराया था—उस वेदी और उस ऊँचे पूजा-स्थान को भी उसने ढा दिया। उसने ऊँचे पूजा-स्थान को जला दिया और उसे पीसकर धूल बना दिया; उसने अशेरा[a] को भी जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा का खंभा”; इब्रानी शब्द अशेरा की उपासना से जुड़ी पंथ-वस्तु के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मִזְבֵּחַ के लिए यह मानक, संक्षिप्त और स्वाभाविक हिन्दी शब्द है।
- source_word: בְּבֵית אֵל
  choice: बेतेल में
  rationale: स्थानसूचक בְּ का अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבָּמָה
  choice: ऊँचा पूजा-स्थान
  rationale: בָּמָה के ऊँचे स्थान और उसके धार्मिक उपयोग, दोनों को स्पष्ट करता है; केवल ‘पूजास्थल’ कहने से स्रोत का स्थानिक पक्ष छूट जाता।
- source_word: עָשָׂה
  choice: बनाया था
  rationale: मूल क्रिया ‘बनाना/करना’ है; ‘निर्माण किया’ अनावश्यक रूप से औपचारिक और ‘स्थापित किया’ अधिक व्याख्यात्मक होता।
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: इस्राएल से पाप कराया था
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को सीधे और संक्षिप्त ढंग से सुरक्षित रखता है।
- source_word: נָתָץ
  choice: ढा दिया
  rationale: किसी संरचना को तोड़कर गिराने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵדַק לְעָפָר
  choice: उसे पीसकर धूल बना दिया
  rationale: क्रिया के चूर्ण कर देने और परिणामस्वरूप धूल बन जाने, दोनों भावों को स्पष्ट करता है।
- source_word: אֲשֵׁרָה
  choice: अशेरा
  rationale: इब्रानी पद को लिप्यंतरित कर देवी और उससे संबद्ध उपासना-वस्तु के बीच की वास्तविक शाब्दिक अस्पष्टता बनाए रखी गई है।
theological_decisions:
- issue: אֲשֵׁרָה का संदर्भ
  choice: अशेरा
  alternative: अशेरा का खंभा; अशेरा की उपासना-वस्तु
  rationale: विनाश और जलाने के प्रसंग में लकड़ी की उपासना-वस्तु संभावित है, पर इब्रानी शब्द देवी अथवा उससे संबद्ध पंथ-वस्तु को सूचित कर सकता है। मुख्य पाठ में लिप्यंतरण इस अस्पष्टता को सुरक्षित रखता है और पादटिप्पणी संभावित वस्तुगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। लंबे इब्रानी वाक्य की बलाघाती संरचना को डैश और ‘भी’ से सुरक्षित किया गया है। ‘ऊँचा पूजा-स्थान’ तकनीकी धार्मिक अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
