  text: וְ/גַם֩ אֶת כָּל בָּתֵּ֨י הַ/בָּמ֜וֹת אֲשֶׁ֣ר בְּ/עָרֵ֣י שֹׁמְר֗וֹן אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֤י יִשְׂרָאֵל֙ לְ/הַכְעִ֔יס הֵסִ֖יר יֹֽאשִׁיָּ֑הוּ וַ/יַּ֣עַשׂ לָ/הֶ֔ם כְּ/כָל הַֽ/מַּעֲשִׂ֔ים אֲשֶׁ֥ר עָשָׂ֖ה בְּ/בֵֽית אֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/019.yaml
  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
translation:
  language: hi
  text: योशिय्याह ने सामरिया के नगरों में स्थित ऊँचे स्थानों के सभी भवन भी हटा दिए, जिन्हें इस्राएल के राजाओं ने क्रोध भड़काने के लिए[a] बनाया था। उसने उनके साथ वही सब किया जो उसने बेतेल में किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'संदर्भ के आधार पर अधिक स्पष्ट रूप से: “यहोवा का क्रोध भड़काने के लिए।”'
    reason: क्रोध का लक्ष्य हिब्रू में स्पष्ट नहीं कहा गया है, पर व्यापक संदर्भ से समझ में आता है।
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह कार्य पिछले वर्णन से जुड़ता है; हिंदी में ‘भी’ इसके योगात्मक बल को सहज रूप से व्यक्त करता है।
- source_word: בָּתֵּי הַבָּמוֹת
  choice: ऊँचे स्थानों के ... भवन
  rationale: शाब्दिक ठोस अभिव्यक्ति ‘ऊँचे स्थानों के भवन’ को बनाए रखता है; ‘ऊँचे स्थान’ पूजा-स्थलों के लिए स्थापित बाइबलीय पद है।
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: सामरिया के नगरों में
  rationale: रचना-संबंध को स्वाभाविक हिंदी में व्यक्त करता है; यहाँ सामरिया उत्तरी राज्य के क्षेत्र को सूचित करता है।
- source_word: לְהַכְעִיס
  choice: क्रोध भड़काने के लिए
  rationale: प्रयोजन का भाव रखता है और हिब्रू की तरह क्रोध के लक्ष्य को मुख्य पाठ में अनकहा छोड़ता है।
- source_word: הֵסִיר
  choice: हटा दिए
  rationale: सुधार और उपासना-स्थलों के उन्मूलन के संदर्भ में स्पष्ट, ठोस और स्वाभाविक हिंदी।
- source_word: וַיַּעַשׂ לָהֶם
  choice: उसने उनके साथ भी वैसा ही किया
  rationale: अगले तुलना-वाक्य के साथ मिलकर हिब्रू मुहावरे का स्वाभाविक हिंदी रूप देता है, बिना कार्य को अधिक विशिष्ट बनाए।
- source_word: כְּכָל הַמַּעֲשִׂים
  choice: वैसा ही ... जैसा
  rationale: हिब्रू के पूर्ण तुलनात्मक बल को हिंदी में संक्षिप्त और सहज ढंग से व्यक्त करता है।
- source_word: בְּבֵית אֵל
  choice: बेतेल में
  rationale: स्थान पर किए गए कार्यों के लिए स्वाभाविक हिंदी प्रयोग।
theological_decisions:
- issue: לְהַכְעִיס में क्रोध के लक्ष्य का निहित होना
  choice: 'मुख्य पाठ में लक्ष्य को अनकहा रखना: ‘क्रोध भड़काने के लिए’'
  alternative: ‘यहोवा का क्रोध भड़काने के लिए’
  rationale: व्यापक संदर्भ में लक्ष्य यहोवा है, पर इस उपवाक्य में हिब्रू उसे स्पष्ट रूप से नहीं कहता। मुख्य पाठ उस अस्पष्टता को बनाए रखता है और पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘ऊँचे स्थान’ पारंपरिक बाइबलीय शब्दावली को बनाए रखता है। पादटिप्पणी-चिह्न वाक्य के अंत में रखा गया है, पर उसका संबंध ‘क्रोध भड़काने’ से है।
