  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
translation:
  language: hi
  text: आहाज के ऊपरी कक्ष की छत पर की उन वेदियों को, जिन्हें यहूदा के राजाओं ने बनाया था, और याहवे के भवन के दोनों आँगनों में मनश्शे की बनाई वेदियों को भी राजा ने ढा दिया। उसने उन्हें वहीं चूर-चूर कर दिया और उनकी धूल किद्रोन की घाटी[b] में फेंक दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “किद्रोन के नाले में।” इब्रानी शब्द נַחַל जलधारा, नाला, खड्ड या घाटी को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  choice: वेदियों
  rationale: מִזְבֵּחַ का सामान्य अर्थ ‘वेदी’ है; दोनों स्थानों पर बहुवचन बनाए रखा गया है।
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  choice: आहाज की अटारी की छत पर
  rationale: עֲלִיָּה भवन के ऊपरी कमरे या अटारी को दर्शाता है; ‘अटारी’ आधुनिक हिन्दी में स्थापत्य-संबंधी अर्थ को सहजता से व्यक्त करता है।
- source_word: אֲשֶׁר עָשׂוּ מַלְכֵי יְהוּדָה
  choice: जिन्हें यहूदा के राजाओं ने बनवाया था
  rationale: राजाओं द्वारा वेदियाँ स्थापित करवाने का आशय स्वाभाविक हिन्दी में ‘बनवाया’ से व्यक्त होता है; ‘था’ पूर्ववर्ती क्रिया को स्पष्ट करता है।
- source_word: בִּשְׁתֵּי חַצְרוֹת בֵּית יְהוָה
  choice: याहवे के भवन के दोनों आँगनों में
  rationale: חָצֵר के लिए ‘आँगन’ और בֵּית के लिए ‘भवन’ मूल रूपक को बनाए रखते हुए सहज हिन्दी देते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में व्यक्तिगत नाम के रूप में रखा गया है।
- source_word: נָתַץ
  choice: ढा दिया
  rationale: यह क्रिया किसी निर्मित वस्तु को गिराने या ध्वस्त करने को दर्शाती है; वेदियों के संदर्भ में ‘ढा दिया’ सटीक और स्वाभाविक है।
- source_word: וַיָּרָץ מִשָּׁם
  choice: उन्हें वहीं चूर-चूर कर दिया
  rationale: संदर्भ में क्रिया को רצץ, ‘कुचलना/चूर करना’, से समझा गया है। ध्वस्त वेदियों की धूल फेंकने वाली अगली क्रिया इस अर्थ का समर्थन करती है; מִשָּׁם के स्थान-सूचक भाव को प्रवाहपूर्ण हिन्दी में ‘वहीं’ से व्यक्त किया गया है।
- source_word: עֲפָרָם
  choice: उनकी धूल
  rationale: עָפָר का मूल अर्थ ‘धूल’ है और यह वेदियों को चूर किए जाने के परिणाम को सजीव रूप में बनाए रखता है।
- source_word: נַחַל קִדְרוֹן
  choice: किद्रोन की घाटी
  rationale: נַחַל मौसमी जलधारा, नाला, खड्ड या उसकी घाटी को दर्शा सकता है; यहाँ ‘घाटी’ आधुनिक पाठक के लिए स्पष्ट है, जबकि विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: वेदियों को नष्ट करने की क्रिया וַיָּרָץ की व्याख्या
  choice: उन्हें चूर-चूर कर दिया
  alternative: वहाँ से चला गया; वहाँ से हटा दिया
  rationale: रूप में कुछ कठिनाई होने पर भी प्रसंग और उसके बाद ‘धूल’ फेंकने का उल्लेख רצץ, ‘कुचलना’, के अर्थ का समर्थन करते हैं। इससे योशिय्याह द्वारा उपासना-स्थलों के पूर्ण विनाश का कथात्मक बल बना रहता है, बिना अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। लंबे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, जबकि दोनों वेदी-समूहों पर राजा की एक ही कार्रवाई का संबंध स्पष्ट रखा गया है।
