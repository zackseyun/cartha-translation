source:
  edition: WLC
  text: אַ֗ךְ לֹ֤א יַֽעֲלוּ֙ כֹּהֲנֵ֣י הַ/בָּמ֔וֹת אֶל מִזְבַּ֥ח יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם כִּ֛י אִם אָכְל֥וּ מַצּ֖וֹת בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/009.yaml
  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
translation:
  language: hi
  text: फिर भी[a] ऊँचे स्थानों के याजक यरूशलेम में याहवे[b] की वेदी तक नहीं चढ़े; पर वे अपने भाइयों[c] के बीच अखमीरी रोटी खाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल इतना कि।” इब्रानी शब्द यहाँ पिछले पद में वर्णित सुधार के परिणाम पर सीमा अथवा अपवाद प्रकट कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का नाम YHWH है, जिसे परंपरागत रूप से “यहोवा” या “प्रभु” भी लिखा गया है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक अर्थ “अपने भाइयों के बीच”; संभवतः उनके साथी याजक या याजकीय कुल के सदस्य।
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह शब्द पिछले पद में वर्णित सुधार के परिणाम पर एक सीमा या अपवाद बताता है; ‘फिर भी’ उसका विरोधात्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַעֲלוּ
  choice: चढ़ने नहीं पाए
  rationale: עלה का मूल अर्थ ‘ऊपर चढ़ना’ है और यरूशलेम तथा वेदी के संदर्भ में यह उपासना में भाग लेने के लिए ऊपर जाने का भाव रखता है। प्रसंग बताता है कि इन याजकों को वेदी की सेवा में सम्मिलित होने की अनुमति नहीं मिली।
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: ऊँचे स्थानों के याजक
  rationale: यह रचना स्थानीय उपासना-स्थलों से जुड़े याजकों को दर्शाती है। ‘ऊँचे स्थान’ בָּמוֹת का पारदर्शी और प्रचलित बाइबलीय अनुवाद है।
- source_word: מִזְבַּח יְהוָה
  choice: याहवे की वेदी
  rationale: यह अनुवाद संबंधसूचक इब्रानी रचना को स्वाभाविक हिन्दी में रखता है और परमेश्वर के व्यक्तिगत नाम को सुरक्षित रखता है।
- source_word: כִּי אִם
  choice: पर
  rationale: यह पद के दो विपरीत तथ्यों—वेदी पर सेवा न करना और भाइयों के बीच भोजन करना—को संक्षेप और स्वाभाविक ढंग से जोड़ता है।
- source_word: אָכְלוּ מַצּוֹת
  choice: अखमीरी रोटी खाते थे
  rationale: מַצּוֹת खमीर के बिना बनाई गई रोटी को दर्शाता है। ‘अखमीरी रोटी’ आधुनिक हिन्दी में स्पष्ट तथा धार्मिक संदर्भ में परिचित अभिव्यक्ति है।
- source_word: בְּתוֹךְ אֲחֵיהֶם
  choice: अपने भाइयों के बीच
  rationale: यह मूल के ‘अपने भाइयों के बीच’ को बनाए रखता है और बिना स्पष्ट किए उसी संदर्भगत संभावना को खुला छोड़ता है कि ये भाई उनके साथी याजक या याजकीय कुल के सदस्य थे।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम YHWH है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है; पदवी ‘प्रभु’ से उसे बदलने के बजाय नाम को पाठ में रखा गया है।
- issue: אֲחֵיהֶם में पुरुषवाची संबंध-संज्ञा
  choice: अपने भाइयों
  alternative: अपने बंधुओं; अपने साथी याजकों
  rationale: इब्रानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और प्रसंग पुरुष याजकों का है। ‘साथी याजक’ अर्थ को संभवतः सही दिशा में स्पष्ट करता, पर मूल में ‘याजक’ दोहराया नहीं गया है, इसलिए अस्पष्टता सुरक्षित रखी गई है।
- issue: यरूशलेम की वेदी तक पहुँच का भाव
  choice: चढ़ने नहीं पाए
  alternative: नहीं चढ़े; नहीं चढ़ते थे
  rationale: निकटवर्ती संदर्भ में योशिय्याह द्वारा याजकों की स्थिति निर्धारित की गई है। यह रूप उनके वेदी-सेवा से वंचित रहने का भाव देता है, पर इसका अर्थ यह नहीं ठहराता कि वे किसी विशेष याजकीय श्रेणी के थे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊँचे स्थान’, ‘याजक’, ‘वेदी’ और ‘अखमीरी रोटी’ जैसे परिचित बाइबलीय पदों को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक हिन्दी में ढाला गया है।
