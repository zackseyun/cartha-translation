base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
translation:
  language: hi
  text: और यहोवा ने कहा, “मैं यहूदा को भी अपने सामने से हटा दूँगा, जैसे मैंने इस्राएल को हटाया था। मैं इस नगर को, जिसे मैंने चुना था, अर्थात् यरूशलेम को, और इस भवन को[a], जिसके विषय में मैंने कहा था, ‘मेरा नाम वहाँ रहेगा,’ अस्वीकार कर दूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घर।” इब्रानी में “घर/भवन”; इसका संकेत यरूशलेम के मंदिर की ओर है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अनुवाद “और मैंने इस नगर को, जिसे मैंने चुना था, अर्थात् यरूशलेम को, और इस भवन को अस्वीकार कर दिया है” भी हो सकता है। यहाँ आसपास की न्याय-घोषणा के अनुसार इसे भविष्य के अर्थ में अनूदित किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप; परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: אָסִיר / הֲסִרֹתִי (סור, Hiphil)
  choice: हटा दूँगा / हटाया था
  rationale: हिफ़ील का कारणवाचक भाव और यहूदा तथा इस्राएल के न्याय के बीच स्पष्ट समानता बनाए रखता है।
- source_word: מֵעַל פָּנַי
  choice: अपने सामने से
  rationale: इब्रानी मुहावरे की निकट और स्वाभाविक हिन्दी अभिव्यक्ति; इसमें सम्बन्धपरक तथा वाचागत बल बना रहता है।
- source_word: גַּם
  choice: भी
  rationale: यह बताता है कि इस्राएल के समान यहूदा भी उसी न्याय के अधीन होगा।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यहूदा के भावी हटाए जाने और इस्राएल के पहले हटाए जाने के बीच तुलना को स्पष्ट करता है।
- source_word: וּמָאַסְתִּי
  choice: और मैं ... अस्वीकार कर दूँगा
  rationale: रूपतः क़ातल होने पर भी प्रसंग में यह आसन्न न्याय की भविष्याभिमुख घोषणा को आगे बढ़ाता है; 'अस्वीकार' מאס के वाचागत त्याग को बिना अनावश्यक भावात्मक तीव्रता के व्यक्त करता है।
- source_word: הָעִיר הַזֹּאת אֲשֶׁר בָּחַרְתִּי אֶת יְרוּשָׁלִַם
  choice: इस नगर को, जिसे मैंने चुना था—यरूशलेम को—
  rationale: यरूशलेम को 'इस नगर' की समानाधिकरण पहचान के रूप में बनाए रखता है; डैश आधुनिक हिन्दी में इसे साफ़ करता है।
- source_word: הַבַּיִת
  choice: इस भवन को
  rationale: '''भवन'' मूल ''घर/भवन'' के रूपक को सुरक्षित रखता है और प्रसंग में यरूशलेम के मंदिर का संकेत देता है; स्पष्टता हेतु पादटिप्पणी जोड़ी गई है।'
- source_word: יִהְיֶה שְׁמִי שָׁם
  choice: मेरा नाम वहाँ रहेगा
  rationale: परमेश्वर के नाम के चुने हुए पवित्रस्थान में रहने की बाइबलीय धारणा को सीधी और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: וּמָאַסְתִּי का कालगत बल
  choice: 'भविष्याभिमुख: “अस्वीकार कर दूँगा”'
  alternative: “अस्वीकार कर दिया है”
  rationale: इब्रानी पूर्ण रूप को पूर्ण क्रिया भी समझा जा सकता है, पर यहाँ यह ‘मैं यहूदा को भी ... हटा दूँगा’ वाली न्याय-घोषणा को आगे बढ़ाता है। मुख्य पाठ में भविष्याभिमुख प्रवाह रखा गया और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
- issue: הַבַּיִת का अनुवाद
  choice: “भवन”
  alternative: “मंदिर”
  rationale: मूल शब्द का शाब्दिक और अंतरपाठीय स्वर बनाए रखते हुए पादटिप्पणी में स्पष्ट किया गया है कि संकेत यरूशलेम के मंदिर की ओर है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘यहोवा’ को वाचा-नाम के रूप में रखा गया है। वाक्य-संरचना मूल की समानांतर न्याय-घोषणा को बनाए रखती है; ‘भवन’ और क्रिया के कालगत विकल्प को पादटिप्पणियों में स्पष्ट किया गया है।
