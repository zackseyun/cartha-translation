base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
translation:
  language: hi
  text: इसके अलावा, योशिय्याह ने यहूदा देश और यरूशलेम में पाए जानेवाले प्रेत-साधकों, आत्माओं से संपर्क करनेवालों, गृह-देवताओं, मूर्तियों और सभी घृणित वस्तुओं को हटा दिया। उसने यह इसलिए किया ताकि व्यवस्था की उन बातों को लागू कर सके, जो उस पुस्तक[a] में लिखी थीं जिसे हिल्किय्याह याजक ने याहवे के भवन में पाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस लपेटे हुए ग्रंथ-पत्र में।” इब्रानी शब्द किसी लिखित दस्तावेज़, प्रायः लपेटे हुए ग्रंथ-पत्र, के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
