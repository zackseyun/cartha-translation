  choice: इसके अलावा
  rationale: पिछले सुधार-कार्यों में एक और कार्य जोड़नेवाले इब्रानी संयोजक के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֹבוֹת
  choice: प्रेत-साधकों
  rationale: इस प्रसंग में मृतकों की आत्माओं से संपर्क साधनेवाले व्यक्तियों का संकेत है; यह शब्द आधुनिक हिन्दी में संक्षिप्त और बोधगम्य है।
- source_word: הַיִּדְּעֹנִים
  choice: आत्माओं से संपर्क करनेवालों
  rationale: गुप्त आत्मिक ज्ञान अथवा आत्माओं से संपर्क से जुड़े साधकों को स्पष्ट करता है और पहले शब्द से इसकी निकटता को बनाए रखता है।
- source_word: הַתְּרָפִים
  choice: गृह-देवताओं
  rationale: घरों में रखी जानेवाली उपासना-वस्तुओं अथवा घरेलू देव-प्रतिमाओं के संभावित कार्य को सहज हिन्दी में व्यक्त करता है।
- source_word: הַגִּלֻּלִים
  choice: मूर्तियों
  rationale: यह मूर्तियों के लिए प्रयुक्त तिरस्कारसूचक शब्द है; हिन्दी में ‘मूर्तियों’ स्पष्ट है, जबकि मूल की अपमानसूचक छाया को अत्यधिक व्याख्यात्मक बनाए बिना पूरी तरह लाना कठिन है।
- source_word: כָּל הַשִּׁקֻּצִים
  choice: सभी घृणित वस्तुओं
  rationale: धार्मिक और नैतिक रूप से घृणित मानी गई वस्तुओं के व्यापक अर्थ को बनाए रखता है।
- source_word: נִרְאוּ
  choice: पाए जानेवाले
  rationale: शाब्दिक ‘दिखाई देनेवाले’ की अपेक्षा सूची में व्यक्तियों और वस्तुओं दोनों के लिए अधिक स्वाभाविक है, और उनके उस क्षेत्र में विद्यमान होने का भाव देता है।
- source_word: בִּעֵר
  choice: हटा दिया
  rationale: क्रिया का अर्थ जला डालना, निर्मूल करना या दूर करना हो सकता है; विविध प्रकार के व्यक्तियों और वस्तुओं वाली सूची के कारण ‘हटा दिया’ किसी एक विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְמַעַן הָקִים
  choice: यह इसलिए किया कि ... लागू करे
  rationale: उद्देश्य और व्यवस्था के वचनों को व्यवहार में प्रभावी करने का भाव स्पष्ट करता है; इसे भविष्यवाणी की पूर्ति के अर्थ में सीमित नहीं करता।
- source_word: דִּבְרֵי הַתּוֹרָה
  choice: व्यवस्था की ... बातों
  rationale: यहाँ तोराह खोजे गए दस्तावेज़ की वाचा-संबंधी व्यवस्था या शिक्षा है; ‘व्यवस्था’ प्रसंगानुकूल और हिन्दी बाइबलीय भाषा में परिचित है।
- source_word: הַכְּתֻבִים עַל הַסֵּפֶר
  choice: उस पुस्तक[a] में लिखी थीं
  rationale: आधुनिक हिन्दी में लिखित दस्तावेज़ के लिए स्वाभाविक अभिव्यक्ति है; उसके पुस्तक अथवा लपेटे हुए पत्र होने की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: मूल के ‘याहवे का घर/भवन’ को निकटता से रखता है और व्याख्यात्मक ‘मन्दिर’ से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल के विशिष्ट व्यक्तिगत ईश्वरीय नाम को नाम के रूप में बनाए रखता है और उसे उपाधि में परिवर्तित नहीं करता।
- issue: व्यवस्था के वचनों को ‘स्थापित’ करने का अर्थ
  choice: लागू करे
  alternative: स्थापित करे / पूरा करे
  rationale: הָקִים के ‘कायम करना, प्रभावी करना’ भाव को इस ऐतिहासिक सुधार के संदर्भ में व्यक्त करता है; ‘पूरा करे’ से भविष्यवाणी-पूर्ति का अनावश्यक अर्थ निकल सकता है, जबकि ‘स्थापित करे’ हिन्दी में अस्पष्ट लग सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर उद्देश्य-संबंध और आशय सुरक्षित हैं। गुप्त साधना से जुड़े दोनों निकटार्थी पदों को अलग-अलग रखा गया है, और मूल की संभावित पुस्तक/लपेटे हुए पत्र वाली अस्पष्टता पादटिप्पणी में दी गई है।
