base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/023.yaml
  text: but only in the eighteenth year of King Josiah was this Passover kept for Yahweh in Jerusalem[a].
translation:
  language: hi
  text: परन्तु राजा योशिय्याह के शासन के अठारहवें वर्ष में ही यह फसह यरूशलेम में यहोवा के लिए मनाया गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘किया गया’; यहाँ अर्थ है ‘मनाया गया’ या ‘पालन किया गया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: बल्कि ... में ही
  rationale: यह पद पिछले कथन के विपरीत एक सीमित अपवाद बताता है; ‘बल्कि’ और ‘ही’ मिलकर उस विरोध और बल को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: राजा योशिय्याह के शासन के अठारहवें वर्ष में
  rationale: लामेद राजकीय वर्ष का संदर्भ देता है। ‘शासन के ... वर्ष’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है, जबकि मूल की काल-सूचना सुरक्षित रहती है।
- source_word: נַעֲשָׂה
  choice: मनाया गया
  rationale: क्रिया का मूल अर्थ ‘किया गया’ है, पर फसह के संदर्भ में ‘मनाया गया’ स्वाभाविक और प्रसंगानुकूल है तथा कर्मवाच्य रूप बनाए रखता है।
- source_word: הַפֶּסַח הַזֶּה
  choice: यह फसह
  rationale: निश्चयवाचक और संकेतवाचक संरचना का सीधा अनुवाद; ‘फसह’ हिन्दी बाइबलीय प्रयोग में स्थापित पद है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद समर्पण अथवा उद्देश्य दर्शाता है। ‘के लिए’ इस पर्व के यहोवा के सम्मान में मनाए जाने का भाव स्वाभाविक रूप से देता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग का सीधा और प्रचलित हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम सीधे प्रयुक्त है। हिन्दी के व्यापक और परिचित बाइबलीय रूप ‘यहोवा’ से नाम को उपाधि में बदले बिना सुरक्षित रखा गया है; ‘याहवे’ अधिक निकट ध्वन्यात्मक विकल्प है, पर हिन्दी पाठकों में अपेक्षाकृत कम परिचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शासन के अठारहवें वर्ष’ राजकीय कालगणना को सामान्य पाठक के लिए स्पष्ट करता है। मुख्य पाठ का [a] चिह्न संबंधित शाब्दिक विकल्प की पादटिप्पणी से जुड़ा है।
