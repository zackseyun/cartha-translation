base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
translation:
  language: hi
  text: तब राजा ने महायाजक हिल्किय्याह, दूसरे पद के याजकों और द्वारपालों को आज्ञा दी कि वे यहोवा के मन्दिर से वे सभी पात्र बाहर निकालें जो बाल, अशेरा[a] और आकाश की सारी सेना के लिए बनाए गए थे। उसने उन्हें यरूशलेम के बाहर किद्रोन के खेतों में जला दिया और उनकी धूल बेतेल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा-खम्भे के लिए”; इब्रानी शब्द देवी अशेरा या उससे जुड़ी किसी उपासना-वस्तु—दोनों में से किसी को सूचित कर सकता है।
    reason: मूल इब्रानी אֲשֵׁרָה की वास्तविक शाब्दिक और संदर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְצַו הַמֶּלֶךְ
  choice: तब राजा ने ... आज्ञा दी
  rationale: वर्णनात्मक वाव को हिन्दी में स्वाभाविक क्रमसूचक ‘तब’ से व्यक्त किया गया है; צוה का राजकीय अधिकार ‘आज्ञा दी’ में सुरक्षित है।
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक हिल्किय्याह
  rationale: הַכֹּהֵן הַגָּדוֹל पदनाम है; ‘महायाजक’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  choice: दूसरे पद के याजक
  rationale: מִשְׁנֶה के द्वितीय श्रेणी अथवा पद के भाव को सुरक्षित रखा गया है, बिना उनकी सटीक संस्थागत भूमिका को आवश्यकता से अधिक निश्चित किए।
- source_word: שֹׁמְרֵי הַסַּף
  choice: द्वारपाल
  rationale: शाब्दिक ‘देहरी के रखवाले’ का स्वाभाविक हिन्दी समतुल्य ‘द्वारपाल’ है और मन्दिर के आधिकारिक कार्य का भाव बनाए रखता है।
- source_word: מֵהֵיכַל יְהוָה
  choice: यहोवा के मन्दिर से
  rationale: इस याजकीय और उपासना-सामग्री वाले प्रसंग में הֵיכָל का अर्थ स्पष्टतः मन्दिर है; व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: כָּל הַכֵּלִים
  choice: वे सभी पात्र
  rationale: כְּלִי उपासना में प्रयुक्त विभिन्न वस्तुओं या पात्रों को सूचित कर सकता है; ‘पात्र’ संक्षिप्त और प्रतिष्ठित हिन्दी है।
- source_word: לַבַּעַל וְלָאֲשֵׁרָה וּלְכֹל צְבָא הַשָּׁמָיִם
  choice: बाल, अशेरा और आकाश की सारी सेना के लिए
  rationale: तीनों לְ पदबंधों की समानांतर रचना सुरक्षित है। ‘अशेरा’ देवी और उससे संबंधित उपासना-वस्तु के बीच मूल की अस्पष्टता बनाए रखता है।
- source_word: בְּשַׁדְמוֹת קִדְרוֹן
  choice: किद्रोन के खेतों में
  rationale: שַׁדְמוֹת कृषि-क्षेत्रों को दर्शाता है; ‘खेतों’ से स्थान का अर्थ सहज रूप में आता है।
- source_word: וְנָשָׂא אֶת עֲפָרָם
  choice: और उनकी राख जैसी धूल ... ले गया
  rationale: עָפָר मूलतः धूल है, केवल ‘राख’ नहीं; वस्तुओं को जलाने के प्रसंग में ‘राख जैसी धूल’ लक्ष्य भाषा में स्पष्ट रहते हुए स्रोत का शब्दार्थ सुरक्षित रखता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम प्रत्यक्ष है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אֲשֵׁרָה का अभिप्राय
  choice: अशेरा[a]
  alternative: अशेरा-खम्भा; अशेरा की उपासना-वस्तु
  rationale: यह शब्द देवी अथवा उससे संबद्ध पूजावस्तु दोनों को सूचित कर सकता है। मुख्य पाठ में ‘अशेरा’ मूल की अस्पष्टता सुरक्षित रखता है और पादटिप्पणी दूसरा अर्थ बताती है।
- issue: कर्म-सामंजस्य और जलाने वाले का कर्ता
  choice: उसने उन्हें ... जला दिया
  alternative: उन्होंने उन्हें ... जला दिया
  rationale: וַיִּשְׂרְפֵם का क्रियारूप एकवचन पुल्लिंग है, इसलिए व्याकरणतः निकटतम स्पष्ट कर्ता राजा है; अनुवाद इसी को दर्शाता है, यद्यपि आदेश का वास्तविक निष्पादन अधिकारियों द्वारा हुआ हो सकता है।
