base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
translation:
  language: hi
  text: फिर योशियाह मुड़ा और उसने उस पहाड़ पर जो कब्रें[a] थीं, उन्हें देखा। उसने लोगों को भेजा और कब्रों में से हड्डियाँ निकलवाईं, उन्हें वेदी पर जलाया और उसे अशुद्ध किया। यह यहोवा के उस वचन के अनुसार हुआ, जिसकी घोषणा परमेश्वर के जन ने की थी, जिसने इन बातों की घोषणा की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘समाधियाँ’ अथवा ‘दफनाने की जगहें’; इब्रानी शब्द सामान्य रूप से दफन-स्थलों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पुकारकर कहा’ या ‘ऊँचे स्वर से घोषित किया’; इब्रानी क्रिया सार्वजनिक और ऊँचे स्वर की घोषणा का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: मुड़कर
  rationale: פנה का सामान्य अर्थ मुड़ना है; यह देखने से पहले योशियाह की शारीरिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַקְּבָרִים
  choice: कब्रों
  rationale: קבר कब्र, समाधि या दफनाने की जगह को सूचित कर सकता है। प्रसंग में पहचाने जा सकने वाले दफन-स्थलों के लिए ‘कब्रें’ सहज और पर्याप्त व्यापक है।
- source_word: בָּהָר
  choice: पहाड़ पर
  rationale: הַר का अर्थ पहाड़ या पहाड़ी हो सकता है। ‘पहाड़’ मूल शब्द की सीधी भौगोलिक सूचना को सुरक्षित रखता है।
- source_word: הָעֲצָמוֹת
  choice: हड्डियाँ
  rationale: עצמות का ठोस और शाब्दिक अर्थ ‘हड्डियाँ’ है; वेदी को अशुद्ध किए जाने की क्रिया समझने के लिए इसे बनाए रखना महत्त्वपूर्ण है।
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  choice: उन्हें वेदी पर जलाकर
  rationale: प्रत्यक्ष कर्म हड्डियाँ हैं और עַל הַמִּזְבֵּחַ का स्वाभाविक अर्थ ‘वेदी पर’ है।
- source_word: וַיְטַמְּאֵהוּ
  choice: उसे अशुद्ध कर दिया
  rationale: टामे क्रिया अनुष्ठानिक अशुद्धता दर्शाती है। पुल्लिंग एकवचन प्रत्यय का निकटतम और प्रसंगानुकूल संदर्भ वेदी है।
- source_word: כִּדְבַר יְהוָה
  choice: इस प्रकार यहोवा का वह वचन पूरा हुआ
  rationale: शाब्दिक अर्थ ‘यहोवा के वचन के अनुसार’ है। हिन्दी में यह रूप पूर्ववाणी की पूर्ति का संबंध स्पष्ट और स्वाभाविक बनाता है, बिना नई घटना जोड़े।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुराक्षरी दिव्य नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी उपाधि का स्थापित, गरिमापूर्ण हिन्दी रूप है और इसे केवल ‘भविष्यद्वक्ता’ कहकर संकुचित नहीं करता।
- source_word: קָרָא
  choice: घोषणा की
  rationale: קרא पुकारने या सार्वजनिक रूप से घोषित करने का भाव रखता है। यहाँ आधिकारिक भविष्यसूचक कथन के लिए ‘घोषणा करना’ उपयुक्त है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों
  rationale: דברים का अर्थ शब्द या बातें/घटनाएँ हो सकता है। यहाँ पूर्वकथित कार्यों के व्यापक संदर्भ में ‘बातों’ स्वाभाविक है।
theological_decisions:
- issue: योशियाह के कार्य और पहले दिए गए दिव्य वचन का संबंध
  choice: पूर्ति-सूचक अर्थ को ‘इस प्रकार ... वचन पूरा हुआ’ के रूप में व्यक्त किया गया।
  alternative: ‘यहोवा के उस वचन के अनुसार’
  rationale: כִּדְבַר יְהוָה योशियाह के कार्य को परमेश्वर के जन द्वारा पहले घोषित यहोवा के वचन से जोड़ता है। चुना हुआ हिन्दी रूप उसी पूर्ति-संबंध को स्पष्ट करता है।
- issue: अंतिम संबंधवाचक उपवाक्य की पुनरुक्ति
  choice: ‘उसी ने इन बातों की घोषणा की थी’ को बनाए रखा गया।
  alternative: इसे शैलीगत पुनरुक्ति मानकर छोड़ देना
  rationale: इब्रानी में אֲשֶׁר קָרָא दोहराया गया है। कठिन या पुनरुक्त वाक्यरचना को मिटाने के बजाय अनुवाद उसे सुरक्षित रखता है; संभव पाठगत असहजता फुटनोट में बताई गई है।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में परिचित नाम-रूप रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘निकलवाईं’ और ‘लोगों को भेजकर’ इब्रानी प्रेरणार्थक घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करते हैं। मूल की अंतिम पुनरुक्ति जानबूझकर रखी गई है, और उससे जुड़ी पाठगत अस्पष्टता फुटनोट में दी गई है।
