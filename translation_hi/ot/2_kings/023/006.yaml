source:
  edition: WLC
  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
translation:
  language: hi
  text: वह अशेरा[a] को याहवे के मंदिर से निकालकर यरूशलेम के बाहर किद्रोन घाटी में ले गया। उसने उसे किद्रोन घाटी में जला दिया, उसे कूटकर धूल बना दिया और उसकी धूल साधारण लोगों की कब्रों पर फेंक दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा का खंभा” अथवा “अशेरा की प्रतिमा।” इब्रानी शब्द कनानी देवी अशेरा या उसकी उपासना से जुड़ी पूजावस्तु को सूचित कर सकता है; यहाँ वह वस्तु अभिप्रेत है जिसे निकालकर नष्ट किया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: इब्रानी पद देवी अशेरा अथवा उसकी उपासना से जुड़ी वस्तु को सूचित कर सकता है। यहाँ निकाली और नष्ट की जाने वाली पूजावस्तु अभिप्रेत है; लिप्यंतरण उसके निश्चित रूप को अनावश्यक रूप से तय नहीं करता।
- source_word: מִבֵּית יְהוָה
  choice: यहवे के भवन से
  rationale: ‘भवन’ इब्रानी ‘घर’ की औपचारिक छवि बनाए रखता है और प्रसंग में मंदिर के लिए स्वाभाविक है; परमेश्वर के निजी नाम को ‘यहवे’ रूप में रखा गया है।
- source_word: נַחַל קִדְרוֹן
  choice: किद्रोन घाटी
  rationale: נחל घाटी, खड्ड या मौसमी जलधारा वाला नाला सूचित कर सकता है; इस भौगोलिक प्रसंग में ‘घाटी’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּשְׂרֹף אֹתָהּ
  choice: उसे ... जला दिया
  rationale: स्त्रीलिंग प्रत्यय अशेरा-संज्ञा के व्याकरणिक लिंग के अनुरूप है; हिन्दी में ‘उसे’ वस्तु और देवी के बीच की अस्पष्टता को बिना अतिरिक्त व्यक्तिकरण के बनाए रखता है।
- source_word: וַיָּדֶק לְעָפָר
  choice: कूटकर धूल बना दिया
  rationale: क्रिया किसी वस्तु को बारीक चूर्ण कर देने का भाव देती है। ‘कूटकर धूल बना दिया’ विनाश की क्रिया और उसके परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲפָרָהּ
  choice: उसकी धूल
  rationale: עפר का मूल अर्थ ‘धूल’ है, केवल ‘राख’ नहीं; वस्तु को जलाने के साथ कूटे जाने के कारण ‘धूल’ स्रोत के अधिक निकट है।
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  choice: साधारण लोगों की कब्रों पर
  rationale: בני העם यहाँ संभवतः प्रतिष्ठित वर्ग के विपरीत सामान्य जन को सूचित करता है। सामूहिक अर्थ के कारण हिन्दी में बहुवचन ‘कब्रों’ स्वाभाविक है।
theological_decisions:
- issue: אֲשֵׁרָה का स्वरूप
  choice: अशेरा
  alternative: अशेरा का खंभा; अशेरा की प्रतिमा
  rationale: मूल शब्द देवी अथवा उससे संबद्ध पूजावस्तु के लिए प्रयुक्त हो सकता है। प्रसंग वस्तु के विनाश को स्पष्ट करता है, पर उसका ठीक भौतिक रूप नहीं; इसलिए मुख्य पाठ में लिप्यंतरण और पादटिप्पणी में विकल्प रखे गए हैं।
- issue: יהוה का निरूपण
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निजी नाम है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और शीर्षक से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज ऐतिहासिक गद्य। क्रमिक इब्रानी वाक्यों को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि सभी क्रियाएँ और उनका क्रम सुरक्षित रखा गया है।
