base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
translation:
  language: hi
  text: तब राजा यहोवा के भवन[a] में गया। उसके साथ यहूदा के सभी पुरुष, यरूशलेम के सभी निवासी, याजक, भविष्यद्वक्ता और छोटे से लेकर बड़े तक सभी लोग गए। उसने उनके सुनते हुए यहोवा के भवन में मिली वाचा की पुस्तक के सभी वचन पढ़कर सुनाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के मंदिर।” मूलतः “यहोवा का भवन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: में गया
  rationale: עלה में ऊपर जाने का भाव है; हिंदी में मंदिर/भवन की ओर जाने के लिए केवल ‘गया’ अधिक स्वाभाविक है, जबकि ‘ऊपर गया’ यहाँ अनावश्यक रूप से भौगोलिक लग सकता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: शाब्दिक ‘यहोवा का घर’ के स्थान पर ‘भवन’ मूल रूपक को बनाए रखते हुए पवित्र स्थान के लिए स्वाभाविक और गरिमापूर्ण हिंदी देता है; ‘मंदिर’ संभावित अर्थ है पर अधिक व्याख्यात्मक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के विशिष्ट वाचा-नाम को दर्शाता है और इसे उपाधि ‘प्रभु’ में नहीं बदलता।
- source_word: כָל אִישׁ יְהוּדָה
  choice: यहूदा के सभी पुरुष
  rationale: אִישׁ के स्पष्ट पुल्लिंग सामूहिक रूप को बनाए रखा गया है; इसे तटस्थ ‘लोग’ करने से स्रोत की अभिव्यक्ति मिट जाती।
- source_word: כָל יֹשְׁבֵי יְרוּשָׁלַם
  choice: यरूशलेम के सभी निवासी
  rationale: निवास करने वालों के लिए संक्षिप्त, वर्तमान और स्वाभाविक हिंदी।
- source_word: הַכֹּהֲנִים וְהַנְּבִיאִים
  choice: याजक, भविष्यद्वक्ता
  rationale: दोनों पदों के मानक और संदर्भानुकूल हिंदी रूप।
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: हिब्रू मुहावरे की व्यापक सामाजिक सीमा को निकटता से रखता है; इसे आयु-विशेष ‘बच्चे से बूढ़े तक’ नहीं बनाया गया।
- source_word: וַיִּקְרָא בְאָזְנֵיהֶם
  choice: उसने उनके सुनते हुए ... पढ़े
  rationale: लिखित पुस्तक के संदर्भ में קרא का अर्थ ‘पढ़ना’ है; ‘उनके सुनते हुए’ सार्वजनिक श्रवण का भाव स्वाभाविक हिंदी में रखता है।
- source_word: סֵפֶר הַבְּרִית
  choice: वाचा की पुस्तक
  rationale: संधि/करार की अपेक्षा ‘वाचा’ बाइबलीय संदर्भ में सटीक और परिचित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में विशिष्ट चतुरक्षरीय नाम है। हिंदी में परिचित नामरूप ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है; स्वरांकन ऐतिहासिक रूप से निश्चित नहीं है।
- issue: כָל אִישׁ יְהוּדָה में लिंग-सूचक सामूहिक भाषा
  choice: यहूदा के सभी पुरुष
  alternative: यहूदा के सभी लोग
  rationale: मूल का אִישׁ पुल्लिंग है। अनुवाद इसे सुरक्षित रखता है, यद्यपि संदर्भ में यह व्यापक जनसमुदाय का प्रतिनिधिक उल्लेख हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। वाक्य को हिंदी की पठनीयता के लिए दो भागों में बाँटा गया है। मुख्य पाठ में सभी दिए गए समूह और वाचा-पुस्तक के सार्वजनिक पाठ का भाव सुरक्षित है।
