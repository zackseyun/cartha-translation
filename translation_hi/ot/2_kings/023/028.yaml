base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: The rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: योशिय्याह के शेष काम और जो कुछ उसने किया, क्या वे यहूदा के राजाओं के इतिहास की पुस्तक[a] में लिखे नहीं हैं[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहूदा के राजाओं के इतिहास की पुस्तक’ से आशय राजाओं की पुस्तक में उद्धृत किसी राजकीय अभिलेख-स्रोत से है; यह आवश्यक नहीं कि वह बाइबल की 1–2 इतिहास की पुस्तकें अपने अंतिम रूप में ही हो।
    reason: cross_reference
  - marker: b
    text: या, “दर्ज नहीं हैं?” हिब्रू शब्द का मूल अर्थ “लिखे हुए” है, पर इस अभिलेखीय संदर्भ में इसका अर्थ “दर्ज किए हुए” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי יֹאשִׁיָּהוּ
  choice: योशिय्याह के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में יֶתֶר का अर्थ ‘बाकी’ और דִּבְרֵי का अर्थ राजा के कार्य या वृत्तांत है; यह हिंदी में सहज और स्रोत के निकट है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह עשה के व्यापक और सीधे अर्थ को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वह ... लिखा नहीं है
  rationale: हिब्रू का नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है। हिंदी में संयुक्त विषय को समग्र वृत्तांत मानकर एकवचन ‘वह’ और ‘लिखा’ स्वाभाविक हैं।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक ‘पुस्तक पर’ के बजाय अभिलेखीय संदर्भ में हिंदी मुहावरे के अनुसार ‘पुस्तक में’ उचित है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक
  rationale: דִּבְרֵי הַיָּמִים यहाँ कालक्रमानुसार राजकीय वृत्तांत या इतिहास को सूचित करता है; यह शीर्षक सहज हिंदी में स्रोत की प्रकृति बताता है।
theological_decisions:
- issue: उल्लिखित पुस्तक की पहचान
  choice: इसे ‘यहूदा के राजाओं के इतिहास की पुस्तक’ कहा गया और पादटिप्पणी में राजकीय अभिलेख-स्रोत बताया गया।
  alternative: इसे सीधे बाइबल की ‘इतिहास/इतिहास-वृत्तांत’ पुस्तकें मानना।
  rationale: राजाओं की पुस्तक में यह एक उद्धृत राजकीय स्रोत का सूत्रबद्ध नाम है; इसे 1–2 इतिहास के अंतिम प्रामाणिक रूप से अनिवार्यतः समान मानना पाठ से अधिक निष्कर्ष निकालना होगा।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण ऐतिहासिक शैली। हिब्रू के आलंकारिक नकारात्मक प्रश्न को बनाए रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं और जिस पदांश को स्पष्ट करते हैं उसी के निकट रखे गए हैं।
