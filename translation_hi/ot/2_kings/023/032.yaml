  text: And he did what was evil in the eyes of Yahweh[a], according to all that his fathers had done.
translation:
  language: hi
  text: और उसने याहवे की दृष्टि में बुरा किया, ठीक वैसा ही जैसा उसके पुरखों ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: और उसने...किया
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; हिंदी में ‘और उसने...किया’ स्वाभाविक और निकट अनुवाद है।
- source_word: הָרַע
  choice: वही...जो...बुरा था
  rationale: עשה הרע एक प्रचलित इब्रानी मुहावरा है, जिसका अर्थ ‘वह करना जो बुरा है’ है; हिंदी में यह रूप शाब्दिक कठोरता से बचते हुए अर्थ सुरक्षित रखता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह इब्रानी मूल्यांकन-संबंधी मुहावरे का स्वाभाविक हिंदी रूप है और मूल दृष्टि-रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में परमेश्वर के व्यक्तिगत नाम יהוה का प्रचलित लिप्यंतरण ‘यहोवा’ है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: संदर्भ में यह पूर्वजों के पूरे आचरण-ढंग के अनुरूपता सूचित करता है; हिंदी में यह तुलना सहज रूप से व्यक्त होती है।
- source_word: עָשׂוּ
  choice: ने किया था
  rationale: ‘किया था’ पूर्वजों के पहले हो चुके कार्यों को स्पष्ट करता है, यद्यपि इब्रानी में सामान्य पूर्ण रूप है।
- source_word: אֲבֹתָיו
  choice: उसके पुरखों
  rationale: यहाँ אָבוֹת राजकीय/वंशगत संदर्भ में पूर्वजों को दर्शाता है; ‘पुरखे’ आधुनिक हिंदी में अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिंदी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘की दृष्टि में’ मूल इब्रानी मुहावरे को स्वाभाविक हिंदी में बनाए रखता है, और ‘पुरखों’ से वंशगत पूर्वजों का आशय स्पष्ट होता है।
