base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
translation:
  language: hi
  text: और जैसा परमेश्वर के जन ने राजा से कहा था, वैसा ही हुआ। उसने कहा था, “कल लगभग इसी समय शोमरोन के फाटक पर दो सआ[a] जौ एक शेकेल में और एक सआ मैदा एक शेकेल में मिलेगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'सआ सूखी वस्तुओं को मापने की एक प्राचीन इकाई थी। इब्रानी पाठ में इकाइयों के नाम सीधे दिए गए हैं: दो सआ जौ और एक सआ मैदा।'
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “शोमरोन के फाटक में” भी हो सकता है। नगर का फाटक व्यापार और न्याय का सार्वजनिक स्थान होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: और जैसा ... कहा था, वैसा ही हुआ
  rationale: כְּ के अनुरूपता-सूचक भाव और भविष्यवाणी के ठीक उसी प्रकार पूरा होने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: इब्रानी पदवी का सीधा और प्रचलित हिन्दी रूप है; इसे व्याख्यात्मक रूप से केवल ‘भविष्यद्वक्ता’ नहीं बनाया गया।
- source_word: לֵאמֹר
  choice: उसने कहा था
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले इब्रानी रूप को हिन्दी में स्पष्ट और सहज वाक्य से व्यक्त किया गया है।
- source_word: סָאתַיִם
  choice: दो सआ
  rationale: प्राचीन सूखी वस्तुओं की माप के विशिष्ट नाम और द्विवचन को बनाए रखता है।
- source_word: שְׂעֹרִים
  choice: जौ
  rationale: इस अनाज का सामान्य आधुनिक हिन्दी नाम।
- source_word: בְּשֶׁקֶל
  choice: एक शेकेल में
  rationale: मूल में בְּ बाजार-मूल्य दर्शाता है; हिन्दी में वस्तु की उपलब्ध कीमत बताने का स्वाभाविक ढंग है।
- source_word: וּסְאָה סֹלֶת
  choice: और एक सआ मैदा
  rationale: एकवचन माप को स्पष्ट रखा गया है और סֹלֶת के महीन, परिष्कृत आटे के अर्थ को ‘मैदा’ से व्यक्त किया गया है।
- source_word: כָּעֵת מָחָר
  choice: कल लगभग इसी समय
  rationale: כְּ की लगभग/तुलनात्मक छाया सहित समय-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप।
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: शोमरोन के फाटक पर
  rationale: नगर-फाटक को व्यापार के सार्वजनिक स्थान के रूप में दर्शाता है और हिन्दी में स्थान-सूचक प्रयोग स्वाभाविक है।
- source_word: יִהְיֶה
  choice: मिलेगा
  rationale: पहले बताए गए भावों के अगले दिन उपलब्ध होने की अर्थगत पूर्ति करता है; इब्रानी का एकवचन समाहारात्मक कथन हिन्दी में भी बना रहता है।
