base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
translation:
  language: hi
  text: इसलिए वे उनका पीछा करते हुए यरदन तक गए। और देखो, पूरा मार्ग उन वस्त्रों और सामान से भरा पड़ा था जिन्हें अराम ने अपनी हड़बड़ी में फेंक दिया था। तब दूत लौटे और राजा को बताया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם
  choice: वे उनका पीछा करते हुए गए
  rationale: यह वाक्यांश क्रमिक कथन के साथ पीछे जाने या पीछा करने का भाव देता है; प्रसंग में ‘पीछा करते हुए’ स्वाभाविक और स्पष्ट है।
- source_word: עַד הַיַּרְדֵּן
  choice: यरदन तक
  rationale: עַד पहुँची हुई सीमा बताता है; ‘तक’ इसे संक्षेप और ठीक रूप से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה पाठक का ध्यान अचानक दिखाई पड़े दृश्य की ओर खींचता है; ‘और देखो’ उसकी जीवंतता बनाए रखता है।
- source_word: כָל הַדֶּרֶךְ
  choice: पूरा मार्ग
  rationale: शाब्दिक अर्थ ‘सारा मार्ग’ है; ‘पूरा मार्ग’ आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: בְגָדִים
  choice: वस्त्रों
  rationale: यह छोड़े गए कपड़ों को सूचित करता है; ‘वस्त्र’ कथात्मक शास्त्रीय शैली के अनुरूप और सामान्यतः बोधगम्य है।
- source_word: וְכֵלִים
  choice: सामान
  rationale: כֵלִים वस्तुओं, औज़ारों या उपकरणों के लिए व्यापक शब्द है; यहाँ ‘सामान’ इस व्यापकता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר הִשְׁלִיכוּ אֲרָם
  choice: जिन्हें अरामियों ने ... फेंक दिया था
  rationale: अंग्रेज़ी परत के ‘Aram’ के विपरीत, हिब्रू में स्थान/जननाम אֲרָם यहाँ बहुवचन क्रिया הִשְׁלִיכוּ का कर्ता बनकर सामूहिक रूप से अरामी लोगों या सेना को दर्शाता है; हिन्दी में ‘अरामियों’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּחָפְזָם
  choice: अपनी हड़बड़ी में
  rationale: חפז दबाव में शीघ्रता या हड़बड़ी व्यक्त करता है; ‘घबराहट’ कहना भाव को आवश्यकता से अधिक निश्चित कर देता।
- source_word: הַמַּלְאָכִים
  choice: दूत
  rationale: מַלְאָכִים का मूल अर्थ भेजे गए संदेशवाहक है; प्रसंग में वे जाँच के लिए भेजे गए पुरुष हैं, पर ‘जासूस’ या ‘टोह लेनेवाले’ अधिक व्याख्यात्मक होता।
- source_word: וַיַּגִּידוּ לַמֶּלֶךְ
  choice: उन्होंने राजा को इसकी सूचना दी
  rationale: נגד का हिफ़िल रूप बताने या सूचना देने को दर्शाता है; ‘इसकी सूचना दी’ लौटकर प्राप्त तथ्य बताने के प्रसंग में स्वाभाविक है।
