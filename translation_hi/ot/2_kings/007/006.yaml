source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
translation:
  language: hi
  text: क्योंकि प्रभु ने अराम की छावनी को रथों की आवाज़, घोड़ों की आवाज़ और एक विशाल सेना की आवाज़ सुनाई थी। तब उन्होंने एक-दूसरे से कहा, “देखो, इस्राएल के राजा ने हमारे विरुद्ध आने के लिए हित्तियों के राजाओं और मिस्र के राजाओं को भाड़े पर लिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי
  choice: प्रभु
  rationale: यह אֲדֹנָי दिव्य उपाधि है और प्रसंग में इस्राएल के परमेश्वर को सूचित करती है; ‘प्रभु’ इसका स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: הִשְׁמִיעַ
  choice: सुनाई थी
  rationale: 'שׁמע का हिफ़ील रूप कारणवाचक है: प्रभु ने अराम की छावनी को यह ध्वनि सुनवाई। ‘थी’ आसपास की कथा में उनके भागने का पूर्ववर्ती कारण व्यक्त करता है।'
- source_word: מַחֲנֵה אֲרָם
  choice: अराम की छावनी
  rationale: ‘अराम’ मूल इब्रानी स्थान-नाम को बनाए रखता है और आधुनिक ‘सीरिया’ से उत्पन्न अनैतिहासिक संकेत से बचता है।
- source_word: קוֹל רֶכֶב ... קוֹל סוּס ... קוֹל חַיִל גָּדוֹל
  choice: रथों की आवाज़, घोड़ों की आवाज़ और एक विशाल सेना की आवाज़
  rationale: मूल में קוֹל की तीन बार हुई पुनरावृत्ति को बनाए रखा गया है; חַיִל प्रसंग में सैन्य दल या सेना है।
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  choice: वे एक-दूसरे से कहने लगे
  rationale: शाब्दिक अर्थ ‘हर व्यक्ति ने अपने भाई से कहा’ है, पर यह पारस्परिक बोलचाल का इब्रानी मुहावरा है; हिन्दी में ‘एक-दूसरे से’ अर्थ को सहजता से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: שָׂכַר עָלֵינוּ
  choice: हमारे विरुद्ध ... भाड़े पर बुलाया है
  rationale: שׂכר का अर्थ भाड़े पर लेना है और עַל यहाँ विरोधी भाव रखता है। हिन्दी वाक्य-विन्यास में कर्म को बीच में रखकर अर्थ स्पष्ट किया गया है।
- source_word: מַלְכֵי הַחִתִּים
  choice: हित्तियों के राजाओं
  rationale: मूल के बहुवचन ‘राजाओं’ को सुरक्षित रखा गया है।
- source_word: מַלְכֵי מִצְרַיִם
  choice: मिस्र के राजाओं
  rationale: ऐतिहासिक कठिनाई के बावजूद मूल पाठ का बहुवचन ज्यों का त्यों रखा गया है।
- source_word: לָבוֹא עָלֵינוּ
  choice: ताकि वे हम पर चढ़ाई करें
  rationale: विरोधी सैन्य गति का अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे केवल सामान्य ‘आना’ नहीं समझा जा सकता।
theological_decisions:
- issue: दिव्य उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ उपाधि इस्राएल के परमेश्वर के लिए प्रयुक्त है। ‘प्रभु’ हिन्दी बाइबलीय भाषा में स्पष्ट और प्रतिष्ठित है, जबकि मूल में יהוה न होने के कारण कोई विशिष्ट नाम नहीं जोड़ा गया।
