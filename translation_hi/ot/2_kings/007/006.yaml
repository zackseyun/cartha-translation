  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। मूल की कारणवाचक क्रिया, ध्वनियों की त्रिक पुनरावृत्ति और ‘राजाओं’ के असामान्य बहुवचन को सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
