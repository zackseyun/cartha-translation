source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
translation:
  language: hi
  text: तब लोग बाहर निकले और उन्होंने अराम की छावनी लूट ली। एक सआ मैदा का भाव एक शेकेल और दो सआ जौ का भाव एक शेकेल हो गया—याहवे के वचन के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  choice: तब लोग बाहर निकले
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम की अगली कड़ी व्यक्त करता है।
- source_word: וַיָּבֹזּוּ
  choice: उन्होंने ... लूट ली
  rationale: בזז शत्रु की संपत्ति लूटने को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और सैन्य प्रसंग के अनुकूल है।
- source_word: מַחֲנֵה אֲרָם
  choice: अराम की छावनी
  rationale: यह इब्रानी संबंधवाचक पदबंध का स्वाभाविक और निकट हिन्दी रूप है; ‘अराम’ को आधुनिक ‘सीरिया’ से नहीं बदला गया।
- source_word: סְאָה
  choice: सआ
  rationale: विशिष्ट प्राचीन सूखी माप का नाम लिप्यंतरित किया गया है, ताकि उसे अनिश्चित ‘माप’ कहकर समतल न किया जाए।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת सामान्य आटे के बजाय बारीक, उत्तम आटे को दर्शाता है; ‘मैदा’ साधारण आधुनिक हिन्दी में इसका संक्षिप्त समतुल्य है।
- source_word: בְּשֶׁקֶל
  choice: एक शेकेल में
  rationale: मूल्य-सूचक בְּ को हिन्दी बाजार-भाव की स्वाभाविक अभिव्यक्ति में रखा गया और प्राचीन इकाई का नाम बनाए रखा गया।
- source_word: וְסָאתַיִם שְׂעֹרִים
  choice: और दो सआ जौ
  rationale: द्विवचन रूप ‘दो सआ’ को स्पष्ट करता है; שְׂעֹרִים को वस्तु के रूप में स्वाभाविक हिन्दी ‘जौ’ कहा गया है।
- source_word: וַיְהִי
  choice: बिकने लगे
  rationale: मूलतः ‘हो गया/हुआ’ यहाँ बाजार-भाव बनने का संकेत देता है; ‘बिकने लगे’ प्रसंगगत अर्थ स्पष्ट करता है, बिना मूल्य में कुछ जोड़े।
- source_word: כִּדְבַר יְהוָה
  choice: ठीक याहवे के वचन के अनुसार
  rationale: यह पहले दिए गए भविष्यसूचक वचन की पूर्ति दर्शाता है; ‘के अनुसार’ मूल के निकट है और ‘ठीक’ पूर्ति के मेल को स्वाभाविक हिन्दी में उभारता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छावनी’, ‘मैदा’ और ‘बिकने लगे’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘सआ’, ‘शेकेल’, ‘अराम’ और ‘याहवे’ जैसे स्रोत-विशिष्ट नाम सुरक्षित रखे गए हैं। अंग्रेज़ी परामर्श-पाठ में फुटनोट-चिह्नों और उनकी सामग्री का स्थान परस्पर उलटा दिखाई देता था; हिन्दी मसौदे में सांस्कृतिक टिप्पणियाँ संबंधित शब्दों पर लगाई गई हैं।
