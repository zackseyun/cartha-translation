  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
translation:
  language: hi
  text: तब वे उठे और धुँधलके में[a] भाग गए। वे अपने तंबू, घोड़े, गधे और छावनी को जैसी वह थी वैसी ही[b] छोड़ गए, और अपनी जान बचाकर भागे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गोधूलि के समय” या “सांझ के धुँधलके में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “छावनी जैसी वह थी”; अर्थात वे उसे उसी दशा में छोड़ गए।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “अपने प्राण की ओर भागे”; यह अपनी जान बचाने के लिए भागने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַנֶּשֶׁף
  choice: गोधूलि के समय
  rationale: נֶשֶׁף दिन और रात के बीच के धुँधलके को दर्शाता है। प्रसंग संध्या का संकेत देता है; ‘गोधूलि के समय’ स्वाभाविक आधुनिक हिन्दी है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: וַיַּעַזְבוּ
  choice: छोड़ गए
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। भागने का प्रसंग आकस्मिक परित्याग का भाव स्वतः स्पष्ट करता है।
- source_word: אָהֳלֵיהֶם
  choice: अपने तंबू
  rationale: सैन्य छावनी के संदर्भ में बहुवचन का सीधा और सामान्य हिन्दी समतुल्य।
- source_word: סוּסֵיהֶם
  choice: घोड़े
  rationale: मूल संज्ञा का सीधा हिन्दी समतुल्य; ‘अपने’ का संबंध सूची की सभी वस्तुओं से स्वाभाविक रूप से जुड़ता है।
- source_word: חֲמֹרֵיהֶם
  choice: गधे
  rationale: घरेलू भारवाही पशुओं के लिए आधुनिक हिन्दी का सामान्य शब्द।
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  choice: छावनी जैसी थी वैसी ही
  rationale: यह निकट रूप से उस बात को बनाए रखता है कि जल्दबाजी में पूरी छावनी अपनी तत्कालीन दशा में छोड़ दी गई थी; ‘ज्यों की त्यों’ की तुलना में यह अधिक पारदर्शी है।
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  choice: अपनी जान बचाकर भागे
  rationale: शाब्दिक रूप ‘अपने प्राण की ओर भागे’ हिन्दी में अस्वाभाविक है। चुना हुआ वाक्यांश जीवन बचाने के लिए भागने का इब्रानी मुहावरेदार अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּקוּמוּ
  choice: वे उठे
  rationale: קום यहाँ तत्काल कार्रवाई आरंभ होने को बताता है; ‘उठे’ संक्षिप्त है और कथात्मक क्रम बनाए रखता है।
- source_word: וַיָּנ֣וּסוּ ... וַיָּנֻסוּ
  choice: भाग गए ... भागे
  rationale: मूल पाठ में נוס की पुनरावृत्ति जल्दबाजी और भय पर बल देती है; हिन्दी में भी ‘भाग’ को दोनों स्थानों पर रखकर इसे सुरक्षित किया गया है।
