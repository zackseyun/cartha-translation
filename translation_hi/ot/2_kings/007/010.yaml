base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
translation:
  language: hi
  text: तब वे आए और नगर के फाटक के पहरेदारों को पुकारा। उन्होंने उन्हें बताया, “हम अराम की छावनी में गए थे। वहाँ कोई भी नहीं था, न किसी मनुष्य की कोई आवाज़[a]। केवल घोड़े और गधे बँधे हुए थे, और तंबू जैसे के तैसे पड़े थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्य की कोई आहट।” इब्रानी शब्द का अर्थ विशेष रूप से “आवाज़” या अधिक व्यापक रूप से कोई मानवीय ध्वनि हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  choice: नगर के फाटक के पहरेदारों
  rationale: रूप की दृष्टि से संज्ञा एकवचन है, पर आगे आए बहुवचन सर्वनाम से सामूहिक अर्थ स्पष्ट होता है; यह हिंदी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: מַחֲנֵה אֲרָם
  choice: अराम की छावनी
  rationale: ‘अराम’ इब्रानी स्थान-नाम को सीधे सुरक्षित रखता है; ‘छावनी’ सैन्य पड़ाव का सहज हिंदी रूप है।
- source_word: וְהִנֵּה
  choice: वहाँ ... था
  rationale: वर्णन की प्रत्यक्षता को हिंदी की स्वाभाविक कथन-रचना में व्यक्त किया गया है; अलग से ‘देखो’ जोड़ना इस उद्धृत सूचना में कृत्रिम लगता।
- source_word: אֵין שָׁם אִישׁ
  choice: वहाँ कोई भी नहीं था
  rationale: אִישׁ यहाँ लिंग-विशेष नहीं, किसी भी व्यक्ति की अनुपस्थिति बताता है।
- source_word: וְקוֹל אָדָם
  choice: न किसी मनुष्य की कोई आवाज़
  rationale: קוֹל ‘आवाज़’ या व्यापक ‘ध्वनि’ हो सकता है; मुख्य पाठ में सहज ‘आवाज़’ रखा और व्यापक अर्थ पादटिप्पणी में दिया है।
- source_word: כִּי אִם
  choice: केवल
  rationale: यह पहले कही पूर्ण अनुपस्थिति के अपवादों का परिचय देता है।
- source_word: הַסּוּס אָסוּר ... וְהַחֲמוֹר אָסוּר
  choice: घोड़े और गधे बँधे हुए थे
  rationale: एकवचन पशु-संज्ञाएँ यहाँ सामूहिक हैं; हिंदी में बहुवचन स्वाभाविक है और אָסוּר का प्रसंगानुकूल अर्थ ‘बँधा हुआ’ है।
- source_word: וְאֹהָלִים כַּאֲשֶׁר הֵמָּה
  choice: तंबू जैसे के तैसे पड़े थे
  rationale: मुहावरा तंबुओं के उसी दशा में छोड़े जाने पर बल देता है; ‘जैसे के तैसे’ स्वाभाविक हिंदी है, जबकि ‘पड़े थे’ स्थिति को स्पष्ट करता है।
