source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
translation:
  language: hi
  text: यदि हम कहें, ‘हम नगर में प्रवेश करें,’ तो नगर में अकाल पड़ा है और हम वहाँ मर जाएँगे। यदि हम यहाँ बैठे रहें, तो भी हम मर जाएँगे। इसलिए अब आओ, हम अराम[a] की छावनी में जा पड़ें।[b] यदि वे हमें जीवित छोड़ दें, तो हम जीवित रहेंगे; और यदि वे हमें मार डालें, तो हम मर जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अराम’ वह हिब्रू नाम है जिसका अनुवाद प्रायः ‘सीरिया’ या ‘अरामी लोग’ किया जाता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “हम अराम की छावनी में जा पड़ें।” यहाँ प्रयुक्त हिब्रू मुहावरे का अर्थ विरोधी सेना के पास चले जाना या उसके सामने आत्मसमर्पण करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבוֹא
  choice: हम नगर में प्रवेश करें
  rationale: यह प्रथम पुरुष बहुवचन रूप प्रस्तावित कथन में आया है; इसलिए हिंदी में संभावनार्थक ‘प्रवेश करें’ प्रसंग और व्याकरणिक भाव दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרָעָב
  choice: अकाल पड़ा है
  rationale: רָעָב यहाँ घेराबंदी के कारण फैले व्यापक अकाल को दर्शाता है, केवल व्यक्तिगत भूख को नहीं। ‘अकाल पड़ा है’ आधुनिक हिंदी का स्वाभाविक प्रयोग है।
- source_word: יָשַׁבְנוּ פֹה
  choice: हम यहाँ बैठे रहें
  rationale: ישׁב के ठहरने और बैठे रहने—दोनों भावों को यह वाक्यांश बनाए रखता है तथा निष्क्रिय प्रतीक्षा की निराशा को व्यक्त करता है।
- source_word: וְנִפְּלָה אֶל
  choice: हम ... के सामने आत्मसमर्पण कर दें
  rationale: सैनिक प्रसंग में נפל אל विरोधी पक्ष के पास चले जाने या उसके सामने समर्पण करने का मुहावरा हो सकता है। मुख्य पाठ में आशय स्पष्ट किया गया है और शाब्दिक रूप की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מַחֲנֵה אֲרָם
  choice: अराम की छावनी
  rationale: אֲרָם को उसके हिब्रू नाम ‘अराम’ के रूप में रखा गया है; מַחֲנֶה के लिए सैन्य प्रसंगानुकूल ‘छावनी’ चुना गया है।
- source_word: יְחַיֻּנוּ
  choice: वे हमें जीवित छोड़ दें
  rationale: חיה का पिएल रूप यहाँ किसी को जीवित रखने या जीवनदान देने का अर्थ देता है। यह चयन अगले ‘हम जीवित रहेंगे’ के साथ मूल की पुनरुक्ति भी बनाए रखता है।
- source_word: יְמִיתֻנוּ
  choice: वे हमें मार डालें
  rationale: מות का हिफ़ील रूप मृत्यु का कारण बनने, अर्थात मार डालने, का अर्थ देता है। ‘मार डालें’ सामान्य आधुनिक हिंदी में स्पष्ट और प्रभावी है।
