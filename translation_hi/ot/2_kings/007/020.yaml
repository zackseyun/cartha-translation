base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
translation:
  language: hi
  text: 'और उसके साथ ठीक वैसा ही हुआ: लोगों ने उसे फाटक में[a] पैरों तले रौंद दिया, और वह मर गया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘फाटक में’ का अनुवाद ‘फाटक पर’ या ‘फाटक के रास्ते में’ भी हो सकता है। हिब्रू शब्द नगर के फाटक अथवा पूरे फाटक-परिसर को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  choice: और उसके साथ ठीक वैसा ही हुआ
  rationale: यह हिब्रू मुहावरा बताता है कि उसके साथ वही हुआ जो पहले कहा गया था। यह हिंदी में स्वाभाविक है और भविष्यवाणी की पूर्ति का भाव बिना अतिरिक्त व्याख्या के रखता है।
- source_word: וַיִּרְמְסוּ
  choice: पैरों तले रौंद दिया
  rationale: רמס का सीधा अर्थ पैरों तले रौंदना है। हिंदी में यह क्रिया दृश्य और परिणाम दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करती है।
- source_word: הָעָם
  choice: लोगों ने
  rationale: עם का सामान्य अर्थ ‘लोग’ है। प्रसंग में इससे फाटक की ओर उमड़ी जनता अभिप्रेत है; ‘भीड़’ अधिक प्रसंगपरक पर कम औपचारिक विकल्प होता।
- source_word: בַּשַּׁעַר
  choice: फाटक में
  rationale: שַׁעַר नगर के फाटक, उसके भीतर के मार्ग, अथवा पूरे फाटक-परिसर को सूचित कर सकता है। ‘फाटक में’ मूल पूर्वसर्ग के निकट रहते हुए इस स्थानिक विस्तार को खुला रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: क्रमिक हिब्रू क्रिया का सीधा कथात्मक अनुवाद है। रौंदे जाने और मृत्यु का परिणाम-संबंध प्रसंग से स्पष्ट है, इसलिए ‘जिससे’ जैसा व्याख्यात्मक संयोजक नहीं जोड़ा गया।
theological_decisions:
- issue: न्याय और भविष्यवाणी की पूर्ति
  choice: ‘उसके साथ ठीक वैसा ही हुआ’ द्वारा पहले कही गई बात की सटीक पूर्ति का संकेत
  alternative: ‘इस प्रकार उस पर न्याय आया’ जैसे स्पष्ट धार्मिक-व्याख्यात्मक शब्द
  rationale: प्रसंग इसे एलीशा के वचन की पूर्ति और न्याय के रूप में दिखाता है, पर पद स्वयं घटना को कथात्मक ढंग से कहता है। इसलिए मुख्य पाठ में धर्मवैचारिक टिप्पणी जोड़े बिना पूर्ति का निहित भाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रजिस्टर। ‘ठीक वैसा ही’ पूर्वकथित घटना की पूर्ति स्पष्ट करता है; ‘पैरों तले रौंद दिया’ मूल क्रिया का सजीव किंतु सामान्य-बोधगम्य रूप है।
