  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। इब्रानी की क्रमिक क्रियाओं को छोटे, सहज हिन्दी वाक्यों में व्यक्त किया गया है। ‘चर्मरोगी’ के साथ पाद-टिप्पणी मूल शब्द की सांस्कृतिक और चिकित्सकीय व्यापकता सुरक्षित रखती है।
