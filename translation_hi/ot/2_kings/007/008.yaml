  text: וַ/יָּבֹאוּ֩ הַֽ/מְצֹרָעִ֨ים הָ/אֵ֜לֶּה עַד קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה וַ/יָּבֹ֜אוּ אֶל אֹ֤הֶל אֶחָד֙ וַ/יֹּאכְל֣וּ וַ/יִּשְׁתּ֔וּ וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם כֶּ֤סֶף וְ/זָהָב֙ וּ/בְגָדִ֔ים וַ/יֵּלְכ֖וּ וַ/יַּטְמִ֑נוּ וַ/יָּשֻׁ֗בוּ וַ/יָּבֹ֨אוּ֙ אֶל אֹ֣הֶל אַחֵ֔ר וַ/יִּשְׂא֣וּ מִ/שָּׁ֔ם וַ/יֵּלְכ֖וּ וַ/יַּטְמִֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
translation:
  language: hi
  text: जब ये चर्मरोगी[a] छावनी के छोर पर पहुँचे, तो वे एक तंबू में गए और उन्होंने खाया-पिया। फिर वे वहाँ से चाँदी, सोना और कपड़े उठा ले गए और जाकर उन्हें छिपा दिया। इसके बाद वे लौटे और दूसरे तंबू में गए। वे वहाँ से भी सामान उठा ले गए और जाकर उसे छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द ऐसे लोगों को दर्शाता है जो उस चर्मरोग से पीड़ित थे जिसे परंपरागत रूप से ‘कोढ़’ कहा गया है; प्राचीन शब्द में आधुनिक कोढ़ (हैन्सन रोग) से अधिक प्रकार की त्वचा-संबंधी अवस्थाएँ शामिल हो सकती थीं।
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  choice: चर्मरोगी
  rationale: यह शब्द צָרַעַת से पीड़ित व्यक्तियों को सूचित करता है। ‘चर्मरोगी’ आधुनिक पाठक के लिए सहज है और इसे केवल आधुनिक हैन्सन रोग तक सीमित नहीं करता; प्राचीन अर्थ-क्षेत्र की व्यापकता पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: קְצֵה הַמַּחֲנֶה
  choice: छावनी के छोर पर
  rationale: קָצֶה किसी स्थान की सीमा या छोर को दर्शाता है; यह प्रयोग स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל אֶחָד
  choice: एक तंबू
  rationale: इब्रानी में संज्ञा अनिश्चित होते हुए भी संख्या ‘एक’ स्पष्ट है; अनुवाद क्रमिक कथा की ठोसता बनाए रखता है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने खाया-पिया
  rationale: दोनों क्रियाएँ सरल कथात्मक क्रम में हैं; हिन्दी का संयुक्त प्रयोग अर्थ को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: वहाँ से ... उठा ले गए
  rationale: נשא यहाँ वस्तुओं को उठाकर ले जाने के अर्थ में है; यह चयन लूट की वस्तुओं को वहाँ से हटाने का भाव स्पष्ट करता है।
- source_word: כֶּסֶף וְזָהָב וּבְגָדִים
  choice: चाँदी, सोना और कपड़े
  rationale: यह आधुनिक मानक हिन्दी में सूची का स्पष्ट और सहज रूप है तथा तीनों इब्रानी संज्ञाओं को सीधे व्यक्त करता है।
- source_word: וַיַּטְמִנוּ
  choice: उन्हें छिपा दिया
  rationale: क्रिया का अर्थ छिपाना या गुप्त रखना है। ‘गाड़ दिया’ सम्भव संदर्भगत अनुमान होता, पर इब्रानी पाठ उतना विशिष्ट नहीं है।
- source_word: וַיָּשֻׁבוּ
  choice: इसके बाद वे लौटे
  rationale: यह कथात्मक क्रम और उनकी वापसी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל אַחֵר
  choice: एक दूसरे तंबू
  rationale: אַחֵר का अर्थ ‘दूसरा/अन्य’ है; प्रसंग में यह हिन्दी का स्वाभाविक रूप है।
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: वहाँ से भी सामान उठा ले गए
  rationale: दूसरी बार इब्रानी में कर्म अनुल्लिखित है। ‘सामान’ प्रसंग से निहित वस्तुओं को समझने योग्य बनाता है, पर उनकी प्रकृति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
