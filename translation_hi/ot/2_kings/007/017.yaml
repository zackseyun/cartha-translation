  rationale: यह राजा के निकट रहने वाले उच्च पदस्थ सैनिक या राजकीय अधिकारी को सूचित करता है; ‘अधिकारी’ अनिश्चित पद को अनावश्यक रूप से निश्चित नहीं करता।
