- source_word: בַּשַּׁעַר
  choice: फाटक में
  rationale: यह फाटक के भीतर या उसके मार्ग-क्षेत्र में हुई घटना को दर्शाता है; स्थानगत पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  choice: ठीक वैसे ही जैसे परमेश्वर के जन ने ... कहा था
  rationale: यह पूर्ववर्ती भविष्यवाणी की ठीक पूर्ति पर बल देता है और ‘परमेश्वर का जन’ शीर्षक को सुरक्षित रखता है।
- source_word: בְּרֶדֶת הַמֶּלֶךְ אֵלָיו
  choice: जब राजा उसके पास उतरकर आया था
  rationale: בְּ सहित infinitive construct समय बताता है; ‘उतरकर आया’ नीचे आने की दिशा और वर्णनात्मक दृष्टिकोण दोनों को व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी की पूर्ति
  choice: मृत्यु को परमेश्वर के जन के पहले कहे वचन की ठीक पूर्ति के रूप में स्पष्ट रखा गया है।
  alternative: इसे केवल मृत्यु की घटना के रूप में सहज बनाकर पूर्ति-सूत्र को कम प्रमुख किया जा सकता था।
  rationale: כַּאֲשֶׁר דִּבֶּר और दोहराए गए דִּבֶּר वाक्यांश घटना को पूर्व कथन से स्पष्टतः जोड़ते हैं; अनुवाद इससे अधिक कोई धार्मिक निष्कर्ष नहीं जोड़ता।
