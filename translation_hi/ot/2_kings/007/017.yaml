  yaml_path: translation/ot/2_kings/007/017.yaml
  text: The king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
translation:
  language: hi
  text: राजा ने उस अधिकारी[a] को, जिसके हाथ पर वह सहारा लेता था, फाटक की निगरानी के लिए नियुक्त किया था; पर लोगों ने उसे फाटक में पैरों तले रौंद डाला और वह मर गया, ठीक वैसे ही जैसे परमेश्वर के जन ने कहा था, जब राजा उसके पास उतरकर आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेनापति’ अथवा ‘राजकीय सहायक’; इब्रानी शब्द שָׁלִישׁ राजा के निकट रहने वाले किसी उच्च पदस्थ अधिकारी को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִפְקִיד ... עַל הַשַּׁעַר
  choice: फाटक की देखरेख पर नियुक्त किया था
  rationale: हिफ़ील क्रिया और עַל मिलकर जिम्मेदारी या निगरानी सौंपने का भाव देते हैं; पूर्वकालिक संदर्भ के लिए ‘नियुक्त किया था’ स्वाभाविक है।
