language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע שִׁמְע֖וּ דְּבַר יְהוָ֑ה כֹּ֣ה אָמַ֣ר יְהוָ֗ה כָּ/עֵ֤ת מָחָר֙ סְאָֽה סֹ֣לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל בְּ/שַׁ֥עַר שֹׁמְרֽוֹן־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
translation:
  language: hi
  text: 'तब एलीशा ने कहा, “याहवे का वचन सुनो। याहवे यों कहता है: कल लगभग इसी समय शोमरोन के फाटक पर एक शेकेल में एक सआ[a] बारीक आटा और एक शेकेल में दो सआ जौ होंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सआ’ सूखी वस्तुओं को मापने की एक प्राचीन इब्रानी इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: यह बहुवचन आज्ञार्थक रूप है और भविष्यद्वक्तीय उद्घोषणा की औपचारिक पुकार को बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: ‘वचन’ मानक भविष्यद्वक्तीय सूत्र और उसकी वाचिक गंभीरता को ‘संदेश’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम का लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्तीय संदेशवाहक-सूत्र का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: כָּעֵת מָחָר
  choice: कल लगभग इसी समय
  rationale: यह अगले दिन के करीब इसी समय को सूचित करता है; ‘लगभग’ उपसर्ग כְּ की अनुमानात्मक छाया को व्यक्त करता है।
- source_word: סְאָה / סָאתַיִם
  choice: एक सआ / दो सआ
  rationale: विशिष्ट प्राचीन सूखी माप को सामान्य ‘नाप’ में बदलने के बजाय लिप्यंतरित किया गया है; संख्या से एकवचन और द्विवचन स्पष्ट हैं।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बारीक पिसे हुए उत्तम आटे का द्योतक है; आधुनिक हिन्दी में ‘मैदा’ इसका संक्षिप्त और सहज समतुल्य है।
- source_word: בְּשֶׁקֶל
  choice: एक शेकेल में
  rationale: बाजार-मूल्य के प्रसंग में בְּ कीमत बताता है; यह प्रयोग हिन्दी में वस्तु की उपलब्ध मात्रा और कीमत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׂעֹרִים
  choice: जौ
  rationale: यह अनाज के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  choice: शोमरोन के फाटक पर
  rationale: नगर का फाटक व्यापार और सार्वजनिक गतिविधि का स्थान था; ‘फाटक पर’ स्थानवाचक अर्थ को सहज रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: भावी बाजार-स्थिति की अभिव्यक्ति
  choice: मिलेंगे
  alternative: होंगे / बिकेगा
  rationale: इब्रानी में स्पष्ट क्रिया अनुपस्थित है और मूल्य-सूचक वाक्य नामात्मक है। ‘मिलेंगे’ हिन्दी में उपलब्धता और बताए गए मूल्य—दोनों को स्वाभाविक रूप से व्यक्त करता है, बिना बिक्री की क्रिया को अनावश्यक रूप से प्रमुख बनाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वक्तीय सूत्र में औपचारिकता बनाए रखते हुए बाजार-मूल्य वाले वाक्य को सामान्य हिन्दी में स्पष्ट किया गया है। प्राचीन माप और मुद्रा के विशिष्ट नाम सुरक्षित रखे गए हैं।
