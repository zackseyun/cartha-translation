source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
translation:
  language: hi
  text: तब वे गोधूलि के समय उठकर अराम की छावनी की ओर चले। जब वे अराम की छावनी के किनारे पहुँचे, तो देखा कि वहाँ कोई भी नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  choice: तब वे उठकर
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। ‘तब’ क्रम को और ‘उठकर’ अगली उद्देश्यपूर्ण क्रिया से स्वाभाविक संबंध को व्यक्त करता है।
- source_word: בַנֶּשֶׁף
  choice: गोधूलि के समय
  rationale: इस प्रसंग में נֶשֶׁף दिन ढलने की धुँधली बेला, अर्थात् साँझ/गोधूलि, को दर्शाता है।
- source_word: לָבוֹא אֶל מַחֲנֵה אֲרָם
  choice: अराम की छावनी की ओर चले
  rationale: בוא यहाँ छावनी की ओर जाने का उद्देश्य बताता है। हिंदी में ‘की ओर चले’ कथावाचक के दृष्टिकोण से स्वाभाविक है।
- source_word: עַד קְצֵה מַחֲנֵה אֲרָם
  choice: अराम की छावनी के किनारे पहुँचे
  rationale: עַד קְצֵה बाहरी सीमा तक पहुँचने को व्यक्त करता है; ‘किनारे पहुँचे’ स्पष्ट और सहज है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: הִנֵּה अचानक सामने आए आश्चर्यजनक दृश्य की ओर ध्यान खींचता है। ‘तो देखा कि’ आधुनिक हिंदी में इस कथात्मक प्रभाव को स्वाभाविक ढंग से रखता है।
- source_word: אֵין שָׁם אִישׁ
  choice: वहाँ कोई भी नहीं था
  rationale: नकारात्मक अस्तित्ववाचक वाक्य में אִישׁ का अर्थ सामान्यतः ‘कोई व्यक्ति/कोई भी’ है। ‘कोई भी नहीं’ स्रोत के आशय को स्वाभाविक हिंदी में पूर्णतः व्यक्त करता है।
theological_decisions:
- issue: नकारात्मक अस्तित्ववाचक कथन में पुल्लिंग एकवचन אִישׁ
  choice: वहाँ कोई भी नहीं था
  alternative: वहाँ कोई आदमी नहीं था
  rationale: यहाँ कथन केवल पुरुषों की अनुपस्थिति नहीं, छावनी में किसी भी व्यक्ति के न होने को बताता है। हिंदी का ‘कोई भी’ इस सामान्य अर्थ को बिना अनावश्यक लैंगिक संकुचन के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण कथात्मक हिंदी है। ‘गोधूलि’ समय की धुँधली साँझ को संक्षेप में व्यक्त करता है; ‘तो देखा कि’ हिब्रू הִנֵּה की आकस्मिक खोज और आश्चर्य को स्वाभाविक हिंदी में बनाए रखता है।
