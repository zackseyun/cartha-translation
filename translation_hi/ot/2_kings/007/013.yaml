base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
translation:
  language: hi
  text: तब उसके सेवकों में से एक ने उत्तर देकर कहा, “कृपया, बचे हुए घोड़ों में से पाँच घोड़े ले लिए जाएँ, जो उसमें बचे हैं।[a] देखिए, वे इस्राएल के पूरे जनसमूह के समान हैं, जो उसमें बचा हुआ है; देखिए, वे इस्राएल के पूरे जनसमूह के समान हैं, जो नष्ट हो चुका है।[b] इसलिए हम उन्हें भेजकर देखें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसमें’ से सम्भवतः सामरिया नगर का संकेत है, पर इस पद में नगर का नाम दोहराया नहीं गया है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में तुलना कठिन और पुनरुक्तिपूर्ण है: बचे हुओं और नष्ट हो चुके लोगों—दोनों से लगभग एक ही रूप में तुलना की गई है। अनुवाद इस पुनरावृत्ति और कुछ हद तक उसकी अस्पष्टता को बनाए रखता है।'
    reason: textual_difficulty
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵעֲבָדָיו וַיֹּאמֶר
  choice: तब उसके सेवकों में से एक ने उत्तर दिया
  rationale: राजकीय संदर्भ में עֶבֶד के लिए ‘सेवक’ व्यापक और स्वाभाविक है। ‘उत्तर दिया’ ענה के कथन-परिचायक प्रयोग को व्यक्त करता है; हिन्दी में अलग से ‘कहा’ जोड़ना अनावश्यक है।
- source_word: וְיִקְחוּ נָא
  choice: कृपया ... ले लिए जाएँ
  rationale: नָא सहित इच्छार्थक रूप विनम्र प्रस्ताव या आग्रह व्यक्त करता है। कर्म करने वालों की स्पष्ट पहचान न होने के कारण हिन्दी का भाववाच्य मूल की अनिश्चितता बनाए रखता है।
- source_word: חֲמִשָּׁה מִן הַסּוּסִים הַנִּשְׁאָרִים
  choice: बचे हुए घोड़ों में से पाँच घोड़े
  rationale: מִן का अंशवाचक अर्थ स्पष्ट किया गया है और שׁאר की धारणा ‘बचे हुए’ से व्यक्त हुई है।
- source_word: אֲשֶׁר נִשְׁאֲרוּ בָהּ
  choice: जो उसमें रह गए हैं
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संभावित संकेत सामरिया नगर की ओर है, पर मूल में नगर का नाम यहाँ दोहराया नहीं गया; इसलिए ‘उसमें’ रखा गया है।
- source_word: הִנָּם
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले कण की पुनरावृत्ति को आधुनिक, सम्मानपूर्ण हिन्दी में ‘देखिए’ से सुरक्षित रखा गया है।
- source_word: כְּכָל הֲמוֹן יִשְׂרָאֵל
  choice: इस्राएल की उस सारी भीड़ के समान
  rationale: הָמוֹן के सामूहिक अर्थ के लिए ‘भीड़’ सहज हिन्दी है; כְּ की तुलना को स्पष्ट रखा गया है।
- source_word: אֲשֶׁר תָּמּוּ
  choice: जो नष्ट हो चुकी है
  rationale: संदर्भ में תָּמּוּ का आशय समाप्त हो जाने या मर जाने से है; ‘नष्ट हो चुकी है’ इसकी गंभीरता और व्यापकता बनाए रखता है।
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  choice: इसलिए हम उन्हें भेजकर देखें
  rationale: दोनों प्रथम-पुरुष सहमतिकारक रूपों के प्रस्तावात्मक बल को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘उन्हें’ भेजे जाने वाले लोगों को संदर्भ से ग्रहण करता है।
theological_decisions:
- issue: घोड़ों और इस्राएल की भीड़ के बीच कठिन तुलना
  choice: ‘उनका हाल ... के समान ही होगा’ के साथ दोनों समानांतर वाक्य सुरक्षित रखे गए
  alternative: तुलना को व्याख्यात्मक रूप से सरल कर देना कि घोड़ों/सवारों का मरना या बचना नगरवासियों जैसा ही होगा
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त और पुनरुक्तिपूर्ण है। मुख्य आशय समझने योग्य बनाने के लिए ‘हाल’ जोड़ा गया, पर यह तय नहीं किया गया कि सर्वनाम केवल घोड़ों, भेजे गए लोगों, या पूरे दल को सूचित करता है; पुनरावृत्ति भी नहीं हटाई गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्वर रखा गया है। ‘देखिए’ मूल के दोहरे ध्यानाकर्षक कण को व्यक्त करता है। कठिन इब्रानी तुलना को पूरी तरह समतल नहीं किया गया, पर हिन्दी में वाक्य समझने योग्य बनाने के लिए सीमित रूप से ‘उनका हाल’ जोड़ा गया है।
