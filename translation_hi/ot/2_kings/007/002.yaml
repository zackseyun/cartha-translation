source:
  edition: WLC
  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
translation:
  language: hi
  text: तब उस अधिकारी ने, जिसके हाथ पर राजा टिका रहता था, परमेश्वर के जन को उत्तर दिया, “देखो, यदि याहवे आकाश में झरोखे बना दे, तो क्या यह बात हो सकती है?” परमेश्वर के जन ने कहा, “देखो, तुम इसे अपनी आँखों से देखोगे, पर उसमें से नहीं खाओगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: अधिकारी
  rationale: यह शब्द किसी उच्चपदस्थ सैनिक अथवा राजकीय अधिकारी को सूचित कर सकता है; सटीक पद अनिश्चित होने के कारण ‘अधिकारी’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: נִשְׁעָן עַל יָדוֹ
  choice: जिसकी बाँह पर राजा सहारा लेता था
  rationale: मुहावरे के सजीव दरबारी चित्र को बनाए रखते हुए יָד को यहाँ स्वाभाविक हिन्दी में ‘बाँह’ कहा गया है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी के लिए प्रयुक्त मानक इब्रानी उपाधि का पारंपरिक और पारदर्शी हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: आकाश में झरोखे भी बना दे
  rationale: ‘झरोखे’ मूल रूपक को बनाए रखता है; ‘भी’ अधिकारी की अविश्वासपूर्ण अतिशयोक्ति को हिन्दी में स्पष्ट करता है।
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  choice: तो क्या यह बात हो सकती है?
  rationale: प्रश्न संभावना के प्रति अधिकारी के अविश्वास और उपहास को व्यक्त करता है।
- source_word: רֹאֶה בְּעֵינֶיךָ
  choice: तुम इसे अपनी आँखों से देखोगे
  rationale: ‘अपनी आँखों से’ मूल की जोरदार और स्वाभाविक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: पर उसमें से खा नहीं पाओगे
  rationale: מִשָּׁם का संकेत प्रसंग में बताई गई खाद्य-सामग्री की ओर है; ‘खा नहीं पाओगे’ परिणामस्वरूप वंचित रहने का भाव स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: अधिकारी के कथन का स्वर
  choice: अविश्वासपूर्ण आलंकारिक प्रश्न
  alternative: वास्तविक संभावना के विषय में तटस्थ प्रश्न
  rationale: הֲיִהְיֶה और प्रसंग अधिकारी की घोर शंका व्यक्त करते हैं; फिर भी मुख्य पाठ उसके कथन से आगे बढ़कर उसकी मनोदशा की व्याख्या नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथन की तीखी शंका तथा उत्तर की भविष्यसूचक गंभीरता सुरक्षित हैं। किसी पाद-टिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पाद-टिप्पणी चिह्न नहीं है।
