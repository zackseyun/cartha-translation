  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
translation:
  language: hi
  text: तब राजा रात में उठा और अपने सेवकों से कहा, “मैं तुम्हें बताऊँ कि अराम[a] ने हमारे साथ क्या किया है। वे जानते हैं कि हम भूखे हैं, इसलिए वे छावनी से निकलकर मैदान में छिप गए हैं, यह कहते हुए, ‘जब वे नगर से बाहर निकलेंगे, तब हम उन्हें जीवित पकड़ लेंगे और नगर में प्रवेश कर जाएँगे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अरामी।” इब्रानी में “अराम” देश अथवा नाम का प्रयोग यहाँ अराम के लोगों या सेना के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ לַיְלָה
  choice: तब राजा रात में उठा
  rationale: קום का यह कथात्मक रूप रात में विश्राम या बिस्तर से उठने को सूचित करता है; आधुनिक हिन्दी में ‘उठा’ स्वाभाविक और ठोस है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: राजदरबार के संदर्भ में עבד राजकीय सेवकों, परिचारकों या अधिकारियों को सूचित कर सकता है; ‘सेवकों’ व्यापक और स्रोत के निकट है।
- source_word: אַגִּידָה נָּא לָכֶם
  choice: सुनो, मैं तुम्हें बताता हूँ
  rationale: सहगामी रूप और נָא वक्ता के आग्रहपूर्ण प्रस्ताव को व्यक्त करते हैं। ‘सुनो’ हिन्दी में उस आग्रह को स्वाभाविक रूप से सामने लाता है।
- source_word: אֲשֶׁר עָשׂוּ לָנוּ אֲרָם
  choice: अरामियों ने हमारे साथ क्या किया है
  rationale: אֲרָם स्थान अथवा राष्ट्र के नाम द्वारा उसकी सेना या लोगों को दर्शाता है। बहुवचन क्रिया עָשׂוּ के अनुरूप ‘अरामियों’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יָדְעוּ כִּי רְעֵבִים אֲנַחְנוּ
  choice: वे जानते हैं कि हम भूखे हैं
  rationale: राजा शत्रु के वर्तमान ज्ञान और उसके आधार पर बनाई गई योजना का अनुमान बता रहा है; वर्तमान काल इस प्रत्यक्ष कथन में उचित है।
- source_word: וַיֵּצְאוּ מִן הַמַּחֲנֶה
  choice: वे छावनी से निकलकर
  rationale: सैन्य पड़ाव के लिए ‘छावनी’ उपयुक्त है; संयुक्त क्रिया आगे के उद्देश्यपूर्ण छिपने से क्रिया को स्वाभाविक रूप से जोड़ती है।
- source_word: לְהֵחָבֵה בַשָּׂדֶה
  choice: मैदान में छिप गए हैं
  rationale: क्रिया का आत्मवाची भाव ‘छिप गए’ में स्वाभाविक रूप से निहित है। שדה के लिए ‘मैदान’ नगर के बाहर घात लगाने की खुली भूमि का सामान्य हिन्दी शब्द है।
- source_word: לֵאמֹר
  choice: और आपस में कह रहे हैं
  rationale: यह कथित अरामी योजना की प्रत्यक्ष वाणी का परिचय देता है। ‘आपस में’ प्रसंग को स्पष्ट करता है, पर कथन को केवल मन की सोच बनाकर सीमित नहीं करता।
- source_word: כִּי יֵצְאוּ מִן הָעִיר
  choice: जब वे नगर से बाहर निकलेंगे
  rationale: כִּי यहाँ घात की अपेक्षित परिस्थिति प्रस्तुत करता है; इस योजना में ‘जब’ ‘यदि’ की तुलना में अधिक उपयुक्त है।
- source_word: וְנִתְפְּשֵׂם חַיִּים
  choice: तब हम उन्हें जीवित पकड़ लेंगे
  rationale: תפשׂ अचानक पकड़ लेने या बंदी बनाने को दर्शाता है और חַיִּים का विधेयात्मक अर्थ ‘जीवित’ है।
- source_word: וְאֶל הָעִיר נָבֹא
  choice: और नगर में घुस जाएँगे
  rationale: בוא का मूल अर्थ प्रवेश करना है; शत्रु की घात और नगर पर अधिकार की योजना के संदर्भ में ‘घुस जाएँगे’ स्वाभाविक तथा सजीव है।
