  yaml_path: translation/ot/2_kings/007/003.yaml
  text: There were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
translation:
  language: hi
  text: फाटक के प्रवेश पर त्वचा-रोग से पीड़ित चार पुरुष[a] थे। उन्होंने एक-दूसरे से कहा, “हम यहाँ क्यों बैठे रहें, जब तक कि हम मर न जाएँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ी।” इब्रानी शब्द צָרַעַת से संबंधित त्वचा की दशा को दर्शाता है; यह आवश्यक नहीं कि वह आधुनिक कुष्ठ रोग (हैन्सेन रोग) ही हो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָה אֲנָשִׁים הָיוּ
  choice: चार पुरुष थे
  rationale: यह पद नए पात्रों को सामने लाता है। हिन्दी में अस्तित्वसूचक भाव को स्वाभाविक शब्दक्रम ‘चार पुरुष थे’ से व्यक्त किया गया है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: מְצֹרָעִים
  choice: त्वचा-रोग से पीड़ित
  rationale: इब्रानी पद צָרַעַת से जुड़ी दशा को दर्शाता है, जिसे आधुनिक हैन्सन रोग के समान मानना निश्चित नहीं। मुख्य पाठ में चिकित्सकीय अति-विशिष्टता से बचते हुए व्यापक और स्पष्ट अभिव्यक्ति रखी गई है।
- source_word: פֶּתַח הַשָּׁעַר
  choice: फाटक के प्रवेश-द्वार पर
  rationale: समास का अर्थ फाटक का खुला स्थान या प्रवेश है। यह हिन्दी में स्थान को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ
  choice: उन्होंने एक-दूसरे से कहा
  rationale: शाब्दिक रूप से ‘एक पुरुष अपने साथी से’ वाला इब्रानी मुहावरा समूह के परस्पर संवाद को व्यक्त करता है।
- source_word: מָה אֲנַחְנוּ יֹשְׁבִים פֹּה
  choice: हम यहाँ बैठे-बैठे ... क्यों कर रहे हैं?
  rationale: प्रश्न में מָה का अर्थ प्रसंगानुसार ‘क्यों’ है। יֹשְׁבִים की निरंतर अवस्था को ‘बैठे-बैठे’ से उभारा गया है।
- source_word: עַד מָתְנוּ
  choice: मरने की प्रतीक्षा
  rationale: शाब्दिक अर्थ ‘जब तक हम मर न जाएँ’ है। हिन्दी प्रश्न में ‘बैठे-बैठे मरने की प्रतीक्षा’ उसी निष्क्रिय रूप से मृत्यु की ओर बने रहने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
