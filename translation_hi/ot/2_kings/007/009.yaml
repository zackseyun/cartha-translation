source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ אִ֨ישׁ אֶל רֵעֵ֜/הוּ לֹֽא כֵ֣ן אֲנַ֣חְנוּ עֹשִׂ֗ים הַ/יּ֤וֹם הַ/זֶּה֙ יוֹם בְּשֹׂרָ֣ה ה֔וּא וַ/אֲנַ֣חְנוּ מַחְשִׁ֗ים וְ/חִכִּ֛ינוּ עַד א֥וֹר הַ/בֹּ֖קֶר וּ/מְצָאָ֣/נוּ עָו֑וֹן וְ/עַתָּה֙ לְכ֣וּ וְ/נָבֹ֔אָה וְ/נַגִּ֖ידָה בֵּ֥ית הַ/מֶּֽלֶךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
translation:
  language: hi
  text: तब वे एक-दूसरे से कहने लगे, “हम जो कर रहे हैं, वह ठीक नहीं है। आज शुभ समाचार का दिन है, और हम चुप हैं। यदि हम भोर का उजाला होने तक प्रतीक्षा करें, तो हम पर दोष आ पड़ेगा[a]। इसलिए अब आओ, हम जाकर राजा के घराने को इसकी सूचना दें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोष/अपराध हमें ढूँढ़ लेगा।” इसका अर्थ “दंड हमें आ पकड़ेगा” या “हम दोषी ठहरेंगे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “राजा का घर।” इसका अर्थ “राजमहल” या राजा का घरेलू-प्रशासनिक तंत्र भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן אֲנַחְנוּ עֹשִׂים
  choice: हम जो कर रहे हैं, वह ठीक नहीं है
  rationale: इब्रानी मुहावरे के नैतिक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יוֹם בְּשֹׂרָה
  choice: शुभ समाचार का दिन
  rationale: בְּשֹׂרָה यहाँ छुटकारे अथवा विजय के अच्छे समाचार को दर्शाता है।
- source_word: מַחְשִׁים
  choice: हम चुप बैठे हैं
  rationale: हिफ़ील कृदंत जानबूझकर और लगातार चुप रहने का भाव देता है; ‘चुप बैठे हैं’ प्रसंग में उसकी निंदनीय निष्क्रियता भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְחִכִּינוּ עַד אוֹר הַבֹּקֶר
  choice: यदि हम भोर का उजाला होने तक प्रतीक्षा करें
  rationale: संदर्भ में वाव सहित पूर्ण क्रिया शर्त का काम करती है और אוֹר הַבֹּקֶר का दृश्यात्मक अर्थ ‘भोर का उजाला’ से बना रहता है।
- source_word: וּמְצָאנוּ עָוֹן
  choice: दोष हमें आ पकड़ेगा
  rationale: शाब्दिक रूप से ‘दोष/अधर्म हमें ढूँढ़ लेगा’; यह अनुवाद मूल रूपक और उत्तरदायित्व के भाव को बनाए रखता है, बिना इसे केवल दंड तक सीमित किए।
- source_word: לְכוּ וְנָבֹאָה
  choice: आओ, हम चलकर
  rationale: दोनों आग्रहसूचक क्रियाओं को सहज हिन्दी में तत्काल सामूहिक कार्रवाई के निमंत्रण के रूप में व्यक्त करता है।
- source_word: וְנַגִּידָה
  choice: इसकी सूचना दें
  rationale: हिफ़ील נגד यहाँ आवश्यक समाचार बताने या औपचारिक रूप से पहुँचाने के अर्थ में है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजघराने को
  rationale: ‘राजा के घर’ के व्यापक संस्थागत अर्थ को व्यक्त करता है और केवल भवन का अर्थ अनिवार्य नहीं बनाता।
theological_decisions:
- issue: עָוֹן का अर्थ दोष है या दंड
  choice: दोष हमें आ पकड़ेगा
  alternative: दंड हमें आ पकड़ेगा
  rationale: עָוֹן दोष, अधर्म और उसके दंडात्मक परिणाम—तीनों से जुड़ सकता है। मुख्य पाठ में नैतिक दोष और मूल ‘ढूँढ़ने’ के रूपक को रखा गया है; दंड का संभावित अर्थ पादटिप्पणी में दिया गया है।
- issue: בֵּית הַמֶּלֶךְ व्यक्ति-समूह है या स्थान
  choice: राजघराने को
  alternative: राजमहल में
  rationale: इब्रानी पदबंध राजकीय घराने, उसके कर्मचारियों अथवा महल को सूचित कर सकता है; मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी स्थानगत विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शुभ समाचार’, ‘भोर का उजाला’ और ‘सूचना दें’ सामान्य पाठक के लिए स्पष्ट हैं; साथ ही दो वास्तविक इब्रानी अर्थ-अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
