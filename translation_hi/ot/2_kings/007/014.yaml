  text: So they took two chariots with horses[a], and the king sent them after the camp of Aram, saying, “Go and see.”
translation:
  language: hi
  text: तब उन्होंने घोड़ों समेत दो रथ[a] लिए, और राजा ने उन्हें अराम की छावनी के पीछे भेजा और कहा, “जाओ और देखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “घोड़ों के दो रथ”; यह संक्षिप्त पदबंध संभवतः घोड़ों से जुते दो रथों या दो रथ-दलों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: तब उन्होंने ... लिए
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिक कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁנֵי רֶכֶב סוּסִים
  choice: घोड़ों समेत दो रथ
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक अध्याहृत है। यह संभवतः घोड़ों से जुते दो रथों या दो रथ-दलों को सूचित करता है; चुना हुआ रूप ठोस चित्र बनाए रखते हुए हिन्दी में सहज है।
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ
  choice: और राजा ने उन्हें ... भेजते हुए
  rationale: ‘उन्हें’ निकटवर्ती संदर्भ से स्पष्ट टोही दल को सूचित करता है। ‘भेजते हुए कहा’ हिन्दी में भेजने और आदेश देने को स्वाभाविक ढंग से जोड़ता है।
- source_word: אַחֲרֵי מַחֲנֵה אֲרָם
  choice: अराम की छावनी के पीछे
  rationale: אַחֲרֵי की दिशात्मक भावना ‘पीछे’ से और מַחֲנֶה का अर्थ ‘छावनी’ से व्यक्त होता है; इससे बिना अनावश्यक रूप से ‘पीछा करने’ का भाव जोड़ते हुए मूल अर्थ सुरक्षित रहता है।
- source_word: אֲרָם
  choice: अराम
  rationale: स्थान अथवा राज्य के प्राचीन नाम को लिप्यंतरित किया गया है; ‘सीरिया’ कालविपर्ययी हो सकता है और ‘अरामी’ मूल की संज्ञा को जनसमूह में बदल देता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: प्रत्यक्ष वचन का स्वाभाविक हिन्दी परिचय; ‘भेजते हुए कहा’ मूल की वचन-परिचायक संरचना का अर्थ संप्रेषित करता है।
- source_word: לְכוּ וּרְאוּ
  choice: जाकर देखो
  rationale: दोनों सरल आज्ञाओं को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है; ‘देखो’ ראה का मूल और खुला अर्थ बनाए रखता है।
