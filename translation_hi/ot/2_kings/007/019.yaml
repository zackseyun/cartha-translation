base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
translation:
  language: hi
  text: तब उस अधिकारी ने परमेश्वर के जन को उत्तर दिया, “यदि याहवे आकाश में झरोखे[a] बना रहे हों, तो क्या यह बात हो सकती है?” तब परमेश्वर के जन ने कहा, “देख, तू इसे अपनी आँखों से देखेगा, पर उसमें से नहीं खाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश में जल-फाटक।” इब्रानी में शाब्दिक अर्थ “आकाश में झरोखे” है—यह स्वर्ग के ऐसे खुलने का रूपक है, जिनसे प्रबन्ध या न्याय आ सकता है।
    reason: अर्थगत वैकल्पिक अनुवाद और मूल रूपक की व्याख्या
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  choice: अधिकारी
  rationale: यह शब्द किसी ऊँचे पद के सैनिक अथवा राजकीय अधिकारी को सूचित करता है। ‘अधिकारी’ पद का अनावश्यक निर्धारण किए बिना प्रसंग के अनुकूल और आधुनिक हिन्दी में स्पष्ट है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह भविष्यद्वक्ता के लिए प्रयुक्त स्थापित उपाधि है; इसे औपचारिक रूप में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है।
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  choice: आकाश में झरोखे बना रहे हों
  rationale: ‘झरोखे’ मूल रूपक को सुरक्षित रखता है। क्रियावाचक कृदन्त को शर्तसूचक कथन के भीतर स्वाभाविक हिन्दी में ‘बना रहे हों’ कहा गया है।
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  choice: तो क्या ऐसी बात हो सकती है?
  rationale: यह भविष्यवाणी पूरी होने पर अधिकारी के संदेह को व्यक्त करने वाला अलंकारिक प्रश्न है।
- source_word: הִנְּךָ רֹאֶה בְּעֵינֶיךָ
  choice: देख, तू इसे अपनी आँखों से देखेगा
  rationale: הִנְּךָ ध्यान आकर्षित करता है और कृदन्त प्रसंग में निकट भविष्य की भविष्यवाणी व्यक्त करता है; ‘अपनी आँखों से’ बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  choice: पर उसमें से खा नहीं पाएगा
  rationale: शाब्दिक ‘वहाँ से’ पूर्वकथित उपलब्ध भोजन की ओर संकेत करता है। ‘उसमें से’ हिन्दी में उसका संदर्भ स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: पद में चार अक्षरों वाला ईश्वरीय नाम सीधे आया है। ‘याहवे’ मूल नाम का व्यापक रूप से मान्य आधुनिक लिप्यंतरण है और इसे सामान्य उपाधि से नहीं बदलता।
