  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: The rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: और आमोन के शेष कार्य[a], जो उसने किए, क्या वे यहूदा के राजाओं के वृत्तांतों की पुस्तक[b] में नहीं लिखे हुए हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कार्य’ के स्थान पर ‘काम’ या ‘कृत्य’ भी कहा जा सकता है। इब्रानी शब्द का शाब्दिक अर्थ ‘बातें’ या ‘मामले’ है, पर राजाओं के इस सार-सूत्र में उससे उसके दर्ज किए गए कार्य अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘पुस्तक’ यहाँ एक प्राचीन लिखित अभिलेख को सूचित करती है, जो संभवतः एक स्क्रॉल था। इस पदबंध का अनुवाद ‘यहूदा के राजाओं के इतिहास की पुस्तक’ या ‘यहूदा के राजाओं के वार्षिक वृत्तांतों की पुस्तक’ भी किया जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: और ... बाकी
  rationale: וְ के संयोजक बल को ‘और’ तथा יֶתֶר के ‘शेष/बाकी’ अर्थ को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: דִּבְרֵי
  choice: काम
  rationale: इस राजकीय सार-सूत्र में शब्द का आशय राजा के दर्ज किए गए कार्यों से है; ‘काम’ सामान्य पाठक के लिए स्वाभाविक है और ‘बातें’ की अपेक्षा प्रसंग को अधिक ठीक व्यक्त करता है।
- source_word: אָמ֖וֹן
  choice: आमोन
  rationale: इब्रानी व्यक्तिगत नाम का मानक हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किए
  rationale: मूल संबंधवाचक उपवाक्य को सीधे और स्वाभाविक ढंग से रखा गया है; यह ‘काम’ का स्पष्टीकरण करता है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में प्रश्नात्मक रूप बनाए रखने से मूल की आलंकारिक शक्ति सुरक्षित रहती है।
- source_word: הֵם כְּתוּבִים
  choice: क्या वे ... नहीं लिखे हैं
  rationale: निष्क्रिय कृदंत का सीधा अर्थ ‘लिखे हुए हैं’ है; हिन्दी प्रश्न-विन्यास में ‘लिखे हैं’ स्वाभाविक है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/लपेटे हुए लेख पर’ है, पर किसी लिखित अभिलेख की सामग्री के लिए हिन्दी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: דִּבְרֵי הַיָּמִים
  choice: इतिहास
  rationale: राजकीय स्रोत-सूत्र में यह पद दिनों की घटनाओं के क्रमबद्ध अभिलेख या राजकीय वृत्तांत को दर्शाता है; ‘इतिहास’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के
  rationale: यहाँ לְ स्रोत-शीर्षक में संबंध प्रकट करता है; हिन्दी में संबंधकारक ‘के’ उपयुक्त है।
