base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/021.yaml
  text: He walked in all the way that his father had walked[a], and he served the idols that his father had served, and bowed down to them.
translation:
  language: hi
  text: वह पूरी तरह उसी मार्ग पर चला जिस पर उसका पिता चला था, और उसने उन्हीं मूर्तियों[a] की सेवा की जिनकी सेवा उसके पिता ने की थी, और उनके सामने दण्डवत् किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ मूर्तियों के लिए एक तिरस्कारपूर्ण शब्द है; इसका अनुवाद ‘घृणित मूर्तियाँ’ या अधिक शब्दशः ‘गोबर-समान मूर्तियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ אָבִיו
  choice: वह पूरी तरह उसी मार्ग पर चला जिस पर उसका पिता चला था
  rationale: ‘मार्ग पर चलना’ जीवन-आचरण के इब्रानी रूपक को बनाए रखता है। בְּכָל का भाव यहाँ पिता के पूरे आचरण का अनुसरण करना है, जिसे स्वाभाविक हिन्दी में ‘पूरी तरह उसी मार्ग पर’ व्यक्त किया गया है।
- source_word: וַיַּעֲבֹד
  choice: उसने ... सेवा की
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है। धार्मिक संदर्भ होने पर भी इसे ‘पूजा की’ न कहने से अगले क्रियापद, दण्डवत् करने, के साथ अर्थगत भेद बना रहता है।
- source_word: הַגִּלֻּלִים
  choice: मूर्तियों
  rationale: यह मूर्तिपूजा की वस्तुओं के लिए प्रयुक्त तिरस्कारपूर्ण शब्द है। ‘मूर्तियाँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; शब्द का तिरस्कारपूर्ण भाव पादटिप्पणी में बताया गया है।
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: उनके सामने दण्डवत् किया
  rationale: क्रिया श्रद्धा या आराधना में झुकने अथवा भूमि पर गिरने को दर्शाती है। ‘दण्डवत् किया’ शारीरिक क्रिया को बनाए रखता है और पूर्ववर्ती ‘सेवा की’ से इसे अलग रखता है।
theological_decisions:
- issue: גִּלֻּלִים के तिरस्कारपूर्ण अर्थ का अनुवाद
  choice: मुख्य पाठ में ‘मूर्तियों’, तिरस्कारपूर्ण भाव पादटिप्पणी में
  alternative: ‘घृणित मूर्तियों’ या अधिक शब्दशः ‘गोबर-समान मूर्तियों’
  rationale: मूल शब्द में वास्तविक तिरस्कार है, पर अत्यधिक शब्दशः रूप हिन्दी मुख्य पाठ में अस्वाभाविक और व्याख्यात्मक हो सकता है। पादटिप्पणी मूल की तीव्रता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘मार्ग पर चला’, ‘सेवा की’ और ‘दण्डवत् किया’ मूल पाठ के तीन अलग भावों—आचरण, धार्मिक सेवा और झुककर आराधना—को अलग-अलग बनाए रखते हैं।
