  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
translation:
  language: hi
  text: उसने याहवे के भवन[a] में वेदियाँ बनाईं, जिसके विषय में याहवे ने कहा था, “यरूशलेम में मैं अपना नाम रखूँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के मंदिर में।” शाब्दिक रूप से, “याहवे के भवन में।”
    reason: lexical_alternative
  - marker: b
    text: “अपना नाम रखना” उस स्थान के संबंध में मंदिर-वाचा की भाषा है, जिसे याहवे अपने नाम और उपस्थिति से संबद्ध करने के लिए चुनता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/בָנָה
  choice: उसने ... बनाईं
  rationale: वाव के साथ क़ाल कथात्मक क्रिया पूर्ववर्ती घटनाक्रम को आगे बढ़ाती है। हिन्दी में आरम्भिक ‘और’ के बिना भी यह क्रम स्वाभाविक रूप से व्यक्त होता है।
- source_word: מִזְבְּחֹת
  choice: वेदियाँ
  rationale: यह מִזְבֵּחַ का बहुवचन है और बलि चढ़ाने की वेदियों के लिए मानक शब्द है।
- source_word: בְּ/בֵית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ स्रोत के ‘घर/भवन’ रूपक को बनाए रखता है; प्रसंग में इसका आशय मंदिर है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: जिसके विषय में याहवे ने कहा था
  rationale: सम्बन्धवाचक खंड को निकटवर्ती ‘भवन’ से जोड़ता है और ‘कहा था’ पूर्वकालिक दिव्य कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּ/ירוּשָׁלַם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग स्थान को सूचित करता है और स्रोत की तरह उद्धरण में स्थान को पहले रखा गया है।
- source_word: אָשִׂים אֶת שְׁמִי
  choice: मैं अपना नाम रखूँगा
  rationale: मूल मंदिर-वाचा संबंधी मुहावरे को व्याख्यात्मक विस्तार दिए बिना निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ‘मैं अपना नाम रखूँगा’ में मंदिर-नाम संबंधी धर्मवैज्ञानिक भाषा
  choice: मूल मुहावरा बनाए रखा गया
  alternative: मैं अपनी उपस्थिति स्थापित करूँगा
  rationale: व्याख्यात्मक विकल्प संभावित आशय बताता है, पर मूल पाठ केवल ‘नाम रखने’ की भाषा देता है। इसलिए धर्मवैज्ञानिक गहराई और तनाव को बिना चुपचाप सुलझाए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भवन’ स्रोत की ठोस अभिव्यक्ति को बचाता है, जबकि पादटिप्पणी सामान्य अर्थ ‘मंदिर’ बताती है।
