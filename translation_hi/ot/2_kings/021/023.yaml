  text: And Amon’s servants conspired against him and put the king to death in his own house[a].
translation:
  language: hi
  text: आमोन के सेवकों ने उसके विरुद्ध षड्यंत्र रचा और राजा को उसी के घर में मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: षड्यंत्र रचा
  rationale: राजनीतिक और राजदरबारी प्रसंग में קשר का अर्थ किसी के विरुद्ध षड्यंत्र करना है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: עַבְדֵי אָמוֹן
  choice: आमोन के सेवकों
  rationale: עבדים राजदरबार के सेवकों या परिचारकों को सूचित कर सकता है। ‘सेवकों’ मूल के संबंध को बनाए रखता है और ‘अधिकारियों’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: षड्यंत्र के साथ על उस व्यक्ति को दर्शाता है जिसके विरुद्ध शत्रुतापूर्ण योजना बनाई गई; सर्वनाम का संदर्भ आमोन है।
- source_word: וַיָּמִיתוּ
  choice: मार डाला
  rationale: מות के हिफ़ईल रूप का आशय मृत्यु का कारण बनना है। इस हिंसक राजहत्या के प्रसंग में ‘मार डाला’ वर्तमान हिन्दी में स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: אֶת־הַמֶּלֶךְ
  choice: राजा को
  rationale: मूल पाठ व्यक्तिगत नाम दोहराने के बजाय पदवी ‘राजा’ का प्रयोग करता है; अनुवाद उसी को बनाए रखता है।
- source_word: בְּבֵיתוֹ
  choice: उसी के घर में
  rationale: प्रत्यययुक्त בֵּיתוֹ का शाब्दिक अर्थ ‘उसके घर में’ है। ‘उसी के’ स्वाभाविक हिन्दी में इस बात पर हल्का बल देता है कि हत्या राजा के अपने घर में हुई।
