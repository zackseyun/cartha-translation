source:
  edition: WLC
  text: יַ֗עַן אֲשֶׁ֨ר עָשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינַ֔/י וַ/יִּהְי֥וּ מַכְעִסִ֖ים אֹתִ֑/י מִן הַ/יּ֗וֹם אֲשֶׁ֨ר יָצְא֤וּ אֲבוֹתָ/ם֙ מִ/מִּצְרַ֔יִם וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
translation:
  language: hi
  text: क्योंकि उन्होंने मेरी दृष्टि में बुरा किया है, और जिस दिन उनके पुरखे[a] मिस्र से निकले थे, उस दिन से लेकर आज तक वे मुझे क्रोधित करते आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘उनके पिता।’ इब्रानी का यह पुरुषवाची पारिवारिक शब्द यहाँ पिछली पीढ़ियों के पूर्वजों के लिए प्रयुक्त है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद पिछले पद में घोषित दण्ड का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट कारणसूचक है।
- source_word: עָשׂוּ אֶת־הָרַע בְּעֵינַי
  choice: उन्होंने वह किया है जो मेरी दृष्टि में बुरा है
  rationale: इब्रानी मुहावरे का मूल्यांकनात्मक अर्थ और ‘मेरी दृष्टि में’ का रूपक दोनों सुरक्षित रहते हैं। पूर्ण क्रिया को वर्तमान से जुड़े हुए पिछले आचरण के रूप में व्यक्त किया गया है।
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  choice: वे मुझे क्रोध दिलाते आए हैं
  rationale: היה और कृदन्त का संयोग निरन्तर अथवा बार-बार होते आचरण को दर्शाता है; ‘क्रोध दिलाते आए हैं’ उसका कालगत विस्तार तथा ईश्वरीय रोष का कारण बनना स्पष्ट करता है।
- source_word: מִן־הַיּוֹם אֲשֶׁר
  choice: जिस दिन ... उस दिन से
  rationale: यह लगातार चले आ रहे आचरण का आरम्भ-बिन्दु बताता है और हिन्दी में स्वाभाविक काल-संरचना है।
- source_word: יָצְאוּ אֲבוֹתָם מִמִּצְרַיִם
  choice: उनके पुरखे मिस्र से निकले थे
  rationale: ‘निकले’ निर्गमन की मानक क्रिया को सीधे व्यक्त करता है। אבותם का यहाँ आशय इस्राएल की पिछली पीढ़ियों से है; ‘पुरखे’ आधुनिक हिन्दी में पुरुषवाची पारिवारिक अभिव्यक्ति रखते हुए ‘पिता’ की सम्भावित निकट-पितृ अर्थगत गलतफहमी से बचाता है।
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह प्रचलित हिन्दी अभिव्यक्ति इब्रानी के निरन्तर कालगत बल को संक्षेप में सुरक्षित रखती है।
theological_decisions:
- issue: निर्गमन-काल से इस्राएल के अपराध की सामूहिक ऐतिहासिक निरन्तरता
  choice: ‘जिस दिन उनके पुरखे मिस्र से निकले थे उस दिन से लेकर आज तक’ द्वारा पूरे ऐतिहासिक विस्तार को बनाए रखा गया है।
  alternative: इसे केवल हाल के राजाओं के पापों का आलंकारिक सार मानना।
  rationale: पद स्वयं उकसाने वाले आचरण को निर्गमन से वर्तमान तक ले जाता है; अनुवाद इस सामूहिक-वाचा संबंधी तनाव को न तो नरम करता है, न अतिरिक्त सिद्धान्त जोड़कर समझाता है।
- issue: אֲבוֹתָם का व्यापक पारिवारिक सन्दर्भ
  choice: उनके पुरखे
  alternative: उनके पिता; उनके पूर्वज
  rationale: इब्रानी शब्द पुरुषवाची बहुवचन है, पर यहाँ अनेक पिछली पीढ़ियों का बोध कराता है। ‘पुरखे’ पुरुषवाची ऐतिहासिक-संबंध को बनाए रखते हुए आधुनिक हिन्दी में अपेक्षित व्यापक अर्थ देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी दृष्टि में बुरा’ इब्रानी रूपक को बनाए रखता है, जबकि ‘मुझे क्रोध दिलाते आए हैं’ दीर्घकालिक और बार-बार किए गए उकसावे को स्वाभाविक हिन्दी में व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
