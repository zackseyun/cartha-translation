  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
translation:
  language: hi
  text: और मैं अपनी विरासत में से बचे हुओं को त्याग दूँगा[a] और उन्हें उनके शत्रुओं के हाथ में सौंप दूँगा; तब वे अपने सब शत्रुओं के लिए लूट और लूटे जाने की वस्तु बन जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छोड़ दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  choice: और मैं ... त्याग दूँगा
  rationale: נטשׁ का अर्थ छोड़ देना या त्याग देना है। ‘त्याग दूँगा’ न्याय और संबंध-विच्छेद की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁאֵרִית נַחֲלָתִי
  choice: अपनी विरासत के बचे हुओं को
  rationale: שְׁאֵרִית यहाँ न्याय के बाद बचे लोगों को सूचित करता है, जबकि נַחֲלָתִי परमेश्वर के अपने भाग अथवा अधिकार में आए लोगों की वाचा-संबंधी भाषा बनाए रखता है। ‘बचे हुओं’ से जनसमूह का संदर्भ स्पष्ट रहता है।
- source_word: וּנְתַתִּים בְּיַד אֹיְבֵיהֶם
  choice: और उन्हें उनके शत्रुओं के हाथ में सौंप दूँगा
  rationale: शाब्दिक ‘दे दूँगा’ के स्थान पर ‘सौंप दूँगा’ נתן के प्रसंगगत अर्थ को स्पष्ट करता है; ‘हाथ में’ अधिकार और नियंत्रण की इब्रानी उपमा को बनाए रखता है।
- source_word: וְהָיוּ לְבַז וְלִמְשִׁסָּה
  choice: तब वे ... लूट और छीना हुआ माल बन जाएँगे
  rationale: היה का परिणामसूचक भाव ‘बन जाएँगे’ से व्यक्त होता है। בז और משסה के निकटार्थी युग्म को ‘लूट’ और ‘छीना हुआ माल’ के रूप में अलग रखते हुए इब्रानी की बलाघाती पुनरुक्ति बचाई गई है।
- source_word: לְכָל אֹיְבֵיהֶם
  choice: अपने सब शत्रुओं के लिए
  rationale: लामेद यहाँ उस संबंध को दिखाता है जिसमें वे सभी शत्रुओं के लिए लूट का साधन या वस्तु बनते हैं; यह रूप हिन्दी में सहज है और व्यापकता को बनाए रखता है।
theological_decisions:
- issue: ‘मेरी विरासत’ की वाचा-संबंधी बारीकी
  choice: ‘अपनी विरासत’ रखकर उसे परमेश्वर से संबंधित बचे हुए लोगों के रूप में प्रस्तुत करना
  alternative: ‘अपनी संपत्ति’ या ‘अपने निज भाग’
  rationale: נחלה में विरासत, आवंटित भाग और अधिकार की परतें हैं। ‘विरासत’ इस संबंध को बनाए रखती है, जबकि अनुवाद यह तय नहीं करता कि यहाँ भूमि और लोग दोनों अभिप्रेत हैं या मुख्यतः लोग; बहुवचन कर्म-सर्वनाम से इस पद में लोगों का संदर्भ प्रमुख है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘शत्रुओं के हाथ में’ मूल उपमा को बनाए रखता है; ‘सौंप दूँगा’ उसका आशय सहज बनाता है। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
