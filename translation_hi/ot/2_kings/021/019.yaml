base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: hi
  text: आमोन जब राजा बना, तब वह बाईस वर्ष का था, और उसने यरूशलेम में दो वर्ष राज्य किया। उसकी माता का नाम मशुल्लेमेत था। वह योटबा के हारूस की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: वह बाईस वर्ष का था
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; आधुनिक हिन्दी में स्वाभाविक रूप से आयु व्यक्त की गई है।
- source_word: בְּמָלְכוֹ
  choice: जब राजा बना
  rationale: בְּ के साथ infinitive construct राज्यारोहण का समय बताता है; यह हिन्दी में संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ राजकीय शासन करना है, केवल राजा की उपाधि धारण करना नहीं।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग का सामान्य हिन्दी अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: वंशावली-सूचना को गरिमापूर्ण और स्वाभाविक हिन्दी शब्दक्रम में रखा गया है।
- source_word: מְשֻׁלֶּמֶת
  choice: मशुल्लेमेत
  rationale: इब्रानी व्यंजन-रूप के निकट रहते हुए नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בַּת חָרוּץ
  choice: हारूस की बेटी
  rationale: इब्रानी वंश-संबंध को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: מִן יָטְבָה
  choice: योटबा के
  rationale: מִן मूल या निवास-स्थान बताता है; वाक्य-विभाजन के कारण हिन्दी में ‘योटबा के हारूस’ प्राकृतिक ढंग से वही संबंध व्यक्त करता है।
