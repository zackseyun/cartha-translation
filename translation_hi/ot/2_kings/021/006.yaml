  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
translation:
  language: hi
  text: उसने अपने बेटे को आग में से गुज़ारा[a], भविष्य-कथन किया और शकुनों का अर्थ लगाया[b], तथा ओझाओं और प्रेत-साधकों से संबंध रखा[c]। उसने याहवे की दृष्टि में बहुत बुराई की और उसे क्रोधित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप में, “उसने अपने बेटे की आग में बलि चढ़ाई।” हिब्रू मुहावरे का शाब्दिक अर्थ है, “अपने बेटे को आग में से गुज़ारा।”
    reason: alternative_reading
  - marker: b
    text: “शकुनों का अर्थ लगाया” का अनुवाद “लक्षणों से भविष्य जाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “ओझाओं और प्रेत-साधकों से परामर्श लिया।” हिब्रू मुहावरा कठिन है और ऐसे साधकों के साथ अधिक व्यापक संलग्नता का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת־בְּנוֹ בָּאֵשׁ
  choice: उसने अपने बेटे को आग में से पार कराया
  rationale: हिब्रू के कारणवाचक मुहावरे को मुख्य पाठ में बनाए रखता है; यह बाल-बलि की ओर संकेत करता है, पर अनुष्ठान की ठीक क्रिया को पाठ से अधिक स्पष्ट नहीं बनाता।
- source_word: וְעוֹנֵן
  choice: शकुन-विचार किया
  rationale: निषिद्ध गूढ़ भविष्य-कथन का बोध कराता है और अगले, संबंधित किंतु भिन्न, क्रियापद से अंतर बनाए रखता है।
- source_word: וְנִחֵשׁ
  choice: लक्षणों से भविष्य जाना
  rationale: נחשׁ का आशय प्रायः संकेतों या शकुनों के आधार पर भविष्य जानना है; यह सहज हिन्दी में उस विशिष्ट अर्थ को व्यक्त करता है।
- source_word: וְעָשָׂה אוֹב וְיִדְּעֹנִים
  choice: ओझाओं और प्रेत-साधकों से व्यवहार रखा
  rationale: कठिन हिब्रू मुहावरे की व्यापकता को सुरक्षित रखता है और केवल ‘परामर्श लिया’ या ‘नियुक्त किया’ जैसा संकीर्ण अर्थ नहीं थोपता।
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  choice: बहुत बुराई की
  rationale: रבה के प्रचुरता/तीव्रता वाले भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: हिब्रू मूल्यांकन-सूचक मुहावरे को स्वाभाविक हिन्दी में रखता है और परियोजना-नीति के अनुसार दिव्य नाम को ‘याहवे’ लिखता है।
- source_word: לְהַכְעִיס
  choice: उसे क्रोध दिलाया
  rationale: कारणवाचक अर्थ तथा याहवे की ओर संकेत करने वाले कर्म को स्पष्ट और संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बाल-बलि वाले मुहावरे की स्पष्टता
  choice: मुख्य पाठ में ‘अपने बेटे को आग में से पार कराया’
  alternative: ‘अपने बेटे को आग में बलि चढ़ाया’ अथवा ‘आग में जला दिया’
  rationale: संदर्भ बाल-बलि की ओर प्रबल संकेत करता है, फिर भी मूल हिब्रू क्रिया मुहावरेदार है। मुख्य पाठ मूल अभिव्यक्ति को सुरक्षित रखता है और संभावित स्पष्ट अर्थ पादटिप्पणी में देता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; परियोजना की विवादित-पद नीति के अनुसार उसका लिप्यंतरण ‘याहवे’ किया गया है।
- issue: אוֹב וְיִדְּעֹנִים के साथ क्रिया का संबंध
  choice: 'व्यापक सहभागिता: ‘से व्यवहार रखा’'
  alternative: ‘से परामर्श लिया’
  rationale: עשה के साथ बना वाक्यांश कठिन है और ऐसे साधकों के साथ व्यापक संलग्नता या उपयोग का संकेत दे सकता है; केवल परामर्श तक अर्थ सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘शकुन-विचार’, ‘ओझा’ और ‘प्रेत-साधक’ सांस्कृतिक रूप से बोधगम्य शब्द हैं। वाक्य-रचना को स्वाभाविक रखने के लिए הִרְבָּה לַעֲשׂוֹת को ‘बहुत बुराई की’ कहा गया है, जबकि उसकी तीव्रता सुरक्षित है।
