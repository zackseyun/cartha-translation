base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/003.yaml
  text: And he rebuilt the high places that Hezekiah his father had destroyed, and he erected altars to Baal, and made an Asherah, as Ahab king of Israel had done, and he bowed down to all the host of heaven and served them.
translation:
  language: hi
  text: उसने उन ऊँचे स्थानों को फिर से बनाया जिन्हें उसके पिता हिजकिय्याह ने नष्ट कर दिया था। उसने बाल के लिए वेदियाँ खड़ी कीं और एक अशेरा बनाया, जैसा इस्राएल के राजा अहाब ने किया था। उसने आकाश की सारी सेना के आगे दण्डवत किया और उनकी उपासना की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थानों
  rationale: यह शब्द सामान्यतः ऊँचाई पर या अन्यत्र बने उपासना-स्थलों के लिए प्रयुक्त होता है; पारंपरिक और अर्थ-संगत पदबंध रखा गया है।
- source_word: מִזְבְּחֹת לַבַּעַל
  choice: बाल के लिए वेदियाँ
  rationale: ल־ संबंध को स्वाभाविक हिन्दी में उद्देश्य/समर्पण के रूप में व्यक्त किया गया है।
- source_word: אֲשֵׁרָה
  choice: एक अशेरा
  rationale: यहाँ मूर्तिपूजक धार्मिक वस्तु या प्रतीक का नाम है; इसे किसी सामान्य 'खम्भे' तक सीमित करके मूल की संभावित अस्पष्टता नहीं मिटाई गई।
- source_word: כָל־צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना
  rationale: मूल रूपक को सुरक्षित रखा गया है; संदर्भ में यह खगोलीय पिंडों या स्वर्गीय समुदाय का संकेत दे सकता है।
- source_word: וַיַּעֲבֹד אֹתָם
  choice: उनकी उपासना की
  rationale: धार्मिक संदर्भ में עבד का अर्थ सेवा/उपासना है; आधुनिक हिन्दी में अभिप्रेत अर्थ स्पष्ट किया गया है।
theological_decisions:
- issue: अशेरा की पहचान
  choice: नाम को लिप्यंतरित करके 'एक अशेरा' रखा गया
  alternative: अशेरा-खम्भा / देवी अशेरा की मूर्ति
  rationale: मूल संज्ञा स्वयं वस्तु और उससे संबद्ध देवी के बीच पूरा भेद स्पष्ट नहीं करती; किसी एक व्याख्या को अनिवार्य नहीं बनाया गया।
- issue: आकाश की सेना
  choice: मूल सामूहिक रूपक सुरक्षित रखा गया
  alternative: आकाश के सभी तारों / सभी खगोलीय पिंडों
  rationale: विशिष्ट पहचान तय करने से मूल की अर्थ-व्याप्ति संकुचित हो जाती।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लम्बे हिब्रू समन्वित वाक्य को पठनीय हिन्दी के तीन वाक्यों में बाँटा गया, जबकि घटनाक्रम और समानांतर क्रियाएँ सुरक्षित हैं।
