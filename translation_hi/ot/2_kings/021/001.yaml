translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण राजकीय विवरण। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी चिह्न शासन-वाक्यांश के बाद था, पर उसकी सामग्री नाम ‘हेप्सीबा’ से सम्बन्धित है; इसलिए चिह्न को उसी नाम के साथ रखा गया है।
