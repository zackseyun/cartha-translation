  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
translation:
  language: hi
  text: मनश्शे बारह वर्ष का था जब वह राजा बना, और उसने यरूशलेम में पचपन वर्ष राज्य किया। उसकी माता का नाम हेप्सीबा[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हेप्सीबा का अर्थ लगभग “मेरा आनन्द उसमें है” है।
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: बारह वर्ष का था
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक अर्थ यही है।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह पदबंध उसके शासन आरम्भ करने के समय को बताता है; यह अनुवाद हिन्दी में स्वाभाविक है और राजकीय सूत्र का अर्थ सुरक्षित रखता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: וַחֲמִשִּׁים וְחָמֵשׁ שָׁנָה
  choice: पचपन वर्ष
  rationale: इब्रानी के ‘पचास और पाँच’ को आधुनिक हिन्दी की मानक संख्या-रचना में व्यक्त किया गया है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: राजकीय सन्दर्भ में מלך का सटीक और प्रचलित हिन्दी समतुल्य ‘राज्य किया’ है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक ב और नगर के नाम का सीधा, स्वाभाविक अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: मूल सूचना-सूत्र को आधुनिक, गरिमापूर्ण हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: חֶפְצִי בָהּ
  choice: हेप्सीबा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है; उसके अर्थ को पाद-टिप्पणी में बताया गया है।
