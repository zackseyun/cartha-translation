  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּתְעֵ֤/ם מְנַשֶּׁה֙ לַ/עֲשׂ֣וֹת אֶת הָ/רָ֔ע מִן הַ֨/גּוֹיִ֔ם אֲשֶׁר֙ הִשְׁמִ֣יד יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
translation:
  language: hi
  text: पर उन्होंने नहीं सुना[a]। मनश्शे ने उन्हें इस तरह भटकाया कि वे उन जातियों से भी बढ़कर बुराई करें[b], जिन्हें याहवे ने इस्राएल के पुत्रों के सामने से नष्ट कर दिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने बात नहीं मानी।” इब्रानी क्रिया में सुनने और आज्ञा मानने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में तुलना “जातियों से” के द्वारा व्यक्त है; इसे “उन जातियों से अधिक बुराई करना” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात “इस्राएली” या “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: नहीं सुना
  rationale: שׁמע में सुनने के साथ बात मानने का भाव भी हो सकता है। ‘नहीं सुना’ मूल क्रिया को बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत ‘बात नहीं मानी’ स्पष्ट करती है।
- source_word: וַיַּתְעֵם
  choice: उन्हें भटका दिया
  rationale: תעה के causative रूप में मनश्शे द्वारा लोगों को नैतिक और आत्मिक रूप से गलत राह पर ले जाने का सक्रिय भाव है।
- source_word: לַעֲשׂוֹת אֶת הָרָע מִן הַגּוֹיִם
  choice: उन जातियों से भी बढ़कर बुराई की
  rationale: מִן यहाँ तुलना व्यक्त करता है। यह हिंदी प्रयोग इस अर्थ को स्वाभाविक रूप से स्पष्ट करता है कि उनका बुरा आचरण उन जातियों के आचरण से बढ़कर था।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: ऐतिहासिक संदर्भ में यह उन अन्य राष्ट्रों अथवा लोगों के लिए है; ‘गैर-यहूदी’ जैसे बाद के धार्मिक अर्थ को यहाँ नहीं लाया गया।
- source_word: הִשְׁמִיד
  choice: नष्ट कर दिया था
  rationale: क्रिया प्रबल विनाश को व्यक्त करती है, और ‘था’ मनश्शे के समय से पहले हुई घटना को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: विजय के इस संदर्भ में मुहावरा इस्राएल के सामने से उन जातियों को हटा देने अथवा नष्ट कर देने का अर्थ देता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल इब्रानी अभिव्यक्ति का निकट रूप है और वाचा-समुदाय के लिए प्रयुक्त सामूहिक पद को सुरक्षित रखता है।
theological_decisions:
- issue: यहोवा के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक, लिंगयुक्त रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल की शाब्दिक पुरुषवाची अभिव्यक्ति को बनाए रखता है; पादटिप्पणी उसका स्वाभाविक सामूहिक अर्थ बताती है।
- issue: तुलना का संबंध
  choice: उन्होंने उन जातियों से भी बढ़कर बुराई की
  alternative: उन्होंने बुराई की—उन जातियों से बढ़कर
  rationale: इब्रानी מִן तुलना को चिह्नित करता है, पर उसकी संक्षिप्त रचना हिंदी में दो प्रकार से जोड़ी जा सकती है। मुख्य पाठ तुलना को लोगों के बुरे आचरण से स्पष्ट रूप से जोड़ता है, बिना बुराई की प्रकृति के बारे में अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’ और ‘जिससे’ वाक्य के विरोध तथा परिणाम को स्पष्ट करते हैं। ‘इस्राएल के पुत्रों’ मूल रूप को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक स्वाभाविक हिंदी विकल्प देती है।
