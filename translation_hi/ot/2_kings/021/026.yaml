  text: उसे उज्जा के बाग में उसकी कब्र[b] में दफ़नाया गया[a], और उसका पुत्र योशियाह उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और उसने उसे दफ़नाया।” संदर्भ में कर्ता स्पष्ट नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी समाधि” अथवा “उसका दफ़न-स्थान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבֹּר
  choice: उन्होंने ... दफ़नाया
  rationale: क्रिया रूपतः तीसरे पुरुष एकवचन है, पर कर्ता का नाम नहीं दिया गया। इस प्रसंग में हिन्दी का आदरसूचक/अनिश्चित बहुवचन स्वाभाविक रूप से अज्ञात सामूहिक कर्ताओं को व्यक्त करता है।
- source_word: קְבֻרָתוֹ
  choice: उसकी कब्र
  rationale: यह संज्ञा दफ़नाने की जगह को बताती है। आधुनिक हिन्दी में ‘कब्र’ संक्षिप्त और सहज है; इसका अर्थ ‘समाधि’ या ‘दफ़नाने की जगह’ भी हो सकता है।
- source_word: גַן עֻזָּא
  choice: उज्जा के बाग
  rationale: इब्रानी रचना के संबंधवाचक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: राजकीय उत्तराधिकार के इस सूत्र में क्रिया शासन की पूरी अवधि से अधिक राजपद ग्रहण करने को सूचित करती है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह मुहावरा प्रतिस्थापन और राजकीय उत्तराधिकार दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
