  edition: WLC
  text: וַ/יַּעֲזֹ֕ב אֶת יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑י/ו וְ/לֹ֥א הָלַ֖ךְ בְּ/דֶ֥רֶךְ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
translation:
  language: hi
  text: उसने अपने पूर्वजों के परमेश्वर याहवे को त्याग दिया और याहवे के मार्ग पर नहीं चला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזֹב
  choice: त्याग दिया
  rationale: עזב का अर्थ छोड़ना या त्याग देना है। यहाँ ‘त्याग दिया’ संबंध और वाचा के प्रति उसकी बेवफाई को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: अपने पूर्वजों के परमेश्वर
  rationale: शाब्दिक अर्थ ‘उसके पितरों का परमेश्वर’ है। आधुनिक हिन्दी में ‘अपने पूर्वजों के परमेश्वर’ स्वाभाविक है और वंशगत-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: וְלֹא הָלַךְ
  choice: और वह ... नहीं चला
  rationale: הלך के ‘चलने’ वाले बाइबलीय रूपक को बनाए रखा गया है; हिन्दी में ‘मार्ग पर चलना’ जीवन-आचरण के लिए सहज और स्पष्ट मुहावरा है।
- source_word: בְּדֶרֶךְ יְהוָה
  choice: यहोवा के मार्ग पर
  rationale: דרך यहाँ जीवन और आचरण के मार्ग का रूपक है। हिन्दी में ‘मार्ग पर चलना’ स्रोत के रूपक और आशय दोनों को स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ का प्रयोग किया गया है; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: אֲבֹתָיו में वंशगत भाषा
  choice: अपने पूर्वजों
  alternative: अपने पितरों
  rationale: बहुवचन אבות संदर्भ में पिछली पीढ़ियों/पूर्वजों को सूचित करता है। ‘पूर्वजों’ आधुनिक मानक हिन्दी में अर्थ को स्पष्ट करता है, जबकि ‘पितरों’ अधिक शाब्दिक किंतु अपेक्षाकृत संस्कारगत या पुरातन लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘त्याग दिया’ और ‘मार्ग पर नहीं चला’ स्रोत की वाचागत गंभीरता तथा चलने के रूपक को सुरक्षित रखते हैं।
