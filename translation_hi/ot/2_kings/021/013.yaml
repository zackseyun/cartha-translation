base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
translation:
  language: hi
  text: और मैं यरूशलेम पर सामरिया की मापने की डोरी और अहाब के घराने का साहुल लगाऊँगा[a]; और मैं यरूशलेम को ऐसे पोंछ दूँगा, जैसे कोई थाली[b] को पोंछता है, उसे पोंछकर उलटा कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मापने की डोरी’ का अनुवाद ‘राजगीर की डोरी’ और ‘साहुल’ का ‘लंबक’ भी किया जा सकता है। यह मापने के उपकरणों का रूपक है।
    reason: lexical_alternative
  - marker: b
    text: ‘थाली’ के स्थान पर ‘कटोरा’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטִיתִי
  choice: और मैं ... तानूँगा
  rationale: נטה का मूल अर्थ फैलाना या तानना है। मापने की डोरी के साथ ‘तानूँगा’ ठोस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קָו
  choice: मापने की डोरी
  rationale: यह नापने या निर्माण में प्रयुक्त रेखा/डोरी को दर्शाता है। ‘मापने की डोरी’ आधुनिक पाठक के लिए उपकरण और न्याय के रूपक दोनों को स्पष्ट करती है।
- source_word: מִשְׁקֹלֶת
  choice: साहुल
  rationale: यह भारयुक्त लंबवत नापने वाले उपकरण का सूचक है। ‘साहुल’ इसका सटीक और प्रचलित हिन्दी तकनीकी शब्द है।
- source_word: בֵּית אַחְאָב
  choice: अहाब का घराना
  rationale: בית यहाँ भवन नहीं, अहाब के राजवंश या वंशगत घराने को दर्शाता है; ‘घराना’ हिन्दी में इस आशय को साफ करता है।
- source_word: וּמָחִיתִי
  choice: और मैं ... पोंछ दूँगा
  rationale: आगे थाली पोंछने की उपमा इसी क्रिया को नियंत्रित करती है। ‘पोंछ दूँगा’ ठोस चित्र और पूर्ण विनाश का भाव दोनों सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת
  choice: जैसे कोई थाली को पोंछता है
  rationale: इब्रानी में कर्ता अनिश्चित सामान्य पुरुष है। ‘कोई’ उसे अनावश्यक रूप से विशिष्ट किए बिना स्वाभाविक हिन्दी देता है; צלחת के लिए ‘थाली’ उपयुक्त सामान्य वस्तु है।
- source_word: מָחָה
  choice: उसे पोंछकर
  rationale: क्रिया की पुनरावृत्ति पोंछने के कार्य पर बल देती है। ‘पोंछकर’ पुनरावृत्ति और अगले परिणाम के क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהָפַךְ עַל פָּנֶיהָ
  choice: उलटा रख देता है
  rationale: शाब्दिक भाव ‘उसके मुँह पर पलट देना’ है। थाली के संदर्भ में ‘उलटा रख देना’ वही दृश्य स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का मानक हिन्दी रूप।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: सामरिया और अहाब के घराने से लिए गए माप के रूपक का स्वरूप
  choice: यरूशलेम पर वही न्याय-माप लागू किया जाएगा जो सामरिया और अहाब के घराने पर किया गया था।
  alternative: अन्य संदर्भों में मापने की डोरी और साहुल पुनर्निर्माण या बहाली के साधन हो सकते हैं।
  rationale: यहाँ निकटवर्ती प्रसंग दंड का है और थाली को पोंछकर उलटा रखने की उपमा विनाशकारी अर्थ को स्पष्ट करती है; फिर भी अनुवाद रूपक को बनाए रखता है, उसकी हर निहित व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। निर्माण-संबंधी मूल रूपक के लिए ‘मापने की डोरी’ और ‘साहुल’ तथा घरेलू उपमा के लिए ‘थाली’ चुना गया है। मुख्य पाठ में [a] और [b] दोनों पादटिप्पणी-चिह्न उपस्थित हैं।
