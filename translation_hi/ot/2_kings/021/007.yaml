  text: וַ/יָּ֕שֶׂם אֶת פֶּ֥סֶל הָ/אֲשֵׁרָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה בַּ/בַּ֗יִת אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ אֶל דָּוִד֙ וְ/אֶל שְׁלֹמֹ֣ה בְנ֔/וֹ בַּ/בַּ֨יִת הַ/זֶּ֜ה וּ/בִ/ירוּשָׁלִַ֗ם אֲשֶׁ֤ר בָּחַ֨רְתִּי֙ מִ/כֹּל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל אָשִׂ֥ים אֶת שְׁמִ֖/י לְ/עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
translation:
  language: hi
  text: उसने अशेरा की वह तराशी हुई मूर्ति, जिसे उसने बनाया था, उस भवन में स्थापित कर दी, जिसके विषय में यहोवा ने दाऊद और उसके पुत्र सुलैमान से कहा था, “इस भवन में और यरूशलेम में, जिसे मैंने इस्राएल के सभी गोत्रों में से चुना है, मैं अपना नाम सदा के लिए रखूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: स्थापित कर दी
  rationale: שׂוּם यहाँ किसी वस्तु को पवित्र स्थान में रखने या खड़ा करने की पूर्ण भूतकालीन क्रिया बताता है; ‘स्थापित कर दी’ हिन्दी में स्वाभाविक है और विधि के बारे में अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: פֶּסֶל הָאֲשֵׁרָה
  choice: अशेरा की ... खुदी हुई मूर्ति
  rationale: פֶּסֶל तराशकर बनाई गई प्रतिमा को सूचित करता है और הָאֲשֵׁרָה उसका अशेरा से संबंध बताता है। यह ‘अशेरा-खंभा’ से अधिक सटीक है, क्योंकि पद में स्पष्टतः खुदी हुई प्रतिमा का उल्लेख है।
- source_word: אֲשֶׁר עָשָׂה
  choice: जिसे उसने बनवाया था
  rationale: राजा द्वारा उपासना-वस्तु तैयार कराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और यह दिखाता है कि उसका बनाया जाना भवन में रखे जाने से पहले हुआ।
- source_word: בַּבַּיִת
  choice: उस भवन में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ सन्दर्भ मन्दिर का है, पर ‘भवन’ आगे की पुनरावृत्ति और परमेश्वर के चुने हुए भवन की धार्मिक भाषा को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: בַּבַּיִת הַזֶּה וּבִירוּשָׁלִַם
  choice: इस भवन में और यरूशलेम में
  rationale: दोनों स्थानों को जोड़ने वाले पूर्वसर्ग और समुच्चय को स्पष्ट रखते हुए मूल की समानान्तर संरचना सुरक्षित की गई है।
- source_word: אֲשֶׁר בָּחַרְתִּי מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: जिसे मैंने इस्राएल के सभी गोत्रों में से चुना है
  rationale: पूर्ण क्रिया के वर्तमान प्रासंगिक परिणाम और מן के चयनात्मक अर्थ—समूह में से चुनना—दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: אָשִׂים אֶת שְׁמִי לְעוֹלָם
  choice: मैं अपना नाम सदा के लिए स्थापित करूँगा
  rationale: ‘नाम रखना’ की मन्दिर-वाचा संबंधी अभिव्यक्ति को हिन्दी में अर्थपूर्ण बनाने के लिए ‘नाम स्थापित करना’ चुना गया है; ‘सदा के लिए’ לְעוֹלָם की कालगत शक्ति बनाए रखता है।
theological_decisions:
- issue: अशेरा से जुड़ी उपासना-वस्तु का स्वरूप
  choice: अशेरा की खुदी हुई मूर्ति
  alternative: अशेरा-खंभा
  rationale: इब्रानी में פֶּסֶל, ‘खुदी हुई मूर्ति’, स्पष्ट रूप से उपस्थित है। इसलिए केवल ‘अशेरा-खंभा’ कहना वस्तु के स्वरूप को मूल से अधिक संकीर्ण कर देगा।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम है; उसका लिप्यंतरण करना नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: भवन में परमेश्वर का नाम स्थापित करने की भाषा
  choice: मैं अपना नाम ... स्थापित करूँगा
  alternative: मैं वहाँ सदा वास करूँगा
  rationale: मूल ‘नाम’ की भाषा का प्रयोग करता है। इसे सीधे परमेश्वर के वास के कथन में बदलना निहितार्थ को व्याख्या बनाकर धार्मिक तनाव को कम कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली रखी गई है। ‘मन्दिर’ के बजाय ‘भवन’ मूल בַּיִת की पुनरावृत्ति को बचाता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
