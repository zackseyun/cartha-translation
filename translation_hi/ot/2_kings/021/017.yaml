source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י מְנַשֶּׁה֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וְ/חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/017.yaml
  text: The rest of the acts of Manasseh, and all that he did, and his sin that he committed—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: मनश्शे के शेष काम, उसने जो कुछ किया, और उसका वह पाप जो उसने किया—क्या ये सब यहूदा के राजाओं के इतिहास की पुस्तक[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के राजाओं के वार्षिक वृत्तांत की पुस्तक।’ इब्रानी अभिव्यक्ति एक राजकीय अभिलेख-स्रोत की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַשֶּׁה
  choice: मनश्शे के शेष काम
  rationale: राजकीय सारांशों में דִּבְרֵי का आशय केवल कथनों से नहीं, राजा के कामों या कार्यों से है। ‘शेष काम’ इस प्रचलित सूत्र को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: यह सम्बन्धवाचक उपवाक्य का सीधा और स्वाभाविक हिन्दी रूप है तथा मूल के व्यापक अर्थ को बनाए रखता है।
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  choice: और उसका वह पाप जो उसने किया
  rationale: חַטָּאתוֹ के स्वत्ववाचक भाव ‘उसका पाप’ और חָטָא की क्रियात्मक पुनरुक्ति दोनों को रखा गया है; इससे मूल की नैतिक-धार्मिक गंभीरता भी बनी रहती है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... नहीं लिखे हैं?
  rationale: नकारात्मक आलंकारिक प्रश्न को कथन में बदले बिना रखा गया है। ‘ये सब’ पूर्ववर्ती अनेक बातों की ओर स्पष्ट संकेत करता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: עַל का अक्षरशः अर्थ ‘पर’ हो सकता है, पर लिखित अभिलेख के लिए हिन्दी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक
  rationale: דִּבְרֵי הַיָּמִים यहाँ राजकीय अभिलेख या वार्षिक वृत्तांत का शीर्षक-सदृश पद है। ‘इतिहास की पुस्तक’ सामान्य पाठक के लिए स्पष्ट है और इसे अनिवार्य रूप से बाइबल की ‘इतिहास’ नामक पुस्तक के साथ एक नहीं मानता।
