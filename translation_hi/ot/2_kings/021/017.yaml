  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। मूल का आलंकारिक प्रश्न और पाप-संबंधी पुनरुक्ति सुरक्षित रखी गई है।
