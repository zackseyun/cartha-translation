language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה בְּ/יַד עֲבָדָ֥י/ו הַ/נְּבִיאִ֖ים לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/010.yaml
  text: And Yahweh spoke by the hand of his servants the prophets[a], saying,
translation:
  language: hi
  text: 'और याहवे ने अपने सेवक नबियों के द्वारा[a] कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने सेवक नबियों के हाथ से”; यह इब्रानी मुहावरा “के द्वारा” या “के माध्यम से” के अर्थ में है।
    reason: मूल इब्रानी मुहावरे की शाब्दिक बनावट और उसके अभिप्राय दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: और … कहा
  rationale: पिएल क्रिया דִּבֵּר का अर्थ यहाँ ‘बोलना’ है। हिन्दी में अगले לֵאמֹר के साथ स्वाभाविक कथन-सूत्र बनाने के लिए इसे ‘कहा’ के रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּיַד
  choice: के द्वारा[a]
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर यह इब्रानी मुहावरा माध्यम अथवा प्रतिनिधि के द्वारा बोलने को दर्शाता है; आधुनिक हिन्दी में ‘के द्वारा’ इसका स्पष्ट और स्वाभाविक अनुवाद है।
- source_word: עֲבָדָיו
  choice: अपने सेवक
  rationale: नबियों के परमेश्वर की सेवा में नियुक्त होने के संदर्भ में עבד के लिए ‘सेवक’ उपयुक्त है; ‘दास’ यहाँ अनावश्यक रूप से बंधुआ स्थिति पर बल देता।
- source_word: הַנְּבִיאִים
  choice: नबियों
  rationale: निश्चित बहुवचन संज्ञा नबियों को उन सेवकों के रूप में पहचानती है जिनके द्वारा याहवे ने कहा।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा:’ इस कथन-सूत्र को स्वाभाविक रूप से व्यक्त करता है, बिना ‘कहते हुए कहा’ जैसी कृत्रिम पुनरुक्ति के।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपने सेवक नबियों’ स्वाभाविक हिन्दी में עֲבָדָיו הַנְּבִיאִים की समानाधिकरणीय संरचना को व्यक्त करता है। पद के अंत का विसर्ग आगे आने वाले ईश्वरीय कथन का संकेत देता है।
