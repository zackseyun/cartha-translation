source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुरा किया, उन जातियों की घिनौनी प्रथाओं के अनुसार जिन्हें याहवे ने इस्राएल के पुत्रों के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने ... बुरा किया
  rationale: यह इब्रानी राजकीय मूल्यांकन-सूत्र का स्वाभाविक हिन्दी रूप है; आरम्भिक वाव को सहज कथात्मक हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह परमेश्वर के नैतिक मूल्यांकन को व्यक्त करने वाले इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: כְּתוֹעֲבֹת הַגּוֹיִם
  choice: उन जातियों के घिनौने कामों के अनुसार
  rationale: תועבות यहाँ केवल अमूर्त 'घृणित वस्तुओं' की नहीं, नैतिक और उपासना-संबंधी घिनौनी प्रथाओं की ओर संकेत करता है; 'कामों' से हिन्दी में आशय स्पष्ट रहता है और כְּ का अनुरूपता-बोध भी सुरक्षित है।
- source_word: הוֹרִישׁ
  choice: निकाल दिया था
  rationale: हिफ़ील रूप यहाँ लोगों को उनके अधिकार-क्षेत्र से बेदखल करके निकाल देने का अर्थ देता है; पूर्वकालिक हिन्दी क्रिया संदर्भगत समय-संबंध स्पष्ट करती है।
- source_word: מִפְּנֵי
  choice: के सामने से
  rationale: यह स्थानगत इब्रानी अभिव्यक्ति का निकट और हिन्दी में बोधगम्य रूप है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल की स्पष्ट पुत्र-संज्ञा को बनाए रखा गया है; यह पारंपरिक सामूहिक अभिव्यक्ति पूरे इस्राएली समुदाय को सूचित करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है; उपाधि 'प्रभु' मूल में उपस्थित नाम को ढक देती।
- issue: כְּתוֹעֲבֹת का आशय
  choice: घिनौने कामों के अनुसार
  alternative: घिनौनी वस्तुओं के समान
  rationale: संदर्भ जातियों की उन निंदित धार्मिक और नैतिक प्रथाओं का है जिनका मनश्शे ने अनुसरण किया; फिर भी 'कामों' शब्द उन प्रथाओं का प्रकार अनावश्यक रूप से सीमित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל की लैंगिक और सामूहिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल की पुत्र-संज्ञा को औपचारिक रूप से सुरक्षित रखा गया है, जबकि संदर्भ में यह सामूहिक नाम पूरे इस्राएल को दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। 'घिनौने काम' सामान्य पाठक के लिए स्पष्ट है और मूल की प्रबल नैतिक निंदा बनाए रखता है। वाक्य में 'और ... के अनुसार चला' जोड़ा गया है ताकि हिन्दी में यह स्पष्ट हो कि उसने जातियों की प्रथाओं का अनुकरण किया; यह כְּ की अनुरूपता को स्वाभाविक ढंग से व्यक्त करता है।
