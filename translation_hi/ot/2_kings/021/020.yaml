  yaml_path: translation/ot/2_kings/021/020.yaml
  text: He did what was evil in the sight of Yahweh[a], just as Manasseh his father had done.
translation:
  language: hi
  text: उसने वह किया जो यहोवा की दृष्टि में बुरा था, ठीक वैसे ही जैसे उसके पिता मनश्शे ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: हिब्रू मुहावरे ‘बुरा करना’ को स्वाभाविक हिन्दी में व्यक्त करता है और הָרַע के निश्चित रूप का भाव भी बनाए रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: हिब्रू के मूल्यांकन-सूचक मुहावरे ‘यहोवा की आँखों में’ का अर्थ और दृष्टि-रूपक स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: पुत्र के आचरण और उसके पिता के आचरण के बीच स्पष्ट तुलना व्यक्त करता है।
- source_word: עָשָׂה מְנַשֶּׁה אָבִיו
  choice: उसके पिता मनश्शे ने किया था
  rationale: हिन्दी का ‘किया था’ पिता के पहले के आचरण को स्वाभाविक ढंग से दर्शाता है; नाम और संबंध मूल के अनुरूप हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी के परिचित लिप्यंतरण में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘की दृष्टि में’ मूल मुहावरे के अर्थ और रूपक दोनों को सहज हिन्दी में रखता है।
