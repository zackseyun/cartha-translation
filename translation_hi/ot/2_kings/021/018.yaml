base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
translation:
  language: hi
  text: और मनश्शे अपने पुरखाओं के साथ सो गया[a] और अपने भवन के बगीचे में, अर्थात् उज्जा के बगीचे में, दफ़नाया गया। और उसका पुत्र आमोन उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसकी मृत्यु हो गई। यह राजाओं की मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: राजाओं की मृत्यु के लिए प्रयुक्त पारंपरिक इब्रानी मुहावरे को बनाए रखता है; प्रसंग मृत्यु का अर्थ स्पष्ट करता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: वंशगत संबंध और राजकीय मृत्यु-सूत्र दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקָּבֵר
  choice: दफ़नाया गया
  rationale: निफ़अल के कर्मवाच्य अर्थ का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: בְּגַן בֵּיתוֹ
  choice: अपने भवन के बगीचे में
  rationale: בית को अनावश्यक रूप से 'महल' विशेषीकृत किए बिना राजकीय निवास के प्रसंग में 'भवन' से व्यक्त किया गया है।
- source_word: בְּגַן עֻזָּא
  choice: अर्थात् उज्जा के बगीचे में
  rationale: दोहराए गए स्थान-वाचक पद को उसी बगीचे की पहचान बताने वाले समानाधिकरण के रूप में स्पष्ट करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूत्र में शासन करने की अवधि से अधिक राजपद ग्रहण करने का भाव व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: वंशगत उत्तराधिकार में पूर्ववर्ती राजा का स्थान लेने का सटीक और स्वाभाविक अर्थ देता है।
