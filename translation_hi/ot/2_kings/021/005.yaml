  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
translation:
  language: hi
  text: उसने यहोवा के भवन के दोनों आँगनों में आकाश की सारी सेना के लिए वेदियाँ बनाईं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी स्वर्गीय सेना।” इब्रानी मुहावरा “आकाश की सेना” आकाशीय समूह को दर्शाता है; इस प्रसंग में संभवतः उन आकाशीय पिंडों या शक्तियों का संकेत है जिनकी नक्षत्र-पूजा में आराधना की जाती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाईं
  rationale: בנה का क़ाल वय्यिक्तोल क्रमिक भूतकालीन कथन है। हिन्दी में अलग संयोजक के बिना स्वाभाविक कथात्मक शैली रखी गई है।
- source_word: מִזְבְּחוֹת
  choice: वेदियाँ
  rationale: बहुवचन संज्ञा का सामान्य और स्पष्ट हिन्दी धार्मिक शब्द।
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  choice: आकाश की सारी सेना के लिए
  rationale: शाब्दिक मुहावरे को सुरक्षित रखता है; प्रसंग में यह नक्षत्रीय उपासना से जुड़े आकाशीय पिंडों या शक्तियों की ओर संकेत कर सकता है, पर मुख्य पाठ में अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בִּשְׁתֵּי חַצְרוֹת
  choice: दोनों आँगनों में
  rationale: संख्या दो को स्पष्ट रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति; חצרות यहाँ मंदिर के आँगनों को दर्शाता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בית की मूल उपमा को 'भवन' से सुरक्षित रखा गया है और יְהוָה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। 'यहोवा' आधुनिक हिन्दी बाइबलीय पाठकों में पहचाना जाने वाला नाम-रूप है और इसे उपाधि 'प्रभु' में बदलने से बचाता है।
- issue: צְבָא הַשָּׁמָיִם की पहचान
  choice: आकाश की सारी सेना
  alternative: सारे आकाशीय पिंड; पूरी स्वर्गीय सेना
  rationale: मूल मुहावरे की वास्तविक व्यापकता और अस्पष्टता सुरक्षित रखी गई है। निकटवर्ती संदर्भ नक्षत्र-पूजा का संकेत देता है, फिर भी मुख्य पाठ इसे केवल तारों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। 'दोनों आँगनों' से इब्रानी में व्यक्त निश्चित संख्या सुरक्षित है; 'आकाश की सारी सेना' मूल धार्मिक मुहावरे को बिना समय से पहले व्याख्यायित किए बनाए रखता है।
