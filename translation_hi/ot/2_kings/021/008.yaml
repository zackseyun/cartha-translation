source:
  edition: WLC
  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
translation:
  language: hi
  text: और मैं इस्राएल के पाँव को उस भूमि से फिर भटकने नहीं दूँगा, जो मैंने उनके पुरखाओं को दी थी[a]—बशर्ते कि वे उन सब आज्ञाओं के अनुसार सावधानी से चलें, जिनका मैंने उन्हें आदेश दिया था, और उस सारी व्यवस्था[c] के अनुसार चलें, जिसका आदेश मेरे सेवक मूसा ने उन्हें दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के पाँव को ... भटकने देना” है। यह उस भूमि से इस्राएल को हटाने या विस्थापित करने का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: “व्यवस्था” का अनुवाद “शिक्षा” या “निर्देश” भी हो सकता है; यहाँ इसका संकेत मूसा के द्वारा दी गई तोराह की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹסִיף
  choice: फिर ... नहीं दूँगा
  rationale: לֹא के साथ יסף दोबारा वही कार्य न करने का भाव देता है; ‘फिर ... नहीं’ आधुनिक हिन्दी में इस मुहावरे का स्वाभाविक रूप है।
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  choice: इस्राएल के पाँव को ... भटकने
  rationale: एकवचन ‘पाँव’ और विस्थापन/भटकाव की ठोस इब्रानी छवि को बनाए रखा गया है; ‘देश से निकालना’ अर्थ को समय से पहले स्पष्ट कर देता।
- source_word: הָאֲדָמָה
  choice: भूमि
  rationale: यहाँ पूर्वजों को दी गई वाचा-संबंधी भौगोलिक भूमि अभिप्रेत है, केवल मिट्टी नहीं।
- source_word: לַאֲבוֹתָם
  choice: उनके पुरखाओं
  rationale: ‘पुरखे’ आधुनिक हिन्दी में इस्राएल के वाचा-संबंधी पूर्वजों का स्वाभाविक और सटीक संकेत है।
- source_word: רַק אִם
  choice: बशर्ते कि
  rationale: यह पदबंध वास्तविक और सीमित करने वाली शर्त प्रस्तुत करता है; ‘बशर्ते कि’ उस बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁמְרוּ לַעֲשׂוֹת
  choice: सावधानी से ... चलें
  rationale: שמר के सतर्कता/पालन के भाव और לעשות के कार्यान्वयन को हिन्दी के आज्ञापालन-संबंधी मुहावरे ‘सावधानी से ... के अनुसार चलना’ में रखा गया है।
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִם
  choice: उन सब बातों के अनुसार ... जिनकी मैंने उन्हें आज्ञा दी है
  rationale: כְּ का अनुरूपता-सूचक अर्थ और כֹל की समग्रता दोनों सुरक्षित हैं।
- source_word: וּלְכָל הַתּוֹרָה
  choice: और उस पूरी व्यवस्था के अनुसार
  rationale: मूसा-संबंधी वाचा के प्रसंग में תּוֹרָה के लिए ‘व्यवस्था’ प्रतिष्ठित और बोधगम्य है; पादटिप्पणी ‘शिक्षा/निर्देश’ की व्यापक वैकल्पिक छाया बताती है।
- source_word: עַבְדִּי מֹשֶׁה
  choice: मेरे सेवक मूसा
  rationale: यह सम्मानसूचक पद का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: भूमि में इस्राएल के बने रहने की शर्त
  choice: आज्ञापालन को इस्राएल के भूमि से न विस्थापित होने की वास्तविक शर्त के रूप में व्यक्त किया गया है।
  alternative: इसे केवल आलंकारिक कहना या प्रतिज्ञा की अन्य परंपराओं से सामंजस्य बैठाने के लिए शर्त को नरम करना।
  rationale: רַק אִם स्पष्ट रूप से प्रतिबंधात्मक शर्त रखता है। अनुवाद वाचा की प्रतिज्ञा और आज्ञापालन की शर्त के बीच तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी का एकवचन ‘पाँव’ तथा विस्थापन की छवि सुरक्षित है। मुख्य पाठ में सभी प्रयुक्त पादटिप्पणी-चिह्न उपस्थित हैं।
