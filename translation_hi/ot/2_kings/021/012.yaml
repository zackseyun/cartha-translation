  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
translation:
  language: hi
  text: 'इसलिए यहोवा, इस्राएल का परमेश्वर, यों कहता है: ‘देखो, मैं यरूशलेम और यहूदा पर ऐसी विपत्ति लाने वाला हूँ[a] कि जो कोई इसके बारे में सुनेगा, उसके दोनों कान झनझना उठेंगे[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपदा।” यहाँ इब्रानी शब्द नैतिक बुराई नहीं, बल्कि न्याय के रूप में आने वाली विपत्ति बताता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक इब्रानी मुहावरा: “उसके दोनों कान झनझना उठेंगे”; इसका भाव है कि समाचार सुनकर व्यक्ति भय और सदमे से भर जाएगा।'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग में बताए गए पापों के परिणामस्वरूप आने वाले न्याय को सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह नबूवत का मानक संदेशवाहक-सूत्र है और आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: הִנְנִי מֵבִיא
  choice: देखो, मैं ... लाने वाला हूँ
  rationale: הִנְנִי की ध्यानाकर्षक और बलात्मक शक्ति तथा कृदंत से व्यक्त निकटवर्ती कार्य—दोनों को प्रकट करता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस न्याय-संदर्भ में शब्द का अर्थ नैतिक बुराई नहीं, बल्कि दंडस्वरूप आने वाली घोर आपदा है।
- source_word: עַל יְרוּשָׁלַם וִיהוּדָה
  choice: यरूशलेम और यहूदा पर
  rationale: עַל का न्याय के इन स्थानों पर आ पड़ने का भाव हिन्दी में सीधे व्यक्त होता है।
- source_word: כָּל שֹׁמְעָיו
  choice: जो कोई इसके बारे में सुनेगा
  rationale: प्रत्यय आने वाली विपत्ति अथवा उसके समाचार की ओर संकेत करता है; हिन्दी में समाचार सुनने के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  choice: उसके दोनों कान झनझना उठेंगे
  rationale: मूल शारीरिक बिंब को बनाए रखते हुए भयावह समाचार से होने वाले सदमे का मुहावरेदार भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय न्याय के संदर्भ में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: पद नैतिक बुराई करने की नहीं, परमेश्वर द्वारा दंडस्वरूप विनाशकारी घटना लाने की बात करता है; इसलिए ‘विपत्ति’ प्रसंगगत अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, नबूवत के अनुरूप गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम के रूप में और ‘देखो’ मूल के बलात्मक ध्यानाकर्षण के लिए रखा गया है।
