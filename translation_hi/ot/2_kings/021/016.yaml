  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘खून बहाया’ सामान्य पाठकों के लिए ‘रक्त बहाया’ से अधिक स्वाभाविक है, जबकि संदर्भ की नैतिक गंभीरता बनी रहती है। विराम-चिह्न पाप की व्याख्या को स्पष्ट करते हैं और मूल की कारणवाचक संरचना सुरक्षित रखते हैं।
