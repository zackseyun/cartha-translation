  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
translation:
  language: hi
  text: इसके अलावा, मनश्शे ने निर्दोषों का बहुत अधिक खून बहाया, यहाँ तक कि उसने यरूशलेम को एक छोर से दूसरे छोर तक उससे भर दिया[a]। यह उस पाप के अतिरिक्त था, जिसके द्वारा उसने यहूदा को याहवे की दृष्टि में बुरा काम करने पर लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यरूशलेम को मुँह से मुँह तक भर दिया”; यह पूरे नगर में, एक छोर से दूसरे छोर तक, के अर्थ में प्रयुक्त मुहावरा है।
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और उसके संदर्भगत अर्थ को दर्ज करना।
