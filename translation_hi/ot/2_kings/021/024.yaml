id: 2KI.21.24
reference: 2 Kings 21:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּךְ֙ עַם הָ/אָ֔רֶץ אֵ֥ת כָּל הַ/קֹּשְׁרִ֖ים עַל הַ/מֶּ֣לֶךְ אָמ֑וֹן וַ/יַּמְלִ֧יכוּ עַם הָ/אָ֛רֶץ אֶת יֹאשִׁיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
translation:
  language: hi
  text: लेकिन देश के लोगों ने उन सभी को मार डाला जिन्होंने राजा आमोन के विरुद्ध षड्यंत्र किया था, और देश के लोगों ने उसके पुत्र योशिय्याह को उसके स्थान पर राजा बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: मार डाला
  rationale: इस प्रसंग में נכה का अर्थ घातक प्रहार करना है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक है और परिणाम को स्पष्ट करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: यह इब्रानी पद किसी सामाजिक-राजनीतिक समूह या देश की जनता को सूचित कर सकता है। ‘देश के लोग’ उसकी व्यापकता और पद की पुनरावृत्ति को बनाए रखता है।
- source_word: כָּל הַקֹּשְׁרִים
  choice: उन सभी को ... जिन्होंने ... षड्यंत्र किया था
  rationale: קשר का कृदन्त षड्यंत्र में सम्मिलित व्यक्तियों को दर्शाता है। उपवाक्य के रूप में अनुवाद हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: עַל הַמֶּלֶךְ אָמוֹן
  choice: राजा आमोन के विरुद्ध
  rationale: קשר के साथ עַל शत्रुतापूर्ण षड्यंत्र का लक्ष्य बताता है; ‘के विरुद्ध’ यही संबंध स्पष्ट करता है।
- source_word: וַיַּמְלִיכוּ
  choice: राजा बनाया
  rationale: מלך के हिफ़ील रूप का अर्थ किसी को राजा बनाना है। यह अनुवाद किसी अनुल्लिखित राज्याभिषेक-विधि को नहीं जोड़ता।
- source_word: יֹאשִׁיָּהוּ בְנוֹ
  choice: उसके पुत्र योशिय्याह को
  rationale: यह हिन्दी की स्वाभाविक शब्द-व्यवस्था में नाम और पुत्र-संबंध दोनों को स्पष्ट रखता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह राजकीय उत्तराधिकार में पूर्व राजा की जगह लेने का स्वाभाविक हिन्दी रूप है।
- source_word: וַ
  choice: लेकिन
  rationale: पूर्ववर्ती पद में आमोन के सेवकों द्वारा उसकी हत्या और यहाँ देश के लोगों की प्रतिकारात्मक कार्रवाई के बीच विरोध को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘देश के लोग’ को दोनों बार दोहराकर इब्रानी की पुनरावृत्ति और उस समूह की भूमिका पर बल सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि ‘षड्यंत्र करने वाले सभी लोग’ और ‘सभी षड्यंत्रकारी’ के बीच का अंतर केवल शैलीगत है, अर्थगत नहीं।
