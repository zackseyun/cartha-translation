  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
translation:
  language: hi
  text: तब उसने राजघराने का प्रभारी एल्याकीम[a], सचिव शेबना और याजकों के बुज़ुर्गों को—जो टाट पहने हुए थे[b]—अमोत्स के पुत्र भविष्यद्वक्ता यशायाह के पास भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात राजमहल या राजघराने की व्यवस्था का प्रभारी एक उच्च राजकीय अधिकारी।
    reason: cultural_note
  - marker: b
    text: या, ‘अपने को टाट से ढाँप रहे थे।’ इब्रानी कृदंत ढाँपने की क्रिया या उससे बनी अवस्था—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने ... भेजा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। हिंदी में ‘तब’ स्वाभाविक कथात्मक क्रम व्यक्त करता है, जबकि कर्ता का नाम पिछले संदर्भ से समझा जाता है।
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: राजघराने के अधिकारी
  rationale: यह मुहावरा राजमहल अथवा राजकीय गृह-व्यवस्था के प्रभारी उच्च अधिकारी का पद बताता है। शाब्दिक ‘घर के ऊपर’ हिंदी में अस्पष्ट और अस्वाभाविक होता।
- source_word: הַסֹּפֵר
  choice: सचिव
  rationale: इस राजकीय संदर्भ में סֹפֵר किसी लिखने वाले अधिकारी अथवा राजकीय सचिव को सूचित करता है। ‘शास्त्री’ धार्मिक अर्थ पैदा कर सकता है और ‘लेखक’ पद की प्रकृति स्पष्ट नहीं करता।
- source_word: זִקְנֵי הַכֹּהֲנִים
  choice: याजकों के बुज़ुर्गों
  rationale: यह रचना ‘बुज़ुर्गों’ और ‘याजकों’ दोनों विचारों को बनाए रखती है; ‘प्रधान याजकों’ से पद का अनावश्यक विशेषीकरण हो सकता है।
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  choice: टाट के वस्त्र पहने हुए थे
  rationale: यह कृदंत भेजे गए लोगों की शोक और दीनता वाली अवस्था बताता है। सहज हिंदी में परिणामस्वरूप अवस्था दी गई है, और क्रियात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: भविष्यद्वक्ता यशायाह
  rationale: नाम के साथ पदवी को सीधे और प्रचलित हिंदी रूप में रखा गया है।
- source_word: בֶּן אָמוֹץ
  choice: आमोस के पुत्र
  rationale: वंशपरक पहचान को सीधे व्यक्त किया गया है; यहाँ आमोस नाम उस भविष्यद्वक्ता ‘आमोस’ के हिंदी रूप के समान सुनाई देता है, पर स्रोत में यही नाम-रूप है।
