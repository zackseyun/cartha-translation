translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याजकों के बुज़ुर्ग’ स्रोत की संरचना बचाता है; ‘सचिव’ राजकीय प्रसंग में स्वाभाविक है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से असंगत स्थानों पर थे, इसलिए हिंदी मुख्य पाठ में अधिकारी-संबंधी टिप्पणी [a] को एल्याकीम के पद के बाद और टाट-संबंधी टिप्पणी [b] को संबंधित वाक्यांश के बाद रखा गया है।
