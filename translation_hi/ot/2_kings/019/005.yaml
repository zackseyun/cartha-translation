translation:
  language: hi
  text: तब राजा हिजकिय्याह के सेवक यशायाह के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आए
  rationale: वय्यिक्तोल रूप कथा में अगली घटना को क्रम से प्रस्तुत करता है। आधुनिक हिन्दी में ‘तब ... आए’ इस कथात्मक प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדֵי
  choice: सेवक
  rationale: עבד का रचनात्मक बहुवचन यहाँ राजा के सेवकों अथवा दरबारी प्रतिनिधियों को सूचित कर सकता है। ‘सेवक’ मूल शब्द के व्यापक अर्थ को बनाए रखता है और अनावश्यक रूप से ‘अधिकारी’ तय नहीं करता।
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह
  rationale: हिन्दी की स्वाभाविक पदवी-नाम संरचना के अनुसार निश्चित संज्ञा और व्यक्तिनाम को ‘राजा हिजकिय्याह’ के रूप में रखा गया है।
- source_word: אֶל
  choice: के पास
  rationale: किसी व्यक्ति की ओर जाकर उसके समीप पहुँचने के अर्थ में हिन्दी का ‘के पास’ स्वाभाविक है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
