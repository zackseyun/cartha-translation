  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
translation:
  language: hi
  text: क्योंकि मेरे विरुद्ध तुम्हारे क्रोध और तुम्हारी आत्मसंतुष्टि की बात मेरे कानों तक पहुँची है[a], मैं तुम्हारी नाक में अपनी नकेल और तुम्हारे होंठों में अपनी लगाम डालूँगा, और जिस मार्ग से तुम आए थे, उसी मार्ग से तुम्हें लौटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारा घमण्ड’ अथवा ‘तुम्हारा आत्मविश्वास’। हिब्रू शब्द निश्चिंतता या स्वयं को सुरक्षित मानने का भाव प्रकट करता है, जो यहाँ विरोधपूर्ण सन्दर्भ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आगामी दण्ड का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में स्वाभाविक है और कारणवाचक बल बनाए रखता है।
- source_word: הִתְרַגֶּזְךָ אֵלַי
  choice: मेरे विरुद्ध तुम्हारा भड़कना
  rationale: हित्पएल रूप उग्र उत्तेजना या क्रोध प्रकट करता है; यह चयन परमेश्वर के विरुद्ध अश्शूरी राजा की शत्रुतापूर्ण उद्दंडता को व्यक्त करता है।
- source_word: שַׁאֲנַנְךָ
  choice: तुम्हारी आत्मसंतुष्टि
  rationale: शब्द निश्चिंतता और स्वयं को सुरक्षित मानने का भाव रखता है; इस प्रतिकूल सन्दर्भ में ‘आत्मसंतुष्टि’ उसके दोषपूर्ण आत्मविश्वास को बिना अर्थ को केवल ‘घमण्ड’ तक सीमित किए व्यक्त करती है।
- source_word: עָלָה בְאָזְנָי
  choice: मेरे कानों तक पहुँची है
  rationale: हिब्रू का सजीव श्रवण-बिम्ब सुरक्षित रखते हुए हिन्दी में स्वाभाविक मुहावरा दिया गया है। संयुक्त भाव के लिए हिन्दी में निकटवर्ती स्त्रीलिंग संज्ञा के अनुसार एकवचन क्रिया स्वाभाविक है।
- source_word: חַחִי בְּאַפֶּךָ
  choice: अपना काँटा तुम्हारी नाक में
  rationale: חַח पशु या बन्दी को वश में करने के लिए नाक में डाला जाने वाला काँटा अथवा छल्लेदार काँटा है; ‘काँटा’ नियंत्रण और अपमान के ठोस बिम्ब को स्पष्ट रखता है।
- source_word: מִתְגִּי בִּשְׂפָתֶיךָ
  choice: अपनी लगाम तुम्हारे होंठों में
  rationale: מֶתֶג लगाम का वह भाग है जिससे पशु को नियंत्रित किया जाता है। हिन्दी में ‘लगाम’ सामान्य पाठक के लिए ‘बिट’ से अधिक स्वाभाविक है, जबकि ‘होंठों में’ मूल की शारीरिक अभिव्यक्ति बनाए रखता है।
- source_word: וַהֲשִׁבֹתִיךָ
  choice: तुम्हें लौटा दूँगा
  rationale: שׁוב का हिफ़ील रूप किसी को वापस मोड़ने या लौटाने का कारक अर्थ देता है और यहाँ परमेश्वर की निर्णायक क्रिया स्पष्ट करता है।
- source_word: בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  choice: जिस मार्ग से तुम आए थे, उसी मार्ग से
  rationale: यह आक्रमणकारी को उसके आगमन के ठीक उसी रास्ते से वापस भेजे जाने की सममिति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के सुनने और अश्शूरी राजा को वश में करने का मानव-सदृश चित्रण
  choice: ‘मेरे कानों’, ‘अपना काँटा’ और ‘अपनी लगाम’ के ठोस बिम्ब सुरक्षित रखे गए हैं।
  alternative: इसे अमूर्त रूप में ‘मैंने सुन लिया है’ और ‘मैं तुम्हें वश में करूँगा’ कहना।
  rationale: मूल का सजीव चित्र परमेश्वर की जानकारी और अभिमानी राजा पर उसके प्रभुत्व को प्रकट करता है; इसे अमूर्त करने से भविष्यद्वाणी के तिरस्कार और अपमान का बल घटता।
- issue: שַׁאֲנַנְךָ का अर्थगत विस्तार
  choice: मुख्य पाठ में ‘आत्मसंतुष्टि’।
  alternative: ‘घमण्ड’, ‘अहंकार’ या ‘आत्मविश्वास’।
  rationale: मूल शब्द का आधारभूत भाव निश्चिंतता अथवा स्वयं को सुरक्षित समझना है, पर इस सन्दर्भ में वह दोषपूर्ण और उद्दंड है। ‘आत्मसंतुष्टि’ उस तनाव को बनाए रखती है; वैकल्पिक अर्थ पाद-टिप्पणी में दिए गए हैं।
