  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। ‘काँटा’ और ‘लगाम’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘नाक’ और ‘होंठों’ की ठोस समानान्तर छवि मूल के अनुसार सुरक्षित है। पाद-टिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
