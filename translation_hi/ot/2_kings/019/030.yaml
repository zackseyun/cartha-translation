id: 2KI.19.30
reference: 2 Kings 19:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָ֨סְפָ֜ה פְּלֵיטַ֧ת בֵּית יְהוּדָ֛ה הַ/נִּשְׁאָרָ֖ה שֹׁ֣רֶשׁ לְ/מָ֑טָּה וְ/עָשָׂ֥ה פְרִ֖י לְ/מָֽעְלָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/030.yaml
  text: And the surviving remnant of the house of Judah will again take root downward and bear fruit upward[a].
translation:
  language: hi
  text: यहूदा के घराने के शेष बचे लोग[a] फिर नीचे की ओर जड़ पकड़ेंगे और ऊपर की ओर फल लाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के घराने का बचा हुआ शेष भाग।”
    reason: פְּלֵיטַת ... הַנִּשְׁאָרָה को एक सामूहिक एकवचन के रूप में अधिक औपचारिक ढंग से भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְיָסְפָה
  choice: फिर
  rationale: יסף यहाँ आगामी क्रिया के फिर से होने या जारी रहने का भाव देता है। पुनर्स्थापना के प्रसंग में ‘फिर’ स्वाभाविक है और शाब्दिक ‘और बढ़ाएगा’ की असहजता से बचता है।
- source_word: פְּלֵיטַת בֵּית יְהוּדָה הַנִּשְׁאָרָה
  choice: यहूदा के घराने के शेष बचे लोग
  rationale: פְּלֵיטָה और הַנִּשְׁאָרָה दोनों विनाश से बच रहने का भाव रखते हैं। ‘शेष बचे लोग’ इस संयुक्त बल को स्वाभाविक हिन्दी में रखता है; ‘घराना’ בֵּית की सामुदायिक और वंशगत पहचान को बनाए रखता है।
- source_word: שֹׁרֶשׁ לְמָטָּה
  choice: नीचे की ओर जड़ पकड़ेंगे
  rationale: मूल का चित्र ज्यों का त्यों रखते हुए हिन्दी की स्वाभाविक क्रिया ‘जड़ पकड़ना’ अपनाई गई है। ‘नीचे की ओर’ अगले पद के ‘ऊपर की ओर’ के साथ काव्यात्मक विरोध बनाए रखता है।
- source_word: וְעָשָׂה פְרִי לְמָעְלָה
  choice: और ऊपर की ओर फल लाएँगे
  rationale: עָשָׂה פְרִי का अर्थ फल उत्पन्न करना है। ‘फल लाना’ आधुनिक हिन्दी में स्वाभाविक है और जड़ तथा फल का कृषि-रूपक सुरक्षित रखता है।
theological_decisions:
- issue: पुनर्स्थापना की भविष्यवाणी में ‘शेष’ की भाषा
  choice: शेष बचे लोग
  alternative: बचे हुए लोग; बचा हुआ शेष भाग
  rationale: यह अभिव्यक्ति न्याय के बाद सुरक्षित रह गए यहूदा के समुदाय को दर्शाती है और ‘शेष’ के बाइबलीय विषय को बनाए रखती है, पर पद से आगे जाकर कोई बाद की धर्मवैज्ञानिक व्याख्या आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन ‘लोग’ सामूहिक हिब्रू संज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी उसके अधिक औपचारिक सामूहिक रूप को सुरक्षित रखती है।
