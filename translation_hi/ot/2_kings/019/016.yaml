base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
translation:
  language: hi
  text: हे याहवे, अपना कान झुका और सुन; हे याहवे, अपनी आँखें खोल और देख; सनहेरीब की वे बातें सुन जो उसके भेजे हुए दूत ने जीवित परमेश्वर की निन्दा[a] करने के लिए कही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ललकारने” या “ताना मारने”; इब्रानी क्रिया में निन्दा, उपहास, तिरस्कार या खुली चुनौती देने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: अपना कान लगा
  rationale: कान झुकाने के इब्रानी मुहावरे का अर्थ ध्यान देकर सुनना है। ‘अपना कान लगा’ आधुनिक हिन्दी में स्वाभाविक है और एकवचन ‘कान’ को भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: פְּקַח ... עֵינֶיךָ וּרְאֵה
  choice: अपनी आँखें खोल और देख
  rationale: मूल के आदेशात्मक रूप और ‘सुन/देख’ के समानांतर विन्यास को सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: דִּבְרֵי סַנְחֵרִיב
  choice: सनहेरीब की वे बातें
  rationale: דִּבְרֵי का मूल अर्थ ‘बातें/वचन’ है। यहाँ ‘बातें’ सामान्य आधुनिक हिन्दी में उसके अपमानजनक कथनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: जिन्हें उसने ... भेजा है
  rationale: सम्बन्धवाचक उपवाक्य को ‘बातों’ से जोड़ा गया है। हिन्दी में ‘बातें भेजना’ सन्देश भिजवाने के अर्थ में समझने योग्य है और मूल की कुछ असामान्य रचना को अनावश्यक रूप से नहीं खोलता।
- source_word: לְחָרֵף
  choice: अपमान करने के लिए
  rationale: חרף में तिरस्कारपूर्वक निन्दा, उपहास या चुनौती देने का भाव है। ‘अपमान करना’ इसका व्यापक और स्वाभाविक हिन्दी समतुल्य है; ‘ललकारना’ सम्भव वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהִים חָי
  choice: जीवित परमेश्वर
  rationale: यह स्थापित बाइबलीय पदबंध है, जो जीवित परमेश्वर को निर्जीव देवताओं से अलग दिखाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदले बिना सुरक्षित रखता है।
- issue: לְחָרֵף में अपमान और चुनौती का भाव
  choice: अपमान करना
  alternative: ललकारना
  rationale: मुख्य पाठ में तिरस्कार और निन्दा का व्यापक अर्थ रखा गया है, जबकि पादटिप्पणी उस सम्भावित confrontational भाव को सुरक्षित रखती है जिसमें जीवित परमेश्वर को खुली चुनौती देना शामिल है।
