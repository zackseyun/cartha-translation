  register: भाषा आधुनिक, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। आदेशात्मक समानांतरता—‘सुन’, ‘देख’, फिर ‘सुन’—को मूल के अनुसार बनाए रखा गया है।
