source:
  edition: WLC
  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
translation:
  language: hi
  text: मैंने स्वयं खोदकर परदेशी जल पिया है, और अपने पैरों के तलवों से मिस्र की सारी जलधाराएँ[a] सुखा देता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिस्र की सारी नहरें’ अथवा ‘नील की सारी जलधाराएँ।’ इब्रानी शब्द विशेष रूप से नील से जुड़े जलमार्गों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְתִּי
  choice: खोदकर
  rationale: क्रिया का अर्थ यहाँ जलस्रोत खोदना है। ‘खोदकर’ मूल चित्र को बनाए रखता है और ‘कुएँ’ जैसा अप्रकट कर्म नहीं जोड़ता।
- source_word: מַיִם זָרִים
  choice: परदेशी जल
  rationale: זָרִים का मूल भाव ‘पराया/विदेशी’ है; विजय-अभियान के संदर्भ में ‘परदेशी जल’ अपने देश से बाहर मिले जल को व्यक्त करता है।
- source_word: וְאַחְרִב
  choice: सुखा दूँगा
  rationale: חרב के हिफ़ईल रूप का जलमार्गों के साथ स्वाभाविक अर्थ ‘सुखा देना’ है। पूर्ववर्ती पूर्ण क्रियाओं के बाद यह अपूर्ण रूप आगे के दंभी दावे को व्यक्त करता है।
- source_word: בְּכַף פְּעָמַי
  choice: अपने पैरों के तलवों से
  rationale: पैर के संबंध में כַּף उसके तलवे को दर्शाता है; यह अभिव्यक्ति सहज और अत्यंत सरल प्रभुत्व के सजीव चित्र को सुरक्षित रखती है।
- source_word: יְאֹרֵי
  choice: जलधाराएँ
  rationale: יְאֹרֵי नदियों अथवा विशेषतः नील से जुड़ी नहरों और जलमार्गों को सूचित कर सकता है। मुख्य पाठ में व्यापक और पठनीय शब्द रखा गया है, जबकि विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: מָצוֹר
  choice: मिस्र
  rationale: יְאֹרֵי के साथ इस पद में מָצוֹר को मिस्र के काव्यात्मक नाम के रूप में समझना सबसे संदर्भानुकूल है।
- source_word: אֲנִי
  choice: मैंने स्वयं
  rationale: स्पष्ट सर्वनाम वक्ता के आत्म-महत्त्वपूर्ण जोर को व्यक्त करता है; ‘स्वयं’ उस दंभी बलाघात को हिंदी में बनाए रखता है।
theological_decisions:
- issue: प्रथम पुरुष कथन का वक्ता और आलंकारिक प्रभाव
  choice: कथन को राजकीय अहंकार से भरे सीधे दावे के रूप में प्रस्तुत किया गया है, बिना मुख्य पाठ में वक्ता की पहचान या धर्मवैज्ञानिक व्याख्या जोड़े।
  alternative: इसे केवल अतिशयोक्तिपूर्ण सैनिक प्रचार कहकर स्पष्ट करना, अथवा मुख्य पाठ में ‘अश्शूर के राजा ने कहा’ जोड़ना।
  rationale: संदर्भ में यह अश्शूर के राजा की शेखी है। अनुवाद को उसका प्रथम-पुरुष दावा और सजीव चित्र बनाए रखना चाहिए, न कि व्याख्या को पद के भीतर मिला देना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। ‘परदेशी जल’ काव्यात्मक राजकीय शेखी को बनाए रखता है; ‘सुखा दूँगा’ इब्रानी क्रियारूप के भावी दावे को स्पष्ट करता है।
