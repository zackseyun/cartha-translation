source:
  edition: WLC
  text: בְּ/יַ֣ד מַלְאָכֶי/ךָ֮ חֵרַ֣פְתָּ אֲדֹנָ/י֒ וַ/תֹּ֗אמֶר ב/רכב רִכְבִּ֛/י אֲנִ֥י עָלִ֛יתִי מְר֥וֹם הָרִ֖ים יַרְכְּתֵ֣י לְבָנ֑וֹן וְ/אֶכְרֹ֞ת קוֹמַ֤ת אֲרָזָי/ו֙ מִבְח֣וֹר בְּרֹשָׁ֔י/ו וְ/אָב֨וֹאָה֙ מְל֣וֹן קִצֹּ֔/ה יַ֖עַר כַּרְמִלּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
translation:
  language: hi
  text: तूने अपने दूतों के द्वारा प्रभु का अपमान किया है और कहा है, ‘अपने बहुत-से रथों के साथ मैं स्वयं पहाड़ों की ऊँचाइयों पर, लबानोन के दूर-दराज़ भागों तक चढ़ आया हूँ। मैं उसके ऊँचे देवदारों और उसके उत्तम सरो[a] वृक्षों को काट गिराऊँगा; मैं उसके सबसे दूरस्थ विश्राम-स्थान में, उसके हरे-भरे वन में प्रवेश करूँगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्तम चीड़ के वृक्ष”; यहाँ प्रयुक्त इब्रानी वृक्ष-नाम की ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  choice: अपने दूतों के द्वारा
  rationale: हिब्रू मुहावरा एजेंसी या माध्यम को व्यक्त करता है। राजनीतिक-सैन्य संदर्भ में מַלְאָךְ का अर्थ स्वर्गदूत नहीं, बल्कि भेजे हुए दूत है।
- source_word: חֵרַפְתָּ
  choice: अपमान किया है
  rationale: क्रिया में तिरस्कारपूर्ण निंदा, ललकार और उपहास का भाव है। आधुनिक हिन्दी में ‘अपमान किया’ इस व्यापक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: मूल पाठ में यहाँ יהוה नहीं, बल्कि אֲדֹנָי है; इसलिए इसे ‘यहोवा’ के बजाय पदवी ‘प्रभु’ के रूप में रखा गया है।
- source_word: בְּרֹב רִכְבִּי
  choice: अपने बहुत-से रथों के साथ
  rationale: רֹב रथों की बहुलता और सैन्य शक्ति पर घमंड को उभारता है।
- source_word: אֲנִי עָלִיתִי
  choice: मैं स्वयं ... चढ़ आया हूँ
  rationale: स्वतंत्र सर्वनाम אֲנִי वक्ता के आत्म-महत्त्वपूर्ण जोर को व्यक्त करता है; ‘स्वयं’ वही बल बनाए रखता है।
- source_word: מְרוֹם הָרִים
  choice: पहाड़ों की ऊँचाइयों
  rationale: यह चयन ऊँचे पर्वतीय स्थानों की ठोस छवि और मूल संबंध-वाक्यांश दोनों को बनाए रखता है।
- source_word: יַרְכְּתֵי לְבָנוֹן
  choice: लबानोन के दूर-दराज़ भागों
  rationale: יַרְכְּתֵי किसी स्थान के सुदूर छोरों या दुर्गम भीतरी भागों को दर्शाता है।
- source_word: וְאֶכְרֹת
  choice: काट गिराऊँगा
  rationale: पेड़ों के संदर्भ में כרת का अर्थ काटकर गिराना है; हिन्दी में यह क्रिया स्पष्ट और स्वाभाविक है।
- source_word: קוֹמַת אֲרָזָיו
  choice: उसके ऊँचे देवदारों
  rationale: קוֹמָה ऊँचाई या कद को बताता है; विशेषणात्मक हिन्दी रूप मूल चित्र को सहज ढंग से व्यक्त करता है।
- source_word: מִבְחוֹר בְּרֹשָׁיו
  choice: उसके उत्तम सरो वृक्षों
  rationale: מִבְחוֹר सर्वोत्तम या चुने हुए को दर्शाता है। בְּרוֹשׁ की ठीक प्रजाति अनिश्चित है; मुख्य पाठ में प्रचलित ‘सरो’ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: מְלוֹן קִצֹּה
  choice: उसके सबसे दूर के विश्राम-स्थान
  rationale: מָלוֹן ठहरने या विश्राम की जगह है और קִצֹּה उसके अंतिम अथवा सुदूर छोर का बोध देता है; असामान्य मूल रूपक को मिटाया नहीं गया है।
- source_word: יַעַר כַּרְמִלּוֹ
  choice: उसके घने वन
  rationale: כַּרְמֶל यहाँ हरे-भरे, फलते-फूलते वनप्रदेश का बोध करा सकता है। ‘घना वन’ प्रसंगानुकूल प्राकृतिक समृद्धि व्यक्त करता है, जबकि वाक्यांश की व्याख्यात्मक अनिश्चितता बनी रहती है।
theological_decisions:
- issue: אֲדֹנָי को יהוה से अलग रूप में प्रस्तुत करना
  choice: प्रभु
  alternative: यहोवा
  rationale: इस पद के व्यंजनात्मक मूल पाठ में אֲדֹנָי है, tetragrammaton יהוה नहीं। अतः मूल की पदवी और परमेश्वर के व्यक्तिगत नाम के बीच भेद बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धृत घमंड को व्यक्त करने के लिए ‘मैं स्वयं’ बनाए रखा गया है। ‘लबानोन’ मूल नाम के निकट हिन्दी रूप है। मְלוֹן קִצֹּה की असामान्य छवि को अत्यधिक व्याख्यायित करने के बजाय ‘सबसे दूर के विश्राम-स्थान’ के रूप में संरक्षित किया गया है।
