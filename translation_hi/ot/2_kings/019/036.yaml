  yaml_path: translation/ot/2_kings/019/036.yaml
  text: So Sennacherib king of Assyria departed and went and returned, and he lived in Nineveh.
translation:
  language: hi
  text: तब अश्शूर का राजा सन्हेरीब कूच करके चला गया और लौट गया। वह नीनवे में रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע וַיֵּלֶךְ וַיָּשָׁב
  choice: कूच करके चला गया और लौट गया
  rationale: तीनों क्रमिक इब्रानी क्रियाओं को बनाए रखा गया है। 'कूच किया' प्रस्थान की सैन्य-पृष्ठभूमि को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि 'लौट गया' वापसी को स्पष्ट रखता है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: यहाँ क्रिया का अर्थ नीनवे में निवास करना है; 'रहने लगा' घटना के बाद वहाँ उसके ठहरकर रहने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा सन्हेरीब
  rationale: उपाधि और नाम का हिन्दी में स्वाभाविक क्रम अपनाया गया है तथा पारंपरिक बाइबलीय नाम-रूप सुरक्षित रखा गया है।
- source_word: בְּנִינְוֵה
  choice: नीनवे में
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
theological_decisions: []
