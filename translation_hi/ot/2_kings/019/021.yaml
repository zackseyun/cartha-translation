id: 2KI.19.21
reference: 2 Kings 19:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
translation:
  language: hi
  text: 'उसके विषय में याहवे ने यह वचन कहा है: “कुँवारी बेटी सिय्योन तेरा तिरस्कार करती है, तेरा ठट्ठा उड़ाती है। बेटी यरूशलेम तेरे पीछे सिर हिलाती है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सिर हिलाना’ तिरस्कार या उपहास प्रकट करने वाला संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּבָר
  choice: वचन
  rationale: भविष्यसूचक घोषणा के सूत्र में דָּבָר के लिए ‘वचन’ स्वाभाविक और गरिमापूर्ण है तथा ईश्वरीय कथन का भाव बनाए रखता है।
- source_word: דִּבֶּר יְהוָה עָלָיו
  choice: उसके विषय में याहवे ने ... कहा है
  rationale: עַל यहाँ घोषणा के विषय को सूचित करता है; संदर्भ विरोधपूर्ण है, फिर भी इसे अनिवार्य रूप से ‘उसके विरुद्ध’ कहना मूल की संभावित व्यापकता को संकुचित कर देगा।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּזָה
  choice: तिरस्कार करती है
  rationale: क्रिया किसी को घृणा या अवमानना की दृष्टि से देखने का प्रबल भाव व्यक्त करती है; काव्यात्मक ताने में वर्तमान काल स्वाभाविक है।
- source_word: לָעֲגָה
  choice: ठट्ठा उड़ाती है
  rationale: यह क्रिया उपहास करने को व्यक्त करती है; यह रूप आधुनिक पाठक के लिए स्पष्ट है और समानांतर पंक्ति का व्यंग्य बनाए रखता है।
- source_word: בְּתוּלַת בַּת צִיּוֹן
  choice: कुँवारी बेटी सिय्योन
  rationale: नगर का मानवीकरण करने वाली काव्यात्मक उपाधि में ‘कुँवारी’ और ‘बेटी’ दोनों मूल बिंब सुरक्षित रखे गए हैं।
- source_word: אַחֲרֶיךָ
  choice: तेरे पीछे
  rationale: स्थानवाचक अर्थ ‘तेरे पीछे’ मूल के निकट है और जाते हुए शत्रु के पीछे उपहासपूर्ण संकेत करने का दृश्य प्रस्तुत करता है।
- source_word: רֹאשׁ הֵנִיעָה
  choice: सिर हिलाती है
  rationale: शाब्दिक शारीरिक क्रिया को रखा गया है; उसके सांस्कृतिक उपहासार्थ को पादटिप्पणी स्पष्ट करती है।
- source_word: בַּת יְרוּשָׁלִָם
  choice: बेटी यरूशलेम
  rationale: यह नगर का समानांतर काव्यात्मक मानवीकरण है; संक्षिप्त पदबंध इब्रानी समानांतरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ציון और ירושלים का स्त्री-रूप में मानवीकरण
  choice: ‘कुँवारी बेटी सिय्योन’ और ‘बेटी यरूशलेम’
  alternative: सिय्योन की कुँवारी बेटी; यरूशलेम की बेटी
  rationale: इन पदबंधों को नगर के भीतर किसी अलग स्त्री-समूह के बजाय नगर के काव्यात्मक मानवीकरण के रूप में रखा गया है, साथ ही मूल रूपक को समझाकर समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। शत्रु को संबोधित एकवचन ‘तेरा/तेरे’ मूल के दूसरे पुरुष एकवचन को स्पष्ट रखता है। इब्रानी पूर्ण क्रियाओं को जीवंत ताने के संदर्भ में हिंदी वर्तमान काल से व्यक्त किया गया है।
