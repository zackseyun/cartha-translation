  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
translation:
  language: hi
  text: और उन्होंने उनके देवताओं को आग में डाल दिया[a], क्योंकि वे देवता नहीं थे, बल्कि मनुष्य के हाथों की बनाई हुई वस्तुएँ थीं—लकड़ी और पत्थर की वस्तुएँ; इसलिए उन्होंने उन्हें नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आग में रख दिया।” इब्रानी क्रिया का शाब्दिक अर्थ “देना/रखना” है; यहाँ उसका आशय किसी वस्तु को आग में डालना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: उन्होंने … डाल दिया
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर आग के साथ इस प्रयोग में किसी वस्तु को आग में डालने का भाव है। ‘डाल दिया’ आधुनिक हिन्दी में स्वाभाविक है और मूल क्रिया से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: אֱלֹהֵיהֶם
  choice: उनके देवताओं
  rationale: मूल पाठ इन्हें पहले ‘उनके देवता’ कहता है और फिर उनकी वास्तविक ईश्वरता का निषेध करता है। ‘मूर्तियों’ कहने से यह आलंकारिक विरोध कमज़ोर हो जाता।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: हिन्दी में ‘आग में डालना’ गति और गंतव्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי לֹא אֱלֹהִים הֵמָּה
  choice: क्योंकि वे देवता नहीं थे
  rationale: यह उनके नष्ट किए जा सकने का कारण बताता और उनकी वास्तविक ईश्वरता का स्पष्ट निषेध करता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह ‘देवता नहीं’ और उनके वास्तविक स्वरूप के बीच प्रबल विरोध व्यक्त करता है।
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: मनुष्य के हाथों की बनाई हुई वस्तुएँ
  rationale: यह मानव-निर्मित होने पर बल देता है। बहुवचन ‘वस्तुएँ’ देवताओं की बहुवचन संज्ञा के अनुरूप है और हिन्दी में वाक्य को स्पष्ट बनाता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष के बजाय सामान्य मानवता को सूचित करता है; ‘मनुष्य के हाथों’ हिन्दी में इस सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵץ וָאֶבֶן
  choice: लकड़ी और पत्थर
  rationale: यह उन कथित देवताओं की सामग्री का सीधा और प्रचलित वर्णन है।
- source_word: וַיְאַבְּדוּם
  choice: और इस प्रकार उन्होंने उन्हें नष्ट कर दिया
  rationale: क्रिया को बहुवचन कर्ता और बहुवचन कर्म के साथ सकर्मक माना गया है। ‘इस प्रकार’ पूर्व कथन से परिणाम का संबंध दिखाता है, जबकि आरंभिक ו का संयोजक बल भी बना रहता है।
theological_decisions:
- issue: אֱלֹהֵיהֶם को ‘देवताओं’ या ‘मूर्तियों’ के रूप में प्रस्तुत करना
  choice: उनके देवताओं
  alternative: उनकी मूर्तियों
  rationale: पाठ राष्ट्रों द्वारा देवता मानी गई वस्तुओं को उसी पद से संबोधित करके अगली पंक्ति में उनकी ईश्वरता नकारता है। इस तनाव को बनाए रखना आवश्यक है।
- issue: मानव निर्माण के कथन में אָדָם का सामान्य अर्थ
  choice: मनुष्य के हाथों
  alternative: आदमी के हाथों
  rationale: यहाँ संकेत किसी पुरुष-विशेष की ओर नहीं, बल्कि मानव निर्मित वस्तुओं की ओर है। ‘मनुष्य’ अधिक गरिमापूर्ण और सामान्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘देवताओं’ और ‘देवता नहीं थे’ की पुनरावृत्ति मूल पाठ के धर्मवैचारिक विरोध को सुरक्षित रखती है। सामग्री बताने वाले ‘लकड़ी और पत्थर’ को डैश के बीच रखकर वाक्य की संरचना स्पष्ट की गई है।
