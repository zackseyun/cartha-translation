source:
  edition: WLC
  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
translation:
  language: hi
  text: देखो, तुम सुन चुके हो कि अश्शूर के राजाओं ने सभी देशों का क्या हाल किया है—उन्हें विनाश के लिए समर्पित कर दिया है[a]—और क्या तुम बच निकलोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें पूरी तरह नष्ट कर दिया”; इब्रानी में उन्हें विनाश के लिए अलग ठहराने या समर्पित करने का विशेष भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द जोर देकर ध्यान खींचता है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसका संवादात्मक बल बनाए रखता है।
- source_word: שָׁמַעְתָּ
  choice: तुम सुन चुके हो
  rationale: दूसरे पुरुष एकवचन का पूर्ण क्रिया-रूप ऐसी जानकारी बताता है जो पहले सुनी गई और वर्तमान प्रसंग में महत्त्वपूर्ण है।
- source_word: מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं
  rationale: इब्रानी संबंध-वाचक संरचना का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: לְכָל הָאֲרָצוֹת
  choice: सभी देशों के साथ
  rationale: यहाँ बहुवचन אָרֶץ राजनीतिक-भौगोलिक क्षेत्रों या देशों को दर्शाता है; हिन्दी वाक्य-विन्यास में ‘के साथ क्या किया’ स्वाभाविक है।
- source_word: לְהַחֲרִימָם
  choice: उन्हें विनाश के लिए अर्पित कर दिया
  rationale: हिफ़ील रूप और बहुवचन प्रत्यय सहित यह ḥerem की विशिष्ट धारणा व्यक्त करता है—किसी को पूर्ण विनाश के लिए ठहरा देना। यह केवल सामान्य ‘नष्ट करना’ कहने की अपेक्षा स्रोत की न्यायिक-धार्मिक छाया बचाता है।
- source_word: וְאַתָּה תִּנָּצֵל
  choice: तो क्या तुम बच जाओगे?
  rationale: स्वतंत्र सर्वनाम और संयोजक विरोधाभास को उभारते हैं। प्रश्नवाचक रूप वक्ता के व्यंग्यपूर्ण चुनौती-भाव को व्यक्त करता है, जबकि ‘बच जाओगे’ निफ़अल की उद्धार अथवा बच निकलने की धारणा बनाए रखता है।
theological_decisions:
- issue: सैनिक न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए अर्पित कर दिया
  alternative: उनका पूरी तरह सर्वनाश कर दिया; उन्हें प्रतिबंध के अधीन कर दिया
  rationale: मूल शब्द केवल साधारण विनाश नहीं, बल्कि किसी को ḥerem के अधीन करके विनाश के लिए ठहराने की धारणा रखता है। चुना हुआ रूप उस तनाव को बनाए रखता है, पर मुख्य पाठ में अपारदर्शी पारिभाषिक शब्द नहीं लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर सीधा, गंभीर और चुनौतीपूर्ण है। ‘तुम’ एकवचन संबोधन को सहज रूप में रखता है, और अलंकारिक प्रश्न अश्शूरी संदेश के ताने को सुरक्षित रखता है।
