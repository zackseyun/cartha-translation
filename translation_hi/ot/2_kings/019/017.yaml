  yaml_path: translation/ot/2_kings/019/017.yaml
  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
translation:
  language: hi
  text: निश्चय ही[क], हे याहवे, अश्शूर के राजाओं ने जातियों और उनके देशों[ख] को उजाड़ दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “सचमुच” अथवा “निःसंदेह।”
    reason: lexical_alternative
