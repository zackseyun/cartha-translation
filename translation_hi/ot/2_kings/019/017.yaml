    text: इब्रानी में “उनकी भूमि” एकवचन है; अनेक “जातियों” के साथ इसका अर्थ सामूहिक अथवा वितरणात्मक है, इसलिए “उनके देश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  choice: सचमुच
  rationale: यह शब्द पहले कही गई बात की सत्यता को बलपूर्वक स्वीकार करता है; ‘सचमुच’ आधुनिक और स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הֶחֱרִיבוּ
  choice: उजाड़ दिया है
  rationale: हिफ़ील रूप यहाँ युद्ध द्वारा वीरान और तहस-नहस कर देने का अर्थ देता है; ‘उजाड़ दिया है’ इस परिणामकारी भाव को सहज हिन्दी में रखता है।
- source_word: מַלְכֵי אַשּׁוּר
  choice: अश्शूर के राजाओं
  rationale: यह इब्रानी संबंध-रचना का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: הַגּוֹיִם
  choice: उन जातियों
  rationale: संदर्भ में यह अश्शूर द्वारा जीती गई जातियों या राष्ट्रों को सूचित करता है; संकेतवाचक ‘उन’ पिछली चर्चा से संबंध स्पष्ट करता है।
- source_word: אַרְצָם
  choice: उनके देशों
  rationale: मूल में संज्ञा व्याकरणतः एकवचन है, पर बहुवचन ‘जातियों’ के साथ इसका सामूहिक अथवा वितरणात्मक अर्थ है; हिन्दी में बहुवचन ‘देशों’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ चुना गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक स्वीकारोक्ति का बल ‘सचमुच’ से और सैन्य विनाश का भाव ‘उजाड़ दिया है’ से व्यक्त हुआ है।
