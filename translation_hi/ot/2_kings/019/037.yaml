base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह अपने देवता निस्रोक[a] के भवन में आराधना कर रहा था, तब अद्रम्मेलेक और शरेसेर ने उसे तलवार से मार डाला और वे अरारात देश भाग निकले। फिर उसका पुत्र एसरहद्दोन उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘निस्रोक’; इसे परंपरागत रूप से ‘निस्रोख’ भी लिखा गया है।
    reason: नाम की वैकल्पिक पारंपरिक वर्तनी बताने के लिए।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथा में अगली घटना का परिचय देता है। यह रूप हिब्रू की कथात्मक गति को बनाए रखता है और आधुनिक हिन्दी में भी स्पष्ट है।
- source_word: מִשְׁתַּחֲוֶה
  choice: आराधना कर रहा था
  rationale: देवता और उसके भवन के धार्मिक संदर्भ में यह क्रिया केवल शारीरिक रूप से झुकने के बजाय उपासना को व्यक्त करती है; ‘कर रहा था’ सहभागी रूप की जारी क्रिया को दर्शाता है।
- source_word: בֵּית
  choice: के भवन में
  rationale: मूल अर्थ ‘घर/भवन’ है और यहाँ देवता के पवित्र स्थान का संकेत है। ‘भवन’ मूल बिंब को रखते हुए हिन्दी में धार्मिक संदर्भ के अनुकूल है।
- source_word: נִסְרֹךְ
  choice: निस्रोक
  rationale: देवता के नाम को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है; प्रचलित वैकल्पिक वर्तनी पादटिप्पणी में दी गई है।
- source_word: אֱלֹהָיו
  choice: अपने देवता
  rationale: एकवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी रूप; ‘अपने’ वाक्य के कर्ता की ओर स्पष्ट संकेत करता है।
- source_word: הִכֻּהוּ בַחֶרֶב
  choice: उसे तलवार से मार डाला
  rationale: क्रिया का मूल भाव प्रहार करना है, पर इस प्रसंग में परिणाम मृत्यु है। ‘मार डाला’ उस परिणाम को स्पष्ट करता है और ‘तलवार से’ साधन को सुरक्षित रखता है।
- source_word: נִמְלְטוּ
  choice: भाग निकले
  rationale: निफ़ाल रूप यहाँ सफलतापूर्वक बच निकलने का अर्थ देता है; ‘भाग निकले’ पलायन और बच निकलने दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶרֶץ אֲרָרָט
  choice: अरारात देश को
  rationale: यह भौगोलिक गंतव्य और ‘अरारात का देश’ दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के संदर्भ में क्रिया का अर्थ शासन आरम्भ करना या राजा बनना है; अगला पद ‘उसके स्थान पर’ इसे स्पष्ट करता है।
- source_word: אֵסַר חַדֹּן
  choice: एसरहद्दोन
  rationale: राजकीय नाम का हिब्रू पाठ के अनुसार देवनागरी लिप्यंतरण।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह मुहावरा राजवंशीय उत्तराधिकार को व्यक्त करता है और हिन्दी में भी सीधा तथा स्वाभाविक है।
