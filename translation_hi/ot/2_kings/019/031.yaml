  text: כִּ֤י מִ/ירוּשָׁלִַ֨ם֙ תֵּצֵ֣א שְׁאֵרִ֔ית וּ/פְלֵיטָ֖ה מֵ/הַ֣ר צִיּ֑וֹן קִנְאַ֛ת יְהוָ֥ה תַּֽעֲשֶׂה זֹּֽאת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
translation:
  language: hi
  text: क्योंकि यरूशलेम से बचे हुए लोग निकलेंगे, और सिय्योन पर्वत से बच निकलने वाले लोग निकलेंगे। याहवे का जोश यह करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की ईर्ष्या।” इब्रानी संज्ञा का अर्थ “जोश” या “ईर्ष्या” हो सकता है; यहाँ यह यरूशलेम का उद्धार करने के लिए याहवे की उत्कट प्रतिबद्धता को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछली प्रतिज्ञा का आधार या आश्वासन प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִירוּשָׁלִַם תֵּצֵא שְׁאֵרִית
  choice: यरूशलेम से बचे हुए लोग निकलेंगे
  rationale: מִן स्रोत को और יצא बाहर निकलने को व्यक्त करता है। שְׁאֵרִית व्याकरणतः एकवचन है, पर सामूहिक अर्थ रखता है; हिन्दी में बहुवचन क्रिया के साथ ‘बचे हुए लोग’ सहज और स्पष्ट है।
- source_word: וּפְלֵיטָה מֵהַר צִיּוֹן
  choice: और सिय्योन पर्वत से जीवित बचे लोग
  rationale: פְלֵיטָה संकट से बच निकलने या जीवित रहने वालों को दर्शाता है। मूल के संक्षिप्त समानांतर वाक्य-विन्यास को हिन्दी में बनाए रखा गया है।
- source_word: קִנְאַת
  choice: धुन
  rationale: यह संज्ञा प्रबल उत्साह, ईर्ष्या अथवा किसी उद्देश्य के प्रति उत्कट लगन व्यक्त कर सकती है। प्रसंग में याहवे की यरूशलेम को बचाने की प्रबल प्रतिबद्धता अभिप्रेत है; ‘धुन’ इस सक्रिय और उत्कट भाव को सामान्य आधुनिक हिन्दी में व्यक्त करती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ द्वारा प्रस्तुत किया गया है।
- source_word: תַּעֲשֶׂה זֹּאת
  choice: यह ... पूरी करेगी
  rationale: עשה यहाँ बताई गई घटना को कार्यान्वित या संपन्न करने का अर्थ देता है। ‘पूरी करेगी’ हिन्दी में स्वाभाविक है और स्त्रीलिंग कर्ता ‘धुन’ से मेल खाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: קִנְאַת יְהוָה का भाव
  choice: याहवे की धुन
  alternative: याहवे का जोश / याहवे की ईर्ष्या
  rationale: शब्द में उत्साह और ईर्ष्या दोनों अर्थ-संभावनाएँ हैं। इस प्रसंग में उद्धार को पूरा करने की उत्कट प्रतिबद्धता प्रमुख है, पर वास्तविक शब्दार्थगत तनाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर संरचना—यरूशलेम से बचे हुए लोग और सिय्योन पर्वत से जीवित बचे लोग—को मूल के निकट रखा गया है। ‘शेष’ की अपेक्षा ‘बचे हुए लोग’ सामान्य पाठक के लिए अधिक स्पष्ट है।
