source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
translation:
  language: hi
  text: शायद याहवे, आपके परमेश्वर, रबशाके[a] की वे सारी बातें सुनें, जिसे उसके स्वामी अश्शूर के राजा ने जीवित परमेश्वर का अपमान करने[b] के लिए भेजा है, और उन बातों के कारण फटकार लगाएँ जिन्हें याहवे, आपके परमेश्वर, ने सुना है। इसलिए जो शेष जन बचे हैं, उनके लिए प्रार्थना कीजिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रबशाके” संभवतः एक अश्शूरी अधिकारी की पदवी थी; इसका अर्थ “प्रधान साकी” भी प्रस्तावित किया गया है।
    reason: cultural_note
  - marker: b
    text: या “निंदा करने,” “ललकारने” अथवा “ताना मारने।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है “प्रार्थना उठाइए”; आशय है “प्रार्थना अर्पित कीजिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי יִשְׁמַע
  choice: शायद ... सुनें
  rationale: संभावना और आशा, दोनों को बनाए रखता है; इसे निश्चित कथन नहीं बनाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदलता।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह संभवतः अश्शूरी राजकीय पदवी है; विवादित पद-अर्थ को मुख्य पाठ में निश्चित करने के बजाय लिप्यंतरण रखा गया है।
- source_word: לְחָרֵף
  choice: अपमान करने
  rationale: जीवित परमेश्वर के विरुद्ध तिरस्कारपूर्ण निंदा या चुनौती का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  choice: उन बातों के कारण फटकार लगाएँ
  rationale: क्रिया के न्यायिक या भर्त्सनात्मक भाव और ב के कारण-संबंध को व्यक्त करता है, जबकि इब्रानी में स्पष्ट कर्म न होने के कारण किसी कर्म को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְנָשָׂאתָ תְפִלָּה
  choice: प्रार्थना कीजिए
  rationale: इब्रानी मुहावरे ‘प्रार्थना उठाना’ का स्वाभाविक हिन्दी अर्थ देता है; शाब्दिक चित्र footnote में सुरक्षित है।
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  choice: जो शेष जन बचे हैं
  rationale: वर्तमान संकट से बचे समुदाय को दर्शाता है और ‘शेष’ की बाइबिलीय शब्दावली भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि का भेद बनाए रखता है।
- issue: וְהוֹכִיחַ का निहित कर्म
  choice: फटकार लगाएँ
  alternative: उसे फटकारें; उन बातों को दोषी ठहराएँ
  rationale: इब्रानी वाक्य में कर्म स्पष्ट नहीं है। कर्मरहित हिन्दी अभिव्यक्ति इस अस्पष्टता को अनावश्यक रूप से सुलझाए बिना भर्त्सना या न्याय का भाव रखती है।
- issue: הַשְּׁאֵרִית की सामुदायिक धारणा
  choice: शेष जन
  alternative: बचे हुए लोग
  rationale: यह संकट के बाद बचे लोगों को दर्शाता है और ‘शेष’ की व्यापक धर्मवैचारिक प्रतिध्वनि को बिना बढ़ाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सहज मानक हिन्दी अपनाई गई है। यशायाह को संबोधन में “आप” और आदरसूचक क्रियाएँ रखी गई हैं। वाक्य की संभावनात्मकता, फटकार के अस्पष्ट कर्म और ‘शेष जन’ की प्रमुख शब्दावली को सुरक्षित रखा गया है।
