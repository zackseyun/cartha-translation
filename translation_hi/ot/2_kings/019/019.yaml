base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
translation:
  language: hi
  text: और अब, हे याहवे, हमारे परमेश्वर, कृपा करके हमें उसके हाथ से[a] बचाइए, ताकि पृथ्वी[b] के सभी राज्य जान लें कि केवल आप ही, याहवे, परमेश्वर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘उसके हाथ से’; यह किसी की शक्ति या अधिकार से छुड़ाए जाने का इब्रानी मुहावरा है।'
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘देश के सभी राज्य’ भी हो सकता है, पर इस प्रसंग के अंतरराष्ट्रीय विस्तार में ‘पृथ्वी’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालसूचक क्रियाविशेषण—दोनों को रखते हुए यह हिजकिय्याह की प्रार्थना की निर्णायक विनती का स्वाभाविक आरंभ करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित रूप का सीधा और स्वाभाविक अनुवाद।
- source_word: הוֹשִׁיעֵנוּ נָא
  choice: कृपा करके हमें ... बचा
  rationale: हिफ़ील आज्ञार्थक रूप उद्धार की विनती करता है और נָא विनम्र किंतु अत्यावश्यक आग्रह व्यक्त करता है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: मूल इब्रानी रूपक को बनाए रखा गया है; यहाँ ‘हाथ’ किसी के अधिकार या शक्ति को सूचित करता है।
- source_word: וְיֵדְעוּ
  choice: ताकि ... जान लें
  rationale: आज्ञार्थक विनती के बाद यह रूप प्रसंग में उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करता है।
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: अश्शूर और अनेक राष्ट्रों के अंतरराष्ट्रीय प्रसंग में הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ सर्वाधिक उपयुक्त है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषय-वस्तु का परिचय देता है जिसे राज्यों को जानना है।
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  choice: कि केवल आप ही, याहवे, परमेश्वर हैं
  rationale: वाक्य याहवे को संबोधित करते हुए उनके अकेले परमेश्वर होने की घोषणा करता है। हिंदी शब्दक्रम विशेषत्व को स्पष्ट रखता है और יְהוָה को छोड़े बिना स्वाभाविक संबोधन देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण देवनागरी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: לְבַדֶּךָ द्वारा व्यक्त अनन्यता
  choice: केवल आप ही ... परमेश्वर हैं
  alternative: आप अकेले ही ... परमेश्वर हैं
  rationale: यह वाक्य अन्य राष्ट्रों के देवताओं के विपरीत याहवे के विशिष्ट और एकमात्र परमेश्वर होने की घोषणा करता है। चुना हुआ रूप इस बल को बनाए रखता है, पर मूल से आगे कोई व्याख्यात्मक सिद्धांत नहीं जोड़ता।
- issue: ईश्वर के लिए द्वितीय पुरुष संबोधन
  choice: आप ... हैं
  alternative: तू ... है
  rationale: आधुनिक मानक हिंदी में ‘आप’ आदरपूर्ण और सामान्य पाठक के लिए स्वाभाविक है; इससे मूल के एकवचन संबोधन या कथन की धार्मिक विषय-वस्तु नहीं बदलती।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनामय रखी गई है। आरंभ में ‘हे’ प्रत्यक्ष संबोधन को स्पष्ट करता है। ईश्वर के लिए आदरसूचक ‘आप’ और बहुवचन क्रियारूप अपनाए गए हैं, जबकि ‘बचा’ विनती के आज्ञार्थक एकवचन रूप को स्वाभाविक हिंदी में बनाए रखता है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
