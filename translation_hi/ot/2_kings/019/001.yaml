lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने यह सुना, तो
  rationale: इब्रानी कथात्मक सूत्र और कालक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और ऐसा हुआ’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह
  rationale: उपाधि के बाद नाम रखना मानक और स्वाभाविक हिन्दी प्रयोग है।
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: उसने अपने वस्त्र फाड़े
  rationale: मूल के शोक-संकेत को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וַיִּתְכַּס בַּשָּׂק
  choice: टाट ओढ़ा
  rationale: क्रिया के आत्मवाचक भाव तथा शोक और दीनता से जुड़े खुरदरे कपड़े को संक्षिप्त, सहज हिन्दी में व्यक्त करता है।
- source_word: וַיָּבֹא בֵּית יְהוָה
  choice: याहवे के भवन में गया
  rationale: בוא के भीतर जाने के भाव को ‘में गया’ और मंदिर के लिए प्रयुक्त ‘याहवे का भवन’ मुहावरे को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वस्त्र’ और ‘भवन’ सामान्य पाठक के लिए बोधगम्य रहते हुए बाइबलीय प्रसंग की औपचारिकता बनाए रखते हैं; ‘टाट ओढ़ा’ शोक की सांस्कृतिक क्रिया को संक्षेप में स्पष्ट करता है।
