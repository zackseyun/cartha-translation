id: 2KI.19.20
reference: 2 Kings 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: hi
  text: 'तब आमोस के पुत्र यशायाह ने हिजकिय्याह के पास यह संदेश भेजा: “इस्राएल का परमेश्वर यहोवा यों कहता है: अश्शूर के राजा सन्हेरीब के विषय में जो प्रार्थना तुमने मुझसे की है, उसे मैंने सुन लिया है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: क्रिया का शाब्दिक अर्थ ‘भेजा’ है; प्रसंग में यशायाह द्वारा हिजकिय्याह को वचन पहुँचाना अभिप्रेत है, इसलिए स्वाभाविक हिन्दी में ‘यह संदेश भेजा’ कहा गया।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के संदेश का पारंपरिक सूत्र है; वर्तमानकालीन हिन्दी अभिव्यक्ति स्रोत के स्थिर उद्घोषात्मक बल को बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: स्रोत में आए परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया।
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי
  choice: जो प्रार्थना तुमने मुझसे की है
  rationale: אֲשֶׁר को यहाँ संज्ञीकृत सम्बन्धवाचक वाक्य के रूप में लिया गया है—‘जो/जिस बात के लिए तुमने प्रार्थना की’; इससे अस्पष्ट कारणसूचक ‘क्योंकि’ जोड़ने की आवश्यकता नहीं पड़ती।
- source_word: אֶל סַנְחֵרִב
  choice: सन्हेरीब के विषय में
  rationale: यहाँ אֶל प्रसंगानुसार विषय/सम्बन्ध बताता है; ‘के विषय में’ स्वाभाविक और सटीक हिन्दी है।
- source_word: שָׁמָעְתִּי
  choice: उसे मैंने सुन लिया है
  rationale: प्रार्थना के सुने जाने का पूर्ण कार्य व्यक्त करता है; ‘उसे’ हिन्दी में पूर्ववर्ती प्रार्थना से सम्बन्ध स्पष्ट करता है।
theological_decisions:
- issue: אֲשֶׁר का सम्बन्ध और वाक्य का अर्थ
  choice: ‘जो प्रार्थना तुमने मुझसे की है, उसे मैंने सुन लिया है’
  alternative: ‘क्योंकि तुमने मुझसे ... प्रार्थना की है, मैंने सुन लिया है’
  rationale: हिब्रू वाक्य में אֲשֶׁר के बाद की प्रार्थना-विषयक उपवाक्य को שָׁמָעְתִּי का कर्म समझना व्याकरण और समानांतर यशायाह 37:21 के अनुकूल है। यह अनावश्यक रूप से ऐसा कारणात्मक सिद्धान्त नहीं जोड़ता कि सुनना केवल प्रार्थना करने का परिणाम था।
- issue: दैवी नाम की प्रस्तुति
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत नाम יהוה और उपाधि ‘प्रभु’ के भेद को बनाए रखा गया है; इससे किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप—आमोस, यशायाह, हिजकिय्याह, सन्हेरीब—अपनाए गए हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
