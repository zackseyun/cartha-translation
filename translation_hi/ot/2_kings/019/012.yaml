base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
translation:
  language: hi
  text: क्या जिन जातियों को मेरे पुरखाओं ने नष्ट कर दिया था, उनके देवताओं ने उन्हें बचाया था—गोजान, हारान, रेसेप और तेल-अस्सार में रहने वाले एदेन के लोगों को?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एदेन के पुत्र, जो तेल-अस्सार में थे।” यहाँ “एदेन के पुत्र” का अर्थ एदेन के लोग या निवासी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  choice: क्या ... बचाया
  rationale: नצל का हिफ़ील पूर्ण बहुवचन रूप यहाँ अलंकारिक प्रश्न में है। ‘बचाया’ आधुनिक हिन्दी में स्वाभाविक है और संकट अथवा विनाश से छुड़ाने का अर्थ स्पष्ट रखता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: कर्मवाचक सर्वनाम उन जातियों/समुदायों की ओर संकेत करता है जिनके स्थान और लोग आगे गिनाए गए हैं।
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: उनके देवताओं
  rationale: शाब्दिक अर्थ ‘जातियों के देवता’ है; हिन्दी में सर्वनाम द्वारा उन्हीं पूर्वोक्त जातियों से संबंध स्वाभाविक और स्पष्ट होता है।
- source_word: אֲשֶׁר שִׁחֲתוּ אֲבוֹתַי
  choice: जिन जातियों को मेरे पुरखाओं ने नष्ट कर दिया था
  rationale: पिएल שׁחת सैन्य प्रसंग में नष्ट करने अथवा उजाड़ने का बोध देता है। ‘पुरखाओं’ से राजकीय पूर्वज/पूर्वाधिकारी का व्यापक आशय बना रहता है।
- source_word: אֶת גּוֹזָן וְאֶת חָרָן וְרֶצֶף
  choice: गोजान, हारान, रेसेप
  rationale: स्थान-नामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּבְנֵי עֶדֶן
  choice: एदेन के लोगों
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर इस भौगोलिक-सामुदायिक संदर्भ में यह एदेन के लोगों अथवा निवासियों को सूचित कर सकता है। पाठ में स्वाभाविक अर्थ रखा और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בִּתְלַאשָּׂר
  choice: तेलस्सार में रहनेवाले
  rationale: स्थाननाम के साथ ב को ‘में’ और संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में ‘रहनेवाले’ से व्यक्त किया गया है।
