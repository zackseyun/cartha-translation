  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
translation:
  language: hi
  text: जब उसने कूश[a] के राजा तिरहाका के बारे में यह समाचार सुना, “देखो, वह तुमसे लड़ने के लिए निकल आया है,” तब वह लौट गया और हिजकिय्याह के पास दूतों को यह कहने के लिए भेजा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इथियोपिया’। इब्रानी में ‘कूश’ है, जो मिस्र के दक्षिण का प्राचीन क्षेत्र था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  choice: जब उसने ... के विषय में यह सुना
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और यहाँ अगली कार्रवाई की समयगत परिस्थिति बताता है; ‘के विषय में’ אֶל के आशय को स्वाभाविक हिन्दी में रखता है।
- source_word: תִּרְהָקָה
  choice: तिरहाका
  rationale: व्यक्तिनाम का स्रोतानुसार देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ כּוּשׁ
  choice: कूश का राजा
  rationale: इब्रानी स्थाननाम כּוּשׁ को बनाए रखा गया है; इसे आधुनिक इथियोपिया के साथ अनावश्यक रूप से समान नहीं ठहराया गया।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: יָצָא לְהִלָּחֵם אִתָּךְ
  choice: वह तुमसे लड़ने के लिए निकल आया है
  rationale: सैन्य संदर्भ में יצא की गति और לחם की युद्ध-संबंधी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; אִתָּךְ का यहाँ विरोधी अर्थ ‘तुमसे’ से स्पष्ट है।
- source_word: וַיָּשָׁב
  choice: तब वह लौट गया
  rationale: שׁוב का मूल अर्थ लौटना है; यह अनुवाद पीछे हटने या दिशा बदलने से अधिक कुछ निर्धारित नहीं करता।
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: उसने ... दूत भेजकर
  rationale: इस राजनयिक-सैन्य संदर्भ में מַלְאָכִים मानवीय संदेशवाहक हैं; ‘दूत’ संक्षिप्त और प्रचलित है।
- source_word: אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह के पास
  rationale: दिशा-सूचक אֶל को स्वाभाविक हिन्दी में व्यक्त किया गया और नाम का मानक बाइबिलीय रूप रखा गया।
- source_word: לֵאמֹר
  choice: कहा
  rationale: पद के अंत में आने वाला यह रूप अगले पद में प्रत्यक्ष कथन आरम्भ कराता है; ‘भेजकर कहा’ हिन्दी में इस अधूरे वाक्य-संबंध को सहज रखता है।
