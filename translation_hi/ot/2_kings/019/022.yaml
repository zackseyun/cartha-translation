source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
translation:
  language: hi
  text: तूने किसका उपहास किया और निंदा की? तूने किसके विरुद्ध अपनी आवाज़ ऊँची की और अपनी आँखें ऊँचाई पर उठाईं? इस्राएल के पवित्र परमेश्वर के विरुद्ध[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आँखें ऊँचाई पर उठाईं”; यह घमंड और अहंकारी आत्म-उत्थान व्यक्त करने वाला मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  choice: उपहास किया
  rationale: यह क्रिया तिरस्कारपूर्ण अपमान या ठट्ठे का भाव व्यक्त करती है; ‘उपहास किया’ आधुनिक हिन्दी में स्वाभाविक है और अगली निकटार्थक क्रिया से भेद भी बनाए रखती है।
- source_word: גִדַּפְתָּ
  choice: अपमान किया
  rationale: גדף परमेश्वर के विरुद्ध निंदात्मक और अपमानजनक वाणी को सूचित कर सकता है। ‘अपमान किया’ सामान्य पाठक के लिए स्पष्ट है; इसकी ईशनिंदात्मक गंभीरता संदर्भ और ‘इस्राएल के पवित्र परमेश्वर’ से उभरती है।
- source_word: הֲרִימוֹתָ קּוֹל
  choice: अपनी आवाज़ ऊँची की
  rationale: यह हिब्रू मुहावरे का स्वाभाविक हिन्दी समतुल्य है और उद्दंड चुनौती का भाव बनाए रखता है।
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  choice: घमंड से अपनी आँखें उठाईं
  rationale: शाब्दिक चित्र ‘ऊँचाई की ओर आँखें उठाना’ है, पर संदर्भ में यह अहंकार का मुहावरा है। अर्थ को स्पष्ट करते हुए आँखें उठाने की मूल छवि सुरक्षित रखी गई है।
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: इस्राएल का पवित्र परमेश्वर
  rationale: यह स्थापित ईश्वरीय उपाधि है। हिन्दी में ‘पवित्र परमेश्वर’ इसे सहज और स्पष्ट बनाता है तथा इसे केवल किसी पवित्र व्यक्ति के रूप में समझे जाने से बचाता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: दोनों प्रसंगों में यह शत्रुतापूर्ण दिशा बताता है; हिन्दी में ‘के विरुद्ध’ उसी बल को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के विरुद्ध अपमानजनक वाणी की धार्मिक गंभीरता
  choice: ‘अपमान किया’ रखा और चरम बिंदु पर ‘इस्राएल के पवित्र परमेश्वर के विरुद्ध’ स्पष्ट किया।
  alternative: ‘ईशनिंदा की’ अथवा ‘निंदा की’
  rationale: גדף में परमेश्वर-विरोधी निंदा का अर्थ संभव है, किंतु यहाँ दो निकटार्थक वाणी-क्रियाएँ साथ हैं। ‘अपमान’ मूल की व्यापकता सुरक्षित रखता है, जबकि अंतिम ईश्वरीय उपाधि अपराध की धार्मिक गंभीरता स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रत्यक्ष हिन्दी। संबोधन एकवचन ‘तू’ में रखा गया है, क्योंकि हिब्रू रूप एकवचन है और यहाँ यह राजकीय शत्रु के प्रति न्यायिक फटकार है। प्रश्नों की पुनरावृत्ति और अंतिम उत्तर का चरम प्रभाव सुरक्षित रखा गया है।
