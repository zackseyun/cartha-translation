base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
translation:
  language: hi
  text: तब रबशाके लौट गया और उसने अश्शूर के राजा को लिब्ना के विरुद्ध युद्ध करते हुए पाया, क्योंकि उसने सुना था कि राजा लाकीश से कूच कर गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाकीश से निकल गया था।” इब्रानी क्रिया सैन्य प्रसंग में किसी स्थान से प्रस्थान करने, आगे बढ़ने, या पड़ाव उठाने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: शׁוּב यहाँ पहले वाले व्यक्ति या स्थान की ओर वापस जाने को व्यक्त करता है; ‘लौट गया’ स्वाभाविक और अर्थ के निकट है।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी पदवी कथा में नाम-सदृश पहचान के रूप में प्रयुक्त हुई है; इसका लिप्यंतरण संभावित रूप से भ्रामक पदानुवाद से बचता है।
- source_word: וַיִּמְצָא אֶת
  choice: उसने ... पाया
  rationale: מָצָא का सीधा अर्थ ‘पाना’ है; यह मूल वाक्य की संरचना और आशय दोनों को सुरक्षित रखता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: सम्बन्धसूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נִלְחָם עַל
  choice: के विरुद्ध युद्ध करते
  rationale: कृदन्त जारी सैन्य कार्रवाई बताता है और עַל नगर के विरुद्ध शत्रुतापूर्ण कार्रवाई को सूचित करता है।
- source_word: לִבְנָה
  choice: लिब्ना
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: כִּי שָׁמַע
  choice: क्योंकि उसने सुना था
  rationale: כִּי कारण बताता है और पूर्ण क्रिया मुख्य घटनाओं से पहले प्राप्त समाचार की ओर संकेत करती है।
- source_word: כִּי נָסַע
  choice: कि वह ... से कूच कर चुका है
  rationale: נָסַע सैन्य प्रसंग में पड़ाव उठाकर आगे बढ़ने या किसी स्थान से प्रस्थान करने को दर्शा सकता है; ‘कूच कर चुका है’ उस संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִלָּכִישׁ
  choice: लाकीश से
  rationale: स्थान-नाम के साथ उपसर्ग מִן का सीधा अनुवाद।
theological_decisions:
- issue: दोनों एकवचन क्रियाओं में सर्वनाम का संदर्भ
  choice: ‘उसने ... कि वह’ द्वारा मूल की सर्वनामगत अस्पष्टता बनाए रखी गई
  alternative: ‘रबशाके ने सुना था कि अश्शूर का राजा...’ कहकर दोनों कर्ताओं को स्पष्ट करना
  rationale: संदर्भ से पहला कर्ता रबशाके और दूसरा अश्शूर का राजा समझ में आता है, पर इब्रानी पाठ स्वयं नामों को दोहराकर इसे स्पष्ट नहीं करता; इसलिए अनुवाद मूल की वास्तविक अस्पष्टता को अनावश्यक रूप से समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘युद्ध करते पाया’ मूल के जारी सैन्य कार्य को संक्षेप में व्यक्त करता है; स्थान-नामों के प्रचलित बाइबलीय रूप अपनाए गए हैं।
