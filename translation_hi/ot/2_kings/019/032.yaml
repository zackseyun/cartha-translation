base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
translation:
  language: hi
  text: 'इसलिए अश्शूर के राजा के विषय में यहोवा यों कहता है: वह इस नगर में प्रवेश नहीं करेगा, न यहाँ कोई तीर चलाएगा, न ढाल लेकर इसके सामने आएगा[a], और न इसके विरुद्ध घेराबंदी का टीला बनाएगा[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न ढाल की ओट में इसके विरुद्ध आगे बढ़ेगा।” इब्रानी पद संभवतः घेराबंदी के समय ढाल की सुरक्षा में नगर के पास आने को बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इसके विरुद्ध घेराबंदी का बाँध खड़ा करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: पूर्ववर्ती ईश्वरीय वचन से निकलने वाले निष्कर्ष का स्वाभाविक और स्पष्ट संकेत है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी की प्रचलित संदेशवाहक उक्ति का गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में स्थापित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के विषय में
  rationale: यहाँ אֶל उस व्यक्ति को प्रस्तुत करता है जिसके बारे में यह ईश्वरीय घोषणा है; संदर्भ में ‘के विषय में’ संबोधन की अपेक्षा अधिक उपयुक्त है।
- source_word: לֹא יָבֹא אֶל הָעִיר הַזֹּאת
  choice: वह इस नगर में प्रवेश नहीं करेगा
  rationale: नगर के भीतर आने का भाव स्पष्ट करता है और भविष्यसूचक निषेध को स्वाभाविक हिन्दी में रखता है।
- source_word: יוֹרֶה שָׁם חֵץ
  choice: न यहाँ कोई तीर चलाएगा
  rationale: हिफ़ील क्रिया का सैन्य अर्थ ‘तीर चलाना’ है; ‘कोई’ हिन्दी में अनिश्चित एकवचन को स्वाभाविक बनाता है।
- source_word: יְקַדְּמֶנָּה מָגֵן
  choice: न ढाल लेकर इसके सामने आएगा
  rationale: קדמ के सामने आने या आगे बढ़ने के भाव और מָגֵן की ढाल-छवि को बनाए रखता है, बिना युद्ध-पद्धति को आवश्यकता से अधिक निश्चित किए।
- source_word: יִשְׁפֹּךְ עָלֶיהָ סֹלְלָה
  choice: न इसके विरुद्ध घेराबंदी का टीला बनाएगा
  rationale: शाब्दिक ‘उँडेलना’ यहाँ मिट्टी चढ़ाकर घेराबंदी की संरचना बनाने की सैन्य क्रिया है; यह रूप आधुनिक पाठक के लिए स्पष्ट है।
- source_word: סֹלְלָה
  choice: घेराबंदी का टीला
  rationale: यह नगर के विरुद्ध खड़ी की जाने वाली मिट्टी की घेराबंदी-संरचना को दर्शाता है; ‘टीला’ मूल की संभावित व्यापकता को ‘ढलान’ की तुलना में बेहतर बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम सामान्य उपाधि में नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ को चुना गया है।
- issue: अश्शूर के राजा से कथन या उसके विषय में कथन
  choice: के विषय में
  alternative: से
  rationale: वचन की सामग्री राजा के भाग्य के बारे में घोषणा है; אֶל की दिशात्मकता स्वीकार करते हुए संदर्भगत अर्थ को हिन्दी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। भविष्यद्वाणी की सूत्रात्मक शैली ‘यों कहता है’ से सुरक्षित है। सैन्य शब्दावली को सामान्य पाठक के लिए स्पष्ट किया गया है, जबकि יְקַדְּמֶנָּה और סֹלְלָה की वास्तविक अर्थगत अनिश्चितता पादटिप्पणियों में रखी गई है।
