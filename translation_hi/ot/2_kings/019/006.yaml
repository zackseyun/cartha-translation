  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
translation:
  language: hi
  text: 'यशायाह ने उनसे कहा, “अपने स्वामी से ऐसा कहना: ‘याहवे यों कहता है: उन बातों से मत डरो जिन्हें तुमने सुना है और जिनके द्वारा अश्शूर के राजा के सेवकों[a] ने मेरी निन्दा की है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अश्शूर के राजा के युवक।” हिब्रू शब्द का अर्थ युवक हो सकता है, पर यहाँ संभवतः राजकीय परिचारक या अधिकारी अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: हिब्रू कथात्मक रूप का स्वाभाविक और सीधा हिन्दी अनुवाद।
- source_word: אֲדֹנֵיכֶם
  choice: अपने स्वामी
  rationale: यह हिजकिय्याह के प्रति दूतों के अधीनस्थ संबंध को व्यक्त करता है और इसे परमेश्वर के लिए प्रयुक्त उपाधि से अलग रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित रूप में सुरक्षित रखता है।
- source_word: אַל־תִּירָא
  choice: मत डरो
  rationale: निषेधात्मक आदेश का सहज, वर्तमान मानक हिन्दी रूप।
- source_word: מִפְּנֵי הַדְּבָרִים
  choice: जो बातें तुमने सुनी हैं, उनसे
  rationale: मִפְּנֵי का यहाँ कारण या भय के आधार का भाव है; דְּבָרִים संदर्भ में कही गई बातों को दर्शाता है।
- source_word: גִּדְּפוּ
  choice: निन्दा की है
  rationale: परमेश्वर के विरुद्ध अपमानजनक और ईशनिन्दात्मक वाणी की गंभीरता को सामान्य ‘मज़ाक उड़ाने’ से अधिक स्पष्ट रूप में व्यक्त करता है।
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के सेवकों
  rationale: נַעֲרֵי का मूल अर्थ युवक हो सकता है, पर राजकीय संदर्भ में यह परिचारकों, सेवकों या अधिकारियों को सूचित करता है; ‘सेवक’ उनकी प्रतिनिधिक भूमिका को सहजता से व्यक्त करता है।
- source_word: אֹתִי
  choice: मेरी
  rationale: प्रथम पुरुष कर्म को स्पष्ट रखता है और दिखाता है कि अपमान स्वयं याहवे के विरुद्ध था।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के विशिष्ट व्यक्तिगत नाम को सामान्य उपाधि में बदलने के बजाय प्रत्यक्ष रूप से प्रस्तुत किया गया है।
- issue: परमेश्वर के विरुद्ध גִּדְּפוּ की तीव्रता
  choice: मेरी निन्दा की है
  alternative: मेरा अपमान किया है; मेरा उपहास किया है
  rationale: क्रिया परमेश्वर के विरुद्ध धृष्ट और अपवित्र वाणी को दर्शाती है; ‘निन्दा’ उसका धार्मिक भार बनाए रखती है, बिना अर्थ में अनावश्यक विस्तार किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘ऐसा कहना’ बहुवचन दूतों को दिए गए निर्देश को स्वाभाविक रूप में व्यक्त करता है; उद्धरणों की परतें स्पष्ट रखी गई हैं।
