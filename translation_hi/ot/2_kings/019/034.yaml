  yaml_path: translation/ot/2_kings/019/034.yaml
  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
translation:
  language: hi
  text: क्योंकि मैं इस नगर की रक्षा करूँगा और इसे बचाऊँगा[a]—अपने लिए और अपने सेवक दाऊद के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इसे छुड़ाऊँगा।’ इब्रानी क्रिया का अर्थ संकट से ‘बचाना’ या ‘छुड़ाना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי
  choice: मैं ... रक्षा करूँगा
  rationale: गנן यहाँ ढाँपने या सुरक्षा देने के अर्थ में है। यरूशलेम पर सैन्य संकट के संदर्भ में ‘रक्षा करूँगा’ स्वाभाविक और सटीक है।
- source_word: אֶל הָעִיר הַזֹּאת
  choice: इस नगर की
  rationale: गנן के साथ אֶל उस नगर को सूचित करता है जिसकी रक्षा की जाएगी। हिन्दी में ‘इस नगर की रक्षा’ स्वाभाविक प्रयोग है।
- source_word: לְהוֹשִׁיעָהּ
  choice: इसे बचाऊँगा
  rationale: ישׁע संकट से बचाने या छुड़ाने का अर्थ रखता है। ‘बचाऊँगा’ आधुनिक हिन्दी में सीधा और सहज है; ‘छुड़ाऊँगा’ भी सम्भव है।
- source_word: לְמַעֲנִי
  choice: अपने कारण
  rationale: यह परमेश्वर के अपने उद्देश्य या सम्मान को प्रेरक आधार के रूप में व्यक्त करता है। ‘अपने कारण’ अर्थ को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  choice: और अपने सेवक दाऊद के कारण
  rationale: यह दूसरा आधार तथा ‘मेरा सेवक दाऊद’ का संबंध स्पष्ट, वर्तमान हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यरूशलेम को बचाने की परमेश्वर की प्रेरणा
  choice: नगर को बचाने के दो स्पष्ट आधार—परमेश्वर स्वयं और उसका सेवक दाऊद—दोनों रखे गए हैं।
  alternative: दाऊद के उल्लेख को केवल पिछली प्रतिज्ञाओं के संकेत के रूप में अधिक संकीर्ण ढंग से समझा जा सकता है।
  rationale: इब्रानी पाठ לְמַעַן के द्वारा दोनों आधार स्पष्ट रूप से देता है। अनुवाद उनके बीच के संबंध को किसी अतिरिक्त सिद्धान्तात्मक व्याख्या से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘नगर’ बाइबलीय संदर्भ में स्वाभाविक है; वाक्य में उद्देश्य-सूचक संबंध स्पष्ट करने के लिए ‘और’ का प्रयोग किया गया है।
