base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/033.yaml
  text: By the way that he came[a], by it he will return, and he will not come to this city, declares Yahweh.
translation:
  language: hi
  text: जिस मार्ग से वह आया है, उसी मार्ग से वह लौट जाएगा; वह इस नगर में नहीं आएगा—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  choice: जिस मार्ग से वह आया है, उसी मार्ग से
  rationale: यह अनुवाद דֶּרֶךְ के ‘मार्ग’ अर्थ और בָּהּ के पूर्वोक्त मार्ग की ओर संकेत—अर्थात् उसी रास्ते से लौटने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָשׁוּב
  choice: वह लौट जाएगा
  rationale: שׁוּב यहाँ पीछे लौटने को दर्शाता है; भविष्यकालीन ‘लौट जाएगा’ कथन की निश्चितता और प्रसंग दोनों के अनुकूल है।
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  choice: वह इस नगर में नहीं आएगा
  rationale: हिब्रू में स्थानवाचक पद बल के लिए पहले है। हिन्दी में यह क्रम स्वाभाविक है और ‘नगर में नहीं आएगा’ बिना अनावश्यक रूप से ‘प्रवेश करेगा’ जोड़ने के मूल कथन को व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם भविष्यवाणी-संबंधी औपचारिक घोषणा का सूत्र है। ‘घोषणा’ उसकी गंभीरता बनाए रखता है, और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित विद्वत्तापूर्ण लिप्यंतरण द्वारा प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जिस मार्ग से…उसी मार्ग से’ हिब्रू की पुनरुक्त संकेत-रचना को स्वाभाविक हिन्दी में समेटता है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं है।
