base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
translation:
  language: hi
  text: '“और तेरे लिए यह चिन्ह होगा: इस वर्ष तुम वह खाओगे जो अपने-आप उगता है[a], और दूसरे वर्ष वह जो उससे फिर उगता है[b]; और तीसरे वर्ष बोओ और काटो, दाख की बारियाँ लगाओ और उनका फल खाओ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ऐसी उपज जो बिना बोए अपने-आप उग आती है।
    reason: lexical_alternative
  - marker: b
    text: इस दुर्लभ इब्रानी शब्द का अर्थ संभवतः ‘दूसरी उपज’ है—अर्थात पिछले वर्ष की बिना बोई फसल से दूसरे वर्ष उगने वाली उपज।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: चिन्ह
  rationale: यहाँ אוֹת भविष्यसूचक आश्वासन की पुष्टि करने वाले चिन्ह को दर्शाता है; ‘चिन्ह’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: אָכוֹל
  choice: तुम वह खाओगे
  rationale: इन्फिनिटिव ऐब्सोल्यूट यहाँ चिन्ह के अंतर्गत आने वाली भविष्यसूचक बात व्यक्त करता है। हिन्दी में भविष्यकाल इस अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: סָפִיחַ
  choice: जो अपने-आप उगता है
  rationale: यह उस उपज को दर्शाता है जो बिना बोए स्वयं उग आती है; यह अभिव्यक्ति तकनीकी शब्दावली के बिना साधारण पाठक के लिए स्पष्ट है।
- source_word: סָחִישׁ
  choice: जो उससे फिर उगता है
  rationale: यह दुर्लभ शब्द संभवतः पिछले वर्ष की बिना बोई उपज से दूसरे वर्ष निकलने वाली अगली उपज को सूचित करता है। ‘फिर उगता है’ क्रम को व्यक्त करते हुए अर्थ की अनिश्चितता को अति-निर्धारित नहीं करता।
- source_word: זִרְעוּ וְקִצְרוּ
  choice: बोना और काटना
  rationale: बहुवचन आज्ञार्थक क्रियाओं को हिन्दी में समानांतर क्रियार्थक रूप में रखा गया है; ‘काटना’ अनाज की फसल काटने के सामान्य अर्थ में स्वाभाविक है।
- source_word: וְנִטְעוּ כְרָמִים
  choice: दाख की बारियाँ लगाना
  rationale: כְרָמִים का अर्थ अंगूर की खेती वाले बाग या दाख की बारियाँ है; यह पारंपरिक गरिमा और स्पष्टता दोनों बनाए रखता है।
- source_word: וְאִכְלוּ פִרְיָם
  choice: और उनका फल खाना
  rationale: बहुवचन प्रत्यय का स्वाभाविक संबंध दाख की बारियों से है; अनुवाद मूल के बहुवचन संदर्भ और खाने की प्रत्यक्ष क्रिया को बनाए रखता है।
