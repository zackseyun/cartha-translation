  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। संबोधन एकवचन ‘तेरे’ है, जबकि कृषि-संबंधी निर्देश समुदाय के लिए बहुवचन हैं; हिन्दी में आदेशों को समानांतर क्रियार्थक रूप देकर इस बदलाव को स्वाभाविक रखा गया है।
