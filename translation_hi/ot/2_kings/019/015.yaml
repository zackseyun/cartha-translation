base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
translation:
  language: hi
  text: हिजकिय्याह ने यहोवा के सामने प्रार्थना की और कहा, “हे यहोवा, इस्राएल के परमेश्वर, करूबों के ऊपर विराजमान[a], केवल तू ही पृथ्वी के सभी राज्यों पर परमेश्वर है। तूने आकाश और पृथ्वी को बनाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “करूबों के बीच निवास करनेवाला।” इब्रानी में शाब्दिक रूप से “करूबों का/के साथ बैठनेवाला” है; स्थानवाचक संबंध स्पष्ट नहीं किया गया है। यह यहोवा के सिंहासनारूढ़ होने की राजकीय और पवित्रस्थान-संबंधी छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: मूल क्रिया का सामान्य और सीधा अर्थ ‘प्रार्थना करना’ है; प्रसंग में यही स्वाभाविक हिन्दी है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह रूप ‘के सामने/उपस्थिति में’ का स्थानिक और संबंधपरक भाव रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: करूबों के ऊपर विराजमान
  rationale: יֹשֵׁב यहाँ राजकीय-पवित्रस्थान संबंधी सिंहासनारूढ़ होने की छवि देता है; ‘ऊपर’ सन्दूक के करूबों पर विराजमान होने की छवि को स्वाभाविक हिन्दी में रखता है।
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  choice: केवल तू ही ... परमेश्वर है
  rationale: הוּא और לְבַדְּךָ का बल परमेश्वर की अद्वितीयता पर है; यह हिन्दी संरचना उस विशेष बल को स्पष्ट रखती है।
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्यों का
  rationale: यह संबंध समस्त पार्थिव राज्यों के ऊपर परमेश्वर की सार्वभौमिक प्रभुता व्यक्त करता है; हिन्दी में ‘राज्यों का परमेश्वर’ मूल की व्यापक संबंधसूचक रचना के निकट है।
- source_word: עָשִׂיתָ
  choice: बनाया है
  rationale: עָשָׂה का सीधा अर्थ ‘बनाना’ है; इससे मूल में प्रयुक्त क्रिया बनी रहती है और अनावश्यक रूप से ‘सृष्टि की’ नहीं लाया जाता।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह हिन्दी में प्रचलित और स्वाभाविक सृष्टि-सूत्र है; ‘आकाश’ इब्रानी बहुवचन-रूप שָׁמַיִם का मानक हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: परमेश्वर की अद्वितीयता और सार्वभौमिक प्रभुता
  choice: केवल तू ही पृथ्वी के सभी राज्यों का परमेश्वर है
  alternative: तू ही परमेश्वर है, केवल तू, पृथ्वी के सभी राज्यों के लिए
  rationale: चयनित वाक्य मूल के अनन्यतासूचक לְבַדְּךָ और सभी राज्यों से उसके संबंध—दोनों को स्पष्ट रखता है, बिना बाद की धर्मसैद्धांतिक शब्दावली जोड़े।
- issue: करूबों से संबंधित सिंहासन की छवि
  choice: करूबों के ऊपर विराजमान
  alternative: करूबों के बीच निवास करनेवाला
  rationale: मूल पूर्वसर्ग स्पष्ट नहीं करता और पदबंध राजकीय-पवित्रस्थान की छवि रखता है। मुख्य पाठ में ‘ऊपर’ चुना गया है, जबकि ‘बीच’ की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, प्रार्थनात्मक शैली रखी गई है। परमेश्वर को सीधे संबोधन में एकवचन ‘तू’ मूल के निकट और पारंपरिक भक्तिपरक हिन्दी में स्वाभाविक है। पादटिप्पणी-चिह्न [a] संबंधित पदबंध के तुरन्त बाद रखने के बजाय उद्धरण के अंत में रखा गया है, पर उसकी सामग्री स्पष्टतः ‘करूबों के ऊपर विराजमान’ से संबंधित है।
