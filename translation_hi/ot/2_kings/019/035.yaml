  text: וַ/יְהִי֮ בַּ/לַּ֣יְלָה הַ/הוּא֒ וַ/יֵּצֵ֣א מַלְאַ֣ךְ יְהוָ֗ה וַ/יַּךְ֙ בְּ/מַחֲנֵ֣ה אַשּׁ֔וּר מֵאָ֛ה שְׁמוֹנִ֥ים וַ/חֲמִשָּׁ֖ה אָ֑לֶף וַ/יַּשְׁכִּ֣ימוּ בַ/בֹּ֔קֶר וְ/הִנֵּ֥ה כֻלָּ֖/ם פְּגָרִ֥ים מֵתִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
translation:
  language: hi
  text: उसी रात याहवे का दूत निकला और उसने अश्शूर की छावनी में एक लाख पचासी हज़ार लोगों को मार गिराया। जब वे सुबह तड़के उठे,[a] तो देखो, सबके सब शव पड़े थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और वे सुबह जल्दी उठे।” इब्रानी में ‘वे’ का संदर्भ स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “शव, मृत”—मारे गए लोगों की दशा पर बल देने वाला प्रयोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: इब्रानी कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में संक्षिप्त किया गया है; इससे समय-संबंध बना रहता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहवे का दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत’ है और यहाँ अलौकिक कार्यकर्ता अभिप्रेत है। ‘दूत’ हिन्दी बाइबलीय प्रयोग में दोनों पक्षों को स्वाभाविक रूप से सँभालता है; יהוה को व्यक्तिगत नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא के सामान्य अर्थ ‘बाहर जाना/निकलना’ को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: נכה का अर्थ प्रहार करना है और इस न्याय-संदर्भ में परिणाम घातक है; ‘मार गिराया’ क्रिया और मृत्यु दोनों को व्यक्त करता है।
- source_word: בְּמַחֲנֵה אַשּׁוּר
  choice: अश्शूर की छावनी में
  rationale: शाब्दिक संरचना के निकट रहते हुए राज्य/सेना के लिए प्रयुक्त ‘अश्शूर’ को बनाए रखा गया है।
- source_word: מֵאָה שְׁמוֹנִים וַחֲמִשָּׁה אָלֶף
  choice: एक लाख पचासी हज़ार लोगों को
  rationale: संख्या को प्रचलित भारतीय संख्या-पद्धति में व्यक्त किया गया है। हिन्दी में सकर्मक वाक्य की स्पष्टता के लिए ‘लोगों को’ जोड़ा गया है, जिसका संदर्भ छावनी में उपस्थित व्यक्तियों से है।
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: जब वे भोर को उठे
  rationale: तीसरे पुरुष बहुवचन के अनिर्दिष्ट कर्ता को ‘वे’ से सुरक्षित रखा गया है; किसी विशिष्ट समूह की पहचान नहीं थोपी गई।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הִנֵּה के चौंकाने वाले दृश्य की ओर ध्यान खींचने वाले कथात्मक बल को बनाए रखता है।
- source_word: כֻלָּם פְּגָרִים מֵתִים
  choice: वे सब मृत देहें थीं
  rationale: ‘सब’ समग्रता को और ‘मृत देहें’ इब्रानी के ‘शव/देहें, मृत’ जैसे प्रबल संयुक्त प्रयोग को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम सीधे उपस्थित है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में सुरक्षित रखता है।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत
  rationale: मूल शब्द ‘संदेशवाहक/दूत’ और ‘स्वर्गदूत’ दोनों अर्थ दे सकता है। प्रसंग अलौकिक कार्यकर्ता का संकेत देता है, पर ‘दूत’ मूल शब्द की व्यापकता को सुरक्षित रखता और अनावश्यक व्याख्यात्मक विशिष्टता से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘यहवे’, ‘अश्शूर’, ‘छावनी’ और ‘भोर’ बाइबलीय संदर्भ को बनाए रखते हुए सामान्य हिन्दी पाठकों के लिए बोधगम्य हैं।
