source:
  edition: WLC
  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
translation:
  language: hi
  text: क्या तूने नहीं सुना? बहुत पहले मैंने इसे बनाया था; प्राचीन दिनों में मैंने इसे गढ़ा था। अब मैंने इसे पूरा किया है, ताकि तू किलेबंद नगरों को उजाड़कर खंडहरों के ढेर बना दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  choice: क्या तूने नहीं सुना?
  rationale: यह सकारात्मक उत्तर की अपेक्षा करने वाला आलंकारिक प्रश्न है। एकवचन संबोधन के लिए ‘तू’ प्रसंग के राजा से सीधे और प्रबल संबोधन को बनाए रखता है।
- source_word: לְמֵרָחוֹק
  choice: बहुत पहले
  rationale: शाब्दिक रूप से इसमें दूरी का भाव हो सकता है, पर समानांतर पद ‘प्राचीन काल से’ के कारण यहाँ समयगत अर्थ अधिक स्वाभाविक है।
- source_word: אֹתָהּ עָשִׂיתִי
  choice: मैंने इसे किया था
  rationale: עשה का व्यापक क्रियार्थ सुरक्षित रखा गया है। स्त्रीलिंग सर्वनाम का पूर्वपद प्रत्यक्ष नहीं है, इसलिए हिन्दी में तटस्थ ‘इसे’ मूल की संदर्भगत अस्पष्टता बनाए रखता है।
- source_word: לְמִימֵי קֶדֶם וִיצַרְתִּיהָ
  choice: प्राचीन काल से मैंने इसे गढ़ा था
  rationale: יצר में आकार देने या गढ़ने का भाव है; ‘गढ़ा’ पूर्वनियोजन की ओर संकेत करता है, पर केवल ‘योजना बनाई’ कहकर अर्थ को सीमित नहीं करता।
- source_word: עַתָּה הֲבֵיאתִיהָ
  choice: अब मैंने इसे पूरा किया है
  rationale: शाब्दिक ‘इसे लाया’ यहाँ पूर्वनिर्धारित बात को वर्तमान में घटित कराने का मुहावरेदार भाव देता है; ‘पूरा किया’ हिन्दी में यही अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַהְשׁוֹת
  choice: उजाड़कर
  rationale: हिफ़ील रूप विनाश या उजाड़ देने का कारणात्मक भाव व्यक्त करता है।
- source_word: גַּלִּים נִצִּים
  choice: खंडहरों के ढेर
  rationale: यह कठिन इब्रानी पद विनाश के बाद बने ढेरों या टीलों का चित्र देता है। ‘खंडहरों के ढेर’ स्पष्ट आधुनिक हिन्दी है, यद्यपि विशेषण נִצִּים का सटीक अर्थ अनिश्चित है।
- source_word: עָרִים בְּצֻרוֹת
  choice: गढ़वाले नगरों
  rationale: בצר से सुरक्षित या किलेबंद नगर अभिप्रेत हैं; ‘गढ़वाले नगर’ सामान्य पाठक के लिए स्पष्ट और संक्षिप्त है।
theological_decisions:
- issue: अश्शूर की विजयों पर परमेश्वर की प्रभुता
  choice: पद को इस प्रकार रखा गया है कि राजा की सैन्य सफलता परमेश्वर के बहुत पहले ठहराए और अब पूरे किए गए उद्देश्य के भीतर दिखाई दे।
  alternative: इसे केवल परमेश्वर के पूर्वज्ञान के रूप में हल्का करना, या इससे किसी पूर्ण दार्शनिक नियतिवाद को स्पष्ट रूप से सिद्ध करना।
  rationale: इब्रानी पाठ परमेश्वर के पहले करने/गढ़ने और अब उसे पूरा करने पर बल देता है, पर अश्शूर की हिंसा के नैतिक अनुमोदन या किसी विस्तृत दार्शनिक सिद्धांत की घोषणा नहीं करता।
- issue: וּתְהִי का उद्देश्य अथवा परिणाम
  choice: ‘ताकि तू’
  alternative: ‘और ऐसा हुआ कि तू’
  rationale: वाक्यरचना उद्देश्य या परिणाम दोनों की छाया रख सकती है। ‘ताकि’ प्रसंग में स्वाभाविक है, पर इसे परमेश्वर द्वारा अश्शूर के कर्मों के नैतिक अनुमोदन के रूप में नहीं पढ़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज शैली। राजा को संबोधन मूल के एकवचन रूप के अनुसार ‘तू’ में रखा गया है। अनिश्चित स्त्रीलिंग संदर्भ को किसी स्पष्ट संज्ञा—जैसे ‘योजना’—से भरने के बजाय ‘इसे’ रखा गया है।
