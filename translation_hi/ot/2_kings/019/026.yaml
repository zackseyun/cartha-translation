  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וַ/יֵּבֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵפָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
translation:
  language: hi
  text: इसलिए उनके निवासी शक्तिहीन[a] थे; वे घबरा गए और लज्जित हुए। वे खेत की घास और हरी वनस्पति के समान, छतों की घास के समान, और उगने से पहले ही झुलसी हुई फसल के समान थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हाथ के छोटे’ है; यह सामर्थ्यहीन होने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम इब्रानी पदबंध संक्षिप्त है। इसका शाब्दिक बिंब ‘खड़ी फसल से पहले की झुलसन’ है; इसका अनुवाद ‘उगने से पहले ही झुलसी हुई बढ़वार’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹשְׁבֵיהֶן
  choice: उनके निवासी
  rationale: प्रत्यय का संकेत प्रसंग में पहले उल्लिखित नगरों की ओर है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: קִצְרֵי יָד
  choice: शक्तिहीन
  rationale: शाब्दिक अर्थ ‘हाथ के छोटे’ है, पर यह सामर्थ्य या क्षमता के अभाव का मुहावरा है।
- source_word: חַתּוּ
  choice: घबरा गए
  rationale: क्रिया भय से टूट जाने, हतोत्साहित या व्याकुल हो जाने का भाव रखती है; ‘घबरा गए’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ की तीव्रता बनाए रखता है।
- source_word: וַיֵּבֹשׁוּ
  choice: लज्जित हुए
  rationale: यह लज्जा और अपमान की परिणति व्यक्त करता है; हिन्दी में संक्षिप्त और गरिमापूर्ण रूप है।
- source_word: עֵשֶׂב שָׂדֶה
  choice: मैदान की घास
  rationale: यह मूल कृषिगत चित्र को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וִירַק דֶּשֶׁא
  choice: हरी कोंपलें
  rationale: वाक्यांश कोमल, ताज़ी हरी वनस्पति का संकेत देता है; ‘हरी कोंपलें’ उस नश्वर हरियाली का सजीव चित्र देता है।
- source_word: חֲצִיר גַּגּוֹת
  choice: छतों पर उगने वाली घास
  rationale: उथली मिट्टी में उगकर शीघ्र सूख जाने वाली छत की घास का चित्र स्पष्ट करता है।
- source_word: וּשְׁדֵפָה לִפְנֵי קָמָה
  choice: बढ़ने से पहले ही झुलसी हुई वनस्पति
  rationale: मूल पदबंध अत्यंत संक्षिप्त और कुछ अस्पष्ट है। यह अनाज के खड़ा होने से पहले झुलस जाने या झुलसी बढ़वार का चित्र हो सकता है; मुख्य पाठ अर्थ को सहज रखता है और टिप्पणी विकल्प सुरक्षित करती है।
