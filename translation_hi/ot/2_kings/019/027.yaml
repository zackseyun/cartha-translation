  text: पर मैं तुम्हारा बैठना, बाहर जाना और भीतर आना[a], और मेरे विरुद्ध तुम्हारा भड़कना[b] जानता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बैठना, बाहर जाना और भीतर आना’ एक हिब्रू मुहावरा है, जो किसी व्यक्ति की सारी गतिविधियों और आचरण को समेटता है।
    reason: cultural_note
  - marker: b
    text: या ‘तुम्हारा उत्तेजित होना’ अथवा ‘मेरे विरुद्ध तुम्हारा क्रोध से उबलना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  choice: तुम्हारा बैठना
  rationale: ישׁב के ठोस अर्थ को बनाए रखता है और ‘बाहर जाना’ तथा ‘भीतर आना’ के साथ मिलकर व्यक्ति की समूची गतिविधि और आचरण को व्यक्त करता है।
- source_word: וְצֵאתְךָ
  choice: बाहर जाना
  rationale: יצא का स्वाभाविक आधुनिक हिन्दी रूप; यह ‘भीतर आना’ के साथ हिब्रू युग्म को सुरक्षित रखता है।
- source_word: וּבֹאֲךָ
  choice: भीतर आना
  rationale: בוא का सहज हिन्दी रूप, जो पूर्ववर्ती ‘बाहर जाना’ के साथ संतुलित है।
- source_word: יָדָעְתִּי
  choice: मैं ... जानता हूँ
  rationale: Qal पूर्ण 1 एकवचन यहाँ परमेश्वर के स्थिर और व्यापक ज्ञान को व्यक्त करता है; हिन्दी का वर्तमानकालीन रूप प्रसंग में स्वाभाविक है।
- source_word: הִתְרַגֶּזְךָ
  choice: तुम्हारा भड़क उठना
  rationale: Hitpael रूप उत्तेजित होने, क्रोध से उबलने या भड़कने का भाव देता है; यह शत्रुतापूर्ण भाव को व्यक्त करता है, पर ‘ढिठाई’ जैसा अतिरिक्त नैतिक अर्थ नहीं जोड़ता।
- source_word: אֵלָי
  choice: मेरे विरुद्ध
  rationale: אל का मूल अर्थ ‘मेरी ओर’ है, पर क्रोधपूर्ण הִתְרַגֶּזְךָ के साथ हिन्दी में विरोध का भाव ‘मेरे विरुद्ध’ से स्पष्ट और स्वाभाविक होता है।
- source_word: וְאֵת
  choice: और
  rationale: संयोजक और कर्म-चिह्न अंतिम कर्म को ‘जानता हूँ’ से जोड़ते हैं; हिन्दी में कर्म-चिह्न अलग से व्यक्त नहीं किया जाता।
