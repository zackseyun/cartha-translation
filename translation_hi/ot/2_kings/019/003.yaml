source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר חִזְקִיָּ֔הוּ יוֹם צָרָ֧ה וְ/תוֹכֵחָ֛ה וּ/נְאָצָ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י בָ֤אוּ בָנִים֙ עַד מַשְׁבֵּ֔ר וְ/כֹ֥חַ אַ֖יִן לְ/לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
translation:
  language: hi
  text: 'उन्होंने उससे कहा, “हिजकिय्याह यह कहता है: आज का दिन संकट, डाँट और अपमान का दिन है; क्योंकि बच्चे जन्म के द्वार तक आ पहुँचे हैं,[a] पर जन्म देने की शक्ति नहीं है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक बिंब: “बच्चे जन्म के स्थान तक आ पहुँचे हैं।” इब्रानी शब्द מַשְׁבֵּר कठिन है और उससे प्रसव का स्थान या प्रसव का निर्णायक क्षण अभिप्रेत हो सकता है। चित्र यह है कि प्रसव अंतिम घड़ी तक पहुँच गया है, पर उसे पूरा करने की शक्ति नहीं बची।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह प्रचलित संदेशवाहक-सूत्र है। आधुनिक हिन्दी में राजकीय संदेश का स्वाभाविक परिचय देता है, जबकि इब्रानी की परंपरागत शक्ति बनाए रखता है।
- source_word: יוֹם צָרָה
  choice: संकट का दिन
  rationale: צָרָה दबाव, विपत्ति और कठिन संकट को दर्शाता है; ‘संकट’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וְתוֹכֵחָה
  choice: डाँट
  rationale: संज्ञा का अर्थ फटकार, भर्त्सना या ताड़ना हो सकता है। ‘डाँट’ सामान्य पाठक के लिए सुबोध है और यह तय नहीं करती कि डाँट विशेष रूप से परमेश्वर की ओर से है या मनुष्यों की ओर से।
- source_word: וּנְאָצָה
  choice: अपमान
  rationale: यह शब्द तिरस्कार, उपहासपूर्ण अवमानना या निंदा का भाव रख सकता है। प्रसंग में ‘अपमान’ राष्ट्रीय लज्जा और तिरस्कार दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज का दिन
  rationale: इब्रानी के संकेतवाचक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  choice: बच्चे जन्म के द्वार तक आ पहुँचे हैं
  rationale: यह प्रसव के निर्णायक क्षण तक पहुँचने का रूपक है। कठिन शब्द מַשְׁבֵּר जन्म के स्थान या क्षण की ओर संकेत कर सकता है; ‘जन्म के द्वार’ मूल बिंब को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: וְכֹחַ אַיִן לְלֵדָה
  choice: पर जन्म देने की शक्ति नहीं है
  rationale: 'वाक्य रूपक की चरम विडंबना व्यक्त करता है: प्रसव का समय आ गया, किंतु उसे पूरा करने की सामर्थ्य नहीं रही।'
- source_word: בָנִים
  choice: बच्चे
  rationale: यद्यपि रूप व्याकरणतः पुल्लिंग बहुवचन है, प्रसव-रूपक में आशय सामान्यतः संतान से है; ‘बच्चे’ हिन्दी में इसी सामान्य अर्थ को व्यक्त करता है।
theological_decisions:
- issue: וְתוֹכֵחָה में डाँट का कर्ता
  choice: ‘डाँट’ को बिना कर्ता बताए रखा गया
  alternative: ‘दंड’ या ‘परमेश्वर की फटकार’
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि यह परमेश्वर की ताड़ना है, शत्रु की भर्त्सना है, या व्यापक रूप से निंदा का अनुभव; इसलिए अनिश्चितता सुरक्षित रखी गई है।
- issue: וּנְאָצָה का धार्मिक अर्थ
  choice: ‘अपमान’
  alternative: ‘परमेश्वर की निंदा’
  rationale: शब्द निंदा या तिरस्कार का अर्थ दे सकता है, पर इस पद में लक्ष्य स्पष्ट नहीं है। ‘अपमान’ इसे केवल ईशनिंदा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जन्म के द्वार’ प्रसव के मूल रूपक को जीवंत रखता है; व्याख्यात्मक विवरण पादटिप्पणी में दिया गया है।
