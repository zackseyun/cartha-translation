base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
translation:
  language: hi
  text: तब हिजकिय्याह ने दूतों के हाथ से वे पत्र[a][b] लिए और उन्हें पढ़ा। फिर वह याहवे के भवन की ओर चढ़ गया, और हिजकिय्याह ने उसे[c] याहवे के सामने फैला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस्तावेज़” अथवा “लिखित सामग्री”; इब्रानी शब्द का अर्थ निजी पत्रों से अधिक व्यापक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “दूतों के हाथ से,” अर्थात दूतों से।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यहाँ सर्वनाम एकवचन, “उसे,” है, जबकि पहले “पत्र” बहुवचन है; सम्भवतः पूरे लिखित संदेश को एक इकाई माना गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: הַסְּפָרִים
  choice: पत्र
  rationale: यह शब्द सामान्य रूप से लिखित सामग्री, दस्तावेज़ या पुस्तकें दर्शा सकता है; इस प्रसंग में दूतों द्वारा लाई गई लिखित राजकीय सूचना के लिए ‘पत्र’ सबसे स्वाभाविक है।
- source_word: מִיַּד הַמַּלְאָכִים
  choice: दूतों के हाथ से
  rationale: मूल इब्रानी की ठोस अभिव्यक्ति को रखा गया है; यहाँ ‘दूत’ मनुष्य संदेशवाहक हैं, स्वर्गदूत नहीं।
- source_word: וַיִּקְרָאֵם
  choice: उन्हें पढ़ा
  rationale: क्रिया के साथ लगा सर्वनाम बहुवचन है और पहले आए ‘पत्रों’ से मेल खाता है।
- source_word: וַיַּעַל בֵּית יְהוָה
  choice: याहवे के भवन में गया
  rationale: עלה में ऊपर जाने का भाव है, पर हिन्दी में मंदिर जाने के लिए ‘भवन में गया’ अधिक सहज है; ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיִּפְרְשֵׂהוּ
  choice: उसे फैला दिया
  rationale: यहाँ सर्वनाम एकवचन है, यद्यपि पहले लिखित सामग्री बहुवचन में है। अनुवाद उस व्याकरणिक बदलाव को बनाए रखता है और सम्भवतः पूरे संदेश को एक इकाई मानता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह परमेश्वर की उपस्थिति में किसी काम को करने की मानक इब्रानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के भेद को सुरक्षित रखता है।
- issue: बहुवचन पत्रों के बाद एकवचन सर्वनाम
  choice: ‘उन्हें पढ़ा’ के बाद ‘उसे फैला दिया’
  alternative: दोनों स्थानों पर बहुवचन ‘उन्हें’
  rationale: मूल में पहले सर्वनाम बहुवचन और बाद में एकवचन है। इसे समान बनाना वास्तविक पाठगत-व्याकरणिक तनाव को मिटा देता; एकवचन सम्भवतः लिखित संदेश को सामूहिक इकाई मानता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पत्र’, ‘दूत’ और ‘भवन’ परिचित शब्द हैं। वाक्य-विन्यास इब्रानी की क्रमिक कथाशैली को बनाए रखता है, जबकि असहज शाब्दिकता से बचता है।
