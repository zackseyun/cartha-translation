source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
translation:
  language: hi
  text: देखो, मैं उसमें एक आत्मा[a] डाल रहा हूँ। वह एक समाचार[b] सुनेगा और अपने देश लौट जाएगा; और मैं उसे उसी के देश में तलवार से गिरा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक मनोवृत्ति’; इब्रानी शब्द का अर्थ ‘हवा’ या ‘साँस’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एक सूचना’ अथवा ‘एक अफ़वाह’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देख
  rationale: यह शब्द परमेश्वर की घोषणा की ओर ध्यान खींचता है। ‘देख’ आधुनिक, सहज और संक्षिप्त रूप में उसका संकेतात्मक बल बनाए रखता है।
- source_word: נֹתֵן
  choice: मैं ... डाल रहा हूँ
  rationale: הִנְנִי के साथ प्रयुक्त कृदंत निकट या आरंभ होने वाली क्रिया को सजीव रूप में प्रस्तुत करता है; वर्तमान प्रगतिशील रूप इस तात्कालिकता को बनाए रखता है।
- source_word: רוּחַ
  choice: एक आत्मा
  rationale: यहाँ शब्द राजा को प्रभावित करने वाली आंतरिक प्रेरणा या प्रवृत्ति का संकेत दे सकता है। ‘आत्मा’ इब्रानी शब्द की व्यापकता और दैवी कार्य की रीति से जुड़ी अस्पष्टता को सुरक्षित रखता है।
- source_word: וְשָׁמַע
  choice: वह ... सुनेगा
  rationale: भविष्यकाल इस न्याय-वाणी में आने वाले परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמוּעָה
  choice: एक समाचार
  rationale: यह शब्द समाचार, सूचना या अफ़वाह का अर्थ दे सकता है। ‘समाचार’ सत्यता के विषय में अनावश्यक निर्णय किए बिना तटस्थ अर्थ देता है।
- source_word: וְשָׁב לְאַרְצוֹ
  choice: और अपने देश लौट जाएगा
  rationale: यह वाक्यांश लौटने की दिशा तथा सर्वनामिक संबंध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִפַּלְתִּיו
  choice: और मैं उसे ... गिरा दूँगा
  rationale: नפל का हिफ़ील रूप कारणवाचक है। ‘गिरा दूँगा’ उसकी कारणवाचक शक्ति को बनाए रखता है और तलवार से मृत्यु के प्रसंग में स्वाभाविक है।
- source_word: בַּחֶרֶב
  choice: तलवार से
  rationale: यह साधनवाचक प्रयोग तलवार द्वारा हिंसक मृत्यु को व्यक्त करता है।
- source_word: בְּאַרְצוֹ
  choice: उसी के देश में
  rationale: ‘उसी के’ उसके अपने देश में होने वाले पतन पर बल देता है और पद में दोहराए गए सर्वनामिक संबंध की विडंबना को सामने रखता है।
theological_decisions:
- issue: दैवी न्याय-वाणी में רוּחַ का अर्थ
  choice: एक आत्मा
  alternative: एक मनोवृत्ति / हवा / साँस
  rationale: संदर्भ में यहोवा अश्शूर के राजा को इस प्रकार प्रभावित करता है कि वह समाचार सुनकर लौट जाए। ‘आत्मा’ शब्द के अर्थ-विस्तार और परमेश्वर द्वारा घटनाओं को निर्देशित करने की बात को बनाए रखता है, पर कार्य की सटीक रीति को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है। ‘देख’ घोषणा का ध्यानाकर्षक बल रखता है; ‘आत्मा’ मूल की वास्तविक अर्थगत अस्पष्टता बचाता है; और ‘तलवार से गिरा दूँगा’ कारणवाचक रूप तथा न्याय-वाणी की गरिमा बनाए रखता है। फुटनोट-चिह्न उन शब्दों पर रखे गए हैं जिनसे उनके विकल्प वास्तव में संबंधित हैं।
