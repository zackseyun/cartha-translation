  source_fidelity: 'The draft accurately represents the Hebrew sequence: YHWH''s imminent action, the ambiguous רוּחַ, hearing a report, returning to his land, and being caused to fall by the sword there. The causative force of וְהִפַּלְתִּיו is retained by “गिरा दूँगा.”'
  naturalness: “देख” is an intimate singular imperative in modern Hindi and is stylistically awkward at the opening of this formal divine announcement. “देखो” functions naturally as an attention-directing interjection in this register. The remainder is clear modern standard Hindi.
  terminology: “एक आत्मा” appropriately preserves the lexical openness of רוּחַ without prematurely defining it as a disposition. The anchored note supplies relevant alternatives. “समाचार,” “देश,” and “तलवार से” are suitable and faithful choices.
