  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
translation:
  language: hi
  text: 'तुम यहूदा के राजा हिजकिय्याह से इस प्रकार कहना: ‘तेरा परमेश्वर[a], जिस पर तू भरोसा रखता है, यह कहकर तुझे धोखा न दे, “यरूशलेम अश्शूर के राजा के हाथ में नहीं दिया जाएगा।”’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा देवता”; इब्रानी लिपि में बड़े और छोटे अक्षरों का भेद नहीं होता, और अश्शूरी वक्ता हिजकिय्याह के भरोसे का उपहास कर रहा है।
    reason: lexical_alternative
