translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज है। आरंभिक दो प्रश्नों को अलग वाक्यों में रखने से इब्रानी की पुनरुक्ति और ताने का बल सुनाई देता है। अंतिम पदबंध की असामान्य सूची—‘सपर्वैम नगर का राजा, हेना और इव्वा’—को जानबूझकर पूरी तरह समतल नहीं किया गया, क्योंकि स्रोत यह स्पष्ट नहीं करता कि अंतिम दोनों नाम उसी एक राजा के अधीन हैं या लुप्त ‘राजा’ के साथ अलग प्रविष्टियाँ हैं।
