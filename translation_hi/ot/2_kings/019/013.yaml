  yaml_path: translation/ot/2_kings/019/013.yaml
  text: Where is the king of Hamath[a], and the king of Arpad, and the king of the city of Sepharvaim, Hena, and Ivvah?
translation:
  language: hi
  text: हमात के राजा, अर्पाद के राजा और सपर्वैम नगर, हेना[a] और इव्वा के राजा कहाँ हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हेनाह’; इस स्थान-नाम के लिप्यंतरण में भिन्नता मिलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיּוֹ
  choice: कहाँ है? / कहाँ हैं?
  rationale: यह प्रश्नवाचक रूप इन राजाओं के वर्तमान ठिकाने या अंत का उपहासपूर्ण प्रश्न करता है। हिन्दी में सूची के प्रत्येक भाग के साथ स्वाभाविक वाक्य-संख्या रखी गई है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: मानक अर्थ; इब्रानी में हुई पुनरावृत्ति को हमात, अर्पाद और सपर्वैम के साथ बनाए रखा गया है।
- source_word: חֲמָת
  choice: हमात
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַרְפָּד
  choice: अर्पाद
  rationale: इब्रानी स्थान-नाम का निकट और सुबोध हिन्दी लिप्यंतरण।
- source_word: לָעִיר
  choice: नगर का
  rationale: לָעִיר को राजा के साथ संबंध बताने वाला मानते हुए ‘सपर्वैम नगर का राजा’ किया गया है; इससे עִיר भी स्पष्ट रूप से व्यक्त होता है।
- source_word: סְפַרְוָיִם
  choice: सपर्वैम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הֵנַע
  choice: हेना
  rationale: व्यंजनात्मक इब्रानी रूप के निकट स्थान-नाम; वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- source_word: וְעִוָּה
  choice: और इव्वा
  rationale: संयोजक וְ को स्पष्ट रखा गया है और स्थान-नाम का हिन्दी लिप्यंतरण किया गया है। इब्रानी की सूचीगत संरचना को बिना अतिरिक्त ‘के राजा’ जोड़कर अनावश्यक रूप से स्पष्ट किए सुरक्षित रखा गया है।
