  text: וַ/יְדַבֵּ֞ר מַלְאַ֤ךְ יְהוָה֙ אֶל אֵ֣לִיָּ֔הוּ רֵ֣ד אוֹת֔/וֹ אַל תִּירָ֖א מִ/פָּנָ֑י/ו וַ/יָּ֛קָם וַ/יֵּ֥רֶד אוֹת֖/וֹ אֶל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
translation:
  language: hi
  text: तब यहोवा के दूत ने एलिय्याह से कहा, “उसके साथ नीचे जा; उससे मत डर।” तब वह उठा और उसके साथ राजा के पास नीचे गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या प्रसंगानुसार ‘स्वर्गदूत’ हो सकता है। हिन्दी में ‘यहोवा के दूत’ इस स्थापित बाइबलीय पदबंध को स्वाभाविक रूप से व्यक्त करता है और मूल की कुछ व्यापकता भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: רֵד אוֹתוֹ
  choice: उसके साथ नीचे जा
  rationale: यहाँ ירד के बाद सर्वनामयुक्त אוֹתוֹ संगति का भाव देता है; इसलिए आदेश का अर्थ उस पुरुष के साथ नीचे जाना है।
- source_word: אַל תִּירָא מִפָּנָיו
  choice: उससे मत डर
  rationale: शाब्दिक रूप ‘उसके मुख/उपस्थिति के सामने से मत डर’ हिन्दी में अस्वाभाविक होगा। इस मुहावरे का सीधा और स्वाभाविक अर्थ ‘उससे मत डर’ है।
- source_word: וַיָּקָם
  choice: तब वह उठा
  rationale: यह सामान्य कथात्मक क्रिया है, जो आदेश के प्रत्युत्तर में एलिय्याह की तत्पर कार्रवाई बताती है।
- source_word: וַיֵּרֶד אוֹתוֹ אֶל הַמֶּלֶךְ
  choice: उसके साथ राजा के पास नीचे गया
  rationale: संगति, नीचे की ओर गति और गंतव्य—तीनों को मूल क्रम के निकट रहते हुए स्पष्ट हिन्दी में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाने से नाम को उपाधि में बदलने से बचा जाता है।
- issue: מַלְאַךְ का अर्थ
  choice: दूत
  alternative: स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की अर्थ-सीमा को बनाए रखता है; इस प्रसंग में उसका ईश्वरीय/स्वर्गीय स्वरूप ‘यहोवा के’ से स्पष्ट हो जाता है, बिना शब्द को आवश्यकता से अधिक विशिष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। आज्ञा में एकवचन आत्मीय/प्रत्यक्ष रूप ‘जा’ और ‘मत डर’ मूल इब्रानी के एकवचन आदेश के अनुरूप है।
