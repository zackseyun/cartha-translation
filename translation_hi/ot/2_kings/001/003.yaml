base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
translation:
  language: hi
  text: परन्तु यहोवा के दूत ने तिशबी एलिय्याह से कहा, “उठो, शोमरोन के राजा के दूतों से मिलने के लिए ऊपर जाओ और उनसे कहो, ‘क्या इस्राएल में परमेश्वर नहीं है कि तुम एक्रोन के देवता बाल-जबूब से पूछने जा रहे हो?’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: परन्तु यहोवा के दूत
  rationale: ו को पिछले पद में राजा के कार्य के साथ कथात्मक विरोध दिखाने के लिए ‘परन्तु’ किया गया है। מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; ‘यहोवा के दूत’ स्वाभाविक हिन्दी है और उसकी पहचान के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
- source_word: דִּבֶּר אֶל
  choice: से कहा
  rationale: प्रत्यक्ष कथन से पहले आधुनिक हिन्दी में ‘से कहा’ स्वाभाविक है और ‘बात की’ की अपेक्षा प्रसंग को अधिक सहजता से व्यक्त करता है।
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  choice: तिशबी एलिय्याह
  rationale: व्यक्तिनाम और निवासी-सूचक उपाधि को प्रचलित बाइबलीय हिन्दी रूप में रखा गया है।
- source_word: קוּם עֲלֵה
  choice: उठो … ऊपर जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखा गया है और עלה की दिशात्मक बारीकी ‘ऊपर’ से सुरक्षित की गई है।
- source_word: לִקְרַאת
  choice: से मिलने के लिए
  rationale: यह उद्देश्य प्रकट करता है; ‘सामना करने’ से अनावश्यक टकराव का भाव जुड़ सकता था।
- source_word: מַלְאֲכֵי מֶלֶךְ שֹׁמְרוֹן
  choice: शोमरोन के राजा के दूतों
  rationale: यहाँ מַלְאָךְ मानवीय संदेशवाहकों को दर्शाता है। ‘शोमरोन का राजा’ मूल पाठ की अभिव्यक्ति को बनाए रखता है।
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: क्या इस्राएल में कोई परमेश्वर नहीं है
  rationale: यह झिड़की भरा आलंकारिक प्रश्न है। यह रूप आधुनिक हिन्दी में स्पष्ट है और इब्रानी वाक्य की धार बनाए रखता है।
- source_word: אַתֶּם הֹלְכִים
  choice: तुम … जा रहे हो
  rationale: कृदन्त चल रही अथवा अभिप्रेत कार्रवाई का भाव देता है, जिसे हिन्दी का प्रगतिशील रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִדְרֹשׁ
  choice: से पूछने
  rationale: इस देववाणी-संबंधी प्रसंग में इसका अर्थ किसी देवता से उत्तर या मार्गदर्शन जानना है; ‘पूछना’ आम पाठक के लिए सहज और सटीक है।
- source_word: בַּעַל זְבוּב
  choice: बाल-जबूब
  rationale: संयुक्त व्यक्तिवाचक नाम का लिप्यंतरण हाइफ़न के साथ किया गया है।
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: एक्रोन के देवता
  rationale: सम्बन्धवाचक रचना निश्चित अर्थ रखती है और बाल-जबूब को एक्रोन से संबद्ध देवता बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का नाम सीधे उपस्थित है। हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ नाम को सामान्य उपाधि में बदलने के बजाय सुरक्षित रखता है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा के दूत
  alternative: यहोवा के स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की व्यापक अर्थ-सीमा और पात्र की पहचान से जुड़ी धार्मिक तनावपूर्ण अस्पष्टता को बनाए रखता है; अनुवाद यह निर्धारित नहीं करता कि वह कौन है।
- issue: אֱלֹהִים के लिए पद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: प्रश्न इस्राएल के परमेश्वर के अस्तित्व/उपलब्धता को बाल-जबूब से परामर्श लेने के विपरीत रखता है। ‘परमेश्वर’ हिन्दी बाइबल में स्वाभाविक है और किसी अतिरिक्त सम्प्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से स्पष्ट रखी गई है। ‘ऊपर जाओ’ भौगोलिक दिशा को सुरक्षित करता है। इस पद के दिए गए अंग्रेज़ी पाठ में [a] का स्थान और उसकी टिप्पणी परस्पर असंगत हैं; टिप्पणी वास्तव में आलंकारिक प्रश्न का वैकल्पिक रूप है, पर हिन्दी में वह कोई सार्थक अलग पाठ नहीं बनाती, इसलिए अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
