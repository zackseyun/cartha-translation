  text: וַ/יְדַבֵּ֨ר אֵלָ֜י/ו כֹּֽה אָמַ֣ר יְהוָ֗ה יַ֜עַן אֲשֶׁר שָׁלַ֣חְתָּ מַלְאָכִים֮ לִ/דְרֹשׁ֮ בְּ/בַ֣עַל זְבוּב֮ אֱלֹהֵ֣י עֶקְרוֹן֒ הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל לִ/דְרֹ֖שׁ בִּ/דְבָר֑/וֹ לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
translation:
  language: hi
  text: 'उसने उससे कहा, “याहवे यों कहता है: ‘तूने एक्रोन के देवता बाल-ज़बूब[b] से परामर्श लेने के लिए दूत भेजे हैं—क्या इस्राएल में परमेश्वर नहीं है, जिससे उसके वचन की खोज की जाए?[a] इसलिए जिस पलंग पर तू चढ़ा है,[c] उस पर से तू नहीं उतरेगा, क्योंकि तू निश्चय ही मर जाएगा।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उसके वचन के विषय में पूछना”; अर्थात उससे कोई दैवी संदेश या उत्तर माँगना।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में नाम “बाल-ज़बूब” है; बाद की परंपरा में इससे मिलता-जुलता रूप “बाल-ज़बूल” भी मिलता है।
    reason: alternative_reading
  - marker: c
    text: 'शाब्दिक क्रम में: “जिस पलंग पर तू वहाँ चढ़ा है”; इब्रानी का “वहाँ” संबंधवाचक वाक्य में पुनरुक्तिसूचक है।'
    reason: source_form
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
  choice: तब उसने उससे कहा
  rationale: कर्ता और कर्म के सर्वनामों की मूल अस्पष्टता बनाए रखी गई है; ‘कहा’ हिन्दी में प्रत्यक्ष वचन का स्वाभाविक परिचय है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: प्रचलित भविष्यद्वक्तीय संदेश-सूत्र को गरिमापूर्ण आधुनिक हिन्दी में रखा गया है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: שָׁלַחְתָּ מַלְאָכִים
  choice: तूने ... दूत भेजे हैं
  rationale: מַלְאָכִים यहाँ मानवीय संदेशवाहक हैं; पूर्ण क्रिया के वर्तमान परिणाम को ‘भेजे हैं’ व्यक्त करता है।
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  choice: बाल-ज़बूब से पूछने के लिए
  rationale: דרש इस प्रसंग में किसी देवता से दैवी संदेश या उत्तर पाने के लिए परामर्श करने को दर्शाता है; ‘से पूछना’ साधारण हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: एक्रोन के देवता
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक अनुवाद।
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: क्या इस्राएल में कोई परमेश्वर नहीं है
  rationale: मूल के भर्त्सनापूर्ण आलंकारिक प्रश्न को प्रश्न के रूप में ही रखा गया है।
- source_word: לִדְרֹשׁ בִּדְבָרוֹ
  choice: कि उसके वचन के विषय में पूछा जाए
  rationale: דָּבָר (‘वचन/बात’) को हटाए बिना हिन्दी में बोधगम्य अभिव्यक्ति चुनी गई है; यह परमेश्वर से दैवी उत्तर या संदेश माँगने की ओर संकेत करता है।
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: जिस पलंग पर तू चढ़ा है, उस पर से तू नहीं उतरेगा
  rationale: ‘चढ़ना/उतरना’ की मूल स्थानिक छवि और आगे रखे गए ‘पलंग’ पर बल, दोनों को स्वाभाविक हिन्दी संबंधवाचक रचना में सुरक्षित रखा गया है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय ही मर जाएगा
  rationale: सजातीय अनंत क्रिया और सीमित क्रिया से उत्पन्न emphatic certainty को ‘निश्चय ही’ व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम יהוה है; ‘याहवे’ उसे सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: कोई देवता
  rationale: रूप व्याकरणतः बहुवचन हो सकता है, पर इस्राएल के परमेश्वर की ओर संकेत करने वाले इस आलंकारिक प्रश्न में अर्थ एकवचन है।
- issue: राजा को संबोधन
  choice: तू
  alternative: तुम / आप
  rationale: मूल में संबोधन एकवचन है और भविष्यद्वक्तीय न्याय-वचन सीधा तथा प्रखर है; ‘तू’ इस निकट, न्यायसूचक स्वर को बनाए रखता है, न कि अनादर जोड़ने के लिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। भविष्यद्वक्तीय सूत्र के लिए ‘यों कहता है’ और निश्चित न्याय के लिए ‘निश्चय ही’ प्रयुक्त हैं। मूल की सर्वनामगत अस्पष्टता तथा पलंग को आगे रखकर दिए गए बल को बनाए रखा गया है।
