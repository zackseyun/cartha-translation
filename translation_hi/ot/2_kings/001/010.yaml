  text: וַ/יַּעֲנֶ֣ה אֵלִיָּ֗הוּ וַ/יְדַבֵּר֮ אֶל שַׂ֣ר הַ/חֲמִשִּׁים֒ וְ/אִם אִ֤ישׁ אֱלֹהִים֙ אָ֔נִי תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וְ/תֹאכַ֥ל אֹתְ/ךָ֖ וְ/אֶת חֲמִשֶּׁ֑י/ךָ וַ/תֵּ֤רֶד אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ/תֹּ֥אכַל אֹת֖/וֹ וְ/אֶת חֲמִשָּֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/010.yaml
  text: Elijah answered and said to the captain of fifty, “But if I am a man of God, let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: hi
  text: एलिय्याह ने पचास सैनिकों के सरदार को उत्तर दिया, “पर यदि मैं परमेश्वर का जन हूँ, तो आकाश से आग उतरे और तुझे और तेरे पचास जनों को भस्म कर दे।” तब आकाश से आग उतरी और उसे और उसके पचास जनों को भस्म कर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׂר הַחֲמִשִּׁים
  choice: पचास सैनिकों का सरदार
  rationale: शाब्दिक अर्थ ‘पचास का सरदार’ है; ‘सैनिकों’ को स्पष्ट करके सैन्य पद का स्वाभाविक हिन्दी अर्थ व्यक्त किया गया है।
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह भविष्यद्वक्ता के लिए प्रयुक्त प्रतिष्ठित पद है; हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर का जन’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: תֹאכַל
  choice: भस्म कर दे
  rationale: आग के कर्ता होने पर मूल क्रिया ‘खा जाना/नष्ट करना’ का स्वाभाविक हिन्दी रूप ‘भस्म करना’ है।
- source_word: חֲמִשֶּׁיךָ / חֲמִשָּׁיו
  choice: तेरे पचासों / उसके पचासों
  rationale: संज्ञीकृत संख्या उस सरदार के अधीन पचास जनों को सूचित करती है; संदर्भानुसार इसे सैनिक-दल के रूप में समझना सहज है।
theological_decisions:
- issue: וְאִם के आरंभिक संयोजक का अर्थ
  choice: पर यदि
  alternative: यदि
  rationale: וְ के विरोधात्मक/प्रत्युत्तरात्मक बल को ‘पर’ से रखा गया है, जबकि शर्त की वास्तविकता या वक्ता की आत्म-पहचान को अतिरिक्त रूप से व्याख्यायित नहीं किया गया।
- issue: आग के उतरने की वाक्य-विधि
  choice: उतरे ... भस्म कर दे
  alternative: उतरेगी ... भस्म करेगी
  rationale: हिब्रू युस्सिव भाव को आज्ञार्थक/कामनार्थक हिन्दी में रखा गया है, ताकि इसे केवल भविष्यवाणी बनाकर मूल तनाव को समाप्त न किया जाए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। सैन्य संदर्भ की स्पष्टता के लिए पहले पदबंध में ‘सैनिकों’ जोड़ा गया है; पुनरुक्ति में मूल के संक्षिप्त ‘पचासों’ को बनाए रखा गया है।
