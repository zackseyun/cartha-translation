  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
translation:
  language: hi
  text: तब उसने उनसे पूछा, “जो आदमी तुमसे मिलने आया और तुमसे ये बातें कहीं, उसका हुलिया कैसा था?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह किस प्रकार का आदमी था?” इब्रानी में शाब्दिक रूप से, “उस आदमी का मिश्पाट क्या था?” यहाँ यह शब्द उसके ढंग, वर्णन या बाहरी रूप को सूचित कर सकता है; अगले पद के उत्तर को देखते हुए सम्भवतः उसकी पहचान करानेवाला हुलिया अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט
  choice: उसका हुलिया कैसा था
  rationale: यहाँ प्रश्न उस व्यक्ति की पहचान करानेवाली बाहरी विशेषताओं के बारे में है, जैसा कि अगले पद में उसके पहनावे और रूप-विन्यास का वर्णन दिखाता है। ‘हुलिया’ आधुनिक हिन्दी में स्वाभाविक रूप से पहचान-संबंधी वर्णन व्यक्त करता है।
- source_word: הָאִישׁ
  choice: जो आदमी
  rationale: यह उन दूतों से मिलनेवाले निश्चित व्यक्ति को सूचित करता है; संबंधवाचक रचना हिन्दी में प्रश्न को सहज बनाती है।
- source_word: עָלָה לִקְרַאתְכֶם
  choice: तुमसे मिलने आया
  rationale: לִקְרַאתְכֶם का स्वाभाविक अर्थ ‘तुमसे मिलने’ है। עָלָה में ऊपर आने का शाब्दिक भाव है, पर हिन्दी में इस प्रसंग में ‘ऊपर आया’ अनावश्यक रूप से भौगोलिक दिशा पर बल देता; ‘आया’ आगमन का अपेक्षित भाव सुरक्षित रखता है।
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: उसने उनसे पूछा
  rationale: क्रिया का मूल अर्थ ‘कहा/बोला’ है, पर इसके बाद प्रत्यक्ष प्रश्न आता है; इसलिए हिन्दी में ‘पूछा’ वही वाक्य-कार्य स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: וַיְדַבֵּר אֲלֵיכֶם אֶת הַדְּבָרִים הָאֵלֶּה
  choice: तुमसे ये बातें कहीं
  rationale: यह निकट और सहज अनुवाद है, जो संदेश को किसी अतिरिक्त व्याख्या के बिना बहुवचन ‘बातें’ के रूप में बनाए रखता है।
