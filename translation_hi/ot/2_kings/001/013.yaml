  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
translation:
  language: hi
  text: फिर उसने पचास सैनिकों के दल का तीसरा सरदार उसके पचास सैनिकों के साथ भेजा। वह ऊपर चढ़कर आया। पचास सैनिकों के दल का वह तीसरा सरदार एलिय्याह के सामने घुटनों के बल झुका, उससे विनती की और उससे कहा, “हे परमेश्वर के जन, कृपया मेरा जीवन और आपके इन पचास सेवकों का जीवन आपकी दृष्टि में बहुमूल्य हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कृपया मेरा प्राण और आपके इन पचास सेवकों का प्राण आपकी दृष्टि में बहुमूल्य हो।” यहाँ इब्रानी शब्द नेफ़ेश का अर्थ प्रसंग के अनुसार “जीवन,” “प्राण,” “स्वयं” या “आत्मा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב וַיִּשְׁלַח
  choice: फिर उसने ... भेजा
  rationale: וישב यहाँ लौटने की भौतिक क्रिया से अधिक पुनरावृत्ति सूचित करता है; आधुनिक हिन्दी में ‘फिर’ कथा-क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁים וַחֲמִשָּׁיו
  choice: पचास सैनिकों के एक तीसरे सरदार को उसके पचास सैनिकों के साथ
  rationale: ‘तीसरे’ से क्रम और ‘सरदार’ से सैन्य अधिकारी का भाव सुरक्षित है। ‘सैनिक’ मूल में निहित समूह को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: וַיַּעַל וַיָּבֹא
  choice: वह ऊपर चढ़कर ... के पास आया
  rationale: दोनों क्रियाओं की गति को रखा गया है; ‘के पास’ प्रसंग से निहित लक्ष्य एलिय्याह को स्पष्ट करता है।
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  choice: घुटनों के बल झुका
  rationale: यह शारीरिक मुद्रा और विनम्रता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְחַנֵּן אֵלָיו
  choice: उससे विनती की
  rationale: हित्पएल रूप की गिड़गिड़ाकर कृपा माँगने की तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: हे परमेश्वर के जन
  rationale: भविष्यद्वक्ता के प्रचलित सम्मानसूचक पद और सम्बोधन-भाव दोनों सुरक्षित हैं।
- source_word: תִּיקַר נָא ... בְּעֵינֶיךָ
  choice: कृपया ... अपनी दृष्टि में बहुमूल्य समझ
  rationale: ‘बहुमूल्य’ मूल के मूल्यवान/प्रिय होने के रूपक को बचाता है; केवल ‘प्राण बख्श’ कहना आशय तो देता, पर रूपक मिटा देता।
- source_word: נַפְשִׁי וְנֶפֶשׁ
  choice: मेरा जीवन और ... का जीवन
  rationale: मृत्यु के तात्कालिक संकट में נֶפֶשׁ व्यक्ति के जीवन को सूचित करता है; ‘आत्मा’ यहाँ अनावश्यक दार्शनिक अर्थ ला सकता है।
- source_word: עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  choice: अपने इन पचास सेवकों
  rationale: ‘सेवक’ सम्बोधित व्यक्ति के प्रति अधीनता को बनाए रखता है और ‘इन पचास’ मूल की संख्या तथा संकेतवाचकता को सुरक्षित रखता है।
theological_decisions:
- issue: जीवन-संकट के प्रसंग में נֶפֶשׁ का अनुवाद
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: अधिकारी अपने और अपने लोगों के मृत्यु से बचने की विनती कर रहा है। ‘जीवन’ प्रसंगगत अर्थ देता है और मनुष्य की संरचना के विषय में बाद की किसी विशिष्ट धारणा को पाठ में नहीं जोड़ता।
- issue: אִישׁ הָאֱלֹהִים की उपाधि
  choice: परमेश्वर के जन
  alternative: ईश्वर का मनुष्य / परमेश्वर का पुरुष
  rationale: ‘परमेश्वर के जन’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और इस भविष्यद्वक्तीय उपाधि के लिए पर्याप्त रूप से औपचारिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल और गरिमापूर्ण रखी गई है। सैन्य पद को समझने योग्य बनाने के लिए ‘पचास सैनिकों का सरदार’ प्रयोग किया गया है। विनती में मूल का ‘बहुमूल्य’ रूपक सुरक्षित रखा गया है।
