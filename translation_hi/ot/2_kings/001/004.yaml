id: 2KI.1.4
reference: 2 Kings 1:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָ/כֵן֙ כֹּֽה אָמַ֣ר יְהוָ֔ה הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּ֣י מ֣וֹת תָּמ֑וּת וַ/יֵּ֖לֶךְ אֵלִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/004.yaml
  text: 'Therefore[a], this is what Yahweh says: ‘You will not come down from the bed that you have gone up onto[c][b], for you will surely die.’ And Elijah went.'
translation:
  language: hi
  text: 'इसलिए याहवे यों कहता है: ‘जिस पलंग पर तुम चढ़े हो, उस पर से तुम नीचे नहीं उतरोगे, क्योंकि तुम निश्चय मर जाओगे।’ तब एलिय्याह चला गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָכֵן
  choice: इसलिए
  rationale: यह पिछले पद में दिए गए धिक्कार और उसके फलस्वरूप घोषित दण्ड के बीच निष्कर्षसूचक संबंध स्पष्ट करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: यहोवा यों कहता है
  rationale: आधुनिक, स्वाभाविक हिन्दी में भविष्यद्वक्ताओं का मानक संदेशवाहक सूत्र सुरक्षित रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि में बदले बिना लिप्यंतरित किया गया है।
- source_word: הַמִּטָּה
  choice: पलंग
  rationale: מִטָּה का सामान्य अर्थ पलंग या बिछौना है; ‘रोग-शय्या’ प्रसंग से अधिक अर्थ जोड़ता।
- source_word: אֲשֶׁר עָלִיתָ שָּׁם
  choice: जिस पलंग पर तू चढ़ा है
  rationale: हिन्दी संबंधवाचक रचना में שׁם को अलग से ‘वहाँ’ कहना अनावश्यक और अस्वाभाविक होता; ‘चढ़ा’ रखने से आगे के ‘नीचे उतरना’ के साथ मूल ऊर्ध्व-अधो विरोध बना रहता है।
- source_word: לֹא תֵרֵד מִמֶּנָּה
  choice: उस पर से तू नीचे नहीं उतरेगा
  rationale: ‘नीचे उतरना’ ירד का स्वाभाविक हिन्दी रूप है और עלה के साथ जानबूझकर किया गया विरोध सुरक्षित रखता है।
- source_word: כִּי מוֹת תָּמוּת
  choice: क्योंकि तू निश्चय मर जाएगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute मृत्यु की निश्चितता पर बल देता है; ‘निश्चय’ उस बल को स्पष्ट करता है।
- source_word: וַיֵּלֶךְ אֵלִיָּה
  choice: तब एलिय्याह चला गया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम दिखाता है और הלך का सरल अर्थ ‘चला गया’ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार-अक्षरी व्यक्तिगत नाम है। हिन्दी बाइबल-पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम के रूप को स्पष्ट रखते हुए सहज और पहचाना हुआ है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजा को संबोधित मूल एकवचन द्वितीय पुरुष रूपों के लिए ‘तू’ रखा गया है, क्योंकि ईश्वरीय घोषणा में यह सीधा संबोधन है; शैली अपमानसूचक बनाने का उद्देश्य नहीं रखती। ‘चढ़ा’ और ‘नीचे उतरेगा’ के द्वारा मूल का शब्दगत विरोध जानबूझकर सुरक्षित रखा गया है।
