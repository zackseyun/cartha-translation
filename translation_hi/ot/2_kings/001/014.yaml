source:
  edition: WLC
  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
translation:
  language: hi
  text: देखिए, आकाश से आग उतरी और उसने पहले दो पचास के सरदारों और उनके दलों[a] को भस्म कर दिया। पर अब मेरी जान आपकी दृष्टि में अनमोल हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके पचासों,” अर्थात् उनके अधीन पचास-पचास सैनिकों के दल।
    reason: lexical_alternative
  - marker: b
    text: या “मेरा जीवन आपकी दृष्टि में अनमोल हो।” यहाँ “जीवन” से आशय वक्ता की जान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह सामने के स्पष्ट तथ्य की ओर आदरपूर्ण और जोरदार ढंग से ध्यान खींचता है; आधुनिक हिंदी में स्वाभाविक है।
- source_word: יָרְדָה אֵשׁ מִן הַשָּׁמַיִם
  choice: आकाश से आग उतरी
  rationale: हिब्रू की क्रिया, कर्ता और स्रोत को स्वाभाविक हिंदी क्रम में रखते हुए अर्थ को निकटता से व्यक्त करता है।
- source_word: וַתֹּאכַל
  choice: भस्म कर दिया
  rationale: आग के कर्ता होने पर אכל के विनाशकारी अर्थ के लिए यह स्वाभाविक हिंदी प्रयोग है।
- source_word: שְׁנֵי שָׂרֵי הַחֲמִשִּׁים הָרִאשֹׁנִים
  choice: पहले के दोनों पचास-पतियों
  rationale: שׂרֵי הַחֲמִשִּׁים सैन्य दलों के उन अधिकारियों को दर्शाता है जिनमें प्रत्येक पचास सैनिकों का प्रधान था; הָרִאשֹׁנִים कथा में पहले आए दोनों अधिकारियों की ओर संकेत करता है।
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  choice: और उनके पचास-पचास सैनिकों
  rationale: हिब्रू का शाब्दिक भाव ‘उनके पचासों’ है; हिंदी में यह चयन संबंधित पचास-सदस्यीय सैन्य दलों को स्पष्ट और सहज रूप से बताता है।
- source_word: וְעַתָּה
  choice: पर अब
  rationale: पहले हुए न्याय से वर्तमान विनती की ओर आने वाला प्रसंगगत विरोध स्पष्ट करता है।
- source_word: תִּיקַר נַפְשִׁי בְּעֵינֶיךָ
  choice: मेरी जान आपकी दृष्टि में अनमोल ठहरे
  rationale: יקר के ‘बहुमूल्य समझे जाने’ के भाव और נֶפֶשׁ के इस प्रसंग में जीवित प्राण/जीवन के अर्थ को सुरक्षित रखता है; ‘आपकी दृष्टि में’ हिब्रू मुहावरे का गरिमापूर्ण हिंदी रूप है।
theological_decisions:
- issue: जीवन बचाने की विनती में נֶפֶשׁ का अनुवाद
  choice: जान
  alternative: प्राण; आत्मा
  rationale: वक्ता पिछले दलों की तरह मारे जाने से बचने की विनती कर रहा है। ‘जान’ इस ठोस जीवन-संबंधी अर्थ को स्वाभाविक हिंदी में व्यक्त करता है और ‘आत्मा’ से उत्पन्न हो सकने वाले अनावश्यक शरीर-आत्मा द्वैत को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘पचास-पति’ प्राचीन सैन्य पद को संक्षेप में बनाए रखता है, जबकि साथ का ‘पचास-पचास सैनिकों’ उसके दल का अर्थ स्पष्ट करता है। आदरसूचक ‘देखिए/आपकी’ अधिकारी की विनम्र विनती के अनुरूप है।
