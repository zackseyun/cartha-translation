source:
  edition: WLC
  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
translation:
  language: hi
  text: तब वह याहवे के उस वचन के अनुसार मर गया, जो एलिय्याह ने कहा था। और उसके स्थान पर यहोराम यहूदा के राजा यहोशापात के पुत्र यहोराम के दूसरे वर्ष में राजा हुआ, क्योंकि मरने वाले राजा का कोई पुत्र नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: तब वह मर गया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है और क्रिया के सीधे अर्थ ‘मर गया’ को बनाए रखता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के उस वचन के अनुसार
  rationale: כִּדְבַר बताता है कि घटना पहले कहे गए वचन के अनुरूप हुई; संकेतवाचक ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से वचन को सहज रूप से जोड़ता है।
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  choice: जो एलिय्याह ने कहा था
  rationale: संबंधवाचक उपवाक्य सीधे पहले उल्लिखित वचन को विशेषित करता है। ‘कहा था’ मृत्यु से पहले कहे जाने को स्वाभाविक हिन्दी में दर्शाता है, बिना ‘एलिय्याह के द्वारा’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: וַיִּמְלֹךְ יְהוֹרָם תַּחְתָּיו
  choice: और उसके स्थान पर यहोराम राजा हुआ
  rationale: यहाँ מלך उत्तराधिकार और राजारोहण को सूचित करता है। ‘राजा हुआ’ इस प्रसंग में स्वाभाविक है, जबकि תַּחְתָּיו का अर्थ ‘उसके स्थान पर’ स्पष्ट रूप से रखा गया है।
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם
  choice: यहोशापात के पुत्र यहोराम के दूसरे वर्ष में
  rationale: यह राजकीय कालगणना का सूत्र है। हिन्दी में ‘दूसरे वर्ष में’ इसका सहज और सटीक रूप है।
- source_word: בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोशापात के पुत्र
  rationale: शब्दक्रम को हिन्दी के अनुरूप करके यह स्पष्ट किया गया है कि यह दूसरे यहोराम, अर्थात यहूदा के राजा यहोशापात के पुत्र, की पहचान है।
- source_word: כִּי לֹא הָיָה לוֹ בֵּן
  choice: क्योंकि उसका कोई पुत्र नहीं था
  rationale: כִּי यहाँ कारण बताता है कि उत्तराधिकारी उसका पुत्र नहीं बल्कि यहोराम हुआ। ‘उसका’ का संदर्भ प्रसंग में मरने वाले राजा से है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। लंबे कालगणना-वाक्य को स्पष्टता के लिए अलग वाक्य बनाया गया है, पर मूल के सभी संबंध और कारण सुरक्षित हैं।
