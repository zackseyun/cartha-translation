  terminology: ‘याहवे,’ ‘एलिय्याह,’ ‘यहोशापात,’ and ‘यहो राम’ are consistently rendered as ‘याहवे,’ ‘एलिय्याह,’ ‘यहोशापात,’ and ‘यहो राम’ in the draft; retaining the draft’s established spelling ‘यहो राम’ without a space is preferable. ‘राजा हुआ’ is a suitable concise rendering of accession.
