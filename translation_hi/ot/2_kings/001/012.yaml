base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
translation:
  language: hi
  text: एलिय्याह ने उन्हें उत्तर देकर कहा, “यदि मैं परमेश्वर का जन हूँ[a], तो स्वर्ग से आग उतरे और तुझे और तेरे पचास लोगों[b] को भस्म कर दे।” तब परमेश्वर की आग[c] स्वर्ग से उतरी और उसने उसे और उसके पचास लोगों को भस्म कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं परमेश्वर का वह जन हूँ।”
    reason: इब्रानी पदबंध को निश्चित पदवी के रूप में भी समझा जा सकता है।
  - marker: b
    text: शाब्दिक रूप से, “तेरे पचास”; अर्थात उस सेनापति के अधीन पचास पुरुषों का दल।
    reason: संक्षिप्त इब्रानी सैन्य अभिव्यक्ति को स्पष्ट करने के लिए।
  - marker: c
    text: या, “तब परमेश्वर की ओर से आग स्वर्ग से उतरी।”
    reason: אֵשׁ אֱלֹהִים संबंधवाचक ‘परमेश्वर की आग’ अथवा स्रोतवाचक ‘परमेश्वर की ओर से आग’ हो सकता है।
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵיהֶם
  choice: एलिय्याह ने उन्हें उत्तर दिया
  rationale: यह सहज हिन्दी में उत्तर की कथात्मक भूमिका और बहुवचन ‘उन्हें’ दोनों को सुरक्षित रखता है; अलग से ‘और कहा’ जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह भविष्यद्वक्ता के लिए प्रयुक्त इब्रानी पदवी का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; ‘जन’ मूल के पुरुषवाचक आशय को संदर्भ में बनाए रखते हुए हिन्दी की स्थापित धार्मिक अभिव्यक्ति देता है।
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  choice: स्वर्ग से आग उतरे
  rationale: क्रिया के इच्छार्थक/आह्वानात्मक बल को ‘उतरे’ से व्यक्त किया गया है, न कि इसे केवल भविष्यवाणी के रूप में ‘उतरेगी’ कहा गया है।
- source_word: וְתֹאכַל
  choice: भस्म कर दे
  rationale: आग के कर्ता होने पर אכל का स्वाभाविक हिन्दी प्रयोग ‘भस्म करना’ है और यह पूर्ण विनाश का आशय स्पष्ट करता है।
- source_word: חֲמִשֶּׁיךָ
  choice: तेरे पचास जनों
  rationale: शाब्दिक ‘तेरे पचास’ उस सेनापति के अधीन पचास पुरुषों के दल को सूचित करता है; हिन्दी में बोधगम्यता के लिए ‘जनों’ जोड़ा गया है।
- source_word: וַתֵּרֶד אֵשׁ אֱלֹהִים מִן הַשָּׁמַיִם
  choice: तब परमेश्वर की आग स्वर्ग से उतरी
  rationale: यह אֵשׁ אֱלֹהִים को संबंधवाचक रचना के रूप में रखता और आग के परमेश्वर से संबंध को स्पष्ट करता है, बिना उसके स्वरूप या प्रक्रिया की अतिरिक्त व्याख्या किए।
- source_word: וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  choice: उसने उसे और उसके पचास जनों को भस्म कर दिया
  rationale: ‘उसने’ आग को कर्ता के रूप में स्पष्ट करता है और कप्तान तथा उसके दल के बीच मूल का भेद बनाए रखता है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים में पदवी और निश्चितता
  choice: परमेश्वर का जन
  alternative: परमेश्वर का वह जन
  rationale: वाक्य में यह विधेय के रूप में भविष्यद्वक्ताई पहचान का दावा है। मुख्य पाठ स्वाभाविक हिन्दी पदवी रखता है; निश्चित अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- issue: אֵשׁ אֱלֹהִים में संबंध का अर्थ
  choice: परमेश्वर की आग
  alternative: परमेश्वर की ओर से आग
  rationale: मूल पद आग को स्पष्ट रूप से परमेश्वर से जोड़ता है, पर संबंधवाचक रचना स्रोत, स्वामित्व या विशिष्ट दैवी आग के बीच कुछ खुलापन रखती है। मुख्य पाठ निकट रूप देता है और स्रोतवाचक विकल्प पादटिप्पणी में रखता है।
- issue: एलिय्याह के कथन का व्याकरणिक बल
  choice: स्वर्ग से आग उतरे
  alternative: स्वर्ग से आग उतरेगी
  rationale: इब्रानी रूप को निवेदन/आह्वान के रूप में प्रस्तुत करना उचित है; इसे निश्चित भविष्यवाणी बनाना मूल की धार्मिक और कथात्मक तन्यता को अनावश्यक रूप से हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। प्रत्यक्ष संबोधन में एकवचन ‘तुझे/तेरे’ सेनापति को लक्ष्य करता है, जबकि आरंभ का ‘उन्हें’ उपस्थित समूह को दर्शाता है। ‘भस्म कर देना’ आग के संदर्भ में स्वाभाविक है और मूल की तीव्रता बनाए रखता है।
