  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: The rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: अहज्याह के बाकी काम, जो उसने किए थे—क्या वे ‘इस्राएल के राजाओं के इतिहास की पुस्तक’[b] में लिखे[a] नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दर्ज किए’। इब्रानी में अक्षरशः ‘लिखे’ लिखा है; यह राजकीय अभिलेखों का उल्लेख करने वाला एक प्रचलित सूत्र है।
    reason: lexical_alternative
  - marker: b
    text: ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ राजाओं की पुस्तक में उद्धृत एक राजकीय वृत्तांत-स्रोत था; यह आवश्यक नहीं कि इससे बाइबल की पुस्तक इतिहास-वृत्तांत अभिप्रेत हो।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  choice: बाकी
  rationale: यह राजकीय शासन-विवरण के समापन का प्रचलित सूत्र है। ‘बाकी’ शेष कार्यों का अर्थ स्वाभाविक रूप से व्यक्त करता है; आरंभिक וְ के लिए अलग से ‘और’ आवश्यक नहीं है।
- source_word: דִּבְרֵי
  choice: काम
  rationale: राजकीय सारांश में यह शब्द केवल कथनों को नहीं, बल्कि राजा के कार्यों और शासन-संबंधी घटनाओं को व्यापक रूप से दर्शाता है।
- source_word: אֲחַזְיָהוּ
  choice: अहज्याह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किए थे
  rationale: यह संबंधवाचक उपवाक्य ‘काम’ को स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: हिब्रू में यह सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी रूप उसी प्रश्नात्मक बल को बनाए रखता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: עַל का अक्षरशः अर्थ ‘पर’ हो सकता है, पर अभिलेख-सूत्र में हिन्दी मुहावरे के अनुसार ‘पुस्तक में’ अधिक स्वाभाविक है।
- source_word: דִּבְרֵי הַיָּמִים
  choice: इतिहास
  rationale: यहाँ पदबंध राजकीय वार्षिक वृत्तांत या अभिलेख को सूचित करता है। ‘इतिहास’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और इसे बाइबल की ‘इतिहास-वृत्तांत’ पुस्तक मान लेने की संभावना घटाता है।
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के
  rationale: दस्तावेज़ के शीर्षक में לְ का संबंधसूचक अर्थ है; हिन्दी में ‘के’ स्वाभाविक रूप है।
