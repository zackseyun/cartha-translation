  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल का आलंकारिक प्रश्न और राजकीय समापन-सूत्र सुरक्षित हैं। पुस्तक के शीर्षक को उद्धरण-चिह्नों में रखा गया है, और दोनों पाद-टिप्पणी चिह्न संबंधित शब्द या पदबंध के तुरंत बाद दिए गए हैं।
