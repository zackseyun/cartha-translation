  yaml_path: translation/ot/2_kings/001/005.yaml
  text: The messengers returned to him[a], and he said to them, “Why have you returned?”
translation:
  language: hi
  text: तब दूत उसके पास लौट आए। उसने उनसे कहा, “तुम क्यों लौट आए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: लौट आए
  rationale: שׁוב यहाँ भेजने वाले व्यक्ति के पास वापस आने को दर्शाता है; ‘लौट आए’ स्वाभाविक और दिशासूचक है।
- source_word: הַמַּלְאָכִים
  choice: दूत
  rationale: संदर्भ में ये राजा द्वारा भेजे गए मनुष्य हैं, स्वर्गदूत नहीं; इसलिए ‘दूत’ सटीक और सहज है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: पूर्वसर्ग राजा की ओर लौटने की दिशा बताता है; हिंदी में ‘उसके पास’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: उसने उनसे कहा
  rationale: इब्रानी के सामान्य कथन-क्रिया रूप को बनाए रखता है, यद्यपि आगे प्रश्न है।
- source_word: מַה זֶּה
  choice: क्यों
  rationale: शाब्दिक रूप ‘यह क्या है कि...’ है, पर इस प्रसंग में यह कारण पूछने वाला मुहावरा है; ‘क्यों’ आधुनिक हिंदी में उसका स्वाभाविक अर्थ देता है।
- source_word: שַׁבְתֶּם
  choice: तुम लौट आए
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन है; ‘तुम लौट आए’ अनेक संबोधित दूतों और पूर्ण हो चुकी वापसी को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
