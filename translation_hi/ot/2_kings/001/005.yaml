  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। वाक्य के आरंभ में ‘तब’ इब्रानी कथानक-क्रम को सहज हिंदी में व्यक्त करता है। ‘दूत’ को संदर्भ के अनुसार मानवीय संदेशवाहकों के अर्थ में लिया गया है।
