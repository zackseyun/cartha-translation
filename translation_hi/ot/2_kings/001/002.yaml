source:
  edition: WLC
  text: וַ/יִּפֹּ֨ל אֲחַזְיָ֜ה בְּעַ֣ד הַ/שְּׂבָכָ֗ה בַּ/עֲלִיָּת֛/וֹ אֲשֶׁ֥ר בְּ/שֹׁמְר֖וֹן וַ/יָּ֑חַל וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ לְכ֣וּ דִרְשׁ֗וּ בְּ/בַ֤עַל זְבוּב֙ אֱלֹהֵ֣י עֶקְר֔וֹן אִם אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
translation:
  language: hi
  text: अहज्याह सामरिया में अपने ऊपरी कमरे की जाली में से गिर पड़ा और बीमार पड़ गया। तब उसने दूत भेजे और उनसे कहा, “जाओ और एक्रोन के देवता बाल-ज़बूब[a] से पूछो कि क्या मैं इस बीमारी से ठीक हो जाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस नाम का रूप ‘बाल-ज़बूब’ है; बाद का रूप ‘बीलज़बूब’ यूनानी और कुछ अनुवाद-परंपराओं में मिलता है।
    reason: नाम के इब्रानी रूप और बाद की परिचित परंपरागत वर्तनी के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  choice: जाली से नीचे
  rationale: यह पदबंध जालीदार खुले भाग में से गिरने का चित्र प्रस्तुत करता है। हिन्दी में ‘जाली से नीचे गिर पड़ा’ स्वाभाविक है और गति की दिशा को स्पष्ट करता है।
- source_word: עֲלִיָּתוֹ
  choice: अपने ऊपरी कमरे
  rationale: עֲלִיָּה भवन के ऊपरी भाग में स्थित कमरे को दर्शाता है; ‘ऊपरी कमरा’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וַיָּחַל
  choice: बीमार पड़ गया
  rationale: חלה का सामान्य अर्थ बीमार पड़ना है। गिरने के बाद की शारीरिक दशा संदर्भ से जुड़ी है, पर मूल शब्द स्पष्ट रूप से केवल ‘घायल’ नहीं कहता; इसलिए स्रोत की व्यापकता सुरक्षित रखी गई है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस राजकीय कथानक में ये मनुष्य हैं जिन्हें राजा भेजता है; ‘दूत’ उपयुक्त और संक्षिप्त है।
- source_word: דִרְשׁוּ
  choice: से पूछो
  rationale: यहाँ क्रिया किसी देवता से भविष्य के विषय में उत्तर जानने या देववाणी लेने के अर्थ में है। ‘से पूछो’ सामान्य पाठक के लिए स्वाभाविक है और धार्मिक परामर्श का आशय संदर्भ से स्पष्ट रहता है।
- source_word: בַּעַל זְבוּב
  choice: बाल-जबूब
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है; बाद की यूनानी-प्रभावित नाम-रूप परंपरा को मुख्य पाठ पर प्राथमिकता नहीं दी गई।
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: एक्रोन के देवता
  rationale: सम्बन्धवाचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: אִם אֶחְיֶה מֵחֳלִי זֶה
  choice: क्या मैं इस बीमारी से ठीक हो जाऊँगा
  rationale: शाब्दिक रूप ‘क्या मैं इस बीमारी से जीवित रहूँगा’ के निकट है, पर इस प्रसंग में प्रश्न स्वास्थ्य-लाभ का है। ‘ठीक हो जाऊँगा’ अनिश्चितता और बीमारी से उबरने—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: स्थान-नाम का हिन्दी बाइबल परंपरा में प्रचलित और पहचानने योग्य रूप।
theological_decisions:
- issue: गैर-इस्राएली देवता के नाम का रूप
  choice: बाल-जबूब
  alternative: बीलजबूल/बीलजबूब
  rationale: मुख्य पाठ इब्रानी בַּעַל זְבוּב के रूप का अनुसरण करता है। बाद का यूनानी-प्रभावित और अधिक परिचित रूप पाठांतर-सूचना के रूप में रखा गया है, मूल इब्रानी पर आरोपित नहीं किया गया।
- issue: गिरने के बाद וַיָּחַל का अर्थ
  choice: बीमार पड़ गया
  alternative: घायल हो गया
  rationale: मूल क्रिया बीमारी या अस्वस्थता को व्यक्त करती है और आगे חֳלִי ‘बीमारी’ उसी दशा का उल्लेख करता है। गिरने के कारण चोट लगना संभावित है, पर ‘घायल’ चुनने से मूल की व्यापक अभिव्यक्ति अनावश्यक रूप से सीमित हो सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। घटनाक्रम को छोटे, स्पष्ट वाक्यों में रखा गया है। फुटनोट-चिह्न उसी नाम के बाद लगाया गया है जिससे टिप्पणी संबंधित है।
