    issue: Military title is phrased unnaturally.
    rationale: ‘पचास-सैनिकों के नायक’ is a calqued compound. Modern Hindi more naturally says ‘पचास सैनिकों के सेनापति.’
  - severity: low
    issue: The directional implication in ‘उतर आओ’ lacks the corresponding lexical note.
    rationale: The Hebrew imperative means ‘go down/descend.’ In context, ‘उतर आओ’ is defensible, but a footnote should make clear that movement toward the messenger is interpretive rather than encoded in the verb.
