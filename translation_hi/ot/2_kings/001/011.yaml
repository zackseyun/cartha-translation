  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘राजा’ को कर्ता के रूप में स्पष्ट किया गया है क्योंकि पिछले प्रसंग से इब्रानी सर्वनाम का संकेत उसी की ओर है। रֵדָה के लिए ‘नीचे उतर आओ’ संदर्भानुकूल है; मूल क्रिया अपने आप में केवल ‘नीचे उतरना’ बताती है, पर हिन्दी में वक्ता की ओर गति के कारण ‘आओ’ स्वाभाविक है।
