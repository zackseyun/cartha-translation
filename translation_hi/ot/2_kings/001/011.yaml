  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
translation:
  language: hi
  text: फिर राजा ने पचास सैनिकों के एक और सेनापति को उसके पचास सैनिकों समेत एलिय्याह के पास भेजा। उसने एलिय्याह से कहा, “परमेश्वर के जन, राजा यह कहता है, ‘तुरन्त नीचे उतर आओ।’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुरन्त नीचे उतरो।” इब्रानी क्रिया का अर्थ केवल “नीचे उतरना” है; “उतर आओ” उस संदेशवाहक की ओर नीचे आने के संदर्भानुकूल भाव को व्यक्त करता है।
    reason: lexical_alternative
