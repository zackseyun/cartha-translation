  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
translation:
  language: hi
  text: तब उसने एलिय्याह के पास पचास सैनिकों के एक अधिकारी को उसके पचास सैनिकों के साथ भेजा। वह ऊपर चढ़कर उसके पास पहुँचा। देखा, एलिय्याह पहाड़ी[a] की चोटी पर बैठा था। अधिकारी ने उससे कहा, “परमेश्वर के जन, राजा कहता है[b], ‘नीचे उतर आ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पर्वत।” इब्रानी הַר प्रसंग के अनुसार पहाड़ी या पर्वत, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शब्दशः, “राजा ने कहा है: ‘नीचे उतर आ।’” इब्रानी में दूत द्वारा संदेश सुनाने की सूत्रबद्ध अभिव्यक्ति में “कहा है” प्रयुक्त है; मुख्य पाठ में इसे स्वाभाविक हिन्दी में “कहता है” किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने ... भेजा
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שַׂר חֲמִשִּׁים
  choice: पचास सैनिकों का एक प्रधान
  rationale: यह पचास जनों की सैन्य टुकड़ी के अधिकारी को सूचित करता है; ‘प्रधान’ पद और नेतृत्व दोनों को संक्षेप में व्यक्त करता है।
- source_word: וַחֲמִשָּׁיו
  choice: उसके पचास सैनिकों समेत
  rationale: मूल में शब्दशः ‘उसके पचास’ है; सैन्य संदर्भ स्पष्ट करने के लिए हिन्दी में ‘सैनिकों’ जोड़ा गया है।
- source_word: וַיַּעַל אֵלָיו
  choice: वह ऊपर चढ़कर उसके पास पहुँचा
  rationale: עלה ऊँचाई की ओर गति बताता है; यह अनुवाद उस ऊर्ध्व दिशा और एलिय्याह तक पहुँचने, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: וְהִנֵּה
  choice: देखा
  rationale: यह अव्यय दृश्य को अचानक और सजीव रूप से सामने लाता है; ‘देखा’ आधुनिक कथा-भाषा में वही प्रभाव देता है।
- source_word: יֹשֵׁב
  choice: बैठा था
  rationale: कृदन्त उस समय जारी अवस्था या मुद्रा को व्यक्त करता है।
- source_word: עַל רֹאשׁ הָהָר
  choice: पहाड़ी की चोटी पर
  rationale: רֹאשׁ का अर्थ यहाँ ‘चोटी’ है और הַר प्रसंग के अनुसार पहाड़ी या पर्वत हो सकता है; मुख्य पाठ में सहज ‘पहाड़ी’ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיְדַבֵּר אֵלָיו
  choice: प्रधान ने उससे कहा
  rationale: דבר बोलने को दर्शाता है। हिन्दी में प्रत्यक्ष कथन से पहले ‘कहा’ स्वाभाविक है; अस्पष्ट सर्वनाम के स्थान पर कर्ता ‘प्रधान’ स्पष्ट किया गया है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह नबी के लिए प्रयुक्त मान्य उपाधि है; ‘परमेश्वर के जन’ इसका परिचित और गरिमापूर्ण हिन्दी रूप है।
- source_word: הַמֶּלֶךְ דִּבֶּר
  choice: राजा कहता है
  rationale: शब्दशः रूप ‘राजा ने कहा है’ है, पर यह दूत-संदेश की सूत्रबद्ध अभिव्यक्ति है; वर्तमानकालीन ‘कहता है’ हिन्दी में राजकीय संदेश का स्वाभाविक परिचय देता है और इसे अतिरिक्त रूप से ‘आज्ञा देता है’ नहीं बनाता।
- source_word: רֵדָה
  choice: नीचे उतर आ
  rationale: आज्ञार्थक क्रिया ירד नीचे आने को कहती है। वक्ता एलिय्याह से अपने स्थान की ओर उतरने को कह रहा है, इसलिए ‘उतर आ’ दिशासूचक भाव को सुरक्षित रखता है।
