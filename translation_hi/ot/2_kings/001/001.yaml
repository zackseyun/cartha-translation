  text: अहाब की मृत्यु के बाद मोआब ने इस्राएल के विरुद्ध विद्रोह किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְשַׁע
  choice: विद्रोह कर दिया
  rationale: राजनीतिक संदर्भ में פשע किसी अधिपति या प्रभुत्वशाली राज्य के विरुद्ध विद्रोह करने को दर्शाता है; पूर्णता और घटनात्मकता व्यक्त करने के लिए स्वाभाविक हिन्दी में ‘विद्रोह कर दिया’ उपयुक्त है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्र और भूभाग के नाम का मानक हिन्दी लिप्यंतरण।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: פשע के साथ ב उस सत्ता को सूचित करता है जिसके विरुद्ध विद्रोह किया गया; इसलिए ‘के विरुद्ध’ इस राजनीतिक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֲרֵי
  choice: के बाद
  rationale: यह विद्रोह के समय को अहाब की मृत्यु के पश्चात रखता है।
- source_word: מוֹת
  choice: मृत्यु
  rationale: अगले व्यक्तिवाचक नाम के साथ यह रचना ‘अहाब की मृत्यु’ के रूप में स्वाभाविक हिन्दी बनती है।
- source_word: אַחְאָב
  choice: अहाब
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
