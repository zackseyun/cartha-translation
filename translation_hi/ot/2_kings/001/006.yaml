  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אִ֣ישׁ עָלָ֣ה לִ/קְרָאתֵ֗/נוּ וַ/יֹּ֣אמֶר אֵלֵי/נוּ֮ לְכ֣וּ שׁוּבוּ֮ אֶל הַ/מֶּ֣לֶךְ אֲשֶׁר שָׁלַ֣ח אֶתְ/כֶם֒ וְ/דִבַּרְתֶּ֣ם אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הַֽ/מִ/בְּלִ֤י אֵין אֱלֹהִים֙ בְּ/יִשְׂרָאֵ֔ל אַתָּ֣ה שֹׁלֵ֔חַ לִ/דְרֹ֕שׁ בְּ/בַ֥עַל זְב֖וּב אֱלֹהֵ֣י עֶקְר֑וֹן לָ֠/כֵן הַ/מִּטָּ֞ה אֲשֶׁר עָלִ֥יתָ שָּׁ֛ם לֹֽא תֵרֵ֥ד מִמֶּ֖/נָּה כִּֽי מ֥וֹת תָּמֽוּת׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
translation:
  language: hi
  text: 'उन्होंने उससे कहा, “एक आदमी हमसे मिलने ऊपर आया और उसने हमसे कहा, ‘जाओ, जिस राजा ने तुम्हें भेजा है उसके पास लौट जाओ और उससे कहो, “याहवे यों कहते हैं: क्या इसलिए कि इस्राएल में परमेश्वर नहीं है[a], तुम एक्रोन के देवता बाल-ज़बूब से पूछताछ करने भेज रहे हो? इसलिए जिस पलंग पर तुम चढ़े हो, उससे तुम नीचे नहीं उतरोगे[b], क्योंकि तुम निश्चय मर जाओगे।”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या इस्राएल में परमेश्वर के अभाव के कारण तुम…?”
    reason: मूल इब्रानी मुहावरे की कारणसूचक संरचना का अधिक शाब्दिक विकल्प।
  - marker: b
    text: शाब्दिक रूप से, “जिस पलंग पर तुम वहाँ चढ़े हो।”
    reason: इब्रानी सम्बन्धवाचक वाक्य में ‘वहाँ’ पुनरुक्त रूप से उपस्थित है, जिसे स्वाभाविक हिन्दी मुख्य पाठ में नहीं दोहराती।
lexical_decisions:
- source_word: אִישׁ
  choice: एक आदमी
  rationale: दूत अभी एलिय्याह को नाम से नहीं पहचानते; इसलिए सामान्य पुल्लिंग संज्ञा और कथात्मक दृष्टिकोण सुरक्षित रहते हैं।
- source_word: עָלָה לִקְרָאתֵנוּ
  choice: हमसे मिलने आया
  rationale: עָלָה में ऊपर आने का भाव हो सकता है, पर इस प्रसंग में स्वाभाविक हिन्दी में वक्ताओं की ओर गति को ‘आया’ व्यक्त करता है; ‘ऊपर चढ़कर मिलने आया’ अनावश्यक रूप से असहज और संभावित रूप से भ्रामक होता।
- source_word: לְכוּ שׁוּבוּ
  choice: जाओ, ... लौट जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक रखा गया है।
- source_word: וְדִבַּרְתֶּם אֵלָיו
  choice: उससे कहो
  rationale: प्रत्यक्ष संदेश के परिचय में आधुनिक हिन्दी में ‘कहो’ स्वाभाविक है और דבר के संवादात्मक अर्थ को ठीक व्यक्त करता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेश-सूत्र है; हिन्दी में वर्तमानकालीन रूप इसकी घोषणात्मक शक्ति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  choice: क्या इसलिए कि इस्राएल में परमेश्वर नहीं है
  rationale: मूल के तीखे आलंकारिक प्रश्न और कारणसूचक संरचना दोनों को सुरक्षित रखा गया है।
- source_word: שֹׁלֵחַ לִדְרֹשׁ
  choice: पूछने के लिए दूत भेज रहे हो
  rationale: דרש यहाँ किसी देवता से दैवी उत्तर जानने के लिए परामर्श करने का अर्थ देता है; ‘पूछने’ के साथ दूत भेजने का संदर्भ इसे स्पष्ट करता है।
- source_word: בַּעַל זְבוּב
  choice: बाल-ज़बूब
  rationale: देवता के व्यक्तिवाचक नाम को अनुवादित करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי עֶקְרוֹן
  choice: एक्रोन के देवता
  rationale: सम्बन्धवाचक रचना उस देवता का एक्रोन नगर से सम्बन्ध स्पष्ट करती है।
- source_word: הַמִּטָּה
  choice: पलंग
  rationale: बीमारी के प्रसंग में מִטָּה के लिए ‘पलंग’ सामान्य, स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: אֲשֶׁר עָלִיתָ שָּׁם לֹא תֵרֵד מִמֶּנָּה
  choice: जिस पलंग पर तुम चढ़े हो, उससे तुम नीचे नहीं उतरोगे
  rationale: ऊपर चढ़ने और नीचे उतरने की मूल शब्दावली तथा मृत्यु की आसन्नता को बनाए रखते हुए सेमेटिक पुनरुक्ति ‘वहाँ’ को मुख्य पाठ में स्वाभाविक हिन्दी के लिए नहीं दोहराया गया।
- source_word: מוֹת תָּמוּת
  choice: तुम निश्चय मर जाओगे
  rationale: धातु की पुनरुक्ति से उत्पन्न निश्चितता और बल को ‘निश्चय’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना सीधे प्रस्तुत करता है।
- issue: אֱלֹהִים के आलंकारिक प्रश्न का आशय
  choice: इस्राएल में परमेश्वर नहीं है
  alternative: इस्राएल में कोई देवता नहीं है
  rationale: वाक्य का उद्देश्य इस्राएल के परमेश्वर के अस्तित्व और उपलब्धता की उपेक्षा पर व्यंग्यपूर्ण फटकार लगाना है। ‘परमेश्वर’ इस सन्दर्भ को व्यक्त करता है, जबकि प्रश्न की वास्तविक आलंकारिकता को ज्यों का त्यों छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सुबोध रखी गई है। उद्धरणों की कई परतों को स्पष्ट रखा गया है। ‘निश्चय मर जाओगे’ मूल की प्रबल निश्चितता व्यक्त करता है; पाठ किसी सम्प्रदायगत व्याख्या को नहीं जोड़ता।
