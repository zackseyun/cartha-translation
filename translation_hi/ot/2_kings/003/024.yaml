base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
translation:
  language: hi
  text: जब वे इस्राएल की छावनी में पहुँचे, तब इस्राएली उठ खड़े हुए और उन्होंने मोआबियों को मारा, और वे उनके सामने से भाग गए। फिर वे उसके भीतर गए[a] और मोआबियों को मारते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उस देश में गए” अथवा “वे मोआब में आगे बढ़े।” हिब्रू में शाब्दिक रूप से “वे उसके भीतर गए” है। स्त्रीलिंग प्रत्यय संभवतः लोगों के बजाय देश या क्षेत्र की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲנֵה
  choice: छावनी
  rationale: युद्ध के इस प्रसंग में यह सैन्य शिविर को दर्शाता है; ‘छावनी’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: וַיָּקֻמוּ
  choice: उठ खड़े हुए
  rationale: קום यहाँ युद्ध में निर्णायक ढंग से सक्रिय होने को दिखाता है; यह क्रिया की सजीवता बनाए रखता है, बिना सीधे ‘आक्रमण किया’ कहे।
- source_word: וַיַּכּוּ / וְהַכּוֹת
  choice: मारा / मारते गए
  rationale: נכה के ठोस युद्धार्थ को सुरक्षित रखा गया है; अंतिम infinitive construct की जारी कार्रवाई को ‘मारते गए’ व्यक्त करता है।
- source_word: וַיָּנֻסוּ מִפְּנֵיהֶם
  choice: वे उनके सामने से भाग गए
  rationale: हिब्रू मुहावरे में सामने या उपस्थिति से भागने का भाव है; यह हिन्दी में पराजित होकर भागने का स्वाभाविक वर्णन है।
- source_word: וַיָּבֹאוּ בָהּ
  choice: वे उसके भीतर घुसते गए
  rationale: בוא और स्त्रीलिंग एकवचन प्रत्यय की दिशा तथा अस्पष्ट पूर्वपद को यथासंभव बनाए रखते हुए आगे बढ़कर प्रवेश करने का भाव दिया गया है।
- source_word: מוֹאָב
  choice: मोआबी / मोआबियों
  rationale: यहाँ स्थान-नाम सामूहिक रूप से मोआब की सेना अथवा लोगों को सूचित करता है; हिन्दी में व्यक्तियों के लिए ‘मोआबी’ अधिक स्पष्ट और स्वाभाविक है।
