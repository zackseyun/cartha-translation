  text: וַ/יֹּֽאמְרוּ֙ דָּ֣ם זֶ֔ה הָחֳרֵ֤ב נֶֽחֶרְבוּ֙ הַ/מְּלָכִ֔ים וַ/יַּכּ֖וּ אִ֣ישׁ אֶת רֵעֵ֑/הוּ וְ/עַתָּ֥ה לַ/שָּׁלָ֖ל מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
translation:
  language: hi
  text: उन्होंने कहा, “यह तो खून है! राजा निश्चय ही आपस में लड़कर नष्ट हो गए हैं[a] और उन्होंने एक-दूसरे को मार गिराया है। अब, हे मोआब, लूट के लिए निकल पड़!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजाओं ने एक-दूसरे को पूरी तरह नाश कर दिया है।” इब्रानी में ‘नष्ट होना/करना’ क्रिया का बलाघाती रूप है; प्रसंग में इसका आशय है कि राजाओं ने मानो एक-दूसरे पर हमला कर दिया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  choice: यह तो खून है!
  rationale: इब्रानी का यह क्रियारहित विस्मयवाचक वाक्य है। ‘यह तो’ זֶה के संकेतात्मक बल और अचानक पहचान के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָחֳרֵב נֶחֶרְבוּ
  choice: आपस में लड़कर पूरी तरह बरबाद हो गए हैं
  rationale: धातु חרב के infinitive absolute और finite verb का मेल तीव्रता प्रकट करता है। निफ़अल रूप ‘बरबाद हो गए’ को बनाए रखते हुए ‘आपस में लड़कर’ अगले वाक्यांश से स्पष्ट होने वाली पारस्परिक लड़ाई को व्यक्त करता है।
- source_word: הַמְּלָכִים
  choice: राजा
  rationale: यह पहले उल्लिखित गठबंधन के निश्चित बहुवचन शासकों को सूचित करता है; हिन्दी में ‘राजा’ बहुवचन क्रिया के साथ स्वाभाविक है।
- source_word: וַיַּכּוּ אִישׁ אֶת־רֵעֵהוּ
  choice: और उन्होंने एक-दूसरे को मार गिराया है
  rationale: אישׁ את־רעהו पारस्परिक क्रिया बताता है। युद्ध के प्रसंग में ‘मार गिराया’ נכה के घातक प्रहार को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: וְעַתָּה
  choice: अब
  rationale: यह देखी हुई बात से उत्साहपूर्ण आह्वान की ओर तत्काल परिवर्तन दिखाता है।
- source_word: לַשָּׁלָל
  choice: लूट पर टूट पड़
  rationale: यह लूट की ओर बढ़ने का संक्षिप्त युद्धघोष है। ‘टूट पड़’ हिन्दी में उसकी तात्कालिकता और दिशात्मक बल को स्वाभाविक रूप देता है।
- source_word: מוֹאָב
  choice: हे मोआब
  rationale: मूल पाठ जाति या देश के नाम को संबोधन के रूप में रखता है। ‘हे मोआब’ उसी रूप और सामूहिक संबोधन को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘बरबाद’ सामान्य पाठक के लिए सहज है, जबकि ‘मार गिराया’ युद्ध के प्रसंग की तीव्रता बनाए रखता है। मुख्य पाठ में इब्रानी के निफ़अल रूप और प्रसंग से प्राप्त पारस्परिक अर्थ—दोनों को साथ रखा गया है; वैकल्पिक सकर्मक समझ को पादटिप्पणी में सुरक्षित किया गया है।
