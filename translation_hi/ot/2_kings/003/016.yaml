base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
translation:
  language: hi
  text: 'उसने कहा, “याहवे[a] यों कहता है: ‘इस नाले[b] में जगह-जगह गड्ढे खोदो।’[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे” हिब्रू ईश्वरीय नाम יהוה (YHWH) का लिप्यंतरण है; पारंपरिक रूप “यहोवा” भी प्रचलित है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “नाला” उस मौसमी जलमार्ग को दर्शाता है जिसे “घाटी,” “नदी का पाट” या “बरसाती नाला” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “गड्ढे” शब्द दो बार आया है—शाब्दिक रूप से, “इस नाले को गड्ढे, गड्ढे बनाओ”; इसका भाव है कि उसमें बहुत-से या जगह-जगह गड्ढे बनाए जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: हिब्रू कथात्मक क्रम और कर्ता के पुल्लिंग एकवचन को सहज हिन्दी में बनाए रखता है; ‘तब’ जोड़ना आवश्यक नहीं है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं का औपचारिक सन्देश-सूत्र है। ‘यों कहता है’ गरिमापूर्ण और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: עָשֹׂה
  choice: खोदो
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, पर यहाँ नाले को बहुत-से गड्ढों से युक्त करने की आज्ञा है; हिन्दी में गड्ढों के साथ ‘खोदना’ सबसे स्वाभाविक क्रिया है।
- source_word: הַנַּחַל הַזֶּה
  choice: इस सूखे नाले में
  rationale: נחל इस प्रसंग में मौसमी जलधारा की घाटी या सूखा पाट दर्शाता है। ‘सूखा नाला’ सामान्य हिन्दी पाठक के लिए भू-आकृति और प्रसंग दोनों स्पष्ट करता है।
- source_word: גֵּבִים גֵּבִים
  choice: जगह-जगह गड्ढे
  rationale: संज्ञा की पुनरावृत्ति बहुतायत अथवा पूरे क्षेत्र में वितरण पर बल देती है। ‘जगह-जगह गड्ढे’ उसी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे एक नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ वैकल्पिक पारम्परिक रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक और भविष्यद्वक्ताई स्वर रखा गया है। ‘यों कहता है’ औपचारिक सन्देश-सूत्र को बचाता है, जबकि ‘जगह-जगह गड्ढे खोदो’ कठिन हिब्रू संरचना को उसके बल सहित सहज हिन्दी में व्यक्त करता है।
