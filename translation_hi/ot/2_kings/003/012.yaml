base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/012.yaml
  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
translation:
  language: hi
  text: यहोशापात ने कहा[a], “याहवे का वचन उसके पास है।” तब इस्राएल का राजा, यहोशापात और एदोम का राजा नीचे उसके पास गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पास याहवे की ओर से एक वचन है।”
    reason: יִשׁ אֹתוֹ דְּבַר יְהוָה को किसी विशिष्ट भविष्यद्वक्ताई संदेश के अधिकार के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר का सामान्य कथात्मक रूप है; प्रत्यक्ष कथन का स्वाभाविक परिचय।
- source_word: יֵשׁ אֹתוֹ
  choice: उसके पास है
  rationale: יֵשׁ के साथ אֹתוֹ यहाँ अधिकार या उपलब्धता का बोध कराता है। हिन्दी में ‘उसके पास है’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और ‘उसके साथ है’ की संभावित अस्पष्टता से बचाता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: प्रचलित भविष्यद्वक्ताई अभिव्यक्ति को गरिमापूर्ण बाइबलीय हिन्दी में सुरक्षित रखता है; अनिश्चित अर्थ ‘याहवे की ओर से एक वचन’ पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיֵּרְדוּ
  choice: नीचे गए
  rationale: ירד की दिशात्मक विशेषता को बनाए रखता है, चाहे वह स्थलाकृतिक उतराई हो या भविष्यद्वक्ता के स्थान की ओर नीचे जाना।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֵלָיו का लक्ष्यसूचक अर्थ ‘उसकी ओर/उसके पास’ है; यहाँ व्यक्ति के पास जाने के लिए ‘उसके पास’ स्वाभाविक है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: राजकीय पदवी और संबंध को सीधे रूप में सुरक्षित रखता है।
- source_word: וִיהוֹשָׁפָט
  choice: यहोशापात
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: וּמֶלֶךְ אֱדוֹם
  choice: और एदोम का राजा
  rationale: इब्रानी समन्वयी संरचना और औपचारिक पदवी को बनाए रखता है।
theological_decisions:
- issue: एलीशा के संबंध में דְּבַר יְהוָה का आशय
  choice: “याहवे का वचन उसके पास है” के रूप में प्रस्तुत किया गया है, जिससे उसके माध्यम से सच्चा दिव्य प्रकाशन उपलब्ध होने का अर्थ सामने आता है।
  alternative: “उसके पास याहवे की ओर से एक वचन है।”
  rationale: इब्रानी रचना उपस्थिति/अधिकार और किसी विशिष्ट संदेश—दोनों अर्थों की अनुमति देती है। मुख्य पाठ स्थापित भविष्यद्वक्ताई पदावली रखता है और वैकल्पिक अनिश्चित अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ईश-नाम יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम को सामान्य उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘वचन’ भविष्यद्वक्ताई संदर्भ की बाइबलीय गूँज बनाए रखता है; ‘नीचे गए’ मूल की दिशात्मकता सुरक्षित रखता है।
