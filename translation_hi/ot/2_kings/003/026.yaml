  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
translation:
  language: hi
  text: जब मोआब के राजा ने देखा कि युद्ध उसके लिए बहुत भारी पड़ गया था, तब उसने अपने साथ तलवार खींचनेवाले सात सौ पुरुष लिए, ताकि वे एदोम के राजा की ओर मोर्चा तोड़कर निकल जाएँ[a]; पर वे ऐसा न कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एदोम के राजा के विरुद्ध मोर्चा तोड़कर निकल जाएँ।” यहाँ हिब्रानी संबंधबोधक शब्द इस सैन्य प्रसंग में दिशा (“की ओर”) अथवा विरोध (“के विरुद्ध”)—दोनों अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  choice: युद्ध उसके लिए बहुत भारी पड़ रहा है
  rationale: यह हिब्रानी मुहावरा बताता है कि युद्ध मोआब के राजा की सामर्थ्य से बाहर होकर उस पर हावी हो रहा था। ‘बहुत भारी पड़ रहा है’ आधुनिक और स्वाभाविक हिन्दी में वही सैन्य असमर्थता व्यक्त करता है।
- source_word: אֹתוֹ
  choice: अपने साथ लिया
  rationale: क्रिया के बाद आया कर्म-सूचक सर्वनाम यहाँ सात सौ योद्धाओं को साथ लेने का भाव देता है; हिन्दी में ‘अपने साथ लिया’ स्पष्ट और स्वाभाविक है।
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: सात सौ पुरुषों
  rationale: मूल पाठ का सीधा संख्यात्मक पद है। सैन्य संदर्भ आगे के कृदंत से स्पष्ट होता है, इसलिए ‘सैनिकों’ जोड़ने की आवश्यकता नहीं है।
- source_word: שֹׁלֵף חֶרֶב
  choice: तलवार चलानेवाले
  rationale: शाब्दिक चित्र ‘तलवार खींचनेवाले’ का है और यह युद्ध-योग्य लड़ाकों के लिए प्रचलित पद है। हिन्दी में ‘तलवार चलानेवाले’ उस सैन्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהַבְקִיעַ
  choice: से होकर निकल जाए
  rationale: हिफ़ील रूप का अर्थ शत्रु-पंक्ति में दरार बनाकर निकलना है। वाक्य में एदोम के राजा की दिशा या मोर्चे से संबंध होने के कारण यह अभिव्यक्ति हिन्दी में स्वाभाविक है।
- source_word: אֶל מֶלֶךְ אֱדוֹם
  choice: एदोम के राजा की ओर
  rationale: אֶל दिशा (‘की ओर’) या विरोध (‘के विरुद्ध’) दोनों व्यक्त कर सकता है। मुख्य पाठ में दिशात्मक अर्थ रखा गया है और सैन्य संदर्भ को ‘से होकर निकल जाए’ स्पष्ट करता है; वैकल्पिक विरोधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא יָכֹלוּ
  choice: पर वे ऐसा न कर सके
  rationale: बहुवचन क्रिया राजा और उसके साथियों की सामूहिक विफलता बताती है। ‘ऐसा’ अभिप्रेत प्रयास, अर्थात् निकल जाने, की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: אֶל का दिशात्मक या विरोधी सैन्य अर्थ
  choice: एदोम के राजा की ओर से होकर निकल जाए
  alternative: एदोम के राजा के विरुद्ध धावा बोले
  rationale: मूल संबंधबोधक दोनों अर्थों की अनुमति देता है। मुख्य पाठ में दिशात्मकता रखी गई है, जबकि वास्तविक भाषिक अस्पष्टता को पादटिप्पणी में बताया गया है; इससे युद्धनीति के बारे में पाठ से अधिक निश्चित दावा नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘भारी पड़ रहा है’ सहज मुहावरा है; ‘तलवार चलानेवाले’ मूल सैन्य बिंब को बनाए रखता है।
