base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: hi
  text: तब एलीशा ने इस्राएल के राजा से कहा, “मेरा तुमसे क्या लेना-देना?[a] अपने पिता के भविष्यद्वक्ताओं और अपनी माता के भविष्यद्वक्ताओं के पास जाओ।” पर इस्राएल के राजा ने उससे कहा, “नहीं,[b] क्योंकि याहवे ने इन तीन राजाओं को बुलाया है, ताकि उन्हें मोआब के हाथ में सौंप दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुझे और तुम्हें क्या?” यह दूरी या अस्वीकार व्यक्त करने वाला इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “ऐसा न कीजिए, क्योंकि...” इब्रानी अभिव्यक्ति कठिन है और इसे सीधे विरोध के बजाय एक विनती के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  choice: मेरा तुमसे क्या लेना-देना?
  rationale: यह इब्रानी मुहावरा दूरी या अस्वीकार व्यक्त करता है। यह हिन्दी रूप स्वाभाविक है और मूल की तीखी फटकार को बनाए रखता है।
- source_word: לֵךְ
  choice: जाओ
  rationale: सरल आज्ञार्थक क्रिया को बिना अनावश्यक विस्तार के सीधे रखा गया है।
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  choice: अपने पिता के भविष्यद्वक्ताओं और अपनी माता के भविष्यद्वक्ताओं
  rationale: दोनों समानांतर पदों को स्पष्ट रूप से बनाए रखने से राजघराने से जुड़े भविष्यद्वक्ताओं की ओर किया गया कटाक्ष सुरक्षित रहता है।
- source_word: אַל כִּי
  choice: नहीं, क्योंकि
  rationale: यह कठिन और संक्षिप्त अभिव्यक्ति संदर्भ में एलीशा की बात का विरोध या प्रतिवाद जान पड़ती है; अनिश्चितता को पादटिप्पणी में बताया गया है।
- source_word: קָרָא
  choice: इकट्ठा किया है
  rationale: यहाँ क्रिया का आशय तीन राजाओं को इस अभियान के लिए बुलाकर साथ लाना है। हिन्दी में ‘इकट्ठा किया है’ इस प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָתֵת אוֹתָם בְּיַד מוֹאָב
  choice: उन्हें मोआब के हाथ में सौंप दे
  rationale: ‘हाथ में’ की मूल इब्रानी छवि रखते हुए ‘सौंप दे’ किसी की सत्ता या वश में कर देने का अर्थ स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चतुराक्षरी व्यक्तिगत नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है।
- issue: राजा के उत्तर אַל כִּי का भाव
  choice: ‘नहीं, क्योंकि’—एलीशा की बात के विरुद्ध प्रतिवाद
  alternative: ‘ऐसा न कीजिए, क्योंकि’—एक विनती; अथवा ‘हाय! क्योंकि’—विलाप
  rationale: इब्रानी पद कठिन और अंडाकार है। प्रसंग प्रतिवाद का समर्थन करता है, पर विनती की सम्भावना वास्तविक है और पादटिप्पणी में सुरक्षित रखी गई है।
- issue: यहोवा द्वारा राजाओं को बुलाने और सौंपने का संबंध
  choice: उन्हें इस उद्देश्य/परिणाम के लिए इकट्ठा किया कि मोआब के हाथ में सौंप दे
  alternative: यहोवा ने बुलाया है, जिसका परिणाम उनका मोआब के हाथ में पड़ना होगा
  rationale: לָתֵת उद्देश्य या परिणाम दोनों की छाया रख सकता है। हिन्दी में ‘इसलिए...कि’ राजा की आशंकित व्याख्या व्यक्त करता है, बिना यह घोषित किए कि उसका धर्मवैज्ञानिक निष्कर्ष सही है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। ‘क्या लेना-देना’ स्वाभाविक हिन्दी मुहावरा है; ‘भविष्यद्वक्ता’ और ‘मोआब के हाथ में सौंपना’ बाइबलीय शब्दावली तथा मूल की छवि बनाए रखते हैं।
