  text: उसने कहा, “हम किस मार्ग से चढ़कर जाएँ?” उसने कहा, “एदोम के वीराने के मार्ग से।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने पूछा / उसने उत्तर दिया
  rationale: दोनों रूपों में मूल क्रिया אמר ही है; पहले कथन का प्रश्न और दूसरे का उत्तर होना प्रसंग तथा प्रत्यक्ष वचन से स्पष्ट है। स्वाभाविक हिन्दी में यही भेद व्यक्त किया गया है, बिना वक्ताओं की पहचान मूल से अधिक स्पष्ट किए।
- source_word: אֵי זֶה הַדֶּרֶךְ
  choice: किस मार्ग से
  rationale: यह प्रश्नवाचक पदबंध यहाँ किसी मार्ग के चयन के विषय में है। ‘किस मार्ग से’ आधुनिक हिन्दी में स्वाभाविक है और ‘कौन-सा मार्ग’ की अपेक्षा अगली क्रिया के साथ सुचारु रूप से जुड़ता है।
- source_word: נַעֲלֶה
  choice: चढ़कर जाएँ
  rationale: עלה का मूल भाव ‘ऊपर जाना/चढ़ना’ है। यात्रा अथवा सैन्य गमन के प्रसंग में ‘चढ़कर जाएँ’ उस भाव को रखता है, पर मूल में स्पष्ट न किए गए ‘कूच करना’ जैसे सैन्य अर्थ को नहीं जोड़ता।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: דֶּרֶךְ के लिए ‘मार्ग’ dignified और सामान्य मानक हिन्दी है तथा प्रश्न और उत्तर दोनों में वही शब्द बनाए रखा गया है।
- source_word: מִדְבַּר אֱדוֹם
  choice: एदोम का वीराना
  rationale: מִדְבָּר यहाँ निर्जन, कम आबाद भूभाग को सूचित करता है। ‘वीराना’ सामान्य पाठक के लिए स्वाभाविक है और ‘रेगिस्तान’ की अपेक्षा अनावश्यक रूप से रेतीले भूभाग का अर्थ नहीं जोड़ता।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
