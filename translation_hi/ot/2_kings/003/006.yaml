lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא का सामान्य कथात्मक अर्थ ‘निकलना’ या ‘प्रस्थान करना’ है। ‘निकला’ सीधा और स्वाभाविक है तथा इसमें अपने आप अतिरिक्त सैन्य अर्थ नहीं जोड़ा गया।
- source_word: הַמֶּלֶךְ יְהוֹרָם
  choice: राजा यहोराम
  rationale: हिब्रू की उपपदात्मक रचना का आधुनिक हिन्दी में स्वाभाविक रूप ‘राजा यहोराम’ है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह वाक्यांश समय को सूचित करता है; ‘उस दिन’ इसका संक्षिप्त और सहज हिन्दी रूप है।
- source_word: מִשֹּׁמְרוֹן
  choice: शोमरोन से
  rationale: מִן स्रोत या प्रस्थान-बिंदु दर्शाता है। स्थान-नाम שֹׁמְרוֹן का प्रचलित हिन्दी बाइबलीय रूप ‘शोमरोन’ रखा गया है।
- source_word: וַיִּפְקֹד
  choice: युद्ध के लिए इकट्ठा किया
  rationale: פקד के अर्थों में गिनना, निरीक्षण करना और सैन्य दल को जुटाना सम्मिलित हैं। आगामी युद्ध के संदर्भ में यह अभिव्यक्ति सैन्य अर्थ स्पष्ट करती है और सामान्य आधुनिक हिन्दी में ‘जुटान किया’ से अधिक सहज है।
- source_word: אֶת כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल को
  rationale: यह पद उत्तरी राज्य के लोगों अथवा उसकी सैन्य शक्ति को सामूहिक रूप से दर्शाता है। ‘सारे इस्राएल’ मूल की सामूहिक और राजनीतिक अभिव्यक्ति को बनाए रखता है।
