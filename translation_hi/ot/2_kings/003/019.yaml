source:
  edition: WLC
  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
translation:
  language: hi
  text: तुम हर किलेबंद नगर और हर चुनिंदा नगर[a] पर आक्रमण करोगे। तुम हर अच्छे पेड़ को गिरा दोगे, पानी के हर सोते को बंद कर दोगे और हर अच्छे खेत को पत्थरों से बरबाद कर दोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर उत्तम नगर” अथवा “हर विशिष्ट नगर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “पत्थरों से पीड़ा पहुँचाओगे”; आशय खेतों पर पत्थर डालकर उन्हें खेती के लिए अनुपयोगी करना है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  choice: तुम ... पर आक्रमण करोगे
  rationale: नכה के हिफ़ील रूप का मूल अर्थ ‘मारना/प्रहार करना’ है; नगरों को कर्म बनाकर आधुनिक हिन्दी में ‘नगर पर आक्रमण करना’ स्वाभाविक है और ‘जीत लेना’ जैसी अनकही परिणति नहीं जोड़ता।
- source_word: עִיר מִבְצָר
  choice: किलेबंद नगर
  rationale: מִבְצָר नगर की सैन्य किलेबंदी को दर्शाता है; ‘किलेबंद नगर’ सटीक और प्रचलित हिन्दी है।
- source_word: עִיר מִבְחוֹר
  choice: चुना हुआ नगर
  rationale: מִבְחוֹר किसी चुनी हुई, उत्तम या विशिष्ट वस्तु को सूचित करता है। ‘चुना हुआ’ मूल शब्द की चयन-संबंधी छवि को बनाए रखता है; अर्थ की संभावित दूसरी छटाएँ पादटिप्पणी में दी गई हैं।
- source_word: תַּפִּילוּ
  choice: गिरा दोगे
  rationale: נפל का हिफ़ील यहाँ पेड़ों को गिराने का भाव देता है। ‘गिरा दोगे’ कारणवाचक अर्थ को सीधे रखता है, जबकि काटने की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כָּל עֵץ טוֹב
  choice: हर अच्छा पेड़
  rationale: טוֹב का सामान्य अर्थ ‘अच्छा’ है। प्रसंग में मूल्यवान या फलदायक पेड़ अभिप्रेत हो सकते हैं, पर पाठ स्वयं इसे इतना विशिष्ट नहीं करता।
- source_word: מַעְיְנֵי מַיִם
  choice: पानी के हर सोते
  rationale: מַעְיָן प्राकृतिक जलस्रोत या सोते को दर्शाता है; ‘पानी का सोता’ आधुनिक हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: תִּסְתֹּמוּ
  choice: बंद कर दोगे
  rationale: סתם का अर्थ किसी खुली जगह या जलस्रोत को रोकना अथवा बंद करना है। यह अभिव्यक्ति हिन्दी में स्वाभाविक है।
- source_word: הַחֶלְקָה הַטּוֹבָה
  choice: हर अच्छा खेत
  rationale: חֶלְקָה भूमि के हिस्से या खेत को दर्शाता है। कृषि-संदर्भ में ‘खेत’ संक्षिप्त और स्वाभाविक है; ‘अच्छा’ טוֹב की व्यापकता बनाए रखता है।
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  choice: पत्थरों से बरबाद कर दोगे
  rationale: כאב का हिफ़ील यहाँ असामान्य है और शाब्दिक रूप से ‘पीड़ा पहुँचाना’ कहता है। प्रसंग में खेतों पर पत्थर डालकर उन्हें अनुपयोगी करने का भाव है; ‘बरबाद कर दोगे’ परिणाम स्पष्ट करता है, जबकि शाब्दिक विशेषता पादटिप्पणी में सुरक्षित है।
