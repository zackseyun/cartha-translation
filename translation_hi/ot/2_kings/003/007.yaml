base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
translation:
  language: hi
  text: 'तब वह गया और उसने यहूदा के राजा यहोशापात के पास यह संदेश भेजा: “मोआब के राजा ने मेरे विरुद्ध विद्रोह कर दिया है। क्या तुम मोआब के विरुद्ध युद्ध करने के लिए मेरे साथ चलोगे?” उसने उत्तर दिया, “मैं चलूँगा।[a] मैं तुम्हारे समान हूँ; मेरे लोग तुम्हारे लोगों के समान हैं; और मेरे घोड़े तुम्हारे घोड़ों के समान हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मैं चलूँगा” का शाब्दिक अर्थ “मैं ऊपर जाऊँगा” है। यह क्रिया युद्ध-अभियान पर जाने या ऊँचे भूभाग की ओर बढ़ने के लिए भी प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक क्रम व्यक्त करता है।
- source_word: וַיִּשְׁלַח אֶל
  choice: के पास यह संदेश भेजा
  rationale: उद्धृत वचन के साथ यह किसी वस्तु के बजाय संदेश भेजने का भाव देता है।
- source_word: יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोशापात
  rationale: हिन्दी का स्वाभाविक पदक्रम रखते हुए नाम और राजकीय पद दोनों सुरक्षित हैं।
- source_word: פָּשַׁע בִּי
  choice: मेरे विरुद्ध विद्रोह कर दिया है
  rationale: राजनीतिक संदर्भ में क्रिया अधीनता या निष्ठा तोड़कर विद्रोह करने को सूचित करती है।
- source_word: הֲתֵלֵךְ אִתִּי
  choice: क्या तुम ... मेरे साथ चलोगे?
  rationale: प्रश्न और साथ जाने का सीधा भाव संरक्षित है।
- source_word: אֶל מוֹאָב לַמִּלְחָמָה
  choice: मोआब से युद्ध करने के लिए
  rationale: गंतव्य और युद्ध के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶעֱלֶה
  choice: मैं चलूँगा
  rationale: शाब्दिक अर्थ ‘मैं ऊपर जाऊँगा’ है, पर यहाँ सैन्य अभियान में जाने की सहमति है; हिन्दी में ‘चलूँगा’ संदर्भानुकूल है।
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  choice: जैसा मैं, वैसे तुम; जैसे मेरे लोग, वैसे तुम्हारे लोग; और जैसे मेरे घोड़े, वैसे तुम्हारे घोड़े
  rationale: मूल के संक्षिप्त, समानांतर एकजुटता-सूत्र को बिना अतिरिक्त व्याख्या के बनाए रखता है।
