id: 2KI.3.18
reference: 2 Kings 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָקַ֥ל זֹ֖את בְּ/עֵינֵ֣י יְהוָ֑ה וְ/נָתַ֥ן אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/018.yaml
  text: And this is a small thing in the eyes of Yahweh[a]; he will also give Moab into your hand.
translation:
  language: hi
  text: और यह याहवे की दृष्टि में छोटी-सी बात है[a]; वह मोआब को भी तुम्हारे हाथ में कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यह याहवे की दृष्टि में आसान है।”
    reason: וְנָקַל का अर्थ ‘छोटी बात होना’ या ‘आसान होना’ दोनों हो सकता है।
lexical_decisions:
- source_word: וְנָקַל
  choice: और ... छोटी-सी बात है
  rationale: मूल शब्द किसी बात के हल्की, सहज या कम महत्त्वपूर्ण होने का भाव देता है। ‘छोटी-सी बात’ यहाँ स्वाभाविक हिन्दी में मूल्यांकन का भाव बनाए रखता है; आरम्भिक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: זֹאת
  choice: यह
  rationale: यह संकेतवाचक शब्द पिछले पद में बताई गई पानी की व्यवस्था की ओर संकेत करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह परमेश्वर के आकलन को व्यक्त करने वाला इब्रानी मुहावरा है। ‘की दृष्टि में’ उसके रूपक और अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम चार अक्षरों वाले नाम के रूप में आया है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: וְנָתַן
  choice: वह ... भी ... कर देगा
  rationale: भविष्यसूचक कथन में यह रूप आगे होने वाले कार्य को व्यक्त करता है। ‘भी’ बताता है कि मोआब को सौंपना पानी देने के अतिरिक्त याहवे का एक और कार्य होगा।
- source_word: אֶת מוֹאָב
  choice: मोआब को
  rationale: मूल में सीधा कर्म देश अथवा सामूहिक सत्ता ‘मोआब’ है; उसे जातिवाचक विस्तार दिए बिना रखा गया है।
- source_word: בְּיֶדְכֶם
  choice: तुम्हारे हाथ में
  rationale: यह किसी को दूसरे के अधिकार या वश में सौंपने का इब्रानी मुहावरा है। हिन्दी में भी यह बोधगम्य और सजीव है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। ‘याहवे’ मूल नाम को नाम के रूप में सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: וְנָקַל में मूल्यांकन का भाव
  choice: छोटी-सी बात है
  alternative: आसान है
  rationale: इब्रानी में ‘हल्का’, ‘तुच्छ/छोटा’ और ‘आसान’ अर्थों की निकटता है। मुख्य पाठ में ‘छोटी-सी बात’ चुना गया है, जबकि वास्तविक वैकल्पिक अर्थ ‘आसान’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘की दृष्टि में’ और ‘हाथ में कर देगा’ जैसे बाइबलीय मुहावरों को अर्थ स्पष्ट रहते हुए सुरक्षित रखा गया है।
