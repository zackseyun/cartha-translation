source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
translation:
  language: hi
  text: तब इस्राएल के राजा ने कहा, “हाय! याहवे ने इन तीन राजाओं को मोआब के हाथ में देने के लिए बुलाया[a][b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एकत्र किया”; हिब्रू क्रिया का मूल अर्थ “बुलाना” है।
    reason: lexical_alternative
  - marker: b
    text: “मोआब के हाथ में” एक हिब्रू मुहावरा है, जिसका अर्थ है “मोआब के अधिकार में।”
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: मूल पाठ में राजा का नाम नहीं, केवल उसकी पदवी है; इसलिए पदवी को स्पष्ट रखा गया है।
- source_word: אֲהָהּ
  choice: हाय!
  rationale: यह संकट और विलाप की गंभीर पुकार है; ‘हाय!’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: קָרָא
  choice: बुलाया है
  rationale: मूल क्रिया का सामान्य अर्थ ‘बुलाना’ है। इससे यह अनावश्यक रूप से निश्चित नहीं किया जाता कि आशय केवल सैन्य आदेश था या परमेश्वर द्वारा परिस्थितिवश एकत्र करना।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत दिव्य नाम का देवनागरी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לִשְׁלֹשֶׁת הַמְּלָכִים הָאֵלֶּה
  choice: इन तीनों राजाओं को
  rationale: संख्या और संकेतवाचक शब्द उस पहले से उल्लिखित त्रिराजकीय गठबंधन की ओर संकेत करते हैं; ‘इन तीनों’ स्वाभाविक हिन्दी है।
- source_word: לָתֵת אוֹתָם בְּיַד מוֹאָב
  choice: उन्हें मोआब के हाथ में सौंप दे
  rationale: ‘हाथ में देना’ किसी के अधिकार में सौंपने का हिब्रू मुहावरा है। हिन्दी वाक्य में ‘हाथ’ की छवि और परिणाम—दोनों सुरक्षित हैं।
theological_decisions:
- issue: יְהוָה दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना अपेक्षाकृत निकट लिप्यंतरित करता है।
- issue: קָרָא में बुलाने या एकत्र करने का आशय
  choice: बुलाया है
  alternative: इकट्ठा किया है / बुलवा भेजा है
  rationale: ‘बुलाया’ मूल क्रिया के अर्थ को सुरक्षित रखता है और राजा के कथन में निहित दैवी उद्देश्य को उससे अधिक स्पष्ट नहीं करता जितना पाठ स्वयं करता है।
- issue: राजा द्वारा याहवे के उद्देश्य का आरोपण
  choice: कथन को राजा की व्यथित व्याख्या के रूप में बिना संशोधन रखा गया
  alternative: ऐसी व्याख्या जोड़ना कि याहवे ने वास्तव में ऐसा उद्देश्य नहीं रखा था
  rationale: वचन स्वयं राजा का कथन देता है। अनुवाद को उसकी निराशाजनक धारणा को न तो अनुमोदित करना चाहिए, न पाठ के भीतर उसका खंडन जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथा-रजिस्टर अपनाया गया है। ‘हाय!’ भाव की तीव्रता बनाए रखता है, जबकि वाक्य-विन्यास साधारण पाठकों के लिए स्पष्ट है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
