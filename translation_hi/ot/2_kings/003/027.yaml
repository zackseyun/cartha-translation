  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
translation:
  language: hi
  text: तब उसने अपने पहलौठे पुत्र को, जो उसके स्थान पर राजा होने वाला था, लिया और उसे दीवार पर होमबलि के रूप में चढ़ा दिया। तब इस्राएल के विरुद्ध बड़ा कोप भड़का[a]; इसलिए वे उसके पास से हट गए और अपने देश लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ यह नहीं बताता कि यह कोप किसका था। इसकी व्याख्या परमेश्वर के कोप, मोआब के उग्र रोष, या उस बलिदान के बाद इस्राएल की घबराहट अथवा मनोबल टूटने के रूप में की जाती है।
    reason: मूल पाठ में निहित महत्वपूर्ण अस्पष्टता और प्रमुख वैकल्पिक व्याख्याओं को बताना।
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  choice: अपने पहलौठे पुत्र
  rationale: ‘पहलौठा’ בְּכוֹר का जन्मक्रम और उत्तराधिकार से जुड़ा अर्थ बनाए रखता है; यह केवल आयु में सबसे बड़े पुत्र को नहीं दर्शाता।
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  choice: जो उसके स्थान पर राजा होनेवाला था
  rationale: यह पुत्र को निर्धारित उत्तराधिकारी के रूप में पहचानता है और תַּחְתָּיו के ‘उसके स्थान पर’ भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיַּעֲלֵהוּ עֹלָה
  choice: उसे ... होम-बलि के रूप में चढ़ा दिया
  rationale: यह विशिष्ट बलिदानी भाषा और कृत्य की भयावहता को बिना नरम किए व्यक्त करता है।
- source_word: עַל הַחֹמָה
  choice: दीवार पर
  rationale: मूल पाठ में ‘दीवार’ है; प्रसंग से नगर की दीवार समझी जा सकती है, इसलिए मुख्य पाठ में ‘नगर’ नहीं जोड़ा गया।
- source_word: קֶצֶף גָּדוֹל
  choice: बड़ा प्रकोप
  rationale: ‘प्रकोप’ तीव्र रोष या कोप का अर्थ देता है और उसके स्रोत को अनिर्दिष्ट रहने देता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: קֶצֶף के साथ עַל इस्राएल की ओर लक्षित विरोधी कोप को दर्शाता है।
- source_word: וַיִּסְעוּ מֵעָלָיו
  choice: वे उसके पास से हट गए
  rationale: सैन्य प्रसंग में यह मोआब के राजा के विरुद्ध अभियान छोड़कर पीछे हटने का स्वाभाविक हिन्दी रूप है, जबकि मूल की प्रस्थान-संबंधी क्रिया का भाव भी रहता है।
- source_word: וַיָּשֻׁבוּ לָאָרֶץ
  choice: अपने देश लौट गए
  rationale: प्रसंग में कर्ता मित्र-सेनाएँ हैं; हिन्दी में ‘अपने देश’ वापसी का निहित संबंध स्पष्ट और स्वाभाविक करता है।
theological_decisions:
- issue: ‘इस्राएल के विरुद्ध बड़ा प्रकोप’ का स्रोत
  choice: मुख्य पाठ में प्रकोप के स्रोत को अनिर्दिष्ट रखा गया है।
  alternative: इसे परमेश्वर का कोप, मोआब का उग्र रोष, अथवा बलिदान के बाद इस्राएल की घबराहट या मनोबल टूटना मानना।
  rationale: इब्रानी पाठ यह नहीं बताता कि प्रकोप किसका था। किसी एक व्याख्या को मुख्य पाठ में रख देने से मूल की वास्तविक धर्मवैचारिक अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहलौठा’, ‘होम-बलि’ और ‘प्रकोप’ जैसे प्रचलित बाइबलीय शब्द मूल की पारिवारिक, बलिदानी और भावात्मक तीव्रता को सुरक्षित रखते हैं। पाद-टिप्पणी चिह्न उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
