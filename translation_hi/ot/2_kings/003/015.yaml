  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
translation:
  language: hi
  text: “लेकिन अब मेरे लिए एक वादक[a] बुला लाओ।” जब वादक बजा रहा था, तब याहवे का हाथ[b] उस पर आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वाद्य बजाने वाला व्यक्ति; इब्रानी में किसी विशेष वाद्य का उल्लेख नहीं है।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे का हाथ’ दिव्य सामर्थ्य या भविष्यद्वाणी की प्रेरणा के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: लेकिन अब
  rationale: यह पद पिछले कथन से मुड़कर तत्काल अनुरोध की ओर बढ़ता है। ‘लेकिन अब’ इस संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְחוּ לִי
  choice: मेरे लिए … बुला लाओ
  rationale: आज्ञार्थक क्रिया और सम्प्रदानवाचक सर्वनाम का आशय वक्ता के लिए किसी व्यक्ति को ले आने से है। व्यक्ति के संदर्भ में ‘बुला लाओ’ स्वाभाविक है।
- source_word: מְנַגֵּן
  choice: वादक
  rationale: यह נגן से बना कृदन्त है और वाद्य बजाने वाले व्यक्ति को दर्शाता है; मूल पाठ किसी विशेष वाद्य का नाम नहीं बताता।
- source_word: וְהָיָה כְּנַגֵּן הַמְנַגֵּן
  choice: जब वादक बजा रहा था
  rationale: यह रचना उस परिस्थिति और समय को बताती है जिसमें अगली घटना हुई। हिन्दी में यह रूप सहज है और जारी क्रिया का भाव रखता है।
- source_word: יַד יְהוָה
  choice: याहवे का हाथ
  rationale: शाब्दिक बिम्ब को बनाए रखा गया है, क्योंकि यह दिव्य सामर्थ्य अथवा भविष्यद्वाणी की प्रेरणा का मुहावरा हो सकता है; अनुवाद उसके आशय को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिन्दी में उसका लिप्यन्तरण ‘याहवे’ किया गया है।
- source_word: וַתְּהִי עָלָיו
  choice: उस पर आया
  rationale: यह घटना के घटित होने का भाव रखता है। ‘उस पर आया’ इब्रानी अभिव्यक्ति और उसके भविष्यद्वाणी-संबंधी संदर्भ दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में उपाधि नहीं, परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसका निकट लिप्यन्तरण है।
- issue: יַד יְהוָה के मुहावरे का अर्थ
  choice: याहवे का हाथ उस पर आया
  alternative: याहवे की सामर्थ्य/भविष्यद्वाणी की प्रेरणा उस पर आई
  rationale: संदर्भ में यह भविष्यद्वाणी की प्रेरणा या दिव्य सामर्थ्य को सूचित कर सकता है, पर शाब्दिक बिम्ब बनाए रखने से मूल की अर्थगत व्यापकता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: עָלָיו में निहित व्यक्ति की पहचान
  choice: उस पर
  alternative: एलीशा पर
  rationale: संदर्भ में संकेत एलीशा की ओर है, पर मूल पद सर्वनाम का प्रयोग करता है। ‘उस पर’ मूल की अभिव्यक्ति को बिना अनावश्यक स्पष्टता जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। संवाद को उद्धरण-चिह्नों में रखा गया है और उसके बाद कथावाचन आता है। ‘वादक’ सामान्य पाठक के लिए स्पष्ट है तथा किसी अनिर्दिष्ट वाद्य को पाठ में नहीं जोड़ता।
