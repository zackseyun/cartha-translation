source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
translation:
  language: hi
  text: फिर भी वह नबात के पुत्र यारोबाम के उन पापों को पकड़े रहा, जिनके द्वारा उसने इस्राएल से पाप कराया था[a]; वह उनसे नहीं फिरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके द्वारा उसने इस्राएल को पाप में डाला था।” इब्रानी कारणवाचक क्रिया बताती है कि यारोबाम के पापों के द्वारा इस्राएल पाप करने में प्रवृत्त हुआ।
    reason: कारणवाचक क्रिया के अर्थ की वैकल्पिक, स्वाभाविक हिन्दी अभिव्यक्ति देना।
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह पिछले सकारात्मक मूल्यांकन पर सीमा या अपवाद लगाता है। इस प्रसंग में ‘फिर भी’ आधुनिक हिन्दी में संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: בְּחַטֹּאות ... דָּבֵק
  choice: पापों से चिपका रहा
  rationale: דבק दृढ़ और निरंतर लगाव का भाव देता है; ‘चिपका रहा’ उस हठीले बने रहने को स्पष्ट रूप से व्यक्त करता है।
- source_word: חַטֹּאות
  choice: पापों
  rationale: मूल शब्द नैतिक और धार्मिक दोष का स्पष्ट मूल्यांकन करता है; ‘पापों’ उस बल को बिना नरम किए बनाए रखता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: हिन्दी में स्वाभाविक वंश-सूचक पहचान और प्रचलित बाइबलीय नाम-रूप।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल को पाप में डाला था
  rationale: हिफ़ील क्रिया का कारणवाचक अर्थ सुरक्षित है और मुख्य पाठ पापों को वह माध्यम मानता है जिनके द्वारा यारोबाम ने इस्राएल को पाप की ओर पहुँचाया।
- source_word: לֹא סָר מִמֶּנָּה
  choice: वह उनसे नहीं फिरा
  rationale: यह किसी पापपूर्ण मार्ग को न छोड़ने का स्वाभाविक हिन्दी मुहावरा है। मूल में प्रत्यय व्याकरणतः स्त्रीलिंग एकवचन है, पर उसका आशय पूर्वोक्त पापों से है; हिन्दी में बहुवचन ‘उनसे’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: राजा के धर्मत्याग का नैतिक मूल्यांकन
  choice: ‘पापों’ और ‘पाप में डाला’ जैसे स्पष्ट नैतिक शब्द बनाए रखे गए।
  alternative: इन्हें ‘रीतियों’, ‘प्रथाओं’ या ‘भूलों’ जैसे अधिक तटस्थ शब्दों से व्यक्त करना।
  rationale: इब्रानी पाठ स्वयं यारोबाम के मार्ग का धर्मवैचारिक और नैतिक मूल्यांकन ‘पाप’ के रूप में करता है; अनुवाद को उस निर्णय को नरम नहीं करना चाहिए।
- issue: सम्बन्धवाचक उपवाक्य का सम्भावित सम्बन्ध
  choice: मुख्य पाठ में ‘जिनके द्वारा उसने...’ रखकर पापों/पापपूर्ण नीतियों को माध्यम माना गया।
  alternative: ‘यारोबाम, जिसने इस्राएल से पाप कराया था।’
  rationale: אֲשֶׁר का सम्बन्ध पापों से साधनात्मक रूप में या यारोबाम से कर्तृवाचक रूप में समझा जा सकता है। मुख्य पाठ पूर्ववर्ती अंग्रेज़ी परामर्श-पाठ के साधनात्मक अर्थ को स्वाभाविक हिन्दी में रखता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक वाक्य-संबंध बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘फिर भी’ पिछले पद के साथ विरोधात्मक सीमा दिखाता है, और ‘चिपका रहा’ दृढ़ बने रहने की तीव्रता को सामान्य पाठक के लिए स्पष्ट रखता है।
