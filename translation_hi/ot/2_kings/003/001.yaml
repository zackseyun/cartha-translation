base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/001.yaml
  text: Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
translation:
  language: hi
  text: अहाब का पुत्र यहोराम[a] यहूदा के राजा यहोशापात के शासन के अठारहवें वर्ष में सामरिया में इस्राएल का राजा बना, और उसने बारह वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में वाक्य का आरंभ “और अहाब का पुत्र यहोराम…” से किया जा सकता है। हिब्रू का आरंभिक संयोजक कथा की निरंतरता दिखाता है और उसका अनुवाद केवल “और” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  choice: यहोराम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है। आरंभिक וְ कथा की निरंतरता दिखाता है; स्वाभाविक हिन्दी में इसे मुख्य पाठ में अलग शब्द से व्यक्त करना आवश्यक नहीं है, इसलिए इसका अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בֶּן אַחְאָב
  choice: अहाब का पुत्र
  rationale: यह सीधा पितृ-परिचय है और आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राजगद्दी पर बैठने या शासन आरंभ करने को सूचित करती है; इससे बाद की अवधि-सूचक וַיִּמְלֹךְ से स्पष्ट भेद बना रहता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: राजकीय शासन का अर्थ हिन्दी के स्वाभाविक पदबंध में व्यक्त किया गया है; अर्थतः वह इस्राएल पर शासन करने वाला राजा बना।
- source_word: בְּ/שֹׁמְרוֹן
  choice: सामरिया में
  rationale: स्थानवाचक בְ का सीधा और स्वाभाविक अनुवाद है; यहाँ सामरिया राजधानी-नगर है।
- source_word: בִּ/שְׁנַת שְׁמֹנֶה עֶשְׂרֵה
  choice: शासन के अठारहवें वर्ष में
  rationale: राजाओं के काल-समन्वय की सूत्रात्मक अभिव्यक्ति को हिन्दी में स्पष्ट करने के लिए ‘शासन के’ जोड़ा गया है।
- source_word: לִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोशापात के
  rationale: इस राजकीय काल-सूत्र में לְ यहोशापात के शासन-वर्ष से संबंध बताता है; हिन्दी में संबंधकारक ‘के’ स्वाभाविक है।
- source_word: וַ/יִּמְלֹךְ שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: और उसने बारह वर्ष तक राज्य किया
  rationale: यहाँ מלך शासन की अवधि बताती है। ‘तक’ अवधि को सहज हिन्दी में स्पष्ट करता है, जबकि ‘और’ हिब्रू कथात्मक क्रम को बनाए रखता है।
