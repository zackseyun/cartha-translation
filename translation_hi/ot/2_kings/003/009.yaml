base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
translation:
  language: hi
  text: तब इस्राएल का राजा, यहूदा के राजा और एदोम के राजा के साथ चला। वे सात दिन की यात्रा का चक्कर लगाकर गए; पर छावनी और उनके साथ चलनेवाले पशुओं[a] के लिए पानी नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो उनके पैरों के पास थे”; यह उनके साथ चलनेवाले पशुओं के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चल पड़े
  rationale: הלך का यह कथात्मक रूप अभियान के आरम्भ को बताता है। ‘चल पड़े’ स्वाभाविक हिन्दी है और क्रिया में अनावश्यक रूप से सैन्य अर्थ नहीं जोड़ता।
- source_word: מֶלֶךְ יִשְׂרָאֵל ... וּמֶלֶךְ יְהוּדָה ... וּמֶלֶךְ אֱדוֹם
  choice: इस्राएल का राजा, यहूदा का राजा और एदोम का राजा
  rationale: तीनों राजाओं के पद को दोहराकर इब्रानी समन्वय और तीन पक्षों के साथ जाने को स्पष्ट रखा गया है।
- source_word: וַיָּסֹבּוּ
  choice: वे घूमकर ... गए
  rationale: סבב यहाँ सीधे मार्ग के बजाय घूमकर या चक्कर लगाकर जाने का भाव देता है।
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: सात दिन के मार्ग से
  rationale: דֶּרֶךְ मार्ग या यात्रा, दोनों को सूचित कर सकता है। यह रूप सात दिन की यात्रा/मार्ग की मूल अभिव्यक्ति को बिना अत्यधिक व्याख्या के बनाए रखता है।
- source_word: וְלֹא הָיָה מַיִם
  choice: पानी नहीं था
  rationale: अस्तित्वसूचक इब्रानी वाक्यांश का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: לַמַּחֲנֶה
  choice: छावनी के लिए
  rationale: מַחֲנֶה का अर्थ छावनी या पड़ाव हो सकता है; सैन्य प्रसंग में ‘छावनी’ उपयुक्त और संक्षिप्त है।
- source_word: וְלַבְּהֵמָה
  choice: पशुओं के लिए
  rationale: בְּהֵמָה यहाँ साथ आए घरेलू या भारवाही पशुओं के लिए सामूहिक शब्द है। ‘पशु’ व्यापक अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר בְּרַגְלֵיהֶם
  choice: उनके साथ चलनेवाले
  rationale: शाब्दिक रूप से ‘जो उनके पैरों पर/पास थे’; प्रसंग में यह सेना के साथ चलने वाले पशुओं का मुहावरेदार वर्णन है। शाब्दिक बिंब पादटिप्पणी में दिया गया है।
