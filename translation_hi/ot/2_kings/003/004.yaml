translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। आरम्भ में कोई अतिरिक्त संयोजक नहीं जोड़ा गया, क्योंकि स्रोत में स्पष्ट कालसूचक ‘अब’ नहीं है। कर की नियमित अदायगी को ‘दिया करता था’ से व्यक्त किया गया है।
