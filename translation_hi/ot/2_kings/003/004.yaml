source:
  edition: WLC
  text: וּ/מֵישַׁ֥ע מֶֽלֶךְ מוֹאָ֖ב הָיָ֣ה נֹקֵ֑ד וְ/הֵשִׁ֤יב לְ/מֶֽלֶךְ יִשְׂרָאֵל֙ מֵאָה אֶ֣לֶף כָּרִ֔ים וּ/מֵ֥אָה אֶ֖לֶף אֵילִ֥ים צָֽמֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/004.yaml
  text: Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
translation:
  language: hi
  text: मोआब का राजा मेशा भेड़ें पालनेवाला था। वह इस्राएल के राजा को कर के रूप में एक लाख मेमने और एक लाख मेढ़ों की ऊन[a] दिया करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक लाख मेढ़े, ऊन।” यह वाक्यांश संक्षिप्त और अस्पष्ट है; इसका अर्थ “ऊन सहित एक लाख मेढ़े” हो सकता है, या सन्दर्भ में अधिक सम्भावित रूप से, “एक लाख मेढ़ों की ऊन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹקֵד
  choice: भेड़ें पालनेवाला
  rationale: यह संज्ञा भेड़ें पालने और उनसे जुड़े व्यवसाय में लगे व्यक्ति को दर्शाती है। यह आधुनिक हिन्दी में सहज है और पुराने या अत्यधिक तकनीकी पद से बचती है।
- source_word: וְהֵשִׁיב
  choice: दिया करता था
  rationale: यहाँ हिफ़ईल रूप नियमित रूप से कर चुकाने या भेंट देने के अर्थ में है। ‘दिया करता था’ उस प्रचलित अथवा बार-बार होनेवाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵאָה אֶלֶף כָּרִים
  choice: एक लाख मेमने
  rationale: כָּרִים मेमनों या जवान नर भेड़ों को सूचित कर सकता है। कर की सूची में ‘मेमने’ स्पष्ट और स्वाभाविक है।
- source_word: אֵילִים צָמֶר
  choice: एक लाख मेढ़ों की ऊन
  rationale: इब्रानी पदबंध संक्षिप्त और व्याकरणतः दीर्घवृत्तीय है। सन्दर्भ में सम्भवतः मेढ़ों की संख्या के अनुसार ऊन दिए जाने का अर्थ है; हिन्दी में सम्बन्धसूचक ‘की’ जोड़ने से आशय सहज बनता है, जबकि पादटिप्पणी मूल की अस्पष्टता बताती है।
- source_word: מֶלֶךְ מוֹאָב / מֶלֶךְ יִשְׂרָאֵל
  choice: मोआब का राजा / इस्राएल का राजा
  rationale: सम्बन्धवाचक इब्रानी रचना का मानक और स्वाभाविक हिन्दी रूप।
