source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
translation:
  language: hi
  text: तब यहोशापात ने कहा, “क्या यहाँ यहोवा का कोई नबी नहीं है, जिसके द्वारा हम यहोवा से पूछें?” इस्राएल के राजा के सेवकों में से एक ने उत्तर दिया, “शापात का पुत्र एलीशा यहाँ है[a], जो एलिय्याह के हाथों पर पानी डाला करता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हाथों पर पानी डालना एलिय्याह की व्यक्तिगत सेवा करने, सम्भवतः हाथ धुलाने, की ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַאֵין
  choice: क्या यहाँ ... कोई ... नहीं है
  rationale: प्रश्नवाचक הֲ और निषेध אַיִן के बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: נָבִיא לַיהוָה
  choice: यहोवा का कोई नबी
  rationale: לַיהוָה यहाँ नबी का यहोवा से संबंध दर्शाता है; ‘यहोवा का नबी’ सहज और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאוֹתוֹ
  choice: जिसके द्वारा हम यहोवा से पूछें
  rationale: דרשׁ के पूछने/मार्गदर्शन जानने के भाव और מֵאֹתוֹ में नबी की मध्यस्थ भूमिका—दोनों को स्पष्ट किंतु अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: אֶחָד מֵעַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा के सेवकों में से एक
  rationale: राजदरबार के संदर्भ में עֶבֶד के लिए ‘सेवक’ उपयुक्त है और पद की अनिश्चितता को बनाए रखता है।
- source_word: אֲשֶׁר יָצַק מַיִם עַל־יְדֵי אֵלִיָּהוּ
  choice: जो एलिय्याह के हाथों पर पानी डाला करता था
  rationale: हाथ धुलाने की सेवा से जुड़ी इब्रानी छवि को सुरक्षित रखते हुए वर्णन की नियमित पूर्वकालीन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से दो बार आया है; उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में पहचाने जाने वाले नामरूप से रखा गया है।
- issue: नबी के माध्यम से यहोवा से पूछना
  choice: जिसके द्वारा हम यहोवा से पूछें
  alternative: जिससे हम यहोवा को खोजें
  rationale: यहाँ भाव भविष्यवाणी-संबंधी परामर्श लेने का है। यह रूप नबी को उत्तर का स्वतंत्र स्रोत न बनाकर माध्यम के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद को संक्षिप्त रखा गया है और इब्रानी सांस्कृतिक छवि को मुख्य पाठ में सुरक्षित किया गया है।
