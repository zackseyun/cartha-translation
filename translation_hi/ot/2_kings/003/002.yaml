base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुराई की, पर वह अपने पिता और माता के समान नहीं था।[a] उसने बाल का वह पूजा-स्तंभ[b] हटा दिया, जिसे उसके पिता ने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “केवल इतना कि वह अपने पिता और माता के समान नहीं था।” इब्रानी शब्द पिछले कथन को सीमित करता है: उसने बुराई की, पर वह अपने माता-पिता के समान नहीं था।'
    reason: lexical_alternative
  - marker: b
    text: या, “बाल का पवित्र स्तंभ” अथवा “बाल का खड़ा पत्थर।” इब्रानी शब्द बाल की उपासना से जुड़े एक खड़े किए हुए स्तंभ या पत्थर को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: उसने ... बुरा किया
  rationale: यह इब्रानी मुहावरा बुरा आचरण करने को व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए उसके नैतिक मूल्यांकन को बनाए रखता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह याहवे के मूल्यांकन को बताने वाला इब्रानी मुहावरा है; हिंदी में इसका बिंब और अर्थ दोनों स्पष्ट हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  choice: पर अपने पिता और अपनी माता के समान नहीं
  rationale: 'רַק पिछले कथन को सीमित करता है: उसका आचरण बुरा था, फिर भी वह अपने माता-पिता के समान नहीं था। ''पर'' इस विरोधात्मक योग्यता को सहज हिंदी में व्यक्त करता है।'
- source_word: וַיָּסַר
  choice: उसने ... हटा दिया
  rationale: क्रिया का सीधा अर्थ हटाना या दूर करना है। इब्रानी में संयोजक सामान्य कथात्मक क्रम भी बता सकता है, इसलिए मुख्य पाठ में स्पष्ट कारणसूचक शब्द नहीं जोड़ा गया।
- source_word: מַצְּבַת הַבַּעַל
  choice: बाल का ... पूजा-स्तंभ
  rationale: מַצֵּבָה खड़े किए गए पत्थर या स्तंभ को दर्शाता है और यहाँ बाल की उपासना से संबंधित है; 'पूजा-स्तंभ' वस्तु और उसके धार्मिक उपयोग दोनों को संक्षेप में स्पष्ट करता है।
- source_word: אֲשֶׁר עָשָׂה אָבִיו
  choice: जिसे उसके पिता ने बनाया था
  rationale: संबंधवाचक उपवाक्य स्तंभ को उसके पिता द्वारा पहले बनाई गई वस्तु के रूप में पहचानता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत नाम सीधे आया है; 'याहवे' मूल व्यंजनात्मक नाम के व्यापक रूप से स्वीकृत उच्चारण का निकट देवनागरी रूप है और उसे किसी उपाधि से नहीं बदलता।
- issue: राजा की बुराई की सीमा
  choice: वह बुरा करता था, पर अपने माता-पिता के समान नहीं
  alternative: वह अपने माता-पिता जैसा बुरा नहीं था
  rationale: रचना पहले उसके आचरण को बुरा ठहराती है और फिर רַק से उसे योग्य बनाती है। चुना हुआ रूप दोनों कथनों का तनाव बनाए रखता है और उसे निर्दोष नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। वाक्य-रचना सामान्य पाठक के लिए सहज रखी गई है, जबकि इब्रानी मूल्यांकन, विरोधात्मक योग्यता और पूजा-संबंधी वस्तु की प्रकृति सुरक्षित है।
