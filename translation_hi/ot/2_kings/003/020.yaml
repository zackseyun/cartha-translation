- source_word: כַּעֲלוֹת הַמִּנְחָה
  choice: अन्नबलि चढ़ाए जाने के समय
  rationale: עלה का मूल बिंब ‘ऊपर जाना’ है, पर बलिदानी प्रसंग में यह वेदी पर भेंट चढ़ाने को सूचित करता है। מִנְחָה के लिए इस उपासना-संदर्भ में ‘अन्नबलि’ सटीक और प्रचलित है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह ध्यान आकृष्ट करने वाला पद घटना की आकस्मिकता और सजीवता बनाए रखता है।
- source_word: מַיִם בָּאִים
  choice: पानी आ रहा था
  rationale: מַיִם को हिन्दी में स्वाभाविक द्रव्यवाचक एकवचन ‘पानी’ कहा गया है, जबकि कृदंत בָּאִים की दृष्टिगोचर और जारी गति को ‘आ रहा था’ से व्यक्त किया गया है।
- source_word: מִדֶּרֶךְ אֱדוֹם
  choice: एदोम की दिशा से
  rationale: דֶּרֶךְ का शाब्दिक अर्थ मार्ग है, किंतु यह रचना उस दिशा या रास्ते को बताती है जिधर से पानी आया; मुख्य पाठ में सहज भौगोलिक अर्थ रखा गया है।
- source_word: וַתִּמָּלֵא הָאָרֶץ אֶת הַמָּיִם
  choice: वह भूमि उस पानी से भर गई
  rationale: הָאָרֶץ यहाँ पूरी पृथ्वी नहीं, सामने का भूभाग या भूमि है। ‘उस पानी’ इब्रानी के निश्चित रूप को और पहले बताए गए पानी से उसके संबंध को बनाए रखता है।
