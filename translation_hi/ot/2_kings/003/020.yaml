base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/020.yaml
  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
translation:
  language: hi
  text: और सुबह, अन्नबलि चढ़ाए जाने के समय[a], देखो, एदोम की दिशा से[b] पानी आ रहा था, और वह भूमि उस पानी[c] से भर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब अन्नबलि चढ़ाई गई।” इब्रानी में शाब्दिक रूप से “अन्नबलि के ऊपर जाने पर” है; यह अन्नबलि को वेदी पर चढ़ाने की भाषा है।
    reason: lexical_alternative
  - marker: b
    text: या, “एदोम के मार्ग से” अथवा “एदोम के रास्ते से।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में, “भूमि उस पानी से भर गई” है; हिन्दी में अधिक सहज रूप से, “भूमि पानी से भर गई” भी कहा जा सकता है।
    reason: lexical_alternative
