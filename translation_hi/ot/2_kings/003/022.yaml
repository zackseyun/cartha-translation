  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
translation:
  language: hi
  text: वे भोर में जल्दी उठे, और सूरज पानी पर चमका; तब मोआबियों ने अपने सामने पानी को लहू के समान लाल देखा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘उनके सामने/उस पार का पानी’ भी समझा जा सकता है। मूल इब्रानी में ‘मोआब’ शब्द सामूहिक रूप से मोआब के लोगों के लिए आया है।
    reason: מִנֶּגֶד के ‘सामने’ अथवा ‘उस पार’ संबंधी स्थानिक अर्थ और ‘मोआब’ के सामूहिक प्रयोग को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: वे सुबह तड़के उठे
  rationale: שׁכם का हिफ़ील रूप जल्दी उठने का भाव देता है; बַבֹּקֶר समय को स्पष्ट करता है। ‘सुबह तड़के उठे’ स्वाभाविक हिन्दी में दोनों भाव सुरक्षित रखता है।
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  choice: और सूरज पानी पर चमक रहा था
  rationale: זרח यहाँ सूरज के चमकने और उसका प्रकाश पानी पर पड़ने का दृश्य प्रस्तुत करता है। हिन्दी का अपूर्ण पक्ष उस समय दिखाई दे रही पृष्ठभूमि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּרְאוּ מוֹאָב
  choice: तब मोआबियों ने ... देखा
  rationale: मूल में ‘मोआब’ पूरे समुदाय के लिए सामूहिक संज्ञा है। हिन्दी में ‘मोआबियों’ कहना वही अर्थ स्पष्ट और स्वाभाविक ढंग से देता है।
- source_word: מִנֶּגֶד
  choice: अपने सामने का
  rationale: यह शब्द सामने या दूसरी ओर स्थित होने का स्थानिक भाव देता है। ‘अपने सामने का’ दृश्य-संबंध को स्पष्ट रखता है, जबकि अन्य सम्भव अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: אֲדֻמִּים כַּדָּם
  choice: खून के समान लाल
  rationale: विशेषण אֲדֻמִּים और तुलना-सूचक כ मिलकर पानी को खून जैसा लाल दिखाई देने का सजीव उपमान बनाते हैं।
