base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
translation:
  language: hi
  text: उन्होंने नगरों को ढा दिया। हर अच्छे भूखंड पर प्रत्येक व्यक्ति ने अपना पत्थर फेंका और उसे पत्थरों से भर दिया। उन्होंने पानी के हर सोते को बंद कर दिया और हर अच्छे पेड़[a] को गिरा दिया, यहाँ तक कि कीर-हरेसेत[b] में केवल उसके पत्थर ही बचे रहे। तब गोफन चलाने वालों ने उसे घेर लिया और उस पर प्रहार किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हर अच्छा पेड़’; इससे मूल्यवान या उपजाऊ पेड़ अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: कीर-हरेसेत एक स्थान का नाम है; इस प्रसंग में संभवतः यह मोआब का प्रमुख किलाबंद नगर था।
    reason: cultural_note
  - marker: c
    text: या ‘उसे मारा।’ यहाँ प्रयुक्त इब्रानी क्रिया का मूल अर्थ मारना या प्रहार करना है और इस प्रसंग में यह नगर पर सैन्य प्रहार को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים יַהֲרֹסוּ
  choice: उन्होंने नगरों को ढा दिया
  rationale: עִיר नगर या शहर हो सकता है और הרס संरचनाओं को ढाने का ठोस भाव देता है; सैन्य प्रसंग में यह सहज और स्रोत-सन्निकट है।
- source_word: חֶלְקָה טוֹבָה
  choice: अच्छी भूमि
  rationale: חֶלְקָה भूमि के किसी भाग या भूखंड को दर्शाता है। संक्षिप्त हिन्दी में ‘अच्छी भूमि’ उत्पादक भूभाग का भाव रखती है।
- source_word: יַשְׁלִיכוּ אִישׁ אַבְנוֹ וּמִלְאוּהָ
  choice: प्रत्येक व्यक्ति ने अपना पत्थर फेंका, यहाँ तक कि उन्होंने उसे पत्थरों से भर दिया
  rationale: वितरणसूचक एकवचन ‘प्रत्येक व्यक्ति...अपना पत्थर’ रखा गया है। ‘पत्थरों से’ अर्थ में निहित पूरक को स्पष्ट करता है और ‘यहाँ तक कि’ लगातार पत्थर डालने के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעְיַן מַיִם יִסְתֹּמוּ
  choice: पानी के हर सोते को बंद कर दिया
  rationale: מַעְיַן प्राकृतिक जलस्रोत या सोता है और סתם यहाँ उसे अवरुद्ध करने का अर्थ देता है।
- source_word: עֵץ טוֹב יַפִּילוּ
  choice: हर अच्छे पेड़ को गिरा दिया
  rationale: मुख्य पाठ में शाब्दिक व्यापकता रखी गई है; स्रोत इसे विशेष रूप से फलदार पेड़ नहीं कहता। Hiphil क्रिया का अर्थ पेड़ को गिराना है।
- source_word: עַד הִשְׁאִיר אֲבָנֶיהָ
  choice: अंत में ... केवल उसके पत्थर ही बचे रहे
  rationale: हिब्रू के एकवचन क्रियारूप को सामूहिक या अवैयक्तिक परिणाम के रूप में लिया गया है। हिन्दी में परिणाम स्पष्ट रखते हुए अस्वाभाविक संख्या-परिवर्तन से बचा गया है।
- source_word: בַּקִּיר חֲרָשֶׂת
  choice: कीर-हरेसेत में
  rationale: यह स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: הַקַּלָּעִים
  choice: गोफन चलाने वालों
  rationale: यह युद्ध में गोफन का प्रयोग करने वाले सैनिकों को दर्शाता है; यह हिन्दी में पारदर्शी वर्णन है।
- source_word: וַיָּסֹבּוּ ... וַיַּכּוּהָ
  choice: उसे घेरकर उस पर प्रहार किया
  rationale: סבב का घेरना और נכה का मारना/प्रहार करना दोनों सीधे रखे गए हैं; अंतिम क्रिया के सैन्य आशय को अनावश्यक रूप से व्यापक ‘आक्रमण किया’ में नहीं बदला गया।
