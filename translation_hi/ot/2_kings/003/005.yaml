  text: And it happened[a], when Ahab died, that the king of Moab rebelled against the king of Israel.
translation:
  language: hi
  text: और अहाब की मृत्यु के बाद[a] मोआब के राजा ने इस्राएल के राजा के विरुद्ध विद्रोह कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब अहाब की मृत्यु हुई।” हिब्रू समय-सूचक अभिव्यक्ति के दोनों अनुवाद सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और
  rationale: हिब्रू कथात्मक क्रम को हिन्दी में स्वाभाविक रूप से आगे बढ़ाता है; अलग से ‘ऐसा हुआ’ कहना यहाँ अनावश्यक रूप से बोझिल होता।
- source_word: כְּמוֹת אַחְאָב
  choice: अहाब की मृत्यु के बाद
  rationale: כְּ के साथ מות का infinitive construct समय-संबंध व्यक्त करता है। संदर्भ में ‘मृत्यु के बाद’ सहज हिन्दी है, जबकि ‘जब अहाब मरा’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: וַיִּפְשַׁע
  choice: विद्रोह कर दिया
  rationale: राजनीतिक अधीनता के संदर्भ में פשע अपने अधिपति के विरुद्ध विद्रोह करने को दर्शाता है; ‘कर दिया’ घटना के कथात्मक, पूर्ण पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֶלֶךְ מוֹאָב
  choice: मोआब के राजा
  rationale: हिब्रू construct chain का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: בְּמֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा के विरुद्ध
  rationale: פשע के साथ בְּ उस पक्ष को सूचित करता है जिसके विरुद्ध राजनीतिक विद्रोह हुआ।
