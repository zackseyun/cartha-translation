source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
translation:
  language: hi
  text: तब एलीशा ने कहा, “सेनाओं के यहोवा के जीवन की शपथ, जिसके सामने मैं खड़ा हूँ[a], यदि मैं यहूदा के राजा यहोशापात का लिहाज़ न करता[b], तो मैं न तेरी ओर देखता, न तुझे देखता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक भाव है, “जिसके सामने मैं खड़ा हुआ हूँ।” यह मुहावरा भविष्यद्वक्ता के रूप में सेवा करने का अर्थ भी दे सकता है: “जिसकी मैं सेवा करता हूँ।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “चेहरा उठाने” से जुड़ा मुहावरा है, जिसका अर्थ किसी का आदर या लिहाज़ करना है। इसका अनुवाद यह भी हो सकता है, “यदि यहूदा के राजा यहोशापात के कारण न होता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा के जीवन की शपथ
  rationale: यह इब्रानी शपथ-सूत्र परमेश्वर के जीवित होने को साक्षी बनाता है। यह रूप शपथ की औपचारिक शक्ति और ‘सेनाओं’ के व्यापक अर्थ को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं
  rationale: यह चयन स्वर्गीय सेनाओं, दैवी शक्तियों या व्यापक समूहों में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  choice: जिनके सामने मैं खड़ा रहता हूँ
  rationale: मुख्य पाठ में सामने खड़े होने का चित्र सुरक्षित है, जबकि वर्तमानकालिक ‘रहता हूँ’ भविष्यद्वक्ता की निरंतर सेवा का स्वाभाविक हिन्दी बोध देता है।
- source_word: לוּלֵי
  choice: यदि ... न
  rationale: यह अपवादसूचक शर्त को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פְּנֵי יְהוֹשָׁפָט ... אֲנִי נֹשֵׂא
  choice: मैं ... यहोशापात का लिहाज़ न करता
  rationale: ‘चेहरा उठाने’ के इब्रानी मुहावरे का आशय किसी व्यक्ति का आदर या पक्ष करना है; ‘लिहाज़ करना’ उस भाव को सहज हिन्दी में रखता है।
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  choice: मैं न तेरी ओर देखता, न तुझे देखता
  rationale: शपथ-वाक्य में निहित निषेध को स्पष्ट किया गया है और दोनों समानांतर क्रियाओं को अलग-अलग सुरक्षित रखा गया है।
- source_word: אֱלִישָׁע / יְהוֹשָׁפָט / יְהוּדָה
  choice: एलीशा / यहोशापात / यहूदा
  rationale: व्यक्तिनाम और राज्यनाम के लिए हिन्दी बाइबलीय परंपरा में पहचाने जाने वाले मानक रूप अपनाए गए हैं।
theological_decisions:
- issue: दिव्य नाम YHWH का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; उसे उपाधि से बदलने के बजाय नाम के रूप में बनाए रखा गया है।
- issue: परमेश्वर के सामने भविष्यद्वक्ता की स्थिति
  choice: जिनके सामने मैं खड़ा रहता हूँ
  alternative: जिनकी मैं सेवा करता हूँ
  rationale: मुख्य पाठ मूल के खड़े होने वाले चित्र और सेवा-संबंधी संकेत, दोनों के लिए जगह छोड़ता है; व्याख्यात्मक विकल्प पाद-टिप्पणी में दिया गया है।
- issue: यहोशापात के प्रति सम्मान का मुहावरा
  choice: यहोशापात का लिहाज़ न करता
  alternative: यदि यहोशापात के कारण न होता
  rationale: यह चयन व्यक्ति के प्रति आदर/अनुग्रह के मूल मुहावरे को व्यक्त करता है, बिना यह तय किए कि केवल उसकी भौतिक उपस्थिति अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। शपथ-सूत्र की औपचारिकता सुरक्षित है; एलीशा का संबोधन जानबूझकर एकवचन और तीखा (‘तेरी/तुझे’) रखा गया है।
