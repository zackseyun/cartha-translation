base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: All Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
translation:
  language: hi
  text: समूचे मोआब ने सुना कि राजा उनसे युद्ध करने के लिए चढ़ आए थे। तब कमरबंद बाँधने की आयु के हर पुरुष और उससे अधिक आयु के पुरुषों को इकट्ठा किया गया[a], और वे सीमा पर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कमरबंद बाँधने वाले हर एक से लेकर ऊपर तक।” यह संभवतः युद्ध करने योग्य आयु और उससे अधिक आयु के पुरुषों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  choice: समूचे मोआब
  rationale: यह सामूहिक नाम पूरे मोआबी समुदाय को दर्शाता है; यह हिब्रू की सामूहिक अभिव्यक्ति को बनाए रखता है।
- source_word: שָׁמְעוּ
  choice: ने सुना
  rationale: संदेश या समाचार सुनने के सामान्य अर्थ को सीधे व्यक्त करता है।
- source_word: כִּי עָלוּ הַמְּלָכִים
  choice: कि राजा ... चढ़ आए हैं
  rationale: עלה की ऊपर चढ़ने/चढ़ आने की दिशा-सूचक छवि और सैनिक अभियान, दोनों को बनाए रखता है।
- source_word: לְהִלָּחֶם בָּם
  choice: उनसे युद्ध करने के लिए
  rationale: לחם के साथ ב विरोधी पक्ष से युद्ध करने का भाव देता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: וַיִּצָּעֲקוּ
  choice: को बुलाकर इकट्ठा किया गया
  rationale: संदर्भ में क्रिया केवल पुकारने या चिल्लाने की नहीं, बल्कि आक्रमण के उत्तर में लोगों को जुटाने की ओर संकेत करती है; निष्क्रिय भाव भी सुरक्षित है।
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  choice: कमरबंद बाँधने योग्य आयु के हर पुरुष से लेकर उससे अधिक आयु वालों तक
  rationale: कमरबंद की मूल ठोस छवि और न्यूनतम आयु से ऊपर तक के समावेश, दोनों को व्यक्त करता है; सैन्य आयु का निहितार्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  choice: उन्होंने सीमा पर मोर्चा संभाल लिया
  rationale: शाब्दिक रूप से सीमा पर खड़े होने को सैनिक प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है।
