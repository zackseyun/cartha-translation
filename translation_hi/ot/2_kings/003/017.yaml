source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה לֹֽא תִרְא֥וּ ר֨וּחַ֙ וְ/לֹֽא תִרְא֣וּ גֶ֔שֶׁם וְ/הַ/נַּ֥חַל הַ/ה֖וּא יִמָּ֣לֵא מָ֑יִם וּ/שְׁתִיתֶ֛ם אַתֶּ֥ם וּ/מִקְנֵי/כֶ֖ם וּֽ/בְהֶמְתְּ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
translation:
  language: hi
  text: क्योंकि याहवे यों कहता है, ‘तुम न हवा देखोगे, न वर्षा; फिर भी वह नदी-पाट[a] पानी से भर जाएगा, और तुम, तुम्हारे मवेशी और पशु पानी पिएँगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह घाटी,” “वह नाला,” अथवा “वह सूखा नदी-पाट।” इब्रानी शब्द נחל प्रायः किसी मौसमी जलधारा या बरसाती नदी-पाट को दर्शाता है।
    reason: נחל के भौगोलिक अर्थ-क्षेत्र तथा उसके संभव हिंदी विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण को रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यों कहता है
  rationale: כִּי के व्याख्यात्मक संबंध और भविष्यवाणी की प्रचलित उद्घोषणा—दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תִרְאוּ
  choice: तुम ... देखोगे
  rationale: संदर्भ में अपूर्ण क्रिया भावी घटना बताती है; इसलिए भविष्यकाल उपयुक्त है।
- source_word: רוּחַ
  choice: हवा
  rationale: वर्षा के साथ मौसम-संबंधी समानांतर प्रयोग होने के कारण यहाँ अर्थ ‘हवा’ है, ‘आत्मा’ या ‘श्वास’ नहीं।
- source_word: גֶשֶׁם
  choice: वर्षा
  rationale: मौसम के संदर्भ में यह मानक और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: הַנַּחַל הַהוּא
  choice: यह बरसाती नदी की धारा
  rationale: נחל प्रायः ऐसी मौसमी जलधारा या सूखे नदी-पाट को दर्शाता है जिसमें बरसात के समय पानी बहता है। ‘बरसाती नदी की धारा’ हिन्दी पाठक के लिए ‘वादी’ की अपेक्षा अधिक स्पष्ट है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יִמָּלֵא מָיִם
  choice: पानी से भर जाएगी
  rationale: निफ़ाल रूप का परिणामसूचक/कर्मवाच्य भाव स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: וּשְׁתִיתֶם
  choice: पानी पिएँगे
  rationale: यह प्रतिज्ञात घटनाक्रम का साधारण भविष्यकाल है; कर्म ‘पानी’ को हिन्दी में स्पष्ट करना स्वाभाविक है।
- source_word: מִקְנֵיכֶם
  choice: तुम्हारे मवेशी
  rationale: यहाँ स्वामित्व वाले झुंड या पशुधन का संदर्भ है; ‘मवेशी’ सहज हिन्दी है।
- source_word: בְהֶמְתְּכֶם
  choice: तुम्हारे दूसरे पशु
  rationale: מִקְנֵיכֶם के साथ आए व्यापक पशु-संज्ञा को अलग रखते हुए ‘दूसरे’ से हिन्दी में अनावश्यक पुनरुक्ति घटाई गई है, बिना सटीक श्रेणियाँ निर्धारित किए।
theological_decisions:
- issue: ईश्वरीय नाम YHWH का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से है। हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से बदलने के बजाय सुरक्षित रखता है; ‘याहवे’ अधिक समीपी वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यवाणी-शैली और सामान्य पाठक के लिए स्पष्ट शब्दावली अपनाई गई है। नकारात्मक समानांतरता ‘न ... न ...’ से और अप्रत्याशित परिणाम ‘फिर भी’ से व्यक्त किया गया है।
