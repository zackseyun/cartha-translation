  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को अगली घटना की ओर बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לּוֹ
