- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: קַח
  choice: ले
  rationale: לקח के आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: קֶשֶׁת וְחִצִּים
  choice: एक धनुष और तीर
  rationale: קֶשֶׁת हथियार के रूप में ‘धनुष’ और חִצִּים बहुवचन ‘तीर’ है। हिन्दी में बहुवचन ‘तीर’ का रूप अपरिवर्तित रहता है; ‘एक’ धनुष की अनिश्चितता को स्वाभाविक बनाता है।
- source_word: וַיִּקַּח
  choice: तब वह ... ले आया
  rationale: वाव-क्रमिक अगली प्रत्युत्तरात्मक क्रिया बताता है। אֵלָיו की दिशात्मकता के साथ हिन्दी में ‘ले आया’ स्वाभाविक है, यद्यपि आने की क्रिया इब्रानी में अलग क्रियापद से व्यक्त नहीं हुई है।
- source_word: אֵלָיו
  choice: उसके पास
  rationale: אֶל के तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का स्वाभाविक अर्थ ‘उसकी ओर/उसके पास’ है; प्रसंग में संकेत एलीशा की ओर है। संभावित वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
