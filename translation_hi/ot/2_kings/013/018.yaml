  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
translation:
  language: hi
  text: तब उसने कहा, “तीरों को लो,” और उसने उन्हें ले लिया। फिर उसने इस्राएल के राजा से कहा, “भूमि पर प्रहार करो।” उसने भूमि पर तीन बार प्रहार किया और रुक गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह खड़ा रहा”; हिब्रू क्रिया का शाब्दिक अर्थ “खड़ा रहा” है, पर यहाँ प्रसंग में इसका अर्थ तीन बार प्रहार करने के बाद रुक जाना है।
    reason: lexical_alternative
