  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
translation:
  language: hi
  text: तब एलीशा मर गया, और उन्होंने उसे दफ़ना दिया। मोआब के छापामार दल वर्ष के आने पर[a] देश में आया करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘वर्ष के आने पर’ है; यह मुहावरा वर्ष के आरम्भ, सम्भवतः वसन्त ऋतु—जब सैन्य अभियान आरम्भ होते थे—का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: तब ... मर गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम व्यक्त करता है और מות का सीधा अर्थ बनाए रखता है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: וַיִּקְבְּרֻהוּ
  choice: और उन्होंने उसे दफ़ना दिया
  rationale: इब्रानी में क्रिया सक्रिय बहुवचन है और उसके साथ तृतीय पुरुष एकवचन कर्म-प्रत्यय है; अनिश्चित कर्ता ‘उन्होंने’ इस रूप को सुरक्षित रखता है।
- source_word: גְדוּדֵי מוֹאָב
  choice: मोआब के लुटेरे दल
  rationale: גְדוּד यहाँ औपचारिक सेना की अपेक्षा छापा मारने या लूटने वाले दलों को सूचित करता है; संबंधवाचक संरचना भी बनी रहती है।
- source_word: יָבֹאוּ
  choice: आया करते थे
  rationale: अपूर्ण क्रिया इस प्रसंग में बार-बार होने वाली प्रथागत गतिविधि बताती है; आधुनिक हिन्दी में ‘आया करते थे’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָאָרֶץ
  choice: देश में
  rationale: בוא के साथ यह गमन अथवा प्रवेश का भाव रखता है। हिन्दी में ‘देश में आया करते थे’ स्वाभाविक ढंग से ‘देश के भीतर आने’ का अर्थ देता है।
- source_word: בָּא שָׁנָה
  choice: वर्ष के आरम्भ में
  rationale: शाब्दिक रूप ‘वर्ष के आने पर’ है। मुहावरे का आशय वर्ष का आरम्भ या मोड़ है, जो सम्भवतः वसन्तकालीन सैन्य-अभियान के मौसम से जुड़ा था; मुख्य पाठ में अर्थ-स्पष्ट रूप रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
