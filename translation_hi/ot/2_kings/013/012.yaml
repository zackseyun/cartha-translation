source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: The rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: योआश के शेष कार्य, उसने जो कुछ किया, और उसका वह पराक्रम जिसके बल पर उसने यहूदा के राजा अमस्याह से युद्ध किया[a]—क्या ये सब ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ में लिखे नहीं हैं?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “यहूदा के राजा अमस्याह के विरुद्ध युद्ध किया” भी अनुवाद किया जा सकता है। इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “साथ” है, लेकिन युद्ध के इस प्रसंग में वह विरोधी पक्ष के साथ मुठभेड़ का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: यह ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ राजाओं में उद्धृत एक राजकीय अभिलेख का उल्लेख है, न कि बाइबल की इतिहास की पुस्तकों का।
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: योआश के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में דִּבְרֵי का आशय केवल ‘बातें’ नहीं, बल्कि राजा के काम या कृत्य हैं; ‘बाकी काम’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: यह כָל की व्यापकता और עָשָׂה के सामान्य अर्थ, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: וּגְבוּרָתוֹ
  choice: उसका वह पराक्रम
  rationale: גְּבוּרָה यहाँ सामर्थ्य, वीरता या पराक्रम का बोध कराता है; आगे का युद्ध-संबंधी उपवाक्य उसके प्रकट रूप को स्पष्ट करता है।
- source_word: אֲשֶׁר נִלְחַם עִם
  choice: जिसके बल पर … से युद्ध किया
  rationale: सम्बन्धवाचक उपवाक्य को पराक्रम से स्पष्ट रूप से जोड़ता है। עִם का मूल अर्थ ‘साथ’ है, पर युद्ध के प्रसंग में सामने वाले प्रतिद्वंद्वी को सूचित करता है; हिन्दी में ‘से युद्ध किया’ स्वाभाविक है।
- source_word: אֲמַצְיָה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अमस्याह
  rationale: नाम और राजकीय पदवी का मानक, सहज हिन्दी क्रम।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या ये सब … लिखे नहीं हैं?
  rationale: मूल के आलंकारिक प्रश्न और कर्मवाच्य रूप को सुरक्षित रखता है; ‘ये सब’ पहले गिनाए गए अनेक विषयों को समेटता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: ‘इस्राएल के राजाओं के इतिहास की पुस्तक’ में
  rationale: עַל को लिखित स्रोत के संदर्भ में हिन्दी के स्वाभाविक ‘में’ से व्यक्त किया गया है। ‘इतिहास की पुस्तक’ राजकीय वार्षिक अभिलेख का बोध कराती है और पाठक के लिए समझने योग्य है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। राजकीय सारांश की सूत्रात्मक शैली और मूल का आलंकारिक प्रश्न सुरक्षित हैं। उद्धरण-चिह्न स्रोत-पुस्तक के शीर्षक को स्पष्ट करते हैं।
