  text: וַ/יֹּ֣אמֶר לְ/מֶ֣לֶךְ יִשְׂרָאֵ֗ל הַרְכֵּ֤ב יָֽדְ/ךָ֙ עַל הַ/קֶּ֔שֶׁת וַ/יַּרְכֵּ֖ב יָד֑/וֹ וַ/יָּ֧שֶׂם אֱלִישָׁ֛ע יָדָ֖י/ו עַל יְדֵ֥י הַ/מֶּֽלֶךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/016.yaml
  text: Then he said to the king of Israel[a], “Put your hand on the bow.” So he put his hand on it, and Elisha laid his hands on the king’s hands.
translation:
  language: hi
  text: तब उसने इस्राएल के राजा से कहा, “अपना हाथ धनुष पर रखो।” राजा ने अपना हाथ उस पर रखा, और एलीशा ने अपने हाथ राजा के हाथों पर रख दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַרְכֵּב
  choice: रखो
  rationale: रכב के हिफ़इल आज्ञार्थक रूप का यहाँ आशय हाथ को धनुष पर टिकाने या रखने से है। ‘रखो’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया को स्पष्ट करता है; अधिक शाब्दिक ‘चढ़ाओ’ इस प्रसंग में अस्वाभाविक लग सकता है।
- source_word: יָדְךָ עַל הַקֶּשֶׁת
  choice: अपना हाथ धनुष पर
  rationale: यह सीधा स्थानवाचक प्रयोग है। ‘धनुष पर’ स्वाभाविक हिन्दी है और इब्रानी עַל का उपयुक्त अर्थ देता है।
- source_word: וַיַּרְכֵּב יָדוֹ
  choice: राजा ने अपना हाथ उस पर रखा
  rationale: इब्रानी में कर्ता सर्वनाम से समझा जाता है और धनुष दोबारा नहीं कहा गया। हिन्दी में ‘राजा’ से कर्ता स्पष्ट किया गया तथा ‘उस पर’ पहले बताए गए धनुष की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: וַיָּשֶׂם
  choice: रख दिए
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है। बहुवचन ‘हाथ’ के साथ ‘रख दिए’ हिन्दी में स्वाभाविक है और किसी अतिरिक्त धार्मिक अर्थ को नहीं जोड़ता।
- source_word: יָדָיו עַל יְדֵי הַמֶּלֶךְ
  choice: अपने हाथ राजा के हाथों पर
  rationale: मूल पाठ एलीशा और राजा, दोनों के हाथों को बहुवचन में व्यक्त करता है। अनुवाद उसी भौतिक चित्र को बनाए रखता है।
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  choice: तब उसने इस्राएल के राजा से कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है। ‘उसने’ मूल पाठ की सर्वनामात्मक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: एलीशा द्वारा अपने हाथ राजा के हाथों पर रखने का अर्थ
  choice: मुख्य पाठ में केवल क्रिया का सीधा वर्णन किया गया है।
  alternative: इसे भविष्यद्वक्ता से सामर्थ्य मिलने या युद्ध में परमेश्वर के मार्गदर्शन का संकेत बताना।
  rationale: यह क्रिया प्रतीकात्मक हो सकती है, पर इस पद में उसका अर्थ स्पष्ट नहीं किया गया। इसलिए अनुवाद किसी विशेष धर्मवैज्ञानिक व्याख्या को शब्दों में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘धनुष’, ‘इस्राएल’ और ‘एलीशा’ जैसे परिचित बाइबिलीय रूप रखे गए हैं। सर्वनाम की संभावित अस्पष्टता से बचने के लिए दूसरे वाक्य में ‘राजा’ स्पष्ट किया गया है, जबकि पहले वाक्य का ‘उसने’ मूल की कथात्मक कड़ी को बनाए रखता है।
