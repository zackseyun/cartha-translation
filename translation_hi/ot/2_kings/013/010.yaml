  yaml_path: translation/ot/2_kings/013/010.yaml
  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
translation:
  language: hi
  text: यहूदा के राजा योआश के सैंतीसवें वर्ष में[a], यहोआहाज का पुत्र यहोआश शोमरोन में इस्राएल का राजा बना और उसने सोलह वर्ष राज्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ यहूदा के राजा יוֹאָשׁ (योआश) और इस्राएल के राजा יְהוֹאָשׁ (यहोआश) के नामों में भेद करता है; कुछ अनुवाद दोनों नामों को एक ही रूप में लिखते हैं।
    reason: lexical_alternative
