  language: hi
  text: यहूदा के राजा अहज्याह के पुत्र योआश के तेईसवें वर्ष में, येहू का पुत्र यहोआहाज सामरिया में इस्राएल पर राज करने लगा। उसने सत्रह वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָלַךְ
  choice: राज करने लगा
  rationale: आरंभिक राज्यारोहण-सूत्र के संदर्भ में हिब्रू पूर्ण क्रिया को स्वाभाविक हिन्दी में आरंभ का भाव देते हुए व्यक्त किया गया है; इससे अंग्रेज़ी परामर्श-पाठ का सही आशय भी बना रहता है।
- source_word: עַל־יִשְׂרָאֵל
  choice: इस्राएल पर
