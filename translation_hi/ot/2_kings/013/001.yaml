- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: यह राज्य-संचालन अथवा राजकीय केंद्र का स्थान बताता है; इसलिए स्थानवाचक रूप सीधे रखा गया है।
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: सत्रह वर्ष तक
  rationale: राज्यकाल की अवधि को स्वाभाविक आधुनिक हिन्दी में स्पष्ट किया गया है।
