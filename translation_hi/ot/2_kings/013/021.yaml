base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/021.yaml
  text: And it happened, as they were burying a man, that behold, they saw the raiding band; so they threw the man into Elisha’s grave. And when the man went and touched Elisha’s bones, he came to life and stood up on his feet.
translation:
  language: hi
  text: एक बार जब कुछ लोग एक आदमी को दफ़ना रहे थे, तभी उन्होंने छापा मारने वाले एक दल को देखा। इसलिए उन्होंने उस आदमी को एलीशा की कब्र में फेंक दिया। वह आदमी जाकर एलीशा की हड्डियों को छू गया, तो जीवित हो उठा और अपने पैरों पर खड़ा हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַגְּדוּד
  choice: लुटेरे दल
  rationale: यह शब्द यहाँ धावा बोलने वाले सशस्त्र गिरोह को दर्शाता है; ‘लुटेरे दल’ प्रसंग के अनुकूल और सामान्य हिंदी में स्पष्ट है।
- source_word: וַיֵּלֶךְ וַיִּגַּע
  choice: जाकर ... से छू गया
  rationale: मसोरेटिक पाठ में गति-सूचक क्रिया וַיֵּלֶךְ को बनाए रखते हुए अगले क्रियापद से स्वाभाविक हिंदी में जोड़ा गया है; इससे पाठ की कठिनता को मिटाया नहीं गया।
- source_word: וַיְחִי
  choice: जीवित हो उठा
  rationale: यहाँ मृत व्यक्ति के फिर जीवित होने का अर्थ है; यह हिंदी में स्वाभाविक और स्रोतार्थ के प्रति निष्ठावान है।
- source_word: וַיָּקָם עַל רַגְלָיו
  choice: अपने पैरों पर खड़ा हो गया
  rationale: हिब्रू मुहावरे का अर्थ और दृश्यात्मकता दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: जीवन लौटने और एलीशा की हड्डियों के स्पर्श के बीच संबंध
  choice: 'घटना का सीधा क्रम रखा गया: हड्डियों से छूते ही वह जीवित हो उठा'
  alternative: किसी व्याख्यात्मक कारण या माध्यम को जोड़ना
  rationale: मूल पाठ घटना बताता है, पर उसके तात्त्विक कारण या कार्यविधि की व्याख्या नहीं करता; इसलिए कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक וַיְהִי को शाब्दिक ‘और ऐसा हुआ’ के बजाय कथा-प्रवाह में स्वाभाविक ‘एक बार’ से व्यक्त किया गया है; וְהִנֵּה की आकस्मिकता ‘तभी’ से व्यक्त हुई है।
