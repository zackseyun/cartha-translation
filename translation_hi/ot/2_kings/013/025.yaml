base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
translation:
  language: hi
  text: तब यहोआहाज के पुत्र यहोआश ने हजाएल के पुत्र बेन-हदद के हाथ से वे नगर फिर से ले लिए, जिन्हें उसने युद्ध में यहोआश के पिता यहोआहाज के हाथ से ले लिया था। योआश[a] ने उसे तीन बार पराजित किया,[b] और इस्राएल के नगरों को पुनः प्राप्त कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में इस पद में एक ही राजा के नाम के दो रूप हैं: पहले ‘यहोआश’ और बाद में उसका छोटा रूप ‘योआश’।'
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर प्रहार किया।” इब्रानी क्रिया युद्ध में प्रहार करने और इस प्रकार पराजित करने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיִּקַּח
  choice: फिर ले लिए
  rationale: यहाँ שוב के साथ לקח खोए हुए नगरों को पुनः लेने का भाव देता है। हिंदी में ‘फिर ले लिए’ दोनों क्रियाओं का संयुक्त अर्थ स्वाभाविक और अनावश्यक पुनरुक्ति के बिना व्यक्त करता है।
- source_word: הֶעָרִים
  choice: नगर
  rationale: प्राचीन आबादी और प्रशासनिक/किलेबंद केंद्रों के लिए मानक, गरिमापूर्ण हिंदी शब्द।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: इब्रानी मुहावरे का रूप बनाए रखता है और अधिकार से छुड़ाने का भाव हिंदी में भी स्पष्ट है।
- source_word: בֶּן־הֲדַד
  choice: बेन-हदद
  rationale: नाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: पहले नगरों के खोए जाने की सैनिक परिस्थिति को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׁלֹשׁ פְּעָמִים
  choice: तीन बार
  rationale: संख्यात्मक मुहावरे का सीधा और आधुनिक हिंदी रूप।
- source_word: הִכָּהוּ
  choice: उसे ... पराजित किया
  rationale: सैनिक प्रसंग में נכה का अर्थ प्रहार करके हराना हो सकता है; ‘पराजित किया’ तीन अलग अभियानों के संदर्भ में स्वाभाविक है और घातक वार का अनावश्यक निष्कर्ष नहीं निकालता।
- source_word: יְהוֹאָשׁ / יוֹאָשׁ
  choice: यहोआश / योआश
  rationale: पद में एक ही राजा के नाम के दीर्घ और संक्षिप्त, दोनों इब्रानी रूप आए हैं; हिंदी में दोनों को दिखाया गया है।
- source_word: וַיָּשֶׁב אֶת עָרֵי יִשְׂרָאֵל
  choice: इस्राएल के नगर फिर से प्राप्त कर लिए
  rationale: इस्राएली नियंत्रण में नगरों की पुनर्प्राप्ति को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: הִכָּהוּ का सैनिक अर्थ
  choice: पराजित किया
  alternative: उस पर प्रहार किया
  rationale: प्रसंग बार-बार हुए सैनिक मुकाबलों का है। मुख्य पाठ में परिणामसूचक सैनिक अर्थ रखा गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण ऐतिहासिक-वृत्तांत शैली अपनाई गई है। ‘के हाथ से’ जैसे स्रोत-संगत मुहावरे को बनाए रखा गया है। नामों के दोनों रूपों को स्पष्ट करने के लिए मुख्य पाठ में छोटा व्याख्यात्मक वाक्य जोड़ने के बजाय पादटिप्पणी चिह्न सीधे नाम के साथ होना बेहतर होगा; प्रकाशन-सज्जा में पाठ को ‘...बेन-हदद के हाथ से[a]...’ नहीं, बल्कि दूसरे नाम-रूप ‘योआश[a]’ पर चिह्नित किया जा सकता है।
