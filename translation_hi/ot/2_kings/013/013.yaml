  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों के लिए हिन्दी बाइबलीय प्रचलन—योआश, यारोबाम, शोमरोन और इस्राएल—अपनाया गया है। मृत्यु के इब्रानी मुहावरे को मुख्य पाठ में बनाए रखकर उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
