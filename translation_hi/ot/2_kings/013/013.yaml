  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
translation:
  language: hi
  text: तब योआश अपने पुरखाओं के साथ सो गया[a], और यारोबाम उसके सिंहासन पर बैठा। योआश को इस्राएल के राजाओं के साथ शोमरोन में दफनाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पुरखाओं के साथ लेट गया”; यह इब्रानी मुहावरा किसी राजा की मृत्यु बताने वाला परंपरागत वाक्यांश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: यह क्रिया ‘अपने पुरखाओं के साथ’ पदबंध के साथ मिलकर राजा की मृत्यु का परंपरागत इब्रानी सूत्र बनाती है। ‘सो गया’ मूल बिंब और उसकी कथात्मक गरिमा को बनाए रखता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से वंशगत पूर्वजों का अर्थ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट रहता है, जबकि मूल का राजवंशीय सूत्र भी सुरक्षित रहता है।
- source_word: יָשַׁב עַל כִּסְאוֹ
  choice: उसके सिंहासन पर बैठा
  rationale: यह मूल इब्रानी बिंब को सीधे रखता है और प्रसंग में राजगद्दी के उत्तराधिकार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקָּבֵר
  choice: दफनाया गया
  rationale: निष्क्रिय रूप मूल में अनिर्दिष्ट कर्ता को अनिर्दिष्ट ही रखता है और हिन्दी में दफन-सूचना के लिए स्वाभाविक है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: पूर्वसर्ग ב यहाँ स्थानसूचक है; ‘में’ दफनाने के स्थान को स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के साथ
  rationale: यह मूल के ‘साथ’ संबंध को बनाए रखता है और पूर्ववर्ती इस्राएली राजाओं के बीच राजकीय दफन का संकेत देता है।
