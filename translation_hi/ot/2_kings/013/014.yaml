  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
translation:
  language: hi
  text: एलीशा उस बीमारी से बीमार पड़ा था जिससे उसकी मृत्यु होने वाली थी। तब इस्राएल का राजा योआश नीचे उसके पास गया और उसके लिए रोया[a]। उसने कहा, “मेरे पिता[b], मेरे पिता! इस्राएल का रथ और उसके घुड़सवार!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके चेहरे के ऊपर रोया।”
    reason: इब्रानी के अधिक शाब्दिक स्थानिक प्रयोग को सुरक्षित रखना।
  - marker: b
    text: यह पुकार 2 राजा 2:12 की प्रतिध्वनि है, जहाँ एलीशा ने एलिय्याह के लिए यही शब्द कहे थे।
    reason: महत्त्वपूर्ण अंतर्पाठीय संबंध बताना।
lexical_decisions:
- source_word: חָלָה אֶת חָלְיוֹ
  choice: उस बीमारी से बीमार पड़ा
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद की इब्रानी पुनरुक्ति को यथासंभव स्वाभाविक हिन्दी में बनाए रखता है और बीमारी के आरम्भ/स्थिति में आने का भाव व्यक्त करता है।
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: जिससे वह मरने वाला था
  rationale: कथा के उस समय से आगे होने वाली मृत्यु का भाव रखता है और बीमारी को मृत्यु का कारण बताता है।
- source_word: וַיֵּרֶד אֵלָיו
  choice: उसके पास नीचे गया
  rationale: יָרַד के दिशासूचक ‘नीचे जाना’ को बनाए रखता है, यद्यपि हिन्दी में केवल ‘उसके पास गया’ अधिक सहज होता।
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  choice: उसके लिए रोया
  rationale: संदर्भ में शोक का स्वाभाविक हिन्दी रूप है; इब्रानी का शाब्दिक ‘उसके चेहरे पर रोया’ पाठक-टिप्पणी में सुरक्षित रखा गया है।
- source_word: אָבִי אָבִי
  choice: हे मेरे पिता, हे मेरे पिता!
  rationale: प्रथम पुरुष संबंधसूचक प्रत्यय, आदर और शोकपूर्ण पुकार—तीनों को सुरक्षित रखता है।
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  choice: इस्राएल का रथ और उसके घुड़सवार
  rationale: רֶכֶב के एकवचन रूप और פָרָשָׁיו के बहुवचन को बनाए रखते हुए रूपक को बिना व्याख्यात्मक विस्तार के प्रस्तुत करता है।
theological_decisions:
- issue: ‘इस्राएल का रथ और उसके घुड़सवार’ का रूपक
  choice: इसे एलीशा को संबोधित सीधी पुकार के रूप में ज्यों का त्यों रखा गया है।
  alternative: इसे ‘आप ही इस्राएल की असली रक्षा और शक्ति हैं’ कहकर स्पष्ट करना, अथवा स्वर्गीय रथों के दर्शन के रूप में प्रस्तुत करना।
  rationale: वाक्य 2 राजा 2:12 की प्रतिध्वनि है और नबी के महत्त्व को सैन्य बिंब द्वारा व्यक्त करता है। मूल पाठ यह नहीं खोलता कि रूपक को कितनी दूर तक समझा जाए, इसलिए अनुवाद भी उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य। ‘तब’ वाक्यों के घटनाक्रम को स्वाभाविक रूप से जोड़ता है, न कि किसी अलग कालवाचक इब्रानी शब्द का अनुवाद करता है। ‘नीचे गया’ कुछ असामान्य लग सकता है, पर मूल की भौगोलिक दिशा सुरक्षित रखने के लिए रखा गया है।
