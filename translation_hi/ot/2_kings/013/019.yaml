  choice: क्रोधित हुआ
  rationale: क्रोध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है, बिना तीव्रता को अनावश्यक रूप से बढ़ाए।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: इब्रानी की प्रचलित उपाधि को बनाए रखता है; इसे केवल ‘भविष्यद्वक्ता’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: לְהַכּוֹת
  choice: भूमि पर ... मारना
  rationale: मूल में कर्म स्पष्ट नहीं है, पर पद 18 की तुरन्त पिछली क्रिया से भूमि अभिप्रेत है; हिन्दी में अर्थ स्पष्ट करने के लिए इसे जोड़ा गया है।
- source_word: חָמֵשׁ אוֹ שֵׁשׁ פְּעָמִים
  choice: पाँच या छह बार
  rationale: संख्या-संबंधी अभिव्यक्ति का सीधा अनुवाद।
- source_word: הִכִּיתָ אֶת אֲרָם
  choice: तुम अराम को ... मारते
  rationale: भूमि पर मारने और अराम पर प्रहार करने के बीच एक ही इब्रानी क्रिया का प्रतीकात्मक संबंध सुरक्षित रखता है।
- source_word: עַד כַּלֵּה
  choice: जब तक उसका अंत न हो जाता
  rationale: पूर्णतः समाप्त कर देने के भाव को स्वाभाविक हिन्दी में रखता है, पर ‘सर्वनाश’ जैसे अधिक विशिष्ट शब्द से अर्थ को कठोर नहीं बनाता।
- source_word: וְעַתָּה
  choice: पर अब
  rationale: संभावित परिणाम और वास्तविक सीमित परिणाम के बीच विरोध स्पष्ट करता है।
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  choice: तुम अराम को केवल तीन बार मारोगे
  rationale: अपूर्ण क्रिया का भविष्यसूचक बल व्यक्त करता है; ‘केवल’ पहले बताए पाँच या छह बार के विपरीत निहित सीमा को स्पष्ट करता है।
theological_decisions:
- issue: भूमि पर प्रहार और अराम पर प्रहार के प्रतीकात्मक संबंध को कैसे सुरक्षित रखा जाए
  choice: दोनों के लिए ‘मारना’ रखा गया और पहली क्रिया में संदर्भ से ‘भूमि पर’ जोड़ा गया।
  alternative: पहली जगह ‘भूमि को पीटना’ और दूसरी जगह ‘अराम को पराजित करना’।
  rationale: एक ही क्रिया रखने से भविष्यसूचक सांकेतिक कार्य और सैन्य परिणाम का संबंध पाठक को दिखता है, बिना अतिरिक्त धार्मिक निष्कर्ष जोड़े।
- issue: עַד כַּלֵּה की पूर्णता को कितनी प्रबलता से व्यक्त किया जाए
  choice: जब तक उसका अंत न हो जाता
  alternative: जब तक तुम अराम का पूरी तरह विनाश न कर देते
  rationale: मूल में पूर्ण अंत का भाव है, किन्तु ‘पूरी तरह विनाश’ संभावित अर्थ को अधिक स्पष्ट और कठोर कर देता है; चुना हुआ पाठ मूल की व्यापकता और तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘परमेश्वर का जन’ पारंपरिक बाइबलीय उपाधि को समझने योग्य रूप में बनाए रखता है। ‘मारना’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल का शब्द-संबंध सुरक्षित रहे।
