  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
translation:
  language: hi
  text: तब परमेश्वर का जन उस पर क्रोधित हुआ और बोला, “तुम्हें भूमि पर पाँच या छह बार प्रहार करना चाहिए था[a]; तब तुम अराम पर प्रहार करते रहते, यहाँ तक कि उसका अंत हो जाता[b]। पर अब तुम अराम पर केवल तीन बार प्रहार करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल “प्रहार करना” है; “भूमि पर” पद 18 में ठीक पहले किए गए कार्य से स्पष्ट होने के कारण जोड़ा गया है।
    reason: cross_reference
  - marker: b
    text: या, “जब तक तुम अराम का अंत न कर देते”; मूल अभिव्यक्ति पूर्ण समाप्ति का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
