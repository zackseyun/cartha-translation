source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר פְּתַ֧ח הַ/חַלּ֛וֹן קֵ֖דְמָ/ה וַ/יִּפְתָּ֑ח וַ/יֹּ֤אמֶר אֱלִישָׁ֤ע יְרֵה֙ וַ/יּ֔וֹר וַ/יֹּ֗אמֶר חֵץ תְּשׁוּעָ֤ה לַֽ/יהוָה֙ וְ/חֵ֣ץ תְּשׁוּעָ֣ה בַֽ/אֲרָ֔ם וְ/הִכִּיתָ֧ אֶת אֲרָ֛ם בַּ/אֲפֵ֖ק עַד כַּלֵּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
translation:
  language: hi
  text: तब उसने कहा, “पूर्व की ओर खिड़की खोलो।” राजा ने खिड़की खोल दी। तब एलीशा ने कहा, “तीर चलाओ,” और उसने तीर चलाया। एलीशा ने कहा, “याहवे की विजय का तीर—अराम पर विजय का तीर![a] तुम अपेक में अराम को मारोगे, यहाँ तक कि उसका पूरी तरह अंत कर दोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की ओर से उद्धार का तीर—अराम के विरुद्ध उद्धार का तीर!” इब्रानी शब्द का अर्थ “छुटकारा” या “उद्धार” भी हो सकता है।
    reason: תְּשׁוּעָה की अर्थ-सीमा और לַיהוָה के स्रोतवाचक सम्भव अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  choice: पूर्व की ओर खिड़की खोलो
  rationale: קֵדְמָה दिशासूचक है, इसलिए इसे ‘पूर्व की ओर’ रखा गया है; פְּתַח का स्वाभाविक आज्ञार्थ ‘खोलो’ है।
- source_word: יְרֵה
  choice: तीर चलाओ
  rationale: धनुर्विद्या के प्रसंग में ירה का अर्थ ‘तीर चलाना’ है। हिन्दी में केवल ‘चलाओ’ अस्पष्ट होता, इसलिए निहित कर्म ‘तीर’ स्पष्ट किया गया है।
- source_word: חֵץ תְּשׁוּעָה לַיהוָה
  choice: याहवे की विजय का तीर
  rationale: सैन्य चिह्न-कर्म के इस प्रसंग में תְּשׁוּעָה का ठोस अर्थ ‘विजय’ है। לַיהוָה को स्वाभाविक सम्बन्ध/स्रोत के रूप में ‘याहवे की’ कहा गया है।
- source_word: וְחֵץ תְּשׁוּעָה בַאֲרָם
  choice: अराम पर विजय का तीर
  rationale: दूसरा पद पहले पद की व्याख्या करता है। בַאֲרָם यहाँ विरोधी लक्ष्य को दर्शाता है, जिसे हिन्दी में ‘अराम पर’ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְהִכִּיתָ אֶת אֲרָם בַאֲפֵק
  choice: तुम अपेक में अराम को ... मारते रहोगे
  rationale: נכה का मूल सैन्य बिंब ‘मारना/प्रहार करना’ सुरक्षित रखा गया है; स्थानवाचक ב को ‘अपेक में’ कहा गया है।
- source_word: עַד כַּלֵּה
  choice: जब तक उसका पूरी तरह अंत न कर दो
  rationale: यह पद अराम की सेना को निर्णायक रूप से समाप्त करने का भाव देता है। ‘उसका’ अराम को शत्रु-बल के सामूहिक रूप में संदर्भित करता है।
- source_word: אֲרָם
  choice: अराम
  rationale: इब्रानी भौगोलिक नाम को पारंपरिक आधुनिक राज्य ‘सीरिया’ से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को हिन्दी देवनागरी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: सैन्य भविष्यवाणी में תְּשׁוּעָה का अर्थ
  choice: विजय
  alternative: उद्धार / छुटकारा
  rationale: तीर चलाने और अराम को अपेक में परास्त करने के तात्कालिक प्रसंग में ‘विजय’ सबसे स्पष्ट है, पर शब्द के व्यापक ‘उद्धार’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לַיהוָה में सम्बन्ध या स्रोत
  choice: याहवे की विजय का तीर
  alternative: याहवे की ओर से उद्धार का तीर
  rationale: इब्रानी ל यहाँ अधिकार, सम्बन्ध या स्रोत का संकेत दे सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक सम्बन्धवाचक रूप है; स्रोतवाचक सम्भावना पादटिप्पणी में दी गई है।
- issue: वचन में पूर्ण विनाश की सीमा
  choice: जब तक उसका पूरी तरह अंत न कर दो
  alternative: जब तक उसे पूरी तरह नष्ट न कर दो
  rationale: כַּלֵּה का पूर्णता तक पहुँचाने वाला बल रखा गया है, लेकिन मुख्य पाठ अराम के लोगों के सर्वनाश से अधिक स्वाभाविक रूप से उसके शत्रु-बल के निर्णायक अंत की बात करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी में रखी गई है। लगातार सर्वनामों से उत्पन्न अस्पष्टता दूर करने के लिए प्रसंगानुसार ‘राजा ने’ और ‘एलीशा ने’ स्पष्ट किया गया है। ‘तीर चलाओ’ हिन्दी में स्वाभाविक है और प्राचीन धनुष-बाण के प्रसंग में किसी आधुनिक आग्नेयास्त्र का संकेत नहीं देता।
