source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹאָחָז֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יוֹאָ֥שׁ בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
translation:
  language: hi
  text: यहोआहाज अपने पुरखाओं के साथ सो गया, और लोगों ने उसे सामरिया में दफ़ना दिया। तब उसका पुत्र योआश[a] उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: योआश नाम का रूप ‘यहोआश’ भी मिलता है।
    reason: नाम के इब्रानी संक्षिप्त और विस्तृत रूपों तथा अनुवाद-परंपरा में मिलने वाले वैकल्पिक लिप्यंतरण की जानकारी देना।
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: यहाँ क्रिया ‘अपने पुरखाओं के साथ’ के साथ मिलकर राजा की मृत्यु का पारंपरिक सूत्र बनाती है। ‘सो गया’ मृत्यु का आशय रखते हुए मूल बिंब को भी सुरक्षित रखता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ आधुनिक हिन्दी में वंश के पहले के लोगों को स्वाभाविक रूप से व्यक्त करता है और राजकीय मृत्यु-सूत्र का अर्थ बनाए रखता है।
- source_word: וַיִּקְבְּרֻהוּ
  choice: लोगों ने उसे ... दफ़ना दिया
  rationale: मूल में अनिर्दिष्ट बहुवचन कर्ता है—शाब्दिक रूप से ‘उन्होंने उसे दफ़नाया’। हिन्दी में ‘लोगों ने’ उस अनिर्दिष्ट कर्ता को स्वाभाविक सक्रिय रूप में व्यक्त करता है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: בְּ यहाँ स्थान बताता है; ‘सामरिया में’ स्वाभाविक हिन्दी है और प्रचलित स्थान-नाम को बनाए रखता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस सूत्र में क्रिया राजपद ग्रहण करने का भाव देती है। ‘राजा हुआ’ इस प्रसंग में केवल शासन की अवधि नहीं, बल्कि गद्दी सँभालना भी स्पष्ट करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद राजवंशीय उत्तराधिकार और पूर्व राजा की जगह लेने को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में पारंपरिक और स्रोत-सन्निकट लिप्यंतरण।
- source_word: יוֹאָשׁ
  choice: योआश
  rationale: इस पद में इब्रानी रूप יוֹאָשׁ है; ‘योआश’ उसका सीधा देवनागरी लिप्यंतरण है। ‘यहोआश’ नाम का विस्तृत वैकल्पिक रूप भी परंपरा में मिलता है।
theological_decisions:
- issue: ‘अपने पुरखाओं के साथ सो गया’ का मृत्यु-सूचक अर्थ
  choice: मूल मृत्यु-सूत्र और उसके निद्रा-बिंब को बनाए रखा गया
  alternative: ‘मर गया’
  rationale: सीधा ‘मर गया’ आशय स्पष्ट करता, पर इब्रानी की पारंपरिक और अर्थपूर्ण रूपकात्मक अभिव्यक्ति मिटा देता। संदर्भ में मृत्यु का अर्थ दफ़नाए जाने से स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मृत्यु के इब्रानी राजकीय सूत्र को स्वाभाविक हिन्दी ‘अपने पुरखाओं के साथ सो गया’ में सुरक्षित रखा गया है। अनिर्दिष्ट बहुवचन कर्ता को ‘लोगों ने’ से व्यक्त किया गया है। परामर्श-पाठ में फुटनोट चिह्न ‘पुरखाओं’ के बाद था, पर उसकी सामग्री योआश के नाम से संबंधित है; इसलिए चिह्न को ‘योआश’ के बाद रखा गया है।
