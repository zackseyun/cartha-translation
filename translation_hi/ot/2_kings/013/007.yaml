  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
translation:
  language: hi
  text: क्योंकि अराम के राजा ने यहोआहाज के लिए केवल पचास घुड़सवार, दस रथ और दस हज़ार पैदल सैनिक ही रहने दिए थे; उसने उन्हें नष्ट कर दिया था और मड़ाई में रौंदी जाने वाली धूल के समान कर दिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मड़ाई के लिए धूल के समान।” इब्रानी शब्द मड़ाई करने अथवा उस प्रक्रिया में रौंदे जाने का बिंब भी जगा सकता है।
    reason: मूल पद לָדֻשׁ के ‘मड़ाई’ और ‘रौंदने’ संबंधी अर्थ-क्षेत्र को सुरक्षित रखते हुए हिन्दी मुख्य पाठ की छवि स्पष्ट करता है।
lexical_decisions:
- source_word: הִשְׁאִיר
  choice: रहने दिए
  rationale: हिफ़ईल रूप का अर्थ किसी को शेष रहने देना है। यह प्रयोग कारणात्मक भाव और सेना के बहुत थोड़े बचे होने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָם
  choice: सेना
  rationale: मूल शब्द सामान्यतः ‘लोग’ भी हो सकता है, पर घुड़सवारों, रथों और पैदल सैनिकों की सूची यहाँ स्पष्ट रूप से सैनिक बल को सूचित करती है।
- source_word: כִּי אִם
  choice: केवल … ही
  rationale: नकार के बाद यह इब्रानी मुहावरा अकेले बचे हुए अपवाद को बताता है; हिन्दी में ‘केवल … ही’ स्वाभाविक है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: यह शब्द घोड़ों पर लड़ने वाले सैनिकों को दर्शाता है; ‘घुड़सवार’ संक्षिप्त और प्रचलित हिन्दी है।
- source_word: רֶכֶב
  choice: रथ
  rationale: एकवचन रूप सामूहिक अर्थ दे सकता है, किंतु संख्या दस के साथ यहाँ युद्ध-रथ गिने गए हैं।
- source_word: רַגְלִי
  choice: पैदल सैनिक
  rationale: शब्द पैदल चलकर लड़ने वाले सैनिकों को दर्शाता है; यह सामान्य पाठक के लिए स्पष्ट है।
- source_word: אִבְּדָם
  choice: बाकी सेना को नष्ट कर दिया था
  rationale: पिएल रूप प्रबल विनाश को व्यक्त करता है। सर्वनाम का संदर्भ यहोआहाज के उस सैन्य बल से है जो उल्लिखित थोड़ी-सी शेष सेना के अतिरिक्त था।
- source_word: וַיְשִׂמֵם
  choice: उसे … के समान कर दिया था
  rationale: שׂים और तुलनात्मक पद मिलकर किसी वस्तु को एक दशा में पहुँचा देने का भाव देते हैं। हिन्दी में एकवचन ‘उसे’ सामूहिक संज्ञा ‘सेना’ से मेल खाता है।
- source_word: כֶּעָפָר לָדֻשׁ
  choice: मड़ाई में रौंदी गई धूल के समान
  rationale: यह रूपक मड़ाई के दौरान पैरों या पशुओं से रौंदने की छवि जगाता है। चुना हुआ अनुवाद विनाश की तीव्रता और कृषि-संबंधी बिंब दोनों को स्पष्ट रखता है।
