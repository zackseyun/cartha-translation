reference: 2 Kings 13:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּחָן֩ יְהוָ֨ה אֹתָ֤/ם וַֽ/יְרַחֲמֵ/ם֙ וַ/יִּ֣פֶן אֲלֵי/הֶ֔ם לְמַ֣עַן בְּרִית֔/וֹ אֶת אַבְרָהָ֖ם יִצְחָ֣ק וְ/יַֽעֲקֹ֑ב וְ/לֹ֤א אָבָה֙ הַשְׁחִיתָ֔/ם וְ/לֹֽא הִשְׁלִיכָ֥/ם מֵֽ/עַל פָּנָ֖י/ו עַד עָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
translation:
  language: hi
  text: परन्तु याहवे ने उन पर अनुग्रह किया और उन पर करुणा की, और अब्राहम, इसहाक और याकूब के साथ अपनी वाचा के कारण[a] उनकी ओर मुड़ा। वह उन्हें नष्ट करने की इच्छा नहीं रखता था, और अब तक उसने उन्हें अपनी उपस्थिति से नहीं निकाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम, इसहाक और याकूब के साथ अपनी वाचा के निमित्त।”
    reason: לְמַעַן may be rendered “because of” or “for the sake of”; this preserves the English POB audit trail’s lexical alternative at the appropriate covenant-motivation anchor.
lexical_decisions:
- source_word: וַיָּחָן
  choice: अनुग्रह किया
  rationale: חנן कृपापूर्ण पक्ष और अनुग्रह व्यक्त करता है; ‘अनुग्रह किया’ स्वाभाविक और धर्मवैचारिक अर्थ के प्रति निष्ठावान है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम के प्रचलित लिप्यंतरण ‘यहोवा’ को रखा गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: וַיְרַחֲמֵם
  choice: उन पर दया की
  rationale: רחם गहरी करुणा और दया का बोध कराता है; आधुनिक हिन्दी में ‘दया की’ संक्षिप्त और स्पष्ट है।
- source_word: וַיִּפֶן אֲלֵיהֶם
  choice: उसने उनकी ओर ध्यान दिया
  rationale: शाब्दिक चित्र ‘उनकी ओर मुड़ने’ का है; प्रसंग में यह अनुकूल ध्यान को दर्शाता है। ‘ध्यान दिया’ अर्थ को सहज हिन्दी में व्यक्त करता है, बिना उसे अतिरिक्त सिद्धान्त से भरने के।
- source_word: לְמַעַן בְּרִיתוֹ
  choice: अपनी उस वाचा के कारण
  rationale: למען यहाँ दैवी कृपा के आधार अथवा कारण को बताता है; ‘के कारण’ इस सम्बन्ध को साफ़ रखता है।
- source_word: אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: जो उसने अब्राहम, इसहाक और याकूब के साथ बाँधी थी
  rationale: इब्रानी वाक्यांश संक्षिप्त है; हिन्दी में ‘वाचा बाँधना’ और ‘के साथ’ सम्बन्ध को स्वाभाविक तथा स्पष्ट बनाते हैं।
- source_word: וְלֹא אָבָה הַשְׁחִיתָם
  choice: वह उन्हें नष्ट करने को तैयार नहीं हुआ
  rationale: אָבָה इच्छा अथवा सहमति का भाव रखता है; ‘तैयार नहीं हुआ’ इस इच्छात्मक पहलू को सुरक्षित रखता है।
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  choice: उसने ... उन्हें अपने सामने से दूर नहीं किया
  rationale: मूल में अपने मुख/उपस्थिति के सामने से फेंक देने का चित्र है; ‘अपने सामने से दूर नहीं किया’ उस चित्र और सम्बन्धपरक अर्थ दोनों को सहज हिन्दी में रखता है।
- source_word: עַד עָתָּה
  choice: आज तक
  rationale: यह कथाकार के वर्तमान समय तक स्थिति जारी रहने का संकेत देता है; ‘आज तक’ स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: वाचा के कारण दैवी दया
  choice: अपनी उस वाचा के कारण, जो उसने अब्राहम, इसहाक और याकूब के साथ बाँधी थी
  alternative: अब्राहम, इसहाक और याकूब के साथ अपनी वाचा के निमित्त
  rationale: पाठ परमेश्वर के अनुग्रह और विनाश न करने को कुलपिताओं के साथ उसकी वाचा से जोड़ता है। चुना हुआ रूप कारण स्पष्ट करता है, पर बाद की किसी धर्मवैचारिक प्रणाली को इसमें नहीं जोड़ता।
- issue: וַיִּפֶן אֲלֵיהֶם में दैवी अभिमुखता
  choice: उसने उनकी ओर ध्यान दिया
  alternative: वह उनकी ओर मुड़ा
  rationale: शाब्दिक अभिमुखता का भाव अनुकूल ध्यान को सूचित करता है। चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक शाब्दिक चित्र भी सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। ‘परन्तु’ कथात्मक विरोध को, ‘वाचा’ बाइबिलीय संकल्पना को, और ‘अपने सामने से’ मूल के उपस्थिति-संबंधी चित्र को बनाए रखता है।
