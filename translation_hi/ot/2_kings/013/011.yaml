source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
translation:
  language: hi
  text: उसने वह किया जो यहोवा की दृष्टि में बुरा था। वह नबात के पुत्र यारोबाम के किसी भी पाप से नहीं फिरा, जिसने इस्राएल को पाप कराया था; वह उसी में चलता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह उसी में चलता रहा।” इब्रानी सर्वनाम एकवचन स्त्रीलिंग है। यह सम्भवतः यारोबाम के पापमय आचरण को सामूहिक रूप से दर्शाता है, यद्यपि निकटवर्ती “पाप” बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: राजाओं की पुस्तक में प्रयुक्त मानक नैतिक-मूल्यांकन सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी के दृष्टि/आँख रूपक और परमेश्वर द्वारा नैतिक मूल्यांकन, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: לֹא סָר מִכָּל חַטֹּאות
  choice: उन पापों में से किसी से भी नहीं फिरा
  rationale: नकार के साथ מִכָּל का आशय है कि उसने किसी भी पाप को नहीं छोड़ा; 'नहीं फिरा' סור के मार्ग-संबंधी रूपक को रखता है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: इब्रानी संरक्षक-नाम का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: सम्बन्धवाचक पद को पापों/पापमय आचरण से जोड़ते हुए हिफ़ील की कारणवाचक शक्ति को व्यक्त करता है।
- source_word: בָּהּ הָלָךְ
  choice: वह उसी पापमय मार्ग पर चलता रहा
  rationale: शाब्दिक एकवचन स्त्रीलिंग प्रत्यय को सामूहिक पापमय मार्ग के रूप में समझते हुए הלך का आचरण-संबंधी रूपक सुरक्षित रखता है; पाठगत एकवचन की सूचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम को सामान्य उपाधि से नहीं बदला गया; आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित रूप 'यहोवा' अपनाया गया।
- issue: בָּהּ के एकवचन और बहुवचन पूर्वपद के बीच तनाव
  choice: उसी पापमय मार्ग पर
  alternative: उसी में / उन पापों में
  rationale: मसोरेटिक पाठ का प्रत्यय व्याकरणतः एकवचन स्त्रीलिंग है, जबकि निकटवर्ती 'पापों' बहुवचन है। मुख्य पाठ सामूहिक पापमय आचरण का अर्थ देता है और पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'दृष्टि में' तथा 'चलता रहा' जैसे बाइबलीय रूपक स्वाभाविक हिन्दी में सुरक्षित हैं।
