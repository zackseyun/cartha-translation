  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
translation:
  language: hi
  text: तब यहोआहाज ने याहवे से कृपा की याचना की[a], और याहवे ने उसकी बात सुनी, क्योंकि उसने इस्राएल पर हो रहा अत्याचार देखा—अराम[b] का राजा उन पर अत्याचार कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे से विनती की।” इब्रानी मुहावरे का अर्थ किसी की कृपा या अनुग्रह पाने के लिए उससे विनती करना है।
    reason: lexical_alternative
  - marker: b
    text: अराम इब्रानी नाम है; कुछ पुराने अनुवादों में इसे “सीरिया” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת־פְּנֵי יְהוָה
  choice: याहवे से कृपा की याचना की
  rationale: यह इब्रानी मुहावरा किसी का अनुग्रह पाने के लिए उससे विनती करने का भाव देता है। हिंदी में शाब्दिक ‘मुख को कोमल किया’ अस्पष्ट होता; ‘कृपा की याचना की’ विनती और अनुग्रह—दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुराक्षरीय ईश्वरीय नाम का हिंदी लिप्यंतरण किया गया है, इसे किसी उपाधि से नहीं बदला गया।
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: उसकी सुनी
  rationale: यहाँ שׁמע के साथ אֶל केवल ध्वनि सुनने नहीं, किसी की प्रार्थना पर ध्यान देने का अर्थ देता है। ‘उसकी सुनी’ स्वाभाविक हिंदी है और उत्तर के स्वरूप के बारे में मूल से अधिक नहीं कहता।
- source_word: לַחַץ / לָחַץ
  choice: अत्याचार / अत्याचार कर रहा था
  rationale: संज्ञा और उसी मूल की क्रिया विदेशी राजा द्वारा किए जा रहे दमन को व्यक्त करती हैं। समान हिंदी शब्द-परिवार से मूल की पुनरावृत्ति भी दिखाई देती है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: मूल भौगोलिक नाम אֲרָם का लिप्यंतरण रखा गया है; इसे बाद के नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी रूप है और नाम को उपाधि में नहीं बदलता।
- issue: וַיְחַל אֶת־פְּנֵי יְהוָה में परमेश्वर से अपील
  choice: याहवे से कृपा की याचना की
  alternative: याहवे से विनती की; याहवे का मुख कोमल किया
  rationale: चुना हुआ रूप इब्रानी मुहावरे का आशय स्पष्ट करता है, पर यह दावा नहीं करता कि राजा ने किसी विशेष प्रायश्चित्त-विधि से परमेश्वर को प्रसन्न किया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसकी सुनी’ प्रार्थना पर ध्यान देने का स्वाभाविक हिंदी मुहावरा है। अंतिम कारणवाचक उपवाक्य को दीर्घ विराम से जोड़ा गया है, जिससे मूल के दोहरे כִּי का संबंध स्पष्ट रहे और अनावश्यक पुनरुक्ति न लगे।
