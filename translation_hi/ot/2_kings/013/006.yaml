  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
translation:
  language: hi
  text: फिर भी वे यारोबाम के घराने के उन पापों से न फिरे, जिनके द्वारा उसने इस्राएल से पाप करवाया था; वह उसी रीति पर चलता रहा, और यहाँ तक कि अशेरा[a] भी शोमरोन में खड़ी रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरा-खंभा”; इब्रानी शब्द कनानी देवी अशेरा या उसकी उपासना से जुड़ी पूजा-वस्तु के लिए प्रयुक्त हो सकता है। यहाँ संभवतः पूजा-वस्तु अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पिछले पद में बताए गए छुटकारे और इस पद में जारी पाप के बीच विरोध सूचित करता है।
- source_word: סָרוּ מֵחַטֹּאות
  choice: पापों से न फिरे
  rationale: מִן के साथ סור किसी बात को छोड़ने या उससे फिरने का अर्थ देता है; बहुवचन ‘पापों’ भी सुरक्षित रखा गया है।
- source_word: בֵּית יָרָבְעָם
  choice: यारोबाम का घराना
  rationale: ‘घराना’ वंश और उससे जुड़ी स्थापित धार्मिक-राजनीतिक विरासत—दोनों का स्वाभाविक हिन्दी संकेत देता है।
- source_word: אֲשֶׁר החטי אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: חטא का हिफ़ील रूप ‘पाप करवाना’ है; ‘जिनके द्वारा’ साधनात्मक संबंध को बनाए रखता है।
- source_word: בָּהּ הָלָךְ
  choice: वह उन्हीं पर चलता रहा
  rationale: הלך ב आचरण या जीवन-पद्धति का अनुसरण करने को व्यक्त करता है। स्त्रीलिंग एकवचन प्रत्यय सामूहिक पापमय रीति की ओर संकेत कर सकता है; हिन्दी में ‘उन्हीं’ निकटवर्ती बहुवचन पापों से स्वाभाविक संबंध रखता है।
- source_word: וְגַם
  choice: यहाँ तक कि ... भी
  rationale: अंतिम कथन के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאֲשֵׁרָה
  choice: अशेरा
  rationale: मूल शब्द देवी अथवा उसकी उपासना से जुड़ी खड़ी पूजा-वस्तु को सूचित कर सकता है; लिप्यंतरण अनावश्यक रूप से अर्थ को सीमित नहीं करता।
- source_word: עָמְדָה בְּשֹׁמְרוֹן
  choice: शोमरोन में खड़ी रही
  rationale: ‘खड़ी रही’ क्रिया की मूर्त छवि और उसके बने रहने की अवधि दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: הָאֲשֵׁרָה का अभिप्राय
  choice: मुख्य पाठ में ‘अशेरा’, और टिप्पणी में संभावित पूजा-वस्तु का स्पष्टीकरण
  alternative: ‘अशेरा-खंभा’ अथवा देवी अशेरा
  rationale: ‘शोमरोन में खड़ी रही’ से पूजा-वस्तु का अर्थ अधिक संभावित है, पर मूल संज्ञा स्वयं देवी और उससे संबद्ध पूजा-चिह्न दोनों के लिए प्रयुक्त हो सकती है; इसलिए मुख्य पाठ वास्तविक अस्पष्टता बनाए रखता है।
- issue: בָּהּ का वचन और संदर्भ
  choice: ‘वह उन्हीं पर चलता रहा’
  alternative: ‘वह उसी रीति पर चलता रहा’
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन है और सामूहिक पापमय पद्धति की ओर संकेत कर सकता है, जबकि हिन्दी वाक्य में निकटवर्ती ‘पापों’ के साथ बहुवचन अधिक स्वाभाविक है। अर्थ को किसी एक व्याकरणिक विश्लेषण तक सीमित नहीं किया गया।
