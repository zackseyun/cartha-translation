  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पापों से न फिरे’ और ‘चलता रहा’ बाइबलीय नैतिक भाव बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट हैं।
