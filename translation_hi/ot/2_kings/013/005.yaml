base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
translation:
  language: hi
  text: याहवे ने इस्राएल को एक छुड़ाने वाला[a] दिया, और वे अराम के हाथ के नीचे से निकल गए[b]। फिर इस्राएल के पुत्र अपने तंबुओं में पहले की तरह[c] रहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक उद्धारकर्ता।’ इब्रानी शब्द ऐसे व्यक्ति को दर्शाता है जो बचाव या छुटकारा दिलाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अराम के हाथ के नीचे से’ अराम की सत्ता या अधीनता से छूटने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या ‘पहले के समय की तरह।’ शाब्दिक रूप से, ‘कल, परसों’; यह बीते दिनों या पूर्वकाल के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
