- source_word: מוֹשִׁיעַ
  choice: एक छुड़ानेवाला
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो बचाव या छुटकारा दिलाता है। ऐतिहासिक और राजनीतिक संदर्भ में ‘छुड़ानेवाला’ स्वाभाविक है और अनावश्यक रूप से बाद की मसीही पहचान आरोपित नहीं करता।
- source_word: מִתַּחַת יַד אֲרָם
  choice: अराम के हाथ के नीचे से
  rationale: मूल इब्रानी की ठोस उपमा को मुख्य पाठ में रखा गया है; यहाँ ‘हाथ’ सत्ता या अधीनता का बोध कराता है।
- source_word: אֲרָם
  choice: अराम
  rationale: बाद के भौगोलिक नाम ‘सीरिया’ के बजाय बाइबलीय राज्य का ऐतिहासिक नाम रखा गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल की पारिवारिक और वाचागत अभिव्यक्ति को बनाए रखा गया है।
- source_word: בְּאָהֳלֵיהֶם
  choice: अपने तंबुओं में
  rationale: मूल पाठ के ठोस शब्द ‘तंबू’ को रखा गया है; यह आधुनिक हिंदी में भी स्पष्ट है।
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: पहले की तरह
  rationale: शाब्दिक अभिव्यक्ति बीते दिनों की ओर संकेत करने वाला इब्रानी मुहावरा है; हिंदी में उसका स्वाभाविक अर्थ दिया गया है।
- source_word: וַיֵּצְאוּ
  choice: वे ... निकल गए
  rationale: क्रिया के मूल अर्थ को रखा गया है; साथ का मुहावरा अरामी अधीनता से छूटने का आशय स्पष्ट करता है।
- source_word: וַיֵּשְׁבוּ
  choice: रहने लगे
  rationale: ישׁב के निवास करने वाले अर्थ को प्रसंगानुकूल आधुनिक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: מוֹשִׁיעַ का अनुवाद ‘छुड़ानेवाला’ किया जाए या ‘उद्धारकर्ता’
  choice: छुड़ानेवाला
  alternative: उद्धारकर्ता
  rationale: यहाँ तत्काल संदर्भ अराम की सत्ता से ऐतिहासिक छुटकारे का है। ‘छुड़ानेवाला’ बचाने वाले अभिकर्ता का अर्थ बनाए रखता है, पर पाठ में न कही गई किसी विशिष्ट मसीही पहचान को आरोपित नहीं करता।
