  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: यह मूल इब्रानी की स्पष्ट रूप से पारिवारिक, पुल्लिंग अभिव्यक्ति है; इसलिए इसे सामान्य सामूहिक संज्ञा में समतल नहीं किया गया।
