  to: यहोवा का क्रोध इस्राएल के विरुद्ध भड़क उठा, और उसने उन्हें अराम[c] के राजा हज़ाएल के हाथ में और हज़ाएल के पुत्र बेन-हदद के हाथ में दे दिया,[b] उन सब दिनों तक।[a]
