  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּתְּנֵ֞/ם בְּ/יַ֣ד חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֗ם וּ/בְ/יַ֛ד בֶּן הֲדַ֥ד בֶּן חֲזָאֵ֖ל כָּל הַ/יָּמִֽים־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
translation:
  language: hi
  text: यहोवा का क्रोध इस्राएल के विरुद्ध भड़क उठा, और उसने उन्हें अराम[c] के राजा हज़ाएल के हाथ में और हज़ाएल के पुत्र बेन-हदद के हाथ में दे दिया,[b] उन सब दिनों तक।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारे दिन”; अर्थात उस पूरी अवधि के दौरान।
    reason: lexical_alternative
  - marker: b
    text: “हाथ में” अधिकार या नियंत्रण में होने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: “अराम” इब्रानी नाम है, जिसका पुराने अनुवादों में अक्सर “सीरिया” अनुवाद किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह इब्रानी मुहावरे की जलने/भड़कने वाली सजीव छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित सीधे लिप्यंतरण द्वारा प्रस्तुत किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: क्रोध के क्रियापद के साथ בְּ यहाँ उस पक्ष को सूचित करता है जिसकी ओर क्रोध निर्देशित है।
- source_word: וַיִּתְּנֵם
  choice: उसने उन्हें ... हाथ में कर दिया
  rationale: सैन्य दंड के प्रसंग में נתן और בְּיַד के संयुक्त भाव को हिन्दी के स्वाभाविक मुहावरे में व्यक्त करता है, साथ ही 'हाथ' की मूल छवि बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह अधिकार या नियंत्रण में सौंपे जाने का इब्रानी मुहावरा है; हिन्दी में भी यह छवि सहज समझी जाती है।
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: अराम का राजा हज़ाएल
  rationale: स्थान-नाम אֲרָם को सीधे 'अराम' और व्यक्ति के नाम को मानक हिन्दी रूप 'हज़ाएल' में रखा गया है।
- source_word: בֶּן־הֲדַד בֶּן־חֲזָאֵל
  choice: हज़ाएल का पुत्र बेन-हदद
  rationale: नाम और वंश-संबंध दोनों को मूल के अनुसार स्पष्ट रखा गया है।
- source_word: כָּל הַיָּמִים
  choice: उस पूरे समय भर
  rationale: शाब्दिक 'सारे दिन' की अवधि-सूचक शक्ति को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है, बिना अवधि को अधिक निश्चित किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले 'यहोवा' को चुना गया; 'याहवे' मूल उच्चारण के पुनर्निर्माण के अधिक निकट एक संभव विकल्प है।
- issue: इस्राएल को शत्रुओं के हाथ में देने में कर्ता
  choice: उसने उन्हें ... कर दिया
  alternative: वे ... के अधिकार में कर दिए गए
  rationale: मूल का स्पष्ट कर्ता यहोवा है; कर्मवाच्य करके ईश्वरीय दंड की प्रत्यक्ष अभिव्यक्ति को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। वाक्य मूल इब्रानी की क्रमिक संरचना तथा 'क्रोध भड़क उठा' और 'हाथ में' जैसी प्रमुख छवियों को बनाए रखता है। पद में अराम नाम सीधे रखा गया है; इसे पुराने अनुवादों के 'सीरिया' से नहीं बदला गया।
