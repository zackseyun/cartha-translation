  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
translation:
  language: hi
  text: तब अराम का राजा हजाएल मर गया, और उसका पुत्र बेन-हदद उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: तब ... मर गया
  rationale: מות के काल-वाचक कथात्मक रूप को स्वाभाविक हिन्दी में घटना-क्रम दिखाने वाले “तब” के साथ व्यक्त किया गया है।
- source_word: חֲזָאֵל
  choice: हजाएल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी देवनागरी में निकट लिप्यंतरण।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: אֲרָם ऐतिहासिक राज्य का नाम है; “अराम” मूल नाम को बनाए रखता है और इसे व्याख्यात्मक “सीरिया” से नहीं बदलता।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: उत्तराधिकार के इस प्रसंग में מלך का अर्थ शासन की अवधि बताने से अधिक राजपद ग्रहण करना है; “राजा बना” इसे सहज हिन्दी में स्पष्ट करता है।
- source_word: בֶּן הֲדַד
  choice: बेन-हदद
  rationale: व्यक्तिगत अथवा राजवंशीय नाम का प्रचलित, स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: सर्वनामसूचक प्रत्यय हजाएल की ओर संकेत करता है और पुत्र-संबंध को स्पष्ट रूप से बनाए रखा गया है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के सूत्र में इसका अर्थ पूर्ववर्ती के स्थान पर पद ग्रहण करना है।
