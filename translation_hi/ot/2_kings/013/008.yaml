  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजकीय अभिलेख-सूत्र को आलंकारिक प्रश्न के रूप में बनाए रखा गया है। पाद-टिप्पणी चिह्न उन शब्दों के ठीक बाद लगाए गए हैं जिनसे उनके विकल्प संबंधित हैं।
