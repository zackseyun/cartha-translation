  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: The rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: यहोआहाज के बाकी काम, उसने जो कुछ किया, और उसका पराक्रम[b]—क्या ये सब ‘इस्राएल के राजाओं के इतिहास की पुस्तक’[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के राजाओं के वृत्तांत की पुस्तक।’
    reason: lexical_alternative
  - marker: b
    text: ‘पराक्रम’ का अनुवाद ‘सामर्थ्य,’ ‘वीरता,’ या ‘पराक्रमी कार्य’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי केवल बोले गए ‘वचन’ नहीं, बल्कि राजा के कार्यों और उससे संबंधित वृत्तांत को सूचित करता है। ‘बाकी काम’ सहज आधुनिक हिन्दी में इसी व्यापक भाव को व्यक्त करता है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: उसने जो कुछ किया
  rationale: मूल के व्यापक संबंधवाचक उपवाक्य को बिना अर्थ सीमित किए स्वाभाविक हिन्दी में रखा गया है।
- source_word: וּגְבוּרָתוֹ
  choice: और उसका पराक्रम
  rationale: גְּבוּרָה सामर्थ्य, वीरता अथवा पराक्रमी कार्यों को सूचित कर सकता है। ‘पराक्रम’ संक्षिप्त है और मूल की अर्थगत व्यापकता को काफी हद तक बनाए रखता है; विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... नहीं लिखे हैं?
  rationale: मूल के प्रचलित आलंकारिक प्रश्न और बहुवचन संदर्भ को स्वाभाविक हिन्दी में सुरक्षित रखा गया है। ‘ये सब’ पहले गिनाई गई सभी बातों को स्पष्ट रूप से समेटता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से पूर्वसर्ग ‘पर’ हो सकता है, लेकिन लिखित अभिलेख के संदर्भ में हिन्दी का स्वाभाविक प्रयोग ‘पुस्तक में’ है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास
  rationale: यह राजकीय अभिलेख के शीर्षक का सूत्र है। ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘वृत्तांत’ का अधिक अभिलेखीय विकल्प पाद-टिप्पणी में रखा गया है।
