lexical_decisions:
- source_word: וַחֲזָאֵל
  choice: हजाएल
  rationale: वाव कथा को आगे बढ़ाता है; हिन्दी में अलग से ‘और’ या ‘तब’ जोड़ना आवश्यक नहीं। व्यक्ति के नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: मूल इब्रानी स्थान-नाम אֲרָם को ‘अराम’ रखा गया है; ‘सीरिया’ बाद की पारंपरिक भौगोलिक संज्ञा है।
- source_word: לָחַץ
  choice: दबाता रहा
  rationale: क्रिया लगातार राजनीतिक और सैनिक उत्पीड़न का भाव देती है। ‘दबाता रहा’ इस निरंतर दबाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: प्रत्यक्ष कर्म के रूप में राष्ट्रीय नाम का सीधा अनुवाद; प्रसंग में उत्तरी राज्य अभिप्रेत है।
- source_word: כֹּל יְמֵי
  choice: जीवन भर
  rationale: इब्रानी मुहावरा किसी व्यक्ति के सभी दिनों की पूरी अवधि बताता है। यहाँ यह यहोआहाज के जीवन अथवा प्रसंगतः उसके शासन की अवधि को सूचित करता है; हिन्दी में ‘जीवन भर’ स्वाभाविक है।
- source_word: יְהוֹאָחָז
  choice: यहोआहाज
  rationale: व्यक्ति के नाम का प्रचलित हिन्दी लिप्यंतरण।
