source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ֠/יֵּלֶךְ אַחַ֨ר חַטֹּ֜את יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל לֹא סָ֥ר מִמֶּֽ/נָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
translation:
  language: hi
  text: उसने वह किया जो याहवे की दृष्टि में बुरा था। वह नबात के पुत्र यारोबाम के पापों के पीछे चला, जिसने इस्राएल से पाप करवाया था; वह उनसे[a] नहीं हटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “वह उससे नहीं हटा।” इब्रानी में सर्वनाम स्त्रीलिंग एकवचन है और सम्भवतः यारोबाम की पूरी पापमय पद्धति को सामूहिक रूप से दर्शाता है।'
    reason: मूल इब्रानी के स्त्रीलिंग एकवचन रूप और प्रसंगानुसार बहुवचन अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: उसने वही किया जो याहवे की दृष्टि में बुरा था
  rationale: राजाओं की पुस्तक के प्रचलित मूल्यांकन-सूत्र को स्वाभाविक आधुनिक हिन्दी में रखते हुए ‘की दृष्टि में’ से בְּעֵינֵי का रूपक सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וַיֵּלֶךְ אַחַר
  choice: के पीछे चलता रहा
  rationale: इब्रानी के ‘पीछे चलने’ वाले रूपक को बनाए रखता है और यहाँ किसी पापमय आदर्श का लगातार अनुसरण करने का भाव व्यक्त करता है।
- source_word: חַטֹּאת יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम के पापों
  rationale: बहुवचन חַטֹּאת को ‘पापों’ और इब्रानी पितृनाम-सूत्र को ‘नबात के पुत्र’ के रूप में सीधे व्यक्त किया गया है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को ‘पाप करवाया’ से स्पष्ट रखा गया है; सम्बन्धवाचक सर्वनाम यारोबाम की ओर संकेत करता है।
- source_word: לֹא סָר מִמֶּנָּה
  choice: वह उनसे नहीं हटा
  rationale: סור का ‘हटना/अलग होना’ अर्थ रखा गया है। प्रसंगानुसार बहुवचन ‘उनसे’ यारोबाम के पापों को स्पष्टतः संदर्भित करता है, जबकि इब्रानी प्रत्यय स्त्रीलिंग एकवचन है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: מִמֶּנָּה के स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उनसे’, अर्थात यारोबाम के पापों से
  alternative: ‘उससे’, अर्थात सामूहिक पाप-पद्धति से
  rationale: इब्रानी की व्याकरणिक एकवचनता सम्भवतः पूरे पापमय ढाँचे को सामूहिक रूप से देखती है। हिन्दी में ‘उनसे’ निकटवर्ती बहुवचन ‘पापों’ से स्वाभाविक सम्बन्ध बनाता है; मूल की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘के पीछे चलता रहा’ मूल रूपक तथा निरन्तर आचरण दोनों को व्यक्त करता है; ‘पाप करवाया’ कारणवाचक क्रिया को स्पष्ट करता है।
