source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
translation:
  language: hi
  text: तब आहाज़ ने अश्शूर के राजा तिग्लत-पिलेसेर के पास दूत भेजकर कहा, “मैं आपका सेवक और आपका पुत्र हूँ। चढ़ आइए और अराम के राजा के हाथ[a] से और इस्राएल के राजा के हाथ से मुझे बचाइए; वे मेरे विरुद्ध उठ खड़े हो रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ से’ का अर्थ यहाँ ‘अधिकार या सामर्थ्य से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: कथात्मक क्रिया का स्वाभाविक हिन्दी रूप; वाक्य में ‘दूत भेजकर’ के रूप में प्रयुक्त।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनीतिक प्रसंग में मानव संदेशवाहक अथवा राजदूत अभिप्रेत हैं।
- source_word: תִּגְלַת פְּלֶסֶר
  choice: तिग्लत-पिलेसेर
  rationale: अश्शूरी राजकीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַבְדְּךָ וּבִנְךָ
  choice: आपका सेवक और आपका पुत्र
  rationale: अधीनता व्यक्त करने वाली कूटनीतिक भाषा को उसके सेवक और पुत्र—दोनों रूपकों सहित सुरक्षित रखा गया है।
- source_word: עֲלֵה
  choice: चढ़ आइए
  rationale: עלה की स्थानगत छवि और वक्ता की ओर आने का भाव सुरक्षित रहता है; प्रसंग से सैन्य सहायता स्पष्ट है।
- source_word: וְהוֹשִׁיעֵנִי
  choice: मुझे बचाइए
  rationale: सैन्य-राजनीतिक छुटकारे के तत्काल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכַּף
  choice: के हाथ से
  rationale: सामर्थ्य अथवा नियंत्रण के लिए प्रयुक्त इब्रानी मूर्त मुहावरे को बनाए रखता है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल ऐतिहासिक नाम को प्राथमिकता दी गई है; आधुनिक ‘सीरिया’ से संभावित कालभ्रम टलता है।
- source_word: הַקּוֹמִים עָלָי
  choice: वे मेरे विरुद्ध उठ खड़े हुए हैं
  rationale: कृदंत के जारी शत्रुतापूर्ण भाव और ‘उठने’ की मूल छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आहाज़ की कूटनीतिक आत्म-अधीनता
  choice: ‘आपका सेवक और आपका पुत्र’ का शाब्दिक रूप रखा गया
  alternative: ‘आपका जागीरदार/अधीनस्थ’
  rationale: राजनीतिक आशय स्पष्ट है, पर मूल पाठ सेवकत्व और पुत्रत्व की भाषा बोलता है; तकनीकी राजनीतिक शब्द डालने के बजाय वही तनाव सुरक्षित रखा गया।
- issue: וְהוֹשִׁיעֵנִי का सैन्य-राजनीतिक अर्थ
  choice: ‘मुझे बचाइए’
  alternative: ‘मुझे छुड़ाइए’
  rationale: मूल क्रिया की व्यापक बाइबलीय अर्थ-सीमा सुरक्षित है, जबकि प्रसंग स्पष्ट करता है कि यहाँ विदेशी सैन्य सहायता माँगी जा रही है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक संबोधन रखा गया है, क्योंकि आहाज़ एक शक्तिशाली विदेशी राजा से सहायता माँगते हुए स्वयं को उसके अधीन बता रहा है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है।
