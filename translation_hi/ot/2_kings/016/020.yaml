  text: וַ/יִּשְׁכַּ֤ב אָחָז֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ חִזְקִיָּ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
translation:
  language: hi
  text: और आहाज़ अपने पूर्वजों के साथ सो गया[a] और उसे उसके पूर्वजों के साथ दाऊद के नगर में दफ़नाया गया। और उसका पुत्र हिजकिय्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने पूर्वजों के साथ सो गया” राजाओं की मृत्यु की सूचना देने वाला एक पारंपरिक इब्रानी मुहावरा है; इसका अर्थ है कि आहाज़ मर गया और अपने पूर्वजों में जा मिला।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  choice: अपने पूर्वजों के साथ सो गया
  rationale: यह राजाओं की मृत्यु-सूचना का पारंपरिक इब्रानी मुहावरा है। इसे बनाए रखने से मूल की सूत्रात्मक शैली सुरक्षित रहती है; पादटिप्पणी इसका अर्थ स्पष्ट करती है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: निफ़अल रूप का स्वाभाविक हिन्दी निष्क्रिय अनुवाद है।
- source_word: עִם אֲבֹתָיו
  choice: उसके पूर्वजों के साथ
  rationale: आधुनिक हिन्दी में 'पूर्वजों' वंशगत अर्थ को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है; 'पितरों' की अपेक्षा यह अधिक सर्वसुलभ है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह पारंपरिक स्थान-नाम की स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूचना में क्रिया राजपद ग्रहण करने को सूचित करती है; 'राजा हुआ' आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप चुना गया है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: मूल में दिए पुत्र-संबंध को स्पष्ट रूप से बनाए रखा गया है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के संदर्भ में प्रतिस्थापन और पद ग्रहण करने का अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: मृत्यु के सूत्रात्मक मुहावरे का अर्थ
  choice: मुख्य पाठ में 'अपने पूर्वजों के साथ सो गया' बनाए रखा
  alternative: '''मर गया'''
  rationale: मूल इब्रानी की राजकीय सूत्र-भाषा और उसकी संभावित साहित्यिक प्रतिध्वनि को सुरक्षित रखा गया है, बिना इस मुहावरे से किसी विशिष्ट परलोक-सिद्धांत का निष्कर्ष निकाले।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल की राजकीय मृत्यु और उत्तराधिकार-सूचना की संक्षिप्त, सूत्रात्मक शैली को बनाए रखा गया है।
