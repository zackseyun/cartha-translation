base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/014.yaml
  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
translation:
  language: hi
  text: और जो काँसे की वेदी यहवे के सामने थी, उसे उसने भवन के सामने से—वेदी और यहवे के भवन के बीच से—हटाकर वेदी की उत्तरी ओर रख दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘काँसे’ का अनुवाद ‘ताँबे’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  choice: काँसे की वेदी
  rationale: נְחֹשֶׁת ताँबे या काँसे को सूचित कर सकता है; मंदिर के उपकरणों के संदर्भ में पारंपरिक और संभावित अर्थ ‘काँसा’ है।
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: जो यहवे के सामने थी
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘सामने’ है; यह अनुष्ठानिक उपस्थिति का भाव भी बनाए रखता है। परमेश्वर का नाम יְהוָה ‘यहवे’ के रूप में दिया गया है।
- source_word: וַיַּקְרֵב מֵאֵת פְּנֵי הַבַּיִת
  choice: उसने भवन के सामने से … हटाकर
  rationale: क्रिया का मूल भाव निकट लाना है, पर पूरे वाक्य में वेदी को उसके पुराने स्थान से दूसरी जगह रखने की क्रिया है; हिंदी में ‘हटाकर’ संदर्भगत गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִבֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  choice: नई वेदी और यहवे के भवन के बीच से
  rationale: इब्रानी में केवल ‘वेदी’ है, किंतु पिछले पद में वर्णित नई वेदी से भेद स्पष्ट करने के लिए ‘नई’ संदर्भगत पूर्ति है; ‘यहवे का भवन’ मूल शब्दावली को बनाए रखता है।
- source_word: וַיִּתֵּן אֹתוֹ
  choice: रख दिया
  rationale: נתן का इस भौतिक संदर्भ में अर्थ रखना या स्थापित करना है; ‘रख दिया’ सहज आधुनिक हिंदी है।
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  choice: नई वेदी की उत्तर दिशा में
  rationale: יֶרֶךְ का अर्थ पार्श्व/बगल और צָפוֹנָה का अर्थ उत्तर की ओर है। यह अभिव्यक्ति स्थान को स्पष्ट करती है, जबकि सटीक संबंध की संभावित अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निज नाम सीधे प्रयुक्त है; ‘यहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘भवन’ से मंदिर-भवन अभिप्रेत है। ‘नई’ शब्द पिछले पद के संदर्भ से स्पष्ट की गई पूर्ति है, मूल इब्रानी में इस पद पर यह विशेषण नहीं है।
