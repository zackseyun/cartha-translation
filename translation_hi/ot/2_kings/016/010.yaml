  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: hi
  text: तब राजा आहाज़ दमिश्क में अश्शूर के राजा तिग्लत-पिलेसेर से मिलने गया, और उसने वह वेदी देखी जो दमिश्क में थी। राजा आहाज़ ने याजक ऊरिय्याह को उस वेदी का प्रतिरूप और उसकी रूपरेखा, उसकी सारी कारीगरी के अनुसार, भेजी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּמוּת (demut)
  choice: प्रतिरूप
  rationale: यह वेदी की समान आकृति या नमूने को व्यक्त करता है और תַּבְנִית से भेद बनाए रखता है।
- source_word: תַּבְנִית (tavnit)
  choice: नक्शा
  rationale: निर्माण के लिए रूपरेखा या विन्यास का स्वाभाविक आधुनिक हिन्दी रूप; संदर्भ में भेजी गई विस्तृत योजना का अर्थ देता है।
- source_word: לְכָל־מַעֲשֵׂהוּ (lekol-ma'asehu)
  choice: उसकी पूरी कारीगरी के अनुसार
  rationale: वेदी के निर्माण और उसके समस्त कार्य-विवरण का स्रोतगत भाव सुरक्षित रखता है।
- source_word: לִקְרַאת (liqrat)
  choice: से मिलने
  rationale: राजा के पास जाकर उससे भेंट करने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
