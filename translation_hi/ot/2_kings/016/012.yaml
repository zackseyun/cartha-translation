  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
translation:
  language: hi
  text: जब राजा दमिश्क से आया, तब राजा ने वेदी को देखा; फिर राजा वेदी के पास गया और उस पर चढ़ गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेदी के पास गया और उस पर बलिदान चढ़ाया।” कुछ लोग “उस पर चढ़ गया” को बलिदान की क्रिया आरम्भ करने का संक्षिप्त संकेत मानते हैं, यद्यपि इब्रानी शब्द अधिक शाब्दिक रूप से वेदी पर चढ़ने का वर्णन करते हैं।
    reason: वैकल्पिक अर्थ की सम्भावना को सुरक्षित रखना
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य कथात्मक अर्थ ‘आना’ है। यह राजा के दमिश्क से आने को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: इब्रानी में निश्चित संज्ञा तीन बार दोहराई गई है। राजा आहाज की व्यक्तिगत क्रिया पर स्रोत-पाठ के जोर को बनाए रखने के लिए हिन्दी में भी तीनों बार ‘राजा’ रखा गया है।
- source_word: מִדַּמֶּשֶׂק
  choice: दमिश्क से
  rationale: מִן स्रोत अथवा प्रस्थान-बिंदु बताता है; इसलिए ‘से’ उपयुक्त है। דַּמֶּשֶׂק का प्रचलित हिन्दी रूप ‘दमिश्क’ है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה यहाँ सामान्य दृश्य-बोध को व्यक्त करता है; ‘देखा’ इसका सीधा और स्वाभाविक हिन्दी अर्थ है।
- source_word: אֶת הַמִּזְבֵּחַ
  choice: वेदी को
  rationale: מִזְבֵּחַ के लिए ‘वेदी’ मानक, स्पष्ट और संदर्भानुकूल हिन्दी शब्द है; ‘को’ निश्चित प्रत्यक्ष कर्म को चिह्नित करता है।
- source_word: וַיִּקְרַב עַל־הַמִּזְבֵּחַ
  choice: वेदी के पास गया
  rationale: קרב का अर्थ पास आना या निकट जाना है। इस क्रिया के साथ עַל को लक्ष्य की ओर बढ़ने के अर्थ में लेकर ‘के पास गया’ सहज हिन्दी देता है।
- source_word: וַיַּעַל עָלָיו
  choice: उस पर चढ़ गया
  rationale: עלה का मूल अर्थ ऊपर जाना अथवा चढ़ना है और עָלָיו का अर्थ ‘उस पर’ है। यह अनुवाद बलिदान चढ़ाने की क्रिया को इस पद में अनकहे रूप से जोड़ने के बजाय इब्रानी की अधिक शाब्दिक स्थानगत भाषा बनाए रखता है।
theological_decisions:
- issue: क्या וַיַּעַל עָלָיו शारीरिक रूप से वेदी पर चढ़ने को बताता है या उस पर बलिदान चढ़ाने को
  choice: उस पर चढ़ गया
  alternative: उस पर बलिदान चढ़ाया
  rationale: עלה के साथ עַל और सर्वनाम-प्रत्यय का सीधा अर्थ वेदी पर ऊपर चढ़ना है। बलिदान की क्रिया अगले पद में स्पष्ट होती है; इसलिए उसे यहाँ मुख्य पाठ में जोड़ना अर्थ का समयपूर्व विस्तार होगा। फिर भी संभावित बलिदान-संबंधी समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी में ‘राजा’ की तीन बार पुनरावृत्ति को जानबूझकर बनाए रखा गया है। ‘तब’ और ‘फिर’ कथात्मक क्रम को हिन्दी में स्पष्ट करते हैं। पादटिप्पणी-चिह्न उसी विवादित अंतिम वाक्यांश के बाद रखा गया है जिससे वह सम्बद्ध है।
