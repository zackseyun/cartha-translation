base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
translation:
  language: hi
  text: तब राजा आहाज़ ने चौकियों के चौखटे काट डाले और उन पर से धोने का पात्र[a] हटा दिया। उसने “सागर”[b] को उसके नीचे के काँसे के बैलों[c] पर से उतारकर पत्थर के फ़र्श पर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हौद।” इब्रानी כִּיּוֹר मंदिर की सेवा में धोने के लिए इस्तेमाल होने वाला पात्र था।
    reason: lexical_alternative
  - marker: b
    text: “सागर” सुलैमान के मंदिर के लिए बनाए गए विशाल पात्र का नाम है (देखें 1 राजा 7:23–26)।
    reason: cross_reference
  - marker: c
    text: या “काँसे के गोवंश।” इब्रानी शब्द सामान्य रूप से मवेशियों को सूचित कर सकता है; इस मंदिर-संदर्भ में “बैल” प्रचलित अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  choice: काट डाले
  rationale: क्रिया קצץ का अर्थ काट देना या काटकर अलग करना है; यहाँ मंदिर के सामान को खोलने का भाव है।
- source_word: הַמִּסְגְּרוֹת
  choice: चौखटे
  rationale: מִסְגְּרוֹת चौकियों के ढाँचागत अथवा किनारीदार चौखटों को सूचित करता है; 'चौखटे' तटस्थ और दृश्य रूप से स्पष्ट है।
- source_word: הַמְּכֹנוֹת
  choice: चौकियों
  rationale: मंदिर के संदर्भ में מְכֹנוֹת हौदों को थामने वाली चल चौकियाँ या आधार थे; सामान्य हिंदी में 'चौकियाँ' स्वाभाविक है।
- source_word: הַכִּיּוֹר
  choice: हौद
  rationale: כִּיּוֹר मंदिर की सेवा में धोने के लिए प्रयुक्त पात्र है; 'हौद' आधुनिक हिंदी में समझने योग्य है और वस्तु का आकार व कार्य व्यक्त करता है।
- source_word: הַיָּם
  choice: ‘सागर’
  rationale: यह सुलैमान के मंदिर के विशाल पात्र का विशिष्ट नाम है; उद्धरण-चिह्न इसे सामान्य समुद्र के बजाय नामित वस्तु दिखाते हैं।
- source_word: הוֹרִיד
  choice: उतारकर
  rationale: हिफ़ील रूप किसी वस्तु को उसके सहारे से नीचे उतारने का भाव देता है।
- source_word: הַבָּקָר הַנְּחֹשֶׁת
  choice: काँसे के बैलों
  rationale: בָּקָר व्यापक रूप से गोवंश को दर्शा सकता है; मंदिर की इन सहायक आकृतियों के लिए 'बैल' परंपरागत और संदर्भानुकूल है। נְחֹשֶׁת के लिए मंदिर-सामग्री के संदर्भ में 'काँसा' स्वाभाविक है।
- source_word: עַל מַרְצֶפֶת אֲבָנִים
  choice: पत्थर के फ़र्श पर
  rationale: מַרְצֶפֶת पत्थरों से बनी पक्की सतह को दर्शाता है; 'फ़र्श' ऊँचा चबूतरा होने का अनावश्यक संकेत नहीं देता।
