base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
translation:
  language: hi
  text: उसने ऊँचे उपासना-स्थलों पर, पहाड़ियों पर और हर हरे-भरे पेड़ के नीचे बलिदान चढ़ाए और धूप जलाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर पत्तों से भरे पेड़ के नीचे” अथवा “हर घने पेड़ के नीचे।” इब्रानी विशेषण का अर्थ हरा, ताज़ा या घना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  choice: बलि चढ़ाता था
  rationale: זבח का अर्थ बलि अर्पित करना है। अपूर्ण भूतकालीन हिन्दी रूप संदर्भ में उसके बार-बार किए जाने वाले आचरण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְקַטֵּר
  choice: धूप जलाता था
  rationale: उपासना-संबंधी संदर्भ में קטר का पिएल रूप प्रायः धूप जलाने या चढ़ावे को धुएँ में बदलने का बोध देता है; यहाँ प्रचलित सूत्र के लिए ‘धूप जलाता था’ स्पष्ट और स्वाभाविक है।
- source_word: בַּבָּמוֹת
  choice: पूजा के ऊँचे स्थानों पर
  rationale: במות स्थानीय उपासना-स्थलों को दर्शाता है, जो प्रायः ऊँचे स्थानों पर होते थे। केवल ‘ऊँचे स्थान’ हिन्दी में अस्पष्ट हो सकता है, इसलिए ‘पूजा के’ जोड़कर स्थान का धार्मिक स्वरूप स्पष्ट किया गया है, बिना उसे मूर्तिपूजक कहे।
- source_word: וְעַל הַגְּבָעוֹת
  choice: पहाड़ियों पर
  rationale: גבעות वास्तविक पहाड़ियों को दर्शाता है। इसे ‘ऊँचे स्थानों’ से अलग रखकर उपासना-स्थलों और भौगोलिक पहाड़ियों का भेद सुरक्षित रखा गया है।
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: और हर हरे-भरे पेड़ के नीचे
  rationale: רענן किसी हरी, ताज़ी या घनी वनस्पति का वर्णन कर सकता है। ‘हरे-भरे’ से मूल का सजीव और समृद्ध हरियाली वाला भाव स्वाभाविक हिन्दी में बना रहता है।
theological_decisions:
- issue: अनुचित उपासना के सूत्र का अनुवाद
  choice: बलि और धूप के कार्यों तथा उनके स्थानों को ठोस रूप में रखा गया है।
  alternative: ‘वह मूर्तिपूजक उपासना करता था’ जैसा व्याख्यात्मक अनुवाद।
  rationale: इस पद में इब्रानी पाठ कार्यों और स्थानों को गिनाता है, पर स्वयं ‘मूर्तिपूजक’ शब्द नहीं जोड़ता। व्यापक संदर्भ नकारात्मक मूल्यांकन देता है; अनुवाद में उसे पहले से आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूजा के ऊँचे स्थान’ सामान्य पाठक को במות का धार्मिक अर्थ समझाता है, जबकि ‘पहाड़ियों’ से उसका भौगोलिक भेद बनाए रखता है।
