  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
translation:
  language: hi
  text: तब अराम के राजा रसीन और रमल्याह का पुत्र और इस्राएल का राजा पेकह युद्ध करने के लिए यरूशलेम पर चढ़ाई करने आए। उन्होंने आहाज को घेर लिया, पर वे लड़ न सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर वे उसके विरुद्ध लड़ न सके।” इब्रानी में “लड़ने” के बाद कर्म नहीं दिया गया है; संदर्भ आहाज या यरूशलेम हो सकता है।
    reason: अंतिम क्रिया के अनिर्दिष्ट कर्म की स्रोतगत अस्पष्टता को सुरक्षित रखता है, बिना “जीतने” या युद्ध में सफलता का अतिरिक्त अर्थ जोड़े।
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह क्रम में अगली घटना को प्रस्तुत करने वाला स्वाभाविक हिन्दी काल-सूचक है।
- source_word: יַעֲלֶה
  choice: चढ़ाई की
  rationale: यरूशलेम की ओर सैन्य गति के संदर्भ में עלה का आशय केवल ऊपर जाने से अधिक, आक्रमण के लिए बढ़ने का है; हिन्दी में ‘चढ़ाई की’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: अराम के राजा रसीन
  rationale: ‘अराम’ इब्रानी जातीय-भौगोलिक नाम को सीधे दर्शाता है और नाम का हिन्दी लिप्यंतरण ‘रसीन’ रखा गया है।
- source_word: וּפֶקַח בֶּן רְמַלְיָהוּ מֶלֶךְ יִשְׂרָאֵל
  choice: और रमल्याह के पुत्र, इस्राएल के राजा पेकह
  rationale: पितृनाम और राजकीय उपाधि दोनों सुरक्षित रखते हुए हिन्दी में स्पष्ट संबंध प्रस्तुत किया गया है।
- source_word: יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: युद्ध करने के लिए यरूशलेम पर
  rationale: गंतव्य और सैन्य उद्देश्य दोनों स्पष्ट हैं; ‘पर’ प्रसंग में आक्रमण की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּצֻרוּ עַל אָחָז
  choice: उन्होंने आहाज को घेर लिया
  rationale: צור का सैन्य अर्थ घेराबंदी करना है; ‘घेर लिया’ सामान्य पाठक के लिए सहज और सटीक है।
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  choice: पर वे उसके विरुद्ध युद्ध में सफल न हो सके
  rationale: इब्रानी में असमर्थता और युद्ध का भाव है, पर अंतिम कर्म स्पष्ट रूप से दोहराया नहीं गया। मुख्य पाठ में निकटतम पूर्ववर्ती व्यक्ति आहाज को संदर्भ माना गया है, जबकि नगर-संदर्भ की संभावना पादटिप्पणी में सुरक्षित है।
