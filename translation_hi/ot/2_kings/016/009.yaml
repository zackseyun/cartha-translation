  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। 'अश्शूर', 'दमिश्क', 'कीर' और 'रसीन' नामों का प्रचलित बाइबलीय देवनागरी रूप अपनाया गया है। इब्रानी की पुनरुक्ति बनाए रखी गई है, जबकि नगर के निर्वासन संबंधी लक्षणा को मुख्य पाठ में स्वाभाविक हिंदी के लिए स्पष्ट किया गया है।
