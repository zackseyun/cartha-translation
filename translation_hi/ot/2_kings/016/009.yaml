base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
translation:
  language: hi
  text: तब अश्शूर के राजा ने उसकी बात मानी[a]। अश्शूर के राजा ने दमिश्क पर चढ़ाई करके उसे अपने अधिकार में ले लिया। उसने वहाँ के लोगों को निर्वासित करके कीर भेज दिया[b] और रसीन को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सुनी।” इब्रानी क्रिया ऐसी बात सुनने का अर्थ दे सकती है जिसके अनुसार कार्रवाई भी की जाए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसे कीर को निर्वासित कर दिया”; यहाँ नगर का नाम उसके निवासियों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֵלָיו
  choice: उसकी बात मानी
  rationale: שׁמע के साथ אֶל यहाँ केवल सुनने नहीं, बल्कि आग्रह पर अनुकूल कार्रवाई करने का भाव देता है। यह हिंदी में स्वाभाविक है; पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: यह सीधी संबंधवाचक रचना है। दोनों बार पूरा पद दोहराकर इब्रानी की कथात्मक पुनरुक्ति और बल बनाए रखा गया है।
- source_word: וַיַּעַל ... אֶל דַּמֶּשֶׂק
  choice: दमिश्क पर चढ़ाई करके
  rationale: सैनिक प्रसंग में עלה और אֶל किसी नगर के विरुद्ध आगे बढ़ने का भाव देते हैं। 'चढ़ाई' आगामी विजय और निर्वासन के अनुरूप युद्धात्मक आशय स्पष्ट करती है।
- source_word: וַיִּתְפְּשֶׂהָ
  choice: उसे अपने अधिकार में ले लिया
  rationale: תפשׂ यहाँ नगर पर नियंत्रण पाने को व्यक्त करता है। यह आधुनिक हिंदी में स्वाभाविक ढंग से दमिश्क पर अधिकार किए जाने को बताता है।
- source_word: וַיַּגְלֶהָ קִירָה
  choice: उसने वहाँ के लोगों को बँधुआ बनाकर कीर भेज दिया
  rationale: इब्रानी में स्त्रीलिंग प्रत्यय व्याकरणतः दमिश्क को लक्ष्य करता है, पर नगर उसके निवासियों के लिए प्रयुक्त है। हिंदी में निर्वासित जनसमुदाय को स्पष्ट किया गया है और קִירָה का दिशार्थ 'कीर भेज दिया' से व्यक्त है।
- source_word: קִירָה
  choice: कीर
  rationale: यह स्थान-नाम है, इसलिए इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וְאֶת רְצִין הֵמִית
  choice: और रसीन को मरवा डाला
  rationale: המית कारक रूप में 'मरवा देना/मृत्यु के घाट उतारना' है। 'मरवा डाला' राजा द्वारा कराए गए वध का भाव रखता है और सहज हिंदी है।
