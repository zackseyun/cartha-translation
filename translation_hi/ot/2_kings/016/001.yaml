  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: hi
  text: रमल्याह के पुत्र पेकह के शासन के सत्रहवें वर्ष में, योताम का पुत्र आहाज यहूदा का राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: शासन के सत्रहवें वर्ष में
  rationale: यह राजकीय कालगणना का सूत्र है। हिंदी में केवल ‘सत्रहवें वर्ष में’ भी संभव है, पर ‘शासन के’ जोड़ने से स्पष्ट होता है कि पेकह के राजत्व का वर्ष गिना जा रहा है।
- source_word: לְ/פֶקַח בֶּן רְמַלְיָהוּ
  choice: रमल्याह के पुत्र पेकह के
  rationale: לְ यहाँ उस राजा को चिह्नित करता है जिसके शासन-वर्ष की गणना हो रही है; वंशसूचक संबंध को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: מָלַךְ
  choice: राज करने लगा
  rationale: राजकीय अभिलेख-सूत्र में यह पूर्ण क्रिया सामान्यतः राजत्व के आरंभ को बताती है, इसलिए ‘राज किया’ के बजाय आरंभसूचक अनुवाद चुना गया है।
- source_word: אָחָז בֶּן יוֹתָם
  choice: योताम का पुत्र आहाज
  rationale: हिब्रू वंशसूचक पदबंध को सहज आधुनिक हिंदी में प्रस्तुत किया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह उपाधि आहाज की पहचान कराती है; हिंदी वाक्य-विन्यास में इसे नाम और वंशसूचक पदबंध से पहले रखना स्वाभाविक है।
