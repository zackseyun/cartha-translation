base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/008.yaml
  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
translation:
  language: hi
  text: आहाज ने यहोवा के भवन में और राजमहल के भंडारों में जो चाँदी और सोना मिला था, उसे ले लिया और अश्शूर के राजा को घूस[a] के रूप में भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नज़राने” अथवा “भेंट”; इब्रानी शब्द में सामान्यतः घूस का भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले लिया
  rationale: לקח के सामान्य कथात्मक अर्थ को सहज हिन्दी भूतकाल में व्यक्त करता है।
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: जितनी चाँदी और जितना सोना
  rationale: दोनों बहुमूल्य धातुओं की ठोस अभिव्यक्ति बनाए रखता है; हिन्दी में הַנִּמְצָא के साथ यह रचना स्वाभाविक है।
- source_word: הַנִּמְצָא
  choice: मिला
  rationale: מצא के निष्क्रिय कृदंत का प्रसंगानुकूल अर्थ है, अर्थात वहाँ जो उपलब्ध या विद्यमान धन मिला।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: शाब्दिक 'यहोवा का घर/भवन' को बनाए रखते हुए मंदिर के लिए गरिमापूर्ण और स्पष्ट हिन्दी देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम 'यहोवा' से दर्शाता है, किसी उपाधि से नहीं।
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  choice: और राजमहल के भंडारों में
  rationale: शाब्दिक 'राजा के भवन के भंडारों' का स्वाभाविक आधुनिक हिन्दी रूप; אֹצְרוֹת की बहुवचनता सुरक्षित है।
- source_word: וַיִּשְׁלַח לְמֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा को ... भेज दिया
  rationale: इब्रानी कथात्मक क्रिया और प्राप्तकर्ता को स्पष्ट, सहज हिन्दी क्रम में व्यक्त करता है।
- source_word: שֹׁחַד
  choice: घूस
  rationale: शब्द का सामान्य नकारात्मक अर्थ सुरक्षित रखता है; राजनीतिक संदर्भ में 'नज़राना' या 'भेंट' भी संभव है, इसलिए पादटिप्पणी दी गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए प्रचलित रूप 'यहोवा' चुना गया है; इसे 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: שֹׁחַד के नैतिक-राजनीतिक भाव को व्यक्त करना
  choice: घूस
  alternative: नज़राना या भेंट
  rationale: इब्रानी शब्द सामान्यतः अनुचित लाभ पाने के लिए दिए गए धन का नकारात्मक भाव रखता है, पर इस राजनयिक प्रसंग में कर/नज़राने जैसा अर्थ भी समझा जा सकता है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। 'भवन' मंदिर के लिए और 'राजमहल' राजा के निवास के लिए प्रयोग कर हिन्दी में अस्पष्टता से बचा गया है।
