- from: तब ऊरिय्याह याजक ने वेदी बनाई। राजा आहाज ने दमिश्क से जो कुछ भेजा था, ठीक उसी के अनुसार ऊरिय्याह याजक ने सब कुछ किया[a], और यह काम राजा आहाज के दमिश्क से आने से पहले ही पूरा कर लिया।
  to: तब ऊरिय्याह याजक ने वेदी बनाई। राजा आहाज ने दमिश्क से जो कुछ भेजा था, उसके पूरे अनुसार ऊरिय्याह याजक ने किया[a]। राजा आहाज के दमिश्क से आने तक ऊरिय्याह याजक ने ऐसा ही किया।
