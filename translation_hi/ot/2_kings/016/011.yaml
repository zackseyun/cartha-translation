source:
  edition: WLC
  text: וַ/יִּ֛בֶן אוּרִיָּ֥ה הַ/כֹּהֵ֖ן אֶת הַ/מִּזְבֵּ֑חַ כְּ/כֹ֣ל אֲשֶׁר שָׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז מִ/דַּמֶּ֗שֶׂק כֵּ֤ן עָשָׂה֙ אוּרִיָּ֣ה הַ/כֹּהֵ֔ן עַד בּ֥וֹא הַ/מֶּֽלֶךְ אָחָ֖ז מִ/דַּמָּֽשֶׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
translation:
  language: hi
  text: तब ऊरिय्याह याजक ने वेदी बनाई। राजा आहाज ने दमिश्क से जो कुछ भेजा था, उसके पूरे अनुसार ऊरिय्याह याजक ने किया[a]। राजा आहाज के दमिश्क से आने तक ऊरिय्याह याजक ने ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वैसा ही ऊरिय्याह याजक ने किया।” यह अभिव्यक्ति इस बात पर बल देती है कि उसने राजा आहाज द्वारा भेजी गई बात के पूरे अनुसार कार्य किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: बनाई
  rationale: בנה का सामान्य अर्थ ‘बनाना/निर्माण करना’ है। वेदी के साथ ‘बनाई’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: אוּרִיָּה הַכֹּהֵן
  choice: ऊरिय्याह याजक
  rationale: כהן के लिए प्रचलित बाइबिलीय हिन्दी शब्द ‘याजक’ रखा गया है; मूल पाठ की पुनरुक्ति और बल बनाए रखने के लिए पद में दोनों बार पूरा पदबंध रखा गया है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: מזבח का मानक हिन्दी समतुल्य ‘वेदी’ है। हिन्दी में इस संदर्भ में निश्चितता अलग निर्धारक के बिना स्वाभाविक रूप से व्यक्त होती है।
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  choice: जो कुछ भेजा था, ठीक उसी के अनुसार
  rationale: यह पदबंध राजा द्वारा पहले भेजे गए विवरण और ऊरिय्याह के काम के बीच पूर्ण अनुरूपता बताता है। ‘भेजा था’ घटनाओं का पूर्वक्रम स्पष्ट करता है।
- source_word: כֵּן עָשָׂה
  choice: ठीक उसी के अनुसार ... सब कुछ किया
  rationale: כֵּן עָשָׂה निर्देशों के अनुरूप कार्य करने पर बल देता है। हिन्दी क्रम को स्वाभाविक रखते हुए मूल के बल को ‘ठीक उसी के अनुसार’ से व्यक्त किया गया है।
- source_word: עַד בּוֹא
  choice: आने से पहले ही ... पूरा कर लिया
  rationale: इस पूर्ण किए गए निर्माण-कार्य के प्रसंग में עַד בּוֹא राजा के आगमन को अंतिम समय-सीमा बताता है; ‘पहले ही पूरा कर लिया’ हिन्दी में इस परिणामात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִדַּמֶּשֶׂק
  choice: दमिश्क से
  rationale: מִן स्रोत अथवा प्रस्थान-बिंदु दर्शाता है; दोनों स्थानों पर ‘दमिश्क से’ सीधा समतुल्य है।
