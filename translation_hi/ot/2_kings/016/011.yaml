  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की पुनरुक्ति को यथासंभव बनाए रखते हुए वाक्य-विन्यास हिन्दी पाठक के लिए स्वाभाविक किया गया है। ‘सब कुछ किया’ को संदर्भगत निर्माण-कार्य से जोड़ा गया है और ‘पहले ही पूरा कर लिया’ राजा के पहुँचने तक कार्य पूर्ण हो जाने का भाव स्पष्ट करता है।
