base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
translation:
  language: hi
  text: जब आहाज़ राजा बना, तब वह बीस वर्ष का था, और उसने यरूशलेम में सोलह वर्ष राज्य किया। उसने वह नहीं किया जो उसके परमेश्वर याहवे की दृष्टि में उचित था, जैसा उसके पिता दाऊद[a] ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उसके पिता दाऊद’ है। इस राजकीय संदर्भ में ‘पिता’ निकट जन्मदाता नहीं, बल्कि राजवंशी पूर्वज को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  choice: वह बीस वर्ष का था
  rationale: यह इब्रानी में आयु बताने का प्रचलित मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य यही है।
- source_word: בְּמָלְכוֹ
  choice: जब आहाज़ राजा बना
  rationale: यह पदबंध उसके राजसिंहासन पर बैठने के समय को दर्शाता है; ‘राजा बना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מָלַךְ
  choice: उसने ... राज्य किया
  rationale: क्रिया राजकीय शासन करने को व्यक्त करती है, इसलिए ‘राज्य किया’ उसके क्रियात्मक अर्थ को बनाए रखता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक प्रयोग का सीधा और प्रचलित हिन्दी रूप।
- source_word: לֹא עָשָׂה הַיָּשָׁר
  choice: उसने वह नहीं किया ... जो ... सही था
  rationale: राजाओं की पुस्तक के इस नैतिक मूल्यांकन-सूत्र को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: ‘आँखों में’ की अपेक्षा ‘दृष्टि में’ आधुनिक हिन्दी में मूल्यांकन के भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा सुरक्षित रखा गया है।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर
  rationale: एकवचन संबंधसूचक प्रत्यय आहाज़ की ओर संकेत करता है; ‘उसके परमेश्वर’ मूल की वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: כְּדָוִד אָבִיו
  choice: जैसा उसके पूर्वज दाऊद ने किया था
  rationale: यहाँ אָבִיו निकट पिता नहीं, बल्कि राजवंशी पूर्वज को सूचित करता है। ‘पूर्वज’ आधुनिक पाठक को आशय स्पष्ट करता है और ऐतिहासिक भ्रम से बचाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदले बिना उसका नामत्व सुरक्षित रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: ‘दाऊद उसका पिता’ का अर्थ
  choice: मुख्य पाठ में ‘उसके पूर्वज दाऊद’
  alternative: ‘उसके पिता दाऊद’, और अर्थ को पादटिप्पणी में स्पष्ट करना
  rationale: राजकीय वंशावली के संदर्भ में אָבִיו का अर्थ राजवंशी पूर्वज है। ‘पूर्वज’ हिन्दी में वास्तविक संबंध स्पष्ट करता है, जबकि पादटिप्पणी मूल की शब्दावली बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजकीय सूत्र के लिए ‘राजा बना’ और ‘राज्य किया’ प्रयुक्त हैं। नैतिक मूल्यांकन में ‘यहोवा की दृष्टि में सही’ मूल मुहावरे का स्वाभाविक हिन्दी रूप है।
