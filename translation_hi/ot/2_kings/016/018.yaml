  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
translation:
  language: hi
  text: उसने उस सब्त के ढके हुए मंडप को, जिसे उन्होंने भवन में बनाया था,[a] और राजा के बाहरी प्रवेश-मार्ग को[b] यहोवा के भवन से हटा दिया[c]—यह उसने अश्शूर के राजा के कारण किया।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सब्त की ढकी हुई संरचना,’ ‘सब्त का मंडप,’ अथवा ‘सब्त का बरामदा।’ इब्रानी स्थापत्य शब्द का ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजा का बाहरी द्वार’ अथवा ‘राजा के लिए बाहरी प्रवेश-मार्ग।’
    reason: lexical_alternative
  - marker: c
    text: या ‘मोड़ दिया,’ ‘बदल दिया,’ अथवा ‘दूसरी जगह कर दिया।’ इब्रानी क्रिया किसी वस्तु को फेरने या उसका स्थान बदलने का अर्थ भी दे सकती है, केवल पूरी तरह हटा देने का नहीं।
    reason: lexical_alternative
  - marker: d
    text: या ‘अश्शूर के राजा की वजह से’; सम्भवतः ‘अश्शूर के राजा के भय से।’
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשבת
  choice: सब्त का छायादार मंडप
  rationale: מיסך एक दुर्लभ स्थापत्य शब्द है, जिसका सटीक रूप अनिश्चित है। ‘छायादार मंडप’ किसी निर्मित, ढके हुए स्थान का स्वाभाविक हिन्दी संकेत देता है, जबकि विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: אֲשֶׁר בָּנוּ בַבַּיִת
  choice: जिसे उन्होंने भवन में बनाया था
  rationale: अनिर्दिष्ट बहुवचन कर्ता ‘उन्होंने’ को बनाए रखता है। प्रसंग में ‘भवन’ मन्दिर को सूचित करता है, पर मूल की अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  choice: राजा का बाहरी प्रवेश-मार्ग
  rationale: מְבוֹא प्रवेश अथवा प्रवेश-मार्ग को दर्शाता है। यह अनुवाद राजकीय बाहरी पहुँच का अर्थ स्पष्ट करते हुए इब्रानी पदबंध के निकट रहता है।
- source_word: הֵסֵב
  choice: हटा दिया
  rationale: סבב के हिफ़ील रूप का अर्थ मोड़ना, फेर देना, स्थान बदलना या हटाना हो सकता है। स्थापत्य प्रसंग में ‘हटा दिया’ स्वाभाविक है, पर क्रिया की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ और בית को मूल रूपक के अनुरूप ‘भवन’ अनूदित किया गया है। प्रसंगतः यह मन्दिर है।
- source_word: מִפְּנֵי מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के कारण
  rationale: מִפְּנֵי यहाँ कारण या किसी प्रभावशाली व्यक्ति के सामने दबाव को सूचित कर सकता है। ‘के कारण’ न्यूनतम व्याख्यात्मक है; ‘भय से’ सम्भावना पादटिप्पणी में है।
theological_decisions:
- issue: अहाज की प्रेरणा और मन्दिर में किए गए परिवर्तन की सीमा
  choice: कारण को सामान्य रूप में और क्रिया को ‘हटा दिया’ के रूप में व्यक्त करना
  alternative: ‘अश्शूर के राजा के भय से’ तथा ‘मोड़ दिया/बदल दिया/दूसरी जगह कर दिया’
  rationale: इब्रानी पाठ अश्शूरी राजा के कारण दबाव अवश्य दर्शाता है, पर भय को स्पष्ट रूप से नहीं कहता; इसी तरह क्रिया पूर्ण विनाश के बजाय दिशा या स्थान में परिवर्तन भी बता सकती है। मुख्य पाठ पठनीय रखा गया है और अनिश्चितता पादटिप्पणियों में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है; स्थापत्य शब्द, क्रिया और अहाज की प्रेरणा से जुड़ी वास्तविक अनिश्चितता पादटिप्पणियों में रखी गई है।
