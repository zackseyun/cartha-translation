  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: hi
  text: तब ऊरिय्याह याजक ने राजा आहाज ने जो कुछ आज्ञा दी थी, उसके अनुसार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: तब ... ने ... किया
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है। यहाँ आज्ञा के अनुरूप कार्य करने का वर्णन है, इसलिए ‘किया’ स्वाभाविक है; וַ־ को कथा के क्रम में ‘तब’ से व्यक्त किया गया है।
- source_word: אוּרִיָּה
  choice: ऊरिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित पदवी को हिन्दी में स्वाभाविक रूप से ‘याजक’ कहा गया है; नाम के बाद इसका प्रयोग स्पष्ट और गरिमापूर्ण है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वह सब ... जिसकी
  rationale: यह पदबंध आगे कही गई आज्ञा के पूर्ण अनुपालन को व्यक्त करता है। ‘वह सब किया, जिसकी आज्ञा...’ आधुनिक हिन्दी में स्वाभाविक रहते हुए समग्रता को बनाए रखता है।
- source_word: צִוָּה
  choice: आज्ञा ... दी थी
  rationale: צוה का अर्थ ‘आज्ञा देना’ है। ‘दी थी’ यह स्पष्ट करता है कि राजा की आज्ञा ऊरिय्याह के कार्य से पहले दी गई थी।
- source_word: הַמֶּלֶךְ אָחָז
  choice: राजा आहाज
  rationale: हिन्दी में राजकीय उपाधि नाम से पहले रखना स्वाभाविक है और इब्रानी पदबंध का आशय ठीक व्यक्त करता है।
theological_decisions:
- issue: ऊरिय्याह के आज्ञापालन का कथात्मक मूल्यांकन
  choice: पद को बिना अतिरिक्त नैतिक टिप्पणी के वर्णनात्मक रूप में रखा गया है।
  alternative: ऐसी शब्दावली जोड़ना जिससे ऊरिय्याह के कार्य की स्पष्ट स्वीकृति या निंदा झलके।
  rationale: इब्रानी पाठ केवल यह बताता है कि ऊरिय्याह ने आहाज की आज्ञा के अनुसार सब किया। व्यापक प्रसंग नकारात्मक मूल्यांकन की ओर संकेत कर सकता है, पर यह पद स्वयं उसे स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। वाक्य को शब्दशः कठोर बनाने के बजाय स्रोत के क्रम, पूर्ण अनुपालन और पूर्वकालिक आज्ञा को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
