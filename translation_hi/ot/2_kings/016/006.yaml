  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
translation:
  language: hi
  text: उस समय अराम के राजा रसीन ने एलत को फिर अराम के अधिकार में कर लिया और यहूदावासियों को एलोत[b] से निकाल दिया। तब अरामी लोग[a] एलत में आकर आज तक वहीं बसे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘अरामी’ है। कुछ व्याख्याकार और प्राचीन पाठ-साक्ष्य ‘एदोमी’ पाठ का समर्थन करते हैं, संभवतः क्योंकि वह व्यापक संदर्भ और 2 इतिहास 28:17 के समानांतर विवरण से मेल खाता है।
    reason: textual_variant
  - marker: b
    text: इस पद में इसी स्थान-नाम का एक रूप ‘एलोत’ भी आया है; अन्य स्थान पर ‘एलत’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  choice: फिर ... के अधिकार में कर लिया
  rationale: हिफ़ील रूप यहाँ किसी स्थान को पुनः राजनीतिक नियंत्रण में लाने का भाव देता है; यह हिंदी में स्वाभाविक रूप से उस अर्थ को व्यक्त करता है।
- source_word: אֵילַת / אֵילוֹת
  choice: एलत / एलोत
  rationale: पद में स्थान-नाम के दो इब्रानी रूप आए हैं; मुख्य पाठ में दोनों का लिप्यंतरण रखकर रूपांतर को दृश्यमान बनाया गया है।
- source_word: לַאֲרָם
  choice: अराम के अधिकार में
  rationale: वाक्यांश स्वामित्व अथवा राजनीतिक नियंत्रण के हस्तांतरण को बताता है। मूल नाम ‘अराम’ को बनाए रखा गया है।
- source_word: וַיְנַשֵּׁל
  choice: निकाल दिया
  rationale: क्रिया किसी स्थान के निवासियों को उनके कब्जे से हटाने या बाहर करने का अर्थ देती है; यह सहज और स्पष्ट हिंदी है।
- source_word: הַיְהוּדִים
  choice: यहूदावासियों
  rationale: राजतंत्रकालीन संदर्भ में इससे यहूदा राज्य के लोग अभिप्रेत हैं; यह चयन बाद के व्यापक धार्मिक-जातीय अर्थ से भेद स्पष्ट करता है।
- source_word: ו/ארמים
  choice: अरामी लोग
  rationale: मसोरेटिक व्यंजन-पाठ अरामियों को दर्शाता है। ‘एदोमी’ पाठांतर को मुख्य पाठ में अपनाने के बजाय पादटिप्पणी में रखा गया है।
- source_word: וַיֵּשְׁבוּ שָׁם עַד הַיּוֹם הַזֶּה
  choice: वहीं बस गए; वे आज तक वहीं रहते हैं
  rationale: यह आरंभिक बसने और लेखक के समय तक जारी निवास—दोनों भावों को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में जातिनाम संबंधी पाठालोचनात्मक कठिनाई
  choice: अरामी लोग एलत में आए
  alternative: एदोमी लोग एलत में आए
  rationale: WLC/मसोरेटिक पाठ ‘अरामी’ पढ़ता है, इसलिए वही मुख्य पाठ का आधार है। प्राचीन साक्ष्यों और 2 इतिहास 28:17 के संदर्भ से समर्थित ‘एदोमी’ विकल्प को वास्तविक पाठांतर के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ऐतिहासिक जातिनामों के लिए ‘अराम’, ‘अरामी’ और ‘यहूदावासी’ प्रयुक्त हैं। पाठ की ऐतिहासिक कठिनाई को चुपचाप सुलझाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
