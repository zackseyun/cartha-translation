- source_word: עָלָיו תִּזְרֹק
  choice: उसी पर उछालना
  rationale: זרק में रक्त को अनुष्ठानिक रूप से फेंकने या उछालने का भाव है; ‘उसी’ का संकेत बड़ी वेदी की ओर स्पष्ट करता है।
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  choice: पर कांसे की वेदी
  rationale: विरोधसूचक वाक्य-संबंध और वेदी की धातु दोनों स्पष्ट रखे गए हैं।
