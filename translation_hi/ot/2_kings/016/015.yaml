base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
translation:
  language: hi
  text: तब राजा आहाज ने ऊरिय्याह याजक को आज्ञा दी, “बड़ी वेदी पर सुबह की होमबलि और शाम की अन्नबलि, राजा की होमबलि और उसकी अन्नबलि, तथा देश के सब लोगों की होमबलि, उनकी अन्नबलियाँ और उनकी पेयबलियाँ चढ़ाना। होमबलि का सारा लहू और बलिदान का सारा लहू उसी पर उछालना। पर कांसे की वेदी मेरे परामर्श लेने के लिए रहेगी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे निरीक्षण करने के लिए,” “मेरे विचार करने के लिए,” अथवा संभवतः “मेरे मार्गदर्शन खोजने के लिए।” यहाँ प्रयुक्त इब्रानी अभिव्यक्ति कठिन है; आहाज ने कांसे की वेदी के लिए ठीक कौन-सा काम निर्धारित किया, यह निश्चित नहीं है।
    reason: लְבַקֵּר के अर्थ और कांसे की वेदी के नियत उपयोग में वास्तविक भाषिक अनिश्चितता है।
