  choice: बड़ी वेदी पर
  rationale: विशेषण और स्थानवाचक संबंध दोनों सुरक्षित हैं; यह नई वेदी को कांसे की वेदी से अलग करता है।
- source_word: הַקְטֵר
  choice: चढ़ाना
  rationale: हिफ़ील रूप बलि को वेदी पर जलाकर अर्पित करने का निर्देश देता है; हिन्दी में ‘चढ़ाना’ सहज बलिदानी पद है और केवल दहन तक अर्थ सीमित नहीं करता।
- source_word: עֹלַת הַבֹּקֶר ... מִנְחַת הָעֶרֶב
  choice: सुबह की होमबलि और शाम की अन्नबलि
  rationale: עֹלָה के लिए मानक ‘होमबलि’ और बलिदानी संदर्भ में מִנְחָה के लिए स्पष्ट ‘अन्नबलि’ प्रयुक्त हुए हैं।
- source_word: עֹלַת הַמֶּלֶךְ וְאֶת מִנְחָתוֹ
  choice: राजा की होमबलि और उसकी अन्नबलि
  rationale: मूल के संबंधवाचक रूप और राजा की ओर संकेत करता सर्वनाम सुरक्षित रखा गया है।
- source_word: עֹלַת כָּל עַם הָאָרֶץ
  choice: देश के सब लोगों की होमबलि
