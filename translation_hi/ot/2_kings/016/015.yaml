  rationale: क्रिया का सटीक आशय कठिन और विवादित है। मुख्य पाठ संभावित परामर्शात्मक अर्थ रखता है, पर किसी निश्चित ज्योतिषीय या भविष्यकथन-विधि को आरोपित नहीं करता; पादटिप्पणी अन्य वास्तविक संभावनाएँ सुरक्षित रखती है।
