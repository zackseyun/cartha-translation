base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/019.yaml
  text: The rest of the acts of Ahaz[a], which he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: आहाज के बाकी काम, जो उसने किए, क्या वे यहूदा के राजाओं के इतिहास की पुस्तक[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजाओं के वृत्तांत की पुस्तक।”
    reason: דִּבְרֵי הַיָּמִים का अर्थ इस अभिलेखीय सन्दर्भ में ‘इतिहास’ या ‘वृत्तांत’ हो सकता है।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: बाकी काम
  rationale: राजकीय सार-वाक्य में יֶתֶר का अर्थ ‘शेष/बाकी’ और דִּבְרֵי का आशय राजा के कार्यों या राजकीय गतिविधियों से है। ‘बाकी काम’ सहज आधुनिक हिन्दी है।
- source_word: אָחָז
  choice: अहाज
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किए
  rationale: सम्बन्धवाचक उपवाक्य और עָשָׂה के क्रियार्थ को सीधे सुरक्षित रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वे ... नहीं लिखे हैं?
  rationale: הֲלֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी प्रश्न-विन्यास मूल के बल और रूप को बनाए रखता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक ‘पुस्तक/लिपिपत्र पर’ के स्थान पर दस्तावेज़ के भीतर लिखे होने के लिए स्वाभाविक हिन्दी ‘पुस्तक में’ है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास
  rationale: यह राजकीय अभिलेख के शीर्षक-सदृश पदबंध को दर्शाता है। ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘वृत्तांत’ सम्भव वैकल्पिक अर्थ के रूप में पादटिप्पणी में दिया गया है।
