base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
translation:
  language: hi
  text: उसने अपनी होमबलि और अन्नबलि को जलाकर चढ़ाया, अपना अर्घ उंडेला, और अपनी मेलबलियों[a] का लहू वेदी पर उछाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांतिबलियों,” “सहभागिता-बलियों,” अथवा “कुशल-मंगल की बलियों।” इब्रानी शब्द שְׁלָמִים एक विशिष्ट प्रकार की बलि का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: चढ़ाकर धुआँ उठाया
  rationale: हिफ़इल रूप बलि को वेदी पर जलाकर उसका धुआँ ऊपर उठाने की याजकीय क्रिया बताता है; यह अनुवाद केवल सामान्यतः ‘जलाया’ कहने की अपेक्षा बलिदान-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: עֹלָתוֹ
  choice: अपनी होमबलि
  rationale: עֹלָה उस बलि की मानक संज्ञा है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ शब्द है।
- source_word: מִנְחָתוֹ
  choice: अन्नबलि
  rationale: इस उपासना-संबंधी प्रसंग में מִנְחָה सामान्य भेंट नहीं, अनाज से तैयार की जाने वाली विशिष्ट बलि है।
- source_word: וַיַּסֵּךְ אֶת נִסְכּוֹ
  choice: अपना अर्घ चढ़ाया
  rationale: נסך और נֶסֶךְ तरल भेंट को उँडेलने की विधि सूचित करते हैं। आधुनिक हिन्दी में ‘अर्घ चढ़ाया’ इस अनुष्ठान को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: וַיִּזְרֹק
  choice: छिड़का
  rationale: बलि-विधि में זרק का आशय लहू को वेदी की ओर फेंकने या उस पर उछालने से है। ‘छिड़का’ हिन्दी में इस अनुष्ठानिक क्रिया का स्वाभाविक शब्द है, यद्यपि यह बहुत हलके छिड़काव का अर्थ भी दे सकता है।
- source_word: דַּם הַשְּׁלָמִים
  choice: मेलबलियों का लहू
  rationale: שְׁלָמִים एक विशिष्ट बलि-श्रेणी है। ‘मेलबलि’ संक्षिप्त और प्रचलित है तथा शांति, सहभागिता और कुशल-मंगल से जुड़े अर्थक्षेत्र को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: אֲשֶׁר לוֹ
  choice: अपनी
  rationale: यह पदबंध उन मेलबलियों को राजा की अपनी बलियाँ बताता है; हिन्दी में संबंधवाचक उपवाक्य की अपेक्षा ‘अपनी’ अधिक स्वाभाविक है।
- source_word: עַל הַמִּזְבֵּחַ
  choice: वेदी पर
  rationale: זרק के साथ עַל लहू को वेदी पर या वेदी से लगाकर उछालने का भाव दे सकता है। ‘वेदी पर’ मूल की स्थानगत व्यापकता बनाए रखता है और हिन्दी में सहज है।
theological_decisions:
- issue: שְׁלָמִים बलि-श्रेणी का अर्थ
  choice: मेलबलि
  alternative: शांतिबलि; सहभागिता-बलि; कुशल-मंगल की बलि
  rationale: मूल शब्द की व्युत्पत्ति और अनुष्ठानिक अर्थक्षेत्र को किसी एक धर्मवैज्ञानिक व्याख्या में सीमित न करते हुए मुख्य पाठ में परिचित शब्द रखा गया और विकल्प पादटिप्पणी में दिए गए।
