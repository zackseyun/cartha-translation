  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
translation:
  language: hi
  text: वह इस्राएल के राजाओं के मार्ग पर चला, और उसने अपने बेटे को भी आग में से होकर गुज़रवाया[a], उन जातियों के घिनौने कामों के अनुसार जिन्हें यहोवा ने इस्राएलियों के सामने से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने बेटे को आग में बलि चढ़ाया।” इब्रानी में शाब्दिक अर्थ है, “अपने बेटे को आग में से होकर गुज़रवाया”; यह एक निंदित गैर-इस्राएली धार्मिक अनुष्ठान से जुड़ा मुहावरा है।
    reason: मूल मुहावरे से जुड़ी अधिक स्पष्ट वैकल्पिक व्याख्या को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: की चाल पर चला
  rationale: यह मुहावरा जीवन-व्यवहार और आचरण के ढंग को दर्शाता है। ‘चाल पर चला’ इब्रानी के चलने/मार्ग के रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: यह उत्तरी राज्य के राजाओं की ओर संकेत करने वाला सीधा संबंधसूचक पद है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पिछले अपराध से आगे बढ़ते हुए एक और गंभीर कार्य पर बल देता है।
- source_word: אֶת־בְּנוֹ
  choice: अपने बेटे को
  rationale: एकवचन संज्ञा और पुरुषवाचक प्रत्यय को स्पष्ट रूप से बनाए रखा गया है।
- source_word: הֶעֱבִיר בָּאֵשׁ
  choice: आग में से पार कराया
  rationale: यह मूल इब्रानी मुहावरे को सुरक्षित रखता है और अनुष्ठान के ठीक स्वरूप को मुख्य पाठ में आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: כְּתֹעֲבוֹת הַגּוֹיִם
  choice: उन जातियों के घिनौने काम किए
  rationale: शाब्दिक ‘घृणित कामों के अनुसार’ को स्वाभाविक हिन्दी में व्यवहारगत अनुरूपता के रूप में व्यक्त किया गया है। ‘जातियाँ’ इस भूभाग की गैर-इस्राएली प्रजातियों के लिए तटस्थ चयन है।
- source_word: אֲשֶׁר הוֹרִישׁ
  choice: जिन्हें ... निकाल दिया था
  rationale: यहाँ क्रिया का अर्थ देश से बेदखल करना अथवा निकाल देना है; पूर्वकालिकता के लिए ‘दिया था’ प्रयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रीति से परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के सामने से
  rationale: ‘सामने से’ निष्कासन का स्थान-संबंध बनाए रखता है; ‘इस्राएली’ आधुनिक हिन्दी में पूरे जातीय समुदाय का स्वाभाविक और स्पष्ट नाम है।
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ को स्पष्ट बाल-बलि के रूप में अनूदित किया जाए या मूल मुहावरा रखा जाए
  choice: मुख्य पाठ में ‘अपने बेटे को ... आग में से पार कराया’
  alternative: ‘अपने बेटे को आग में बलि चढ़ाया’ अथवा ‘अपने बेटे को आग में जला दिया’
  rationale: यह पद एक निंदित गैर-इस्राएली अनुष्ठान को स्पष्टतः बताता है, पर स्वयं इब्रानी वाक्यांश उसके सारे कर्मकांडीय विवरण निश्चित नहीं करता। इसलिए मुख्य पाठ में मुहावरा रखा और अधिक स्पष्ट व्याख्यात्मक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चाल पर चला’ नैतिक आचरण का रूपक बनाए रखता है। मुख्य पाठ अनुष्ठान की प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता; [a] वैकल्पिक अर्थ स्पष्ट करती है।
