  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
translation:
  language: hi
  text: तब परमेश्वर के जन ने कहा, “वह कहाँ गिरा?” उसने उन्हें वह स्थान दिखाया। तब परमेश्वर के जन ने लकड़ी का एक टुकड़ा काटकर वहाँ फेंका, और लोहा तैरने लगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में शाब्दिक रूप से “लोहा” है। संदर्भ में इसका अर्थ पिछले पद में बताई गई लोहे की कुल्हाड़ी का फल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी के लिए प्रयुक्त मानक इब्रानी उपाधि का सीधा और स्वाभाविक हिन्दी रूप है; ‘नबी’ कहने से मूल मुहावरे का अर्थ अधिक स्पष्ट कर दिया जाता।
- source_word: אָנָה נָפָל
  choice: वह कहाँ गिरा?
  rationale: स्थान पूछने वाले क्रियाविशेषण और पूर्ण हो चुकी घटना को आधुनिक हिन्दी के स्वाभाविक प्रश्न के रूप में व्यक्त करता है। संदर्भ से ‘वह’ लोहे की कुल्हाड़ी का फल है।
- source_word: וַיַּרְאֵהוּ אֶת־הַמָּקוֹם
  choice: उसने उसे वह स्थान दिखाया
  rationale: ראה के हिफ़ील रूप का अर्थ ‘दिखाना’ है। स्वतंत्र वाक्य क्रमिक इब्रानी कथन-शैली को बनाए रखता है।
- source_word: וַיִּקְצָב עֵץ
  choice: उसने लकड़ी का एक टुकड़ा काटकर
  rationale: עֵץ यहाँ पेड़, लकड़ी या लकड़ी के टुकड़े को सूचित कर सकता है। ‘लकड़ी का एक टुकड़ा’ आकार या रूप के बारे में अनावश्यक निश्चितता से बचता है।
- source_word: וַיַּשְׁלֶךְ שָׁמָּה
  choice: वहाँ फेंका
  rationale: मूल क्रिया और स्थानवाचक क्रियाविशेषण का संक्षिप्त, स्वाभाविक हिन्दी रूप।
- source_word: וַיָּצֶף הַבַּרְזֶל
  choice: लोहा तैरने लगा
  rationale: मूल में ‘लोहा’ कर्ता है और क्रिया तैरने अथवा सतह पर आने को दर्शाती है। यह रूप घटना को चमत्कार के रूप में सीधे कहता है, उसका प्राकृतिक स्पष्टीकरण नहीं देता।
- source_word: הַבַּרְזֶל
  choice: लोहा
  rationale: मूल का शाब्दिक रूप ‘लोहा’ है। पिछले पद के संदर्भ में यह लोहे की कुल्हाड़ी के फल को दर्शाता है; स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: वर्णित चमत्कारी घटना
  choice: लोहा तैरने लगा
  alternative: लोहा सतह पर आ गया
  rationale: वर्णन को बिना स्वाभाविक बनाने या बढ़ा-चढ़ाकर कहने के सीधे प्रस्तुत किया गया है। ‘तैरने लगा’ וַיָּצֶף का सहज हिन्दी रूप है और मूल की चमत्कारी धार को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। क्रमिक क्रियाओं को छोटे वाक्यों में रखा गया है और मूल के ‘लोहा’ को मुख्य पाठ में सुरक्षित रखते हुए संदर्भगत स्पष्टीकरण पाद-टिप्पणी में दिया गया है।
