  yaml_path: translation/ot/2_kings/006/031.yaml
  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
translation:
  language: hi
  text: तब उसने कहा, “यदि आज शाफात के पुत्र एलीशा का सिर उसके धड़ पर बना रहे[a], तो परमेश्वर मुझ से ऐसा ही, बल्कि इससे भी अधिक करे!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यदि आज शाफात के पुत्र एलीशा का सिर उस पर खड़ा रहे”—अर्थात, यदि आज एलीशा का सिर उसके शरीर पर बना रहे।
    reason: lexical_alternative
lexical_decisions:
