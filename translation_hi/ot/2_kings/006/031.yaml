  rationale: रूप व्याकरणतः बहुवचन जैसा है, पर इस प्रसंग और शपथ-सूत्र में अर्थ एकवचन है।
- source_word: אִם
  choice: यदि
  rationale: शपथ-सूत्र में यह शर्त वक्ता की दृढ़ धमकी प्रकट करती है; हिंदी में ‘यदि…तो’ इसकी संरचना और आशय दोनों स्पष्ट रखता है।
- source_word: יַעֲמֹד
  choice: बना रहे
  rationale: मूल अर्थ ‘खड़ा रहे’ है, किंतु यहाँ सिर के शरीर पर रहने का आशय है। ‘बना रहे’ इस मुहावरे को सहज हिंदी में व्यक्त करता है।
- source_word: רֹאשׁ אֱלִישָׁע בֶּן שָׁפָט
  choice: शाफात के पुत्र एलीशा का सिर
  rationale: यह इब्रानी संबंध-संरचना को स्पष्ट और स्वाभाविक हिंदी में रखता है तथा धमकी की कठोरता बनाए रखता है।
- source_word: עָלָיו
  choice: उसके धड़ पर
  rationale: शाब्दिक रूप ‘उस पर’ है और सर्वनाम एलीशा की ओर संकेत करता है। हिंदी में ‘धड़ पर’ जोड़ने से शिरच्छेद की धमकी बिना अस्पष्टता के समझ आती है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समय की तात्कालिकता को सरल आधुनिक हिंदी में बनाए रखता है।
theological_decisions:
- issue: शपथ-सूत्र का संदर्भ और बल
  choice: 'परमेश्वर को साक्षी बनाकर स्वयं पर दंड बुलाने वाली शपथ: यदि उसी दिन एलीशा का वध न हो, तो वक्ता अपने ऊपर परमेश्वर का न्याय बुलाता है।'
  alternative: इसे पूर्ण शपथ के बजाय केवल क्रोधपूर्ण उद्गार मानना।
  rationale: इब्रानी बाइबल में यह एक स्थापित राजकीय शपथ-सूत्र है; इसलिए इसके आत्म-शाप और दृढ़ धमकी के बल को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शपथ की कठोरता को नरम नहीं किया गया; ‘धड़’ से शिरच्छेद की धमकी स्पष्ट होती है, जबकि पादटिप्पणी मूल इब्रानी की सजीव और कुछ हद तक दीर्घवृत्तीय अभिव्यक्ति सुरक्षित रखती है।
