  choice: तो परमेश्वर मेरे साथ ऐसा ही, बल्कि इससे भी अधिक करे
  rationale: यह इब्रानी की प्रचलित आत्म-शापयुक्त शपथ है। हिंदी में यह रूप उसकी शपथ और धमकी—दोनों की शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהִים
