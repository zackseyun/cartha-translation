base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
translation:
  language: hi
  text: और जब वे शोमरोन में पहुँचे, तब एलीशा ने कहा, “हे याहवे, इन लोगों[a] की आँखें खोल दे, ताकि वे देख सकें।” तब याहवे ने उनकी आँखें खोल दीं; उन्होंने देखा, और देखो, वे शोमरोन के बीचोंबीच थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “इन” है; स्पष्टता के लिए “लोगों” जोड़ा गया है। संकेत अरामी सैनिकों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  choice: और जब वे ... पहुँचे
  rationale: इब्रानी कथन-रचना अगले घटनाक्रम का समय बताती है। यह रूप उसके कालगत भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: यह इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण है; इस प्रसंग में नगर अभिप्रेत है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण रखा गया है, उसके स्थान पर कोई उपाधि नहीं दी गई।
- source_word: פְּקַח אֶת עֵינֵי
  choice: आँखें खोल दे
  rationale: मूल मुहावरे को बनाए रखता है और परमेश्वर द्वारा दूर की गई दृष्टिहीनता अथवा बोधहीनता के प्रसंग में स्वाभाविक है।
- source_word: אֵלֶּה
  choice: इन लोगों
  rationale: मूल में केवल संकेतवाचक ‘इन’ है। हिन्दी में संदर्भ स्पष्ट करने के लिए ‘लोगों’ जोड़ा गया है; आशय अरामी सैनिकों से है।
- source_word: וְיִרְאוּ
  choice: ताकि वे देख सकें
  rationale: आज्ञार्थक प्रार्थना के बाद आया क्रियारूप यहाँ उद्देश्य या परिणाम व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आकस्मिक बोध की ओर ध्यान खींचने वाले इब्रानी कथन-सूचक का बल बनाए रखता है।
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  choice: शोमरोन के बीचोंबीच
  rationale: यह उस नाटकीय स्थिति को व्यक्त करता है कि वे नगर के भीतर, उसके मध्य में आ पहुँचे थे।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: आँखें खुलने का अर्थ
  choice: शाब्दिक मुहावरा ‘आँखें खोल दे’ बनाए रखा
  alternative: उन्हें फिर से दिखने दे; उन्हें समझने दे
  rationale: प्रसंग में शारीरिक दृष्टि और परमेश्वर द्वारा नियंत्रित बोध के बीच तनाव है। मूल मुहावरा दोनों संभावनाओं को बिना अनावश्यक रूप से सीमित किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल के ध्यानाकर्षक कथन-सूचक को बचाता है, जबकि ‘बीचोंबीच’ दृश्य की नाटकीयता को स्वाभाविक हिन्दी में व्यक्त करता है।
