  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
translation:
  language: hi
  text: जब उनमें से एक शहतीर काट रहा था, तो लोहे का फल[a] पानी में गिर गया। वह चिल्लाकर बोला, “हाय, मेरे स्वामी! वह तो उधार का था!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में केवल “लोहा” है; यहाँ आशय औज़ार के लोहे वाले काटने के भाग से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל הַקּוֹרָה
  choice: शहतीर काट रहा था
  rationale: हिफ़ील कृदंत מַפִּיל का यहाँ भाव काटकर गिराने का है, और קוֹרָה निर्माण के लिए प्रयुक्त शहतीर या भारी लकड़ी को दर्शाता है। हिंदी में यह संयोजन प्रसंगानुकूल और सहज है।
- source_word: הַבַּרְזֶל
  choice: लोहे का फल
  rationale: मूल में शब्दशः ‘लोहा’ है, पर प्रसंग में आशय औज़ार के लोहे वाले काटने के भाग से है। ‘लोहे का फल’ उस लक्षणा को स्पष्ट करता है और अनावश्यक रूप से पूरे औज़ार को कुल्हाड़ी नहीं ठहराता।
- source_word: וַיִּצְעַק
  choice: चिल्लाकर बोला
  rationale: यह आकस्मिक संकट में ऊँची आवाज़ से पुकारने को व्यक्त करता है; ‘चिल्लाकर बोला’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह दुःख और घबराहट की विस्मयादिबोधक पुकार है; ‘हाय’ संक्षिप्त, गंभीर और स्वाभाविक हिंदी समतुल्य है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: एलीशा को सम्मानित वरिष्ठ और गुरु के रूप में संबोधन है। ‘मेरे स्वामी’ मूल के संबंधसूचक प्रत्यय और आदर दोनों को बनाए रखता है।
- source_word: שָׁאוּל
  choice: उधार का था
  rationale: यहाँ रूप का अर्थ है कि वस्तु किसी और से माँगकर ली गई थी। हिंदी मुहावरे में ‘उधार का था’ स्वामित्व न होने और वक्ता की चिंता को स्पष्ट करता है।
