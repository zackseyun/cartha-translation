  text: וַ/יֹּאמְר֥וּ בְנֵֽי הַ/נְּבִיאִ֖ים אֶל אֱלִישָׁ֑ע הִנֵּֽה נָ֣א הַ/מָּק֗וֹם אֲשֶׁ֨ר אֲנַ֜חְנוּ יֹשְׁבִ֥ים שָׁ֛ם לְ/פָנֶ֖י/ךָ צַ֥ר מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: The sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
translation:
  language: hi
  text: भविष्यद्वक्ताओं के पुत्रों[a] ने एलीशा से कहा, “कृपया देखिए, वह स्थान, जहाँ हम आपके सामने[b] रहते हैं, हमारे लिए तंग पड़ रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “भविष्यद्वक्ताओं के पुत्र।” यह इब्रानी मुहावरा संभवतः भविष्यद्वक्ताओं के किसी समुदाय के सदस्यों या प्रशिक्षण पानेवाले शिष्यों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “आपकी उपस्थिति में”; इसका आशय एलीशा की देखरेख में रहना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के शिष्य
  rationale: इब्रानी मुहावरे का आशय भविष्यद्वक्ताओं के समुदाय से जुड़े प्रशिक्षुओं या अनुयायियों से है। हिन्दी में शाब्दिक ‘भविष्यद्वक्ताओं के पुत्र’ भ्रामक रूप से जैविक पुत्रों का संकेत दे सकता है; ‘शिष्य’ प्रसंगगत अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: הִנֵּה נָא
  choice: कृपया ध्यान दीजिए
  rationale: הִנֵּה ध्यान आकर्षित करता है और נָא निवेदन को विनम्र बनाता है। यह प्रयोग दोनों भावों को वर्तमान, सम्मानपूर्ण हिन्दी में व्यक्त करता है।
- source_word: הַמָּקוֹם
  choice: स्थान
  rationale: स्रोत का शब्द व्यापक है और निवास अथवा सभा-स्थल दोनों हो सकता है; ‘स्थान’ बिना अनावश्यक विशिष्टीकरण के इस व्यापकता को बनाए रखता है।
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  choice: जिस स्थान पर हम आपके सामने रहते हैं
  rationale: יָשַׁב यहाँ रहने या निवास करने के अर्थ में है। שָׁם को हिन्दी संबंधवाचक रचना ‘जिस स्थान पर’ में स्वाभाविक रूप से समाहित किया गया है। לְפָנֶיךָ का ‘आपके सामने’ रूप मूल की अस्पष्टता—भौतिक उपस्थिति अथवा एलीशा की देखरेख—को बनाए रखता है।
- source_word: צַר מִמֶּנּוּ
  choice: हमारे लिए बहुत तंग है
  rationale: צַר का मूल स्थानिक अर्थ ‘तंग/संकरी’ है; यहाँ उपलब्ध जगह अपर्याप्त होने की शिकायत है। ‘बहुत तंग’ हिन्दी में स्वाभाविक रूप से यही भाव देता है।
- source_word: וַיֹּאמְרוּ
  choice: ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। अलग से ‘तब’ या ‘अब’ जोड़ना आवश्यक नहीं; हिन्दी का साधारण कथात्मक भूतकाल पर्याप्त है।
theological_decisions:
- issue: भविष्यद्वक्ताओं के पुत्रों की पहचान
  choice: मुख्य पाठ में ‘भविष्यद्वक्ताओं के शिष्य’
  alternative: ‘भविष्यद्वक्ताओं के पुत्र’ अथवा ‘भविष्यद्वक्ताओं का समुदाय’
  rationale: यहाँ संबंध जैविक पुत्रत्व से अधिक किसी भविष्यद्वक्ताई समुदाय में सदस्यता या प्रशिक्षण का है। फिर भी समुदाय की सटीक संरचना स्पष्ट नहीं है, इसलिए पादटिप्पणी मूल मुहावरे और वैकल्पिक समझ को दर्ज करती है।
- issue: לְפָנֶיךָ में एलीशा के साथ संबंध
  choice: ‘आपके सामने’
  alternative: ‘आपकी देखरेख में’ अथवा ‘आपकी उपस्थिति में’
  rationale: इब्रानी वाक्यांश शारीरिक उपस्थिति और अधिकार/देखरेख दोनों का संकेत दे सकता है। मुख्य पाठ अधिक औपचारिक और खुला अनुवाद रखता है; पादटिप्पणी संभावित आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, सम्मानपूर्ण और गरिमामय शैली रखी गई है। ‘एलीशा’ के लिए आदरसूचक बहुवचन (‘दीजिए’, ‘आपके’) प्रयुक्त है। मूल की संभावित अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
