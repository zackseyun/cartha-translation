id: 2KI.6.21
reference: 2 Kings 6:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֶֽלֶךְ יִשְׂרָאֵל֙ אֶל אֱלִישָׁ֔ע כִּ/רְאֹת֖/וֹ אוֹתָ֑/ם הַ/אַכֶּ֥ה אַכֶּ֖ה אָבִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
translation:
  language: hi
  text: तब इस्राएल के राजा ने उन्हें देखकर एलीशा से कहा, “क्या मैं इन्हें मार डालूँ? क्या मैं इन्हें मार डालूँ[a], हे मेरे पिता[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में एक ही क्रिया के दो रूप साथ रखकर प्रश्न पर बल दिया गया है; हिन्दी में इसे प्रश्न दोहराकर व्यक्त किया गया है।
    reason: lexical_note
  - marker: b
    text: “मेरे पिता” एलीशा के लिए आदर का संबोधन है; इसका अर्थ यह नहीं कि वह राजा के जन्मदाता थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: यह संबंधवाचक पदबंध का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: אֶל אֱלִישָׁע
  choice: एलीशा से
  rationale: אֶל यहाँ संबोधन की दिशा बताता है। मूल में ‘नबी’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: כִּרְאֹתוֹ אֹתָם
  choice: उन्हें देखकर
  rationale: כְּ के साथ infinitive construct समयसूचक परिस्थिति व्यक्त करता है। प्रसंग में देखने वाला राजा है; संक्षिप्त हिन्दी कृदंत इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַאַכֶּה אַכֶּה
  choice: क्या मैं इन्हें मार डालूँ? क्या मैं इन्हें मार डालूँ?
  rationale: एक ही मूल की क्रिया के finite रूप और infinitive absolute का मेल प्रश्न को प्रबल बनाता है। हिन्दी में पूरे प्रश्न की पुनरावृत्ति उस आग्रह और तीव्रता को स्पष्ट रखती है; ‘मार डालूँ’ युद्ध-संदर्भ में घातक आशय व्यक्त करता है।
- source_word: אָבִי
  choice: हे मेरे पिता
  rationale: शाब्दिक पारिवारिक संबोधन को बनाए रखते हुए ‘हे’ इसे हिन्दी में स्पष्ट प्रत्यक्ष संबोधन बनाता है। यहाँ इसका प्रयोग सम्मानसूचक है।
theological_decisions:
- issue: एलीशा के लिए सम्मानसूचक संबोधन
  choice: אָבִי का अनुवाद ‘हे मेरे पिता’ किया गया है।
  alternative: ‘हे मेरे स्वामी’ या ‘महोदय’
  rationale: मूल इब्रानी में सचमुच ‘मेरे पिता’ है। यद्यपि यह जैविक पितृत्व के बजाय आदर का संबोधन है, पारिवारिक रूपक को बनाए रखना पाठ की अपनी भाषा और संबंधगत अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘मार डालूँ’ सैन्य प्रसंग की घातक भावना स्पष्ट करता है, जबकि प्रश्न की पुनरावृत्ति राजा की तीव्र उत्सुकता और आग्रह बनाए रखती है।
