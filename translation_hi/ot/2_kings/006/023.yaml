  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
translation:
  language: hi
  text: तब उसने उनके लिए एक बड़ा भोज तैयार किया[a]। उन्होंने खाया-पिया। फिर उसने उन्हें विदा कर दिया, और वे अपने स्वामी[b] के पास चले गए। अराम[c] के छापामार दल फिर इस्राएल देश में नहीं आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक बड़ी दावत दी।” इब्रानी में क्रिया और उसी मूल की संज्ञा को साथ रखकर भरपूर भोजन तैयार करने की बात कही गई है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने प्रभु के पास।” यहाँ संभवतः अराम का राजा अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: ‘अराम’ इब्रानी नाम है, जिसका पुराने अनुवादों में प्रायः ‘सीरिया’ अनुवाद किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  choice: एक बड़ा भोज तैयार किया
  rationale: क्रिया כרה और सजातीय संज्ञा כֵּרָה का मेल पर्याप्त भोजन या भोज तैयार करने का मुहावरा है; यह अनुवाद גְדוֹלָה के बल को भी बनाए रखता है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने खाया-पिया
  rationale: दोनों समन्वित क्रियाओं का यह स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: וַיְשַׁלְּחֵם
  choice: उसने उन्हें विदा कर दिया
  rationale: संदर्भ में बंदी अरामियों को छोड़कर भेज देने का भाव है; ‘विदा कर दिया’ शिष्ट आतिथ्य और प्रस्थान दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֲדֹנֵיהֶם
  choice: अपने स्वामी के पास
  rationale: रूपात्मक प्रत्यय बहुवचन है, पर אֲדֹנֵי सम्मानसूचक/पदसूचक एकवचन के अर्थ में अराम के राजा की ओर संकेत कर सकता है। ‘स्वामी’ मूल अभिव्यक्ति की पदगत व्यापकता बनाए रखता है।
- source_word: וְלֹא יָסְפוּ עוֹד
  choice: फिर ... नहीं आए
  rationale: יסף और עוד का मुहावरा किसी कार्य के दोबारा न होने को व्यक्त करता है; हिन्दी में ‘फिर ... नहीं’ यही अर्थ सहजता से देता है।
- source_word: גְּדוּדֵי אֲרָם
  choice: अराम के छापामार दल
  rationale: גְּדוּדֵי यहाँ नियमित सेना के बजाय लूटमार या छापे के लिए आने वाले दलों को दर्शाता है।
- source_word: לָבוֹא בְּאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश में नहीं आए
  rationale: בוא के साथ ב क्षेत्र में प्रवेश की गति बताता है; वर्तमान हिन्दी में ‘देश में आए’ उस गति और भूभाग दोनों को स्पष्ट करता है।
theological_decisions:
- issue: אֲדֹנֵיהֶם का वचन और संदर्भित व्यक्ति
  choice: एकवचन ‘अपने स्वामी’
  alternative: ‘अपने स्वामियों’ या ‘अपने प्रभु’
  rationale: निकटवर्ती कथा-संदर्भ में अराम का राजा अभिप्रेत जान पड़ता है, जबकि ‘स्वामी’ मूल पद की सांसारिक सत्ता का भाव रखता है और अनावश्यक ईश्वरीय अर्थ नहीं जोड़ता।
