  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘छापामार दल’ नियमित सेना और छिटपुट आक्रमणकारी टुकड़ियों के बीच मूल भेद को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
