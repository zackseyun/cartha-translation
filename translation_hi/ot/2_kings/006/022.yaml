source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
translation:
  language: hi
  text: परन्तु उसने कहा[a], “उन्हें मत मारो। क्या तुम उन लोगों को मार डालते जिन्हें तुमने अपनी तलवार और अपने धनुष से बन्दी बनाया होता? उनके सामने रोटी और पानी रखो[b], ताकि वे खाएँ-पीएँ और अपने स्वामियों के पास चले जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अगला वाक्य हिब्रू में आलंकारिक प्रश्न है, जो उन्हें न मारने की आज्ञा पर बल देता है: “क्या तुम उन्हें मार डालते जिन्हें तुमने अपनी तलवार और अपने धनुष से बन्दी बनाया होता?”'
    reason: alternative_reading
  - marker: b
    text: “रोटी और पानी” मूल पाठ के स्पष्ट शब्द हैं; यह अभिव्यक्ति सामान्य भोजन और आवश्यक प्रबन्ध का बोध भी करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכֶּה / מַכֶּה
  choice: मारो / मार डालते
  rationale: नכה का अर्थ प्रसंगानुसार प्रहार करना या मार डालना हो सकता है। यहाँ राजा बन्दियों को प्राणदण्ड देना चाहता है; इसलिए हिन्दी में निषेध के लिए स्वाभाविक ‘मत मारो’ और आलंकारिक प्रश्न में स्पष्ट ‘मार डालते’ घातक आशय को व्यक्त करते हैं।
- source_word: הַאֲשֶׁר שָׁבִיתָ
  choice: जिन्हें तुमने ... बन्दी बनाया होता
  rationale: שבה सैनिक प्रसंग में बन्दी बनाने को दर्शाता है। संभावनार्थक ‘होता’ इस तथ्य को उभारता है कि ये लोग राजा द्वारा सामान्य युद्ध में पकड़े गए बन्दी नहीं थे।
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  choice: अपनी तलवार और अपने धनुष से
  rationale: दोनों हथियारों का स्पष्ट उल्लेख मूल तर्क का अंग है और राजा की अपनी सैन्य विजय की ओर संकेत करता है।
- source_word: שִׂים
  choice: रखो
  rationale: सीधी आज्ञा के लिए ‘रखो’ वर्तमान हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: לֶחֶם וָמַיִם
  choice: रोटी और पानी
  rationale: मूल पाठ दोनों वस्तुओं को स्पष्ट रूप से नाम देता है। ‘रोटी’ व्यापक भोजन का संकेत भी दे सकती है, पर ठोस मूल शब्दावली को बनाए रखती है।
- source_word: לִפְנֵיהֶם
  choice: उनके सामने
  rationale: भोजन परोसने के अर्थ में यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וְיֹאכְלוּ וְיִשְׁתּוּ וְיֵלְכוּ
  choice: ताकि वे खाएँ-पीएँ और ... लौट जाएँ
  rationale: आज्ञा के बाद आने वाली क्रियाएँ उद्देश्य अथवा अपेक्षित परिणाम व्यक्त करती हैं। ‘लौट जाएँ’ गन्तव्य की ओर विदा किए जाने को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: אֶל אֲדֹנֵיהֶם
  choice: अपने स्वामी के पास
  rationale: स्वरूप אֲדֹנֵיהֶם में बहुवचन-सदृश आदरसूचक संज्ञा के साथ बहुवचन प्रत्यय है, जिसे सन्दर्भ में सामूहिक रूप से उनके प्रभु/अधिकारी के रूप में समझा जा सकता है। निकटवर्ती कथा में अराम के राजा की ओर वापसी के कारण एकवचन ‘स्वामी’ स्वाभाविक है, जबकि व्याकरणिक रूप की जटिलता को निर्णय-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: एलीशा के प्रश्न का बल
  choice: 'प्रश्न आलंकारिक है: राजा को इन लोगों को नहीं मारना चाहिए, विशेषकर इसलिए कि उसने उन्हें अपने युद्ध-कौशल से बन्दी नहीं बनाया था।'
  alternative: इसे सीधा कथन मानना, अथवा इसे केवल उन बन्दियों तक सीमित नियम समझना जिन्हें राजा ने स्वयं युद्ध में पकड़ा हो।
  rationale: निषेध के तुरन्त बाद आया हिब्रू प्रश्न निषेध को पुष्ट करता है। संभावनार्थक हिन्दी उस तुलना को बनाए रखती है, बिना इस पद से कोई व्यापक और अनकहा युद्ध-विधान निकालने के।
- issue: אֲדֹנֵיהֶם की संख्या और सन्दर्भ
  choice: अपने स्वामी के पास
  alternative: अपने स्वामियों के पास / अपने अधिकारियों के पास
  rationale: हिब्रू रूप में बहुवचन प्रत्यय है और उसका शाब्दिक रूप ‘उनके स्वामियों’ हो सकता है; फिर भी सैन्य दल के साझा अधिपति, अराम के राजा, की ओर वापसी कथानक में सम्भावित है। मुख्य पाठ सहज एकवचन रखता है, पर वास्तविक भाषिक अस्पष्टता को यहाँ दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘परन्तु’, ‘बन्दी’ और ‘स्वामी’ बाइबिलीय प्रसंग की गरिमा रखते हैं, जबकि वाक्य-विन्यास समकालीन है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
