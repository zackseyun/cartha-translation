  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
translation:
  language: hi
  text: “कृपया हमें यरदन तक जाने दीजिए; हममें से हर एक वहाँ से एक शहतीर ले ले, और हम वहाँ अपने रहने के लिए एक जगह बनाएँ।” उसने कहा, “जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  choice: कृपया हमें ... जाने दीजिए
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव और נָא मिलकर विनम्र अनुरोध व्यक्त करते हैं; हिंदी में यह प्रयोग उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד הַיַּרְדֵּן
  choice: यरदन तक
  rationale: עַד का अर्थ यहाँ ‘तक’ या ‘के पास तक’ है; ‘यरदन’ नदी के लिए प्रचलित बाइबलीय नाम है।
- source_word: וְנִקְחָה מִשָּׁם אִישׁ קוֹרָה אֶחָת
  choice: हममें से हर एक वहाँ से एक लट्ठा ले आए
  rationale: אִישׁ ... אֶחָת का प्रयोग वितरणात्मक है—समूह का प्रत्येक व्यक्ति एक लकड़ी लाए। קוֹרָה निर्माण में काम आने वाली बड़ी लकड़ी है; इस प्रसंग में ‘लट्ठा’ साधारण पाठक के लिए स्वाभाविक है और काटकर लाई जाने वाली इमारती लकड़ी का बोध कराता है।
- source_word: וְנַעֲשֶׂה לָּנוּ שָׁם מָקוֹם
  choice: फिर हम वहाँ अपने ... लिए एक जगह बनाएँ
  rationale: עשה के सामान्य अर्थ ‘बनाना’ को रखा गया है और לָנוּ का हितार्थ ‘अपने ... लिए’ से व्यक्त हुआ है।
- source_word: לָשֶׁבֶת שָׁם
  choice: वहाँ अपने रहने के लिए
  rationale: ישב यहाँ बैठने के बजाय किसी स्थान पर रहने का अर्थ देता है; हिंदी में ‘रहने के लिए’ स्पष्ट और वर्तमान प्रयोग है।
- source_word: וַיֹּאמֶר לֵכוּ
  choice: उसने कहा, “जाओ।”
  rationale: संक्षिप्त आज्ञार्थक उत्तर को बिना अतिरिक्त व्याख्या के उसी संक्षिप्तता में रखा गया है।
