base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
translation:
  language: hi
  text: उसने वहाँ घोड़े, रथ और एक बड़ी सेना भेजी। वे रात को आए और नगर को चारों ओर से घेर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: उसने...भेजी
  rationale: שׁלח के क्रमिक कथात्मक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; संयुक्त कर्मों के कारण वाक्य-विन्यास हिन्दी के अनुरूप रखा गया है।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: यह गंतव्य बताने वाला दिशासूचक क्रियाविशेषण है; स्थान पिछले पद के संदर्भ से स्पष्ट है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: मूल संज्ञा का प्रत्यक्ष अर्थ 'घोड़े' है; सैन्य संदर्भ के बावजूद इसे 'घुड़सवार' बनाकर अर्थ नहीं बढ़ाया गया।
- source_word: וְרֶכֶב
  choice: रथ
  rationale: רֶכֶב यहाँ रथों अथवा रथ-दल को सूचित कर सकता है; 'रथ' ठोस सैन्य बिंब और मूल की संक्षिप्तता बनाए रखता है।
- source_word: וְחַיִל כָּבֵד
  choice: और एक बड़ी सेना
  rationale: सैन्य संदर्भ में חַיִל का अर्थ सेना/सैन्य बल है और כָּבֵד का शाब्दिक अर्थ 'भारी' यहाँ पर्याप्त आकार या संख्या का मुहावरा है; 'बड़ी सेना' आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: וַיָּבֹאוּ לַיְלָה
  choice: वे रात को आए
  rationale: रात्रिकालीन आगमन को सरल, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּקִּפוּ עַל הָעִיר
  choice: और नगर को चारों ओर से घेर लिया
  rationale: क्रिया का अर्थ नगर को घेरना है; 'चारों ओर से' परिधि बनाकर घेरने का भाव स्पष्ट करता है।
