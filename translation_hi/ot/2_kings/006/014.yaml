translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। 'नगर' बाइबिलीय गद्य में परिचित है, जबकि वाक्य-संरचना साधारण पाठक के लिए स्पष्ट रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि 'बड़ी सेना' इब्रानी मुहावरे का पर्याप्त और स्वाभाविक संप्रेषण है।
