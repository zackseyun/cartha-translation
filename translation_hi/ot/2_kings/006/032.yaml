base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
translation:
  language: hi
  text: एलीशा अपने घर में बैठा था और बुज़ुर्ग उसके साथ बैठे थे। राजा ने अपने आगे एक आदमी भेजा। पर उस दूत[b] के एलीशा के पास पहुँचने से पहले ही एलीशा ने बुज़ुर्गों से कहा, “क्या तुम देख रहे हो कि इस हत्यारे के बेटे ने मेरा सिर काट डालने[a] के लिए आदमी भेजा है? देखो, जब दूत आए, तो द्वार बंद कर देना और उसे द्वार पर ही दबाकर रोके रखना। क्या उसके स्वामी के पैरों की आहट उसके पीछे नहीं सुनाई दे रही है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मेरा सिर हटा देने” है; यहाँ इसका अर्थ सिर काटकर मार डालना है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “दूत” से आशय राजा का भेजा हुआ मनुष्य है, स्वर्गदूत नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  choice: बैठा था / बैठे थे
  rationale: इब्रानी कृदंत चल रही अवस्था का दृश्य प्रस्तुत करते हैं; हिन्दी में अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּשְׁלַח אִישׁ מִלְּפָנָיו
  choice: राजा ने अपने आगे एक आदमी भेजा
  rationale: पूर्ववर्ती प्रसंग से कर्ता राजा है। מִלְּפָנָיו यहाँ उस आदमी को राजा के आगे भेजे जाने का स्थानिक-कालिक भाव देता है।
- source_word: הַמַּלְאָךְ
  choice: दूत
  rationale: राजदरबार के इस प्रसंग में यह मनुष्य के लिए प्रयुक्त है, स्वर्गदूत के लिए नहीं।
- source_word: הֲרְאִיתֶם
  choice: क्या तुम देख रहे हो
  rationale: यह तत्काल परिस्थिति को पहचानने के लिए किया गया आलंकारिक प्रश्न है।
- source_word: בֶּן הַמְרַצֵּחַ הַזֶּה
  choice: इस हत्यारे के बेटे
  rationale: यह राजा के लिए तिरस्कारपूर्ण संबोधन है और मूल के ‘हत्यारे का बेटा’ रूप को बनाए रखता है।
- source_word: לְהָסִיר אֶת רֹאשִׁי
  choice: मेरा सिर काट डालने
  rationale: मूल का शाब्दिक अर्थ ‘मेरा सिर हटा देने’ है, पर इस संदर्भ में यह सिर काटकर मार डालने का मुहावरा है; हिन्दी में आशय स्पष्ट रखा गया है।
- source_word: סִגְרוּ הַדֶּלֶת
  choice: द्वार बंद कर देना
  rationale: आदेश की तात्कालिकता और रक्षात्मक कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  choice: उसे द्वार पर ही दबाकर रोके रखना
  rationale: לחץ यहाँ दूत को द्वार पर दबाकर या रोककर भीतर प्रवेश न करने देने का भाव रखता है।
- source_word: הֲלוֹא קוֹל רַגְלֵי אֲדֹנָיו אַחֲרָיו
  choice: क्या उसके स्वामी के पैरों की आहट उसके पीछे नहीं आ रही है?
  rationale: मूल के आलंकारिक प्रश्न और राजा के दूत के पीछे निकट आने का संकेत दोनों सुरक्षित हैं।
theological_decisions:
- issue: וַיִּשְׁלַח का अप्रकट कर्ता
  choice: राजा ने अपने आगे एक आदमी भेजा
  alternative: उसने अपने आगे एक आदमी भेजा
  rationale: निकटवर्ती प्रसंग कर्ता को इस्राएल के राजा के रूप में पहचानता है; हिन्दी में उसे स्पष्ट करने से अनावश्यक सर्वनाम-संदेह दूर होता है।
- issue: וְהוּא אָמַר में बोलने वाले की पहचान
  choice: एलीशा ने पुरनियों से कहा
  alternative: उसने पुरनियों से कहा
  rationale: वाक्य-विन्यास और आगे का प्रथम पुरुष ‘मेरा सिर’ बोलने वाले को एलीशा ठहराते हैं; नाम दोहराना हिन्दी में संदर्भ स्पष्ट करता है।
- issue: בֶּן הַמְרַצֵּחַ का आशय
  choice: इस हत्यारे के बेटे
  alternative: इस हत्यारे राजा ने
  rationale: मूल का वंश-सूचक और अपमानजनक रूप बनाए रखा गया है; उसे केवल स्वयं राजा के लिए ‘हत्यारा’ बनाकर धर्मवैचारिक तनाव को समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘पुरनिये’ बाइबिलीय सामाजिक पद को संक्षेप में व्यक्त करता है; ‘द्वार’ और ‘आहट’ कथा की गंभीरता बनाए रखते हैं। मूल में जहाँ सर्वनाम-संदेह हिन्दी में भ्रम पैदा कर सकता था, वहाँ ‘राजा’ और ‘एलीशा’ स्पष्ट किए गए हैं।
