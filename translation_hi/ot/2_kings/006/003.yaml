lexical_decisions:
- source_word: הָאֶחָד
  choice: उनमें से एक
  rationale: इब्रानी में शाब्दिक अर्थ ‘वह एक’ है, जो प्रसंग में समूह के किसी एक सदस्य को सूचित करता है; हिन्दी में ‘उनमें से एक’ स्पष्ट और स्वाभाविक है।
- source_word: הוֹאֶל נָא
  choice: कृपया ... तैयार हो जाइए
  rationale: यह विनम्र अनुरोध सहमति अथवा तत्परता व्यक्त करने को कहता है। ‘कृपया’ और ‘तैयार हो जाइए’ मिलकर विनय तथा इच्छापूर्वक मानने के भाव को बनाए रखते हैं।
- source_word: וְלֵךְ
  choice: चलने
  rationale: यह הוֹאֶל के साथ अनुरोध की विषयवस्तु बताता है। हिन्दी में ‘तैयार हो जाइए’ के साथ क्रियार्थक ‘चलने’ स्वाभाविक है और गति के मूल अर्थ को रखता है।
- source_word: אֶת עֲבָדֶיךָ
  choice: अपने सेवकों के साथ
  rationale: यहाँ אֶת साथ होने का संबंध प्रकट करता है। עֲבָדֶיךָ संबोधित भविष्यद्वक्ता के अनुयायियों द्वारा अपने लिए प्रयुक्त आदरसूचक अभिव्यक्ति है; ‘सेवकों’ प्रसंगानुकूल है।
- source_word: אֲנִי אֵלֵךְ
  choice: मैं चलूँगा
  rationale: स्पष्ट सर्वनाम में हल्का बल है; ‘मैं चलूँगा’ हिन्दी में स्वाभाविक उत्तर है और उस बल को पर्याप्त रूप से व्यक्त करता है।
