  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
translation:
  language: hi
  text: तब इस्राएल के राजा ने उस स्थान पर भेजा, जिसके बारे में परमेश्वर के जन ने उसे बताया और चेतावनी दी थी; और वह वहाँ सतर्क रहा—ऐसा केवल एक-दो बार नहीं हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: लोगों को भेजा
  rationale: मूल क्रिया का अर्थ केवल ‘भेजा’ है और उसका कर्म संदर्भ में निहित है। आधुनिक हिन्दी में ‘स्थान पर भेजा’ अधूरा लगता है; सैन्य प्रसंग के अनुसार ‘लोगों को’ न्यूनतम स्पष्टता देता है।
- source_word: הַמָּקוֹם
  choice: उस स्थान
  rationale: निश्चित और पहले बताए गए स्थान की ओर संकेत करने के लिए स्वाभाविक हिन्दी।
- source_word: אֲשֶׁר אָמַר לוֹ אִישׁ הָאֱלֹהִים
  choice: जिसके विषय में परमेश्वर के जन ने उसे बताया
  rationale: सम्बन्धवाचक रचना और राजा को पहले दी गई सूचना, दोनों सुरक्षित रहते हैं; पारंपरिक उपाधि ‘परमेश्वर का जन’ को बनाए रखा गया है।
- source_word: וְהִזְהִירֹה
  choice: सावधान किया था
  rationale: हिफ़ील रूप यहाँ चेतावनी देने अथवा सावधान करने का भाव रखता है; हिन्दी कथाप्रवाह में पूर्वकालिकता स्पष्ट की गई है।
- source_word: וְנִשְׁמַר שָׁם
  choice: राजा वहाँ सतर्क रहा
  rationale: निफ़ाल का आत्मरक्षात्मक भाव ‘सतर्क रहा’ से स्वाभाविक ढंग से व्यक्त होता है, बिना यह निश्चित किए कि उसने कौन-से ठोस उपाय किए।
- source_word: לֹא אַחַת וְלֹא שְׁתָּיִם
  choice: ऐसा केवल एक-दो बार नहीं हुआ
  rationale: यह इब्रानी मुहावरा बार-बार घटित होने का संकेत देता है; हिन्दी अभिव्यक्ति उसके शब्दचित्र और मुहावरेदार बल को बनाए रखती है।
