base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/030.yaml
  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
translation:
  language: hi
  text: जब राजा ने उस स्त्री की बातें सुनीं, तो शहरपनाह पर चलते हुए उसने अपने वस्त्र फाड़ डाले। लोगों ने देखा कि उसके शरीर पर, वस्त्रों के नीचे[a], टाट था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “भीतर से” या “भीतर” है; अर्थात टाट उसके बाहरी वस्त्रों के नीचे पहना हुआ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: जब ... सुनीं
  rationale: כ के साथ infinitive construct समयसूचक उपवाक्य बनाता है; ‘जब राजा ने ... सुनीं’ स्वाभाविक हिन्दी में घटनाक्रम को सुरक्षित रखता है।
- source_word: דִּבְרֵי הָאִשָּׁה
  choice: उस स्त्री की बातें
  rationale: דְּבָרִים यहाँ स्त्री के कथन को दर्शाता है; ‘बातें’ आधुनिक हिन्दी में ‘शब्दों’ की अपेक्षा अधिक स्वाभाविक है और बहुवचन को बनाए रखता है।
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: उसने अपने वस्त्र फाड़ डाले
  rationale: यह शोक या विक्षोभ की प्रचलित बाइबलीय क्रिया है; ‘वस्त्र’ गरिमापूर्ण और स्पष्ट है, जबकि ‘फाड़ डाले’ क्रिया की पूर्णता और तीव्रता व्यक्त करता है।
- source_word: וְהוּא עֹבֵר עַל־הַחֹמָה
  choice: शहरपनाह पर चलते हुए
  rationale: circumstantial participial clause राजा की उसी समय की गतिविधि और स्थान बताता है। חוֹמָה नगर की रक्षात्मक दीवार है, इसलिए ‘शहरपनाह’ संदर्भानुकूल है।
- source_word: וַיַּרְא הָעָם
  choice: तब लोगों ने देखा
  rationale: רָאָה का सीधा अर्थ ‘देखना’ है। ‘तब’ हिन्दी में अगली क्रिया को सहजता से जोड़ता है, बिना स्रोत में कोई नई कारणात्मकता जोड़े।
- source_word: וְהִנֵּה
  choice: कि
  rationale: הִנֵּה आश्चर्यजनक दृश्य की ओर ध्यान खींचता है। हिन्दी में ‘लोगों ने देखा कि...’ उसी प्रकटीकरण को स्वाभाविक कथात्मक ढंग से व्यक्त करता है; अलग से ‘देखो’ कहना यहाँ कृत्रिम होता।
- source_word: הַשַּׂק
  choice: टाट
  rationale: שַׂק शोक में पहने जाने वाले खुरदरे पदार्थ या परिधान को सूचित करता है; ‘टाट’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और समझने योग्य समतुल्य है।
- source_word: עַל־בְּשָׂרוֹ
  choice: उसके शरीर पर
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है, पर यहाँ वस्त्र के नीचे का शरीर अभिप्रेत है; ‘शरीर पर’ स्वाभाविक और स्पष्ट है।
- source_word: מִבָּיִת
  choice: भीतर की ओर
  rationale: शाब्दिक अर्थ ‘भीतर से/भीतर की ओर’ है। मुख्य पाठ स्रोत की स्थानगत अभिव्यक्ति को रखता है और पादटिप्पणी संदर्भगत अर्थ—बाहरी वस्त्रों के नीचे पहनना—स्पष्ट करती है।
