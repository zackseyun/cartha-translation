  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
translation:
  language: hi
  text: हमने मेरे बेटे को उबालकर उसे खा लिया।[a] फिर अगले दिन मैंने उससे कहा, ‘अपने बेटे को दे दे, ताकि हम उसे खाएँ।’[b] लेकिन उसने अपने बेटे को छिपा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे बेटे को पकाकर उसे खा लिया।’
    reason: lexical_alternative
  - marker: b
    text: या ‘और हम उसे खाएँगे।’ इब्रानी रूप को सामान्य भविष्यकाल के रूप में भी समझा जा सकता है, यद्यपि ‘अपने बेटे को दे दे’ के बाद प्रसंग उद्देश्य या परिणाम का भाव सुझाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  choice: हमने ... उबालकर
  rationale: בשׁל यहाँ भोजन को उबालकर पकाने का ठोस अर्थ देता है; यह घेराबंदी की भयावहता को बिना नरम किए व्यक्त करता है।
- source_word: בְּנִי / בְּנֵךְ / בְּנָהּ
  choice: मेरे बेटे / अपना बेटा / अपने बेटे
  rationale: בן का अर्थ यहाँ विशेष रूप से ‘बेटा’ है; प्रत्येक संबंधवाचक प्रत्यय को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: וַנֹּאכְלֵהוּ
  choice: खा लिया
  rationale: אכל का सीधा अर्थ ‘खाना’ है। संयुक्त क्रिया ‘खा लिया’ पूर्ण हुई घटना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है; बेटे का संदर्भ स्पष्ट होने से अलग सर्वनाम आवश्यक नहीं है।
- source_word: וָאֹמַר אֵלֶיהָ
  choice: फिर ... मैंने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘फिर’ घटनाक्रम को सहज हिन्दी में दिखाता है।
- source_word: בַּיּוֹם הָאַחֵר
  choice: अगले दिन
  rationale: यह पदबंध ठीक अगला दिन बताता है; ‘अगले दिन’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: תְּנִי
  choice: दे दे
  rationale: यह स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘दे दे’ प्रत्यक्ष संबोधन और माँग की कठोर तात्कालिकता को सामान्य हिन्दी में व्यक्त करता है।
- source_word: וְנֹאכְלֶנּוּ
  choice: ताकि हम उसे खाएँ
  rationale: आज्ञा के बाद आया संयोजित अपूर्ण रूप उद्देश्य/परिणाम का भाव दे सकता है; हिन्दी में ‘ताकि’ इस संबंध को स्पष्ट रखते हुए भविष्यसूचक विकल्प को पादटिप्पणी में सुरक्षित करता है।
- source_word: וַתַּחְבִּא
  choice: लेकिन उसने ... छिपा दिया
  rationale: मूल वाव सामान्यतः ‘और’ है, पर प्रसंग में उसका काम अपेक्षित पालन के विपरीत क्रिया दिखाना है; ‘लेकिन’ उस अंतर्विरोध को स्वाभाविक रूप से व्यक्त करता है।
