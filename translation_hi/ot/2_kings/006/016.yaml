  edition: WLC
  text: וַ/יֹּ֖אמֶר אַל תִּירָ֑א כִּ֤י רַבִּים֙ אֲשֶׁ֣ר אִתָּ֔/נוּ מֵ/אֲשֶׁ֖ר אוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/016.yaml
  text: He said[a], “Do not be afraid, for those who are with us are more than those who are with them.”
translation:
  language: hi
  text: उसने कहा, “मत डर, क्योंकि जो हमारे साथ हैं, वे उन लोगों से अधिक हैं जो उनके साथ हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। आधुनिक हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं; ‘उसने कहा’ क्रिया और कथात्मक प्रवाह दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। एक पुरुष से सीधे संबोधन में ‘मत डर’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי न डरने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस कारणात्मक संबंध को स्पष्ट करता है।
- source_word: רַבִּים
  choice: अधिक हैं
  rationale: מֵאֲשֶׁר के साथ רַבִּים तुलनात्मक अर्थ रखता है। इसलिए केवल ‘बहुत हैं’ के बजाय ‘अधिक हैं’ तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אִתָּנוּ
  choice: जो हमारे साथ हैं
  rationale: संबंधवाचक अव्यय और पूर्वसर्गीय पद यहाँ समूह को सूचित करते हैं; यह हिन्दी रूप मूल संरचना और अस्पष्ट पहचान दोनों को सुरक्षित रखता है।
- source_word: מֵאֲשֶׁר אוֹתָם
  choice: उन लोगों से ... जो उनके साथ हैं
  rationale: यह तुलनात्मक और समानांतर अर्थ को स्पष्ट हिन्दी में पूरा करता है। मूल पाठ में निहित ‘साथ’ को दूसरे पक्ष में दोहराने से तुलना सहज और स्पष्ट होती है।
theological_decisions:
- issue: ‘हमारे साथ’ उपस्थित अधिक बड़ी शक्ति की पहचान
  choice: मुख्य पाठ में पहचान अनिर्दिष्ट रखी गई है।
  alternative: संदर्भ के आधार पर इसे स्वर्गीय सेना या दूतों के रूप में स्पष्ट करना।
  rationale: इस पद का इब्रानी पाठ स्वयं उस शक्ति का नाम नहीं बताता, यद्यपि आगे का संदर्भ उसे प्रकट करता है। अनुवाद मूल पाठ की संयमित अभिव्यक्ति और कथात्मक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा संबोधन होने के कारण ‘मत डर’ का एकवचन रूप रखा गया है। भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है।
