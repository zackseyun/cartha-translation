  yaml_path: translation/ot/2_kings/006/012.yaml
  text: But one of his servants said, “No, my lord the king. Rather, Elisha the prophet, who is in Israel, tells the king of Israel the words that you speak in your bedroom.”
translation:
  language: hi
  text: पर उसके सेवकों में से एक ने कहा, “नहीं, मेरे स्वामी महाराज! बल्कि इस्राएल में रहने वाला भविष्यद्वक्ता एलीशा उन बातों को इस्राएल के राजा को बता देता है, जो आप अपने शयनकक्ष में कहते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹוא אֲדֹנִי הַמֶּלֶךְ
  choice: नहीं, मेरे स्वामी महाराज!
  rationale: राजा को किए गए आदरपूर्ण संबोधन और सेवक के स्पष्ट निषेध, दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: כִּי
  choice: बल्कि
  rationale: यहाँ यह पहले कथन का कारण मात्र नहीं, बल्कि राजा के अनुमान का सुधार प्रस्तुत करता है; इसलिए विरोध-सुधार का भाव रखा गया है।
- source_word: יַגִּיד
  choice: बता देता है
  rationale: हिब्रू अपूर्ण क्रिया यहाँ एलीशा की नियमित या सक्षम सूचना देने की क्रिया व्यक्त करती है; हिन्दी में यह प्रयोग उस भाव को सहज रूप से पहुँचाता है।
- source_word: בַּחֲדַר מִשְׁכָּבֶךָ
  choice: अपने शयनकक्ष में
  rationale: शाब्दिक अर्थ ‘तुम्हारे सोने के कमरे में’ है; ‘शयनकक्ष’ निजी कमरे का आशय गरिमापूर्ण और स्पष्ट हिन्दी में देता है।
theological_decisions:
- issue: एलीशा को गुप्त बातों का ज्ञान कैसे मिलता था
  choice: पद के अनुसार केवल यह कहा गया कि एलीशा राजा की निजी बातें बता देता है।
  alternative: स्पष्ट रूप से जोड़ना कि परमेश्वर उसे ये बातें प्रकट करते थे।
  rationale: इस पद में माध्यम स्पष्ट नहीं किया गया है; धार्मिक व्याख्या जोड़ने के बजाय मूल पाठ की अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय संबोधन आदरपूर्ण है, पर वाक्य सामान्य पाठक के लिए सहज रखा गया है। ‘रहनेवाला’ से אֲשֶׁר בְּיִשְׂרָאֵל का स्थानगत भाव स्वाभाविक ढंग से व्यक्त किया गया है।
