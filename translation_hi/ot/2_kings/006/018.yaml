  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
translation:
  language: hi
  text: जब वे उसके विरुद्ध नीचे आए, तब एलीशा ने याहवे से प्रार्थना की, “कृपया इस जाति को दृष्टि-भ्रम से आहत कर।” तब उसने एलीशा के वचन के अनुसार उन्हें दृष्टि-भ्रम से आहत किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  choice: जब वे उसकी ओर नीचे आए
  rationale: יָרַד का स्थान-सूचक अर्थ ‘नीचे आना’ और אֵלָיו का स्वाभाविक अर्थ ‘उसकी ओर’ रखा गया है। प्रसंग में यह शत्रुतापूर्ण बढ़ना है, पर मूल की दिशात्मक अभिव्यक्ति को बिना अधिक स्पष्ट किए सुरक्षित रखा गया है।
- source_word: וַיִּתְפַּלֵּל אֱלִישָׁע אֶל יְהוָה
  choice: एलीशा ने यहवे से प्रार्थना की
  rationale: הִתְפַּלֵּל का सामान्य अर्थ ‘प्रार्थना करना’ है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: הַךְ נָא
  choice: कृपया ... मार
  rationale: נכה के प्रहार/मारने के अर्थ और נָא की विनम्र प्रार्थनात्मक विनती, दोनों को संक्षिप्त हिंदी आज्ञार्थ में रखा गया है।
- source_word: הַגּוֹי הַזֶּה
  choice: इस दल को
  rationale: גּוֹי सामान्यतः ‘जाति/राष्ट्र/लोग’ है, पर यहाँ निकट आती अरामी सैन्य टुकड़ी अभिप्रेत है। आधुनिक हिंदी में ‘इस दल’ प्रसंग को स्वाभाविक रूप से व्यक्त करता है और पूरी जाति पर प्रहार का भ्रामक आभास घटाता है।
- source_word: בַּסַּנְוֵרִים
  choice: दृष्टि-भ्रम से
  rationale: दुर्लभ बहुवचन संज्ञा סַנְוֵרִים ईश्वर-प्रेरित ऐसी दृष्टि-बाधा बताती है जिसमें व्यक्ति ठीक से पहचान या दिशा ग्रहण नहीं कर पाता। आगे की कथा में सैनिक चलने-फिरने और एलीशा का अनुसरण करने में सक्षम हैं, इसलिए ‘अंधापन’ की अपेक्षा ‘दृष्टि-भ्रम’ अधिक सटीक है।
- source_word: וַיַּכֵּם
  choice: तब उसने ... उन्हें ... मारा
  rationale: एकवचन कर्ता प्रसंग से यहवे है। सर्वनाम मूल की संक्षिप्तता बनाए रखता है और नכה की पुनरावृत्ति को ‘मारा’ से सुरक्षित रखता है।
- source_word: כִּדְבַר אֱלִישָׁע
  choice: एलीशा के वचन के अनुसार
  rationale: דָּבָר को ‘वचन’ कहना हिब्रू मुहावरे और नबी की प्रार्थना के अनुरूप हुई ईश्वरीय कार्रवाई, दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से है; ‘यहवे’ उसका निकट आधुनिक लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: סַנְוֵרִים की प्रकृति
  choice: दृष्टि-भ्रम
  alternative: अंधापन
  rationale: शब्द वास्तविक, ईश्वर-प्रेरित दृष्टि-अक्षमता को दर्शाता है, किंतु आवश्यक नहीं कि पूर्ण या स्थायी अंधापन हो। ‘दृष्टि-भ्रम’ कथा की आगामी गतिविधि और शब्द की अस्पष्टता दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘दृष्टि-भ्रम’ दुर्लभ हिब्रू शब्द के प्रभाव को संक्षेप में व्यक्त करता है; ‘एलीशा के वचन के अनुसार’ मूल की औपचारिक भविष्यद्वाणी-संबंधी शैली बनाए रखता है।
