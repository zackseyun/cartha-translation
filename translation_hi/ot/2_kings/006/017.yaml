base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
translation:
  language: hi
  text: तब एलीशा ने प्रार्थना की और कहा, “हे याहवे[a], कृपा करके उसकी आँखें खोल, ताकि वह देख सके।” तब याहवे ने उस सेवक[b] की आँखें खोल दीं, और उसने देखा कि पहाड़ एलीशा के चारों ओर घोड़ों और अग्निमय रथों से भरा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का निजी नाम יהוה (YHWH) है। इसका लिप्यंतरण “यहोवा” भी किया जाता है।
    reason: alternative_reading
  - marker: b
    text: या “उस युवक”। इब्रानी נַעַר का अर्थ संदर्भ के अनुसार युवक अथवा सेवक/परिचारक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: हित्पएल रूप यहाँ परमेश्वर से प्रार्थना करने को दर्शाता है; आधुनिक हिन्दी कथा में यह स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
- source_word: פְּקַח נָא
  choice: कृपा करके ... खोल दे
  rationale: נָא यहाँ समयसूचक ‘अब’ से अधिक विनम्र निवेदन व्यक्त करता है; हिन्दी में ‘कृपा करके’ उसी भाव को स्वाभाविक रूप से रखता है।
- source_word: וְיִרְאֶה
  choice: ताकि यह देख सके
  rationale: आज्ञार्थक निवेदन के बाद प्रयोजन/परिणाम का संबंध स्पष्ट करता है।
- source_word: הַנַּעַר
  choice: सेवक
  rationale: נַעַר युवक अथवा परिचारक/सेवक हो सकता है। निकटवर्ती संदर्भ (पद 15) में यह एलीशा की सेवा करने वाला व्यक्ति है, इसलिए ‘सेवक’ अधिक संदर्भ-संगत है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וְהִנֵּה
  choice: देखा कि
  rationale: הִנֵּה दृश्य पर ध्यान खींचता और खोज का जीवंत भाव देता है। हिन्दी में ‘उसने देखा कि’ इसे स्वाभाविक रूप से समाहित करता है।
- source_word: הָהָר
  choice: पहाड़
  rationale: मानक अर्थ है और दोतान के चारों ओर के ऊँचे भूभाग के दृश्य के अनुकूल है।
- source_word: מָלֵא
  choice: से भरा हुआ था
  rationale: विधेय विशेषण ‘भरा हुआ’ को सहज हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: סוּסִים וְרֶכֶב אֵשׁ
  choice: अग्निमय घोड़ों और रथों
  rationale: इब्रानी संरचना में ‘आग’ कम-से-कम रथों को विशेषित करती है, पर ‘अग्निमय घोड़े और रथ’ संभव अर्थ है। मुख्य पाठ में पूरे युग्म को अग्निमय बताने वाली स्वाभाविक हिन्दी रखी गई है और संकीर्ण विकल्प पादटिप्पणी में दिया गया है।
- source_word: סְבִיבֹת אֱלִישָׁע
  choice: एलीशा के चारों ओर
  rationale: व्यापक रूप से घेरे होने का अर्थ सीधे और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी ईश्वरीय नाम सीधे उपस्थित है। हिन्दी पाठकों में स्थापित ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है; पादटिप्पणी स्वरूप की जानकारी देती है।
- issue: दर्शन का स्वरूप
  choice: आँखें खोले जाने पर सेवक ने अग्निमय घोड़ों और रथों को देखा
  alternative: शाब्दिक स्वर्गीय सेना; केवल प्रतीकात्मक दर्शन
  rationale: मूल पाठ दृश्य को वास्तविक रूप से देखने का दावा करता है, पर यह निर्धारित नहीं करता कि उसका तत्त्वमीमांसात्मक स्वरूप शारीरिक, दर्शनात्मक या स्वर्गदूतीय था। अनुवाद उस तनाव को अनिर्णीत रखता है।
- issue: אֵשׁ का विशेषण-संबंध
  choice: अग्निमय घोड़ों और रथों
  alternative: घोड़ों और अग्निमय रथों
  rationale: इब्रानी में אֵשׁ सीधे ‘रथ’ के बाद आता है और कम-से-कम उसे विशेषित करता है; फिर भी समन्वित युग्म पर उसका व्यापक प्रभाव संभव है। दोनों को पादटिप्पणी द्वारा सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल कथात्मक शैली अपनाई गई है। प्रार्थना में एकवचन निकट संबोधन (‘खोल दे’) रखा गया है। मुख्य पाठ में ‘सेवक’ संदर्भ-संगत है, जबकि נַעַר की आयु/भूमिका संबंधी अस्पष्टता पादटिप्पणी में दी गई है।
