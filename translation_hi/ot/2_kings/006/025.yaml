base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
translation:
  language: hi
  text: और सामरिया में भयंकर अकाल पड़ा था; और देखो, वे उसे घेरे हुए थे, यहाँ तक कि गधे का एक सिर अस्सी चाँदी के सिक्कों में और कबूतर की बीट[a] का एक चौथाई कब पाँच चाँदी के सिक्कों में बिकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कबूतरों की विष्ठा।’ कुछ व्याख्याकार इसे सचमुच कबूतर की बीट समझते हैं; दूसरे इसे अकाल के समय बेचे जाने वाले किसी सस्ते खाद्य पदार्थ या वनस्पति-उत्पाद का नाम मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  choice: भयंकर अकाल पड़ा था
  rationale: यह वाक्यांश नई परिस्थिति का वर्णन करता है। ‘भयंकर’ अकाल की तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: नगर के भीतर की स्थिति के लिए स्थानवाचक अर्थ को सीधे व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: उस समय
  rationale: הִנֵּה ध्यान खींचकर घेराबंदी की परिस्थिति सामने रखता है; यहाँ ‘उस समय’ हिन्दी में प्रसंग को स्वाभाविक रूप से जोड़ता है, यद्यपि विस्मय का बल कुछ हल्का हो जाता है।
- source_word: צָרִים עָלֶיהָ
  choice: उसे घेर लिया गया था
  rationale: चल रही घेराबंदी को सहज हिन्दी में व्यक्त करता है। कर्ता मूल पाठ में अनिर्दिष्ट बहुवचन है, इसलिए कर्मवाच्य किसी पक्ष की पहचान नहीं जोड़ता।
- source_word: עַד הֱיוֹת
  choice: यहाँ तक कि ... बिकती थी
  rationale: घेराबंदी और अकाल के उस चरम परिणाम को दिखाता है जहाँ वस्तुओं के दाम असाधारण हो गए थे।
- source_word: רֹאשׁ חֲמוֹר
  choice: गधे का एक सिर
  rationale: मूल की चौंकाने वाली और अकाल की भीषणता दर्शाने वाली ठोस छवि को सुरक्षित रखता है।
- source_word: בִּשְׁמֹנִים כֶּסֶף
  choice: अस्सी चाँदी के सिक्कों में
  rationale: मूल में मुद्रा की इकाई स्पष्ट नहीं है; ‘चाँदी के सिक्के’ मूल्य को समझने योग्य बनाता है और ‘शेकेल’ जोड़ने से बचता है।
- source_word: רֹבַע הַקַּב
  choice: चौथाई कब
  rationale: प्राचीन सूखे माप ‘कब’ को अनिश्चित आधुनिक माप में बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: חרי יונים
  choice: कबूतर की बीट
  rationale: वाक्यांश का प्रत्यक्ष शाब्दिक अर्थ यही है और यह अकाल की चरम दशा के अनुकूल है; वस्तु की पहचान विवादित होने के कारण पादटिप्पणी दी गई है।
- source_word: בַּחֲמִשָּׁה כָסֶף
  choice: पाँच चाँदी के सिक्कों में
  rationale: दूसरे मूल्य को पहले के समान स्पष्ट और संतुलित हिन्दी में व्यक्त करता है, बिना अनुल्लिखित मुद्रा-इकाई निश्चित किए।
theological_decisions:
- issue: חרי יונים की विवादित पहचान
  choice: मुख्य पाठ में ‘कबूतर की बीट’
  alternative: किसी सस्ते खाद्य पदार्थ या वनस्पति-उत्पाद का नाम
  rationale: शब्दों का सीधा अर्थ ‘कबूतर की बीट’ है, पर प्राचीन वस्तु की पहचान निश्चित नहीं है; इसलिए विकल्प को पादटिप्पणी में संरक्षित किया गया है, न कि मुख्य पाठ में निर्णायक रूप से अपनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। ‘बीट’ सामान्य पाठक के लिए स्पष्ट है; पादटिप्पणी में अधिक औपचारिक ‘विष्ठा’ भी दी गई है। प्राचीन माप ‘कब’ सुरक्षित रखा गया है और अनिश्चित मुद्रा-इकाई को ‘शेकेल’ नहीं बनाया गया।
