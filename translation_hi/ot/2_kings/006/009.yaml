  text: וַ/יִּשְׁלַ֞ח אִ֣ישׁ הָ/אֱלֹהִ֗ים אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ לֵ/אמֹ֔ר הִשָּׁ֕מֶר מֵ/עֲבֹ֖ר הַ/מָּק֣וֹם הַ/זֶּ֑ה כִּֽי שָׁ֖ם אֲרָ֥ם נְחִתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
translation:
  language: hi
  text: 'तब परमेश्वर के जन ने इस्राएल के राजा को यह संदेश भेजा: “सावधान रहना, इस स्थान से होकर मत जाना, क्योंकि अरामी वहाँ उतर रहे हैं[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नीचे आ रहे हैं।”
    reason: हिब्रू कृदंत נְחִתִּים को उतरने अथवा नीचे आने की गतिशील क्रिया के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: यह संदेश भेजा
  rationale: क्रिया का शाब्दिक अर्थ ‘भेजा’ है; प्रसंग में भेजी गई वस्तु चेतावनी का संदेश है। हिंदी में ‘संदेश भेजा’ स्वाभाविक है और निहित आशय को स्पष्ट करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: हिब्रू की स्थापित उपाधि को ‘नबी’ कहकर व्याख्यायित करने के बजाय उसी रूप में सुरक्षित रखा गया है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: राजकीय उपाधि और जाति-नाम का सीधा, स्वाभाविक हिंदी रूप।
- source_word: הִשָּׁמֶר מֵעֲבֹר
  choice: सावधान रहना, ... से होकर मत जाना
  rationale: आज्ञार्थक चेतावनी और מן के साथ आए निषेधात्मक आशय दोनों को आधुनिक, सहज हिंदी में व्यक्त करता है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: उस स्थान
  rationale: प्रत्यक्ष कथन में राजा के दृष्टिकोण से निर्दिष्ट स्थान के लिए ‘उस स्थान’ स्वाभाविक हिंदी है, यद्यपि हिब्रू में निकटवाची संकेत है।
- source_word: אֲרָם
  choice: अरामी
  rationale: सैन्य प्रसंग में स्थान-नाम अराम वहाँ के लोगों अथवा सेना को सूचित करता है; ‘अरामी’ अनैतिहासिक ‘सीरियाई’ से अधिक सटीक है।
- source_word: נְחִתִּים
  choice: उतर रहे हैं
  rationale: नחת का कृदंत रूप नीचे उतरने या आने की जारी गतिविधि बताता है; ‘उतर रहे हैं’ दिशा को अनावश्यक रूप से वक्ता की ओर निर्धारित नहीं करता।
theological_decisions: []
