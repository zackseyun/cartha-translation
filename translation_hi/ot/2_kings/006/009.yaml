  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर के जन’ जैसी मूल उपाधि सुरक्षित है; सैन्य गतिविधि को पाठ से अधिक विशिष्ट नहीं बनाया गया।
