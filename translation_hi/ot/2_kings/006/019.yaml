  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
translation:
  language: hi
  text: तब एलीशा ने उनसे कहा, “यह वह रास्ता नहीं है, और यह वह नगर भी नहीं है। मेरे पीछे चलो, और मैं तुम्हें उस आदमी के पास ले चलूँगा जिसे तुम ढूँढ़ रहे हो।” फिर वह उन्हें सामरिया ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדֶּרֶךְ
  choice: वह रास्ता
  rationale: דֶּרֶךְ का यहाँ अर्थ भौतिक मार्ग या रास्ता है। ‘वह रास्ता’ हिंदी में प्रसंगानुसार निश्चित लक्ष्य-मार्ग को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעִיר
  choice: वह नगर
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है। ‘वह नगर’ उस निश्चित नगर को सूचित करता है जिसे अरामी सैनिक खोज रहे थे।
- source_word: לְכוּ אַחֲרַי
  choice: मेरे पीछे चलो
  rationale: शाब्दिक अर्थ ‘मेरे पीछे जाओ’ है; ‘मेरे पीछे चलो’ आधुनिक हिंदी में स्वाभाविक है और अनुसरण करने तथा आगे बढ़ने, दोनों भावों को बनाए रखता है।
- source_word: וְאוֹלִיכָה אֶתְכֶם
  choice: और मैं तुम्हें … ले चलूँगा
  rationale: הלך के हिफ़ील रूप में किसी को ले जाने या मार्ग दिखाकर पहुँचाने का कारक अर्थ है। ‘ले चलूँगा’ इस संदर्भ में स्वाभाविक है।
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: אִישׁ यहाँ एक निश्चित पुरुष को दर्शाता है। ‘आदमी’ मूल की पुरुषवाचक एकवचन अभिव्यक्ति और एलीशा के अपने विषय में परोक्ष कथन की विडंबना बनाए रखता है।
- source_word: אֲשֶׁר תְּבַקֵּשׁוּן
  choice: जिसे तुम ढूँढ़ रहे हो
  rationale: בקשׁ का अर्थ ‘खोजना/ढूँढ़ना’ है। हिंदी का अपूर्ण वर्तमान रूप सैनिकों की उस समय जारी खोज को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; ‘तुम’ यहाँ बहुवचन है।
- source_word: וַיֹּלֶךְ אוֹתָם
  choice: फिर वह उन्हें … ले गया
  rationale: उसी कारक क्रिया को कथात्मक रूप में ‘ले गया’ कहना पिछले वचन ‘ले चलूँगा’ से अर्थगत संगति रखता है।
- source_word: שֹׁמְרוֹנָה
  choice: सामरिया
  rationale: दिशासूचक ה नगर की ओर गति बताता है। ‘सामरिया’ आधुनिक हिंदी बाइबलीय प्रयोग में इस स्थान का परिचित नाम है।
theological_decisions:
- issue: अरामी सैनिकों से एलीशा का भ्रामक कथन
  choice: “यह वह रास्ता नहीं है, और यह वह नगर भी नहीं है” को बिना नरम किए सीधे रूप में रखा गया है।
  alternative: ऐसी व्याख्यात्मक पुनर्रचना जो कथन को स्पष्टतः छल घोषित करे या उसे आंशिक सत्य सिद्ध करे।
  rationale: इब्रानी पाठ स्वयं नैतिक स्पष्टीकरण नहीं देता। सीधा अनुवाद कथा की विडंबना और नैतिक-धर्मवैज्ञानिक तनाव को पाठक के लिए खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नगर’ कथात्मक-बाइबलीय शैली के अनुकूल है, जबकि ‘आदमी’ אִישׁ का स्पष्ट और सामान्य हिंदी समतुल्य है। किसी अनावश्यक व्याख्यात्मक पादटिप्पणी की जरूरत नहीं पड़ी; ‘मेरे पीछे चलो’ मूल अभिव्यक्ति को स्वाभाविक रूप से ही संप्रेषित करता है।
