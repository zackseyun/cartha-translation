source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
translation:
  language: hi
  text: जब इस्राएल का राजा शहरपनाह पर से जा रहा था, तब एक स्त्री ने उसे पुकारकर कहा, “हे मेरे स्वामी, महाराज, मेरी सहायता कीजिए!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मेरे स्वामी, महाराज, मुझे बचाइए!” इब्रानी आज्ञार्थ का शाब्दिक अर्थ “बचाइए” है, पर यहाँ यह सहायता के लिए की गई अत्यावश्यक विनती के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי ... עֹבֵר
  choice: जब ... जा रहा था
  rationale: वַיְהִי के साथ कृदन्त עֹבֵר अतीत में चल रही पृष्ठभूमि-क्रिया प्रस्तुत करता है; आधुनिक हिन्दी में ‘जब ... जा रहा था’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: यह शासक की पहचान कराने वाली सामान्य संबंध-रचना है।
- source_word: עַל הַחֹמָה
  choice: शहरपनाह पर से
  rationale: עַל का मूल अर्थ ‘पर’ है; घेराबंदी के प्रसंग में חֹמָה नगर की रक्षात्मक दीवार है। ‘पर से’ राजा के उस पर चलते हुए निकलने का भाव देता है, बिना ‘साथ-साथ’ जैसी अतिरिक्त दिशा जोड़े।
- source_word: צָעֲקָה אֵלָיו
  choice: उसे पुकारकर कहा
  rationale: צעק संकट में ऊँची आवाज़ से पुकारने को दर्शाता है। हिन्दी में यह प्रयोग पुकार की तीव्रता और अगले प्रत्यक्ष कथन—दोनों को सहज रूप से जोड़ता है।
- source_word: הוֹשִׁיעָה
  choice: मेरी सहायता कीजिए
  rationale: ישׁע का आज्ञार्थ शाब्दिक रूप से ‘बचा’ है, पर यहाँ राजा से तत्काल हस्तक्षेप की विनती है। सम्मानसूचक हिन्दी में ‘मेरी सहायता कीजिए’ प्रसंगानुकूल है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी, महाराज
  rationale: अֲדֹנִי सम्मानपूर्ण संबोधन है और הַמֶּלֶךְ राजा की पदवी स्पष्ट करता है। यह हिन्दी रूप दोनों तत्वों और राजकीय सम्मान को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को संक्षेप और स्पष्टता से व्यक्त करता है; संबोधन में सम्मानसूचक बहुवचन अपनाया गया है।
