  text: The king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
translation:
  language: hi
  text: अराम का राजा इस्राएल के विरुद्ध युद्ध कर रहा था। उसने अपने सेवकों से सलाह की और कहा, “अमुक-अमुक स्थान पर मेरा पड़ाव होगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “अमुक-अमुक स्थान पर मेरा पड़ाव है।” इब्रानी में किसी अनिर्दिष्ट स्थान के लिए एक मुहावरा प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: स्थान-नाम אֲרָם को पारंपरिक रूप से किसी दूसरे आधुनिक नाम से बदलने के बजाय ‘अराम’ रखा गया है। आरंभिक ו कथानक को जोड़ता है, पर स्वतंत्र हिन्दी वाक्य में अलग ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: הָיָה נִלְחָם
  choice: युद्ध कर रहा था
  rationale: היה के साथ निफ़अल कृदन्त अतीत में जारी या बार-बार होने वाली कार्रवाई व्यक्त करता है; हिन्दी का अपूर्ण भूतकाल इस अवधि-बोध को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: נלחם के साथ ב संघर्ष के प्रतिपक्ष को चिह्नित करता है; ‘के विरुद्ध’ आधुनिक हिन्दी में अर्थ को स्पष्ट करता है।
- source_word: וַיִּוָּעַץ אֶל עֲבָדָיו
  choice: उसने अपने सेवकों से सलाह की
  rationale: क्रिया परामर्श करने का अर्थ देती है। עֲבָדָיו का व्यापक अर्थ बनाए रखने के लिए ‘सेवकों’ चुना गया है; ‘अधिकारियों’ कहना प्रसंग से संभव है, पर अधिक विशिष्ट होगा।
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  choice: अमुक-अमुक स्थान पर
  rationale: युग्म פְּלֹנִי אַלְמֹנִי किसी अनिर्दिष्ट या न बताए गए स्थान का मुहावरा है; ‘अमुक-अमुक’ हिन्दी में उसी प्रकार की अनिश्चित अभिव्यक्ति है।
- source_word: תַּחֲנֹתִי
  choice: मेरा पड़ाव होगा
  rationale: यह संक्षिप्त पद राजा की नियोजित सैन्य छावनी या पड़ाव को दर्शाता है। प्रसंगगत भावी अर्थ को हिन्दी में ‘होगा’ से स्वाभाविक रूप दिया गया है, जबकि शाब्दिक वर्तमान-सदृश रूप पादटिप्पणी में रखा गया है।
