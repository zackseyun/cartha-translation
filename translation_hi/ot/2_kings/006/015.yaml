source:
  edition: WLC
  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
translation:
  language: hi
  text: परमेश्वर के जन का सेवक भोर को उठा और बाहर निकला। तो देखा कि घोड़ों और रथों समेत एक सेना नगर को घेरे हुए थी। तब उस सेवक ने परमेश्वर के जन से कहा, “हाय, मेरे स्वामी! अब हम क्या करें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... לָקוּם
  choice: सवेरे जल्दी उठा
  rationale: हिफ़ील रूप शीघ्र उठने या दिन का काम जल्दी आरम्भ करने का भाव देता है; ‘सवेरे जल्दी उठा’ समय-संबंधी अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: מְשָׁרֵת
  choice: सेवक
  rationale: यह निजी या आधिकारिक रूप से सेवा करने वाले व्यक्ति को दर्शाता है; इस कथा में ‘सेवक’ स्वाभाविक और स्पष्ट है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी बाइबल में नबी के लिए स्थापित पदवी है; प्रचलित हिन्दी रूप इसकी शाब्दिक तथा अंतरपाठीय पहचान बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक दिखाई पड़े दृश्य और आश्चर्य की ओर ध्यान खींचता है; ‘और देखो’ कथन की सजीवता बनाए रखता है।
- source_word: חַיִל
  choice: एक सेना
  rationale: सैन्य प्रसंग में यह सशस्त्र बल को सूचित करता है; ‘सेना’ सर्वाधिक स्पष्ट है।
- source_word: סוֹבֵב
  choice: घेरे हुए थी
  rationale: कृदन्त उस समय जारी अवस्था को दिखाता है जब सेवक ने दृश्य देखा; यह रूप निरंतर घेराव का भाव रखता है।
- source_word: וְסוּס וָרָכֶב
  choice: घोड़ों और रथों समेत
  rationale: यह सेना के सैन्य साधनों को स्पष्ट करता है और हिन्दी में स्वाभाविक रूप से जुड़ता है।
- source_word: נַעֲרוֹ
  choice: उसके सेवक
  rationale: נַעַר का अर्थ युवक, परिचारक या सेवक हो सकता है। पहले प्रयुक्त מְשָׁרֵת से उसकी सेवक की भूमिका स्पष्ट है; आयु अनिश्चित होने के कारण ‘सेवक’ चुना गया।
- source_word: אֲהָהּ
  choice: हाय
  rationale: यह भय और संकट की तीव्र पुकार है; ‘हाय’ आधुनिक हिन्दी में संक्षिप्त, गंभीर और स्वाभाविक है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह सेवक द्वारा अपने अधिकारी के लिए आदरसूचक संबोधन है, ईश्वरीय उपाधि नहीं; ‘मेरे स्वामी’ सामाजिक संबंध को ठीक दर्शाता है।
- source_word: אֵיכָה נַעֲשֶׂה
  choice: अब हम क्या करें?
  rationale: शाब्दिक भाव ‘हम कैसे करें?’ है, पर संकट के संदर्भ में यह हिन्दी का स्वाभाविक प्रश्न है; ‘अब’ तत्काल चिंता को व्यक्त करता है।
