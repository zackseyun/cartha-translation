base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/027.yaml
  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
translation:
  language: hi
  text: तब उसने कहा[a], “यदि याहवे तेरी सहायता न करे, तो मैं कहाँ से तेरी सहायता करूँ? क्या खलिहान से या दाखरस के कुंड से?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि याहवे तुझे न बचाए, तो मैं कहाँ से तुझे बचाऊँ?” दोनों खंडों में प्रयुक्त इब्रानी क्रिया का अर्थ सहायता करना, बचाना या छुड़ाना हो सकता है।
    reason: मूल क्रिया ישׁע की अर्थ-सीमा और दोनों खंडों की समानांतरता सुरक्षित रखना।
lexical_decisions:
- source_word: אַל יוֹשִׁעֵךְ יְהוָה
  choice: यदि याहवे तेरी सहायता न करे
  rationale: निषेधवाचक אַל को इस प्रसंग में अगले अलंकारिक प्रश्न की शर्त के रूप में समझना स्वाभाविक है। स्त्री को संबोधित होने के कारण एकवचन स्त्रीलिंग-संगत ‘तेरी’ रखा गया है।
- source_word: יוֹשִׁעֵךְ / אֹשִׁיעֵךְ
  choice: तेरी सहायता करे / तेरी सहायता करूँ
  rationale: यशׁע का अर्थ सहायता करना, बचाना या छुड़ाना हो सकता है। अकाल में व्यावहारिक राहत की बात होने के कारण ‘सहायता’ सहज है और दोनों समानांतर खंडों में एक ही क्रिया-भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: מֵאַיִן
  choice: कहाँ से
  rationale: यह सहायता के स्रोत के विषय में पूछा गया अलंकारिक प्रश्न है; ‘कहाँ से’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֲמִן הַגֹּרֶן
  choice: क्या खलिहान से
  rationale: प्रश्नवाचक הֲ को ‘क्या’ से व्यक्त किया गया है। खलिहान अनाज मिलने के स्थान को सूचित करता है।
- source_word: הַיָּקֶב
  choice: दाखरस के कुंड
  rationale: יֶקֶב अंगूर दबाने और रस इकट्ठा करने के स्थान या कुंड को दर्शाता है। ‘दाखरस का कुंड’ खलिहान के समानांतर खाद्य-संसाधन का ठोस चित्र बनाए रखता है।
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी कथन-प्रवाह में ‘तब’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: ישׁע का प्रसंगानुकूल अर्थ
  choice: सहायता करना
  alternative: बचाना; छुड़ाना; उद्धार करना
  rationale: घेराबंदी और अकाल के प्रसंग में तत्काल भौतिक सहायता प्रमुख है। फिर भी क्रिया में बचाव या छुटकारे का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजा एक स्त्री को संबोधित कर रहा है, इसलिए ‘तेरी’ और ‘तुझे’ जैसे एकवचन रूप प्रसंगानुकूल हैं। ‘दाखरस का कुंड’ प्राचीन कृषि-चित्र को स्पष्ट रखते हुए सामान्य पाठक के लिए बोधगम्य है।
