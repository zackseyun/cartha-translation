base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: hi
  text: तब राजा ने उससे पूछा, “तुम्हें क्या परेशानी है?” उसने कहा, “इस स्त्री ने मुझसे कहा था, ‘अपना बेटा दे दे, ताकि आज हम उसे खाएँ; और कल हम मेरे बेटे को खाएँगे।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַה לָּךְ
  choice: तुम्हें क्या हुआ है?
  rationale: यह मुहावरा स्त्री की समस्या या शिकायत पूछता है। आधुनिक हिंदी में यह स्वाभाविक है और मूल की संक्षिप्त प्रश्नवाचकता बनाए रखता है।
- source_word: תְּנִי אֶת בְּנֵךְ
  choice: अपना बेटा दे दे
  rationale: स्त्री से किया गया स्त्रीलिंग एकवचन आदेश हिंदी में सहज प्रत्यक्ष कथन के रूप में प्रस्तुत है।
- source_word: וְנֹאכְלֶנּוּ
  choice: ताकि आज हम उसे खाएँ
  rationale: प्रथम पुरुष बहुवचन और पुरुषवाचक कर्म-प्रत्यय दोनों स्पष्ट रखे गए हैं; प्रसंग की भयावहता को नरम नहीं किया गया।
- source_word: וְאֶת בְּנִי נֹאכַל מָחָר
  choice: और कल हम मेरे बेटे को खाएँगे
  rationale: मूल का असामान्य किंतु स्पष्ट शब्दक्रम और भविष्यकालीन प्रस्ताव अर्थ की दृष्टि से सुरक्षित रखे गए हैं।
