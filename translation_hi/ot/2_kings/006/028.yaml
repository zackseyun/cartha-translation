  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की प्रत्यक्षता तथा अकाल की भयावह वास्तविकता को बिना व्याख्यात्मक विस्तार या शमन के प्रस्तुत किया गया है।
