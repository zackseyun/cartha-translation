  text: So he went with them[a], and they came to the Jordan and cut down the trees.
translation:
  language: hi
  text: तब वह उनके साथ गया, और वे यरदन तक आए और पेड़[a] काटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लकड़ी।” इब्रानी शब्द का अर्थ व्यापक रूप से पेड़ या लकड़ी हो सकता है; यहाँ पेड़ों को काटने के प्रसंग में “पेड़” अधिक सटीक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब वह गया
  rationale: वाव-परिणामी कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक क्रमसूचक है।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: यह पूर्वसर्ग और तृतीय पुरुष बहुवचन प्रत्यय का सीधा अर्थ है।
- source_word: וַיָּבֹאוּ
  choice: वे पहुँचे
  rationale: בוא यहाँ किसी स्थान पर आने या पहुँचने को व्यक्त करता है; ‘पहुँचे’ हिन्दी में गंतव्य तक गति को स्वाभाविक ढंग से बताता है।
- source_word: הַיַּרְדֵּנָה
  choice: यरदन के पास
  rationale: दिशासूचक ה यरदन की ओर गति दर्शाता है। प्रसंग नदी के किनारे लकड़ी काटने का है, इसलिए ‘के पास’ स्वाभाविक है और मूल से अनावश्यक विस्तार नहीं करता।
- source_word: וַיִּגְזְרוּ
  choice: उन्होंने ... काटे
  rationale: גזר यहाँ निर्माण के लिए पेड़ों को काटने के अर्थ में है; हिन्दी में वस्तु ‘पेड़’ के साथ ‘काटे’ पर्याप्त और स्वाभाविक है।
- source_word: הָעֵצִים
  choice: पेड़
  rationale: עֵץ का बहुवचन पेड़ों या लकड़ी, दोनों को सूचित कर सकता है; इस प्रसंग में खड़े पेड़ों को काटना अधिक संभावित है। हिन्दी में सामान्य बहुवचन के साथ निश्चितता अलग लेख द्वारा नहीं दिखाई जाती।
