- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल की कथात्मक क्रमबद्धता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָרֶם
  choice: उठा लो
  rationale: हिफ़ील आज्ञार्थक का मूल भाव ‘ऊपर उठाना’ है; प्रसंग में पानी पर आए लोहे को उठा लेने की क्रिया है।
- source_word: לָךְ
  choice: स्वयं
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सहित לְ यहाँ उस व्यक्ति की अपनी भागीदारी पर बल देता है; ‘स्वयं’ इसे संक्षेप और स्वाभाविक रूप में रखता है।
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: उसने अपना हाथ बढ़ाकर
  rationale: हाथ आगे बढ़ाकर वस्तु ग्रहण करने के सामान्य इब्रानी मुहावरे का सहज हिन्दी रूप।
- source_word: וַיִּקָּחֵהוּ
  choice: उसे ले लिया
  rationale: לקח के सामान्य अर्थ ‘लेना’ को बनाए रखता है और पहले आए ‘उठा लो’ की अनावश्यक पुनरावृत्ति से बचता है।
