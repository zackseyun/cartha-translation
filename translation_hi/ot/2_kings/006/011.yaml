base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
translation:
  language: hi
  text: इस बात पर अराम के राजा का मन बहुत व्याकुल हो उठा। उसने अपने सेवकों को बुलाकर उनसे कहा, “क्या तुम मुझे नहीं बताओगे कि हममें से कौन इस्राएल के राजा के पक्ष में है[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के राजा की ओर है।” इब्रानी अभिव्यक्ति संक्षिप्त है और पक्षधरता या मिलीभगत का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר
  choice: बहुत व्याकुल हो उठा
  rationale: यह क्रिया भीतर की तीव्र उथल-पुथल या उत्तेजना व्यक्त करती है। प्रसंग में राजा परेशान और उत्तेजित है; यह अनुवाद केवल क्रोध का अर्थ थोपे बिना उस तीव्रता को स्वाभाविक हिन्दी में रखता है।
- source_word: לֵב
  choice: मन
  rationale: इब्रानी में ‘हृदय’ विचार और भावना सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिन्दी में ‘मन व्याकुल हो उठा’ इसी भाव को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל הַדָּבָר הַזֶּה
  choice: इस बात पर
  rationale: यहाँ דָּבָר किसी परिस्थिति या मामले को सूचित करता है; ‘इस बात पर’ संक्षिप्त और सहज हिन्दी है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: राजदरबार के संदर्भ में यह शब्द राजा के अधीन सेवकों या अधिकारियों को सूचित कर सकता है। ‘सेवकों’ मूल शब्द का व्यापक अर्थ बनाए रखता है।
- source_word: הֲלוֹא תַּגִּידוּ לִי
  choice: क्या तुम मुझे नहीं बताओगे
  rationale: नकारात्मक प्रश्न का रूप बनाए रखते हुए यह राजा की अधीर माँग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִי מִשֶּׁלָּנוּ
  choice: हममें से कौन
  rationale: यह अरामी पक्ष के भीतर किसी व्यक्ति की पहचान पूछता है; ‘हममें से कौन’ सटीक और मुहावरेदार है।
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा के पक्ष में है
  rationale: मूल अभिव्यक्ति अत्यंत संक्षिप्त है और दिशा के साथ निष्ठा या मिलीभगत का संकेत देती है। ‘पक्ष में है’ अर्थ को समझने योग्य बनाता है, जबकि पादटिप्पणी उसकी शाब्दिकता और संभावित अर्थ-सीमा सुरक्षित रखती है।
