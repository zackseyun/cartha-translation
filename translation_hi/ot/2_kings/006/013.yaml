base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
translation:
  language: hi
  text: 'तब उसने कहा, “जाकर देखो कि वह कहाँ है, ताकि मैं लोगों को भेजूँ और उसे पकड़ लूँ।” तब उसे यह सूचना दी गई: “देखिए,[a] वह दोतान में है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोतान सामरिया के उत्तर में स्थित एक नगर था; यूसुफ के वृत्तांत में भी इसका उल्लेख है (उत्पत्ति 37:17)।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: कथात्मक wayyiqtol को स्वाभाविक हिन्दी में क्रमसूचक ‘तब’ से व्यक्त किया गया है; इससे कोई अतिरिक्त कालगत दावा नहीं जुड़ता।
- source_word: לְכוּ וּרְאוּ
  choice: जाकर देखो
  rationale: दोनों बहुवचन आज्ञार्थकों को स्वाभाविक हिन्दी संयुक्त क्रिया में रखा गया है; आदेश अनेक सेवकों से है।
- source_word: אֵיכֹה הוּא
  choice: वह कहाँ है
  rationale: स्थान पूछने वाली अभिव्यक्ति का सीधा और सहज अनुवाद।
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  choice: ताकि मैं अपने लोगों को भेजकर उसे पकड़वा लूँ
  rationale: संदर्भ में राजा दूसरों को भेजकर उस व्यक्ति को बंदी बनवाना चाहता है। ‘पकड़वा लूँ’ हिन्दी में प्रयोजक भाव स्पष्ट करता है, जबकि उद्देश्यसूचक संबंध ‘ताकि’ से व्यक्त होता है।
- source_word: וַיֻּגַּד לוֹ
  choice: तब उसे यह सूचना दी गई
  rationale: होफल के कर्मवाच्य भाव को बनाए रखते हुए राजकीय सूचना के प्रसंग के अनुरूप स्वाभाविक हिन्दी।
- source_word: לֵאמֹר
  choice: —
  rationale: इब्रानी का उद्धरण-सूचक infinitive हिन्दी में विराम-चिह्न द्वारा स्वाभाविक रूप से व्यक्त है; अलग से ‘कहते हुए’ जोड़ना असहज होता।
- source_word: הִנֵּה
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले निपात को आधुनिक, आदरसूचक हिन्दी में व्यक्त किया गया है; सूचना राजा को संबोधित है।
- source_word: בְדֹתָן
  choice: दोतान में
  rationale: स्थाननाम का देवनागरी लिप्यंतरण और בְ का स्थानवाचक अर्थ सुरक्षित है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, कथात्मक और गरिमापूर्ण रखी गई है। बहुवचन आज्ञा हिन्दी में रूपतः अस्पष्ट हो सकती है, पर ‘अपने लोगों को भेजकर’ प्रसंगगत कर्तृत्व स्पष्ट करता है। मुख्य पाठ में फुटनोट चिह्न [a] उपस्थित है।
