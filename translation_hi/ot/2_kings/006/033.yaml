base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
translation:
  language: hi
  text: जब वह अभी उनसे बात कर ही रहा था, तब देखो, दूत उसकी ओर नीचे आ रहा था, और उसने कहा, “देखो, यह विपत्ति याहवे की ओर से है। मैं याहवे की प्रतीक्षा अब और क्यों करूँ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अब और याहवे से क्या आशा रखूँ?” इब्रानी क्रिया का अर्थ ‘प्रतीक्षा करना’ या ‘आशा रखना’—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  choice: जब वह अभी उनसे बात कर ही रहा था
  rationale: यह रचना बोलने की जारी अवस्था व्यक्त करती है। ‘अभी…कर ही रहा था’ हिन्दी में उसी कालगत बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: הַמַּלְאָךְ
  choice: वह दूत
  rationale: इस कथा-संदर्भ में यह राजा का भेजा हुआ मानवीय संदेशवाहक है, इसलिए ‘स्वर्गदूत’ भ्रामक होगा।
- source_word: יֹרֵד אֵלָיו
  choice: उसके पास नीचे उतर आया
  rationale: यरद नीचे की ओर गति बताता है; यह अनुवाद दिशा और आगमन दोनों को स्पष्ट रखता है।
- source_word: הִנֵּה
  choice: तभी / देखो
  rationale: कथावाचन में पहला प्रयोग अचानक घटित घटना की ओर ध्यान खींचता है, इसलिए ‘तभी’; सीधे कथन में दूसरा प्रयोग जोर देने वाला है, इसलिए ‘देखो’।
- source_word: זֹאת הָרָעָה
  choice: यह विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई से अधिक घेराबंदी से उत्पन्न वर्तमान अनर्थ या विपत्ति को दर्शाता है। ‘विपत्ति’ प्रसंगानुकूल है और वक्ता के आरोपपूर्ण स्वर को बनाए रखता है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से आई है
  rationale: מֵאֵת स्रोत को सूचित करता है। ‘की ओर से’ विपत्ति को याहवे से आया हुआ बताता है, और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  choice: मैं अब और याहवे की बाट क्यों जोहूँ?
  rationale: יחל प्रतीक्षा और आशा—दोनों का भाव रख सकता है। ‘बाट जोहना’ मुख्य पाठ में प्रतीक्षा का भाव स्वाभाविक ढंग से देता है; आशा वाला अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
- issue: יחל में प्रतीक्षा और आशा का संबंध
  choice: याहवे की बाट जोहूँ
  alternative: याहवे से क्या आशा रखूँ
  rationale: प्रसंग में वक्ता आगे प्रतीक्षा करने से इनकार कर रहा है, पर इब्रानी क्रिया में आशा का अर्थ भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: विपत्ति का स्रोत याहवे को बताने वाला कथन
  choice: वक्ता का आरोपपूर्ण कथन ज्यों का त्यों रखा गया
  alternative: इसे केवल अनुमति या अप्रत्यक्ष कारण के रूप में स्पष्ट करना
  rationale: मूल पाठ विपत्ति को याहवे की ओर से बताता है। अनुवाद उस तनाव को किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या द्वारा हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बाट जोहना’ सामान्य हिन्दी में समझ आने वाला किंचित साहित्यिक मुहावरा है, जो प्रतीक्षा और अपेक्षा दोनों की छाया बनाए रखता है। सर्वनाम ‘उसने’ मूल की तरह वक्ता का नाम दोहराए बिना निकटतम कर्ता ‘दूत’ की ओर संकेत करता है।
