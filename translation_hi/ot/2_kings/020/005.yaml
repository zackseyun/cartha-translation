source:
  edition: WLC
  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
translation:
  language: hi
  text: 'लौटकर मेरी प्रजा के अगुवे हिजकिय्याह से कह, ‘याहवे, तेरे पूर्वज दाऊद का परमेश्वर, यों कहता है: मैंने तेरी प्रार्थना सुनी है और तेरे आँसू देखे हैं। देख, मैं तुझे चंगा कर रहा हूँ।[a] तीसरे दिन तू याहवे के भवन में जाएगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे चंगा करूँगा।” इब्रानी में अधिक शाब्दिक रूप से, “देख, मैं तुझे चंगा कर रहा हूँ” है; यहाँ कृदंत आसन्न क्रिया भी व्यक्त कर सकता है।
    reason: इब्रानी कृदंत के वर्तमान/आसन्न और भविष्याभिमुख अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: שׁוּב וְאָמַרְתָּ
  choice: लौटकर ... कह
  rationale: आज्ञा यशायाह को वापस हिजकिय्याह के पास जाने और संदेश सुनाने की है; यह हिंदी में स्वाभाविक और मूल के निकट है।
- source_word: נְגִיד עַמִּי
  choice: मेरी प्रजा के अगुवे
  rationale: נָגִיד शासक अथवा नियुक्त अगुवे को दर्शाता है; ‘अगुवा’ आधुनिक पाठक के लिए स्पष्ट है और ‘राजकुमार’ जैसी अनावश्यक वंशगत धारणा से बचता है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे ... यह कहता है
  rationale: भविष्यद्वक्ताओं के प्रामाणिक संदेश-सूत्र को स्वाभाविक हिंदी में रखते हुए पवित्र नाम को सीधे प्रस्तुत करता है।
- source_word: אֱלֹהֵי דָּוִד אָבִיךָ
  choice: तेरे पूर्वज दाऊद का परमेश्वर
  rationale: אָבִיךָ यहाँ वंशगत पूर्वज को सूचित करता है; ‘पूर्वज’ आधुनिक हिंदी में संभावित भ्रम से बचते हुए आशय स्पष्ट करता है।
- source_word: שָׁמַעְתִּי ... רָאִיתִי
  choice: मैंने ... सुनी है और ... देखे हैं
  rationale: पूर्ण क्रियाएँ उस बीती घटना को व्यक्त करती हैं जिसका परिणाम वर्तमान दिव्य उत्तर में प्रभावी है।
- source_word: הִנְנִי רֹפֶא לָךְ
  choice: देख, मैं तुझे चंगा कर रहा हूँ
  rationale: הִנְנִי का बल ‘देख’ से और participle רֹפֶא की आसन्न/प्रगतिशील क्रिया ‘चंगा कर रहा हूँ’ से सुरक्षित रहती है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי תַּעֲלֶה
  choice: तीसरे दिन तू ... जाएगा
  rationale: समय-सूचक वाक्यांश को सीधे रखा गया है; मंदिर की ओर עלה का आरोहण-संकेत हिंदी के ‘भवन में जाएगा’ में सहज रूप से व्यक्त होता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: ‘भवन’ मूल ‘घर’ की उपासना-स्थल संबंधी अभिव्यक्ति को सुरक्षित रखता है और ‘मंदिर’ की व्याख्यात्मक स्पष्टता थोपने से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा का विशिष्ट नाम है; ‘याहवे’ उसका सीधा लिप्यंतरण है और सामान्य उपाधि से उसे प्रतिस्थापित नहीं करता।
- issue: רֹפֶא की कालगत/पक्षगत शक्ति
  choice: मैं तुझे चंगा कर रहा हूँ
  alternative: मैं तुझे चंगा करूँगा
  rationale: הִנְנִי के साथ participle घोषित क्रिया की तत्परता या आसन्नता व्यक्त कर सकता है। मुख्य पाठ रूप को निकटता से रखता है, जबकि भविष्यकालीन अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- issue: דָּוִד אָבִיךָ में संबंध
  choice: तेरे पूर्वज दाऊद
  alternative: तेरे पिता दाऊद
  rationale: हिजकिय्याह के संबंध में दाऊद दूरस्थ वंशज-पूर्वज हैं; हिंदी में ‘पूर्वज’ संबंध को यथार्थ और स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज स्तर अपनाया गया है। दिव्य संबोधन में एकवचन ‘तू/तेरा’ मूल के एकवचन रूप और हिंदी बाइबिलीय शैली के अनुरूप है। ‘चंगा करना’ सामान्य हिंदी मसीही शब्दावली में सुबोध है; वाक्य-विन्यास को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
