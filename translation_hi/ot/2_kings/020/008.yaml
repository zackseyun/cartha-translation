  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
translation:
  language: hi
  text: हिजकिय्याह ने यशायाह से कहा, “इस बात का क्या चिन्ह होगा कि यहोवा मुझे चंगा करेगा और मैं तीसरे दिन यहोवा के भवन[a] में जाने के लिए ऊपर चढ़ूँगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, यहोवा का मंदिर। शाब्दिक रूप से, “यहोवा का घर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מָה אוֹת
  choice: क्या चिन्ह
  rationale: यहाँ אות परमेश्वर की प्रतिज्ञा की पुष्टि करने वाले संकेत को दर्शाता है; ‘चिन्ह’ अर्थ को अनावश्यक रूप से ‘प्रमाण’ तक सीमित नहीं करता।
- source_word: כִּי
  choice: इस बात का ... कि
  rationale: כִּי माँगे गए चिन्ह की विषय-वस्तु प्रस्तुत करता है; हिन्दी में ‘इस बात का ... कि’ स्पष्ट और स्वाभाविक है।
- source_word: יִרְפָּא ... לִי
  choice: मुझे चंगा करेगा
  rationale: अपूर्ण क्रिया यहाँ भविष्य की प्रतिज्ञात घटना व्यक्त करती है और לִי को हिन्दी में स्वाभाविक कर्म के रूप में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में स्थापित प्रत्यक्ष लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: וְעָלִיתִי
  choice: और मैं ... जाऊँगा
  rationale: עלה का मूल भाव ‘ऊपर जाना/चढ़ना’ है; मंदिर जाने के प्रसंग में हिन्दी का ‘भवन में जाना’ स्वाभाविक है, जबकि स्थल की ऊँचाई को अलग से उभारना आवश्यक नहीं।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: हिब्रू कालवाचक पदबंध का सीधा और मुहावरेदार हिन्दी रूप।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: शाब्दिक संरचना ‘यहोवा का घर/भवन’ को बनाए रखता है और प्रसंग में मंदिर का बोध कराता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: בֵּית יְהוָה का अर्थ
  choice: यहोवा का भवन
  alternative: यहोवा का मंदिर
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है, जबकि संदर्भ में इसका आशय मंदिर ही है; किसी अतिरिक्त धार्मिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रश्न की हिब्रू संरचना को हिन्दी में ‘इस बात का क्या चिन्ह होगा कि...’ के रूप में स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘यहोवा का भवन’ मूल और संदर्भ दोनों को पर्याप्त रूप से व्यक्त करता है।
