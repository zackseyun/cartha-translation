base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/002.yaml
  text: Then he turned his face to the wall and prayed to Yahweh[a], saying,
translation:
  language: hi
  text: 'तब उसने अपना मुँह दीवार की ओर फेर लिया और याहवे से यह कहकर प्रार्थना की:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: तब उसने ... फेर लिया
  rationale: סבב के हिफ़ील वय्यिक्तोल रूप में कथा के क्रम में पूरी हुई क्रिया है। ‘तब’ क्रम को और ‘फेर लिया’ दिशा बदलने की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָּנָיו
  choice: अपना मुँह
  rationale: פנים का मूल अर्थ ‘चेहरा/मुख’ है। इस प्रसंग में ‘अपना मुँह ... फेर लिया’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और ठोस चित्र बनाए रखता है।
- source_word: אֶל הַקִּיר
  choice: दीवार की ओर
  rationale: אֶל दिशा बताता है और קִיר का अर्थ ‘दीवार’ है। ‘की ओर’ लक्ष्य की दिशा को ठीक और सहज रूप से व्यक्त करता है।
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना करते हुए
  rationale: פלל के हित्पएल रूप का यहाँ अर्थ ‘प्रार्थना करना’ है। अगले לֵאמֹר के साथ यह संयोजन हिन्दी में प्रवाहपूर्ण है और प्रार्थना के कथ्य का परिचय देता है।
- source_word: אֶל יְהוָה
  choice: यहोवा से
  rationale: אֶל प्रार्थना के संबोधन का लक्ष्य बताता है। हिन्दी में ‘किसी से प्रार्थना करना’ स्वाभाविक प्रयोग है। יְהוָה को प्रकट व्यक्तिगत नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: אמר का यह infinitive construct आने वाले कथन का परिचय देता है। ‘प्रार्थना करते हुए कहा’ हिन्दी में स्वाभाविक है और अगले पद के सीधे कथन से जुड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन व्यक्तिगत नाम के रूप में सीधे आया है। हिन्दी बाइबल-परंपरा में परिचित ‘यहोवा’ नाम को छिपाए बिना प्रस्तुत करता है; ‘प्रभु’ पदवी होती और मूल के नाम-स्वरूप को कम प्रत्यक्ष करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपना मुँह दीवार की ओर फेर लिया’ मूल की ठोस देहगत छवि को सुरक्षित रखता है।
