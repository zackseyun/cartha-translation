source:
  edition: WLC
  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
translation:
  language: hi
  text: और मैं तेरी आयु में पंद्रह वर्ष और बढ़ा दूँगा। मैं तुझे और इस नगर को अश्शूर के राजा के हाथ से छुड़ाऊँगा[a], और अपने ही निमित्त तथा अपने सेवक दाऊद के निमित्त इस नगर की रक्षा करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् अश्शूर के राजा की शक्ति या अधिकार से; मूल में ‘हाथ से’।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस नगर को सुरक्षित रखूँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  choice: मैं तेरी आयु में पंद्रह वर्ष और बढ़ा दूँगा
  rationale: शाब्दिक भाव ‘तेरे दिनों में जोड़ूँगा’ है। आधुनिक हिन्दी में ‘आयु में ... वर्ष और बढ़ा दूँगा’ उसी अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के हाथ से
  rationale: ‘हाथ’ सामर्थ्य अथवा अधिकार का इब्रानी मुहावरा है; हिन्दी में भी यह बोधगम्य है और मूल बिंब को बनाए रखता है।
- source_word: אַצִּילְךָ וְאֵת הָעִיר הַזֹּאת
  choice: मैं तुझे और इस नगर को ... छुड़ाऊँगा
  rationale: नצל के हिफ़ील रूप में संकट या अधिकार से बचाने अथवा छुड़ाने का अर्थ है। सैन्य-राजनीतिक प्रसंग में ‘छुड़ाऊँगा’ उपयुक्त है।
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  choice: इस नगर की रक्षा करूँगा
  rationale: גנן का अर्थ ढाँपना, बचाना या रक्षा करना है। यहाँ अश्शूरी आक्रमण के संदर्भ में ‘रक्षा करूँगा’ स्वाभाविक है।
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  choice: अपने कारण तथा अपने सेवक दाऊद के कारण
  rationale: यह परमेश्वर द्वारा बताए गए दोनों प्रेरक आधारों को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: यरूशलेम की रक्षा के लिए परमेश्वर का बताया हुआ आधार
  choice: अपने कारण तथा अपने सेवक दाऊद के कारण
  alternative: अपने निमित्त और अपने सेवक दाऊद के निमित्त
  rationale: मूल पाठ परमेश्वर स्वयं और उसके सेवक दाऊद—दोनों का स्पष्ट उल्लेख करता है। चुना हुआ रूप इस वाचा-संबंधी तनाव को समझाए बिना ज्यों का त्यों रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज शैली। परमेश्वर का राजा से सीधा एकवचन संबोधन होने के कारण ‘तेरी/तुझे’ रखा गया है। ‘अश्शूर’ पारंपरिक हिन्दी बाइबलीय नामरूप है।
