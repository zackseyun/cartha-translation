base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
translation:
  language: hi
  text: तब हिजकिय्याह ने यशायाह से कहा, “याहवे का जो वचन तुमने कहा है, वह अच्छा है।” फिर उसने कहा, “क्या यह अच्छा नहीं है कि मेरे जीवनकाल में शांति और स्थिरता[a] बनी रहे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “सच्चाई” या “विश्वासयोग्यता।” यहाँ इब्रानी शब्द אֱמֶת का अर्थ भरोसेमंद स्थिरता भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा
  rationale: यह विशेषण घोषित वचन का सीधा मूल्यांकन करता है। ‘अच्छा’ मूल की संक्षिप्तता और हिजकिय्याह की प्रतिक्रिया में निहित नैतिक तनाव दोनों को बनाए रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: भविष्यवाणी के प्रसंग में דָּבָר के लिए ‘वचन’ स्वाभाविक और पारंपरिक है तथा यह नबी द्वारा कही गई बात से औपचारिक संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को व्यक्तिगत नाम के रूप में प्रत्यक्ष रूप से प्रस्तुत किया गया है।
- source_word: דִּבַּרְתָּ
  choice: तुमने कहा है
  rationale: यह यशायाह को सीधे संबोधित पूर्ण क्रिया का सहज हिन्दी रूप है और उसे भविष्यद्वाणी के वक्ता के रूप में स्पष्ट रखता है।
- source_word: הֲלוֹא אִם
  choice: क्या यह अच्छा नहीं कि
  rationale: इब्रानी वाक्यांश संक्षिप्त और दीर्घवृत्तात्मक है। हिन्दी में प्रश्नवाचक बल को रखते हुए पहले कथन के ‘अच्छा’ को निहित पूरक के रूप में दोहराने से वाक्य बोधगम्य होता है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: यह व्यापक और सामान्य अर्थ देता है, जिसमें सामाजिक शांति और कुशल-क्षेम दोनों सम्मिलित हो सकते हैं।
- source_word: אֱמֶת
  choice: स्थिरता
  rationale: राजकीय और राष्ट्रीय संदर्भ में इसका आशय विश्वसनीय, टिकाऊ व्यवस्था या सुरक्षा से हो सकता है। ‘स्थिरता’ इस प्रसंगगत अर्थ को सहज हिन्दी में व्यक्त करती है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְיָמָי
  choice: मेरे जीवनकाल में
  rationale: शाब्दिक ‘मेरे दिनों में’ का यह स्वाभाविक आधुनिक हिन्दी रूप है और हिजकिय्याह के अपने जीवन तक सीमित सरोकार को स्पष्ट रखता है।
theological_decisions:
- issue: हिजकिय्याह का अंतिम कथन दीर्घवृत्तात्मक है और उसे बोले हुए कथन या उसके मन की व्याख्या के रूप में समझा जा सकता है।
  choice: 'इसे बोले हुए कथन के रूप में रखा गया: “फिर उसने कहा...”'
  alternative: “क्योंकि उसने सोचा, ‘क्या मेरे जीवनकाल में शांति और स्थिरता नहीं रहेगी?’”
  rationale: मूल पाठ में दूसरी बार וַיֹּאמֶר (‘और उसने कहा’) स्पष्ट रूप से आया है। इसलिए प्रत्यक्ष कथन मूल के अधिक निकट है; साथ ही प्रश्न का रूप हिजकिय्याह की आत्मकेंद्रित प्रतिक्रिया से उत्पन्न नैतिक तनाव को बिना टिप्पणी किए बनाए रखता है।
- issue: הֲלוֹא אִם में छूटा हुआ विधेय और शर्तसूचक रचना।
  choice: पहले वाक्य के ‘अच्छा’ को निहित मानकर प्रश्न को सहज हिन्दी में पूरा किया गया।
  alternative: “क्या ऐसा नहीं है, यदि मेरे दिनों में शांति और सच्चाई रहेगी?”
  rationale: अति-शाब्दिक रूप हिन्दी में अस्वाभाविक और अस्पष्ट होगा। चुना गया रूप मूल के प्रश्नवाचक आशय को व्यक्त करता है, पर यह दावा नहीं करता कि पाठ हिजकिय्याह के आचरण को नैतिक रूप से निर्दोष ठहराता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हिजकिय्याह’ और ‘यशायाह’ प्रचलित हिन्दी बाइबलीय नाम-रूप हैं। मूल के दोहरे ‘कहा’ को बनाए रखा गया है, और दीर्घवृत्तात्मक अंतिम कथन को केवल उतना ही स्पष्ट किया गया है जितना स्वाभाविक हिन्दी के लिए आवश्यक है।
