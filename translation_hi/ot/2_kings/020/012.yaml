base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
translation:
  language: hi
  text: उस समय बाबेल के राजा बलदान के पुत्र बरोदक-बलदान[a] ने हिजकिय्याह के पास पत्र और एक भेंट भेजे, क्योंकि उसने सुना था कि हिजकिय्याह बीमार पड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में नाम ‘बरोदक-बलदान’ है; यशायाह 39:1 में इसका रूप ‘मरोदक-बलदान’ मिलता है, और कई अनुवाद यहाँ भी वही रूप अपनाते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह सामान्य कथात्मक काल-सूचक पद है; ‘उस समय’ स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।
- source_word: שָׁלַח
  choice: भेजी
  rationale: पत्रों और भेंट को किसी के पास भेजने के लिए सामान्य आधुनिक हिन्दी क्रिया। संयुक्त कर्म के निकटतम पद ‘भेंट’ के अनुसार स्त्रीलिंग रूप स्वाभाविक है।
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
  choice: बरोदक-बलदान
  rationale: WLC के व्यंजन-पाठ בראדך को सीधे लिप्यंतरित किया गया है; यशायाह 39:1 का ‘मरोदक’ रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֶּן בַּלְאֲדָן
  choice: बलदान के पुत्र
  rationale: वंश-सूचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: राजकीय पद और राज्य को दर्शाने वाली संबंध-रचना का मानक हिन्दी अनुवाद।
- source_word: סְפָרִים
  choice: पत्र
  rationale: राजनयिक प्रसंग में यह बहुवचन लिखित पत्राचार को दर्शाता है; हिन्दी में ‘पत्र’ का रूप एकवचन और बहुवचन दोनों में समान रहता है।
- source_word: וּמִנְחָה
  choice: और एक भेंट
  rationale: इस प्रसंग में מִנְחָה के ‘भेंट’ अर्थ को चुना गया है; ‘कर’ या धार्मिक ‘अर्पण’ कहना अनावश्यक रूप से अर्थ सीमित करता।
- source_word: אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह के पास
  rationale: प्राप्तकर्ता को व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग।
- source_word: כִּי שָׁמַע
  choice: क्योंकि उसने सुना था
  rationale: पहला כִּי कारण बताता है; ‘सुना था’ कथानक में पहले प्राप्त हुई सूचना को स्पष्ट करता है।
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  choice: कि हिजकिय्याह बीमार पड़ा था
  rationale: दूसरा כִּי सुनी हुई बात की विषय-वस्तु प्रस्तुत करता है; ‘बीमार पड़ा था’ חלה के रोगग्रस्त होने और पूर्वकालिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
