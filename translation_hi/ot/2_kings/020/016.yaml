source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְשַׁעְיָ֖הוּ אֶל חִזְקִיָּ֑הוּ שְׁמַ֖ע דְּבַר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/016.yaml
  text: Then Isaiah said to Hezekiah[a], “Hear the word of Yahweh.”
translation:
  language: hi
  text: तब यशायाह ने हिजकिय्याह से कहा, “याहवे[a] का वचन सुनो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” अनूदित।'
    reason: दिव्य नाम के मूल इब्रानी रूप और पारंपरिक अनुवाद की सूचना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब … ने … कहा’ उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: इस इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल परंपरा में प्रचलित रूप।
- source_word: אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह से
  rationale: बोलने के लक्ष्य को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है; ‘हिजकिय्याह’ नाम का प्रचलित हिन्दी रूप है।
- source_word: שְׁמַע
  choice: सुनो
  rationale: एकवचन पुल्लिंग आज्ञार्थक रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी के सूत्र में यह परमेश्वर के बोले हुए संदेश को दर्शाता है; ‘वचन’ स्थापित बाइबलीय अर्थभार को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम का हिन्दी लिप्यंतरण; इसे किसी उपाधि से बदलने के बजाय मूल पाठ में उपस्थित व्यक्तिगत नाम सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरीय दिव्य नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण-आधारित लिप्यंतरण है; फुटनोट पारंपरिक उपाधि-आधारित अनुवाद की जानकारी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण भविष्यद्वाणी-सूत्र रखा गया है। अंग्रेज़ी परामर्श-पाठ में फुटनोट-चिह्न नाम ‘Hezekiah’ के बाद दिखता है, पर उसकी विषयवस्तु YHWH से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न को ‘याहवे’ के बाद रखा गया है।
