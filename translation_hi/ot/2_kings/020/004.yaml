base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
translation:
  language: hi
  text: 'और ऐसा हुआ कि यशायाह अभी मध्य आँगन[a] तक भी नहीं पहुँचा था कि याहवे का वचन उसके पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “मध्य नगर।” इस प्रसंग में इस पदबंध को परंपरागत रूप से राजमहल के किसी क्षेत्र या आँगन के रूप में समझा गया है; इसलिए मुख्य पाठ में “मध्य आँगन” है।'
    reason: मूल पदबंध के शाब्दिक अर्थ और प्रसंगानुसार मुख्य-पाठ के अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह कथात्मक वय्यिक्तोल कहानी में नया घटनाक्रम आरम्भ करता है। यह रूप इब्रानी की कथात्मक गति बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: इस व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और सुबोध रूप।
- source_word: לֹא יָצָא
  choice: अभी ... बाहर निकला भी न था
  rationale: पूर्ण क्रिया के साथ निषेध यहाँ अगले घटनाक्रम से पहले अधूरी रही क्रिया को व्यक्त करता है। यह हिन्दी संरचना कालक्रम और निषेध दोनों को स्पष्ट रखती है।
- source_word: הָעִיר הַתִּיכֹנָה
  choice: बीच वाला आँगन
  rationale: शाब्दिक अर्थ ‘बीच का नगर’ है, पर इस राजमहल-संबंधी प्रसंग में इसे परंपरागत रूप से आँगन अथवा प्रासाद-क्षेत्र समझा गया है। मुख्य पाठ में स्वाभाविक प्रासंगिक अर्थ रखा गया है और वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וּדְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह स्थापित भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है और संबंधवाचक इब्रानी संरचना को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम YHWH का हिन्दी लिप्यंतरण।
- source_word: הָיָה אֵלָיו
  choice: उसके पास पहुँचा
  rationale: ‘उसकी ओर हुआ’ का शाब्दिक रूप हिन्दी में अस्वाभाविक होगा; भविष्यद्वाणी के वचन के प्राप्त होने को ‘उसके पास पहुँचा’ स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में वाक्य के अंत का द्विबिंदु उसी कार्य को स्वाभाविक रूप से निभाता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘अभी ... निकला भी न था कि’ स्वाभाविक हिन्दी में घटनाओं की निकटता दिखाता है। पादटिप्पणी-चिह्न उसी पदबंध के साथ रखा गया है जिससे वह संबंधित है।
