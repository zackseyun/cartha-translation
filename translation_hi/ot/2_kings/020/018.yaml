source:
  edition: WLC
  text: וּ/מִ/בָּנֶ֜י/ךָ אֲשֶׁ֨ר יֵצְא֧וּ מִמְּ/ךָ֛ אֲשֶׁ֥ר תּוֹלִ֖יד יקח וְ/הָיוּ֙ סָֽרִיסִ֔ים בְּ/הֵיכַ֖ל מֶ֥לֶךְ בָּבֶֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
translation:
  language: hi
  text: और तेरे जो पुत्र तुझसे उत्पन्न होंगे, जिन्हें तू उत्पन्न करेगा, उनमें से कुछ को ले जाया जाएगा; और वे बाबेल के राजा के महल में खोजे[a] बनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दरबारी अधिकारी” अथवा “महल के अधिकारी”; इब्रानी शब्द का अर्थ वास्तविक खोजे भी हो सकता है और कुछ प्रसंगों में राजकीय अधिकारी भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  choice: तेरे ... पुत्रों में से कुछ
  rationale: מִן का प्रयोग यहाँ अंशसूचक है; इसलिए भाव है कि पुत्रों में से कुछ ले जाए जाएँगे। בנים के लिए विशिष्ट ‘पुत्र’ रखा गया है, व्यापक ‘वंशज’ नहीं।
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ
  choice: जो तुझसे उत्पन्न होंगे
  rationale: शाब्दिक रूप से ‘जो तुझसे निकलेंगे’ शारीरिक वंश को सूचित करने वाला मुहावरा है; आधुनिक हिन्दी में ‘तुझसे उत्पन्न होंगे’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: אֲשֶׁר תּוֹלִיד
  choice: जिन्हें तू जन्म देगा
  rationale: हिफ़ील रूप पुरुष को संबोधित करते हुए संतान उत्पन्न करने का अर्थ देता है। हिन्दी में ‘जन्म देगा’ पितृत्व-संबंधी अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: יקח (יִקַּח)
  choice: ले जाया जाएगा
  rationale: मसोराई पाठ में क्रिया रूपतः एकवचन सक्रिय है, पर कर्ता अनिर्दिष्ट/अव्यक्त है। हिन्दी का कर्मवाच्य किसी अनुपस्थित कर्ता को जोड़े बिना आशय व्यक्त करता है; संयुक्त वाक्य में ‘कुछ’ के साथ एकवचन ‘जाएगा’ स्वाभाविक है।
- source_word: וְהָיוּ
  choice: वे ... बनेंगे
  rationale: विधेय संज्ञा के साथ היה यहाँ नई अवस्था या पद प्राप्त करने का परिणाम सूचित कर सकता है; इसलिए ‘होंगे’ की अपेक्षा ‘बनेंगे’ प्रसंगानुकूल है।
- source_word: סָרִיסִים
  choice: खोजे
  rationale: शब्द का मूल और इस प्रसंग में गंभीर रूप से संभव अर्थ बधिया किए गए पुरुष हैं। चूँकि राजदरबार के प्रसंगों में इसका अर्थ ‘दरबारी अधिकारी’ भी हो सकता है, वह विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּהֵיכַל
  choice: महल में
  rationale: היכל मंदिर या राजमहल दोनों के लिए आ सकता है, पर ‘बाबेल के राजा’ के साथ यहाँ स्पष्ट अर्थ राजमहल है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: सम्बन्ध-संरचना का सीधा, प्रचलित और स्पष्ट हिन्दी रूप।
theological_decisions:
- issue: राजदरबार के प्रसंग में סָרִיסִים का अर्थ
  choice: मुख्य पाठ में ‘खोजे’
  alternative: ‘दरबारी अधिकारी’ या ‘महल के अधिकारी’
  rationale: इब्रानी पद वास्तविक खोजों और राजकीय अधिकारियों—दोनों को सूचित कर सकता है। इस न्याय-वाणी में शाब्दिक अर्थ शब्द के मूल अर्थ और प्रसंग की गंभीरता के अनुकूल है, पर अधिकारी वाला अर्थ भी वास्तविक भाषिक संभावना है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। संबोधन की एकवचन निकटता बनाए रखने के लिए ‘तेरे/तुझसे/तू’ प्रयुक्त हैं। ‘बाबेल’ मूल भौगोलिक नाम के निकट और हिन्दी बाइबलीय प्रयोग में परिचित रूप है।
