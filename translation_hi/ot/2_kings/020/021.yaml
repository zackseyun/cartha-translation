lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: שׁכב का मूल अर्थ ‘लेटना/सोना’ है; ‘अपने पुरखाओं के साथ’ के साथ प्रयुक्त होकर यह मृत्यु की पारंपरिक राजकीय अभिव्यक्ति है। ‘सो गया’ हिंदी में मूल बिंब और मृत्यु का आशय दोनों बनाए रखता है।
- source_word: עִם אֲבֹתָיו
