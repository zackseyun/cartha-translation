  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: hi
  text: देख, ऐसे दिन आनेवाले हैं जब तेरे घर में जो कुछ है, और जो कुछ तेरे पुरखाओं ने आज के दिन तक जमा करके रखा है, वह सब बाबेल को ले जाया जाएगा। कुछ भी बाकी न रहेगा—यह यहोवा की वाणी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: आगामी भविष्यवाणी की ओर तत्काल ध्यान खींचने वाले हिब्रू उद्गार का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: בְּבֵיתֶךָ
  choice: तेरे महल में
  rationale: राजा हिजकिय्याह से संबोधन के प्रसंग में בַּיִת केवल निजी घर नहीं, बल्कि राजमहल और उसके भंडारों को सूचित करता है।
- source_word: אָצְרוּ
  choice: जमा करके रखा है
  rationale: मूल क्रिया में बहुमूल्य वस्तुओं को संचित या भंडारित करने का भाव है; यह रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक रूप का अर्थ 'बाबेल को/ले जाया जाएगा' है; हिन्दी बाइबलीय भू-नाम 'बाबेल' रखा गया है।
- source_word: לֹא יִוָּתֵר דָּבָר
  choice: कुछ भी बाकी न रहेगा
  rationale: शाब्दिक 'एक वस्तु भी न बचेगी' के सर्वसमावेशी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָמַר יְהוָה
  choice: यह यहोवा की वाणी है
  rationale: भविष्यवाणी के दैवी घोषणासूत्र को गरिमापूर्ण और प्रचलित हिन्दी रूप में प्रस्तुत करता है तथा दिव्य नाम को नाम के रूप में बनाए रखता है।
theological_decisions:
- issue: भविष्यवाणी की निश्चितता
  choice: ले जाया जाएगा... बाकी न रहेगा
  alternative: ले जाया जा सकता है
  rationale: हिब्रू में कथन निश्चित भविष्यवाणी है, संभावना या सशर्त चेतावनी नहीं।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपस्थित व्यक्तिगत वाचा-नाम को स्पष्ट रूप से सुरक्षित रखा गया है; इसे उपाधि में बदलना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; राजा से एकवचन निकट संबोधन ('तेरे') मूल के व्याकरण और भविष्यवाणी की सीधी शैली को बनाए रखता है। भाषा सहज, गंभीर और सार्वजनिक पाठ के अनुकूल है।
