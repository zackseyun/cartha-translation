id: 2KI.20.3
reference: 2 Kings 20:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
translation:
  language: hi
  text: “हे याहवे, कृपा करके याद कर कि मैं तेरे सामने निष्ठा से[a] और पूरे मन से[b] चलता रहा हूँ, और मैंने वही किया है जो तेरी दृष्टि में अच्छा है।” तब हिजकिय्याह बहुत रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सच्चाई से।” इब्रानी शब्द सच्चाई अथवा निष्ठा, दोनों का भाव दे सकता है; यहाँ वह परमेश्वर के सामने हिजकिय्याह के निष्ठापूर्ण आचरण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “अविभाजित मन से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה ... נָא
  choice: कृपा करके
  rationale: दोनों विनय-सूचक पद प्रार्थना की गंभीर और आग्रहपूर्ण विनती व्यक्त करते हैं। हिन्दी में ‘कृपा करके’ इस भाव को स्वाभाविक ढंग से समेटता है, बिना दोहराव के।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: זְכָר
  choice: याद कर
  rationale: आज्ञार्थक क्रिया को सीधी विनती के रूप में रखा गया है। ‘याद कर’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में कृपापूर्वक ध्यान देने की याचना व्यक्त करता है।
- source_word: הִתְהַלַּכְתִּי לְפָנֶיךָ
  choice: मैं तेरे सामने ... चलता रहा हूँ
  rationale: जीवन-व्यवहार के लिए प्रयुक्त इब्रानी ‘चलने’ के रूपक को बनाए रखा गया है; ‘चलता रहा हूँ’ निरंतर आचरण का भाव देता है।
- source_word: בֶּאֱמֶת
  choice: निष्ठा से
  rationale: यहाँ אֱמֶת आचरण की सच्चाई और विश्वासयोग्यता को दर्शाता है। ‘निष्ठा से’ इस नैतिक और संबंधपरक भाव को सहज हिन्दी में व्यक्त करता है; ‘सच्चाई से’ को पादटिप्पणी में रखा गया है।
- source_word: וּבְלֵבָב שָׁלֵם
  choice: और पूरे मन से
  rationale: שָׁלֵם सम्पूर्णता और अखंड निष्ठा का संकेत देता है। ‘पूरे मन से’ स्वाभाविक हिन्दी है और निष्पाप सिद्धता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וְהַטּוֹב בְּעֵינֶיךָ עָשִׂיתִי
  choice: मैंने वही किया है जो तेरी दृष्टि में अच्छा है
  rationale: परमेश्वर के मूल्यांकन को केंद्र में रखने वाली इब्रानी अभिव्यक्ति को निकट और सुबोध रूप में सुरक्षित रखा गया है।
- source_word: וַיֵּבְךְּ חִזְקִיָּהוּ בְּכִי גָדוֹל
  choice: तब हिजकिय्याह बहुत रोया
  rationale: सजातीय संज्ञा के साथ גָדוֹל रोने की तीव्रता बताता है। ‘बहुत रोया’ उस बल को सीधे व्यक्त करता है और ‘फूट-फूटकर’ या ‘बिलखकर’ जैसी अतिरिक्त भाव-छटा नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। उसे उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- issue: हिजकिय्याह के आत्मवर्णन में שָׁלֵם का आशय
  choice: पूरे मन से
  alternative: अविभाजित मन से; सिद्ध मन से
  rationale: यह चुनाव हिजकिय्याह की संपूर्ण और अखंड निष्ठा के दावे को बनाए रखता है, पर इसे निष्पाप सिद्धता का दावा बनाकर तनाव को नहीं मिटाता।
- issue: אֱמֶת का नैतिक अर्थ
  choice: निष्ठा से
  alternative: सच्चाई से
  rationale: प्रसंग जीवन-व्यवहार का है, इसलिए ‘निष्ठा’ उपयुक्त है; फिर भी मूल शब्द की ‘सच्चाई’ वाली वास्तविक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर को संबोधित करते समय ‘तेरे’ रूप का प्रयोग निकटता और मूल इब्रानी के एकवचन संबोधन को व्यक्त करता है। ‘चलता रहा हूँ’ जैसे बाइबलीय रूपक को उसकी सहज बोधगम्यता के कारण सुरक्षित रखा गया है।
