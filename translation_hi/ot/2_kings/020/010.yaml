translation:
  language: hi
  text: तब हिजकिय्याह ने कहा, “छाया का दस सीढ़ियाँ आगे बढ़ना आसान है। नहीं, बल्कि छाया दस सीढ़ियाँ पीछे लौटे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस अंश।” इब्रानी शब्द का अर्थ “सीढ़ियाँ” या “चढ़ाव” है और संभवतः आहाज के छाया-यंत्र की सीढ़ियों या उसके चिह्नों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָקֵל
  choice: आसान है
  rationale: विशेषण का अर्थ ‘हल्का/सरल’ है; प्रसंग में ‘आसान है’ स्वाभाविक और सटीक हिन्दी है।
- source_word: הַצֵּל / לַצֵּל
  choice: छाया
  rationale: צֵל का सामान्य अर्थ ‘छाया’ है; हिन्दी में यहाँ निश्चितता प्रसंग से स्पष्ट है।
- source_word: לִנְטוֹת
  choice: आगे बढ़ना
  rationale: נטה का अर्थ फैलना, झुकना या बढ़ना हो सकता है। छाया की स्वाभाविक दिशा में गति और अगले वाक्य के ‘पीछे लौटे’ से विरोध को स्पष्ट रखने के लिए ‘आगे बढ़ना’ चुना गया है।
- source_word: מַעֲלוֹת
  choice: सीढ़ियाँ
  rationale: מַעֲלוֹת मूलतः चढ़ाव या सीढ़ियों को दर्शाता है। यहाँ गिनने योग्य छाया-चिह्न के रूप में ‘सीढ़ियाँ’ मूल बिंब को सुरक्षित रखता है; ‘अंश’ की संभावना पादटिप्पणी में दी गई है।
- source_word: לֹא כִּי
  choice: नहीं
  rationale: यह पहले विकल्प को अस्वीकार करके दूसरा विकल्प प्रस्तुत करता है। हिन्दी में विराम के बाद ‘नहीं’ इस तीखे विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָשׁוּב ... אֲחֹרַנִּית
  choice: पीछे लौटे
  rationale: שׁוב और दिशासूचक क्रिया-विशेषण मिलकर वापसी की गति बताते हैं; इच्छासूचक ‘लौटे’ हिजकिय्याह की माँग को व्यक्त करता है।
