source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְשַׁעְיָ֥הוּ הַ/נָּבִ֖יא אֶל יְהוָ֑ה וַ/יָּ֣שֶׁב אֶת הַ/צֵּ֗ל בַּֽ֠/מַּעֲלוֹת אֲשֶׁ֨ר יָרְדָ֜ה בְּ/מַעֲל֥וֹת אָחָ֛ז אֲחֹֽרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
translation:
  language: hi
  text: तब यशायाह नबी ने यहोवा को पुकारा, और उसने छाया को आहाज की सीढ़ियों पर दस सीढ़ियाँ[a] पीछे लौटा दिया, जिन पर वह नीचे उतरी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस अंश।” हिब्रू शब्द का अर्थ “सीढ़ियाँ/चढ़ाव” है। कुछ लोग इसे छाया मापने वाले सीढ़ीनुमा यंत्र का भाग समझते हैं; इसलिए परंपरागत अनुवादों में “आहाज की धूप-घड़ी” भी मिलता है।
    reason: मूल शब्द के वैकल्पिक अर्थ और आहाज से जुड़ी संरचना की अनिश्चित प्रकृति स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारा
  rationale: קרא के साथ אֶל־יְהוָה परमेश्वर को सहायता या प्रार्थना में पुकारने का भाव देता है। ‘पुकारा’ क्रिया की जीवंतता बनाए रखता है और मुख्य पाठ में ‘प्रार्थना की’ जैसी व्याख्यात्मक स्पष्टता नहीं जोड़ता।
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: यशायाह नबी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप और उपाधि का स्वाभाविक, संक्षिप्त अनुवाद।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के विशिष्ट वाचा-नाम का परिचित प्रत्यक्ष रूप; इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- source_word: וַיָּשֶׁב
  choice: पीछे लौटा दिया
  rationale: שׁוב का हिफ़ील रूप कारणवाचक है। यह पदबंध छाया को वापस कर देने की क्रिया और אֲחֹרַנִּית के उलटी दिशा वाले भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת הַצֵּל
  choice: छाया को
  rationale: यह कारणवाचक क्रिया का प्रत्यक्ष कर्म है और चिह्न में छाया की गति का वर्णन करता है।
- source_word: מַעֲלוֹת / עֶשֶׂר מַעֲלוֹת
  choice: सीढ़ियाँ / दस सीढ़ियाँ
  rationale: מַעֲלוֹת का मूल अर्थ चढ़ाव या सीढ़ियाँ है। यह चयन ‘अंश’ अथवा किसी निश्चित प्रकार की धूप-घड़ी जैसी ऐतिहासिक पुनर्रचना को मुख्य पाठ में नहीं थोपता।
- source_word: אֲשֶׁר יָרְדָה
  choice: उतनी ही, जितनी वह नीचे उतर गई थी
  rationale: यह छाया की पहले हुई नीचे की गति को बताता है। हिन्दी में यह रचना लौटाई गई दूरी और पहले उतरी दूरी का संबंध स्पष्ट और स्वाभाविक रखती है।
- source_word: בְּמַעֲלוֹת אָחָז
  choice: आहाज की सीढ़ियों पर
  rationale: संरचना को आहाज से संबद्ध रखता है, पर उसे अधिक विशिष्ट रूप से धूप-घड़ी या सीढ़ीनुमा मापक यंत्र घोषित नहीं करता।
- source_word: אֲחֹרַנִּית
  choice: पीछे
  rationale: विपरीत दिशा में गति का सहज आधुनिक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरीय ईश्वरीय नाम है। हिन्दी पाठ में उसे सामान्य उपाधि से बदलने के बजाय परिचित नामरूप ‘यहोवा’ रखा गया है।
- issue: וַיָּשֶׁב में कर्ता की पहचान
  choice: उसने
  alternative: यहोवा ने
  rationale: हिब्रू क्रिया में कर्ता अंतर्निहित है और निकटतम पूर्ववर्ती संदर्भ यहोवा की ओर संकेत करता है। सर्वनाम मूल की शैली और हल्की निहितता को बनाए रखता है, जबकि हिन्दी में संदर्भ पर्याप्त स्पष्ट है।
- issue: आहाज की מַעֲלוֹת की प्रकृति
  choice: आहाज की सीढ़ियाँ
  alternative: आहाज की सीढ़ीनुमा धूप-घड़ी; आहाज की धूप-घड़ी
  rationale: हिब्रू स्वयं ‘चढ़ाव/सीढ़ियाँ’ कहता है और यंत्र की ठीक बनावट स्पष्ट नहीं करता। इसलिए ऐतिहासिक पुनर्रचना को मुख्य पाठ में निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुकारा’ प्रार्थनात्मक संदर्भ को संकेतित करता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं करता। डैश के बाद की रचना हिब्रू के पुनरुक्त स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करती है।
