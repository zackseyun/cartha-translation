source:
  edition: WLC
  text: וַ/יָּבֹא֙ יְשַֽׁעְיָ֣הוּ הַ/נָּבִ֔יא אֶל הַ/מֶּ֖לֶךְ חִזְקִיָּ֑הוּ וַ/יֹּ֨אמֶר אֵלָ֜י/ו מָ֥ה אָמְר֣וּ הָ/אֲנָשִׁ֣ים הָ/אֵ֗לֶּה וּ/מֵ/אַ֨יִן֙ יָבֹ֣אוּ אֵלֶ֔י/ךָ וַ/יֹּ֨אמֶר֙ חִזְקִיָּ֔הוּ מֵ/אֶ֧רֶץ רְחוֹקָ֛ה בָּ֖אוּ מִ/בָּבֶֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/014.yaml
  text: Then Isaiah the prophet came to King Hezekiah and said to him[a], “What did these men say, and where did they come from to you?” And Hezekiah said, “They came to me from a distant land[b], from Babylon.”
translation:
  language: hi
  text: तब यशायाह नबी राजा हिजकिय्याह के पास आया और उससे पूछा,[a] “इन पुरुषों ने क्या कहा, और वे तुम्हारे पास कहाँ से आए?” हिजकिय्याह ने उत्तर दिया, “वे दूर देश से, बाबेल से आए हैं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और उससे कहा।” यहाँ आगे प्रश्न आने के कारण “पूछा” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “दूर देश” के बाद उसी स्थान को विशेष रूप से “बाबेल” कहा गया है; इससे हिजकिय्याह द्वारा पहले उनकी दूर की उत्पत्ति पर दिया गया बल बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  choice: यशायाह नबी
  rationale: नाम का प्रचलित हिन्दी रूप और נָבִיא के लिए सहज, सम्मानपूर्ण पदनाम रखा गया है।
- source_word: אֶל־הַמֶּלֶךְ חִזְקִיָּהוּ
  choice: राजा हिजकिय्याह के पास
  rationale: हिन्दी में पद और नाम का स्वाभाविक संयोजन; אֶל की दिशा ‘के पास’ से स्पष्ट होती है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: और उससे पूछा
  rationale: शाब्दिक अर्थ ‘और उससे कहा’ है, पर आगे प्रत्यक्ष प्रश्न होने के कारण ‘पूछा’ प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: מָה אָמְרוּ הָאֲנָשִׁים הָאֵלֶּה
  choice: इन पुरुषों ने क्या कहा
  rationale: पूर्ण क्रिया का भूतकालीन प्रश्न के रूप में अनुवाद किया गया और אֲנָשִׁים का पुरुषवाचक अर्थ बनाए रखा गया।
- source_word: וּמֵאַיִן יָבֹאוּ אֵלֶיךָ
  choice: और वे तुम्हारे पास कहाँ से आए
  rationale: इब्रानी अपूर्ण क्रिया रूप की संभावित वर्तमान छाया के बावजूद कथात्मक प्रसंग भूतकाल का समर्थन करता है; אֵלֶיךָ को स्पष्ट रूप से रखा गया है।
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: दूर देश से
  rationale: भौगोलिक दूरी का अर्थ संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में सुरक्षित है।
- source_word: מִבָּבֶל
  choice: बाबेल से
  rationale: स्थान-नाम का हिन्दी बाइबलीय रूप लिया गया है और पहले कही सामान्य उत्पत्ति ‘दूर देश’ को इसके द्वारा विशिष्ट किया गया है।
