  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
translation:
  language: hi
  text: तब उसने पूछा, “उन्होंने तुम्हारे घर[a] में क्या देखा?” हिजकिय्याह ने कहा, “उन्होंने मेरे घर में जो कुछ है, वह सब देखा। मेरे खज़ानों[b] में ऐसी कोई वस्तु नहीं थी जो मैंने उन्हें न दिखाई हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे महल में।” इब्रानी में शाब्दिक रूप से “तुम्हारे घर में।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरे भंडारघरों में।” इब्रानी शब्द उन स्थानों के लिए प्रयुक्त हो सकता है जहाँ मूल्यवान वस्तुएँ या अन्य सामग्री रखी जाती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: क्या
  rationale: यह यशायाह के सीधे प्रश्न को आरम्भ करने वाला सामान्य प्रश्नवाचक सर्वनाम है; आधुनिक हिन्दी में ‘क्या’ स्वाभाविक और सटीक है।
- source_word: רָאוּ
  choice: उन्होंने … देखा
  rationale: רָאָה का सामान्य अर्थ ‘देखना’ है। कथा के भूतकालीन प्रसंग और बहुवचन कर्ता को हिन्दी में स्पष्ट रखा गया है।
- source_word: בְּבֵיתֶךָ / בְּבֵיתִי
  choice: तुम्हारे घर में / मेरे घर में
  rationale: בַּיִת का मूल अर्थ ‘घर’ है। राजकीय प्रसंग में इसका अर्थ ‘महल’ भी हो सकता है, इसलिए मूल अर्थ मुख्य पाठ में और प्रसंगगत विकल्प पादटिप्पणी में रखा गया है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: यह नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण है।
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  choice: मेरे घर में जो कुछ है, वह सब
  rationale: כָּל אֲשֶׁר की समग्रता और इब्रानी संबंधवाचक रचना दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא הָיָה דָבָר
  choice: ऐसी कोई वस्तु नहीं थी
  rationale: इब्रानी अस्तित्ववाचक निषेध का सहज हिन्दी रूप है; ‘वस्तु’ यहाँ घर और भंडारों की दिखाई गई सामग्री को सूचित करता है।
- source_word: אֲשֶׁר לֹא הִרְאִיתִם
  choice: जो मैंने उन्हें न दिखाई हो
  rationale: הִרְאָה, ראה का हिफ़ील रूप, ‘दिखाना’ अर्थात किसी को देखने देना है; प्रत्यय में निहित बहुवचन ‘उन्हें’ स्पष्ट रखा गया है।
- source_word: בְּאֹצְרֹתָי
  choice: मेरे खज़ानों में
  rationale: אֹצָר मूल्यवान वस्तुओं या सामग्री के भंडारण-स्थान को दर्शाता है। राजकीय संपत्ति के इस प्रसंग में ‘खज़ाने’ उपयुक्त है, जबकि व्यापक विकल्प ‘भंडारघर’ पादटिप्पणी में दिया गया है।
