  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। आरम्भिक इब्रानी सर्वनाम को ‘उसने’ ही रखा गया है ताकि मूल की संदर्भ-निर्भरता बनी रहे। प्रत्यक्ष कथन स्पष्ट और सामान्य पाठकों के लिए सुबोध है; ‘घर/महल’ तथा ‘खज़ाने/भंडारघर’ की वास्तविक lexical ambiguity पादटिप्पणियों में सुरक्षित रखी गई है।
