source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: The rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: हिजकिय्याह के बाकी काम, उसका सारा पराक्रम, और यह कि उसने किस प्रकार जलाशय[a] और जल-नाली[b] बनाकर पानी नगर में पहुँचाया[c]—क्या ये सब यहूदा के राजाओं के इतिहास की पुस्तक में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कुंड’; इब्रानी शब्द किसी बनाए हुए जल-कुंड या हौज को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जल-मार्ग’; इब्रानी शब्द पानी ले जाने वाली नहर या निर्मित मार्ग को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: संभवतः यह यरूशलेम में हिजकिय्याह द्वारा बनवाई गई प्रसिद्ध जल-व्यवस्था की ओर संकेत करता है; 2 इतिहास 32:30 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: बाकी काम
  rationale: यह राजकीय इतिहास-वर्णन का प्रचलित समापन-सूत्र है। ‘बाकी काम’ सामान्य पाठक के लिए स्वाभाविक है और राजा के अन्य कार्यों तथा उपलब्धियों का व्यापक अर्थ व्यक्त करता है।
- source_word: גְּבוּרָתוֹ
  choice: उसका सारा पराक्रम
  rationale: यह शब्द सामर्थ्य, वीरता या सामर्थ्यपूर्ण उपलब्धियों को सूचित कर सकता है। ‘पराक्रम’ मूल की संक्षिप्त अमूर्त अभिव्यक्ति और उसके व्यापक अर्थ को बनाए रखता है।
- source_word: וַאֲשֶׁר עָשָׂה
  choice: और यह कि उसने किस प्रकार ... बनाया
  rationale: यह वाक्यांश हिजकिय्याह के पराक्रम के एक ठोस उदाहरण का परिचय देता है। ‘यह कि उसने किस प्रकार’ हिन्दी में अगली अभियांत्रिक उपलब्धियों से सहज रूप से जुड़ता है।
- source_word: הַבְּרֵכָה
  choice: जलाशय
  rationale: इब्रानी शब्द निर्मित जल-कुंड या पानी जमा करने के हौज को दर्शा सकता है। ‘जलाशय’ प्रसंग में स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַתְּעָלָה
  choice: जल-नाली
  rationale: यह पानी ले जाने वाले मार्ग या निर्मित चैनल को दर्शाता है। ‘जल-नाली’ आधुनिक हिन्दी में समझने योग्य है और जल-व्यवस्था के अभियांत्रिक प्रसंग को स्पष्ट रखता है।
- source_word: וַיָּבֵא אֶת־הַמַּיִם הָעִירָה
  choice: पानी नगर में पहुँचाया
  rationale: עִירָה का दिशासूचक रूप नगर के भीतर की ओर गति बताता है। ‘पहुँचाया’ कारक क्रिया का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या ये सब ... लिखे नहीं हैं?
  rationale: मूल के आलंकारिक प्रश्न और राजाओं की पुस्तक के पारंपरिक समापन-सूत्र को बनाए रखा गया है। ‘ये सब’ पूर्ववर्ती कार्यों और उपलब्धियों को सामूहिक रूप से संदर्भित करता है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक
  rationale: यह यहूदा के राजाओं से संबंधित राजकीय अभिलेख के शीर्षक का संकेत है। ‘इतिहास की पुस्तक’ हिन्दी में स्वाभाविक है और इसे बाइबिल की ‘इतिहास’ नामक किसी पुस्तक के रूप में अनावश्यक रूप से निश्चित नहीं करता।
