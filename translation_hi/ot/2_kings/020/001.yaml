base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
translation:
  language: hi
  text: 'उन दिनों हिजकिय्याह ऐसा बीमार पड़ा कि मरने पर था। तब आमोत्स का पुत्र यशायाह नबी उसके पास आया और उससे कहा, “याहवे यह कहते हैं: अपने घराने की व्यवस्था कर ले, क्योंकि तू मरने वाला है[a]; तू जीवित नहीं रहेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “क्योंकि तू मर रहा है” या “क्योंकि तू मरा हुआ है”; हिब्रू अभिव्यक्ति निश्चित और आसन्न मृत्यु की घोषणा करती है।
    reason: शाब्दिक विकल्प और हिब्रू विधेय रूप का बल स्पष्ट करना।
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह कथा की समय-भूमिका बताने वाला स्वाभाविक और निकट हिंदी मुहावरा है।
- source_word: חָלָה ... לָמוּת
  choice: ऐसा बीमार पड़ा कि मरने पर था
  rationale: यह बीमारी के आरम्भ और उसकी प्राणघातक गंभीरता—दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יְשַׁעְיָהוּ בֶן אָמוֹץ הַנָּבִיא
  choice: आमोस का पुत्र यशायाह नबी
  rationale: नाम, वंश-संबंध और नबी की उपाधि को स्पष्ट तथा हिंदी के स्वाभाविक क्रम में रखा गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यह कहते हैं
  rationale: भविष्यद्वक्ताओं के संदेश-सूत्र को स्वाभाविक हिंदी में व्यक्त करते हुए परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित किया गया है।
- source_word: צַו לְבֵיתֶךָ
  choice: अपने घराने की व्यवस्था कर ले
  rationale: शाब्दिक आदेश देने की धारणा को आसन्न मृत्यु से पहले परिवार और घरेलू मामलों के लिए आवश्यक प्रबंध करने वाले मुहावरे के रूप में व्यक्त करता है।
- source_word: כִּי מֵת אַתָּה
  choice: क्योंकि तू मरने वाला है
  rationale: हिब्रू के विधेय कृदंत की निश्चित और आसन्न मृत्यु की घोषणा को बिना यह कहे व्यक्त करता है कि मृत्यु पहले ही हो चुकी है।
- source_word: וְלֹא תִחְיֶה
  choice: तू जीवित नहीं रहेगा
  rationale: मूल के सीधे निषेध को बनाए रखता है; इसे केवल बीमारी से न चंगाई पाने तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में प्रयुक्त चार-अक्षरी व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका हिंदी लिप्यंतरण किया गया है।
- issue: मृत्यु की घोषणा का काल और बल
  choice: तू मरने वाला है
  alternative: तू मर जाएगा / तू मर रहा है / तू मर चुका है
  rationale: यह आसन्न और निश्चित मृत्यु की घोषणा को सुरक्षित रखता है, पर हिब्रू अभिव्यक्ति को पूर्ण हो चुकी मृत्यु नहीं मानता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में एकवचन ‘तू’ प्राचीन प्रत्यक्ष दैवी वाणी के अनुरूप है; वाक्य के आरम्भ में अनावश्यक ‘और’ नहीं जोड़ा गया।
