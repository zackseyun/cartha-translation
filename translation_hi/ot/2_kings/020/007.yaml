  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
translation:
  language: hi
  text: तब यशायाह ने कहा, “अंजीरों की एक टिकिया लो।” उन्होंने उसे लिया और फोड़े पर लगा दिया, और वह स्वस्थ हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “और वह जीवित हुआ”; इस प्रसंग में इसका अर्थ है कि वह स्वस्थ हो गया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: קְחוּ
  choice: लो
  rationale: לקח के बहुवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी समतुल्य; हिन्दी में यह रूप आदरार्थक अथवा बहुवचन दोनों हो सकता है।
- source_word: דְּבֶלֶת תְּאֵנִים
  choice: अंजीरों की एक टिकिया
  rationale: דְּבֶלֶת दबाकर बनाए गए पिंड या टिकिया को और תְּאֵנִים अंजीरों को बताता है; यह अभिव्यक्ति ठोस अर्थ को सरल हिन्दी में रखती है।
- source_word: וַיִּקְחוּ
  choice: इसलिए उन्होंने उसे लेकर
  rationale: बहुवचन कर्ता मूल में निहित है और कर्म पिछली आज्ञा से समझा जाता है; ‘इसलिए’ आज्ञा के प्रत्युत्तर में हुई क्रिया को स्वाभाविक रूप से जोड़ता है।
- source_word: וַיָּשִׂימוּ עַל
  choice: पर रखा
  rationale: שׂים का सामान्य अर्थ रखना है और עַל स्थान-संबंधी ‘पर’ है; चिकित्सा-संदर्भ में यह सहज हिन्दी है।
- source_word: הַשְּׁחִין
  choice: फोड़े
  rationale: שְׁחִין सूजे हुए त्वचा-घाव, फोड़े या व्रण को सूचित कर सकता है; ‘फोड़ा’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है।
- source_word: וַיֶּחִי
  choice: और वह स्वस्थ हो गया
  rationale: חיה का शाब्दिक अर्थ ‘जीवित हुआ/जिया’ है, पर रोग-निवारण के इस प्रसंग में इसका स्वाभाविक आशय स्वास्थ्य-लाभ है।
theological_decisions:
- issue: וַיֶּחִי में स्वास्थ्य-लाभ का स्वरूप
  choice: वह स्वस्थ हो गया
  alternative: वह जीवित हुआ / वह जी उठा
  rationale: प्रसंग हिजकिय्याह की बीमारी और फोड़े पर उपचार लगाने का है, इसलिए क्रिया यहाँ शारीरिक स्वास्थ्य-लाभ व्यक्त करती है। पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है और पुनरुत्थान जैसा अतिरिक्त अर्थ आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘अंजीरों की टिकिया’ दबाकर बनाए गए अंजीर-पिंड को सामान्य पाठक के लिए स्पष्ट करती है। केवल उस वास्तविक अर्थांतर पर पादटिप्पणी दी गई है जिसे मुख्य अनुवाद स्वाभाविक हिन्दी के लिए प्रसंगानुसार व्यक्त करता है।
