base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
translation:
  language: hi
  text: हिजकिय्याह ने उनकी बात सुनी[a] और उन्हें अपना सारा खजाना[b] दिखाया—चाँदी, सोना, सुगंध-द्रव्य, उत्तम तेल, अपना शस्त्रागार[c], और वह सब कुछ जो उसके भंडारों में था। उसके घर में या उसके सारे राज्य में ऐसी कोई वस्तु नहीं थी जो हिजकिय्याह ने उन्हें न दिखाई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी बात पर ध्यान दिया” अथवा “उनका अनुकूल स्वागत किया”; इब्रानी मुहावरे में किसी को सुनने या उसकी बात मानने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपनी बहुमूल्य वस्तुओं का भंडार”; शाब्दिक अर्थ “अपनी बहुमूल्य वस्तुओं का घर” है।
    reason: lexical_alternative
  - marker: c
    text: या “अपने उपकरणों का भंडार”; शाब्दिक अर्थ “अपने सामान का घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  choice: ने उनकी बात सुनी
  rationale: यह इब्रानी मुहावरा केवल ध्वनि सुनने से अधिक, किसी की बात पर ध्यान देने या उसे अनुकूल रूप से ग्रहण करने का भाव दे सकता है। हिंदी में ‘उनकी बात सुनी’ इस व्यापकता को स्वाभाविक रूप से बनाए रखता है।
- source_word: וַיַּרְאֵם / הֶרְאָם
  choice: उन्हें ... दिखाया
  rationale: ראה के हिफ़ील रूप का सामान्य अर्थ ‘दिखाना’ है; पद में दोनों occurrences को एकरूप रखा गया है।
- source_word: בֵּית נְכֹתֹה
  choice: अपना पूरा बहुमूल्य वस्तुओं का भंडार
  rationale: पदबंध मूल्यवान वस्तुओं को रखने के स्थान को सूचित करता है। ‘बहुमूल्य वस्तुओं का भंडार’ अर्थ को स्पष्ट रखता है और आगे दी गई वस्तु-सूची से मेल खाता है।
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: चाँदी, सोना
  rationale: यहाँ मूल्यवान धातुएँ अभिप्रेत हैं; ‘चाँदी’ को आधुनिक मुद्रा के अर्थ वाले ‘पैसे’ से अलग रखा गया है।
- source_word: הַבְּשָׂמִים
  choice: सुगंध-द्रव्य
  rationale: बहुवचन शब्द मूल्यवान सुगंधित या खुशबूदार पदार्थों के लिए व्यापक रूप से प्रयुक्त हो सकता है; ‘सुगंध-द्रव्य’ मसालों या इत्र में से केवल एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שֶׁמֶן הַטּוֹב
  choice: उत्तम तेल
  rationale: यह शाब्दिक ‘अच्छा तेल’ के गुणवत्ता-सूचक भाव को सहज और गरिमापूर्ण हिंदी में व्यक्त करता है, उपयोग को अधिक विशिष्ट नहीं बनाता।
- source_word: בֵּית כֵּלָיו
  choice: अपना शस्त्रागार
  rationale: शाब्दिक रूप से यह ‘उसके उपकरणों/सामान का घर’ है; राजकीय सूची के संदर्भ में हथियारों या सैन्य साज-सामान का भंडार संभावित है। मुख्य पाठ में स्वाभाविक ‘शस्त्रागार’ रखा गया और व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: כָּל אֲשֶׁר נִמְצָא בְּאֹצְרֹתָיו
  choice: वह सब कुछ जो उसके भंडारों में था
  rationale: נמצא का अस्तित्वसूचक भाव हिंदी के सहज ‘था’ से व्यक्त किया गया है; אֹצָר के बहुवचन को ‘भंडारों’ से सुरक्षित रखा गया है।
- source_word: לֹא הָיָה דָבָר אֲשֶׁר לֹא הֶרְאָם
  choice: ऐसी कोई वस्तु नहीं थी जिसे ... न दिखाया हो
  rationale: इब्रानी के दोहरे निषेध को हिंदी में उसी जोर और स्वाभाविक वाक्य-विन्यास के साथ रखा गया है।
- source_word: בְּבֵיתוֹ
  choice: उसके भवन में
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है। राजकीय संदर्भ के कारण ‘भवन’ स्वाभाविक है, पर ‘महल’ कहकर अर्थ को अत्यधिक सीमित नहीं किया गया।
- source_word: בְכָל מֶמְשַׁלְתּוֹ
  choice: उसके पूरे राज्य-क्षेत्र में
  rationale: מֶמְשָׁלָה शासन, अधिकार-क्षेत्र या अधीन प्रदेश को सूचित करता है। ‘राज्य-क्षेत्र’ हिजकिय्याह के शासनाधीन पूरे क्षेत्र का भाव देता है, बिना इसे केवल प्रशासनिक राज्य-संज्ञा बनाने के।
