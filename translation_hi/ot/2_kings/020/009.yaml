base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
translation:
  language: hi
  text: 'यशायाह ने कहा, “याहवे की ओर से तुम्हारे लिए यह चिन्ह है कि याहवे अपनी कही हुई बात पूरी करेगा: क्या छाया दस सीढ़ियाँ[a] आगे बढ़े, या दस सीढ़ियाँ पीछे लौटे?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सीढ़ियाँ” का अनुवाद “पायदान” या परंपरागत रूप से “अंश” भी किया जाता है। इब्रानी शब्द का मूल अर्थ चढ़ाव या सीढ़ियाँ है; यहाँ छाया की गति आहाज से संबंधित सीढ़ियों या किसी संरचना पर होने का संकेत है, पर उसकी ठीक प्रकृति निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: चिन्ह
  rationale: אוֹת यहाँ हिजकिय्याह को दिया गया पुष्टि-सूचक चमत्कारी चिन्ह है; ‘चिन्ह’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: מֵאֵת יְהוָה
  choice: याहवे की ओर से
  rationale: מֵאֵת स्रोत या उद्गम बताता है; ‘की ओर से’ हिन्दी में यही संबंध स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: כִּי यहाँ चिन्ह की विषय-वस्तु प्रस्तुत करता है—याहवे अपनी कही बात पूरी करेगा।
- source_word: יַעֲשֶׂה ... אֶת הַדָּבָר אֲשֶׁר דִּבֵּר
  choice: अपनी कही हुई बात पूरी करेगा
  rationale: शाब्दिक ‘उस बात को करेगा जो उसने कही’ की अपेक्षा यह स्वाभाविक हिन्दी है और कथन के पूरा किए जाने का अर्थ सुरक्षित रखती है।
- source_word: הָלַךְ הַצֵּל
  choice: छाया ... आगे बढ़े
  rationale: रूप की दृष्टि से הָלַךְ पूर्ण क्रिया है, पर विकल्प प्रस्तुत करने वाले प्रश्न में भावी/विधिलिंग अर्थ देता है; ‘आगे बढ़े’ अगले יָשׁוּב के साथ गति-विरोध स्पष्ट करता है।
- source_word: מַעֲלוֹת
  choice: सीढ़ियाँ
  rationale: מַעֲלוֹת का मूल अर्थ चढ़ाव या सीढ़ियाँ है। प्रसंग में छाया से जुड़े आहाज के उपकरण की संरचना पूरी तरह निश्चित नहीं, इसलिए व्याख्यात्मक ‘अंश’ के बजाय स्रोत-निकट ‘सीढ़ियाँ’ रखा गया है।
- source_word: אִם
  choice: या
  rationale: यहाँ אִם प्रश्न के दूसरे विकल्प का परिचय देता है; हिन्दी में ‘या’ स्वाभाविक है।
- source_word: יָשׁוּב
  choice: पीछे लौटे
  rationale: שׁוּב लौटने या वापस मुड़ने को व्यक्त करता है; छाया की उलटी गति के लिए ‘पीछे लौटे’ स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी विशिष्ट नाम יְהוָה दो बार है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्न की दोनों संभावनाएँ तथा उपकरण की संरचना संबंधी मूल पाठ की अनिश्चितता सुरक्षित रखी गई है।
