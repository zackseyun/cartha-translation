base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
translation:
  language: hi
  text: तब हिल्कियाह के पुत्र एल्याकीम, शेबना और योआह ने रबशाके से कहा, “कृपया अपने सेवकों से अरामी भाषा में बात कीजिए, क्योंकि हम उसे समझते हैं। शहरपनाह पर मौजूद लोगों के सुनते हुए हमसे यहूदा की भाषा[a] में बात न कीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इब्रानी भाषा में।” इब्रानी शब्द יְהוּדִית का शाब्दिक अर्थ “यहूदा की” है और वह यहूदा में बोली जाने वाली भाषा को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: अश्शूरी पद के ठीक दायित्व को निश्चित रूप से पुनर्निर्मित करने के बजाय पारंपरिक उपाधि का लिप्यंतरण रखा गया है।
- source_word: דַּבֶּר נָא
  choice: कृपया ... बात कीजिए
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र अनुरोध व्यक्त करता है; यह आधुनिक हिन्दी में उसी भाव को स्वाभाविक रूप से देता है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों से
  rationale: यह राजनयिक प्रसंग में आत्म-विनम्रता की दरबारी अभिव्यक्ति है; ‘सेवक’ अनावश्यक रूप से दासत्व का अर्थ आरोपित नहीं करता।
- source_word: אֲרָמִית
  choice: अरामी भाषा में
  rationale: यह रूप यहाँ भाषा बताने वाले क्रियाविशेषण की तरह प्रयुक्त है; हिन्दी में भाषा का उल्लेख स्पष्ट करना स्वाभाविक है।
- source_word: כִּי שֹׁמְעִים אֲנָחְנוּ
  choice: क्योंकि हम उसे समझते हैं
  rationale: שׁמע का मूल अर्थ ‘सुनना’ हो सकता है, पर भाषा-ज्ञान के इस प्रसंग में अभिप्राय ‘समझना’ है।
- source_word: יְהוּדִית
  choice: यहूदा की भाषा
  rationale: मूल शब्द यहूदा की भाषा या बोली को सूचित करता है। यह अनुवाद आधुनिक तकनीकी भाषा-नाम को मूल में आरोपित किए बिना भौगोलिक अर्थ बचाता है।
- source_word: בְּאָזְנֵי
  choice: के सुनते हुए
  rationale: शाब्दिक मुहावरा ‘कानों में’ है; हिन्दी अभिव्यक्ति श्रव्यता के भाव को स्वाभाविक ढंग से बनाए रखती है।
- source_word: הָעָם אֲשֶׁר עַל הַחֹמָה
  choice: शहरपनाह पर मौजूद लोगों
  rationale: मूल में सामान्य शब्द ‘लोग’ है, केवल सैनिक नहीं; ‘मौजूद’ दृश्य को स्पष्ट रखते हुए संबंधवाचक उपवाक्य का स्वाभाविक हिन्दी रूप देता है।
- source_word: וַיֹּאמֶר ... אֶל
  choice: तब ... ने ... से कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी कथात्मक क्रम को स्वाभाविक रूप से व्यक्त करता है।
