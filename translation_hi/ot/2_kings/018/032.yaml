id: 2KI.18.32
reference: 2 Kings 18:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
translation:
  language: hi
  text: जब तक मैं आकर तुम्हें तुम्हारे अपने देश जैसे एक देश में न ले जाऊँ—अनाज और नए दाखरस का देश[a], रोटी और दाख की बारियों का देश, जैतून के तेल और शहद का देश[b]—ताकि तुम जीवित रहो और न मरो। हिजकिय्याह की मत सुनो, क्योंकि वह यह कहकर तुम्हें बहका रहा है, ‘याहवे हमें छुड़ाएगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनाज और दाखरस का देश”; תִּירוֹשׁ विशेष रूप से ताज़े अथवा नए दाखरस का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में जैतून और तेल से संबंधित अभिव्यक्ति संक्षिप्त है; इसका आशय जैतून से मिलने वाला तेल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד בֹּאִי
  choice: जब तक मैं आकर
  rationale: यह पदबंध भविष्य के उस समय तक की सीमा बताता है जब वक्ता आएगा; हिंदी में ‘जब तक मैं आकर’ आगे के क्रियापद के साथ स्वाभाविक है।
- source_word: וְלָקַחְתִּי אֶתְכֶם
  choice: तुम्हें ... न ले जाऊँ
  rationale: לקח का मूल अर्थ ‘लेना’ है; निर्वासन के संदर्भ में ‘ले जाऊँ’ स्थानांतरण का भाव स्पष्ट करता है, बिना बलपूर्वकता को अनावश्यक रूप से बढ़ाए।
- source_word: אֶל אֶרֶץ כְּאַרְצְכֶם
  choice: तुम्हारे अपने देश जैसे एक देश में
  rationale: כְ तुलना व्यक्त करता है। ‘अपने’ वक्ता के प्रलोभनपूर्ण आश्वासन को स्वाभाविक हिंदी में उभारता है कि नया देश यहूदा जैसा होगा।
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  choice: अनाज और नए दाखरस का देश
  rationale: דגן व्यापक रूप से अनाज है; תירוש प्रायः ताज़े या नए दाखरस को सूचित करता है, इसलिए केवल ‘दाखरस’ के बजाय विशिष्ट अर्थ रखा गया है।
- source_word: אֶרֶץ לֶחֶם וּכְרָמִים
  choice: रोटी और दाख की बारियों का देश
  rationale: לחם का ठोस अर्थ ‘रोटी’ और כרמים का अर्थ दाख की बारियाँ है; कृषि-समृद्धि की छवि सुरक्षित रखी गई है।
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  choice: जैतून के तेल और शहद का देश
  rationale: इब्रानी पदबंध संक्षिप्त है और जैतून से मिलने वाले तेल की ओर संकेत करता है। यह हिंदी में स्वाभाविक अर्थ देता है; संपीड़ित मूल अभिव्यक्ति को पादटिप्पणी में बताया गया है।
- source_word: וִחְיוּ וְלֹא תָמֻתוּ
  choice: ताकि तुम जीवित रहो और न मरो
  rationale: संयोजित आज्ञार्थक रूप संदर्भ में परिणाम अथवा उद्देश्य का आग्रह व्यक्त करते हैं; ‘ताकि’ उस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  choice: हिजकिय्याह की मत सुनो
  rationale: שמע אל यहाँ किसी की बात मानने या उस पर ध्यान देने का अर्थ रखता है; ‘की मत सुनो’ सहज आधुनिक हिंदी है।
- source_word: כִּי יַסִּית אֶתְכֶם
  choice: क्योंकि वह ... तुम्हें बहका रहा है
  rationale: Hiphil रूप יַסִּית उकसाने, फुसलाने या भटकाने का भाव रखता है। ‘बहका रहा है’ आरोप की मनोवैज्ञानिक प्रकृति व्यक्त करता है, पर उसे निश्चित ‘धोखा’ कहकर अधिक तीखा नहीं बनाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: יַצִּילֵנוּ
  choice: हमें छुड़ाएगा
  rationale: Hiphil נצל संकट या शत्रु के हाथ से बचाने/छुड़ाने का अर्थ रखता है; सैन्य संदर्भ में ‘छुड़ाएगा’ उपयुक्त और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: יַצִּילֵנוּ में उद्धार का आशय
  choice: हमें छुड़ाएगा
  alternative: हमें बचाएगा
  rationale: संदर्भ अश्शूरी घेराबंदी और सैन्य संकट का है। ‘छुड़ाएगा’ इस ठोस संकट से मुक्ति और व्यापक धार्मिक प्रतिध्वनि—दोनों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देश’ की आवृत्ति मूल की वक्तृत्वपूर्ण समृद्धि-सूची को बनाए रखती है। डैश सूची की सीमाएँ स्पष्ट करते हैं। सभी पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
