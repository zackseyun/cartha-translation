  terminology: 'Key terms are suitable: ‘अनाज,’ ‘नए दाखरस,’ ‘दाख की बारियाँ,’ and ‘जैतून के तेल’ convey the agricultural vocabulary naturally. ‘हिजकिय्याह’ is a defensible Hindi form of the name. ‘याहवे’ consistently renders the divine name, and ‘हमें छुड़ाएगा’ appropriately conveys military deliverance.'
