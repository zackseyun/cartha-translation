  source_fidelity: 'The Hindi accurately represents the Hebrew sequence: the speaker will come and take the hearers to a land comparable to theirs, followed by the fourfold abundance description, the appeal to live rather than die, and the warning not to heed Hezekiah''s claim that Yahweh will deliver them. The comparative force of כְ (‘जैसे’) and the accusatory, potentially misleading force of יַסִּית (‘बहका रहा है’) are retained without overstatement.'
