base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/031.yaml
  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
translation:
  language: hi
  text: 'हिजकिय्याह की बात मत सुनो, क्योंकि अश्शूर का राजा यह कहता है: मेरे साथ संधि कर लो[a] और निकलकर मेरे पास आ जाओ, और तुममें से हर एक अपनी ही दाखलता और अपने ही अंजीर के पेड़ से खाए, और अपने ही हौज का पानी पीए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे साथ एक आशीष करो”; यह संधि करने या समझौते पर आने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְעוּ אֶל
  choice: की बात सुनो
  rationale: שׁמע के साथ אֶל का अर्थ यहाँ किसी की बात सुनना या उस पर ध्यान देना है। ‘की बात मत सुनो’ आधुनिक हिन्दी में स्वाभाविक है और ‘आज्ञा मानो’ जैसा अधिक व्याख्यात्मक अर्थ नहीं थोपता।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के परिचित और स्रोत-ध्वनि के निकट रूप में लिप्यंतरित किया गया है।
- source_word: כִּי כֹה אָמַר מֶלֶךְ אַשּׁוּר
  choice: क्योंकि अश्शूर का राजा यह कहता है
  rationale: प्रत्यक्ष कथन प्रस्तुत करने वाले हिब्रू सूत्र को स्पष्ट, वर्तमान और स्वाभाविक हिन्दी में रखा गया है।
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  choice: मेरे साथ संधि कर लो
  rationale: शाब्दिक अभिव्यक्ति ‘मेरे साथ आशीष करो’ इस राजनीतिक प्रसंग में समझौता या अनुकूल शर्तों पर संधि करने का मुहावरा है। ‘संधि कर लो’ अर्थ को स्पष्ट करता है; असामान्य शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וּצְאוּ אֵלַי
  choice: निकलकर मेरे पास आ जाओ
  rationale: मूल क्रिया के ठोस अर्थ ‘बाहर निकलना’ को बनाए रखा गया है। घेराबंदी के प्रसंग में समर्पण निहित है, पर उसे मुख्य पाठ में स्पष्ट रूप से जोड़कर अस्पष्टता समाप्त नहीं की गई।
- source_word: וְאִכְלוּ אִישׁ גַּפְנוֹ וְאִישׁ תְּאֵנָתוֹ
  choice: तुममें से हर एक अपनी ही दाखलता और अपने ही अंजीर के पेड़ का फल खाएगा
  rationale: वितरणात्मक אִישׁ को स्वाभाविक हिन्दी ‘हर एक’ से व्यक्त किया गया है। ‘फल’ की पूर्ति हिन्दी में दाखलता और पेड़ से खाने की बात को सहज बनाती है।
- source_word: וּשְׁתוּ אִישׁ מֵי בוֹרוֹ
  choice: अपने ही हौज का पानी पिएगा
  rationale: בּוֹר यहाँ वर्षाजल या संग्रहित जल रखने वाले कुंड/हौज को सूचित करता है, न कि आवश्यक रूप से भूजल वाले कुएँ को। ‘हौज’ सामान्य हिन्दी में अपेक्षाकृत सटीक और समझने योग्य है।
theological_decisions:
- issue: वितरणात्मक पुल्लिंग संज्ञा אִישׁ
  choice: तुममें से हर एक
  alternative: हर पुरुष; प्रत्येक जन
  rationale: यहाँ אִישׁ व्याकरणिक रूप से पुल्लिंग होते हुए समूह के सदस्यों को वितरणात्मक ढंग से दर्शाता है। ‘हर एक’ हिन्दी में उसी प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से केवल वयस्क पुरुषों तक अर्थ सीमित नहीं करता।
- issue: राजनीतिक मुहावरा עֲשׂוּ אִתִּי בְרָכָה
  choice: मेरे साथ संधि कर लो
  alternative: मेरे साथ आशीष करो; मेरे साथ समझौता कर लो; मेरे साथ मेल कर लो
  rationale: प्रसंग अश्शूरी राजा की ओर से आत्मसमर्पण की अनुकूल शर्तों का प्रस्ताव है। ‘संधि’ राजनीतिक स्वर को व्यक्त करती है, जबकि मूल की असामान्य ‘आशीष’ शब्दावली पादटिप्पणी में दी गई है।
- issue: וּצְאוּ אֵלַי में निहित समर्पण
  choice: निकलकर मेरे पास आ जाओ
  alternative: मेरे सामने आत्मसमर्पण कर दो
  rationale: घेराबंदी के संदर्भ में समर्पण निहित है, फिर भी हिब्रू सीधे ‘बाहर निकलकर मेरे पास आने’ को कहता है। मुख्य पाठ ठोस क्रिया को सुरक्षित रखता है और निहितार्थ को निर्णायक व्याख्या में नहीं बदलता।
