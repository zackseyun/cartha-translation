    reason: lexical_alternative
lexical_decisions:
- source_word: הַהַצֵּל הִצִּילוּ
  choice: कभी छुड़ा पाया है
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute प्रश्न में जोरदार चुनौती व्यक्त करता है। ‘कभी छुड़ा पाया है’ हिंदी में उस आलंकारिक और उपहासपूर्ण बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהֵי הַגּוֹיִם
  choice: जाति-जाति के देवताओं
  rationale: बहुवचन construct और הַגּוֹיִם को वितरक ढंग से प्रस्तुत किया गया है; यह विभिन्न जातियों के अपने-अपने देवताओं की ओर संकेत करता है।
- source_word: אִישׁ
  choice: कोई भी
  rationale: यहाँ אִישׁ का प्रयोग वितरक अर्थ में है। नकारात्मक उत्तर की अपेक्षा रखने वाले प्रश्न में ‘कोई भी’ स्वाभाविक हिंदी है और हर देवता को अलग-अलग चुनौती देने का भाव बनाए रखता है।
- source_word: אֶת אַרְצוֹ
  choice: अपने देश को
  rationale: एकवचन प्रत्यय वितरक है—हर देवता का अपना संबंधित देश। हिंदी का ‘अपने देश’ इस संबंध को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: स्रोत का ‘हाथ’ वाला बिंब सुरक्षित रखा गया है; हिंदी में भी यह किसी की शक्ति या अधिकार से छुड़ाने का समझ में आने वाला बाइबलीय मुहावरा है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: इब्रानी construct का सीधा और प्रचलित हिंदी रूप।
