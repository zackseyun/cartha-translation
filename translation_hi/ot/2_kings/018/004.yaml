base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
translation:
  language: hi
  text: उसने ऊँचे पूजा-स्थानों को हटा दिया, पूजा के खंभों को तोड़ डाला, अशेरा को काट गिराया[a], और काँसे के उस साँप को चूर-चूर कर दिया जिसे मूसा ने बनाया था; क्योंकि उन दिनों तक इस्राएल के पुत्र उसे धूप चढ़ाते थे। उसे नहुश्तान कहा जाता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशेरा के खंभे को काट गिराया” अथवा “पवित्र खंभे को काट गिराया।”
    reason: lexical_alternative
  - marker: b
    text: “नहुश्तान” संभवतः “काँसा” शब्द पर आधारित शब्द-क्रीड़ा है और इसका भाव “काँसे का एक मामूली टुकड़ा” जैसा हो सकता है। या, “उसने उसका नाम नहुश्तान रखा।” हिब्रू में नाम रखने वाला कर्ता स्पष्ट नहीं है।
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  choice: पूजा के ऊँचे स्थान
  rationale: यह स्थानीय उपासना-स्थलों के लिए प्रचलित पारिभाषिक शब्द है। केवल ‘ऊँचे स्थान’ आधुनिक हिन्दी में अस्पष्ट हो सकता है, इसलिए ‘पूजा के’ जोड़कर धार्मिक आशय स्पष्ट किया गया है।
- source_word: הַמַּצֵּבֹת
  choice: पूजा के खम्भे
  rationale: यह खड़े किए गए पवित्र अथवा धार्मिक पत्थरों को सूचित करता है। ‘पूजा के खम्भे’ सामान्य पाठक के लिए अर्थ स्पष्ट रखते हुए वस्तु के धार्मिक उपयोग को व्यक्त करता है।
- source_word: כָרַת ... הָאֲשֵׁרָה
  choice: अशेरा को काट गिराया
  rationale: अशेरा यहाँ काटी जा सकने वाली उपासना-वस्तु को सूचित करता है। नाम का लिप्यन्तरण प्राचीन धार्मिक संदर्भ को सुरक्षित रखता है और उसे अनावश्यक रूप से केवल ‘खम्भा’ नहीं बनाता।
- source_word: כִתַּת
  choice: चूर-चूर कर दिया
  rationale: क्रिया साधारण तोड़ने से अधिक पूर्ण विनाश दर्शाती है; यह हिन्दी प्रयोग उसकी तीव्रता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  choice: काँसे का साँप
  rationale: शाब्दिक अर्थ धातु से बना साँप है। ‘काँसा’ और ‘साँप’ वर्तमान सामान्य हिन्दी में स्वाभाविक और स्पष्ट हैं।
- source_word: מְקַטְּרִים לוֹ
  choice: उसके लिए धूप जलाते थे
  rationale: यह धूप अथवा बलि का धुआँ चढ़ाने की क्रिया है। ‘धूप जलाना’ हिन्दी में इस उपासना-कर्म का स्पष्ट और सहज वर्णन है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल की पारिवारिक अभिव्यक्ति को औपचारिक समानता के साथ रखा गया है, यद्यपि सन्दर्भ में इससे इस्राएली समुदाय अभिप्रेत है।
- source_word: וַיִּקְרָא לוֹ נְחֻשְׁתָּן
  choice: उसका नाम नहुश्तान रखा गया था
  rationale: हिब्रू में कर्ता स्पष्ट नहीं है। हिन्दी का भाववाच्य कर्ता निश्चित किए बिना नामकरण की बात व्यक्त करता है।
theological_decisions:
- issue: אֲשֵׁרָה का आशय
  choice: मुख्य पाठ में ‘अशेरा’
  alternative: ‘अशेरा का खम्भा’ अथवा ‘पवित्र खम्भा’
  rationale: सन्दर्भ में भौतिक उपासना-वस्तु स्पष्ट है, पर शब्द को केवल एक प्रकार के खम्भे तक सीमित करना मूल की सांस्कृतिक और धार्मिक विशेषता को समतल कर सकता है।
- issue: וַיִּקְרָא का कर्ता
  choice: 'कर्ता-विहीन भाववाच्य: ‘उसका नाम ... रखा गया था’'
  alternative: ‘उसने उसका नाम नहुश्तान रखा’—जहाँ हिजकिय्याह कर्ता माना जाए
  rationale: हिब्रू का एकवचन कर्ता व्यक्त नहीं है। भाववाच्य अनिश्चितता को सुरक्षित रखता है और नाम देने वाले की पहचान पर अनावश्यक निर्णय नहीं करता।
- issue: नहुश्तान में शब्द-क्रीड़ा
  choice: नाम को लिप्यन्तरित करके सांस्कृतिक टिप्पणी देना
  alternative: मुख्य पाठ में ‘काँसे का एक टुकड़ा’ जैसा अर्थ खोल देना
  rationale: नाम सम्भवतः ‘काँसा’ से सम्बद्ध तिरस्कारपूर्ण शब्द-क्रीड़ा है, पर उसका सटीक अर्थ अनिश्चित है; इसलिए अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
