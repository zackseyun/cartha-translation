base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: In the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
translation:
  language: hi
  text: इस्राएल के राजा एला के पुत्र होशे के शासन के तीसरे वर्ष में, आहाज का पुत्र हिजकिय्याह यहूदा का राजा बना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज करने लगा।” हिब्रू का यह राजकीय सूत्र हिजकिय्याह के सिंहासनारोहण, अर्थात् उसके शासन के आरंभ, को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग आरंभिक शब्द के बिना वाक्य में समाहित]'
  rationale: यहाँ यह रूप नए वृत्तांत की ओर संक्रमण कराता है। आधुनिक हिन्दी में ‘और ऐसा हुआ’ अनावश्यक रूप से कृत्रिम लगेगा; वाक्य का सीधा आरंभ इसके कथात्मक कार्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּשְׁנַת שָׁלֹשׁ
  choice: तीसरे वर्ष में
  rationale: यह राजाओं के काल-निर्धारण का प्रचलित सूत्र है; क्रमवाचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: לְהוֹשֵׁעַ בֶּן אֵלָה
  choice: एला के पुत्र होशे के शासन के
  rationale: לְ यहाँ होशे के राजकाल को वर्ष-गणना का आधार बनाता है। ‘शासन’ स्रोत में निहित राजकीय संदर्भ को हिन्दी में स्पष्ट करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: होशे के पद और राज्य की सीधी पहचान।
- source_word: מָלַךְ
  choice: राज करने लगा
  rationale: राजकीय अभिलेख के इस सूत्र में क्रिया केवल सामान्य शासन नहीं, बल्कि सिंहासनारोहण अथवा शासन के आरंभ को बताती है।
- source_word: חִזְקִיָּה
  choice: हिजकिय्याह
  rationale: हिब्रू नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: בֶן אָחָז
  choice: आहाज का पुत्र
  rationale: पिता-पुत्र की पहचान को सीधे रूप में व्यक्त किया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा आहाज
  rationale: हिब्रू शब्दक्रम में यह पदबंध निकटवर्ती आहाज का विशेषण बन सकता है। हिन्दी में इसे उसी प्रकार रखना स्वाभाविक है; हिजकिय्याह के यहूदा पर शासन का आरंभ मुख्य क्रिया से स्पष्ट है।
theological_decisions:
- issue: מֶלֶךְ יְהוּדָה पदबंध का संबंध
  choice: इसे निकटवर्ती ‘आहाज’ से जोड़कर ‘यहूदा के राजा आहाज’ किया गया है।
  alternative: ‘हिजकिय्याह यहूदा का राजा बना’
  rationale: हिब्रू शब्दक्रम निकटवर्ती आहाज के साथ विशेषणात्मक संबंध की अनुमति देता है, जबकि मुख्य क्रिया हिजकिय्याह के शासनारंभ को बताती है। चुना हुआ रूप किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ता और राजवंशीय पहचान को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘राज करने लगा’ राजकीय सूत्र का स्वाभाविक हिन्दी रूप है; आरंभ में कृत्रिम ‘और ऐसा हुआ’ नहीं जोड़ा गया।
