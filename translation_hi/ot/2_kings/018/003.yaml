reference: 2 Kings 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
translation:
  language: hi
  text: उसने वही किया जो यहोवा की दृष्टि में सही था, ठीक वैसे ही जैसे उसके पूर्वज[a] दाऊद ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “उसके पिता दाऊद” है। यहाँ “पिता” का अर्थ दाऊदी वंश का पूर्वज है, तत्काल पिता नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वाव-सहित क़ाल wayyiqtol कथा की अगली क्रिया बताता है; आधुनिक हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: הַיָּשָׁר
  choice: वही ... जो ... सही था
  rationale: संज्ञात्मक रूप में प्रयुक्त विशेषण का अर्थ ‘जो सही था’ है; ‘वही’ तुलनात्मक अनुकरण के भाव के साथ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह अभिव्यक्ति यहोवा के मूल्यांकन के अनुसार सही होने का भाव देती है; ‘की दृष्टि में’ हिन्दी में स्वाभाविक रूप से मूल मुहावरे को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: ठीक वैसे ही जैसे ... ने किया था
  rationale: כְּ और כֹל ... אֲשֶׁר आदर्श के पूर्ण अनुरूप होने की तुलना व्यक्त करते हैं; ‘ठीक वैसे ही जैसे’ इसे स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: דָּוִד אָבִיו
  choice: उसके पूर्वज दाऊद
  rationale: यहाँ אָבִיו तत्काल पिता नहीं, दाऊदी वंश के पूर्वज को सूचित करता है। हिन्दी में ‘पिता’ तत्काल जनक समझा जा सकता है, इसलिए अर्थगत शुद्धता के लिए ‘पूर्वज’ चुना गया है और मूल शब्द-प्रयोग फुटनोट में बताया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिन्दी में पहचाने जाने योग्य नामरूप से रखा गया है।
- issue: दाऊद के लिए אָבִיו का वंशगत अर्थ
  choice: मुख्य पाठ में ‘पूर्वज’
  alternative: ‘पिता’, साथ में व्याख्यात्मक फुटनोट
  rationale: हिजकिय्याह का तत्काल पिता दाऊद नहीं था। ‘पूर्वज’ इस प्रसंग में शब्द का अभिप्रेत वंशगत अर्थ स्पष्ट करता है, जबकि फुटनोट मूल के शाब्दिक ‘पिता’ को सुरक्षित रखता है।
- issue: दाऊद के आचरण से पूर्ण अनुरूपता
  choice: ‘ठीक वैसे ही जैसे’
  alternative: ‘उन सब कामों के अनुसार जो’
  rationale: मूल כְּכֹל अनुकरण के व्यापक मानक को व्यक्त करता है। यह राजकीय मूल्यांकन की भाषा है; इसे इस दावे से अधिक विशिष्ट या निरपेक्ष नहीं बनाया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दृष्टि में’ मूल इब्रानी मुहावरे को स्वाभाविक ढंग से बनाए रखता है। ‘पूर्वज’ ऐतिहासिक भ्रम से बचाता है, और फुटनोट शाब्दिक वंशगत सूत्र को दर्ज करता है।
