base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
translation:
  language: hi
  text: 'राजा यों कहता है: हिजकिय्याह को तुम्हें धोखा देने मत दो,[a] क्योंकि वह तुम्हें उसके हाथ से छुड़ा नहीं सकेगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे तुम्हें बहकाने मत दो।” इब्रानी क्रिया का अर्थ भटका देना या धोखा देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके हाथ से”; यह किसी के अधिकार या वश में होने का मुहावरा है। यशायाह 36:14 के समानांतर पाठ में “मेरे हाथ से” है।
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह राजकीय घोषणा का सूत्र है। ‘यों कहता है’ मूल की औपचारिकता को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल में उपाधि ही दी गई है, व्यक्तिगत नाम नहीं; इसलिए ‘राजा’ रखा गया है।
- source_word: אַל יַשִּׁיא לָכֶם
  choice: तुम्हें धोखा न देने दो
  rationale: हिफ़ील रूप यहाँ बहकाने या धोखा देने का भाव व्यक्त करता है। यह वाक्य आरोप लगाता है कि हिजकिय्याह झूठा भरोसा दिला रहा है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כִּי לֹא יוּכַל
  choice: क्योंकि वह … नहीं सकेगा
  rationale: כִּי कारण प्रस्तुत करता है और अपूर्ण क्रिया भविष्य की असमर्थता व्यक्त करती है।
- source_word: לְהַצִּיל
  choice: छुड़ा
  rationale: सैन्य और राजनैतिक संकट में किसी के अधिकार या खतरे से बचा निकालने का अर्थ देता है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: मूल के तीसरे पुरुष एकवचन प्रत्यय और ‘हाथ’ के सामर्थ्य/अधिकार-वाचक मुहावरे को सुरक्षित रखा गया है।
theological_decisions:
- issue: מִיָּדוֹ में ‘उसके हाथ’ का संदर्भ
  choice: ‘उसके हाथ से’—निकटतम उल्लिखित व्यक्ति, राजा, की ओर संकेत
  alternative: ‘मेरे हाथ से,’ जैसा यशायाह 36:14 के समानांतर पाठ में है; अथवा अर्थ खोलकर ‘उसके अधिकार से’
  rationale: दिए गए WLC पाठ में स्पष्ट रूप से तीसरे पुरुष एकवचन ‘उसके’ है। अनुवाद ने यशायाह के समानांतर पाठ से सामंजस्य बैठाने के बजाय प्रस्तुत इब्रानी पाठ का अनुसरण किया है और वास्तविक पाठांतर को टिप्पणी में बताया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक घोषणा के अनुरूप रखी गई है। ‘यों कहता है’ राजकीय सूत्र की औपचारिकता बचाता है। ‘उसके हाथ से’ मूल मुहावरे और पाठगत तनाव को बनाए रखता है; व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
