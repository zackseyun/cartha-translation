source:
  edition: WLC
  text: וְ/כִי תֹאמְר֣וּ/ן אֵלַ֔/י אֶל יְהוָ֥ה אֱלֹהֵ֖י/נוּ בָּטָ֑חְנוּ הֲ/לוֹא ה֗וּא אֲשֶׁ֨ר הֵסִ֤יר חִזְקִיָּ֨הוּ֙ אֶת בָּמֹתָ֣י/ו וְ/אֶת מִזְבְּחֹתָ֔י/ו וַ/יֹּ֤אמֶר לִֽ/יהוּדָה֙ וְ/לִ/יר֣וּשָׁלִַ֔ם לִ/פְנֵי֙ הַ/מִּזְבֵּ֣חַ הַ/זֶּ֔ה תִּֽשְׁתַּחֲו֖וּ בִּ/ירוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/022.yaml
  text: But if you say to me, ‘We trust in the LORD our God,’ is it not he whose high places and whose altars Hezekiah has removed, saying to Judah and to Jerusalem, ‘You shall worship before this altar in Jerusalem’?”
translation:
  language: hi
  text: पर यदि तुम मुझसे कहो, ‘हम अपने परमेश्वर याहवे पर भरोसा रखते हैं,’ तो क्या यह वही नहीं है जिसके ऊँचे स्थानों और वेदियों को हिजकिय्याह ने हटा दिया और यहूदा और यरूशलेम से कहा, ‘तुम यरूशलेम में इसी वेदी के सामने दण्डवत् करोगे’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य हिंदी पाठक के लिए प्रचलित लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: בָּמֹתָיו
  choice: उसके ऊँचे स्थानों
  rationale: במה का औपचारिक अर्थ ‘ऊँचा स्थान’ रखा गया है; संदर्भ में ये उपासना-स्थल हैं, पर वक्ता की धार्मिक गलतफहमी को अनुवाद में सुधारा नहीं गया।
- source_word: מִזְבְּחֹתָיו
  choice: उसकी वेदियों
  rationale: מזבח के लिए स्वाभाविक और स्थापित हिंदी धार्मिक शब्द ‘वेदी’ चुना गया है।
- source_word: תִּשְׁתַּחֲווּ
  choice: दण्डवत् करना
  rationale: क्रिया का मूल भाव झुककर उपासना करना है; ‘दण्डवत् करना’ शारीरिक भंगिमा और उपासना दोनों को संक्षेप में व्यक्त करता है।
- source_word: לִפְנֵי הַמִּזְבֵּחַ הַזֶּה
  choice: इसी वेदी के सामने
  rationale: לִפְנֵי का स्थानगत अर्थ ‘के सामने’ और הַזֶּה का संकेतात्मक बल ‘इसी’ से व्यक्त किया गया है।
theological_decisions:
- issue: रबशाके द्वारा हिजकिय्याह के सुधारों को याहवे के उपासना-स्थलों का विनाश बताना
  choice: वक्ता के आरोप को ज्यों का त्यों रखा गया
  alternative: स्पष्टीकरण जोड़ना कि हटाए गए स्थान अनुचित उपासना-स्थल थे
  rationale: मूल कथन वक्ता की दृष्टि और उसकी धार्मिक गलतफहमी को प्रस्तुत करता है; अनुवाद को उसे चुपचाप ठीक नहीं करना चाहिए।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: व्यक्तिगत नाम को नाम के रूप में बनाए रखने से ‘अपने परमेश्वर’ के साथ मूल की पहचान स्पष्ट रहती है और उपाधि में रूपांतरित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधी और मौखिक चुनौती के अनुरूप भाषा रखी गई है। वाक्य की व्यंग्यात्मक प्रश्नवाचक संरचना तथा उद्धरण के भीतर उद्धरण सुरक्षित हैं।
