  to: और हिजकिय्याह तुम्हें याहवे पर भरोसा करने के लिए यह कहकर प्रेरित न करे, ‘याहवे निश्चय ही हमें बचाएगा, और यह नगर अश्शूर के राजा के हाथ में नहीं दिया जाएगा।’
  rationale: The revision retains the source's causative prohibition, emphatic assurance, passive construction, and concrete ‘hand’ idiom. It replaces the potentially pejorative ‘उकसाए’ with neutral ‘प्रेरित न करे’ and aligns both occurrences of the divine name with the POB rendering policy reflected in the English audit trail.
