  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
translation:
  language: hi
  text: और हिजकिय्याह तुम्हें याहवे पर भरोसा करने के लिए यह कहकर प्रेरित न करे, ‘याहवे निश्चय ही हमें बचाएगा, और यह नगर अश्शूर के राजा के हाथ में नहीं दिया जाएगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  choice: तुम्हें ... भरोसा करने के लिए ... न उकसाए
  rationale: בטח के हिफ़ील रूप और कर्म-सर्वनाम का प्रेरणार्थक भाव सुरक्षित रखा गया है। ‘उकसाए’ प्रसंग में रबशाके की चेतावनी का स्वर और हिजकिय्याह द्वारा लोगों को भरोसा दिलाने का अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֶל יְהוָה
  choice: यहोवा पर
  rationale: בטח के साथ אֶל का लक्ष्यवाचक अर्थ हिंदी मुहावरे ‘पर भरोसा करना’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को शीर्षक से बदलने के बजाय हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֵאמֹר
  choice: यह कहकर
  rationale: उद्धरण आरंभ कराने वाले रूप को प्रसंगानुकूल, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַצֵּל יַצִּילֵנוּ
  choice: निश्चय ही हमें बचाएगा
  rationale: क्रिया के साथ infinitive absolute से आए प्रबल निश्चय को ‘निश्चय ही’ द्वारा सुरक्षित रखा गया है।
- source_word: וְלֹא תִנָּתֵן
  choice: नहीं दिया जाएगा
  rationale: נתן के निफ़ाल अर्थात कर्मवाच्य रूप को औपचारिक निकटता के साथ रखा गया है।
- source_word: הָעִיר הַזֹּאת
  choice: यह नगर
  rationale: संज्ञा और संकेतवाचक विशेषण का सीधा, स्वाभाविक हिंदी रूप।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: इब्रानी सैन्य-राजनीतिक मुहावरे की ठोस छवि सुरक्षित रहती है और हिंदी में शत्रु के अधिकार में जाने का अर्थ स्पष्ट है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: प्राचीन साम्राज्य אַשּׁוּר के लिए प्रचलित हिंदी बाइबलीय नाम।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिंदी के व्यापक बाइबलीय प्रयोग और सामान्य पाठकीय पहचान के कारण ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसे पदनाम से नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रेरणार्थक क्रिया, उद्धरण का emphatic दावा और ‘हाथ में दिया जाना’ वाला इब्रानी मुहावरा सुरक्षित रखा गया है।
