source:
  edition: WLC
  text: וְ/הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ בְּ/כֹ֥ל אֲשֶׁר יֵצֵ֖א יַשְׂכִּ֑יל וַ/יִּמְרֹ֥ד בְּ/מֶֽלֶךְ אַשּׁ֖וּר וְ/לֹ֥א עֲבָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
translation:
  language: hi
  text: और यहोवा उसके साथ था। जहाँ कहीं भी वह जाता, वहाँ सफल होता था। उसने अश्शूर के राजा के विरुद्ध विद्रोह किया और उसकी सेवा नहीं की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य आधुनिक हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְהָיָה ... עִמּוֹ
  choice: उसके साथ था
  rationale: यह इब्रानी मुहावरा निरंतर दैवी उपस्थिति और अनुग्रह व्यक्त करता है; हिन्दी में यह स्वाभाविक और निकट समतुल्य है।
- source_word: בְּכֹל אֲשֶׁר יֵצֵא
  choice: वह जहाँ कहीं जाता
  rationale: शाब्दिक भाव ‘हर उस बात में जिसमें वह निकलता’ है; प्रसंग में यह उसके अभियानों और कार्यों को व्यापक रूप से दर्शाता है।
- source_word: יַשְׂכִּיל
  choice: सफल होता था
  rationale: हिफ़ील रूप में शब्द बुद्धिमानी से काम करने और फलतः सफल होने—दोनों भाव रख सकता है; राजकीय कथा में परिणाम का भाव प्रमुख है, जबकि पादटिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: וַיִּמְרֹד
  choice: विद्रोह किया
  rationale: साम्राज्यवादी सत्ता के विरुद्ध राजनीतिक बगावत के लिए सीधा और प्रचलित हिन्दी रूप।
- source_word: בְּמֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा के विरुद्ध
  rationale: राजनीतिक विरोध के लक्ष्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא עֲבָדוֹ
  choice: उसकी अधीनता में नहीं रहा
  rationale: शाब्दिक अर्थ ‘उसकी सेवा नहीं की’ है, पर इस राजनीतिक प्रसंग में आशय जागीरदार के रूप में अधीन रहना और सेवा/कर देना है; चुना हुआ रूप आधुनिक पाठक तक वही अर्थ पहुँचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखते हुए इसे पदवी ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: עבד के राजनीतिक अर्थ का निरूपण
  choice: उसकी अधीनता में नहीं रहा
  alternative: उसकी सेवा नहीं की
  rationale: यहाँ धार्मिक सेवा नहीं, अश्शूर के राजा के प्रति राजनीतिक जागीरदारी अभिप्रेत है; इसलिए ऐसा रूप चुना गया जो प्रसंग स्पष्ट करे, बिना विद्रोह की प्रकृति में अतिरिक्त विवरण जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। ‘अश्शूर’ पारंपरिक बाइबलीय स्थान-नाम है। अपूर्ण भूतकालीन ‘जाता’ और ‘होता था’ निरंतर/बार-बार होने वाले भाव को व्यक्त करते हैं।
