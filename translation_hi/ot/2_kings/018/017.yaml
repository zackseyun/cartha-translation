  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। विदेशी प्रशासनिक पदों की अनिश्चितता लिप्यंतरण द्वारा सुरक्षित रखी गई है और इब्रानी पाठ की दोहराई गई गति को अत्यधिक समतल नहीं किया गया।
