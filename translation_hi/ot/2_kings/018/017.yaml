  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
translation:
  language: hi
  text: तब अश्शूर के राजा ने लाकीश से तर्तान, रब-सारीस और रब-शाके[a] को एक विशाल सेना के साथ यरूशलेम में राजा हिजकिय्याह के पास भेजा। वे चढ़कर यरूशलेम आए; वे चढ़कर आए और ऊपरी जलाशय की नहर के पास खड़े हो गए, जो धोबी के खेत के मार्ग पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तर्तान,” “रब-सारीस” और “रब-शाके” संभवतः अश्शूरी अधिकारियों की पदवियाँ थीं, व्यक्तिगत नाम नहीं। इनके संभावित अर्थ क्रमशः “प्रधान सेनापति,” “प्रधान अधिकारी” और “प्रधान पानपात्र-वाहक” अथवा कोई अन्य उच्च अधिकारी हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  choice: तर्तान / रब-सारीस / रब-शाके
  rationale: ये संभवतः अश्शूरी पदवियाँ हैं, व्यक्तिगत नाम नहीं। इनके कार्यों के सटीक अर्थ अनिश्चित हैं, इसलिए मुख्य पाठ में लिप्यंतरण और पादटिप्पणी में संभावित अर्थ दिए गए हैं।
- source_word: בְּחֵיל כָּבֵד
  choice: एक विशाल सेना के साथ
  rationale: यहाँ חַיִל सैन्य बल और כָּבֵד उसके बड़े या प्रबल होने का बोध कराता है। यह हिन्दी में स्वाभाविक तथा प्रसंगानुकूल है।
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ
  choice: वे चढ़कर ... आए
  rationale: यरूशलेम की ओर चढ़ने के भौगोलिक भाव और इब्रानी क्रियाक्रम को बनाए रखा गया है।
- source_word: וַיַּעֲלוּ וַיָּבֹאוּ וַיַּעַמְדוּ
  choice: वे चढ़कर आए और ... खड़े हो गए
  rationale: मूल पाठ की पुनरुक्ति को यथासंभव बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक रखा गया है।
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  choice: ऊपरी जलाशय की नहर
  rationale: תְעָלָה जल की नहर और בְּרֵכָה यहाँ जल-संग्रह के स्थान को दर्शाता है; 'जलाशय' आधुनिक हिन्दी में स्पष्ट है।
- source_word: מְסִלַּת
  choice: सड़क
  rationale: निर्मित मार्ग के अर्थ को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: שְׂדֵה כוֹבֵס
  choice: धोबी का खेत
  rationale: כּוֹבֵס कपड़ा धोने या साफ करने वाले व्यक्ति को दर्शाता है; 'धोबी' सहज आधुनिक हिन्दी समतुल्य है।
