  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
translation:
  language: hi
  text: 'तब यहूदा के राजा हिजकिय्याह ने लाकीश में अश्शूर के राजा के पास[a] यह संदेश भेजा: “मैंने पाप किया है। मुझसे हट जा। तू मुझ पर जो कुछ लगाएगा, उसे मैं उठाऊँगा[b]।” तब अश्शूर के राजा ने यहूदा के राजा हिजकिय्याह पर तीन सौ किक्कार चाँदी और तीस किक्कार सोना लगाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अश्शूर के राजा को लाकीश की ओर।” इब्रानी रूप ‘लाकीश को/की ओर’ गति भी सूचित कर सकता है; पर प्रसंग में सम्भवतः यह बताता है कि अश्शूर का राजा लाकीश में था।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मुझ पर जो कुछ रखेगा, उसे मैं सहूँगा/चुकाऊँगा।” इब्रानी में लगाए गए भार या कर को उठाने की भाषा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: यह संदेश भेजा
  rationale: שלח का मूल अर्थ ‘भेजना’ है; प्रत्यक्ष कथन के कारण यहाँ संदेश या दूत निहित हैं। हिन्दी में ‘यह संदेश भेजा’ संप्रेषण को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: לָכִישָׁה
  choice: लाकीश में ... के पास
  rationale: दिशासूचक ה गति को ‘लाकीश को’ बता सकता है, पर प्रसंग में अश्शूर का राजा लाकीश में था। मुख्य पाठ स्वाभाविक स्थानगत अर्थ देता है और पादटिप्पणी रूपगत विकल्प बचाती है।
- source_word: חָטָאתִי
  choice: मैंने अपराध किया है
  rationale: חטא नैतिक दोष या पाप का सामान्य शब्द है, पर राजनीतिक अधीनता के इस कथन में ‘अपराध किया’ उसका नैतिक बल बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שׁוּב מֵעָלַי
  choice: मुझ पर से लौट जा
  rationale: यह निकट-औपचारिक अनुवाद विरोधी दबाव या चढ़ाई हटाने का बोध देता है और मूल की ‘लौटने’ वाली छवि बनाए रखता है।
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי
  choice: तू मुझ पर जो कुछ लगाएगा
  rationale: נתן על यहाँ किसी बोझ, कर या दंड को लगाने का व्यापक अर्थ रखता है; अनुवाद इसे केवल कर या जुर्माना कहकर सीमित नहीं करता।
- source_word: אֶשָּׂא
  choice: उसे मैं उठाऊँगा
  rationale: נשא का शाब्दिक अर्थ उठाना या वहन करना है; यहाँ भुगतान सहित लगाए गए भार को स्वीकार करना अभिप्रेत है। हिन्दी में मूल रूपक संरक्षित है।
- source_word: וַיָּשֶׂם ... עַל
  choice: पर ... लगाया
  rationale: שׂים על किसी दायित्व या कर को आरोपित करने के लिए प्रयुक्त है। ‘लगाया’ पहले कथन के साथ शब्दगत संगति रखता है।
- source_word: כִּכַּר
  choice: किक्कार
  rationale: यह प्राचीन भार-माप है। पारंपरिक हिन्दी बाइबलीय रूप ‘किक्कार’ स्रोत की माप-इकाई को आधुनिक अनुमान में बदले बिना सुरक्षित रखता है।
- source_word: כֶּסֶף / זָהָב
  choice: चाँदी / सोना
  rationale: दोनों धातुएँ भार के अनुसार दिए जाने वाले कर को सूचित करती हैं; सीधे हिन्दी समतुल्य सटीक हैं।
theological_decisions:
- issue: हिजकिय्याह की स्वीकारोक्ति का नैतिक बल
  choice: ‘मैंने अपराध किया है’
  alternative: ‘मैंने पाप किया है’ / ‘मुझसे भूल हुई है’
  rationale: राजनयिक प्रसंग में ‘अपराध किया’ स्वाभाविक है और חטא के वास्तविक नैतिक दोष को बनाए रखता है; ‘भूल’ इसे हल्का कर देती, जबकि ‘पाप’ हिन्दी पाठक को प्रसंग से अधिक स्पष्ट धार्मिक स्वीकारोक्ति की ओर ले जा सकता है।
- issue: लगाए गए भार की प्रकृति
  choice: ‘जो कुछ लगाएगा, उसे मैं उठाऊँगा’
  alternative: ‘जो कर लगाएगा, मैं चुका दूँगा’
  rationale: मूल पहले व्यापक बोझ-वहन की भाषा रखता है और अगला वाक्य उसे धनराशि के रूप में स्पष्ट करता है। मुख्य पाठ में ‘कर’ या ‘चुकाना’ जोड़ना अर्थ को समय से पहले संकीर्ण करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। राजाओं के बीच प्रत्यक्ष संबोधन में एकवचन ‘तू’ मूल की संख्या और प्राचीन राजकीय भाषण की सीधाई रखता है। ‘किक्कार’ प्राचीन भार-इकाई के रूप में रखा गया है।
