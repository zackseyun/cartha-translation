base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
translation:
  language: hi
  text: तब उन्होंने राजा को पुकारा, और हिल्किय्याह का पुत्र एल्याकीम, जो राजमहल का प्रभारी था,[a] शेबना राजकीय लिपिक[b] और आसाप का पुत्र योआह, अभिलेख अधिकारी, निकलकर उनके पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “जो घराने के ऊपर था”; यह एक उच्च प्रशासनिक पदवी थी। इसका अनुवाद “राजघराने का अधिकारी” भी किया जा सकता है।
    reason: cultural_note
  - marker: b
    text: इस पदवी का अनुवाद “सचिव” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  choice: उन्होंने राजा को पुकारा
  rationale: קרא के साथ אֶל का मूल भाव किसी की ओर पुकारना है। हिन्दी में ‘राजा को पुकारा’ स्वाभाविक है और इसे अनावश्यक रूप से औपचारिक बुलावे में नहीं बदलता।
- source_word: וַיֵּצֵא אֲלֵהֶם
  choice: निकलकर उनके पास आए
  rationale: יצא का अर्थ ‘निकलना’ है और אֲלֵהֶם गंतव्य बताता है। हिन्दी में प्रतिनिधिमंडल की ओर दृष्टिकोण रखते हुए बहुवचन कर्ताओं के लिए ‘उनके पास आए’ स्वाभाविक है।
- source_word: אֶלְיָקִים בֶּן חִלְקִיָּהוּ
  choice: हिल्किय्याह का पुत्र एल्याकीम
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और हिब्रू पितृनाम संबंध को स्पष्ट हिन्दी में रखा गया है।
- source_word: אֲשֶׁר עַל הַבָּיִת
  choice: जो राजमहल का प्रबंधक था
  rationale: यह एक उच्च प्रशासनिक पदवी है। यहाँ הַבַּיִת राजकीय घराने अथवा महल को सूचित करता है; ‘राजमहल का प्रबंधक’ आधुनिक पाठक को पद का कार्य समझाता है।
- source_word: הַסֹּפֵר
  choice: राजकीय लेखक
  rationale: סֹפֵר यहाँ सामान्य नकलनवीस नहीं बल्कि राजकीय अधिकारी है। ‘राजकीय लेखक’ पद के प्रशासनिक स्वरूप को स्पष्ट और सुबोध रखता है।
- source_word: הַמַּזְכִּיר
  choice: अभिलेख अधिकारी
  rationale: यह राजकीय अभिलेखों अथवा स्मरण-पत्रों से जुड़ी पदवी है। ‘अभिलेख अधिकारी’ आधुनिक हिन्दी में इसके प्रशासनिक कार्य को संक्षेप में व्यक्त करता है।
