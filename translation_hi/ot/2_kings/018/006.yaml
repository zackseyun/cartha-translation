  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
translation:
  language: hi
  text: वह यहोवा से दृढ़ता से जुड़ा रहा[a]; वह उसके पीछे चलने से नहीं हटा, और उसने उसकी आज्ञाओं का पालन किया, जो यहोवा ने मूसा को दी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा से लिपटा रहा”; इब्रानी क्रिया गहरे लगाव और दृढ़ वाचा-निष्ठा का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  choice: लिपटा रहा
  rationale: דבק गहरे और दृढ़ जुड़ाव को व्यक्त करता है; यहाँ इसका आशय यहोवा के प्रति अटल वाचा-निष्ठा से है।
- source_word: בַּיהוָה
  choice: यहोवा से
  rationale: ב के साथ דבק हिंदी में स्वाभाविक रूप से ‘से लिपटना’ बनता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לֹא סָר מֵאַחֲרָיו
  choice: वह उसके पीछे चलने से नहीं हटा
  rationale: यह पदबंध किसी का अनुसरण छोड़ देने या निष्ठा से हट जाने का भाव रखता है; अनुवाद अनुसरण और निष्ठा दोनों को बनाए रखता है।
- source_word: וַיִּשְׁמֹר
  choice: पालन करता रहा
  rationale: आज्ञाओं के संदर्भ में שׁמר का अर्थ उन्हें मानना और उनके अनुसार चलते रहना है; क्रमागत हिब्रू रूप यहाँ हिजकिय्याह के निरंतर आचरण का वर्णन करता है।
- source_word: מִצְוֺתָיו
  choice: उन आज्ञाओं
  rationale: सर्वनाम का संदर्भ यहोवा है और अगले संबंधवाचक उपवाक्य से यह स्पष्ट है; ‘आज्ञाओं’ से वाचा और व्यवस्था का उपयुक्त औपचारिक भाव बना रहता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: जिन्हें यहोवा ने मूसा को दिया था
  rationale: हिब्रू में शाब्दिक भाव ‘जिनकी आज्ञा यहोवा ने मूसा को दी’ है; हिंदी में आज्ञाएँ ‘देना’ स्वाभाविक है और ‘था’ पूर्वकालिक क्रम स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी बाइबल परंपरा में परिचित ‘यहोवा’ को रखा गया है, न कि उसे सामान्य उपाधि ‘प्रभु’ से बदला गया।
- issue: דבק में वाचा-निष्ठा का भाव
  choice: लिपटा रहा
  alternative: दृढ़ता से जुड़ा रहा
  rationale: रूपक की सजीवता और गहरे लगाव को मुख्य पाठ में रखा गया है; पादटिप्पणी स्पष्ट करती है कि संदर्भ में यह केवल शारीरिक चिपकाव नहीं, बल्कि अटल निष्ठा है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘लिपटा रहा’ मूल रूपक को बचाता है, जबकि पादटिप्पणी उसका वाचा-संबंधी आशय स्पष्ट करती है।
