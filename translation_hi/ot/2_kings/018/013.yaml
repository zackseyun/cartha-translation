lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: चौदहवें वर्ष में
  rationale: काल-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप; आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं, क्योंकि यहाँ वह कथानक की निरन्तरता दिखाता है।
- source_word: לַמֶּלֶךְ חִזְקִיָּה
  choice: हिजकिय्याह राजा के
  rationale: राजकीय वर्ष-गणना के सूत्र को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלָה ... עַל
  choice: पर चढ़ाई की
  rationale: सैन्य प्रसंग में עלה עם עַל किसी स्थान के विरुद्ध बढ़ने या आक्रमण करने को दर्शाता है; ‘चढ़ाई की’ इस अर्थ को संक्षेप और स्वाभाविक रूप से देता है।
- source_word: סַנְחֵרִיב
  choice: सन्हेरीब
  rationale: हिब्रू राजकीय नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: राजा के पद और उसके राज्य को दर्शाने वाली समास-रचना का सीधा हिन्दी रूप।
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  choice: यहूदा के सभी गढ़वाले नगरों पर
  rationale: הַבְּצֻרוֹת का अर्थ सुरक्षा-प्राचीर अथवा सैन्य सुदृढ़ीकरण वाले नगर हैं; ‘गढ़वाले नगर’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: וַיִּתְפְּשֵׂם
  choice: और उन पर अधिकार कर लिया
  rationale: क्रिया नगरों को युद्ध में अपने कब्जे में लेने का बोध देती है; बहुवचन प्रत्यय को ‘उन पर’ से स्पष्ट किया गया है।
