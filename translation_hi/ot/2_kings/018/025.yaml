source:
  edition: WLC
  text: עַתָּה֙ הֲ/מִ/בַּלְעֲדֵ֣י יְהוָ֔ה עָלִ֛יתִי עַל הַ/מָּק֥וֹם הַ/זֶּ֖ה לְ/הַשְׁחִת֑/וֹ יְהוָה֙ אָמַ֣ר אֵלַ֔/י עֲלֵ֛ה עַל הָ/אָ֥רֶץ הַ/זֹּ֖את וְ/הַשְׁחִיתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
translation:
  language: hi
  text: अब क्या मैं याहवे के बिना[a] इस स्थान के विरुद्ध इसे नष्ट करने के लिए चढ़ आया हूँ? याहवे ने मुझसे कहा, ‘इस देश पर चढ़ाई कर और इसे नष्ट कर दे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे से अलग’ अथवा ‘याहवे से स्वतंत्र होकर।’
    reason: הֲמִבַּלְעֲדֵי के अर्थ-क्षेत्र में ‘बिना’, ‘से अलग’ और ‘से स्वतंत्र होकर’ शामिल हैं; मुख्य पाठ में सबसे स्वाभाविक हिन्दी रूप रखा गया है।
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  choice: क्या ... के बिना
  rationale: प्रश्नवाचक הֲ और מִבַּלְעֲדֵי मिलकर एक आलंकारिक प्रश्न बनाते हैं। ‘क्या ... के बिना’ स्वाभाविक हिन्दी में इस दावे को बनाए रखता है कि वक्ता ने याहवे से स्वतंत्र होकर कार्य नहीं किया।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: עָלִיתִי
  choice: चढ़ आया हूँ
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/आना’ है और यहाँ सैन्य चढ़ाई का भाव भी है। ‘चढ़ आया हूँ’ वक्ता के वर्तमान स्थान और सैन्य संदर्भ दोनों के अनुकूल है।
- source_word: הַמָּקוֹם הַזֶּה
  choice: इस स्थान
  rationale: מָקוֹם का सीधा अर्थ ‘स्थान’ है। पाठ में यरूशलेम नाम से नहीं कहा गया, इसलिए संदर्भ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: לְהַשְׁחִיתוֹ
  choice: कि इसे नष्ट कर दूँ
  rationale: שׁחת के हिफ़ील रूप में विनाश करने का भाव है। प्रयोजनसूचक לְ को स्वाभाविक हिन्दी में ‘कि ... कर दूँ’ से व्यक्त किया गया है।
- source_word: אָמַר אֵלַי
  choice: मुझसे कहा
  rationale: सामान्य कथन-सूत्र का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עֲלֵה עַל
  choice: पर चढ़ाई कर
  rationale: आज्ञार्थक עלה और עַל का संयोजन इस सैन्य प्रसंग में किसी देश के विरुद्ध आगे बढ़ने को दर्शाता है; ‘चढ़ाई कर’ हिन्दी में इस अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הָאָרֶץ הַזֹּאת
  choice: इस देश
  rationale: אֶרֶץ यहाँ आक्रमण के भू-राजनीतिक क्षेत्र को सूचित करता है। ‘देश’ स्वाभाविक हिन्दी है और पहले आए ‘स्थान’ से मूल पाठ का भेद बनाए रखता है।
- source_word: וְהַשְׁחִיתָהּ
  choice: और इसे नष्ट कर दे
  rationale: स्त्रीलिंग प्रत्यय אֶרֶץ की ओर संकेत करता है। ‘इसे’ उसका स्वाभाविक हिन्दी संदर्भ है, और ‘नष्ट’ पहले प्रयुक्त שׁחת से शब्दगत संबंध बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है। उसे ‘याहवे’ रूप में रखने से नाम और सामान्य उपाधि के बीच का अंतर सुरक्षित रहता है।
- issue: ‘इस स्थान’ और ‘इस देश’ के संदर्भ को स्पष्ट करना
  choice: मूल पाठ के दो भिन्न पदों को ‘इस स्थान’ और ‘इस देश’ के रूप में बनाए रखना
  alternative: यरूशलेम; यहूदा
  rationale: מָקוֹם और אֶרֶץ दो अलग संज्ञाएँ हैं। यरूशलेम या यहूदा कहना सम्भावित संदर्भ को अनुवाद में निश्चित कर देता, जबकि मूल पाठ ऐसा स्पष्ट नाम नहीं देता।
- issue: याहवे से आदेश मिलने के दावे की सत्यता
  choice: वक्ता के दावे को बिना समर्थन या खंडन जोड़े सीधे उद्धृत करना
  alternative: इसे छलपूर्ण या सत्य दावे के रूप में स्पष्ट करना
  rationale: पद रबशाके के कथन को प्रस्तुत करता है, पर इसी वाक्य में उसकी सत्यता पर निर्णय नहीं देता। अनुवाद उस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। सैन्य संदर्भ में ‘चढ़ाई कर’ स्वाभाविक है, जबकि वर्णनात्मक पहले खंड में ‘चढ़ आया हूँ’ मूल क्रिया की दिशात्मक छवि को बनाए रखता है।
