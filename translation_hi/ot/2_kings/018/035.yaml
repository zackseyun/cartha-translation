  text: מִ֚י בְּ/כָל אֱלֹהֵ֣י הָֽ/אֲרָצ֔וֹת אֲשֶׁר הִצִּ֥ילוּ אֶת אַרְצָ֖/ם מִ/יָּדִ֑/י כִּי יַצִּ֧יל יְהוָ֛ה אֶת יְרוּשָׁלִַ֖ם מִ/יָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/035.yaml
  text: Who among all the gods of the lands has delivered their land from my hand[a], that Yahweh should deliver Jerusalem from my hand?
translation:
  language: hi
  text: सब देशों के देवताओं में से किसने अपने देश को मेरे हाथ से छुड़ाया है,[a] कि याहवे यरूशलेम को मेरे हाथ से छुड़ा ले?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब देशों के देवताओं में से कौन-सा देवता अपने देश को मेरे हाथ से छुड़ा सका है कि याहवे यरूशलेम को मेरे हाथ से छुड़ा सके?”
    reason: मूल के एकवचन प्रश्नवाचक बल और अपूर्ण क्रिया के अधिक औपचारिक/संभाव्य हिन्दी विकल्प को दर्शाता है।
lexical_decisions:
- source_word: מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  choice: देशों के सब देवताओं में से कौन
  rationale: בְּכָל को अंशसूचक भाव में ‘सब ... में से’ और אֲרָצוֹת को विभिन्न देशों के अर्थ में रखा गया है।
- source_word: הִצִּילוּ אֶת אַרְצָם
  choice: अपने देश को ... बचा सका है
  rationale: נצל का सैनिक प्रसंग में स्वाभाविक अर्थ ‘बचाना’ है। बहुवचन प्रत्यय को वितरणात्मक रूप से ‘अपने देश’ कहा गया है; ‘सका है’ प्रश्न की चुनौतीपूर्ण शक्ति को व्यक्त करता है।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: इब्रानी में हाथ सत्ता और नियंत्रण का रूपक है; हिन्दी में शाब्दिक रूप स्वाभाविक और बोधगम्य है।
- source_word: כִּי יַצִּיל
  choice: जो ... बचा लेगा
  rationale: यहाँ כִּי के साथ अपूर्ण क्रिया उपहासपूर्ण निष्कर्ष/चुनौती व्यक्त करती है। हिन्दी का ‘जो ... लेगा?’ उसी अलंकारिक बल को स्वाभाविक ढंग से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित रूप।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उपाधि द्वारा प्रतिस्थापित नहीं करता।
- issue: रबशाके की चुनौती का भाव
  choice: ‘जो ... बचा लेगा?’ के रूप में अलंकारिक प्रश्न
  alternative: ‘कि याहवे ... बचाए?’
  rationale: वक्ता का आशय वास्तविक जानकारी माँगना नहीं, बल्कि याहवे की सामर्थ्य पर ताना मारना है; फिर भी कथन को प्रश्न ही रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे हाथ से’ मूल सत्ता-रूपक को बनाए रखता है, और वक्ता के घमंडी, उपहासपूर्ण प्रश्न का स्वर ‘बचा सका है’ तथा ‘बचा लेगा?’ से व्यक्त होता है।
