source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
translation:
  language: hi
  text: क्योंकि उन्होंने अपने परमेश्वर यहवे की वाणी नहीं सुनी,[a] बल्कि उसकी वाचा का उल्लंघन किया—अर्थात् उन सब आज्ञाओं का, जो यहवे के सेवक मूसा ने दी थीं। उन्होंने न तो सुना और न उनका पालन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वाणी सुनना’ इब्रानी मुहावरा है, जिसका अर्थ प्रायः ध्यान देकर आज्ञा मानना भी होता है। इसलिए इसका अनुवाद ‘अपने परमेश्वर यहवे की आज्ञा नहीं मानी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद पिछले पद में वर्णित घटना का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמְעוּ בְּקוֹל
  choice: वाणी नहीं सुनी
  rationale: यह इब्रानी मुहावरा सुनने और आज्ञा मानने, दोनों का भाव रखता है। ‘वाणी नहीं सुनी’ मूल बिंब और उसकी अर्थगत व्यापकता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיַּעַבְרוּ אֶת־בְּרִיתוֹ
  choice: उसकी वाचा का उल्लंघन किया
  rationale: वाचा के संदर्भ में עבר का अर्थ उसे तोड़ना या उसका उल्लंघन करना है; यह हिन्दी प्रयोग नैतिक और वाचागत बल को स्पष्ट रखता है।
- source_word: אֵת כָּל אֲשֶׁר צִוָּה
  choice: उन सभी बातों का, जिनकी आज्ञा ... ने दी थी
  rationale: אֵת से आरम्भ होने वाला पदबंध उल्लंघन की गई वाचा की विषय-वस्तु को स्पष्ट करता है। हिन्दी में यह रचना पूरे आज्ञा-समूह को सहज ढंग से व्यक्त करती है।
- source_word: מֹשֶׁה עֶבֶד יְהוָה
  choice: यहवे के सेवक मूसा
  rationale: עֶבֶד यहाँ सम्मानसूचक और आधिकारिक पदवी है; इसलिए ‘सेवक’ उपयुक्त है।
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  choice: उन्होंने न तो सुना और न उनका पालन किया
  rationale: दोनों निषेधों की समानांतर रचना सुरक्षित है। अन्तिम बहुवचन संकेत को पहले उल्लिखित ‘सभी बातों’ से जोड़कर ‘उनका पालन किया’ कहना आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में टेट्राग्राम य्ह्व्ह प्रत्यक्ष रूप से है। ‘यहवे’ व्यक्तिगत वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: שמע को स्पष्ट रूप से ‘आज्ञा मानना’ कहना या ‘सुनना’ बनाए रखना
  choice: वाणी नहीं सुनी / न तो सुना
  alternative: आज्ञा नहीं मानी / न तो आज्ञा मानी
  rationale: इब्रानी में सुनना और आज्ञापालन दोनों निहित हैं। ‘सुना’ मूल शब्दावली और पद के भीतर उसकी पुनरावृत्ति को बचाता है, जबकि अंतिम ‘पालन किया’ व्यवहारिक आशय को स्पष्ट करता है।
- issue: אֵת כָּל אֲשֶׁר צִוָּה का वाक्यगत संबंध
  choice: वाचा की विषय-वस्तु का स्पष्टीकरण
  alternative: मूसा को उल्लंघन की सीधी कर्म-वस्तु मानना
  rationale: इब्रानी वाक्य-विन्यास कुछ कठोर है, पर पदबंध स्वाभाविक रूप से बताता है कि वाचा में मूसा द्वारा दी गई समस्त आज्ञाएँ सम्मिलित थीं। डैश और ‘अर्थात’ इस संबंध को स्पष्ट करते हैं, बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘वाचा’, ‘वाणी’ और ‘सेवक’ जैसे स्थापित बाइबलीय शब्द मूल के वाचागत तथा साहित्यिक स्वर को बनाए रखते हैं। इब्रानी की पुनरावृत्ति को यथासंभव सुरक्षित रखा गया है, पर अंतिम עָשׂוּ को अर्थपूर्ण हिन्दी के लिए ‘पालन किया’ कहा गया है।
