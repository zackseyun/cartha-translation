reference: 2 Kings 18:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
translation:
  language: hi
  text: हमात और अर्पाद के देवता कहाँ हैं? सपरवैम, हेना और इव्वा[a] के देवता कहाँ हैं? क्या उन्होंने सामरिया को मेरे हाथ से छुड़ाया है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान-नाम को कुछ परंपराओं में “अव्वा” भी लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: कहाँ हैं
  rationale: यह स्थान पूछने वाला प्रश्नवाचक शब्द है। बहुवचन ‘देवता’ के अनुसार हिन्दी में ‘कहाँ हैं’ स्वाभाविक है और उपहासपूर्ण प्रश्न बना रहता है।
- source_word: אֱלֹהֵי
  choice: के देवता
  rationale: यह אֱלֹהִים का संबंधसूचक बहुवचन रूप है और यहाँ नगरों अथवा जातियों के देवताओं को सूचित करता है।
- source_word: חֲמָת וְאַרְפָּד
  choice: हमात और अर्पाद
  rationale: स्थान-नामों को उनके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: סְפַרְוַיִם הֵנַע וְעִוָּה
  choice: सपरवैम, हेना और इव्वा
  rationale: इन स्थान-नामों को इब्रानी व्यंजन-रूपों के निकट लिप्यंतरित किया गया है; עִוָּה की परंपरागत वर्तनियों का उल्लेख पादटिप्पणी में है।
- source_word: כִּי
  choice: क्या
  rationale: यहाँ यह पिछले उपहास से जुड़ा आलंकारिक प्रश्न प्रस्तुत करता है; हिन्दी में ‘क्या’ उस प्रश्नात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִצִּילוּ
  choice: छुड़ाया है
  rationale: נצל के हिफ़ील रूप का अर्थ किसी के अधिकार या संकट से बचाना अथवा छुड़ाना है। सैन्य-राजनीतिक संदर्भ में ‘छुड़ाया’ उपयुक्त है।
- source_word: שֹׁמְרוֹן
  choice: सामरिया
  rationale: नगर और राज्य के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: מִיָּדִי
  choice: मेरे हाथ से
  rationale: मूल का ठोस मुहावरा सुरक्षित रखा गया है; यहाँ ‘हाथ’ अधिकार और शक्ति को व्यक्त करता है और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: अन्य जातियों के देवताओं के विषय में वक्ता की चुनौती
  choice: वचन को अश्शूरी वक्ता के इस उपहासपूर्ण दावे के रूप में रखा गया है कि नामित नगरों के देवता सामरिया को उसके अधिकार से नहीं छुड़ा सके।
  alternative: अंतिम प्रश्न को सभी राष्ट्रीय देवताओं के विषय में एक सामान्य ताने के रूप में समझा जा सकता है।
  rationale: इब्रानी पाठ विशेष स्थानों के देवताओं का नाम लेकर पूछता है कि क्या उन्होंने सामरिया को ‘मेरे हाथ से’ छुड़ाया। अनुवाद इस तनावपूर्ण दावे को ज्यों का त्यों रखता है और उन देवताओं के वास्तविक अस्तित्व या सामर्थ्य के बारे में अपनी ओर से कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोहराए गए ‘कहाँ हैं?’ और ‘मेरे हाथ से’ को मूल की उपहासपूर्ण लय और ठोस शक्ति-संबंधी मुहावरे को बनाए रखने के लिए सुरक्षित रखा गया है।
