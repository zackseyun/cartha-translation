  yaml_path: translation/ot/2_kings/018/010.yaml
  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
translation:
  language: hi
  text: तीन वर्षों के अंत में उन्होंने उसे जीत लिया।[a] हिजकिय्याह के शासन के छठे वर्ष में—जो इस्राएल के राजा होशे के शासन का नौवाँ वर्ष था—शोमरोन जीत लिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तीन वर्ष बाद उन्होंने उसे अपने अधिकार में कर लिया।’ इब्रानी मुहावरे का अधिक शाब्दिक अर्थ ‘तीन वर्षों के अंत में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  choice: उन्होंने उसे जीत लिया
  rationale: लכד के क़ाल बहुवचन कर्तृवाच्य रूप और स्त्रीलिंग एकवचन प्रत्यय को बनाए रखा गया है; ‘उसे’ पिछले संदर्भ के शोमरोन को सूचित करता है।
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  choice: तीन वर्षों के अंत में
  rationale: समयावधि के साथ यह इब्रानी मुहावरा उस अवधि के अंत को दर्शाता है; अनावश्यक रूप से अधिक निश्चित किए बिना उसका निकट रूप रखा गया है।
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  choice: हिजकिय्याह के शासन के छठे वर्ष में
  rationale: राजकीय वर्ष की मानक अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘शासन’ जोड़ा गया है।
- source_word: הִיא
  choice: जो ... था
  rationale: यह सर्वनाम दोनों राजकीय तिथियों को एक ही वर्ष के रूप में जोड़ता है; सम्बन्धवाचक रचना हिन्दी में इस समकालिकता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा होशे के शासन का नौवाँ वर्ष
  rationale: दूसरे राजकीय काल-संकेत को सुरक्षित रखते हुए ‘इस्राएल के राजा’ पदवी स्पष्ट रखी गई है।
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  choice: शोमरोन जीत लिया गया
  rationale: निफ़ाल स्त्रीलिंग एकवचन के कर्मवाच्य और परिणामसूचक कथन को सुरक्षित रखा गया है; पहले खंड के समान धात्वर्थ के लिए ‘जीत लिया’ दोहराया गया है।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: नगर के नाम का हिन्दी बाइबलीय रूप अपनाया गया है; यही दोनों क्रियारूपों का स्त्रीलिंग एकवचन संदर्भ है।
