  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
translation:
  language: hi
  text: तब हिजकिय्याह ने वह सारी चाँदी[a] दे दी जो याहवे के भवन[b] और राजा के भवन के खजानों[c] में मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धन’; इब्रानी में ‘चाँदी’।
    reason: lexical_alternative
  - marker: b
    text: या ‘याहवे के मन्दिर’। शाब्दिक अर्थ ‘याहवे का घर’।
    reason: lexical_alternative
  - marker: c
    text: या ‘राजमहल के खजानों’। शाब्दिक अर्थ ‘राजा के घर के खजानों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दी
  rationale: נתן का मूल अर्थ ‘देना/सौंपना’ है। स्त्रीलिंग ‘चाँदी’ के साथ ‘दे दी’ स्वाभाविक है और इसे मुख्य पाठ में औपचारिक भुगतान के रूप में आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: חִזְקִיָּה
  choice: हिजकिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כָּל הַכֶּסֶף
  choice: वह सारी चाँदी
  rationale: כָּל की व्यापकता और כֶּסֶף के ठोस अर्थ ‘चाँदी’ दोनों को बनाए रखता है; संदर्भ में ‘धन’ भी संभव है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַנִּמְצָא
  choice: जो ... मिली थी
  rationale: מצא के निफ़अल कृदंत का निष्क्रिय अर्थ ‘जो पाई/मिली थी’ सुरक्षित रहता है और उपलब्ध सामग्री की ओर संकेत करता है।
- source_word: בֵית יְהוָה
  choice: याहवे का भवन
  rationale: शाब्दिक ‘याहवे का घर/भवन’; हिन्दी में पवित्र परिसर के लिए ‘भवन’ गरिमापूर्ण और सहज है, जबकि ‘मन्दिर’ को पादटिप्पणी में प्रसंगानुकूल विकल्प रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम का हिन्दी लिप्यंतरण, उपाधि से प्रतिस्थापित किए बिना व्यक्तिगत नाम को बनाए रखता है।
- source_word: וּבְאֹצְרוֹת
  choice: और ... खजानों में
  rationale: אֹצָר यहाँ धन-संपत्ति रखने के स्थानों को सूचित करता है; ‘खजाने’ आधुनिक हिन्दी में ‘भंडारगृहों’ की अपेक्षा वित्तीय संदर्भ को अधिक स्पष्ट करता है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: इब्रानी ‘राजा का घर’ की संरचना और ‘याहवे का भवन’ के साथ उसका समानांतर रूप सुरक्षित रहता है; ‘राजमहल’ प्रसंगानुकूल विकल्प है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे उपस्थित है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से बदलता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘भवन’ से दोनों समानांतर इब्रानी पदबंधों की संरचना बनी रहती है; ‘खजानों’ से वित्तीय प्रसंग स्वाभाविक रूप से स्पष्ट होता है।
