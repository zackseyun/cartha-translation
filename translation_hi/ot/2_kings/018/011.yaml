  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
translation:
  language: hi
  text: अश्शूर के राजा ने इस्राएल[b] को अश्शूर में निर्वासित किया और उन्हें हलह[a] में, हाबोर, गोजान की नदी, के किनारे, और मादियों के नगरों में बसाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक अनुवाद: “...उन्हें हलह में, हाबोर नदी के पास, गोजान में, और मादियों के नगरों में बसाया।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘इस्राएल’ से उत्तरी राज्य और उसके वे लोग अभिप्रेत हैं जिन्हें निर्वासन में ले जाया गया था।
    reason: cultural_note
lexical_decisions:
