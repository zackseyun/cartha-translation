  choice: बंदी बनाकर ... ले गया
  rationale: हिफ़ील रूप बलपूर्वक देश-निकाले को व्यक्त करता है। यह हिंदी में निर्वासन की वास्तविकता को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ उत्तरी राज्य और उसके लोगों को एक सामूहिक राजनीतिक इकाई के रूप में ‘इस्राएल’ कहता है; अनुवाद उसी संदर्भ को बनाए रखता है।
- source_word: אַשּׁוּרָה
  choice: अश्शूर ले गया
  rationale: दिशासूचक प्रत्यय अश्शूर की ओर गति दर्शाता है; हिंदी क्रिया-विन्यास में गंतव्य को स्वाभाविक रूप से जोड़ा गया है।
- source_word: וַיַּנְחֵם
  choice: उन्हें ... बसाया
  rationale: इस कारक प्रयोग का आशय निर्वासित लोगों को निर्धारित स्थानों में निवास कराना है; ‘बसाया’ प्रसंगानुकूल और सहज है।
- source_word: בַּחְלַח
  choice: हलह में
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: गोजान की नदी हाबोर के किनारे
  rationale: हाबोर को गोजान से संबद्ध नदी के रूप में समझते हुए इब्रानी पद-संबंध को स्पष्ट, किंतु अति-व्याख्यात्मक हुए बिना, हिंदी में रखा गया है।
- source_word: וְעָרֵי מָדָי
  choice: और मादियों के नगरों में
  rationale: मूल का सीधा अर्थ ‘मादियों के नगर’ है; यह जातीय-भौगोलिक संदर्भ को सुरक्षित रखता है।
