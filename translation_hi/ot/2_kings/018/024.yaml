source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
translation:
  language: hi
  text: फिर तुम मेरे स्वामी के सबसे निम्न श्रेणी के सेवकों में से एक अधिकारी को भी कैसे पीछे हटा सकोगे?[a] जबकि रथों और घुड़सवारों के लिए तुम मिस्र पर भरोसा रखते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किसी का चेहरा पीछे लौटाना।” यह एक इब्रानी मुहावरा है, जिसका अर्थ किसी को पीछे हटाना, खदेड़ना, या उसका सामना करने में समर्थ होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  choice: सामना कर सकोगे
  rationale: हिफ़ील क्रिया के साथ यह इब्रानी मुहावरा किसी को पीछे हटाने, रोकने या उसका सामना करने के अर्थ में है। प्रसंग में स्वाभाविक हिंदी के लिए ‘सामना कर सकोगे’ चुना गया है, जबकि अधिक शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: פַחַת
  choice: अधिकारी
  rationale: यह शब्द प्रांतीय शासक या सैन्य पदाधिकारी, दोनों को सूचित कर सकता है। ‘अधिकारी’ मूल की व्यापकता बनाए रखता है और सैनिक प्रसंग में भी स्वाभाविक है।
- source_word: אַחַד
  choice: एक ही
  rationale: '‘एक ही’ व्यंग्यात्मक प्रश्न का बल स्पष्ट करता है: ऐसे निम्न पद के केवल एक अधिकारी का भी सामना नहीं किया जा सकता।'
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  choice: मेरे स्वामी के छोटे-से-छोटे सेवकों में से
  rationale: यहाँ ‘छोटे’ का आशय आकार नहीं, पद या महत्त्व में निम्न होना है। ‘छोटे-से-छोटे’ वक्ता के तिरस्कार और श्रेणीगत अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: וַתִּבְטַח לְךָ עַל מִצְרַיִם
  choice: तुम तो ... मिस्र पर भरोसा रखते हो
  rationale: בטח על का अर्थ भरोसा रखना या निर्भर होना है। ‘तो’ प्रश्न में निहित विरोध और उपहास को स्वाभाविक हिंदी में प्रकट करता है।
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  choice: रथों और घुड़सवारों के लिए
  rationale: लामेद यहाँ मिस्र से अपेक्षित सैन्य साधनों को दर्शाता है। ‘घुड़सवार’ सामान्य पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। अश्शूरी वक्ता के व्यंग्यात्मक सैन्य ताने को ‘एक ही’, ‘छोटे-से-छोटे’ और ‘तो’ द्वारा व्यक्त किया गया है। केवल एक पादटिप्पणी रखी गई है, क्योंकि ‘अधिकारी’ פַחַת की प्रशासनिक और सैन्य दोनों संभावनाओं को मुख्य पाठ में पर्याप्त रूप से सुरक्षित रखता है।
