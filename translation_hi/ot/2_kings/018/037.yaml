  text: וַ/יָּבֹ֣א אֶלְיָקִ֣ים בֶּן חִלְקִיָּ֣ה אֲשֶׁר עַל הַ֠/בַּיִת וְ/שֶׁבְנָ֨א הַ/סֹּפֵ֜ר וְ/יוֹאָ֨ח בֶּן אָסָ֧ף הַ/מַּזְכִּ֛יר אֶל חִזְקִיָּ֖הוּ קְרוּעֵ֣י בְגָדִ֑ים וַ/יַּגִּ֣דוּ ל֔/וֹ דִּבְרֵ֖י רַב שָׁקֵֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
translation:
  language: hi
  text: तब हिल्किय्याह का पुत्र एल्याकीम, जो राजमहल का प्रबंधक था, शेबना, सचिव, और आसाप का पुत्र योआह, अभिलेख अधिकारी, अपने वस्त्र फाड़े हुए हिजकिय्याह के पास आए और उसे रबशाके[a] की बातें बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रबशाके’ अश्शूर के एक अधिकारी का पदनाम था। इसका सटीक अर्थ अनिश्चित है; संभवतः यह प्रधान पिलानेवाले या राजकीय प्रवक्ता जैसे उच्च पदाधिकारी के लिए प्रयुक्त होता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आए
  rationale: कथात्मक וַ का स्वाभाविक हिन्दी रूप ‘तब’ है। इब्रानी में क्रिया एकवचन है क्योंकि वह संयुक्त कर्ता के पहले आती है; पूरे कर्ता को ध्यान में रखते हुए हिन्दी में बहुवचन ‘आए’ स्वाभाविक है।
- source_word: אֲשֶׁר עַל הַבַּיִת
  choice: जो राजमहल का प्रबंधक था
  rationale: यह राजकीय घराने अथवा महल के प्रशासन का आधिकारिक पद है। ‘राजमहल का प्रबंधक’ आधुनिक पाठक के लिए स्पष्ट है और पद की प्रशासनिक प्रकृति बनाए रखता है।
- source_word: הַסֹּפֵר
  choice: सचिव
  rationale: दरबारी संदर्भ में यह आधिकारिक लेखक अथवा सचिव का पद है। ‘सचिव’ आधुनिक हिन्दी में इसके प्रशासनिक कार्य को सहज ढंग से व्यक्त करता है।
- source_word: הַמַּזְכִּיר
  choice: अभिलेख अधिकारी
  rationale: यह स्मरणीय घटनाओं और राजकीय कार्यों का लेखा रखने वाले अधिकारी की उपाधि है। ‘अभिलेख अधिकारी’ अर्थ को स्पष्ट रखते हुए इसे सामान्य लेखक से अलग दिखाता है।
- source_word: קְרוּעֵי בְגָדִים
  choice: अपने वस्त्र फाड़े हुए
  rationale: यह उनके आगमन के समय की दशा बताता है और शोक, संकट तथा अपमान की मूर्त सांस्कृतिक अभिव्यक्ति को बनाए रखता है।
- source_word: וַיַּגִּדוּ לוֹ
  choice: और उसे ... बताईं
  rationale: ‘बताईं’ सरल और स्वाभाविक है तथा औपचारिक संदेश पहुँचाने के प्रसंग में पर्याप्त रूप से सटीक है।
- source_word: דִּבְרֵי
  choice: की बातें
  rationale: यह मूल के ‘शब्दों/बातों’ को निकटता से व्यक्त करता है और हिन्दी में किसी के कथन को दोहराने के लिए स्वाभाविक है।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी अधिकारी की उपाधि है। लिप्यंतरण पद के निश्चित कार्य के विषय में अनावश्यक रूप से संकीर्ण निष्कर्ष नहीं थोपता; अर्थ-संबंधी जानकारी पादटिप्पणी में दी गई है।
