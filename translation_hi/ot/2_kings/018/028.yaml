base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
translation:
  language: hi
  text: तब रबशाके खड़ा हुआ और यहूदा की भाषा में[a] ऊँची आवाज़ से पुकारकर बोला, “महान राजा, अश्शूर के राजा का वचन सुनो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इब्रानी में।” मूल शब्द विशेष रूप से यहूदा की भाषा को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: आख्यान में עמד का सीधा और स्वाभाविक हिन्दी रूप; इससे अतिरिक्त भाव नहीं जोड़ा जाता।
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी पदवी/नाम-रूप है; ऐतिहासिक पदनाम को अनुमानाधारित हिन्दी कार्यालय-शीर्षक में बदलने के बजाय लिप्यंतरण किया गया है।
- source_word: וַיִּקְרָא בְקוֹל גָּדוֹל
  choice: ऊँची आवाज़ से पुकारकर
  rationale: यह सार्वजनिक रूप से जोर से पुकारने का भाव देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוּדִית
  choice: यहूदा की भाषा में
  rationale: शब्द विशेष रूप से यहूदा की भाषा/बोली को सूचित करता है; यह ‘इब्रानी’ से अधिक ऐतिहासिक रूप से विशिष्ट है।
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  choice: बोला
  rationale: इब्रानी की दोहरी वाणी-भूमिका हिन्दी में यथावत रखने पर अनावश्यक पुनरुक्ति होती; ‘पुकारकर बोला’ दोनों क्रियाओं की संयुक्त गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक का सीधा, संक्षिप्त और घोषणात्मक रूप।
- source_word: דְּבַר
  choice: वचन
  rationale: राजकीय औपचारिक घोषणा के लिए गरिमापूर्ण बाइबलीय हिन्दी; ‘संदेश’ संभव है, पर कुछ अधिक व्याख्यात्मक है।
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: महान राजा
  rationale: अश्शूरी राजकीय उपाधि का सीधा और ऐतिहासिक रूप से उपयुक्त अनुवाद।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: सम्बन्धवाचक रचना का स्पष्ट और औपचारिक हिन्दी रूप।
