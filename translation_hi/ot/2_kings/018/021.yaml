base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
translation:
  language: hi
  text: देख, तू मिस्र पर भरोसा कर रहा है—उस टूटे हुए सरकंडे की लाठी पर[a]—जिस पर यदि कोई मनुष्य टिके, तो वह उसकी हथेली में घुस जाएगी और हथेली को छेद देगी। मिस्र का राजा फ़िरौन उन सबके लिए ऐसा ही है जो उस पर भरोसा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस कुचले हुए सरकंडे की लाठी पर।’ इब्रानी विशेषण का अर्थ कुचला, चोट खाया या टूटा हुआ हो सकता है; यहाँ ‘टूटा हुआ’ ऐसे सहारे के बिंब के अनुकूल है जो हाथ को घायल कर देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ עַל מִצְרַיִם
  choice: तू मिस्र पर भरोसा कर रहा है
  rationale: בטח भरोसा या निर्भरता व्यक्त करता है। प्रसंग में पूर्ण रूप वर्तमान भरोसे पर ताने के रूप में प्रयुक्त है; इसलिए प्रगतिशील वर्तमान स्वाभाविक है। संबोधन एकवचन है, अतः ‘तू’ रखा गया।
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  choice: उस टूटे हुए सरकंडे की लाठी
  rationale: מִשְׁעֶנֶת सहारे के लिए प्रयुक्त लाठी है, קָנֶה सरकंडा है, और רָצוּץ कुचला, टूटा या चटका हुआ हो सकता है। चोट पहुँचाने वाले सहारे के इस बिंब में ‘टूटा हुआ’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר יִסָּמֵךְ אִישׁ עָלָיו
  choice: जिस पर यदि कोई मनुष्य टिके
  rationale: Niphal יִסָּמֵךְ सहारा लेने के लिए टिकने का भाव देता है। सापेक्ष वाक्य का निहित शर्तार्थ ‘यदि’ से स्पष्ट किया गया है; אִישׁ के एकवचन मानवीय संदर्भ को ‘कोई मनुष्य’ बनाए रखता है।
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  choice: तो वह उसकी हथेली में घुसकर उसे छेद देगी
  rationale: כַּף यहाँ हथेली है और בוא भीतर प्रवेश करने का चित्र देता है। נקב छेदने या आर-पार करने को दर्शाता है। स्त्रीलिंग क्रिया-सामंजस्य हिंदी में ‘लाठी’ के साथ रखा गया है।
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र का राजा फ़िरौन ... ऐसा ही है
  rationale: כֵּן पहले दिए बिंब को फ़िरौन पर लागू करता है। हिंदी में ‘ऐसा ही है’ तुलना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכָל הַבֹּטְחִים עָלָיו
  choice: उन सबके लिए ... जो उस पर भरोसा करते हैं
  rationale: לְ संबंध या प्रभाव बताता है और participle सामान्य वर्ग को सूचित करता है। ‘उन सबके लिए’ इस व्यापक अर्थ और फ़िरौन से संबंध दोनों को सुरक्षित रखता है।
