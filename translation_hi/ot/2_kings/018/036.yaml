  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
translation:
  language: hi
  text: परन्तु लोग चुप रहे और उन्होंने उसे एक शब्द भी उत्तर नहीं दिया[a], क्योंकि राजा की आज्ञा थी, “उसे उत्तर मत देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उन्होंने उसे एक शब्द भी उत्तर नहीं दिया”; अर्थात उन्होंने कोई उत्तर नहीं दिया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ הָעָם
  choice: परन्तु लोग चुप रहे
  rationale: हिफ़ील रूप यहाँ चुप रहने और संयमपूर्वक कोई उत्तर न देने का भाव व्यक्त करता है। प्रसंग में וְ को विरोधसूचक ‘परन्तु’ कहना स्वाभाविक है।
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  choice: और उन्होंने उसे एक शब्द भी उत्तर नहीं दिया
  rationale: यह अनुवाद इब्रानी की ‘एक शब्द भी उत्तर न देना’ अभिव्यक्ति को बनाए रखते हुए पूर्ण मौन का अर्थ स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लोगों के चुप रहने का कारण प्रस्तुत करता है।
- source_word: מִצְוַת הַמֶּלֶךְ
  choice: राजा की आज्ञा
  rationale: מִצְוָה यहाँ अधिकारपूर्वक दी गई आज्ञा या आदेश है; ‘आज्ञा’ वर्तमान हिंदी में गरिमापूर्ण और सटीक है।
- source_word: הִיא לֵאמֹר
  choice: थी
  rationale: इब्रानी संरचना आगामी प्रत्यक्ष कथन का परिचय देती है; हिंदी में उद्धरण से पहले केवल ‘थी’ स्वाभाविक है।
- source_word: לֹא תַעֲנֻהוּ
  choice: उसे उत्तर मत देना
  rationale: निषेध के साथ द्वितीय पुरुष बहुवचन रूप पूरी जनता को संबोधित राजकीय मनाही व्यक्त करता है। हिंदी में समूह को सामूहिक इकाई मानकर एकवचन आज्ञार्थक स्वाभाविक है।
