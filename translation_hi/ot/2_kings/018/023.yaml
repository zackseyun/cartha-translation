  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
translation:
  language: hi
  text: अब आओ, मेरे स्वामी, अश्शूर के राजा, से शर्त लगाओ[a]; मैं तुम्हें दो हज़ार घोड़े दूँगा, यदि तुम उन पर चढ़ने के लिए सवार दे सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे स्वामी से प्रतिज्ञा करो” अथवा “मेरे स्वामी से सौदा करो।” इब्रानी क्रिया किसी समझौते में बँधने या स्वयं को दाँव पर लगाने का अर्थ दे सकती है; यहाँ संभवतः व्यंग्यपूर्ण शर्त या चुनौती का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעָרֶב נָא
  choice: आओ, ... शर्त लगाओ
  rationale: हित्पएल रूप यहाँ केवल समझौता करने के बजाय व्यंग्यपूर्ण चुनौती या बाज़ी लगाने का भाव देता है। नָא आग्रह को नरम करता है; आधुनिक हिन्दी में ‘आओ’ इस तानेभरे निमंत्रण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת אֲדֹנִי אֶת מֶלֶךְ אַשּׁוּר
  choice: मेरे स्वामी अश्शूर के राजा से
  rationale: यहाँ אֶת का अर्थ क्रिया के साथ ‘से/के साथ’ है। אֲדֹנִי मानवीय अधिपति के लिए है, इसलिए ‘मेरे स्वामी’ उपयुक्त है।
- source_word: וְאֶתְּנָה לְךָ
  choice: मैं तुम्हें ... दूँगा
  rationale: प्रसंग में यह प्रथम पुरुष का प्रस्ताव है, जिसे हिन्दी में भविष्यकाल से सहज रूप मिलता है।
- source_word: אַלְפַּיִם סוּסִים
  choice: दो हज़ार घोड़े
  rationale: संख्या और संज्ञा का सीधा, स्पष्ट अनुवाद।
- source_word: אִם תּוּכַל
  choice: बशर्ते ... सको
  rationale: यह क्षमता पर व्यंग्य करती शर्त है; ‘बशर्ते ... सको’ उस चुनौतीपूर्ण लहजे को बनाए रखता है।
- source_word: לָתֶת לְךָ רֹכְבִים עֲלֵיהֶם
  choice: उन पर सवार बैठाने के लिए लोग जुटा सको
  rationale: शाब्दिक अर्थ ‘अपने लिए उन पर सवार देना’ है। हिन्दी में यह रूप स्पष्ट करता है कि चुनौती पर्याप्त घुड़सवार उपलब्ध कराने की है, बिना ‘घुड़सवार’ को पहले से घोड़ों वाले सैनिकों के अर्थ में सीमित किए।
