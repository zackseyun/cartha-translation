  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
translation:
  language: hi
  text: राजा हिजकिय्याह के चौथे वर्ष में—वह इस्राएल के राजा एला के पुत्र होशे का सातवाँ वर्ष था—अश्शूर का राजा शल्मनेसेर सामरिया पर चढ़ाई करके आया और उसकी घेराबंदी की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: में
  rationale: हिब्रू का सामान्य कथात्मक आरंभ यहाँ काल-सूचक वाक्य में स्वाभाविक हिन्दी संरचना द्वारा व्यक्त हुआ है; अलग से ‘और ऐसा हुआ’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: בַּשָּׁנָה הָרְבִיעִית לַמֶּלֶךְ חִזְקִיָּהוּ
  choice: हिजकिय्याह राजा के चौथे वर्ष में
  rationale: राजकीय वर्ष बताने वाले सूत्र को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: הִיא הַשָּׁנָה הַשְּׁבִיעִית לְהוֹשֵׁעַ בֶּן אֵלָה מֶלֶךְ יִשְׂרָאֵל
  choice: जो एला के पुत्र होशे, इस्राएल के राजा, का सातवाँ वर्ष था
  rationale: הִיא द्वारा जुड़े समानांतर राजकीय काल-संबंध को ‘जो ... था’ से सुरक्षित रखा गया है; पदवाचक वाक्यांश को अल्पविरामों से स्पष्ट किया गया है।
- source_word: עָלָה ... עַל שֹׁמְרוֹן
  choice: सामरिया पर चढ़ाई की
  rationale: सैन्य प्रसंग में עלה और עַל का संयुक्त भाव किसी नगर के विरुद्ध अभियान करना है; ‘चढ़ाई की’ हिन्दी में स्वाभाविक और सटीक है।
- source_word: שַׁלְמַנְאֶסֶר מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा शल्मनेसेर
  rationale: नाम और उपाधि को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘अश्शूर’ और ‘शल्मनेसेर’ प्रचलित बाइबलीय लिप्यंतरण हैं।
- source_word: וַיָּצַר עָלֶיהָ
  choice: और उसे घेर लिया
  rationale: צור का यहाँ अर्थ किसी नगर को सैन्य घेराबंदी में लेना है; ‘घेर लिया’ सामान्य पाठक के लिए स्पष्ट और संक्षिप्त है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए सहज रखी गई है। हिब्रू कथात्मक सूत्र को हिन्दी में कृत्रिम रूप से शब्दशः न दोहराकर काल-सूचक वाक्य में समाहित किया गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
