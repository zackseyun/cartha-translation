  yaml_path: translation/ot/2_kings/018/002.yaml
  text: He was twenty-five years old when he began to reign, and he reigned twenty-nine years in Jerusalem. His mother’s name was Abi daughter of Zechariah.
translation:
  language: hi
  text: जब वह राजा बना, तब वह पच्चीस वर्ष का था, और उसने यरूशलेम में उनतीस वर्ष तक राज्य किया। उसकी माता का नाम अबी था; वह जकर्याह की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: पच्चीस वर्ष का
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; हिन्दी में इसका स्वाभाविक और सटीक रूप यही है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना, तब वह ... था
  rationale: यह रचना राज्यारोहण के समय उसकी आयु बताती है। आधुनिक हिन्दी में ‘जब वह राजा बना’ सहज है और आरम्भिक समय का भाव स्पष्ट रखता है।
- source_word: מָלַךְ
  choice: उसने ... राज्य किया
  rationale: क्रिया राजकीय शासन करने की अवधि व्यक्त करती है; ‘राज्य किया’ हिन्दी का प्रचलित और सटीक बाइबलीय प्रयोग है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक प्रयोग को सीधे और प्रचलित हिन्दी वर्तनी में प्रस्तुत किया गया है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: यह राजमाता के नाम का औपचारिक परिचय है; ‘माता’ गरिमापूर्ण और सर्वबोध्य है।
- source_word: אֲבִי
  choice: अबी
  rationale: इब्रानी व्यक्तिगत नाम का निकट और प्रचलित देवनागरी लिप्यंतरण।
- source_word: בַּת זְכַרְיָה
  choice: वह जकर्याह की बेटी थी
  rationale: वंश-संबंध स्पष्ट करने वाली रचना है। अलग उपवाक्य हिन्दी में सहज रहते हुए मूल सूचना को पूर्णतः सुरक्षित रखता है।
