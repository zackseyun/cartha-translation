  edition: WLC
  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: hi
  text: तू कहता है, ‘यह तो केवल होंठों की बात है’—पर युद्ध के लिए युक्ति और सामर्थ्य होते हैं। अब तूने किस पर भरोसा किया है कि तूने मेरे विरुद्ध विद्रोह किया है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְּבַר שְׂפָתַיִם
  choice: होंठों की बात
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखता है; आशय ऐसी बात से है जो केवल कही जाए और जिसके पीछे वास्तविक सामर्थ्य न हो।
- source_word: עֵצָה
  choice: युक्ति
  rationale: युद्ध के प्रसंग में परामर्श से आगे रणनीतिक सूझ-बूझ का भाव देता है और सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: גְבוּרָה
  choice: सामर्थ्य
  rationale: यहाँ युद्ध करने की शक्ति या क्षमता अभिप्रेत है; ‘वीरता’ की तुलना में ‘सामर्थ्य’ प्रसंग को अधिक व्यापक रूप से व्यक्त करता है।
- source_word: בָטַחְתָּ
  choice: भरोसा किया है
  rationale: इब्रानी पूर्ण क्रिया का वर्तमान परिणाम व्यक्त करते हुए उस भरोसे को दर्शाता है जिसके आधार पर विद्रोह किया गया।
- source_word: מָרַדְתָּ בִּי
  choice: मुझसे विद्रोह किया
  rationale: מָרַד के राजनीतिक अधीनता तोड़ने के अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले वाक्य में ‘होंठों की बात’ और ‘युक्ति तथा सामर्थ्य’ का संबंध
  choice: उद्धृत दावे के बाद विरोधसूचक ‘पर’ और आवश्यकतासूचक ‘चाहिए’ रखा गया
  alternative: ‘युद्ध के लिए युक्ति और सामर्थ्य केवल होंठों की बातें हैं’ या ‘मेरे पास युद्ध के लिए युक्ति और सामर्थ्य है—पर यह केवल होंठों की बात है’
  rationale: इब्रानी वाक्य अत्यंत संक्षिप्त है और संबंधसूचक शब्दों का लोप करता है। मासोरेटिक विराम-चिह्न और उपलब्ध परामर्श-पाठ के अनुरूप यह रूप रबशाके के तर्क को स्वाभाविक हिन्दी में रखता है, बिना किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को जोड़ने के।
translation_notes:
  register: एक राजा को संबोधित करने वाली प्राचीन एकवचन पुल्लिंग भाषा के अनुरूप ‘तू’ रखा गया है; शैली सीधी, चुनौतीपूर्ण और गरिमापूर्ण है।
