reference: 2 Kings 18:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
translation:
  language: hi
  text: उस समय हिजकिय्याह ने याहवे के मंदिर के द्वारों और चौखटों[a] को काटकर अलग कर दिया, जिन पर यहूदा के राजा हिजकिय्याह ने परत चढ़ाई थी, और उन्हें अश्शूर के राजा को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘द्वारों के ढाँचे’, ‘खंभे’ अथवा ‘सहारे’; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और मंदिर के द्वारों से जुड़े सहायक स्थापत्य-अंगों को अधिक व्यापक रूप से सूचित कर सकता है।
    reason: दुर्लभ इब्रानी स्थापत्य-संज्ञा का सटीक अर्थ अनिश्चित है।
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह कथा में घटनाक्रम को आगे बढ़ाने वाला सामान्य कालवाचक मुहावरा है; ‘उस समय’ स्वाभाविक और सटीक हिन्दी है।
- source_word: קִצַּץ
  choice: काटकर अलग कर दिया
  rationale: क्रिया काटने या काटकर हटा देने की ठोस क्रिया व्यक्त करती है। यह अनुवाद केवल धातु की परत उतारने का अर्थ थोपे बिना वस्तुओं को हटाने का भाव बनाए रखता है।
- source_word: דַּלְתוֹת
  choice: द्वारों
  rationale: शब्द सामान्यतः द्वारों अथवा उनके पल्लों को दर्शाता है; ‘द्वारों’ स्पष्ट और स्वाभाविक है।
- source_word: הֵיכַל יְהוָה
  choice: याहवे के मंदिर
  rationale: इस प्रसंग में הֵיכַל यरूशलेम के मंदिर को दर्शाता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: הָאֹמְנוֹת
  choice: चौखटों
  rationale: यह दुर्लभ स्थापत्य-संज्ञा मंदिर के द्वारों से जुड़े सहायक ढाँचों को सूचित करती जान पड़ती है। ‘चौखटों’ तत्काल प्रसंग में उपयुक्त है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: צִפָּה
  choice: परत चढ़वाई थी
  rationale: क्रिया किसी सतह पर, प्रायः धातु की, परत चढ़ाने का अर्थ देती है। मूल पद में सामग्री निर्दिष्ट न होने के कारण अनुवाद भी उसे अनिर्दिष्ट रखता है।
- source_word: וַיִּתְּנֵם
  choice: और उन्हें ... दे दिया
  rationale: सरल कथात्मक क्रिया और बहुवचन कर्म-सर्वनाम दोनों सुरक्षित हैं।
- source_word: לְמֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा को
  rationale: यह संबंधवाचक पद का सीधा और हिन्दी में प्रचलित रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: सर्वनाम ‘जिन’ का संबंध
  choice: व्याकरणतः निकटतम ‘चौखटों’ से जोड़ते हुए वाक्य को मूल की तरह खुला रखा गया
  alternative: द्वारों और चौखटों दोनों पर परत चढ़ी थी, ऐसा स्पष्ट करना
  rationale: इब्रानी संबंधवाचक उपवाक्य का निकटतम पूर्वपद הָאֹמְנוֹת है, पर व्यापक संबंध की संभावना पूरी तरह असंभव नहीं। अनुवाद मूल संरचना का अनुसरण करता है और अनावश्यक व्याख्यात्मक विस्तार नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘परत चढ़वाई थी’ धातु का प्रकार बताए बिना צִפָּה का भाव देता है, और दुर्लभ स्थापत्य शब्द की वास्तविक अनिश्चितता पादटिप्पणी में रखी गई है।
