base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
translation:
  language: hi
  text: तब रबशाके ने उनसे कहा, “क्या मेरे स्वामी ने मुझे ये बातें कहने के लिए तुम्हारे स्वामी के और तुम्हारे पास ही भेजा है? क्या उसने मुझे शहरपनाह पर बैठे उन लोगों के पास भी नहीं भेजा, जिन्हें तुम्हारे साथ अपना ही मल खाना और अपना ही मूत्र पीना पड़ेगा?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में घेराबंदी का जानबूझकर अशिष्ट चित्र है: “अपना मल खाना और अपना मूत्र पीना।” पारंपरिक पाठ-पठन (क़ेरे) में इन दोनों कठोर अभिव्यक्तियों के लिए अपेक्षाकृत शिष्ट शब्द हैं: “उनका मल” और “उनके पैरों का पानी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह असीरियाई उच्च अधिकारी की उपाधि है और कथा में लगभग नाम की तरह प्रयुक्त हुई है; लिप्यंतरण पद को अनावश्यक रूप से किसी एक आधुनिक पदनाम में सीमित नहीं करता।
- source_word: הַעַל ... שְׁלָחַנִי אֲדֹנִי
  choice: क्या मेरे स्वामी ने मुझे ... केवल ... के पास भेजा है?
  rationale: प्रश्नवाचक הַ और अगले הֲלֹא से बनने वाला विरोध स्वाभाविक हिंदी में ‘केवल’ और ‘भी नहीं’ द्वारा स्पष्ट होता है।
- source_word: אֲדֹנֶיךָ
  choice: तुम्हारे स्वामी
  rationale: यहाँ संकेत यहूदा के राजा की ओर है, परमेश्वर की उपाधि की ओर नहीं; इसलिए राजनीतिक-सामाजिक अर्थ वाला ‘स्वामी’ उपयुक्त है।
- source_word: לְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें कहने के लिए
  rationale: यह मूल अर्थ को रखते हुए आधुनिक हिंदी में सहज है।
- source_word: הָאֲנָשִׁים הַיֹּשְׁבִים עַל הַחֹמָה
  choice: शहरपनाह पर बैठे उन लोगों
  rationale: ‘शहरपनाह’ घिरे हुए नगर की रक्षात्मक दीवार को स्वाभाविक और प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: לֶאֱכֹל ... וְלִשְׁתּוֹת
  choice: खाना और ... पीना पड़ेगा
  rationale: अनन्त क्रियाएँ घेराबंदी के भावी, विवशकारी परिणाम को बताती हैं; ‘पड़ेगा’ उस कठोर परिणाम को सहज हिंदी में व्यक्त करता है।
- source_word: חרי/הם
  choice: अपना ही मल
  rationale: केतिव का अशिष्ट घेराबंदी-बिंब सीधे और स्पष्ट रूप में सुरक्षित रखा गया है।
- source_word: שיני/הם
  choice: अपना ही मूत्र
  rationale: प्रसंग में अभिप्रेत शारीरिक द्रव्य को स्पष्ट किया गया है, जबकि पाठ-परंपरा की शिष्टोक्ति को पादटिप्पणी में बताया गया है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: संबोधित अधिकारियों और शहरपनाह पर बैठे लोगों की साझा दुर्दशा का सीधा भाव सुरक्षित है।
