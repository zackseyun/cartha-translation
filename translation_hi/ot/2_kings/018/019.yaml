  yaml_path: translation/ot/2_kings/018/019.yaml
  text: 'Then the Rabshakeh said to them, "Please say to Hezekiah, ''Thus says the great king, the king of Assyria: What is this confidence that you have trusted in?''"'
translation:
  language: hi
  text: 'तब रबशाके ने उनसे कहा, “हिजकिय्याह से कहो, ‘महान राजा, अश्शूर का राजा, यह कहता है: यह कैसा भरोसा है, जिस पर तुमने भरोसा किया है?’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַב שָׁקֵה
  choice: रबशाके
  rationale: यह अश्शूरी पदवी है; प्रचलित बाइबलीय रूप को पदवी-सूचक नाम की तरह लिप्यंतरित किया गया है।
- source_word: אִמְרוּ נָא
  choice: कहो
  rationale: נא अनुरोध या विनम्र आग्रह का सूचक हो सकता है, पर इस राजकीय आदेश-संदर्भ में हिंदी का सहज ‘कहो’ पर्याप्त है; ‘कृपया’ भाषण को अनावश्यक रूप से शिष्ट बना सकता है।
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  choice: महान राजा
  rationale: अश्शूरी शाही उपाधि का सीधा और गरिमापूर्ण अनुवाद।
- source_word: מָה הַבִּטָּחוֹן הַזֶּה
  choice: यह कैसा भरोसा है
  rationale: शाब्दिक ‘यह भरोसा क्या है?’ की चुनौतीपूर्ण वाक्पद्धति को स्वाभाविक आधुनिक हिंदी में रखा गया है।
- source_word: אֲשֶׁר בָּטָחְתָּ
  choice: जो तुमने कर रखा है
  rationale: संज्ञा ‘भरोसा’ के साथ उसी धातु בטח की पुनरावृत्ति को हिंदी में स्वाभाविक रूप देते हुए पूर्णतासूचक भाव बनाए रखा गया है।
theological_decisions:
- issue: हिजकिय्याह के भरोसे का लक्ष्य
  choice: लक्ष्य को अनिर्दिष्ट रखा गया
  alternative: ‘तुम किस पर भरोसा करते हो?’
  rationale: इब्रानी पद में यहाँ भरोसे का लक्ष्य स्पष्ट नहीं किया गया; उसे जोड़ना आगामी तर्क को पहले ही व्याख्यायित कर देता।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक राजकीय वक्तव्य के अनुरूप और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण के भीतर उद्धरण को हिंदी विराम-चिह्नों से दिखाया गया है।
