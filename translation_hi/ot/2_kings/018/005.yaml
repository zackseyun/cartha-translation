source:
  edition: WLC
  text: בַּ/יהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בָּטָ֑ח וְ/אַחֲרָ֞י/ו לֹא הָיָ֣ה כָמֹ֗/הוּ בְּ/כֹל֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/005.yaml
  text: He trusted in Yahweh[a], the God of Israel. After him there was none like him among all the kings of Judah, nor among those who were before him.
translation:
  language: hi
  text: उसने इस्राएल के परमेश्वर याहवे पर भरोसा किया। उसके बाद यहूदा के सभी राजाओं में उसके समान कोई नहीं हुआ, न ही उनमें जो उससे पहले थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיהוָה
  choice: यहोवा पर
  rationale: ב विश्वास के आधार या आश्रय को सूचित करता है, इसलिए हिन्दी में स्वाभाविक रूप से ‘पर’ है। יְהוָה को उसके विशिष्ट वाचा-नाम के रूप में ‘यहोवा’ लिखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक रचना यहोवा की पहचान इस्राएल के परमेश्वर के रूप में करती है।
- source_word: בָּטָח
  choice: भरोसा रखा
  rationale: Qal पूर्ण रूप का अर्थ ‘भरोसा करना, निर्भर रहना’ है; ‘भरोसा रखा’ वर्तमान हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וְאַחֲרָיו
  choice: उसके बाद
  rationale: यह कालवाचक पद हिजकिय्याह के बाद आने वाले राजाओं की ओर संकेत करता है।
- source_word: לֹא הָיָה כָמֹהוּ
  choice: उसके समान कोई नहीं हुआ
  rationale: यह तुलना उसकी विशिष्टता व्यक्त करती है और मूल की अस्तित्ववाचक संरचना को सहज हिन्दी में बनाए रखती है।
- source_word: בְּכֹל מַלְכֵי יְהוּדָה
  choice: यहूदा के सब राजाओं में
  rationale: समूह के भीतर तुलना के लिए हिन्दी का ‘में’ मूल ב का उपयुक्त रूप है।
- source_word: וַאֲשֶׁר הָיוּ לְפָנָיו
  choice: और न उन राजाओं में जो उससे पहले हुए थे
  rationale: सापेक्ष उपवाक्य पहले के राजाओं तक तुलना को विस्तृत करता है; ‘राजाओं’ को स्पष्ट करना हिन्दी में अर्थ को सहज बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक और सामान्य पाठक के लिए परिचित है; इसे किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: हिजकिय्याह की अनुपमता का दायरा
  choice: उसके बाद के और उससे पहले के यहूदा के राजाओं के बीच अनुपम
  alternative: हर दृष्टि से पूर्णतः अनुपम राजा
  rationale: कथन को पद की स्पष्ट तुलना तक सीमित रखा गया है; यह नहीं जोड़ा गया कि वह हर गुण में अनुपम था। इससे निकटवर्ती समान कथनों से उत्पन्न साहित्यिक-धर्मवैचारिक तनाव भी बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। वाक्य-विन्यास मूल के दो कालगत तुलना-समूहों को स्पष्ट रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
