  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: The king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
translation:
  language: hi
  text: राजा परमेश्वर के जन के सेवक गेहजी[a] से बात कर रहा था। उसने कहा, “कृपया मुझे वे सभी महान काम बताओ जो एलीशा ने किए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के जन के परिचारक गेहजी” अथवा “परमेश्वर के जन के युवक गेहजी”; इब्रानी शब्द נַעַר संदर्भ के अनुसार सेवक, परिचारक या युवक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֵּר
  choice: बात कर रहा था
  rationale: कर्ता के साथ प्रयुक्त कृदंत कथा में चल रही पृष्ठभूमिगत क्रिया बताता है; इसलिए अपूर्ण भूतकालीन रूप स्वाभाविक और सटीक है।
- source_word: גֵּחֲזִי
  choice: गेहजी
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: נַעַר
  choice: सेवक
  rationale: यह शब्द युवक, परिचारक या सेवक का अर्थ दे सकता है; यहाँ परमेश्वर के जन के साथ गेहजी की भूमिका के संदर्भ में ‘सेवक’ सबसे स्वाभाविक है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी की स्थापित उपाधि का निकट और प्रचलित हिन्दी रूप है तथा सीधे ‘नबी’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: סַפְּרָה נָּא לִי
  choice: कृपया मुझे ... बताओ
  rationale: आज्ञार्थक क्रिया के साथ נָא की विनम्रता को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל הַגְּדֹלוֹת
  choice: वे सभी महान काम
  rationale: विशेषण का संज्ञात्मक प्रयोग एलीशा के उल्लेखनीय बड़े कार्यों को व्यापक रूप से दर्शाता है; ‘महान काम’ मूल की व्यापकता बनाए रखता है।
- source_word: עָשָׂה
  choice: किए हैं
  rationale: पूर्ण क्रिया को ऐसे कार्यों के रूप में प्रस्तुत करता है जो बातचीत के वर्तमान क्षण तक प्रासंगिक हैं।
- source_word: וְהַמֶּלֶךְ
  choice: राजा
  rationale: आरंभिक וְ कथा को आगे बढ़ाता है; हिन्दी में अलग संयोजक जोड़े बिना नया वाक्य आरंभ करना स्वाभाविक है।
