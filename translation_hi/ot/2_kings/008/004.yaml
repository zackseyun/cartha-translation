  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। इब्रानी की पृष्ठभूमिगत चलती क्रिया को ‘बात कर रहा था’ से और विनम्र आग्रह को ‘कृपया’ से व्यक्त किया गया है। प्रत्यक्ष कथन को हिन्दी में अधिक स्वाभाविक बनाने के लिए ‘उसने कहा’ अलग वाक्य में रखा गया है।
