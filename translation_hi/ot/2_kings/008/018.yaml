id: 2KI.8.18
reference: 2 Kings 8:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֜לֶךְ בְּ/דֶ֣רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֗ל כַּ/אֲשֶׁ֤ר עָשׂוּ֙ בֵּ֣ית אַחְאָ֔ב כִּ֚י בַּת אַחְאָ֔ב הָֽיְתָה לּ֖/וֹ לְ/אִשָּׁ֑ה וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/018.yaml
  text: He walked in the way of the kings of Israel, as the house of Ahab had done, for Ahab’s daughter was his wife, and he did what was evil in the eyes of Yahweh.
translation:
  language: hi
  text: वह इस्राएल के राजाओं की राह पर चला, जैसा अहाब के घराने ने किया था, क्योंकि अहाब की बेटी उसकी पत्नी थी। उसने वह किया जो यहोवा की दृष्टि में बुरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: राह पर चला
  rationale: यह मुहावरा जीवन-व्यवहार और आचरण की दिशा बताता है। ‘राह पर चला’ इब्रानी रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं
  rationale: यह उत्तरी राज्य के उन शासकों को उनके नैतिक आचरण के नमूने के रूप में संदर्भित करता है।
- source_word: בֵּית אַחְאָב
  choice: अहाब के घराने
  rationale: राजकीय संदर्भ में בַּיִת परिवार और राजवंश दोनों का बोध करा सकता है। ‘घराना’ इस अर्थ-विस्तार को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उसके आचरण और अहाब के घराने से उसके वैवाहिक संबंध के बीच कारणसूचक संबंध व्यक्त करता है।
- source_word: בַּת אַחְאָב
  choice: अहाब की बेटी
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הָיְתָה לּוֹ לְאִשָּׁה
  choice: उसकी पत्नी थी
  rationale: शाब्दिक रूप ‘उसके लिए पत्नी थी’ यहाँ विद्यमान वैवाहिक संबंध बताता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वही किया जो ... बुरा था
  rationale: यह राजाओं के मूल्यांकन में प्रयुक्त सूत्र है। यह रूप निश्चित הָרַע के भाव को व्यक्त करते हुए हिन्दी में सहज है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: ‘दृष्टि में’ ईश्वरीय मूल्यांकन का इब्रानी मुहावरा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ उसे सामान्य उपाधि से अलग रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में टेट्राग्रामटन प्रत्यक्ष रूप से आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल परंपरा में पहचानने योग्य विशिष्ट नाम है और इसे केवल ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: अहाब की बेटी के प्रभाव का कथन
  choice: केवल मूल का कारणसूचक संबंध रखा गया
  alternative: पत्नी को स्पष्ट रूप से उसके पाप की प्रेरक या दोषी बताना
  rationale: पद वैवाहिक संबंध को कारणसूचक संदर्भ में रखता है, पर प्रभाव की प्रक्रिया या दोष का विस्तृत विभाजन नहीं बताता; इसलिए अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘राह पर चला’ मूल के आचरण-संबंधी रूपक को बनाए रखता है और ‘अहाब का घराना’ राजवंशीय तथा पारिवारिक दोनों संकेतों को समेटता है।
