  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
translation:
  language: hi
  text: तब हजाएल उससे मिलने गया। वह अपने साथ भेंट ले गया—दमिश्क की हर उत्तम वस्तु, चालीस ऊँटों का बोझ। वह आकर उसके सामने खड़ा हुआ और बोला, “आपके पुत्र[a], अराम के राजा बेन-हदद ने मुझे आपके पास यह पूछने भेजा है, ‘क्या मैं इस बीमारी से स्वस्थ हो जाऊँगा?’[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आपके पुत्र” आदर और विनम्रता प्रकट करने वाला संबोधन है; इसका अर्थ यह आवश्यक नहीं कि बेन-हदद वास्तव में एलीशा का पुत्र था।
    reason: cultural_note
  - marker: b
    text: अधिक शाब्दिक रूप से, “क्या मैं इस बीमारी से जीवित रहूँगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: לִקְרַאת का दिशासूचक मुहावरा किसी के पास जाकर उससे मिलने का भाव देता है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: यहाँ यह उपासना-संबंधी चढ़ावा नहीं, बल्कि राजा की ओर से आदरपूर्वक दिया जाने वाला उपहार है; इसलिए ‘भेंट’ उपयुक्त है।
- source_word: בְיָדוֹ
  choice: अपने साथ
  rationale: शाब्दिक रूप ‘अपने हाथ में’ है, पर आगे चालीस ऊँटों के बोझ का उल्लेख होने के कारण हिंदी में ‘अपने साथ’ उस सामी मुहावरे का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  choice: दमिश्क की हर उत्तम वस्तु
  rationale: טוּב यहाँ दमिश्क की उत्तम उपज अथवा बहुमूल्य वस्तुओं को दर्शाता है; वाक्य में इसे भेंट की व्याख्या के रूप में रखा गया है।
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  choice: जिसका बोझ चालीस ऊँटों के लिए था
  rationale: यह वाक्यांश सामान की मात्रा को चालीस ऊँटों पर लादे जाने योग्य बोझ के रूप में बताता है, न कि ऊँटों को स्वयं भेंट का भाग बनाता है।
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: उसके सामने खड़ा हुआ
  rationale: दरबार अथवा सम्मानपूर्ण भेंट की मानक मुद्रा को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: בִּנְךָ
  choice: आपके पुत्र
  rationale: मूल का पारिवारिक रूपक सुरक्षित रखा गया है; प्रसंग में यह किसी आदरणीय श्रेष्ठ व्यक्ति के सामने विनम्र संबोधन है।
- source_word: שְׁלָחַנִי אֵלֶיךָ לֵאמֹר
  choice: मुझे आपके पास यह पूछने भेजा है
  rationale: शाब्दिक ‘यह कहने’ की अपेक्षा प्रश्नवाचक संदेश के संदर्भ में यह हिंदी अधिक स्वाभाविक है और प्रेषित वचन का आशय नहीं बदलती।
- source_word: הַאֶחְיֶה מֵחֳלִי זֶה
  choice: क्या मैं इस बीमारी से स्वस्थ हो जाऊँगा?
  rationale: ‘जीना’ क्रिया बीमारी से उबरने के अर्थ में प्रयुक्त है; मुख्य पाठ में स्वाभाविक हिंदी दी गई है और अधिक शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: אֲרָם
  choice: अराम
  rationale: प्राचीन ऐतिहासिक नाम को बाद के भौगोलिक नाम ‘सीरिया’ से प्रतिस्थापित नहीं किया गया है।
theological_decisions:
- issue: ‘आपके पुत्र’ का संबंध
  choice: मूल रूपक ‘आपके पुत्र’ को मुख्य पाठ में रखा गया
  alternative: ‘आपका सेवक’
  rationale: हिब्रू में वास्तविक शब्द ‘पुत्र’ है और यहाँ यह विनम्रता व अधीन सम्मान का सांस्कृतिक संबोधन हो सकता है; इसे ‘सेवक’ करने से मूल रूपक मिट जाता।
- issue: बीमारी के विषय में प्रश्न
  choice: ‘स्वस्थ हो जाऊँगा’
  alternative: ‘जीवित रहूँगा’
  rationale: प्रसंग में प्रश्न रोग से उबरने के बारे में है, पर मूल की ‘जीना’ क्रिया को पाद-टिप्पणी में दिखाया गया है ताकि संभावित जीवन-मृत्यु का तनाव पूरी तरह न मिटे।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘भेंट’, ‘अराम’ और ‘बेन-हदद’ जैसे रूप ऐतिहासिक संदर्भ और मूल शब्दावली को बनाए रखते हैं। दोनों पाद-टिप्पणी चिह्न संबंधित मुख्य-पाठ अंशों के तुरंत बाद रखे गए हैं।
