  edition: WLC
  text: וַ/תָּ֨קָם֙ הָֽ/אִשָּׁ֔ה וַ/תַּ֕עַשׂ כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וּ/בֵיתָ֔/הּ וַ/תָּ֥גָר בְּ/אֶֽרֶץ פְּלִשְׁתִּ֖ים שֶׁ֥בַע שָׁנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/002.yaml
  text: So the woman arose and did according to the word of the man of God. She went[a], she and her household, and lived as a foreign resident in the land of the Philistines for seven years.
translation:
  language: hi
  text: तब वह स्त्री उठी और उसने परमेश्वर के जन के वचन के अनुसार किया। वह अपने घराने समेत चली गई और पलिश्तियों के देश में सात वर्ष तक परदेशी के रूप में रही[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पलिश्तियों के देश में सात वर्ष तक प्रवास करती रही।”
    reason: גור के लिए एक अधिक पारंपरिक संक्षिप्त विकल्प, जिसमें अस्थायी परदेशी निवास का भाव बना रहता है।
lexical_decisions:
- source_word: וַתָּקָם
  choice: उठी
  rationale: קום के कथात्मक रूप का सीधा और स्वाभाविक अनुवाद; यह निर्देश के उत्तर में उसकी तत्पर कार्रवाई को व्यक्त करता है।
- source_word: וַתַּעַשׂ כִּדְבַר
  choice: उसने ... के वचन के अनुसार किया
  rationale: यह इब्रानी मुहावरा किसी के कहे हुए निर्देश के अनुरूप कार्य करने को दर्शाता है; हिंदी में मूल की अभिव्यक्ति बनाए रखते हुए अर्थ स्पष्ट रहता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह नबी अथवा परमेश्वर द्वारा नियुक्त व्यक्ति के लिए प्रयुक्त मानक बाइबलीय पदवी है और इब्रानी पद का पारदर्शी अनुवाद है।
- source_word: וַתֵּלֶךְ הִיא וּבֵיתָהּ
  choice: वह अपने घराने समेत चली गई
  rationale: यहाँ בַּיִת का अर्थ भौतिक मकान नहीं, बल्कि उसके परिवार और घर से जुड़े लोग हैं; ‘घराने समेत’ इस सामूहिक प्रस्थान को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתָּגָר
  choice: परदेशी के रूप में रही
  rationale: גור केवल रहने को नहीं, बल्कि अपने देश से बाहर परदेशी या अस्थायी निवासी के रूप में रहने की सामाजिक स्थिति को भी व्यक्त करता है।
- source_word: בְּאֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश में
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा अनुवाद है और जातीय-भौगोलिक रूप को सुरक्षित रखता है।
- source_word: שֶׁבַע שָׁנִים
  choice: सात वर्ष तक
  rationale: निवास की अवधि बताने के लिए आधुनिक हिंदी में ‘तक’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘परमेश्वर का जन’ मानक बाइबलीय पदवी के रूप में रखा गया है, और ‘परदेशी के रूप में रही’ से גור का निवास-संबंधी तथा सामाजिक अर्थ स्पष्ट किया गया है।
