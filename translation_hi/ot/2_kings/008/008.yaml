  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֜לֶךְ אֶל חֲזָהאֵ֗ל קַ֤ח בְּ/יָֽדְ/ךָ֙ מִנְחָ֔ה וְ/לֵ֕ךְ לִ/קְרַ֖את אִ֣ישׁ הָ/אֱלֹהִ֑ים וְ/דָרַשְׁתָּ֨ אֶת יְהוָ֤ה מֵֽ/אוֹת/וֹ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
translation:
  language: hi
  text: तब राजा ने हजाएल से कहा, “अपने हाथ में एक उपहार लेकर परमेश्वर के जन से मिलने जा। उसके द्वारा याहवे से पूछ, ‘क्या मैं इस बीमारी से ठीक हो जाऊँगा[a]?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “क्या मैं इस बीमारी से जीवित रहूँगा?” यहाँ “जीना” बीमारी से बचने या ठीक होने के अर्थ में प्रयुक्त है।'
    reason: मूल इब्रानी क्रिया के शाब्दिक अर्थ और प्रसंगानुकूल अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: מִנְחָה
  choice: उपहार
  rationale: इस कथा में यह न तो उपासना की भेंट है, न कर, बल्कि भविष्यद्वक्ता से मिलने जाते समय साथ ले जाया गया उपहार है।
- source_word: בְּיָדְךָ
  choice: अपने हाथ में
  rationale: इब्रानी अभिव्यक्ति को हिंदी में स्वाभाविक रूप से बनाए रखता है और स्वयं साथ ले जाने का भाव देता है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: ‘जा’ के बाद प्रयोजन व्यक्त करता है और आधुनिक हिंदी में सहज है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: मूल पदवी को सुरक्षित रखता है; केवल ‘भविष्यद्वक्ता’ कहने से इसकी कथात्मक और धर्मवैचारिक गूँज कम हो जाती।
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  choice: उसके द्वारा याहवे से पूछ
  rationale: यहाँ דרשׁ ईश्वरीय उत्तर जानने के लिए पूछने का अर्थ देता है, और מֵאֹתוֹ बताता है कि उत्तर परमेश्वर के जन के माध्यम से माँगा जाना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह उपाधि नहीं, इब्रानी चतुरक्षरीय व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित ध्वन्यात्मक रूप है।
- source_word: הַאֶחְיֶה
  choice: क्या मैं…ठीक हो जाऊँगा
  rationale: क्रिया का मूल अर्थ ‘जीना’ है, पर बीमारी के प्रसंग में इसका स्वाभाविक आशय रोग से बचने या स्वस्थ होने का है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מֵחֳלִי זֶה
  choice: इस बीमारी से
  rationale: राजा की वर्तमान अस्वस्थता को स्पष्ट और सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। लिप्यंतरण उसे किसी उपाधि से बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: परमेश्वर से पूछने में भविष्यद्वक्ता की मध्यस्थ भूमिका
  choice: उसके द्वारा याहवे से पूछ
  alternative: उससे याहवे के विषय में पूछ
  rationale: מֵאֹתוֹ का आशय यह है कि याहवे से प्रश्न परमेश्वर के जन के माध्यम से किया जाए; चुना हुआ पाठ यह संबंध स्पष्ट करता है, बिना भविष्यद्वक्ता को उत्तर का स्वतंत्र स्रोत बनाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में राजा का हजाएल से एकवचन आदेश मूल पाठ के अनुरूप है। ‘परमेश्वर का जन’ पारंपरिक बाइबलीय पदवी को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य हिंदी पाठक के लिए स्वाभाविक है।
