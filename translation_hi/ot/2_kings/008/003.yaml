base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/003.yaml
  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
translation:
  language: hi
  text: सात वर्ष पूरे होने पर वह स्त्री पलिश्तियों के देश से लौट आई। तब वह राजा से अपने घर और अपने खेत के लिए गुहार लगाने[a] गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा से अपने घर और अपने खेत के लिए पुकारने” या “विनती करने।”
    reason: צעק के अधिक शाब्दिक ‘पुकारने’ तथा प्रसंगानुकूल ‘विनती करने’ के विकल्प सुरक्षित रखता है, और אֶל־הַמֶּלֶךְ को ‘राजा से’ के रूप में दर्शाता है।
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  choice: सात वर्ष पूरे होने पर
  rationale: यह इब्रानी पदबंध निर्धारित अवधि के अंत को सूचित करता है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: וַתָּשָׁב
  choice: लौट आई
  rationale: प्रसंग में स्त्री का अपने अस्थायी निवास-स्थान से वापस आना अभिप्रेत है।
- source_word: אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों का देश
  rationale: मूल के स्पष्ट भौगोलिक पदबंध को बनाए रखता है।
- source_word: וַתֵּצֵא
  choice: गई
  rationale: हिंदी में उद्देश्यसूचक क्रिया के साथ यह स्वाभाविक रूप से उसके राजा के पास जाने की गति व्यक्त करता है; शाब्दिक 'निकल गई' यहाँ अनावश्यक रूप से भारी होता।
- source_word: לִצְעֹק אֶל הַמֶּלֶךְ
  choice: राजा से न्याय की गुहार लगाने
  rationale: צעק का मूल भाव पुकारने का है, और यहाँ संपत्ति वापस पाने हेतु शासक से प्रतिकार माँगने का न्यायिक संदर्भ है। 'गुहार लगाने' तीव्र याचना को बचाता है और 'न्याय की' प्रसंगगत उद्देश्य स्पष्ट करता है।
- source_word: בֵּיתָהּ
  choice: अपने घर
  rationale: खेत के साथ प्रयुक्त होने के कारण यहाँ भौतिक संपत्ति के रूप में घर सबसे संभावित अर्थ है।
- source_word: שָׂדָהּ
  choice: अपने खेत
  rationale: שׂדה की विशिष्ट कृषि-भूमि संबंधी धारणा को व्यापक 'ज़मीन' के बजाय 'खेत' ठीक प्रकार व्यक्त करता है।
