  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिंदी। ‘न्याय की गुहार’ सामान्य पाठक को राजकीय प्रतिकार की स्थिति समझाती है, जबकि पादटिप्पणी मूल क्रिया की अधिक शाब्दिक अर्थछाया बनाए रखती है।
