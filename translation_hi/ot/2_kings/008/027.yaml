source:
  edition: WLC
  text: וַ/יֵּ֗לֶךְ בְּ/דֶ֨רֶךְ֙ בֵּ֣ית אַחְאָ֔ב וַ/יַּ֧עַשׂ הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה כְּ/בֵ֣ית אַחְאָ֑ב כִּ֛י חֲתַ֥ן בֵּית אַחְאָ֖ב הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
translation:
  language: hi
  text: वह अहाब के घराने के मार्ग पर चला और उसने यहोवा की दृष्टि में बुरा किया, अहाब के घराने के समान; क्योंकि वह अहाब के घराने का दामाद था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अहाब के घराने से विवाह द्वारा संबंधी था।” इब्रानी शब्द वैवाहिक संबंध को अधिक व्यापक अर्थ में भी बता सकता है, यद्यपि यहाँ “दामाद” सबसे सटीक अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: की चाल पर चला
  rationale: यह इब्रानी मुहावरा आचरण या जीवन-रीति को दर्शाता है। ‘चाल पर चला’ गति के रूपक और नैतिक आशय दोनों को बनाए रखता है।
- source_word: בֵּית אַחְאָב
  choice: अहाब का घराना
  rationale: בַּיִת यहाँ परिवार, राजवंश और उससे जुड़े राजकीय घराने को सूचित कर सकता है; ‘घराना’ आधुनिक हिन्दी में इस व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  choice: उसने वही किया जो यहोवा की दृष्टि में बुरा था
  rationale: यह राजाओं की पुस्तक का प्रचलित मूल्यांकन-सूत्र है। यह अनुवाद इब्रानी की वस्तुगत रचना और परमेश्वर द्वारा नैतिक मूल्यांकन—दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परियोजना की नीति के अनुसार परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כְּבֵית אַחְאָב
  choice: जैसा अहाब के घराने ने किया था
  rationale: तुलना के निहित क्रियात्मक अर्थ को हिन्दी में स्पष्ट किया गया है, ताकि वाक्य स्वाभाविक रहे और तुलना स्वयं घराने के अस्तित्व से नहीं, उसके आचरण से समझी जाए।
- source_word: כִּי חֲתַן בֵּית אַחְאָב הוּא
  choice: क्योंकि वह अहाब के घराने का दामाद था
  rationale: חֲתַן का सबसे विशिष्ट अर्थ ‘दामाद’ है और यहाँ ऐतिहासिक संदर्भ में उपयुक्त है; फिर भी यह शब्द व्यापक वैवाहिक संबंध भी सूचित कर सकता है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखते हुए नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: अहाब के घराने के समान बुराई करने का आशय
  choice: जैसा अहाब के घराने ने किया था
  alternative: अहाब के घराने के समान
  rationale: मूल तुलना संक्षिप्त और कुछ हद तक अंडाकार है। हिन्दी में निहित क्रिया स्पष्ट करने से आशय खुलता है, पर कोई अतिरिक्त सिद्धान्तगत दावा नहीं जुड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ वंश और परिवार दोनों का संकेत देता है; ‘चाल पर चला’ मूल के आचरण-संबंधी रूपक को बनाए रखता है।
