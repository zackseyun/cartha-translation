  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
translation:
  language: hi
  text: योराम अपने पुरखाओं के साथ सो गया[a] और उसे दाऊद के नगर में उसके पुरखाओं के साथ दफ़नाया गया। फिर उसका पुत्र अहज्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने पुरखाओं के साथ लेट गया।’ यह इब्रानी में राजा की मृत्यु बताने वाला पारंपरिक वाक्यांश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: यहाँ שׁכב राजकीय मृत्यु-वृत्तांत का पारंपरिक मुहावरा है। ‘सो गया’ मृत्यु का संकेत देते हुए इब्रानी रूपक को बनाए रखता है; केवल ‘मर गया’ कहना मुहावरे को मिटा देता।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से वंशगत पूर्वजों का भाव स्वाभाविक आधुनिक हिन्दी में आता है और राजवंशीय सूत्र का अर्थ बना रहता है।
- source_word: וַיִּקָּבֵר
  choice: उसे ... दफ़नाया गया
  rationale: निफ़अल रूप का कर्मवाच्य अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊदपुर में
  rationale: עִיר דָּוִד एक स्थापित स्थाननाम है; ‘दाऊदपुर’ संक्षिप्त, स्वाभाविक और पारंपरिक हिन्दी बाइबलीय प्रयोग के अनुरूप है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूत्र में מלך यहाँ शासन सँभालने को दर्शाता है। ‘राजा हुआ’ आधुनिक हिन्दी में इस प्रवेश को सहजता से व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में תַּחְתָּיו का सीधा अर्थ ‘उसके स्थान पर’ है।
- source_word: יוֹרָם
  choice: योराम
  rationale: मसोरेटिक पाठ के יוֹרָם का प्रत्यक्ष हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֲחַזְיָהוּ
  choice: अहज्याह
  rationale: इब्रानी नाम אֲחַזְיָהוּ का प्रचलित और स्रोत-समीप हिन्दी रूप चुना गया है।
