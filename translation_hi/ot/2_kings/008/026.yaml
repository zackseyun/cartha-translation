base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
translation:
  language: hi
  text: जब अहज्याह राजा बना, तब वह बाईस वर्ष का था। उसने यरूशलेम में एक वर्ष तक राज्य किया। उसकी माता का नाम अतल्याह था; वह इस्राएल के राजा ओम्री की बेटी[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वंशज।” इब्रानी में “बेटी” शब्द कभी-कभी सगी बेटी के बजाय किसी स्त्री वंशज या राजवंश की सदस्या के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: वह बाईस वर्ष का था
  rationale: यह इब्रानी आयु-सूचक मुहावरे का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: בְמָלְכוֹ
  choice: जब अहज्याह राजा बना
  rationale: राज्यारोहण-सूचक इब्रानी पदबंध को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְשָׁנָה אַחַת מָלַךְ
  choice: उसने ... एक वर्ष तक राज्य किया
  rationale: राज्यकाल की अवधि को सहज हिन्दी में ठीक-ठीक व्यक्त करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक पद का मानक हिन्दी रूप।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: मूल की औपचारिक वंशावली-सूचक शैली को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: עֲתַלְיָהוּ
  choice: अतल्याह
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בַּת עָמְרִי
  choice: ओम्री की बेटी
  rationale: בַּת का मूल और प्रत्यक्ष अर्थ 'बेटी' है; व्यापक वंशगत अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: ओम्री की राजकीय पहचान बताने वाली संबंध-रचना का स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: ‘ओम्री की बेटी’ में वंश-संबंध का आशय
  choice: मुख्य पाठ में प्रत्यक्ष पारिवारिक पद ‘बेटी’ रखा गया है।
  alternative: ओम्री की वंशज
  rationale: इब्रानी में ‘बेटी’ कभी-कभी निकट पुत्री के बजाय स्त्री वंशज या राजवंश की सदस्या को भी सूचित कर सकता है। मूल शब्द को मुख्य पाठ में रखते हुए व्यापक संभावना पादटिप्पणी में दी गई है, ताकि अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘माता’ वंशावली-सूचक प्रसंग की औपचारिकता बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज है।
