source:
  edition: WLC
  text: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה מָלַ֛ךְ יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
translation:
  language: hi
  text: और अहाब के पुत्र, इस्राएल के राजा योराम के राज्य के पाँचवें वर्ष में, जब यहोशापात यहूदा का राजा था[a], यहूदा का राजा यहोशापात का पुत्र यहोराम[b] राज्य करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और यहोशापात, यहूदा का राजा।” इब्रानी वाक्यांश संक्षिप्त है; कुछ लोग इसे सह-शासन की अवधि का संकेत मानते हैं।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में दोनों नामों के रूप अलग हैं: इस्राएल के राजा का नाम “योराम” और यहोशापात के पुत्र, यहूदा के राजा का नाम “यहोრამ” है, यद्यपि ये दोनों नाम निकट संबंध रखते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת חָמֵשׁ
  choice: पाँचवें वर्ष में
  rationale: इब्रानी राजकीय कालगणना में संख्या पाँच क्रमवाचक अर्थ रखती है; आधुनिक हिन्दी में ‘पाँचवें वर्ष में’ स्वाभाविक है। आरंभिक वाव का कथात्मक संबंध हिन्दी वाक्य-प्रवाह में निहित रखा गया है।
- source_word: לְ/יוֹרָם בֶּן אַחְאָב מֶלֶךְ יִשְׂרָאֵל
  choice: अहाब के पुत्र योराम के इस्राएल पर राज्य करने के
  rationale: लामेद यहाँ योराम के शासन के अनुसार वर्ष की गणना बताता है। ‘इस्राएल पर राज्य करने’ से राजकीय संबंध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וִ/יהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: जब यहोशापात यहूदा का राजा था
  rationale: इब्रानी पदबंध क्रियारहित और संक्षिप्त है। ‘जब ... राजा था’ संभावित कालगत परिस्थिति व्यक्त करता है, पर सह-शासन को मुख्य पाठ में निश्चित तथ्य नहीं बनाता।
- source_word: מָלַךְ
  choice: राज्य करने लगा
  rationale: राजकीय वृत्तांत में यह क्रिया यहाँ राजगद्दी संभालने अथवा शासन आरंभ करने को सूचित करती है; ‘राज्य करने लगा’ उस आरंभिक बल को स्पष्ट रखता है।
- source_word: יוֹרָם / יְהוֹרָם
  choice: योराम / यहोराम
  rationale: इब्रानी पाठ इस्राएल के राजा יוֹרָם और यहूदा के राजा יְהוֹרָם के नामों में भेद करता है; हिन्दी लिप्यंतरण में भी यह भेद सुरक्षित रखा गया है।
- source_word: יְהוֹרָם בֶּן יְהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: यहोशापात का पुत्र यहोराम, यहूदा का राजा
  rationale: वंश-सूचना और अंतिम राजकीय उपाधि दोनों को इब्रानी के अनुसार बनाए रखा गया है, भले ही संदर्भ में कुछ पुनरुक्ति हो।
theological_decisions:
- issue: यहोशापात के शासन और यहोराम के राज्यारोहण से जुड़ा संक्षिप्त कालक्रम
  choice: मुख्य पाठ में ‘जब यहोशापात यहूदा का राजा था’
  alternative: ‘और यहोशापात यहूदा का राजा था’; अथवा सह-शासन को स्पष्ट रूप से कहना
  rationale: मूल इब्रानी क्रियारहित और संक्षिप्त है तथा कालक्रमगत तनाव छोड़ता है। कालगत अनुवाद पठनीय है, लेकिन सह-शासन जैसी व्याख्या को निश्चित करके मूल की अस्पष्टता समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज राजकीय-वृत्तांत शैली अपनाई गई है। ‘राज्य करने लगा’ सामान्य पाठक के लिए स्पष्ट है। नामों का इब्रानी भेद और संक्षिप्त कालक्रम की वास्तविक अस्पष्टता पादटिप्पणियों सहित सुरक्षित रखी गई है।
