base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/015.yaml
  text: And it happened on the next day that he took the covering cloth[a], dipped it in water, and spread it over his face, and he died[b]. Then Hazael reigned in his place.
translation:
  language: hi
  text: अगले दिन उसने ढकने का कपड़ा[a] लिया, उसे पानी में डुबोया और उसके चेहरे पर फैला दिया; तब वह मर गया[b]। फिर हजाएल उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिस्तर का आवरण,” “रजाई” अथवा “बुना या जालीदार कपड़ा”; इसका इब्रानी शब्द दुर्लभ है, इसलिए कपड़े का ठीक प्रकार अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ इन कार्यों के कर्ता को स्पष्ट रूप से नहीं बताता। प्रसंग के आधार पर बहुत-से लोग उसे हजाएल समझते हैं, पर अंतिम उपवाक्य में हजाएल का नाम आने तक कर्ता क्रियारूपों में ही निहित है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह समय-सूचक पद पिछली घटनाओं के अगले दिन को दर्शाता है; यह सहज और संक्षिप्त हिन्दी है।
- source_word: הַמַּכְבֵּר
  choice: ओढ़ने का कपड़ा
  rationale: यह दुर्लभ संज्ञा किसी आवरण अथवा बुने हुए कपड़े को सूचित करती है। यह चयन उसके सामान्य कार्य को व्यक्त करता है, जबकि वस्तु की ठीक पहचान पादटिप्पणी में अनिश्चित रखी गई है।
- source_word: וַיִּטְבֹּל בַּמַּיִם
  choice: उसे पानी में डुबोया
  rationale: क्रिया का मूल अर्थ डुबाना या निमज्जित करना है; हिन्दी में यह क्रिया-क्रम को सीधे व्यक्त करता है।
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  choice: उसके मुँह पर फैला दिया
  rationale: क्रिया फैलाने या बिछाने को दर्शाती है। यहाँ 'मुँह पर फैला दिया' शारीरिक क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּמֹת
  choice: तब वह मर गया
  rationale: इब्रानी कथा-क्रम में अगली घटना 'और वह मर गया' है। 'तब' क्रम को सहज हिन्दी में व्यक्त करता है, बिना उद्देश्य या स्पष्ट कारणात्मक संबंध जोड़े।
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
  choice: फिर हजाएल उसके स्थान पर राजा हुआ
  rationale: यह राज्यारोहण और उत्तराधिकार की बात है; 'राजा हुआ' आधुनिक हिन्दी में स्पष्ट है और 'उसके स्थान पर' मूल उत्तराधिकार सूत्र को सुरक्षित रखता है।
theological_decisions:
- issue: ‘लिया,’ ‘डुबोया’ और ‘फैला दिया’ क्रियाओं का अनाम कर्ता
  choice: मुख्य पाठ में केवल ‘उसने’ रखा गया है और उसे नाम से हजाएल नहीं कहा गया
  alternative: कर्ता को स्पष्ट रूप से हजाएल मानकर उसका नाम लिखना
  rationale: इब्रानी क्रियारूपों में कर्ता अंतर्निहित ‘वह’ है; इस पद में अंतिम उपवाक्य से पहले हजाएल का नाम नहीं आता। प्रसंग से हजाएल का अनुमान सामान्य है, पर मूल पाठ की अस्पष्टता बनाए रखना उचित है।
- issue: וַיָּמֹת में क्रिया-क्रम और कारणात्मकता
  choice: ‘तब वह मर गया’
  alternative: ‘जिससे वह मर गया’ या ‘और वह मर गया’
  rationale: मूल पाठ साधारण कथा-क्रम देता है। ‘तब’ उस क्रम को स्पष्ट करता है, पर ‘जिससे’ जैसी अधिक स्पष्ट कारणात्मक या उद्देश्यपरक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली रखी गई है। ‘ओढ़ने का कपड़ा’ दुर्लभ वस्तु का सामान्य कार्य बताता है; पादटिप्पणी उसकी शाब्दिक अनिश्चितता सुरक्षित रखती है। सर्वनामों की अस्पष्टता मूल इब्रानी के अनुरूप जानबूझकर बनी रहने दी गई है।
