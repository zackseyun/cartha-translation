source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
translation:
  language: hi
  text: तब योराम अपने साथ सभी रथों को लेकर ज़ाईर[a] की ओर गया। फिर वह रात को उठा और उसने उसके चारों ओर घेरा डाले हुए एदोमियों और रथों के सेनापतियों पर प्रहार किया; पर लोग अपने-अपने तंबुओं में भाग गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “सेईर।” इब्रानी स्थान-नाम צָעִירָה का पाठ कठिन है; कुछ इसे अलग स्थान ज़ाईर न मानकर सेईर/एदोम से संबंधित रूप समझते हैं।
    reason: alternative_reading
  - marker: b
    text: “अपने-अपने तंबुओं में भाग गए” एक इब्रानी मुहावरा है, जिसका अर्थ है कि वे तितर-बितर होकर अपने घर लौट गए।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: पार होकर ... गया
  rationale: यह עבר के पार जाने या पार होकर आगे बढ़ने के मूल अर्थ को सैन्य गतिविधि के संदर्भ में बनाए रखता है, बिना मार्ग का अनावश्यक अनुमान लगाए।
- source_word: צָעִירָה
  choice: साईर
  rationale: मसोरेटिक स्वरांकन के अनुसार इसे एक स्थान-नाम मानकर लिप्यंतरित किया गया है। सेईर/एदोम से इसके संभावित संबंध को पादटिप्पणी में रखा गया है।
- source_word: הָרֶכֶב
  choice: सभी रथों
  rationale: רכב यहाँ सामूहिक रथ-सेना का संकेत दे सकता है, पर ‘रथ’ मूल शब्द के निकट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: קָם לַיְלָה
  choice: रात में उठा
  rationale: यह रात के समय उठकर कार्रवाई करने की इब्रानी अभिव्यक्ति और कथा-क्रम दोनों को सुरक्षित रखता है।
- source_word: וַיַּכֶּה
  choice: वार किया
  rationale: נכה के व्यापक ‘मारना/प्रहार करना’ अर्थ को व्यक्त करता है और इसे निर्णायक विजय के रूप में बढ़ा-चढ़ाकर नहीं बताता।
- source_word: אֱדוֹם הַסֹּבֵיב אֵלָיו
  choice: अपने को चारों ओर से घेरे हुए एदोमियों
  rationale: ‘एदोम’ को यहाँ सामूहिक रूप से एदोमी सेना के लिए समझा गया है; वाक्यांश घेराबंदी की सैन्य छवि को स्पष्ट रखता है।
- source_word: שָׂרֵי הָרֶכֶב
  choice: रथों के सेनापतियों
  rationale: שׂרים के अधिकारी/सेनापति अर्थ और इब्रानी संबंध-वाक्यांश को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּנָס הָעָם לְאֹהָלָיו
  choice: लोग अपने-अपने तंबुओं को भाग गए
  rationale: ‘लोग’ העם के व्यापक अर्थ को रखता है, जबकि ‘अपने-अपने तंबुओं को’ मूल इब्रानी सैन्य मुहावरे की छवि सुरक्षित रखता है।
