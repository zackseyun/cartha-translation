  text: जब वह राजा बना, तब वह बत्तीस वर्ष का था, और उसने यरूशलेम में आठ वर्ष तक राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים וּשְׁתַּיִם שָׁנָה
  choice: वह बत्तीस वर्ष का था
  rationale: आयु बताने वाला इब्रानी मुहावरा हिन्दी में स्वाभाविक रूप से व्यक्ति की आयु के कथन द्वारा व्यक्त किया गया है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना, तब
  rationale: यह पदबंध राजसिंहासन पर बैठने के समय को सूचित करता है; यह हिन्दी में स्पष्ट और सहज रूप है।
- source_word: וּשְׁמֹנֶה שנה
  choice: आठ वर्ष तक
  rationale: संख्या और अवधि को ठीक बनाए रखते हुए ‘तक’ शासन की अवधि स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: क्रिया का अर्थ राजा के रूप में शासन करना है; ‘राज्य किया’ आधुनिक हिन्दी बाइबलीय गद्य में स्वाभाविक और गरिमापूर्ण है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग का सीधा और स्वाभाविक हिन्दी अनुवाद।
