  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उठो’, ‘घराने समेत’ और ‘परदेशी बनकर रहना’ कथा की औपचारिकता तथा मूल के सामाजिक-सांस्कृतिक भाव के बीच संतुलन रखते हैं।
