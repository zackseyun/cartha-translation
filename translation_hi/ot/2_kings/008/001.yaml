base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
translation:
  language: hi
  text: एलीशा ने उस स्त्री से, जिसके बेटे को उसने फिर जीवित किया था, कहा था, “उठो, तुम अपने घराने समेत चली जाओ, और जहाँ कहीं रह सको, वहाँ अस्थायी रूप से रहो[a], क्योंकि याहवे ने अकाल को बुलाया है, और वह इस देश पर आ भी पड़ा है और सात वर्ष तक रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ कहीं तुम परदेशी निवासी के रूप में रह सको, वहाँ रहो।” इब्रानी क्रिया גור में प्रायः अस्थायी निवासी अथवा परदेशी बनकर रहने का भाव होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר
  choice: कहा था
  rationale: इब्रानी पूर्ण क्रिया को प्रसंग में पूर्वघटित कथन के रूप में स्वाभाविक हिन्दी भूतपूर्व से व्यक्त किया गया है।
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  choice: जिसके बेटे को उसने फिर से जीवित किया था
  rationale: हिफ़ील रूप के कारक अर्थ और पहले घटित पुनर्जीवन, दोनों को स्पष्ट और सहज हिन्दी में रखा गया है।
- source_word: קוּמִי וּלְכִי
  choice: उठो और ... चली जाओ
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञाओं को सीधे संबोधन और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: אַתִּי וּבֵיתֵךְ
  choice: अपने घराने समेत
  rationale: בֵּית का अर्थ यहाँ भवन नहीं, बल्कि स्त्री के साथ जाने वाला परिवार/गृहस्थ समुदाय है; ‘घराने समेत’ इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  choice: जहाँ कहीं तुम परदेशी बनकर रह सको, वहाँ रहो
  rationale: दोहराए गए גור का अस्थायी अथवा परदेशी निवासी होने का भाव सुरक्षित रखा गया है, जबकि हिन्दी वाक्य स्वाभाविक बना रहता है।
- source_word: כִּי קָרָא יְהוָה לָרָעָב
  choice: क्योंकि यहोवा ने अकाल को बुलाया है
  rationale: קרא ל की ‘बुलाने/आह्वान करने’ वाली सजीव उपमा और परमेश्वर की सक्रियता को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
- source_word: וְגַם בָּא אֶל־הָאָרֶץ שֶׁבַע שָׁנִים
  choice: और वह इस देश पर सात वर्ष तक रहने वाला है
  rationale: अकाल के देश पर आने की निश्चितता और सात वर्षों की अवधि को स्वाभाविक हिन्दी में व्यक्त किया गया है; इब्रानी perfect का आसन्न/निश्चित भाव लक्ष्य भाषा में भविष्याभिमुख रूप लेता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ अधिक पुनर्निर्मित उच्चारण दर्शाता है।
- issue: अकाल पर परमेश्वर की सक्रियता
  choice: यहोवा ने अकाल को बुलाया है
  alternative: यहोवा ने अकाल की घोषणा की है
  rationale: मूल का קרא ל अकाल को बुलाने या तलब करने की भाषा रखता है। मुख्य पाठ इस तनावपूर्ण सक्रियता को नरम करके केवल घोषणा में नहीं बदलता।
