  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֱלִישָׁ֔ע לֵ֥ךְ אֱמָר לא חָיֹ֣ה תִחְיֶ֑ה וְ/הִרְאַ֥/נִי יְהוָ֖ה כִּֽי מ֥וֹת יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
translation:
  language: hi
  text: तब एलीशा ने उससे कहा, “जाकर उससे कहो, ‘तुम निश्चय ही अच्छे हो जाओगे।’[a] परन्तु यहोवा ने मुझे दिखाया है कि वह निश्चय ही मर जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक पाठ है, “तुम निश्चय ही जीवित नहीं रहोगे।” यहाँ इब्रानी पाठ कठिन है; बहुत-से लोग प्रसंग के अनुसार इसका आशय “तुम निश्चय ही अच्छे हो जाओगे” समझते हैं, जिसके विपरीत अगले वाक्य में प्रकट किया गया है कि वह वास्तव में मर जाएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  choice: तब एलीशा ने उससे कहा
  rationale: कर्ता एलीशा मूल पाठ में स्पष्ट है। वַ का कथात्मक प्रवाह स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: לֵךְ אֱמָר
  choice: जाकर उससे कहो
  rationale: दोनों आज्ञार्थों का भाव सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक संयुक्त क्रिया-रूप चुना गया है।
- source_word: לא חָיֹה תִחְיֶה
  choice: तुम निश्चय ही अच्छे हो जाओगे
  rationale: रोग के प्रसंग में חיה का आशय स्वस्थ होने या बच जाने से है। मुख्य पाठ प्रसंगानुकूल सकारात्मक कथन देता है, जबकि मसोराई पाठ के कठिन नकारात्मक रूप को पादटिप्पणी में स्पष्ट किया गया है। इनफिनिटिव एब्सोल्यूट और इम्परफेक्ट की बलवत्ता ‘निश्चय ही’ से व्यक्त है।
- source_word: וְהִרְאַנִי יְהוָה
  choice: परन्तु यहोवा ने मुझे दिखाया है
  rationale: וְ यहाँ अगले प्रकाशन के साथ विरोध प्रकट करता है, इसलिए ‘परन्तु’ उपयुक्त है। יְהוָה को परियोजना की रीति के अनुसार ‘यहोवा’ रखा गया है।
- source_word: כִּי מוֹת יָמוּת
  choice: कि वह निश्चय ही मर जाएगा
  rationale: מות के इनफिनिटिव एब्सोल्यूट और इम्परफेक्ट का निश्चितताबोध ‘निश्चय ही’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: कठिन पाठ לא חיה תחיה का अनुवाद
  choice: मुख्य पाठ में ‘तुम निश्चय ही अच्छे हो जाओगे’ और पादटिप्पणी में मसोराई नकारात्मक पाठ
  alternative: ‘तुम निश्चय ही जीवित नहीं रहोगे’
  rationale: मसोराई स्वरांकन के अनुसार לא नकार है, पर यह अगले विरोधात्मक कथन और कथा-प्रसंग के साथ कठिन तनाव उत्पन्न करता है। सम्भावित अभिप्राय को मुख्य पाठ में रखते हुए वास्तविक पाठगत अस्पष्टता को पादटिप्पणी में पारदर्शी रूप से सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अच्छे हो जाओगे’ रोग से स्वस्थ होने के प्रसंग में स्वाभाविक हिन्दी है; पाठगत कठिनाई को छिपाया नहीं गया है।
