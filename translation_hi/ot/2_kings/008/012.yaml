source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָאֵ֔ל מַדּ֖וּעַ אֲדֹנִ֣/י בֹכֶ֑ה וַ/יֹּ֡אמֶר כִּֽי יָדַ֡עְתִּי אֵ֣ת אֲשֶׁר תַּעֲשֶׂה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֜ל רָעָ֗ה מִבְצְרֵי/הֶ֞ם תְּשַׁלַּ֤ח בָּ/אֵשׁ֙ וּ/בַחֻֽרֵי/הֶם֙ בַּ/חֶ֣רֶב תַּהֲרֹ֔ג וְ/עֹלְלֵי/הֶ֣ם תְּרַטֵּ֔שׁ וְ/הָרֹתֵי/הֶ֖ם תְּבַקֵּֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/012.yaml
  text: 'Hazael said[a], “Why is my lord weeping?” And he said, “Because I know the evil that you will do to the sons of Israel: you will set their fortresses on fire, kill their young men with the sword, dash their little children to pieces[b], and rip open their pregnant women.”'
translation:
  language: hi
  text: 'हज़ाएल ने कहा, “मेरे प्रभु क्यों रो रहे हैं?” उसने कहा, “क्योंकि मैं जानता हूँ कि तुम इस्राएलियों[a] के साथ कैसी बुराई करोगे: तुम उनके गढ़ों को आग लगा दोगे[b], उनके जवानों को तलवार से मार डालोगे, उनके छोटे बच्चों को पटककर टुकड़े-टुकड़े कर दोगे और उनकी गर्भवती स्त्रियों का पेट चीर डालोगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “इस्राएल के पुत्रों” है; आशय इस्राएल की प्रजा से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उनके गढ़ों को आग में भेज दोगे”; अर्थात उन्हें जला दोगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: एलीशा को आदरपूर्वक संबोधित करने वाला मानवीय सम्मानसूचक पद है; हिन्दी में “मेरे प्रभु” उस विनम्रता को बनाए रखता है, यद्यपि यहाँ यह परमेश्वर का पद नहीं है।
- source_word: בֹכֶה
  choice: रो रहे हैं
  rationale: कृदन्त जारी क्रिया दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक और गंभीर दोनों है।
- source_word: כִּי יָדַעְתִּי
  choice: क्योंकि मैं जानता हूँ
  rationale: כִּי उत्तर का कारण प्रस्तुत करता है और पूर्ण क्रिया का वर्तमान-संबद्ध अर्थ यहाँ स्वाभाविक है।
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה ... רָעָה
  choice: तुम ... कैसी बुराई करोगे
  rationale: रָעָה को संबंधवाचक कथन के साथ जोड़कर हिन्दी में स्वाभाविक ढंग से रखा गया है और कृत्यों का नैतिक भार सुरक्षित है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ “इस्राएल के पुत्रों” है, पर यहाँ सामूहिक रूप से इस्राएल की प्रजा अभिप्रेत है; “इस्राएलियों” आधुनिक हिन्दी में स्पष्ट है, और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִבְצְרֵיהֶם תְּשַׁלַּח בָּאֵשׁ
  choice: उनके गढ़ों को आग लगा दोगे
  rationale: शाब्दिक बिंब “आग में भेजना” है; “आग लगा देना” उसी क्रिया का स्वाभाविक हिन्दी समतुल्य है और מִבְצָר का सैन्य अर्थ “गढ़” से व्यक्त होता है।
- source_word: וּבַחֻרֵיהֶם
  choice: उनके जवानों
  rationale: यह शब्द युवावस्था के पुरुषों, प्रायः युद्धयोग्य जवानों, को सूचित करता है; “जवान” संक्षिप्त और संदर्भानुकूल है।
- source_word: בַּחֶרֶב תַּהֲרֹג
  choice: तलवार से मार डालोगे
  rationale: हथियार और हत्या की स्पष्टता को बिना नरम किए सुरक्षित रखता है।
- source_word: עֹלְלֵיהֶם
  choice: उनके छोटे बच्चों
  rationale: शब्द शिशुओं या बहुत छोटे बच्चों का द्योतक है; “छोटे बच्चे” आयु को अनावश्यक रूप से अधिक संकीर्ण नहीं करता।
- source_word: תְּרַטֵּשׁ
  choice: पटककर टुकड़े-टुकड़े कर दोगे
  rationale: युद्ध में बेरहमी से पटकने या चूर करने की तीव्र क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָרֹתֵיהֶם תְּבַקֵּעַ
  choice: उनकी गर्भवती स्त्रियों का पेट चीर डालोगे
  rationale: हिब्रू में गर्भवती स्त्रियों को चीरने का वीभत्स कृत्य स्पष्ट है; हिन्दी में आवश्यक कर्म “पेट” जोड़ने से आशय स्वाभाविक और निर्विवाद होता है।
theological_decisions:
- issue: לִבְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: हिब्रू मुहावरा व्याकरणतः पुल्लिंग बहुवचन है, पर पूरे इस्राएली समुदाय को दर्शाता है। मुख्य पाठ में स्वाभाविक सामूहिक रूप रखा गया और औपचारिक रूप पादटिप्पणी में सुरक्षित है।
- issue: भविष्यवाणी में वीभत्स हिंसा का प्रस्तुतीकरण
  choice: अत्याचारों को स्पष्ट और बिना शिष्टोक्ति के प्रस्तुत करना
  alternative: हानि या आक्रमण जैसे नरम शब्दों का प्रयोग
  rationale: मूल पाठ जानबूझकर कठोर और नैतिक रूप से गंभीर है। उसका प्रभाव घटाना भविष्यवाणी की भयावहता और एलीशा के रोने का कारण धुँधला कर देगा।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। हिंसा के वर्णन को मूल की स्पष्टता के अनुसार तीखा रखा गया है, पर अनावश्यक अलंकरण नहीं जोड़ा गया। संबोधन “मेरे प्रभु” मानवीय आदरसूचक है।
