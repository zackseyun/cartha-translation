language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
translation:
  language: hi
  text: हजाएल ने कहा, “पर आपका सेवक, यह कुत्ता, है ही क्या कि वह इतना बड़ा काम करे?” तब एलीशा ने कहा, “याहवे ने मुझे दिखाया है कि तुम अराम के राजा[a] बनोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, ‘अराम पर राजा।’
    reason: मूल इब्रानी में ‘राजा’ के साथ עַל (‘पर/के ऊपर’) है; मुख्य पाठ में स्वाभाविक हिन्दी प्रयोग ‘अराम के राजा’ रखा गया है।
lexical_decisions:
- source_word: כִּי מָה
  choice: पर ... है ही क्या
  rationale: यह पदबंध हजाएल की अविश्वासपूर्ण आपत्ति को आरम्भ करता है। ‘पर’ प्रसंगगत विरोध को और ‘है ही क्या’ आलंकारिक प्रश्न की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: यह आत्म-विनम्रता दिखाने वाली परंपरागत दरबारी अभिव्यक्ति है; ‘दास’ की तुलना में ‘सेवक’ यहाँ कानूनी दासत्व का अनावश्यक संकेत नहीं देता।
- source_word: הַכֶּלֶב
  choice: यह कुत्ता
  rationale: निश्चित संज्ञा को हिन्दी में ‘यह कुत्ता’ कहना उसकी अपमानजनक और आत्म-हीनतापूर्ण छवि को सहज रूप में बनाए रखता है।
- source_word: כִּי יַעֲשֶׂה
  choice: कि वह ... करे
  rationale: यह रचना क्षमता या संभावना के प्रति अविश्वास प्रकट करती है। हिन्दी संभावनार्थक ‘करे’ इस आलंकारिक बल को बनाए रखता है, बिना इसे केवल क्षमता या निश्चित भविष्य तक सीमित किए।
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: इतना बड़ा काम
  rationale: דבר का अर्थ व्यापक है, पर पिछले पद में बताए गए कृत्यों के संदर्भ में ‘काम’ स्वाभाविक है। ‘इतना बड़ा’ वक्ता की चकित प्रतिक्रिया को हिन्दी में स्पष्ट करता है; यहाँ ‘बड़ा’ नैतिक प्रशंसा नहीं, परिमाण और गंभीरता बताता है।
- source_word: הִרְאַנִי
  choice: ने मुझे दिखाया है
  rationale: हिफ़ील पूर्ण क्रिया को वर्तमान परिणाम वाले पूर्णकाल में व्यक्त किया गया है; यह हाल में प्राप्त प्रकाशन और वर्तमान कथन का संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: מֶלֶךְ עַל אֲרָם
  choice: अराम पर राजा
  rationale: עַל का सीधा अर्थ ‘पर’ है। ‘अराम’ मूल स्थान-नाम को सुरक्षित रखता है और आधुनिक सीरिया से अनावश्यक समानता से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; उसे नाम के रूप में प्रस्तुत करना स्रोत की विशिष्टता को सुरक्षित रखता है।
- issue: हजाएल के प्रश्न में नैतिक असमर्थता या सामाजिक हीनता
  choice: 'आलंकारिक प्रश्न को खुला रखा गया: ‘आपका सेवक, यह कुत्ता, है ही क्या...?’'
  alternative: ‘मुझ जैसे कुत्ते में ऐसा करने की सामर्थ्य कहाँ है?’
  rationale: मूल कथन यह स्पष्ट नहीं करता कि हजाएल अपनी क्षमता, पद, संभावना या नैतिक वृत्ति में से किसका निषेध कर रहा है। अनुवाद इस तनाव को निर्णायक व्याख्या से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आपका’ के साथ गरिमापूर्ण किंतु सहज कथन। ‘यह कुत्ता’ की कठोर आत्म-हीनतापूर्ण उपमा और ‘अराम पर राजा’ की मूल-सन्निकट रचना सुरक्षित रखी गई है।
