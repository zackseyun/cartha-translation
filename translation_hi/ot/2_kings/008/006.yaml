  choice: राजा ने उस स्त्री से पूछा
  rationale: लְ के साथ שׁאל यहाँ किसी व्यक्ति से पूछने का भाव देता है। पूर्वप्रसंग में पहचानी जा चुकी शूनेमी स्त्री के लिए स्वाभाविक हिन्दी में ‘उस स्त्री’ उपयुक्त है।
- source_word: וַתְּסַפֶּר לוֹ
  choice: उसने उसे सब बता दिया
  rationale: पिएल रूप ספר का अर्थ यहाँ वृत्तांत सुनाना या बताना है। ‘सब’ कथित विषय को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इब्रानी में कर्म निहित है।
- source_word: וַיִּתֶּן לָהּ הַמֶּלֶךְ סָרִיס אֶחָד
  choice: राजा ने उसके लिए एक राज-अधिकारी नियुक्त किया
  rationale: נתן की इस रचना में किसी व्यक्ति को कार्य के लिए ठहराने या नियुक्त करने का अर्थ है। סָרִיס दरबारी अधिकारी अथवा नपुंसक दोनों अर्थ दे सकता है; मुख्य पाठ में प्रसंगानुकूल प्रशासनिक भूमिका रखी गई और वैकल्पिक अर्थ पादटिप्पणी में दिया गया। אֶחָד के कारण ‘एक’ बनाए रखा गया है।
- source_word: הָשֵׁיב אֶת כָּל אֲשֶׁר לָהּ
  choice: जो कुछ उसका है, वह सब उसे लौटा दो
  rationale: हिफ़ील आज्ञार्थक שוב यहाँ संपत्ति वापस कराने की आज्ञा देता है। हिन्दी में ‘लौटा दो’ स्पष्ट और स्वाभाविक है तथा व्यापक כָּל को बनाए रखता है।
- source_word: כָּל תְּבוּאֹת הַשָּׂדֶה
  choice: खेत की सारी उपज
  rationale: תְּבוּאָה खेत की उपज या पैदावार को सूचित करता है। ‘उपज’ इसे केवल नकद आय तक सीमित नहीं करती।
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  choice: जिस दिन से उसने यह देश छोड़ा था उस दिन से लेकर अब तक
  rationale: कालावधि को स्पष्ट हिन्दी में व्यक्त किया गया है। הָאָרֶץ प्रसंग में उसके अपने देश/भूभाग की ओर संकेत करता है; ‘यह देश’ कथास्थल से संबंध स्पष्ट करता है, बिना किसी आधुनिक राष्ट्र की धारणा थोपे।
