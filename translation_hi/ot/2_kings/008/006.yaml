base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: The king asked the woman, and she told him. Then the king appointed an official[a] for her, saying, “Restore everything that belongs to her, along with all the yield of the field from the day she left the land until now.”
translation:
  language: hi
  text: राजा ने उस स्त्री से पूछा, और उसने उसे सब कुछ बता दिया। तब राजा ने उसके लिए एक राज-अधिकारी[a] नियुक्त किया और कहा, “जो कुछ उसका है, वह सब उसे लौटा दो, और जिस दिन उसने देश छोड़ा था, उस दिन से अब तक खेत की सारी उपज भी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक नपुंसक।” यहाँ प्रयुक्त राजकीय पद ऐसे व्यक्ति के लिए हो सकता है जो सचमुच नपुंसक था, अथवा सामान्य रूप से किसी राज-अधिकारी के लिए।
    reason: इब्रानी סָרִיס में ‘नपुंसक’ और ‘राज-दरबारी अधिकारी’ दोनों अर्थ संभव हैं।
lexical_decisions:
