  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
translation:
  language: hi
  text: जब वह राजा को बता रहा था कि एलीशा ने मरे हुए को कैसे जीवित किया था[a], तभी वह स्त्री, जिसके बेटे को उसने जीवित किया था, अपने घर और अपने खेत के लिए राजा से गुहार कर रही थी। गेहज़ी ने कहा, “हे राजा, मेरे स्वामी, यही वह स्त्री है, और यही उसका बेटा है, जिसे एलीशा ने जीवित किया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरे हुए को जीवन लौटा दिया था” अथवा “मरे हुए को जिला दिया था।” हिब्रू क्रिया का अर्थ है “जीवित करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר
  choice: जब वह ... बता ही रहा था
  rationale: यह अभिव्यक्ति चल रही पृष्ठभूमि-क्रिया को स्वाभाविक हिन्दी में व्यक्त करती है; ‘ही’ उसी क्षण घटे संयोग की भूमिका बनाता है।
- source_word: אֵת אֲשֶׁר הֶחֱיָה אֶת הַמֵּת
  choice: कि एलीशा ने कैसे मरे हुए को फिर से जीवित किया था
  rationale: हिब्रू में कर्ता संदर्भ से ज्ञात है; हिन्दी में अस्पष्टता से बचने के लिए एलीशा का नाम दिया गया। ‘फिर से जीवित किया’ हिफ़ील रूप की कारक शक्ति को सुरक्षित रखता है। एकवचन ‘मरे हुए’ मूल के הַמֵּת को दर्शाता है।
- source_word: וְהִנֵּה
  choice: तभी वही
  rationale: यह कथानक में अचानक और चकित करने वाले संयोग को आधुनिक हिन्दी में सजीव रूप से व्यक्त करता है।
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  choice: राजा से न्याय की पुकार कर रही थी
  rationale: צעק सहायता या न्याय पाने की तीव्र पुकार को सूचित करता है; संदर्भ में केवल ऊँची आवाज़ से अधिक, न्याय की अपील अभिप्रेत है।
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  choice: अपने घर और अपने खेत के विषय में
  rationale: עַל यहाँ उसकी विनती का विषय बताता है। ‘खेत’ שָׂדֶה की विशिष्ट संपत्ति-संबंधी छवि बनाए रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: यह राजदरबार के सम्मानपूर्ण संबोधन को गरिमापूर्ण और समझने योग्य हिन्दी में रखता है।
- source_word: זֹאת הָאִשָּׁה וְזֶה בְּנָהּ
  choice: यही वह स्त्री है, और यही उसका बेटा है
  rationale: ‘यही’ सामने उपस्थित व्यक्तियों की तत्काल और आश्चर्यजनक पहचान पर बल देता है।
- source_word: אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  choice: जिसे एलीशा ने फिर से जीवित किया था
  rationale: एक ही पद में तीन बार आए הֶחֱיָה के लिए समान हिन्दी अभिव्यक्ति रखी गई है।
