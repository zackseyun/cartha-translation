id: 2KI.8.7
reference: 2 Kings 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
translation:
  language: hi
  text: तब एलीशा दमिश्क आया। उस समय अराम का राजा बेन-हदद बीमार था। उसे यह समाचार दिया गया, “परमेश्वर का जन यहाँ आया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में इस क्रम को व्यक्त करता है और בוא का सामान्य अर्थ ‘आना’ बनाए रखता है।
- source_word: אֱלִישָׁע
  choice: एलीशा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: דַּמֶּשֶׂק
  choice: दमिश्क
  rationale: स्थाननाम का प्रचलित हिन्दी रूप।
- source_word: וּבֶן־הֲדַד
  choice: उस समय ... बेन-हदद
  rationale: यहाँ वाव पृष्ठभूमि की परिस्थिति प्रस्तुत करता है; ‘उस समय’ हिन्दी में घटना से उसका संबंध स्वाभाविक ढंग से दिखाता है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: मूल इब्रानी का जातीय-भौगोलिक नाम ‘अराम’ रखा गया है; इसे व्याख्यात्मक रूप से ‘सीरिया’ नहीं किया गया।
- source_word: חֹלֶה
  choice: बीमार था
  rationale: विधेय कृदन्त राजा की उस समय की अवस्था बताता है; यह सरल और स्वाभाविक हिन्दी है।
- source_word: וַיֻּגַּד לוֹ
  choice: उसे यह समाचार दिया गया
  rationale: इब्रानी के अवैयक्तिक कर्मवाच्य को हिन्दी में बनाए रखता है; ‘समाचार’ कथन की सूचना-संबंधी प्रकृति को स्वाभाविक बनाता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अस्वाभाविक होता; ‘यह समाचार दिया गया’ के बाद उद्धरण वही कार्य करता है।
- source_word: בָּא
  choice: आया है
  rationale: सूचित वाणी में पूर्ण क्रिया आगमन के वर्तमान परिणाम—उस व्यक्ति का अब यहाँ होना—को व्यक्त करती है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी उपाधि का निकट और हिन्दी बाइबलीय प्रयोग में सुबोध रूप है; इसे व्याख्यात्मक रूप से ‘भविष्यद्वक्ता’ नहीं बनाया गया।
- source_word: עַד הֵנָּה
  choice: यहाँ
  rationale: मुहावरे का आशय वक्ता के स्थान तक पहुँचने से है; ‘यहाँ’ हिन्दी में स्वाभाविक है।
