  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
translation:
  language: hi
  text: फिर भी याहवे अपने सेवक दाऊद के कारण यहूदा को नष्ट करने को तैयार नहीं था, जैसा कि उसने दाऊद से कहा था[a] कि वह उसे उसके पुत्रों के लिए सदा एक दीपक देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिज्ञा की थी।”
    reason: lexical_alternative
  - marker: b
    text: “दीपक” दाऊद के राजवंश के बने रहने का राजकीय रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  choice: फिर भी ... नहीं चाहा
  rationale: पूर्ववर्ती न्याय के प्रसंग के साथ विरोध दर्शाने के लिए וְ को ‘फिर भी’ और इच्छा/सम्मति सूचक אָבָה को ‘नहीं चाहा’ किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका निकट लिप्यंतरण रखा गया है।
- source_word: לְהַשְׁחִית אֶת־יְהוּדָה
  choice: यहूदा का नाश करना
  rationale: हिफ़ील रूप यहाँ यहूदा पर विनाशकारी न्याय को व्यक्त करता है; ‘नाश करना’ स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  choice: अपने सेवक दाऊद के कारण
  rationale: यह वाक्यांश दाऊद के प्रति वाचागत विचार के आधार पर याहवे के उद्देश्य को बताता है और दाऊद की ‘सेवक’ की पहचान बनाए रखता है।
- source_word: כַּאֲשֶׁר אָמַר לוֹ
  choice: क्योंकि उसने दाऊद से कहा था
  rationale: אָמַר का मूल अर्थ ‘कहा’ रखा गया है; हिन्दी में सर्वनाम की अस्पष्टता घटाने के लिए ‘दाऊद’ दोहराया गया है। प्रसंग में यह कथन प्रतिज्ञा का कार्य करता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: נִיר
  choice: एक दीपक
  rationale: राजवंश के बने रहने का ठोस राजकीय रूपक सुरक्षित रखा गया है; इसे मुख्य पाठ में ‘वंश’ कहकर व्याख्यायित नहीं किया गया।
- source_word: לְבָנָיו
  choice: उसके पुत्रों के लिए
  rationale: पूर्वसर्ग לְ का सीधा अर्थ ‘के लिए’ रखा गया है और राजकीय उत्तराधिकार के पुरुष-संतानों वाले प्रसंग के कारण ‘पुत्रों’ का प्रयोग किया गया है।
- source_word: כָּל־הַיָּמִים
  choice: सदा
  rationale: शाब्दिक ‘सभी दिनों’ का स्वाभाविक हिन्दी मुहावरा ‘सदा’ है; यह निरंतरता व्यक्त करता है।
- source_word: לָתֵת לוֹ נִיר
  choice: एक दीपक बनाए रखेगा
  rationale: शाब्दिक ‘दीपक देगा’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है; राजवंश की निरंतरता के रूपक को बनाए रखते हुए ‘बनाए रखेगा’ आशय स्पष्ट करता है।
theological_decisions:
- issue: नִיר के दाऊदी राजवंश-संबंधी रूपक का अनुवाद
  choice: एक दीपक
  alternative: एक प्रकाश; एक राजवंश
  rationale: ठोस रूपक अंतरपाठीय और धर्मवैचारिक संबंध बनाए रखता है; उसका राजवंशीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत नाम को किसी उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित किया गया है।
- issue: אָמַר के वाचा-संबंधी आशय का अनुवाद
  choice: कहा था
  alternative: प्रतिज्ञा की थी
  rationale: मुख्य पाठ में हिब्रू क्रिया का सामान्य अर्थ रखा गया है, जबकि इस प्रसंग में उसके प्रतिज्ञात्मक आशय को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी में है। ‘फिर भी’ प्रसंगगत विरोध को, ‘नहीं चाहा’ इच्छा के भाव को और ‘दीपक’ मूल राजवंशीय रूपक को सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के बाद मुख्य पाठ में रखे गए हैं।
