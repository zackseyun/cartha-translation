  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
translation:
  language: hi
  text: वह अपना चेहरा स्थिर करके टकटकी लगाए रहा, यहाँ तक कि वह लज्जित हो गया[a]; और परमेश्वर का जन रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ तक कि हजाएल लज्जित हो गया।” इब्रानी में ‘लज्जित हुआ’ का कर्ता उतना स्पष्ट नहीं है, जितना हिन्दी में सामान्यतः अपेक्षित होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת־פָּנָיו
  choice: अपना चेहरा स्थिर करके
  rationale: हिफ़ईल क्रिया के साथ ‘अपने चेहरे’ को कर्म के रूप में रखते हुए चेहरे को स्थिर रखने का भाव व्यक्त किया गया है; यह इब्रानी बिंब को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: וַיָּשֶׂם
  choice: टकटकी लगाए रहा
  rationale: शाब्दिक अर्थ ‘रखा/लगाया’ है, पर पहले खंड के साथ मिलकर लगातार स्थिर दृष्टि से देखने का मुहावरेदार भाव देता है।
- source_word: עַד־בֹּשׁ
  choice: जब तक कि वह लज्जित न हो गया
  rationale: בוש के लज्जित या संकोच में पड़ने के भाव को व्यक्त करता है। ‘वह’ जानबूझकर अनिर्दिष्ट रखा गया है, क्योंकि इब्रानी में यह स्पष्ट नहीं कि लज्जित होने वाला एलीशा है या हजाएल।
- source_word: וַיֵּבְךְּ
  choice: रो पड़ा
  rationale: בכה का अर्थ रोना है; ‘रो पड़ा’ प्रसंग में भाव के अचानक प्रकट होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: भविष्यद्वक्ता एलीशा के लिए प्रयुक्त मूल उपाधि को ‘भविष्यद्वक्ता’ कहकर व्याख्यायित करने के बजाय संरक्षित किया गया है।
theological_decisions:
- issue: עַד־בֹּשׁ में लज्जित होने वाले व्यक्ति की अस्पष्टता
  choice: मुख्य पाठ में अनिर्दिष्ट सर्वनाम ‘वह’ रखा गया है।
  alternative: ‘जब तक हजाएल लज्जित न हो गया’ या इसे एलीशा के विषय में स्पष्ट करना।
  rationale: इब्रानी वाक्य कर्ता को इतना स्पष्ट नहीं करता कि एक ही व्याख्या अनिवार्य हो। इसलिए मुख्य पाठ तनाव और अस्पष्टता बनाए रखता है, जबकि पादटिप्पणी हजाएल वाली सम्भावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘चेहरा स्थिर करके टकटकी लगाए रहा’ मूल के दो क्रमिक क्रियात्मक पदों को स्वाभाविक हिन्दी में जोड़ता है; अर्धविराम के बाद अंतिम भावात्मक क्रिया अलग उभरती है।
