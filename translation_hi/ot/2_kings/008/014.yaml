base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
translation:
  language: hi
  text: तब वह एलीशा के पास से चला गया और अपने स्वामी के पास आया। उसके स्वामी ने उससे पूछा, “एलीशा ने तुमसे क्या कहा?” उसने उत्तर दिया, “उन्होंने मुझसे कहा, ‘तुम निश्चय ही स्वस्थ हो जाओगे।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम निश्चय ही जीवित रहोगे।” इब्रानी में बल देने के लिए ‘जीना’ क्रिया दो बार आई है; शाब्दिक रूप से, “जीना, तुम जीओगे।” इस प्रसंग में इसका आशय बीमारी से स्वस्थ होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  choice: वह एलीशा के पास से चला गया
  rationale: הלך और מֵאֵת मिलकर एलीशा की उपस्थिति से प्रस्थान व्यक्त करते हैं। ‘पास से चला गया’ आधुनिक हिन्दी में स्वाभाविक है और अलग होने का भाव बनाए रखता है।
- source_word: וַיָּבֹא אֶל אֲדֹנָיו
  choice: अपने स्वामी के पास आया
  rationale: בוא + אֶל को ‘के पास आया’ और मानव अधिकारी के लिए אֲדֹנָיו को ‘अपने स्वामी’ कहना राजदरबार के संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: מָה אָמַר לְךָ אֱלִישָׁע
  choice: एलीशा ने तुमसे क्या कहा?
  rationale: यह प्रश्न का सीधा, स्वाभाविक और स्रोत-संगत हिन्दी रूप है।
- source_word: אָמַר לִי
  choice: उन्होंने मुझसे कहा
  rationale: एलीशा के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है; कथन की सामग्री में कुछ नहीं जोड़ा गया है।
- source_word: חָיֹה תִחְיֶה
  choice: तुम निश्चय ही स्वस्थ हो जाओगे
  rationale: धातु की infinitive absolute + imperfect रचना बलाघात देती है। बीमारी के प्रसंग में ‘स्वस्थ हो जाओगे’ अभिप्रेत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक ‘जीवित रहोगे’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: אֲדֹנָיו का मानव अथवा ईश्वरीय पदनाम होना
  choice: अपने स्वामी
  alternative: अपने प्रभु
  rationale: यहाँ शब्द हजाएल के मानव अधिकारी, बेन-हदद, को सूचित करता है। ‘स्वामी’ दरबारी/अधीनस्थ संबंध को व्यक्त करता है और अनावश्यक ईश्वरीय संकेत से बचता है।
- issue: חָיֹה תִחְיֶה में जीवन और रोगमुक्ति का संबंध
  choice: तुम निश्चय ही स्वस्थ हो जाओगे
  alternative: तुम निश्चय ही जीवित रहोगे
  rationale: तात्कालिक प्रश्न बीमारी के परिणाम के बारे में है, इसलिए मुख्य पाठ में रोगमुक्ति का प्रसंगगत अर्थ दिया गया है; मूल क्रिया ‘जीना’ और उसकी बलाघाती पुनरावृत्ति पादटिप्पणी में स्पष्ट रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। संवाद में स्वाभाविक आदरसूचक रूप ‘उन्होंने’ अपनाया गया है। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
