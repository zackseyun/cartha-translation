  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹרָ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/023.yaml
  text: The rest of the acts of Yoram[b][a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: योराम[a] के बाकी काम और उसने जो कुछ किया, क्या वे सब यहूदा के राजाओं के इतिहास-वृत्तांत की पुस्तक[b] में लिखे हुए नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: योराम; परंपरागत रूप: यहोराम।'
    reason: alternative_reading
  - marker: b
    text: या “यहूदा के राजाओं के वार्षिक वृत्तांतों की पुस्तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी’ या ‘शेष’ है; राजकीय सारांश के इस सूत्र में דִּבְרֵי राजा के कामों और कार्यों को सूचित करता है। यह सहज हिंदी में सूत्र का आशय बनाए रखता है।
- source_word: יוֹרָם
  choice: योराम
  rationale: यह इब्रानी नाम יוֹרָם का सीधा देवनागरी लिप्यंतरण है। पारंपरिक रूप ‘यहोराम’ को पादटिप्पणी में दिया गया है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह संबंधवाचक उपवाक्य की संरचना और व्यापक अर्थ दोनों को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वह सब ... नहीं लिखा है?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न बनाता है। हिंदी में समष्टिवाचक ‘वह सब’ के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/लपेटे हुए ग्रंथ पर’ है, पर किसी लिखित अभिलेख का संदर्भ देते समय हिंदी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत की पुस्तक
  rationale: राजकीय अभिलेख के इस सूत्र में דִּבְרֵי הַיָּמִים घटनाओं के क्रमबद्ध इतिहास या वार्षिक वृत्तांत को सूचित करता है। यह चयन आधुनिक पाठक के लिए स्पष्ट रहते हुए स्रोत का अभिलेखीय भाव बनाए रखता है।
- source_word: לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के
  rationale: यहाँ לְ संबंधित राजाओं से संबंध या शीर्षकीय अधिकार बताता है; हिंदी में संबंधकारक ‘के’ सबसे स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय सारांश के सूत्र की संक्षिप्तता तथा मूल का आलंकारिक प्रश्न सुरक्षित है; आरंभिक וְ के लिए अनावश्यक कालसूचक ‘अब’ नहीं जोड़ा गया।
