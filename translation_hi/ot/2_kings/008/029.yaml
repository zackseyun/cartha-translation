  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
translation:
  language: hi
  text: तब राजा योराम उन घावों से स्वस्थ होने के लिए यिज्रेल लौट गया, जो अरामियों ने रामा में अराम के राजा हजाएल से युद्ध करते समय उसे लगाए थे। और यहूदा का राजा, यहोराम का पुत्र अहज्याह, अहाब के पुत्र योराम से मिलने के लिए यिज्रेल को नीचे गया, क्योंकि वह बीमार था।
  philosophy: optimal-equivalence
