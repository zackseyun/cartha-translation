- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: कथात्मक क्रम में שוב यहाँ युद्ध के बाद योराम के यिज्रेल वापस जाने को व्यक्त करता है।
- source_word: לְהִתְרַפֵּא
  choice: चंगा होने के लिए
  rationale: रפא का हित्पएल रूप स्वास्थ्य-लाभ को दर्शाता है; यह हिन्दी में स्वाभाविक है और स्वयं को चंगा करने का अनुचित भाव नहीं देता।
- source_word: מִן הַמַּכִּים
  choice: उन घावों से
  rationale: शब्द का मूल भाव प्रहार है, पर इस सैनिक और चिकित्सकीय संदर्भ में उससे हुए घाव अभिप्रेत हैं।
- source_word: אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  choice: जो अरामियों ने ... उसे लगाए थे
  rationale: यह घावों के कर्ताओं को स्पष्ट करता और अरामी जातिनाम को प्राचीन ऐतिहासिक संदर्भ के अनुरूप रखता है।
- source_word: בָּרָמָה
  choice: रामा में
  rationale: स्थानसूचक ב का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָהאֵל מֶלֶךְ אֲרָם
  choice: अराम के राजा हजाएल से उसके युद्ध के समय
  rationale: क्रिया के साथ אֶת यहाँ विरोधी पक्ष को दर्शाता है; हिन्दी में ‘से युद्ध’ स्वाभाविक है।
- source_word: וַאֲחַזְיָהוּ...יָרַד
  choice: और ... अहज्याह ... यिज्रेल गया
  rationale: ירד का शाब्दिक अर्थ ‘नीचे गया’ है, किंतु आधुनिक हिन्दी में गंतव्य के साथ केवल ‘गया’ अधिक सहज है; भू-दिशात्मक बारीकी फुटनोट में सुरक्षित है।
- source_word: לִרְאוֹת אֶת יוֹרָם
  choice: योराम को देखने के लिए
  rationale: मूल के शाब्दिक ‘देखने’ को रखा गया है; संदर्भ में इसका आशय बीमार व्यक्ति से मिलने जाना है।
- source_word: כִּי חֹלֶה הוּא
  choice: क्योंकि वह बीमार था
  rationale: חֹלֶה उसकी वर्तमान अस्वस्थ दशा बताता है; कारण घाव हैं, फिर भी इसे केवल ‘घायल’ कहना मूल को संकुचित करेगा।
