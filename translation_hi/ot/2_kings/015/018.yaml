source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
translation:
  language: hi
  text: उसने वही किया जो यहोवा की दृष्टि में बुरा था। वह अपने सारे जीवन भर नबात के पुत्र यारोबाम[a] के पापों से नहीं फिरा, जिसने इस्राएल को पाप करने पर उकसाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नबात के पुत्र यारोबाम के उन पापों से, जिनके द्वारा यारोबाम ने इस्राएल को पाप करने पर उकसाया था।” इब्रानी में संबंधवाचक उपवाक्य को ‘यारोबाम’ के बजाय ‘पापों’ से भी जोड़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: राजाओं की पुस्तक में प्रचलित नैतिक मूल्यांकन की इस अभिव्यक्ति को स्वाभाविक हिन्दी में रखते हुए ‘करने’ और ‘बुरा’ दोनों का अर्थ सुरक्षित रखा गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी रूपक ‘आँखों में’ का स्वाभाविक हिन्दी समतुल्य है और ईश्वरीय मूल्यांकन व्यक्त करता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא סָר מֵעַל חַטֹּאות
  choice: उन पापों से ... नहीं फिरा
  rationale: סור के मुड़ने अथवा हटने के रूपक और पापपूर्ण मार्ग को न छोड़ने के आशय, दोनों को संक्षिप्त और सहज हिन्दी में रखा गया है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: नामों का प्रचलित हिन्दी लिप्यंतरण और इब्रानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को ‘पाप करवाया’ से व्यक्त किया गया है; मुख्य पाठ में संबंधवाचक उपवाक्य को निकटवर्ती ‘पापों’ से जोड़ा गया है।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: शाब्दिक ‘उसके सब दिनों’ का आधुनिक, स्पष्ट हिन्दी मुहावरा, जो उसके पूरे जीवन अथवा शासनकाल की निरंतरता बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ को रखा गया है, न कि ‘प्रभु’ से नाम को प्रतिस्थापित किया गया।
- issue: संबंधवाचक उपवाक्य אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל का पूर्वपद
  choice: 'मुख्य पाठ में ‘पापों’ से संबंध: ‘जिनके द्वारा उसने इस्राएल से पाप करवाया था’'
  alternative: '‘यारोबाम’ से संबंध: ‘यारोबाम, जिसने इस्राएल से पाप करवाया था’'
  rationale: इब्रानी वाक्यरचना दोनों संबंधों की अनुमति देती है। निकट संदर्भ और पापों के साधनात्मक भाव के कारण मुख्य पाठ में ‘पापों’ को पूर्वपद बनाया गया, जबकि वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जीवन भर’ को अंत के असहज भारीपन से बचाने हेतु मुख्य क्रिया के पास रखा गया है।
