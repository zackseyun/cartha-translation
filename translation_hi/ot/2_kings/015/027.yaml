source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: hi
  text: यहूदा के राजा अजर्याह के शासन के बावनवें वर्ष में रमल्याह का पुत्र पेकह शोमरोन में इस्राएल का राजा बना और उसने बीस वर्ष तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: शासन के बावनवें वर्ष में
  rationale: यह राजकीय वर्ष बताने वाला मानक इब्रानी सूत्र है। हिंदी में क्रमवाचक रूप ‘बावनवें वर्ष’ स्वाभाविक है; ‘शासन के’ जोड़ने से स्पष्ट होता है कि वर्ष अजर्याह के राजकाल का है।
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अजर्याह के
  rationale: संबंधसूचक रचना अजर्याह के राजकाल से तिथि को जोड़ती है और उसकी राजकीय उपाधि को स्पष्ट रखती है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: राजकीय वृत्तांत में यह पूर्ण क्रिया प्रायः सिंहासनारोहण दर्शाती है। ‘राजा बना’ इसे बाद में दी गई शासन-अवधि से अलग और स्वाभाविक रखता है।
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  choice: रमल्याह का पुत्र पेकह
  rationale: इब्रानी पितृनाम-सूत्र को सहज हिंदी शब्दक्रम में सुरक्षित रखा गया है; व्यक्तिनामों का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: מלך के साथ עַל किसी प्रजा या राज्य पर राज करने का अर्थ देता है। हिंदी में ‘इस्राएल का राजा बना’ प्रत्यक्ष ‘इस्राएल पर राजा बना’ से अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: यह स्थानवाचक पद शासन के केंद्र या राजधानी को बताता है; ‘में’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: עֶשְׂרִים שָׁנָה
  choice: बीस वर्ष तक
  rationale: यह पेकह के शासन की अवधि का सीधा अनुवाद है; ‘तक’ हिंदी में अवधि को सहज रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण राजकीय-वृत्तांत शैली अपनाई गई है। वाक्य मूल इब्रानी के तिथि, वंश, स्थान और शासन-अवधि के सभी घटकों को सुरक्षित रखता है।
