source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י עֲזַרְיָ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: The rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: अजर्याह के बाकी काम और उसने जो कुछ किया, क्या वे यहूदा के राजाओं के इतिहास की पुस्तक में लिखे नहीं हैं?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי עֲזַרְיָהוּ
  choice: अजर्याह के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में יֶתֶר का स्वाभाविक अर्थ ‘बाकी’ और דִּבְרֵי का आशय राजा के कार्यों से है, केवल उसके कथनों से नहीं।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह व्यापक और सीधा अनुवाद मूल संबंधवाचक उपवाक्य को सहज हिन्दी में रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: हिब्रू के आलंकारिक प्रश्न और כְּתוּבִים के प्रत्यक्ष अर्थ ‘लिखे’—दोनों को सुरक्षित रखा गया है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक ‘पुस्तक/पत्र पर’ की अपेक्षा अभिलेखीय सन्दर्भ में हिन्दी का स्वाभाविक प्रयोग ‘पुस्तक में’ है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास
  rationale: דִּבְרֵי הַיָּמִים यहाँ राजकीय वृत्तान्त या अभिलेख का शीर्षक है; ‘इतिहास’ साधारण आधुनिक पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
