  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण राजकीय-सारांश शैली अपनाई गई है। पद में कोई अनिवार्य पाठालोचनात्मक या सांस्कृतिक पाद-टिप्पणी नहीं जोड़ी गई; मूल का आलंकारिक प्रश्न ज्यों का त्यों रखा गया है।
