  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
translation:
  language: hi
  text: तब रमल्याह के पुत्र पेकह ने, जो उसका सेनाधिकारी था[a], उसके विरुद्ध षड्यंत्र रचा। उसने शोमरोन में राजभवन के दुर्ग[b] में अर्गोब और अर्येह[c] के साथ उस पर वार किया; और उसके साथ गिलादियों में से पचास पुरुष थे[d]। इस प्रकार उसने उसे मार डाला और उसके स्थान पर राजा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द उच्च पद के किसी सैन्य अधिकारी को दर्शाता है; ठीक पद अनिश्चित है। इसका अनुवाद ‘उसका प्रधान सेनापति’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ ‘राजभवन’ या ‘किलेबंद राजनिवास’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘अर्येह’ को यहाँ अर्गोब के समान एक व्यक्तिनाम समझा गया है; इस इब्रानी शब्द का सामान्य अर्थ ‘सिंह’ भी है।
    reason: lexical_alternative
  - marker: d
    text: ‘उसके साथ’ का संकेत संभवतः पेकह की ओर है; मूल इब्रानी में सर्वनाम का नाम स्पष्ट रूप से दोहराया नहीं गया है।
    reason: referent_ambiguity
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: उसके विरुद्ध षड्यंत्र रचा
  rationale: राजनीतिक प्रसंग में קשר राजद्रोही षड्यंत्र को दर्शाता है; यह सहज और प्रसंगानुकूल हिन्दी है।
- source_word: שָׁלִישׁוֹ
  choice: उसके सेनाधिकारी
  rationale: शब्द किसी उच्च पदस्थ सैन्य अधिकारी को सूचित करता है, पर उसका ठीक पद अनिश्चित है; ‘सेनाधिकारी’ पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּכֵּהוּ
  choice: उसे मार गिराया
  rationale: נכה का अर्थ प्रहार करना या मार गिराना है। आगे וַיְמִיתֵהוּ द्वारा मृत्यु स्पष्ट कही गई है, इसलिए दोनों क्रियाओं का अंतर रखा गया है।
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  choice: राजभवन के गढ़ में
  rationale: אַרְמוֹן राजमहल, दुर्ग या किलेबंद राजनिवास हो सकता है। यह चयन राजकीय परिसर और उसकी किलेबंदी दोनों को संक्षेप में व्यक्त करता है।
- source_word: אֶת אַרְגֹּב וְאֶת הָאַרְיֵה
  choice: अर्गोब और अर्येह के साथ
  rationale: दोनों को इस कथात्मक प्रसंग में व्यक्तिनाम माना गया है। हिन्दी वाक्यांश मूल की संरचनात्मक अस्पष्टता को बनाए रखता है कि वे राजा के साथ मारे गए व्यक्ति थे।
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  choice: और उसके साथ गिलादियों में से पचास पुरुष थे
  rationale: מִן का अंशवाचक भाव ‘में से’ द्वारा रखा गया है। सर्वनाम को मूल की तरह ही छोड़ा गया है और उसकी पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: וַיְמִיתֵהוּ
  choice: इस प्रकार उसने उसे मार डाला
  rationale: מות का हिफ़ील रूप मृत्यु का कारण बनने, अर्थात मार डालने, को व्यक्त करता है और पहले प्रयुक्त ‘मार गिराया’ से अलग रहता है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: उसके स्थान पर राजा हो गया
  rationale: यह राजाओं की पुस्तक में उत्तराधिकार का प्रचलित सूत्र है; हिन्दी में यह स्वाभाविक रूप से राजसत्ता ग्रहण करने को व्यक्त करता है।
theological_decisions:
- issue: अर्गोब और अर्येह की भूमिका
  choice: उन्हें व्यक्तिनाम मानकर वाक्य में राजा के साथ रखा गया है
  alternative: उन्हें पेकह के सहयोगी मानना, या הָאַרְיֵה का अर्थ ‘सिंह’ करना
  rationale: אֵת के दोहराव और कथात्मक समानांतरता से दोनों व्यक्तियों का पेकह के आक्रमण के कर्म होना अधिक संभव है, फिर भी अनुवाद ने ‘के साथ’ द्वारा संबंध को कठोरता से परिभाषित नहीं किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य पद और राजकीय भवन के तकनीकी अर्थों को अत्यधिक निश्चित करने से बचा गया है। ‘मार गिराया’ और ‘मार डाला’ द्वारा मूल की क्रमिक दो क्रियाएँ अलग रखी गई हैं।
