  text: בִּ/שְׁנַת֙ חֲמִשִּׁ֣ים שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פְּקַֽחְיָ֨ה בֶן מְנַחֵ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: hi
  text: यहूदा के राजा अजर्याह के शासन के पचासवें वर्ष में मनहेम का पुत्र पकह्याह शोमरोन में इस्राएल का राजा बना और उसने दो वर्ष तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת חֲמִשִּׁים שָׁנָה
  choice: शासन के पचासवें वर्ष में
  rationale: इब्रानी राजकीय काल-निर्धारण सूत्र में संख्या क्रमवाचक अर्थ देती है; स्वाभाविक हिंदी में ‘पचासवें वर्ष में’ उपयुक्त है। ‘शासन के’ जोड़ने से לַעֲזַרְיָה द्वारा सूचित राजकीय संदर्भ स्पष्ट होता है।
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अजर्याह के शासन के
  rationale: लामेद अजर्याह के शासन को वर्ष-गणना का संदर्भ बनाता है; पदक्रम को हिंदी में स्वाभाविक बनाया गया है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: राजकीय वृत्तांत में यह क्रिया यहाँ राज्यारोहण सूचित करती है; अवधि बाद में अलग से दी गई है।
- source_word: פְּקַחְיָה בֶן מְנַחֵם
  choice: मनहेम का पुत्र पकह्याह
  rationale: वंश-सूचक संबंध को औपचारिक रूप से रखा गया है और नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: मָלַךְ के साथ עַל शासन के क्षेत्र या प्रजा को सूचित करता है; हिंदी में ‘इस्राएल का राजा बना’ अधिक स्वाभाविक है और ‘पर’ की संभावित कठोरता से बचता है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: स्थानवाचक ב राजधानी अथवा शासन-केंद्र को सूचित करता है; ‘में’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: שְׁנָתָיִם
  choice: दो वर्ष तक
  rationale: द्विवचन का अर्थ ‘दो वर्ष’ है; हिंदी में अवधि बताने के लिए ‘तक’ और पूर्ण वाक्य के लिए ‘शासन किया’ स्वाभाविक हैं।
