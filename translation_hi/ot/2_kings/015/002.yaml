  text: בֶּן שֵׁ֨שׁ עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ יְכָלְיָ֖הוּ מִ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/002.yaml
  text: He was sixteen years old when he became king[a], and he reigned fifty-two years in Jerusalem. His mother’s name was Jecoliah of Jerusalem.
translation:
  language: hi
  text: जब वह राजा बना, तब वह सोलह वर्ष का था, और उसने यरूशलेम में बावन वर्ष तक राज किया। उसकी माता का नाम यकोल्याह था; वह यरूशलेम की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
  choice: सोलह वर्ष का था
  rationale: इब्रानी का शाब्दिक मुहावरा ‘सोलह वर्ष का पुत्र’ आयु बताने का सामान्य ढंग है; आधुनिक हिन्दी में स्वाभाविक रूप ‘सोलह वर्ष का था’ है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रचना राज्यारोहण के समय उसकी आयु बताती है; ‘जब वह राजा बना’ अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה
  choice: बावन वर्ष तक
  rationale: संख्या-वाक्यांश का मानक हिन्दी रूप; ‘तक’ शासन की अवधि को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: राजकीय सूत्र में क्रिया מלך के लिए यह प्रचलित, सहज और अर्थ-सटीक हिन्दी समतुल्य है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב यहाँ शासन का स्थान बताता है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: मूल सूचना और राजाओं की पुस्तक के सूत्रात्मक रूप को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְכָלְיָהוּ
  choice: यकोल्याह
  rationale: इब्रानी नाम के व्यंजन और उसके अंतिम ईश्वरीय नाम-तत्त्व को हिन्दी बाइबलीय लिप्यंतरण में पहचानने योग्य ढंग से प्रस्तुत करता है।
- source_word: מִירוּשָׁלָם
  choice: वह यरूशलेम की थी
  rationale: מן यहाँ मूल स्थान या संबद्धता बताता है। स्वतंत्र उपवाक्य हिन्दी में यह स्पष्ट करता है कि यरूशलेम का संबंध माता से है, न कि उसके नाम से।
theological_decisions: []
translation_notes:
  register: 'आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण राजकीय वर्णन। मूल के दो मुख्य वाक्यांशों को सहज हिन्दी वाक्य-विन्यास में रखा गया है। अंग्रेज़ी परत में दिया गया पद-टिप्पणी चिह्न स्रोत-पाठ से मेल नहीं खाता: ‘from Jerusalem’ का विकल्प अंतिम מִירוּשָׁלָם से संबंधित है, राज्यारोहण वाले वाक्यांश से नहीं। हिन्दी मुख्य पाठ में अर्थ स्पष्ट होने के कारण पद-टिप्पणी आवश्यक नहीं रखी गई।'
