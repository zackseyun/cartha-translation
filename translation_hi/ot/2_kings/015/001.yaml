  text: In the twenty-seventh year of Jeroboam king of Israel, Azariah son of Amaziah, king of Judah, began to reign.
translation:
  language: hi
  text: इस्राएल के राजा यारोबाम के शासन के सत्ताईसवें वर्ष में, अमस्याह का पुत्र अजर्याह यहूदा का राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וָשֶׁבַע שָׁנָה
  choice: शासन के सत्ताईसवें वर्ष में
  rationale: यह इब्रानी राजकीय कालगणना का सूत्र है। आधुनिक हिन्दी में क्रमवाचक रूप ‘सत्ताईसवें वर्ष’ स्वाभाविक है; ‘शासन’ जोड़ने से स्पष्ट होता है कि वर्ष राजा के राज्यकाल का है।
- source_word: לְיָרָבְעָם מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा यारोबाम के
  rationale: לְ यहाँ उस राजा को चिह्नित करता है जिसके राज्यकाल के अनुसार वर्ष गिना गया है। हिन्दी में संबंधकारक रचना इसे स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: राज्यारोहण-वृत्तांत में यह क्रिया शासन के आरम्भ को सूचित करती है। ‘राजा बना’ संक्षिप्त, स्वाभाविक और अर्थानुकूल हिन्दी है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: नाम का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है।
- source_word: בֶן אֲמַצְיָה
  choice: अमस्याह का पुत्र
  rationale: בֶן वंश-संबंध बताता है; हिन्दी में ‘का पुत्र’ इसका मानक और गरिमापूर्ण रूप है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह पद अमस्याह की राजकीय पहचान बताता है; वाक्य-विन्यास में इसे उसके नाम से पहले रखकर स्वाभाविक हिन्दी बनाई गई है।
