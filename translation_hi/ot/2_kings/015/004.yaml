  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
translation:
  language: hi
  text: केवल ऊँचे स्थान हटाए नहीं गए; लोग अब भी उन ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चढ़ावे जलाकर उनका धुआँ उठाते थे।” इब्रानी क्रिया विशेष रूप से धूप जलाने या अधिक व्यापक अर्थ में किसी चढ़ावे को जलाकर उसका धुआँ उठाने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह राजा के सकारात्मक मूल्यांकन के बीच एक अपवाद प्रस्तुत करता है; ‘केवल’ इस सूत्रबद्ध संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह पद स्थानीय ऊँचे उपासना-स्थलों को सूचित करता है। ‘ऊँचे स्थान’ ऐतिहासिक-धार्मिक संदर्भ को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: बहुवचन उपासना-स्थलों के विषय में यह प्रयोग उनके बने रहने का अर्थ देता है; हिंदी में कर्मवाच्य स्वाभाविक है।
- source_word: עוֹד
  choice: अब भी
  rationale: यह उस उपासना-प्रथा के निरंतर चलते रहने पर बल देता है।
- source_word: הָעָם
  choice: लोग
  rationale: सामूहिक जनसमुदाय के लिए सरल और वर्तमान हिंदी अभिव्यक्ति।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते
  rationale: זבח के बलिदान करने के मूल अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּמְקַטְּרִים
  choice: धूप जलाते
  rationale: इस उपासना-संदर्भ में קטר का स्वाभाविक अर्थ धूप जलाना है; फिर भी क्रिया का व्यापक अर्थ किसी चढ़ावे को धुएँ में चढ़ाना भी हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: בַּבָּמוֹת
  choice: उन ऊँचे स्थानों पर
  rationale: स्थानवाचक अर्थ स्पष्ट करता है; ‘उन’ पहले उल्लिखित स्थलों से संबंध को हिंदी में सहज बनाता है।
theological_decisions:
- issue: ऊँचे स्थानों पर की जाने वाली उपासना का स्वरूप
  choice: पद केवल यह बताता है कि वहाँ बलि और धूप चढ़ाने की प्रथा जारी थी; आराध्य देवता को निर्दिष्ट नहीं करता।
  alternative: इसे स्पष्ट रूप से मूर्तिपूजा कहना, या निश्चित रूप से केवल यहोवा की अनधिकृत स्थानों पर उपासना कहना।
  rationale: इब्रानी पाठ इस पद में आराध्य की पहचान नहीं करता; इसलिए अनुवाद पाठ की धार्मिक अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल और कथात्मक शैली। ‘ऊँचे स्थान’ ऐतिहासिक पारिभाषिकता को बनाए रखता है, जबकि पादटिप्पणी מְקַטְּרִים की वास्तविक अर्थगत व्यापकता सुरक्षित रखती है।
