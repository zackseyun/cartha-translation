    text: या, “शासन करने लगा।” इब्रानी क्रिया राजा बनने अथवा शासन आरम्भ करने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: उज्जियाह को अन्य स्थानों पर अजर्याह भी कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/פֶקַח
  choice: पेकह के शासन के दूसरे वर्ष में
  rationale: यह इब्रानी राजकीय तिथि-सूत्र है। शाब्दिक ‘पेकह के दूसरे वर्ष में’ की अपेक्षा ‘शासन’ जोड़ने से आधुनिक हिन्दी में स्पष्ट होता है कि पेकह के राज्यकाल का दूसरा वर्ष अभिप्रेत है।
- source_word: בֶּן רְמַלְיָהוּ
  choice: रमल्याह के पुत्र
  rationale: वंशसूचक इब्रानी रचना को ऐतिहासिक सटीकता के लिए सीधे रूप में रखा गया है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा
  rationale: पेकह के राज्य की पहचान करने वाली राजकीय उपाधि को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: מָלַךְ
  choice: राजा हुआ
  rationale: इस संदर्भ में क्रिया राजपद ग्रहण करने या शासन आरम्भ करने का बोध देती है। ‘राजा हुआ’ सहज हिन्दी में राज्यारोहण व्यक्त करता है, जबकि ‘शासन करने लगा’ भी सम्भव है।
- source_word: יוֹתָם
  choice: योताम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן עֻזִיָּהוּ
  choice: उज्जियाह का पुत्र
  rationale: मूल पाठ में नाम עֻזִיָּהוּ है, इसलिए ‘उज्जियाह’ रखा गया है; इसी राजा का अन्य नाम ‘अजर्याह’ पादटिप्पणी में दिया गया है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: यह उपाधि व्याकरणतः उज्जियाह से जुड़ सकती है और हिन्दी वाक्य में उसी के साथ रखी गई है। योताम के राजा होने की बात मुख्य क्रिया ‘राजा हुआ’ से व्यक्त होती है।
