base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/032.yaml
  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
translation:
  language: hi
  text: इस्राएल के राजा रमल्याह के पुत्र पेकह के शासन के दूसरे वर्ष में, उज्जियाह[b] का पुत्र योताम यहूदा का राजा हुआ[a]।
  philosophy: optimal-equivalence
  footnotes:
