reference: 2 Kings 15:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִן חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: hi
  text: उसने वह किया जो यहोवा की दृष्टि में बुरा था। वह नबात के पुत्र यारोबाम के पापों से नहीं फिरा, जिसने इस्राएल से पाप करवाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने वह किया जो ... बुरा था
  rationale: राजकीय मूल्यांकन के प्रचलित इब्रानी सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरंभिक वाव को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: ईश्वरीय मूल्यांकन के इब्रानी मुहावरे और उसके दृष्टि-रूपक को सहज हिन्दी में सुरक्षित रखता है।
- source_word: לֹא סָר מִן חַטֹּאות
  choice: उन पापों से नहीं फिरा
  rationale: סור מן का आशय किसी मार्ग या आचरण को छोड़कर हटना है; ‘से नहीं फिरा’ संक्षिप्त, स्वाभाविक और नैतिक संदर्भ के अनुकूल है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: इब्रानी पितृनाम-संरचना का मानक और स्पष्ट हिन्दी रूप।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप की कारणवाचकता को स्पष्ट रखता है। सम्बन्धवाचक पद को निकटतम व्याकरणिक पूर्वपद ‘पापों’ से जोड़ते हुए यारोबाम की कर्तृता भी बनाए रखी गई है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का निजी वाचा-नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ उसे उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है।
- issue: אֲשֶׁר का व्याकरणिक सम्बन्ध
  choice: '‘पापों’ से सम्बन्ध: ‘जिनके द्वारा’'
  alternative: 'यारोबाम से सम्बन्ध: ‘जिसने इस्राएल से पाप करवाया’'
  rationale: इब्रानी में सम्बन्धवाचक उपवाक्य व्याकरणतः निकटवर्ती बहुवचन ‘पापों’ अथवा यारोबाम से जोड़ा जा सकता है। चुना हुआ रूप निकटवर्ती सम्बन्ध को दर्शाता है, पर यारोबाम की कारणात्मक भूमिका स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बुरा’ और ‘पाप’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य-विन्यास को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
