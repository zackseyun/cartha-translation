  yaml_path: translation/ot/2_kings/015/033.yaml
  text: He was twenty-five years old when he began to reign[a], and he reigned sixteen years in Jerusalem. His mother’s name was Jerusha daughter of Zadok.
translation:
  language: hi
  text: जब वह राजा बना, तब वह पच्चीस वर्ष का था और उसने यरूशलेम में सोलह वर्ष तक राज किया। उसकी माता का नाम यरूशा था; वह सादोक की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: वह पच्चीस वर्ष का था
  rationale: यह आयु बताने वाला मानक इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘पच्चीस वर्ष का’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: הָיָה בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह राजकीय सूत्र राज्यारोहण के समय की आयु बताता है। ‘जब वह राजा बना’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וְשֵׁשׁ עֶשְׂרֵה שָׁנָה מָלַךְ
  choice: और उसने ... सोलह वर्ष तक राज किया
  rationale: मूल के शासनकाल को स्पष्ट रखते हुए हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप और संबंधबोधक अर्थ सुरक्षित है।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: मूल वंशावली-सूत्र का अर्थ बनाए रखते हुए गरिमापूर्ण आधुनिक हिन्दी दी गई है।
- source_word: יְרוּשָׁא
  choice: यरूशा
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण है; अंग्रेज़ी वर्तनी का विकल्प हिन्दी पाठ के लिए अर्थपूर्ण नहीं है।
- source_word: בַּת צָדוֹק
  choice: वह सादोक की बेटी थी
  rationale: पारिवारिक संबंध को स्पष्ट और स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है।
