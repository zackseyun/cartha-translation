  text: וְ/יֶ֨תֶר֙ דִּבְרֵ֣י שַׁלּ֔וּם וְ/קִשְׁר֖/וֹ אֲשֶׁ֣ר קָשָׁ֑ר הִנָּ֣/ם כְּתֻבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/015.yaml
  text: The rest of the acts of Shallum[a], and the conspiracy that he conspired—behold[c][b], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: hi
  text: शल्लूम के बाकी काम और उसका षड्यंत्र, जो उसने रचा था[a]—देखो, ये सब इस्राएल के राजाओं के इतिहास-वृत्तांत की पुस्तक[b] में लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘षड्यंत्र’ और ‘रचा’ के लिए एक ही शब्द-मूल के शब्द आए हैं; यह पुनरुक्ति बल देती है।
    reason: lexical_alternative
  - marker: b
    text: यह राजकीय इतिहास या आधिकारिक अभिलेख का उल्लेख है, जिसका उद्धरण राजाओं की पुस्तक में बार-बार आता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי שַׁלּוּם
  choice: शल्लूम के बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में דִּבְרֵי का अर्थ केवल बोले गए ‘वचन’ नहीं, बल्कि राजा के काम या कार्यकलाप हैं; יֶתֶר को स्वाभाविक हिन्दी में ‘बाकी’ कहा गया है।
- source_word: וְקִשְׁרוֹ אֲשֶׁר קָשָׁר
  choice: और वह षड्यंत्र जो उसने रचा था
  rationale: קֶשֶׁר राजनीतिक षड्यंत्र को सूचित करता है। संज्ञा और उसी मूल की क्रिया की इब्रानी पुनरुक्ति को हिन्दी में ‘षड्यंत्र जो उसने रचा’ द्वारा यथासंभव बनाए रखा गया है।
- source_word: הִנָּם
  choice: देखो, ये सब
  rationale: הִנָּם में संकेतसूचक बल और बहुवचन सर्वनाम दोनों हैं। ‘देखो’ सूत्रात्मक ध्यानाकर्षण को और ‘ये सब’ पहले बताए गए कामों तथा षड्यंत्र को व्यक्त करता है।
- source_word: כְּתֻבִים
  choice: लिखे हुए हैं
  rationale: यह बहुवचन कर्मवाच्य कृदंत है; ‘लिखे हुए हैं’ उसके रूप और अभिलेखीय भाव दोनों को सहज हिन्दी में रखता है।
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास-वृत्तांत की पुस्तक में
  rationale: यह राजाओं से संबंधित अभिलेख या वार्षिक वृत्तांत का सूत्रात्मक शीर्षक है। सामग्री के किसी पुस्तक में दर्ज होने के अर्थ में עַל का स्वाभाविक हिन्दी रूप ‘में’ है।
