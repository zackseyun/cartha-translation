base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
translation:
  language: hi
  text: केवल ऊँचे स्थान नहीं हटाए गए; लोग अब भी उन ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे[a]। उसी ने यहोवा के भवन का ऊपरी फाटक बनवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्पणों को धुएँ में जलाते थे।” इब्रानी क्रिया विशेष रूप से धूप जलाने या अधिक व्यापक रूप से किसी अर्पण को जलाकर उसका धुआँ ऊपर उठाने के लिए प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह राजा के अनुकूल मूल्यांकन के बीच एक अपवाद प्रस्तुत करता है और राजाओं की पुस्तक के सूत्रबद्ध प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह राजाओं की पुस्तक में स्थानीय उपासना-स्थलों के लिए प्रचलित पारिभाषिक अभिव्यक्ति है; दोनों occurrences में इसे समान रखा गया है।
- source_word: לֹא סָרוּ
  choice: नहीं हटाए गए
  rationale: संदर्भ में इसका आशय है कि वे उपासना-स्थल बने रहे; हिंदी का कर्मवाच्य इस भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: עוֹד
  choice: अब भी
  rationale: यह जारी रहने वाली प्रथा को दर्शाता है।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते थे
  rationale: कृदंत का निरंतर अथवा प्रथागत भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: וּמְקַטְּרִים
  choice: धूप जलाते थे
  rationale: यह इस उपासना-संदर्भ में स्वाभाविक और प्रचलित अर्थ है; क्रिया के व्यापक धूम्र-अर्पण संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הוּא
  choice: उसी ने
  rationale: स्वतंत्र सर्वनाम के हल्के बल को हिंदी में सुरक्षित रखता है।
- source_word: בָּנָה
  choice: बनवाया
  rationale: राजा द्वारा निर्माण कराने के भाव को स्वाभाविक हिंदी में व्यक्त करता है, जबकि मूल क्रिया के निर्माणार्थ को बनाए रखता है।
- source_word: שַׁעַר בֵּית יְהוָה
  choice: यहोवा के भवन का फाटक
  rationale: मूल की ‘यहोवा का भवन’ अभिव्यक्ति को सीधे और गरिमापूर्ण ढंग से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
- source_word: הָעֶלְיוֹן
  choice: ऊपरी
  rationale: यह फाटक की स्थिति को दूसरे फाटकों से अलग बताने वाला स्वाभाविक विशेषण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक नाम सीधे आया है; ‘यहोवा’ उसे उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: מְקַטְּרִים का उपासना-संबंधी अर्थ
  choice: धूप जलाते थे
  alternative: अर्पणों को धुएँ में जलाते थे
  rationale: संदर्भ में संकीर्ण ‘धूप’ अर्थ स्वाभाविक है, पर इब्रानी क्रिया व्यापक रूप से किसी अर्पण को धुएँ में चढ़ाने का संकेत भी दे सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘ऊँचे स्थान’ पारंपरिक बाइबलीय पद है और यहाँ साधारण ऊँचाई नहीं, स्थानीय उपासना-स्थलों को दर्शाता है।
