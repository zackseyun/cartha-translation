  text: בִּ/ימֵ֞י פֶּ֣קַח מֶֽלֶךְ יִשְׂרָאֵ֗ל בָּא֮ תִּגְלַ֣ת פִּלְאֶסֶר֮ מֶ֣לֶךְ אַשּׁוּר֒ וַ/יִּקַּ֣ח אֶת עִיּ֡וֹן וְ/אֶת אָבֵ֣ל בֵּֽית מַעֲכָ֡ה וְ/אֶת יָ֠נוֹחַ וְ/אֶת קֶ֨דֶשׁ וְ/אֶת חָצ֤וֹר וְ/אֶת הַ/גִּלְעָד֙ וְ/אֶת הַ/גָּלִ֔ילָ/ה כֹּ֖ל אֶ֣רֶץ נַפְתָּלִ֑י וַ/יַּגְלֵ֖/ם אַשּֽׁוּרָ/ה־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/029.yaml
  text: In the days of Pekah king of Israel[a], Tiglath-pileser king of Assyria came and captured Ijon, Abel-beth-maacah, Janoah, Kedesh, Hazor, Gilead, and Galilee—all the land of Naphtali—and he carried them away to Assyria.
translation:
  language: hi
  text: इस्राएल के राजा पेकह के दिनों में अश्शूर का राजा तिग्लत-पिलेसेर आया और उसने इय्योन, आबेल-बेत-माका, यानोह, केदेश, हासोर, गिलाद, गलील और नप्ताली के सारे देश पर अधिकार कर लिया; फिर वह वहाँ के लोगों को निर्वासित करके अश्शूर ले गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वहाँ के लोगों को अश्शूर में निर्वासित कर दिया।’
    reason: इब्रानी हिफ़ील क्रिया גלה लोगों को उनके देश से हटाकर निर्वासन में ले जाने का भाव रखती है; हिन्दी में इसे “निर्वासित करके ... ले गया” अथवा “निर्वासित कर दिया” कहा जा सकता है।
lexical_decisions:
- source_word: בִּימֵי
  choice: के दिनों में
  rationale: यह इब्रानी काल-सूचक सूत्र का सीधा और स्वाभाविक हिन्दी रूप है; यह केवल शासनकाल कहकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בָּא
  choice: आया
  rationale: मूल क्रिया का अर्थ ‘आया’ है। सैनिक आक्रमण प्रसंग से स्पष्ट है, इसलिए क्रिया में स्वयं ‘आक्रमण किया’ जोड़ना आवश्यक नहीं।
- source_word: וַיִּקַּח
  choice: पर अधिकार कर लिया
  rationale: नगरों और प्रदेशों की सैनिक विजय के संदर्भ में ‘ले लिया’ की अपेक्षा यह अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עִיּוֹן
  choice: इय्योन
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: אָבֵל בֵּית מַעֲכָה
  choice: आबेल-बेत-माका
  rationale: संयुक्त स्थान-नाम को एक इकाई के रूप में स्पष्ट रखने वाला देवनागरी लिप्यंतरण।
- source_word: יָנוֹחַ
  choice: यानोह
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: קֶדֶשׁ
  choice: केदेश
  rationale: इब्रानी स्थान-नाम का प्रचलित देवनागरी रूप।
- source_word: חָצוֹר
  choice: हासोर
  rationale: इब्रानी व्यंजन צ को हिन्दी पाठकों के लिए स्वाभाविक ‘स’ से व्यक्त करते हुए स्थान-नाम का लिप्यंतरण।
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: भौगोलिक नाम के रूप में हिन्दी में अतिरिक्त निश्चित उपपद की आवश्यकता नहीं।
- source_word: הַגָּלִילָה
  choice: गलील
  rationale: क्षेत्र के नाम का परिचित हिन्दी बाइबलीय रूप।
- source_word: כֹּל אֶרֶץ נַפְתָּלִי
  choice: अर्थात नप्ताली के पूरे प्रदेश
  rationale: यह पद पहले दी गई विजय-सूची का सारात्मक समानाधिकरण है; ‘अर्थात’ उस संबंध को हिन्दी में स्पष्ट करता है।
- source_word: וַיַּגְלֵם
  choice: वहाँ के लोगों को निर्वासित करके ... ले गया
  rationale: हिफ़ील रूप लोगों को उनके देश से हटाकर निर्वासन में ले जाने को व्यक्त करता है। हिन्दी में सर्वनाम ‘उन्हें’ का संदर्भ स्थानों से भ्रमित हो सकता था, इसलिए संदर्भगत आशय ‘वहाँ के लोगों’ से स्पष्ट किया गया है।
- source_word: אַשּׁוּרָה
  choice: अश्शूर ले गया
  rationale: दिशासूचक रूप अश्शूर की ओर अथवा अश्शूर तक ले जाए जाने को बताता है; हिन्दी में ‘अश्शूर ले गया’ इसका सीधा और स्वाभाविक रूप है।
