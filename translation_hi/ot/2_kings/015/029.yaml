  register: आधुनिक मानक हिन्दी में गरिमापूर्ण ऐतिहासिक कथन। लंबी इब्रानी समन्वयी रचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है। स्थान-नाम देवनागरी में स्रोत-आधारित रूपों में दिए गए हैं; व्याख्यात्मक विस्तार न्यूनतम रखा गया है।
