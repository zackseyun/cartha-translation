base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
translation:
  language: hi
  text: और अजर्याह अपने पुरखाओं के साथ सो गया[a], और उन्होंने उसे दाऊद के नगर में उसके पुरखाओं के साथ दफना दिया। उसका पुत्र योताम उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पूर्वजों के साथ।” “अपने पुरखाओं के साथ सो गया” मृत्यु और पिछली पीढ़ियों के लोगों के साथ दफनाए जाने के लिए प्रयुक्त एक प्रचलित इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: इब्रानी में यह मृत्यु के लिए प्रयुक्त शिष्टोक्ति है; ‘मर गया’ कहने के बजाय मूल बिंब को सुरक्षित रखा गया है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से पूर्वजों की पीढ़ियों का भाव स्वाभाविक हिंदी में आता है और राजकीय मृत्यु-सूत्र का अंतरपीढ़ीय अर्थ बना रहता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: उन्होंने उसे ... दफना दिया
  rationale: मूल पाठ की बहुवचन सक्रिय क्रिया और उसके अनिर्दिष्ट कर्ता को सुरक्षित रखा गया है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह स्थान-सूचक पद का स्पष्ट, स्वाभाविक और प्रचलित हिंदी रूप है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के इस सूत्र में यह क्रिया राजपद ग्रहण कर शासन करने का आरंभ बताती है; हिंदी में ‘राजा हुआ’ संक्षिप्त और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह राजकीय पद के उत्तराधिकार को ठीक व्यक्त करता है, केवल कालक्रम को नहीं।
