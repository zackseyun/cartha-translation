  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
translation:
  language: hi
  text: और योताम अपने पुरखाओं के साथ सो गया[a] और अपने पुरखाओं के साथ अपने पूर्वज दाऊद के नगर में दफनाया गया; और उसका पुत्र आहाज उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पुरखाओं के साथ लेट गया।” यह राजाओं की मृत्यु के लिए प्रयुक्त एक प्रचलित हिब्रू अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: यह अपने पुरखाओं के साथ मृत्यु का मानक राजकीय मुहावरा है। हिंदी में ‘सो गया’ उसकी मूल छवि बनाए रखता है, और अगला दफ़न-वाक्य मृत्यु का अर्थ स्पष्ट करता है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से वंशगत पूर्वजों का अर्थ स्वाभाविक और सम्मानपूर्ण हिंदी में व्यक्त होता है; ‘पितरों’ की अपेक्षा यह सामान्य पाठक के लिए अधिक सहज है।
- source_word: וַיִּקָּבֵר
  choice: गाड़ा गया
  rationale: यह हिब्रू के कर्मवाच्य रूप को सुरक्षित रखता है और शव को भूमि या कब्र में रखने के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּעִיר דָּוִד אָבִיו
  choice: अपने पूर्वज दाऊद के नगर में
  rationale: हिब्रू का אָבִיו यहाँ निकट जैविक पिता नहीं, बल्कि दाऊदी वंश के पूर्वज को दर्शाता है। हिंदी में ‘पूर्वज’ उसी आशय को बिना भ्रम के व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार-सूचना में यह स्वाभाविक हिंदी है और शासन संभालने का भाव संक्षेप में देता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह प्रतिस्थापन और राजकीय उत्तराधिकार, दोनों का हिब्रू भाव ठीक प्रकार से व्यक्त करता है।
theological_decisions:
- issue: ‘दाऊद उसके पिता’ में संबंध का अर्थ
  choice: दाऊद को योताम का वंशगत पूर्वज मानकर ‘अपने पूर्वज दाऊद’
  alternative: शाब्दिक रूप से ‘अपने पिता दाऊद’, साथ में व्याख्यात्मक पादटिप्पणी
  rationale: योताम का निकट जैविक पिता उज्जिय्याह/अजर्याह था; इसलिए इस राजकीय वंशावली-संदर्भ में אָב का अर्थ पूर्वज है। मुख्य पाठ में ‘पूर्वज’ रखने से मूल आशय स्पष्ट होता है और कोई गलत जैविक संबंध नहीं बनता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल राजकीय मृत्यु और उत्तराधिकार-सूचना। ‘सो गया’ मूल रूपक को बनाए रखता है; ‘पुरखाओं’ और ‘पूर्वज’ के चयन से दो अलग संदर्भों में אָב के वंशगत अर्थ स्पष्ट रहते हैं।
