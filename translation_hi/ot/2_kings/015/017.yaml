  text: In the thirty-ninth year of Azariah king of Judah, Menahem son of Gadi became king over Israel, and he reigned ten years in Samaria.
translation:
  language: hi
  text: यहूदा के राजा अजर्याह के उनतालीसवें वर्ष में गादी का पुत्र मनहेम इस्राएल का राजा बना। उसने शोमरोन में दस वर्ष तक राज किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: उनतालीसवें वर्ष में
  rationale: राजकीय कालगणना के इस सूत्र में संख्या क्रमवाचक अर्थ रखती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לַעֲזַרְיָה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अजर्याह के
  rationale: ל यहाँ अजर्याह के शासन-वर्ष के संदर्भ को चिह्नित करता है; हिन्दी संबंध-रचना राजकीय समकाल निर्धारण को स्पष्ट रखती है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राज्यारोहण को बताती है, जबकि शासन की अवधि आगे अलग से दी गई है।
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: गादी का पुत्र मनहेम
  rationale: בֶּן का सामान्य वंश-सूचक अर्थ रखा गया है और नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: מָלַךְ के साथ עַל शासन के अधीन लोगों/राज्य को सूचित करता है; हिन्दी में ‘इस्राएल का राजा बना’ अधिक स्वाभाविक है।
- source_word: עֶשֶׂר שָׁנִים
  choice: दस वर्ष तक
  rationale: यह मनहेम के शासन की अवधि बताने वाला सरल कालवाचक पद है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: בְּ स्थान को चिह्नित करता है; शोमरोन यहाँ शासन-केंद्र/राजधानी है।
