  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
translation:
  language: hi
  text: अश्शूर का राजा पूल देश पर चढ़ आया[a]। तब मनहेम ने पूल को चाँदी के एक हज़ार किक्कार दिए[b], ताकि पूल मनहेम का साथ देकर राज्य को उसके हाथ में दृढ़ करे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में केवल “देश” है; यहाँ उससे आशय सम्भवतः इस्राएल का देश है।
    reason: cultural_note
  - marker: b
    text: “किक्कार” प्राचीन काल में भार की एक बड़ी इकाई थी; उसका ठीक भार स्थान और समय के अनुसार अलग हो सकता था।
    reason: cultural_note
  - marker: c
    text: 'इब्रानी में शाब्दिक रूप से: “ताकि उसका [पूल का] हाथ उसके [मनहेम के] साथ रहे और राज्य को उसके [मनहेम के] हाथ में दृढ़ करे।” “हाथ साथ रहना” समर्थन देने और “हाथ में” अधिकार या नियंत्रण में होने का मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: चढ़ आया
  rationale: सैनिक प्रसंग में בוא के साथ עַל शत्रुतापूर्ण आगमन को व्यक्त करता है; ‘चढ़ आया’ आधुनिक हिन्दी में स्वाभाविक रूप से आक्रमणकारी बढ़त का भाव देता है।
- source_word: פ֤וּל
  choice: पूल
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: מֶֽלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: इब्रानी संबंध-संरचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: עַל הָאָרֶץ
  choice: इस्राएल के देश पर
  rationale: הָאָרֶץ का शाब्दिक अर्थ ‘देश/भूमि’ है; कथानक में इसका संकेत इस्राएल के देश की ओर है। स्पष्टता के लिए मुख्य पाठ में संदर्भित देश बताया गया है और टिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
- source_word: וַיִּתֵּן
  choice: दी
  rationale: נתן का मूल अर्थ ‘देना’ है। राजनीतिक प्रसंग से यह धन समर्थन पाने के लिए दिया गया समझ में आता है, पर ‘कर’ या ‘घूस’ जैसे अधिक विशिष्ट अर्थ पाठ पर आरोपित नहीं किए गए।
- source_word: אֶלֶף כִּכַּר כָּסֶף
  choice: एक हज़ार किक्कार चाँदी
  rationale: כִּכָּר प्राचीन भार-माप है। पारंपरिक बाइबलीय इकाई को लिप्यंतरित करके रखा गया और पादटिप्पणी में उसका स्वरूप समझाया गया है।
- source_word: לִהְיוֹת יָדוֹ אִתּוֹ
  choice: ताकि पूल उसका साथ दे
  rationale: शाब्दिक मुहावरा ‘उसका हाथ उसके साथ रहे’ राजनीतिक सहायता या समर्थन का अर्थ देता है। अस्पष्ट हिन्दी सर्वनामों से बचने के लिए पूल का नाम दोहराया गया है।
- source_word: לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  choice: राज्य पर उसका अधिकार दृढ़ करे
  rationale: חזק के हिफ़ील रूप में ‘दृढ़ करना’ और בְּיָדוֹ में नियंत्रण/अधिकार का भाव है। यह हिन्दी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक बिंब सुरक्षित रखती है।
