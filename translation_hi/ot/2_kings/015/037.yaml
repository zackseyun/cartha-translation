source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
translation:
  language: hi
  text: उन दिनों याहवे ने अराम[a] के राजा रसीन और रमल्याह के पुत्र पेकह को यहूदा के विरुद्ध भेजना शुरू किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अराम’ का पारम्परिक नाम ‘सीरिया’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यहूदा में भेजना शुरू किया’; यहाँ हिब्रू पूर्वसर्ग का स्थानीय अर्थ सम्भव है, पर प्रसंग में विरोध का भाव अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह प्रचलित काल-सूचक मुहावरा किसी एक क्षण के बजाय उस ऐतिहासिक अवधि को बताता है और हिब्रू अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵחֵל
  choice: शुरू किया
  rationale: यह क्रिया किसी कार्य के आरम्भ को सूचित करती है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ शीर्षक से प्रतिस्थापन किए बिना उस नाम को व्यक्त करता है।
- source_word: לְהַשְׁלִיחַ ... בִּיהוּדָה
  choice: यहूदा के विरुद्ध भेजना
  rationale: שלח का मूल अर्थ ‘भेजना’ है। इस सैन्य-राजनीतिक प्रसंग में בִּיהוּדָה लक्ष्य और विरोध का भाव रखता है, इसलिए ‘के विरुद्ध’ आशय स्पष्ट करता है; फिर भी स्थानीय अर्थ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: רְצִין מֶלֶךְ אֲרָם
  choice: अराम के राजा रसीन
  rationale: ‘अराम’ हिब्रू भू-जातीय नाम का सीधा रूप है; ‘सीरिया’ पारम्परिक विकल्प है। नामों को हिन्दी ध्वन्यात्मक रूप में दिया गया है।
- source_word: וְאֵת פֶּקַח בֶּן רְמַלְיָהוּ
  choice: और रमल्याह के पुत्र पेकह को
  rationale: אֵת दोनों व्यक्तियों को ‘भेजना’ क्रिया के कर्म के रूप में चिह्नित करता है। हिन्दी में कारक स्पष्ट करने हेतु ‘को’ दूसरे समन्वित कर्म के बाद रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत नाम है। हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ अधिक विद्वत्तापरक प्रतिलेखन है।
- issue: यहोवा द्वारा शत्रु राजाओं को भेजना
  choice: यहोवा ने ... भेजना शुरू किया
  alternative: यहोवा ने ... आने दिया
  rationale: हिब्रू हिफ़िल क्रिया स्पष्ट रूप से कारक ‘भेजना’ कहती है। इसे केवल अनुमति के रूप में हल्का करना मूल कथन में निहित ईश्वरीय कर्तृत्व को बदल देता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। हिब्रू वाक्य का कर्तृत्व तथा आरम्भ का पक्ष सुरक्षित है। हिन्दी की स्वाभाविक पद-रचना के लिए राजकीय उपाधि को ‘अराम के राजा रसीन’ और संयुक्त कर्म को ‘... पेकह को’ रूप में रखा गया है।
