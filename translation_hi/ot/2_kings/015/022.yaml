    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: ‘अपने पुरखाओं के साथ सो गया’ इब्रानी राजकीय मृत्यु-सूत्र के रूपक को स्वाभाविक हिन्दी में बनाए रखता है; केवल ‘मर गया’ कहना स्रोत की छवि को हटा देता।
- source_word: עִם אֲבֹתָיו
  choice: अपने पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से पूर्वजों और वंशगत संबंध का भाव सामान्य आधुनिक हिन्दी में स्पष्ट होता है, जबकि शाब्दिक ‘पितरों’ से अनचाहा धार्मिक-सांस्कृतिक अर्थ जुड़ सकता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: इस उत्तराधिकार-सूचना में क्रिया नए राजा के सिंहासन ग्रहण को बताती है; ‘राजा हुआ’ आधुनिक हिन्दी में इस आरंभिक बिंदु को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פְּקַחְיָה
  choice: पकह्याह
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: पुत्र-संबंध को स्रोत के अनुसार स्पष्ट रूप से रखा गया है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह राजकीय उत्तराधिकार में प्रतिस्थापन का सीधा और स्वाभाविक हिन्दी प्रयोग है।
