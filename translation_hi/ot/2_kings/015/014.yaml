source:
  edition: WLC
  text: וַ/יַּעַל֩ מְנַחֵ֨ם בֶּן גָּדִ֜י מִ/תִּרְצָ֗ה וַ/יָּבֹא֙ שֹׁמְר֔וֹן וַ/יַּ֛ךְ אֶת שַׁלּ֥וּם בֶּן יָבֵ֖ישׁ בְּ/שֹׁמְר֑וֹן וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: hi
  text: तब गादी का पुत्र मनहेम तिर्सा से ऊपर गया और सामरिया आया। उसने सामरिया में याबेश के पुत्र शल्लूम पर प्रहार किया और उसे मार डाला; फिर वह उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर चढ़कर
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है। यह भौगोलिक गति को बनाए रखता है और प्रसंग से अधिक स्पष्ट सैन्य अर्थ नहीं जोड़ता।
- source_word: מְנַחֵם בֶּן גָּדִי
  choice: गादी का पुत्र मनहेम
  rationale: नामों का हिंदी में प्रचलित बाइबलीय लिप्यंतरण किया गया है और वंश-संबंध को स्वाभाविक हिंदी क्रम में रखा गया है।
- source_word: מִתִּרְצָה
  choice: तिर्सा से
  rationale: מן स्रोत या प्रस्थान-स्थान बताता है; इसलिए सीधा स्थानवाचक अनुवाद किया गया है।
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: सामरिया आया
  rationale: בוא के साथ स्थान का अर्थ यहाँ वहाँ पहुँचना या आना है; संक्षिप्त हिंदी अभिव्यक्ति स्वाभाविक और पर्याप्त स्पष्ट है।
- source_word: וַיַּךְ אֶת
  choice: पर प्रहार किया
  rationale: נכה का अर्थ मारना या प्रहार करना हो सकता है। अगले अलग क्रियापद 'उसे मार डाला' के कारण यहाँ प्रहार की क्रिया को अलग रखा गया है।
- source_word: שַׁלּוּם בֶּן יָבֵישׁ
  choice: याबेश के पुत्र शल्लूम
  rationale: व्यक्तिनामों को हिंदी बाइबलीय रूप में लिप्यंतरित किया गया और पुत्र-संबंध सुरक्षित रखा गया है।
- source_word: בְּשֹׁמְרוֹן
  choice: सामरिया में
  rationale: ב स्थान सूचित करता है। मूल में स्थान की पुनरावृत्ति को हिंदी पाठ में भी बनाए रखा गया है।
- source_word: וַיְמִיתֵהוּ
  choice: उसे मार डाला
  rationale: מות के हिफ़ील रूप का आशय उसे मृत्यु देना है। 'मार डाला' आधुनिक हिंदी में स्पष्ट, स्वाभाविक और क्रिया के परिणाम को व्यक्त करता है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: वह उसके स्थान पर राजा बना
  rationale: מלך का अर्थ राज करना या राजा होना है और תחתיו उत्तराधिकार दर्शाता है। इस प्रसंग में 'राजा बना' सत्ता ग्रहण करने की घटना को स्वाभाविक हिंदी में व्यक्त करता है।
