  text: אָ֣ז יַכֶּֽה מְ֠נַחֵם אֶת תִּפְסַ֨ח וְ/אֶת כָּל אֲשֶׁר בָּ֤/הּ וְ/אֶת גְּבוּלֶ֨י/הָ֙ מִ/תִּרְצָ֔ה כִּ֛י לֹ֥א פָתַ֖ח וַ/יַּ֑ךְ אֵ֛ת כָּל הֶ/הָ֥רוֹתֶ֖י/הָ בִּקֵּֽעַ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/016.yaml
  text: Then Menahem struck Tiphsah[a], and all who were in it, and its territory from Tirzah, because it had not opened to him; and he struck it[c][b], ripping open all its pregnant women.
translation:
  language: hi
  text: तब मनहेम ने तिर्सा से तिप्सह, उसमें जो कुछ था, और उसके इलाके पर हमला किया। क्योंकि उस नगर ने उसके लिए अपने फाटक नहीं खोले थे,[a] इसलिए उसने उस पर हमला किया और उसकी सभी गर्भवती स्त्रियों के पेट चीर डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “क्योंकि उसने नहीं खोला।” आशय यह है कि नगर ने मनहेम को भीतर आने नहीं दिया या उसके सामने आत्मसमर्पण नहीं किया।
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कथानक में अगली घटना को जोड़ने वाला स्वाभाविक कालवाचक शब्द है।
- source_word: יַכֶּה / וַיַּךְ
  choice: हमला किया
  rationale: נכה यहाँ सैन्य आक्रमण और हिंसक प्रहार को व्यक्त करता है; आधुनिक हिन्दी में 'हमला किया' प्रसंग के अनुकूल और स्पष्ट है।
- source_word: תִּפְסַח
  choice: तिप्सह
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: כָּל אֲשֶׁר בָּהּ
  choice: उसमें जो कुछ था
  rationale: इब्रानी वाक्यांश व्यक्ति और वस्तु दोनों को समेट सकने वाली व्यापक अभिव्यक्ति है; अनुवाद उसी वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: גְּבוּלֶיהָ
  choice: उसके पूरे इलाके
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, नगर के अधीन क्षेत्र को सूचित करता है।
- source_word: מִתִּרְצָה
  choice: तिर्सा से आकर
  rationale: מִן का मूल अर्थ 'से' रखा गया है; हिन्दी में क्रिया-संबंध स्पष्ट करने के लिए 'आकर' जोड़ा गया है, यद्यपि इब्रानी में संबंध संक्षिप्त है।
- source_word: כִּי לֹא פָתַח
  choice: क्योंकि उस नगर ने उसके लिए अपने फाटक नहीं खोले थे
  rationale: शाब्दिक 'नहीं खोला' सैन्य संदर्भ में नगर में प्रवेश न देने अथवा आत्मसमर्पण न करने का संकेत है; 'फाटक' अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: הֶהָרוֹתֶיהָ
  choice: उसकी सभी गर्भवती स्त्रियों
  rationale: हरे शब्द गर्भवती स्त्रियों को सीधे सूचित करता है और स्त्रीलिंग प्रत्यय उन्हें नगर से जोड़ता है।
- source_word: בִּקֵּעַ
  choice: पेट चीर डाले
  rationale: पिएल रूप हिंसापूर्वक फाड़कर खोलने को व्यक्त करता है; हिन्दी में यह वाक्यांश क्रूरता को बिना नरम किए स्पष्ट करता है।
