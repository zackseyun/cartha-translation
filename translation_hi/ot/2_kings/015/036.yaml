source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: The rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: योताम के बाकी काम, जो उसने किए, क्या वे ‘यहूदा के राजाओं के इतिहास की पुस्तक’[a] में लिखे[b] नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह नाम किसी राजकीय वार्षिक इतिहास या अभिलेख को सूचित करता है; यह आवश्यक नहीं कि इससे बाइबल की इतिहास-वृत्तांत की कोई पुस्तक अभिप्रेत हो।
    reason: cross_reference
  - marker: b
    text: या “दर्ज”; इब्रानी शब्द का शाब्दिक अर्थ “लिखे” है, पर यहाँ भाव यह है कि ये काम आधिकारिक अभिलेख में दर्ज थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹתָם
  choice: योताम के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी’ या ‘शेष’ है, और इस राजकीय सार-सूत्र में דִּבְרֵי राजा के कामों या कार्यों को दर्शाता है। ‘बाकी काम’ आधुनिक हिन्दी में सहज है। आरम्भिक וְ का संयोजक भाव प्रसंग से स्पष्ट है; हिन्दी में यहाँ अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने किए
  rationale: यह सम्बन्धवाचक उपवाक्य इब्रानी संरचना और राजा के कार्यों पर दिए गए बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: क्या वे ... लिखे नहीं हैं?
  rationale: הֲלֹא ऐसी अलंकारिक प्रश्नवाचक रचना है जिसका अपेक्षित उत्तर सकारात्मक है। प्रश्न का रूप बनाए रखा गया है, और כְּתוּבִים का मूल अर्थ ‘लिखे’ है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से עַל ‘पर’ है, पर किसी अभिलेख में सामग्री दर्ज होने के अर्थ में हिन्दी का स्वाभाविक प्रयोग ‘पुस्तक में’ है। סֵפֶר ऐतिहासिक रूप से पुस्तक या लपेटे हुए ग्रन्थ दोनों को सूचित कर सकता है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास की पुस्तक
  rationale: यह पद राजाओं से सम्बन्धित दिन-प्रतिदिन के राजकीय वृत्तांत या अभिलेख का नाम है। ‘इतिहास की पुस्तक’ पाठक के लिए स्पष्ट और प्रचलित है, जबकि पाद-टिप्पणी इसके अभिलेखीय स्वरूप को स्पष्ट करती है।
theological_decisions:
- issue: उल्लिखित ग्रन्थ की पहचान
  choice: इसे यहूदा के राजाओं से सम्बन्धित राजकीय इतिहास-अभिलेख के रूप में प्रस्तुत किया गया है।
  alternative: इसे बाइबल की ‘इतिहास’ अथवा ‘इतिहास-वृत्तांत’ नामक पुस्तक के समान मानना।
  rationale: इब्रानी सूत्र एक स्रोत-अभिलेख का उल्लेख करता है; पाठ स्वयं इसे बाइबल की इतिहास-वृत्तांत की पुस्तक के साथ एक ही ग्रन्थ नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। राजकीय सार-सूत्र की अलंकारिक प्रश्न-रचना सुरक्षित है। ‘बाकी काम’ सामान्य पाठक के लिए ‘शेष कृत्यों’ से अधिक सहज है, और उद्धरण-चिह्न स्रोत-पुस्तक के शीर्षक-सदृश प्रयोग को स्पष्ट करते हैं।
