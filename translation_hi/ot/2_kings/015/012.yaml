language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: hi
  text: 'यह याहवे का वही वचन था जो उसने येहू से कहा था: “तेरे पुत्र चौथी पीढ़ी तक इस्राएल के सिंहासन पर बैठेंगे।” और ऐसा ही हुआ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  choice: यह यहोवा का वही वचन था
  rationale: הוּא पिछले प्रसंग की घटना को पहले कहे गए वचन की पूर्ति के रूप में इंगित करता है; ‘वही वचन’ यह संदर्भ-संबंध स्वाभाविक हिन्दी में स्पष्ट करता है। דְבַר को ‘वचन’ कहना दिव्य घोषणा का पारंपरिक और अर्थपूर्ण रूप बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम चतुरक्षर को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: אֲשֶׁר דִּבֶּר אֶל יֵהוּא לֵאמֹר
  choice: 'जो उसने येहू से कहा था:'
  rationale: सम्बन्धवाचक उपवाक्य और कथन-परिचायक לֵאמֹר को आधुनिक हिन्दी में सहज रूप से उद्धरण के पहले द्विबिंदु द्वारा व्यक्त किया गया है; पूर्वकालिक संदर्भ के लिए ‘कहा था’ उपयुक्त है।
- source_word: בְּנֵי רְבִיעִים
  choice: तेरे पुत्र चौथी पीढ़ी तक
  rationale: शाब्दिक पुत्र-संबंध को बनाए रखते हुए यह स्पष्ट किया गया है कि बात येहू के वंश की चार पीढ़ियों तक चलने की है।
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  choice: इस्राएल के सिंहासन पर बैठेंगे
  rationale: सिंहासन पर ‘बैठने’ के मूल राजकीय रूपक को बनाए रखा गया है; לְךָ का संबंध हिन्दी में ‘तेरे पुत्र’ से स्वाभाविक रूप से समाहित है।
- source_word: וַיְהִי כֵן
  choice: और ऐसा ही हुआ
  rationale: यह संक्षिप्त हिन्दी अभिव्यक्ति भविष्यवाणी की ठीक उसी प्रकार हुई पूर्ति पर बल देती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उपाधि ‘प्रभु’ के स्थान पर हिन्दी में परिचित लिप्यंतरण रखा गया है।
- issue: चार पीढ़ियों की प्रतिज्ञा का आशय
  choice: तेरे पुत्र चौथी पीढ़ी तक
  alternative: तेरे वंशज चार पीढ़ियों तक
  rationale: ‘पुत्र’ मूल के पारिवारिक शब्द को सुरक्षित रखता है, जबकि ‘चौथी पीढ़ी तक’ उसके वंशगत विस्तार को स्पष्ट करता है और यह निर्धारित नहीं करता कि आरंभिक व्यक्ति की गणना किस प्रकार की जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे’ का प्रयोग प्रत्यक्ष प्राचीन संबोधन और एकवचन को संक्षेप में बनाए रखता है; अनावश्यक पुरातन पदावली से बचा गया है।
