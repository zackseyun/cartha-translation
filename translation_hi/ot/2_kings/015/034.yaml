id: 2KI.15.34
reference: 2 Kings 15:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה עֻזִיָּ֥הוּ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/034.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that his father Uzziah had done.
translation:
  language: hi
  text: उसने वही किया जो याहवे की दृष्टि में सही था—हर बात में वैसा ही, जैसा उसके पिता उज्जियाह[a] ने किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसी राजा को अन्य स्थानों पर “अजर्याह” भी कहा गया है।
    reason: एक ही राजा के वैकल्पिक बाइबलीय नाम से पाठक को परिचित कराना; मुख्य पाठ यहाँ के इब्रानी रूप ‘उज्जियाह’ को बनाए रखता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। स्वतंत्र पद में आरंभिक ‘और’ के बिना सामान्य भूतकाल हिंदी में अधिक स्वाभाविक है।
- source_word: הַיָּשָׁר
  choice: जो ... सही था
  rationale: עשה הישר का मुहावरा नैतिक रूप से सही या उचित काम करने का भाव देता है; यह चयन सरल और वर्तमान हिंदी में स्वाभाविक है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: यह ईश्वरीय मूल्यांकन का इब्रानी मुहावरा है। ‘दृष्टि में’ मूल रूपक और अर्थ दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम य्ह्व्ह को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम के प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כְּכֹל אֲשֶׁר
  choice: हर बात में वैसा ही, जैसा
  rationale: כֹּל की व्यापकता को ‘हर बात में’ बनाए रखा गया है और तुलना को सहज हिंदी में व्यक्त किया गया है।
- source_word: עֻזִיָּהוּ
  choice: उज्जियाह
  rationale: मसोरेटी पाठ में यहाँ यही नाम है; इसे अन्य स्थानों पर मिलने वाले वैकल्पिक नाम ‘अजर्याह’ से नहीं बदला गया।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: यहाँ निकट वंशावली संबंध अभिप्रेत है, इसलिए ‘पिता’ सीधा और उपयुक्त अनुवाद है।
- source_word: עָשָׂה ... עָשָׂה
  choice: किया ... किया था
  rationale: ‘किया था’ उज्जियाह के पहले हो चुके कार्यों को वर्तमान राजा के कार्यों की तुलना में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना निकट लिप्यंतरण द्वारा सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की तुलना और כֹּל की व्यापकता को ‘हर बात में वैसा ही’ से सुरक्षित रखा गया है। फुटनोट-चिह्न उस नाम के बाद रखा गया है जिससे टिप्पणी वास्तव में संबंधित है।
