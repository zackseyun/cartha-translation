source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י מְנַחֵ֖ם וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: The rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: hi
  text: मनहेम के बाकी काम और उसने जो कुछ किया, क्या वे इस्राएल के राजाओं के इतिहास की पुस्तक[a] में नहीं लिखे हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के राजाओं के वृत्तांतों की पुस्तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  choice: मनहेम के बाकी काम
  rationale: राजकीय सारांश के इस सूत्र में דִּבְרֵי का अर्थ केवल बोले गए ‘वचन’ नहीं, बल्कि राजा के कार्य या वृत्तांत है; ‘बाकी काम’ आधुनिक हिन्दी में सहज और अर्थानुकूल है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: सम्बन्धवाचक उपवाक्य और उसकी व्यापकता को सीधे बनाए रखता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वे ... नहीं लिखे हैं?
  rationale: הֲלוֹא सकारात्मक उत्तर की अपेक्षा वाला आलंकारिक प्रश्न प्रस्तुत करता है; बहुवचन ‘वे’ पहले आए कामों को संदर्भित करता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: עַל का शाब्दिक अर्थ ‘पर’ हो सकता है, पर अभिलेख में दर्ज होने के अर्थ में हिन्दी का स्वाभाविक प्रयोग ‘पुस्तक में’ है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास की पुस्तक
  rationale: यह पद राजाओं के आधिकारिक वार्षिक वृत्तांत या अभिलेख को दर्शाता है; ‘इतिहास की पुस्तक’ साधारण हिन्दी पाठक के लिए स्पष्ट है, जबकि वैकल्पिक ‘वृत्तांतों की पुस्तक’ पादटिप्पणी में दिया गया है।
theological_decisions: []
