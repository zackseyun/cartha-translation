  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। इब्रानी के राजकीय सारांश-सूत्र और आलंकारिक प्रश्न को बनाए रखा गया है; आरम्भ में अलग से ‘अब’ नहीं जोड़ा गया।
