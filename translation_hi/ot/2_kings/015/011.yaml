source:
  edition: WLC
  text: וְ/יֶ֖תֶר דִּבְרֵ֣י זְכַרְיָ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/011.yaml
  text: The rest of the acts of Zechariah—behold[a], they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: hi
  text: जकर्याह के शेष काम—देखो, वे इस्राएल के राजाओं के इतिहास की पुस्तक[a] में लिखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के राजाओं के राजकीय वृत्तांत में।”
    reason: דִּבְרֵי הַיָּמִים और סֵפֶר मिलकर राजाओं के आधिकारिक वार्षिक अभिलेख या वृत्तांत का संकेत दे सकते हैं।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के शेष काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में יֶתֶר शेष भाग और דִּבְרֵי राजा के कार्यों या शासनकाल की घटनाओं को दर्शाता है; इसलिए ‘शेष काम’ स्वाभाविक और अर्थानुकूल है।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: הִנָּם
  choice: देखो, वे
  rationale: यह संकेतवाचक बल पाठक का ध्यान इस बात पर खींचता है कि वे काम लिखित रूप में उपलब्ध हैं; ‘देखो’ इस चिह्नित बल को बनाए रखता है।
- source_word: כְּתוּבִים
  choice: लिखे हैं
  rationale: इब्रानी कर्मवाच्य कृदंत का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक ‘पुस्तक पर’ के बजाय अभिलेख में सामग्री लिखे होने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דִּבְרֵי הַיָּמִים
  choice: इतिहास
  rationale: यह पदबंध राजकीय घटनाओं के क्रमबद्ध अभिलेख को सूचित करता है; ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘राजकीय वृत्तांत’ को पादटिप्पणी में वैकल्पिक रूप में रखा गया है।
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के
  rationale: यहाँ לְ अभिलेख के शीर्षक या संबंध को दर्शाता है; हिन्दी में संबंधकारक इसका स्वाभाविक रूप है।
