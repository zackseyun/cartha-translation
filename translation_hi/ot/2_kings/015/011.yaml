translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण राजकीय-सारांश शैली रखी गई है। ‘देखो’ द्वारा मूल इब्रानी का ध्यानाकर्षक बल सुरक्षित है; डैश सूत्र की दो धाराओं को स्पष्ट करता है।
