  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
translation:
  language: hi
  text: तब याबेश के पुत्र शल्लूम ने उसके विरुद्ध षड्यंत्र रचा। उसने लोगों के सामने[a] उस पर प्रहार किया, उसे मार डाला और उसके स्थान पर राजा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सार्वजनिक रूप से” अथवा “सभा के सामने”; इब्रानी पदबंध קָבָל־עָם का अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  choice: उसके विरुद्ध षड्यंत्र रचा
  rationale: राजकीय उत्तराधिकार के इस संदर्भ में קשר राजनीतिक षड्यंत्र या राजद्रोही योजना को व्यक्त करता है। यह हिंदी प्रयोग अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: שַׁלֻּם בֶּן־יָבֵשׁ
  choice: याबेश के पुत्र शल्लूम
  rationale: व्यक्तिगत नामों का देवनागरी में लिप्यंतरण किया गया है और בן को स्वाभाविक हिंदी वंशसूचक पदबंध से व्यक्त किया गया है।
- source_word: וַיַּכֵּהוּ
  choice: उस पर प्रहार किया
  rationale: נכה प्रहार करने का अर्थ देता है। अगले क्रियापद में मृत्यु अलग से कही गई है, इसलिए यहाँ इसे स्वयं 'मार डाला' नहीं बनाया गया और दोनों क्रियाओं का क्रम सुरक्षित रखा गया है।
- source_word: קָבָל־עָם
  choice: लोगों के सामने
  rationale: यह कठिन और दुर्लभ पदबंध संभवतः लोगों की उपस्थिति में सार्वजनिक रूप से किए गए कार्य को बताता है। निकटस्थ अर्थ मुख्य पाठ में रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וַיְמִיתֵהוּ
  choice: उसे मार डाला
  rationale: מות के हिफ़ईल रूप का अर्थ मृत्यु देना या मार डालना है। हिंदी में यह स्वाभाविक रूप से कारणात्मक परिणाम व्यक्त करता है और पिछले 'प्रहार' से अलग रहता है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: उसके स्थान पर राजा हो गया
  rationale: מלך और תחתיו का मेल राजसिंहासन पर उत्तराधिकार को दर्शाता है। यह हिंदी अभिव्यक्ति केवल शासन करने के बजाय राजा बनने का प्रसंग स्पष्ट करती है।
