base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: The rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: hi
  text: पेकह के बाकी काम और उसके सारे कार्य—देखो, वे इस्राएल के राजाओं के इतिहास-वृत्तांत[a] की पुस्तक में लिखे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के राजाओं के वार्षिक अभिलेख।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי פֶקַח
  choice: पेकह के बाकी काम
  rationale: יֶתֶר का अर्थ ‘बाकी’ है और राजकीय सारांश के इस सूत्र में דִּבְרֵי राजा के कामों या कार्यों को दर्शाता है। आरंभिक וְ को हिंदी में अलग से ‘और’ बनाना आवश्यक नहीं, क्योंकि वाक्य का संक्रमण स्वाभाविक रूप से स्पष्ट है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया, वह सब
  rationale: כָל की व्यापकता और עָשָׂה के सामान्य अर्थ को सहज हिंदी में सुरक्षित रखता है।
- source_word: הִנָּם
  choice: देखो
  rationale: इब्रानी निर्देशात्मक-प्रस्तुतिपरक बल को बनाए रखता है; इसे केवल सहायक क्रिया में समतल नहीं किया गया।
- source_word: כְּתוּבִים
  choice: लिखा है
  rationale: ‘वह सब’ को सामूहिक एकवचन मानते हुए हिंदी में स्वाभाविक अन्वय रखा गया है, जबकि मूल का दस्तावेज़ी अर्थ सुरक्षित है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/लिपटे हुए लेख पर’ है, पर किसी दस्तावेज़ में सामग्री लिखे होने के लिए हिंदी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत
  rationale: राजकीय अभिलेखों के क्रमबद्ध ऐतिहासिक विवरण का अर्थ देता है और ‘वार्षिक अभिलेख’ की संभावित व्याख्या को पादटिप्पणी में रखा गया है।
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के
  rationale: शीर्षक में לְ संबंधसूचक है; अतः ‘के’ सहज और संदर्भानुकूल है।
