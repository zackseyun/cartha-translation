  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देखो’ मूल के सूत्रबद्ध बल को बनाए रखता है; दीर्घ डैश उस बलाघात को स्वाभाविक हिंदी विराम देता है। पादटिप्पणी का चिह्न उस पदबंध पर रखा गया है जिससे उसका वास्तविक संबंध है।
