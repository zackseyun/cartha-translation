  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
translation:
  language: hi
  text: तब मनहेम ने अश्शूर के राजा को देने के लिए इस्राएल के सभी सामर्थ्यवान पुरुषों से[a] धन वसूल किया—उनमें से हर एक से पचास शेकेल चाँदी। तब अश्शूर का राजा लौट गया और उस देश में नहीं ठहरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का अर्थ “वीर पुरुष,” “सामर्थ्यवान/प्रतिष्ठित पुरुष,” या “साधन-संपन्न पुरुष” हो सकता है। कर-वसूली के प्रसंग में संपन्न पुरुषों का अर्थ संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּצֵא ... אֶת הַכֶּסֶף עַל יִשְׂרָאֵל
  choice: इस्राएल से ... धन वसूल किया
  rationale: हिफ़ील क्रिया का शाब्दिक अर्थ ‘बाहर निकलवाया’ है, पर धन और עַל के साथ यहाँ जबरन कर-वसूली का भाव है। ‘धन वसूल किया’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  choice: सभी धनी और प्रभावशाली पुरुषों से
  rationale: यह पदबंध सैनिक वीरता, सामाजिक सामर्थ्य या संपन्नता वाले पुरुषों को सूचित कर सकता है। प्रति-व्यक्ति कर के प्रसंग में आर्थिक और सामाजिक सामर्थ्य प्रमुख है; पादटिप्पणी वास्तविक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף לְאִישׁ אֶחָד
  choice: हर एक पुरुष से पचास शेकेल चाँदी
  rationale: मात्रा, धातु और प्रति-व्यक्ति आकलन को स्पष्ट रखते हुए ‘शेकेल’ को प्राचीन भार-मुद्रा के रूप में लिप्यंतरित किया गया है।
- source_word: וַיָּשָׁב מֶלֶךְ אַשּׁוּר
  choice: तब अश्शूर का राजा लौट गया
  rationale: וַיָּשָׁב यहाँ भुगतान के बाद राजा के वापस चले जाने को बताता है; ‘लौट गया’ सहज और सटीक है।
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  choice: उस देश में नहीं ठहरा
  rationale: עמד का संदर्भगत अर्थ यहाँ खड़ा रहना नहीं, बल्कि बने रहना या ठहरना है।
