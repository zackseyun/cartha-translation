base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
translation:
  language: hi
  text: तब एला के पुत्र होशे ने रमल्याह के पुत्र पेकह के विरुद्ध षड्यंत्र रचा[a], उसे मार गिराया और उसका वध कर दिया, और उज्जियाह के पुत्र योताम के बीसवें वर्ष में वह उसके स्थान पर राजा बना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “षड्यंत्र रचा” के लिए एक ही मूल से बनी क्रिया और संज्ञा का प्रयोग है; यह षड्यंत्र करने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में “उज्जियाह के पुत्र योताम के बीसवें वर्ष में” है। राजाओं के शासनकाल से जुड़ी अन्य सूचनाओं की तुलना में इससे कालक्रम संबंधी कठिनाई उत्पन्न होती है। कुछ व्याख्याकार इसे आहाज के शासनकाल से मिलाने का प्रयास करते हैं, पर यहाँ अनुवाद इब्रानी पाठ का ही अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  choice: षड्यंत्र रचा
  rationale: इब्रानी में एक ही धातु से बनी क्रिया और संज्ञा का प्रयोग बल देने के लिए हुआ है। हिन्दी में ‘षड्यंत्र का षड्यंत्र रचा’ अस्वाभाविक होगा; ‘षड्यंत्र रचा’ मुहावरे का स्वाभाविक अर्थ देता है, और मूल की बलात्मक रचना को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הוֹשֵׁעַ בֶּן אֵלָה
  choice: एला के पुत्र होशे
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण और पितृनाम की ऐतिहासिक पहचान सुरक्षित रखी गई है।
- source_word: עַל פֶּקַח בֶּן רְמַלְיָהוּ
  choice: रमल्याह के पुत्र पेकह के विरुद्ध
  rationale: षड्यंत्र के प्रसंग में עַל विरोधी कार्रवाई के लक्ष्य को दर्शाता है, इसलिए ‘के विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: וַיַּכֵּהוּ
  choice: उसे मार गिराया
  rationale: נכה हिंसक प्रहार या गिरा देने को व्यक्त करता है। अगली क्रिया मृत्यु को स्पष्ट करती है, इसलिए दोनों क्रियाओं का क्रम अलग रखा गया है।
- source_word: וַיְמִיתֵהוּ
  choice: उसका वध कर दिया
  rationale: מות के हिफ़ईल रूप का कारणात्मक भाव सुरक्षित रहता है और राजहत्या के ऐतिहासिक प्रसंग में यह वर्तमान हिन्दी का गरिमापूर्ण प्रयोग है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: फिर वह उसके स्थान पर राजा बना
  rationale: מלך और תחתיו मिलकर राजकीय उत्तराधिकार बताते हैं। ‘राजा बना’ हिन्दी में ‘उसके स्थान पर शासन किया’ की अपेक्षा इस घटना-क्रम में अधिक स्वाभाविक है।
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  choice: उज्जियाह के पुत्र योताम के बीसवें वर्ष में
  rationale: मसोरेटिक पाठ की राजवर्ष-सूचना को बिना सामंजस्य बैठाए सीधे अनूदित किया गया है।
theological_decisions:
- issue: राजवर्ष-सूचना में कालक्रम संबंधी तनाव
  choice: मुख्य पाठ में ‘उज्जियाह के पुत्र योताम के बीसवें वर्ष में’ रखा गया है।
  alternative: इसे आहाज के शासन से मिलाना अथवा संख्या/नाम में पाठ-संशोधन करना।
  rationale: योताम के शासन की अन्य सूचनाओं के साथ कठिनाई होने पर भी WLC के पाठ को बदलना उचित नहीं। पादटिप्पणी पाठक को समस्या बताती है, पर अनुवाद उसे चुपचाप हल नहीं करता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य अपनाया गया है। नामों के रूप: होशे, एला, पेकह, रमल्याह, योताम और उज्जियाह। मूल की क्रमिक क्रियाएँ अलग रखी गई हैं; अस्वाभाविक सजातीय पुनरुक्ति को मुख्य पाठ के बजाय पादटिप्पणी में दर्ज किया गया है।'
