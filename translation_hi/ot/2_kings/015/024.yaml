  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/024.yaml
  text: He did what was evil in the eyes of Yahweh[a]. He did not turn away from the sins of Jeroboam son of Nebat[b], who caused Israel to sin.
translation:
  language: hi
  text: उसने याहवे की दृष्टि में बुरा काम किया। वह नबात के पुत्र यारोबाम के पापों से नहीं फिरा, जिसने इस्राएल को पाप कराया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: उसने ... बुरा किया
  rationale: यह राजकीय मूल्यांकन का प्रचलित इब्रानी सूत्र है। हिन्दी में यह रूप अर्थ को निकटता और स्वाभाविकता से व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में
  rationale: इब्रानी मुहावरे का अर्थ परमेश्वर के मूल्यांकन में है; ‘की दृष्टि में’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לֹא סָר מֵחַטֹּאות
  choice: पापों से नहीं फिरा
  rationale: סור यहाँ किसी आचरण-पद्धति को छोड़ने या उससे हटने का भाव देता है; ‘से नहीं फिरा’ इस नैतिक संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: नामों का प्रचलित हिन्दी लिप्यंतरण और इब्रानी पितृनाम-संबंध सुरक्षित रखा गया है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिसने इस्राएल से पाप करवाया था
  rationale: हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट रूप से व्यक्त करता है और कर्ता यारोबाम को ही रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: इस्राएल के पाप में यारोबाम की भूमिका
  choice: जिसने इस्राएल से पाप करवाया था
  alternative: जिसने इस्राएल को पाप में डाला था
  rationale: कारणवाचक इब्रानी क्रिया को बनाए रखा गया है, पर यह नहीं बताया गया कि उसने किस विशेष रीति से ऐसा किया; इससे मूल की सीमा और नैतिक तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। राजकीय मूल्यांकन-सूत्र की संक्षिप्तता बनाए रखते हुए ऐसे शब्द चुने गए हैं जिन्हें सामान्य हिन्दी पाठक सहजता से समझ सके।
