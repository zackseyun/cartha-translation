  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה אֲמַצְיָ֥הוּ אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/003.yaml
  text: He did what was right in the eyes of Yahweh, according to all that Amaziah his father had done.
translation:
  language: hi
  text: उसने वही किया जो यहोवा की दृष्टि में सही था, ठीक वैसे ही जैसे उसके पिता अमस्याह ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वाव-क्रमिक यहाँ कथा की अगली क्रिया बताता है; आधुनिक हिन्दी में आरम्भिक ‘और’ आवश्यक नहीं है।
- source_word: הַיָּשָׁר
  choice: जो ... सही था
  rationale: लेखयुक्त विशेषण यहाँ संज्ञा के रूप में ‘सही काम’ का अर्थ देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह वाक्यांश यहोवा के मूल्यांकन को व्यक्त करता है और मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह तुलना और आचरण के नमूने से अनुरूपता को सहज आधुनिक हिन्दी में व्यक्त करता है; כְּכֹל का समग्र बल ‘ठीक’ से सामने आता है।
- source_word: עָשָׂה
  choice: ने किया था
  rationale: ‘था’ पिता अमस्याह के पहले के आचरण को वर्तमान राजा के आचरण की तुलना में स्पष्ट करता है, जबकि क्रिया के सामान्य अर्थ को बनाए रखता है।
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: नाम का रूप आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: निकट वंशावली-संदर्भ में इसका अर्थ वास्तविक पिता है, केवल पूर्वज नहीं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के बीच अधिक परिचित लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजकीय मूल्यांकन-सूत्र का मूल अर्थ सुरक्षित रखते हुए शब्दक्रम को स्वाभाविक हिन्दी के अनुसार ढाला गया है।
