  text: שַׁלּ֤וּם בֶּן יָבֵישׁ֙ מָלַ֔ךְ בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וָ/תֵ֨שַׁע֙ שָׁנָ֔ה לְ/עֻזִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַ/יִּמְלֹ֥ךְ יֶֽרַח יָמִ֖ים בְּ/שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
translation:
  language: hi
  text: याबेश का पुत्र शल्लूम, यहूदा के राजा उज्जियाह के शासन के उनतालीसवें वर्ष में राजा बना। उसने शोमरोन में एक महीने[a] तक शासन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दिनों का एक महीना,” अर्थात लगभग एक महीना।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָלַךְ
  choice: राजा बना
  rationale: यहाँ पूर्ण क्रिया राजगद्दी पर बैठने को सूचित करती है; ‘राजा बना’ केवल ‘शासन किया’ की अपेक्षा इस आरंभिक भाव को अधिक स्पष्ट रखता है।
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  choice: शासन के उनतालीसवें वर्ष में
  rationale: यह राजकीय वर्षों की गणना का प्रचलित सूत्र है; आधुनिक हिन्दी में क्रमवाचक रूप स्वाभाविक है।
- source_word: לְעֻזִיָּה מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा उज्जियाह के शासन के
  rationale: इस राजकीय काल-सामंजस्य में ל उस वर्ष को उज्जियाह के शासन से जोड़ता है; हिन्दी में ‘के शासन के’ संबंध को स्पष्ट और सहज बनाता है।
- source_word: וַיִּמְלֹךְ
  choice: उसने ... शासन किया
  rationale: यह क्रिया राजारोहण के बाद शासन की अवधि बताती है और कथा को आगे बढ़ाती है।
- source_word: יֶרַח יָמִים
  choice: एक महीने
  rationale: हिब्रू का शाब्दिक मुहावरा ‘दिनों का एक महीना’ है। मुख्य पाठ में स्वाभाविक हिन्दी ‘एक महीने’ रखी गई है और स्रोत की अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: स्थानवाचक ב का सीधा अर्थ ‘में’ है; शोमरोन वह राजधानी थी जहाँ उसने शासन किया।
