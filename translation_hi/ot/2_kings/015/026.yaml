source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י פְקַחְיָ֖ה וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/026.yaml
  text: The rest of the acts of Pekahiah[a], and all that he did, behold, they are written in the Book of the Chronicles of the Kings of Israel.
translation:
  language: hi
  text: पकह्याह के बाकी काम और वह सब जो उसने किया, देखो, इस्राएल के राजाओं के इतिहास की पुस्तक में लिखे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पकह्याह के बाकी काम और वह सब जो उसने किया, निश्चय ही इस्राएल के राजाओं के वृत्तांत की पुस्तक में लिखे हैं।”
    reason: הִנָּם के लिए ‘देखो’ के स्थान पर ‘निश्चय ही’ और दִּבְרֵי הַיָּמִים के लिए ‘इतिहास’ के स्थान पर ‘वृत्तांत’ वैकल्पिक हिंदी रूप हैं।
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  choice: के बाकी कामों
  rationale: राजकीय सारांश के इस रूढ़ प्रयोग में יֶתֶר का अर्थ ‘बाकी’ और דִּבְרֵי का आशय राजा के कामों या शासन-संबंधी वृत्तांत से है, केवल उसके बोले हुए शब्दों से नहीं। आरंभिक וְ को हिंदी में अलग से ‘और’ बनाना आवश्यक नहीं, क्योंकि वाक्य स्वाभाविक रूप से पिछले प्रसंग से जुड़ता है।
- source_word: פְקַחְיָה
  choice: पकह्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह עשה के व्यापक अर्थ को बिना अनावश्यक विशिष्टीकरण के स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הִנָּם כְּתוּבִים
  choice: उसका विवरण ... लिखा है
  rationale: बहुवचन संकेतक הִנָּם पूर्वोक्त कामों की ओर ध्यान खींचता है। हिंदी में ‘उसका विवरण ... लिखा है’ उसी प्रस्तुतीकरण को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक ‘देखो, वे लिखे हैं’ असहज होता।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: दस्तावेजी सूत्र में עַל का स्वाभाविक हिंदी रूप ‘में’ है। סֵפֶר ऐतिहासिक रूप से ग्रंथ या पुस्तक/लपेटा हुआ लेख हो सकता है; मुख्य पाठ में सामान्य ‘पुस्तक’ उपयुक्त है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं के इतिहास
  rationale: דִּבְרֵי הַיָּמִים यहाँ राजकीय वार्षिक वृत्तांत या अभिलेख का पद है। ‘इतिहास’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है, जबकि ‘वृत्तांत’ भी संभव है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; राजकीय अभिलेख के सूत्र को गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। पादटिप्पणी चिह्न उस पूरे कथन के वैकल्पिक, अधिक शाब्दिक रूप से संबंधित होने के कारण वाक्य के अंत में रखा गया है।
