  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֜ה אֶת הַ/מֶּ֗לֶךְ וַ/יְהִ֤י מְצֹרָע֙ עַד י֣וֹם מֹת֔/וֹ וַ/יֵּ֖שֶׁב בְּ/בֵ֣ית הַ/חָפְשִׁ֑ית וְ/יוֹתָ֤ם בֶּן הַ/מֶּ֨לֶךְ֙ עַל הַ/בַּ֔יִת שֹׁפֵ֖ט אֶת עַ֥ם הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
translation:
  language: hi
  text: तब यहोवा ने राजा पर प्रहार किया, और वह अपनी मृत्यु के दिन तक कोढ़ से पीड़ित रहा[a]। वह एक अलग घर में रहता था[b]। राजा का पुत्र योताम राजमहल की देखरेख करता और देश के लोगों का न्याय करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द किसी गंभीर या अशुद्ध ठहराने वाले त्वचा-रोग को अधिक व्यापक रूप से सूचित कर सकता है; इसका अर्थ आवश्यक रूप से आधुनिक कोढ़ (हैन्सन रोग) ही नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से कठिन पदबंध; इसका अनुवाद “पृथक किए गए घर में” या “एकांत घर में” भी हो सकता है। संभवतः इसका आशय अलग रखे गए निवास से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित रूप रखकर परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि से अलग रखा गया है।
- source_word: וַיְנַגַּע
  choice: प्रहार किया
  rationale: यहाँ נגע केवल छूने नहीं, बल्कि परमेश्वर द्वारा दंडकारी पीड़ा पहुँचाने को व्यक्त करता है; यह विकल्प दिव्य कर्तृत्व स्पष्ट रखता है, पर साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מְצֹרָע
  choice: कोढ़ से पीड़ित
  rationale: यह परिचित और संक्षिप्त पारंपरिक पद है; पादटिप्पणी स्पष्ट करती है कि इब्रानी शब्द को आधुनिक हैन्सन रोग तक सीमित नहीं किया जाना चाहिए।
- source_word: עַד יוֹם מֹתוֹ
  choice: अपनी मृत्यु के दिन तक
  rationale: इब्रानी मुहावरे और उसकी गंभीर लय को निकटता से बनाए रखता है।
- source_word: בְּבֵית הַחָפְשִׁית
  choice: एक अलग घर में
  rationale: कठिन इब्रानी पदबंध का संदर्भगत आशय पृथक निवास है; इससे मूल धातु से निकलने वाले भ्रामक सकारात्मक अर्थ से बचा गया है।
- source_word: עַל הַבַּיִת
  choice: राजमहल की देखरेख करता
  rationale: राजा के पुत्र के संदर्भ में यह पदबंध राजकीय गृह या महल के प्रशासनिक दायित्व को दर्शाता है; स्वाभाविक हिन्दी में उसके कार्य को स्पष्ट किया गया है।
- source_word: שֹׁפֵט
  choice: न्याय करता था
  rationale: कृदंत से प्रकट निरंतर न्यायिक-शासकीय दायित्व को सीधे व्यक्त करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: इब्रानी अभिव्यक्ति का सामान्य जनसमुदाय संबंधी अर्थ सहज आधुनिक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: מְצֹרָע द्वारा सूचित राजा के रोग की प्रकृति
  choice: मुख्य पाठ में पारंपरिक ‘कोढ़ से पीड़ित’ रखा गया और व्यापक अर्थ पादटिप्पणी में बताया गया।
  alternative: किसी गंभीर त्वचा-रोग से पीड़ित
  rationale: पद आधुनिक चिकित्सकीय निदान निश्चित नहीं करता। मुख्य पाठ की परिचित शब्दावली और पादटिप्पणी की सावधानी मिलकर मूल की अनिश्चितता को सुरक्षित रखते हैं।
- issue: राजा की पीड़ा में यहोवा की भूमिका
  choice: ‘यहोवा ने राजा पर प्रहार किया’ द्वारा दिव्य कर्तृत्व प्रत्यक्ष रखा गया।
  alternative: राजा पीड़ित हो गया
  rationale: इब्रानी वाक्य में यहोवा स्पष्ट कर्ता हैं; कर्मवाच्य या अस्पष्ट भाषा उस धार्मिक तनाव को कम कर देती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-रचना मूल कथात्मक क्रम के निकट है, किंतु हिन्दी प्रवाह के लिए क्रियाओं को स्वाभाविक बनाया गया है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
