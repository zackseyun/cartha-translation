  register: आधुनिक मानक हिन्दी में संक्षिप्त राजकीय इतिहास-शैली रखी गई है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
