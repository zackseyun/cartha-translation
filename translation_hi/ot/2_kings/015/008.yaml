  text: בִּ/שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁמֹנֶה֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ זְכַרְיָ֨הוּ בֶן יָרָבְעָ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שִׁשָּׁ֥ה חֳדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/008.yaml
  text: In the thirty-eighth year of Azariah king of Judah, Zechariah son of Jeroboam became king over Israel in Samaria for six months.
translation:
  language: hi
  text: यहूदा के राजा अजर्याह के शासन के अड़तीसवें वर्ष में यारोबाम का पुत्र जकर्याह शोमरोन में इस्राएल का राजा बना और उसने छह महीने तक शासन किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: शासन के अड़तीसवें वर्ष में
  rationale: यह इब्रानी राजकीय तिथि-सूत्र है; गणनावाचक पद यहाँ क्रमवाचक अर्थ देता है। आधुनिक हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: לַעֲזַרְיָהוּ מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा अजर्याह के
  rationale: ל यहाँ अजर्याह के राजकीय वर्ष का संदर्भ देता है। पदक्रम को हिन्दी के स्वाभाविक संबंध-सूचक ढाँचे में रखा गया है।
- source_word: מָלַךְ
  choice: राजा बना ... शासन किया
  rationale: पहला प्रयोग राज्यारोहण को व्यक्त करता है, जबकि अंत में दी गई छह महीने की अवधि को स्पष्ट और स्वाभाविक हिन्दी में शासन की अवधि के रूप में जोड़ा गया है।
- source_word: זְכַרְיָהוּ בֶן יָרָבְעָם
  choice: यारोबाम का पुत्र जकर्याह
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखते हुए पुत्र-संबंध को सीधे व्यक्त किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: מלך के साथ עַל प्रजा अथवा राज्य पर शासन को दर्शाता है; हिन्दी में ‘इस्राएल का राजा’ अधिक स्वाभाविक है।
- source_word: בְּשֹׁמְרוֹן
  choice: शोमरोन में
  rationale: בְּ स्थान-सूचक है और शासन के केंद्र अथवा स्थान को दर्शाता है।
- source_word: שִׁשָּׁה חֳדָשִׁים
  choice: छह महीने तक
  rationale: यह कालावधि-सूचक कर्मकारक है; हिन्दी में ‘तक’ शासन की अवधि को सहज रूप से व्यक्त करता है।
theological_decisions: []
