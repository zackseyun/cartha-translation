source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
translation:
  language: hi
  text: उसने वही किया जो याहवे की दृष्टि में बुरा था, ठीक वैसे ही जैसे उसके पुरखाओं ने किया था। वह नबात के पुत्र यारोबाम के उन पापों से नहीं हटा, जिनके द्वारा यारोबाम ने इस्राएल से पाप करवाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यारोबाम, जिसने इस्राएल से पाप करवाया था।” इब्रानी संबंधवाचक उपवाक्य का संबंध सीधे यारोबाम से, या उसके पापों से माना जा सकता है।
    reason: इब्रानी संबंधवाचक उपवाक्य के संभावित पूर्वपद की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: इब्रानी कथात्मक क्रिया को स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है।
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: वही किया जो याहवे की दृष्टि में बुरा था
  rationale: व्यवस्थाविवरणीय मूल्यांकन-सूत्र को अर्थ-स्पष्ट हिन्दी में रखते हुए ‘की दृष्टि में’ से मूल मुहावरे का स्वर सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָיו
  choice: ठीक वैसे ही जैसे उसके पुरखाओं ने किया था
  rationale: כַּאֲשֶׁר की तुलना को ‘ठीक वैसे ही जैसे’ व्यक्त करता है; ‘पुरखाओं’ से राजवंशीय पूर्वजों का स्वाभाविक हिन्दी बोध मिलता है।
- source_word: לֹא סָר
  choice: नहीं फिरा
  rationale: סור का किसी पापपूर्ण मार्ग को छोड़ने या उससे हटने का नैतिक भाव संक्षिप्त और पारंपरिक किन्तु सहज हिन्दी में व्यक्त होता है।
- source_word: מֵחַטֹּאות
  choice: उन पापों से
  rationale: मूल के बहुवचन को बनाए रखा गया है और आगे आने वाले संबंधवाचक उपवाक्य से जोड़ने के लिए ‘उन’ जोड़ा गया है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: नामों का हिन्दी लिप्यंतरण और पिता-पुत्र संबंध मूल के अनुसार सुरक्षित रखा गया है।
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: जिनके द्वारा उसने इस्राएल से पाप करवाया था
  rationale: संबंधवाचक उपवाक्य को निकटस्थ बहुवचन ‘पापों’ से जोड़कर साधन/माध्यम का भाव व्यक्त किया गया है; कर्ता यारोबाम ही समझा जाता है। मूल में संभावित वैकल्पिक संबंध को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल के व्यक्तिगत नाम को सुरक्षित रखने के लिए ‘याहवे’ चुना गया है; इसे किसी उपाधि से नहीं बदला गया।
- issue: אֲבֹתָיו का संबंध-सूचक अर्थ
  choice: उसके पुरखाओं
  alternative: उसके पिताओं; उसके पूर्वजों
  rationale: राजकीय संदर्भ में यह उसके पुरुष राजवंशीय पूर्वजों/पूर्ववर्ती शासकों की ओर संकेत करता है। ‘पुरखाओं’ से पुरुष-संदर्भ और स्वाभाविक हिन्दी दोनों बने रहते हैं।
- issue: אֲשֶׁר का पूर्वपद
  choice: संबंधवाचक उपवाक्य को ‘पापों’ से जोड़ना
  alternative: 'इसे सीधे ‘यारोबाम’ से जोड़ना: ‘जिसने इस्राएल से पाप करवाया था’'
  rationale: निकटस्थ ‘पापों’ के साथ संबंध लेने पर वे साधन या पापपूर्ण रीति बनते हैं जिनके द्वारा यारोबाम ने इस्राएल को पाप में लगाया। इब्रानी व्याकरण यारोबाम को प्रत्यक्ष पूर्वपद मानने की भी अनुमति देता है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। ‘याहवे,’ ‘पुरखाओं,’ और ‘नहीं फिरा’ जैसे पद मूल के नाम, राजवंशीय संदर्भ और नैतिक दिशा से हटने के भाव को स्पष्ट रखते हैं। पादटिप्पणी-चिह्न उसी उपवाक्य के बाद रखा गया है जिससे वह संबंधित है।
