  text: उस समय बाबेल के राजा नबूकदनेस्सर के सेवक यरूशलेम पर चढ़ आए[a], और नगर घेराबंदी में आ गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “यरूशलेम की ओर चढ़ आए।” इब्रानी में “चढ़ना” ऊँचाई की ओर जाने और सैन्य चढ़ाई—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “नगर को घेर लिया गया।” इब्रानी में अधिक शाब्दिक रूप से “नगर घेराबंदी में आ गया” है, जो घेराबंदी आरम्भ होने पर बल दे सकता है।
