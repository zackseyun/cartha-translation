  text: וְ/גַ֤ם דַּֽם הַ/נָּקִי֙ אֲשֶׁ֣ר שָׁפָ֔ךְ וַ/יְמַלֵּ֥א אֶת יְרוּשָׁלִַ֖ם דָּ֣ם נָקִ֑י וְ/לֹֽא אָבָ֥ה יְהוָ֖ה לִ/סְלֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/004.yaml
  text: and also for the innocent blood that he had shed[a], for he had filled Jerusalem with innocent blood[b], and Yahweh was not willing to forgive.
translation:
  language: hi
  text: और उसके बहाए हुए निर्दोष खून के कारण भी—क्योंकि उसने यरूशलेम को निर्दोष खून से भर दिया था[a]—यहोवा[b] क्षमा करने को इच्छुक नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्दोषों का खून।”
    reason: lexical_alternative
  - marker: b
    text: परमेश्वर के नाम ‘यहोवा’ के स्थान पर अनेक अनुवादों में “प्रभु” लिखा जाता है।
    reason: divine_name_rendering
lexical_decisions:
- source_word: וְגַם
  choice: और ... के कारण भी
  rationale: यह पिछले पद में बताए गए न्याय के कारणों से इस पद को जोड़ता है और एक अतिरिक्त कारण प्रस्तुत करता है। हिंदी वाक्य में ‘के कारण’ प्रसंग से स्पष्ट संबंध को स्वाभाविक बनाता है।
- source_word: דַּם הַנָּקִי
  choice: उस निर्दोष खून
  rationale: यह अन्यायपूर्वक मारे गए निर्दोष लोगों के रक्त और उससे उत्पन्न रक्त-दोष को सूचित करता है; ‘उस’ इब्रानी निश्चितता को दर्शाता है।
- source_word: אֲשֶׁר שָׁפָךְ
  choice: जो उसने बहाया था
  rationale: खून के साथ שׁפך का स्वाभाविक अर्थ ‘खून बहाना’ है। ‘था’ पूर्व में किए गए कार्य का प्रत्यवलोकन बनाए रखता है।
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  choice: उसने यरूशलेम को निर्दोष खून से भर दिया था
  rationale: इब्रानी रूपक को सीधे और स्वाभाविक हिंदी में रखा गया है। ‘से’ भरने की वस्तु स्पष्ट करता है, जबकि कथन की तीव्रता बनी रहती है।
- source_word: וְלֹא אָבָה
  choice: और ... तैयार नहीं हुआ
  rationale: אָבָה इच्छा या सहमति व्यक्त करता है। ‘तैयार नहीं हुआ’ केवल परिणाम नहीं, बल्कि क्षमा करने की अनिच्छा को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिंदी लिप्यंतरण में रखा गया है।
- source_word: לִסְלֹחַ
  choice: क्षमा करने
  rationale: दैवी क्षमादान के इस प्रसंग में ‘क्षमा करना’ आधुनिक हिंदी का स्पष्ट और स्वाभाविक समानार्थ है।
theological_decisions:
- issue: मनश्शे के रक्त-दोष के संदर्भ में परमेश्वर का क्षमा न करना
  choice: पद सीधे कहता है कि यहोवा क्षमा करने को तैयार नहीं हुआ।
  alternative: ‘यहोवा क्षमा नहीं करता’ या कथन को केवल अलंकारिक न्याय-भाषा मानना।
  rationale: इब्रानी पाठ क्षमा करने की अनिच्छा को संचित निर्दोष रक्तपात और आने वाले न्याय से जोड़ता है। अनुवाद इस कठोर धार्मिक तनाव को न तो हल्का करता है, न पद से आगे जाकर उसका विस्तार करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खून बहाना’ और ‘खून से भर देना’ मूल के तीखे रक्तपात-रूपक को बनाए रखते हैं; ‘रक्त’ की अपेक्षा ‘खून’ यहाँ अधिक सहज है, पर शैली अनौपचारिक नहीं होती।
