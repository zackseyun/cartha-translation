  text: בֶּן שְׁמֹנֶ֨ה עֶשְׂרֵ֤ה שָׁנָה֙ יְהוֹיָכִ֣ין בְּ/מָלְכ֔/וֹ וּ/שְׁלֹשָׁ֣ה חֳדָשִׁ֔ים מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ נְחֻשְׁתָּ֥א בַת אֶלְנָתָ֖ן מִ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/008.yaml
  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
translation:
  language: hi
  text: यहोयाकीन अठारह वर्ष का था जब वह राजा बना, और उसने यरूशलेम में तीन महीने तक राज्य किया। उसकी माता का नाम नहुष्ता था। वह यरूशलेम के एलनातान की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: अठारह वर्ष का था
  rationale: यह इब्रानी में आयु बताने का प्रचलित मुहावरा है; आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य यही है।
- source_word: בְּמָלְכוֹ
  choice: जब वह राजा बना
  rationale: ב prefixed infinitive construction उसके राजगद्दी पर बैठने का समय बताती है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּשְׁלֹשָׁה חֳדָשִׁים מָלַךְ
  choice: उसने ... तीन महीने तक राज्य किया
  rationale: מָלַךְ का क्रियात्मक अर्थ और शासन की अवधि दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: नगर के साथ स्थानवाचक ב का सीधा हिन्दी रूप।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: वंशावली-सूत्र का स्वाभाविक, dignified आधुनिक हिन्दी रूप।
- source_word: נְחֻשְׁתָּא
  choice: नहुष्ता
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: בַת אֶלְנָתָן
  choice: एलनातान की बेटी
  rationale: Construct chain पिता-पुत्री का संबंध व्यक्त करती है; हिन्दी संबंधकारक इसे साफ़ रूप में देता है।
- source_word: מִירוּשָׁלִָם
  choice: यरूशलेम के
  rationale: מִן मूलतः उद्गम/संबंध बताता है। यहाँ पिता की पहचान नगर से कराने वाले वंशावली-संदर्भ में 'यरूशलेम के एलनातान' आधुनिक हिन्दी में स्वाभाविक है और 'यरूशलेम से' की संभावित संबद्धता-अस्पष्टता को दूर करता है।
