  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। अंतिम नगर-संबंधी पदबंध को अलग वाक्य में रखकर स्पष्ट किया गया है कि 'यरूशलेम के' एलनातान का परिचय देता है, न कि नहुष्ता की तत्काल यात्रा या निवास को।
