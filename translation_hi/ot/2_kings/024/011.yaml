  text: And Nebuchadnezzar king of Babylon came against the city while his servants were besieging it[a][b].
translation:
  language: hi
  text: तब बाबेल का राजा नबूकदनेस्सर नगर पर चढ़ आया, जबकि उसके सेवक उसकी घेराबंदी कर रहे थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसके सेवक नगर को घेरे हुए थे।”
    reason: lexical_alternative
  - marker: b
    text: “उसके सेवक” से बाबेल के राजा की राजकीय सेवा में लगे अधिकारी, प्रतिनिधि या सैन्य बल अभिप्रेत हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: चढ़ आया
  rationale: सैन्य प्रसंग में בוא तथा עַל का मेल नगर के विरुद्ध आगे बढ़ने को व्यक्त करता है; ‘चढ़ आया’ स्वाभाविक हिन्दी में इस शत्रुतापूर्ण आगमन को स्पष्ट करता है।
- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह इस बाबेली राजा के नाम का हिन्दी बाइबल परंपरा में प्रचलित और सुबोध लिप्यंतरण है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: सम्बन्धसूचक हिब्रू पदबंध को सीधे और स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
- source_word: עַל הָעִיר
  choice: नगर पर
  rationale: घेराबंदी के सैन्य संदर्भ में עַל विरोधी दिशा को दर्शाता है; ‘नगर पर चढ़ आया’ हिन्दी का स्वाभाविक युद्ध-संबंधी प्रयोग है।
- source_word: וַעֲבָדָיו
  choice: उसके सेवक
  rationale: ‘सेवक’ मूल עבדים की व्यापकता बनाए रखता है; राजकीय संदर्भ में इससे अधिकारी, प्रतिनिधि या सैन्य बल अभिप्रेत हो सकते हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: צָרִים
  choice: घेर रहे थे
  rationale: צור का कृदन्त यहाँ जारी घेराबंदी को व्यक्त करता है। ‘घेर रहे थे’ सरल और स्वाभाविक हिन्दी है तथा मुख्य क्रिया के साथ समकालिकता बनाए रखता है।
- source_word: עָלֶיהָ
  choice: उसे
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ ‘नगर’ से है; हिन्दी में ‘घेरना’ के साथ सीधा कर्म ‘उसे’ स्वाभाविक है।
