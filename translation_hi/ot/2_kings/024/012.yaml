  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
translation:
  language: hi
  text: तब यहूदा का राजा यहोयाकीन बाहर निकलकर बाबेल के राजा के पास गया—वह, उसकी माता, उसके सेवक, उसके अधिकारी और उसके खोजे[a]। बाबेल के राजा ने उसे बाबेल के राजा के राज्यकाल के आठवें वर्ष में ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके राजदरबार के अधिकारी’; इब्रानी शब्द का अर्थ वास्तविक खोजे या अधिक व्यापक रूप से राजदरबार के अधिकारी हो सकता है।
    reason: शब्द के प्रत्यक्ष और पद-सूचक, दोनों संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकलकर गया
  rationale: मूल क्रिया יצא का अर्थ ‘निकलना’ है। घेराबंदी के प्रसंग में यह आत्मसमर्पण की ओर संकेत कर सकती है, पर अनुवाद में ‘आत्मसमर्पण किया’ कहकर उस निहितार्थ को स्पष्ट अर्थ नहीं बनाया गया।
- source_word: עַל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के पास
  rationale: יצא के साथ यहाँ עַל यहोयाकीन की गति का लक्ष्य बताता है। ‘के पास’ आधुनिक हिन्दी में स्वाभाविक है और ‘के विरुद्ध’ का भ्रामक अर्थ नहीं देता।
- source_word: הוּא וְאִמּוֹ
  choice: वह, उसकी माता
  rationale: सर्वनाम कर्ता को फिर से सामने लाकर उसके साथ जाने वालों की सूची आरम्भ करता है। हिन्दी में डैश के बाद यह संरचना स्पष्ट और स्वाभाविक है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: עֶבֶד का व्यापक अर्थ ‘सेवक’ है। यह चयन दरबारी या प्रशासनिक पद का अनावश्यक रूप से संकीर्ण अर्थ नहीं थोपता।
- source_word: שָׂרָיו
  choice: उसके अधिकारी
  rationale: שַׂר उच्च पद के अगुवों या अधिकारियों को दर्शाता है। राजदरबार के इस प्रसंग में ‘अधिकारी’ स्वाभाविक है और इसे केवल सैन्य सेनापतियों तक सीमित नहीं करता।
- source_word: סָרִיסָיו
  choice: उसके खोजे
  rationale: סָרִיס का प्रत्यक्ष अर्थ ‘खोजा’ हो सकता है, यद्यपि यह राजदरबार के अधिकारियों के लिए अधिक व्यापक रूप से भी प्रयुक्त होता है। मुख्य पाठ प्रत्यक्ष अर्थ रखता है और पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: וַיִּקַּח אֹתוֹ
  choice: उसे अपने अधिकार में ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ राजा को नियंत्रण में लेने का भाव है; यह हिन्दी अभिव्यक्ति उस प्रसंगगत अर्थ को स्पष्ट करती है, बिना सीधे ‘मार डाला’ या किसी अन्य परिणाम का संकेत दिए।
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  choice: अपने राज्यकाल के आठवें वर्ष में
  rationale: प्रत्यय का सबसे निकट और प्रसंगानुकूल संदर्भ बाबेल का राजा है। ‘अपने राज्यकाल’ हिन्दी में उसी कर्ता से संबंध स्पष्ट करता है।
theological_decisions:
- issue: अंतिम काल-सूचना में ‘उसके राज्यकाल’ का संदर्भ
  choice: बाबेल के राजा का राज्यकाल
  alternative: यहोयाकीन का राज्यकाल
  rationale: वाक्य में निकटतम एकवचन पुल्लिंग कर्ता बाबेल का राजा है, और अध्याय का ऐतिहासिक कालक्रम भी इसी संदर्भ के अनुकूल है।
- issue: יָצָא के प्रसंगगत निहितार्थ को व्यक्त करना
  choice: निकलकर गया
  alternative: आत्मसमर्पण किया
  rationale: घेराबंदी के प्रसंग में आत्मसमर्पण का भाव संभव है, लेकिन मूल क्रिया केवल ‘निकलने’ को स्पष्ट रूप से कहती है। इसलिए अनुवाद वास्तविक निहितार्थ को सिद्ध कथन में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘माता’ राजकीय आख्यान के अनुरूप है; ‘निकलकर गया’ मूल क्रिया को बचाता है; और डैश साथ जाने वालों की सूची को स्पष्ट करता है।
