- source_word: מַתַּנְיָה
  choice: मत्तन्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: דֹדוֹ
  choice: उसके चाचा
  rationale: דּוֹד कुछ प्रसंगों में व्यापक अर्थ रख सकता है, पर यहाँ ऐतिहासिक सम्बन्ध यहोयाकीन के चाचा का है; ‘चाचा’ सटीक और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राज्यारोहण के प्रसंग में यह पद प्रतिस्थापन या उत्तराधिकार व्यक्त करता है।
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  choice: उसका नाम बदलकर … रख दिया
  rationale: नाम के साथ סבב का आशय नाम बदलना है; हिन्दी में यह मुहावरा स्पष्ट रूप से पुनर्नामकरण व्यक्त करता है।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
