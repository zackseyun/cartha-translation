  choice: राजा बनाया
  rationale: 'हिफ़ील रूप का प्रेरणार्थक अर्थ है: बाबेल के राजा ने मत्तन्याह को राजपद पर स्थापित किया। यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।'
- source_word: מֶלֶךְ בָּבֶל
