  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
translation:
  language: hi
  text: और सब शूरवीर पुरुषों—सात हज़ार—और कारीगरों तथा लोहारों[a]—एक हज़ार—को, जो सभी युद्ध करने में समर्थ पराक्रमी पुरुष थे[b], बाबेल का राजा निर्वासित करके बाबेल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिल्पकारों तथा धातु का काम करने वालों।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक: “युद्ध करने वाले।” अर्थात् ऐसे पुरुष जो सैनिक सेवा के योग्य थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  choice: शूरवीर पुरुष
  rationale: यह पद सामर्थ्यवान और सैनिक सेवा के योग्य पुरुषों को दर्शाता है। ‘शूरवीर पुरुष’ इसके सामर्थ्य और युद्ध-संबंधी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שִׁבְעַת אֲלָפִים
  choice: सात हज़ार
  rationale: मूल संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: הֶחָרָשׁ
  choice: कारीगर
  rationale: यह शब्द लकड़ी, पत्थर या धातु में काम करने वाले कुशल शिल्पकार के लिए प्रयुक्त हो सकता है; ‘कारीगर’ बिना किसी एक पेशे को अनावश्यक रूप से निश्चित किए व्यापक अर्थ रखता है।
- source_word: הַמַּסְגֵּר
  choice: लोहार
  rationale: संदर्भ में यह संभवतः धातु का काम करने वाले कारीगर को दर्शाता है। ‘लोहार’ संक्षिप्त और सहज है, जबकि व्यापक विकल्प को पाद-टिप्पणी में रखा गया है।
- source_word: אֶלֶף
  choice: एक हज़ार
  rationale: कारीगरों और लोहारों की सम्मिलित संख्या का सीधा अनुवाद।
- source_word: הַכֹּל
  choice: सभी
  rationale: यह पहले बताए गए निर्वासित समूहों को समेटता है और हिन्दी में स्वाभाविक रूप से उनके सामूहिक वर्णन की भूमिका निभाता है।
- source_word: גִּבּוֹרִים
  choice: पराक्रमी ... पुरुष
  rationale: यह शब्द बलवान या सामर्थ्यवान पुरुषों को, प्रायः सैनिक भाव के साथ, दर्शाता है; ‘पराक्रमी पुरुष’ उस अर्थ को सुरक्षित रखता है।
- source_word: עֹשֵׂי מִלְחָמָה
  choice: युद्ध करने योग्य
  rationale: शाब्दिक अर्थ ‘युद्ध करने वाले’ है, पर संदर्भ में आशय सैनिक सेवा या युद्ध के लिए सक्षम होने से है। ‘युद्ध करने योग्य’ हिन्दी में इस भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְבִיאֵם
  choice: ले गया
  rationale: क्रिया का मूल अर्थ ‘उन्हें लाया/ले गया’ है; हिन्दी दृष्टिकोण में बाबेल की दिशा में गति के लिए ‘ले गया’ स्वाभाविक है।
- source_word: גּוֹלָה
  choice: बंदी बनाकर
  rationale: यहाँ संज्ञा निर्वासन की दशा या परिणाम बताती है। ‘बंदी बनाकर’ जब ‘बाबेल ले गया’ के साथ आता है, तो बलपूर्वक निर्वासन का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक प्रत्यय बाबेल की ओर गति बताता है; हिन्दी में ‘बाबेल ले गया’ यही अर्थ देता है।
