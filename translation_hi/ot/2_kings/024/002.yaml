language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
translation:
  language: hi
  text: तब याहवे ने उसके विरुद्ध कसदियों के छापामार दल, अराम[a] के छापामार दल, मोआब के छापामार दल और अम्मोनियों के छापामार दल भेजे। उसने उन्हें यहूदा के विरुद्ध भेजा, ताकि वे उसे नष्ट कर दें[b]—याहवे के उस वचन के अनुसार, जो उसने अपने सेवक नबियों के द्वारा कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अराम को परंपरागत रूप से ‘सीरिया’ कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: '‘उसे’ का संकेत यहूदा की ओर हो सकता है; या यहोयाकीम की ओर: ‘ताकि वे उसे नष्ट कर दें।’'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: भेजे
  rationale: कथात्मक गद्य में क्रिया का सीधा और स्वाभाविक अनुवाद; याहवे की सक्रिय भूमिका बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: בּוֹ
  choice: उसके विरुद्ध
  rationale: इस शत्रुतापूर्ण सैनिक प्रसंग में पूर्वसर्ग का विरोधात्मक भाव स्पष्ट करता है; सर्वनाम का संकेत प्रसंगानुसार यहोयाकीम की ओर है।
- source_word: גְּדוּדֵי
  choice: छापामार दल
  rationale: यहाँ पूर्ण नियमित सेनाओं की अपेक्षा धावा बोलने वाले छोटे सैनिक समूह अभिप्रेत हैं; पद में इसकी पुनरावृत्ति भी बनाए रखी गई है।
- source_word: כַשְׂדִּים
  choice: कसदियों
  rationale: ‘बाबेलियों’ कहने के बजाय मूल जातिनाम को सुरक्षित रखा गया है।
- source_word: אֲרָם
  choice: अराम
  rationale: परंपरागत ‘सीरिया’ के बजाय मूल स्थान/जनसमूह के नाम का निकट लिप्यंतरण।
- source_word: מוֹאָב
  choice: मोआब
  rationale: मूल नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: ‘अम्मोन के पुत्रों’ का स्वाभाविक हिन्दी जातिवाचक रूप।
- source_word: וַיְשַׁלְּחֵם
  choice: उसने उन्हें ... भेजा
  rationale: इब्रानी में दोहराई गई क्रिया को बनाए रखकर कथन की प्रगति और बल सुरक्षित रखा गया है।
- source_word: בִּיהוּדָה
  choice: यहूदा के विरुद्ध
  rationale: शाब्दिक ‘यहूदा में’ संभव है, पर विनाश के सैनिक प्रसंग में विरोधात्मक दिशा अधिक स्वाभाविक है।
- source_word: לְהַאֲבִידוֹ
  choice: ताकि वे उसे नष्ट कर दें
  rationale: हिन्दी सर्वनाम ‘उसे’ मूल के एकवचन पुल्लिंग प्रत्यय को दर्शाता और यहूदा तथा यहोयाकीम के बीच वास्तविक संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: כִּדְבַר יְהוָה
  choice: याहवे के उस वचन के अनुसार
  rationale: भविष्यद्वाणी-संबंधी सूत्र का स्पष्ट, गरिमापूर्ण और मूल के निकट अनुवाद।
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: अपने सेवक नबियों के द्वारा
  rationale: ‘हाथ से’ इब्रानी माध्यम-सूचक मुहावरा है; हिन्दी में ‘के द्वारा’ उसका स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: לְהַאֲבִידוֹ में एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसे’ रखकर संदर्भ को खुला रखा गया है; निकटवर्ती ‘यहूदा’ संभावित प्रमुख संदर्भ है।
  alternative: यह सर्वनाम यहोयाकीम की ओर संकेत कर सकता है।
  rationale: इब्रानी व्याकरण दोनों संदर्भों की अनुमति देता है। व्यापक प्रसंग यहूदा पर न्याय को प्रमुख बनाता है, किंतु यहोयाकीम पिछले सर्वनाम का भी संदर्भ है; इसलिए किसी एक अर्थ को चुपचाप निर्णायक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। जाति और स्थान के मूल नाम सुरक्षित रखे गए हैं। ‘छापामार दल’ सैनिक समूहों के स्वरूप को साधारण पाठक के लिए स्पष्ट करता है, और चारों समूहों में इसकी पुनरावृत्ति इब्रानी वाक्यरचना का बल बनाए रखती है।
