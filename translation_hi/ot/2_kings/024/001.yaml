source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
translation:
  language: hi
  text: उसके दिनों में बाबेल का राजा नबूकदनेस्सर चढ़ आया, और यहोयाकीम तीन वर्ष तक उसके अधीन सेवक बना रहा। फिर वह पलट गया और उसने उसके विरुद्ध विद्रोह कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיָמָיו
  choice: उसके दिनों में
  rationale: हिब्रू के कालसूचक मुहावरे को स्वाभाविक हिन्दी में रखते हुए यह पहले उल्लिखित राजा के शासनकाल को सूचित करता है।
- source_word: עָלָה
  choice: चढ़ आया
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है और यहाँ राजकीय-सैन्य बढ़ाई का संकेत है; ‘चढ़ आया’ इस अर्थ को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: נְבֻכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: राजा के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और पहचानने योग्य रूप।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: हिब्रू संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: उसके अधीन सेवक बना रहा
  rationale: रचना किसी प्रभुता के अधीन आने और एक अवधि तक उस स्थिति में रहने को दर्शाती है। ‘अधीन’ राजनीतिक आशय स्पष्ट करता है, जबकि ‘सेवक’ मूल संज्ञा को बनाए रखता है।
- source_word: עֶבֶד
  choice: सेवक
  rationale: यहाँ शब्द व्यक्तिगत घरेलू सेवा के बजाय एक राजा की दूसरे अधिपति के प्रति राजनीतिक अधीनता बताता है; इसलिए ‘अधीन सेवक’ संदर्भानुकूल है और ‘सामंत’ जैसी बाद की ऐतिहासिक शब्दावली से बचता है।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: अवधि को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּשָׁב
  choice: फिर वह पलट गया
  rationale: שׁוב के ‘मुड़ने/पलटने’ के मूल अर्थ को सुरक्षित रखता है और निष्ठा बदलने का संकेत देता है, बिना उसे केवल अगली क्रिया में मिला देने के।
- source_word: וַיִּמְרָד בּוֹ
  choice: उसने उसके विरुद्ध विद्रोह कर दिया
  rationale: מרד के साथ ב किसी उच्चाधिकारी के विरुद्ध बगावत को दर्शाता है; यह हिन्दी में स्पष्ट और संदर्भानुकूल है।
