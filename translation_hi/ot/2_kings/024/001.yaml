translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। राजनीतिक अधीनता स्पष्ट करने के लिए ‘अधीन सेवक’ रखा गया है, और हिब्रू की क्रमिक क्रियाओं—पलटना और विद्रोह करना—दोनों को अलग-अलग सुरक्षित रखा गया है।
