source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
translation:
  language: hi
  text: क्योंकि याहवे के क्रोध के कारण यरूशलेम और यहूदा में ऐसा हुआ, जब तक कि उसने उन्हें अपने सामने से निकाल न दिया[a]। और सिदकिय्याह ने बाबेल के राजा के विरुद्ध विद्रोह किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि याहवे का क्रोध यरूशलेम और यहूदा के विरुद्ध था, जब तक कि उसने उन्हें अपने सामने से निकाल न दिया।” पहले उपवाक्य का इब्रानी वाक्य-विन्यास संक्षिप्त है और इसका यह अधिक शाब्दिक अनुवाद भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले प्रसंग में कही गई बात का कारण बताता है; हिन्दी में ‘क्योंकि’ व्याख्यात्मक और कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אַף יְהוָה
  choice: याहवे के क्रोध के कारण
  rationale: עַל אַף कारणसूचक मुहावरा है और यहाँ परमेश्वर के क्रोध को दर्शाता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: הָיְתָה בִירוּשָׁלִַם וּבִיהוּדָה
  choice: यरूशलेम और यहूदा में ऐसा हुआ
  rationale: स्त्रीलिंग एकवचन क्रिया का स्पष्ट कर्ता नहीं है और इब्रानी वाक्य संक्षिप्त है। ‘ऐसा हुआ’ उसकी अनिर्दिष्टता बनाए रखते हुए सहज हिन्दी देता है।
- source_word: עַד הִשְׁלִכוֹ אֹתָם
  choice: जब तक कि उसने उन्हें ... निकाल न दिया
  rationale: עַד के बाद क्रियार्थक रूप उस स्थिति की अंतिम सीमा बताता है; हिन्दी की ‘जब तक कि ... न दिया’ रचना इसे स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מֵעַל פָּנָיו
  choice: अपने सामने से
  rationale: यह मूल देहात्मक मुहावरे के निकट है और परमेश्वर की उपस्थिति से निष्कासन का आशय भी संप्रेषित करता है।
- source_word: וַיִּמְרֹד צִדְקִיָּהוּ
  choice: और सिदकिय्याह ने ... विद्रोह किया
  rationale: מרד राजनीतिक सत्ता के विरुद्ध विद्रोह करने को दर्शाता है; आरंभिक ו को कथात्मक संबंध बनाए रखने के लिए ‘और’ कहा गया है।
- source_word: בְּמֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के विरुद्ध
  rationale: מרד के साथ ב विरोधी संबंध व्यक्त करता है; इसलिए हिन्दी में ‘के विरुद्ध’ उपयुक्त है। स्थान-नाम को मूल ‘बाबेल’ के अनुरूप रखा गया है।
theological_decisions:
- issue: पहले उपवाक्य में क्रोध, परिस्थिति और निष्कासन का संबंध
  choice: याहवे का क्रोध कारण है और परिस्थिति उसके द्वारा लोगों को निकाल दिए जाने तक बनी रहती है।
  alternative: याहवे का क्रोध यरूशलेम और यहूदा के विरुद्ध था, जब तक उसने उन्हें अपने सामने से निकाल नहीं दिया।
  rationale: इब्रानी הָיְתָה का स्पष्ट कर्ता नहीं है और वाक्य-विन्यास अत्यंत संक्षिप्त है। मुख्य पाठ अनिर्दिष्ट ‘ऐसा हुआ’ से अस्पष्टता सुरक्षित रखता है, जबकि पादटिप्पणी अधिक औपचारिक संभावित पाठ देती है।
- issue: יְהוָה का रूपांतरण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम YHWH है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संक्षिप्त इब्रानी वाक्य की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित है।
