  text: He did what was evil in the eyes of Yahweh, according to all that Jehoiakim had done.
translation:
  language: hi
  text: उसने वह किया जो याहवे की दृष्टि में बुरा था, वैसा ही जैसा यहोयाकीम ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वाव-क्रमिक के साथ यह क्रिया कथा की अगली कार्रवाई बताती है। हिन्दी में आरम्भिक ‘और’ के बिना वाक्य अधिक स्वाभाविक है।
- source_word: הָרַע
  choice: वह ... जो ... बुरा था
  rationale: עשה הרע एक प्रचलित इब्रानी मुहावरा है जिसका अर्थ ‘जो बुरा है वह करना’ है; यह रूप अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह इब्रानी मुहावरा किसी के मूल्यांकन या परिप्रेक्ष्य को दर्शाता है। ‘की दृष्टि में’ हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह तुलना यहोयाकीम के पूरे आचरण के अनुरूपता दर्शाती है। ‘ठीक वैसे ही जैसे’ हिन्दी में स्वाभाविक ढंग से इस पूर्ण समानता को व्यक्त करता है।
- source_word: עָשָׂה
  choice: ने किया था
  rationale: हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि यहोयाकीम का आचरण वर्तमान कर्ता के आचरण से पहले हुआ था।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: व्यक्तिनाम को आधुनिक हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे प्रयुक्त है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया; ‘याहवे’ ध्वन्यात्मक पुनर्निर्माण का निकटतर वैकल्पिक रूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘की दृष्टि में’ मूल इब्रानी मुहावरे को बनाए रखता है, जबकि ‘ठीक वैसे ही जैसे’ तुलना की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
