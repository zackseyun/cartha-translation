  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
translation:
  language: hi
  text: वह यहोयाकीन को निर्वासित करके बाबेल ले गया। राजा की माता[c], राजा की पत्नियों, उसके दरबारी अधिकारियों[a] और देश के प्रमुख पुरुषों[b] को भी वह यरूशलेम से बाबेल निर्वासन में ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके नपुंसकों’। इब्रानी शब्द विशेष रूप से नपुंसकों के लिए अथवा सामान्य रूप से राजकीय या दरबारी अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘देश के सामर्थी पुरुषों’ अथवा ‘देश के कुलीन पुरुषों’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘राजा की माता’; इसे ‘राजमाता’ भी कहा जा सकता है, पर मुख्य पाठ मूल के पारिवारिक शब्दों को बनाए रखता है।
    reason: lexical_alternative
