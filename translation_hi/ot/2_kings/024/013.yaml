  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘खज़ाना’, ‘राजभवन’, ‘पात्र’ और ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ में [a] और [b] दोनों पाद-टिप्पणी चिह्न सम्मिलित हैं; ‘याहवे के भवन’ और ‘याहवे के मन्दिर’ द्वारा मूल के दो अलग शब्दों का भेद सुरक्षित है।
