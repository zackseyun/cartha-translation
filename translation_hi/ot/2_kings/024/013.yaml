  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
translation:
  language: hi
  text: और वह वहाँ से याहवे के भवन के सारे खज़ाने और राजभवन के खज़ाने निकाल ले गया[a], और उसने सोने के सभी पात्रों को टुकड़े-टुकड़े कर दिया, जिन्हें इस्राएल के राजा सुलैमान ने याहवे के मंदिर[b] में बनाए थे—ठीक वैसे ही जैसे याहवे ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वहाँ से बाहर ले गया’ अथवा ‘वहाँ से ले गया’।
    reason: lexical_alternative
  - marker: b
    text: पद के आरम्भ में ‘याहवे का भवन’ के लिए इब्रानी में एक अलग शब्द है; यहाँ ‘मंदिर’ के लिए आया शब्द अधिक विशेष रूप से मंदिर-भवन या पवित्रस्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  choice: वहाँ से ... निकाल ले गया
  rationale: हिफ़ील रूप किसी स्थान से वस्तुओं को बाहर निकालने का कारणात्मक भाव देता है; लूट के प्रसंग में ‘निकाल ले गया’ निष्कासन और साथ ले जाने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹצְרוֹת
  choice: खज़ाना
  rationale: यहाँ सन्दर्भ भंडार-कक्षों की अपेक्षा उनमें रखी मूल्यवान सम्पत्ति का है; इसलिए ‘खज़ाना’ उपयुक्त है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ בַּיִת का निकट और स्पष्ट अनुवाद है तथा आगे आए הֵיכָל के लिए ‘मन्दिर’ रखकर मूल की शब्दगत भिन्नता बनाए रखता है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: यह राजा के निवास अथवा राजमहल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘भवन’ की छवि भी बनाए रखता है।
- source_word: וַיְקַצֵּץ
  choice: टुकड़े-टुकड़े कर दिया
  rationale: पिअेल रूप काटकर टुकड़े करने की तीव्र भौतिक क्रिया व्यक्त करता है; यह हिन्दी पदबंध अर्थ को स्पष्ट और गरिमापूर्ण ढंग से देता है।
- source_word: כְּלֵי הַזָּהָב
  choice: सोने के ... पात्र
  rationale: मन्दिर के प्रसंग में כְּלִי के लिए ‘पात्र’ व्यापक होने के साथ पारम्परिक और बोधगम्य भी है।
- source_word: עָשָׂה
  choice: बनवाया था
  rationale: राजा सुलैमान के विषय में कारणात्मक हिन्दी ‘बनवाया’ स्वाभाविक है; ‘था’ इस पहले सम्पन्न कार्य को बाद की घटना से स्पष्ट रूप से पूर्व रखता है।
- source_word: בְּהֵיכַל יְהוָה
  choice: याहवे के मन्दिर में
  rationale: इस प्रसंग में הֵיכָל विशेष रूप से मन्दिर अथवा पवित्र भवन को सूचित करता है; ‘मन्दिर’ पहले आए בֵּית से भेद भी बनाए रखता है।
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: ठीक वैसे ही जैसे याहवे ने कहा था
  rationale: यह अनुवाद पूर्व में कहे गए याहवे के वचन की पूर्ति पर मूल के बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यन्तरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उस नाम को नाम के रूप में सुरक्षित रखता है।
- issue: विनाशकारी क्रिया וַיְקַצֵּץ की प्रकृति
  choice: टुकड़े-टुकड़े कर दिया
  alternative: तोड़ दिया; काट डाला
  rationale: पाठ पात्रों को काटकर टुकड़े करने की क्रिया बताता है; इसे केवल लूट लेने या पिघलाने के रूप में व्याख्यायित नहीं किया गया।
