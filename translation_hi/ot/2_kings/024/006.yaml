  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
translation:
  language: hi
  text: यहोयाकीम अपने पूर्वजों के साथ सो गया[a], और उसका पुत्र यहोयाकीन उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट अर्थ में, “मर गया।” इब्रानी में शाब्दिक रूप से “अपने पूर्वजों के साथ सो गया” है, जो किसी राजा की मृत्यु के लिए प्रचलित अभिव्यक्ति थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: सो गया
  rationale: शाब्दिक अर्थ ‘सो गया’ है; ‘अपने पूर्वजों के साथ’ के साथ मिलकर यह राजा की मृत्यु का प्रचलित इब्रानी सूत्र है। इसे बनाए रखने से स्रोत की अभिव्यक्ति सुरक्षित रहती है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: עִם אֲבֹתָיו
  choice: अपने पूर्वजों के साथ
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिता’ हो सकता है, पर इस मृत्यु-सूत्र में ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक और आशय की दृष्टि से अधिक स्पष्ट है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: यहाँ क्रिया राजगद्दी संभालने या राज्यारोहण को सूचित करती है; ‘राज्य किया’ की अपेक्षा ‘राजा बना’ उत्तराधिकार के क्षण को अधिक स्पष्ट करता है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: सीधा पुत्र-संबंध स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के प्रसंग में यह पद पूर्व राजा की जगह लेने का अर्थ देता है।
- source_word: יְהוֹיָקִים / יְהוֹיָכִין
  choice: यहोयाकीम / यहोयाकीन
  rationale: इब्रानी व्यक्तिगत नामों के निकट और हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य लिप्यंतरण चुने गए हैं।
theological_decisions:
- issue: राजकीय मृत्यु-सूत्र का अनुवाद करते समय दफ़नाए जाने का विवरण न जोड़ना
  choice: मुख्य पाठ में ‘अपने पूर्वजों के साथ सो गया’ बनाए रखा गया है।
  alternative: ‘मर गया’ कहना, या ‘मरकर अपने पूर्वजों के साथ दफ़नाया गया’ जोड़ना।
  rationale: इब्रानी पाठ मृत्यु का पारंपरिक सूत्र प्रयोग करता है, पर इस पद में दफ़नाए जाने की बात स्पष्टतः नहीं कहता। स्रोत की अभिव्यक्ति बनाए रखने से अनकहा विवरण नहीं जुड़ता और ऐतिहासिक तनाव भी सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी मृत्यु-सूत्र को मुख्य पाठ में सुरक्षित रखा गया है, पर ‘पितरों’ जैसे अपेक्षाकृत पुराने शब्द के बजाय सामान्य पाठकों के लिए स्वाभाविक ‘पूर्वजों’ का प्रयोग किया गया है।
