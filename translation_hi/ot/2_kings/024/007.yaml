  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
translation:
  language: hi
  text: और मिस्र का राजा फिर अपने देश से बाहर नहीं निकला, क्योंकि बाबेल के राजा ने मिस्र के नाले[a] से लेकर फ़रात नदी तक वह सब ले लिया था जो मिस्र के राजा का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिस्र की वादी।” यहाँ प्रयुक्त इब्रानी शब्द बरसाती जलधारा या उसके सूखे पाट को भी दर्शा सकता है; इसे नील नदी नहीं समझना चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹסִיף עוֹד
  choice: फिर ... नहीं निकला
  rationale: הוסיף + infinitive और עוד, निषेध के साथ, किसी कार्य के आगे न होने को व्यक्त करते हैं। हिंदी में इस भाव को स्वाभाविक रूप से ‘फिर ... नहीं’ से व्यक्त किया गया है।
- source_word: לָצֵאת מֵאַרְצוֹ
  choice: अपने देश से बाहर नहीं निकला
  rationale: יצא का मूल अर्थ ‘निकलना’ है। राजकीय-सैनिक संदर्भ में इससे अभियान पर निकलना सूचित हो सकता है, पर मुख्य पाठ में उस अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי मिस्र के राजा के फिर बाहर न निकलने का कारण प्रस्तुत करता है।
- source_word: לָקַח
  choice: ले लिया था
  rationale: לקח का व्यापक अर्थ ‘लेना’ है। ‘ले लिया था’ पूर्ववर्ती कब्ज़े को दर्शाता है और ‘छीन लिया’ जैसी अधिक व्याख्यात्मक तीव्रता से बचता है।
- source_word: מִנַּחַל מִצְרַיִם
  choice: मिस्र के नाले
  rationale: נחל सामान्यतः नाला, बरसाती जलधारा या वादी को दर्शाता है, बड़ी सदानीरा नदी को नहीं। ‘नाला’ आधुनिक हिंदी के सामान्य पाठक के लिए सहज है; वैकल्पिक भौगोलिक पद फुटनोट में दिया गया है।
- source_word: עַד נְהַר פְּרָת
  choice: फ़रात नदी तक
  rationale: נהר ‘नदी’ और פרת फ़रात नदी का नाम है; यह हिंदी में स्वाभाविक क्रम है।
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרַיִם
  choice: वह सब ... जो मिस्र के राजा का था
  rationale: यह हिब्रू की व्यापक अधिकार-सूचक अभिव्यक्ति को सुरक्षित रखता है। संदर्भ मुख्यतः भूभाग पर नियंत्रण का है, पर अनुवाद इसे केवल ‘प्रदेश’ तक सीमित नहीं करता।
