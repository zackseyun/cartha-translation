  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
translation:
  language: hi
  text: वह पूरे यरूशलेम के लोगों, सभी अधिकारियों, सभी वीर योद्धाओं—कुल दस हज़ार निर्वासितों—तथा सभी कारीगरों और धातु-कारीगरों[a] को निर्वासन में ले गया। देश की प्रजा के गरीब लोगों को छोड़कर कोई नहीं बचा।
  philosophy: optimal-equivalence
