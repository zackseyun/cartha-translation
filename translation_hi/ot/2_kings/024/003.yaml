source:
  edition: WLC
  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
translation:
  language: hi
  text: निश्चय ही, यह यहोवा की आज्ञा से यहूदा पर आया, ताकि वह मनश्शे के पापों के कारण—उसके किए हुए सब कर्मों के अनुसार—उन्हें अपने सामने से दूर कर दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ अव्यय प्रतिबंध नहीं, बल्कि कथन पर बल देता है; ‘निश्चय ही’ प्रसंग के व्याख्यात्मक और emphatic भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַל־פִּי יְהוָה
  choice: यहोवा की आज्ञा से
  rationale: शाब्दिक मुहावरा ‘यहोवा के मुँह के अनुसार’ किसी के वचन या आदेश के अनुसार होने का अर्थ देता है। यह चयन दैवी आदेश और कर्तृत्व दोनों को स्पष्ट रखता है।
- source_word: הָיְתָה בִּיהוּדָה
  choice: यह यहूदा पर आया
  rationale: इब्रानी वाक्यांश संक्षिप्त और कर्ता की दृष्टि से अप्रकट है; प्रसंग में संकेत पहले वर्णित न्याय की ओर है। हिंदी में ‘यह ... पर आया’ उस संकेत को सहज रूप देता है।
- source_word: לְהָסִיר
  choice: दूर कर दे
  rationale: סור के हिफ़ईल रूप का कारणवाचक अर्थ ‘हटा देना/दूर कर देना’ है; यहाँ निष्कासन के लिए ‘दूर कर दे’ स्वाभाविक है।
- source_word: מֵעַל פָּנָיו
  choice: अपने सामने से
  rationale: यह चयन इब्रानी के ठोस ‘उसके मुख के सामने से’ वाले बिंब को सहज हिंदी में बनाए रखता है; अधिक अमूर्त विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  choice: मनश्शे के पापों के कारण
  rationale: בְּ यहाँ कारण प्रकट करता है, और חַטֹּאת मनश्शे के अपराधों को सामूहिक/बहुवचन अर्थ में दर्शाता है।
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: उसके किए हुए सभी कामों के अनुसार
  rationale: כְּכֹל अनुरूपता या माप का भाव रखता है; ‘के अनुसार’ न्याय और मनश्शे के समस्त कर्मों के बीच उस संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: न्याय के संक्षिप्त वाक्य में अप्रकट कर्ता और कर्म
  choice: ‘यह’ को पहले वर्णित न्याय का संकेत माना गया और ‘उन्हें’ से यहूदा के लोगों को अप्रकट कर्म के रूप में व्यक्त किया गया।
  alternative: 'वाक्य को अधिक शाब्दिक और अपूर्ण रूप में रखा जा सकता है: ‘यह यहूदा में हुआ ... सामने से दूर करने के लिए।’'
  rationale: इब्रानी में न्याय की घटना और ‘दूर करने’ का कर्म संदर्भ से समझे जाते हैं। हिंदी में पठनीयता के लिए इन्हें व्यक्त करना आवश्यक है, पर अनुवाद यह दावा नहीं करता कि मूल में स्पष्ट संज्ञाएँ उपस्थित हैं।
- issue: परमेश्वर की उपस्थिति का मानवीय बिंब
  choice: मुख्य पाठ में ‘अपने सामने से’ रखा गया।
  alternative: ‘अपनी उपस्थिति से’
  rationale: यह इब्रानी के ‘मुख/चेहरे के सामने से’ वाले ठोस बिंब और परमेश्वर के सम्मुख से निष्कासन के धर्मवैचारिक भार को सुरक्षित रखता है, जबकि सहज विकल्प पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘यहोवा’ से चार-अक्षरीय दिव्य नाम को नाम के रूप में रखा गया है। मूल की संक्षिप्तता के कारण ‘यह’ और ‘उन्हें’ संदर्भ से स्पष्ट किए गए हैं; पादटिप्पणी मुख्य पाठ के ठोस बिंब का सहज वैकल्पिक रूप देती है।
