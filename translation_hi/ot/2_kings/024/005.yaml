base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/005.yaml
  text: The rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: यहोयाकीम के बाकी काम और जो कुछ उसने किया, क्या वे ‘यहूदा के राजाओं के इतिहास-वृत्तांत की पुस्तक’[a] में लिखे हुए नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजाओं के वर्ष-वृत्तांत।” हिब्रू शीर्षक उस राजकीय अभिलेख-स्रोत को सूचित करता है जिसका उल्लेख राजाओं की पुस्तक में बार-बार हुआ है; यह आवश्यक नहीं कि वह बाइबिल की इतिहास-वृत्तांत पुस्तकों में से कोई पुस्तक हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  choice: बाकी काम
  rationale: राजकीय सारांश के इस प्रचलित सूत्र में यह पद राजा के शेष दर्ज कार्यों या वृत्तांतों को सूचित करता है; ‘बाकी काम’ सहज और अर्थानुकूल है।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह अनुवाद मूल के व्यापक अर्थ को बनाए रखता है और उसके कार्यों के स्वरूप के बारे में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: मूल के आलंकारिक प्रश्न को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כְּתוּבִים
  choice: लिखा है
  rationale: हिब्रू के कर्मवाच्य कृदंत का निकट और स्पष्ट अनुवाद; ‘वह सब’ के साथ हिन्दी में एकवचन स्वाभाविक है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से ‘पुस्तक/लपेटे हुए ग्रंथ पर’ है, पर लिखित अभिलेख में सामग्री होने के लिए हिन्दी में ‘पुस्तक में’ स्वाभाविक है।
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: ‘यहूदा के राजाओं के इतिहास की पुस्तक’
  rationale: यह राजकीय अभिलेख-स्रोत के शीर्षक को सहज हिन्दी में व्यक्त करता है। उद्धरण-चिह्न इसे उद्धृत स्रोत का नाम दिखाते हैं; पादटिप्पणी स्पष्ट करती है कि यह अनिवार्यतः बाइबिल की इतिहास-वृत्तांत नामक पुस्तक नहीं है।
theological_decisions:
- issue: उद्धृत राजकीय स्रोत की पहचान
  choice: इसे ‘यहूदा के राजाओं के इतिहास की पुस्तक’ नामक अभिलेख-स्रोत के रूप में प्रस्तुत किया गया है।
  alternative: इसे बाइबिल की इतिहास-वृत्तांत की पुस्तक के साथ समान मानना।
  rationale: हिब्रू पदबंध राजाओं में बार-बार उद्धृत राजकीय लेखे को सूचित करता है; पाठ स्वयं इसे प्रामाणिक इतिहास-वृत्तांत की पुस्तक के साथ स्पष्ट रूप से एक नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल में अलग से कोई कालसूचक ‘अब’ नहीं है, इसलिए ऐसा कोई आरंभिक शब्द नहीं जोड़ा गया। आलंकारिक प्रश्न और स्रोत-संबंधी ऐतिहासिक अस्पष्टता सुरक्षित रखी गई है।
