  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण राजकीय-वृत्तांत शैली अपनाई गई है। ‘लिब्ना के रहनेवाले यिर्मयाह’ से मूल इब्रानी पदक्रम का संभावित संबंध स्पष्ट किया गया है और अनावश्यक सांप्रदायिक व्याख्या से बचा गया है।
