  text: בֶּן עֶשְׂרִ֨ים וְ/אַחַ֤ת שָׁנָה֙ צִדְקִיָּ֣הוּ בְ/מָלְכ֔/וֹ וְ/אַחַ֤ת עֶשְׂרֵה֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֣ם אִמּ֔/וֹ חמיטל בַּֽת יִרְמְיָ֖הוּ מִ/לִּבְנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/018.yaml
  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
translation:
  language: hi
  text: सिदकिय्याह इक्कीस वर्ष का था जब वह राजा बना, और उसने यरूशलेम में ग्यारह वर्ष राज्य किया। उसकी माता का नाम हमूतल[a] था; वह लिब्ना के रहनेवाले यिर्मयाह की बेटी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम को कुछ लिप्यंतरणों में “हमीतल” भी लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְאַחַת שָׁנָה
  choice: इक्कीस वर्ष का था
  rationale: उम्र बताने वाले इब्रानी मुहावरे का स्वाभाविक और सटीक आधुनिक हिन्दी रूप।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: בְ के साथ infinitive construct यहाँ राजगद्दी संभालने का समय बताता है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: राजा के रूप में शासन करने के अर्थ को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानसूचक בְ का सीधा अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: राजकीय विवरण के सूत्र को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है।
- source_word: חמיטל
  choice: हमूतल
  rationale: व्यक्तिनाम का स्रोत-आधारित लिप्यंतरण; स्वरांकन के अनुसार ‘हमूतल’।
- source_word: בַּת יִרְמְיָהוּ
  choice: यिर्मयाह की बेटी
  rationale: वंश-संबंध बताने वाली सामान्य इब्रानी अभिव्यक्ति।
- source_word: מִלִּבְנָה
  choice: लिब्ना के रहनेवाले
  rationale: מִן उद्गम अथवा निवास-स्थान सूचित करता है; वाक्य-विन्यास में यह यिर्मयाह से सबसे स्वाभाविक रूप से जुड़ता है।
