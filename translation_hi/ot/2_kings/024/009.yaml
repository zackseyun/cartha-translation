translation:
  language: hi
  text: उसने यहोवा की दृष्टि में बुरा किया, ठीक वैसा ही जैसा उसके पिता ने किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने...किया
  rationale: עשה का क़ाल वय्यिक्तोल कथा को आगे बढ़ाता है और यहाँ सामान्य भूतकाल व्यक्त करता है। हिन्दी में पद के आरम्भ का וַ स्वाभाविक कथा-क्रम से प्रकट होता है; अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: הָרַע
  choice: वही...जो...बुरा था
  rationale: निश्चित लेख सहित विशेषण यहाँ संज्ञा के समान प्रयुक्त है। ‘जो...बुरा था’ हिन्दी में इस रूढ़ इब्रानी अभिव्यक्ति का स्वाभाविक रूप है; ‘वही’ आगे आने वाली पिता से तुलना के व्यापक बल को जोड़ता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: शाब्दिक अर्थ ‘की आँखों में’ है, पर यह किसी के मूल्यांकन या दृष्टिकोण को बताने वाला मुहावरा है। ‘की दृष्टि में’ आधुनिक हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसा ही जैसा
  rationale: כְּ और כֹּל मिलकर पिता के किए हुए समस्त कामों से पूर्ण तुलना व्यक्त करते हैं। ‘ठीक वैसा ही जैसा’ हिन्दी में इस व्यापक तुलनात्मक बल को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: עָשָׂה
  choice: किया था
  rationale: क़ातल रूप पुत्र के शासन से पहले पिता के किए कार्यों को सूचित करता है; ‘किया था’ इस पूर्वकालिक संबंध को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: यह संज्ञा के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी बाइबल-परंपरा में ‘यहोवा’ साधारण पाठकों के लिए अधिक पहचाना हुआ नामरूप है, यद्यपि ‘याहवे’ संभावित प्राचीन उच्चारण के अधिक निकट माना जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजाओं की पुस्तक के मूल्यांकन-सूत्र की गंभीरता बनाए रखते हुए इब्रानी मुहावरे को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
