source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: hi
  text: 'याहवे[a] ने उनके साथ वाचा बाँधी और उन्हें यह आज्ञा दी: “तुम दूसरे देवताओं का भय न मानना[b]; न उनके आगे दण्डवत् करना, न उनकी सेवा करना और न उन्हें बलि चढ़ाना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: याहवे परमेश्वर के उस व्यक्तिगत नाम का लिप्यंतरण है जिसे इब्रानी में चार अक्षरों יהוה से लिखा जाता है।
    reason: पाठक को शीर्षक के स्थान पर प्रयुक्त ईश्वरीय नाम की पहचान कराना।
  - marker: b
    text: “भय मानना” का अर्थ यहाँ डरना हो सकता है, पर इस धार्मिक संदर्भ में इसमें श्रद्धापूर्वक मानना या अधीन होना भी शामिल हो सकता है।
    reason: मूल क्रिया की वास्तविक अर्थ-व्याप्ति और धार्मिक तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: वाचा बाँधी
  rationale: यह इब्रानी मुहावरा वाचा स्थापित करने का अर्थ देता है। ‘वाचा बाँधना’ हिन्दी में स्वाभाविक है और मूल क्रिया के ठोस रूपक को भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचाई नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיְצַוֵּם לֵאמֹר
  choice: उन्हें यह आज्ञा दी
  rationale: यह हिन्दी में प्रत्यक्ष वचन का स्वाभाविक परिचय है और आज्ञा की स्पष्टता बनाए रखता है।
- source_word: לֹא תִירְאוּ
  choice: तुम ... का भय न मानना
  rationale: यह वाचाई निषेध की गंभीरता रखता है और ‘भय’ को केवल ‘पूजा’ में नहीं समेटता, क्योंकि आगे पूजा से जुड़े अलग-अलग कार्य गिनाए गए हैं।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: अर्थ सीधे ‘अन्य/दूसरे देवता’ है; ‘विदेशी’ जोड़ना आवश्यक नहीं।
- source_word: תִשְׁתַּחֲווּ
  choice: दण्डवत् करना
  rationale: यह झुककर प्रणाम करने की ठोस शारीरिक क्रिया व्यक्त करता है और इसे सामान्य ‘पूजा’ में विलीन नहीं करता।
- source_word: תַעַבְדוּם
  choice: उनकी सेवा करना
  rationale: धार्मिक संदर्भ में क्रिया सेवा और उपासना का भाव रख सकती है; ‘सेवा’ मूल शब्द का विशिष्ट अर्थ बनाए रखती है।
- source_word: תִזְבְּחוּ לָהֶם
  choice: उन्हें बलि चढ़ाना
  rationale: यह किसी देवता के लिए बलि अर्पित करने का स्वाभाविक और सटीक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: वाचाई निषेधों का बल
  choice: तुम ... न मानना / न ... करना
  alternative: तुम ... नहीं करोगे / मत करो
  rationale: नकारात्मक आज्ञार्थक रचना आधुनिक हिन्दी में स्पष्ट है और इसे केवल भविष्यवाणी की तरह सुनाई दिए बिना गंभीर वाचाई आदेश के रूप में प्रस्तुत करती है।
- issue: תִירְאוּ में भय और धार्मिक श्रद्धा का संबंध
  choice: भय मानना
  alternative: डरना / पूजा करना
  rationale: ‘भय मानना’ मूल के भय-संबंधी अर्थ को रखता है, जबकि धार्मिक संदर्भ में निहित श्रद्धापूर्ण अधीनता की संभावना को भी बंद नहीं करता। ‘पूजा करना’ चुनने से अगले अलग-अलग पूजा-कर्मों के साथ भेद मिट जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वाचा’, ‘दण्डवत्’ और ‘बलि चढ़ाना’ बाइबिलीय संदर्भ में परिचित हैं, फिर भी सामान्य हिन्दी पाठक के लिए समझने योग्य हैं। समानांतर निषेधों में ‘न’ की पुनरावृत्ति मूल की लय और प्रत्येक निषिद्ध कर्म की पृथकता बनाए रखती है।
