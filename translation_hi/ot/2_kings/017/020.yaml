source:
  edition: WLC
  text: וַ/יִּמְאַ֨ס יְהוָ֜ה בְּ/כָל זֶ֤רַע יִשְׂרָאֵל֙ וַ/יְעַנֵּ֔/ם וַֽ/יִּתְּנֵ֖/ם בְּ/יַד שֹׁסִ֑ים עַ֛ד אֲשֶׁ֥ר הִשְׁלִיכָ֖/ם מִ/פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
translation:
  language: hi
  text: यहोवा ने इस्राएल की सारी संतति[a] को ठुकरा दिया, उन्हें पीड़ित किया, और उन्हें लुटेरों के हाथ में सौंप दिया[b], यहाँ तक कि उन्हें अपने सामने से निकाल फेंका[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के सारे वंशज”; इब्रानी में “इस्राएल का सारा बीज।”
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें लुटेरों के हाथ में दे दिया।”
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: “उसके सामने से”; अर्थात, उसकी उपस्थिति से दूर।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: ठुकरा दिया
  rationale: यह מָאַס के निर्णायक अस्वीकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, पर ‘घृणा की’ जैसी अतिरिक्त भावनात्मक तीव्रता नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  choice: इस्राएल के सारे वंश
  rationale: זֶרַע सामूहिक अर्थ में संतति या वंश को दर्शाता है। ‘सारे वंश’ हिन्दी में सहज है और इसके व्यापक दायरे को संदर्भ से अधिक संकीर्ण नहीं करता।
- source_word: וַיְעַנֵּם
  choice: उसने उन्हें दुःख दिया
  rationale: पिएल रूप यहाँ पीड़ित या क्लेशित करने का भाव देता है। यह अनुवाद सामाजिक उत्पीड़न या नम्र किए जाने में से किसी एक अर्थ तक अनावश्यक रूप से सीमित नहीं करता।
- source_word: וַיִּתְּנֵם בְּיַד
  choice: लुटेरों के हाथ में सौंप दिया
  rationale: यह मुहावरा किसी दूसरे के अधिकार में कर देने का अर्थ रखता है। ‘हाथ में सौंप दिया’ हिन्दी में अर्थपूर्ण रहते हुए हिब्रू बिंब भी बनाए रखता है।
- source_word: שֹׁסִים
  choice: लुटेरों
  rationale: यह शब्द लूटने और माल छीनने वालों को दर्शाता है; ‘लुटेरे’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עַד אֲשֶׁר
  choice: जब तक कि
  rationale: यह पहले के न्यायकारी कार्यों की अंतिम सीमा या परिणति प्रस्तुत करता है।
- source_word: הִשְׁלִיכָם
  choice: दूर न कर दिया
  rationale: השליך का मूल अर्थ फेंकना है; इस प्रसंग में किसी को अपनी उपस्थिति से निकाल देने का भाव है। ‘दूर कर दिया’ हिन्दी में स्वाभाविक है और अगले पदांश के साथ मिलकर निष्कासन स्पष्ट करता है।
- source_word: מִפָּנָיו
  choice: अपने सामने से
  rationale: यह मूल के ‘उसके मुख/सामने से’ वाले ठोस मुहावरे को बनाए रखता है; आशय उसकी उपस्थिति से हटाया जाना है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में व्यक्तिगत दिव्य नाम सीधे आया है; उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है।
- issue: ‘इस्राएल के सारे वंश’ का दायरा
  choice: व्यापक मूल शब्दावली को बनाए रखना
  alternative: इसे स्पष्ट रूप से केवल उत्तरी राज्य या प्रत्येक जैविक इस्राएली तक सीमित करना
  rationale: ऐतिहासिक संदर्भ उत्तरी राज्य से जुड़ा है, फिर भी हिब्रू की व्यापक अभिव्यक्ति का दायरा अनुवाद में संकीर्ण या निरपेक्ष नहीं किया गया।
- issue: मִפָּנָיו का संबंधपरक और न्यायिक भाव
  choice: अपने सामने से
  alternative: अपनी उपस्थिति से
  rationale: मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है, जबकि पादटिप्पणी उसका स्वाभाविक अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। छोटे वाक्यों से न्याय के क्रम को स्पष्ट किया गया है। ‘वंश’ सामूहिक संतति का अर्थ देता है और ‘हाथ में सौंप दिया’ हिब्रू मुहावरे को हिन्दी में स्वाभाविक रूप से सुरक्षित रखता है।
