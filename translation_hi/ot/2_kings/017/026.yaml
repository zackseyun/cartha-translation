base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
translation:
  language: hi
  text: तब उन्होंने अश्शूर के राजा से कहा, “जिन जातियों को आपने निर्वासित करके सामरिया के नगरों में बसाया है, वे उस देश के देवता[a] की उपासना-विधि[b] नहीं जानतीं। इसलिए उसने उनके बीच सिंह भेजे हैं, और देखिए, वे उन्हें मार रहे हैं, क्योंकि वे उस देश के देवता की उपासना-विधि नहीं जानतीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस देश के परमेश्वर।” इब्रानी पद इस्राएल के परमेश्वर की ओर संकेत कर सकता है, लेकिन मुख्य पाठ में “देवता” वक्ताओं की उस धारणा को सुरक्षित रखता है जिसमें वे उसे उस भूभाग का स्थानीय देवता समझते थे।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का अनुवाद “नियम,” “विधान” या “रीति” भी हो सकता है। यहाँ आशय उस देश के देवता की अपेक्षित उपासना-पद्धति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: यहाँ अश्शूर द्वारा स्थानांतरित किए गए अनेक जातीय समुदाय अभिप्रेत हैं; ‘जातियाँ’ आधुनिक हिन्दी में इस सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִגְלִיתָ
  choice: आपने निर्वासित किया
  rationale: हिफ़ील रूप जबरन अपने देश से हटाए जाने का भाव देता है; ‘निर्वासित’ उस बाध्यकारी अर्थ को स्पष्ट रखता है।
- source_word: וַתּוֹשֶׁב
  choice: बसाया
  rationale: क्रिया का कारक अर्थ है कि राजा ने उन लोगों को नए स्थान पर रहने के लिए बसाया।
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: सामरिया के नगरों में
  rationale: रचना को सीधे रखते हुए सामरिया के क्षेत्र के नगरों का बहुवचन सुरक्षित रहता है।
- source_word: מִשְׁפַּט
  choice: उपासना-विधि
  rationale: इस प्रसंग में शब्द न्यायिक निर्णय से अधिक स्थानीय देवता की अपेक्षित धार्मिक रीति या निर्धारित सेवा-पद्धति को सूचित करता है। ‘उपासना-विधि’ हिन्दी पाठक के लिए इस प्रसंगगत अर्थ को स्पष्ट करता है, जबकि व्यापक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: उस देश के देवता
  rationale: वक्ताओं की क्षेत्रीय-बहुदेववादी दृष्टि को बनाए रखने के लिए ‘देवता’ चुना गया है; कथानक में संकेत इस्राएल के परमेश्वर की ओर है, पर उद्धृत वाणी का दृष्टिकोण नहीं बदला गया।
- source_word: וַיְשַׁלַּח בָּם אֶת הָאֲרָיוֹת
  choice: इसलिए उसने उनके बीच सिंह भेजे हैं
  rationale: בם को ‘उनके बीच’ और प्रसंग के कारण-परिणाम संबंध को ‘इसलिए’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְהִנָּם
  choice: और देखिए
  rationale: हिन्नֵה का ध्यान आकर्षित करने वाला जीवंत बल आधुनिक, आदरपूर्ण हिन्दी में ‘देखिए’ से प्रकट होता है।
- source_word: מְמִיתִים אוֹתָם
  choice: वे उन्हें मार रहे हैं
  rationale: कृदंत चल रही क्रिया दर्शाता है; ‘मार रहे हैं’ उसका प्रगतिशील और जीवंत भाव बनाए रखता है।
- source_word: כַּאֲשֶׁר אֵינָם יֹדְעִים
  choice: क्योंकि वे ... नहीं जानतीं
  rationale: यहाँ वाक्यांश कारण देता है; ‘क्योंकि’ हिन्दी में उस संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ को ‘परमेश्वर’ या ‘देवता’ कहना
  choice: मुख्य पाठ में ‘उस देश के देवता’
  alternative: ‘उस देश के परमेश्वर’
  rationale: यह कथन स्थानांतरित लोगों की उस धारणा को प्रस्तुत करता है जिसमें किसी देवता को एक भूभाग से जोड़ा जाता था। ‘देवता’ उनकी दृष्टि को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि कथानक में अभिप्रेत सत्ता इस्राएल का परमेश्वर हो सकती है।
- issue: מִשְׁפַּט का धार्मिक अर्थ
  choice: ‘उपासना-विधि’
  alternative: ‘नियम’, ‘विधान’ या ‘रीति’
  rationale: प्रसंग किसी सामान्य दीवानी कानून के बजाय उस देश के देवता की अपेक्षित पूजा-पद्धति से संबंधित है। अनुवाद अर्थ स्पष्ट करता है, और पादटिप्पणी शब्द की व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। राजा को संबोधन में आदरसूचक ‘आप’ और ध्यानसूचक ‘देखिए’ रखा गया है। ‘जातियाँ’ स्त्रीलिंग बहुवचन होने के कारण ‘जानतीं’ प्रयुक्त है।
