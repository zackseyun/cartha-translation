  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
translation:
  language: hi
  text: परन्तु याहवे[a], जो तुम्हें बड़े सामर्थ्य और फैलाई हुई भुजा से मिस्र देश से निकाल लाया—उसी का भय मानना, उसी के आगे दण्डवत् करना, और उसी को बलिदान चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: आरम्भिक इब्रानी वाक्यांश का अनुवाद ‘बल्कि याहवे ... उसी का भय मानना’ भी हो सकता है। यह पिछले सन्दर्भ में दूसरे देवताओं के विपरीत याहवे को रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु
  rationale: 'यह पद पिछले निषेधों के विपरीत सकारात्मक विकल्प रखता है: दूसरे देवताओं का नहीं, बल्कि याहवे का भय मानना। ‘परन्तु’ इस विरोधात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का निज नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में सुरक्षित रखा गया है।
- source_word: הֶעֱלָה ... מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से निकाल लाया
  rationale: क्रिया का मूल चित्र ‘ऊपर ले आना’ है, किन्तु निर्गमन के प्रसंग में ‘से निकाल लाना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा उद्धार की गति को व्यक्त करता है।
- source_word: בְּכֹחַ גָּדוֹל
  choice: बड़े सामर्थ्य से
  rationale: करणवाचक בְּ और ‘महान शक्ति’ का अर्थ संक्षिप्त, प्रतिष्ठित हिन्दी में सुरक्षित है।
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: और बढ़ाई हुई भुजा से
  rationale: निर्गमन से जुड़ी मूर्तिमान इब्रानी अभिव्यक्ति को ‘भुजा’ सहित रखा गया है; यह परमेश्वर के प्रकट सामर्थ्य का बिम्ब है।
- source_word: אֹתוֹ תִירָאוּ
  choice: उसी का भय मानना
  rationale: आरम्भ में रखे कर्म से आने वाला विशेष बल ‘उसी’ द्वारा सुरक्षित है। ‘भय मानना’ श्रद्धामय भय को बनाए रखता है और उसे केवल आतंक या सामान्य आदर में सीमित नहीं करता।
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  choice: उसी के आगे दण्डवत् करना
  rationale: क्रिया का शारीरिक अर्थ झुकने अथवा भूमि पर गिरकर प्रणाम करने का है। ‘दण्डवत् करना’ उपासना की उस मूर्त क्रिया को सामान्य ‘आराधना’ से अधिक स्पष्ट रखता है।
- source_word: וְלוֹ תִזְבָּחוּ
  choice: उसी को बलिदान चढ़ाना
  rationale: זבח का बलिदान करने का अर्थ और बार-बार आने वाले לוֹ का लक्ष्यगत जोर, दोनों स्वाभाविक हिन्दी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम प्रत्यक्ष है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी साम्प्रदायिक विशिष्टता को आरोपित किए बिना प्रस्तुत करता है।
- issue: उपासना के सन्दर्भ में ירא का आशय
  choice: भय मानना
  alternative: श्रद्धा रखना; आराधना करना
  rationale: यहाँ भय में श्रद्धा और वाचा-निष्ठा सम्मिलित हैं, फिर भी मूल की धार्मिक गहनता और तनाव को बनाए रखने के लिए मुख्य पाठ में ‘भय’ रखा गया है; टिप्पणी उसका आशय स्पष्ट करती है।
- issue: दूसरे देवताओं के विपरीत केवल याहवे पर जोर
  choice: उसी ... उसी ... उसी
  alternative: उसका ... उसके ... उसको
  rationale: इब्रानी में प्रत्येक आज्ञा के साथ याहवे की ओर संकेत पर जोर है। ‘उसी’ उस अनन्य उपासना को स्पष्ट करता है, बिना पाठ से आगे कोई व्यवस्थित धर्मसिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘दण्डवत्’ और ‘बलिदान’ जैसे परिचित बाइबलीय-धार्मिक शब्द मूल की उपासना-संबंधी मूर्तता बनाए रखते हैं। आज्ञाओं के लिए ‘मानना/करना/चढ़ाना’ वाला रूप सामूहिक निर्देश के रूप में स्वाभाविक है।
