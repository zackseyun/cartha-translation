source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
translation:
  language: hi
  text: इस्राएलियों ने अपने परमेश्वर याहवे के विरुद्ध चुपके से ऐसे काम किए जो ठीक नहीं थे[a]। उन्होंने अपने सभी नगरों में अपने लिए ऊँचे पूजा-स्थल[b] बनाए—पहरे की मीनार से लेकर किलेबंद नगर तक[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “इस्राएलियों ने अपने परमेश्वर याहवे के विषय में ऐसी बातें छिपाईं जो ठीक नहीं थीं।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसमें छिपाने या गुप्त रूप से काम करने—दोनों में से कोई भाव हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “ऊँचे पूजा-स्थल” स्थानीय उपासना-स्थल थे, जो प्रायः उस उपासना से जुड़े थे जिसे याहवे ने अधिकृत नहीं किया था।
    reason: cultural_note
  - marker: c
    text: “पहरे की मीनार से लेकर किलेबंद नगर तक” का अर्थ है कि ये स्थान छोटे बाहरी ठिकानों से बड़े सुरक्षित नगरों तक, पूरे देश में फैले हुए थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  choice: चुपके से ... काम किए
  rationale: यह दुर्लभ क्रिया छिपाने या गुप्त रूप से करने का भाव दे सकती है। प्रसंग में ठोस अनुचित धार्मिक कार्यों का वर्णन है, इसलिए यह चयन स्वाभाविक हिन्दी में गोपनीयता और क्रिया—दोनों को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  choice: ऐसे काम ... जो ठीक नहीं थे
  rationale: शाब्दिक रूप से ‘ऐसी बातें/वस्तुएँ जो ऐसी नहीं थीं’ हिन्दी में अस्पष्ट होगा। यह मुहावरेदार अनुवाद मूल के नैतिक मूल्यांकन को बनाए रखता है, पर अपराधों का स्वरूप आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  choice: अपने परमेश्वर याहवे के विरुद्ध
  rationale: धर्मत्याग और अवैध उपासना के इस प्रसंग में עַל का विरोधात्मक अर्थ ‘के विरुद्ध’ सबसे उपयुक्त है; फिर भी दुर्लभ आरंभिक क्रिया के कारण ‘के विषय में’ की संभावना पादटिप्पणी में बताई गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी रूप में रखा गया है।
- source_word: וַיִּבְנוּ לָהֶם בָּמוֹת
  choice: अपने लिए ऊँचे पूजा-स्थल बनाए
  rationale: ‘अपने लिए’ לָהֶם को सुरक्षित रखता है। ‘ऊँचे पूजा-स्थल’ בָּמוֹת के स्थान और धार्मिक कार्य दोनों को साधारण हिन्दी पाठक के लिए स्पष्ट करता है, बिना उसे किसी अधिक विशिष्ट प्रकार के मंदिर के रूप में सीमित किए।
- source_word: בְּכָל עָרֵיהֶם
  choice: अपने सभी नगरों में
  rationale: यह स्थानवाचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: מִמִּגְדַּל נוֹצְרִים
  choice: पहरे की मीनार से
  rationale: נוֹצְרִים में देखने या पहरा देने का भाव है। ‘पहरे की मीनार’ छोटे बाहरी ठिकाने की छवि को स्पष्ट रूप से व्यक्त करता है।
- source_word: עַד עִיר מִבְצָר
  choice: किलेबंद नगर तक
  rationale: यह छोटे पहरे के ठिकाने से सुरक्षित नगर तक फैले युग्म को पूरा करता है और עִיר מִבְצָר का संक्षिप्त, स्वाभाविक समतुल्य है।
theological_decisions:
- issue: इस्राएल के छिपे हुए कार्यों का नैतिक और वाचा-संबंधी बल
  choice: इसे याहवे के विरुद्ध गुप्त रूप से किए गए अनुचित ठोस कार्यों के रूप में प्रस्तुत किया गया है।
  alternative: इसे याहवे के विषय में अनुचित बातें छिपाने या कहने के अर्थ में भी समझा जा सकता है।
  rationale: दुर्लभ क्रिया, उसके साथ आए ‘काम/बातें’ और आगे ऊँचे पूजा-स्थल बनाने का उल्लेख मिलकर गुप्त तथा अनुचित उपासना-कर्मों की ओर संकेत करते हैं। अनुवाद इस प्रमुख अर्थ को अपनाता है, पर दुर्लभ क्रिया की वास्तविक अस्पष्टता को पादटिप्पणी में बनाए रखता है।
- issue: בָּמוֹת की धार्मिक पहचान
  choice: ‘ऊँचे पूजा-स्थल’ के रूप में अनुवाद किया गया है और उनके स्थानीय, प्रायः अनधिकृत उपासना-स्थल होने की जानकारी पादटिप्पणी में दी गई है।
  alternative: केवल ‘ऊँचे स्थान’ कहना, जिससे धार्मिक कार्य अस्पष्ट रह सकता है।
  rationale: प्रसंग में ये सामान्य ऊँची भौगोलिक जगहें नहीं, धार्मिक स्थल हैं। फिर भी अनुवाद यह नहीं जोड़ता कि हर स्थल पर ठीक कौन-सा अनुष्ठान होता था।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘इस्राएलियों’ सामान्य पाठक के लिए स्वाभाविक है; ‘याहवे’ व्यक्तिगत ईश्वरीय नाम को बनाए रखता है। वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है। सांस्कृतिक पदों को मुख्य पाठ में संक्षेप में स्पष्ट किया गया है और अतिरिक्त जानकारी पादटिप्पणियों में रखी गई है।
