source:
  edition: WLC
  text: וַֽ֠/יַּעֲבִירוּ אֶת בְּנֵי/הֶ֤ם וְ/אֶת בְּנֽוֹתֵי/הֶם֙ בָּ/אֵ֔שׁ וַ/יִּקְסְמ֥וּ קְסָמִ֖ים וַ/יְנַחֵ֑שׁוּ וַ/יִּֽתְמַכְּר֗וּ לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: hi
  text: उन्होंने अपने बेटे और बेटियों को आग में से होकर गुज़ारा[a], भविष्य-कथन किया और शकुनों का अर्थ लगाया, और यहोवा की दृष्टि में बुराई करने के लिए अपने आप को बेच डाला, ताकि उसे क्रोधित करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक स्पष्ट रूप से: “अपने बेटे और बेटियों को आग में बलि चढ़ाया।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “उन्हें आग में से होकर गुज़ारा।”'
    reason: मुख्य पाठ में इब्रानी मुहावरे और उसके अनुष्ठानिक स्वरूप की अस्पष्टता सुरक्षित रखता है; पादटिप्पणी संदर्भानुकूल संभावित बाल-बलि का अर्थ बताती है।
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  choice: आग में से पार कराया
  rationale: यह इब्रानी मुहावरे के प्रेरणार्थक रूप को बनाए रखता है और अनुष्ठान का स्वरूप मुख्य पाठ में आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: अपने बेटे-बेटियों
  rationale: इब्रानी में बेटे और बेटियाँ दोनों स्पष्ट रूप से कहे गए हैं; हिंदी में संयुक्त रूप स्वाभाविक और बलपूर्ण है।
- source_word: וַיִּקְסְמוּ קְסָמִים
  choice: शकुन-विचार किया
  rationale: सजातीय क्रिया-संज्ञा रचना को शब्दशः दोहराने के बजाय यह निषिद्ध भविष्य-कथन का अर्थ सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיְנַחֵשׁוּ
  choice: लक्षणों से भावी बातें जानने का प्रयास किया
  rationale: यह संकेतों या लक्षणों की व्याख्या द्वारा भविष्य जानने के भाव को पिछले पद से अलग और सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: וַיִּתְמַכְּרוּ
  choice: स्वयं को ... बेच डाला
  rationale: मूल का सजीव रूपक बनाए रखता है, जो बुराई के प्रति स्वेच्छापूर्ण आत्मसमर्पण और दासता का बोध कराता है।
- source_word: לַעֲשׂוֹת הָרַע
  choice: बुरा काम करने के लिए
  rationale: यह इब्रानी पदबंध का स्वाभाविक आधुनिक हिंदी रूप है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: दैवी मूल्यांकन के इब्रानी मुहावरे को सहज हिंदी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित नामरूप के द्वारा चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत किया गया है।
- source_word: לְהַכְעִיסוֹ
  choice: उसे क्रोध दिलाया
  rationale: हिफ़ील रूप की प्रेरणार्थक शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: संतानों को आग में से पार कराने की रस्म का स्वरूप
  choice: मुख्य पाठ में मूल मुहावरा ‘आग में से पार कराया’ रखा गया।
  alternative: ‘आग में बलि चढ़ाया’ या ‘आग में जला दिया’
  rationale: संदर्भ बाल-बलि की ओर प्रबल संकेत करता है, पर मूल पदबंध स्वयं अनुष्ठान की ठीक विधि स्पष्ट नहीं करता; इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और संभावित स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करते हुए हिंदी पाठकों के लिए परिचित नामरूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शकुन-विचार’ और ‘लक्षणों से भावी बातें जानना’ पास-पास की दोनों इब्रानी क्रियाओं में भेद बनाए रखते हैं; ‘स्वयं को ... बेच डाला’ मूल के कठोर नैतिक रूपक को सुरक्षित रखता है।
