base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/012.yaml
  text: They served the idols[a], concerning which Yahweh had said to them, “You shall not do this thing.”
translation:
  language: hi
  text: उन्होंने घृणित मूर्तियों[a] की उपासना की, जिनके बारे में याहवे ने उनसे कहा था, “तुम यह काम न करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी शब्द मूर्तियों के लिए अत्यंत तिरस्कारसूचक है; उसमें ‘गंदी मूर्तियाँ’ और संभवतः ‘गोबर/मल की मूर्तियाँ’ जैसा अपमानजनक भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: उपासना की
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है, पर मूर्तियों के संदर्भ में यह धार्मिक सेवा या उपासना को दर्शाता है। हिन्दी में ‘मूर्तियों की सेवा की’ अस्पष्ट और कम स्वाभाविक होता; ‘उपासना की’ यहाँ आशय स्पष्ट करता है।
- source_word: הַגִּלֻּלִים
  choice: घृणित मूर्तियों
  rationale: גִּלֻּלִים मूर्तियों के लिए तिरस्कारसूचक शब्द है। ‘घृणित मूर्तियाँ’ उसके निंदात्मक भाव को मुख्य पाठ में स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक और तीखा संकेत पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר אָמַר יְהוָה לָהֶם
  choice: जिनके विषय में यहोवा ने उनसे कहा था
  rationale: सम्बन्धवाचक अंश को मूर्तियों और उनसे जुड़ी निषिद्ध प्रथा के संदर्भ के रूप में रखा गया है। ‘कहा था’ पूर्व में दी गई आज्ञा को कथानक की बाद की अवज्ञा से जोड़ता है।
- source_word: לֹא תַעֲשׂוּ אֶת־הַדָּבָר הַזֶּה
  choice: तुम ऐसा काम न करना
  rationale: यह सीधी निषेधाज्ञा है। ‘ऐसा काम न करना’ आधुनिक, गरिमापूर्ण हिन्दी में आज्ञा का बल और דָּבָר की व्यापकता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-संबंधी निज नाम सीधे उपस्थित है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज और गरिमापूर्ण रखी गई है। तिरस्कारसूचक इब्रानी शब्द का भाव मुख्य पाठ में ‘घृणित’ से और उसकी अधिक तीखी शब्द-छटा पादटिप्पणी में सुरक्षित की गई है।
