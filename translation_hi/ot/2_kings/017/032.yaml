reference: 2 Kings 17:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
translation:
  language: hi
  text: वे याहवे का भय मानते थे और उन्होंने अपने लिए अपने ही लोगों में से[a] ऊँचे स्थानों के याजक[b] नियुक्त किए। वे याजक उनके लिए ऊँचे स्थानों के भवनों में सेवा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सभी वर्गों में से।” इब्रानी अभिव्यक्ति मुहावरेदार है और संभवतः यह संकेत देती है कि उन्होंने उचित भेद या योग्यता का ध्यान रखे बिना आम लोगों में से याजक चुने।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसे याजक, जो केंद्रीय पवित्रस्थान के बजाय स्थानीय पूजा-स्थलों पर सेवा करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: याहवे का भय मानते थे
  rationale: यह अनुवाद इब्रानी मुहावरे में निहित भय, श्रद्धा और उपासना-संबंधी निष्ठा को बनाए रखता है; केवल ‘उपासना करते थे’ कहना अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित ध्वन्यात्मक रूप दिया गया है।
- source_word: מִקְצוֹתָם
  choice: अपने ही लोगों में से
  rationale: शाब्दिक रूप से यह अभिव्यक्ति ‘उनके सिरों/छोरों में से’ है, पर यहाँ समुदाय के भीतर से लोगों को चुनने का मुहावरेदार भाव है। संभावित सामाजिक भेद की अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: כֹּהֲנֵי בָמוֹת
  choice: ऊँचे स्थानों के याजक
  rationale: यह बामोत के तकनीकी धार्मिक अर्थ और याजकीय पद, दोनों को सुरक्षित रखता है।
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: उन्होंने अपने लिए ... नियुक्त किए
  rationale: व्यक्तियों को किसी पद पर ‘बनाने’ के संदर्भ में עשה का स्वाभाविक अर्थ ‘नियुक्त करना’ है; לָהֶם का आत्महितकारी भाव ‘अपने लिए’ से व्यक्त किया गया है।
- source_word: וַיִּהְיוּ עֹשִׂים לָהֶם
  choice: वे याजक उनके लिए ... सेवा करते थे
  rationale: परिप्रयुक्त रचना निरंतर कार्य को दर्शाती है। स्पष्टता के लिए निहित कर्ता ‘याजक’ दोहराया गया है, जबकि सेवा का स्वरूप अनावश्यक रूप से विशिष्ट नहीं किया गया।
- source_word: בְּבֵית הַבָּמוֹת
  choice: ऊँचे स्थानों के भवनों में
  rationale: एकवचन रूप सामूहिक अर्थ में प्रयुक्त हो सकता है। ‘भवनों’ से उन स्थानीय पूजा-स्थलों से जुड़े निर्मित उपासना-भवनों का संकेत मिलता है, बिना उन्हें पूर्ण मंदिर कहे।
theological_decisions:
- issue: याहवे का भय मानने और अनुचित स्थानीय उपासना करने के बीच तनाव
  choice: दोनों कथनों को साधारण ‘और’ से साथ रखा गया है
  alternative: ‘फिर भी’ जोड़कर स्पष्ट विरोध दिखाना, अथवा ‘वे याहवे की उपासना करते थे’ कहना
  rationale: इब्रानी पाठ ו से दोनों कार्यों को जोड़ता है और तनाव को पाठक के सामने अनसुलझा छोड़ता है। ‘फिर भी’ विरोध को अधिक स्पष्ट कर देता, जबकि ‘उपासना’ भय/श्रद्धा के मूल शब्द को संकुचित करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘ऊँचे स्थान’ राजाओं की पुस्तकों में स्थानीय धार्मिक स्थलों के लिए तकनीकी पद के रूप में रखा गया है। सर्वनाम की अस्पष्टता घटाने के लिए अंतिम वाक्य में ‘वे याजक’ स्पष्ट किया गया है।
