  text: They set up for themselves pillars and Asherah poles on every high hill and under every green tree[a].
translation:
  language: hi
  text: उन्होंने अपने लिए पूजा के खंभे और अशेरा-स्तंभ खड़े किए, हर ऊँची पहाड़ी पर और हर हरे-भरे पेड़ के नीचे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अशेरीम”; इब्रानी शब्द अशेरा से जुड़ी पूजा-वस्तुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצִּבוּ
  choice: खड़े किए
  rationale: हिफ़ील रूप यहाँ पूजा-वस्तुओं को स्थापित करने या खड़ा करने का अर्थ देता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: לָהֶם
  choice: अपने लिए
  rationale: दत्तिवाचक सर्वनाम इन वस्तुओं को उनके अपने उपयोग के लिए स्थापित किए जाने का भाव व्यक्त करता है।
- source_word: מַצֵּבוֹת
  choice: पूजा के खम्भे
  rationale: यह खड़े किए गए पंथ-संबंधी पत्थर के स्तम्भों को दर्शाता है। केवल 'खम्भे' अस्पष्ट हो सकता है, इसलिए 'पूजा के' प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: וַאֲשֵׁרִים
  choice: अशेरा-स्तम्भ
  rationale: यह बहुवचन अशेरा से जुड़ी पूजा-वस्तुओं को दर्शाता है; 'अशेरा-स्तम्भ' संबंध बनाए रखता है और वस्तु के स्वरूप पर अत्यधिक निश्चित दावा नहीं करता।
- source_word: עַל כָּל גִּבְעָה גְבֹהָה
  choice: हर ऊँची पहाड़ी पर
  rationale: मूल की भौतिक छवि और दोहराए जाने वाले पूजा-स्थल सूत्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  choice: और हर हरे-भरे पेड़ के नीचे
  rationale: רַעֲנָן ताज़ी, घनी या लहलहाती हरियाली का बोध देता है; 'हरे-भरे' आधुनिक हिन्दी में अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: אֲשֵׁרִים का अनुवाद
  choice: अशेरा-स्तम्भ
  alternative: अशेरीम; अशेरा के खम्भे; अशेरा की लकड़ी की प्रतिमाएँ
  rationale: मूल शब्द अशेरा से जुड़ी पूजा-वस्तुओं का संकेत करता है, पर उनकी सटीक बनावट निश्चित नहीं करता। चुना हुआ रूप नाम-संबंध को बनाए रखता है और सामान्य 'मूर्ति' कहकर अर्थ को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। 'पूजा के खम्भे' से מַצֵּבוֹת का पंथ-संबंधी अर्थ स्पष्ट किया गया है; अशेरा-संबंधी शब्द की वास्तविक अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
