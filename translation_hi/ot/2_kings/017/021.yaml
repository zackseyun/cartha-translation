base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
translation:
  language: hi
  text: क्योंकि इस्राएल दाऊद के घराने से टूटकर अलग हो गया था, और उन्होंने नबात के पुत्र यारोबाम को राजा बनाया। यारोबाम ने इस्राएल को याहवे के पीछे चलने से दूर कर दिया[a] और उनसे एक बड़ा पाप करवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के पीछे चलने से भटका दिया।” इब्रानी क्रिया का अर्थ दूर हटा देना या बहका देना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  choice: टूटकर अलग हो गया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘फाड़ना/टुकड़े करना’ है। राजनीतिक विभाजन के इस संदर्भ में ‘टूटकर अलग हो गया’ रूपक की तीव्रता बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: מֵעַל בֵּית דָּוִד
  choice: दाऊद के घराने से
  rationale: यह पदबंध दाऊदी राजवंश के अधिकार से अलग होने को व्यक्त करता है; ‘घराना’ यहाँ वंश और राजकीय सत्ता दोनों का स्वाभाविक संकेत देता है।
- source_word: וַיַּמְלִיכוּ
  choice: राजा बनाया
  rationale: हिफ़ईल रूप किसी को शासन करने के लिए नियुक्त करने का कारक अर्थ रखता है।
- source_word: וַיַּדַּח
  choice: दूर कर दिया
  rationale: क्रिया में दूर हटा देने या बहका देने, दोनों की अर्थ-छाया संभव है। मुख्य पाठ में ‘दूर कर दिया’ बल और दिशात्मक बिंब को सुरक्षित रखता है।
- source_word: מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलने से
  rationale: ‘पीछे चलना’ वाला इब्रानी मुहावरा निष्ठापूर्वक अनुसरण करने को दर्शाता है; हिन्दी में भी यह बोधगम्य और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वतापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है।
- source_word: וְהֶחֱטֵיאָם חֲטָאָה גְדוֹלָה
  choice: उनसे एक बड़ा पाप करवाया
  rationale: हिफ़ईल का कारक अर्थ और उसके बाद आए सजातीय कर्म, दोनों को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: यारोबाम द्वारा इस्राएल को हटाने की क्रिया
  choice: याहवे के पीछे चलने से दूर कर दिया
  alternative: याहवे के पीछे चलने से बहका दिया
  rationale: मूल क्रिया बलपूर्वक दूर करने और भटका देने, दोनों अर्थ दे सकती है। मुख्य पाठ पहले अर्थ को रखता है और पादटिप्पणी दूसरे को सुरक्षित करती है।
