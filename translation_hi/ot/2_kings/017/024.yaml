base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
translation:
  language: hi
  text: तब अश्शूर का राजा बाबेल, कूता, अव्वा[a], हमात और सपर्वैम से लोगों को लाया और उन्हें इस्राएलियों[b] के स्थान पर सामरिया के नगरों में बसाया। उन्होंने सामरिया पर अधिकार कर लिया और उसके नगरों में रहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अव्वा’ नाम को ‘अव्वाह’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों”; अर्थात इस्राएली लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: लोगों को लाया
  rationale: हिफ़ील रूप का अर्थ ‘लाया’ या ‘आने दिया’ है। इब्रानी में कर्म प्रकट नहीं है, पर प्रसंग से स्पष्ट है कि विभिन्न स्थानों से बसाए जाने वाले लोग लाए गए; इसलिए हिन्दी में स्वाभाविक स्पष्टता के लिए ‘लोगों को’ जोड़ा गया है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: यह इब्रानी संबंध-संरचना का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  choice: बाबेल, कूता, अव्वा, हमात और सपर्वैम से
  rationale: ये स्थानों के नाम हैं; इसलिए उनका अनुवाद न करके इब्रानी उच्चारण के निकट देवनागरी लिप्यन्तरण किया गया है।
- source_word: וַיֹּשֶׁב
  choice: उन्हें ... बसाया
  rationale: ישׁב का हिफ़ील रूप सकर्मक और कारक अर्थ रखता है—राजा ने उन लोगों को वहाँ रहने के लिए बसाया।
- source_word: בְּעָרֵי שֹׁמְרוֹן
  choice: सामरिया के नगरों में
  rationale: עָרֵי बहुवचन है, इसलिए ‘नगरों’ रखा गया है। यहाँ सामरिया केवल राजधानी नहीं, उसके व्यापक क्षेत्र को सूचित करता है।
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान के स्थान पर
  rationale: תַּחַת का अर्थ यहाँ ‘के स्थान पर’ है। בְּנֵי יִשְׂרָאֵל का अपेक्षाकृत औपचारिक रूप ‘इस्राएल की सन्तान’ मूल अभिव्यक्ति को बनाए रखता है और पूरे जातीय समुदाय को सूचित करता है।
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  choice: उन्होंने सामरिया पर अधिकार कर लिया
  rationale: इस बसावट के प्रसंग में ירשׁ का अर्थ उत्तराधिकार पाने से अधिक किसी क्षेत्र को अपने अधिकार में लेने का है।
- source_word: וַיֵּשְׁבוּ בְּעָרֶיהָ
  choice: और उसके नगरों में रहने लगे
  rationale: यहाँ ישׁב का काल रूप नई और जारी हुई निवास-अवस्था को बताता है; ‘रहने लगे’ स्वाभाविक हिन्दी में उस भाव को व्यक्त करता है। ‘उसके’ का संकेत सामरिया की ओर है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंगसूचक जातीय अभिव्यक्ति
  choice: इस्राएल की सन्तान
  alternative: इस्राएली; इस्राएल के लोग
  rationale: इब्रानी का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ उसका आशय केवल पुरुषों से नहीं, समूचे जातीय समुदाय से है। ‘इस्राएल की सन्तान’ मूल रूप से निकट भी है और हिन्दी में समुदाय के लिए समावेशी भी।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। ऐतिहासिक स्थान-नामों के प्रचलित बाइबलीय देवनागरी रूप रखे गए हैं। वाक्य में इब्रानी की क्रमिक ऐतिहासिक गति सुरक्षित है, पर हिन्दी की स्वाभाविकता के लिए सर्वनाम और कारक स्पष्ट किए गए हैं।
