base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
translation:
  language: hi
  text: उन्होंने उसकी विधियों और उसकी उस वाचा को, जो उसने उनके पुरखों के साथ बाँधी थी, और उसकी उन चेतावनियों को ठुकरा दिया जिनके द्वारा उसने उन्हें चेतावनी दी थी।[b] वे व्यर्थता के पीछे चले और स्वयं व्यर्थ हो गए,[a] और अपने चारों ओर की उन जातियों के पीछे चले जिनके विषय में यहोवा ने उन्हें आज्ञा दी थी कि वे उनके समान आचरण न करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में एक ही मूल से शब्दों का खेल है: वे “व्यर्थता” के पीछे चले और “व्यर्थ” हो गए—अर्थात जिन निरर्थक वस्तुओं का उन्होंने अनुसरण किया, उन्हीं के समान हो गए। इस प्रसंग में “व्यर्थता” से मूर्तियों का भी संकेत हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: '“उसकी उन चेतावनियों को, जिनके द्वारा उसने उन्हें चेतावनी दी थी” का अनुवाद यह भी हो सकता है: “उसकी उन साक्षियों को, जिनके द्वारा उसने उनके विरुद्ध साक्षी दी थी।”'
    reason: alternative_reading
