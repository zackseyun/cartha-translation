- source_word: חֻקָּיו
  choice: उसकी विधियों
  rationale: यह कानूनी-वाचागत आदेशों का भाव रखता है और आधुनिक पाठक के लिए सहज है।
- source_word: בְּרִיתוֹ אֲשֶׁר כָּרַת
  choice: उसकी वाचा को, जो उसने ... के साथ बाँधी थी
  rationale: हिन्दी बाइबलीय प्रयोग में ‘वाचा बाँधना’ मूल इब्रानी मुहावरे ‘वाचा काटना’ का स्वाभाविक और प्रतिष्ठित समतुल्य है।
- source_word: אֲבוֹתָם
  choice: उनके पुरखों
  rationale: सन्दर्भ में पूर्वज पिताओं को सूचित करता है; ‘पुरखे’ सहज, गरिमापूर्ण और ऐतिहासिक है।
- source_word: עֵדְוֹתָיו אֲשֶׁר הֵעִיד בָּם
  choice: उसकी उन चितौनियों को ... जिनके द्वारा उसने उन्हें चेतावनी दी थी
  rationale: עֵדוֹת और הֵעִיד की साक्ष्य/चेतावनी सम्बन्धी निकटता को यथासम्भव बनाए रखते हुए इस प्रसंग की चेतावनी की शक्ति स्पष्ट की गई है।
- source_word: הַהֶבֶל ... וַיֶּהְבָּלוּ
  choice: व्यर्थता के पीछे चले और स्वयं व्यर्थ हो गए
  rationale: הבל संज्ञा और उसी मूल से बने क्रियापद का जानबूझकर किया गया शब्दालंकार हिन्दी में भी सुरक्षित रहता है।
- source_word: הַגּוֹיִם אֲשֶׁר סְבִיבֹתָם
  choice: अपने चारों ओर की उन जातियों
  rationale: यह आसपास के राष्ट्र-समुदायों को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से प्रतिस्थापित न करके हिन्दी में प्रचलित नामरूप द्वारा प्रस्तुत किया गया है।
- source_word: לְבִלְתִּי עֲשׂוֹת כָּהֶם
  choice: वे उनके समान न करें
  rationale: मूल के संक्षिप्त ‘उनके समान न करना’ को बिना अनावश्यक कर्म जोड़कर सुरक्षित रखा गया है।
theological_decisions:
- issue: הבל का मूर्तिपूजात्मक संकेत
  choice: व्यर्थता
  alternative: मूर्तियाँ / निकम्मी वस्तुएँ
  rationale: शब्द का मूल बिम्ब खालीपन, क्षणभंगुरता और निरर्थकता है; प्रसंग में मूर्तियों का संकेत है, पर मुख्य पाठ में ‘मूर्तियाँ’ रखने से मूल की व्यापकता और शब्दालंकार संकुचित हो जाता।
- issue: עֵדוֹת और הֵעִיד का सम्बन्ध
  choice: चितौनियाँ ... चेतावनी दी
  alternative: साक्षियाँ ... उनके विरुद्ध साक्षी दी
  rationale: यहाँ चेतावनी का अर्थ प्रसंगानुकूल है, जबकि पादटिप्पणी साक्ष्य/विरुद्ध गवाही की वास्तविक सम्भावना सुरक्षित रखती है।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में निजी वाचा-नाम है। आधुनिक हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला नामरूप है; इसे केवल ‘प्रभु’ करना नाम और उपाधि का भेद मिटाता।
