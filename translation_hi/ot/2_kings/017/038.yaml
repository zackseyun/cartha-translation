source:
  edition: WLC
  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
translation:
  language: hi
  text: और उस वाचा को, जो मैंने तुम्हारे साथ बाँधी है,[a] तुम न भूलना; और दूसरे देवताओं का भय न मानना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक मुहावरा है, “वाचा काटी।” “वाचा बाँधी” उसी वाचा-स्थापन के मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इसे “तुम दूसरे देवताओं का भय नहीं मानोगे” भी अनुवाद किया जा सकता है। इब्रानी रूप निषेधात्मक आदेश या दृढ़ विधान के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  choice: वाचा
  rationale: यह शब्द परमेश्वर द्वारा स्थापित बंधनकारी संबंध को व्यक्त करता है; ‘समझौता’ इसकी औपचारिक और धर्मवैचारिक गहराई को कम कर देता।
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: जो मैंने तुम्हारे साथ बाँधी है
  rationale: इब्रानी में शाब्दिक मुहावरा ‘वाचा काटना’ है। हिन्दी में ‘वाचा बाँधना’ स्वाभाविक है और वाचा स्थापित करने का आशय सुरक्षित रखता है।
- source_word: לֹא תִשְׁכָּחוּ
  choice: तुम न भूलना
  rationale: לֹא के साथ अपूर्ण क्रिया यहाँ निषेधात्मक निर्देश देती है। यह रूप आधुनिक हिन्दी में स्वाभाविक रहते हुए वाचागत आदेश का स्वर बनाए रखता है।
- source_word: וְלֹא תִירְאוּ
  choice: और ... भय न मानना
  rationale: יָרֵא भय और श्रद्धापूर्ण धार्मिक निष्ठा दोनों का संकेत दे सकता है। ‘भय मानना’ मूल पद की व्यापकता को ‘पूजा करना’ जैसे अधिक व्याख्यात्मक अनुवाद से बेहतर सुरक्षित रखता है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह इस्राएल के परमेश्वर के अतिरिक्त अन्य देवताओं का सीधा उल्लेख है; ‘दूसरे देवता’ सर्वाधिक सहज और मूल के निकट है।
theological_decisions:
- issue: वाचागत निषेध का स्वर
  choice: ‘तुम न भूलना ... भय न मानना’ के रूप में निषेधात्मक निर्देश
  alternative: ‘तुम नहीं भूलोगे ... भय नहीं मानोगे’ के रूप में भविष्यतुल्य विधान
  rationale: इब्रानी रूप निषेध या दृढ़ निर्देश दोनों ढंग से व्यक्त किया जा सकता है। हिन्दी में निषेधात्मक निर्देश प्रसंग का आदेशात्मक अर्थ स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक रूप दर्ज करती है।
- issue: יָרֵא में भय और धार्मिक निष्ठा का संबंध
  choice: ‘भय मानना’
  alternative: ‘श्रद्धा रखना’ या ‘पूजा करना’
  rationale: ‘भय मानना’ मूल की धार्मिक निष्ठा-संबंधी छाया को बनाए रखता है, पर उसे केवल उपासना या सम्मान तक सीमित करके तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘वाचा बाँधना’ स्थापित हिन्दी बाइबलीय मुहावरा है; ‘भय मानना’ יָרֵא की धार्मिक निष्ठा से जुड़ी अर्थ-छाया को सुरक्षित रखता है।
