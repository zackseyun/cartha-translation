base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
translation:
  language: hi
  text: इस प्रकार ये जातियाँ याहवे का भय रखती थीं, फिर भी वे अपनी तराशी हुई मूर्तियों[a] की सेवा करती थीं। उनके बच्चे और उनके बच्चों के बच्चे भी—जैसा उनके पुरखों ने किया था, वैसा ही वे आज तक करते आ रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी मूर्तियाँ।” इब्रानी शब्द विशेष रूप से तराशकर बनाई गई प्रतिमाओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ הַגּוֹיִם הָאֵלֶּה
  choice: इस प्रकार ये जातियाँ ... मानती थीं
  rationale: वाव-क्रम इस खंड के निष्कर्ष या परिणाम को आगे बढ़ाता है; “इस प्रकार” उस सारांशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है। גּוֹיִם यहाँ सामरिया में बसाई गई विदेशी जातियों को सूचित करता है।
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: याहवे का भय मानती थीं
  rationale: यह धार्मिक भय और श्रद्धा से जुड़ा इब्रानी मुहावरा है। “भय मानना” हिन्दी में उस अर्थ-सीमा को बनाए रखता है, और परमेश्वर के व्यक्तिगत नाम יהוה को “याहवे” के रूप में प्रस्तुत किया गया है।
- source_word: וְאֶת־פְּסִילֵיהֶם הָיוּ עֹבְדִים
  choice: फिर भी वे अपनी तराशी हुई मूर्तियों की सेवा करती थीं
  rationale: פְּסִילִים तराशकर बनाई गई उपासना-प्रतिमाएँ हैं। “तराशी हुई मूर्तियाँ” शब्द की ठोस छवि बचाता है। הָיוּ עֹבְדִים लगातार या प्रचलित क्रिया बताता है, इसलिए “सेवा करती थीं” चुना गया। “फिर भी” साथ-साथ चल रहे विरोधी धार्मिक आचरण को स्पष्ट करता है, बिना उसकी प्रकृति का अतिरिक्त निर्णय किए।
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  choice: उनके बच्चे और उनके बच्चों के बच्चे भी
  rationale: शाब्दिक पीढ़ीगत संरचना को सरल आधुनिक हिन्दी में रखा गया है; प्रसंग में בנים वंशजों को सामूहिक रूप से सूचित करता है।
- source_word: כַּאֲשֶׁר עָשׂוּ אֲבֹתָם הֵם עֹשִׂים עַד הַיּוֹם הַזֶּה
  choice: जैसा उनके पुरखों ने किया था, वैसा ही वे आज तक करते आ रहे हैं
  rationale: तुलनात्मक रचना को बनाए रखते हुए participle की जारी रहने वाली क्रिया “करते आ रहे हैं” से व्यक्त हुई है। “आज तक” इब्रानी काल-सूत्र का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: याहवे का भय मानने और मूर्तियों की सेवा करने का सह-अस्तित्व
  choice: “याहवे का भय मानती थीं, फिर भी ... मूर्तियों की सेवा करती थीं”
  alternative: इसे केवल ढोंगी भय, पूर्ण उपासना अथवा किसी एक निश्चित धार्मिक अवस्था के रूप में व्याख्यायित करना
  rationale: इब्रानी पाठ दोनों बातों को साथ रखता है, पर यह तय नहीं करता कि उनका भय सच्चा, बाहरी या समन्वयवादी था। अनुवाद इसी तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। “याहवे” से इब्रानी व्यक्तिगत नाम को सुरक्षित रखा गया है; “पुरखे” सामान्य पाठक के लिए स्वाभाविक रहते हुए पैतृक पीढ़ियों का भाव देता है।
