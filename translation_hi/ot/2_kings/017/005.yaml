  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
translation:
  language: hi
  text: तब अश्शूर का राजा सारे देश में होकर चढ़ आया; फिर वह शोमरोन के विरुद्ध चढ़ आया[a] और तीन वर्ष तक उसका घेरा डाले रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘वह शोमरोन की ओर चढ़ गया’ भी हो सकता है। इब्रानी क्रिया का अर्थ सामान्य रूप से ‘ऊपर जाना’ या सैन्य रूप से ‘चढ़ाई करना’ हो सकता है; अगले वाक्यांश में घेराबंदी का उल्लेख यहाँ सैन्य अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ आया
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है और सैन्य प्रसंग में यह सेना लेकर आगे बढ़ने का भाव भी देता है। ‘चढ़ आया’ हिंदी में इस स्थानीय तथा सैन्य दोनों रंगों को स्वाभाविक रूप से रखता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: यह इब्रानी संबंध-रचना का सीधा और प्रचलित हिंदी रूप है; प्रसंग में एक निश्चित राजा अभिप्रेत है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारे देश में
  rationale: यहाँ בְּ क्षेत्र में होकर या पूरे क्षेत्र में सैन्य बढ़त को दर्शाता है। ‘सारे देश में’ विस्तार को व्यक्त करता है, पर आक्रमण की रीति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיַּעַל שֹׁמְרוֹן
  choice: वह शोमरोन पर चढ़ आया
  rationale: नगर के साथ सैन्य कथानक में עלה उसके विरुद्ध आगे बढ़ने का संकेत देता है। ‘पर चढ़ आया’ आक्रमणकारी संदर्भ को स्पष्ट रखता है और चढ़ने की मूल छवि भी बचाता है।
- source_word: וַיָּצַר עָלֶיהָ
  choice: उसकी घेराबंदी किए रहा
  rationale: צור यहाँ किसी नगर को घेरने का तकनीकी सैन्य अर्थ रखता है। ‘किए रहा’ तीन वर्ष तक जारी कार्रवाई को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שָׁלֹשׁ שָׁנִים
  choice: तीन वर्ष तक
  rationale: अवधि बताने के लिए ‘तक’ सहज हिंदी प्रयोग है और घेराबंदी के दीर्घकाल को स्पष्ट करता है।
