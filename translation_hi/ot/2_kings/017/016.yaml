base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
translation:
  language: hi
  text: उन्होंने अपने परमेश्वर याहवे की सभी आज्ञाओं को त्याग दिया। उन्होंने अपने लिए धातु में ढली दो बछड़ों की मूर्तियाँ बनाईं और एक अशेरा[a] बनाया। उन्होंने आकाश की सारी सेना के आगे दण्डवत किया और बाल की उपासना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशेरा-स्तम्भ’। हिब्रू शब्द ‘अशेरा’ कनानी देवी अथवा उससे जुड़ी पूजा-वस्तु को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: त्याग दिया
  rationale: यहाँ क्रिया केवल छोड़ने नहीं, बल्कि वाचा के परमेश्वर की आज्ञाओं से जानबूझकर विमुख होने का भाव रखती है; ‘त्याग दिया’ इस प्रबल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל מִצְוֺת
  choice: सभी आज्ञाओं
  rationale: ‘सभी’ मूल के כָּל को स्पष्ट रखता है और ‘आज्ञाएँ’ वाचा-संबंधी מִצְוֺת का उपयुक्त आधुनिक हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिब्रू प्रत्यय ‘उनके’ को हिन्दी में कर्ता के अनुरूप स्वाभाविक आत्मवाचक ‘अपने’ से व्यक्त किया गया है; इससे इस्राएल के वाचा-संबंध का संकेत बना रहता है।
- source_word: וַיַּעֲשׂוּ לָהֶם מַסֵּכָה שנים עֲגָלִים
  choice: अपने लिए धातु में ढली दो बछड़ों की मूर्तियाँ बनाईं
  rationale: לָהֶם का प्रयोजनार्थक भाव ‘अपने लिए’ से, מַסֵּכָה की ढलाई-सम्बन्धी ठोस अर्थछाया ‘धातु में ढली’ से और עֲגָלִים की पहचान ‘बछड़ों’ से व्यक्त हुई है। हिन्दी वाक्य बहुवचन की वास्तविक संख्या को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲשֵׁירָה
  choice: एक अशेरा
  rationale: मूल शब्द देवी या उससे जुड़े पूजा-वस्तु, दोनों का संकेत दे सकता है। ‘बनाया’ के कारण पूजा-वस्तु सम्भावित है, फिर भी ‘अशेरा’ को लिप्यंतरित रखकर अस्पष्टता सुरक्षित रखी गई है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत किया
  rationale: यह क्रिया झुकने अथवा भूमि पर गिरकर प्रणाम करने की शारीरिक क्रिया बताती है; ‘दण्डवत किया’ हिन्दी में उस उपासना-सूचक क्रिया को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  choice: आकाश की सारी सेना के आगे
  rationale: ‘आकाश की सेना’ मूल रूपक को बनाए रखती है, जो सूर्य, चन्द्रमा और तारों जैसे आकाशीय पिंडों की ओर संकेत करता है; ‘सारी’ כָּל को सुरक्षित रखता है।
- source_word: וַיַּעַבְדוּ אֶת הַבָּעַל
  choice: बाल की उपासना की
  rationale: मूर्तिपूजा के प्रसंग में עבד धार्मिक सेवा या आराधना का बोध देता है। हिन्दी में ‘बाल की सेवा की’ भ्रामक हो सकता है, इसलिए ‘उपासना की’ अभिप्रेत धार्मिक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: אֲשֵׁירָה की पहचान
  choice: एक अशेरा
  alternative: अशेरा-स्तम्भ; देवी अशेरा
  rationale: ‘बनाया’ पूजा-वस्तु की ओर झुकाव देता है, पर शब्द स्वयं देवी और उसके पूजा-चिह्न के बीच अस्पष्ट हो सकता है। मुख्य पाठ इस तनाव को नहीं सुलझाता; पादटिप्पणी दोनों सम्भावनाएँ बताती है।
- issue: וַיִּשְׁתַּחֲווּ और וַיַּעַבְדוּ के बीच भेद
  choice: दण्डवत किया … उपासना की
  alternative: पूजा की … सेवा की
  rationale: पहली क्रिया की शारीरिक मुद्रा और दूसरी की धार्मिक सेवा, दोनों को अलग रखा गया है, साथ ही आधुनिक हिन्दी में बाल के संदर्भ का अर्थ स्पष्ट बनाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कथन को कई छोटे वाक्यों में बाँटकर हिब्रू की क्रमिक क्रियाएँ स्पष्ट की गई हैं। पादटिप्पणी-चिह्न उसी अस्पष्ट शब्द ‘अशेरा’ के बाद रखा गया है।
