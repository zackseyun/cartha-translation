source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
translation:
  language: hi
  text: उसने वह किया जो याहवे की दृष्टि में बुरा था; फिर भी[a] वह इस्राएल के उन राजाओं जैसा नहीं था जो उससे पहले हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल इतना कि वह इस्राएल के उन राजाओं जैसा नहीं था जो उससे पहले हुए थे।” इब्रानी अव्यय का अधिक शाब्दिक अर्थ “केवल” है और यहाँ वह पहले दिए गए निर्णय पर एक सीमा लगाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: उसने ... किया
  rationale: वय्यिक्तोल रूप कथा की अगली क्रिया बताता है। हिन्दी में आरम्भिक ‘और’ के बिना यह कथन स्वाभाविक और अर्थनिष्ठ है।
- source_word: הָרַע
  choice: वह ... जो ... बुरा था
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित विशेषण का अर्थ ‘वह जो बुरा था’ है; यह हिन्दी में शाब्दिक ‘बुराई’ की अपेक्षा राजकीय मूल्यांकन-सूत्र को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह मूल्यांकन के दृष्टिकोण को व्यक्त करने वाला इब्रानी मुहावरा है। ‘की दृष्टि में’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- source_word: רַק
  choice: फिर भी
  rationale: यहाँ यह अव्यय पहले किए गए नकारात्मक मूल्यांकन पर एक सीमित करने वाली तुलना जोड़ता है। ‘फिर भी’ उस विरोधात्मक-सीमाकारी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प फुटनोट में रखा गया है।
- source_word: לֹא כְּמַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के उन राजाओं जैसा नहीं
  rationale: निषेध के साथ तुलनात्मक כ का सीधा अर्थ ‘जैसा नहीं’ है। ‘उन’ आगे आने वाले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֲשֶׁר הָיוּ לְפָנָיו
  choice: जो उससे पहले हुए थे
  rationale: शाब्दिक ‘जो उसके सामने/पहले थे’ का आशय उससे पूर्व शासन करने वाले राजाओं से है। चुना गया रूप इब्रानी कालगत मुहावरे को स्पष्ट हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में टेट्राग्रामटन व्यक्तिगत नाम के रूप में आया है। ‘याहवे’ स्रोत के नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: होशे के बुरे आचरण की तुलनात्मक सीमा
  choice: फिर भी वह पहले के इस्राएली राजाओं जैसा नहीं था
  alternative: केवल इतना कि वह पहले के इस्राएली राजाओं जैसा नहीं था
  rationale: רַק समग्र नकारात्मक निर्णय को रद्द नहीं करता, बल्कि तुलना द्वारा उसे सीमित करता है। मुख्य पाठ स्वाभाविक विरोधात्मक भाव रखता है और अधिक शाब्दिक संभावना फुटनोट में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘की दृष्टि में’ जैसे परिचित बाइबिलीय मुहावरे को बनाए रखते हुए वाक्य-विन्यास स्वाभाविक रखा गया है।
