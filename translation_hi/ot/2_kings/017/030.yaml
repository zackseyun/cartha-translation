base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
translation:
  language: hi
  text: बाबेल के लोगों ने सुक्कोत-बनोत[a] को बनाया, कूत के लोगों ने नेर्गल[b] को बनाया, और हमात के लोगों ने अशीमा को बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सुक्कोत-बनोत संभवतः किसी विदेशी देवता या उपासना-वस्तु का नाम है। इस नाम का अर्थ निश्चित नहीं है, इसलिए इसका अनुवाद करने के बजाय इसे लिप्यंतरित किया गया है।
    reason: cultural_note
  - marker: b
    text: या, “बाबेल के पुरुष ... कूत के पुरुष ... हमात के पुरुष।” हिब्रू में प्रत्येक स्थान के साथ शाब्दिक रूप से “के पुरुष” प्रयुक्त है; यहाँ “लोगों” उसका सामूहिक अर्थ व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: के लोगों
  rationale: यह אִישׁ का संबंधवाचक बहुवचन रूप है। प्रसंग में यह प्रत्येक नगर से जुड़े निवासियों को सामूहिक रूप से सूचित करता है। आधुनिक हिन्दी में ‘के लोगों’ स्वाभाविक है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: עָשׂוּ
  choice: को बनाया
  rationale: सामान्य क्रिया עשה का सीधा अर्थ ‘बनाना/करना’ है। यहाँ ‘स्थापित किया’ या ‘मूर्ति बनाई’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: סֻכּוֹת בְּנוֹת
  choice: सुक्कोत-बनोत
  rationale: यह किसी विदेशी देवता अथवा उपासना-वस्तु का अनिश्चित नाम प्रतीत होता है; इसलिए इसके घटकों का अनुमानित अनुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: כּוּת
  choice: कूत
  rationale: स्थान-नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: נֵרְגַל
  choice: नेर्गल
  rationale: मेसोपोटामिया के देवता का व्यक्तिवाचक नाम होने के कारण इसका अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: חֲמָת
  choice: हमात
  rationale: स्थान-नाम का प्रचलित और स्रोत-निकट हिन्दी लिप्यंतरण।
- source_word: אֲשִׁימָא
  choice: अशीमा
  rationale: विदेशी देवता के व्यक्तिवाचक नाम को अटकलपूर्ण अर्थ देने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: עָשׂוּ के कर्मों को ‘मूर्ति’ या ‘देवता’ कहकर स्पष्ट करना
  choice: मुख्य पाठ में केवल नाम रखे गए हैं और ‘को बनाया’ कहा गया है।
  alternative: ‘सुक्कोत-बनोत की मूर्ति बनाई’ अथवा ‘सुक्कोत-बनोत को अपना देवता बनाया।’
  rationale: हिब्रू पाठ केवल ‘बनाया’ और उसके बाद नाम देता है। ‘मूर्ति’ या ‘अपना देवता’ जोड़ना प्रसंगानुकूल हो सकता है, पर मूल कथन से अधिक स्पष्ट व्याख्या कर देगा।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। तीनों समानांतर उपवाक्यों में हिब्रू की दोहराई गई संरचना को बनाए रखा गया है। ‘लोगों’ सामूहिक अर्थ को सहज हिन्दी में व्यक्त करता है; मुख्य पाठ में सांस्कृतिक पहचान की अतिरिक्त व्याख्या नहीं जोड़ी गई।
