revisions:
- from: जब तक कि यहोवा ने इस्राएल को अपने सामने से हटा न दिया[a], ठीक वैसे ही जैसे उसने अपने सभी दास नबियों के द्वारा कहा था। इस प्रकार इस्राएल अपने देश से अश्शूर को निर्वासित कर दिया गया और आज के दिन तक वहीं है।
  to: जब तक यहोवा ने इस्राएल को अपने सामने से हटा न दिया[a], ठीक वैसे ही जैसे उसने अपने सभी दास नबियों के द्वारा कहा था। इस प्रकार इस्राएल को उसके देश से अश्शूर में निर्वासित कर दिया गया, और वह आज तक वहीं है।
