source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר הֵסִ֨יר יְהוָ֤ה אֶת יִשְׂרָאֵל֙ מֵ/עַ֣ל פָּנָ֔י/ו כַּ/אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד כָּל עֲבָדָ֣י/ו הַ/נְּבִיאִ֑ים וַ/יִּ֨גֶל יִשְׂרָאֵ֜ל מֵ/עַ֤ל אַדְמָת/וֹ֙ אַשּׁ֔וּרָ/ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
translation:
  language: hi
  text: जब तक यहोवा ने इस्राएल को अपने सामने से हटा न दिया[a], ठीक वैसे ही जैसे उसने अपने सभी दास नबियों के द्वारा कहा था। इस प्रकार इस्राएल को उसके देश से अश्शूर में निर्वासित कर दिया गया, और वह आज तक वहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने मुख के सामने से”; अर्थात, “अपनी उपस्थिति से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: हटा न दिया
  rationale: हिफ़ील रूप का कारक अर्थ ‘दूर कर देना/हटा देना’ है; यह चयन न्याय के संदर्भ को बनाए रखते हुए निर्वासन का अर्थ समय से पहले नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित और सहज रूप।
- source_word: מֵעַל פָּנָיו
  choice: अपने सामने से
  rationale: शाब्दिक अर्थ ‘अपने मुख के सामने से’ है। ‘अपने सामने से’ हिन्दी में स्वाभाविक है और प्रभु के सम्मुख से हटाए जाने का व्यक्तिगत तथा न्यायिक भाव बचाता है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: ठीक वैसे ही जैसे उसने ... कहा था
  rationale: तुलनात्मक बल और पहले कही गई भविष्यद्वाणी की पूर्ति, दोनों को व्यक्त करता है।
- source_word: בְּיַד
  choice: के द्वारा
  rationale: ‘हाथ से’ यहाँ माध्यम अथवा अभिकरण का इब्रानी मुहावरा है; ‘के द्वारा’ आधुनिक हिन्दी में उसका स्पष्ट अर्थ देता है।
- source_word: עֲבָדָיו הַנְּבִיאִים
  choice: अपने सभी दास नबियों
  rationale: नबियों को यहोवा के दासों के रूप में पहचानने वाली पदबंधीय रचना को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: וַיִּגֶל
  choice: निर्वासित कर दिया गया
  rationale: इस ऐतिहासिक संदर्भ में גלה जबरन देश-निकाले को दर्शाता है; कर्मवाच्य सामूहिक ‘इस्राएल’ के अनुकूल है।
- source_word: אַדְמָתוֹ
  choice: अपने देश से
  rationale: राष्ट्रीय-सामूहिक इस्राएल के लिए ‘अपने देश’ स्वाभाविक है और क्षेत्रीय अर्थ को सुरक्षित रखता है।
- source_word: אַשּׁוּרָה
  choice: अश्शूर को
  rationale: दिशासूचक प्रत्यय अश्शूर की ओर ले जाए जाने को दर्शाता है; ‘अश्शूर को’ हिन्दी बाइबलीय शैली में सहज है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: इब्रानी कालसूचक सूत्र का स्वाभाविक हिन्दी रूप; संदर्भानुसार निर्वासन की जारी स्थिति को स्पष्ट करने के लिए ‘वहीं है’ जोड़ा गया है।
theological_decisions:
- issue: מֵעַל פָּנָיו में ईश्वरीय न्याय का मुहावरा
  choice: अपने सामने से
  alternative: अपनी उपस्थिति से
  rationale: यह पाठ इस्राएल को यहोवा के सम्मुख से हटाए जाने पर बल देता है। चुना हुआ रूप व्यक्तिगत और न्यायिक आयाम बचाता है, पर किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। मुख्य पाठ में इब्रानी मुहावरों को अर्थपूर्ण हिन्दी में रखा गया है; असामान्य शाब्दिक रूप को पादटिप्पणी में सुरक्षित किया गया है। अंग्रेज़ी परत में [b] का स्थान असंगत था—उसकी टिप्पणी בְיַד से संबंधित है, अश्शूर से नहीं—इसलिए हिन्दी में उसका अर्थ सीधे ‘के द्वारा’ दिया गया और अनावश्यक चिह्न नहीं रखा गया।
