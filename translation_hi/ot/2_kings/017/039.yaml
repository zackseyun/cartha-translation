id: 2KI.17.39
reference: 2 Kings 17:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֛י אִֽם אֶת יְהוָ֥ה אֱלֹהֵי/כֶ֖ם תִּירָ֑אוּ וְ/הוּא֙ יַצִּ֣יל אֶתְ/כֶ֔ם מִ/יַּ֖ד כָּל אֹיְבֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/039.yaml
  text: But Yahweh your God you shall fear[a], and he will deliver you from the hand of all your enemies.
translation:
  language: hi
  text: परन्तु तुम याहवे, अपने परमेश्वर का भय मानना; वही तुम्हें तुम्हारे सब शत्रुओं के हाथ[a] से छुड़ाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तुम्हारे सब शत्रुओं के हाथ से’; यह उनके अधिकार या नियंत्रण से छुड़ाए जाने का मुहावरा है।
    reason: मूल इब्रानी मुहावरे का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: כִּי אִם
  choice: परन्तु
  rationale: यह पद पिछले निषेध के विपरीत सही विकल्प प्रस्तुत करता है; ‘परन्तु’ उस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: याहवे के संदर्भ में यह रूप एकवचन है; ‘अपने’ हिन्दी वाक्य में द्वितीय पुरुष बहुवचन संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּירָאוּ
  choice: भय मानना
  rationale: यह वाचिक निर्देश श्रद्धापूर्ण भय की माँग करता है; ‘भय मानना’ उसके आदेशात्मक बल और धार्मिक संदर्भ दोनों को बनाए रखता है।
- source_word: וְהוּא
  choice: वही
  rationale: इब्रानी में सर्वनाम स्पष्ट रूप से आया है; ‘वही’ उसके हल्के बलाघात को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יַצִּיל
  choice: छुड़ाएगा
  rationale: हिफ़ील रूप संकट अथवा अधिकार से बचाकर निकालने का अर्थ देता है; ‘छुड़ाएगा’ इस संदर्भ में सहज और सटीक है।
- source_word: מִיַּד
  choice: हाथ से
  rationale: मूल रूपक को बनाए रखा गया है; यहाँ ‘हाथ’ सामर्थ्य या नियंत्रण का द्योतक है।
- source_word: כָּל אֹיְבֵיכֶם
  choice: तुम्हारे सब शत्रुओं
  rationale: यह परिमाण और बहुवचन संबंधसूचक रूप का सीधा तथा स्वाभाविक अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: תִּירָאוּ में भय और श्रद्धा का संबंध
  choice: भय मानना
  alternative: श्रद्धा करना
  rationale: केवल ‘श्रद्धा’ कहने से मूल क्रिया में निहित भय का तत्व मंद पड़ सकता है; ‘भय मानना’ श्रद्धापूर्ण भय की तनावपूर्ण व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। ‘भय मानना’ और ‘हाथ से छुड़ाना’ जैसे परिचित बाइबलीय प्रयोग मूल की अर्थ-छवि बनाए रखते हैं।
