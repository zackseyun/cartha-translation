  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
translation:
  language: hi
  text: वहाँ उन्होंने सभी ऊँचे पूजा-स्थानों पर धूप जलाई, उन जातियों के समान जिन्हें याहवे ने उनके सामने से हटा दिया था[a]; और उन्होंने याहवे को क्रोधित करने के लिए बुरे काम किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें याहवे ने उनके सामने से निर्वासित कर दिया था।” इब्रानी क्रिया का अर्थ किसी को निर्वासित करना या हटा देना हो सकता है; यहाँ आशय देश से उन जातियों की बेदखली से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  choice: उन्होंने धूप जलाई
  rationale: पिएल रूप यहाँ उपासना में सुगंधित धुआँ चढ़ाने को व्यक्त करता है। इस प्रसंग में ‘धूप जलाई’ स्वाभाविक है और इसे हर प्रकार के बलिदान तक अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण पिछले संदर्भ में बताए गए पूजा-स्थानों की ओर संकेत करता है।
- source_word: בְּכָל בָּמוֹת
  choice: सभी ऊँचे पूजा-स्थानों पर
  rationale: במות धार्मिक उपासना के लिए बने तथाकथित ‘ऊँचे स्थानों’ का पारिभाषिक शब्द है। ‘पूजा-स्थानों’ जोड़ने से आधुनिक पाठक को इसका धार्मिक अर्थ तुरंत स्पष्ट होता है।
- source_word: כַּגּוֹיִם
  choice: उन जातियों के समान
  rationale: גוים यहाँ देश से हटाई गई अन्य जातियों को दर्शाता है; ‘जातियाँ’ बाद के ‘गैर-यहूदी’ अर्थ को आरोपित किए बिना मूल अर्थ रखता है।
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  choice: जिन्हें यहोवा ने उनके सामने से हटा दिया था
  rationale: הגלה निर्वासित करने या किसी स्थान से हटा देने, दोनों का बोध करा सकता है। विजय और बेदखली के इस प्रसंग में ‘हटा दिया’ उपयुक्त है तथा मूल की कुछ अर्थगत व्यापकता भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: וַיַּעֲשׂוּ דְּבָרִים רָעִים
  choice: उन्होंने बुरे काम किए
  rationale: यह सरल और सीधा अनुवाद मूल के व्यापक नैतिक अभियोग को बिना संकीर्ण किए व्यक्त करता है।
- source_word: לְהַכְעִיס
  choice: क्रोधित करने के लिए
  rationale: כעס का हिफ़ील रूप किसी को क्रोध दिलाने या उकसाने का अर्थ देता है। स्पष्ट उद्देश्यसूचक हिन्दी में ‘क्रोधित करने के लिए’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के बीच अधिक परिचित ‘यहोवा’ नाम को सुरक्षित रखता है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: विजय के प्रसंग में הֶגְלָה का अर्थ
  choice: हटा दिया था
  alternative: निर्वासित कर दिया था
  rationale: क्रिया निर्वासन और हटाए जाने दोनों का बोध करा सकती है। यहाँ पहले से बसे राष्ट्रों की बेदखली अभिप्रेत है; मुख्य पाठ का ‘हटा दिया’ प्रसंग के अनुकूल है, जबकि पादटिप्पणी अधिक विशिष्ट विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचे पूजा-स्थान’ पारिभाषिक धार्मिक अर्थ को सामान्य हिन्दी पाठक के लिए स्पष्ट करता है; वाक्य मूल इब्रानी की दो समन्वित क्रियाओं और उसके नैतिक तनाव को बनाए रखता है।
