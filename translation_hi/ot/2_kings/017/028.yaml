  text: וַ/יָּבֹ֞א אֶחָ֣ד מֵ/הַ/כֹּהֲנִ֗ים אֲשֶׁ֤ר הִגְלוּ֙ מִ/שֹּׁ֣מְר֔וֹן וַ/יֵּ֖שֶׁב בְּ/בֵֽית אֵ֑ל וַֽ/יְהִי֙ מוֹרֶ֣ה אֹתָ֔/ם אֵ֖יךְ יִֽירְא֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
translation:
  language: hi
  text: तब उन याजकों में से एक, जिन्हें वे शोमरोन से निर्वासन में ले गए थे, आया और बेतेल में रहने लगा; वह उन्हें सिखाता था कि याहवे[a] का भय कैसे मानना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम ‘YHWH’ है। इसे ‘याहवे’ के रूप में लिखा गया है; इसका उच्चारण निश्चित नहीं है। परंपरागत अनुवाद ‘प्रभु’ है।
    reason: दिव्य नाम के रूप और परंपरागत अनुवाद की जानकारी
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आकर
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम स्पष्ट करता है और ‘आकर’ अगले क्रियापद से स्वाभाविक रूप से जुड़ता है।
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: उन याजकों में से एक
  rationale: इब्रानी पदबंध किसी बड़े याजक-समूह में से एक व्यक्ति को दर्शाता है।
- source_word: אֲשֶׁר הִגְלוּ מִשֹּׁמְרוֹן
  choice: जिन्हें वे शोमरोन से निर्वासन में ले गए थे
  rationale: हिफ़ील रूप निर्वासित करने या देश से निकालकर ले जाने का अर्थ देता है। बहुवचन कर्ता अनिर्दिष्ट है, इसलिए ‘वे’ को बनाए रखा गया है। संबंधवाचक पद ‘याजकों’ को विशेषित करता है।
- source_word: וַיֵּשֶׁב בְּבֵית אֵל
  choice: बेतेल में रहने लगा
  rationale: ישב यहाँ निवास करने का भाव देता है; ‘रहने लगा’ आधुनिक हिन्दी में वहाँ निवास आरम्भ करने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיְהִי מוֹרֶה אֹתָם
  choice: और उन्हें सिखाने लगा
  rationale: היה के साथ कृदंत जारी या नियमित क्रिया का संकेत दे सकता है; ‘सिखाने लगा’ उस आरम्भ और निरंतर भूमिका को व्यक्त करता है।
- source_word: אֵיךְ יִירְאוּ
  choice: का भय कैसे मानना चाहिए
  rationale: यह केवल भय अनुभव करने नहीं, बल्कि उचित रीति से श्रद्धापूर्ण भय मानने की शिक्षा है; ‘चाहिए’ निर्देशात्मक भाव को प्रकट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है; पाठक के लिए वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष है। उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में रखा गया है; उच्चारण की अनिश्चितता और वैकल्पिक रूप पादटिप्पणी में स्पष्ट हैं।
- issue: יִירְאוּ में ‘भय’ का स्वरूप
  choice: भय मानना
  alternative: डरना
  rationale: संदर्भ धार्मिक उपासना और आचरण की शिक्षा का है। ‘भय मानना’ इब्रानी की श्रद्धा, निष्ठा और भय के तनाव को बनाए रखता है, जबकि केवल ‘डरना’ अर्थ को संकुचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘याजक’, ‘निर्वासन’ और ‘यहोवा का भय मानना’ जैसे बाइबलीय पद संदर्भ की धार्मिक और ऐतिहासिक गंभीरता बनाए रखते हैं।
