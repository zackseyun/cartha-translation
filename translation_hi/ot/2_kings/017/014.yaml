  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
translation:
  language: hi
  text: परन्तु उन्होंने नहीं सुना, और अपनी गर्दन अपने पुरखाओं की गर्दन के समान कठोर कर ली, जिन्होंने अपने परमेश्वर याहवे पर विश्वास नहीं किया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर याहवे पर भरोसा नहीं रखा।” हिब्रू क्रिया वाचा के संबंध में विश्वास करने या भरोसा रखने—दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמֵעוּ
  choice: नहीं सुना
  rationale: שׁמע का मूल अर्थ ‘सुनना/ध्यान देना’ है और वाचा के संदर्भ में इसमें आज्ञा मानने का भाव भी हो सकता है। ‘नहीं सुना’ मूल रूपक को बनाए रखता है; आगे का गर्दन कठोर करने का वर्णन जानबूझकर किए गए प्रतिरोध को स्पष्ट करता है।
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  choice: उन्होंने अपनी गर्दन … कठोर कर ली
  rationale: हिब्रू में ‘गर्दन’ को कठोर करने का सजीव मुहावरा है, जो हठ और अधीन न होने को व्यक्त करता है। हिंदी में इसे बनाए रखना स्वाभाविक और अर्थपूर्ण है।
- source_word: כְּעֹרֶף אֲבוֹתָם
  choice: अपने पुरखाओं की गर्दन के समान
  rationale: मूल पाठ तुलना को पुरखाओं की ‘गर्दन’ से स्पष्ट रूप से जोड़ता है। ठोस बिंब को बनाए रखा गया है, न कि उसे केवल ‘पुरखाओं के समान हठी’ बनाकर व्याख्यायित किया गया है।
- source_word: הֶאֱמִינוּ בַּיהוָה
  choice: याहवे पर विश्वास नहीं किया
  rationale: אמן का हिफ़ील रूप בְּ के साथ किसी पर विश्वास या भरोसा रखने को दर्शाता है। ‘विश्वास नहीं किया’ निकट और स्वाभाविक अनुवाद है; ‘भरोसा नहीं रखा’ को पादटिप्पणी में रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: सर्वनामयुक्त रचना याहवे को उन्हीं का परमेश्वर बताती है; वाचागत संबंध को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: וְלֹא
  choice: परन्तु … नहीं
  rationale: पूर्ववर्ती चेतावनियों के प्रति विरोधी प्रतिक्रिया को देखते हुए וְ का यहाँ प्रतिकूल भाव है, जिसे ‘परन्तु’ सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: הֶאֱמִינוּ का अर्थ
  choice: विश्वास नहीं किया
  alternative: भरोसा नहीं रखा
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं और वाचागत संदर्भ में एक-दूसरे से जुड़े हैं। मुख्य पाठ में निकटतर ‘विश्वास’ रखा गया है तथा वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे हिब्रू वाक्य को हिंदी की स्वाभाविकता और संदर्भ-स्पष्टता के लिए दो वाक्यों में बाँटा गया है; ‘उनके पुरखाओं ने भी’ मूल संबंधवाचक उपवाक्य का आशय बनाए रखता है।
