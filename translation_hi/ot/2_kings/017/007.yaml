  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
translation:
  language: hi
  text: और यह इसलिए हुआ कि इस्राएलियों ने अपने परमेश्वर यहवे के विरुद्ध पाप किया था, जो उन्हें मिस्र देश से, मिस्र के राजा फ़िरौन के हाथ के नीचे से[a] निकाल लाया था, और वे अन्य देवताओं का भय मानते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात फ़िरौन की सत्ता या अधीनता से। इब्रानी में शाब्दिक रूप से “फ़िरौन के हाथ के नीचे से” है।
    reason: हिब्रू उपमा का आशय स्पष्ट करते हुए मुख्य पाठ में उसका रूप सुरक्षित रखना।
  - marker: b
    text: या “अन्य देवताओं की उपासना करते थे।” इब्रानी में “भय मानते थे” है; यह क्रिया श्रद्धा और उपासना-भक्ति को भी व्यक्त कर सकती है।
    reason: मूल क्रिया की वास्तविक अर्थ-व्याप्ति और प्रसंगगत वैकल्पिक अनुवाद बताना।
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: और यह इसलिए हुआ कि
  rationale: यह वाक्यांश आगे की घटना का कारण बताता है। आधुनिक हिन्दी में यह कारणात्मक और आख्यानात्मक दोनों संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָטְאוּ ... לַיהוָה אֱלֹהֵיהֶם
  choice: अपने परमेश्वर यहवे के विरुद्ध पाप किया था
  rationale: חטא के साथ ל यहाँ ‘के विरुद्ध पाप करना’ अर्थ देता है। पूर्ण भूतकाल प्रसंग में पहले हो चुके अपराध को दर्शाता है, और ‘यहवे’ वाचा के व्यक्तिगत नाम को सुरक्षित रखता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल की सन्तान’ सम्भव है, पर राष्ट्रीय समूह के लिए ‘इस्राएली’ आधुनिक हिन्दी में अधिक स्वाभाविक और स्पष्ट है।
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: वही उन्हें मिस्र देश से ... निकाल लाया था
  rationale: עלה का मूल चित्र ‘ऊपर ले आना’ है, पर निर्गमन के प्रसंग में हिन्दी का ‘निकाल लाना’ गंतव्य थोपे बिना उद्धारकारी प्रस्थान को सहज रूप से व्यक्त करता है। ‘वही’ सहभागी पद के परिचयात्मक बल को बनाए रखता है।
- source_word: מִתַּחַת יַד פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: मिस्र के राजा फ़िरौन के हाथ के नीचे से
  rationale: हिब्रू की ‘हाथ के नीचे’ वाली सजीव उपमा को मुख्य पाठ में सुरक्षित रखा गया है; इसका आशय फ़िरौन की सत्ता या अधीनता से है।
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  choice: फिर भी उन्होंने दूसरे देवताओं का भय माना
  rationale: ירא का मूल अर्थ भय मानना/श्रद्धापूर्वक डरना है और देवताओं के संबंध में इसमें उपासना-निष्ठा भी निहित हो सकती है। ‘भय माना’ मूल शब्दावली की व्यापकता बनाए रखता है; ‘फिर भी’ पूर्ववर्ती उद्धार और उनकी अविश्वासयोग्यता के विरोध को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को पदवी में नहीं बदलता।
- issue: दूसरे देवताओं के प्रति ירא का अर्थ
  choice: दूसरे देवताओं का भय माना
  alternative: दूसरे देवताओं की उपासना की
  rationale: संदर्भ मूर्तिपूजक भक्ति का है, पर हिब्रू क्रिया का अर्थक्षेत्र केवल औपचारिक ‘उपासना’ से व्यापक है। मुख्य पाठ उस तनाव को सुरक्षित रखता है और पादटिप्पणी प्रसंगगत अर्थ बताती है।
- issue: निर्गमन का वर्णन करने वाले עלה का रूप
  choice: निकाल लाया था
  alternative: ऊपर ले आया था
  rationale: हिब्रू में ‘ऊपर ले आना’ है, किंतु हिन्दी में बिना बताए गंतव्य की ओर ‘ऊपर’ कहना अस्वाभाविक हो सकता है। ‘निकाल लाया’ मिस्र और फ़िरौन की अधीनता से मुक्ति को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय आख्यान-रजिस्टर अपनाया गया है। ‘इस्राएलियों’ सामान्य पाठक के लिए स्वाभाविक है। ‘हाथ के नीचे’ और ‘भय माना’ जैसे स्रोत-सापेक्ष प्रयोग वास्तविक हिब्रू बिंब और अर्थगत तनाव बचाते हैं; पादटिप्पणियाँ उनका आशय स्पष्ट करती हैं।
