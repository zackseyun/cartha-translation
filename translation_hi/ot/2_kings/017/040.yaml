  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
translation:
  language: hi
  text: परन्तु उन्होंने नहीं सुना; बल्कि वे अपनी पुरानी रीति[a] के अनुसार ही करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पहले के नियम/चलन के अनुसार।’ इब्रानी शब्द מִשְׁפָּט का अर्थ विधान, नियम या प्रचलित रीति हो सकता है; यहाँ यह उनकी पहले से चली आ रही उपासना-पद्धति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: परन्तु ... नहीं
  rationale: संयोजक और निषेध पिछले कथन के साथ हल्का विरोध प्रकट करते हैं; आधुनिक हिन्दी में ‘परन्तु’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמֵעוּ
  choice: उन्होंने नहीं सुना
  rationale: שׁמע का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। ‘नहीं सुना’ मूल की व्यापकता बनाए रखता है और प्रसंग में न मानने का भाव भी देता है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह पदबंध ‘नहीं..., बल्कि...’ का विरोधात्मक संबंध स्थापित करता है।
- source_word: כְּמִשְׁפָּטָם
  choice: अपनी ... रीति के अनुसार
  rationale: מִשְׁפָּט के अर्थों में विधान, नियम और प्रचलित रीति शामिल हैं। यहाँ लगातार किए जा रहे धार्मिक आचरण के प्रसंग में ‘रीति’ सर्वाधिक स्वाभाविक है, जबकि अन्य अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: הָרִאשׁוֹן
  choice: पुरानी
  rationale: यह विशेषण उनके पहले से चले आ रहे आचरण की ओर संकेत करता है; ‘पुरानी’ साधारण आधुनिक हिन्दी में इस संदर्भ को स्पष्ट करती है।
- source_word: הֵם עֹשִׂים
  choice: वे ... करते रहे
  rationale: इब्रानी कृदन्त निरन्तर अथवा अभ्यस्त कार्य का बोध कराता है; ‘करते रहे’ उस जारी व्यवहार को व्यक्त करता है।
