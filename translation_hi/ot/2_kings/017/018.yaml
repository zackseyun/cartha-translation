  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
translation:
  language: hi
  text: याहवे इस्राएल पर बहुत क्रोधित हुआ और उसने उन्हें अपने मुख के सामने से दूर कर दिया[a]। यहूदा के गोत्र को छोड़ कोई नहीं बचा; वही अकेला बचा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी उपस्थिति से।” इब्रानी में अधिक शाब्दिक अर्थ है, “अपने मुख के सामने से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף ... מְאֹד
  choice: बहुत क्रोधित हुआ
  rationale: हित्पएल रूप प्रज्वलित अथवा तीव्र क्रोध व्यक्त करता है, और מְאֹד उसकी तीव्रता बढ़ाता है। ‘बहुत क्रोधित हुआ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दोनों तत्वों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम के चार अक्षरों का शीर्षक से प्रतिस्थापन करने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोध के साथ ב उस व्यक्ति या समुदाय को दर्शाता है जिसकी ओर क्रोध निर्देशित है। हिन्दी में ‘पर’ इसका स्वाभाविक समतुल्य है। संदर्भ में इस्राएल मुख्यतः उत्तरी राज्य और उसके लोगों को सूचित करता है।
- source_word: וַיְסִרֵם
  choice: उसने उन्हें ... हटा दिया
  rationale: सूर धातु का कारक अर्थ किसी को दूर कर देना है। यह अनुवाद निर्वासन की संदर्भगत धारणा को क्रिया में अनावश्यक रूप से जोड़ने के बिना मूल क्रिया को व्यक्त करता है।
- source_word: מֵעַל פָּנָיו
  choice: अपने मुख के सामने से
  rationale: मूल का ठोस, मानवरूपी वाक्यांश ‘उसके मुख के सामने से’ सुरक्षित रखा गया है। अधिक भावार्थपरक विकल्प ‘अपनी उपस्थिति से’ पादटिप्पणी में दिया गया है।
- source_word: לֹא נִשְׁאַר רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: केवल यहूदा का गोत्र ही बचा रहा
  rationale: रַק और לְבַדּוֹ के संयुक्त बल को ‘केवल ... ही’ से व्यक्त किया गया है। इससे अपवाद और यहूदा के अकेले बचे रहने, दोनों पर जोर आता है।
theological_decisions:
- issue: מֵעַל פָּנָיו में परमेश्वर के मुख का मानवरूपी वर्णन
  choice: अपने मुख के सामने से
  alternative: अपनी उपस्थिति से
  rationale: ठोस इब्रानी रूपक पाठ की वाचागत और वाचा-संबंधी तीव्रता बनाए रखता है। अधिक सहज भावार्थ को पादटिप्पणी में रखा गया है, ताकि रूपक मिटे नहीं और उसका आशय भी स्पष्ट रहे।
- issue: इस्राएल का संदर्भगत आशय
  choice: अनुवाद में केवल ‘इस्राएल’ रखा गया है; प्रसंग में यह उत्तरी राज्य और उसके लोगों को सूचित करता है
  alternative: समूची वाचा-प्रजा के व्यापक प्रतिनिधि अर्थ में इस्राएल
  rationale: अध्याय का तत्काल प्रसंग उत्तरी राज्य का पतन और निर्वासन है। पद में व्याख्यात्मक विस्तार जोड़े बिना ऐतिहासिक संदर्भ खुला और स्पष्ट रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य सरल और सार्वजनिक पाठ के योग्य रखा गया है, जबकि ‘अपने मुख के सामने से’ जैसे मूल के ठोस धर्मवैचारिक चित्र को जानबूझकर सुरक्षित रखा गया है।
