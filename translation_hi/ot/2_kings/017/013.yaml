base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
translation:
  language: hi
  text: 'फिर भी, यहोवा ने अपने हर नबी और हर द्रष्टा के द्वारा इस्राएल और यहूदा को चेतावनी दी[a]: “अपने बुरे मार्गों से मुड़ो और मेरी आज्ञाओं और विधियों का पालन करो—उस सारी व्यवस्था के अनुसार, जिसे मानने की आज्ञा मैंने तुम्हारे पूर्वजों[b] को दी थी और जिसे मैंने अपने सेवक नबियों के द्वारा[c] तुम्हारे पास भेजा था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल और यहूदा के विरुद्ध गवाही दी।” इब्रानी क्रिया में गंभीर चेतावनी देने या साक्षी देने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “तुम्हारे पितरों।” यहाँ आशय पूर्वजों से है।'
    reason: lexical_alternative
  - marker: c
    text: या, “अपने सेवक नबियों के माध्यम से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד
  choice: चेतावनी दी
  rationale: हिफ़ील रूप यहाँ गंभीरतापूर्वक चेताने या साक्षी देकर आगाह करने का भाव रखता है। संदर्भ में सीधे आह्वान और आगामी न्याय के कारण ‘चेतावनी दी’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ को रखा गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיַד כָּל נביא/ו כָל חֹזֶה
  choice: अपने हर नबी और हर दर्शी के द्वारा
  rationale: ביד का साधनवाचक अर्थ ‘के द्वारा’ है; נביא/ו में प्रत्यय के कारण ‘अपने’ उचित है। כָּל ... כָּל का वितरणात्मक बल ‘हर ... और हर ...’ से सुरक्षित रहता है, और ‘दर्शी’ को ‘नबी’ से अलग रखा गया है।
- source_word: חֹזֶה
  choice: दर्शी
  rationale: यह दर्शन देखनेवाले भविष्यद्वक्ता के लिए विशिष्ट पद है; ‘दर्शी’ ऐतिहासिक कथन में संक्षिप्त और पारंपरिक हिन्दी समतुल्य है।
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  choice: अपने बुरे मार्गों से फिरो
  rationale: שׁוב का मूल भाव मुड़ना या लौटना है। ‘से फिरो’ नैतिक दिशा-परिवर्तन को सीधे व्यक्त करता है, जबकि ‘मन फिराओ’ अधिक व्याख्यात्मक होता।
- source_word: וְשִׁמְרוּ מִצְוֺתַי חֻקּוֹתַי
  choice: मेरी आज्ञाओं और विधियों का पालन करो
  rationale: שׁמר का विधिक-संधीय अर्थ पालन करना है। ‘आज्ञाएँ’ और ‘विधियाँ’ दोनों अलग कानूनी पदों को बनाए रखते हैं।
- source_word: כְּכָל הַתּוֹרָה
  choice: उस सारी व्यवस्था के अनुसार
  rationale: इस संधीय और विधिक संदर्भ में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त है; ‘सारी’ כָּל की व्यापकता रखता है।
- source_word: אֲשֶׁר צִוִּיתִי אֶת אֲבֹתֵיכֶם
  choice: जिसकी आज्ञा मैंने तुम्हारे पुरखों को दी थी
  rationale: אָבוֹת यहाँ पूर्वजों को सूचित करता है। आधुनिक हिन्दी में ‘पुरखे’ स्वाभाविक है और वाचा-इतिहास का भाव रखता है।
- source_word: וַאֲשֶׁר שָׁלַחְתִּי אֲלֵיכֶם בְּיַד עֲבָדַי הַנְּבִיאִים
  choice: और जिसे मैंने अपने सेवकों, नबियों के द्वारा तुम्हारे पास भेजा था
  rationale: सम्बन्धवाचक वाक्य को निकटतम स्त्रीलिंग पद ‘व्यवस्था’ से जोड़ा गया है, पर भाषा संदेश/निर्देश के नबीगत माध्यम को भी संभव रहने देती है। ביד को फिर ‘के द्वारा’ कहा गया है और ‘सेवकों, नबियों’ में समानाधिकरण सुरक्षित है।
theological_decisions:
- issue: ‘जिसे मैंने ... भेजा था’ का संदर्भ
  choice: व्याकरण में इसे ‘व्यवस्था’ से जोड़ा गया है
  alternative: यह व्यापक रूप से नबियों के संदेशों या ‘फिरो और पालन करो’ वाली पूरी आज्ञा की ओर संकेत कर सकता है
  rationale: निकटतम सम्भावित पूर्वपद व्यवस्था है और सम्बन्धवाचक संरचना उसी वर्णन को आगे बढ़ाती है। फिर भी ‘नबियों के द्वारा’ कथन इस शिक्षा के नए नबीगत संप्रेषण का व्यापक भाव खुला रखता है।
- issue: नबी और दर्शी का संबंध
  choice: दोनों पद अलग रखे गए हैं
  alternative: दोनों को सामान्यतः ‘नबी’ कहा जा सकता था
  rationale: मूल पाठ נָבִיא और חֹזֶה दो पद प्रयोग करता है; उन्हें एक कर देना मूल की शैली और सम्भावित भूमिका-भेद को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यहोवा’, ‘व्यवस्था’, ‘नबी’ और ‘दर्शी’ जैसे पहचाने जाने योग्य बाइबलीय पद बनाए गए हैं। उद्धरण में बहुवचन सम्बोधन मूल के अनुरूप है।
