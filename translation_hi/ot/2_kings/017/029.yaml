source:
  edition: WLC
  text: וַ/יִּהְי֣וּ עֹשִׂ֔ים גּ֥וֹי גּ֖וֹי אֱלֹהָ֑י/ו וַ/יַּנִּ֣יחוּ בְּ/בֵ֣ית הַ/בָּמ֗וֹת אֲשֶׁ֤ר עָשׂוּ֙ הַ/שֹּׁ֣מְרֹנִ֔ים גּ֥וֹי גּוֹי֙ בְּ/עָ֣רֵי/הֶ֔ם אֲשֶׁ֛ר הֵ֥ם יֹשְׁבִ֖ים שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
translation:
  language: hi
  text: परन्तु हर जाति अपने-अपने देवता बनाती रही, और हर जाति ने उन्हें ऊँचे स्थानों के उन पूजा-गृहों में रखा जिन्हें सामरिया के लोगों ने बनाया था, अपने-अपने उन नगरों में जहाँ वे रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  choice: बनाती रही
  rationale: היה + कृदन्त भूतकाल में जारी या बार-बार होने वाली प्रथा व्यक्त करता है; ‘बनाती रही’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: גּוֹי גּוֹי
  choice: हर जाति / अपने-अपने
  rationale: 'दोहराव वितरणात्मक है: अलग-अलग प्रत्येक जाति ने यह काम किया। हिन्दी में ‘हर जाति’ और ‘अपने-अपने’ मिलकर इस बल को स्पष्ट करते हैं।'
- source_word: אֱלֹהָיו
  choice: अपने-अपने देवता
  rationale: एकवचन सामूहिक ‘जाति’ के साथ प्रत्यय प्रत्येक जाति के अपने देवताओं को दर्शाता है; बहुवचन ‘देवता’ אֱלֹהִים के यहाँ बहुदेववादी संदर्भ के अनुकूल है।
- source_word: וַיַּנִּיחוּ
  choice: रखती गई
  rationale: क्रिया का मूल अर्थ रखना या स्थापित करना है। प्रसंग में जातियों की क्रमिक कार्रवाई व्यक्त करने के लिए ‘रखती गई’ स्वाभाविक है।
- source_word: בְּבֵית הַבָּמוֹת
  choice: ऊँचे स्थानों के पूजा-घरों में
  rationale: शाब्दिक रूप ‘ऊँचे स्थानों का घर’ ऐसे धार्मिक ढाँचों का संकेत है जो ऊँचे पूजा-स्थलों से जुड़े थे। ‘पूजा-घर’ अर्थ स्पष्ट रखते हुए ‘घर’ की छवि भी बचाता है।
- source_word: אֲשֶׁר עָשׂוּ הַשֹּׁמְרֹנִים
  choice: जिन्हें सामरिया के लोगों ने बनाया था
  rationale: यह ऐतिहासिक नगर/प्रदेश सामरिया के निवासियों को दर्शाता है; यह रूप बाद के सामरी धार्मिक समुदाय का अनावश्यक संकेत देने से बचता है।
- source_word: בְּעָרֵיהֶם אֲשֶׁר הֵם יֹשְׁבִים שָׁם
  choice: अपने-अपने उन नगरों में ... जहाँ वे रहते थे
  rationale: नगरों पर लगा प्रत्यय जातियों की वितरणात्मक संबद्धता बताता है और अगला उपवाक्य उनके निवास-स्थान की पहचान करता है।
theological_decisions:
- issue: הַשֹּׁמְרֹנִים का ऐतिहासिक संकेत
  choice: सामरिया के लोग
  alternative: सामरी
  rationale: मुख्य पाठ ऐतिहासिक सामरिया के निवासियों को प्राथमिकता देता है और बाद के सामरी पंथ की पहचान को अनावश्यक रूप से आरोपित नहीं करता; संक्षिप्त प्रत्यक्ष विकल्प पादटिप्पणी में रखा गया है।
- issue: जातियों के אֱלֹהָיו की संख्या और स्वामित्व
  choice: अपने-अपने देवता
  alternative: अपने देवता / अपने देव
  rationale: प्रसंग अलग-अलग जातियों द्वारा बनाए गए अनेक देवताओं की बात करता है। हिन्दी में ‘अपने-अपने देवता’ वितरणात्मक भेद और बहुदेववादी संदर्भ दोनों स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ऊँचे स्थान’ पारंपरिक बाइबलीय धार्मिक शब्दावली को बनाए रखता है, जबकि ‘पूजा-घर’ उसके साथ जुड़े ढाँचे का अर्थ सहज बनाता है। वितरणात्मक हिब्रू पुनरुक्ति को ‘हर जाति’ और ‘अपने-अपने’ द्वारा व्यक्त किया गया है।
