    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  choice: होशे के विरुद्ध चढ़ आया
  rationale: सैनिक प्रसंग में यह इब्रानी मुहावरा किसी के विरुद्ध सेना लेकर आगे बढ़ने को व्यक्त करता है। ‘चढ़ आया’ मूल की गति और सैन्य भाव को बनाए रखता है, बिना यह निश्चित किए कि पूर्ण आक्रमण हो चुका था। सर्वनाम को प्रसंगानुसार ‘होशे’ से स्पष्ट किया गया है।
- source_word: שַׁלְמַנְאֶסֶר
  choice: शल्मनेसेर
  rationale: व्यक्तिनाम का प्रचलित और स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: यह संबंधवाचक पद शल्मनेसेर की उपाधि और राज्य बताता है; आधुनिक हिन्दी में यह स्वाभाविक शब्दक्रम है।
- source_word: וַיְהִי לוֹ ... עֶבֶד
  choice: उसका सेवक बन गया
  rationale: रचना स्थिति-परिवर्तन बताती है। ‘सेवक’ मूल עֶבֶד को बनाए रखता है, जबकि इस राजनैतिक प्रसंग में इसका आशय अधीनस्थ राजा से है, निजी दास से नहीं।
- source_word: וַיָּשֶׁב לוֹ מִנְחָה
  choice: उसे कर देने लगा
  rationale: यहाँ מִנְחָה अधीनस्थ राजा द्वारा प्रभु-राजा को दिया जाने वाला कर है। क्रिया को ‘देने लगा’ कहना होशे की आरम्भ हुई नियमित अधीनता को सहज हिन्दी में व्यक्त करता है।
- source_word: מִנְחָה
  choice: कर
  rationale: भूराजनीतिक प्रसंग में अर्थ भेंट या अन्नबलि नहीं, बल्कि अधीन शासक से लिया जाने वाला कर/नज़राना है। ‘कर’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
