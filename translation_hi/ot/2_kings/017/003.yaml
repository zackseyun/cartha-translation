  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
translation:
  language: hi
  text: अश्शूर का राजा शल्मनेसेर होशे के विरुद्ध चढ़ आया, और होशे उसका सेवक[a] बन गया और उसे कर चुकाया।
  philosophy: optimal-equivalence
  footnotes:
