  edition: WLC
  text: וַ/יְהִ֗י בִּ/תְחִלַּת֙ שִׁבְתָּ֣/ם שָׁ֔ם לֹ֥א יָרְא֖וּ אֶת יְהוָ֑ה וַ/יְשַׁלַּ֨ח יְהוָ֤ה בָּ/הֶם֙ אֶת הָ֣/אֲרָי֔וֹת וַ/יִּֽהְי֥וּ הֹרְגִ֖ים בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
translation:
  language: hi
  text: जब वे पहले-पहल वहाँ बसने लगे, तब वे याहवे का भय नहीं रखते थे[a]। इसलिए याहवे ने उनके बीच सिंहों को भेजा, और वे उनमें से कुछ लोगों को मारते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का श्रद्धापूर्वक आदर नहीं करते थे।” इब्रानी में ‘भय’ का अर्थ केवल आतंक नहीं, बल्कि श्रद्धा और याहवे के प्रति निष्ठापूर्ण आदर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם שָׁם
  choice: जब वे आरम्भ में वहाँ रहने लगे
  rationale: यह वाक्यांश वहाँ उनके निवास के आरम्भिक समय को दर्शाता है। हिंदी में क्रियात्मक रचना स्वाभाविक है और मूल का कालगत भाव बनाए रखती है।
- source_word: יָרְאוּ אֶת־יְהוָה
  choice: याहवे का भय नहीं मानते थे
  rationale: यहाँ ‘भय’ केवल आतंक नहीं, बल्कि परमेश्वर के प्रति श्रद्धापूर्ण भय और उचित मान-सम्मान को भी समेटता है; इसलिए मूल की व्यापकता को बनाए रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיְשַׁלַּח ... בָּהֶם אֶת הָאֲרָיוֹת
  choice: उनके बीच सिंह भेजे
  rationale: पूर्वसर्ग בָּהֶם यहाँ सिंहों को उनके बीच भेजे जाने का भाव देता है; ‘उनके बीच’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: וַיִּהְיוּ הֹרְגִים בָּהֶם
  choice: वे उनमें से कुछ लोगों को मारते रहे
  rationale: היה और कृदंत की रचना जारी या बार-बार होने वाली क्रिया व्यक्त करती है। ‘मारते रहे’ उस पक्ष को रखता है, और ‘कुछ लोगों को’ בָּהֶם के अंशवाचक प्रभाव को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: याहवे का ‘भय मानना’
  choice: भय मानना
  alternative: श्रद्धा करना; उपासना करना
  rationale: मूल क्रिया में आतंक से अधिक श्रद्धा और परमेश्वर के प्रति उचित निष्ठा का भाव हो सकता है। ‘भय मानना’ मूल शब्दावली और उसकी अर्थगत व्यापकता को सुरक्षित रखता है; ‘उपासना करना’ अर्थ को अनावश्यक रूप से संकुचित करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘सिंह’ ने बाइबिलीय गद्य की औपचारिकता बनाए रखी है, जबकि ‘रहने लगे’ और ‘मारते रहे’ मूल के काल और क्रिया-पक्ष को स्वाभाविक हिंदी में व्यक्त करते हैं।
