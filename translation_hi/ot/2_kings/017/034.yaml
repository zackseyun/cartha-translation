base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
translation:
  language: hi
  text: आज तक वे अपनी पुरानी रीतियों[a] के अनुसार चलते हैं। वे याहवे का भय नहीं मानते[b]। वे न अपनी विधियों और नियमों के अनुसार चलते हैं, न उस व्यवस्था और आज्ञा के अनुसार, जिसका पालन करने की आज्ञा याहवे ने याकूब के पुत्रों[c] को दी थी—उसी याकूब को उसने इस्राएल नाम दिया था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहले के नियमों’ अथवा ‘पहले की प्रथाओं’।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे का भय मानना’ का अर्थ उससे डरना ही नहीं, बल्कि उसके प्रति श्रद्धा और वाचा की निष्ठा रखना भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘याकूब के पुत्रों’; यहाँ इससे सामूहिक रूप से याकूब के वंशज अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: d
    text: अर्थात याकूब; उत्पत्ति 32:28; 35:10 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  choice: अपनी पुरानी रीतियों के अनुसार
  rationale: यहाँ מִשְׁפָּטִים का आशय पहले वर्णित चली आ रही धार्मिक प्रथाओं से है; ‘रीतियाँ’ न्यायिक निर्णय का अनावश्यक अर्थ लाए बिना संदर्भगत भाव व्यक्त करता है।
- source_word: יְרֵאִים אֶת־יְהוָה
  choice: याहवे का भय मानते
  rationale: ‘भय मानना’ इब्रानी मुहावरे में भय और श्रद्धापूर्ण निष्ठा, दोनों की गुंजाइश बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  choice: अपनी विधियों और नियमों के अनुसार
  rationale: दोनों कानूनी-वाचागत पदों का भेद ‘विधियों’ और ‘नियमों’ से रखा गया है; ‘अपनी’ इब्रानी बहुवचन प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכַתּוֹרָה וְכַמִּצְוָה
  choice: उस व्यवस्था और आज्ञा के अनुसार
  rationale: תּוֹרָה के लिए वाचागत संदर्भ में प्रचलित ‘व्यवस्था’ और एकवचन מִצְוָה के लिए ‘आज्ञा’ रखा गया है।
- source_word: בְּנֵי יַעֲקֹב
  choice: याकूब के पुत्रों
  rationale: मूल के पुल्लिंग बहुवचन को बनाए रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यह सामूहिक वंश-सूचक अभिव्यक्ति है।
- source_word: אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  choice: उसी याकूब को उसने इस्राएल नाम दिया था
  rationale: स्पष्ट हिन्दी में संबंधवाचक उपवाक्य का वास्तविक लक्ष्य याकूब बताया गया है और नाम बदलने का अर्थ सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है, उपाधि नहीं।
- issue: ‘अपनी विधियों और नियमों’ का संदर्भ
  choice: मुख्य पाठ में सर्वनामगत अस्पष्टता को बनाए रखना
  alternative: इसे स्पष्ट रूप से उन लोगों की स्वयं की धार्मिक प्रथाएँ या स्पष्ट रूप से याहवे की विधियाँ कहना
  rationale: इब्रानी में केवल तीसरे पुरुष बहुवचन प्रत्यय हैं। निकट संदर्भ में उनके अपने पुराने आचरण और आगे याहवे की व्यवस्था, दोनों मौजूद हैं; इसलिए अनिश्चित संदर्भ को सिद्धांतगत व्याख्या से नहीं भरा गया।
- issue: ‘याहवे का भय’ का आशय
  choice: भय नहीं मानते
  alternative: आदर नहीं करते / श्रद्धा नहीं रखते
  rationale: मूल मुहावरे में वास्तविक भय तथा श्रद्धापूर्ण वाचा-निष्ठा दोनों का तनाव है; ‘भय मानना’ इसे नरम करके केवल सम्मान नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कानूनी-वाचागत शब्दावली के लिए ‘विधियाँ’, ‘नियम’, ‘व्यवस्था’ और ‘आज्ञा’ का भेद रखा गया है। लंबे इब्रानी वाक्य को पठनीयता के लिए तीन हिन्दी वाक्यों में बाँटा गया है; अंतिम डैश नाम-परिवर्तन वाले उपवाक्य का लक्ष्य स्पष्ट करता है।
