  edition: WLC
  text: וַ/יְצַ֨ו מֶֽלֶךְ אַשּׁ֜וּר לֵ/אמֹ֗ר הֹלִ֤יכוּ שָׁ֨מָּ/ה֙ אֶחָ֤ד מֵ/הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר הִגְלִיתֶ֣ם מִ/שָּׁ֔ם וְ/יֵלְכ֖וּ וְ/יֵ֣שְׁבוּ שָׁ֑ם וְ/יֹרֵ֕/ם אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
translation:
  language: hi
  text: तब अश्शूर के राजा ने आज्ञा दी, “जिन याजकों को तुम वहाँ से निर्वासित किया था, उनमें से एक को वहाँ भेजो[a]। वह वहाँ जाकर रहे[b] और उस देश के देवता[c] की रीति[d] लोगों को सिखाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वहाँ ले जाओ।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में यहाँ “वे जाएँ” और “वे रहें” बहुवचन क्रियाएँ हैं, यद्यपि प्रसंग में आशय एक याजक से है और अगली क्रिया एकवचन है।
    reason: textual_variant
  - marker: c
    text: या “उस देश के परमेश्वर।” मुख्य पाठ में “देवता” अश्शूरी राजा की दृष्टि को दर्शाता है।
    reason: alternative_reading
  - marker: d
    text: या “विधि,” “नियम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה का यहाँ राजकीय आदेश देना अर्थ है; ‘आज्ञा दी’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: इब्रानी संबंधसूचक रचना का मानक और सहज हिन्दी रूप।
- source_word: הֹלִיכוּ שָׁמָּה
  choice: वहाँ भेजो
  rationale: הלख के हिफ़ील रूप का अर्थ किसी को जाने के लिए प्रवृत्त करना या पहुँचाना है। राजकीय आदेश के संदर्भ में ‘वहाँ भेजो’ सर्वाधिक स्वाभाविक है, जबकि ‘ले जाओ’ भी संभव है।
- source_word: אֶחָד מֵהַכֹּהֲנִים
  choice: उनमें से एक
  rationale: ‘जिन याजकों… उनमें से एक’ अंशवाचक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר הִגְלִיתֶם מִשָּׁם
  choice: जिन याजकों को तुम वहाँ से निर्वासित करके लाए थे
  rationale: גלה के हिफ़ील में निर्वासन/देश-निकाला निहित है। प्रसंग के अनुसार उन्हें सामरिया से अश्शूर ले जाया गया था, इसलिए ‘निर्वासित करके लाए थे’ दिशा को हिन्दी में स्पष्ट करता है।
- source_word: וְיֵלְכוּ וְיֵשְׁבוּ שָׁם
  choice: वह जाकर वहीं रहे
  rationale: मसोरेटिक पाठ में दोनों क्रियाएँ बहुवचन हैं, पर पूर्वपद ‘एक’ और अगली क्रिया एकवचन है। मुख्य पाठ आशय के अनुसार एकवचन रखता है और पाठगत संख्या-असंगति टिप्पणी में सुरक्षित है।
- source_word: וְיֹרֵם
  choice: लोगों को सिखाए
  rationale: ירה के हिफ़ील का अर्थ ‘सिखाना/निर्देश देना’ है और प्रत्यय बहुवचन कर्म को सूचित करता है; हिन्दी में ‘लोगों को’ संदर्भगत कर्म स्पष्ट करता है।
- source_word: מִשְׁפַּט
  choice: रीति
  rationale: यहाँ מִשְׁפַּט उस देवता की अपेक्षित धार्मिक विधि या व्यवहार को दर्शाता है; ‘रीति’ ‘कानून’ की अपेक्षा इस व्यावहारिक-धार्मिक अर्थ को बेहतर व्यक्त करती है।
- source_word: אֱלֹהֵי הָאָרֶץ
  choice: वहाँ के देवता
  rationale: शाब्दिक अर्थ ‘उस देश/भूमि का देवता’ है। ‘वहाँ के देवता’ सहज हिन्दी में अश्शूरी राजा की क्षेत्रीय-देवता वाली दृष्टि को बनाए रखता है।
theological_decisions:
- issue: אֱלֹהֵי הָאָרֶץ में देवता/परमेश्वर का चयन
  choice: वहाँ के देवता
  alternative: उस देश के परमेश्वर
  rationale: वचन अश्शूरी राजा की दृष्टि से बोला गया है, जिसमें देवता को किसी भूभाग से संबद्ध माना गया है। ‘देवता’ उस वक्ता-दृष्टि को सुरक्षित रखता है, जबकि टिप्पणी यह बताती है कि ‘परमेश्वर’ भी संदर्भगत पहचान के आधार पर संभव है।
- issue: וְיֵלְכוּ / וְיֵשְׁבוּ की बहुवचन क्रियाएँ
  choice: आशय के अनुसार एकवचन—‘वह जाकर वहीं रहे’
  alternative: रूप की दृष्टि से बहुवचन—‘वे जाकर वहीं रहें’
  rationale: निकटतम पूर्वपद ‘याजकों में से एक’ है और इसके बाद וְיֹרֵם एकवचन है। पठनीय हिन्दी में एकवचन आशय उचित है, पर मूल की संख्या-असंगति टिप्पणी में दर्ज की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली गरिमापूर्ण किंतु सरल रखी गई है। ‘याजक,’ ‘निर्वासित,’ और ‘रीति’ व्यापक बाइबलीय प्रयोग से परिचित शब्द हैं। प्रत्यक्ष कथन में अस्वाभाविक शाब्दिकता से बचते हुए मूल की धार्मिक और व्याकरणिक अस्पष्टताएँ टिप्पणियों में सुरक्षित रखी गई हैं।
