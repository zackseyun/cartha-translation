base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
translation:
  language: hi
  text: तब अश्शूर के राजा ने होशे के षड्यंत्र का पता लगाया[a], क्योंकि उसने मिस्र के राजा सो के पास दूत भेजे थे[b] और अश्शूर के राजा को हर वर्ष की तरह कर नहीं चढ़ाया था[c]। इसलिए अश्शूर के राजा ने उसे हिरासत में लिया और बाँधकर बंदीगृह में डाल दिया[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होशे में राजद्रोह पाया।” इब्रानी में शाब्दिक रूप से “होशे में षड्यंत्र पाया” है, अर्थात उसकी विश्वासघाती योजना का पता लगाया।
    reason: lexical_alternative
  - marker: b
    text: “सो” इब्रानी नाम का लिप्यंतरण है। इस मिस्री राजा की ऐतिहासिक पहचान अनिश्चित है।
    reason: cultural_note
  - marker: c
    text: या, “कर ऊपर नहीं भेजा था”; अधिक भावानुवाद में, “कर नहीं चुकाया था।”
    reason: lexical_alternative
  - marker: d
    text: 'इब्रानी दो अलग कार्रवाइयाँ बताता है: अश्शूर के राजा ने पहले होशे को हिरासत में लिया, फिर उसे बाँधकर बंदीगृह में डाल दिया।'
    reason: textual_clarification
lexical_decisions:
- source_word: וַיִּמְצָא ... בְּהוֹשֵׁעַ קֶשֶׁר
  choice: होशे में षड्यंत्र पाया
  rationale: यह इब्रानी मुहावरे की संरचना और राजनीतिक विश्वासघात के भाव को निकटता से रखता है; हिन्दी में इसका आशय होशे की षड्यंत्रकारी गतिविधि का पता लगना है।
- source_word: שָׁלַח מַלְאָכִים
  choice: दूत भेजे थे
  rationale: राजनयिक संदर्भ में מַלְאָכִים के लिए ‘दूत’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: סוֹא
  choice: सो
  rationale: इब्रानी नाम का लिप्यंतरण रखा गया है, क्योंकि इस मिस्री राजा की ऐतिहासिक पहचान अनिश्चित है।
- source_word: מִנְחָה ... הֶעֱלָה
  choice: कर नहीं चढ़ाया था
  rationale: राजा और अधीनस्थ शासक के संदर्भ में מִנְחָה वार्षिक कर/नज़राने को दर्शाता है; ‘चढ़ाया’ הֶעֱלָה की दिशात्मक छवि भी बनाए रखता है।
- source_word: כְּשָׁנָה בְשָׁנָה
  choice: हर वर्ष की तरह
  rationale: यह वार्षिक नियमितता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעְצְרֵהוּ
  choice: उसे हिरासत में लिया
  rationale: पहली क्रिया को आरम्भिक रोक या गिरफ्तारी के रूप में प्रस्तुत करता है और अगली क्रिया से उसका भेद बनाए रखता है।
- source_word: וַיַּאַסְרֵהוּ בֵּית כֶּלֶא
  choice: बाँधकर बन्दीगृह में डाल दिया
  rationale: אָסַר के मूल ‘बाँधना’ भाव और בֵּית כֶּלֶא के कारावास-स्थान, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
