  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
translation:
  language: hi
  text: अव्वी लोगों[a] ने निभहज़ और तर्ताक बनाए। सपरवैम के लोग अपने बेटों को आग में जलाकर सपरवैम के देवताओं अद्रम्मेलेक और अनम्मेलेक को चढ़ाते थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अव्वीम।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे अपने बेटों को जलाकर इन देवताओं के लिए बाल-बलि चढ़ाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  choice: अव्वी लोग
  rationale: यह किसी जाति या समुदाय का बहुवचन नाम है; इसे अर्थानुवाद करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: עָשׂוּ
  choice: बनाए
  rationale: मूल क्रिया का सीधा अर्थ ‘बनाना’ है। इससे पूजा के लिए इन देवताओं की प्रतिमाएँ बनाने का संदर्भ झलकता है, पर मुख्य पाठ में ‘मूर्तियाँ’ जोड़कर मूल से अधिक स्पष्ट नहीं किया गया।
- source_word: נִבְחַז וְאֶת־תַּרְתָּק
  choice: निभहज़ और तर्ताक
  rationale: ये देवताओं के व्यक्तिवाचक नाम हैं, इसलिए इनका लिप्यंतरण किया गया है।
- source_word: הַסְפַרְוִים
  choice: सपरवैम के लोग
  rationale: यह सपरवैम के निवासियों को सूचित करने वाला जातिवाचक बहुवचन है; हिन्दी में स्थान के नाम के साथ ‘के लोग’ स्वाभाविक और स्पष्ट है।
- source_word: שֹׂרְפִים
  choice: जलाकर … चढ़ाते थे
  rationale: कृदंत यहाँ उनकी प्रचलित या बार-बार की जाने वाली उपासना-रीति बताता है। हिन्दी का अपूर्ण भूतकाल ‘चढ़ाते थे’ इस अभ्यस्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת־בְּנֵיהֶם בָּאֵשׁ
  choice: अपने बेटों को आग में जलाकर
  rationale: בְּנֵיהֶם का लिंग-विशिष्ट अर्थ ‘अपने बेटे’ है और בָּאֵשׁ का अर्थ इस बलिदान-संदर्भ में ‘आग में’ है।
- source_word: לְאַדְרַמֶּלֶךְ וַעֲנַמֶּלֶךְ
  choice: अद्रम्मेलेक और अनम्मेलेक … को
  rationale: לְ बलिदान पाने वाले देवताओं की ओर समर्पण सूचित करता है; हिन्दी में ‘को चढ़ाना’ यही संबंध सहजता से व्यक्त करता है।
- source_word: אֱלֹהֵי סְפַרְוָיִם
  choice: सपरवैम के देवता
  rationale: यह संबंधवाचक पद अद्रम्मेलेक और अनम्मेलेक की पहचान सपरवैम से जुड़े देवताओं के रूप में करता है।
theological_decisions:
- issue: क्या निभहज़ और तर्ताक को मुख्य पाठ में स्पष्ट रूप से ‘मूर्तियाँ’ या ‘प्रतिमाएँ’ कहा जाए
  choice: मूल के समान केवल ‘निभहज़ और तर्ताक बनाए’
  alternative: निभहज़ और तर्ताक की मूर्तियाँ बनाई
  rationale: इब्रानी पाठ में ‘बनाए’ के बाद सीधे नाम आते हैं। संदर्भ में पूजा की वस्तुएँ बनाना निहित है, लेकिन ‘मूर्तियाँ’ जोड़ने से मूल की अपेक्षा अर्थ अधिक निश्चित हो जाएगा।
- issue: क्या בְּנֵיהֶם को सामान्य बनाकर ‘बच्चे’ कहा जाए
  choice: अपने बेटे
  alternative: अपने बच्चे
  rationale: मूल शब्द यहाँ पुल्लिंग ‘बेटे’ कहता है; इसलिए उसकी विशिष्टता सुरक्षित रखी गई है।
- issue: שֹׂרְפִים के अभ्यस्त भाव और बलिदान-संबंध को हिन्दी में कैसे व्यक्त किया जाए
  choice: आग में जलाकर … को चढ़ाते थे
  alternative: आग में जला रहे थे
  rationale: संदर्भ किसी एक जारी घटना के बजाय लोगों की प्रचलित धार्मिक रीति का वर्णन करता है। ‘चढ़ाते थे’ लक्ष्यसूचक לְ को भी स्वाभाविक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। जाति और देवताओं के नामों का देवनागरी लिप्यंतरण किया गया है। अभ्यस्त क्रिया के लिए ‘चढ़ाते थे’ चुना गया है; डैश में रखा समानाधिकरण दोनों नामों को सपरवैम के देवताओं के रूप में पहचानता है।
