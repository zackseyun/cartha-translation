source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּ/כָל חַטֹּ֥אות יָרָבְעָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה לֹא סָ֖רוּ מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/022.yaml
  text: And the children of Israel walked in all the sins that Jeroboam had committed[a]; they did not turn away from them.
translation:
  language: hi
  text: इस्राएली उन सभी पापों की राह पर चलते रहे जो यारोबाम ने किए थे; वे उससे[a] नहीं हटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ स्त्रीलिंग एकवचन ‘उससे’ है; संभवतः इसका संकेत अभी बताई गई पापमय राह या रीति की ओर सामूहिक रूप से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: राह पर चलते रहे
  rationale: הלך के साथ ב यहाँ आचरण की रीति पर चलने का भाव देता है। हिंदी में ‘पापों की राह पर चलते रहे’ मूल रूपक और निरंतर व्यवहार, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: आधुनिक सामान्य हिंदी में यह राष्ट्रीय समुदाय का स्पष्ट और स्वाभाविक नाम है; अर्थ की दृष्टि से ‘इस्राएल की संतान’ के बराबर है।
- source_word: בְּכָל חַטֹּאות
  choice: उन सभी पापों की राह पर
  rationale: בְּ के आचरणगत अर्थ और כָּל के समग्र भाव को बनाए रखते हुए חַטֹּאות को सीधे ‘पापों’ के रूप में प्रस्तुत किया गया है।
- source_word: יָרָבְעָם אֲשֶׁר עָשָׂה
  choice: जो यारोबाम ने किए थे
  rationale: עשה का मूल और स्वाभाविक अर्थ ‘करना’ है। हिंदी में पाप ‘करना’ सहज प्रयोग है और पूर्वकालिक संबंध ‘किए थे’ से स्पष्ट होता है।
- source_word: לֹא סָרוּ
  choice: नहीं हटे
  rationale: סור का अर्थ हटना, मुड़ना या अलग होना है। ‘नहीं हटे’ उनके उस पापमय मार्ग पर बने रहने को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: מִמֶּנָּה
  choice: उससे
  rationale: मूल इब्रानी में सर्वनाम स्त्रीलिंग एकवचन है। ‘उससे’ इस व्याकरणिक एकवचन को सुरक्षित रखता है और सामूहिक रूप से अभी बताई गई पापमय राह की ओर संकेत करता है।
theological_decisions:
- issue: מִמֶּנָּה के एकवचन सर्वनाम का संदर्भ
  choice: ‘उससे’ रखकर मूल का एकवचन सुरक्षित रखा गया है; इसे सामूहिक पापमय राह के संदर्भ में समझा जा सकता है।
  alternative: ‘उनसे’, जो निकटवर्ती बहुवचन ‘पापों’ को सीधे संदर्भित करता है।
  rationale: इब्रानी पाठ में प्रत्यय स्त्रीलिंग एकवचन है। उसे बहुवचन में बदलने के बजाय मुख्य पाठ में वास्तविक व्याकरणिक तनाव बनाए रखा गया है और पादटिप्पणी में संभावित संदर्भ स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राह पर चलते रहे’ मूल नैतिक-आचरण संबंधी रूपक को बनाए रखता है; ‘इस्राएली’ अनावश्यक शब्दशःपन से बचाता है।
