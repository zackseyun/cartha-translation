source:
  edition: WLC
  text: וַ/יֵּֽלְכוּ֙ בְּ/חֻקּ֣וֹת הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/מַלְכֵ֥י יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
translation:
  language: hi
  text: और वे उन जातियों की विधियों के अनुसार चले[a], जिन्हें यहोवा ने इस्राएलियों के सामने से निकाल दिया था[b], और उन [विधियों] के अनुसार भी जो इस्राएल के राजाओं ने बनाई थीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन जातियों के रीति-रिवाजों के अनुसार चले।”
    reason: חֻקּוֹת औपचारिक विधियों के साथ स्थापित रीति-रिवाजों का भी संकेत कर सकता है।
  - marker: b
    text: या, “जिन्हें यहोवा ने इस्राएलियों के आगे से बेदखल कर दिया था।”
    reason: הוֹרִישׁ में देश से निकालने के साथ अधिकार या भूमि से वंचित करने का भाव भी हो सकता है।
  - marker: c
    text: 'इब्रानी में दूसरे खंड में “विधियों” शब्द स्पष्ट रूप से नहीं है; शाब्दिक क्रम है: “और इस्राएल के राजाओं [के अनुसार] जो उन्होंने किया।”'
    reason: अंतिम उपवाक्य लुप्तपदीय है। कोष्ठक में दिया “विधियों” पहले खंड से संदर्भानुसार जोड़ा गया है, ताकि हिन्दी वाक्य पूरा हो, पर मूल की संक्षिप्तता भी बनी रहे।
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: चलते रहे / चले
  rationale: הלך का मूल अर्थ ‘चलना’ है, पर यहाँ यह आचरण और जीवन-पद्धति का रूपक है। ‘विधियों के अनुसार चलते रहे’ उस इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּחֻקּוֹת
  choice: विधियों के अनुसार
  rationale: חֻקּוֹת निर्धारित नियमों या स्थापित प्रथाओं को सूचित करता है। ‘विधियाँ’ औपचारिक अर्थ को रखता है, जबकि ‘के अनुसार’ हिन्दी में בְּ के व्यवहारगत अर्थ को स्पष्ट करता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: यहाँ גּוֹיִם देश की गैर-इस्राएली जातियों को दर्शाता है। ‘जातियाँ’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और धर्मसिद्धान्त की दृष्टि से तटस्थ है।
- source_word: אֲשֶׁר הוֹרִישׁ יְהוָה מִפְּנֵי
  choice: जिन्हें यहोवा ने ... के सामने से निकाल दिया था
  rationale: Hiphil הוֹרִישׁ का अर्थ अधिकार से वंचित करना या देश से निकाल देना हो सकता है। ‘निकाल दिया’ सन्दर्भ में स्वाभाविक है और מִפְּנֵי को ‘के सामने से’ द्वारा दर्शाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल की सन्तान’ है, पर यह एक जातीय पदनाम है। ‘इस्राएली’ आधुनिक हिन्दी में उसी समुदाय को स्पष्ट और समावेशी ढंग से व्यक्त करता है।
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  choice: उन विधियों के अनुसार भी ... जिन्हें इस्राएल के राजाओं ने बनाया था
  rationale: इब्रानी उपवाक्य संक्षिप्त/लुप्तपदीय है और पहले आए חֻקּוֹת को अन्तर्निहित मानता है। हिन्दी में ‘विधियों’ को दोहराने से वाक्य स्पष्ट होता है, जबकि עָשׂוּ का सीधा अर्थ ‘बनाया’ सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी में प्रचलित और पहचाना जाने वाला रूप ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: अन्तिम उपवाक्य का लुप्त पद
  choice: पहले आए ‘विधियों’ को अन्तर्निहित मानकर दोहराया गया
  alternative: ‘और जो इस्राएल के राजाओं ने किया था’
  rationale: वाक्य की समानान्तर रचना संकेत करती है कि लोग जातियों की विधियों और राजाओं द्वारा बनाई गई विधियों के अनुसार चले। फिर भी मूल की व्याकरणिक संक्षिप्तता के कारण अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चलते रहे’ नैतिक आचरण के इब्रानी रूपक को बनाए रखता है; ‘विधियाँ’ औपचारिकता और प्रथा—दोनों की सम्भावना को सँभालता है। विरामचिह्न द्वारा पद के दो समानान्तर दोषों को स्पष्ट किया गया है।
