base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/006.yaml
  text: In the ninth year of Hoshea[a], the king of Assyria captured Samaria and carried Israel away to Assyria, and settled them in Halah, and on the Habor, the river of Gozan[b], and in the cities of Media.
translation:
  language: hi
  text: होशे के राज्य के नौवें वर्ष में अश्शूर के राजा ने शोमरोन पर अधिकार कर लिया। वह इस्राएल को अश्शूर निर्वासित कर दिया[a] और उन्हें हलह में, गोजान की नदी हाबोर के पास[b] और मादै के नगरों में बसाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल को अश्शूर ले गया।” इब्रानी क्रिया बलपूर्वक देश से हटाकर निर्वासन में ले जाने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या “हाबोर में, जो गोजान की नदी है।” इब्रानी पदबंध हाबोर को गोजान क्षेत्र की नदी के रूप में पहचान सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת הַתְּשִׁיעִית לְהוֹשֵׁעַ
  choice: होशे के राज्य के नौवें वर्ष में
  rationale: लְהוֹשֵׁעַ यहाँ राजकीय वर्ष का संकेत देता है; हिन्दी में ‘के राज्य के’ जोड़ने से आशय स्वाभाविक और स्पष्ट होता है।
- source_word: לָכַד
  choice: पर अधिकार कर लिया
  rationale: किसी नगर की सैनिक विजय के लिए यह सहज आधुनिक हिन्दी है और ‘पकड़ लिया’ की संभावित भ्रांति से बचाती है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: שֹׁמְרוֹן
  choice: शोमरोन
  rationale: इस स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַיֶּגֶל אֶת־יִשְׂרָאֵל אַשּׁוּרָה
  choice: इस्राएल को बंदी बनाकर अश्शूर ले गया
  rationale: גלה के कारक रूप में बलपूर्वक निर्वासन का भाव है; यह अनुवाद सामान्य पाठक के लिए स्वाभाविक रहते हुए जबरन हटाए जाने को व्यक्त करता है।
- source_word: וַיֹּשֶׁב אֹתָם
  choice: उन्हें ... बसाया
  rationale: ישׁב के हिफ़ील रूप का अर्थ यहाँ लोगों को निर्दिष्ट स्थानों में बसाना है।
- source_word: בַּחְלַח
  choice: हलह में
  rationale: पूर्वसर्ग सहित स्थान-नाम का सीधा हिन्दी रूप।
- source_word: וּבְחָבוֹר נְהַר גּוֹזָן
  choice: गोजान की नदी हाबोर के किनारे
  rationale: नदी के संदर्भ में ב को ‘के किनारे’ कहना स्वाभाविक है; ‘गोजान की नदी’ मूल संबंधवाचक रचना को बनाए रखता है।
- source_word: וְעָרֵי מָדָי
  choice: और मादियों के नगरों में
  rationale: מָדָי लोगों/प्रदेश की सामूहिक संज्ञा है; ‘मादियों के नगर’ हिन्दी में ऐतिहासिक अर्थ स्पष्ट करता है।
