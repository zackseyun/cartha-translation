base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
translation:
  language: hi
  text: वे याहवे का भय मानते थे, और[a] अपने देवताओं की सेवा करते थे—उन जातियों की रीति के अनुसार, जिनके बीच से उन्हें निर्वासित किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु।” इब्रानी में सामान्य संयोजक “और” है; प्रसंग में दोनों आचरणों के बीच विरोध भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम की प्रचलित विद्वत्तापूर्ण लिप्यंतरण-परंपरा को हिन्दी देवनागरी में रखा गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: הָיוּ יְרֵאִים
  choice: भय मानते थे
  rationale: היה के साथ कृदंत यहाँ निरंतर अथवा प्रचलित आचरण दर्शाता है। हिन्दी में ‘भय मानते थे’ श्रद्धामिश्रित भय और नियमित व्यवहार दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने देवताओं
  rationale: सर्वनामिक प्रत्यय उनके अपने देवताओं को सूचित करता है। ‘अपने’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הָיוּ עֹבְדִים
  choice: सेवा करते थे
  rationale: देवताओं के संदर्भ में עבד धार्मिक सेवा या आराधना को दर्शाता है। ‘सेवा करते थे’ मूल क्रिया के निकट रहते हुए धार्मिक आशय बनाए रखता है।
- source_word: כְּמִשְׁפַּט
  choice: रीति के अनुसार
  rationale: इस संदर्भ में מִשְׁפָּט न्यायिक निर्णय नहीं, बल्कि प्रचलित रीति या व्यवहार है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: यहाँ शब्द उन विभिन्न जनसमूहों या राष्ट्रों के लिए है जहाँ से लोगों को लाया गया था; ऐतिहासिक हिन्दी में ‘जातियाँ’ इस बहुवचन को सहज रूप से व्यक्त करता है।
- source_word: אֲשֶׁר הִגְלוּ אֹתָם מִשָּׁם
  choice: जिनके बीच से उन्हें निर्वासित किया गया था
  rationale: इब्रानी सक्रिय बहुवचन को यहाँ अनिर्दिष्ट कर्ता के साथ निष्क्रिय अर्थ में समझना स्वाभाविक है। हिन्दी निष्क्रिय रचना जबरन स्थानांतरण को स्पष्ट करती है और ‘वहाँ से’ को ‘जिनके बीच से’ के रूप में सुबोध बनाती है।
theological_decisions:
- issue: याहवे का भय मानने और अन्य देवताओं की सेवा करने वाले उपवाक्यों के बीच संबंध
  choice: मुख्य पाठ में मूल इब्रानी के सामान्य संयोजक के अनुरूप ‘और’ रखा गया है।
  alternative: संदर्भगत विरोध को स्पष्ट करने के लिए ‘परन्तु’ पढ़ा जा सकता है।
  rationale: इब्रानी וְ औपचारिक रूप से ‘और’ है, यद्यपि प्रसंग इन दोनों आचरणों के बीच तनाव दिखाता है। मुख्य पाठ मूल की अस्पष्टता बचाता है और पादटिप्पणी विरोधात्मक संभावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘भय मानते थे’ और ‘सेवा करते थे’ समानांतर, नियमित धार्मिक आचरण को व्यक्त करते हैं।
