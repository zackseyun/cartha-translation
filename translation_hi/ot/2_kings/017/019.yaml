source:
  edition: WLC
  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
translation:
  language: hi
  text: यहूदा के लोगों ने भी[a] अपने परमेश्वर याहवे की आज्ञाओं का पालन नहीं किया, बल्कि वे इस्राएल की बनाई हुई विधियों के अनुसार चले।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा भी”; आरम्भिक शब्द इस बात पर जोर देता है कि इस्राएल के समान यहूदा भी दोषी था।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “उन्होंने इस्राएल की विधियों का अनुसरण किया” या “उन्होंने उन रीति-रिवाजों का अनुसरण किया जिन्हें इस्राएल ने प्रचलित किया था” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם יְהוּדָה
  choice: यहूदा के लोगों ने भी
  rationale: गַּם का अग्रस्थान इस बात पर बल देता है कि इस्राएल की तरह यहूदा भी दोषी था। सामूहिक संज्ञा ‘यहूदा’ के बाद आने वाले बहुवचन क्रियारूप को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘यहूदा के लोगों’ कहा गया है।
- source_word: שָׁמַר אֶת מִצְוֺת
  choice: आज्ञाओं का पालन किया
  rationale: वाचा और व्यवस्था के संदर्भ में שׁמר का अर्थ आज्ञाओं को मानना या उनका पालन करना है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए कानूनी-धार्मिक भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: इब्रानी में बहुवचन संबंधसूचक प्रत्यय ‘उनका’ है। हिन्दी में कर्ता ‘यहूदा के लोग’ के साथ ‘अपने परमेश्वर’ अधिक स्वाभाविक और अर्थतः सटीक है।
- source_word: וַיֵּלְכוּ בְּחֻקּוֹת
  choice: बल्कि वे ... विधियों पर चले
  rationale: הלך ב आचरण के किसी निर्धारित ढंग का अनुसरण करने का रूपक है। ‘पर चले’ उस रूपक को बनाए रखता है और ‘बल्कि’ दो विपरीत आचरणों का संबंध स्पष्ट करता है।
- source_word: אֲשֶׁר עָשׂוּ
  choice: इस्राएल की बनाई हुई
  rationale: עשה का मूल अर्थ ‘बनाना’ है, पर विधियों के साथ इसका अर्थ स्थापित करना या व्यवहार में लाना भी हो सकता है। मुख्य पाठ निकटतम पूर्वपद ‘इस्राएल’ को सामूहिक कर्ता मानता है और वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: אֲשֶׁר עָשׂוּ के कर्ता और अर्थ
  choice: इस्राएल की बनाई हुई विधियाँ
  alternative: वे विधियाँ जिनका इस्राएल ने पालन किया
  rationale: बहुवचन क्रिया का कर्ता सामूहिक ‘इस्राएल’ हो सकता है, और עשה यहाँ ‘बनाना/स्थापित करना’ अथवा ‘व्यवहार में लाना’ दोनों अर्थ दे सकता है। मुख्य पाठ पहले अर्थ को रखता है, जबकि पादटिप्पणी वास्तविक भाषिक विकल्प बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आज्ञाएँ’ और ‘विधियाँ’ वाचा-संबंधी कानूनी स्वर बनाए रखते हैं; ‘पर चले’ मूल इब्रानी आचरण-रूपक को सुरक्षित रखता है।
