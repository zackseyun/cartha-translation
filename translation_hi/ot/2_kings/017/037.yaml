source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
translation:
  language: hi
  text: और जिन विधियों, न्याय-विधानों, व्यवस्था और आज्ञा को उसने तुम्हारे लिए लिखा है[a], उनका पालन करने में तुम सदा सावधान रहना[b]; और दूसरे देवताओं का भय न मानना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विधियाँ, न्याय-विधान, व्यवस्था और आज्ञा’ के लिए ‘ठहराए हुए नियम, न्याय-संबंधी नियम, शिक्षा और आदेश’ भी कहा जा सकता है। इब्रानी में वाचा की व्यवस्था से जुड़े चार निकटार्थी, पर अलग-अलग अर्थछटा वाले शब्द हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम उनका पालन करने के लिए चौकसी रखना।’ इब्रानी अभिव्यक्ति मानने और व्यवहार में करने—दोनों पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘भय मानना’ केवल डरने का नहीं, बल्कि किसी देवता के प्रति श्रद्धापूर्ण अधीनता, निष्ठा या उपासना का भाव भी रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  choice: विधियों
  rationale: यह निर्धारित नियमों या विधियों को सूचित करता है; ‘विधियाँ’ औपचारिक कानूनी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधानों
  rationale: यह न्यायिक निर्णयों अथवा कानूनी नियमों का बोध करा सकता है। ‘न्याय-विधान’ इसे पहले पद से अलग रखते हुए कानूनी स्वर बनाए रखता है।
- source_word: הַתּוֹרָה
  choice: व्यवस्था
  rationale: इस वाचा-संबंधी कानूनी सूची में ‘व्यवस्था’ תּוֹרָה के मान्य विधिक अर्थ को व्यक्त करती है, यद्यपि इसका अर्थ ‘शिक्षा’ भी हो सकता है।
- source_word: הַמִּצְוָה
  choice: आज्ञा
  rationale: इब्रानी शब्द एकवचन है; ‘आज्ञा’ उसी संख्या और अधिकारपूर्ण भाव को बनाए रखती है।
- source_word: אֲשֶׁר כָּתַב לָכֶם
  choice: जिन्हें उसने तुम्हारे लिए लिखा है
  rationale: क्रिया के निहित एकवचन कर्ता को ‘उसने’ के रूप में रखा गया है; संदर्भ से उसका अभिप्राय यहोवा है, पर मुख्य पाठ में नाम नहीं जोड़ा गया। वाक्य-सामंजस्य के लिए पाठ में समष्टिगत संबंध ‘जिन ... को’ से व्यक्त है।
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: उनका पालन करने में तुम ... सावधान रहना
  rationale: यह ‘रखने/मानने’ और ‘करने’ दोनों पहलुओं को स्वाभाविक हिन्दी में व्यक्त करता है; आशय केवल स्मरण रखना नहीं, बल्कि व्यवहार में पूरा करना है।
- source_word: כָּל הַיָּמִים
  choice: सदा
  rationale: शाब्दिक अर्थ ‘सारे दिन’ है; इस मुहावरे का निरंतरता-सूचक अर्थ आधुनिक हिन्दी में ‘सदा’ से स्पष्ट और सहज रूप में आता है।
- source_word: תִירְאוּ
  choice: भय न मानना
  rationale: יָרֵא भय के साथ श्रद्धापूर्ण अधीनता का भाव भी रखता है। ‘भय मानना’ मूल रूपक को बनाए रखता है; उपासना या निष्ठा का प्रसंगगत भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं
  rationale: यह यहोवा के अतिरिक्त देवताओं के लिए प्रचलित इब्रानी अभिव्यक्ति का सीधा हिन्दी रूप है।
theological_decisions:
- issue: वाचा-संबंधी चार कानूनी पदों को अलग बनाए रखना
  choice: विधियाँ, न्याय-विधान, व्यवस्था और आज्ञा—चारों को अलग प्रस्तुत किया गया
  alternative: सबको समेटकर ‘नियम और आज्ञाएँ’ कहना
  rationale: मूल पाठ जानबूझकर निकटार्थी किन्तु पृथक कानूनी शब्दों का संचय करता है; उन्हें अलग रखने से उसकी वाचाई गंभीरता और अलंकारिक बल सुरक्षित रहते हैं।
- issue: ‘उसने तुम्हारे लिए लिखा’ के कर्ता की पहचान
  choice: मुख्य पाठ में ‘उसने’ रखा गया
  alternative: ‘यहोवा ने’ स्पष्ट रूप से जोड़ना
  rationale: संदर्भ में कर्ता यहोवा है, किन्तु इस पद में इब्रानी क्रिया का कर्ता सर्वनाम रूप में निहित है। ‘उसने’ मूल की अभिव्यक्ति को बिना अनावश्यक स्पष्टता जोड़े बनाए रखता है।
- issue: दूसरे देवताओं से ‘भय’ का धार्मिक आशय
  choice: मुख्य पाठ में ‘भय न मानना’ और पादटिप्पणी में श्रद्धापूर्ण निष्ठा/उपासना का संकेत
  alternative: मुख्य पाठ में सीधे ‘उपासना न करना’ या ‘श्रद्धा न रखना’
  rationale: ‘भय’ मूल शब्द की वास्तविक अर्थ-सीमा और वाचाई तनाव बनाए रखता है; केवल ‘उपासना’ कहना अर्थ को अधिक संकीर्ण कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली रखी गई है। कानूनी-वाचाई शब्दावली को अलग रखा गया, पर अस्वाभाविक शब्दशः संरचना से बचने के लिए תִּשְׁמְרוּן לַעֲשׂוֹת को ‘पालन करने में ... सावधान रहना’ और כָּל הַיָּמִים को ‘सदा’ कहा गया है। आदेशात्मक भविष्य का भाव हिन्दी के ‘रहना/न मानना’ से व्यक्त है।
