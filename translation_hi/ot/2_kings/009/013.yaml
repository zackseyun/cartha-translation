base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
translation:
  language: hi
  text: तब वे जल्दी से आगे बढ़े; हर एक ने अपना वस्त्र लिया और उसे येहू के नीचे, सीढ़ियों की खुली सतह पर, बिछा दिया।[a] फिर उन्होंने सींग फूँका[b] और कहा, “येहू राजा हो गया है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी पदबंध का ठीक अर्थ अनिश्चित है; इसका अर्थ “सबसे ऊपरी सीढ़ी पर” या “सीढ़ियों के चबूतरे पर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: “शोफ़ार”—संकेत देने के लिए फूँका जाने वाला सींग; परंपरागत अनुवाद “तुरही” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: तब उन्होंने फुर्ती की
  rationale: מהר तत्काल और शीघ्र कार्रवाई को दर्शाता है; वाव-क्रम के साथ ‘तब’ कथा की प्रगति को बनाए रखता है।
- source_word: אִישׁ בִּגְדוֹ
  choice: हर एक ने अपना वस्त्र लिया
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है और בגד के व्यापक अर्थ को ‘वस्त्र’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּשִׂימוּ תַחְתָּיו
  choice: उसे येहू के नीचे ... बिछा दिया
  rationale: תחתיו का संकेत प्रसंग में येहू की ओर है। वस्त्रों के संदर्भ में ‘बिछा दिया’ स्वाभाविक है, जबकि व्यवस्था का अनावश्यक विस्तार नहीं करता।
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  choice: सीढ़ियों की खुली सतह पर
  rationale: यह दुर्लभ और अनिश्चित पदबंध सीढ़ियों के खुले/नंगे भाग, ऊपरी सीढ़ी या सीढ़ियों के चबूतरे की ओर संकेत कर सकता है; मुख्य पाठ में संभावित स्थानगत अर्थ रखा गया है और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  choice: उन्होंने नरसिंगा फूँका
  rationale: שופר संकेत देने के लिए फूँका जाने वाला सींग है। ‘नरसिंगा’ आधुनिक हिन्दी पाठकों के लिए गरिमापूर्ण और समझने योग्य वाद्य-शब्द है; सटीक सांस्कृतिक पहचान पादटिप्पणी में दी गई है।
- source_word: מָלַךְ יֵהוּא
  choice: येहू राजा हो गया है
  rationale: पूर्ण क्रिया यहाँ राजपद ग्रहण करने की सम्पन्न घटना को व्यक्त करती है; यह केवल स्थिर पहचान ‘राजा है’ की अपेक्षा accession का भाव अधिक स्पष्ट रखती है।
