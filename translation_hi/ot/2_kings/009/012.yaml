  text: וַ/יֹּאמְר֣וּ שֶׁ֔קֶר הַגֶּד נָ֖א לָ֑/נוּ וַ/יֹּ֗אמֶר כָּ/זֹ֤את וְ/כָ/זֹאת֙ אָמַ֤ר אֵלַ/י֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/012.yaml
  text: 'And they said[a], “That is a lie. Please tell us.” So he said, “Thus and thus he said to me, saying, ‘Thus says Yahweh: I have anointed you king over Israel.’”'
translation:
  language: hi
  text: 'उन्होंने कहा, “यह झूठ है! हमें बताओ।” तब उसने कहा, “उसने मुझसे ऐसी-ऐसी बातें कहीं[a]: ‘याहवे यों कहता है: मैंने तुझे इस्राएल का राजा होने के लिए अभिषेक किया है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ऐसा और ऐसा”; यह अनिश्चित या आंशिक सार बताने वाला मुहावरा है, न कि उसके शब्दों का पूरा उद्धरण।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: यह झूठ है
  rationale: संज्ञा का अर्थ ‘झूठ/असत्य’ है। इस संक्षिप्त संवाद में ‘यह झूठ है’ आरोप को स्वाभाविक हिन्दी में व्यक्त करता है कि येहू संदेश छिपा रहा है।
- source_word: הַגֶּד נָא לָנוּ
  choice: हमें बताओ
  rationale: הַגֵּד ‘बता/घोषित कर’ का आज्ञार्थक रूप है और נָא अनुरोध या आग्रह जोड़ता है। प्रसंग और हिन्दी संवाद में ‘हमें बताओ’ इसका स्वाभाविक रूप है।
- source_word: כָּזֹאת וְכָזֹאת
  choice: ऐसी-ऐसी बातें
  rationale: यह अनिश्चित अथवा संक्षिप्त विवरण देने वाला मुहावरा है। ‘ऐसी-ऐसी बातें’ आधुनिक हिन्दी में स्वाभाविक है और यह संकेत बनाए रखता है कि येहू पहले शब्दशः पूरा संदेश नहीं दोहरा रहा।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबी का प्रामाणिक संदेश-सूत्र है। ‘यों कहता है’ उसकी औपचारिक लय और प्रत्यक्ष घोषणा को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: מְשַׁחְתִּיךָ
  choice: मैंने ... तेरा अभिषेक किया है
  rationale: משׁח का अर्थ ‘अभिषेक करना’ है। पूर्ण क्रिया को वर्तमान-पूर्ण रूप में रखने से अभी घोषित, संपन्न राजकीय नियुक्ति का भाव व्यक्त होता है।
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: इस्राएल पर राजा होने के लिए
  rationale: לְמֶלֶךְ पद पर नियुक्ति और אֶל יִשְׂרָאֵל यहाँ इस्राएल पर शासन का संबंध दर्शाता है। यह हिन्दी में अर्थ स्पष्ट करते हुए मूल संरचना के निकट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: राजकीय अभिषेक का अर्थ
  choice: तेरा अभिषेक किया है
  alternative: तुझे राजा नियुक्त किया है
  rationale: ‘अभिषेक’ मूल क्रिया की राजकीय और धर्मवैचारिक गहराई बनाए रखता है, जबकि केवल ‘नियुक्त’ कहना उसके प्रतीकात्मक कार्य को घटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की तीक्ष्णता के लिए ‘यह झूठ है!’ और नबी-संदेश की औपचारिकता के लिए ‘याहवे यों कहता है’ चुना गया है।
