base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
translation:
  language: hi
  text: और ईज़ेबेल की लाश यिज्रेल के भूभाग[a] में खेत की सतह पर गोबर के समान पड़ी होगी, ताकि कोई यह न कहे, ‘यह ईज़ेबेल है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यिज्रेल के भूखंड में।’ इब्रानी शब्द חֵלֶק किसी निश्चित भूखंड या भूमि के हिस्से को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: और ... पड़ी होगी
  rationale: पूर्ववर्ती भविष्यवाणी को आगे बढ़ाते हुए रूप का भावी अर्थ है। लाश के लिए ‘पड़ी होगी’ हिन्दी में स्वाभाविक है और स्थानगत चित्र भी बनाए रखता है।
- source_word: נִבְלַת אִיזֶבֶל
  choice: ईज़ेबेल की लाश
  rationale: נְבֵלָה मृत शरीर को दर्शाता है; ‘लाश’ सीधा, वर्तमान और प्रसंग की कठोरता के अनुरूप है। नाम को प्रचलित हिन्दी बाइबिलीय रूप में लिप्यंतरित किया गया है।
- source_word: כְּדֹמֶן
  choice: खाद के समान
  rationale: דֹּמֶן गोबर अथवा उससे बनी खाद को सूचित करता है। ‘खाद’ सहज हिन्दी है और अपमानजनक तुलना को कायम रखता है।
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: खेत की सतह पर
  rationale: शाब्दिक चित्र ‘खेत के मुख पर’ है; हिन्दी में ‘खेत की सतह पर’ स्थानगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: यिज्रेल के भूभाग में
  rationale: חֵלֶק किसी हिस्से, भूखंड या क्षेत्र को सूचित कर सकता है। मुख्य पाठ में ‘भूभाग’ इस दायरे को खुला रखता है; अधिक संकीर्ण ‘भूखंड’ पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר לֹא יֹאמְרוּ
  choice: ताकि कोई यह न कह सके
  rationale: यहाँ सम्बन्धवाचक अव्यय परिणाम का भाव देता है। अनिर्दिष्ट बहुवचन को स्वाभाविक हिन्दी में ‘कोई’ से व्यक्त किया गया है; ‘कह सके’ पहचान असम्भव होने का आशय स्पष्ट करता है।
- source_word: זֹאת אִיזָבֶל
  choice: यह ईज़ेबेल है
  rationale: संकेतवाचक पहचान-वाक्य का सीधा और स्वाभाविक हिन्दी रूप।
