  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
translation:
  language: hi
  text: और इज़ेबेल को यिज्रेल के भू-भाग[a] में कुत्ते खा जाएँगे, और उसे दफ़नाने वाला कोई न होगा।” तब उसने द्वार खोला और भाग गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यिज्रेल के भूखंड में।” हिब्रू शब्द חֵלֶק भूमि के किसी हिस्से, भूखंड या भू-भाग को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ
  choice: खा जाएँगे
  rationale: אכל का सामान्य अर्थ ‘खाना’ है। भविष्यसूचक न्याय के संदर्भ में ‘खा जाएँगे’ स्वाभाविक है और मूल से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: הַכְּלָבִים
  choice: कुत्ते
  rationale: हिब्रू में निश्चित उपपद है; हिन्दी में इस संदर्भ में ‘कुत्ते’ बिना किसी अतिरिक्त संकेतक के स्वाभाविक रूप से उसी निर्दिष्ट समूह को दर्शाता है।
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: यिज्रेल के भू-भाग में
  rationale: חֵלֶק किसी हिस्से, भूखंड या क्षेत्र को सूचित कर सकता है। ‘भू-भाग’ भूमि-संबंधी अर्थ बनाए रखता है और उसके आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְאֵין קֹבֵר
  choice: और उसे दफ़नाने वाला कोई न होगा
  rationale: हिब्रू का शाब्दिक भाव ‘दफ़नाने वाला कोई नहीं’ है। संदर्भ से कर्म ‘उसे’ स्पष्ट किया गया है और भविष्यसूचक काल बनाए रखा गया है।
- source_word: וַיִּפְתַּח הַדֶּלֶת
  choice: तब उसने द्वार खोला
  rationale: वय्यिक्तोल कथा को अगले क्रमिक कार्य की ओर बढ़ाता है; ‘तब’ इस क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיָּנֹס
  choice: और भाग गया
  rationale: נוס का अर्थ भागना या पलायन करना है। ‘भाग गया’ संक्षिप्त, स्वाभाविक और क्रिया की तत्परता के अनुरूप है।
- source_word: אִיזֶבֶל
  choice: इज़ेबेल
  rationale: व्यक्तिनाम का आधुनिक हिन्दी में प्रचलित रूपान्तरण।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: स्थाननाम का ऐसा लिप्यंतरण जो हिब्रू उच्चारण के निकट है और हिन्दी पाठक के लिए पठनीय है।
