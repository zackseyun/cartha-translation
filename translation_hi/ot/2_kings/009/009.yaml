  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
translation:
  language: hi
  text: और मैं अहाब के घराने को नबात के पुत्र यारोबाम के घराने और अहिय्याह के पुत्र बाशा के घराने के समान कर दूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अहाब के राजवंश को ... यारोबाम के राजवंश और ... बाशा के राजवंश के समान।” यहाँ इब्रानी में “घर” का अर्थ राजघराना या राजवंश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָֽתַתִּי
  choice: और मैं ... कर दूँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर यहाँ तुलना के साथ प्रयुक्त न्याय-सूत्र में ‘के समान कर दूँगा’ स्वाभाविक हिन्दी है और कारणात्मक भाव को स्पष्ट रखता है।
- source_word: בֵּית אַחְאָב
  choice: अहाब के घराने
  rationale: राजवंशीय संदर्भ में בַּיִת का ‘घराना’ स्वाभाविक हिन्दी है; यह मूल ‘घर’ रूपक और वंश के आशय दोनों को बनाए रखता है।
- source_word: כְּ/בֵית
  choice: के घराने ... के समान
  rationale: उपसर्ग כְּ स्पष्ट तुलना व्यक्त करता है। हिन्दी वाक्य-रचना में तुलना किए जाने वाले दोनों घरानों के बाद ‘के समान’ रखना स्वाभाविक है।
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: नबात के पुत्र यारोबाम
  rationale: वंशसूचक संबंध को स्पष्ट और आधुनिक मानक हिन्दी में रखा गया है; व्यक्तिनामों का पारंपरिक हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: וּ/כְ/בֵית
  choice: और ... के घराने के समान
  rationale: संयोजक और तुलनात्मक उपसर्ग दोनों को रखते हुए दो पूर्व राजघरानों के साथ समानांतर तुलना सुरक्षित की गई है।
- source_word: בַּעְשָׁא בֶן אֲחִיָּה
  choice: अहिय्याह के पुत्र बाशा
  rationale: व्यक्तिनाम और पितृनाम ऐतिहासिक संकेत को बनाए रखते हैं; अभिव्यक्ति आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: राजवंश पर न्याय के सूत्र का अनुवाद
  choice: अहाब के घराने को ... यारोबाम के घराने और ... बाशा के घराने के समान
  alternative: अहाब के राजवंश को ... यारोबाम के राजवंश और ... बाशा के राजवंश के समान
  rationale: ‘घराना’ मूल के ‘घर’ रूपक और राजवंशीय अर्थ दोनों को बनाए रखता है तथा पहले नष्ट किए गए राजघरानों से इस न्याय की ऐतिहासिक तुलना को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘घराना’ सामान्य पाठक के लिए स्वाभाविक है और राजवंशीय संदर्भ में इब्रानी रूपक को ‘राजवंश’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
