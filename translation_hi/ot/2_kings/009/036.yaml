base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/036.yaml
  text: So they returned and told him[a], and he said, “It is the word of Yahweh, which he spoke by the hand of his servant Elijah the Tishbite, saying, ‘In the territory of Jezreel the dogs will eat the flesh of Jezebel.’”
translation:
  language: hi
  text: 'तब वे लौटकर आए और उसे बताया। उसने कहा, “यह याहवे का वही वचन है, जो उसने अपने सेवक तिशबी एलिय्याह के द्वारा कहा था: ‘यिज्रेल के भू-भाग में[a] कुत्ते ईज़ेबेल का मांस खाएँगे।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यिज्रेल के भूखंड में”; हिब्रू शब्द किसी हिस्से, खेत के खंड या भू-क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ וַיַּגִּידוּ לוֹ
  choice: तब वे लौटकर आए और उसे बताया
  rationale: क्रमिक कथन को स्वाभाविक आधुनिक हिन्दी में रखा गया है; נגד के हिफ़ील का सीधा अर्थ ‘बताना/सूचित करना’ है।
- source_word: דְּבַר יְהוָה הוּא
  choice: यह यहोवा का वही वचन है
  rationale: हिब्रू के बलसूचक הוּא को ‘वही’ से व्यक्त किया गया है और दैवी नाम को उपाधि से नहीं बदला गया।
- source_word: בְּיַד עַבְדּוֹ
  choice: अपने सेवक ... के द्वारा
  rationale: ‘हाथ से’ हिब्रू में माध्यम या अभिकरण का मुहावरा है; हिन्दी में ‘के द्वारा’ उसका स्वाभाविक अर्थ देता है।
- source_word: אֵלִיָּהוּ הַתִּשְׁבִּי
  choice: तिशबी एलिय्याह
  rationale: व्यक्तिनाम और स्थान-सूचक उपाधि को हिन्दी बाइबलीय शैली में स्पष्ट रूप से रखा गया है।
- source_word: בְּחֵלֶק יִזְרְעֶאל
  choice: यिज्रेल के भू-भाग में
  rationale: חֵלֶק किसी हिस्से, भूखंड या क्षेत्र को सूचित कर सकता है; ‘भू-भाग’ इस स्थानगत अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: יֹאכְלוּ הַכְּלָבִים אֶת בְּשַׂר אִיזָבֶל
  choice: कुत्ते ईज़ेबेल का मांस खाएँगे
  rationale: ‘मांस’ בָּשָׂר की ठोस और कठोर छवि को बनाए रखता है; ‘खाएँगे’ मूल क्रिया का सीधा अर्थ है।
theological_decisions:
- issue: दैवी नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है, इसलिए इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों में सुविख्यात रूप ‘यहोवा’ चुना गया है, जबकि ‘याहवे’ भी सम्भव लिप्यंतरण है।
- issue: भविष्यवाणी के पूर्ण होने की पहचान
  choice: यह यहोवा का वही वचन है
  alternative: यह यहोवा का वचन है
  rationale: הוּא का बल वर्तमान घटना को पहले कहे गए विशिष्ट वचन से जोड़ता है; ‘वही’ उस पहचान को स्पष्ट करता है, बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। भविष्यवाणी की कठोरता को नरम नहीं किया गया, और हिब्रू अभिकरण-मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
