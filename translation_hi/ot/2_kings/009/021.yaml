base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
translation:
  language: hi
  text: तब यहोराम ने कहा[a], “रथ जोतो!” और उसका रथ जोता गया। फिर इस्राएल का राजा यहोराम और यहूदा का राजा अहज्याह, दोनों अपने-अपने रथ पर सवार होकर येहू से मिलने निकले। उन्होंने उसे यिज्रेली नाबोत के भूमि-खंड में पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में शाब्दिक रूप से “और उसने उसका रथ जोता” है; संभवतः आशय है कि आदेश किसी सेवक द्वारा पूरा किया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  choice: रथ जोतो!
  rationale: चौथे धातु אסר का आज्ञार्थक रूप रथ के प्रसंग में पशुओं को रथ से जोतने का निर्देश देता है। “रथ जोतो” संक्षिप्त, स्वाभाविक और आदेश की तत्परता को बनाए रखता है।
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  choice: उसका रथ जोता गया
  rationale: इब्रानी क्रिया व्याकरणतः एकवचन पुल्लिंग है—शाब्दिक रूप से “उसने उसका रथ जोता”—पर प्रसंग में सेवक द्वारा आदेश पूरा किया जाना अभिप्रेत है। हिंदी कर्मवाच्य मूल की व्याकरणिक असामान्यता को बिना राजा के स्वयं रथ जोतने का संकेत दिए सुरक्षित रखता है।
- source_word: אִישׁ בְּרִכְבּוֹ
  choice: दोनों अपने-अपने रथ पर सवार होकर
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है और बताता है कि दोनों राजा अलग-अलग रथों में थे। “अपने-अपने” हिंदी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִקְרַאת יֵהוּא
  choice: येहू से मिलने
  rationale: לִקְרַאת किसी की ओर जाकर उससे मिलने का सामान्य अर्थ देता है; “से मिलने” स्पष्ट और प्रसंगानुकूल है।
- source_word: וַיִּמְצָאֻהוּ
  choice: उन्होंने उसे ... पाया
  rationale: מצא का सामान्य कथात्मक अर्थ “पाना” है। यह सरल अनुवाद मुलाकात की प्रकृति को अनावश्यक रूप से व्याख्यायित नहीं करता।
- source_word: בְּחֶלְקַת נָבוֹת
  choice: नाबोत की भूमि के टुकड़े पर
  rationale: חֶלְקָה भूमि के किसी निश्चित भूखंड या हिस्से को सूचित करता है। यह अभिव्यक्ति नाबोत की संपत्ति से जुड़े कानूनी और कथात्मक भाव को बनाए रखती है।
- source_word: הַיִּזְרְעֵאלִי
  choice: यिज्रेली
  rationale: यह जातिवाचक/स्थानवाचक विशेषण नाबोत की पहचान यिज्रेल के निवासी के रूप में करता है और पूर्ववर्ती कथा की स्थापित पहचान को सुरक्षित रखता है।
