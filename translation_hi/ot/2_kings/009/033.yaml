  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
translation:
  language: hi
  text: उसने कहा, “उसे नीचे फेंक दो!” तब उन्होंने उसे नीचे फेंक दिया। उसके खून के कुछ छींटे दीवार और घोड़ों पर जा पड़े,[a] और उसने उसे रौंद डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और उसका खून दीवार और घोड़ों पर जा छिटका।” इब्रानी में शाब्दिक रूप से है, “और उसके खून में से [कुछ] दीवार और घोड़ों पर छिटका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו
  choice: उसे नीचे फेंक दो!
  rationale: यह आज्ञार्थक क्रिया ईज़ेबेल को खिड़की से नीचे गिराने की हिंसक आज्ञा व्यक्त करती है। ‘नीचे फेंक दो’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: וישמטוה
  choice: तब उन्होंने उसे नीचे फेंक दिया
  rationale: आज्ञा और उसके पालन में एक ही इब्रानी धातु की पुनरावृत्ति है; हिंदी में भी ‘नीचे फेंक’ दोहराकर यह संबंध बनाए रखा गया है।
- source_word: ויז מדמה
  choice: उसके खून के कुछ छींटे ... जा पड़े
  rationale: इब्रानी में शाब्दिक रूप से ‘उसके खून में से छिटका’ है। ‘खून के कुछ छींटे’ מן की अंशवाचक भावना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אל הקיר ואל הסוסים
  choice: दीवार और घोड़ों पर
  rationale: दोनों लक्ष्यों को सरल और सीधी हिंदी में रखा गया है।
- source_word: וירמסנה
  choice: और उसने उसे रौंद डाला
  rationale: एकवचन क्रिया का कर्ता येहू समझा जाता है। ‘रौंद डाला’ क्रिया की हिंसक तीव्रता को रखता है, जबकि साधन को अनावश्यक रूप से स्पष्ट नहीं करता।
