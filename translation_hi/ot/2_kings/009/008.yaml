reference: 2 Kings 9:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
translation:
  language: hi
  text: और अहाब का सारा घराना नाश हो जाएगा। मैं इस्राएल में अहाब के हर पुरुष[a] को—चाहे बंधुआ हो या स्वतंत्र—काट डालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “दीवार पर पेशाब करने वाला हर एक”; यह हर पुरुष के लिए प्रयुक्त एक रूखा मुहावरा है।
    reason: मूल अशिष्ट मुहावरे को पारदर्शिता के लिए सुरक्षित रखते हुए मुख्य पाठ में उसका अर्थ स्पष्ट किया गया है।
lexical_decisions:
- source_word: וְאָבַד
  choice: नाश हो जाएगा
  rationale: भविष्यसूचक न्याय-वाणी में संयोजक सहित पूर्ण क्रिया का भावी अर्थ है। यह चयन विनाश को व्यक्त करता है, पर व्याकरण में निहित न होने वाली प्रत्यक्ष कारकता नहीं जोड़ता।
- source_word: כָּל בֵּית אַחְאָב
  choice: अहाब का सारा घराना
  rationale: ‘घराना’ राजवंश और उससे जुड़े परिवार/गृहसमूह के बाइबलीय भाव को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִכְרַתִּי
  choice: काट डालूँगा
  rationale: כרת के हिफ़ील रूप की ‘काटकर समाप्त कर देना’ वाली न्याय-संबंधी छवि को बनाए रखता है और केवल सामान्य ‘नष्ट कर दूँगा’ की अपेक्षा मूल मुहावरे के निकट है।
- source_word: לְאַחְאָב
  choice: अहाब के
  rationale: यहाँ ל संबंध अथवा स्वामित्व बताता है; वाक्य में यह अहाब से संबंधित प्रत्येक पुरुष की ओर संकेत करता है।
- source_word: מַשְׁתִּין בְּקִיר
  choice: हर पुरुष[a]
  rationale: शाब्दिक अभिव्यक्ति अशिष्ट और हिन्दी में अस्पष्ट होगी; उसका आशय स्पष्ट मुख्य पाठ में दिया गया है और मूल चित्रात्मक मुहावरा पादटिप्पणी में सुरक्षित है।
- source_word: וְעָצוּר וְעָזוּב
  choice: चाहे बंधुआ हो या स्वतंत्र
  rationale: यह पारंपरिक विरोधी युग्म सभी सामाजिक अवस्थाओं के पुरुषों को समेटता है। ‘चाहे…या…’ हिन्दी में उसके समावेशी भाव को स्वाभाविक रूप से व्यक्त करता है, यद्यपि इब्रानी पदों का ठीक सामाजिक वर्गीकरण अनिश्चित है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: 'पूर्वसर्ग का स्थानवाचक अर्थ रखा गया है: न्याय इस्राएल में अहाब के घराने पर होगा।'
theological_decisions:
- issue: अहाब के राजघराने पर न्याय की सूत्रबद्ध भाषा
  choice: ‘घराना’ और ‘काट डालूँगा’ की न्याय-संबंधी भाषा रखते हुए अशिष्ट पुरुष-सूचक मुहावरे का अर्थ मुख्य पाठ में दिया गया है।
  alternative: पूरे वाक्य को ‘मैं इस्राएल से अहाब के पूरे परिवार को मिटा दूँगा’ कहकर सरल बनाना, अथवा शाब्दिक मुहावरा मुख्य पाठ में रखना।
  rationale: चयन राजवंशीय न्याय की बाइबलीय बनावट को बचाता है, पर आधुनिक पाठक के लिए अनावश्यक अस्पष्टता से बचता है।
- issue: וְעָצוּר וְעָזוּב की अनिश्चितता
  choice: ‘चाहे बंधुआ हो या स्वतंत्र’
  alternative: ‘रुका हुआ और छोड़ा हुआ’, ‘संरक्षित और त्यागा हुआ’, या अधिक सामान्य ‘बिना किसी अपवाद के’।
  rationale: संदर्भ में यह समग्रता बताने वाला विरोधी युग्म है। पारंपरिक सामाजिक अर्थ उपयोगी है, पर उसकी सूक्ष्म व्याख्या को निश्चित सिद्धांत के रूप में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज। ‘घराना’ राजवंशीय अर्थ देता है, और ‘काट डालूँगा’ भविष्यसूचक न्याय की तीव्रता बनाए रखता है।
