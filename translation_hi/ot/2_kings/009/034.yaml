source:
  edition: WLC
  text: וַ/יָּבֹ֖א וַ/יֹּ֣אכַל וַ/יֵּ֑שְׁתְּ וַ/יֹּ֗אמֶר פִּקְדוּ נָ֞א אֶת הָ/אֲרוּרָ֤ה הַ/זֹּאת֙ וְ/קִבְר֔וּ/הָ כִּ֥י בַת מֶ֖לֶךְ הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/034.yaml
  text: Then he went in and ate and drank[a], and he said, “Please see to this cursed woman and bury her, for she is a king’s daughter.”
translation:
  language: hi
  text: तब वह भीतर गया और उसने खाया-पिया। फिर उसने कहा, “कृपया उस शापित स्त्री की सुध लो और उसे दफ़ना दो, क्योंकि वह एक राजा की बेटी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब वह भीतर गया
  rationale: בוא यहाँ ईज़ेबेल की मृत्यु के बाद येहू के भवन या महल के भीतर जाने को बताता है; ‘भीतर गया’ दिशा और कथात्मक प्रवाह दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ
  choice: उसने खाया-पिया
  rationale: इब्रानी में दोनों क्रियाओं का कोई कर्म नहीं दिया गया है; हिंदी का संयुक्त प्रयोग ‘खाया-पिया’ संक्षिप्त और स्वाभाविक है तथा अतिरिक्त वस्तु नहीं जोड़ता।
- source_word: פִּקְדוּ נָא
  choice: कृपया ... की सुध लो
  rationale: פקד यहाँ किसी व्यक्ति या मामले पर ध्यान देने और उसके विषय में आवश्यक प्रबंध करने के अर्थ में है। ‘की सुध लो’ इस संदर्भ में शव की ओर ध्यान देकर दफ़नाने की व्यवस्था करने का भाव देता है, और ‘कृपया’ נָא के विनम्र आग्रह को व्यक्त करता है।
- source_word: הָאֲרוּרָה הַזֹּאת
  choice: उस शापित स्त्री
  rationale: स्त्रीलिंग रूप स्पष्टतः ईज़ेबेल की ओर संकेत करता है। हिंदी में ‘स्त्री’ जोड़ना संदर्भ को स्पष्ट और वाक्य को स्वाभाविक बनाता है; ‘शापित’ मूल के तीखे मूल्यांकन को बनाए रखता है।
- source_word: וְקִבְרֻהָ
  choice: और उसे दफ़ना दो
  rationale: यह स्त्रीलिंग एकवचन कर्म-प्रत्यय सहित सीधी आज्ञा है; ‘उसे दफ़ना दो’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: כִּי בַת מֶלֶךְ הִיא
  choice: क्योंकि वह एक राजा की बेटी है
  rationale: כִּי कारण बताता है। अनिश्चित संज्ञा-संरचना किसी नामित राजा की पहचान पर नहीं, बल्कि उसके राजवंशीय दर्जे पर बल देती है; इसलिए ‘एक राजा की बेटी’ उपयुक्त है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक क्रम को छोटे, स्पष्ट वाक्यों में व्यक्त किया गया है; मूल में निहित निंदा और राजकीय हैसियत दोनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
