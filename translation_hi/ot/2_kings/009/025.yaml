  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
translation:
  language: hi
  text: तब उसने अपने अधिकारी बिदकर[a] से कहा, “उसे उठाकर यिज्रेली नाबोत के खेत के हिस्से में फेंक दो; क्योंकि याद करो कि मैं और तुम उसके पिता अहाब के पीछे साथ-साथ सवार थे[b], जब याहवे ने उसके विरुद्ध यह न्याय-वचन[c] सुनाया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने तीसरे व्यक्ति से।” संभवतः यह बिदकर के पद या स्थान के लिए प्रयुक्त एक तकनीकी उपाधि थी।
