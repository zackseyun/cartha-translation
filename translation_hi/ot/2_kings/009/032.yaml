- source_word: שְׁנַיִם שְׁלֹשָׁה
  choice: दो-तीन
  rationale: यह इब्रानी संख्या-युग्म थोड़ी और अनिश्चित संख्या बताता है; हिन्दी में ‘दो-तीन’ इसका सहज समतुल्य है।
- source_word: סָרִיסִים
  choice: खोजों
  rationale: राजमहल के प्रसंग में शब्द का सर्वाधिक संभावित विशिष्ट अर्थ बधिया किए गए पुरुष राजसेवक है; व्यापक अर्थ ‘दरबारी अधिकारी’ पादटिप्पणी में सुरक्षित है।
