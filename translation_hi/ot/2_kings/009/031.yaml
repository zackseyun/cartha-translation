  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
translation:
  language: hi
  text: जब येहू फाटक में आया, तब ईज़ेबेल ने कहा, “क्या कुशल है, जिम्री[a]—अपने स्वामी के हत्यारे?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईज़ेबेल येहू को ताना मारते हुए ‘जिम्री’ कहती है। जिम्री ने अपने स्वामी की हत्या करके राजगद्दी हथिया ली थी (देखें 1 राजा 16:9–20)।
    reason: cross_reference
  - marker: b
    text: ‘क्या कुशल है’ का अनुवाद ‘क्या सब ठीक है?’ भी हो सकता है। ‘अपने स्वामी के हत्यारे’ का शाब्दिक अर्थ है ‘अपने स्वामी को मारनेवाला।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  choice: फाटक में आया
  rationale: यह पदबंध फाटक की ओर और उसके भीतर आने की गति व्यक्त करता है। ‘फाटक में आया’ मूल के निकट और स्वाभाविक हिन्दी है।
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता प्रसंग से ईज़ेबेल है; हिन्दी में ‘उसने’ स्वाभाविक रूप से इसका संकेत देता है।
- source_word: הֲשָׁלוֹם
  choice: क्या कुशल है
  rationale: שָׁלוֹם यहाँ शांति अथवा कुशल-मंगल संबंधी संक्षिप्त प्रश्न है। यह चयन मूल की संक्षिप्तता और संभावित व्यंग्य दोनों को बनाए रखता है।
- source_word: זִמְרִי
  choice: जिम्री
  rationale: नाम का मानक हिन्दी लिप्यंतरण; यहाँ ईज़ेबेल येहू को पहले के राजहंता जिम्री से तुलना करते हुए संबोधित करती है।
- source_word: הֹרֵג אֲדֹנָיו
  choice: अपने स्वामी के हत्यारे
  rationale: शाब्दिक अर्थ ‘अपने स्वामी को मारनेवाला’ है। संबोधन में ‘अपने स्वामी के हत्यारे’ आरोप और ताने की धार को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: ईज़ेबेल द्वारा येहू को ‘जिम्री’ कहना
  choice: इसे पूर्व राजा-हंता जिम्री से व्यंग्यात्मक तुलना मानते हुए नाम को मुख्य पाठ में यथावत रखा गया है।
  alternative: इसे बिना किसी व्याख्यात्मक संकेत के केवल एक प्रत्यक्ष नाम-संबोधन मानना।
  rationale: ऐतिहासिक प्रसंग में जिम्री ने अपने स्वामी की हत्या करके राजगद्दी हथियाई थी (1 राजा 16:9–20); अतः यह येहू के लिए तिरस्कारपूर्ण उपमा है, न कि उसकी वास्तविक पहचान।
- issue: הֲשָׁלוֹם का आशय
  choice: ‘क्या कुशल है’ के रूप में खुला रखा गया है।
  alternative: ‘क्या तू शांति से आया है?’ या ‘क्या सब ठीक है?’
  rationale: मूल का संक्षिप्त प्रश्न शांति, कुशल और स्थिति ठीक होने के अर्थों के बीच कुछ अस्पष्टता रखता है; अनुवाद उसे अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण शैली। ‘फाटक’, ‘कुशल’, और ‘स्वामी’ सामान्य पाठक के लिए बोधगम्य हैं तथा ऐतिहासिक संवाद की तीखी, व्यंग्यात्मक ध्वनि बनाए रखते हैं।
