  choice: क्या शांति है?
  rationale: ‘शांति’ संज्ञा को स्पष्ट रखा गया है, ताकि उत्तर में उसी शब्द की पुनरावृत्ति और व्यंग्यात्मक विरोध बना रहे।
- source_word: מָה הַשָּׁלוֹם
  choice: शांति कैसी
  rationale: यह संक्षिप्त आलंकारिक प्रश्न वर्तमान दशा में शांति की संभावना को नकारता है और मूल की शब्द-पुनरावृत्ति बनाए रखता है।
- source_word: עַד
  choice: जब तक ... जारी हैं
  rationale: यहाँ चलती आ रही उस स्थिति का बोध है जो शांति को असंभव बनाती है; ‘जारी हैं’ हिन्दी में इस निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זְנוּנֵי
  choice: व्यभिचार
  rationale: यह शब्द जानबूझकर कठोर नैतिक भाषा रखता है और शारीरिक, नैतिक तथा उपासना-संबंधी विश्वासघात—इन संभावित अर्थ-छायाओं को किसी एक तक सीमित नहीं करता।
- source_word: אִיזֶבֶל אִמְּךָ
  choice: तेरी माँ ईज़ेबेल के
  rationale: सम्बोधन की आरोपात्मक सीधाई और एकवचन अनौपचारिक सर्वनाम को बनाए रखा गया है।
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  choice: और उसके बहुत-से जादू-टोने
  rationale: बहुवचन और मात्रा की तीव्रता दोनों को साधारण आधुनिक हिन्दी में स्पष्ट रखा गया है।
theological_decisions:
- issue: זְנוּנֵי को केवल यौन अनैतिकता या केवल मूर्तिपूजा के अर्थ में सीमित करना
  choice: मुख्य पाठ में ‘व्यभिचार’
  alternative: ‘वेश्याचार’; ‘मूर्तिपूजा’
  rationale: मूल शब्द की कठोरता और उसके शारीरिक तथा धार्मिक विश्वासघात से जुड़े संभावित दोहरे संकेत को सुरक्षित रखा गया है; ‘मूर्तिपूजा’ अर्थ को अनावश्यक रूप से संकीर्ण कर देती।
- issue: שָׁלוֹם के दोनों प्रयोगों को अलग-अलग हिन्दी शब्दों से व्यक्त करना
  choice: दोनों स्थानों पर ‘शांति’
  alternative: पहले ‘सब कुशल है?’ और फिर ‘कैसी शांति?’
  rationale: एक ही इब्रानी शब्द की तत्काल पुनरावृत्ति यहोराम के प्रश्न और येहू के प्रत्युत्तर के बीच महत्वपूर्ण आलंकारिक संबंध बनाती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तेरी’ मूल के प्रत्यक्ष, टकरावपूर्ण सम्बोधन को व्यक्त करता है। ‘जादू-टोने’ सामान्य पाठक के लिए सहज है, जबकि ‘व्यभिचार’ मूल की नैतिक तीक्ष्णता और अर्थगत व्यापकता बनाए रखता है।
