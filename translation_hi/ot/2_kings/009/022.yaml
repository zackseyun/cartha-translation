  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
translation:
  language: hi
  text: और ऐसा हुआ कि जब यहोराम ने येहू को देखा, तो उसने कहा, “येहू, क्या शांति है?” उसने उत्तर दिया, “भला शांति कैसी हो सकती है[b], जब तक तुम्हारी माँ ईज़ेबेल के वेश्याचार[a] और उसके बहुत-से जादू-टोने जारी हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेश्यावृत्ति।” इब्रानी शब्द बहुवचन में है और इसके शाब्दिक तथा लाक्षणिक दोनों संकेत हो सकते हैं, जिनमें नैतिक तथा उपासना-संबंधी विश्वासघात शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शांति कैसी?” यहोराम के प्रश्न में आए ‘शांति’ शब्द को इब्रानी में प्रभाव के लिए दोहराया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  choice: और ऐसा हुआ कि जब ... ने ... देखा
  rationale: इब्रानी कथात्मक सूत्र और घटनाक्रम को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है।
