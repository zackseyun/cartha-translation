base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
translation:
  language: hi
  text: तब पहरेदार ने सूचना दी, “वह उनके पास पहुँच गया है, पर लौटा नहीं; और रथ हाँकने का ढंग निमशी के पुत्र येहू के ढंग जैसा है, क्योंकि वह पागलपन से[a] रथ हाँकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह पागलों की तरह रथ हाँकता है” अथवा “वह उन्मत्त होकर रथ हाँकता है।” इब्रानी में येहू के रथ हाँकने के उन्मत्त और असावधान ढंग पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד הַצֹּפֶה
  choice: तब पहरेदार ने सूचना दी
  rationale: नגד का यह कथात्मक रूप पहरेदार की आधिकारिक सूचना को व्यक्त करता है; ‘सूचना दी’ सैन्य और राजकीय संदर्भ में स्वाभाविक है।
- source_word: בָּא עַד אֲלֵיהֶם
  choice: वह उनके पास पहुँच गया है
  rationale: בוא के साथ עַד और אֶל दूत के उस दल तक पहुँच जाने को दर्शाते हैं; पूर्ण क्रिया का वर्तमान परिणाम हिंदी में ‘पहुँच गया है’ से स्पष्ट होता है।
- source_word: וְלֹא שָׁב
  choice: पर लौटा नहीं
  rationale: שוב का अर्थ लौटना है; ‘पर’ अपेक्षित वापसी न होने का विरोध स्पष्ट करता है।
- source_word: וְהַמִּנְהָג כְּמִנְהַג
  choice: और रथ हाँकने का ढंग ... के ढंग जैसा है
  rationale: מִנְהָג यहाँ נהג और रथों के प्रसंग में वाहन चलाने की विशिष्ट शैली बताता है; ‘रथ हाँकना’ प्राचीन संदर्भ के लिए सटीक और स्वाभाविक है।
- source_word: יֵהוּא בֶן נִמְשִׁי
  choice: निमशी के पुत्र येहू
  rationale: हिंदी में वंशसूचक पदबंध का स्वाभाविक क्रम रखा गया है और नामों का लिप्यंतरण किया गया है।
- source_word: כִּי בְשִׁגָּעוֹן יִנְהָג
  choice: क्योंकि वह पागलपन से रथ हाँकता है
  rationale: בְשִׁגָּעוֹן संज्ञा का क्रियाविशेषणीय प्रयोग है और उन्मत्त, अनियंत्रित ढंग का बोध कराता है; हिंदी में ‘पागलपन से’ स्रोत की तीव्र अभिव्यक्ति और अस्पष्टता दोनों बनाए रखता है।
