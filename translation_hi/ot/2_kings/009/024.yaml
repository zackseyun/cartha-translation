  text: וְ/יֵה֞וּא מִלֵּ֧א יָד֣/וֹ בַ/קֶּ֗שֶׁת וַ/יַּ֤ךְ אֶת יְהוֹרָם֙ בֵּ֣ין זְרֹעָ֔י/ו וַ/יֵּצֵ֥א הַ/חֵ֖צִי מִ/לִּבּ֑/וֹ וַ/יִּכְרַ֖ע בְּ/רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
translation:
  language: hi
  text: तब येहू ने धनुष को पूरी तरह खींचा और यहोराम की दोनों बाँहों के बीच[a] तीर मारा। तीर उसके हृदय को चीरता हुआ निकल गया, और वह अपने रथ में ही ढह गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके दोनों कंधों के बीच’ अथवा ‘उसके कंधों की हड्डियों के बीच।’ इब्रानी में शाब्दिक रूप से ‘उसकी बाँहों के बीच’ है, जो यहाँ ऊपरी पीठ या कंधों के क्षेत्र के लिए मुहावरेदार प्रयोग हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַקֶּשֶׁת
  choice: धनुष को पूरी तरह खींचा
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘धनुष पर अपना हाथ भर लिया’ है; प्रसंग में इसका अर्थ तीर चलाने के लिए धनुष को पूरा खींचना है। यह हिंदी में स्वाभाविक और सटीक है।
- source_word: וַיַּךְ
  choice: तीर मारा
  rationale: क्रिया का मूल अर्थ ‘प्रहार करना/मारना’ है। यहाँ साधन धनुष-बाण है, इसलिए ‘तीर मारा’ प्रसंग को स्पष्ट करता है, बिना वार के परिणाम को क्रिया में अनावश्यक रूप से जोड़ने के।
- source_word: בֵּין זְרֹעָיו
  choice: उसकी दोनों बाँहों के बीच
  rationale: זְרוֹעַ का सामान्य अर्थ ‘बाँह’ है। मुख्य पाठ में शाब्दिक देह-संकेत रखा गया है; संभावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  choice: तीर उसके हृदय को चीरता हुआ निकल गया
  rationale: शाब्दिक रचना ‘तीर उसके हृदय से निकल गया’ है। हिंदी में ‘को चीरता हुआ’ तीर के आर-पार निकलने और घातक घाव का स्वाभाविक बोध देता है।
- source_word: וַיִּכְרַע
  choice: वह ... ढह गया
  rationale: כרע का अर्थ झुकना, घुटने टेकना या शरीर का बैठ जाना हो सकता है। घातक तीर लगने के इस प्रसंग में ‘ढह गया’ शरीर के निढाल होकर गिरने को सहज रूप से व्यक्त करता है।
- source_word: בְּרִכְבּוֹ
  choice: अपने रथ में ही
  rationale: प्रत्यय यहोराम के अपने रथ को सूचित करता है। ‘ही’ तत्काल वहीं ढह जाने को स्वाभाविक हिंदी में उभारता है, यद्यपि कोई नया स्थानगत विवरण नहीं जोड़ता।
