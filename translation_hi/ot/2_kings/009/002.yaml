  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
translation:
  language: hi
  text: जब तुम वहाँ पहुँचो, तो वहाँ निमशी के पोते और यहोशापात के पुत्र येहू को ढूँढ़ना। भीतर जाकर उसे उसके भाइयों के बीच से उठाकर एक भीतरी कमरे[a] में ले जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कमरे के भीतर का कमरा,” अर्थात एक निजी भीतरी कक्ष।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  choice: जब तुम वहाँ पहुँचो
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार आना, जाना या पहुँचना हो सकता है; यहाँ अगले निर्देश से पहले गंतव्य पर पहुँचने का भाव स्वाभाविक है।
- source_word: וּרְאֵה שָׁם
  choice: तो वहाँ ... को ढूँढ़ना
  rationale: ראה का मूल अर्थ ‘देखना’ है, पर नामित व्यक्ति को पहचानने या खोजने के निर्देश में ‘ढूँढ़ना’ स्वाभाविक है; ‘वहाँ’ שם को स्पष्ट रखता है।
- source_word: יֵהוּא בֶן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: निमशी के पोते और यहोशापात के पुत्र येहू
  rationale: वंशावली की क्रमिक בן-रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है, जिससे निमशी को येहू का प्रत्यक्ष पिता समझने की आशंका नहीं रहती।
- source_word: וּבָאתָ
  choice: भीतर जाकर
  rationale: दूसरा בוא उस स्थान या सभा में प्रवेश करके आगे की कार्रवाई करने का संकेत देता है।
- source_word: וַהֲקֵמֹתוֹ
  choice: उसे ... उठाकर
  rationale: קום के हिफ़ील रूप का अर्थ किसी को उठाना या खड़ा करना है; ‘उठाकर’ प्रसंग में स्वाभाविक और पर्याप्त रूप से खुला है।
- source_word: מִתּוֹךְ אֶחָיו
  choice: उसके भाइयों के बीच से
  rationale: אחים का सीधा अर्थ ‘भाई’ है; सैनिक संदर्भ में यह साथियों को भी सूचित कर सकता है, पर मूल संबंध-संज्ञा को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: וְהֵבֵיאתָ אֹתוֹ
  choice: उसे ... में ले जाना
  rationale: בוא का हिफ़ील यहाँ किसी व्यक्ति को एक स्थान तक लाने या ले जाने का अर्थ देता है; हिन्दी में संबोधित व्यक्ति के दृष्टिकोण से ‘ले जाना’ सहज है।
- source_word: חֶדֶר בְּחָדֶר
  choice: एक भीतरी कमरे में
  rationale: शाब्दिक पुनरुक्त अभिव्यक्ति अत्यंत निजी या अंदरूनी कक्ष को सूचित करती है; स्पष्ट हिन्दी रूप मुख्य पाठ में और शाब्दिक रूप पादटिप्पणी में रखा गया है।
