base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
translation:
  language: hi
  text: 'तब वह उठकर घर के भीतर गया। उस युवक ने उसके सिर पर तेल उंडेला और उससे कहा, “इस्राएल का परमेश्वर याहवे यह कहता है: मैंने तुझे याहवे की प्रजा, अर्थात् इस्राएल, का राजा होने के लिए अभिषेक किया है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुझे याहवे की प्रजा, अर्थात् इस्राएल, का राजा होने के लिए अभिषेक करता हूँ।” इस अभिषेक-विधि में इब्रानी पूर्ण क्रिया को ऐसा अनुष्ठानिक कथन भी समझा जा सकता है जिसके कहे जाने से नियुक्ति संपन्न होती है।
    reason: वैकल्पिक व्याकरणिक और अनुष्ठानिक अर्थ
lexical_decisions:
- source_word: וַיָּקָם וַיָּבֹא הַבַּיְתָה
  choice: तब वह उठकर घर के भीतर गया
  rationale: क्रमिक कथात्मक क्रियाओं को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; दिशासूचक रूप הַבַּיְתָה घर के भीतर जाने का भाव देता है।
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  choice: उस युवक ने उसके सिर पर तेल उंडेला
  rationale: יצק का मूल अर्थ ‘उंडेलना’ है। पिछले प्रसंग के कर्ता को ‘उस युवक’ कहकर स्पष्ट किया गया है, जिससे लगातार आने वाले पुरुषवाचक सर्वनाम हिन्दी में भ्रम न पैदा करें।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह भविष्यद्वक्ता के संदेश की मानक उद्घोषणा है; वर्तमानकालीन हिन्दी रूप संदेश की प्रत्यक्ष और अधिकृत प्रकृति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय ध्वन्यात्मक रूप में रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מְשַׁחְתִּיךָ
  choice: मैंने तेरा अभिषेक ... किया है
  rationale: इब्रानी पूर्ण रूप अभी-अभी संपन्न अभिषेक और उसके वर्तमान परिणाम को व्यक्त करता है; अनुष्ठानिक कथन की क्रियात्मक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: לְמֶלֶךְ אֶל עַם יְהוָה אֶל יִשְׂרָאֵל
  choice: याहवे की प्रजा, इस्राएल, का राजा होने के लिए
  rationale: राजकीय नियुक्ति का भाव स्वाभाविक हिन्दी में व्यक्त किया गया है, और ‘इस्राएल’ को ‘याहवे की प्रजा’ के समानाधिकरण के रूप में बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का स्पष्ट प्रयोग करता है; ‘याहवे’ उसे किसी सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- issue: מְשַׁחְתִּיךָ में पूर्ण क्रिया और अनुष्ठानिक उद्घोषणा का संबंध
  choice: मैंने तेरा अभिषेक ... किया है
  alternative: मैं तेरा अभिषेक ... करता हूँ
  rationale: मुख्य पाठ इब्रानी पूर्ण क्रिया और अभी संपन्न तेल उंडेलने की घटना को दर्शाता है; साथ ही उसके संभावित performative अर्थात उसी कथन द्वारा नियुक्ति संपन्न करने वाले अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘तेरा’ मूल के एकवचन संबोधन को स्वाभाविक रूप से दर्शाता है। सर्वनामगत भ्रम घटाने के लिए पिछले प्रसंग के अभिषेक करने वाले पात्र को ‘उस युवक’ कहा गया है; किसी व्याख्यात्मक नाम को पाठ में नहीं जोड़ा गया।
