base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
translation:
  language: hi
  text: तब वे उसे दफ़नाने गए, पर उन्हें उसकी खोपड़ी, पैर और हाथों की हथेलियों के सिवा उसका कुछ भी नहीं मिला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्हें उसमें खोपड़ी, पैर और हाथों की हथेलियों के सिवा कुछ नहीं मिला।” यहाँ “उसमें” का आशय उसके शरीर में से बचे अंशों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: तब वे गए
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक क्रम व्यक्त करता है।
- source_word: לְקָבְרָהּ
  choice: उसे दफ़नाने
  rationale: קבר के धात्वर्थ और स्त्रीलिंग एकवचन प्रत्यय को स्वाभाविक हिन्दी में रखा गया है; संकेत ईज़ेबेल की ओर है।
- source_word: וְלֹא מָצְאוּ בָהּ
  choice: पर उन्हें ... उसका कुछ भी नहीं मिला
  rationale: संदर्भ में וְ का विरोधसूचक भाव है। בָהּ का शाब्दिक अर्थ ‘उसमें’ है, पर यहाँ आशय उसके शरीर के बचे हुए अंशों से है; मुख्य पाठ में स्वाभाविक हिन्दी और पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
- source_word: כִּי אִם
  choice: के सिवा
  rationale: यह संयुक्त पद अपवाद व्यक्त करता है; ‘के सिवा’ सहज और सटीक हिन्दी है।
- source_word: הַגֻּלְגֹּלֶת
  choice: खोपड़ी
  rationale: यहाँ शब्द पूरे सिर के बजाय शरीर से बची खोपड़ी को दर्शाता है और दृश्य की तीक्ष्णता बनाए रखता है।
- source_word: וְהָרַגְלַיִם
  choice: पैर
  rationale: द्विवचन רַגְלַיִם का इस शारीरिक संदर्भ में सीधा और सामान्य हिन्दी समतुल्य ‘पैर’ है।
- source_word: וְכַפּוֹת הַיָּדָיִם
  choice: हाथों की हथेलियाँ
  rationale: כַּפּוֹת हाथों के विशिष्ट भीतरी भाग को दर्शाता है; केवल ‘हाथ’ कहने की अपेक्षा यह इब्रानी की विशिष्टता सुरक्षित रखता है।
