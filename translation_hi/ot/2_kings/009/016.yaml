base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
translation:
  language: hi
  text: तब येहू सवार हुआ[a] और यिज्रेल को गया, क्योंकि योराम वहाँ पड़ा हुआ था। और यहूदा का राजा अहज्याह योराम को देखने[b] नीचे गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चढ़ा।” इब्रानी में येहू के सवार होने और उसके यिज्रेल जाने के लिए अलग-अलग क्रियाएँ हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “देखने” का आशय उससे मिलने या उसकी भेंट करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: सवार हुआ
  rationale: רכב चढ़ने या सवारी करने की क्रिया बताता है। “सवार हुआ” अगले अलग क्रियापद וַיֵּלֶךְ (“गया”) से इसका भेद बनाए रखता है और किसी ऐसे वाहन को स्पष्ट नहीं करता जिसका इस पद में नाम नहीं है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य अर्थ “जाना” है; गंतव्य यिज्रेल अगले शब्द से स्पष्ट है।
- source_word: יִזְרְעֶאלָה
  choice: यिज्रेल को
  rationale: स्थान-नाम के साथ दिशासूचक ה गति का लक्ष्य बताता है। आधुनिक हिंदी में “यिज्रेल को गया” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי येहू के यिज्रेल जाने का कारण प्रस्तुत करता है।
- source_word: שֹׁכֵב
  choice: पड़ा हुआ था
  rationale: שׁכב के कृदंत का मूल भाव लेटे या पड़े होने का है। प्रसंग में योराम घायल था, पर अनुवाद उसकी चिकित्सीय दशा को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: שָׁמָּה
  choice: वहाँ
  rationale: सरल स्थानवाचक क्रियाविशेषण का स्वाभाविक हिंदी समतुल्य।
- source_word: יָרַד
  choice: नीचे आया था
  rationale: ירד उतरने या नीचे जाने को दर्शाता है। पूर्वकालिक “आया था” बताता है कि अहज्याह का पहुँचना येहू के प्रस्थान से पहले हो चुका था; “नीचे” स्थलाकृतिक भाव सुरक्षित रखता है।
- source_word: לִרְאוֹת אֶת
  choice: को देखने
  rationale: शाब्दिक अर्थ “देखने” है; प्रसंग में आशय मिलने या भेंट करने का है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा का राजा
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: יֵהוּא / יוֹרָם / אֲחַזְיָה / יִזְרְעֶאל / יְהוּדָה
  choice: येहू / योराम / अहज्याह / यिज्रेल / यहूदा
  rationale: व्यक्तियों और स्थानों के नाम इब्रानी रूपों के निकट, प्रचलित हिंदी बाइबलीय वर्तनी में लिप्यंतरित किए गए हैं।
