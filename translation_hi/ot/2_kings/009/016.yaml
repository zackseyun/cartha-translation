    issue: ‘अहज्याह भी’ adds ‘also.’
    rationale: The Hebrew conjunction וַ is coordinative (‘and’); it does not explicitly mark Ahaziah’s action as additional in the emphatic sense conveyed by ‘भी.’
  - severity: medium
    issue: ‘नीचे आया था’ renders יָרַד as ‘came down.’
    rationale: The Hebrew verb means ‘went down/descended’; no deictic ‘came’ is supplied. ‘नीचे गया था’ preserves the source wording and prior-action sense.
