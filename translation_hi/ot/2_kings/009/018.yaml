base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
translation:
  language: hi
  text: 'तब घुड़सवार उससे मिलने गया और बोला, “राजा यह कहता है: ‘क्या शान्ति है?’[a]” पर येहू ने कहा, “तुझे शान्ति से क्या लेना-देना? मुड़कर मेरे पीछे हो ले।” तब पहरेदार ने सूचना दी, “सन्देशवाहक उनके पास पहुँच गया है, पर लौटा नहीं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या सब कुशल है?” हिब्रू में यहाँ शालोम शब्द है, जो इस पूरे संवाद में बार-बार आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  choice: घुड़सवार
  rationale: शाब्दिक अर्थ ‘घोड़े का सवार’ है; सैन्य-सन्देशवाहक के प्रसंग में ‘घुड़सवार’ स्वाभाविक और सटीक हिन्दी है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: यह पद किसी की ओर जाकर उससे मिलने की गति व्यक्त करता है।
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा यह कहता है
  rationale: राजकीय सन्देश के औपचारिक सूत्र को स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֲשָׁלוֹם
  choice: क्या शान्ति है?
  rationale: ‘शान्ति’ रखकर पूरे संवाद में दोहराए गए שָׁלוֹם शब्द और उसकी कथात्मक विडम्बना को सुरक्षित रखा गया है।
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: तुझे शान्ति से क्या लेना-देना?
  rationale: हिब्रू मुहावरे की तिरस्कारपूर्ण झिड़की को स्वाभाविक हिन्दी में व्यक्त करते हुए ‘शान्ति’ की पुनरावृत्ति बनाए रखता है।
- source_word: סֹב אֶל אַחֲרָי
  choice: मुड़कर मेरे पीछे हो ले
  rationale: ‘मुड़’ और ‘मेरे पीछे’ दोनों मूल घटकों को रखता है और प्रसंग में दल के पीछे लग जाने का भाव सहज बनाता है।
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: ऊँचे स्थान से निगरानी करने वाले व्यक्ति के लिए सामान्य और सुबोध हिन्दी पद है।
- source_word: הַמַּלְאָךְ
  choice: सन्देशवाहक
  rationale: इस ऐतिहासिक प्रसंग में यह मानवीय दूत है; ‘सन्देशवाहक’ स्वर्गदूत संबंधी भ्रम से बचाता है।
- source_word: בָּא ... עַד הֵם
  choice: उनके पास पहुँच गया
  rationale: उनके स्थान तक आ पहुँचने का अर्थ संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: וְלֹא שָׁב
  choice: पर लौटा नहीं
  rationale: पहरेदार की दृष्टि से दिखाई देने वाले परिणाम को हिन्दी कथन में सहजता से व्यक्त करता है।
