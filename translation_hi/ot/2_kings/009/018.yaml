  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘शान्ति’ की पुनरावृत्ति मूल हिब्रू की शब्द-संगति और तनाव को बनाए रखती है। ‘मेरे पीछे हो ले’ आदेश के सैन्य-सन्दर्भीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है; इसके लिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
