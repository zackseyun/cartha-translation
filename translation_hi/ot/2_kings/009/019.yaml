base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
translation:
  language: hi
  text: 'तब उसने दूसरे घुड़सवार को भेजा। वह उनके पास आया और बोला, “राजा यों कहता है: क्या कुशल है?[a]” पर येहू ने कहा, “तुझे कुशल से क्या लेना-देना? मुड़कर मेरे पीछे आ जा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या शांति है?” इब्रानी शब्द שָׁלוֹם का अर्थ “शांति,” “कुशलता” या “भलाई” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  choice: घोड़े पर सवार एक दूसरे दूत
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘घोड़े का सवार, दूसरा’ है। प्रसंग में वह राजा का संदेशवाहक है; इसलिए ‘दूत’ भूमिका स्पष्ट करता है और ‘एक दूसरे’ क्रम को बनाए रखता है।
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: राजा यह कहता है
  rationale: यह राजकीय संदेश का प्रचलित सूत्र है। आधुनिक हिन्दी में स्वाभाविक रहते हुए इसकी औपचारिकता बनी रहती है।
- source_word: שָׁלוֹם
  choice: कुशल
  rationale: यहाँ शब्द शांति, सकुशलता और स्थिति ठीक होने—इन सब अर्थों को समेटता है। ‘कुशल’ प्रश्न और येहू के उत्तर दोनों में उसी शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  choice: तुझे कुशल से क्या काम?
  rationale: यह इब्रानी मुहावरे की टकरावपूर्ण और उपेक्षापूर्ण शक्ति को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: סֹב אֶל אַחֲרָי
  choice: मुड़कर मेरे पीछे हो जा
  rationale: यह ‘मुड़’ और ‘मेरे पीछे’ दोनों घटकों को बनाए रखता है और बिना अनावश्यक विस्तार के आदेश का आशय बताता है कि सवार येहू के दल के पीछे लग जाए।
