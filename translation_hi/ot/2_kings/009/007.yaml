source:
  edition: WLC
  text: וְ/הִ֨כִּיתָ֔ה אֶת בֵּ֥ית אַחְאָ֖ב אֲדֹנֶ֑י/ךָ וְ/נִקַּמְתִּ֞י דְּמֵ֣י עֲבָדַ֣/י הַ/נְּבִיאִ֗ים וּ/דְמֵ֛י כָּל עַבְדֵ֥י יְהוָ֖ה מִ/יַּ֥ד אִיזָֽבֶל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/007.yaml
  text: And you shall strike down the house of Ahab your master[a], and I will avenge the blood of my servants the prophets and the blood of all the servants of Yahweh from the hand of Jezebel.
translation:
  language: hi
  text: तू अपने स्वामी अहाब के घराने को मार गिराएगा, और मैं अपने सेवक नबियों के खून का और यहोवा के सभी सेवकों के खून का बदला ईज़ेबेल के हाथ से लूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ईज़ेबेल के हाथ से” एक इब्रानी मुहावरा है, जिसका अर्थ है “ईज़ेबेल के द्वारा” या “जिसके लिए ईज़ेबेल उत्तरदायी थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִכִּיתָה
  choice: तू ... मार गिराना
  rationale: नכה यहाँ राजवंश पर निर्णायक और प्राणघातक दंड को व्यक्त करता है; ‘मार गिराना’ आधुनिक हिन्दी में इसकी शक्ति बनाए रखता है। आज्ञार्थक रूप उस भविष्यसूचक आदेश का स्वाभाविक हिन्दी रूप है।
- source_word: בֵּית אַחְאָב
  choice: अहाब का घराना
  rationale: राजकीय और पारिवारिक संदर्भ में בַּיִת केवल भवन नहीं, बल्कि परिवार और राजवंश को दर्शाता है; ‘घराना’ हिन्दी में यह अर्थ सहजता से देता है।
- source_word: אֲדֹנֶיךָ
  choice: तेरा स्वामी
  rationale: यह मनुष्य के रूप में येहू के वरिष्ठ अहाब को सूचित करता है, इसलिए ‘स्वामी’ उपयुक्त है और इसे परमेश्वर के लिए प्रयुक्त उपाधि से अलग रखता है।
- source_word: וְנִקַּמְתִּי
  choice: मैं ... बदला लूँगा
  rationale: נקם पीड़ितों की ओर से किए जाने वाले दैवी प्रतिदंड को व्यक्त करता है; ‘बदला लूँगा’ स्पष्ट, प्रचलित और न्यायकारी बल को बनाए रखने वाला रूप है।
- source_word: דְּמֵי
  choice: खून
  rationale: बहुवचन ‘रक्तों’ हत्या से उत्पन्न रक्तदोष अथवा बहाए गए रक्त का इब्रानी मुहावरा है; हिन्दी में ‘खून’ इस संदर्भ में स्वाभाविक है।
- source_word: עֲבָדַי הַנְּבִיאִים
  choice: मेरे सेवक नबी
  rationale: यह पदबंध नबियों की पहचान परमेश्वर के सेवकों के रूप में करता है; हिन्दी में यह विशेषणात्मक-समानाधिकरण रचना सहज है।
- source_word: כָּל עַבְדֵי יְהוָה
  choice: यहोवा के सभी सेवक
  rationale: यह संबंधवाचक संरचना और ‘सभी’ के व्यापक दायरे को स्पष्ट रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दैवी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
- source_word: מִיַּד אִיזָבֶל
  choice: ईज़ेबेल के हाथ से
  rationale: शाब्दिक इब्रानी मुहावरे को सुरक्षित रखा गया है; यहाँ ‘हाथ’ ईज़ेबेल की कर्तृता और उत्तरदायित्व को दर्शाता है।
theological_decisions:
- issue: दैवी प्रतिशोध की भाषा
  choice: मैं ... बदला लूँगा
  alternative: मैं ... का प्रतिशोध लूँगा
  rationale: पद प्रतिदंड को स्पष्ट रूप से परमेश्वर का कार्य बताता है। अनुवाद इस दावे को न नरम करता है, न उसके न्यायशास्त्रीय अर्थ को पाठ से आगे बढ़ाता है।
- issue: ईज़ेबेल की कर्तृता
  choice: ईज़ेबेल के हाथ से
  alternative: ईज़ेबेल से / जिसका दोष ईज़ेबेल पर है
  rationale: मूल मुहावरे और उसमें निहित कर्तृता को मुख्य पाठ में सुरक्षित रखा गया है; पादटिप्पणी उसका आशय स्पष्ट करती है, बिना यह तय किए कि हर हत्या प्रत्यक्ष रूप से उसी ने की थी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘घराना’, ‘मार गिराना’ और ‘खून का बदला लेना’ जैसे स्वाभाविक हिन्दी प्रयोग मूल की राजवंशीय, हिंसक और न्यायकारी तीव्रता को बनाए रखते हैं।
