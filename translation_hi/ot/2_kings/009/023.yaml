lexical_decisions:
- source_word: וַיַּהֲפֹךְ יָדָיו
  choice: अपने हाथ मोड़कर
  rationale: इब्रानी वाक्यांश का शाब्दिक अर्थ ‘अपने हाथ मोड़े/फेरे’ है। रथ के प्रसंग में आशय संभवतः हाथों से रथ मोड़ना है, पर मूल पाठ लगाम या रथ का स्पष्ट उल्लेख नहीं करता।
- source_word: וַיָּנֹס
  choice: भाग निकला
  rationale: नैरेटिव प्रसंग में נוס भय या संकट से भागने को व्यक्त करता है; ‘भाग निकला’ स्वाभाविक और तात्कालिकता से युक्त है।
- source_word: מִרְמָה
  choice: विश्वासघात
  rationale: यह शब्द छल, कपट या दगाबाज़ी को दर्शाता है। यहाँ अचानक शत्रुतापूर्ण कार्रवाई देखकर चेतावनी के रूप में ‘विश्वासघात’ उपयुक्त है, जबकि ‘राजद्रोह’ मूल से अधिक राजनीतिक रूप से विशिष्ट होगा।
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  choice: अहज्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है; सीधे संबोधन में नाम की पुनरावृत्ति मूल पाठ की तात्कालिकता बनाए रखती है।
