  yaml_path: translation/ot/2_kings/009/029.yaml
  text: In the eleventh year of Joram son of Ahab[a], Ahaziah became king over Judah.
translation:
  language: hi
  text: अहाब के पुत्र योराम के शासन के ग्यारहवें वर्ष में[a] अहज्याह यहूदा का राजा बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: योराम और अहज्याह के शासनकाल से जुड़ी कालसूचनाओं का राजाओं और इतिहास की पुस्तकों में परस्पर सामंजस्य बैठाना कठिन है। यहाँ मुख्य पाठ में कालक्रम को सुलझाने का प्रयास किए बिना इब्रानी पाठ को जैसा लिखा है वैसा ही प्रस्तुत किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  choice: के ... वर्ष में
  rationale: संयोजक וּ और कालसूचक בִ का अर्थ यहाँ राजकीय तिथि बताना है। स्वाभाविक हिन्दी में आरम्भिक ‘और’ आवश्यक नहीं है।
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  choice: ग्यारहवें वर्ष
  rationale: यह इब्रानी राजकीय कालगणना की प्रचलित क्रमवाचक अभिव्यक्ति है।
- source_word: לְיוֹרָם
  choice: योराम के शासन के
  rationale: राजकीय सूत्र में לְ दूसरे राजा के शासन को कालगणना का आधार बनाता है; हिन्दी में ‘के शासन के ... वर्ष में’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן אַחְאָב
  choice: अहाब के पुत्र
  rationale: यह सीधा पितृनाम-सूचक परिचय है, जो संबंधित योराम की पहचान करता है।
- source_word: מָלַךְ
  choice: राजा बना
  rationale: इस राजकीय सूचना में क्रिया सिंहासनारोहण या राजत्व आरम्भ होने का बोध कराती है, केवल शासन की अवधि का नहीं।
- source_word: אֲחַזְיָה
  choice: अहज्याह
  rationale: नाम के इब्रानी रूप אֲחַזְיָה का निकट और हिन्दी में पठनीय लिप्यंतरण।
- source_word: עַל יְהוּדָה
  choice: यहूदा का राजा
  rationale: מָלַךְ के साथ עַל किसी क्षेत्र पर शासन दर्शाता है। हिन्दी में ‘यहूदा का राजा बना’ अधिक स्वाभाविक है और वही संबंध व्यक्त करता है।
theological_decisions:
- issue: योराम और अहज्याह से संबंधित राजकीय कालक्रम
  choice: मुख्य पाठ में इब्रानी के अनुसार ‘ग्यारहवें वर्ष’ रखा गया
  alternative: राजाओं और इतिहास की अन्य कालसूचनाओं से सामंजस्य बैठाने के लिए संख्या या गणना बदलना
  rationale: पाठ में उपस्थित कालसूचना को बिना संशोधन सुरक्षित रखना उचित है; कालक्रम की कठिनाई को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज राजकीय कालसूचना। नामों के लिए स्रोत-निकट देवनागरी रूप अपनाए गए हैं।
