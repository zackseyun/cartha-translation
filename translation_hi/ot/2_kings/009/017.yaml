base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/017.yaml
  text: The watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
translation:
  language: hi
  text: पहरेदार यिज्रेल में मीनार पर खड़ा था। जब येहू आ रहा था, तब उसने उसके दल को देखा और कहा, “मुझे एक दल दिखाई दे रहा है।” तब यहोराम ने कहा, “एक घुड़सवार को उनसे मिलने भेजो, और वह पूछे, ‘क्या कुशल है?’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या सब ठीक है?” अथवा, “क्या तुम शांति से आए हो?”
    reason: इब्रानी प्रश्न संक्षिप्त और अर्थ की दृष्टि से खुला है; वह कुशलता या शांतिपूर्ण उद्देश्य, दोनों के विषय में हो सकता है।
lexical_decisions:
- source_word: הַצֹּפֶה
  choice: पहरेदार
  rationale: यह शब्द निगरानी करने वाले व्यक्ति को दर्शाता है; कथा के इस प्रसंग में ‘पहरेदार’ स्वाभाविक और स्पष्ट है।
- source_word: עֹמֵד
  choice: खड़ा था
  rationale: कृदंत दृश्य की पृष्ठभूमि में जारी अवस्था बताता है; ‘खड़ा था’ उस स्थायी क्रिया-भाव को रखता है।
- source_word: הַמִּגְדָּל
  choice: मीनार
  rationale: मूल शब्द का सामान्य अर्थ ‘मीनार’ है; संदर्भ से पहरे की मीनार समझ में आती है, इसलिए अतिरिक्त विशिष्टीकरण नहीं जोड़ा गया।
- source_word: בְּיִזְרְעֶאל
  choice: यिज्रेल में
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: שִׁפְעַת
  choice: दल
  rationale: यहाँ शब्द दिखाई देने वाले लोगों के बड़े समूह को दर्शाता है; सैन्य-यात्रा के संदर्भ में ‘दल’ सहज है और समूह का आकार अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्ति-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בְּבֹאוֹ
  choice: आते
  rationale: पूर्वसर्गयुक्त infinitive construct येहू के निकट आने के समय को बताता है; ‘आते देखा’ हिन्दी में स्वाभाविक रूप से यह संबंध व्यक्त करता है।
- source_word: שִׁפְעַת אֲנִי רֹאֶה
  choice: मुझे एक दल दिखाई दे रहा है
  rationale: पहले प्रयुक्त संज्ञा ‘दल’ की पुनरावृत्ति बनाए रखते हुए वर्तमान दृश्य-बोध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: קַח רַכָּב
  choice: एक घुड़सवार को लेकर
  rationale: एकवचन और आगे आने वाली एकवचन क्रियाएँ एक सवार दूत की ओर संकेत करती हैं; ‘घुड़सवार’ संदर्भ के अनुकूल है।
- source_word: וּשְׁלַח לִקְרָאתָם
  choice: उनसे मिलने भेजो
  rationale: मसोरेटिक पाठ में प्रत्यय बहुवचन है, इसलिए दिखाई दे रहे पूरे दल के लिए ‘उनसे’ रखा गया है।
- source_word: וְיֹאמַר
  choice: और वह पूछे
  rationale: आज्ञार्थक क्रम के बाद imperfect/jussive अप्रत्यक्ष आदेश व्यक्त करता है; प्रश्न की भूमिका के कारण हिन्दी में ‘वह पूछे’ स्वाभाविक है।
- source_word: הֲשָׁלוֹם
  choice: क्या कुशल है?
  rationale: संक्षिप्त इब्रानी प्रश्न शांति, कुशलता अथवा शांतिपूर्ण मंशा के विषय में पूछता है। ‘क्या कुशल है?’ उसकी संक्षिप्तता और प्रसंगगत खुलापन बनाए रखता है।
