base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
translation:
  language: hi
  text: तब वह आया, और वहाँ सेना के सेनापति बैठे हुए थे। उसने कहा, “हे सेनापति, मेरे पास आपसे कहने के लिए एक बात[a] है।” येहू ने कहा, “हम सब में से किससे?” उसने कहा, “आपसे, हे सेनापति।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक संदेश।” इब्रानी में शाब्दिक रूप से, “मेरे पास आपकी ओर एक बात है, हे सेनापति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब वह आया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की स्वाभाविक क्रमिकता व्यक्त करता है और בוא के सामान्य अर्थ ‘आना’ को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखा कि
  rationale: הִנֵּה दृश्य की ओर अचानक ध्यान खींचता है। इस प्रसंग में ‘देखा कि’ आधुनिक हिन्दी में उसी प्रस्तुतिकरण-बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׂרֵי הַחַיִל
  choice: सेना के सेनापति
  rationale: שָׂרִים सैन्य अगुवों को और הַחַיִל सेना को सूचित करता है; यह पदबंध आधुनिक हिन्दी में स्पष्ट है और किसी आधुनिक निश्चित सैन्य पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: יֹשְׁבִים
  choice: बैठे हुए थे
  rationale: कृदंत उनकी उस समय जारी अवस्था का चित्र प्रस्तुत करता है; ‘बैठे हुए थे’ यह पक्ष सुरक्षित रखता है।
- source_word: דָּבָר לִי אֵלֶיךָ
  choice: मेरे पास आपके लिए एक बात है
  rationale: इब्रानी वाक्यांश शाब्दिक रूप से असामान्य है, पर उसका आशय वक्ता के पास संबोधित व्यक्ति के लिए कथन या संदेश होने से है। हिन्दी में यह रूप स्वाभाविक रहते हुए דָּבָר के व्यापक अर्थ ‘बात’ को बनाए रखता है।
- source_word: הַשַּׂר
  choice: हे सेनापति
  rationale: यह सैन्य अगुवे को प्रत्यक्ष संबोधन है। ‘सेनापति’ प्रसंगानुकूल है और ‘राजकुमार’ जैसे गैर-सैन्य अर्थ से बचता है; ‘हे’ संबोधन को स्पष्ट करता है।
- source_word: אֶל־מִי מִכֻּלָּנוּ
  choice: हम सब में से किसके लिए?
  rationale: प्रश्न उपस्थित सैन्य अगुवों में से अभिप्रेत व्यक्ति की पहचान पूछता है। ‘हम सब में से’ מִכֻּלָּנוּ के अंशवाची भाव को और ‘किसके लिए’ हिन्दी में संवाद की दिशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵלֶיךָ הַשָּׂר
  choice: आपके लिए, हे सेनापति
  rationale: उत्तर पहले कथन की भाषा को दोहराकर येहू को अभिप्रेत व्यक्ति के रूप में स्पष्ट करता है और प्रत्यक्ष संबोधन बनाए रखता है।
