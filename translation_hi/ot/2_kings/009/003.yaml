source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ פַךְ הַ/שֶּׁ֨מֶן֙ וְ/יָצַקְתָּ֣ עַל רֹאשׁ֔/וֹ וְ/אָֽמַרְתָּ֙ כֹּֽה אָמַ֣ר יְהוָ֔ה מְשַׁחְתִּ֥י/ךָֽ לְ/מֶ֖לֶךְ אֶל יִשְׂרָאֵ֑ל וּ/פָתַחְתָּ֥ הַ/דֶּ֛לֶת וְ/נַ֖סְתָּה וְ/לֹ֥א תְחַכֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/003.yaml
  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
translation:
  language: hi
  text: 'फिर तेल की कुप्पी लेना, उसके सिर पर तेल उँडेलना और कहना, ‘याहवे यों कहता है: मैंने तुझे इस्राएल का राजा होने के लिए अभिषेक किया है।’ फिर द्वार खोलकर भाग जाना; रुकना मत।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַךְ הַשֶּׁמֶן
  choice: तेल की कुप्पी
  rationale: פַךְ किसी द्रव के छोटे पात्र को दर्शाता है। ‘कुप्पी’ छोटे पात्र का भाव देता है और ‘तेल’ मूल पाठ के הַשֶּׁמֶן को बिना ‘जैतून का’ जोड़े प्रस्तुत करता है।
- source_word: וְיָצַקְתָּ עַל רֹאשׁוֹ
  choice: उसके सिर पर तेल उँडेलना
  rationale: יצק के साथ עַל का सीधा भाव किसी वस्तु पर उँडेलना है। हिंदी में स्पष्टता के लिए कर्म ‘तेल’ दोहराया गया है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह नबी के संदेश का औपचारिक सूत्र है। ‘यों कहता है’ उसकी गरिमा और सूत्रात्मक स्वर को बनाए रखता है।
- source_word: מְשַׁחְתִּיךָ
  choice: मैंने ... तेरा अभिषेक किया है
  rationale: पूर्ण क्रिया को पूर्ण हुए, किंतु वर्तमान नियुक्ति से संबद्ध कार्य के रूप में व्यक्त किया गया है; ‘अभिषेक’ राजकीय अनुष्ठान के लिए मानक और समझने योग्य शब्द है।
- source_word: לְמֶלֶךְ אֶל יִשְׂרָאֵל
  choice: इस्राएल पर राजा होने के लिए
  rationale: לְמֶלֶךְ पद पर नियुक्ति बताता है। אֶל का सामान्य दिशात्मक अर्थ असामान्य है, पर इस राजकीय नियुक्ति-सूत्र में शासन-संबंधी भाव स्वाभाविक है; इसीलिए मुख्य पाठ में ‘पर’ रखा गया और शाब्दिक विकल्प पादटिप्पणी में दिया गया।
- source_word: וּפָתַחְתָּ הַדֶּלֶת
  choice: फिर द्वार खोलकर
  rationale: क्रमिक निर्देश को स्वाभाविक आधुनिक हिंदी में ‘फिर’ से व्यक्त किया गया है। ‘द्वार’ गरिमापूर्ण पर सामान्यतः समझ में आने वाला शब्द है।
- source_word: וְנַסְתָּה
  choice: भाग जाना
  rationale: נוס शीघ्र और संकटपूर्ण प्रस्थान का संकेत देता है। ‘भाग जाना’ आधुनिक हिंदी में ‘पलायन करना’ से अधिक सहज और उतना ही तात्कालिक है।
- source_word: וְלֹא תְחַכֶּה
  choice: रुकना मत
  rationale: חכה का अर्थ प्रतीक्षा करना या ठहरे रहना है। प्रसंग में ‘रुकना मत’ संक्षिप्तता और तात्कालिकता दोनों बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: राजा के रूप में अभिषेक के वचन का काल
  choice: मैंने ... तेरा अभिषेक किया है
  alternative: मैं ... तेरा अभिषेक करता हूँ
  rationale: इब्रानी पूर्ण रूप מְשַׁחְתִּיךָ को बनाए रखते हुए इसे अनुष्ठान के साथ प्रभावी होने वाली पूर्ण नियुक्ति के रूप में प्रस्तुत किया गया है; वर्तमानकालीन विकल्प भी क्रियात्मक उद्घोषणा के रूप में संभव है, पर वह क्रिया-रूप को कम प्रत्यक्ष दिखाता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। गुरु द्वारा अपने युवा दूत को दिए गए सीधे निर्देशों के अनुरूप ‘लेना’, ‘उँडेलना’, ‘भाग जाना’ जैसे आज्ञार्थक अनंत रूप और संबोधन में ‘तेरा’ प्रयुक्त हुआ है। भविष्यवाणी-सूत्र के औपचारिक स्वर के लिए ‘यों कहता है’ रखा गया है।
