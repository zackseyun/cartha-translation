base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
translation:
  language: hi
  text: तब भविष्यवक्ता एलीशा ने भविष्यवक्ताओं के चेलों में से एक को[a] बुलाकर उससे कहा, “अपनी कमर कसो[b], तेल की यह कुप्पी अपने हाथ में लो और रामोत-गिलाद जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “भविष्यवक्ताओं के पुत्रों में से एक।” यह पद सामान्यतः भविष्यवक्ताओं के किसी समूह के सदस्य के लिए प्रयुक्त होता है, आवश्यक नहीं कि जैविक पुत्र हो।
    reason: cultural_note
  - marker: b
    text: शाब्दिक चित्र वस्त्र को कमर पर कस लेने का है, ताकि व्यक्ति यात्रा या कार्य के लिए तैयार हो सके।
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע הַנָּבִיא
  choice: तब भविष्यवक्ता एलीशा
  rationale: वाव कथा को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब’ रखा गया है। הַנָּבִיא को एलीशा की निश्चित उपाधि के रूप में ‘भविष्यवक्ता’ अनूदित किया गया है।
- source_word: קָרָא לְאַחַד
  choice: एक को बुलाकर
  rationale: קרא का मूल अर्थ ‘बुलाना’ है; हिन्दी वाक्य-प्रवाह में अगले क्रियापद से जोड़ने के लिए ‘बुलाकर’ स्वाभाविक है।
- source_word: מִבְּנֵי הַנְּבִיאִים
  choice: भविष्यवक्ताओं के चेलों में से
  rationale: शाब्दिक ‘भविष्यवक्ताओं के पुत्रों’ का आशय किसी भविष्यवाणी-संबंधी समूह के सदस्य या शिष्य हैं, न कि अनिवार्य रूप से जैविक पुत्र। ‘चेलों’ से आधुनिक हिन्दी पाठक को यह सामुदायिक-शिष्य संबंध सहज समझ आता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וַיֹּאמֶר לוֹ
  choice: उससे कहा
  rationale: मानक कथात्मक वचन-परिचय का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: חֲגֹר מָתְנֶיךָ
  choice: अपनी कमर कसो
  rationale: इब्रानी का ठोस मुहावरा हिन्दी में भी प्रचलित और बोधगम्य है तथा तैयारी और तत्परता का भाव बनाए रखता है।
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  choice: तेल की यह कुप्पी
  rationale: פַּךְ तेल रखने का छोटा पात्र है; ‘कुप्पी’ उसके आकार और उपयोग को ‘घड़े’ की अपेक्षा अधिक ठीक व्यक्त करती है।
- source_word: בְּיָדֶךָ
  choice: हाथ में
  rationale: मूल पाठ की ठोस अभिव्यक्ति को सामान्य ‘अपने साथ’ में बदले बिना रखा गया है।
- source_word: וְלֵךְ רָמֹת גִּלְעָד
  choice: और गिलाद के रामोत को जाओ
  rationale: स्थान-नाम को हिन्दी रूप में प्रस्तुत करते हुए दोनों नामों का संबंध ‘गिलाद के रामोत’ से स्पष्ट किया गया है।
