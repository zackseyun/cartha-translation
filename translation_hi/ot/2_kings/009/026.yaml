language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
translation:
  language: hi
  text: ‘निश्चय ही मैंने कल नाबोत के खून और उसके बेटों के खून को देखा था,’ यहोवा की यह घोषणा है, ‘और मैं इसी भूखंड पर तुझे इसका बदला चुकाऊँगा,’ यहोवा की यह घोषणा है। ‘इसलिए अब उसे उठाकर इसी भूखंड पर फेंक दे, यहोवा के वचन के अनुसार।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह इब्रानी मुहावरा शर्त नहीं, बल्कि शपथ-सदृश प्रबल निश्चय व्यक्त करता है।
- source_word: דְּמֵי
  choice: खून
  rationale: बहुवचन रूप हिंसक मृत्यु और बहाए गए रक्त का मुहावरा है; सहज हिन्दी में ‘खून’ उस अर्थ को बनाए रखता है।
- source_word: נָבוֹת
  choice: नाबोत
  rationale: व्यक्तिनाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: בָנָיו
  choice: उसके बेटों
  rationale: इब्रानी पाठ विशेष रूप से पुत्रों का उल्लेख करता है, इसलिए इसे सामान्य ‘बच्चों’ के रूप में नहीं किया गया।
- source_word: רָאִיתִי
  choice: मैंने ... देखा था
  rationale: पूर्ण क्रिया और ‘कल’ के साथ यह रूप पूर्वकालीन घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶמֶשׁ
  choice: कल
  rationale: यह पिछले दिन अथवा रात का संकेत दे सकता है; प्रसंग में ‘कल’ सबसे कम व्याख्यात्मक और स्वाभाविक विकल्प है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: यह भविष्यद्वाणी का गंभीर घोषणात्मक सूत्र है; हिन्दी में इसका भार और दोहराव सुरक्षित रखा गया है।
- source_word: וְשִׁלַּמְתִּי לְךָ
  choice: मैं तुझसे इसका बदला लूँगा
  rationale: पिएल रूप यहाँ न्यायिक प्रतिफल अथवा दंडात्मक प्रत्युत्तर का अर्थ देता है; ‘इसका’ बहाए गए खून की ओर संकेत स्पष्ट करता है।
- source_word: בַּחֶלְקָה הַזֹּאת
  choice: इसी भूखंड पर
  rationale: חֶלְקָה भूमि के किसी निश्चित हिस्से को दर्शाता है; ‘इसी’ प्रतिशोध के स्थान पर जोर बनाए रखता है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह ईश्वरीय घोषणा से उसके फलस्वरूप दिए गए आदेश की ओर संक्रमण दिखाता है।
- source_word: שָׂא
  choice: उसे उठाकर
  rationale: आज्ञार्थक क्रिया का मूल अर्थ उठाना या ले जाना है; अगली क्रिया के साथ संयुक्त हिन्दी संरचना स्वाभाविक है।
- source_word: הַשְׁלִכֵהוּ
  choice: फेंक दे
  rationale: यह वस्तु सहित हिफ़ील आज्ञार्थक रूप की सीधी और प्रबल अभिव्यक्ति है।
- source_word: כִּדְבַר יְהוָה
  choice: जैसा यहोवा ने कहा था
  rationale: शाब्दिक ‘यहोवा के वचन के अनुसार’ के आशय को प्रसंगानुकूल, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को नाम के रूप में रखा गया है, न कि पदवी ‘प्रभु’ से बदला गया।
- issue: नाबोत के वंशजों की विशिष्टता
  choice: उसके बेटों
  alternative: उसके बच्चों
  rationale: בָנָיו स्पष्ट रूप से पुत्रों को दर्शाता है; न्यायिक प्रसंग में मूल पाठ की यह विशिष्टता सुरक्षित रखी गई है।
- issue: प्रतिफल की न्यायिक प्रकृति
  choice: इसका बदला लूँगा
  alternative: तुझे प्रतिफल दूँगा
  rationale: שלם का पिएल यहाँ निष्पक्ष पुरस्कार नहीं, रक्तपात के लिए दंडात्मक प्रत्युत्तर बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। प्रत्यक्ष कथन में ‘तुझसे’ और ‘फेंक दे’ मूल के एकवचन आदेश को बनाए रखते हैं। भविष्यद्वाणी-सूत्र की दोनों आवृत्तियाँ जानबूझकर सुरक्षित रखी गई हैं।
