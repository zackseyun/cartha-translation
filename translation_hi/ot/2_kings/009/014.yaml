source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
translation:
  language: hi
  text: तब यहोशापात का पुत्र और निमशी का पोता येहू ने योराम के विरुद्ध षड्यंत्र रचा। योराम और समस्त इस्राएल अराम के राजा हजाएल के कारण रामोत-गिलाद में पहरा दे रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  choice: षड्यंत्र रचा
  rationale: हित्पएल रूप यहाँ राजद्रोही साज़िश में सम्मिलित होने या उसे रचने का भाव देता है; यह हिन्दी में स्वाभाविक और राजनीतिक विरोध के अर्थ में स्पष्ट है।
- source_word: יֵהוּא בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  choice: निमशी के पोते और यहोशापात के पुत्र येहू
  rationale: दोनों पीढ़ियों का वंश-संबंध सुरक्षित रखते हुए हिन्दी की स्वाभाविक वंशावली-शैली अपनाई गई है।
- source_word: אֶל יוֹרָם
  choice: योराम के विरुद्ध
  rationale: קשר के साथ אֶל षड्यंत्र के लक्ष्य को सूचित करता है; इसलिए दिशासूचक सामान्य अर्थ के बजाय विरोधसूचक अनुवाद उचित है।
- source_word: הָיָה שֹׁמֵר
  choice: रक्षा कर रहे थे
  rationale: पूर्ण क्रिया और कृदंत की रचना पृष्ठभूमि में जारी भूतकालीन कार्य बताती है। सैनिक प्रसंग में שמר का अर्थ पहरा देना अथवा रक्षा करना हो सकता है; यहाँ नगर की रक्षा करना सहज है।
- source_word: בְּרָמֹת גִּלְעָד
  choice: रामोत-गिलाद की
  rationale: स्थान-नाम का प्रचलित लिप्यंतरण रखा गया है; בְ को हिन्दी में रक्षा क्रिया के कर्म-संबंध द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: הוּא וְכָל יִשְׂרָאֵל
  choice: योराम और समस्त इस्राएल
  rationale: मूल का राष्ट्रीय पदनाम 'समस्त इस्राएल' बिना उसे केवल सेना तक सीमित किए सुरक्षित रखा गया है; सर्वनाम को स्पष्टता के लिए नाम से व्यक्त किया गया है।
- source_word: מִפְּנֵי
  choice: के कारण
  rationale: यहाँ यह हजाएल से उत्पन्न सैन्य खतरे को रक्षा का कारण बताता है।
- source_word: מֶלֶךְ אֲרָם
  choice: अराम का राजा
  rationale: मूल इब्रानी जातीय-भौगोलिक नाम अराम को रखा गया है, बाद के पारंपरिक नाम सीरिया को मुख्य पाठ में नहीं लाया गया।
