  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक ढंग अपनाया गया है। व्यक्तियों और स्थानों के नाम देवनागरी में लिप्यंतरित हैं। मूल की क्रमिक गति और रथ-संबंधी स्थान/दिशा की अस्पष्टता सुरक्षित रखी गई है। ‘तब उन्होंने ... मारा’ इब्रानी आदेश के बाद निहित क्रियान्वयन को हिन्दी में स्पष्ट करता है, जैसा प्रसंग और अहज्याह के बाद भी भागने से संकेत मिलता है।
