  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
translation:
  language: hi
  text: जब यहूदा के राजा अहज्याह ने यह देखा, तो वह बेत-हग्गान[a] के मार्ग से भागा। येहू ने उसका पीछा किया और कहा, “उसे भी रथ में मारो[b]—गूर की उस चढ़ाई पर जो यिबलाम के पास है!” फिर वह मगिद्दो भाग गया और वहीं मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बेत-हग्गान” का अर्थ “बगीचे का घर” हो सकता है, लेकिन यहाँ यह संभवतः किसी स्थान का नाम है।
    reason: cultural_note
  - marker: b
    text: या, “उसे भी रथ की ओर मारो।” इब्रानी पूर्वसर्ग यहाँ स्थान अथवा दिशा, दोनों में से किसी का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: यह देखा
  rationale: क्रिया का मूल अर्थ ‘देखा’ है; हिन्दी में संदर्भगत कर्म ‘यह’ जोड़ने से स्वाभाविक रूप से स्पष्ट होता है कि अहज्याह ने अभी घटी घटना देखी।
- source_word: דֶּרֶךְ בֵּית הַגָּן
  choice: बेत-हग्गान के मार्ग से
  rationale: דֶּרֶךְ मार्ग/रास्ता है और בֵּית הַגָּן यहाँ स्थान-नाम जान पड़ता है, इसलिए इसका अर्थानुवाद न करके लिप्यंतरण किया गया है।
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: उसका पीछा किया
  rationale: यह सहज आधुनिक हिन्दी में רדף और אַחַר के संयुक्त अर्थ को पूरा व्यक्त करता है।
- source_word: גַּם אֹתוֹ
  choice: उसे भी
  rationale: '‘भी’ גַּם के योगात्मक बल को सुरक्षित रखता है: अहज्याह को भी प्रहार का लक्ष्य बनाया जाना है।'
- source_word: הַכֻּהוּ
  choice: उसे ... मारो
  rationale: נכה का अर्थ प्रहार करना/मारना है। इस हिंसक आदेश में हिन्दी ‘मारो’ उपयुक्त है, पर इसे स्पष्ट रूप से ‘जान से मार डालो’ नहीं किया गया ताकि मूल से अधिक निश्चितता न जोड़ी जाए।
- source_word: אֶל הַמֶּרְכָּבָה
  choice: रथ में ही
  rationale: אֶל सामान्यतः ‘की ओर/तक’ है, पर यहाँ रथ हमले की स्थिति अथवा दिशा बताता है। मुख्य पाठ में प्रसंगानुकूल ‘रथ में’ रखा गया है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: בְּמַעֲלֵה גוּר
  choice: गूर की चढ़ाई पर
  rationale: מַעֲלֶה चढ़ाई या ऊपर जाने वाले मार्ग को दर्शाता है; यह अनुवाद स्थलाकृतिक संकेत को बनाए रखता है।
- source_word: אֲשֶׁר אֶת יִבְלְעָם
  choice: जो यिबलाम के पास है
  rationale: यह वाक्यांश गूर की चढ़ाई को यिबलाम के संबंध में स्थित करता है; ‘के पास’ हिन्दी में स्वाभाविक और पर्याप्त रूप से संयत है।
- source_word: וַיָּנָס מְגִדּוֹ
  choice: वह मगिद्दो भाग गया
  rationale: נוס पलायन दर्शाता है और स्थान-नाम यहाँ गंतव्य के रूप में स्वाभाविक रूप से समझा जाता है।
- source_word: וַיָּמָת שָׁם
  choice: वहीं मर गया
  rationale: ‘वहीं’ שָׁם के स्थानगत बल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
