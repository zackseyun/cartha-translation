  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
translation:
  language: hi
  text: तब येहू बाहर निकलकर अपने स्वामी के सेवकों के पास आया। उनमें से एक ने उससे पूछा, “सब कुशल तो है?[a] यह पागल[b] तुम्हारे पास क्यों आया था?” उसने उनसे कहा, “तुम उस आदमी को और उसकी बातें[c] जानते ही हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या शांति है?” अर्थात, “क्या सब ठीक है?”
    reason: lexical_alternative
  - marker: b
    text: या, “यह विक्षिप्त आदमी” अथवा “यह सनकी।” हिब्रू में यह तिरस्कारपूर्ण संबोधन है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसकी बोलचाल”; प्रसंग के अनुसार इसका अर्थ “उसकी बकवास” भी हो सकता है। हिब्रू शब्द किसी व्यक्ति की वाणी या बातचीत को व्यापक रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  choice: अपने स्वामी के सेवकों
  rationale: עֶבֶד यहाँ राजा के अधीन अधिकारियों अथवा सेवकों के लिए प्रयुक्त है। ‘सेवक’ बंधुआ दासता का अनावश्यक अर्थ जोड़े बिना संबंध व्यक्त करता है; ‘स्वामी’ मूल के אֲדֹנָיו को बनाए रखता है और स्पष्ट रूप से ‘राजा’ नहीं जोड़ता।
- source_word: הֲשָׁלוֹם
  choice: सब कुशल तो है?
  rationale: शाब्दिक प्रश्न ‘क्या शांति है?’ कुशल-क्षेम और परिस्थिति ठीक होने के विषय में पूछता है। ‘सब कुशल तो है?’ आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
- source_word: מַדּוּעַ בָּא
  choice: क्यों आया था
  rationale: संवाद में पूर्ण क्रिया हाल में घटे आगमन का कारण पूछती है; हिन्दी में ‘क्यों आया था’ उस पूर्व घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמְשֻׁגָּע הַזֶּה
  choice: यह पागल
  rationale: यह उन्मत्त या विक्षिप्त व्यक्ति के लिए तिरस्कारपूर्ण संबोधन है। ‘यह पागल’ अपमानजनक स्वर को नरम किए बिना सहज हिन्दी देता है।
- source_word: וַיֹּאמֶר לוֹ
  choice: उनमें से एक ने उससे पूछा
  rationale: बहुवचन ‘सेवकों’ के बाद हिब्रू क्रिया एकवचन है। ‘उनमें से एक’ समूह की ओर से बोलने वाले एक व्यक्ति को स्पष्ट करता है; प्रश्न होने के कारण हिन्दी में ‘पूछा’ स्वाभाविक है।
- source_word: אַתֶּם יְדַעְתֶּם אֶת הָאִישׁ
  choice: तुम उस आदमी को ... जानते ही हो
  rationale: उत्तर टालने वाला और कुछ हद तक उपेक्षापूर्ण है। ‘जानते ही हो’ उस निहित भाव को स्वाभाविक हिन्दी में व्यक्त करता है कि सुनने वाले उस व्यक्ति के स्वभाव से परिचित हैं।
- source_word: שִׂיחוֹ
  choice: उसकी बातें
  rationale: שִׂיחַ वाणी, बातचीत या कथन को व्यापक रूप से सूचित कर सकता है। ‘बातें’ जानबूझकर व्यापक है और इसे निश्चित रूप से ‘संदेश’ या केवल ‘बकवास’ नहीं बनाता।
