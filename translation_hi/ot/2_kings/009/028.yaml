translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘ले गए’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया की ठोस छवि बचाती है। ‘पुरखाओं के साथ’ वंशगत इब्रानी मुहावरे को बिना अनावश्यक व्याख्या के बनाए रखता है।
