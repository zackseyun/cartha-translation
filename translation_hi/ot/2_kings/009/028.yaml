  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
translation:
  language: hi
  text: उसके सेवक उसे यरूशलेम ले गए[a] और उसे दाऊद के नगर में, उसके पुरखाओं के साथ, उसकी कब्र में दफनाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे यरूशलेम पहुँचाया”; इब्रानी क्रिया का शाब्दिक अर्थ “उसे सवारी कराई” या “उसे ढोकर ले गए” है।
    reason: lexical_alternative
  - marker: b
    text: “उसके पुरखाओं के साथ” दफनाने से जुड़ा इब्रानी मुहावरा है; यहाँ आशय उसके राजवंशीय पूर्वजों के बीच दफनाए जाने से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  choice: ले गए
  rationale: हिफ़इल रूप का शाब्दिक अर्थ ‘सवारी कराई’ या ‘ढोकर पहुँचाया’ हो सकता है। मृत अहज्याह के शरीर को यरूशलेम पहुँचाने के संदर्भ में ‘ले गए’ स्वाभाविक है और उसके जीवित होकर सवारी करने का भ्रम नहीं पैदा करता।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: עבד का सीधा अर्थ ‘सेवक’ है और राजकीय सेवकों या अधिकारियों को भी सूचित कर सकता है; यहाँ ‘सेवक’ स्पष्ट और स्वाभाविक है।
- source_word: יְרוּשָׁלָמָה
  choice: यरूशलेम
  rationale: दिशासूचक प्रत्यय यरूशलेम की ओर गति बताता है; हिन्दी में ‘यरूशलेम ले गए’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: और उसे ... दफना दिया
  rationale: यह क्रमिक क्रिया और कर्म का सीधा, प्रवाहपूर्ण हिन्दी रूप है; कर्ता वही सेवक हैं।
- source_word: בִקְבֻרָתוֹ
  choice: उसकी कब्र में
  rationale: קְבֻרָה यहाँ दफनाने के स्थान को दर्शाता है। ‘कब्र’ राजकीय दफन-स्थल के लिए सरल और प्रचलित हिन्दी है।
- source_word: עִם אֲבֹתָיו
  choice: उसके पुरखाओं के साथ
  rationale: ‘पुरखाओं’ से पैतृक और वंशगत अर्थ बना रहता है तथा आधुनिक हिन्दी में ‘पितरों’ या शाब्दिक ‘पिताओं’ से अधिक सहज है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊदपुर में
  rationale: עִיר דָּוִד स्थान-नाम ‘दाऊद का नगर’ है; हिन्दी बाइबलीय प्रयोग में संक्षिप्त ‘दाऊदपुर’ स्वाभाविक स्थान-नाम के रूप में कार्य करता है।
