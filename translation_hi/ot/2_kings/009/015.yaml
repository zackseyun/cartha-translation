  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram. Jehu said, “If this is your wish, let no one escape from the city to go and report it in Jezreel.”
translation:
  language: hi
  text: राजा यहोराम उन घावों से स्वस्थ होने के लिए यिज्रेल लौट आया था, जो अरामियों ने उसे तब पहुँचाए थे जब वह अराम के राजा हजाएल से लड़ रहा था। येहू ने कहा, “यदि तुम सबकी यही इच्छा है, तो किसी को नगर से बच निकलकर यिज्रेल में इसकी खबर देने मत जाने देना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया था
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है। हिंदी में ‘लौट आया था’ उस पूर्ववर्ती परिस्थिति को स्वाभाविक रूप से व्यक्त करता है जिसके बाद येहू का कथन आता है।
- source_word: לְהִתְרַפֵּא
  choice: स्वस्थ होने के लिए
  rationale: रפא का हित्पएल रूप यहाँ युद्ध के घावों से आरोग्य पाने या स्वस्थ होने का भाव देता है; यह अनुवाद स्वयं को चंगा करने का भ्रामक संकेत नहीं देता।
- source_word: מִן הַמַּכִּים
  choice: उन घावों से
  rationale: शब्द का मूल भाव प्रहार या चोट है, पर इस प्रसंग में वे युद्ध के ऐसे घाव हैं जिनसे यहोराम स्वस्थ हो रहा था।
- source_word: יַכֻּהוּ אֲרַמִּים
  choice: जो अरामियों ने उसे ... पहुँचाए थे
  rationale: נכה का अर्थ प्रहार करना है; ‘घाव पहुँचाए’ आधुनिक हिंदी में कारण और परिणाम दोनों को स्वाभाविक ढंग से व्यक्त करता है। ‘अरामी’ ऐतिहासिक जातिनाम को सुरक्षित रखता है।
- source_word: בְּהִלָּחֲמוֹ אֶת חֲזָאֵל
  choice: जब वह ... हजाएल से लड़ रहा था
  rationale: בְּ के साथ क्रियार्थक संज्ञा लड़ाई की समकालीन परिस्थिति बताती है; ‘से लड़ रहा था’ विरोधी पक्ष का संबंध स्पष्ट और स्वाभाविक रखता है।
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  choice: यदि तुम सबकी यही इच्छा है
  rationale: यह सामूहिक इच्छा या सहमति व्यक्त करने वाला मुहावरा है। बहुवचन प्रत्यय को ‘तुम सबकी’ से स्पष्ट किया गया है।
- source_word: אַל יֵצֵא פָלִיט מִן הָעִיר
  choice: किसी को नगर से बच निकलकर ... मत जाने देना
  rationale: פָלִיט यहाँ किसी निश्चित वर्ग के ‘भगोड़े’ के बजाय उस व्यक्ति को सूचित करता है जो निकल भागने में सफल हो; निषेध को स्वाभाविक हिंदी आदेश के रूप में रखा गया है।
- source_word: לָלֶכֶת לְהַגִּיד בְּיִזְרְעֶאל
  choice: यिज्रेल में इसकी खबर देने मत जाने देना
  rationale: दोनों क्रियार्थक रूप निकलने वाले व्यक्ति के जाने और समाचार पहुँचाने का उद्देश्य बताते हैं; בְּיִזְרְעֶאל को स्थानवाचक ‘यिज्रेल में’ से व्यक्त किया गया है।
