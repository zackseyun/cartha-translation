  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती वाक्य से जुड़ी सामग्री-सूची है, इसलिए आरंभिक ‘और’ तथा प्रयोजनसूचक संरचना बनाए रखी गई है। ‘मरम्मत’ को दोहराकर इब्रानी में חזק की पुनरावृत्ति का कार्यात्मक संबंध सुरक्षित रखा गया है।
