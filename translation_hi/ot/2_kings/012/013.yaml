base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
translation:
  language: hi
  text: और राजमिस्त्रियों[a] और पत्थर तराशनेवालों के लिए, तथा लकड़ी और खदान से निकाले हुए पत्थर[b] खरीदने के लिए, यहोवा के भवन की टूट-फूट की मरम्मत करने के लिए[c], और भवन की मरम्मत के लिए होनेवाले हर खर्च के लिए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दीवार बनानेवाले’ अथवा ‘निर्माण करनेवाले।’ इब्रानी शब्द दीवार की चिनाई या मरम्मत करनेवालों के लिए व्यापक अर्थ में भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तराशे हुए पत्थर’ अथवा ‘कटे हुए पत्थर।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप में, ‘यहोवा के भवन की दरार/क्षति को सुदृढ़ करने के लिए।’ इसका आशय उसकी टूट-फूट की मरम्मत करना है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप में, ‘और उस सबके लिए जो भवन पर निकलता है,’ अर्थात उसकी मरम्मत में होनेवाले सभी खर्चों के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  choice: राजमिस्त्री
  rationale: धातु גדר से बना यह रूप दीवार बनाने या उसकी मरम्मत करनेवाले कारीगरों को सूचित करता है। निर्माण-संदर्भ में ‘राजमिस्त्री’ स्वाभाविक और विशिष्ट है; व्यापक अर्थ ‘निर्माण करनेवाले’ पादटिप्पणी में रखा गया है।
- source_word: חֹצְבֵי הָאֶבֶן
  choice: पत्थर तराशनेवाले
  rationale: यह पद पत्थर काटने या तराशनेवाले कारीगरों के लिए है। ‘पत्थर तराशनेवाले’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לִקְנוֹת עֵצִים
  choice: लकड़ी खरीदने के लिए
  rationale: निर्माण के संदर्भ से עֵצִים भवन में काम आनेवाली लकड़ी है। हिन्दी में ‘लकड़ी’ सहज है और संदर्भ उसके उपयोग को स्पष्ट करता है।
- source_word: אַבְנֵי מַחְצֵב
  choice: खदान से निकाले हुए पत्थर
  rationale: מַחְצֵב खदान या उत्खनन से संबंध रखता है। यह अनुवाद स्रोत-अर्थ स्पष्ट करता है; ‘तराशे हुए पत्थर’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में है।
- source_word: לְחַזֵּק אֶת בֶּדֶק
  choice: टूट-फूट की मरम्मत की जाए
  rationale: शाब्दिक संरचना ‘दरार/क्षति को मजबूत करना’ हिन्दी में अस्वाभाविक है। संदर्भगत आशय भवन की क्षति सुधारना है, इसलिए क्रियात्मक अर्थ ‘मरम्मत’ चुना गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया।
- source_word: בֶּדֶק
  choice: टूट-फूट
  rationale: यह शब्द दरार, टूट या ऐसी क्षति को सूचित करता है जिसे सुधारना हो। ‘टूट-फूट’ साधारण आधुनिक हिन्दी में व्यापक संरचनात्मक क्षति व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल ‘घर’ की उपमा को बनाए रखता है और संदर्भ में मंदिर को सूचित करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, शीर्षक से उसे प्रतिस्थापित नहीं किया गया।
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  choice: भवन के लिए होनेवाला हर खर्च
  rationale: ‘जो कुछ भवन पर निकलता है’ व्यय का इब्रानी मुहावरा है। ‘हर खर्च’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: לְחָזְקָה
  choice: उसकी मरम्मत के लिए
  rationale: חזק का मूल भाव मजबूत करना है, पर यहाँ खर्च का उद्देश्य भवन को दुरुस्त करना है। ‘मरम्मत’ संदर्भगत आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत नाम को ‘प्रभु’ जैसे पद से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जानेवाले लिप्यंतरण ‘यहोवा’ से दिया गया है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: בֵּית יְהוָה में ‘भवन’ या ‘मंदिर’
  choice: यहोवा का भवन
  alternative: यहोवा का मंदिर
  rationale: ‘भवन’ मूल इब्रानी ‘घर’ के निकट रहते हुए संदर्भ में मंदिर को समझने देता है और अनावश्यक व्याख्यात्मक प्रतिस्थापन से बचता है।
