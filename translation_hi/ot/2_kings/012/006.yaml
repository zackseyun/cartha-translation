source:
  edition: WLC
  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
translation:
  language: hi
  text: याजक अपने-अपने दानदाता[a] से धन लें, और वे ही भवन[b] में जहाँ कहीं कोई खराबी मिले, उसकी मरम्मत करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने-अपने परिचित से।” इब्रानी शब्द अधिक शाब्दिक रूप से किसी परिचित या व्यवहार-संबंध रखने वाले व्यक्ति को बता सकता है; धन-संग्रह के इस प्रसंग में आशय संभवतः उस व्यक्ति से है जिससे प्रत्येक याजक दान पाता था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से आशय मंदिर है।
    reason: cultural_note
lexical_decisions:
- source_word: יִקְחוּ לָהֶם
  choice: धन लें
  rationale: निर्देशात्मक अपूर्ण क्रिया को हिंदी में स्वाभाविक आज्ञार्थक ‘लें’ से व्यक्त किया गया है। मूल पद में वस्तु प्रसंग से समझी जाती है; पिछले संदर्भ में वह धन है, इसलिए हिंदी में स्पष्टता के लिए ‘धन’ जोड़ा गया है।
- source_word: הַכֹּהֲנִים אִישׁ
  choice: याजक अपने-अपने
  rationale: אִישׁ का यहाँ वितरणात्मक अर्थ है—हर याजक अलग-अलग। ‘अपने-अपने’ आधुनिक हिंदी में इस भाव को सहजता से व्यक्त करता है।
- source_word: מֵאֵת מַכָּרוֹ
  choice: अपने-अपने दानदाता से
  rationale: מַכָּר मूलतः परिचित या व्यवहार-संबंध रखने वाले व्यक्ति को बता सकता है। धन-संग्रह के इस प्रसंग में ‘दानदाता’ संभावित कार्यगत अर्थ को स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְהֵם יְחַזְּקוּ
  choice: और वे ही ... मरम्मत करें
  rationale: स्वतंत्र सर्वनाम וְהֵם से याजकों पर बल पड़ता है; ‘वे ही’ उस बल को बनाए रखता है। भवन के संदर्भ में חזק का अर्थ मजबूत करने के बजाय व्यावहारिक रूप से ‘मरम्मत करना’ है।
- source_word: בֶּדֶק הַבַּיִת
  choice: भवन की टूट-फूट
  rationale: בֶּדֶק भवन में आई दरार, क्षति या खराबी को दर्शाता है। ‘टूट-फूट’ सामान्य पाठक के लिए स्वाभाविक है और मरम्मत की आवश्यकता का भाव देता है।
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  choice: जहाँ कहीं उसमें टूट-फूट मिले
  rationale: 'यह अनिश्चित और व्यापक दायरा बनाए रखता है: भवन में क्षति जिस किसी स्थान पर पाई जाए, उसकी मरम्मत हो।'
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दानदाता’ और ‘भवन’ के साथ पादटिप्पणियाँ मूल इब्रानी की शब्दगत व्यापकता और सांस्कृतिक संदर्भ को सुरक्षित रखती हैं।
