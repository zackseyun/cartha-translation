  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: hi
  text: जब भी वे देखते कि सन्दूक में बहुत चाँदी है, तब राजा का लेखक और महायाजक चढ़ आते और यहोवा के भवन में मिली चाँदी को बाँधते और गिनते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹפֵר הַמֶּלֶךְ
  choice: राजा का सचिव
  rationale: סֹפֵר यहाँ राजकीय लेखा-जोखा रखने वाले अधिकारी को सूचित करता है; आधुनिक हिन्दी में ‘सचिव’ सहज और पदानुकूल है।
- source_word: וַיָּצֻרוּ
  choice: थैलियों में बाँधकर
  rationale: क्रिया का अर्थ चाँदी को बाँधना या पोटलियों/थैलियों में बाँधना है; प्रसंगानुसार निहित वस्तु को स्पष्ट किया गया है, पर तौलने का अर्थ नहीं जोड़ा गया।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: व्यक्तिवाचक दिव्य नाम יהוה को ‘यहोवा’ और मंदिर के लिए בֵּית को गरिमापूर्ण, परिचित ‘भवन’ से व्यक्त किया गया है।
- source_word: וַיִּמְנוּ
  choice: गिनते थे
  rationale: मूल क्रिया מנה का सीधा अर्थ ‘गिनना’ है; इसे ‘तौलना’ नहीं किया गया।
theological_decisions:
- issue: महायाजक की पदवी
  choice: महायाजक
  alternative: प्रधान याजक
  rationale: הַכֹּהֵן הַגָּדוֹל का शाब्दिक भाव ‘महान/बड़ा याजक’ है; ‘महायाजक’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और संप्रदाय-निरपेक्ष है।
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में उपस्थित व्यक्तिगत नाम को सामान्य पदवी में बदलने के बजाय नाम के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। आरम्भिक आवृत्तिमूलक भाव को ‘जब भी’ और क्रमिक क्रियाओं को ‘आते…बाँधकर गिनते थे’ से व्यक्त किया गया है।
