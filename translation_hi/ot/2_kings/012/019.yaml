source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
translation:
  language: hi
  text: तब यहूदा के राजा यहोआश ने वे सारी पवित्र वस्तुएँ लीं जिन्हें उसके पुरखों[a]—यहूदा के राजाओं यहोशापात, यहोराम और अहज्याह—ने समर्पित किया था, साथ ही अपनी पवित्र वस्तुएँ और वह सारा सोना भी जो यहवे के भवन और राजा के महल के भंडारों में मिला था। उसने यह सब अराम के राजा हजाएल के पास भेज दिया; तब हजाएल यरूशलेम से हट गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पुरखों” से आशय यहोआश के राजकीय पूर्वजों से है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वह यरूशलेम के ऊपर से ऊपर चला गया।” इस गति-वाचक पदबंध का प्रसंगगत आशय है कि हजाएल यरूशलेम के विरुद्ध अपनी चढ़ाई से हट गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ने ... लीं
  rationale: לקח का सीधा अर्थ ‘लेना’ है; यहाँ न तो बलपूर्वक छीनने का भाव आवश्यक है, न ‘इकट्ठा करने’ की व्याख्या।
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  choice: पवित्र वस्तुएँ / अपनी समर्पित पवित्र वस्तुएँ
  rationale: קדש से बने दोनों पद पवित्र उपयोग के लिए अलग की गई वस्तुओं को बताते हैं। दूसरी अभिव्यक्ति में प्रत्यय यहोआश द्वारा समर्पित वस्तुओं का संकेत देता है।
- source_word: הִקְדִּישׁוּ
  choice: समर्पित किया था
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को पवित्र उपयोग के लिए समर्पित करना है; हिन्दी में यह सहज और प्रसंगानुकूल है।
- source_word: אֲבֹתָיו
  choice: उसके पुरखों
  rationale: राजवंशीय प्रसंग में ‘पिता’ का आशय पूर्वजों या राजकीय पुरखों से है; ‘पुरखे’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: בְּאֹצְרוֹת
  choice: भंडारों में
  rationale: אוצרות मूल्यवान वस्तुओं को रखने वाले भंडार अथवा कोष-कक्ष हैं; ‘भंडार’ मंदिर और राजभवन दोनों के साथ स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: यहवे का भवन
  rationale: בית का औपचारिक रूप ‘भवन’ रखा गया है और יהוה को व्यक्तिगत नाम ‘यहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: शाब्दिक ‘राजा का भवन’ यहाँ राजकीय महल को सूचित करता है; ‘राजभवन’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וַיִּשְׁלַח לַחֲזָאֵל
  choice: उसने यह सब ... हजाएल के पास भेज दिया
  rationale: पूर्ववर्ती अनेक वस्तुओं को हिन्दी में सामूहिक ‘यह सब’ से स्पष्ट रूप से समेटा गया है।
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  choice: तब हजाएल यरूशलेम पर से हट गया
  rationale: עלה מעל का प्रसंगगत अर्थ नगर के विरुद्ध चढ़ाई छोड़कर हट जाना है। कर्ता को ‘हजाएल’ कहकर स्पष्ट किया गया, जबकि कारणात्मक ‘इसलिए’ जोड़ने के बजाय क्रमसूचक ‘तब’ रखा गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘यहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וַיַּעַל מֵעַל יְרוּשָׁלִָם में कर्ता और क्रिया का आशय
  choice: हजाएल यरूशलेम पर से हट गया
  alternative: वह यरूशलेम से ऊपर चला गया
  rationale: निकटतम पुरुषवाचक कर्ता हजाएल है और प्रसंग नगर के विरुद्ध उसकी चढ़ाई रुकने का है। फिर भी पाठ में कारण स्पष्ट नहीं कहा गया, इसलिए केवल क्रमसूचक ‘तब’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक गद्य अपनाया गया है। राजाओं के नाम प्रचलित हिन्दी बाइबिलीय रूपों के निकट रखे गए हैं। लंबे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है; अर्थ-संबंध और सूची सुरक्षित हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
