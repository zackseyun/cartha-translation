id: 2KI.12.15
reference: 2 Kings 12:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי לְ/עֹשֵׂ֥י הַ/מְּלָאכָ֖ה יִתְּנֻ֑/הוּ וְ/חִזְּקוּ ב֖/וֹ אֶת בֵּ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/015.yaml
  text: for they gave it to those doing the work[a], and with it they repaired the house of Yahweh.
translation:
  language: hi
  text: क्योंकि वे उसे काम करनेवालों को दे देते थे, और उससे वे याहवे के भवन[a] की मरम्मत करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात याहवे का मंदिर।
    reason: ‘याहवे का भवन’ इब्रानी मुहावरा है और इस प्रसंग में मंदिर को दर्शाता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है कि उनसे हिसाब क्यों नहीं लिया जाता था।
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवालों को
  rationale: इब्रानी के शाब्दिक भाव ‘काम करनेवाले’ को स्वाभाविक और अनावश्यक रूप से लिंग-विशिष्ट हुए बिना व्यक्त करता है।
- source_word: יִתְּנֻהוּ
  choice: वे उसे ... दे देते थे
  rationale: अपूर्ण क्रिया यहाँ बीते समय की प्रचलित या बार-बार होनेवाली कार्रवाई बताती है; ‘दे देते थे’ इस पक्ष को स्पष्ट करता है। ‘उसे’ पिछले प्रसंग में उल्लिखित धन की ओर संकेत करता है।
- source_word: וְחִזְּקוּ
  choice: मरम्मत करते थे
  rationale: मूल अर्थ ‘मज़बूत करना’ है, पर भवन के संदर्भ में इसका स्वाभाविक अर्थ उसे दुरुस्त या संरचनात्मक रूप से फिर मज़बूत करना है।
- source_word: בּוֹ
  choice: उससे
  rationale: यह संक्षिप्त रूप से पिछले प्रसंग में बताए धन को मरम्मत के साधन के रूप में सूचित करता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ इब्रानी בַּיִת की उपमा को बनाए रखता है, जबकि संदर्भ में इससे मंदिर अभिप्रेत है; יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וְחִזְּקוּ का कर्ता
  choice: ‘वे’ को अस्पष्ट रहने दिया गया
  alternative: स्पष्ट रूप से ‘काम करनेवाले’ या धन देनेवाले अधिकारी
  rationale: इब्रानी बहुवचन कर्ता को दोहराकर स्पष्ट नहीं करता; हिंदी में ‘वे’ मूल की संभावित संदर्भगत अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दे देते थे’ और ‘मरम्मत करते थे’ बीते समय की नियमित प्रक्रिया को व्यक्त करते हैं; ‘याहवे का भवन’ मूल मुहावरे को सुरक्षित रखता है और पादटिप्पणी उसका संदर्भ स्पष्ट करती है।
