  text: וְ/נָתְנוּ֙ אֶת הַ/כֶּ֣סֶף הַֽ/מְתֻכָּ֔ן עַל יד עֹשֵׂ֣י הַ/מְּלָאכָ֔ה ה/פקדים בֵּ֣ית יְהוָ֑ה וַ/יּוֹצִיאֻ֜/הוּ לְ/חָרָשֵׁ֤י הָ/עֵץ֙ וְ/לַ/בֹּנִ֔ים הָ/עֹשִׂ֖ים בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
translation:
  language: hi
  text: और उन्होंने तौली हुई चाँदी[a] उन काम करने वालों के हाथ में[b] सौंप दी, जो याहवे के भवन की देखरेख के लिए नियुक्त थे; और उन्होंने उसे उन बढ़इयों और निर्माण करने वालों को दे दिया, जो याहवे के भवन पर काम कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘नापी हुई चाँदी’ अथवा ‘गिना हुआ धन’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘के हाथ में’। अर्थात उनके अधिकार या देखरेख में सौंपना।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  choice: तौली हुई चाँदी
  rationale: מְתֻכָּן यहाँ मात्रा निर्धारित किए हुए धन को दर्शाता है। मन्दिर के काम के लिए भुगतान के संदर्भ में ‘तौली हुई चाँदी’ ठोस और ऐतिहासिक रूप से स्वाभाविक है, जबकि दूसरी सम्भावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: עַל יַד
  choice: के हाथ में सौंप दी
  rationale: इब्रानी मुहावरे के ‘हाथ’ वाले बिम्ब को बनाए रखते हुए ‘सौंप दी’ उसके आशय—किसी के अधिकार या देखरेख में देना—को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवाले
  rationale: यह पद कार्य में लगे लोगों के लिए व्यापक अभिव्यक्ति है; ‘काम करनेवाले’ किसी अधिक विशिष्ट पेशे को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  choice: जो यहोवा के भवन पर नियुक्त थे
  rationale: निष्क्रिय कृदन्त नियुक्त या अधिकृत किए गए व्यक्तियों को सूचित करता है। ‘भवन पर नियुक्त’ उनके पर्यवेक्षकीय दायित्व को संक्षेप में व्यक्त करता है।
- source_word: וַיּוֹצִיאֻהוּ
  choice: उन्होंने उसे ... दे दिया
  rationale: क्रिया का मूल अर्थ ‘बाहर निकालना’ है, पर धन-संबंधी संदर्भ में यह राशि वितरित करने को दर्शाती है। ‘दे दिया’ सरल आधुनिक हिन्दी में वही व्यावहारिक अर्थ देता है।
- source_word: לְחָרָשֵׁי הָעֵץ
  choice: बढ़इयों
  rationale: शाब्दिक अर्थ ‘लकड़ी के कारीगर’ है; निर्माण-संदर्भ में ‘बढ़ई’ इसका स्वाभाविक और सटीक हिन्दी पर्याय है।
- source_word: וְלַבֹּנִים
  choice: निर्माण करनेवालों
  rationale: בֹּנִים का अर्थ व्यापक रूप से निर्माण करनेवाले है। इसे ‘राजमिस्त्री’ कहना मूल से अधिक संकीर्ण होगा।
- source_word: הָעֹשִׂים בֵּית יְהוָה
  choice: जो यहोवा के भवन में काम कर रहे थे
  rationale: वाक्यांश भवन से संबंधित सक्रिय श्रम दर्शाता है। ‘भवन में काम कर रहे थे’ स्वाभाविक है और मूल में स्पष्ट न किए गए ‘मरम्मत’ के अर्थ को मुख्य पाठ में नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले इब्रानी ईश्वरीय नाम को हिन्दी बाइबल-पाठकों में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता; ‘याहवे’ अधिक निकट लिप्यन्तरण माना जाता है, पर उच्चारण पूर्णतः निश्चित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य रखा गया है। ‘चाँदी’ प्राचीन मुद्रा-सामग्री को बनाए रखता है; ‘रुपया’ से बचा गया है। मुख्य पाठ में इब्रानी मुहावरे का बिम्ब आंशिक रूप से सुरक्षित रखते हुए अर्थ स्पष्ट किया गया है।
