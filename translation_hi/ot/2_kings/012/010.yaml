base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
translation:
  language: hi
  text: तब याजक यहोयादा ने एक संदूक लिया, उसके ढक्कन[a] में एक छेद किया, और उसे वेदी के पास रखा—जब कोई व्यक्ति यहोवा के भवन में प्रवेश करता था, तब उसकी दाहिनी ओर। देहरी की रखवाली करने वाले याजक यहोवा के भवन में लाई गई सारी चाँदी[b] उसमें डालते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके दरवाज़े में”; यहाँ सम्भवतः संदूक का ढक्कन या आवरण अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या “सारा धन”; इब्रानी शब्द का अर्थ ‘चाँदी’ और विस्तार से ‘धन’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  choice: संदूक
  rationale: मंदिर के चंदे को रखने वाला पात्र अभिप्रेत है; ‘संदूक’ आधुनिक हिन्दी में स्वाभाविक है और वाचा के सन्दूक का अनावश्यक संकेत नहीं देता।
- source_word: וַיִּקֹּב חֹר
  choice: एक छेद किया
  rationale: נקב और חור का संयोग किसी वस्तु में छेद बनाने की क्रिया बताता है; हिन्दी में यह स्पष्ट और सहज है।
- source_word: בְּדַלְתּוֹ
  choice: उसके ढक्कन में
  rationale: शाब्दिक अर्थ ‘उसके द्वार में’ है, पर संदूक के प्रसंग में उसका चलायमान आवरण या ढक्कन अभिप्रेत होने की अधिक सम्भावना है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֵצֶל הַמִּזְבֵּחַ
  choice: वेदी के पास
  rationale: אצל निकटता दर्शाता है; ‘के पास’ स्थान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בימין בְּבוֹא אִישׁ
  choice: प्रवेश करने वाले पुरुष के दाहिनी ओर
  rationale: यह प्रवेश करने वाले व्यक्ति के दृष्टिकोण से संदूक की स्थिति बताता है और אִישׁ के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: שֹׁמְרֵי הַסַּף
  choice: द्वार की रखवाली करने वाले
  rationale: शाब्दिक भाव ‘देहरी के रखवाले’ है; यहाँ मंदिर के प्रवेश-द्वार की रखवाली करने वाले याजकों की भूमिका अभिप्रेत है।
- source_word: כָּל הַכֶּסֶף
  choice: सारी चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, यद्यपि इसका अर्थ धन भी हो सकता है; ठोस माध्यम को मुख्य पाठ में रखा और विकल्प को पादटिप्पणी में दिया गया है।
- source_word: הַמּוּבָא בֵית יְהוָה
  choice: यहोवा के भवन में लाई गई
  rationale: होफल कृदन्त निष्क्रिय अर्थ ‘लाई जा रही/लाई गई’ देता है; हिन्दी में पूर्ण सम्बन्धवाचक वाक्यांश सहज है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है और मंदिर के सन्दर्भ में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम का स्थापित प्रतिलेखन प्रयोग किया गया है, न कि उसे उपाधि से बदला गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम प्रत्यक्ष है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- issue: दिशा बताने वाले वाक्यांश में אִישׁ
  choice: प्रवेश करने वाले पुरुष के दाहिनी ओर
  alternative: प्रवेश करते समय दाहिनी ओर
  rationale: मुख्य पाठ मूल के पुल्लिंग एकवचन को बनाए रखता है, जबकि उसका कार्य प्रवेशकर्ता के दृष्टिकोण से दिशा बताना है; इसे किसी विशेष पुरुष तक सीमित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वेदी’, ‘याजक’ और ‘यहोवा का भवन’ जैसे परिचित बाइबलीय पद बनाए गए हैं। प्रथम वाक्य में मूल की स्थान-सूचना और दूसरे में याजकों की नियमित क्रिया को स्वाभाविक हिन्दी क्रम में रखा गया है।
