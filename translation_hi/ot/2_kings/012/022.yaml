base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
translation:
  language: hi
  text: शिमात का पुत्र योजाबाद और शोमेर का पुत्र यहोजाबाद—जो उसके सेवक[a] थे—उन्होंने उसे मार गिराया, और वह मर गया। उन्होंने उसे दाऊद के नगर में उसके पुरखों के साथ दफ़नाया। तब उसका पुत्र अमस्याह उसके स्थान पर राजा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके अधिकारी”; इब्रानी शब्द का अर्थ प्रसंग के अनुसार सेवक, राजकीय परिचारक या अधिकारी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיוֹזָבָד בֶּן שִׁמְעָת
  choice: शिमात का पुत्र योजाबाद
  rationale: नामों का स्रोतानुसार देवनागरी लिप्यंतरण किया गया है; हिन्दी में वंशसूचक संबंध के लिए ‘का पुत्र’ स्वाभाविक है।
- source_word: וִיהוֹזָבָד בֶּן שֹׁמֵר
  choice: और शोमेर का पुत्र यहोजाबाद
  rationale: दोनों व्यक्तियों का समन्वय बनाए रखते हुए नामों को स्रोत के निकट लिप्यंतरित किया गया है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: עֶבֶד का अर्थ सेवक, अधीनस्थ या राजकीय अधिकारी हो सकता है। मुख्य पाठ में व्यापक और सहज ‘सेवक’ रखा गया है तथा प्रसंगगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: הִכֻּהוּ
  choice: उसे मार गिराया
  rationale: נכה की प्रहार करने की शक्ति को व्यक्त करता है, पर अगले स्वतंत्र कथन ‘वह मर गया’ को अनावश्यक नहीं बनाता।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: हिब्रू की क्रमिक कथन-रचना और मृत्यु के स्पष्ट स्वतंत्र कथन को सुरक्षित रखा गया है।
- source_word: וַיִּקְבְּרוּ אֹתוֹ עִם אֲבֹתָיו
  choice: उन्होंने उसे उसके पुरखों के साथ दफ़नाया
  rationale: ‘पुरखों के साथ’ राजवंशीय दफ़न के हिब्रू मुहावरे को आधुनिक हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּעִיר דָּוִד
  choice: दाऊद के नगर में
  rationale: यह ऐतिहासिक स्थान-नाम का प्रचलित और स्पष्ट हिन्दी रूप है।
- source_word: וַיִּמְלֹךְ אֲמַצְיָה בְנוֹ תַּחְתָּיו
  choice: तब उसका पुत्र अमस्याह उसके स्थान पर राजा हुआ
  rationale: उत्तराधिकार-सूचना में מלך का आरंभसूचक भाव ‘राजा हुआ’ से स्वाभाविक हिन्दी में स्पष्ट होता है।
