base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
translation:
  language: hi
  text: तब उसके सेवक उठ खड़े हुए और उन्होंने षड्यंत्र रचा। उन्होंने बेथ-मिल्लो में, सिल्ला की ओर उतरते मार्ग पर, योआश पर प्रहार किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने बेथ-मिल्लो में योआश पर प्रहार किया, जो सिल्ला की ओर उतरता है।” हिब्रू वाक्यांश बेथ-मिल्लो या उसके निकट सिल्ला की ओर उतरते पहुँच-पथ/ढलान के संबंध को कुछ हद तक खुला छोड़ता है।
    reason: स्थान-संबंधी हिब्रू वाक्यांश की संरचना और सटीक स्थलाकृतिक अर्थ कुछ हद तक अस्पष्ट है।
lexical_decisions:
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय संदर्भ में यह राजा के अधीनस्थ सेवकों या दरबारियों को सूचित करता है। ‘सेवक’ मूल शब्द की व्यापकता बनाए रखता है और ‘अधिकारी’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  choice: उन्होंने षड्यंत्र रचा
  rationale: हिब्रू में क्रिया और उसी मूल की संज्ञा का प्रयोग षड्यंत्र करने के अर्थ में एक मुहावरा है। हिंदी में ‘षड्यंत्र रचा’ उसका स्वाभाविक और अर्थ-सटीक रूप है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה का मूल अर्थ प्रहार करना है; इस प्रसंग में प्रहार घातक है। ‘मार गिराया’ हिंसक कार्रवाई और उसके परिणाम दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בֵּית מִלֹּא
  choice: बेथ-मिल्लो
  rationale: इसे स्थान-नाम मानकर लिप्यंतरित किया गया है; ‘मिल्लो का घर’ अनुवाद करने से ज्ञात स्थान का संकेत अस्पष्ट हो सकता है।
- source_word: הַיּוֹרֵד סִלָּא
  choice: सिल्ला की ओर उतरने वाले मार्ग पर स्थित
  rationale: यह पद सिल्ला की ओर जाने वाले उतरते हुए रास्ते या ढलान से बेथ-मिल्लो का स्थान बताता है। हिंदी वाक्य में ‘स्थित’ जोड़ने से स्थानिक संबंध स्पष्ट और स्वाभाविक बनता है, जबकि मूल का स्थलाकृतिक भाव बना रहता है।
- source_word: סִלָּא
  choice: सिल्ला
  rationale: स्थान-नाम को मानक देवनागरी लिप्यंतरण में रखा गया है।
