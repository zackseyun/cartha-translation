source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
translation:
  language: hi
  text: यहोआश ने अपने जीवन के उन सभी दिनों में यहोवा की दृष्टि में जो सही था वही किया,[a] जिन दिनों याजक यहोयादा उसे शिक्षा देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “यहोआश ने अपने सभी दिनों में वही किया जो यहोवा की दृष्टि में सही था, जिन दिनों याजक यहोयादा उसे शिक्षा देता था।”
    reason: इब्रानी में संबंधवाचक उपवाक्य सीधे ‘उसके सभी दिनों’ के बाद आता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: करता रहा
  rationale: यहाँ क्रिया राजा के निरंतर आचरण का वर्णन करती है; अपूर्ण भूतकालीन भाव को स्वाभाविक हिन्दी में व्यक्त करने के लिए यह रूप चुना गया है।
- source_word: הַיָּשָׁר
  choice: वही ... जो ... सही था
  rationale: विशेषण यहाँ संज्ञा के समान प्रयुक्त है और नैतिक रूप से सही आचरण को सूचित करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इब्रानी के मूल्यांकन-संबंधी रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: כָּל יָמָיו
  choice: जीवन भर
  rationale: यह ‘उसके सब दिनों’ का स्वाभाविक और संक्षिप्त हिन्दी रूप है; आगे के संबंधवाचक उपवाक्य से जुड़ी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: मुख्य पाठ में संबंधवाचक कण को यहोयादा की शिक्षा और यहोआश के सही आचरण के बीच कारणात्मक संबंध के रूप में व्यक्त किया गया है; संभावित कालगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: הוֹרָהוּ
  choice: उसे शिक्षा देता था
  rationale: हिफ़ील रूप यहाँ सिखाने, निर्देश देने या मार्गदर्शन करने का अर्थ रखता है; यह चयन संबंध की निरंतर प्रकृति को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוֹיָדָע הַכֹּהֵן
  choice: याजक यहोयादा
  rationale: व्यक्तिनाम का हिन्दी लिप्यंतरण और पदवी का सामान्य हिन्दी रूप प्रयुक्त हुआ है।
theological_decisions:
- issue: यहोआश की धार्मिकता की अवधि और यहोयादा की शिक्षा के बीच संबंध
  choice: मुख्य पाठ में यहोयादा की शिक्षा को यहोआश के सही आचरण का कारण बताया गया है।
  alternative: 'इब्रानी वाक्य को कालगत सीमा के रूप में भी समझा जा सकता है: वह केवल उन दिनों में सही करता रहा जिनमें यहोयादा उसे शिक्षा देता था।'
  rationale: אֲשֶׁר का संबंध כָּל יָמָיו से है और वाक्यरचना कारणात्मक तथा कालगत दोनों समझ की गुंजाइश देती है। मुख्य पाठ स्वाभाविक कारणात्मक हिन्दी देता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘यहोवा की दृष्टि में’ जैसे बाइबलीय रूपक को समझने योग्य हिन्दी में बनाए रखा गया है; अस्पष्ट इब्रानी वाक्य-संबंध को पादटिप्पणी में स्पष्ट किया गया है।
