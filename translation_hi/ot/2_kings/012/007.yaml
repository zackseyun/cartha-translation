translation:
  language: hi
  text: राजा यहोआश के तेईसवें वर्ष में ऐसा हुआ कि याजकों ने भवन की टूट-फूट की मरम्मत नहीं की थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भवन की दरारों की मरम्मत।” यहाँ “भवन” से मंदिर का आशय है।
    reason: בֶּדֶק के अधिक शाब्दिक अर्थ ‘दरार/भंग’ का विकल्प सुरक्षित रखना और संदर्भ में ‘भवन’ की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי
  choice: में भी
  rationale: यह कथात्मक रूप वृत्तांत के अगले चरण को सामने लाता है। हिंदी में अलग से ‘और ऐसा हुआ’ कहना बोझिल होता; संदर्भगत परिणाम और उस समय तक बनी स्थिति को ‘में भी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה לַמֶּלֶךְ יְהוֹאָשׁ
  choice: राजा यहोआश के शासन के तेईसवें वर्ष में
  rationale: यह राजकीय वर्ष बताने का मानक सूत्र है। ‘शासन के तेईसवें वर्ष’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לֹא חִזְּקוּ
  choice: मरम्मत नहीं की थी
  rationale: חזק का मूल अर्थ ‘मज़बूत करना’ है, पर בדק הבית के साथ यह संरचनात्मक क्षति सुधारने का अर्थ देता है। भूतपूर्ण रूप उस समय तक कार्य पूरा न होने की स्थिति दिखाता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों ने
  rationale: पद और कर्ता-कारक दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בֶּדֶק הַבָּיִת
  choice: भवन की टूट-फूट
  rationale: בדק दरार, टूट या क्षतिग्रस्त दशा को सूचित करता है। ‘टूट-फूट’ मरम्मत की आवश्यकता वाली स्थिति को सामान्य हिंदी में व्यक्त करती है; ‘भवन’ मूल ‘घर/भवन’ को बनाए रखता है, जबकि संदर्भ में यह मंदिर है।
