base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: The rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: hi
  text: योआश के बाकी काम और उसने जो कुछ किया—क्या वे सब यहूदा के राजाओं के इतिहास की पुस्तक[a] में लिखे नहीं हैं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के राजाओं के राजकीय अभिलेखों की पुस्तक।” इब्रानी पदबंध किसी आधिकारिक राजकीय अभिलेख या इतिहास-वृत्त को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  choice: योआश के बाकी काम
  rationale: יֶתֶר का अर्थ बचा हुआ या शेष है, और राजकीय सारांश के इस सूत्र में דִּבְרֵי राजा के कार्यों अथवा वृत्तांत को सूचित करता है। ‘बाकी काम’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: और उसने जो कुछ किया
  rationale: यह अनुवाद כָל की व्यापकता और मूल सम्बन्धवाचक वाक्य-रचना दोनों को बनाए रखता है।
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: क्या वे सब ... लिखे नहीं हैं?
  rationale: הֲלוֹא ऐसा आलंकारिक प्रश्न आरम्भ करता है जिसका अपेक्षित उत्तर सकारात्मक है। ‘वे सब’ पहले बताए गए समस्त कार्यों को स्वाभाविक हिन्दी में समेटता है।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: शाब्दिक रूप से पूर्वसर्ग ‘पर’ है, पर लिखित अभिलेख के सन्दर्भ में हिन्दी मुहावरा ‘पुस्तक में लिखा’ स्वाभाविक समतुल्य है।
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं के इतिहास
  rationale: राजकीय स्रोत के इस शीर्षकीय प्रयोग में דִּבְרֵי הַיָּמִים इतिहास-वृत्त या राजकीय वार्षिक अभिलेखों को दर्शाता है; ‘इतिहास’ सामान्य पाठक के लिए स्पष्ट है, जबकि वैकल्पिक अभिलेखीय अर्थ पाद-टिप्पणी में सुरक्षित है।
