  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
translation:
  language: hi
  text: तब राजा यहोआश ने याजक यहोयादा और याजकों को बुलाकर उनसे कहा, “तुम भवन[a] की टूट-फूट की मरम्मत क्यों नहीं कर रहे हो? अब अपने परिचितों[b] से धन मत लेना, बल्कि वह धन भवन की मरम्मत के लिए दे दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भवन” से मंदिर अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: “परिचितों” के लिए प्रयुक्त इब्रानी शब्द का अर्थ इस प्रसंग में अनिश्चित है; इसका आशय “दानदाताओं” या “योगदान देनेवालों” से भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא यहाँ किसी को अपने पास बुलाने के अर्थ में है; संयुक्त क्रिया हिंदी कथा-प्रवाह में अगले कथन से स्वाभाविक रूप से जुड़ती है।
- source_word: הַמֶּלֶךְ יְהוֹאָשׁ
  choice: राजा यहोआश
  rationale: हिंदी में पदवी के बाद नाम रखना स्वाभाविक है और इब्रानी नाम का प्रचलित रूप सुरक्षित रहता है।
- source_word: לִיהוֹיָדָע הַכֹּהֵן וְלַכֹּהֲנִים
  choice: यहोयादा याजक और याजकों को
  rationale: इब्रानी पाठ यहोयादा को अलग नामित करके फिर याजकों का उल्लेख करता है; ‘अन्य’ जोड़े बिना दोनों घटक रखे गए हैं।
- source_word: אֵינְכֶם מְחַזְּקִים אֶת בֶּדֶק הַבָּיִת
  choice: तुम भवन की टूट-फूट की मरम्मत क्यों नहीं कर रहे हो
  rationale: חזק का मूल भाव मजबूत करना है, पर בדק הבית के साथ यह संरचनात्मक क्षति की मरम्मत को दर्शाता है। ‘टूट-फूट की मरम्मत’ आधुनिक हिंदी में स्पष्ट है।
- source_word: הַבָּיִת
  choice: भवन
  rationale: संदर्भ में यह यहोवा के मंदिर को सूचित करता है। ‘भवन’ मूल के ‘घर/भवन’ रूपक को बचाता है, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
- source_word: וְעַתָּה
  choice: अब से
  rationale: यह डाँट से आगे की नई प्रशासनिक व्यवस्था की ओर संक्रमण बताता है; प्रसंग में ‘अब से’ स्वाभाविक है।
- source_word: כֶסֶף
  choice: धन
  rationale: כֶסֶף का शाब्दिक अर्थ चाँदी भी हो सकता है, पर यहाँ मंदिर के लिए प्राप्त राशि अभिप्रेत है; ‘धन’ उपयुक्त व्यापक शब्द है।
- source_word: מֵאֵת מַכָּרֵיכֶם
  choice: अपने परिचितों से
  rationale: מַכָּר का सामान्य शाब्दिक अर्थ ‘परिचित व्यक्ति’ है। पद का संदर्भगत आशय विवादित होने के कारण मुख्य पाठ में निकटतर अर्थ और पादटिप्पणी में वैकल्पिक समझ दी गई है।
- source_word: כִּי לְבֶדֶק הַבַּיִת תִּתְּנֻהוּ
  choice: बल्कि उसे भवन की मरम्मत के लिए दे देना
  rationale: כִּי यहाँ पिछली मनाही के बाद सुधारात्मक निर्देश प्रस्तुत करता है, इसलिए ‘बल्कि’ उपयुक्त है। सर्वनाम धन की ओर संकेत करता है।
