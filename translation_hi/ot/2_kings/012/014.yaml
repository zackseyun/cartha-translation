  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
translation:
  language: hi
  text: परन्तु याहवे के भवन में लाए गए धन से याहवे के भवन के लिए चाँदी के बेसिन,[a] बत्तियाँ सँवारने के औज़ार,[b] छिड़काव के कटोरे,[c] तुरहियाँ, या सोने अथवा चाँदी का कोई भी पात्र नहीं बनाए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी के कटोरे।”
    reason: lexical_alternative
  - marker: b
    text: या “बत्ती काटने के औज़ार।” इब्रानी शब्द सम्भवतः दीपकों की बत्तियाँ सँवारने के किसी उपकरण को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या केवल “कटोरे।” विस्तृत अनुवाद इनके सम्भावित अनुष्ठानिक उपयोग को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु
  rationale: पिछले कथन के विपरीत स्थिति को सूचित करने वाला स्वाभाविक और गरिमापूर्ण संयोजक।
- source_word: יֵעָשֶׂה
  choice: नहीं बनाया गया
  rationale: निफ़अल रूप की कर्मवाच्य और निर्वैयक्तिक अभिव्यक्ति को बनाए रखता है; मिश्रित वस्तु-सूची के कारण हिन्दी में एकवचन क्रिया स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: मन्दिर के औपचारिक पदनाम को सुरक्षित रखता है और יְהוָה को व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
- source_word: סִפּוֹת כֶּסֶף
  choice: चाँदी के कटोरे
  rationale: סִפּוֹת पात्रों या कटोरों को सूचित करता है; यह चयन बाद के מִזְרָקוֹת से पर्याप्त भेद भी रखता है।
- source_word: מְזַמְּרוֹת
  choice: बत्तियाँ सँवारने के औज़ार
  rationale: मन्दिर के दीपकों की बत्तियाँ काटने या सँवारने वाले उपकरण का सम्भावित अर्थ साधारण पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी में अनिश्चितता सुरक्षित है।
- source_word: מִזְרָקוֹת
  choice: छिड़काव के पात्र
  rationale: सामान्य कटोरों से भेद रखते हुए सम्भावित अनुष्ठानिक उपयोग व्यक्त करता है।
- source_word: חֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: धार्मिक उपासना में प्रयुक्त धातु के तुरहीनुमा वाद्यों के लिए मानक हिन्दी शब्द।
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  choice: सोने अथवा चाँदी का कोई भी पात्र
  rationale: כְּלִי के व्यापक अर्थ को मन्दिर-सामग्री के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है और वितरक भाव बनाए रखता है।
- source_word: מִן הַכֶּסֶף הַמּוּבָא
  choice: लाए गए धन से
  rationale: यहाँ כֶּסֶף संचित चाँदी की अपेक्षा व्यय योग्य धन को सूचित करता है; कर्मवाच्य कृदन्त भी सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ नाम की प्रकृति को सुरक्षित रखता है; ‘याहवे’ ध्वन्यात्मक रूप से अधिक सम्भावित विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘भवन’ औपचारिक मन्दिर-पदनाम को बनाए रखता है। तकनीकी और अनिश्चित पात्र-नामों को पाठ में सुबोध बनाया गया है तथा जहाँ आवश्यक है वहाँ पादटिप्पणियों द्वारा विकल्प सुरक्षित रखे गए हैं।
