  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
translation:
  language: hi
  text: पर जिन पुरुषों को वे काम करनेवालों को देने के लिए धन सौंपते थे[b], उनसे हिसाब नहीं माँगा जाता था[a], क्योंकि वे ईमानदारी से काम करते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पुरुषों से लेखा नहीं माँगा जाता था।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिनके हाथ में वे धन देते थे”; यह किसी वस्तु को किसी के प्रभार में सौंपने का हिब्रू मुहावरा है।
    reason: cultural_note
  - marker: c
    text: “ईमानदारी से” का अनुवाद “विश्वासयोग्यता से” या “सत्यनिष्ठा से” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַשְּׁבוּ
  choice: उनसे कोई हिसाब नहीं लिया जाता था
  rationale: पिएल रूप यहाँ हिसाब जाँचने या लेखा माँगने का भाव देता है। यह हिंदी में स्वाभाविक है और प्रसंगानुसार उत्तरदायित्व के औपचारिक लेखे की बात स्पष्ट करता है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: बहुवचन אֲנָשִׁים यहाँ धन सँभालने वाले विशिष्ट पुरुष अधिकारियों को सूचित करता है; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: יִתְּנוּ ... עַל יָדָם
  choice: जिनके हाथ में ... सौंपते थे
  rationale: हिब्रू मुहावरे 'हाथ में देना' का चित्र रखते हुए 'सौंपना' उसके भरोसे और प्रभार का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַכֶּסֶף
  choice: धन
  rationale: כֶּסֶף का शाब्दिक अर्थ चाँदी भी हो सकता है, पर मंदिर की मरम्मत के इस प्रसंग में इसका कार्यात्मक अर्थ धनराशि है।
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवालों
  rationale: यह कृदन्तीय पद मरम्मत का काम करने वाले श्रमिकों या कारीगरों को दर्शाता है; चुना हुआ रूप सरल और मूल संरचना के निकट है।
- source_word: בֶאֱמֻנָה
  choice: ईमानदारी से
  rationale: यहाँ אֱמוּנָה धन सँभालने में विश्वसनीय और सत्यनिष्ठ आचरण का बोध कराता है। 'ईमानदारी से' आधुनिक हिंदी में प्रसंग को स्पष्ट रखता है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הֵם עֹשִׂים
  choice: वे ... काम करते थे
  rationale: हिब्रू अभिव्यक्ति उनके निरंतर आचरण को बताती है; हिंदी में यह रूप सहज है और निकटवर्ती कार्य-प्रसंग से भी जुड़ता है।
