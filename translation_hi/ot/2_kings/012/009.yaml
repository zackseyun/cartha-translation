  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘धन’ प्रशासनिक संदर्भ में स्पष्ट है, और ‘टूट-फूट की मरम्मत’ इब्रानी मुहावरे का स्वाभाविक अर्थ संप्रेषित करता है।
