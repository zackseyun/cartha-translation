  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
translation:
  language: hi
  text: परन्तु याजक इस बात पर सहमत हो गए कि वे लोगों से धन नहीं लेंगे और भवन[a] की क्षति की मरम्मत नहीं करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भवन” से आशय यहोवा के भवन, अर्थात मंदिर से है।
    reason: cultural_note
  - marker: b
    text: अधिक शाब्दिक रूप से, “भवन की क्षति को मज़बूत नहीं करेंगे”; यह मंदिर की क्षति की मरम्मत करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  choice: सहमत हो गए
  rationale: אבה का यह रूप सहमति या तत्परता व्यक्त करता है; आगे के निषेधात्मक क्रियार्थक वाक्यांशों के साथ ‘सहमत हो गए’ स्वाभाविक और सटीक है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मंदिर-व्यवस्था के इस संदर्भ में כֹּהֲנִים का मानक और प्रतिष्ठित हिन्दी रूप।
- source_word: לְבִלְתִּי קְחַת
  choice: नहीं लेंगे
  rationale: לְבִלְתִּי और क्रियार्थक रूप उस कार्य को न करने की सहमति दर्शाते हैं; हिन्दी में परोक्ष कथन के भीतर भविष्यत् रूप स्वाभाविक है।
- source_word: כֶּסֶף
  choice: धन
  rationale: शाब्दिक अर्थ ‘चाँदी’ हो सकता है, पर प्रशासनिक और भुगतान के संदर्भ में इसका अर्थ मुद्रा अथवा धन है।
- source_word: מֵאֵת הָעָם
  choice: लोगों से
  rationale: पूर्वसर्गीय पद का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וּלְבִלְתִּי חַזֵּק
  choice: और ... मरम्मत नहीं करेंगे
  rationale: חזק का मूल अर्थ ‘मज़बूत करना’ है, किंतु בֶּדֶק הַבַּיִת के साथ यह क्षति की मरम्मत कराने या करने का मुहावरा है।
- source_word: אֶת בֶּדֶק הַבָּיִת
  choice: भवन की टूट-फूट
  rationale: בֶּדֶק दरार, क्षति या मरम्मत योग्य टूट-फूट को दर्शाता है। הַבָּיִת को ‘भवन’ रखने से इब्रानी अभिव्यक्ति बनी रहती है, जबकि संदर्भ में यह यहोवा का भवन अर्थात मंदिर है।
