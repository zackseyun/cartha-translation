id: 2KI.12.17
reference: 2 Kings 12:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֶּ֤סֶף אָשָׁם֙ וְ/כֶ֣סֶף חַטָּא֔וֹת לֹ֥א יוּבָ֖א בֵּ֣ית יְהוָ֑ה לַ/כֹּהֲנִ֖ים יִהְיֽוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/017.yaml
  text: Money from a guilt offering and money from sin offerings was not to be brought into the house of Yahweh[b][a]; it belonged to the priests.
translation:
  language: hi
  text: दोषबलि का धन और पापबलियों का धन[a] याहवे के भवन[b] में नहीं लाया जाता था; वह याजकों का होता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दोषबलि की चाँदी और पापबलियों की चाँदी।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मंदिर।
    reason: clarification
lexical_decisions:
- source_word: כֶּסֶף
  choice: धन
  rationale: मूल अर्थ ‘चाँदी’ है, पर मंदिर की आर्थिक व्यवस्था के इस संदर्भ में यह चाँदी के रूप में दिए गए धन को दर्शाता है। ‘धन’ आधुनिक हिन्दी में स्वाभाविक है और दोनों अर्थों के संबंध को पादटिप्पणी में सुरक्षित रखता है।
- source_word: אָשָׁם
  choice: दोषबलि
  rationale: बलिदान-संबंधी संदर्भ में यह दोष अथवा क्षतिपूर्ति से जुड़ी निर्धारित बलि है; ‘दोषबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है।
- source_word: חַטָּאוֹת
  choice: पापबलियाँ
  rationale: यहाँ बहुवचन संज्ञा अमूर्त ‘पापों’ के बजाय बलिदानों की श्रेणी को दर्शाती है। ‘पापबलियाँ’ इस अर्थ को स्पष्ट रखता है।
- source_word: לֹא יוּבָא
  choice: नहीं लाया जाता था
  rationale: निषेध सहित कर्मवाच्य रूप इन निधियों के प्रचलित अथवा निर्धारित प्रबंध को व्यक्त करता है। कथात्मक संदर्भ में यह हिन्दी रूप स्वाभाविक है और केवल एक घटना का संकेत नहीं देता।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ हिब्रू के शाब्दिक ‘घर’ को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है; संदर्भ में इससे मंदिर अभिप्रेत है। परमेश्वर के निज नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לַכֹּהֲנִים יִהְיוּ
  choice: वह याजकों का होता था
  rationale: खंड इन निधियों के आवंटन या स्वामित्व को बताता है। हिन्दी में सामूहिक ‘धन’ के साथ एकवचन ‘वह’ स्वाभाविक है, यद्यपि हिब्रू क्रिया बहुवचन है।
theological_decisions:
- issue: परमेश्वर के निज नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का निज नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: חַטָּאוֹת का बलिदान-संबंधी अर्थ
  choice: पापबलियाँ
  alternative: शुद्धिकरण-बलियाँ
  rationale: पुरोहितीय भाषा में ‘शुद्धिकरण-बलि’ संभव व्याख्या है, पर यहाँ אָשָׁם के समानांतर मंदिर की आय से जुड़ी बलि-श्रेणी का उल्लेख है। ‘पापबलियाँ’ पारंपरिक श्रेणी-नाम को रखता है, जबकि वैकल्पिक धार्मिक व्याख्या थोपता नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन’ प्रशासनिक संदर्भ में स्वाभाविक है; ‘दोषबलि’, ‘पापबलि’ और ‘याजक’ स्थापित बाइबलीय शब्दावली हैं। अर्धविराम दो हिब्रू उपवाक्यों के आवंटन-संबंधी संबंध को स्पष्ट करता है।
