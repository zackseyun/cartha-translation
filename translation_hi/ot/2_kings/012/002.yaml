base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/002.yaml
  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: hi
  text: येहू के शासन के सातवें वर्ष में यहोआश राजा बना, और उसने यरूशलेम में चालीस वर्ष तक शासन किया। उसकी माता का नाम सिब्या था; वह बेर्शेबा की थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  choice: येहू के शासन के सातवें वर्ष में
  rationale: यह राजकीय काल-निर्धारण का सूत्र है। ‘शासन के’ जोड़ने से आधुनिक हिन्दी में स्पष्ट होता है कि गिनती येहू के राज्यकाल से है।
- source_word: מָלַךְ יְהוֹאָשׁ
  choice: यहोआश राजा बना
  rationale: इस राज्यारोहण-सूत्र में क्रिया का भाव आरंभसूचक है; ‘राजा बना’ उसके राज्यारोहण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  choice: और उसने ... चालीस वर्ष तक शासन किया
  rationale: यहाँ वही क्रिया शासन की अवधि बताती है; ‘शासन किया’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानसूचक בְּ का सीधा और स्वाभाविक अनुवाद।
- source_word: וְשֵׁם אִמּוֹ
  choice: उसकी माता का नाम ... था
  rationale: इब्रानी सूचना को स्वाभाविक हिन्दी शब्दक्रम में रखा गया है।
- source_word: צִבְיָה
  choice: सिब्या
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: מִבְּאֵר שָׁבַע
  choice: वह बेर्शेबा की थी
  rationale: מִן यहाँ मूल स्थान बताता है। अलग उपवाक्य आधुनिक हिन्दी में स्पष्ट करता है कि सिब्या बेर्शेबा की रहनेवाली थी।
