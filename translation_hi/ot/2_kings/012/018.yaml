base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
translation:
  language: hi
  text: तब अराम[a] का राजा हज़ाएल चढ़ आया। उसने गत के विरुद्ध युद्ध किया और उस पर अधिकार कर लिया। फिर हज़ाएल ने यरूशलेम पर चढ़ाई करने का निश्चय किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अराम’ इब्रानी नाम है, जिसका पारंपरिक अनुवाद ‘सीरिया’ किया जाता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “यरूशलेम पर चढ़ाई करने के लिए अपना मुख स्थिर किया,” अर्थात उसने ऐसा करने का दृढ़ निश्चय किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक कथात्मक सूचक अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: יַעֲלֶה
  choice: चढ़ आया
  rationale: עלה का मूल अर्थ ऊपर जाना या चढ़ना है और सैन्य प्रसंग में आगे बढ़ने का भाव भी देता है; ‘चढ़ आया’ दोनों पक्षों को स्वाभाविक हिन्दी में रखता है।
- source_word: חֲזָאֵל מֶלֶךְ אֲרָם
  choice: अराम का राजा हज़ाएल
  rationale: व्यक्तिनाम और इब्रानी भू-जातीय नाम का सीधा लिप्यंतरण किया गया है; ‘सीरिया’ के पारम्परिक रूप को मुख्य पाठ में नहीं अपनाया गया।
- source_word: וַיִּלָּחֶם עַל
  choice: के विरुद्ध युद्ध किया
  rationale: לחם के साथ עַל यहाँ किसी स्थान के विरुद्ध युद्ध करने को व्यक्त करता है; यह रूप स्पष्ट है और केवल ‘आक्रमण’ कहकर अर्थ को संकुचित नहीं करता।
- source_word: גַּת
  choice: गत
  rationale: स्थाननाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַיִּלְכְּדָהּ
  choice: उस पर अधिकार कर लिया
  rationale: लכד विजय के प्रसंग में नगर को पकड़ने या अपने अधिकार में लेने का अर्थ देता है; हिन्दी में नगर के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: וַיָּשֶׂם ... פָּנָיו
  choice: निश्चय किया
  rationale: शाब्दिक मुहावरा ‘अपना मुख लगाया’ दृढ़ दिशा या संकल्प को दर्शाता है; आधुनिक हिन्दी में ‘निश्चय किया’ उसका स्वाभाविक अर्थ देता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לַעֲלוֹת עַל יְרוּשָׁלִָם
  choice: यरूशलेम पर चढ़ाई करने
  rationale: עלה עם עַל सैन्य प्रसंग में नगर की ओर शत्रुतापूर्वक बढ़ने का संकेत देता है; ‘चढ़ाई करने’ आरोहण और सैन्य गति दोनों को व्यक्त करता है, बिना यह कहे कि आक्रमण पूरा हो गया।
