source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹאָ֜שׁ אֶל הַ/כֹּהֲנִ֗ים כֹּל֩ כֶּ֨סֶף הַ/קֳּדָשִׁ֜ים אֲשֶׁר יוּבָ֤א בֵית יְהוָה֙ כֶּ֣סֶף עוֹבֵ֔ר אִ֕ישׁ כֶּ֥סֶף נַפְשׁ֖וֹת עֶרְכּ֑/וֹ כָּל כֶּ֗סֶף אֲשֶׁ֤ר יַֽעֲלֶה֙ עַ֣ל לֶב אִ֔ישׁ לְ/הָבִ֖יא בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/005.yaml
  text: And Jehoash said to the priests[a], “All the money of the holy things that is brought into the house of Yahweh—the money from each man who is counted, the money of the valuation of persons[c][b], and all the money that comes up on a man’s heart to bring into the house of Yahweh—”
translation:
  language: hi
  text: तब योआश ने याजकों से कहा, “पवित्र वस्तुओं का वह सारा धन जो याहवे के भवन में लाया जाता है—गिने जानेवाले हर पुरुष का धन[a], व्यक्तियों के मूल्यांकन का धन[b], और वह सारा धन जिसे कोई अपने मन से याहवे के भवन में लाना चाहे[c]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पार जानेवाले प्रत्येक पुरुष का धन”; संभवतः गिने गए लोगों से लिया जानेवाला जनगणना-भुगतान (निर्गमन 30:13–16 देखें)।
    reason: lexical_alternative
  - marker: b
    text: अर्थात व्यक्तियों के मूल्यांकन से संबंधित धन; संभवतः मन्नत के अंतर्गत किए गए मूल्यांकन के भुगतान (लैव्यव्यवस्था 27:2–8 देखें)।
    reason: cross_reference
  - marker: c
    text: इब्रानी मुहावरा है, “जो किसी पुरुष के हृदय पर चढ़े,” अर्थात जिसे कोई स्वेच्छा से देने का निश्चय करे।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं का वह सारा धन
  rationale: रचना में ‘पवित्र/समर्पित वस्तुओं से संबंधित धन’ का भाव है। यह अनुवाद इब्रानी संबंधवाचक संरचना को बनाए रखता है और आगे बताई गई आय की श्रेणियों के लिए स्थान छोड़ता है।
- source_word: יוּבָא בֵית יְהוָה
  choice: याहवे के भवन में लाया जाता है
  rationale: ‘लाया जाता है’ בוא के होफल कर्मवाच्य को दर्शाता है; ‘भवन’ यहाँ मंदिर के लिए प्रयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  choice: गिने जानेवाले हर पुरुष का धन
  rationale: शाब्दिक अर्थ ‘पार जानेवाले प्रत्येक पुरुष का धन’ है, पर निर्गमन 30:13–16 की पृष्ठभूमि में यह गिने हुओं के जनगणना-भुगतान की ओर संकेत करता प्रतीत होता है। मुख्य पाठ में संदर्भगत अर्थ और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  choice: व्यक्तियों के ठहराए हुए मूल्य का धन
  rationale: संक्षिप्त इब्रानी पद व्यक्तियों के विधिक/धार्मिक मूल्यांकन से प्राप्त धन की ओर संकेत करता है। ‘मन्नत’ को मुख्य पाठ में जोड़कर अर्थ को आवश्यकता से अधिक सीमित नहीं किया गया।
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ לְהָבִיא
  choice: वह सारा धन जिसे कोई अपने मन से ... लाना चाहे
  rationale: ‘किसी पुरुष के हृदय पर चढ़े’ इब्रानी मुहावरा स्वेच्छा से मन में ठानने या इच्छा करने को व्यक्त करता है। सहज हिन्दी में अर्थ दिया गया है और मूल मुहावरा पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ का धार्मिक-कानूनी आशय
  choice: व्यक्तियों के ठहराए हुए मूल्य का धन
  alternative: मन्नतों के लिए व्यक्तियों के मूल्यांकन का धन
  rationale: लैव्यव्यवस्था 27 की संभावित पृष्ठभूमि स्वीकार करते हुए भी मुख्य पाठ में ‘मन्नत’ स्पष्ट रूप से जोड़ना मूल की संक्षिप्तता और कुछ अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘याजक’, ‘पवित्र वस्तुएँ’ और ‘भवन’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। वाक्य मूल की अधूरी आज्ञा/कथन-भूमिका को अंतिम दीर्घ विराम-चिह्न द्वारा बनाए रखता है, क्योंकि निर्देश अगली आयत में पूरा होता है।
