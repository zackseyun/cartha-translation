  yaml_path: translation/ot/2_kings/012/004.yaml
  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
translation:
  language: hi
  text: फिर भी[a] ऊँचे स्थान हटाए नहीं गए; लोग अब भी ऊँचे स्थानों पर बलि चढ़ाते और धूप जलाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु”; “ऊँचे स्थान” स्थानीय, प्रायः ऊँचाई पर स्थित उपासना-स्थलों के लिए प्रयुक्त इब्रानी पद है।
    reason: शब्दार्थ-विकल्प और सांस्कृतिक स्पष्टीकरण
lexical_decisions:
- source_word: רַק
  choice: फिर भी
  rationale: यह पिछले सकारात्मक आकलन पर एक अपवाद या सीमा व्यक्त करता है; आधुनिक हिन्दी में ‘फिर भी’ इसका विरोधात्मक भाव स्वाभाविक रूप से देता है।
- source_word: הַבָּמוֹת
  choice: ऊँचे स्थान
  rationale: यह स्थानीय, प्रायः ऊँचाई पर स्थित उपासना-स्थलों का ऐतिहासिक-धार्मिक पद है। ‘ऊँचे स्थान’ भौगोलिक और उपासना-संबंधी दोनों विशेषताओं को बनाए रखता है।
- source_word: לֹא סָרוּ
  choice: हटाए नहीं गए
  rationale: यहाँ ऊँचे स्थान कर्ता हैं; हिन्दी में कर्मवाच्य प्रयोग इब्रानी मुहावरे का व्यावहारिक अर्थ स्वाभाविक रूप से व्यक्त करता है कि वे बने रहे।
- source_word: עוֹד
  choice: अब भी
  rationale: यह पहले से जारी प्रथा के बने रहने को दर्शाता है।
- source_word: הָעָם
  choice: लोग
  rationale: सामूहिक संज्ञा के लिए सहज और स्पष्ट आधुनिक हिन्दी।
- source_word: מְזַבְּחִים
  choice: बलि चढ़ाते
  rationale: इब्रानी कृदन्त निरंतर या प्रथागत कार्य दर्शाता है; ‘बलि चढ़ाते थे’ धार्मिक संदर्भ में स्वाभाविक हिन्दी है।
- source_word: וּמְקַטְּרִים
  choice: और धूप जलाते
  rationale: उपासना-संदर्भ में קטר का सामान्य अर्थ धूप या सुगन्धित सामग्री जलाना है; बलि चढ़ाने के साथ इसका यही स्वाभाविक अर्थ है।
- source_word: בַּבָּמוֹת
  choice: ऊँचे स्थानों पर
  rationale: स्थानवाचक उपसर्ग और उसी ऐतिहासिक-धार्मिक पद की पुनरावृत्ति को बनाए रखता है।
theological_decisions:
- issue: ऊँचे स्थानों पर की जाने वाली उपासना का मूल्यांकन
  choice: मुख्य पाठ में ऐतिहासिक-वर्णनात्मक पद ‘ऊँचे स्थान’ रखा गया और अतिरिक्त धार्मिक निन्दा नहीं जोड़ी गई।
  alternative: ‘स्थानीय पूजा-स्थल’ या ‘मन्दिर’ कहकर उसका अर्थ स्पष्ट करना।
  rationale: पद का व्यापक संदर्भ इन स्थलों की आलोचना करता है, पर यह वाक्य स्वयं मुख्यतः उनके बने रहने और वहाँ उपासना जारी रहने की सूचना देता है। अनुवाद उस निहित तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊँचे स्थान’ पारम्परिक ऐतिहासिक-धार्मिक पद को सुरक्षित रखता है, जबकि पादटिप्पणी उसका संक्षिप्त अर्थ स्पष्ट करती है।
