base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
translation:
  language: hi
  text: और बाबेल के राजा ने हमात देश के रिबला में उन पर प्रहार किया और उन्हें मार डाला। इस प्रकार यहूदा को उसकी भूमि से निर्वासित कर दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस प्रकार यहूदा अपनी भूमि से निर्वासन में चला गया।” इब्रानी क्रिया को इस प्रसंग में कर्तृवाच्य अथवा कर्मवाच्य रूप में व्यक्त किया जा सकता है; कर्मवाच्य रूप बलपूर्वक देश से निकाले जाने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ אֹתָם
  choice: उन्हें मार गिराया
  rationale: נכה का मूल भाव प्रहार करना है। प्रसंग में ‘मार गिराया’ हिंसक प्रहार को स्वाभाविक हिन्दी में व्यक्त करता है और अगले स्पष्ट मृत्यु-सूचक क्रिया-पद से उसका भेद बनाए रखता है।
- source_word: וַיְמִיתֵם
  choice: उनका वध कर दिया
  rationale: מות के हिफ़ईल रूप का अर्थ ‘मृत्यु का कारण बनना/मार डालना’ है। ‘वध कर दिया’ पहले क्रिया-पद की पुनरुक्ति किए बिना मृत्यु को स्पष्ट करता है; ‘फाँसी दी’ या ‘मृत्युदंड दिया’ मूल से अधिक विशिष्ट होते।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह इब्रानी संबंध-रचना का सीधा, स्वाभाविक और परंपरागत हिन्दी रूप है।
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  choice: हमात देश के रिबला में
  rationale: दोनों स्थान-सूचक पदों का संबंध स्पष्ट करते हुए मूल क्रम और भौगोलिक अर्थ को सहज हिन्दी में व्यक्त किया गया है।
- source_word: וַיִּגֶל יְהוּדָה
  choice: यहूदा को ... बँधुआई में ले जाया गया
  rationale: גלה निर्वासन या देश-निकाले को सूचित करता है। कर्मवाच्य रूप जबरन हटाए जाने का निहित भाव स्पष्ट करता है, जबकि ‘यहूदा’ मूल की संक्षिप्त सामूहिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: מֵעַל אַדְמָתוֹ
  choice: उसकी भूमि से
  rationale: אדמה यहाँ राष्ट्रीय भूमि को सूचित करता है। ‘भूमि’ आधुनिक और गरिमापूर्ण हिन्दी है तथा संबंधवाचक सर्वनाम यहूदा की ओर संकेत करता है।
