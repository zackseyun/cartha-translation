translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मूल-पाठ के निकट शैली रखी गई है। ‘मार गिराया’ और ‘वध कर दिया’ द्वारा इब्रानी की क्रमिक दो क्रियाएँ अलग रखी गई हैं। ‘बँधुआई’ बाइबलीय संदर्भ में परिचित है, पर वाक्य-रचना आधुनिक और स्पष्ट रखी गई है।
