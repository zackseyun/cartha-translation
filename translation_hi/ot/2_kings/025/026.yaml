source:
  edition: WLC
  text: וַ/יָּקֻ֨מוּ כָל הָ/עָ֜ם מִ/קָּטֹ֤ן וְ/עַד גָּדוֹל֙ וְ/שָׂרֵ֣י הַ/חֲיָלִ֔ים וַ/יָּבֹ֖אוּ מִצְרָ֑יִם כִּ֥י יָרְא֖וּ מִ/פְּנֵ֥י כַשְׂדִּֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
translation:
  language: hi
  text: तब छोटे से लेकर बड़े तक सब लोग, और सेनाओं के प्रधान, उठे और मिस्र चले गए, क्योंकि वे कसदियों से डरते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठे
  rationale: यह קום का कथात्मक रूप है और यहाँ निर्णायक कार्रवाई आरम्भ करने को दर्शाता है; ‘उठे’ मूल की संक्षिप्तता और कथाक्रम दोनों बनाए रखता है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: यह सामूहिक और सर्वसमावेशी अभिव्यक्ति है; आधुनिक हिन्दी में ‘सब लोग’ स्वाभाविक और स्पष्ट है।
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: यह केवल आयु नहीं, बल्कि पद, महत्त्व या सामाजिक स्थिति की पूरी सीमा व्यक्त करने वाला मुहावरा है; हिन्दी रूप भी वही व्यापकता बनाए रखता है।
- source_word: וְשָׂרֵי הַחֲיָלִים
  choice: और सैन्य-दलों के प्रधान
  rationale: שָׂרֵי नेतृत्व या अधिकारी को और חֲיָלִים यहाँ सैन्य-दलों को दर्शाता है। यह अनुवाद पद की अनावश्यक आधुनिक विशिष्टता से बचते हुए सैन्य संदर्भ स्पष्ट करता है।
- source_word: וַיָּבֹאוּ מִצְרָיִם
  choice: और मिस्र चले गए
  rationale: בוא का मूल अर्थ ‘आना/पहुँचना’ हो सकता है, पर कथावाचक के दृष्टिकोण से हिन्दी में गंतव्य की ओर प्रस्थान के लिए ‘मिस्र चले गए’ अधिक स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके मिस्र जाने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में सीधा कारणसूचक है।
- source_word: יָרְאוּ
  choice: वे ... डरते थे
  rationale: यहाँ ירא भय को व्यक्त करता है; ‘डरते थे’ सहज आधुनिक हिन्दी है और प्रसंगानुसार उनकी भयभीत अवस्था बताता है।
- source_word: מִפְּנֵי כַשְׂדִּים
  choice: कसदियों से
  rationale: ירא के साथ מִפְּנֵי किसी के सामने या उसके कारण भय को दर्शाता है; हिन्दी में ‘कसदियों से डरते थे’ स्वाभाविक समतुल्य है।
