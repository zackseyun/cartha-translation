translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छोटे से लेकर बड़े तक’ मूल मुहावरे की सामाजिक और सामान्य व्यापकता बनाए रखता है, और ‘कसदी’ ऐतिहासिक जातिनाम को प्रचलित बाइबलीय हिन्दी रूप में रखा गया है। फुटनोट चिह्न उसी पदबंध पर रखा गया है जिससे उसका lexical विकल्प संबंधित है।
