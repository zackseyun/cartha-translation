base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
translation:
  language: hi
  text: ऐसा हुआ कि उसके शासन के नौवें वर्ष में, दसवें महीने के दसवें दिन, बाबेल का राजा नबूकदनेस्सर[a] अपनी सारी सेना के साथ यरूशलेम पर चढ़ आया। उसने उसके विरुद्ध छावनी डाली और उसके चारों ओर घेराबंदी की दीवार[b] खड़ी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का लिप्यंतरण “नबूकदरेस्सर” भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ घेराबंदी के लिए बनाई गई “मोर्चाबंदी,” “घेरा-दीवार” या “घेराबंदी का बाँध” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह कथात्मक संक्रमण पहले से चल रहे वृत्तांत को आगे बढ़ाता है; हिंदी में तिथि-वाक्य को सीधे आरंभ करना अधिक स्वाभाविक है और अर्थ की हानि नहीं करता।
- source_word: בִשְׁנַת הַתְּשִׁיעִית לְמָלְכוֹ
  choice: उसके शासन के नौवें वर्ष
  rationale: यह प्रचलित राजकीय वर्ष-सूत्र है। सर्वनाम की संदर्भगत अस्पष्टता को बनाए रखा गया है।
- source_word: בַּחֹדֶשׁ הָעֲשִׂירִי בֶּעָשׂוֹר לַחֹדֶשׁ
  choice: दसवें महीने के दसवें दिन
  rationale: मूल की पंचांग-संबंधी अभिव्यक्ति को किसी आधुनिक महीने के नाम में बदले बिना स्वाभाविक हिंदी में रखा गया है।
- source_word: נְבֻכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा नबूकदनेस्सर
  rationale: राजकीय उपाधि और स्थान-नाम का सीधा अनुवाद तथा हिंदी बाइबल परंपरा में परिचित नाम-रूप अपनाया गया है।
- source_word: הוּא וְכָל חֵילוֹ
  choice: अपनी सारी सेना के साथ
  rationale: राजा की व्यक्तिगत भागीदारी और उसकी पूरी सैन्य शक्ति दोनों व्यक्त होते हैं; हिंदी में यह संरचना स्वाभाविक है।
- source_word: עַל יְרוּשָׁלַםִ
  choice: यरूशलेम पर चढ़ आया
  rationale: सैनिक प्रसंग में עַל विरोधी आक्रमण की दिशा बताता है; ‘पर चढ़ आया’ इसे स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: וַיִּחַן עָלֶיהָ
  choice: उसने उसके सामने पड़ाव डाला
  rationale: घेराबंदी के संदर्भ में शहर के विरुद्ध सैन्य छावनी स्थापित करने का भाव है। ‘सामने’ हिंदी में स्वाभाविक है और आक्रमणकारी स्थिति बनाए रखता है।
- source_word: וַיִּבְנוּ עָלֶיהָ דָּיֵק סָבִיב
  choice: उसके चारों ओर घेराबंदी की दीवार बनवाई
  rationale: बहुवचन क्रिया सेना की कार्रवाई को सूचित करती है। राजा को प्रेरक कर्ता मानकर ‘बनवाई’ स्वाभाविक हिंदी देता है; דָּיֵק के व्यापक सैन्य अर्थ के लिए टिप्पणी जोड़ी गई है।
