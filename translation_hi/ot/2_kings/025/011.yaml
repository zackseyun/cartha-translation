  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
translation:
  language: hi
  text: तब राजकीय अंगरक्षक-दल के प्रधान[a] नबूजरदान ने नगर में बचे हुए लोगों, बाबेल के राजा की ओर जा मिले लोगों[b] और बाकी जनसमूह[c] को निर्वासित कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘वध करनेवालों का प्रधान’; संभवतः यह राजकीय अंगरक्षक-दल के सेनापति की पदवी थी।
    reason: cultural_note
  - marker: b
    text: या ‘बाबेल के राजा के पक्ष में चले गए भगोड़े’; इब्रानी में शाब्दिक रूप से ‘जो बाबेल के राजा पर जा गिरे थे।’
    reason: lexical_alternative
  - marker: c
    text: या ‘बाकी भीड़’ अथवा ‘बाकी आबादी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם הַנִּשְׁאָרִים
  choice: बचे हुए बाकी लोगों
  rationale: यह पदबंध घेराबंदी और पहले हुई मार-काट तथा निर्वासन के बाद नगर में शेष रह गए लोगों को दर्शाता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: संदर्भ में यह नगर यरूशलेम है; मूल पाठ के समान पद में नाम को दोहराए बिना सामान्य संकेत रखा गया है।
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עַל
  choice: की ओर जा मिले लोगों
  rationale: सैन्य-राजनीतिक संदर्भ में נפל על का अर्थ शाब्दिक रूप से गिरना नहीं, बल्कि दूसरे शासक के पक्ष में चले जाना है। यह अनुवाद उस भाव को स्वाभाविक हिंदी में व्यक्त करता है, बिना यह निश्चित किए कि सभी व्यक्ति औपचारिक सैनिक भगोड़े थे।
- source_word: הַמֶּלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: यह मूल इब्रानी संबंधवाचक रचना का सीधा और प्रचलित हिंदी रूप है।
- source_word: יֶתֶר הֶהָמוֹן
  choice: बाकी जनसमूह
  rationale: הָמוֹן लोगों की बड़ी सामूहिक संख्या को सूचित करता है; ‘जनसमूह’ किसी विशिष्ट सामाजिक वर्ग का अनावश्यक निर्धारण नहीं करता।
- source_word: הֶגְלָה
  choice: बंधुआई में भेज दिया
  rationale: गला धातु का हिफ़ील रूप जबरन निर्वासित करने को दर्शाता है। ‘बंधुआई में भेज दिया’ आधुनिक पाठक के लिए स्वाभाविक है और विवश विस्थापन का भाव बनाए रखता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: רַב טַבָּחִים
  choice: राज-अंगरक्षकों के प्रधान
  rationale: शाब्दिक अर्थ ‘वध करनेवालों का प्रधान’ है, पर यहाँ यह बाबेली राजकीय अधिकारी की पदवी है। कार्यपरक अनुवाद आधुनिक पाठक को भ्रामक कसाई-संबंधी अर्थ से बचाता है।
