  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
translation:
  language: hi
  text: लेकिन देश के सबसे गरीब लोगों में से कुछ को अंगरक्षकों के प्रधान ने दाख की बारियों में काम करने वाले और खेतों में काम करने वाले होने के लिए वहीं छोड़ दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  choice: लेकिन देश के सबसे गरीब लोगों में से कुछ को
  rationale: מִדַּלַּת הָאָרֶץ में מן अंशवाचक है और דַּלַּת यहाँ देश के निर्धनतम या निम्नतम वर्ग को सूचित करता है। पिछले पद के निर्वासन के साथ विरोध दिखाने के लिए וּ का अनुवाद ‘लेकिन’ किया गया; निहित कर्म को स्वाभाविक हिन्दी में ‘कुछ को’ से स्पष्ट किया गया।
- source_word: הִשְׁאִיר
  choice: वहीं छोड़ दिया
  rationale: שׁאר के हिफ़ईल रूप का अर्थ किसी को पीछे रहने देना या छोड़ देना है। ‘वहीं’ प्रसंगगत स्थान को स्वाभाविक रूप से व्यक्त करता है, यद्यपि वह अलग हिब्रू शब्द का अनुवाद नहीं है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: शाब्दिक व्युत्पत्ति वध करने वालों के प्रधान से जुड़ी है, पर राजकीय-सैनिक प्रसंग में यह नबूजरदान के पद, अर्थात राजकीय अंगरक्षक दल के प्रधान, का पदनाम है।
- source_word: לְכֹרְמִים
  choice: दाख की बारियों में काम करने
  rationale: כֹּרְמִים दाख की बारी में काम करने वालों को दर्शाता है। आधुनिक हिन्दी में क्रियात्मक पदबंध पेशे का अर्थ स्पष्ट और सहज बनाता है।
- source_word: וּ/לְ/יֹגְבִים
  choice: और खेत जोतने
  rationale: יֹגְבִים दुर्लभ कृषि-संबंधी शब्द है, जिसका आशय मिट्टी या खेत पर श्रम करने वालों से है। ‘खेत जोतने’ सम्भावित विशिष्ट अर्थ को संक्षेप में व्यक्त करता है।
