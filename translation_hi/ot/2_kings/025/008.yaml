source:
  edition: WLC
  text: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙ בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֑ל בָּ֞א נְבוּזַרְאֲדָ֧ן רַב טַבָּחִ֛ים עֶ֥בֶד מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
translation:
  language: hi
  text: और पाँचवें महीने के सातवें दिन—यह बाबेल के राजा नबूकदनेस्सर के राज्य का उन्नीसवाँ वर्ष था—बाबेल के राजा का सेवक और राज-अंगरक्षकों का प्रधान[a] नबूजरदान यरूशलेम आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘वध करनेवालों का प्रधान’ है; संभवतः यह राज-अंगरक्षकों या दंडाधिकारियों के सेनापति की उपाधि थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַחֲמִישִׁי
  choice: और पाँचवें महीने
  rationale: וְ कथा की पिछली बात से संबंध जोड़ता है; हिन्दी में ‘और’ इस निरंतरता को सहज रूप से व्यक्त करता है। महीने का नाम दिए बिना हिब्रू की क्रमसूचक अभिव्यक्ति को बनाए रखा गया है।
- source_word: בְּשִׁבְעָה לַחֹדֶשׁ
  choice: के सातवें दिन
  rationale: हिब्रू तिथि-सूत्र में ‘दिन’ निहित है; आधुनिक हिन्दी में स्पष्टता और स्वाभाविकता के लिए इसे व्यक्त किया गया है।
- source_word: הִיא שְׁנַת תְּשַׁע עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ נְבֻכַדְנֶאצַּר
  choice: यह ... नबूकदनेस्सर के राज्य का उन्नीसवाँ वर्ष था
  rationale: הִיא तिथि से जुड़ी व्याख्यात्मक टिप्पणी आरंभ करता है, और לַמֶּלֶךְ राजकीय वर्ष-गणना सूचित करता है। ‘के राज्य का’ हिन्दी में इसी अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: हिब्रू संबंध-रचना का सीधा और प्रचलित हिन्दी रूप।
- source_word: רַב טַבָּחִים
  choice: राज-अंगरक्षकों का प्रधान
  rationale: शब्दशः पद वध करनेवालों के प्रधान को सूचित कर सकता है, पर राजकीय संदर्भ में यह शाही अंगरक्षक दल अथवा दंडाधिकारियों के अधिकारी की उपाधि है। ‘राज-अंगरक्षकों का प्रधान’ पद का कार्य स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक अर्थ सुरक्षित रखती है।
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा का सेवक
  rationale: עֶבֶד यहाँ राजा के अधीन सेवा करनेवाले अधिकारी को दर्शाता है। ‘सेवक’ संबंध की व्यापकता बनाए रखता है और अनावश्यक रूप से ‘दास’ या केवल ‘अधिकारी’ तक अर्थ सीमित नहीं करता।
- source_word: בָּא ... יְרוּשָׁלִָם
  choice: यरूशलेम आया
  rationale: सामान्य कथात्मक क्रिया בוא के लिए ‘आया’ सीधा और स्वाभाविक अनुवाद है।
