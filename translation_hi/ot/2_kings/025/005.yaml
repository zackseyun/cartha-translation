id: 2KI.25.5
reference: 2 Kings 25:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּרְדְּפ֤וּ חֵיל כַּשְׂדִּים֙ אַחַ֣ר הַ/מֶּ֔לֶךְ וַ/יַּשִּׂ֥גוּ אֹת֖/וֹ בְּ/עַרְב֣וֹת יְרֵח֑וֹ וְ/כָל חֵיל֔/וֹ נָפֹ֖צוּ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
translation:
  language: hi
  text: लेकिन कसदियों[a] की सेना ने राजा का पीछा किया और यरीहो के मैदानों[b] में उसे जा पकड़ा। उसकी सारी सेना उसके पास से तितर-बितर हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेबीलोनियों।’ इब्रानी में ‘कसदियों’ है; इस प्रसंग में यह शब्द बेबीलोन की सेना के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यरीहो के स्तेपी प्रदेश में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  choice: कसदियों की सेना
  rationale: חֵיל सैन्य संदर्भ में ‘सेना’ है और כַּשְׂדִּים का सीधा जातीय-राजनीतिक नाम ‘कसदी’ है; ‘बेबीलोनियों की सेना’ अर्थ स्पष्ट करता, पर मूल पद से कम औपचारिक रूप से मेल खाता।
- source_word: וַיִּרְדְּפוּ ... אַחַר הַמֶּלֶךְ
  choice: राजा का पीछा किया
  rationale: हिन्दी में ‘का पीछा करना’ रדף + אַחַר की स्वाभाविक और अर्थनिष्ठ अभिव्यक्ति है।
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  choice: उसे जा पकड़ा
  rationale: נשׂג यहाँ पीछा करते हुए पहुँच जाने या पकड़ लेने का बोध देता है; ‘जा पकड़ा’ सैन्य पीछा की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  choice: यरीहो के मैदानों में
  rationale: עֲרָבוֹת खुले समतल या स्तेपी भूभाग को दर्शाता है; ‘मैदानों’ सामान्य पाठक के लिए स्पष्ट है और भौगोलिक अर्थ बनाए रखता है।
- source_word: וְכָל חֵילוֹ
  choice: उसकी सारी सेना
  rationale: כָל के साथ सामूहिक संज्ञा חֵיל को हिन्दी में ‘सारी सेना’ कहना सहज और निकट है।
- source_word: נָפֹצוּ מֵעָלָיו
  choice: उसके पास से तितर-बितर हो गई
  rationale: נפץ का निष्क्रिय/अकर्मक भाव बिखर जाने का है और מֵעָלָיו राजा से अलग हो जाने को सूचित करता है; यह अनुवाद दोनों बातों को स्पष्ट और स्वाभाविक रूप में रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘कसदी’ मूल जातीय-राजनीतिक पद को सुरक्षित रखता है, जबकि पादटिप्पणी सामान्यतः परिचित ‘बेबीलोनी’ विकल्प स्पष्ट करती है। ‘मैदानों’ को मुख्य पाठ में पठनीयता के लिए चुना गया है और अधिक तकनीकी भौगोलिक विकल्प पादटिप्पणी में दिया गया है।
