  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
translation:
  language: hi
  text: यहूदा की भूमि में जो लोग रह गए थे[a], जिन्हें बाबेल के राजा नबूकदनेस्सर ने छोड़ दिया था, उनका अधिकारी उसने अहीकाम के पुत्र, शापान के पोते गदल्याह को नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो छोड़ दिए गए थे”; इब्रानी कृदन्त का अनुवाद दोनों प्रकार से हो सकता है और यह निर्वासनों के बाद यहूदा में बचे लोगों को दर्शाता है।
    reason: lexical_alternative
