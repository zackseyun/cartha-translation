  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। ‘नगर’ ऐतिहासिक वर्णन के अनुकूल है; ‘बहुत भयंकर हो गया’ अकाल के तीव्र होने का स्वाभाविक हिन्दी रूप है। सभी टिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
