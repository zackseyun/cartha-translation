  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/תִשְׁעָ֣ה לַ/חֹ֔דֶשׁ וַ/יֶּחֱזַ֥ק הָ/רָעָ֖ב בָּ/עִ֑יר וְ/לֹא הָ֥יָה לֶ֖חֶם לְ/עַ֥ם הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
translation:
  language: hi
  text: महीने के नौवें दिन नगर में अकाल बहुत भयंकर हो गया, और देश के लोगों[b] के लिए रोटी[a] नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोजन’; यहाँ ‘रोटी’ शब्द व्यापक अर्थ में जीविका या खाने की वस्तुओं के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘देश के लोग’ पद कुछ संदर्भों में विशेष रूप से सामान्य जनता या स्थानीय जनसमुदाय को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  choice: महीने के नौवें दिन
  rationale: इब्रानी में शाब्दिक रूप से ‘महीने की नौवीं [तिथि] को’ है। स्वाभाविक और स्पष्ट हिन्दी के लिए ‘दिन’ जोड़ा गया है।
- source_word: וַיֶּחֱזַק
  choice: बहुत भयंकर हो गया
  rationale: חזק का मूल भाव ‘बलवान होना’ है; अकाल के संदर्भ में यह उसकी तीव्रता बढ़ने और विकट हो जाने को दर्शाता है।
- source_word: הָרָעָב
  choice: अकाल
  rationale: घेराबंदी के ऐतिहासिक संदर्भ में רָעָב केवल व्यक्तिगत भूख नहीं, बल्कि व्यापक खाद्य-संकट अर्थात अकाल को दर्शाता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह स्थानसूचक पद का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: וְלֹא הָיָה לֶחֶם
  choice: रोटी नहीं थी
  rationale: לֶחֶם का ठोस अर्थ ‘रोटी’ है, यद्यपि यह व्यापक अर्थ में भोजन का भी द्योतक हो सकता है; मुख्य पाठ स्रोत के ठोस शब्द को बनाए रखता है।
- source_word: לְעַם הָאָרֶץ
  choice: देश के लोगों के लिए
  rationale: यह पद शाब्दिक रूप से ‘देश/भूमि के लोगों’ को दर्शाता है। कुछ संदर्भों में इसका आशय सामान्य जनता या स्थानीय जनसमुदाय हो सकता है, इसलिए मुख्य पाठ व्यापक रूप रखता है और टिप्पणी में विकल्प बताता है।
