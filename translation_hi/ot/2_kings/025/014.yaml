base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
translation:
  language: hi
  text: और हंडियाँ, फावड़े, बत्ती काटने की कैंचियाँ[a], कटोरियाँ और काँसे के वे सभी पात्र, जिनसे सेवा की जाती थी—वे सब ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुरियाँ” अथवा “छाँटने की छुरियाँ”; इब्रानी शब्द किसी काटने के उपकरण का द्योतक हो सकता है, पर मंदिर के पात्रों के इस प्रसंग में इसे प्रायः दीपकों की बत्तियाँ काटने का उपकरण समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  choice: हंडियाँ
  rationale: सִירוֹת का सामान्य अर्थ पकाने या रखने के पात्र है। मंदिर की सामग्री की सूची में ‘हंडियाँ’ सहज और पर्याप्त रूप से व्यापक है।
- source_word: הַיָּעִים
  choice: फावड़े
  rationale: יָעִים राख या अंगारों को हटाने के काम आने वाले उपकरण थे; ‘फावड़े’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַמְזַמְּרוֹת
  choice: बत्ती काटने की कैंचियाँ
  rationale: यह शब्द काटने के उपकरण को सूचित कर सकता है, पर मंदिर के पात्रों की सूची में इसे सामान्यतः दीपकों की बत्तियाँ काटने के उपकरण के रूप में समझा जाता है। फुटनोट में वास्तविक शाब्दिक अनिश्चितता सुरक्षित रखी गई है।
- source_word: הַכַּפּוֹת
  choice: कटोरियाँ
  rationale: כַּף यहाँ छोटे कटोरे, तश्तरी या चम्मच-जैसे पात्र का द्योतक हो सकता है। ‘कटोरियाँ’ किसी अत्यधिक विशिष्ट आकार को थोपे बिना स्वाभाविक हिन्दी देता है।
- source_word: כָּל כְּלֵי הַנְּחֹשֶׁת
  choice: काँसे के वे सभी पात्र
  rationale: כְּלִים वस्तुओं, उपकरणों या पात्रों के लिए व्यापक शब्द है; मंदिर की सूची में ‘पात्र’ उपयुक्त है। נְחֹשֶׁת को इस संदर्भ में ‘काँसा’ कहना आधुनिक हिन्दी में धातु को ठीक प्रकार व्यक्त करता है।
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: जिनसे सेवा की जाती थी
  rationale: שרת का यहाँ मंदिर की धार्मिक सेवा से संबंध है। हिन्दी का कर्मवाच्य अनिर्दिष्ट बहुवचन कर्ता को अनावश्यक रूप से निश्चित किए बिना इस भाव को सहजता से व्यक्त करता है।
- source_word: לָקָחוּ
  choice: वे सब ले गए
  rationale: मूल क्रिया का अर्थ ‘उन्होंने लिया’ है; लूट और हटाकर ले जाने के प्रसंग में ‘ले गए’ स्वाभाविक है। ‘सब’ सूचीबद्ध वस्तुओं की समग्रता स्पष्ट करता है।
