base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
translation:
  language: hi
  text: और कसदियों[b] ने याहवे के भवन में स्थित काँसे के खम्भों, आधारों[a] और याहवे के भवन में स्थित काँसे का सागर तोड़ डाला, और उनका काँसा बाबेल को ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «आधारों» के स्थान पर «चौकियों» भी अनुवाद किया जा सकता है; ये मन्दिर के हौदों को थामने वाली संरचनाएँ थीं।
    reason: lexical_alternative
  - marker: b
    text: «कसदी» यहाँ बेबीलोन की सेना के लोगों को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  choice: काँसे के खम्भों
  rationale: עַמּוּדִים का अर्थ खम्भे है; נְחֹשֶׁת को मन्दिर की धातु-सामग्री के प्रसंग में स्वाभाविक आधुनिक हिन्दी 'काँसा' से व्यक्त किया गया है।
- source_word: אֲשֶׁר בֵּית יְהוָה
  choice: यहोवा के भवन में स्थित
  rationale: इब्रानी का क्रियारहित सम्बन्धवाचक वाक्यांश यहाँ स्थान सूचित करता है; 'में स्थित' इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמְּכֹנוֹת
  choice: चौकियों
  rationale: यह शब्द मन्दिर के हौदों को थामने वाली आधार-रचनाओं के लिए है। 'चौकियाँ' सामान्य पाठक के लिए ठोस और बोधगम्य है; 'आधार' भी सम्भव है।
- source_word: יָם הַנְּחֹשֶׁת
  choice: काँसे के सागर
  rationale: '''सागर'' मूल उपमा और मन्दिर के विशाल जलपात्र के विशिष्ट नाम को सुरक्षित रखता है; केवल ''हौद'' कहना अधिक व्याख्यात्मक होता।'
- source_word: שִׁבְּרוּ
  choice: तोड़ डाला
  rationale: क्रिया बड़े काँसे के उपकरणों को ढुलाई के लिए टुकड़ों में तोड़ने का भाव रखती है; 'तोड़ डाला' सहज हिन्दी में पूर्ण क्रिया को दर्शाता है।
- source_word: כַשְׂדִּים
  choice: कसदियों
  rationale: मूल में जातिवाचक नाम 'कसदी' है; इसे 'बेबीलोनी' बनाकर सामान्यीकृत नहीं किया गया।
- source_word: וַיִּשְׂאוּ
  choice: ले गए
  rationale: נשא यहाँ लूट की वस्तु उठाकर गन्तव्य तक ले जाने के अर्थ में है; हिन्दी में 'ले गए' स्वाभाविक है।
- source_word: נְחֻשְׁתָּם
  choice: उनका काँसा
  rationale: बहुवचन प्रत्यय पहले उल्लिखित काँसे की वस्तुओं को सामूहिक रूप से संदर्भित करता है।
- source_word: בָּבֶלָה
  choice: बाबेल
  rationale: दिशासूचक रूप का अर्थ 'बाबेल को/बाबेल ले गए' है; क्रिया के साथ गन्तव्य स्वाभाविक रूप से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश-नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से नहीं।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु; याहवे
  rationale: मूल पाठ व्यक्तिगत ईश-नाम का प्रयोग करता है। हिन्दी में प्रचलित नामरूप 'यहोवा' नाम और उपाधि का भेद बनाए रखता है; 'प्रभु' मूल के नाम को उपाधि में बदल देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। मन्दिर की विशिष्ट वस्तु के नाम के रूप में 'काँसे का सागर' बनाए रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
