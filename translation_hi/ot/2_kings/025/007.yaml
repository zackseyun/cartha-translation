  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
translation:
  language: hi
  text: उन्होंने सिदकिय्याह के बेटों का उसकी आँखों के सामने वध कर दिया, और उसने सिदकिय्याह की आँखें फोड़ दीं[a], उसे काँसे की बेड़ियों से बाँधा और बाबेल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिदकिय्याह को अंधा कर दिया।’ इब्रानी क्रिया का अर्थ ‘अंधा करना’ है; यहाँ आँखों के उल्लेख से संभवतः उन्हें फोड़ देने का शारीरिक कृत्य अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  choice: वध कर दिया
  rationale: यह क्रिया हिंसक ढंग से मार डालने या काटकर मारने का बोध देती है। ‘वध कर दिया’ उसकी क्रूरता और गरिमापूर्ण कथाशैली, दोनों को बनाए रखता है।
- source_word: לְעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: यह इब्रानी मुहावरा बताता है कि यह काम सिदकिय्याह के प्रत्यक्ष देखते हुए किया गया।
- source_word: עִוֵּר
  choice: आँखें फोड़ दीं
  rationale: क्रिया का मूल अर्थ ‘अंधा करना’ है, पर आँखों के स्पष्ट उल्लेख और हिंसक प्रसंग में यह अभिव्यक्ति शारीरिक कृत्य को स्वाभाविक हिंदी में प्रकट करती है।
- source_word: וַיַּאַסְרֵהוּ
  choice: उसे ... बाँधा
  rationale: क्रिया का सीधा अर्थ बाँधना है; बेड़ियों के उल्लेख के साथ यही प्रसंगानुकूल अर्थ है।
- source_word: בַנְחֻשְׁתַּיִם
  choice: काँसे की बेड़ियों से
  rationale: यह रूप धातु के बंधनों या बेड़ियों को दर्शाता है। ‘काँसे की बेड़ियाँ’ आधुनिक हिंदी में स्पष्ट और सटीक है।
- source_word: וַיְבִאֵהוּ בָּבֶל
  choice: बाबेल ले गया
  rationale: इब्रानी क्रिया ‘लाना/ले जाना’ का सामान्य अर्थ देती है; हिंदी कथन में गंतव्य की ओर गति के लिए ‘ले गया’ स्वाभाविक है।
- source_word: בְּנֵי צִדְקִיָּהוּ
  choice: सिदकिय्याह के बेटों
  rationale: संबंधवाचक इब्रानी रचना का यह सहज और स्पष्ट हिंदी रूप है।
theological_decisions:
- issue: बहुवचन से एकवचन कर्ता में परिवर्तन
  choice: ‘उन्होंने’ के बाद ‘उसने’
  alternative: सभी क्रियाओं के लिए एक ही बहुवचन कर्ता रखना
  rationale: इब्रानी पाठ में ‘वध किया’ बहुवचन है, जबकि ‘अंधा किया’, ‘बाँधा’ और ‘ले गया’ एकवचन हैं। हिंदी में इस बदलाव को बनाए रखना पाठ की व्याकरणिक और कथात्मक अस्पष्टता का सम्मान करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसा की तीव्रता को ‘वध’ और ‘आँखें फोड़ दीं’ से व्यक्त किया गया है। ‘बाबेल’ बाइबलीय स्थान-नाम के रूप में रखा गया है।
