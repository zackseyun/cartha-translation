base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
translation:
  language: hi
  text: एक खंभे की ऊँचाई अठारह हाथ थी, और उसके ऊपर काँसे का एक शीर्ष था। उस शीर्ष की ऊँचाई तीन हाथ थी। शीर्ष के चारों ओर जालीदार सजावट[a] और अनारों की आकृतियाँ थीं; यह सब काँसे का था। दूसरे खंभे पर भी जालीदार सजावट सहित ऐसी ही चीज़ें थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जालीनुमा बनावट’; इब्रानी शब्द जाल जैसी सजावटी संरचना को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अंतिम वाक्यांश संक्षिप्त है; शाब्दिक रूप से, “और ऐसी ही चीज़ें दूसरे खंभे के लिए जाली पर।” आशय संभवतः यह है कि दूसरे खंभे पर भी वैसी ही सजावट थी।
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  choice: ऊँचाई
  rationale: निर्माण-विवरण में यह शब्द किसी वस्तु की ऊर्ध्व माप को दर्शाता है; ‘ऊँचाई’ स्वाभाविक और सटीक है।
- source_word: עַמּוּד
  choice: खंभा
  rationale: मंदिर के विशाल स्तंभ के लिए ‘खंभा’ सामान्य आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: כֹתֶרֶת
  choice: शीर्ष
  rationale: यह खंभे के सजावटी ऊपरी भाग को दर्शाता है। ‘शीर्ष’ वास्तुशिल्पीय अर्थ को सामान्य पाठक के लिए समझने योग्य रखता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: प्राचीन मंदिर की धातु-सामग्री के संदर्भ में यह ताँबे या ताँबा-मिश्रित धातु को सूचित करता है; ‘काँसा’ प्रचलित बाइबलीय और ऐतिहासिक प्रतिशब्द है।
- source_word: שְׂבָכָה
  choice: जालीदार सजावट
  rationale: शब्द जाल जैसी सजावटी संरचना को दर्शाता है; यह रूप वस्तु और उसके अलंकरणात्मक कार्य दोनों को स्पष्ट करता है।
- source_word: רִמֹּנִים
  choice: अनार
  rationale: मूल शब्द का सीधा अर्थ ‘अनार’ है और यहाँ अनार के आकार के सजावटी रूप अभिप्रेत हैं; ‘बने थे’ प्रसंग में उनका अलंकरण होना स्पष्ट करता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह शीर्ष को घेरे हुए सजावट की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּל נְחֹשֶׁת
  choice: यह सब काँसे का था
  rationale: यह पूर्ववर्णित सजावटी तत्वों की सामग्री का सार प्रस्तुत करता है और मूल के सामूहिक कथन को बनाए रखता है।
- source_word: וְכָאֵלֶּה ... עַל הַשְּׂבָכָה
  choice: दूसरे खंभे पर भी जालीदार सजावट सहित ऐसी ही कारीगरी थी
  rationale: मूल का अंतिम वाक्यांश व्याकरणतः अपूर्ण/संक्षिप्त है। यह अनुवाद समान सजावट का आशय स्पष्ट करता है, जबकि टिप्पणी में शाब्दिक अस्पष्टता सुरक्षित रखी गई है।
