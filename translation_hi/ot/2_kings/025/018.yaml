source:
  edition: WLC
  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
translation:
  language: hi
  text: अंगरक्षक दल के प्रधान ने प्रधान याजक[a] सरायाह, दूसरे पद के याजक सपन्याह और देहरी के तीन पहरेदारों[b] को पकड़ लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महायाजक।” इब्रानी में शाब्दिक रूप से “याजक, प्रधान” है।
    reason: lexical_alternative
  - marker: b
    text: या “तीन द्वारपाल” अथवा “मंदिर के प्रवेश-द्वार के तीन पहरेदार।” इब्रानी में शाब्दिक रूप से “देहरी के पहरेदार” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  choice: अंगरक्षक दल का प्रधान
  rationale: शब्दशः पदवी में ‘वध करनेवालों का प्रधान’ का भाव है, पर राजकीय-सैनिक संदर्भ में यह राजा के अंगरक्षक दल के अधिकारी की पदवी है। यह हिंदी रूप पद के आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקַּח
  choice: पकड़ लिया
  rationale: לקח का सामान्य अर्थ ‘लेना’ है; यहाँ विजेता अधिकारी द्वारा याजकीय पदाधिकारियों को दंड के लिए अपने अधिकार में लेने का संदर्भ है। ‘पकड़ लिया’ उस प्रसंगगत बल को स्पष्ट करता है, बिना आगे की घटना को इस पद में जोड़ने के।
- source_word: כֹּהֵן הָרֹאשׁ
  choice: प्रधान याजक
  rationale: इब्रानी पदबंध का शाब्दिक भाव ‘याजक, अर्थात् प्रधान’ है। ‘प्रधान याजक’ उसकी संरचना और सर्वोच्च पद दोनों को बनाए रखता है; ‘महायाजक’ संभावित पारंपरिक विकल्प है।
- source_word: כֹּהֵן מִשְׁנֶה
  choice: दूसरे पद का याजक
  rationale: מִשְׁנֶה दूसरे क्रम या उप-पदाधिकारी का बोध कराता है। यह रूप पदानुक्रम को व्यक्त करता है और उसे केवल ‘दूसरा याजक’ समझे जाने से बचाता है।
- source_word: שֹׁמְרֵי הַסַּף
  choice: देहरी के पहरेदार
  rationale: यह इब्रानी अभिव्यक्ति के ठोस चित्र, ‘देहरी की रखवाली करनेवाले’, को बनाए रखता है। संदर्भ में ये मंदिर के प्रवेश-द्वार से जुड़े अधिकारी थे; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׁלֹשֶׁת
  choice: तीन
  rationale: यह संख्या ज्ञात पदाधिकारियों के समूह को सीधे और स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: इब्रानी नाम का हिंदी लिप्यंतरण।
- source_word: צְפַנְיָהוּ
  choice: सपन्याह
  rationale: इब्रानी नाम का हिंदी लिप्यंतरण; आरंभिक צְפ ध्वनि-समूह को प्रचलित हिंदी बाइबलीय रूप के निकट रखा गया है।
theological_decisions:
- issue: כֹּהֵן הָרֹאשׁ की पदवी
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: ‘प्रधान याजक’ मूल की ‘प्रधान/मुख्य याजक’ संरचना को निकटता से रखता है और बाद की पारिभाषिक धारणाओं को अनावश्यक रूप से आरोपित नहीं करता; वैध पारंपरिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय पदवी को शब्दशः हिंसक रूप में देने के बजाय उसके प्रसंगगत अर्थ से अनूदित किया गया है, जबकि याजकीय पदों और मंदिर-प्रवेश की पदवी में मूल की संरचना तथा संभावित अस्पष्टता को मुख्य पाठ और पादटिप्पणियों में बनाए रखा गया है।
