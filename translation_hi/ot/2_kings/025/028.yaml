  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
translation:
  language: hi
  text: उसने उससे कृपापूर्वक बातें कीं[a] और यहोयाकीन के सिंहासन को बाबेल में उन राजाओं के सिंहासनों से ऊँचा स्थान दिया जो उसके साथ थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उससे अच्छी बातें कीं”; यह एक मुहावरा है, जिसका अर्थ है कि उसने उससे अनुकूलता या कृपा के साथ बात की।
    reason: lexical_alternative
  - marker: b
    text: “सिंहासन” का अर्थ यहाँ “आसन” भी हो सकता है; भाव यह है कि यहोयाकीन को बाबेल में अन्य राजाओं से ऊँचा पद दिया गया। “उसके साथ” का संदर्भ मूल में स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתּוֹ טֹבוֹת
  choice: उसने उससे कृपापूर्वक बातें कीं
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उससे अच्छी बातें कीं’ है, पर प्रसंग में इसका आशय अनुकूलता और दयालुता से बात करना है। ‘कृपापूर्वक बातें कीं’ आधुनिक, स्वाभाविक हिन्दी में यही भाव व्यक्त करता है।
- source_word: וַיִּתֵּן אֶת כִּסְאוֹ
  choice: उसका सिंहासन ऊँचा रखा
  rationale: यहाँ נתן केवल कोई वस्तु देने के अर्थ में नहीं, बल्कि यहोयाकीन के आसन अथवा राजकीय पद को अन्य राजाओं से ऊँचा स्थान देने के अर्थ में है।
- source_word: כִּסְאוֹ
  choice: उसका सिंहासन
  rationale: כִּסֵּא का अर्थ ठोस रूप में ‘आसन’ भी हो सकता है, पर ‘सिंहासन’ राजकीय सम्मान और पद—दोनों को बनाए रखता है।
- source_word: מֵעַל כִּסֵּא הַמְּלָכִים
  choice: राजाओं के सिंहासनों से ... ऊँचा
  rationale: מֵעַל तुलना में ऊँचे स्थान या पद को दर्शाता है। हिन्दी में बहुवचन ‘सिंहासनों’ उन अनेक राजाओं के अलग-अलग सम्मानित आसनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: अपने साथ रहने वाले राजाओं
  rationale: सापेक्ष उपवाक्य उन राजाओं को बताता है जो बाबेल के राजा के साथ, अर्थात उसके दरबार में, उपस्थित थे। ‘अपने’ से कर्ता का संदर्भ हिन्दी में स्पष्ट रहता है।
- source_word: בְּבָבֶל
  choice: बाबेल में
  rationale: स्थानवाचक पद का मानक हिन्दी बाइबलीय रूप।
