translation:
  language: hi
  text: तब उन्होंने राजा को पकड़ लिया और उसे रिबला में बाबेल के राजा के पास ले गए, और उन्होंने उसके विरुद्ध निर्णय सुनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ
  choice: पकड़ लिया
  rationale: यह क्रिया भागते हुए राजा को सफलतापूर्वक बंदी बना लेने का भाव देती है; ‘पकड़ लिया’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा पहले से उल्लिखित सिदकिय्याह की ओर संकेत करती है; मूल की तरह यहाँ उसका नाम दोहराया नहीं गया।
- source_word: וַיַּעֲלוּ אֹתוֹ
  choice: उसे ... ले गए
  rationale: עלה का शाब्दिक दिशात्मक भाव ‘ऊपर ले गए’ हो सकता है, पर इस भूगोल में हिन्दी का ‘ऊपर’ भ्रामक या अस्वाभाविक होगा; ‘ले गए’ गति और कारणवाचक अर्थ को स्पष्ट रखता है।
- source_word: אֶל מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा के पास
  rationale: אֶל का सीधा अर्थ ‘की ओर/के पास’ है; ‘के सामने’ की अपेक्षा यह कम व्याख्यात्मक है।
- source_word: רִבְלָתָה
  choice: रिबला में
  rationale: स्थाननाम पर दिशासूचक ה गति को रिबला की ओर दिखा सकता है, लेकिन पूरे वाक्य में रिबला बाबेल के राजा से भेंट और न्याय का स्थान है; स्वाभाविक हिन्दी में ‘रिबला में’ उपयुक्त है।
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  choice: उस पर न्याय-दण्ड सुनाया
  rationale: शाब्दिक रूप ‘उसके साथ न्याय की बातें कीं’ एक न्यायिक मुहावरा है। ‘न्याय-दण्ड सुनाया’ उसके विधिक निर्णय और दण्डादेश के भाव को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
