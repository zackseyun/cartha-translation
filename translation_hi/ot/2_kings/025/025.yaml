  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
translation:
  language: hi
  text: सातवें महीने में ऐसा हुआ कि नतन्याह का पुत्र, एलीशामा का पोता इश्माएल, जो राजवंश का था[a], दस पुरुषों के साथ आया। उन्होंने गदल्याह पर प्रहार किया और वह मर गया। उन्होंने यहूदा के लोगों और कसदियों[b] पर भी प्रहार किया, जो उसके साथ मिस्पा में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजकीय वंश के बीज में से,” अर्थात वह राजघराने का वंशज था।
    reason: lexical_alternative
  - marker: b
    text: “कसदियों” का अनुवाद इस प्रसंग में “बाबुलियों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ
  rationale: यह इब्रानी कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना पुरातन शैली अपनाए।
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने में
  rationale: काल-सूचक इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה בֶּן אֱלִישָׁמָע
  choice: एलीशामा का पोता और नतन्याह का पुत्र इश्माएल
  rationale: वंशावली संबंधों को हिन्दी में स्पष्ट और स्वाभाविक क्रम में व्यक्त करता है; मूल में दोनों בֶּן संबंध सुरक्षित रहते हैं।
- source_word: מִזֶּרַע הַמְּלוּכָה
  choice: जो राजवंश का था
  rationale: इसका आशय राजकीय वंश से उत्पत्ति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल के शाब्दिक रूप को पादटिप्पणी में बताया गया है।
- source_word: וַעֲשָׂרָה אֲנָשִׁים אִתּוֹ
  choice: दस पुरुषों के साथ
  rationale: साथ आए दल को हिन्दी के स्वाभाविक पदक्रम में व्यक्त करता है।
- source_word: וַיַּכּוּ
  choice: उन्होंने ... पर प्रहार किया
  rationale: נכה की हिंसक क्रिया को सुरक्षित रखता है और गदल्याह की मृत्यु बताने वाले अगले स्वतंत्र खंड को ‘मार डाला’ में विलीन नहीं करता।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: एकवचन क्रिया का स्वाभाविक संदर्भ गदल्याह है; अनुवाद इब्रानी की क्रमिक अभिव्यक्ति और स्वतंत्र मृत्यु-वचन को बनाए रखता है।
- source_word: הַיְּהוּדִים
  choice: यहूदा के लोग
  rationale: राजतंत्रीय और निर्वासनकालीन संदर्भ में यह जातीय-भौगोलिक अर्थ को आधुनिक ‘यहूदी’ की अपेक्षा अधिक स्पष्ट करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदी
  rationale: इब्रानी जातिनाम का निकट और हिन्दी बाइबलीय परंपरा में परिचित रूप; प्रसंगगत ‘बाबुली’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: नामित स्थान के लिए हिन्दी का स्वाभाविक अधिकरण रूप।
theological_decisions:
- issue: וַיַּכּוּ ... וַיָּמֹת में प्रहार और मृत्यु का संबंध
  choice: उन्होंने गदल्याह पर प्रहार किया और वह मर गया
  alternative: उन्होंने गदल्याह को मार डाला
  rationale: चुना गया रूप मूल की दो पृथक क्रियाओं को बनाए रखता है और कारण-परिणाम संबंध को मूल से अधिक स्पष्ट करके नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। लंबे इब्रानी वाक्य को तीन हिन्दी वाक्यों में बाँटा गया है, पर घटनाक्रम, वंश-सूचना और सभी कर्म सुरक्षित हैं।
