lexical_decisions:
- source_word: הַמַּחְתּוֹת
  choice: अंगारदानों
  rationale: यह शब्द मंदिर की सेवा में अंगारे अथवा धूप ले जाने के पात्र को दर्शाता है। ‘अंगारदान’ वस्तु के मूल उपयोग को स्पष्ट करता है, पर उसे केवल धूप जलाने का पात्र नहीं ठहराता।
- source_word: הַמִּזְרָקוֹת
  choice: कटोरों
  rationale: यह बलिदान-संबंधी द्रव रखने या छिड़कने के पात्रों के लिए प्रयुक्त होता है। ‘कटोरे’ आधुनिक हिन्दी में सहज है; ‘तसले’ भी संभव है।
- source_word: אֲשֶׁר זָהָב זָהָב / וַאֲשֶׁר כֶּסֶף כָּסֶף
  choice: जो सोने के थे, सोने के, और जो चाँदी के थे, चाँदी के
  rationale: सामग्री के आधार पर वर्गीकरण पर बल देने वाली इब्रानी पुनरुक्ति को जानबूझकर सुरक्षित रखा गया है।
- source_word: לָקַח
  choice: ले लिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है। लूट का संदर्भ वाक्य-परिवेश से स्पष्ट होता है, इसलिए ‘लूटकर ले गया’ जैसी व्याख्यात्मक वृद्धि नहीं की गई।
- source_word: רַב טַבָּחִים
  choice: राज-अंगरक्षक दल के प्रधान
  rationale: यह बाबेली राजकीय अधिकारी की पदवी है। शब्दसमूह का शाब्दिक संबंध वध करने वालों से है, पर प्रसंग में यह राजकीय अंगरक्षक अथवा दंडाधिकारी दल के प्रधान को सूचित करता है।
