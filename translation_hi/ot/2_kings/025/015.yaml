  text: और अंगारदानों[a] और कटोरों[b] को—जो सोने के थे, वे सोने के, और जो चाँदी के थे, वे चाँदी के[c]—शाही अंगरक्षक दल के प्रधान[d] ने ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धूपदानों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘तसलों’।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में सामग्री बताने वाले शब्द दोहराए गए हैं: ‘जो सोना था, सोना; और जो चाँदी थी, चाँदी।’ यह वस्तुओं को उनकी सामग्री के अनुसार अलग-अलग बताने पर बल देता है।'
