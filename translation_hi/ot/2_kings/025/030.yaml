  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
translation:
  language: hi
  text: और उसके लिए निर्धारित प्रबंध—निरंतर प्रबंध—राजा की ओर से उसे दिया जाता रहा; हर दिन के लिए उसका भाग उसी दिन दिया जाता रहा, उसके जीवन भर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  choice: भत्ता
  rationale: यह शब्द यहोयाकीन के लिए राजा द्वारा निर्धारित और लगातार दी जाने वाली सामग्री या खुराक को दर्शाता है। ‘भत्ता’ नियमित रूप से दिए जाने वाले निर्धारित प्रबंध का भाव संक्षेप में व्यक्त करता है; फुटनोट में इसके अधिक ठोस विकल्प दिए गए हैं।
- source_word: תָּמִיד
  choice: निरंतर
  rationale: यह भत्ते के लगातार और स्थायी रूप से मिलते रहने का भाव रखता है और मूल पाठ की पुनरुक्ति को बनाए रखता है।
- source_word: נִתְּנָה
  choice: दिया जाता रहा
  rationale: मूल निष्क्रिय क्रिया ‘दिया गया’ है, पर תָּמִיד और जीवन भर की अवधि के संदर्भ में हिंदी का अपूर्णतासूचक रूप नियमित रूप से जारी क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאֵת הַמֶּלֶךְ
  choice: राजा की ओर से
  rationale: यह अभिव्यक्ति प्रबंध के स्रोत को दर्शाती है और मूल के ‘राजा से’ वाले भाव को स्वाभाविक हिंदी में रखती है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन का भाग उसी दिन
  rationale: 'यह इब्रानी मुहावरे की वितरणात्मक संरचना को बनाए रखता है: प्रत्येक दिन के लिए निर्धारित सामग्री उसी दिन दी जाती थी।'
- source_word: כֹּל יְמֵי חַיָּו
  choice: उसके जीवन के सभी दिनों तक
  rationale: यह जीवन भर की अवधि को मूल अभिव्यक्ति के निकट रहते हुए स्पष्ट करता है।
