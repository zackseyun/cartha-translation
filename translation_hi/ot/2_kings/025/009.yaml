  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
translation:
  language: hi
  text: उसने यहोवा के भवन[a], राजमहल, यरूशलेम के सभी घरों और हर बड़े भवन[b] को आग में जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा का मन्दिर।” इब्रानी में शाब्दिक अर्थ “यहोवा का भवन” है।
    reason: lexical_alternative
  - marker: b
    text: या “हर विशाल भवन” अथवा “हर प्रमुख भवन।” इब्रानी अभिव्यक्ति आकार या महत्त्व में उल्लेखनीय भवनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  choice: उसने ... जला दिया
  rationale: क़ाल वय्यिक्तोल कथानक की अगली पूर्ण कार्रवाई बताता है। हिन्दी में ‘जला दिया’ स्वाभाविक रूप से क्रिया की पूर्णता व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: यह इब्रानी पदबंध का निकट और स्पष्ट अनुवाद है तथा ‘मन्दिर’ की अपेक्षा मूल रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, पर इस प्रसंग में राजा के निवास-भवन के लिए ‘राजमहल’ अधिक स्वाभाविक और स्पष्ट आधुनिक हिन्दी है।
- source_word: כָּל בָּתֵּי יְרוּשָׁלִַם
  choice: यरूशलेम के सभी घर
  rationale: रचना-संबंधी इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כָּל בֵּית גָּדוֹל
  choice: हर बड़ा भवन
  rationale: כָּל के बाद एकवचन को वितरणार्थक ‘हर’ से व्यक्त किया गया है। ‘बड़ा’ आकार और महत्त्व, दोनों की सम्भावना खुली रखता है; टिप्पणी में इस अस्पष्टता को स्पष्ट किया गया है।
- source_word: שָׂרַף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: अन्तिम इब्रानी क्रिया और पूर्वसर्गीय पद आग द्वारा विनाश पर बल देते हैं। हिन्दी में एक ही क्रियात्मक विधान के भीतर इसे स्वाभाविक ढंग से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: यहाँ मूल पाठ में चतुरक्षरीय विशिष्ट नाम प्रत्यक्ष है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-परम्परा में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है, जबकि राजा के निवास के लिए स्वाभाविक हिन्दी ‘राजमहल’ चुना गया है।
