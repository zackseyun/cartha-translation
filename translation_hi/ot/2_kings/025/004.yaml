base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
translation:
  language: hi
  text: तब नगर की दीवार में सेंध लग गई, और सभी योद्धा रात को उस फाटक के रास्ते निकल गए जो दोनों दीवारों के बीच, राजा के बगीचे के पास था। उस समय कसदी[a] नगर को चारों ओर से घेरे हुए थे। फिर राजा[b] अराबा[c] के रास्ते चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबुली”; इब्रानी में विशेष रूप से “कसदी” है।
    reason: lexical_alternative
  - marker: b
    text: या “वह”; इब्रानी में कर्ता स्पष्ट नहीं किया गया है, पर प्रसंग से राजा अभिप्रेत है।
    reason: textual_clarity
  - marker: c
    text: अराबा यरदन घाटी से दक्षिण की ओर फैला भूभाग है; परंपरागत रूप से इसका अनुवाद “मैदान” भी किया जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע הָעִיר
  choice: नगर की दीवार में सेंध लग गई
  rationale: इब्रानी में शाब्दिक रूप से नगर के फटने का वर्णन है; घेराबंदी के प्रसंग में इसका आशय नगर की सुरक्षा-दीवार में सेंध लगने से है। हिंदी में यह सैन्य अर्थ स्वाभाविक ढंग से व्यक्त होता है।
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धा
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुष’ है। ‘योद्धा’ संक्षिप्त, गरिमापूर्ण और सामान्य हिंदी में बोधगम्य है।
- source_word: הַלַּיְלָה
  choice: रात को
  rationale: यहाँ पद क्रियाविशेषण की तरह प्रयुक्त हुआ है; ‘रात को’ स्वाभाविक आधुनिक हिंदी है।
- source_word: דֶּרֶךְ שַׁעַר בֵּין הַחֹמֹתַיִם
  choice: उस फाटक के रास्ते ... जो दोनों दीवारों के बीच ... था
  rationale: דֶּרֶךְ मार्ग को सूचित करता है और द्विवचन הַחֹמֹתַיִם स्पष्ट रूप से दो दीवारें बताता है।
- source_word: גַּן הַמֶּלֶךְ
  choice: राजा की बारी
  rationale: גַּן बगीचे या उद्यान को सूचित करता है। ‘बारी’ बाइबलीय हिंदी में परिचित और यहाँ राजकीय घेरे/उद्यान के लिए उपयुक्त है।
- source_word: וְכַשְׂדִּים
  choice: कसदी
  rationale: मूल पाठ जातीय-ऐतिहासिक नाम ‘कसदी’ देता है; इसे व्यापक किंतु कम सटीक ‘बाबुली’ से नहीं बदला गया।
- source_word: עַל הָעִיר סָבִיב
  choice: नगर को चारों ओर से घेरे हुए थे
  rationale: यह अभिव्यक्ति नगर के चारों ओर सैन्य घेराव को स्वाभाविक हिंदी में स्पष्ट करती है।
- source_word: וַיֵּלֶךְ
  choice: फिर राजा चला गया
  rationale: इब्रानी क्रिया का कर्ता अंतर्निहित है। प्रसंग राजा को कर्ता बताता है, पर इस पाठगत पूर्ति को पादटिप्पणी में पारदर्शी बनाया गया है।
- source_word: דֶּרֶךְ הָעֲרָבָה
  choice: अराबा के रास्ते
  rationale: עֲרָבָה भौगोलिक प्रदेश का नाम है; लाक्षणिक ‘मैदान’ के बजाय स्थान-नाम को सुरक्षित रखा गया है।
theological_decisions:
- issue: וַיֵּלֶךְ का अंतर्निहित कर्ता
  choice: मुख्य पाठ में ‘राजा’
  alternative: ‘वह’
  rationale: प्रसंगानुसार राजा अभिप्रेत है, लेकिन इब्रानी में संज्ञा स्पष्ट रूप से दोहराई नहीं गई; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली रखी गई है। सैन्य और स्थलाकृतिक विवरण स्पष्ट किए गए हैं, पर मूल की अंतर्निहित कर्ता-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित है।
