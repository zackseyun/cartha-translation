  edition: WLC
  text: וַ/יִּקַּ֣ח אֹתָ֔/ם נְבוּזַרְאֲדָ֖ן רַב טַבָּחִ֑ים וַ/יֹּ֧לֶךְ אֹתָ֛/ם עַל מֶ֥לֶךְ בָּבֶ֖ל רִבְלָֽתָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
translation:
  language: hi
  text: तब अंगरक्षकों के प्रधान[a] नबूजरदान ने उन्हें ले लिया और रिबला में बाबेल के राजा के पास[b] ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, ‘वध करनेवालों का प्रधान’; सम्भवतः राजकीय सुरक्षा या सैन्य पदवी, जिसका पारंपरिक अनुवाद ‘अंगरक्षकों का प्रधान’ है।
    reason: cultural_note
  - marker: b
    text: या, ‘बाबेल के राजा के सामने’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: पकड़ लिया
  rationale: इस प्रसंग में वे लोग पहले से बंदी हैं; इसलिए यह पद उन्हें अपने अधिकार में लेने का भाव देता है। ‘पकड़ लिया’ सहज हिन्दी है और ‘बंदी बना लिया’ जैसी अनावश्यक पुनरुक्ति से बचता है।
- source_word: נְבוּזַרְאֲדָן
  choice: नबूजरदान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान[a]
  rationale: शाब्दिक रूप से पदवी ‘वध करनेवालों/जल्लादों के प्रधान’ है, पर नव-बेबीलोनी राजकीय संदर्भ में यह सेना अथवा राजकीय सुरक्षा के एक उच्च अधिकारी की पदवी जान पड़ती है। ‘अंगरक्षकों के प्रधान’ पद का कार्य स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיֹּלֶךְ
  choice: ले गया
  rationale: हिफ़ील रूप यहाँ उन्हें किसी गंतव्य या व्यक्ति की उपस्थिति में पहुँचाने का अर्थ देता है; हिन्दी में ‘ले गया’ सबसे स्वाभाविक है।
- source_word: עַל
  choice: के पास
  rationale: गति-सूचक क्रिया के साथ यह राजा की उपस्थिति तक ले जाने का भाव देता है। ‘के सामने’ भी संभव है और उसे पाद-टिप्पणी में रखा गया है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा
  rationale: इब्रानी संबंध-रचना का सीधा और प्रचलित हिन्दी अनुवाद।
- source_word: רִבְלָתָה
  choice: रिबला में
  rationale: दिशा/स्थान सूचक रूप पूरे वाक्य में उस स्थान को बताता है जहाँ बाबेल का राजा था; इसलिए ‘रिबला में’ स्पष्ट और स्वाभाविक है।
