  to: उन दो स्तम्भों, उस एक सागर और उन आधारों के लिए, जिन्हें सुलैमान ने यहोवा के भवन के लिए बनाए थे, इन सब वस्तुओं के काँसे का कोई तौल नहीं हुआ था।[a]
