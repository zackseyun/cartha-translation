  text: הָ/עַמּוּדִ֣ים שְׁנַ֗יִם הַ/יָּ֤ם הָֽ/אֶחָד֙ וְ/הַ/מְּכֹנ֔וֹת אֲשֶׁר עָשָׂ֥ה שְׁלֹמֹ֖ה לְ/בֵ֣ית יְהוָ֑ה לֹא הָיָ֣ה מִשְׁקָ֔ל לִ/נְחֹ֖שֶׁת כָּל הַ/כֵּלִ֥ים הָ/אֵֽלֶּה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/016.yaml
  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
translation:
  language: hi
  text: उन दो स्तम्भों, उस एक सागर और उन आधारों के लिए, जिन्हें सुलैमान ने यहोवा के भवन के लिए बनाए थे, इन सब वस्तुओं के काँसे का कोई तौल नहीं हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सब वस्तुओं के काँसे का भार नहीं था,” अर्थात् काँसा इतनी अधिक मात्रा में था कि उसे तौला नहीं गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  choice: उन दो खम्भों
  rationale: עַמּוּדִים मन्दिर के दो बड़े संरचनात्मक स्तम्भों को दर्शाता है; ‘खम्भे’ आधुनिक हिन्दी में सहज और ठोस है।
- source_word: הַיָּם הָאֶחָד
  choice: उस एक ‘सागर’
  rationale: יָם यहाँ सामान्य समुद्र नहीं, मन्दिर के विशाल काँसे के हौद का पारिभाषिक नाम है; उद्धरण-चिह्न नामसूचक प्रयोग स्पष्ट करते हैं।
- source_word: וְהַמְּכֹנוֹת
  choice: उन चौकियों
  rationale: מְכֹנוֹת उन आधारदार चौकियों को सूचित करता है जिन पर हौद रखे जाते थे; ‘चौकियाँ’ ‘आधारों’ की अपेक्षा वस्तु का अधिक स्पष्ट चित्र देती हैं।
- source_word: אֲשֶׁר עָשָׂה שְׁלֹמֹה
  choice: जिन्हें सुलैमान ने ... बनवाया था
  rationale: राजकीय निर्माण के सन्दर्भ में कारक अर्थ वाला ‘बनवाया’ स्वाभाविक है, जबकि पूर्वकालिकता ‘था’ से व्यक्त होती है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन के लिए
  rationale: בֵּית का औपचारिक समतुल्य ‘भवन’ रखा गया है और יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में लिप्यन्तरित किया गया है।
- source_word: לֹא הָיָה מִשְׁקָל
  choice: भार नहीं तौला जा सकता था
  rationale: मुहावरे का प्रसंगगत आशय काँसे की अत्यधिक मात्रा के कारण उसके भार का हिसाब न हो पाना है; पाद-टिप्पणी अधिक शाब्दिक सम्भावना सुरक्षित रखती है।
- source_word: לִנְחֹשֶׁת
  choice: काँसे का
  rationale: נְחֹשֶׁת मन्दिर की धातु-वस्तुओं के सन्दर्भ में मानक रूप से काँसा है।
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  choice: इन सब वस्तुओं
  rationale: כֵּלִים यहाँ केवल पात्र नहीं, खम्भे, सागर और चौकियाँ जैसी विविध निर्मित वस्तुओं को समेटता है; इसलिए ‘वस्तुओं’ व्यापक और सही है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-नाम सीधे आया है; हिन्दी पाठकों में सुस्थापित नामरूप ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए प्रस्तुत करता है।
- issue: לֹא הָיָה מִשְׁקָל में मात्रा और तौल का सम्बन्ध
  choice: भार नहीं तौला जा सकता था
  alternative: उस काँसे का कोई भार नहीं था / काँसा तौला नहीं गया था
  rationale: सन्दर्भ अत्यधिक मात्रा के कारण तौल के व्यावहारिक रूप से असम्भव या अनुपयुक्त होने की ओर संकेत करता है; फिर भी इब्रानी की संक्षिप्त अभिव्यक्ति की दूसरी सम्भावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सागर’ को नामसूचक उद्धरण-चिह्नों में रखा गया है, और तकनीकी मन्दिर-सामग्री के लिए ‘चौकियाँ’ चुना गया है।
