  rationale: यह नगर को घेरे हुए शहरपनाह के पूरे विस्तार को व्यक्त करता है।
- source_word: נָתְצוּ
  choice: ढा दिया
  rationale: נתץ किसी संरचना को तोड़कर गिराने या ध्वस्त करने का बोध देता है; ‘ढा दिया’ वर्तमान हिंदी में स्वाभाविक और सजीव है।
- source_word: כָּל חֵיל
  choice: सारी सेना
  rationale: כָּל सामूहिक सैन्य बल की समग्रता बताता है और חֵיל यहाँ सेना या सैन्य दल को सूचित करता है।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: मूल पाठ के जातिनाम का सीधा और पारंपरिक हिंदी रूप; ‘बाबेलवासी’ संदर्भतः संभव है, पर कम प्रत्यक्ष है।
- source_word: אֲשֶׁר
  choice: जो ... के साथ थी
  rationale: संबंधवाचक पद यहाँ सेना और अगले पदाधिकारी के बीच निहित संबंध जोड़ता है; ‘के साथ थी’ उस संबंध को बिना अनावश्यक रूप से अधीनता तय किए स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רַב טַבָּחִים
  choice: अंगरक्षकों के प्रधान
  rationale: राजकीय-सैनिक पदवी के रूप में यह उच्च अधिकारी को दर्शाती है। ‘अंगरक्षकों के प्रधान’ प्रसंगानुकूल है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
