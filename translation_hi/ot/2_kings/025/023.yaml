  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
translation:
  language: hi
  text: 'जब सभी सैन्य-दलों के प्रधानों ने—उन्होंने और उनके आदमियों ने—सुना कि बाबेल के राजा ने गदल्याह को नियुक्त किया था,[a] तब वे मिस्पा में गदल्याह के पास आए: नतन्याह का पुत्र इश्माएल, कारेह का पुत्र योहानान, नतोपावासी तन्हूमेत का पुत्र सरायाह, और माकावासी का पुत्र याजन्याह—वे और उनके आदमी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गदल्याह को दायित्व सौंपा था”; इब्रानी क्रिया किसी को देखरेख या प्रशासन के कार्य के लिए नियुक्त करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  choice: सेना के सभी प्रधानों
  rationale: שָׂרֵי नेतृत्व या अधिकारी पद को और הַחֲיָלִים यहाँ सैन्य दलों को दर्शाता है। ‘सेना के प्रधान’ पद का अनावश्यक रूप से निश्चित सैन्य दर्जा बताए बिना अर्थ स्पष्ट करता है।
- source_word: הֵמָּה וְהָאֲנָשִׁים
  choice: उन्होंने और उनके आदमियों ने
  rationale: यह पुनरुक्तिपरक और बलसूचक रचना प्रधानों तथा उनके साथ के लोगों को अलग-अलग सामने रखती है। सैन्य प्रसंग में ‘उनके आदमी’ सहज है, पर उन्हें अनिवार्यतः औपचारिक सैनिक नहीं ठहराता।
- source_word: הִפְקִיד
  choice: अधिकारी ठहराया है
  rationale: क्रिया किसी को देखरेख, प्रशासन या दायित्व पर नियुक्त करने का अर्थ दे सकती है। यह अनुवाद अधिकार-सौंपे जाने को व्यक्त करता है, पर पद को ‘राज्यपाल’ के रूप में अधिक निश्चित नहीं करता।
- source_word: אֶל גְּדַלְיָהוּ הַמִּצְפָּה
  choice: मिस्पा में गदल्याह के पास
  rationale: स्थानवाचक הַמִּצְפָּה बताता है कि गदल्याह मिस्पा में था; हिंदी में यह क्रम स्वाभाविक और स्पष्ट है।
- source_word: הַנְּטֹפָתִי
  choice: नतोपावासी
  rationale: यह भौगोलिक/जातिवाचक विशेषण नतोपा से संबंध बताता है; ‘नतोपावासी’ आधुनिक हिंदी में अर्थ को स्पष्ट रखता है।
- source_word: הַמַּעֲכָתִי
  choice: माकावासी
  rationale: यह माका से संबंध बताने वाला विशेषण है। ‘माकावासी’ स्रोत की भौगोलिक पहचान को सुरक्षित रखता है।
- source_word: וַיָּבֹאוּ ... וְיִשְׁמָעֵאל ... וְיוֹחָנָן ...
  choice: 'तब वे ... आए: ... इश्माएल, ... योहानान, ... सरायाह, और ... याजन्याह'
  rationale: नाम ‘वे’ के स्पष्टीकरण में समानाधिकरण सूची हैं। विसर्ग सूची-संबंध को हिंदी में साफ़ करता है और इब्रानी वाक्य की पुनरुक्ति बनाए रखता है।
- source_word: וְאַנְשֵׁיהֶם
  choice: वे और उनके आदमी
  rationale: समापन पद नामित प्रधानों के साथ उनके लोगों को फिर सम्मिलित करता है। स्रोत की बलसूचक पुनरावृत्ति को बनाए रखा गया है।
theological_decisions:
- issue: गदल्याह के पद की सटीक उपाधि
  choice: अधिकारी ठहराया
  alternative: राज्यपाल बनाया
  rationale: इब्रानी הִפְקִיד नियुक्ति या देखरेख का दायित्व देने को व्यक्त करता है, पर इसी पद में औपचारिक उपाधि ‘राज्यपाल’ स्पष्ट नहीं है; इसलिए व्यापक अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कथात्मक शैली रखी गई है। नामों और स्थानों के प्रचलित हिंदी बाइबिलीय लिप्यंतरण के निकट रूप अपनाए गए हैं। स्रोत की असामान्य बलसूचक पुनरावृत्ति—‘उन्होंने और उनके आदमियों ने’ तथा अंत में ‘वे और उनके आदमी’—को अर्थगत कारण से सुरक्षित रखा गया है।
