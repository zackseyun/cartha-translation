id: 2KI.25.27
reference: 2 Kings 25:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
translation:
  language: hi
  text: यहूदा के राजा यहोयाकीन के निर्वासन के सैंतीसवें वर्ष में, बारहवें महीने के सत्ताईसवें दिन, बाबेल के राजा एवील-मरोदक[b] ने अपने राज्य के वर्ष[c] में यहूदा के राजा यहोयाकीन को कारागार से निकालकर उसका सिर ऊँचा किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सिर ऊँचा किया” इब्रानी मुहावरा है। यहाँ इसका अर्थ यहोयाकीन को कारागार से मुक्त करके उस पर कृपा करना और उसका पद ऊँचा करना है।
    reason: lexical_alternative
  - marker: b
    text: एवील-मरोदक को इतिहास में अमेल-मर्दुक के नाम से भी जाना जाता है।
    reason: cultural_note
  - marker: c
    text: “अपने राज्य के वर्ष में” का अर्थ संभवतः “अपने राज्य के पहले वर्ष में” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: में ... किया
  rationale: इब्रानी कथात्मक आरंभ को हिन्दी की स्वाभाविक काल-सूचक वाक्य-रचना में समाहित किया गया है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक रूप से भारी होता।
- source_word: לְגָלוּת
  choice: निर्वासन के
  rationale: גָּלוּת देश से निकाले जाने के फलस्वरूप निर्वासन की दशा को दर्शाता है; ‘निर्वासन’ आधुनिक मानक हिन्दी में स्पष्ट और उपयुक्त है।
- source_word: יְהוֹיָכִין
  choice: यहोयाकीन
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בִּשְׁנֵים עָשָׂר חֹדֶשׁ
  choice: बारहवें महीने में
  rationale: इब्रानी तिथि-सूत्र का स्वाभाविक हिन्दी रूप।
- source_word: בְּעֶשְׂרִים וְשִׁבְעָה לַחֹדֶשׁ
  choice: महीने के सत्ताईसवें दिन
  rationale: तिथि को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱוִיל מְרֹדַךְ
  choice: एवील-मरोदक
  rationale: इब्रानी रूप के निकट और हिन्दी बाइबलीय परंपरा से संगत लिप्यंतरण; ऐतिहासिक अक्कादी नाम पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁנַת מָלְכוֹ
  choice: अपने राज्य के वर्ष में
  rationale: मूल पदबंध केवल उसके शासन/राज्य के वर्ष का उल्लेख करता है; मुख्य पाठ में ‘पहले वर्ष’ जोड़कर संभावित अर्थ को निश्चित नहीं किया गया।
- source_word: נָשָׂא ... אֶת רֹאשׁ
  choice: उसका सिर ऊँचा किया
  rationale: इब्रानी मुहावरे की सजीव छवि को बनाए रखता है; संदर्भगत अर्थ—सम्मान या कृपा देकर पद ऊँचा करना—पादटिप्पणी में स्पष्ट है।
- source_word: מִבֵּית כֶּלֶא
  choice: कारागार से निकालकर
  rationale: בֵּית כֶּלֶא बंदीगृह है। हिन्दी में ‘से निकालकर’ इस प्रसंग में मुक्ति की क्रिया और मुहावरे के संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: בִּשְׁנַת מָלְכוֹ में राज्य-वर्ष की संख्या
  choice: अपने राज्य के वर्ष में
  alternative: अपने राज्य के पहले वर्ष में
  rationale: ‘पहले’ ऐतिहासिक और प्रसंगगत रूप से संभावित है, पर इब्रानी मूल में संख्या स्पष्ट रूप से नहीं दी गई; इसलिए अस्पष्टता मुख्य पाठ में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। तिथि-सूत्र को स्वाभाविक हिन्दी क्रम में रखा गया, जबकि ‘सिर ऊँचा किया’ मुहावरे को मूल की साहित्यिक छवि बचाने के लिए बनाए रखा गया है।
