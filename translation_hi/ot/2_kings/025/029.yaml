  text: וְ/שִׁנָּ֕א אֵ֖ת בִּגְדֵ֣י כִלְא֑/וֹ וְ/אָכַ֨ל לֶ֧חֶם תָּמִ֛יד לְ/פָנָ֖י/ו כָּל יְמֵ֥י חַיָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
translation:
  language: hi
  text: उसने अपने कारावास के वस्त्र बदल लिए और वह जीवन भर निरंतर राजा के सामने[a] भोजन करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी उपस्थिति में’; इस वाक्यांश से राजा की मेज़ पर भोजन करने का आशय भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  choice: उसने...बदल दिए
  rationale: पिएल रूप यहाँ कपड़ों को बदलने, अर्थात कैद के वस्त्र उतारकर दूसरे वस्त्र पहनने, का अर्थ देता है। हिंदी में यह स्वाभाविक और स्रोत के निकट है।
- source_word: בִּגְדֵי כִלְאוֹ
  choice: अपने कैद के कपड़े
  rationale: यह पदबंध शाब्दिक रूप से उसकी कैद/बंदी अवस्था के वस्त्रों को दर्शाता है। ‘कैद के कपड़े’ साधारण आधुनिक हिंदी में स्पष्ट है।
- source_word: וְאָכַל לֶחֶם
  choice: भोजन करता रहा
  rationale: शाब्दिक ‘रोटी खाता रहा’ के बजाय हिंदी मुहावरे में यहाँ नियमित राजकीय भोजन का सामान्य अर्थ ‘भोजन करता रहा’ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָּמִיד
  choice: नियमित रूप से
  rationale: यह निरंतरता के साथ नियमित आवृत्ति भी व्यक्त करता है; दरबार में प्रतिदिन भोजन करने के संदर्भ में ‘नियमित रूप से’ उपयुक्त है।
- source_word: לְפָנָיו
  choice: राजा के सामने
  rationale: शाब्दिक अर्थ ‘उसके सामने’ है। पूर्वपद से संदर्भित राजा को स्पष्ट करने से हिंदी में सर्वनाम की अस्पष्टता दूर होती है, जबकि राजकीय उपस्थिति का व्यापक अर्थ बना रहता है।
- source_word: כָּל יְמֵי חַיָּיו
  choice: जीवन भर
  rationale: यह मानक हिंदी अभिव्यक्ति मूल के ‘उसके जीवन के सब दिन’ का संक्षिप्त और पूरा अर्थ देती है।
theological_decisions:
- issue: לְפָנָיו में राजकीय संगति का आशय
  choice: राजा के सामने
  alternative: राजा की मेज़ पर
  rationale: मूल पदबंध उपस्थिति को स्पष्ट करता है, पर मेज़ का सीधे उल्लेख नहीं करता। इसलिए अधिक विशिष्ट अर्थ को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक। ‘भोजन करता रहा’ हिब्रू मुहावरे ‘रोटी खाता था’ का स्वाभाविक अर्थ देता है, और ‘राजा’ जोड़कर हिंदी में संदर्भ स्पष्ट किया गया है।
