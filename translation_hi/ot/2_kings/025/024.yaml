translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कसदी’, ‘सेवक’ और ‘सेवा करना’ जैसे पद मूल के औपचारिक अर्थ को बनाए रखते हैं, जबकि वाक्य-विन्यास हिंदी की स्वाभाविकता के अनुसार रखा गया है। दिए गए अंग्रेज़ी पाठ में पादटिप्पणी-चिह्नों और पादटिप्पणियों का मेल असंगत था, इसलिए इस पद के हिंदी मुख्य पाठ में अनावश्यक चिह्न नहीं जोड़े गए।
