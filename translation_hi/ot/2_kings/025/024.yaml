base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
translation:
  language: hi
  text: गदल्याह ने उन्हें और उनके लोगों[a] को शपथ देकर कहा, “कसदियों[b] के सेवकों से मत डरो। इस देश में रहो और बाबेल के राजा की सेवा करो, और तुम्हारा भला होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनके पुरुषों को।” संदर्भ में उनके साथ के लोग, अनुचर, या सैनिक अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: “कसदी” इब्रानी जातिनाम है; इस संदर्भ में इसका अनुवाद “बाबेलवासी” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: निफ़ाल रूप का अर्थ ‘शपथ खाना’ है। अगले कथन के साथ जोड़कर यह हिंदी में स्वाभाविक रूप से आश्वासन की गंभीरता व्यक्त करता है।
- source_word: וּלְאַנְשֵׁיהֶם
  choice: और उनके आदमियों से
  rationale: אַנְשֵׁי का मूल अर्थ ‘आदमी’ है; संदर्भ में ये अगुओं के साथ आए लोग या सैनिक हो सकते हैं, पर मुख्य पाठ में अधिक विशिष्ट अर्थ नहीं थोपा गया।
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  choice: कसदियों के सेवकों से
  rationale: עבדי का औपचारिक अर्थ ‘सेवक’ है और מִן भय की क्रिया के साथ ‘से’ बनता है। यह पद बाबेली अधिकारियों या प्रतिनिधियों की ओर संकेत कर सकता है, किंतु मूल की व्यापकता रखी गई है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह मूल इब्रानी जातिनाम का सीधा हिंदी रूप है; संदर्भ में इससे बाबेली साम्राज्य के लोग अभिप्रेत हैं।
- source_word: שְׁבוּ בָאָרֶץ
  choice: इस देश में रहो
  rationale: ישב यहाँ बसने या बने रहने का भाव देता है। ‘रहो’ आधुनिक हिंदी में स्वाभाविक है और राजनीतिक व्यवस्था के अधीन वहीं निवास जारी रखने की बात व्यक्त करता है।
- source_word: וְעִבְדוּ אֶת־מֶלֶךְ בָּבֶל
  choice: बाबेल के राजा की सेवा करो
  rationale: עבד का व्यक्ति के साथ सामान्य अर्थ ‘सेवा करना’ है। राजनीतिक अधीनता निहित है, पर ‘अधीन हो जाओ’ की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: וְיִטַב לָכֶם
  choice: तब तुम्हारा भला होगा
  rationale: यह इब्रानी मुहावरा अनुकूल परिणाम का आश्वासन देता है। ‘तुम्हारा भला होगा’ सहज और गरिमापूर्ण हिंदी है; ‘तब’ आदेश के पालन और परिणाम का संबंध स्पष्ट करता है।
