  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
translation:
  language: hi
  text: और नगर में से उसने एक अधिकारी[a] को लिया, जो योद्धाओं के ऊपर नियुक्त किया गया था; और उन लोगों में से पाँच जनों को, जो राजा का मुख देखते थे[b] और नगर में पाए गए थे; और सेनापति के लेखक को, जो देश के लोगों को सेना के लिए भरती करता था[c]; और देश के लोगों में से साठ जनों को, जो नगर में पाए गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक नपुंसक”; इब्रानी शब्द का अर्थ शाब्दिक नपुंसक या राजकीय अधिकारी, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “राजा का मुख देखते थे” एक इब्रानी मुहावरा है, जिसका अर्थ राजा तक सीधी पहुँच रखने वाले दरबारी हैं।
    reason: cultural_note
  - marker: c
    text: या “देश के लोगों को सेना के लिए सूचीबद्ध करता था” अथवा “सैन्य सेवा के लिए बुलाता था”।
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  choice: अधिकारी
  rationale: यह शब्द शाब्दिक रूप से नपुंसक अथवा व्यापक अर्थ में राजकीय अधिकारी को सूचित कर सकता है। यहाँ पद और दायित्व का प्रसंग है, इसलिए मुख्य पाठ में तटस्थ ‘अधिकारी’ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: פָקִיד עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: योद्धाओं पर नियुक्त था
  rationale: यह पदबंध किसी को युद्ध करनेवाले पुरुषों के ऊपर नियुक्त किए जाने का भाव रखता है; अनावश्यक रूप से किसी विशिष्ट सैन्य पदनाम को आरोपित नहीं किया गया।
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  choice: जो राजा का मुख देखते थे
  rationale: इब्रानी मुहावरे का रूप सुरक्षित रखा गया है; इसका आशय राजा तक सीधी पहुँच रखनेवाले दरबारियों से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: הַסֹּפֵר שַׂר הַצָּבָא
  choice: सेना के प्रधान लेखक
  rationale: संक्षिप्त और कुछ हद तक अस्पष्ट इब्रानी संरचना में लेखक और सैन्य नेतृत्व/प्रशासन दोनों भाव हैं। ‘सेना के प्रधान लेखक’ अगले भरती-संबंधी उपवाक्य से स्वाभाविक रूप से जुड़ता है और दोनों तत्वों को बनाए रखता है।
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  choice: जो देश के लोगों को सेना के लिए भरती करता था
  rationale: हिफ़ील कृदंत का भाव लोगों को सैन्य सेवा के लिए इकट्ठा करने, सूचीबद्ध करने या बुलाने का है। ‘सेना के लिए भरती’ आधुनिक हिन्दी में प्रसंग स्पष्ट करती है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: शाब्दिक और सामाजिक रूप से खुला अनुवाद है; इसे ‘साधारण जनता’ कहकर संभावित अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  choice: पाए गए थे
  rationale: निफ़ाल का कर्मवाच्य अर्थ और नगर के पतन के बाद इन व्यक्तियों के वहाँ मिलने का कथात्मक भाव सुरक्षित रहता है।
- source_word: לָקַח
  choice: लिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है। प्रसंग में बंदी बनाकर ले जाने का संकेत है, पर मुख्य पाठ में ‘पकड़ा’ या ‘बंदी बनाया’ जोड़कर क्रिया को अधिक प्रबल नहीं किया गया।
