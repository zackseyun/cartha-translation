  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
translation:
  language: hi
  text: और एक तिहाई सूर फाटक पर, और एक तिहाई दौड़नेवालों के पीछे वाले फाटक पर रहे[a]; तुम भवन की चौकसी करना, ताकि कोई भीतर न घुस सके[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दौड़नेवाले’ राजकीय अंगरक्षकों या पहरेदारों के लिए प्रयुक्त पदनाम भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; इसका अर्थ ‘रक्षा के लिए’ या ‘रोक के रूप में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  choice: और एक तिहाई
  rationale: स्त्रीलिंग क्रमवाचक रूप यहाँ पहरेदारों के तीन दलों में से एक भाग को वितरणात्मक ढंग से दर्शाता है; आधुनिक हिन्दी में ‘एक तिहाई’ स्वाभाविक है।
- source_word: בְּשַׁעַר סוּר
  choice: सूर फाटक पर
  rationale: שַׁעַר का अर्थ ‘फाटक’ है और סוּר को यहाँ स्थान अथवा फाटक के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: בַּשַּׁעַר אַחַר הָרָצִים
  choice: दौड़नेवालों के पीछे वाले फाटक पर
  rationale: אַחַר का सामान्य अर्थ ‘पीछे’ है। यह अनुवाद स्थापत्य-संबंध को अनावश्यक रूप से निश्चित किए बिना इब्रानी वाक्य-विन्यास का भाव रखता है।
- source_word: הָרָצִים
  choice: दौड़नेवाले
  rationale: רוץ से बना यह संज्ञात्मक कृदंत शाब्दिक रूप से ‘दौड़नेवाले’ है; राजकीय संदर्भ में यह अंगरक्षकों अथवा राजकीय पहरेदारों का पदनाम हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וּשְׁמַרְתֶּם אֶת מִשְׁמֶרֶת
  choice: तुम ... की चौकसी करना
  rationale: सजातीय क्रिया और संज्ञा पहरे की दृढ़ता पर बल देती हैं; ‘चौकसी करना’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: בַּיִת मूलतः ‘घर/भवन’ है। ‘भवन’ राजमहल या अन्य परिसर को निश्चित किए बिना संदर्भ के अनुरूप गरिमापूर्ण और व्यापक शब्द है।
- source_word: מַסָּח
  choice: ताकि कोई भीतर न घुस सके
  rationale: यह दुर्लभ और अनिश्चित शब्द संदर्भ में रोक, सुरक्षा या प्रवेश-निषेध का भाव देता प्रतीत होता है। उद्देश्यवाचक हिन्दी अनधिकृत प्रवेश रोकने के संभावित अर्थ को स्वाभाविक ढंग से व्यक्त करती है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
