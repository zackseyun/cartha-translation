base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
translation:
  language: hi
  text: तब याजक यहोयादा ने सेना पर नियुक्त सौ-सौ के प्रधानों को आज्ञा दी और उनसे कहा, “उसे पंक्तियों के बीच ले जाओ[a], और जो कोई उसके पीछे आए, उसे तलवार से मार डालो।” क्योंकि याजक ने कहा था, “उसे यहोवा के भवन में न मारा जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्यांश कठिन है। इसके सम्भव अर्थ हैं: “पंक्तियों के बाहर” या “पंक्तियों के बीच के स्थान में”; सम्भवतः उसे पहरेदारों की व्यवस्थित पंक्तियों के बीच से बाहर ले जाने की बात है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सैकड़ों के प्रधानों
  rationale: यह सैनिक पदवी का औपचारिक और ऐतिहासिक रूप से उपयुक्त अनुवाद है; ‘सूबेदार’ या रोमी ‘शतपति’ जैसे सांस्कृतिक रूप से सीमित पदों से बचता है।
- source_word: פְּקֻדֵי הַחַיִל
  choice: सेना पर नियुक्त
  rationale: פקד के कर्मवाच्य कृदन्त में नियुक्ति और उत्तरदायित्व दोनों का भाव है; यह वाक्यांश उसी प्रशासनिक-सैनिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: הוֹצִיאוּ אֹתָהּ
  choice: उसे ... बाहर ले जाओ
  rationale: हिफ़ील आज्ञार्थक का कारक अर्थ स्पष्ट करता है और आदेश के प्रसंग में स्वाभाविक है।
- source_word: אֶל מִבֵּית לַשְּׂדֵרוֹת
  choice: पहरेदारों की पंक्तियों के बीच से बाहर
  rationale: इब्रानी वाक्यांश कठिन है। प्रसंग के अनुसार अतल्याह को भवन से व्यवस्थित सैनिक पंक्तियों के बीच से बाहर ले जाने का संकेत मिलता है; अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְהַבָּא אַחֲרֶיהָ
  choice: जो कोई उसके पीछे आए
  rationale: संज्ञीकृत एकवचन कृदन्त यहाँ सामान्य अर्थ में किसी भी अनुसरण करने वाले व्यक्ति को दर्शाता है।
- source_word: הָמֵת בֶּחָרֶב
  choice: उसे तलवार से मार डालो
  rationale: इन्फिनिटिव ऐब्सोल्यूट का आदेशात्मक बल सीधे और दृढ़ हिन्दी आदेश द्वारा व्यक्त किया गया है।
- source_word: אַל תּוּמַת
  choice: उसे ... न मारा जाए
  rationale: निषेधात्मक कर्मवाच्य भाव को बनाए रखता है और स्त्रीलिंग कर्ता को प्रसंग से स्पष्ट करता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘भवन’ मूल בית की अभिव्यक्ति को सुरक्षित रखता है, जबकि प्रसंग में इसका अर्थ मन्दिर है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलेखन द्वारा इब्रानी व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
