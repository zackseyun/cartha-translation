source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן הַ/כֹּהֵ֜ן לְ/שָׂרֵ֣י ה/מאיות אֶֽת הַ/חֲנִית֙ וְ/אֶת הַ/שְּׁלָטִ֔ים אֲשֶׁ֖ר לַ/מֶּ֣לֶךְ דָּוִ֑ד אֲשֶׁ֖ר בְּ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/010.yaml
  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
translation:
  language: hi
  text: तब याजक ने सैकड़ों के अधिकारियों को भाले[a] और ढालें दीं, जो राजा दाऊद के थे और यहोवा के भवन[b] में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘भाला’ है; यहाँ एकवचन का प्रयोग समूहवाचक अर्थ में हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यहोवा के मंदिर में।’ शाब्दिक अर्थ ‘यहोवा के भवन में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: तब ... दीं
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित एकवचन संज्ञा का प्रचलित और सीधा हिन्दी रूप।
- source_word: לְשָׂרֵי הַמֵּאוֹת
  choice: सैकड़ों के दलों के सेनापतियों को
  rationale: यह पद सौ-सौ सैनिकों की टुकड़ियों के अधिकारियों को दर्शाता है; जोड़ा गया ‘दलों’ हिन्दी में आशय स्पष्ट करता है।
- source_word: הַחֲנִית
  choice: भाले
  rationale: इब्रानी रूप एकवचन है, पर अनेक अधिकारियों में हथियार बाँटे जाने और बहुवचन ‘ढालें’ के साथ आने के कारण इसे समूहवाचक समझना प्रसंगानुकूल है।
- source_word: הַשְּׁלָטִים
  choice: ढालें
  rationale: राजकीय और मंदिर के शस्त्रागार के प्रसंग में यह सबसे समर्थित अर्थ है।
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִד
  choice: जो राजा दाऊद की थीं
  rationale: सम्बन्धवाचक उपवाक्य स्वामित्व व्यक्त करता है; स्त्रीलिंग बहुवचन क्रिया हथियारों के संयुक्त उल्लेख से मेल खाती है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: ‘यहोवा का घर/भवन’ मूल रूपक को बनाए रखता है; यहाँ आशय मंदिर से है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित ‘यहोवा’ रूप में प्रत्यक्ष रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय दिव्य नाम प्रत्यक्ष है; ‘यहोवा’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: הַחֲנִית को एकवचन या समूहवाचक मानना
  choice: भाले
  alternative: भाला
  rationale: रूप की एकवचनता फुटनोट में सुरक्षित है, जबकि अनेक सेनापतियों को हथियार दिए जाने का प्रसंग समूहवाचक अर्थ का समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ‘सेनापति’, ‘याजक’ और ‘भवन’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; जहाँ मूल की संक्षिप्त संरचना हिन्दी में अस्पष्ट हो सकती थी, वहाँ ‘दलों’ और ‘रखी हुई’ से निहित आशय स्पष्ट किया गया है।
