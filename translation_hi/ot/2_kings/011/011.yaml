  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। इब्रानी के संक्षिप्त स्थान-वर्णन को पठनीय बनाने के लिए दो वाक्यों में प्रस्तुत किया गया है; स्थान और दिशा की वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
