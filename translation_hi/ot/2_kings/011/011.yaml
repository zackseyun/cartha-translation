base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
translation:
  language: hi
  text: तब अंगरक्षक[a], हर एक अपने हथियार हाथ में लिए, भवन[c] की दाहिनी ओर से भवन की बाईं ओर तक[b], वेदी और भवन के पास, राजा के चारों ओर खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दौड़ने वाले,” अर्थात् शाही अंगरक्षक।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “भवन की दाहिनी ओर से भवन की बाईं ओर तक”; मंदिर की दिशा के अनुसार इसे “दक्षिणी ओर से उत्तरी ओर तक” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: यहाँ “भवन” से आशय मंदिर के भवन या परिसर से है।
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  choice: अंगरक्षक
  rationale: शब्द का शाब्दिक संबंध ‘दौड़ने वालों’ से है, पर इस राजकीय और सैन्य प्रसंग में यह हथियारबंद शाही रक्षकों को दर्शाता है।
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: अपने-अपने हथियार हाथ में लिए
  rationale: אִישׁ का वितरणात्मक भाव ‘प्रत्येक’ है, और इस प्रसंग में כְּלִי का स्वाभाविक अर्थ ‘हथियार’ है। यह अनुवाद उनकी सशस्त्र तत्परता बनाए रखता है।
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  choice: दाहिनी ओर से ... बाईं ओर तक
  rationale: כֶּתֶף का मूल अर्थ ‘कंधा’ है, किंतु भवन के स्थान-वर्णन में इसका अर्थ ‘ओर’ या ‘पार्श्व’ है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में ‘घर/भवन’ है; संदर्भ में यह मंदिर का भवन अथवा परिसर है। मुख्य पाठ में स्रोत की अभिव्यक्ति के निकट रहते हुए स्वाभाविक हिन्दी ‘भवन’ रखा गया है।
- source_word: הַיְמָנִית / הַשְּׂמָאלִית
  choice: दाहिनी ... बाईं
  rationale: ये शब्द सीधे ‘दाहिनी’ और ‘बाईं’ ओर बताते हैं। मंदिर की दिशा के अनुसार ‘दक्षिण’ और ‘उत्तर’ समझना संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַמִּזְבֵּחַ וְלַבָּיִת
  choice: वेदी और भवन के पास
  rationale: לְ यहाँ स्थान अथवा दिशा सूचित कर सकता है। ‘के पास’ सैनिकों की स्थिति बताता है, बिना सटीक दिशा या संपर्क का अनावश्यक निर्धारण किए।
- source_word: עַל הַמֶּלֶךְ סָבִיב
  choice: राजा के चारों ओर
  rationale: यह वाक्यांश राजा को सुरक्षा देते हुए चारों तरफ घेरकर खड़े होने का भाव व्यक्त करता है।
