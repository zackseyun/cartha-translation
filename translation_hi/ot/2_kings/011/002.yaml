base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
translation:
  language: hi
  text: परन्तु राजा योराम की बेटी और अहज्याह की बहन यहोशेबा ने अहज्याह के पुत्र योआश को लिया और जिन राजा के पुत्रों को मारा जा रहा था, उनके बीच से उसे और उसकी दूध पिलाने वाली धाय[a] को चुपके से निकालकर शयन-कक्ष[b] में ले गई। फिर उन्होंने[c] उसे अतल्याह से छिपा दिया, इस प्रकार वह मारा नहीं गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उसकी धाय।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “पलंगों का कमरा।”'
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में क्रिया बहुवचन है: “उन्होंने उसे छिपा दिया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקַּח
  choice: ने ... लिया
  rationale: कथा में सामान्य क्रिया לקח का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: יְהוֹשֶׁבַע
  choice: यहोशेबा
  rationale: राजाओं की पुस्तक में प्रयुक्त इब्रानी नामरूप का देवनागरी लिप्यंतरण।
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  choice: राजा योराम की बेटी
  rationale: सम्बन्धवाचक पदबंध को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: אֲחוֹת אֲחַזְיָהוּ
  choice: अहज्याह की बहन
  rationale: אחות का सामान्य, स्पष्ट अर्थ ‘बहन’ है; वंशावली-सामंजस्य के लिए इसे ढीला नहीं किया गया।
- source_word: וַתִּגְנֹב אֹתוֹ
  choice: उसे ... चुपके से निकालकर
  rationale: גנב का मूल भाव चोरी या गुप्त रूप से ले जाने का है। यहाँ बालक के उद्धार के प्रसंग में यह हिन्दी अभिव्यक्ति गोपनीयता को स्वाभाविक रूप से व्यक्त करती है और अपहरण का अनुचित भाव नहीं लाती।
- source_word: מִתּוֹךְ בְּנֵי הַמֶּלֶךְ
  choice: राजपुत्रों ... के बीच से
  rationale: शाब्दिक अर्थ ‘राजा के पुत्रों’ का संक्षिप्त और सामान्य हिन्दी समतुल्य ‘राजपुत्र’ है।
- source_word: הַמּוּמָתִים
  choice: जिन ... को मार डाला जा रहा था
  rationale: מות के होफल कृदन्त की जारी निष्पादनात्मक क्रिया को सुरक्षित रखता है।
- source_word: מֵינִקְתּוֹ
  choice: उसकी धाय
  rationale: यह संज्ञा बच्चे को दूध पिलाने और उसकी देखभाल करने वाली स्त्री को सूचित करती है; विशिष्ट अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בַּחֲדַר הַמִּטּוֹת
  choice: शयन-कक्ष में
  rationale: शाब्दिक ‘पलंगों का कमरा’ का गरिमापूर्ण और सुबोध आधुनिक हिन्दी रूप।
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  choice: उन्होंने उसे ... छिपा दिया
  rationale: मसोरेटी पाठ की बहुवचन क्रिया को एकवचन बनाकर सरल नहीं किया गया।
- source_word: מִפְּנֵי עֲתַלְיָהוּ
  choice: अतल्याह से
  rationale: इस प्रसंग में מִפְּנֵי का अर्थ उसकी दृष्टि और पहुँच से छिपाना है।
- source_word: וְלֹא הוּמָת
  choice: इसलिए वह मारा नहीं गया
  rationale: निष्क्रिय क्रिया और पूर्ववर्ती छिपाने के परिणाम, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहोशेबा और अहज्याह का पारिवारिक सम्बन्ध
  choice: ‘अहज्याह की बहन’ को यथावत रखना
  alternative: वंशावली के सम्भावित सामंजस्य के लिए ‘अहज्याह की सम्बन्धी’ कहना
  rationale: इब्रानी पाठ साधारण और स्पष्ट रूप से ‘बहन’ कहता है; अनुवाद में बाहरी सामंजस्य आरोपित नहीं किया गया।
- issue: ‘छिपा दिया’ क्रिया का कर्ता
  choice: बहुवचन ‘उन्होंने’
  alternative: प्रसंग के आधार पर एकवचन ‘उसने’
  rationale: मसोरेटी पाठ में क्रिया तृतीय पुरुष बहुवचन है; यहोशेबा और धाय अथवा अन्य सहायकों की सम्भावना को खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘धाय’ और ‘शयन-कक्ष’ जैसे शब्द सटीकता तथा पठनीयता का संतुलन रखते हैं; अपेक्षाकृत कम परिचित अर्थ पादटिप्पणियों में स्पष्ट किए गए हैं।
