  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘देश के सब लोग’ स्रोत की सामूहिक अभिव्यक्ति को बनाए रखता है; अतल्याह को वाक्य में आगे रखकर इब्रानी के हल्के बल को स्वाभाविक हिन्दी में सुरक्षित किया गया है।
