  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
translation:
  language: hi
  text: तब देश के सब लोग आनन्दित हुए और नगर शांत हो गया। और अतल्याह को उन्होंने राजा के भवन में तलवार से मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂמַח
  choice: आनन्दित हुए
  rationale: שׂמח के सामूहिक कर्ता के लिए यह स्वाभाविक हिन्दी है और हर्ष के प्रबल भाव को बनाए रखती है।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: शाब्दिक संरचना और जनसमुदाय के सामाजिक-राजनीतिक संकेत को यथासंभव बनाए रखता है; केवल ‘सब लोग’ कहने से הָאָרֶץ का तत्व खो जाता।
- source_word: וְהָעִיר שָׁקָטָה
  choice: और नगर शांत हो गया
  rationale: שׁקט यहाँ उपद्रव थमने और शांति स्थापित होने को दर्शाता है; हिन्दी में परिणामी भाव के लिए ‘शांत हो गया’ स्वाभाविक है।
- source_word: וְאֶת עֲתַלְיָהוּ
  choice: और अतल्याह को
  rationale: वाव और अग्रस्थ निश्चित कर्म को बनाए रखते हुए हिन्दी में ‘अतल्याह को’ आगे रखा गया है, जिससे हल्का विषयगत बल सुरक्षित रहता है।
- source_word: הֵמִיתוּ
  choice: उन्होंने … मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ ‘मृत्यु देना’ है। प्रसंग में ‘मार डाला’ सहज और गंभीर है, जबकि ‘मृत्युदंड दिया’ औपचारिक न्यायिक प्रक्रिया को आवश्यकता से अधिक स्पष्ट कर सकता है।
- source_word: בַחֶרֶב
  choice: तलवार से
  rationale: करणवाचक בְּ का सीधा और स्वाभाविक हिन्दी रूप; हथियार का विशिष्ट उल्लेख सुरक्षित है।
- source_word: בֵּית מלך
  choice: राजा के भवन में
  rationale: पदबंध का मूल अर्थ ‘राजा का घर/भवन’ है। ‘भवन’ गरिमापूर्ण और सुबोध है तथा ‘राजमहल’ की अपेक्षा मूल शब्दावली के निकट है।
