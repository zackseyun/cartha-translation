base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/007.yaml
  text: And the two divisions among you[a], all who go off duty on the Sabbath[c][b], shall keep watch over the house of Yahweh for the king.
translation:
  language: hi
  text: और तुम में से दो दल[a]—वे सभी जो सब्त के दिन ड्यूटी से जाते हैं[b]—राजा के लिए याहवे के भवन की रखवाली करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दो हाथ’; यहाँ सम्भवतः ‘दो दल’ या ‘दो टुकड़ियाँ’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे सभी जो सब्त के दिन निकलते हैं’; प्रसंग में सम्भवतः सब्त के दिन पारी बदलने पर ड्यूटी से जानेवाले पहरेदार।
    reason: alternative_reading
  - marker: c
    text: या, ‘याहवे के भवन की चौकसी राजा के लिए/राजा की ओर रखें।’ इब्रानी पूर्वसर्ग का संबंध कठिन है; प्रसंग भवन की रखवाली को राजा की सुरक्षा से संबंधित बताता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁתֵּי הַיָּדוֹת
  choice: वे दोनों दल
  rationale: शाब्दिक अर्थ ‘दो हाथ’ है, पर इस सैनिक और संगठनात्मक प्रसंग में יָד किसी भाग, पक्ष या दल को दर्शाता है। ‘दोनों दल’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: בָּכֶם
  choice: तुममें से
  rationale: यह संबोधित पहरेदारों में से बने दोनों दलों को सूचित करता है; हिन्दी में ‘तुममें से’ स्वाभाविक है।
- source_word: כֹּל יֹצְאֵי הַשַּׁבָּת
  choice: वे सब जो सब्त के दिन अपनी पहरे की पारी पूरी करके जाते हैं
  rationale: शाब्दिक रूप से ‘सब्त के दिन निकलनेवाले’ है। आसपास के पदों में पहरे की पारी बदलने का प्रसंग होने से यहाँ ड्यूटी समाप्त करके जानेवाले अभिप्रेत हैं।
- source_word: וְשָׁמְרוּ אֶת מִשְׁמֶרֶת
  choice: पहरा दें
  rationale: क्रिया और उसी मूल की संज्ञा मिलकर पहरा देने अथवा रखवाली करने का भाव व्यक्त करती हैं; ‘पहरा दें’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: בֵּית का मूल अर्थ ‘भवन/घर’ है। यहाँ मंदिर अभिप्रेत है, फिर भी ‘भवन’ स्रोत की अभिव्यक्ति के निकट और हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा की रक्षा के लिए
  rationale: אֶל का संबंध यहाँ कठिन है। कथा-संदर्भ के अनुसार यहोवा के भवन पर पहरा राजा की सुरक्षा के उद्देश्य से है; इसीलिए प्रयोजन को स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: אֶל הַמֶּלֶךְ का संबंध
  choice: राजा की रक्षा के लिए
  alternative: राजा की ओर; राजा के लिए
  rationale: इब्रानी पूर्वसर्ग अस्पष्ट है। निकटवर्ती कथा में योआश की सुरक्षा केंद्र में है, इसलिए मुख्य पाठ में प्रयोजन स्पष्ट किया गया है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। सैनिक पारी का प्रसंग स्पष्ट किया गया है, पर ‘दो हाथ’ और אֶל की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
