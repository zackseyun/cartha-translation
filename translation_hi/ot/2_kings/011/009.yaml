base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
translation:
  language: hi
  text: तब सैकड़ों के अधिकारियों ने वह सब किया जिसकी आज्ञा याजक यहोयादा ने दी थी। प्रत्येक अधिकारी ने अपने आदमियों को—सब्त के दिन सेवा पर आनेवालों को और सब्त के दिन सेवा से जानेवालों को[a]—साथ लिया, और वे याजक यहोयादा के पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “सब्त के दिन भीतर आनेवालों और सब्त के दिन बाहर जानेवालों को।” प्रसंग से सम्भवतः सेवा की आनेवाली और जानेवाली पालियाँ अभिप्रेत हैं।
    reason: मूल हिब्रू के शाब्दिक स्थानगत अर्थ और प्रसंग से प्राप्त सेवा-पाली के अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के दलों के अधिकारी
  rationale: यह पद सौ व्यक्तियों की सैन्य इकाइयों पर नियुक्त अगुओं को दर्शाता है। यह हिन्दी में सैन्य संरचना स्पष्ट करता है और अत्यधिक प्राचीन शब्दावली से बचता है।
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: वह सब किया जिसकी आज्ञा ... ने दी थी
  rationale: इससे आज्ञा के पूर्ण पालन का भाव स्वाभाविक हिन्दी में बना रहता है।
- source_word: אִישׁ אֶת־אֲנָשָׁיו
  choice: हर अधिकारी अपने आदमियों को
  rationale: אִישׁ यहाँ वितरणात्मक है और प्रत्येक अधिकारी को अलग-अलग इंगित करता है; प्रसंग के कारण कर्ता को स्पष्ट रूप से दोहराया गया है।
- source_word: בָּאֵי הַשַּׁבָּת
  choice: सब्त के दिन सेवा पर आनेवालों
  rationale: शाब्दिक अर्थ 'सब्त में आनेवाले' है, पर मन्दिर-रक्षक दलों के प्रसंग में यह सेवा की आनेवाली पाली को सूचित करता है।
- source_word: יֹצְאֵי הַשַּׁבָּת
  choice: सेवा से जानेवालों
  rationale: यह पिछले पद के विपरीत जानेवाली पाली को दर्शाता है; 'सेवा से' प्रसंगगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיָּבֹאוּ אֶל יְהוֹיָדָע הַכֹּהֵן
  choice: याजक यहोयादा के पास आया
  rationale: हिब्रू में क्रिया बहुवचन है, पर वितरणात्मक 'हर अधिकारी' के अनुसार हिन्दी में एकवचन स्वाभाविक है; गन्तव्य और पदवी दोनों सुरक्षित हैं।
