base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
translation:
  language: hi
  text: तब उसने राजा के पुत्र को बाहर लाकर उसके सिर पर मुकुट रखा और उसे साक्ष्य[a] दिया। फिर उन्होंने उसे राजा बनाया और उसका अभिषेक किया। उन्होंने तालियाँ बजाईं और कहा, “राजा चिरंजीवी हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वाचा-पत्र” अथवा “राजाज्ञा।” इब्रानी में शाब्दिक रूप से “साक्ष्य” है; संभवतः यह राजा के शासन से संबंधित कोई लिखित दस्तावेज़ या निर्देश था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: बाहर लाकर
  rationale: हिफ़ील रूप का कारणवाचक अर्थ ‘बाहर लाना’ है; यह प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: בֶּן־הַמֶּלֶךְ
  choice: राजा के पुत्र
  rationale: इब्रानी संबंधसूचक पदबंध का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: הַנֵּזֶר
  choice: मुकुट
  rationale: राज्याभिषेक के प्रसंग में यह राजसत्ता के शिरोभूषण को दर्शाता है; ‘मुकुट’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: הָעֵדוּת
  choice: साक्ष्य-पत्र
  rationale: मूल शब्द ‘साक्ष्य/गवाही’ का अर्थ रखता है, किंतु यहाँ राजा को दी जाने वाली किसी लिखित वस्तु का संकेत जान पड़ता है। ‘साक्ष्य-पत्र’ वस्तु और मूल शब्द—दोनों को यथासंभव सुरक्षित रखता है।
- source_word: וַיַּמְלִכוּ אֹתוֹ
  choice: उन्होंने उसे राजा बनाया
  rationale: हिफ़ील का सीधा अर्थ किसी को राजा बनाना है; यह अलग से उल्लिखित मुकुट और अभिषेक के साथ अनावश्यक पुनरुक्ति नहीं करता।
- source_word: וַיִּמְשָׁחֻהוּ
  choice: उसका अभिषेक किया
  rationale: राजकीय प्रतिष्ठापन के प्रसंग में משׁח का मानक और अर्थपूर्ण हिन्दी रूप।
- source_word: וַיַּכּוּ כָף
  choice: उन्होंने तालियाँ बजाईं
  rationale: शाब्दिक अर्थ ‘हथेली पर प्रहार करना’ है; यहाँ सार्वजनिक हर्षध्वनि के लिए प्रचलित हिन्दी मुहावरा उपयुक्त है।
- source_word: יְחִי הַמֶּלֶךְ
  choice: राजा चिरंजीवी हो!
  rationale: यह राजकीय जयघोष के इच्छासूचक बल को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: राज्याभिषेक में הָעֵדוּת का आशय
  choice: मुख्य पाठ में ‘साक्ष्य-पत्र’
  alternative: ‘साक्ष्य’, ‘वाचा-पत्र’ या ‘राजाज्ञा’
  rationale: इब्रानी शब्द अपने आप में केवल ‘साक्ष्य/गवाही’ कहता है, जबकि प्रसंग किसी लिखित दस्तावेज़ की ओर संकेत कर सकता है। अनिश्चितता बनाए रखने और किसी विशिष्ट धार्मिक-संस्थागत पहचान को आरोपित न करने के लिए अपेक्षाकृत व्यापक पद चुना गया है तथा विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘साक्ष्य-पत्र’ के साथ पादटिप्पणी मूल की वास्तविक अर्थगत अनिश्चितता को बनाए रखती है।
