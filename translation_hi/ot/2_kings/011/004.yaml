base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
translation:
  language: hi
  text: सातवें वर्ष में यहोयादा ने सौ-सौ के अधिकारियों, कारियों[a] और दौड़ने वालों[b] को बुलवाया। वह उन्हें अपने पास याहवे के भवन में ले आया। वहाँ उसने उनके साथ वाचा बाँधी और याहवे के भवन में उन्हें शपथ दिलाई; फिर उसने उन्हें राजा का पुत्र दिखाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करेतियों’। यह शब्द संभवतः राजकीय अंगरक्षकों की किसी टुकड़ी का नाम है; इसकी ठीक पहचान अनिश्चित है।
    reason: alternative_reading
  - marker: b
    text: ‘दौड़ने वाले’ संभवतः राजकीय अंगरक्षक या संदेशवाहक थे।
    reason: cultural_note
lexical_decisions:
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִית
  choice: सातवें वर्ष में
  rationale: आरंभिक वाव को हिंदी कथाशैली में अलग से व्यक्त करना आवश्यक नहीं; काल-सूचना स्पष्ट रूप से बनी रहती है।
- source_word: שָׁלַח וַיִּקַּח
  choice: बुलवा लिया
  rationale: शाब्दिक रूप से ‘भेजा और लिया’; प्रसंग में यहोयादा ने संदेश भेजकर अधिकारियों को अपने पास बुलाया। ‘बुलवा लिया’ दोनों क्रियाओं का स्वाभाविक हिंदी रूप है।
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के अधिकारियों
  rationale: यह पद सौ व्यक्तियों की सैन्य टुकड़ियों पर नियुक्त अधिकारियों को सूचित करता है; रोमी ‘सूबेदार’ जैसी विशिष्ट उपाधि से बचा गया है।
- source_word: לַכָּרִי
  choice: कारियों
  rationale: इसे अनिश्चित समूह-नाम के रूप में लिप्यंतरित किया गया है; संभावित वैकल्पिक पहचान पादटिप्पणी में रखी गई है।
- source_word: וְלָרָצִים
  choice: दौड़नेवालों
  rationale: मूल अर्थ ‘दौड़नेवाले’ सुरक्षित रखा गया है; राजकीय अंगरक्षक अथवा दूत के रूप में उनका संभावित कार्य पादटिप्पणी में बताया गया है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ हिब्रू בית का निकट और हिंदी में बोधगम्य रूप है; यह मंदिर को सूचित करता है। दिव्य नाम को व्यक्तिनाम के रूप में रखा गया है।
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  choice: उसने उनके साथ वाचा बाँधी
  rationale: हिब्रू मुहावरे ‘वाचा काटना’ का औपचारिक और पारंपरिक हिंदी समतुल्य ‘वाचा बाँधना’ राजनीतिक तथा धार्मिक गंभीरता बनाए रखता है।
- source_word: וַיַּשְׁבַּע אֹתָם
  choice: उन्हें शपथ दिलाई
  rationale: हिफ़ील रूप का कारक अर्थ है कि यहोयादा ने उनसे शपथ लेने को कहा; हिंदी में ‘शपथ दिलाई’ स्वाभाविक है।
- source_word: בֶּן הַמֶּלֶךְ
  choice: राजा का पुत्र
  rationale: मूल पद का सीधा अनुवाद, जो उत्तराधिकार की पहचान को स्पष्ट रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय दिव्य नाम है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाने जाने वाले व्यक्तिनाम ‘यहोवा’ का प्रयोग किया गया है, न कि पदवी ‘प्रभु’; इससे मूल का व्यक्तिनाम बना रहता है।
- issue: בְּרִית की प्रकृति
  choice: वाचा
  alternative: समझौता
  rationale: ‘वाचा’ इस औपचारिक, शपथबद्ध राजनीतिक प्रतिबद्धता का भार बनाए रखती है; ‘समझौता’ अपेक्षाकृत हल्का और अस्पष्ट होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। पहले वाक्य में संयुक्त हिब्रू क्रियाओं को स्वाभाविक हिंदी ‘बुलवा लिया’ में व्यक्त किया गया है। अस्पष्ट दल-नामों को मुख्य पाठ में अत्यधिक व्याख्यायित न करके पादटिप्पणियों में स्पष्ट किया गया है।
