source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
translation:
  language: hi
  text: तब उसने सैकड़ों के अधिकारियों, कारी लोगों[a], धावकों[b] और देश के सब लोगों को साथ लिया। वे राजा को यहोवा के भवन से नीचे ले गए और धावकों के फाटक के रास्ते राजभवन पहुँचे। फिर वह राजाओं के सिंहासन पर बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कारी’ पद का अर्थ अनिश्चित है; सम्भवतः ‘करेती’ अथवा ‘अंगरक्षक’।
    reason: alternative_reading
  - marker: b
    text: ‘धावक’ सम्भवतः राजकीय अंगरक्षक या संदेशवाहक थे; यही पद ‘धावकों के फाटक’ में भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब उसने ... को साथ लिया
  rationale: एकवचन क्रिया का कर्ता प्रसंगानुसार यहोयादा है। ‘साथ लिया’ सूचीबद्ध दलों को एकत्र करके साथ ले चलने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׂרֵי הַמֵּאוֹת
  choice: सौ-सौ सैनिकों के प्रधानों
  rationale: यह सैन्य इकाइयों के अधिकारियों का पद है। यह अनुवाद रोमी ‘शतपति’ जैसी अनावश्यक ऐतिहासिक छाप से बचते हुए संरचना स्पष्ट करता है।
- source_word: הַכָּרִי
  choice: कारियों
  rationale: हिब्रू पद की पहचान अनिश्चित है; ध्वन्यात्मक रूप ‘कारी’ मुख्य पाठ में अनिश्चितता को बनाए रखता है, जबकि सम्भावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הָרָצִים
  choice: धावकों
  rationale: शाब्दिक बिंब ‘दौड़ने वालों’ का है। राजकीय प्रसंग में ये अंगरक्षक या दूत हो सकते हैं, पर मुख्य पाठ में ठोस हिब्रू अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोगों
  rationale: यह यहूदा की जनता के लिए प्रयुक्त पारंपरिक अभिव्यक्ति है; अनुवाद इसे न केवल सामान्य वर्ग तक सीमित करता है, न उससे अधिक निश्चित बनाता है।
- source_word: וַיֹּרִידוּ אֶת הַמֶּלֶךְ
  choice: वे राजा को ... नीचे ले आए
  rationale: बहुवचन क्रिया अब एकत्र समूह को कर्ता बनाती है। ‘नीचे ले आए’ मन्दिर-क्षेत्र से राजभवन की ओर उतरने की दिशात्मकता बनाए रखता है।
- source_word: מִבֵּית יְהוָה
  choice: यहोवा के भवन से
  rationale: ‘भवन’ मूल के ‘घर’ रूपक और आगे आने वाले राजभवन के समानांतर को बनाए रखता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में दिया गया है।
- source_word: דֶּרֶך שַׁעַר הָרָצִים
  choice: धावकों के फाटक के रास्ते
  rationale: मूल संरचना को स्वाभाविक हिन्दी में सुरक्षित रखा गया है; ‘धावक’ की सम्भावित राजकीय भूमिका पादटिप्पणी में स्पष्ट है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजभवन
  rationale: ‘राजा का भवन’ का स्वाभाविक हिन्दी समतुल्य है और मन्दिर से राजकीय निवास तक की गति स्पष्ट करता है।
- source_word: וַיֵּשֶׁב
  choice: फिर वह ... बैठ गया
  rationale: एकवचन कर्ता राजा है। ‘बैठ गया’ सिंहासन ग्रहण करने की पूर्ण हुई क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל כִּסֵּא הַמְּלָכִים
  choice: राजाओं के सिंहासन पर
  rationale: मूल के बहुवचन ‘राजाओं’ को बनाए रखा गया है, जो यहूदा के वंशगत राजसिंहासन की ओर संकेत कर सकता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आता है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: כִּסֵּא הַמְּלָכִים में बहुवचन
  choice: राजाओं के सिंहासन
  alternative: राजसिंहासन
  rationale: बहुवचन को बनाए रखने से वंशगत उत्तराधिकार का सम्भावित संकेत सुरक्षित रहता है; उसे केवल विशेषण ‘राजकीय’ में समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। अनिश्चित पदों को मुख्य पाठ में अति-व्याख्यायित नहीं किया गया और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
