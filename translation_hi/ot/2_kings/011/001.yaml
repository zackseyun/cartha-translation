  register: आधुनिक, सरल और गरिमापूर्ण कथात्मक हिन्दी अपनाई गई है। वाक्य को दो भागों में बाँटकर घटनाक्रम स्पष्ट रखा गया है; मूल की कठोरता और अतल्याह की निर्णायक हिंसक कार्रवाई को नरम नहीं किया गया।
