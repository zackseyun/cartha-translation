  text: וַֽ/עֲתַלְיָה֙ אֵ֣ם אֲחַזְיָ֔הוּ ו/ראתה כִּ֣י מֵ֣ת בְּנָ֑/הּ וַ/תָּ֨קָם֙ וַ/תְּאַבֵּ֔ד אֵ֖ת כָּל זֶ֥רַע הַ/מַּמְלָכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
translation:
  language: hi
  text: अहज्याह की माता अतल्याह ने देखा कि उसका पुत्र मर चुका था। तब वह उठी और उसने राजवंश के सभी वंशजों[a] को नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “राज्य का सारा बीज,” अर्थात राजवंश या राजकीय वंशज।'
    reason: मूल इब्रानी रूपक और उसके वंशगत अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: וַעֲתַלְיָה אֵם אֲחַזְיָהוּ
  choice: अहज्याह की माता अतल्याह
  rationale: व्यक्तिनामों को प्रचलित हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है और संबंधसूचक पदबंध को स्वाभाविक हिन्दी क्रम में रखा गया है। आरंभिक וַ को अलग से ‘और’ नहीं बनाया गया, क्योंकि यहाँ वह कथावृत्त की निरंतरता दर्शाता है और हिन्दी में उसकी आवश्यकता नहीं है।
- source_word: וַתֵּרֶא כִּי מֵת בְּנָהּ
  choice: ने देखा कि उसका पुत्र मर चुका था
  rationale: रूप कथावाचक भूतकाल में किसी पूर्ण हो चुकी मृत्यु की स्थिति को व्यक्त करता है; ‘मर चुका था’ मूल के परिणामात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: וַתָּקָם
  choice: तब वह उठी
  rationale: קום यहाँ निर्णायक कार्रवाई आरंभ करने को सूचित करता है। ‘तब’ घटनाक्रम को स्पष्ट करता है, बिना किसी अतिरिक्त कारणात्मक दावे के।
- source_word: וַתְּאַבֵּד
  choice: नष्ट कर दिया
  rationale: पिएल रूप का अर्थ विनाश कर देना है। संदर्भ में हत्या निहित है, पर ‘नष्ट कर दिया’ मूल क्रिया की व्यापकता को बनाए रखता है।
- source_word: אֵת כָּל זֶרַע הַמַּמְלָכָה
  choice: राजवंश के सभी वंशजों
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ यह राजकीय वंश या उत्तराधिकारियों को दर्शाता है। ‘राजवंश के सभी वंशज’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
