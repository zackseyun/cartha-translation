  text: וַ/יְהִ֤י אִתָּ/הּ֙ בֵּ֣ית יְהוָ֔ה מִתְחַבֵּ֖א שֵׁ֣שׁ שָׁנִ֑ים וַ/עֲתַלְיָ֖ה מֹלֶ֥כֶת עַל הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: hi
  text: वह छः वर्ष तक उसके साथ यहोवा के भवन में छिपा रहा, और अतल्याह देश पर शासन करती रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: मंदिर को सूचित करने वाले इब्रानी पदबंध का स्वाभाविक और स्रोत-संगत अनुवाद; परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִתְחַבֵּא
  choice: छिपा रहा
  rationale: हित्पएल कृदंत यहाँ निरंतर अवस्था/क्रिया बताता है—वह इस अवधि में छिपकर रहा।
- source_word: מֹלֶכֶת עַל הָאָרֶץ
  choice: देश पर शासन करती रही
  rationale: स्त्रीलिंग कृदंत की जारी क्रिया को व्यक्त करता है; ‘देश’ यहाँ राज्य-क्षेत्र के अर्थ में स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘यहोवा’ हिंदी बाइबलीय परंपरा में परिचित रूप है और नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: מִתְחַבֵּא को अवस्था या सक्रिय क्रिया के रूप में व्यक्त करना
  choice: छिपा रहा
  alternative: छिपाकर रखा गया
  rationale: मूल में आत्मवाचक/मध्यवाचक हित्पएल रूप है, निष्क्रिय ‘छिपाकर रखा गया’ नहीं; इसलिए बालक के छिपे रहने की जारी अवस्था को रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। वाक्यक्रम हिंदी की स्वाभाविकता के अनुसार रखा गया है, जबकि दोनों समकालिक स्थितियाँ स्पष्ट बनी रहती हैं।
