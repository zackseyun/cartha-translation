id: 2KI.11.13
reference: 2 Kings 11:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
translation:
  language: hi
  text: जब अतल्याह ने अंगरक्षकों[a] और लोगों का कोलाहल[b] सुना, तो वह याहवे के भवन[c] में लोगों के पास आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘दौड़नेवाले’; संभवतः राजकीय रक्षक या अंगरक्षक-दल।
    reason: lexical_alternative
  - marker: b
    text: या ‘आवाज़’ अथवा ‘ध्वनि’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात मंदिर; संदर्भ में मंदिर-परिसर भी सम्मिलित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  choice: सुना
  rationale: यहाँ שׁמע सामान्य श्रवण-बोध व्यक्त करता है; इसलिए सहज कथात्मक रूप ‘सुना’ उपयुक्त है।
- source_word: עֲתַלְיָה
  choice: अतल्याह
  rationale: हिब्रू नाम का प्रचलित और स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: קוֹל
  choice: कोलाहल
  rationale: קוֹל का अर्थ आवाज़, ध्वनि या शोर हो सकता है। अंगरक्षकों और एकत्र लोगों के सार्वजनिक उत्सव के संदर्भ में ‘कोलाहल’ सामूहिक ध्वनि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרָצִין
  choice: अंगरक्षकों
  rationale: शब्द का शाब्दिक संबंध ‘दौड़नेवालों’ से है, पर राजकीय संदर्भ में यह राजा के अंगरक्षक-दल को सूचित करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עָם का सामान्य अर्थ ‘लोग’ या ‘प्रजा’ है; यहाँ ‘लोगों’ एकत्र जनसमूह को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: וַתָּבֹא אֶל
  choice: के पास आई
  rationale: בוא אֶל किसी व्यक्ति या समूह की ओर आने को व्यक्त करता है; ‘के पास आई’ गंतव्य और गति दोनों को स्पष्ट रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: यह पदबंध शाब्दिक रूप से ‘याहवे का भवन’ है। ‘भवन’ स्रोत की रूपकात्मक अभिव्यक्ति को बनाए रखता है, जबकि संदर्भ में इससे मंदिर अभिप्रेत है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से मान्य आधुनिक लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कोलाहल’ सामूहिक उत्सवी ध्वनि को व्यक्त करता है; ‘भवन’ हिब्रू रूप को सुरक्षित रखता है और पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
