  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
translation:
  language: hi
  text: 'तब उसने उन्हें आज्ञा दी, “तुम्हें यह करना है: तुममें से जो लोग सब्त के दिन ड्यूटी पर आते हैं, उनमें से एक-तिहाई राजा के भवन[a] की रखवाली करे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजमहल।” इब्रानी में शाब्दिक रूप से “राजा का भवन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  choice: तब उसने उन्हें आज्ञा दी
  rationale: पिएल रूप का अधिकारपूर्ण अर्थ ‘आज्ञा देना’ है; ‘तब’ कथानक में वַ का स्वाभाविक हिन्दी संबंध व्यक्त करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के आरंभ से व्यक्त
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता; उद्धरण से इब्रानी कथन-सूत्र का कार्य स्पष्ट है।
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  choice: तुम्हें यह करना है
  rationale: निर्देशात्मक बल को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: הַשְּׁלִשִׁית מִכֶּם
  choice: तुममें से … एक तिहाई
  rationale: भिन्नात्मक अभिव्यक्ति का स्वाभाविक हिन्दी रूप, जो समूह के एक-तिहाई भाग को दर्शाता है।
- source_word: בָּאֵי הַשַּׁבָּת
  choice: जो लोग सब्त के दिन पहरे की सेवा में आते हैं
  rationale: शब्दतः ‘सब्त पर आनेवाले’; संदर्भ में पहरे की पाली बदलने पर सेवा में आने का आशय है। ‘पहरे की सेवा में’ अंतर्निहित संदर्भ स्पष्ट करता है, बिना दिन के अर्थ को बदले।
- source_word: וְשֹׁמְרֵי מִשְׁמֶרֶת
  choice: रखवाली करे
  rationale: निर्देश के भीतर पहरा देने का कार्य है; एक-तिहाई सामूहिक कर्ता के साथ एकवचन ‘करे’ स्वाभाविक है।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजा का भवन
  rationale: इब्रानी ‘राजा का घर/भवन’ के निकट रहता है और प्रसंग में राजमहल की संभावना को पादटिप्पणी में सुरक्षित रखता है।
