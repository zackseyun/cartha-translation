  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कथात्मक शैली अपनाई गई है। ‘राजमहल’ और ‘प्रवेश-मार्ग’ सामान्य पाठक के लिए सहज हैं; मूल की सक्रिय ‘वह पहुँची’ और निष्पादनसूचक कर्मवाच्य को सुरक्षित रखा गया है।
