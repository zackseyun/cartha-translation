  edition: WLC
  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
translation:
  language: hi
  text: तब उन्होंने उसे पकड़ लिया[a], और वह घोड़ों के प्रवेश-मार्ग से होकर राजमहल पहुँची[b]; वहीं उसे मार डाला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने उस पर हाथ रखा।” इसका अर्थ यहाँ उसे पकड़ लेना है। कुछ अनुवाद इसे “उन्होंने उसके लिए रास्ता बनाया” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “घोड़ों का प्रवेश।” संभवतः इसका आशय उस मार्ग या फाटक से है जिससे घोड़े राजमहल के परिसर में प्रवेश करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  choice: उन्होंने उसे पकड़ लिया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उस पर हाथ रखा’ है, पर इस प्रसंग में इसका स्वाभाविक अर्थ उसे पकड़ना या हिरासत में लेना है।
- source_word: וַתָּבֹא
  choice: वह ... पहुँची
  rationale: בוא संदर्भ और दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ मंदिर से राजमहल की ओर गति के लिए ‘पहुँची’ स्वाभाविक है और क्रिया को अनावश्यक रूप से कर्मवाच्य नहीं बनाता।
- source_word: דֶּרֶךְ מְבוֹא הַסּוּסִים
  choice: घोड़ों के प्रवेश-मार्ग से होकर
  rationale: यह पदबंध घोड़ों द्वारा प्रयुक्त प्रवेश या पहुँच-मार्ग को दर्शाता है। ‘प्रवेश-मार्ग’ מְבוֹא को व्यक्त करता है और बिना निश्चित प्रमाण के केवल ‘फाटक’ नहीं मानता।
- source_word: בֵּית הַמֶּלֶךְ
  choice: राजमहल
  rationale: शाब्दिक अर्थ ‘राजा का घर’ है, किंतु इस ऐतिहासिक संदर्भ में आधुनिक हिन्दी का स्वाभाविक और स्पष्ट समतुल्य ‘राजमहल’ है।
- source_word: וַתּוּמַת
  choice: उसे मार डाला गया
  rationale: מות का होफ़ाल रूप कारणात्मक कर्मवाच्य है—उसे मृत्यु दी गई। ‘मार डाला गया’ केवल ‘मर गई’ की अपेक्षा निष्पादन का भाव स्पष्ट करता है।
- source_word: שָׁם
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण पूर्वोक्त राजमहल-क्षेत्र में निष्पादन होने पर बल देता है।
