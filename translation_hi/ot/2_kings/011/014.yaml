  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
translation:
  language: hi
  text: उसने देखा, तो राजा रीति के अनुसार खंभे के पास[a] खड़ा था। अधिकारी और तुरहियाँ राजा के पास थे, और देश के सब लोग आनंद मना रहे थे और तुरहियाँ फूँक रहे थे। तब अतल्याह ने अपने वस्त्र फाड़े और चिल्लाई[b], “षड्यंत्र! षड्यंत्र!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खंभे पर।” यहाँ प्रयुक्त इब्रानी संबंधबोधक के एक से अधिक स्थानीय अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “राजद्रोह! राजद्रोह!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  choice: उसने देखा कि
  rationale: हिन्दी में दृश्य के अचानक सामने आने का भाव स्वाभाविक कथात्मक रचना से व्यक्त किया गया है; अलग से ‘देखो’ जोड़ने पर वाक्य कृत्रिम होता।
- source_word: הַמֶּלֶךְ עֹמֵד
  choice: राजा ... खड़ा था
  rationale: कृदन्त चल रही अवस्था को दिखाता है; ‘खड़ा था’ इसे स्वाभाविक हिन्दी में रखता है।
- source_word: עַל הָעַמּוּד
  choice: खंभे के पास
  rationale: עַל यहाँ किसी निश्चित राजकीय खंभे अथवा स्थान से स्थानीय संबद्धता बता सकता है; ‘पास’ प्रसंग के अनुकूल है, जबकि अन्य स्थानीय अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: כַּמִּשְׁפָּט
  choice: रीति के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, स्थापित राजकीय प्रथा या विधि को दर्शाता है।
- source_word: וְהַשָּׂרִים
  choice: अधिकारी
  rationale: שָׂרִים नेतृत्व या पदाधिकारियों के लिए व्यापक शब्द है; ‘अधिकारी’ बिना पद को अनावश्यक रूप से निश्चित किए अर्थ देता है।
- source_word: וְהַחֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: इब्रानी पाठ सीधे वाद्ययंत्रों का नाम लेता है; उसे ‘तुरही बजानेवाले’ बनाकर निहित व्यक्तियों को स्पष्ट नहीं किया गया।
- source_word: אֶל הַמֶּלֶךְ
  choice: राजा के पास
  rationale: इस प्रसंग में אֶל निकट उपस्थिति का बोध कराता है।
- source_word: כָל עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: स्थिर इब्रानी अभिव्यक्ति को आधुनिक, सहज हिन्दी में प्रस्तुत किया गया है।
- source_word: שָׂמֵחַ וְתֹקֵעַ בַּחֲצֹצְרוֹת
  choice: आनन्द मना रहे थे और तुरहियाँ फूँक रहे थे
  rationale: सामूहिक उत्सव और तुरही बजाने की जारी क्रियाओं को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּקְרַע ... אֶת בְּגָדֶיהָ
  choice: अतल्याह ने अपने वस्त्र फाड़े
  rationale: शोक, भय या आक्रोश की पारंपरिक क्रिया को मूल के निकट और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: קֶשֶׁר קָשֶׁר
  choice: षड्यंत्र! षड्यंत्र!
  rationale: קֶשֶׁר विद्रोही साज़िश या षड्यंत्र को सूचित करता है; पुनरुक्ति से अतल्याह की तीखी पुकार सुरक्षित रहती है।
