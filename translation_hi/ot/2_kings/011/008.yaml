source:
  edition: WLC
  text: וְ/הִקַּפְתֶּ֨ם עַל הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/שְּׂדֵר֖וֹת יוּמָ֑ת וִ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/צֵאת֥/וֹ וּ/בְ/בֹאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
translation:
  language: hi
  text: तुम राजा को चारों ओर से घेरे रहना, और हर एक अपने हथियार हाथ में लिए रहे। जो कोई पहरेदारों की पंक्तियों[a] के भीतर आए, वह मार डाला जाए। राजा जब बाहर जाए और जब भीतर आए, तब तुम उसके साथ रहना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कतारों/पंक्तियों’। इब्रानी शब्द संभवतः पहरेदारों की व्यवस्थित पंक्तियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके बाहर जाने और उसके भीतर आने में’; यह राजा की सभी गतिविधियों में उसके साथ रहकर उसकी रक्षा करने का भाव देता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  choice: तुम राजा को चारों ओर से घेरे रहना
  rationale: हिफ़ील रूप और סָבִיב मिलकर राजा के चारों ओर सुरक्षात्मक घेरा बनाने का आदेश देते हैं। ‘घेरे रहना’ निरंतर पहरे का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  choice: हर एक अपने हथियार हाथ में लिए रहे
  rationale: אִישׁ यहाँ वितरणात्मक है, अर्थात दल का प्रत्येक पुरुष; सैन्य प्रसंग में כְּלִי का अर्थ ‘हथियार’ है। हिंदी में ‘हर एक’ अनावश्यक लिंग-भारीपन से बचते हुए व्यक्तिगत दायित्व बनाए रखता है।
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  choice: जो कोई पहरेदारों की पंक्तियों के भीतर आए
  rationale: लेखयुक्त कृदंत सामान्य रूप से ‘जो कोई आए’ का अर्थ देता है। שְׂדֵרוֹת व्यवस्थित पंक्तियों अथवा सैनिक कतारों को दर्शाता है; ‘पहरेदारों की पंक्तियाँ’ प्रसंग स्पष्ट करता है, जबकि फुटनोट में शाब्दिक विकल्प सुरक्षित है।
- source_word: יוּמָת
  choice: वह मार डाला जाए
  rationale: होफ़ाल रूप निष्क्रिय आदेश है। ‘मार डाला जाए’ तत्काल सुरक्षा-आदेश के प्रसंग में स्वाभाविक है और निष्क्रियता को बनाए रखता है।
- source_word: וִהְיוּ אֶת הַמֶּלֶךְ
  choice: तुम उसके साथ रहना
  rationale: यह पिछले आदेशों की शृंखला को आगे बढ़ाता है और राजा के साथ बने रहने तथा उसकी रक्षा करने का भाव देता है।
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  choice: राजा जब बाहर जाए और जब भीतर आए
  rationale: इब्रानी के ‘उसके निकलने और उसके आने’ को आधुनिक हिंदी में स्वाभाविक कालवाचक उपवाक्यों से व्यक्त किया गया है, जबकि दोनों दिशाओं का युग्म सुरक्षित है।
