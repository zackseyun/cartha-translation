  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוֹיָדָ֜ע אֶֽת הַ/בְּרִ֗ית בֵּ֤ין יְהוָה֙ וּ/בֵ֤ין הַ/מֶּ֨לֶךְ֙ וּ/בֵ֣ין הָ/עָ֔ם לִ/הְי֥וֹת לְ/עָ֖ם לַֽ/יהוָ֑ה וּ/בֵ֥ין הַ/מֶּ֖לֶךְ וּ/בֵ֥ין הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
translation:
  language: hi
  text: तब यहोयादा ने यहोवा, राजा और प्रजा के बीच वाचा बाँधी[a] कि वे यहोवा की प्रजा हों[b], और राजा और प्रजा के बीच भी वाचा बाँधी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “वाचा काटी”; यह वाचा बाँधने या स्थापित करने का प्रचलित मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “कि वे यहोवा के लिए एक प्रजा हों।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... אֶת הַבְּרִית
  choice: यह वाचा बाँधी
  rationale: כרת ברית वाचा स्थापित करने का प्रचलित इब्रानी मुहावरा है। हिंदी में ‘वाचा बाँधी’ स्वाभाविक, गरिमापूर्ण और औपचारिक वाचागत अर्थ को बनाए रखता है; संकेतवाचक ‘यह’ निश्चित पद הַבְּרִית को संदर्भानुकूल व्यक्त करता है।
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: यहोवा, राजा और प्रजा के बीच
  rationale: बार-बार आया בֵּין वाचा के पक्षों को चिह्नित करता है। हिंदी में एक बार ‘के बीच’ रखकर तीनों पक्षों को गिनाना अधिक स्वाभाविक है और त्रिपक्षीय संबंध सुरक्षित रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לִהְיוֹת לְעָם לַיהוָה
  choice: कि वे यहोवा की प्रजा हों
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम बताने वाला वाक्यांश है। ‘यहोवा की प्रजा’ संबंध और संबद्धता का स्वाभाविक हिंदी रूप है, जबकि पादटिप्पणी अधिक रूप-सन्निकट विकल्प सुरक्षित रखती है।
- source_word: וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  choice: और उसने राजा और प्रजा के बीच भी वाचा बाँधी
  rationale: मूल में दूसरी वाचागत व्यवस्था संक्षेप में दी गई है। हिंदी में क्रिया और कर्म को दोहराने से अर्थ स्पष्ट होता है; ‘भी’ अतिरिक्त संबंध को दर्शाता है।
- source_word: הָעָם
  choice: प्रजा
  rationale: राजकीय प्रसंग में עם के लिए ‘प्रजा’ स्वाभाविक है और सामूहिक वाचा-समुदाय को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत नाम को बनाए रखा गया है। ‘यहोवा’ आधुनिक हिंदी बाइबल-पाठकों में अधिक परिचित है; ‘याहवे’ स्रोत-उच्चारण का अधिक निकट लिप्यंतरण माना जाता है, पर पाठ में किसी उपाधि का प्रतिस्थापन नहीं किया गया।
- issue: לִהְיוֹת לְעָם לַיהוָה में संबंध का स्वरूप
  choice: कि वे यहोवा की प्रजा हों
  alternative: कि वे यहोवा के लिए एक प्रजा हों
  rationale: मुख्य पाठ में स्वाभाविक हिंदी के साथ वाचागत संबद्धता व्यक्त की गई है। स्रोत का לַ־ ‘के लिए/के प्रति’ रूपात्मक संभावना रखता है, इसलिए उसे पादटिप्पणी में दिया गया है और संबंध को अधिक विशिष्ट धार्मिक अर्थ से नहीं बाँधा गया।
- issue: एक वाचा के दो आयाम या दो वाचाएँ
  choice: दूसरे खंड में ‘वाचा बाँधी’ की पुनरावृत्ति
  alternative: ‘और राजा और प्रजा के बीच भी’
  rationale: इब्रानी में दूसरे खंड में संज्ञा और क्रिया अध्याहृत हैं। हिंदी में स्पष्टता के लिए उन्हें दोहराया गया है, पर इससे दो पूर्णतः असंबद्ध वाचाओं का दावा नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी और गरिमापूर्ण बाइबलीय शैली अपनाई गई है। ‘वाचा’ औपचारिक covenant अर्थ को बनाए रखता है; राजकीय संदर्भ में ‘लोगों’ के स्थान पर ‘प्रजा’ चुना गया है। वाक्य को सहज बनाने के लिए दूसरे खंड में अध्याहृत क्रिया और कर्म दोहराए गए हैं।
