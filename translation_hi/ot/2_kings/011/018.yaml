base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
translation:
  language: hi
  text: तब देश के सब लोग बाल के भवन[a] में गए और उसे ढा दिया। उन्होंने उसकी वेदियों और उसकी प्रतिमाओं[b] को पूरी तरह चकनाचूर कर दिया, और बाल के याजक मत्तान को वेदियों के सामने मार डाला। फिर याजक ने याहवे के भवन पर निरीक्षक नियुक्त किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाल का मन्दिर।” इब्रानी में शाब्दिक रूप से “बाल का घर।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसकी मूर्तियों” अथवा “उसकी आकृतियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  choice: देश के सब लोग
  rationale: यह राजनैतिक-सामाजिक हिब्रू अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और इसे केवल ‘साधारण लोगों’ तक सीमित नहीं करता।
- source_word: בֵּית הַבַּעַל
  choice: बाल का भवन
  rationale: ‘भवन’ मूल के ‘घर’ अर्थ को बनाए रखता है, जबकि प्रसंग से उपासना-स्थल स्पष्ट है; ‘मन्दिर’ वैकल्पिक रूप में पादटिप्पणी में दिया गया है।
- source_word: וַיִּתְּצֻהוּ
  choice: उसे ढा दिया
  rationale: क्रिया किसी भवन को गिराने या ध्वस्त करने का बोध कराती है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מִזְבְּחֹתָיו
  choice: उसकी वेदियों
  rationale: पुल्लिंग एकवचन प्रत्यय को बाल से संबद्ध रखते हुए मूल की व्यक्तिगत अभिव्यक्ति सुरक्षित की गई है।
- source_word: צְלָמָיו
  choice: उसकी प्रतिमाओं
  rationale: ‘प्रतिमा’ चित्र, मूर्ति या उपासना-संबंधी आकृति का व्यापक अर्थ देता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: שִׁבְּרוּ הֵיטֵב
  choice: पूरी तरह चकनाचूर कर दिया
  rationale: क्रिया और तीव्रतासूचक क्रियाविशेषण दोनों को स्वाभाविक हिन्दी में प्रभावपूर्ण ढंग से व्यक्त करता है।
- source_word: מַתָּן כֹּהֵן הַבַּעַל
  choice: बाल के याजक मत्तान
  rationale: व्यक्ति के नाम और उसके धार्मिक पद की सीधी पहचान देता है।
- source_word: לִפְנֵי הַמִּזְבְּחוֹת
  choice: वेदियों के सामने
  rationale: לִפְנֵי का स्थान-संबंधी अर्थ बिना अतिरिक्त विशिष्टीकरण के सुरक्षित है।
- source_word: פְּקֻדּוֹת
  choice: निरीक्षक
  rationale: यह बहुअर्थी संज्ञा दायित्व, पद या नियुक्त पर्यवेक्षकों का संकेत दे सकती है; इस प्रशासनिक प्रसंग में व्यक्तियों के रूप में ‘निरीक्षक’ सर्वाधिक स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: पहले आए ‘बाल के भवन’ के साथ संरचनात्मक समानता रखते हुए יהוה को हिन्दी में प्रचलित व्यक्तिनाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिनाम प्रत्यक्ष है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और ‘प्रभु’ की उपाधि के पीछे नाम को छिपाता नहीं; ‘याहवे’ निकटतर पुनर्निर्मित उच्चारण है, पर हिन्दी सामान्य पाठक के लिए कम प्रचलित है।
- issue: פְּקֻדּוֹת का व्यक्ति या दायित्व के रूप में अर्थ
  choice: निरीक्षक नियुक्त किए
  alternative: व्यवस्थाएँ ठहराईं; पहरेदार नियुक्त किए
  rationale: शब्द पदों, दायित्वों अथवा नियुक्त अधिकारियों को सूचित कर सकता है। निकटवर्ती मन्दिर-व्यवस्था के प्रसंग में ‘निरीक्षक’ उचित है, पर मूल की अर्थ-सीमा पूर्णतः निश्चित नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। ‘भवन’ दोनों उपासना-स्थलों के लिए मूल की समानांतर शब्दावली सुरक्षित करता है; ‘याजक’, ‘वेदी’ और ‘प्रतिमा’ स्थापित बाइबलीय शब्द हैं।
