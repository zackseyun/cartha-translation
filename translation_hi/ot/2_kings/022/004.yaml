source:
  edition: WLC
  text: עֲלֵ֗ה אֶל חִלְקִיָּ֨הוּ֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְ/יַתֵּ֣ם אֶת הַ/כֶּ֔סֶף הַ/מּוּבָ֖א בֵּ֣ית יְהוָ֑ה אֲשֶׁ֥ר אָסְפ֛וּ שֹׁמְרֵ֥י הַ/סַּ֖ף מֵ/אֵ֥ת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/004.yaml
  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
translation:
  language: hi
  text: “महायाजक हिल्किय्याह के पास ऊपर जा और उससे कह कि वह याहवे के भवन में लाई गई चाँदी का हिसाब पूरा करे, जिसे देहरी के रखवालों[a] ने लोगों से इकट्ठा किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “द्वारपालों”; शाब्दिक अर्थ, “देहरी के रखवाले”।
    reason: शाब्दिक अभिव्यक्ति सम्भवतः मंदिर के द्वारपालों के पद को सूचित करती है।
lexical_decisions:
- source_word: עֲלֵה
  choice: ऊपर जा
  rationale: आज्ञार्थक क्रिया में ऊपर जाने की दिशात्मक छाया है; मंदिर की ओर जाने के संदर्भ में ‘ऊपर जा’ स्वाभाविक है।
- source_word: חִלְקִיָּהוּ הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक हिल्किय्याह
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है और प्रचलित पदवी ‘महायाजक’ रखी गई है।
- source_word: וְיַתֵּם אֶת הַכֶּסֶף
  choice: उससे कह कि वह ... चाँदी का हिसाब पूरा करे
  rationale: हिफ़ील रूप यहाँ संचित धन की गणना या लेखा पूरा करने का प्रशासनिक भाव देता है। हिन्दी में अप्रत्यक्ष आज्ञा स्पष्ट करने के लिए ‘उससे कह कि’ जोड़ा गया है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: मूल शब्द का ठोस अर्थ ‘चाँदी’ है, जो यहाँ मुद्रा के रूप में प्रयुक्त है; मूल की छवि सुरक्षित रखी गई है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ मूल के ‘घर’ को मंदिर-संदर्भ में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: שֹׁמְרֵי הַסַּף
  choice: देहरी के रखवाले
  rationale: मूल अभिव्यक्ति का शाब्दिक रूप रखा गया है; सम्भावित पदनाम ‘द्वारपाल’ पादटिप्पणी में दिया गया है।
- source_word: מֵאֵת הָעָם
  choice: लोगों से
  rationale: यह स्रोत के व्यापक सामूहिक अर्थ को बिना अनावश्यक संकुचन के सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसे किसी उपाधि से प्रतिस्थापित न करके लिप्यंतरित किया गया है।
- issue: וְיַתֵּם का प्रशासनिक अर्थ
  choice: चाँदी का हिसाब पूरा करे
  alternative: चाँदी सौंप दे / चाँदी का कुल जोड़े
  rationale: क्रिया में ‘पूरा करने’ का मूल भाव है और प्रसंग धन के लेखे का है। यह अनुवाद गणना की सम्भावना को व्यक्त करता है, पर क्रिया को केवल अंक जोड़ने तक अत्यधिक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। राजकीय आज्ञा का प्रत्यक्ष आदेश बनाए रखा गया है; ‘उससे कह कि’ हिन्दी में दूसरे व्यक्ति से तीसरे व्यक्ति के लिए दी गई आज्ञा को स्वाभाविक बनाता है।
