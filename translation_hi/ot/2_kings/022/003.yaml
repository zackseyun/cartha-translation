source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: In the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
translation:
  language: hi
  text: 'राजा योशियाह के शासन के अठारहवें वर्ष में, राजा ने मशुल्लाम के पुत्र अज़ल्याह के पुत्र, सचिव शापान को याहवे के भवन[a] में यह कहकर भेजा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के मंदिर में।” शाब्दिक अर्थ, “याहवे के घर में।”
    reason: ‘भवन/घर’ मूल शब्द का सीधा अर्थ है, जबकि संदर्भ में उससे मंदिर अभिप्रेत है।
lexical_decisions:
- source_word: וַיְהִי
  choice: के शासन के ... वर्ष में
  rationale: यह कथात्मक सूत्र नए प्रसंग को आगे बढ़ाते हुए समय बताता है। हिंदी में अलग से ‘और ऐसा हुआ’ जोड़ने के बजाय काल-वाक्यांश में इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה לַמֶּלֶךְ יֹאשִׁיָּהוּ
  choice: राजा योशियाह के शासन के अठारहवें वर्ष में
  rationale: यह राजकीय वर्ष बताने वाला मानक सूत्र है; ‘के शासन के’ से स्पष्ट होता है कि बात योशियाह की आयु की नहीं, उसके राज्यकाल की है।
- source_word: שָׁלַח הַמֶּלֶךְ
  choice: राजा ने ... भेजा
  rationale: इब्रानी में ‘राजा’ दोबारा आया है, इसलिए पुनरुक्ति को बनाए रखा गया है।
- source_word: שָׁפָן בֶּן אֲצַלְיָהוּ בֶן מְשֻׁלָּם
  choice: मशुल्लाम के पोते और असल्याह के पुत्र शापान
  rationale: वंशावली-संबंधों को स्वाभाविक हिंदी क्रम में रखते हुए पिता और दादा दोनों की पहचान सुरक्षित रखी गई है।
- source_word: הַסֹּפֵר
  choice: सचिव
  rationale: इस राजकीय प्रसंग में סֹפֵר किसी लिखने-पढ़ने वाले अधिकारी अथवा सचिव को सूचित कर सकता है। ‘शास्त्री’ धार्मिक व्याख्याता का अनचाहा आभास दे सकता है, इसलिए ‘सचिव’ चुना गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: शाब्दिक अर्थ ‘याहवे का घर/भवन’ है। ‘भवन’ मूल रूपक को बनाए रखता है और यहाँ मंदिर का बोध भी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: לֵאמֹר
  choice: 'यह कहकर ... भेजा:'
  rationale: अगले पद में आने वाले संदेश की भूमिका को हिंदी में स्वाभाविक ढंग से व्यक्त करता है; द्विबिंदु आगे के कथन की ओर संकेत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और आधुनिक विद्वत्तापूर्ण पुनर्निर्मित उच्चारण के निकट है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण कथात्मक शैली। वंशावली को हिंदी के स्वाभाविक दादा-पिता क्रम में रखा गया है। पद अगले पद के प्रत्यक्ष कथन की भूमिका है, इसलिए अंत में द्विबिंदु रखा गया है।
