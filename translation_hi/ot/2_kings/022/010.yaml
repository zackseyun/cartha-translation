base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
translation:
  language: hi
  text: तब राजकीय सचिव शापान ने राजा को बताया, “याजक हिल्कियाह ने मुझे एक पुस्तक[a] दी है।” फिर शापान ने उसे राजा के सामने पढ़कर सुनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ग्रंथ-रोल।” इब्रानी शब्द सामान्य रूप से किसी लिखित दस्तावेज़ को दर्शा सकता है और स्वयं उसके भौतिक रूप को निश्चित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: हिफ़ील रूप का अर्थ किसी बात को ज्ञात कराना या बताना है। कथा के राजदरबारी प्रसंग में ‘बताया’ स्वाभाविक और अर्थ-सटीक है।
- source_word: הַסֹּפֵר
  choice: राजकीय सचिव
  rationale: סֹפֵר लेखक या लिपिक के साथ राजकीय अधिकारी अथवा सचिव को भी दर्शा सकता है। यहाँ राजा के दरबार का प्रसंग है, इसलिए ‘राजकीय सचिव’ आधुनिक पाठक को पद की भूमिका स्पष्ट करता है।
- source_word: סֵפֶר
  choice: एक पुस्तक
  rationale: סֵפֶר लिखित दस्तावेज़ या पुस्तक के लिए व्यापक शब्द है और इसके भौतिक रूप को निश्चित नहीं करता। अनिश्चित रूप को बनाए रखने के लिए ‘एक पुस्तक’ चुना गया है।
- source_word: נָתַן לִי
  choice: मुझे ... दी है
  rationale: पूर्ण हो चुकी क्रिया का वर्तमान प्रसंग से संबंध है; हिन्दी का पूर्ण वर्तमान रूप इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְרָאֵהוּ
  choice: उसे ... पढ़कर सुनाया
  rationale: लिखित वस्तु के साथ קרא यहाँ ऊँचे स्वर में पढ़ने का भाव रखता है। ‘पढ़कर सुनाया’ हिन्दी में इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने
  rationale: यह किसी की उपस्थिति में कार्य करने का सामान्य इब्रानी मुहावरा है; ‘राजा के सामने’ उसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: חִלְקִיָּה
  choice: हिल्कियाह
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: שָׁפָן
  choice: शापान
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
