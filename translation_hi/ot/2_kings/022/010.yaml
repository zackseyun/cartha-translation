  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन को हिन्दी में स्वाभाविक बनाने के लिए לֵאמֹר का अलग से शब्दशः अनुवाद नहीं किया गया। राजदरबारी भूमिका स्पष्ट करने के लिए ‘राजकीय सचिव’ और मौखिक पठन व्यक्त करने के लिए ‘पढ़कर सुनाया’ चुना गया है।
