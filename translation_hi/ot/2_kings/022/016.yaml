source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “देखो, मैं इस स्थान और इसके निवासियों पर विपत्ति[a] लाने वाला हूँ—इस पुस्तक के सभी वचन, जो यहूदा के राजा ने पढ़े हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विपदा”; यहाँ इब्रानी רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि न्यायस्वरूप आने वाली विपत्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं का पारंपरिक संदेशवाहक-सूत्र है। ‘यों कहता है’ उसके गरिमापूर्ण प्रत्यक्ष उद्घोष को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है, और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह शब्द घोषणा की गंभीरता और आसन्नता की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מֵבִיא
  choice: लाने वाला हूँ
  rationale: इब्रानी कृदंत आसन्न कार्रवाई व्यक्त करता है। ‘लाने वाला हूँ’ हिन्दी में उस निकट और निश्चित कार्रवाई को ‘लाऊँगा’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: इस न्याय-संदर्भ में शब्द का अर्थ नैतिक बुराई नहीं, बल्कि दंडस्वरूप आने वाली विपदा है। ‘विपत्ति’ आधुनिक, गरिमापूर्ण और सुस्पष्ट है।
- source_word: אֶל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: इस स्थान और इसके निवासियों पर
  rationale: न्याय लाने के लक्ष्य को हिन्दी में ‘पर’ स्वाभाविक ढंग से व्यक्त करता है; ‘निवासियों’ मूल के ‘उसमें रहने वालों’ का संक्षिप्त और औपचारिक समतुल्य है।
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  choice: इस पुस्तक के वे सभी वचन
  rationale: ‘वचन’ דְּבָרִים की औपचारिक निकटता और वाचा के दंड-वचनों से संबंध बनाए रखता है। डैश इस पदबंध को घोषित विपत्ति के विवरण के रूप में जोड़ता है, बिना संबंध को अधिक व्याख्यायित किए।
- source_word: אֲשֶׁר קָרָא מֶלֶךְ יְהוּדָה
  choice: जो यहूदा के राजा ने पढ़े हैं
  rationale: यह सापेक्ष उपवाक्य पुस्तक के वचनों को विशेषित करता है। पूर्ण वर्तमान निकट अतीत की उस क्रिया की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: न्याय-संदर्भ में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; विपदा
  rationale: यहाँ याहवे नैतिक बुराई करने की नहीं, वाचा-भंग के दंडस्वरूप विपत्ति लाने की घोषणा करता है। ‘विपत्ति’ इस संदर्भगत अर्थ को स्पष्ट रखता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि में बदले बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: ‘पुस्तक के सभी वचन’ और ‘विपत्ति’ का वाक्यगत संबंध
  choice: डैश द्वारा व्याख्यात्मक समानाधिकरण
  alternative: ‘अर्थात्’ जोड़ना; इसे अलग कर्म मानना
  rationale: אֵת כָּל דִּבְרֵי הַסֵּפֶר पहले घोषित רָעָה को विस्तार से बताता प्रतीत होता है, पर मूल संबंध कुछ संक्षिप्त है। डैश इस संबंध को बनाए रखता है और ‘अर्थात्’ जैसी अतिरिक्त स्पष्टता थोपता नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वक्तात्मक शैली रखती है। ‘यों कहता है’ और ‘वचन’ औपचारिक स्वर देते हैं, जबकि ‘देखो’ तथा शेष वाक्यरचना सामान्य पाठक के लिए सहज हैं।
