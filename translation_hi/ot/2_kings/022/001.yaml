base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/001.yaml
  text: Josiah was eight years old when he began to reign, and he reigned thirty-one years in Jerusalem. His mother’s name was Jedidah daughter of Adaiah, from Bozkath.
translation:
  language: hi
  text: योशिय्याह आठ वर्ष का था जब वह राजा बना, और उसने यरूशलेम में इकतीस वर्ष तक राज्य किया। उसकी माता का नाम यदीदा था; वह बोसकत के रहने वाले अदाया की बेटी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁמֹנֶה שָׁנָה
  choice: आठ वर्ष का था
  rationale: यह इब्रानी आयु-सूचक मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप है और सटीक आयु बनाए रखता है।
- source_word: בְמָלְכוֹ
  choice: जब वह राजा बना
  rationale: यह रूप उसके राजारोहण के समय को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁלֹשִׁים וְאַחַת שָׁנָה מָלַךְ
  choice: उसने ... इकतीस वर्ष तक राज्य किया
  rationale: इब्रानी राजकीय सारांश को सहज हिन्दी में व्यक्त करते हुए शासन की अवधि और क्रिया दोनों सुरक्षित रखी गई हैं।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह शासन-स्थान बताने वाला सीधा स्थानवाचक अनुवाद है।
- source_word: וְשֵׁם אִמּוֹ יְדִידָה
  choice: उसकी माता का नाम यदीदा था
  rationale: वंश-संबंधी सूत्र को गरिमापूर्ण और वर्तमान मानक हिन्दी में रखा गया है; व्यक्ति-नाम का लिप्यंतरण किया गया है।
- source_word: בַת עֲדָיָה
  choice: अदाया की बेटी
  rationale: यह पुत्री-संबंध का स्वाभाविक हिन्दी रूप है और व्यक्ति-नाम को लिप्यंतरित करता है।
- source_word: מִבָּצְקַת
  choice: बोसकत के
  rationale: מִן मूल स्थान को सूचित करता है; हिन्दी वाक्य-विन्यास में ‘बोसकत के अदाया’ स्वाभाविक रूप से अदाया की स्थान-संबद्धता व्यक्त करता है।
