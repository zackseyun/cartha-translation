  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
translation:
  language: hi
  text: और वह उसे याहवे के भवन में नियुक्त किए गए काम करनेवालों के हाथों में सौंप दे[a]; फिर वे उसे याहवे के भवन में काम करनेवालों को दें, ताकि वे भवन की क्षति की मरम्मत करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे काम करनेवालों के हाथों में दे।” यह किसी वस्तु को उनकी देखरेख में सौंपने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “भवन की क्षति को मजबूत करें।” इसका आशय क्षतिग्रस्त हिस्सों की मरम्मत करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתנה עַל יַד
  choice: वह उसे…के हाथ में सौंप दे
  rationale: נתן का मूल अर्थ ‘देना’ है, पर עַל יַד के साथ यह किसी वस्तु को दूसरे की देखरेख या अधिकार में सौंपने का मुहावरा है। निर्देशात्मक क्रियारूप को ‘सौंप दे’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवाले
  rationale: शाब्दिक अर्थ ‘काम करनेवाले’ है। यह अनुवाद दोनों बार आए समान इब्रानी पद को समान रखता है और बिना प्रमाण उन्हें केवल मजदूर या अधिकारी नहीं ठहराता।
- source_word: הַמֻּפְקָדִים
  choice: नियुक्त
  rationale: यह פקד का कर्मवाच्य रूप है और उन लोगों को सूचित करता है जिन्हें इस काम के लिए नियुक्त अथवा उत्तरदायी ठहराया गया था। ‘नियुक्त’ कर्मवाच्य भाव बनाए रखता है।
- source_word: בבית יהוה
  choice: याहवे के भवन में
  rationale: בית का मूल अर्थ ‘घर/भवन’ है और यहाँ वह मन्दिर को सूचित करता है। ‘भवन’ मूल शब्द से निकट रहते हुए आधुनिक हिन्दी में धार्मिक इमारत के संदर्भ में स्वाभाविक है।
- source_word: ויתנו אתו
  choice: फिर वे उसे…दें
  rationale: बहुवचन क्रिया धन को नियुक्त लोगों से वास्तविक काम करनेवालों तक दिए जाने की अगली कड़ी बताती है। ‘फिर’ क्रम को स्पष्ट करता है, जबकि ‘दें’ निर्देशात्मक बल बनाए रखता है।
- source_word: לחזק בדק הבית
  choice: भवन की टूट-फूट की मरम्मत करें
  rationale: חזק का मूल अर्थ ‘मजबूत करना’ और בדק का अर्थ भवन की दरार, क्षति या टूट-फूट है। निर्माण-संदर्भ में संयुक्त अभिव्यक्ति का स्वाभाविक आशय क्षतिग्रस्त हिस्सों की मरम्मत करना है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम יהוה स्पष्ट रूप से है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण मानक हिन्दी अपनाई गई है। ‘काम करनेवाले’ दोनों समान इब्रानी पदों के लिए रखा गया है; पहले समूह को केवल विशेषण ‘नियुक्त’ अलग करता है। ‘भवन’ से मन्दिर का संदर्भ स्पष्ट रहता है और בית की शब्दावली भी सुरक्षित रहती है।
