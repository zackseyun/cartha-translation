  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/כָל דֶּ֨רֶךְ֙ דָּוִ֣ד אָבִ֔י/ו וְ/לֹא סָ֖ר יָמִ֥ין וּ/שְׂמֹֽאול־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
translation:
  language: hi
  text: उसने वही किया जो याहवे की दृष्टि में सही था। वह अपने पूर्वज दाऊद[a] के पूरे मार्ग पर चला और न दाएँ मुड़ा, न बाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दाऊद उसका पिता” है; यहाँ “पिता” का अर्थ राजवंशीय पूर्वज है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ הַיָּשָׁר
  choice: उसने वही किया जो ... सही था
  rationale: लेखयुक्त विशेषण הַיָּשָׁר यहाँ संज्ञा-सदृश है; यह अनुवाद नैतिक मूल्यांकन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मूल्यांकन-सूचक मुहावरे की दृष्टि-छवि बनाए रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप में प्रस्तुत किया गया है।
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: पूरे मार्ग पर चला
  rationale: चलने और मार्ग की मूल रूपक-छवि सुरक्षित रहती है; בְּכָל का अर्थ उस मार्ग का पूर्णतः अनुसरण करना है।
- source_word: דָּוִד אָבִיו
  choice: अपने पूर्वज दाऊद
  rationale: אָב यहाँ निकट जन्मदाता नहीं, राजवंशीय पूर्वज को दर्शाता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है, जबकि पादटिप्पणी मूल अभिव्यक्ति बताती है।
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  choice: और न दाएँ मुड़ा, न बाएँ
  rationale: यह मार्ग से तनिक भी विचलित न होने का स्थिर रूपक है; संक्षिप्त समानांतर हिन्दी मूल की लय और अर्थ दोनों रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: दाऊद को אָבִיו कहना
  choice: मुख्य पाठ में ‘पूर्वज’, पादटिप्पणी में शाब्दिक ‘पिता’
  alternative: दाऊद, उसके पिता
  rationale: योशिय्याह का तत्कालीन पिता आमोन था; यहाँ ‘पिता’ वंशीय अर्थ में है। ‘पूर्वज’ ऐतिहासिक भ्रांति से बचाता है और पादटिप्पणी स्रोत की शब्दावली सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘दृष्टि’, ‘मार्ग’ और दाएँ-बाएँ मुड़ने की परस्पर जुड़ी मूल रूपक-छवियाँ यथासंभव सुरक्षित हैं।
