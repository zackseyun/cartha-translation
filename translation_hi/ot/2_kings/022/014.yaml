base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
translation:
  language: hi
  text: तब हिल्किय्याह याजक, अहीकाम, अकबोर, शापान और असायाह हुल्दा भविष्यद्वक्त्री के पास गए। वह शल्लूम की पत्नी थी; शल्लूम तिकवा का पुत्र, हरहस का पुत्र और वस्त्रों का रखवाला था। वह यरूशलेम के दूसरे नगर-भाग[b] में रहती थी, और उन्होंने उससे बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “दूसरे विभाग”; इब्रानी शब्द संभवतः यरूशलेम के किसी विशेष नगर-भाग को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब ... गए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है। एकवचन क्रिया के बाद अनेक व्यक्तियों की सूची है, इसलिए हिन्दी में बहुवचन ‘गए’ स्वाभाविक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: मूल पाठ केवल ‘याजक’ कहता है; प्रसंग के आधार पर ‘महायाजक’ नहीं जोड़ा गया।
- source_word: חֻלְדָּה הַנְּבִיאָה
  choice: हुल्दा भविष्यद्वक्त्री
  rationale: इब्रानी संज्ञा स्त्रीलिंग है; ‘भविष्यद्वक्त्री’ इस पहचान को स्पष्ट और सम्मानजनक हिन्दी में बनाए रखता है।
- source_word: אֵשֶׁת שַׁלֻּם
  choice: शल्लूम की पत्नी
  rationale: यह संबंधवाचक रचना सीधे वैवाहिक संबंध बताती है।
- source_word: בֶּן תִּקְוָה בֶּן חַרְחַס
  choice: तिकवा का पुत्र और हरहस का पोता
  rationale: इब्रानी वंशावली की कड़ियों को स्वाभाविक हिन्दी में स्पष्ट किया गया है; दूसरा ‘पुत्र’ शल्लूम के पिता तिकवा के संबंध में हरहस को दर्शाता है।
- source_word: שֹׁמֵר הַבְּגָדִים
  choice: वस्त्रागार का रखवाला
  rationale: शाब्दिक अर्थ ‘वस्त्रों का रखवाला’ है। ‘वस्त्रागार का रखवाला’ संभावित आधिकारिक दायित्व को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְהִיא יֹשֶׁבֶת
  choice: वह ... रहती थी
  rationale: यहाँ יָשַׁב निवास करने के अर्थ में है; ‘रहती थी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּמִּשְׁנֶה
  choice: दूसरे मुहल्ले में
  rationale: यह संभवतः यरूशलेम के किसी विशेष दूसरे नगर-भाग का नाम या वर्णन है। मूल की सीमित निश्चितता बनाए रखने के लिए वैकल्पिक ‘दूसरे विभाग’ को पादटिप्पणी में दिया गया है।
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  choice: उन्होंने उससे बात की
  rationale: मूल वाक्यांश उसके प्रति सीधे संबोधन या संवाद को दर्शाता है; यह हिन्दी में स्वाभाविक और मूल के निकट है।
theological_decisions:
- issue: हिल्किय्याह की पदवी को बढ़ाकर ‘महायाजक’ कहना या न कहना
  choice: याजक
  alternative: महायाजक
  rationale: इस पद में इब्रानी पाठ केवल ‘याजक’ कहता है। अन्य प्रसंगों की जानकारी के आधार पर पदवी को नहीं बढ़ाया गया।
- issue: हुल्दा के स्त्रीलिंग भविष्यद्वक्ता-पद का अनुवाद
  choice: भविष्यद्वक्त्री
  alternative: भविष्यद्वक्ता
  rationale: मूल इब्रानी रूप स्पष्टतः स्त्रीलिंग है; हिन्दी रूप उसी तथ्य को सुरक्षित रखता है और हुल्दा की भविष्यसूचक भूमिका को कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। वंशावली को हिन्दी पाठक के लिए ‘पुत्र’ और ‘पोता’ के रूप में स्पष्ट किया गया है। नामों का देवनागरी लिप्यंतरण इब्रानी रूपों के निकट रखा गया है।
