  text: And when the king heard the words of the Book of the Law[a], he tore his clothes.
translation:
  language: hi
  text: जब राजा ने व्यवस्था की पुस्तक[a] के वचन सुने, तो उसने अपने वस्त्र फाड़ लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘व्यवस्था का ग्रंथपत्र।’ इब्रानी शब्द סֵפֶר किसी लिखित पुस्तक या ग्रंथपत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: जब ... ने ... सुने
  rationale: यह रचना कथा में अगली घटना की समयगत परिस्थिति बताती है। हिन्दी में ‘जब’ इसे स्वाभाविक रूप से व्यक्त करता है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक रूप से बोझिल होता।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित संज्ञा का प्रसंगानुकूल और सीधा हिन्दी रूप।
- source_word: דִּבְרֵי
  choice: वचन
  rationale: यहाँ शब्द लिखित दस्तावेज़ में पढ़ी गई बातों को सूचित करता है। ‘वचन’ मूल के औपचारिक संबंध और प्रसंग की गरिमा को बनाए रखता है।
- source_word: סֵפֶר הַתּוֹרָה
  choice: व्यवस्था की पुस्तक
  rationale: סֵפֶר पुस्तक अथवा लिखित ग्रंथ/लपेटे हुए पत्र को सूचित कर सकता है, जबकि תּוֹרָה यहाँ वाचा-संबंधी व्यवस्था के ग्रंथ को दर्शाता है। यह हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: וַיִּקְרַע
  choice: फाड़ लिए
  rationale: קרע वस्त्र फाड़ने की क्रिया है, जो यहाँ शोक और भय की प्रतिक्रिया है। संयुक्त रूप ‘फाड़ लिए’ हिन्दी में पूर्ण और स्वाभाविक अभिव्यक्ति देता है।
- source_word: בְּגָדָיו
  choice: अपने वस्त्र
  rationale: प्रत्यय राजा के अपने कपड़ों को दर्शाता है। ‘वस्त्र’ आधुनिक हिन्दी में समझने योग्य होने के साथ प्रसंग की गरिमा बनाए रखता है।
