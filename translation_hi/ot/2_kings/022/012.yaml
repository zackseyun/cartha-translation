base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
translation:
  language: hi
  text: 'तब राजा ने हिल्किय्याह याजक[a], शापान के पुत्र अहीकाम, मीकायाह के पुत्र अकबोर, लेखक शापान[b] और राजा के सेवक असायाह[c] को यह आज्ञा दी:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “हिल्किय्याह याजक” है; “महायाजक” स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “सचिव शापान।” इब्रानी शब्द राजकीय लेखक अथवा प्रशासनिक सचिव के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “राजा के अधिकारी असायाह।” इब्रानी में शाब्दिक अर्थ “सेवक” है, पर राजदरबार में यह राजा की सेवा में नियुक्त अधिकारी को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה राजकीय अधिकार के साथ आदेश देने को व्यक्त करती है; ‘आज्ञा दी’ स्वाभाविक और अर्थानुकूल हिन्दी है।
- source_word: חִלְקִיָּה הַכֹּהֵן
  choice: हिल्किय्याह याजक
  rationale: मूल पाठ में केवल ‘याजक’ है, ‘महायाजक’ नहीं; इसलिए पदवी को बढ़ाकर नहीं कहा गया।
- source_word: בֶּן
  choice: के पुत्र
  rationale: व्यक्तियों की वंशगत पहचान में בן का स्वाभाविक हिन्दी रूप।
- source_word: שָׁפָן הַסֹּפֵר
  choice: शापान सचिव
  rationale: राजदरबार के संदर्भ में סֹפֵר लिखने-पढ़ने और प्रशासन का दायित्व निभाने वाले सचिव को सूचित कर सकता है; ‘सचिव’ आधुनिक पाठक के लिए सहज है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֲשָׂיָה עֶבֶד הַמֶּלֶךְ
  choice: राजा के सेवक असायाह
  rationale: עֶבֶד का सीधा अर्थ ‘सेवक’ है; राजदरबार में यह राजकीय अधिकारी भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा दी:'
  rationale: यह रूप अगले पद में आने वाली आज्ञा की विषयवस्तु से स्वाभाविक रूप से जोड़ता है और हिन्दी में अनावश्यक ‘कहते हुए’ से बचता है।
theological_decisions:
- issue: हिल्किय्याह की याजकीय पदवी
  choice: याजक
  alternative: महायाजक
  rationale: इस पद के इब्रानी पाठ הַכֹּהֵן में ‘महायाजक’ स्पष्ट रूप से नहीं है; संदर्भ के आधार पर ऊँची पदवी जोड़ना मूल की सीमा से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। नामों का देवनागरी लिप्यंतरण इब्रानी रूपों के निकट है। सूची की स्पष्टता बनाए रखते हुए לֵאמֹר को अगले पद से जोड़ने के लिए अंत में द्विबिंदु रखा गया है।
