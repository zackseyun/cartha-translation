  text: יַ֠עַן רַךְ לְבָ֨בְ/ךָ֜ וַ/תִּכָּנַ֣ע מִ/פְּנֵ֣י יְהוָ֗ה בְּֽ/שָׁמְעֲ/ךָ֡ אֲשֶׁ֣ר דִּבַּרְתִּי֩ עַל הַ/מָּק֨וֹם הַ/זֶּ֜ה וְ/עַל יֹשְׁבָ֗י/ו לִ/הְי֤וֹת לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֔ה וַ/תִּקְרַע֙ אֶת בְּגָדֶ֔י/ךָ וַ/תִּבְכֶּ֖ה לְ/פָנָ֑/י וְ/גַ֧ם אָנֹכִ֛י שָׁמַ֖עְתִּי נְאֻם יְהוָֽה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
translation:
  language: hi
  text: क्योंकि तुम्हारा मन कोमल था, और जब तुमने वह बात सुनी जो मैंने इस स्थान और इसके निवासियों के विरुद्ध कही थी—कि वे उजाड़ और शाप का कारण बनेंगे—तब तुमने याहवे के सामने अपने आप को नम्र किया, अपने वस्त्र फाड़े और मेरे सामने रोए, इसलिए मैंने भी तुम्हारी बात सुनी है—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह परमेश्वर की अनुकूल प्रतिक्रिया का कारण प्रस्तुत करता है और इब्रानी की कारणसूचक शक्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: רַךְ לְבָבְךָ
  choice: तुम्हारा मन कोमल हो गया
  rationale: इब्रानी रूपक भीतरी संवेदनशीलता और पश्चात्ताप के लिए तत्परता दर्शाता है; ‘मन कोमल’ रूपक को सुरक्षित रखते हुए हिंदी में सहज है।
- source_word: וַתִּכָּנַע
  choice: तुमने अपने आपको दीन किया
  rationale: यह स्वेच्छा से स्वयं को नम्र करने का भाव व्यक्त करता है और प्रतिवर्ती अर्थ को स्पष्ट रखता है।
- source_word: מִפְּנֵי יְהוָה
  choice: याहवे के सामने
  rationale: ‘मुख के सामने’ वाले इब्रानी मुहावरे को परमेश्वर की उपस्थिति के अर्थ में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּשָׁמְעֲךָ
  choice: जब तुमने ... सुनी
  rationale: पूर्वसर्गयुक्त infinitive construct का काल-सूचक परिस्थितिजन्य अर्थ हिंदी में सहज रूप से व्यक्त होता है।
- source_word: אֲשֶׁר דִּבַּרְתִּי
  choice: वह बात ... जो मैंने ... कही थी
  rationale: यह याहवे की कही हुई न्याय-वाणी की विषयवस्तु को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: עַל הַמָּקוֹם הַזֶּה וְעַל יֹשְׁבָיו
  choice: इस स्थान और इसके निवासियों के विरुद्ध
  rationale: न्याय की इस पृष्ठभूमि में עַל का विरोधात्मक अर्थ है; ‘के विरुद्ध’ धमकी के बल को सुरक्षित रखता है।
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
  choice: कि वे उजाड़ और अभिशाप हो जाएँगे
  rationale: यह घोषित न्याय के परिणाम को संक्षेप में व्यक्त करता है। שַׁמָּה की अर्थ-सीमा को फुटनोट में सुरक्षित रखा गया है, जबकि קְלָלָה के लिए ‘अभिशाप’ गरिमापूर्ण और स्पष्ट है।
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
  choice: अपने वस्त्र फाड़े
  rationale: शोक और पश्चात्ताप की प्रचलित क्रिया को ‘वस्त्र’ के गरिमापूर्ण, सामान्य शब्द से व्यक्त किया गया है।
- source_word: וַתִּבְכֶּה לְפָנָי
  choice: मेरे सामने रोए
  rationale: यह शोकपूर्ण रोने और परमेश्वर के समक्ष उसकी व्यक्तिगत दिशा, दोनों को सुरक्षित रखता है।
- source_word: וְגַם אָנֹכִי שָׁמַעְתִּי
  choice: मैंने भी तुम्हारी सुन ली है
  rationale: גַם और बलयुक्त אָנֹכִי से व्यक्त प्रत्युत्तर को ‘भी’ सुरक्षित रखता है; प्रसंग में निहित कर्म ‘तुम्हारी’ हिंदी में स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: यह गंभीर भविष्यवाणी-सूत्र को स्पष्ट, वर्तमान और गरिमापूर्ण हिंदी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका नाम के रूप में लिप्यंतरण करता है, उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: योशिय्याह की प्रतिक्रिया और याहवे के सुनने का संबंध
  choice: कारणसूचक संबंध को ‘क्योंकि ... इसलिए’ से स्पष्ट रखा
  alternative: दोनों को केवल क्रमिक घटनाओं की तरह प्रस्तुत करना
  rationale: יַעַן वाक्य को स्पष्ट कारणसूचक बनाता है और וְגַם אָנֹכִי शाही प्रतिक्रिया तथा ईश्वरीय प्रत्युत्तर के बीच अनुरूपता दिखाता है; अनुवाद इसे बनाए रखता है, बिना उद्धार या योग्यता संबंधी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य शब्दावली रखी गई है। लंबे इब्रानी कारणसूचक वाक्य को ‘क्योंकि ... इसलिए’ संरचना और डैश के सहारे पठनीय बनाया गया है। ‘मन कोमल’ मूल रूपक को बचाता है; ‘अपने आपको दीन किया’ धार्मिक प्रसंग में परिचित होते हुए भी सामान्य पाठक के लिए स्पष्ट है।
