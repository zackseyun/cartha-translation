  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
translation:
  language: hi
  text: क्योंकि उन्होंने मुझे त्याग दिया है और दूसरे देवताओं को भेंट चढ़ाई है[a], ताकि अपने हाथों के हर काम से मुझे क्रोधित करें। इस कारण मेरा क्रोध इस स्थान के विरुद्ध भड़क उठा है, और वह नहीं बुझेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक विशेष रूप से, “दूसरे देवताओं के लिए धूप जलाई है।”
    reason: קטר की उपासना-संबंधी क्रिया प्रायः विशेष रूप से धूप जलाने के अर्थ में आती है, यद्यपि इसका दायरा जलाकर चढ़ाई गई भेंट तक विस्तृत हो सकता है।
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यह पदबंध न्याय का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में उसका कारणवाचक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲזָבוּנִי
  choice: उन्होंने मुझे त्याग दिया है
  rationale: ‘त्याग दिया’ सम्बन्ध और वाचा से विमुख होने का भार बनाए रखता है; पूर्ण क्रिया को वर्तमान परिणाम सहित व्यक्त किया गया है।
- source_word: וַיְקַטְּרוּ
  choice: अग्नि में भेंट चढ़ाई है
  rationale: पिएल रूप जलाकर अर्पण करने की उपासना-संबंधी क्रिया बताता है, जो प्रायः धूप के लिए प्रयुक्त होती है पर अनिवार्यतः उसी तक सीमित नहीं है। अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं के लिए
  rationale: यह यहोवा के अतिरिक्त अन्य देवताओं को सीधे और स्पष्ट रूप से दर्शाता है।
- source_word: לְמַעַן הַכְעִיסֵנִי
  choice: ताकि … मुझे क्रोध दिलाएँ
  rationale: לְמַעַן के प्रयोजन अथवा परिणाम के भाव और הכעיס के ‘क्रोध भड़काने’ वाले अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  choice: अपने हाथों के बनाए सब कामों के द्वारा
  rationale: हिब्रू के ‘हाथों के काम’ मुहावरे और मूर्तिपूजक रचनाओं पर उसके व्यंग्यात्मक बल को सुरक्षित रखता है।
- source_word: וְנִצְּתָה חֲמָתִי
  choice: मेरा क्रोध … भड़क उठा है
  rationale: क्रोध के आग की तरह प्रज्वलित होने का रूपक बनाए रखता है और आगामी ‘नहीं बुझेगा’ से स्वाभाविक सम्बन्ध बनाता है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान के विरुद्ध
  rationale: शाब्दिक ‘इस स्थान में’ के बजाय प्रसंग में न्याय के लक्ष्य को हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלֹא תִכְבֶּה
  choice: और वह नहीं बुझेगा
  rationale: आग के रूपक और न्याय की अटलता दोनों को संक्षिप्त तथा स्पष्ट रूप में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के क्रोध का मानव-सदृश भावात्मक वर्णन
  choice: ‘मुझे क्रोध दिलाएँ’ और ‘मेरा क्रोध … भड़क उठा है’ को बनाए रखा गया
  alternative: इसे केवल निर्वैयक्तिक दण्ड या न्याय की भाषा में नरम करना
  rationale: हिब्रू पाठ परमेश्वर के न्याय को स्पष्टतः सम्बन्धपरक और भावात्मक भाषा में प्रस्तुत करता है; अनुवाद इस तनाव को मिटाता नहीं है।
- issue: ईश्वरीय न्याय का अग्नि-रूपक
  choice: ‘भड़क उठा है’ और ‘नहीं बुझेगा’ के रूप में अग्नि-चित्र को सुरक्षित रखा गया
  alternative: केवल यह कहना कि दण्ड निश्चित है
  rationale: पद क्रोध को न बुझने वाली आग के चित्र में प्रस्तुत करता है; उसी रूपक को बनाए रखना पाठ के बल को सुरक्षित रखता है और कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘अग्नि में भेंट चढ़ाई’ सामान्य पाठक के लिए उपासना-संबंधी क्रिया स्पष्ट करता है; ‘क्रोध भड़कना/बुझना’ मूल के संयुक्त अग्नि-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
