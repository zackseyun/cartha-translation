base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
translation:
  language: hi
  text: “जाओ और मेरे लिए, लोगों के लिए और सारे यहूदा के लिए उस पुस्तक की बातों के विषय में, जो मिली है, याहवे से पूछो[a]। क्योंकि याहवे का प्रचण्ड क्रोध हम पर भड़क उठा है, इसलिए कि हमारे पुरखों[b] ने इस पुस्तक की बातों को इस उद्देश्य से नहीं सुना कि हमारे लिए लिखी हुई हर बात के अनुसार करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे को खोजो” अथवा “याहवे से परामर्श करो।” इब्रानी क्रिया परमेश्वर को खोजने या उससे मार्गदर्शन पूछने—दोनों अर्थ दे सकती है; यहाँ औपचारिक रूप से पूछने का भाव अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारे पूर्वजों।” इब्रानी का शाब्दिक अर्थ “हमारे पिताओं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ אֶת־יְהוָה
  choice: याहवे से पूछो
  rationale: इस प्रसंग में क्रिया דרשׁ सामान्य भक्ति के अर्थ में परमेश्वर को खोजने के बजाय उससे औपचारिक रूप से मार्गदर्शन या वचन पूछने को सूचित करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित उच्चारण के निकट रखा गया है।
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל־יְהוּדָה
  choice: मेरी ओर से, प्रजा की ओर से और सारे यहूदा की ओर से
  rationale: בְּעַד यहाँ प्रतिनिधित्व अथवा किसी के निमित्त पूछने का भाव देता है; ‘की ओर से’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: עַל דִּבְרֵי הַסֵּפֶר הַנִּמְצָא הַזֶּה
  choice: इस मिली हुई पुस्तक की बातों के विषय में
  rationale: यह अनुवाद पूछताछ के विषय और पुस्तक के पाए जाने—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֲמַת יְהוָה
  choice: याहवे का प्रचण्ड क्रोध
  rationale: חֵמָה तीव्र, दहकते और न्यायकारी क्रोध को व्यक्त करता है; ‘प्रचण्ड क्रोध’ आधुनिक हिन्दी में इसकी शक्ति बनाए रखता है।
- source_word: נִצְּתָה בָנוּ
  choice: हम पर भड़क उठा है
  rationale: יצת में आग भड़कने का बिंब है। ‘हम पर’ प्रसंग में क्रोध की प्रतिकूल दिशा को व्यक्त करता है।
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  choice: हमारे पुरखाओं ने ... बातें नहीं सुनीं
  rationale: שׁמע का मूल श्रवणार्थ रखा गया है, जबकि अगले वाक्यांश में आज्ञापालन की विफलता स्पष्ट होती है। ‘पुरखाओं’ में स्रोत का पितृ-संबंधी रूप बना रहता है और हिन्दी में स्वाभाविक है।
- source_word: לַעֲשׂוֹת כְּכָל־הַכָּתוּב
  choice: लिखी हुई हर बात के अनुसार काम नहीं किया
  rationale: ‘के अनुसार’ כְּ को और ‘हर बात’ כָּל की समग्रता को व्यक्त करता है; हिन्दी वाक्य में निषेध को दोहराने से श्रवण और आचरण का संबंध स्पष्ट रहता है।
- source_word: עָלֵינוּ
  choice: हमारे विषय में
  rationale: यह उस लिखित वचन की वर्तमान समुदाय पर लागू होने की बात कहता है, पर उसे केवल ‘हमारे विरुद्ध’ कहकर न्याय तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; इसलिए उसे उपाधि से प्रतिस्थापित न करके नाम के रूप में रखा गया है।
- issue: אֲבֹתֵינוּ में पूर्वजों का लिंग-सूचक उल्लेख
  choice: हमारे पुरखाओं
  alternative: हमारे पूर्वजों
  rationale: ‘पुरखाओं’ स्रोत के पुल्लिंग ‘पितरों’ के निकट है, फिर भी आधुनिक सामान्य हिन्दी में सहज है।
- issue: עָלֵינוּ का आशय
  choice: हमारे विषय में
  alternative: हमारे विरुद्ध / हमारे लिए
  rationale: संदर्भ न्याय की ओर संकेत करता है, पर इब्रानी संबंधसूचक पद स्वयं आशीष या दण्ड में से किसी एक को स्पष्टतः निर्धारित नहीं करता; व्यापक अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘प्रजा’, ‘प्रचण्ड क्रोध’ और ‘की ओर से’ जैसे पद सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की पुनरुक्ति, आग का बिंब और वाचा-संबंधी गंभीरता सुरक्षित हैं।
