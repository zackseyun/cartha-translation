source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
translation:
  language: hi
  text: तब राजकीय लेखक शापान राजा के पास आया और उसने राजा को समाचार दिया। उसने कहा, “आपके सेवकों ने भवन में मिली चाँदी निकाल ली है[a] और उसे उन काम करनेवालों के हाथ में सौंप दिया है[b], जो याहवे के भवन की देखरेख के लिए नियुक्त हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी खाली कर दी है”; इब्रानी क्रिया का अधिक शाब्दिक अर्थ “उँडेल देना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे उनके सुपुर्द कर दिया है”; शाब्दिक रूप से “उसे उनके हाथ में दे दिया है।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात मंदिर।
    reason: cultural_note
lexical_decisions:
- source_word: הַסֹּפֵר
  choice: शास्त्री
  rationale: यह पद राजकीय लेखक या सचिव का भी सूचक हो सकता है; ‘शास्त्री’ मूल पद की पारंपरिक और संक्षिप्त अभिव्यक्ति है तथा दरबारी प्रसंग में समझ में आती है।
- source_word: וַיָּשֶׁב ... דָּבָר
  choice: समाचार दिया
  rationale: इब्रानी मुहावरे का अर्थ लौटकर सूचना या प्रतिवेदन देना है; सहज आधुनिक हिन्दी में ‘समाचार दिया’ यही भाव व्यक्त करता है।
- source_word: הִתִּיכוּ
  choice: निकाल ली है
  rationale: यहाँ धातु का आशय धातु गलाना नहीं, बल्कि एकत्र चाँदी को पात्र से खाली करके निकालना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल बिंब पादटिप्पणी में बताया गया है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, यद्यपि प्रसंग में यह धन के रूप में प्रयुक्त है; ठोस मूल शब्द सुरक्षित रखा गया है।
- source_word: הַנִּמְצָא בַּבַּיִת
  choice: भवन में मिली
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और यहाँ प्रसंगतः मंदिर है; ‘भवन’ अगले वाक्यांश ‘याहवे के भवन’ से स्वाभाविक रूप से स्पष्ट होता है।
- source_word: וַיִּתְּנֻהוּ עַל יַד
  choice: उसे ... के हाथ में सौंप दिया है
  rationale: यह मुहावरा किसी वस्तु को दूसरे के अधिकार या जिम्मेदारी में देने को व्यक्त करता है; ‘हाथ में सौंपना’ मूल बिंब और व्यावहारिक अर्थ दोनों रखता है।
- source_word: עֹשֵׂי הַמְּלָאכָה
  choice: काम करनेवाले
  rationale: यह पद भवन की मरम्मत का काम करने वालों को दर्शाता है; यह सामान्य आधुनिक हिन्दी में स्पष्ट और समावेशी है।
- source_word: הַמֻּפְקָדִים
  choice: काम पर नियुक्त
  rationale: פקד का निष्क्रिय कृदंत नियुक्त किए जाने या जिम्मेदारी सौंपे जाने का भाव रखता है; चुना हुआ रूप उस आधिकारिक जिम्मेदारी को व्यक्त करता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: यह मंदिर का मानक इब्रानी नाम है; ‘भवन’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी उसका प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निज नाम को उपाधि से बदलने के बजाय हिन्दी में सीधे लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में परमेश्वर का निज नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के भेद को सुरक्षित रखता है।
- issue: בֵּית יְהוָה का प्रसंगगत अर्थ
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: मूल की ‘भवन/घर’ वाली अभिव्यक्ति मुख्य पाठ में रखी गई है; पाठक के लिए ‘मंदिर’ का आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रशासनिक विवरण को स्पष्ट करने के लिए छोटे वाक्य प्रयोग किए गए हैं। ‘शास्त्री’, ‘चाँदी’ और ‘भवन’ जैसे पद मूल इब्रानी शब्दावली से निकटता रखते हैं; कठिन मुहावरों और मंदिर-संदर्भ को पादटिप्पणियों में स्पष्ट किया गया है।
