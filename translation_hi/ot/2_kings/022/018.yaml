base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
translation:
  language: hi
  text: 'परन्तु यहूदा के राजा से, जिसने तुम्हें यहोवा से पूछने के लिए भेजा है, तुम यह कहना: ‘इस्राएल का परमेश्वर यहोवा यों कहता है: उन वचनों के विषय में जो तुमने सुने हैं—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह विषयसूचक उपवाक्य यहाँ अधूरा रहता है और अगली आयत में पूरा होता है। इसका अनुवाद यह भी हो सकता है: “जहाँ तक उन वचनों की बात है जो तुमने सुने हैं—”'
    reason: मूल की लटकी हुई वाक्य-रचना और वैकल्पिक विषयसूचक अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: וְאֶל
  choice: परन्तु ... से
  rationale: यह पद पिछले संदेश से यहूदा के राजा की ओर विषयगत मोड़ लाता है; ‘परन्तु’ इस बदलाव को स्वाभाविक रूप से व्यक्त करता है, और ‘से ... कहना’ हिन्दी में संबोधन का सहज रूप है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: सम्बन्धसूचक इब्रानी रचना का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: הַשֹּׁלֵחַ אֶתְכֶם
  choice: जिसने तुम्हें ... भेजा है
  rationale: कृदन्त राजा की पहचान उसके कार्य से कराता है; सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: यहोवा से पूछने के लिए
  rationale: इस प्रसंग में דרשׁ परमेश्वर से मार्गदर्शन या वचन जानने के लिए पूछने को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिवाचक रूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  choice: तुम यह कहना
  rationale: सन्देश देने की आज्ञा को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वक्ताओं के मानक सन्देश-सूत्र का स्वाभाविक हिन्दी समतुल्य।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक पदबंध का सीधा अनुवाद, जो परमेश्वर की इस्राएल के साथ पहचान को बनाए रखता है।
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  choice: जो वचन तुमने सुने हैं—
  rationale: इब्रानी वाक्यांश यहाँ अधूरा छोड़ दिया गया है और अगली आयत में पूरा होता है; दीर्घ विराम-चिह्न उस लटकी हुई संरचना को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम है; ‘यहोवा’ उसे उपाधि ‘प्रभु’ से बदले बिना प्रस्तुत करता है।
- issue: अन्तिम उपवाक्य की अपूर्ण वाक्य-रचना
  choice: अपूर्णता को दीर्घ विराम के साथ बनाए रखना
  alternative: अगली आयत का आशय जोड़कर वाक्य पूरा करना
  rationale: मूल इब्रानी में विषयसूचक खंड इसी पद में लटका रहता है और उसका कथन अगले पद में पूरा होता है; इसे कृत्रिम रूप से पूरा करना मूल तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण बाइबलीय गद्य; ‘यों कहता है’ भविष्यद्वाणी-सूत्र की औपचारिकता रखता है, जबकि बाकी वाक्य सामान्य पाठकों के लिए सहज है।
