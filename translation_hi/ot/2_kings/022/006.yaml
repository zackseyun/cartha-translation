source:
  edition: WLC
  text: לֶ/חָ֣רָשִׁ֔ים וְ/לַ/בֹּנִ֖ים וְ/לַ/גֹּֽדְרִ֑ים וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/006.yaml
  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
translation:
  language: hi
  text: कारीगरों, निर्माण करने वालों और दीवार बनाने वालों के लिए, तथा भवन[a] को मजबूत करने के लिए लकड़ी और खदान से निकाले गए पत्थर[b] खरीदने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यहोवा का भवन—मंदिर।
    reason: cross_reference
  - marker: b
    text: या ‘काटकर तैयार किए गए पत्थर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  choice: कारीगरों
  rationale: यह शब्द व्यापक रूप से कुशल कामगारों को सूचित कर सकता है; निर्माण के संदर्भ में ‘कारीगर’ इसके अर्थ को केवल बढ़ई तक सीमित नहीं करता।
- source_word: וְלַבֹּנִים
  choice: राजमिस्त्रियों
  rationale: בנה से बना यह रूप निर्माण करने वालों को दर्शाता है। हिंदी में भवन-निर्माण के कामगारों के लिए ‘राजमिस्त्री’ स्वाभाविक है।
- source_word: וְלַגֹּדְרִים
  choice: दीवार बनाने वालों
  rationale: גדר का मूल आशय दीवार या घेरा बनाने अथवा उसकी मरम्मत करने से है। यह अनुवाद उस विशिष्ट चित्र को बनाए रखता है और इसे पिछले पेशे से अलग करता है।
- source_word: וְלִקְנוֹת
  choice: खरीदने के लिए
  rationale: ל के साथ infinitive धन के उपयोग या उद्देश्य की शृंखला को आगे बढ़ाता है।
- source_word: עֵצִים
  choice: लकड़ी
  rationale: निर्माण-सामग्री के संदर्भ में यह काटी और उपयोग योग्य लकड़ी को दर्शाता है; आधुनिक हिंदी में ‘लकड़ी’ सहज और स्पष्ट है।
- source_word: וְאַבְנֵי מַחְצֵב
  choice: खदान से निकाले गए पत्थर
  rationale: מַחְצֵב खदान अथवा वहाँ से काटकर निकाले जाने का भाव देता है। यह वाक्यांश आधुनिक पाठक के लिए ‘गढ़े हुए पत्थर’ की अपेक्षा अधिक पारदर्शी है।
- source_word: לְחַזֵּק
  choice: मजबूत करने के लिए
  rationale: हिफ़ील रूप का मूल अर्थ ‘मजबूत करना’ है। संदर्भ में मरम्मत शामिल है, फिर भी यह चयन इब्रानी की मूल शब्दगत शक्ति को सुरक्षित रखता है।
- source_word: אֶת־הַבָּיִת
  choice: भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और प्रसंग में यह यहोवा के भवन, अर्थात मंदिर, को दर्शाता है। ‘भवन’ हिंदी में निर्माण-संदर्भ के अनुकूल रहते हुए मूल की अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: הַבָּיִת का प्रसंगगत संदर्भ
  choice: मुख्य पाठ में ‘भवन’, पादटिप्पणी में मंदिर की पहचान
  alternative: मुख्य पाठ में ‘मंदिर’
  rationale: इब्रानी पद केवल ‘भवन’ कहता है, यद्यपि प्रसंग से यहोवा का मंदिर स्पष्ट है। मुख्य पाठ में मूल शब्दावली और टिप्पणी में संदर्भ देना अनावश्यक व्याख्यात्मक विस्तार से बचाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण निर्माण-संबंधी शब्दावली अपनाई गई है। पेशों की सूची में इब्रानी के व्यापक ‘कारीगर’, निर्माणकर्ता और विशेषतः दीवार बनाने वालों के बीच भेद बनाए रखा गया है।
