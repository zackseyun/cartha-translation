- source_word: כִּי
  choice: क्योंकि
  rationale: यह हिसाब न लिए जाने का कारण प्रस्तुत करता है।
- source_word: בֶאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: यहाँ אֱמוּנָה सैद्धांतिक विश्वास नहीं, बल्कि आचरण में भरोसेमंदी और निष्ठा दर्शाता है।
- source_word: הֵם עֹשִׂים
  choice: वे ... काम करते हैं
