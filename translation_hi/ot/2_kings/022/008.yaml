base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
translation:
  language: hi
  text: तब महायाजक हिल्किय्याह ने लिपिक शापान से कहा, “मुझे याहवे के भवन[b] में व्यवस्था की पुस्तक[a] मिली है।” फिर हिल्किय्याह ने वह पुस्तक शापान को दे दी, और उसने उसे पढ़ा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था का ग्रंथ।” हिब्रू शब्द סֵפֶר पुस्तक या लपेटे हुए लिखित दस्तावेज़ को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् याहवे के मंदिर में।
    reason: cultural_note
  - marker: c
    text: या, कम संभावित रूप से, “उसमें से पढ़ा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह इस्राएल के सर्वोच्च याजकीय पद का स्थापित और संक्षिप्त हिन्दी नाम है।
- source_word: הַסֹּפֵר
  choice: सचिव
  rationale: यहाँ शापान राजकीय प्रशासन से जुड़ा अधिकारी है; आधुनिक हिन्दी में ‘सचिव’ उसकी भूमिका को ‘लेखक’ या ‘शास्त्री’ से अधिक स्पष्ट रूप में बताता है।
- source_word: סֵפֶר הַתּוֹרָה
  choice: व्यवस्था की पुस्तक
  rationale: इस वाचा-संबंधी विधिक प्रसंग में תּוֹרָה के लिए ‘व्यवस्था’ उपयुक्त है; סֵפֶר पुस्तक अथवा पुस्तकाकार दस्तावेज़/लपेटा हुआ ग्रंथ हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: מָצָאתִי
  choice: मुझे ... मिली है
  rationale: हिब्रू पूर्ण क्रिया हाल में हुई ऐसी खोज बताती है जिसका वर्तमान महत्व है; हिन्दी का पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּבֵית יְהוָה
  choice: याहवे के भवन में
  rationale: ‘भवन’ हिब्रू ‘घर’ की उपमा को बनाए रखता है; प्रसंग में इसका आशय मन्दिर है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू व्यंजनात्मक नाम YHWH को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּתֵּן ... אֶת־הַסֵּפֶר
  choice: वह पुस्तक ... को दे दी
  rationale: נתן और उसके प्रत्यक्ष कर्म का सरल, स्वाभाविक तथा सटीक हिन्दी रूप है।
- source_word: וַיִּקְרָאֵהוּ
  choice: उसने उसे पढ़ा
  rationale: सर्वनामिक प्रत्यय सहित क्रिया का सबसे स्वाभाविक अर्थ ‘उसे पढ़ा’ है; निकटतम कर्ता शापान समझा जाता है, जबकि ‘उसमें से पढ़ा’ कम सम्भावित विकल्प है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और आधुनिक विद्वत्तापूर्ण पुनर्निर्माण को देवनागरी में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सचिव’ शापान की राजकीय प्रशासनिक भूमिका को स्पष्ट करता है; ‘याहवे का भवन’ मूल हिब्रू अभिव्यक्ति को बनाए रखता है और पादटिप्पणी उसका मन्दिर-संदर्भ स्पष्ट करती है।
