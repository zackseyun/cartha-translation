source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ם כֹּֽה אָמַ֥ר יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל אִמְר֣וּ לָ/אִ֔ישׁ אֲשֶׁר שָׁלַ֥ח אֶתְ/כֶ֖ם אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/015.yaml
  text: 'And she said to them, “Thus says Yahweh, the God of Israel: Say to the man who sent you to me,”'
translation:
  language: hi
  text: 'तब उसने उनसे कहा, “इस्राएल का परमेश्वर याहवे यों कहता है: जिस पुरुष ने तुम्हें मेरे पास भेजा है, उससे कहो—”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶם
  choice: तब उसने उनसे कहा
  rationale: वय्यिक्तोल कथा के अगले क्रम को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक है। स्त्रीलिंग क्रिया का कर्ता प्रसंग में हुल्दा है, जबकि हिन्दी के भूतकालीन सकर्मक वाक्य में ‘उसने’ स्वाभाविक रूप से लिंग-निरपेक्ष रहता है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है। वर्तमानकालीन हिन्दी ईश्वरीय घोषणा की तात्कालिकता और सूत्रात्मक स्वर बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का लिप्यंतरण किया गया है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אִמְרוּ לָאִישׁ
  choice: उस पुरुष से कहो
  rationale: बहुवचन आज्ञार्थक क्रिया प्रतिनिधिमंडल को संबोधित है। אִישׁ यहाँ एक निश्चित पुरुष, अर्थात भेजने वाले राजा, को सूचित करता है; इसलिए लिंग को अस्पष्ट नहीं किया गया।
- source_word: אֲשֶׁר שָׁלַח אֶתְכֶם אֵלָי
  choice: जिस पुरुष ने तुम्हें मेरे पास भेजा है
  rationale: संबंधवाचक उपवाक्य को वर्तमान हिन्दी में स्वाभाविक ढंग से रखा गया है और ‘मेरे पास’ हुल्दा को प्रतिनिधिमंडल के गंतव्य के रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: אִישׁ का लिंग-सूचक अर्थ
  choice: पुरुष
  alternative: व्यक्ति; मनुष्य
  rationale: संज्ञा पुल्लिंग एकवचन है और प्रसंग में एक विशिष्ट पुरुष, राजा योशिय्याह, की ओर संकेत करती है; इसलिए स्पष्ट लिंग को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अंतिम डैश यह दिखाता है कि याहवे का संदेश अगले पद में जारी है; उद्धरण जानबूझकर यहाँ पूर्ण नहीं किया गया।
