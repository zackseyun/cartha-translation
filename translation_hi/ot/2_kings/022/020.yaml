base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
translation:
  language: hi
  text: “इसलिए देख, मैं तुझे तेरे पुरखों के साथ मिला दूँगा, और तू शांति के साथ[a] अपनी कब्रों में पहुँचाया जाएगा। जो सारी विपत्ति मैं इस स्थान पर लाने वाला हूँ, उसे तेरी आँखें नहीं देखेंगी।” वे राजा के पास लौटे और यह बात बताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांतिपूर्वक।” इब्रानी में शाब्दिक अर्थ “शांति के साथ” है। इसका आशय यह हो सकता है कि योशिय्याह आने वाली विपत्ति देखने से पहले मर जाएगा; यह आवश्यक नहीं कि यहाँ उसकी मृत्यु के ठीक ढंग का वर्णन किया गया हो।
    reason: lexical_alternative
