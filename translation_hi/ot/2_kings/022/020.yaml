theological_decisions:
- issue: योशिय्याह की बाद की युद्ध-मृत्यु के प्रकाश में ‘शान्ति के साथ’ का अर्थ
  choice: ‘शान्ति के साथ’ को पाठ में यथासंभव अक्षुण्ण रखा गया और उसके बाद वाली पंक्ति को उसका प्रसंगगत स्पष्टीकरण करने दिया गया।
  alternative: ‘शान्तिपूर्वक’ कहकर इसे मृत्यु के ठीक ढंग का निश्चित वर्णन मानना, अथवा तनाव मिटाने वाला कोई व्याख्यात्मक वाक्य जोड़ना।
  rationale: इब्रानी पाठ ऐतिहासिक और धर्मवैचारिक तनाव को स्वयं हल नहीं करता। अगला उपवाक्य मुख्यतः यह बताता है कि योशिय्याह इस स्थान पर आने वाली विपत्ति नहीं देखेगा; अनुवाद को इससे अधिक निश्चित नहीं होना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। सर्वनाम ‘तू/तेरा’ मूल के एकवचन निकट संबोधन और प्रचलित बाइबिलीय गरिमा के अनुरूप है। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘पुरखे’, ‘विपत्ति’ और ‘सन्देश’ जैसे सामान्य, स्पष्ट शब्द चुने गए हैं।
