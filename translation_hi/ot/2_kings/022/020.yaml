  choice: मिला दूँगा … पहुँचाया जाएगा
  rationale: पहला वाक्यांश मृत पुरखों से मिलाए जाने की इब्रानी मृत्यु-संबंधी उक्ति को स्वाभाविक हिन्दी में व्यक्त करता है; दूसरे में कब्रों तक पहुँचाए जाने का अर्थ स्पष्ट रखा गया है। एक ही हिन्दी धातु दोहराने पर वाक्य कृत्रिम और अस्पष्ट हो जाता।
- source_word: עַל אֲבֹתֶיךָ
  choice: तेरे पुरखों के पास
  rationale: शाब्दिक संबंध को समझने योग्य रूप में व्यक्त करते हुए मृत पूर्वजों से जा मिलने की उक्ति को सुरक्षित रखता है।
- source_word: קִבְרֹתֶיךָ
  choice: अपनी कब्रों
  rationale: इब्रानी के बहुवचन को बनाए रखा गया है, यद्यपि सामान्य हिन्दी में एकवचन अधिक अपेक्षित हो सकता है।
- source_word: בְּשָׁלוֹם
  choice: शान्ति के साथ
  rationale: שָׁלוֹם को संज्ञा के रूप में सुरक्षित रखता है और इसे केवल मृत्यु के ढंग का स्पष्ट वर्णन नहीं बनाता।
- source_word: וְלֹא תִרְאֶינָה עֵינֶיךָ
  choice: उसे तेरी आँखें नहीं देखेंगी
