  rationale: यहाँ नैतिक बुराई नहीं, आने वाले दण्ड और विनाश का संकेत है; ‘विपत्ति’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट करती है।
- source_word: מֵבִיא עַל
