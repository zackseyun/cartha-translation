  terminology: “भवन” preserves the literal ‘house/building’ wording while footnote a responsibly identifies the temple reference. “महिमा” suitably renders כָּבוֹד in context. “पहली महिमा” is a defensible close rendering of הָרִאשׁוֹן, and footnote b supplies the more idiomatic temporal alternative. Footnote markers are correctly placed and correspond to their notes.
