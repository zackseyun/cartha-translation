id: HAG.2.3
reference: Haggai 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י בָ/כֶם֙ הַ/נִּשְׁאָ֔ר אֲשֶׁ֤ר רָאָה֙ אֶת הַ/בַּ֣יִת הַ/זֶּ֔ה בִּ/כְבוֹד֖/וֹ הָ/רִאשׁ֑וֹן וּ/מָ֨ה אַתֶּ֜ם רֹאִ֤ים אֹת/וֹ֙ עַ֔תָּה הֲ/ל֥וֹא כָמֹ֛/הוּ כְּ/אַ֖יִן בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/003.yaml
  text: Who among you is left who saw this house in its former glory? And how do you see it now? Is it not as nothing in your eyes?[a][b]
translation:
  language: hi
  text: तुममें से ऐसा कौन बचा है, जिसने इस भवन[a] को उसकी पहली महिमा[b] में देखा था? अब तुम इसे कैसा देखते हो? क्या यह तुम्हारी दृष्टि में मानो कुछ भी नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस मन्दिर’। इब्रानी में शाब्दिक रूप से ‘इस घर’ है; मन्दिर के लिए ‘घर’ कहना सामान्य था।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी पहले की महिमा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי בָכֶם הַנִּשְׁאָר
  choice: तुममें से ऐसा कौन बचा है
  rationale: यह वाक्य उन लोगों के विषय में पूछता है जो पहले के समय से अब तक बचे हुए हैं। ‘बचा है’ निफ़अल कृदंत के शेष रहने या बचे रहने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר רָאָה
  choice: जिसने ... देखा था
  rationale: पूर्ण हो चुकी पिछली घटना के लिए ‘देखा था’ उपयुक्त है और वर्तमान भवन से किए जा रहे कालगत विरोध को स्पष्ट रखता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है और इस प्रसंग में वह मन्दिर को सूचित करता है। ‘भवन’ मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: בִּכְבוֹדוֹ הָרִאשׁוֹן
  choice: उसकी पहली महिमा में
  rationale: ‘उसकी’ प्रत्यय को भवन से जोड़ता है; ‘पहली महिमा’ רִאשׁוֹן के निकट रहते हुए पहले मन्दिर की शोभा, प्रतिष्ठा और वैभव के संयुक्त भाव को सुरक्षित रखती है।
- source_word: וּמָה אַתֶּם רֹאִים אֹתוֹ עַתָּה
  choice: अब तुम इसे कैसा देखते हो?
  rationale: यह केवल दृश्य पहचान नहीं, वर्तमान भवन के मूल्यांकन का प्रश्न है। ‘कैसा देखते हो’ मूल की प्रत्यक्षता और मूल्यांकनात्मक बल दोनों रखता है।
- source_word: הֲלוֹא
  choice: क्या ... है?
  rationale: हिन्दी में ‘क्या’ से आरम्भ यह प्रश्न सहमति की अपेक्षा करने वाले इब्रानी आलंकारिक प्रश्न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָמֹהוּ כְּאַיִן
  choice: मानो कुछ भी नहीं
  rationale: यह तुलना वर्तमान भवन की अत्यन्त तुच्छ प्रतीत होने वाली दशा को व्यक्त करती है। ‘मानो’ तुलना को बनाए रखता है और ‘कुछ भी नहीं’ אַיִן की तीव्रता व्यक्त करता है।
- source_word: בְּעֵינֵיכֶם
  choice: तुम्हारी दृष्टि में
  rationale: यह वाक्यांश श्रोताओं की धारणा या मूल्यांकन को सूचित करता है। ‘दृष्टि में’ मूल नेत्र-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘भवन’ का संकेत
  choice: मुख्य पाठ में ‘भवन’ रखा गया
  alternative: ‘मन्दिर’
  rationale: प्रसंग स्पष्टतः यरूशलेम के मन्दिर का है, पर मूल इब्रानी में सामान्य शब्द ‘घर/भवन’ है। मुख्य पाठ स्रोत की शब्दावली रखता है और पादटिप्पणी प्रसंगगत अर्थ बताती है।
- issue: רִאשׁוֹן का कालगत अर्थ
  choice: ‘पहली महिमा’
  alternative: ‘पहले की महिमा’
  rationale: ‘पहली’ मूल के क्रमसूचक रूप को अधिक निकटता से रखती है; ‘पहले की’ सम्भव और अधिक मुहावरेदार व्याख्या है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, जिसमें सामान्य पाठक के लिए स्पष्टता और भविष्यद्वाणी-साहित्य के अनुरूप गरिमा दोनों रखी गई हैं। ‘भवन’, ‘महिमा’ और ‘दृष्टि में’ स्रोत के प्रमुख रूपकों को सुरक्षित रखते हैं; वाक्य-विन्यास हिन्दी में स्वाभाविक बनाया गया है।
