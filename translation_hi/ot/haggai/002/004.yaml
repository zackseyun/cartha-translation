  text: וְ/עַתָּ֣ה חֲזַ֣ק זְרֻבָּבֶ֣ל נְאֻם יְהוָ֡ה וַ/חֲזַ֣ק יְהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וַ/חֲזַ֨ק כָּל עַ֥ם הָ/אָ֛רֶץ נְאֻם יְהוָ֖ה וַֽ/עֲשׂ֑וּ כִּֽי אֲנִ֣י אִתְּ/כֶ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/004.yaml
  text: But now[a], be strong, Zerubbabel, declares Yahweh, and be strong, Joshua son of Jehozadak, the high priest, and be strong, all the people of the land, declares Yahweh, and work, for I am with you, declares Yahweh of Armies.
translation:
  language: hi
  text: “परन्तु अब, हे जरुब्बाबेल, हिम्मत रख,” याहवे की घोषणा है। “हे यहोसादाक के पुत्र यहोशू, महायाजक, हिम्मत रख; और हे देश के सभी लोगों, हिम्मत रखो,” याहवे की घोषणा है। “काम करो, क्योंकि मैं तुम्हारे साथ हूँ,” सेनाओं का याहवे की घोषणा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक रूप से, “सेनाओं का यहोवा।”
    reason: ईश्वरीय नाम और उपाधि का पारंपरिक हिन्दी रूप बताने के लिए।
lexical_decisions:
- source_word: וְעַתָּה
  choice: परन्तु अब
  rationale: पिछली निराशा से वर्तमान प्रोत्साहन की ओर विरोधात्मक परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲזַק / וַחֲזַק / וַחֲזַק
  choice: हिम्मत रख / हिम्मत रखो
  rationale: חזק के साहस और दृढ़ता के आह्वान को आधुनिक, सहज हिन्दी में व्यक्त करते हुए तीनों बार की आलंकारिक पुनरावृत्ति बनाए रखता है; संबोधन के अनुसार एकवचन और बहुवचन रूप प्रयुक्त हैं।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: मानक भविष्यद्वक्ताई सूत्र का गंभीर और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि में बदलने के बजाय लिप्यंतरित करता है।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशसूचक पहचान में शब्द का सीधा और स्वाभाविक अर्थ देता है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: इस मान्य धार्मिक पद के लिए स्थापित और संक्षिप्त हिन्दी शब्द है।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोगो
  rationale: निर्वासनोत्तर संदर्भ में הָאָרֶץ स्थानीय देश और समुदाय की ओर संकेत करता है, पूरी पृथ्वी की ओर नहीं। संबोधन के कारण ‘लोगो’ रूप स्वाभाविक है।
- source_word: וַעֲשׂוּ
  choice: काम में लग जाओ
  rationale: मन्दिर के पुनर्निर्माण के निकट संदर्भ में अपेक्षित सक्रिय कार्य को स्पष्ट करता है; केवल ‘करो’ हिन्दी में अनावश्यक रूप से अस्पष्ट होता।
- source_word: כִּי אֲנִי אִתְּכֶם
  choice: क्योंकि मैं तुम्हारे साथ हूँ
  rationale: आज्ञा के आधार के रूप में दी गई परमेश्वर की उपस्थिति की प्रतिज्ञा को सीधे व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: ईश्वरीय नाम को लिप्यंतरित और צְבָאוֹת को अर्थानुसार अनूदित करता है, जिससे उपाधि का सैन्य आशय आधुनिक पाठक के लिए स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे किसी सामान्य उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: יְהוָה צְבָאוֹת उपाधि का रूप
  choice: सेनाओं का याहवे
  alternative: सेनाओं का यहोवा
  rationale: यह रूप नाम और उपाधि के बीच भेद बनाए रखता है तथा צְבָאוֹת का अर्थ स्पष्ट करता है; परिचित पारंपरिक रूप पाठ-टिप्पणी में दिया गया है।
- issue: וַעֲשׂוּ में निर्दिष्ट कार्य
  choice: काम में लग जाओ
  alternative: कार्य करो अथवा इसे करो
  rationale: क्रिया अपने आप में व्यापक है, पर निकट संदर्भ मन्दिर-निर्माण का है। चुना हुआ रूप उस संदर्भगत आह्वान को व्यक्त करता है, फिर भी किसी अतिरिक्त धार्मिक अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। तीन बार आए साहस के आह्वान तथा तीन बार आए भविष्यद्वक्ताई घोषणा-सूत्र को सुरक्षित रखा गया है। प्रत्यक्ष वाणी के विराम-चिह्न हिन्दी में लंबी इब्रानी शृंखला को स्पष्ट बनाते हैं।
