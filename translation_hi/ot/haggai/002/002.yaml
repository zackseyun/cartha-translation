base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/002.yaml
  text: Speak now to Zerubbabel son of Shealtiel[a], governor of Judah, and to Joshua son of Jehozadak, the high priest, and to the remnant of the people, saying[b],
translation:
  language: hi
  text: “अब यहूदा के राज्यपाल शालतीएल के पुत्र ज़रुब्बाबेल, महायाजक यहोसादाक के पुत्र यहोशू, और लोगों के शेष जन[a] से कह:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाकी लोग।” इब्रानी शब्द उन लोगों को सूचित कर सकता है जो बचे रह गए हैं; भविष्यद्वक्ताओं के लेखों में इसमें ‘शेष बचे समुदाय’ की अनुगूँज भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: अब … से कह
  rationale: आज्ञार्थक क्रिया और נָא की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; यहाँ נָא विनम्र निवेदन से अधिक ‘अब’ के अर्थ में है।
- source_word: זְרֻבָּבֶל בֶּן שַׁלְתִּיאֵל
  choice: शालतीएल के पुत्र ज़रुब्बाबेल
  rationale: इब्रानी नामों का मूल रूप के निकट देवनागरी लिप्यंतरण किया गया है और בֶּן को सामान्य वंश-सूचक ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: פַּחַת יְהוּדָה
  choice: यहूदा के राज्यपाल
  rationale: फ़ारसी काल के प्रांतीय शासकीय पद के लिए ‘राज्यपाल’ स्पष्ट और प्रचलित आधुनिक हिन्दी समतुल्य है।
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: यहोसादाक के पुत्र यहोशू
  rationale: मसोरेटिक पाठ में दिए पूरे नाम-रूपों का निकट देवनागरी लिप्यंतरण है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: इस्राएल के प्रधान याजकीय पद के लिए स्थापित, संक्षिप्त और स्वाभाविक हिन्दी पद।
- source_word: שְׁאֵרִית הָעָם
  choice: लोगों के बचे हुए भाग
  rationale: यह अभिव्यक्ति समुदाय के शेष बचे लोगों का अर्थ देती है और साथ ही इब्रानी शब्द में निहित भविष्यद्वक्तीय ‘शेष’ की संभावित अनुगूँज को पूर्णतः मिटाती नहीं।
- source_word: לֵאמֹר
  choice: 'से कह:'
  rationale: यह अगले पद में आने वाले कथन का परिचय देता है। हिन्दी में ‘से कह:’ कृत्रिम ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और वाक्य-संबंध बनाए रखता है।
theological_decisions:
- issue: שְׁאֵרִית में साधारण ‘बाकी लोग’ और भविष्यद्वक्तीय ‘शेष’ की अनुगूँज
  choice: मुख्य पाठ में ‘लोगों के बचे हुए भाग’
  alternative: बाकी लोगों
  rationale: चुना हुआ रूप वास्तविक बचे हुए समुदाय को स्पष्ट करता है, पर शब्द को केवल सामान्य ‘बाकी’ बनाकर उसकी संभावित भविष्यद्वक्तीय अनुगूँज को चुपचाप समाप्त नहीं करता। पादटिप्पणी अधिक सहज विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद अगले वचन के कथन की भूमिका है, इसलिए अंत में द्विबिंदु लगाया गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का स्थान परस्पर असंगत था; हिन्दी मसौदे में केवल स्रोत-पाठ से संबंधित शेष-समुदाय वाली टिप्पणी को सही शब्द के बाद रखा गया है।
