  text: מִֽ/הְיוֹתָ֥/ם בָּא֙ אֶל עֲרֵמַ֣ת עֶשְׂרִ֔ים וְ/הָיְתָ֖ה עֲשָׂרָ֑ה בָּ֣א אֶל הַ/יֶּ֗קֶב לַ/חְשֹׂף֙ חֲמִשִּׁ֣ים פּוּרָ֔ה וְ/הָיְתָ֖ה עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/016.yaml
  text: When one came to a heap of twenty measures[a], there were only ten; when one came to the wine vat to draw fifty measures, there were only twenty.
translation:
  language: hi
  text: जब कोई बीस माप की ढेरी के पास पहुँचता था, तो वह केवल दस माप की निकलती थी; और जब कोई दाखरस के कुंड से पचास माप[a] निकालने आता था, तो केवल बीस माप निकलते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “पचास पूराह”; “पूराह” तरल पदार्थ का कोई माप या पात्र था, जिसकी ठीक मात्रा निश्चित नहीं है।
    reason: मूल माप-संबंधी शब्द का सटीक परिमाण अज्ञात है।
lexical_decisions:
- source_word: מִהְיוֹתָם בָּא
  choice: जब कोई ... आता था
  rationale: यह पद पिछले संदर्भ में बताए गए उस समय की बार-बार घटने वाली स्थिति को सामने रखता है। हिन्दी में अपूर्ण भूतकाल और सामान्य कर्ता ‘कोई’ इस भाव को स्वाभाविक रूप से व्यक्त करते हैं; स्रोत में अलग से कोई प्रश्नवाचक वाक्य जोड़ना उचित नहीं है।
- source_word: עֲרֵמַת עֶשְׂרִים
  choice: बीस माप की ढेरी
  rationale: עֲרֵמָה उपज की ढेरी है और संख्या के साथ माप की इकाई स्पष्ट नहीं दी गई। ‘माप’ जोड़ने से मात्रा का आशय साफ होता है, पर किसी अनिश्चित प्राचीन इकाई को आधुनिक इकाई मान लेने से बचा जाता है।
- source_word: וְהָיְתָה עֲשָׂרָה
  choice: वहाँ केवल दस ही मिलते थे
  rationale: यह अपेक्षित बीस के बदले वास्तविक उपज दस होने की कमी व्यक्त करता है। ‘केवल ... ही’ निराशाजनक कमी को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: הַיֶּקֶב
  choice: दाखरस का कुंड
  rationale: יֶקֶב यहाँ दाखरस निकालने और संचित करने से जुड़ा कुंड है। यह अनुवाद पूरे कोल्हू के बजाय संबंधित कुंड का संकेत देता है।
- source_word: לַחְשֹׂף
  choice: निकालने
  rationale: संदर्भ में क्रिया कुंड से तरल पदार्थ बाहर निकालने के लिए प्रयुक्त है। ‘निकालने’ सरल और स्वाभाविक हिन्दी है।
- source_word: חֲמִשִּׁים פּוּרָה
  choice: पचास माप[a]
  rationale: פּוּרָה किसी तरल माप या पात्र का शब्द है जिसकी ठीक मात्रा अनिश्चित है। मुख्य पाठ में ‘माप’ अर्थ स्पष्ट रखता है और पादटिप्पणी मूल शब्द की अनिश्चितता बताती है।
- source_word: וְהָיְתָה עֶשְׂרִים
  choice: केवल बीस ही मिलते थे
  rationale: अपेक्षित पचास की तुलना में वास्तविक मात्रा बीस होने का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
