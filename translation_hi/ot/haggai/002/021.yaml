base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/021.yaml
  text: 'Speak to Zerubbabel[a], governor of Judah, saying: I am shaking the heavens and the earth.'
translation:
  language: hi
  text: यहूदा के राज्यपाल ज़रुब्बाबेल से कह, ‘मैं आकाश और पृथ्वी को हिला रहा हूँ।’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आकाश और पृथ्वी को हिलाने वाला हूँ,” अथवा “मैं आकाश और पृथ्वी को हिलाऊँगा।” इब्रानी कृदंत आसन्न भविष्य या सामान्य भविष्य भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר אֶל
  choice: से कह
  rationale: आदेशात्मक क्रिया और उसके संबोधन को संक्षिप्त, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: זְרֻבָּבֶל
  choice: ज़रुब्बाबेल
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: פַּחַת יְהוּדָה
  choice: यहूदा के राज्यपाल
  rationale: फ़ारसी साम्राज्य के अधीन प्रांतीय शासक के पद के लिए ‘राज्यपाल’ स्पष्ट और प्रचलित आधुनिक हिन्दी शब्द है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन की शुरुआत
  rationale: इब्रानी उद्धरण-सूचक पद को अलग से ‘यह कहते हुए’ कहने के बजाय हिन्दी में सीधे उद्धरण द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲנִי מַרְעִישׁ
  choice: मैं … हिला रहा हूँ
  rationale: स्पष्ट सर्वनाम के बल और हिफ़ील कृदंत के प्रगतिशील रूप को बनाए रखता है; भविष्य अथवा आसन्न भविष्य का संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह प्रचलित हिन्दी युग्म मूल की व्यापक, सृष्टिगत छवि को बनाए रखता है और अर्थ को केवल स्थानीय ‘देश’ तक सीमित नहीं करता।
theological_decisions:
- issue: हिलाए जाने के चित्र का दायरा
  choice: ‘आकाश और पृथ्वी’ की व्यापक सृष्टिगत भाषा को यथावत रखना
  alternative: इसे केवल राष्ट्रों के बीच राजनीतिक उथल-पुथल के रूप में स्पष्ट करना
  rationale: मूल पद की भाषा व्यापक है, भले ही आगे के पदों में उसका ऐतिहासिक और राजनीतिक प्रभाव सामने आता है; अनुवाद उस तनाव को संकुचित नहीं करता।
- issue: מַרְעִישׁ का कालगत बल
  choice: मुख्य पाठ में वर्तमान प्रगतिशील रूप
  alternative: आसन्न भविष्य ‘हिलाने वाला हूँ’ या सामान्य भविष्य ‘हिलाऊँगा’
  rationale: इब्रानी कृदंत स्वयं इन कालगत अर्थों के बीच कुछ खुलापन रखता है; मुख्य पाठ रूपात्मक निकटता रखता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष उद्धरण से इब्रानी לֵאמֹר का कार्य स्वाभाविक हिन्दी में व्यक्त होता है; ‘आकाश और पृथ्वी’ भविष्यद्वाणी की ऊँची, सृष्टिगत शैली बनाए रखता है।
