id: HAG.2.13
reference: Haggai 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חַגַּ֔י אִם יִגַּ֧ע טְמֵא נֶ֛פֶשׁ בְּ/כָל אֵ֖לֶּה הֲ/יִטְמָ֑א וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ יִטְמָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/013.yaml
  text: Then Haggai said[a], “If one who is unclean by contact with a dead body touches any of these, does it become unclean?” And the priests answered and said, “It becomes unclean.”
translation:
  language: hi
  text: तब हाग्गै ने कहा, “यदि किसी मृत शरीर के कारण अशुद्ध हुआ व्यक्ति[a] इनमें से किसी वस्तु को छुए, तो क्या वह वस्तु अशुद्ध हो जाएगी?” याजकों ने उत्तर देकर कहा, “वह अशुद्ध हो जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “प्राण/व्यक्ति से अशुद्ध”; यह मृत शरीर के संपर्क से हुई अशुद्धता के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके क्रमिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַגַּי
  choice: हाग्गै
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: טְמֵא נֶפֶשׁ
  choice: किसी मृत शरीर के कारण अशुद्ध हुआ व्यक्ति
  rationale: यह इब्रानी मुहावरा शव के संपर्क से उत्पन्न विधिक अशुद्धता को सूचित करता है; इसे केवल ‘प्राण से अशुद्ध’ कहना आधुनिक पाठक के लिए भ्रामक होता।
- source_word: יִגַּע
  choice: छुए
  rationale: यहाँ נגע का अर्थ वास्तविक संपर्क या स्पर्श है और शुद्धता-विधि के प्रसंग में ‘छुए’ स्पष्ट तथा संक्षिप्त है।
- source_word: בְּכָל אֵלֶּה
  choice: इनमें से किसी वस्तु को
  rationale: वाक्यांश पिछली आयत में बताई गई वस्तुओं की ओर संकेत करता है; शर्तवाचक प्रश्न में हिन्दी का ‘इनमें से किसी’ उसका वितरणात्मक आशय स्पष्ट करता है।
- source_word: הֲיִטְמָא
  choice: क्या वह वस्तु अशुद्ध हो जाएगी?
  rationale: प्रश्न यह है कि स्पर्श की गई वस्तु में विधिक अशुद्धता संचारित होगी या नहीं; ‘हो जाएगी’ अवस्था-परिवर्तन को बनाए रखता है।
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ
  choice: याजकों ने उत्तर देकर कहा
  rationale: यह अनुवाद इब्रानी के ‘उत्तर दिया और कहा’ दोनों क्रियात्मक तत्वों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: יִטְמָא
  choice: वह अशुद्ध हो जाएगी
  rationale: उत्तर प्रश्न की क्रिया को दोहराकर अशुद्धता के संचार पर याजकों का विधिक निर्णय व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: मृत शरीर के कारण होने वाली विधिक या अनुष्ठानिक अशुद्धता
  alternative: नैतिक अशुद्धता अथवा शाब्दिक ‘प्राण से अशुद्धता’
  rationale: प्रसंग में हाग्गै तोराह की याजकीय शुद्धता-श्रेणियों के विषय में पूछ रहा है। טְמֵא נֶפֶשׁ शव-संपर्क से उत्पन्न अशुद्धता का मुहावरा है, इसलिए इसे नैतिक दोष के रूप में प्रस्तुत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। ‘याजक’ और ‘अशुद्ध’ जैसे स्थापित बाइबलीय शब्द विधिक शुद्धता के प्रसंग को स्पष्ट रखते हैं; प्रश्न और उत्तर में समान शब्दावली स्रोत की संरचना को सुरक्षित रखती है।
