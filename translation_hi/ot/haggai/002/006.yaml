id: HAG.2.6
reference: Haggai 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י כֹ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת ע֥וֹד אַחַ֖ת מְעַ֣ט הִ֑יא וַ/אֲנִ֗י מַרְעִישׁ֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וְ/אֶת הַ/יָּ֖ם וְ/אֶת הֶ/חָרָבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/006.yaml
  text: 'For this is what Yahweh of Armies says: Yet once more[a], in a little while[b], I will shake the heavens and the earth and the sea and the dry land.'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का याहवे यह कहता है: “एक बार फिर[a], थोड़े ही समय में[b], मैं आकाश और पृथ्वी, समुद्र और सूखी भूमि को हिला दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में भाव है: “एक बार और।”'
    reason: मूल की संक्षिप्त अभिव्यक्ति को दिखाने वाला शाब्दिक विकल्प।
  - marker: b
    text: 'इब्रानी वाक्यांश संक्षिप्त है: “एक बार और—थोड़ा ही समय है”; यह निकट समय में याहवे के आकाश, पृथ्वी, समुद्र और सूखी भूमि को हिलाने का संकेत देता है।'
    reason: असामान्य कालगत रचना को स्पष्ट करता है, बिना उसके समय-संबंध को आवश्यकता से अधिक निश्चित किए।
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת का ठोस, आधुनिक हिन्दी रूप ‘सेनाओं का’ चुना गया है।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यह कहता है
  rationale: भविष्यद्वाणी के संदेशवाहक-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पूर्ववर्ती कथन से כִּי का संबंध बनाए रखता है।
- source_word: עוֹד אַחַת מְעַט הִיא
  choice: एक बार फिर, थोड़े ही समय में
  rationale: संक्षिप्त और कुछ असामान्य इब्रानी वाक्यांश के दोनों तत्व—एक और बार तथा अल्प समय—बिना अनावश्यक व्याख्या के सुरक्षित रखे गए हैं।
- source_word: מַרְעִישׁ
  choice: मैं ... हिला दूँगा
  rationale: हिफ़ील कृदन्त का प्रसंगानुकूल आसन्न भविष्य अर्थ व्यक्त करता है; ‘हिला दूँगा’ सकर्मक/कारक बल को स्पष्ट रखता है।
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: आकाश और पृथ्वी
  rationale: यह पारंपरिक तथा सहज हिन्दी ब्रह्मांडीय युग्म है; यहाँ הָאָרֶץ का स्थानीय ‘देश’ नहीं बल्कि ‘पृथ्वी’ अर्थ उपयुक्त है।
- source_word: הַיָּם וְאֶת הֶחָרָבָה
  choice: समुद्र और सूखी भूमि
  rationale: समुद्र के विपरीत स्थल-भाग का अर्थ सुरक्षित रहता है और सृष्टि-संबंधी युग्म स्पष्ट होता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת में ईश्वरीय नाम और उपाधि
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु; मेज़बानों का यहोवा
  rationale: मूल पाठ में आए वाचा-नाम को उपाधि से प्रतिस्थापित नहीं किया गया; साथ ही צְבָאוֹת को आधुनिक पाठक के लिए अर्थपूर्ण ‘सेनाओं’ के रूप में अनूदित किया गया है।
- issue: עוֹד אַחַת מְעַט הִיא का कालगत संबंध
  choice: एक बार फिर, थोड़े ही समय में
  alternative: एक बार और—बस थोड़ा समय है; थोड़े समय बाद एक बार फिर
  rationale: चयन पुनरावृत्ति और निकट समय, दोनों को बनाए रखता है; यह बाद के बाइबलीय प्रयोग के आधार पर यहाँ अंतिमता या किसी विशिष्ट घटना को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यद्वाणी शैली। वाक्य सहज रखा गया है, पर मूल की ब्रह्मांडीय सूची, ईश्वरीय प्रथम पुरुष और कालगत संक्षिप्तता सुरक्षित हैं।
