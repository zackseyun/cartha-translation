source:
  edition: WLC
  text: וְ/עַתָּה֙ שִֽׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/טֶּ֧רֶם שֽׂוּם אֶ֛בֶן אֶל אֶ֖בֶן בְּ/הֵיכַ֥ל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/015.yaml
  text: 'And now[a], please set your heart on this from today onward: before one stone was placed upon another in the temple of Yahweh,'
translation:
  language: hi
  text: 'और अब, कृपया आज से आगे इस बात पर ध्यान से विचार करो[a]: याहवे के मंदिर में पत्थर पर पत्थर रखे जाने से पहले,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से, ‘अपने हृदय को लगाओ’ है; यह सावधानी से ध्यान देने या विचार करने का मुहावरा है।
    reason: मूल के हृदय-सम्बन्धी बिम्ब को दर्ज करते हुए हिन्दी में मुहावरे का आशय स्पष्ट करता है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण—दोनों को रखते हुए यह तत्काल दिए जा रहे आग्रह का स्वाभाविक संक्रमण बनता है।
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: कृपया ... इस बात पर मन लगाओ
  rationale: नָא के विनम्र आग्रह को ‘कृपया’ से और ‘अपने हृदय को लगाओ’ के इब्रानी बिम्ब को स्वाभाविक आधुनिक हिन्दी मुहावरे ‘मन लगाओ’ से व्यक्त किया गया है; इसका आशय ध्यानपूर्वक विचार करना है।
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: आज के इस दिन से आगे
  rationale: यह मूल अभिव्यक्ति के आरम्भ-बिन्दु और आगे की ओर संकेत को बनाए रखता है। निकटवर्ती ‘इससे पहले’ के कारण वाक्य में जानबूझकर बनी कालगत तनातनी को सरल करके मिटाया नहीं गया है।
- source_word: מִטֶּרֶם
  choice: इससे पहले कि
  rationale: यह मन्दिर में पत्थर रखे जाने से पहले के समय का परिचय देता है और हिन्दी में अगले उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: שׂוּם אֶבֶן אֶל אֶבֶן
  choice: एक पत्थर पर दूसरा पत्थर रखा गया था
  rationale: निर्माण के मूल दृश्य—पत्थर पर पत्थर रखने—को स्पष्ट, सामान्य हिन्दी में सुरक्षित रखा गया है।
- source_word: בְּהֵיכַל
  choice: मन्दिर में
  rationale: इस प्रसंग में הֵיכָל राजमहल नहीं, याहवे के मन्दिर-भवन को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और उसे उपाधि में नहीं बदलता।
- issue: कालगत अभिव्यक्ति और अगले ‘इससे पहले’ के बीच सम्बन्ध
  choice: मूल पाठ की कालगत तनातनी को बनाए रखना
  alternative: व्याख्यात्मक रूप से ‘आज से पीछे उस समय पर विचार करो’ कहना
  rationale: וָמָעְלָה का सामान्य बल आगे की ओर है, जबकि अगला खण्ड मन्दिर-निर्माण से पहले की दशा की ओर देखता है। अनुवाद ने किसी एक व्याख्या को चुपचाप निर्णायक नहीं बनाया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध स्तर रखा गया है। ‘मन लगाओ’ मूल हृदय-सम्बन्धी मुहावरे की हिन्दी में स्वाभाविक प्रतिध्वनि है। पद अगले पद में पूरी होने वाली विचार-श्रृंखला का भाग है, इसलिए अन्त में अल्पविराम रखा गया है।
