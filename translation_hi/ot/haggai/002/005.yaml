base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/005.yaml
  text: As for the promise that I made with you when you came out of Egypt[a], and my Spirit is standing in your midst[b]; do not fear.
translation:
  language: hi
  text: जहाँ तक उस प्रतिज्ञा की बात है, जो मैंने मिस्र से तुम्हारे निकलने के समय तुम्हारे साथ की थी[a]—और मेरी आत्मा तुम्हारे बीच खड़ी है[b]; मत डरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह वचन जिसे मैंने तुम्हारे साथ बाँधा था।” शाब्दिक रूप से, “वह वचन जिसे मैंने तुम्हारे साथ काटा था”; यह वाचा बाँधने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी आत्मा तुम्हारे बीच बनी रहती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַדָּבָר
  choice: जहाँ तक उस प्रतिज्ञा की बात है
  rationale: אֵת के साथ आया यह पद वाक्य के आरम्भ में लटका हुआ-सा है और पिछले पद की प्रतिज्ञात्मक उपस्थिति से जुड़ता है। केवल ‘वचन’ हिन्दी में यहाँ अत्यन्त खंडित लगता; ‘प्रतिज्ञा’ प्रसंग का वाचागत आशय व्यक्त करती है, जबकि पादटिप्पणी मूल शब्द और मुहावरे को सुरक्षित रखती है।
- source_word: אֲשֶׁר כָּרַתִּי אִתְּכֶם
  choice: जो मैंने ... तुम्हारे साथ की थी
  rationale: כרת का शाब्दिक अर्थ ‘काटना’ है, पर यहाँ यह वाचा बाँधने के मुहावरे को जगाता है। स्वाभाविक हिन्दी में प्रतिज्ञा ‘करना’ उपयुक्त है; शाब्दिक और वाचागत रंग पादटिप्पणी में दिया गया है।
- source_word: בְּצֵאתְכֶם מִמִּצְרַיִם
  choice: मिस्र से तुम्हारे निकलने के समय
  rationale: בְּ के साथ infinitive construct का कालगत अर्थ ‘जब/निकलने के समय’ है। यह निर्गमन की ऐतिहासिक घटना को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: וְרוּחִי
  choice: मेरी आत्मा
  rationale: इस वाचा और निर्गमन के प्रसंग में רוּחַ परमेश्वर की सक्रिय उपस्थिति को सूचित करता है; ‘आत्मा’ उसके व्यापक अर्थक्षेत्र को अनावश्यक रूप से ‘साँस’ तक सीमित नहीं करती।
- source_word: עֹמֶדֶת
  choice: खड़ी है
  rationale: वर्तमान कृदन्त निरन्तर स्थिति और ‘खड़े रहने’ की मूल छवि दोनों रखता है। अधिक सहज ‘बनी रहती है’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में है।
- source_word: בְּתוֹכְכֶם
  choice: तुम्हारे बीच
  rationale: यह समुदाय के मध्य उपस्थिति बताता है; ‘तुम्हारे भीतर’ व्यक्तिगत आन्तरिकता का ऐसा अर्थ दे सकता है जिसकी यहाँ आवश्यकता नहीं।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: रूּחִי को परमेश्वर की उपस्थिति के प्रसंग में कैसे व्यक्त किया जाए
  choice: मेरी आत्मा
  alternative: मेरी साँस
  rationale: वाचा-निर्गमन प्रसंग परमेश्वर की सक्रिय और स्थायी उपस्थिति की ओर संकेत करता है। ‘आत्मा’ इस अर्थ को व्यक्त करती है, पर पाठ में बाद की धर्मवैज्ञानिक विशिष्टताएँ नहीं जोड़ती।
- issue: דָּבָר ... כָּרַתִּי में वाचा-संबंधी भाषा को कितना स्पष्ट किया जाए
  choice: उस प्रतिज्ञा ... जो मैंने ... तुम्हारे साथ की थी
  alternative: वह वचन जिसे मैंने तुम्हारे साथ बाँधा/काटा था
  rationale: मूल में तकनीकी संज्ञा ‘वाचा’ नहीं, बल्कि ‘वचन/बात’ है; इसलिए मुख्य पाठ में ‘वाचा’ जोड़कर अर्थ को अधिक निश्चित नहीं किया गया। ‘प्रतिज्ञा’ प्रतिबद्धता का प्रसंगगत भाव देती है, और पादटिप्पणी मूल मुहावरे को दिखाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक संबोधन रखा गया है। आरम्भिक इब्रानी पद की व्याकरणिक असामान्यता को ‘जहाँ तक ... की बात है’ से कुछ हद तक बनाए रखते हुए वाक्य को सामान्य पाठक के लिए समझने योग्य बनाया गया है।
