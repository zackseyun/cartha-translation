  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה שֵׁנִית֙ אֶל חַגַּ֔י בְּ/עֶשְׂרִ֧ים וְ/אַרְבָּעָ֛ה לַ/חֹ֖דֶשׁ לֵ/אמֹֽר־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/020.yaml
  text: And the word of Yahweh came a second time to Haggai on the twenty-fourth day of the month[a], saying,
translation:
  language: hi
  text: 'और महीने के चौबीसवें दिन याहवे का वचन दूसरी बार हाग्गै के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: आया
  rationale: भविष्यवाणी के प्रचलित इब्रानी सूत्र में דְבַר יְהוָה के साथ यह स्वाभाविक हिन्दी है और वचन के प्राप्त होने की घटना व्यक्त करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: ‘वचन’ דָּבָר का सीधा अर्थ और भविष्यवाणी-सूत्र दोनों बनाए रखता है; יְהוָה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह ‘फिर’ की अपेक्षा क्रमसूचक अर्थ को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֶל חַגַּי
  choice: हाग्गै के पास
  rationale: बोलने या प्रकाशन के प्रसंग में אֶל का स्वाभाविक हिन्दी रूप है और संदेश के हाग्गै तक पहुँचने का भाव देता है।
- source_word: בְּעֶשְׂרִים וְאַרְבָּעָה לַחֹדֶשׁ
  choice: महीने के चौबीसवें दिन
  rationale: इब्रानी तिथि-सूत्र का स्पष्ट और स्वाभाविक हिन्दी अनुवाद; मूल में महीने का नाम यहाँ नहीं दिया गया है।
- source_word: לֵאמֹר
  choice: इसके बाद आने वाले प्रत्यक्ष कथन के लिए द्विबिंदु
  rationale: हिन्दी में ‘यह कहते हुए’ जोड़ने के बजाय द्विबिंदु अगले पद के कथन को स्वाभाविक ढंग से प्रस्तुत करता है और मूल की अग्रसूचक भूमिका बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार अक्षरों वाला ईश्वरीय नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है; इसे ‘प्रभु’ से बदलकर नाम और उपाधि का भेद मिटाया नहीं गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद अगले पद के प्रत्यक्ष कथन की भूमिका है, इसलिए अंत में द्विबिंदु रखा गया है।
