language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֣ן יִשָּׂא אִ֨ישׁ בְּשַׂר קֹ֜דֶשׁ בִּ/כְנַ֣ף בִּגְד֗/וֹ וְ/נָגַ֣ע בִּ֠/כְנָפ/וֹ אֶל הַ/לֶּ֨חֶם וְ/אֶל הַ/נָּזִ֜יד וְ/אֶל הַ/יַּ֧יִן וְ/אֶל שֶׁ֛מֶן וְ/אֶל כָּל מַאֲכָ֖ל הֲ/יִקְדָּ֑שׁ וַ/יַּעֲנ֧וּ הַ/כֹּהֲנִ֛ים וַ/יֹּאמְר֖וּ לֹֽא׀־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/012.yaml
  text: Suppose a man carries holy meat in the fold of his garment[a], and with his fold touches bread, stew, wine, oil, or any food—does it become holy? And the priests answered and said[b], “No.”
translation:
  language: hi
  text: “मान लो, कोई व्यक्ति अपने वस्त्र की तह[a] में पवित्र मांस लिया हुआ हो और वह उस तह से रोटी, पकाए हुए व्यंजन, दाखमधु, तेल या किसी भी भोजन को छूए—तो क्या वह भोजन पवित्र हो जाएगा?” याजकों ने उत्तर दिया, “नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने वस्त्र के किनारे (या दामन) में।”
    reason: כָּנָף के अर्थ-क्षेत्र में तह, किनारा, कोना और दामन सम्मिलित हैं; संदर्भ में वस्त्र का वही भाग अभिप्रेत है जिससे मांस उठाया गया और स्पर्श हुआ।
lexical_decisions:
- source_word: הֵן
  choice: मान लो
  rationale: यह शब्द यहाँ याजकों के सामने एक काल्पनिक परिस्थिति रखता है; आधुनिक हिन्दी में ‘मान लो’ उसका स्वाभाविक प्रश्नात्मक बल व्यक्त करता है।
- source_word: יִשָּׂא אִישׁ
  choice: कोई व्यक्ति ... लिए हुए है
  rationale: नशा क्रिया का यहाँ अर्थ किसी वस्तु को उठाकर या साथ लेकर चलना है; यह हिन्दी प्रयोग काल्पनिक परिस्थिति में सहज है।
- source_word: בְּשַׂר קֹדֶשׁ
  choice: पवित्र मांस
  rationale: इब्रानी पद का सीधा अर्थ ‘पवित्र मांस’ है और संदर्भ में यह बलि के लिए पवित्र ठहराए गए मांस को दर्शाता है।
- source_word: בִּכְנַף בִּגְדוֹ
  choice: अपने वस्त्र की तह में
  rationale: כָּנָף का अर्थ किनारा, कोना या दामन हो सकता है; यहाँ वस्त्र के उस भाग का आशय है जिसमें मांस रखा या उठाया गया है, इसलिए ‘तह’ कार्यगत अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנָגַע בִּכְנָפוֹ
  choice: उस तह से ... छूता है
  rationale: स्पर्श पवित्र मांस द्वारा सीधे नहीं, बल्कि उसे धारण करने वाले वस्त्र के भाग के माध्यम से होता है; अनुवाद इस मध्यस्थ संपर्क को बनाए रखता है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: संदर्भ में सामान्य और सीधा हिन्दी समतुल्य।
- source_word: נָזִיד
  choice: शोरबा
  rationale: यह उबाले या पकाए गए तरलयुक्त व्यंजन को सूचित करता है; ‘शोरबा’ आधुनिक हिन्दी में सहज है, यद्यपि ‘पका हुआ व्यंजन’ भी संभव है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का स्पष्ट, गरिमापूर्ण और बाइबलीय संदर्भ में परिचित हिन्दी रूप है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: इब्रानी पाठ केवल ‘तेल’ कहता है; संभवतः जैतून का तेल अभिप्रेत है, पर उसे पाठ में स्पष्ट नहीं किया गया।
- source_word: כָּל מַאֲכָל
  choice: किसी भी भोजन
  rationale: प्रश्न के संदर्भ में यह सूची को हर प्रकार की खाद्य वस्तु तक विस्तृत करता है।
- source_word: הֲיִקְדָּשׁ
  choice: क्या वह भोजन पवित्र हो जाएगा?
  rationale: निफ़अल रूप का परिणामसूचक निष्क्रिय भाव सुरक्षित है और ‘वह भोजन’ जोड़ने से हिन्दी में सर्वनाम का संदर्भ स्पष्ट होता है।
- source_word: וַיַּעֲנוּ הַכֹּהֲנִים וַיֹּאמְרוּ לֹא
  choice: याजकों ने उत्तर दिया, ‘नहीं।’
  rationale: हिन्दी में ‘उत्तर दिया और कहा’ अनावश्यक रूप से दोहरावपूर्ण होता; संक्षिप्त रूप वही कथात्मक अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: याजकीय व्यवस्था में संपर्क से पवित्रता का संचार
  choice: प्रश्न यह है कि पवित्र मांस को धारण करने वाले वस्त्र की तह के संपर्क से दूसरा भोजन पवित्र हो जाता है या नहीं; याजकों का उत्तर नकारात्मक है।
  alternative: इसे पवित्र मांस के सीधे संपर्क का प्रश्न समझा जा सकता है।
  rationale: इब्रानी पाठ पहले पवित्र मांस को वस्त्र के भाग में रखे होने और फिर उसी भाग द्वारा भोजन को छूने की बात करता है। अनुवाद इसे नैतिक या आंतरिक पवित्रता के बजाय अनुष्ठानिक-कानूनी प्रश्न के रूप में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और मौखिक प्रश्नोत्तर के अनुकूल शैली अपनाई गई है। ‘पवित्र’ अनुष्ठानिक अर्थ को खुला रखता है; ‘दाखमधु’ बाइबलीय संदर्भ में स्पष्ट है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
