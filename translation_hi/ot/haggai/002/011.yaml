revisions:
- from: 'सेनाओं का यहोवा यों कहता है: “याजकों से इस विषय में व्यवस्था का निर्णय[a] पूछो:'
  to: 'सेनाओं का याहवे यों कहता है: “याजकों से एक विधि-संबंधी निर्णय पूछो, यह कहते हुए:'
  rationale: The revision makes the priestly juridical/instructional force of תּוֹרָה intelligible in modern Hindi, while the footnote preserves the less specific lexical alternatives. It also explicitly renders לֵאמֹר and conforms the Hindi divine-name form to the English POB audit trail. The open quotation and final colon are retained because the quoted question continues in the next verse.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:03:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the prophetic formula, the divine name, the priests as addressees, and the forward-looking introduction to the question in v. 12. However, “इस विषय में व्यवस्था का निर्णय पूछो” over-specifies the syntax and produces an unclear object: the Hebrew asks the priests torah, understood contextually as priestly instruction or a legal ruling, rather than explicitly asking for “a decision of the law on this matter.”'
  naturalness: “याजकों से एक विधि-संबंधी निर्णय पूछो” is clearer and more idiomatic than “इस विषय में व्यवस्था का निर्णय पूछो.” “यह कहते हुए” directly represents לֵאמֹר and naturally introduces the question that follows.
  terminology: “याहवे” aligns the Hindi rendering with the audit trail’s rendering of the Tetragrammaton as “Yahweh.” “विधि-संबंधी निर्णय” conveys the contextual priestly-ruling sense of תּוֹרָה without identifying it with the Torah book. The footnote retains the broader lexical possibilities.
  issues:
  - severity: medium
    issue: The phrase “इस विषय में व्यवस्था का निर्णय” is syntactically and semantically unclear.
    rationale: It can sound as though a pre-existing decision belonging to the law is to be requested. In context, torah denotes instruction or a ruling to be supplied by priests.
  - severity: low
    issue: The divine name differs in form from the English POB audit trail.
    rationale: The audit trail explicitly uses “Yahweh”; “याहवे” is the corresponding modern Hindi transliteration, whereas “यहोवा” reflects a different traditional vocalization.
  - severity: low
    issue: לֵאמֹר is not represented explicitly.
    rationale: The draft’s colon does introduce the following content, but “यह कहते हुए” preserves the Hebrew connective more transparently and remains natural Hindi.
  revised_text: 'सेनाओं का याहवे यों कहता है: “याजकों से एक विधि-संबंधी निर्णय पूछो, यह कहते हुए:'
  revised_footnotes:
  - marker: a
    text: या “व्यवस्था के विषय में पूछो” अथवा “निर्देश पूछो।” यहाँ इब्रानी ‘तोराह’ का अर्थ सम्भवतः याजकों द्वारा दिया जाने वाला विधि-संबंधी निर्णय या निर्देश है, अनिवार्य रूप से तोराह की पुस्तक नहीं।
