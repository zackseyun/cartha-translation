reference: Haggai 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שְׁאַל נָ֧א אֶת הַ/כֹּהֲנִ֛ים תּוֹרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/011.yaml
  text: 'Thus says Yahweh of hosts: Ask the priests for a ruling[a], saying,'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “याजकों से एक विधि-संबंधी निर्णय पूछो, यह कहते हुए:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह इब्रानी भविष्यद्वाणी-संदेश का प्रचलित सूत्र है; हिन्दी में वर्तमान काल और ‘यों’ इसकी औपचारिक गरिमा को स्वाभाविक रूप से रखते हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित व्यक्तिवाचक रूप से प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन शब्द सैन्य समूहों या दलों की व्यापकता बनाए रखता है और परमेश्वर की उपाधि के पारंपरिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שְׁאַל־נָא
  choice: पूछो
  rationale: आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; נָא की विनम्र/प्रेरक छाया हिन्दी में अलग ‘कृपया’ जोड़ने पर इस ईश्वरीय आदेश को अस्वाभाविक बना सकती है।
- source_word: אֶת הַכֹּהֲנִים
  choice: याजकों से
  rationale: हिन्दी में ‘पूछना’ के साथ प्रश्न के संबोधित व्यक्तियों को ‘से’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: תּוֹרָה
  choice: व्यवस्था का निर्णय
  rationale: संदर्भ में याजकों से अनुष्ठानिक-विधिक निर्णय माँगा जा रहा है; ‘व्यवस्था’ तोराह से संबंध रखता है और ‘निर्णय’ उसके यहाँ कार्यात्मक अर्थ को स्पष्ट करता है।
- source_word: לֵאמֹר
  choice: 'इस विषय में … :'
  rationale: यह अगले पद में आने वाले प्रश्न का परिचय देता है। हिन्दी में उद्धरण से पहले ‘इस विषय में’ और द्विबिंदु, शाब्दिक ‘कहते हुए’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिवाचक वाचा-नाम है; उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ सामान्य पाठक के लिए अधिक पहचाना हुआ रूप है।
- issue: תּוֹרָה का आशय
  choice: व्यवस्था का निर्णय
  alternative: व्यवस्था के विषय में / शिक्षा
  rationale: अगले पदों के विधि-संबंधी प्रश्न दिखाते हैं कि यहाँ पूरी तोराह-पुस्तक का सामान्य उल्लेख आवश्यक नहीं, बल्कि याजकीय निर्देश या निर्णय अभिप्रेत है; पादटिप्पणी वास्तविक शब्दार्थ-विस्तार सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। वाक्य अगले पद के प्रश्न की ओर खुलता है; इसलिए अंत में द्विबिंदु है।
