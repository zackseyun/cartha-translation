  text: בַּ/יּ֣וֹם הַ/ה֣וּא נְאֻם יְהוָ֣ה צְבָא֡וֹת אֶ֠קָּחֲ/ךָ זְרֻבָּבֶ֨ל בֶּן שְׁאַלְתִּיאֵ֤ל עַבְדִּ/י֙ נְאֻם יְהוָ֔ה וְ/שַׂמְתִּ֖י/ךָ כַּֽ/חוֹתָ֑ם כִּֽי בְ/ךָ֣ בָחַ֔רְתִּי נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/023.yaml
  text: On that day[a], declares Yahweh of Armies, I will take you, Zerubbabel son of Shealtiel, my servant, declares Yahweh, and I will make you like a signet ring, for I have chosen you[b], declares Yahweh of Armies.
translation:
  language: hi
  text: “उस दिन,” सेनाओं का यहोवा घोषणा करता है, “हे शालतीएल के पुत्र जरुब्बाबेल, मेरे सेवक, मैं तुझे ले लूँगा,” यहोवा घोषणा करता है, “और तुझे मुहर की अंगूठी के समान बनाऊँगा, क्योंकि मैंने तुझे चुन लिया है,” सेनाओं का यहोवा घोषणा करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुहर की अंगूठी’ मूल्यवान अधिकार, स्वामित्व और प्रमाणीकरण का संकेत देती है; यिर्मयाह 22:24 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त काल-सूचक सूत्र है; ‘उस दिन’ स्वाभाविक आधुनिक हिन्दी में इसकी भावी और भविष्यसूचक शक्ति बनाए रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की यह घोषणा है
  rationale: נְאֻם को साधारण ‘कहता है’ के बजाय गंभीर भविष्यसूचक घोषणा के रूप में व्यक्त किया गया है। צְבָאוֹת के सैन्य और व्यापक दैवी शासन-संबंधी अर्थ को ‘सेनाओं’ से पारदर्शी रखा गया है।
- source_word: אֶקָּחֲךָ
  choice: मैं तुझे ले लूँगा
  rationale: לקח का मूल बिंब ‘लेना’ सुरक्षित रखा गया है; इसे केवल ‘चुनना’ नहीं बनाया गया, क्योंकि चुनाव की बात पद में आगे अलग से कही गई है।
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: हे शालतीएल के पुत्र जरुब्बाबेल
  rationale: प्रत्यक्ष संबोधन को हिन्दी में ‘हे’ से स्पष्ट किया गया है और वंश-सूचक संबंध को यथावत रखा गया है।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: राजकीय-भविष्यसूचक संदर्भ में ‘सेवक’ सौंपे गए दायित्व और परमेश्वर से संबंध को उपयुक्त रूप से व्यक्त करता है, बिना दासत्व का अनावश्यक अर्थ थोपे।
- source_word: וְשַׂמְתִּיךָ כַּחוֹתָם
  choice: और तुझे मुहर की अंगूठी के समान बनाऊँगा
  rationale: כַּ की उपमा तथा חוֹתָם के अधिकार, स्वामित्व और प्रमाणीकरण से जुड़े ठोस बिंब को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: כִּי בְךָ בָחַרְתִּי
  choice: क्योंकि मैंने तुझे चुन लिया है
  rationale: כִּי का कारणसूचक संबंध और पूर्ण हो चुके, किंतु प्रभावी बने हुए दैवी चुनाव का भाव दोनों व्यक्त होते हैं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निज नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी रूप ‘यहोवा’ में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा-संबंधी निज नाम सीधे आया है। हिन्दी पाठकों के बीच पहचाने जाने वाले ‘यहोवा’ से उस नाम को नाम के रूप में ही सुरक्षित रखा गया है।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का यहोवा; मेजबानों का प्रभु
  rationale: यह रूप यहोवा के स्वर्गीय और पृथ्वी की शक्तियों पर प्रभुत्व को स्पष्ट करता है और पारंपरिक किंतु आधुनिक हिन्दी में अस्पष्ट विकल्पों से बचता है।
- issue: ‘मुहर की अंगूठी’ का राजकीय या मसीही आशय
  choice: मुख्य पाठ में उपमा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखना
  alternative: ‘अपनी राजकीय मुहर की अंगूठी’ जैसे विस्तार से अर्थ स्पष्ट करना
  rationale: यिर्मयाह 22:24 और जरुब्बाबेल की दाऊदी वंशावली के प्रकाश में राजकीय पुनर्स्थापना का आशय संभव है, पर मूल पद केवल मुहर की उपमा और दैवी चुनाव कहता है; इसलिए व्याख्या को पादटिप्पणी तक सीमित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल इब्रानी में घोषणा-सूत्र की तीन बार पुनरावृत्ति को बनाए रखा गया है। प्रत्यक्ष संबोधन और उद्धरण-चिह्न वाक्य की संरचना स्पष्ट करते हैं; कोई संप्रदायगत मसीही निष्कर्ष मुख्य पाठ में नहीं जोड़ा गया।
