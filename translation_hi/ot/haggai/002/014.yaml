source:
  edition: WLC
  text: וַ/יַּ֨עַן חַגַּ֜י וַ/יֹּ֗אמֶר כֵּ֣ן הָֽ/עָם הַ֠/זֶּה וְ/כֵן הַ/גּ֨וֹי הַ/זֶּ֤ה לְ/פָנַ/י֙ נְאֻם יְהוָ֔ה וְ/כֵ֖ן כָּל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וַ/אֲשֶׁ֥ר יַקְרִ֛יבוּ שָׁ֖ם טָמֵ֥א הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/014.yaml
  text: Then Haggai answered and said[a], “So is this people, and so is this nation before me,” declares Yahweh, “and so is every work of their hands[b]; and what they offer there is unclean.”
translation:
  language: hi
  text: तब हाग्गै ने उत्तर देकर कहा, “मेरे सामने यह प्रजा[a] वैसी ही है[b], और यह राष्ट्र भी वैसा ही है,” याहवे की यह घोषणा है, “और इनके हाथों का हर काम भी वैसा ही है; और जो कुछ वे वहाँ चढ़ाते हैं, वह अशुद्ध है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यह प्रजा”; इस अभिव्यक्ति में दूरी या फटकार का भाव सुनाई दे सकता है।
    reason: cultural_note
  - marker: b
    text: अथवा, “इसी प्रकार यह प्रजा ... और इसी प्रकार यह राष्ट्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: ऐसे ही हैं / ऐसा ही है
  rationale: यह अनुवाद पिछले पदों में दी गई याजकीय उपमा से स्पष्ट तुलना को बनाए रखता है। इब्रानी में इस शब्द की पुनरावृत्ति है, इसलिए हिन्दी में भी उसके तुलनात्मक बल को दोहराया गया है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: आधुनिक हिन्दी में यह स्वाभाविक सामूहिक अभिव्यक्ति है और प्रसंग में निहित दूरी या फटकार के भाव को भी व्यक्त कर सकती है। अधिक शब्दशः रूप ‘यह प्रजा’ पादटिप्पणी में दिया गया है।
- source_word: הַגּוֹי הַזֶּה
  choice: यह राष्ट्र
  rationale: גּוֹי का सामान्य अर्थ ‘राष्ट्र’ है। यहाँ इसका संकेत यहूदा के लौटे हुए समुदाय की सामूहिक पहचान की ओर है, किसी गैर-यहूदी राष्ट्र की ओर नहीं।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह परमेश्वर की उपस्थिति और उसकी दृष्टि में समुदाय की दशा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह भविष्यद्वाणी के अधिकारपूर्ण सूत्र की गंभीरता को बनाए रखता है।
- source_word: כָּל מַעֲשֵׂה יְדֵיהֶם
  choice: इनके हाथों का हर काम
  rationale: इब्रानी मुहावरे को निकटता से रखते हुए आधुनिक हिन्दी में सुबोध बनाया गया है।
- source_word: וַאֲשֶׁר יַקְרִיבוּ
  choice: जो कुछ वे ... चढ़ाते हैं
  rationale: बलिदान-संबंधी प्रसंग में קרב के हिफ़ील रूप का अर्थ किसी वस्तु को भेंट के रूप में प्रस्तुत या अर्पित करना है; ‘चढ़ाते हैं’ इस अर्थ को संक्षेप में स्पष्ट करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: मूल पाठ स्थान को केवल संकेतित करता है; इसलिए वेदी या मन्दिर को स्पष्ट रूप से जोड़कर अर्थ को सीमित नहीं किया गया।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: पिछले पदों में पवित्रता और अशुद्धता की याजकीय शब्दावली के अनुरूप ‘अशुद्ध’ अनुष्ठानिक स्थिति को ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम सीधे प्रयुक्त हुआ है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: ‘यह राष्ट्र’ का संदर्भ
  choice: यहूदा का लौटा हुआ वाचा-समुदाय
  alternative: आस-पास के गैर-यहूदी राष्ट्र
  rationale: प्रसंग में हाग्गै उसी समुदाय और उसकी भेंटों पर याजकीय अशुद्धता की उपमा लागू कर रहा है। फिर भी अनुवाद केवल ‘राष्ट्र’ कहता है और व्याख्यात्मक पहचान को मुख्य पाठ में नहीं जोड़ता।
- issue: अशुद्धता का स्वरूप
  choice: समुदाय के काम और चढ़ावे याजकीय उपमा के अनुसार अशुद्ध हैं
  alternative: केवल नैतिक रूप से बुरे या केवल अनुष्ठानिक रूप से अमान्य
  rationale: טָמֵא पवित्रता-संबंधी तकनीकी शब्द है, पर प्रसंग इस उपमा को समुदाय के व्यापक काम पर लागू करता है। इसलिए पाठ की अनुष्ठानिक भाषा और उसके नैतिक-धार्मिक विस्तार के बीच तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऐसे ही’ की पुनरावृत्ति मूल इब्रानी की तुलना और पिछले पदों की याजकीय उपमा को बनाए रखती है। ‘चढ़ाते हैं’ से बलिदान-संबंधी प्रसंग स्पष्ट होता है, जबकि ‘वहाँ’ को जानबूझकर अनिर्दिष्ट रखा गया है।
