id: HAG.2.8
reference: Haggai 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ֥/י הַ/כֶּ֖סֶף וְ/לִ֣/י הַ/זָּהָ֑ב נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/008.yaml
  text: The silver is mine[a], and the gold is mine[b], declares Yahweh of Armies.
translation:
  language: hi
  text: “चाँदी मेरी है, और सोना भी मेरा है,” सेनाओं का याहवे घोषणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִי
  choice: मेरी है / मेरा है
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित לְ यहाँ अधिकार या स्वामित्व व्यक्त करता है। हिन्दी में चाँदी के साथ स्त्रीलिंग ‘मेरी है’ और सोने के साथ पुल्लिंग ‘मेरा है’ स्वाभाविक है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: सोने के समानांतर आने के कारण यहाँ כֶּסֶף का अर्थ मुद्रा नहीं, बल्कि धातु ‘चाँदी’ है। हिन्दी में निश्चितता सूचक उपपद आवश्यक नहीं है।
- source_word: וְלִי
  choice: और ... भी मेरा है
  rationale: इब्रानी में לִי की पुनरावृत्ति दोनों धातुओं पर यहोवा के स्वामित्व को बल देती है। ‘भी’ उस बल को सहज हिन्दी में स्पष्ट करता है।
- source_word: הַזָּהָב
  choice: सोना
  rationale: यह बहुमूल्य धातु को सूचित करता है और ‘चाँदी’ के साथ मूल समानांतरता बनाए रखता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: भविष्यद्वाणी के इस गंभीर सूत्र को आधुनिक, गरिमापूर्ण हिन्दी में संज्ञात्मक रूप से व्यक्त किया गया है; इससे मूल के ‘उद्गार/घोषणा’ वाले भाव को केवल ‘कहता है’ में समतल नहीं किया जाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित और पहचानने योग्य लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह बहुवचन ‘सेनाओं’ का सीधा और आधुनिक हिन्दी रूप है; यह पारंपरिक किंतु आज कम स्पष्ट ‘सबाओत’ जैसे लिप्यंतरण की अपेक्षा अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम सीधे उपस्थित है, इसलिए उसे ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक व्यापक रूप से पहचाना जाता है; ‘याहवे’ संभावित शैक्षिक लिप्यंतरण है।
- issue: יהוה צבאות का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का यहोवा / सबाओत यहोवा
  rationale: ‘सेनाओं के यहोवा’ हिन्दी में उपाधि की संबंधवाचक संरचना को स्वाभाविक ढंग से व्यक्त करता है और צְבָאוֹת के सैन्य/समूहवाचक अर्थ को बनाए रखता है।
- issue: दोनों बहुमूल्य धातुओं पर दिव्य स्वामित्व का बल
  choice: चाँदी मेरी है, और सोना भी मेरा है
  alternative: चाँदी और सोना मेरे हैं
  rationale: संक्षिप्त विकल्प अर्थ तो देता है, पर मूल में לִי की पुनरावृत्ति से आए अलग-अलग और बलपूर्ण स्वामित्व-दावे को खो देता है। चुना हुआ रूप उसी बल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण भविष्यद्वाणी शैली। मूल की संतुलित समानांतर रचना और स्वामित्व पर बल बनाए रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
