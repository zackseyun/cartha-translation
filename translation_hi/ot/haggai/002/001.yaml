base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/001.yaml
  text: On the twenty-first day of the seventh month[a], the word of Yahweh came by the hand of Haggai the prophet, saying,
translation:
  language: hi
  text: 'सातवें महीने के इक्कीसवें दिन याहवे का वचन हाग्गै नबी के द्वारा[a] आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हाग्गै नबी के हाथ से’; अर्थात हाग्गै नबी के माध्यम से या उसके द्वारा।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשְּׁבִיעִי בְּעֶשְׂרִים וְאֶחָד לַחֹדֶשׁ
  choice: सातवें महीने के इक्कीसवें दिन
  rationale: यह पूरा पदबंध एक तिथि बताता है। हिन्दी में स्वाभाविक क्रम के लिए निहित ‘दिन’ को स्पष्ट किया गया है।
- source_word: הָיָה דְּבַר יְהוָה
  choice: यहोवा का वचन ... आया
  rationale: यह भविष्यद्वाणी की मानक उद्घाटन-अभिव्यक्ति है; ‘आया’ प्रकाशन की घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: हाग्गै नबी के हाथ से
  rationale: मूल इब्रानी का ‘हाथ से’ मुहावरा सुरक्षित रखा गया है; यहाँ यह हाग्गै की माध्यमता या अभिकरण दर्शाता है।
- source_word: לֵאמֹר
  choice: इस प्रकार
  rationale: यह आगामी प्रत्यक्ष वचन का परिचय देता है। हिन्दी में ‘इस प्रकार आया:’ इस संवाद-सूचक कार्य को स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: भविष्यद्वाणी में हाग्गै की माध्यमता
  choice: हाग्गै नबी के हाथ से
  alternative: हाग्गै नबी के द्वारा
  rationale: शाब्दिक मुहावरे को मुख्य पाठ में रखने से मूल की अभिव्यक्ति और भविष्यद्वक्ता की माध्यमता दोनों बनी रहती हैं; पादटिप्पणी उसका अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। तिथि को स्वाभाविक हिन्दी क्रम में रखा गया है, जबकि ‘हाथ से’ मुहावरे को स्रोत की बनावट बनाए रखने के लिए पादटिप्पणी सहित सुरक्षित रखा गया है।
