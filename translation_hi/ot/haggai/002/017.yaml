  text: הִכֵּ֨יתִי אֶתְ/כֶ֜ם בַּ/שִּׁדָּפ֤וֹן וּ/בַ/יֵּֽרָקוֹן֙ וּ/בַ/בָּרָ֔ד אֵ֖ת כָּל מַעֲשֵׂ֣ה יְדֵי/כֶ֑ם וְ/אֵין אֶתְ/כֶ֥ם אֵלַ֖/י נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/017.yaml
  text: I struck you with blight and mildew and hail[a], all the work of your hands; yet you did not turn to me, declares Yahweh.
translation:
  language: hi
  text: “मैंने झुलसा रोग, पौधों के पीले पड़ने और ओलों से तुम्हें और तुम्हारे हाथों के सारे काम को मारा; फिर भी तुम मेरी ओर नहीं फिरे[a]”—याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम मेरी ओर नहीं थे” या “तुममें से कोई मेरी ओर नहीं था”; प्रसंग में भाव यह है कि वे याहवे की ओर नहीं लौटे।
    reason: मूल इब्रानी वाक्यांश में स्पष्ट क्रिया नहीं है और उसके एक से अधिक शाब्दिक रूप संभव हैं।
lexical_decisions:
- source_word: הִכֵּיתִי
  choice: मैंने…मारा
  rationale: नכה के प्रत्यक्ष अर्थ ‘मारना/प्रहार करना’ और परमेश्वर की स्पष्ट कर्तृता को बनाए रखता है।
- source_word: בַּשִּׁדָּפוֹן
  choice: झुलसा रोग
  rationale: यह फसलों को झुलसाने या सुखाने वाली कृषि-विपत्ति को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וּבַיֵּרָקוֹן
  choice: पीलापन
  rationale: यह पौधों के पीले या फीके पड़ने की दशा को व्यक्त करता है और ‘झुलसा रोग’ से मूल शब्द का भेद बनाए रखता है।
- source_word: וּבַבָּרָד
  choice: और ओलों से
  rationale: בָּרָד का सीधा और स्वाभाविक हिन्दी अर्थ ‘ओले’ है।
- source_word: אֵת כָּל מַעֲשֵׂה יְדֵיכֶם
  choice: तुम्हारे हाथों के सारे काम को
  rationale: मूल इब्रानी मुहावरे और मानव श्रम तथा उसकी उपज के व्यापक आशय को बनाए रखता है।
- source_word: וְאֵין אֶתְכֶם אֵלַי
  choice: फिर भी तुम मेरी ओर नहीं फिरे
  rationale: मूल वाक्यांश क्रियाहीन और संक्षिप्त है; प्रसंग में यह दंड के बाद भी परमेश्वर की ओर न लौटने का भाव व्यक्त करता है। पादटिप्पणी अधिक शाब्दिक संभावनाओं को सुरक्षित रखती है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: गंभीर भविष्यद्वाणी-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
theological_decisions:
- issue: וְאֵין אֶתְכֶם אֵלַי की क्रियाहीन और अर्थ-संक्षिप्त अभिव्यक्ति
  choice: “फिर भी तुम मेरी ओर नहीं फिरे”
  alternative: “फिर भी तुम मेरे साथ नहीं थे” अथवा “फिर भी तुममें से कोई मेरी ओर नहीं था”
  rationale: प्रसंग में परमेश्वर के अनुशासन के बावजूद लोगों के न लौटने का भाव प्रमुख है। मुख्य पाठ अर्थ को सुबोध बनाता है, जबकि पादटिप्पणी मूल की वास्तविक व्याकरणिक अस्पष्टता को छिपने नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। कृषि-संबंधी दोनों विपत्तियों का भेद बनाए रखने के लिए ‘झुलसा रोग’ और ‘पीलापन’ चुने गए हैं। मूल के दूसरे कर्म-वाक्यांश को निकट रखकर प्रस्तुत करने हेतु डैश और अर्धविराम का प्रयोग किया गया है।
