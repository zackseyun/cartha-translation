source:
  edition: WLC
  text: הַ/ע֤וֹד הַ/זֶּ֨רַע֙ בַּ/מְּגוּרָ֔ה וְ/עַד הַ/גֶּ֨פֶן וְ/הַ/תְּאֵנָ֧ה וְ/הָ/רִמּ֛וֹן וְ/עֵ֥ץ הַ/זַּ֖יִת לֹ֣א נָשָׂ֑א מִן הַ/יּ֥וֹם הַ/זֶּ֖ה אֲבָרֵֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/019.yaml
  text: Is the seed still in the storehouse? Even the vine[a], the fig tree, the pomegranate, and the olive tree have not borne fruit. From this day on I will bless you.
translation:
  language: hi
  text: क्या बीज अभी भी भंडार-घर में है? और दाखलता, अंजीर का पेड़, अनार का पेड़ और जैतून का पेड़—इनमें से किसी ने भी अब तक फल नहीं दिया है। आज से मैं तुम्हें[a] आशीष दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “मैं आशीष दूँगा” है; किसे आशीष दी जाएगी, यह प्रसंग से समझा जाता है।
    reason: मूल इब्रानी में क्रिया का कर्म निहित है, स्पष्ट रूप से लिखा नहीं गया।
lexical_decisions:
- source_word: הַע֤וֹד הַזֶּ֨רַע֙ בַּמְּגוּרָ֔ה
  choice: क्या बीज अब भी भंडार में है?
  rationale: प्रश्नवाचक प्रयोग में עוֹד वर्तमान समय तक बनी हुई स्थिति को दर्शाता है; “अब भी” इसका स्वाभाविक हिन्दी रूप है। מְגוּרָה अनाज या उपज रखने का स्थान है, इसलिए “भंडार” पर्याप्त व्यापक और सहज है।
- source_word: וְעַד
  choice: भी अब तक
  rationale: यह पद बीज के प्रश्न से आगे सूचीबद्ध फलदार पौधों तक बात बढ़ाता है और वर्तमान समय तक उनकी निष्फलता का भाव देता है। “भी अब तक” हिन्दी में इस विस्तार और कालगत अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֶּפֶן וְהַתְּאֵנָה וְהָרִמּוֹן וְעֵץ הַזַּיִת
  choice: दाखलता, अंजीर, अनार और जैतून के पेड़
  rationale: ये आधुनिक हिन्दी में प्रचलित कृषि-संबंधी नाम हैं। “दाखलता” गֶּפֶן को स्पष्ट करता है, जबकि अंतिम पद में עֵץ के अनुरूप “पेड़” रखा गया है और सूची पर स्वाभाविक रूप से लागू होता है।
- source_word: לֹא נָשָׂא
  choice: फल नहीं दिया है
  rationale: नָשָׂא का मूल अर्थ उठाना या धारण करना है, पर फलदार पौधों के संदर्भ में इसका मुहावरेदार अर्थ फल देना है। एकवचन क्रिया को इब्रानी की सामूहिक सूची के अनुरूप हिन्दी में “पेड़ ने” के साथ रखा गया है।
- source_word: מִן הַיּוֹם הַזֶּה
  choice: आज के दिन से
  rationale: यह वाक्यांश इसी दिन से आरम्भ होने वाले निर्णायक परिवर्तन को सूचित करता है। “आज के दिन से” मूल की औपचारिकता और भावी दिशा दोनों बनाए रखता है।
- source_word: אֲבָרֵךְ
  choice: मैं तुम्हें आशीष दूँगा
  rationale: पिएल अपूर्ण 1cs यहाँ भविष्य की प्रतिज्ञा व्यक्त करता है। हिन्दी में “आशीष दूँगा” स्वाभाविक है; स्पष्ट कर्म मूल में नहीं है, इसलिए उसे पादटिप्पणी से चिह्नित किया गया है।
theological_decisions:
- issue: “मैं आशीष दूँगा” में निहित कर्म
  choice: मुख्य पाठ में “तुम्हें” जोड़ा गया और पादटिप्पणी से चिह्नित किया गया।
  alternative: 'कर्म को अनकहा छोड़ना: “मैं आशीष दूँगा।”'
  rationale: इब्रानी क्रिया के साथ कर्म व्यक्त नहीं है, पर संबोधित समुदाय संदर्भ से निहित है। हिन्दी में कर्म जोड़ने से प्रतिज्ञा स्पष्ट और स्वाभाविक होती है; पादटिप्पणी मूल की व्याकरणिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कृषि-संबंधी शब्दावली परिचित है, और मूल की संक्षिप्त भविष्यवाणी-शैली को बनाए रखा गया है।
