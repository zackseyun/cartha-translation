source:
  edition: WLC
  text: וְ/הָֽפַכְתִּי֙ כִּסֵּ֣א מַמְלָכ֔וֹת וְ/הִ֨שְׁמַדְתִּ֔י חֹ֖זֶק מַמְלְכ֣וֹת הַ/גּוֹיִ֑ם וְ/הָפַכְתִּ֤י מֶרְכָּבָה֙ וְ/רֹ֣כְבֶ֔י/הָ וְ/יָרְד֤וּ סוּסִים֙ וְ/רֹ֣כְבֵי/הֶ֔ם אִ֖ישׁ בְּ/חֶ֥רֶב אָחִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/022.yaml
  text: I will overturn the throne of kingdoms[a], and I will destroy the strength of the kingdoms of the nations. I will overturn the chariot and its rider, and horses and their riders will go down[b], each by the sword of his brother.
translation:
  language: hi
  text: मैं राज्यों के सिंहासन को उलट दूँगा[a] और राष्ट्रों के राज्यों की शक्ति को नष्ट कर दूँगा। मैं रथ और उसके सवारों को उलट दूँगा, और घोड़े और उनके सवार गिर पड़ेंगे—हर एक अपने भाई की तलवार से[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं राज्यों के सिंहासन को ढा दूँगा।”
    reason: lexical_alternative
  - marker: b
    text: “हर एक अपने भाई की तलवार से” आपसी संहार या आंतरिक संघर्ष को व्यक्त करने वाला इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָפַכְתִּי
  choice: मैं ... उलट दूँगा
  rationale: न्याय के इस प्रसंग में הפך सत्ता को उलटने या गिरा देने का भाव रखता है। “उलट दूँगा” सिंहासन और रथ—दोनों के ठोस बिंब को बनाए रखता है।
- source_word: כִּסֵּא מַמְלָכוֹת
  choice: राज्यों के सिंहासन
  rationale: इब्रानी में “सिंहासन” एकवचन है और संभवतः सामूहिक या प्रतीकात्मक रूप से राजसत्ता को दर्शाता है; हिन्दी में भी एकवचन को सुरक्षित रखा गया है।
- source_word: וְהִשְׁמַדְתִּי
  choice: नष्ट कर दूँगा
  rationale: שׁמד का हिफ़ईल रूप प्रबल विनाश-सूचक क्रिया है। “नष्ट कर दूँगा” स्वाभाविक और पर्याप्त रूप से बलवान है।
- source_word: חֹזֶק
  choice: शक्ति
  rationale: חֹזֶק का अर्थ शक्ति या सामर्थ्य है; राजनीतिक और सैनिक संदर्भ में “शक्ति” स्पष्ट तथा स्वाभाविक है।
- source_word: מַמְלְכוֹת הַגּוֹיִם
  choice: राष्ट्रों के राज्य
  rationale: यहाँ גּוֹיִם भू-राजनीतिक अर्थ में राष्ट्रों को सूचित करता है; “राष्ट्रों” आधुनिक हिन्दी में स्पष्ट है।
- source_word: מֶרְכָּבָה וְרֹכְבֶיהָ
  choice: रथ और उसके सवारों
  rationale: מֶרְכָּבָה एकवचन है, जबकि רֹכְבֶיהָ रूपतः बहुवचन है। हिन्दी अनुवाद दोनों व्याकरणिक संख्याओं को बनाए रखता है और सामूहिक सैनिक बिंब को स्पष्ट रहने देता है।
- source_word: וְיָרְדוּ
  choice: गिर पड़ेंगे
  rationale: ירד का मूल अर्थ नीचे जाना है, पर युद्ध के संदर्भ में यह पराजित होकर गिरने का भाव देता है। “गिर पड़ेंगे” हिन्दी में उस प्रसंगगत अर्थ और नीचे गिरने के बिंब दोनों को व्यक्त करता है।
- source_word: סוּסִים וְרֹכְבֵיהֶם
  choice: घोड़े और उनके सवार
  rationale: यह सीधा और संख्या-संगत अनुवाद है; युद्ध का संदर्भ रथ और सवारों से पहले ही स्पष्ट है।
- source_word: אִישׁ בְּחֶרֶב אָחִיו
  choice: हर एक अपने भाई की तलवार से
  rationale: यह वाक्यांश आपसी संहार या आंतरिक संघर्ष का मुहावरा है। निकटस्थ शब्दावली और पुल्लिंग युद्ध-संदर्भ को सुरक्षित रखते हुए हिन्दी में स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: אִישׁ ... אָחִיו में लिंग-सूचक भाषा और आपसी हिंसा का भाव
  choice: हर एक अपने भाई की तलवार से
  alternative: हर एक दूसरे की तलवार से
  rationale: मूल पाठ में पुल्लिंग एकवचन “मनुष्य/व्यक्ति” और “उसका भाई” है। “भाई” को बनाए रखने से मूल बिंब और युद्धरत पुरुषों का संदर्भ सुरक्षित रहता है, जबकि टिप्पणी इसके मुहावरेदार आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भविष्यकालीन दैवी घोषणाओं में “कर दूँगा” का प्रयोग निर्णायकता व्यक्त करता है। मूल के एकवचन “सिंहासन” और “रथ,” तथा बहुवचन “सवारों” को यथासंभव सुरक्षित रखा गया है।
