source:
  edition: WLC
  text: שִׂימוּ נָ֣א לְבַבְ/כֶ֔ם מִן הַ/יּ֥וֹם הַ/זֶּ֖ה וָ/מָ֑עְלָ/ה מִ/יּוֹם֩ עֶשְׂרִ֨ים וְ/אַרְבָּעָ֜ה לַ/תְּשִׁיעִ֗י לְ/מִן הַ/יּ֛וֹם אֲשֶׁר יֻסַּ֥ד הֵֽיכַל יְהוָ֖ה שִׂ֥ימוּ לְבַבְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/018.yaml
  text: Set your heart on this from this day onward[a], from the twenty-fourth day of the ninth month, from the day when the temple of Yahweh was founded; consider it.
translation:
  language: hi
  text: 'कृपया इस दिन से आगे के लिए ध्यान से विचार करो: नौवें महीने के चौबीसवें दिन से, अर्थात् उस दिन से जब याहवे के मन्दिर की नींव डाली गई थी—ध्यान से विचार करो।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂימוּ נָא לְבַבְכֶם
  choice: अपना मन लगाओ
  rationale: यह इब्रानी मुहावरे के ‘मन/हृदय लगाने’ वाले चित्र को बनाए रखता है और सावधानी से विचार करने का आग्रह व्यक्त करता है। נָא की विनम्र/आग्रहात्मक छाया को हिन्दी में अलग शब्द जोड़कर बोझिल बनाने के बजाय पूरे वाक्य के आग्रहपूर्ण स्वर में रखा गया है।
- source_word: מִן הַיּוֹם הַזֶּה וָמָעְלָה
  choice: आज के दिन से आगे की बातों पर
  rationale: यह समय-सूचक वाक्यांश वर्तमान दिन को आरम्भ-बिन्दु बनाकर आगे की ओर संकेत करता है। ‘बातों पर’ हिन्दी में ‘मन लगाओ’ के साथ स्वाभाविक संबंध बनाता है, बिना भविष्य की घटनाओं का स्वरूप तय किए।
- source_word: מִיּוֹם עֶשְׂרִים וְאַרְבָּעָה לַתְּשִׁיעִי
  choice: नौवें महीने के चौबीसवें दिन से
  rationale: इब्रानी तिथि को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: לְמִן הַיּוֹם
  choice: उस दिन से
  rationale: यह पहले दिए गए समय-सूचक आरम्भ-बिन्दु को फिर से उठाता और अधिक स्पष्ट करता है।
- source_word: אֲשֶׁר יֻסַּד
  choice: जब ... की स्थापना हुई थी
  rationale: יסד के होफाल रूप का निष्क्रिय अर्थ ‘स्थापित किया गया/नींव डाली गई’ है। मुख्य पाठ में ‘स्थापना हुई’ सहज है; अधिक ठोस निर्माण-संबंधी विकल्प पादटिप्पणी में दिया गया है।
- source_word: הֵיכַל יְהוָה
  choice: याहवे का मन्दिर
  rationale: הֵיכַל यहाँ मन्दिर-भवन को दर्शाता है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
- source_word: שִׂימוּ לְבַבְכֶם
  choice: इस पर अपना मन लगाओ
  rationale: अन्तिम आज्ञा की पुनरावृत्ति को बनाए रखा गया है; ‘इस पर’ प्रसंग में निहित विषय को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित आधुनिक विद्वत्तापूर्ण लिप्यन्तरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: मन्दिर की ‘स्थापना’ अथवा ‘नींव डाले जाने’ का अर्थ
  choice: मुख्य पाठ में ‘स्थापना हुई थी’
  alternative: ‘नींव डाली गई थी’
  rationale: निष्क्रिय יסד दोनों अभिव्यक्तियों का आधार देता है। मुख्य पाठ व्यापक शाब्दिक अर्थ रखता है, जबकि पादटिप्पणी निर्माण-संबंधी ठोस सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आग्रहपूर्ण स्वर रखा गया है। इब्रानी ‘मन लगाने’ के मुहावरे और उसकी अन्तिम पुनरावृत्ति को जानबूझकर बनाए रखा गया है; अनावश्यक आरम्भिक ‘अब’ नहीं जोड़ा गया।
