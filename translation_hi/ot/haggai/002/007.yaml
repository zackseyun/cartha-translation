source:
  edition: WLC
  text: וְ/הִרְעַשְׁתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וּ/בָ֖אוּ חֶמְדַּ֣ת כָּל הַ/גּוֹיִ֑ם וּ/מִלֵּאתִ֞י אֶת הַ/בַּ֤יִת הַ/זֶּה֙ כָּב֔וֹד אָמַ֖ר יְהוָ֥ה צְבָאֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/007.yaml
  text: And I will shake all the nations[a], and the treasures of all the nations will come, and I will fill this house with glory, says Yahweh of Armies.
translation:
  language: hi
  text: मैं सब राष्ट्रों को हिला दूँगा[a], और सब राष्ट्रों की बहुमूल्य वस्तुएँ आएँगी; और मैं इस भवन को महिमा से भर दूँगा—यह सेनाओं के यहोवा का कथन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परम्परागत अनुवाद के अनुसार, “सब राष्ट्रों की अभिलाषा आएगी।” इब्रानी का अर्थ “मनभावनी वस्तुएँ” या “बहुमूल्य वस्तुएँ” भी हो सकता है; बहुवचन क्रिया सामूहिक अर्थ के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְעַשְׁתִּי
  choice: मैं ... हिला दूँगा
  rationale: रעשׁ के हिफ़ील रूप में किसी को हिलाने या काँपने पर विवश करने का भाव है। ‘हिला दूँगा’ स्वाभाविक हिन्दी में ईश्वर की सक्रिय कारक भूमिका बनाए रखता है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: גּוֹיִם का सामान्य अर्थ ‘राष्ट्र’ है; यहाँ इसे किसी विशेष धर्मवैज्ञानिक श्रेणी के रूप में नहीं लिया गया है।
- source_word: וּבָאוּ חֶמְדַּת כָּל הַגּוֹיִם
  choice: और सब राष्ट्रों की बहुमूल्य वस्तुएँ आएँगी
  rationale: חֶמְדַּת रूप में एकवचन होते हुए भी सामूहिक अर्थ दे सकता है। बहुवचन क्रिया וּבָאוּ के कारण मूल्यवान या वांछनीय वस्तुओं का सामूहिक अर्थ अधिक संगत है।
- source_word: וּמִלֵּאתִי
  choice: मैं ... भर दूँगा
  rationale: מלא के पिअेल रूप का सीधा अर्थ ‘भरना’ है; ‘भर दूँगा’ भविष्यकालीन प्रतिज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘घर/भवन’ है और प्रसंग में यह मन्दिर है। ‘भवन’ मूल अभिव्यक्ति को रखते हुए गरिमामय और स्पष्ट है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: मन्दिर और परमेश्वर की उपस्थिति के प्रसंग में כָּבוֹד के वैभव, गौरव और दिव्य महिमा के अर्थ को ‘महिमा’ उचित रूप से व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत नाम יהוה को ‘यहोवा’ और צְבָאוֹת को पारदर्शी आधुनिक हिन्दी ‘सेनाओं के’ से व्यक्त किया गया है, जिससे उपाधि की सामरिक और ब्रह्माण्डीय शक्ति बनी रहती है।
theological_decisions:
- issue: חֶמְדַּת כָּל־הַגּוֹיִם का अभिप्राय
  choice: 'सामूहिक/भौतिक अर्थ: ‘सब राष्ट्रों की बहुमूल्य वस्तुएँ’'
  alternative: 'व्यक्तिगत/मसीहाई अर्थ: ‘सब राष्ट्रों की अभिलाषा’; अथवा ‘सब राष्ट्रों की मनभावनी वस्तुएँ’'
  rationale: संज्ञा सामूहिक अर्थ में मूल्यवान वस्तुओं को सूचित कर सकती है, और उसके साथ प्रयुक्त बहुवचन क्रिया इस अर्थ का प्रबल समर्थन करती है। फिर भी इब्रानी की वास्तविक अर्थ-सम्भावना और परम्परागत व्यक्तिगत पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ प्रसंगगत मन्दिर को दर्शाता है, जबकि मूल के ‘घर’ संबंधी रूपक से अत्यधिक दूर नहीं जाता। वाक्य के अन्त में ‘यह ... का कथन है’ נְאֻם-सदृश prophetic formula नहीं बल्कि אָמַר का औपचारिक, स्वाभाविक हिन्दी निरूपण है।
