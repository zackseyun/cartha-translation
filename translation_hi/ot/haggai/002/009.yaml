  text: גָּד֣וֹל יִֽהְיֶ֡ה כְּבוֹד֩ הַ/בַּ֨יִת הַ/זֶּ֤ה הָ/אַֽחֲרוֹן֙ מִן הָ֣/רִאשׁ֔וֹן אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וּ/בַ/מָּק֤וֹם הַ/זֶּה֙ אֶתֵּ֣ן שָׁל֔וֹם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/009.yaml
  text: The latter glory of this house will be greater than the former[a], says Yahweh of Armies; and in this place I will give peace[b], declares Yahweh of Armies.
translation:
  language: hi
  text: “इस भवन की बाद की महिमा पहली महिमा से बढ़कर होगी,” सेनाओं के याहवे कहते हैं; “और इस स्थान में मैं शांति दूँगा,” सेनाओं के याहवे की घोषणा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּדוֹל יִהְיֶה ... מִן־הָרִאשׁוֹן
  choice: इसकी पहली महिमा से बढ़कर होगी
  rationale: गָּדוֹל का היה के साथ विधेयात्मक प्रयोग और מִן द्वारा व्यक्त तुलना हिन्दी में स्वाभाविक रूप से ‘से बढ़कर होगी’ से व्यक्त होती है।
- source_word: כְּבוֹד
  choice: महिमा
  rationale: मन्दिर के प्रसंग में यह शब्द सम्मान, वैभव और ईश्वरीय महिमा—इन सभी अर्थ-संकेतों को समेटता है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; यहाँ संदर्भ मन्दिर का है, पर ‘भवन’ मूल शब्दावली को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: הָאַחֲרוֹן ... הָרִאשׁוֹן
  choice: बाद की ... पहली
  rationale: यह जोड़ी बाद की और पहली महिमा के बीच तुलना व्यक्त करती है। इससे यह तय नहीं किया गया कि बात दो अलग मन्दिरों की है या उसी भवन की दो अवस्थाओं की।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: यְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में रखा गया है और צְבָאוֹת के बहुवचन तथा सामरिक भाव को ‘सेनाओं’ से स्पष्ट किया गया है।
- source_word: וּבַמָּקוֹם הַזֶּה
  choice: और इस स्थान में
  rationale: यह מָקוֹם और संकेतवाचक הַזֶּה का सीधा तथा स्वाभाविक हिन्दी रूप है।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: נָתַן का सामान्य और सीधा अर्थ ‘देना’ है; भविष्यकालीन प्रतिज्ञा को स्पष्ट रखा गया है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: ‘शांति’ इसका मुख्य और परिचित अर्थ है; कल्याण तथा पूर्णता की व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह पद एक गंभीर ईश्वरीय वचन-सूत्र है; ‘यह घोषणा है’ आधुनिक हिन्दी में उसकी भविष्यद्वक्तापूर्ण गंभीरता बनाए रखता है।
theological_decisions:
- issue: ‘इस भवन’ और उसकी ‘बाद की महिमा’ का अभिप्राय
  choice: मुख्य पाठ केवल बाद की महिमा के पहली महिमा से बढ़कर होने की प्रतिज्ञा कहता है।
  alternative: इसे विशेष रूप से दूसरे मन्दिर, उसी मन्दिर-स्थल की भावी अवस्था, अथवा मसीहाई-अन्तकालीन पूर्ति के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ तुलना तो करता है, पर उसके ऐतिहासिक या अन्तकालीन संदर्भ को स्वयं स्पष्ट नहीं करता; इसलिए अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
- issue: ईश्वरीय नाम का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में יְהוָה व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन्दिर’ के बजाय ‘भवन’ मूल בַּיִת की शब्द-छवि बचाता है, जबकि प्रसंग से मन्दिर स्पष्ट रहता है। दोनों वचन-सूत्रों—אָמַר और נְאֻם—का हल्का शैलीगत भेद क्रमशः ‘का कहना है’ और ‘यह घोषणा है’ से रखा गया है।
