  text: בְּ/עֶשְׂרִ֤ים וְ/אַרְבָּעָה֙ לַ/תְּשִׁיעִ֔י בִּ/שְׁנַ֥ת שְׁתַּ֖יִם לְ/דָרְיָ֑וֶשׁ הָיָה֙ דְּבַר יְהוָ֔ה אֶל חַגַּ֥י הַ/נָּבִ֖יא לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/002/010.yaml
  text: On the twenty-fourth day of the ninth month, in the second year of Darius, the word of Yahweh came to Haggai the prophet, saying,
translation:
  language: hi
  text: 'दारयवेश के शासन के दूसरे वर्ष के नौवें महीने के चौबीसवें दिन याहवे का वचन भविष्यद्वक्ता हाग्गै के पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּ/עֶשְׂרִים וְ/אַרְבָּעָה
  choice: चौबीसवें दिन
  rationale: इब्रानी तिथि-वाक्यांश का आधुनिक हिन्दी में स्वाभाविक क्रमसूचक रूप; स्पष्टता के लिए ‘दिन’ व्यक्त किया गया है।
- source_word: לַ/תְּשִׁיעִי
  choice: नौवें महीने के
  rationale: तिथि-सूत्र में क्रमसूचक संख्या महीने को सूचित करती है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘महीने’ जोड़ा गया है।
- source_word: בִּ/שְׁנַת שְׁתַּיִם לְ/דָרְיָוֶשׁ
  choice: दारयवेश के शासन के दूसरे वर्ष
  rationale: यह राजकीय वर्ष का सूत्र है। ‘शासन के’ हिन्दी में संबंध स्पष्ट करता है और मूल आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָיָה דְּבַר יְהוָה
  choice: यहोवा का वचन ... आया
  rationale: यह सामान्य भविष्यद्वक्ताई सूत्र है; היה का शाब्दिक ‘हुआ/था’ यहाँ हिन्दी में ‘आया’ द्वारा मुहावरेदार और सटीक रूप से व्यक्त होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले ईश्वरीय नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से दर्शाया गया है, न कि किसी उपाधि से।
- source_word: אֶל חַגַּי הַ/נָּבִיא
  choice: हाग्गै नबी के पास
  rationale: אֶל प्राप्तकर्ता को बताता है। आधुनिक हिन्दी में वचन आने के साथ ‘के पास’ स्वाभाविक है; הַנָּבִיא की पहचान ‘नबी’ के रूप में सुरक्षित है।
- source_word: לֵ/אמֹר
  choice: ':'
  rationale: यह रूप अगले पद में आने वाले सीधे कथन की भूमिका बाँधता है। हिन्दी में कोलन उसी कार्य को स्वाभाविक रूप से करता है और वाक्य को अगले कथन के लिए खुला रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तिथि को हिन्दी के स्वाभाविक क्रम में रखा गया है। ‘कहते हुए’ के कृत्रिम प्रयोग के स्थान पर कोलन अगले पद के सीधे कथन की भूमिका बाँधता है।
