source:
  edition: WLC
  text: בִּ/שְׁנַ֤ת שְׁתַּ֨יִם֙ לְ/דָרְיָ֣וֶשׁ הַ/מֶּ֔לֶךְ בַּ/חֹ֨דֶשׁ֙ הַ/שִּׁשִּׁ֔י בְּ/י֥וֹם אֶחָ֖ד לַ/חֹ֑דֶשׁ הָיָ֨ה דְבַר יְהוָ֜ה בְּ/יַד חַגַּ֣י הַ/נָּבִ֗יא אֶל זְרֻבָּבֶ֤ל בֶּן שְׁאַלְתִּיאֵל֙ פַּחַ֣ת יְהוּדָ֔ה וְ/אֶל יְהוֹשֻׁ֧עַ בֶּן יְהוֹצָדָ֛ק הַ/כֹּהֵ֥ן הַ/גָּד֖וֹל לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/001.yaml
  text: 'In the second year of King Darius[a], in the sixth month, on the first day of the month, the word of Yahweh came by the hand of Haggai the prophet to Zerubbabel son of Shealtiel, governor of Judah, and to Joshua son of Jehozadak, the high priest, saying:'
translation:
  language: hi
  text: 'राजा दारा के शासन के दूसरे वर्ष में, छठे महीने के पहले दिन, यहोवा का वचन हाग्गै नबी के द्वारा[a] यहूदा के राज्यपाल शालतीएल के पुत्र जरुब्बाबेल और महायाजक यहोसादाक के पुत्र यहोशू के पास आया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाग्गै नबी के हाथ से।”
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप और उसके माध्यम-सूचक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתַּיִם לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: राजा दारा के शासन के दूसरे वर्ष
  rationale: राजकीय तिथि-सूत्र को स्वाभाविक हिन्दी में स्पष्ट किया गया है; 'शासन के' अर्थ में निहित है और वर्ष को दारा के राज्यकाल से जोड़ता है।
- source_word: בַּחֹדֶשׁ הַשִּׁשִּׁי בְּיוֹם אֶחָד לַחֹדֶשׁ
  choice: छठे महीने के पहले दिन
  rationale: मूल पाठ महीने का नाम नहीं देता; संख्यात्मक उल्लेख बनाए रखा गया है। दिन के लिए प्रयुक्त 'एक' तिथियों में क्रमवाचक अर्थ रखता है।
- source_word: הָיָה דְבַר יְהוָה
  choice: यहोवा का वचन ... आया
  rationale: भविष्यद्वाणी के प्रचलित सूत्र को सहज हिन्दी में व्यक्त करता है और प्रकाशना के घटित होने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निज नाम को हिन्दी में प्रचलित प्रतिलेखन से प्रस्तुत किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיַד חַגַּי הַנָּבִיא
  choice: हाग्गै नबी के द्वारा
  rationale: शाब्दिक मुहावरा 'हाग्गै नबी के हाथ से' यहाँ माध्यम या अभिकरण बताता है; 'के द्वारा' आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: פַּחַת יְהוּדָה
  choice: यहूदा के राज्यपाल
  rationale: फ़ारसी काल के प्रांतीय प्रशासक के पद के लिए स्पष्ट और सामान्य हिन्दी समतुल्य।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: शाब्दिक 'प्रधान/बड़ा याजक' के लिए स्थापित और सहज हिन्दी पद।
- source_word: לֵאמֹר
  choice: ':'
  rationale: वचन के आगे आने वाली प्रत्यक्ष उक्ति का परिचय हिन्दी में विराम-चिह्न से स्वाभाविक रूप में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वर का निज नाम है; उसे 'प्रभु' जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी बाइबलीय प्रयोग में 'यहोवा' व्यापक रूप से पहचाना जाता है, जबकि 'याहवे' मूल उच्चारण का निकटतर वैकल्पिक प्रतिलेखन है।
- issue: בְּיַד में भविष्यद्वाणी का माध्यम
  choice: हाग्गै नबी के द्वारा
  alternative: हाग्गै नबी के हाथ से
  rationale: मूल का मुहावरा नबी को संदेश का माध्यम बताता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। नामों के रूप—दारा, हाग्गै, शालतीएल, जरुब्बाबेल, यहोसादाक और यहोशू—प्रचलित हिन्दी बाइबलीय वर्तनी के अनुसार हैं। मूल में न दिए गए महीने के नाम को नहीं जोड़ा गया।
