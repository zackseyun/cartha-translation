source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חַגַּ֞י מַלְאַ֧ךְ יְהוָ֛ה בְּ/מַלְאֲכ֥וּת יְהוָ֖ה לָ/עָ֣ם לֵ/אמֹ֑ר אֲנִ֥י אִתְּ/כֶ֖ם נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/013.yaml
  text: Then Haggai[a], the messenger of Yahweh, spoke to the people with Yahweh’s message, saying[b], “I am with you,” declares Yahweh.
translation:
  language: hi
  text: तब याहवे के संदेशवाहक हाग्गै[a] ने याहवे की ओर से[b] लोगों से कहा, “मैं तुम्हारे साथ हूँ,” याहवे की यह घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “संदेशवाहक” हाग्गै के याहवे द्वारा भेजे गए मानवीय प्रतिनिधि को सूचित करता है, किसी स्वर्गदूत को नहीं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी अभिव्यक्ति का अर्थ “याहवे की नियुक्ति के अनुसार” या “याहवे के संदेशवाहक के रूप में” भी हो सकता है। यह उस भूमिका, नियुक्ति या प्राधिकार को सूचित करती है जिसके साथ हाग्गै ने बात की।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... सुनाया
  rationale: यह सामान्यतः ‘कहा’ है, पर अगले संदेश और प्रत्यक्ष कथन के साथ ‘सुनाया’ आधुनिक हिन्दी में स्वाभाविक रूप से वाणी के कार्य को व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे के संदेशवाहक
  rationale: हाग्गै स्वयं यहाँ याहवे के मानवीय प्रतिनिधि के रूप में पहचाने गए हैं; इसलिए ‘स्वर्गदूत’ कहना संदर्भ में भ्रामक होगा।
- source_word: בְּמַלְאֲכוּת יְהוָה
  choice: याहवे का संदेश
  rationale: दुर्लभ संज्ञा संदेशवाहक के कार्य, नियुक्ति अथवा उसके द्वारा लाए गए संदेश का बोध करा सकती है। मुख्य पाठ में प्रसंगानुकूल और सहज ‘संदेश’ रखा गया है तथा अन्य संभावनाएँ टिप्पणी में दी गई हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसका लिप्यंतरण किया गया है।
- source_word: לָעָם
  choice: लोगों को
  rationale: यहाँ संबोधित समुदाय के लिए सरल और स्वाभाविक हिन्दी।
- source_word: לֵאמֹר
  choice: 'सुनाया:'
  rationale: इब्रानी उद्धरण-सूचक रचना को हिन्दी में द्विबिंदु और वाणी-सूचक क्रिया द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: אֲנִי אִתְּכֶם
  choice: मैं तुम्हारे साथ हूँ
  rationale: सरल प्रत्यक्ष कथन रखा गया है; ‘तुम्हारे’ से इब्रानी बहुवचन संदर्भ में स्पष्ट है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: यह नबी-संबंधी अधिकारपूर्ण सूत्र का स्पष्ट, गरिमापूर्ण और समकालीन हिन्दी रूप है।
theological_decisions:
- issue: हाग्गै के लिए מַלְאַךְ का अर्थ
  choice: मानवीय ‘संदेशवाहक’
  alternative: ‘याहवे का स्वर्गदूत’
  rationale: व्याकरण और संदर्भ में हाग्गै का नाम इसी पद के साथ रखा गया है, इसलिए यह उनके नबी और प्रतिनिधि होने की भूमिका बताता है, किसी अलग स्वर्गीय प्राणी की पहचान नहीं।
- issue: याहवे के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना हिन्दी में लिप्यंतरित किया गया है।
- issue: בְּמַלְאֲכוּת יְהוָה की अर्थ-सीमा
  choice: याहवे का संदेश
  alternative: याहवे की नियुक्ति के अनुसार; याहवे के संदेशवाहक के रूप में
  rationale: मूल अभिव्यक्ति संदेश, दायित्व अथवा प्रतिनिधि-भूमिका की ओर संकेत कर सकती है। मुख्य पाठ स्पष्ट और स्वाभाविक अर्थ देता है, जबकि टिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘संदेशवाहक’ मानवीय नबी की भूमिका स्पष्ट करता है; ‘याहवे’ मूल व्यक्तिगत नाम को सुरक्षित रखता है। इब्रानी उद्धरण-सूचक पुनरुक्ति को हिन्दी की स्वाभाविक वाक्य-रचना में समाहित किया गया है।
