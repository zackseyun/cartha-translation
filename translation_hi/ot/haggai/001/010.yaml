  text: Therefore the heavens above you have withheld the dew[a], and the earth has withheld its produce.
translation:
  language: hi
  text: इसलिए तुम्हारे ऊपर के आकाश ने ओस को रोक रखा है, और धरती ने अपनी उपज को रोक रखा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि ने अपनी पैदावार को रोक रखा है।” इब्रानी אֶרֶץ का अर्थ “धरती” या “भूमि,” और יְבוּל का अर्थ “उपज” या “पैदावार” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले उलाहने और उसके परिणाम के बीच कारणात्मक संबंध जोड़ता है; ‘इसलिए’ सहज और स्पष्ट है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे ऊपर
  rationale: ‘आकाश’ के साथ स्थानवाचक अर्थ स्वाभाविक है और इब्रानी पूर्वसर्ग को सीधे व्यक्त करता है।
- source_word: כָּלְאוּ / כָּלְאָה
  choice: रोक रखी है
  rationale: כלא यहाँ किसी चीज़ को रोक लेने या न देने का भाव रखता है। दोनों खंडों में एक ही अभिव्यक्ति काव्यात्मक समानता बनाए रखती है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इब्रानी बहुवचन यहाँ ऊपर के आकाश को दर्शाता है; आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מִטָּל
  choice: ओस
  rationale: כלא के बाद מן उस वस्तु को बताता है जिसे रोका गया है; हिन्दी में इसे सहज रूप से ‘ओस रोक रखी है’ कहा जाता है।
- source_word: וְהָאָרֶץ
  choice: और धरती
  rationale: אֶרֶץ के लिए ‘धरती’ आकाश के समानांतर काव्यात्मक प्रतिरूप को बनाए रखती है, जबकि ‘भूमि’ भी प्रसंगानुसार संभव है।
- source_word: יְבוּלָהּ
  choice: अपनी उपज
  rationale: יְבוּל कृषि से मिलने वाली उपज या पैदावार को दर्शाता है; ‘उपज’ संक्षिप्त, व्यापक और सामान्य हिन्दी है।
