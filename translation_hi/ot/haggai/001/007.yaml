source:
  edition: WLC
  text: כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/007.yaml
  text: 'Thus says Yahweh of hosts: Consider your ways.'
translation:
  language: hi
  text: 'सेनाओं का याहवे यों कहता है: “अपने चालचलन पर ध्यान दो[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “अपने मार्गों पर अपने हृदय को लगाओ।”
    reason: इब्रानी मुहावरे में ‘हृदय’ और ‘मार्ग’ दोनों के रूपक स्पष्ट हैं; मुख्य पाठ स्वाभाविक हिन्दी में उसका आशय देता है।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह इब्रानी भविष्यद्वक्ताओं का प्रचलित संदेश-सूत्र है। हिन्दी में यह रूप वर्तमानकालीन, गरिमापूर्ण और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह शब्द सांसारिक या स्वर्गीय सेनाओं को सूचित कर सकता है; यह अनुवाद उस व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שִׂימוּ לְבַבְכֶם עַל
  choice: ध्यान दो
  rationale: शाब्दिक अर्थ ‘अपना हृदय लगाओ’ है, पर पूरा इब्रानी पदबंध किसी बात को गंभीरता से देखने-समझने का मुहावरा है। ‘ध्यान दो’ उसका स्वाभाविक हिन्दी रूप है; शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: דַּרְכֵיכֶם
  choice: अपने चालचलन पर
  rationale: ‘मार्गों’ का रूपक यहाँ लोगों के जीवन-क्रम और आचरण को दर्शाता है। ‘चालचलन’ इस प्रसंग में उसका अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ विशिष्ट चतुरक्षरीय ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘यहोवा’ भिन्न परंपरागत उच्चारण को अपनाता।
- issue: יְהוָה צְבָאוֹת में צְבָאוֹת का आशय
  choice: सेनाओं का
  alternative: स्वर्गीय सेनाओं का; सर्वशक्तिमान
  rationale: मूल पदवी की सैनिक और व्यापक अर्थ-संभावना को सुरक्षित रखा गया है; केवल स्वर्गीय सेना कहना अर्थ को सीमित करता, और ‘सर्वशक्तिमान’ व्याख्यात्मक उपाधि होती।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और भविष्यद्वक्ताई गरिमा वाली रखी गई है। उद्धरण-चिह्न प्रत्यक्ष दिव्य वचन को स्पष्ट करते हैं। ‘चालचलन’ सामान्य पाठक के लिए नैतिक जीवन-क्रम का अर्थ खोलता है, जबकि पादटिप्पणी मूल रूपक सुरक्षित रखती है।
