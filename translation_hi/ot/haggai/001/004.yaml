source:
  edition: WLC
  text: הַ/עֵ֤ת לָ/כֶם֙ אַתֶּ֔ם לָ/שֶׁ֖בֶת בְּ/בָתֵּי/כֶ֣ם סְפוּנִ֑ים וְ/הַ/בַּ֥יִת הַ/זֶּ֖ה חָרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/004.yaml
  text: Is it a time for you yourselves to live in your paneled houses while this house lies in ruins?[a]
translation:
  language: hi
  text: क्या तुम्हारे लिए यह समय है कि तुम अपने ही पैनलिंग वाले घरों[a] में रहो, जबकि यह भवन उजाड़ पड़ा है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छत-पटी लगे हुए घरों”; अर्थात ऐसे घर जो पैनलिंग या अस्तर से ढके हुए थे, सम्भवतः लकड़ी की पट्टियों से।
    reason: सְפוּנִים के ‘ढके/अस्तर या पैनल लगे’ अर्थ को सुरक्षित रखता है और लकड़ी को सम्भावित, न कि मुख्य पाठ में निश्चित, बताता है।
lexical_decisions:
- source_word: הַעֵת
  choice: क्या यह समय ... का है
  rationale: प्रश्नवाचक रूप और עֵת के ‘समय’ अर्थ को बनाए रखता है तथा पद 2 में लोगों के समय-संबंधी दावे की ओर संकेत करता है।
- source_word: לָכֶם אַתֶּם
  choice: तुम लोगों के लिए अपने ही
  rationale: स्वतंत्र सर्वनाम אַתֶּם से आने वाले बल को ‘ही’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לָשֶׁבֶת
  choice: रहने
  rationale: घर के संदर्भ में ישׁב का अर्थ ‘निवास करना/रहना’ है; ‘रहने’ आधुनिक हिन्दी में सहज है।
- source_word: בְּבָתֵּיכֶם
  choice: घरों में
  rationale: ठोस घरेलू चित्र को बनाए रखता है और आगे परमेश्वर के भवन से विरोध प्रकट करता है।
- source_word: סְפוּנִים
  choice: लकड़ी से मढ़े हुए
  rationale: निष्क्रिय कृदंत का आशय ढका या अस्तर चढ़ा हुआ, विशेषतः लकड़ी से पटा हुआ, है। यह अनुवाद आराम और सजावट के भाव को स्पष्ट रखते हुए मूल चित्र को बनाए रखता है।
- source_word: וְהַבַּיִת הַזֶּה
  choice: जबकि यह भवन
  rationale: וְ यहाँ केवल जोड़ नहीं, बल्कि लोगों के घरों और इस भवन की दशा के बीच तीखा विरोध दिखाता है। ‘भवन’ प्रसंग में मन्दिर के लिए स्वाभाविक है, पर मुख्य पाठ में ‘मन्दिर’ जोड़कर संदर्भ को अत्यधिक स्पष्ट नहीं करता।
- source_word: חָרֵב
  choice: उजाड़ पड़ा है
  rationale: विशेषण भवन की नष्ट और उपेक्षित अवस्था बताता है; ‘पड़ा है’ उस जारी दशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘यह भवन’ का संदर्भ
  choice: यहोवा का मन्दिर, पर मुख्य पाठ में ‘यह भवन’
  alternative: मुख्य पाठ में सीधे ‘यह मन्दिर’
  rationale: हाग्गै 1:2, 8-9 से संदर्भ स्पष्टतः मन्दिर है। फिर भी मूल के ‘यह घर/भवन’ को बनाए रखने से पाठ स्वयं अपनी पहचान प्रसंग के द्वारा कराता है और अनावश्यक व्याख्यात्मक जोड़ से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रश्न की धिक्कारपूर्ण तीव्रता ‘अपने ही’ और ‘जबकि’ से उभरती है।
