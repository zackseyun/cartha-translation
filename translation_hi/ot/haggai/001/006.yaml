  text: זְרַעְתֶּ֨ם הַרְבֵּ֜ה וְ/הָבֵ֣א מְעָ֗ט אָכ֤וֹל וְ/אֵין לְ/שָׂבְעָה֙ שָׁת֣וֹ וְ/אֵין לְ/שָׁכְרָ֔ה לָב֖וֹשׁ וְ/אֵין לְ/חֹ֣ם ל֑/וֹ וְ/הַ֨/מִּשְׂתַּכֵּ֔ר מִשְׂתַּכֵּ֖ר אֶל צְר֥וֹר נָקֽוּב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/006.yaml
  text: You have sown much[a], but brought in little. You eat, but there is not enough to be satisfied; you drink, but there is not enough to be filled; you clothe yourselves, but no one is warm[c][b]; and the one who earns wages earns them for a bag with holes.
translation:
  language: hi
  text: तुमने बहुत बोया, पर थोड़ा ही बटोर लाए[a]। तुम खाते हो, पर तृप्त नहीं होते; पीते हो, पर मतवाले नहीं होते[b]; कपड़े पहनते हो, पर किसी को गरमी नहीं मिलती[c]; और मजदूरी करनेवाला अपनी मजदूरी छेदों वाली थैली में डालने के लिए कमाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पर थोड़ी ही फसल काटी।” इब्रानी में शाब्दिक रूप से “थोड़ा ही भीतर लाए” है, जो कम कृषि-उपज का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ विशेष रूप से नशे में या मतवाला होना है; केवल प्यास बुझना अथवा भर जाना नहीं।
    reason: lexical_clarification
  - marker: c
    text: शाब्दिक रूप से “पर उसके लिए गरमी नहीं है।” एकवचन सर्वनाम यहाँ सामान्य अर्थ में प्रयुक्त है।
    reason: grammatical_clarification
lexical_decisions:
- source_word: זְרַעְתֶּם הַרְבֵּה
  choice: तुमने बहुत बोया
  rationale: द्वितीय पुरुष बहुवचन पूर्ण क्रिया लोगों को सीधे संबोधित करती है; हिंदी का सामान्य भूतकाल पूर्ण कार्य और उसके वर्तमान परिणाम के संदर्भ में स्वाभाविक है।
- source_word: וְהָבֵא מְעָט
  choice: पर थोड़ा ही घर लाए
  rationale: मूल का शाब्दिक भाव ‘थोड़ा भीतर/घर लाना’ है और कृषि-संदर्भ में अल्प उपज समेटने का मुहावरा है; यह अनुवाद उस चित्र को बनाए रखता है।
- source_word: אָכוֹל וְאֵין לְשָׂבְעָה
  choice: तुम खाते हो, पर तृप्त नहीं होते
  rationale: यह संक्षिप्त इब्रानी रचना लगातार खाने के बावजूद तृप्ति न मिलने को व्यक्त करती है।
- source_word: שָׁתוֹ וְאֵין לְשָׁכְרָה
  choice: पीते हो, पर मतवाले नहीं होते
  rationale: שכר का विशिष्ट अर्थ नशे या मतवाले होने से जुड़ा है, केवल प्यास बुझने या भर जाने से नहीं; अतः मूल की तीव्रता सुरक्षित रखी गई है।
- source_word: לָבוֹשׁ וְאֵין לְחֹם לוֹ
  choice: कपड़े पहनते हो, पर किसी को गरमी नहीं मिलती
  rationale: इब्रानी एकवचन सर्वनाम यहाँ सामान्य व्यक्ति के अर्थ में है; ‘किसी को’ हिंदी में उस सामान्य भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַמִּשְׂתַּכֵּר מִשְׂתַּכֵּר
  choice: और जो मजदूरी कमाता है, वह अपनी मजदूरी
  rationale: मूल में धातु की पुनरावृत्ति कमाने वाले और कमाई दोनों पर बल देती है; हिंदी में ‘मजदूरी’ दोहराकर यह बल आंशिक रूप से सुरक्षित रहता है।
- source_word: אֶל צְרוֹר נָקוּב
  choice: छेदों वाली थैली में
  rationale: यह ऐसी धन-थैली का सजीव रूपक है जिसमें रखी मजदूरी टिकती नहीं; बहुवचन ‘छेदों वाली’ हिंदी में निरंतर हानि का चित्र स्पष्ट करता है।
