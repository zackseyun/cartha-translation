source:
  edition: WLC
  text: וְ/עַתָּ֕ה כֹּ֥ה אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת שִׂ֥ימוּ לְבַבְ/כֶ֖ם עַל דַּרְכֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/005.yaml
  text: 'Now therefore[a], thus says Yahweh of hosts: Set your heart on your ways.'
translation:
  language: hi
  text: 'अब इसलिए सेनाओं का याहवे यों कहता है: “अपने मार्गों पर ध्यान दो।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हृदय को अपने मार्गों पर लगाओ।”
    reason: मूल इब्रानी के ‘हृदय’ और ‘मार्गों’ वाले बिंब को स्पष्ट रूप से सुरक्षित रखना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण मिलकर पिछले उलाहने से निकलने वाला निष्कर्ष और वर्तमान आह्वान, दोनों व्यक्त करते हैं।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रचलित संदेशवाहक-सूत्र है; वर्तमान काल परमेश्वर की प्रामाणिक घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह पदवी याहवे को स्वर्गीय और पार्थिव शक्तियों के अधिपति के रूप में प्रस्तुत करती है; ‘सेनाओं का’ किसी एक क्षेत्र को अनावश्यक रूप से सीमित नहीं करता।
- source_word: שִׂימוּ לְבַבְכֶם
  choice: ध्यान दो
  rationale: शाब्दिक अर्थ ‘अपना हृदय लगाओ’ है, पर इस मुहावरे का आशय गंभीरता से विचार करना और आत्मपरीक्षण करना है। स्वाभाविक हिन्दी के लिए ‘ध्यान दो’ चुना गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: עַל דַּרְכֵיכֶם
  choice: अपने चालचलन पर
  rationale: ‘मार्ग’ यहाँ जीवन की रीति या आचरण का रूपक है। ‘चालचलन’ आधुनिक हिन्दी में अभिप्रेत नैतिक और व्यावहारिक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘मार्गों’ के रूपक का अर्थ
  choice: चालचलन
  alternative: मार्गों
  rationale: संदर्भ में बहुवचन דְּרָכִים लोगों की जीवन-पद्धति और कर्मों की ओर संकेत करता है। ‘चालचलन’ उस आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यों कहता है’ भविष्यद्वक्ताओं की घोषणा का औपचारिक स्वर बनाए रखता है, जबकि ‘अपने चालचलन पर ध्यान दो’ सामान्य पाठक के लिए इब्रानी मुहावरे का अर्थ स्पष्ट करता है।
