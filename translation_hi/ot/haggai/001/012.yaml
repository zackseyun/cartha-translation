  text: וַ/יִּשְׁמַ֣ע זְרֻבָּבֶ֣ל בֶּֽן שַׁלְתִּיאֵ֡ל וִ/יהוֹשֻׁ֣עַ בֶּן יְהוֹצָדָק֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/כֹ֣ל שְׁאֵרִ֣ית הָ/עָ֗ם בְּ/קוֹל֙ יְהוָ֣ה אֱלֹֽהֵי/הֶ֔ם וְ/עַל דִּבְרֵי֙ חַגַּ֣י הַ/נָּבִ֔יא כַּ/אֲשֶׁ֥ר שְׁלָח֖/וֹ יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יִּֽירְא֥וּ הָ/עָ֖ם מִ/פְּנֵ֥י יְהוָֽה׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/012.yaml
  text: Then Zerubbabel son of Shealtiel[a], and Joshua son of Jehozadak, the high priest, and all the remnant of the people, listened to the voice of Yahweh their God and to the words of Haggai the prophet, as Yahweh their God had sent him[d][c][b]; and the people feared before Yahweh.
translation:
  language: hi
  text: तब शालतीएल के पुत्र जरुब्बाबेल, यहोसादाक के पुत्र महायाजक यहोशू, और शेष प्रजा ने अपने परमेश्वर याहवे की वाणी और हाग्गै नबी की बातें ध्यान से सुनीं[a], जैसा कि उनके परमेश्वर याहवे ने उसे भेजा था[c]; और प्रजा याहवे के सामने भयभीत हुई[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुनीं” अथवा “आज्ञा मानी”; इब्रानी क्रिया में ऐसी सुनवाई का भाव हो सकता है जिसमें व्यक्ति ध्यान देकर उसके अनुसार चलता है।
    reason: lexical_alternative
  - marker: c
    text: या “क्योंकि उनके परमेश्वर याहवे ने उसे भेजा था।”
    reason: alternative_reading
  - marker: d
    text: या “प्रजा याहवे के सामने श्रद्धामय विस्मय से भर गई”; इब्रानी शब्द भय और श्रद्धापूर्ण विस्मय, दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ध्यान से सुनीं
  rationale: שׁמע यहाँ केवल ध्वनि सुनने से बढ़कर ग्रहणशीलता और उत्तरदायी ध्यान का संकेत देता है। ‘आज्ञा मानी’ कहना आगे की क्रिया को समय से पहले क्रिया में ही समाहित कर देता।
- source_word: שְׁאֵרִית הָעָם
  choice: प्रजा के सभी बचे हुए लोग
  rationale: यह स्वाभाविक आधुनिक हिन्दी में जीवित अथवा लौटे हुए शेष समुदाय का अर्थ बनाए रखता है; केवल ‘बाकी लोग’ कहने से भविष्यद्वक्ताओं में निहित ‘शेष समुदाय’ की प्रतिध्वनि कम हो सकती है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह प्रधान याजक के पद के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיהֶם
  choice: अपने परमेश्वर याहवे की वाणी
  rationale: ‘वाणी सुनना’ हिन्दी में स्वाभाविक है और קוֹל के साथ שמע की संरचना को बनाए रखता है। יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: דִּבְרֵי חַגַּי הַנָּבִיא
  choice: हाग्गै नबी की बातें
  rationale: דְּבָרִים का बहुवचन सुरक्षित रहता है और यह ‘याहवे की वाणी’ के समानांतर स्वाभाविक हिन्दी देता है।
- source_word: כַּאֲשֶׁר שְׁלָחוֹ יְהוָה אֱלֹהֵיהֶם
  choice: जैसा कि उनके परमेश्वर याहवे ने उसे भेजा था
  rationale: यह כַּאֲשֶׁר के अनुरूप संबंध को खुला रखता है और मुख्य पाठ में उसे अनिवार्य रूप से कारणसूचक नहीं बनाता।
- source_word: וַיִּירְאוּ הָעָם מִפְּנֵי יְהוָה
  choice: प्रजा याहवे के सामने भय मानने लगी
  rationale: यह ירא में निहित भय और श्रद्धामय विस्मय दोनों की संभावना बनाए रखता है तथा מִפְּנֵי के सामने होने के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: שְׁאֵרִית का भविष्यद्वाणी-संबंधी अर्थ
  choice: प्रजा के सभी बचे हुए लोग
  alternative: प्रजा के बाकी सभी लोग
  rationale: चुना हुआ पाठ ऐतिहासिक रूप से बचे हुए वाचा-समुदाय की प्रतिध्वनि को सुरक्षित रखता है, पर किसी विशिष्ट धार्मिक व्याख्या को नहीं जोड़ता।
- issue: וַיִּשְׁמַע में सुनने और आज्ञापालन का संबंध
  choice: ध्यान से सुनीं
  alternative: आज्ञा मानी
  rationale: संदर्भ उत्तरदायी सुनने का संकेत देता है, लेकिन क्रिया को सीधे ‘आज्ञा मानी’ कहना उसकी वास्तविक अर्थ-सीमा को संकरा कर देगा।
- issue: כַּאֲשֶׁר का संबंधसूचक अथवा कारणसूचक बल
  choice: जैसा कि
  alternative: क्योंकि
  rationale: मुख्य पाठ हाग्गै के भेजे जाने और उसकी बात सुनने के बीच संबंध को रखता है, जबकि कारणसूचक संभावना पादटिप्पणी में दी गई है।
- issue: יָרֵא में भय और श्रद्धा
  choice: भय मानने लगी
  alternative: श्रद्धा से विस्मित हुई
  rationale: ‘भय मानना’ भय, आदर और श्रद्धामय विस्मय के तनाव को एक ही दिशा में सीमित किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। वाक्य की मूल समन्वयी संरचना और ‘याहवे की वाणी/हाग्गै की बातें’ का समानांतर संबंध बनाए रखा गया है। व्यक्तिगत नामों को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
