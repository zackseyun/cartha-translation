base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/002.yaml
  text: 'Thus says Yahweh of hosts: These people say[a], “The time has not come[b], the time for the house of Yahweh to be rebuilt.”'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: “ये लोग कहते हैं[a], ‘अभी वह समय नहीं आया है—यहोवा के भवन के फिर से बनाए जाने का समय[b]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “यह प्रजा कहती है।” इब्रानी अभिव्यक्ति में दूरी या फटकार का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बनाए जाने का समय।” इब्रानी क्रिया में अपने आप ‘फिर से’ का अर्थ स्पष्ट नहीं है, पर निर्वासन-पश्चात संदर्भ पुनर्निर्माण की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी के संदेशवाहक-सूत्र को स्वाभाविक किंतु गरिमापूर्ण हिन्दी में व्यक्त करता है; पूर्ण क्रिया यहाँ वर्तमान घोषणात्मक अर्थ रखती है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת की व्यापक सैन्य/स्वर्गीय धारणा को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: הָעָם הַזֶּה
  choice: ये लोग
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और संकेतवाचक पद में निहित दूरी अथवा फटकार के संभावित भाव को बनाए रखता है।
- source_word: לֹא עֶת בֹּא עֶת
  choice: अभी वह समय नहीं आया है—… समय
  rationale: ‘समय’ की इब्रानी पुनरावृत्ति को बनाए रखा गया है। ‘अभी’ कथन के आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल की टालने वाली मुद्रा बनी रहती है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक के निकट रहते हुए धार्मिक संदर्भ में स्वाभाविक है और सीधे ‘मन्दिर’ कहकर अर्थ को अधिक सीमित नहीं करता।
- source_word: לְהִבָּנוֹת
  choice: फिर से बनाए जाने
  rationale: निफ़अल infinitive का कर्मवाच्य अर्थ सुरक्षित है। ‘फिर से’ निर्वासन-पश्चात पुनर्निर्माण का संदर्भ स्पष्ट करता है, यद्यपि यह उपसर्ग मूल क्रिया में प्रत्यक्ष नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी के परिचित लिप्यंतरण ‘यहोवा’ से नाम को उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
- issue: הָעָם הַזֶּה में दूरी या फटकार का भाव
  choice: ये लोग
  alternative: यह प्रजा
  rationale: ‘ये लोग’ सम्भावित अस्वीकृतिपूर्ण दूरी को स्वाभाविक हिन्दी में संप्रेषित करता है, पर उस भाव को अत्यधिक तीखा नहीं बनाता।
- issue: לְהִבָּנוֹת की ऐतिहासिक विशिष्टता
  choice: फिर से बनाए जाने
  alternative: बनाए जाने
  rationale: निर्वासन-पश्चात संदर्भ पुनर्निर्माण का संकेत देता है; फिर भी मूल क्रिया में ‘फिर’ स्पष्ट न होने के कारण विकल्प को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, भविष्यद्वाणी के अनुरूप गरिमापूर्ण शैली। दोहरे उद्धरण के भीतर लोगों का कथन एकहरे उद्धरण में है। मूल की ‘समय’ वाली पुनरावृत्ति और कथन की टालमटोल भरी धार को सुरक्षित रखा गया है।
