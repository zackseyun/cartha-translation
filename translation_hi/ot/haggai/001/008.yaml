  text: עֲל֥וּ הָ/הָ֛ר וַ/הֲבֵאתֶ֥ם עֵ֖ץ וּ/בְנ֣וּ הַ/בָּ֑יִת וְ/אֶרְצֶה בּ֥/וֹ ו/אכבד אָמַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/008.yaml
  text: Go up into the hills[a], bring wood, and build the house, so that I may take pleasure in it and be glorified[c][b], says Yahweh.
translation:
  language: hi
  text: पहाड़ पर चढ़ो[a], लकड़ी लाओ और उस भवन को बनाओ[b], ताकि मैं उससे प्रसन्न होऊँ और महिमान्वित होऊँ[c]—याहवे कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहाड़ियों में’ अथवा ‘पहाड़ी प्रदेश में।’ इब्रानी הָהָר का अर्थ पहाड़, पहाड़ी या पहाड़ी प्रदेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात मन्दिर; इब्रानी में ‘घर/भवन।’
    reason: lexical_alternative
  - marker: c
    text: या ‘आदर पाऊँ।’ इब्रानी क्रिया का अर्थ ‘महिमान्वित होना’ या ‘आदर पाना’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֲלוּ
  choice: चढ़ जाओ
  rationale: यह עלה का बहुवचन आज्ञार्थक रूप है। ‘चढ़ जाओ’ ऊपर की ओर जाने की आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश में
  rationale: הַר का अर्थ पहाड़, पहाड़ी या पहाड़ी इलाका हो सकता है। लकड़ी लाने के प्रसंग में ‘पहाड़ी प्रदेश’ सम्भावित सामूहिक भौगोलिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וַהֲבֵאתֶם עֵץ
  choice: लकड़ी लाओ
  rationale: עֵץ यहाँ पदार्थवाचक संज्ञा है और निर्माण के लिए लाई जाने वाली लकड़ी को दर्शाता है। ‘लकड़ी’ साधारण पाठक के लिए स्पष्ट और व्यापक शब्द है।
- source_word: וּבְנוּ
  choice: और ... बनाओ
  rationale: בנה का रूप बहुवचन आज्ञार्थक है और सीधे ‘बनाओ’ कहता है। ‘फिर से बनाओ’ प्रसंगतः सम्भव है, पर मूल क्रिया में पुनर्निर्माण स्पष्ट रूप से व्यक्त नहीं है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है; इस प्रसंग में उसका संकेत मन्दिर की ओर है। ‘भवन’ स्रोत की अभिव्यक्ति को बनाए रखते हुए धार्मिक इमारत के लिए हिन्दी में गरिमापूर्ण और स्वाभाविक है।
- source_word: וְאֶרְצֶה בוֹ
  choice: ताकि मैं उससे प्रसन्न होऊँ
  rationale: רצה प्रसन्न होने, आनन्द लेने या अनुकूलतापूर्वक स्वीकार करने का अर्थ दे सकता है। आदेशों के बाद आने वाली दैवी प्रतिक्रिया के कारण וְ को यहाँ प्रयोजनसूचक ‘ताकि’ से व्यक्त किया गया है। בוֹ के प्रत्यय का सम्बन्ध भवन से है।
- source_word: וְאֶכָּבֵד
  choice: और महिमा पाऊँ
  rationale: כבד का निफ़अल रूप यहाँ ‘महिमान्वित होना’ या ‘आदर पाना’ व्यक्त कर सकता है। ‘महिमा पाऊँ’ निष्क्रिय भाव और मन्दिर-सन्दर्भ का धार्मिक भार बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यंजन יהוה परमेश्वर के व्यक्तिगत वाचा-नाम को दर्शाते हैं। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यन्तरण में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार-अक्षरी व्यक्तिगत नाम है। ‘याहवे’ स्रोत के नाम को प्रत्यक्ष रूप से बनाए रखता है।
- issue: मन्दिर-सन्दर्भ में הַבַּיִת
  choice: भवन
  alternative: मन्दिर
  rationale: सन्दर्भ से यह याहवे के मन्दिर को दर्शाता है, पर इब्रानी शब्द स्वयं ‘घर/भवन’ है। मुख्य पाठ में स्रोत की संज्ञा को रखा गया है और पादटिप्पणी में अभिप्रेत वस्तु स्पष्ट की गई है।
- issue: וְאֶכָּבֵד में दैवी महिमा या आदर
  choice: महिमा पाऊँ
  alternative: आदर पाऊँ
  rationale: क्रिया दोनों अर्थ ग्रहण कर सकती है। मन्दिर के प्रसंग में ‘महिमा पाऊँ’ उपयुक्त है, पर ‘आदर पाऊँ’ को पादटिप्पणी में देकर वास्तविक अर्थगत विस्तार सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। बहुवचन आज्ञाओं के लिए बोलचाल में स्वाभाविक ‘जाओ/लाओ/बनाओ’ प्रयुक्त हैं। ‘भवन’ स्रोत के ‘घर’ रूपक और मन्दिर-सन्दर्भ के बीच संतुलन रखता है। दैवी नाम को ‘याहवे’ लिखा गया है।
