translation:
  language: hi
  text: छठे महीने के चौबीसवें दिन, राजा दारा के शासन के दूसरे वर्ष में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: चौबीसवें दिन
  rationale: इब्रानी तिथि-सूत्र में בְּיוֹם काल-सूचक है और संख्या मूल रूप में गणनावाचक होते हुए भी तिथि में क्रमवाचक अर्थ देती है; आधुनिक हिन्दी में ‘चौबीसवें दिन’ स्वाभाविक है।
- source_word: לַחֹדֶשׁ בַּשִּׁשִּׁי
  choice: छठे महीने के
  rationale: यह महीने की क्रम-संख्या बताने वाला तिथि-सूत्र है; हिन्दी में ‘छठे महीने के चौबीसवें दिन’ सहज और अर्थनिष्ठ है।
- source_word: בִּשְׁנַת שְׁתַּיִם
  choice: राज्य के दूसरे वर्ष में
  rationale: यह राजकीय वर्ष-गणना का सूत्र है। केवल ‘दूसरे वर्ष में’ भी संभव है, पर हिन्दी में राजा के शासन से संबंध स्पष्ट करने के लिए ‘राज्य के’ स्वाभाविक रूप से निहित अर्थ व्यक्त करता है।
- source_word: לְדָרְיָוֶשׁ הַמֶּלֶךְ
  choice: राजा दारा
  rationale: इब्रानी का शब्दक्रम ‘दारा, राजा’ है; आधुनिक हिन्दी में उपाधि नाम से पहले रखना स्वाभाविक है। דָרְיָוֶשׁ का प्रचलित हिन्दी बाइबलीय रूप ‘दारा’ चुना गया है।
