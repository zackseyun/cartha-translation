  text: פָּנֹ֤ה אֶל הַרְבֵּה֙ וְ/הִנֵּ֣ה לִ/מְעָ֔ט וַ/הֲבֵאתֶ֥ם הַ/בַּ֖יִת וְ/נָפַ֣חְתִּי ב֑/וֹ יַ֣עַן מֶ֗ה נְאֻם֙ יְהוָ֣ה צְבָא֔וֹת יַ֗עַן בֵּיתִ/י֙ אֲשֶׁר ה֣וּא חָרֵ֔ב וְ/אַתֶּ֥ם רָצִ֖ים אִ֥ישׁ לְ/בֵיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/009.yaml
  text: You looked for much[a], but behold, it was little; and when you brought it home, I blew it away. Why? declares Yahweh of Armies. Because of my house, which lies in ruins[b], while each of you runs to his own house.
translation:
  language: hi
  text: तुमने बहुत की आशा की, पर देखो, थोड़ा ही मिला। जब तुम उसे घर ले आए, तो मैंने उस पर फूँक मारी[a]। ऐसा क्यों हुआ? सेनाओं के याहवे की घोषणा है। इसलिए कि मेरा घर उजाड़ पड़ा है, जबकि तुममें से हर एक अपने घर की ओर दौड़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने उसे फूँक मारकर उड़ा दिया।” इब्रानी क्रिया का शाब्दिक अर्थ “फूँकना” है; प्रसंग में इससे उपज के तितर-बितर या घटा दिए जाने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנֹה אֶל הַרְבֵּה
  choice: तुमने बहुत की आशा की
  rationale: इस प्रसंग में मुहावरे का अर्थ भरपूर उपज मिलने की आशा करना है; यह अनुवाद मूल के ‘बहुत’ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְהִנֵּה לִמְעָט
  choice: पर देखो, थोड़ा ही मिला
  rationale: הִנֵּה ध्यान खींचता है और לִמְעָט निराशाजनक अल्प परिणाम बताता है। ‘देखो’ उसकी जीवंतता बनाए रखता है।
- source_word: וַהֲבֵאתֶם הַבַּיִת
  choice: जब तुम उसे घर ले आए
  rationale: यहाँ הַבַּיִת लोगों के अपने घर को सूचित करता है; बाद में ‘मेरा भवन’ और ‘अपने घर’ का स्पष्ट विरोध आता है।
- source_word: וְנָפַחְתִּי בוֹ
  choice: मैंने उस पर फूँक मारी
  rationale: नפח का मूल अर्थ ‘फूँकना’ है। यह रूप परिणाम को अनावश्यक रूप से निश्चित किए बिना परमेश्वर के न्याय से उपज के घट जाने या उड़ जाने की छवि बनाए रखता है।
- source_word: יַעַן מֶה
  choice: ऐसा क्यों हुआ?
  rationale: यह न्याय का कारण पूछने वाला आलंकारिक प्रश्न है; हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी की आधिकारिक घोषणा के रूप में और צְבָאוֹת को उसके सैन्य बहुवचन अर्थ के साथ अनूदित किया गया है।
- source_word: יַעַן בֵּיתִי אֲשֶׁר הוּא חָרֵב
  choice: इसलिए कि मेरा भवन उजाड़ पड़ा है
  rationale: חָרֵב उजाड़ या ध्वस्त दशा बताता है। ‘भवन’ से यहाँ याहवे के मंदिर और आगे आने वाले निजी ‘घर’ के बीच भेद सुगम होता है।
- source_word: וְאַתֶּם רָצִים אִישׁ לְבֵיתוֹ
  choice: जबकि तुममें से हर एक अपने घर की ओर दौड़ता है
  rationale: רָצִים की ‘दौड़ने’ वाली तीव्रता और אִישׁ לְבֵיתוֹ का वितरणात्मक अर्थ—हर व्यक्ति अपने घर की ओर—दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रत्यक्ष रूप से प्रस्तुत करता है।
- issue: צְבָאוֹת का अनुवाद
  choice: सेनाओं के
  alternative: गणों के
  rationale: ‘सेनाएँ’ शीर्षक की सामरिक शक्ति और बहुवचन अर्थ को आधुनिक हिन्दी में अधिक पारदर्शी ढंग से व्यक्त करता है।
- issue: אִישׁ לְבֵיתוֹ में वितरणात्मक और लैंगिक अर्थ
  choice: तुममें से हर एक अपने घर की ओर
  alternative: हर पुरुष अपने घर की ओर
  rationale: ‘हर एक’ मूल के वितरणात्मक बल को सुरक्षित रखता है और पूरे संबोधित समुदाय के लिए हिन्दी में स्वाभाविक है; ‘अपने’ हिन्दी में अनावश्यक लैंगिक विशिष्टीकरण के बिना उसी संबंध को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ याहवे के मंदिर के लिए और ‘घर’ लोगों के निजी निवास के लिए प्रयुक्त है। ‘देखो’, ‘उजाड़ पड़ा है’ और ‘दौड़ता है’ मूल की जीवंत भविष्यद्वाणी शैली को बनाए रखते हैं।
