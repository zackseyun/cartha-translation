  text: וָ/אֶקְרָ֨א חֹ֜רֶב עַל הָ/אָ֣רֶץ וְ/עַל הֶ/הָרִ֗ים וְ/עַל הַ/דָּגָן֙ וְ/עַל הַ/תִּיר֣וֹשׁ וְ/עַל הַ/יִּצְהָ֔ר וְ/עַ֛ל אֲשֶׁ֥ר תּוֹצִ֖יא הָ/אֲדָמָ֑ה וְ/עַל הָֽ/אָדָם֙ וְ/עַל הַ/בְּהֵמָ֔ה וְ/עַ֖ל כָּל יְגִ֥יעַ כַּפָּֽיִם־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/011.yaml
  text: And I called for a drought on the land and on the mountains[a], on the grain, on the new wine, on the fresh oil, on what the ground produces, on man and on beast[b], and on all the labor of the hands.
translation:
  language: hi
  text: और मैंने भूमि पर, पहाड़ों पर, अनाज पर, नई दाखमदिरा पर, ताज़े तेल[a] पर, और जो कुछ मिट्टी उपजाती है उस पर; मनुष्य पर, पशु पर, और हाथों की सारी मेहनत पर सूखा बुलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्द सामान्यतः कृषि-उत्पाद के रूप में ताज़े जैतून के तेल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: मैंने ... बुलाया
  rationale: यहाँ קרא किसी दंडात्मक दशा को बुलाने या ले आने के अर्थ में है। यह अनुवाद परमेश्वर की सक्रिय भूमिका को बनाए रखता है और स्रोत की अभिव्यक्ति के निकट है।
- source_word: חֹרֶב
  choice: सूखा
  rationale: कृषि, उपज, मनुष्य और पशु की सूची के संदर्भ में इसका स्वाभाविक अर्थ वर्षा के अभाव से उत्पन्न सूखा है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यह स्थानीय भूभाग को दर्शाता है, पूरी पृथ्वी को नहीं। आगे אֲדָמָה के लिए ‘मिट्टी’ रखकर दोनों इब्रानी शब्दों का भेद भी बना रहता है।
- source_word: הֶהָרִים
  choice: पहाड़ों
  rationale: यह הָרִים का सीधा और आधुनिक हिन्दी में स्वाभाविक अनुवाद है।
- source_word: הַדָּגָן
  choice: अनाज
  rationale: यह विभिन्न प्रकार की अन्न-उपज के लिए सामान्य शब्द है।
- source_word: הַתִּירוֹשׁ
  choice: नई दाखमदिरा
  rationale: תִּירוֹשׁ अंगूर से बनी नई मदिरा अथवा ताज़े अंगूरी उत्पाद को दर्शाता है; ‘नई दाखमदिरा’ उसकी कृषि-संबंधी विशिष्टता बनाए रखती है।
- source_word: הַיִּצְהָר
  choice: ताज़े तेल
  rationale: यह कृषि-उत्पाद के रूप में नया निकाला गया तेल, सामान्यतः जैतून का तेल, दर्शाता है। मुख्य पाठ स्रोत से अधिक विशिष्ट हुए बिना इसे ‘ताज़ा तेल’ कहता है।
- source_word: אֲשֶׁר תּוֹצִיא הָאֲדָמָה
  choice: मिट्टी की सारी उपज
  rationale: यह संक्षिप्त और स्वाभाविक हिन्दी में मिट्टी से निकलने वाली हर वस्तु के व्यापक आशय को व्यक्त करता है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם एकवचन रूप में समस्त मानवजाति का सामान्य बोध कराता है और पशु के साथ अलंकारिक जोड़ी बनाता है। हिन्दी ‘मनुष्य’ इस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּהֵמָה
  choice: पशु
  rationale: यह व्यापक अर्थ बनाए रखता है; संदर्भ में पालतू पशु विशेष रूप से सम्मिलित हो सकते हैं, पर शब्द को केवल पशुधन तक सीमित करना आवश्यक नहीं है।
- source_word: כָּל יְגִיעַ כַּפָּיִם
  choice: हाथों की सारी मेहनत
  rationale: यह इब्रानी शारीरिक बिंब और मानवीय परिश्रम तथा उसके फल—दोनों की अर्थ-छाया को बनाए रखता है।
theological_decisions:
- issue: הָאָדָם का समष्टिगत मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति / लोग
  rationale: मूल में व्याकरणिक एकवचन है, पर आशय सामान्य रूप से मानव प्राणियों से है। ‘मनुष्य’ हिन्दी में समावेशी सामान्य संज्ञा के रूप में काम करता है और ‘पशु’ के साथ मूल की संतुलित जोड़ी बनाए रखता है।
- issue: सूखे के आने में परमेश्वर की भूमिका
  choice: मैंने ... सूखा बुलाया
  alternative: मैंने ... सूखा पड़ने दिया
  rationale: וָאֶקְרָא सक्रिय रूप से बुलाने का भाव रखता है। ‘पड़ने दिया’ केवल अनुमति का अर्थ ला सकता है और मूल में व्यक्त सक्रिय दैवी न्याय को कमजोर कर देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी रखी गई है। सूची की भविष्यद्वक्ताई लय और बार-बार आने वाले ‘पर’ को यथासंभव बनाए रखा गया है। ‘दाखमदिरा’ अंगूर-संबंधी अर्थ स्पष्ट करती है, जबकि ‘हाथों की मेहनत’ मूल बिंब को सुरक्षित रखती है।
