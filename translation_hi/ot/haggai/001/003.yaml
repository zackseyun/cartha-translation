- issue: בְּיַד में भविष्यद्वक्ता की मध्यस्थ भूमिका
  choice: हाग्गै नबी के हाथ से
  alternative: हाग्गै नबी के द्वारा
  rationale: शाब्दिक इब्रानी मुहावरा सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका आशय माध्यम या प्रतिनिधि के द्वारा वचन पहुँचने से है; इससे अनावश्यक व्याख्यात्मक निर्धारण नहीं होता।
