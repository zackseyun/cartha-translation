source:
  edition: WLC
  text: וַ/יָּ֣עַר יְהוָ֡ה אֶת רוּחַ֩ זְרֻבָּבֶ֨ל בֶּן שַׁלְתִּיאֵ֜ל פַּחַ֣ת יְהוּדָ֗ה וְ/אֶת ר֨וּחַ֙ יְהוֹשֻׁ֤עַ בֶּן יְהוֹצָדָק֙ הַ/כֹּהֵ֣ן הַ/גָּד֔וֹל וְֽ/אֶת ר֔וּחַ כֹּ֖ל שְׁאֵרִ֣ית הָ/עָ֑ם וַ/יָּבֹ֨אוּ֙ וַ/יַּעֲשׂ֣וּ מְלָאכָ֔ה בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/haggai/001/014.yaml
  text: And Yahweh stirred up the spirit of Zerubbabel son of Shealtiel[a], governor of Judah, and the spirit of Joshua son of Jehozadak, the high priest, and the spirit of all the remnant of the people; and they came and did work on the house of Yahweh of Armies, their God.
translation:
  language: hi
  text: यहोवा ने यहूदा के राज्यपाल शालतीएल के पुत्र जरुब्बाबेल की आत्मा को, महायाजक यहोसादाक के पुत्र यहोशू की आत्मा को, और प्रजा के समस्त शेष लोगों की आत्मा को उभारा। वे आए और अपने परमेश्वर सेनाओं के यहोवा[a] के भवन पर काम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक रूप से, “सेनाओं के प्रभु।”
    reason: यְהוָה צְבָאוֹת की पारंपरिक हिन्दी अभिव्यक्ति बताने के लिए।
lexical_decisions:
- source_word: וַיָּעַר
  choice: उभारा
  rationale: क्रिया का अर्थ किसी को जगाकर या प्रेरित करके कार्य के लिए तत्पर करना है। ‘आत्मा को उभारा’ मूल बिंब और कार्य-प्रेरणा दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ शब्द व्यक्ति की भीतरी प्रवृत्ति या प्रेरक चेतना को सूचित करता है; ‘आत्मा’ मूल शब्द की व्यापकता और धर्मवैचारिक गूँज को बिना सीमित किए सुरक्षित रखता है।
- source_word: פַּחַת יְהוּדָה
  choice: यहूदा के राज्यपाल
  rationale: फ़ारसी काल की प्रशासनिक उपाधि के लिए ‘राज्यपाल’ स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह इस पदवी का मानक, संक्षिप्त और सुविज्ञात हिन्दी रूप है।
- source_word: כֹּל שְׁאֵרִית הָעָם
  choice: प्रजा के बचे हुए सभी लोग
  rationale: यह वाक्यांश जीवित या शेष बचे समुदाय को दर्शाता है और ‘शेष’ की भविष्यद्वाणी-संबंधी गूँज को सहज हिन्दी में बनाए रखता है।
- source_word: וַיָּבֹאוּ
  choice: वे आए
  rationale: साधारण कथात्मक क्रिया का सीधा अनुवाद है; मूल में निहित न होने वाली दिशा या अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: וַיַּעֲשׂוּ מְלָאכָה
  choice: काम किया
  rationale: मूल का शाब्दिक भाव ‘काम किया’ है। ‘काम करने लगे’ कहने से आरंभिक पक्ष जुड़ सकता था, जो क्रिया में स्पष्ट नहीं है।
- source_word: בְּבֵית
  choice: भवन पर
  rationale: प्रसंग भवन के निर्माण या पुनर्स्थापन का है; इसलिए हिन्दी में ‘भवन पर काम किया’ गतिविधि को ‘भवन में’ की अपेक्षा अधिक ठीक व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: צְבָאוֹת के ठोस अर्थ ‘सेनाएँ’ को आधुनिक पाठक के लिए स्पष्ट रखा गया है और दिव्य नाम को भी सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: कर्ता के साथ संबंध को हिन्दी के स्वाभाविक आत्मवाचक सर्वनाम ‘अपने’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; ‘यहोवा’ उसे उपाधि में बदले बिना हिन्दी पाठक तक पहुँचाता है।
- issue: רוּחַ का आशय
  choice: आत्मा
  alternative: मन / भीतरी प्रवृत्ति
  rationale: पद यह स्पष्ट नहीं करता कि आशय केवल मनोवैज्ञानिक प्रवृत्ति है या व्यापक आत्मिक प्रेरणा; ‘आत्मा’ इस अर्थगत तनाव को खुला रखता है।
- issue: שְׁאֵרִית का धर्मवैचारिक स्वर
  choice: बचे हुए सभी लोग
  alternative: बाकी सभी लोग
  rationale: ‘बचे हुए’ विनाश या निर्वासन के बाद सुरक्षित रहे समुदाय का भाव बनाए रखता है, जबकि ‘बाकी’ उस गूँज को कुछ सपाट कर देता है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं के यहोवा
  alternative: सेनाओं के प्रभु
  rationale: मुख्य पाठ में צְבָאוֹת का पारदर्शी अर्थ और याहवेह का व्यक्तिगत नाम दोनों सुरक्षित रखे गए हैं; पारंपरिक उपाधि को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों के हिन्दी बाइबलीय रूप अपनाए गए हैं। समानांतर हिब्रू संरचना को तीन बार ‘आत्मा को’ दोहराकर सुरक्षित रखा गया है, जबकि अंतिम वाक्य हिन्दी में स्वाभाविक क्रम से प्रस्तुत है।
