    reason: lexical_alternative
lexical_decisions:
- source_word: מִי פֶתִי
  choice: जो कोई भोला है
  rationale: מִי यहाँ सामान्य निमंत्रणसूचक अर्थ में ‘जो कोई’ है। नीतिवचन में פֶתִי ऐसे अनुभवहीन और आसानी से बहकने वाले व्यक्ति को दर्शाता है जिसका चरित्र और विवेक अभी परिपक्व नहीं हुआ; ‘भोला’ इस अर्थ को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָסֻר הֵנָּה
  choice: वह इधर मुड़ आए
  rationale: क्रिया यहाँ आमंत्रण या पुकार के रूप में प्रयुक्त है। ‘इधर मुड़ आए’ दिशा बदलकर वक्ता के स्थान पर आने का भाव बनाए रखता है।
- source_word: חֲסַר לֵב
  choice: जिसमें समझ की कमी है
  rationale: इस इब्रानी मुहावरे में ‘हृदय’ समझ, निर्णय-शक्ति और भीतरी विवेक का केंद्र है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक रूप को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאָמְרָה לּוֹ
  choice: उससे वह कहती है
  rationale: स्त्रीलिंग क्रिया का कर्ता प्रसंग की स्त्री है। वर्तमानकालीन ‘कहती है’ सूक्तिपरक कथन और आगे आने वाले प्रत्यक्ष वचन का स्वाभाविक परिचय देता है।
