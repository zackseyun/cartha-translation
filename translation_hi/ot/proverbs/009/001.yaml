  yaml_path: translation/ot/proverbs/009/001.yaml
  text: Wisdom has built her house[a]; she has hewn out her seven pillars.
translation:
  language: hi
  text: 'बुद्धि[a] ने अपना घर बनाया है;

    उसने अपने सात खंभे तराशे हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חָכְמוֹת रूप में बहुवचन है, पर यहाँ स्त्रीलिंग एकवचन क्रियाओं के साथ आया है और व्यक्तिरूप में एकवचन ‘बुद्धि’ का काम करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמוֹת
  choice: बुद्धि
  rationale: यह शब्द रूप की दृष्टि से बहुवचन है, पर यहाँ इसके साथ स्त्रीलिंग एकवचन क्रियाएँ और प्रत्यय आए हैं; इसलिए यह व्यक्तिरूप में प्रस्तुत एकवचन ‘बुद्धि’ को दर्शाता है। हिंदी में ‘बुद्धि’ स्वाभाविक, स्त्रीलिंग और गरिमापूर्ण है।
- source_word: בָּנְתָה
  choice: ने ... बनाया है
  rationale: पूर्ण क्रिया को हिंदी के पूर्ण वर्तमान में व्यक्त किया गया है, जिससे निर्माण का पूरा हो चुका परिणाम सामने आता है।
- source_word: בֵיתָהּ
  choice: अपना घर
  rationale: स्थापत्य-संबंधी अगले चित्र ‘खंभे’ के अनुरूप בַּיִת का सीधा अर्थ ‘घर’ रखा गया है। कर्ता के अपने घर के लिए हिंदी में ‘अपना’ स्वाभाविक है।
- source_word: חָצְבָה
  choice: काटकर गढ़े हैं
  rationale: क्रिया पत्थर काटने या खोदकर निकालने की ठोस स्थापत्य-छवि देती है। ‘काटकर गढ़े’ हिंदी में उस श्रमसाध्य निर्माण को व्यक्त करता है और केवल सजावटी ‘तराशने’ तक अर्थ सीमित नहीं करता।
- source_word: עַמּוּדֶיהָ
  choice: अपने ... खंभे
  rationale: ‘खंभे’ सामान्य आधुनिक हिंदी में स्थापत्य के इस ठोस चित्र को स्पष्ट रूप से व्यक्त करता है।
- source_word: שִׁבְעָה
  choice: सात
  rationale: संख्या का सीधा अनुवाद किया गया है; संभावित प्रतीकात्मक पूर्णता को मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: स्त्रीलिंग एकवचन ‘बुद्धि’
  alternative: ‘बुद्धिमती स्त्री’ या ‘देवी बुद्धि’
  rationale: इब्रानी पाठ स्त्रीलिंग एकवचन क्रियाओं द्वारा बुद्धि का मानवीकरण करता है, पर उसे कोई अतिरिक्त उपाधि नहीं देता। इसलिए मानवीकरण बनाए रखते हुए ऐसी व्याख्यात्मक या धर्मवैचारिक संज्ञाएँ नहीं जोड़ी गईं।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, काव्यात्मक और गरिमापूर्ण शैली। समानांतर पंक्तियों तथा स्त्रीलिंग मानवीकरण को बनाए रखा गया है।
