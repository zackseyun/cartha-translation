  text: 'to call to those passing by on the road[a], who are going straight on their paths:'
translation:
  language: hi
  text: 'ताकि वह राह से गुज़रने वालों को पुकारे, जो अपने मार्गों पर सीधे चले जा रहे हैं[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो अपने मार्ग सीधे रखते हैं।’ हिब्रू कृदंत का अर्थ सीधे आगे बढ़ना या अपने मार्ग को सीधा रखना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרֹא
  choice: पुकारे
  rationale: उद्देश्यसूचक infinitive को पिछले संदर्भ से जोड़ने के लिए ‘ताकि ... पुकारे’ रखा गया है; यह सार्वजनिक रूप से आवाज़ देने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְעֹבְרֵי דָרֶךְ
  choice: राह से गुजरनेवालों को
  rationale: कृदंत का गतिशील भाव और राहगीरों का ठोस चित्र दोनों बने रहते हैं।
- source_word: דָרֶךְ
  choice: राह
  rationale: यहाँ यात्रा के मार्ग का अर्थ है; ‘राह’ आधुनिक हिंदी में स्वाभाविक है और आगे के אֹרְחוֹת से हल्का शब्दगत भेद भी रखता है।
- source_word: הַמְיַשְּׁרִים
  choice: सीधे चले जा रहे हैं
  rationale: ישר के कृदंत को अपने मार्ग पर सीधे आगे बढ़ने के अर्थ में लिया गया है। हिब्रू में ‘मार्गों को सीधा रखने/बनाने’ की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: אֹרְחוֹתָם
  choice: अपने मार्गों पर
  rationale: सप्रत्यय बहुवचन का अर्थ ‘अपने मार्गों’ से व्यक्त होता है; ‘पर’ चुने गए गतिशील अर्थ के अनुरूप है और यात्रा तथा नैतिक आचरण—दोनों की छवि बनाए रखता है।
