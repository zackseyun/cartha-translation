  yaml_path: translation/ot/proverbs/009/009.yaml
  text: Give to a wise man[a], and he will become wiser still; teach a righteous man[b], and he will add learning.
translation:
  language: hi
  text: बुद्धिमान को दो[a], और वह और भी बुद्धिमान हो जाएगा; धर्मी को सिखाओ[b], और वह और अधिक शिक्षा ग्रहण करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “बुद्धिमान को शिक्षा दो।” इब्रानी में “दो” का कर्म नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “धर्मी” पुल्लिंग एकवचन है, पर यहाँ वह प्रतिनिधिक एकवचन के रूप में प्रयुक्त है—नीतिवचन में यह एक सामान्य शैली है।
    reason: cultural_note
lexical_decisions:
- source_word: תֵּן
  choice: दो
  rationale: נתן के आदेशवाचक रूप का मूल अर्थ ‘देना’ है। इब्रानी में कर्म अनकहा है; मुख्य पाठ में ‘दो’ रखकर उसी संक्षिप्तता और अस्पष्टता को सुरक्षित रखा गया है।
- source_word: לְחָכָם
  choice: बुद्धिमान को
  rationale: חָכָם एक बुद्धिमान व्यक्ति को सूचित करता है। हिंदी में ‘बुद्धिमान’ स्वाभाविक है और नीतिवचन की प्रतिनिधिक एकवचन शैली को बनाए रखता है।
- source_word: וְיֶחְכַּם עוֹד
  choice: और वह और भी बुद्धिमान हो जाएगा
  rationale: חכם के साथ עוֹד ज्ञान में आगे बढ़ने का भाव देता है; यह हिंदी अभिव्यक्ति उस वृद्धि को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: הוֹדַע
  choice: सिखाओ
  rationale: ידע के हिफ़ील आदेशवाचक रूप का शाब्दिक भाव ‘ज्ञात कराओ’ है; ज्ञान-साहित्य के शिक्षण-संदर्भ में ‘सिखाओ’ उसका स्वाभाविक अर्थ है।
- source_word: לְצַדִּיק
  choice: धर्मी को
  rationale: צַדִּיק का अर्थ नैतिक रूप से धर्मी या न्यायी व्यक्ति है। ‘धर्मी’ पहले चरण के ‘बुद्धिमान’ के समानांतर संक्षिप्त प्रतिनिधिक एकवचन है।
- source_word: וְיוֹסֶף לֶקַח
  choice: और वह अपनी शिक्षा बढ़ाएगा
  rationale: יסף वृद्धि या जोड़ने को और לֶקַח ग्रहण की हुई शिक्षा या सीख को दर्शाता है। ‘अपनी शिक्षा बढ़ाएगा’ आधुनिक हिंदी में ज्ञान-वृद्धि का भाव सहज रूप से देता है।
