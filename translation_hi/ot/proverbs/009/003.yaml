lexical_decisions:
- source_word: שָׁלְחָה
  choice: उसने ... भेजा है
  rationale: यह שלח का काल पूर्ण, तृतीय पुरुष स्त्रीलिंग एकवचन रूप है; स्त्रीरूप में व्यक्त बुद्धि इसकी कर्ता है। हिन्दी में पूर्ण क्रिया तैयारी के पूरे हो चुके कार्य को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: נַעֲרֹתֶיהָ
  choice: अपनी युवतियों को
  rationale: נערות मुख्यतः युवतियों या कम उम्र की स्त्रियों को दर्शाता है। संदर्भ में वे परिचारिकाएँ हो सकती हैं, पर मूल शब्द सेविका होने की सामाजिक स्थिति को अनिवार्य नहीं करता।
- source_word: תִקְרָא
  choice: वह ... पुकारती है
  rationale: קרא का यह रूप सार्वजनिक रूप से पुकारने का भाव देता है। साधारण वर्तमान हिन्दी में आगे चल रही पुकार को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל גַּפֵּי מְרֹמֵי קָרֶת
  choice: नगर के सबसे ऊँचे स्थानों से
  rationale: शब्दसमूह का शाब्दिक चित्र नगर की ऊँचाइयों के शिखरों या ऊपरी सिरों पर पुकारने का है। हिन्दी में ‘से’ पुकार के स्थान को मुहावरेदार ढंग से बताता है, और ‘सबसे ऊँचे स्थानों’ से दोहरे ऊँचाई-सूचक पदों का संयुक्त बल प्रकट होता है।
- source_word: קָרֶת
  choice: नगर
  rationale: यह ‘नगर’ के लिए प्रयुक्त काव्यात्मक रूप है; ‘नगर’ आधुनिक हिन्दी में गरिमापूर्ण और स्वाभाविक है।
