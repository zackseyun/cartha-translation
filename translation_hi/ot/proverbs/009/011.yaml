  edition: WLC
  text: כִּי בִ֭/י יִרְבּ֣וּ יָמֶ֑י/ךָ וְ/יוֹסִ֥יפוּ לְּ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/011.yaml
  text: For by me your days will be multiplied[a], and years of life will be added to you.
translation:
  language: hi
  text: 'क्योंकि मेरे द्वारा[a] तुम्हारे दिन बढ़ेंगे,

    और तुम्हें जीवन के और वर्ष दिए जाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझमें’ अथवा ‘मेरे कारण’; यहाँ इब्रानी संबंधबोधक शब्द के कई निकटवर्ती अर्थ संभव हैं, पर संदर्भ में ‘मेरे द्वारा’—अर्थात बुद्धि को दीर्घ जीवन का माध्यम मानना—अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִי
  choice: मेरे द्वारा
  rationale: 'यहाँ בְּ के साथ प्रथम पुरुष एकवचन प्रत्यय साधन या माध्यम का बोध कराता है: व्यक्तिरूप में बोल रही बुद्धि के द्वारा जीवन लंबा होता है। निकटवर्ती अन्य अर्थों को पादटिप्पणी में रखा गया है।'
- source_word: יִרְבּוּ
  choice: बढ़ेंगे
  rationale: רבה का अर्थ ‘बहुत होना’ या ‘बढ़ना’ है। ‘तुम्हारे दिन बढ़ेंगे’ हिंदी में स्वाभाविक है और आयु बढ़ने के मूल इब्रानी बिंब को बनाए रखता है।
- source_word: יָמֶיךָ
  choice: तुम्हारे दिन
  rationale: शाब्दिक अभिव्यक्ति हिंदी में भी सहज है और जीवनकाल के लिए प्रयुक्त मूल रूपक को सुरक्षित रखती है।
- source_word: וְיוֹסִיפוּ לְּךָ
  choice: बढ़ाए जाएँगे
  rationale: इस रचना में יסף का हिफ़ील रूप किसी के लिए वर्षों के जोड़े जाने का परिणाम व्यक्त करता है। हिंदी कर्मवाच्य अनिर्दिष्ट कर्ता जोड़े बिना उसी भाव को स्पष्ट करता है।
- source_word: שְׁנוֹת חַיִּים
  choice: जीवन के वर्ष
  rationale: यह मूल संबंधवाचक पदबंध का सीधा और हिंदी में सुबोध रूप है।
theological_decisions:
- issue: दीर्घ जीवन के कथन का नीतिवचनात्मक स्वरूप
  choice: मूल की तरह कथन को सीधे प्रतिज्ञात्मक रूप में रखा गया है।
  alternative: इसे ‘सामान्यतः’ या ‘हो सकते हैं’ जैसे शब्द जोड़कर सीमित करना।
  rationale: इब्रानी पाठ स्वयं ऐसा कोई सीमासूचक शब्द नहीं जोड़ता; इसलिए नीतिवचन के सामान्य सत्य और उसके अंतर्निहित तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप चुना गया है। ‘तुम्हारे दिन’ और ‘जीवन के वर्ष’ मूल इब्रानी की पुनरुक्ति और जीवनकाल-संबंधी छवि को बनाए रखते हैं।
