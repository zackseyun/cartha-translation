base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/012.yaml
  text: If you are wise[a], you are wise for yourself; if you scoff, you alone will bear it.
translation:
  language: hi
  text: यदि तू बुद्धिमान है, तो अपने ही लिए बुद्धिमान है; और यदि तू उपहास करता है, तो तू अकेला ही उसे वहन करेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तू अकेला ही वहन करेगा।” इब्रानी में किस चीज़ को वहन किया जाएगा, यह स्पष्ट नहीं किया गया है; आशय उसके परिणामों का भार भी हो सकता है।
    reason: मूल इब्रानी में נשא का कर्म निहित है। मुख्य पाठ का ‘उसे’ कर्म की उपस्थिति का संकेत देता है, जबकि पादटिप्पणी उसकी अनिर्दिष्टता स्पष्ट करती है।
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त प्रस्तुत करता है; ‘यदि’ इब्रानी के शर्तसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חָכַמְתָּ ... חָכַמְתָּ לָּךְ
  choice: तू बुद्धिमान है, तो अपने ही लिए बुद्धिमान है
  rationale: ‘बुद्धिमान’ की पुनरावृत्ति मूल के बलाघात को सुरक्षित रखती है, और ‘अपने ही लिए’ לָךְ में निहित व्यक्तिगत लाभ को व्यक्त करता है।
- source_word: וְלַצְתָּ
  choice: यदि तू उपहास करता है
  rationale: לוץ नीतिवचन में घमंडपूर्ण तिरस्कार या उपहास का बोध कराता है; ‘उपहास करता है’ आधुनिक हिन्दी में क्रियात्मक अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לְבַדְּךָ
  choice: तू अकेला ही
  rationale: यह परिणाम के लिए व्यक्ति की अकेली जिम्मेदारी पर मूल के बल को स्वाभाविक हिन्दी क्रम में व्यक्त करता है।
- source_word: תִשָּׂא
  choice: उसका भार उठाएगा
  rationale: נשא का मूल अर्थ उठाना या वहन करना है। हिन्दी में वाक्य को स्वाभाविक बनाने के लिए ‘उसका भार’ जोड़ा गया है, जबकि भार की सटीक प्रकृति मूल में अनिर्दिष्ट है।
