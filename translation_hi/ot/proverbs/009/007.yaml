translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की समानान्तर काव्य-रचना बनाए रखने के लिए दोनों खंडों में कृदन्त-संज्ञा का प्रयोग हुआ है। दूसरे खंड के संक्षिप्त इब्रानी वाक्य और מוּמוֹ के सर्वनामगत तनाव को अत्यधिक स्पष्ट किए बिना पादटिप्पणी में सुरक्षित रखा गया है।
