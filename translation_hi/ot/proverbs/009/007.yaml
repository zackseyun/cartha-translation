source:
  edition: WLC
  text: יֹ֤סֵ֨ר לֵ֗ץ לֹקֵ֣חַֽ ל֣/וֹ קָל֑וֹן וּ/מוֹכִ֖יחַ לְ/רָשָׁ֣ע מוּמֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/007.yaml
  text: Whoever corrects a scoffer gets dishonor for himself[c][b][a], and whoever rebukes a wicked man gets a blemish for himself.
translation:
  language: hi
  text: उपहास करनेवाले को सुधारनेवाला अपने लिए अपमान मोल लेता है[a], और दुष्ट को डाँटनेवाला कलंक पाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ऊपर अपमान ले आता है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उसका कलंक” है। इसका संकेत दुष्ट से मिलनेवाली निन्दा या अपशब्द की ओर हो सकता है; सर्वनाम का सम्बन्ध संक्षिप्त होने के कारण कुछ अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹסֵר
  choice: सुधारनेवाला
  rationale: यह कृदन्त एक सामान्य सिद्धान्त व्यक्त करता है। यहाँ יסר का अर्थ दण्ड देने की अपेक्षा मौखिक रूप से सुधारना अधिक उपयुक्त है, विशेषकर समानान्तर ‘डाँटनेवाला’ के साथ।
- source_word: לֵץ
  choice: उपहास करनेवाला
  rationale: नीतिवचन में यह शब्द ऐसे घमंडी व्यक्ति के लिए आता है जो बुद्धि को तिरस्कारपूर्वक ठुकराता है। यह हिन्दी अभिव्यक्ति उसके उपहास और अवमानना के भाव को स्पष्ट रखती है।
- source_word: לֹקֵחַ לוֹ
  choice: अपने लिए … मोल लेता है
  rationale: לקח और לוֹ का मेल अपने ऊपर कोई परिणाम ले आने का भाव देता है। ‘मोल लेता है’ स्वाभाविक हिन्दी में इस आत्म-संबन्धी और अनिष्टकारी परिणाम को व्यक्त करता है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह शब्द सार्वजनिक लज्जा, निरादर या बदनामी का बोध कराता है। ‘अपमान’ सामान्य पाठक के लिए सहज है और केवल भीतरी लज्जा तक अर्थ को सीमित नहीं करता।
- source_word: וּמוֹכִיחַ
  choice: और … डाँटनेवाला
  rationale: יכח के हिफ़ील रूप का अर्थ दोष दिखाना, फटकारना या डाँटना है। ‘डाँटना’ पहले खंड के ‘सुधारना’ से अधिक तीखा समानान्तर भाव देता है।
- source_word: לְרָשָׁע
  choice: दुष्ट
  rationale: एकवचन रूप यहाँ किसी भी दुष्ट व्यक्ति का सामान्य प्रतिनिधित्व करता है। हिन्दी में संज्ञा रूप ‘दुष्ट’ संक्षिप्त, स्वाभाविक और लिंग को अनावश्यक रूप से उभारने से बचता है।
- source_word: מוּמוֹ
  choice: कलंक
  rationale: מוּם का मूल अर्थ दोष या दाग है; यहाँ यह रूपकतः डाँटनेवाले को मिलनेवाले कलंक, निन्दा या अपशब्द का संकेत दे सकता है। मुख्य पाठ में ‘कलंक’ रखकर संक्षिप्तता और अर्थ-तनाव बचाया गया है, जबकि प्रत्यय की अस्पष्टता पादटिप्पणी में दी गई है।
