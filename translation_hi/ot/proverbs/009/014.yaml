lexical_decisions:
- source_word: וְיָשְׁבָה
  choice: वह ... बैठती है
  rationale: यह संयोजक सहित काल रूप संदर्भ में मूर्खता के सजीव, जारी चित्रण को वर्तमानकालीन वर्णन के रूप में व्यक्त करता है।
- source_word: לְפֶתַח
  choice: द्वार पर
  rationale: פֶּתַח घर के प्रवेश या द्वार को दर्शाता है; यह हिंदी में स्वाभाविक और ठोस स्थान-सूचक अभिव्यक्ति है।
- source_word: בֵּיתָהּ
  choice: अपने घर के
  rationale: यहाँ בַּיִת भौतिक घर को सूचित करता है; कर्ता के साथ संबंध हिंदी में स्वाभाविक रूप से ‘अपने’ द्वारा व्यक्त होता है।
- source_word: כִּסֵּא
  choice: एक आसन
  rationale: शब्द का अर्थ आसन, कुर्सी या सिंहासन हो सकता है। संदर्भ राजकीय अर्थ की माँग नहीं करता; ‘आसन’ गरिमापूर्ण रहते हुए अनावश्यक राजकीय संकेत से बचता है।
- source_word: מְרֹמֵי
  choice: ऊँचाइयों पर
  rationale: बहुवचन रचना नगर के ऊँचे और सार्वजनिक रूप से प्रमुख स्थानों का बोध कराती है।
- source_word: קָרֶת
  choice: नगर
  rationale: यह शब्द नगर या शहर को दर्शाता है; ज्ञान-साहित्य के सार्वजनिक शहरी परिवेश में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
