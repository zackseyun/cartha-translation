translation:
  language: hi
  text: वह अपने भोज के लिए पशुओं का वध कर चुकी है[a], अपनी मदिरा मिला चुकी है[b], और अपनी मेज़ भी लगा चुकी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने वध किए हुए पशु” अथवा “अपना मांस”; इब्रानी संज्ञा भोज के लिए वध किए गए पशुओं या उनसे तैयार मांस का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उसने भोज की रीति के अनुसार अपनी दाखमधु को मिलाकर तैयार किया है—संभवतः पानी और/या मसालों के साथ।
    reason: cultural_note
lexical_decisions:
- source_word: טָבְחָה
  choice: पशु काट चुकी है
  rationale: यह क्रिया भोजन के लिए पशु का वध करने को व्यक्त करती है। ‘काट चुकी है’ ठोस क्रिया और पूर्ण हो चुकी तैयारी—दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: טִבְחָהּ
  choice: अपने भोज के लिए पशु
  rationale: संज्ञा वध किए हुए पशुओं अथवा उनसे तैयार मांस-भोजन को सूचित करती है। मुख्य पाठ में ‘भोज के लिए पशु’ रखने से प्रसंग स्पष्ट रहता है और इसे केवल सामान्य ‘भोजन तैयार करना’ नहीं बनाया जाता।
- source_word: מָסְכָה
  choice: मिला चुकी है
  rationale: यहाँ क्रिया दाखमधु को प्रचलित भोज-विधि के अनुसार पानी और/या मसालों के साथ मिलाकर तैयार करने के अर्थ में है।
- source_word: יֵינָהּ
  choice: अपनी दाखमधु
  rationale: यह יין का सीधा स्वामित्वसूचक अनुवाद है; ‘दाखमधु’ अंगूर से बनी मदिरा को स्पष्ट करता है।
- source_word: אַף
  choice: भी
  rationale: यह पहले बताए गए कार्यों में एक और पूर्ण तैयारी जोड़ता है।
- source_word: עָרְכָה
  choice: लगा चुकी है
  rationale: मेज़ के प्रसंग में ערך का स्वाभाविक हिन्दी रूप ‘मेज़ लगाना’ है, अर्थात भोज के लिए उसे क्रम से तैयार करना।
- source_word: שֻׁלְחָנָהּ
  choice: अपनी मेज़
  rationale: यह भोज की ठोस मेज़ की छवि और स्वामित्व—दोनों को बनाए रखता है।
theological_decisions:
- issue: ज्ञान का स्त्रीरूप मानवीकरण
  choice: ‘वह ... चुकी है’ के द्वारा स्त्रीलिंग एकवचन कर्ता को स्पष्ट रखा गया है, पर पद में उसका नाम नहीं जोड़ा गया।
  alternative: ‘बुद्धि ने ...’ कहकर कर्ता को दोबारा स्पष्ट करना।
  rationale: इब्रानी क्रियाएँ स्त्रीलिंग एकवचन हैं और निकटवर्ती प्रसंग में मानवीकृत बुद्धि कर्ता है। हिन्दी का ‘वह’ अपने आप लिंग नहीं बताता, इसलिए ‘चुकी है’ स्त्रीरूप को सुरक्षित रखता है; साथ ही पद में व्याख्यात्मक नाम जोड़ने से बचता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काट चुकी है’, ‘मिला चुकी है’ और ‘लगा चुकी है’ की समानांतर रचना इब्रानी के तीन पूर्ण तैयारी-कार्यों तथा स्त्रीलिंग मानवीकरण को स्पष्ट करती है।
