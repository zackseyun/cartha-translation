source:
  edition: WLC
  text: אַל תּ֣וֹכַח לֵ֭ץ פֶּן יִשְׂנָאֶ֑/ךָּ הוֹכַ֥ח לְ֝/חָכָ֗ם וְ/יֶאֱהָבֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/008.yaml
  text: Do not rebuke a scoffer[a], lest he hate you; rebuke a wise man[b], and he will love you.
translation:
  language: hi
  text: ठट्ठा करनेवाले[a] को मत डाँट; कहीं ऐसा न हो कि वह तुझसे बैर रखे। बुद्धिमान को डाँट, और वह तुझसे प्रेम करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उपहास करनेवाले।’ इब्रानी शब्द ऐसे व्यक्ति को दर्शाता है जो घमंड से दूसरों का तिरस्कार और उपहास करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: मत
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; हिंदी में ‘मत’ सीधा और स्वाभाविक निषेधात्मक आदेश है।
- source_word: תּוֹכַח / הוֹכַח (יכח)
  choice: डाँट
  rationale: यहाँ क्रिया मौखिक फटकार और सुधार का भाव रखती है। ‘डाँट’ दोनों खंडों में उसकी तीक्ष्णता को सहज आधुनिक हिंदी में बनाए रखती है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: नीतिवचन में यह शब्द घमंडी और तिरस्कारपूर्ण उपहास करनेवाले व्यक्ति को दर्शाता है; फुटनोट इस नैतिक अर्थ-छाया को स्पष्ट करता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह वांछित रूप से टाले जानेवाले नकारात्मक परिणाम का परिचय देता है; यह हिंदी में स्वाभाविक चेतावनीसूचक रचना है।
- source_word: יִשְׂנָאֶךָּ
  choice: वह तुझसे बैर रखने लगे
  rationale: अपूर्ण क्रिया संभावित परिणाम बताती है। ‘बैर रखने लगे’ प्रसंग में उत्पन्न होनेवाली शत्रुता का स्वाभाविक हिंदी रूप है।
- source_word: לְחָכָם
  choice: बुद्धिमान
  rationale: इब्रानी में विशेषण पुल्लिंग एकवचन संज्ञा के रूप में प्रतिनिधिक प्रकार को सूचित करता है। हिंदी का ‘बुद्धिमान’ बिना अनावश्यक शब्द जोड़े वही सूक्तिपरक अर्थ देता है।
- source_word: וְיֶאֱהָבֶךָּ
  choice: और वह तुझसे प्रेम करेगा
  rationale: यह अपूर्ण क्रिया आदेश के अपेक्षित परिणाम को व्यक्त करती है; भविष्यकालीन ‘करेगा’ हिंदी में इसे स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: ज्ञान-साहित्य में पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: बुद्धिमान
  alternative: बुद्धिमान व्यक्ति / बुद्धिमान मनुष्य
  rationale: मूल पाठ का पुल्लिंग एकवचन बनाए रखा गया है, पर हिंदी में अनावश्यक रूप से ‘पुरुष’ नहीं जोड़ा गया; ‘बुद्धिमान’ प्रतिनिधिक प्रकार के रूप में स्वाभाविक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूक्तिपरक हिंदी। ‘तू/तुझसे’ का एकवचन संबोधन मूल इब्रानी के एकवचन को बनाए रखता है; ‘करनेवाले’ की वर्तनी आधुनिक मानक के अनुरूप संयुक्त रखी गई है।
