source:
  edition: WLC
  text: תְּחִלַּ֣ת חָ֭כְמָה יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת קְדֹשִׁ֣ים בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/010.yaml
  text: The beginning of wisdom is the fear of Yahweh[a], and the knowledge of the Holy One is understanding.
translation:
  language: hi
  text: यहोवा का भय बुद्धि का आरम्भ है, और परमपवित्र का ज्ञान समझ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּחִלַּת
  choice: आरम्भ
  rationale: यह रचना-रूप यहाँ किसी बात के आरम्भ या आधार-बिंदु को दर्शाता है; ‘आरम्भ’ इब्रानी अभिव्यक्ति को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह नैतिक, व्यावहारिक और जीवन-निर्देशक बुद्धि का व्यापक अर्थ रखता है।
- source_word: יִרְאַת
  choice: भय मानना
  rationale: यह मुख्य वाक्यांश के ‘भय’ को बनाए रखता है, जिसमें श्रद्धापूर्ण विस्मय और परमेश्वर के प्रति उचित भय दोनों समाए हैं; केवल ‘श्रद्धा’ कहना अर्थ को संकरा कर देता। हिंदी में क्रियात्मक रूप वाक्य को अधिक स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְדַעַת
  choice: और ... को जानना
  rationale: संयोजक दूसरे समानांतर खंड को जोड़ता है; संज्ञात्मक ‘ज्ञान’ की अपेक्षा यह क्रियात्मक रूप आधुनिक हिंदी में अधिक स्वाभाविक है और मूल अर्थ बनाए रखता है।
- source_word: קְדֹשִׁים
  choice: परमपवित्र
  rationale: रूप व्याकरणतः बहुवचन है, पर पहले खंड में यहोवा के समानांतर होने के कारण यहाँ परमेश्वर का एकवचन संकेत सर्वाधिक संगत है। ‘परमपवित्र’ उस दिव्य संकेत को स्वाभाविक हिंदी में व्यक्त करता है; मूल बहुवचन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בִּינָה
  choice: समझ
  rationale: नीतिवचन में यह समझ-बूझ या विवेक को दर्शाता है। ‘समझ’ सामान्य पाठक के लिए सहज है और ‘बुद्धि’ के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: קְדֹשִׁים का अभिप्रेत संदर्भ
  choice: 'परमेश्वर को सूचित करने वाला एकवचन: “परमपवित्र”'
  alternative: 'बहुवचन: “पवित्र जनों”'
  rationale: पद की समानांतर रचना में ‘यहोवा का भय मानना’ के अनुरूप ‘परमपवित्र को जानना’ आता है, इसलिए दूसरे खंड में भी परमेश्वर का संदर्भ सबसे अधिक संभावित है। फिर भी इब्रानी रूप वास्तविक रूप से बहुवचन है, इसलिए वैकल्पिक शाब्दिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतरता को स्वाभाविक हिंदी के लिए क्रियात्मक रूपों—‘भय मानना’ और ‘जानना’—से व्यक्त किया गया है, जबकि ‘भय’ की धार्मिक और भावात्मक व्यापकता को कम नहीं किया गया।
