id: PRO.9.18
reference: Proverbs 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/לֹא יָ֭דַע כִּֽי רְפָאִ֣ים שָׁ֑ם בְּ/עִמְקֵ֖י שְׁא֣וֹל קְרֻאֶֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/018.yaml
  text: But he does not know that the dead are there[a], that her guests are in the depths of Sheol.
translation:
  language: hi
  text: परन्तु वह नहीं जानता कि वहाँ मृतक हैं[a], और उसके अतिथि शीओल की गहराइयों में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृतकों की छायाएँ वहाँ हैं।” इब्रानी शब्द רְפָאִים यहाँ शीओल में पड़े मृतकों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: परन्तु ... नहीं
  rationale: संयोजक और निषेध पिछले पद में वर्णित आकर्षण तथा यहाँ प्रकट वास्तविकता के बीच तीखा विरोध दिखाते हैं; आधुनिक हिन्दी में ‘परन्तु’ यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָדַע
  choice: वह नहीं जानता
  rationale: यहाँ पूर्ण रूप सन्दर्भ में वर्तमान अज्ञान की अवस्था बताता है; यह हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात की विषयवस्तु प्रस्तुत करता है जिसे वह नहीं जानता।
- source_word: רְפָאִים
  choice: मृतक
  rationale: नीतिवचन के इस सन्दर्भ में यह जातीय रपाइयों को नहीं, बल्कि शीओल में पड़े मृत लोगों अथवा उनकी छायामय अवस्थिति को सूचित करता है। ‘मृतक’ सामान्य पाठक के लिए स्पष्ट है; वैकल्पिक बिंब पाद-टिप्पणी में रखा गया है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह सरल स्थानवाचक शब्द उस स्त्री के स्थान की छिपी हुई घातक वास्तविकता की ओर संकेत करता है।
- source_word: בְּעִמְקֵי
  choice: की गहराइयों में
  rationale: यह बहुवचन गहरे स्थानों अथवा अतल भागों का बिंब बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: שְׁאוֹל
  choice: शीओल
  rationale: मूल इब्रानी धार्मिक-सांस्कृतिक पद को लिप्यंतरित रखा गया है, ताकि उसे केवल ‘कब्र’ या बाद की विशिष्ट धारणा वाले ‘नरक’ में सीमित न किया जाए।
- source_word: קְרֻאֶיהָ
  choice: उसके अतिथि
  rationale: निष्क्रिय कृदन्त का शाब्दिक भाव ‘उसके बुलाए हुए लोग’ है; सन्दर्भ में वे उसके निमंत्रित जन हैं, इसलिए ‘अतिथि’ संक्षिप्त, स्वाभाविक और उपयुक्त है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शीओल
  alternative: कब्र; मृतकों का लोक; नरक
  rationale: यह पद मृतकों के अधोलोक या निवास-स्थान को सूचित करता है। ‘शीओल’ रखने से मूल की व्यापकता और धार्मिक तनाव सुरक्षित रहते हैं तथा बाद की किसी विशिष्ट नरक-सम्बन्धी धारणा को पाठ में आरोपित नहीं किया जाता।
- issue: רְפָאִים का आशय
  choice: मृतक
  alternative: मृतकों की छायाएँ; प्रेत-छायाएँ; रपाई लोग
  rationale: इस ज्ञान-साहित्यिक सन्दर्भ में आशय शीओल के मृत निवासियों से है, न कि रपाई नामक जातीय समूह से। मुख्य पाठ में स्पष्ट अर्थ दिया गया है, जबकि ‘छायाएँ’ वाला संभावित बिंब पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शीओल’ को मूल धार्मिक पद के रूप में सुरक्षित रखा गया है; वाक्य की समानांतर संरचना और नीचे उतरने का बिंब भी बनाए रखा गया है।
