  yaml_path: translation/ot/proverbs/009/013.yaml
  text: The woman Folly is loud[a]; she is simple and knows nothing.
translation:
  language: hi
  text: मूर्खता नाम की स्त्री शोर मचाती है; वह नासमझ है और कुछ भी नहीं जानती।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में अधिक शाब्दिक रूप से: “और वह नहीं जानती कि क्या।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת כְּסִילוּת
  choice: मूर्खता नाम की स्त्री
  rationale: इब्रानी रचना का शाब्दिक अर्थ ‘मूर्खता की स्त्री’ है। यहाँ नीतिवचन 9 में मूर्खता का स्त्री के रूप में मानवीकरण हुआ है; यह चयन उस मानवीकरण को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: הֹמִיָּה
  choice: शोर मचाती है
  rationale: यह शब्द ऊँची, अशांत और कोलाहलपूर्ण आवाज़ या व्यवहार का बोध कराता है। ‘शोर मचाती है’ सहज हिन्दी में उसके कोलाहलपूर्ण सार्वजनिक आह्वान को व्यक्त करता है।
- source_word: פְּתַיּוּת
  choice: नासमझ
  rationale: मूल संज्ञा सरलता, भोलापन या अनुभवहीन नासमझी का बोध कराती है। विधेय के रूप में ‘नासमझ’ स्वाभाविक है और यहाँ नैतिक-बौद्धिक विवेक की कमी स्पष्ट करता है।
- source_word: וּבַל
  choice: और ... नहीं
  rationale: संयोजक और निषेध मिलकर अगले विधेय को जोड़ते हैं। ‘और ... नहीं’ मूल की योगात्मक संरचना को बिना अनावश्यक विरोधात्मक बल दिए सुरक्षित रखता है।
- source_word: יָדְעָה מָּה
  choice: कुछ भी नहीं जानती
  rationale: शाब्दिक रूप ‘नहीं जानती कि क्या’ है और प्रबल अज्ञान व्यक्त करता है। ‘कुछ भी नहीं जानती’ हिन्दी में उसका स्वाभाविक अर्थ देता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
