base_translation:
  language: en
  yaml_path: translation/ot/proverbs/009/017.yaml
  text: Stolen water is sweet[a], and bread of secrecy is pleasant.
translation:
  language: hi
  text: 'चोरी का पानी मीठा लगता है,

    और गुप्त स्थानों की रोटी स्वादिष्ट लगती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गुप्तता की रोटी।” इब्रानी पदबंध संक्षिप्त है; इसका अर्थ “गुप्त स्थानों की रोटी” या मुहावरे के रूप में “गुप्त रूप से खाई जाने वाली रोटी” हो सकता है।
    reason: सְתָרִים के संक्षिप्त, बहुवचनात्मक पदबंध के वैकल्पिक अर्थों को बिना पाठ में ‘खाई जाने वाली’ क्रिया जोड़े दर्शाना।
lexical_decisions:
- source_word: מַיִם
  choice: पानी
  rationale: इब्रानी में यह रूप बहुवचनात्मक है, पर सामान्यतः द्रव्यवाचक संज्ञा के रूप में प्रयुक्त होता है; आधुनिक हिन्दी में ‘पानी’ स्वाभाविक है।
- source_word: גְּנוּבִים
  choice: चोरी का
  rationale: यह גנב का कर्मवाच्य कृदन्त है और चोरी से प्राप्त वस्तु को दर्शाता है; ‘चोरी का पानी’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: יִמְתָּקוּ
  choice: मीठा लगता है
  rationale: מתק का अर्थ ‘मीठा होना’ है; पानी और रोटी के स्वाद-संबंधी समानांतर बिंब में ‘मीठा लगता है’ सहज हिन्दी है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ‘रोटी’ ठोस खाद्य-बिंब को बनाए रखती है और सामान्य आधुनिक हिन्दी में ‘bread’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: סְתָרִים
  choice: छिपकर खाई गई
  rationale: बहुवचन संज्ञा סְתָרִים छिपाव या गुप्तता का भाव देती है। इब्रानी पदबंध संकुचित है; हिन्दी में रोटी के साथ इसका संभावित मुहावरेदार आशय इस प्रकार स्पष्ट होता है।
- source_word: יִנְעָם
  choice: स्वादिष्ट लगती है
  rationale: נעם का अर्थ सुखद या मनभावन होना है; भोजन के संदर्भ में ‘स्वादिष्ट लगती है’ अर्थ को स्वाभाविक रूप से व्यक्त करता है और पहली पंक्ति के समानांतर रहता है।
