  text: Leave the simple[a], and live; and walk in the way of understanding.
translation:
  language: hi
  text: नासमझ लोगों को छोड़ दो[a] और जीवित रहो; और समझ के मार्ग पर आगे बढ़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “नासमझ लोगों को छोड़ दो।” प्रसंग में इसका आशय नासमझी की दशा या नासमझों की संगति को पीछे छोड़ना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  choice: छोड़ दो
  rationale: बहुवचन आज्ञार्थक क्रिया निर्णायक रूप से त्यागने या अलग होने का आह्वान करती है; ‘छोड़ दो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: פְתָאיִם
  choice: नासमझ लोगों को
  rationale: इब्रानी में यह बहुवचन संज्ञा सीधे ‘भोले/अनुभवहीन/नासमझ लोगों’ को दर्शाती है। ‘नासमझ’ यहाँ नैतिक और बौद्धिक शिक्षा के लिए खुले, पर अभी विवेकहीन लोगों का भाव रखता है; पाठ की असामान्य प्रत्यक्ष वस्तु को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: וִחְיוּ
  choice: और जीवित रहो
  rationale: חיה का बहुवचन आज्ञार्थक रूप है। समन्वित आज्ञा को सीधे रखा गया है, न कि उसे केवल परिणामसूचक ‘ताकि जीवित रहो’ बनाया गया है।
- source_word: וְאִשְׁרוּ
  choice: और ... आगे बढ़ो
  rationale: אשר यहाँ मार्ग पर आगे जाने या सीधे बढ़ने का भाव देता है। ‘आगे बढ़ो’ हिन्दी में स्वाभाविक है और जीवन-आचरण के मार्ग का रूपक बनाए रखता है।
- source_word: בְּדֶרֶךְ
  choice: मार्ग पर
  rationale: यह शाब्दिक रास्ते के साथ-साथ जीवन-आचरण की दिशा का प्रचलित ज्ञान-साहित्यिक रूपक है।
- source_word: בִּינָה
  choice: समझ
  rationale: בינה विवेकपूर्ण समझ या परख को दर्शाता है। ‘समझ’ साधारण पाठक के लिए स्पष्ट है और नीति-साहित्य के भाव को बनाए रखता है।
