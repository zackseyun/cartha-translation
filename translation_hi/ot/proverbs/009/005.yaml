  text: Come[a], eat of my bread[b], and drink of the wine I have mixed.
translation:
  language: hi
  text: आओ,[a] मेरी रोटी खाओ और मेरा मिलाया हुआ दाखमधु पियो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाओ और मेरी रोटी खाओ।” इब्रानी क्रिया का शाब्दिक अर्थ “जाओ” है, पर इस निमंत्रण के प्रसंग में वह आह्वान के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: आओ
  rationale: क्रिया का शाब्दिक अर्थ ‘जाओ/चलो’ है, पर यहाँ बुद्धि के निमंत्रण में हिंदी का स्वाभाविक आह्वान ‘आओ’ है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לַחֲמוּ
  choice: खाओ
  rationale: यहाँ לחם II का अर्थ ‘खाना’ है; समानांतर ‘पियो’ और ‘मेरी रोटी’ इसे स्पष्ट करते हैं।
- source_word: בְלַחֲמִי
  choice: मेरी रोटी
  rationale: हिंदी में ‘मेरी रोटी खाओ’ स्वाभाविक रूप से सहभागी अर्थ व्यक्त करता है; ‘मेरी रोटी में से खाओ’ अनावश्यक रूप से बोझिल होता।
- source_word: וּשְׁתוּ
  choice: और ... पियो
  rationale: समन्वित बहुवचन आज्ञार्थ को सरलता से रखा गया है और काव्यात्मक समानांतरता बनी रहती है।
- source_word: בְּיַיִן
  choice: वह दाखमधु
  rationale: ‘दाखमधु’ יין के लिए गरिमापूर्ण और समझने योग्य शब्द है; संकेतवाचक ‘वह’ अगले संबंधवाचक उपवाक्य से स्वाभाविक रूप से जुड़ता है।
- source_word: מָסָכְתִּי
  choice: जिसे मैंने मिलाकर तैयार किया है
  rationale: यह अभिव्यक्ति मदिरा को मिलाने की विशिष्ट क्रिया और उसके भोज के लिए तैयार किए जाने—दोनों को सहज हिंदी में संप्रेषित करती है; मिश्रण की सामग्री मूल में निर्दिष्ट नहीं है।
theological_decisions:
- issue: बुद्धि के निमंत्रण में भोजन का चित्र
  choice: रोटी और दाखमधु के ठोस भोज-चित्र को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: रोटी और दाखमधु को संस्कारात्मक प्रतीक या केवल शिक्षा के रूपक के रूप में स्पष्ट कर देना।
  rationale: इब्रानी पाठ व्यक्तिरूप बुद्धि द्वारा तैयार भोज का निमंत्रण देता है। अनुवाद किसी ऐसी सांप्रदायिक या सिद्धांतगत पहचान को आरोपित नहीं करता जो पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण निमंत्रण। ‘आओ’ प्रसंगगत संबोधन को स्वाभाविक रखता है; ‘दाखमधु’ बाइबलीय काव्य-शैली के अनुकूल है। मिश्रित दाखमधु में पानी या मसाले जैसी सामग्री का उल्लेख नहीं जोड़ा गया, क्योंकि मूल पाठ उसे निर्दिष्ट नहीं करता।
