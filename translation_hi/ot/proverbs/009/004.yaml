lexical_decisions:
- source_word: מִי פֶתִי
  choice: जो भोला है
  rationale: מִי यहाँ अनिश्चित, सामान्य संबोधन प्रस्तुत करता है। פֶתִי नीतिवचन में ऐसे अनुभवहीन और आसानी से बहकाए जा सकने वाले व्यक्ति को दर्शाता है जो आवश्यक रूप से मंदबुद्धि नहीं है; ‘भोला’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָסֻר הֵנָּה
  choice: वह यहाँ मुड़ आए
  rationale: जुस्सिव रूप निमंत्रण या आग्रह व्यक्त करता है। ‘यहाँ मुड़ आए’ वक्ता के स्थान की ओर आने और मार्ग से मुड़ने—दोनों दिशात्मक भावों को बनाए रखता है।
- source_word: חֲסַר לֵב
  choice: समझ से रहित
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘हृदय से रहित’ है, पर यहाँ לֵב विवेक या समझ का केंद्र है। ‘समझ से रहित’ अर्थ को स्पष्ट रखते हुए मुहावरे को अनावश्यक शारीरिक अर्थ से बचाता है।
- source_word: אָמְרָה לּוֹ
  choice: उससे वह कहती है
  rationale: स्त्रीलिंग कर्ता को सुरक्षित रखा गया है और לּוֹ को पहले आए सामान्य एकवचन पुरुष के संदर्भ में ‘उससे’ कहा गया है। कथन आरम्भ कराने वाला रूप प्रसंग में जीवंत वर्तमान ‘कहती है’ से स्वाभाविक बनता है।
