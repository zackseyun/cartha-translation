base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/014.yaml
  text: “Bad[a], bad,” says the buyer; but when he goes away, then he boasts.
translation:
  language: hi
  text: “खराब है, खराब है,” खरीदार कहता है; पर वहाँ से चले जाने पर वह अपनी बड़ाई करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַע רַע
  choice: “खराब है, खराब है”
  rationale: दोहराव वस्तु को घटिया बताकर उसका मूल्य कम करवाने की खरीदार की कोशिश को जोरदार और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֹאמַר
  choice: कहता है
  rationale: अपूर्ण क्रिया यहाँ नीतिवचन के सामान्य, बार-बार घटने वाले वर्तमान को व्यक्त करती है।
- source_word: הַקּוֹנֶה
  choice: खरीदार
  rationale: קנה के व्यापारिक संदर्भ में यह सहज और सटीक आधुनिक हिन्दी शब्द है।
- source_word: וְאֹזֵל לוֹ
  choice: पर वहाँ से चले जाने पर
  rationale: वाव से निहित विरोध को ‘पर’ स्पष्ट करता है; אזל और लो का संयुक्त भाव खरीदार के सौदा करके वहाँ से निकल जाने का है।
- source_word: אָז
  choice: —
  rationale: हिन्दी की ‘चले जाने पर’ रचना में ‘तब’ का कालगत अर्थ स्वाभाविक रूप से समाहित है; अलग ‘तब’ रखने से वाक्य अनावश्यक रूप से बोझिल होता।
- source_word: יִתְהַלָּל
  choice: वह अपनी बड़ाई करता है
  rationale: हित्पएल रूप आत्म-प्रशंसात्मक गर्व को दर्शाता है; यह हिन्दी प्रयोग सफल सौदे पर खरीदार की शेखी को स्पष्ट रखता है।
theological_decisions: []
