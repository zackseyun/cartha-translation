base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/017.yaml
  text: Bread of deceit is sweet to a man[b][a], but afterward his mouth is filled with gravel.
translation:
  language: hi
  text: छल की रोटी मनुष्य को मीठी लगती है, पर बाद में उसका मुँह कंकड़ों से भर जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָרֵב
  choice: मीठी लगती है
  rationale: शब्द का अर्थ सुखद, रुचिकर या मीठा है; भोजन के बिंब और बाद के कटु परिणाम के विरोध को बनाए रखने के लिए ‘मीठी लगती है’ स्वाभाविक है।
- source_word: לָאִישׁ
  choice: मनुष्य को
  rationale: हिब्रू में पुल्लिंग एकवचन है, पर यहाँ नीतिवचन में प्रतिनिधिक अर्थ है; ‘मनुष्य’ उसके सामान्य मानवीय संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֶחֶם שָׁקֶר
  choice: छल की रोटी
  rationale: यह शाब्दिक संरचना ‘झूठ/छल की रोटी’ है। ‘छल की रोटी’ मूल की संक्षिप्तता और जानबूझकर खुली रखी गई संबंधगत अस्पष्टता को बचाती है—यह छल से पाई गई रोटी भी समझी जा सकती है।
- source_word: וְאַחַר
  choice: पर बाद में
  rationale: मूल में कालक्रम के साथ स्पष्ट विरोधाभासी पलटाव है; हिंदी में ‘पर बाद में’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִמָּלֵא
  choice: भर जाएगा
  rationale: निफ़अल अपूर्ण क्रिया यहाँ परिणाम अथवा भविष्य की अनिवार्य परिणति बताती है; ‘भर जाएगा’ उस भाव को स्पष्ट रखता है।
- source_word: פִיהוּ
  choice: उसका मुँह
  rationale: मूल के प्रत्यक्ष शारीरिक और स्वाद-संबंधी बिंब को सुरक्षित रखा गया है।
- source_word: חָצָץ
  choice: कंकड़ों
  rationale: शब्द छोटे पत्थरों या बजरी को दर्शाता है। मुँह में होने के संदर्भ में ‘कंकड़’ आधुनिक हिंदी में अधिक सजीव और सहज है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘छल की रोटी’ मूल हिब्रू के ठोस बिंब और उसकी संबंधगत अस्पष्टता को सुरक्षित रखता है; वाक्य को ‘छल से कमाई रोटी’ बनाकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
