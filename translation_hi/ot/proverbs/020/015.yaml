  yaml_path: translation/ot/proverbs/020/015.yaml
  text: There is gold[a], and an abundance of pearls, but lips of knowledge are a precious vessel.
translation:
  language: hi
  text: 'सोना और बहुत-से बहुमूल्य रत्न[a] तो हैं,

    पर ज्ञानपूर्ण होंठ एक बहुमूल्य वस्तु हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोती,” “मूँगे,” “माणिक,” अथवा सामान्य रूप से “बहुमूल्य रत्न”; פְּנִינִים का सटीक संदर्भ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: है / हैं
  rationale: अस्तित्वसूचक पद है। हिन्दी में संयुक्त वस्तुओं के वचन के अनुसार ‘है’ और ‘हैं’ का प्रयोग स्वाभाविक है।
- source_word: זָהָב
  choice: सोना
  rationale: मूल के सामान्य धातु-संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: וְרָב פְּנִינִים
  choice: और बहुत-से बहुमूल्य रत्न
  rationale: רָב प्रचुर संख्या बताता है। פְּנִינִים का ठीक भौतिक संदर्भ अनिश्चित है, इसलिए मुख्य पाठ में व्यापक ‘बहुमूल्य रत्न’ चुना गया है।
- source_word: וּכְלִי יְקָר
  choice: पर ... एक अनमोल पात्र
  rationale: כְלִי का ठोस बिंब ‘पात्र’ से सुरक्षित रहता है और יְקָר का मूल्यबोध ‘अनमोल’ व्यक्त करता है। आरंभिक וְ यहाँ सोने-रत्नों और ज्ञानपूर्ण वाणी के मूल्य में काव्यात्मक तुलना दिखाता है, इसलिए हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: שִׂפְתֵי דָעַת
  choice: ज्ञान से भरे होंठ
  rationale: शाब्दिक ‘ज्ञान के होंठ’ हिन्दी में अस्वाभाविक है; ‘ज्ञान से भरे होंठ’ ज्ञानयुक्त वाणी का आशय रखते हुए होंठों का काव्य-बिंब बचाता है।
