  text: אַל תֶּֽאֱהַ֣ב שֵׁ֭נָה פֶּן תִּוָּרֵ֑שׁ פְּקַ֖ח עֵינֶ֣י/ךָ שְֽׂבַֽע לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/013.yaml
  text: Do not love sleep[a], lest you become poor; open your eyes[b], and you will have your fill of bread.
translation:
  language: hi
  text: नींद से प्रेम न कर, नहीं तो तू गरीब हो जाएगा; अपनी आँखें खोल, और रोटी से तृप्त हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֶּאֱהַב
  choice: प्रेम न कर
  rationale: निषेध के साथ אָהַב की सीधी और प्रभावशाली अभिव्यक्ति; यह केवल उचित विश्राम नहीं, बल्कि नींद के प्रति आसक्ति को लक्ष्य करती है।
- source_word: שֵׁנָה
  choice: नींद
  rationale: मूल संज्ञा का स्वाभाविक और स्पष्ट आधुनिक हिन्दी समतुल्य।
- source_word: פֶּן תִּוָּרֵשׁ
  choice: नहीं तो तू गरीब हो जाएगा
  rationale: פֶּן चेतावनीपूर्ण परिणाम बताता है और यहाँ ירשׁ का निफ़अल रूप निर्धन हो जाने का अर्थ देता है; यह हिन्दी में कारण-परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְּקַח עֵינֶיךָ
  choice: अपनी आँखें खोल
  rationale: आज्ञार्थक रूप और आँखें खोलने की ठोस मूल छवि दोनों सुरक्षित हैं; प्रसंग में जागने और परिश्रमी होने का संकेत निहित रहता है।
- source_word: שְׂבַע לָחֶם
  choice: रोटी से तृप्त हो
  rationale: दोनों इब्रानी शब्दों का निकट और स्वाभाविक अनुवाद; שְׂבַע के आज्ञार्थक रूप को बनाए रखता है और उसे केवल स्पष्ट परिणामसूचक भविष्यकाल में नहीं बदलता।
