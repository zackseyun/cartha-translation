  text: תּוֹעֲבַ֣ת יְ֭הוָה אֶ֣בֶן וָ/אָ֑בֶן וּ/מֹאזְנֵ֖י מִרְמָ֣ה לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/023.yaml
  text: Unequal weights are an abomination to Yahweh[a], and deceitful scales are not good.
translation:
  language: hi
  text: 'अलग-अलग मान के बाट[a] याहवे के लिए घृणित हैं,

    और छलपूर्ण तराज़ू अच्छे नहीं हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पत्थर और पत्थर”; यह व्यापार में बेईमानी से इस्तेमाल किए जाने वाले अलग-अलग मान के बाटों का मुहावरा है।
    reason: मुहावरे का शाब्दिक रूप और उसका व्यापारिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित हैं
  rationale: यह शब्द नैतिक रूप से अत्यंत निंदनीय और घिनौनी वस्तु को दर्शाता है। ‘घृणित’ इसके प्रबल नैतिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके नाम का लिप्यंतरण किया गया है।
- source_word: אֶבֶן וָאָבֶן
  choice: दो तरह के बाट
  rationale: शाब्दिक अभिव्यक्ति ‘पत्थर और पत्थर’ व्यापार में अलग-अलग मान के बाट रखने की ओर संकेत करती है। ‘दो तरह के बाट’ उस मुहावरे का स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וּמֹאזְנֵי מִרְמָה
  choice: और छल के तराज़ू
  rationale: यह पदबंध ऐसे तराज़ुओं को दर्शाता है जिन्हें धोखा देने के लिए इस्तेमाल या बिगाड़ा गया हो। ‘छल के तराज़ू’ संक्षिप्तता और इब्रानी संबंध-रचना दोनों को बनाए रखता है।
- source_word: לֹא טוֹב
  choice: अच्छे नहीं हैं
  rationale: इब्रानी में सीधे ‘अच्छे नहीं’ कहा गया है। यही रूप रखने से कथन को अनावश्यक रूप से ‘बुरे’ या ‘अस्वीकार्य’ बनाकर तीव्र नहीं किया जाता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘बाट’ और ‘तराज़ू’ सामान्य व्यापारिक शब्द हैं। समानांतर पंक्तियाँ इब्रानी नीतिवचन की संतुलित संरचना को दर्शाती हैं।
