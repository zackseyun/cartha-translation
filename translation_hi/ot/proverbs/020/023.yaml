    reason: मुहावरे का शाब्दिक रूप और उसका व्यापारिक आशय स्पष्ट करना।
  revision_rationale: Revision clarifies that the paired ‘stones’ are weights of differing values, improves the idiomatic Hindi expression of what Yahweh finds abhorrent, and uses a more natural rendering for fraudulent scales. The restrained ‘अच्छे नहीं हैं’ preserves the Hebrew wording.
