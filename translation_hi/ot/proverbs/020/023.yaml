revisions:
- from: 'दो तरह के बाट[a] याहवे को घृणित हैं,

    और छल के तराज़ू अच्छे नहीं हैं।'
  to: 'अलग-अलग मान के बाट[a] याहवे के लिए घृणित हैं,

    और छलपूर्ण तराज़ू अच्छे नहीं हैं।'
  rationale: Revision clarifies that the paired ‘stones’ are weights of differing values, improves the idiomatic Hindi expression of what Yahweh finds abhorrent, and uses a more natural rendering for fraudulent scales. The restrained ‘अच्छे नहीं हैं’ preserves the Hebrew wording.
