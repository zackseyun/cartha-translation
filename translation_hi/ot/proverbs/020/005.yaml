  text: Counsel in a man's heart is like deep water[b][a], but a man of understanding draws it out.
translation:
  language: hi
  text: मनुष्य के हृदय की सलाह गहरे जल के समान है[a], परन्तु समझ रखने वाला मनुष्य उसे खींच निकालता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गहरे जल।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दोनों स्थानों पर पुरुषवाचक शब्द है; इस कहावत में उसका प्रयोग सामान्य रूप से मनुष्य के लिए हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: गहरे जल
  rationale: इब्रानी में शाब्दिक अर्थ ‘गहरे जल’ है। हिन्दी में ‘जल’ सामूहिक अर्थ में स्वाभाविक है और छिपी हुई गहराई के रूपक को बनाए रखता है।
- source_word: עֵצָה
  choice: सलाह
  rationale: यह शब्द सलाह, सम्मति, योजना या मन की मंशा को सूचित कर सकता है। यहाँ ‘सलाह’ सहज हिन्दी है और मन में छिपे विचार-विमर्श के भाव को पर्याप्त रूप से खुला रखती है।
- source_word: בְלֶב אִישׁ
  choice: मनुष्य के हृदय की
  rationale: ‘हृदय’ इब्रानी प्रयोग में भावना के साथ विचार, इच्छा और संकल्प का भी केंद्र है। ‘मनुष्य’ कहावत के सामान्य मानवीय संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאִישׁ תְּבוּנָה
  choice: परन्तु समझ रखने वाला मनुष्य
  rationale: וְ को दोनों पंक्तियों के अर्थगत विरोध के कारण ‘परन्तु’ किया गया है। תְּבוּנָה समझ, विवेक या परख को दर्शाता है; ‘समझ रखने वाला’ साधारण पाठक के लिए स्पष्ट है।
- source_word: יִדְלֶנָּה
  choice: उसे खींच निकालता है
  rationale: דלה कुएँ से पानी खींचने की क्रिया है। यह अनुवाद जल के रूपक और भीतर छिपी सलाह को बाहर लाने—दोनों भावों को सुरक्षित रखता है।
