  text: חַבֻּר֣וֹת פֶּ֭צַע תמריק בְּ/רָ֑ע וּ֝/מַכּ֗וֹת חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/030.yaml
  text: The bruises of a wound cleanse away evil[b][a], and blows cleanse the innermost parts of the belly.
translation:
  language: hi
  text: घाव के नीले निशान बुराई को दूर करते हैं,[a] और मार की चोटें अंतर्मन की गहराइयों को शुद्ध करती हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घाव के नीले निशान बुराई को शुद्ध कर देते हैं”; इब्रानी क्रिया में मांजने, शुद्ध करने या मलकर हटाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “पेट के कक्ष” है—व्यक्ति के सबसे गहरे भीतरी भागों के लिए एक इब्रानी अभिव्यक्ति।
    reason: cultural_note
lexical_decisions:
- source_word: חַבֻּרוֹת פֶּצַע
  choice: घाव के नीले निशान
  rationale: यह पदबंध प्रहार से पड़े नीले निशानों या सूजनों को दर्शाता है। यह चयन दोनों इब्रानी संज्ञाओं की ठोस शारीरिक छवि बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תמריק
  choice: मांजकर दूर करते हैं / शुद्ध करती हैं
  rationale: המרק के हिफ़ील रूप में मांजने, साफ़ करने या मलकर हटाने का भाव है। पहले खंड में 'मांजकर दूर' बुराई के हटाए जाने को स्पष्ट करता है; समानांतर दूसरे खंड में निहित क्रिया को 'शुद्ध करती हैं' से पूरा किया गया है।
- source_word: בְּרָע
  choice: बुराई को
  rationale: यहाँ רע को उस नैतिक बुराई के रूप में समझा गया है जिसे कठोर सुधार हटाता है। 'बुराई' संक्षिप्त, सहज और नीतिवचन के नैतिक स्वर के अनुरूप है।
- source_word: וּמַכּוֹת
  choice: और मार की चोटें
  rationale: מַכּוֹת प्रहारों या उनसे लगी चोटों को सूचित करता है। 'मार की चोटें' ठोस चित्र को बनाए रखती हैं और पहले खंड के निशानों के साथ स्वाभाविक समानांतर बनाती हैं।
- source_word: חַדְרֵי בָטֶן
  choice: अंतर्मन की गहराइयों तक
  rationale: शाब्दिक अर्थ 'पेट के कक्ष' है, जो इब्रानी मुहावरे में व्यक्ति के सबसे भीतरी भागों को दर्शाता है। हिन्दी में शाब्दिक 'पेट के कक्ष' अस्पष्ट और अस्वाभाविक होगा; अर्थ-संगत रूप से 'अंतर्मन की गहराइयाँ' वही आंतरिकता व्यक्त करता है।
theological_decisions:
- issue: पीड़ादायक अनुशासन की छवि
  choice: पद को इस सामान्य ज्ञान-वचन के रूप में रखा गया है कि कठोर और पीड़ादायक सुधार नैतिक बुराई को दूर करके व्यक्ति के अंतर्मन तक प्रभाव डाल सकता है।
  alternative: इसे हर प्रकार के दुःख के स्वतः शुद्ध करने वाले प्रभाव, या शारीरिक दंड के सार्वभौमिक समर्थन, के रूप में पढ़ा जा सकता है।
  rationale: घाव, निशान और मार की समानांतर छवियाँ सुधारात्मक अनुशासन की ओर संकेत करती हैं, पर अनुवाद न तो हर दुःख को शुद्धिकारक घोषित करता है, न हिंसक दंड का व्यापक सिद्धांत गढ़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ठोस शारीरिक बिंब पहले खंड में संरक्षित है, जबकि कठिन इब्रानी देह-मुहावरे को मुख्य पाठ में स्वाभाविक अर्थ के साथ और पादटिप्पणी में शाब्दिक रूप के साथ प्रस्तुत किया गया है।
