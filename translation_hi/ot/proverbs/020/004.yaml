  text: מֵ֭/חֹרֶף עָצֵ֣ל לֹא יַחֲרֹ֑שׁ ישאל בַּ/קָּצִ֣יר וָ/אָֽיִן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/004.yaml
  text: Because of winter[a], the lazy man does not plow; at harvest he seeks[b], and there is nothing.
translation:
  language: hi
  text: 'सर्दी के कारण[a] आलसी हल नहीं चलाता;

    कटनी के समय वह ढूँढ़ता है[b], पर कुछ नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सर्दी में आलसी हल नहीं चलाता।” इब्रानी उपसर्ग מִן का अर्थ समयसूचक (“सर्दी में”) या कारणसूचक (“सर्दी के कारण”) हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कटनी के समय वह माँगता है।” इब्रानी क्रिया का अर्थ “माँगना” हो सकता है; यहाँ संदर्भ में उपज ढूँढ़ना या माँगना अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵחֹרֶף
  choice: सर्दी के कारण
  rationale: 'מִן उपसर्ग यहाँ कारणसूचक समझा जा सकता है: सर्दी आलसी व्यक्ति के लिए हल न चलाने का कारण या बहाना बनती है। समयसूचक अर्थ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।'
- source_word: עָצֵל
  choice: आलसी
  rationale: यह नीतिवचन-साहित्य में आदतन काम से जी चुराने वाले व्यक्ति के लिए प्रचलित शब्द है। हिन्दी में संज्ञा के रूप में ‘आलसी’ स्वाभाविक, संक्षिप्त और प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखता है।
- source_word: לֹא יַחֲרֹשׁ
  choice: हल नहीं चलाता
  rationale: חרשׁ का यहाँ विशिष्ट कृषि-अर्थ खेत जोतना है। ‘हल चलाना’ सामान्य आधुनिक हिन्दी में स्पष्ट है और वर्तमान काल नीतिवचन के सार्वकालिक भाव को व्यक्त करता है।
- source_word: ישאל
  choice: वह ढूँढ़ता है
  rationale: שׁאל का मूल अर्थ ‘माँगना/पूछना’ है, किंतु कर्म के लोप और ‘कुछ नहीं’ वाले परिणाम के संदर्भ में उपज की तलाश करना अभिप्रेत हो सकता है। मुख्य पाठ में स्वाभाविक संदर्भगत अर्थ रखा गया है और मूल अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: בַּקָּצִיר
  choice: कटनी के समय
  rationale: यह वाक्यांश उस समय को बताता है जब पहले की निष्क्रियता का परिणाम सामने आता है। ‘कटनी’ सामान्य हिन्दी में फसल काटने के समय का सटीक कृषि-शब्द है।
- source_word: וָאָיִן
  choice: पर कुछ नहीं मिलता
  rationale: אָיִן अस्तित्व का निषेध है और किसी वस्तु को स्पष्ट नहीं करता। हिन्दी में ‘कुछ नहीं मिलता’ खोज के परिणाम को स्वाभाविक ढंग से बताता है, जबकि निहित वस्तु को अनिर्दिष्ट ही रखता है। ‘पर’ विरोधी परिणाम को स्पष्ट करता है।
