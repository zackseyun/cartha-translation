  yaml_path: translation/ot/proverbs/020/003.yaml
  text: It is an honor for a man to keep away from strife[a], but every fool bursts out in quarrel.
translation:
  language: hi
  text: 'झगड़े से दूर रहना मनुष्य के लिए सम्मान की बात है,

    पर हर मूर्ख झगड़े में कूद पड़ता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जिस इब्रानी क्रिया का अनुवाद “कूद पड़ता है” किया गया है, वह दुर्लभ है और उसका अर्थ निश्चित नहीं है। इसका अर्थ “झगड़े में पड़ जाता है” या, अधिक शाब्दिक रूप से, आक्रामक ढंग से “अपने आपको प्रकट करता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּבוֹד
  choice: सम्मान की बात
  rationale: नीतिवचन के संदर्भ में यह सामाजिक आदर और सम्माननीय आचरण को दर्शाता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: לָאִישׁ
  choice: मनुष्य के लिए
  rationale: אִישׁ व्याकरणतः पुल्लिंग एकवचन है, पर यहाँ नीतिवचन में प्रतिनिधिक सामान्य अर्थ रखता है; ‘मनुष्य’ उस रूप और व्यापक आशय दोनों को बनाए रखता है।
- source_word: שֶׁבֶת מֵרִיב
  choice: झगड़े से दूर रहना
  rationale: इस रचना में क्रिया का भाव किसी विवाद से अलग रहने या उसमें न पड़ने का है; ‘दूर रहना’ आधुनिक हिंदी में सहज है।
- source_word: רִיב
  choice: झगड़ा
  rationale: यह विवाद, कलह या झगड़े का बोध करा सकता है; ‘झगड़ा’ सामान्य पाठक के लिए सीधा और नीतिवचन के संदर्भ में उपयुक्त है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह बुद्धि-साहित्य का मानक नैतिक-चरित्रसूचक शब्द है, केवल बौद्धिक अक्षमता का संकेत नहीं।
- source_word: יִתְגַּלָּע
  choice: झगड़े में फूट पड़ता है
  rationale: दुर्लभ और अनिश्चित हित्पएल रूप को प्रसंग के विरोध के आधार पर झगड़े में उग्रता से फूट पड़ने के रूप में व्यक्त किया गया है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
