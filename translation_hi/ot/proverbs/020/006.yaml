  text: Many a man proclaims his own loyalty[b][a], but who can find a faithful man?
translation:
  language: hi
  text: बहुत-से लोग अपनी-अपनी निष्ठा का दावा करते हैं,[a] पर विश्वासयोग्य व्यक्ति कौन ढूँढ़ पाएगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से लोग अपने-अपने अटल प्रेम का दावा करते हैं।” इब्रानी חֶסֶד का अर्थ “अटल प्रेम,” “निष्ठा” या “भलाई” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “भरोसेमंद व्यक्ति।” इब्रानी אֱמוּנִים निष्ठा या विश्वसनीयता का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב אָדָם
  choice: बहुत-से लोग
  rationale: यह पदबंध ‘बहुत/अनेक’ और ‘मनुष्य’ को मिलाकर सामान्य रूप से अनेक व्यक्तियों की बात करता है। आधुनिक हिन्दी में ‘बहुत-से लोग’ इसका स्वाभाविक और समावेशी रूप है।
- source_word: יִקְרָא
  choice: दावा करते हैं
  rationale: קרא का मूल अर्थ ‘पुकारना/घोषित करना’ है, पर यहाँ व्यक्ति द्वारा अपने ही गुण को जताने का भाव है। ‘दावा करते हैं’ इस आत्म-प्रशंसा और कथन के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ חַסְדּוֹ
  choice: अपनी-अपनी निष्ठा
  rationale: חֶסֶד के अर्थ-क्षेत्र में अटल प्रेम, निष्ठा और कृपा सम्मिलित हैं। इस नीति-वचन में मनुष्य के अपने बताए हुए सद्गुण या वफादारी के संदर्भ में ‘निष्ठा’ उपयुक्त है; ‘अपनी-अपनी’ एकवचन संबंधसूचक प्रत्यय के वितरणात्मक भाव को स्पष्ट करता है।
- source_word: וְאִישׁ אֱמוּנִים
  choice: पर विश्वासयोग्य व्यक्ति
  rationale: אֱמוּנִים यहाँ विश्वसनीयता, स्थिर निष्ठा और भरोसेमंद चरित्र को दर्शाता है। ‘विश्वासयोग्य व्यक्ति’ आत्म-घोषित निष्ठा और वास्तविक भरोसेमंदी के बीच विरोध बनाए रखता है।
- source_word: מִי יִמְצָא
  choice: कौन पा सकता है?
  rationale: प्रश्नवाचक शब्द और अपूर्ण क्रिया मिलकर ऐसे व्यक्ति की दुर्लभता प्रकट करते हैं। हिन्दी का ‘कौन पा सकता है?’ इस आलंकारिक प्रश्न को सहज रूप से व्यक्त करता है।
