  text: לְֽקַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נכרים חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/016.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold him in pledge for foreigners.
translation:
  language: hi
  text: उसका वस्त्र ले लो[a], क्योंकि उसने किसी अजनबी के लिए ज़मानत दी है[b]; और परदेशियों के लिए उससे बंधक ले लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अंतिम खंड बहुत संक्षिप्त है। इसका अर्थ यह भी समझा जा सकता है: “परदेशियों के लिए उसका वस्त्र बंधक रखो।” अर्थात् अंतिम क्रिया का संबंध उससे लिए जाने वाले बंधक के बजाय उसके वस्त्र से भी जोड़ा जा सकता है।'
    reason: alternative_reading
  - marker: b
    text: “ज़मानत देना” अर्थात किसी दूसरे के ऋण या दायित्व को चुकाने की जिम्मेदारी अपने ऊपर लेना।
    reason: cultural_note
lexical_decisions:
- source_word: לְקַח
  choice: ले लो
  rationale: לקח का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘ले लो’ सीधी आज्ञा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना ‘छीन लो’ जैसी अनावश्यक कठोरता जोड़े।
- source_word: בִּגְדוֹ
  choice: उसका वस्त्र
  rationale: בגד सामान्य रूप से पहनने के कपड़े को दर्शाता है; ‘वस्त्र’ अर्थ को ‘चोगा’ या ‘बागा’ से अधिक व्यापक रखता है।
- source_word: עָרַב
  choice: ज़मानत दी है
  rationale: यहाँ ערב किसी दूसरे के ऋण या दायित्व का जामिन बनने को दर्शाता है। ‘ज़मानत दी है’ आधुनिक हिन्दी में इस कानूनी-वित्तीय भाव को स्पष्ट करता है।
- source_word: זָר
  choice: किसी अजनबी
  rationale: זר अपने सामान्य सामाजिक दायरे से बाहर के व्यक्ति को सूचित करता है। ‘अजनबी’ इस दूरी को सहज हिन्दी में बनाए रखता है।
- source_word: נכרים
  choice: परदेशियों
  rationale: दिए गए WLC पाठ में बहुवचन रूप है, जिसका अर्थ बाहरी या विदेशी लोग है। ‘परदेशियों’ से पहले खंड के ‘अजनबी’ से शब्दगत भेद भी बना रहता है।
- source_word: חַבְלֵהוּ
  choice: उससे बंधक ले लो
  rationale: חבל का यह रूप ऋण-सुरक्षा के लिए बंधक लेने की आज्ञा देता है। प्रत्यय को व्यक्ति की ओर संकेत करने वाला मानकर ‘उससे’ रखा गया है; फिर भी इब्रानी वाक्य अत्यंत संक्षिप्त है और वस्त्र को बंधक मानने की संभावना पादटिप्पणी में सुरक्षित है।
