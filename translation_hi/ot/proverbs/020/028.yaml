  yaml_path: translation/ot/proverbs/020/028.yaml
  text: Steadfast love and faithfulness preserve a king[c][b][a], and by steadfast love his throne is upheld.
translation:
  language: hi
  text: अटल प्रेम और विश्वासयोग्यता राजा की रक्षा करते हैं,[a][b][c] और अटल प्रेम से उसका सिंहासन स्थिर रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विश्वासयोग्यता” के लिए “सच्चाई” भी संभव है; यहाँ यह शब्द अटल प्रेम के साथ भरोसेमंदी और निष्ठा पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “रक्षा करते हैं” का अनुवाद “सुरक्षित रखते हैं” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: दोनों उपवाक्यों में “अटल प्रेम” एक ही इब्रानी शब्द חֶסֶד का अनुवाद है; इस प्रकार मूल की पुनरावृत्ति सुरक्षित रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह पद में निष्ठापूर्ण, स्थायी और हितकारी प्रेम को व्यक्त करता है; दोनों उपवाक्यों में इसी शब्द की पुनरावृत्ति बनाए रखी गई है।
- source_word: אֱמֶת
  choice: विश्वासयोग्यता
  rationale: חֶסֶד के साथ यह अमूर्त ‘सत्य’ से अधिक भरोसेमंद और निष्ठावान आचरण पर बल देता है।
- source_word: יִצְּרוּ
  choice: रक्षा करते हैं
  rationale: נצר का मूल भाव पहरा देना, सुरक्षित रखना या रक्षा करना है; बहुवचन क्रिया दोनों गुणों को कर्ता बताती है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: इब्रानी में निश्चित उपपद नहीं है और सूक्ति सामान्य सिद्धांत कहती है; हिंदी में बिना ‘एक’ के ‘राजा’ स्वाभाविक रूप से सामान्य अर्थ दे सकता है।
- source_word: וְסָעַד
  choice: स्थिर रहता है
  rationale: סעד का भाव सहारा देने और संभाले रखने का है; सिंहासन के रूपक के साथ यह स्वाभाविक हिंदी में शासन के टिके रहने को व्यक्त करता है।
- source_word: בַּחֶסֶד
  choice: अटल प्रेम से
  rationale: בְּ यहाँ साधन का संकेत देता है—अटल प्रेम वह माध्यम है जिससे सिंहासन संभला रहता है।
- source_word: כִּסְאוֹ
  choice: उसका सिंहासन
  rationale: तीसरे पुरुष एकवचन प्रत्यय और सिंहासन की ठोस राजकीय छवि दोनों सुरक्षित हैं।
