  text: נַ֭חֲלָה מבחלת בָּ/רִאשֹׁנָ֑ה וְ֝/אַחֲרִיתָ֗/הּ לֹ֣א תְבֹרָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/021.yaml
  text: An inheritance gained hastily at first will not be blessed in the end[a].
translation:
  language: hi
  text: जो विरासत आरम्भ में जल्दी में हासिल की जाती है, अन्त में उस पर आशीष नहीं होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विरासत आरम्भ में बहुत जल्दी प्राप्त की जाती है।” हिब्रू शब्द शीघ्रता, समय से पहले प्राप्ति, या लोभभरी उतावली पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह संज्ञा विरासत में मिली सम्पत्ति या अधिकार को दर्शाती है; आधुनिक मानक हिन्दी में ‘विरासत’ स्वाभाविक और व्यापक समतुल्य है।
- source_word: מבחלת
  choice: उतावली से पाई जाती है
  rationale: दुर्लभ हिब्रू रूप शीघ्रता, समय से पहले पाने या लोभपूर्ण जल्दबाज़ी का संकेत दे सकता है। ‘उतावली से’ गति के साथ अनुचित अधीरता का भाव भी रखता है, जबकि अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: בָּרִאשֹׁנָה
  choice: आरम्भ में
  rationale: यह समयसूचक पद विरासत पाने के आरम्भिक चरण को बताता है और ‘अन्त में’ के साथ मूल का स्पष्ट विरोध बनाए रखता है।
- source_word: וְאַחֲרִיתָהּ
  choice: अन्त में
  rationale: शाब्दिक अर्थ ‘उसका अन्त/अन्तिम परिणाम’ है; ‘अन्त में’ हिन्दी में स्वाभाविक रूप से आखिरी नतीजे को व्यक्त करता है।
- source_word: לֹא תְבֹרָךְ
  choice: आशीषित न होगी
  rationale: ברך के निष्क्रिय रूप को सीधे बनाए रखते हुए यह केवल भौतिक समृद्धि तक अर्थ को सीमित नहीं करता और आशीष के व्यापक धार्मिक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: नीतिवचन की चेतावनी का स्वरूप
  choice: जल्दबाज़ी से प्राप्त विरासत अपने अन्तिम परिणाम में आशीषित नहीं होगी; न्याय की सटीक प्रक्रिया अनिर्दिष्ट रहती है।
  alternative: इसे केवल लोभ पर प्रत्यक्ष ईश्वरीय दण्ड या केवल अधीरता के स्वाभाविक व्यावहारिक परिणाम के रूप में समझना।
  rationale: मूल का ‘आशीषित न होगी’ नैतिक और धार्मिक विस्तार बनाए रखता है तथा कथन को न तो स्पष्ट दैवी दण्ड तक और न केवल सांसारिक परिणाम तक सीमित करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। ‘आरम्भ’ और ‘अन्त’ मूल के समयगत विरोध को बनाए रखते हैं; पादटिप्पणी दुर्लभ हिब्रू पद की वास्तविक अर्थगत अनिश्चितता बताती है।
