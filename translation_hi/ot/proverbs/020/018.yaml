  text: Plans are established by counsel[a]; wage war with strategy.
translation:
  language: hi
  text: योजनाएँ परामर्श से सुदृढ़ होती हैं; और कुशल रणनीतियों[a] से युद्ध कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुशल मार्गदर्शन”; इब्रानी शब्द में कुशल संचालन या दिशा देने का भाव है और मूलतः नाव को दिशा देने की छवि से जुड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲשָׁבוֹת
  choice: योजनाएँ
  rationale: यहाँ बहुवचन संज्ञा केवल मन के विचारों के बजाय सोचे-समझे कार्य-मार्गों को दर्शाती है; दूसरे खंड के युद्ध-संदर्भ में ‘योजनाएँ’ स्वाभाविक है।
- source_word: בְּעֵצָה
  choice: परामर्श से
  rationale: 'בְּ यहाँ साधन का बोध कराता है: योजनाएँ परामर्श के द्वारा दृढ़ होती हैं। ‘परामर्श’ ज्ञान-साहित्य के गरिमापूर्ण भाव को बनाए रखता है।'
- source_word: תִכּוֹן
  choice: दृढ़ होती हैं
  rationale: כון के निफ़अल रूप का अर्थ ‘स्थिर/दृढ़ किया जाना’ है। इब्रानी में क्रिया स्त्रीलिंग एकवचन है, पर बहुवचन विषय सामूहिक भाव में है; स्वाभाविक हिन्दी में बहुवचन क्रिया उचित है।
- source_word: וּבְתַחְבֻּלוֹת
  choice: और कुशल रणनीति से
  rationale: תַּחְבֻּלוֹת में कुशल संचालन या दिशा देने का भाव है और युद्ध-संदर्भ में योजनाबद्ध रणनीति को व्यक्त करता है। ‘कुशल’ शब्द विवेकपूर्ण संचालन का व्यापक भाव बनाए रखता है।
- source_word: עֲשֵׂה
  choice: कर
  rationale: עשה और מִלְחָמָה का संयुक्त प्रयोग ‘युद्ध करना’ अर्थ देता है। हिन्दी में ‘युद्ध कर’ सीधा और स्वाभाविक आज्ञार्थ है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: संज्ञा सामान्य रूप से युद्ध या युद्ध-कार्य को दर्शाती है; ‘युद्ध’ इसका सीधा और गरिमापूर्ण हिन्दी रूप है।
