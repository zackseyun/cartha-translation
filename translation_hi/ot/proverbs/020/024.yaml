id: PRO.20.24
reference: Proverbs 20:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מֵ/יהוָ֥ה מִצְעֲדֵי גָ֑בֶר וְ֝/אָדָ֗ם מַה יָּבִ֥ין דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/024.yaml
  text: A man's steps are from Yahweh[b][a]; how then can a man understand his way?
translation:
  language: hi
  text: मनुष्य के कदम याहवे की ओर से होते हैं[a]; फिर मनुष्य[b] अपने मार्ग को कैसे समझ सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘याहवे की ओर से’ स्रोत को सूचित करता है: मनुष्य के जीवन-क्रम के कदम याहवे से आते हैं अथवा उसके द्वारा व्यवस्थित होते हैं।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दोनों खंडों के लिए पुल्लिंग एकवचन शब्द आए हैं, पर यहाँ उनका प्रयोग सामान्य रूप से मनुष्य के लिए किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵ/יהוָה
  choice: याहवे की ओर से
  rationale: מִן स्रोत या उद्गम बताता है। ‘की ओर से’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘याहवे’ मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को दर्शाता है।
- source_word: מִצְעֲדֵי
  choice: कदम
  rationale: यह संज्ञा कदमों अथवा जीवन-यात्रा की गतिविधियों को सूचित करती है। ‘कदम’ मूल रूपक को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: גָבֶר
  choice: मनुष्य
  rationale: गָבֶר का मूल अर्थ पुरुष है, पर इस नीतिवचन में वह प्रतिनिधिक, सामान्य मानव-संदर्भ में प्रयुक्त है। ‘मनुष्य’ हिन्दी में इस व्यापक आशय को स्वाभाविक रूप से व्यक्त करता है; लिंग-सूचना पादटिप्पणी में दी गई है।
- source_word: וְאָדָם
  choice: फिर मनुष्य
  rationale: אָדָם यहाँ सामान्य मानव को दर्शाता है। וְ को केवल ‘और’ कहने के बजाय ‘फिर’ से व्यक्त करने पर दोनों खंडों का निष्कर्षात्मक संबंध स्पष्ट और स्वाभाविक रहता है।
- source_word: מַה יָּבִין
  choice: कैसे समझ सकता है?
  rationale: इस प्रश्नवाचक रचना में מַה मानवीय समझ की सीमा बताने वाला आलंकारिक प्रश्न बनाता है। ‘कैसे ... समझ सकता है?’ हिन्दी में उसी बल को व्यक्त करता है।
- source_word: דַּרְכּוֹ
  choice: अपने मार्ग को
  rationale: דֶּרֶךְ का अर्थ मार्ग या जीवन का रास्ता हो सकता है। ‘अपने मार्ग’ कदमों के रूपक और जीवन-क्रम, दोनों को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: मानवीय कदमों का याहवे ‘की ओर से’ होना
  choice: स्रोत अथवा व्यवस्था का अर्थ खुला रखा गया
  alternative: याहवे हर कदम को निर्धारित करता है
  rationale: מִן स्पष्टतः स्रोत बताता है, पर पद स्वयं इस संबंध की दार्शनिक या नियतिवादी सीमा नहीं समझाता। इसलिए मुख्य पाठ मूल कथन को रखता है और पादटिप्पणी संभावित आशय बताती है।
- issue: גבר और אדם के पुल्लिंग एकवचन रूपों का सामान्य मानव-संदर्भ
  choice: मुख्य पाठ में ‘मनुष्य’, पादटिप्पणी में व्याकरणिक सूचना
  alternative: पुरुष ... पुरुष
  rationale: दोनों शब्द पुल्लिंग एकवचन हैं, किंतु नीतिवचन का कथन सामान्य मानव-अनुभव पर लागू होता है। ‘मनुष्य’ आधुनिक हिन्दी में न तो आशय को केवल पुरुषों तक सीमित करता है, न मूल की लिंग-सूचना को छिपाता है, क्योंकि वह पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कदम’ और ‘मार्ग’ के समानांतर रूपक को सुरक्षित रखा गया है। अर्धविराम दोनों काव्यात्मक खंडों के निकट संबंध और दूसरे खंड के निष्कर्षात्मक प्रश्न को स्पष्ट करता है।
