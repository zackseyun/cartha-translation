id: PRO.20.22
reference: Proverbs 20:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תֹּאמַ֥ר אֲשַׁלְּמָה רָ֑ע קַוֵּ֥ה לַֽ֝/יהוָ֗ה וְ/יֹ֣שַֽׁע לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/022.yaml
  text: Do not say[a], “I will repay evil”; wait for Yahweh[c][b], and he will save you.
translation:
  language: hi
  text: यह मत कहो[a], “मैं बुराई का बदला चुकाऊँगा।” यहोवा की बाट जोहते रहो[b], और वह तुम्हें बचाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं बुराई का बदला लूँगा” अथवा “मैं किए गए अन्याय का बदला चुकाऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: “बाट जोहने” में यहोवा पर आशा रखकर अपेक्षा से प्रतीक्षा करने का भाव भी है।
    reason: lexical_alternative
  - marker: c
    text: या “वह तुम्हें छुड़ाएगा”; प्रसंग में इसका भाव “वह तुम्हारा पक्ष सही ठहराएगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: यह मत कहो
  rationale: निषेधसूचक אַל और क्रिया אָמַר के सीधे अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשַׁלְּמָה רָע
  choice: मैं बुराई का बदला चुकाऊँगा
  rationale: पिएल रूप אֲשַׁלְּמָה यहाँ प्रतिशोधात्मक प्रत्युत्तर दर्शाता है; ‘बदला चुकाना’ हिन्दी में स्वाभाविक है और רָע की नैतिक गंभीरता को ‘बुराई’ से बनाए रखता है।
- source_word: קַוֵּה
  choice: बाट जोहते रहो
  rationale: קוה में प्रतीक्षा के साथ आशापूर्ण अपेक्षा का भाव है; ‘बाट जोहना’ इस सक्रिय, आशाभरी प्रतीक्षा को संक्षेप में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: इब्रानी पाठ में व्यक्तिगत ईश्वरीय नाम יהוה है; ‘यहोवा’ हिन्दी में उसका प्रचलित प्रतिलेखन है और उसे सामान्य उपाधि में नहीं बदलता।
- source_word: וְיֹשַׁע לָךְ
  choice: और वह तुम्हें बचाएगा
  rationale: ישׁע का हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है। ‘बचाएगा’ व्यापक अर्थ रखता है और उद्धार के तरीके को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है और मूल में नाम की उपस्थिति को स्पष्ट रखता है; ‘याहवे’ ध्वन्यात्मक विकल्प है।
- issue: וְיֹשַׁע לָךְ में उद्धार का दायरा
  choice: वह तुम्हें बचाएगा
  alternative: वह तुम्हें छुड़ाएगा / तुम्हारा न्याय करेगा
  rationale: क्रिया ישׁע बचाव, छुटकारे या विजय-संबंधी सहायता को समेट सकती है। मुख्य पाठ में ‘बचाएगा’ इस विस्तार को खुला रखता है; पादटिप्पणी अन्य संभावित रंगतें बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाट जोहते रहो’ ज्ञान-साहित्य के काव्यात्मक स्वर को बनाए रखते हुए आशापूर्ण प्रतीक्षा व्यक्त करता है। संबोधन एकवचन है, इसलिए ‘तुम’ और ‘तुम्हें’ प्रयुक्त हुए हैं।
