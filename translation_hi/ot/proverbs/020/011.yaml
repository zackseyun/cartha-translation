  text: Even a youth makes himself known by his deeds[a], whether his work is pure and upright.
translation:
  language: hi
  text: बालक भी अपने कामों से अपना परिचय देता है[a], चाहे उसका आचरण शुद्ध और सीधा हो या न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बालक भी अपने कामों से पहचाना जाता है, चाहे उसका आचरण शुद्ध और सीधा हो या न हो।”
    reason: יִתְנַכֶּר को आत्मवाचक रूप में ‘अपना परिचय देता है’ अथवा परिणामसूचक/निष्क्रिय भाव में ‘पहचाना जाता है’ समझा जा सकता है।
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यहाँ यह शब्द इस बात पर बल देता है कि कम उम्र का बालक भी अपने आचरण से पहचाना जा सकता है; हिन्दी में ‘भी’ इस विस्तार और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּמַעֲלָלָיו
  choice: अपने कामों से
  rationale: מַעֲלָלָיו व्यक्ति के नैतिक अर्थ रखने वाले कामों या कार्यों को दर्शाता है। ‘अपने कामों से’ साधन-सूचक בְּ को भी स्पष्ट रखता है।
- source_word: יִתְנַכֶּר
  choice: अपनी पहचान करा देता है
  rationale: हित्पएल रूप यहाँ अपने बाहरी आचरण से स्वयं को प्रकट या ज्ञात करने का भाव दे सकता है। यह अनुवाद उस आत्मवाचक छाया को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: נָעַר
  choice: बालक
  rationale: נַעַר लड़के या कम उम्र के व्यक्ति के लिए व्यापक शब्द है। ‘बालक’ नीतिवचन के सामान्य कथन के अनुकूल, संक्षिप्त और गरिमापूर्ण है।
- source_word: זַךְ
  choice: शुद्ध
  rationale: זַךְ का अर्थ शुद्ध, स्वच्छ या निर्दोष है; यहाँ यह आचरण के नैतिक गुण को व्यक्त करता है।
- source_word: יָשָׁר
  choice: सीधा
  rationale: יָשָׁר नैतिक सीधेपन और उचित होने का बोध देता है। ‘सीधा’ मूल रूपक और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: פָּעֳלוֹ
  choice: उसका आचरण
  rationale: פֹּעַל काम, कार्य या की गई गतिविधि को दर्शाता है। इस संदर्भ में ‘आचरण’ पूरे व्यवहार के नैतिक मूल्यांकन को स्वाभाविक हिन्दी में व्यक्त करता है और पहले आए ‘कामों’ की अनावश्यक पुनरावृत्ति से बचाता है।
