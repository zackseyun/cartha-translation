source:
  edition: WLC
  text: תִּפְאֶ֣רֶת בַּחוּרִ֣ים כֹּחָ֑/ם וַ/הֲדַ֖ר זְקֵנִ֣ים שֵׂיבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/029.yaml
  text: The glory of young men is their strength[a], and the splendor of old men is gray hair.
translation:
  language: hi
  text: जवानों का गौरव उनका बल है,[a] और बूढ़ों की शोभा उनके पके बाल हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवानों की शोभा उनका बल है, और बूढ़ों का सम्मान उनके पके बाल हैं।”
    reason: תִּפְאֶרֶת और הֲדַר दोनों के अर्थ-क्षेत्र में शोभा तथा सम्मान के भाव आते हैं; यह विकल्प उस शाब्दिक अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: תִּפְאֶרֶת
  choice: गौरव
  rationale: यह शब्द सम्मान, शोभा और गर्व का कारण होने का भाव व्यक्त करता है। यहाँ ‘गौरव’ युवावस्था के बल को सम्मानजनक विशेषता के रूप में प्रस्तुत करता है और दूसरे चरण के समानांतर है।
- source_word: בַּחוּרִים
  choice: जवानों
  rationale: इब्रानी शब्द विशेष रूप से युवा पुरुषों को दर्शाता है। ‘जवानों’ आधुनिक हिन्दी में स्वाभाविक है और आयु-आधारित विरोध को स्पष्ट रखता है।
- source_word: כֹּחָם
  choice: उनका बल
  rationale: यहाँ כֹּחַ युवावस्था की शारीरिक सामर्थ्य और स्फूर्ति को सूचित करता है। ‘बल’ संक्षिप्त, सीधा और नीतिवचन की काव्यात्मक शैली के अनुकूल है।
- source_word: הֲדַר
  choice: शोभा
  rationale: इस शब्द में शोभा, सम्मान और वैभव के परस्पर जुड़े भाव हैं। ‘शोभा’ पके बालों की दृश्य छवि के साथ स्वाभाविक बैठता है, जबकि सम्मान का सकारात्मक भाव भी बनाए रखता है।
- source_word: זְקֵנִים
  choice: बूढ़ों
  rationale: संदर्भ किसी पदधारी प्राचीन या अगुवे का नहीं, बल्कि अधिक आयु वाले पुरुषों का है। इसलिए ‘बूढ़ों’ आयु-आधारित समानांतरता को सीधे व्यक्त करता है।
- source_word: שֵׂיבָה
  choice: पके बाल
  rationale: यह संज्ञा सफेद या धूसर बालों और उनसे संकेतित वृद्धावस्था को दर्शाती है। ‘पके बाल’ हिन्दी में स्वाभाविक और सम्मानपूर्ण अभिव्यक्ति है तथा मूल की ठोस दृश्य छवि बनाए रखती है।
