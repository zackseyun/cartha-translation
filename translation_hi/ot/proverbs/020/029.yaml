  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सुलभ समानांतर शैली रखी गई है। ‘जवानों’ और ‘बूढ़ों’ से मूल के पुरुषवाचक तथा आयु-आधारित विरोध को सुरक्षित रखा गया है।
