source:
  edition: WLC
  text: מוֹקֵ֣שׁ אָ֭דָם יָ֣לַע קֹ֑דֶשׁ וְ/אַחַ֖ר נְדָרִ֣ים לְ/בַקֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/025.yaml
  text: It is a snare for a man to rashly dedicate something as holy, and only afterward to consider his vows.
translation:
  language: hi
  text: किसी वस्तु को उतावली में पवित्र ठहरा देना मनुष्य के लिए फंदा है[a], और मन्नतें मान लेने के बाद ही उनकी जाँच-पड़ताल करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पदबंध का अर्थ अनिश्चित है; इसका अनुवाद यह भी हो सकता है: “उतावली में ‘यह पवित्र है’ कह देना मनुष्य के लिए फंदा है।”'
    reason: יָלַע קֹדֶשׁ एक कठिन और असामान्य पदबंध है; पादटिप्पणी समर्पण और उतावले उच्चारण—दोनों संभावित समझों को बनाए रखती है।
lexical_decisions:
- source_word: מוֹקֵשׁ
  choice: फंदा
  rationale: यह शब्द ऐसे जाल या फंदे को दर्शाता है जिसमें व्यक्ति अपने ही अविवेकी काम के कारण फँस जाता है।
- source_word: יָלַע קֹדֶשׁ
  choice: किसी वस्तु को उतावली में पवित्र ठहरा देना
  rationale: इब्रानी पदबंध कठिन और संक्षिप्त है। संदर्भ में इसका आशय किसी वस्तु को बिना सोचे परमेश्वर के लिए पवित्र घोषित या समर्पित कर देने से है; ‘उतावली में’ उस अविवेकी जल्दबाज़ी को स्पष्ट करता है जिसे अगली पंक्ति मन्नत के बाद विचार करने के रूप में दिखाती है।
- source_word: נְדָרִים
  choice: मन्नतें
  rationale: यह परमेश्वर से की गई गंभीर प्रतिज्ञाओं के लिए प्रचलित और स्वाभाविक हिन्दी शब्द है।
- source_word: לְבַקֵּר
  choice: विचार करना
  rationale: यहाँ अर्थ मन्नतों को मान लेने के बाद उनकी जाँच-पड़ताल या उनके परिणामों पर सोचने का है।
theological_decisions:
- issue: ‘पवित्र’ ठहराने और मन्नत मानने का संबंध
  choice: पहली पंक्ति में किसी वस्तु को पवित्र ठहराने और दूसरी में मन्नतों पर बाद में विचार करने को समानांतर अविवेकी धार्मिक प्रतिबद्धताओं के रूप में रखा गया है।
  alternative: पहली पंक्ति को केवल ‘पवित्र है’ बोल पड़ने के रूप में प्रस्तुत करना।
  rationale: संदर्भ समर्पण अथवा धार्मिक प्रतिज्ञा की ओर संकेत करता है, पर कठिन इब्रानी के कारण पादटिप्पणी में वैकल्पिक शाब्दिक समझ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पवित्र ठहरा देना’ धार्मिक समर्पण का भाव सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘मन्नतें मान लेना’ स्वाभाविक हिन्दी मुहावरा है।
