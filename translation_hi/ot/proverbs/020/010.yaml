source:
  edition: WLC
  text: אֶ֣בֶן וָ֭/אֶבֶן אֵיפָ֣ה וְ/אֵיפָ֑ה תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/010.yaml
  text: A differing weight and a differing measure—both of them are an abomination to Yahweh[a].
translation:
  language: hi
  text: अलग-अलग बाट और अलग-अलग नाप—दोनों ही याहवे[a] के लिए घृणित हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से, “पत्थर और पत्थर, एपा और एपा।” आशय है: व्यापार में बेईमानी से इस्तेमाल किए जाने वाले अलग-अलग बाट और नाप। “याहवे” इब्रानी ईश्वरीय नाम יהוה का लिप्यंतरण है।'
    reason: शाब्दिक मुहावरे, व्यापारिक आशय और ईश्वरीय नाम के स्रोत-रूप को स्पष्ट करना।
lexical_decisions:
- source_word: אֶבֶן וָאֶבֶן
  choice: अलग-अलग बाट
  rationale: शाब्दिक रूप से ‘पत्थर और पत्थर’; व्यापारिक संदर्भ में तराजू के असमान मानक बाट अभिप्रेत हैं। ‘बाट’ हिंदी में इस व्यावसायिक अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֵיפָה וְאֵיפָה
  choice: अलग-अलग नाप
  rationale: एपा सूखी वस्तुओं की माप थी; संज्ञा की पुनरावृत्ति असमान मानकों की ओर संकेत करती है। ‘अलग-अलग नाप’ मूल मुहावरे का आशय स्पष्ट करता है।
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द परमेश्वर की तीव्र नैतिक अस्वीकृति व्यक्त करता है। ‘घृणित’ आधुनिक हिंदी में दृढ़, गरिमापूर्ण और सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप द्वारा इब्रानी चतुरक्षरीय व्यक्तिगत नाम को शीर्षक से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: גַּם שְׁנֵיהֶם
  choice: दोनों ही
  rationale: ‘ही’ इस बात पर बल देता है कि दोनों प्रकार के बेईमान मानक समान रूप से अस्वीकार्य हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसे शीर्षक के बजाय नाम रखा गया। ‘यहोवा’ साधारण हिंदी पाठकों में अधिक पहचाना जाने वाला पारंपरिक रूप है; [a] में स्रोत-रूप और वैकल्पिक लिप्यंतरण स्पष्ट किया गया है।
- issue: असमान बाट और नाप में बेईमानी का निहितार्थ
  choice: मुख्य पाठ में ‘अलग-अलग’ और टिप्पणी में व्यापारिक बेईमानी की व्याख्या
  alternative: मुख्य पाठ में सीधे ‘बेईमान बाट और नाप’
  rationale: इब्रानी पाठ वस्तुओं की पुनरावृत्ति से असमान मानकों का संकेत देता है, पर ‘बेईमान’ शब्द प्रत्यक्षतः नहीं कहता। मुख्य पाठ मूल की संक्षिप्तता बचाता है और टिप्पणी संदर्भगत आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली। ‘बाट’ तथा ‘नाप’ सामान्य व्यापारिक शब्द हैं। इब्रानी की समानांतर पुनरावृत्ति को ‘अलग-अलग ... और अलग-अलग ...’ से व्यक्त किया गया है।
