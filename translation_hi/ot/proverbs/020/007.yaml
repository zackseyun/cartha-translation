base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/007.yaml
  text: A righteous man walks in his integrity[b][a]; blessed are his children after him.
translation:
  language: hi
  text: 'धर्मी मनुष्य अपनी खराई में चलता है;

    उसके बाद उसके बच्चे[a] धन्य[b] हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके पुत्र’; यह शब्द यहाँ सामान्य रूप से उसकी सन्तान का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सुखी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִתְהַלֵּךְ
  choice: चलता है
  rationale: हित्पएल कृदंत जीवन के आचरण को व्यक्त करता है। ‘चलता है’ इब्रानी रूपक को बनाए रखता है और हिन्दी नीतिवचन-शैली में स्वाभाविक है।
- source_word: בְּתֻמּוֹ
  choice: अपनी खराई से
  rationale: תֹּם/תֻּם चरित्र की अखंडता, निष्कपटता और निर्दोषता का बोध कराता है। ‘अपनी खराई से’ नैतिक अर्थ और संबंधसूचक प्रत्यय—दोनों को संक्षेप में व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी मनुष्य
  rationale: यह पुल्लिंग एकवचन रूप यहाँ प्रतिनिधिक नीतिवचन के रूप में एक धर्मी व्यक्ति को दर्शाता है। ‘धर्मी मनुष्य’ मूल के व्याकरणिक रूप और हिन्दी की गरिमापूर्ण शैली दोनों के अनुकूल है।
- source_word: אַשְׁרֵי
  choice: धन्य
  rationale: यह शब्द प्रशंसनीय, सुखमय अथवा ईर्ष्या योग्य दशा की उद्घोषणा करता है। ‘धन्य’ इसकी नीतिसाहित्यीय गरिमा को बनाए रखता है; ‘सुखी’ सम्भव वैकल्पिक अर्थ है।
- source_word: בָנָיו
  choice: उसके बच्चे
  rationale: בנים का शाब्दिक अर्थ ‘पुत्र’ है, पर यह सन्तान के लिए व्यापक रूप से भी प्रयुक्त हो सकता है। प्रसंग में ‘बच्चे’ इस सामान्य पारिवारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרָיו
  choice: उसके बाद
  rationale: यह पद सीधे उस धर्मी मनुष्य के बाद आने वालों की ओर संकेत करता है। ‘उसके बाद’ मूल की संक्षिप्तता और समय/उत्तराधिकार की सम्भावित अर्थ-छाया को बनाए रखता है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक पुल्लिंग भाषा
  choice: धर्मी मनुष्य
  alternative: धर्मी जन
  rationale: इब्रानी पाठ पुल्लिंग एकवचन का प्रयोग करता है। अनुवाद इसे प्रतिनिधिक कथन के रूप में बनाए रखता है, बिना यह निष्कर्ष जोड़े कि सिद्धान्त स्त्रियों पर लागू नहीं होता।
- issue: धर्मी के आचरण और उसकी सन्तान की धन्यता का संबंध
  choice: दोनों कथनों को साथ रखा गया है, पर स्पष्ट कारण-परिणाम सूचक शब्द नहीं जोड़ा गया
  alternative: इसलिए उसके बाद उसके बच्चे धन्य हैं
  rationale: इब्रानी पाठ निकट संबंध दिखाता है, किन्तु ‘इसलिए’ जैसा स्पष्ट तर्कसूचक शब्द नहीं देता। अनुवाद इस धार्मिक और नैतिक तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘चलता है’ मूल जीवन-यात्रा के रूपक को और ‘खराई’ चरित्र की अखंडता को सुरक्षित रखते हैं।
