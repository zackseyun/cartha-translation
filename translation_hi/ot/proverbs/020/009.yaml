source:
  edition: WLC
  text: מִֽי יֹ֭אמַר זִכִּ֣יתִי לִבִּ֑/י טָ֝הַ֗רְתִּי מֵ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/009.yaml
  text: Who can say[a], “I have made my heart pure; I am clean from my sin” ?
translation:
  language: hi
  text: कौन कह सकता है[a], “मैंने अपने हृदय को शुद्ध कर लिया है; मैं अपने पाप से निर्मल हूँ”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कौन कहता है, ‘मैंने अपने हृदय को शुद्ध किया है; मैं अपने पाप से शुद्ध हो गया हूँ’?” इब्रानी क्रियाओं का अधिक औपचारिक अनुवाद हृदय को शुद्ध करने और पाप से शुद्ध होने की भाषा पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יֹאמַר
  choice: कौन कह सकता है
  rationale: מִי का मूल अर्थ ‘कौन’ और יֹאמַר का ‘कहेगा/कह सकता है’ है। हिन्दी में ‘कौन कह सकता है’ प्रश्न की स्वाभाविक आलंकारिक शक्ति व्यक्त करता है, बिना उत्तर को पाठ में जोड़ने के।
- source_word: זִכִּיתִי
  choice: मैंने ... शुद्ध कर लिया है
  rationale: पिएल रूप हृदय को शुद्ध करने की क्रिया व्यक्त करता है। ‘शुद्ध कर लिया है’ कर्ता द्वारा किए गए शुद्धीकरण के भाव को बनाए रखता है।
- source_word: לִבִּי
  choice: अपने हृदय को
  rationale: ‘हृदय’ मूल बाइबलीय मानवशास्त्रीय रूपक को सुरक्षित रखता है और यहाँ व्यक्ति के आंतरिक नैतिक केंद्र को दर्शाता है।
- source_word: טָהַרְתִּי
  choice: मैं ... निर्मल हूँ
  rationale: טהר शुद्ध/निर्मल होने या हो जाने का भाव दे सकता है। समानांतर पंक्ति में ‘निर्मल हूँ’ परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; आत्म-शुद्धीकरण का भाव पहली पंक्ति में पहले ही स्पष्ट है।
- source_word: מֵחַטָּאתִי
  choice: अपने पाप से
  rationale: חטאת का यहाँ सामान्य नैतिक अर्थ ‘पाप’ है और מִן अलगाव को दर्शाता है; अतः ‘अपने पाप से’ स्रोत के निकट और स्पष्ट है।
theological_decisions:
- issue: आंतरिक नैतिक शुद्धता का मानवीय दावा
  choice: पद को ऐसे आलंकारिक प्रश्न के रूप में रखा गया है जो पूर्ण आंतरिक शुद्धता और अपने पाप से निर्मल होने के दावे को चुनौती देता है।
  alternative: इसे दुर्लभ नैतिक सत्यनिष्ठा के बारे में केवल एक खुला, सूचनात्मक प्रश्न मानना।
  rationale: दोनों समानांतर कथन पूर्ण शुद्धता का दावा प्रस्तुत करते हैं। ‘कौन कह सकता है’ अपेक्षित नकारात्मक उत्तर का संकेत देता है, पर अनुवाद उस उत्तर या उससे आगे की कोई व्यवस्थित धर्मशास्त्रीय व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘हृदय’, ‘शुद्ध’ और ‘पाप’ जैसे स्थापित बाइबलीय शब्द सुरक्षित रखे गए हैं। मुख्य पाठ में पहली क्रिया का आत्म-शुद्धीकरण भाव और दूसरी क्रिया की परिणामी अवस्था दोनों स्वाभाविक समानांतरता में व्यक्त हैं।
