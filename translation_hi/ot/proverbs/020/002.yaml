  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נַ֣הַם כַּ֭/כְּפִיר אֵ֣ימַת מֶ֑לֶךְ מִ֝תְעַבְּר֗/וֹ חוֹטֵ֥א נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/002.yaml
  text: The terror of a king is like the growling of a young lion[c][b][a]; whoever provokes him to anger sins against his own life.
translation:
  language: hi
  text: राजा का आतंक जवान सिंह की गुर्राहट जैसा है[a]; जो उसे क्रोध दिलाता है[b], वह अपने ही प्राण के विरुद्ध पाप करता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा का आतंक जवान सिंह की गर्जना जैसा है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो उसे क्रोधित करता है”; आशय राजा के क्रोध को उकसाने से है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह अपने ही विरुद्ध पाप करता है” अथवा “अपनी ही आत्मा के विरुद्ध”; इब्रानी נֶפֶשׁ का अर्थ संदर्भ के अनुसार ‘प्राण’, ‘स्वयं’ या ‘आत्मा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: गुर्राहट
  rationale: यह संज्ञा सिंह की धमकी-भरी आवाज़ को दर्शाती है। ‘गुर्राहट’ उस भयावह चेतावनी को स्वाभाविक हिन्दी में व्यक्त करती है; ‘गर्जना’ भी संभव है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: यह शब्द सामान्यतः बलवान युवा सिंह के लिए आता है; ‘जवान सिंह’ उसकी आयु और प्रचंडता, दोनों को बनाए रखता है।
- source_word: אֵימַת
  choice: आतंक
  rationale: रचना ‘राजा का आतंक’ उस प्रबल भय को व्यक्त करती है जो राजा उत्पन्न करता है; केवल ‘भय’ मूल शब्द की तीव्रता को कम कर सकता है।
- source_word: מִתְעַבְּרוֹ
  choice: जो उसे क्रोध दिलाता है
  rationale: क्रिया और पुरुषवाचक प्रत्यय का आशय राजा के क्रोध को उकसाना है। यह हिन्दी में अर्थ को स्पष्ट रखते हुए इब्रानी की संबंधगत संरचना को व्यक्त करता है।
- source_word: חוֹטֵא
  choice: पाप करता है
  rationale: इब्रानी क्रिया नैतिक दोष का भाव बनाए रखती है। इसलिए इसे केवल ‘हानि पहुँचाता है’ जैसे परिणामसूचक वाक्यांश में नहीं बदला गया।
- source_word: נַפְשׁוֹ
  choice: अपने ही प्राण
  rationale: इस चेतावनी के संदर्भ में נֶפֶשׁ व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित करता है। ‘अपने ही प्राण’ आत्म-विनाशकारी परिणाम और प्रतिवर्ती भाव दोनों व्यक्त करता है।
