  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी अपनाई गई है। समानांतर वाक्य-रचना तथा इब्रानी का ‘होंठ खोलने’ वाला चित्र सुरक्षित रखा गया है; असामान्य मुहावरे का आशय पादटिप्पणी में दिया गया है।
