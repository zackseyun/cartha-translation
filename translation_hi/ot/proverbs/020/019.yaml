  yaml_path: translation/ot/proverbs/020/019.yaml
  text: One who reveals secrets goes about as a gossip[b][a]; do not associate with one who opens his lips wide.
translation:
  language: hi
  text: जो भेद खोलता है, वह चुगली करता फिरता है; जो अपने होंठ खोलता रहता है,[a] उससे मेल-जोल न रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् जो बिना रोक-टोक या बहुत अधिक बोलता है। मूल भाषा में शाब्दिक चित्र है, “जो अपने होंठ खोलता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹלֶה סּוֹד
  choice: जो भेद खोलता है
  rationale: यह पदबंध किसी गोपनीय बात को प्रकट करने का अर्थ देता है। ‘भेद खोलना’ आधुनिक हिन्दी में स्वाभाविक है और विश्वासघात का भाव स्पष्ट करता है।
- source_word: הוֹלֵךְ רָכִיל
  choice: चुगली करता फिरता है
  rationale: यह इब्रानी पदबंध घूम-घूमकर हानिकारक बातें फैलाने वाले व्यक्ति को दर्शाता है। ‘चुगली करता फिरता है’ आवागमन के मुहावरे और दोषपूर्ण वाणी—दोनों को सहज हिन्दी में रखता है।
- source_word: וּלְפֹתֶה שְׂפָתָיו
  choice: जो अपने होंठ खुले रखता है
  rationale: पाठ का शाब्दिक चित्र होंठ खोलने वाले व्यक्ति का है और आशय बेझिझक या बहुत अधिक बोलने वाले से है। मुख्य पाठ में चित्र बनाए रखा गया है और आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לֹא תִתְעָרָב
  choice: उससे मेल-जोल न रखना
  rationale: हित्पएल रूप यहाँ किसी के साथ घुलने-मिलने या संगति रखने से मना करता है। यह चयन सामान्य पाठक के लिए स्पष्ट और नीतिवचन के अनुरूप है।
theological_decisions: []
