base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/026.yaml
  text: A wise king winnows the wicked and drives the wheel over them.
translation:
  language: hi
  text: बुद्धिमान राजा दुष्टों को फटककर अलग कर देता है और उन पर मड़ाई का पहिया चलाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְזָרֶה
  choice: फटककर अलग कर देता है
  rationale: यह कृदन्त अनाज फटकने या बिखेरने की क्रिया व्यक्त करता है। यहाँ दुष्टों को भूसे की तरह छाँटकर हटाने का रूपक है; ‘फटककर अलग कर देता है’ उस कृषि-बिंब और न्यायपूर्ण पृथक्करण दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיָּשֶׁב
  choice: चलाता है
  rationale: हिफ़ील रूप का आशय पहिए को उन पर फेरने या चलाने से है। ‘चलाता है’ सक्रिय और कठोर न्याय की छवि को स्पष्ट रखता है, बिना यह तय किए कि कथन शाब्दिक दंड है या रूपक।
- source_word: אוֹפָן
  choice: मड़ाई का पहिया
  rationale: सिर्फ ‘पहिया’ हिन्दी पाठक के लिए कृषि-संदर्भ अस्पष्ट छोड़ सकता है। प्रसंग में यह अनाज की मड़ाई में प्रयुक्त पहिया है, इसलिए यह अनुवाद मूल बिंब को स्पष्ट करता है।
theological_decisions:
- issue: राजकीय न्याय के कृषि-रूपक का अर्थ
  choice: दुष्टों को फटकने और उन पर मड़ाई का पहिया चलाने की कठोर छवि बनाए रखी गई है।
  alternative: इसे सामान्यीकृत करके ‘राजा दुष्टों को दंड देता है’ कहना।
  rationale: सामान्यीकृत विकल्प मूल की सजीव और जानबूझकर कठोर काव्यात्मक छवि मिटा देता। अनुवाद यह निर्धारित नहीं करता कि यह किसी खास दंड-विधि का शाब्दिक वर्णन है या निर्णायक न्याय का रूपक।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, नीतिवचन-सुलभ और गरिमापूर्ण वाक्य। ‘फटककर अलग करना’ तथा ‘मड़ाई का पहिया’ सामान्य पाठक के लिए कृषि-बिंब को पर्याप्त रूप से स्पष्ट रखते हैं।
