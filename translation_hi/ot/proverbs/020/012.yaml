source:
  edition: WLC
  text: אֹ֣זֶן שֹׁ֭מַעַת וְ/עַ֣יִן רֹאָ֑ה יְ֝הוָ֗ה עָשָׂ֥ה גַם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/012.yaml
  text: The hearing ear and the seeing eye—Yahweh made both of them[a].
translation:
  language: hi
  text: सुनने वाला कान और देखने वाली आँख—याहवे ने इन दोनों को बनाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹזֶן שֹׁמַעַת
  choice: सुनने वाला कान
  rationale: हिब्रू में कृदन्त संज्ञा ‘कान’ का गुण बताता है। यह अनुवाद उसके ठोस अर्थ और समानांतर काव्य-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַיִן רֹאָה
  choice: देखने वाली आँख
  rationale: यह पद पहले पदांश के समानांतर है; ‘देखने वाली’ कृदन्त के वर्णनात्मक बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: עָשָׂה
  choice: बनाया है
  rationale: काल रूप पूर्ण की हुई ईश्वरीय क्रिया बताते हुए वर्तमान में सत्य परिणाम को व्यक्त करता है; ‘बनाया है’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: גַם שְׁנֵיהֶם
  choice: इन दोनों को
  rationale: हिब्रू पदबंध दोनों अंगों को समावेशी रूप से रेखांकित करता है। ‘इन दोनों को’ हिन्दी में उसके अर्थ को बिना अनावश्यक दुहराव के व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ वैकल्पिक पारंपरिक लिप्यंतरण है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों संज्ञा-पदों की लिंग-संगति और काव्यात्मक समानांतरता सुरक्षित है।
