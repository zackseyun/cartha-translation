  text: מְ֭קַלֵּל אָבִ֣י/ו וְ/אִמּ֑/וֹ יִֽדְעַ֥ךְ נֵ֝ר֗/וֹ ב/אישון חֹֽשֶׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/020.yaml
  text: Whoever curses his father or his mother—his lamp will be put out in deepest darkness[a][b].
translation:
  language: hi
  text: 'जो अपने पिता और अपनी माता को शाप देता है,

    उसका दीपक घोर अंधकार में बुझ जाएगा।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अंधकार की पुतली में”; यह इब्रानी मुहावरा अत्यंत गहरे या घने अंधकार को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या, “उसका दीपक घोर अंधकार में बुझा दिया जाएगा।” यहाँ दीपक किसी व्यक्ति के जीवन, कुशल-क्षेम या भविष्य का प्रतीक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַלֵּל
  choice: जो ... शाप देता है
  rationale: यह कृदन्त सामान्य रूप से ऐसे किसी भी व्यक्ति को दर्शाता है जो यह काम करता है। ‘शाप देता है’ קלל के अर्थ को बनाए रखता है और माता-पिता के आदर के सन्दर्भ में स्वाभाविक हिन्दी है।
- source_word: אָבִיו וְאִמּוֹ
  choice: अपने पिता या अपनी माता को
  rationale: मूल में वाव है, पर इस सामान्य निषेधात्मक कथन में हिन्दी का ‘या’ स्पष्ट करता है कि दोनों में से किसी एक को शाप देना भी कथन के दायरे में आता है; पिता और माता दोनों का अलग उल्लेख सुरक्षित है।
- source_word: יִדְעַךְ
  choice: बुझ जाएगा
  rationale: क्रिया दीपक के बुझने या बुझा दिए जाने को व्यक्त करती है, पर कर्ता निर्दिष्ट नहीं करती। ‘बुझ जाएगा’ उसी अस्पष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נֵרוֹ
  choice: उसका दीपक
  rationale: शाब्दिक ठोस बिम्ब ‘दीपक’ रखा गया है; यह जीवन, कुशलता या भविष्य का संकेत हो सकता है, पर मुख्य पाठ में अर्थ को किसी एक विकल्प तक सीमित नहीं किया गया।
- source_word: בְאִישׁוֹן חֹשֶׁךְ
  choice: घोर अन्धकार में
  rationale: शाब्दिक अभिव्यक्ति ‘अन्धकार की पुतली’ एक इब्रानी मुहावरा है। ‘घोर अन्धकार’ उसके अत्यन्त गहरे/काले अन्धकार के भाव को स्पष्ट और गरिमापूर्ण हिन्दी में देता है।
theological_decisions:
- issue: दीपक के रूपक का आशय
  choice: मुख्य पाठ में केवल ‘उसका दीपक’ रखा गया
  alternative: इसे सीधे उसका जीवन, कुशलता, वंश या भविष्य कहना
  rationale: मूल रूपक बहुअर्थी है और उसका ठीक आशय स्पष्ट नहीं करता; इसलिए धर्मवैचारिक तनाव तथा अर्थ-व्याप्ति को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और नीतिवचन-सुलभ गरिमापूर्ण रूप अपनाया गया है। ‘दीपक’ और ‘घोर अन्धकार’ जैसे परिचित शब्द मूल काव्यात्मक बिम्ब को बनाए रखते हैं।
