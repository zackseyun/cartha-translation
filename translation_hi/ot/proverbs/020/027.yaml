  text: נֵ֣ר יְ֭הוָה נִשְׁמַ֣ת אָדָ֑ם חֹ֝פֵ֗שׂ כָּל חַדְרֵי בָֽטֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/027.yaml
  text: The spirit of man is the lamp of Yahweh[b][a], searching all the innermost chambers of the belly.
translation:
  language: hi
  text: मनुष्य की आत्मा[a] याहवे का दीपक है, जो पेट के सभी भीतरी कक्षों[b] को जाँचता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य की श्वास।” इब्रानी शब्द का अर्थ श्वास, जीवन-श्वास या आत्मा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पेट के भीतरी कक्ष” इब्रानी में मनुष्य के सबसे गहरे आंतरिक भागों या उसके आंतरिक अस्तित्व का बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: נֵר
  choice: दीपक
  rationale: यह शब्द किसी अमूर्त ‘प्रकाश’ के बजाय सामान्यतः ठोस दीपक को दर्शाता है; इससे प्रकाशित करने और छिपी बातों को सामने लाने का रूपक बना रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: נִשְׁמַת
  choice: आत्मा
  rationale: נשמה का अर्थ ‘श्वास’, ‘जीवन-श्वास’ या मनुष्य का आंतरिक जीवंत तत्व हो सकता है। मुख्य पाठ में ‘आत्मा’ प्रसंग के मानवीय-अंतरंग अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘श्वास’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ אָדָם जातिवाचक एकवचन है और किसी भी मानव व्यक्ति का प्रतिनिधित्व करता है; ‘मनुष्य’ आधुनिक हिंदी में इस अर्थ को स्वाभाविक रूप से रखता है।
- source_word: חֹפֵשׂ
  choice: टटोलता है
  rationale: कृदंत लगातार और गहराई से खोजने या जाँचने का भाव देता है। ‘टटोलता है’ भीतर के छिपे स्थानों की सूक्ष्म जाँच को सहज हिंदी में व्यक्त करता है और पुल्लिंग रूप से निकटतम व्याकरणिक कर्ता ‘दीपक’ से जुड़ता है।
- source_word: כָּל
  choice: सभी
  rationale: यह खोज की व्यापकता को सीधे व्यक्त करता है।
- source_word: חַדְרֵי
  choice: कक्षों
  rationale: मूल स्थानिक रूपक को बनाए रखने के लिए ‘कमरों/कक्षों’ का ठोस बिंब रखा गया है।
- source_word: בָטֶן
  choice: पेट के भीतर
  rationale: בטן का मूल अर्थ ‘पेट’ है, पर यहाँ यह मनुष्य के गहरे आंतरिक अस्तित्व के लिए रूपक है। मुख्य पाठ इब्रानी बिंब को रखता है और पादटिप्पणी उसका मुहावरेदार आशय बताती है।
theological_decisions:
- issue: נִשְׁמַת אָדָם का मानवशास्त्रीय अर्थ
  choice: मनुष्य की आत्मा को याहवे का दीपक कहा गया है, जिसके द्वारा भीतर की गहराइयाँ टटोली जाती हैं।
  alternative: इसे मनुष्य की ‘श्वास’ या ‘जीवन-श्वास’ भी समझा जा सकता है; कुछ व्याख्याएँ इसे अंतःकरण से जोड़ती हैं।
  rationale: मूल शब्द ‘श्वास’ और आंतरिक जीवन-तत्त्व दोनों अर्थ दे सकता है, पर पाठ में ‘अंतःकरण’ स्पष्ट रूप से नहीं है। इसलिए उस विशिष्ट धार्मिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया और वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया।
- issue: חֹפֵשׂ का व्याकरणिक संबंध
  choice: खोजने का कार्य ‘दीपक’ से जोड़ा गया है।
  alternative: अर्थ की दृष्टि से इसे मनुष्य की आत्मा की खोजी भूमिका के रूप में भी ग्रहण किया जा सकता है।
  rationale: חֹפֵשׂ पुल्लिंग एकवचन है और נֵר (‘दीपक’) भी पुल्लिंग है, जबकि נִשְׁמַת (‘आत्मा/श्वास’) स्त्रीलिंग है; इसलिए हिंदी वाक्य में पुल्लिंग ‘जो…टटोलता है’ रखकर मूल व्याकरणिक संकेत सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दीपक’, ‘कक्ष’ और ‘पेट’ मूल इब्रानी के ठोस रूपक को सुरक्षित रखते हैं; ‘टटोलता है’ खोज और सूक्ष्म जाँच—दोनों का भाव देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदों पर रखे गए हैं।
