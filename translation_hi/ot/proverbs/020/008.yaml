  text: מֶ֗לֶךְ יוֹשֵׁ֥ב עַל כִּסֵּא דִ֑ין מְזָרֶ֖ה בְ/עֵינָ֣י/ו כָּל רָֽע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/008.yaml
  text: A king sitting on a throne of judgment winnows all evil with his eyes[a][b].
translation:
  language: hi
  text: न्याय के सिंहासन पर बैठा राजा अपनी आँखों से सारी बुराई को फटककर अलग करता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छाँटकर अलग करता है’ या ‘उड़ा देता है’; हिब्रू क्रिया अनाज को फटकने का चित्र प्रस्तुत करती है, जिसमें भूसी या व्यर्थ अंश को अच्छे अंश से अलग किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर बुरे व्यक्ति को।’ हिब्रू शब्द व्यापक रूप से बुराई को, अथवा प्रसंगानुसार न्याय के अधीन आए बुरे लोगों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यहाँ नीतिवचन किसी विशिष्ट राजा की नहीं, बल्कि राजकीय न्याय के विषय में एक सामान्य सत्य की बात करता है; हिन्दी में बिना संकेतवाचक के ‘राजा’ यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹשֵׁב
  choice: बैठा
  rationale: कृदन्त राजा की निरंतर या विशिष्ट मुद्रा को दर्शाता है और सिंहासन के सजीव चित्र को बनाए रखता है।
- source_word: עַל כִּסֵּא דִין
  choice: न्याय के सिंहासन पर
  rationale: यह पद राजकीय आसन और न्यायिक कार्य—दोनों को व्यक्त करता है; ‘न्याय का आसन’ कहने से राजकीय संदर्भ कुछ मंद पड़ सकता था।
- source_word: מְזָרֶה
  choice: फटक देता है
  rationale: זרה का कृषि-संबंधी बिंब अनाज को फटककर भूसी से अलग करने का है। ‘फटक देता है’ आधुनिक हिन्दी में इस ठोस रूपक को अपेक्षाकृत स्पष्ट और स्वाभाविक रखता है।
- source_word: בְעֵינָיו
  choice: अपनी दृष्टि से
  rationale: בְ को साधनवाचक समझते हुए यह अनुवाद राजा की परखने वाली निगाह को व्यक्त करता है; शाब्दिक ‘अपनी आँखों से’ की तुलना में ‘अपनी दृष्टि से’ न्यायिक विवेक के संदर्भ में अधिक स्वाभाविक है।
- source_word: כָּל רָע
  choice: सारी बुराई
  rationale: רָע अमूर्त बुराई अथवा प्रसंगानुसार बुरे व्यक्तियों को सूचित कर सकता है। ‘सारी बुराई’ मूल की व्यापकता और अस्पष्टता को मुख्य पाठ में बनाए रखता है।
theological_decisions:
- issue: כָּל רָע का आशय अमूर्त बुराई है या बुरे लोग
  choice: मुख्य पाठ में ‘सारी बुराई’
  alternative: ‘हर बुरे व्यक्ति को’
  rationale: हिब्रू दोनों अर्थों की अनुमति देता है। व्यापक अमूर्त अर्थ को मुख्य पाठ में रखा गया है और व्यक्ति-संबंधी अर्थ को पादटिप्पणी में दिया गया है, ताकि न्याय के दायरे को अनावश्यक रूप से सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और चित्रात्मक रूप अपनाया गया है। ‘फटक देता है’ कृषि-रूपक को सुरक्षित रखता है, जबकि पादटिप्पणियाँ अपरिचित पाठकों के लिए उसका अर्थ और כָּל רָע की वास्तविक अर्थगत अस्पष्टता स्पष्ट करती हैं।
