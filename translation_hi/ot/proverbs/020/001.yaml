source:
  edition: WLC
  text: לֵ֣ץ הַ֭/יַּין הֹמֶ֣ה שֵׁכָ֑ר וְ/כָל שֹׁ֥גֶה בּ֝֗/וֹ לֹ֣א יֶחְכָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/020/001.yaml
  text: Wine is a mocker[a], strong drink a brawler, and whoever is led astray by it is not wise.
translation:
  language: hi
  text: दाखरस ठट्ठा करनेवाला है, मादक पेय शोर मचानेवाला है; और जो कोई उसके कारण भटकता है, वह बुद्धिमान नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: उपहास करनेवाला
  rationale: यह संज्ञा सामान्यतः उपहास या ठट्ठा करनेवाले व्यक्ति को दर्शाती है। दाखमधु के लिए इसका प्रयोग मानवीकरण को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַיַּיִן
  choice: दाखमधु
  rationale: यह יין का मानक हिन्दी बाइबलीय पर्याय है और यहाँ सामान्यतः अंगूर से बने मद्य को दर्शाता है। हिब्रू के निश्चित उपपद को इस लोकोक्तिपरक वाक्य में अलग से व्यक्त करना स्वाभाविक नहीं है।
- source_word: הֹמֶה
  choice: हुल्लड़ मचानेवाला
  rationale: המה का कृदन्त शोर, कोलाहल और उग्र हलचल का भाव देता है। समानांतर मानवीकरण में यह चयन मादक पेय के उपद्रवी प्रभाव को सजीव और सहज हिन्दी में व्यक्त करता है।
- source_word: שֵׁכָר
  choice: मादक पेय
  rationale: यह दाखमधु से अलग अन्य नशीले पेयों के लिए व्यापक शब्द है। ‘मादक पेय’ किसी एक आधुनिक पेय तक अर्थ को सीमित नहीं करता।
- source_word: שֹׁגֶה
  choice: भटक जाता है
  rationale: क्रिया का मूल भाव मार्ग से चूकना या भूल करना है। प्रसंग में यह केवल शारीरिक लड़खड़ाहट नहीं, बल्कि व्यावहारिक और नैतिक भटकाव को भी समेटता है।
- source_word: בּוֹ
  choice: उसके कारण
  rationale: एकवचन प्रत्यय को बनाए रखते हुए यह मद्य के प्रभाव या माध्यम से होने वाले भटकाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יֶחְכָּם
  choice: बुद्धिमान नहीं
  rationale: अपूर्ण क्रिया यहाँ सामान्य लोकोक्तिपरक सत्य व्यक्त करती है; इसलिए वर्तमानकालीन कथन भविष्यसूचक ‘बुद्धिमान न होगा’ से अधिक उपयुक्त है।
