  text: and your poverty will come like a prowler[b][a], and your lack like an armed man.
translation:
  language: hi
  text: तब तेरी गरीबी किसी राह चलते आदमी की तरह आ पहुँचेगी[a], और तेरी तंगी किसी हथियारबंद आदमी की तरह[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “चलनेवाले की तरह।”
    reason: lexical_alternative
  - marker: b
    text: या, “ढाल लिए आदमी की तरह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: तब ... आ पहुँचेगी
  rationale: इस नीतिवचनात्मक परिणाम-वाक्य में पूर्ण क्रिया भविष्यसूचक/परिणामसूचक बल रखती है; ‘आ पहुँचेगी’ आसन्न और अनिवार्य आगमन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִמְהַלֵּךְ
  choice: एक लुटेरे की तरह
  rationale: शाब्दिक अर्थ ‘घूमने/चलनेवाले की तरह’ है, पर प्रसंग में अचानक और धमकी भरे आगमन की उपमा है। ‘लुटेरा’ इस आशय को सहज हिन्दी में देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: רֵאשֶׁךָ
  choice: तेरी गरीबी
  rationale: यहाँ संज्ञा भौतिक निर्धनता को बताती है; ‘गरीबी’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וּמַחְסֹרְךָ
  choice: और तेरी तंगी
  rationale: מַחְסוֹר अभाव या कमी दर्शाता है। ‘तंगी’ गरीबी के समानांतर रहते हुए आर्थिक अभाव को स्वाभाविक और संक्षिप्त रूप में व्यक्त करती है।
- source_word: כְּאִישׁ
  choice: आदमी की तरह
  rationale: इब्रानी में पुरुषवाचक एकवचन आकृति है; इसलिए उपमा में ‘आदमी’ बनाए रखा गया है।
- source_word: מָגֵן
  choice: हथियारबंद
  rationale: מָגֵן का सामान्य अर्थ ‘ढाल’ है, लेकिन אִישׁ מָגֵן ऐसे व्यक्ति का चित्र देता है जो युद्ध के लिए सुसज्जित और भयावह है। मुख्य पाठ में मुहावरेदार ‘हथियारबंद’ और पादटिप्पणी में अधिक शाब्दिक अर्थ दिया गया है।
