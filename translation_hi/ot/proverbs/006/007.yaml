  text: אֲשֶׁ֖ר אֵֽין לָ֥/הּ קָצִ֗ין שֹׁטֵ֥ר וּ/מֹשֵֽׁל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/007.yaml
  text: which has no chief[a], officer, or ruler,
translation:
  language: hi
  text: जिसका न कोई अगुआ[a], न अधिकारी और न शासक है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नेता।”
    reason: קָצִין के नेतृत्व-सूचक अर्थ का एक समान रूप से संभव विकल्प।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसका
  rationale: यह पिछले पद की ‘चींटी’ का वर्णन करने वाला संबंधवाचक उपवाक्य आरम्भ करता है। ‘जिसका’ हिंदी में अधिकार-सूचक אֵין לָהּ के साथ स्वाभाविक बैठता है।
- source_word: אֵין לָהּ
  choice: न कोई … है
  rationale: इब्रानी अस्तित्ववाचक रचना का भाव है कि उसके लिए या उसके पास ऐसा कोई पदाधिकारी नहीं है। हिंदी में ‘जिसका न कोई … है’ इसे सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: קָצִין
  choice: अगुआ
  rationale: इस शब्द का अर्थ प्रधान, अगुआ या नेता हो सकता है। ‘अगुआ’ नेतृत्व के सामान्य अर्थ को रखता है और बाद के ‘शासक’ से अलग रहता है।
- source_word: שֹׁטֵר
  choice: अधिकारी
  rationale: यह प्रायः प्रशासनिक पदाधिकारी या निरीक्षक के लिए आता है। ‘अधिकारी’ आधुनिक हिंदी में व्यापक, स्पष्ट और प्रसंगानुकूल है।
- source_word: וּמֹשֵׁל
  choice: और न शासक
  rationale: מֹשֵׁל शासन करने वाले व्यक्ति को दर्शाता है। नकारात्मक सूची में हिंदी की स्वाभाविक रचना के अनुसार संयोजक को ‘और न’ किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तीनों नेतृत्व-सूचक पदों का भेद बनाए रखने के लिए ‘अगुआ, अधिकारी, शासक’ चुने गए हैं; पद अगले वाक्य से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
