lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पद पिछले वर्णन का परिणाम बताता है; ‘इसलिए’ आधुनिक हिंदी में सहज है और कारण-परिणाम का संबंध स्पष्ट रखता है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण आकस्मिकता व्यक्त करता है; ‘अचानक’ इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: יָבֹוא אֵידוֹ
  choice: उस पर विपत्ति आ पड़ेगी
  rationale: אֵיד विपत्ति, संकट या विनाश को दर्शा सकता है। ‘उस पर विपत्ति आ पड़ेगी’ हिंदी में स्वाभाविक ढंग से अनिष्ट के उस तक पहुँचने का भाव रखता है।
- source_word: פֶּתַע
  choice: एक ही क्षण में
  rationale: यह पहले आए ‘अचानक’ के समानार्थी होते हुए काव्यात्मक तीव्रता बढ़ाता है; अलग अभिव्यक्ति रखने से इब्रानी की पुनरुक्ति सपाट नहीं होती।
- source_word: יִשָּׁבֵר
  choice: वह टूट जाएगा
  rationale: שׁבר का निफ़अल रूप टूट जाने या चकनाचूर होने का निष्क्रिय/परिणामी भाव देता है। ‘टूट जाएगा’ व्यक्ति के पतन या विनाश—दोनों की व्यापक छवि बनाए रखता है।
- source_word: וְאֵין מַרְפֵּא
  choice: और उसका कोई उपचार न होगा
  rationale: מַרְפֵּא उपचार, चंगाई या निदान का अर्थ दे सकता है। ‘कोई उपचार न होगा’ पुनर्स्थापना की चिकित्सकीय उपमा को स्वाभाविक हिंदी में बनाए रखता है।
