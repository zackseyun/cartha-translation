  register: आधुनिक मानक हिन्दी में आत्मीय ज्ञान-साहित्यिक संबोधन और मध्यम औपचारिकता रखी गई है। ‘तू’ मूल इब्रानी के एकवचन, पारिवारिक पिता-पुत्र संबोधन को दर्शाता है और यहाँ अपमानसूचक नहीं है। पद अगले पद में जारी रहने वाले शर्तसूचक वाक्य का आरम्भ है, इसलिए अंत में अल्पविराम रखा गया है।
