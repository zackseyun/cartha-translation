  text: בְּ֭נִ/י אִם עָרַ֣בְתָּ לְ/רֵעֶ֑/ךָ תָּקַ֖עְתָּ לַ/זָּ֣ר כַּפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/001.yaml
  text: My son[a], if you have gone surety for your neighbor, if you have struck your hands in pledge to a stranger[b],
translation:
  language: hi
  text: मेरे बेटे, यदि तू अपने पड़ोसी[a] का जामिन बना है, यदि तूने किसी अपरिचित के साथ हाथ मिलाकर जमानत की प्रतिज्ञा की है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने मित्र’ अथवा ‘अपने साथी’।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक: ‘तूने किसी अपरिचित को अपनी हथेलियाँ मारी हैं।’ यह जमानत या प्रतिज्ञा पक्की करने के लिए हाथ मिलाने या हथेलियाँ मिलाने का प्राचीन संकेत था।'
    reason: cultural_note
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: यह पिता या शिक्षक द्वारा पुत्र को किया गया आत्मीय, पुल्लिंग एकवचन संबोधन है; ‘हे मेरे बेटे’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; दोनों समानांतर क्रियाओं के साथ ‘यदि’ दोहराने से इब्रानी संरचना स्पष्ट रहती है।
- source_word: עָרַבְתָּ
  choice: जामिन बना है
  rationale: यह किसी दूसरे के ऋण या दायित्व की जिम्मेदारी लेने को दर्शाता है। ‘जामिन बनना’ कानूनी-वित्तीय भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְרֵעֶךָ
  choice: अपने पड़ोसी का
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या मित्र हो सकता है। ‘पड़ोसी’ इसके व्यापक सामाजिक अर्थ को बनाए रखता है; विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: תָּקַעְתָּ ... כַּפֶּיךָ
  choice: हाथ मिलाकर प्रतिज्ञा की है
  rationale: शाब्दिक रूप से हाथों को मारने या clasp करने का चित्र है, जो किसी प्रतिज्ञा या जमानत को पक्का करने की प्राचीन रीति बताता है। हिन्दी में ‘हाथ मिलाकर प्रतिज्ञा करना’ अर्थ और सांस्कृतिक संकेत दोनों को संप्रेषित करता है।
- source_word: לַזָּר
  choice: किसी पराए व्यक्ति के साथ
  rationale: זָר किसी अपरिचित, बाहरी या पराए व्यक्ति को दर्शाता है। ‘पराया व्यक्ति’ संबंधगत दूरी को बनाए रखता है और ‘के साथ’ हाथ मिलाने की हिन्दी अभिव्यक्ति के अनुरूप है।
