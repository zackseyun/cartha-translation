  yaml_path: translation/ot/proverbs/006/019.yaml
  text: a false witness who breathes out lies[b][a], and one who sends out strife among brothers.
translation:
  language: hi
  text: झूठा गवाह, जो झूठ उगलता है,[a] और भाइयों के बीच झगड़े फैलाने वाला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठ बोलने वाला झूठा गवाह।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “भाइयों के बीच” है; यहाँ सगे भाइयों के साथ-साथ किसी निकट समुदाय के सदस्यों का भी संकेत हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: יָפִיחַ
  choice: उगलता है
  rationale: हिफ़ील रूप का मूल चित्र साँस बाहर निकालने का है और यहाँ यह बोलने के लिए रूपक है। ‘उगलता है’ इस सजीव, निरंतर झूठ बोलने के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: बहुवचन संज्ञा का अर्थ झूठी बातें या असत्य है। हिन्दी में सामूहिक अर्थ वाला ‘झूठ’ सबसे सहज और प्रभावी है।
- source_word: עֵד שָׁקֶר
  choice: झूठा गवाह
  rationale: यह पदबंध विधिक और नैतिक दोनों संदर्भों में असत्य गवाही देने वाले व्यक्ति को दर्शाता है; ‘झूठा गवाह’ हिन्दी का स्पष्ट और प्रचलित रूप है।
- source_word: וּמְשַׁלֵּחַ
  choice: फैलाने वाला
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है, पर झगड़ों के साथ इसका आशय उन्हें लोगों के बीच फैलाना है। यह चयन मूल क्रिया की दिशा और प्रसार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְדָנִים
  choice: झगड़े
  rationale: यह संज्ञा विवादों, कलहों या आपसी तकरार को दर्शाती है। ‘झगड़े’ साधारण पाठक के लिए सहज है और बहुवचन को भी सुरक्षित रखता है।
- source_word: בֵּין אַחִים
  choice: भाइयों के बीच
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है। ‘भाइयों’ मूल के पुल्लिंग बहुवचन तथा उसके पारिवारिक-सामुदायिक रंग को बनाए रखता है।
theological_decisions:
- issue: אַחִים का लिंगयुक्त संबंध-सूचक अर्थ
  choice: भाइयों
  alternative: भाई-बहनों / समुदाय के लोगों
  rationale: मूल शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। वह व्यापक निकट समुदाय को भी सूचित कर सकता है, पर मुख्य पाठ में ‘भाइयों’ मूल रूप और सामाजिक बनावट को सुरक्षित रखता है; व्यापक अर्थ पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झूठ उगलता है’ मूल के सजीव रूपक को बनाए रखता है, जबकि ‘झगड़े फैलाने वाला’ शब्दशः ‘भेजने’ की अस्वाभाविक हिन्दी से बचते हुए उसके प्रसारकारी भाव को व्यक्त करता है। यह पद पिछले पदों से चली आ रही सूची का अंश है, इसलिए इसकी खंडात्मक वाक्य-संरचना सुरक्षित रखी गई है।
