  register: आधुनिक मानक हिंदी में एकवचन अनौपचारिक आज्ञार्थक शैली रखी गई है, जो आसपास के नीतिवचन-संबोधन के अनुरूप है। दोनों समांतर आदेशों और हृदय तथा गले की मूल शारीरिक रूपक-छवियों को सुरक्षित रखा गया है।
