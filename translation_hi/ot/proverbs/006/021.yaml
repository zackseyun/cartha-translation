  text: Bind them on your heart continually[b][a]; tie them around your neck.
translation:
  language: hi
  text: उन्हें सदा अपने हृदय पर बाँध; उन्हें अपने गले में बाँध।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: उन्हें…बाँधे रख
  rationale: קשר का क़ाल आज्ञार्थक रूप किसी वस्तु को बाँधने का ठोस चित्र प्रस्तुत करता है। ‘बाँधे रख’ आज्ञा के साथ निरंतरता का भाव भी स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לִבְּךָ
  choice: अपने हृदय पर
  rationale: לֵב विचार, इच्छा और भीतरी व्यक्तित्व का सूचक हो सकता है; ‘हृदय’ मूल शारीरिक रूपक को बनाए रखते हुए हिंदी में इस व्यापक अर्थ को ग्रहण कर सकता है।
- source_word: תָמִיד
  choice: सदा
  rationale: यह क्रियाविशेषण निरंतर और नियमित स्थायित्व व्यक्त करता है। ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिंदी विकल्प है।
- source_word: עָנְדֵם
  choice: उन्हें…पहने रह
  rationale: ענד का अर्थ आभूषण की तरह पहनना या बाँधना है। गले के संदर्भ में ‘पहने रह’ हिंदी में स्वाभाविक है और पहले क्रियापद ‘बाँधे रख’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: גַּרְגְּרֹתֶךָ
  choice: अपने गले में
  rationale: शब्द गले या कंठ के क्षेत्र को दर्शाता है; यहाँ पहनने के चित्र के कारण ‘गले में’ सबसे स्वाभाविक हिंदी अभिव्यक्ति है।
