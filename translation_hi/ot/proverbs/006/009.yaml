  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों प्रश्नों की समानांतर रचना और फटकार का सीधा स्वर सुरक्षित है; पुल्लिंग एकवचन संबोधन मूल के अनुरूप है, पर कहावत में प्रतिनिधिक रूप से प्रयुक्त है।
