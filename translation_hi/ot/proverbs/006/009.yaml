source:
  edition: WLC
  text: עַד מָתַ֖י עָצֵ֥ל תִּשְׁכָּ֑ב מָ֝תַ֗י תָּק֥וּם מִ/שְּׁנָתֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/009.yaml
  text: How long[a], sluggard, will you lie there? When will you rise from your sleep?
translation:
  language: hi
  text: हे आलसी[a], तू कब तक पड़ा रहेगा? तू अपनी नींद से कब उठेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे सुस्त व्यक्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह इब्रानी अवधि पूछने वाला मुहावरा है; ‘कब तक’ स्वाभाविक हिन्दी में फटकार का स्वर बनाए रखता है।
- source_word: עָצֵל
  choice: आलसी
  rationale: नीतिवचन में यह आदतन परिश्रम से बचने वाले व्यक्ति के लिए प्रयुक्त पारिभाषिक संबोधन है। ‘आलसी’ आधुनिक हिन्दी में सहज और प्रतिनिधिक है।
- source_word: תִּשְׁכָּב
  choice: पड़ा रहेगा
  rationale: मूल क्रिया का अर्थ ‘लेटना/पड़े रहना’ है। प्रसंग में लगातार बिस्तर पर निष्क्रिय रहने का भाव है, जिसे ‘पड़ा रहेगा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָתַי
  choice: कब
  rationale: दूसरे प्रश्न का सीधा प्रश्नवाचक क्रियाविशेषण है; ‘कब’ इसका निकटतम स्वाभाविक हिन्दी रूप है।
- source_word: תָּקוּם
  choice: उठेगा
  rationale: क्रिया का अर्थ ‘उठना’ है; नींद के प्रसंग में ‘उठेगा’ स्पष्ट, संक्षिप्त और स्वाभाविक है।
- source_word: מִשְּׁנָתֶךָ
  choice: अपनी नींद से
  rationale: संज्ञा ‘नींद’ के साथ द्वितीय पुरुष एकवचन संबंधसूचक प्रत्यय है। हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए ‘अपनी नींद से’ स्वाभाविक है।
theological_decisions: []
