lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: यह इब्रानी मानवशास्त्रीय बिंब को बनाए रखता है; यहाँ हृदय विचार और इरादे सहित भीतरी मनुष्य को दर्शाता है।
- source_word: חֹרֵשׁ
  choice: रचता है
  rationale: इस आलंकारिक प्रयोग में क्रिया का अर्थ योजना बनाना या षड्यंत्र रचना है; ‘रचता है’ स्वाभाविक हिंदी में जानबूझकर बनाई गई योजना का भाव देता है।
- source_word: מַחְשְׁבוֹת
  choice: योजनाएँ
  rationale: यह संज्ञा विचारों, युक्तियों या योजनाओं को दर्शा सकती है; प्रसंग में ‘योजनाएँ’ सोची-समझी मंशा को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: אָוֶן
  choice: दुष्ट
  rationale: यह शब्द दुष्टता, अधर्म या अनिष्ट का बोध करा सकता है; यहाँ यह योजनाओं की नैतिक भ्रष्टता बताता है और अगले खंड के ‘बुराई’ से अनावश्यक पुनरावृत्ति भी बचाता है।
- source_word: רַגְלַיִם
  choice: पैर
  rationale: शरीर-अंग का प्रत्यक्ष बिंब सुरक्षित रखा गया है; नीति-वचन में पैर बुराई की ओर तत्पर गति के साधन के रूप में आते हैं।
- source_word: מְמַהֲרוֹת
  choice: उतावले रहते हैं
  rationale: कृदंत जल्दबाज़ी के साथ-साथ तत्परता या उत्सुकता का भाव देता है; ‘उतावले रहते हैं’ बुराई की ओर जाने की eagerness को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לָרוּץ
  choice: दौड़ने को
  rationale: अनंत क्रिया का सीधा अर्थ ‘दौड़ना’ है और यह बुराई की ओर तीव्र, उत्सुक गति के बिंब को बनाए रखता है।
- source_word: לָרָעָה
  choice: बुराई की ओर
  rationale: पूर्वसर्ग और संज्ञा का दिशात्मक भाव ‘बुराई की ओर’ से स्पष्ट होता है; ‘बुराई करने’ कहने पर मूल में निहित न होने वाली क्रियात्मक व्याख्या जुड़ जाती।
