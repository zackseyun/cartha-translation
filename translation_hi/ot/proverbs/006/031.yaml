id: PRO.6.31
reference: Proverbs 6:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֭/נִמְצָא יְשַׁלֵּ֣ם שִׁבְעָתָ֑יִם אֶת כָּל ה֖וֹן בֵּית֣/וֹ יִתֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/031.yaml
  text: Yet if he is found[a], he must repay sevenfold; he must give all the wealth of his house.
translation:
  language: hi
  text: परन्तु यदि वह पकड़ा जाए, तो उसे सात गुना[a] चुकाना होगा; उसे अपने घर की सारी सम्पत्ति देनी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सात बार।’ इब्रानी अभिव्यक्ति का अर्थ सात गुना भरपाई अथवा सात के परिमाण में भुगतान हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצָא
  choice: परन्तु यदि वह पकड़ा जाए
  rationale: 'संयोजक וְ और נִמְצָא का निफ़अल रूप पिछले पद से विरोधात्मक मोड़ प्रस्तुत करता है: भूखे चोर के प्रति सहानुभूति हो सकती है, फिर भी पकड़े जाने पर उसे भरपाई करनी होगी। ‘यदि’ प्रसंग में स्वाभाविक शर्त व्यक्त करता है।'
- source_word: יְשַׁלֵּם
  choice: उसे ... चुकाना होगा
  rationale: שלם का पिएल रूप यहाँ भरपाई या पुनर्भुगतान का बोध देता है। ‘चुकाना होगा’ आधुनिक हिन्दी में कानूनी और बाध्यकारी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁבְעָתָיִם
  choice: सात गुना
  rationale: यह संख्यावाचक क्रियाविशेषण कई गुना भरपाई का संकेत देता है। ‘सात गुना’ संक्षिप्त और प्रचलित हिन्दी रूप है, जबकि पादटिप्पणी ‘सात बार’ की सम्भावित अभिव्यक्ति को सुरक्षित रखती है।
- source_word: אֶת כָּל הוֹן בֵּיתוֹ
  choice: अपने घर की सारी सम्पत्ति
  rationale: הוֹן का अर्थ धन, सम्पत्ति या साधन है। यह अनुवाद मूल सम्बन्धसूचक रचना और घराने की समस्त सम्पत्ति दे देने के भाव को बनाए रखता है।
- source_word: יִתֵּן
  choice: उसे ... देनी होगी
  rationale: נתן यहाँ भुगतान के लिए सम्पत्ति सौंपने की ठोस क्रिया बताता है। ‘देनी होगी’ पहले खंड के बाध्यकारी भाव के समानान्तर है।
