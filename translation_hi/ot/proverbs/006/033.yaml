lexical_decisions:
- source_word: נֶגַע
  choice: चोट
  rationale: यह शब्द आघात, घाव या पीड़ा का बोध करा सकता है। व्यभिचार के परिणामों के इस संदर्भ में ‘चोट’ शारीरिक हानि और व्यापक नुकसान—दोनों की संभावना खुली रखता है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह सार्वजनिक अनादर और लज्जा को व्यक्त करता है; आधुनिक हिन्दी में ‘अपमान’ स्वाभाविक और स्पष्ट है।
- source_word: יִמְצָא
  choice: मिलेगा
  rationale: מצא का मूल अर्थ ‘पाना’ है; यहाँ भाव यह है कि ये परिणाम उस व्यक्ति के हिस्से में आएँगे। ‘मिलेगा’ हिन्दी में इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: חֶרְפָּתוֹ
  choice: उसकी बदनामी
  rationale: חֶרְפָּה निंदा, तिरस्कार और लोगों के बीच बनी रहने वाली लज्जा का बोध कराता है। ‘बदनामी’ इसके सार्वजनिक और स्थायी सामाजिक पक्ष को स्पष्ट करती है।
- source_word: לֹא תִמָּחֶה
  choice: कभी नहीं मिटेगी
  rationale: מחה के निफ़अल रूप का अर्थ मिटा दिया जाना या पोंछ दिया जाना है। ‘कभी नहीं मिटेगी’ हिब्रू के निषेध और स्थायी परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
