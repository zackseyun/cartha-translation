  text: Go to the ant[a], you sluggard[b]; consider her ways and become wise.
translation:
  language: hi
  text: हे आलसी, चींटी के पास जा; उसके तौर-तरीकों को देख[a] और बुद्धिमान बन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके मार्गों को देख और बुद्धिमान बन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: जा
  rationale: הלך का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘जा’ सीधे और स्वाभाविक ढंग से exhortation की शक्ति बनाए रखता है।
- source_word: אֶל
  choice: के पास
  rationale: यह दिशा या लक्ष्य बताने वाला पूर्वसर्ग है। इस प्रसंग में ‘चींटी के पास जा’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: נְמָלָה
  choice: चींटी
  rationale: यह एकवचन संज्ञा पूरी जाति के प्रतिनिधि उदाहरण के रूप में प्रयुक्त है। हिन्दी में बिना अनिश्चित उपपद के ‘चींटी’ यही अर्थ सहजता से देता है।
- source_word: עָצֵל
  choice: हे आलसी
  rationale: यह आलसी व्यक्ति को किया गया सीधा, पुल्लिंग एकवचन संबोधन है। ‘हे आलसी’ फटकार और नीतिवचन की गरिमा दोनों बनाए रखता है।
- source_word: רְאֵה
  choice: देखो
  rationale: मूल क्रिया का सीधा अर्थ ‘देखना’ है, पर यहाँ ध्यानपूर्वक देखकर सीखना निहित है। ‘देखो’ मूल बिंब को बचाता है और सन्दर्भ में निरीक्षण का भाव भी देता है।
- source_word: דְרָכֶיהָ
  choice: उसके तौर-तरीकों को
  rationale: शाब्दिक अर्थ ‘उसके मार्गों’ है; नीतिवचन में ‘मार्ग’ आचरण और काम करने के ढंग का संकेत देता है। ‘तौर-तरीके’ साधारण आधुनिक हिन्दी में यह आशय स्पष्ट करता है। ‘उसके’ चींटी के स्त्रीलिंग होने के साथ स्वाभाविक रूप से मेल खाता है।
- source_word: וַחֲכָם
  choice: और बुद्धिमान बनो
  rationale: חכם का आज्ञार्थक रूप यहाँ निरीक्षण के फलस्वरूप बुद्धि प्राप्त करने का आह्वान करता है। ‘बुद्धिमान बनो’ केवल स्थिर अवस्था नहीं, परिवर्तन या सीखने की दिशा भी व्यक्त करता है।
theological_decisions:
- issue: וַחֲכָם में अवस्था और परिणाम का संबंध
  choice: और बुद्धिमान बनो
  alternative: और बुद्धिमान हो
  rationale: रूप को आज्ञा के रूप में रखते हुए ‘बनो’ चींटी को देखकर बुद्धि सीखने के परिणाममुखी भाव को स्वाभाविक हिन्दी में व्यक्त करता है; यह किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। एकवचन संबोधन के कारण ‘जा’ है, जबकि ‘देखो’ और ‘बनो’ सम्मानार्थ नहीं बल्कि सामान्य हिन्दी में कठोरता को कुछ संतुलित करने वाले आज्ञार्थक रूप हैं। ‘तौर-तरीके’ पाठक को चींटी के व्यवहार और कार्य-पद्धति पर ध्यान देने का आशय सहजता से समझाता है।
