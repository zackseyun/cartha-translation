translation:
  language: hi
  text: तू अपने मुँह की बातों से जाल में फँस गया है[a]; अपने मुँह की बातों से तू पकड़ा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू अपने मुँह की बातों से जाल में फँसा हुआ है।” इब्रानी के पूर्ण क्रियारूप वर्तमान में बनी हुई दशा पर बल दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹקַשְׁתָּ
  choice: जाल में फँस गया है
  rationale: निफ़ाल रूप किसी फंदे या जाल में फँसने का भाव देता है। ‘जाल में फँस गया है’ मूल रूपक को स्पष्ट रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: בְאִמְרֵי
  choice: बातों से
  rationale: यहाँ ב साधन का बोध कराता है और אִמְרֵי बोले गए शब्दों को दर्शाता है। ‘बातों से’ हिन्दी में सहज है और बताता है कि व्यक्ति अपनी ही कही बातों के कारण फँसा।
- source_word: פִיךָ
  choice: अपने मुँह की
  rationale: मूल पाठ का ठोस मुहावरा ‘तेरा मुँह’ है। ‘अपने मुँह की’ हिन्दी में स्वाभाविक रूप से आत्मसंबंध व्यक्त करता है और मूल समानांतरता बनाए रखता है।
- source_word: נִלְכַּדְתָּ
  choice: पकड़ा गया है
  rationale: לכד का निफ़ाल पकड़े जाने का अर्थ देता है। यह पहले खंड के ‘जाल में फँस गया है’ के साथ पर्यायात्मक समानांतरता और हल्की तीव्रता बनाए रखता है।
