  text: תָּכִ֣ין בַּ/קַּ֣יִץ לַחְמָ֑/הּ אָגְרָ֥ה בַ֝/קָּצִ֗יר מַאֲכָלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/008.yaml
  text: it prepares its food in summer[b][a]; it gathers its provisions at harvest.
translation:
  language: hi
  text: वह गरमी में अपना भोजन तैयार करती है[a]; कटनी के समय अपना आहार बटोरती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘अपनी रोटी’; यहाँ इसका व्यापक अर्थ ‘अपना भोजन’ या ‘अपनी जीविका’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘कटनी के समय अपना भोजन जमा करती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין
  choice: तैयार करती है
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को तैयार करने या तत्पर रखने का भाव देता है; चींटी के परिश्रम के संदर्भ में यह सहज और सटीक है।
- source_word: בַּקַּיִץ
  choice: गरमी में
  rationale: यह समय-सूचक पद गरमी के मौसम को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘गरमी में’ स्वाभाविक है।
- source_word: לַחְמָהּ
  choice: अपना भोजन
  rationale: לֶחֶם का शाब्दिक अर्थ प्रायः ‘रोटी’ है, पर यहाँ चींटी के संदर्भ में व्यापक अर्थ ‘भोजन’ अभिप्रेत है।
- source_word: אָגְרָה
  choice: बटोरती है
  rationale: क्रिया का अर्थ इकट्ठा करना, विशेषतः संग्रह के लिए जमा करना, है। ‘बटोरती है’ मूल क्रिया को सीधे व्यक्त करता है और संचय का भाव संदर्भ में बनाए रखता है।
- source_word: בַקָּצִיר
  choice: कटनी के समय
  rationale: यह कटनी या फसल काटने के समय को दर्शाता है; यह रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: מַאֲכָלָהּ
  choice: अपना आहार
  rationale: מַאֲכָל खाने की वस्तु या भोजन को दर्शाता है। ‘आहार’ पहले चरण के ‘भोजन’ से हल्का शैलीगत भेद बनाए रखते हुए अर्थ को स्पष्ट रखता है।
