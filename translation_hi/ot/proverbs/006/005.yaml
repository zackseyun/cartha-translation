  text: Rescue yourself like a gazelle from the hand[c][b][a], and like a bird from the hand of the fowler.
translation:
  language: hi
  text: अपने आपको छुड़ा ले[a]—जैसे चिकारा हाथ[c] से छूटता है, और जैसे पक्षी बहेलिये के हाथ से छूटता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने आपको बचा ले,’ ‘अपने को छुड़ा ले,’ या ‘भाग निकल।’ इब्रानी आज्ञार्थक में तुरंत छूट निकलने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: पहले उपमान में इब्रानी पाठ केवल ‘हाथ से’ कहता है; हाथ का स्वामी अनिर्दिष्ट है। संदर्भानुसार ‘फंदा लगानेवाले के हाथ से’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּצֵל
  choice: अपने आपको छुड़ा ले
  rationale: नצל के निफ़अल आज्ञार्थक, द्वितीय पुरुष एकवचन रूप में स्वयं को तत्काल बंधन या नियंत्रण से मुक्त करने का आग्रह है। यह अनुवाद आत्मवाचक अर्थ और आज्ञा की तीव्रता दोनों बनाए रखता है।
- source_word: כִּצְבִי
  choice: जैसे चिकारा
  rationale: צְבִי यहाँ सामान्यतः गज़ेल जाति के पशु को दर्शाता है। आधुनिक हिंदी में ‘चिकारा’ इस चित्र को ‘हिरन’ की अपेक्षा अधिक सटीक रूप से व्यक्त करता है।
- source_word: מִיָּד
  choice: हाथ से
  rationale: יָד का मूल अर्थ ‘हाथ’ है और प्रसंग में यह पकड़ या वश का संकेत भी देता है। मूल पाठ की संक्षिप्तता और पहले उपमान में कर्ता की अनिर्दिष्टता बनाए रखने के लिए ‘हाथ से’ रखा गया है।
- source_word: וּכְצִפּוֹר
  choice: और जैसे पक्षी
  rationale: צִפּוֹר किसी पक्षी, प्रायः छोटे पक्षी, के लिए सामान्य शब्द है; किसी विशेष जाति का संकेत न होने से ‘पक्षी’ उपयुक्त है।
- source_word: מִיַּד יָקוּשׁ
  choice: बहेलिये के हाथ से
  rationale: יָקוּשׁ फंदा लगाने या पक्षी पकड़नेवाले व्यक्ति को दर्शाता है। पक्षी के उपमान में ‘बहेलिया’ स्वाभाविक है, और ‘हाथ से’ मूल समानांतर रचना को बनाए रखता है।
