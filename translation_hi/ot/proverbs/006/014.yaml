  text: תַּֽהְפֻּכ֨וֹת בְּ/לִבּ֗/וֹ חֹרֵ֣שׁ רָ֣ע בְּ/כָל עֵ֑ת מדנים יְשַׁלֵּֽחַ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/014.yaml
  text: Perversity is in his heart[a]; he devises evil at all times; he sends out strife.
translation:
  language: hi
  text: उसके मन में कुटिलता है; वह हर समय बुराई की योजनाएँ बनाता है; वह झगड़े फैलाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּהְפֻּכוֹת
  choice: कुटिलता
  rationale: यह बहुवचन भाववाचक संज्ञा नैतिक टेढ़ेपन और विकृत प्रवृत्ति को व्यक्त करती है। आधुनिक हिन्दी में ‘कुटिलता’ इस आंतरिक स्वभाव को स्वाभाविक और संक्षिप्त रूप से बताती है।
- source_word: בְּלִבּוֹ
  choice: उसके मन में
  rationale: इब्रानी ‘हृदय’ यहाँ व्यक्ति के आंतरिक विचार, इच्छा और प्रवृत्ति का केंद्र है; सामान्य आधुनिक हिन्दी में ‘मन’ यही अर्थ अधिक सहजता से व्यक्त करता है।
- source_word: חֹרֵשׁ רָע
  choice: वह बुराई की योजनाएँ बनाता है
  rationale: חֹרֵשׁ का मूल अर्थ जोतना है, पर यहाँ इसका मुहावरेदार अर्थ बुरी योजना गढ़ना या षड्यंत्र रचना है। चुना गया वाक्यांश सोची-समझी दुष्ट मंशा को स्पष्ट रखता है।
- source_word: בְּכָל־עֵת
  choice: हर समय
  rationale: यह पद लगातार और आदतन किए जाने वाले काम को दर्शाता है; ‘हर समय’ निकट और स्वाभाविक हिन्दी है।
- source_word: מְדָנִים
  choice: झगड़े
  rationale: बहुवचन संज्ञा विवादों और आपसी संघर्षों को दर्शाती है। ‘झगड़े’ सामान्य पाठक के लिए स्पष्ट है और बहुवचन को भी सुरक्षित रखता है।
- source_word: יְשַׁלֵּחַ
  choice: फैलाता है
  rationale: पिएल रूप का अर्थ यहाँ झगड़ों को भेजना, छोड़ना या फैलाना है। ‘फैलाता है’ इब्रानी बिंब के प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
