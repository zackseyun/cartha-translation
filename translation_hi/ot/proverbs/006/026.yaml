  text: כִּ֤י בְעַד אִשָּׁ֥ה זוֹנָ֗ה עַֽד כִּכַּ֫ר לָ֥חֶם וְ/אֵ֥שֶׁת אִ֑ישׁ נֶ֖פֶשׁ יְקָרָ֣ה תָצֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/026.yaml
  text: For because of a prostitute one is reduced to a loaf of bread[c][b][a], but a married woman hunts a precious life.
translation:
  language: hi
  text: क्योंकि वेश्या के कारण व्यक्ति एक रोटी तक का मोहताज हो जाता है,[a] पर विवाहिता स्त्री[b] अनमोल प्राण को फँसाती है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप से: “क्योंकि वेश्या के कारण, एक रोटी तक।” इब्रानी वाक्य अत्यंत संक्षिप्त है; अनेक लोग इसका अर्थ यह समझते हैं कि व्यक्ति घोर गरीबी में पहुँच जाता है।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “किसी पुरुष की पत्नी”; प्रसंग में किसी दूसरे पुरुष की पत्नी के साथ व्यभिचारी संबंध अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या “अनमोल जीवन” अथवा “अनमोल स्वयं।” इब्रानी शब्द का अर्थ ‘प्राण,’ ‘जीवन’ या ‘स्वयं’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है; हिंदी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְעַד
  choice: के कारण
  rationale: यहाँ पूर्वसर्ग कारण अथवा परिणाम का संकेत देता है।
- source_word: אִשָּׁה זוֹנָה
  choice: वेश्या
  rationale: आधुनिक हिंदी में यह शब्द स्पष्ट और स्रोत के अर्थ के अनुरूप है।
- source_word: עַד כִּכַּר לָחֶם
  choice: बस एक रोटी तक रह जाता है
  rationale: इब्रानी वाक्यांश अत्यंत संक्षिप्त है। यह अनुवाद रोटी की मूल छवि बनाए रखते हुए कंगाली तक पहुँचने के सामान्यतः समझे गए परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְאֵשֶׁת אִישׁ
  choice: पर विवाहिता स्त्री
  rationale: शाब्दिक अर्थ ‘किसी पुरुष की पत्नी’ है। प्रसंग में व्यभिचार के लिए किसी दूसरे पुरुष की पत्नी अभिप्रेत है; ‘विवाहिता स्त्री’ अनावश्यक विस्तार किए बिना इसे व्यक्त करता है। संयोजक וְ को पंक्तियों के अर्थगत विरोध के कारण ‘पर’ किया गया है।
- source_word: נֶפֶשׁ יְקָרָה
  choice: अनमोल जीवन
  rationale: נֶפֶשׁ का अर्थ प्राण, स्वयं या जीवन हो सकता है। यहाँ प्राणघातक संकट की चेतावनी में ‘जीवन’ उपयुक्त है, जबकि ‘अनमोल’ יְקָרָה का भाव रखता है।
- source_word: תָצוּד
  choice: शिकार करती है
  rationale: यह क्रिया शिकार करने या फँसाने का सजीव रूपक प्रस्तुत करती है; हिंदी में ‘शिकार करती है’ उस रूपक को बनाए रखता है।
theological_decisions:
- issue: נֶפֶשׁ को ‘जीवन’ या ‘प्राण’ के रूप में समझना
  choice: मुख्य पाठ में ‘जीवन’
  alternative: ‘अनमोल प्राण’ अथवा ‘अनमोल आत्मा’
  rationale: प्रसंग में व्यक्ति के जीवन और संपूर्ण विनाश पर संकट प्रमुख है; फिर भी शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की संक्षिप्तता के कारण पहली पंक्ति में निहित परिणाम को सीमित रूप से स्पष्ट किया गया है, जबकि शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
