source:
  edition: WLC
  text: כִּֽי קִנְאָ֥ה חֲמַת גָּ֑בֶר וְ/לֹֽא יַ֝חְמ֗וֹל בְּ/י֣וֹם נָקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/034.yaml
  text: For jealousy is a man's fury, and he will show no mercy on the day of vengeance.
translation:
  language: hi
  text: क्योंकि ईर्ष्या पुरुष के प्रचंड क्रोध को भड़काती है, और वह प्रतिशोध के दिन दया नहीं करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קִנְאָה
  choice: ईर्ष्या
  rationale: संदर्भ में यह पत्नी के प्रति दूसरे पुरुष के संबंध से उत्पन्न पति की प्रबल जलन को व्यक्त करता है; आधुनिक हिन्दी में ‘ईर्ष्या’ स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: חֲמַת גָּבֶר
  choice: पुरुष का क्रोध भड़का देती है
  rationale: 'शाब्दिक संरचना ‘पुरुष का प्रचंड क्रोध’ है, पर निर्उपपद संज्ञा-वाक्य के कारण कारणात्मक संबंध निहित है: ईर्ष्या उसके क्रोध को उभारती है। यह हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: יַחְמוֹל
  choice: दया नहीं करेगा
  rationale: क्रिया का अर्थ किसी को छोड़ देना, तरस खाना या दया करना है; यहाँ प्रतिशोध के समय क्षमा न दिखाने का भाव है।
- source_word: בְּיוֹם נָקָם
  choice: बदला लेने के दिन
  rationale: ‘प्रतिशोध के दिन’ की अपेक्षा यह साधारण पाठक के लिए अधिक स्वाभाविक है और उस अवसर को दर्शाता है जब आहत पति बदला लेता है।
theological_decisions:
- issue: क्या ‘बदला लेने का दिन’ दैवी न्याय का पारिभाषिक संकेत है?
  choice: इसे आहत पति के प्रतिशोध के अवसर के रूप में प्रस्तुत किया गया है।
  alternative: इसे परमेश्वर के अंतिम न्याय अथवा दैवी प्रतिशोध के दिन का संकेत मानना।
  rationale: निकटवर्ती संदर्भ (नीतिवचन 6:32–35) व्यभिचार से क्रोधित पति की प्रतिक्रिया का वर्णन करता है; इसलिए यहाँ मानवीय प्रतिशोध अभिप्रेत है, यद्यपि पद उस प्रतिशोध को नैतिक रूप से अनुमोदित करने के बजाय उसके कठोर परिणाम की चेतावनी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और चेतावनीपूर्ण नीतिवचन-शैली। ‘पुरुष’ से संदर्भगत पति/आहत पुरुष का अर्थ बना रहता है, जबकि मूल के גָּבֶר का सामान्य रूप अनावश्यक रूप से संकुचित नहीं किया गया।
