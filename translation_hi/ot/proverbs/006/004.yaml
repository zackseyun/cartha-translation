review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the prohibition, the parallel body parts, and the distinction between sleep (שֵׁנָה) and slumber/drowsing (תְּנוּמָה). However, “पलकों को ऊँघने दे” assigns the action of dozing directly to eyelids and is not idiomatic Hindi. The Hebrew retains the ‘give X to Y’ construction, but Hindi needs a more natural expression while preserving the poetic parallel.
  naturalness: “अपनी आँखों को सोने न दे, और न अपनी पलकों को झपकी लेने दे” is natural modern standard Hindi, concise, and appropriately proverbial. “झपकी लेने” conveys light sleep rather than mere blinking.
  terminology: “नींद” and “झपकी” preserve the lexical contrast between שֵׁנָה and תְּנוּמָה. “आँखें” and “पलकें” accurately maintain the Hebrew parallelism. No theological terminology is involved.
  issues:
  - severity: medium
    issue: “अपनी पलकों को ऊँघने दे” is semantically and idiomatically awkward.
    rationale: In natural Hindi, a person dozes or takes a nap; eyelids do not normally ‘doze.’ The phrase obscures the intended image of refusing even a brief nap.
  revised_text: अपनी आँखों को सोने न दे, और न अपनी पलकों को झपकी लेने दे।
  revised_footnotes:
  - marker: a
    text: या, “ऊँघने दे।” इब्रानी शब्द हल्की नींद या झपकी का भाव देता है।
    reason: lexical_alternative
