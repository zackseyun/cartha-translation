  text: אַל תִּתֵּ֣ן שֵׁנָ֣ה לְ/עֵינֶ֑י/ךָ וּ֝/תְנוּמָ֗ה לְ/עַפְעַפֶּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/004.yaml
  text: Do not give sleep to your eyes[a], nor slumber to your eyelids.
translation:
  language: hi
  text: अपनी आँखों को सोने न दे, और न अपनी पलकों को झपकी लेने दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: न दे
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। ‘न दे’ मूल के ठोस मुहावरे को बनाए रखता है और हिंदी में काव्यात्मक रूप से स्पष्ट है।
- source_word: שֵׁנָה
  choice: नींद
  rationale: इस शब्द का सामान्य और संदर्भानुकूल अर्थ ‘नींद’ है।
- source_word: לְעֵינֶיךָ
  choice: अपनी आँखों को
  rationale: לְ यहाँ अप्रत्यक्ष कर्म को चिह्नित करता है; यह अनुवाद मूल के ‘आँखों को नींद देना’ मुहावरे और देह-अंग समानांतरता को सुरक्षित रखता है।
- source_word: וּתְנוּמָה
  choice: और न … ऊँघने दे
  rationale: תְּנוּמָה हल्की नींद या ऊँघ को दर्शाता है। हिंदी में ‘ऊँघने दे’ पहले चरण की क्रियात्मक बनावट के साथ स्वाभाविक है और שֵׁנָה से अर्थगत भेद बनाए रखता है।
- source_word: לְעַפְעַפֶּיךָ
  choice: अपनी पलकों को
  rationale: עַפְעַף का सीधा अर्थ ‘पलक’ है; यह आँखों और पलकों की काव्यात्मक समानांतरता बनाए रखता है।
