  text: क्या कोई पुरुष आग को अपनी छाती से लगाकर रख सकता है, और उसके कपड़े न जलें?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी गोद में” अथवा “अपनी छाती के पास”; इब्रानी शब्द छाती या गोद के उस क्षेत्र को दर्शाता है, जिसमें संभवतः वस्त्र की वह तह भी शामिल है जहाँ कोई चीज़ शरीर के पास रखी जा सकती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְתֶּה
  choice: लगा सकता है
  rationale: חתה का अर्थ आग या अंगारे उठा लेना हो सकता है। यहाँ आग को शरीर के एकदम पास रखने का चित्र है; ‘छाती से आग लगा सकता है’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और इस नीतिवचन के प्रसंग में पुरुष को ही संबोधित करता है।
- source_word: אֵשׁ
  choice: आग
  rationale: यह सीधा और स्वाभाविक हिन्दी समानार्थक है।
- source_word: בְּחֵיקוֹ
  choice: अपनी छाती से
  rationale: חֵיק छाती, गोद, अथवा वस्त्र की उस तह का क्षेत्र बताता है जहाँ कोई वस्तु शरीर के पास रखी जाती है। ‘अपनी छाती से’ निकटता और खतरे के चित्र को बनाए रखता है।
- source_word: וּבְגָדָיו
  choice: और उसके कपड़े
  rationale: בְּגָדִים के लिए ‘कपड़े’ आधुनिक मानक हिन्दी का स्वाभाविक शब्द है।
- source_word: לֹא תִשָּׂרַפְנָה
  choice: न जलें
  rationale: निफ़अल रूप कपड़ों के जल जाने को व्यक्त करता है; हिन्दी में ‘न जलें’ इसी निष्क्रिय परिणाम को सहज रूप से बताता है।
