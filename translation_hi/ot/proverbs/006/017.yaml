translation:
  language: hi
  text: घमंड से उठी हुई आँखें, झूठ बोलने वाली जीभ, और निर्दोष का खून बहाने वाले हाथ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַיִם רָמוֹת
  choice: घमंड से उठी हुई आँखें
  rationale: शाब्दिक चित्र ‘ऊँची/उठी हुई आँखें’ को बनाए रखते हुए उसके नैतिक अर्थ, अर्थात घमंड, को आधुनिक हिंदी में स्पष्ट करता है।
- source_word: לְשׁוֹן שָׁקֶר
  choice: झूठ बोलने वाली जीभ
  rationale: ‘जीभ’ की देह-अंग वाली काव्यात्मक छवि सुरक्षित रहती है और שָׁקֶר का सक्रिय आशय स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: יָדַיִם שֹׁפְכוֹת
  choice: बहाने वाले हाथ
  rationale: बहुवचन ‘हाथ’ और कृदंत की चरित्रसूचक क्रिया दोनों को हिंदी में बनाए रखता है।
- source_word: דָּם נָקִי
  choice: निर्दोष का खून
  rationale: हिब्रू में विशेषण ‘निर्दोष’ व्याकरणतः ‘खून’ से जुड़ा है, पर अर्थ निर्दोष व्यक्ति के रक्त का है; ‘निर्दोष का खून’ हिंदी में स्पष्ट और स्वाभाविक है।
