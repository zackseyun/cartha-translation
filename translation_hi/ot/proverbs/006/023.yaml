language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י נֵ֣ר מִ֭צְוָה וְ/ת֣וֹרָה א֑וֹר וְ/דֶ֥רֶךְ חַ֝יִּ֗ים תּוֹכְח֥וֹת מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/023.yaml
  text: For the commandment is a lamp[a], and the instruction is light[b], and the reproofs of discipline are the way of life.
translation:
  language: hi
  text: क्योंकि आज्ञा दीपक है और शिक्षा प्रकाश है, और अनुशासन की फटकारें जीवन का मार्ग हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֵר
  choice: दीपक
  rationale: यह प्रकाश की अमूर्त धारणा नहीं, बल्कि प्रकाश देने वाली ठोस वस्तु को दर्शाता है; समानांतर ‘प्रकाश’ से भेद भी बना रहता है।
- source_word: מִצְוָה
  choice: आज्ञा
  rationale: यह अधिकारपूर्ण और बाध्यकारी निर्देश को व्यक्त करता है तथा इस प्रसंग के माता-पिता द्वारा दिए गए उपदेश के अनुकूल है।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: नीतिवचन के ज्ञान-साहित्यिक और पारिवारिक प्रसंग में यह केवल विधि नहीं, बल्कि अधिकारपूर्ण शिक्षा को दर्शाता है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: यह दीपक के समानांतर मार्गदर्शन और उजियाले के रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: דֶרֶךְ חַיִּים
  choice: जीवन का मार्ग
  rationale: यह ऐसी जीवन-यात्रा को व्यक्त करता है जो जीवन की ओर ले जाती और जीवन के अनुरूप होती है; मूल की संक्षिप्त संरचना भी बनी रहती है।
- source_word: תּוֹכְחוֹת מוּסָר
  choice: अनुशासन की डाँट
  rationale: यह पदबंध मौखिक फटकार और चरित्र-निर्माण करने वाले अनुशासन—दोनों भावों को जोड़ता है; ‘डाँट’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ज्ञान-साहित्य में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था
  rationale: प्रसंग माता-पिता की अधिकारपूर्ण ज्ञान-शिक्षा का है; ‘व्यवस्था’ कहना यहाँ मूसा की व्यवस्था का अधिक संकीर्ण अर्थ अनावश्यक रूप से ला सकता है।
- issue: דֶרֶךְ חַיִּים में संबंध की दिशा
  choice: जीवन का मार्ग
  alternative: जीवन की ओर ले जाने वाला मार्ग
  rationale: मूल पदबंध यह अस्पष्टता रहने देता है कि मार्ग जीवन की ओर ले जाता है या जीवन के ढंग को दर्शाता है; संक्षिप्त हिन्दी अभिव्यक्ति दोनों संभावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञानोक्ति। ‘दीपक/प्रकाश’ की काव्यात्मक समानता और ‘आज्ञा/शिक्षा’ का अर्थभेद सुरक्षित रखा गया है।
