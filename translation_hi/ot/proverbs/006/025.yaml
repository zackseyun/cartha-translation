    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמֹד
  choice: लालसा मत करना
  rationale: חמד मन के भीतर किसी वस्तु या व्यक्ति को पाने की प्रबल इच्छा अथवा लालसा को व्यक्त करता है। ‘लालसा’ इस आन्तरिक चाह को स्पष्ट रखता है, पर मुख्य पाठ में अनावश्यक रूप से कानूनी या अत्यधिक स्पष्ट यौन अर्थ नहीं जोड़ता।
- source_word: יָפְיָהּ
  choice: उसकी सुन्दरता
  rationale: יֹפִי का सीधा अर्थ सुन्दरता या आकर्षक रूप है; ‘उसकी सुन्दरता’ सहज और निकट अनुवाद है।
- source_word: בִּלְבָבֶךָ
  choice: अपने मन में
  rationale: बाइबिलीय ज्ञान-साहित्य में לֵבָב आन्तरिक इच्छा, विचार और संकल्प के केन्द्र को दर्शाता है। आधुनिक हिन्दी में ‘अपने मन में’ यही भाव स्वाभाविक रूप से पहुँचाता है।
- source_word: תִּקָּחֲךָ
  choice: तुम्हें वश में करने देना
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ स्त्री की मोहक दृष्टि के द्वारा व्यक्ति के गिरफ्त या प्रभाव में आ जाने का भाव है। ‘वश में करने देना’ चेतावनी की संरचना और परिणाम—उसके प्रभाव में पड़ना—दोनों को सहज हिन्दी में रखता है।
- source_word: בְּעַפְעַפֶּיהָ
  choice: अपनी पलकों से
  rationale: עַפְעַף पलकों को दर्शाता है। ‘पलकों से’ मूल की ठोस, मोहक नेत्र-भंगिमा वाली छवि को बनाए रखता है और בְּ को साधन के अर्थ में व्यक्त करता है।
