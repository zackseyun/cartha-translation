  text: winking with his eyes[a], signaling with his feet[b], pointing with his fingers.
translation:
  language: hi
  text: वह आँख मारता है, पैर से संकेत करता है[a], और उँगलियों से इशारा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पैर घसीटता/रगड़ता है,’ अथवा अधिक सामान्य रूप में ‘पैर से इशारे करता है।’ इब्रानी क्रिया מֹלֵל दुर्लभ है और ठीक किस प्रकार का हाव-भाव अभिप्रेत है, यह अनिश्चित है; फिर भी प्रसंग से गुप्त शारीरिक संकेत का भाव स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उँगलियों से दिशा देता/सिखाता है।’ यहाँ ‘इशारा करता है’ चुना गया है, क्योंकि इस पद में बोलकर शिक्षा देने के बजाय शारीरिक हाव-भावों की सूची है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ
  choice: आँख मारता है
  rationale: यह कृदन्त आँखों से किए जाने वाले छिपे संकेत को दर्शाता है। आधुनिक हिन्दी में ‘आँख मारना’ इस भाव का सबसे स्वाभाविक और सटीक रूप है।
- source_word: בְּעֵינָיו
  choice: आँख
  rationale: इब्रानी में बहुवचन है, पर हिन्दी मुहावरे में ‘आँख मारना’ स्वाभाविक है; ‘आँखों को झपकाना’ संकेत के आशय को कम स्पष्ट करता।
- source_word: מֹלֵל
  choice: संकेत करता है
  rationale: यह दुर्लभ शब्द है और ठीक-ठीक क्रिया अनिश्चित है। समानांतर शारीरिक हाव-भाव और प्रसंग को देखते हुए सामान्य ‘संकेत करना’ चुना गया है, ताकि किसी खास गति को अनावश्यक रूप से निश्चित न किया जाए।
- source_word: בְּרַגְלוֹ
  choice: पैर से
  rationale: मूल में संज्ञा एकवचन है। हिन्दी में ‘पैर से संकेत करना’ सहज है और मूल के वचन को भी बनाए रखता है।
- source_word: מֹרֶה
  choice: इशारा करता है
  rationale: क्रिया का अर्थ ‘दिखाना/दिशा देना’ या ‘सिखाना’ हो सकता है। उँगलियों और अन्य शारीरिक संकेतों के समानांतर प्रयोग में ‘इशारा करना’ सबसे उपयुक्त है।
- source_word: בְּאֶצְבְּעֹתָיו
  choice: उँगलियों से
  rationale: यह बहुवचन और करण-सूचक रूप को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
