base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/003.yaml
  text: 'Do this[a], then, my son, and deliver yourself, for you have come into the palm of your neighbor: go, humble yourself[c][b], and press your plea with your neighbors.'
translation:
  language: hi
  text: 'मेरे बेटे, इसलिए यह कर और अपने को बचा ले, क्योंकि तू अपने पड़ोसी की हथेली में आ गया है[a]: जा, अपने को नम्र कर[b] और अपने पड़ोसियों से ज़ोर देकर विनती कर[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पड़ोसी की हथेली में”; अर्थात् उसकी पकड़ या अधिकार में।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने को उसके सामने गिरा दे” अथवा “अपने को उसके अधीन कर।”
    reason: lexical_alternative
  - marker: c
    text: हिब्रू पाठ में यहाँ “पड़ोसियों” का रूप बहुवचन है, यद्यपि इसी वाक्य में पहले एकवचन “पड़ोसी” आया है। अनेक लोग यहाँ अर्थ को एकवचन, “अपने पड़ोसी” या “अपने मित्र,” समझते हैं।
    reason: textual_variant
