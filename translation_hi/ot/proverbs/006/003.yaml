- source_word: עֲשֵׂה זֹאת אֵפוֹא
  choice: इसलिए ... यह कर
  rationale: आज्ञा और निष्कर्ष/तात्कालिकता सूचित करने वाले अव्यय को स्वाभाविक आधुनिक हिन्दी में रखा गया है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: हिब्रू का पुल्लिंग एकवचन सम्बोधन और ज्ञान-साहित्य की पितृवत् शैली सुरक्षित रहती है।
- source_word: וְהִנָּצֵל
  choice: अपने को छुड़ा ले
  rationale: निफ़अल आज्ञार्थक का आत्मवाचक और बच निकलने का भाव स्पष्ट तथा सहज हिन्दी में व्यक्त होता है।
- source_word: בְכַף רֵעֶךָ
  choice: अपने पड़ोसी की हथेली में
  rationale: כַּף की ठोस छवि को मुख्य पाठ में सुरक्षित रखा गया है; यह किसी की पकड़ या अधिकार में होने का मुहावरा है।
- source_word: הִתְרַפֵּס
  choice: अपने को दीन कर
  rationale: इस दुर्लभ क्रिया में स्वयं को नीचा करने या विनम्रतापूर्वक अधीन होने का भाव है; हिन्दी पद शारीरिक मुद्रा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וּרְהַב
  choice: ज़ोर देकर विनती कर
  rationale: सन्दर्भ में क्रिया आग्रहपूर्वक अनुरोध करने का भाव देती है। यह अनुवाद उसकी तीव्रता को स्पष्ट करता है, जबकि निवेदन का विषय नहीं गढ़ता।
- source_word: רֵעֶיךָ
  choice: अपने पड़ोसियों से
  rationale: मसोरेटिक पाठ के बहुवचन रूप को मुख्य पाठ में बनाए रखा गया है, यद्यपि पहले इसी पद में एकवचन है।
theological_decisions:
- issue: एकवचन רֵעֶךָ और बहुवचन רֵעֶיךָ के बीच तनाव
  choice: मुख्य पाठ में पहले ‘पड़ोसी’ और बाद में ‘पड़ोसियों’ रखा गया
  alternative: अन्तिम पद को भी एकवचन ‘पड़ोसी’ मानना
  rationale: प्राप्त मसोरेटिक पाठ का व्याकरणिक तनाव चुपचाप दूर नहीं किया गया; सम्भावित एकवचन अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, तात्कालिक और गरिमापूर्ण उपदेशात्मक शैली रखी गई है। मूल के एकवचन अनौपचारिक सम्बोधन के अनुरूप ‘तू’ निहित/प्रयुक्त है। ‘हथेली’ की ठोस हिब्रू छवि और अन्तिम बहुवचन दोनों सुरक्षित हैं; कठिन स्थानों को पादटिप्पणियों में स्पष्ट किया गया है।
