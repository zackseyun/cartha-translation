id: PRO.6.29
reference: Proverbs 6:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֵּ֗ן הַ֭/בָּא אֶל אֵ֣שֶׁת רֵעֵ֑/הוּ לֹ֥א יִ֝נָּקֶ֗ה כָּֽל הַ/נֹּגֵ֥עַ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/029.yaml
  text: So is the one who goes in to his neighbor’s wife[b][a]; everyone who touches her will not go unpunished.
translation:
  language: hi
  text: ऐसी ही दशा उस व्यक्ति की होती है जो अपने पड़ोसी की पत्नी के पास जाता है; जो कोई उसे छूता है[b], वह दण्ड से नहीं बचेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्दोष नहीं ठहराया जाएगा’ अथवा ‘दोषमुक्त नहीं माना जाएगा।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘उसे छूता है’ से सम्भवतः केवल आकस्मिक शारीरिक स्पर्श नहीं, बल्कि अनुचित यौन संपर्क अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: ऐसी ही दशा
  rationale: यह पिछले पद की आग और जलने की उपमा को वर्तमान निष्कर्ष से जोड़ता है। हिंदी में यह प्रयोग उस तुलनात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבָּא
  choice: जो ... के पास जाता है
  rationale: निश्चित उपपद के साथ कृदन्त का अर्थ ‘वह व्यक्ति जो...’ है। व्यभिचार के संदर्भ में ‘के पास जाता है’ मूल की शिष्टोक्ति और उसके निहित यौन अर्थ—दोनों को बनाए रखता है।
- source_word: אֶל אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी के पास
  rationale: רֵעַ पड़ोसी, साथी या मित्र को सूचित कर सकता है। ‘पड़ोसी’ मूल की संबंधपरक और नैतिक धारणा को सुरक्षित रखता है।
- source_word: לֹא יִנָּקֶה
  choice: दण्ड से नहीं बचेगा
  rationale: निफ़अल रूप यहाँ निर्दोष ठहराए जाने अथवा दण्ड से बच निकलने का भाव रखता है। चुना गया रूप आधुनिक हिंदी में स्वाभाविक है और न्यायिक परिणाम को स्पष्ट करता है।
- source_word: כָּל
  choice: जो कोई
  rationale: अगले कृदन्त के साथ इसका प्रयोग वितरणात्मक और सार्वभौमिक है; ‘जो कोई’ उस व्यापकता को सहज हिंदी में व्यक्त करता है।
- source_word: הַנֹּגֵעַ בָּהּ
  choice: उसे छूता है
  rationale: נגע का शाब्दिक अर्थ ‘छूना’ है। संदर्भ में यह अनुचित यौन संपर्क की संयत अभिव्यक्ति है, पर अनुवाद मूल शब्द की व्यापकता और आलंकारिक संयम को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘के पास जाता है’ और ‘छूता है’ मूल इब्रानी की संयत शिष्टोक्ति को बिना अनावश्यक रूप से स्पष्ट या संप्रदायगत बनाए सुरक्षित रखते हैं।
