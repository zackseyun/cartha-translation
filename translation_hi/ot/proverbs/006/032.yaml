  yaml_path: translation/ot/proverbs/006/032.yaml
  text: He who commits adultery with a woman lacks sense[a]; he who does it destroys himself.
translation:
  language: hi
  text: जो किसी स्त्री के साथ व्यभिचार करता है, वह समझ से रहित है[a]; जो यह करता है, वह अपना ही जीवन नष्ट करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो किसी की पत्नी के साथ व्यभिचार करता है, वह समझ से रहित है; जो यह करता है, वह अपना जीवन बरबाद करता है।”
    reason: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, और נַפְשׁוֹ यहाँ ‘स्वयं’ अथवा ‘अपना जीवन’ का बोध करा सकता है।
lexical_decisions:
- source_word: נֹאֵף
  choice: व्यभिचार करता है
  rationale: इब्रानी कृदंत व्यभिचार में लगे व्यक्ति को दर्शाता है; हिन्दी में क्रियात्मक अभिव्यक्ति स्वाभाविक और स्पष्ट है।
- source_word: אִשָּׁה
  choice: किसी स्त्री के साथ
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। मुख्य पाठ में व्यापक अर्थ ‘स्त्री’ रखा गया है, जबकि व्यभिचार का भाव क्रिया से स्पष्ट है; ‘पत्नी’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: חֲסַר לֵב
  choice: उसमें समझ की कमी है
  rationale: शाब्दिक अर्थ ‘हृदय की कमी वाला’ है, पर नीतिवचन में ‘हृदय’ विवेक और समझ का केंद्र है। यह हिन्दी रूप उसी मुहावरे का स्वाभाविक अर्थ देता है।
- source_word: מַשְׁחִית
  choice: नष्ट करता है
  rationale: हिफ़ील कृदंत विनाश या बरबादी लाने का तीव्र भाव व्यक्त करता है; ‘नष्ट करता है’ पद की संक्षिप्तता और गंभीरता बनाए रखता है।
- source_word: נַפְשׁוֹ
  choice: अपने आप को
  rationale: यहाँ נֶפֶשׁ अमूर्त ‘आत्मा’ मात्र नहीं, बल्कि स्वयं व्यक्ति अथवा उसके जीवन को दर्शाता है। ‘अपने आप को’ प्रतिवर्ती अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הוּא יַעֲשֶׂנָּה
  choice: जो ऐसा करता है
  rationale: स्त्रीलिंग प्रत्यय पहले बताए गए व्यभिचार के कार्य की ओर संकेत करता है। ‘जो ऐसा करता है’ हिन्दी में सहज रूप से उस कार्य का संदर्भ बनाए रखता है।
