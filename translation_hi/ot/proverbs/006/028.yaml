- source_word: אִם
  choice: क्या ... सकता है
  rationale: אִם सामान्यतः ‘यदि’ है, पर पिछले पद के समानांतर यहाँ अलंकारिक प्रश्न आरम्भ करता है। हिंदी में ‘क्या ... सकता है’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהַלֵּךְ
  choice: चल सकता है
  rationale: पिएल अपूर्ण रूप यहाँ चलने का भाव देता है; प्रश्नात्मक संरचना में ‘चल सकता है’ स्वाभाविक हिंदी है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: मूल शब्द पुल्लिंग एकवचन है और यहाँ एक सामान्य उदाहरण के रूप में प्रयुक्त हुआ है; ‘कोई पुरुष’ उसकी व्याकरणिक विशेषता बनाए रखता है।
- source_word: הַגֶּחָלִים
  choice: अंगारों
  rationale: גֶּחָלִים दहकते कोयलों अथवा अंगारों को सूचित करता है; हिंदी में ‘अंगारे’ चित्र और ताप दोनों स्पष्ट करता है।
- source_word: וְרַגְלָיו
  choice: और उसके पाँव
  rationale: बहुवचन संज्ञा और तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: תִכָּוֶינָה
  choice: न झुलसें
  rationale: निफ़अल रूप का अर्थ जलना या झुलसना है; अंगारों पर पैर रखने के प्रसंग में ‘झुलसें’ सटीक और सहज है।
