  edition: WLC
  text: בְּ/הִתְהַלֶּכְ/ךָ֨ תַּנְחֶ֬ה אֹתָ֗/ךְ בְּֽ֭/שָׁכְבְּ/ךָ תִּשְׁמֹ֣ר עָלֶ֑י/ךָ וַ֝/הֲקִיצ֗וֹתָ הִ֣יא תְשִׂיחֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/022.yaml
  text: When you walk[a], it will guide you; when you lie down, it will watch over you; and when you awake, it will speak with you.
translation:
  language: hi
  text: जब तुम चलते-फिरते हो, वह[a] तुम्हारी अगुवाई करेगी; जब तुम लेटते हो, वह तुम्हारी रक्षा करेगी; और जब तुम जागते हो, वह तुमसे बात करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘वह’ स्त्रीलिंग एकवचन है और निकट संदर्भ की ‘आज्ञा’ या ‘शिक्षा’ की ओर संकेत करता है; इसमें नीतिवचन में बुद्धि के स्त्रीरूप मानवीकरण की प्रतिध्वनि भी सुनाई दे सकती है।
    reason: मूल के स्त्रीलिंग संदर्भ और संभावित मानवीकरण को स्पष्ट करना
lexical_decisions:
- source_word: בְּהִתְהַלֶּכְךָ
  choice: जब तुम चलते-फिरते हो
  rationale: בְּ के साथ हित्वपएल क्रियारूप यहाँ समय और जीवन-व्यवहार दोनों का संकेत देता है। ‘चलते-फिरते हो’ दैनिक गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है और केवल एक बार चलने तक अर्थ को सीमित नहीं करता।
- source_word: תַּנְחֶה אֹתָךְ
  choice: तुम्हारी अगुवाई करेगी
  rationale: हिफ़ील रूप נחה का अर्थ मार्ग दिखाना या आगे ले चलना है। ‘अगुवाई करेगी’ ज्ञान-साहित्य के मार्गदर्शन संबंधी भाव को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בְּשָׁכְבְּךָ
  choice: जब तुम लेटते हो
  rationale: שכב यहाँ लेटने या विश्राम के लिए जाने की क्रिया बताता है; इसे ‘सोते हो’ कहना मूल अर्थ को अनावश्यक रूप से संकुचित कर देता।
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: तुम्हारी रक्षा करेगी
  rationale: שמר על किसी की निगरानी और सुरक्षा करने का भाव रखता है। ‘रक्षा करेगी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַהֲקִיצוֹתָ
  choice: और जब तुम जागते हो
  rationale: यह जाग उठने की क्रिया है और पिछले दोनों कालवाचक उपवाक्यों की शृंखला को आगे बढ़ाती है।
- source_word: הִיא
  choice: वह
  rationale: हिब्रू में सर्वनाम स्त्रीलिंग एकवचन है। हिन्दी ‘वह’ तत्काल पूर्वसंदर्भ की आज्ञा अथवा शिक्षा—दोनों संभावित स्त्रीलिंग संदर्भों—को खुला रखता है, जबकि स्त्रीलिंग क्रियाएँ उसके व्याकरणिक रूप को दर्शाती हैं।
- source_word: תְשִׂיחֶךָ
  choice: तुमसे बात करेगी
  rationale: שׂיח बोलने, बातचीत करने या मननपूर्ण संवाद का अर्थ दे सकता है। ‘तुमसे बात करेगी’ पारस्परिक और जीवंत मार्गदर्शन का भाव बचाता है, बिना इसे केवल औपचारिक शिक्षा बना देने के।
theological_decisions:
- issue: स्त्रीलिंग एकवचन कर्ता का संदर्भ और उसका मानवीकरण
  choice: मुख्य पाठ में ‘वह’ और स्त्रीलिंग क्रियाओं का प्रयोग
  alternative: ‘यह शिक्षा’ या ‘वह स्त्री’ जैसे अधिक स्पष्ट रूप से संदर्भ या मानवीकरण निर्धारित करना
  rationale: निकट संदर्भ में ‘आज्ञा’ और ‘शिक्षा’ दोनों स्त्रीलिंग संज्ञाएँ हैं, और नीतिवचन में बुद्धि के व्यापक मानवीकरण की प्रतिध्वनि भी संभव है। ‘वह’ मूल की स्त्रीलिंगता को बनाए रखते हुए संदर्भ को किसी एक संज्ञा या पूर्ण मानवीकरण तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज प्रवाह रखा गया है। तीनों दैनिक अवस्थाओं की समानांतर रचना सुरक्षित है; ‘चलते-फिरते’, ‘लेटते’ और ‘जागते’ वर्तमानकालीन सामान्य क्रियाएँ सार्वकालिक ज्ञान-वचन का भाव देती हैं।
