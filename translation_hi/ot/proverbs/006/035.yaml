  text: He will accept no ransom[a] and will not be persuaded, no matter how large the bribe.
translation:
  language: hi
  text: वह कोई भी फिरौती[a] स्वीकार नहीं करेगा; चाहे तुम कितनी ही बड़ी रिश्वत दो, वह नहीं मानेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्षतिपूर्ति।” इब्रानी में शाब्दिक रूप से किसी फिरौती का चेहरा न उठाने की बात है; यह भुगतान स्वीकार करने या पक्षपात दिखाने से इनकार करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִשָּׂא פְּנֵי
  choice: स्वीकार नहीं करेगा
  rationale: ‘चेहरा उठाना’ इब्रानी मुहावरा है। यहाँ इसका आशय भुगतान के कारण अनुग्रह दिखाने या उसे मान लेने से इनकार करना है; प्रसंग में ‘स्वीकार नहीं करेगा’ स्वाभाविक हिन्दी है।
- source_word: כָל כֹּפֶר
  choice: कोई फिरौती
  rationale: כֹּפֶר उस प्रतिपूरक भुगतान को दर्शाता है जो दंड या परिणाम को टालने के लिए दिया जाता है। ‘फिरौती’ इसकी प्रबल अर्थछाया बनाए रखती है, जबकि व्यापक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: לֹא יֹאבֶה
  choice: वह नहीं मानेगा
  rationale: क्रिया इच्छा या सहमति न देने को व्यक्त करती है, भावनात्मक संतुष्टि को नहीं। आर्थिक प्रलोभन के प्रसंग में ‘नहीं मानेगा’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: כִּי תַרְבֶּה שֹׁחַד
  choice: चाहे तुम कितनी ही बड़ी रिश्वत दो
  rationale: उपवाक्य रियायती भाव रखता है और ‘रिश्वत’ इब्रानी में एकवचन है। यह अनुवाद दोनों बातों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
