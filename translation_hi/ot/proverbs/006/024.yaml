base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/024.yaml
  text: to keep you from the evil woman[b][a], from the smooth tongue of the foreign woman.
translation:
  language: hi
  text: ताकि वह तुझे दुष्ट स्त्री से, पराई स्त्री[b] की चिकनी-चुपड़ी वाणी[a] से बचाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चापलूसी भरी वाणी”; शाब्दिक अर्थ, “चिकनी जीभ।”
    reason: lexical_alternative
  - marker: b
    text: या “विदेशी स्त्री” अथवा “अजनबी स्त्री”; कुछ लोग इसे विशेष रूप से “व्यभिचारिणी” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: ताकि वह तुझे ... बचाए
  rationale: लְ उपसर्गयुक्त क्रिया-रूप पिछले पद से जुड़ा उद्देश्य बताता है। ‘बचाए’ सुरक्षा के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵאֵשֶׁת רָע
  choice: दुष्ट स्त्री से
  rationale: אֵשֶׁת यहाँ ‘स्त्री’ के अर्थ में और רָע नैतिक बुराई बताने वाले विशेषण के रूप में है। ‘दुष्ट स्त्री’ सशक्त और सहज हिन्दी है तथा ‘पत्नी’ जैसा अनावश्यक संकुचन नहीं करता।
- source_word: מֵחֶלְקַת לָשׁוֹן
  choice: चिकनी-चुपड़ी जीभ से
  rationale: חֶלְקַת में चिकनेपन और लुभावनी वाणी का बिंब है। ‘चिकनी-चुपड़ी जीभ’ मूल के शारीरिक बिंब को बनाए रखते हुए हिन्दी में चापलूसी और बहकाने वाली बातों का भाव देता है।
- source_word: נָכְרִיָּה
  choice: पराई स्त्री
  rationale: नָכְרִיָּה का मूल अर्थ विदेशी, बाहरी या अपने समुदाय से बाहर की स्त्री है। ‘पराई स्त्री’ हिन्दी में इस दूरी/अन्यत्व को स्वाभाविक ढंग से व्यक्त करती है, पर इसे सीधे ‘व्यभिचारिणी’ नहीं बना देती।
theological_decisions:
- issue: नीतिवचन में נָכְרִיָּה का अर्थ
  choice: मुख्य पाठ में ‘पराई स्त्री’
  alternative: ‘विदेशी स्त्री’, ‘अजनबी स्त्री’ या संदर्भानुसार ‘व्यभिचारिणी’
  rationale: मूल शब्द बाहरी अथवा पराई स्त्री को दर्शाता है और इस साहित्य में अनैतिक प्रलोभन के अर्थ-संकेत भी रख सकता है। मुख्य पाठ में व्यापक शाब्दिक अर्थ रखा गया है; अधिक संकीर्ण नैतिक पहचान को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘चिकनी-चुपड़ी जीभ’ मूल बिंब और उसके लुभावने भाषण के आशय दोनों को संप्रेषित करता है।
