  edition: WLC
  text: נְצֹ֣ר בְּ֭נִ/י מִצְוַ֣ת אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/020.yaml
  text: Keep[a], my son, your father's commandment, and do not forsake your mother's instruction.
translation:
  language: hi
  text: मेरे बेटे, अपने पिता की आज्ञा का पालन कर[a], और अपनी माता की शिक्षा को न छोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे बेटे, अपने पिता की आज्ञा को सँभालकर रख, और अपनी माता की शिक्षा का त्याग न कर।”
    reason: נְצֹר के ‘सँभालकर रखना/रक्षा करना’ तथा תִּטֹּשׁ के ‘त्याग देना’ वाले अधिक शाब्दिक अर्थों को दर्शाने के लिए।
lexical_decisions:
- source_word: נְצֹר
  choice: पालन कर
  rationale: मूल क्रिया में सावधानी से थामे रखने, सुरक्षित रखने और मानने का भाव है। आज्ञा के साथ ‘पालन कर’ आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक अनुवाद में रक्षण का अधिक शाब्दिक भाव दिया गया है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: सम्बोधन स्पष्ट रूप से पुल्लिंग एकवचन है। ‘हे मेरे बेटे’ पिता-सदृश ज्ञानोपदेश के आत्मीय और गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: מִצְוַת
  choice: आज्ञा
  rationale: यह शब्द आदेश या आज्ञा को सूचित करता है। पारिवारिक ज्ञानोपदेश में ‘आज्ञा’ संक्षिप्त, स्वाभाविक और पर्याप्त रूप से गंभीर है।
- source_word: אָבִיךָ
  choice: अपने पिता की
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को हिन्दी में आत्मवाचक ‘अपने’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: תִּטֹּשׁ
  choice: न छोड़
  rationale: क्रिया का अर्थ छोड़ देना या त्याग देना है। ‘न छोड़’ सरल आधुनिक हिन्दी है और निर्देश की नैतिक गंभीरता बनाए रखता है।
- source_word: תּוֹרַת
  choice: शिक्षा
  rationale: इस मातृ-पितृ ज्ञानोपदेश के प्रसंग में תּוֹרָה संहिताबद्ध ‘व्यवस्था’ से अधिक दी हुई शिक्षा या उपदेश को दर्शाता है।
- source_word: אִמֶּךָ
  choice: अपनी माता की
  rationale: मूल के मातृ-पितृ समानांतर को सुरक्षित रखते हुए प्रत्यय का स्वाभाविक हिन्दी रूप ‘अपनी माता की’ है।
