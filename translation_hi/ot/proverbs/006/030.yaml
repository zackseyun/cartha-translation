  text: לֹא יָב֣וּזוּ לַ֭/גַּנָּב כִּ֣י יִגְנ֑וֹב לְ/מַלֵּ֥א נַ֝פְשׁ֗/וֹ כִּ֣י יִרְעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/030.yaml
  text: People do not despise a thief if he steals to satisfy himself when he is hungry[a][b].
translation:
  language: hi
  text: लोग चोर को तुच्छ नहीं समझते, यदि वह भूखा होने पर अपनी भूख मिटाने के लिए चोरी करे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने प्राण को तृप्त करने के लिए”; शाब्दिक अर्थ, “अपने प्राण/स्वयं को भरने के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि वह भूखा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָב֣וּזוּ
  choice: तुच्छ नहीं समझते
  rationale: בוז का अर्थ किसी को हेय या तिरस्कार के योग्य समझना है। आधुनिक हिन्दी में ‘तुच्छ नहीं समझते’ इस सामाजिक मूल्यांकन को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לַגַּנָּב
  choice: चोर
  rationale: इब्रानी में संज्ञा निश्चित रूप में है, पर कहावत में यह किसी प्रतिनिधि चोर का सामान्य उल्लेख है; हिन्दी में बिना अनिश्चित उपपद के ‘चोर’ यही सामान्य अर्थ सहजता से देता है।
- source_word: כִּי יִגְנ֑וֹב
  choice: जब ... चोरी करता है
  rationale: כִּי यहाँ उस परिस्थिति का परिचय देता है जिसमें कथन लागू होता है। ‘जब’ स्वाभाविक हिन्दी है और इब्रानी की परिस्थितिजन्य शक्ति को बनाए रखता है; सशर्त ‘यदि’ भी संभव है।
- source_word: לְמַלֵּ֥א נַפְשׁוֹ
  choice: अपनी भूख मिटाने के लिए
  rationale: शाब्दिक अर्थ ‘अपने प्राण/स्वयं को भरने के लिए’ है। भूख के प्रसंग में यह भोजन से अपनी आवश्यकता या क्षुधा पूरी करने का मुहावरा है; हिन्दी में ‘भूख मिटाना’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: נַפְשׁוֹ
  choice: अपनी भूख
  rationale: נֶפֶשׁ का अर्थ स्वयं, प्राण, जीवन या भूख/लालसा हो सकता है। निकटवर्ती ‘भूखा’ होने के उल्लेख के कारण यहाँ क्षुधा का भाव प्रमुख है, जबकि शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי יִרְעָֽב
  choice: अपनी भूख
  rationale: यह खंड चोरी की प्रेरक परिस्थिति बताता है। मुख्य पाठ में इसे हिन्दी के स्वाभाविक मुहावरे ‘भूख मिटाने’ में समाहित किया गया है; ‘क्योंकि वह भूखा है’ को वैकल्पिक संरचना के रूप में पादटिप्पणी में रखा गया है।
