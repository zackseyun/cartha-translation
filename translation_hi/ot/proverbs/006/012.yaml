  text: אָדָ֣ם בְּ֭לִיַּעַל אִ֣ישׁ אָ֑וֶן ה֝וֹלֵ֗ךְ עִקְּשׁ֥וּת פֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/012.yaml
  text: A worthless man[a], a man of wickedness, walks with a perverse mouth.
translation:
  language: hi
  text: एक निकृष्ट आदमी, दुष्ट व्यक्ति, कुटिल बातें बोलता फिरता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुँह की कुटिलता के साथ चलता है”; अर्थात, उसकी वाणी कुटिल है।
    reason: हिब्रू की ठोस ‘मुँह’ वाली अभिव्यक्ति और उसके वाणी-संबंधी आशय—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: אָדָם
  choice: आदमी
  rationale: यहाँ सामान्य मानवजाति नहीं, नीतिवचन में एक विशिष्ट व्यक्ति का चित्रण है; ‘आदमी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּלִיַּעַל
  choice: निकम्मा
  rationale: यह शब्द यहाँ किसी व्यक्तिवाचक नाम के रूप में नहीं, बल्कि मूल्यहीन और नीच चरित्र के विशेषण के रूप में प्रयुक्त है।
- source_word: אִישׁ אָוֶן
  choice: दुष्ट व्यक्ति
  rationale: शाब्दिक ‘अनर्थ/दुष्टता का मनुष्य’ हिन्दी में अस्वाभाविक है; ‘दुष्ट व्यक्ति’ नैतिक बुराई का भाव स्पष्ट रखता है।
- source_word: הוֹלֵךְ
  choice: फिरता है
  rationale: यह निरंतर आचरण का संकेत देता है; ‘बोलता फिरता है’ हिन्दी में स्वाभाविक रूप से उसकी आदतन चाल-चलन को व्यक्त करता है।
- source_word: עִקְּשׁוּת פֶּה
  choice: टेढ़ी बातें
  rationale: हिब्रू का ठोस रूप ‘मुँह की टेढ़ाई’ कुटिल या विकृत वाणी का बोध कराता है; मुख्य पाठ में अर्थ स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
