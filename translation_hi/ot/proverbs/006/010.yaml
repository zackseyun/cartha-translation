  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: hi
  text: थोड़ी-सी नींद, थोड़ी-सी ऊँघ, थोड़ा-सा हाथों को समेटकर लेटना—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: थोड़ी-सी / थोड़ा-सा
  rationale: तीन बार की पुनरावृत्ति को बनाए रखा गया है। हिंदी में लिंग के अनुसार रूप बदलता है, पर हर बार अल्प मात्रा या थोड़े समय का भाव व्यक्त होता है।
- source_word: שֵׁנוֹת
  choice: नींद
  rationale: हिब्रू में रूप बहुवचन है, पर यहाँ हिंदी का भाववाचक एकवचन ‘नींद’ स्वाभाविक और अर्थानुकूल है।
- source_word: תְּנוּמוֹת
  choice: ऊँघ
  rationale: यह ‘नींद’ के समानांतर हल्की या क्षणिक निद्रा का भाव देता है और हिंदी में संक्षिप्त, काव्यात्मक लय बनाए रखता है।
- source_word: חִבֻּק יָדַיִם
  choice: हाथ बाँधकर
  rationale: शाब्दिक चित्र ‘हाथों को आलिंगन में लेना’ है; प्रसंग में यह विश्राम या निष्क्रियता की मुद्रा में हाथ समेटने/बाँधने का बोध कराता है। ‘हाथ बाँधकर’ हिंदी में चित्र को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִשְׁכָּב
  choice: लेटना
  rationale: मूल क्रिया का सीधा अर्थ ‘लेटना’ है। इसे ‘सोना’ नहीं किया गया, ताकि पहले प्रयुक्त निद्रा-संबंधी शब्दों से इसका भेद बना रहे।
