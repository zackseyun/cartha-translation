language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֶׁשׁ הֵ֭נָּה שָׂנֵ֣א יְהוָ֑ה וְ֝/שֶׁ֗בַע תועבות נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/006/016.yaml
  text: 'There are six things that Yahweh hates[a], seven that are an abomination to him:'
translation:
  language: hi
  text: 'ये छह बातें हैं जिनसे याहवे घृणा करता है,

    और सात ऐसी हैं जो उसके लिए घृणित हैं:[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके प्राण के लिए सात घृणित बातें”; अर्थात् सात बातें जो उसे घृणित लगती हैं।
    reason: नַפְשׁוֹ के मुहावरेदार अर्थ और תּוֹעֵבוֹת के बहुवचन रूप को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: שֶׁשׁ הֵנָּה
  choice: ये छः बातें हैं
  rationale: इब्रानी संकेतवाचक सर्वनाम और संख्या आगामी सूची की ओर संकेत करते हैं। ‘बातें’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है और आशय स्पष्ट रहता है।
- source_word: שָׂנֵא
  choice: घृणा करता है
  rationale: क्रिया प्रबल विरक्ति या द्वेष व्यक्त करती है; ‘घृणा करता है’ इसके बल को बिना नरम किए सहज आधुनिक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुर्वर्णीय व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है; उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: וְשֶׁבַע
  choice: और सात
  rationale: यह इब्रानी की ‘छः... और सात’ संख्यात्मक काव्य-रचना है। सरल ‘और सात’ उसके रूप और बढ़ते हुए बल दोनों को बनाए रखता है।
- source_word: תועבות
  choice: अत्यन्त घृणित
  rationale: बहुवचन संज्ञा उन बातों को दर्शाती है जो नैतिक और धार्मिक रूप से अत्यधिक विकर्षक हैं। विशेषणात्मक हिन्दी अभिव्यक्ति सूचीबद्ध ‘सात’ बातों से स्वाभाविक रूप से जुड़ती है।
- source_word: נַפְשׁוֹ
  choice: उसे
  rationale: शाब्दिक रूप ‘उसके प्राण/स्वयं को’ है, पर यहाँ נֶפֶשׁ पूरे व्यक्ति का मुहावरेदार संकेत है। ‘उसे’ हिन्दी में वही अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: ‘उसके प्राण के लिए घृणित वस्तुएँ’ का मानवरूपी मुहावरा
  choice: जो उसे अत्यन्त घृणित हैं
  alternative: जो उसके प्राण को घृणित हैं
  rationale: נֶפֶשׁ यहाँ व्यक्ति स्वयं को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि मूल मुहावरे की पारदर्शिता पादटिप्पणी में सुरक्षित है।
- issue: ‘छः... और सात’ संख्यात्मक कथन
  choice: संख्यात्मक क्रम को ज्यों का त्यों रखना
  alternative: ‘छः, बल्कि सात’ द्वारा इसे स्पष्ट बढ़ोतरी बनाना
  rationale: मूल की काव्यात्मक x/x+1 शैली जानबूझकर तनाव उत्पन्न करती है और अगली संख्या पर बल देती है। ‘और’ इस रूप को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। समानांतर पंक्तियाँ इब्रानी संख्यात्मक कहावत की बनावट को दर्शाती हैं; ‘अत्यन्त घृणित’ תועבות की प्रबल नैतिक-विरक्ति को व्यक्त करता है।
