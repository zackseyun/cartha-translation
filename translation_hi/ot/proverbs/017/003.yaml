source:
  edition: WLC
  text: מַצְרֵ֣ף לַ֭/כֶּסֶף וְ/כ֣וּר לַ/זָּהָ֑ב וּ/בֹחֵ֖ן לִבּ֣וֹת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/003.yaml
  text: The crucible is for silver[a], and the furnace for gold[b], but Yahweh tests hearts.
translation:
  language: hi
  text: चाँदी के लिए कुठाली और सोने के लिए भट्ठी होती है, पर हृदयों को याहवे[a] परखता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में परमेश्वर का नाम YHWH है; इसे परंपरागत रूप से ‘यहोवा’ भी कहा और ‘प्रभु’ लिखकर भी दर्शाया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַצְרֵף
  choice: कुठाली
  rationale: यह धातु को गलाकर शुद्ध करने वाले पात्र को दर्शाता है। ‘कुठाली’ चाँदी के परिशोधन का ठोस रूपक बनाए रखती है और अगले पदांश की ‘भट्ठी’ से इसका भेद भी सुरक्षित रखती है।
- source_word: לַכֶּסֶף
  choice: चाँदी के लिए
  rationale: उपसर्ग ל यहाँ प्रयोजन या उपयोग बताता है; सामान्य नीतिवचन के रूप में अनिश्चित अर्थ स्वाभाविक है।
- source_word: כּוּר
  choice: भट्ठी
  rationale: यह धातु गलाने या शुद्ध करने की भट्ठी है। ‘भट्ठी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לַזָּהָב
  choice: सोने के लिए
  rationale: यहाँ ל प्रयोजन या उपयोग व्यक्त करता है और चाँदी वाले समानांतर पदांश से मेल खाता है।
- source_word: וּבֹחֵן
  choice: परखता है
  rationale: בחן जाँचकर वास्तविक गुण या खरेपन को प्रकट करने का भाव देता है। ‘परखता है’ धातु-परिशोधन के रूपक और मनुष्य के भीतरी जीवन की दिव्य जाँच—दोनों को जोड़ता है।
- source_word: לִבּוֹת
  choice: हृदयों को
  rationale: इब्रानी में ‘हृदय’ विचार, इच्छा और अभिप्राय सहित भीतरी मनुष्य का संकेत है। शाब्दिक रूपक को बनाए रखने के लिए ‘हृदयों’ रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम YHWH है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है; पाठक-सहायता के लिए परंपरागत विकल्प पादटिप्पणी में दिए गए हैं।
- issue: בחן द्वारा हृदयों की जाँच का भाव
  choice: हृदयों को परखता है
  alternative: हृदयों को जाँचता है
  rationale: ‘परखता है’ खरेपन की जाँच का भाव रखता है और चाँदी-सोने के परिशोधन से बने रूपक संबंध को बिना अतिरिक्त न्यायिक या मनोवैज्ञानिक अर्थ जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘कुठाली’ अपेक्षाकृत साहित्यिक शब्द है, पर वह परिशोधन के पात्र और भट्ठी के बीच मूल पाठ का भेद सुरक्षित रखता है।
