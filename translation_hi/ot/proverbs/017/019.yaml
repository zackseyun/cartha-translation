base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/019.yaml
  text: Whoever loves transgression loves strife[a]; he who makes his door high seeks destruction.
translation:
  language: hi
  text: 'जो अपराध से प्रेम करता है, वह झगड़े से प्रेम करता है;

    जो अपने द्वार[a] को ऊँचा करता है, वह विनाश चाहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “द्वार” का अर्थ प्रवेश-द्वार या फाटक भी हो सकता है। “द्वार ऊँचा करने” की छवि घमंडी आत्मोन्नति, दिखावटी निर्माण, या विपत्ति को न्योता देने वाली मुद्रा की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: काल कृदंत का सीधा और समानांतर अनुवाद; दोनों पंक्तियों में नैतिक बल बनाए रखता है।
- source_word: פֶּשַׁע
  choice: अपराध
  rationale: यह जानबूझकर किए गए उल्लंघन या विद्रोही कृत्य का बोध देता है; आधुनिक हिंदी में सहज रहते हुए गंभीरता बनाए रखता है।
- source_word: מַצָּה
  choice: झगड़ा
  rationale: यह विवाद, कलह या संघर्ष को दर्शाता है; ‘झगड़ा’ साधारण पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: מַגְבִּיהַּ
  choice: ऊँचा करता है
  rationale: हिफ़ील कृदंत के कारक अर्थ और मूल पाठ की ठोस ऊँचाई वाली छवि को सुरक्षित रखता है।
- source_word: פִּתְחוֹ
  choice: अपना द्वार
  rationale: शब्द प्रवेश-द्वार या खुलने की जगह को सूचित कर सकता है; ‘द्वार’ संक्षिप्त, गरिमापूर्ण और घर अथवा फाटक—दोनों संभावनाओं के लिए पर्याप्त व्यापक है।
- source_word: מְבַקֶּשׁ
  choice: चाहता है
  rationale: मूल अर्थ ‘ढूँढ़ना/चाहना’ है; हिंदी में परिणाम को मानो स्वयं बुलाने की नीतिवचनात्मक विडंबना स्वाभाविक रूप से व्यक्त होती है।
- source_word: שָׁבֶר
  choice: विनाश
  rationale: टूटने, पतन, बरबादी या विपत्ति के गंभीर परिणाम को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: ऊँचे द्वार की छवि का आशय
  choice: मुख्य पाठ में ठोस छवि ‘अपना द्वार ऊँचा करता है’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे सीधे घमंड, दिखावे या विपत्ति को न्योता देने के रूप में अर्थानुवाद करना।
  rationale: इब्रानी छवि बहुअर्थी है और घमंडी आत्मोन्नति, आडंबरपूर्ण निर्माण, असुरक्षित ऊँचे प्रवेश या विपत्ति बुलाने की मुद्रा की ओर संकेत कर सकती है; किसी एक अर्थ को निर्णायक बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। दोनों अर्धपंक्तियों की समानांतर संरचना बचाई गई है और अस्पष्ट स्थापत्य-रूपक को मुख्य पाठ में यथावत रखा गया है।
