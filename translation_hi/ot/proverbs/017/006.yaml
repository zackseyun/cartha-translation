  text: עֲטֶ֣רֶת זְ֭קֵנִים בְּנֵ֣י בָנִ֑ים וְ/תִפְאֶ֖רֶת בָּנִ֣ים אֲבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/006.yaml
  text: Grandchildren are the crown of the aged[b][a], and the glory of children is their fathers.
translation:
  language: hi
  text: 'वृद्धों[b] का मुकुट उनके नाती-पोते[a] हैं,

    और संतानों का गौरव उनके पिता हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘बच्चों के बच्चे’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘वृद्धों’ का अनुवाद ‘बूढ़े पुरुषों’ भी किया जा सकता है; इब्रानी शब्द यहाँ अधिक आयु के लोगों को दर्शाता है, किसी औपचारिक पद वाले पुरनियों को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: यह शब्द सम्मान और प्रतिष्ठा के प्रतीक के रूप में मुकुट या माला को दर्शाता है। ‘मुकुट’ हिंदी में रूपक को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: זְקֵנִים
  choice: वृद्धों
  rationale: यहाँ आशय अधिक आयु के लोगों से है, किसी औपचारिक पद पर नियुक्त ‘पुरनियों’ या अगुवों से नहीं। ‘वृद्धों’ संक्षिप्त, सम्मानजनक और आधुनिक मानक हिंदी में स्वाभाविक है।
- source_word: בְּנֵי בָנִים
  choice: नाती-पोते
  rationale: शाब्दिक पदबंध ‘बच्चों के बच्चे’ का मुहावरेदार अर्थ अगली पीढ़ी के वंशज, अर्थात नाती-पोते है। यह चयन हिंदी में सहज है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תִפְאֶרֶת
  choice: गौरव
  rationale: इस संज्ञा में महिमा, शोभा और सम्मान के अर्थ हैं। ‘गौरव’ ‘मुकुट’ के समानांतर सम्मान के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בָּנִים
  choice: संतानों
  rationale: यद्यपि रूप व्याकरणतः पुल्लिंग बहुवचन है, इस पारिवारिक लोकोक्ति में इसका व्यापक अर्थ संतान है। ‘संतानों’ सामान्य कथन को स्पष्ट रखते हुए हिंदी में दोनों लिंगों को सहज रूप से समेटता है।
- source_word: אֲבוֹתָם
  choice: उनके पिता
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘उनके पिता’ कहता है। इसे ‘माता-पिता’ करने से स्रोत का विशिष्ट पुल्लिंग पारिवारिक शब्द बदल जाता, इसलिए ‘पिता’ बनाए रखा गया है।
theological_decisions:
- issue: सामान्य लोकोक्ति में लिंगसूचक पारिवारिक शब्द
  choice: בָּנִים को ‘संतानों’ और אֲבוֹתָם को ‘उनके पिता’ अनूदित किया गया।
  alternative: दोनों को अधिक रूपात्मक ढंग से ‘पुत्रों’ और ‘उनके पिता’, अथवा दोनों को सामान्य बनाकर ‘संतानों’ और ‘उनके माता-पिता’ कहा जा सकता था।
  rationale: कहावत पीढ़ियों के बीच पारिवारिक गौरव की सामान्य बात करती है, इसलिए בָּנִים के लिए ‘संतान’ स्वाभाविक है। परंतु אֲבוֹתָם स्पष्टतः ‘पिता’ है; उसे ‘माता-पिता’ करने से स्रोत की लिंग-सूचना मिट जाती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पंक्तियों की समानांतर रचना तथा ‘मुकुट/गौरव’ का ऊँचा काव्यात्मक स्वर सुरक्षित रखा गया है। ‘नाती-पोते’ सामान्य हिंदी का सामूहिक पारिवारिक पद है; पादटिप्पणी स्रोत की अधिक शाब्दिक अभिव्यक्ति बताती है।
