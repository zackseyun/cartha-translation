  text: בְּ/כָל עֵ֭ת אֹהֵ֣ב הָ/רֵ֑עַ וְ/אָ֥ח לְ֝/צָרָ֗ה יִוָּלֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/017.yaml
  text: A friend loves at all times[a], and a brother is born for adversity.
translation:
  language: hi
  text: 'मित्र हर समय प्रेम करता है,

    और भाई विपत्ति के लिए[a] जन्मा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विपत्ति के समय के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह पदबंध समय की व्यापकता व्यक्त करता है। ‘हर समय’ स्वाभाविक आधुनिक हिन्दी में नीतिवचन के सार्वभौमिक कथन को बनाए रखता है।
- source_word: אֹהֵב
  choice: प्रेम करता है
  rationale: यह कर्तृवाचक कृदन्त यहाँ मित्र के स्वभावगत और निरंतर आचरण को व्यक्त करता है; ‘प्रेम करता है’ सीधा और सहज अनुवाद है।
- source_word: הָרֵעַ
  choice: मित्र
  rationale: सप्रत्यय संज्ञा नीतिवचन की शैली में किसी वर्ग के प्रतिनिधि को सूचित करती है। ‘मित्र’ सम्बन्धपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָח
  choice: और भाई
  rationale: אָח का सामान्य अर्थ ‘भाई’ है। इसे बनाए रखने से मूल का पारिवारिक रूपक और दोनों पंक्तियों का समानान्तर भाव सुरक्षित रहता है।
- source_word: לְצָרָה
  choice: विपत्ति के लिए
  rationale: צָרָה संकट, दुःख या विपत्ति को सूचित करता है। ‘विपत्ति’ संक्षिप्त और गरिमापूर्ण है, जबकि לְ की उद्देश्य अथवा अवसर-संबंधी अस्पष्टता ‘के लिए’ में बनी रहती है।
- source_word: יִוָּלֵד
  choice: जन्मा है
  rationale: ילד का निफ़अल रूप सबसे सीधे तौर पर ‘जन्मा है’ है। यह शाब्दिक रूपक को सुरक्षित रखता है और यह अर्थ भी खुला छोड़ता है कि भाई की भूमिका विपत्ति में विशेष रूप से प्रकट होती है।
theological_decisions:
- issue: दूसरी पंक्ति में जन्म और विपत्ति का सम्बन्ध
  choice: भाई विपत्ति के लिए जन्मा है
  alternative: विपत्ति के समय के लिए भाई जन्मा है
  rationale: मूल לְצָרָה में उद्देश्य (‘विपत्ति के लिए’) और संकट के अवसर से सम्बन्ध—दोनों की सम्भावना है। मुख्य पाठ संक्षिप्त मूल संरचना को रखता है और वैकल्पिक कालगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्मरणीय और गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘मित्र’, ‘भाई’ और ‘जन्मा है’ मूल के ठोस सम्बन्धपरक तथा रूपकात्मक शब्दों को सुरक्षित रखते हैं।
