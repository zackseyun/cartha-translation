  text: עִקֶּשׁ לֵ֭ב לֹ֣א יִמְצָא ט֑וֹב וְ/נֶהְפָּ֥ךְ בִּ֝/לְשׁוֹנ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/020.yaml
  text: A crooked heart does not find good, and one who is twisted in his tongue falls into trouble.
translation:
  language: hi
  text: 'जिसका मन टेढ़ा है, वह भलाई नहीं पाता,

    और जिसकी बातें टेढ़ी हैं, वह विपत्ति में पड़ता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִקֶּשׁ לֵב
  choice: टेढ़े मनवाला
  rationale: यह पदबंध भीतर की कुटिल या विकृत प्रवृत्ति बताता है। हिंदी में ‘मन’ व्यक्ति के आंतरिक विचार, इच्छा और स्वभाव को सहज रूप से व्यक्त करता है।
- source_word: לֹא יִמְצָא טוֹב
  choice: भलाई नहीं पाता
  rationale: ‘טוֹב’ में भलाई, कल्याण और अच्छा परिणाम—इन सभी का अर्थ-सामर्थ्य है; ‘भलाई’ इस व्यापकता को बनाए रखता है।
- source_word: וְנֶהְפָּךְ בִּלְשׁוֹנוֹ
  choice: और जिसकी जीभ टेढ़ी है
  rationale: मूल में जीभ या वाणी के उलटे, विकृत अथवा छलपूर्ण होने का चित्र है। समानांतरता बनाए रखने के लिए ‘टेढ़ी’ स्वाभाविक और चित्रात्मक है।
- source_word: יִפּוֹל בְּרָעָה
  choice: वह विपत्ति में पड़ता है
  rationale: ‘רָעָה’ यहाँ नैतिक बुराई या आने वाली मुसीबत दोनों का संकेत दे सकता है; क्रिया ‘पड़ता है’ के साथ ‘विपत्ति’ प्रसंगानुकूल परिणाम को स्पष्ट करती है।
theological_decisions:
- issue: ‘भलाई नहीं पाता’ का स्वरूप
  choice: इसे सामान्य नैतिक परिणाम के रूप में रखा गया
  alternative: इसे परमेश्वर से मिलने वाली भलाई या उद्धार के विशिष्ट कथन के रूप में स्पष्ट करना
  rationale: मूल पाठ किसी विशिष्ट धर्मवैज्ञानिक अर्थ को प्रत्यक्ष नहीं करता; नीतिवचन की सामान्य नैतिक उक्ति और उसकी अंतर्निहित व्यापकता को सुरक्षित रखा गया है।
- issue: רָעָה की अर्थगत अस्पष्टता
  choice: ‘विपत्ति’
  alternative: ‘बुराई’ या ‘मुसीबत’
  rationale: यहाँ ‘में पड़ता है’ परिणामस्वरूप अनिष्ट या संकट की ओर अधिक स्वाभाविक संकेत करता है, जबकि मूल में मौजूद नकारात्मक नैतिक छाया पूरी तरह समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, काव्यात्मक समानांतरता और मूल के ‘टेढ़े’ रूपक को दोनों पंक्तियों में बनाए रखा गया है। भाषा सामान्य पाठक के लिए सहज, किंतु नीतिवचन के अनुरूप गरिमापूर्ण है।
