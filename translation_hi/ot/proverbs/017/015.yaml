  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַצְדִּ֣יק רָ֭שָׁע וּ/מַרְשִׁ֣יעַ צַדִּ֑יק תּוֹעֲבַ֥ת יְ֝הוָ֗ה גַּם שְׁנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/015.yaml
  text: The one who acquits the wicked and the one who condemns the righteous—both alike are an abomination to Yahweh[a].
translation:
  language: hi
  text: जो दुष्ट को निर्दोष ठहराता है और जो धर्मी को दोषी ठहराता है—वे दोनों ही यहोवा की दृष्टि में घृणित हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצְדִּיק
  choice: निर्दोष ठहराता है
  rationale: यहाँ צדק का हिफ़ील कृदंत न्यायिक अर्थ रखता है और समानांतर ‘दोषी ठहराता है’ के विपरीत है। ‘निर्दोष ठहराना’ आधुनिक हिन्दी में न्यायालयीन बरी किए जाने का भाव स्पष्ट करता है, बिना बाद की धर्मवैज्ञानिक शब्दावली आरोपित किए।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह नैतिक रूप से दोषी व्यक्ति को सूचित करता है। ‘दुष्ट’ नीतिवचन की संक्षिप्त शैली में नैतिक आयाम बनाए रखता है; केवल ‘अपराधी’ कहना अर्थ को संकीर्ण कर सकता है।
- source_word: וּמַרְשִׁיעַ
  choice: और जो ... दोषी ठहराता है
  rationale: רשע का हिफ़ील कृदंत न्यायिक प्रयोग में किसी को दोषी घोषित करना है। यह ‘निर्दोष ठहराता है’ के साथ स्पष्ट न्यायिक विरोध रचता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह उस व्यक्ति को दर्शाता है जो सही पक्ष में है और नैतिक रूप से धर्मी है। ‘धर्मी’ नैतिक और न्यायिक दोनों प्रतिध्वनियाँ बनाए रखता है; ‘निर्दोष’ अर्थ को अधिक संकीर्ण कर देता।
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह परमेश्वर के लिए अत्यंत अप्रिय और नैतिक रूप से जघन्य वस्तु या आचरण का प्रबल शब्द है। ‘घृणित’ स्वाभाविक आधुनिक हिन्दी में इसकी तीव्रता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: גַּם שְׁנֵיהֶם
  choice: वे दोनों ही
  rationale: यह पद दोनों व्यक्तियों और उनके कार्यों के समान रूप से घृणित होने पर बल देता है; ‘दोनों ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: צדק/רשע से बने हिफ़ील क्रियापदों का न्यायिक या व्यापक नैतिक अर्थ
  choice: 'न्यायिक भाषा: ‘निर्दोष ठहराता है’ और ‘दोषी ठहराता है’'
  alternative: 'व्यापक नैतिक अर्थ: ‘दुष्ट को धर्मी मानता है’ और ‘धर्मी को दुष्ट मानता है’'
  rationale: दोनों समानांतर कृदंत न्यायालयीन विरोध प्रस्तुत करते हैं। न्यायिक अनुवाद नीतिवचन में विकृत न्याय की निन्दा को स्पष्ट रखता है और ‘धर्मी ठहराना’ जैसे पद से उत्पन्न हो सकने वाले बाद के धर्मवैज्ञानिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। न्यायिक विरोध को स्पष्ट करने के लिए ‘निर्दोष ठहराता’ और ‘दोषी ठहराता’ चुने गए हैं; वाक्य का अंतिम खंड मूल के बलाघात को ‘दोनों ही’ द्वारा बनाए रखता है।
