  edition: WLC
  text: גַּ֤ם עֲנ֣וֹשׁ לַ/צַּדִּ֣יק לֹא ט֑וֹב לְ/הַכּ֖וֹת נְדִיבִ֣ים עַל יֹֽשֶׁר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/026.yaml
  text: Also[a], to punish a righteous man is not good[b], nor to strike nobles for their uprightness.
translation:
  language: hi
  text: 'धर्मी व्यक्ति को दण्ड देना भी अच्छा नहीं,

    न ही कुलीनों[a] पर उनकी सत्यनिष्ठा के कारण[b] प्रहार करना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कुलीनों’ का अनुवाद ‘राजकुमारों’, ‘प्रधानों’ या ‘अगुओं’ भी किया जा सकता है; इब्रानी शब्द ऊँचे पद या कुल वाले लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘न्याय के विरुद्ध कुलीनों पर प्रहार करना।’ इब्रानी वाक्यांश का अर्थ ‘उनकी सत्यनिष्ठा के कारण’ अथवा ‘जो उचित है उसके विरुद्ध’—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले कथन से एक और बात जोड़ता है। हिन्दी में ‘भी’ इसके योगात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲנוֹשׁ
  choice: दण्ड देना
  rationale: क्रिया दण्ड लगाने के व्यापक अर्थ में है; ‘जुर्माना लगाना’ अनावश्यक रूप से अर्थ को सीमित कर देता।
- source_word: לַצַּדִּיק
  choice: धर्मी को
  rationale: संज्ञा रूप में प्रयुक्त एकवचन विशेषण ऐसे व्यक्ति को सूचित करता है जो धर्मी या निर्दोष है। ‘धर्मी को’ प्रतिनिधिक एकवचन और न्यायिक संदर्भ दोनों बनाए रखता है।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं
  rationale: यह इब्रानी का सामान्य मूल्यांकनात्मक वाक्यांश है। ‘अच्छा नहीं’ मूल अभिव्यक्ति को बनाए रखते हुए सहज हिन्दी है।
- source_word: לְהַכּוֹת
  choice: मारना
  rationale: נכה का मूल अर्थ प्रहार करना या मारना है। यहाँ ‘मारना’ किसी विशेष दण्ड-विधि या प्रहार की तीव्रता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נְדִיבִים
  choice: प्रतिष्ठित जनों
  rationale: इस संदर्भ में शब्द ऊँचे पद या सामाजिक प्रतिष्ठा वाले लोगों को सूचित करता है। ‘प्रतिष्ठित जन’ आधुनिक हिन्दी में स्वाभाविक है और ‘उदार लोगों’ वाले कम सम्भावित अर्थ से बचता है।
- source_word: עַל יֹשֶׁר
  choice: उनके सीधेपन के कारण
  rationale: עַל को कारण या आधार बताने वाला मानने पर अर्थ है कि उन्हें उनके सीधेपन के कारण मारा जाता है। ‘उनके’ सन्दर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है, पर वैकल्पिक अर्थ ‘न्याय के विरुद्ध’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: עַל יֹשֶׁר का वाक्यगत सम्बन्ध
  choice: प्रतिष्ठित जन अपने सीधेपन के कारण मारे जाते हैं
  alternative: प्रतिष्ठित जनों को न्याय के विरुद्ध मारा जाता है
  rationale: पूर्वसर्ग עַל कारण या आधार व्यक्त कर सकता है, इसलिए मुख्य पाठ में अधिक सीधा शाब्दिक अर्थ रखा गया है। फिर भी क्रियाविशेषणीय अर्थ भी व्याकरण और सन्दर्भ की दृष्टि से सम्भव है, अतः उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की समानान्तर काव्य-रचना के अनुरूप रखी गई है। दूसरी पंक्ति में ‘अच्छा नहीं’ को हिन्दी के स्वाभाविक समानान्तर वाक्य ‘न ही … मारना’ में निहित रखा गया है।
