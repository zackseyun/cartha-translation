  yaml_path: translation/ot/proverbs/017/022.yaml
  text: A joyful heart promotes healing[a], but a crushed spirit dries up the bones.
translation:
  language: hi
  text: प्रसन्न मन चंगाई को बढ़ावा देता है[a], पर टूटी हुई आत्मा हड्डियों को सुखा देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “औषधि के समान भला करता है।” इब्रानी संज्ञा גֵּהָה का अर्थ चंगाई, स्वास्थ्य-लाभ या औषधि हो सकता है; मुख्य पाठ में व्यापक अर्थ “चंगाई” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: मन
  rationale: यहाँ לֵב मनुष्य के भीतरी व्यक्तित्व, भावनाओं और इच्छा को दर्शाता है। आधुनिक हिन्दी में ‘आनन्दित मन’ स्वाभाविक है और केवल शारीरिक हृदय का अर्थ लेने से बचाता है।
- source_word: שָׂמֵחַ
  choice: आनन्दित
  rationale: यह शब्द प्रसन्नता और आनन्द की अवस्था व्यक्त करता है; ‘आनन्दित’ वर्तमान मानक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: יֵיטִב
  choice: बढ़ावा देता है
  rationale: हिफ़ील रूप ‘भलाई करना/अच्छा प्रभाव डालना’ व्यक्त करता है। גֵּהָה के साथ यह वाक्यांश चंगाई में सहायक होने या उसे आगे बढ़ाने का भाव स्वाभाविक रूप से देता है।
- source_word: גֵּהָה
  choice: चंगाई
  rationale: इस दुर्लभ संज्ञा का अर्थ चंगाई, स्वास्थ्य-लाभ या औषधि हो सकता है। ‘चंगाई’ व्यापक अर्थ बनाए रखती है और दूसरे चरण में शारीरिक क्षय के चित्र से मेल खाती है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ רוּחַ मनुष्य की भीतरी दशा या आत्मिक चेतना को दर्शाता है। ‘आत्मा’ समानांतर मानवीय बिंब को बनाए रखती है, यद्यपि आशय मनोदशा तक सीमित नहीं है।
- source_word: נְכֵאָה
  choice: कुचली हुई
  rationale: विशेषण दबे, टूटे या आहत भीतरी भाव को व्यक्त करता है। ‘कुचली हुई’ मूल के सशक्त चित्र को सुरक्षित रखता है।
- source_word: תְּיַבֶּשׁ
  choice: सुखा देती है
  rationale: पिएल क्रिया प्रबल रूप से सुखाने या शुष्क कर देने का भाव देती है; यह हिन्दी में ठोस रूपक को स्पष्ट रखती है।
- source_word: גָּרֶם
  choice: हड्डियों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में शरीर की हड्डियों या ढाँचे को दर्शा सकता है। हिन्दी में बहुवचन ‘हड्डियों’ इस लोकोक्तिपरक बिंब के लिए स्वाभाविक है।
