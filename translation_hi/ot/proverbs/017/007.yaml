  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא נָאוָ֣ה לְ/נָבָ֣ל שְׂפַת יֶ֑תֶר אַ֝֗ף כִּֽי לְ/נָדִ֥יב שְׂפַת שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/007.yaml
  text: Excellent speech is not fitting for a fool[b][a]; how much less are lying lips for a noble man.
translation:
  language: hi
  text: 'उत्कृष्ट वाणी[a] मूर्ख को शोभा नहीं देती;

    तो झूठे होंठ किसी कुलीन व्यक्ति[b] को और भी कम शोभा देते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊँची वाणी” अथवा “बढ़-चढ़कर बोलना।” इब्रानी अभिव्यक्ति श्रेष्ठ, ऊँची या अतिशयोक्तिपूर्ण वाणी का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “राजकुमार” अथवा “उदार व्यक्ति।” इब्रानी शब्द कुलीन पद या कुलीन चरित्र, दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוָה
  choice: शोभा नहीं देती / शोभा देते
  rationale: यह पद उपयुक्त या शोभनीय होने का भाव व्यक्त करता है। हिंदी में ‘शोभा देना’ नीतिवचन की मर्यादित शैली में स्वाभाविक है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: नीतिवचन-साहित्य में यह शब्द केवल कम बुद्धि वाले नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति को दर्शाता है; ‘मूर्ख’ इसका संक्षिप्त और प्रचलित हिंदी रूप है।
- source_word: שְׂפַת יֶתֶר
  choice: उत्कृष्ट वाणी
  rationale: शाब्दिक अर्थ ‘श्रेष्ठता/अधिकता का होंठ’ है। संदर्भ में ऊँची, प्रभावशाली या परिष्कृत वाणी का भाव है; ‘उत्कृष्ट वाणी’ मुख्य अर्थ को सहज हिंदी में व्यक्त करती है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: אַף כִּי
  choice: तो ... और भी कम
  rationale: यह मुहावरा पहले कथन से अधिक प्रबल दूसरे निष्कर्ष की ओर ले जाता है। ‘और भी कम’ हिंदी में इस न्यूनतर-तर्क को स्पष्ट रखता है।
- source_word: נָדִיב
  choice: कुलीन व्यक्ति
  rationale: यह शब्द कुलीन पद, प्रतिष्ठित चरित्र, उदारता या कभी-कभी राजकीय हैसियत वाले व्यक्ति को सूचित कर सकता है। ‘कुलीन व्यक्ति’ मुख्य सामाजिक-नैतिक विरोध को बनाए रखता है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: שְׂפַת שָׁקֶר
  choice: झूठे होंठ
  rationale: इब्रानी में शाब्दिक चित्र ‘झूठ का होंठ’ है। ‘झूठे होंठ’ हिंदी में समझने योग्य है और मूल की सजीव शारीरिक उपमा को सुरक्षित रखता है।
