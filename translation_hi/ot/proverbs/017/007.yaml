  register: आधुनिक मानक हिंदी की संक्षिप्त, संतुलित और गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। दोनों पंक्तियों का विरोध और ‘और भी कम’ वाला तर्क स्पष्ट रखा गया है; ‘झूठे होंठ’ मूल बिंब को बनाए रखता है।
