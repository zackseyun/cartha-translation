  text: A wicked man takes a bribe from the bosom to pervert the paths of justice[a][b].
translation:
  language: hi
  text: दुष्ट व्यक्ति अपनी गोद से घूस लेता है[a], न्याय के मार्गों को मोड़ने के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छाती से” या “वस्त्र की तह से”; इब्रानी बिंब संभवतः वस्त्र की ऐसी तह से कुछ लेने का संकेत करता है जहाँ उसे छिपाकर रखा जाता था, जिससे गोपनीयता का भाव निकलता है।
    reason: lexical_alternative
  - marker: b
    text: या “न्याय की प्रक्रिया को बिगाड़ने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: घूस
  rationale: यह संज्ञा निर्णय या आचरण को अनुचित रूप से प्रभावित करने के लिए दिए गए अवैध धन या उपहार को दर्शाती है; आधुनिक हिन्दी में “घूस” इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: מֵחֵיק
  choice: छाती की ओट से
  rationale: חֵיק का मूल अर्थ छाती या गोद है और यह वस्त्र की उस तह की ओर भी संकेत कर सकता है जहाँ कोई वस्तु छिपाकर रखी जाती थी। “छाती की ओट से” ठोस इब्रानी बिंब और गोपनीयता—दोनों को बनाए रखता है।
- source_word: רָשָׁע
  choice: दुष्ट व्यक्ति
  rationale: यह एक दुष्ट मनुष्य को सूचित करने वाला विशेषण-संज्ञा है। “दुष्ट व्यक्ति” प्रतिनिधिक एकवचन को रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: יִקָּח
  choice: लेता है
  rationale: לקח का सामान्य अर्थ “लेना” है। यहाँ प्रसंगतः घूस स्वीकार करना अभिप्रेत है, पर “लेता है” मूल क्रिया के निकट और स्वाभाविक है।
- source_word: לְהַטּוֹת
  choice: टेढ़ा कर दे
  rationale: נטה यहाँ सही दिशा से मोड़ने या विचलित करने का भाव देता है। “टेढ़ा कर दे” मार्ग के रूपक को बनाए रखते हुए न्याय को भ्रष्ट करने का अर्थ व्यक्त करता है।
- source_word: אָרְחוֹת
  choice: मार्गों
  rationale: बहुवचन संज्ञा का अर्थ “मार्ग” या “रास्ते” है। “मार्गों” नीतिवचन में प्रयुक्त रूपक और मूल के बहुवचन दोनों को सुरक्षित रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: घूस और न्यायिक भ्रष्टाचार के इस प्रसंग में מִשְׁפָּט का आशय न्याय से है, केवल किसी एक निर्णय से नहीं।
- source_word: אָרְחוֹת מִשְׁפָּט
  choice: न्याय के मार्गों
  rationale: यह पदबंध उस रूपक को बनाए रखता है जिसमें न्याय के उचित मार्गों को घूस के द्वारा टेढ़ा किया जाता है; एकवचन भावार्थ “न्याय की प्रक्रिया” भी संभव है।
