  yaml_path: translation/ot/proverbs/017/021.yaml
  text: He who fathers a fool does so to his own grief[b][a], and the father of a fool has no joy.
translation:
  language: hi
  text: जो मूर्ख संतान का पिता बनता है, वह अपने ही दुःख का कारण बनता है[a]; और नीच व्यक्ति के पिता को आनन्द नहीं मिलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शब्दशः: ‘मूर्ख को जन्म देने वाला उसके लिए दुःख उत्पन्न करता है।’ इब्रानी वाक्य बहुत संक्षिप्त है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹלֵד
  choice: जो … जन्म देता है
  rationale: यह क़ाल कृदन्त संज्ञा की तरह प्रयुक्त है और उसका अर्थ ‘जन्म देने वाला/उत्पन्न करने वाला’ है। दूसरे चरण में ‘पिता’ आने के कारण यहाँ पितृत्व का भाव स्पष्ट है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह उस व्यक्ति के लिए प्रचलित ज्ञान-साहित्यिक शब्द है जो केवल बुद्धि में कम नहीं, बल्कि हठी और नैतिक समझ से रहित भी है।
- source_word: לְתוּגָה לוֹ
  choice: अपने ही दुःख के लिए
  rationale: תוגה का अर्थ दुःख या शोक है; לוֹ यह स्पष्ट करता है कि उसका परिणाम जन्म देने वाले व्यक्ति के अपने दुःख के रूप में होता है।
- source_word: וְלֹא יִשְׂמַח
  choice: आनन्दित नहीं होता
  rationale: अपूर्ण क्रिया यहाँ नीतिवचन के सामान्य, निरन्तर सत्य को व्यक्त करती है; यह अनुवाद मूल के ‘प्रसन्न न होने’ के भाव को सीधा रखता है।
- source_word: אֲבִי
  choice: का पिता
  rationale: यह रचना-रूप अगले शब्द के साथ ‘… का पिता’ बनाता है और पहले चरण के जन्म देने वाले व्यक्ति के समानान्तर है।
- source_word: נָבָל
  choice: नीच व्यक्ति
  rationale: यह शब्द मात्र बौद्धिक मूर्खता नहीं, बल्कि नैतिक निकृष्टता, लज्जाजनक आचरण और चरित्रहीनता का संकेत देता है; इसलिए इसे כסיל से अलग रखा गया है।
theological_decisions:
- issue: כְּסִיל और נָבָל के बीच भेद
  choice: पहले को ‘मूर्ख’ और दूसरे को ‘नीच व्यक्ति’ कहा गया है।
  alternative: दोनों के लिए ‘मूर्ख’
  rationale: दोनों शब्द अर्थ में कुछ हद तक मिलते हैं, पर נָבָל में नैतिक नीचता और अपमानजनक चरित्र का अधिक स्पष्ट भाव है। भेद बनाए रखने से इब्रानी समानान्तरता की सूक्ष्मता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। पहले चरण की संक्षिप्त इब्रानी रचना को स्वाभाविक बनाने के लिए ‘ऐसा करता है’ जोड़ा गया है, जबकि परिणाम का भाव ‘अपने ही दुःख के लिए’ में सुरक्षित है।
