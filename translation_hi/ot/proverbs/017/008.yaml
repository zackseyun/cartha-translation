base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/008.yaml
  text: A bribe is a charm-stone in the eyes of its owner[a]; wherever he turns[b], he prospers.
translation:
  language: hi
  text: रिश्वत जिसके पास वह है, उसकी दृष्टि में कृपा दिलाने वाला पत्थर है[a]; वह जिधर भी मुड़ता है, सफल होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “बहुमूल्य पत्थर,” “जादुई पत्थर” अथवा “भाग्यशाली ताबीज़।” इब्रानी में: “कृपा का पत्थर।”'
    reason: lexical_alternative
  - marker: b
    text: या “समृद्ध होता है।” इब्रानी क्रिया सफल होने, समृद्ध होने अथवा समझ-बूझ से काम करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֵן
  choice: कृपा दिलानेवाला पत्थर
  rationale: शाब्दिक अर्थ ‘कृपा/अनुग्रह का पत्थर’ है। यह रूप पत्थर की मूल छवि और कृपा अथवा अनुकूलता प्राप्त कराने की कथित शक्ति—दोनों को बनाए रखता है; अधिक स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הַשֹּׁחַד
  choice: रिश्वत
  rationale: यह संज्ञा सामान्यतः अनुचित लाभ के लिए दिए गए धन या उपहार को दर्शाती है। इस नीतिवचन में नैतिक रूप से नकारात्मक ‘रिश्वत’ सबसे उपयुक्त है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह दृष्टिकोण या मूल्यांकन बतानेवाली इब्रानी अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: בְעָלָיו
  choice: अपने देनेवाले
  rationale: शाब्दिक रूप से ‘उसके स्वामी/धारक’ है और रिश्वत रखनेवाले व्यक्ति को सूचित करता है। प्रसंग में वह व्यक्ति रिश्वत का उपयोग करनेवाला, अर्थात देनेवाला है; हिन्दी में यह संबंध अधिक स्पष्ट करता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: אֶל כָּל אֲשֶׁר יִפְנֶה
  choice: वह जिधर भी मुड़ता है
  rationale: यह किसी भी दिशा या प्रयत्न की ओर जाने का व्यापक भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יַשְׂכִּיל
  choice: सफल होता है
  rationale: שׂכל का हिफ़ील रूप समझ-बूझ से काम करने, सफल होने या समृद्ध होने का भाव दे सकता है। यहाँ रिश्वत से प्राप्त व्यावहारिक परिणाम पर जोर है; ‘सफल होता है’ अनावश्यक आर्थिक अर्थ जोड़े बिना इसे व्यक्त करता है।
theological_decisions:
- issue: क्या नीतिवचन रिश्वत को अनुमोदित करता है?
  choice: वर्णनात्मक कथन के रूप में अनुवाद; कोई स्पष्ट नैतिक टिप्पणी नहीं जोड़ी गई।
  alternative: रिश्वत की सफलता को विडंबनापूर्ण या स्पष्ट निंदात्मक भाषा में प्रस्तुत करना।
  rationale: मूल पद भ्रष्ट साधन की कथित प्रभावशीलता बताता है, पर इसी पद में प्रत्यक्ष अनुमोदन या निंदा नहीं जोड़ता। ‘रिश्वत’ शब्द नैतिक स्वर को पर्याप्त रूप से संकेतित करता है, और मूल का तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और गरिमापूर्ण काव्यात्मक गद्य। ‘कृपा दिलानेवाला पत्थर’ मूल इब्रानी रूपक को सुरक्षित रखते हुए साधारण पाठक के लिए उसका आशय खोलता है। मुख्य पाठ में सभी पादटिप्पणी चिह्न उपस्थित हैं।
