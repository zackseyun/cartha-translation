  text: Better is a dry crust with peace than a house full of sacrificial feasts with strife[a].
translation:
  language: hi
  text: झगड़े के साथ बलिदान-भोज[a] से भरे घर की अपेक्षा शांति के साथ सूखी रोटी का एक टुकड़ा अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बलिदानों से भरे’; इब्रानी शब्द का अर्थ बलिदान भी हो सकता है और बलिदान से जुड़ा भरपूर भोज भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: तुलनात्मक नीतिवचन-सूत्र को स्वाभाविक हिन्दी में ‘...की अपेक्षा ... अच्छा है’ से व्यक्त किया गया है।
- source_word: פַּת חֲרֵבָה
  choice: सूखी रोटी का एक टुकड़ा
  rationale: פַּת रोटी के छोटे अंश को और חֲרֵבָה उसके सूखे होने को दर्शाता है; यह साधारण अथवा अल्प भोजन की छवि बनाए रखता है।
- source_word: וְשַׁלְוָה בָהּ
  choice: शांति के साथ
  rationale: שַׁלְוָה का भाव चैन, शांति और निश्चिंतता है। हिन्दी में ‘शांति के साथ’ दूसरे खंड के ‘झगड़े’ के साथ स्पष्ट विरोध बनाता है, जबकि प्रत्यय का स्थानगत अर्थ मुहावरेदार ढंग से समाहित होता है।
- source_word: מִבַּיִת מָלֵא
  choice: '...से भरे ... घर की अपेक्षा'
  rationale: तुलनात्मक מִן को ‘की अपेक्षा’ और ठोस घरेलू परिवेश को ‘घर’ से बनाए रखा गया है।
- source_word: זִבְחֵי
  choice: बलिदान-भोज
  rationale: זֶבַח बलिदान तथा उससे जुड़े सामूहिक भोज दोनों का संकेत दे सकता है। ‘बलिदान-भोज’ धार्मिक पृष्ठभूमि और प्रचुर भोजन की छवि दोनों को रखता है।
- source_word: רִיב
  choice: झगड़ा
  rationale: यह पारस्परिक कलह या विवाद को साधारण आधुनिक हिन्दी में व्यक्त करता है और ‘शांति’ के साथ सशक्त विरोध बनाता है।
