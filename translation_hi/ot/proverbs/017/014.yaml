  yaml_path: translation/ot/proverbs/017/014.yaml
  text: The beginning of strife is like letting out water[b][a]; so abandon the quarrel before it breaks out.
translation:
  language: hi
  text: झगड़े की शुरुआत पानी को बहने देने के समान है[a]; इसलिए विवाद के फूट पड़ने[b] से पहले ही उसे छोड़ दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झगड़े की शुरुआत वैसी है जैसे कोई व्यक्ति पानी छोड़ दे।” इब्रानी चित्र बाँध या नाली में रास्ता खोलने की ओर संकेत कर सकता है; इसके बाद बहाव को रोकना कठिन हो जाता है।
    reason: lexical_alternative
  - marker: b
    text: “फूट पड़ने” के लिए प्रयुक्त इब्रानी क्रिया कठिन है; इसके अर्थ “फट निकलने,” “खुलकर सामने आने,” या “बढ़ जाने” जैसे भी हो सकते हैं। आशय है कि विवाद के खुले और बेकाबू होने से पहले उसे रोक दिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹטֵר מַיִם
  choice: पानी को बह निकलने देना
  rationale: यह पदबंध रोके हुए पानी को किसी खुली जगह या दरार से निकलने देने का ठोस चित्र प्रस्तुत करता है। यह हिंदी में स्वाभाविक रहते हुए उस प्रवाह का संकेत देता है जिसे आरंभ होने के बाद रोकना कठिन होता है।
- source_word: רֵאשִׁית מָדוֹן
  choice: झगड़े की शुरुआत
  rationale: רֵאשִׁית आरंभिक अवस्था को और מָדוֹן कलह या झगड़े को दर्शाता है। ‘झगड़े की शुरुआत’ सामान्य पाठक के लिए स्पष्ट और नीतिवचन की शैली के अनुकूल है।
- source_word: וְלִפְנֵי
  choice: इसलिए ... से पहले
  rationale: मूल में संयोजक और ‘पहले’ का भाव है। हिंदी में ‘इसलिए’ पहली पंक्ति के चित्र से निकले व्यावहारिक निष्कर्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִתְגַּלַּע
  choice: फूट पड़ने
  rationale: यह कठिन क्रिया खुल जाने, फूट पड़ने या उग्र रूप से प्रकट होने का भाव दे सकती है। ‘फूट पड़ने’ से मूल की अनिश्चितता को अत्यधिक संकीर्ण किए बिना खुले और अनियंत्रित संघर्ष का आरंभ व्यक्त होता है।
- source_word: הָרִיב
  choice: विवाद
  rationale: רִיב किसी झगड़े, विवाद या मुकदमे जैसे संघर्ष को सूचित कर सकता है। यहाँ ‘विवाद’ दूसरी पंक्ति में स्वाभाविक है और पहली पंक्ति के ‘झगड़े’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: נְטוֹשׁ
  choice: उसे छोड़ दो
  rationale: आज्ञार्थक क्रिया विवाद से हट जाने या उसे जारी न रखने की दृढ़ पुकार है। ‘छोड़ दो’ आधुनिक हिंदी में सीधा, स्पष्ट और स्वाभाविक है।
