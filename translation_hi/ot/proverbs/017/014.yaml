  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। पानी के मूल रूपक को स्पष्ट किंतु व्याख्यात्मक विस्तार के बिना मुख्य पाठ में सुरक्षित रखा गया है; कठिन क्रिया की वैकल्पिक संभावनाएँ पादटिप्पणी में दी गई हैं।
