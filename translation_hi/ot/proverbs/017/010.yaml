  text: A rebuke goes deeper into a man of understanding than a hundred blows into a fool[a].
translation:
  language: hi
  text: समझदार मनुष्य पर एक डाँट का असर मूर्ख को सौ बार मारने से भी अधिक होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदार मनुष्य के भीतर एक डाँट, मूर्ख को सौ बार मारने से अधिक गहराई तक उतरती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּחַת
  choice: असर ... अधिक होता है
  rationale: यह रूप मूलतः नीचे उतरने या भीतर पैठने का भाव देता है। हिन्दी में ‘असर ... अधिक होता है’ इस लोकोक्तिपरक सन्दर्भ में प्रभाव की तुलना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גְּעָרָה
  choice: एक डाँट
  rationale: यह शब्द तीखी मौखिक फटकार या सुधार को दर्शाता है। ‘डाँट’ सरल, वर्तमान और कहावत की संक्षिप्त शैली के अनुकूल है।
- source_word: בְמֵבִין
  choice: समझदार मनुष्य पर
  rationale: पुल्लिंग एकवचन कृदन्त ऐसे व्यक्ति को दर्शाता है जो समझ रखता है। ‘समझदार मनुष्य’ उसके व्याकरणिक रूप और नीतिवचन में प्रतिनिधि व्यक्ति—दोनों को सुरक्षित रखता है।
- source_word: מֵהַכּוֹת
  choice: प्रहारों से भी अधिक
  rationale: उपसर्ग מ तुलना को चिह्नित करता है और נכה का क्रियार्थ मारने या प्रहार करने का है। यह चयन तुलना को स्पष्ट और चित्र को सजीव रखता है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और बौद्धिक रूप से हठी व्यक्ति के लिए पारिभाषिक ज्ञान-साहित्यिक शब्द है; ‘मूर्ख’ इसका मानक हिन्दी समतुल्य है।
- source_word: מֵאָה
  choice: सौ
  rationale: संख्या अतिशयोक्तिपूर्ण ढंग से विरोध को तीव्र करती है; ‘सौ’ स्वाभाविक और संक्षिप्त हिन्दी है।
