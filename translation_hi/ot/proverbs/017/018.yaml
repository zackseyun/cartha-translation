  text: אָדָ֣ם חֲסַר לֵ֭ב תּוֹקֵ֣עַ כָּ֑ף עֹרֵ֥ב עֲ֝רֻבָּ֗ה לִ/פְנֵ֥י רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/018.yaml
  text: A man lacking sense shakes hands[c][b][a], pledging security before his neighbor.
translation:
  language: hi
  text: जिस मनुष्य में समझ नहीं, वह हाथ मिलाता है[a][b] और अपने पड़ोसी के सामने[c] ज़मानत की जिम्मेदारी लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाथ पर हाथ मारता है” या “हाथ पकड़ता है।”
    reason: lexical_alternative
  - marker: b
    text: यह हाथ के संकेत द्वारा किसी वित्तीय प्रतिज्ञा या गारंटी को पक्का करने की प्रथा का उल्लेख है।
    reason: cultural_note
  - marker: c
    text: या “अपने पड़ोसी की उपस्थिति में”; इब्रानी वाक्यांश यह स्पष्ट नहीं करता कि पड़ोसी लाभार्थी, लेनदार या साक्षी है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह एक नीतिवचन में किसी एक प्रतिनिधि व्यक्ति को सूचित करता है; ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के व्याकरणिक रूप के अनुरूप है।
- source_word: חֲסַר לֵב
  choice: समझ से खाली
  rationale: शाब्दिक अर्थ ‘हृदय से खाली’ है, पर इब्रानी ज्ञान-साहित्य में ‘हृदय’ समझ, विवेक और निर्णय-क्षमता का केंद्र है। यह चयन मुहावरे का आशय स्पष्ट रखते हुए उसकी नैतिक-बौद्धिक शक्ति बनाए रखता है।
- source_word: תּוֹקֵעַ כָּף
  choice: हाथ मिलाता है
  rationale: शाब्दिक चित्र हाथ पर हाथ मारने या हाथ पकड़ने का है और यहाँ वह किसी वित्तीय प्रतिज्ञा या गारंटी को पक्का करने की प्रथा सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עֹרֵב עֲרֻבָּה
  choice: ज़मानत का दायित्व लेता है
  rationale: सजातीय क्रिया और संज्ञा का यह प्रयोग किसी दूसरे के लिए गारंटर बनने की बाध्यकारी जिम्मेदारी व्यक्त करता है। ‘ज़मानत का दायित्व’ वित्तीय-कानूनी आशय को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: לִפְנֵי רֵעֵהוּ
  choice: अपने पड़ोसी के सामने
  rationale: לִפְנֵי का सामान्य अर्थ ‘के सामने/की उपस्थिति में’ है। यह अनुवाद पड़ोसी को लाभार्थी, ऋणी, लेनदार या साक्षी मानकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
