review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the generic subject, the exchange sense of תחת, the טובָה/רָעָה contrast, and the Hebrew repetition of רָעָה. However, “भलाई के बदले बुराई करता है” can mean merely doing evil instead of doing good, rather than returning evil in response to good. “लौटाता है” more explicitly carries the reciprocal sense of מֵשִׁיב. The added “कभी” slightly strengthens the simple future negation and is unnecessary.
  naturalness: The revised wording is concise, natural modern standard Hindi, and retains the balanced proverbial cadence.
  terminology: “भलाई” and “बुराई” appropriately retain the moral contrast and the lexical repetition. The note properly preserves the second occurrence’s possible consequential sense, “विपत्ति.”
  issues:
  - severity: medium
    issue: The verb “करता है” weakens the reciprocal/retributive force of מֵשִׁיב.
    rationale: It may be understood as doing evil in place of good, whereas the Hebrew describes returning or repaying evil for good.
  - severity: low
    issue: “कभी” adds an absolute temporal emphasis not explicit in the Hebrew.
    rationale: The imperfect negation adequately conveys that evil will not leave; omitting “कभी” is closer while remaining idiomatic.
