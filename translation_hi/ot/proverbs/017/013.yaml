  text: מֵשִׁ֣יב רָ֭עָה תַּ֣חַת טוֹבָ֑ה לֹא תמיש רָ֝עָ֗ה מִ/בֵּיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/013.yaml
  text: Whoever repays evil for good[a], evil will not depart from his house.
translation:
  language: hi
  text: 'जो भलाई के बदले बुराई लौटाता है,

    उसके घर से बुराई दूर न होगी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके घर से विपत्ति दूर न होगी।” दूसरी बार आया “बुराई” (רָעָה) नैतिक बुराई के साथ-साथ अनिष्ट या विपत्ति भी सूचित कर सकता है; मुख्य पाठ इब्रानी की पुनरावृत्ति बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: करता है
  rationale: हिफ़ील कृदंत यहाँ प्रत्युत्तर या प्रतिदान में कुछ लौटाने का भाव देता है। ‘भलाई के बदले बुराई करता है’ आधुनिक हिन्दी में स्वाभाविक है और कृत्य के प्रतिदानात्मक स्वरूप को स्पष्ट रखता है।
- source_word: רָעָה
  choice: बुराई
  rationale: पहला प्रयोग नैतिक रूप से गलत व्यवहार को सूचित करता है। ‘बुराई’ इस नैतिक अर्थ को सुरक्षित रखता है और ‘भलाई’ के साथ स्पष्ट विरोध बनाता है।
- source_word: תַּחַת
  choice: के बदले
  rationale: यह पूर्वसर्ग विनिमय या प्रतिदान व्यक्त करता है; ‘के बदले’ हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: טוֹבָה
  choice: भलाई
  rationale: यह शब्द अच्छाई, लाभ या उपकार को व्यापक रूप से व्यक्त कर सकता है। ‘भलाई’ सामान्य अर्थ बनाए रखता है और इसे केवल किसी एक उपकार तक सीमित नहीं करता।
- source_word: לֹא תמיש
  choice: कभी दूर न होगी
  rationale: מוש का रूप हटने या दूर होने को व्यक्त करता है। निषेध के साथ ‘कभी दूर न होगी’ घर पर उसके बने रहने की स्थायी चेतावनी को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: רָעָה
  choice: बुराई
  rationale: दूसरा प्रयोग नैतिक बुराई अथवा विपत्ति/अनिष्ट, दोनों अर्थ दे सकता है। मुख्य पाठ में ‘बुराई’ दोहराने से इब्रानी की शब्द-पुनरावृत्ति और नीतिवचन की तीखी समरूपता बचती है; परिणामसूचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִבֵּיתוֹ
  choice: उसके घर से
  rationale: בַּיִת घर, घराना या परिवार सूचित कर सकता है। ‘घर’ सबसे सीधा रूप है और व्यापक गृहस्थी का आशय भी ग्रहण कर सकता है।
- source_word: implicit subject of participle
  choice: जो
  rationale: संज्ञात्मक कृदंत का सामान्य, अनिर्दिष्ट कर्ता आधुनिक हिन्दी में ‘जो’ से सहज रूप में व्यक्त होता है।
theological_decisions:
- issue: दूसरी बार आए רָעָה का नैतिक बुराई या विपत्ति होना
  choice: मुख्य पाठ में ‘बुराई’
  alternative: ‘विपत्ति’ या ‘अनिष्ट’
  rationale: इब्रानी दोनों अर्थों की गुंजाइश देता है। ‘बुराई’ दोनों occurrences की पुनरावृत्ति सुरक्षित रखती है, जबकि पादटिप्पणी परिणाम या विपत्ति वाला अर्थ स्पष्ट करती है और अस्पष्टता को अनुचित रूप से हल नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और नीतिवचन-सुलभ समानांतर संरचना। ‘भलाई/बुराई’ का विरोध और इब्रानी की पुनरावृत्ति सुरक्षित रखी गई है।
