base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/024.yaml
  text: Wisdom is before the face of a discerning man[c][b][a], but the eyes of a fool are at the ends of the earth.
translation:
  language: hi
  text: समझदार के सामने बुद्धि रहती है,[a] पर मूर्ख की आँखें पृथ्वी के छोरों पर लगी रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदार की उपस्थिति में बुद्धि रहती है।” इब्रानी में शाब्दिक रूप से “समझदार के चेहरे के सामने” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת פְּנֵי
  choice: के सामने
  rationale: यहाँ संयुक्त पद का अर्थ ‘सामने/उपस्थिति में’ है। इससे समझदार के पास बुद्धि की सुलभ उपस्थिति और दूर भटकती मूर्ख की दृष्टि के बीच का विरोध स्वाभाविक हिन्दी में बना रहता है।
- source_word: מֵבִין
  choice: समझदार
  rationale: पुल्लिंग एकवचन कृदंत एक प्रतिनिधि नीतिवचनात्मक व्यक्ति को दर्शाता है; ‘समझदार’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह अमूर्त संज्ञा है; इस पद में अनिवार्य रूप से व्यक्तिरूपित सत्ता मानने की आवश्यकता नहीं है।
- source_word: וְעֵינֵי
  choice: पर ... की आँखें
  rationale: वाव को प्रसंगानुसार विरोधसूचक ‘पर’ किया गया है, क्योंकि दोनों पंक्तियाँ समझदार और मूर्ख का स्पष्ट विरोध प्रस्तुत करती हैं।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और बौद्धिक मूर्खता वाले व्यक्ति का सामान्य पद है; ‘मूर्ख’ इसका स्पष्ट मानक हिन्दी रूप है।
- source_word: בִּקְצֵה אָרֶץ
  choice: पृथ्वी के छोरों पर
  rationale: यह दूरस्थ स्थान का अतिशयोक्तिपूर्ण बिंब सुरक्षित रखता है और निकट उपलब्ध बुद्धि के विपरीत मूर्ख की भटकती दृष्टि दिखाता है।
theological_decisions:
- issue: नीतिवचन का पुल्लिंग प्रतिनिधि पात्र
  choice: समझदार
  alternative: समझ रखने वाला व्यक्ति
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर नीतिवचन में प्रतिनिधि प्रकार के रूप में प्रयुक्त है। हिन्दी ‘समझदार’ मूल रूप और सामान्य अनुप्रयोग दोनों को सहज रूप से रखता है।
- issue: बुद्धि का व्यक्तिकरण
  choice: बुद्धि रहती है
  alternative: बुद्धि उपस्थित है
  rationale: मूल पाठ बुद्धि को अनिवार्य रूप से कोई पृथक व्यक्तित्व नहीं ठहराता। ‘रहती है’ अमूर्त संज्ञा के स्त्रीलिंग व्याकरण के अनुरूप है और अनुचित धर्मवैज्ञानिक व्यक्तिकरण से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘के सामने’ शाब्दिक चेहरे के बिंब को हिन्दी में जड़ बना देने के बजाय उसके स्थानिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
