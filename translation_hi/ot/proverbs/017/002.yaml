id: PRO.17.2
reference: Proverbs 17:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֶֽבֶד מַשְׂכִּ֗יל יִ֭מְשֹׁל בְּ/בֵ֣ן מֵבִ֑ישׁ וּ/בְ/ת֥וֹךְ אַ֝חִ֗ים יַחֲלֹ֥ק נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/002.yaml
  text: A prudent servant will rule over a son who brings shame[b][a], and among brothers he will share the inheritance.
translation:
  language: hi
  text: समझदार दास लज्जा लाने वाले बेटे पर शासन करेगा, और भाइयों के बीच वह विरासत में हिस्सा पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द अधीन और संभवतः बंधुआ व्यक्ति को दर्शाता है। यहाँ सामाजिक उलटफेर—दास का निकम्मे पुत्र से ऊपर उठना—कहावत की धार है; इसलिए केवल ‘सेवक’ की अपेक्षा ‘दास’ उपयुक्त है।
- source_word: מַשְׂכִּיל
  choice: समझदार
  rationale: שׂכל का यह रूप व्यावहारिक सूझ-बूझ और विवेकपूर्ण आचरण बताता है। आधुनिक हिन्दी में ‘समझदार’ सहज और अर्थानुकूल है।
- source_word: יִמְשֹׁל בְּבֵן
  choice: बेटे पर शासन करेगा
  rationale: משׁל अधिकार चलाने या शासन करने का सीधा अर्थ देता है, और ב उस व्यक्ति को चिह्नित करता है जिस पर अधिकार होगा।
- source_word: מֵבִישׁ
  choice: लज्जा लानेवाले
  rationale: यह कृदन्त केवल ‘लज्जित’ नहीं, बल्कि लज्जा उत्पन्न करनेवाले व्यक्ति को दर्शाता है।
- source_word: וּבְתוֹךְ אַחִים
  choice: और भाइयों के बीच
  rationale: मूल में पुल्लिंग बहुवचन ‘भाई’ है और वाक्यांश परिवार के उत्तराधिकारियों के समूह में सम्मिलित होने का संकेत देता है।
- source_word: יַחֲלֹק נַחֲלָה
  choice: विरासत में हिस्सा पाएगा
  rationale: חלק का मूल भाव बाँटना या भाग लेना है; विरासत के संदर्भ में हिन्दी का ‘हिस्सा पाएगा’ आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परिवार-सूचक लिंगयुक्त भाषा
  choice: भाइयों
  alternative: भाई-बहनों / परिवार के उत्तराधिकारियों
  rationale: इब्रानी אַחִים स्पष्टतः पुल्लिंग बहुवचन है। मुख्य पाठ में इसकी आकृति बनाए रखी गई है, जबकि व्यापक पारिवारिक उत्तराधिकार का संभावित आशय अनावश्यक रूप से निश्चित नहीं किया गया।
- issue: दास की सामाजिक स्थिति
  choice: दास
  alternative: सेवक
  rationale: कहावत का प्रभाव निम्न सामाजिक स्थिति वाले व्यक्ति के विवेक के कारण अपमान लानेवाले पुत्र से ऊपर उठने पर निर्भर है। ‘दास’ इस तनाव को ‘सेवक’ से अधिक स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लज्जा लानेवाला’ मूल कृदन्त की सक्रियता बनाए रखता है; ‘विरासत में हिस्सा पाएगा’ शाब्दिक ‘विरासत बाँटेगा’ की संभावित अस्पष्टता से बचते हुए पारिवारिक उत्तराधिकार का भाव देता है।
