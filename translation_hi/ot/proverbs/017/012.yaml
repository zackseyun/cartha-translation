  yaml_path: translation/ot/proverbs/017/012.yaml
  text: Better to meet a bear robbed of her cubs than a fool in his folly.
translation:
  language: hi
  text: किसी मनुष्य का सामना उस मादा भालू से होना, जिसके शावक छिन गए हों, उसकी मूर्खता में पड़े मूर्ख से सामना होने से बेहतर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֹּב שַׁכּוּל
  choice: अपने बच्चों से वंचित रीछनी
  rationale: שַׁכּוּל संतान खो देने की दशा बताता है; प्रसंग में अपने शावकों से वंचित मादा रीछ का उग्र रूप अभिप्रेत है। आधुनिक हिन्दी में ‘बच्चों से वंचित रीछनी’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: פָּגוֹשׁ ... בְּאִישׁ
  choice: से सामना हो जाए
  rationale: हिब्रू में सामना होने की तीव्र, प्रत्यक्ष स्थिति है। सामान्य कथन में בְּאִישׁ के ‘मनुष्य’ को हिन्दी में अलग से व्यक्त करना अनावश्यक है, क्योंकि सामना होने वाला व्यक्ति स्वतः निहित है।
- source_word: כְּסִיל בְּאִוַּלְתּוֹ
  choice: अपनी मूर्खता में पड़े मूर्ख
  rationale: כְּסִיל नैतिक और व्यावहारिक विवेक से रहित व्यक्ति है, और בְּאִוַּלְתּוֹ उसकी सक्रिय मूर्खता की अवस्था को दर्शाता है। ‘में पड़े’ मूल की खुली अभिव्यक्ति को बिना अत्यधिक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: कहावत के तुलनात्मक बल को व्यक्त करना
  choice: पहले खतरनाक सामना स्वीकार्य बताकर ‘पर ... नहीं’ की संरचना
  alternative: ‘बेहतर है कि ... बजाय ...’
  rationale: हिब्रू וְאַל प्रत्यक्ष रूप से दूसरे सामना को निषिद्ध करता है। हिन्दी की यह संरचना उस तीखे विरोध को बनाए रखती है और स्वाभाविक कहावत की तरह सुनाई देती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सुलभ रखी गई है। ‘रीछनी’ लिंग और मातृत्व-संदर्भ दोनों स्पष्ट करता है; कोई सांप्रदायिक या अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
