  text: גַּ֤ם אֱוִ֣יל מַ֭חֲרִישׁ חָכָ֣ם יֵחָשֵׁ֑ב אֹטֵ֖ם שְׂפָתָ֣י/ו נָבֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/028.yaml
  text: Even a fool who keeps silent is considered wise; one who closes his lips[a], discerning.
translation:
  language: hi
  text: मूर्ख भी जब चुप रहता है, तो बुद्धिमान समझा जाता है; जो अपने होंठ बंद रखता है, वह समझदार माना जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यहाँ अव्यय आश्चर्यपूर्ण समावेश पर बल देता है—मूर्ख तक चुप रहने पर बुद्धिमान समझा जा सकता है। हिंदी में ‘मूर्ख भी’ स्वाभाविक रूप से यह बल व्यक्त करता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और बौद्धिक विवेकहीनता के लिए प्रचलित ज्ञान-साहित्य संबंधी शब्द है।
- source_word: מַחֲרִישׁ
  choice: जब चुप रहता है
  rationale: हिफ़ील कृदंत वाणी से विरत रहने की अवस्था या निरंतर आचरण बताता है; यह रूप हिंदी में सहज है और शर्त-सदृश संबंध स्पष्ट करता है।
- source_word: חָכָם יֵחָשֵׁב
  choice: बुद्धिमान समझा जाता है
  rationale: נפעל रूप किसी व्यक्ति को ऐसा गिने या माने जाने का निष्क्रिय भाव देता है; अनुवाद उसी सामाजिक आकलन को बनाए रखता है।
- source_word: אֹטֵם
  choice: बंद रखता है
  rationale: कृदंत का मूल अर्थ बंद करना है; ‘रखता है’ जानबूझकर और लगातार वाणी रोकने का भाव भी व्यक्त करता है।
- source_word: שְׂפָתָיו
  choice: अपने होंठ
  rationale: मूल पाठ की ठोस शारीरिक उपमा ‘होंठ’ को बनाए रखा गया है; हिंदी में कर्ता के संदर्भ में ‘अपने’ स्वाभाविक है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: यह शब्द सूझ-बूझ और विवेक रखने वाले व्यक्ति को दर्शाता है; आधुनिक सामान्य हिंदी में ‘समझदार’ स्पष्ट और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। दोनों समानांतर पंक्तियों में निष्क्रिय मूल्यांकन (‘समझा जाता है’, ‘माना जाता है’) सुरक्षित है, जिससे यह स्पष्ट रहता है कि मौन मूर्ख को वास्तव में बुद्धिमान बनाने के बजाय ऐसा दिखाई देने या माने जाने का कारण बन सकता है।
