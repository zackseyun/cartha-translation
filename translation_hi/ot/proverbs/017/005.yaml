id: PRO.17.5
reference: Proverbs 17:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹעֵ֣ג לָ֭/רָשׁ חֵרֵ֣ף עֹשֵׂ֑/הוּ שָׂמֵ֥חַ לְ֝/אֵ֗יד לֹ֣א יִנָּקֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/005.yaml
  text: Whoever mocks the poor insults his Maker[c][b][a]; he who rejoices at calamity will not go unpunished.
translation:
  language: hi
  text: जो निर्धन का उपहास करता है, वह उसके रचनेवाले का अपमान करता है; जो विपत्ति पर आनन्दित होता है, वह दण्ड से नहीं बचेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹעֵג
  choice: उपहास करता है
  rationale: यह इब्रानी कृदन्त तिरस्कारपूर्ण हँसी या ठट्ठा करने का भाव व्यक्त करता है। ‘उपहास करता है’ आधुनिक, स्पष्ट और नीतिवचन की गरिमा के अनुकूल है।
- source_word: לָרָשׁ
  choice: निर्धन का
  rationale: רָשׁ गरीब अथवा साधनहीन व्यक्ति को दर्शाता है। ‘निर्धन’ संक्षिप्त और सम्मानजनक है तथा यहाँ एक व्यक्ति के रूप में आए शब्द की एकवचन शक्ति बनाए रखता है।
- source_word: חֵרֵף
  choice: अपमान करता है
  rationale: यह क्रिया निन्दा, तिरस्कार या अपमान का अर्थ देती है। ‘अपमान करता है’ अन्तरव्यक्तिगत और ईश्वर-विषयक दोनों निहितार्थों को बिना इसे अनिवार्यतः ‘ईशनिन्दा’ बनाने के व्यक्त करता है।
- source_word: עֹשֵׂהוּ
  choice: उसके रचनेवाले
  rationale: शाब्दिक अर्थ ‘उसे बनानेवाला’ है और प्रत्यय स्वाभाविक रूप से निर्धन व्यक्ति की ओर लौटता है। ‘उसके रचनेवाले’ इस सम्बन्ध को स्पष्ट रखते हुए सृष्टिकर्ता परमेश्वर की ओर संकेत करता है।
- source_word: שָׂמֵחַ
  choice: आनन्दित होता है
  rationale: यह किसी घटना पर प्रसन्न होने की नैतिक प्रवृत्ति बताता है। ‘आनन्दित होता है’ उस स्थायी मनोभाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לְאֵיד
  choice: विपत्ति पर
  rationale: אֵיד अनिष्ट, विनाश या विपत्ति को दर्शाता है। ‘विपत्ति’ व्यापक अर्थ बनाए रखता है और किसी विशेष प्रकार की आपदा तक कथन को सीमित नहीं करता।
- source_word: לֹא יִנָּקֶה
  choice: दण्ड से नहीं बचेगा
  rationale: נקה का निफ़अल रूप निर्दोष ठहरने, दोषमुक्त होने या दण्ड से छूटने का भाव दे सकता है। इस न्यायिक-नैतिक प्रसंग में ‘दण्ड से नहीं बचेगा’ स्वाभाविक हिन्दी में परिणाम स्पष्ट करता है।
theological_decisions:
- issue: ‘उसके रचनेवाले’ का सम्बन्ध
  choice: ‘उसके’ को निर्धन व्यक्ति से सम्बन्धित रखा गया है; निर्धन का उपहास उसके रचनेवाले परमेश्वर का अपमान है।
  alternative: इसे सामान्य रूप से केवल ‘सृष्टिकर्ता का अपमान’ कहा जा सकता था, बिना संबंधवाचक सर्वनाम पर बल दिए।
  rationale: עֹשֵׂהוּ में लगा एकवचन प्रत्यय निकटतम पूर्वपद ‘निर्धन’ की ओर स्वाभाविक रूप से संकेत करता है। अनुवाद मानवीय गरिमा को परमेश्वर के सृजन-कार्य से जोड़ने वाले मूल कथन को बिना विस्तार के सुरक्षित रखता है।
- issue: לֹא יִנָּקֶה का न्यायिक और दण्डात्मक तनाव
  choice: मुख्य पाठ में ‘दण्ड से नहीं बचेगा’ रखा गया है।
  alternative: ‘निर्दोष नहीं ठहरेगा’ या ‘दोषमुक्त नहीं होगा।’
  rationale: इब्रानी पद दण्ड से न बचने और निर्दोष न ठहरने—दोनों न्यायिक रंग रख सकता है। नीतिवचन के परिणामसूचक सन्दर्भ में चुना हुआ रूप अधिक सहज है, यद्यपि वैकल्पिक न्यायिक अर्थ भी वास्तविक है।
- issue: व्याकरणिक पुल्लिंग का सामान्य प्रयोग
  choice: हिन्दी में ‘जो ... वह ...’ की सार्वत्रिक रचना अपनाई गई है।
  alternative: ‘वह मनुष्य जो...’ अथवा स्पष्ट पुल्लिंग ‘जो पुरुष...’ कहा जा सकता था।
  rationale: इब्रानी के पुल्लिंग एकवचन रूप यहाँ सामान्य नीतिवचनात्मक कथन हैं। हिन्दी की ‘जो...वह...’ रचना उस सार्वत्रिक अर्थ को स्वाभाविक ढंग से व्यक्त करती है और अनावश्यक लैंगिक सीमांकन नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों समानान्तर उपवाक्यों में ‘जो...वह...’ संरचना नीतिवचन की लय को बनाए रखती है। ‘रचनेवाले’ सामान्य पाठक के लिए सहज है और ‘सृष्टिकर्ता’ की अपेक्षा मूल के व्यक्तिगत संबंधवाचक रूप को अधिक सीधे सुरक्षित रखता है।
