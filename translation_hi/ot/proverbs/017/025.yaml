  yaml_path: translation/ot/proverbs/017/025.yaml
  text: A foolish son is grief to his father[b][a], and bitterness to the woman who bore him.
translation:
  language: hi
  text: मूर्ख पुत्र अपने पिता को दुःख[a] और उसे जन्म देनेवाली को कड़वाहट देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खीज’ अथवा ‘क्रोध’। इब्रानी शब्द दुःख, खीज या क्रोध का भाव व्यक्त कर सकता है; यहाँ संभवतः पुत्र के कारण पिता को होनेवाली मानसिक पीड़ा अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעַס
  choice: दुःख
  rationale: यहाँ संज्ञा पुत्र के कारण पिता को होनेवाली गहरी मानसिक पीड़ा बताती है और समानांतर पद ‘कड़वाहट’ के अनुरूप है। मूल शब्द में क्रोध या खीज का भाव भी संभव है।
- source_word: לְאָבִיו
  choice: अपने पिता के लिए
  rationale: לְ यहाँ संबंध अथवा प्रभाव को व्यक्त करता है; ‘के लिए’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בֵּן כְּסִיל
  choice: मूर्ख पुत्र
  rationale: नीतिवचन में כְּסִיל केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक समझ से रहित व्यक्ति को सूचित करनेवाला पारिभाषिक ज्ञान-साहित्यिक शब्द है।
- source_word: וּמֶמֶר
  choice: और ... कड़वाहट
  rationale: यह दुर्लभ संज्ञा यहाँ कटु दुःख या मानसिक संताप को व्यक्त करती है और पहले पद के כַּעַס के समानांतर है।
- source_word: לְיוֹלַדְתּוֹ
  choice: उसे जन्म देनेवाली के लिए
  rationale: यह कृदन्त पद शाब्दिक रूप से ‘उसे जन्म देनेवाली’ कहता है; इसे केवल ‘माँ’ करने के बजाय मूल की सजीव मातृ-अभिव्यक्ति सुरक्षित रखी गई है।
