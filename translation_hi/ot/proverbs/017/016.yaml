  edition: WLC
  text: לָ/מָּה זֶּ֣ה מְחִ֣יר בְּ/יַד כְּסִ֑יל לִ/קְנ֖וֹת חָכְמָ֣ה וְ/לֶב אָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/016.yaml
  text: Why is there a price in the hand of a fool to buy wisdom when he has no heart for it?[a]
translation:
  language: hi
  text: मूर्ख के हाथ में बुद्धि मोल लेने का दाम क्यों है, जबकि उसके पास समझ ही नहीं है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “और हृदय नहीं है।” इब्रानी में “हृदय” समझ, निर्णय या इच्छा की भीतरी क्षमता को भी दर्शा सकता है।
    reason: मूल इब्रानी रूपक और उसकी अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: לָמָּה זֶּה
  choice: क्यों है
  rationale: यह पद एक आलंकारिक प्रश्न है। हिन्दी में ‘क्यों है’ इस प्रश्न को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מְחִיר בְּיַד
  choice: दाम ... के हाथ में
  rationale: ‘दाम’ खरीद के साधन या मूल्य को और ‘हाथ में’ अधिकार अथवा उपलब्धता की मूल छवि को बनाए रखता है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और बौद्धिक रूप से हठी व्यक्ति के लिए प्रचलित शब्द है; ‘मूर्ख’ इसका सीधा और स्वाभाविक हिन्दी पर्याय है।
- source_word: לִקְנוֹת חָכְמָה
  choice: बुद्धि मोल लेने का
  rationale: ‘मोल लेना’ व्यावसायिक रूपक को बनाए रखता है, जबकि ‘बुद्धि’ यहाँ नैतिक और व्यावहारिक विवेक को व्यक्त करती है।
- source_word: וְלֶב אָיִן
  choice: जबकि उसमें समझ ही नहीं है
  rationale: इब्रानी में शाब्दिक रूप से ‘और हृदय नहीं है’ है। यहाँ ‘हृदय’ समझ, निर्णय और इच्छा की भीतरी क्षमता को सूचित करता है। मुख्य पाठ में ‘समझ’ आधुनिक हिन्दी में आशय स्पष्ट करता है; पादटिप्पणी मूल रूपक को सुरक्षित रखती है।
theological_decisions:
- issue: क्या मूर्ख में क्षमता का अभाव है या बुद्धि पाने की इच्छा का?
  choice: ‘समझ ही नहीं है’ द्वारा मुख्यतः आंतरिक विवेक के अभाव को व्यक्त किया गया है।
  alternative: ‘उसका मन ही नहीं है’ इच्छा या रुचि के अभाव पर अधिक बल देता।
  rationale: इब्रानी ‘हृदय’ समझ, निर्णय और इच्छा—इन सभी को समेट सकता है। ‘समझ’ प्रसंग के बौद्धिक पक्ष को स्वाभाविक हिन्दी में सामने रखती है, जबकि पादटिप्पणी शब्द की व्यापकता बताती है और अर्थ को केवल इच्छा तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मोल लेने’ और ‘हाथ में’ से पद का खरीद-बिक्री संबंधी रूपक बना रहता है; ‘समझ ही नहीं’ सामान्य पाठक के लिए इब्रानी मुहावरे का आशय स्पष्ट करता है।
