translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली। मूल ‘ढाँपने’ के रूपक को सुरक्षित रखा गया है, जबकि दूसरे अर्धांश में बीती बात को फिर उठाने का संदर्भगत अर्थ स्पष्ट किया गया है।
