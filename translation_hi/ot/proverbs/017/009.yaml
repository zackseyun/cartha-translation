source:
  edition: WLC
  text: מְֽכַסֶּה פֶּ֭שַׁע מְבַקֵּ֣שׁ אַהֲבָ֑ה וְ/שֹׁנֶ֥ה בְ֝/דָבָ֗ר מַפְרִ֥יד אַלּֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/009.yaml
  text: Whoever covers over an offense seeks love[c][b][a], but he who repeats a matter separates close friends.
translation:
  language: hi
  text: जो अपराध को ढाँप देता है, वह प्रेम चाहता है; पर जो किसी बात को बार-बार उठाता है, वह घनिष्ठ मित्रों में फूट डालता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: ढाँप देता है
  rationale: यह כסה के मूल रूपक—किसी अपराध को ढाँपने, अर्थात उसे उजागर न करने या उस पर टिके न रहने—को बनाए रखता है और सीधे ‘क्षमा करता है’ कहकर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: פֶּשַׁע
  choice: अपराध
  rationale: यहाँ शब्द संबंधों के भीतर किए गए गलत काम को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है, यद्यपि इसका अर्थ केवल कानूनी अपराध तक सीमित नहीं है।
- source_word: מְבַקֵּשׁ
  choice: चाहता है
  rationale: ‘चाहता है’ प्रेम को बढ़ावा देने की अभिलाषा और प्रयत्न दोनों को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक ‘ढूँढ़ता है’ यहाँ कम स्वाभाविक होता।
- source_word: אַהֲבָה
  choice: प्रेम
  rationale: यह व्यापक मूल अर्थ को सुरक्षित रखता है और इसे केवल मित्रता या स्नेह तक सीमित नहीं करता।
- source_word: שֹׁנֶה
  choice: बार-बार उठाता है
  rationale: דבר के साथ इसका संदर्भगत अर्थ किसी बीती बात या अपराध को फिर छेड़ना है। यह हिन्दी में ‘दोहराता है’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: בְדָבָר
  choice: किसी बात को
  rationale: דבר का व्यापक अर्थ ‘बात/मामला’ है; यहाँ ‘किसी बात’ बीते विवाद या अपराध को अनावश्यक रूप से संकीर्ण किए बिना दर्शाता है।
- source_word: מַפְרִיד
  choice: फूट डालता है
  rationale: हिफ़ील रूप कारणवाचक है—वह अलगाव उत्पन्न करता है। ‘फूट डालता है’ संबंध-विच्छेद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַלּוּף
  choice: घनिष्ठ मित्रों
  rationale: यह शब्द निकट साथी या आत्मीय मित्र को दर्शाता है। हिन्दी में बहुवचन कहावत के सामान्य अर्थ और दोनों पक्षों के बीच होने वाले अलगाव को स्वाभाविक रूप से व्यक्त करता है।
