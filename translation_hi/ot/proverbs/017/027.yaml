  terminology: ‘बोलने में संयम रखता है’ accurately conveys restraint of words. ‘उसके पास ज्ञान है’ is idiomatic and expresses the Hebrew idiom יוֹדֵעַ דָּעַת without an unnatural literalism. ‘समझदार पुरुष का मन शीतल रहता है’ retains the Hebrew coolness image while using ‘मन’ naturally for inner disposition in Hindi.
