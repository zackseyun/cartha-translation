  yaml_path: translation/ot/proverbs/017/027.yaml
  text: Whoever restrains his words has knowledge[b][a], and a man of understanding is cool in spirit.
translation:
  language: hi
  text: 'जो बोलने में संयम रखता है, उसके पास ज्ञान है;

    और समझदार पुरुष का मन शीतल[a] रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “शांत रहता है।” इब्रानी में शाब्दिक रूप से “शीतल आत्मा वाला” है; यह आत्म-संयम का ताप-संबंधी चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ אֲמָרָיו
  choice: अपने शब्दों को रोकता है
  rationale: यह वाक्यांश बोलने में संयम रखने का भाव देता है। ‘शब्दों को रोकता है’ मूल क्रिया और उसके आत्म-संयम के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹדֵעַ דָּעַת
  choice: ज्ञान रखता है
  rationale: शाब्दिक ‘ज्ञान जानता है’ हिन्दी में अस्वाभाविक है। ‘ज्ञान रखता है’ इस इब्रानी मुहावरे का आशय स्पष्ट रूप से व्यक्त करता है।
- source_word: וְקַר רוּחַ
  choice: मन से शीतल रहता है
  rationale: קר का मूल ताप-संबंधी चित्र ‘शीतल’ द्वारा सुरक्षित रहता है, जबकि רוּחַ यहाँ स्वभाव अथवा भीतरी मनोदशा को दर्शाता है।
- source_word: אִישׁ תְּבוּנָה
  choice: समझ रखने वाला पुरुष
  rationale: इब्रानी אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है और תְּבוּנָה विवेकपूर्ण समझ को दर्शाता है। यह अभिव्यक्ति कहावत में सामान्य मानवीय गुण का उदाहरण भी है।
theological_decisions:
- issue: ज्ञान-साहित्य की कहावत में लिंगसूचक अभिव्यक्ति
  choice: समझ रखने वाला पुरुष
  alternative: समझ रखने वाला व्यक्ति
  rationale: मूल पाठ में אִישׁ स्पष्ट रूप से ‘पुरुष’ है। इसलिए लिंगसूचक रूप को मुख्य पाठ में रखा गया है, यद्यपि कहावत का सिद्धांत सामान्य रूप से लागू होता है।
- issue: ‘शीतल आत्मा’ के रूपक का अर्थ
  choice: मन से शीतल रहता है
  alternative: मन से शांत रहता है
  rationale: मुख्य पाठ तापमान के इब्रानी रूपक को सुरक्षित रखता है और उसे केवल ‘शांत’ कहकर पूरी तरह व्याख्यायित नहीं करता। पाद-टिप्पणी स्वाभाविक अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्यात्मक संरचना और ‘शीतल’ का मूल रूपक सुरक्षित हैं।
