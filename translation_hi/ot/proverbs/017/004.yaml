  text: An evildoer listens to wicked lips[a]; a liar gives ear to a destructive tongue.
translation:
  language: hi
  text: बुराई करनेवाला अनर्थ की बातें सुनता है[a]; झूठ बोलनेवाला विनाशकारी बातों पर कान देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई करनेवाला अधर्म के होंठों की सुनता है; झूठ विनाश की जीभ पर कान देता है।” इब्रानी में “झूठ” को झूठ बोलनेवाले व्यक्ति के बजाय अमूर्त अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרַע
  choice: बुराई करनेवाला
  rationale: यह रूप बुराई से पहचाने जानेवाले व्यक्ति को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक तथा नैतिक रूप से स्पष्ट है।
- source_word: מַקְשִׁיב עַל
  choice: की सुनता है
  rationale: क्रिया ध्यान देकर सुनने का भाव रखती है; हिन्दी में यह प्रयोग उसके दोषपूर्ण ग्रहणशील रवैये को सहज रूप से व्यक्त करता है।
- source_word: שְׂפַת אָוֶן
  choice: दुष्ट होंठों
  rationale: ‘होंठ’ का मूल रूपक सुरक्षित रखा गया है, जबकि ‘दुष्ट’ אָוֶן के अनर्थ और नैतिक बुराई के भाव को संक्षेप में व्यक्त करता है।
- source_word: שֶׁקֶר
  choice: झूठा
  rationale: यद्यपि इसका शाब्दिक अर्थ ‘झूठ’ या ‘मिथ्यापन’ है, पहले खंड के व्यक्तिवाचक מֵרַע के समानांतर यहाँ इसे झूठ से पहचाने जानेवाले व्यक्ति के रूप में लेना स्वाभाविक है; अमूर्त अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵזִין עַל
  choice: पर कान लगाता है
  rationale: हिफ़िल रूप ध्यान से कान देने का अर्थ रखता है; यह पहले खंड की पुनरावृत्ति किए बिना काव्यात्मक समानांतरता बनाए रखता है।
- source_word: לְשׁוֹן הַוֺּת
  choice: विनाशकारी जीभ
  rationale: ‘जीभ’ का मूल रूपक सुरक्षित है और הַוֺּת के विनाश, अनर्थ तथा हानिकारक प्रभाव को ‘विनाशकारी’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: שֶׁקֶר को व्यक्ति या अमूर्त ‘झूठ’ मानना
  choice: मुख्य पाठ में ‘झूठा’
  alternative: ‘झूठ’ दुष्टता के होंठों की सुनता है; ‘मिथ्यापन’ विनाश की जीभ पर कान लगाता है
  rationale: पहले खंड के व्यक्तिवाचक מֵרַע के साथ समानांतरता व्यक्ति-सूचक अर्थ का समर्थन करती है, पर इब्रानी का अमूर्त अर्थ भी वास्तविक संभावना है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘होंठ’ और ‘जीभ’ के इब्रानी काव्यात्मक रूपक सुरक्षित हैं; दोनों अर्धपंक्तियों में ‘सुनता है/कान लगाता है’ से समानांतरता और हल्का काव्यात्मक वैविध्य बना रहता है।
