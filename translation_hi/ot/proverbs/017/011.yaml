  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַךְ מְרִ֥י יְבַקֶּשׁ רָ֑ע וּ/מַלְאָ֥ךְ אַ֝כְזָרִ֗י יְשֻׁלַּח בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/017/011.yaml
  text: A rebellious man seeks only evil[a], and a cruel messenger will be sent against him.
translation:
  language: hi
  text: विद्रोही व्यक्ति केवल बुराई की ही खोज करता है, और उसके विरुद्ध एक निर्दयी दूत[a] भेजा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक निर्दयी स्वर्गदूत भेजा जाएगा।” हिब्रू शब्द का अर्थ “दूत” या “स्वर्गदूत,” दोनों हो सकता है।
    reason: मूल शब्द מַלְאָךְ की मानवीय और अलौकिक, दोनों संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: אַךְ
  choice: केवल … ही
  rationale: यहाँ אַךְ का बल सीमित करने वाला है; ‘केवल … ही’ हिंदी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְרִי
  choice: विद्रोह
  rationale: यह संज्ञा यहाँ विरोध या बगावत को सूचित करती है और יְבַקֶּשׁ का कर्म समझी गई है।
- source_word: יְבַקֶּשׁ
  choice: चाहता है
  rationale: क्रिया का मूल अर्थ ‘खोजना/ढूँढ़ना’ है, पर विद्रोह जैसी अमूर्त वस्तु के साथ ‘चाहता है’ आधुनिक हिंदी में उसके सक्रिय प्रयत्न और अभिलाषा को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָע
  choice: दुष्ट व्यक्ति
  rationale: 'वाक्य-विन्यास में רָע को विशेषण से बनी व्यक्तिवाचक संज्ञा और क्रिया का कर्ता समझना उचित है: ‘दुष्ट व्यक्ति’। इससे पहला खंड ‘दुष्ट व्यक्ति केवल विद्रोह चाहता है’ बनता है, न कि ‘विद्रोही व्यक्ति केवल बुराई चाहता है’।'
- source_word: מַלְאָךְ
  choice: दूत
  rationale: ‘दूत’ मानवीय संदेशवाहक अथवा स्वर्गीय दूत, दोनों की संभावना को खुला रखता है और मूल शब्द को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: אַכְזָרִי
  choice: निर्दयी
  rationale: यह कठोर और दया-रहित दंडाधिकारी का भाव स्पष्ट तथा स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְשֻׁלַּח
  choice: भेजा जाएगा
  rationale: यह पुअल रूप का कर्मवाच्य और कहावत में व्यक्त भावी परिणाम, दोनों को सुरक्षित रखता है।
- source_word: בּוֹ
  choice: उसके विरुद्ध
  rationale: शत्रुतापूर्ण और दंडात्मक संदर्भ में संबंधबोधक उपसर्ग का स्वाभाविक हिंदी अर्थ ‘उसके विरुद्ध’ है।
theological_decisions:
- issue: מַלְאָךְ का अर्थ मानवीय ‘दूत’ है या अलौकिक ‘स्वर्गदूत’
  choice: दूत
  alternative: स्वर्गदूत
  rationale: पद उस एजेंट को स्पष्ट रूप से स्वर्गीय नहीं बताता। ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है; ‘स्वर्गदूत’ की संभव व्याख्या पादटिप्पणी में दी गई है।
- issue: पहले खंड में कर्ता और कर्म की पहचान
  choice: רָע को ‘दुष्ट व्यक्ति’ कर्ता और מְרִי को ‘विद्रोह’ कर्म माना गया है
  alternative: מְרִי को ‘विद्रोही व्यक्ति’ कर्ता और רָע को ‘बुराई’ कर्म मानना
  rationale: हिब्रू शब्द-क्रम और सामान्य विशेषणात्मक-संज्ञा प्रयोग के आधार पर ‘दुष्ट व्यक्ति केवल विद्रोह चाहता है’ अधिक संभावित विश्लेषण है। यह अंग्रेज़ी परामर्श-पाठ से अलग है, पर मूल-भाषा साक्ष्य को प्राथमिकता देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘केवल … ही’ कहावत के जोर को व्यक्त करता है। ‘दूत’ जानबूझकर व्यापक रखा गया है, जबकि पादटिप्पणी अलौकिक अर्थ की संभावना बताती है।
