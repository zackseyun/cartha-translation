source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ שְׂ֝פָתָ֗י/ו וְ/ה֣וּא כְסִֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/001.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his speech and is a fool[a][b].
translation:
  language: hi
  text: निर्धन मनुष्य जो अपनी खराई में चलता है, उस मनुष्य से उत्तम है जिसकी वाणी टेढ़ी है और जो मूर्ख है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस मूर्ख से जिसकी वाणी टेढ़ी है।” इब्रानी वाक्य-रचना में अंतिम पद विपरीत व्यक्ति की संक्षिप्त पहचान भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “अपनी खराई में चलता है।” इब्रानी में “चलना” किसी व्यक्ति के आचरण या जीवन-पद्धति का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: उत्तम है
  rationale: यह नीतिवचन की तुलनात्मक रचना है, जिसमें एक जीवन-दशा को दूसरी से बेहतर बताया गया है।
- source_word: רָשׁ
  choice: निर्धन मनुष्य
  rationale: यह शब्द आर्थिक रूप से गरीब व्यक्ति को दर्शाता है; पुल्लिंग एकवचन का रूप बनाए रखा गया है।
- source_word: הוֹלֵךְ
  choice: चलता है
  rationale: इब्रानी में ‘चलना’ व्यक्ति के आचरण और जीवन-पद्धति का प्रचलित रूपक है; हिंदी में भी यह रूपक समझ में आता है।
- source_word: בְּתֻמּוֹ
  choice: अपनी खराई में
  rationale: תֹּם/תֻּם चरित्र की अखंडता, सच्चाई और नैतिक सीधेपन को व्यक्त करता है; ‘खराई’ पापहीनता का अतिशयोक्तिपूर्ण अर्थ दिए बिना इसे संक्षेप में व्यक्त करती है।
- source_word: מֵעִקֵּשׁ שְׂפָתָיו
  choice: उस मनुष्य से जिसकी वाणी टेढ़ी है
  rationale: तुलनात्मक מִן को ‘से’ द्वारा व्यक्त किया गया है। ‘टेढ़ी वाणी’ होंठों के शाब्दिक बिंब का अर्थ स्वाभाविक हिंदी में रखते हुए कुटिल बोलचाल को दर्शाती है।
- source_word: וְהוּא כְסִיל
  choice: और जो मूर्ख है
  rationale: सरल समन्वय बनाए रखा गया है और अंतिम पद को टेढ़ी वाणी वाले व्यक्ति का वर्णन माना गया है, जबकि वैकल्पिक वाक्य-संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम पद וְהוּא כְסִיל का वाक्य-संबंध
  choice: ‘और जो मूर्ख है’ को टेढ़ी वाणी वाले विपरीत व्यक्ति का अतिरिक्त वर्णन माना गया है।
  alternative: ‘उस मूर्ख से जिसकी वाणी टेढ़ी है’—अंतिम पद विपरीत व्यक्ति की संक्षिप्त पहचान हो सकता है।
  rationale: दोनों में मूल नैतिक तुलना समान रहती है; मुख्य पाठ इब्रानी के सीधे समन्वय को रखता है और वाक्यगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘निर्धन’ और ‘वाणी’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘खराई में चलता है’ मूल के नैतिक रूपक और काव्यात्मक संक्षिप्तता को सुरक्षित रखता है।
