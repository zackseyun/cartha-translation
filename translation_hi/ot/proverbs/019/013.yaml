  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘पुत्र’ औपचारिक किंतु सर्वसुलभ है, जबकि ‘झगड़े’ अनावश्यक रूप से साहित्यिक शब्दावली से बचाता है।
