base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/013.yaml
  text: A foolish son is ruin to his father[a], and a wife’s quarrels are a continual dripping.
translation:
  language: hi
  text: 'मूर्ख पुत्र अपने पिता के लिए विपत्ति[a] है,

    और पत्नी के झगड़े लगातार टपकते पानी के समान हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बर्बादी।”
    reason: हिब्रू הַוּוֹת विपत्ति, विनाश या बर्बादी का भाव व्यक्त कर सकता है; ‘बर्बादी’ निकट lexical विकल्प है।
lexical_decisions:
- source_word: הַוּוֹת
  choice: विपत्ति
  rationale: यह बहुवचन रूप यहाँ भाववाचक या तीव्र अर्थ में विनाशकारी विपत्ति को व्यक्त करता है। ‘विपत्ति’ स्वाभाविक हिन्दी में कथन की तीव्रता बनाए रखता है।
- source_word: לְאָבִיו
  choice: अपने पिता के लिए
  rationale: लामेद पिता पर पड़ने वाले प्रभाव या संबंध को दर्शाता है; ‘के लिए’ आधुनिक हिन्दी में इसे सहज रूप से व्यक्त करता है।
- source_word: בֵּן כְּסִיל
  choice: मूर्ख पुत्र
  rationale: नीतिवचन में כְּסִיל केवल कम बुद्धि वाला नहीं, बल्कि नैतिक रूप से विवेकहीन व्यक्ति है; ‘मूर्ख’ इस अर्थ को उपयुक्त रूप से व्यक्त करता है।
- source_word: דֶּלֶף טֹרֵד
  choice: लगातार टपकता पानी
  rationale: यह पद छत आदि से निरंतर टपकते पानी की कष्टदायक छवि देता है। हिन्दी वाक्य में उपमा के साथ ‘लगातार टपकते पानी’ स्वाभाविक है।
- source_word: מִדְיְנֵי
  choice: झगड़े
  rationale: बहुवचन शब्द बार-बार होने वाले विवादों या कलह को दर्शाता है; ‘झगड़े’ साधारण पाठक के लिए स्पष्ट और वर्तमान हिन्दी है।
- source_word: אִשָּׁה
  choice: पत्नी के
  rationale: घरेलू संदर्भ और पिता-पुत्र के समानांतर संबंध के कारण यहाँ ‘स्त्री’ की अपेक्षा ‘पत्नी’ अधिक संदर्भानुकूल है।
theological_decisions: []
