  text: Many seek the favor of a noble man[b][a], and everyone is a friend to a man who gives gifts.
translation:
  language: hi
  text: बहुत-से लोग उदार व्यक्ति की कृपा पाने का प्रयत्न करते हैं[a], और हर कोई उपहार देनेवाले का मित्र है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से लोग किसी कुलीन व्यक्ति से अनुनय करते हैं।” हिब्रू शब्द का अर्थ “उदार व्यक्ति,” “कुलीन व्यक्ति” या “राजकुमार” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर कोई उपहार के व्यक्ति का मित्र है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह बहुवचन परिमाणवाचक शब्द है; हिन्दी में स्पष्ट और स्वाभाविक कर्ता के लिए ‘लोग’ जोड़ा गया है।
- source_word: יְחַלּוּ פְנֵי
  choice: की कृपा पाने का प्रयत्न करते हैं
  rationale: हिब्रू मुहावरे का अर्थ किसी का मुँह देखने से अधिक उसकी अनुकम्पा या पक्ष प्राप्त करना है; यह अनुनय और कृपा चाहने, दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: נָדִיב
  choice: उदार व्यक्ति
  rationale: शब्द का अर्थ कुलीन या प्रधान व्यक्ति भी हो सकता है, पर दूसरी पंक्ति के उपहार देनेवाले व्यक्ति से समानांतरता यहाँ उदारता के अर्थ का समर्थन करती है।
- source_word: וְכָל הָרֵעַ
  choice: और हर कोई … मित्र बन जाता है
  rationale: पाठ का आशय व्यापक सामाजिक मित्रता या साथ से है। ‘बन जाता है’ उपहार के कारण लोगों के मित्रवत हो जाने के निहित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאִישׁ מַתָּן
  choice: उपहार देनेवाले का
  rationale: शाब्दिक रचना ‘उपहार के व्यक्ति’ है; हिन्दी में इसका स्वाभाविक अर्थ ‘उपहार देनेवाला’ है।
