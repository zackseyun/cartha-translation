  yaml_path: translation/ot/proverbs/019/005.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will not escape.
translation:
  language: hi
  text: झूठा गवाह दण्ड से नहीं बचेगा[a], और जो झूठ उगलता है[b], वह बच नहीं पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्दोष नहीं ठहराया जाएगा’ अथवा ‘दोषमुक्त नहीं होगा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक चित्र ‘झूठी बातों को साँस के साथ बाहर निकालता है’; यह बेधड़क या बार-बार झूठ बोलने का चित्र है। इसका अनुवाद ‘झूठ बोलता है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: झूठा गवाह
  rationale: यह रचना ऐसे गवाह को दर्शाती है जिसकी गवाही झूठी है। ‘झूठा गवाह’ आधुनिक हिन्दी में स्वाभाविक है और न्यायिक सन्दर्भ बनाए रखता है।
- source_word: יִנָּקֶה
  choice: दण्ड से नहीं बचेगा
  rationale: निफ़अल रूप यहाँ दण्ड से मुक्त या निर्दोष न ठहरने का भाव देता है। ‘दण्ड से नहीं बचेगा’ नैतिक-न्यायिक परिणाम को सहज हिन्दी में स्पष्ट करता है, जबकि वैकल्पिक न्यायिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְיָפִיחַ כְּזָבִים
  choice: और जो झूठ उगलता है
  rationale: פוח का हिफ़ईल रूप साँस या हवा बाहर निकालने से विकसित होकर कथन करने का चित्र देता है। हिन्दी का ‘झूठ उगलना’ उस सजीव और निरन्तर/बेधड़क बोलने वाले भाव को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: यह बहुवचन झूठी बातों को सूचित करता है; हिन्दी में ‘झूठ’ सामूहिक अर्थ में स्वाभाविक और सीधा है।
- source_word: יִמָּלֵט
  choice: बच नहीं पाएगा
  rationale: निफ़अल रूप का अर्थ बच निकलना या छुड़ाया जाना हो सकता है। समानान्तर पंक्ति में ‘बच नहीं पाएगा’ अनिवार्य परिणाम को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
