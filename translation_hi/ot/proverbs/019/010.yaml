id: PRO.19.10
reference: Proverbs 19:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא נָאוֶ֣ה לִ/כְסִ֣יל תַּעֲנ֑וּג אַ֝֗ף כִּֽי לְ/עֶ֤בֶד מְשֹׁ֬ל בְּ/שָׂרִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/010.yaml
  text: Luxury is not fitting for a fool[c][b][a], much less for a servant to rule over princes.
translation:
  language: hi
  text: 'मूर्ख के लिए विलासिता[a] उचित नहीं है;

    फिर किसी दास[b] का उच्च अधिकारियों[c] पर शासन करना तो और भी अनुचित है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुख” अथवा “आनंद।” यहाँ इब्रानी शब्द संभवतः आराम और भोग-विलास से भरे जीवन की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “सेवक” अथवा “गुलाम।” इब्रानी शब्द अधीन सेवा की अलग-अलग स्थितियों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “सरदारों,” “कुलीनों” अथवा “राजपुरुषों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָאוֶה
  choice: उचित है
  rationale: यह शब्द किसी बात के उपयुक्त, शोभनीय या अनुकूल होने का भाव देता है। यहाँ निषेध के साथ ‘उचित नहीं है’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक विवेक को ठुकराने वाले व्यक्ति को दर्शाता है। ‘मूर्ख’ इस ज्ञान-साहित्यिक अर्थ को बनाए रखता है।
- source_word: תַּעֲנוּג
  choice: विलासिता
  rationale: शब्द का अर्थ सुख या आनंद भी हो सकता है, पर इस सामाजिक संदर्भ में आराम और भोग-विलास का भाव अधिक संभावित है।
- source_word: אַף כִּי
  choice: तो और भी अनुचित है
  rationale: यह पहले कथन से अधिक तीव्र और आपत्तिजनक स्थिति की ओर बढ़ने वाला तर्क व्यक्त करता है। हिन्दी में यह रूप उस बढ़ती हुई तुलना को स्वाभाविक ढंग से प्रकट करता है।
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द सेवक से लेकर बंधुआ या गुलाम व्यक्ति तक कई अधीनस्थ स्थितियाँ दर्शा सकता है। ‘दास’ सामाजिक अधीनता को बनाए रखते हुए हिन्दी में गरिमापूर्ण और पर्याप्त रूप से व्यापक है।
- source_word: מְשֹׁל
  choice: शासन करना
  rationale: यह अधिकार चलाने या राज करने को दर्शाता है। ‘शासन करना’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: שָׂרִים
  choice: उच्च अधिकारी
  rationale: यह शब्द ऊँचे पद वाले अगुओं, अधिकारियों, सरदारों या राजपुरुषों के लिए प्रयुक्त होता है। ‘उच्च अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और पदानुक्रम का विरोधाभास बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दूसरी पंक्ति में ‘तो और भी अनुचित है’ द्वारा इब्रानी אַף כִּי की तीव्रतर तुलना स्पष्ट की गई है, जबकि सामाजिक उलटाव को बिना किसी आधुनिक वैचारिक टिप्पणी के ज्यों का त्यों रखा गया है।
