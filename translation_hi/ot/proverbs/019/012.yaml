source:
  edition: WLC
  text: נַ֣הַם כַּ֭/כְּפִיר זַ֣עַף מֶ֑לֶךְ וּ/כְ/טַ֖ל עַל עֵ֣שֶׂב רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/012.yaml
  text: A king’s wrath is like the growling of a young lion[b][a], but his favor is like dew on the grass.
translation:
  language: hi
  text: 'राजा का प्रकोप जवान सिंह की गुर्राहट[a] के समान है,

    पर उसकी कृपा घास पर पड़ी ओस के समान है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवान सिंह की दहाड़।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַהַם
  choice: गुर्राहट
  rationale: यह संज्ञा सिंह की गहरी, भयावह ध्वनि को दर्शाती है। ‘गुर्राहट’ आधुनिक हिन्दी में स्वाभाविक है; ‘दहाड़’ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: כְּפִיר
  choice: जवान सिंह
  rationale: शब्द ऐसे युवा सिंह को सूचित करता है जो शक्तिशाली और खतरनाक है; ‘जवान सिंह’ इस भाव को ‘सिंह-शावक’ से अधिक ठीक व्यक्त करता है।
- source_word: זַעַף
  choice: प्रकोप
  rationale: यह तीव्र क्रोध या रोष को व्यक्त करता है। ‘प्रकोप’ राजकीय क्रोध की गंभीरता बनाए रखते हुए सुबोध और गरिमापूर्ण है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: मूल संज्ञा का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: וּכְטַל
  choice: पर ... ओस के समान
  rationale: हिब्रू संयोजक दूसरे, संतुलित चरण को जोड़ता है; हिन्दी में दोनों चित्रों का निहित विरोध ‘पर’ से स्वाभाविक रूप से स्पष्ट होता है। ओस का मूल बिंब सुरक्षित रखा गया है।
- source_word: עַל עֵשֶׂב
  choice: घास पर पड़ी
  rationale: ‘घास’ काव्यात्मक चित्र में सहज और सजीव है। ‘पड़ी’ जोड़ने से हिन्दी में ओस का संबंध स्वाभाविक बनता है, बिना अर्थ बदले।
- source_word: רְצוֹנוֹ
  choice: उसकी कृपा
  rationale: यहाँ शब्द राजा की प्रसन्नता, सद्भावना या अनुग्रह को दर्शा सकता है। ‘कृपा’ उसके प्रकोप के समानांतर राजकीय अनुकूलता को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
