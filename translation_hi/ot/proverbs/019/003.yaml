  text: אִוֶּ֣לֶת אָ֭דָם תְּסַלֵּ֣ף דַּרְכּ֑/וֹ וְ/עַל יְ֝הוָ֗ה יִזְעַ֥ף לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/003.yaml
  text: A man's folly ruins his way[b][a], and his heart rages against Yahweh.
translation:
  language: hi
  text: मनुष्य की मूर्खता उसके मार्ग को टेढ़ा कर देती है[a], और उसका मन यहोवा पर भड़क उठता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके मार्ग को बिगाड़ देती है’ अथवा ‘उसकी राह को विकृत कर देती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह शब्द बुद्धि के विपरीत मूर्ख होने की अवस्था या प्रवृत्ति को दर्शाता है; ‘मूर्खता’ नीतिवचन की शैली में स्वाभाविक और स्पष्ट है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन संज्ञा यहाँ सामान्य रूप से किसी भी व्यक्ति का प्रतिनिधित्व करती है। हिन्दी में ‘मनुष्य’ इस सार्वत्रिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּסַלֵּף
  choice: टेढ़ा कर देती है
  rationale: सल्लेफ़ के पिएल रूप का मूल बिंब किसी चीज़ को टेढ़ा, विकृत या भ्रष्ट करने का है। यह चयन परिणाम मात्र (‘नष्ट करना’) के बजाय मूल मार्ग-बिंब को बनाए रखता है।
- source_word: דַּרְכּוֹ
  choice: उसके मार्ग को
  rationale: ‘मार्ग’ नीतिवचन में जीवन के आचरण और दिशा का स्थापित रूपक है तथा हिब्रू बिंब को सुरक्षित रखता है।
- source_word: וְעַל
  choice: और ... पर
  rationale: हिब्रू समन्वय और विरोध की दिशा को हिन्दी में सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत नाम की व्यापक रूप से पहचानी जाने वाली लिप्यंतरण-प्रथा है और मूल पाठ में आए नाम को उपाधि से प्रतिस्थापित नहीं करती।
- source_word: יִזְעַף
  choice: भड़क उठता है
  rationale: क्रिया तीव्र रोष या आक्रोश व्यक्त करती है। ‘भड़क उठता है’ इसकी तीव्रता को सहज आधुनिक हिन्दी में रखता है।
- source_word: לִבּוֹ
  choice: उसका मन
  rationale: हिब्रू ‘हृदय’ विचार, इच्छा और भावना के आंतरिक केंद्र को दर्शाता है। इस प्रसंग में ‘मन’ हिन्दी में उसी आंतरिक प्रतिक्रिया को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है। ‘यहोवा’ आधुनिक हिन्दी पाठकों और हिन्दी बाइबल परंपरा में अधिक परिचित रूप है; ‘याहवे’ मूल उच्चारण का प्रचलित विद्वत पुनर्निर्माण है।
- issue: אָדָם का सामान्य एकवचन प्रयोग
  choice: मनुष्य
  alternative: एक व्यक्ति
  rationale: सूक्ति किसी एक पुरुष तक सीमित न होकर सामान्य मानवीय व्यवहार का वर्णन करती है। ‘मनुष्य’ एकवचन और सार्वत्रिक दोनों बलों को बनाए रखता है।
- issue: मनुष्य की अपनी मूर्खता और यहोवा के विरुद्ध उसका रोष
  choice: दोनों खंडों को ‘और’ से जोड़ा गया
  alternative: ‘फिर भी’ अथवा ‘परन्तु’ से स्पष्ट विरोध
  rationale: हिब्रू וְ साधारण समन्वय देता है; पद में निहित नैतिक विडंबना को पाठक पर छोड़ते हुए कोई अतिरिक्त कारणात्मक या विरोधात्मक संबंध नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूक्तिपरक रखी गई है। ‘मार्ग को टेढ़ा करना’ मूल हिब्रू रूपक को बचाता है, जबकि ‘मन ... भड़क उठता है’ सामान्य पाठक के लिए स्वाभाविक है।
