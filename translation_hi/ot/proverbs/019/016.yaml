  text: שֹׁמֵ֣ר מִ֭צְוָה שֹׁמֵ֣ר נַפְשׁ֑/וֹ בּוֹזֵ֖ה דְרָכָ֣י/ו יומת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/016.yaml
  text: Whoever keeps the commandment keeps his life[b][a]; he who despises his ways will die.
translation:
  language: hi
  text: 'जो आज्ञा का पालन करता है, वह अपने जीवन[a] की रक्षा करता है;

    पर जो अपने चालचलन[b] को तुच्छ समझता है, वह मार डाला जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द नेफ़ेश का अर्थ संदर्भ के अनुसार ‘जीवन’, ‘प्राण’, ‘स्वयं’ या ‘आत्मा’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने मार्गों’। इसका अर्थ ‘अपने चालचलन’ हो सकता है; कुछ लोग इसे ‘परमेश्वर के मार्गों’ के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁמֵר מִצְוָה
  choice: आज्ञा का पालन करता है
  rationale: שֹׁמֵר निरंतर सावधानी से मानने या पालन करने का भाव देता है। हिंदी में ‘आज्ञा का पालन करना’ स्वाभाविक है और आज्ञाकारिता के साथ सजग अनुपालन का अर्थ भी व्यक्त करता है।
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: अपने जीवन की रक्षा करता है
  rationale: यहाँ נֶפֶשׁ का अर्थ संदर्भानुसार ‘जीवन’ है, क्योंकि दूसरे खंड में मृत्यु का परिणाम सामने रखा गया है। ‘आत्मा’ कहने से बाद की तकनीकी धार्मिक अवधारणा अनावश्यक रूप से आ सकती है।
- source_word: בּוֹזֵה
  choice: तुच्छ समझता है
  rationale: यह शब्द केवल उपेक्षा नहीं, बल्कि तिरस्कार या अवमानना व्यक्त करता है। ‘तुच्छ समझता है’ आधुनिक हिंदी में इस नैतिक बल को स्पष्ट रखता है।
- source_word: דְרָכָיו
  choice: अपने चालचलन
  rationale: शाब्दिक अर्थ ‘उसके मार्ग’ है। यहाँ प्रत्यय का सबसे स्वाभाविक संबंध उसी व्यक्ति से है, इसलिए आशय उसके अपने व्यवहार या चालचलन से लिया गया है; संभावित अन्य अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יומת
  choice: मार डाला जाएगा
  rationale: हिब्रू का होफ़अल रूप निष्क्रिय है और मृत्यु दिए जाने का भाव रखता है। यह अनुवाद किसी एजेंट को जोड़े बिना उस व्याकरणिक रूप को बनाए रखता है।
theological_decisions:
- issue: दूसरे खंड में ‘उसके मार्गों’ का संदर्भ
  choice: व्यक्ति का अपना चालचलन
  alternative: परमेश्वर के मार्ग, अथवा आज्ञा का मार्ग
  rationale: तीसरे पुरुष एकवचन प्रत्यय का स्वाभाविक संदर्भ उसी खंड का व्यक्ति है। फिर भी हिब्रू वाक्यांश संदर्भ को स्पष्ट नाम से नहीं बताता, इसलिए दूसरी समझ को पादटिप्पणी में रखा गया है।
- issue: נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण, स्वयं, आत्मा
  rationale: जीवन और मृत्यु के समानांतर विरोध के कारण यहाँ ‘जीवन’ सबसे उपयुक्त है और यह अनुचित doctrinal विशिष्टता से बचता है।
- issue: יומת की निष्क्रिय क्रिया
  choice: मार डाला जाएगा
  alternative: मर जाएगा
  rationale: मूल का निष्क्रिय रूप बनाए रखा गया है, पर मृत्यु देने वाले कर्ता की पहचान नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञा का पालन’, ‘जीवन की रक्षा’ और ‘चालचलन’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि पादटिप्पणियाँ मूल की शब्दार्थगत और संदर्भगत अस्पष्टता सुरक्षित रखती हैं।
