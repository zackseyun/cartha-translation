  text: ה֗וֹן יֹ֭סִיף רֵעִ֣ים רַבִּ֑ים וְ֝/דָ֗ל מֵרֵ֥ע/הוּ יִפָּרֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/004.yaml
  text: Wealth adds many friends[a], but a poor man is separated from his friend.
translation:
  language: hi
  text: 'धन बहुत-से मित्र जोड़ देता है,[a]

    पर निर्धन अपने मित्र से अलग हो जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत-से साथी बढ़ा देता है।’ दूसरी पंक्ति की इब्रानी क्रिया केवल अलगाव बताती है; वह यह स्पष्ट नहीं करती कि निर्धन स्वयं दूर होता है या उसका मित्र उसे छोड़ देता है। संदर्भ में सामाजिक त्याग का भाव प्रबल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: धन
  rationale: यह शब्द भौतिक संपत्ति और साधनों को व्यापक रूप से दर्शाता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: יֹסִיף
  choice: जोड़ देता है
  rationale: हिफ़ील रूप का मूल अर्थ ‘बढ़ाना’ या ‘जोड़ना’ है; यहाँ धन के कारण मित्रों की संख्या बढ़ने का भाव है।
- source_word: רֵעִים רַבִּים
  choice: बहुत-से मित्र
  rationale: सामाजिक संबंध के संदर्भ में ‘मित्र’ उपयुक्त है और רַבִּים की बहुलता को ‘बहुत-से’ स्पष्ट करता है।
- source_word: דָל
  choice: निर्धन
  rationale: यह गरीब, निर्बल या निम्न सामाजिक स्थिति वाले व्यक्ति को सूचित कर सकता है; ‘निर्धन’ यहाँ आर्थिक विरोध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: מֵרֵעֵהוּ
  choice: अपने मित्र से
  rationale: מִן के साथ प्रत्यययुक्त רֵעַ का स्वाभाविक अर्थ ‘अपने/उसके मित्र से’ है; हिन्दी में ‘अपने’ कर्ता के साथ संबंध स्पष्ट करता है।
- source_word: יִפָּרֵד
  choice: अलग हो जाता है
  rationale: निफ़ाल रूप अलग होने या अलग कर दिए जाने की स्थिति व्यक्त कर सकता है। यह चयन अलगाव को बताता है, पर यह तय नहीं करता कि निर्धन स्वयं हटता है या मित्र उसे छोड़ देता है।
