  yaml_path: translation/ot/proverbs/019/020.yaml
  text: Listen to counsel and accept discipline[a], so that you may become wise in the end.
translation:
  language: hi
  text: सलाह सुनो और अनुशासन स्वीकार करो, ताकि अंततः तुम बुद्धिमान बनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: सुनो
  rationale: आज्ञार्थक रूप है; यहाँ केवल ध्वनि सुनना नहीं, बल्कि ध्यान देकर मानना अभिप्रेत है। हिंदी में “सलाह सुनो” यह भाव स्वाभाविक रूप से देता है।
- source_word: עֵצָה
  choice: सलाह
  rationale: विचारपूर्ण मार्गदर्शन का बोध कराता है और आधुनिक सामान्य हिंदी में सहज है।
- source_word: וְקַבֵּל
  choice: स्वीकार करो
  rationale: आज्ञार्थक रूप इच्छापूर्वक ग्रहण करने को कहता है; “स्वीकार करो” इस भाव को स्पष्ट रखता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द शिक्षा के साथ सुधार और चरित्र-निर्माण का भाव रखता है; “अनुशासन” उस सुधारात्मक प्रशिक्षण को संक्षेप में व्यक्त करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: תֶּחְכַּם
  choice: बुद्धिमान बनो
  rationale: क्रिया यहाँ बुद्धि प्राप्त करने या उसमें विकसित होने का भाव देती है; “बनो” उस विकासात्मक अर्थ को सुरक्षित रखता है।
- source_word: בְּאַחֲרִיתֶךָ
  choice: अपने भविष्य में
  rationale: אַחֲרִית किसी व्यक्ति के आगे के समय, अंतिम अवस्था या परिणाम को सूचित कर सकता है। “अपने भविष्य में” संभावित अर्थों में से समयगत भाव को स्वाभाविक हिंदी में रखता है, बिना इसे अनिवार्यतः जीवन के अंतिम दिनों तक सीमित किए।
theological_decisions:
- issue: בְּאַחֲרִיתֶךָ का समयगत अथवा परिणामगत अर्थ
  choice: अपने भविष्य में
  alternative: अंत में / अपने अंतिम दिनों में
  rationale: इब्रानी पद भविष्य, अंतिम अवस्था या अंततः प्राप्त परिणाम के लिए खुला है। मुख्य पाठ में स्वाभाविक व्यापक समयगत अर्थ रखा गया है; कोई विशिष्ट परलोक-संबंधी अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त ज्ञान-साहित्य शैली और एकवचन संबोधन। भाषा साधारण पाठक के लिए स्पष्ट है, पर स्वर गरिमापूर्ण रखा गया है।
