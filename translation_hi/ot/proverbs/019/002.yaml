  edition: WLC
  text: גַּ֤ם בְּ/לֹא דַ֣עַת נֶ֣פֶשׁ לֹא ט֑וֹב וְ/אָ֖ץ בְּ/רַגְלַ֣יִם חוֹטֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/002.yaml
  text: Also[a], without knowledge, desire is not good, and whoever hurries with his feet sins.
translation:
  language: hi
  text: 'ज्ञान के बिना इच्छा भी अच्छी नहीं होती,[a]

    और जो उतावली में कदम बढ़ाता है, वह पाप करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ज्ञान के बिना व्यक्ति अच्छा नहीं होता।” यहाँ נֶפֶשׁ का अर्थ “इच्छा” या “लालसा” भी हो सकता है और “व्यक्ति” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह पिछले कथन से एक अतिरिक्त नीतिवचन-संबंधी बात जोड़ता है; ‘भी’ इसके योगात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּלֹא דַעַת
  choice: ज्ञान के बिना
  rationale: यह मूल पदबंध का सीधा और व्यापक अनुवाद है तथा नीतिवचन में ज्ञान के बौद्धिक और नैतिक दोनों आयाम खुले रखता है।
- source_word: נֶפֶשׁ
  choice: इच्छा
  rationale: यहाँ נֶפֶשׁ को मनुष्य की भीतरी लालसा या भूख के अर्थ में मुहावरेदार ढंग से समझा गया है; ‘प्राण’ या ‘आत्मा’ हिन्दी में आशय को अनावश्यक रूप से अस्पष्ट कर देता।
- source_word: לֹא טוֹב
  choice: अच्छी नहीं होती
  rationale: यह इब्रानी की सरल विधेयात्मक अभिव्यक्ति और नीतिवचन की सहज शैली को बनाए रखता है।
- source_word: וְאָץ
  choice: जो ... उतावली करता है
  rationale: कृदन्त के सामान्य, चरित्रगत अर्थ को व्यक्त करता है और जल्दबाजी की चेतावनी को स्पष्ट रखता है।
- source_word: בְּרַגְלַיִם
  choice: अपने पैरों से
  rationale: मूल की ठोस शारीरिक छवि को अमूर्त ‘जल्दबाजी’ में विलीन किए बिना सुरक्षित रखता है।
- source_word: חוֹטֵא
  choice: पाप करता है
  rationale: यह חטא का नैतिक भार बनाए रखता है; प्रसंग में गलत राह या व्यावहारिक चूक का भाव भी इसके भीतर समाहित रह सकता है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: ‘इच्छा’ के रूप में मुख्य पाठ
  alternative: ‘ज्ञान के बिना व्यक्ति अच्छा नहीं होता’
  rationale: इब्रानी वाक्यरचना में נֶפֶשׁ को ‘इच्छा/लालसा’ अथवा ‘व्यक्ति’ समझना संभव है। मुख्य पाठ आवेगपूर्ण भीतरी चाह और पैरों की उतावली के बीच समानांतरता रखता है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अपने पैरों से उतावली करता है’ मूल की देहात्मक छवि को जानबूझकर बनाए रखता है।
