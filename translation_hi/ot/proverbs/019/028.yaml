  yaml_path: translation/ot/proverbs/019/028.yaml
  text: A worthless witness mocks justice[c][b][a], and the mouth of the wicked swallows iniquity.
translation:
  language: hi
  text: 'निकृष्ट[a] गवाह न्याय का उपहास करता है[b],

    और दुष्टों का मुँह बुराई को निगल जाता है[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेलियाल का गवाह।’ यहाँ בְּלִיַּעַל को बाद के व्यक्तिवाची नाम ‘बेलियाल’ के बजाय ‘निकृष्टता’ या ‘निरर्थकता’ के अर्थ में लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘न्याय की हँसी उड़ाता है’ अथवा ‘फैसले का तिरस्कार करता है।’
    reason: lexical_alternative
  - marker: c
    text: या ‘दुष्टों का मुँह अनर्थ को गटक जाता है’ अथवा ‘झूठ को निगल जाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד
  choice: गवाह
  rationale: यह संज्ञा गवाही देने वाले व्यक्ति को दर्शाती है। न्यायिक संदर्भ में ‘गवाह’ स्वाभाविक और सर्वसुलभ हिन्दी शब्द है।
- source_word: בְּלִיַּעַל
  choice: निकम्मा
  rationale: यहाँ यह ‘गवाह’ की नैतिक निकृष्टता और अनुपयोगिता बताने वाला विशेषण है; इसे बाद के व्यक्तिवाची नाम ‘बेलियाल’ के रूप में लेना आवश्यक नहीं है।
- source_word: יָלִיץ
  choice: उपहास करता है
  rationale: संदर्भ में क्रिया न्याय के प्रति तिरस्कारपूर्ण व्यवहार व्यक्त करती है। ‘उपहास करता है’ नीतिवचन के गरिमापूर्ण स्वर और क्रिया की तीव्रता दोनों को बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: शब्द का अर्थ न्याय, निर्णय या न्यायिक फैसला हो सकता है। यहाँ भ्रष्ट गवाह द्वारा सही न्याय के तिरस्कार की बात है, इसलिए ‘न्याय’ उपयुक्त व्यापक अर्थ देता है।
- source_word: פִי
  choice: मुँह
  rationale: मूल पाठ की शारीरिक उपमा को बनाए रखा गया है; यह अगली क्रिया ‘निगल जाता है’ के साथ सजीव समानांतरता बनाती है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञार्थक विशेषण सामान्य रूप से दुष्ट लोगों को दर्शाता है। ‘दुष्टों’ संक्षिप्त और नीतिवचन की शैली के अनुकूल है।
- source_word: יְבַלַּע
  choice: निगल जाता है
  rationale: क्रिया का मूल अर्थ निगलना या गटक जाना है। इस चयन से ‘मुँह’ के साथ जुड़ा मूल रूपक सुरक्षित रहता है।
- source_word: אָוֶן
  choice: बुराई
  rationale: शब्द में दुष्टता, अनर्थ और छल का अर्थक्षेत्र है। ‘बुराई’ नैतिक भाव को सहज आधुनिक हिन्दी में व्यक्त करती है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
theological_decisions:
- issue: בְּלִיַּעַל को सामान्य संज्ञार्थक विशेषण मानना या व्यक्तिवाची नाम
  choice: सामान्य विशेषण के रूप में ‘निकम्मा’
  alternative: ‘बेलियाल का गवाह’
  rationale: इस प्राचीन नीतिवचन के संदर्भ में शब्द गवाह की नैतिक निकृष्टता बताता है; बाद के व्यक्तिकृत नाम को यहाँ आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘मुँह…निगल जाता है’ का सजीव इब्रानी रूपक सुरक्षित है। ‘निकम्मा’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी उसके नैतिक अर्थ और ‘बेलियाल’ वाले वैकल्पिक पाठ को स्पष्ट करती है।
