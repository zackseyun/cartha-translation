  text: טָ֘מַ֤ן עָצֵ֣ל יָ֭ד/וֹ בַּ/צַּלָּ֑חַת גַּם אֶל פִּ֝֗י/הוּ לֹ֣א יְשִׁיבֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/024.yaml
  text: The sluggard buries his hand in the dish[b][a]; he will not even bring it back to his mouth.
translation:
  language: hi
  text: आलसी अपना हाथ थाली में गाड़ देता है[a][b]; वह उसे अपने मुँह तक वापस भी नहीं लाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना हाथ थाली में छिपा देता है।” इब्रानी क्रिया का अर्थ “छिपाना” या “गाड़ना” हो सकता है; “गाड़ देता है” नीतिवचन के अतिशयोक्तिपूर्ण चित्र को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: या, “कटोरे में” अथवा “परात में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: गाड़ देता है
  rationale: क्रिया का अर्थ छिपाना, दबाना या गाड़ना हो सकता है। यहाँ अतिशयोक्तिपूर्ण और हास्यास्पद चित्र को बनाए रखने के लिए ‘गाड़ देता है’ चुना गया है।
- source_word: עָצֵל
  choice: आलसी
  rationale: यह नीतिवचन-साहित्य में आदतन आलसी व्यक्ति के लिए प्रयुक्त विशिष्ट शब्द है; आधुनिक हिन्दी में ‘आलसी’ स्वाभाविक, संक्षिप्त और स्पष्ट है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: इब्रानी के एकवचन और स्वामित्व-संबंध को सहज हिन्दी में ज्यों का त्यों रखा गया है।
- source_word: בַּצַּלָּחַת
  choice: थाली में
  rationale: यह संज्ञा भोजन रखने के पात्र—थाली, कटोरे या परात—को सूचित कर सकती है। खाने के प्रसंग में ‘थाली’ सामान्य और स्वाभाविक हिन्दी है।
- source_word: גַּם
  choice: भी
  rationale: यहाँ अव्यय न्यूनतम अगला काम तक न करने की विडंबना पर बल देता है; ‘भी नहीं’ हिन्दी में इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל־פִּיהוּ
  choice: अपने मुँह तक
  rationale: ठोस भोजन-चित्र को सुरक्षित रखते हुए ‘मुँह’ का शाब्दिक अर्थ रखा गया है; ‘तक’ गति के लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יְשִׁיבֶנָּה
  choice: उसे ... वापस नहीं लाता
  rationale: שׁוב का हिफ़ील रूप किसी वस्तु को लौटाने या वापस लाने का भाव देता है। स्त्रीलिंग प्रत्यय का संदर्भ ‘हाथ’ से है; हिन्दी में उसे स्पष्ट रूप से ‘उसे’ कहा गया है।
