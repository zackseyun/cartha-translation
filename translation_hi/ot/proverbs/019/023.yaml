  edition: WLC
  text: יִרְאַ֣ת יְהוָ֣ה לְ/חַיִּ֑ים וְ/שָׂבֵ֥עַ יָ֝לִ֗ין בַּל יִפָּ֥קֶד רָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/023.yaml
  text: The fear of Yahweh leads to life[a], and whoever has it will rest satisfied[c][b]; he will not be visited by harm.
translation:
  language: hi
  text: याहवे का भय जीवन की ओर ले जाता है[a]; जो उसका भय मानता है, वह तृप्त होकर रात बिताएगा[b]; उस पर विपत्ति नहीं आएगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवन के लिए है।” इब्रानी अभिव्यक्ति बहुत संक्षिप्त है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “तृप्त होकर रात बिताएगा” या “तृप्त होकर सोएगा।”
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: अधिक शाब्दिक रूप से, “विपत्ति उससे भेंट नहीं करेगी।” यहाँ ‘विपत्ति’ का अर्थ नैतिक बुराई नहीं, बल्कि अनिष्ट या आपदा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय
  rationale: निर्माण-संबंधी पदबंध को सीधे रखा गया है। ‘भय’ इब्रानी शब्द की गंभीरता तथा श्रद्धामय विस्मय, दोनों की संभावना बनाए रखता है; याहवे को उसके व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: לְחַיִּים
  choice: जीवन की ओर ले जाता है
  rationale: अत्यंत संक्षिप्त इब्रानी अभिव्यक्ति में दिशा अथवा परिणाम का भाव है। यह हिंदी में स्वाभाविक है और ‘जीवन के लिए है’ वाली अधिक शाब्दिक संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: וְשָׂבֵעַ
  choice: तृप्त
  rationale: इस विशेषण में भरपूर होने और संतुष्ट रहने का भाव है। ‘तृप्त’ शारीरिक भरपेट होने तक सीमित नहीं है और सुरक्षित संतोष व्यक्त करता है।
- source_word: יָלִין
  choice: रात बिताएगा
  rationale: क्रिया का मूल अर्थ रात ठहरना अथवा रात बिताना है। इसे बनाए रखने से रात्रिकालीन निश्चिंतता का ठोस बिंब सुरक्षित रहता है।
- source_word: בַּל יִפָּקֶד רָע
  choice: उस पर विपत्ति नहीं आएगी
  rationale: פקד की प्रतिकूल ‘भेंट/आ पड़ने’ वाली अलंकारिक अभिव्यक्ति को सहज हिंदी में व्यक्त किया गया है। רָע यहाँ नैतिक बुराई के बजाय अनिष्ट या विपत्ति है।
theological_decisions:
- issue: ‘जीवन’ का आशय केवल आत्मिक जीवन है या व्यापक कल्याण भी
  choice: ‘जीवन’ को बिना संकुचित किए रखा गया है
  alternative: इसे केवल दीर्घायु, समृद्धि या अनन्त जीवन के अर्थ में स्पष्ट करना
  rationale: नीतिवचन में ‘जीवन’ प्रायः जीवन, फलना-फूलना और परमेश्वर की व्यवस्था के अधीन कल्याण की व्यापक धारणा रखता है; अनुवाद किसी एक doctrinal अर्थ को आरोपित नहीं करता।
- issue: अंतिम पंक्ति क्या हर प्रकार के कष्ट से पूर्ण छूट की निरपेक्ष प्रतिज्ञा है
  choice: सूक्तिपरक सामान्य कथन के रूप में ‘उस पर विपत्ति नहीं आएगी’
  alternative: ऐसा विस्तार जोड़ना कि धर्मी को कभी कोई दुख नहीं होगा, अथवा इसे केवल दंड से जोड़ना
  rationale: मूल कथन संक्षिप्त और व्यापक है। हिंदी उसी बल को रखती है, जबकि टिप्पणी बताती है कि רָע का आशय नैतिक बुराई नहीं बल्कि अनिष्ट या विपत्ति है।
- issue: וְשָׂבֵעַ का वाक्यगत संबंध
  choice: ‘जो उससे तृप्त है’ में ‘उससे’ को याहवे के भय से संबंधित समझना
  alternative: ‘तृप्त होकर वह रात बिताएगा,’ जहाँ שָׂבֵעַ क्रियाविशेषण-सदृश विधेय हो
  rationale: इब्रानी में स्पष्ट संबंधवाचक सर्वनाम नहीं है और पंक्ति संक्षिप्त है। मुख्य पाठ प्रवाहपूर्ण हिंदी देता है, पर टिप्पणी अधिक शाब्दिक और व्याकरणतः निकट विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज सूक्तिपरक शैली अपनाई गई है। ‘याहवे’ से इब्रानी व्यक्तिगत नाम सुरक्षित है। ‘चैन से रात बिताएगा’ सुरक्षा और संतोष का स्वाभाविक हिंदी बिंब देता है; मुख्य पाठ की व्याख्यात्मक सहजता के साथ पदटिप्पणियों में मूल की संक्षिप्तता और वास्तविक वाक्यगत अस्पष्टता सुरक्षित रखी गई है।
