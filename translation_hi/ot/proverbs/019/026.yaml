  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘माता’ और ‘पुत्र’ नीतिवचन की औपचारिकता के अनुकूल हैं, जबकि ‘बरबाद करता’ और ‘भगा देता है’ सामान्य पाठक के लिए स्पष्ट हैं। हिब्रू के दोनों अंतिम कारक कृदंतों को संयुक्त रूप से ‘लज्जा और अपमान का कारण बनता है’ कहा गया है।
