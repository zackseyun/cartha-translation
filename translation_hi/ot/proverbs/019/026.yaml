  yaml_path: translation/ot/proverbs/019/026.yaml
  text: He who devastates his father and drives away his mother is a son who brings shame and reproach[a].
translation:
  language: hi
  text: 'जो अपने पिता को बरबाद करता और अपनी माता को भगा देता है,

    वह ऐसा पुत्र है जो लज्जा और अपमान का कारण बनता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने पिता को लूटता और अपनी माता को खदेड़ देता है, वह ऐसा पुत्र है जो लज्जा और अपमान का कारण बनता है।”
    reason: מְשַׁדֶּד का अर्थ विशेष रूप से ‘लूटता’ और יַבְרִיחַ का अर्थ ‘खदेड़ देता है’ भी हो सकता है; यह विकल्प अधिक प्रत्यक्ष हिंसक और संपत्ति-संबंधी भाव दिखाता है।
lexical_decisions:
- source_word: מְשַׁדֶּד
  choice: बरबाद करता
  rationale: שׁדד का यह रूप हिंसक ढंग से लूटने, उजाड़ने या बरबाद करने का भाव रखता है। यहाँ कर्म ‘पिता’ है; इसलिए ‘बरबाद करता’ अर्थ को केवल धन लूटने तक सीमित किए बिना गंभीर विनाशकारी दुर्व्यवहार व्यक्त करता है।
- source_word: אָב
  choice: अपने पिता
  rationale: संबंध के संदर्भ में निहित अधिकारवाचक भाव को स्वाभाविक हिन्दी में ‘अपने’ से स्पष्ट किया गया है।
- source_word: יַבְרִיחַ
  choice: भगा देता है
  rationale: 'ברח के हिफ़ील रूप का कारक भाव सुरक्षित है: वह माता को भागने या वहाँ से चले जाने के लिए विवश करता है।'
- source_word: אֵם
  choice: अपनी माता
  rationale: पिता के समानांतर संबंधगत अधिकारवाचक भाव को स्पष्ट करते हुए गरिमापूर्ण आधुनिक हिन्दी चुनी गई है।
- source_word: בֵּן
  choice: ऐसा पुत्र
  rationale: यह संज्ञा वर्णित व्यक्ति का वर्गीकरण करती है। ‘ऐसा पुत्र’ हिन्दी में पिछले उपवाक्य से संबंध स्पष्ट रखते हुए नीतिवचन की सामान्य उक्ति को बनाए रखता है।
- source_word: מֵבִישׁ
  choice: लज्जा ... का कारण बनता है
  rationale: 'בוש के हिफ़ील कृदंत का सक्रिय कारक अर्थ व्यक्त किया गया है: वह लज्जा उत्पन्न करता है।'
- source_word: וּמַחְפִּיר
  choice: और अपमान का कारण बनता है
  rationale: חפר का यह कृदंत लज्जित या अपमानित करने का भाव रखता है। संयुक्त वाक्यांश ‘लज्जा और अपमान का कारण बनता है’ दोनों समानांतर कृदंतों का कारक बल स्वाभाविक हिन्दी में बनाए रखता है।
