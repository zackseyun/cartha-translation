source:
  edition: WLC
  text: חַֽדַל בְּ֭נִ/י לִ/שְׁמֹ֣עַ מוּסָ֑ר לִ֝/שְׁג֗וֹת מֵֽ/אִמְרֵי דָֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/027.yaml
  text: Cease[a], my son, to hear instruction and to stray from the words of knowledge.
translation:
  language: hi
  text: हे मेरे पुत्र, ऐसी शिक्षा सुनना छोड़ दे जो तुझे ज्ञान के वचनों से भटकाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या संभवतः: “हे मेरे पुत्र, शिक्षा सुनना मत छोड़, नहीं तो तू ज्ञान के वचनों से भटक जाएगा।” इब्रानी वाक्य-विन्यास बहुत संक्षिप्त है। इसलिए इसे या तो ज्ञान के वचनों से भटकाने वाली शिक्षा सुनने से रोकने का आदेश, या सही शिक्षा सुनना छोड़ने के परिणाम की चेतावनी समझा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: חַדַל
  choice: मत छोड़
  rationale: यह חדל का पुल्लिंग एकवचन आज्ञार्थक रूप है। निषेधात्मक हिन्दी वाक्य-विन्यास में ‘शिक्षा सुनना मत छोड़’ मूल आदेश को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: ज्ञान-साहित्य के प्रत्यक्ष संबोधन और मूल के पुल्लिंग एकवचन को बनाए रखता है; ‘हे’ गरिमापूर्ण संबोधन को स्पष्ट करता है।
- source_word: לִשְׁמֹעַ
  choice: सुनना
  rationale: שמע का सीधा अर्थ सुनना है और प्रसंग में ध्यान देकर ग्रहण करना भी निहित है।
- source_word: מוּסָר
  choice: शिक्षा
  rationale: מוּסָר में अनुशासन, सुधार और शिक्षण के अर्थ हो सकते हैं। यहाँ ‘सुनना’ तथा ‘ज्ञान की बातें’ के साथ ‘शिक्षा’ सबसे स्वाभाविक है और ज्ञान-प्रशिक्षण का भाव रखता है।
- source_word: לִשְׁגוֹת
  choice: भटक जाएगा
  rationale: שגה भूलने या मार्ग से भटकने को व्यक्त करता है। संकुचित इब्रानी वाक्य-विन्यास को परिणामसूचक हिन्दी में प्रस्तुत किया गया है, बिना इस क्रिया को ‘शिक्षा’ का गुण बनाए।
- source_word: מֵאִמְרֵי
  choice: बातों से
  rationale: מן अलगाव का भाव देता है और אמרים कथनों या वचनों को दर्शाता है। ‘बातों से भटकना’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: नीतिवचन में דעת प्रायः ज्ञान-बुद्धि के क्षेत्र का ‘ज्ञान’ है; यह सीधा और संगत अनुवाद है।
theological_decisions:
- issue: दोनों क्रियार्थक रूपों के बीच संकुचित और अस्पष्ट संबंध
  choice: 'पहले भाग को चेतावनी और दूसरे को उसके परिणाम के रूप में पढ़ा: ‘शिक्षा सुनना मत छोड़, नहीं तो… भटक जाएगा।’'
  alternative: ‘हे मेरे पुत्र, उस शिक्षा को सुनना छोड़ दे जो तुझे ज्ञान की बातों से भटकाती है।’
  rationale: इब्रानी में לִשְׁגּוֹת का संबंध व्याकरणतः संक्षिप्त और विवादित है। परिणामसूचक पाठ शिक्षा और ज्ञान के बीच नीतिवचन-सम्मत समानता बनाए रखता है, जबकि वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्यिक शैली। मूल का पुल्लिंग एकवचन संबोधन ‘पुत्र’ और ‘तू’ में सुरक्षित है। मुख्य पाठ सहज परिणामसूचक संबंध देता है और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में रखता है।
