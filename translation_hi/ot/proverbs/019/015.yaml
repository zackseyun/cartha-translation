  text: Laziness brings on deep sleep[b][a], and a slack person will go hungry.
translation:
  language: hi
  text: 'आलस्य गहरी नींद में डाल देता है,

    और काम में ढिलाई करनेवाला भूखा रहेगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ढिलाई करनेवाला प्राण भूखा रहेगा।” यहाँ “प्राण” (נֶפֶשׁ) से आशय व्यक्ति या स्वयं से हो सकता है। रְמִיָּה का अर्थ इस प्रसंग में ढिलाई या लापरवाही है; अन्य प्रसंगों में इसका अर्थ “छलपूर्ण” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְלָה
  choice: आलस्य
  rationale: यह संज्ञा सुस्ती या काम से जी चुराने की प्रवृत्ति बताती है; ‘आलस्य’ आधुनिक मानक हिन्दी में स्वाभाविक और नीतिवचन के नैतिक बल के अनुरूप है।
- source_word: תַּפִּיל
  choice: में डाल देता है
