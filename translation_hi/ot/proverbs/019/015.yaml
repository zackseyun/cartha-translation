- source_word: תַּרְדֵּמָה
  choice: गहरी नींद
  rationale: यह शब्द साधारण उनींदेपन से अधिक भारी या गहरी नींद का बोध कराता है।
- source_word: נֶפֶשׁ
  choice: करनेवाला
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति या स्वयं के लिए प्रयुक्त है। हिन्दी में ‘काम में ढिलाई करनेवाला’ व्यक्ति को स्वाभाविक रूप से व्यक्त करता है; ‘प्राण/आत्मा’ अनावश्यक आध्यात्मिक अर्थ पैदा कर सकता है।
- source_word: רְמִיָּה
  choice: काम में ढिलाई
  rationale: संदर्भ में यह शब्द छल से अधिक लापरवाही, शिथिलता या काम में ढिलाई का अर्थ देता है। यह पहले चरण के ‘आलस्य’ से संबंध बनाए रखते हुए केवल उसी शब्द को दोहराता नहीं।
- source_word: תִרְעָב
  choice: भूखा रहेगा
  rationale: רעב का काल रूप भूख सहने की परिणति बताता है। ‘भूखा रहेगा’ सहज हिन्दी है और ‘भूख से मर जाएगा’ जैसा अतिशयोक्त अर्थ नहीं देता।
