base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/019.yaml
  text: A hot-tempered man bears the penalty[a], for if you rescue him, you will only have to do it again.
translation:
  language: hi
  text: अत्यन्त क्रोधी व्यक्ति दण्ड भोगता है[a], क्योंकि यदि तुम उसे बचाओगे, तो तुम्हें फिर उसे बचाना पड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “प्रचण्ड क्रोध वाला व्यक्ति दण्ड वहन करता है”; इब्रानी अभिव्यक्ति संक्षिप्त और मुहावरेदार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גרל חֵמָה
  choice: अत्यन्त क्रोधी व्यक्ति
  rationale: यह संक्षिप्त इब्रानी पदबंध ऐसे व्यक्ति को दर्शाता है जिसकी पहचान प्रचण्ड क्रोध से होती है। यह हिन्दी अभिव्यक्ति व्यक्ति-सन्दर्भ और क्रोध की तीव्रता—दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: נֹשֵׂא
  choice: भोगता है
  rationale: शाब्दिक अर्थ ‘उठाना/ढोना’ है; दण्ड के साथ आधुनिक हिन्दी में ‘दण्ड भोगता है’ स्वाभाविक है और नीतिवचन के सामान्य, निरन्तर सत्य का भाव बनाए रखता है।
- source_word: עֹנֶשׁ
  choice: दण्ड
  rationale: यह शब्द अपराध या व्यवहार के कारण मिलने वाले दण्ड अथवा जुर्माने को सूचित करता है। ‘दण्ड’ उसके रूप को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ रखता है।
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पहले कथन का कारण बताते हुए शर्त प्रस्तुत करता है; ‘क्योंकि यदि’ दोनों सम्बन्धों को स्पष्ट रखता है।
- source_word: תַּצִּיל
  choice: तुम उसे बचाओगे
  rationale: हिफ़ील रूप का अर्थ छुड़ाना या बचाना है। कर्म प्रसंग से क्रोधी व्यक्ति है, इसलिए हिन्दी में ‘उसे’ स्पष्ट रूप से दिया गया है।
- source_word: וְעוֹד תּוֹסִף
  choice: तुम्हें फिर ऐसा ही करना पड़ेगा
  rationale: इब्रानी में ‘फिर/और जोड़ोगे’ संक्षिप्त और कर्मरहित है। प्रसंग में इसका अर्थ उसी व्यक्ति को दोबारा संकट से बचाना है; हिन्दी रूप पुनरावृत्ति और चेतावनी दोनों स्पष्ट करता है।
