  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רַבּ֣וֹת מַחֲשָׁב֣וֹת בְּ/לֶב אִ֑ישׁ וַ/עֲצַ֥ת יְ֝הוָ֗ה הִ֣יא תָקֽוּם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/021.yaml
  text: Many are the plans in a man's heart[a], but the counsel of Yahweh will stand.
translation:
  language: hi
  text: 'मनुष्य के हृदय में बहुत-सी योजनाएँ[a] होती हैं,

    परन्तु यहोवा की युक्ति ही स्थिर रहेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विचार” अथवा “इरादे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: बहुत-सी ... होती हैं
  rationale: विधेय विशेषण की बहुलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक पद की प्रमुखता भी पर्याप्त रूप से बनी रहती है।
- source_word: מַחֲשָׁבוֹת
  choice: योजनाएँ
  rationale: ज्ञान-साहित्य के इस प्रसंग में शब्द केवल विचारों के बजाय सोची और गढ़ी गई योजनाओं या इरादों को सूचित करता है; यह आगे आने वाली यहोवा की युक्ति के साथ स्पष्ट विरोध भी बनाता है।
- source_word: בְּלֶב אִישׁ
  choice: मनुष्य के हृदय में
  rationale: לֵב सोचने और इच्छा करने वाले भीतरी व्यक्तित्व का केन्द्र है, इसलिए 'हृदय' रखा गया है। אִישׁ यहाँ प्रतिनिधिक एकवचन है; 'मनुष्य' आधुनिक हिन्दी में सामान्य मानव-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַעֲצַת
  choice: परन्तु ... युक्ति
  rationale: वाव इस विरोधात्मक कहावत में 'परन्तु' के अर्थ में स्वाभाविक है। עֵצָה के लिए 'युक्ति' सोचे-समझे परामर्श, उद्देश्य या संकल्प का भाव देती है और 'योजनाएँ' से शब्दगत भेद बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को केवल पदवी 'प्रभु' से प्रतिस्थापित न करके हिन्दी बाइबलीय परम्परा में परिचित रूप में सुरक्षित रखता है।
- source_word: הִיא
  choice: ही
  rationale: स्त्रीलिंग सर्वनाम עֲצַת से मेल खाता है और उसे बल देता है। हिन्दी में अलग सर्वनाम दोहराने के बजाय 'ही' उस जोर को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָקוּם
  choice: स्थिर रहेगी
  rationale: קום यहाँ उठ खड़े होने के शाब्दिक अर्थ से आगे टिके रहने, कायम होने और प्रभावी सिद्ध होने का भाव रखता है; 'स्थिर रहेगी' उस छवि और भविष्यकाल को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: मानवीय योजनाएँ और दिव्य उद्देश्य
  choice: मनुष्य के भीतर अनेक योजनाएँ होती हैं, किन्तु अंततः यहोवा की युक्ति स्थिर रहती है।
  alternative: इसे अधिक नियतिवादी ढंग से कहना, जैसे 'केवल परमेश्वर की योजना ही पूरी होती है।'
  rationale: इब्रानी पाठ मानव की अनेक योजनाओं और यहोवा की स्थिर युक्ति के बीच विरोध करता है, पर कारणता या मानवीय स्वतंत्रता पर उससे अधिक व्यापक सिद्धान्त स्पष्ट नहीं करता; इसलिए तनाव को ज्यों का त्यों रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कहावत-सुलभ रखी गई है। 'हृदय', 'यहोवा' और 'युक्ति' बाइबलीय अर्थ-भार को बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए सहज है।
