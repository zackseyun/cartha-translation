source:
  edition: WLC
  text: תַּאֲוַ֣ת אָדָ֣ם חַסְדּ֑/וֹ וְ/טֽוֹב רָ֝שׁ מֵ/אִ֥ישׁ כָּזָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/022.yaml
  text: What is desired in a man is his steadfast love[b][a], and a poor man is better than a liar.
translation:
  language: hi
  text: किसी व्यक्ति में चाहने योग्य बात उसकी भरोसेमंद दयालुता है[a][b], और निर्धन व्यक्ति झूठे व्यक्ति से बेहतर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी व्यक्ति की अभिलाषा उसकी भरोसेमंद दयालुता है।” पहली पंक्ति की इब्रानी भाषा संक्षिप्त है; इसे या तो किसी व्यक्ति में वांछनीय गुण बताने वाला, या किसी व्यक्ति की अभिलाषा को उसकी दया अथवा निष्ठा से जोड़ने वाला कथन समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “भरोसेमंद दयालुता” के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार दया, निष्ठा, या विश्वासयोग्य प्रेम भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּאֲוַת
  choice: चाहने योग्य बात
  rationale: संज्ञा का अर्थ ‘इच्छा’ अथवा ‘वांछित वस्तु’ हो सकता है। यहाँ यह अनुवाद संभावित विधेयात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक पठन पादटिप्पणी में सुरक्षित है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक नीतिवचन में किसी सामान्य व्यक्ति का बोध है; ‘मनुष्य’ प्रतिनिधिक एकवचन और सार्वभौमिक आशय दोनों को स्वाभाविक ढंग से रखता है।
- source_word: חַסְדּוֹ
  choice: उसकी अटल प्रीति
  rationale: חֶסֶד में दया, निष्ठा और स्थिर प्रेम का समृद्ध भाव है। ‘अटल प्रीति’ संबंधपरक स्थिरता और नैतिक गहराई को रखती है, बिना इसे केवल वाचा-संबंधी अर्थ तक सीमित किए।
- source_word: וְטוֹב
  choice: और ... अच्छा है
  rationale: संयोजक और विशेषण दूसरी पंक्ति में तुलना आरम्भ करते हैं; हिन्दी में ‘से अच्छा है’ तुलना को स्पष्ट और सहज बनाता है।
- source_word: רָשׁ
  choice: निर्धन मनुष्य
  rationale: यह शब्द निर्धन व्यक्ति को सूचित करता है। ‘निर्धन’ गरिमापूर्ण आधुनिक हिन्दी है और ‘मनुष्य’ स्रोत के प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: מֵאִישׁ
  choice: मनुष्य से
  rationale: מִן तुलना का चिह्न है और אִישׁ तुलना के दूसरे व्यक्ति को प्रस्तुत करता है; हिन्दी में इसे ‘झूठे मनुष्य से’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: כָּזָב
  choice: झूठे
  rationale: यहाँ כָּזָב אִישׁ को झूठा अथवा अविश्वसनीय व्यक्ति बताता है। ‘झूठे मनुष्य’ स्रोत की संज्ञात्मक संरचना और व्यक्ति के चरित्र पर बल को बनाए रखता है।
theological_decisions:
- issue: पहली पंक्ति की संक्षिप्त और संदिग्ध संरचना
  choice: इसे ‘मनुष्य में चाहने योग्य बात उसकी अटल प्रीति है’ के रूप में पढ़ा गया है।
  alternative: ‘मनुष्य की अभिलाषा उसकी अटल प्रीति है।’
  rationale: इब्रानी दोनों संबंधों की अनुमति देती है। मुख्य पाठ अधिक संभावित विधेयात्मक अर्थ को ग्रहण करता है, पर वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अटल प्रीति’ חֶסֶד की स्थिर, संबंधपरक गुणवत्ता को व्यक्त करती है; दोनों पंक्तियों में ‘मनुष्य’ स्रोत के प्रतिनिधिक एकवचन और समानांतरता को बनाए रखता है।
