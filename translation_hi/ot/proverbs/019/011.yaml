source:
  edition: WLC
  text: שֵׂ֣כֶל אָ֭דָם הֶאֱרִ֣יךְ אַפּ֑/וֹ וְ֝/תִפאַרְתּ֗/וֹ עֲבֹ֣ר עַל פָּֽשַׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/011.yaml
  text: A man's insight makes him slow to anger[b][a], and it is his glory to overlook an offense.
translation:
  language: hi
  text: मनुष्य की सूझ-बूझ उसे क्रोध करने में देर करने वाला बनाती है,[a] और अपराध को अनदेखा करना उसकी शोभा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसकी नाक लंबी करती है”; यह धीरज रखने और देर से क्रोधित होने का इब्रानी मुहावरा है।
    reason: idiom_explanation
  - marker: b
    text: या “अपराध के ऊपर से गुजर जाना।” इसका आशय अपराध का प्रतिकार न करने या उसे जाने देने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל
  choice: सूझ-बूझ
  rationale: यह शब्द व्यावहारिक समझ, विवेक और सही निर्णय-क्षमता को दर्शाता है। ‘सूझ-बूझ’ आधुनिक हिन्दी में स्वाभाविक है और उस समझ को व्यक्त करता है जो मनुष्य को संयमित करती है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द किसी एक मानव को सामान्य, प्रतिनिधिक अर्थ में बताता है। ‘मनुष्य’ गरिमापूर्ण और सहज हिन्दी में इस व्यापक अर्थ को बनाए रखता है।
- source_word: הֶאֱרִיךְ אַפּוֹ
  choice: उसे क्रोध करने में धीमा बनाती है
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसकी नाक लंबी करती है’ है, पर इसका आशय क्रोध में देर करना या धीरज रखना है। चुना हुआ रूप कारणात्मक संबंध और मुहावरे का अर्थ दोनों स्पष्ट करता है।
- source_word: וְתִפאַרְתּוֹ
  choice: उसके लिए गौरव की बात है
  rationale: תִפְאֶרֶת सौंदर्य, शोभा, सम्मान या गौरव को सूचित कर सकता है। यहाँ यह उस आचरण को प्रशंसनीय और सम्मानजनक बताता है; ‘गौरव की बात’ हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: עֲבֹר עַל
  choice: अनदेखा करना
  rationale: इस पदबंध का अर्थ किसी अपराध के ऊपर से निकल जाना, उसे जाने देना या उसका प्रतिकार न करना है। ‘अनदेखा करना’ इस अर्थ को व्यक्त करता है, जबकि ‘क्षमा करना’ मूल से कुछ अधिक व्याख्यात्मक होता।
- source_word: פָּשַׁע
  choice: अपराध
  rationale: यह शब्द उल्लंघन, विद्रोह या गंभीर गलत काम को दर्शा सकता है। इस पारस्परिक संदर्भ में ‘अपराध’ गलत व्यवहार की गंभीरता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
