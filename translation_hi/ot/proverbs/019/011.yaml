  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक लहजा रखा गया है। इब्रानी मुहावरे को मुख्य पाठ में अर्थानुसार दिया गया है और उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
