base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/014.yaml
  text: A house and wealth are an inheritance from fathers[a], but a prudent wife is from Yahweh.
translation:
  language: hi
  text: 'घर और धन पिता-पुरखों से विरासत में मिलते हैं,

    पर समझदार पत्नी[a] याहवे की ओर से मिलती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदार स्त्री।” इब्रानी शब्द אִשָּׁה का अर्थ “स्त्री” या “पत्नी” हो सकता है; इस नीतिवचन में “पत्नी” प्रसंग के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: घर
  rationale: यहाँ הוֹן के साथ विरासत में मिलने वाली संपत्ति का उल्लेख है। ‘घर’ ठोस अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הוֹן
  choice: धन
  rationale: नीतिवचन के प्रसंग में यह भौतिक संपत्ति या समृद्धि को दर्शाता है; ‘धन’ स्पष्ट और सहज हिन्दी है।
- source_word: נַחֲלַת
  choice: विरासत में मिलते हैं
  rationale: इब्रानी रचना शाब्दिक रूप से ‘पिता-पुरखों की विरासत’ है। हिन्दी में क्रियात्मक अभिव्यक्ति वाक्य को स्वाभाविक बनाती है और उत्तराधिकार का भाव सुरक्षित रखती है।
- source_word: אָבוֹת
  choice: पिता-पुरखों
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और पूर्वज पिताओं की ओर संकेत करता है। ‘पिता-पुरखों’ से पितृवंशीय स्रोत स्पष्ट रहता है और हिन्दी में केवल ‘पिताओं’ से अधिक स्वाभाविक लगता है।
- source_word: מֵיְהוָה
  choice: याहवे की ओर से
  rationale: מִן स्रोत को दर्शाता है। परमेश्वर के व्यक्तिगत नाम יְהוָה को ‘याहवे’ रूप में रखा गया है।
- source_word: אִשָּׁה
  choice: पत्नी
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। घर और धन की विरासत के साथ तुलना में वैवाहिक अर्थ ‘पत्नी’ अधिक उपयुक्त है; व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: מַשְׂכָּלֶת
  choice: समझदार
  rationale: שׂכל से बना यह शब्द व्यावहारिक सूझ-बूझ और विवेकपूर्ण आचरण का भाव देता है। ‘समझदार’ आधुनिक पाठकों के लिए सहज है और नीतिवचन की व्यावहारिक बुद्धि को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: नीतिवचन में मानवीय विरासत और ईश्वरीय प्रबंध का विरोध
  choice: घर और धन पिता-पुरखों से विरासत में मिलते हैं, जबकि समझदार पत्नी याहवे की ओर से मिलती है
  alternative: समझदार स्त्री याहवे की ओर से होती है
  rationale: पद भौतिक संपत्ति के मानवीय उत्तराधिकार और विवेकशील जीवनसाथी के ईश्वरीय स्रोत के बीच तुलना करता है। ‘पत्नी’ प्रसंगानुकूल है, पर मूल की शब्दगत व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर दो पंक्तियाँ इब्रानी नीतिवचन की तुलना को स्पष्ट करती हैं। ‘समझदार’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी मूल शब्द की वास्तविक अस्पष्टता बनाए रखती है।
