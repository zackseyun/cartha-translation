  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त और कहावत-सदृश रखी गई है। दोनों आज्ञार्थक क्रियाओं को एकवचन अनौपचारिक रूप में रखा गया है, जैसा हिब्रू में है। 'ठट्ठा करनेवाला', 'भोला' और 'समझदार' नीतिवचन की तीन अलग मानवीय श्रेणियों को स्पष्ट रखते हैं।
