base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/025.yaml
  text: Strike a scoffer[a], and the simple will become shrewd; rebuke one who has understanding[c][b], and he will gain knowledge.
translation:
  language: hi
  text: उपहास उड़ानेवाले को मारो[a], तो भोला चतुर हो जाएगा; समझदार को डाँटो, तो वह ज्ञान प्राप्त करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठट्ठा करनेवाले को मारो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: नीतिवचन में यह शब्द उस व्यक्ति के लिए है जो तिरस्कारपूर्वक उपहास करता है; यह सामान्य हँसी-मज़ाक से अधिक नैतिक रूप से नकारात्मक अर्थ रखता है।
- source_word: תַּכֶּה
  choice: मार
  rationale: यहाँ נכה दंड देने के लिए प्रहार करने को व्यक्त करता है। 'मार' आधुनिक और सीधा है तथा अत्यधिक हिंसा का अनावश्यक संकेत नहीं देता।
- source_word: פֶתִי
  choice: भोला
  rationale: यह नीतिवचन का पारिभाषिक शब्द है, जो अनुभवहीन, आसानी से बहकनेवाले व्यक्ति को दर्शाता है; 'भोला' सामान्य हिन्दी में इस अर्थ को स्वाभाविक ढंग से पहुँचाता है।
- source_word: יַעְרִם
  choice: चतुर हो जाएगा
  rationale: ערם का यहाँ अर्थ व्यावहारिक सूझ-बूझ या सावधानी प्राप्त करना है। 'चतुर' संदर्भ में सकारात्मक विवेकशीलता को व्यक्त करता है।
- source_word: וְהוֹכִיחַ
  choice: डाँट
  rationale: יכח यहाँ मौखिक फटकार या सुधार को दर्शाता है। 'डाँट' सहज आधुनिक हिन्दी है और पहले खंड के शारीरिक प्रहार से भेद बनाए रखता है।
- source_word: לְנָבוֹן
  choice: समझदार
  rationale: נָבוֹן विवेक और समझ रखनेवाले एक व्यक्ति को दर्शाता है; 'समझदार' संक्षिप्त, स्वाभाविक और एकवचन व्यक्तिगत अर्थ के अनुकूल है।
- source_word: יָבִין
  choice: समझेगा
  rationale: בין का मूल अर्थ समझना या भेद जानना है। דָּעַת को कर्म बनाकर 'ज्ञान को समझेगा' मूल की अभिव्यक्ति और ज्ञान ग्रहण करने की प्रक्रिया को सुरक्षित रखता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह नीतिवचन साहित्य का मानक ज्ञान-संबंधी शब्द है और नָבוֹן की पहले से विद्यमान समझ से अलग, आगे समझे जानेवाले ज्ञान को व्यक्त करता है।
