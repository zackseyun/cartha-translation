  text: נָכ֣וֹנוּ לַ/לֵּצִ֣ים שְׁפָטִ֑ים וּ֝/מַהֲלֻמ֗וֹת לְ/גֵ֣ו כְּסִילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/029.yaml
  text: Judgments are prepared for scoffers[a], and beatings for the back of fools.
translation:
  language: hi
  text: 'उपहास करने वालों के लिए दंड तैयार हैं,

    और मूर्खों की पीठ के लिए मार।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָכ֣וֹנוּ
  choice: तैयार हैं
  rationale: निफ़अल पूर्ण बहुवचन यहाँ पहले से तैयार या नियत रखे होने का भाव देता है; हिन्दी में “तैयार हैं” स्वाभाविक रहते हुए इस भाव को सुरक्षित रखता है।
- source_word: לַ/לֵּצִ֣ים
  choice: ठट्ठा करनेवालों के लिए
  rationale: לֵצִים अहंकारी उपहास करनेवालों को दर्शाता है। “ठट्ठा करनेवाले” नीतिवचन की नैतिक श्रेणी और तिरस्कारपूर्ण उपहास—दोनों को व्यक्त करता है।
- source_word: שְׁפָטִ֑ים
  choice: दण्ड
  rationale: शब्द का मूल अर्थ न्यायिक निर्णय हो सकता है, पर समानांतर पंक्ति में मार का उल्लेख होने से यहाँ दण्डात्मक निर्णय अभिप्रेत हैं। “दण्ड” आधुनिक हिन्दी में इस संदर्भ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וּ֝/מַהֲלֻמ֗וֹת
  choice: मार
  rationale: यह बहुवचन संज्ञा प्रहारों को सूचित करती है। हिन्दी का सामूहिक प्रयोग “मार” अनेक प्रहारों या शारीरिक दण्ड का स्वाभाविक बोध देता है।
- source_word: לְ/גֵ֣ו
  choice: पीठ के लिए
  rationale: גֵּו का अर्थ शरीर का धड़ या पीठ हो सकता है; प्रहार के संदर्भ में “पीठ” सबसे ठोस और स्वाभाविक अर्थ है। हिब्रू के एकवचन रूप को बनाए रखा गया है।
- source_word: כְּסִילִֽים
  choice: मूर्खों
  rationale: नीतिवचन में כְּסִילִים केवल कम बुद्धि वाले नहीं, बल्कि नैतिक रूप से हठी लोगों की स्थापित श्रेणी है; “मूर्ख” इस व्यापक ज्ञान-साहित्यिक अर्थ को सुरक्षित रखता है।
theological_decisions: []
