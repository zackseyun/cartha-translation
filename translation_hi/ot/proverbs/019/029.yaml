  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। दोनों समानांतर पदों की संरचना सुरक्षित है; “दण्ड” और “मार” से न्यायिक तथा शारीरिक दण्ड का क्रम स्पष्ट होता है।
