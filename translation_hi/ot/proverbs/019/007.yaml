source:
  edition: WLC
  text: כָּ֥ל אֲחֵי רָ֨שׁ שְֽׂנֵאֻ֗/הוּ אַ֤ף כִּ֣י מְ֭רֵעֵ/הוּ רָחֲק֣וּ מִמֶּ֑/נּוּ מְרַדֵּ֖ף אֲמָרִ֣ים לא הֵֽמָּה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/007.yaml
  text: All the brothers of a poor man hate him[a]; how much more do his friends keep far from him! He pursues words[b], but they are not there.
translation:
  language: hi
  text: निर्धन के सभी भाई[b] उससे घृणा करते हैं; उसके मित्र तो उससे और भी अधिक दूर रहते हैं! वह बातों के पीछे भागता है, पर वे नहीं मिलतीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह ऐसी बातों के पीछे भागता है जो निरर्थक हैं,” अथवा, “वह वादों के पीछे भागता है, पर वे पूरे नहीं होते।” इब्रानी में अंतिम उपवाक्य पाठ और वाक्य-संरचना की दृष्टि से कठिन है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “भाई” व्याकरण की दृष्टि से पुल्लिंग है; इस कहावत के सामाजिक परिवेश में इसका संकेत परिवार के सदस्यों की ओर है।
    reason: cultural_note
lexical_decisions:
- source_word: רָשׁ
  choice: निर्धन
  rationale: यह शब्द अभावग्रस्त व्यक्ति को दर्शाता है। ‘निर्धन’ आधुनिक, गरिमापूर्ण और संक्षिप्त है; पुल्लिंग एकवचन का संकेत आगे के सर्वनाम और संबंधसूचक पदों से स्पष्ट रहता है।
- source_word: אֲחֵי
  choice: भाई
  rationale: इब्रानी पद का सीधा अर्थ ‘भाई’ है और यह पारिवारिक संबंध की शक्ति को ‘रिश्तेदार’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: שְׂנֵאֻהוּ
  choice: उससे घृणा करते हैं
  rationale: क्रिया שׂנא का सामान्य और प्रबल अर्थ ‘घृणा करना’ है; इसे ‘तुच्छ समझना’ कहना मूल की तीव्रता घटा देता।
- source_word: אַף כִּי
  choice: तो ... और भी अधिक
  rationale: 'यह पद न्यूनाधिक तर्क व्यक्त करता है: जब भाई तक घृणा करते हैं, तो मित्र उससे और भी अधिक दूरी रखते हैं।'
- source_word: מְרֵעֵהוּ
  choice: उसके मित्र
  rationale: यह संज्ञा मित्रों या साथियों को सूचित करती है; ‘मित्र’ यहाँ ‘भाइयों’ के साथ स्वाभाविक विरोध प्रस्तुत करता है।
- source_word: רָחֲקוּ מִמֶּנּוּ
  choice: उससे ... दूर रहते हैं
  rationale: यह अनुवाद भौतिक दूरी के साथ संबंधों में जानबूझकर रखी गई दूरी को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְרַדֵּף
  choice: वह ... पीछे भागता है
  rationale: कृदन्त का वाक्यगत संबंध कठिन है; इसे निर्धन व्यक्ति का कार्य बताने वाली क्रिया के रूप में प्रस्तुत करना प्रसंगानुकूल है और उसके निरंतर प्रयास का भाव रखता है।
- source_word: אֲמָרִים
  choice: बातों
  rationale: मूल अर्थ ‘शब्द/बातें’ है। ‘वादे’ संभव प्रासंगिक अर्थ है, पर मुख्य पाठ में अधिक व्याख्यात्मक अर्थ थोपने के बजाय व्यापक शब्द रखा गया है।
- source_word: לֹא הֵמָּה
  choice: पर वे मिलती नहीं हैं
  rationale: समापन अत्यंत संक्षिप्त और पाठगत-संरचनात्मक रूप से कठिन है। यह अनुवाद पीछा की गई बातों के अनुपलब्ध सिद्ध होने का संभावित अर्थ देता है, जबकि पादटिप्पणी अन्य अर्थों को सुरक्षित रखती है।
