  choice: मुख्य पाठ में ‘दण्ड से नहीं बचेगा’
  alternative: ‘निर्दोष नहीं ठहराया जाएगा’ या ‘दोषमुक्त नहीं होगा’
  rationale: समानांतर पंक्ति में निश्चित विनाश का उल्लेख दण्ड से न बचने के अर्थ को समर्थन देता है, पर मूल क्रिया का न्यायिक अर्थ पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और नीतिवचन-सुलभ शैली रखी गई है। ‘दण्ड’ न्यायिक स्वर को बनाए रखता है; ‘उगलता रहता है’ मूल रूपक की सजीवता और अभ्यस्त क्रिया दोनों व्यक्त करता है।
