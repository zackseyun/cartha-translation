  yaml_path: translation/ot/proverbs/019/009.yaml
  text: A false witness will not go unpunished[b][a], and one who breathes out lies will perish.
translation:
  language: hi
  text: झूठा गवाह दण्ड से नहीं बचेगा[a], और जो झूठ उगलता है[b], वह नष्ट हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्दोष नहीं ठहराया जाएगा” अथवा “दोषमुक्त नहीं होगा।” इब्रानी क्रिया न्यायिक दोषमुक्ति न मिलने या दण्ड से न बच पाने—दोनों पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “झूठ फूँकता है” या “झूठ बाहर निकालता है।” यह अभिव्यक्ति ऐसे व्यक्ति का चित्र खींचती है जिससे झूठ साँस के समान सहजता से निकलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד שְׁקָרִים
  choice: झूठा गवाह
  rationale: यह पदबंध कानूनी या साक्ष्य देने वाले गवाह को दर्शाता है; बहुवचन भाववाचक שְׁקָרִים यहाँ विशेषण के समान काम करता है। ‘झूठा गवाह’ स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: לֹא יִנָּקֶה
  choice: दण्ड से नहीं बचेगा
  rationale: נקה के निफ़अल रूप में निर्दोष ठहराए जाने, दोषमुक्त होने या दण्ड से बच निकलने की अर्थ-सीमा है। इस नीतिवचन में निश्चित दण्ड का भाव स्वाभाविक है, जबकि पादटिप्पणी न्यायिक विकल्प को सुरक्षित रखती है।
- source_word: וְיָפִיחַ
  choice: और जो ... उगलता रहता है
  rationale: פוח का हिफ़ईल रूप साँस के समान बाहर निकालने या लगातार बोलने का सजीव चित्र देता है। ‘उगलता रहता है’ हिन्दी में इस सहज और बार-बार निकलते झूठ की तीव्र छवि को बनाए रखता है।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: बहुवचन संज्ञा का अर्थ झूठी बातें या असत्य कथन है। हिन्दी में ‘झूठ’ सामूहिक अर्थ में स्वाभाविक है।
- source_word: יֹאבֵד
  choice: नष्ट हो जाएगा
  rationale: אבד का क़ाल रूप नाश होने या विनष्ट होने को दर्शाता है। यह चुनाव पद की गंभीर चेतावनी को बनाए रखता है और उसे केवल सामान्य असफलता तक सीमित नहीं करता।
