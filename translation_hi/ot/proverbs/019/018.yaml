source:
  edition: WLC
  text: יַסֵּ֣ר בִּ֭נְ/ךָ כִּי יֵ֣שׁ תִּקְוָ֑ה וְ/אֶל הֲ֝מִית֗/וֹ אַל תִּשָּׂ֥א נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/018.yaml
  text: Discipline your son[a], for there is hope[b]; do not set your heart on putting him to death.
translation:
  language: hi
  text: अपने पुत्र को अनुशासित कर, क्योंकि आशा है[a]; उसे मार डालने की इच्छा मत कर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जब तक आशा है।” इब्रानी वाक्यांश को कारणसूचक (“क्योंकि आशा है”) या कालसूचक (“जब तक आशा है”) समझा जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसे मार डालने की ओर अपने प्राण को मत उठा।” यह इब्रानी मुहावरा अपनी इच्छा या संकल्प को किसी घातक परिणाम की ओर लगाने को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסֵּר
  choice: अनुशासित कर
  rationale: पिएल आज्ञार्थक रूप सुधार के उद्देश्य से दी जाने वाली ताड़ना या अनुशासन को व्यक्त करता है। ‘अनुशासित कर’ आधुनिक हिन्दी में इस आशय को बिना अनावश्यक कठोरता जोड़े स्पष्ट करता है।
- source_word: בִּנְךָ
  choice: अपने पुत्र को
  rationale: इब्रानी शब्द विशेष रूप से ‘पुत्र’ का द्योतक है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: क्योंकि आशा है
  rationale: כִּי को यहाँ कारणसूचक मानना स्वाभाविक है। फिर भी ‘जब तक आशा है’ वाला कालसूचक अर्थ सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: הֲמִיתוֹ
  choice: उसे मार डालने
  rationale: हिफ़ील रूप का अर्थ उसे मृत्यु तक पहुँचाना अथवा मरवा देना है; ‘मार डालने’ से उसका कारक अर्थ स्पष्ट रहता है।
- source_word: אַל תִּשָּׂא נַפְשֶׁךָ
  choice: इच्छा मत कर
  rationale: शाब्दिक रूप ‘अपने प्राण को मत उठा’ है, जो इच्छा या संकल्प को किसी दिशा में लगाने का इब्रानी मुहावरा है। स्वाभाविक हिन्दी में ‘इच्छा मत कर’ उसका प्रमुख भाव व्यक्त करता है।
theological_decisions:
- issue: दूसरे चरण में माता-पिता के लिए चेतावनी का अर्थ
  choice: पुत्र को सुधारने के लिए अनुशासन देना चाहिए, पर उसे मार डालने की इच्छा या घातक कठोरता नहीं रखनी चाहिए।
  alternative: अनुशासन देना न छोड़, कहीं ऐसा न हो कि वह मर जाए।
  rationale: इब्रानी वाक्य-विन्यास सबसे स्वाभाविक रूप से पुत्र को मार डालने की ओर अपनी इच्छा या संकल्प न लगाने की मनाही करता है। वैकल्पिक अर्थ अनुशासन न देने के घातक परिणाम पर बल देता है, पर वह मूल शब्दों से अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की आज्ञात्मक शैली के अनुरूप रखी गई है। ‘पुत्र’ मूल के लिंग-विशिष्ट अर्थ को सुरक्षित रखता है; ‘अनुशासित कर’ सुधारात्मक उद्देश्य बताता है, जबकि दूसरा चरण घातक कठोरता को स्पष्ट रूप से रोकता है।
