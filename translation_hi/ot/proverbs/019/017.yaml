source:
  edition: WLC
  text: מַלְוֵ֣ה יְ֭הוָה ח֣וֹנֵֽן דָּ֑ל וּ֝/גְמֻל֗/וֹ יְשַׁלֶּם לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/019/017.yaml
  text: Whoever is gracious to the poor lends to Yahweh[a], and he will repay him for his deed.
translation:
  language: hi
  text: 'जो निर्धन पर कृपा करता है, वह यहोवा को उधार देता है,

    और वह उसके किए का प्रतिफल उसे देगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְוֵה
  choice: उधार देता है
  rationale: हिफ़ील कृदन्त का अर्थ ‘उधार देना’ है। इससे मूल का साहसपूर्ण ऋण-रूपक स्पष्ट और स्वाभाविक हिन्दी में बना रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: חֹנֵן
  choice: कृपा करता है
  rationale: यह क्रिया अनुग्रह या कृपा दिखाने का भाव रखती है; ‘कृपा करता है’ उसके अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: דָּל
  choice: निर्धन
  rationale: यहाँ शब्द सामाजिक-आर्थिक रूप से गरीब या अभावग्रस्त व्यक्ति को सूचित करता है; ‘निर्धन’ आधुनिक मानक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: וּגְמֻלוֹ
  choice: उसके उपकार का प्रतिफल
  rationale: גְּמוּל किए गए उपकार और उसके अनुरूप मिलने वाले प्रतिदान—दोनों की ओर संकेत कर सकता है। यह अनुवाद उस अर्थ-संबंध को बनाए रखता है और अगले क्रियापद के साथ स्वाभाविक है।
- source_word: יְשַׁלֶּם
  choice: प्रतिफल ... देगा
  rationale: पिअेल रूप चुकाने या प्रतिदान देने को दर्शाता है। हिन्दी में ‘प्रतिफल देगा’ ऋण-रूपक की वापसी और पुरस्कार दोनों भावों को व्यक्त करता है।
- source_word: לוֹ
  choice: उसे
  rationale: सर्वनाम स्वाभाविक रूप से उस व्यक्ति की ओर लौटता है जो निर्धन पर कृपा करता है।
theological_decisions:
- issue: निर्धन के प्रति उदारता और परमेश्वर के बीच रूपकात्मक संबंध
  choice: निर्धन पर कृपा करना स्वयं यहोवा को उधार देना कहा गया है, और यहोवा उस उपकार का प्रतिफल देगा।
  alternative: इसे सामान्य रूप से केवल इतना कहना कि परमेश्वर उदारता को देखता और पुरस्कृत करता है।
  rationale: इब्रानी पाठ स्पष्ट रूप से ऋण का रूपक प्रयुक्त करता है और यहोवा को उसका प्राप्तकर्ता बताता है। अनुवाद इस तीखे धार्मिक कथन को बनाए रखता है, पर उससे आगे कोई सम्प्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली। समान्तर पंक्ति-विन्यास इब्रानी नीतिवचन की संरचना को उभारता है। ‘निर्धन’, ‘कृपा’ और ‘उपकार का प्रतिफल’ सामान्य पाठक के लिए बोधगम्य रहते हुए साहित्यिक मर्यादा बनाए रखते हैं।
