  text: Whoever gains sense loves his own life[b][a]; whoever keeps understanding will find good.
translation:
  language: hi
  text: जो समझ[a] हासिल करता है, वह अपने जीवन[b] से प्रेम करता है; जो सूझ-बूझ को सँभालकर रखता है, वह भलाई पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हृदय हासिल करता है।” इब्रानी ज्ञान-साहित्य में “हृदय” प्रायः मन या विवेक करने की क्षमता को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “अपने आप से प्रेम करता है” या “अपने प्राण से प्रेम करता है” भी हो सकता है। यहाँ प्रयुक्त इब्रानी संज्ञा केवल संकीर्ण अर्थ में आत्मा नहीं, बल्कि व्यक्ति स्वयं या उसका जीवन भी दर्शा सकती है।
    reason: lexical_alternative
