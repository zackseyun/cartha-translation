- source_word: שֹׁמֵר
  choice: सँभालकर रखता है
  rationale: यह ध्यानपूर्वक रक्षा करने और बनाए रखने का भाव देता है; ‘सूझ-बूझ’ जैसी अमूर्त वस्तु के साथ यह हिन्दी में स्वाभाविक है।
- source_word: תְּבוּנָה
  choice: सूझ-बूझ
  rationale: यह ज्ञान-साहित्य का शब्द विवेकपूर्ण समझ या अंतर्दृष्टि को दर्शाता है; ‘सूझ-बूझ’ व्यावहारिक विवेक का भाव देता और पहले खंड की ‘समझ’ से शैलीगत भेद बनाए रखता है।
- source_word: לִמְצֹא טוֹב
  choice: भलाई पाएगा
  rationale: ל के साथ infinitive परिणाम या निष्कर्ष का भाव दे सकता है; ‘भलाई पाएगा’ भविष्याभिमुख परिणाम को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
