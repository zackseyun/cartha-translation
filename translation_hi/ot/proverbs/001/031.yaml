  rationale: Only ‘चाल’ has been changed to ‘मार्ग’. This preserves the original metaphor and avoids an avoidable ambiguity in modern Hindi. The prepositional wording ‘फल में से’ retains the source-oriented nuance of מִן, and no footnotes are required for this short verse.
