id: PRO.1.31
reference: Proverbs 1:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ֭/יֹאכְלוּ מִ/פְּרִ֣י דַרְכָּ֑/ם וּֽ/מִ/מֹּעֲצֹ֖תֵי/הֶ֣ם יִשְׂבָּֽעוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/031.yaml
  text: So they will eat from the fruit of their way[b][a], and be filled with their own counsels.
translation:
  language: hi
  text: इसलिए वे अपने मार्ग के फल में से खाएँगे, और अपनी ही युक्तियों से तृप्त होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֹאכְלוּ
  choice: इसलिए वे…खाएँगे
  rationale: आरंभिक וְ को पिछले पदों में बुद्धि को ठुकराने के परिणाम से जोड़ने वाला माना गया है; ‘इसलिए’ इस निष्कर्षात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और अपूर्ण क्रिया का भावी अर्थ बनाए रखता है।
- source_word: מִפְּרִי
  choice: फल में से
  rationale: מִן के स्रोतार्थ को स्पष्ट रखता है और अपने किए का फल खाने वाले रूपक को सुरक्षित रखता है।
- source_word: דַרְכָּם
  choice: अपनी चाल
  rationale: नीतिवचन में ‘मार्ग/चाल’ जीवन-पद्धति और नैतिक आचरण का रूपक है। यहाँ ‘चाल’ साधारण हिन्दी में व्यक्ति के अपनाए हुए ढंग का अर्थ देती है, बिना रूपक को केवल ‘आचरण’ में बदलकर व्याख्यायित किए।
- source_word: וּמִמֹּעֲצֹתֵיהֶם
  choice: और अपनी ही युक्तियों से
  rationale: מֹעֵצוֹת योजनाओं, सलाहों अथवा युक्तियों को सूचित कर सकता है। ‘युक्तियों’ से स्वयं गढ़ी गई योजनाओं का संदर्भ बना रहता है; ‘ही’ स्वामित्व और प्रत्यावर्ती बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: יִשְׂבָּעוּ
  choice: तृप्त होंगे
  rationale: क्रिया का मूल भाव भर जाने अथवा जी भर पाने का है। ‘तृप्त होंगे’ रूपक और उसके विडंबनापूर्ण न्यायार्थ—अपनी ही योजनाओं के परिणामों से भर जाना—दोनों को खुला रखता है।
theological_decisions:
- issue: बुद्धि-साहित्य में नैतिक परिणाम का रूपक
  choice: पद को मनुष्य द्वारा अपने चुने हुए जीवन-ढंग और युक्तियों का परिणाम भोगने के कथन के रूप में प्रस्तुत किया गया है।
  alternative: आरंभिक संयोजक का केवल ‘और’ से अनुवाद करके परिणाम-संबंध को अधिक निहित छोड़ा जा सकता था।
  rationale: फल खाना और तृप्त होना उसी के चुनावों के अनुरूप परिणाम का चित्र प्रस्तुत करता है। अनुवाद इस अर्थ को व्यक्त करता है, पर इसमें किसी बाद की विशिष्ट दंड-सिद्धांत संबंधी धारणा को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चाल’, ‘फल’, ‘युक्तियाँ’ और ‘तृप्त’ मूल के काव्यात्मक समानांतर रूपक को बनाए रखते हैं।
