translation:
  language: hi
  text: समझदारी से आचरण करने की, तथा धार्मिकता, न्याय और निष्पक्षता[b] की शिक्षा[a] ग्रहण करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासन” या “सुधार”; शाब्दिक रूप से “लेना।” इब्रानी शब्द चरित्र-निर्माण करने वाली शिक्षा, अनुशासन या सुधार का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “सीधाई”; इब्रानी शब्द नैतिक सीधेपन, उचितता और निष्पक्ष व्यवहार का भाव रखता है।
