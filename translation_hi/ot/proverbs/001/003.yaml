lexical_decisions:
- source_word: לָקַחַת
  choice: ग्रहण करने के लिए
  rationale: यहाँ उद्देश्यसूचक क्रियारूप है। मूल अर्थ ‘लेना’ है, पर शिक्षा के संदर्भ में ‘ग्रहण करना’ स्वाभाविक और अर्थानुकूल है।
- source_word: מוּסַר
  choice: शिक्षा
  rationale: शब्द में अनुशासन, सुधार और चरित्र-निर्माण करने वाली शिक्षा के भाव हैं। यहाँ नीतिवचनों की भूमिका में व्यापक शिक्षात्मक अर्थ प्रमुख है।
- source_word: הַשְׂכֵּל
  choice: समझ-बूझ से काम करने की
  rationale: यह केवल बौद्धिक समझ नहीं, बल्कि व्यावहारिक सूझ-बूझ और बुद्धिमानी से आचरण करने की योग्यता बताता है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: नैतिक रूप से सही होने और सही काम करने का भाव रखता है; इसे ‘न्याय’ से अलग रखा गया है, क्योंकि अगला शब्द מִשְׁפָּט है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ उचित निर्णय और सामाजिक-नैतिक न्याय का अर्थ है।
- source_word: מֵישָׁרִים
  choice: निष्पक्षता
  rationale: मूलतः सीधेपन और खराई से निकला यह बहुवचन नैतिक समता, उचितता और निष्पक्ष व्यवहार का भाव देता है। ‘सीधाई’ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
