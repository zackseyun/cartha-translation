translation:
  language: hi
  text: 'नीतिवचन और सूक्ति[a] को,

    बुद्धिमानों के वचनों और उनकी पहेलियों[b] को समझने के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीतिवचन और व्याख्या।” इब्रानी शब्द कलात्मक या सारगर्भित उक्ति को और कुछ संदर्भों में व्याख्यात्मक अभिव्यक्ति को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी गूढ़ उक्तियाँ।” इब्रानी शब्द ऐसी पहेलियों या रहस्यपूर्ण उक्तियों को सूचित कर सकता है जिन पर विचार करने की आवश्यकता होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָבִין
  choice: समझने के लिए
  rationale: לְ सहित क्रिया का यह रूप पिछले पदों से चली आ रही उद्देश्य-सूची को आगे बढ़ाता है; यह अनुवाद בין के बोधात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: מָשָׁל
  choice: नीतिवचन
  rationale: नीतिवचन की पुस्तक और इस प्रसंग में यह शब्द सामान्यतः ज्ञानपूर्ण कहावत या नीतिवचन को सूचित करता है।
- source_word: מְלִיצָה
  choice: सूक्ति
  rationale: दुर्लभ इब्रानी शब्द किसी कलात्मक, सारगर्भित या अर्थपूर्ण उक्ति को सूचित कर सकता है। ‘सूक्ति’ समानांतरता और साहित्यिक भाव बनाए रखती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: דִּבְרֵי
  choice: वचनों
  rationale: דבר के रचनात्मक बहुवचन का सीधा और गरिमापूर्ण हिन्दी रूप, जो अगले संबंधसूचक पद को स्पष्ट रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: विशेषण यहाँ संज्ञा के रूप में बुद्धिमान व्यक्तियों को दर्शाता है; यह रूप अनावश्यक रूप से पुरुष लिंग निर्दिष्ट नहीं करता।
- source_word: חִידֹתָם
  choice: उनकी पहेलियों
  rationale: חִידָה पहेली या ऐसी गूढ़ उक्ति को दर्शाता है जिस पर विचार करना पड़े; ‘उनकी’ से इब्रानी का बहुवचन संबंधसूचक प्रत्यय सुरक्षित रहता है।
