  text: בְּ/רֹ֥אשׁ הֹמִיּ֗וֹת תִּ֫קְרָ֥א בְּ/פִתְחֵ֖י שְׁעָרִ֥ים בָּ/עִ֗יר אֲמָרֶ֥י/הָ תֹאמֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/021.yaml
  text: 'At the head of the noisy streets she cries out[c][b][a]; at the entrances of the gates in the city she speaks her words:'
translation:
  language: hi
  text: 'चहल-पहल भरी जगहों के प्रमुख स्थानों पर वह पुकारती है[a]; नगर के फाटकों[b] के प्रवेश-स्थलों पर वह अपने वचन कहती है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोलाहल भरी जगहों के सबसे ऊँचे स्थान पर वह पुकारती है।” हिब्रू अभिव्यक्ति किसी प्रमुख स्थान या ऊँचे अथवा अग्रभाग पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: नगर के फाटक मुख्य सार्वजनिक सभा-स्थल होते थे, जहाँ व्यापार, न्यायिक मामले और नागरिक कार्य होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: בְּרֹאשׁ
  choice: मुख्य स्थान पर
  rationale: रֹאשׁ का मूल अर्थ ‘सिर’ है, पर स्थान-सूचक प्रयोग में यह ऊपरी, अग्रणी या प्रमुख स्थान को दर्शा सकता है। यहाँ सार्वजनिक नगर-परिवेश में ‘मुख्य स्थान’ स्वाभाविक है और वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: הֹמִיּוֹת
  choice: चहल-पहल वाली जगहों
  rationale: यह शब्द शोर, गहमागहमी या कोलाहल से भरे स्थानों को दर्शाता है। ‘चहल-पहल वाली जगहें’ नगर के जीवंत सार्वजनिक परिवेश को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּקְרָא
  choice: वह पुकारती है
  rationale: קרא का अर्थ पुकारना या ऊँचे स्वर में बुलाना है। ‘पुकारती है’ ज्ञान की सार्वजनिक और श्रव्य घोषणा को व्यक्त करता है।
- source_word: בְּפִתְחֵי
  choice: प्रवेश-स्थानों पर
  rationale: פֶּתַח किसी खुलने की जगह या प्रवेश को दर्शाता है। बहुवचन रूप तथा फाटकों के साथ संबंध बनाए रखने के लिए ‘प्रवेश-स्थानों’ चुना गया है।
- source_word: שְׁעָרִים
  choice: फाटकों
  rationale: यह नगर के फाटकों को दर्शाता है, जो प्राचीन नगरों में व्यापार, न्याय और नागरिक जीवन के सार्वजनिक केंद्र होते थे।
- source_word: בָּעִיר
  choice: नगर के
  rationale: हिब्रू वाक्यांश फाटकों को नगर के क्षेत्र से जोड़ता है। हिन्दी में ‘नगर के फाटक’ अधिक स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: אֲמָרֶיהָ תֹאמֵר
  choice: वह अपने वचन कहती है
  rationale: शाब्दिक संरचना ‘वह अपने वचन कहती है’ है। यह हिन्दी में बोधगम्य है और मूल की पुनरुक्तिपूर्ण सार्वजनिक-वाणी की अभिव्यक्ति को सुरक्षित रखती है।
theological_decisions:
- issue: ज्ञान का स्त्री व्यक्तित्व के रूप में चित्रण
  choice: ‘वह’ और स्त्रीलिंग क्रियाओं को बनाए रखना
  alternative: निर्वैयक्तिक रूप, जैसे ‘ज्ञान पुकारता है’
  rationale: हिब्रू क्रियाएँ और सर्वनाम-सूचक प्रत्यय स्त्रीलिंग एकवचन हैं और प्रसंग में ज्ञान के स्त्री-व्यक्तित्व को जारी रखते हैं। इसे बनाए रखना स्रोत के प्रति निष्ठावान है और इससे आगे कोई विशेष धर्मवैज्ञानिक पहचान निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘नगर’ और ‘वचन’ काव्यात्मक-नीतिवचनात्मक गरिमा बनाए रखते हैं; ‘चहल-पहल वाली जगहें’ הֹמִיּוֹת के शोर और सार्वजनिक गहमागहमी को सामान्य पाठक के लिए स्पष्ट करता है।
