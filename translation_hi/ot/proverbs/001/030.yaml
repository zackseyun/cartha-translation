  text: उन्होंने मेरी सलाह मानना नहीं चाहा[a]; उन्होंने मेरी सारी फटकार को तुच्छ जाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने मेरी सलाह मानने से इनकार किया।”
