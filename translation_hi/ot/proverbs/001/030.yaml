lexical_decisions:
- source_word: לֹא אָבוּ
  choice: मानना नहीं चाहा
  rationale: אבה के निषेध में अनिच्छा या अस्वीकार का भाव है। यह हिंदी प्रयोग उस इच्छात्मक अर्थ को बनाए रखता है और केवल घटना के निषेध से अधिक स्पष्ट है।
- source_word: לַעֲצָתִי
  choice: मेरी सलाह मानना
  rationale: עֵצָה का अर्थ सलाह या सम्मति है। हिंदी में אבה के साथ स्वाभाविक वाक्य पूरा करने के लिए ‘मानना’ निहित प्रतिक्रिया को स्पष्ट करता है।
- source_word: נָאֲצוּ
  choice: तुच्छ जाना
  rationale: इस क्रिया में केवल अस्वीकार नहीं, बल्कि अवमानना और घृणापूर्ण उपेक्षा का प्रबल भाव है; ‘तुच्छ जाना’ इसे संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כָּל
  choice: हर
  rationale: एकवचन भाववाचक पद के साथ ‘हर’ आधुनिक हिंदी में स्वाभाविक रूप से समग्रता व्यक्त करता है।
- source_word: תּוֹכַחְתִּי
  choice: मेरी हर सुधार की बात
  rationale: תּוֹכַחַת में डाँट, सुधार और त्रुटि दिखाने का भाव हो सकता है। ‘सुधार की बात’ सामान्य पाठक के लिए सहज है और केवल कठोर दंड का अर्थ नहीं देती।
