base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/011.yaml
  text: If they say[a], “Come with us, let us lie in wait for blood[b]; let us ambush the innocent without cause,”
translation:
  language: hi
  text: यदि वे कहें, “हमारे साथ चल! आओ, हम खून[a] बहाने के लिए घात लगाएँ; किसी निर्दोष को अकारण घात में लेने के लिए छिपें[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “खून के लिए”; यहाँ इसका आशय हिंसक रक्तपात या हत्या है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया का अधिक शाब्दिक अर्थ “अपने को छिपाएँ” हो सकता है; इस प्रसंग में आशय किसी निर्दोष पर हमला करने के लिए छिपकर घात लगाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יֹאמְרוּ
  choice: यदि वे कहें
  rationale: शर्तसूचक אִם और अपूर्ण क्रिया का यह स्वाभाविक हिन्दी रूप है; इससे पिता की चेतावनी में प्रस्तुत संभावित परिस्थिति बनी रहती है।
- source_word: לְכָה אִתָּנוּ
  choice: हमारे साथ चल
  rationale: לְכָה यहाँ समूह में सम्मिलित होने का आमंत्रण देने वाला एकवचन पुल्लिंग आदेश है। ‘हमारे साथ चल’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: נֶאֶרְבָה
  choice: आओ, हम … घात लगाएँ
  rationale: ארב का आशय छिपकर आक्रमण की प्रतीक्षा करना है। ‘घात लगाएँ’ योजनाबद्ध हिंसा को स्पष्ट करता है, और ‘आओ, हम’ हिब्रू के इच्छार्थक रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדָם
  choice: खून के लिए
  rationale: हिब्रू का शाब्दिक और अत्यंत संक्षिप्त बिंब बनाए रखा गया है। संदर्भ में इसका आशय हिंसक रक्तपात या हत्या है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: נִצְפְּנָה
  choice: छिपकर बैठें
  rationale: צפן का मूल भाव छिपना या अपने को छिपाना है। यहाँ समानांतर पंक्ति और प्रसंग इसे घात लगाने के लिए छिपने का अर्थ देते हैं; अनुवाद मूल क्रिया और प्रसंगगत आशय दोनों को बचाता है।
- source_word: לְנָקִי
  choice: किसी निर्दोष की ताक में
  rationale: נָקִי विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘किसी निर्दोष’ से अनिश्चित लक्षित व्यक्ति और उसकी नैतिक निर्दोषता दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: חִנָּם
  choice: अकारण
  rationale: यह क्रियाविशेषण किसी उचित कारण या उकसावे के अभाव को बताता है। ‘अकारण’ संक्षिप्त, प्रतिष्ठित और सामान्यतः बोधगम्य है।
theological_decisions:
- issue: लक्षित व्यक्ति का नैतिक चरित्र
  choice: किसी निर्दोष
  alternative: किसी निष्कलंक व्यक्ति
  rationale: पद अन्यायपूर्ण हिंसा की निंदा करते हुए शिकार को निर्दोष बताता है। ‘निर्दोष’ मूल नैतिक बल को बनाए रखता है, पर ऐसी पूर्ण नैतिक निष्पापता का अतिरिक्त दावा नहीं जोड़ता जो इस प्रसंग का आशय नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। संबोधन में अपराधियों का लुभावना, सीधा आमंत्रण दिखाने के लिए ‘हमारे साथ चल!’ रखा गया है। ‘खून के लिए’ मूल की कठोर संक्षिप्तता बचाता है, जबकि ‘किसी निर्दोष की ताक में छिपकर बैठें’ दूसरे हिब्रू क्रियापद के मूल ‘छिपने’ वाले भाव और घात के प्रसंग—दोनों को व्यक्त करता है।
