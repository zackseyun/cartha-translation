base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/024.yaml
  text: Because I called and you refused[a], I stretched out my hand and no one paid attention,
translation:
  language: hi
  text: 'क्योंकि मैंने पुकारा, और तुमने मना कर दिया;

    मैंने अपना हाथ बढ़ाया, और किसी ने ध्यान नहीं दिया[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कोई सुन नहीं रहा था।’ हिब्रू कृदन्त ध्यान से सुनने के अर्थ पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן
  choice: क्योंकि
  rationale: यह आगे आने वाले न्याय-वचन का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके कारणवाचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָרָאתִי
  choice: मैंने पुकारा
  rationale: यहाँ क्रिया ज्ञान द्वारा लोगों को बुलाने की क्रिया बताती है; ‘पुकारा’ आह्वान और ऊँची आवाज़, दोनों की सम्भावना बनाए रखता है।
- source_word: וַתְּמָאֵנוּ
  choice: और तुमने इनकार कर दिया
  rationale: מאנ का सीधा अर्थ मना करना या इनकार करना है। संयोजक वाव को ‘और’ से रखा गया है, जबकि विरोध का भाव प्रसंग से स्पष्ट है।
- source_word: נָטִיתִי יָדִי
  choice: मैंने अपना हाथ बढ़ाया
  rationale: यह मूल पाठ के ठोस शारीरिक संकेत को सुरक्षित रखता है, जो बुलावे, आग्रह या चेतावनी का संकेत हो सकता है।
- source_word: וְאֵין מַקְשִׁיב
  choice: और किसी ने ध्यान नहीं दिया
  rationale: अस्तित्ववाचक निषेध और कृदन्त मिलकर बताते हैं कि ध्यानपूर्वक सुनने वाला कोई नहीं था। यह हिन्दी में सहज है और आज्ञापालन का अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: बढ़ाए हुए हाथ के संकेत का आशय
  choice: अर्थ को ‘अपना हाथ बढ़ाया’ के रूप में खुला रखा गया
  alternative: इसे केवल दया का निमंत्रण या केवल न्याय की चेतावनी बताना
  rationale: हिब्रू संकेत का चित्र देता है, पर इस पंक्ति में उसका एकमात्र आशय निश्चित नहीं करता; इसलिए सम्भावित धार्मिक अर्थों में से किसी एक को अनावश्यक रूप से नहीं चुना गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानान्तर काव्य-पंक्तियाँ और ज्ञान के प्रत्यक्ष संबोधन का बल सुरक्षित है। ‘इनकार कर दिया’ सामान्य हिन्दी में स्पष्ट है, और ‘ध्यान नहीं दिया’ קשב के ध्यानपूर्वक सुनने वाले अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
