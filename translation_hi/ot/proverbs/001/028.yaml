base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/028.yaml
  text: Then they will call on me[a], but I will not answer; they will seek me diligently, but they will not find me.
translation:
  language: hi
  text: तब वे मुझे पुकारेंगे, पर मैं उत्तर नहीं दूँगी; वे बड़े यत्न से मुझे खोजेंगे[a], पर मुझे नहीं पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे भोर ही से मुझे खोजेंगे” अथवा “वे मुझे लगन से खोजेंगे।” हिब्रू क्रिया में भोर में, उत्सुकता से, या लगन से खोजने की अर्थ-छायाएँ हो सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछली चेतावनी के परिणाम का समय बताता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: יִקְרָאֻנְנִי
  choice: वे मुझे पुकारेंगे
  rationale: קרא यहाँ सहायता या प्रत्युत्तर की आशा में किसी को पुकारने के अर्थ में है।
- source_word: וְלֹא אֶעֱנֶה
  choice: पर मैं उत्तर नहीं दूँगी
  rationale: हिब्रू וְ औपचारिक रूप से ‘और’ है, पर प्रसंग में विरोध प्रकट करता है; हिन्दी में ‘पर’ इस तीखे विरोध को स्वाभाविक रूप से व्यक्त करता है। स्त्रीलिंग क्रिया साहित्यिक प्रसंग में बोलती हुई ‘बुद्धि’ के अनुसार है।
- source_word: יְשַׁחֲרֻנְנִי
  choice: वे बड़े यत्न से मुझे खोजेंगे
  rationale: שׁחר के पिएल रूप में भोर से खोजने तथा उत्सुकता या तत्परता से खोजने की अर्थ-छायाएँ संभव हैं। ‘बड़े यत्न से’ यहाँ खोज की तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יִמְצָאֻנְנִי
  choice: पर मुझे नहीं पाएँगे
  rationale: מצא का सीधा अर्थ ‘पाना/खोज लेना’ है; ‘पर’ पुकारने और खोजने के निष्फल परिणाम को स्पष्ट करता है।
theological_decisions:
- issue: प्रसंग में वक्ता की पहचान
  choice: प्रथम पुरुष को बनाए रखते हुए स्त्रीलिंग क्रिया-रूपों द्वारा नीतिवचन 1 में व्यक्तित्व-रूप में बोलती ‘बुद्धि’ का साहित्यिक स्वर सुरक्षित रखा गया है।
  alternative: वक्ता को प्रत्यक्ष रूप से कोई बाद की मसीही या अन्य धर्मवैज्ञानिक पहचान देना।
  rationale: पद अपने तात्कालिक साहित्यिक प्रसंग में बुद्धि के भाषण का भाग है। अनुवाद व्यापक प्रतीकात्मक या धर्मवैज्ञानिक व्याख्याओं का निर्णय किए बिना इसी स्वर को रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बड़े यत्न से’ कुछ औपचारिक होते हुए भी स्पष्ट है और मूल क्रिया की तीव्रता बनाए रखता है।
