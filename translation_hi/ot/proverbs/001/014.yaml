  text: Throw in your lot among us[b][a]; we will all have one purse.
translation:
  language: hi
  text: हमारे साथ अपनी चिट्ठी डाल दे[a]; हम सबकी एक ही थैली होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना भाग हमारे साथ मिला दे।”
    reason: lexical_alternative
  - marker: b
    text: या, “एक ही धन-थैली हम सबकी होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גּוֹרָלְךָ
  choice: अपना चिट्ठा
  rationale: גּוֹרָל मूलतः निर्णय या बाँट के लिए डाली जाने वाली चिट्ठी और उससे मिलने वाले भाग को दर्शाता है। यहाँ चिट्ठा डालना समूह के साथ अपना हिस्सा और भविष्य जोड़ने का रूपक है।
- source_word: תַּפִּיל
  choice: डाल दे
  rationale: נפל के हिफ़ील रूप का मूल अर्थ ‘गिराना’ है, पर גּוֹרָל के साथ इसका स्वाभाविक अर्थ चिट्ठा डालना है। ‘डाल दे’ आमंत्रण की आज्ञार्थक शक्ति बनाए रखता है।
- source_word: בְּתוֹכֵנוּ
  choice: हमारे बीच
  rationale: वाक्यांश का अर्थ ‘हमारे मध्य’ है; आधुनिक हिंदी में ‘हमारे बीच’ स्वाभाविक और स्पष्ट है।
- source_word: כִּיס
  choice: थैली
  rationale: כִּיס धन रखने की छोटी थैली या बटुए को दर्शाता है। प्राचीन सामूहिक धन-संग्रह के संदर्भ में ‘थैली’ उपयुक्त है।
- source_word: אֶחָד
  choice: एक ही
  rationale: אֶחָד का अर्थ ‘एक’ है; ‘ही’ जोड़ने से एक साझा थैली पर दिया गया बल सहज हिंदी में प्रकट होता है।
- source_word: יִהְיֶה לְכֻלָּנוּ
  choice: हम सबकी ... होगी
  rationale: शाब्दिक अर्थ ‘हम सबके लिए होगी’ है। संबंधसूचक रचना साझा स्वामित्व को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
