id: PRO.1.32
reference: Proverbs 1:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י מְשׁוּבַ֣ת פְּתָיִ֣ם תַּֽהַרְגֵ֑/ם וְ/שַׁלְוַ֖ת כְּסִילִ֣ים תְּאַבְּדֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/032.yaml
  text: For the turning away of the simple will kill them[a], and the complacency of fools will destroy them.
translation:
  language: hi
  text: क्योंकि भोले लोगों का भटकाव उन्हें मार डालेगा[a], और मूर्खों का निश्चिंत आत्मसंतोष उन्हें नष्ट कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि भोले लोगों का पथ से हट जाना उन्हें मार डालेगा, और मूर्खों का चैन, सुरक्षा या आत्मसंतोष उन्हें नष्ट कर देगा।”
    reason: מְשׁוּבָה में मुड़ने, पथ से हटने या भटकने का भाव है; שַׁלְוָה चैन, सुरक्षित निश्चिंतता अथवा आत्मसंतुष्ट सहजता का अर्थ दे सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ इब्रानी संयोजक की व्याख्यात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מְשׁוּבַת
  choice: विमुखता
  rationale: यह शब्द मुड़ जाने, भटकने या सही मार्ग से हटने का भाव रखता है। ‘विमुखता’ इस सक्रिय विचलन को व्यक्त करती है और बाद की किसी विशिष्ट धर्मशास्त्रीय शब्दावली को नहीं थोपती।
- source_word: פְּתָיִם
  choice: अनुभवहीनों
  rationale: नीतिवचन में यह उन लोगों को दर्शाता है जो अपरिपक्व, आसानी से बहकने वाले और नैतिक रूप से अभी अनगढ़ हैं। ‘अनुभवहीन’ केवल बौद्धिक कमी का आरोप लगाए बिना इस भाव को व्यक्त करता है।
- source_word: תַּהַרְגֵם
  choice: उन्हें मार डालेगी
  rationale: הרג का सीधा और कठोर अर्थ ‘मार डालना’ है; हिन्दी रूप मूल परिणाम की तीव्रता बनाए रखता है।
- source_word: וְשַׁלְוַת
  choice: और ... आत्मसंतुष्ट निश्चिंतता
  rationale: שַׁלְוָה चैन, सुरक्षित निश्चिंतता या आत्मसंतुष्ट बेफिक्री का संकेत दे सकता है। प्रसंग में ‘आत्मसंतुष्ट निश्चिंतता’ उस झूठे आराम को स्पष्ट करती है जो बुद्धि की चेतावनी को अनसुना करता है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: यह नीतिवचन का मानक शब्द है, जो केवल कम बुद्धि नहीं बल्कि नैतिक रूप से हठी और बुद्धि-विरोधी व्यक्ति को दर्शाता है।
- source_word: תְּאַבְּדֵם
  choice: उन्हें नष्ट कर देगी
  rationale: אבד का यहाँ कारक रूप विनाश या सर्वनाश कराने का अर्थ देता है और पहले चरण के ‘मार डालेगी’ के समानांतर है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘अनुभवहीन’ और ‘मूर्ख’ द्वारा इब्रानी ज्ञान-साहित्य की दो अलग मानवीय श्रेणियाँ सुरक्षित रखी गई हैं।
