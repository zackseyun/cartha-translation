  text: पर तुमने मेरी सारी सलाह को अनदेखा किया[a], और मेरी डाँट स्वीकार करने को तैयार न हुए[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी सारी सलाह की उपेक्षा की” अथवा “मेरी सारी सलाह को ठुकरा दिया।”
    reason: lexical_alternative
  - marker: b
    text: 'या “और मेरी डाँट स्वीकार करने से इनकार किया।” इब्रानी में अनिच्छा पर बल है: “मेरी डाँट स्वीकार करने को इच्छुक न हुए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְרְעוּ
  choice: अनदेखा किया
  rationale: प्रसंग में פרע का अर्थ किसी बात को छोड़ देना या उसकी उपेक्षा करना है। “अनदेखा किया” आधुनिक हिन्दी में जानबूझकर ध्यान न देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל
  choice: सारी
  rationale: एकवचन भाववाचक संज्ञा “सलाह” के साथ כָל का स्वाभाविक हिन्दी रूप “सारी” है।
- source_word: עֲצָתִי
  choice: मेरी सलाह
  rationale: עֵצָה यहाँ बुद्धिमत्तापूर्ण मार्गदर्शन या परामर्श को सूचित करता है। “सलाह” सामान्य पाठक के लिए स्पष्ट और वर्तमान हिन्दी है।
- source_word: וְתוֹכַחְתִּי
  choice: मेरी डाँट
  rationale: תּוֹכַחַת सुधार के उद्देश्य से दी गई फटकार को सूचित करता है। “डाँट” सहज हिन्दी में उस सुधारात्मक तीखेपन को बनाए रखती है।
- source_word: לֹא אֲבִיתֶם
  choice: मानने को तैयार न हुए
  rationale: אָבָה का मूल भाव इच्छुक या सहमत होना है। नकार के साथ यह अनिच्छा व्यक्त करता है; “तैयार न हुए” इस इच्छात्मक पक्ष को सुरक्षित रखता है, और “मानने” से डाँट को स्वीकार करने का संबंध स्पष्ट होता है।
