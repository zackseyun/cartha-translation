  terminology: “सलाह” suitably conveys עֲצָה, and “डाँट” is a readily understood rendering of corrective תּוֹכַחַת. “स्वीकार करने को तैयार न हुए” preserves the unwillingness nuance of אָבָה without overstating it as outright rejection.
