  text: I also will laugh at your calamity[a]; I will mock when your dread comes,
translation:
  language: hi
  text: 'मैं भी तुम्हारी विपत्ति पर हँसूँगी;

    जब तुम्हारा भय[a] आएगा, तब मैं उपहास करूँगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा आतंक,” अथवा “जिससे तुम डरते हो।” इब्रानी शब्द भय या आतंक की अनुभूति और उस भयावह घटना—दोनों के लिए प्रयुक्त हो सकता है जो आती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह शब्द पूर्ववर्ती अस्वीकार के प्रत्युत्तर में जोड़ और बल प्रकट करता है; हिन्दी में “भी” इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּאֵידְכֶם
  choice: तुम्हारी विपत्ति पर
  rationale: אֵיד का अर्थ विपत्ति, विनाशकारी संकट या बरबादी हो सकता है। “विपत्ति” अर्थ की गंभीरता बनाए रखता है, और שׂחק के साथ בְּ को हिन्दी में स्वाभाविक रूप से “पर” कहा गया है।
- source_word: אֶשְׂחָק
  choice: हँसूँगी
  rationale: שׂחק का सीधा अर्थ “हँसना” है। नारीरूप इसलिए रखा गया है क्योंकि इस प्रसंग में बोलने वाली व्यक्तिरूप में प्रस्तुत बुद्धि है।
- source_word: אֶלְעַג
  choice: उपहास करूँगी
  rationale: לעג उपहास या ठट्ठा करने को व्यक्त करता है। “उपहास करूँगी” आधुनिक, गरिमापूर्ण हिन्दी में समानांतर पंक्ति का तीखा भाव बनाए रखता है।
- source_word: בְּבֹא
  choice: जब ... आ पड़ेगा
  rationale: בוא के infinitive construct के साथ בְּ कालवाचक है। “जब ... आ पड़ेगा” आने की घटना और उसके अचानक संकटकारी स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פַחְדְּכֶם
  choice: तुम्हारा आतंक
  rationale: פחד भय या आतंक की अनुभूति और भय उत्पन्न करने वाली आने वाली घटना—दोनों को सूचित कर सकता है। “तुम्हारा आतंक” इस द्विअर्थता को मुख्य पाठ में यथासंभव बनाए रखता है।
theological_decisions:
- issue: व्यक्तिरूप में प्रस्तुत बुद्धि की प्रतिक्रिया का कठोर स्वर
  choice: “हँसूँगी” और “उपहास करूँगी” को सीधे रूप में रखा गया है।
  alternative: भाव को नरम करके “मुस्कराऊँगी” या अर्थ बढ़ाकर “तुम्हारी विपत्ति पर आनन्द मनाऊँगी” कहना।
  rationale: इब्रानी क्रियाएँ स्पष्ट रूप से हँसने और उपहास करने का अर्थ देती हैं। पद के न्यायात्मक चेतावनी-स्वर और उससे उत्पन्न धार्मिक तनाव को न तो नरम किया गया है, न स्रोत से अधिक तीखा।
- issue: वक्ता का व्याकरणिक लिंग
  choice: हिन्दी में स्त्रीलिंग “हँसूँगी” और “करूँगी”।
  alternative: लिंग-अस्पष्ट या पुल्लिंग रूप।
  rationale: इब्रानी प्रथम-पुरुष क्रियाएँ स्वयं लिंग नहीं बतातीं, पर निकटवर्ती साहित्यिक संदर्भ में वक्ता व्यक्तिरूप में प्रस्तुत स्त्रीलिंग “बुद्धि” है; हिन्दी में वक्ता के लिंग के अनुसार क्रियारूप आवश्यक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, स्पष्ट किंतु गरिमापूर्ण रखी गई है। समानांतर काव्यरचना को दो पंक्तियों में बनाए रखा गया है; “तब” हिन्दी में दूसरे खंड का संबंध स्पष्ट करता है, बिना अर्थ बदले।
