source:
  edition: WLC
  text: כָּל ה֣וֹן יָקָ֣ר נִמְצָ֑א נְמַלֵּ֖א בָתֵּ֣י/נוּ שָׁלָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/013.yaml
  text: We will find all precious wealth[b][a]; we will fill our houses with plunder.
translation:
  language: hi
  text: हम सारा बहुमूल्य धन पा लेंगे[a]; हम अपने घरों को लूट के माल से भर लेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कीमती धन’ अथवा ‘मूल्यवान संपत्ति’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द שָׁלָל का अर्थ लूटकर हथियाया गया माल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: सारा
  rationale: परिमाण की व्यापकता और बोलने वालों के डींग भरे दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹן
  choice: धन
  rationale: भौतिक संपत्ति के व्यापक अर्थ को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָקָר
  choice: बहुमूल्य
  rationale: यहाँ धन की बड़ी कीमत या मूल्य को दर्शाता है; ‘कीमती’ भी संभव है।
- source_word: נִמְצָא
  choice: हम ... पा लेंगे
  rationale: מצא के ‘पाना/प्राप्त करना’ अर्थ को इस संदर्भ में व्यक्त करता है, जहाँ अपराधी लूट से धन मिलने का आश्वासन दे रहे हैं।
- source_word: נְמַלֵּא
  choice: हम ... भर लेंगे
  rationale: प्रथम पुरुष बहुवचन की भावी/संकल्पात्मक शक्ति को निमंत्रण के भीतर किए जा रहे आत्मविश्वासी दावे के रूप में रखता है।
- source_word: בָתֵּינוּ
  choice: अपने घरों को
  rationale: בית की ठोस छवि को बनाए रखता है और हिन्दी में कर्ता के अपने घरों के लिए ‘अपने’ स्वाभाविक है।
- source_word: שָׁלָל
  choice: लूट का माल
  rationale: हिंसा या डकैती से हथियाई गई वस्तुओं का अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट रूप से देता है।
