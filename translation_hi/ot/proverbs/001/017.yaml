  text: For the net is spread in vain in the sight of any bird[a].
translation:
  language: hi
  text: क्योंकि किसी भी पक्षी की आँखों के सामने जाल बिछाना व्यर्थ है।[a]
  philosophy: optimal-equivalence
  footnotes:
