    text: शाब्दिक अर्थ, “पंखधारी कोई भी प्राणी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अव्यय पिछले पद की चेतावनी का कारण स्पष्ट करता है; इसलिए यहाँ ‘क्योंकि’ स्वाभाविक और संदर्भानुकूल है।
- source_word: חִנָּם
  choice: व्यर्थ
  rationale: यहाँ शब्द निष्फलता या बेकार होने का भाव देता है; ‘व्यर्थ’ इस सूक्ति के आशय को संक्षेप में व्यक्त करता है।
- source_word: מְזֹרָה
  choice: फैलाना
  rationale: यह זרה का निष्क्रिय कृदन्त रूप है और जाल को बिछाने या फैलाने का संकेत देता है; हिन्दी में जाल के साथ ‘फैलाना’ स्वाभाविक है।
- source_word: הָרָשֶׁת
  choice: जाल
  rationale: רֶשֶׁת शिकार पकड़ने के जाल को दर्शाता है; ‘जाल’ इसका स्पष्ट और सामान्य हिन्दी समतुल्य है।
- source_word: בְּעֵינֵי
  choice: आँखों के सामने
  rationale: इसका शाब्दिक अर्थ ‘आँखों में’ है, पर यहाँ दिखाई देते हुए या प्रत्यक्ष रूप से करने का भाव है; ‘आँखों के सामने’ यह अर्थ सहजता से देता है।
- source_word: כָל
  choice: किसी भी
  rationale: एकवचन सामूहिक अभिव्यक्ति के साथ यह सार्वत्रिक अर्थ देता है; ‘किसी भी पक्षी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּעַל כָּנָף
  choice: पक्षी
  rationale: शाब्दिक रूप से ‘पंख का स्वामी’ एक मुहावरेदार अभिव्यक्ति है, जिसका यहाँ आशय पक्षी से है; मुख्य पाठ में ‘पक्षी’ स्पष्ट और सहज है, जबकि शाब्दिक रूप पादटिप्पणी में रखा गया है।
