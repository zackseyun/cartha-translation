  yaml_path: translation/ot/proverbs/001/005.yaml
  text: Let the wise man hear and increase in learning[b][a], and the discerning man acquire guidance.
translation:
  language: hi
  text: बुद्धिमान सुने और सीख में बढ़े[a], और समझदार मार्गदर्शन प्राप्त करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान सुनेगा और सीख में बढ़ेगा।” इब्रानी के अपूर्ण क्रियारूप वर्णनात्मक भविष्य के रूप में भी पढ़े जा सकते हैं; यहाँ शिक्षापरक संदर्भ के अनुसार उन्हें प्रोत्साहन के रूप में अनूदित किया गया है।
    reason: alternative_reading
  - marker: b
    text: “मार्गदर्शन” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “विवेकपूर्ण सलाह,” “दिशा,” “योजनाएँ,” या अधिक शाब्दिक रूप में “पतवार चलाने की कला” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: सुने
  rationale: यह रूप व्याकरण की दृष्टि से ‘वह सुनेगा/सुनता है’ भी हो सकता है, पर नीतिवचन के आरंभिक शिक्षापरक संदर्भ में प्रोत्साहन या आग्रह के रूप में ‘सुने’ स्वाभाविक है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: इब्रानी में एकवचन पुल्लिंग रूप है। हिन्दी में ‘बुद्धिमान’ उसी प्रतिनिधिक एकवचन को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: וְיֹסֶף
  choice: और ... बढ़ाए
  rationale: मूल क्रिया का अर्थ ‘जोड़ना’ या ‘बढ़ाना’ है। ‘अपनी सीख बढ़ाए’ हिन्दी में सीखते रहने और अर्जित शिक्षा में वृद्धि करने का भाव देता है।
- source_word: לֶקַח
  choice: सीख
  rationale: यह शब्द ग्रहण की गई शिक्षा, उपदेश या विद्या को सूचित कर सकता है। ‘सीख’ सुनने से प्राप्त शिक्षा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: यह ऐसे व्यक्ति को दर्शाता है जिसमें समझ और परख है। ‘समझदार’ आधुनिक हिन्दी में सहज है और इब्रानी के प्रतिनिधिक एकवचन रूप को बनाए रखता है।
- source_word: תַּחְבֻּלוֹת
  choice: मार्गदर्शन
  rationale: इस बहुवचन संज्ञा में कुशल दिशा, विवेकपूर्ण सलाह, योजनाएँ या रूपकतः संचालन का भाव हो सकता है। प्रसंग में ‘मार्गदर्शन’ पर्याप्त व्यापक है और किसी एक सामरिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִקְנֶה
  choice: प्राप्त करे
  rationale: קנה का सामान्य अर्थ पाना, अर्जित करना या प्राप्त करना है। यहाँ ज्ञान-संबंधी संसाधन पाने के लिए ‘प्राप्त करे’ स्वाभाविक है; ‘खरीदे’ इस प्रसंग में अत्यधिक शाब्दिक होगा।
