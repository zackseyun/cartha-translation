source:
  edition: WLC
  text: חָ֭כְמוֹת בַּ/ח֣וּץ תָּרֹ֑נָּה בָּ֝/רְחֹב֗וֹת תִּתֵּ֥ן קוֹלָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/020.yaml
  text: Wisdom cries aloud in the street[a]; in the squares she raises her voice.
translation:
  language: hi
  text: बुद्धि सड़क पर ऊँचे स्वर से पुकारती है[a]; चौकों में वह अपनी आवाज़ बुलंद करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक सरल रूप में, “बुद्धि सड़क पर पुकारती है; चौकों में वह अपनी आवाज़ बुलंद करती है।”
    reason: शब्दार्थ का वैकल्पिक, अधिक सरल रूप
lexical_decisions:
- source_word: חָכְמוֹת
  choice: बुद्धि
  rationale: रूप की दृष्टि से यह बहुवचन है, पर आगे की स्त्रीलिंग एकवचन क्रियाएँ और सर्वनाम-सूचक प्रत्यय दिखाते हैं कि यहाँ इसे मानवीकृत एकवचन भाववाचक संज्ञा के रूप में समझना चाहिए।
- source_word: בַּחוּץ
  choice: सड़क पर
  rationale: यह निजी भीतरी स्थान के विपरीत खुले सार्वजनिक स्थान को दर्शाता है। समानांतर पंक्ति के चौकों के साथ ‘सड़क पर’ स्वाभाविक और स्पष्ट है।
- source_word: תָּרֹנָּה
  choice: ऊँचे स्वर से पुकारती है
  rationale: רנן यहाँ गूँजती हुई जोरदार पुकार व्यक्त करता है। संदर्भ सार्वजनिक आह्वान का है, इसलिए उत्सवी ‘गाती है’ की अपेक्षा यह अर्थ अधिक उपयुक्त है।
- source_word: בָּרְחֹבוֹת
  choice: चौकों में
  rationale: यह नगर के चौड़े खुले सार्वजनिक स्थानों या चौकों को दर्शाता है और पहली पंक्ति के सार्वजनिक परिवेश को आगे बढ़ाता है।
- source_word: תִּתֵּן קוֹלָהּ
  choice: अपनी आवाज़ बुलंद करती है
  rationale: शाब्दिक अर्थ ‘अपनी आवाज़ देती है’ है, पर आधुनिक हिन्दी में वह अस्वाभाविक होगा। ‘आवाज़ बुलंद करती है’ जोर से सार्वजनिक रूप से बोलने का भाव स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: ‘बुद्धि’ को स्त्रीलिंग एकवचन पात्र के रूप में बनाए रखा गया है।
  alternative: इसे केवल अमूर्त गुण की तरह प्रस्तुत करना, जिससे मानवीकरण धुँधला पड़ जाए।
  rationale: स्त्रीलिंग एकवचन क्रियाएँ और प्रत्यय बुद्धि को सार्वजनिक रूप से पुकारने वाली साहित्यिक पात्र के रूप में प्रस्तुत करते हैं। पाठ से परे किसी बाद की सिद्धान्तगत पहचान को इसमें नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘बुद्धि’ का स्त्रीलिंग मानवीकरण स्पष्ट रखा गया है; सार्वजनिक स्थानों की समानांतर छवि और जोरदार पुकार दोनों संरक्षित हैं।
