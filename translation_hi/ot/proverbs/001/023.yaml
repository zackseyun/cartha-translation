  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תָּשׁ֗וּבוּ לְֽ/ת֫וֹכַחְתִּ֥/י הִנֵּ֤ה אַבִּ֣יעָה לָ/כֶ֣ם רוּחִ֑/י אוֹדִ֖יעָה דְבָרַ֣/י אֶתְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/023.yaml
  text: Turn at my rebuke[a]; behold, I will pour out my spirit to you[b]; I will make my words known to you.
translation:
  language: hi
  text: मेरी फटकार पर लौट आओ[a]; देखो, मैं तुम पर अपनी आत्मा उँडेलूँगी[b]; मैं अपने वचन तुम्हें बताऊँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी डाँट पर लौट आओ” अथवा “मेरी फटकार के उत्तर में अपना मार्ग बदलो।”
    reason: lexical_alternative
  - marker: b
    text: “अपनी आत्मा” का अर्थ “अपने मन की बात” या “अपना भीतरी भाव” भी हो सकता है। कुछ पाठक इसमें परमेश्वर की आत्मा की व्यापक बाइबिलीय प्रतिध्वनि देखते हैं, यद्यपि इस पद में बोलने वाली व्यक्तिरूप बुद्धि है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשׁוּבוּ
  choice: लौट आओ
  rationale: שׁוב दिशा या चाल बदलकर लौटने का आह्वान करता है। यह नैतिक प्रत्युत्तर का भाव रखता है, पर ‘पश्चाताप करो’ जितना विशिष्ट धर्मशास्त्रीय अर्थ आरोपित नहीं करता।
- source_word: לְתוֹכַחְתִּי
  choice: मेरी डाँट सुनकर
  rationale: תּוֹכַחַת का अर्थ डाँट, उलाहना या सुधार है। לְ यहाँ उस डाँट के प्रत्युत्तर में लौटने का भाव देता है; ‘सुनकर’ हिंदी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आगे कही जाने वाली बात की ओर ध्यान खींचने वाला अव्यय है। ‘देखो’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: אַבִּיעָה
  choice: उँडेलूँगी
  rationale: נבע में उमड़ने, फूट निकलने या बहा देने का बिंब है। ‘उँडेलूँगी’ आत्मा के प्रचुर प्रकटीकरण की सजीव छवि बनाए रखता है।
- source_word: רוּחִי
  choice: अपनी आत्मा
  rationale: רוּחַ का अर्थ आत्मा, श्वास या आंतरिक भाव हो सकता है। यहाँ व्यक्तिरूप बुद्धि अपनी भीतरी चेतना या भाव प्रकट करती है; ‘आत्मा’ मूल की व्यापकता और संभावित धर्मवैधानिक प्रतिध्वनि को सुरक्षित रखता है।
- source_word: אוֹדִיעָה
  choice: बताऊँगी
  rationale: ידע के हिफ़ील रूप का अर्थ ‘जानने योग्य बनाना’ है। ‘बताऊँगी’ साधारण आधुनिक हिंदी में सीधा और स्वाभाविक रूप है।
- source_word: דְבָרַי
  choice: अपने वचन
  rationale: דְבָרַי का अर्थ ‘मेरे शब्द/वचन’ है। ज्ञान-साहित्य के गरिमापूर्ण शिक्षापरक संदर्भ में ‘वचन’ उपयुक्त है।
- source_word: לָכֶם ... אֶתְכֶם
  choice: तुम पर ... तुम्हें
  rationale: पहला पद लाभार्थी या लक्ष्य को और दूसरा संबोधित लोगों को दर्शाता है। ‘तुम पर’ उँडेलने के बिंब के साथ स्वाभाविक है, जबकि ‘तुम्हें’ ज्ञान कराने के साथ सहज है।
theological_decisions:
- issue: व्यक्तिरूप बुद्धि के कथन में ‘मेरी आत्मा’ का अर्थ
  choice: ‘अपनी आत्मा’—व्यक्तिरूप बुद्धि की अपनी आत्मा, भीतरी चेतना या भाव
  alternative: इसे परमेश्वर के आत्मा अथवा पवित्र आत्मा का पूर्वसंकेत समझना
  rationale: तात्कालिक साहित्यिक संदर्भ में वक्ता व्यक्तिरूप बुद्धि है और इब्रानी पाठ यहाँ स्पष्ट रूप से ‘परमेश्वर का आत्मा’ नहीं कहता। इसलिए अनावश्यक सिद्धान्तगत पहचान आरोपित किए बिना ‘आत्मा’ रखा गया है; टिप्पणी व्यापक धर्मवैधानिक प्रतिध्वनि की संभावना खुली रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण ज्ञान-साहित्यिक शैली रखी गई है। वक्ता ‘बुद्धि’ (स्त्रीलिंग) होने के कारण भविष्यकालीन क्रियाएँ ‘उँडेलूँगी’ और ‘बताऊँगी’ स्त्रीलिंग में हैं।
