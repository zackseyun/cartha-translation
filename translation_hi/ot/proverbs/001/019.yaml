source:
  edition: WLC
  text: כֵּ֗ן אָ֭רְחוֹת כָּל בֹּ֣צֵֽעַ בָּ֑צַע אֶת נֶ֖פֶשׁ בְּעָלָ֣י/ו יִקָּֽח־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/019.yaml
  text: Such are the paths of everyone who gains unjust profit[a]; it takes away the life of its possessors.
translation:
  language: hi
  text: अनुचित लाभ पानेवाले सभी लोगों की राहें ऐसी ही होती हैं[a]; वह लाभ उसे पानेवालों का जीवन ले लेता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाभ के लोभी सभी लोगों की राहें ऐसी ही होती हैं; वह लाभ उसे पानेवालों का जीवन ले लेता है।”
    reason: בֹּצֵעַ בָּצַע का अर्थ अनुचित लाभ पानेवाला या लाभ का लोभी हो सकता है।
lexical_decisions:
- source_word: כֵּן
  choice: ऐसे ही होते हैं
  rationale: यह पिछले वर्णन का सार प्रस्तुत करनेवाली तुलना है; ‘ऐसे ही’ उसके संकेतात्मक और निष्कर्षात्मक बल को बनाए रखता है।
- source_word: אָרְחוֹת
  choice: मार्ग
  rationale: यह ज्ञान-साहित्य में आचरण और जीवन-शैली के लिए प्रयुक्त ठोस ‘मार्ग’ रूपक को बनाए रखता है।
- source_word: כָּל
  choice: हर व्यक्ति
  rationale: अगले कृदंत के साथ इसका अर्थ व्यक्तियों पर लागू होनेवाला सार्वभौमिक कथन है।
- source_word: בֹּצֵעַ בָּצַע
  choice: अनुचित लाभ कमानेवाले
  rationale: एक ही मूल से बने कृदंत और संज्ञा का यह मेल लाभ की लोभी तथा संदर्भतः अन्यायपूर्ण प्राप्ति दर्शाता है। ‘अनुचित लाभ’ नैतिक दोष को स्पष्ट करता है, जबकि पादटिप्पणी ‘लाभ के लोभी’ वाला संभावित अर्थ सुरक्षित रखती है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: यहाँ आशय अमूर्त ‘आत्मा’ से अधिक व्यक्ति के प्राण या जीवन से है; लालच अंततः लालची का जीवन नष्ट करता है।
- source_word: בְּעָלָיו
  choice: अपने मालिकों
  rationale: बहुवचन प्रत्यय उन लोगों को सूचित करता है जिनके पास वह लाभ है। ‘मालिकों’ से मूल का स्वामित्व-संबंध संक्षेप में बना रहता है।
- source_word: יִקָּח
  choice: छीन लेता है
  rationale: संदर्भ में साधारण ‘लेना’ विनाशकारी परिणाम बताता है; ‘छीन लेता है’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विनाशकारी कर्ता और בֹּצֵעַ בָּצַע का अर्थ
  choice: मुख्य पाठ में ‘अनुचित लाभ’ को जीवन छीननेवाला माना गया है।
  alternative: इसे ‘लाभ का लोभ’ मानकर लोभ को जीवन छीननेवाला समझा जा सकता है।
  rationale: इब्रानी व्याकरण लाभ/कमाई को निकटतम पूर्वपद के रूप में लेने देता है, पर मूल पदावली लालची प्रवृत्ति का अर्थ भी दे सकती है। पादटिप्पणी दोनों अर्थों के बीच की वास्तविक अस्पष्टता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग’ ज्ञान-साहित्य का पारंपरिक रूपक बनाए रखता है, जबकि ‘अनुचित लाभ’ और ‘जीवन छीन लेता है’ सामान्य पाठक के लिए अर्थ स्पष्ट करते हैं।
