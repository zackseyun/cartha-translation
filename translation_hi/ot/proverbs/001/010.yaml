id: PRO.1.10
reference: Proverbs 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּנִ֡/י אִם יְפַתּ֥וּ/ךָ חַ֝טָּאִ֗ים אַל תֹּבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/010.yaml
  text: My son[a], if sinners entice you[b], do not consent.
translation:
  language: hi
  text: मेरे बेटे[a], यदि पापी तुम्हें बहकाएँ, तो उनकी बात मत मानना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे बेटे” इब्रानी के पुल्लिंग एकवचन रूप को सुरक्षित रखता है; यह पिता या ज्ञान-शिक्षक का आत्मीय संबोधन है।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: “सहमत मत होना” या “राज़ी मत होना।” इब्रानी क्रिया इच्छुक होने अथवा सहमति देने को दर्शाती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: इब्रानी में पुल्लिंग एकवचन संबोधन है; पिता या ज्ञान-शिक्षक की आत्मीय पुकार को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: אִם
  choice: यदि
  rationale: यह संभावित परिस्थिति प्रस्तुत करने वाला सामान्य शर्तसूचक अव्यय है।
- source_word: יְפַתּוּךָ
  choice: तुम्हें बहकाएँ
  rationale: पिएल रूप यहाँ किसी गलत काम के लिए लुभाने या फुसलाने का भाव देता है; ‘बहकाएँ’ आधुनिक हिन्दी में उसके नकारात्मक और छलपूर्ण आशय को सहजता से व्यक्त करता है।
- source_word: חַטָּאִים
  choice: पापी
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन है, जिसका सीधा अर्थ पाप करने वाले लोग है।
- source_word: אַל־תֹּבֵא
  choice: उनकी बात मत मानना
  rationale: אבה का अर्थ इच्छुक होना या सहमति देना है। प्रसंग में ‘उनकी बात मत मानना’ निमंत्रण को स्वीकार न करने का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
