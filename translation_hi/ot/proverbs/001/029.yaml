source:
  edition: WLC
  text: תַּ֭חַת כִּי שָׂ֣נְאוּ דָ֑עַת וְ/יִרְאַ֥ת יְ֝הֹוָ֗ה לֹ֣א בָחָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/029.yaml
  text: Because they hated knowledge and did not choose the fear of Yahweh[b][a],
translation:
  language: hi
  text: क्योंकि उन्होंने ज्ञान से घृणा की और यहोवा का भय मानने को नहीं चुना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा का भय’ बुद्धि-साहित्य की एक प्रमुख अभिव्यक्ति है; इसमें केवल आतंक नहीं, बल्कि श्रद्धापूर्ण विस्मय भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת כִּי
  choice: क्योंकि
  rationale: यह पद आसपास वर्णित न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस कारणसूचक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שָׂנְאוּ
  choice: उन्होंने ... से घृणा की
  rationale: मूल क्रिया का सामान्य और प्रबल अर्थ ‘घृणा करना’ है; इसे ‘ठुकराया’ कहने से मूल की भावात्मक तीव्रता घट जाती।
- source_word: דָעַת
  choice: ज्ञान
  rationale: नीतिवचन में यह शब्द नैतिक और बुद्धि-संबंधी ज्ञान को सूचित करता है; ‘ज्ञान’ इसका सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: יִרְאַת יְהוָה
  choice: यहोवा का भय मानना
  rationale: यह बुद्धि-साहित्य की प्रमुख अभिव्यक्ति है। ‘भय मानना’ श्रद्धापूर्ण विस्मय और परमेश्वर के प्रति गंभीर नैतिक उत्तरदायित्व—दोनों के तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; हिन्दी में प्रचलित नामरूप ‘यहोवा’ शीर्षक ‘प्रभु’ के स्थान पर उस नाम को स्पष्ट रखता है।
- source_word: לֹא בָחָרוּ
  choice: नहीं चुना
  rationale: यह मूल क्रिया ‘चुनना’ के इच्छापरक अर्थ को सीधे सुरक्षित रखता है; ‘इनकार किया’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ सीधे चतुरक्षरीय ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और इसे केवल उपाधि में नहीं बदलता।
- issue: יִרְאַת יְהוָה का अर्थ-क्षेत्र
  choice: यहोवा का भय मानना
  alternative: यहोवा के प्रति श्रद्धा रखना
  rationale: केवल ‘श्रद्धा’ मूल ‘भय’ के गंभीर पक्ष को कम कर सकती है। चुना हुआ रूप श्रद्धापूर्ण विस्मय, अधीनता और उचित भय की व्यापकता को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ज्ञान से घृणा’ की प्रबलता और ‘नहीं चुना’ की इच्छापरकता को बिना नरम किए सुरक्षित रखा गया है।
