reference: Proverbs 1:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שֹׁמֵ֣עַֽ לִ֭/י יִשְׁכָּן בֶּ֑טַח וְ֝/שַׁאֲנַ֗ן מִ/פַּ֥חַד רָעָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/033.yaml
  text: But whoever listens to me will dwell securely and be at ease[a], without fear of disaster.
translation:
  language: hi
  text: पर जो मेरी सुनता है, वह सुरक्षित बसेगा और विपत्ति के भय से मुक्त होकर निश्चिंत रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֹׁמֵעַ לִי
  choice: पर जो मेरी सुनता है
  rationale: שׁמע यहाँ केवल सुनाई पड़ने के बजाय ध्यान देकर मानने की निरंतर प्रवृत्ति बताता है। पिछले पदों से विरोध के कारण וְ को स्वाभाविक हिन्दी में ‘पर’ किया गया है; ‘मेरी सुनता है’ सामान्य हिन्दी मुहावरा है।
- source_word: יִשְׁכָּן
  choice: बसेगा
  rationale: यह क्रिया रहने या टिककर निवास करने का भाव रखती है; ‘बसेगा’ इसे संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: בֶּטַח
  choice: निडर होकर
  rationale: בֶּטַח सुरक्षा और आश्वस्तता का भाव देता है। अगले वाक्यांश में भय का स्पष्ट उल्लेख होने के बावजूद ‘निडर होकर’ हिन्दी में सुरक्षित निवास की अनुभूति सहजता से व्यक्त करता है।
- source_word: וְשַׁאֲנַן
  choice: चैन में रहेगा
  rationale: यहाँ शब्द शांत, निर्विघ्न और आश्वस्त अवस्था सूचित करता है। सकारात्मक प्रसंग में ‘चैन में रहेगा’ उपेक्षापूर्ण निश्चिंतता का नकारात्मक अर्थ जोड़े बिना भाव प्रकट करता है।
- source_word: מִפַּחַד רָעָה
  choice: विपत्ति के भय से मुक्त
  rationale: מִן अलगाव या मुक्ति का भाव देता है, פַּחַד भय/दहशत का, और רָעָה यहाँ नैतिक बुराई से अधिक आने वाली हानि या विपत्ति को दर्शाता है।
theological_decisions:
- issue: पुल्लिंग एकवचन कृदंत का प्रतिनिधिक अर्थ
  choice: जो मेरी सुनता है
  alternative: वह पुरुष जो मेरी सुनता है
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर ज्ञान-साहित्य में सामान्य व्यक्ति का प्रतिनिधित्व करता है। हिन्दी का ‘जो’ इस व्यापक प्रयोग को बनाए रखता है।
- issue: मानवीकृत बुद्धि का प्रथम-पुरुष कथन
  choice: ‘मेरी’ को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: जो मुझ बुद्धि की सुनता है
  rationale: आसपास के संदर्भ में बुद्धि स्वयं बोल रही है। मूल के प्रथम पुरुष को बनाए रखना उचित है; वक्ता की पहचान को मुख्य पाठ में जोड़ना अनावश्यक व्याख्या होगी।
- issue: प्रतिज्ञा में सुरक्षा का स्वरूप
  choice: निडर निवास और विपत्ति के भय से मुक्ति
  alternative: हर विपत्ति से पूर्ण संरक्षण
  rationale: मूल पाठ सुरक्षित और शांत रहने तथा भय से मुक्ति की बात करता है; यह स्पष्ट रूप से नहीं कहता कि सुनने वाले पर कोई विपत्ति कभी आएगी ही नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मेरी सुनता है’, ‘बसेगा’ और ‘चैन में रहेगा’ बोलचाल की स्वाभाविकता तथा काव्यात्मक संक्षिप्तता के बीच संतुलन रखते हैं।
