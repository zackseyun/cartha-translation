lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह בן के प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय सहित संबोधन का स्वाभाविक हिन्दी रूप है और नीतिवचन के पिता-पुत्र शिक्षण-परिवेश तथा पुल्लिंग एकवचन को बनाए रखता है।
- source_word: אַל תֵּלֵךְ
  choice: मत चल
  rationale: אַל निषेध व्यक्त करता है और הלך का अर्थ चलना या जाना है। ‘मत चल’ आज्ञार्थक निषेध के साथ शाब्दिक तथा आचरण-संबंधी दोनों अर्थों को सम्भव रखता है।
- source_word: בְּדֶרֶךְ אִתָּם
  choice: उनके साथ उनकी राह पर
  rationale: דרך वास्तविक मार्ग और जीवन-आचरण, दोनों को सूचित कर सकता है। हिन्दी में ‘राह पर चलना’ यह द्विअर्थी चित्र स्वाभाविक रूप से बनाए रखता है; ‘उनके साथ’ אִתָּם को स्पष्ट करता है।
- source_word: מְנַע רַגְלְךָ
  choice: अपना पाँव ... पड़ने से रोक
  rationale: מנע का imperative सक्रिय रोक या संयम की मांग करता है। ‘पाँव पड़ने से रोक’ हिन्दी में स्वाभाविक है और एकवचन רגל को भी सुरक्षित रखता है।
- source_word: מִנְּתִיבָתָם
  choice: उनके पथ पर
  rationale: נתיבה पगडंडी, मार्ग या पथ को सूचित करता है। ‘पथ’ पहले आए דרך के लिए प्रयुक्त ‘राह’ से काव्यात्मक समानांतरता और शब्दगत भिन्नता दोनों रखता है। מן का अलगावार्थ पूरे वाक्यांश ‘पड़ने से रोक’ में व्यक्त है।
