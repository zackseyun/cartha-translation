source:
  edition: WLC
  text: עַד מָתַ֣י פְּתָיִם֮ תְּֽאֵהֲב֫וּ פֶ֥תִי וְ/לֵצִ֗ים לָ֭צוֹן חָמְד֣וּ לָ/הֶ֑ם וּ֝/כְסִילִ֗ים יִשְׂנְאוּ דָֽעַת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/022.yaml
  text: How long[a], O simple ones[b], will you love simplicity? How long will scoffers delight in scoffing and fools hate knowledge?
translation:
  language: hi
  text: “हे भोले लोगो, तुम कब तक भोलेपन से प्रेम करते रहोगे? उपहास करनेवाले कब तक उपहास में आनंद लेंगे, और मूर्ख लोग कब तक ज्ञान से घृणा करेंगे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּתָיִם / פֶתִי
  choice: भोले लोगो / भोलेपन
  rationale: यह जोड़ी हिब्रू की समान मूल वाले शब्दों की शब्द-क्रीड़ा को स्वाभाविक हिन्दी में बनाए रखती है। यहाँ ‘भोले’ से आशय केवल कम बुद्धि वाले नहीं, बल्कि अनुभवहीन और आसानी से बहकने वाले लोगों से है।
- source_word: תְּאֵהֲבוּ
  choice: प्रेम करते रहोगे
  rationale: अपूर्ण क्रिया के जारी रहने वाले भाव और फटकार भरे ‘कब तक’ को स्पष्ट करता है।
- source_word: לֵצִים / לָצוֹן
  choice: ठट्ठा करनेवाले / ठट्ठा करने
  rationale: समान शब्दावली स्रोत के संज्ञा-सम्बन्ध को बचाती है और नीतिवचन में घमण्ड से उपहास करने वाले नैतिक वर्ग को व्यक्त करती है।
- source_word: חָמְדוּ
  choice: आनन्द लेंगे
  rationale: इस प्रसंग में क्रिया उपहास की इच्छा रखने और उसमें सुख पाने का भाव देती है; ‘आनन्द लेना’ सहज हिन्दी है।
- source_word: כְסִילִים
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल बौद्धिक कमी नहीं, बल्कि ज्ञान और सुधार को ठुकराने वाले नैतिक चरित्र का वर्ग है।
- source_word: יִשְׂנְאוּ
  choice: घृणा करेंगे
  rationale: मूल क्रिया की तीव्रता को कम किए बिना सुरक्षित रखता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: यह प्रत्यक्ष और नीतिवचन की प्रमुख शब्दावली के अनुरूप अनुवाद है।
theological_decisions:
- issue: नीतिवचन के नैतिक-आत्मिक चरित्र-वर्ग
  choice: ‘भोले लोग,’ ‘ठट्ठा करनेवाले,’ और ‘मूर्ख’ जैसे अलग-अलग वर्ग बनाए रखे गए हैं।
  alternative: अनुभवहीन लोग, उपहास करने वाले और नासमझ लोग
  rationale: मूल पाठ इन शब्दों से बार-बार आने वाले नैतिक प्रकारों को पहचानता है; इन्हें सामान्य मनोवैज्ञानिक विशेषताओं में बदलना अर्थ को सपाट कर देता।
- issue: दूसरी और तीसरी पंक्ति में प्रश्न की व्याप्ति
  choice: हर समानान्तर खण्ड में ‘कब तक’ दोहराया गया है।
  alternative: केवल आरम्भ में ‘कब तक’ रखकर शेष क्रियाओं को उससे व्याकरणिक रूप से जोड़ना
  rationale: हिब्रू में प्रश्नसूचक पद आरम्भ में है और आगे के समानान्तर खण्डों पर भी लागू होता है। हिन्दी में दोहराव इस व्याप्ति को स्पष्ट करता है, बिना अर्थ बढ़ाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, मौखिक फटकार वाला रूप। ‘हे’ सम्बोधन की काव्यात्मकता और सार्वजनिक पुकार को व्यक्त करता है। ‘भोले/भोलेपन’ से मूल शब्द-क्रीड़ा बचती है; ‘ठट्ठा’ उपहास के अभ्यस्त और उद्दण्ड भाव को प्रकट करता है।
