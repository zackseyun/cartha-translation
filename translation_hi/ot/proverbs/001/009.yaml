    text: या, ‘तुम्हारे गले के लिए जंजीरें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में माता-पिता की शिक्षा सुनने के आग्रह का कारण बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: לִוְיַת חֵן
  choice: शोभायमान माला
  rationale: לִוְיַת सिर पर लपेटी या रखी जाने वाली माला का बोध कराता है और חֵן यहाँ उसकी मनोहरता या शोभा बताता है। यह अनुवाद धार्मिक अर्थ में ‘अनुग्रह’ थोपे बिना अलंकार की सुंदरता व्यक्त करता है।
- source_word: הֵם
  choice: वे ... हैं
  rationale: ‘वे’ पिछले पद की पिता की शिक्षा और माता की सीख की ओर संकेत करता है; हिन्दी में स्वाभाविक नामवाचक वाक्य के लिए ‘हैं’ रखा गया है।
- source_word: לְרֹאשֶׁךָ
  choice: तुम्हारे सिर के लिए
  rationale: לְ संबंध अथवा अलंकरण सूचित करता है; ‘सिर के लिए’ मूल संरचना के निकट और हिन्दी में सुबोध है।
- source_word: וַעֲנָקִים
  choice: और ... हार
  rationale: बहुवचन עֲנָקִים गले के आभूषणों या जंजीरों को सूचित कर सकता है। हिन्दी में ‘हार’ सामूहिक अर्थ में स्वाभाविक है, जबकि वैकल्पिक ‘जंजीरें’ पादटिप्पणी में सुरक्षित है।
- source_word: לְגַרְגְּרֹתֶיךָ
  choice: तुम्हारे गले के लिए
  rationale: शब्द शाब्दिक रूप से गले/कंठ के क्षेत्र को दर्शाता है; आभूषण के संदर्भ में ‘गला’ आधुनिक हिन्दी का स्वाभाविक शब्द है।
