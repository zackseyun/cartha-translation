  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उनके पैर दौड़ते हैं’ का इब्रानी काव्य-बिंब सुरक्षित है; ‘बुराई की ओर’ मूल की संक्षिप्त अस्पष्टता बनाए रखता है, जबकि अधिक क्रियात्मक अर्थ पाद-टिप्पणी में दिया गया है।
