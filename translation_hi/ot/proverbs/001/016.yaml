  text: For their feet run to evil[b][a], and they hurry to shed blood.
translation:
  language: hi
  text: क्योंकि उनके पैर बुराई की ओर दौड़ते हैं[a], और वे खून बहाने में जल्दी करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुराई करने को दौड़ते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई चेतावनी का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिंदी में स्पष्ट रखता है।
- source_word: רַגְלֵיהֶם
  choice: उनके पैर
  rationale: शरीर-अंग का मूल बिंब बनाए रखता है, जो उनकी तत्परता को गति के रूप में चित्रित करता है।
- source_word: לָרַע
  choice: बुराई की ओर
  rationale: इब्रानी पूर्वसर्ग और संज्ञा के संक्षिप्त, दिशासूचक भाव को बनाए रखता है; ‘बुराई करने के लिए’ संभावित पर अधिक व्याख्यात्मक है।
- source_word: יָרוּצוּ
  choice: दौड़ते हैं
  rationale: मूल क्रिया के शारीरिक दौड़ने के बिंब और उससे व्यक्त शीघ्रता, दोनों को सुरक्षित रखता है।
- source_word: וִימַהֲרוּ
  choice: और वे … उतावले होते हैं
  rationale: आधुनिक स्वाभाविक हिंदी में जल्द करने और तत्पर होने का भाव व्यक्त करता है, तथा पहली पंक्ति की तीव्रता को आगे बढ़ाता है।
- source_word: לִשְׁפָּךְ דָּם
  choice: खून बहाने के लिए
  rationale: इब्रानी मुहावरे का स्वाभाविक और सामान्य हिंदी रूप है; हिंसक रक्तपात का अर्थ सुरक्षित रहता है।
