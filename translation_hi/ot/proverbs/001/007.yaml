base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/007.yaml
  text: The fear of Yahweh is the beginning of knowledge[b][a]; fools despise wisdom and discipline.
translation:
  language: hi
  text: याहवे का भय मानना[a] ज्ञान का आरम्भ है; मूर्ख बुद्धि और अनुशासन[b] को तुच्छ जानते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के प्रति श्रद्धा” अथवा “याहवे के प्रति विस्मय।” इब्रानी अभिव्यक्ति में परमेश्वर के सामने श्रद्धा, विस्मय और अधीनता से भरा भय सम्मिलित है।
    reason: lexical_alternative
  - marker: b
    text: या “शिक्षा” अथवा “सुधार।” इब्रानी शब्द ऐसे प्रशिक्षण को भी समेटता है जिसमें सुधार या ताड़ना हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: भय मानना
  rationale: यह पद केवल डर की भावना नहीं, बल्कि परमेश्वर के प्रति श्रद्धा, विस्मय और अधीनता से भरे भय को व्यक्त करता है। ‘भय मानना’ हिन्दी में इसकी नैतिक और संबंधपरक शक्ति बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम के लिप्यंतरण को सुरक्षित रखता है, उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: רֵאשִׁית
  choice: आरम्भ
  rationale: यह ज्ञान के प्रारम्भिक बिंदु और आधारभूत सिद्धान्त—दोनों सम्भावित अर्थों को खुला रखता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: नीतिवचन के ज्ञान-साहित्यिक सन्दर्भ में मूल संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: हिन्दी बाइबलीय और सामान्य प्रयोग में यह विवेकपूर्ण, कुशल जीवन-ज्ञान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: यह शब्द शिक्षा-प्रशिक्षण के साथ सुधार और ताड़ना के आयाम को भी समेटता है।
- source_word: אֱוִילִים
  choice: मूर्ख
  rationale: यह केवल बौद्धिक कमी नहीं, बल्कि नीतिवचन में वर्णित नैतिक हठ और अविवेक की श्रेणी को व्यक्त करता है।
- source_word: בָּזוּ
  choice: तुच्छ जानते हैं
  rationale: यह मूल क्रिया के अवमानना और जानबूझकर ठुकराने के प्रबल भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘याहवे का भय’ का ज्ञान-साहित्यिक अर्थ
  choice: मुख्य पाठ में ‘याहवे का भय मानना’ रखा गया है।
  alternative: ‘याहवे के प्रति श्रद्धा’ या ‘याहवे का विस्मय’
  rationale: मूल अभिव्यक्ति श्रद्धा, विस्मय और आज्ञाकारी भय को एक साथ रखती है; केवल ‘श्रद्धा’ या ‘विस्मय’ कहना इसके नैतिक भार को सीमित कर देगा।
- issue: רֵאשִׁית और ज्ञान का सम्बन्ध
  choice: ‘ज्ञान का आरम्भ’
  alternative: ‘ज्ञान का मूल सिद्धान्त’ या ‘ज्ञान का प्रधान भाग’
  rationale: ‘आरम्भ’ प्रारम्भिक बिंदु और आधार—दोनों निहितार्थों की सम्भावना सुरक्षित रखता है, बिना किसी एक व्याख्या को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण लोकोक्ति-शैली रखी गई है। ‘भय मानना’ सामान्य पाठक के लिए स्वाभाविक है और मूल के व्यापक धार्मिक अर्थ को बनाए रखता है; ‘तुच्छ जानते हैं’ अवमानना का सशक्त किन्तु सुबोध रूप है।
