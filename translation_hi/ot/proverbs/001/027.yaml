base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/027.yaml
  text: when your dread comes like a storm[a], and your calamity arrives like a whirlwind, when distress and anguish come upon you.
translation:
  language: hi
  text: जब तुम्हारा भय विनाशकारी तूफ़ान की तरह आएगा[a], और तुम्हारी विपत्ति बवंडर की तरह आ पहुँचेगी, जब संकट और घोर व्याकुलता तुम पर आ पड़ेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उजाड़ की तरह”; इब्रानी शब्द प्रचंड तूफ़ान जैसी टूट पड़ने वाली शक्ति के साथ-साथ विनाश या उजाड़ पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹא
  choice: जब ... आएगा
  rationale: ב के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है; आधुनिक हिन्दी में ‘जब ... आएगा’ इसका स्वाभाविक और निकट समतुल्य है।
- source_word: כְשָׁאוָה
  choice: विनाशकारी तूफ़ान की तरह
  rationale: שָׁאוָה में उजाड़ या विनाश के साथ प्रचंड, टूट पड़ने वाली घटना का भाव है। ‘विनाशकारी तूफ़ान’ निकटवर्ती बवंडर-बिंब के साथ काव्यात्मक समानांतरता रखते हुए विनाश का अर्थ भी व्यक्त करता है।
- source_word: פַּחְדְּכֶם
  choice: तुम्हारा भय
  rationale: פַּחַד भय अथवा भय उत्पन्न करने वाली बात, दोनों का संकेत कर सकता है। ‘तुम्हारा भय’ स्रोत की इसी संक्षिप्त अर्थगत अस्पष्टता को बनाए रखता है।
- source_word: וְאֵידְכֶם
  choice: और तुम्हारी विपत्ति
  rationale: אֵיד आकस्मिक आपदा या विपत्ति को दर्शाता है; ‘विपत्ति’ गरिमापूर्ण, प्रचलित और काव्य-संदर्भ के अनुकूल है।
- source_word: כְּסוּפָה
  choice: बवंडर की तरह
  rationale: סוּפָה प्रचंड आँधी या चक्राकार तूफ़ान को सूचित करता है; ‘बवंडर’ उसकी तीव्रता और आकस्मिकता को सजीव रखता है।
- source_word: יֶאֱתֶה
  choice: आ पहुँचेगी
  rationale: यह क्रिया आने या पहुँचने का अर्थ देती है। ‘आ पहुँचेगी’ विपत्ति के अचानक उपस्थित हो जाने का भाव सहज हिन्दी में व्यक्त करता है।
- source_word: עֲלֵיכֶם
  choice: तुम पर
  rationale: विपत्ति के किसी व्यक्ति पर आ पड़ने के प्रसंग में עַל का स्वाभाविक हिन्दी रूप ‘तुम पर’ है।
- source_word: צָרָה
  choice: संकट
  rationale: צָרָה कठिनाई, तंगी या संकट को व्यक्त करता है; ‘संकट’ सामान्य पाठक के लिए स्पष्ट है और अगले समानांतर शब्द से पर्याप्त भिन्नता रखता है।
- source_word: וְצוּקָה
  choice: और घोर व्याकुलता
  rationale: צוּקָה दबाव, घिर जाने की दशा और उससे उपजी तीव्र व्यथा को दर्शाता है। ‘घोर व्याकुलता’ इस भाव को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करती है।
