source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י מוּסַ֣ר אָבִ֑י/ךָ וְ/אַל תִּ֝טֹּ֗שׁ תּוֹרַ֥ת אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/008.yaml
  text: Hear[a], my son, your father's instruction[b], and do not forsake your mother's teaching.
translation:
  language: hi
  text: मेरे पुत्र, अपने पिता की शिक्षा[a] सुन, और अपनी माता की शिक्षा[b] को न छोड़।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासन”; इब्रानी शब्द में सुधार करने वाला प्रशिक्षण और अनुशासन भी शामिल है।
    reason: lexical_alternative
  - marker: b
    text: या “व्यवस्था”; यहाँ आशय औपचारिक विधि-संहिता के बजाय माता की अधिकारपूर्ण शिक्षा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: आज्ञार्थक क्रिया ध्यानपूर्वक सुनने और ग्रहण करने का भाव रखती है; ‘बात मान’ आज्ञापालन को मुख्य पाठ में आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: בְּנִי
  choice: मेरे पुत्र
  rationale: इब्रानी में संबोधन पुल्लिंग एकवचन है और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ है; इसलिए साहित्यिक पिता-पुत्र संबोधन सुरक्षित रखा गया है।
- source_word: מוּסַר
  choice: अनुशासन
  rationale: यह शब्द शिक्षा, सुधार और चरित्र-निर्माण करने वाले प्रशिक्षण को समेटता है। ‘अनुशासन’ इस सुधारात्मक और शिक्षाप्रद आयाम को संक्षेप में व्यक्त करता है।
- source_word: אָבִיךָ
  choice: अपने पिता का
  rationale: हिन्दी में ‘अपने पिता का’ कर्ता-संबंध के अनुसार स्वाभाविक अधिकारसूचक रूप है।
- source_word: וְאַל
  choice: और ... न
  rationale: संयोजक और निषेधात्मक अव्यय दूसरे आदेश को पहले के साथ सीधे जोड़ते हैं।
- source_word: תִּטֹּשׁ
  choice: न छोड़
  rationale: क्रिया का अर्थ पीछे छोड़ देना या त्याग देना है। ‘न छोड़’ आधुनिक हिन्दी में स्वाभाविक है और इसके नैतिक भार को बनाए रखता है।
- source_word: תּוֹרַת
  choice: शिक्षा
  rationale: घरेलू ज्ञान-साहित्य के इस संदर्भ में यह औपचारिक विधि-संहिता नहीं, बल्कि माता की अधिकारपूर्ण शिक्षा है।
- source_word: אִמֶּךָ
  choice: अपनी माता की
  rationale: ‘अपनी माता की’ समान कर्ता के संदर्भ में स्वाभाविक हिन्दी संबंधसूचक प्रयोग है और पिता के समानांतर पद को बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य में लिंगसूचक पुत्र-संबोधन
  choice: मेरे पुत्र
  alternative: मेरे बच्चे
  rationale: इब्रानी संबोधन व्याकरण और अलंकार दोनों में पुल्लिंग एकवचन है। ‘मेरे पुत्र’ मूल साहित्यिक पिता-पुत्र संरचना को सुरक्षित रखता है।
- issue: गैर-मूसी घरेलू संदर्भ में תּוֹרָה का अर्थ
  choice: शिक्षा
  alternative: व्यवस्था
  rationale: यहाँ शब्द माता के अधिकारपूर्ण मार्गदर्शन को बताता है, न कि मूसा की व्यवस्था को एक औपचारिक विधि-संहिता के रूप में। ‘शिक्षा’ अनावश्यक धर्मशास्त्रीय संकीर्णता से बचती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुन’ ज्ञान-साहित्य के सीधे आग्रह को बनाए रखता है, जबकि ‘बात मान’ कहकर निहित आज्ञापालन को अत्यधिक स्पष्ट नहीं करता। पिता और माता के समानांतर निर्देश को मूल क्रम में रखा गया है।
