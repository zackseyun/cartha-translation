  text: נִ֭בְלָעֵ/ם כִּ/שְׁא֣וֹל חַיִּ֑ים וּ֝/תְמִימִ֗ים כְּ/י֣וֹרְדֵי בֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/001/012.yaml
  text: Let us swallow them alive like Sheol[a], and whole like those who go down to the pit[b];
translation:
  language: hi
  text: 'हम उन्हें शिओल[a] की तरह जीवित ही निगल लें,

    और उन्हें साबुत[b] ही निगल लें, मानो वे गड्ढे में उतरने वाले हों;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र की तरह’; इब्रानी विचार में ‘शिओल’ मृतकों के लोक को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अक्षत’ अथवा ‘पूरे के पूरे’; यहाँ इब्रानी शब्द पूर्ण या साबुत होने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְלָעֵם
  choice: हम उन्हें … निगल लें / निगल जाएँ
  rationale: यह בלע का प्रथम पुरुष बहुवचन आग्रहसूचक रूप है, जिसके साथ तृतीय पुरुष बहुवचन कर्म-प्रत्यय जुड़ा है। ‘निगल लें’ साथियों को उकसाने का भाव और हिंसक रूपक दोनों बनाए रखता है; दूसरी पंक्ति में ‘निगल जाएँ’ हिंदी में समान क्रिया को स्वाभाविक ढंग से दोहराता है।
- source_word: כִּשְׁאוֹל
  choice: शिओल की तरह
  rationale: ‘शिओल’ इब्रानी मृतलोक की विशिष्ट धारणा और उसके निगल लेने वाले काव्यात्मक चित्र को सुरक्षित रखता है; इसे केवल ‘कब्र’ या ‘मृत्यु’ कहना अर्थ को संकुचित कर सकता है।
- source_word: חַיִּים
  choice: जीवित ही
  rationale: यहाँ शब्द पीड़ितों की उस अवस्था को बताता है जिसमें वे निगले जाएँगे। ‘ही’ इस भयावह बात पर स्वाभाविक हिंदी बल देता है कि वे अभी जीवित होंगे।
- source_word: וּתְמִימִים
  choice: साबुत
  rationale: इस हिंसक और शारीरिक चित्र में תמים का अर्थ नैतिक ‘निर्दोष’ से अधिक ‘पूरा, अक्षत, साबुत’ है। ‘साबुत’ साधारण आधुनिक हिंदी में इस भौतिक पूर्णता को स्पष्ट रखता है।
- source_word: כְּיוֹרְדֵי בוֹר
  choice: गड्ढे में उतरने वालों की तरह
  rationale: यह अनुवाद सहभागी रूप ‘उतरने वालों’ और ठोस चित्र ‘गड्ढे’ दोनों को बनाए रखता है; संदर्भ में गड्ढा मृत्यु के लोक से काव्यात्मक रूप से जुड़ा है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: कब्र / मृतलोक / मृत्यु
  rationale: लिप्यंतरण मूल इब्रानी अवधारणा को बनाए रखता है और उसे किसी एक संकुचित अर्थ में पहले से निर्धारित नहीं करता; पादटिप्पणी सामान्य पाठक को इसका संदर्भ बताती है।
- issue: תְמִימִים का प्रसंगानुसार अर्थ
  choice: साबुत
  alternative: निर्दोष / खरे / अक्षत
  rationale: आस-पास का प्रसंग हिंसक घात और निगलने का है, नैतिक चरित्रांकन का नहीं। इसलिए भौतिक पूर्णता का अर्थ अधिक उपयुक्त है, जबकि पादटिप्पणी वास्तविक शब्दार्थ-विकल्प को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिओल’ को मूल धार्मिक-काव्यात्मक अवधारणा सुरक्षित रखने के लिए लिप्यंतरित किया गया है और पादटिप्पणी में समझाया गया है। समानांतर पंक्तियों में ‘जीवित ही’ और ‘साबुत’ को प्रमुख स्थान देकर इब्रानी कविता की भयावह तीव्रता बनाए रखी गई है।
