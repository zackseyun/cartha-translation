  to: 'हम उन्हें शिओल[a] की तरह जीवित ही निगल लें,

    और उन्हें साबुत[b] ही निगल लें, मानो वे गड्ढे में उतरने वाले हों;'
  rationale: The revision keeps the Hebrew’s violent metaphor and parallelism while making the implicit object explicit in the second Hindi clause. ‘मानो वे गड्ढे में उतरने वाले हों’ clarifies that the comparison concerns the victims, not the speakers, and retains the source’s unresolved poetic association between being swallowed whole and going down to the pit.
