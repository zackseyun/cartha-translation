  yaml_path: translation/ot/proverbs/001/004.yaml
  text: to give prudence to the simple[a], knowledge and discretion to the young man.
translation:
  language: hi
  text: भोले लोगों को सूझ-बूझ, और युवक[a] को ज्ञान और विवेक देने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युवा व्यक्ति।” इब्रानी शब्द पुल्लिंग एकवचन (“युवक”) है और ज्ञान-साहित्य की शिक्षा में प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָתֵת
  choice: देने के लिए
  rationale: ל उपसर्ग सहित infinitive construct पिछले पद से चले आ रहे उद्देश्य को व्यक्त करता है; हिंदी में “देने के लिए” इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: לִפְתָאיִם
  choice: अनुभवहीनों को
  rationale: פְּתָאִים उन भोले, अननुभवी और आसानी से बहकाए जा सकने वाले लोगों को दर्शाता है, न कि बौद्धिक अक्षमता को। “अनुभवहीन” आधुनिक हिंदी में यह आशय स्पष्ट रखता है।
- source_word: עָרְמָה
  choice: चतुराई
  rationale: यहाँ शब्द का सकारात्मक अर्थ व्यावहारिक सूझ और सावधानी है, यद्यपि दूसरे संदर्भों में इसमें धूर्तता की छाया हो सकती है। “चतुराई” मूल शब्द की अर्थ-सीमा को पूरी तरह समतल किए बिना संदर्भानुकूल है।
- source_word: לְנַעַר
  choice: युवक को
  rationale: נַעַר पुल्लिंग एकवचन है और लड़के अथवा युवा पुरुष को सूचित करता है। “युवक” स्रोत के व्याकरणिक रूप को बनाए रखते हुए सहज हिंदी है।
- source_word: דַּעַת
  choice: ज्ञान
  rationale: ज्ञान-साहित्य के इस संदर्भ में דַּעַת का सीधा और स्वाभाविक समतुल्य “ज्ञान” है।
- source_word: וּמְזִמָּה
  choice: तथा विवेक
  rationale: מְזִמָּה सोच-समझकर योजना बनाने, सावधानी और उचित निर्णय की क्षमता को दर्शाता है; “विवेक” हिंदी में इस सकारात्मक शैक्षिक आशय को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-संबंधी शिक्षा में पुल्लिंग एकवचन
  choice: युवक
  alternative: युवा व्यक्ति
  rationale: इब्रानी נַעַר व्याकरणतः पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसका रूप सुरक्षित रखा गया है। फिर भी नीतिवचन की शिक्षा में यह प्रतिनिधिक रूप से युवा व्यक्ति के लिए प्रयुक्त हो सकता है; इस संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “अनुभवहीन” से बौद्धिक अक्षमता का अनुचित संकेत टलता है, जबकि “चतुराई” और “विवेक” ज्ञान-साहित्य की व्यावहारिक शिक्षा को व्यक्त करते हैं।
