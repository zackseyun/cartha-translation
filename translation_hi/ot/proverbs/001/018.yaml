  text: But they lie in wait for their own blood[b][a]; they set an ambush for their own lives.
translation:
  language: hi
  text: पर वे अपने ही खून की घात में रहते हैं[a]; वे अपने ही प्राणों के लिए छिपकर घात लगाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने ही खून के लिए।’ इब्रानी में ‘खून’ का ठोस बिंब बना रहता है और यह विडंबना प्रकट होती है कि उनकी हिंसा अंततः उन्हीं पर लौटती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वे अपने ही प्राणों के लिए छिपे रहते हैं।’ इब्रानी क्रिया का मूल अर्थ ‘छिपाना’ या ‘छिपे रहना’ है; यहाँ प्रसंग में संभवतः छिपकर घात लगाने का भाव है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵם
  choice: पर वे
  rationale: स्वतंत्र सर्वनाम के साथ वाव पिछले पद की चेतावनी के विपरीत इन हिंसक लोगों की मूर्खता दिखाता है; ‘पर वे’ इस विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדָמָם
  choice: अपने ही खून के लिए
  rationale: דָּם का ठोस बिंब ‘खून’ के रूप में रखा गया है। ‘अपने ही’ प्रत्यय और इस विडंबना को स्पष्ट करता है कि उनकी हिंसा उन्हीं पर लौटती है।
- source_word: יֶאֱרֹבוּ
  choice: घात लगाते हैं
  rationale: ארב का सामान्य अर्थ किसी पर हमला करने के लिए छिपकर प्रतीक्षा करना है; ‘घात लगाना’ आधुनिक हिन्दी में इसका स्वाभाविक और सटीक रूप है।
- source_word: יִצְפְּנוּ
  choice: छिपकर जाल बिछाते हैं
  rationale: צפן का मूल भाव छिपाने या छिपे रहने का है। समानांतर हिंसक प्रसंग में यह गुप्त घात की तैयारी बताता है; यह अनुवाद पहले क्रियापद से शब्दगत भेद भी बनाए रखता है।
- source_word: לְנַפְשֹׁתָם
  choice: अपने ही प्राणों के लिए
  rationale: נֶפֶשׁ यहाँ हिंसक मृत्यु के संदर्भ में ‘जीवन/प्राण’ को सूचित करता है। ‘प्राणों’ पद्यात्मक गरिमा और बहुवचन प्रत्यय दोनों को बनाए रखता है।
