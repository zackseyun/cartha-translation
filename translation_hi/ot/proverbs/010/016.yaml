source:
  edition: WLC
  text: פְּעֻלַּ֣ת צַדִּ֣יק לְ/חַיִּ֑ים תְּבוּאַ֖ת רָשָׁ֣ע לְ/חַטָּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/016.yaml
  text: The labor of the righteous leads to life[c][b][a]; the produce of the wicked leads to sin.
translation:
  language: hi
  text: धर्मी की मेहनत जीवन की ओर ले जाती है[a]; पर दुष्ट की उपज[b] पाप[c] की ओर ले जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवन के लिए है” अथवा “जीवन में परिणत होती है।” इब्रानी पूर्वसर्ग उद्देश्य या परिणाम दोनों बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उपज” का अर्थ यहाँ “पैदावार,” “आमदनी” या “प्राप्त फल” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी חַטָּאת का अर्थ बलिदान-संबंधी प्रसंगों में “पापबलि” भी हो सकता है, पर यहाँ इसका अर्थ “पाप” है।
    reason: alternative_reading
lexical_decisions:
- source_word: פְּעֻלַּת
  choice: मेहनत
  rationale: यह शब्द काम, परिश्रम या उसके प्रतिफल को व्यक्त कर सकता है। यहाँ “मेहनत” व्यक्ति के कार्य और उससे निकलने वाले फल—दोनों की व्यापकता को बनाए रखती है और इसे केवल “मज़दूरी” तक सीमित नहीं करती।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक अर्थ रखता है। “धर्मी” आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְחַיִּים
  choice: जीवन की ओर ले जाती है
  rationale: לְ उद्देश्य अथवा परिणाम/दिशा बता सकता है। यह अभिव्यक्ति परिणाम की ओर बढ़ने का भाव स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: תְּבוּאַת
  choice: उपज
  rationale: यह शब्द उपज, पैदावार, आमदनी या प्राप्त फल का बोध करा सकता है। “उपज” कृषि-रूपक को बनाए रखते हुए दुष्ट के कार्यों से प्राप्त व्यापक फल को भी व्यक्त करती है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह भी संज्ञा के रूप में प्रयुक्त प्रतिनिधिक एकवचन है और “धर्मी” के साथ नीतिवचन का नैतिक विरोध स्पष्ट रखता है।
- source_word: לְחַטָּאת
  choice: पाप की ओर ले जाती है
  rationale: यहाँ לְ को परिणाम/दिशा के रूप में और חַטָּאת को नैतिक अर्थ “पाप” में लिया गया है। यह पहले चरण के समानांतर ढाँचे को बनाए रखता है।
theological_decisions:
- issue: חַטָּאת का अर्थ
  choice: पाप
  alternative: पापबलि
  rationale: חַטָּאת बलिदान-संबंधी प्रसंगों में “पापबलि” भी हो सकता है, पर यहाँ कोई उपासना-विधि का प्रसंग नहीं है। नीतिवचन का नैतिक विरोध—जीवन बनाम पाप—“पाप” अर्थ का समर्थन करता है।
- issue: לְ का संबंध
  choice: परिणाम अथवा दिशा—“की ओर ले जाती है”
  alternative: उद्देश्य—“के लिए”
  rationale: इब्रानी पूर्वसर्ग उद्देश्य और परिणाम दोनों व्यक्त कर सकता है। मुख्य पाठ में परिणामसूचक स्वाभाविक हिन्दी चुनी गई है, जबकि टिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्मरणीय नीतिवचन-शैली रखी गई है। दोनों चरणों में “की ओर ले जाती है” दोहराकर इब्रानी समानांतरता स्पष्ट की गई है; “पर” अंतर्निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
