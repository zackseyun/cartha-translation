base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/002.yaml
  text: Treasures of wickedness do not profit[b][a], but righteousness delivers from death.
translation:
  language: hi
  text: दुष्टता से जुटाया हुआ धन किसी काम नहीं आता,[a] पर धार्मिकता मृत्यु से बचाती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “दुष्टता के भंडार कोई लाभ नहीं देते।”'
    reason: lexical_alternative
  - marker: b
    text: “धार्मिकता” का अनुवाद “न्यायपरायणता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: י֭וֹעִילוּ
  choice: किसी काम नहीं आता
  rationale: हिफ़ील रूप यहाँ उपयोगी या लाभकारी होने का भाव देता है। यह हिंदी मुहावरा सहज है और सूक्ति की संक्षिप्तता बनाए रखता है।
- source_word: אוֹצְר֣וֹת
  choice: जुटाया हुआ धन
  rationale: यहाँ बहुवचन संज्ञा का आशय भंडार-भवनों से नहीं, संचित संपत्ति से है। हिंदी में ‘धन’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֶ֑שַׁע
  choice: दुष्टता से
  rationale: ‘दुष्टता के भंडार’ शाब्दिक संभावना है, पर संदर्भ में संबंधवाचक रचना संभवतः बुरे साधनों से संचित धन को दर्शाती है। ‘दुष्टता से जुटाया हुआ’ इसे स्पष्ट करते हुए मूल नैतिक विरोध बनाए रखता है।
- source_word: וּ֝/צְדָקָ֗ה
  choice: पर धार्मिकता
  rationale: वाव को विरोधात्मक समानांतरता के कारण ‘पर’ किया गया है। צְדָקָה के लिए ‘धार्मिकता’ नैतिक सीधाई और धर्ममय आचरण का व्यापक भाव रखती है; ‘न्यायपरायणता’ भी संभव है।
- source_word: תַּצִּ֥יל
  choice: बचाती है
  rationale: नצל का हिफ़ील रूप छुड़ाने या बचाने का अर्थ देता है। ‘बचाती है’ आधुनिक हिंदी में सहज और अर्थ की व्यापकता के अनुकूल है।
- source_word: מִ/מָּֽוֶת
  choice: मृत्यु से
  rationale: पूर्वसर्ग מן और ‘मृत्यु’ का सीधा अनुवाद है; यह वास्तविक मृत्यु और प्राणघातक संकट, दोनों संभावित आयामों को खुला रखता है।
theological_decisions:
- issue: צְדָקָה का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ज्ञान-साहित्य में यह शब्द दुष्टता के विपरीत धर्ममय और सीधा जीवन दर्शाता है। ‘धार्मिकता’ उस व्यापक नैतिक अर्थ को बनाए रखती है, जबकि ‘न्यायपरायणता’ न्याय-संबंधी पहलू को अधिक उभारती है।
- issue: धार्मिकता द्वारा मृत्यु से बचाए जाने का आशय
  choice: कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: प्राणघातक संकट से बचाती है
  rationale: मूल सूक्ति यह स्पष्ट नहीं करती कि मृत्यु शाब्दिक है, आसन्न संकट है, या दोनों। सरल ‘मृत्यु से’ इस धार्मिक और काव्यात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण सूक्ति-शैली अपनाई गई है। ‘जुटाया हुआ धन’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी में हिब्रू रचना का अधिक शाब्दिक विकल्प दिया गया है।
