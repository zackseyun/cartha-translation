  yaml_path: translation/ot/proverbs/010/008.yaml
  text: A wise-hearted man accepts commands[a], but a foolish man of lips will come to ruin.
translation:
  language: hi
  text: 'बुद्धिमान हृदयवाला आज्ञाएँ स्वीकार करता है,

    पर बकवादी मूर्ख नाश को पहुँचेगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “पटक दिया जाएगा।” अंतिम क्रिया दुर्लभ है और गिरा दिए जाने अथवा नाश को पहुँचने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: बुद्धिमान हृदयवाला
  rationale: इब्रानी पद का शाब्दिक भाव ‘हृदय से बुद्धिमान’ है। यह हृदय को विचार और इच्छा के केंद्र के रूप में प्रस्तुत करने वाली इब्रानी छवि को बनाए रखता है और हिन्दी में भी सहज है।
- source_word: יִקַּח
  choice: स्वीकार करता है
  rationale: क्रिया का मूल अर्थ ‘लेता है’ है, पर आज्ञाओं के साथ इसका आशय उन्हें ग्रहण और स्वीकार करना है।
- source_word: מִצְוֺת
  choice: आज्ञाएँ
  rationale: यह बहुवचन संज्ञा अधिकारपूर्ण निर्देशों को दर्शाती है; ‘आज्ञाएँ’ उसके बाध्यकारी बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱוִיל שְׂפָתַיִם
  choice: बकवादी मूर्ख
  rationale: शाब्दिक रूप ‘होंठों का मूर्ख’ हिन्दी में अस्वाभाविक है। ‘बकवादी मूर्ख’ उस व्यक्ति को व्यक्त करता है जिसकी मूर्खता उसके अनियंत्रित या मूर्खतापूर्ण बोलने से पहचानी जाती है।
- source_word: יִלָּבֵט
  choice: नाश को पहुँचेगा
  rationale: यह दुर्लभ निफ़अल क्रिया गिरा दिए जाने, ध्वस्त होने या विनाश को पहुँचने का भाव दे सकती है। चुना हुआ अनुवाद परिणाम को स्पष्ट रखता है, जबकि शब्दगत अनिश्चितता पादटिप्पणी में दी गई है।
