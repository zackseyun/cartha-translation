base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/029.yaml
  text: The way of Yahweh is a stronghold for the blameless[b][a], but destruction for those who do evil.
translation:
  language: hi
  text: याहवे का मार्ग[a] निर्दोष के लिए दृढ़ गढ़ है, परन्तु बुराई करनेवालों के लिए विनाश।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे का मार्ग’ का अर्थ याहवे के कार्य करने का ढंग या वह मार्ग हो सकता है जो याहवे मनुष्यों के सामने रखते हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘विनाश’ के स्थान पर ‘बरबादी’ या ‘आतंक’ भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָעוֹז
  choice: दृढ़ गढ़
  rationale: यह शब्द सुरक्षा और सामर्थ्य देनेवाले दुर्ग या शरणस्थान का बिंब रखता है। ‘दृढ़ गढ़’ उस ठोस रूपक को बनाए रखता है।
- source_word: לַתֹּם
  choice: निर्दोष चाल चलनेवाले के लिए
  rationale: תֹּם खराई, अखंड निष्ठा और निर्दोषता को व्यक्त करता है। समानांतर दूसरे खंड में व्यक्तियों—बुराई करनेवालों—का उल्लेख होने के कारण यहाँ भी व्यक्ति-सूचक अनुवाद स्वाभाविक है। ‘चाल चलनेवाला’ नैतिक जीवन की दिशा को स्पष्ट करता है, बिना पूर्ण पापहीनता का दावा जोड़े।
- source_word: דֶּרֶךְ יְהוָה
  choice: याहवे का मार्ग
  rationale: शाब्दिक संरचना को बनाए रखने से यह अर्थ खुला रहता है कि बात याहवे के कार्य करने के ढंग की है, उनके द्वारा ठहराए मार्ग की है, अथवा दोनों की।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: וּמְחִתָּה
  choice: परन्तु ... विनाश
  rationale: מְחִתָּה विनाश, बरबादी या आतंक का अर्थ दे सकता है। पहले खंड के ‘दृढ़ गढ़’ के विपरीत ‘विनाश’ सबसे स्पष्ट है; ו को विरोधसूचक ‘परन्तु’ किया गया है।
- source_word: לְפֹעֲלֵי אָוֶן
  choice: बुराई करनेवालों के लिए
  rationale: यह अनुवाद participial पदबंध की क्रियात्मकता और उसके नैतिक आशय दोनों को सहज आधुनिक हिन्दी में रखता है।
- source_word: אָוֶן
  choice: बुराई
  rationale: संदर्भ में यह दुष्टता और हानिकारक कुकर्म को दर्शाता है; ‘बुराई’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ‘याहवे का मार्ग’ का अर्थ-क्षेत्र
  choice: व्यापक और अस्पष्ट संबंधवाचक पदबंध ‘याहवे का मार्ग’ बनाए रखा गया।
  alternative: ‘याहवे के कार्य करने का ढंग’ अथवा ‘याहवे का बताया हुआ मार्ग’
  rationale: हिब्रू पदबंध याहवे के अपने आचरण और मनुष्यों के लिए उनके ठहराए मार्ग—दोनों की ओर संकेत कर सकता है। किसी एक अर्थ को मुख्य पाठ में निश्चित करना पाठ की सार्थक बहुस्तरीयता को घटा देगा।
- issue: תֹּם का नैतिक आशय
  choice: ‘निर्दोष चाल चलनेवाला’
  alternative: ‘खरा मनुष्य’ अथवा ‘निर्दोष व्यक्ति’
  rationale: यहाँ निर्दोषता को नैतिक अखंडता के अर्थ में रखा गया है, न कि अनिवार्यतः पूर्ण पापहीनता के दार्शनिक दावे के रूप में।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दोनों विरोधी खंडों में ‘के लिए’ रखकर हिब्रू समानांतरता को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘दृढ़ गढ़’ काव्यात्मक ठोस रूपक को बचाता है; ‘परन्तु’ नीति-वचन के तीखे विरोध को स्पष्ट करता है।
