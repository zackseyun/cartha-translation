  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; नीति-वचन की संक्षिप्त समानांतर संरचना तथा ‘होंठों’ का मूल रूपक बनाए रखा गया है। पुल्लिंग एकवचन ‘जो ... रोकता है’ नीतिवचन की प्रतिनिधिक सामान्य शैली में सभी व्यक्तियों पर लागू है।
