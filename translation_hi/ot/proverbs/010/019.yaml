  text: When words are many[a], transgression does not cease[b], but whoever restrains his lips is prudent.
translation:
  language: hi
  text: 'बहुत बोलने पर अपराध नहीं रुकता,

    पर जो अपने होंठों पर नियंत्रण रखता है, वह समझदार है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרֹב דְּבָרִים
  choice: जहाँ बहुत बातें होती हैं
  rationale: בְּרֹב मात्रा या परिस्थिति बताता है और דְּבָרִים यहाँ बोली गई बातों को सूचित करता है। यह रूप मूल अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא יֶחְדַּל פָּשַׁע
  choice: वहाँ अपराध होना नहीं रुकता
  rationale: חדל का मूल अर्थ ‘रुकना/समाप्त होना’ है और פֶּשַׁע नैतिक अपराध या उल्लंघन को दर्शाता है। यह अनुवाद कथन की दृढ़ता और नैतिक गंभीरता बनाए रखता है।
- source_word: וְחֹשֵׂךְ
  choice: पर जो ... रोकता है
  rationale: חשׂך का अर्थ रोक रखना या संयमित करना है। समानांतर पंक्तियों के विरोध के कारण וְ को ‘पर’ किया गया है।
- source_word: שְׂפָתָיו
  choice: अपने होंठों को
  rationale: हिब्रू का शाब्दिक अंग-रूपक हिन्दी में भी स्वाभाविक है और वाणी पर संयम का चित्र सुरक्षित रखता है।
- source_word: מַשְׂכִּיל
  choice: समझदार है
  rationale: हिफ़ील कृदंत सूझ-बूझ से काम करने वाले व्यक्ति को बताता है। ‘समझदार’ सामान्य पाठक के लिए सहज है और व्यावहारिक बुद्धि का भाव रखता है।
