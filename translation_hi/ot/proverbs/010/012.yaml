source:
  edition: WLC
  text: שִׂ֭נְאָה תְּעוֹרֵ֣ר מְדָנִ֑ים וְ/עַ֥ל כָּל פְּ֝שָׁעִ֗ים תְּכַסֶּ֥ה אַהֲבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/012.yaml
  text: Hatred stirs up conflicts[b][a], but love covers all transgressions.
translation:
  language: hi
  text: 'घृणा झगड़े भड़काती है,

    पर प्रेम सब अपराधों को ढक देता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂנְאָה
  choice: घृणा
  rationale: यह भाववाचक संज्ञा प्रेम के स्पष्ट विरोध में है; ‘घृणा’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: תְּעוֹרֵר
  choice: भड़काती है
  rationale: यह क्रिया विवादों को सक्रिय रूप से उकसाने या बढ़ाने का भाव देती है; ‘भड़काती है’ इस कारणात्मक अर्थ को सहज हिन्दी में व्यक्त करती है।
- source_word: מְדָנִים
  choice: झगड़े
  rationale: बहुवचन संज्ञा विवादों और कलहों को सूचित करती है। ‘झगड़े’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: וְ/עַל
  choice: पर
  rationale: शाब्दिक संरचना ‘और/ऊपर’ है, किंतु समानांतर पंक्तियों में स्पष्ट विरोध है; हिन्दी में ‘पर’ इस संबंध को स्वाभाविक रूप से प्रकट करता है।
- source_word: כָּל
  choice: सब
  rationale: बहुवचन ‘अपराधों’ के साथ ‘सब’ सहज हिन्दी परिमाणवाचक है और मूल की व्यापकता बनाए रखता है।
- source_word: פְּשָׁעִים
  choice: अपराधों
  rationale: यह शब्द उल्लंघनों, दोषों या विद्रोही कृत्यों का नैतिक भार रखता है; ‘अपराधों’ से वह भार बना रहता है, बिना प्रसंग को अनावश्यक रूप से सीमित किए।
- source_word: תְּכַסֶּה
  choice: ढक देता है
  rationale: मूल क्रिया के ‘ढकने’ के रूपक को सुरक्षित रखा गया है। ‘क्षमा करता है’ या ‘अनदेखा करता है’ जैसे अधिक व्याख्यात्मक अनुवाद अर्थ को समय से पहले निश्चित कर देते।
- source_word: אַהֲבָה
  choice: प्रेम
  rationale: यह भाववाचक संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य है तथा घृणा के साथ नीतिवचन का केंद्रीय विरोध बनाए रखता है।
theological_decisions:
- issue: ‘प्रेम सब अपराधों को ढक देता है’ का अर्थ
  choice: '‘ढक देता है’ का मूल रूपक बनाए रखा गया है: प्रेम अपराधों को लगातार उभारने, फैलाने या उनके कारण विवाद बढ़ाने के विपरीत व्यवहार करता है।'
  alternative: इसे ‘प्रेम सब पाप क्षमा करता है’ या ‘प्रेम हर गलत काम छिपाता है’ कहना।
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘ढकने’ की क्रिया का प्रयोग करता है, क्षमा या अन्याय छिपाने की स्पष्ट आज्ञा का नहीं। रूपक बनाए रखने से धर्मवैज्ञानिक तनाव और अर्थ की वास्तविक व्यापकता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त काव्यात्मक समानांतरता, सामान्य पाठकों के लिए सहज शब्दावली और मूल रूपक को बनाए रखने वाला गरिमापूर्ण लहजा।
