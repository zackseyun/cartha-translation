source:
  edition: WLC
  text: מְק֣וֹר חַ֭יִּים פִּ֣י צַדִּ֑יק וּ/פִ֥י רְ֝שָׁעִ֗ים יְכַסֶּ֥ה חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/011.yaml
  text: The mouth of the righteous is a fountain of life[a], but the mouth of the wicked conceals violence.
translation:
  language: hi
  text: धर्मी का मुँह जीवन का सोता है, पर दुष्टों का मुँह हिंसा को छिपाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर हिंसा दुष्टों के मुँह को ढक लेती है।” इब्रानी वाक्यरचना में यह अर्थ भी सम्भव है।
    reason: syntactic_alternative
lexical_decisions:
- source_word: מְקוֹר חַיִּים
  choice: जीवन का सोता
  rationale: ‘सोता’ बहते, जीवनदायी जल के स्रोत का ठोस रूपक बनाए रखता है; חַיִּים यहाँ प्रचलित भाववाचक अर्थ ‘जीवन’ में है।
- source_word: פִּי צַדִּיק
  choice: धर्मी का मुँह
  rationale: यह चयन मूल के ठोस ‘मुँह’ वाले बिंब और प्रतिनिधिक एकवचन ‘धर्मी’—दोनों को बनाए रखता है।
- source_word: וּפִי רְשָׁעִים
  choice: पर दुष्टों का मुँह
  rationale: וְ का शाब्दिक अर्थ ‘और’ है, पर इस विरोधात्मक समानांतरता में ‘पर’ स्वाभाविक है। רְשָׁעִים बहुवचन है, जबकि פִּי एकवचन रूप में सामूहिक कथन करता है।
- source_word: יְכַסֶּה
  choice: छिपाता है
  rationale: क्रिया का मूल अर्थ ‘ढकना’ है और यहाँ उसका आलंकारिक अर्थ ‘छिपाना’ सहज बैठता है; फिर भी वाक्यरचना में दूसरी सम्भावना होने के कारण उसे पादटिप्पणी में रखा गया है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, क्रूरता और हिंसक अन्याय को सूचित कर सकता है; संक्षिप्त ‘हिंसा’ नीतिवचन के नैतिक विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: दूसरी पंक्ति में कर्ता और कर्म का सम्बन्ध
  choice: '‘दुष्टों का मुँह’ कर्ता और ‘हिंसा’ कर्म: मुँह हिंसा को छिपाता है'
  alternative: '‘हिंसा’ कर्ता: हिंसा दुष्टों के मुँह को ढक लेती है'
  rationale: शब्द-क्रम और निकटतम स्पष्ट समानांतरता मुख्य पाठ के चयन का समर्थन करते हैं, पर क्रिया और दोनों संज्ञाओं के पुल्लिंग एकवचन-संगत रूप के कारण वैकल्पिक व्याकरणिक पठन सम्भव है; इसलिए अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मुँह’ मूल के ठोस वाणी-बिंब को सामान्य पाठक के लिए स्वाभाविक रूप में रखता है; ‘सोता’ जीवनदायी जल के रूपक को बनाए रखता है।
