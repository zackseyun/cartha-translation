  text: The tongue of the righteous is choice silver[a]; the heart of the wicked is of little worth.
translation:
  language: hi
  text: धर्मी की जीभ उत्तम चाँदी है; दुष्टों का हृदय बहुत कम मूल्य का है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुच्छ है,’ ‘बहुत कम है,’ अथवा ‘लगभग कुछ भी नहीं है।’ इब्रानी כִּמְעָט संक्षिप्त पद है, जो बहुत कम मूल्य या लगभग नगण्यता का भाव दे सकता है।
