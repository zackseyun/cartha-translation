lexical_decisions:
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: ठोस मूल्य-रूपक को बनाए रखता है; यहाँ सामान्य ‘धन’ की अपेक्षा धातु ‘चाँदी’ अधिक उपयुक्त है।
- source_word: נִבְחָר
  choice: उत्तम
  rationale: यह चुनी हुई अथवा उच्च कोटि की गुणवत्ता दर्शाता है; ‘उत्तम चाँदी’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: לְשׁוֹן
  choice: जीभ
  rationale: मूल का अंग-रूपक सुरक्षित रहता है और हिन्दी में इससे वाणी का अर्थ सहज रूप से समझ आता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: विशेषण का संज्ञात्मक प्रयोग है; एक आदर्श धार्मिक-नैतिक व्यक्ति को बिना अनावश्यक लैंगिक विस्तार के व्यक्त करता है।
- source_word: לֵב
  choice: हृदय
  rationale: मूल बिंब बनाए रखता है; इब्रानी प्रयोग में यह विचार, इच्छा और नैतिक चरित्र के भीतरी केंद्र को सूचित करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञात्मक विशेषण को स्वाभाविक हिन्दी में व्यक्त करता है और पहले खंड के एकवचन आदर्श-वर्ग के साथ स्रोत की संख्या-असमता सुरक्षित रखता है।
- source_word: כִּמְעָט
  choice: मूल्य बहुत कम है
  rationale: संक्षिप्त इब्रानी पद को पहले खंड के मूल्यांकन-रूपक के संदर्भ में स्वाभाविक हिन्दी बनाता है; ‘बहुत कम’ अल्पता या लगभग नगण्यता का भाव देता है।
