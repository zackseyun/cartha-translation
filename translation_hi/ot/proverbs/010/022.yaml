  text: בִּרְכַּ֣ת יְ֭הוָה הִ֣יא תַעֲשִׁ֑יר וְ/לֹֽא יוֹסִ֖ף עֶ֣צֶב עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/022.yaml
  text: The blessing of the LORD makes rich, and he adds no sorrow with it.
translation:
  language: hi
  text: यहोवा की आशीष ही धनवान बनाती है, और वह उसके साथ कोई दुःख नहीं जोड़ता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दूसरे खंड का कर्ता स्पष्ट रूप से नहीं लिखा है। क्रिया पुल्लिंग एकवचन है, इसलिए इसे सामान्यतः यहोवा के लिए समझा जाता है।
    reason: निहित कर्ता की व्याख्यात्मक स्थिति बताता है, पर सक्रिय पुल्लिंग क्रिया के विरुद्ध निष्क्रिय या स्त्रीलिंग विकल्प नहीं देता।
lexical_decisions:
- source_word: בִּרְכַּת יְהוָה
  choice: यहोवा की आशीष
  rationale: व्यक्तिगत परमेश्वर के नाम יהוה को ‘यहोवा’ और בִּרְכַּת को स्वाभाविक हिन्दी में ‘आशीष’ के रूप में रखा गया है।
- source_word: הִיא תַעֲשִׁיר
  choice: ही धनवान बनाती है
  rationale: स्त्रीलिंग सर्वनाम הִיא का बल ‘ही’ से व्यक्त होता है और हिफ़ील क्रिया תַעֲשִׁיר का कारक अर्थ ‘धनवान बनाती है’ से सुरक्षित रहता है।
- source_word: עֶצֶב
  choice: दुःख
  rationale: यह शब्द पीड़ा, कष्ट या श्रमजनित दुःख को सूचित कर सकता है; प्रसंग में व्यापक और स्वाभाविक ‘दुःख’ उपयुक्त है।
- source_word: עִמָּהּ
  choice: उसके साथ
  rationale: स्त्रीलिंग प्रत्यय का स्वाभाविक संदर्भ ‘आशीष’ है; इसे हिन्दी में स्पष्ट किंतु संक्षिप्त रखा गया है।
theological_decisions:
- issue: וְלֹא יוֹסִף में कर्ता की अस्पष्टता
  choice: और वह उसके साथ कोई दुःख नहीं जोड़ता
  alternative: और उसके साथ कोई दुःख नहीं जुड़ता / और वह आशीष उसके साथ दुःख नहीं जोड़ती
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और व्यक्त कर्ता नहीं दिया गया। मुख्य पाठ में परमेश्वर को निहित कर्ता मानने वाली पारंपरिक तथा अंग्रेज़ी POB की व्याख्या रखी गई है, जबकि पाठगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कहावत-सदृश वाक्य-विन्यास अपनाया गया है। ‘ही’ मूल के बलाघात को दर्शाता है; ‘कोई दुःख’ हिन्दी में निषेध को सहज बनाता है।
