base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/006.yaml
  text: Blessings are on the head of the righteous, but the mouth of the wicked covers violence.
translation:
  language: hi
  text: 'धर्मी के सिर पर आशीषें होती हैं,

    पर दुष्टों का मुँह हिंसा को ढकता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य का अर्थ यह भी हो सकता है: “पर हिंसा दुष्टों का मुँह ढक लेती है।”'
    reason: मूल में कर्ता-कर्म संबंध की वास्तविक व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּרָכוֹת
  choice: आशीषें
  rationale: मूल में बहुवचन है और यह कृपा, कल्याण तथा अनुग्रह के विविध रूपों को व्यक्त करता है।
- source_word: לְרֹאשׁ
  choice: के सिर पर
  rationale: इब्रानी बिंब को सीधे बनाए रखता है; सिर पर आशीष होना सम्मान और प्रत्यक्ष अनुग्रह का संकेत है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: नीतिवचन के नैतिक संदर्भ में यह उस व्यक्ति को दर्शाता है जो सही और न्यायपूर्ण मार्ग पर चलता है।
- source_word: יְכַסֶּה
  choice: ढकता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘ढकना’ है। ‘छिपाता है’ अर्थ को अधिक निश्चित कर देता, जबकि इब्रानी वाक्य में संबंध कुछ हद तक अस्पष्ट है।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, क्रूरता और अन्यायपूर्ण हानि का बोध देता है; यहाँ संक्षिप्त ‘हिंसा’ मूल समानांतरता के अनुकूल है।
theological_decisions:
- issue: दूसरी पंक्ति में कर्ता और कर्म की संभावित अस्पष्टता
  choice: मुख्य पाठ में पारंपरिक शब्दक्रम के अनुसार ‘दुष्टों का मुँह हिंसा को ढकता है’ रखा गया और वैकल्पिक समझ को पादटिप्पणी में बताया गया।
  alternative: ‘हिंसा दुष्टों का मुँह ढक लेती है।’
  rationale: इब्रानी में ‘मुँह’ और ‘हिंसा’ दोनों व्याकरणतः एकवचन हैं, इसलिए क्रिया का रूप कर्ता को निर्णायक रूप से नहीं पहचानता। शब्दक्रम पहली व्याख्या का समर्थन करता है, पर दूसरी भी संभव है और उसे मिटाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता और ‘सिर’ तथा ‘मुँह’ के मूल शारीरिक बिंब सुरक्षित हैं।
