base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/023.yaml
  text: Doing wickedness is like a joke to a fool[a], but wisdom is for a man of understanding.
translation:
  language: hi
  text: 'मूर्ख के लिए बुराई करना खेल जैसा है[a],

    पर बुद्धि समझदार मनुष्य के लिए है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख के लिए बुरी योजना बनाना मनोरंजन है।” ‘बुराई’ के लिए प्रयुक्त हिब्रू शब्द का अर्थ निर्लज्ज या घोर अनुचित काम भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּשְׂחוֹק
  choice: खेल जैसा है
  rationale: כְּ तुलना व्यक्त करता है और שְׂחוֹק हँसी, मनोरंजन या खेल का भाव रखता है। आधुनिक हिन्दी में ‘खेल जैसा’ यह दिखाता है कि मूर्ख दुष्ट काम को हल्की और मनोरंजक बात मानता है।
- source_word: לִכְסִיל
  choice: मूर्ख के लिए
  rationale: לְ यहाँ संबंध या दृष्टिकोण बताता है—मूर्ख की दृष्टि में यह काम खेल जैसा है।
- source_word: עֲשׂוֹת
  choice: करना
  rationale: यह infinitive construct संज्ञात्मक रूप से पहले खंड के विषय का काम करता है। हिन्दी में ‘करना’ स्वाभाविक और संक्षिप्त है।
- source_word: זִמָּה
  choice: दुष्टता
  rationale: זִמָּה किसी दुष्ट योजना, निर्लज्ज कृत्य या नैतिक रूप से घृणित काम को सूचित कर सकता है। यहाँ व्यापक नैतिक अर्थ ‘दुष्टता’ उपयुक्त है और अनावश्यक रूप से यौन अर्थ तक सीमित नहीं करता।
- source_word: וְחָכְמָה
  choice: पर ... बुद्धि
  rationale: וְ का मूल अर्थ ‘और’ है, पर इस विरोधी समानांतरता में हिन्दी का ‘पर’ मूर्ख और समझदार मनुष्य के बीच का अंतर स्पष्ट करता है।
- source_word: לְאִישׁ תְּבוּנָה
  choice: समझदार मनुष्य के लिए
  rationale: मूल पदबंध शाब्दिक रूप से ‘समझ रखने वाले मनुष्य के लिए’ है। दूसरे खंड में क्रिया लुप्त है; हिन्दी में भी संक्षिप्त वाक्य रखकर संबंध की मूल अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: समझदार मनुष्य
  alternative: समझदार व्यक्ति
  rationale: हिब्रू में एकवचन पुल्लिंग אִישׁ है, जिसका प्रयोग इस सामान्य नीतिवचन में प्रतिनिधिक रूप से हुआ है। ‘मनुष्य’ स्रोत के रूप को बनाए रखते हुए सामान्य मानवीय प्रयोग भी व्यक्त करता है।
- issue: दूसरे खंड में लुप्त विधेय
  choice: पर समझदार मनुष्य के लिए बुद्धि
  alternative: पर समझदार मनुष्य बुद्धि से आनन्दित होता है
  rationale: हिब्रू दूसरे खंड में स्पष्ट विधेय नहीं देता। अधिक व्याख्यात्मक क्रिया जोड़ने के बजाय हिन्दी में भी संक्षिप्तता रखी गई है, जिससे बुद्धि और समझदार मनुष्य के संबंध की वास्तविक अस्पष्टता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की समानांतर शैली के अनुरूप है। ‘खेल जैसा’ सामान्य पाठक के लिए सहज है; दूसरे खंड की अपूर्णता जानबूझकर रखी गई है ताकि मूल हिब्रू की संक्षिप्तता और अर्थगत खुलापन सुरक्षित रहे।
