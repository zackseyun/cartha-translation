    text: शाब्दिक रूप से, “दिन जोड़ता है”; अर्थात जीवन के दिन बढ़ाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: का भय
  rationale: रचना-संबंधी रूप יִרְאַת יְהוָה को हिन्दी की स्वाभाविक अभिव्यक्ति ‘याहवे का भय’ से प्रस्तुत किया गया है। यह केवल आदर तक अर्थ को सीमित किए बिना श्रद्धामिश्रित भय का धार्मिक भार बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम चतुरक्षर को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: תּוֹסִיף
  choice: आयु बढ़ाता है
  rationale: हिफ़ील क्रिया का मूल भाव ‘जोड़ना/बढ़ाना’ है। हिन्दी में ‘दिन जोड़ता है’ अस्वाभाविक है, इसलिए वस्तु ‘दिनों’ के साथ निहित दीर्घायु का अर्थ स्वाभाविक रूप से ‘आयु बढ़ाता है’ में दिया गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יָמִים
  choice: आयु
  rationale: शाब्दिक अर्थ ‘दिन’ है, पर इस प्रसंग में यह जीवन के दिनों अर्थात आयु को सूचित करता है। मुख्य पाठ में सहज हिन्दी के लिए ‘आयु’ और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: וּ/שְׁנוֹת
  choice: पर ... वर्ष
  rationale: वाव औपचारिक रूप से ‘और’ है, किंतु विरोधात्मक काव्य-समानांतरता के कारण हिन्दी में ‘पर’ उपयुक्त है। ‘वर्ष’ पहले चरण के जीवन-दिनों के ठोस समानांतर को बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: नीतिवचन साहित्य के नैतिक रूप से बुरे लोगों के प्रतिनिधि बहुवचन के लिए संक्षिप्त और प्रचलित हिन्दी शब्द।
- source_word: תִּקְצֹרְנָה
  choice: घटा दिए जाएँगे
  rationale: स्त्रीलिंग बहुवचन क्रिया ‘वर्षों’ से मेल खाती है और उनके कम/छोटे किए जाने का परिणाम व्यक्त करती है। हिन्दी में यह निष्क्रिय भाव स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: दीर्घायु संबंधी कथन का स्वरूप
  choice: इसे सामान्य ज्ञान-सिद्धांत के सीधे कथन के रूप में रखा गया है, अपवादरहित गारंटी के रूप में नहीं समझाया गया।
  alternative: हर परमेश्वर-भय मानने वाले के लिए अनिवार्य दीर्घायु और हर दुष्ट के लिए अनिवार्य अकाल मृत्यु का बिना शर्त वादा।
  rationale: इब्रानी नीतिवचन नैतिक जीवन की सामान्य दिशा बताता है। अनुवाद उसके दृढ़ काव्यात्मक कथन को बनाए रखता है, किंतु पाठ में ऐसी व्याख्या नहीं जोड़ता जो इसे यांत्रिक या अपवादरहित प्रतिज्ञा बना दे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यिक स्वर। ‘आयु बढ़ाता है’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल के ठोस ‘दिन जोड़ता है’ को सुरक्षित रखती है। दोनों चरणों का विरोध ‘पर’ से स्पष्ट किया गया है।
