  text: The fear of Yahweh adds days[a], but the years of the wicked will be cut short.
translation:
  language: hi
  text: याहवे का भय आयु बढ़ाता है[a], पर दुष्टों के वर्ष कम हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
