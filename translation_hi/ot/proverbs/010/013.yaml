base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/013.yaml
  text: On the lips of a discerning man wisdom is found[a], but a rod is for the back of one who lacks sense.
translation:
  language: hi
  text: 'समझदार व्यक्ति के होंठों पर बुद्धि पाई जाती है,

    परन्तु समझ से रहित व्यक्ति की पीठ के लिए छड़ी है[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “हृदय से रहित”; हिब्रू में यह समझ या सूझ-बूझ की कमी के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/שִׂפְתֵי
  choice: के होंठों पर
  rationale: בְּ के स्थानवाचक भाव और होंठों पर विद्यमान वाणी के हिब्रू बिंब—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נָבוֹן
  choice: समझदार व्यक्ति
  rationale: यह शब्द समझ-बूझ और विवेक रखने वाले व्यक्ति को दर्शाता है; यह चयन आधुनिक हिन्दी में स्पष्ट है और कहावत के सार्वभौमिक प्रयोग के अनुकूल है।
- source_word: תִּמָּצֵא
  choice: पाई जाती है
  rationale: निफ़अल रूप को कर्मवाच्य में रखता है और अपूर्ण काल के यहाँ सामान्य, नीतिवचनात्मक सत्य व्यक्त करने वाले भाव को वर्तमान काल में प्रकट करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन के साहित्यिक संदर्भ में חָכְמָה के लिए प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी शब्द है।
- source_word: וְ/שֵׁבֶט
  choice: परन्तु ... छड़ी
  rationale: वाव यहाँ दोनों पंक्तियों के विरोध को जोड़ता है; שֵׁבֶט अनुशासन या दण्ड देने वाली छड़ी को दर्शाता है।
- source_word: לְ/גֵו
  choice: उसकी पीठ के लिए
  rationale: גֵּו यहाँ उस पीठ को दर्शाता है जिस पर छड़ी पड़ती है; לְ का सम्बन्धसूचक भाव ‘के लिए’ से बना रहता है।
- source_word: חֲסַר לֵב
  choice: जिसमें समझ की कमी है
  rationale: शाब्दिक अर्थ ‘हृदय की कमी वाला’ है, पर हिब्रू ज्ञान-साहित्य में ‘हृदय’ समझ और निर्णय-क्षमता का केंद्र है; हिन्दी चयन मुहावरे का आशय स्पष्ट करता है।
