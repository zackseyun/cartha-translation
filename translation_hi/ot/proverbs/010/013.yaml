translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त नीतिवचनात्मक लय और मूल की दो विपरीत पंक्तियों को बनाए रखते हुए रखी गई है। ‘समझदार व्यक्ति’ सामान्य पाठक के लिए स्वाभाविक है; ‘छड़ी’ मूल के दण्ड-अनुशासन संबंधी ठोस बिंब को सुरक्षित रखती है।
