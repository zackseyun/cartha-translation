  source_fidelity: 'The draft accurately reflects the Hebrew contrast: wisdom is found in the speech of the discerning, while a rod is designated for the back of one lacking understanding. ‘बुद्धि,’ ‘समझदार,’ and ‘छड़ी’ preserve the principal lexical sense and imagery. The footnote appropriately identifies the literal Hebrew idiom ‘lacking heart.’'
  naturalness: 'The second line of the draft is grammatically understandable but stylistically awkward: ‘जिसमें समझ की कमी है, उसकी पीठ’ separates the person-description from its possessive relationship to ‘पीठ.’ A compact noun phrase is more natural and retains the proverb’s balanced form.'
  terminology: ‘बुद्धि’ is a suitable rendering of חָכְמָה in this proverbial context. ‘समझ से रहित व्यक्ति’ clearly renders the idiomatic sense of חֲסַר לֵב without importing doctrinal interpretation. The note preserves the Hebrew literal image and explains its idiomatic force.
