  yaml_path: translation/ot/proverbs/010/018.yaml
  text: Lying lips conceal hatred[b][a], and whoever spreads slander is a fool.
translation:
  language: hi
  text: जो बैर छिपाता है, उसके होंठ झूठ बोलते हैं[a], और जो बदनामी की बात फैलाता है[b], वह मूर्ख है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठे होंठ बैर छिपाते हैं।” इब्रानी पदों को इस प्रकार भी समझा जा सकता है।
    reason: syntactic_alternative
  - marker: b
    text: शाब्दिक रूप से, “बदनामी की बात बाहर लाता है”; इसका अर्थ किसी हानिकारक या बुरी खबर को फैलाना भी हो सकता है, केवल झूठी निंदा करना ही नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: छिपाता है
  rationale: כסָה का कृदन्त किसी बात को ढकने या छिपाने का भाव देता है; यहाँ भीतर के बैर को छिपाने के लिए स्वाभाविक हिन्दी है।
- source_word: שִׂנְאָה
  choice: बैर
  rationale: संज्ञा का अर्थ घृणा या शत्रुता है। नीतिवचन की संक्षिप्त, संबंधपरक भाषा में ‘बैर’ स्वाभाविक और व्यापक है।
- source_word: שִׂפְתֵי שָׁקֶר
  choice: उसके होंठ झूठे हैं
  rationale: शाब्दिक पदबंध ‘झूठ के होंठ’ है। हिन्दी में यह वाक्य-विन्यास उस व्यक्ति की कपटपूर्ण वाणी को स्पष्ट करता है, साथ ही होंठों का मूल बिंब बनाए रखता है।
- source_word: וּמוֹצִא
  choice: और जो ... फैलाता है
  rationale: יצא का हिफ़ील कृदन्त मूलतः ‘बाहर लाने वाला’ है; דִבָּה के साथ इसका आशय हानिकारक बात को लोगों में प्रसारित करना है।
- source_word: דִבָּה
  choice: बदनामी की बात
  rationale: यह शब्द बुरी, हानिकारक या अपकीर्तिकर खबर/बात को दर्शा सकता है और हर प्रसंग में उसका असत्य होना आवश्यक नहीं। ‘बदनामी की बात’ इस व्यापकता को ‘झूठी निंदा’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: הוּא כְסִיל
  choice: वह मूर्ख है
  rationale: नीतिवचन में כְּסִיל नैतिक और व्यावहारिक समझ से रहित व्यक्ति के लिए नियमित ज्ञान-साहित्यिक पद है; ‘मूर्ख’ इस श्रेणीगत कथन को बनाए रखता है।
theological_decisions:
- issue: पहले अर्धवाक्य का वाक्य-विन्यास
  choice: ‘जो बैर छिपाता है, उसके होंठ झूठे हैं’—מְכַסֶּה שִׂנְאָה को विषयवत् और שִׂפְתֵי שָׁקֶר को उसके विषय में कथन माना गया है।
  alternative: ‘झूठे होंठ बैर छिपाते हैं’—שִׂפְתֵי שָׁקֶר को कर्ता और מְכַסֶּה को क्रिया माना जा सकता है।
  rationale: व्यंजनात्मक इब्रानी पदक्रम दोनों संबंधों की गुंजाइश देता है। चुना हुआ पाठ पारंपरिक वाक्य-विश्लेषण के अनुकूल है और समानांतर दूसरे अर्धवाक्य के ‘जो...वह...’ ढाँचे को स्पष्ट करता है; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘होंठ’ का मूल काव्यात्मक बिंब तथा ‘मूर्ख’ का नीतिवचन-संबंधी स्थिर पद सुरक्षित है। ‘बदनामी की बात’ सामान्य पाठक के लिए सहज है और इब्रानी דִבָּה की अर्थ-व्याप्ति को अनावश्यक रूप से केवल असत्य आरोप तक सीमित नहीं करता।
