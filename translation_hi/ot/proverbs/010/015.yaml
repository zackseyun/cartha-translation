  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֣וֹן עָ֭שִׁיר קִרְיַ֣ת עֻזּ֑/וֹ מְחִתַּ֖ת דַּלִּ֣ים רֵישָֽׁ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/015.yaml
  text: A rich man's wealth is his fortified city[b][a]; the ruin of the poor is their poverty.
translation:
  language: hi
  text: धनवान की संपत्ति उसका सुदृढ़ नगर है[a]; निर्धनों का विनाश उनकी निर्धनता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सामर्थ्य का नगर”; इब्रानी में शाब्दिक रूप से “उसकी सामर्थ्य का नगर” है।
    reason: lexical_alternative
  - marker: b
    text: “विनाश” का अनुवाद “बरबादी” भी हो सकता है; इस शब्द का अर्थ “भय” या “हताशा” भी हो सकता है, यद्यपि यहाँ इसकी संभावना कम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: संपत्ति
  rationale: यह शब्द भौतिक धन-संपदा को दर्शाता है; ‘संपत्ति’ आधुनिक हिन्दी में स्वाभाविक है और नीतिवचन के आर्थिक विरोध को स्पष्ट रखता है।
- source_word: עָשִׁיר
  choice: धनवान की
  rationale: मूल में विशेषण संज्ञा के रूप में एकवचन पुल्लिंग है। ‘धनवान की’ उसके धन के साथ संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קִרְיַת עֻזּוֹ
  choice: उसका सुदृढ़ नगर
  rationale: शाब्दिक संरचना ‘उसकी सामर्थ्य का नगर’ है। ‘सुदृढ़ नगर’ सुरक्षा और शक्ति के रूपक को हिन्दी में स्वाभाविक रखते हुए मूल बिंब को सुरक्षित रखता है।
- source_word: מְחִתַּת
  choice: विनाश
  rationale: यह संज्ञा विनाश, बरबादी, भय या हताशा का अर्थ दे सकती है। समानांतर पंक्ति और ‘निर्धनता’ के संदर्भ में ‘विनाश’ निर्धनता को निर्धनों के पतन का कारण बताने वाले आशय को सबसे सीधे व्यक्त करता है।
- source_word: דַּלִּים
  choice: निर्धनों
  rationale: यह गरीब या साधनहीन लोगों के लिए प्रयुक्त है। ‘निर्धनों’ संक्षिप्त, सम्मानजनक और काव्यात्मक समानांतरता के अनुकूल है।
- source_word: רֵישָׁם
  choice: उनकी निर्धनता
  rationale: इसका अर्थ गरीबी, अभाव या दीन दशा है। ‘उनकी निर्धनता’ मूल के सीधा संबंध और आर्थिक विरोध को बनाए रखता है।
theological_decisions:
- issue: धन और निर्धनता के बारे में कथन का स्वरूप
  choice: पद को जीवन के एक प्रेक्षण के रूप में बिना नैतिक अनुमोदन जोड़े प्रस्तुत किया गया है।
  alternative: इसे धनवान की सुरक्षा की प्रशंसा या निर्धनों की निंदा के रूप में स्पष्ट करना।
  rationale: मूल पाठ केवल धन के सुरक्षात्मक प्रभाव और गरीबी के विनाशकारी प्रभाव का तनावपूर्ण समानांतर रखता है; वह यहाँ न तो धन को धार्मिक गुण घोषित करता है, न निर्धनों को दोषी ठहराता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों अर्धपंक्तियों की आर्थिक और काव्यात्मक समानांतरता बनाए रखने के लिए ‘धनवान/निर्धनों’ तथा ‘संपत्ति/निर्धनता’ का संतुलित प्रयोग किया गया है।
