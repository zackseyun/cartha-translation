id: PRO.10.3
reference: Proverbs 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא יַרְעִ֣יב יְ֭הוָה נֶ֣פֶשׁ צַדִּ֑יק וְ/הַוַּ֖ת רְשָׁעִ֣ים יֶהְדֹּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/003.yaml
  text: Yahweh will not let the righteous person go hungry[a], but he drives away the craving of the wicked.
translation:
  language: hi
  text: 'याहवे धर्मी जन को भूखा नहीं रहने देता,

    पर दुष्टों की लालसा[a] को वह दूर धकेल देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इच्छा।” इब्रानी संज्ञा का अर्थ “विपत्ति” या “विनाश” भी समझा जा सकता है; तब अनुवाद होगा, “पर दुष्टों की विपत्ति को वह दूर धकेल देता है।”
    reason: इब्रानी הַוַּת की अर्थगत अस्पष्टता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: לֹא יַרְעִיב
  choice: भूखा नहीं रहने देता
  rationale: हिफ़ील क्रिया का कारणवाचक अर्थ बनाए रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है और ‘भूखों मारना’ जैसा अतिशयोक्तिपूर्ण भाव नहीं देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נֶפֶשׁ צַדִּיק
  choice: धर्मी जन
  rationale: यहाँ נֶפֶשׁ पूरे जीवित व्यक्ति को सूचित करता है, किसी अभौतिक ‘आत्मा’ को अलग से नहीं; ‘धर्मी जन’ हिन्दी में स्वाभाविक और समावेशी है।
- source_word: הַוַּת
  choice: लालसा
  rationale: पहले चरण की भूख के साथ समानांतरता के कारण यहाँ ‘इच्छा/लालसा’ अर्थ संदर्भ में अधिक संभावित है; ‘विपत्ति/विनाश’ की वास्तविक वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह नैतिक रूप से बुरे लोगों के लिए प्रयुक्त विशेषण का संज्ञात्मक बहुवचन है।
- source_word: יֶהְדֹּף
  choice: दूर धकेल देता है
  rationale: यह क्रिया धकेलने, हटा देने या परे करने का सशक्त चित्र प्रस्तुत करती है; चयन उस भौतिक रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है; उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: נֶפֶשׁ का अर्थ
  choice: धर्मी जन
  alternative: धर्मी की आत्मा / धर्मी का प्राण / धर्मी की भूख
  rationale: संदर्भ में शब्द समूचे व्यक्ति को दर्शाता है। इस चयन से शरीर और आत्मा के विषय में कोई ऐसी तकनीकी धारणा पाठ में नहीं जोड़ी जाती जो यहाँ स्पष्ट नहीं है।
- issue: הַוַּת רְשָׁעִים का अर्थ
  choice: दुष्टों की लालसा
  alternative: दुष्टों की विपत्ति / दुष्टों का विनाश
  rationale: भूख के साथ काव्यात्मक समानांतरता ‘लालसा’ का समर्थन करती है, पर इब्रानी संज्ञा की दूसरी मान्य समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: कहावत में क्रियाओं का काल-पक्ष
  choice: वर्तमानकालीन सामान्य सत्य—‘नहीं रहने देता… दूर धकेल देता है’
  alternative: भविष्यकाल—‘नहीं रहने देगा… दूर धकेल देगा’
  rationale: इब्रानी यिक़्तोल यहाँ कहावत के सामान्य, चरित्रगत कथन के रूप में समझा जा सकता है; हिन्दी का सामान्य वर्तमान इस प्रकार के नीतिवचन के लिए अधिक स्वाभाविक है और भविष्य-संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। दो काव्य-पंक्तियों में विरोधी समानांतरता दिखाई गई है। ‘धर्मी जन’ लिंग-समावेशी है, और ‘दूर धकेल देता है’ मूल क्रिया के सजीव रूपक को बनाए रखता है।
