  text: צַדִּ֣יק לְ/עוֹלָ֣ם בַּל יִמּ֑וֹט וּ֝/רְשָׁעִ֗ים לֹ֣א יִשְׁכְּנוּ אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/030.yaml
  text: The righteous will never be shaken[a], but the wicked will not dwell in the land.
translation:
  language: hi
  text: धर्मी कभी नहीं डगमगाएगा, पर दुष्ट लोग देश[a] में नहीं बसेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी।” इब्रानी शब्द אֶרֶץ किसी विशिष्ट देश या भूमि को, अथवा व्यापक रूप से पृथ्वी को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में किसी धर्मी व्यक्ति को सामान्य या प्रतिनिधिक अर्थ में दर्शाता है। ‘धर्मी’ संक्षिप्त, स्वाभाविक और लिंग का अनावश्यक उल्लेख किए बिना सामान्य कथन का बल बनाए रखता है।
- source_word: לְעוֹלָם ... בַּל
  choice: कभी नहीं
  rationale: ‘सदा/हमेशा’ और काव्यात्मक निषेध के मेल का मुहावरेदार अर्थ स्थायी निषेध है; इसलिए ‘कभी नहीं’ स्वाभाविक हिन्दी में उसका बल व्यक्त करता है।
- source_word: יִמּוֹט
  choice: डगमगाएगा
  rationale: מוט का निफ़ाल रूप हिलने या अस्थिर होने का रूपक व्यक्त करता है। ‘डगमगाएगा’ इस स्थिरता-अस्थिरता के चित्र को बनाए रखता है और ‘नष्ट होगा’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: רְשָׁעִים
  choice: दुष्ट लोग
  rationale: बहुवचन संज्ञात्मक विशेषण नैतिक रूप से दुष्ट व्यक्तियों के वर्ग को दर्शाता है। आधुनिक हिन्दी में ‘दुष्ट लोग’ स्पष्ट और सहज है।
- source_word: יִשְׁכְּנוּ
  choice: बसे नहीं रहेंगे
  rationale: שכן का अर्थ बसना, निवास करना या टिककर रहना है। ‘बसे नहीं रहेंगे’ केवल रहने की क्रिया नहीं, बल्कि स्थायी निवास और बने रहने—दोनों की छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אֶרֶץ किसी विशिष्ट देश/भूमि या व्यापक रूप से पृथ्वी को दर्शा सकता है। यहाँ निवास के संदर्भ में ‘देश’ उपयुक्त है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: नीतिवचन धर्मी की स्थिरता की तुलना दुष्टों के स्थायी निवास खोने से करता है। ‘देश’ इस्राएल की भूमि से संभावित वाचाई प्रतिध्वनि को खुला रखता है, जबकि ज्ञान-साहित्य में समस्त पृथ्वी का व्यापक अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद की समानांतर काव्यात्मक संरचना और स्थिरता बनाम निवास-विहीनता का विरोध सुरक्षित है।
