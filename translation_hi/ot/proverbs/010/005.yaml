base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/005.yaml
  text: He who gathers in summer is a prudent son[b][a], but he who sleeps during harvest is a son who brings shame.
translation:
  language: hi
  text: जो गर्मी में बटोरता है, वह समझदार बेटा है[a]; पर जो कटनी के समय सोता है, वह लज्जा का कारण बनने वाला बेटा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बेटा’ पुल्लिंग एकवचन है। नीतिवचन में यह पिता द्वारा बेटे को दी जाने वाली शिक्षा की शैली बनाए रखते हुए कई बार प्रतिनिधि अर्थ भी रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: אֹגֵר
  choice: बटोरता है
  rationale: यह कृदन्त उपज इकट्ठी करने की क्रिया बताता है। ‘बटोरता है’ कृषि-संदर्भ में स्वाभाविक है और भंडारण के परिणाम को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בַּקַּיִץ
  choice: गरमी के मौसम में
  rationale: यह कृषि-कार्य के उपयुक्त ग्रीष्मकाल को सूचित करता है। आधुनिक हिन्दी में ‘गरमी के मौसम में’ स्पष्ट और सहज है।
- source_word: בֵּן
  choice: बेटा
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और नीतिवचन की पिता-से-पुत्र उपदेशात्मक शैली को बनाए रखता है; साथ ही यहाँ इसका उदाहरणात्मक व्यापक प्रयोग हो सकता है।
- source_word: מַשְׂכִּיל
  choice: समझदार
  rationale: यह व्यावहारिक सूझ-बूझ से उचित समय पर काम करने वाले व्यक्ति को दर्शाता है। ‘समझदार’ साधारण आधुनिक हिन्दी में इस व्यवहारिक बुद्धिमत्ता को स्पष्ट करता है।
- source_word: נִרְדָּם
  choice: सोता रहता है
  rationale: यह कृदन्त अनुचित समय में सोने की स्थिति या आचरण को व्यक्त करता है। ‘सोता रहता है’ उसकी निष्क्रियता का स्वाभाविक हिन्दी चित्र देता है।
- source_word: בַּקָּצִיר
  choice: कटनी के समय
  rationale: यह उस निर्णायक अवधि को बताता है जब फसल काटने और बटोरने का काम होना चाहिए। ‘कटनी के समय’ स्पष्ट और ग्रामीण-कृषि संदर्भ के अनुकूल है।
- source_word: מֵבִישׁ
  choice: लज्जा लाने वाला
  rationale: 'हिफ़ील कृदन्त का कारक भाव है: ऐसा बेटा स्वयं केवल लज्जाजनक नहीं, बल्कि अपने आचरण से लज्जा लाता है।'
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर संरचना—उचित मौसम में परिश्रम बनाम कटनी में नींद—स्पष्ट रखी गई है। ‘बेटा’ को लिंग-निरपेक्ष नहीं बनाया गया, और מֵבִישׁ का कारक अर्थ ‘लज्जा लाने वाला’ से सुरक्षित रखा गया है।
