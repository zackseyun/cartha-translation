  text: שִׂפְתֵ֣י צַ֭דִּיק יִרְע֣וּ רַבִּ֑ים וֶֽ֝/אֱוִילִ֗ים בַּ/חֲסַר לֵ֥ב יָמֽוּתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/021.yaml
  text: The lips of the righteous feed many[b][a], but fools die for lack of sense.
translation:
  language: hi
  text: धर्मी के होंठ बहुतों का पोषण करते हैं[a], पर मूर्ख समझ की कमी के कारण[b] मर जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुतों को चराते हैं’ अथवा ‘बहुतों को खिलाते हैं’; इब्रानी क्रिया का अर्थ ‘चराना,’ ‘रखवाली करना’ या ‘पोषण देना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘हृदय की कमी के कारण’; इब्रानी में ‘हृदय’ प्रायः समझ और निर्णय-शक्ति को भी दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: होंठ
  rationale: मूल इब्रानी बिंब को बनाए रखता है; यहाँ ‘होंठ’ वाणी के लिए लक्षणा है और हिन्दी में भी अर्थ स्पष्ट है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में एक प्रतिनिधि धर्मी व्यक्ति को दर्शाता है; ‘धर्मी’ संक्षिप्त, स्वाभाविक और लिंग की अनावश्यक व्याख्या से बचने वाला रूप है।
- source_word: יִרְעוּ
  choice: पोषण करते हैं
  rationale: רעה का मूल अर्थ चराना, रखवाली करना या खिलाना है। होंठों को कर्ता मानने पर आशय यह है कि धर्मी की वाणी अनेक लोगों को आत्मिक और नैतिक पोषण देती है; ‘पोषण करते हैं’ रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רַבִּים
  choice: बहुतों का
  rationale: इब्रानी में संज्ञा रूप में प्रयुक्त बहुवचन का सीधा अर्थ ‘बहुत-से लोग’ है; ‘बहुतों का’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֱוִילִים
  choice: मूर्ख
  rationale: नीतिवचन में यह शब्द केवल कम बुद्धि वाले नहीं, बल्कि नैतिक रूप से हठी और विवेकहीन लोगों के लिए प्रयुक्त होता है; ‘मूर्ख’ इसका स्थापित हिन्दी समतुल्य है।
- source_word: בַּחֲסַר לֵב
  choice: समझ की कमी के कारण
  rationale: शाब्दिक अर्थ ‘हृदय की कमी में/के कारण’ है, पर इब्रानी विचार में ‘हृदय’ समझ और निर्णय-शक्ति का केंद्र भी है। यह चयन मुहावरे का आशय आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: יָמוּתוּ
  choice: मर जाते हैं
  rationale: क्रिया का सीधा अर्थ ‘मरना’ है। नीतिवचनात्मक सामान्य सत्य व्यक्त करने के लिए हिन्दी का सामान्य वर्तमान ‘मर जाते हैं’ उपयुक्त है और इसे केवल ‘नाश होना’ बनाकर अर्थ को हल्का नहीं करता।
theological_decisions:
- issue: धर्मी की वाणी द्वारा ‘पोषण’ का स्वरूप
  choice: ‘पोषण’ के रूपक को बिना किसी विशिष्ट आध्यात्मिक या सांप्रदायिक व्याख्या के रखा गया है।
  alternative: इसे केवल ‘शिक्षा देना,’ ‘मार्गदर्शन करना’ या किसी विशेष प्रकार की धार्मिक सेवा बताना।
  rationale: मूल क्रिया चराने/खिलाने का व्यापक रूपक रखती है; संदर्भ उसके प्रभाव को वाणी से मिलने वाले लाभ तक सीमित करता है, पर उसका ठीक स्वरूप निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन की गरिमा के अनुरूप रखी गई है। ‘होंठ’ का मूल बिंब तथा ‘मर जाते हैं’ का स्पष्ट अर्थ सुरक्षित है, जबकि ‘समझ की कमी’ इब्रानी मुहावरे को साधारण पाठक के लिए स्वाभाविक बनाता है।
