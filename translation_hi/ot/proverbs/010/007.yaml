lexical_decisions:
- source_word: זֵכֶר
  choice: स्मृति
  rationale: यह संज्ञा किसी व्यक्ति की याद या उसके स्मरण को दर्शाती है। ‘स्मृति’ आधुनिक, गरिमापूर्ण हिंदी में स्वाभाविक है और ‘नाम’ के साथ पद का समानांतर विरोध बनाए रखती है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ संज्ञा के रूप में एक प्रतिनिधि धार्मिक व्यक्ति के लिए प्रयुक्त है। ‘धर्मी’ संक्षिप्त है और अनावश्यक रूप से लिंग को प्रमुख नहीं बनाता।
- source_word: לִבְרָכָה
  choice: आशीष का कारण होती है
  rationale: इब्रानी में शाब्दिक रूप से ‘आशीष के लिए’ है। हिंदी में यह वाक्यांश उस अर्थ को स्वाभाविक ढंग से व्यक्त करता है कि धर्मी का स्मरण आशीषदायक होता है, बिना इसे केवल स्वयं ‘आशीष’ के बराबर ठहराने के।
- source_word: שֵׁם
  choice: नाम
  rationale: ‘नाम’ सीधा समतुल्य है और ख्याति, प्रतिष्ठा तथा विरासत के व्यापक इब्रानी भाव को खुला रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में नैतिक श्रेणी बताता है। संबंधसूचक रचना में ‘दुष्टों का नाम’ स्वाभाविक हिंदी है।
- source_word: יִרְקָב
  choice: सड़ जाएगा
  rationale: क्रिया सड़ने या गलने की सजीव छवि प्रस्तुत करती है। ‘सड़ जाएगा’ इस ठोस और तीखे रूपक को सुरक्षित रखता है।
