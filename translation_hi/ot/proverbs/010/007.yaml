  text: The memory of the righteous is a blessing[a], but the name of the wicked will rot.
translation:
  language: hi
  text: धर्मी का स्मरण आशीष है[a], पर दुष्टों का नाम सड़ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी का स्मरण आशीष के लिए है।”
