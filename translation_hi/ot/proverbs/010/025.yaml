  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/עֲב֣וֹר ס֭וּפָה וְ/אֵ֣ין רָשָׁ֑ע וְ֝/צַדִּ֗יק יְס֣וֹד עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/025.yaml
  text: When the storm passes[a], the wicked are no more[b], but the righteous are an everlasting foundation.
translation:
  language: hi
  text: जब आँधी गुज़र जाती है[a], तो दुष्ट नहीं रहता[b], पर धर्मी सदा रहने वाली नींव है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब तूफ़ान गुज़र जाता है,” “जब बवंडर गुज़रता है,” अथवा “आँधी के गुजरने पर।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ है, “और दुष्ट नहीं है।” आशय यह है कि दुष्ट लोप हो जाता या नाश हो जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּעֲבוֹר
  choice: जब ... गुज़र जाती है
  rationale: כ prefixed to the infinitive construct of עבר has a temporal sense here. The Hindi clause naturally presents the storm's passing as the event after which the contrast becomes evident.
- source_word: סוּפָה
  choice: आँधी
  rationale: סוּפָה denotes a violent storm or whirlwind. 'आँधी' is vivid and natural in modern Hindi; the footnote preserves the broader alternative 'तूफ़ान'.
- source_word: וְאֵין
  choice: नामोनिशान नहीं रहता
  rationale: The literal expression 'and there is no wicked' indicates that the wicked person has disappeared or perished. This Hindi idiom conveys that result clearly while a footnote gives the literal form.
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: The masculine singular is representative in this proverb. Hindi 'दुष्ट' retains the compact class designation without adding 'मनुष्य' or restricting the saying explicitly to men.
- source_word: וְצַדִּיק
  choice: पर धर्मी
  rationale: The conjunction is rendered adversatively because the parallel lines sharply contrast the fate of the wicked with the permanence of the righteous.
- source_word: יְסוֹד
  choice: नींव
  rationale: '''नींव'' is the direct, natural Hindi equivalent for the foundation or base denoted by יְסוֹד.'
- source_word: עוֹלָם
  choice: सदा बनी रहनेवाली
  rationale: עוֹלָם qualifies the foundation with enduring permanence. This phrase is idiomatic Hindi and avoids implying more precision about metaphysical eternity than the proverbial expression itself requires.
theological_decisions:
- issue: ज्ञान-साहित्य में प्रतिनिधिक पुल्लिंग एकवचन
  choice: '''दुष्ट'' और ''धर्मी'' को प्रतिनिधिक वर्ग-संज्ञाओं के रूप में रखना'
  alternative: '''दुष्ट पुरुष ... धर्मी पुरुष'''
  rationale: इब्रानी पुल्लिंग एकवचन यहाँ किसी एक पुरुष या केवल पुरुषों तक कथन को सीमित नहीं करता, बल्कि सामान्य प्रकार के व्यक्ति को दर्शाता है। इसलिए हिंदी में संक्षिप्त वर्ग-संज्ञाएँ मूल के प्रतिनिधिक अर्थ को बनाए रखती हैं।
- issue: धर्मी को 'सदा की नींव' कहने का अर्थ
  choice: 'रूपक को सीधे बनाए रखना: ''धर्मी सदा बनी रहनेवाली नींव है'''
  alternative: इसे व्याख्यात्मक रूप से 'धर्मी सदा स्थिर रहता है' कहना
  rationale: मूल पाठ धर्मी को केवल स्थिर नहीं कहता, बल्कि उसे יְסוֹד, 'नींव', कहता है। रूपक संभावित सामुदायिक और स्थायित्व-संबंधी अर्थों के लिए खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण रखी गई है। 'आँधी', 'नामोनिशान' और 'नींव' सामान्य पाठक के लिए सहज हैं। मुख्य पाठ में इब्रानी समानांतरता और तीखा विरोध सुरक्षित रखा गया है।
