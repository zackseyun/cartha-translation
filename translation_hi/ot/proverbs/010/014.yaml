source:
  edition: WLC
  text: חֲכָמִ֥ים יִצְפְּנוּ דָ֑עַת וּ/פִֽי אֱ֝וִיל מְחִתָּ֥ה קְרֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/014.yaml
  text: Wise men store up knowledge[c][b][a], but the mouth of a fool is near ruin.
translation:
  language: hi
  text: बुद्धिमान ज्ञान संजोकर रखते हैं,[a] परन्तु मूर्ख का मुँह विनाश के निकट है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “संजोकर रखते हैं” का अनुवाद “जमा करते हैं,” “सुरक्षित रखते हैं,” या “छिपाकर रखते हैं” भी हो सकता है; यहाँ ज्ञान को विवेकपूर्वक संचित और सुरक्षित रखने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यह संक्षिप्त नामवाची वाक्यांश है, जिसका अधिक शाब्दिक अर्थ “मूर्ख का मुँह—निकट विनाश” है। “विनाश” के लिए “विपत्ति,” “आतंक,” या “घबराहट” भी सम्भव हैं; और “परन्तु” के स्थान पर “और” भी अनुवादित किया जा सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है और सामान्यतः बुद्धिमान लोगों को दर्शाता है। हिंदी में ‘बुद्धिमान’ स्वाभाविक और नीतिवचन की सार्वभौमिक शैली के अनुरूप है।
- source_word: יִצְפְּנוּ
  choice: संजोकर रखते हैं
  rationale: צפן का अर्थ छिपाना, जमा करना या सुरक्षित रखना हो सकता है। यहाँ ज्ञान के विवेकपूर्ण संचय और संरक्षण का भाव है; ‘संजोकर रखते हैं’ इस रूपक को सहज हिंदी में व्यक्त करता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: नीतिवचन में דעת के लिए ‘ज्ञान’ मानक और संदर्भानुकूल शब्द है।
- source_word: וּפִי
  choice: परन्तु ... का मुँह
  rationale: वाव का मूल अर्थ ‘और’ है, किंतु समानांतर पंक्तियों में यहाँ बुद्धिमान और मूर्ख के बीच विरोध स्पष्ट है; इसलिए ‘परन्तु’ संबंध को स्वाभाविक रूप से प्रकट करता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह बुद्धि और नैतिक समझ से रहित या हठी व्यक्ति के लिए प्रचलित ज्ञान-साहित्य का शब्द है; ‘मूर्ख’ प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: מְחִתָּה
  choice: विनाश
  rationale: यह शब्द विनाश, विपत्ति, आतंक या घबराहट का अर्थ दे सकता है। मूर्ख के मुँह के परिणाम के संदर्भ में ‘विनाश’ सर्वाधिक उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: קְרֹבָה
  choice: निकट ले आता है
  rationale: शाब्दिक संरचना ‘विनाश निकट है’ भी हो सकती है। हिंदी में ‘मुँह विनाश को निकट ले आता है’ व्याकरणिक संबंध को स्पष्ट रखते हुए उस वास्तविक अस्पष्टता को पादटिप्पणी में दर्ज करता है।
theological_decisions:
- issue: दूसरी पंक्ति में मूर्ख के मुँह और निकट विनाश का संबंध
  choice: मूर्ख का मुँह विनाश को निकट ले आता है
  alternative: मूर्ख का मुँह निकट आता विनाश है / मूर्ख के मुँह के निकट विनाश है
  rationale: इब्रानी नामवाची वाक्यांश संक्षिप्त और कुछ अस्पष्ट है। कारणात्मक हिंदी पाठ संदर्भ में अर्थपूर्ण है, पर वैकल्पिक गैर-कारणात्मक समझ को पादटिप्पणी में रखा गया है ताकि कथन को अनावश्यक रूप से अंतिम न बनाया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सर्वसुलभ हिंदी। ‘संजोकर रखते हैं’ ज्ञान के सुरक्षित संचय का रूपक बनाए रखता है। ‘परन्तु’ काव्यात्मक विरोध को स्पष्ट करता है, जबकि इब्रानी वाव और दूसरी पंक्ति की संक्षिप्त संरचना के विकल्प पादटिप्पणी में दिए गए हैं।
