base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/009.yaml
  text: Whoever walks in integrity walks securely[a], but he who makes his ways crooked will be found out.
translation:
  language: hi
  text: 'जो खराई से चलता है, वह सुरक्षित चलता है,

    पर जो अपने मार्गों को टेढ़ा करता है, वह उजागर हो जाएगा[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पहचान लिया जाएगा’ अथवा ‘उसकी चाल प्रकट हो जाएगी।’ इब्रानी का अर्थ यह हो सकता है कि टेढ़ी चाल चलनेवाला जैसा है वैसा पहचान लिया जाएगा, या उसका आचरण खुल जाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: जो ... चलता है
  rationale: यह कृदंत किसी विशेष पुरुष को नहीं, बल्कि सामान्य रूप से हर ऐसे व्यक्ति को सूचित करता है जिसकी जीवन-चाल ऐसी है। ‘चलता है’ मूल के जीवन-मार्ग रूपक को बनाए रखता है।
- source_word: בַּתֹּם
  choice: खराई से
  rationale: תֹּם में चरित्र की अखंडता, निष्कपटता और नैतिक खराई का भाव है। ‘खराई से’ आधुनिक हिंदी में सहज है और पूर्ण निष्पापता का अनावश्यक दावा नहीं करता।
- source_word: יֵלֶךְ
  choice: चलता है
  rationale: पहले खंड में ‘चलता है’ की पुनरावृत्ति मूल इब्रानी की शब्द-संगति और जीवन-चाल के रूपक को सुरक्षित रखती है।
- source_word: בֶּטַח
  choice: सुरक्षित
  rationale: בֶּטַח मुख्यतः सुरक्षा और निश्चिंतता व्यक्त करता है। ‘सुरक्षित’ केवल मन के आत्मविश्वास के बजाय वस्तुगत सुरक्षा पर बल देता है।
- source_word: וּמְעַקֵּשׁ
  choice: पर जो ... टेढ़ा करता है
  rationale: עקשׁ का अर्थ टेढ़ा करना, मरोड़ना या विकृत करना है। यह चयन पहले खंड की सीधी और खरी चाल के साथ मूल विरोध को बनाए रखता है।
- source_word: דְּרָכָיו
  choice: अपने मार्गों को
  rationale: बहुवचन ‘मार्गों’ मूल के अनुरूप है और व्यक्ति के आचरण तथा जीवन-पद्धति का रूपक बनाए रखता है।
- source_word: יִוָּדֵעַ
  choice: उजागर हो जाएगा
  rationale: ידע का निफ़अल रूप ‘जाना जाएगा’, ‘पहचाना जाएगा’ या प्रसंगानुसार ‘उजागर हो जाएगा’ हो सकता है। विरोधात्मक कहावत में आशय है कि टेढ़ी चाल छिपी नहीं रहेगी; ‘उजागर हो जाएगा’ इसे स्वाभाविक हिंदी में व्यक्त करता है, जबकि पादटिप्पणी मूल की व्यापकता बताती है।
