  text: קֹ֣רֵֽץ עַ֭יִן יִתֵּ֣ן עַצָּ֑בֶת וֶ/אֱוִ֥יל שְׂ֝פָתַ֗יִם יִלָּבֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/010.yaml
  text: Whoever winks the eye causes grief[a], and a fool of lips will come to ruin.
translation:
  language: hi
  text: 'आँख मारने वाला दुःख पहुँचाता है,[a]

    और बोलने में मूर्ख नाश हो जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आँख मारने वाला दुःख देता है, और बकवादी मूर्ख नाश हो जाएगा।” दूसरी पंक्ति कठिन है; इब्रानी में उसका शाब्दिक रूप है, “होंठों का मूर्ख नाश हो जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹרֵץ עַיִן
  choice: आँख मारने वाला
  rationale: इब्रानी कृदंत सामान्य रूप से ऐसे व्यक्ति को दर्शाता है जो आँख मारकर गुप्त या कपटपूर्ण संकेत करता है। हिंदी में यह संक्षिप्त और स्वाभाविक है।
- source_word: יִתֵּן
  choice: पहुँचाता है
  rationale: मूल अर्थ ‘देना’ है, पर עַצָּבֶת के साथ इसका भाव ‘दुःख देना/पहुँचाना’ है। ‘दुःख पहुँचाता है’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: עַצָּבֶת
  choice: दुःख
  rationale: यह शब्द पीड़ा, शोक या मनोव्यथा को व्यक्त कर सकता है। ‘दुःख’ इस व्यापकता को बनाए रखता है और केवल शारीरिक पीड़ा तक सीमित नहीं करता।
- source_word: וֶאֱוִיל שְׂפָתַיִם
  choice: और मूर्ख होंठों वाला
  rationale: यह असामान्य अभिव्यक्ति इब्रानी के ‘होंठों का मूर्ख’ रूपक को यथासंभव बनाए रखती है और ऐसे मूर्ख की ओर संकेत करती है जिसकी मूर्खता उसकी वाणी में प्रकट होती है। अधिक व्याख्यात्मक ‘बकवादी मूर्ख’ को पादटिप्पणी में रखा गया है।
- source_word: יִלָּבֵט
  choice: नाश हो जाएगा
  rationale: यह दुर्लभ और कठिन क्रियारूप गिराए जाने, विनाश या बरबादी की परिणति दर्शाता है। ‘नाश हो जाएगा’ किसी अधिक विशिष्ट चित्र को थोपे बिना परिणाम को व्यक्त करता है।
theological_decisions:
- issue: दूसरी पंक्ति की कठिन इब्रानी अभिव्यक्ति
  choice: मूर्ख होंठों वाला नाश हो जाएगा
  alternative: बकवादी मूर्ख नाश हो जाएगा
  rationale: मुख्य पाठ में मूल की असामान्य संरचना और उसके अर्थगत तनाव को रखा गया है; सहज व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है। इसमें कोई विशेष सम्प्रदायगत अर्थ निहित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त नीतिवचन-शैली रखी गई है। पहली पंक्ति सहज और स्पष्ट है; दूसरी पंक्ति में मूल इब्रानी की जानबूझकर असामान्य अभिव्यक्ति को हल्का-सा शाब्दिक रखा गया है और अधिक स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
