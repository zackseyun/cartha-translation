  text: פִּֽי צַ֭דִּיק יָנ֣וּב חָכְמָ֑ה וּ/לְשׁ֥וֹן תַּ֝הְפֻּכ֗וֹת תִּכָּרֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/031.yaml
  text: The mouth of the righteous bears wisdom as fruit[b][a], but the tongue of perversity will be cut off.
translation:
  language: hi
  text: धर्मी का मुँह बुद्धि उगाता है[a], पर कुटिल बातें बोलनेवाली जीभ काट दी जाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि उपजाता है।” इब्रानी क्रिया अंकुर फूटने या फल लगने का बिंब देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “पर कुटिल जीभ काट दी जाएगी।” इब्रानी में ‘कुटिल बातें’ के लिए बहुवचन शब्द है, जो बार-बार कही जानेवाली विकृत बातों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: मुँह
  rationale: ठोस शारीरिक रूपक को बनाए रखता है और दूसरे चरण की ‘जीभ’ के साथ स्वाभाविक समानांतर बनाता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ किसी एक प्रतिनिधि व्यक्ति के द्वारा पूरे नैतिक वर्ग को दर्शाता है; ‘धर्मी’ हिन्दी में इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָנוּב
  choice: फल लाता है
  rationale: क्रिया के अंकुरित होने अथवा फल देने के जैविक बिंब को बनाए रखता है; केवल ‘उत्पन्न करता है’ कहने से यह बिंब धुँधला पड़ता।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: मूल अमूर्त संज्ञा का सीधा अनुवाद है; इसे अनावश्यक रूप से ‘बुद्धिमानी की बातें’ बनाकर विस्तृत नहीं किया गया।
- source_word: לְשׁוֹן תַּהְפֻּכוֹת
  choice: टेढ़ी बातें बोलनेवाली जीभ
  rationale: शाब्दिक ‘उलटफेरों/विकृतियों की जीभ’ हिन्दी में अस्वाभाविक है। यह चयन जीभ के रूपक और बहुवचन द्वारा संकेतित बार-बार के विकृत कथनों, दोनों को व्यक्त करता है।
- source_word: תִּכָּרֵת
  choice: काट दी जाएगी
  rationale: निफ़अल के निष्क्रिय भाव और मूल कथन की कठोरता को सुरक्षित रखता है, बिना इसे केवल ‘चुप करा दी जाएगी’ के रूप में समझाए।
theological_decisions:
- issue: जीभ के काटे जाने का आशय
  choice: काट दी जाएगी
  alternative: चुप करा दी जाएगी / मिटा दी जाएगी
  rationale: मूल पाठ कठोर ‘काटे जाने’ का रूपक देता है, पर यह स्पष्ट नहीं करता कि आशय शारीरिक दंड, विनाश या वाणी का अंत है; इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह’, ‘फल’ और ‘जीभ’ के ज्ञान-साहित्य संबंधी मूर्त बिंब सुरक्षित हैं; ‘टेढ़ी बातें बोलनेवाली’ बहुवचन और नैतिक विकृति को स्वाभाविक हिन्दी में व्यक्त करता है।
