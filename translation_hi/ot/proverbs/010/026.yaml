  text: Like vinegar to the teeth and smoke to the eyes[a], so is the sluggard to those who send him.
translation:
  language: hi
  text: जैसे सिरका दाँतों के लिए और धुआँ आँखों के लिए होता है, वैसे ही आलसी व्यक्ति उन लोगों के लिए होता है जो उसे भेजते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे खट्टी दाखरस दाँतों के लिए और धुआँ आँखों के लिए होता है, वैसे ही आलसी व्यक्ति उन लोगों के लिए होता है जो उसे भेजते हैं।”
    reason: חֹמֶץ का अर्थ संदर्भानुसार ‘सिरका’ या ‘खट्टी दाखरस’ हो सकता है।
