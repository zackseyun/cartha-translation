- source_word: לָעֵינַיִם
  choice: आँखों के लिए
  rationale: यह पहले उपमान के समानांतर संरचना बनाए रखता है और आँखों पर धुएँ के अप्रिय प्रभाव को व्यक्त करता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह तुलनात्मक कण उपमान से उसके अनुप्रयोग की ओर ले जाता है; ‘वैसे ही’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הֶעָצֵל
  choice: आलसी व्यक्ति
  rationale: संज्ञा के रूप में प्रयुक्त यह विशेषण आदतन आलसी मनुष्य को सूचित करता है। ‘आलसी व्यक्ति’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: לְשֹׁלְחָיו
  choice: उसे भेजनेवालों के लिए
  rationale: मूल रूप बहुवचन कर्ताओं और एकवचन कर्म को दर्शाता है—‘जो उसे भेजते हैं।’ यह अनुवाद उस संख्या-संबंध को सुरक्षित रखते हुए हिन्दी में संक्षिप्त है।
