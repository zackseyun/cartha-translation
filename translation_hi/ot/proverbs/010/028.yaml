  text: תּוֹחֶ֣לֶת צַדִּיקִ֣ים שִׂמְחָ֑ה וְ/תִקְוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/028.yaml
  text: The expectation of the righteous is joy[a], but the hope of the wicked will perish.
translation:
  language: hi
  text: 'धर्मियों की उम्मीद आनन्द है[a],

    पर दुष्टों की आशा नष्ट हो जाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले खंड में “उम्मीद” के स्थान पर “आशा” भी हो सकता है। यहाँ प्रयुक्त इब्रानी संज्ञा दूसरे खंड की “आशा” वाली संज्ञा से अलग है, यद्यपि दोनों के अर्थ एक-दूसरे से मिलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: प्रतीक्षा
  rationale: यह संज्ञा आशापूर्ण प्रतीक्षा या अपेक्षा को व्यक्त करती है। ‘प्रतीक्षा’ दूसरे खंड की תִקְוָה (‘आशा’) से शब्दगत भिन्नता बनाए रखती है, जबकि दोनों के अर्थों का निकट संबंध भी बना रहता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में उन लोगों के लिए प्रयुक्त है जो धर्मी हैं। ‘धर्मियों’ नीतिवचन की शैली में स्वाभाविक और संक्षिप्त है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: मूल संज्ञा हर्ष या आनन्द को दर्शाती है। ‘आनन्द’ आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: תִקְוַת
  choice: आशा
  rationale: इस संज्ञा का सामान्य अर्थ ‘आशा’ है। यह पहले खंड की आशापूर्ण प्रतीक्षा के समानांतर रहते हुए उसके विपरीत परिणाम को स्पष्ट करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में दुष्ट लोगों के वर्ग को दर्शाता है और ‘धर्मियों’ के साथ स्पष्ट विरोध स्थापित करता है।
- source_word: תֹּאבֵד
  choice: मिट जाएगी
  rationale: אבד का अर्थ नष्ट होना, खो जाना या समाप्त हो जाना हो सकता है। ‘मिट जाएगी’ यहाँ आशा के निष्फल होकर समाप्त हो जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरे खंड में नष्ट होने वाली वस्तु
  choice: दुष्टों की आशा मिट जाएगी।
  alternative: इसे व्यापक रूप से दुष्टों और उनकी आशाओं—दोनों के पतन का संकेत माना जा सकता है।
  rationale: स्त्रीलिंग एकवचन क्रिया תֹּאבֵד का व्याकरणिक संबंध स्त्रीलिंग संज्ञा תִקְוַת (‘आशा’) से है। इसलिए अनुवाद सीधे आशा के मिटने की बात करता है और दुष्टों के अंतिम भाग्य के विषय में इस पंक्ति से अधिक निष्कर्ष नहीं जोड़ता।
- issue: पहले खंड के क्रियारहित वाक्य का संबंध
  choice: ‘प्रतीक्षा आनन्द लाती है’ के रूप में परिणामसूचक संबंध व्यक्त किया गया है।
  alternative: ‘धर्मियों की प्रतीक्षा आनन्द है’ या ‘धर्मियों की प्रतीक्षा आनन्द बनेगी।’
  rationale: इब्रानी में पहले खंड में व्यक्त क्रिया नहीं है। हिन्दी में ‘आनन्द लाती है’ उस स्वाभाविक अर्थ को व्यक्त करता है कि धर्मियों की आशापूर्ण प्रतीक्षा का फल आनन्द है, बिना किसी अतिरिक्त सिद्धान्त को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। समानांतर पंक्तियों में ‘धर्मियों/दुष्टों’ और ‘प्रतीक्षा/आशा’ का विरोध स्पष्ट रखा गया है।
