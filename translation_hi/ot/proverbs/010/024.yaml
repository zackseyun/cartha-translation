  text: מְגוֹרַ֣ת רָ֭שָׁע הִ֣יא תְבוֹאֶ֑/נּוּ וְ/תַאֲוַ֖ת צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/024.yaml
  text: What the wicked dreads will come upon him[b][a], but the desire of the righteous will be granted.
translation:
  language: hi
  text: दुष्ट जिस बात से डरता है, वही उस पर आ पड़ेगी; पर धर्मियों की अभिलाषा पूरी की जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वह देगा।” कर्ता बताया नहीं गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְגוֹרַת רָשָׁע
  choice: दुष्ट जिस बात से डरता है
  rationale: מְגוֹרָה भय या भय की वस्तु, दोनों का बोध करा सकता है। यह स्वाभाविक हिन्दी उस बात को व्यक्त करती है जिससे दुष्ट डरता है, और नीतिवचन के सामान्य, प्रतिनिधिक एकवचन को बनाए रखती है।
- source_word: הִיא תְבוֹאֶנּוּ
  choice: वही उस पर आ पड़ेगी
  rationale: स्त्रीलिंग सर्वनाम का संकेत מְגוֹרַת की ओर है। ‘आ पड़ेगी’ भावी भयावह परिणाम के उस व्यक्ति पर आने को स्वाभाविक और प्रभावी हिन्दी में व्यक्त करता है।
- source_word: וְתַאֲוַת
  choice: पर ... अभिलाषा
  rationale: תַּאֲוָה इच्छा, लालसा या अभिलाषा है। सकारात्मक संदर्भ में ‘अभिलाषा’ गरिमापूर्ण और सहज है; וְ को विरोधात्मक समानांतरता के कारण ‘पर’ किया गया है।
- source_word: צַדִּיקִים
  choice: धर्मियों की
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और धर्मी जनों के वर्ग को सूचित करता है। ‘धर्मियों’ प्रचलित, संक्षिप्त और लिंग-समावेशी सामूहिक अभिव्यक्ति है।
- source_word: יִתֵּן
  choice: पूरी की जाएगी
  rationale: इब्रानी में क्रिया सक्रिय एकवचन है—शाब्दिक रूप से ‘वह देगा’—पर कर्ता व्यक्त नहीं है। हिन्दी का कर्मवाच्य अभिलाषा की पूर्ति का भाव देता है और देने वाले की पहचान को अनिर्धारित रखता है।
theological_decisions:
- issue: יִתֵּן का अव्यक्त कर्ता
  choice: कर्मवाच्य ‘पूरी की जाएगी’ द्वारा कर्ता को अव्यक्त रखना
  alternative: ‘वह पूरी करेगा’ अथवा ‘परमेश्वर पूरी करेगा’
  rationale: मूल इब्रानी कर्ता का नाम नहीं बताता। परमेश्वर की भूमिका निहित हो सकती है, पर उसे स्पष्ट कर्ता बनाना मूल की वास्तविक अस्पष्टता को समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘दुष्ट’ का प्रतिनिधिक एकवचन और ‘धर्मियों’ का सामूहिक बहुवचन सुरक्षित रखा गया है। मुख्य पाठ में केवल उसी वास्तविक अस्पष्टता पर टिप्पणी दी गई है जो अव्यक्त कर्ता से जुड़ी है।
