  text: אֹ֣רַח לְ֭/חַיִּים שׁוֹמֵ֣ר מוּסָ֑ר וְ/עוֹזֵ֖ב תּוֹכַ֣חַת מַתְעֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/017.yaml
  text: Whoever keeps discipline is on the path to life[a], but whoever forsakes reproof leads others astray.
translation:
  language: hi
  text: जो अनुशासन का पालन करता है, वह जीवन की राह पर है[a], परन्तु जो फटकार को त्याग देता है, वह दूसरों को भटका देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जीवन की राह है।” इब्रानी वाक्य संक्षिप्त है और “जीवन की राह” को विधेय के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: राह
  rationale: यह शब्द मार्ग, सड़क या जीवन-क्रम को दर्शाता है। नीतिवचन के नैतिक रूपक को स्वाभाविक आधुनिक हिन्दी में बनाए रखने के लिए ‘राह’ चुना गया है।
- source_word: לְחַיִּים
  choice: जीवन की ओर / जीवन की
  rationale: לְ यहाँ दिशा या परिणाम का बोध करा सकता है। मुख्य पाठ में ‘जीवन की राह पर’ स्वाभाविक हिन्दी में जीवन की ओर ले जाने वाले मार्ग का भाव व्यक्त करता है; संक्षिप्त विधेय-वाचन पाद-टिप्पणी में सुरक्षित है।
- source_word: שׁוֹמֵר
  choice: पालन करता है
  rationale: मूल कृदन्त का अर्थ संभालना, मानना या पालन करना है। ‘अनुशासन का पालन करता है’ निरन्तर ग्रहणशीलता और आचरण दोनों को स्पष्ट तथा सहज रूप में व्यक्त करता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन को समेटता है। ‘अनुशासन’ इसकी गठनकारी और सुधारकारी दोनों शक्तियों को संक्षेप में रखता है।
- source_word: וְעוֹזֵב
  choice: परन्तु जो ... त्याग देता है
  rationale: वाव यहाँ विरोध प्रकट करता है, इसलिए ‘परन्तु’ उपयुक्त है। עזב का मूल भाव छोड़ना या त्यागना है; ‘त्याग देता है’ इस नैतिक अस्वीकार की गंभीरता बनाए रखता है।
- source_word: תּוֹכַחַת
  choice: फटकार
  rationale: यह शब्द गलती बताकर किए गए सुधार, उलाहने या डाँट को दर्शाता है। ‘फटकार’ सामान्य पाठक के लिए स्पष्ट है और सुधारात्मक विरोध का बल बनाए रखता है।
- source_word: מַתְעֶה
  choice: दूसरों को भटका देता है
  rationale: यह תעה का हिफ़ील कृदन्त है और कारणवाचक अर्थ देता है—किसी को भटकाना। मूल में कर्म व्यक्त नहीं है, इसलिए हिन्दी में आवश्यक अस्पष्ट कर्म ‘दूसरों को’ जोड़ा गया है।
theological_decisions:
- issue: पहले खण्ड में व्यक्ति और ‘जीवन की राह’ का सम्बन्ध
  choice: मुख्य पाठ में ‘वह जीवन की राह पर है’
  alternative: ‘वह जीवन की राह है’
  rationale: इब्रानी वाक्य अत्यन्त संक्षिप्त है और दोनों वाचन सम्भव हैं। मुख्य पाठ व्यक्ति के जीवन की ओर बढ़ने का अर्थ सहज हिन्दी में देता है, जबकि वैकल्पिक विधेय-वाचन—जिसमें अनुशासन मानने वाला दूसरों के लिए जीवन की राह बनता है—पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ‘राह’, ‘अनुशासन’, ‘फटकार’ और ‘भटका देता है’ सामान्य पाठक के लिए सहज हैं तथा मूल के मार्ग-रूपक, सुधारात्मक बल और कारणवाचक क्रिया को बनाए रखते हैं।
