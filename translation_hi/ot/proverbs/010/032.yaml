source:
  edition: WLC
  text: שִׂפְתֵ֣י צַ֭דִּיק יֵדְע֣וּ/ן רָצ֑וֹן וּ/פִ֥י רְ֝שָׁעִ֗ים תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/010/032.yaml
  text: The lips of the righteous know what is acceptable[b][a], but the mouth of the wicked speaks perversity.
translation:
  language: hi
  text: धर्मी के होंठ जानते हैं कि क्या स्वीकार्य है[a], पर दुष्टों का मुँह विकृत बातें कहता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्या मनभावन है’ अथवा ‘कृपा’। इब्रानी संज्ञा कृपा, सद्भाव या स्वीकार्य/उचित बात का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से केवल ‘पर दुष्टों का मुँह—विकृत बातें’ है; स्पष्टता के लिए ‘कहता है’ जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂפְתֵי צַדִּיק
  choice: धर्मी के होंठ
  rationale: मूल के सजीव अंग-वाचक रूपक और दूसरे चरण के ‘मुँह’ के साथ काव्यात्मक समानांतरता को बनाए रखता है। एकवचन ‘धर्मी’ यहाँ किसी भी धर्मी व्यक्ति का प्रतिनिधित्व करता है।
- source_word: יֵדְעוּן
  choice: जानते हैं
  rationale: सामान्य अर्थ ‘जानना’ को बनाए रखा गया है; प्रसंग में उचित वाणी पहचानने की समझ निहित है, पर उसे व्याख्यात्मक रूप से पाठ में नहीं जोड़ा गया।
- source_word: רָצוֹן
  choice: क्या स्वीकार्य है
  rationale: यहाँ संज्ञा उस बात को सूचित कर सकती है जो अनुकूल, मनभावन या उचित हो। ‘क्या स्वीकार्य है’ वाणी के प्रसंग में स्वाभाविक है और अर्थ को केवल परमेश्वर की कृपा तक सीमित नहीं करता।
- source_word: וּפִי רְשָׁעִים
  choice: पर दुष्टों का मुँह
  rationale: ‘पर’ विरोध को स्पष्ट करता है और ‘मुँह’ पहले चरण के ‘होंठ’ के साथ मूल की ठोस काव्यात्मक समानांतरता बचाता है।
- source_word: תַּהְפֻּכוֹת
  choice: विकृत बातें
  rationale: बहुवचन संज्ञा टेढ़ी, उलटी या नैतिक रूप से विकृत अभिव्यक्तियों को दर्शाती है। ‘विकृत बातें’ आधुनिक हिंदी में स्पष्ट रहते हुए बहुवचन भाव को बनाए रखता है।
