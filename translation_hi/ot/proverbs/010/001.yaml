  yaml_path: translation/ot/proverbs/010/001.yaml
  text: 'The proverbs of Solomon: a wise son makes a father glad[a], but a foolish son is the grief of his mother.'
translation:
  language: hi
  text: 'सुलैमान के नीतिवचन:

    बुद्धिमान बेटा पिता को आनन्दित करता है,

    परन्तु मूर्ख बेटा अपनी माँ का दुःख है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁלֵי
  choice: नीतिवचन
  rationale: מָשָׁל के बहुवचन-सम्बन्ध रूप को संग्रह के शीर्षक के रूप में लिया गया है। ‘नीतिवचन’ हिन्दी में इस साहित्यिक विधा और पुस्तक के परिचित नाम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित बाइबलीय रूप रखा गया है।
- source_word: בֵּן
  choice: बेटा
  rationale: इब्रानी शब्द स्पष्ट रूप से पुल्लिंग एकवचन है। ‘बेटा’ साधारण आधुनिक हिन्दी में स्वाभाविक है और ‘पुत्र’ की अपेक्षा अधिक जनसुलभ है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: नीतिवचन में यह नैतिक और व्यावहारिक विवेक को दर्शाता है; ‘बुद्धिमान’ כְּסִיל के साथ स्पष्ट विरोध बनाता है।
- source_word: יְשַׂמַּח
  choice: आनन्दित करता है
  rationale: हिफ़ईल रूप का कारणवाचक अर्थ—आनन्दित करना—सीधे और गरिमापूर्ण ढंग से व्यक्त होता है।
- source_word: אָב
  choice: पिता
  rationale: मूल में कोई स्वत्ववाचक प्रत्यय नहीं है। बिना ‘अपने’ जोड़े ‘पिता’ कहना मूल की सामान्य लोकोक्तिपरक प्रकृति और दूसरे अर्धांश की असमानता को बनाए रखता है।
- source_word: וּבֵן
  choice: परन्तु ... बेटा
  rationale: वाव का मूल अर्थ ‘और’ है, किन्तु विरोधात्मक समानांतरता में हिन्दी ‘परन्तु’ दोनों अर्धांशों का आशय स्पष्ट करती है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: यह केवल कम बुद्धि नहीं, बल्कि नैतिक और व्यावहारिक मूर्खता का सूचक है; हिन्दी ‘मूर्ख’ इस ज्ञान-साहित्यिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: תּוּגַת
  choice: का दुःख
  rationale: सम्बन्ध-रचना को निकटता से रखते हुए ‘अपनी माँ का दुःख’ पद्य की संक्षिप्तता बनाए रखता है।
- source_word: אִמּוֹ
  choice: अपनी माँ
  rationale: तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को हिन्दी के स्वाभाविक निजवाचक ‘अपनी’ से व्यक्त किया गया है, जिसका सम्बन्ध ‘मूर्ख बेटा’ से है।
