id: PRO.25.2
reference: Proverbs 25:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּבֹ֣ד אֱ֭לֹהִים הַסְתֵּ֣ר דָּבָ֑ר וּ/כְבֹ֥ד מְ֝לָכִ֗ים חֲקֹ֣ר דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/002.yaml
  text: It is the glory of God to conceal a matter[b][a], and the glory of kings to search out a matter.
translation:
  language: hi
  text: किसी बात को छिपाना परमेश्वर की महिमा[a] है, और किसी बात की खोजबीन करना राजाओं की महिमा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गौरव”; दोनों पंक्तियों में।
    reason: lexical_alternative
  - marker: b
    text: “छिपाना” का अनुवाद “गुप्त रखना,” और “खोजबीन करना” का अनुवाद “जाँच करना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹד
  choice: महिमा
  rationale: यह शब्द प्रतिष्ठा, गौरव या वैभव का बोध कराता है। दोनों पंक्तियों में एक ही शब्द रखकर परमेश्वर और राजाओं से जुड़ी काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस्राएल की ज्ञान-परंपरा के इस संदर्भ में यह शब्द एकमात्र परमेश्वर को सूचित करता है।
- source_word: הַסְתֵּר
  choice: छिपाना
  rationale: यह उद्देश्यपूर्ण ढंग से किसी बात को प्रकट न करने का भाव देता है और आधुनिक हिन्दी में सहज तथा स्पष्ट है।
- source_word: דָּבָר
  choice: किसी बात
  rationale: यहाँ शब्द का अर्थ केवल बोला हुआ वचन नहीं, बल्कि विचाराधीन बात, विषय या मामला है। दोनों पंक्तियों में इसे समान रूप से रखा गया है।
- source_word: וּ/כְבֹד
  choice: और ... महिमा
  rationale: संयोजक को सामान्य समन्वय के रूप में रखकर अनावश्यक विरोध नहीं जोड़ा गया; तुलना और तनाव पाठ से स्वयं उभरते हैं।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: मूल पाठ विशेष रूप से राजाओं का उल्लेख करता है; इसे व्यापक अर्थ वाले ‘शासकों’ में नहीं बदला गया।
- source_word: חֲקֹר
  choice: खोजबीन करना
  rationale: यह किसी बात की तह तक पहुँचने के लिए ध्यानपूर्वक खोज या जाँच करने का अर्थ देता है और राजकीय विवेक के संदर्भ में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के छिपाने और राजाओं के खोजने के बीच संबंध
  choice: दोनों पंक्तियों को उनके सीधे काव्यात्मक समानांतर रूप में रखा गया है।
  alternative: इसे केवल दैवी रहस्य और मानवीय शासन के विरोध के रूप में समझाना, या यह कहना कि राजा अनिवार्यतः वही खोजते हैं जिसे परमेश्वर ने छिपाया है।
  rationale: मूल कहावत परमेश्वर और राजाओं के अपने-अपने गौरवपूर्ण कार्यों को साथ रखती है, पर उनके संबंध की विस्तृत धर्मवैज्ञानिक व्याख्या नहीं करती। अनुवाद उस तनाव और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘महिमा’ से काव्यात्मक ऊँचाई तथा दोनों पंक्तियों की शब्दगत समानांतरता बनी रहती है; ‘खोजबीन’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल क्रिया की गहन जाँच का भाव व्यक्त करती है।
