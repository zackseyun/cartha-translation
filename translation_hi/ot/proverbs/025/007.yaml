language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י ט֥וֹב אֲמָר לְ/ךָ֗ עֲֽלֵ֫ה הֵ֥נָּה מֵֽ֭/הַשְׁפִּ֣ילְ/ךָ לִ/פְנֵ֣י נָדִ֑יב אֲשֶׁ֖ר רָא֣וּ עֵינֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/007.yaml
  text: For it is better that it be said to you[b][a], “Come up here,” than that you be humbled before a nobleman whom your eyes have seen.
translation:
  language: hi
  text: क्योंकि यह बेहतर है कि तुमसे कहा जाए, “यहाँ ऊपर आओ,” बजाय इसके कि तुम्हें उस कुलीन व्यक्ति के सामने नीचा किया जाए, जिसे तुम्हारी आँखों ने देखा है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिसे तुम्हारी आँखों ने देखा है” मूल इब्रानी की सजीव अभिव्यक्ति है; इसका सरल अनुवाद “जिसे तुमने देखा है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹב ... מִן
  choice: यह ... अच्छा है ... बजाय इसके कि
  rationale: מִן के साथ טוֹב तुलनात्मक अर्थ देता है। हिन्दी की यह रचना ‘एक बात दूसरी से बेहतर है’ का भाव सहज ढंग से प्रकट करती है।
- source_word: אֲמָר לְךָ
  choice: यह सुनना
  rationale: मूल में कहने वाला अनिर्दिष्ट है। ‘यह सुनना’ हिन्दी में निष्क्रिय भाव को स्वाभाविक रखता है और अनावश्यक कर्ता नहीं जोड़ता।
- source_word: עֲלֵה הֵנָּה
  choice: यहाँ ऊपर आओ
  rationale: आज्ञार्थक क्रिया स्थान और सामाजिक पद—दोनों में ऊपर बुलाए जाने का संकेत दे सकती है; अनुवाद इस द्विअर्थी छवि को बनाए रखता है।
- source_word: מֵהַשְׁפִּילְךָ
  choice: तुम्हें नीचा किया जाए
  rationale: हिफ़ील रूप किसी के पद या स्थान को नीचे किए जाने को दर्शाता है। ‘नीचा किया जाए’ स्थानगत और सामाजिक अपमान, दोनों संभावनाओं को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह किसी की उपस्थिति में सार्वजनिक रूप से घटना घटने का भाव देता है।
- source_word: נָדִיב
  choice: प्रतिष्ठित व्यक्ति
  rationale: यह शब्द ऊँचे सामाजिक पद वाले कुलीन या प्रधान व्यक्ति को सूचित करता है। ‘प्रतिष्ठित व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और उसे अनिवार्य रूप से राजकुमार या शासक नहीं बनाता।
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: जिसे तुम्हारी आँखों ने देखा है
  rationale: मूल की सजीव देहगत अभिव्यक्ति को सुरक्षित रखा गया है; यह साधारण ‘जिसे तुमने देखा है’ से अधिक औपचारिक है, पर स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नीचा किया जाए’ को ‘अपमानित किया जाए’ पर वरीयता दी गई, ताकि मूल में निहित स्थान या पद से नीचे किए जाने की छवि और सामाजिक लज्जा—दोनों बनी रहें।
