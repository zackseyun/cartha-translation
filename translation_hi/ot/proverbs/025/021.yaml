id: PRO.25.21
reference: Proverbs 25:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם רָעֵ֣ב שֹׂ֭נַאֲ/ךָ הַאֲכִלֵ֣/הוּ לָ֑חֶם וְ/אִם צָ֝מֵ֗א הַשְׁקֵ֥/הוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/021.yaml
  text: If your enemy is hungry[a], feed him bread, and if he is thirsty, give him water to drink.
translation:
  language: hi
  text: यदि तुम्हारा शत्रु[a] भूखा हो, तो उसे रोटी खिलाओ; और यदि वह प्यासा हो, तो उसे पानी पिलाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुमसे घृणा करने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक अव्यय है; ‘यदि’ हिब्रू की सशर्त अभिव्यक्ति को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רָעֵב
  choice: भूखा हो
  rationale: यह शत्रु की अवस्था बताने वाला विशेषण है; सशर्त उपवाक्य में ‘भूखा हो’ स्वाभाविक हिन्दी है।
- source_word: שֹׂנַאֲךָ
  choice: तुम्हारा शत्रु
  rationale: शाब्दिक अर्थ ‘तुमसे घृणा करने वाला’ है। मुख्य पाठ में ‘तुम्हारा शत्रु’ सम्बन्ध की विरोधी प्रकृति को सहज और संक्षिप्त हिन्दी में व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: הַאֲכִלֵהוּ
  choice: उसे ... खिलाओ
  rationale: हिफ़ील आज्ञार्थक रूप का अर्थ ‘उसे खाने को दो/उसे खिलाओ’ है; ‘खिलाओ’ कारणवाचक भाव को स्वाभाविक रूप से रखता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: हिब्रू में ठोस रूप से ‘रोटी’ है। व्यापक ‘भोजन’ के बजाय मूल बिम्ब सुरक्षित रखा गया है।
- source_word: וְאִם
  choice: और यदि
  rationale: यह दूसरे समानान्तर सशर्त उपवाक्य को जोड़ता है और हिब्रू की रचना को बनाए रखता है।
- source_word: צָמֵא
  choice: वह प्यासा हो
  rationale: यह पहले उपवाक्य के ‘भूखा हो’ के समानान्तर शत्रु की अवस्था बताता है; स्पष्टता के लिए हिन्दी में सर्वनाम दिया गया है।
- source_word: הַשְׁקֵהוּ
  choice: उसे ... पिलाओ
  rationale: हिफ़ील आज्ञार्थक रूप ‘उसे पीने को दो’ का भाव रखता है; ‘पिलाओ’ हिन्दी में इसका स्वाभाविक कारणवाचक रूप है।
- source_word: מָיִם
  choice: पानी
  rationale: यह क्रिया का स्पष्ट कर्म है और इसका साधारण शाब्दिक अर्थ ‘पानी’ ही है।
theological_decisions:
- issue: प्रतिनिधिक अर्थ वाले नीतिवचन में पुल्लिंग एकवचन
  choice: ‘तुम्हारा शत्रु ... उसे ... वह ... उसे’ के द्वारा एक व्यक्ति को सम्बोधित करने वाली एकवचन संरचना रखी गई है।
  alternative: लिंग-निरपेक्ष या बहुवचन रूप में सामान्यीकरण करना।
  rationale: हिब्रू में सम्बोधन तथा शत्रु से सम्बन्धित रूप पुल्लिंग एकवचन हैं, यद्यपि नीतिवचन का नैतिक निर्देश सामान्य रूप से लागू होता है। हिन्दी रूप मूल की व्यक्तिगत और प्रतिनिधिक शक्ति बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘रोटी’ और ‘पानी’ मूल के ठोस बिम्बों को सुरक्षित रखते हैं; समानान्तर सशर्त वाक्यरचना भी बनाए रखी गई है।
