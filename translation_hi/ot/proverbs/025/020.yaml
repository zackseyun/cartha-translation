source:
  edition: WLC
  text: מַ֥עֲדֶה בֶּ֨גֶד בְּ/י֣וֹם קָ֭רָה חֹ֣מֶץ עַל נָ֑תֶר וְ/שָׁ֥ר בַּ֝/שִּׁרִ֗ים עַ֣ל לֶב רָֽע׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/020.yaml
  text: Like one who takes off a garment on a cold day[a], and like vinegar on soda[b], is one who sings songs to a troubled heart.
translation:
  language: hi
  text: ठंड के दिन वस्त्र उतारना और खनिज क्षार पर सिरका डालना[a], व्यथित मन वाले के लिए गीत गाने के समान है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘खनिज क्षार’ के लिए मूल शब्द नैट्रॉन जैसे प्राकृतिक क्षार का संकेत करता है। सिरके के साथ इसका मेल अनुपयुक्त प्रतिक्रिया की छवि प्रस्तुत करता है।
    reason: lexical_alternative
  - marker: b
    text: मूल में शाब्दिक रूप से ‘बुरे मन पर’ है; यहाँ ‘बुरा’ नैतिक दुष्टता नहीं, बल्कि दुखी या व्यथित भीतरी दशा को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲדֶה
  choice: उतारने वाला
  rationale: क्रिया का अर्थ यहाँ पहना हुआ वस्त्र हटाना या उतारना है। यह अनुवाद ठंड में आवश्यक गरमी छीन लेने वाले असंगत काम का ठोस चित्र बनाए रखता है।
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: यह कपड़े के लिए सामान्य शब्द है। ‘वस्त्र’ संक्षिप्त, गरिमापूर्ण और नीतिवचन की शैली के अनुकूल है; किसी खास प्रकार के कपड़े को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: בְּיוֹם קָרָה
  choice: ठंड के दिन
  rationale: इब्रानी काल-सूचक पद का स्वाभाविक हिन्दी रूप, जो परिस्थिति की अनुपयुक्तता स्पष्ट करता है।
- source_word: חֹמֶץ
  choice: सिरका
  rationale: मूल शब्द का सामान्य और सीधा अर्थ।
- source_word: נָתֶר
  choice: खनिज क्षार
  rationale: यह नैट्रॉन जैसे प्राकृतिक खनिज क्षार को दर्शाता है, आधुनिक ‘बेकिंग सोडा’ को अनिवार्य रूप से नहीं। ‘खनिज क्षार’ पदार्थ की प्रकृति को सही और समझने योग्य ढंग से बताता है।
- source_word: וְשָׁר בַּשִּׁרִים
  choice: गीत गाने वाला
  rationale: कृदन्त और बहुवचन संज्ञा के सामान्यीकृत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל לֶב רָע
  choice: व्यथित मन के सामने
  rationale: शाब्दिक रूप से ‘बुरे/दुखी मन पर’ है। प्रसंग में नैतिक दुष्टता से अधिक भीतरी दुख या व्यथा अभिप्रेत है। ‘के सामने’ עַל की स्थानिक छवि को कुछ हद तक बचाते हुए असंवेदनशील गायन का संबंध स्पष्ट करता है।
theological_decisions:
- issue: לֵב רָע में רָע का नैतिक या भावात्मक अर्थ
  choice: व्यथित मन
  alternative: बुरा मन
  rationale: इस तुलना में मन की दुखी या पीड़ित दशा संगत है; ‘बुरा मन’ हिन्दी में नैतिक दुष्टता का अनावश्यक संकेत देता। शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, समानांतर और नीतिवचन-सुलभ वाक्य रखा गया है। ‘खनिज क्षार’ तकनीकी ‘नैट्रॉन’ से अधिक बोधगम्य है, जबकि पादटिप्पणी ऐतिहासिक पदार्थ स्पष्ट करती है।
