  yaml_path: translation/ot/proverbs/025/005.yaml
  text: Remove the wicked from before the king[b][a], and his throne will be established in righteousness.
translation:
  language: hi
  text: राजा के सामने से दुष्ट को हटा दो[a], और उसका सिंहासन न्याय से[b] स्थिर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के सामने से दुष्ट को दूर कर दो।” आशय राज-दरबार से उसके भ्रष्ट प्रभाव को हटाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “न्याय से” का अनुवाद “धार्मिकता में” या “धार्मिकता के द्वारा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָגוֹ
  choice: हटा दो
  rationale: यह काल आज्ञार्थक रूप में किसी को दूर करने या सामने से हटाने का भाव देता है। ‘हटा दो’ स्वाभाविक हिंदी में आज्ञा का बल बनाए रखता है और हटाने का तरीका अनावश्यक रूप से निश्चित नहीं करता।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘दुष्ट’ किसी दुष्ट व्यक्ति को सूचित करता है, पर मूल पाठ से अधिक स्पष्ट रूप से ‘पुरुष’ नहीं जोड़ता।
- source_word: לִפְנֵי מֶלֶךְ
  choice: राजा के सामने से
  rationale: यह राज-दरबार या राजा की उपस्थिति से दूर किए जाने के इब्रानी भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְיִכּוֹן
  choice: स्थिर होगा
  rationale: निफ़अल रूप स्थापित, दृढ़ या सुरक्षित हो जाने का परिणाम बताता है। ‘स्थिर होगा’ सिंहासन के टिकाऊ और सुदृढ़ होने का भाव देता है।
- source_word: בַּצֶּדֶק
  choice: न्याय से
  rationale: צֶדֶק में नैतिक धार्मिकता और न्याय—दोनों का अर्थ-क्षेत्र है। राजकीय संदर्भ में ‘न्याय’ स्वाभाविक है; ‘से’ साधन का अर्थ देता है, जबकि मूल का संबंध क्षेत्र या आधार के रूप में भी समझा जा सकता है।
- source_word: כִּסְאוֹ
  choice: उसका सिंहासन
  rationale: तीसरे पुरुष एकवचन प्रत्यय स्वाभाविक रूप से राजा की ओर संकेत करता है।
