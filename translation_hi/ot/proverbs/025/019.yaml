base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/019.yaml
  text: Confidence in a treacherous man in a day of trouble is like a bad tooth and a slipping foot[a][b].
translation:
  language: hi
  text: संकट के दिन विश्वासघाती आदमी पर भरोसा करना खराब दाँत और डगमगाते हुए पैर के समान है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास तोड़ने वाले आदमी पर निर्भर होना।”
    reason: lexical_alternative
  - marker: b
    text: “डगमगाते हुए पैर” का अर्थ फिसलता हुआ, लड़खड़ाता हुआ या अस्थिर पैर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁן
  choice: दाँत
  rationale: इब्रानी संज्ञा का सीधा अर्थ ‘दाँत’ है; ठोस शारीरिक बिंब को बनाए रखा गया है।
- source_word: רֹעָה
  choice: खराब
  rationale: यह दाँत के अस्वस्थ, दोषपूर्ण या भरोसे के योग्य न होने का भाव देता है; ‘खराब दाँत’ सहज आधुनिक हिन्दी है और ‘सड़ा’ जैसी अधिक विशिष्ट अवस्था नहीं जोड़ता।
- source_word: רֶגֶל
  choice: पैर
  rationale: सामान्य अर्थ ‘पैर’ है और तुलना के शारीरिक बिंब को स्पष्ट रखता है।
- source_word: מוּעָדֶת
  choice: डगमगाते
  rationale: मूल शब्द फिसलने, लड़खड़ाने या अस्थिर होने का संकेत दे सकता है। ‘डगमगाते पैर’ निर्भर न कर सकने योग्य अस्थिरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבְטָח
  choice: भरोसा करना
  rationale: संज्ञा का अर्थ भरोसा या निर्भरता है। हिन्दी वाक्य में क्रियात्मक रूप अधिक स्वाभाविक है और तुलना का आशय सुरक्षित रखता है।
- source_word: בּוֹגֵד
  choice: विश्वासघाती आदमी
  rationale: पुल्लिंग एकवचन कृदंत ऐसे आदमी को दर्शाता है जो विश्वास तोड़ता या छल करता है; स्रोत का प्रतिनिधिक पुल्लिंग रूप बनाए रखा गया है।
- source_word: בְּיוֹם צָרָה
  choice: संकट के दिन
  rationale: यह संकट या विपत्ति के समय को बताता है; ‘संकट के दिन’ संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुकूल है।
theological_decisions:
- issue: בּוֹגֵד में प्रतिनिधिक पुल्लिंग
  choice: विश्वासघाती आदमी
  alternative: विश्वासघाती व्यक्ति
  rationale: मूल पाठ का रूप पुल्लिंग एकवचन है, इसलिए उसे हिन्दी में बनाए रखा गया है; फिर भी नीतिवचन का कथन सामान्य मानवीय व्यवहार पर लागू होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और लोकोक्तिपरक शैली। शारीरिक उपमाओं को ठोस रखा गया है और मूल की संक्षिप्त समानांतर संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
