language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תֵּצֵ֥א לָ/רִ֗ב מַ֫הֵ֥ר פֶּ֣ן מַה תַּ֭עֲשֶׂה בְּ/אַחֲרִיתָ֑/הּ בְּ/הַכְלִ֖ים אֹתְ/ךָ֣ רֵעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/008.yaml
  text: Do not go out hastily to a dispute[a], lest in the end, when your neighbor puts you to shame[b], you not know what to do.
translation:
  language: hi
  text: जल्दबाज़ी में किसी विवाद में न पड़ो[a], कहीं ऐसा न हो कि अंत में, जब तुम्हारा साथी तुम्हें लज्जित करे, तब तुम क्या करोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विवाद के लिए जल्दबाज़ी से बाहर न निकलो।” “विवाद” का अर्थ झगड़ा या कानूनी मुकदमा भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी कथन संक्षिप्त है: “कहीं ऐसा न हो—उसके अंत में तुम क्या करोगे, जब तुम्हारा साथी तुम्हें लज्जित करे?” इसका भाव यह भी हो सकता है कि तब तुम्हें समझ नहीं आएगा कि क्या करना है। “साथी” का अनुवाद “पड़ोसी” या “मित्र” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא לָרִיב
  choice: किसी विवाद में ... न पड़ो
  rationale: शाब्दिक अर्थ ‘विवाद के लिए बाहर न निकलो’ है। यह इब्रानी मुहावरा किसी झगड़े या मुकदमे में आगे बढ़ने का भाव देता है। ‘विवाद में न पड़ो’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिगत तथा कानूनी—दोनों प्रकार के टकराव की व्यापकता बनाए रखता है।
- source_word: מַהֵר
  choice: जल्दबाज़ी से
  rationale: यह केवल शीघ्रता नहीं, बल्कि बिना सोचे-समझे उतावलेपन को भी व्यक्त करता है।
- source_word: בְּאַחֲרִיתָהּ
  choice: अंत में
  rationale: स्त्रीलिंग प्रत्यय संभवतः विवाद या मामले के निहित संदर्भ की ओर संकेत करता है। ‘अंत में’ उसके अंतिम परिणाम को सहज रूप से व्यक्त करता है।
- source_word: בְּהַכְלִים אֹתְךָ
  choice: जब ... तुम्हें लज्जित करे
  rationale: כלם यहाँ अपमानित या लज्जित करने का भाव रखता है; यह सम्मान-अपमान के पहलू को बनाए रखता है।
- source_word: רֵעֶךָ
  choice: तुम्हारा पड़ोसी
  rationale: רֵעַ मित्र, साथी या पड़ोसी हो सकता है। यहाँ ‘पड़ोसी’ व्यापक सामाजिक संबंध को व्यक्त करता है और अनावश्यक निकटता नहीं जोड़ता।
- source_word: מַה תַּעֲשֶׂה
  choice: तब तुम क्या करोगे?
  rationale: इब्रानी वाक्य जानबूझकर संक्षिप्त और प्रश्नात्मक है। हिन्दी में सीधा आलंकारिक प्रश्न मूल की अस्पष्टता और चेतावनी की शक्ति दोनों बनाए रखता है; ‘तुम्हें समझ न आए कि क्या करना है’ जैसी व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण बहुवचन ‘तुम’ का प्रयोग किया गया है। भाषा सहज और नीतिवचन-सुलभ रखी गई है। मुख्य पाठ में इब्रानी के आलंकारिक प्रश्न को सुरक्षित रखा गया है, जबकि मुहावरे और संभावित कानूनी अर्थ को पादटिप्पणियों में स्पष्ट किया गया है।
