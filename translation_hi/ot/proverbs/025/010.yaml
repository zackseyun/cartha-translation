  text: lest one who hears it disgrace you[b][a], and your bad reputation not turn back.
translation:
  language: hi
  text: कहीं ऐसा न हो कि सुननेवाला तुम्हें अपमानित करे[a], और तुम्हारी बदनामी फिर न मिटे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हें लज्जित करे’ अथवा ‘तुम्हारी निंदा करे’; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और इस संदर्भ में उसका ठीक अर्थ निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और तुम्हारी बुरी चर्चा वापस न लौटे।’ इसका अर्थ यह हो सकता है कि तुम्हारे विषय में फैली बुरी चर्चा चलती रहे, या उससे हुई बदनामी फिर मिटाई न जा सके।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अनचाहे परिणाम की चेतावनी प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक ढंग से आशंका व्यक्त करता है।
- source_word: יְחַסֶּדְךָ
  choice: तुम्हें अपमानित करे
  rationale: यह दुर्लभ और संदर्भ की दृष्टि से कठिन क्रिया यहाँ सार्वजनिक लज्जा या तिरस्कार का भाव देती प्रतीत होती है; ‘अपमानित करे’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שֹׁמֵעַ
  choice: सुननेवाला
  rationale: कृदंत यहाँ अनिश्चित व्यक्ति के लिए संज्ञा के रूप में प्रयुक्त है; संक्षिप्त ‘सुननेवाला’ नीतिवचन की शैली के अनुकूल है।
- source_word: דִבָּתְךָ
  choice: तुम्हारी बदनामी
  rationale: דִּבָּה प्रतिकूल समाचार, निंदा या बुरी चर्चा को दर्शा सकता है। इस संदर्भ में ‘बदनामी’ उसके सामाजिक परिणाम को सहज हिन्दी में व्यक्त करती है, पर मूल की वैकल्पिक ‘बुरी चर्चा’ पादटिप्पणी में सुरक्षित है।
- source_word: לֹא תָשׁוּב
  choice: कभी न मिटे
  rationale: शाब्दिक रूप से ‘न लौटे’ है, पर यहाँ फैली बदनामी के वापस न लिए जा सकने अथवा समाप्त न होने का भाव है। ‘कभी न मिटे’ हिन्दी में स्वाभाविक है और स्थायी हानि को व्यक्त करता है; शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
