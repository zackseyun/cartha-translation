source:
  edition: WLC
  text: עִ֣יר פְּ֭רוּצָה אֵ֣ין חוֹמָ֑ה אִ֝֗ישׁ אֲשֶׁ֤ר אֵ֖ין מַעְצָ֣ר לְ/רוּחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/028.yaml
  text: A man who has no restraint over his spirit is like a city broken into[a], without a wall.
translation:
  language: hi
  text: 'जिस पुरुष को अपनी आत्मा[a] पर संयम नहीं है,

    वह उस नगर के समान है जिसमें सेंध लगी हो और जिसकी शहरपनाह न हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने स्वभाव पर नियंत्रण” या “अपने क्रोध पर काबू।” इब्रानी शब्द का शाब्दिक अर्थ “उसकी आत्मा” है; वह व्यक्ति की आंतरिक प्रवृत्ति या मिज़ाज का भी संकेत कर सकता है।
    reason: רוּחַ के व्यापक अर्थ को सुरक्षित रखते हुए संदर्भानुकूल वैकल्पिक अर्थ दिए गए हैं।
lexical_decisions:
- source_word: עִיר
  choice: नगर
  rationale: यह बसे हुए शहरी स्थान का सामान्य अर्थ देता है; ‘नगर’ नीतिवचन की गरिमापूर्ण शैली और उपमा के लिए स्वाभाविक है।
- source_word: פְּרוּצָה
  choice: तोड़ दी गई हो
  rationale: פרץ से बना यह रूप सुरक्षा-घेरे में सेंध लगने या उसे तोड़ दिए जाने को दर्शाता है। यहाँ स्त्रीलिंग रूप ‘नगर’ का नहीं, निकटवर्ती स्त्रीलिंग ‘शहरपनाह’ का विशेषण समझा जा सकता है; इसलिए दीवार टूटने की छवि स्पष्ट रखी गई है।
- source_word: אֵין חוֹמָה
  choice: जिसकी शहरपनाह ... गई हो
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है। हिंदी में ‘शहरपनाह’ इस सैन्य-सुरक्षात्मक चित्र को ‘दीवार’ से अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: אִישׁ
  choice: पुरुष
  rationale: इब्रानी में पुल्लिंग एकवचन है और नीतिवचन में प्रतिनिधिक रूप से प्रयुक्त हुआ है; ‘पुरुष’ स्रोत के व्याकरणिक रूप को बनाए रखता है।
- source_word: מַעְצָר
  choice: संयम
  rationale: संज्ञा रोक, नियंत्रण या अंकुश का भाव देती है। ‘संयम’ आधुनिक हिंदी में अपने भीतर के आवेग को नियंत्रित रखने का स्वाभाविक और संक्षिप्त पद है।
- source_word: לְרוּחוֹ
  choice: अपनी आत्मा पर
  rationale: רוּחַ का अर्थ आत्मा, आंतरिक प्रवृत्ति या क्रोधी आवेग हो सकता है। ‘आत्मा’ मूल रूपक और उसकी अर्थ-व्याप्ति को बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक लिंग-भाषा
  choice: जिस पुरुष
  alternative: जिस व्यक्ति
  rationale: אִישׁ स्पष्टतः पुल्लिंग एकवचन है, यद्यपि कथन सामान्य सिद्धांत के रूप में लागू होता है। स्रोत का रूप रखते हुए इसे ‘पुरुष’ अनूदित किया गया है।
- issue: רוּחַ का मानवशास्त्रीय अर्थ
  choice: आत्मा
  alternative: स्वभाव / क्रोध
  rationale: संदर्भ आंतरिक आवेग या मिज़ाज पर नियंत्रण की ओर संकेत करता है, पर मूल शब्द की व्यापकता को केवल ‘क्रोध’ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। काव्यात्मक उपमा को दो पंक्तियों में रखा गया है। ‘शहरपनाह’ कुछ औपचारिक है, पर नगर की रक्षात्मक दीवार का सटीक और प्रचलित बाइबलीय हिंदी पद है; पादटिप्पणी वैकल्पिक संरचना और ‘आत्मा’ की अर्थ-सीमा स्पष्ट करती है।
