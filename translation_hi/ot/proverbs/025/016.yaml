id: PRO.25.16
reference: Proverbs 25:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דְּבַ֣שׁ מָ֭צָאתָ אֱכֹ֣ל דַּיֶּ֑/ךָּ פֶּן תִּ֝שְׂבָּעֶ֗/נּוּ וַ/הֲקֵֽאתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/016.yaml
  text: If you find honey[a], eat only enough for you, lest you become full of it and vomit it.
translation:
  language: hi
  text: यदि तुम्हें मधु मिले, तो उतना ही खाओ जितना तुम्हारे लिए पर्याप्त हो[a], कहीं ऐसा न हो कि तुम उससे अघा जाओ और उसे उगल दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आवश्यकता भर खाओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַשׁ
  choice: मधु
  rationale: यह संज्ञा सीधे मधु या शहद को दर्शाती है। ‘मधु’ नीतिवचन की गरिमापूर्ण शैली में स्वाभाविक है और ठोस चित्र को बनाए रखता है।
- source_word: מָצָאתָ
  choice: यदि तुम्हें ... मिले
  rationale: रूप पूर्णकालिक द्वितीय पुरुष एकवचन है, पर सामान्य जीवन-स्थिति बताने वाले इस सशर्त नीतिवचन में हिन्दी का सामान्य वर्तमान सम्भावनार्थक प्रयोग अधिक स्वाभाविक है।
- source_word: אֱכֹל
  choice: खाओ
  rationale: यह द्वितीय पुरुष एकवचन की आज्ञा है; कर्म ‘मधु’ प्रसंग से स्पष्ट है।
- source_word: דַּיֶּךָ
  choice: उतना ही ... जितना तुम्हारे लिए पर्याप्त हो
  rationale: शब्द का अर्थ ‘तुम्हारी पर्याप्त मात्रा’ है। यह अभिव्यक्ति मात्रा की सीमा और संयम की चेतावनी दोनों को सहज हिन्दी में व्यक्त करती है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह उस अवांछित परिणाम का परिचय देता है जिससे बचना चाहिए; हिन्दी में यह चेतावनी-संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: תִּשְׂבָּעֶנּוּ
  choice: तुम उससे अघा जाओ
  rationale: שׂבע का अर्थ तृप्त या अघा जाना है और प्रत्यय मधु की ओर संकेत करता है। ‘अघा जाना’ अतिभोग से उत्पन्न तृप्ति या ऊब का शारीरिक भाव बनाए रखता है।
- source_word: וַהֲקֵאתוֹ
  choice: और उसे उगल दो
  rationale: हिफ़ील रूप का स्पष्ट अर्थ उलटी करके बाहर निकालना है। ‘उगल दो’ हिन्दी में सीधा और प्रभावशाली है तथा मूल चित्र को नरम नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘मधु’ और ‘अघा जाना’ सामान्य पाठक के लिए बोधगम्य रहते हुए काव्यात्मक संक्षिप्तता बनाए रखते हैं।
