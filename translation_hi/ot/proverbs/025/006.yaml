reference: Proverbs 25:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּתְהַדַּ֥ר לִ/פְנֵי מֶ֑לֶךְ וּ/בִ/מְק֥וֹם גְּ֝דֹלִ֗ים אַֽל תַּעֲמֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/006.yaml
  text: Do not exalt yourself before a king[a], and do not stand in the place of great men.
translation:
  language: hi
  text: राजा के सामने अपनी बड़ाई मत कर, और बड़े लोगों के स्थान पर खड़ा मत हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתְהַדַּר
  choice: अपनी बड़ाई कर
  rationale: हित्पएल रूप यहाँ स्वयं को सम्मानित या गौरवशाली दिखाने, अर्थात अपने आपको आगे बढ़ाने का भाव देता है। ‘अपनी बड़ाई करना’ आधुनिक हिन्दी में आत्म-प्रशंसा और पद-प्रतिष्ठा जताने की चेतावनी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי מֶלֶךְ
  choice: राजा के सामने
  rationale: לִפְנֵי का सामान्य अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है; यह संक्षिप्त हिन्दी प्रयोग राजदरबार के प्रसंग को बनाए रखता है।
- source_word: בִּמְקוֹם גְּדֹלִים
  choice: बड़े लोगों के स्थान पर
  rationale: מָקוֹם का मूल अर्थ ‘स्थान’ है और גְּדֹלִים यहाँ सामाजिक रूप से ऊँचे या प्रतिष्ठित लोगों को सूचित करता है। ‘बड़े लोग’ हिन्दी में इस सामाजिक हैसियत को बिना कोई विशिष्ट पद जोड़े सहजता से व्यक्त करता है।
- source_word: תַּעֲמֹד
  choice: खड़ा हो
  rationale: עמד का सीधा अर्थ ‘खड़ा होना’ है; प्रसंग में यह प्रतिष्ठित लोगों के लिए निर्धारित स्थान ग्रहण करने की ओर संकेत करता है।
theological_decisions:
- issue: גְּדֹלִים का लिंग और सामाजिक अर्थ
  choice: बड़े लोग
  alternative: महान पुरुष; प्रतिष्ठित लोग
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग बहुवचन है, पर यहाँ मुख्य जोर सामाजिक प्रतिष्ठा पर है, पुरुष होने पर नहीं। हिन्दी का ‘बड़े लोग’ इस सामाजिक अर्थ को स्वाभाविक रूप से बनाए रखता है और अनावश्यक रूप से पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूक्तिपरक रखी गई है। दोनों निषेधात्मक खंडों में एकवचन अनौपचारिक आज्ञार्थ ‘मत कर/मत हो’ मूल इब्रानी संबोधन की सीधाई को व्यक्त करता है; स्वर गरिमापूर्ण है, यद्यपि अत्यधिक औपचारिक नहीं।
