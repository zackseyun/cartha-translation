id: PRO.25.3
reference: Proverbs 25:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׁמַ֣יִם לָ֭/רוּם וָ/אָ֣רֶץ לָ/עֹ֑מֶק וְ/לֵ֥ב מְ֝לָכִ֗ים אֵ֣ין חֵֽקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/003.yaml
  text: The heavens for height[a], and the earth for depth, and the heart of kings—there is no searching out.
translation:
  language: hi
  text: आकाश की ऊँचाई और पृथ्वी की गहराई की तरह, राजाओं के हृदय की थाह नहीं पाई जा सकती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: बहुवचन रूप यहाँ ऊपर के आकाशमंडल को सूचित करता है। आधुनिक मानक हिन्दी में ‘आकाश’ स्वाभाविक है और पृथ्वी के साथ ब्रह्मांडीय समानांतर बनाए रखता है।
- source_word: לָרוּם
  choice: की ऊँचाई
  rationale: उपसर्ग ל यहाँ संबंध या विचाराधीन पक्ष बताता है। ‘आकाश की ऊँचाई’ हिन्दी में संक्षिप्त और स्वाभाविक ढंग से वही आयाम व्यक्त करता है।
- source_word: וָאָרֶץ
  choice: और पृथ्वी
  rationale: आकाश के समानांतर אֶרֶץ का अर्थ यहाँ स्थानीय भूमि नहीं, ब्रह्मांडीय ‘पृथ्वी’ है; संयोजक ‘और’ भी रखा गया है।
- source_word: לָעֹמֶק
  choice: की गहराई
  rationale: यह לָרוּם के समानांतर पृथ्वी के अथाह आयाम को व्यक्त करता है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में ‘हृदय’ विचार, अभिप्राय और भीतरी प्रवृत्ति को भी समेटता है। रूपक को बनाए रखने के लिए ‘हृदय’ चुना गया है।
- source_word: מְלָכִים
  choice: राजाओं का
  rationale: शब्द विशेष रूप से राजाओं को दर्शाता है, इसलिए व्यापक ‘शासकों’ के बजाय ‘राजाओं’ को रखा गया है।
- source_word: אֵין חֵקֶר
  choice: इनकी थाह नहीं पाई जा सकती
  rationale: यह वाक्यांश खोजकर सीमा या गहराई जान पाने की असंभवता व्यक्त करता है। ‘थाह नहीं पाई जा सकती’ आधुनिक हिन्दी में स्वाभाविक है और आकाश, पृथ्वी तथा राजाओं के हृदय—तीनों से जुड़ी काव्यात्मक प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: אֵין חֵקֶר का व्याकरणिक विस्तार
  choice: अंतिम बहुवचन ‘इनकी’ के द्वारा तीनों पदों—आकाश की ऊँचाई, पृथ्वी की गहराई और राजाओं के हृदय—पर अथाहता लागू होने की काव्यात्मक प्रतिध्वनि व्यक्त की गई है।
  alternative: 'इसे केवल निकटतम पद ‘राजाओं के हृदय’ पर सीधे लागू किया जा सकता है: ‘राजाओं के हृदय की थाह नहीं पाई जा सकती।’'
  rationale: इब्रानी में अंतिम कथन सबसे सीधे राजाओं के हृदय से जुड़ता है, पर पहले दो संक्षिप्त पद उसी अथाहता की तुलना तैयार करते हैं। हिन्दी रचना तुलना की व्यापक प्रतिध्वनि रखती है, बिना किसी विशेष धर्मसिद्धान्त को जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की संक्षिप्त त्रिपदीय संरचना को अल्पविराम और दीर्घ विराम से उभारा गया है। ‘थाह पाना’ सामान्य हिन्दी का सजीव मुहावरा है, जो חֵקֶר के खोजने, जाँचने और गहराई तक पहुँचने के भाव को समेटता है।
