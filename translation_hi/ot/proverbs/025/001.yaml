source:
  edition: WLC
  text: גַּם אֵ֭לֶּה מִשְׁלֵ֣י שְׁלֹמֹ֑ה אֲשֶׁ֥ר הֶ֝עְתִּ֗יקוּ אַנְשֵׁ֤י חִזְקִיָּ֬ה מֶֽלֶךְ יְהוּדָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/001.yaml
  text: These also are proverbs of Solomon[b][a], which the men of Hezekiah king of Judah copied.
translation:
  language: hi
  text: ये भी सुलैमान के नीतिवचन हैं, जिनकी प्रतिलिपि यहूदा के राजा हिजकिय्याह के लोगों[b] ने बनाई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नकल किया’ अथवा ‘संकलित किया।’ इब्रानी क्रिया का आशय संभवतः इन नीतिवचनों की प्रतिलिपि तैयार करके उन्हें संग्रह के रूप में व्यवस्थित करना है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘हिजकिय्याह के लोग’; इससे संभवतः उसके दरबार के सदस्य या राजकीय लिपिक अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: ये भी
  rationale: यह पद पिछले संग्रह के बाद एक अतिरिक्त संग्रह का परिचय देता है; ‘ये भी’ संकेतवाचक और संयोजक—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: מִשְׁלֵי
  choice: नीतिवचन
  rationale: इस पुस्तक और साहित्यिक विधा के संदर्भ में यह מָשָׁל का प्रचलित, स्पष्ट और उपयुक्त हिन्दी रूप है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: הֶעְתִּיקוּ
  choice: प्रतिलिपि बनाई
  rationale: यहाँ עתק के हिफ़ील रूप का आशय इन नीतिवचनों को लिखकर दूसरे स्थान या संकलन में ले आने से है। ‘प्रतिलिपि बनाई’ संपादकीय प्रक्रिया को आवश्यकता से अधिक निश्चित किए बिना मूल भाव बताता है।
- source_word: אַנְשֵׁי חִזְקִיָּה
  choice: हिजकिय्याह के लोगों
  rationale: शाब्दिक अर्थ ‘हिजकिय्याह के जन/लोग’ है और संदर्भ में उससे संबद्ध राजकीय पुरुषों की ओर संकेत है। हिन्दी में ‘के लोगों’ संबंध को स्वाभाविक रूप से व्यक्त करता है; उनकी अधिक विशिष्ट भूमिका पादटिप्पणी में दी गई है।
- source_word: מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा
  rationale: इब्रानी संबंध-पदबंध का स्वाभाविक और सटीक हिन्दी रूप, जो हिजकिय्याह के राजकीय पद को बताता है।
theological_decisions:
- issue: אַנְשֵׁי חִזְקִיָּה में लिंग और संस्थागत भूमिका
  choice: हिजकिय्याह के लोगों
  alternative: हिजकिय्याह के अधिकारी / हिजकिय्याह के शास्त्री
  rationale: मूल पद पुरुषवाचक बहुवचन है, पर उनकी निश्चित उपाधि नहीं बताता। ‘लोगों’ मूल की संबंधपरक व्यापकता बनाए रखता है, जबकि पादटिप्पणी संभावित दरबारी या लेखकीय भूमिका स्पष्ट करती है और मुख्य पाठ में अनावश्यक विशिष्टता नहीं जोड़ती।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की संरचना मूल के परिचयात्मक शीर्षक-सदृश स्वर को बनाए रखती है। ‘प्रतिलिपि बनाई’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी संभावित संकलन-कार्य की गुंजाइश सुरक्षित रखती है।
