revisions:
- from: कटनी के दिन बर्फ़ की ठंडक[a] जैसी होती है, वैसा ही विश्वासयोग्य दूत अपने भेजनेवालों के लिए होता है, क्योंकि वह अपने स्वामियों के प्राणों में ताज़गी लौटा देता है[b]।
  to: कटनी के दिन बर्फ़ की ठंडक[a] के समान विश्वासयोग्य दूत अपने भेजनेवालों के लिए होता है, क्योंकि वह अपने स्वामियों के प्राणों को फिर से ताज़ा कर देता है[b]।
  rationale: The revision improves idiomatic modern-Hindi syntax and makes the final verb govern its object directly. It preserves the source’s comparison, the plural forms for senders and masters, and the restorative/refreshing nuance of the final clause. Footnote anchors and their lexical-alternative functions are retained.
