source:
  edition: WLC
  text: כְּ/צִנַּת שֶׁ֨לֶג בְּ/י֬וֹם קָצִ֗יר צִ֣יר נֶ֭אֱמָן לְ/שֹׁלְחָ֑י/ו וְ/נֶ֖פֶשׁ אֲדֹנָ֣י/ו יָשִֽׁיב־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/013.yaml
  text: Like the coolness of snow on a harvest day is a faithful messenger to those who send him[b][a], for he refreshes the life of his masters.
translation:
  language: hi
  text: कटनी के दिन बर्फ़ की ठंडक[a] के समान विश्वासयोग्य दूत अपने भेजनेवालों के लिए होता है, क्योंकि वह अपने स्वामियों के प्राणों को फिर से ताज़ा कर देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कटनी के समय बर्फ़ की ठंड जैसी।’ सम्भवतः यह चित्र कटनी को हानि पहुँचाने वाली बर्फ़बारी का नहीं, बल्कि बर्फ़ से मिलने वाली राहतभरी ठंडक का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह अपने स्वामियों के प्राणों को बहाल कर देता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִנַּת
  choice: ठंडक जैसी
  rationale: צִנָּה का अर्थ ठंड या ठंडक है। यहाँ उपमा राहत और ताज़गी देनेवाली ठंडक की है, इसलिए सकारात्मक भाव रखने वाला ‘ठंडक’ स्वाभाविक है।
- source_word: שֶׁלֶג
  choice: बर्फ़
  rationale: שֶׁלֶג का सीधा और सामान्य हिन्दी अर्थ ‘बर्फ़’ है।
- source_word: בְּיוֹם קָצִיר
  choice: कटनी के दिन
  rationale: यह पदबंध कटनी के समय के एक ठोस दिन का चित्र बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: צִיר
  choice: दूत
  rationale: यहाँ शब्द संदेश लेकर भेजे गए व्यक्ति को दर्शाता है। ‘दूत’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए स्पष्ट है।
- source_word: נֶאֱמָן
  choice: विश्वासयोग्य
  rationale: यह विश्वसनीयता और निष्ठा, दोनों का नैतिक भाव बनाए रखता है।
- source_word: לְשֹׁלְחָיו
  choice: अपने भेजनेवालों के लिए
  rationale: इब्रानी रूप बहुवचन, अर्थात ‘उसके भेजनेवालों’, को दर्शाता है; हिन्दी में यह प्रयोग उस बहुवचन को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: וְנֶפֶשׁ
  choice: प्राणों में
  rationale: נֶפֶשׁ यहाँ जीवन-शक्ति या भीतरी जीवंतता को सूचित करता है। ‘प्राणों में’ इस अर्थ को बनाए रखता है और केवल शरीर-आत्मा के दार्शनिक विभाजन का संकेत नहीं देता।
- source_word: אֲדֹנָיו
  choice: अपने स्वामियों
  rationale: इब्रानी रूप बहुवचन है। ‘स्वामियों’ उस व्याकरणिक संख्या को सुरक्षित रखता है और अनावश्यक रूप से दासत्व या स्वामित्व का विशेष संदर्भ नहीं जोड़ता।
- source_word: יָשִׁיב
  choice: ताज़गी लौटा देता है
  rationale: שׁוב के हिफ़ील रूप का मूल भाव लौटाने या बहाल करने का है। यह चयन उस भाव को बर्फ़ की ठंडक से जुड़ी ताज़गी की उपमा के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
