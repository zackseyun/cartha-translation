review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the snow-coolness simile, the faithful messenger, the plural senders/masters, and the restoring sense of יָשִׁיב. The proposed revision retains these features while rendering the Hebrew clause sequence more directly.
  naturalness: The opening correlative construction, “...जैसी होती है, वैसा ही...,” is grammatically understandable but unnecessarily repetitive and less proverbial in modern Hindi. A single “के समान” construction is smoother. “प्राणों में ताज़गी लौटा देता है” is also less idiomatic than making “प्राणों” the direct object.
  terminology: “कटनी,” “बर्फ़,” “विश्वासयोग्य दूत,” and “स्वामियों” are appropriate, dignified modern-Hindi choices. “प्राणों” suitably represents נפש here as vitality without imposing a technical doctrine of the soul.
  issues:
  - severity: low
    issue: The first clause uses a cumbersome doubled comparison.
    rationale: “कटनी के दिन बर्फ़ की ठंडक जैसी होती है, वैसा ही” can be streamlined as “कटनी के दिन बर्फ़ की ठंडक के समान,” preserving the simile and improving natural Hindi flow.
  - severity: low
    issue: The final idiom is slightly awkward, and footnote b lacks the object marker.
    rationale: “प्राणों को फिर से ताज़ा कर देता है” is more idiomatic than “प्राणों में ताज़गी लौटा देता है.” In the alternative wording, “प्राणों को बहाल” is grammatically complete.
  revised_text: कटनी के दिन बर्फ़ की ठंडक[a] के समान विश्वासयोग्य दूत अपने भेजनेवालों के लिए होता है, क्योंकि वह अपने स्वामियों के प्राणों को फिर से ताज़ा कर देता है[b]।
