    reason: lexical_alternative
lexical_decisions:
- source_word: רִיבְךָ רִיב
  choice: अपना विवाद ... सुलझा
  rationale: संज्ञा और आज्ञार्थक क्रिया की पुनरुक्ति विवाद को स्वयं संबंधित व्यक्ति के साथ उठाने और निपटाने का भाव देती है। सहज हिन्दी में ‘विवाद सुलझा’ कानूनी मुकदमे तक अर्थ को सीमित नहीं करता।
- source_word: אֶת רֵעֶךָ
  choice: अपने पड़ोसी से ... सीधे
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या मित्र हो सकता है। ‘पड़ोसी’ व्यापक अर्थ रखता है; ‘सीधे’ पद्य के निहित विरोध को स्पष्ट करता है, यद्यपि यह शब्द इब्रानी में अलग से नहीं है।
- source_word: וְסוֹד אַחֵר
  choice: पर किसी दूसरे का भेद
  rationale: סוֹד यहाँ गोपनीय बात या रहस्य है और אַחֵר किसी अन्य व्यक्ति को सूचित करता है। ‘भेद’ संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुरूप है। संयोजक וְ को प्रसंगगत विरोध के कारण ‘पर’ किया गया है।
- source_word: אַל תְּגָל
  choice: प्रकट न कर
  rationale: गला धातु के इस रूप का अर्थ खोल देना या उजागर करना है। ‘प्रकट न कर’ निषेध को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
