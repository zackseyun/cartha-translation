  text: झगड़ालू पत्नी के साथ एक ही घर में रहने से छत के एक कोने पर रहना अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, शाब्दिक रूप से, “झगड़ालू पत्नी और साझे घर के साथ।” इब्रानी का अंतिम वाक्यांश बहुत संक्षिप्त है; उसका बल सुखद संगति के बजाय एक ही घर साझा करने पर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यहाँ विशेषण तुलनात्मक ज्ञानोक्ति में प्रयुक्त है; ‘...से ... अच्छा है’ स्वाभाविक हिन्दी तुलना है।
- source_word: שֶׁבֶת
  choice: रहना
  rationale: मूल अर्थ ‘बैठना’ हो सकता है, पर स्थान-सूचक वाक्यांश के साथ यहाँ निवास करने का भाव है।
- source_word: עַל פִּנַּת גָּג
  choice: छत के एक कोने पर
  rationale: यह सपाट छत पर सीमित और खुले स्थान की ठोस छवि को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: झगड़ालू पत्नी के साथ ... से
  rationale: מ तुलनात्मक है, और מִדְיָנִים निरन्तर कलह करने के स्वभाव को दर्शाता है; ‘झगड़ालू’ सहज आधुनिक हिन्दी है।
- source_word: וּבֵית חָבֶר
  choice: एक ही घर में
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; חָבֶר में साझेपन या साथ रहने का भाव है। मुख्य पाठ सह-निवास का व्यावहारिक अर्थ देता है और पादटिप्पणी वैकल्पिक संरचना सुरक्षित रखती है।
