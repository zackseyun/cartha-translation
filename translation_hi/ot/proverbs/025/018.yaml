  terminology: ‘पड़ोसी,’ ‘झूठी गवाही,’ ‘गदा,’ and ‘तलवार’ are appropriate modern-standard Hindi terms. The footnote’s alternative is best stated more naturally as ‘भारी हथौड़ा.’
