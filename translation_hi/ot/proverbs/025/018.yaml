  text: מֵפִ֣יץ וְ֭/חֶרֶב וְ/חֵ֣ץ שָׁנ֑וּן אִ֥ישׁ עֹנֶ֥ה בְ֝/רֵעֵ֗/הוּ עֵ֣ד שָֽׁקֶר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/018.yaml
  text: A club[a], a sword, and a sharp arrow is a man who bears false witness against his neighbor.
translation:
  language: hi
  text: 'जो मनुष्य अपने पड़ोसी के विरुद्ध झूठी गवाही देता है,

    वह गदा[a], तलवार और पैने तीर के समान है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भारी हथौड़ा’
    reason: מֵפִיץ किसी भारी, कुचलने वाले हथियार या औज़ार को सूचित कर सकता है; उसका ठीक रूप अनिश्चित है।
lexical_decisions:
- source_word: מֵפִיץ
  choice: गदा
  rationale: यह शब्द कुचलने वाले हथियार को दर्शाता है। ‘गदा’ आधुनिक हिन्दी में स्पष्ट है और तलवार तथा तीर के साथ हथियारों की त्रयी को बनाए रखता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: सामान्य इब्रानी शब्द का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
- source_word: חֵץ שָׁנוּן
  choice: तेज़ तीर
  rationale: विशेषण शָׁנוּן धारदार या पैना होने का भाव देता है; ‘तेज़ तीर’ ठोस बिंब को सहज हिन्दी में रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है, पर कहावत में प्रतिनिधिक व्यक्ति का बोध है। ‘मनुष्य’ स्रोत की एकवचन संरचना और सार्वभौमिक नीतिगत आशय दोनों को व्यक्त करता है।
- source_word: עֹנֶה
  choice: गवाही देता है
  rationale: शाब्दिक अर्थ ‘उत्तर देना’ है, किंतु עֵד שָׁקֶר के साथ न्यायिक संदर्भ में साक्ष्य या गवाही देना अभिप्रेत है। हिन्दी में ‘झूठी गवाही देता है’ अर्थ को स्वाभाविक और सटीक रूप से व्यक्त करता है।
- source_word: בְרֵעֵהוּ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: गवाही के संदर्भ में בְּ का भाव यहाँ विरोधात्मक है। ‘पड़ोसी’ רֵעַ के नैतिक और सामाजिक अर्थ को सुरक्षित रखता है।
- source_word: עֵד שָׁקֶר
  choice: झूठी गवाही
  rationale: शाब्दिक संरचना ‘झूठ का साक्षी/झूठा साक्षी’ है। क्रिया עֹנֶה के साथ ‘झूठी गवाही देता है’ न्यायिक अर्थ को स्पष्ट और सहज हिन्दी में प्रस्तुत करता है।
