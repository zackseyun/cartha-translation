translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। काव्यात्मक तुलना को स्पष्ट करने के लिए हिन्दी में उपवाक्यों का क्रम बदला गया है; हथियारों की त्रयी और झूठी गवाही की विनाशकारी शक्ति का बिंब सुरक्षित है।
