translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन के अनुरूप सीधी रखी गई है। एकवचन अनौपचारिक संबोधन ‘तू/तुझसे’ मूल के द्वितीय पुरुष एकवचन को दर्शाता है। ‘कम ही जाया कर’ और ‘जी भर जाए’ सामान्य हिन्दी के स्वाभाविक मुहावरे हैं।
