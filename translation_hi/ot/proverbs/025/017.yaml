  text: הֹקַ֣ר רַ֭גְלְ/ךָ מִ/בֵּ֣ית רֵעֶ֑/ךָ פֶּן יִ֝שְׂבָּעֲ/ךָ֗ וּ/שְׂנֵאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/017.yaml
  text: Let your foot be seldom in your neighbor’s house[b][a], lest he have his fill of you and hate you.
translation:
  language: hi
  text: अपने पड़ोसी[b] के घर कम ही जाया कर[a], कहीं ऐसा न हो कि उसका जी तुझसे भर जाए और वह तुझसे घृणा करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने पड़ोसी के घर से अपने पाँव को दुर्लभ कर।” इसका आशय है कि वहाँ कम जाया कर।
    reason: lexical_alternative
  - marker: b
    text: या “अपने मित्र के”; इब्रानी शब्द का अर्थ “पड़ोसी,” “मित्र” या “साथी” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֹקַר
  choice: कम ही जाया कर
  rationale: हिफ़ील आज्ञार्थक का शाब्दिक भाव ‘दुर्लभ कर’ है, पर संदर्भ में यह किसी के घर कम जाने की सलाह देता है। यह चयन आज्ञा के बल और मुहावरे के आशय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: רַגְלְךָ מִבֵּית
  choice: के घर ... जाया कर
  rationale: शाब्दिक रूप में ‘अपने पाँव को ... के घर से दुर्लभ कर’ है। हिन्दी में पाँव का शाब्दिक उल्लेख कृत्रिम लगेगा; आने-जाने के आशय को सीधे व्यक्त किया गया है।
- source_word: רֵעֶךָ
  choice: अपने पड़ोसी
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। मुख्य पाठ में व्यापक सामाजिक अर्थ वाला ‘पड़ोसी’ रखा गया है और अन्य सम्भावना पादटिप्पणी में दी गई है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी प्रस्तुत करता है; हिन्दी में यह स्वाभाविक और स्पष्ट निषेधात्मक चेतावनी है।
- source_word: יִשְׂבָּעֲךָ
  choice: उसका जी तुझसे भर जाए
  rationale: שׂבע का मूल बिंब तृप्त या भर जाने का है। हिन्दी मुहावरा ‘जी भर जाना’ किसी की अधिक उपस्थिति से उकता जाने का भाव व्यक्त करते हुए उस बिंब को बनाए रखता है।
- source_word: וּשְׂנֵאֶךָ
  choice: और वह तुझसे घृणा करने लगे
  rationale: मूल क्रिया का सीधा अर्थ ‘घृणा करना’ है। ‘करने लगे’ चेतावनी में परिणामी परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अर्थ को नरम किए।
