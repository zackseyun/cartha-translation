  text: Like a gold ring and an ornament of fine gold is a wise reprover to a listening ear[a].
translation:
  language: hi
  text: जैसे सोने का छल्ला और खरे सोने का आभूषण, वैसा ही सुननेवाले कान के लिए बुद्धिमान सुधारक है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे सोने की नथ और शुद्ध सोने का गहना, वैसा ही सुननेवाले कान के लिए बुद्धिमान सुधारक है।” आभूषणों के लिए प्रयुक्त इब्रानी शब्द व्यापक हैं, और अंतिम वाक्यांश ग्रहणशील होकर सुनने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶזֶם
  choice: नथ
  rationale: यह शब्द नाक या कान में पहने जानेवाले छल्लेदार आभूषण का द्योतक हो सकता है। प्राचीन निकट-पूर्वी संदर्भ में 'नथ' स्वाभाविक है, पर स्थान निश्चित न होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: זָהָב
  choice: सोने की
  rationale: आभूषण की सामग्री बतानेवाला सामान्य शब्द; हिन्दी में संबंधसूचक रूप स्वाभाविक है।
- source_word: וַחֲלִי
  choice: और ... आभूषण
  rationale: חֲלִי किसी आभूषण या गहने के लिए व्यापक शब्द है; किसी विशेष प्रकार को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: כָתֶם
  choice: कुंदन
  rationale: यह उच्च कोटि के परिष्कृत सोने को दर्शाता है। आधुनिक हिन्दी में 'कुंदन' मूल्यवान, परिष्कृत सोने के आभूषण की छवि को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מוֹכִיחַ
  choice: डाँटनेवाला
  rationale: यह कृदंत सुधार के उद्देश्य से उलाहना या ताड़ना देनेवाले व्यक्ति को दर्शाता है; 'डाँटनेवाला' साधारण पाठक के लिए स्पष्ट है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: नीतिवचन में नैतिक और व्यावहारिक बुद्धि का मानक हिन्दी रूप।
- source_word: עַל
  choice: के लिए
  rationale: यहाँ सुधार करनेवाले और ग्रहणशील श्रोता के बीच संबंध व्यक्त करता है; हिन्दी उपमा में 'के लिए' सहज है।
- source_word: אֹזֶן שֹׁמָעַת
  choice: सुननेवाला कान
  rationale: शाब्दिक श्रवण के साथ ग्रहणशीलता की सजीव उपमा बनाए रखता है और मूल की कृदंत संरचना के निकट है।
