source:
  edition: WLC
  text: מַעְיָ֣ן נִ֭רְפָּשׂ וּ/מָק֣וֹר מָשְׁחָ֑ת צַ֝דִּ֗יק מָ֣ט לִ/פְנֵֽי רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/026.yaml
  text: Like a muddied spring and a polluted fountain is a righteous man who gives way before the wicked[a].
translation:
  language: hi
  text: जैसे गंदला किया हुआ सोता और दूषित जलस्रोत, वैसे ही वह धर्मी मनुष्य है जो दुष्ट के सामने डगमगा जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे रौंदकर गंदला किया गया सोता और बिगाड़ा हुआ जलस्रोत, वैसे ही वह धर्मी मनुष्य है जो दुष्ट के सामने झुक जाता है।”
    reason: נִרְפָּשׂ, מָשְׁחָת और מָט के सम्भव अधिक क्रियात्मक तथा नैतिक अर्थों को दर्शाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: מַעְיָן
  choice: सोता
  rationale: यह प्राकृतिक रूप से फूटने वाले जलस्रोत को दर्शाता है; आधुनिक हिन्दी में ‘सोता’ इस बिंब को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: נִרְפָּשׂ
  choice: गंदला किया हुआ
  rationale: निष्क्रिय कृदन्त ऐसे पानी का बोध कराता है जिसे रौंदने या हिलाने से मटमैला कर दिया गया हो; यह पद उस क्रिया और परिणामी दशा दोनों को खुला रखता है।
- source_word: מָקוֹר
  choice: जलस्रोत
  rationale: यह מַעְיָן के समानान्तर पानी के उद्गम को दर्शाता है। ‘जलस्रोत’ भेद बनाए रखता है और कृत्रिम फव्वारे का अनचाहा बिंब नहीं लाता।
- source_word: מָשְׁחָת
  choice: दूषित
  rationale: संज्ञा बिगाड़, भ्रष्टता या नष्ट दशा का संकेत देती है; जलस्रोत के साथ ‘दूषित’ संदूषण और अनुपयोगिता का स्वाभाविक बोध देता है।
- source_word: צַדִּיק
  choice: धर्मी मनुष्य
  rationale: मूल में पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी मनुष्य’ उसके व्याकरणिक रूप को रखते हुए लोकोक्तिपरक प्रतिनिधि अर्थ भी व्यक्त करता है।
- source_word: מָט
  choice: डगमगा जाता है
  rationale: क्रिया झुकने, फिसलने, लड़खड़ाने या विचलित होने का अर्थ दे सकती है। ‘डगमगा जाता है’ मूल बिंब और नैतिक दबाव के बीच की अस्पष्टता को बिना एक अर्थ पर सीमित किए बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह ‘के आगे/उपस्थिति में’ का सामान्य सम्बन्ध व्यक्त करता है और यहाँ दुष्ट के सम्मुख धर्मी के डगमगाने को स्वाभाविक हिन्दी में रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: मूल का पुल्लिंग एकवचन संज्ञीकृत विशेषण प्रतिनिधि व्यक्ति को दर्शाता है; हिन्दी में ‘दुष्ट’ उसी संक्षिप्त लोकोक्तिपरक रूप को बनाए रखता है।
theological_decisions:
- issue: צַדִּיק का लिंग-संबंधी अनुवाद
  choice: धर्मी मनुष्य
  alternative: धर्मी व्यक्ति
  rationale: इब्रानी रूप पुल्लिंग एकवचन है और नीतिवचन में प्रतिनिधि रूप से प्रयुक्त हुआ है। ‘मनुष्य’ व्याकरणिक संकेत को बनाए रखता है, जबकि कथन का सामान्य अनुप्रयोग बंद नहीं करता।
- issue: מָט का नैतिक अथवा शारीरिक बिंब
  choice: डगमगा जाता है
  alternative: दब जाता है / हार मान लेता है
  rationale: संदर्भ दुष्ट के सामने नैतिक या सामाजिक रूप से झुकने का संकेत दे सकता है, पर मूल क्रिया लड़खड़ाने या विचलित होने का बिंब भी रखती है। मुख्य पाठ में ‘डगमगा’ दोनों आयामों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समांतर जल-बिंब के लिए ‘सोता’ और ‘जलस्रोत’ चुने गए हैं। ‘डगमगा जाता है’ मूल की वास्तविक अर्थगत व्यापकता को सुरक्षित रखता है; वैकल्पिक अधिक स्पष्ट नैतिक अर्थ पादटिप्पणी में दिया गया है।
