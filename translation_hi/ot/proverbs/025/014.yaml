source:
  edition: WLC
  text: נְשִׂיאִ֣ים וְ֭/רוּחַ וְ/גֶ֣שֶׁם אָ֑יִן אִ֥ישׁ מִ֝תְהַלֵּ֗ל בְּ/מַתַּת שָֽׁקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/014.yaml
  text: Like clouds and wind without rain is a man who boasts of a false gift[a].
translation:
  language: hi
  text: जैसे बादल और हवा हों, पर वर्षा न हो, वैसा ही वह मनुष्य है जो झूठे उपहार की डींग मारता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे बादल और हवा तो हों, पर वर्षा न हो, वैसा ही वह मनुष्य है जो ऐसे उपहार की डींग मारता है जिसे वह देता नहीं।”
    reason: ‘झूठा उपहार’ संभवतः ऐसे उपहार को दर्शाता है जिसका दावा या वादा तो किया गया हो, पर जो वास्तव में दिया न गया हो।
lexical_decisions:
- source_word: נְשִׂיאִים
  choice: बादल
  rationale: वर्षा और हवा के साथ यह शब्द आकाश में छाए बादलों को दर्शाता है; आधुनिक हिन्दी में ‘बादल’ सबसे स्वाभाविक है।
- source_word: רוּחַ
  choice: हवा
  rationale: मौसम-संबंधी प्रसंग में इसका अर्थ ‘हवा’ है, न कि ‘आत्मा’ या ‘श्वास’।
- source_word: גֶשֶׁם
  choice: वर्षा
  rationale: यहाँ सामान्य मौसम-संबंधी अर्थ है; ‘वर्षा’ संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: אָיִן
  choice: नहीं
  rationale: मूल की ‘वर्षा नहीं है’ वाली कमी को संक्षिप्त रूप में व्यक्त करता है और कहावत की लय बनाए रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: मूल का पुल्लिंग एकवचन प्रतिनिधिक रूप में है; ‘मनुष्य’ आधुनिक हिन्दी में सामान्य मानवीय संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִתְהַלֵּל
  choice: डींग मारता है
  rationale: यह आत्मप्रशंसा या शेखी बघारने का भाव देता है; ‘डींग मारता है’ सामान्य आधुनिक हिन्दी में स्पष्ट और मुहावरेदार है।
- source_word: בְּמַתַּת
  choice: उपहार के विषय में
  rationale: पूर्वसर्ग को डींग मारने की विषय-वस्तु के रूप में व्यक्त किया गया है।
- source_word: שָׁקֶר
  choice: झूठे
  rationale: मूल शब्द छलपूर्ण, खोखले या वास्तव में न दिए गए उपहार का संकेत दे सकता है; ‘झूठे’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
