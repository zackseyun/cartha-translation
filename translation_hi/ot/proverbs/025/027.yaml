base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/027.yaml
  text: To eat much honey is not good[a], and to search out their glory is glory.
translation:
  language: hi
  text: बहुत अधिक शहद खाना अच्छा नहीं है[a], और उनके गौरव की खोज करना गौरव है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप है: “और उनके गौरव की खोज करना गौरव है।” दूसरी पंक्ति कठिन है। इसका आशय यह हो सकता है कि अपने लिए सम्मान खोजना सम्मानजनक नहीं है, या कि गंभीर बातों की छानबीन करना सम्मान की बात है। यहाँ मसोरेटी पाठ का निकट अनुवाद दिया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֹל
  choice: खाना
  rationale: क्रियार्थक संज्ञा यहाँ लोकोक्तिपरक विषय का काम करती है; हिंदी में “खाना” इसी प्रकार स्वाभाविक और संक्षिप्त है।
- source_word: דְּבַשׁ
  choice: मधु
  rationale: मूल बिंब को अक्षुण्ण रखते हुए सामान्य बाइबिलीय और गरिमापूर्ण हिंदी शब्द चुना गया है।
- source_word: הַרְבּוֹת
  choice: बहुत अधिक
  rationale: यह खाने की अधिकता को व्यक्त करता है; “बहुत अधिक” अति का भाव स्पष्ट करता है, बिना उसके परिणाम को अनावश्यक रूप से विशिष्ट बनाए।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं है
  rationale: मूल के संक्षिप्त व्यावहारिक-मूल्यांकन को ज्यों का त्यों रखता है और इसे केवल स्वास्थ्य-संबंधी कथन नहीं बनाता।
- source_word: וְחֵקֶר
  choice: और ... की छानबीन करना
  rationale: संज्ञात्मक “खोज/अनुसंधान” को स्वाभाविक हिंदी में क्रियात्मक रूप दिया गया है; संयोजक को “और” रखा गया है ताकि विरोध का अर्थ न थोपा जाए।
- source_word: כְּבֹדָם
  choice: उनके वैभव
  rationale: मसोरेटी पाठ के तृतीय पुरुष बहुवचन प्रत्यय को “उनके” के रूप में सुरक्षित रखा गया है; कठिन पंक्ति को “अपना सम्मान” आदि बनाकर स्पष्ट नहीं किया गया।
- source_word: כָּבוֹד
  choice: वैभव है
  rationale: संज्ञात्मक विधेय और כבד शब्दमूल की पुनरावृत्ति को “वैभव” दोहराकर बचाया गया है; “सम्मानजनक” जैसी व्याख्यात्मक सहजता से परहेज़ किया गया।
theological_decisions:
- issue: दूसरी पंक्ति का अत्यंत कठिन अर्थ
  choice: “उनके वैभव की छानबीन करना वैभव है” के रूप में मसोरेटी पाठ का निकट अनुवाद
  alternative: “अपने सम्मान की खोज करना सम्मानजनक नहीं” अथवा “गंभीर बातों की खोज करना सम्मान की बात है”
  rationale: मूल पाठ का बहुवचन प्रत्यय और सकारात्मक संज्ञात्मक विधेय अस्पष्ट हैं। किसी नैतिक या धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित करने के बजाय वास्तविक तनाव को सुरक्षित रखा गया है और संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। “वैभव” की पुनरावृत्ति कुछ असामान्य लगती है, पर वह मूल के शब्दालंकार और अस्पष्टता को जानबूझकर सुरक्षित रखती है।
