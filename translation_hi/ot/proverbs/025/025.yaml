  text: Like cold water to a weary soul[a], so is good news from a distant land.
translation:
  language: hi
  text: जैसे थके हुए प्राण के लिए ठंडा पानी, वैसे ही दूर देश से आई अच्छी खबर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूर देश से आया अच्छा समाचार।’ इब्रानी शब्द שְׁמוּעָה का अर्थ ‘खबर,’ ‘समाचार,’ या ‘रिपोर्ट’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קָרִים
  choice: ठंडा पानी
  rationale: מַיִם रूप की दृष्टि से बहुवचन है, पर यहाँ द्रव्यवाचक संज्ञा के रूप में प्रयुक्त है। कָרִים की वास्तविक ठंडक और उससे मिलने वाली ताज़गी को ‘ठंडा पानी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל נֶפֶשׁ עֲיֵפָה
  choice: थके हुए प्राण के लिए
  rationale: इस संदर्भ में עַל संबंध या लाभ का भाव देता है। נֶפֶשׁ पूरे जीवित व्यक्ति अथवा उसके अंतरतम प्राण को सूचित कर सकता है; ‘प्राण’ काव्यात्मक समानांतरता बनाए रखता है, जबकि עֲיֵפָה की थकान ‘थके हुए’ से सहज रूप में व्यक्त होती है।
- source_word: שְׁמוּעָה טוֹבָה
  choice: अच्छी खबर
  rationale: שְׁמוּעָה का अर्थ सुनी हुई खबर, समाचार या सूचना हो सकता है। ‘अच्छी खबर’ आधुनिक हिंदी में स्वाभाविक है और ठंडे पानी से मिलने वाली प्रसन्नता तथा ताज़गी के समानांतर भाव को स्पष्ट रखती है।
- source_word: מֵאֶרֶץ מֶרְחָק
  choice: दूर देश से आई
  rationale: यह पदबंध शाब्दिक रूप से दूरी के देश से आने का भाव रखता है। हिंदी में खबर के साथ ‘दूर देश से आई’ स्रोत और दूरी दोनों को स्वाभाविक ढंग से व्यक्त करता है।
