  yaml_path: translation/ot/proverbs/025/023.yaml
  text: The north wind brings forth rain[a], and an angry face[b], a slanderous tongue.
translation:
  language: hi
  text: उत्तर की हवा वर्षा लाती है[a], और छिपकर निंदा करनेवाली जीभ[b] क्रोधित चेहरा लाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तर की हवा वर्षा को दूर कर देती है, और पीठ-पीछे निंदा करनेवाली जीभ क्रोधित चेहरा लाती है।” इब्रानी क्रिया को अलग-अलग अर्थों में समझा जा सकता है; कुछ व्याख्याकार इसे वर्षा उत्पन्न करने के बजाय उसे दूर करने के अर्थ में लेते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ “गुप्त/छिपी हुई जीभ” है; अर्थात ऐसी वाणी जो परोक्ष में, जैसे पीठ-पीछे निंदा या बदनामी के रूप में, बोली जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ר֣וּחַ צָ֭פוֹן
  choice: उत्तर की हवा
  rationale: यह संबंधसूचक पद उत्तर दिशा से आनेवाली हवा को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: תְּח֣וֹלֵֽל
  choice: लाती है
  rationale: חול का यह रूप उत्पन्न करने या सामने लाने का भाव दे सकता है। ‘लाती है’ कारणात्मक संबंध को सहज हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: גָּ֑שֶׁם
  choice: वर्षा
  rationale: यह वर्षा या मूसलाधार बारिश का सामान्य शब्द है; ‘वर्षा’ पद्यात्मक गरिमा और व्यापक अर्थ दोनों बनाए रखता है।
- source_word: וּ/פָנִ֥ים נִ֝זְעָמִ֗ים
  choice: क्रोध भरा चेहरा
  rationale: פנים रूप की दृष्टि से बहुवचन है, पर इब्रानी में प्रायः एकवचन ‘चेहरा/मुख-मुद्रा’ के अर्थ में आता है। נזעמים क्रोध या रोष का भाव बताता है।
- source_word: לְשׁ֣וֹן סָֽתֶר
  choice: छिपकर निंदा करनेवाली जीभ
  rationale: शाब्दिक अर्थ ‘गुप्त/छिपी हुई जीभ’ है; सन्दर्भ में यह पीठ पीछे की जानेवाली निंदात्मक बात को सूचित करता है। ‘जीभ’ की मूल उपमा सुरक्षित रखी गई है।
