  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। पहली पंक्ति में स्वाभाविक हिन्दी के लिए ‘मान जाता है’ और दूसरी में मूल का ठोस, आश्चर्यजनक रूपक ‘कोमल जीभ…हड्डी’ सुरक्षित रखा गया है।
