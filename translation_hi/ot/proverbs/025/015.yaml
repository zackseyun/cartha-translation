  text: By patience a ruler may be persuaded[b][a], and a gentle tongue breaks a bone.
translation:
  language: hi
  text: 'धैर्य से शासक को मनाया जा सकता है,[a]

    और कोमल जीभ हड्डी तोड़ देती है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लंबे समय तक धैर्य रखने से शासक को मनाया जाता है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कोमल जीभ हड्डी तोड़ देती है”—यह कोमल वाणी की उस शक्ति का रूपक है जो कठोरता या विरोध पर भी विजय पा सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּאֹרֶךְ אַפַּיִם
  choice: धीरज से
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘नाक/क्रोध की लम्बाई’ है और क्रोध करने में धीमे होने, सहनशीलता तथा धैर्यपूर्ण दृढ़ता को दर्शाता है। ‘धीरज से’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יְפֻתֶּה
  choice: मान जाता है
  rationale: पुअल रूप किसी के प्रेरित, राज़ी या सहमत हो जाने का भाव देता है। ‘मान जाता है’ निष्क्रिय परिणाम को सहज हिन्दी में व्यक्त करता है और छल से फुसलाने का अनावश्यक संकेत नहीं देता।
- source_word: קָצִין
  choice: शासक
  rationale: यह शब्द अधिकार रखने वाले व्यक्ति—शासक, अधिकारी या अगुआ—के लिए प्रयुक्त होता है। ‘शासक’ व्यापक, स्पष्ट और कहावत के सामान्य प्रयोग के अनुकूल है।
- source_word: לָשׁוֹן רַכָּה
  choice: कोमल जीभ
  rationale: ‘कोमल’ רַכָּה के मूल चित्र को बनाए रखता है, जबकि ‘जीभ’ वाणी का लाक्षणिक संकेत है। यह अभिव्यक्ति आधुनिक हिन्दी में बोधगम्य रहते हुए इब्रानी रूपक को सुरक्षित रखती है।
- source_word: תִּשְׁבָּר גָּרֶם
  choice: हड्डी तोड़ देती है
  rationale: 'मूल पाठ का सजीव और विरोधाभासी रूपक ज्यों का त्यों रखा गया है: कोमल वाणी कठोर प्रतिरोध पर भी विजय पा सकती है।'
theological_decisions: []
