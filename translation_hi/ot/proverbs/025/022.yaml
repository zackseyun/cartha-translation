  yaml_path: translation/ot/proverbs/025/022.yaml
  text: for you will heap burning coals on his head[b][a], and Yahweh will repay you.
translation:
  language: hi
  text: क्योंकि तू उसके सिर पर जलते अंगारों का ढेर लगाएगा[a], और यहोवा तुझे प्रतिफल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तू उसके सिर पर अंगारे बटोरेगा।” इब्रानी मुहावरा यहाँ बनाए रखा गया है। व्याख्याकारों में मतभेद है कि इसका अर्थ शत्रु को लज्जित करके पश्चाताप की ओर लाना है या उसके न्याय को और बढ़ाना।
    reason: lexical_alternative
  - marker: b
    text: या, “और यहोवा तुझे पुरस्कार देगा।” इब्रानी क्रिया चुकाने या प्रतिदान देने का अर्थ रख सकती है; यहाँ प्रसंग धर्मी व्यक्ति के लिए अनुकूल प्रतिदान का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के उपदेश का कारण बताता है और व्याख्यात्मक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: גֶחָלִים
  choice: जलते अंगारे
  rationale: यह जीवित या दहकते कोयलों की छवि व्यक्त करता है; ‘जलते अंगारे’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: חֹתֶה
  choice: ढेर लगाएगा
  rationale: क्रिया का मूल अर्थ अंगारों को बटोरना या समेटना है; ‘सिर पर’ के साथ ‘ढेर लगाएगा’ परिणामी क्रिया और रूपक दोनों को सुरक्षित रखता है।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: पूर्वसर्गीय वाक्यांश का सीधा अनुवाद है और इब्रानी मुहावरे की व्याख्या किए बिना उसे बनाए रखता है।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को देवनागरी में ‘यहोवा’ रूप में रखा गया है।
- source_word: יְשַׁלֶּם לָךְ
  choice: तुझे उसका प्रतिफल देगा
  rationale: पिअेल रूप चुकाने या बदला देने का भाव रखता है; प्रसंग में यह धर्मी व्यक्ति के लिए अनुकूल प्रतिदान है, इसलिए ‘प्रतिफल देगा’ अर्थ और गरिमा दोनों बनाए रखता है।
theological_decisions:
- issue: ‘सिर पर जलते अंगारों का ढेर’ मुहावरे का अर्थ
  choice: मुख्य पाठ में रूपक को बिना निर्णायक व्याख्या के सुरक्षित रखा गया है।
  alternative: इसे शत्रु को लज्जित करके पश्चाताप की ओर लाने, उसके न्याय को बढ़ाने, या दोनों के संकेत के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ रूपक कहता है, पर उसका प्रभाव स्पष्ट नहीं करता; इसलिए वास्तविक व्याख्यात्मक और धर्मवैचारिक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। पिछले पद से संबद्ध एकवचन अनौपचारिक-साहित्यिक संबोधन ‘तू/तुझे’ रखा गया है। इब्रानी रूपक की अस्पष्टता को मुख्य पाठ में नहीं सुलझाया गया।
