  text: Remove the dross from the silver[a], and a vessel comes out for the refiner.
translation:
  language: hi
  text: 'चाँदी में से अशुद्धियाँ हटा दो,

    तो धातु को शुद्ध करने वाले के लिए एक पात्र निकल आता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָגוֹ
  choice: हटा दो
  rationale: संदर्भ में यह बहुवचन आज्ञार्थक रूप अलग करने या दूर करने का भाव देता है। ‘हटा दो’ आधुनिक, सहज और उपदेशात्मक शैली के अनुकूल है।
- source_word: סִיגִים
  choice: मैल
  rationale: यह धातु को शुद्ध करते समय अलग होने वाली अशुद्धि को दर्शाता है। ‘मैल’ सामान्य हिन्दी पाठक के लिए सहज है और धातु-शोधन के संदर्भ में अर्थ स्पष्ट रखता है।
- source_word: מִכָּסֶף
  choice: चाँदी में से
  rationale: מִן अलगाव का बोध कराता है; ‘चाँदी में से’ उसी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּצֵא
  choice: तो ... निकल आता है
  rationale: यह आज्ञा के फलस्वरूप होने वाले परिणाम को बताता है। ‘तो ... निकल आता है’ सार्वकालिक नीतिवचन के रूप में स्वाभाविक है।
- source_word: לַצֹּרֵף
  choice: सुनार के लिए
  rationale: צֹרֵף धातु को गलाने या शुद्ध करने वाले कारीगर को दर्शा सकता है। चाँदी और पात्र के इस प्रसंग में ‘सुनार’ सहज हिन्दी पद है और कारीगर के व्यापक कार्य को समेटता है।
- source_word: כֶּלִי
  choice: एक पात्र
  rationale: כְּלִי किसी वस्तु, उपकरण या पात्र का व्यापक शब्द है। यहाँ ‘पात्र’ ठोस चित्र बनाए रखते हुए अपेक्षित खुलापन भी सुरक्षित रखता है।
