source:
  edition: WLC
  text: תַּפּוּחֵ֣י זָ֭הָב בְּ/מַשְׂכִּיּ֥וֹת כָּ֑סֶף דָּ֝בָ֗ר דָּבֻ֥ר עַל אָפְנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/025/011.yaml
  text: Like apples of gold in settings of silver is a word spoken at the right time[a][b][c].
translation:
  language: hi
  text: चाँदी की जड़ाई में सोने के सेबों के समान है सही अवसर पर कही गई बात[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उचित रीति से कही गई”; इसका शाब्दिक रूप “अपने पहियों पर कही गई” है—अर्थात ऐसी बात जो उपयुक्त ढंग से या सही समय पर कही गई हो।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द जिस फल को दर्शाता है, वह आज के सेब से ठीक-ठीक मेल न भी खाता हो।
    reason: cultural_note
  - marker: c
    text: या “चाँदी की नक्काशी में” अथवा “चाँदी के जालीदार काम में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחֵי
  choice: सेबों
  rationale: תַּפּוּחַ के पारंपरिक और सर्वाधिक पहचाने जाने वाले अर्थ ‘सेब’ को रखा गया है; प्राचीन फल की ठीक पहचान अनिश्चित होने के कारण टिप्पणी दी गई है।
- source_word: זָהָב
  choice: सोने
  rationale: यह ‘सोना’ बताने वाला सीधा पदार्थवाची शब्द है।
- source_word: בְּמַשְׂכִּיּוֹת
  choice: जड़ाई में
  rationale: מַשְׂכִּיּוֹת सजावटी कारीगरी, नक्काशी या जालीदार काम का संकेत दे सकता है। ‘जड़ाई’ सोने की आकृतियों को चाँदी की कलात्मक बनावट में रखे जाने का चित्र स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: यह ‘चाँदी’ बताने वाला सीधा पदार्थवाची शब्द है।
- source_word: דָּבָר
  choice: बात
  rationale: वाणी के इस प्रसंग में ‘बात’ आधुनिक हिन्दी में ‘कहा गया वचन’ का स्वाभाविक अर्थ देती है और सूक्ति की संक्षिप्तता बनाए रखती है।
- source_word: דָּבֻר
  choice: कही गई
  rationale: यह דבר का कर्मवाच्य रूप है; ‘कही गई’ हिन्दी में उसके रूप और अर्थ को सहजता से व्यक्त करता है।
- source_word: עַל אָפְנָיו
  choice: सही अवसर पर
  rationale: शाब्दिक अभिव्यक्ति ‘अपने पहियों पर’ कठिन मुहावरा है, जो उपयुक्त परिस्थिति, ढंग या समय का संकेत देती है। ‘सही अवसर पर’ समयोचितता को स्पष्ट करता है, जबकि व्यापक उपयुक्तता को पादटिप्पणी में सुरक्षित रखा गया है।
