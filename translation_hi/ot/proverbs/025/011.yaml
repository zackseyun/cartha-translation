  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूक्तिपरक शैली रखी गई है। इब्रानी के उपमान-प्रथम क्रम को बनाए रखा गया है। ‘जड़ाई’ दृश्य बिंब को सहज बनाती है, जबकि मूल की शिल्प-संबंधी अनिश्चितता और कठिन मुहावरे के विकल्प पादटिप्पणियों में सुरक्षित हैं।
