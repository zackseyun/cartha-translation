base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/009.yaml
  text: Like a thorn that comes up in the hand of a drunkard[b][a], so is a proverb in the mouth of fools.
translation:
  language: hi
  text: जैसे नशे में धुत व्यक्ति के हाथ में काँटा[a] उठता है[b], वैसे ही मूर्खों के मुँह में नीतिवचन होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कंटीली झाड़ी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर जाता है” या “चढ़ता है” है। बिंब ऐसा हो सकता है कि काँटा नशे में धुत व्यक्ति के हाथ में ऊपर उठ रहा हो, लहराया जा रहा हो, या अनियंत्रित ढंग से उसके हाथ में आ गया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹחַ
  choice: काँटा
  rationale: यह शब्द काँटे या कंटीले पौधे को सूचित कर सकता है। मुख्य पाठ में ‘काँटा’ तीखी और हानिकारक वस्तु की संक्षिप्त, स्वाभाविक छवि देता है; ‘कंटीली झाड़ी’ को पादटिप्पणी में रखा गया है।
- source_word: עָלָה
  choice: उठता है
  rationale: मूल क्रिया का अर्थ ‘ऊपर जाना/चढ़ना’ है। ‘उठता है’ जानबूझकर चलाने या चुभने का अर्थ जोड़े बिना ऊपर आने की असामान्य और कुछ हद तक अस्पष्ट छवि बनाए रखता है।
- source_word: בְּיַד
  choice: के हाथ में
  rationale: यह ठोस शारीरिक बिंब को सीधे और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: שִׁכּוֹר
  choice: नशे में धुत व्यक्ति
  rationale: यह शब्द नशे में पड़े व्यक्ति को दर्शाता है। यह रूप आधुनिक हिंदी में स्पष्ट है और अनावश्यक रूप से उसके स्थायी चरित्र के विषय में निर्णय नहीं जोड़ता।
- source_word: מָשָׁל
  choice: नीतिवचन
  rationale: नीतिवचन-साहित्य के संदर्भ में यह सूक्ति या ज्ञानपूर्ण कहावत को दर्शाता है; ‘नीतिवचन’ पुस्तक की विधा और तत्काल तुलना दोनों के अनुकूल है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: शाब्दिक शारीरिक बिंब बनाए रखता है और ‘हाथ में’ के साथ वाक्य का समानांतर ढाँचा सुरक्षित करता है।
- source_word: כְסִילִים
  choice: मूर्खों
  rationale: ज्ञान-साहित्य में यह केवल कम बुद्धि वाले नहीं, बल्कि नैतिक रूप से जड़ और हठी लोगों के लिए प्रयुक्त मानक शब्द है; ‘मूर्ख’ इसका स्वाभाविक हिंदी समतुल्य है।
