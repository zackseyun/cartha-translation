  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कहावत की समानांतर रचना—‘हाथ में’ और ‘मुँह में’—सुरक्षित है। मूल बिंब की अनिश्चितता को मुख्य पाठ और पादटिप्पणी में बनाए रखा गया है; काँटे के चुभने या उसे जानबूझकर हथियार की तरह चलाने का अर्थ पाठ में नहीं जोड़ा गया।
