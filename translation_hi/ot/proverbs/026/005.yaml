  text: Answer a fool according to his folly[b][a], lest he be wise in his own eyes.
translation:
  language: hi
  text: मूर्ख को उसकी मूर्खता के अनुसार[a] उत्तर दे, ऐसा न हो कि वह अपनी ही दृष्टि में बुद्धिमान हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख को वैसा उत्तर दे, जैसा उसकी मूर्खता के योग्य है।” इब्रानी का आशय उसकी मूर्खता के अनुकूल उत्तर देना है, न कि उसकी मूर्खता की नकल करना।
    reason: lexical_alternative
  - marker: b
    text: यह कथन नीतिवचन 26:4 के साथ जानबूझकर तनाव में रखा गया है; बुद्धि पहचानती है कि कब चुप रहना और कब प्रत्युत्तर देना उचित है।
    reason: cross_reference
lexical_decisions:
- source_word: עֲנֵה
  choice: उत्तर दे
  rationale: यह ענה का आज्ञार्थक रूप है और इस प्रसंग में किसी बात का प्रत्युत्तर देने की आज्ञा व्यक्त करता है। ‘उत्तर दे’ संक्षिप्त, स्वाभाविक और नीतिवचन 26:4 के समानांतर है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: ख़सील ज्ञान-साहित्य में नैतिक और बौद्धिक रूप से हठी व्यक्ति के लिए प्रचलित शब्द है। ‘मूर्ख’ इस स्थापित श्रेणी को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: כְאִוַּלְתּוֹ
  choice: उसकी मूर्खता के अनुसार
  rationale: आरंभिक כְ अनुरूपता या संगति दर्शाता है। यह शब्दावली इब्रानी की संरचना और पिछले पद के साथ जानबूझकर रखे गए तनाव को सुरक्षित रखती है; इसका आशय स्वयं मूर्खतापूर्ण ढंग अपनाना आवश्यक रूप से नहीं है।
- source_word: פֶּן
  choice: ऐसा न हो कि
  rationale: פֶּן नकारात्मक उद्देश्य अथवा किसी परिणाम को रोकने का भाव व्यक्त करता है। ‘ऐसा न हो कि’ आधुनिक हिन्दी में स्पष्ट और नीतिवचन की गरिमा के अनुकूल है।
- source_word: יִהְיֶה חָכָם
  choice: बुद्धिमान बने
  rationale: अगले वाक्यांश ‘अपनी ही दृष्टि में’ से स्पष्ट है कि वास्तविक बुद्धिमत्ता नहीं, बल्कि अपने विषय में मूर्ख की धारणा अभिप्रेत है। ‘बने’ יִהְיֶה के संभावित परिणामात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: यह इब्रानी मुहावरा अपने आकलन या अपनी समझ में होने का अर्थ देता है। ‘अपनी ही दृष्टि में’ रूपक को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
theological_decisions:
- issue: नीतिवचन 26:4 के साथ व्याख्यात्मक तनाव
  choice: ‘उसकी मूर्खता के अनुसार’ को मुख्य पाठ में बनाए रखकर प्रत्यक्ष तनाव को अनसुलझा छोड़ा गया है।
  alternative: ‘जैसा उसकी मूर्खता के योग्य है’ या ‘उसकी मूर्खता के अनुकूल ढंग से’ उत्तर देना
  rationale: 'सटे हुए दोनों नीतिवचन परिस्थितिनिष्ठ बुद्धि का तनाव जानबूझकर बनाए रखते हैं: उत्तर देने वाला मूर्ख जैसा न बने, फिर भी आवश्यकता होने पर मूर्खता का उचित प्रत्युत्तर दे। अनुवाद को इस तनाव को समतल नहीं करना चाहिए।'
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचन की शैली के अनुरूप रखी गई है। ‘अपनी ही दृष्टि में’ परिचित बाइबिलीय रूपक को सुरक्षित रखता है, जबकि ‘ऐसा न हो कि’ नकारात्मक उद्देश्य को स्पष्ट करता है।
