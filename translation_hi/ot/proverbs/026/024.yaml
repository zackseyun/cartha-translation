  yaml_path: translation/ot/proverbs/026/024.yaml
  text: A hater disguises himself with his lips[b][a], but within himself he sets deceit.
translation:
  language: hi
  text: द्वेषी अपने होंठों से ढोंग करता है, पर अपने भीतर छल रखता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִשְׂפָתוֹ
  choice: अपने होंठों से
  rationale: ב साधन सूचित करता है और ‘होंठ’ की ठोस इब्रानी छवि को बनाए रखता है; हिन्दी में यह उसके बोलने के ढंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִנָּכֵר
  choice: अपना भेष बदलता है
  rationale: נכר के निफ़अल रूप में अपने को वास्तविकता से भिन्न दिखाने, अर्थात पहचान छिपाने या ढोंग करने का भाव है। यह चयन आत्मवाचक अर्थ और बाहरी वाणी तथा भीतरी छल के विरोध को बनाए रखता है।
- source_word: שֹׂונֵא
  choice: द्वेष रखनेवाला
  rationale: यह कृदन्त संज्ञा के रूप में प्रयुक्त है। यह ‘शत्रु’ की अपेक्षा मूल अर्थ—घृणा या द्वेष रखनेवाला व्यक्ति—को अधिक सीधे व्यक्त करता है।
- source_word: וּבְקִרְבּוֹ
  choice: पर अपने भीतर
  rationale: קֶרֶב व्यक्ति के भीतरी भाग को दर्शाता है। ‘अपने भीतर’ बाहरी होंठों के साथ विरोध बनाए रखता है और मूल में न आए ‘हृदय’ को नहीं जोड़ता।
- source_word: יָשִׁית
  choice: रखता है
  rationale: שׁית का मूल भाव रखना या स्थापित करना है। ‘रखता है’ हिन्दी में स्वाभाविक है और छल को भीतर जानबूझकर स्थान देने का भाव सुरक्षित रखता है।
- source_word: מִרְמָה
  choice: छल
  rationale: यह शब्द धोखे या कपट को सूचित करता है। ‘छल’ संक्षिप्त, स्पष्ट और नीतिवचन की गरिमामय शैली के अनुकूल है।
