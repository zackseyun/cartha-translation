id: PRO.26.4
reference: Proverbs 26:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תַּ֣עַן כְּ֭סִיל כְּ/אִוַּלְתּ֑/וֹ פֶּֽן תִּשְׁוֶה לּ֥/וֹ גַם אָֽתָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/004.yaml
  text: Do not answer a fool according to his folly[b][a], lest you also become like him.
translation:
  language: hi
  text: मूर्ख को उसकी मूर्खता के अनुसार उत्तर न दे[a], कहीं ऐसा न हो कि तू भी उसी के समान हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्खतापूर्ण ढंग से उत्तर न दे।” इब्रानी वाक्यांश का अर्थ ऐसा उत्तर देना भी हो सकता है जो मूर्ख की अपनी मूर्खता की नकल करता हो।
    reason: lexical_alternative
  - marker: b
    text: 'नीतिवचन 26:5 में पूरक निर्देश है: “मूर्ख को उसकी मूर्खता के अनुसार उत्तर दे।” दोनों नीतिवचन मिलकर विरोधाभास नहीं, बल्कि परिस्थिति के अनुसार विवेक सिखाते हैं।'
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּעַן
  choice: उत्तर न दे
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; यह स्वाभाविक हिन्दी है और अगले पद में आने वाले समान क्रियापद से संबंध बनाए रखती है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: यह नीतिवचन-साहित्य में नैतिक और बौद्धिक हठ वाले व्यक्ति के लिए प्रयुक्त शब्द है, केवल कम बुद्धि वाले व्यक्ति के लिए नहीं।
- source_word: כְאִוַּלְתּוֹ
  choice: उसकी मूर्खता के अनुसार
  rationale: यह इब्रानी अभिव्यक्ति के अनुरूप है और इस बात की वास्तविक अस्पष्टता बचाए रखती है कि उत्तर मूर्खता की रीति से देना है या उसके अनुरूप उत्तर देना है; इससे पद 5 के साथ जानबूझकर रखा गया तनाव भी बना रहता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह उस नकारात्मक परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है जिससे बचने की चेतावनी दी गई है।
- source_word: תִּשְׁוֶה לּוֹ
  choice: उसी के समान हो जाए
  rationale: שוה यहाँ समान या सदृश होने का भाव देता है; 'समान हो जाए' नैतिक समानता की चेतावनी को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גַם אָתָּה
  choice: तू भी
  rationale: यह इस बात पर बल देता है कि सम्बोधित व्यक्ति भी मूर्ख के समान बन सकता है। एकवचन सम्बोधन बनाए रखने के लिए 'तू' चुना गया है।
theological_decisions:
- issue: नीतिवचन 26:5 के साथ व्याख्यात्मक तनाव
  choice: '''उसकी मूर्खता के अनुसार'' को बिना संकीर्ण व्याख्या के बनाए रखना'
  alternative: '''मूर्खतापूर्ण ढंग से उत्तर न दे'' या ''जैसा उसकी मूर्खता के योग्य है वैसा उत्तर न दे'''
  rationale: अगला पद उलटा निर्देश देता है। दोनों कथन मिलकर परिस्थिति के अनुसार विवेक सिखाते हैं; अनुवाद को इस तनाव को मिटाकर किसी एक अर्थ तक सीमित नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक एकवचन सम्बोधन के लिए 'तू' प्रयुक्त है। मुख्य इब्रानी वाक्य-विन्यास और पद 5 के साथ उसका तनाव सुरक्षित रखा गया है।
