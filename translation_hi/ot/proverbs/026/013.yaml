source:
  edition: WLC
  text: אָמַ֣ר עָ֭צֵל שַׁ֣חַל בַּ/דָּ֑רֶךְ אֲ֝רִ֗י בֵּ֣ין הָ/רְחֹבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/013.yaml
  text: The sluggard says[a], “There is a lion in the road! A lion in the public squares!”
translation:
  language: hi
  text: आलसी कहता है, “रास्ते में शेर है! सार्वजनिक चौकों में[a] शेर है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौड़ी गलियों में।” इब्रानी शब्द अधिक विशेष रूप से नगर के चौड़े, खुले सार्वजनिक स्थानों या चौकों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָצֵל
  choice: आलसी
  rationale: यह संज्ञा नीतिवचन में ऐसे व्यक्ति के चरित्र-प्रकार को दर्शाती है जिसे आलस्य की आदत है। ‘आलसी’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אָמַר
  choice: कहता है
  rationale: यद्यपि इब्रानी रूप पूर्णकालिक है, नीतिवचन की सामान्य अथवा आदतन शैली में यह बताता है कि आलसी प्रायः क्या कहता है; इसलिए वर्तमान काल उपयुक्त है।
- source_word: שַׁחַל / אֲרִי
  choice: शेर / शेर
  rationale: दोनों शब्द शेर को सूचित करते हैं। एक ही हिन्दी शब्द की पुनरावृत्ति समानांतरता और आलसी के अतिरंजित बहाने को बनाए रखती है; अनावश्यक रूप से ‘जवान’ या ‘भयंकर’ नहीं जोड़ा गया।
- source_word: בַּדָּרֶךְ
  choice: रास्ते में
  rationale: यह किसी चलने-फिरने के मार्ग में उपस्थिति बताता है। ‘रास्ते में’ सहज, ठोस और स्थानवाचक हिन्दी है।
- source_word: בֵּין הָרְחֹבוֹת
  choice: सार्वजनिक चौकों में
  rationale: רְחֹבוֹת नगर के चौड़े, खुले सार्वजनिक स्थानों को दर्शाता है। בֵּין यहाँ उनके बीच अथवा उनके परिसर में होने का भाव दे सकता है; ‘सार्वजनिक चौकों में’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उस अर्थ को व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सदृश रखी गई है। ‘शेर’ सामान्य पाठक के लिए ‘सिंह’ से अधिक स्वाभाविक है, जबकि वाक्य की गरिमा और मूल की जोरदार पुनरावृत्ति बनी रहती है।
