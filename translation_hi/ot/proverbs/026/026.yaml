base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/026.yaml
  text: Though hatred is covered with deceit[b][a], his evil will be exposed in the assembly.
translation:
  language: hi
  text: चाहे बैर छल से छिपाया जाए,[a] उसकी बुराई सभा में प्रकट हो जाएगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कपट से’ अथवा ‘धोखे के द्वारा’।
    reason: lexical_alternative
  - marker: b
    text: ‘सभा’ से आशय एकत्र हुए समुदाय से है; अनुवाद ‘मंडली में’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכַּסֶּה
  choice: छिपाया जाए
  rationale: निफ़अल अपूर्ण रूप यहाँ कर्मवाच्य अर्थ देता है और स्त्रीलिंग संज्ञा שִׂנְאָה इसका कर्ता है। सामान्य नीतिवचन के संदर्भ में ‘छिपाया जाए’ स्वाभाविक है।
- source_word: שִׂנְאָה
  choice: बैर
  rationale: यह संज्ञा घृणा अथवा शत्रुता बताती है। व्यक्ति के भीतर छिपी शत्रुता के लिए आधुनिक हिन्दी में ‘बैर’ संक्षिप्त और स्वाभाविक है।
- source_word: בְּמַשָּׁאוֹן
  choice: छल से
  rationale: מַשָּׁאוֹן कपटपूर्ण आचरण या धोखे को सूचित करता है और ב साधन बताता है। ‘छल से’ उसी अर्थ को स्पष्ट तथा संक्षिप्त ढंग से व्यक्त करता है।
- source_word: תִּגָּלֶה
  choice: प्रकट हो जाएगी
  rationale: निफ़अल अपूर्ण रूप का विषय רָעָתוֹ है। भविष्यसूचक अभिव्यक्ति छिपे हुए बैर और अंततः सामने आने वाली बुराई के विरोध को बनाए रखती है।
- source_word: רָעָתוֹ
  choice: उसकी बुराई
  rationale: רָעָה नैतिक बुराई, दुष्टता या हानिकारक मंशा का व्यापक अर्थ रखता है। ‘उसकी बुराई’ इस व्यापकता को सुरक्षित रखती है।
- source_word: בְקָהָל
  choice: सभा में
  rationale: קָהָל एकत्र समुदाय या सभा को बताता है। ‘सभा में’ ठोस सामुदायिक परिवेश को ‘सार्वजनिक रूप से’ जैसे व्याख्यात्मक अनुवाद से बेहतर सुरक्षित रखता है।
