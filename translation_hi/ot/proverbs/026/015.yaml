  yaml_path: translation/ot/proverbs/026/015.yaml
  text: A sluggard buries his hand in the dish[b][a]; he is too weary to bring it back to his mouth.
translation:
  language: hi
  text: आलसी अपना हाथ थाली[b] में गाड़ देता है[a]; अपने हाथ को अपने मुँह तक वापस लाने में वह थक जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छिपा देता है।’ इब्रानी क्रिया का अर्थ ‘छिपाना’ या ‘गाड़ना’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कटोरे’ अथवा ‘बड़े पात्र’ में।
    reason: lexical_alternative
lexical_decisions:
- source_word: טָמַן
  choice: गाड़ देता है
  rationale: इस क्रिया का अर्थ छिपाना या गाड़ना हो सकता है। यहाँ ‘गाड़ देता है’ कहावत के अतिरंजित और हास्यपूर्ण चित्र को सजीव रखता है।
- source_word: עָצֵל
  choice: आलसी
  rationale: नीतिवचन में यह शब्द आलस्य से पहचाने जाने वाले चरित्र-प्रकार को दर्शाता है; ‘आलसी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और स्पष्ट है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिन्दी में कर्ता के अपने अंग के लिए ‘अपना’ स्वाभाविक रूप से इब्रानी के तृतीय पुरुष एकवचन संबंधसूचक प्रत्यय का अर्थ व्यक्त करता है।
- source_word: בַּצַּלָּחַת
  choice: थाली में
  rationale: यह संज्ञा भोजन रखने के पात्र—थाली, कटोरे या बड़े पात्र—को दर्शा सकती है। ‘थाली’ सामान्य हिन्दी में भोजन के प्रसंग के लिए सहज है और पात्र के आकार को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: נִלְאָה
  choice: वह थक जाता है
  rationale: निफ़अल रूप थक जाने या श्रांत होने का भाव देता है। यह अनुवाद आलसी की हास्यास्पद दशा को सीधे रखता है, बिना मूल से अधिक स्पष्ट रूप से ‘बहुत थका’ या ‘असमर्थ’ जोड़ने के।
- source_word: לַהֲשִׁיבָהּ
  choice: उसे ... वापस लाने में
  rationale: הֵשִׁיב का हिफ़ील रूप किसी वस्तु को लौटाने या वापस लाने का अर्थ देता है। स्त्रीलिंग प्रत्यय का संदर्भ ‘हाथ’ से है, और हिन्दी में ‘उसे’ उसी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל פִּיו
  choice: अपने मुँह तक
  rationale: यह गंतव्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा कहावत के हास्यपूर्ण दृश्य को बनाए रखता है।
