  text: A sluggard is wiser in his own eyes than seven who answer with discernment[a].
translation:
  language: hi
  text: आलसी अपनी ही दृष्टि में समझ-बूझ से उत्तर देने वाले सात लोगों से अधिक बुद्धिमान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदारी-भरा उत्तर देने वाले सात लोगों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: अधिक बुद्धिमान
  rationale: מִן से बने तुलनात्मक वाक्य में विशेषण का तुलनात्मक भाव है; हिंदी में ‘से भी अधिक बुद्धिमान’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָצֵל
  choice: आलसी
  rationale: यह नीतिवचन-साहित्य में आदतन आलसी व्यक्ति के लिए प्रयुक्त संज्ञात्मक पद है; हिंदी में ‘आलसी’ संक्षिप्त, स्वाभाविक और स्पष्ट है।
- source_word: בְּעֵינָיו
  choice: अपनी दृष्टि में
  rationale: यह आत्म-मूल्यांकन का इब्रानी मुहावरा है; ‘अपनी दृष्टि में’ आधुनिक हिंदी में उसी अर्थ को गरिमापूर्वक व्यक्त करता है।
- source_word: מִשִּׁבְעָה
  choice: उन सात लोगों से भी
  rationale: מִן तुलना को चिह्नित करता है। ‘से भी’ आलसी के अतिरंजित आत्म-मूल्यांकन और सात समझदार उत्तरदाताओं के साथ विरोध को स्पष्ट करता है।
- source_word: מְשִׁיבֵי
  choice: जो ... उत्तर देते हैं
  rationale: कृदंत का अर्थ उत्तर देने वाले व्यक्तियों से है; संबंधवाचक उपवाक्य हिंदी में सहज है।
- source_word: טָעַם
  choice: समझ-बूझ
  rationale: यहाँ शब्द का अर्थ स्वाद नहीं, बल्कि विवेक, उचित समझ या सूझ-बूझ है। ‘समझ-बूझ से उत्तर’ सामान्य पाठक के लिए स्वाभाविक है और अर्थ की व्यापकता बनाए रखता है।
