  yaml_path: translation/ot/proverbs/026/017.yaml
  text: Like one who grabs a dog by the ears is a passerby who gets involved in a quarrel not his own[a].
translation:
  language: hi
  text: जो राहगीर किसी दूसरे के झगड़े में पड़ता है, वह कुत्ते के कान पकड़ने वाले के समान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो किसी ऐसे झगड़े में दखल देता है जो उसका अपना नहीं है।” इब्रानी क्रिया किसी दूसरे के विवाद में अपने आपको उलझाने या हस्तक्षेप करने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיק
  choice: पकड़ने वाले
  rationale: हिफ़ील कृदंत यहाँ मज़बूती से थामने या पकड़ने की क्रिया बताता है; ‘पकड़ने’ से नीतिवचन का सजीव और जोखिमपूर्ण चित्र स्वाभाविक हिन्दी में बना रहता है।
- source_word: בְּאָזְנֵי
  choice: कानों से
  rationale: पूर्वसर्ग सहित यह पद पकड़ने के स्थान को व्यक्त करता है; आधुनिक हिन्दी में ‘कानों से पकड़ना’ स्वाभाविक प्रयोग है।
- source_word: כָלֶב
  choice: कुत्ते को
  rationale: एकवचन संज्ञा का सीधा अर्थ रखा गया है; हिन्दी वाक्य-विन्यास के कारण कर्मचिह्न ‘को’ जोड़ा गया है।
- source_word: עֹבֵר
  choice: राह चलते
  rationale: काल कृदंत किसी गुजरते हुए व्यक्ति को सूचित करता है। ‘राह चलते’ इस आकस्मिक स्थिति को संक्षिप्त और सहज हिन्दी में व्यक्त करता है तथा सम्भवतः आवारा कुत्ते का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מִתְעַבֵּר
  choice: पड़ता है
  rationale: हित्पाएल रूप इस संदर्भ में किसी दूसरे के विवाद में स्वयं को उलझाने या हस्तक्षेप करने का भाव देता है। ‘झगड़े में पड़ता है’ सामान्य आधुनिक हिन्दी का स्वाभाविक मुहावरा है।
- source_word: עַל
  choice: में
  rationale: यद्यपि मूल पूर्वसर्ग का सामान्य अर्थ ‘पर/के विषय में’ है, ‘पड़ना’ के साथ हिन्दी में विवाद से संबंध व्यक्त करने के लिए ‘में’ स्वाभाविक है।
- source_word: רִיב
  choice: झगड़े
  rationale: यह चुनाव रोज़मर्रा के पारस्परिक विवाद के अर्थ को सामान्य और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: לֹא לוֹ
  choice: पराए
  rationale: शाब्दिक अर्थ ‘जो उसका नहीं’ है। ‘पराया झगड़ा’ संक्षेप में स्पष्ट करता है कि विवाद उस व्यक्ति का अपना नहीं है।
