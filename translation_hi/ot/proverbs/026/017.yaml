translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। तुलना की संरचना हिन्दी में स्पष्टता के लिए ‘वह ... के समान है’ के रूप में व्यक्त की गई है। मुख्य पाठ में ‘पराए झगड़े में पड़ता है’ सहज जनभाषा है, जबकि पादटिप्पणी मूल क्रिया के अधिक स्पष्ट ‘दखल देना’ विकल्प को सुरक्षित रखती है।
