  text: כֹּֽרֶה שַּׁ֭חַת בָּ֣/הּ יִפֹּ֑ל וְ/גֹ֥לֵ֥ל אֶ֝בֶן אֵלָ֥י/ו תָּשֽׁוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/027.yaml
  text: Whoever digs a pit will fall into it[a], and he who rolls a stone, it will come back on him.
translation:
  language: hi
  text: जो गड्ढा खोदता है, वह उसी में गिरेगा; और जो पत्थर लुढ़काता है, वह पत्थर उसी पर लौट आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֶה
  choice: जो ... खोदता है
  rationale: कर्ता के रूप में प्रयुक्त काल participle किसी भी सामान्य व्यक्ति को सूचित करता है; यह रचना हिंदी में कहावत की सार्वभौमिकता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: שַּׁחַת
  choice: गड्ढा
  rationale: यहाँ ऐसा खोदा हुआ गड्ढा अभिप्रेत है जिसमें कोई गिर सकता है; ‘गड्ढा’ सरल, व्यापक और चित्र के अनुकूल है।
- source_word: בָּהּ
  choice: उसी में
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ ‘गड्ढे’ से है; ‘उसी’ प्रतिफल और विडंबना पर उचित बल देता है।
- source_word: יִפֹּל
  choice: गिरेगा
  rationale: अपूर्ण क्रिया यहाँ कहावत में निश्चित अथवा अपेक्षित परिणाम व्यक्त करती है; हिंदी भविष्यकाल इस कारण-परिणाम को स्पष्ट रखता है।
- source_word: וְגֹלֵל
  choice: और जो ... लुढ़काता है
  rationale: दूसरा participle भी सामान्य कर्ता के रूप में है; समान ‘जो’ रचना दोनों पंक्तियों का समांतर रूप बनाए रखती है।
- source_word: אֶבֶן
  choice: पत्थर
  rationale: אֶבֶן का सामान्य और सटीक हिंदी समतुल्य ‘पत्थर’ है।
- source_word: אֵלָיו
  choice: उसी पर
  rationale: שוב के साथ यह उस व्यक्ति की ओर, और संदर्भतः उस पर हानिकारक ढंग से, लौटने का भाव देता है; ‘उसी पर’ प्रतिफल को स्पष्ट करता है।
- source_word: תָּשׁוּב
  choice: लौट आएगा
  rationale: स्त्रीलिंग क्रिया का कर्ता ‘पत्थर’ है और यह वापस आने का भाव रखती है; हिंदी में ‘लौट आएगा’ स्वाभाविक तथा जीवंत है।
