source:
  edition: WLC
  text: כַּ/צִּפּ֣וֹר לָ֭/נוּד כַּ/דְּר֣וֹר לָ/ע֑וּף כֵּ֥ן קִֽלְלַ֥ת חִ֝נָּ֗ם לא תָבֹֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/002.yaml
  text: Like a sparrow in its wandering[a], like a swallow in its flying[c][b], so an undeserved curse does not come to rest.
translation:
  language: hi
  text: जैसे गौरैया भटकती फिरती है, जैसे अबाबील उड़ती रहती है,[a] वैसे ही निराधार शाप आकर नहीं ठहरता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अबाबील’ के स्थान पर swift जाति का कोई पक्षी भी अभिप्रेत हो सकता है; इब्रानी पक्षी-नाम की पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बिना कारण का शाप नहीं आता।” पक्षियों का चित्र संकेत करता है कि वह लक्ष्य पर आकर नहीं उतरता या प्रभावी नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּצִּפּוֹר
  choice: जैसे गौरैया
  rationale: צִפּוֹר छोटे पक्षी के लिए सामान्य शब्द भी हो सकता है, पर समानांतर पक्षी-चित्र में ‘गौरैया’ स्वाभाविक और पारंपरिक विशिष्ट अनुवाद है; כַּ तुलना सूचित करता है।
- source_word: לָנוּד
  choice: भटकती फिरती है
  rationale: נוּד में भटकने, इधर-उधर फुदकने और स्थिर न रहने का भाव है; यह हिंदी प्रयोग गतिशील दृश्य को सहज रूप से व्यक्त करता है।
- source_word: כַּדְּרוֹר
  choice: जैसे अबाबील
  rationale: דְּרוֹר की पारंपरिक पहचान swallow से है, जिसका प्रचलित हिंदी नाम ‘अबाबील’ है; swift की संभावित पहचान पादटिप्पणी में रखी गई है।
- source_word: לָעוּף
  choice: उड़ती रहती है
  rationale: עוּף का मूल अर्थ उड़ना है; ‘रहती है’ पहले खंड के अस्थिर, निरंतर गतिशील चित्र के समानांतर है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: כֵּן उपमाओं से निष्कर्ष की ओर ले जाता है; ‘वैसे ही’ हिंदी में स्पष्ट और स्वाभाविक तुलनात्मक संयोजक है।
- source_word: קִלְלַת חִנָּם
  choice: अकारण दिया गया शाप
  rationale: शाब्दिक अर्थ ‘बिना कारण का शाप’ है। ‘अकारण दिया गया’ उसकी निराधार अथवा अनर्जित प्रकृति को स्पष्ट करता है, बिना यह तय किए कि शाप किसने दिया।
- source_word: לֹא תָבֹא
  choice: आकर नहीं टिकता
  rationale: בוא का शाब्दिक अर्थ ‘आना’ है। पक्षियों की उपमा के संदर्भ में ‘आकर नहीं टिकता’ आगमन और न उतरने/प्रभावी न होने के निहित चित्र दोनों को सुरक्षित रखता है; शाब्दिकता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: क्या अकारण शाप कभी लक्ष्य तक पहुँचता या प्रभावी होता है
  choice: ‘आकर नहीं टिकता’ द्वारा सामान्य नीतिवचनात्मक आश्वासन व्यक्त किया गया
  alternative: ‘नहीं आता’ अथवा पाठ-परंपरा के अनुसार ‘आता है’
  rationale: मसोरेटिक पाठ में לא (‘नहीं’) स्पष्ट है। पक्षी-उपमा शाप के लक्ष्य पर न उतरने का चित्र सुझाती है, पर इसे किसी यांत्रिक आध्यात्मिक सिद्धांत के रूप में विस्तार नहीं दिया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, काव्यात्मक समानांतरता और नीतिवचन की संक्षिप्तता को बनाए रखते हुए। ‘शाप’ गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द है; ‘अकारण’ חִנָּם की नैतिक निराधारता को सहजता से व्यक्त करता है।
