base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/006.yaml
  text: One who sends messages by the hand of a fool cuts off his feet and drinks violence[a].
translation:
  language: hi
  text: जो मूर्ख के हाथ संदेश भेजता है, वह अपने पैर काटता है और हिंसा पीता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बातें”; इब्रानी शब्द के दोनों अर्थ हो सकते हैं, पर यहाँ सम्भवतः किसी दूत को सौंपा गया संदेश अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקַצֶּה
  choice: काटता है
  rationale: पिएल कृदन्त का बलपूर्ण ‘काट डालने’ का अर्थ है; हिन्दी में ‘पैर काटता है’ नीतिवचन की तीखी आत्महानि की छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: רַגְלַיִם
  choice: अपने ही पैर
  rationale: द्विवचन का अर्थ ‘दो पैर’ है। ‘अपने ही’ मूल में स्पष्ट सर्वनाम न होते हुए भी प्रसंग में निहित आत्महानि को हिन्दी में साफ करता है।
- source_word: חָמָס
  choice: हिंसा
  rationale: शब्द हिंसा, अन्याय या घातक हानि को सूचित कर सकता है। ‘हिंसा’ ठोस और प्रबल छवि को बनाए रखता है तथा पैर काटने के समानान्तर बैठता है।
- source_word: שֹׁתֶה
  choice: पीता है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘पीना’ है; रूपक को समझाकर सपाट करने के बजाय सुरक्षित रखा गया है।
- source_word: שֹׁלֵחַ
  choice: जो ... भेजता है
  rationale: कृदन्त का सामान्य, सार्वकालिक नीतिवचनात्मक बल आधुनिक हिन्दी में इस रचना से स्वाभाविक रूप में व्यक्त होता है।
- source_word: דְּבָרִים
  choice: संदेश
  rationale: शाब्दिक अर्थ ‘बातें/वचन’ है, पर किसी के हाथ भेजने के प्रसंग में सौंपा गया संप्रेषण अभिप्रेत होने की अधिक सम्भावना है।
- source_word: בְּיָד
  choice: के हाथ
  rationale: इब्रानी मुहावरा माध्यम या प्रतिनिधि को दर्शाता है; हिन्दी का ‘के हाथ भेजना’ समान रूप से स्वाभाविक और चित्रात्मक है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन साहित्य में यह केवल कम बुद्धि वाले नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति का मानक पद है।
