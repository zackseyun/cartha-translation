translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण नीतिवचन शैली। मूल की समानान्तर और चौंकाने वाली आत्महानि की दोनों छवियाँ—पैर काटना और हिंसा पीना—बिना नरम किए रखी गई हैं।
