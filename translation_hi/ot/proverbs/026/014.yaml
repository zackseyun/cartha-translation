  text: As a door turns on its hinge[a], so a sluggard on his bed.
translation:
  language: hi
  text: जैसे दरवाज़ा अपनी धुरी पर घूमता रहता है, वैसे ही आलसी अपने बिस्तर पर करवट बदलता रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दरवाज़ा अपनी धुरी पर घूमता है, और आलसी अपने बिस्तर पर [करवट बदलता है]।” हिब्रू में तुलना के स्पष्ट शब्द नहीं हैं; दूसरे खंड में क्रिया भी छोड़ी गई है।
    reason: मूल वाक्य-संरचना का वैकल्पिक, अधिक शाब्दिक अनुवाद
lexical_decisions:
- source_word: הַדֶּלֶת
  choice: दरवाज़ा
  rationale: यह सामान्य दरवाज़े को दर्शाता है। हिब्रू में निश्चित उपपद है, पर कहावत में इसका भाव सामान्य उदाहरण का है; हिंदी में बिना किसी संकेतवाचक शब्द के ‘दरवाज़ा’ स्वाभाविक रूप से यही भाव देता है।
- source_word: תִּסּוֹב
  choice: घूमता है
  rationale: סבב यहाँ धुरी पर बार-बार होने वाली घूर्णन गति बताता है। ‘घूमता है’ सरल और चित्रात्मक है।
- source_word: צִירָהּ
  choice: अपनी धुरी पर
  rationale: צִיר दरवाज़े के घूमने की धुरी या चूल को दर्शाता है। ‘धुरी’ आधुनिक पाठकों के लिए स्पष्ट है और एक ही बिंदु पर घूमते रहने का चित्र बनाए रखता है।
- source_word: וְעָצֵל
  choice: वैसे ही आलसी
  rationale: עָצֵל नीतिवचन में आदतन सुस्त व्यक्ति के लिए प्रयुक्त विशिष्ट शब्द है। हिब्रू का וְ शाब्दिक रूप से ‘और’ है, पर दोनों समानांतर खंड स्पष्ट तुलना बनाते हैं; हिंदी में ‘वैसे ही’ उस आशय को सहजता से व्यक्त करता है।
- source_word: מִטָּתוֹ
  choice: अपने बिस्तर पर
  rationale: מִטָּה सोने के बिस्तर को दर्शाता है। ‘अपने’ हिंदी में कर्ता ‘आलसी’ के साथ स्वाभाविक निजवाचक संबंध व्यक्त करता है।
