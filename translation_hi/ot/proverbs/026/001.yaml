id: PRO.26.1
reference: Proverbs 26:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּ/שֶּׁ֤לֶג בַּ/קַּ֗יִץ וְ/כַ/מָּטָ֥ר בַּ/קָּצִ֑יר כֵּ֤ן לֹא נָאוֶ֖ה לִ/כְסִ֣יל כָּבֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/001.yaml
  text: Like snow in summer and like rain at harvest[a], so honor is not fitting for a fool.
translation:
  language: hi
  text: जैसे गरमी में बर्फ और कटनी के समय वर्षा,[a] वैसे ही मूर्ख के लिए सम्मान उचित नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे गरमी में बर्फ और कटनी के समय वर्षा, वैसे ही सम्मान मूर्ख को शोभा नहीं देता।”
    reason: शब्द-विन्यास का वैकल्पिक अनुवाद; נָאוֶה के ‘शोभा देना’ वाले भाव को सामने लाता है।
lexical_decisions:
- source_word: כַּשֶּׁלֶג
  choice: जैसे ... बर्फ
  rationale: उपसर्ग כ तुलना व्यक्त करता है; हिन्दी में ‘जैसे ... बर्फ’ उपमा को स्वाभाविक ढंग से रखता है।
- source_word: בַּקַּיִץ
  choice: गरमी में
  rationale: यह गर्म, सूखे मौसम को सूचित करता है; ‘गरमी में’ साधारण आधुनिक हिन्दी में सहज है।
- source_word: וְכַמָּטָר
  choice: और ... वर्षा
  rationale: दूसरी समानांतर उपमा को ‘और’ से जोड़कर पद का संतुलन बनाए रखा गया है।
- source_word: בַּקָּצִיר
  choice: कटनी के समय
  rationale: קָצִיר फसल काटने के समय को दर्शाता है; यह रूप ग्रामीण और सामान्य दोनों पाठकों के लिए स्पष्ट है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह उपमाओं से निष्कर्ष की ओर ले जाता है और हिन्दी के ‘जैसे... वैसे ही’ विन्यास को पूरा करता है।
- source_word: לֹא נָאוֶה
  choice: उचित नहीं
  rationale: נָאוֶה यहाँ शोभनीय, अनुकूल या उपयुक्त होने का भाव रखता है; ‘उचित नहीं’ स्पष्ट और गरिमापूर्ण है।
- source_word: לִכְסִיל
  choice: मूर्ख के लिए
  rationale: ל को विधेय के साथ ‘के लिए’ द्वारा व्यक्त किया गया है; ‘मूर्ख’ ज्ञान-साहित्य के मानक पद को बनाए रखता है।
- source_word: כָּבוֹד
  choice: सम्मान
  rationale: इस प्रसंग में כָּבוֹד सामाजिक आदर या प्रतिष्ठा है, न कि परमेश्वरीय महिमा; ‘सम्मान’ यही अर्थ स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, संतुलित और लोकोक्तिपरक शैली। ‘गरमी’ तथा ‘कटनी के समय’ सामान्य पाठकों के लिए सहज हैं, जबकि ‘वर्षा’ और ‘सम्मान’ गरिमापूर्ण स्तर बनाए रखते हैं।
