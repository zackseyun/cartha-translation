  yaml_path: translation/ot/proverbs/026/021.yaml
  text: Charcoal for embers[a], and wood for fire[b], and a quarrelsome man for kindling strife.
translation:
  language: hi
  text: जैसे अंगारों के लिए लकड़ी का कोयला[a] और आग के लिए लकड़ी, वैसे ही झगड़ा भड़काने के लिए झगड़ालू मनुष्य[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात लकड़ी से बनाया गया कोयला (चारकोल)।
    reason: lexical_clarification
  - marker: b
    text: शाब्दिक रूप से, ‘झगड़ों का मनुष्य।’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּחָם
  choice: कोयला
  rationale: यहाँ शब्द ईंधन के रूप में प्रयुक्त लकड़ी के कोयले को दर्शाता है; संक्षिप्त और स्वाभाविक हिंदी में ‘कोयला’ आग के बिंब को बनाए रखता है।
- source_word: גֶחָלִים
  choice: अंगारे
  rationale: यह बहुवचन जलते या दहकते कोयलों को सूचित करता है। ‘अंगारे’ פֶּחָם से इसका भेद स्पष्ट रखता है।
- source_word: עֵצִים
  choice: लकड़ी
  rationale: सामूहिक अर्थ वाला सामान्य शब्द है और समानांतर पंक्ति में सहज बैठता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल संज्ञा का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אִישׁ מדונים
  choice: झगड़ालू मनुष्य
  rationale: शाब्दिक संरचना ‘झगड़ों का मनुष्य’ habitual contentious character बताती है; ‘झगड़ालू मनुष्य’ वर्तमान हिंदी में स्वाभाविक है और स्रोत के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: חַרְחַר
  choice: भड़काने
  rationale: क्रिया किसी वस्तु को भड़काने या और तेज करने का भाव देती है। ‘भड़काने’ आग और सामाजिक कलह—दोनों संदर्भों में स्वाभाविक रहकर रूपक को सुरक्षित रखता है।
- source_word: רִיב
  choice: झगड़ा
  rationale: विवाद, कलह या झगड़े के व्यापक अर्थ में प्रयुक्त है; साधारण पाठक के लिए ‘झगड़ा’ स्पष्ट और स्वाभाविक है।
