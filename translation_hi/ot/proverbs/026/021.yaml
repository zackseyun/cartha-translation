  register: आधुनिक, सरल और गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। मूल की तुलना को हिंदी में स्पष्ट करने के लिए ‘जैसे … वैसे ही’ रखा गया है। ‘भड़काने’ से आग का केंद्रीय रूपक और झगड़े को बढ़ाने का सामाजिक अर्थ दोनों बने रहते हैं।
