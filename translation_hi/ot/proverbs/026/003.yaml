base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/003.yaml
  text: A whip for the horse[a], a bridle for the donkey[b], and a rod for the back of fools.
translation:
  language: hi
  text: घोड़े के लिए चाबुक, गधे के लिए लगाम, और मूर्खों की पीठ के लिए छड़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוֹט
  choice: चाबुक
  rationale: यह पशु को हाँकने या अनुशासित करने के साधन को दर्शाता है; आधुनिक हिन्दी में ‘चाबुक’ स्वाभाविक और स्पष्ट है।
- source_word: לַסּוּס
  choice: घोड़े के लिए
  rationale: ל उपयुक्तता या नियत उपयोग बताता है; जातिवाचक एकवचन हिन्दी में कहावत के अनुरूप है।
- source_word: מֶתֶג
  choice: लगाम
  rationale: यह पशु को नियंत्रित करने वाले मुख-साज को दर्शाता है; सामान्य हिन्दी में ‘लगाम’ सहज है और नियंत्रण की धारणा को स्पष्ट रखता है।
- source_word: לַחֲמוֹר
  choice: गधे के लिए
  rationale: ‘गधा’ आधुनिक मानक हिन्दी का सामान्य और स्पष्ट शब्द है।
- source_word: וְשֵׁבֶט
  choice: और ... छड़ी
  rationale: שֵׁבֶט यहाँ मारने अथवा अनुशासन देने वाली छड़ी है; ‘छड़ी’ हिन्दी में इस ठोस साधन को स्वाभाविक रूप से व्यक्त करती है।
- source_word: לְגֵו
  choice: पीठ के लिए
  rationale: संदर्भ में גֵו शरीर के उस पिछले भाग को दर्शाता है जिस पर प्रहार किया जाता है; ‘पीठ’ सबसे स्पष्ट अर्थ है।
- source_word: כְּסִילִים
  choice: मूर्खों की
  rationale: नीतिवचन में यह नैतिक और व्यावहारिक विवेक से रहित लोगों के लिए प्रयुक्त बहुवचन है; सम्बन्धकारक रचना मूल इब्रानी के निकट है।
