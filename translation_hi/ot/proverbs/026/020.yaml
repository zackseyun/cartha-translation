translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों पंक्तियों की कारण-परिणाम समानता को ‘न होने पर’ तथा ‘जहाँ...नहीं होता, वहाँ’ से व्यक्त किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी का चिह्न ‘wood’ के बाद था, पर उसकी सामग्री נִרְגָּן से संबंधित है; इसलिए स्रोत के अनुसार चिह्न ‘कानाफूसी करनेवाला’ के बाद रखा गया है।
