  text: בְּ/אֶ֣פֶס עֵ֭צִים תִּכְבֶּה אֵ֑שׁ וּ/בְ/אֵ֥ין נִ֝רְגָּ֗ן יִשְׁתֹּ֥ק מָדֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/020.yaml
  text: For lack of wood[a], the fire goes out, and where there is no whisperer, strife grows quiet.
translation:
  language: hi
  text: 'लकड़ी न होने पर आग बुझ जाती है,

    और जहाँ कानाफूसी करनेवाला[a] नहीं होता, वहाँ झगड़ा शांत हो जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुगलखोर।” इब्रानी शब्द ऐसे व्यक्ति को दर्शाता है जो प्रायः दबे स्वर में या छिपकर हानि पहुँचानेवाली बातें फैलाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֶפֶס עֵצִים
  choice: लकड़ी न होने पर
  rationale: यह अभाव से उत्पन्न परिणाम का भाव स्वाभाविक हिन्दी में व्यक्त करता है। यहाँ बहुवचन עֵצִים का आशय आग जलाने की लकड़ी से है।
- source_word: תִּכְבֶּה אֵשׁ
  choice: आग बुझ जाती है
  rationale: כבה का अकर्मक अर्थ ‘बुझ जाना’ है; यह सामान्य कथन के रूप में नीतिवचन की शैली के अनुकूल है।
- source_word: וּבְאֵין
  choice: और जहाँ ... नहीं होता, वहाँ
  rationale: यह पहले चरण के समान अभाव की स्थिति बताता है; ‘जहाँ...वहाँ’ हिन्दी में इस सामान्य परिस्थिति और परिणाम को स्पष्ट एवं सहज बनाता है।
- source_word: נִרְגָּן
  choice: कानाफूसी करनेवाला
  rationale: यह ऐसे व्यक्ति की छवि बनाए रखता है जो दबे स्वर में हानिकारक बातें फैलाता है, जबकि अधिक परिचित वैकल्पिक अर्थ ‘चुगलखोर’ को पादटिप्पणी में रखा गया है।
- source_word: יִשְׁתֹּק מָדוֹן
  choice: झगड़ा शांत हो जाता है
  rationale: שתק मौन या शांत होने को व्यक्त करता है। ‘शांत हो जाता है’ विवाद के थमने की छवि बनाए रखता है और उसके पूर्णतः समाप्त हो जाने का अनावश्यक दावा नहीं करता।
