base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/012.yaml
  text: Do you see a man wise in his own eyes? There is more hope for a fool than for him[a].
translation:
  language: hi
  text: क्या तुमने ऐसे मनुष्य को देखा है, जो अपनी ही दृष्टि में बुद्धिमान है?[a] उसकी अपेक्षा मूर्ख के लिए अधिक आशा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम्हें ऐसा मनुष्य दिखाई देता है, जो अपनी ही दृष्टि में बुद्धिमान है?” इब्रानी पूर्णकाल को आलंकारिक अवलोकन या प्रश्न के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתָ
  choice: क्या तुमने ... देखा है
  rationale: काल रूप पूर्ण है और नीतिवचन में आलंकारिक प्रश्न अथवा अवलोकन के रूप में प्रयुक्त हो सकता है; हिन्दी में पूर्णकालिक प्रश्न स्रोत की बनावट और स्वाभाविक अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यह एकवचन पुरुषवाचक उदाहरण है; ‘मनुष्य’ आधुनिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह व्यक्ति का विधेयात्मक वर्णन है और כְסִיל के साथ नीतिसाहित्य का विडंबनापूर्ण विरोध बनाए रखता है।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: यह आत्म-मूल्यांकन का इब्रानी मुहावरा है; ‘ही’ आत्ममुग्ध दावे पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: संज्ञा भविष्य की संभावना अथवा आशा बताती है; नीतिवचन के तुलनात्मक कथन में ‘आशा’ सबसे सीधा विकल्प है।
- source_word: לִכְסִיל
  choice: मूर्ख के लिए
  rationale: כְסִיל नीतिवचन में नैतिक और बौद्धिक हठ वाले मूर्ख की स्थापित श्रेणी है; ‘मूर्ख’ इसे बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उससे अधिक
  rationale: מן यहाँ तुलना सूचित करता है; इस शब्दक्रम में हिन्दी स्पष्ट करती है कि आत्म-दृष्टि में बुद्धिमान व्यक्ति की अपेक्षा मूर्ख के लिए अधिक आशा है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘अपनी ही दृष्टि में’ मूल मुहावरे को गरिमापूर्ण ढंग से सुरक्षित रखता है; दूसरे वाक्य का शब्दक्रम इब्रानी तुलना को स्पष्ट करता है।
