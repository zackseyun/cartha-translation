  text: A lying tongue hates those it crushes[c][b][a], and a flattering mouth causes ruin.
translation:
  language: hi
  text: झूठ बोलने वाली जीभ उनसे घृणा करती है जिन्हें वह कुचलती है,[a] और चिकनी-चुपड़ी बातें करने वाला मुँह विनाश लाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने कुचले हुओं से” अथवा “उनसे जिन्हें उसने घायल किया है।” इब्रानी शब्द कुचले या दबाए गए पीड़ितों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “पतन लाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן שֶׁקֶר
  choice: झूठ बोलने वाली जीभ
  rationale: यह ‘झूठ की जीभ’ का स्वाभाविक आधुनिक हिन्दी रूप है और जीभ को कर्ता बताने वाला मूल रूपक बनाए रखता है।
- source_word: יִשְׂנָא
  choice: घृणा करती है
  rationale: यहाँ अपूर्ण क्रिया नीतिवचन के सामान्य सत्य को व्यक्त करती है, इसलिए वर्तमान काल उपयुक्त है।
- source_word: דַכָּיו
  choice: जिन्हें वह कुचलती है
  rationale: यह रूप कुचले या दबाए गए पीड़ितों की ओर संकेत करता है। संबंध को स्पष्ट करते हुए यह अनुवाद हिंसक भाव बनाए रखता है; पाठगत रूप में प्रत्यय के कारण ‘जिन्हें वह कुचलती है’ सर्वाधिक सहज है।
- source_word: וּפֶה חָלָק
  choice: और चिकनी-चुपड़ी बातें करने वाला मुँह
  rationale: शाब्दिक अर्थ ‘चिकना मुँह’ है; हिन्दी मुहावरे में ‘चिकनी-चुपड़ी बातें’ चापलूसी और कपटपूर्ण मधुरता दोनों व्यक्त करती हैं।
- source_word: יַעֲשֶׂה
  choice: लाता है
  rationale: ‘करता/बनाता है’ के बजाय ‘विनाश लाता है’ आधुनिक हिन्दी में कारण और परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִדְחֶה
  choice: विनाश
  rationale: संज्ञा गिरावट, पतन या बरबादी का भाव रखती है। ‘विनाश’ यहाँ भाषण के घातक परिणाम को संक्षेप में व्यक्त करता है; ‘पतन’ भी संभव है।
