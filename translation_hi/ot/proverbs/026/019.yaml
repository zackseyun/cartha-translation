  yaml_path: translation/ot/proverbs/026/019.yaml
  text: So is the man who deceives his neighbor and says[b][a], “Am I not only joking?”
translation:
  language: hi
  text: ऐसा ही वह व्यक्ति है, जो अपने पड़ोसी[a] को धोखा देकर कहता है, “क्या मैं बस मज़ाक नहीं कर रहा हूँ?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मित्र” अथवा “अपने साथी।” इब्रानी शब्द רֵעַ प्रसंग के अनुसार पड़ोसी, मित्र या साथी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्या मैं खेल नहीं रहा हूँ?” अथवा “क्या मैं ठिठोली नहीं कर रहा हूँ?” इब्रानी कृदंत खेल या परिहास को सूचित कर सकता है; यहाँ यह हानिकारक छल को हल्का बताने वाला बहाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: वैसा ही
  rationale: यह पिछले पद के चित्र से तुलना जोड़ता है और हिन्दी में उपमा का स्वाभाविक संबंध बनाए रखता है।
- source_word: אִישׁ
  choice: वह आदमी
  rationale: नीतिवचन के प्रतिनिधि पुल्लिंग एकवचन को बनाए रखते हुए हिन्दी में तुलना को स्वाभाविक बनाता है।
- source_word: רִמָּה
  choice: धोखा देकर
  rationale: यह दूसरे व्यक्ति के विरुद्ध छलपूर्ण कार्य की नैतिक गंभीरता व्यक्त करता है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: רֵעַ का व्यापक सामाजिक अर्थ रखता है; प्रसंग अनिवार्य रूप से घनिष्ठ मित्रता नहीं बताता।
- source_word: וְאָמַר
  choice: कहता है
  rationale: सामान्य व्यवहार बताने वाले नीतिवचन में वर्तमानकालीन हिन्दी स्वाभाविक है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: अपने बचाव में पूछे गए, सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को व्यक्त करता है।
- source_word: מְשַׂחֵק
  choice: केवल मज़ाक ... कर रहा था
  rationale: मूल कृदंत खेल अथवा परिहास का अर्थ दे सकता है; यहाँ वक्ता हानिकारक छल को मामूली मज़ाक बताकर टालता है। ‘केवल’ इसी व्यावहारिक न्यूनकारी भाव को स्पष्ट करता है।
- source_word: אָנִי
  choice: मैं
  rationale: मूल के स्पष्ट सर्वनाम और आत्मपक्षसमर्थक बल को बनाए रखता है।
