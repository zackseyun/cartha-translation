  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘गोफन’ ठोस प्राचीन चित्र को सुरक्षित रखता है, जबकि वाक्य-संरचना साधारण पाठक के लिए स्पष्ट है।
