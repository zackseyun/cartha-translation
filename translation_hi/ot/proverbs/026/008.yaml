  text: כִּ/צְר֣וֹר אֶ֭בֶן בְּ/מַרְגֵּמָ֑ה כֵּן נוֹתֵ֖ן לִ/כְסִ֣יל כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/008.yaml
  text: Like one who binds a stone in a sling[a], so is one who gives honor to a fool.
translation:
  language: hi
  text: जैसे पत्थर को गोफन[a] में बाँधना, वैसे ही मूर्ख को सम्मान देना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जैसे पत्थर को पत्थरों के ढेर में रखना, वैसे ही मूर्ख को सम्मान देना है।” जिस इब्रानी शब्द का अनुवाद “गोफन” किया गया है, उसका ठीक अर्थ निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּ/צְר֣וֹר
  choice: जैसे … बाँधना
  rationale: इसे צרר, ‘बाँधना’, से लिया गया है। क्रियात्मक रूप ठोस चित्र और उपमा की संरचना दोनों को बनाए रखता है।
- source_word: אֶבֶן
  choice: पत्थर
  rationale: אֶבֶן का सामान्य और प्रसंगानुकूल अर्थ ‘पत्थर’ है, जो गोफन के चित्र से स्वाभाविक रूप से मेल खाता है।
- source_word: בְּ/מַרְגֵּמָה
  choice: गोफन में
  rationale: यह दुर्लभ शब्द अर्थ की दृष्टि से अनिश्चित है। प्रसंग में ‘गोफन’ एक सुसंगत, यद्यपि जानबूझकर असंगत या निष्फल, क्रिया का चित्र देता है। ‘पत्थरों का ढेर’ वाला संभावित अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह चित्र और उसके नीतिवचनात्मक अनुप्रयोग के बीच स्पष्ट तुलना स्थापित करता है।
- source_word: נוֹתֵן
  choice: देना
  rationale: इब्रानी कृदंत सामान्य रूप से किसी के ऐसा करने को बताता है। हिन्दी में संज्ञार्थक क्रिया ‘देना’ उपमा को स्वाभाविक और लिंग-निरपेक्ष रखती है।
- source_word: לִ/כְסִ֣יל
  choice: मूर्ख को
  rationale: नीतिवचन में כְּסִיל नैतिक और व्यावहारिक समझ से हठपूर्वक रहित व्यक्ति को सूचित करता है; ‘मूर्ख’ इसका सामान्य, स्पष्ट हिन्दी समतुल्य है।
- source_word: כָּבֽוֹד
  choice: सम्मान
  rationale: यहाँ כָּבוֹד सामाजिक आदर या प्रतिष्ठा को दर्शाता है। ‘सम्मान’ प्रसंग में ‘महिमा’ की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
theological_decisions: []
