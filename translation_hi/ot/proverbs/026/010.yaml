  text: Like an archer who wounds everyone is one who hires a fool or hires passersby[a][b].
translation:
  language: hi
  text: जो किसी मूर्ख को या राह चलते लोगों को काम पर रखता है, वह उस तीरंदाज़ के समान है जो सबको घायल कर देता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का अर्थ अत्यंत कठिन है। “उस तीरंदाज़ के समान जो सबको घायल कर देता है” एक पुरानी और प्रचलित व्याख्या पर आधारित है। आरंभिक शब्दों का अधिक शाब्दिक अनुवाद “महान व्यक्ति सब कुछ उत्पन्न करता है” या इससे मिलता-जुलता भी किया गया है, पर प्रसंग में उसका अर्थ कम स्पष्ट है।
    reason: alternative_reading
  - marker: b
    text: या “जो किसी मूर्ख को काम पर रखता है और हर राह चलते व्यक्ति को भी काम पर रखता है।” आशय बिना सोचे-समझे लोगों को काम पर रखने से होने वाली हानि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב
  choice: तीरंदाज़
  rationale: इब्रानी पाठ अत्यंत कठिन है। प्रसंग में लंबे समय से प्रचलित व्याख्या के अनुसार यह शब्द तीर चलाने वाले को सूचित करता है; इससे अंधाधुंध हानि की उपमा अगली पंक्ति से स्वाभाविक रूप से जुड़ती है।
- source_word: מְחוֹלֵל
  choice: घायल कर देता है
  rationale: यहाँ चोट पहुँचाने या बेधने का भाव प्रसंगानुकूल है और तीरंदाज़ की छवि को स्पष्ट रखता है।
- source_word: כֹּל
  choice: सबको
  rationale: तीरंदाज़ द्वारा लोगों को हानि पहुँचाने की उपमा में व्यक्तिगत अर्थ स्वाभाविक है।
- source_word: וְשֹׂכֵר
  choice: वह है जो ... काम पर रखता है
  rationale: वाव को उपमा के अनुप्रयोग से जोड़ते हुए हिन्दी में विधेयात्मक तुलना स्पष्ट की गई है।
- source_word: כְּסִיל
  choice: किसी मूर्ख को
  rationale: नीतिवचन में כְּסִיל नैतिक और बौद्धिक विवेकहीनता वाले व्यक्ति के लिए प्रयुक्त मानक शब्द है।
- source_word: וְשֹׂכֵר
  choice: या ... काम पर रखता है
  rationale: दोहराया हुआ कृदंत लापरवाही से नियुक्त करने के दूसरे विकल्प को सामने रख सकता है; ‘या’ हिन्दी में तुलना का आशय स्वाभाविक बनाता है।
- source_word: עֹבְרִים
  choice: राह चलते लोगों को
  rationale: शाब्दिक अर्थ ‘गुज़रने वाले’ है; यहाँ बिना जाँच के मिले-जुले अनजान लोगों को नियुक्त करने का चित्र है।
