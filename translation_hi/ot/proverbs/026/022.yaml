source:
  edition: WLC
  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/022.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: hi
  text: चुगली करनेवाले की बातें स्वादिष्ट कौरों जैसी होती हैं[a], और वे पेट की भीतरी कोठरियों तक उतर जाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लुभावने टुकड़ों जैसी” अथवा “लालच से निगली जानेवाली चीज़ों जैसी।” इब्रानी शब्द दुर्लभ है और उसके अर्थ पर मतभेद है; पुरानी परंपरा में इसका अनुवाद “घावों जैसी” भी किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “पेट की भीतरी कोठरियाँ” व्यक्ति के सबसे गहरे अंतरंग भागों के लिए प्रयुक्त इब्रानी चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: बातें
  rationale: रचनात्मक बहुवचन का स्वाभाविक हिन्दी रूप; इस प्रसंग में बोले गए कथनों का बोध कराता है।
- source_word: נִרְגָּן
  choice: चुगली करनेवाला
  rationale: नीतिवचन में यह शब्द दबे स्वर में फूट डालनेवाली बातें फैलानेवाले व्यक्ति को सूचित करता है। ‘चुगली करनेवाला’ आधुनिक हिन्दी में सहज है और गुप्त रूप से बातें फैलाने का भाव रखता है।
- source_word: כְּמִתְלַהֲמִים
  choice: स्वादिष्ट कौरों जैसी
  rationale: यह दुर्लभ और विवादित रूप उसी लोभनीय भोजन-चित्र को व्यक्त करता जान पड़ता है जो ऐसी बातों को उत्सुकता से ग्रहण किए जाने और भीतर उतरने से मेल खाता है; पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וְהֵם
  choice: और वे
  rationale: इब्रानी के स्पष्ट सर्वनाम को रखा गया है, जिससे ध्यान स्वयं उन बातों पर बना रहता है।
- source_word: יָרְדוּ
  choice: उतर जाती हैं
  rationale: लोकोक्तिपरक सामान्य सत्य के लिए हिन्दी वर्तमानकालीन प्रयोग स्वाभाविक है और नीचे जाने की मूल छवि बचाता है।
- source_word: חַדְרֵי בָטֶן
  choice: पेट की भीतरी कोठरियों तक
  rationale: ‘पेट की कोठरियाँ’ की ठोस इब्रानी छवि को बनाए रखते हुए ‘भीतरी’ और ‘तक’ से व्यक्ति के सबसे गहरे अंतरंग भागों तक पहुँचने का आशय स्पष्ट होता है।
