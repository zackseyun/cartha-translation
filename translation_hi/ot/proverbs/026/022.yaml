  register: आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘चुगली करनेवाला’ सामान्य पाठक के लिए स्पष्ट है; ‘पेट की भीतरी कोठरियाँ’ मूल की ठोस देहात्मक छवि को सुरक्षित रखती हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
