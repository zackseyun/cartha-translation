  text: Like the legs that hang limp from a lame man[a], so is a proverb in the mouth of fools.
translation:
  language: hi
  text: जैसे लँगड़े व्यक्ति की टाँगें ढीली लटकती हैं[a], वैसे ही मूर्खों के मुँह में नीतिवचन भी वैसा ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लँगड़े व्यक्ति की टाँगें ढीली लटकती हैं; मूर्खों के मुँह में नीतिवचन भी वैसा ही है।”
    reason: मूल इब्रानी को स्पष्ट उपमा या दो समानांतर कथनों के रूप में प्रस्तुत करने की संभावित रचनात्मक भिन्नता।
lexical_decisions:
- source_word: דַּלְיוּ
  choice: ढीली लटकती हैं
  rationale: यह क्रिया केवल दुर्बलता नहीं, बल्कि शिथिल होकर नीचे लटकने का सजीव चित्र देती है; यह हिन्दी पदबंध उस बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׁקַיִם
