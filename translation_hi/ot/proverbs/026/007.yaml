  rationale: शब्द निचले पैरों या पिंडलियों की ओर अधिक विशिष्ट संकेत कर सकता है, पर इस उपमा में सामान्य और स्वाभाविक हिन्दी ‘टाँगें’ पर्याप्त सटीक है।
- source_word: מִפִּסֵּחַ
  choice: लँगड़े की
  rationale: पूर्वसर्ग यहाँ अंगों के उस व्यक्ति से संबंध या उसके शरीर से लटकने का भाव देता है; हिन्दी में संबंधकारक रचना मूल चित्र को सहजता से रखती है।
- source_word: וּמָשָׁל
  choice: वैसे ही ... नीतिवचन
  rationale: संयोजक उपमा के दूसरे भाग को आरम्भ करता है; ‘वैसे ही’ समानांतर तुलना को हिन्दी में स्पष्ट करता है।
- source_word: מָשָׁל
  choice: नीतिवचन
  rationale: नीतिवचन की पुस्तक के इस संदर्भ में यह शब्द ज्ञानी कथन या लोकोक्ति का बोध देता है; ‘नीतिवचन’ पुस्तक की विधा और आशय दोनों से मेल खाता है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: यह वाणी में किसी कथन के होने का ठोस इब्रानी रूपक है; हिन्दी में ‘मुँह में’ उसी बिंब को बनाए रखता है।
- source_word: כְסִילִים
  choice: मूर्खों
  rationale: ज्ञान-साहित्य में यह नैतिक और बौद्धिक मूर्खता की स्थापित श्रेणी है; ‘मूर्ख’ उस अर्थ को सीधे और गरिमापूर्वक व्यक्त करता है।
