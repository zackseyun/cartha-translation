translation:
  language: hi
  text: जैसे कुत्ता अपनी उलटी की ओर लौटता है, वैसे ही मूर्ख अपनी मूर्खता दोहराता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכֶלֶב
  choice: जैसे कुत्ता
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है; ‘जैसे कुत्ता’ हिन्दी में स्वाभाविक ढंग से उपमा को स्पष्ट रखता है।
- source_word: שָׁב
  choice: लौटता है
  rationale: यह कृदन्त रूप एक विशिष्ट अथवा बार-बार होने वाली क्रिया का सजीव चित्र देता है; सामान्य वर्तमान काल हिन्दी में इस नीतिवचन के लिए स्वाभाविक है।
- source_word: עַל קֵאוֹ
  choice: अपनी उलटी के पास
  rationale: עַל का मूल स्थानिक भाव ‘पर/के पास’ है और קֵאוֹ का अर्थ प्रत्यय सहित ‘उसकी अपनी उलटी’ है। ‘के पास लौटता है’ स्वाभाविक हिन्दी है और यह आवश्यक रूप से नहीं जोड़ता कि कुत्ता उसे फिर खाता है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह शब्द केवल कम बुद्धि वाले व्यक्ति नहीं, बल्कि नैतिक और बौद्धिक रूप से हठी व्यक्ति को सूचित करता है; ‘मूर्ख’ इसका प्रचलित और उपयुक्त हिन्दी रूप है।
- source_word: שׁוֹנֶה
  choice: दोहराता है
  rationale: यहाँ क्रिया फिर से करने या उसी ओर लौटने का भाव देती है। ‘दोहराता है’ हिन्दी में संक्षिप्त और स्वाभाविक रूप से उस पुनरावृत्ति को व्यक्त करता है।
- source_word: בְאִוַּלְתּוֹ
  choice: अपनी मूर्खता
  rationale: संज्ञा का अर्थ ‘मूर्खता’ है और प्रत्यय उसी मूर्ख की ओर संकेत करता है। ‘दोहराता है’ के साथ विभक्ति को कर्म के रूप में व्यक्त करना स्वाभाविक हिन्दी है।
