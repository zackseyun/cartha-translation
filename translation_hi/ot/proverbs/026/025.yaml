  text: כִּֽי יְחַנֵּ֣ן ק֭וֹל/וֹ אַל תַּֽאֲמֶן בּ֑/וֹ כִּ֤י שֶׁ֖בַע תּוֹעֵב֣וֹת בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/026/025.yaml
  text: When he makes his voice gracious[a], do not trust him[b], for seven abominations are in his heart.
translation:
  language: hi
  text: जब वह अपनी आवाज़ को मधुर बनाए[a], उस पर भरोसा न करना, क्योंकि उसके मन में सात घृणित बातें हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपनी आवाज़ को कृपापूर्ण बनाए”; अर्थात जब वह मीठे या मनभावन ढंग से बोले।'
    reason: lexical_alternative
  - marker: b
    text: ज्ञान-साहित्य में “सात” पूर्णता या भरपूरी का संकेत दे सकता है; मुख्य पाठ में मूल संख्या को बनाए रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: יְחַנֵּן
  choice: मधुर बनाए
  rationale: पिएल रूप यहाँ आवाज़ को मनभावन या कृपापूर्ण बनाने का भाव देता है। ‘मधुर बनाए’ छलपूर्ण आकर्षण के संदर्भ में स्वाभाविक आधुनिक हिन्दी है और इब्रानी बिंब को भी बनाए रखता है।
- source_word: קוֹלוֹ
  choice: अपनी आवाज़ को
  rationale: मूल पाठ में ठोस रूप से ‘उसकी आवाज़’ है; हिन्दी वाक्य में कर्ता के साथ ‘अपनी आवाज़’ स्वाभाविक है और बोलने के ढंग का संकेत सुरक्षित रखता है।
- source_word: אַל תַּאֲמֶן בּוֹ
  choice: उस पर भरोसा न करना
  rationale: האמין ב का अर्थ किसी पर विश्वास या भरोसा रखना है। ‘भरोसा न करना’ केवल उसके कथन को न मानने के बजाय उसके व्यक्तित्व पर अविश्वास का संदर्भ व्यक्त करता है।
- source_word: שֶׁבַע
  choice: सात
  rationale: मूल संख्या को बनाए रखा गया है; ज्ञान-साहित्य में यह पूर्णता या भरपूरी का संकेत भी दे सकती है।
- source_word: תּוֹעֵבוֹת
  choice: घिनौनी बातें
  rationale: यह शब्द नैतिक रूप से अत्यंत घृणित वस्तुओं, विचारों या उद्देश्यों का प्रबल भाव रखता है। ‘घिनौनी बातें’ सामान्य आधुनिक हिन्दी में स्पष्ट है और केवल बाहरी कर्मों तक अर्थ को सीमित नहीं करता।
- source_word: בְּלִבּוֹ
  choice: उसके मन में
  rationale: इब्रानी ‘हृदय’ विचार, इच्छा और मंशा के भीतरी केंद्र को दर्शाता है। आधुनिक हिन्दी में इस संदर्भ में ‘मन’ वही अर्थ अधिक स्वाभाविक ढंग से देता है।
