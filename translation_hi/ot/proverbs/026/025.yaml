translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘आवाज़ को मधुर बनाए’ मूल इब्रानी बिंब को रखते हुए सामान्य पाठक के लिए स्पष्ट है। ‘मन’ आधुनिक हिन्दी में आंतरिक विचारों और मंशाओं के केंद्र को स्वाभाविक रूप से व्यक्त करता है।
