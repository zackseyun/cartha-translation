  naturalness: The Hindi is natural and clear. 'जब... तब' is acceptable, though omitting 'तब' gives a slightly tighter proverbial cadence. 'उस पर भरोसा न करना' is idiomatic.
  terminology: '''मधुर बनाए'' suitably conveys making his voice/speech gracious or charming. ''मन'' is a defensible modern-Hindi rendering of biblical ''heart'' here. ''घृणित बातें'' better preserves the strong moral sense of תּוֹעֵבוֹת without narrowing the referent to speech.'
