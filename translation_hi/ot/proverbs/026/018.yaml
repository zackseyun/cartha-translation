    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִתְלַהְלֵהַּ
  choice: जैसे कोई उन्मत्त व्यक्ति
  rationale: आरम्भिक כְּ तुलना व्यक्त करता है। हित्पोएल कृदन्त यहाँ विक्षिप्त या बेकाबू ढंग से व्यवहार करने वाले व्यक्ति का बोध देता है; ‘उन्मत्त व्यक्ति’ चित्र की तीव्रता बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: הַיֹּרֶה
  choice: चलाता है
  rationale: ירה का अर्थ यहाँ प्रक्षेप्य चलाना है। ‘चलाता है’ जलते हुए अस्त्र और तीर दोनों के साथ स्वाभाविक हिन्दी है और केवल हाथ से फेंकने का अर्थ सीमित नहीं करता।
- source_word: זִקִּים
  choice: जलते हुए अस्त्र
  rationale: शब्द जलती हुई लकड़ियों अथवा आग लगाने वाले प्रक्षेप्यों का संकेत दे सकता है। ‘जलते हुए अस्त्र’ इस प्रक्षेप्य-चित्र और उसकी घातकता को स्पष्ट रखता है, बिना उसे किसी एक विशिष्ट हथियार तक सीमित किए।
- source_word: חִצִּים
  choice: तीर
  rationale: यह संज्ञा सामान्यतः तीरों को दर्शाती है; प्रसंग में इसके सामान्य अर्थ से हटने का कारण नहीं है।
- source_word: וָמָוֶת
  choice: और मृत्यु
  rationale: इब्रानी में शाब्दिक रूप से ‘और मृत्यु’ है। इसी अमूर्त संज्ञा को रखने से चरमोत्कर्ष की तीव्रता और यह सम्भावित अस्पष्टता बनी रहती है कि मृत्यु अंतिम प्रक्षेप्य है, परिणाम है, या घातक हानि का काव्यात्मक सार।
