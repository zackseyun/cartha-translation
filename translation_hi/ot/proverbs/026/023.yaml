    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף סִיגִים
  choice: चाँदी का मैल
  rationale: यह पदबंध शुद्ध चाँदी नहीं, बल्कि चाँदी से निकली अशुद्ध और निकृष्ट धातु को दर्शाता है। ‘चाँदी का मैल’ चमकीले बाहरी रूप और भीतर के घटिया पदार्थ के विरोध को सहज हिंदी में बनाए रखता है।
- source_word: מְצֻפֶּה
  choice: चढ़ा हो
  rationale: निष्क्रिय कृदंत किसी वस्तु पर पतली परत चढ़ाए जाने का भाव देता है। ‘चढ़ा हो’ हिंदी में धातु की बाहरी परत के लिए स्वाभाविक है।
- source_word: עַל חָרֶשׂ
  choice: मिट्टी के बरतन पर
  rationale: חָרֶשׂ मिट्टी से बनी वस्तु या बरतन को सूचित करता है। यह अनुवाद सस्ते मिट्टी के आधार और चमकदार परत के बीच का चित्र स्पष्ट रखता है।
- source_word: שְׂפָתַיִם
  choice: होंठ
  rationale: मूल का शाब्दिक देह-अंग रूपक सुरक्षित रखा गया है; हिंदी में ‘होंठ’ वाणी को व्यक्त करने के लिए सहज रूपक है।
- source_word: דֹּלְקִים
  choice: जोशीले
  rationale: यह कृदंत मूलतः जलने या धधकने की छवि जगाता है और यहाँ तीव्र, गरमजोशी-भरी वाणी का संकेत देता है। ‘जोशीले’ उस तीव्रता को रखता है, पर इसे अनिवार्य रूप से चापलूसी नहीं ठहराता।
- source_word: וְלֶב רָע
  choice: और बुरा मन
  rationale: संयोजक बाहरी वाणी और भीतरी नैतिक दशा को साथ रखता है। ‘बुरा मन’ רָע की नैतिक गंभीरता और לֵב के आंतरिक इच्छा-विचार केंद्र को सामान्य हिंदी में व्यक्त करता है।
