base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/025.yaml
  text: Before the mountains were settled[a], before the hills, I was brought forth.
translation:
  language: hi
  text: 'पहाड़ों के स्थापित किए जाने से पहले,

    पहाड़ियों से पहले, मैं उत्पन्न हुई थी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं जन्मी थी” अथवा “मैं जनित हुई थी।” इब्रानी में व्यक्तिरूप में प्रस्तुत बुद्धि के लिए जन्म या उद्गम की छवि प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: से पहले
  rationale: यह समयगत पूर्वता बताता है; आधुनिक हिन्दी में ‘से पहले’ स्वाभाविक है और पद की समानांतर रचना के अनुकूल है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी रूप; परसर्ग के कारण संबंधकारक रूप प्रयुक्त हुआ है।
- source_word: הָטְבָּעוּ
  choice: स्थिर किए जाने
  rationale: טבע के होफ़ाल रूप में पहाड़ों को दृढ़ता से स्थापित या जमा दिए जाने का भाव है। यह अनुवाद सृष्टि में उनके स्थापन को स्पष्ट करता है, पर अनावश्यक रूप से शाब्दिक ‘धँसाए जाने’ को नहीं अपनाता।
- source_word: לִפְנֵי
  choice: से पहले
  rationale: यहाँ अर्थ स्थानगत नहीं, समयगत है। पुनरावृत्ति मूल की काव्यात्मक समानांतरता बनाए रखती है।
- source_word: גְבָעוֹת
  choice: पहाड़ियों
  rationale: ‘पहाड़ों’ के समानांतर आने वाली सामान्य स्थलाकृतिक संज्ञा का स्वाभाविक हिन्दी रूप।
- source_word: חוֹלָלְתִּי
  choice: मैं उत्पन्न हुई थी
  rationale: यह अभिव्यक्ति जन्म अथवा उद्गम की रूपकात्मक छवि को बनाए रखती है। ‘हुई’ स्त्रीलिंग व्यक्तिरूप ‘बुद्धि’ के अनुरूप है; ‘उत्पन्न’ हिन्दी में ‘जन्मी’ या ‘जनित’ की अपेक्षा कम जैविक अथवा मत-सिद्धान्तगत रूप से संकीर्ण है।
theological_decisions:
- issue: व्यक्तिरूप में बोलती बुद्धि के उद्गम की भाषा को बाद के धर्मसिद्धान्तों से अनावश्यक रूप से निर्धारित किए बिना प्रस्तुत करना
  choice: मैं उत्पन्न हुई थी
  alternative: मैं जन्मी थी / मैं जनित हुई थी
  rationale: मूल इब्रानी जन्म और उद्गम की काव्यात्मक छवि रखता है, पर उसके ठीक जैविक या धर्मसिद्धान्तगत अर्थ को निश्चित नहीं करता। ‘उत्पन्न हुई थी’ उस तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पंक्ति-विभाजन इब्रानी काव्य की समानांतर संरचना को उभारता है; ‘स्थिर किए जाने’ सृष्टि में दृढ़ स्थापन का भाव देता है।
