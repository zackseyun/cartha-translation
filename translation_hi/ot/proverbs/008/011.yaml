source:
  edition: WLC
  text: כִּֽי טוֹבָ֣ה חָ֭כְמָה מִ/פְּנִינִ֑ים וְ/כָל חֲ֝פָצִ֗ים לֹ֣א יִֽשְׁווּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/011.yaml
  text: For wisdom is better than jewels[a], and all desirable things cannot compare with her.
translation:
  language: hi
  text: 'क्योंकि बुद्धि रत्नों[a] से उत्तम है,

    और कोई भी मनचाही वस्तु उसकी बराबरी नहीं कर सकती।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मोतियों’ अथवा ‘माणिकों’; इब्रानी शब्द बहुमूल्य रत्नों का बोध कराता है, पर ठीक किस रत्न का, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आग्रह का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में उसके संयोजक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: טוֹבָה חָכְמָה
  choice: बुद्धि ... उत्तम है
  rationale: מִן के साथ טוֹבָה तुलनात्मक अर्थ देता है; ‘उत्तम’ बुद्धि की श्रेष्ठता को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: מִפְּנִינִים
  choice: रत्नों से
  rationale: פְּנִינִים किसी विशिष्ट पत्थर की पहचान में अनिश्चित है और मोती, माणिक अथवा बहुमूल्य रत्नों के लिए समझा गया है; ‘रत्न’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: וְכָל חֲפָצִים
  choice: और कोई भी मनचाही वस्तु
  rationale: חֲפָצִים इच्छा या अभिलाषा की वस्तुओं को व्यापक रूप से दर्शाता है। निषेध के साथ ‘कोई भी’ मूल के समष्टिगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא יִשְׁווּ בָהּ
  choice: उसकी बराबरी नहीं कर सकती
  rationale: שׁוה עם ב का अर्थ बराबर होना या तुलना में ठहरना है। स्त्रीलिंग एकवचन प्रत्यय को ‘उसकी’ द्वारा बनाए रखा गया है, जिससे अध्याय में बुद्धि का स्त्री-रूपक सुरक्षित रहता है।
theological_decisions:
- issue: बुद्धि का स्त्री-रूप में मानवीकरण
  choice: स्त्रीलिंग संकेत ‘उसकी’ को बनाए रखना
  alternative: निर्जीव ढंग से ‘इसकी’ या पुनः ‘बुद्धि की’ कहना
  rationale: इब्रानी בָהּ स्त्रीलिंग एकवचन है और नीतिवचन 8 में बुद्धि को स्त्री के रूप में प्रस्तुत किया गया है। ‘उसकी’ साहित्यिक मानवीकरण को सुरक्षित रखता है, बिना कोई अतिरिक्त सिद्धान्त आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘मनचाही वस्तु’ सामान्य पाठक के लिए सहज है, जबकि ‘उसकी’ बुद्धि के स्त्री-रूपक को स्पष्ट रखता है।
