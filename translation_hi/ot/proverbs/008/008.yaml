  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धार्मिकता के अनुसार’ इब्रानी בְּצֶדֶק की रचना और नैतिक भाव को यथासंभव सुरक्षित रखता है; ‘टेढ़ा’ और ‘कुटिल’ मूल के निकटार्थक युग्म को बनाए रखते हैं।
