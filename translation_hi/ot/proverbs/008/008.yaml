  yaml_path: translation/ot/proverbs/008/008.yaml
  text: All the words of my mouth are righteous[a]; there is nothing twisted or crooked in them.
translation:
  language: hi
  text: मेरे मुँह की सारी बातें धार्मिकता से भरी हैं; उनमें कुछ भी टेढ़ा या कुटिल[a] नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनमें कुछ भी विकृत या टेढ़ा नहीं है।’
    reason: नִפְתָּל और עִקֵּשׁ के निकटार्थक वैकल्पिक अनुवाद को दर्शाने के लिए।
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: धार्मिकता के अनुसार हैं
  rationale: בְּ के साथ צֶדֶק नैतिक सहीपन और धार्मिकता के अनुरूप होने का भाव देता है। यह अनुवाद इब्रानी पूर्वसर्गीय रचना का अर्थ बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: כָּל אִמְרֵי פִי
  choice: मेरे मुँह की सारी बातें
  rationale: यह चयन ‘मेरे मुँह के वचन’ की इब्रानी छवि को सहज आधुनिक हिन्दी में बनाए रखता है और כָּל की व्यापकता को ‘सारी’ से व्यक्त करता है।
- source_word: אֵין בָּהֶם
  choice: उनमें कुछ भी ... नहीं है
  rationale: अस्तित्वसूचक निषेध और बहुवचन सर्वनाम को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: נִפְתָּל
  choice: टेढ़ा
  rationale: यह शब्द मुड़े हुए, विकृत या नैतिक रूप से पथभ्रष्ट होने की ठोस छवि देता है; ‘टेढ़ा’ सरल और सजीव हिन्दी है।
- source_word: וְעִקֵּשׁ
  choice: या कुटिल
  rationale: עִקֵּשׁ टेढ़ेपन, विकृति या दुरभिसंधिपूर्ण कुटिलता को सूचित करता है। ‘कुटिल’ पहले शब्द के निकटार्थक होते हुए भी उससे अलग नैतिक बल बनाए रखता है।
