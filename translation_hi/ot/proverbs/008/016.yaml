source:
  edition: WLC
  text: בִּ֭/י שָׂרִ֣ים יָשֹׂ֑רוּ וּ֝/נְדִיבִ֗ים כָּל שֹׁ֥פְטֵי צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/016.yaml
  text: By me rulers rule[a], and nobles, all judges of righteousness.
translation:
  language: hi
  text: 'मेरे द्वारा शासक शासन करते हैं,

    और कुलीन जन—अर्थात् वे सभी जो न्यायपूर्वक न्याय करते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּי
  choice: मेरे द्वारा
  rationale: 'यहाँ בְּ उपसर्ग साधन अथवा माध्यम का भाव देता है: शासक बुद्धि के माध्यम से शासन करते हैं। ‘मेरे द्वारा’ संक्षिप्त और स्वाभाविक है।'
- source_word: שָׂרִים
  choice: शासक
  rationale: यह शब्द राजकुमारों अथवा ऊँचे अधिकारियों को सूचित कर सकता है। ‘शासक’ आधुनिक हिन्दी में व्यापक शासकीय अधिकार को व्यक्त करता है और इसे केवल राजा के पुत्रों तक सीमित नहीं करता।
- source_word: יָשֹׂרוּ
  choice: शासन करते हैं
  rationale: שׂרר का अर्थ शासन करना अथवा अधिकार रखना है। ‘शासक शासन करते हैं’ मूल की संक्षिप्त शब्द-पुनरावृत्ति और नीतिवचन की शैली को बनाए रखता है।
- source_word: וּנְדִיבִים
  choice: कुलीन जन
  rationale: यहाँ शब्द प्रतिष्ठित अथवा उच्च पदस्थ अगुवों के लिए है। ‘कुलीन जन’ उन्हें पहले आए ‘शासक’ से अलग रखते हुए सामाजिक-राजनीतिक प्रतिष्ठा का भाव देता है।
- source_word: כָּל
  choice: वे सभी
  rationale: स्पष्ट परिमाणवाचक शब्द को बनाए रखा गया है और हिन्दी में अगले पद को ‘कुलीन जन’ की व्याख्या के रूप में स्वाभाविक बनाया गया है।
- source_word: שֹׁפְטֵי צֶדֶק
  choice: जो न्यायपूर्वक न्याय करते हैं
  rationale: शाब्दिक संरचना ‘धार्मिकता/न्याय के न्यायी’ हिन्दी में अस्वाभाविक है। यह रूप न्यायिक कार्य और צֶדֶק के सही अथवा न्यायसंगत मानदंड—दोनों को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צֶדֶק
  choice: न्यायपूर्वक
  rationale: צֶדֶק नैतिक धार्मिकता और न्यायिक न्याय, दोनों का बोध करा सकता है। न्यायाधीशों के संदर्भ में ‘न्यायपूर्वक’ मुख्य पाठ में स्वाभाविक है; व्यापक नैतिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: राजनीतिक अधिकार में बुद्धि की भूमिका
  choice: पद कहता है कि शासक और न्यायी बुद्धि के माध्यम से अपना शासन और न्याय का कार्य करते हैं।
  alternative: इसे ऐसा व्यापक विधान मानना कि हर राजनीतिक शासक को बुद्धि का प्रत्यक्ष समर्थन प्राप्त है।
  rationale: मूल पाठ शासन के साधन अथवा माध्यम के रूप में बुद्धि को प्रस्तुत करता है, पर हर शासक की वैधता या उसके प्रत्येक कार्य के समर्थन पर कोई विस्तृत धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। दूसरे अर्धपद का व्याख्यात्मक संबंध स्पष्ट करने के लिए दीर्घ विराम-चिह्न प्रयुक्त हुआ है; इससे ‘कुलीन जन’ और ‘वे सभी जो…’ के बीच मूल का समानाधिकरण स्वाभाविक हिन्दी में व्यक्त होता है।
