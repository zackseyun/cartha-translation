  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। दोनों समानांतर पंक्तियों में ‘उत्तम है’ दोहराकर तुलना स्पष्ट की गई है। חָרוּץ और פָּז के बीच सामान्य सोने तथा विशेष रूप से शुद्ध/उत्तम सोने का भेद ‘सोना’ और ‘कुंदन’ से व्यक्त किया गया है।
