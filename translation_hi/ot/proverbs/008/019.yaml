  yaml_path: translation/ot/proverbs/008/019.yaml
  text: My fruit is better than gold[a], even fine gold, and my yield than choice silver.
translation:
  language: hi
  text: 'मेरा फल सोने से, यहाँ तक कि खरे सोने से भी, उत्तम है,

    और मेरी उपज श्रेष्ठ चाँदी से उत्तम है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: उत्तम है
  rationale: तुलनात्मक מִן के साथ यह विशेषण ‘से उत्तम है’ का अर्थ देता है; इससे केवल सामान्य अच्छाई नहीं, स्पष्ट तुलना व्यक्त होती है।
- source_word: פִּרְיִי
  choice: मेरा फल
  rationale: פְּרִי का सामान्य अर्थ ‘फल’ या ‘उपज’ है। ‘मेरा फल’ बुद्धि से मिलने वाले परिणाम का रूपक बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: מֵחָרוּץ
  choice: सोने से
  rationale: ज्ञान-साहित्य में חָרוּץ प्रायः सोने को दर्शाता है। अगले शब्द פָּז से उसके विशेष रूप से शुद्ध/उत्तम प्रकार का भेद बनाए रखने के लिए यहाँ सामान्य ‘सोना’ उपयुक्त है।
- source_word: וּמִפָּז
  choice: हाँ, कुंदन से भी
  rationale: פָּז विशेष रूप से शुद्ध या उत्तम सोने को दर्शाता है। ‘कुंदन’ आधुनिक हिन्दी में परिष्कृत, उच्च-शुद्धता वाले सोने का बोध देता है; ‘हाँ ... भी’ समानांतर पद में बढ़ते हुए जोर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּתְבוּאָתִי
  choice: और मेरी उपज
  rationale: תְּבוּאָה उपज, पैदावार या प्राप्ति को दर्शाता है। ‘उपज’ पहले चरण के ‘फल’ के साथ कृषि-रूपक और अर्थगत समानांतरता दोनों बनाए रखता है।
- source_word: מִכֶּסֶף נִבְחָר
  choice: चुनी हुई चाँदी से
  rationale: נִבְחָר का मूल भाव ‘चुना हुआ/श्रेष्ठ चुना हुआ’ है। ‘चुनी हुई चाँदी’ विशेषण की ठोस छवि को बिना अतिरिक्त व्याख्या के सुरक्षित रखती है।
theological_decisions: []
