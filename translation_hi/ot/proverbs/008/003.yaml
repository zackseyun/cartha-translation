  yaml_path: translation/ot/proverbs/008/003.yaml
  text: Beside the gates[a], at the mouth of the city, at the entrance of the doorways[b], she cries out.
translation:
  language: hi
  text: फाटकों के पास, नगर के मुहाने पर, द्वारों के प्रवेश-स्थानों पर, वह ऊँचे स्वर में पुकारती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיַד שְׁעָרִים
  choice: फाटकों के पास
  rationale: לְיַד का स्वाभाविक स्थानवाचक अर्थ ‘के पास’ है; שְׁעָרִים नगर के सार्वजनिक फाटकों को दर्शाता है।
- source_word: לְפִי קָרֶת
  choice: नगर के मुहाने पर
  rationale: לְפִי का शाब्दिक बिंब ‘के मुँह/मुहाने पर’ है। ‘मुहाना’ हिन्दी में प्रवेश-स्थान का बोध देते हुए मूल बिंब और काव्यात्मक समानांतरता बनाए रखता है। קָרֶת के लिए ‘नगर’ गरिमापूर्ण और स्वाभाविक है।
- source_word: מְבוֹא פְתָחִים
  choice: प्रवेश-द्वारों के सामने
  rationale: מְבוֹא प्रवेश या पहुँचने की जगह को और פְתָחִים खुले द्वारों/प्रवेश-स्थानों को सूचित करता है। ‘प्रवेश-द्वारों के सामने’ हिन्दी में स्थान-संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: תָּרֹנָּה
  choice: वह ऊँचे स्वर में पुकारती है
  rationale: क्रिया सार्वजनिक और श्रव्य घोषणा का भाव देती है। स्त्रीलिंग एकवचन रूप का संबंध प्रसंग में व्यक्तित्व-रूप में प्रस्तुत बुद्धि से है; ‘ऊँचे स्वर में पुकारती है’ भाव को बिना अनावश्यक भावात्मक रंग दिए व्यक्त करता है।
