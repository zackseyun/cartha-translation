  text: I[a], wisdom, dwell with prudence, and I find knowledge and discretion.
translation:
  language: hi
  text: मैं, बुद्धि, विवेक के साथ रहती हूँ,[a] और योजनाओं का ज्ञान पाती हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं, बुद्धि, विवेक के साथ रही हूँ।” इब्रानी क्रिया का अनुवाद भूतपूर्ण रूप में भी किया जा सकता है। “योजनाओं” के लिए प्रयुक्त इब्रानी शब्द का अर्थ प्रसंग के अनुसार “युक्तियाँ,” “विवेकपूर्ण विचार” या “सही निर्णय” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह ज्ञान से भिन्न, जीवन को उचित रीति से चलाने वाली बुद्धि है। प्रथम पुरुष में बोलने के कारण इसका मानवीकरण स्वाभाविक रूप से बना रहता है।
- source_word: שָׁכַנְתִּי
  choice: रहती हूँ
  rationale: שׁכן का मूल अर्थ बसना या निवास करना है। काव्यात्मक वर्तमान प्रसंग में सहज हिन्दी के लिए वर्तमान काल चुना गया है; इब्रानी पूर्ण रूप के कारण भूतपूर्ण अर्थ भी संभव है।
- source_word: עָרְמָה
  choice: विवेक
  rationale: यहाँ शब्द का सकारात्मक अर्थ व्यावहारिक समझ और सावधानी है, न कि छल-कपट। 'विवेक' आधुनिक हिन्दी में इस सद्गुण को स्पष्ट करता है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: यह संज्ञा का सीधा और प्रचलित अर्थ है तथा इसे 'बुद्धि' से अलग बनाए रखता है।
- source_word: מְזִמּוֹת
  choice: सूझ-बूझ
  rationale: सकारात्मक ज्ञान-साहित्यिक संदर्भ में यह सोच-विचार, योजनाशील समझ या विवेकपूर्ण निर्णय की क्षमता व्यक्त करता है। 'सूझ-बूझ' यहाँ सहज और प्रशंसात्मक है।
- source_word: אֶמְצָא
  choice: पाती हूँ
  rationale: מצא का सामान्य अर्थ 'पाना/ढूँढ़ पाना' है। हिन्दी में 'ज्ञान तथा सूझ-बूझ पाती हूँ' मूल क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְ
  choice: और / तथा
  rationale: संयोजक दोनों उपवाक्यों और अंतिम दो संज्ञाओं को जोड़ता है; हिन्दी प्रवाह के अनुसार 'और' तथा 'तथा' प्रयुक्त हैं।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: वक्ता को मानवीकृत बुद्धि के रूप में प्रस्तुत किया गया है, बिना किसी बाद की धर्मवैज्ञानिक पहचान को अनुवाद में जोड़ने के।
  alternative: '''बुद्धि'' को व्यक्तिवाचक नाम जैसा दिखाना या पद में प्रत्यक्ष मसीही पहचान जोड़ना।'
  rationale: नीतिवचन 8 बुद्धि को काव्यात्मक रूप से बोलते हुए प्रस्तुत करता है। पद स्वयं इससे आगे कोई निश्चित व्यक्तित्वगत या मसीही पहचान स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक। स्त्रीलिंग क्रियाएँ 'बुद्धि' के व्याकरणिक लिंग और प्रथम-पुरुष मानवीकरण के अनुरूप हैं।
