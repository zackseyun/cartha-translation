  edition: WLC
  text: אַ֥שְֽׁרֵי אָדָם֮ שֹׁמֵ֪עַֽ֫ לִ֥/י לִ/שְׁקֹ֣ד עַל דַּ֭לְתֹתַ/י י֤וֹם י֑וֹם לִ֝/שְׁמֹ֗ר מְזוּזֹ֥ת פְּתָחָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/034.yaml
  text: Blessed is the man who listens to me[a], watching at my doors day by day, keeping watch at the doorposts of my entrances.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो मेरी बात सुनता है[a], जो दिन-प्रतिदिन मेरे द्वारों के पास चौकसी करता और मेरे प्रवेश-द्वारों की चौखटों की निगरानी करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” एकवचन में है, पर इसका अर्थ सामान्य है—अर्थात कोई भी व्यक्ति जो बुद्धि की बात सुनता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह अभिव्यक्ति सुख, कल्याण और फलती-फूलती दशा बताती है; ‘धन्य है’ ज्ञान-साहित्य की आशीर्वचनात्मक शैली को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אָדָם
  choice: वह मनुष्य
  rationale: एकवचन और लोकोक्तिपरक शैली सुरक्षित रहती है; यहाँ ‘मनुष्य’ का प्रयोग प्रतिनिधिक और सामान्य अर्थ में किसी भी व्यक्ति के लिए है।
- source_word: שֹׁמֵעַ לִי
  choice: जो मेरी सुनता है
  rationale: यह निरंतर ध्यानपूर्वक सुनने का भाव रखता है और इसे केवल ‘आज्ञा मानने’ तक सीमित करके अंतर्निहित श्रवण-बिंब को नहीं मिटाता।
- source_word: לִשְׁקֹד עַל דַּלְתֹתַי
  choice: मेरे द्वारों पर जागता
  rationale: שׁקד में सतर्क, तत्पर और लगन से प्रतीक्षा करने का भाव है; ‘जागता’ द्वार के पास सजग उपस्थिति का बिंब संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: יוֹם יוֹם
  choice: दिन-प्रतिदिन
  rationale: हिब्रू की पुनरुक्ति से व्यक्त निरंतर नियमितता को बनाए रखता है।
- source_word: לִשְׁמֹר מְזוּזוֹת פְּתָחָי
  choice: मेरे प्रवेश-द्वारों की चौखटों पर पहरा देता है
  rationale: שׁמר के निगरानी रखने के भाव और מזוזות के ठोस स्थापत्य-बिंब को सुरक्षित रखता है; ‘प्रवेश-द्वार’ פְּתָחַי के बहुवचन को दर्शाता है।
theological_decisions:
- issue: ज्ञान-वचन में सामान्य अर्थ वाला पुल्लिंग एकवचन
  choice: वह मनुष्य
  alternative: वह व्यक्ति / जो कोई
  rationale: हिब्रू אָדָם व्याकरणतः पुल्लिंग एकवचन है, पर संदर्भ में केवल पुरुषों तक सीमित नहीं है। मुख्य पाठ एकवचन लोकोक्तिपरक रूप रखता है और पादटिप्पणी उसका समावेशी सामान्य अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज ज्ञान-साहित्यिक शैली। ‘मेरी सुनता है’ बोलचाल में स्वाभाविक है, जबकि ‘द्वारों’, ‘चौखटों’ और ‘पहरा’ से मूल का प्रतीकात्मक स्थापत्य-बिंब बना रहता है।
