id: PRO.8.30
reference: Proverbs 8:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֥ה אֶצְל֗/וֹ אָ֫מ֥וֹן וָֽ/אֶהְיֶ֣ה שַׁ֭עֲשֻׁעִים י֤וֹם י֑וֹם מְשַׂחֶ֖קֶת לְ/פָנָ֣י/ו בְּ/כָל עֵֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/030.yaml
  text: Then I was beside him[a], like a master workman; and I was his delight day after day, rejoicing before him at all times[b],
translation:
  language: hi
  text: तब मैं उसके पास एक कुशल कारीगर[a] के समान थी; मैं दिन-प्रतिदिन उसका आनंद थी, और हर समय उसके सामने आनंद मनाती[b] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक छोटे बच्चे के समान” (या “एक विश्वासयोग्य जन के रूप में”); यहाँ प्रयुक्त इब्रानी शब्द कठिन है और उसका आशय भिन्न हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “हर समय उसके सामने खेलती थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה
  choice: मैं ... थी
  rationale: यहाँ היה का रूप बुद्धि के सृष्टि-वर्णन में अतीत की अवस्था बताता है; स्त्रीलिंग वक्ता ‘बुद्धि’ के अनुसार ‘थी’ स्वाभाविक है।
- source_word: אֶצְלוֹ
  choice: उसके पास
  rationale: אצל निकटता अथवा साथ उपस्थित होने का भाव देता है; ‘उसके पास’ स्थानिक और संबंधपरक दोनों अर्थों को बिना अधिक व्याख्या के रखता है।
- source_word: אָמֹון
  choice: एक कुशल कारीगर के समान
  rationale: यह शब्द अत्यंत विवादित है। सृष्टि के प्रसंग में ‘कुशल कारीगर’ एक प्राचीन और संभव अर्थ है, पर अन्य अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שַׁעֲשֻׁעִים
  choice: उसका आनंद
  rationale: बहुवचन संज्ञा यहाँ आनंद अथवा आनंद की वस्तु का प्रबल भाव देती है; हिंदी में ‘मैं ... उसका आनंद थी’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: יוֹם יוֹם
  choice: दिन-प्रतिदिन
  rationale: शब्द की पुनरावृत्ति निरंतर नियमितता व्यक्त करती है; ‘दिन-प्रतिदिन’ उसका काव्यात्मक और सहज हिंदी रूप है।
- source_word: מְשַׂחֶקֶת
  choice: आनंद मनाती
  rationale: שׂחק खेलने, हँसने अथवा उल्लास करने का अर्थ दे सकता है। ‘आनंद मनाती’ गरिमापूर्ण काव्यात्मक संदर्भ में उल्लास व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह पदबंध किसी की उपस्थिति में होने का संकेत देता है; ‘उसके सामने’ सीधा और पारदर्शी अनुवाद है।
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह पदबंध सर्वकालिक निरंतरता व्यक्त करता है; ‘हर समय’ आधुनिक हिंदी में स्पष्ट और संक्षिप्त है।
theological_decisions:
- issue: सृष्टि में बुद्धि की भूमिका से संबंधित אָמוֹן का अर्थ
  choice: मुख्य पाठ में ‘एक कुशल कारीगर के समान’
  alternative: ‘एक छोटे बच्चे के समान’ अथवा ‘विश्वासयोग्य जन के रूप में’
  rationale: निकटवर्ती सृष्टि-प्रसंग कारीगर वाले अर्थ को संभव बनाता है, पर इब्रानी शब्द की वास्तविक अस्पष्टता के कारण उससे कोई निश्चित मसीह-संबंधी या तत्त्वमीमांसक निष्कर्ष आरोपित नहीं किया गया; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक शैली रखी गई है। ‘बुद्धि’ स्त्रीलिंग होने के कारण क्रियारूप स्त्रीलिंग हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
