source:
  edition: WLC
  text: כִּ֣י מֹ֭צְאִ/י מצאי חַיִּ֑ים וַ/יָּ֥פֶק רָ֝צ֗וֹן מֵ/יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/035.yaml
  text: For whoever finds me finds life and obtains favor from Yahweh.
translation:
  language: hi
  text: क्योंकि जो मुझे पाता है, वह जीवन पाता है और यहोवा की कृपा प्राप्त करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या आधार बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מֹצְאִי
  choice: जो मुझे पाता है
  rationale: इसका शाब्दिक भाव ‘मुझे पानेवाला’ है। यहाँ प्रथम पुरुष प्रत्यय मानवीकृत बुद्धि की ओर संकेत करता है, और ‘जो’ सामान्य तथा समावेशी अर्थ बनाए रखता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: यद्यपि इब्रानी रूप व्याकरणतः बहुवचन है, यह प्रायः एकवचन अर्थ ‘जीवन’ में प्रयुक्त होता है।
- source_word: וַיָּפֶק
  choice: प्राप्त करता है
  rationale: क्रिया का अर्थ निकालना, पाना या प्राप्त करना हो सकता है; इस प्रसंग में यहोवा से मिलने वाली कृपा के लिए ‘प्राप्त करता है’ स्वाभाविक है और मानवीय प्रयत्न पर अनावश्यक बल नहीं देता।
- source_word: רָצוֹן
  choice: कृपा
  rationale: यहाँ शब्द परमेश्वर की प्रसन्नता, अनुग्रह या सद्भाव को दर्शाता है; ‘कृपा’ आधुनिक हिन्दी में संक्षिप्त और संबंधपरक अर्थ वाला उपयुक्त विकल्प है।
- source_word: מֵיְהוָה
  choice: यहोवा की
  rationale: מִן स्रोत को सूचित करता है—कृपा यहोवा से मिलती है। हिन्दी की स्वाभाविक रचना में ‘यहोवा की कृपा प्राप्त करता है’ यही स्रोत-संबंध व्यक्त करती है।
theological_decisions:
- issue: मानवीकृत बुद्धि के संदर्भ में सामान्य एकवचन का अनुवाद
  choice: जो मुझे पाता है
  alternative: वह पुरुष जो मुझे पाता है; मुझे पानेवाला
  rationale: इब्रानी एकवचन सामान्य अर्थ रखता है और केवल पुरुषों तक सीमित नहीं है। ‘जो’ सार्वभौमिक आशय को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में परिचित नामरूप है और सामान्य उपाधि में बदलने के बजाय नाम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानांतर वाक्य-विन्यास—‘मुझे पाता है / जीवन पाता है’—मूल की शब्द-क्रीड़ा और काव्यात्मक बल को हिन्दी में यथासंभव सुरक्षित रखता है।
