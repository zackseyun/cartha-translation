base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/006.yaml
  text: Listen[a], for I will speak noble things[b], and the opening of my lips will be upright things.
translation:
  language: hi
  text: सुनो, क्योंकि मैं उत्तम बातें[a] कहूँगी, और मेरे होंठों से सीधी और खरी बातें[b] निकलेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘श्रेष्ठ बातें’। इब्रानी शब्द राजसी या कुलीन गरिमा से जुड़ा है और यहाँ उच्च मूल्य की वाणी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो सही है’। इब्रानी शब्द नैतिक अर्थ में सीधाई, खराई या सत्यनिष्ठा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ आधुनिक हिन्दी में स्वाभाविक है और ध्यान देकर सुनने के आह्वान को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: 'यह सुनने की आज्ञा का कारण बताता है: श्रोता सुनें, क्योंकि बुद्धि बोलने वाली है।'
- source_word: נְגִידִים
  choice: उत्तम बातें
  rationale: यहाँ शब्द राजसी या कुलीन गरिमा से जुड़ी उच्च कोटि की बातों को दर्शाता है। ‘उत्तम बातें’ सामान्य हिन्दी में स्पष्ट और प्रसंगानुकूल है, जबकि ‘श्रेष्ठ बातें’ भी सम्भव है।
- source_word: אֲדַבֵּר
  choice: मैं ... कहूँगी
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया यहाँ निकट भविष्य के कथन को व्यक्त करती है। प्रसंग में वक्ता ‘बुद्धि’ स्त्रीलिंग है, इसलिए हिन्दी में ‘कहूँगी’ स्वाभाविक है।
- source_word: וּמִפְתַּח שְׂפָתַי
  choice: मेरे होंठ खुलेंगे तो ... निकलेंगी
  rationale: मूल के ‘मेरे होंठों का खुलना’ बिंब को स्वाभाविक हिन्दी वाक्य-रचना में सुरक्षित रखा गया है।
- source_word: מֵישָׁרִים
  choice: सीधी बातें
  rationale: शब्द सीधाई और नैतिक खराई को सूचित करता है। ‘सीधी बातें’ मूल बिंब और बहुवचन को बनाए रखती हैं; ‘सही बातें’ अधिक व्याख्यात्मक विकल्प है।
