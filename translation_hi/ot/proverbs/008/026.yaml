  yaml_path: translation/ot/proverbs/008/026.yaml
  text: before he had made the earth and the fields[b][a], or the first of the dust of the world.
translation:
  language: hi
  text: इससे पहले कि उसने पृथ्वी, खुले प्रदेश[a] और जगत की धूल का पहला अंश[b] बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुले स्थान’। दूसरे प्रसंगों में חוּצוֹת का अर्थ ‘सड़कें’ भी हो सकता है, लेकिन यहाँ सृष्टि का संदर्भ किसी खुले बाहरी भूभाग का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जगत की मिट्टी का आरम्भ’। इब्रानी पदबंध संक्षिप्त और कुछ असामान्य है; संभवतः इसका आशय जगत की सबसे आरम्भिक मिट्टी या धूल से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד לֹא
  choice: इससे पहले कि ... बनाया था
  rationale: यह पदबंध यहाँ समय में पूर्वता दर्शाता है। हिंदी में ‘इससे पहले कि’ और पूर्ण भूतकाल इस अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: עָשָׂה
  choice: बनाया था
  rationale: सामान्य क्रिया ‘बनाना/करना’ है; सृष्टि के प्रसंग में ‘बनाया था’ सबसे सहज है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: תֵּבֵל (‘जगत’) के समानांतर सृष्टि-प्रसंग में स्थानीय ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: חוּצוֹת
  choice: खुले प्रदेश
  rationale: शहरी संदर्भ में इसका अर्थ ‘सड़कें’ हो सकता है, पर यहाँ सृष्टि-प्रसंग में खुले बाहरी भूभाग अभिप्रेत हैं। ‘खुले प्रदेश’ अर्थ को अनावश्यक कृषि-संकेत के बिना व्यक्त करता है।
- source_word: רֹאשׁ
  choice: आरम्भिक अंश
  rationale: עָפְרוֹת के साथ यह संक्षिप्त और असामान्य पदबंध आरम्भ या सबसे पहले अस्तित्व में आए भाग का संकेत देता है। ‘आरम्भिक अंश’ मूल की अर्थगत अस्पष्टता को बनाए रखता है।
- source_word: עָפְרוֹת
  choice: मिट्टी
  rationale: עפר सूखी मिट्टी या धूल को दर्शाता है; बहुवचन यहाँ सामूहिक जान पड़ता है। पृथ्वी-निर्माण के प्रसंग में हिंदी ‘मिट्टी’ स्वाभाविक है।
- source_word: תֵּבֵל
  choice: जगत
  rationale: यह व्यवस्थित या बसा हुआ संसार दर्शाता है। ‘जगत’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है।
theological_decisions:
- issue: तीसरे पुरुष एकवचन कर्ता का संकेत
  choice: उसने
  alternative: परमेश्वर ने
  rationale: मूल पद में कर्ता पूर्ववर्ती संदर्भ से समझा जाता है। ‘उसने’ मूल की संदर्भ-निर्भरता बनाए रखता है और नाम को स्पष्ट रूप से जोड़कर अर्थ का विस्तार नहीं करता।
- issue: וְ को सूचीय संयोजक मानना
  choice: और
  alternative: या
  rationale: मसोरेटिक पाठ में सामान्य संयोजक וְ है और कोई प्रत्यक्ष पाठगत संकेत ‘या’ की माँग नहीं करता। इसलिए ‘और’ मूल-पाठ के अधिक निकट है, यद्यपि पूरा पदबंध संक्षिप्त और कुछ असामान्य बना रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है। ‘खुले प्रदेश’ सामान्य पाठक के लिए स्पष्ट है और ‘खेत’ की अपेक्षा मूल के व्यापक अर्थ को सुरक्षित रखता है। वाक्य पूर्ववर्ती काव्य-संदर्भ से जुड़ा हुआ अंश है, इसलिए ‘इससे पहले कि’ संरचना जानबूझकर रखी गई है।
