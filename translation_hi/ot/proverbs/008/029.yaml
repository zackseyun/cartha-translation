id: PRO.8.29
reference: Proverbs 8:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/שׂ֘וּמ֤/וֹ לַ/יָּ֨ם חֻקּ֗/וֹ וּ֭/מַיִם לֹ֣א יַֽעַבְרוּ פִ֑י/ו בְּ֝/חוּק֗/וֹ מ֣וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/029.yaml
  text: when he set a boundary for the sea[a], so that the waters would not transgress his command, when he marked out the foundations of the earth[b],
translation:
  language: hi
  text: जब उसने समुद्र के लिए एक सीमा ठहराई[a], ताकि जल उसकी आज्ञा[b] का उल्लंघन न करे, जब उसने पृथ्वी की नींवों का निर्धारण किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सीमा’ अथवा ‘उसका ठहराया नियम’; इब्रानी शब्द किसी निश्चित विधान या निर्धारित सीमा को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसका मुँह’; अर्थात वह आज्ञा जो उसके मुँह से निकलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׂוּמוֹ
  choice: जब उसने ... ठहराई
  rationale: ב के साथ infinitive construct यहाँ समयसूचक है। ‘जब उसने ... ठहराई’ सृष्टि-वर्णन में स्वाभाविक और सटीक है।
- source_word: לַיָּם חֻקּוֹ
  choice: समुद्र के लिए एक सीमा
  rationale: חֹק/חֻק का अर्थ विधान, ठहराया हुआ नियम या निश्चित सीमा हो सकता है। समुद्र के प्रसंग में ‘सीमा’ ठोस सृष्टि-बिंब को स्पष्ट रखता है; ‘एक’ कहने से प्रत्यय का ‘उसकी/उसके द्वारा ठहराई’ संबंध अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וּמַיִם לֹא יַעַבְרוּ
  choice: ताकि जल ... उल्लंघन न करे
  rationale: वाव के बाद निषेधात्मक क्रिया को यहाँ परिणाम/उद्देश्य के रूप में सहज हिन्दी में व्यक्त किया गया है। עבר में सीमा पार करने और आदेश का अतिक्रमण करने—दोनों की छाया है।
- source_word: פִּיו
  choice: उसकी आज्ञा
  rationale: शाब्दिक अर्थ ‘उसका मुँह’ है, पर यहाँ यह मुँह से निकले आदेश का लक्षणार्थक प्रयोग है। ‘उसकी आज्ञा’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּחוּקוֹ
  choice: जब उसने ... निर्धारण किया
  rationale: חקק में उकेरने, निर्धारित करने या सीमा अंकित करने का भाव है। ‘नींवों का निर्धारण किया’ सृष्टि की सुव्यवस्था के बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מוֹסְדֵי אָרֶץ
  choice: पृथ्वी की नींवों
  rationale: यह construct phrase पृथ्वी की बहुवचन ‘नींवों’ का ब्रह्मांड-विषयक काव्यात्मक बिंब प्रस्तुत करता है, जिसे अनुवाद में बनाए रखा गया है।
theological_decisions:
- issue: बुद्धि के भाषण में सृष्टि का चित्रण
  choice: पद को परमेश्वर द्वारा सृष्टि की सीमाएँ और नींवें निर्धारित करने के ठोस काव्यात्मक वर्णन के रूप में रखा गया है।
  alternative: इसे केवल अमूर्त व्यवस्था का रूपक बनाना, या मुख्य पाठ में बाद की मसीह-विषयक व्याख्या जोड़ना।
  rationale: इब्रानी पाठ यहाँ सृष्टि की व्यवस्था का मूर्त काव्यात्मक चित्र देता है। अनुवाद उसी तनाव और चित्रात्मकता को सुरक्षित रखता है तथा बाद के धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज काव्यात्मक गद्य रखा गया है। पद की आश्रित वाक्य-रचना और अंतिम अल्पविराम संदर्भ में अगले पद से उसके संबंध को बनाए रखते हैं।
