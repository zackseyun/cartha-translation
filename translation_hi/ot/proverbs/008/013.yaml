id: PRO.8.13
reference: Proverbs 8:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִֽרְאַ֣ת יְהוָה֮ שְֽׂנֹ֫את רָ֥ע גֵּ֘אָ֤ה וְ/גָא֨וֹן וְ/דֶ֣רֶךְ רָ֭ע וּ/פִ֨י תַהְפֻּכ֬וֹת שָׂנֵֽאתִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/013.yaml
  text: The fear of Yahweh is to hate evil[a]; pride and arrogance and the way of evil and a mouth of perversions I hate.
translation:
  language: hi
  text: याहवे का भय मानना बुराई से घृणा करना है; घमंड, अहंकार, बुराई की राह और कुटिल बातें बोलने वाले मुँह[a] से मैं घृणा करती हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टेढ़ा मुँह” या “विकृत बातों का मुँह।”
    reason: इब्रानी פִי תַהְפֻּכוֹת का शाब्दिक/वैकल्पिक अनुवाद; यह कुटिल या विकृत वाणी के अर्थ को सुरक्षित रखता है।
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय मानना
  rationale: रचना याहवे के प्रति श्रद्धामिश्रित भय को व्यक्त करती है। परमेश्वर के व्यक्तिगत नाम को स्रोत के अनुरूप ‘याहवे’ रखा गया है।
- source_word: שְׂנֹאת רָע
  choice: बुराई से घृणा करना है
  rationale: इनफिनिटिव रचना को क्रियात्मक रूप में रखा गया है और רָע को नैतिक बुराई के अर्थ में लिया गया है।
- source_word: גֵּאָה וְגָאוֹן
  choice: घमंड, अहंकार
  rationale: दो निकटार्थी शब्दों का भेद बनाए रखने के लिए दो स्वाभाविक हिंदी संज्ञाएँ चुनी गई हैं; दोनों आत्म-उन्नयन और दर्प का नकारात्मक भाव देती हैं।
- source_word: דֶרֶךְ רָע
  choice: बुराई की राह
  rationale: व्यवहार या जीवन-पद्धति के लिए प्रयुक्त ‘राह’ के रूपक को सुरक्षित रखा गया है।
- source_word: פִי תַהְפֻּכוֹת
  choice: टेढ़ी बातें बोलनेवाले मुँह
  rationale: शाब्दिक ‘टेढ़ी/विकृत बातों का मुँह’ को सहज हिंदी में व्यक्त किया गया है, जबकि वाणी की कुटिलता और ‘मुँह’ का बिंब दोनों बने रहते हैं।
- source_word: שָׂנֵאתִי
  choice: मैं घृणा करती हूँ
  rationale: पूर्ण क्रिया को इस नीतिवचन में सामान्य वर्तमान के रूप में लिया गया है। संदर्भ में बोलनेवाली ‘बुद्धि’ स्त्रीलिंग है, इसलिए हिंदी व्याकरण के अनुसार स्त्रीलिंग क्रिया रखी गई है।
theological_decisions:
- issue: बुद्धि-विमर्श में प्रथम पुरुष वक्ता की पहचान
  choice: पद में केवल प्रथम पुरुष ‘मैं’ रखा गया है; स्त्रीलिंग क्रिया संदर्भगत ‘बुद्धि’ के हिंदी व्याकरण से आती है।
  alternative: ‘मैं, बुद्धि’ जोड़ना या ‘मैं’ को स्पष्ट रूप से परमेश्वर की वाणी बताना।
  rationale: इब्रानी पद स्वयं वक्ता का नाम दोबारा नहीं जोड़ता। इसलिए व्यक्ति रूप में बोलती बुद्धि और उसके धर्मवैचारिक आशय के बीच तनाव को किसी अतिरिक्त पहचान से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सूची की काव्यात्मक समानांतरता और ‘राह’ तथा ‘मुँह’ के इब्रानी बिंब सुरक्षित रखे गए हैं।
