source:
  edition: WLC
  text: הֲ/לֹֽא חָכְמָ֥ה תִקְרָ֑א וּ֝/תְבוּנָ֗ה תִּתֵּ֥ן קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/001.yaml
  text: Does not wisdom call[b][a], and understanding raise her voice?
translation:
  language: hi
  text: क्या बुद्धि पुकारती नहीं,[a] और समझ अपनी आवाज़ ऊँची नहीं करती?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुलाती नहीं।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक: “अपनी आवाज़ देती है”; यह इब्रानी मुहावरा खुलकर बोलने या आवाज़ ऊँची करने के अर्थ में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं रही
  rationale: यह रचना एक आलंकारिक प्रश्न प्रस्तुत करती है, जिसका अपेक्षित उत्तर हाँ है; हिन्दी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में इस सामान्य संज्ञा का मानक और सहज हिन्दी पर्याय है; स्त्रीलिंग क्रिया से साहित्यिक मानवीकरण भी बना रहता है।
- source_word: תִקְרָא
  choice: पुकार रही
  rationale: קרא के अर्थ ‘बुलाना/पुकारना’ में से ‘पुकारना’ सार्वजनिक और सुनाई देने वाले आह्वान को स्वाभाविक ढंग से व्यक्त करता है, बिना अनावश्यक रूप से चिल्लाने का भाव जोड़ने के।
- source_word: וּתְבוּנָה
  choice: और समझ
  rationale: תבונה विवेकपूर्ण समझ या सूझ को दर्शाता है; ‘समझ’ आधुनिक साधारण हिन्दी में सीधा और ‘बुद्धि’ के समानांतर उपयुक्त है।
- source_word: תִּתֵּן קוֹלָהּ
  choice: अपनी आवाज़ ऊँची कर रही
  rationale: शाब्दिक रूप से ‘अपनी आवाज़ देती है’; हिन्दी मुहावरे में ‘आवाज़ ऊँची करना’ बोलकर ध्यान आकर्षित करने के आशय और मानवीकरण को सुरक्षित रखता है।
theological_decisions:
- issue: बुद्धि और समझ का स्त्रीरूप मानवीकरण
  choice: ‘बुद्धि’ और ‘समझ’ को भाववाचक संज्ञाओं के रूप में रखते हुए स्त्रीलिंग क्रियाओं और ‘अपनी आवाज़’ से मानवीकरण बनाए रखा गया।
  alternative: मानवीकरण को कम करके तटस्थ ढंग से कहना, या ‘बुद्धि’ को विशिष्ट दैवी उपाधि के रूप में चिह्नित करना।
  rationale: इब्रानी व्याकरण और अध्याय का काव्यात्मक संदर्भ बुद्धि को बोलती हुई स्त्री के रूप में चित्रित करते हैं; अनुवाद इस चित्र को रखता है, पर पद से परे कोई विशिष्ट धर्मवैज्ञानिक पहचान आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल। वर्तमान प्रगतिशील रूप सार्वजनिक पुकार के जीवंत दृश्य को स्वाभाविक हिन्दी में प्रस्तुत करता है।
