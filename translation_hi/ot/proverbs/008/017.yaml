  yaml_path: translation/ot/proverbs/008/017.yaml
  text: I love those who love me[a], and those who seek me diligently find me.
translation:
  language: hi
  text: जो मुझसे प्रेम करते हैं, मैं उनसे प्रेम करती हूँ; और जो मुझे लगन से खोजते हैं,[a] वे मुझे पा लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो मुझे भोर में खोजते हैं।’ इब्रानी क्रिया का अर्थ सुबह जल्दी खोजना हो सकता है और विस्तार से लगन या तत्परता से खोजना भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: मैं
  rationale: प्रथम पुरुष एकवचन सर्वनाम को स्पष्ट रखा गया है; हिन्दी वाक्य-क्रम में इसे क्रिया से पहले रखकर स्वाभाविक बल मिलता है।
- source_word: אֹהֲבַי / אהבי/ה
  choice: जो मुझसे प्रेम रखते हैं
  rationale: אהב के कृदन्त और प्रथम पुरुष एकवचन प्रत्यय का अर्थ ‘मुझसे प्रेम करने वाले’ है। वर्तमान हिन्दी में सापेक्ष उपवाक्य सहज और गरिमापूर्ण है।
- source_word: אֵהָב
  choice: मैं प्रेम रखती हूँ
  rationale: अपूर्ण रूप यहाँ नीतिवचन की सामान्य, निरंतर सच्चाई व्यक्त करता है। बोलने वाली मानवीकृत बुद्धि स्त्रीलिंग है, इसलिए ‘रखती हूँ’ प्रयुक्त हुआ है।
- source_word: מְשַׁחֲרַי
  choice: जो मुझे लगन से खोजते हैं
  rationale: שׁחר का पिएल कृदन्त ‘भोर में/जल्दी खोजना’ और उससे विकसित ‘मन लगाकर, तत्परता से खोजना’ अर्थ दे सकता है। मुख्य पाठ में ‘लगन से’ प्रसंगगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक कालगत अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יִמְצָאֻנְנִי
  choice: वे मुझे पा लेते हैं
  rationale: अपूर्ण रूप को नीतिवचन की सामान्य सच्चाई के रूप में लिया गया है। ‘पा लेते हैं’ खोज के सफल परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल भविष्यकाल तक सीमित किए।
theological_decisions:
- issue: बुद्धि के प्रेम की पारस्परिक भाषा
  choice: पद को मानवीकृत बुद्धि और उससे प्रेम करने तथा उसे खोजने वालों के बीच सामान्य पारस्परिक सिद्धान्त के रूप में रखा गया है।
  alternative: इसे मुख्य पाठ में उद्धार-संबंधी चुनाव, वाचागत पक्षपात, अथवा प्रत्यक्ष मसीही कथन के रूप में स्पष्ट करना।
  rationale: नीतिवचन 8 में बुद्धि काव्यात्मक रूप से मानवीकृत होकर बोलती है। इब्रानी पाठ से परे कोई बाद की धर्मवैज्ञानिक पहचान या उद्धार-सिद्धान्त जोड़ना उचित नहीं; पाठ की साहित्यिक और धर्मवैज्ञानिक तनावपूर्ण खुलावट बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘प्रेम रखना’ ने पारस्परिक אהב को स्वाभाविक ढंग से व्यक्त किया है। स्त्रीलिंग ‘रखती हूँ’ अध्याय में मानवीकृत ‘बुद्धि’ की वक्ता-भूमिका के अनुरूप है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
