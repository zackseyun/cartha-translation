id: PRO.8.15
reference: Proverbs 8:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ֭/י מְלָכִ֣ים יִמְלֹ֑כוּ וְ֝/רוֹזְנִ֗ים יְחֹ֣קְקוּ צֶֽדֶק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/015.yaml
  text: By me kings reign[b][a], and rulers decree justice.
translation:
  language: hi
  text: मेरे द्वारा राजा राज्य करते हैं[a], और उच्च अधिकारी[b] न्याय का विधान करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे माध्यम से राजा राज्य करते हैं।”
    reason: בִּי में साधन या माध्यम का भाव “मेरे माध्यम से” भी व्यक्त किया जा सकता है।
  - marker: b
    text: या, “शासक”; अथवा “राजकुमार।”
    reason: רֹזְנִים उच्च पद वाले शासकों, गण्यमान्य व्यक्तियों या राजकुमारों के लिए प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: בִּי
  choice: मेरे द्वारा
  rationale: यहाँ בְּ उपसर्ग बुद्धि को शासन का माध्यम या साधन बताता है। “मेरे द्वारा” संक्षिप्त है और कर्तृत्व/साधन—दोनों की निकटता बनाए रखता है।
- source_word: מְלָכִים
  choice: राजा
  rationale: राजकीय शासकों के लिए सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: יִמְלֹכוּ
  choice: राज्य करते हैं
  rationale: מלך के राजकीय शासन करने के अर्थ को बनाए रखता है और “राजा” के साथ स्वाभाविक बैठता है।
- source_word: וְרוֹזְנִים
  choice: और उच्च अधिकारी
  rationale: רֹזְנִים प्रतिष्ठित शासकीय पदाधिकारियों या गण्यमान्य शासकों को दर्शाता है। “उच्च अधिकारी” आधुनिक पाठक के लिए स्पष्ट है और किसी एक विशिष्ट राजकीय पद तक अर्थ को सीमित नहीं करता।
- source_word: יְחֹקְקוּ
  choice: विधान करते हैं
  rationale: חקק यहाँ अधिकारपूर्वक नियम या व्यवस्था निर्धारित करने के अर्थ में है। “विधान करते हैं” कानूनी-शासकीय संदर्भ को व्यक्त करता है, पर आधुनिक विधायिका की तकनीकी प्रक्रिया को अनावश्यक रूप से नहीं जोड़ता।
- source_word: צֶדֶק
  choice: न्याय
  rationale: नागरिक और शासकीय संदर्भ में צֶדֶק का न्याय/सही व्यवस्था वाला भाव प्रमुख है। “न्याय” संक्षिप्त और स्वाभाविक है तथा धार्मिक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: क्या यह पद प्रत्येक वास्तविक शासक के शासन को स्वतः नैतिक रूप से वैध ठहराता है
  choice: पद बुद्धि को उचित राजकीय शासन और न्यायपूर्ण विधान का अनिवार्य माध्यम बताता है, पर यह नहीं कहता कि हर शासक सदा न्याय से शासन करता है।
  alternative: इसे इस दावे के रूप में पढ़ना कि यहाँ हर राजनीतिक सत्ता को बिना शर्त दैवी वैधता दी गई है।
  rationale: संदर्भ में व्यक्तिरूप बुद्धि सही शासन में अपनी भूमिका बताती है। अनुवाद सकारात्मक आदर्श को बनाए रखता है और सभी वास्तविक शासकों के आचरण के विषय में पाठ से अधिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “न्याय का विधान करते हैं” स्रोत की संक्षिप्त कानूनी-शासकीय अभिव्यक्ति को हिन्दी में स्वाभाविक रूप देता है।
