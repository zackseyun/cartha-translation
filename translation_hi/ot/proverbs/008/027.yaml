base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/027.yaml
  text: When he established the heavens[a], I was there, when he inscribed a circle on the face of the deep.
translation:
  language: hi
  text: जब उसने आकाश की स्थापना की, तब मैं वहाँ थी; जब उसने अथाह जलराशि की सतह पर एक वृत्त खींचा, तब भी मैं वहाँ थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने अथाह जलराशि की सतह पर एक वृत्त अंकित किया।” हिब्रू में ‘वृत्त’ से क्षितिज अथवा जल के ऊपर खींची गई गोल सीमा का बिंब भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֲכִינוֹ
  choice: जब उसने ... स्थिर किया
  rationale: בְּ + infinitive construct यहाँ कालवाचक है। 'स्थिर किया' सृष्टि-संदर्भ में स्थापित करने और दृढ़ करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू का बहुवचन सृष्टि-संदर्भ में व्यापक आकाशीय विस्तार को सूचित करता है; आधुनिक हिन्दी में 'आकाश' इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: שָׁם אָ֑נִי
  choice: तब मैं वहाँ थी
  rationale: שָׁם मूलतः स्थानवाचक 'वहाँ' है; हिन्दी वाक्य में कालगत प्रवाह स्पष्ट करने के लिए 'तब' जोड़ा गया है, जबकि 'वहाँ' से बुद्धि की सृष्टि के समय उपस्थिति बनी रहती है। वक्ता स्त्रीलिंग में व्यक्त 'बुद्धि' है, इसलिए 'थी'।
- source_word: בְּח֥וּק֝וֹ
  choice: जब उसने ... खींचा
  rationale: यहाँ חקק का ठोस चित्र किसी सीमा या आकृति को अंकित करने का है। 'खींचा' हिन्दी में वृत्त बनाने की दृश्यात्मक क्रिया को स्पष्ट रखता है।
- source_word: חוּג
  choice: एक वृत्त
  rationale: शब्द का सीधा अर्थ वृत्त या परिधि है। 'क्षितिज' संभावित अर्थान्विति है, पर मुख्य पाठ में ज्यामितीय काव्य-चित्र सुरक्षित रखा गया है।
- source_word: עַל־פְּנֵי
  choice: के मुख पर
  rationale: शाब्दिक 'मुख पर' मूल की काव्यात्मक बनावट को बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: תְהוֹם
  choice: अथाह जलराशि
  rationale: यह आदिम गहरे जल को दर्शाता है। 'अथाह जलराशि' अर्थ को स्पष्ट करता है और 'अधोलोक' जैसे बाद के धार्मिक संकेतों से बचता है।
theological_decisions:
- issue: बुद्धि के भाषण में सृष्टि-संबंधी काव्य-चित्र
  choice: बुद्धि को सृष्टि के समय उपस्थित स्त्रीलिंग वक्ता के रूप में रखते हुए वृत्त और अथाह जलराशि का काव्यात्मक चित्र सुरक्षित रखा गया।
  alternative: इसे किसी निश्चित प्राचीन ब्रह्मांड-मॉडल के 'क्षितिज' या 'गुंबद' के रूप में स्पष्ट करना, अथवा बाद की मसीही व्याख्या को मुख्य पाठ में सामने लाना।
  rationale: हिब्रू पद सजीव की गई बुद्धि की उपस्थिति बताता है, पर किसी विशिष्ट ब्रह्मांड-विज्ञान या बाद की धर्मवैज्ञानिक पहचान का निर्णायक प्रतिपादन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य। 'आकाश', 'वृत्त' और 'अथाह जलराशि' सामान्य पाठक के लिए बोधगम्य हैं; स्त्रीलिंग 'थी' संदर्भ में व्यक्तित्व दी गई 'बुद्धि' के अनुरूप है।
