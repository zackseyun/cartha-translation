  text: when he made the skies firm above[a], when the springs of the deep grew strong[b],
translation:
  language: hi
  text: 'जब उसने ऊपर के आकाश को दृढ़ किया[a],

    जब गहरे जल के सोते प्रबल हुए[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आकाश’ का अनुवाद ‘बादल’ या ‘स्वर्ग’ भी किया जा सकता है; सृष्टि के इस प्रसंग में שְׁחָקִים का अर्थ कितना व्यापक माना जाए, इस पर अनुवाद निर्भर है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जब उसने गहरे जल के सोतों को प्रबल किया।’ इब्रानी को या तो सोतों के स्वयं प्रबल होने के अर्थ में, या परमेश्वर द्वारा उन्हें प्रबल किए जाने के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַמְּצוֹ
  choice: जब उसने ... दृढ़ किया
  rationale: בְּ के साथ क्रिया का infinitive construct यहाँ समयसूचक उपवाक्य बनाता है। אמץ का मूल भाव मजबूत या दृढ़ करना है; हिंदी में यह रचना-प्रसंग के अनुरूप और स्वाभाविक है।
- source_word: שְׁחָקִים
  choice: आकाश
  rationale: शब्द आकाश, ऊपरी नभमंडल या बादलों के क्षेत्र को सूचित कर सकता है। सृष्टि-प्रसंग और מִמָּעַל के साथ ‘आकाश’ व्यापकता बनाए रखता है।
- source_word: מִמָּעַל
  choice: ऊपर
  rationale: यह स्थानसूचक शब्द सीधे तौर पर ऊपरी दिशा या क्षेत्र बताता है; ‘ऊपर’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: בַּעֲזֹז
  choice: जब ... प्रबल हुए
  rationale: यह समानांतर समयसूचक उपवाक्य में עזז से बना रूप है। ‘प्रबल हुए’ सोतों को व्याकरणिक कर्ता मानते हुए उनके सामर्थ्यवान होने का भाव देता है, पर वैकल्पिक कारक अर्थ को टिप्पणी में सुरक्षित रखा गया है।
- source_word: עִינוֹת
  choice: सोते
  rationale: עינות जल के प्राकृतिक स्रोतों या फूटते झरनों को दर्शाता है। ‘सोते’ आधुनिक हिंदी में भूमिगत अथवा गहरे जल के स्रोतों के लिए सटीक है।
- source_word: תְּהוֹם
  choice: गहरा जल
  rationale: תְּהוֹם आद्य अथाह जलराशि या गहराई को दर्शाता है। ‘गहरा जल’ सामान्य पाठक के लिए स्पष्ट रहते हुए जलीय सृष्टि-बिंब को बनाए रखता है।
theological_decisions:
- issue: בַּעֲזֹז में कर्ता और कारकता
  choice: सोते स्वयं ‘प्रबल हुए’
  alternative: परमेश्वर ने गहरे जल के सोतों को प्रबल किया
  rationale: मसोरेटिक पाठ में עִינוֹת תְּהוֹם को בַּעֲזֹז का कर्ता समझना सीधा है, किंतु समानांतर पहले उपवाक्य के कारण परमेश्वर को निहित कर्ता मानकर सकर्मक भाव लेना भी संभव है। मुख्य पाठ प्रथम विश्लेषण अपनाता है और टिप्पणी दूसरे को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक समानांतरता के अनुकूल रखी गई है। दोनों ‘जब’ उपवाक्य नीतिवचन 8 में सृष्टि-वर्णन की लय बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में टिप्पणियों के संकेत उलटे स्थानों पर थे; हिंदी में प्रत्येक संकेत संबंधित शब्द या उपवाक्य के साथ रखा गया है।
