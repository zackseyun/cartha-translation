source:
  edition: WLC
  text: עֹֽשֶׁר וְ/כָב֥וֹד אִתִּ֑/י ה֥וֹן עָ֝תֵ֗ק וּ/צְדָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/018.yaml
  text: Riches and honor are with me[b][a], enduring wealth and righteousness.
translation:
  language: hi
  text: 'धन-दौलत और सम्मान मेरे साथ हैं,

    स्थायी संपत्ति[a] और धार्मिकता[b] भी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टिकाऊ धन-संपत्ति”; विशेषण ऐसी संपत्ति का भी संकेत दे सकता है जो ठोस या लंबे समय तक बनी रहने वाली हो।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׁר
  choice: धन-दौलत
  rationale: यह शब्द भौतिक समृद्धि और प्रचुर धन को दर्शाता है। ‘धन-दौलत’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और बाद के הוֹן के लिए प्रयुक्त ‘संपत्ति’ से शब्दगत भेद बनाए रखता है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: नीतिवचन के इस संदर्भ में इसका आशय सामाजिक आदर या प्रतिष्ठा है; ‘सम्मान’ आधुनिक हिन्दी में स्पष्ट है और इसे ईश्वरीय ‘महिमा’ तक सीमित नहीं करता।
- source_word: אִתִּי
  choice: मेरे साथ हैं
  rationale: हिब्रू पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; बहुवचन ‘हैं’ संयुक्त विषय के अनुरूप है।
- source_word: הוֹן
  choice: संपत्ति
  rationale: यह धन-संपदा या possessions को दर्शाता है। ‘संपत्ति’ पहले पद के ‘धन-दौलत’ से भेद रखते हुए काव्यात्मक अर्थ-समानता बनाए रखता है।
- source_word: עָתֵק
  choice: स्थायी
  rationale: यहाँ विशेषण ऐसी संपत्ति का संकेत देता है जो टिकने वाली, ठोस या स्थायी हो। ‘स्थायी’ सामान्य पाठक के लिए स्पष्ट है; निकटवर्ती अर्थ-विकल्प पादटिप्पणी में रखा गया है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह शब्द नैतिक सहीपन तथा न्याय—दोनों का अर्थ दे सकता है। व्यापक नैतिक संदर्भ में ‘धार्मिकता’ उपयुक्त है, जबकि ‘न्याय’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: צְדָקָה का नैतिक अर्थ—‘धार्मिकता’ या ‘न्याय’
  choice: धार्मिकता
  alternative: न्याय
  rationale: पद किसी विशेष न्यायिक प्रसंग तक सीमित नहीं है, इसलिए मुख्य पाठ में व्यापक नैतिक अर्थ वाला ‘धार्मिकता’ रखा गया है। फिर भी हिब्रू शब्द में न्याय का वास्तविक अर्थ भी संभव है, अतः उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। दो समानांतर पंक्तियाँ हिब्रू काव्य की संरचना को उभारती हैं; दूसरी पंक्ति में ‘भी’ हिन्दी में निहित संबंध को स्वाभाविक बनाता है, बिना नया वैचारिक तत्व जोड़े।
