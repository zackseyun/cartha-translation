  text: הָבִ֣ינוּ פְתָאיִ֣ם עָרְמָ֑ה וּ֝/כְסִילִ֗ים הָבִ֥ינוּ לֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/005.yaml
  text: Learn prudence[a], you simple ones; and learn understanding, you fools.
translation:
  language: hi
  text: हे भोले लोगो, विवेक सीखो; और हे मूर्खो, समझ-बूझ सीखो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִינוּ
  choice: सीखो / हासिल करो
  rationale: बहुवचन आज्ञार्थक क्रिया का अर्थ ‘समझो, परखो’ या ‘समझ प्राप्त करो’ हो सकता है। हिंदी में दोनों समानांतर पदों के साथ स्वाभाविक अभिव्यक्ति के लिए ‘सीखो’ और ‘हासिल करो’ चुने गए हैं।
- source_word: פְתָאיִם
  choice: भोले लोगो
  rationale: नीतिवचन में यह शब्द अनुभवहीन, आसानी से बहकने वाले लोगों को दर्शाता है, न कि कम बौद्धिक क्षमता वाले लोगों को। ‘भोले’ इस संबोधन को सहज हिंदी में व्यक्त करता है।
- source_word: עָרְמָה
  choice: विवेक
  rationale: इस ज्ञान-साहित्यिक संदर्भ में शब्द प्रशंसनीय व्यावहारिक सूझ और सावधानी का बोध कराता है। ‘चतुराई’ हिंदी में छल-कपट का अनचाहा नकारात्मक अर्थ दे सकती है, इसलिए ‘विवेक’ चुना गया है।
- source_word: וּכְסִילִים
  choice: और हे मूर्खो
  rationale: यह नीतिवचन का प्रचलित नैतिक वर्ग है—ऐसे लोग जो बुद्धि की शिक्षा का विरोध करते हैं। संबोधन और समानांतरता बनाए रखने के लिए ‘हे मूर्खो’ रखा गया है।
- source_word: לֵב
  choice: समझ-बूझ
  rationale: मूल शब्द का शाब्दिक अर्थ ‘हृदय’ है, पर यहाँ वह विचार, निर्णय और परख की भीतरी क्षमता को दर्शाता है। ‘समझ-बूझ’ प्रसंगगत अर्थ को सामान्य आधुनिक हिंदी में स्पष्ट करता है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
