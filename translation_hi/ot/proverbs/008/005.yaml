  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। सीधे संबोधन तथा इब्रानी पद की समानांतर रचना बनाए रखी गई है; जहाँ शब्दशः अनुवाद अस्वाभाविक होता, वहाँ अर्थ-समान स्वाभाविक अभिव्यक्ति अपनाई गई है।
