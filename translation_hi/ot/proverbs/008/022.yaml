base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/022.yaml
  text: Yahweh possessed me at the beginning of his way[a], before his works of old.
translation:
  language: hi
  text: याहवे ने अपने मार्ग के आरम्भ में मुझे अपना रखा था[a], अपने प्राचीन कार्यों से पहले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने मुझे रचा था” अथवा “याहवे ने मुझे प्राप्त किया था।” इब्रानी क्रिया के एक से अधिक अर्थ हो सकते हैं। बुद्धि के व्यक्तिकरण और पुत्र के बीच सम्बन्ध को लेकर हुए ऐतिहासिक वाद-विवादों में यह पद प्रमुख रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: קָנָנִי
  choice: मुझे अपना बनाया था
  rationale: यह स्वाभाविक हिन्दी अभिव्यक्ति यहाँ ‘अधिकार में रखना/प्राप्त करना’ का भाव देती है, जबकि इब्रानी क्रिया की ‘रचना’ और ‘प्राप्त करना’ जैसी अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: רֵאשִׁית דַּרְכּוֹ
  choice: अपने मार्ग के आरम्भ में
  rationale: यह वाक्यांश याहवे के कार्य-क्रम के आरम्भ का समय बताता है और मूल के ‘मार्ग’ रूपक को बनाए रखता है।
- source_word: קֶדֶם מִפְעָלָיו מֵאָז
  choice: अपने प्राचीन कामों से पहले
  rationale: यह अनादिकालीन अथवा अत्यन्त प्राचीन कार्यों की अपेक्षा बुद्धि की पूर्वता को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कָנָנִי का अर्थ, विशेषकर इस पद के ऐतिहासिक मसीह-विषयक प्रयोग के संदर्भ में
  choice: मुझे अपना बनाया था
  alternative: मुझे रचा था; मुझे प्राप्त किया था
  rationale: नीतिवचन 8 में वक्ता व्यक्तिरूप में प्रस्तुत बुद्धि है; पद सीधे पुत्र का नाम नहीं लेता। मुख्य पाठ किसी बाद के धर्मवैज्ञानिक निष्कर्ष को निर्णायक बनाने के बजाय इब्रानी क्रिया की अधिकार/प्राप्ति-संबंधी सम्भावना को स्वाभाविक हिन्दी में रखता है, और ‘रचा’ सहित प्रमुख वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मार्ग’ का मूल रूपक रखा गया है। ‘मुझे अपना बनाया था’ जानबूझकर ऐसा चुना गया है कि मुख्य पाठ इब्रानी क्रिया की धर्मवैज्ञानिक रूप से विवादित सम्भावनाओं में से किसी एक को अनावश्यक रूप से अंतिम न ठहराए।
