  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/אַשְׁרֵ֗י דְּרָכַ֥/י יִשְׁמֹֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/032.yaml
  text: And now[a], sons, listen to me; blessed are those who keep my ways.
translation:
  language: hi
  text: और अब, हे पुत्रो,[a] मेरी सुनो; धन्य हैं वे जो मेरे मार्गों का पालन करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चो।” हिब्रू में “पुत्रो” है—यह ज्ञान-साहित्य की शिक्षा में प्रचलित पुल्लिंग बहुवचन संबोधन है, यद्यपि यह आग्रह व्यापक रूप से लागू होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण कथन में परिवर्तन तथा पिछले तर्क से निकलने वाली आग्रहपूर्ण पुकार को चिह्नित करते हैं। हिंदी में ‘इसलिए अब’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָנִים
  choice: हे पुत्रो
  rationale: मूल शब्द पुल्लिंग बहुवचन है और नीतिवचन की शिक्षा-परंपरा में शिष्यों के संबोधन के रूप में प्रयुक्त होता है। ‘हे पुत्रो’ प्रत्यक्ष संबोधन को स्पष्ट और गरिमापूर्ण रखता है; ‘मेरे’ मूल में नहीं है।
- source_word: שִׁמְעוּ לִי
  choice: मेरी सुनो
  rationale: שׁמע के साथ ל वक्ता की ओर ध्यान देकर सुनने का भाव देता है। ‘मेरी सुनो’ आधुनिक हिंदी में स्वाभाविक है और इसे केवल ‘आज्ञा मानो’ बनाकर अर्थ को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וְאַשְׁרֵי
  choice: धन्य हैं वे
  rationale: אַשְׁרֵי किसी अनुगृहीत और फलते-फूलते जीवन की धन्यता घोषित करता है। ‘धन्य हैं वे’ हिंदी के बाइबलीय मुहावरे और सामान्य बोध, दोनों के अनुकूल है।
- source_word: דְּרָכַי יִשְׁמֹרוּ
  choice: मेरे मार्गों पर चलते हैं
  rationale: शाब्दिक रूप से भाव ‘मेरे मार्गों को बनाए रखते/मानते हैं’ है। हिंदी में मार्ग के संबंध में ‘पर चलना’ जीवन-आचरण और व्यावहारिक पालन का अर्थ अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ज्ञान-साहित्य में लिंगसूचक संबोधन
  choice: पुत्रो
  alternative: बच्चो
  rationale: मुख्य पाठ में हिब्रू के पुल्लिंग बहुवचन और गुरु-शिष्य संबोधन को सुरक्षित रखा गया है। साथ ही पादटिप्पणी स्पष्ट करती है कि शिक्षा का प्रयोग केवल पुरुषों तक सीमित समझना आवश्यक नहीं है।
- issue: שׁמר के पालन-संबंधी भाव का हिंदी रूप
  choice: मेरे मार्गों पर चलते हैं
  alternative: मेरे मार्गों को मानते हैं / मेरे मार्गों की रक्षा करते हैं
  rationale: यहाँ प्रसंग ज्ञान के बताए जीवन-मार्ग के व्यावहारिक अनुसरण का है। ‘चलते हैं’ उस आचरणात्मक भाव को स्वाभाविक हिंदी में रखता है, जबकि ‘रक्षा करते हैं’ भ्रामक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक उपदेश के अनुकूल शैली। ‘हे पुत्रो’ स्रोत का प्रत्यक्ष संबोधन बनाए रखता है; ‘मेरी सुनो’ सहज आग्रह है; ‘धन्य’ बाइबलीय गंभीरता के साथ सामान्य पाठक के लिए बोधगम्य है।
