source:
  edition: WLC
  text: אֲלֵי/כֶ֣ם אִישִׁ֣ים אֶקְרָ֑א וְ֝/קוֹלִ֗/י אֶל בְּנֵ֥י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/004.yaml
  text: To you[a], O men, I call, and my voice is to the sons of mankind.
translation:
  language: hi
  text: हे पुरुषों, मैं तुम्हें पुकारती हूँ; मेरी आवाज़ मनुष्यों के लिए है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲלֵיכֶם
  choice: तुम्हें
  rationale: पूर्वसर्ग אֶל के साथ द्वितीय पुरुष बहुवचन प्रत्यय संबोधित लोगों को सीधे दर्शाता है; आधुनिक हिन्दी में ‘तुम्हें’ स्वाभाविक और स्पष्ट है।
- source_word: אִישִׁים
  choice: हे पुरुषो
  rationale: यह אִישׁ का बहुवचन है और यहाँ सीधे संबोधन में पुरुषों को सूचित करता है। ‘हे पुरुषो’ उसके पुंलिंग और संबोधन-बल दोनों को बनाए रखता है।
- source_word: אֶקְרָא
  choice: मैं ... पुकारती हूँ
  rationale: קרא का काल इस प्रसंग में पुकारने या संबोधित करने को व्यक्त करता है। हिन्दी में वक्ता ‘बुद्धि’ के स्त्रीलिंग व्यक्तित्व के अनुसार ‘पुकारती’ स्वाभाविक है।
- source_word: וְקוֹלִי
  choice: मेरी आवाज़
  rationale: संज्ञा קוֹל और प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरी आवाज़’ है; इससे इब्रानी समानांतरता बनी रहती है।
- source_word: אֶל
  choice: के लिए
  rationale: दूसरी पंक्ति में אֶל आवाज़ की दिशा और उसके लक्षित श्रोताओं को बताता है। ‘के लिए’ हिन्दी में स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: בְּנֵי אָדָם
  choice: मानव-सन्तानों
  rationale: शाब्दिक रूप से ‘आदम/मनुष्य के पुत्र’ यह प्रचलित इब्रानी पदबंध समस्त मनुष्यों को सूचित करता है। ‘मानव-सन्तान’ वंशगत बिंब और व्यापक मानवीय अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: इब्रानी काव्य-समानांतरता में लिंगसूचक मानव-संबोधन
  choice: पहले पदबंध אִישִׁים को ‘पुरुषो’ और दूसरे, व्यापक पदबंध בְּנֵי אָדָם को ‘मानव-सन्तानों’ के रूप में अलग रखा गया है।
  alternative: ‘हे लोगो ... सब मनुष्यों’ या ‘हे पुरुषो ... मनुष्यों’
  rationale: दोनों इब्रानी अभिव्यक्तियों को एक ही लिंग-निरपेक्ष शब्द में मिला देने से उनका भेद मिट जाता। पहला पद पुरुषों को स्पष्ट संबोधन है, जबकि दूसरा मानवजाति के लिए प्रचलित व्यापक अभिव्यक्ति है।
- issue: बुद्धि की वाणी का हिन्दी व्याकरणिक लिंग
  choice: ‘मैं ... पुकारती हूँ’
  alternative: ‘मैं ... पुकारता हूँ’ या लिंग से बचने के लिए ‘मेरी पुकार ... है’
  rationale: आस-पास के प्रसंग में बोलने वाली व्यक्तिकृत ‘बुद्धि’ है, जो हिन्दी में स्त्रीलिंग है। क्रिया का स्त्रीलिंग रूप प्रसंग को स्वाभाविक बनाता है, बिना वक्ता की पहचान से अधिक निष्कर्ष निकाले।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘हे पुरुषो’ औपचारिक संबोधन को बनाए रखता है, जबकि ‘मानव-सन्तान’ सामान्य पाठक के लिए समझने योग्य रहते हुए मूल वंशगत बिंब को भी बचाता है।
