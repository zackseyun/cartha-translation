  text: מֵ֭/עוֹלָם נִסַּ֥כְתִּי מֵ/רֹ֗אשׁ מִ/קַּדְמֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/023.yaml
  text: From everlasting I was established[a], from the beginning, from before the earth.
translation:
  language: hi
  text: अनादिकाल से मैं स्थापित की गई थी[a], आरम्भ से, पृथ्वी के होने से पहले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे ठहराई गई थी’; इब्रानी क्रिया का अर्थ विवादित है। इसे ‘नियुक्त की गई थी’ और—इस प्रसंग में कम सम्भावित रूप से—‘मेरा अभिषेक किया गया था’ भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעוֹלָם
  choice: अनादिकाल से
  rationale: यह पद दूरस्थ प्राचीनता अथवा अनन्तता का बोध करा सकता है। सृष्टि-पूर्व प्रसंग में ‘अनादिकाल से’ ऊँचे कालगत भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נִסַּכְתִּי
  choice: मैं स्थापित की गई थी
  rationale: निफ़अल रूप का अर्थ यहाँ विवादित है। प्रसंग में स्त्रीलिंग व्यक्तिरूप बुद्धि सृष्टि से पहले अपने ठहराए या नियुक्त किए जाने की बात करती है; ‘स्थापित की गई थी’ इस अर्थ को बिना अनावश्यक मसीही संकेत जोड़े व्यक्त करता है।
- source_word: מֵרֹאשׁ
  choice: आरम्भ से
  rationale: कालसूचक प्रयोग में רֹאשׁ का सामान्य अर्थ ‘आरम्भ’ है; यह समानांतर कालगत वाक्यांशों के साथ संक्षिप्त और स्वाभाविक है।
- source_word: מִקַּדְמֵי אָרֶץ
  choice: पृथ्वी के होने से पहले
  rationale: इस सृष्टि-संबंधी प्रसंग में पद पृथ्वी से पूर्व की कालगत प्राथमिकता बताता है। यह हिन्दी में ‘पृथ्वी से पहले’ की अपेक्षा अधिक स्पष्ट है और אָרֶץ को ‘भूमि’ न कहकर विश्वगत अर्थ में ‘पृथ्वी’ रखता है।
theological_decisions:
- issue: व्यक्तिरूप बुद्धि का सम्भावित अतिमसीहीकरण
  choice: पद को व्यक्तिरूप बुद्धि के सृष्टि-पूर्व स्थापित किए जाने के कथन के रूप में अनूदित किया गया है, बिना स्पष्ट मसीही या त्रिएकतावादी शब्दावली जोड़े।
  alternative: נִסַּכְתִּי का अनुवाद ‘मेरा अभिषेक किया गया था’ करना, जिससे मसीही अर्थ का संकेत मिल सकता है।
  rationale: ऐतिहासिक मसीही पठन इस अध्याय को प्रतिरूपात्मक रूप से पुत्र से जोड़ सकता है, पर अनुवाद को इब्रानी पाठ के तात्कालिक साहित्यिक अर्थ पर टिके रहना चाहिए और ऐसा धर्मसैद्धान्तिक अर्थ नहीं जोड़ना चाहिए जिसकी पद स्वयं माँग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘बुद्धि’ स्त्रीलिंग होने के कारण ‘की गई थी’ रखा गया है। तीनों कालगत पदबंधों की काव्यात्मक समानांतरता और मूल की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
