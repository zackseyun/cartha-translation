  text: לִֽ/י עֵ֭צָה וְ/תוּשִׁיָּ֑ה אֲנִ֥י בִ֝ינָ֗ה לִ֣/י גְבוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/014.yaml
  text: Counsel and sound wisdom are mine[a]; I am understanding; strength is mine.
translation:
  language: hi
  text: परामर्श और खरी बुद्धि मेरे हैं[a]; मैं समझ हूँ; सामर्थ्य मेरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परामर्श और कारगर बुद्धि मेरे हैं; मैं अंतर्दृष्टि हूँ; बल मेरा है।”
    reason: תוּשִׁיָּה, בִינָה और גְּבוּרָה के संभव वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: עֵצָה
  choice: सलाह
  rationale: यहाँ शब्द विवेकपूर्ण मार्गदर्शन या परामर्श का बोध कराता है। ‘सलाह’ आधुनिक हिन्दी में स्वाभाविक और सर्वसुलभ है।
- source_word: תוּשִׁיָּה
  choice: खरी बुद्धि
  rationale: यह शब्द ठोस, विश्वसनीय और प्रभावकारी बुद्धि या सूझ-बूझ को व्यक्त कर सकता है। ‘खरी बुद्धि’ उसकी दृढ़ता और व्यावहारिक प्रभावशीलता दोनों को संक्षेप में रखती है।
- source_word: אֲנִי בִינָה
  choice: मैं ही समझ हूँ
  rationale: क्रियारहित इब्रानी वाक्य बुद्धि को केवल समझ रखनेवाली नहीं, बल्कि समझ का साकार रूप बताता है। ‘ही’ इस आत्मपरिचय के बल को स्वाभाविक हिन्दी में उभारता है।
- source_word: גְּבוּרָה
  choice: सामर्थ्य
  rationale: यह शक्ति, बल या पराक्रम का अर्थ दे सकता है। इस गुण-सूची में ‘सामर्थ्य’ व्यापक है और अनावश्यक रूप से युद्ध-संबंधी अर्थ नहीं जोड़ता।
- source_word: לִי ... לִי
  choice: मेरी हैं ... मेरा है
  rationale: दोहराया गया לִי अधिकार और स्वामित्व पर बल देता है। ‘मेरी हैं’ और ‘मेरा है’ उस काव्यात्मक पुनरावृत्ति को बनाए रखते हैं।
theological_decisions:
- issue: बुद्धि का मानवीकरण
  choice: बुद्धि के प्रथम-पुरुष आत्मवर्णन को यथावत रखा गया है।
  alternative: अनुवाद में इसे सीधे किसी बाद की मसीही पहचान से जोड़ना।
  rationale: नीतिवचन 8 में बुद्धि मानवीकृत होकर बोलती है। इब्रानी पाठ से आगे बढ़कर व्यापक धर्मवैज्ञानिक बहस को अनुवाद में तय नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-विन्यास और ‘मेरी हैं ... मेरा है’ की पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
