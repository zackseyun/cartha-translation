  to: 'मैं उसकी पृथ्वी के जगत में[a] आनन्दित होती थी,


    और मेरा आनन्द मनुष्यों के साथ था।[b]'
  rationale: The revision improves idiomatic modern Hindi and clarifies the collective sense of בְּנֵי אָדָם, while retaining the source's poetic structure, feminine first-person voice, possessive ‘his earth,’ and lexical alternative for תֵבֵל. No doctrinal interpretation has been added.
