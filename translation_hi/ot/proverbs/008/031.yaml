  text: rejoicing in the world of his earth[b][a], and my delight was with the sons of man.
translation:
  language: hi
  text: 'मैं उसकी पृथ्वी के जगत में[a] आनन्दित होती थी,


    और मेरा आनन्द मनुष्यों के साथ था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसकी पृथ्वी के बसे हुए जगत में।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य के पुत्रों के साथ”; अर्थात् मानवजाति के साथ।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֶקֶת
  choice: आनन्द मना रही थी
  rationale: स्त्रीलिंग कृदन्त को व्यक्तिरूप में बोलती हुई बुद्धि के स्त्रीलिंग स्वर के अनुरूप रखा गया है। यह सृष्टि में उसके सक्रिय, उल्लासपूर्ण आनन्द को व्यक्त करता है; केवल खेल-कूद का अर्थ थोपता नहीं।
- source_word: בְּתֵבֵל
  choice: जगत में
  rationale: תֵבֵל व्यवस्थित और बसी हुई पृथ्वी के जगत को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक काव्यात्मक शब्द ‘जगत’ रखा गया है और ‘बसे हुए जगत’ की अधिक विशिष्ट छाया पादटिप्पणी में दी गई है।
- source_word: אַרְצוֹ
  choice: उसकी पृथ्वी
  rationale: तीसरे पुरुष एकवचन पुल्लिंग स्वामित्वसूचक प्रत्यय को स्पष्ट रखा गया है। सृष्टि के व्यापक प्रसंग में ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उपयुक्त है।
- source_word: וְשַׁעֲשֻׁעַי
  choice: और मेरा आनन्द था
  rationale: इब्रानी बहुवचन रूप यहाँ गहन अथवा भरपूर आनन्द व्यक्त कर सकता है। आधुनिक हिन्दी में एकवचन भाववाचक ‘मेरा आनन्द’ अधिक स्वाभाविक है और समानांतर पंक्ति से मेल खाता है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्य की सन्तानों
  rationale: यह मूल पदबंध की पारिवारिक उपमा को बनाए रखता है और समस्त मानवजाति को सूचित करता है। अर्थ की स्पष्टता के लिए ‘मनुष्यों’ विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: व्यक्तिरूप में प्रस्तुत बुद्धि की सृष्टि-संबंधी आनन्दपूर्ण गतिविधि को बाद की मसीह-विषयक पहचान से अनुवाद में सीधे जोड़ना
  choice: स्त्रीलिंग प्रथम-पुरुष स्वर बनाए रखते हुए बुद्धि को सृष्टि और मनुष्य की सन्तानों में आनन्दित दिखाया गया है।
  alternative: बुद्धि को सीधे देहधारण-पूर्व पुत्र के रूप में पहचानने वाली मसीह-विषयक व्याख्या।
  rationale: मूल इब्रानी कविता में बुद्धि स्त्रीलिंग व्यक्तिरूप में बोलती है। व्यापक धर्मवैज्ञानिक या प्रतीकात्मक पाठ संभव हैं, पर उन्हें पद के शब्दों में आरोपित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पंक्ति-विन्यास इब्रानी काव्य के दो समानांतर खंडों को दिखाता है। ‘आनन्द मना रही थी’ स्त्रीलिंग वक्ता को स्पष्ट करता है, जबकि ‘मनुष्य की सन्तानों’ मूल रूपक को सुरक्षित रखता है।
