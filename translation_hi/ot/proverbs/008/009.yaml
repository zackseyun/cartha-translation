lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सभी
  rationale: यह निकटवर्ती संदर्भ में बुद्धि की बातों की ओर संकेत करता है और समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְכֹחִים
  choice: सीधी-साफ़
  rationale: यह शब्द सीधा, प्रत्यक्ष और टेढ़ापन-रहित होने का भाव देता है; वाणी के संदर्भ में ‘सीधी-साफ़’ सहज और स्पष्ट है।
- source_word: לַמֵּבִין
  choice: समझ रखनेवाले को
  rationale: ל संबंध सूचित करता है और בין का कृदंत विवेक या समझ रखनेवाले व्यक्ति को दर्शाता है।
- source_word: וִישָׁרִים
  choice: और खरी
  rationale: יָשָׁר सीधे, सही और खरे होने का भाव रखता है। वचनों के लिए ‘खरी’ नैतिक तथा भाषिक सच्चाई व्यक्त करता है और पहले पदांश की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: לְמֹצְאֵי
  choice: ज्ञान पानेवालों को
  rationale: कृदंत सक्रिय उपलब्धि का भाव रखता है; ‘पानेवालों’ से ज्ञान को खोजकर या अनुभव से प्राप्त करने का आशय स्वाभाविक हिन्दी में आता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: यह בין से अलग शब्द है; ‘ज्ञान’ रखने से इब्रानी समानांतरता में समझ और ज्ञान का भेद बना रहता है।
