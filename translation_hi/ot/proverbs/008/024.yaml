base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/024.yaml
  text: When there were no depths[a], I was brought forth, when there were no springs abounding with water.
translation:
  language: hi
  text: जब अथाह जल नहीं थे, तब मैं जन्मी थी[a]; जब पानी से भरपूर सोते नहीं थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे जन्म दिया गया था” अथवा “मैं रची गई थी।” इब्रानी क्रिया जन्म या प्रसव की छवि जगा सकती है; “मैं जन्मी थी” इस रूपक को बनाए रखता है, बिना उसके अर्थ को अनावश्यक रूप से सीमित किए।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: जब ... नहीं थे
  rationale: दोनों समानांतर पंक्तियों में यह पदबंध समय की परिस्थिति बताता है; यह हिन्दी में स्वाभाविक है और ‘इससे पहले’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: תְּהֹמוֹת
  choice: गहरे जल-भंडार
  rationale: यह बहुवचन संज्ञा गहरे अथवा अथाह जलों को सूचित करती है। ‘गहरे जल-भंडार’ सृष्टि-संदर्भ में अर्थ स्पष्ट करता है, पर किसी विशिष्ट पौराणिक धारणा को नहीं जोड़ता।
- source_word: חוֹלָלְתִּי
  choice: मैं उत्पन्न की गई थी
  rationale: यह निष्क्रिय क्रिया जन्म देने अथवा अस्तित्व में लाने की छवि जगा सकती है। स्त्रीलिंग रूप व्यक्तिरूप में प्रस्तुत बुद्धि के अनुकूल है और किसी संकीर्ण जैविक या धर्मवैज्ञानिक निष्कर्ष को अनिवार्य नहीं बनाता।
- source_word: מַעְיָנוֹת
  choice: सोते
  rationale: यह प्राकृतिक जल-स्रोतों के लिए सहज और प्रचलित हिन्दी शब्द है।
- source_word: נִכְבַּדֵּי מָיִם
  choice: पानी से लबालब
  rationale: मूल अभिव्यक्ति का शाब्दिक भाव ‘पानी से भारी/भरपूर’ है। ‘लबालब’ हिन्दी में प्रचुर जल से भरे होने की ठोस और काव्यात्मक छवि स्वाभाविक रूप से देता है।
- source_word: מָיִם
  choice: पानी
  rationale: इस वाक्य में सामान्य आधुनिक हिन्दी का अगणनीय एकवचन रूप स्वाभाविक है।
theological_decisions:
- issue: नीतिवचन 8 में बुद्धि की उत्पत्ति-संबंधी भाषा
  choice: मैं उत्पन्न की गई थी
  alternative: मैं जन्मी थी / मैं रची गई थी
  rationale: मूल क्रिया प्रसव या जन्म की छवि जगा सकती है, किंतु उसका अर्थ केवल जैविक जन्म तक सीमित नहीं है। चुना हुआ अनुवाद रूपक और निष्क्रिय भाव बनाए रखता है तथा इस काव्यात्मक पाठ में बाद की मसीह-विषयक धर्मशास्त्रीय धारणाएँ नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। समानांतर वाक्य-रचना सुरक्षित रखी गई है। ‘गहरे जल-भंडार’ अर्थ की स्पष्टता देता है और ‘पानी से लबालब सोते’ मूल की प्रचुरता तथा ठोस जल-छवि को सहज हिन्दी में व्यक्त करता है।
