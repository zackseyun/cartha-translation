  yaml_path: translation/ot/proverbs/008/021.yaml
  text: to endow those who love me with wealth[a], and to fill their treasuries.
translation:
  language: hi
  text: 'ताकि जो मुझसे प्रेम करते हैं, उन्हें मैं धन-संपत्ति[a] का उत्तराधिकारी बनाऊँ,

    और उनके भंडारों को भर दूँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मुझसे प्रेम करते हैं उन्हें संपत्ति विरासत में दिलाऊँ”; इब्रानी יֵשׁ का अर्थ “संपत्ति,” “धन-दौलत,” या “अधिकार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַנְחִיל
  choice: उत्तराधिकारी बनाऊँ
  rationale: हिफ़ील रूप का मूल भाव किसी को विरासत या संपत्ति का अधिकारी बनाना है। यह चयन उस विरासत-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֹהֲבַי
  choice: जो मुझसे प्रेम करते हैं
  rationale: कृदन्त और प्रथम पुरुष एकवचन प्रत्यय मिलकर उन लोगों को दर्शाते हैं जिनकी पहचान बुद्धि से प्रेम करने वालों के रूप में है।
- source_word: יֵשׁ
  choice: धन-संपत्ति
  rationale: यहाँ אֹצְרוֹת ‘भंडार’ के समानांतर होने के कारण शब्द वास्तविक संपत्ति या माल-असबाब का संकेत देता है। ‘धन-संपत्ति’ आधुनिक हिन्दी में स्पष्ट है, जबकि विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאֹצְרֹתֵיהֶם
  choice: उनके भंडार
  rationale: אוֹצָר का ठोस अर्थ भंडार या कोषागार है। ‘भंडार’ सहज हिन्दी है और बहुवचन बिंब को बनाए रखता है।
- source_word: אֲמַלֵּא
  choice: भर दूँ
  rationale: पिएल प्रथम पुरुष एकवचन का अर्थ ‘मैं भरूँगा/भरता हूँ’ है; यहाँ यह आरंभिक उद्देश्यसूचक לְ के साथ समन्वित होकर उद्देश्य या परिणाम व्यक्त करता है। ‘भर दूँ’ स्वाभाविक रूप से पूर्णता का भाव देता है।
theological_decisions:
- issue: मानवीकृत बुद्धि द्वारा प्रतिज्ञात आशीषों का स्वरूप
  choice: धन-संपत्ति और भंडार के ठोस समृद्धि-बिंब को बनाए रखा गया है।
  alternative: इसे ‘सच्चा धन’ या ‘स्थायी संपदा’ जैसे अधिक अमूर्त और व्याख्यात्मक शब्दों में प्रस्तुत करना।
  rationale: יֵשׁ और ‘भंडार’ का समानांतर प्रयोग ठोस संपत्ति की छवि का समर्थन करता है। अनुवाद इस बिंब को रखता है, पर इसे प्रत्येक विश्वासी के लिए भौतिक समृद्धि की सिद्धान्तगत गारंटी में नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। काव्यात्मक समानांतरता के लिए दो पंक्तियाँ रखी गई हैं और विरासत के मूल बिंब को ‘उत्तराधिकारी बनाऊँ’ से सुरक्षित किया गया है।
