  text: I walk in the way of righteousness[a], in the midst of the paths of justice,
translation:
  language: hi
  text: 'मैं धार्मिकता[a] के मार्ग पर चलती हूँ,

    न्याय के पथों के बीच में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सही आचरण।” צְדָקָה और מִשְׁפָּט के अर्थ-क्षेत्र एक-दूसरे से मिलते हैं; मुख्य पाठ में उनके काव्यात्मक भेद को “धार्मिकता” और “न्याय” से बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אֹֽרַח
  choice: के मार्ग पर
  rationale: אֹרַח किसी मार्ग, पथ या जीवन-चाल को दर्शाता है। हिन्दी में ‘मार्ग पर चलना’ स्वाभाविक है और नीतिवचन की नैतिक जीवन-यात्रा की छवि बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: צְדָקָה में सही आचरण, नैतिक खराई और न्याय के अर्थ समाहित हैं। समानांतर מִשְׁפָּט से काव्यात्मक भेद बनाए रखने के लिए ‘धार्मिकता’ चुना गया है।
- source_word: אֲהַלֵּך
  choice: मैं ... चलती हूँ
  rationale: הלך यहाँ निरंतर चलने अथवा आचरण करने की रूपकात्मक धारणा देता है। वक्ता ‘बुद्धि’ स्त्रीलिंग है, इसलिए हिन्दी में स्त्रीलिंग क्रिया स्वाभाविक और संदर्भानुकूल है।
- source_word: בְּ/ת֗וֹךְ
  choice: के बीच में
  rationale: תּוֹךְ मध्य या भीतर होने का बोध देता है। ‘के बीच में’ स्थानगत बिंब को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: נְתִיב֥וֹת
  choice: पथों
  rationale: נְתִיבוֹת छोटे मार्गों या पथों का बहुवचन है। ‘पथों’ पहले खंड के ‘मार्ग’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय या उचित व्यवस्था को व्यक्त कर सकता है। यहाँ ‘न्याय’ नैतिक-न्यायिक आशय को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
