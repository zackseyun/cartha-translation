lexical_decisions:
- source_word: קְחוּ
  choice: ग्रहण करो
  rationale: बहुवचन आज्ञार्थक रूप का सीधा आग्रह है। ‘ग्रहण करो’ शिक्षा को स्वीकार करने के संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: מוּסָרִי
  choice: मेरी शिक्षा
  rationale: מוּסָר में शिक्षा के साथ अनुशासन और सुधार का भाव भी हो सकता है; ज्ञान के समानांतर यहाँ ‘शिक्षा’ मुख्य अर्थ को सहज रूप से व्यक्त करती है।
- source_word: וְאַל כָּסֶף
  choice: चाँदी नहीं
  rationale: हिब्रू की निषेधात्मक संरचना को निकटता से रखता है, जबकि पद का समानांतर विन्यास शिक्षा को धन से अधिक चुनने का आशय स्पष्ट करता है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: नीतिवचन के ज्ञान-साहित्य में इसका सामान्य और प्रसंगानुकूल अर्थ ‘ज्ञान’ है।
- source_word: מֵחָרוּץ
  choice: सोने के बदले
  rationale: מִן तुलना या वरीयता व्यक्त करता है और חָרוּץ यहाँ बहुमूल्य अथवा उत्तम सोने को सूचित करता है।
- source_word: נִבְחָר
  choice: उत्तम
  rationale: मूल अर्थ ‘चुना हुआ’ है; सोने के गुण के रूप में ‘उत्तम’ आधुनिक हिन्दी में स्वाभाविक ढंग से विशेष चयनित या श्रेष्ठ सोना व्यक्त करता है।
