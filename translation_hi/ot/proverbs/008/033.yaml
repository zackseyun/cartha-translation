  text: שִׁמְע֖וּ מוּסָ֥ר וַ/חֲכָ֗מוּ וְ/אַל תִּפְרָֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/033.yaml
  text: Hear instruction and become wise[a], and do not neglect it.
translation:
  language: hi
  text: शिक्षा को सुनो और बुद्धिमान बनो; उसकी उपेक्षा मत करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक रूप है। ‘सुनो’ ध्यानपूर्वक ग्रहण करने का व्यापक भाव रखता है और आज्ञापालन का संकेत दे सकता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: מוּסָר
  choice: शिक्षा
  rationale: नीतिवचन के ज्ञान-साहित्यिक संदर्भ में यह सुधारने और गढ़ने वाली शिक्षा को दर्शाता है। ‘शिक्षा’ आधुनिक हिन्दी में स्वाभाविक है और केवल दंड के अर्थ तक सीमित नहीं होती।
- source_word: וַחֲכָמוּ
  choice: और बुद्धिमान बनो
  rationale: חכם के बहुवचन आज्ञार्थक रूप में बुद्धि प्राप्त करने या बुद्धिमान बनने की क्रियात्मक धारणा है; इसलिए केवल ‘बुद्धिमान रहो’ की अपेक्षा ‘बुद्धिमान बनो’ उपयुक्त है।
- source_word: וְאַל
  choice: मत
  rationale: निषेधात्मक आज्ञा को स्वाभाविक हिन्दी में ‘मत’ से व्यक्त किया गया है; अर्धविराम के बाद अलग ‘और’ रखना आवश्यक नहीं है।
- source_word: תִּפְרָעוּ
  choice: उसकी उपेक्षा मत करो
  rationale: פרע यहाँ छोड़ देने, तिरस्कार करने या ध्यान न देने का भाव रख सकता है। निहित कर्म ‘शिक्षा’ को ‘उसकी’ से स्पष्ट करते हुए ‘उपेक्षा मत करो’ सहज और प्रसंगानुकूल है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सीधे संबोधन वाला वाक्य। बहुवचन आज्ञाओं को हिन्दी के सामान्य ‘सुनो/बनो/मत करो’ रूपों में रखा गया है। मूल क्रिया תפרעו की अर्थ-सीमा को मुख्य पाठ में ‘उपेक्षा’ से स्वाभाविक रूप दिया गया; पद छोटा होने और अर्थ पर्याप्त स्पष्ट रहने के कारण अलग पादटिप्पणी नहीं जोड़ी गई।
