  text: וְֽ֭/חֹטְאִ/י חֹמֵ֣ס נַפְשׁ֑/וֹ כָּל מְ֝שַׂנְאַ֗/י אָ֣הֲבוּ מָֽוֶת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/008/036.yaml
  text: But the one who sins against me wrongs his own soul[b][a]; all who hate me love death.
translation:
  language: hi
  text: परन्तु जो मुझे पाने से चूकता है[a], वह अपने ही जीवन को हानि पहुँचाता है[b]; जो मुझसे घृणा करते हैं, वे सब मृत्यु से प्रेम करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरे विरुद्ध पाप करता है।” हिब्रू क्रिया का अर्थ “चूकना” या “पाप करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “वह अपने प्राण/जीवन के साथ हिंसा करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֹטְאִי
  choice: जो मेरे विरुद्ध पाप करता है
  rationale: חטא का अर्थ ‘चूकना’ या ‘पाप करना’ हो सकता है और प्रथम पुरुष प्रत्यय ‘मेरे/मुझे’ स्पष्ट है। मुख्य पाठ में नैतिक अर्थ स्वाभाविक है; ‘मुझे पाने से चूकता है’ की वास्तविक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: חֹמֵס
  choice: हानि पहुँचाता है
  rationale: חמס हिंसा, अन्याय या गंभीर हानि का बोध करा सकता है। נַפְשׁוֹ के साथ यह आत्म-विनाशकारी हानि का भाव देता है; हिन्दी में यह प्रयोग स्वाभाविक है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: נַפְשׁוֹ
  choice: अपने ही प्राण को
  rationale: נפש का अर्थ प्राण, जीवन, स्वयं या व्यक्ति हो सकता है। ‘अपने ही प्राण’ हिब्रू की अभिव्यक्ति और उसकी गंभीरता को बनाए रखता है, पर किसी कठोर शरीर–आत्मा विभाजन को अनिवार्य नहीं करता।
- source_word: כָּל מְשַׂנְאַי
  choice: जो मुझसे घृणा करते हैं, वे सब
  rationale: सार्वभौमिक כָּל और निरंतर विशेषता बताने वाले कृदन्त को सहज हिन्दी संबंधवाचक रचना में व्यक्त किया गया है।
- source_word: אָהֲבוּ מָוֶת
  choice: मृत्यु से प्रेम करते हैं
  rationale: पूर्ण क्रिया यहाँ नीतिवचन-संबंधी सामान्य सत्य व्यक्त करती है, इसलिए हिन्दी वर्तमान काल उपयुक्त है; ‘मृत्यु’ और ‘प्रेम’ का तीखा विरोध ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: ‘अपने ही प्राण को’
  alternative: ‘अपने आपको’ या ‘अपने जीवन को’
  rationale: यह चयन हिब्रू की ठोस अभिव्यक्ति को बनाए रखता है, किन्तु पद को किसी विशिष्ट शरीर–आत्मा सिद्धान्त का कथन नहीं बनाता; आशय यह है कि बुद्धि का विरोध स्वयं के लिए विनाशकारी है।
- issue: חטא עם प्रथम पुरुष कर्म-प्रत्यय का अर्थ
  choice: ‘मेरे विरुद्ध पाप करता है’
  alternative: ‘मुझे पाने से चूकता है’
  rationale: दोनों अर्थ स्रोत-शब्द की अर्थ-सीमा में हैं। मुख्य पाठ में सामान्य नैतिक अर्थ चुना गया है, जबकि ज्ञान को न पाने या उससे चूक जाने की प्रसंगानुकूल सम्भावना पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और नीतिवचन-सुलभ शैली रखी गई है। ‘परन्तु’, ‘प्राण’ और ‘मृत्यु से प्रेम’ पद की काव्यात्मक गरिमा बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है।
