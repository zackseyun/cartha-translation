  yaml_path: translation/ot/proverbs/027/011.yaml
  text: Be wise[a], my son, and make my heart glad[b], that I may answer the one who reproaches me.
translation:
  language: hi
  text: मेरे पुत्र, बुद्धिमान बन[a] और मेरे हृदय को आनन्दित कर, ताकि जो मुझे उलाहना देता है, उसे मैं उत्तर दे सकूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान हो।” हिब्रू आज्ञार्थक रूप बुद्धिमान अवस्था में रहने या बुद्धिमान बनने की ओर बढ़ने—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “ताकि जो मुझे उलाहना देता है, उसे मैं एक बात लौटा सकूँ”—अर्थात्, “उसे उत्तर दे सकूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲכַם
  choice: बुद्धिमान बन
  rationale: पुल्लिंग एकवचन आज्ञार्थक रूप ज्ञान की ओर बढ़ने का आह्वान करता है। ‘बुद्धिमान बन’ आधुनिक हिन्दी में स्वाभाविक है; पादटिप्पणी ‘बुद्धिमान हो’ की स्थितिवाचक सम्भावना को सुरक्षित रखती है।
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: בֵּן पर प्रथम पुरुष एकवचन प्रत्यय का सीधा अर्थ ‘मेरा पुत्र’ है। सम्बोधन को स्पष्ट और गरिमापूर्ण बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: וְשַׂמַּח לִבִּי
  choice: और मेरे हृदय को आनन्दित कर
  rationale: שׂמח का हिफ़ील आज्ञार्थक रूप कारणवाचक है, और ‘मेरा हृदय’ उसका कर्म है। यह अनुवाद कारणवाचकता तथा हिब्रू की ठोस हृदय-संबंधी अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: וְאָשִׁיבָה ... דָבָר
  choice: ताकि ... मैं उत्तर दे सकूँ
  rationale: शाब्दिक अभिव्यक्ति ‘एक बात/वचन लौटा सकूँ’ है, पर इस मुहावरे का स्वाभाविक अर्थ ‘उत्तर देना’ है। सहोर्टेटिव रूप को प्रसंगानुसार उद्देश्य/परिणाम के रूप में व्यक्त किया गया है।
- source_word: חֹרְפִי
  choice: जो मुझे ताना देता है
  rationale: חרף का सक्रिय कृदन्त, प्रथम पुरुष एकवचन कर्म-सूचक प्रत्यय के साथ, उस व्यक्ति को दर्शाता है जो वक्ता को धिक्कारता, अपमानित करता या ताना देता है। ‘ताना देता है’ हिन्दी में व्यक्तिगत और सतत विरोध का स्वाभाविक बोध कराता है।
