base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/021.yaml
  text: The crucible is for silver[a], and the furnace for gold, and a man is tested by his praise.
translation:
  language: hi
  text: चाँदी के लिए गलाने का पात्र और सोने के लिए भट्ठी होती है; मनुष्य की परख उसकी प्रशंसा के अनुसार होती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मनुष्य की परख इससे होती है कि वह किसकी या किस बात की प्रशंसा करता है; अथवा उसे मिलने वाली प्रशंसा से उसकी परख होती है।
    reason: मूल इब्रानी में अंतिम वाक्यांश के दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: מַצְרֵף
  choice: परिशोधन-पात्र
  rationale: यह चाँदी को गलाकर शुद्ध करने और परखने के पात्र को दर्शाता है। ‘परिशोधन-पात्र’ धातु-शोधन की मूल उपमा को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לַכֶּסֶף
  choice: चाँदी को परखने के लिए
  rationale: לְ यहाँ प्रयोजन या उपयुक्तता बताता है। ‘के लिए’ के साथ ‘परखने’ जोड़ने से हिन्दी में पात्र का कार्य स्वाभाविक रूप से स्पष्ट होता है और अगले खंड की ‘परख’ से संबंध भी बना रहता है।
- source_word: כּוּר
  choice: भट्ठी
  rationale: यह धातु गलाने या शुद्ध करने की भट्ठी है; ‘भट्ठी’ सामान्य, सटीक और सहज हिन्दी शब्द है।
- source_word: לַזָּהָב
  choice: सोने को परखने के लिए
  rationale: यह चाँदी वाले समानांतर खंड की तरह भट्ठी के प्रयोजन को व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: नीतिवचन में पुल्लिंग एकवचन सामान्य व्यक्ति का प्रतिनिधित्व करता है। ‘मनुष्य’ मूल के व्याकरणिक रूप और सार्वत्रिक आशय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְפִי
  choice: से
  rationale: शाब्दिक अर्थ ‘के मुख के अनुसार’ है, पर यहाँ यह कसौटी या माप का संबंध व्यक्त करता है। ‘परख ... से होती है’ हिन्दी में संक्षिप्त और मुहावरेदार है।
- source_word: מַהֲלָלוֹ
  choice: उसकी प्रशंसा
  rationale: यह पद उस प्रशंसा को सूचित कर सकता है जो मनुष्य करता है, या जो उसे मिलती है। ‘उसकी प्रशंसा’ मूल की संक्षिप्तता और संभावित द्विअर्थता को बनाए रखती है।
theological_decisions:
- issue: अंतिम खंड में प्रशंसा का कर्ता या प्राप्तकर्ता कौन है
  choice: मनुष्य की परख उसकी प्रशंसा से होती है
  alternative: मनुष्य की परख इससे होती है कि वह किसकी या किस बात की प्रशंसा करता है; अथवा उसे मिलने वाली प्रशंसा से उसकी परख होती है
  rationale: לְפִי מַהֲלָלוֹ वास्तव में अस्पष्ट है। मुख्य पाठ किसी एक अर्थ को अनिवार्य नहीं बनाता, जबकि पादटिप्पणी दोनों प्रमुख व्याख्याएँ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। धातु-शोधन की उपमा को ‘परिशोधन-पात्र’ और ‘भट्ठी’ से सुरक्षित रखा गया है; अंतिम खंड की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी में संरक्षित है।
