id: PRO.27.10
reference: Proverbs 27:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֵֽעֲ/ךָ֨ ו/רעה אָבִ֡י/ךָ אַֽל תַּעֲזֹ֗ב וּ/בֵ֥ית אָחִ֗י/ךָ אַל תָּ֭בוֹא בְּ/י֣וֹם אֵידֶ֑/ךָ ט֥וֹב שָׁכֵ֥ן קָ֝ר֗וֹב מֵ/אָ֥ח רָחֽוֹק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/010.yaml
  text: Do not forsake your friend or your father’s friend[a], and do not go to your brother’s house in the day of your calamity[b]; a nearby neighbor is better than a distant brother.
translation:
  language: hi
  text: अपने मित्र और अपने पिता के मित्र को मत छोड़ना[a], और अपनी विपत्ति के दिन अपने भाई के घर मत जाना[b]; दूर रहने वाले भाई से पास रहने वाला पड़ोसी अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी संयोजक का अनुवाद यहाँ “या अपने पिता के मित्र” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भाई” का अर्थ व्यापक रूप से निकट संबंधी या कुटुम्बी भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵעֲךָ
  choice: अपने मित्र
  rationale: רֵעַ यहाँ मित्र या साथी के व्यक्तिगत संबंध को दर्शाता है; पिता के मित्र के साथ इसकी समानांतरता के कारण ‘मित्र’ सबसे स्वाभाविक है।
- source_word: וְרֵעַ אָבִיךָ
  choice: और अपने पिता के मित्र
  rationale: इब्रानी וְ का मूल और सहज अर्थ ‘और’ है। एक ही निषेध के अंतर्गत दोनों संबंधों को रखने से हिन्दी में वाक्य स्पष्ट और स्वाभाविक रहता है; इसे ‘या’ समझने की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: אַל תַּעֲזֹב
  choice: मत छोड़ना
  rationale: עזב संबंध या दायित्व को त्यागने का भाव रखता है। ‘मत छोड़ना’ आधुनिक हिन्दी में सहज है और मित्रता से मुँह मोड़ने का आशय व्यक्त करता है।
- source_word: וּבֵית אָחִיךָ אַל תָּבוֹא
  choice: और अपने भाई के घर मत जाना
  rationale: בוא का अर्थ आना, जाना या प्रवेश करना हो सकता है। संकट में सहायता लेने के प्रसंग में ‘घर मत जाना’ स्वाभाविक हिन्दी है।
- source_word: בְּיוֹם אֵידֶךָ
  choice: अपनी विपत्ति के दिन
  rationale: אֵיד गंभीर अनिष्ट, आपदा या विपत्ति को सूचित करता है। ‘विपत्ति’ गरिमापूर्ण, व्यापक और सामान्य पाठकों के लिए स्पष्ट है।
- source_word: טוֹב
  choice: अच्छा है
  rationale: טוֹב मूलतः ‘अच्छा’ है, पर מִן के साथ तुलना बनाता है। हिन्दी में ‘से ... अच्छा है’ तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁכֵן קָרוֹב
  choice: पास रहने वाला पड़ोसी
  rationale: קָרוֹב का प्रमुख बिंदु यहाँ भौतिक निकटता है। ‘पास रहने वाला’ इसे भावनात्मक घनिष्ठता समझे जाने से बचाता है।
- source_word: מֵאָח רָחוֹק
  choice: दूर रहने वाले भाई से
  rationale: אָח को ‘भाई’ रखकर पारिवारिक संबंध और व्यावहारिक निकटता का मूल विरोध सुरक्षित रहता है; רָחוֹק को ‘दूर रहने वाला’ भौगोलिक या उपलब्धता की दूरी व्यक्त करता है।
theological_decisions:
- issue: भाई और पड़ोसी के बीच तुलना
  choice: ‘भाई’ को मुख्य पाठ में बनाए रखा गया और दूरी को व्यावहारिक/स्थानिक रूप में व्यक्त किया गया।
  alternative: ‘निकट संबंधी’ या ‘कुटुम्बी’
  rationale: אָח कभी व्यापक कुल-संबंधी को भी दर्शा सकता है, पर ‘भाई’ स्रोत की सशक्त पारिवारिक छवि और अपेक्षित पारिवारिक सहायता बनाम पास उपलब्ध पड़ोसी का तनाव बनाए रखता है।
- issue: पिता के मित्र से पहले संयोजक וְ
  choice: मुख्य पाठ में ‘और’
  alternative: ‘या’
  rationale: इब्रानी संयोजक का सामान्य मूल्य ‘और’ है, और दोनों कर्म एक ही निषेध के अधीन सहज रूप से पढ़े जाते हैं। ‘या’ की वितरक समझ वास्तविक है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘मत छोड़ना’ और ‘मत जाना’ उपदेशात्मक एकवचन को स्वाभाविक रूप देते हैं। ‘पास रहने वाला’ और ‘दूर रहने वाला’ कहकर स्थानिक निकटता का व्यावहारिक विरोध स्पष्ट किया गया है।
