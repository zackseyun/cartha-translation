  text: כְּ֭/צִפּוֹר נוֹדֶ֣דֶת מִן קִנָּ֑/הּ כֵּֽן אִ֝֗ישׁ נוֹדֵ֥ד מִ/מְּקוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/008.yaml
  text: Like a bird that wanders from its nest[a], so is a man who wanders from his place.
translation:
  language: hi
  text: 'जैसे पक्षी अपने घोंसले से भटकता है,

    वैसे ही मनुष्य अपने स्थान[a] से भटकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने घर से।” इब्रानी में “अपने स्थान से” है, जिसका अर्थ घर से व्यापक हो सकता है और किसी के उचित स्थान या स्थिति को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִפּוֹר
  choice: जैसे पक्षी
  rationale: צִפּוֹר पक्षी के लिए सामान्य शब्द है; किसी विशेष प्रजाति को बताना मूल से अधिक विशिष्ट होगा। כְּ उपमा को व्यक्त करता है।
- source_word: נוֹדֶדֶת / נוֹדֵד
  choice: भटकता है
  rationale: एक ही इब्रानी धातु נוד दोनों पंक्तियों में आई है और घूमने, भटकने या स्थिर स्थान छोड़ने का भाव देती है। दोनों जगह एक ही हिंदी क्रिया रखने से मूल का शब्द-साम्य बना रहता है।
- source_word: מִן קִנָּהּ
  choice: अपने घोंसले से
  rationale: קֵן का सीधा अर्थ ‘घोंसला’ है। हिंदी में संबंध स्पष्ट और स्वाभाविक करने के लिए स्त्रीलिंग पक्षी के प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह पहले चित्र और उसके मानवीय समकक्ष के बीच तुलना स्थापित करता है; ‘वैसे ही’ हिंदी में इस समानांतर उपमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: אִישׁ यहाँ एक प्रतिनिधि व्यक्ति के लिए प्रयुक्त है। ‘मनुष्य’ आधुनिक हिंदी में गरिमापूर्ण और स्वाभाविक है तथा कहावत के सामान्य मानवीय अनुप्रयोग को व्यक्त करता है।
- source_word: מִמְּקוֹמוֹ
  choice: अपने स्थान से
  rationale: מָקוֹם का अर्थ व्यापक रूप से ‘स्थान’ है। ‘घर’ अर्थ को अनावश्यक रूप से सीमित कर सकता है, जबकि मूल में निवास, नियत जगह या सामाजिक स्थिति तक का संकेत संभव है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: मनुष्य
  alternative: पुरुष
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है, पर इस कहावत में वह सामान्य प्रतिनिधि व्यक्ति को दर्शाता है। हिंदी ‘मनुष्य’ बिना किसी अतिरिक्त धार्मिक निष्कर्ष के व्यापक मानवीय अनुप्रयोग बनाए रखता है; ‘पुरुष’ केवल जैविक लिंग पर अनावश्यक बल दे सकता है।
- issue: ‘अपने स्थान’ के अर्थ की व्यापकता
  choice: अपने स्थान से
  alternative: अपने घर से
  rationale: मूल का מָקוֹם केवल मकान या घर तक सीमित नहीं है। व्यापक शब्द रखने से यह तनाव बना रहता है कि कहावत निवास-स्थान, उचित जगह या नियत स्थिति—इनमें से एक से अधिक अर्थों की ओर संकेत कर सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, समानांतर कहावती शैली रखी गई है। दोनों पंक्तियों में ‘भटकता है’ दोहराकर इब्रानी की ध्वन्यात्मक और अर्थगत समानता सुरक्षित की गई है।
