  yaml_path: translation/ot/proverbs/027/019.yaml
  text: As in water face reflects face[b][a], so the heart of man reflects man.
translation:
  language: hi
  text: जैसे पानी में चेहरा चेहरे को प्रतिबिंबित करता है,[a][b] वैसे ही मनुष्य का हृदय मनुष्य को प्रतिबिंबित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “जैसे पानी किसी व्यक्ति का चेहरा दिखाता है, वैसे ही उस व्यक्ति का हृदय उसे प्रकट करता है।” यहाँ “मनुष्य” जातिवाचक अर्थ में है।'
    reason: alternative_reading
  - marker: b
    text: 'इब्रानी में शब्दशः: “जैसे पानी—चेहरा चेहरे के सामने/के लिए—वैसे ही मनुष्य का हृदय मनुष्य के लिए।” मूल में कोई स्पष्ट क्रिया नहीं है; पानी के प्रसंग और तुलना के समानांतर से “प्रतिबिंबित करता है” का भाव समझा जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמַּיִם
  choice: जैसे पानी में
  rationale: כְּ तुलना प्रस्तुत करता है। हिन्दी में प्रतिबिंब के स्थान को स्वाभाविक रूप से व्यक्त करने के लिए ‘पानी में’ कहा गया है।
- source_word: הַפָּנִים לַפָּנִים
  choice: चेहरा चेहरे को दर्शाता है
  rationale: इब्रानी में शब्दशः ‘चेहरा, चेहरे के लिए/सामने’ है और क्रिया नहीं दी गई। पानी के प्रसंग में दृश्य समानता या प्रतिबिंब निहित है; ‘दर्शाता है’ उस दीर्घवृत्त को स्पष्ट करते हुए चित्र को बनाए रखता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: आरंभिक तुलना के साथ स्वाभाविक हिन्दी सहसंबंध ‘जैसे … वैसे ही …’ बनाता है।
- source_word: לֵב
  choice: हृदय
  rationale: לֵב व्यक्ति के भीतरी स्वभाव, विचार और प्रवृत्ति को सूचित कर सकता है। ‘हृदय’ ज्ञान-साहित्य की छवि और अर्थ-व्याप्ति दोनों बनाए रखता है।
- source_word: הָאָדָם
  choice: मनुष्य का
  rationale: संज्ञा यहाँ जातिवाचक एकवचन हो सकती है। ‘मनुष्य’ आधुनिक मानक हिन्दी में आदम के सामान्य मानवीय अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לָאָדָם
  choice: मनुष्य को दर्शाता है
  rationale: לְ का संबंधात्मक अर्थ मूल में संक्षिप्त और कुछ हद तक अस्पष्ट है। पहले खंड की निहित प्रतिबिंब-क्रिया को दोहराकर यह अनुवाद बताता है कि हृदय मनुष्य को प्रकट या प्रतिबिंबित करता है, पर ‘किस मनुष्य को’ जैसी संभावित अस्पष्टता को पूरी तरह बंद नहीं करता।
theological_decisions:
- issue: אָדָם के जातिवाचक अर्थ का अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति / मानवजाति
  rationale: दोनों स्थानों पर एकवचन אָדָם है, किंतु नीतिवचन में इसका प्रयोग सामान्य मानव के लिए हो सकता है। ‘मनुष्य’ एकवचन रचना को बनाए रखते हुए हिन्दी में जातिवाचक अर्थ भी देता है।
- issue: हृदय और मनुष्य के बीच संबंध
  choice: मनुष्य का हृदय मनुष्य को दर्शाता है
  alternative: व्यक्ति का हृदय उसी व्यक्ति को प्रकट करता है / एक मनुष्य का हृदय दूसरे मनुष्य के अनुरूप होता है
  rationale: मूल में केवल ‘मनुष्य का हृदय, मनुष्य के लिए/सामने’ है; कोई क्रिया नहीं है। मुख्य पाठ तुलना के समानांतर ‘दर्शाता है’ जोड़ता है, लेकिन व्याख्यात्मक संभावनाओं को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘हृदय’ पारंपरिक बाइबलीय छवि को बनाए रखता है, जबकि ‘दर्शाता है’ सामान्य पाठक के लिए मूल की क्रियारहित तुलना को सुबोध बनाता है।
