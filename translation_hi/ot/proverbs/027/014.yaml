source:
  edition: WLC
  text: מְבָ֘רֵ֤ךְ רֵעֵ֨/הוּ בְּ/ק֣וֹל גָּ֭דוֹל בַּ/בֹּ֣קֶר הַשְׁכֵּ֑ים קְ֝לָלָ֗ה תֵּחָ֥שֶׁב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/014.yaml
  text: Whoever blesses his neighbor with a loud voice[a], rising early in the morning[c][b], it will be counted to him as a curse.
translation:
  language: hi
  text: जो भोर में बहुत सवेरे अपने पड़ोसी[a] को ऊँची आवाज़ में आशीर्वाद देता है, वह उसके लिए शाप माना जाएगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मित्र” अथवा “अपने साथी”।
    reason: lexical_alternative
  - marker: b
    text: 'भाव व्यंग्यपूर्ण है: बहुत सवेरे ऊँची आवाज़ में दिया गया आशीर्वाद शाप के समान माना जाता है। “उसके लिए” का संकेत आशीर्वाद देने वाले या उसे पाने वाले की ओर समझा जा सकता है।'
    reason: ambiguity_and_cultural_note
lexical_decisions:
- source_word: מְבָרֵךְ
  choice: आशीर्वाद देता है
  rationale: पिएल कृदन्त का मूल अर्थ किसी को आशीर्वाद देना या उसके लिए आशीर्वचन कहना है; संदर्भगत व्यंग्य को बनाए रखते हुए इसे केवल अभिवादन तक सीमित नहीं किया गया।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। मुख्य पाठ में व्यापक पारस्परिक संबंध के लिए ‘पड़ोसी’ चुना गया और विकल्प पादटिप्पणी में रखा गया।
- source_word: בְּקוֹל גָּדוֹל
  choice: ऊँची आवाज़ में
  rationale: यह स्वाभाविक हिन्दी में इब्रानी मुहावरे का सीधा अर्थ और व्यवहार की कष्टदायक मुखरता दोनों व्यक्त करता है।
- source_word: בַּבֹּקֶר הַשְׁכֵּים
  choice: भोर में बहुत सवेरे उठकर
  rationale: यह अनुवाद सुबह के समय और जानबूझकर बहुत जल्दी उठने—दोनों पहलुओं को स्पष्ट रखता है।
- source_word: קְלָלָה
  choice: शाप
  rationale: संज्ञा का सीधा अर्थ ‘शाप’ है; पद में आशीर्वाद और शाप का व्यंग्यपूर्ण उलटाव सुरक्षित रखा गया है।
- source_word: תֵּחָשֶׁב לוֹ
  choice: उसके लिए ... समझा जाएगा
  rationale: निफ़अल का निष्क्रिय भाव ‘समझा/माना जाएगा’ से व्यक्त होता है। לוֹ की संदर्भगत अस्पष्टता के कारण यह खुला रहता है कि शाप किसके लिए माना जाता है।
theological_decisions:
- issue: לוֹ का संदर्भ—आशीर्वाद देने वाला या पाने वाला
  choice: ‘उसके लिए’ को मुख्य पाठ में रखा गया, जहाँ निकटतम व्याकरणिक संदर्भ आशीर्वाद देने वाले की ओर संकेत कर सकता है।
  alternative: ‘पड़ोसी द्वारा शाप समझा जाएगा’ या ‘पड़ोसी के लिए शाप समझा जाएगा।’
  rationale: इब्रानी सर्वनाम संदर्भ में कुछ अस्पष्टता छोड़ता है; किसी एक सामाजिक या नैतिक व्याख्या को अनिवार्य न बनाते हुए मूल तनाव बनाए रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कहावत-सदृश शैली रखी गई है। ‘भोर में बहुत सवेरे उठकर’ मूल की समय-संबंधी तीव्रता को व्यक्त करता है; ‘ऊँची आवाज़ में’ स्वाभाविक बोलचाल और साहित्यिक गरिमा के बीच संतुलन रखता है।
