base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/004.yaml
  text: Wrath is cruel[a], and anger is a flood, but who can stand before jealousy?
translation:
  language: hi
  text: क्रोध क्रूर है, और गुस्सा बाढ़ के समान है; पर जलन[a] के सामने कौन टिक सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ईर्ष्या”; इब्रानी शब्द का अर्थ प्रसंग के अनुसार जलन या ईर्ष्या हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזְרִיּוּת
  choice: क्रूर
  rationale: यह भाववाचक संज्ञा क्रूरता या कठोरता बताती है। हिन्दी में इस क्रियारहित उपवाक्य को स्वाभाविक विधेय के रूप में ‘क्रोध क्रूर है’ कहना अर्थ और काव्यात्मक संक्षिप्तता दोनों को बनाए रखता है।
- source_word: חֵמָה
  choice: क्रोध
  rationale: यह शब्द तीव्र, दहकते रोष का बोध कराता है। ‘क्रोध’ गरिमापूर्ण और प्रबल है तथा अगले समानांतर पद אָף के लिए ‘गुस्सा’ से भेद बनाए रखता है।
- source_word: שֶׁטֶף
  choice: बाढ़
  rationale: मूल शब्द उमड़ती बाढ़ या प्रचंड धारा को दर्शाता है। ‘बाढ़ के समान’ हिन्दी में विनाशकारी, अनियंत्रित आवेग का चित्र स्पष्ट रखता है।
- source_word: אָף
  choice: गुस्सा
  rationale: शाब्दिक अर्थ ‘नाक’ है, पर यहाँ प्रचलित मुहावरेदार अर्थ रोष है। ‘गुस्सा’ साधारण पाठक के लिए स्पष्ट है और חֵמָה के ‘क्रोध’ से शब्दगत भेद रखता है।
- source_word: וּמִי
  choice: पर ... कौन
  rationale: संयोजक और प्रश्नवाचक शब्द मिलकर चरमोत्कर्ष वाला विरोध प्रस्तुत करते हैं। ‘पर ... कौन’ इस बढ़ती हुई तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַעֲמֹד
  choice: टिक सकता है
  rationale: क्रिया का मूल अर्थ खड़ा रहना है, और यहाँ सामना करते हुए स्थिर या सुरक्षित बने रहने की क्षमता अभिप्रेत है। ‘टिक सकता है’ प्रश्न की व्यावहारिक शक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानवाचक रूप से ‘के आगे/सामने’ है। ‘के सामने’ मूल स्थानिक रूपक और सामना करने का भाव दोनों सुरक्षित रखता है।
- source_word: קִנְאָה
  choice: जलन
  rationale: यह शब्द ईर्ष्या, जलन, डाह या प्रसंगानुसार उत्साह/जोश भी दर्शा सकता है। विनाशकारी मानवीय भावनाओं के इस प्रसंग में ‘जलन’ स्वाभाविक और व्यापक है; ‘ईर्ष्या’ को पाठ-टिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
