  text: בַּרְזֶ֣ל בְּ/בַרְזֶ֣ל יָ֑חַד וְ֝/אִ֗ישׁ יַ֣חַד פְּנֵֽי רֵעֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/017.yaml
  text: Iron sharpens iron[a], and a man sharpens the face of his friend.
translation:
  language: hi
  text: लोहा लोहे को पैना करता है, और मनुष्य अपने मित्र के चेहरे को पैना करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोहा लोहे को पैना करता है, और एक मनुष्य दूसरे को पैना करता है।” इब्रानी में शाब्दिक रूप से “अपने मित्र के चेहरे को पैना करता है” है; यह मुहावरा किसी दूसरे व्यक्ति को सुधारने या निखारने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל בְּבַרְזֶל
  choice: लोहा लोहे को
  rationale: בַּרְזֶל का अर्थ स्पष्ट रूप से ‘लोहा’ है। दूसरे पद पर लगा ב साधन अथवा पारस्परिक संपर्क का भाव देता है; हिन्दी में ‘लोहा लोहे को’ संक्षिप्त, स्वाभाविक और कहावत के समानांतर रूप को सुरक्षित रखता है।
- source_word: יָחַד / יַחַד
  choice: तेज करता है
  rationale: हिफ़ील रूप का अर्थ यहाँ ‘तेज करना’ या ‘पैना करना’ है। दोनों खंडों में एक ही क्रिया दोहराकर मूल इब्रानी की समानांतर रचना और दूसरे खंड की जानबूझकर रखी गई रूपकात्मक अस्पष्टता सुरक्षित रहती है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यह पुल्लिंग एकवचन संज्ञा है, पर नीतिवचन में प्रतिनिधिक अर्थ रखती है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के एकवचन, प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: פְּנֵי
  choice: मुख को
  rationale: शाब्दिक अर्थ ‘मुख/चेहरा’ है। ‘मुख’ ठोस बिंब को सुरक्षित रखता है और इसे सीधे ‘चरित्र’ या ‘व्यक्तित्व’ कहकर रूपक का एक ही अर्थ निर्धारित नहीं करता।
- source_word: רֵעֵהוּ
  choice: अपने मित्र के
  rationale: רֵעַ मित्र, साथी या निकट सहयोगी को सूचित कर सकता है। ‘अपने मित्र’ इस पारस्परिक मानवीय संदर्भ में स्वाभाविक है और प्रत्यय के संबंधभाव को स्पष्ट करता है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक पुल्लिंग भाषा
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: אִישׁ पुल्लिंग एकवचन है और यहाँ सामान्य मानवीय अनुभव का प्रतिनिधित्व करता है। ‘मनुष्य’ उसके व्याकरणिक और नीतिवचनात्मक स्वरूप को रखता है, जबकि सिद्धांत को केवल पुरुषों तक सीमित नहीं करता।
- issue: ‘मित्र के मुख को तेज करना’ रूपक का आशय
  choice: रूपक को मुख्य पाठ में यथावत रखना
  alternative: एक मनुष्य दूसरे को निखारता है
  rationale: इब्रानी वाक्य सचमुच ‘अपने मित्र के मुख को तेज करता है’ कहता है। इसका आशय सुधारना, पैना करना, उत्साहित करना या व्यवहार पर प्रभाव डालना हो सकता है; इसलिए मुख्य पाठ में किसी एक व्याख्या को अंतिम नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सदृश रखी गई है। ‘मुख’ अपेक्षाकृत गरिमापूर्ण सामान्य शब्द है और मूल के ठोस बिंब को बचाता है; पादटिप्पणी पाठक को अधिक स्वाभाविक अर्थ-विकल्प देती है।
