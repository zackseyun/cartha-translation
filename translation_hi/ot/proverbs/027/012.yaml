  text: עָר֤וּם רָאָ֣ה רָעָ֣ה נִסְתָּ֑ר פְּ֝תָאיִ֗ם עָבְר֥וּ נֶעֱנָֽשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/012.yaml
  text: A prudent man sees danger and hides himself[a], but the simple pass on and suffer for it.
translation:
  language: hi
  text: विवेकी मनुष्य विपत्ति को देखकर छिप जाता है, पर नासमझ लोग आगे बढ़ जाते हैं और दण्ड भुगतते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परिणाम भुगतते हैं।” हिब्रू में दण्डित होने या अपने कार्य के परिणाम सहने, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: चतुर मनुष्य
  rationale: नीतिवचन में यह शब्द प्रायः सकारात्मक अर्थ में विवेकपूर्ण सूझ-बूझ रखने वाले व्यक्ति को दर्शाता है। ‘चतुर’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ नकारात्मक ‘धूर्त’ अर्थ नहीं देता; ‘मनुष्य’ हिब्रू के पुल्लिंग एकवचन प्रतिनिधि रूप को सुरक्षित रखता है।
- source_word: רָאָה
  choice: देखकर
  rationale: हिब्रू पूर्ण रूप यहाँ सार्वकालिक, लोकोक्तिपरक आचरण बताता है। हिन्दी में ‘देखकर ... छिप जाता है’ इस सामान्य प्रवृत्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָעָה
  choice: विपत्ति
  rationale: शब्द का अर्थ बुराई, हानि या विपत्ति हो सकता है। इस प्रसंग में सामने आती हुई ऐसी हानि अभिप्रेत है जिसे देखकर बचाव किया जा सकता है; ‘विपत्ति’ इस अर्थ-सीमा को बनाए रखता है।
- source_word: נִסְתָּר
  choice: छिप जाता है
  rationale: निफ़अल रूप खतरे से बचने के लिए स्वयं को छिपाने या ओट लेने का भाव देता है। ‘छिप जाता है’ संक्षिप्त, स्वाभाविक और आत्म-संबंधी अर्थ वाला है।
- source_word: פְּתָאיִם
  choice: भोले लोग
  rationale: यह ज्ञान-साहित्य का पारिभाषिक शब्द है, जो अनुभव और विवेक की कमी वाले लोगों को दर्शाता है। ‘भोले लोग’ सामान्य पाठक के लिए सहज है और अनावश्यक रूप से अपमानजनक नहीं।
- source_word: עָבְרוּ
  choice: आगे बढ़ते जाते हैं
  rationale: यह सावधानी बरतने वाले चतुर मनुष्य के विपरीत, बिना रुके उसी दिशा में चलते रहने को व्यक्त करता है। यह हिन्दी पदबंध गति और विरोध दोनों स्पष्ट करता है।
- source_word: נֶעֱנָשׁוּ
  choice: दण्ड भोगते हैं
  rationale: ענשׁ का निफ़अल दण्डित होने, दण्ड चुकाने अथवा परिणाम भुगतने का अर्थ दे सकता है। ‘दण्ड भोगते हैं’ मूल के दण्डात्मक स्वर को बनाए रखता है, बिना किसी औपचारिक न्यायिक प्रक्रिया को आवश्यक ठहराए।
theological_decisions:
- issue: नֶעֱנָשׁוּ में दण्ड और स्वाभाविक परिणाम के बीच अर्थ-तनाव
  choice: दण्ड भोगते हैं
  alternative: उसका परिणाम भुगतते हैं
  rationale: मूल क्रिया में केवल सामान्य पीड़ा से अधिक दण्ड या कीमत चुकाने का भाव संभव है। ‘दण्ड भोगते हैं’ उस तीव्रता को सुरक्षित रखता है; पद यह नहीं बताता कि दण्ड सीधे दैवी न्याय, मानवीय कार्रवाई या मूर्खता के अंतर्निहित परिणाम से आता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली। दोनों अर्ध-पंक्तियों का तीखा विरोध बनाए रखा गया है। मूल में कोई स्पष्ट सर्वनाम ‘उसका/उसके कारण’ नहीं है, इसलिए मुख्य पाठ में अतिरिक्त व्याख्यात्मक पद नहीं जोड़ा गया।
