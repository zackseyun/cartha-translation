  text: A stone is heavy[a], and sand is weighty, but a fool’s anger is heavier than both of them.
translation:
  language: hi
  text: पत्थर भारी होता है, और रेत का बोझ भी भारी होता है; पर मूर्ख का क्रोध इन दोनों से भारी होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּבֶד
  choice: भारी होता है
  rationale: मूल शब्द संज्ञा रूप में ‘भारीपन/भार’ दर्शाता है; हिन्दी की स्वाभाविक कहावत-शैली में विधेयात्मक ‘भारी होता है’ तुलना को स्पष्ट रखता है।
- source_word: אֶבֶן
  choice: पत्थर
  rationale: यह सामान्य और ठोस अर्थ है तथा कहावत के प्रत्यक्ष बिंब को बनाए रखता है।
- source_word: נֵטֶל
  choice: बोझिल होती है
  rationale: मूल संज्ञा ‘बोझ/भार’ का भाव देती है। ‘बोझिल’ पहले और तीसरे खंड के भारीपन वाले अर्थ-क्षेत्र को रखते हुए हिन्दी में सहज है।
- source_word: הַחוֹל
  choice: रेत
  rationale: यहाँ रेत को पदार्थ या समष्टि के रूप में देखा गया है; हिन्दी में निश्चितता-सूचक अलग शब्द की आवश्यकता नहीं है।
- source_word: כַעַס
  choice: क्रोध
  rationale: संदर्भ में यह मूर्ख के रोष या उससे उत्पन्न खीझ/कष्ट को सूचित कर सकता है। मुख्य पाठ में ‘क्रोध’ सबसे स्पष्ट और सामान्य हिन्दी विकल्प है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֱוִיל
  choice: मूर्ख का
  rationale: सम्बन्धसूचक रूप मूल के सामान्य, एकवचन नीतिवचनात्मक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּבֵד
  choice: भारी होता है
  rationale: विशेषण के साथ מִן तुलना प्रकट करता है। ‘भारी होता है’ पहले खंड के बिंब और मूल में כֹּבֶד से निकट शाब्दिक सम्बन्ध को बनाए रखता है।
- source_word: מִשְּׁנֵיהֶם
  choice: उन दोनों से भी
  rationale: यह पत्थर और रेत—दोनों—की ओर संकेत करता है; ‘भी’ हिन्दी में संयुक्त तुलना के जोर को स्वाभाविक ढंग से व्यक्त करता है।
