  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ठोस भार और भावनात्मक बोझ के बीच मूल रूपक तथा ‘दोनों’ की संयुक्त तुलना सुरक्षित रखी गई है।
