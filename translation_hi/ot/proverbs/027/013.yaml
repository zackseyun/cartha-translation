  text: קַח בִּ֭גְד/וֹ כִּי עָ֣רַב זָ֑ר וּ/בְעַ֖ד נָכְרִיָּ֣ה חַבְלֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/013.yaml
  text: Take his garment[a], for he has put up security for a stranger[b]; and hold it in pledge for a foreign woman.
translation:
  language: hi
  text: उसका वस्त्र ले लो, क्योंकि उसने किसी अजनबी के लिए ज़मानत दी है; और विदेशी स्त्री[b] के लिए उससे बंधक ले लो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसे बंधक रखो।” इब्रानी की दूसरी पंक्ति संक्षिप्त है; क्रिया को उस पुरुष से बंधक लेने या उसे ही बंधक रखने के रूप में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “विदेशी स्त्री” के लिए प्रयुक्त इब्रानी शब्द किसी गैर-इस्राएली स्त्री को सूचित कर सकता है; नीतिवचन में यह सामाजिक या नैतिक रूप से अनुचित स्त्री के अर्थ में भी आ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח בִּגְדוֹ
  choice: उसका वस्त्र ले लो
  rationale: לקח का आदेशात्मक बल सीधे रखा गया है। בגד के लिए ‘वस्त्र’ आधुनिक, गरिमापूर्ण और बंधक के प्रसंग के अनुकूल व्यापक शब्द है।
- source_word: כִּי עָרַב זָר
  choice: क्योंकि उसने किसी अजनबी की ज़मानत दी है
  rationale: ערב यहाँ दूसरे व्यक्ति के ऋण की ज़िम्मेदारी लेने या उसके लिए ज़मानत देने को दर्शाता है। זר निकट संबंध या अपने समुदाय से बाहर के व्यक्ति के अर्थ में ‘अजनबी’ है।
- source_word: נָכְרִיָּה
  choice: पराई स्त्री
  rationale: यह शब्द मूलतः बाहरी या विदेशी स्त्री को सूचित कर सकता है और नीतिवचन में सामाजिक अथवा नैतिक रूप से अनुचित स्त्री की छाया भी रखता है। ‘पराई स्त्री’ इस व्यापकता को ‘व्यभिचारिणी’ जैसे अत्यधिक निश्चित अनुवाद से बेहतर बनाए रखता है।
- source_word: חַבְלֵהוּ
  choice: उससे बंधक ले लो
  rationale: חבל ऋण-संबंधी प्रसंग में बंधक या गिरवी लेने का संकेत देता है। पुरुषवाचक प्रत्यय को ‘उससे’ के रूप में व्यक्त करने से वाक्य स्वाभाविक रहता है और उससे जमानत के रूप में कुछ लेने का कानूनी-आर्थिक भाव स्पष्ट होता है।
theological_decisions:
- issue: נָכְרִיָּה की पहचान
  choice: पराई स्त्री
  alternative: विदेशी स्त्री / व्यभिचारिणी
  rationale: मूल शब्द की जातीय-सामाजिक और नीतिवचन-संबंधी नैतिक संभावनाओं को खुला रखा गया है; किसी एक संप्रदायगत या अत्यधिक संकीर्ण पहचान को पाठ में आरोपित नहीं किया गया।
- issue: חַבְלֵהוּ में बंधक का लक्ष्य
  choice: उससे बंधक ले लो
  alternative: उसे बंधक रखो
  rationale: इब्रानी की संक्षिप्तता दोनों प्रकार की समझ की गुंजाइश देती है। मुख्य पाठ में ऋण-संबंधी सहज हिंदी चुनी गई है और वैकल्पिक संरचना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण रखी गई है। ‘ज़मानत’ और ‘बंधक’ सामान्य आधुनिक हिंदी में वित्तीय-कानूनी चित्र को स्पष्ट करते हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
