  text: Know well the condition of your flock[b][a]; set your heart on the herds.
translation:
  language: hi
  text: अपनी भेड़-बकरियों की दशा भली-भाँति जानो[a]; झुंडों पर अपना मन लगाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने झुंड का मुख भली-भाँति जानो”; यहाँ “मुख” उनकी दिखाई देने वाली दशा या स्थिति को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पशुओं के झुंडों की ओर अपना मन लगाओ।” अन्तिम इब्रानी शब्द विभिन्न प्रकार के पशु-समूहों या झुंडों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: भली-भाँति जानो
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute आज्ञा को बल देता है; ‘भली-भाँति जानो’ इस प्रबलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פְּנֵי
  choice: की दशा
  rationale: शाब्दिक अर्थ ‘चेहरा’ है, पर यहाँ मुहावरे में पशुओं की दिखाई देने वाली स्थिति या दशा अभिप्रेत है।
- source_word: צֹאנְךָ
  choice: अपने भेड़-बकरियों
  rationale: צֹאן सामान्यतः छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को सूचित करता है; हिन्दी में ‘भेड़-बकरियाँ’ अर्थ को ‘भेड़ें’ की अपेक्षा अधिक पूर्णतः व्यक्त करता है।
- source_word: שִׁית לִבְּךָ
  choice: मन लगाओ
  rationale: शाब्दिक रूप ‘अपना हृदय रखो’ है; इस सन्दर्भ में ध्यान, लगन और देखभाल का भाव है, जिसे ‘मन लगाओ’ सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לַעֲדָרִים
  choice: अपने झुंडों पर
  rationale: עֲדָרִים पशुओं के समूहों या झुंडों को दर्शाता है। ‘झुंडों’ व्यापक अर्थ को बनाए रखता है और पहले पद के छोटे पशुओं तक इसे अनावश्यक रूप से सीमित नहीं करता।
