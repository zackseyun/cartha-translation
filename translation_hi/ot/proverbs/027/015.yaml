translation:
  language: hi
  text: बरसात के दिन लगातार टपकता पानी और झगड़ालू पत्नी एक-समान हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּלֶף
  choice: टपकता पानी
  rationale: यह छत आदि से पानी के बार-बार टपकने या रिसने का चित्र प्रस्तुत करता है; हिन्दी में ‘टपकता पानी’ इस ठोस बिंब को स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹרֵד
  choice: लगातार
  rationale: कृदन्त चलती रहने वाली क्रिया का बोध कराता है; ‘लगातार’ उसकी निरंतरता को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: בְּיוֹם
  choice: के दिन
  rationale: यह समय-सूचक पद है; ‘के दिन’ कहावत की ठोस परिस्थिति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סַגְרִיר
  choice: मूसलाधार वर्षा
  rationale: यह घनी, लगातार या झोंकों वाली बरसात की दशा को सूचित करता है; ‘मूसलाधार वर्षा’ उस अप्रिय तीव्रता को आधुनिक मानक हिन्दी में संप्रेषित करती है।
- source_word: אֵשֶׁת מִדְיָנִים
  choice: झगड़ालू पत्नी
  rationale: शाब्दिक अर्थ ‘झगड़ों की पत्नी’ है; ‘झगड़ालू पत्नी’ वर्तमान हिन्दी में सहज है और चरित्रांकन को बिना नरम किए सुरक्षित रखता है।
- source_word: נִשְׁתָּוָה
  choice: एक-समान हैं
  rationale: क्रिया समानता या तुल्यता बताती है। हिन्दी में दोनों तुलना-विषयों के साथ बहुवचन ‘एक-समान हैं’ स्पष्ट और स्वाभाविक है।
