  register: आधुनिक मानक हिंदी में कृषि और पशुपालन का चित्र स्वाभाविक रखा गया है। तीनों इब्रानी खंडों का क्रम सुरक्षित है; पहले और दूसरे खंड का समयगत संबंध सहज बनाने के लिए ‘तब’ प्रयुक्त हुआ है। मूल के महत्वपूर्ण शाब्दिक विकल्प पादटिप्पणियों में संरक्षित हैं।
