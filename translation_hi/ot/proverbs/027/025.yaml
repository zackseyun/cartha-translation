  yaml_path: translation/ot/proverbs/027/025.yaml
  text: The hay is removed[a], and the new growth appears[c][b], and the grasses of the mountains are gathered.
translation:
  language: hi
  text: घास हट जाती है[a], नई हरियाली दिखाई देती है[b], और पहाड़ों की वनस्पति इकट्ठी की जाती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घास चली जाती है” अथवा “घास उजागर हो जाती है।” इब्रानी क्रिया हटने, चले जाने, या उजागर होने का भाव दे सकती है; इस कृषि-संदर्भ में घास के काटे जाने का अर्थ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “कोमल घास” अथवा “ताज़ी घास।”
    reason: lexical_alternative
  - marker: c
    text: या “पहाड़ों की घासें/पौधे इकट्ठे किए जाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלָה
  choice: कट जाती है
  rationale: मूल क्रिया का अर्थ खुल जाना, हटा दिया जाना या चला जाना हो सकता है। चारे की कटाई के इस कृषि-संदर्भ में ‘कट जाती है’ स्वाभाविक ढंग से उस स्थिति को व्यक्त करता है जिसमें पुरानी घास हटती है, जबकि उसकी मूल अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: חָצִיר
  choice: घास
  rationale: यह शब्द घास अथवा चारे के लिए काटी जाने वाली घास को दर्शा सकता है। हिंदी में ‘सूखी घास’ कहने से ऐसी अवस्था जुड़ सकती है जो मूल में अनिवार्य नहीं, इसलिए व्यापक ‘घास’ चुना गया है।
- source_word: נִרְאָה
  choice: दिखाई देती है
  rationale: निफ़अल रूप का सीधा अर्थ ‘दिखाई देना’ या ‘प्रकट होना’ है; यह नई वनस्पति के उभरने के लिए सहज हिंदी है।
- source_word: דֶשֶׁא
  choice: नई हरियाली
  rationale: शब्द ताज़ी, कोमल हरी वनस्पति को सूचित करता है। ‘नई हरियाली’ पुनः उगने का भाव सहज हिंदी में व्यक्त करती है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: נֶאֶסְפוּ
  choice: इकट्ठी की जाती है
  rationale: यह אָסַף का निफ़अल बहुवचन है और संग्रह किए जाने का निष्क्रिय भाव रखता है। हिंदी में ‘वनस्पति’ के साथ एकवचन स्त्रीलिंग सामूहिक प्रयोग स्वाभाविक है।
- source_word: עִשְּׂבוֹת
  choice: वनस्पति
  rationale: यह बहुवचन शब्द घास, पौधों या व्यापक हरियाली को दर्शाता है। ‘वनस्पति’ पहाड़ी क्षेत्र में एकत्र किए जाने वाले विविध पौधीय चारे का सामूहिक और गरिमापूर्ण हिंदी रूप है।
- source_word: הָרִים
  choice: पहाड़ों
  rationale: मूल बहुवचन का सामान्य और सीधा अर्थ ‘पहाड़’ है; अतः भूभाग को अनावश्यक रूप से ‘पहाड़ियों’ तक सीमित नहीं किया गया।
