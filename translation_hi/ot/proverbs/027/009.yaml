  yaml_path: translation/ot/proverbs/027/009.yaml
  text: Oil and incense make the heart glad[a], and the sweetness of a friend comes from the counsel of the soul.
translation:
  language: hi
  text: 'तेल और धूप मन को प्रसन्न करते हैं,

    और मित्र की मधुरता मन की सलाह से आती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मित्र की मधुरता अपनी ही सलाह से बढ़कर है।” इब्रानी में दूसरी पंक्ति अत्यंत संक्षिप्त है और उसका अर्थ एक से अधिक प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁמֶן
  choice: तेल
  rationale: यह शब्द सामान्यतः तेल को दर्शाता है, जिसमें सुगंधित अथवा अभिषेक का तेल भी सम्मिलित हो सकता है; धूप के साथ रखा गया ठोस बिंब बनाए रखने के लिए ‘तेल’ चुना गया।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: यह सुगंधित जलाए जाने वाले पदार्थ को दर्शाता है; आधुनिक हिन्दी में ‘धूप’ इस बिंब को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יְשַׂמַּח לֵב
  choice: मन को प्रसन्न करते हैं
  rationale: इब्रानी ‘हृदय’ भीतरी भाव-जगत का संकेत है; हिन्दी में ‘मन को प्रसन्न करना’ उसी अर्थ को सहजता से व्यक्त करता है।
- source_word: מֶתֶק
  choice: मधुरता
  rationale: ‘मधुरता’ मूल के मिठास/सुखदता वाले इंद्रिय-बिंब को सुरक्षित रखती है और मित्रता के आनंद पर भी स्वाभाविक रूप से लागू होती है।
- source_word: רֵעֵהוּ
  choice: मित्र की
  rationale: संज्ञा पर तृतीय पुरुष एकवचन प्रत्यय है; नीतिवचन की सामान्य शैली में ‘मित्र की’ स्वाभाविक है और अनावश्यक रूप से किसी विशेष व्यक्ति को निर्दिष्ट नहीं करती।
- source_word: מֵעֲצַת
  choice: सलाह से आती है
  rationale: 'מִן को स्रोत के अर्थ में लिया गया है: मित्र की मधुरता उस सलाह से उत्पन्न होती है। फिर भी वैकल्पिक तुलनात्मक समझ को पादटिप्पणी में सुरक्षित रखा गया है।'
- source_word: נָפֶשׁ
  choice: आत्मीय
  rationale: नָפֶשׁ का शाब्दिक अर्थ ‘प्राण/जीव/स्व’ हो सकता है; यहाँ ‘आत्मीय’ भीतर से निकली, सच्ची सलाह का भाव देता है, बिना अस्वाभाविक ‘आत्मा की सलाह’ कहे।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक रूप अपनाया गया है। पहली पंक्ति के ठोस सुगंध-बिंब और दूसरी पंक्ति की ‘मधुरता’ को बनाए रखा गया है। इब्रानी दूसरी पंक्ति की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
