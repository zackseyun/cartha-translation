- source_word: וְלֹא ... וְאַל
  choice: '... नहीं; ... नहीं'
  rationale: दोनों निषेधों को संतुलित हिन्दी समानांतरता में रखा गया है। दूसरे चरण के אַל का निषेधात्मक बल भी बना रहता है।
