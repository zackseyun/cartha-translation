translation:
  language: hi
  text: खुली फटकार छिपे हुए प्रेम[a] से अच्छी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गुप्त रखा गया प्रेम।’ इब्रानी का आशय ऐसे प्रेम से हो सकता है जो प्रेम के अभाव की नहीं, बल्कि उसके व्यक्त न किए जाने की स्थिति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹבָה
  choice: अच्छी है
  rationale: מִן के साथ यह विशेषण तुलनात्मक अर्थ देता है। हिन्दी में ‘से अच्छी है’ स्वाभाविक ढंग से ‘बेहतर है’ का भाव व्यक्त करता है और नीतिवचन की संक्षिप्तता बनाए रखता है।
- source_word: תּוֹכַחַת
  choice: डाँट
  rationale: यह शब्द मौखिक फटकार या दोष-सुधार को दर्शाता है। ‘डाँट’ सामान्य आधुनिक हिन्दी में सहज है और अपेक्षित तीखापन बनाए रखता है; ‘सुधार’ अपेक्षाकृत व्यापक और नरम होता।
- source_word: מְגֻלָּה
  choice: खुली
  rationale: शाब्दिक अर्थ ‘उघाड़ी हुई/प्रकट’ है। ‘खुली डाँट’ ऐसी फटकार का स्वाभाविक हिन्दी रूप है जो छिपाकर नहीं, स्पष्ट रूप से दी गई हो; इसे अनिवार्यतः सार्वजनिक कहना मूल से अधिक विशिष्ट होता।
- source_word: מִן
  choice: से
  rationale: यहाँ מִן तुलना का चिह्न है, जिसे हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אַהֲבָה
  choice: प्रेम
  rationale: यह प्रेम के लिए सामान्य संज्ञा है। ‘प्रेम’ गरिमापूर्ण, व्यापक और मानक बाइबलीय हिन्दी में स्वाभाविक है।
- source_word: מְסֻתָּרֶת
  choice: छिपे हुए
  rationale: यह निष्क्रिय कृदन्त ‘छिपा हुआ/गुप्त रखा हुआ’ दर्शाता है। ‘छिपे हुए प्रेम’ उस अस्पष्टता को बनाए रखता है कि प्रेम मौजूद है, पर व्यक्त या प्रकट नहीं हुआ।
