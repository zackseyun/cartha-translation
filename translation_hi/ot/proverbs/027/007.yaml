  text: נֶ֣פֶשׁ שְׂ֭בֵעָה תָּב֣וּס נֹ֑פֶת וְ/נֶ֥פֶשׁ רְ֝עֵבָ֗ה כָּל מַ֥ר מָתֽוֹק־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/007.yaml
  text: A satisfied person despises honey[b][a], but to a hungry person every bitter thing is sweet.
translation:
  language: hi
  text: तृप्त व्यक्ति शहद[a] को भी तुच्छ समझता है, पर भूखे व्यक्ति को हर कड़वी वस्तु मीठी लगती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘शहद’ से विशेष रूप से छत्ते का शहद या टपकता हुआ शहद अभिप्रेत हो सकता है। शाब्दिक अनुवाद: “तृप्त व्यक्ति शहद को रौंदता है, पर भूखे व्यक्ति को हर कड़वी वस्तु मीठी लगती है।” इब्रानी में ‘प्राण’ या ‘जीव’ के लिए प्रयुक्त शब्द यहाँ व्यक्ति को उसकी भूख या इच्छा के संदर्भ में दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: यहाँ נֶפֶשׁ व्यक्ति को उसकी भूख या इच्छा के संदर्भ में दर्शाता है; आधुनिक हिन्दी में ‘व्यक्ति’ स्वाभाविक है और दोनों पंक्तियों का समानांतर भाव बनाए रखता है।
- source_word: שְׂבֵעָה
  choice: तृप्त
  rationale: यह शब्द भर जाने या पेट भरा होने की अवस्था बताता है; ‘तृप्त’ संक्षिप्त, गरिमापूर्ण और ‘भूखे’ के स्पष्ट विपरीत है।
- source_word: תָּבוּס
  choice: तुच्छ समझता है
  rationale: क्रिया का मूल चित्र ‘रौंदना’ है, पर भोजन के संदर्भ में यह उपेक्षा या तिरस्कार व्यक्त करती है। ‘तुच्छ समझता है’ उस आलंकारिक अर्थ को स्वाभाविक हिन्दी में देता है।
- source_word: נֹפֶת
  choice: मधु
  rationale: यह विशेष रूप से छत्ते से टपकते या बहते शहद का संकेत दे सकता है। ‘मधु’ नीतिवचन की गरिमापूर्ण शैली में स्वाभाविक है; विशेष अर्थ पादटिप्पणी में रखा गया है।
- source_word: רְעֵבָה
  choice: भूखे
  rationale: शब्द सामान्य भूख को व्यक्त करता है; ‘भूखे’ अर्थ को बिना अनावश्यक तीव्रता जोड़े ठीक से बताता है।
- source_word: כָּל
  choice: हर
  rationale: यहाँ शब्द वितरणात्मक है और सामान्य नीतिवचनात्मक कथन में ‘हर’ सहज हिन्दी है।
- source_word: מַר
  choice: कड़वी वस्तु
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘कड़वी वस्तु’ इसे हिन्दी में स्पष्ट करता है।
- source_word: מָתוֹק
  choice: मीठी लगती है
  rationale: इब्रानी में सीधे ‘मीठी’ कहा गया है। हिन्दी में स्वाद के अनुभव के लिए ‘मीठी लगती है’ स्वाभाविक है और भाव को ‘वास्तव में हो जाती है’ के रूप में अधिक नहीं खींचता।
