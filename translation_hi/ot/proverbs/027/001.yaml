base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/001.yaml
  text: Do not boast about tomorrow[a], for you do not know what a day may bring.
translation:
  language: hi
  text: कल के बारे में घमंड मत करो, क्योंकि तुम नहीं जानते कि एक दिन क्या ले आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘एक दिन क्या जन्म देगा’ या ‘उत्पन्न करेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַלֵּל
  choice: अपनी बड़ाई मत करना
  rationale: हित्पएल रूप यहाँ आत्म-प्रशंसा या आत्मश्लाघा का भाव देता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और अपने भविष्य को लेकर घमंड करने की चेतावनी को बनाए रखता है।
- source_word: בְּיוֹם מָחָר
  choice: कल के विषय में
  rationale: शाब्दिक अर्थ ‘कल के दिन में/पर’ है, पर यहाँ संबंधसूचक भाव है—आने वाले कल को लेकर बड़ाई करना। ‘कल के विषय में’ इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका सीधा और स्वाभाविक समतुल्य है।
- source_word: תֵדַע
  choice: तुम नहीं जानते
  rationale: क्रिया ज्ञान के अभाव को बताती है, किसी अमूर्त असमर्थता को नहीं; इसलिए कथन को सीधा रखा गया है।
- source_word: מַה יֵּלֶד יוֹם
  choice: एक दिन क्या जन्म देगा
  rationale: יָלַד का मूल अर्थ ‘जन्म देना’ है और यहाँ दिन के परिणाम उत्पन्न करने के लिए रूपकतः प्रयुक्त है। हिन्दी में यह रूपक समझने योग्य और काव्यात्मक है, इसलिए इसे मुख्य पाठ में सुरक्षित रखा गया है।
