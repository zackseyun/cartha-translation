  text: כְּבָשִׂ֥ים לִ/לְבוּשֶׁ֑/ךָ וּ/מְחִ֥יר שָׂ֝דֶ֗ה עַתּוּדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/026.yaml
  text: Lambs are for your clothing[a], and goats are the price of a field.
translation:
  language: hi
  text: 'मेम्ने तुम्हारे वस्त्रों के लिए हैं,

    और बकरे खेत की कीमत हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּבָשִׂים
  choice: मेम्ने
  rationale: यह संज्ञा सामान्यतः छोटी या जवान भेड़ों को दर्शाती है। ‘मेम्ने’ मूल शब्द की विशिष्टता बनाए रखता है और ऊन से वस्त्र मिलने के कृषि-संदर्भ में उपयुक्त है।
- source_word: לִלְבוּשֶׁךָ
  choice: तुम्हारे वस्त्रों के लिए
  rationale: לְ उद्देश्य या उपयोग व्यक्त करता है और प्रत्यय द्वितीय पुरुष एकवचन पुल्लिंग है। यह अनुवाद मूल के संक्षिप्त कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמְחִיר
  choice: और ... कीमत हैं
  rationale: מְחִיר का अर्थ ‘कीमत’ या ‘भुगतान-मूल्य’ है। इब्रानी में अनुपस्थित संयोजक क्रिया को हिन्दी में ‘हैं’ से स्पष्ट किया गया है।
- source_word: שָׂדֶה
  choice: खेत
  rationale: שָׂדֶה का सीधा और सामान्य अर्थ ‘खेत’ है; यहाँ पशुधन के आर्थिक मूल्य का कृषि-संदर्भ है।
- source_word: עַתּוּדִים
  choice: बकरे
  rationale: यह शब्द विशेष रूप से नर बकरों को दर्शाता है। हिन्दी का ‘बकरे’ इस लैंगिक विशिष्टता को स्वाभाविक रूप से व्यक्त करता है, इसलिए व्यापक ‘बकरियाँ’ और किसी पाद-टिप्पणी की आवश्यकता नहीं है।
theological_decisions: []
