  text: נֹצֵ֣ר תְּ֭אֵנָה יֹאכַ֣ל פִּרְיָ֑/הּ וְ/שֹׁמֵ֖ר אֲדֹנָ֣י/ו יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/018.yaml
  text: Whoever tends a fig tree will eat its fruit[b][a], and he who watches over his master will be honored.
translation:
  language: hi
  text: जो अंजीर के पेड़ की देखभाल करता है, वह उसका फल खाएगा; और जो अपने स्वामी का ध्यान रखता है, वह सम्मान पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹצֵר
  choice: देखभाल करता है
  rationale: मूल क्रिया में रक्षा करने, संभालने और निष्ठापूर्वक ध्यान देने का भाव है। अंजीर के पेड़ के संदर्भ में ‘देखभाल करता है’ स्वाभाविक कृषि-अर्थ व्यक्त करता है।
- source_word: תְּאֵנָה
  choice: अंजीर का पेड़
  rationale: संज्ञा यहाँ फल नहीं, अंजीर के वृक्ष को दर्शाती है; इससे कहावत का ठोस कृषि-बिंब बना रहता है।
- source_word: יֹאכַל
  choice: खाएगा
  rationale: अपूर्ण क्रिया कहावत में सामान्यतः होने वाले परिणाम को व्यक्त करती है; हिन्दी में भविष्यत् रूप इस कारण-परिणाम को सहजता से बताता है।
- source_word: פִּרְיָהּ
  choice: उसका फल
  rationale: स्त्रीलिंग एकवचन प्रत्यय का पूर्वपद अंजीर का पेड़ है; हिन्दी में ‘उसका फल’ स्वाभाविक है।
- source_word: שֹׁמֵר
  choice: ध्यान रखता है
  rationale: क्रिया में रखवाली, सावधानी और निष्ठापूर्वक देखरेख का अर्थ है। ‘ध्यान रखता है’ केवल शारीरिक सुरक्षा तक अर्थ को सीमित किए बिना मूल समानांतरता को व्यक्त करता है।
- source_word: אֲדֹנָיו
  choice: अपने स्वामी
  rationale: यहाँ शब्द किसी मानवीय अधिकारी या स्वामी के सामान्य सामाजिक संबंध को दर्शाता है; पाठ स्वयं इसे परमेश्वर का विशिष्ट पदनाम नहीं बनाता।
- source_word: יְכֻבָּד
  choice: उसका सम्मान किया जाएगा
  rationale: पुअल रूप सम्मान प्राप्त करने का भाव देता है। यह अनुवाद प्रतिफल की प्रकृति को अतिरिक्त रूप से परिभाषित किए बिना मूल अर्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: ‘अपने स्वामी’ का अभिप्रेत व्यक्ति
  choice: मानवीय स्वामी या अधिकारी
  alternative: प्रभु परमेश्वर के लिए व्यापक आत्मिक प्रयोग
  rationale: אֲדֹנָיו में ऐसा कोई चिह्न नहीं है जो अनिवार्य रूप से परमेश्वर की ओर संकेत करे, और अंजीर के पेड़ की देखभाल के साथ समानांतरता सामान्य मानवीय सेवा-संबंध के पक्ष में है। सम्भावित आत्मिक अनुप्रयोग को अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कहावत-सुलभ वाक्य-विन्यास रखा गया है। दोनों अर्ध-पंक्तियों की समानांतर कारण-परिणाम संरचना सुरक्षित है। ‘देखभाल’ और ‘ध्यान’ का चयन मूल की निकटार्थी किन्तु अलग क्रियाओं को स्वाभाविक हिन्दी में दर्शाता है।
