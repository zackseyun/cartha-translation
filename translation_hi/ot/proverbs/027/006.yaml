  text: Faithful are the wounds of a friend[a], but the kisses of an enemy are excessive.
translation:
  language: hi
  text: 'प्रेम करने वाले के दिए घाव भरोसे के योग्य हैं,

    पर बैरी के चुम्बन बहुत अधिक होते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुतायत से मिलते हैं”; आशय यह भी हो सकता है कि बैरी के चुम्बन जरूरत से अधिक होने के कारण असच्चे या छलपूर्ण हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֱמָנִים
  choice: भरोसे के योग्य
  rationale: यह विशेषण विश्वसनीयता और सच्ची नीयत का भाव देता है। यहाँ प्रेम करने वाले के दिए कष्ट को लाभकारी या सुखद नहीं, बल्कि नीयत में भरोसेमंद बताया गया है।
- source_word: פִּצְעֵי
  choice: घाव
  rationale: मूल संज्ञा का सीधा और सजीव अर्थ ‘घाव’ है; इस नीतिवचन में यह कठोर पर हितकारी डाँट या सुधार को भी रूपक रूप में व्यक्त कर सकता है।
- source_word: אוֹהֵב
  choice: प्रेम करने वाला
  rationale: इब्रानी कृदंत का शाब्दिक अर्थ ‘प्रेम करने वाला’ है। यह ‘मित्र’ से अधिक निकटता से मूल शब्द को दर्शाता और संबंध की तुलना प्रेम तथा बैर के आधार पर बनाए रखता है।
- source_word: וְנַעְתָּרוֹת
  choice: बहुत अधिक
  rationale: दुर्बोध रूप का अधिक प्रत्यक्ष अर्थ प्रचुरता या अतिरेक से जुड़ा है। ‘बहुत अधिक’ इस अर्थ को मुख्य पाठ में रखता है, जबकि कपट या असच्चाई का संदर्भगत संकेत पाद-टिप्पणी में दिया गया है।
- source_word: נְשִׁיקוֹת
  choice: चुम्बन
  rationale: बहुवचन संज्ञा का सीधा अर्थ ‘चुम्बन’ है; प्रसंग में यह प्रेम-प्रदर्शन या चापलूसी का चित्र प्रस्तुत करती है।
- source_word: שׂוֹנֵא
  choice: बैरी
  rationale: कृदंत का शाब्दिक अर्थ ‘घृणा करने वाला’ है। संक्षिप्त ‘बैरी’ नीतिवचन के काव्यात्मक प्रतिविरोध को बनाए रखते हुए सहज और गरिमापूर्ण है।
