translation:
  language: hi
  text: चाहे तुम मूर्ख को कूटे हुए अनाज के बीच ओखली में मूसल से कूटो, फिर भी उसकी मूर्खता उससे दूर न होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: चाहे ... फिर भी
  rationale: 'यहाँ शर्त concessive है: अत्यंत कठोर उपाय करने पर भी परिणाम नहीं बदलता। हिंदी का ‘चाहे ... फिर भी’ इस भाव को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: תִּכְתּוֹשׁ
  choice: कूटो
  rationale: क्रिया ओखली और मूसल से पीटकर या दबाकर चूर करने को दर्शाती है; ‘कूटना’ इस घरेलू क्रिया का सटीक और सामान्य हिंदी शब्द है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाले व्यक्ति के लिए नहीं, बल्कि नैतिक और बौद्धिक हठ में पड़े व्यक्ति के लिए प्रयुक्त मानक ज्ञान-साहित्यिक शब्द है।
- source_word: מַּכְתֵּשׁ
  choice: ओखली
  rationale: अनाज या मसाले कूटने के पात्र के लिए यही स्वाभाविक और सटीक हिंदी शब्द है।
- source_word: רִיפוֹת
  choice: कूटे हुए अनाज
  rationale: यह दुर्लभ संज्ञा कूटे या दरदरे किए हुए अनाज को सूचित करती है। चयन चित्र को स्पष्ट रखता है, जबकि शब्द की कुछ अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: עֱלִי
  choice: मूसल
  rationale: ओखली में कूटने के उपकरण का सटीक और प्रचलित हिंदी नाम।
- source_word: תָסוּר מֵעָלָיו
  choice: उससे दूर न होगी
  rationale: इब्रानी मुहावरा किसी गुण या अवस्था के व्यक्ति से हटने या अलग होने को व्यक्त करता है; यह हिंदी में स्वाभाविक और नीतिवचन-सुलभ है।
- source_word: אִוַּלְתּוֹ
  choice: उसकी मूर्खता
  rationale: अमूर्त संज्ञा मूर्ख के भीतर जमी हुई मूर्खता को दर्शाती है; ‘मूर्खता’ आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। सामान्य एकवचन संबोधन के लिए ‘तुम’ रखा गया है। ओखली-मूसल और अनाज का ठोस रूपक अक्षुण्ण रखा गया है; वाक्य का ‘चाहे ... फिर भी’ ढाँचा मूल के concessive बल को स्पष्ट करता है।
