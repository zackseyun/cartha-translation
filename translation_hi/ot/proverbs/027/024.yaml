id: PRO.27.24
reference: Proverbs 27:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹ֣א לְ/עוֹלָ֣ם חֹ֑סֶן וְ/אִם נֵ֝֗זֶר לְ/ד֣וֹר דור־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/024.yaml
  text: For wealth does not last forever[b][a], nor a crown from generation to generation.
translation:
  language: hi
  text: 'क्योंकि धन-संपत्ति[a] सदा नहीं रहती,

    न ही मुकुट[b] पीढ़ी-दर-पीढ़ी बना रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धन’; इब्रानी शब्द חֹסֶן भौतिक साधन, संपत्ति या सामर्थ्य का अर्थ दे सकता है, पर यहाँ का संदर्भ भौतिक संपत्ति की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजमुकुट’; इब्रानी शब्द נֵזֶר का अर्थ मुकुट या अभिषेक/समर्पण भी हो सकता है। यहाँ संभवतः यह पद या शासन के प्रतीक मुकुट को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद आसपास के उपदेश का कारण बताता है; इसलिए कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: חֹסֶן
  choice: धन-संपत्ति
  rationale: पद 23–27 में पशुधन, खेती और भरण-पोषण की चर्चा के कारण यहाँ भौतिक साधन या संपत्ति का अर्थ सबसे उपयुक्त है।
- source_word: לֹא לְעוֹלָם
  choice: सदा नहीं रहती
  rationale: यह अभिव्यक्ति स्थायित्व के निषेध को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: וְאִם
  choice: न ही
  rationale: यद्यपि אִם सामान्यतः ‘यदि’ है, यहाँ पहले निषेध के बाद समानांतर, संक्षिप्त प्रश्नात्मक/निषेधात्मक पंक्ति में यह दूसरी वस्तु के स्थायी न होने को सामने लाता है; ‘न ही’ हिन्दी में उस संबंध को स्पष्ट रखते हुए अर्थ देता है।
- source_word: נֵזֶר
  choice: मुकुट
  rationale: यह शब्द मुकुट, राजचिह्न या अभिषिक्त/समर्पित दशा से जुड़ा हो सकता है; धन-संपत्ति के समानांतर यहाँ पद और शासन के प्रतीक ‘मुकुट’ का ठोस बिंब उपयुक्त है।
- source_word: לְדוֹר דּוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: दोहराया हुआ ‘पीढ़ी’ लगातार आने वाली पीढ़ियों का भाव देता है, जिसे यह प्रचलित हिन्दी मुहावरा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: नीזֶר का अर्थ
  choice: मुकुट—राजकीय पद, प्रतिष्ठा या शासन का प्रतीक
  alternative: राजमुकुट; अभिषेक या समर्पण
  rationale: समानांतरता में धन और वंशानुगत पद की अस्थिरता सामने आती है। ‘मुकुट’ मूल ठोस बिंब बचाता है और इसे केवल धार्मिक अभिषेक तक सीमित नहीं करता।
- issue: दूसरी पंक्ति का व्याकरणिक बल
  choice: 'पहली पंक्ति के निषेध को आगे बढ़ाने वाला कथन: ‘न ही ... बना रहता है’'
  alternative: 'प्रश्नात्मक रूप: ‘क्या मुकुट पीढ़ी-दर-पीढ़ी बना रहता है?’'
  rationale: इब्रानी पंक्ति संक्षिप्त है और אִם के कारण प्रश्नात्मक छाया संभव है। संदर्भ और समानांतरता स्थायित्व के निषेध की ओर संकेत करते हैं; हिन्दी में ‘न ही’ इसे सहजता से व्यक्त करता है, जबकि मूल आशय को अनावश्यक रूप से विस्तार नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धन-संपत्ति’ सामान्य पाठक के लिए स्पष्ट है; ‘पीढ़ी-दर-पीढ़ी’ मूल की पुनरुक्ति और कालगत विस्तार को स्वाभाविक हिन्दी में बनाए रखता है। काव्यात्मक समानांतरता के लिए पाठ दो पंक्तियों में रखा गया है।
