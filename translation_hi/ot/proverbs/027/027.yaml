  text: וְ/דֵ֤י חֲלֵ֬ב עִזִּ֗ים לְֽ֭/לַחְמְ/ךָ לְ/לֶ֣חֶם בֵּיתֶ֑/ךָ וְ֝/חַיִּ֗ים לְ/נַעֲרוֹתֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/027/027.yaml
  text: And there will be enough goats' milk for your food[a], for the food of your household[b], and sustenance for your servant girls.
translation:
  language: hi
  text: और बकरियों का दूध तुम्हारे भोजन[a] के लिए, तुम्हारे घराने के भोजन के लिए, और तुम्हारी दासियों[b] के जीवन-निर्वाह[c] के लिए पर्याप्त होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ और अगले पदबंध में शाब्दिक अर्थ ‘रोटी’ है; इस प्रसंग में उससे सामान्य रूप से भोजन या आहार-सामग्री अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘युवतियों।’ इब्रानी शब्द का अर्थ युवती अथवा स्त्री-सेविका हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘जीवन’ है, अर्थात वह सामग्री जिससे जीवन चलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדֵי
  choice: पर्याप्त होगा
  rationale: דַּי पर्याप्तता व्यक्त करता है। हिन्दी में वाक्य के अंत में ‘पर्याप्त होगा’ स्वाभाविक रूप से इस भाव को व्यक्त करता है।
- source_word: חֲלֵב עִזִּים
  choice: बकरियों का दूध
  rationale: यह संबंधवाचक पद सीधे बकरियों से प्राप्त दूध को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְלַחְמְךָ / לְלֶחֶם בֵּיתֶךָ
  choice: तुम्हारे भोजन के लिए / तुम्हारे घराने के भोजन के लिए
  rationale: לֶחֶם का शाब्दिक अर्थ ‘रोटी’ है, पर यहाँ वह व्यापक अर्थ में भोजन या आहार-सामग्री को सूचित करता है। בַּיִת इस प्रसंग में भवन नहीं, घराना है।
- source_word: וְחַיִּים
  choice: जीवन-निर्वाह
  rationale: חַיִּים शाब्दिक रूप से ‘जीवन’ है, पर घरेलू आवश्यकताओं की पूर्ति के इस प्रसंग में इसका आशय जीवन को बनाए रखने वाली सामग्री या आजीविका से है। ‘जीवन-निर्वाह’ मूल रूपक से संबंध बनाए रखता है।
- source_word: לְנַעֲרוֹתֶיךָ
  choice: तुम्हारी दासियों के लिए
  rationale: נַעֲרָה का अर्थ युवती या स्त्री-सेविका हो सकता है। घराने के लिए प्रबंध की इस सूची में ‘दासियाँ’ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
