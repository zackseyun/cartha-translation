  yaml_path: translation/ot/proverbs/027/020.yaml
  text: Sheol and Abaddon are never satisfied[b][a], and the eyes of man are never satisfied.
translation:
  language: hi
  text: अधोलोक और अबद्दोन[a] कभी तृप्त नहीं होते, और मनुष्य[b] की आँखें कभी तृप्त नहीं होतीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनाश।” हिब्रू शब्द ‘अबद्दोन’ विनाश, विनाश के स्थान, या व्यक्तिरूप में कल्पित विनाश-लोक को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मनुष्य” सामान्य अर्थ में मानवजाति, अर्थात सभी मनुष्यों, के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह शब्द मृतकों के लोक को सूचित करता है। ‘नरक’ कहने से बाद की धर्मवैज्ञानिक धारणाएँ अनावश्यक रूप से जुड़ सकती हैं, जबकि ‘अधोलोक’ हिब्रू अवधारणा की व्यापकता को अधिक अच्छी तरह बनाए रखता है।
- source_word: אֲבַדָּה
  choice: अबद्दोन
  rationale: लिप्यंतरण से ‘अधोलोक’ के साथ इसका स्थान-सदृश और कुछ हद तक व्यक्तिरूप समानांतर बना रहता है। ‘विनाश’ भी संभव अर्थ है और उसे पाद-टिप्पणी में दिया गया है।
- source_word: לֹא תִשְׂבַּעְנָה
  choice: कभी तृप्त नहीं होते / कभी तृप्त नहीं होतीं
  rationale: שׂבע का भाव भर जाने या तृप्त हो जाने का है। ‘कभी तृप्त नहीं’ कहावत की निरंतर अतृप्ति को स्वाभाविक हिन्दी में व्यक्त करता है। दोनों अर्ध-पंक्तियों में यही अभिव्यक्ति दोहराई गई है; केवल हिन्दी व्याकरण के अनुसार क्रिया-रूप बदला है।
- source_word: עֵינֵי
  choice: आँखें
  rationale: शाब्दिक बिंब को बनाए रखा गया है, क्योंकि यहाँ आँखें मनुष्य की इच्छा और लालसा का संकेत देती हैं।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन संज्ञा सामान्य अर्थ में पूरी मानवजाति का प्रतिनिधित्व करती है। ‘मनुष्य’ आधुनिक हिन्दी में इस प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: הָאָדָם का सामान्य, प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानवजाति / सभी मनुष्य
  rationale: हिब्रू में एकवचन रूप सामान्य रूप से मानव-समुदाय को सूचित करता है। ‘मनुष्य’ स्रोत के एकवचन प्रतिनिधिक रूप को बनाए रखता है, जबकि पाद-टिप्पणी स्पष्ट करती है कि कथन केवल किसी एक पुरुष के विषय में नहीं है।
- issue: שְׁאוֹל का अर्थ
  choice: अधोलोक
  alternative: शीओल / मृतकों का लोक / नरक
  rationale: ‘अधोलोक’ मृतकों के लोक का भाव रखता है और ‘नरक’ से जुड़ी बाद की, अधिक विशिष्ट धर्मवैज्ञानिक धारणाओं को पाठ में आरोपित नहीं करता।
- issue: אֲבַדָּה का स्थान-सदृश अथवा अमूर्त अर्थ
  choice: अबद्दोन
  alternative: विनाश / विनाश का लोक
  rationale: हिब्रू पद ‘अधोलोक’ के समानांतर स्थान-सदृश या व्यक्तिरूप अर्थ ले सकता है, पर ‘विनाश’ का अमूर्त अर्थ भी संभव है। मुख्य पाठ में लिप्यंतरण और पाद-टिप्पणी में वैकल्पिक अर्थ देकर इस अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत के अनुरूप गरिमापूर्ण रखी गई है। दोनों अर्ध-पंक्तियों में ‘कभी तृप्त नहीं’ की पुनरावृत्ति हिब्रू समानांतरता को बनाए रखती है।
