source:
  edition: WLC
  text: רָ֤שׁ וְ/אִ֣ישׁ תְּכָכִ֣ים נִפְגָּ֑שׁוּ מֵ֤אִיר עֵינֵ֖י שְׁנֵי/הֶ֣ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/013.yaml
  text: A poor man and an oppressor meet together[b][a]; Yahweh gives light to the eyes of both of them.
translation:
  language: hi
  text: 'निर्धन और शोषक[a] एक-दूसरे से मिलते हैं;

    याहवे उन दोनों की आँखों को प्रकाश देता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘शोषणों का मनुष्य’; इस कठिन इब्रानी पदबंध का अर्थ दमन या शोषण करनेवाला व्यक्ति हो सकता है। इसे ‘छल करनेवाला मनुष्य’ या ‘सूदखोर’ भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘आँखों को प्रकाश देना’ का अर्थ दृष्टि देना, जीवन देना, जीवित रखना या समझ प्रदान करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשׁ
  choice: निर्धन
  rationale: यह शब्द गरीब या अभावग्रस्त व्यक्ति को दर्शाता है। ‘निर्धन’ संक्षिप्त, गरिमापूर्ण और नीतिवचन की एकवचन शैली के अनुकूल है।
- source_word: אִישׁ תְּכָכִים
  choice: शोषक
  rationale: यह कठिन इब्रानी पदबंध संभवतः दमनकारी वसूली या शोषण करनेवाले व्यक्ति को दर्शाता है। ‘शोषक’ संभावित अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भव अर्थों को खुला रखती है।
- source_word: נִפְגָּשׁוּ
  choice: एक-दूसरे से मिलते हैं
  rationale: निफ़अल रूप का सामान्य अर्थ ‘मिलना’ या ‘आमना-सामना होना’ है। यह अनुवाद ठोस बिंब को बनाए रखता है और सामाजिक रूप से विपरीत दोनों व्यक्तियों की साझा स्थिति का संकेत भी दे सकता है।
- source_word: מֵאִיר
  choice: प्रकाश देता है
  rationale: हिफ़ईल कृदन्त का अर्थ प्रकाश देना या चमकाना है। आँखों के साथ यह दृष्टि, जीवन, जीवन-शक्ति या समझ देने का बोध करा सकता है; अतः मूल रूपक को सुरक्षित रखा गया है।
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: उन दोनों की आँखों को
  rationale: यह पदबंध इस बात पर बल देता है कि दोनों व्यक्ति समान रूप से याहवे पर निर्भर हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: दूसरे चरण में ‘आँखों को प्रकाश देने’ का आशय
  choice: रूपक को यथावत रखते हुए याहवे को दोनों की आँखों को प्रकाश देनेवाला बताया गया है।
  alternative: इसे विशेष रूप से दृष्टि देना, जीवन देना, जीवित रखना, या नैतिक अथवा आत्मिक समझ देना समझा जा सकता है।
  rationale: इब्रानी कथन इन अर्थों में से किसी एक को स्पष्ट रूप से सीमित नहीं करता। इसलिए अनुवाद दोनों व्यक्तियों पर याहवे की समान जीवनदायी और प्रकाशदायी क्रिया को बनाए रखता है, बिना उसके आशय को अनावश्यक रूप से निश्चित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘निर्धन’ और ‘शोषक’ सामाजिक विरोध को स्पष्ट करते हैं; ‘प्रकाश देता है’ मूल इब्रानी रूपक और उसकी अर्थगत व्यापकता को सुरक्षित रखता है।
