id: PRO.29.18
reference: Proverbs 29:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/אֵ֣ין חָ֭זוֹן יִפָּ֣רַֽע עָ֑ם וְ/שֹׁמֵ֖ר תּוֹרָ֣ה אַשְׁרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/018.yaml
  text: Where there is no vision[a], a people cast off restraint[d][c][b]; but the one who keeps the law—happy is he.
translation:
  language: hi
  text: जहाँ कोई दिव्य दर्शन[a] नहीं होता, वहाँ लोग बेलगाम हो जाते हैं[b]; पर जो व्यवस्था[c] का पालन करता है, वह सुखी[d] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात परमेश्वर से मिला प्रकाशन या भविष्यसूचक दर्शन; यहाँ केवल मानवीय योजना या महत्वाकांक्षा की बात नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “संयम छोड़ देते हैं” अथवा “निरंकुश हो जाते हैं।”
    reason: lexical_alternative
  - marker: c
    text: या “शिक्षा” अथवा “उपदेश।”
    reason: lexical_alternative
  - marker: d
    text: या “धन्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: जहाँ कोई … नहीं होता
  rationale: यह अभाव की परिस्थिति और उसके परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חָזוֹן
  choice: दिव्य दर्शन
  rationale: यह शब्द परमेश्वर से मिलने वाले प्रकाशन अथवा भविष्यसूचक दर्शन का सूचक है, केवल मानवीय योजना या महत्वाकांक्षा का नहीं। ‘दिव्य’ जोड़ने से आधुनिक हिन्दी में होने वाली गलत समझ सीमित होती है।
- source_word: יִפָּרַע
  choice: बेलगाम हो जाते हैं
  rationale: निफ़अल रूप का भाव नियंत्रण या संयम से छूट जाने, निरंकुश होने अथवा उच्छृंखल हो जाने का है; यहाँ ‘नाश हो जाते हैं’ अर्थ समर्थित नहीं है।
- source_word: עָם
  choice: लोग
  rationale: इब्रानी में यह एकवचन सामूहिक संज्ञा है। सामान्य नीति-वचन के रूप में ‘लोग’ हिन्दी में स्वाभाविक रूप से उसी सामूहिक अर्थ को व्यक्त करता है।
- source_word: וְשֹׁמֵר
  choice: पर जो … का पालन करता है
  rationale: कृदंत किसी व्यक्ति की नियमित विशेषता बताता है। समानाधिकरणी वाव को दोनों परिणामों के विरोध के कारण ‘पर’ कहा गया है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: तोरा का अर्थ शिक्षा या निर्देश भी हो सकता है, पर यहाँ उसमें परमेश्वर की अधिकारपूर्ण नैतिक व्यवस्था का भार है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: אַשְׁרֵהוּ
  choice: वह सुखी है
  rationale: यह ज्ञान-साहित्य की धन्यता-सूचक अभिव्यक्ति है। ‘सुखी’ मूल के कल्याण और आनंद के भाव को सरल आधुनिक हिन्दी में रखता है।
theological_decisions:
- issue: חָזוֹן का आशय
  choice: इसे परमेश्वर से प्राप्त दिव्य या भविष्यसूचक दर्शन माना गया है।
  alternative: सामान्य सामाजिक दिशा, नेतृत्व की योजना या मानवीय महत्वाकांक्षा
  rationale: बाइबिलीय इब्रानी में חָזוֹן सामान्यतः नबूवत के माध्यम से मिलने वाले प्रकाशन को दर्शाता है। इसलिए नीति-वचन का आशय केवल संगठनात्मक लक्ष्य निर्धारित करना नहीं है।
- issue: תּוֹרָה का दायरा
  choice: मुख्य पाठ में ‘व्यवस्था’
  alternative: ‘शिक्षा’ या ‘उपदेश’
  rationale: शब्द की व्यापक शिक्षात्मक संभावना बनाए रखते हुए प्रसंग में उसकी ईश्वरीय और नैतिक अधिकारिता को मुख्य पाठ में व्यक्त किया गया है।
- issue: אַשְׁרֵהוּ में एकवचन पुरुषवाचक रूप
  choice: ‘जो … करता है, वह सुखी है’ के द्वारा प्रतिनिधिक एकवचन रखा गया है।
  alternative: बहुवचन ‘जो लोग … वे धन्य हैं’
  rationale: मूल का एकवचन सुरक्षित है; हिन्दी का ‘जो … वह’ इस सामान्य कथन को किसी एक लिंग तक सीमित किए बिना स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दिव्य दर्शन’ पारंपरिक ‘दर्शन’ को बनाए रखते हुए उसके प्रकाशनात्मक अर्थ को स्पष्ट करता है। दोनों अर्ध-पंक्तियों का सामूहिक अव्यवस्था और व्यक्तिगत आज्ञापालन का विरोध ‘पर’ से उभारा गया है।
