base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/025.yaml
  text: The fear of man lays a snare[b][a], but whoever trusts in Yahweh will be set on high.
translation:
  language: hi
  text: लोगों से डरना फंदा बन जाता है[a], पर जो याहवे पर भरोसा रखता है, उसे ऊँचे स्थान पर रखा जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: ‘मनुष्य का भय फंदा देता है।’ आशय है कि लोगों से डरना स्वयं एक फंदा बन जाता है।'
    reason: lexical_alternative
  - marker: b
    text: 'अर्थात वह सुरक्षित रहेगा या उसकी रक्षा होगी; इब्रानी में शाब्दिक चित्र है: ‘ऊँचे स्थान पर रखा जाएगा।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְדַּת אָדָם
  choice: लोगों का डर
  rationale: यह पदबंध मनुष्यों से होने वाले भय या आतंक को व्यक्त करता है। ‘लोगों का डर’ आधुनिक हिन्दी में स्वाभाविक है और सामान्य मानवीय संदर्भ को स्पष्ट रखता है।
- source_word: יִתֵּן מוֹקֵשׁ
  choice: फंदा बिछाता है
  rationale: शाब्दिक रूप से ‘फंदा देता है’; हिन्दी मुहावरे में ‘फंदा बिछाता है’ जाल में फँसाने की मूल रूपक-छवि को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וּבוֹטֵחַ
  choice: पर जो ... भरोसा रखता है
  rationale: कृदंत का अर्थ सामान्य रूप से किसी भी भरोसा रखने वाले व्यक्ति से है। यह रूप हिन्दी में स्वाभाविक और सर्वसामान्य है।
- source_word: בַּיהוָה
  choice: याहवे पर
  rationale: यह इब्रानी विशिष्ट नाम יהוה का लिप्यंतरण है और वाचा के नाम को सामान्य उपाधि से नहीं बदलता।
- source_word: יְשֻׂגָּב
  choice: उसे ऊँचे स्थान पर रखा जाएगा
  rationale: यह निष्क्रिय क्रिया किसी को पहुँच से बाहर ऊँचाई पर रखे जाने और इस प्रकार सुरक्षित होने की रूपक-छवि व्यक्त करती है। मुख्य पाठ में ऊँचाई की छवि सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: אָדָם और בּוֹטֵחַ का सामान्य मानवीय आशय
  choice: ‘लोगों’ और ‘जो ... भरोसा रखता है’
  alternative: ‘मनुष्य’ और ‘भरोसा रखने वाला’
  rationale: कहावत का आशय किसी एक पुरुष तक सीमित नहीं, बल्कि लोगों से डरने और याहवे पर भरोसा रखने वाले किसी भी व्यक्ति से है। हिन्दी रूप इसी सामान्य दायरे को सहजता से व्यक्त करता है।
- issue: יְשֻׂגָּב में ऊँचाई और सुरक्षा का संबंध
  choice: मुख्य पाठ में ‘ऊँचे स्थान पर रखा जाएगा’, टिप्पणी में सुरक्षा का निहितार्थ
  alternative: ‘सुरक्षित रहेगा’ या ‘उसकी रक्षा होगी’
  rationale: क्रिया की ऊँचाई वाली मूल रूपक-छवि को मिटाए बिना उसके सुरक्षा-संबंधी निहितार्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सुलभ रखी गई है। ‘फंदा बिछाता है’ तथा ‘ऊँचे स्थान पर रखा जाएगा’ समानांतर रूपकात्मक बल बनाए रखते हैं; पादटिप्पणियाँ शाब्दिक रूप और निहित अर्थ स्पष्ट करती हैं।
