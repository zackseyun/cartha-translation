  yaml_path: translation/ot/proverbs/029/015.yaml
  text: A rod and reproof give wisdom[a], but a boy left to himself brings shame to his mother.
translation:
  language: hi
  text: छड़ी और डाँट बुद्धि देती हैं, पर अपने हाल पर छोड़ा हुआ लड़का[a] अपनी माँ को लज्जित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना रोक-टोक छोड़ा हुआ” अथवा “अनुशासन के बिना छोड़ा हुआ।” इब्रानी में इसका शाब्दिक भाव ऐसे लड़के का है जिसे “खुला छोड़ दिया गया” या “अकेला छोड़ दिया गया” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁבֶט
  choice: अनुशासन की छड़ी
  rationale: शब्द का मूल ठोस चित्र ‘छड़ी’ है; प्रसंग में यह अनुशासन के साधन को दर्शाता है। ‘अनुशासन की’ जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है, जबकि छड़ी का मूल बिंब बना रहता है।
- source_word: וְתוֹכַחַת
  choice: और डाँट
  rationale: यह मौखिक सुधार, फटकार या ताड़ना को दर्शाता है। ‘डाँट’ सरल, वर्तमान और प्रसंगानुकूल है तथा छड़ी के साथ शारीरिक और मौखिक अनुशासन की जोड़ी बनाए रखता है।
- source_word: יִתֵּן חָכְמָה
  choice: बुद्धि देती हैं
  rationale: मूल अभिव्यक्ति का सीधा अर्थ ‘बुद्धि देना’ है। हिन्दी में संयुक्त कर्ता के कारण बहुवचन क्रिया स्वाभाविक है।
- source_word: נַעַר
  choice: लड़का
  rationale: यह शब्द बालक से युवक तक का अर्थ दे सकता है। माता के अधीन अनुशासन के इस प्रसंग में ‘लड़का’ पुल्लिंग एकवचन और आश्रित अवस्था दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְשֻׁלָּח
  choice: अपने हाल पर छोड़ा हुआ
  rationale: שלח का यह कर्मवाच्य रूप मूलतः ‘छोड़ दिया गया’ या ‘खुला छोड़ दिया गया’ का भाव रखता है। यहाँ इसका अर्थ ऐसे लड़के से है जिसे रोकने, दिशा देने या अनुशासित करने के लिए छोड़ दिया गया हो; ‘अपने हाल पर छोड़ा हुआ’ उस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵבִישׁ
  choice: लज्जित करता है
  rationale: बוש का हिफ़ील रूप किसी को लज्जा या अपमान में डालने का कारण बनने को व्यक्त करता है। ‘लज्जित करता है’ उसके कारक भाव को संक्षेप में बनाए रखता है।
- source_word: אִמּוֹ
  choice: अपनी माँ को
  rationale: तीसरे पुरुष पुल्लिंग एकवचन प्रत्यय लड़के की माँ की ओर संकेत करता है। हिन्दी में उसी वाक्य के कर्ता से संबंध दिखाने के लिए ‘अपनी माँ’ अधिक स्वाभाविक है।
