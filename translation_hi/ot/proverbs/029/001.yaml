translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘गर्दन अकड़ाता है’ मूल शारीरिक रूपक को सुरक्षित रखता है; ‘उपचार’ शारीरिक, सामाजिक या नैतिक परिणाम में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
