source:
  edition: WLC
  text: אִ֣ישׁ תּ֭וֹכָחוֹת מַקְשֶׁה עֹ֑רֶף פֶּ֥תַע יִ֝שָּׁבֵ֗ר וְ/אֵ֣ין מַרְפֵּֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/001.yaml
  text: A man often reproved[a], who stiffens his neck, will suddenly be broken beyond healing.
translation:
  language: hi
  text: जिस मनुष्य को बार-बार डाँटा जाता है[a], फिर भी वह अपनी गर्दन अकड़ाता है, वह अचानक ऐसा टूट जाएगा कि उसका कोई उपचार न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-सी फटकारों के बाद भी जो मनुष्य अपनी गर्दन अकड़ाता है, वह अचानक टूट जाएगा, और कोई उपचार न होगा।”
    reason: ‘फटकारों का मनुष्य’ जैसी हिब्रू रचना को बार-बार डाँटे जाने वाले व्यक्ति के रूप में या अनेक फटकारों के बाद भी हठ करने वाले व्यक्ति के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: אִישׁ
  choice: जिस मनुष्य को
  rationale: एकवचन पुल्लिंग संज्ञा नीतिवचन में एक प्रतिनिधि व्यक्ति को प्रस्तुत करती है; ‘मनुष्य’ स्रोत के रूप और सामान्य मानवीय प्रयोग दोनों के अनुकूल है।
- source_word: תּוֹכָחוֹת
  choice: बार-बार डाँटा जाता है
  rationale: बहुवचन संज्ञा अनेक बार मिली फटकार या ताड़ना का संकेत देती है। यह हिन्दी में स्वाभाविक रूप से आवृत्ति व्यक्त करती है।
- source_word: מַקְשֶׁה עֹרֶף
  choice: फिर भी वह अपनी गर्दन अकड़ाता है
  rationale: हिब्रू का शारीरिक रूपक हठपूर्वक विरोध करने को दर्शाता है। ‘गर्दन अकड़ाता है’ हिन्दी में परिचित और स्पष्ट रूपक है; ‘फिर भी’ बार-बार की फटकार के बावजूद जारी हठ को सामने लाता है।
- source_word: פֶּתַע
  choice: अचानक
  rationale: यह क्रिया-विशेषण आने वाले टूटने की आकस्मिकता बताता है।
- source_word: יִשָּׁבֵר
  choice: टूट जाएगा
  rationale: निफ़अल रूप के निष्क्रिय भाव और टूटने के रूपक को बनाए रखता है, बिना विनाश के प्रकार को सीमित किए।
- source_word: וְאֵין מַרְפֵּא
  choice: उसका कोई उपचार न होगा
  rationale: यह मूल वाक्यांश ‘और कोई चंगाई/उपचार नहीं’ का निकट, स्वाभाविक हिन्दी रूप है और परिणाम की अंतिमता बनाए रखता है।
