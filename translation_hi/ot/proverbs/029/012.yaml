  yaml_path: translation/ot/proverbs/029/012.yaml
  text: If a ruler listens to a lying word, all his servants become wicked.
translation:
  language: hi
  text: जो शासक झूठी बात पर ध्यान देता है, उसके सभी सेवक दुष्ट हो जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֹשֵׁל
  choice: शासक
  rationale: यह सामान्य रूप से शासन करने वाले व्यक्ति को दर्शाता है; ‘शासक’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: מַקְשִׁיב עַל
  choice: पर कान लगाता है
  rationale: यह केवल सुन पड़ने के बजाय ध्यान देकर सुनने या स्वीकार करने का भाव व्यक्त करता है।
- source_word: דְּבַר שָׁקֶר
  choice: झूठी बात
  rationale: शाब्दिक रूप से ‘झूठ का वचन/मामला’; ‘झूठी बात’ हिन्दी में स्वाभाविक रहते हुए अर्थ सुरक्षित रखती है।
- source_word: מְשָׁרְתָיו
  choice: उसके सभी सेवक
  rationale: यह शासक की सेवा में नियुक्त लोगों या दरबारियों को दर्शाता है; ‘सेवक’ मूल शब्द के निकट है।
- source_word: רְשָׁעִים
  choice: दुष्ट हो जाते हैं
  rationale: व्यंजनरहित पाठ केवल ‘दुष्ट’ कहता है और काल/परिणाम को स्पष्ट नहीं करता। सन्दर्भगत नीति-वचन के कारण हिन्दी में परिणामसूचक ‘हो जाते हैं’ सहज है, पर वैकल्पिक अवस्थासूचक अर्थ भी सम्भव है।
theological_decisions:
- issue: क्या दूसरी पंक्ति वर्तमान दशा बताती है या शासक के व्यवहार का परिणाम?
  choice: दुष्ट हो जाते हैं
  alternative: दुष्ट हैं
  rationale: इब्रानी नामवाचक वाक्य में क्रिया व्यक्त नहीं है। नीति-वचन का कारण-परिणाम सम्बन्ध परिणामसूचक अनुवाद का समर्थन करता है, यद्यपि ‘दुष्ट हैं’ भी व्याकरणतः सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त नीति-वचन शैली और दोनों पंक्तियों का कारण-परिणाम सम्बन्ध बनाए रखा गया है।
