  text: בִּ/רְב֣וֹת רְ֭שָׁעִים יִרְבֶּה פָּ֑שַׁע וְ֝/צַדִּיקִ֗ים בְּֽ/מַפַּלְתָּ֥/ם יִרְאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/016.yaml
  text: When the wicked increase[a], transgression increases; but the righteous will look upon their downfall.
translation:
  language: hi
  text: जब दुष्टों की संख्या बढ़ती है, तब अपराध बढ़ता है; पर धर्मी उनका पतन देखेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें गिरते हुए देखेंगे।” इब्रानी क्रिया का सामान्य अर्थ “देखना” है, और संज्ञा का अनुवाद “पतन” या “गिरना” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת רְשָׁעִים
  choice: जब दुष्टों की संख्या बढ़ती है
  rationale: בְּ के साथ רבה का infinitive construct परिस्थितिजन्य/कालवाचक उपवाक्य बनाता है। हिंदी में यह रूप स्वाभाविक है और स्पष्ट करता है कि दुष्ट लोग संख्या में बढ़ रहे हैं।
- source_word: יִרְבֶּה
  choice: बढ़ता है
  rationale: रבה की पुनरावृत्ति को हिंदी में भी ‘बढ़ती है … बढ़ता है’ द्वारा बनाए रखा गया है।
- source_word: פָּשַׁע
  choice: अपराध
  rationale: यह शब्द उल्लंघन और विद्रोही दुष्कर्म का भाव रखता है। ‘अपराध’ सामान्य आधुनिक हिंदी में सुबोध है और केवल अस्पष्ट ‘बुराई’ की अपेक्षा मूल के उल्लंघन-संबंधी अर्थ को बेहतर रखता है।
- source_word: וְצַדִּיקִים
  choice: पर धर्मी
  rationale: וְ यहाँ दोनों पंक्तियों के बीच विरोध प्रकट करता है; इसलिए ‘पर’ स्वाभाविक है। צַדִּיקִים के लिए ‘धर्मी’ ज्ञान-साहित्य में प्रचलित और संक्षिप्त है।
- source_word: בְּמַפַּלְתָּם יִרְאוּ
  choice: उनका पतन देखेंगे
  rationale: ראה का मूल अर्थ ‘देखना’ और מַפָּלָה का अर्थ ‘पतन/गिरावट’ है। यह सीधा हिंदी रूप किसी अतिरिक्त हर्ष, प्रतिशोध या विजय-भाव को नहीं जोड़ता।
theological_decisions:
- issue: בְּמַפַּלְתָּם में बहुवचन प्रत्यय का संदर्भ
  choice: ‘उनका’ दुष्टों की ओर संकेत करता है
  alternative: इसे सामान्य रूप से गिरने वालों की ओर संकेत मानना
  rationale: पहली पंक्ति के ‘दुष्ट’ निकटतम और अर्थ की दृष्टि से सबसे संगत पूर्वपद हैं; नीति-वचन का विरोध दुष्टों की बढ़ती संख्या और उनके अंतिम पतन के बीच है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीति-वचन शैली रखी गई है। ‘दुष्टों की संख्या’ जोड़कर רבה के संख्या में बढ़ने वाले आशय को स्वाभाविक हिंदी में स्पष्ट किया गया है; दूसरी पंक्ति में मूल की संक्षिप्तता और भावगत तनाव सुरक्षित हैं।
