  text: A king who judges the poor with truth—his throne will be established forever[a].
translation:
  language: hi
  text: जो राजा गरीबों का सच्चाई से न्याय करता है—उसका सिंहासन सदा स्थिर रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गरीबों का न्याय सत्यनिष्ठा से करता है,” अथवा “गरीबों का न्याय न्यायपूर्वक करता है।” इब्रानी पदबंध “सच्चाई से” न्याय में सत्यनिष्ठा, विश्वासयोग्यता या न्यायपूर्ण व्यवहार का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: जो राजा
  rationale: यह कहावत किसी विशेष राजा की नहीं, बल्कि सामान्य सिद्धांत की बात करती है। सम्बन्धवाचक रचना ‘जो राजा’ हिन्दी में सहभागी שׁוֹפֵט के साथ स्वाभाविक है।
- source_word: שׁוֹפֵט
  choice: न्याय करता है
  rationale: यह न्यायिक कार्य को स्पष्ट रखता है और व्यापक ‘शासन करता है’ की अपेक्षा मूल अर्थ के अधिक निकट है।
- source_word: בֶּאֱמֶת
  choice: सच्चाई से
  rationale: אֱמֶת में सत्य, विश्वसनीयता और निष्ठापूर्ण न्याय के अर्थ समाहित हो सकते हैं। ‘सच्चाई से’ मूल अभिव्यक्ति को बनाए रखते हुए इन संभावित अर्थों को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: דַּלִּים आर्थिक रूप से गरीब तथा सामाजिक रूप से दुर्बल लोगों का संकेत दे सकता है। इस राजकीय न्याय के प्रसंग में ‘गरीबों’ सबसे स्वाभाविक मुख्य अनुवाद है।
- source_word: כִּסְאוֹ
  choice: उसका सिंहासन
  rationale: ‘सिंहासन’ मूल राजकीय बिंब को बनाए रखता है और स्थायी शासन का लाक्षणिक अर्थ भी व्यक्त करता है।
- source_word: לָעַד
  choice: सदा
  rationale: यह दीर्घस्थायी या चिरस्थायी स्थिरता की पारंपरिक अभिव्यक्ति है और हिन्दी कहावत की शैली में स्वाभाविक है।
- source_word: יִכּוֹן
  choice: स्थिर रहेगा
  rationale: निफ़अल रूप स्थापित, दृढ़ या सुरक्षित होने का परिणाम बताता है। ‘स्थिर रहेगा’ सिंहासन के बिंब के साथ सहज है और स्थायित्व को स्पष्ट करता है।
theological_decisions:
- issue: नीतिवचन साहित्य में לָעַד का बल
  choice: ‘सदा’ के रूप में अनुवादित, जो राजकीय शासन की चिरस्थायी या दीर्घस्थायी दृढ़ता की पारंपरिक अभिव्यक्ति है।
  alternative: ‘बहुत समय तक’
  rationale: मूल शब्द को कमजोर किए बिना नीतिवचन की सामान्य कथन-शैली को उसके साहित्यिक प्रसंग में समझने दिया गया है; इसे हर परिस्थिति के लिए तकनीकी या तत्वमीमांसक गारंटी नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘गरीबों का न्याय करना’ मूल न्यायिक संरचना को सुरक्षित रखता है; डैश दोनों अर्ध-पंक्तियों के परिणामात्मक सम्बन्ध को उभारता है।
