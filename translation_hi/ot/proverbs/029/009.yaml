  text: אִֽישׁ חָכָ֗ם נִ֭שְׁפָּט אֶת אִ֣ישׁ אֱוִ֑יל וְ/רָגַ֥ז וְ֝/שָׂחַ֗ק וְ/אֵ֣ין נָֽחַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/009.yaml
  text: If a wise man has a dispute with a foolish man[a], whether he rages or laughs[b], there is no rest.
translation:
  language: hi
  text: यदि बुद्धिमान पुरुष मूर्ख पुरुष से विवाद करे[a], तो चाहे वह क्रोध करे या हँसे[b], चैन नहीं मिलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि बुद्धिमान पुरुष किसी मूर्ख से उलझे, तो मूर्ख चाहे क्रोध करे या हँसे, चैन नहीं मिलता।” इब्रानी में यह स्पष्ट नहीं है कि क्रोध करने या हँसने वाला बुद्धिमान है या मूर्ख; प्रसंग के आधार पर बहुत-से व्याख्याकार इसे मूर्ख मानते हैं।
    reason: alternative_reading
  - marker: b
    text: यहाँ “हँसे” का अर्थ उपहास करना या खिल्ली उड़ाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חָכָם
  choice: बुद्धिमान पुरुष
  rationale: इब्रानी में संज्ञा और विशेषण दोनों पुल्लिंग एकवचन हैं। ‘बुद्धिमान पुरुष’ इस रूप को बनाए रखता है, यद्यपि नीतिवचन में ऐसा एकवचन प्रायः प्रतिनिधिक अर्थ भी रखता है।
- source_word: נִשְׁפָּט אֶת
  choice: से विवाद करे
  rationale: यहाँ שפט का निफ़ाल रूप किसी के साथ मुकदमे या विवाद में पड़ने का भाव देता है; अनिवार्यतः न्यायाधीश बनने या औपचारिक अदालत में जाने का नहीं।
- source_word: אִישׁ אֱוִיל
  choice: मूर्ख पुरुष
  rationale: यह चुनाव ‘बुद्धिमान पुरुष’ के साथ मूल का समानांतर रूप बनाए रखता है और אִישׁ के स्पष्ट पुल्लिंग रूप को दर्शाता है।
- source_word: וְרָגַז
  choice: क्रोध करे
  rationale: רגז उत्तेजित या क्रुद्ध होने का अर्थ दे सकता है। कर्ता मूल में अस्पष्ट है, इसलिए हिन्दी में भी ‘वह’ को किसी एक पक्ष से स्पष्टतः नहीं जोड़ा गया।
- source_word: וְשָׂחַק
  choice: या हँसे
  rationale: שׂחק का मूल अर्थ ‘हँसना’ है। प्रसंग में उपहास की छाया संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וְאֵין נָחַת
  choice: चैन नहीं मिलता
  rationale: נחת शांति, विश्राम या ठहराव को व्यक्त करता है। ‘चैन नहीं मिलता’ स्वाभाविक आधुनिक हिन्दी में अशांति और समाधान के अभाव—दोनों का संकेत देता है।
theological_decisions:
- issue: क्रोध करने या हँसने वाले व्यक्ति की पहचान
  choice: मुख्य पाठ में कर्ता को अस्पष्ट रखा गया है
  alternative: मूर्ख ही क्रोध करता या हँसता है
  rationale: इब्रानी क्रियाएँ पुल्लिंग एकवचन हैं, पर उनका कर्ता स्पष्ट नहीं किया गया। प्रसंग के आधार पर मूर्ख को कर्ता मानना संभव है, किंतु मुख्य पाठ में ऐसा निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पुरुष’ मूल के पुल्लिंग एकवचन और दोनों पक्षों के समानांतर विन्यास को सुरक्षित रखता है। वाक्य को स्वाभाविक बनाने के लिए ‘चैन नहीं मिलता’ चुना गया है; सर्वनाम की संदर्भगत अस्पष्टता जानबूझकर बनाए रखी गई है।
