  yaml_path: translation/ot/proverbs/029/026.yaml
  text: Many seek the face of a ruler, but from the LORD comes a man's justice.
translation:
  language: hi
  text: बहुत-से लोग शासक की कृपा चाहते हैं, पर मनुष्य को न्याय यहोवा से मिलता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर मनुष्य के लिए न्यायपूर्ण निर्णय यहोवा की ओर से आता है।”
    reason: מִשְׁפַּט אִישׁ का अर्थ व्यक्ति को मिलने वाला न्याय या उसके विषय में दिया गया न्यायपूर्ण निर्णय—दोनों हो सकता है।
lexical_decisions:
- source_word: מְבַקְשִׁים פְּנֵי
  choice: कृपा चाहते हैं
  rationale: शाब्दिक अर्थ ‘मुख खोजते हैं’ है; इस मुहावरे का आशय शासक तक पहुँच और उसका अनुग्रह पाना है। ‘कृपा चाहते हैं’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מוֹשֵׁל
  choice: शासक
  rationale: यह सामान्य रूप से शासन या अधिकार रखने वाले व्यक्ति को दर्शाता है; ‘शासक’ मूल की व्यापकता बनाए रखता है।
- source_word: מִשְׁפַּט אִישׁ
  choice: मनुष्य को न्याय
  rationale: इस संक्षिप्त इब्रानी पदबंध का आशय किसी व्यक्ति के पक्ष में उचित निर्णय अथवा उसे मिलने वाला न्याय हो सकता है। यह रूप हिन्दी में स्वाभाविक है और न्याय के अंतिम स्रोत पर बल बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: न्याय का अंतिम स्रोत
  choice: ‘मनुष्य को न्याय यहोवा से मिलता है’
  alternative: ‘मनुष्य का निर्णय यहोवा की ओर से होता है’
  rationale: מִשְׁפַּט न्याय, न्यायोचित फैसला या निर्णय को सूचित कर सकता है। मुख्य पाठ न्याय की धारणा रखता है, जबकि टिप्पणी मूल की संभावित न्यायिक अर्थ-छाया बताती है; इस प्रकार शासक के प्रभाव के विपरीत यहोवा की सर्वोच्चता बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुख खोजना’ जैसे अस्पष्ट शाब्दिक मुहावरे के स्थान पर उसका प्रसंगगत अर्थ दिया गया है, जबकि दूसरे अर्धपद की वास्तविक अर्थ-विस्तार को पाद-टिप्पणी में सुरक्षित रखा गया है।
