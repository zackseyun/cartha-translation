  yaml_path: translation/ot/proverbs/029/008.yaml
  text: Mockers inflame a city[b][a], but wise men turn away anger.
translation:
  language: hi
  text: उपहास करनेवाले नगर को भड़का देते हैं[a], पर बुद्धिमान क्रोध को टाल देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर में आग भड़का देते हैं”; इब्रानी क्रिया रूपकात्मक है और आग सुलगाने या नागरिक अशांति भड़काने का बिंब जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्रोध को वापस मोड़ देते हैं” या “क्रोध को फेर देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי לָצוֹן
  choice: ठट्ठा करनेवाले
  rationale: यह रचना शाब्दिक रूप से ‘ठट्ठे के लोग’ है और नीतिवचन में उन लोगों के चरित्र को दर्शाती है जो उपहास और तिरस्कार से अशांति पैदा करते हैं। ‘ठट्ठा करनेवाले’ आधुनिक हिंदी में सहज और स्पष्ट है।
- source_word: יָפִיחוּ
  choice: आग भड़काते हैं
  rationale: यह क्रिया यहाँ रूपक रूप में किसी नगर में अशांति या कलह को हवा देकर भड़काने का भाव रखती है। ‘आग भड़काते हैं’ मूल बिंब और नागरिक उथल-पुथल, दोनों को संप्रेषित करता है।
- source_word: קִרְיָה
  choice: नगर
  rationale: इसका अर्थ नगर या शहर है। ‘नगर’ संक्षिप्त, गरिमापूर्ण और ज्ञान-साहित्य की शैली के अनुकूल है।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है, पर यहाँ वह चरित्र-वर्ग को सामान्य रूप से व्यक्त करता है। हिंदी में ‘बुद्धिमान’ स्वाभाविक रूप से सामूहिक बहुवचन विषय का काम करता है और अनावश्यक रूप से लिंग को सीमित नहीं करता।
- source_word: יָשִׁיבוּ
  choice: शांत कर देते हैं
  rationale: मूल क्रिया का बुनियादी भाव ‘वापस मोड़ना’ है; क्रोध के साथ इसका अर्थ क्रोध को हटा देना, फेर देना या शांत करना है। मुख्य पाठ में ‘शांत कर देते हैं’ सर्वाधिक स्वाभाविक है, जबकि वैकल्पिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: אָף
  choice: क्रोध
  rationale: यद्यपि शब्द का मूल शारीरिक अर्थ ‘नाक’ है, इस प्रयोग में इसका स्थापित अर्थ क्रोध या रोष है। ‘क्रोध’ स्पष्ट और गरिमापूर्ण हिंदी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली रखी गई है। पहले अर्धांश में आग का रूपक सुरक्षित है और दूसरे में सहज हिंदी को प्राथमिकता देते हुए मूल ‘वापस मोड़ने’ का बिंब पादटिप्पणी में दिया गया है।
