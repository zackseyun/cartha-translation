  text: בִּ֭/דְבָרִים לֹא יִוָּ֣סֶר עָ֑בֶד כִּֽי יָ֝בִ֗ין וְ/אֵ֣ין מַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/019.yaml
  text: A servant is not corrected by words alone[a], for though he understands[b], there is no response.
translation:
  language: hi
  text: केवल बातों से ग़ुलाम[a] को सुधारा नहीं जा सकता, क्योंकि वह समझता तो है, पर कोई प्रतिक्रिया नहीं देता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार ‘सेवक’, ‘दास’ या ‘ग़ुलाम’ हो सकता है; यहाँ ‘ग़ुलाम’ उसकी अधीन और बंधुआ स्थिति को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और कोई उत्तर नहीं।” इसका संकेत मौखिक उत्तर न देने या समझी हुई बात के अनुसार कार्य न करने—दोनों में से किसी की ओर हो सकता है।
    reason: ambiguity
lexical_decisions:
- source_word: בִּדְבָרִים
  choice: केवल बातों से
  rationale: בְּ का प्रयोग साधन के अर्थ में है। मूल में ‘केवल’ स्पष्ट शब्द के रूप में नहीं है, पर कहावत का आशय है कि मात्र मौखिक समझाइश प्रभावी नहीं होती; हिन्दी में यह भाव स्वाभाविक रूप से ‘केवल बातों से’ व्यक्त होता है।
- source_word: יִוָּסֶר
  choice: सुधारा नहीं जा सकता
  rationale: יסר का निफ़अल रूप अनुशासित या सुधारे जाने का भाव देता है। सम्भाव्यता वाला हिन्दी प्रयोग कहावत के सामान्य कथन को स्वाभाविक बनाता है और दंडात्मक अनुशासन को अनावश्यक रूप से प्रमुख नहीं करता।
- source_word: עָבֶד
  choice: ग़ुलाम
  rationale: עָבֶד यहाँ अधीन और बंधुआ सामाजिक स्थिति वाले व्यक्ति को सूचित करता है। ‘ग़ुलाम’ आधुनिक हिन्दी में इस स्थिति को ‘सेवक’ या ‘दास’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: כִּי יָבִין
  choice: क्योंकि समझने पर भी
  rationale: כִּי पहले कथन का कारण प्रस्तुत करता है, जबकि आगे का विरोध ‘समझने पर भी’ का रियायती भाव उत्पन्न करता है। यह हिन्दी में दोनों संबंधों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֵין מַעֲנֶה
  choice: वह कोई प्रतिक्रिया नहीं देता
  rationale: शाब्दिक अर्थ ‘और कोई उत्तर नहीं’ है। ‘प्रतिक्रिया’ मौखिक उत्तर और अपेक्षित आचरण—दोनों की सम्भावना खुली रखती है।
theological_decisions:
- issue: ग़ुलाम के प्रति अनुशासन का स्वरूप
  choice: पद को प्राचीन सामाजिक और व्यावहारिक कथन के रूप में प्रस्तुत किया गया है, बिना किसी विशेष दंड-पद्धति को जोड़े।
  alternative: इसे शारीरिक दंड का स्पष्ट समर्थन मानकर अनुवाद करना।
  rationale: मूल केवल यह कहता है कि शब्द प्रभावी नहीं होते; वह अगले उपाय का नाम नहीं बताता। अनुवाद को उस अनकहे उपाय को निर्धारित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘केवल बातों से’ कहावत के विरोध को स्पष्ट करता है, जबकि ‘प्रतिक्रिया’ अंतिम खंड की वास्तविक अस्पष्टता बनाए रखती है।
