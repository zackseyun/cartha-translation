  yaml_path: translation/ot/proverbs/029/004.yaml
  text: By justice a king establishes a land[b][a], but a man of bribes tears it down.
translation:
  language: hi
  text: 'न्याय से राजा देश को स्थिर करता है,

    पर घूस लेने वाला[a] उसे उजाड़ देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘भेंटों/चढ़ावों का व्यक्ति’ भी हो सकता है। इब्रानी शब्द भेंट, चढ़ावा या वसूली को दर्शा सकता है; यहाँ संदर्भ में सम्भवतः भ्रष्ट भुगतान, अर्थात घूस, अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶלֶךְ
  choice: राजा
  rationale: नीतिवचन की सामान्य, प्रतिनिधिक शैली में यह किसी विशेष राजा के बजाय शासक-वर्ग के एक सदस्य को दर्शाता है; हिन्दी में बिना अनावश्यक लेख के ‘राजा’ स्वाभाविक है।
- source_word: בְּמִשְׁפָּט
  choice: न्याय से
  rationale: מִשְׁפָּט यहाँ न्यायपूर्ण निर्णय और शासन-व्यवस्था को सूचित करता है; ‘न्याय से’ साधन और रीति दोनों का भाव संक्षेप में देता है।
- source_word: יַעֲמִיד
  choice: स्थिर करता है
  rationale: עמד के हिफ़ील रूप में किसी वस्तु को खड़ा रखने या दृढ़ करने का कारक भाव है; शासन के संदर्भ में ‘स्थिर करता है’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָרֶץ
  choice: देश
  rationale: यहाँ शब्द पूरे पृथ्वी-जगत के बजाय राजा के अधीन भूभाग या राज्य को दर्शाता है; आधुनिक हिन्दी में ‘देश’ सामान्य पाठक के लिए सहज है।
- source_word: אִישׁ תְּרוּמוֹת
  choice: घूस लेनेवाला
  rationale: शाब्दिक रूप ‘भेंटों/चढ़ावों का व्यक्ति’ हो सकता है, पर विरोधी समानांतरता में ऐसे भुगतान स्वीकार कर भ्रष्ट शासन करनेवाला व्यक्ति अभिप्रेत जान पड़ता है। ‘घूस लेनेवाला’ हिन्दी में अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शब्द की व्यापकता सुरक्षित रखती है।
- source_word: יֶהֶרְסֶנָּה
  choice: उसे उजाड़ देता है
  rationale: הרס ढा देने या नष्ट करने की सशक्त छवि रखता है, और स्त्रीलिंग प्रत्यय אָרֶץ की ओर लौटता है। देश के संदर्भ में ‘उजाड़ देता है’ स्वाभाविक रहते हुए विनाश का भाव बनाए रखता है।
