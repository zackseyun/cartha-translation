  text: חָזִ֗יתָ אִ֭ישׁ אָ֣ץ בִּ/דְבָרָ֑י/ו תִּקְוָ֖ה לִ/כְסִ֣יל מִמֶּֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/020.yaml
  text: Do you see a man who is hasty in his words? There is more hope for a fool than for him[a].
translation:
  language: hi
  text: क्या तुमने ऐसे मनुष्य को देखा है जो अपनी बातों में उतावला है? मूर्ख के लिए उससे अधिक आशा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने ऐसे मनुष्य को देखा है जो अपनी बातों में उतावला है—मूर्ख के लिए उससे अधिक आशा है।” आरम्भ का इब्रानी पूर्ण क्रियारूप अलंकारिक अवलोकन या सीधे प्रश्न, दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: क्या तुमने ... देखा है
  rationale: यह חזה का क़ाल पूर्ण, द्वितीय पुरुष एकवचन रूप है। नीतिवचन की अलंकारिक अवलोकन-शैली को स्वाभाविक हिन्दी में प्रश्न के रूप में व्यक्त करते हुए प्रत्यक्ष सम्बोधन बनाए रखा गया है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी शब्द एकवचन पुल्लिंग है। ‘मनुष्य’ आधुनिक, गरिमापूर्ण हिन्दी में प्रतिनिधिक पुरुषवाचक अर्थ को बनाए रखता है।
- source_word: אָץ
  choice: उतावला
  rationale: यह शब्द अनुचित शीघ्रता या जल्दबाज़ी करने वाले व्यक्ति को दर्शाता है। वाणी के प्रसंग में ‘उतावला’ स्वाभाविक और अर्थ-सटीक है।
- source_word: בִּדְבָרָיו
  choice: अपनी बात कहने में
  rationale: शाब्दिक अर्थ ‘अपने शब्दों में’ है, पर हिन्दी में वह अस्वाभाविक हो सकता है। ‘अपनी बात कहने में’ वाणी पर केंद्रित अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: תִּקְוָה
  choice: आशा
  rationale: यह इस ज्ञान-साहित्यिक प्रसंग में सुधार या अच्छे परिणाम की सम्भावना को दर्शाने वाला सामान्य और स्थापित हिन्दी शब्द है।
- source_word: לִכְסִיל
  choice: मूर्ख के लिए
  rationale: כְּסִיל नीतिवचन का प्रमुख शब्द है, जिसमें बौद्धिक मंदता के साथ नैतिक हठ भी निहित है। ‘मूर्ख’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: מִמֶּנּוּ
  choice: उससे अधिक
  rationale: यहाँ מן तुलनात्मक अर्थ देता है। ‘उससे अधिक आशा’ उतावले वक्ता की तुलना मूर्ख से संक्षिप्त और स्वाभाविक हिन्दी में करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘अपनी बात कहने में उतावला’ शाब्दिक ‘अपने शब्दों में उतावला’ की अपेक्षा अधिक स्वाभाविक है, जबकि वाणी पर मूल बल बना रहता है।
