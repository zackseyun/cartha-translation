  yaml_path: translation/ot/proverbs/029/010.yaml
  text: Men of blood hate the blameless[a], but the upright seek his life.
translation:
  language: hi
  text: 'रक्तपात करनेवाले लोग निर्दोष जन से घृणा करते हैं,

    परन्तु सत्यनिष्ठ लोग उसके जीवन की खोज करते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्यनिष्ठ लोग उसके जीवन की परवाह करते हैं” अथवा “उसकी रक्षा करना चाहते हैं।” यहाँ इब्रानी वाक्यांश को हितकारी अर्थ में भी समझा जा सकता है।
    reason: दूसरे चरण के इब्रानी वाक्यांश יְבַקְשׁוּ נַפְשׁוֹ की वैकल्पिक सकारात्मक व्याख्या को सुरक्षित रखना।
lexical_decisions:
- source_word: אַנְשֵׁי דָמִים
  choice: रक्तपात करनेवाले लोग
  rationale: इब्रानी पद का शाब्दिक भाव ‘रक्तपात के लोग’ है। यह चयन उसके हिंसक और हत्यारे चरित्र को स्वाभाविक, dignified आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִשְׂנְאוּ
  choice: घृणा करते हैं
  rationale: यह क्रिया के सीधे अर्थ ‘घृणा करना’ को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: תָם
  choice: निर्दोष जन
  rationale: यहाँ शब्द निष्कपट, निर्दोष या आचरण में खरे व्यक्ति को दर्शाता है। ‘निर्दोष जन’ अगले चरण के ‘सीधे लोग’ से इसे अलग रखता है और एकवचन संदर्भ को भी बनाए रखता है।
- source_word: וִישָׁרִים
  choice: सीधे लोग
  rationale: ज्ञान-साहित्य में यह नैतिक रूप से सीधे और खरे लोगों के लिए प्रचलित शब्द है; बहुवचन वर्ग का भाव सुरक्षित रहता है।
- source_word: יְבַקְשׁוּ
  choice: खोज करते हैं
  rationale: मूल क्रिया का बुनियादी अर्थ ‘खोजना’ है। अधिक व्याख्यात्मक ‘रक्षा करते हैं’ अपनाने के बजाय यह इब्रानी की तनावपूर्ण अभिव्यक्ति को बनाए रखता है।
- source_word: נַפְשׁוֹ
  choice: उसके प्राण
  rationale: נפש यहाँ जीवन, स्वयं व्यक्ति या प्राण को सूचित कर सकता है। ‘उसके प्राण’ एकवचन निर्दोष जन की ओर संकेत करता है और मूल वाक्यांश की अस्पष्टता को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: दूसरे चरण में ‘सीधे लोग उसके प्राण की खोज करते हैं’ का आशय शत्रुतापूर्ण है या हितकारी।
  choice: उसके प्राण की खोज करते हैं
  alternative: उसके जीवन की चिंता करते हैं / उसकी रक्षा करना चाहते हैं
  rationale: इब्रानी יְבַקְשׁוּ נַפְשׁוֹ का औपचारिक अर्थ ‘उसके प्राण/जीवन को खोजते हैं’ है। मुख्य पाठ में इसे व्याख्यात्मक रूप से सकारात्मक या शत्रुतापूर्ण बनाने के बजाय मूल तनाव रखा गया है; हितकारी समझ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रक्तपात करनेवाले’ हिंसा का नैतिक भार व्यक्त करता है, जबकि ‘निर्दोष जन’ और ‘सीधे लोग’ ज्ञान-साहित्य की समानांतर शब्दावली को अलग-अलग बनाए रखते हैं।
