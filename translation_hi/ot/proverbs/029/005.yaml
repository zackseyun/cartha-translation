  text: גֶּ֭בֶר מַחֲלִ֣יק עַל רֵעֵ֑/הוּ רֶ֝֗שֶׁת פּוֹרֵ֥שׂ עַל פְּעָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/005.yaml
  text: A man who flatters his neighbor spreads a net for his steps[a][b].
translation:
  language: hi
  text: 'जो मनुष्य अपने पड़ोसी की चापलूसी करता है,

    वह उसके कदमों के लिए जाल बिछाता है।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने मित्र की।’ इब्रानी शब्द का अर्थ पड़ोसी, मित्र या साथी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके कदमों के लिए’ या ‘उसके पैरों के लिए’; चित्र किसी के मार्ग में उसे फँसाने के लिए जाल बिछाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: मनुष्य
  rationale: यह शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और पुरुष को सूचित कर सकता है; नीतिवचन के सामान्य कथन में ‘मनुष्य’ उसके प्रतिनिधिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַחֲלִיק
  choice: चापलूसी करता है
  rationale: हिफ़ील कृदन्त यहाँ वाणी को चिकना बनाने, अर्थात किसी की चापलूसी करने, का मुहावरेदार अर्थ देता है।
- source_word: עַל רֵעֵהוּ
  choice: अपने पड़ोसी की
  rationale: רֵעַ पड़ोसी, मित्र या साथी को सूचित कर सकता है। ‘पड़ोसी’ व्यापक सामाजिक अर्थ बनाए रखता है; हिन्दी में ‘चापलूसी करना’ के साथ संबंधकारक स्वाभाविक है।
- source_word: רֶשֶׁת
  choice: जाल
  rationale: यह फँसाने के लिए फैलाए जाने वाले वास्तविक जाल को सूचित करता है और मूल रूपक को स्पष्ट रखता है।
- source_word: פּוֹרֵשׂ
  choice: बिछाता है
  rationale: क्रिया का मूल अर्थ फैलाना है; जाल के साथ हिन्दी में ‘जाल बिछाना’ सबसे स्वाभाविक और सटीक प्रयोग है।
- source_word: עַל פְּעָמָיו
  choice: उसके कदमों के लिए
  rationale: פְּעָמִים का अर्थ कदम या पग है। यह निकट-मूल अनुवाद फँसाने के मार्गगत चित्र को बनाए रखता है; प्रत्यय सबसे स्वाभाविक रूप से चापलूसी पाने वाले पड़ोसी की ओर संकेत करता है।
theological_decisions:
- issue: जाल किसके कदमों के लिए बिछाया जाता है
  choice: ‘उसके’ को पड़ोसी के संदर्भ में रखा गया
  alternative: ‘उसके’ को चापलूसी करने वाले मनुष्य के संदर्भ में समझना
  rationale: वाक्यरचना और फंदा बिछाने का चित्र निकटतम पूर्ववर्ती ‘उसके पड़ोसी’ की ओर संकेत करता है, यद्यपि सर्वनाम का रूप स्वयं दोनों संभावनाओं को व्याकरणतः पूरी तरह अलग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘चापलूसी’ नैतिक चेतावनी को सहज रूप में व्यक्त करती है, और ‘कदमों के लिए जाल बिछाता है’ मूल इब्रानी बिंब को निकटता से सुरक्षित रखता है।
