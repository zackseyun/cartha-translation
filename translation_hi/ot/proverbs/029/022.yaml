id: PRO.29.22
reference: Proverbs 29:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִֽישׁ אַ֭ף יְגָרֶ֣ה מָד֑וֹן וּ/בַ֖עַל חֵמָ֣ה רַב פָּֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/022.yaml
  text: An angry man stirs up strife[b][a], and a hot-tempered man abounds in transgression.
translation:
  language: hi
  text: 'क्रोधी मनुष्य[a] झगड़ा भड़काता है,

    और गरम मिज़ाज वाला बहुत अपराध करता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “क्रोध का मनुष्य”; इसी प्रकार अगली पंक्ति में “प्रचण्ड क्रोध का स्वामी।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपराध से भरपूर होता है”; अथवा, “अपराध बढ़ाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אַף
  choice: क्रोधी मनुष्य
  rationale: शाब्दिक रूप से ‘क्रोध का मनुष्य’; यह इब्रानी मुहावरा ऐसे व्यक्ति को दर्शाता है जिसका स्वभाव क्रोधी है। ‘क्रोधी मनुष्य’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: יְגָרֶה
  choice: भड़काता है
  rationale: क्रिया का अर्थ उकसाना या भड़काना है। ‘झगड़ा भड़काता है’ कारण और परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: מָדוֹן
  choice: झगड़ा
  rationale: यह शब्द विवाद, कलह या झगड़े को सूचित करता है। ‘झगड़ा’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: בַעַל חֵמָה
  choice: गरम मिज़ाज वाला
  rationale: शाब्दिक रूप से ‘प्रचण्ड क्रोध का स्वामी’; यह क्षणिक क्रोध के बजाय क्रोधी स्वभाव का मुहावरा है। ‘गरम मिज़ाज वाला’ इस भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: רַב פָּשַׁע
  choice: बहुत अपराध करता है
  rationale: वाक्यांश का मूल भाव अपराध की बहुतायत है। हिन्दी में ‘बहुत अपराध करता है’ स्वाभाविक है, जबकि ‘अपराध से भरपूर होता है’ अधिक शाब्दिक विकल्प है; ‘अपराध बढ़ाता है’ भी पाठगत-संरचनात्मक संभावना के रूप में टिप्पणी में रखा गया है।
- source_word: פָּשַׁע
  choice: अपराध
  rationale: यह नैतिक उल्लंघन अथवा विद्रोही अपराध का बोध कराता है। ‘अपराध’ गंभीरता बनाए रखता है और यहाँ अनावश्यक रूप से राजनीतिक विद्रोह का अर्थ नहीं थोपता।
theological_decisions:
- issue: רַב פָּשַׁע में अपराध की बहुतायत का स्वरूप
  choice: बहुत अपराध करता है
  alternative: अपराध बढ़ाता है; अपराध से भरपूर होता है
  rationale: इब्रानी पदबंध किसी व्यक्ति के बहुत अपराध करने या अपराध से चिह्नित होने का अर्थ दे सकता है; कुछ विश्लेषण इसे अपराध बढ़ाने के रूप में भी समझते हैं। मुख्य पाठ स्वाभाविक हिन्दी देता है और टिप्पणी वास्तविक अर्थगत संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन की समानांतर काव्य-रचना के अनुरूप रखी गई है। ‘क्रोधी मनुष्य’ और ‘गरम मिज़ाज वाला’ दोनों समानार्थी पंक्तियों का संबंध बनाए रखते हुए इब्रानी के दो अलग मुहावरों की हल्की भिन्नता भी व्यक्त करते हैं।
