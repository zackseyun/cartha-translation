  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हिस्सा बाँटता है’ कहावत की संक्षिप्तता के साथ अपराध में सहभागिता का संकेत देता है। ‘शाप’ की वास्तविक शाब्दिक अस्पष्टता को पाद-टिप्पणी द्वारा सुरक्षित रखा गया है।
