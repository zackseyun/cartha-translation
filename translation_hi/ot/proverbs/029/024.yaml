source:
  edition: WLC
  text: חוֹלֵ֣ק עִם גַּ֭נָּב שׂוֹנֵ֣א נַפְשׁ֑/וֹ אָלָ֥ה יִ֝שְׁמַ֗ע וְ/לֹ֣א יַגִּֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/024.yaml
  text: Whoever shares with a thief hates his own life[b][a]; he hears a curse and does not disclose it.
translation:
  language: hi
  text: जो चोर के साथ हिस्सा बाँटता है, वह अपने ही जीवन से घृणा करता है[b]; वह शाप[a] सुनता है और कुछ नहीं बताता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शापयुक्त शपथ’ अथवा ‘अभिशपथ’। इब्रानी शब्द ऐसी शपथ को भी सूचित कर सकता है जिसमें शाप की चेतावनी निहित हो—संभवतः किसी कानूनी प्रसंग में, जहाँ जानने वाले व्यक्ति से सच बताने की माँग की जाती थी।
    reason: lexical_alternative
  - marker: b
    text: अर्थात चोर का सहभागी बनकर और अपनी जानकारी न बताकर वह स्वयं को हानि पहुँचाता है।
    reason: cultural_note
lexical_decisions:
- source_word: חוֹלֵק עִם גַּנָּב
  choice: चोर के साथ हिस्सा बाँटता है
  rationale: यह सहभागी होने और चोरी के लाभ में हिस्सा लेने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कानूनी अर्थ को आवश्यकता से अधिक स्पष्ट किए।
- source_word: שׂוֹנֵא נַפְשׁוֹ
  choice: अपने ही जीवन से घृणा करता है
  rationale: נֶפֶשׁ यहाँ जीवन अथवा स्वयं को सूचित करता है। यह चयन ऐसे व्यक्ति के आत्म-विनाशकारी आचरण को व्यक्त करता है और ‘आत्मा’ के दार्शनिक अर्थ को आरोपित नहीं करता।
- source_word: אָלָה
  choice: शाप
  rationale: इस शब्द में शाप, शापयुक्त शपथ अथवा विधिक अभिशपथ का भाव हो सकता है। मुख्य पाठ में ‘शाप’ मूल शब्द की तीक्ष्णता बनाए रखता है; विधिक संभावना पाद-टिप्पणी में दी गई है।
- source_word: יִשְׁמַע
  choice: सुनता है
  rationale: क्रिया का सीधा अर्थ ‘सुनना’ है। संभावित न्यायिक संदर्भ को मुख्य पाठ में जोड़कर अस्पष्टता समाप्त नहीं की गई।
- source_word: וְלֹא יַגִּיד
  choice: और कुछ नहीं बताता
  rationale: हिफ़िल क्रिया का अर्थ बताना, प्रकट करना या सूचना देना है। ‘कुछ नहीं बताता’ सामान्य पाठक के लिए स्वाभाविक है और इसे अनिवार्य रूप से औपचारिक अदालती गवाही तक सीमित नहीं करता।
