  text: אִֽישׁ אֹהֵ֣ב חָ֭כְמָה יְשַׂמַּ֣ח אָבִ֑י/ו וְ/רֹעֶ֥ה ז֝וֹנ֗וֹת יְאַבֶּד הֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/003.yaml
  text: A man who loves wisdom makes his father glad[a], but one who keeps company with prostitutes destroys wealth.
translation:
  language: hi
  text: 'बुद्धि से प्रेम रखने वाला मनुष्य अपने पिता को आनन्दित करता है,

    पर वेश्याओं की संगति करने वाला[a] धन नष्ट कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, क्रिया का मूल अर्थ “चराना” या “खिलाना” है; यहाँ इब्रानी मुहावरे का अर्थ वेश्याओं के साथ उठना-बैठना या उनके पास आते-जाते रहना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यह एकवचन पुल्लिंग संज्ञा है, जो नीतिवचन में एक प्रतिनिधि व्यक्ति को प्रस्तुत करती है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के मानवीय संदर्भ को बनाए रखता है।
- source_word: אֹהֵב חָכְמָה
  choice: बुद्धि से प्रेम करता है
  rationale: कृदन्त और कर्म मिलकर व्यक्ति के निरन्तर स्वभाव को व्यक्त करते हैं। חָכְמָה का सीधा अर्थ ‘बुद्धि’ है; इसे यहाँ ‘शिक्षा’ तक सीमित नहीं किया गया।
- source_word: יְשַׂמַּח אָבִיו
  choice: अपने पिता को आनन्दित करता है
  rationale: पिएल क्रिया कारणवाचक भाव देती है—वह अपने पिता के आनन्द का कारण बनता है। ‘आनन्दित करता है’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: וְרֹעֶה זֹנוֹת
  choice: पर वेश्याओं की संगति करने वाला
  rationale: רעה का मूल चित्र चराने या साथ रहने का है, पर इस संयोजन में आशय वेश्याओं के साथ उठने-बैठने अथवा उनके पास आते-जाते रहने से है। मुहावरेदार हिन्दी के लिए ‘संगति करने वाला’ चुना गया है और शाब्दिक चित्र पाद-टिप्पणी में रखा गया है।
- source_word: זֹנוֹת
  choice: वेश्याओं
  rationale: स्त्रीलिंग बहुवचन उन स्त्रियों को सूचित करता है जो वेश्यावृत्ति करती हैं। ‘वेश्याएँ’ समकालीन, स्पष्ट और अनावश्यक रूप से अपमानजनक नहीं है।
- source_word: יְאַבֶּד הוֹן
  choice: धन नष्ट कर देता है
  rationale: पिएल क्रिया प्रबल रूप से नष्ट या बरबाद करने का भाव देती है, और הוֹן धन-संपत्ति को दर्शाता है। यह अनुवाद उस प्रबल परिणाम को बनाए रखता है।
