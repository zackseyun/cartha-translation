  text: בְּ/פֶ֤שַֽׁע אִ֣ישׁ רָ֣ע מוֹקֵ֑שׁ וְ֝/צַדִּ֗יק יָר֥וּן וְ/שָׂמֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/006.yaml
  text: In the transgression of an evil man there is a snare[b][a], but the righteous sings for joy and rejoices.
translation:
  language: hi
  text: दुष्ट मनुष्य के अपराध में फंदा होता है[a], पर धर्मी आनन्द से गाता[b] और प्रसन्न रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट मनुष्य के अपराध के कारण फंदा होता है।” इब्रानी वाक्यांश का अर्थ यह हो सकता है कि फंदा उसके अपराध में ही निहित है, या यह कि उसका अपराध फंदे को जन्म देता है।
    reason: alternative_reading
  - marker: b
    text: या, “जयजयकार करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: के अपराध में
  rationale: בְּ उपसर्ग के स्थानवाचक अर्थ को रखते हुए यह बताता है कि दुष्ट का अपराध स्वयं फंदे से जुड़ा है; कारणवाचक अर्थ भी सम्भव है और उसे पादटिप्पणी में दिया गया है।
- source_word: אִישׁ רָע
  choice: दुष्ट मनुष्य
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और इब्रानी के पुल्लिंग एकवचन तथा नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: מוֹקֵשׁ
  choice: फंदा
  rationale: नीतिवचन-साहित्य में यह परिचित रूपक है और पाप से उत्पन्न जकड़न या संकट का भाव व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: विशेषण का संज्ञात्मक प्रयोग प्रतिनिधि व्यक्ति के रूप में किया गया है और दुष्ट मनुष्य के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: יָרוּן
  choice: आनन्द से गाता
  rationale: क्रिया ऊँचे स्वर में प्रकट किए गए उल्लास को दर्शाती है; यह अनुवाद उसके गायन और हर्ष, दोनों आयामों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשָׂמֵחַ
  choice: और प्रसन्न रहता है
  rationale: यह सहभागी रूप धर्मी की बनी रहने वाली प्रसन्न अवस्था को व्यक्त करता है और पहली आनन्दसूचक क्रिया को मिटाए बिना समानांतरता बनाए रखता है।
