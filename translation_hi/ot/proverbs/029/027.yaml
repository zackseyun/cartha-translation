  yaml_path: translation/ot/proverbs/029/027.yaml
  text: An unjust man is an abomination to the righteous[b][a], and one whose way is upright is an abomination to the wicked.
translation:
  language: hi
  text: 'अन्यायी मनुष्य धर्मियों के लिए घृणास्पद है[a],

    और जिसका मार्ग सीधा है[b], वह दुष्ट के लिए घृणास्पद है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धर्मियों के लिए घृणा की वस्तु है।’ मूल शब्द तीव्र नैतिक घृणा या विकर्षण व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘सीधे मार्ग वाला’; अर्थात जिसका आचरण सीधा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित लगता है
  rationale: यह रचना किसी व्यक्ति के प्रति तीव्र नैतिक घृणा और विकर्षण व्यक्त करती है। ‘घृणित लगता है’ आधुनिक हिन्दी में स्वाभाविक है और दोनों समानांतर पंक्तियों की प्रबलता बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ नीतिवचन की नैतिक श्रेणी को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: אִישׁ עָוֶל
  choice: अन्यायी मनुष्य
  rationale: אִישׁ को ‘मनुष्य’ और עָוֶל को अन्याय से चरित्रांकित करनेवाले विशेषण के रूप में प्रस्तुत किया गया है; इससे मूल का पुल्लिंग एकवचन रूप और उसका प्रतिनिधिक अर्थ दोनों बने रहते हैं।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण संज्ञा के रूप में सामान्य श्रेणी को दर्शाता है। ‘दुष्ट’ पहली पंक्ति के ‘धर्मियों’ के नैतिक विरोध को बनाए रखता है।
- source_word: יְשַׁר דָּרֶךְ
  choice: जिसका मार्ग सीधा है
  rationale: यह अनुवाद ‘मार्ग’ के ज्ञान-साहित्य संबंधी रूपक को सुरक्षित रखता है और आधुनिक हिन्दी में उस व्यक्ति के सीधे आचरण का स्वाभाविक संकेत देता है।
- source_word: דָּרֶךְ
  choice: मार्ग
  rationale: ‘मार्ग’ जीवन-पद्धति और आचरण के लिए प्रयुक्त मूल रूपक को ‘आचरण’ जैसे व्याख्यात्मक शब्द से बदलने के बजाय बनाए रखता है।
theological_decisions:
- issue: אִישׁ עָוֶל में प्रतिनिधिक पुल्लिंग भाषा
  choice: ‘अन्यायी मनुष्य’ के द्वारा मूल के पुल्लिंग एकवचन रूप को रखा गया है, जबकि कथन का सिद्धान्त सामान्य रूप से लागू होता है।
  alternative: ‘अन्यायी व्यक्ति’ या ‘अन्यायी’
  rationale: मूल पाठ स्पष्ट रूप से אִישׁ, ‘मनुष्य/पुरुष,’ का प्रयोग करता है। ‘मनुष्य’ हिन्दी में मूल रूप को दर्शाते हुए व्यापक प्रतिनिधिक अर्थ भी दे सकता है।
- issue: יְשַׁר דָּרֶךְ में ‘मार्ग’ का नैतिक रूपक
  choice: ‘जिसका मार्ग सीधा है’ कहकर रूपक और उसकी नैतिक व्यापकता दोनों को सुरक्षित रखा गया है।
  alternative: ‘जिसका आचरण सही है’
  rationale: ‘आचरण’ अर्थ स्पष्ट करता, पर मूल में उपस्थित ‘मार्ग’ की चित्रात्मकता को हटा देता। पाठ स्वयं रूपक को खुला रखता है; पादटिप्पणी उसका आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दो समानांतर पंक्तियों में ‘घृणित लगता है’ की पुनरावृत्ति मूल की संतुलित विरोधात्मक रचना को बनाए रखती है।
