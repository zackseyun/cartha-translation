  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֹדֵ֣עַ צַ֭דִּיק דִּ֣ין דַּלִּ֑ים רָ֝שָׁ֗ע לֹא יָבִ֥ין דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/007.yaml
  text: A righteous man knows the case of the poor[b][a]; a wicked man does not understand knowledge.
translation:
  language: hi
  text: धर्मी मनुष्य निर्धनों के मामले को जानता है[a], पर दुष्ट मनुष्य ज्ञान को नहीं समझता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्धनों के अधिकार/न्याय को जानता है।” इब्रानी דִּין का अर्थ “मामला,” “पक्ष,” “अधिकार” या “न्याय” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “ज्ञान को नहीं समझता।” इसका आशय पहले खंड में बताए गए ज्ञान से हो सकता है, पर मूल पाठ में “ऐसा” शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדֵעַ
  choice: जानता है
  rationale: यह ידע के सीधे अर्थ ‘जानना/पहचानना’ को बनाए रखता है; ‘चिंता करता है’ जैसे अधिक व्याख्यात्मक अर्थ को पाठ में नहीं जोड़ा गया।
- source_word: צַדִּיק
  choice: धर्मी मनुष्य
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और नीतिवचन में एक प्रतिनिधि व्यक्ति को दर्शाता है।
- source_word: דִּין
  choice: मामला
  rationale: דִּין यहाँ न्यायिक मामला, पक्ष या न्याय का बोध दे सकता है। ‘मामला’ मूल की अर्थगत व्यापकता को काफी हद तक बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: דַּלִּים
  choice: निर्धनों
  rationale: यह बहुवचन शब्द गरीब, कमजोर या सामाजिक रूप से असहाय लोगों को दर्शाता है; ‘निर्धन’ आधुनिक मानक हिन्दी में स्पष्ट और सम्मानजनक है।
- source_word: רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: यह भी संज्ञा के रूप में प्रयुक्त एकवचन विशेषण है और पहले खंड के ‘धर्मी मनुष्य’ के साथ प्रतिनिधि विरोध बनाए रखता है।
- source_word: יָבִין
  choice: समझता
  rationale: בין का सामान्य अर्थ समझना या परखना है; यहाँ ‘समझता’ सरल और सीधा है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: मूल में अमूर्त संज्ञा ‘ज्ञान’ बिना किसी संकेतवाचक विशेषण के है। इसलिए ‘ऐसा ज्ञान’ या ‘यह बात’ जोड़कर संबंध को स्पष्ट नहीं किया गया।
theological_decisions:
- issue: धर्मी के ‘जानने’ का आशय
  choice: इसे निर्धनों के मामले को जानने के रूप में रखा गया
  alternative: निर्धनों की चिंता करना या उनके अधिकारों की रक्षा करना
  rationale: वे अर्थ प्रसंग से निहित हो सकते हैं, पर मूल क्रिया सीधे ‘जानना’ कहती है; इसलिए नैतिक परिणाम को अनकहे रूप में रहने दिया गया।
- issue: दूसरे खंड में ‘ज्ञान’ का संदर्भ
  choice: मूल की संक्षिप्त और कुछ कठिन अभिव्यक्ति को बनाए रखा गया
  alternative: दुष्ट मनुष्य ‘ऐसा ज्ञान’ नहीं रखता या ‘निर्धनों का मामला’ नहीं समझता
  rationale: दोनों खंडों के बीच संबंध संभावित है, पर स्रोत में ‘ऐसा’ या पहले खंड के विषय की स्पष्ट पुनरावृत्ति नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर संरचना में ‘धर्मी मनुष्य’ और ‘दुष्ट मनुष्य’ का स्पष्ट विरोध है। दूसरे खंड की असामान्य संक्षिप्तता मूल इब्रानी के अनुरूप जानबूझकर सुरक्षित रखी गई है।
