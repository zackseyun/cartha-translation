- source_word: כָּל רוּחוֹ
  choice: अपने मन का सारा आवेग
  rationale: רוּחַ का अर्थ आत्मा, मनोभाव, स्वभाव या क्रोध का आवेग हो सकता है। प्रसंग में अनियंत्रित भीतरी आवेग प्रमुख है; यह हिंदी प्रयोग उस व्यापकता को बनाए रखते हुए स्वाभाविक है। כָּל की संपूर्णता ‘सारा’ से व्यक्त हुई है।
- source_word: יוֹצִיא
  choice: बाहर निकाल देता है
  rationale: हिफ़ील रूप का मूल भाव ‘बाहर निकालना’ है। यह भीतर के आवेग को बिना रोके प्रकट कर देने की तस्वीर बनाए रखता है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन साहित्य में नैतिक और व्यावहारिक विवेक से रहित व्यक्ति के लिए प्रचलित और स्पष्ट हिंदी पर्याय।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: पुल्लिंग एकवचन के प्रतिनिधिक प्रयोग को संक्षिप्त और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּאָחוֹר יְשַׁבְּחֶנָּה
  choice: उसे शांत करके रोक रखता है
  rationale: בְּאָחוֹר में पीछे रखने का भाव है, जबकि कठिन क्रिया יְשַׁבְּחֶנָּה शांत करने या वश में रखने का संकेत दे सकती है। संयुक्त अनुवाद संयम और शांत करने—दोनों संभावित भावों को समेटता है।
