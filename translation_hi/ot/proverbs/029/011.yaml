  - marker: a
    text: या, “मूर्ख अपना सारा क्रोध उंडेल देता है, पर बुद्धिमान उसे शांत करता है।” इब्रानी शब्द का अर्थ “आत्मा,” “मनोभाव” या “क्रोध” हो सकता है। अंतिम इब्रानी क्रिया कठिन है और उसका अर्थ “शांत करना” भी हो सकता है; “पीछे” के भाव के साथ यह रोककर रखने का अर्थ देता है।
