  text: בִּ/רְב֣וֹת צַ֭דִּיקִים יִשְׂמַ֣ח הָ/עָ֑ם וּ/בִ/מְשֹׁ֥ל רָ֝שָׁ֗ע יֵאָ֥נַֽח עָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/002.yaml
  text: When the righteous increase[a], the people rejoice; but when a wicked man rules, the people groan.
translation:
  language: hi
  text: जब धर्मी बढ़ते हैं[a], तब लोग आनन्दित होते हैं; पर जब कोई दुष्ट शासन करता है, तब लोग कराहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब धर्मी बहुत होते हैं, तब लोग आनन्दित होते हैं।” इब्रानी रचना वृद्धि या बड़ी संख्या—दोनों में से किसी भाव पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְבוֹת
  choice: जब ... बढ़ते हैं
  rationale: ב־ के साथ רבה का infinitive construct यहाँ कालसूचक है। ‘जब ... बढ़ते हैं’ वृद्धि के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि इब्रानी में संख्या अधिक होने का भाव भी सम्भव है; उसे पादटिप्पणी में रखा गया है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ संक्षिप्त, स्वाभाविक और लिंग को अनावश्यक रूप से सीमित किए बिना इस वर्ग का बोध कराता है।
- source_word: יִשְׂמַח
  choice: आनन्दित होते हैं
  rationale: שׂמח आनन्द या प्रसन्नता को व्यक्त करता है। सामूहिक ‘लोग’ के साथ वर्तमान सामान्य सत्य के रूप में ‘आनन्दित होते हैं’ हिन्दी कहावत की शैली में स्वाभाविक है।
- source_word: הָעָם / עָם
  choice: लोग
  rationale: עם यहाँ सामूहिक जनसमुदाय को सूचित करता है। दोनों अर्ध-पंक्तियों में ‘लोग’ दोहराने से समानान्तरता स्पष्ट रहती है।
- source_word: וּבִמְשֹׁל
  choice: पर जब ... शासन करता है
  rationale: ב־ के साथ משל का infinitive construct कालसूचक है। आरम्भिक ו औपचारिक रूप से ‘और’ है, पर दोनों अर्ध-पंक्तियों का स्पष्ट विरोध हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: רָשָׁע
  choice: कोई दुष्ट
  rationale: एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘कोई दुष्ट’ उसकी एकवचन व्यक्तिगतता बनाए रखता है, पर इब्रानी व्याकरणिक पुल्लिंग से आगे बढ़कर अनावश्यक जैविक लिंग निर्दिष्ट नहीं करता।
- source_word: יֵאָנַח
  choice: कराहते हैं
  rationale: אנח का निफ़अल रूप दुःख या दबाव में कराहने अथवा गहरी आह भरने का भाव देता है। ‘कराहते हैं’ दुष्ट शासन से उत्पन्न सामूहिक पीड़ा को सशक्त ढंग से व्यक्त करता है।
