source:
  edition: WLC
  text: מְפַנֵּ֣ק מִ/נֹּ֣עַר עַבְדּ֑/וֹ וְ֝/אַחֲרִית֗/וֹ יִהְיֶ֥ה מָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/021.yaml
  text: Whoever pampers his servant from youth[a], in the end he will become a son.
translation:
  language: hi
  text: 'जो अपने दास को युवावस्था से लाड़-प्यार में रखता है,

    अंत में वह पुत्र बन जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द מָנוֹן का अर्थ अनिश्चित है। इसे “पुत्र,” “पुत्र जैसा व्यवहार करने वाला,” “मुसीबत,” या “उद्दंडता” के अर्थ में भी समझा गया है। “पुत्र” के अर्थ में यह आशय हो सकता है कि अत्यधिक लाड़ पाया दास पुत्र का अधिकार जताने लगे; अन्य व्याख्याएँ प्रतिकूल परिणाम पर बल देती हैं।
    reason: दुर्लभ और विवादित इब्रानी शब्द के वैकल्पिक अर्थों तथा उनसे बनने वाले भिन्न आशयों को सुरक्षित रखना।
lexical_decisions:
- source_word: מְפַנֵּק
  choice: लाड़-प्यार में रखता है
  rationale: पिएल कृदंत किसी को नाज़ुक ढंग से रखने या अत्यधिक लाड़ करने का भाव देता है। यह हिंदी प्रयोग कहावत में निहित अनुचित दुलार के नकारात्मक संकेत को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִנֹּעַר
  choice: बचपन से
  rationale: यह पद आरंभिक आयु से लगातार ऐसा किए जाने का समय बताता है। संदर्भ में आयु दास की समझी जाती है, पर इब्रानी में अलग से स्वत्ववाचक सर्वनाम नहीं है।
- source_word: עַבְדּוֹ
  choice: अपने दास को
  rationale: עבדו स्वामी के अधिकार में रहने वाले व्यक्ति को सूचित करता है। 'दास' प्राचीन सामाजिक अधीनता को 'सेवक' की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: וְאַחֲרִיתוֹ
  choice: अंत में
  rationale: אַחֲרִית अंतिम परिणाम या बाद की दशा को सूचित करता है। 'अंत में' हिंदी में संक्षिप्त और कहावत के अनुकूल है।
- source_word: יִהְיֶה מָנוֹן
  choice: वह पुत्र-जैसा बन बैठेगा
  rationale: מָנוֹן अत्यंत दुर्लभ और अनिश्चित है। 'पुत्र-जैसा' पुत्र का स्थान या व्यवहार ग्रहण करने वाली प्रचलित व्याख्या को व्यक्त करता है, जबकि 'बन बैठेगा' अनधिकृत या धृष्टतापूर्ण परिणति का संकेत देता है; अनिश्चितता पादटिप्पणी में स्पष्ट रखी गई है।
theological_decisions:
- issue: מָנוֹן का अर्थ और कहावत की परिणति
  choice: पुत्र-जैसा बन बैठेगा
  alternative: वह दुःख/मुसीबत का कारण बनेगा; वह उद्दंड हो जाएगा; वह पुत्र बन जाएगा
  rationale: यह शब्द केवल यहाँ मिलता है और इसका अर्थ निश्चित नहीं है। मुख्य पाठ में 'पुत्र-जैसा' रखने से पुत्र-संबंधी व्याख्या बनी रहती है और शाब्दिक जैविक पुत्रत्व का अनावश्यक दावा नहीं होता; नकारात्मक और अधिक सामान्य अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी; कहावत की संक्षिप्त दो-पंक्तीय संरचना रखी गई है। 'दास' प्राचीन बंधित सामाजिक स्थिति को स्पष्ट करता है। 'बन बैठेगा' परिणाम की अवांछनीयता बताता है, पर पादटिप्पणी मूल शब्द की वास्तविक अनिश्चितता खुली रखती है।
