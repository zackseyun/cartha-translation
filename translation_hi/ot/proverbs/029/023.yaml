  text: גַּאֲוַ֣ת אָ֭דָם תַּשְׁפִּילֶ֑/נּוּ וּ/שְׁפַל ר֝֗וּחַ יִתְמֹ֥ךְ כָּבֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/029/023.yaml
  text: A man's pride will bring him low[a], but one who is lowly in spirit will obtain honor.
translation:
  language: hi
  text: 'मनुष्य का घमंड उसे नीचा कर देगा,

    पर जिसका मन नम्र है, वह सम्मान पाएगा[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सम्मान को थामे रहेगा” अथवा “सम्मान प्राप्त करेगा।” इब्रानी क्रिया का अर्थ थामना, पकड़े रहना, या प्राप्त करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּאֲוַת
  choice: घमंड
  rationale: यह संज्ञा अपने को ऊँचा समझने या अहंकारी होने का भाव व्यक्त करती है। आधुनिक हिन्दी में ‘घमंड’ स्वाभाविक है और ‘मन से दीन’ के साथ नीतिवचन का विरोध स्पष्ट रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधि व्यक्ति का बोध है। ‘मनुष्य’ हिन्दी में एकवचन सामान्य अर्थ को स्वाभाविक और लिंग-समावेशी ढंग से व्यक्त करता है।
- source_word: תַּשְׁפִּילֶנּוּ
  choice: उसे नीचा कर देगा
  rationale: שׁפל के हिफ़ील रूप का कारक अर्थ ‘नीचा करना’ है। यह अनुवाद घमंड को व्यक्ति के पतन का कारण बताता है और दूसरी पंक्ति के ‘सम्मान’ से प्रभावी विरोध बनाता है।
- source_word: וּשְׁפַל רוּחַ
  choice: पर जो मन से दीन है
  rationale: शाब्दिक भाव ‘आत्मा/मन में नीचा’ है। ‘मन से दीन’ आंतरिक नम्रता को व्यक्त करता है, जबकि केवल बाहरी गरीबी या सामाजिक निम्नता का अर्थ आरोपित नहीं करता। संयोजक ו को विरोधात्मक प्रसंग के अनुसार ‘पर’ किया गया है।
- source_word: יִתְמֹךְ
  choice: पाएगा
  rationale: תמך का मूल अर्थ थामना, संभालना या पकड़े रहना हो सकता है; ‘सम्मान’ के साथ यहाँ उसे प्राप्त करने का भाव प्रसंगानुकूल और स्वाभाविक है। मूल क्रिया की वास्तविक अर्थगत संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: כָּבוֹד
  choice: सम्मान
  rationale: नीतिवचन के इस प्रसंग में शब्द सामाजिक प्रतिष्ठा या आदर का बोध देता है; ‘महिमा’ अपेक्षाकृत अधिक धार्मिक या भव्य अर्थ जोड़ सकती है।
theological_decisions:
- issue: दीनता और सम्मान के संबंध को किस रूप में व्यक्त किया जाए
  choice: 'कथन को नीतिवचन की सामान्य प्रतिज्ञप्ति के रूप में रखा गया है: ‘सम्मान पाएगा।’'
  alternative: इसे परमेश्वर द्वारा सम्मान दिए जाने का स्पष्ट वचन बनाना।
  rationale: इब्रानी पाठ कर्ता के रूप में परमेश्वर का नाम नहीं लेता। इसलिए दैवी निष्क्रियता या किसी विशिष्ट प्रतिफल-सिद्धांत को पाठ में स्पष्ट रूप से जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर पंक्तियों में ‘घमंड/मन से दीन’ और ‘नीचा/सम्मान’ का विरोध सुरक्षित है। पाद-टिप्पणी का चिह्न उसी विवादित क्रिया ‘पाएगा’ के बाद रखा गया है, क्योंकि अर्थगत विविधता יִתְמֹךְ से संबंधित है।
