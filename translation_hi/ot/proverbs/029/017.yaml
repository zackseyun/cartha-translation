lexical_decisions:
- source_word: יַסֵּר
  choice: अनुशासित कर
  rationale: पिएल आज्ञार्थक सक्रिय सुधार, ताड़ना और प्रशिक्षण का भाव रखता है। ‘अनुशासित कर’ आधुनिक हिन्दी में इन भावों को संक्षेप में व्यक्त करता है।
- source_word: בִּנְךָ
  choice: अपने पुत्र को
  rationale: इब्रानी शब्द एकवचन पुल्लिंग में विशेष रूप से ‘तेरा पुत्र’ कहता है; इसलिए इसे सामान्य करके ‘संतान’ नहीं किया गया।
- source_word: וִינִיחֶךָ
  choice: वह तुझे चैन देगा
  rationale: हिफ़ील रूप का कारणात्मक भाव है—पुत्र माता-पिता को विश्राम या राहत पहुँचाएगा। ‘चैन देगा’ स्वाभाविक हिन्दी में इस अर्थ को स्पष्ट रखता है।
- source_word: וְיִתֵּן
  choice: वह ... देगा
  rationale: सामान्य क्रिया ‘देना’ को बनाए रखने से इब्रानी की सरलता और दोनों खंडों की समानांतर रचना सुरक्षित रहती है।
- source_word: מַעֲדַנִּים
  choice: आनंद
  rationale: यह बहुवचन संज्ञा मनभावनी या सुखद वस्तुओं और आनंदों को सूचित कर सकती है। हिन्दी में ‘आनंद देगा’ स्वाभाविक है और काव्यात्मक समानांतरता के अनुकूल है।
- source_word: לְנַפְשֶׁךָ
  choice: तेरे मन को
  rationale: נפש यहाँ व्यक्ति के भीतरी अस्तित्व या स्वयं को सूचित करता है। ‘मन’ साधारण आधुनिक हिन्दी में आंतरिक संतोष का भाव स्पष्ट करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
