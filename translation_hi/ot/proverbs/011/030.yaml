id: PRO.11.30
reference: Proverbs 11:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פְּֽרִי צַ֭דִּיק עֵ֣ץ חַיִּ֑ים וְ/לֹקֵ֖חַ נְפָשׂ֣וֹת חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/030.yaml
  text: The fruit of the righteous is a tree of life[a], and he who wins souls is wise.
translation:
  language: hi
  text: धर्मी का फल जीवन का वृक्ष है, और लोगों को जीत लेने वाला बुद्धिमान है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और प्राणों/व्यक्तियों को लेने वाला बुद्धिमान है।” इब्रानी का अर्थ “बुद्धिमान व्यक्ति प्राणों/व्यक्तियों को लेता है” भी समझा जा सकता है। यहाँ “लेना” लोगों को अपने प्रभाव में लाने या उनका मन जीतने का मुहावरा हो सकता है; इसका अर्थ आवश्यक रूप से धर्म-परिवर्तन कराना नहीं है।
    reason: शब्दार्थ और वाक्य-संरचना की वास्तविक अस्पष्टता
lexical_decisions:
- source_word: פְּרִי
  choice: फल
  rationale: ‘फल’ मूल रूपक को बनाए रखता है और परिणाम अथवा प्रभाव का भाव भी व्यक्त कर सकता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ संज्ञा के रूप में किसी प्रतिनिधि धर्मी व्यक्ति के लिए प्रयुक्त है; ‘धर्मी’ संक्षिप्त, स्वाभाविक और प्रचलित है।
- source_word: עֵץ חַיִּים
  choice: जीवन का वृक्ष
  rationale: यह नीतिवचन की एक स्थापित रूपकात्मक अभिव्यक्ति है और उत्पत्ति तथा नीतिवचन के अन्य स्थलों से उसका संबंध बनाए रखती है।
- source_word: וְלֹקֵחַ
  choice: जीत लेने वाला
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर נְפָשׁוֹת के साथ यहाँ लोगों को अपने प्रभाव में लाने या उनका मन जीतने का भाव संभव है। मुख्य पाठ में अर्थपूर्ण और स्वाभाविक हिन्दी दी गई है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: נְפָשׂוֹת
  choice: लोगों को
  rationale: נפשׁ यहाँ केवल अमूर्त ‘आत्मा’ नहीं, बल्कि व्यक्ति, प्राण या जीवन को सूचित कर सकता है। ‘लोगों को’ मुख्य संभावित मुहावरेदार अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: חָכָם
  choice: बुद्धिमान है
  rationale: विशेषण को विधेय मानकर अनुवाद किया गया है, जैसा कि इस वाक्य की पारंपरिक और सहज समझ में है; इसकी वैकल्पिक वाक्य-संरचना पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ‘लोगों को जीत लेने’ का आशय
  choice: इसे लोगों को अपने प्रभाव में लाने या उनका मन जीतने के व्यापक ज्ञान-साहित्यिक अर्थ में रखा गया है।
  alternative: इसे विशेष रूप से लोगों का उद्धार करने अथवा धर्म-परिवर्तन कराने के अर्थ में समझना।
  rationale: इब्रानी पदबंध अपने आप में बाद की किसी विशिष्ट सुसमाचार-प्रचार संबंधी धारणा को व्यक्त नहीं करता; इसलिए अनुवाद उस संकुचित धार्मिक अर्थ को आरोपित नहीं करता।
- issue: חָכָם की वाक्यगत भूमिका
  choice: ‘बुद्धिमान है’—इसे विधेय माना गया है।
  alternative: ‘बुद्धिमान व्यक्ति लोगों/प्राणों को लेता है’—इसे अगले उपवाक्य का कर्ता मानना।
  rationale: बिना स्वरूप-चिह्न वाली संक्षिप्त इब्रानी कहावत में दोनों वाक्यगत संबंध संभव माने जा सकते हैं। मुख्य पाठ पारंपरिक विधेय-पाठ अपनाता है, पर विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली रखी गई है। ‘जीवन का वृक्ष’ पारंपरिक बाइबलीय प्रतिध्वनि को बनाए रखता है, जबकि ‘लोगों को जीत लेने वाला’ आधुनिक पाठक के लिए स्वाभाविक है।
