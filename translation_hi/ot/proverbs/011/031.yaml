id: PRO.11.31
reference: Proverbs 11:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֣ן צַ֭דִּיק בָּ/אָ֣רֶץ יְשֻׁלָּ֑ם אַ֝֗ף כִּֽי רָשָׁ֥ע וְ/חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/031.yaml
  text: Look[a], if the righteous is repaid on earth, how much more the wicked and the sinner.
translation:
  language: hi
  text: देखो[a], धर्मी को पृथ्वी पर प्रतिदान मिलता है, तो दुष्ट और पापी को कितना अधिक मिलेगा!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही, धर्मी को देश में प्रतिदान मिलता है।” इब्रानी का अधिक शब्दशः अनुवाद हो सकता है, “देखो, धर्मी को देश/पृथ्वी में प्रतिदान दिया जाएगा।”
    reason: הֵן के ‘निश्चय ही’ विकल्प, אֶרֶץ के ‘देश/भूमि’ अर्थ, और יְשֻׁלָּם के अधिक शब्दशः निष्क्रिय रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए कथन पर बल देता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक है; ‘निश्चय ही’ भी सम्भव है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक व्यक्ति को दर्शाता है; ‘धर्मी’ हिन्दी बाइबलीय और सामान्य धार्मिक भाषा में संक्षिप्त तथा स्पष्ट है।
- source_word: בָּאָרֶץ
  choice: पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। इस सामान्य नीतिवचन में ‘पृथ्वी पर’ व्यापक अर्थ को व्यक्त करता है, जबकि दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְשֻׁלָּם
  choice: उसका प्रतिफल मिलता है
  rationale: שלם का पुअल रूप देय प्रतिदान या बदला मिलने को व्यक्त करता है। ‘प्रतिफल’ जानबूझकर इतना व्यापक रखा गया है कि उसे केवल पुरस्कार या केवल दण्ड न माना जाए।
- source_word: אַף כִּי
  choice: तो ... कितना अधिक
  rationale: यह संयोजन न्यून से अधिक की ओर जाने वाला तर्क व्यक्त करता है; हिन्दी में ‘तो ... कितना अधिक’ उस बल को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: नीतिवचन साहित्य में संज्ञा के रूप में प्रयुक्त इस विशेषण का यह प्रचलित और सीधा हिन्दी रूप है।
- source_word: וְחוֹטֵא
  choice: और पापी
  rationale: यह कृदन्त ऐसे व्यक्ति को दर्शाता है जिसकी पहचान पाप करने वाले के रूप में है; ‘पापी’ दुष्ट के साथ मूल युग्म को बनाए रखता है।
theological_decisions:
- issue: धर्मी को मिलने वाले प्रतिदान का स्वरूप
  choice: ‘प्रतिफल’ रखा गया है, जो सकारात्मक पुरस्कार, अनुशासनात्मक दुःख या व्यापक देय प्रतिदान में से किसी एक को निश्चित नहीं करता।
  alternative: ‘पुरस्कार’ अथवा ‘दण्ड’ कहना।
  rationale: इब्रानी क्रिया व्यापक प्रतिदान को व्यक्त कर सकती है। किसी एक अर्थ को चुनना मूल की धर्मवैचारिक अनिश्चितता को अनावश्यक रूप से सुलझा देता।
- issue: אַף כִּי की तार्किक संरचना
  choice: इसे ‘तो ... कितना अधिक’ के रूप में व्यक्त किया गया है।
  alternative: इसे केवल ‘और भी’ या ‘निश्चय ही’ कहना।
  rationale: यह अनुवाद धर्मी के मामले से दुष्ट और पापी के मामले की ओर बढ़ने वाले तर्क की तीव्रता को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज नीतिवचन-शैली रखी गई है। ‘प्रतिफल’ मूल की व्यापकता बचाता है और ‘कितना अधिक’ मूल के प्रबल तुलनात्मक तर्क को स्पष्ट करता है।
