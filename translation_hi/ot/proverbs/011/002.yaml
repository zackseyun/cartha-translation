  text: When arrogance comes[a], disgrace comes also, but with the humble is wisdom.
translation:
  language: hi
  text: जब घमंड आता है, तब अपमान भी आता है; पर नम्र लोगों के पास बुद्धि होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּא
  choice: आता है
  rationale: यहाँ पूर्ण रूप नीतिवचन की सामान्य और बार-बार सत्य होने वाली बात व्यक्त करता है; इसलिए हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: זָדוֹן
  choice: घमंड
  rationale: यह शब्द अहंकारी और धृष्ट अभिमान का बोध कराता है। ‘घमंड’ आधुनिक सामान्य हिन्दी में इस नैतिक दोष को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיָּבֹא
  choice: तब ... भी आता है
  rationale: यह पहले कथन से परिणामस्वरूप जुड़े दूसरे आगमन को व्यक्त करता है; ‘तब’ और ‘भी’ घमंड तथा अपमान के साथ आने का संबंध स्पष्ट करते हैं।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह सार्वजनिक लज्जा और अनादर का संकेत देता है। ‘अपमान’ आधुनिक हिन्दी में दोनों भावों को संक्षेप में व्यक्त करता है।
- source_word: וְאֶת
  choice: के साथ
  rationale: इस रचना में אֶת संगति या साथ होने का संबंध बताता है; ‘के साथ’ हिन्दी में स्वाभाविक है और समानांतर विरोध को बनाए रखता है।
- source_word: צְנוּעִים
  choice: नम्र लोगों
  rationale: यह उन लोगों को दर्शाता है जो विनम्र, संयमी और स्वयं को बड़ा न मानने वाले हैं। ‘नम्र’ घमंड के विपरीत नैतिक गुण को साफ़ व्यक्त करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह नीतिवचन साहित्य का मानक शब्द है, जिसका अर्थ विवेकपूर्ण, सही जीवन-बोध है। ‘बुद्धि’ सामान्य हिन्दी में संक्षिप्त और परिचित है।
