source:
  edition: WLC
  text: תֻּמַּ֣ת יְשָׁרִ֣ים תַּנְחֵ֑/ם וְ/סֶ֖לֶף בּוֹגְדִ֣ים ו/שד/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/003.yaml
  text: The integrity of the upright guides them[b][a], but the crookedness of the treacherous destroys them.
translation:
  language: hi
  text: 'सीधे-सच्चे लोगों की खराई उनका मार्गदर्शन करती है,

    पर विश्वासघातियों का टेढ़ापन[a] उन्हें बरबाद कर देता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘टेढ़ापन’ का अनुवाद ‘कुटिलता’ भी हो सकता है; इब्रानी में नैतिक रूप से मुड़े या विकृत होने का चित्र है, जो ‘सीधे-सच्चे’ के विपरीत है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम वाक्यांश का अनुवाद ‘उन्हें नष्ट कर देता है’ या अधिक शाब्दिक रूप में ‘उनका विनाश बनता है’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֻּמַּת
  choice: खराई
  rationale: यह शब्द नैतिक संपूर्णता और निष्कपट चरित्र का बोध कराता है। ‘खराई’ आधुनिक हिन्दी में स्वाभाविक है और पापहीनता का अतिशयोक्तिपूर्ण अर्थ नहीं देती।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोग
  rationale: यह नैतिक रूप से सीधे और सही आचरण करनेवालों को दर्शाता है। यह अभिव्यक्ति अगले चरण के ‘टेढ़ापन’ के साथ मूल रूपक का विरोध भी बनाए रखती है।
- source_word: תַּנְחֵם
  choice: उनका मार्गदर्शन करती है
  rationale: हिफ़ील रूप का अर्थ अगुवाई करना या मार्ग दिखाना है; नीतिवचन के संदर्भ में ‘मार्गदर्शन’ नैतिक दिशा को स्पष्ट करता है।
- source_word: סֶלֶף
  choice: टेढ़ापन
  rationale: यह मरोड़, विकृति या नैतिक कुटिलता को दर्शाता है। ‘टेढ़ापन’ ठोस रूपक को बचाता है और ‘सीधे-सच्चे’ के साथ जानबूझकर रखे गए विरोध को उभारता है।
- source_word: בּוֹגְדִים
  choice: विश्वासघाती
  rationale: यह उन लोगों को दर्शाता है जो भरोसा तोड़ते और छलपूर्वक व्यवहार करते हैं। ‘विश्वासघाती’ इस सामान्य नैतिक चरित्र को सटीक और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ו/שד/ם
  choice: उन्हें बरबाद कर देता है
  rationale: इस रूप का आशय तबाही या विनाश लाना है। ‘बरबाद कर देता है’ स्पष्ट करता है कि विश्वासघातियों का अपना टेढ़ापन उन्हीं को विनाश की ओर ले जाता है, जबकि मूल की तीव्रता भी बनी रहती है।
