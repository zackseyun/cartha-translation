  yaml_path: translation/ot/proverbs/011/028.yaml
  text: Whoever trusts in his wealth will fall[a], but the righteous will flourish like leaves.
translation:
  language: hi
  text: 'जो अपने धन पर भरोसा रखता है, वह गिर जाएगा,

    पर धर्मी लोग पत्ते[a] की तरह लहलहाएँगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पत्तों की तरह।’ इब्रानी में ‘पत्ता’ एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: भरोसा रखता है
  rationale: यह कृदन्त किसी वस्तु पर विश्वास या निर्भरता रखने को व्यक्त करता है; ‘भरोसा रखता है’ आधुनिक हिन्दी में स्वाभाविक है और नीतिवचन की नैतिक चेतावनी को बनाए रखता है।
- source_word: בְּעָשְׁרוֹ
  choice: अपने धन पर
  rationale: עֹשֶׁר धन या संपत्ति को सूचित करता है। सम्बन्धवाचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है, और हिन्दी में भरोसा ‘पर’ रखना स्वाभाविक प्रयोग है।
- source_word: הוּא יִפֹּל
  choice: वह गिर जाएगा
  rationale: स्वतंत्र सर्वनाम के बल को ‘वह’ द्वारा सुरक्षित रखा गया है। अपूर्ण क्रिया नीतिवचन में सामान्यतः निश्चित परिणाम बताती है, इसलिए ‘गिर जाएगा’ उपयुक्त है।
- source_word: וְכֶעָלֶה
  choice: पर ... पत्तों के समान
  rationale: וְ यहाँ तीखा विरोध व्यक्त करता है, इसलिए ‘पर’ चुना गया। עָלֶה रूपतः एकवचन है, किंतु उपमा में हरियाली/पत्तियों का प्रतिनिधिक चित्र देता है; बहुवचन कर्ता के साथ ‘पत्तों के समान’ हिन्दी में अधिक स्वाभाविक है।
- source_word: צַדִּיקִים
  choice: धर्मी लोग
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘धर्मी लोग’ सामान्य पाठक के लिए स्पष्ट है और इसे केवल पुरुषों तक सीमित नहीं करता।
- source_word: יִפְרָחוּ
  choice: फलेंगे-फूलेंगे
  rationale: פרח अंकुरित होने, खिलने या समृद्ध होने का अर्थ दे सकता है। हिन्दी मुहावरा ‘फलेंगे-फूलेंगे’ वनस्पति-चित्र और रूपकात्मक उन्नति दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: आरम्भिक पुल्लिंग एकवचन कृदन्त का सामान्य मानवीय अर्थ
  choice: जो अपने धन पर भरोसा रखता है
  alternative: वह मनुष्य जो अपने धन पर भरोसा रखता है
  rationale: इब्रानी रूप व्याकरणतः पुल्लिंग एकवचन है, पर नीतिवचन में इसका अर्थ सामान्य है। ‘जो’ इस सार्वत्रिक बल को स्वाभाविक हिन्दी में रखता है, जबकि ‘अपने’ मूल के सम्बन्धवाचक प्रत्यय को दर्शाता है।
- issue: עָלֶה की उपमा में वचन और चित्र
  choice: पत्तों के समान
  alternative: एक पत्ते के समान
  rationale: मूल संज्ञा एकवचन है, फिर भी वह प्रतिनिधिक या सामूहिक वनस्पति-चित्र दे सकती है। ‘पत्तों के समान’ बहुवचन ‘धर्मी लोग’ के साथ स्वाभाविक है और फलने-फूलने की हरियाली को बनाए रखता है; किसी विशेष पत्ते पर अनावश्यक जोर नहीं देता।
- issue: धन पर भरोसे के परिणाम की प्रकृति
  choice: गिर जाएगा
  alternative: नष्ट हो जाएगा
  rationale: יִפֹּל केवल ‘गिरने’ को कहता है और पतन की सटीक प्रकृति नहीं बताता। ‘नष्ट हो जाएगा’ अर्थ को आवश्यकता से अधिक निश्चित करता, इसलिए मूल की खुली हुई व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण नीतिवचन-शैली। दोनों अर्धपंक्तियों का विरोध स्पष्ट रखा गया है और वनस्पति-रूपक को स्वाभाविक हिन्दी मुहावरे से व्यक्त किया गया है।
