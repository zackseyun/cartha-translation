  yaml_path: translation/ot/proverbs/011/016.yaml
  text: A gracious woman obtains honor[a], and ruthless men obtain wealth.
translation:
  language: hi
  text: 'अनुग्रहशील स्त्री सम्मान पाती है[a],

    और निर्दयी पुरुष धन पाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रहशील स्त्री सम्मान को थामे रहती है ... और निर्दयी पुरुष धन को थामे रहते हैं।” दोनों खंडों में प्रयुक्त इब्रानी क्रिया का मूल अर्थ “थामना, सहारा देना” है; इस संदर्भ में इसका अर्थ किसी वस्तु को प्राप्त करना या दृढ़ता से अपने पास रखना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת חֵן
  choice: कृपालु स्त्री
  rationale: यह रचना शाब्दिक रूप से ‘अनुग्रह/कृपा की स्त्री’ है। ‘कृपालु स्त्री’ आधुनिक हिन्दी में स्वाभाविक है और केवल बाहरी आकर्षण के बजाय अनुग्रहपूर्ण चरित्र को व्यक्त करती है।
- source_word: תִּתְמֹךְ / יִתְמְכוּ
  choice: प्राप्त करती है / प्राप्त करते हैं
  rationale: תמך का मूल अर्थ ‘थामना, सहारा देना, पकड़े रखना’ है; यहाँ दोनों समानांतर खंडों में किसी वस्तु को अपने अधिकार में लेने या सुरक्षित करने का भाव संभव है। मुख्य पाठ में ‘प्राप्त करना’ सहज हिन्दी देता है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: כָּבוֹד
  choice: सम्मान
  rationale: नीतिवचन के इस संदर्भ में शब्द सामाजिक आदर या प्रतिष्ठा को दर्शाता है, न कि दृश्य महिमा को।
- source_word: עָרִיצִים
  choice: निर्दयी पुरुष
  rationale: यह शब्द हिंसक, क्रूर या दमनकारी लोगों के लिए प्रयुक्त होता है। ‘निर्दयी पुरुष’ अर्थ की व्यापकता बनाए रखते हुए अनावश्यक रूप से राजनीतिक ‘तानाशाह’ का भाव नहीं जोड़ता।
- source_word: עֹשֶׁר
  choice: धन
  rationale: यह भौतिक संपन्नता को दर्शाने वाला सामान्य शब्द है; ‘धन’ स्पष्ट, संक्षिप्त और ‘सम्मान’ के साथ स्वाभाविक विरोध प्रस्तुत करता है।
