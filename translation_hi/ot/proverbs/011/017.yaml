  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन शैली। 'दयालु' और 'क्रूर' का सीधा विरोध रखा गया है, जबकि पादटिप्पणी में स्रोत के देह/कुटुम्ब सम्बन्धी वास्तविक अर्थ-विकल्प को बताया गया है।
