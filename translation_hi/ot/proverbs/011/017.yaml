source:
  edition: WLC
  text: גֹּמֵ֣ל נַ֭פְשׁ/וֹ אִ֣ישׁ חָ֑סֶד וְ/עֹכֵ֥ר שְׁ֝אֵר֗/וֹ אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/017.yaml
  text: A kind man benefits himself[a], but a cruel man troubles his own flesh.
translation:
  language: hi
  text: दयालु मनुष्य अपना ही भला करता है,[a] पर क्रूर मनुष्य अपने ही शरीर को दुःख देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राण का भला करता है।” दूसरे चरण में “अपने ही शरीर” का अर्थ “अपने ही कुटुम्ब” भी हो सकता है।
    reason: नֶפֶשׁ और שְׁאֵר के अर्थ-क्षेत्रों तथा सम्भावित वैकल्पिक समानांतरता को सुरक्षित रखना।
lexical_decisions:
- source_word: גֹּמֵל
  choice: भला करता है
  rationale: यहाँ कृदन्त रूप किसी के लिए अच्छा करने या लाभ पहुँचाने का अर्थ देता है; हिन्दी में यह स्वाभाविक है और दूसरे चरण के हानिकारक कार्य के साथ स्पष्ट विरोध बनाता है।
- source_word: נַפְשׁוֹ
  choice: अपना ही
  rationale: נפש यहाँ अलग 'आत्मा' की अपेक्षा व्यक्ति स्वयं को सूचित करता है। 'अपना ही भला' व्यावहारिक और आत्मवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: पुल्लिंग एकवचन को प्रतिनिधिक नीतिवचनात्मक रूप में रखा गया है।
- source_word: חָסֶד
  choice: दयालु
  rationale: यहाँ חסד मनुष्य के चरित्र की कृपालु और हितकारी प्रवृत्ति बताता है, न कि अनिवार्यतः वाचा-संबंधी तकनीकी अर्थ।
- source_word: עֹכֵר
  choice: दुःख देता है
  rationale: क्रिया संकट, हानि या परेशानी पहुँचाने का भाव रखती है; यह हिन्दी में स्पष्ट है और 'भला करता है' के विपरीत बैठती है।
- source_word: שְׁאֵרוֹ
  choice: अपने ही शरीर
  rationale: שְׁאֵר का मूल बिंब मांस/देह है और पहले चरण के נפשוֹ के साथ समानांतरता में स्वयं की देह सम्भावित मुख्य अर्थ है; सम्बन्धी या कुटुम्ब भी सम्भव है।
- source_word: אַכְזָרִי
  choice: क्रूर मनुष्य
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; यह पहले चरण के 'दयालु मनुष्य' के साथ स्पष्ट विरोध बनाए रखता है।
theological_decisions: []
