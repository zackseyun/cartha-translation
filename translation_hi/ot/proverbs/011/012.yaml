source:
  edition: WLC
  text: בָּז לְ/רֵעֵ֥/הוּ חֲסַר לֵ֑ב וְ/אִ֖ישׁ תְּבוּנ֣וֹת יַחֲרִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/012.yaml
  text: Whoever despises his neighbor lacks sense[c][b][a], but a man of understanding keeps silent.
translation:
  language: hi
  text: जो अपने पड़ोसी[a] को तुच्छ समझता है, उसमें समझ की कमी है[b], परन्तु समझदार पुरुष[c] चुप रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने मित्र’ अथवा ‘अपने साथी’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘हृदय की कमी वाला’; यहाँ ‘हृदय’ समझ और निर्णय-क्षमता के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘पुरुष’ के लिए पुल्लिंग एकवचन शब्द है, जिसका प्रयोग यहाँ प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: तुच्छ समझता है
  rationale: यह कृदन्त किसी व्यक्ति को नीचा या तुच्छ मानने का भाव व्यक्त करता है। ‘तुच्छ समझता है’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक तिरस्कार को स्पष्ट करता है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। नीतिवचन के व्यापक सामाजिक संदर्भ में ‘पड़ोसी’ निकट मित्रता तक अर्थ को सीमित किए बिना सम्बन्धित दूसरे व्यक्ति का बोध कराता है।
- source_word: חֲסַר לֵב
  choice: उसमें समझ की कमी है
  rationale: शाब्दिक रूप से यह ‘हृदय की कमी वाला’ है, पर इब्रानी मुहावरे में לֵב निर्णय और समझ की भीतरी क्षमता को दर्शाता है। चुना हुआ वाक्यांश हिन्दी में इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וְאִישׁ תְּבוּנוֹת
  choice: परन्तु समझदार पुरुष
  rationale: אִישׁ व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ प्रतिनिधिक अर्थ रखता है। תְּבוּנוֹת रूपतः बहुवचन होते हुए विवेक या समझ के गुण को व्यक्त करता है; ‘समझदार पुरुष’ संक्षिप्त और स्वाभाविक है।
- source_word: יַחֲרִישׁ
  choice: चुप रहता है
  rationale: यह क्रिया मौन रहने या बोलने से अपने को रोकने का अर्थ देती है। ‘चुप रहता है’ जानबूझकर बरते गए संयम को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְאִישׁ में प्रतिनिधिक पुल्लिंग भाषा
  choice: समझदार पुरुष
  alternative: समझदार व्यक्ति
  rationale: मूल इब्रानी के पुल्लिंग एकवचन रूप को बनाए रखा गया है, साथ ही पादटिप्पणी स्पष्ट करती है कि नीतिवचन में इसका प्रयोग प्रतिनिधिक है और कथन केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन-सुलभ संक्षिप्त शैली रखी गई है। ‘परन्तु’ स्पष्ट विरोध को बनाए रखता है; ‘चुप रहता है’ बनावटी या अत्यधिक संस्कृतनिष्ठ अभिव्यक्ति से बचते हुए संयम का भाव देता है।
