  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों समांतर पंक्तियों में नैतिक चरित्र और उसके परिणाम का विरोध स्पष्ट रखा गया है। ‘धार्मिकता’ पारंपरिक बाइबलीय शब्दावली से निरंतरता रखती है, जबकि ‘खरे लोग’ और ‘फँस जाते हैं’ सामान्य पाठक के लिए स्वाभाविक हैं।
