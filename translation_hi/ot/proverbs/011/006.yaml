  yaml_path: translation/ot/proverbs/011/006.yaml
  text: The righteousness of the upright rescues them[a], but the treacherous are caught by their own desire.
translation:
  language: hi
  text: खरे लोगों की धार्मिकता उन्हें बचाती है, पर विश्वासघाती अपनी ही लालसा के कारण फँस जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पर विश्वासघाती अपनी विपत्ति में पकड़े जाते हैं” अथवा “अपने विनाश के कारण पकड़े जाते हैं।” यहाँ प्रयुक्त इब्रानी संज्ञा विनाशकारी इच्छा या लालसा के साथ-साथ विपत्ति या विनाश भी दर्शा सकती है। मुख्य पाठ इसे मन के भीतर की उस लालसा के अर्थ में लेता है जो उन्हें फँसा देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: धार्मिकता
  rationale: यहाँ संज्ञा उस नैतिक गुण और आचरण को व्यक्त करती है जो सही और न्यायपूर्ण है। ‘धार्मिकता’ नीतिवचन की नैतिक शब्दावली से मेल खाती है और इसे केवल कानूनी ‘न्याय’ या अपेक्षाकृत संकुचित ‘ईमानदारी’ तक सीमित नहीं करती।
- source_word: יְשָׁרִים
  choice: खरे लोग
  rationale: शब्द का आशय नैतिक रूप से सीधे और निष्कपट लोगों से है। ‘खरे लोग’ आधुनिक हिन्दी में स्वाभाविक और सुबोध है तथा ‘सीधे’ के भोलेपन वाले संभावित अर्थ से बचता है।
- source_word: תַּצִּילֵם
  choice: उन्हें बचाती है
  rationale: नצל का हिफ़ील रूप संकट से छुड़ाने या बचाने का भाव देता है। ‘बचाती है’ इस व्यावहारिक नीतिवचन में स्वाभाविक है और अनावश्यक रूप से तकनीकी धार्मिक अर्थ नहीं जोड़ता।
- source_word: וּבְהַוַּת
  choice: अपनी ही लालसा में
  rationale: הַוָּה का अर्थ विनाशकारी इच्छा या लालसा हो सकता है, जबकि ב को यहाँ उस फंदे या परिस्थिति के रूप में व्यक्त किया गया है जिसमें वे फँसते हैं। ‘अपनी ही’ हिन्दी में अंतर्निहित आत्म-विनाशकारी संबंध स्पष्ट करता है; संज्ञा के ‘विपत्ति/विनाश’ वाले अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בֹּגְדִים
  choice: विश्वासघाती
  rationale: यह उन लोगों का चरित्र-प्रकार बताता है जो छल या विश्वासघात करते हैं। ‘विश्वासघाती’ अर्थ को स्पष्ट रखता है, पर इसे केवल राजनीतिक गद्दारी या केवल धार्मिक अविश्वास तक सीमित नहीं करता।
- source_word: יִלָּכֵדוּ
  choice: फँस जाते हैं
  rationale: लכד का निफ़ाल रूप पकड़े या जाल में फँसाए जाने को दर्शाता है। ‘फँस जाते हैं’ लालसा के आत्म-विनाशकारी फंदे की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
