id: PRO.11.7
reference: Proverbs 11:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/מ֤וֹת אָדָ֣ם רָ֭שָׁע תֹּאבַ֣ד תִּקְוָ֑ה וְ/תוֹחֶ֖לֶת אוֹנִ֣ים אָבָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/007.yaml
  text: When a wicked man dies[a], his hope perishes, and the expectation of wealth comes to nothing.
translation:
  language: hi
  text: 'जब दुष्ट मनुष्य मरता है, तो उसकी आशा मिट जाती है,

    और सामर्थ्य[a] की उम्मीद भी नष्ट हो जाती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बलवानों की उम्मीद भी नष्ट हो जाती है।” यहाँ जिस इब्रानी शब्द का अनुवाद “सामर्थ्य” किया गया है, वह कठिन है; उसका अर्थ “बलवानों” या संभवतः “धन-संपत्ति” भी हो सकता है।
    reason: इब्रानी אוֹנִים की शब्दार्थगत अनिश्चितता और वैकल्पिक व्याख्या को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּמוֹת
  choice: जब ... मरता है
  rationale: בְּ के साथ מות का infinitive construct कालवाचक उपवाक्य बनाता है; आधुनिक हिन्दी में ‘जब ... मरता है’ इसका स्वाभाविक और सटीक रूप है।
- source_word: אָדָם רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: यहाँ אָדָם किसी एक प्रतिनिधि व्यक्ति को सूचित करता है और רָשָׁע नीतिवचन में नैतिक रूप से दुष्ट व्यक्ति के लिए सामान्य शब्द है। ‘दुष्ट मनुष्य’ स्रोत की अर्थ-सीमा और गरिमापूर्ण शैली दोनों बनाए रखता है।
- source_word: תֹּאבַד תִּקְוָה
  choice: उसकी आशा मिट जाती है
  rationale: אבד का अर्थ खो जाना या समाप्त हो जाना है। ‘मिट जाती है’ मृत्यु के साथ आशा के अंत को स्वाभाविक हिन्दी में व्यक्त करता है; सम्बन्धसूचक ‘उसकी’ हिन्दी में निहित संदर्भ स्पष्ट करता है।
- source_word: וְתוֹחֶלֶת
  choice: और ... उम्मीद
  rationale: תוחלת और תקוה निकटार्थी हैं। पहले पद में ‘आशा’ और दूसरे में ‘उम्मीद’ रखने से समानांतरता बनी रहती है, पर दोनों शब्द अनावश्यक रूप से एक ही नहीं कर दिए जाते।
- source_word: אוֹנִים
  choice: सामर्थ्य की
  rationale: यह कठिन रूप און/אֹון से जुड़कर शक्ति या सामर्थ्य का अर्थ दे सकता है। ‘सामर्थ्य’ मूल की अमूर्त अर्थ-संभावना को बनाए रखता है; ‘बलवानों’ की व्यक्तिगत बहुवचन व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָבָדָה
  choice: नष्ट हो जाती है
  rationale: यह भी אבד से है। दूसरे पद में ‘नष्ट हो जाती है’ पहले पद के अर्थ-क्षेत्र को बनाए रखते हुए हिन्दी में कठोर पुनरुक्ति से बचाता है।
theological_decisions:
- issue: אָדָם का लिंग और व्यक्तिवाचक दायरा
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: नीतिवचन किसी प्रतिनिधि मानव की बात करता है, समस्त मानवजाति की नहीं। हिन्दी में ‘मनुष्य’ स्रोत के सामान्य मानवीय संदर्भ को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक रूप से केवल पुरुष तक अर्थ सीमित नहीं करता।
- issue: אוֹנִים की कठिन व्याख्या
  choice: सामर्थ्य
  alternative: बलवानों; धन-संपत्ति
  rationale: व्यंजनात्मक रूप शक्ति/सामर्थ्य से सबसे सीधे जुड़ता है, पर इसे ‘बलवानों’ के रूप में समझना भी संभव है; कुछ परंपराएँ साधन या धन-संपत्ति का भाव लेती हैं। मुख्य पाठ में संभावित अमूर्त अर्थ रखा गया है और वास्तविक अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। दो समानांतर पंक्तियों में ‘आशा/उम्मीद’ तथा ‘मिट जाती है/नष्ट हो जाती है’ का प्रयोग अर्थगत समानांतरता बनाए रखते हुए स्वाभाविक विविधता देता है।
