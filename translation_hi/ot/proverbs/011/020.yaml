reference: Proverbs 11:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה עִקְּשֵׁי לֵ֑ב וּ֝/רְצוֹנ֗/וֹ תְּמִ֣ימֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/020.yaml
  text: The crooked in heart are an abomination to Yahweh[b][a], but those blameless in their way are his delight.
translation:
  language: hi
  text: कुटिल मन वाले याहवे के लिए घृणित हैं, पर निष्कलंक आचरण वाले उसे प्रिय हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द प्रबल नैतिक घृणा और अस्वीकार को व्यक्त करता है। हिंदी में ‘घृणित’ पद की तीव्रता बनाए रखता है और वाक्य को स्वाभाविक भी रहने देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עִקְּשֵׁי לֵב
  choice: टेढ़े मनवाले
  rationale: עִקְּשֵׁי नैतिक टेढ़ेपन या विकृति का बोध कराता है। לֵב यहाँ केवल भावना नहीं, बल्कि व्यक्ति के भीतर के विचार, इच्छा और नैतिक अभिमुखता को सूचित करता है; आधुनिक हिंदी में ‘मन’ इस व्यापक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: וּרְצוֹנוֹ
  choice: उसे प्रिय हैं
  rationale: רָצוֹן प्रसन्नता, अनुग्रह या स्वीकार्यता व्यक्त कर सकता है। विरोधी समानांतरता में ‘उसे प्रिय हैं’ सहज हिंदी में परमेश्वर की प्रसन्न स्वीकृति को प्रकट करता है।
- source_word: תְּמִימֵי דָרֶךְ
  choice: निर्दोष चाल चलनेवाले
  rationale: תָּמִים खराई, संपूर्णता या निर्दोषता का और דֶּרֶךְ जीवन-आचरण का बोध कराता है। ‘निर्दोष चाल चलनेवाले’ मूल रूपक को रखते हुए आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। हिंदी बाइबल-परंपरा में पहचाने जानेवाले रूप ‘यहोवा’ को चुना गया।
- issue: לֵב का मानवशास्त्रीय अर्थ
  choice: मन
  alternative: हृदय
  rationale: इब्रानी ज्ञान-साहित्य में לֵב विचार, इच्छा और नैतिक केंद्र को समेटता है। ‘मन’ सामान्य आधुनिक हिंदी में इस व्यापक आशय को ‘हृदय’ की अपेक्षा अधिक सहजता से संप्रेषित करता है।
- issue: תְּמִימֵי דָרֶךְ में निर्दोषता का स्वरूप
  choice: आचरण की खराई के अर्थ में ‘निर्दोष चाल चलनेवाले’
  alternative: निष्पाप लोग
  rationale: यह पद जीवन-पथ की संपूर्णता और खराई बताता है, पूर्ण पापहीनता का व्यवस्थित धर्मवैज्ञानिक दावा नहीं; इसलिए आचरण-संबंधी मूल मुहावरा बनाए रखा गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की समानांतर काव्य-रचना के अनुरूप रखी गई है। ‘टेढ़े मनवाले’ और ‘निर्दोष चाल चलनेवाले’ के बीच नैतिक विरोध स्पष्ट है; शैली गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध है।
