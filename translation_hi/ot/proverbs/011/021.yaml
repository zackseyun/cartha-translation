id: PRO.11.21
reference: Proverbs 11:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָ֣ד לְ֭/יָד לֹא יִנָּ֣קֶה רָּ֑ע וְ/זֶ֖רַע צַדִּיקִ֣ים נִמְלָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/021.yaml
  text: Hand to hand[a], the evil will not go unpunished, but the offspring of the righteous will escape.
translation:
  language: hi
  text: हाथ से हाथ[a], दुष्ट दण्ड पाए बिना नहीं छूटेगा, पर धर्मियों की सन्तान बच निकलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हाथ से हाथ।’ यह इब्रानी मुहावरा सम्भवतः ‘निश्चय ही’ या दृढ़ निश्चितता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד לְיָד
  choice: हाथ से हाथ
  rationale: इब्रानी पद का शब्दचित्र बनाए रखा गया है। हिन्दी में यह असामान्य और कुछ हद तक अस्पष्ट है, इसलिए सम्भावित निश्चयात्मक अर्थ पादटिप्पणी में दिया गया है; ‘हाथ पर हाथ’ से बचा गया क्योंकि हिन्दी में उसका अर्थ निष्क्रिय बैठे रहना होता है।
- source_word: יִנָּקֶה
  choice: दण्ड पाए बिना नहीं छूटेगा
  rationale: निफ़अल रूप यहाँ दण्ड से मुक्त रहने या निर्दोष ठहरकर छूट जाने का भाव देता है। यह हिन्दी प्रयोग नैतिक परिणाम को स्पष्ट करता है, पर औपचारिक न्यायालय तक अर्थ को सीमित नहीं करता।
- source_word: רָּע
  choice: दुष्ट
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में एक प्रतिनिधि दुष्ट व्यक्ति को दर्शाता है। ‘दुष्ट’ स्वाभाविक, संक्षिप्त और नीतिवचन की शैली के अनुकूल है।
- source_word: וְזֶרַע
  choice: पर … सन्तान
  rationale: זֶרַע यहाँ वास्तविक बीज नहीं, वंश या सन्तान को दर्शाता है। समानान्तर पंक्तियों का विरोध हिन्दी में ‘पर’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: צַדִּיקִים
  choice: धर्मियों की
  rationale: बहुवचन संज्ञार्थक विशेषण को ‘धर्मी लोगों’ के अर्थ में संक्षिप्त और प्रचलित रूप से व्यक्त किया गया है।
- source_word: נִמְלָט
  choice: बच निकलेगी
  rationale: यह क्रिया बच निकलने या छुड़ाए जाने दोनों का भाव रख सकती है। ‘बच निकलेगी’ कर्ता की मुक्ति बताती है और यह अनिर्णीत छोड़ती है कि संकट दण्ड, विपत्ति या दुष्ट के भाग्य में सहभागिता है।
theological_decisions:
- issue: יָד לְיָד मुहावरे का अर्थ
  choice: मुख्य पाठ में ‘हाथ से हाथ’ का शब्दचित्र बनाए रखना
  alternative: ‘निश्चय ही’ या ‘यह निश्चित है’
  rationale: इब्रानी मुहावरा अस्पष्ट है और सम्भवतः दृढ़ निश्चय व्यक्त करता है, पर इसका ठीक व्यंजित अर्थ विवादित है। मुख्य पाठ में चित्र और पादटिप्पणी में सम्भावित अर्थ देने से अस्पष्टता को अनुचित रूप से समाप्त नहीं किया जाता।
- issue: רָּע का संज्ञार्थक पुल्लिंग एकवचन
  choice: दुष्ट
  alternative: बुरा व्यक्ति
  rationale: ‘दुष्ट’ हिन्दी में व्यक्ति-सूचक संज्ञार्थक प्रयोग है और मूल के एकवचन प्रतिनिधि रूप को बिना ‘मनुष्य’ जैसा अतिरिक्त शब्द जोड़े सुरक्षित रखता है।
- issue: न्यायी सन्तान के बचने का स्वरूप
  choice: बच निकलेगी
  alternative: छुड़ाई जाएगी
  rationale: मूल क्रिया बच निकलने अथवा छुटकारा पाने का अर्थ दे सकती है; सक्रिय छुड़ाने वाले को स्पष्ट रूप से जोड़ना मूल से अधिक निश्चित होगा।
translation_notes:
  register: भाषा संक्षिप्त, आधुनिक और नीतिवचन की गरिमामय शैली के अनुरूप रखी गई है। ‘सन्तान’ सामूहिक एकवचन है, इसलिए उसके साथ ‘बच निकलेगी’ आया है।
