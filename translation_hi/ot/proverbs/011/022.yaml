  to: जैसे सूअर की थूथन में सोने की नथ, वैसे ही विवेक से रहित सुंदर स्त्री।[a]
  rationale: मुख्य पाठ में ‘विवेक से विमुख’ को ‘विवेक से रहित’ किया गया है, जिससे मूल कहावत का अभिप्राय—बाहरी सुंदरता के साथ विवेक का अभाव—अधिक स्वाभाविक हिन्दी में और बिना अतिरिक्त सक्रिय आशय के व्यक्त होता है।
