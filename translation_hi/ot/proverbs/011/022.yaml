  yaml_path: translation/ot/proverbs/011/022.yaml
  text: Like a gold ring in a pig’s snout is a beautiful woman who lacks discretion[a].
translation:
  language: hi
  text: जैसे सूअर की थूथन में सोने की नथ, वैसे ही विवेक से रहित सुंदर स्त्री।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे सूअर की थूथन में सोने की नथ, वैसे ही समझ-बूझ से रहित सुंदर स्त्री।”
    reason: וְסָרַת טָעַם में טָעַם के ‘समझ-बूझ’ अथवा व्यावहारिक विवेक के अर्थ को वैकल्पिक रूप में स्पष्ट करता है।
lexical_decisions:
- source_word: נֶזֶם
  choice: नथ
  rationale: यह शब्द अंगूठी या नाक में पहने जाने वाले आभूषण को दर्शाता है। בְּאַף से स्थान स्पष्ट होने के कारण हिन्दी में स्वाभाविक और चित्रात्मक ‘नथ’ उपयुक्त है।
- source_word: זָהָב
  choice: सोने की
  rationale: यह सोने के लिए सामान्य शब्द है और बहुमूल्य आभूषण तथा सूअर के बीच तीखा विरोध बनाए रखता है।
- source_word: בְּאַף חֲזִיר
  choice: सूअर की थूथन में
  rationale: אַף यहाँ शरीर के अंग ‘नाक’ के अर्थ में है; सूअर के लिए ‘थूथन’ आधुनिक हिन्दी में अधिक स्वाभाविक और सजीव है।
- source_word: אִשָּׁה יָפָה
  choice: सुन्दर स्त्री
  rationale: यहाँ वैवाहिक संदर्भ नहीं है, इसलिए אִשָּׁה का अर्थ ‘स्त्री’ है; יָפָה शारीरिक सुन्दरता का सकारात्मक वर्णन करता है।
- source_word: וְסָרַת טָעַם
  choice: विवेक से विमुख
  rationale: स्रोत अभिव्यक्ति शाब्दिक रूप से ऐसी स्त्री को बताती है जो טַעַם से हट गई है। ज्ञान-साहित्य में טַעַם समझ, निर्णय-बुद्धि या विवेक है; ‘विवेक से विमुख’ इस सक्रिय अर्थ और नैतिक-बौद्धिक तनाव को सुरक्षित रखता है।
