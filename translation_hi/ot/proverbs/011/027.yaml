  text: שֹׁ֣חֵֽר ט֭וֹב יְבַקֵּ֣שׁ רָצ֑וֹן וְ/דֹרֵ֖שׁ רָעָ֣ה תְבוֹאֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/027.yaml
  text: Whoever diligently seeks good seeks favor[c][b][a], but evil comes to the one who searches for it.
translation:
  language: hi
  text: जो भलाई को लगन से[a] खोजता है, वह कृपा[b] की खोज करता है; पर जो बुराई की खोज करता है, उस पर बुराई आ पड़ेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भलाई को सवेरे खोजता है।” इब्रानी क्रिया में लगन या उत्सुकता से खोजने के साथ सवेरे खोजने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “कृपा” का अर्थ व्यापक रूप से स्वीकृति या सद्भावना हो सकता है; इसका स्रोत परमेश्वर, लोग, या दोनों हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחֵר
  choice: लगन से खोजता है
  rationale: यह कृदन्त मन लगाकर, उत्सुकता या तत्परता से खोजने का भाव देता है। ‘लगन से’ आधुनिक हिन्दी में इस गहनता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹב
  choice: भलाई
  rationale: यहाँ विशेषण संज्ञा के रूप में प्रयुक्त है और नैतिक तथा व्यावहारिक दोनों अर्थों में ‘जो अच्छा है’ को दर्शाता है।
- source_word: יְבַקֵּשׁ
  choice: पाना चाहता है
  rationale: मूल क्रिया ‘खोजना/चाहना’ है। पहले खंड में उसी धात्वर्थ को शब्दशः दोहराने पर हिन्दी अस्वाभाविक होती; यह रूप कृपा की तलाश और अभिलाषा को सहजता से व्यक्त करता है।
- source_word: רָצוֹן
  choice: कृपा
  rationale: शब्द स्वीकृति, सद्भाव या अनुग्रह को सूचित कर सकता है। ‘कृपा’ स्रोत को अनिर्दिष्ट रखते हुए संक्षिप्त और गरिमापूर्ण है।
- source_word: וְדֹרֵשׁ
  choice: पर जो ... की खोज करता है
  rationale: वाव का अनुवाद विरोधसूचक ‘पर’ किया गया है क्योंकि दोनों पंक्तियाँ परस्पर विरोधी समानांतरता बनाती हैं; דָּרַשׁ को ‘खोज करता है’ से व्यक्त किया गया है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह नैतिक बुराई के साथ हानि या विपत्ति का अर्थ भी रख सकता है। ‘बुराई’ खोजी गई दुष्टता और लौटकर आने वाले अनिष्ट—दोनों की अर्थ-व्याप्ति बचाती है।
- source_word: תְבוֹאֶנּוּ
  choice: उसी पर बुराई आ पड़ेगी
  rationale: क्रिया भावी/सामान्य निश्चितता के साथ ‘उसके पास/उस पर आएगी’ कहती है। ‘आ पड़ेगी’ हिन्दी में अनिष्ट के किसी पर आ पहुँचने का स्वाभाविक भाव देता है; ‘उसी’ प्रत्यय के पुरुषवाचक संकेत को खोजने वाले से जोड़ता है।
theological_decisions:
- issue: רָצוֹן में कृपा का स्रोत
  choice: ‘कृपा’ को बिना यह बताए रखा गया कि वह परमेश्वर से है या मनुष्यों से।
  alternative: ‘परमेश्वर की कृपा’, ‘लोगों की सद्भावना’, अथवा ‘स्वीकृति’।
  rationale: इब्रानी पाठ कृपा या स्वीकृति का स्रोत स्पष्ट नहीं करता। व्यापक अनुवाद मानवीय और ईश्वरीय—दोनों संभावनाएँ खुली रखता है।
- issue: רָעָה का नैतिक और परिणामी अर्थ
  choice: दोनों स्थानों पर ‘बुराई’ रखा गया, जिससे खोजी गई बुराई और उस पर आने वाला अनिष्ट एक ही शब्द से जुड़े रहें।
  alternative: पहले ‘बुराई’ और दूसरे में ‘विपत्ति’ या ‘हानि’।
  rationale: अलग शब्द परिणाम का अर्थ स्पष्ट कर सकते हैं, किंतु मूल की शब्द-पुनरावृत्ति और जानबूझकर रखी गई नैतिक-परिणामी अर्थच्छाया खो देंगे।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘लगन से’ שֹׁחֵר की तीव्रता व्यक्त करता है। ‘बुराई’ की पुनरावृत्ति मूल की शब्द-संगति और नैतिक/हानिकारक द्विअर्थकता को सुरक्षित रखती है।
