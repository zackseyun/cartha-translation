lexical_decisions:
- source_word: הוֹלֵךְ רָכִיל
  choice: जो चुगली करता फिरता है
  rationale: इब्रानी मुहावरे में शाब्दिक रूप से ‘रखील बनकर घूमने वाला’ है। यह आदतन दूसरों की निजी बातें फैलाने वाले व्यक्ति को दर्शाता है; ‘चुगली करता फिरता है’ चालू गतिविधि और हानिकारक बात फैलाने—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: מְגַלֶּה סּוֹד
  choice: भेद खोल देता है
  rationale: מְגַלֶּה का अर्थ प्रकट या उजागर करना और סוֹד का यहाँ अर्थ गोपनीय बात है। ‘भेद खोल देता है’ आधुनिक हिन्दी में स्पष्ट और कहावत-सुलभ है।
- source_word: נֶאֱמַן רוּחַ
  choice: जो मन से विश्वासयोग्य है
  rationale: शाब्दिक संरचना ‘आत्मा/मन में विश्वासयोग्य’ है। यहाँ רוּחַ व्यक्ति की भीतरी वृत्ति या स्वभाव को सूचित करता है; ‘मन से विश्वासयोग्य’ इस आंतरिक विश्वसनीयता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: מְכַסֶּה דָבָר
  choice: बात छिपाए रखता है
  rationale: מְכַסֶּה का मूल भाव ढकना है और דָבָר व्यापक रूप से बात या मामला हो सकता है। संदर्भ में आशय गोपनीय जानकारी को प्रकट न करने का है, इसलिए ‘बात छिपाए रखता है’ सहज है।
