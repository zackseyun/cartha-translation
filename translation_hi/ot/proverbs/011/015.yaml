- source_word: שֹׂנֵא
  choice: घृणा करता है
  rationale: मूल का प्रबल शब्द जानबूझकर नरम नहीं किया गया; नीतिवचन की भाषा में यह दृढ़ विरक्ति दर्शाता है।
- source_word: תֹקְעִים
  choice: हाथ पर हाथ मारकर जमानत देना
  rationale: मूल में हाथ मारने की ठोस सांस्कृतिक मुद्रा है, जिससे प्रतिज्ञा या जमानत पक्की की जाती थी। हिंदी में चित्र और आशय दोनों स्पष्ट किए गए हैं।
- source_word: בּוֹטֵחַ
  choice: सुरक्षित रहता है
  rationale: यह पिछले खंड में बताई आर्थिक हानि से बचाव और निश्चिंत सुरक्षा का भाव संक्षेप में व्यक्त करता है।
