  yaml_path: translation/ot/proverbs/011/015.yaml
  text: He will surely suffer harm who becomes surety for a stranger[b][a], but whoever hates striking hands is secure.
translation:
  language: hi
  text: जो किसी पराए के लिए जामिन बनता है, वह निश्चय ही हानि उठाएगा; पर जो हाथ पर हाथ मारने से[a][b] घृणा करता है, वह सुरक्षित रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाथ पर हाथ मारना”—प्रतिज्ञा या जमानत पक्की करने की एक प्राचीन मुद्रा।
    reason: cultural_note
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “पर जो जमानत देने से घृणा करता है, वह सुरक्षित रहता है।”'
    reason: lexical_alternative
