  yaml_path: translation/ot/proverbs/011/029.yaml
  text: Whoever troubles his own house will inherit wind[b][a], and the fool will be a servant to the wise of heart.
translation:
  language: hi
  text: जो अपने घराने को मुसीबत में डालता है, वह हवा को विरासत में पाएगा[a]; और मूर्ख विवेकी का सेवक होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हवा को विरासत में पाएगा’ का आशय है कि उसके हिस्से में कुछ ठोस या लाभकारी नहीं आएगा; ‘हवा’ यहाँ असारता या निष्फलता का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹכֵר
  choice: विपत्ति लाता है
  rationale: यह कृदंत सक्रिय रूप से संकट, हानि या विपत्ति लाने वाले व्यक्ति को दर्शाता है; यह चयन अर्थ को स्पष्ट रखता है, पर पूर्ण विनाश का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: בֵּיתוֹ
  choice: अपने ही घराने
  rationale: यहाँ 'घर' केवल भवन नहीं, परिवार या गृहस्थी भी दर्शा सकता है। 'घराना' इस व्यापक सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִנְחַל
  choice: वारिस होगा
  rationale: क्रिया का मूल अर्थ विरासत पाना या अधिकार में लेना है। 'वारिस होगा' उस व्यंग्य को बनाए रखता है कि ऐसे व्यक्ति के हिस्से में केवल हवा आएगी।
- source_word: רוּחַ
  choice: हवा
  rationale: यहाँ हवा असारता, रिक्तता या निष्फलता का रूपक है। शाब्दिक बिंब को मुख्य पाठ में बनाए रखकर उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְעֶבֶד
  choice: सेवक होगा
  rationale: क्रियारहित उपवाक्य भावी परिणाम बताता है। 'सेवक होगा' स्वाभाविक हिन्दी है और दासत्व की कानूनी स्थिति को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: नीतिवचन साहित्य में यह नैतिक और व्यावहारिक विवेक से रहित व्यक्ति का प्रचलित प्रकार है।
- source_word: לַחֲכַם־לֵב
  choice: बुद्धिमान व्यक्ति का
  rationale: शाब्दिक अर्थ 'हृदय से बुद्धिमान' है, अर्थात भीतर से विवेकशील व्यक्ति। सहज आधुनिक हिन्दी के लिए 'बुद्धिमान व्यक्ति' चुना गया है, जबकि मूल आशय सुरक्षित है।
