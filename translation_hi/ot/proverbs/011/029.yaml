  source_fidelity: The draft correctly conveys the two proverbial consequences and preserves the Hebrew image of inheriting ‘wind.’ However, ‘अपने ही घराने पर विपत्ति लाता है’ is less direct than the Hebrew’s idiom of bringing trouble upon one’s household, and ‘बुद्धिमान व्यक्ति’ slightly flattens the characterization ‘wise of heart.’
  naturalness: ‘हवा का वारिस होगा’ is understandable but not idiomatic modern Hindi. ‘हवा को विरासत में पाएगा’ preserves the inheritance metaphor in natural Hindi. ‘घराने को मुसीबत में डालता है’ is also more natural than placing calamity ‘पर’ the household.
  terminology: ‘घराना’ suitably represents Hebrew בֵּיתוֹ in its household/family sense. ‘विवेकी’ is a natural Hindi wisdom-register rendering for ‘wise of heart,’ without importing theological interpretation. ‘सेवक’ appropriately avoids asserting a more specific legal status than the Hebrew requires.
  issues:
  - severity: medium
    issue: The phrase ‘हवा का वारिस होगा’ is idiomatically strained.
    rationale: Hindi normally expresses this relation as receiving something ‘विरासत में’; this retains the Hebrew verb’s irony while reading naturally.
  - severity: low
    issue: ‘घराने पर विपत्ति लाता है’ is a somewhat awkward rendering of the active Hebrew idiom.
    rationale: ‘घराने को मुसीबत में डालता है’ naturally communicates causing trouble to one’s own household without strengthening the sense to total ruin.
  - severity: low
    issue: ‘बुद्धिमान व्यक्ति’ does not reflect the Hebrew’s ‘wise of heart’ characterization as closely as a concise Hindi wisdom term can.
    rationale: ‘विवेकी’ expresses a person marked by inward discernment and fits proverbial Hindi style.
