translation_notes:
  register: आधुनिक, गरिमापूर्ण और लोकोक्तिपरक हिन्दी। पहले पद में 'अपने ही' आत्मविनाशकारी विडंबना को उभारता है। 'घराने' से परिवार/गृहस्थी का अर्थ स्पष्ट होता है; 'हवा' का मूल रूपक सुरक्षित रखा गया है।
