source:
  edition: WLC
  text: תַּאֲוַ֣ת צַדִּיקִ֣ים אַךְ ט֑וֹב תִּקְוַ֖ת רְשָׁעִ֣ים עֶבְרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/023.yaml
  text: The desire of the righteous is only good[b][a], but the hope of the wicked is wrath.
translation:
  language: hi
  text: 'धर्मियों की अभिलाषा केवल भलाई है,

    पर दुष्टों की आशा[a] प्रकोप[b] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपेक्षा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘कोप’। इब्रानी में यह स्पष्ट नहीं है कि प्रकोप किसका है; इसका संकेत दुष्टों की क्रोधभरी अपेक्षा की ओर भी हो सकता है, या उन पर आने वाले प्रकोप की ओर।
    reason: alternative_reading
lexical_decisions:
- source_word: תַּאֲוַת
  choice: अभिलाषा
  rationale: यह संज्ञा इच्छा या लालसा को व्यक्त करती है। यहाँ ‘अभिलाषा’ नीतिवचन की गरिमापूर्ण शैली के अनुकूल है और दुष्टों की ‘आशा’ के साथ संतुलित विरोध बनाती है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ आधुनिक हिन्दी में नैतिक रूप से सही आचरण करने वालों के लिए स्वाभाविक बाइबलीय पद है।
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ अव्यय सीमित करने वाला अर्थ देता है—धर्मियों की अभिलाषा का विषय या परिणाम भलाई ही है।
- source_word: טוֹב
  choice: भलाई
  rationale: ‘भलाई’ मूल के संक्षिप्त ‘अच्छे/भले’ अर्थ को स्वाभाविक हिन्दी में संज्ञात्मक रूप देता है, बिना यह तय किए कि बात अभिलाषा के विषय की है या उसके परिणाम की।
- source_word: תִּקְוַת
  choice: आशा
  rationale: इस शब्द का अर्थ आशा या अपेक्षा हो सकता है। ‘आशा’ अधिक सहज है और पहले चरण की ‘अभिलाषा’ के समानांतर आती है; ‘अपेक्षा’ को पाद-टिप्पणी में रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘दुष्ट’ नैतिक श्रेणी को संक्षेप में व्यक्त करता है और ‘धर्मियों’ के स्पष्ट विरोध में है।
- source_word: עֶבְרָה
  choice: प्रकोप
  rationale: यह शब्द तीव्र क्रोध, कोप या रोष को दर्शाता है। ‘प्रकोप’ पद की गंभीरता बनाए रखता है और यह स्पष्ट नहीं करता कि यह किसका प्रकोप है।
theological_decisions:
- issue: अंतिम चरण में प्रकोप किसका है और उसका आशा से क्या संबंध है
  choice: ‘दुष्टों की आशा प्रकोप है’—मूल की संक्षिप्त नामवाचक रचना और अस्पष्टता को बनाए रखा गया है।
  alternative: ‘दुष्टों की आशा का परिणाम परमेश्वर का प्रकोप है’ अथवा ‘दुष्टों की आशा क्रोध ही है।’
  rationale: इब्रानी पाठ न तो प्रकोप के कर्ता को स्पष्ट करता है, न संबंधसूचक क्रिया को विस्तार देता है। इसलिए मुख्य पाठ में ‘परमेश्वर का’ या ‘का परिणाम’ जोड़ना मूल से अधिक निश्चित व्याख्या थोपता। पाद-टिप्पणी दोनों प्रमुख संभावनाओं को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। दोनों समानांतर चरणों की नैतिक श्रेणियाँ—‘धर्मी’ और ‘दुष्ट’—स्पष्ट हैं। ‘भलाई’ और ‘प्रकोप’ मूल की संक्षिप्तता तथा अंतिम चरण की वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
