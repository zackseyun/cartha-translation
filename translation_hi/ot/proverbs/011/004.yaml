source:
  edition: WLC
  text: לֹא יוֹעִ֣יל ה֭וֹן בְּ/י֣וֹם עֶבְרָ֑ה וּ֝/צְדָקָ֗ה תַּצִּ֥יל מִ/מָּֽוֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/004.yaml
  text: Wealth is of no use on the day of wrath[c][b][a], but righteousness delivers from death.
translation:
  language: hi
  text: कोप के दिन धन किसी काम नहीं आता,[a][c] पर धार्मिकता मृत्यु से बचाती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोप के दिन धन से कोई लाभ नहीं होता।’
    reason: lexical_alternative
  - marker: b
    text: ‘धार्मिकता’ का अनुवाद ज्ञान-साहित्य के सन्दर्भ में ‘न्यायशीलता’ या ‘सही आचरण’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘कोप का दिन’ व्यापक रूप से न्याय या विपत्ति के समय को सूचित कर सकता है; नीतिवचन इसे और अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹן
  choice: धन
  rationale: यह शब्द भौतिक संपत्ति या समृद्धि को दर्शाता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: יוֹעִיל
  choice: किसी काम नहीं आता
  rationale: हिफ़ील रूप का अर्थ लाभ पहुँचाना या उपयोगी होना है; यह हिन्दी अभिव्यक्ति उसकी निष्फलता स्पष्ट और सहज ढंग से बताती है।
- source_word: בְּיוֹם עֶבְרָה
  choice: कोप के दिन
  rationale: בְּ समय को और עֶבְרָה प्रचंड क्रोध अथवा रोष को सूचित करता है। ‘कोप के दिन’ निर्णायक न्याय या विपत्ति के समय की सम्भावना बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: नीतिवचन में यह शब्द धार्मिकता, न्यायशीलता और सही आचरण को समेट सकता है। ‘धार्मिकता’ मूल पद की व्यापक नैतिक-धार्मिक धारणा बनाए रखती है।
- source_word: תַּצִּיל
  choice: बचाती है
  rationale: हिफ़ील रूप का अर्थ छुड़ाना, बचाना या उद्धार करना है; ‘बचाती है’ सामान्य पाठक के लिए स्वाभाविक है और समानांतर कथन की संक्षिप्तता रखता है।
- source_word: מִמָּוֶת
  choice: मृत्यु से
  rationale: इब्रानी का सीधा अर्थ ‘मृत्यु से’ है; सम्भावित घातक परिणामों तक इसे सीमित किए बिना वही स्पष्ट रूप रखा गया है।
theological_decisions:
- issue: ‘कोप के दिन’ का आशय
  choice: न्याय के निर्णायक समय का सामान्य संकेत, जिसे पद स्वयं और अधिक निर्दिष्ट नहीं करता।
  alternative: मानवीय विपत्ति का समय अथवा परमेश्वर के अंतिम न्याय का दिन।
  rationale: इब्रानी कथन न्याय या विपत्ति दोनों की दिशा में समझा जा सकता है; अनुवाद किसी विस्तृत युगांत-सिद्धांत को पद पर आरोपित नहीं करता।
- issue: ‘धार्मिकता मृत्यु से बचाती है’ का आशय
  choice: ज्ञान-साहित्य के अनुसार धार्मिकता को मृत्यु से बचाने वाली बताया गया है, बिना इसे बाद के उद्धार-सिद्धांत की तकनीकी भाषा बनाने के।
  alternative: सही आचरण विनाशकारी परिणामों से जीवन बचाता है, अथवा परमेश्वर धार्मिक व्यक्ति को मृत्यु से छुड़ाता है।
  rationale: मूल कथन जानबूझकर संक्षिप्त है और कर्ता या प्रक्रिया को नहीं खोलता; हिन्दी उसी धर्मवैज्ञानिक तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कोप’ काव्यात्मक ज्ञान-साहित्य के अनुरूप संक्षिप्त है, जबकि पद की समानांतर रचना और मूल की धर्मवैज्ञानिक अस्पष्टता सुरक्षित हैं।
