id: PRO.11.5
reference: Proverbs 11:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צִדְקַ֣ת תָּ֭מִים תְּיַשֵּׁ֣ר דַּרְכּ֑/וֹ וּ֝/בְ/רִשְׁעָת֗/וֹ יִפֹּ֥ל רָשָֽׁע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/005.yaml
  text: The righteousness of the blameless makes his way straight[b][a], but the wicked falls by his wickedness.
translation:
  language: hi
  text: खरे मनुष्य की धार्मिकता उसके मार्ग को सीधा करती है[a], पर दुष्ट अपनी दुष्टता से[b] गिरता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके मार्ग को दिशा देती है” अथवा “उसका मार्ग समतल करती है।” इब्रानी क्रिया में मार्ग को सीधा या समतल करने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या “अपनी दुष्टता में।” इब्रानी वाक्यांश दुष्टता को उसके पतन का साधन भी बता सकता है और वह दशा भी जिसमें वह गिरता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקַת
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक खराई और उचित आचरण का गुण बताता है। ‘धार्मिकता’ नीतिवचन की नैतिक शब्दावली और मूल के भाव को सीधे बनाए रखती है।
- source_word: תָּמִים
  choice: खरा मनुष्य
  rationale: इस प्रसंग में यह पापरहित सिद्धता नहीं, बल्कि नैतिक संपूर्णता और निष्कपटता बताता है। ‘खरा मनुष्य’ आधुनिक हिन्दी में इस भाव को सहज रूप से व्यक्त करता है।
- source_word: תְּיַשֵּׁר
  choice: सीधा करती है
  rationale: मूल क्रिया किसी मार्ग को सीधा या समतल करने का चित्र प्रस्तुत करती है। यह अनुवाद उस रूपक को सुरक्षित रखता है।
- source_word: דַּרְכּוֹ
  choice: उसके मार्ग को
  rationale: ‘मार्ग’ नीतिवचन में व्यक्ति के आचरण और जीवन-क्रम का प्रचलित रूपक है तथा ‘सीधा’ के साथ स्वाभाविक बैठता है।
- source_word: וּבְרִשְׁעָתוֹ
  choice: अपनी दुष्टता से
  rationale: 'בְּ को यहाँ साधनवाचक समझा गया है: दुष्ट की अपनी बुराई ही उसके पतन का कारण बनती है। स्थान या दशा का अर्थ भी संभव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।'
- source_word: יִפֹּל
  choice: गिरता है
  rationale: अपूर्ण क्रिया यहाँ सार्वकालिक नीतिवचनात्मक सत्य व्यक्त करती है; हिन्दी का सामान्य वर्तमान काल इस भाव को स्वाभाविक ढंग से देता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण संज्ञा के रूप में एक प्रतिनिधि दुष्ट व्यक्ति को दर्शाता है। ‘दुष्ट’ संक्षिप्त और नीतिवचन की शैली के अनुरूप है।
theological_decisions:
- issue: एकवचन पुल्लिंग रूपों का प्रतिनिधिक प्रयोग
  choice: ‘खरा मनुष्य’, ‘उसके’ और ‘दुष्ट’ के एकवचन रूप बनाए रखे गए
  alternative: बहुवचन या लिंग-निरपेक्ष पुनर्रचना
  rationale: इब्रानी पाठ एकवचन पुल्लिंग को प्रतिनिधिक नीतिवचनात्मक रूप में प्रयोग करता है। हिन्दी में वही व्याकरणिक चित्र बनाए रखने से मूल की संरचना अनावश्यक रूप से समतल नहीं होती।
- issue: दुष्टता और पतन के बीच संबंध
  choice: दुष्टता को पतन का साधन या कारण माना गया—‘दुष्टता से’
  alternative: दुष्ट अपनी दुष्टता में गिरता है
  rationale: इब्रानी पूर्वसर्ग साधन और स्थिति, दोनों अर्थ दे सकता है। मुख्य पाठ में नैतिक कारणता को व्यक्त किया गया है, जबकि दूसरी संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और नीतिवचन की संक्षिप्त समानांतर शैली के अनुरूप रखी गई है। ‘खरा मनुष्य’ नैतिक संपूर्णता को व्यक्त करता है, जबकि ‘सीधा करती है’ मूल के मार्ग-रूपक को बनाए रखता है।
