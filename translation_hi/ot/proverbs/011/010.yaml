  text: בְּ/ט֣וּב צַ֭דִּיקִים תַּעֲלֹ֣ץ קִרְיָ֑ה וּ/בַ/אֲבֹ֖ד רְשָׁעִ֣ים רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/010.yaml
  text: In the prosperity of the righteous a city rejoices[b][a], and in the perishing of the wicked there is shouting.
translation:
  language: hi
  text: जब धर्मियों का भला होता है[a], तो नगर आनंदित होता है; और जब दुष्ट नष्ट होते हैं, तो हर्षध्वनि होती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘धर्मियों की कुशलता या समृद्धि में’ भी हो सकता है। इब्रानी में शाब्दिक रूप से धर्मियों की ‘भलाई’ या ‘कुशल-मंगल’ की बात है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उल्लासपूर्ण पुकार होती है।’ इब्रानी शब्द ऊँची, गूँजती और प्रायः उल्लासपूर्ण पुकार को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוּב
  choice: जब ... का भला होता है
  rationale: בְּ के साथ טוּב यहाँ परिस्थिति या अवसर बताता है—धर्मियों की भलाई, कुशलता अथवा समृद्ध दशा। यह हिन्दी अभिव्यक्ति अर्थ को स्वाभाविक रूप से रखती है और उसे केवल आर्थिक समृद्धि तक सीमित नहीं करती।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ नीतिवचन में नैतिक रूप से सही आचरण करने वालों की श्रेणी को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: תַּעֲלֹץ
  choice: आनन्दित होता है
  rationale: עלץ उल्लासित या अत्यन्त प्रसन्न होने का भाव देता है। नगर को मानवीकृत कर्ता मानते हुए यह स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: קִרְיָה
  choice: नगर
  rationale: קִרְיָה नगर या शहर को सूचित करता है। अनिश्चित, सामान्य नीतिवचनात्मक कथन हिन्दी में बिना किसी विशेष निर्धारक के ‘नगर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: וּבַאֲבֹד
  choice: और जब ... नष्ट होते हैं
  rationale: וּבַאֲבֹד पहले खंड के समानान्तर परिस्थिति या अवसर प्रकट करता है। ‘जब’ इस क्रिया-वाचक संरचना को सहज हिन्दी में व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में है और धर्मियों के नैतिक प्रतिलोम को दर्शाता है। ‘दुष्ट’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: רִנָּה
  choice: जयजयकार
  rationale: רִנָּה ऊँची, गूँजती पुकार को बताता है, जो प्रायः उल्लासपूर्ण होती है। इस प्रसंग में ‘जयजयकार’ सार्वजनिक हर्ष की ध्वनि को व्यक्त करती है, जबकि पादटिप्पणी व्यापक वैकल्पिक अर्थ देती है।
theological_decisions:
- issue: दुष्टों के नाश पर सामुदायिक प्रतिक्रिया
  choice: पाठ के स्पष्ट विरोध को यथावत रखते हुए ‘जयजयकार होती है’
  alternative: इसे केवल न्याय की अमूर्त विजय पर आनन्द के रूप में व्याख्यायित करना
  rationale: इब्रानी पाठ सीधे दुष्टों के नष्ट होने और सार्वजनिक पुकार को जोड़ता है। अनुवाद इस तनाव को किसी धर्मवैज्ञानिक व्याख्या द्वारा नरम या पुनर्निर्देशित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों खंडों में ‘जब... तो...’ की समानान्तर रचना इब्रानी काव्य-संतुलन को स्वाभाविक हिन्दी में सामने लाती है। ‘भला होता है’ को केवल धन-संपत्ति के अर्थ तक सीमित न रखने के लिए चुना गया है।
