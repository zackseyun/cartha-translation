review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the antithetical structure: righteousness is associated with life, while pursuing evil results in the pursuer''s death. The supplied verbs appropriately make the verbless Hebrew clauses idiomatic in Hindi. However, “अपनी ही” adds an emphatic ‘very own’ nuance not required by the third-person suffix in לְמוֹתוֹ.'
  naturalness: The verse is clear and suitably proverbial. Removing “ही” yields a more neutral and natural representation of ‘his death’ without losing the reflexive sense. The footnote's first alternative is grammatically possible but less natural than a resultative Hindi formulation.
  terminology: “धार्मिकता” is an established Hindi biblical rendering for צְדָקָה and is suitable here as broad moral uprightness, without restricting the term to social justice or ritual religiosity. “बुराई” appropriately conveys the ethical sense of רָעָה in this contrast.
  issues:
  - severity: low
    issue: “अपनी ही मृत्यु” introduces emphasis beyond the Hebrew.
    rationale: The suffix in לְמוֹתוֹ means ‘his death.’ Hindi “अपनी मृत्यु” expresses this naturally; “ही” can suggest special contrastive emphasis that is not present in the source.
  - severity: low
    issue: The first footnote alternative is somewhat literal and awkward in Hindi.
    rationale: “धार्मिकता जीवन के लिए है” is understandable but does not naturally convey the resultative relationship as well as “धार्मिकता जीवन की ओर ले जाती है” or “धार्मिकता जीवन का कारण बनती है.”
  revised_text: इस प्रकार, धार्मिकता जीवन की ओर ले जाती है[a], परन्तु जो बुराई का पीछा करता है, वह अपनी मृत्यु की ओर बढ़ता है।
