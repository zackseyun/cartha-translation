source:
  edition: WLC
  text: כֵּן צְדָקָ֥ה לְ/חַיִּ֑ים וּ/מְרַדֵּ֖ף רָעָ֣ה לְ/מוֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/019.yaml
  text: So righteousness leads to life[a], but he who pursues evil, to his own death.
translation:
  language: hi
  text: इस प्रकार, धार्मिकता जीवन की ओर ले जाती है[a], परन्तु जो बुराई का पीछा करता है, वह अपनी मृत्यु की ओर बढ़ता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस प्रकार धार्मिकता जीवन के लिए है”; अथवा “निश्चय ही, धार्मिकता जीवन की ओर ले जाती है।” इब्रानी में पहला उपवाक्य क्रियारहित है, इसलिए हिन्दी में उसका आशय स्पष्ट करने के लिए क्रिया जोड़ी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: इस प्रकार
  rationale: यहाँ यह शब्द निष्कर्ष अथवा बल देने का भाव रखता है। ‘इस प्रकार’ नीतिवचन की संक्षिप्त और गरिमापूर्ण शैली बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: ज्ञान-साहित्य के इस नैतिक विरोध में यह सही और खरे आचरण की व्यापक धारणा व्यक्त करता है; ‘न्याय’ इसका केवल एक अपेक्षाकृत संकीर्ण पक्ष होता।
- source_word: לְחַיִּים
  choice: जीवन की ओर ले जाती है
  rationale: ल उपसर्ग यहाँ दिशा अथवा परिणाम व्यक्त करता है। इब्रानी उपवाक्य क्रियारहित है, इसलिए स्वाभाविक हिन्दी के लिए ‘ले जाती है’ जोड़ा गया है।
- source_word: וּמְרַדֵּף
  choice: परन्तु जो ... का पीछा करता है
  rationale: कृदन्त किसी ऐसे व्यक्ति को दर्शाता है जो लगातार या आदतन पीछा करता है; समानांतर पंक्तियों का विरोध हिन्दी में ‘परन्तु’ से स्पष्ट होता है।
- source_word: רָעָה
  choice: बुराई
  rationale: धार्मिकता और जीवन के विरोध में इसका नैतिक अर्थ ‘बुराई’ सबसे उपयुक्त है, न कि विपत्ति या हानि।
- source_word: לְמוֹתוֹ
  choice: अपनी ही मृत्यु की ओर बढ़ता है
  rationale: मूल वाक्यांश का अर्थ ‘उसकी मृत्यु की ओर’ है। ‘अपनी ही’ पुरुषवाचक प्रत्यय और आत्म-विनाशकारी परिणाम को स्वाभाविक हिन्दी में स्पष्ट करता है; संतुलित वाक्य के लिए ‘बढ़ता है’ की पूर्ति की गई है।
theological_decisions:
- issue: ज्ञान-साहित्य में צְדָקָה का आशय
  choice: जीवन की ओर ले जाने वाली नैतिक धार्मिकता
  alternative: जीवन की ओर ले जाने वाला सामाजिक न्याय
  rationale: विरोधी समानांतरता धार्मिकता को बुराई का पीछा करने के सामने रखती है, इसलिए व्यापक नैतिक अर्थ उपयुक्त है। यह ‘न्याय’ के भाव को नकारता नहीं, पर अर्थ को केवल सामाजिक समानता तक सीमित भी नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘धार्मिकता’ पारंपरिक रूप से परिचित है, जबकि शेष वाक्य साधारण पाठक के लिए सहज रखा गया है।
