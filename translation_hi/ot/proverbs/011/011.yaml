  register: आधुनिक मानक हिन्दी में संक्षिप्त, समानांतर और गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘ऊँचा उठता है’ और ‘ढा दिया जाता है’ से मूल का स्थापत्य-संबंधी विरोध सुरक्षित रहता है।
