  text: בְּ/בִרְכַּ֣ת יְ֭שָׁרִים תָּר֣וּם קָ֑רֶת וּ/בְ/פִ֥י רְ֝שָׁעִ֗ים תֵּהָרֵֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/011.yaml
  text: By the blessing of the upright a city is exalted[b][a], but by the mouth of the wicked it is torn down.
translation:
  language: hi
  text: 'सज्जनों की आशीष से नगर ऊँचा उठता है[a],

    पर दुष्टों की वाणी से वह ढा दिया जाता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सज्जनों की आशीष से नगर उन्नति करता है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक, “दुष्टों के मुँह से”; यह अभिव्यक्ति दुष्ट वाणी की विनाशकारी शक्ति की ओर संकेत करती है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּ/בִרְכַּת
  choice: की आशीष से
  rationale: בְּ साधन या माध्यम को व्यक्त करता है। ‘आशीष’ मूल की संक्षिप्तता बनाए रखती है और इसमें सीधे लोगों के आशीर्वचन तथा उनके हितकारी प्रभाव—दोनों की संभावना खुली रहती है।
- source_word: יְשָׁרִים
  choice: सीधे लोगों
  rationale: יָשָׁר नैतिक रूप से सीधे और खरे चरित्र वाले लोगों को दर्शाता है। ‘सीधे लोगों’ सामान्य आधुनिक हिन्दी में सहज है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: תָּרוּם
  choice: ऊँचा उठता है
  rationale: רוּם का काल यहाँ नगर के ऊपर उठने या प्रतिष्ठा और समृद्धि पाने का भाव देता है। सक्रिय रूप ‘ऊँचा उठता है’ मूल व्याकरण और रूपक दोनों को सुरक्षित रखता है।
- source_word: קָרֶת
  choice: नगर
  rationale: קָרֶת का अर्थ नगर या शहर है। ‘नगर’ संक्षिप्त, प्रतिष्ठित और नीतिवचन की शैली के अनुकूल है।
- source_word: וּ/בְ/פִי
  choice: पर ... के मुँह से
  rationale: וּ यहाँ विरोध दिखाता है और בְּ साधन का बोध कराता है। ‘मुँह’ रखने से इब्रानी बिंब तथा दुष्ट वाणी की विनाशकारी शक्ति बनी रहती है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: רָשָׁע नीतिसाहित्य में नैतिक रूप से दुष्ट लोगों के लिए सामान्य शब्द है; ‘दुष्ट’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: תֵּהָרֵס
  choice: वह ढा दिया जाता है
  rationale: הרס का निफ़अल रूप ढा दिए जाने या नष्ट कर दिए जाने का कर्मवाच्य भाव देता है। ‘वह’ स्पष्ट रूप से नगर की ओर लौटता है और पहली पंक्ति के ‘ऊँचा उठता है’ के साथ तीखा विरोध बनाता है।
