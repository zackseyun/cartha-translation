  verdict: revise
  source_fidelity: The antithetical structure, instrumental sense of בְּ ('by/through'), civic referent, and passive destructive result are all retained. However, the literal Hindi phrase 'दुष्टों के मुँह से ... ढा दिया जाता है' is syntactically unnatural and does not clearly convey the Hebrew metonymy of destructive speech. Rendering פי as 'वाणी' communicates that metonymy naturally; the footnote records the literal Hebrew expression.
  naturalness: ‘सीधे लोगों’ can mean merely straightforward or unsophisticated people in modern Hindi, rather than morally upright people. ‘सज्जनों’ is idiomatic in a concise proverbial register. ‘दुष्टों की वाणी से’ is much more natural than making a city be torn down directly ‘from the mouths’ of the wicked.
  terminology: ‘सज्जनों’ appropriately represents יְשָׁרִים in this wisdom-saying context without imposing a narrower theological category. ‘आशीष,’ ‘नगर,’ ‘दुष्ट,’ and ‘वाणी’ fit modern standard Hindi and the elevated aphoristic register.
  issues:
  - severity: medium
    issue: ‘सीधे लोगों’ is semantically less precise for יְשָׁרִים.
    rationale: In current Hindi it can describe people who are simple, direct, or naïve. The Hebrew denotes people of upright moral character.
  - severity: medium
    issue: ‘दुष्टों के मुँह से वह ढा दिया जाता है’ is awkward Hindi.
    rationale: The Hebrew ‘mouth’ is a metonym for speech. Hindi ‘वाणी’ conveys the intended instrument clearly, while a footnote can preserve the literal wording.
