source:
  edition: WLC
  text: רָשָׁ֗ע עֹשֶׂ֥ה פְעֻלַּת שָׁ֑קֶר וְ/זֹרֵ֥עַ צְ֝דָקָ֗ה שֶׂ֣כֶר אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/018.yaml
  text: A wicked man earns deceptive wages[b][a], but one who sows righteousness receives a true reward.
translation:
  language: hi
  text: दुष्ट छलपूर्ण कमाई करता है[a], पर जो धार्मिकता बोता है, उसे सच्चा प्रतिफल मिलता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झूठ का काम करता है’; इब्रानी अभिव्यक्ति छल से मिली कमाई अथवा अंत में व्यर्थ सिद्ध होने वाले परिश्रम—दोनों पर जोर दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निश्चित प्रतिफल’ अथवा ‘भरोसेमंद फल’; शाब्दिक अर्थ ‘सत्य का वेतन/प्रतिफल’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ नीतिवचन में सामान्य प्रतिनिधि के रूप में प्रयुक्त है। हिंदी में ‘दुष्ट’ संक्षिप्त, स्वाभाविक और इसी सामान्य अर्थ को बनाए रखता है।
- source_word: עֹשֶׂה פְעֻלַּת שָׁקֶר
  choice: छलपूर्ण कमाई करता है
  rationale: शाब्दिक रचना ‘झूठ/छल का काम या फल करता है’ है। संदर्भ में यह दुष्ट के श्रम और उससे होने वाली अविश्वसनीय प्राप्ति—दोनों की ओर संकेत कर सकती है; ‘छलपूर्ण कमाई’ विरोधी समानांतरता को स्पष्ट रखते हुए सहज हिंदी देती है।
- source_word: שָׁקֶר
  choice: छलपूर्ण
  rationale: यह शब्द झूठ, छल और अविश्वसनीयता व्यक्त कर सकता है। ‘छलपूर्ण’ उस कमाई के धोखादेह या अंततः व्यर्थ सिद्ध होने के भाव को खुला रखता है।
- source_word: וְזֹרֵעַ
  choice: पर जो ... बोता है
  rationale: וְ का मूल अर्थ ‘और’ है, किंतु इस विरोधात्मक नीतिवचन में ‘पर’ स्वाभाविक है। ‘जो ... बोता है’ कृषि-रूपक और एकवचन प्रतिनिधि भाव दोनों को सुरक्षित रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक रूप से सही आचरण, न्याय और धार्मिकता के व्यापक क्षेत्र को व्यक्त करता है। ‘धार्मिकता’ उसके नैतिक-ईश्वरीय आयाम को बनाए रखती है।
- source_word: שֶׂכֶר אֱמֶת
  choice: सच्चा प्रतिफल
  rationale: शाब्दिक अर्थ ‘सत्य का वेतन/प्रतिफल’ है। ‘सच्चा प्रतिफल’ पहले चरण की छलपूर्ण प्राप्ति के साथ विरोध बनाए रखता है और वास्तविक, भरोसेमंद फल का भाव देता है।
theological_decisions:
- issue: צְדָקָה का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय; सही काम
  rationale: संदर्भ नैतिक आचरण को उसके फल से जोड़ता है, पर केवल सामाजिक न्याय तक सीमित नहीं करता। इसलिए व्यापक शब्द ‘धार्मिकता’ चुना गया है।
- issue: दुष्ट के काम के परिणाम की प्रकृति
  choice: छलपूर्ण कमाई
  alternative: झूठ का काम; व्यर्थ सिद्ध होने वाला फल
  rationale: इब्रानी वाक्यांश यह अस्पष्टता रखता है कि जोर छलपूर्ण कार्य पर है या ऐसी प्राप्ति पर जो अंततः धोखा देती है। मुख्य पाठ स्वाभाविक हिंदी देता है और टिप्पणी दोनों संभावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त नीतिवचनात्मक लय और गरिमापूर्ण सामान्य शब्दावली अपनाई गई है। ‘बोता है’ के कृषि-रूपक तथा दोनों पंक्तियों के नैतिक विरोध को बनाए रखा गया है।
