base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/025.yaml
  text: A generous person will be enriched[b][a], and whoever refreshes others will himself be refreshed.
translation:
  language: hi
  text: उदार व्यक्ति भरपूर किया जाएगा,[a] और जो दूसरों को तरोताज़ा करता है, वह स्वयं भी तरोताज़ा होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आशीष की आत्मा/व्यक्ति भरपूर किया जाएगा।” इब्रानी में भरपूरी और समृद्धि का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या अधिक शाब्दिक रूप से, “जो सींचता है, वह स्वयं भी सींचा जाएगा।” यहाँ जल का रूपक दूसरों को ताज़गी या भलाई पहुँचाने के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ בְּרָכָה
  choice: उदार व्यक्ति
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति को सूचित करता है, और בְּרָכָה ऐसे व्यक्ति का गुण बताता है जो दूसरों के लिए आशीष और उदारता का स्रोत है। आधुनिक हिन्दी में ‘उदार व्यक्ति’ इसका स्वाभाविक अर्थ देता है।
- source_word: תְדֻשָּׁן
  choice: फलता-फूलता रहेगा
  rationale: दशेन के पुअल रूप में समृद्ध, पुष्ट और भरपूर किए जाने का चित्र है। ‘फलता-फूलता रहेगा’ शारीरिक मोटापे का भ्रामक भाव दिए बिना प्रचुरता और उन्नति की छवि रखता है।
- source_word: מַרְוֶה
  choice: जो दूसरों को सींचता है
  rationale: रוה का हिफ़ील कृदन्त किसी को पानी पिलाने या सींचने का कारण बनने का भाव देता है। ‘सींचता है’ मूल जल-रूपक को बनाए रखता है; ‘दूसरों को’ हिन्दी में निहित कर्म को स्पष्ट करता है।
- source_word: גַּם הוּא יוֹרֶא
  choice: वह स्वयं भी सींचा जाएगा
  rationale: גַּם הוּא प्रत्यावर्तन और बल को व्यक्त करता है। יוֹרֶא को समानांतर पंक्ति के जल-रूपक के अनुसार कर्मवाच्य अर्थ में रखा गया है, जिससे देने वाले के स्वयं लाभ पाने का भाव सामने आता है।
