  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מֹ֣נֵֽעַ בָּ֭ר יִקְּבֻ֣/הוּ לְא֑וֹם וּ֝/בְרָכָ֗ה לְ/רֹ֣אשׁ מַשְׁבִּֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/026.yaml
  text: The one who withholds grain—the people curse him[b][a], but blessing is on the head of the one who sells it.
translation:
  language: hi
  text: जो अनाज रोक रखता है, उसे लोग शाप देते हैं[a], पर जो उसे बेचता है[b], उसके सिर पर आशीष होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जनता” अथवा “राष्ट्र”; इब्रानी शब्द किसी जनसमूह या सामूहिक जनसाधारण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जो अनाज उपलब्ध कराता है”; इब्रानी कृदन्त अनाज बाँटने या उपलब्ध कराने पर बल दे सकता है, यद्यपि इस प्रसंग में सामान्यतः उसे बेचने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹנֵעַ
  choice: जो ... रोक रखता है
  rationale: इब्रानी कृदन्त किसी व्यक्ति के सामान्य या लगातार व्यवहार को दर्शाता है; यह प्रयोग अनाज को उपलब्ध न कराने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּר
  choice: अनाज
  rationale: यहाँ शब्द सामान्य रूप से खाद्यान्न के लिए है, केवल गेहूँ या किसी एक विशेष फसल के लिए नहीं।
- source_word: יִקְּבֻהוּ
  choice: उसे ... शाप देते हैं
  rationale: נקב का यहाँ अर्थ किसी के विरुद्ध शाप बोलना है; ‘शाप देना’ सीधा और प्रसंगानुकूल हिन्दी रूप है।
- source_word: לְאֹם
  choice: लोग
  rationale: शब्द किसी जनसमूह, राष्ट्र या सामूहिक जनता को सूचित कर सकता है; इस सामाजिक प्रसंग में ‘लोग’ सबसे स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּבְרָכָה
  choice: पर ... आशीष
  rationale: संयोजक का मूल अर्थ ‘और’ है, पर नीति-वचन की विरोधी समानांतरता को आधुनिक हिन्दी में ‘पर’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְרֹאשׁ
  choice: उसके सिर पर
  rationale: इब्रानी की ठोस छवि को सुरक्षित रखा गया है, जिसमें आशीष व्यक्ति के सिर पर होती है।
- source_word: מַשְׁבִּיר
  choice: जो उसे बेचता है
  rationale: שׁבר का हिफ़ील कृदन्त इस व्यापारिक संदर्भ में अनाज बेचने या उपलब्ध कराने वाले को दर्शाता है; ‘बेचता है’ रोक रखने के साथ स्पष्ट विरोध बनाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘रोक रखता है’ जमाखोरी का निहित सामाजिक भाव व्यक्त करता है, और ‘सिर पर आशीष’ मूल इब्रानी बिंब को सुरक्षित रखता है।
