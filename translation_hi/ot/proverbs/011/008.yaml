id: PRO.11.8
reference: Proverbs 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַ֭דִּיק מִ/צָּרָ֣ה נֶחֱלָ֑ץ וַ/יָּבֹ֖א רָשָׁ֣ע תַּחְתָּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/008.yaml
  text: The righteous is rescued from trouble[a], and the wicked comes in his place.
translation:
  language: hi
  text: धर्मी संकट से छुड़ाया जाता है, और दुष्ट उसकी जगह आ पड़ता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ संज्ञा के रूप में एक प्रतिनिधि व्यक्ति के लिए प्रयुक्त है। ‘धर्मी’ हिंदी में संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुकूल है।
- source_word: מִצָּרָה
  choice: संकट से
  rationale: מִן अलगाव या किसी दशा से बाहर निकाले जाने का भाव देता है, और צָרָה संकट, विपत्ति या क्लेश को दर्शाता है। ‘संकट से’ अर्थ की व्यापकता और सहजता बनाए रखता है।
- source_word: נֶחֱלָץ
  choice: छुड़ाया जाता है
  rationale: חלץ का निफ़अल रूप निष्क्रिय रीति से बचाए या बाहर निकाले जाने का अर्थ देता है। ‘छुड़ाया जाता है’ इस निष्क्रिय भाव को स्पष्ट रखता है और ‘बच निकलता है’ की अपेक्षा स्वयं किए गए प्रयास का संकेत नहीं देता।
- source_word: וַיָּבֹא
  choice: आ पड़ता है
  rationale: בוא का मूल अर्थ ‘आना’ है। यहाँ अगले पदबंध के साथ ‘आ पड़ता है’ स्वाभाविक हिंदी में उस स्थिति या स्थान में पहुँचने का भाव व्यक्त करता है, बिना प्रक्रिया या समय को अधिक स्पष्ट किए।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह भी संज्ञा के रूप में प्रयुक्त विशेषण है और धर्मी के समांतर प्रतिनिधि व्यक्ति को सूचित करता है। ‘दुष्ट’ आधुनिक हिंदी और ज्ञान-साहित्य की शैली में स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसकी जगह
  rationale: תַּחַת प्रत्यय के साथ यहाँ ‘उसके स्थान पर’ या ‘उसके बदले’ का भाव देता है। ‘उसकी जगह’ संक्षिप्त और सहज है तथा प्रतिस्थापन के अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: नीतिवचन में उलटाव और प्रतिस्थापन का संबंध
  choice: धर्मी संकट से छुड़ाया जाता है और दुष्ट उसकी जगह आ पड़ता है।
  alternative: दुष्ट उसी संकट में धर्मी के बदले पड़ता है।
  rationale: תַּחְתָּיו प्रतिस्थापन या उलटाव का भाव समर्थित करता है, पर इब्रानी यह विस्तार से नहीं बताती कि दुष्ट ठीक उसी विशिष्ट संकट में, किस रीति या किस समय पड़ता है। मुख्य पाठ संक्षिप्तता और वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। दोनों खंडों का प्रतिनिधि एकवचन और निष्क्रिय उद्धार का भाव सुरक्षित रखा गया है। ‘उसकी जगह आ पड़ता है’ प्रतिस्थापन को स्वाभाविक हिंदी में व्यक्त करता है।
