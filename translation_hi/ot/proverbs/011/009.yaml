source:
  edition: WLC
  text: בְּ/פֶ֗ה חָ֭נֵף יַשְׁחִ֣ת רֵעֵ֑/הוּ וּ֝/בְ/דַ֗עַת צַדִּיקִ֥ים יֵחָלֵֽצוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/009.yaml
  text: With his mouth the godless man destroys his neighbor[b][a], but by knowledge the righteous are delivered.
translation:
  language: hi
  text: भक्तिहीन मनुष्य अपने मुँह से अपने पड़ोसी को नष्ट करता है,[a] परन्तु ज्ञान के द्वारा धर्मी लोग बच निकलते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाखंडी अपने मुँह से अपने पड़ोसी को नष्ट करता है।” इब्रानी शब्द पाखंडी, अपवित्र या भक्तिहीन व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ज्ञान के द्वारा धर्मी लोग बचाए जाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶה
  choice: अपने मुँह से
  rationale: בְּ साधन को व्यक्त करता है; यह अनुवाद वाणी को विनाश के साधन के रूप में दिखाने वाली ठोस छवि बनाए रखता है।
- source_word: חָנֵף
  choice: भक्तिहीन मनुष्य
  rationale: यह शब्द पाखंडी, अपवित्र या ईश्वर-विमुख व्यक्ति को सूचित कर सकता है। यहाँ धर्मियों के साथ नैतिक-धार्मिक विरोध के कारण व्यापक अर्थ वाला ‘भक्तिहीन’ उपयुक्त है।
- source_word: יַשְׁחִת
  choice: नष्ट करता है
  rationale: שׁחת के हिफ़ील रूप का प्रबल अर्थ नष्ट करना या बरबाद करना है; ‘नष्ट करता है’ कहावत की तीव्रता बनाए रखता है।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या मित्र हो सकता है। ‘पड़ोसी’ सामाजिक संबंध का व्यापक अर्थ रखता है और अनावश्यक रूप से घनिष्ठ मित्रता नहीं दर्शाता।
- source_word: וּבְדַעַת
  choice: परन्तु ज्ञान के द्वारा
  rationale: וּ यहाँ दोनों पंक्तियों का विरोध दिखाता है और בְּ साधन व्यक्त करता है। ‘ज्ञान’ नीतिवचन की प्रमुख पारिभाषिक शब्दावली को सुरक्षित रखता है।
- source_word: צַדִּיקִים
  choice: धर्मी लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी लोग’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יֵחָלֵצוּ
  choice: बच निकलते हैं
  rationale: חלץ के निफ़ाल रूप में बचाए जाने अथवा संकट से निकलने का भाव है। ‘बच निकलते हैं’ हिन्दी में स्वाभाविक है और उद्धार के कर्ता को निर्दिष्ट नहीं करता।
theological_decisions:
- issue: नीतिवचन के संदर्भ में חָנֵף का अर्थ
  choice: ‘भक्तिहीन मनुष्य’
  alternative: ‘पाखंडी’ या ‘अधर्मी मनुष्य’
  rationale: शब्द में पाखंड का भाव हो सकता है, पर उसका अर्थ केवल बाहरी कपट तक सीमित नहीं है। धर्मियों के साथ विरोध व्यापक नैतिक और धार्मिक भ्रष्टता की ओर संकेत करता है।
- issue: दूसरी पंक्ति में कर्ता और क्रिया का संबंध
  choice: धर्मी लोग स्वयं ज्ञान के द्वारा बच निकलते हैं
  alternative: धर्मियों के ज्ञान के द्वारा दूसरे लोग बचते हैं
  rationale: इब्रानी वाक्य-विन्यास में צַדִּיקִים को יֵחָלֵצוּ का कर्ता मानना सबसे स्वाभाविक है। अनुवाद इसी सामान्य वर्ग-वाचक कथन को रखता है।
- issue: יֵחָלֵצוּ में सक्रिय और कर्मवाच्य भाव
  choice: ‘बच निकलते हैं’
  alternative: ‘बचाए जाते हैं’
  rationale: निफ़ाल यहाँ छुटकारा पाने या संकट से निकलने का भाव दे सकता है। चुना हुआ रूप किसी स्पष्ट न किए गए उद्धारकर्ता को जोड़ने से बचता है, जबकि वैकल्पिक कर्मवाच्य अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप रखा गया है। समानांतरता, साधन-सूचक दोनों प्रयोग (‘मुँह से’ और ‘ज्ञान के द्वारा’), एकवचन भक्तिहीन व्यक्ति तथा बहुवचन धर्मी लोगों का अंतर सुरक्षित है।
