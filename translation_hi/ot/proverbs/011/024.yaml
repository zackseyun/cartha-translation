  text: יֵ֣שׁ מְ֭פַזֵּר וְ/נוֹסָ֥ף ע֑וֹד וְ/חוֹשֵׂ֥ךְ מִ֝/יֹּ֗שֶׁר אַךְ לְ/מַחְסֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/011/024.yaml
  text: There is one who scatters[a], yet gains still more; and one who withholds more than is right, but only to poverty.
translation:
  language: hi
  text: 'कोई बिखेरता है[a], फिर भी और अधिक पाता है;

    और कोई उचित सीमा से अधिक रोक रखता है, पर केवल अभाव ही पाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बिखेरता है’ उदारता से देने का रूपक है। ‘उचित सीमा से अधिक’ के पीछे इब्रानी पद कठिन है; इसका अर्थ ‘जो न्यायसंगत है उसे रोक रखना’ भी हो सकता है।
    reason: रूपक का आशय और कठिन इब्रानी पद का वैकल्पिक अर्थ स्पष्ट करना
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: यह किसी विशेष व्यक्ति की नहीं, एक सामान्य प्रकार के व्यक्ति की बात आरम्भ करता है।
- source_word: מְפַזֵּר
  choice: उदारता से बिखेरता है
  rationale: ‘बिखेरना’ मूल रूपक को सुरक्षित रखता है; ‘उदारता से’ हिन्दी पाठक के लिए दानशीलता का प्रसंग स्पष्ट करता है।
- source_word: וְנוֹסָף עוֹד
  choice: फिर भी उसकी बढ़ती होती जाती है
  rationale: इसमें और अधिक जुड़ने या वृद्धि होने का भाव है; यह उदारता के विरोधाभासी फल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחוֹשֵׂךְ
  choice: रोक रखता है
  rationale: यह रोकने या अपने पास रख छोड़ने का भाव देता है और पहली पंक्ति के ‘बिखेरता है’ के विपरीत बैठता है।
- source_word: מִיֹּשֶׁר
  choice: उचित से भी अधिक
  rationale: कठिन इब्रानी पद को उस सीमा से अधिक रोक रखने के अर्थ में लिया गया है जो उचित या न्यायसंगत है।
- source_word: אַךְ
  choice: केवल
  rationale: यह परिणाम की सीमित और विडंबनापूर्ण प्रकृति पर बल देता है।
- source_word: לְמַחְסוֹר
  choice: घटी
  rationale: मूल संज्ञा अभाव, कमी या जरूरत को दर्शाती है; ‘घटी’ पहली पंक्ति की ‘बढ़ती’ के साथ कहावत का शब्दगत विरोध बनाए रखती है।
