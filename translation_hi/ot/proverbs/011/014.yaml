  yaml_path: translation/ot/proverbs/011/014.yaml
  text: Without guidance a people falls[a], but in an abundance of counselors there is deliverance.
translation:
  language: hi
  text: मार्गदर्शन के अभाव में एक राष्ट्र गिर पड़ता है[a], पर बहुत-से सलाहकारों के होने पर छुटकारा मिलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ मार्गदर्शन नहीं है, वहाँ एक राष्ट्र गिर पड़ता है; पर बहुत-से सलाहकारों के साथ सुरक्षा या विजय होती है।”
    reason: תַּחְבֻּלוֹת के लिए ‘मार्गदर्शन’ की वैकल्पिक वाक्य-रचना तथा תְשׁוּעָה के ‘सुरक्षा’ और ‘विजय’ अर्थों को दर्शाता है।
lexical_decisions:
- source_word: בְּ/אֵין
  choice: के अभाव में
  rationale: यह परिस्थिति बताने वाली इब्रानी अभिव्यक्ति है, जिसका अर्थ ‘न होने पर’ या ‘के बिना’ है; ‘के अभाव में’ हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: תַּחְבֻּלוֹת
  choice: मार्गदर्शन
  rationale: यह शब्द दिशा, कुशल मार्गदर्शन या रणनीतिक संचालन का बोध करा सकता है। ‘मार्गदर्शन’ व्यापक नीतिवचन-संदर्भ के अनुकूल है और इसे अनावश्यक रूप से सैनिक या नौसंचालन संबंधी अर्थ तक सीमित नहीं करता।
- source_word: יִפָּל
  choice: गिर जाते हैं
  rationale: मूल क्रिया का सीधा अर्थ ‘गिरना’ है और प्रसंग में विनाश या पतन का संकेत भी हो सकता है; ‘गिर जाते हैं’ मूल रूपक को सुरक्षित रखता है।
- source_word: עָם
  choice: लोग
  rationale: इब्रानी शब्द का अर्थ ‘लोग’ अथवा ‘जाति/राष्ट्र’ हो सकता है। यहाँ सामान्य सिद्धांत व्यक्त हो रहा है; आधुनिक हिन्दी में ‘लोग’ स्वाभाविक है, यद्यपि सामूहिक अर्थ में ‘जनता’ भी संभव है।
- source_word: וּ/תְשׁוּעָה
  choice: छुटकारा मिलता है
  rationale: यह संज्ञा छुटकारे, सुरक्षा या विजय को सूचित कर सकती है। ‘छुटकारा मिलता है’ संकट से बचाए जाने के व्यापक अर्थ को रखता है और इसे केवल सैनिक विजय नहीं बनाता।
- source_word: בְּ/רֹב
  choice: बहुत-से … के होने से
  rationale: मूल में बहुतायत या बड़ी संख्या पर बल है। यह हिन्दी संरचना उस भाव को सहज ढंग से व्यक्त करती है।
- source_word: יוֹעֵץ
  choice: सलाहकारों
  rationale: रूप एकवचन है, पर ‘बहुतायत’ के साथ सामूहिक अर्थ में अनेक सलाह देने वालों को दर्शाता है। ‘सलाहकारों’ पहले खंड के ‘मार्गदर्शन’ से शब्दगत भेद भी बनाए रखता है।
theological_decisions:
- issue: תְשׁוּעָה का अर्थ-क्षेत्र
  choice: छुटकारा
  alternative: सुरक्षा/विजय
  rationale: संदर्भ नागरिक या सामूहिक संकट से बचाव का हो सकता है, पर मूल शब्द सुरक्षा अथवा विजय की छाया भी रखता है; मुख्य पाठ में व्यापक ‘छुटकारा’ रखा और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक रूप अपनाया गया है। ‘मार्गदर्शन’ और ‘सलाहकार’ के बीच मूल के शब्दगत भेद को रखा गया है; ‘गिर जाते हैं’ मूल रूपक को बनाए रखता है।
