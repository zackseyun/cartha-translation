source:
  edition: WLC
  text: לְ/אָדָ֥ם מַֽעַרְכֵי לֵ֑ב וּ֝/מֵ/יְהוָ֗ה מַעֲנֵ֥ה לָשֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/001.yaml
  text: The plans of the heart belong to man[b][a], but the answer of the tongue is from Yahweh.
translation:
  language: hi
  text: हृदय की योजनाएँ मनुष्य की हैं[a][b], पर जीभ का उत्तर याहवे की ओर से आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ (אָדָם) किसी एक पुरुष के लिए नहीं, बल्कि सामान्य रूप से हर मानव के लिए प्रयुक्त प्रतिनिधि एकवचन है।
    reason: cultural_note
  - marker: b
    text: ‘हृदय की योजनाएँ’ का अनुवाद ‘हृदय की व्यवस्थाएँ’ या ‘हृदय की तैयारियाँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָדָם
  choice: मनुष्य की होती हैं
  rationale: सम्बन्धसूचक לְ को यहाँ अधिकार अथवा सम्बन्ध के अर्थ में लिया गया है। यह पद सामान्य मानव का प्रतिनिधित्व करता है; इसलिए ‘मनुष्य’ स्वाभाविक और स्रोत के निकट है।
- source_word: מַעַרְכֵי
  choice: योजनाएँ
  rationale: ערך से बना यह बहुवचन संज्ञा-रूप क्रम लगाने, व्यवस्था करने या तैयारी करने का भाव रखता है। ‘हृदय’ के साथ ‘योजनाएँ’ मन में किए जाने वाले विचार-विन्यास को सहज हिन्दी में व्यक्त करता है।
- source_word: לֵב
  choice: हृदय
  rationale: हिब्रू में ‘हृदय’ विचार, इच्छा और संकल्प सहित भीतरी मनुष्य को दर्शाता है। मूल बिंब बनाए रखने के लिए ‘हृदय’ रखा गया है।
- source_word: וּמֵיְהוָה
  choice: पर ... याहवे की ओर से
  rationale: וְ का मूल अर्थ ‘और’ है, पर समानांतर पंक्तियों में मानव की योजना और याहवे से मिलने वाले उत्तर के बीच विरोध उभरता है; ‘पर’ इस सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट करता है। מִן को ‘की ओर से’ कहा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के लिप्यंतरण को बनाए रखा गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: מַעֲנֵה
  choice: उत्तर
  rationale: यह संज्ञा उत्तर या प्रत्युत्तर को दर्शाती है। ‘उत्तर’ संक्षिप्त, सीधा और नीतिवचन की शैली के अनुकूल है।
- source_word: לָשׁוֹן
  choice: जीभ
  rationale: मूल शारीरिक बिंब सुरक्षित रखा गया है; यहाँ ‘जीभ’ वाणी या बोले गए शब्दों का लक्षणात्मक संकेत है।
theological_decisions:
- issue: मानवीय अभिप्राय और परमेश्वर की प्रभुता का सम्बन्ध
  choice: मनुष्य के भीतरी योजनाबद्ध विचारों और याहवे की ओर से आने वाले बोले गए उत्तर के बीच का तनाव यथावत रखा गया है।
  alternative: इसे व्यापक रूप से ऐसा कथन माना जा सकता है कि मनुष्य योजना बनाता है, पर हर परिणाम पर परमेश्वर का नियंत्रण है; अथवा विशेष रूप से यह कि मनुष्य की वाणी भी याहवे के अधीन है।
  rationale: हिब्रू पाठ ‘हृदय की योजनाओं’ को मनुष्य से और ‘जीभ के उत्तर’ को याहवे से जोड़ता है। अनुवाद इस कथन को किसी पूर्ण नियतिवादी व्यवस्था या केवल सामान्य देखरेख के सिद्धान्त में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘हृदय’ और ‘जीभ’ जैसे हिब्रू काव्य-बिंब सुरक्षित हैं, जबकि ‘मनुष्य की होती हैं’ और ‘की ओर से आता है’ वाक्य को सामान्य हिन्दी पाठक के लिए स्वाभाविक बनाते हैं।
