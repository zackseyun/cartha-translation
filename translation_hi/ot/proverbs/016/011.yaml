source:
  edition: WLC
  text: פֶּ֤לֶס וּ/מֹאזְנֵ֣י מִ֭שְׁפָּט לַֽ/יהוָ֑ה מַ֝עֲשֵׂ֗/הוּ כָּל אַבְנֵי כִֽיס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/011.yaml
  text: A just balance and scales belong to Yahweh[a]; all the weights in the bag are his work.
translation:
  language: hi
  text: 'न्यायपूर्ण तुला और तराज़ू याहवे के हैं;

    थैली के सभी बाट[a] उसी के बनाए हुए हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “थैली के सभी पत्थर।” इस प्रसंग में पत्थर तौलने के बाटों के रूप में इस्तेमाल होते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּלֶס
  choice: तुला
  rationale: यह तौलने के संतुलन-यंत्र को दर्शाता है। ‘तुला’ गरिमापूर्ण और समझ में आने वाला शब्द है तथा समानांतर पद में आए दूसरे तौल-यंत्र से कुछ भिन्नता बनाए रखता है।
- source_word: וּמֹאזְנֵי
  choice: और तराज़ू
  rationale: बहुवचन रूप तौलने के पलड़ों अथवा तराज़ू को सूचित करता है। ‘तराज़ू’ आधुनिक हिन्दी में स्वाभाविक है और व्यापारिक तौल का चित्र स्पष्ट करता है।
- source_word: מִשְׁפָּט
  choice: न्यायपूर्ण
  rationale: यहाँ ‘न्याय’ तौलने के उपकरणों की विशेषता बताता है—वे निष्पक्ष और सही हैं। ‘न्यायपूर्ण’ नैतिक आशय को स्पष्ट रखते हुए मूल संज्ञा से संबंध बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के हैं
  rationale: ל यहाँ स्वामित्व अथवा संबंध व्यक्त करता है। परमेश्वर के विशिष्ट नाम יהוה को ‘याहवे’ के रूप में रखा गया है।
- source_word: מַעֲשֵׂהוּ
  choice: उसी के बनाए हुए हैं
  rationale: शब्द का अर्थ उसका काम, उसकी कृति अथवा उसका किया हुआ हो सकता है। यह अनुवाद बाटों को याहवे द्वारा स्थापित न्यायपूर्ण व्यवस्था से जोड़ता है, पर कथन को आवश्यकता से अधिक नहीं खोलता।
- source_word: כָּל
  choice: सभी
  rationale: बहुवचन ‘बाट’ के साथ सार्वभौमिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַבְנֵי
  choice: बाट
  rationale: मूल अर्थ ‘पत्थर’ है, पर व्यापारिक प्रसंग में ये तराज़ू पर रखे जाने वाले पत्थर के मानक बाट हैं। ‘बाट’ अभिप्रेत वस्तु को स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: כִיס
  choice: थैली
  rationale: यह व्यापारियों द्वारा बाट रखने के लिए प्रयुक्त छोटी थैली या बटुए को दर्शाता है। ‘थैली’ सहज और प्रसंगानुकूल है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: बाटों को याहवे का बनाया हुआ कहने का आशय
  choice: न्यायपूर्ण तौल के मानक याहवे की व्यवस्था और अधिकार के अधीन हैं
  alternative: केवल इतना कि परमेश्वर ने भौतिक बाट बनाए; अथवा हर प्रचलित बाज़ारी बाट को परमेश्वर की स्वीकृति प्राप्त है
  rationale: ‘न्यायपूर्ण’ और तौल-संबंधी शब्दावली मिलकर निष्पक्ष व्यापार का नैतिक दावा करती है। फिर भी अनुवाद मूल के व्यापक ‘उसकी कृति’ भाव को किसी अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विभाजन किया गया है। ‘तुला’ और ‘तराज़ू’ मूल के दो निकटार्थी तौल-शब्दों का अंतर कुछ हद तक बनाए रखते हैं; ‘बाट’ व्यापारिक प्रसंग को सामान्य पाठक के लिए स्पष्ट करता है।
