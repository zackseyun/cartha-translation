  text: אִ֣ישׁ חָ֭מָס יְפַתֶּ֣ה רֵעֵ֑/הוּ וְ֝/הוֹלִיכ֗/וֹ בְּ/דֶ֣רֶךְ לֹא טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/029.yaml
  text: A violent man entices his neighbor and leads him in a way that is not good[a][b].
translation:
  language: hi
  text: हिंसक पुरुष अपने पड़ोसी[a] को फुसलाता है और उसे ऐसी राह पर ले जाता है जो अच्छी नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने मित्र” अथवा “अपने साथी”।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अच्छी न होने वाली राह पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: पुरुष
  rationale: इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग एकवचन है और नीतिवचन में एक प्रतिनिधि पुरुष का चित्र प्रस्तुत करता है; इसलिए इसे लिंग-निरपेक्ष ‘व्यक्ति’ न करके ‘पुरुष’ कहा गया है।
- source_word: חָמָס
  choice: हिंसक
  rationale: אִישׁ के साथ यह ऐसे पुरुष को दर्शाता है जिसकी पहचान हिंसा या क्रूरता से होती है। ‘हिंसक’ आधुनिक हिन्दी में स्वाभाविक है और मूल का नैतिक बल बनाए रखता है।
- source_word: יְפַתֶּה
  choice: फुसलाता है
  rationale: पिएल रूप में פתה यहाँ किसी को गलत काम की ओर लुभाने या बहकाने का भाव देता है। ‘फुसलाता है’ इस आकर्षक किंतु हानिकारक प्रभाव को व्यक्त करता है, बिना छल को अनिवार्य अर्थ बनाए।
- source_word: רֵעֵהוּ
  choice: अपने पड़ोसी
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। ‘पड़ोसी’ व्यापक पारस्परिक संबंध को रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְהוֹלִיכוֹ
  choice: और उसे ... ले जाता है
  rationale: הלף के हिफ़ील रूप का कारक भाव ‘चलाता/ले जाता है’ है। हिन्दी में ‘उसे ... ले जाता है’ स्वाभाविक ढंग से यही भाव रखता है।
- source_word: בְּדֶרֶךְ
  choice: राह पर
  rationale: דֶּרֶךְ का शाब्दिक अर्थ राह या मार्ग है और नीतिवचनों में यह जीवन-चाल या आचरण का रूपक भी है। ‘राह पर’ दोनों स्तरों को बनाए रखता है।
- source_word: לֹא טוֹב
  choice: जो अच्छी नहीं है
  rationale: मूल पदबंध शाब्दिक रूप से ‘अच्छी नहीं’ है। इसे ‘बुरी’ करने के बजाय मूल की नकारात्मक अभिव्यक्ति और उसकी संयत नैतिक भाषा सुरक्षित रखी गई है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। ‘फुसलाता है’ बोलचाल में समझ आने वाला है, फिर भी नीतिवचन की नैतिक गंभीरता बनाए रखता है। ‘राह’ मूल रूपक को ‘जीवन-मार्ग’ जैसी व्याख्यात्मक स्पष्टता जोड़े बिना सुरक्षित रखती है।
