source:
  edition: WLC
  text: צוּף דְּ֭בַשׁ אִמְרֵי נֹ֑עַם מָת֥וֹק לַ֝/נֶּפֶשׁ וּ/מַרְפֵּ֥א לָ/עָֽצֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/024.yaml
  text: Pleasant words are a honeycomb[b][a], sweet to the soul and healing to the bones.
translation:
  language: hi
  text: मनभावने वचन मधु के छत्ते जैसे हैं—प्राण के लिए मीठे और हड्डियों के लिए आरोग्यकारी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צוּף דְּבַשׁ
  choice: मधु के छत्ते
  rationale: यह पदबंध छत्ते के मधु अथवा मधु-छत्ते की ठोस छवि देता है। ‘मधु के छत्ते’ से हिन्दी में वह काव्यात्मक छवि स्वाभाविक रूप से बनी रहती है।
- source_word: אִמְרֵי נֹעַם
  choice: मनभावने वचन
  rationale: אִמְרֵי का अर्थ बोले हुए वचन/बातें और נֹעַם का अर्थ मनोहरता या सुखदता है। ‘मनभावने वचन’ अर्थ को नैतिक रूप से केवल ‘कृपालु’ कहकर सीमित किए बिना गरिमापूर्ण और सहज हिन्दी देता है।
- source_word: מָתוֹק
  choice: मीठे
  rationale: मूल का स्वाद-संबंधी रूपक सीधे बनाए रखा गया है और यह मधु की छवि के अनुरूप है।
- source_word: לַנֶּפֶשׁ
  choice: प्राण के लिए
  rationale: נֶפֶשׁ व्यक्ति के प्राण, जीवन या स्वयं को सूचित कर सकता है। ‘प्राण’ काव्यात्मक शारीरिक-आंतरिक समानांतरता को बनाए रखता है और इसे केवल भावना अथवा अमूर्त आत्मा तक सीमित नहीं करता।
- source_word: וּמַרְפֵּא
  choice: और ... आरोग्यकारी
  rationale: מַרְפֵּא आरोग्य, चंगाई या उपचार को दर्शाता है। ‘आरोग्यकारी’ हिन्दी में स्वाभाविक ढंग से बताता है कि ये वचन स्वास्थ्य/चंगाई लाते हैं।
- source_word: לָעָצֶם
  choice: हड्डियों के लिए
  rationale: एकवचन עֶצֶם यहाँ सामूहिक अर्थ रख सकता है। हिन्दी में ‘हड्डियों’ बहुवचन शारीरिक छवि को स्पष्ट और स्वाभाविक रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘मनभावने’ और ‘आरोग्यकारी’ सामान्य पाठक के लिए बोधगम्य रहते हुए काव्यात्मक समानांतरता तथा मूल की मधु, प्राण और हड्डियों वाली मूर्त छवियों को सुरक्षित रखते हैं।
