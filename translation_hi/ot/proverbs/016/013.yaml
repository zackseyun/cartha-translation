  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होंठ’ का काव्यात्मक रूपक सुरक्षित है, पर ‘धर्म की बातें बोलनेवाले’ जोड़कर उसका आशय स्पष्ट किया गया है। दोनों खंडों के बीच समानांतरता दिखाने के लिए अर्धविराम प्रयुक्त है।
