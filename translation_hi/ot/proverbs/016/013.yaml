  text: רְצ֣וֹן מְ֭לָכִים שִׂפְתֵי צֶ֑דֶק וְ/דֹבֵ֖ר יְשָׁרִ֣ים יֶאֱהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/013.yaml
  text: Righteous lips are the delight of kings[b][a], and he loves one who speaks what is upright.
translation:
  language: hi
  text: न्यायपूर्ण बातें बोलनेवाले होंठ राजाओं को प्रिय हैं[a]; और जो सीधी-सच्ची बातें कहता है, उससे राजा प्रेम करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “न्याय/धार्मिकता के होंठ राजाओं की प्रसन्नता हैं।” “प्रसन्नता” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “अनुग्रह,” “स्वीकृति,” या “प्रियता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सीधी-सच्ची बातें” का अनुवाद “जो ठीक है” भी किया जा सकता है। मूल में “प्रेम करता है” एकवचन है; इसलिए यहाँ प्रतिनिधिक एकवचन “राजा” रखा गया है।
    reason: lexical_and_grammatical_clarification
lexical_decisions:
- source_word: רְצוֹן
  choice: भाते हैं
  rationale: यह संज्ञा प्रसन्नता, रुचि, स्वीकृति या अनुग्रह का भाव व्यक्त कर सकती है। यहाँ स्वाभाविक हिन्दी में यह बताया गया है कि ऐसी वाणी राजाओं को प्रसन्न करती है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: मूल का ठोस बहुवचन और राजकीय संदर्भ सीधे सुरक्षित रखता है।
- source_word: שִׂפְתֵי צֶדֶק
  choice: धर्म की बातें बोलनेवाले होंठ
  rationale: मूल के ‘होंठ’ रूपक को बनाए रखते हुए צֶדֶק के नैतिक रूप से सही और न्यायसंगत वाणी के भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְדֹבֵר
  choice: और जो ... कहता है
  rationale: कृदंत को सामान्य व्यक्ति के अर्थ में स्वाभाविक सम्बन्धवाचक वाक्यांश से व्यक्त किया गया है।
- source_word: יְשָׁרִים
  choice: सीधी-सच्ची बातें
  rationale: बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और खरी, सीधी तथा नैतिक रूप से सही बातों की ओर संकेत करता है।
- source_word: יֶאֱהָב
  choice: राजा प्रेम करता है
  rationale: क्रिया मूल में एकवचन है। पहले चरण के बहुवचन ‘राजाओं’ को यांत्रिक रूप से इसका व्याकरणिक कर्ता बनाने के बजाय दूसरे चरण में प्रतिनिधिक एकवचन ‘राजा’ स्पष्ट किया गया है; वर्तमान काल नीतिवचन के सामान्य, बारंबार सत्य को व्यक्त करता है।
