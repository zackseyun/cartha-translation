  text: In the light of a king’s face there is life[b][a], and his favor is like a cloud of spring rain.
translation:
  language: hi
  text: राजा के मुख की चमक में जीवन है,[a] और उसकी कृपा वसंत की वर्षा के बादल के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यह बिंब राजा की प्रसन्न मुख-मुद्रा और सद्भाव से मिलने वाले जीवन और आशीष का है—जैसे फसल के लिए लाभकारी मौसम की अंतिम वर्षा। अधिक शाब्दिक अनुवाद: “उत्तरकालीन वर्षा का बादल।”'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: בְּ/אוֹר פְּנֵי מֶלֶךְ
  choice: राजा के मुख के प्रकाश में
  rationale: यह अनुवाद इब्रानी के ठोस बिंब ‘मुख का प्रकाश’ को बनाए रखता है। संदर्भ में यह राजा की प्रसन्न और अनुकूल मुख-मुद्रा को दर्शाता है, पर मुख्य पाठ उस अर्थ को व्याख्या के रूप में नहीं जोड़ता।
- source_word: חַיִּים
  choice: जीवन है
  rationale: इब्रानी का बहुवचन संज्ञा-रूप यहाँ मुहावरे के अनुसार ‘जीवन’ का अर्थ देता है; क्रियारहित वाक्य को हिन्दी में स्वाभाविक बनाने के लिए ‘है’ जोड़ा गया है।
- source_word: וּ/רְצוֹנ/וֹ
  choice: और उसकी कृपा
  rationale: רָצוֹן राजकीय प्रसंग में अनुग्रह, सद्भाव या स्वीकृति को व्यक्त करता है। ‘कृपा’ सामान्य हिन्दी में स्वाभाविक है और राजा की अनुकूलता का भाव रखता है।
- source_word: כְּ/עָב
  choice: बादल के समान
  rationale: तुलनासूचक כְּ और עָב के बिंब को स्पष्ट तथा स्वाभाविक हिन्दी उपमा में रखा गया है।
- source_word: מַלְקוֹשׁ
  choice: वसंत की वर्षा
  rationale: यह शब्द फसल पकने से पहले की लाभकारी उत्तरकालीन मौसमी वर्षा को दर्शाता है। ‘वसंत की वर्षा’ आधुनिक पाठक के लिए मौसम-संबंधी अर्थ स्पष्ट करती है।
