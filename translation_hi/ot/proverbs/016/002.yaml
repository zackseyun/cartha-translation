source:
  edition: WLC
  text: כָּֽל דַּרְכֵי אִ֭ישׁ זַ֣ךְ בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן רוּח֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/002.yaml
  text: All a man's ways are pure in his own eyes[b][a], but Yahweh weighs the spirits.
translation:
  language: hi
  text: मनुष्य के सभी मार्ग उसकी अपनी दृष्टि में शुद्ध होते हैं,[a] परन्तु यहोवा आत्माओं को तौलता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के सभी मार्ग उसकी अपनी आँखों में निर्मल होते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा आत्माओं को परखता है”; अथवा भावार्थ, “यहोवा मनसूबों का मूल्यांकन करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: सभी
  rationale: यह परिमाणवाचक शब्द आगे आने वाले बहुवचन ‘मार्ग’ की समग्रता को व्यक्त करता है।
- source_word: דַּרְכֵי אִישׁ
  choice: मनुष्य के ... मार्ग
  rationale: नीतिवचन के संदर्भ में ‘मार्ग’ जीवन-चाल, आचरण और कार्य-प्रणाली का रूपक है। אִישׁ पुल्लिंग एकवचन होते हुए यहाँ प्रतिनिधिक सामान्य अर्थ रखता है; ‘मनुष्य’ हिंदी में इस रूप को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: זַךְ
  choice: शुद्ध
  rationale: यह नैतिक स्व-मूल्यांकन के संदर्भ में निर्मलता या शुद्धता दर्शाता है; ‘निर्दोष’ न्यायिक निष्पापता का अधिक प्रबल दावा कर सकता है।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: इब्रानी मुहावरे का अर्थ व्यक्ति के अपने आकलन के अनुसार है; ‘अपनी’ आत्म-संदर्भित बल को स्पष्ट करता है।
- source_word: וְתֹכֵן
  choice: तौलता है
  rationale: क्रिया मापने या तौलने का अर्थ रखती है। ‘तौलता है’ मानव के स्व-मूल्यांकन के विपरीत यहोवा के सटीक परीक्षण का रूपक बनाए रखता है।
- source_word: רוּחוֹת
  choice: आत्माओं
  rationale: बहुवचन शब्द यहाँ मनुष्यों के भीतरी आत्मिक स्वभाव या प्रवृत्तियों की ओर संकेत करता है। शाब्दिक रूप व्यापक अर्थ और मूल रूपक को सुरक्षित रखता है; ‘उद्देश्यों’ अधिक व्याख्यात्मक और संकीर्ण है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: רוּחוֹת का मानवशास्त्रीय अर्थ
  choice: मनुष्यों की भीतरी आत्माएँ या आंतरिक प्रवृत्तियाँ, जिन्हें यहोवा तौलता है
  alternative: मनसूबे/उद्देश्य; श्वासें या हवाएँ
  rationale: मानव स्व-दृष्टि के साथ विरोध और ज्ञान-साहित्य के प्रसंग में यह शब्द भीतरी आत्मिक दशा को सबसे स्वाभाविक रूप से दर्शाता है। ‘उद्देश्य’ अर्थ का एक पहलू स्पष्ट करता है, पर मूल की व्यापकता घटाता है।
- issue: प्रतिनिधिक पुल्लिंग אִישׁ
  choice: मनुष्य
  alternative: व्यक्ति; आदमी
  rationale: मूल में पुल्लिंग एकवचन सामान्य प्रतिनिधिक अर्थ में है। ‘मनुष्य’ आधुनिक मानक हिंदी में गरिमापूर्ण और स्वाभाविक है तथा कथन की सार्वभौमिक प्रयोज्यता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। ‘मार्ग’, ‘दृष्टि’, ‘शुद्ध’ और ‘तौलता’ मूल के रूपकों को स्वाभाविक हिंदी में सुरक्षित रखते हैं।
