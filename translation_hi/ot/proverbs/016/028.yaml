  yaml_path: translation/ot/proverbs/016/028.yaml
  text: A perverse man stirs up strife[c][b][a], and a whisperer separates close friends.
translation:
  language: hi
  text: कुटिल मनुष्य झगड़ा भड़काता है[a], और चुगलखोर[b] घनिष्ठ मित्रों में फूट डाल देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “झगड़ा भेजता है” या “झगड़ा छोड़ देता है।” “कुटिल” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “कुटिलता” या “टेढ़ापन” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कानाफूसी करनेवाला” अथवा “बदनामी करनेवाला।” इब्रानी शब्द ऐसे व्यक्ति को दर्शाता है जो छिपे या दबे ढंग से ऐसी बातें कहता है जिनसे संबंध बिगड़ते हैं।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी में एकवचन है: “घनिष्ठ मित्र” या “अंतरंग साथी।” यहाँ बहुवचन नीतिवचन की सामान्य सच्चाई को स्वाभाविक हिन्दी में व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ תַּהְפֻּכוֹת
  choice: कुटिल मनुष्य
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘कुटिलताओं का मनुष्य’ है। ‘कुटिल मनुष्य’ उसके विकृत या टेढ़े स्वभाव को स्वाभाविक और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְשַׁלַּח מָדוֹן
  choice: झगड़ा भड़काता है
  rationale: क्रिया का मूल अर्थ ‘भेजता/छोड़ता है’ है, पर ‘झगड़े’ के साथ इसका भाव विवाद को आरम्भ करने या हवा देने का है। ‘भड़काता है’ हिन्दी में इस प्रभाव को स्पष्ट करता है।
- source_word: נִרְגָּן
  choice: चुगलखोर
  rationale: यह शब्द दबे स्वर में ऐसी बातें फैलानेवाले व्यक्ति को सूचित करता है जो संबंधों को हानि पहुँचाती हैं। ‘चुगलखोर’ इस निंदात्मक और संबंध-विघातक भाव को सामान्य हिन्दी में व्यक्त करता है।
- source_word: מַפְרִיד
  choice: फूट डाल देता है
  rationale: शाब्दिक अर्थ ‘अलग करता है’ है। यहाँ आशय निकट संबंध को तोड़ने का है, जिसे ‘फूट डाल देता है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַלּוּף
  choice: घनिष्ठ मित्रों
  rationale: इस प्रसंग में शब्द किसी प्रधान या अगुवे के बजाय अंतरंग साथी को दर्शाता है। हिन्दी बहुवचन नीतिवचन के सामान्य कथन को स्वाभाविक रूप देता है।
