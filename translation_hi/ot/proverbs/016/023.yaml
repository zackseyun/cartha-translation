  text: לֵ֣ב חָ֭כָם יַשְׂכִּ֣יל פִּ֑י/הוּ וְ/עַל שְׂ֝פָתָ֗י/ו יֹסִ֥יף לֶֽקַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/023.yaml
  text: The heart of a wise man gives insight to his mouth[b][a], and adds learning to his lips.
translation:
  language: hi
  text: बुद्धिमान का हृदय उसके मुँह को विवेकशील बनाता है[a], और उसके होंठों पर शिक्षा बढ़ाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मुँह को समझदारी से बोलना सिखाता है।” हिब्रू क्रिया में समझ या विवेक उत्पन्न करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके होंठों की प्रभावशीलता बढ़ाता है।” यहाँ לֶקַח का अर्थ शिक्षा या सीख हो सकता है और प्रसंग में यह शिक्षाप्रद अथवा प्रभावशाली वाणी की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: यहाँ לֵב मनुष्य के भीतरी विवेक, सोच और निर्णय-शक्ति को दर्शाता है। ‘हृदय’ हिब्रू बिंब को बनाए रखता है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमान’ स्वाभाविक हिंदी में प्रतिनिधिक व्यक्ति का बोध कराता है।
- source_word: יַשְׂכִּיל פִּיהוּ
  choice: उसके मुँह को समझदारी से बोलना सिखाता है
  rationale: שׂכל का हिफ़ील रूप समझदार या विवेकपूर्ण बनाने का कारक भाव रखता है। यह रूप हिंदी में उस आशय को स्वाभाविक ढंग से व्यक्त करता और ‘मुँह’ का ठोस बिंब बचाए रखता है।
- source_word: וְעַל שְׂפָתָיו
  choice: और उसके होंठों पर
  rationale: עַל के ‘पर’ अर्थ और ‘होंठ’ के काव्यात्मक बिंब को बनाए रखा गया है; यह पहले चरण के ‘मुँह’ के समानांतर है।
- source_word: יֹסִיף לֶקַח
  choice: शिक्षा बढ़ाता है
  rationale: יסף का अर्थ बढ़ाना या जोड़ना है, और לֶקַח ग्रहण की गई शिक्षा अथवा शिक्षाप्रद बात को सूचित कर सकता है। ‘शिक्षा बढ़ाता है’ मूल की संक्षिप्तता और अर्थगत खुलापन पर्याप्त रूप से बनाए रखता है।
