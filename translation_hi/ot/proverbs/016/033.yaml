  yaml_path: translation/ot/proverbs/016/033.yaml
  text: The lot is cast into the lap[a], but its every decision is from Yahweh.
translation:
  language: hi
  text: 'गोद में चिट्ठी डाली जाती है,

    पर उसका हर निर्णय[a] याहवे की ओर से होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका हर फैसला” या “उसका हर न्यायिक निर्णय।” इब्रानी शब्द में न्यायिक निर्णय की अर्थ-छाया भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֵיק
  choice: गोद में
  rationale: חֵיק का शाब्दिक अर्थ छाती, गोद या वस्त्र की तह हो सकता है। यहाँ यह उस स्थान को दर्शाता है जहाँ निर्णय के लिए चिट्ठी डाली जाती थी; ‘गोद में’ मूल बिंब को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יוּטַל
  choice: डाली जाती है
  rationale: होफ़ाल रूप निष्क्रिय अर्थ देता है—चिट्ठी को डाला जाता है। हिंदी में ‘डाली जाती है’ इस क्रिया को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: גּוֹרָל निर्णय या बँटवारे के लिए प्रयुक्त लॉट को दर्शाता है। ‘चिट्ठी’ आधुनिक हिंदी में समझने योग्य है और प्राचीन विधि को अनावश्यक रूप से ‘पासा’ तक सीमित नहीं करती।
- source_word: וּמֵיְהוָה
  choice: पर ... यहोवा की ओर से
  rationale: וְ मूलतः ‘और’ है, पर दोनों पंक्तियों में मानव क्रिया और परिणाम के स्रोत के बीच निहित विरोध को हिंदी में ‘पर’ स्पष्ट करता है। מֵ स्रोत को ‘की ओर से’ द्वारा व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: כָּל
  choice: हर
  rationale: एकवचन संज्ञा के साथ כָּל का वितरणात्मक अर्थ है; ‘हर’ प्रत्येक निर्णय को समाहित करता है।
- source_word: מִשְׁפָּטוֹ
  choice: उसका ... निर्णय
  rationale: מִשְׁפָּט का अर्थ न्याय, फैसला या निर्णय हो सकता है। चिट्ठी डालने के प्रसंग में ‘निर्णय’ स्वाभाविक है और न्यायिक अर्थ-छाया को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: प्रतीततः संयोगपूर्ण घटना और परमेश्वर की प्रभुता
  choice: मनुष्य चिट्ठी डालता है, पर उससे निकला हर निर्णय यहोवा की ओर से होता है।
  alternative: यह कथन केवल पवित्र चिट्ठी डालने की विधि के विषय में हो सकता है, अथवा सामान्यतः सभी प्रतीततः संयोगपूर्ण परिणामों पर परमेश्वर के विधान की ओर संकेत कर सकता है।
  rationale: इब्रानी पाठ मानवीय क्रिया और निर्णय के स्रोत के बीच तनाव को स्पष्ट रखता है। अनुवाद उस कथन को व्यापक व्यवस्थित सिद्धांत में फैलाए बिना उसी सीमा में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कहावत-सदृश रखी गई है। समानांतर दो पंक्तियाँ मूल की काव्यात्मक संरचना और विरोध को स्पष्ट करती हैं।
