  text: A divine verdict is on the lips of a king[b][a]; his mouth does not betray justice.
translation:
  language: hi
  text: राजा के होंठों पर ईश्वरीय निर्णय है[a]; न्याय करते समय उसका मुँह दगा नहीं देता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क़ेसेम का सामान्य अर्थ ‘भविष्यकथन’ या ‘शकुन-विचार’ होता है; इसका अर्थ ‘देववाणी’ भी हो सकता है। यहाँ न्यायिक संदर्भ के कारण इसका अनुवाद ‘ईश्वरीय निर्णय’ किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या “न्याय में” अथवा “न्याय के विषय में।”
