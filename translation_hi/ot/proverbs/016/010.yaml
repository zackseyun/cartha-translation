lexical_decisions:
- source_word: קֶסֶם
  choice: ईश्वरीय निर्णय
  rationale: यह शब्द प्रायः शकुन-विचार या देववाणी को दर्शाता है, पर यहाँ राजा की न्यायिक वाणी और समानांतर पंक्ति में न्याय के उल्लेख के कारण ‘ईश्वरीय निर्णय’ उसके अलौकिक-अधिकारयुक्त भाव और न्यायिक संदर्भ—दोनों को व्यक्त करता है।
- source_word: עַל שִׂפְתֵי מֶלֶךְ
  choice: राजा के होंठों पर … होता है
  rationale: इब्रानी के स्थानसूचक बिंब और सामान्य रूप से किसी राजा के विषय में कही गई नीतिवचनात्मक बात को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּמִשְׁפָּט
  choice: न्याय करते समय
  rationale: पूर्वसर्ग सहित यह पद न्यायिक निर्णय के क्षेत्र या अवसर को बता सकता है; ‘न्याय करते समय’ हिन्दी में उस क्रियात्मक न्यायिक संदर्भ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא יִמְעַל
  choice: विश्वासघात नहीं करता
  rationale: क्रिया में बेवफाई, छल या सौंपे हुए दायित्व का उल्लंघन करने का भाव है। यह चुनाव आदर्श राजकीय न्याय में वाणी की निष्ठा पर बल देता है, बिना इसे केवल अनजाने में हुई भूल तक सीमित किए।
- source_word: פִּיו
  choice: उसका मुँह
  rationale: पहली पंक्ति के ‘होंठों’ से भिन्न इब्रानी शब्दावली को बनाए रखते हुए राजा की बोली हुई वाणी पर ध्यान रखता है।
theological_decisions:
- issue: क्या קֶסֶם को उसके सामान्यतः नकारात्मक अर्थ ‘शकुन-विचार’ में अनूदित किया जाए या संदर्भानुसार सकारात्मक न्यायिक अर्थ में
  choice: न्यायिक समानांतरता के कारण ‘ईश्वरीय निर्णय’
  alternative: ‘शकुन-विचार’ या ‘देववाणी’
  rationale: यह नीतिवचन गुप्त विद्याओं का अनुमोदन करने के बजाय राजा की आदर्श न्यायिक वाणी का वर्णन करता प्रतीत होता है। फिर भी मूल शब्द की व्यापक और कभी नकारात्मक अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: בְּמִשְׁפָּט का संबंध न्याय की वस्तु से है या न्याय करने के अवसर से
  choice: 'अवसरगत अर्थ: ‘न्याय करते समय’'
  alternative: ‘न्याय के विषय में’ या ‘न्याय से’
  rationale: दोनों व्याकरणतः संभव हैं। अवसरगत अनुवाद राजकीय निर्णय के प्रसंग को सहज हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘होंठ’ और ‘मुँह’ मूल की समानांतर किंतु भिन्न देह-संबंधी शब्दावली को सुरक्षित रखते हैं।
