  yaml_path: translation/ot/proverbs/016/022.yaml
  text: Understanding is a fountain of life to its possessor[b][a], but the discipline of fools is folly.
translation:
  language: hi
  text: जिसके पास समझ है, उसके लिए समझ जीवन का सोता है; पर मूर्खों की शिक्षा[a] मूर्खता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिक्षा’ का अनुवाद ‘अनुशासन’ या ‘सुधार’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקוֹר
  choice: सोता
  rationale: यह शब्द जल के सोते, झरने या स्रोत को दर्शाता है। ‘सोता’ जीवन देने वाले जल की ठोस उपमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: इब्रानी में यह रूपात्मक रूप से बहुवचन है, पर यहाँ भाववाचक अर्थ ‘जीवन’ में प्रयुक्त हुआ है।
- source_word: שֵׂכֶל
  choice: समझ
  rationale: नीतिवचन में यह व्यावहारिक सूझ-बूझ और विवेकपूर्ण समझ को दर्शाता है; ‘समझ’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: בְּעָלָיו
  choice: जिसके पास ... है
  rationale: शाब्दिक अर्थ ‘उसका स्वामी/अधिकारी’ है। हिन्दी में ‘जिसके पास समझ है’ स्वामित्व-संबंध को स्पष्ट, स्वाभाविक और एकवचन में व्यक्त करता है।
- source_word: מוּסַר
  choice: अनुशासन
  rationale: यह शब्द शिक्षा, सुधार या ताड़ना के अर्थ भी रखता है। ‘अनुशासन’ इसकी सुधारात्मक धार को बनाए रखता है, जबकि पादटिप्पणी अर्थगत विस्तार और पंक्ति की अस्पष्टता बताती है।
- source_word: אֱוִלִים
  choice: मूर्खों
  rationale: नीतिवचन में यह नैतिक और व्यावहारिक रूप से हठी तथा बुद्धिहीन लोगों की स्थापित श्रेणी को दर्शाता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह मूर्खों के विशिष्ट गुण को बताने वाली भाववाचक संज्ञा है और कथन को तीखा, नीतिवचन-सुलभ अंत देती है।
