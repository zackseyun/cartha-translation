  text: The wise of heart is called discerning[a], and sweetness of lips increases learning.
translation:
  language: hi
  text: 'बुद्धिमान हृदय वाला व्यक्ति विवेकी कहलाता है,

    और होंठों की मधुरता सीख में वृद्धि करती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सीख में वृद्धि करती है” का अनुवाद “बात को अधिक प्रभावशाली बनाती है” या “शिक्षा बढ़ाती है” भी हो सकता है। इब्रानी शब्द ग्रहण की हुई सीख, दी जाने वाली शिक्षा, अथवा प्रभावशाली शिक्षण के परिणाम को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַחֲכַם לֵב
  choice: हृदय से बुद्धिमान व्यक्ति
  rationale: यह अभिव्यक्ति व्यक्ति की भीतरी बुद्धि और विवेक को दर्शाती है। हिंदी में स्वाभाविकता बनाए रखते हुए ‘हृदय’ की इब्रानी छवि सुरक्षित रखी गई है।
- source_word: יִקָּרֵא
  choice: कहलाता है
  rationale: यहाँ निफ़अल रूप किसी व्यक्ति के इस प्रकार पहचाने या माने जाने का भाव देता है। नीतिवचन की सामान्य उक्ति के लिए वर्तमान काल स्वाभाविक है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: यह शब्द समझ-बूझ और विवेक रखने वाले व्यक्ति को सूचित करता है। ‘समझदार’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: וּמֶתֶק שְׂפָתַיִם
  choice: और होंठों की मधुरता
  rationale: ‘मधुरता’ और ‘होंठ’ की मूल काव्यात्मक छवि को बनाए रखा गया है; यहाँ ‘होंठ’ वाणी के लिए लक्षणा है।
- source_word: יֹסִיף
  choice: बढ़ाती है
  rationale: हिफ़ईल रूप का अर्थ जोड़ना या बढ़ाना है। स्त्रीलिंग कर्ता ‘मधुरता’ के साथ ‘बढ़ाती है’ हिंदी में उपयुक्त है।
- source_word: לֶקַח
  choice: सीख
  rationale: इस शब्द में ग्रहण की हुई सीख, दी जाने वाली शिक्षा, और प्रभावशाली शिक्षण का भाव आ सकता है। मुख्य पाठ में संक्षिप्त ‘सीख’ चुना गया है और अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
