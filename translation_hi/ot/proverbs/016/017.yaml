  text: מְסִלַּ֣ת יְ֭שָׁרִים ס֣וּר מֵ/רָ֑ע שֹׁמֵ֥ר נַ֝פְשׁ֗/וֹ נֹצֵ֥ר דַּרְכּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/017.yaml
  text: The highway of the upright turns away from evil[b][a]; he who guards his life watches over his way.
translation:
  language: hi
  text: सज्जनों का राजमार्ग बुराई से दूर रहना है[a]; जो अपने जीवन[b] की रक्षा करता है, वह अपने मार्ग की रखवाली करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सज्जनों का राजमार्ग बुराई से दूर रहता है।” हिब्रू संज्ञात्मक वाक्य और infinitive के संबंध को इस प्रकार भी व्यक्त किया जा सकता है।
    reason: grammatical_alternative
  - marker: b
    text: हिब्रू में “उसका प्राण/जीव”; यहाँ इसका अर्थ संभवतः उसका जीवन या वह स्वयं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְסִלַּת
  choice: राजमार्ग
  rationale: מְסִלָּה सामान्य पगडंडी के बजाय प्रायः बनी हुई या ऊँची सड़क को दर्शाता है। ‘राजमार्ग’ इस विशिष्ट जीवन-मार्ग की सशक्त छवि बनाए रखता है।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: यह शब्द नैतिक रूप से सीधे और खरे लोगों को दर्शाता है। ‘सीधे लोग’ हिब्रू की ‘सीधाई’ वाली रूपक-छवि को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: סוּר מֵרָע
  choice: बुराई से हटना
  rationale: 'इन शब्दों का शाब्दिक अर्थ बुराई से अलग होना या मुड़ जाना है। संज्ञात्मक वाक्य-विन्यास रखने से हिब्रू की वास्तविक अस्पष्टता बनी रहती है: सीधे लोगों का राजमार्ग बुराई से हटना ही है।'
- source_word: רָע
  choice: बुराई
  rationale: नीतिवचन के इस नैतिक संदर्भ में यह शब्द हानि मात्र नहीं, बल्कि नैतिक बुराई का बोध कराता है।
- source_word: שֹׁמֵר נַפְשׁוֹ
  choice: अपने प्राण की रक्षा करता है
  rationale: נֶפֶשׁ यहाँ पूरे व्यक्ति अथवा उसके जीवन को सूचित करता है, न कि अनिवार्य रूप से शरीर से अलग किसी तकनीकी ‘आत्मा’ को। ‘प्राण’ हिंदी में जीवन/स्वयं का भाव रखते हुए मूल शब्द की व्यापकता बचाता है।
- source_word: נֹצֵר דַּרְכּוֹ
  choice: अपने मार्ग पर सावधानी से चलता है
  rationale: נצר का भाव ध्यानपूर्वक निगरानी या रखवाली करना है। यह अभिव्यक्ति हिंदी में स्वाभाविक रूप से अपने आचरण पर चौकसी रखने का अर्थ देती है और पहले खंड के שׁמר से शब्दगत भेद भी बनाए रखती है।
theological_decisions:
- issue: ज्ञान-साहित्य में נֶפֶשׁ का अर्थ
  choice: प्राण, अर्थात व्यक्ति का जीवन/स्वयं
  alternative: आत्मा, एक तकनीकी मानवशास्त्रीय अर्थ में
  rationale: कहावत नैतिक आचरण और आत्म-संरक्षण की बात करती है। ‘प्राण’ मूल की व्यापकता को बनाए रखता और ऐसी शरीर-आत्मा द्वैत-धारणा आरोपित नहीं करता जिसकी यहाँ आवश्यकता नहीं है।
- issue: पहले उपवाक्य का व्याकरणिक संबंध
  choice: ‘राजमार्ग बुराई से हटना है’—संज्ञात्मक पहचान/विवरण
  alternative: ‘राजमार्ग बुराई से हट जाता है’—मार्ग को कर्ता बनाकर क्रियात्मक कथन
  rationale: हिब्रू में מְסִלַּת יְשָׁרִים के बाद infinitive construct סוּר आया है। संज्ञात्मक हिंदी मूल की संरचना और इस अर्थ को बचाती है कि सीधे लोगों का जीवन-पथ बुराई का त्याग करने में निहित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज ज्ञान-साहित्यिक स्वर अपनाया गया है। ‘राजमार्ग’, ‘प्राण’ और ‘मार्ग’ मूल की रूपकात्मक भाषा बनाए रखते हैं; पादटिप्पणियाँ वास्तविक व्याकरणिक और शाब्दिक विकल्प स्पष्ट करती हैं।
