base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/020.yaml
  text: Whoever gives careful attention to a matter will find good[b][a], and blessed is he who trusts in Yahweh.
translation:
  language: hi
  text: जो किसी बात पर समझ-बूझ से विचार करता है[a], वह भलाई पाएगा; और जो याहवे पर भरोसा रखता है, वह धन्य है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जो किसी बात में बुद्धिमानी से काम करता है’ या ‘जो किसी बात के विषय में विवेकशील है’ भी हो सकता है। इब्रानी शब्द דָּבָר का अर्थ ‘वचन’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप ‘धन्य है वह’ है; यहाँ यह सामान्य रूप से हर उस व्यक्ति को दर्शाता है जो याहवे पर भरोसा रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל עַל דָּבָר
  choice: किसी बात पर समझ-बूझ से ध्यान देता है
  rationale: שׂכל का हिफ़ील कृदंत सूझ-बूझ से विचार करने या बुद्धिमानी से काम करने का सक्रिय भाव रखता है। עַל דָּבָר के साथ यह अनुवाद सावधान, व्यावहारिक विचार को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘बात’ דָּבָר की व्यापकता बनाए रखती है।
- source_word: יִמְצָא טוֹב
  choice: भलाई पाएगा
  rationale: מצא का मूल अर्थ ‘पाना’ है और טוֹב यहाँ लाभ, कल्याण या अच्छी परिणति का व्यापक अर्थ रखता है। ‘भलाई’ इसे केवल भौतिक समृद्धि तक सीमित नहीं करती।
- source_word: וּבוֹטֵחַ בַּיהוָה
  choice: और जो याहवे पर भरोसा रखता है
  rationale: कृदंत בּוֹטֵחַ सामान्य रूप से किसी भी भरोसा रखने वाले व्यक्ति को दर्शाता है। בְּ के साथ בטח का स्वाभाविक हिन्दी रूप ‘पर भरोसा रखना’ है; परमेश्वर का व्यक्तिगत नाम יְהוָה ‘याहवे’ रूप में रखा गया है।
- source_word: אַשְׁרָיו
  choice: वह धन्य है
  rationale: אַשְׁרֵי-वाक्यांश केवल मन की खुशी नहीं, बल्कि परमेश्वर की कृपा में कल्याण और फलने-फूलने की अवस्था व्यक्त करता है। हिन्दी का ‘धन्य’ इस आशीष-वचन का बल बनाए रखता है; ‘जो…वह’ रचना पुंलिंग रूप को किसी भी व्यक्ति पर लागू होने वाले सामान्य कथन के रूप में स्वाभाविक बनाती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम יְהוָה स्पष्ट रूप से है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: אַשְׁרָיו में धन्यता का स्वरूप
  choice: वह धन्य है
  alternative: वह सुखी है / उसका कल्याण है
  rationale: ‘धन्य’ बाहरी समृद्धि या केवल भावनात्मक प्रसन्नता का दावा किए बिना आशीष और सच्चे कल्याण, दोनों का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर नीतिवचन शैली को अर्धविराम से स्पष्ट किया गया है। ‘समझ-बूझ’, ‘भलाई’, ‘भरोसा’ और ‘धन्य’ सामान्य पाठक के लिए परिचित हैं तथा मूल के अर्थ-क्षेत्र को अनावश्यक रूप से संकीर्ण नहीं करते।
