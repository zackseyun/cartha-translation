source:
  edition: WLC
  text: טוֹב מְ֭עַט בִּ/צְדָקָ֑ה מֵ/רֹ֥ב תְּ֝בוּא֗וֹת בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/008.yaml
  text: Better a little with righteousness than great income without justice.
translation:
  language: hi
  text: सही आचरण के साथ थोड़ा-सा होना, न्याय के बिना बहुत-सी आय से अच्छा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב מְעַט
  choice: थोड़ा-सा धन भी ... अच्छा है
  rationale: हिब्रू में वस्तु केवल ‘थोड़ा’ कहकर निहित छोड़ी गई है; हिन्दी में तुलना को स्वाभाविक और स्पष्ट बनाने के लिए ‘धन’ जोड़ा गया है, जबकि ‘थोड़ा’ का मूल भाव सुरक्षित है।
- source_word: בִּצְדָקָה
  choice: धार्मिकता के साथ
  rationale: צְדָקָה यहाँ नैतिक रूप से सही और न्यायपूर्ण आचरण का व्यापक भाव रखता है; ‘धार्मिकता’ इस कहावत में उस व्यापक नैतिक अर्थ को बनाए रखता है।
- source_word: מֵרֹב תְּבוּאוֹת
  choice: बड़ी कमाई से
  rationale: תְּבוּאוֹת का मूल अर्थ उपज अथवा प्राप्तियाँ है; इस आर्थिक तुलना में ‘बड़ी कमाई’ आधुनिक हिन्दी में स्वाभाविक है और आय/लाभ के व्यापक भाव को व्यक्त करती है।
- source_word: בְּלֹא מִשְׁפָּט
  choice: अन्याय से होने वाली
  rationale: शाब्दिक अर्थ ‘न्याय के बिना’ है। सम्बन्धसूचक हिन्दी वाक्य-विन्यास में यह स्पष्ट किया गया है कि बड़ी कमाई अन्यायपूर्ण ढंग से प्राप्त होती है।
theological_decisions:
- issue: צְדָקָה और מִשְׁפָּט के बीच नैतिक विरोध
  choice: ‘धार्मिकता’ और ‘अन्याय’
  alternative: ‘सच्चाई’ और ‘न्याय के बिना’
  rationale: 'चयन मूल पद के व्यापक नैतिक विरोध को बनाए रखता है: कम साधनों के साथ सही आचरण, अन्याय से प्राप्त बहुतायत से श्रेष्ठ है। इसे किसी विशिष्ट सांप्रदायिक अर्थ तक सीमित नहीं किया गया।'
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली। ‘धन’ का हल्का स्पष्टीकरण सामान्य पाठक के लिए तुलना को सहज बनाता है।
