  timestamp: '2026-07-15T23:31:47Z'
review_pass:
  verdict: revise
  source_fidelity: The comparison and overall proverbial force are retained. However, adding ‘धन’ narrows the deliberately unspecified ‘a little,’ and ‘अन्याय से होने वाली’ introduces an explicit causal sense (‘obtained through injustice’) where the Hebrew more literally says ‘without justice.’
  naturalness: The draft is fluent modern Hindi, but the revised wording is equally natural and more closely follows the compact comparative structure of the proverb.
  terminology: ‘धार्मिकता’ can suggest primarily religious piety in contemporary Hindi, whereas צְדָקָה here denotes right/righteous conduct in contrast with מִשְׁפָּט (‘justice’). ‘सही आचरण’ preserves the ethical sense without imposing a sectarian nuance; ‘न्याय’ renders מִשְׁפָּט directly.
  issues:
  - severity: medium
    issue: ‘धन’ is added for the source’s unexpressed ‘a little.’
    rationale: מְעַט is substantival and leaves the object unspecified. The addition restricts the proverb to money, although the contrast is broadly between a small amount and abundant returns.
  - severity: medium
    issue: ‘अन्याय से होने वाली’ makes the final phrase explicitly causal.
    rationale: בְּלֹא מִשְׁפָּט means ‘without justice.’ It may imply unjust acquisition in context, but the source does not explicitly state ‘arising from injustice’; the Hindi should preserve that compact ambiguity.
  - severity: low
    issue: ‘धार्मिकता’ may be read as religious devotion rather than ethical righteousness.
    rationale: In this parallelism, the moral contrast is between righteous/right conduct and absence of justice. ‘सही आचरण’ communicates that sense more directly in modern standard Hindi.
  revised_text: सही आचरण के साथ थोड़ा-सा होना, न्याय के बिना बहुत-सी आय से अच्छा है।
  revised_footnotes: []
