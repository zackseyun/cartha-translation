revisions:
- from: धार्मिकता के साथ थोड़ा-सा धन भी अन्याय से होने वाली बड़ी कमाई से अच्छा है।
  to: सही आचरण के साथ थोड़ा-सा होना, न्याय के बिना बहुत-सी आय से अच्छा है।
  rationale: The revision removes the unsupported specification of ‘wealth,’ avoids turning ‘without justice’ into an explicit statement of causal origin, and uses modern Hindi ethical terminology that reflects the source’s צדקה/מִשְׁפָּט contrast. No footnote is needed because the resulting wording preserves the source’s ambiguity without obscuring its sense.
