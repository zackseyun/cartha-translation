base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/030.yaml
  text: He who shuts his eyes to devise perverse things[a], who purses his lips[b], has completed evil.
translation:
  language: hi
  text: 'जो अपनी आँखें मूँदकर कुटिल योजनाएँ बनाता है,

    और अपने होंठ भींचता है,

    वह बुराई को अंजाम तक पहुँचा चुका है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹצֶה עֵינָיו
  choice: अपनी आँखें मूँदकर
  rationale: यह अभिव्यक्ति आँखें बंद करने के जानबूझकर किए गए संकेत को स्वाभाविक हिन्दी में व्यक्त करती है; कृदन्त का सम्बन्ध अगली क्रिया में बताई गई साज़िश से है।
- source_word: לַחְשֹׁב
  choice: योजनाएँ बनाता है
  rationale: חשב यहाँ केवल सोचने के बजाय सोच-समझकर योजना गढ़ने का भाव रखता है। बहुवचन कर्म के साथ हिन्दी में ‘योजनाएँ बनाना’ सहज है।
- source_word: תַּהְפֻּכוֹת
  choice: कुटिल योजनाएँ
  rationale: शब्द टेढ़ी, विकृत या छलपूर्ण बातों को सूचित करता है। ‘कुटिल’ नैतिक टेढ़ेपन को व्यक्त करता है और ‘योजनाएँ’ प्रसंगानुसार निहित षड्यंत्रकारी बातों को स्पष्ट करता है।
- source_word: קֹרֵץ שְׂפָתָיו
  choice: अपने होंठ भींचता है
  rationale: קרץ का कर्म यहाँ ‘होंठ’ है, इसलिए आँख मारने का अर्थ उपयुक्त नहीं। ‘होंठ भींचना’ दुर्भावनापूर्ण संकल्प के शारीरिक संकेत को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: כִּלָּה רָעָה
  choice: बुराई को अंजाम देता है
  rationale: Piel כִּלָּה किसी काम को पूरा करने या उसके अंतिम परिणाम तक पहुँचाने का भाव देता है। ‘अंजाम देता है’ हिन्दी में इस पूर्णता और क्रियान्वयन दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: כִּלָּה רָעָה में पूर्णता या परिणाम का भाव
  choice: बुराई को अंजाम देता है
  alternative: बुराई पूरी कर चुका है
  rationale: हिब्रू पूर्ण क्रिया को सामान्य नीतिवचनात्मक परिणाम के रूप में समझा गया है। हिन्दी वर्तमान काल इस प्रकार के चरित्र और उसके सुनिश्चित परिणाम को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘पूरी कर चुका है’ अनावश्यक रूप से किसी एक पूर्व घटना का आभास दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की समानांतर संरचना तीन पंक्तियों में सुरक्षित है। किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
