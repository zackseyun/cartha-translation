source:
  edition: WLC
  text: לִ/פְנֵי שֶׁ֥בֶר גָּא֑וֹן וְ/לִ/פְנֵ֥י כִ֝שָּׁל֗וֹן גֹּ֣בַהּ רֽוּחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/018.yaml
  text: Pride comes before destruction[a], and a haughty spirit before a fall.
translation:
  language: hi
  text: 'विनाश से पहले घमंड होता है[a],

    और गिरने से पहले अभिमानी मन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विनाश से पहले घमंड, और ठोकर खाने से पहले मन की ऊँचाई।”
    reason: मूल इब्रानी की संज्ञात्मक, संतुलित रचना और उसके अधिक शाब्दिक शब्दों को दिखाने के लिए।
lexical_decisions:
- source_word: לִפְנֵי
  choice: से पहले
  rationale: यहाँ यह पूर्वसर्ग कालगत क्रम बताता है—घमंड विनाश से पहले आता है।
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: मूल शब्द का शाब्दिक अर्थ टूटना है, पर ज्ञान-साहित्य के इस संदर्भ में यह बरबादी या विनाश को दर्शाता है।
- source_word: גָּאוֹן
  choice: घमंड
  rationale: यद्यपि अन्य संदर्भों में यह शब्द महिमा या प्रताप बता सकता है, यहाँ विनाश के साथ समानांतरता के कारण इसका नकारात्मक अर्थ घमंड है।
- source_word: כִּשָּׁלוֹן
  choice: गिरना
  rationale: यह शब्द ठोकर खाने, गिरने या पतन की धारणा व्यक्त करता है; 'गिरना' सरल और स्वाभाविक हिंदी है।
- source_word: גֹּבַהּ רוּחַ
  choice: अभिमानी मन
  rationale: शाब्दिक रूप से यह 'आत्मा/मन की ऊँचाई' है। हिंदी में 'अभिमानी मन' इसके आंतरिक अहंकार के भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: גָּאוֹן और גֹּבַהּ רוּחַ का नैतिक भाव
  choice: दोनों को नकारात्मक अर्थ में घमंड और अभिमानी मन के रूप में प्रस्तुत किया गया है।
  alternative: गौरव/प्रताप और ऊँचा मन
  rationale: दोनों गुण क्रमशः विनाश और गिरने से जोड़े गए हैं, इसलिए समानांतर रचना यहाँ नकारात्मक नैतिक अर्थ स्पष्ट करती है; यह संदर्भगत भाषिक निर्णय है।
translation_notes:
  register: भाषा संक्षिप्त, कहावत-सदृश और आधुनिक मानक हिंदी में रखी गई है। दूसरी पंक्ति में क्रिया का लोप मूल की संतुलित काव्यात्मक शैली को बनाए रखता है और हिंदी में स्वाभाविक है।
