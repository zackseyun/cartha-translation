  text: תּוֹעֲבַ֣ת יְ֭הוָה כָּל גְּבַהּ לֵ֑ב יָ֥ד לְ֝/יָ֗ד לֹ֣א יִנָּקֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/005.yaml
  text: Everyone who is proud in heart is an abomination to Yahweh; hand to hand[a], he will certainly not go unpunished.
translation:
  language: hi
  text: हर वह व्यक्ति जो मन से घमंडी है, याहवे की दृष्टि में घृणित है; हाथ-से-हाथ[a], वह निश्चय ही दण्ड से नहीं बचेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘हाथ से हाथ।’ यह मुहावरा ‘निश्चय जानो’ या ‘निश्चय ही’ के अर्थ में हो सकता है; सम्भवतः इसका अर्थ ‘चाहे वे हाथ मिला लें,’ अर्थात् गठबन्धन कर लें, भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द किसी ऐसी वस्तु या व्यक्ति को सूचित करता है जिससे तीव्र नैतिक और धार्मिक घृणा हो; ‘घृणित’ आधुनिक हिन्दी में इसका प्रबल भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כָּל גְּבַהּ לֵב
  choice: जिस किसी का मन घमंडी है
  rationale: शाब्दिक रूप से ‘हर ऊँचे मन वाला’; यह आन्तरिक अभिमान का मुहावरा है। चुना हुआ रूप वितरक अर्थ और मन की प्रवृत्ति दोनों बनाए रखता है।
- source_word: יָד לְיָד
  choice: हाथ पर हाथ
  rationale: कठिन इब्रानी मुहावरे की दृश्य भाषा मुख्य पाठ में रखी गई है, जबकि उसके सम्भावित आश्वासनात्मक अथवा गठबन्धन-संबंधी अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לֹא יִנָּקֶה
  choice: वह निश्चय ही दण्ड से नहीं बचेगा
  rationale: निफ़अल रूप यहाँ निर्दोष ठहरने अथवा दण्ड से बच निकलने के निषेध को व्यक्त करता है; यह हिन्दी वाक्य न्यायिक अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ चुना गया।
- issue: יָד לְיָד की व्याख्या
  choice: मुख्य पाठ में ‘हाथ पर हाथ’ रखकर अर्थ-विकल्प पादटिप्पणी में देना
  alternative: ‘निश्चय जानो’ अथवा ‘चाहे वे हाथ मिला लें’
  rationale: मुहावरे का अर्थ वास्तव में अनिश्चित है। किसी एक व्याख्या को चुपचाप निर्णायक बनाने के बजाय मूल बिंब और दोनों प्रमुख सम्भावनाएँ सुरक्षित रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मन घमंडी’ आन्तरिक अहंकार को व्यक्त करता है; कठिन इब्रानी मुहावरा जानबूझकर पादटिप्पणी सहित संरक्षित है।
