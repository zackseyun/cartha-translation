  text: כֹּ֤ל פָּעַ֣ל יְ֭הוָה לַֽ/מַּעֲנֵ֑/הוּ וְ/גַם רָ֝שָׁ֗ע לְ/י֣וֹם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/004.yaml
  text: Yahweh has made everything for its purpose[b][a], even the wicked for the day of disaster.
translation:
  language: hi
  text: याहवे ने हर वस्तु को उसके उद्देश्य के लिए बनाया है[a]—यहाँ तक कि दुष्ट को भी विपत्ति के दिन के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अपने लिए।” इब्रानी पदबंध को इस अर्थ में भी समझा जा सकता है: “याहवे ने सब कुछ अपने लिए बनाया है।”'
    reason: lexical_alternative
  - marker: b
    text: या, “संकट के दिन के लिए” अथवा “बुराई के दिन के लिए।” यहाँ “बुराई” का अर्थ नैतिक दुष्टता नहीं, बल्कि विपत्ति या विनाश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: सब कुछ
  rationale: यह व्यापक अर्थ ‘सभी वस्तुएँ/सब कुछ’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פָּעַל
  choice: बनाया है
  rationale: इस प्रसंग में क्रिया परमेश्वर के उद्देश्यपूर्ण कार्य को बताती है; ‘बनाया है’ हिन्दी में सहज है और मूल के ‘करना/बनाना’ अर्थ को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत इब्रानी नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לַמַּעֲנֵהוּ
  choice: उसके प्रयोजन के लिए
  rationale: यह कठिन पदबंध किसी वस्तु के उपयुक्त उद्देश्य या परिणति की ओर संकेत कर सकता है। ‘उसके प्रयोजन के लिए’ मूल सर्वनाम की अस्पष्टता को यथासंभव बनाए रखता है; ‘अपने लिए’ विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְגַם
  choice: यहाँ तक कि … भी
  rationale: यह अभिव्यक्ति सामान्य कथन में दुष्ट को जोर देकर सम्मिलित करती है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में किसी प्रतिनिधि दुष्ट व्यक्ति के लिए प्रयुक्त है।
- source_word: לְיוֹם רָעָה
  choice: विपत्ति के दिन के लिए
  rationale: यहाँ רָעָה का अर्थ नैतिक बुराई नहीं, बल्कि विपत्ति, विनाश या न्याय का दिन है।
theological_decisions:
- issue: क्या यह कथन परमेश्वर को नैतिक बुराई का रचयिता ठहराता है
  choice: पद को इस प्रकार रखा गया है कि याहवे ने सब कुछ उसके प्रयोजन की ओर बनाया है और दुष्ट भी विपत्ति के दिन से बचा नहीं है।
  alternative: याहवे ने सब कुछ अपने लिए बनाया है, यहाँ तक कि दुष्ट को भी बुराई के दिन के लिए।
  rationale: मूल पाठ परमेश्वर की प्रभुता और उद्देश्यपूर्ण व्यवस्था का दृढ़ कथन करता है, पर यह स्पष्ट रूप से नहीं कहता कि परमेश्वर नैतिक दुष्टता का रचयिता है। ‘विपत्ति’ रָעָה के प्रसंगगत अर्थ को व्यक्त करती है, जबकि वाक्य में उपस्थित कठिन धार्मिक तनाव को हटाती नहीं।
- issue: לַמַּעֲנֵהוּ में प्रत्यय का आशय
  choice: मुख्य पाठ में ‘उसके प्रयोजन के लिए’ रखा गया है।
  alternative: ‘अपने लिए’, अर्थात याहवे ने सब कुछ अपने लिए बनाया।
  rationale: इब्रानी पदबंध का अर्थ ‘उसके उत्तर/उद्देश्य/उपयुक्त परिणाम के लिए’ हो सकता है, और प्रत्यय को याहवे की ओर संकेत करता हुआ भी समझा गया है। पाद-टिप्पणी वास्तविक वैकल्पिक पाठ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रयोजन’ पद की उद्देश्यपरकता को व्यक्त करता है, जबकि पाद-टिप्पणी उसके वास्तविक वैकल्पिक अर्थ को सुरक्षित रखती है। दीर्घ डैश दूसरे खंड के जोरदार विस्तार को स्पष्ट करता है।
