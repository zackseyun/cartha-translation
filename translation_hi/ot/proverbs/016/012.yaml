id: PRO.16.12
reference: Proverbs 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תּוֹעֲבַ֣ת מְ֭לָכִים עֲשׂ֣וֹת רֶ֑שַׁע כִּ֥י בִ֝/צְדָקָ֗ה יִכּ֥וֹן כִּסֵּֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/012.yaml
  text: It is an abomination for kings to do wickedness[a], for a throne is established by righteousness.
translation:
  language: hi
  text: 'राजाओं का दुष्टता करना घृणित है,

    क्योंकि सिंहासन धार्मिकता[a] से स्थिर होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: न्याय से।'
    reason: צדקה राजकीय संदर्भ में व्यापक ‘धार्मिकता’ के साथ विशेष रूप से ‘न्याय’ या न्यायपूर्ण शासन का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द किसी नैतिक रूप से अत्यन्त निंदनीय और अस्वीकार्य बात को व्यक्त करता है। ‘घृणित’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की प्रबल नैतिक गंभीरता बनाए रखता है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: बहुवचन का सीधा और स्वाभाविक हिन्दी रूप; नीतिवचन सामान्य रूप से राजकीय शासकों की बात करता है।
- source_word: עֲשׂוֹת רֶשַׁע
  choice: दुष्टता करना
  rationale: क्रिया और भाववाचक संज्ञा दोनों को निकटता से व्यक्त करता है तथा नैतिक बुराई का भाव बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरी पंक्ति पहली पंक्ति का कारण या आधार बताती है; ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִצְדָקָה
  choice: धार्मिकता से
  rationale: צדקה यहाँ सही और नैतिक आचरण को दर्शाता है, जिसमें न्यायपूर्ण शासन भी सम्मिलित है। ‘धार्मिकता’ व्यापक नैतिक अर्थ बनाए रखता है; राजकीय संदर्भ के कारण ‘न्याय’ को पादटिप्पणी में रखा गया है।
- source_word: יִכּוֹן
  choice: स्थिर होता है
  rationale: निफ़अल रूप स्थापित, दृढ़ या सुरक्षित किए जाने का भाव देता है। ‘स्थिर होता है’ सिंहासन की टिकाऊ दृढ़ता को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּסֵּא
  choice: सिंहासन
  rationale: एकवचन यहाँ सामान्य और प्रतीकात्मक है—राजसत्ता या शासन की स्थिरता। हिन्दी में बिना अनावश्यक निर्धारक के ‘सिंहासन’ स्वाभाविक है।
theological_decisions:
- issue: राजकीय-ज्ञानसाहित्य के संदर्भ में צדקה का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: मूल शब्द का अर्थ केवल न्यायिक निष्पक्षता तक सीमित नहीं, बल्कि व्यापक नैतिक सत्यनिष्ठा भी है। फिर भी राजकीय शासन के तत्काल संदर्भ में ‘न्याय’ एक वास्तविक अर्थ-संभावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תּוֹעֲבַת מְלָכִים और עֲשׂוֹת רֶשַׁע का संबंध
  choice: दुष्टता करना राजाओं के लिए घृणित है
  alternative: राजाओं का दुष्टता करना घृणित है
  rationale: चुनी हुई रचना मूल के संक्षिप्त कथन और नैतिक दायित्व दोनों को स्वाभाविक हिन्दी में रखती है, साथ ही इसे किसी विशेष राजा तक सीमित नहीं करती। वैकल्पिक रचना राजाओं को अधिक स्पष्ट रूप से दुष्टता करने वाले कर्ता के रूप में प्रस्तुत करती, पर हिन्दी में कुछ असहज लगती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दो पंक्तियों की नीतिवचनात्मक समानता सुरक्षित है। ‘घृणित’ नैतिक भार बनाए रखता है, जबकि ‘स्थिर होता है’ सामान्य पाठक के लिए ‘स्थापित किया जाता है’ से अधिक सहज है।
