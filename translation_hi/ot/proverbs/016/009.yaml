  yaml_path: translation/ot/proverbs/016/009.yaml
  text: A man's heart plans his way[a], but Yahweh establishes his steps.
translation:
  language: hi
  text: मनुष्य का मन अपने मार्ग की योजना बनाता है, परन्तु यहोवा उसके कदमों को स्थिर करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कदमों को दिशा देता है।” इब्रानी क्रिया का अर्थ “दृढ़ करना,” “स्थिर करना” या इस संदर्भ में “दिशा देना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: मन
  rationale: इब्रानी में यह शब्द विचार और संकल्प के केंद्र को दर्शाता है। हिन्दी में ‘मन’ इस संदर्भ में स्वाभाविक है और केवल भावना तक सीमित नहीं है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक प्रतिनिधि व्यक्ति के लिए प्रयुक्त सामान्य एकवचन है; ‘मनुष्य’ आधुनिक हिन्दी में व्यापक मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְחַשֵּׁב
  choice: योजना बनाता है
  rationale: पिएल रूप जानबूझकर सोचने और योजना बनाने का भाव देता है।
- source_word: דַּרְכּוֹ
  choice: अपने मार्ग
  rationale: ‘मार्ग’ जीवन की दिशा या आचरण के रूपक को बनाए रखता है और दूसरे खंड के ‘कदमों’ से मेल खाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: יָכִין
  choice: स्थिर करता है
  rationale: हिफ़ील रूप किसी चीज़ को दृढ़, स्थापित या सुनिश्चित करने का भाव देता है। ‘स्थिर करता है’ कारणवाचक अर्थ और मार्गदर्शन से व्यापक अर्थ-क्षेत्र दोनों को बनाए रखता है।
- source_word: צַעֲדוֹ
  choice: उसके कदमों
  rationale: एकवचन रूप सामूहिक अर्थ में चाल या कदमों को दर्शा सकता है; हिन्दी में बहुवचन ‘कदमों’ स्वाभाविक है और जीवन-यात्रा का ठोस रूपक बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय प्रभुता और मानवीय योजना
  choice: मनुष्य सचमुच योजना बनाता है, पर यहोवा उसके कदमों को स्थिर करता है
  alternative: यहोवा उसके कदमों को दिशा देता है / निर्धारित करता है
  rationale: अनुवाद मानवीय संकल्प और यहोवा की निर्णायक स्थापना—दोनों को साथ रखता है। ‘दिशा देता है’ अर्थ को केवल मार्गदर्शन तक संकीर्ण कर सकता है, जबकि ‘निर्धारित करता है’ अधिक कठोर नियतिवादी अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक रूप। ‘मन’ और ‘मार्ग’ इब्रानी बिंबों को स्वाभाविक हिन्दी में बनाए रखते हैं; ‘परन्तु’ दोनों खंडों के स्पष्ट विरोध को व्यक्त करता है।
