  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “खोद निकालता है” और “होंठों पर…आग” जैसे मूल काव्य-बिंबों को स्पष्ट किए बिना ही सुरक्षित रखा गया है, ताकि कहावत की संक्षिप्तता और अर्थगत तनाव बने रहें।
