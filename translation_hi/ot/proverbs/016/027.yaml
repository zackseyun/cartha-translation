base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/027.yaml
  text: A worthless man digs up evil[b][a], and on his lips is a scorching fire.
translation:
  language: hi
  text: अधम मनुष्य बुराई खोद निकालता है,[a] और उसके होंठों पर मानो झुलसा देने वाली आग है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हानि खोद निकालता है”; इब्रानी शब्द नैतिक बुराई या उससे उत्पन्न विनाशकारी हानि—दोनों पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ בְּלִיַּעַל
  choice: अधम मनुष्य
  rationale: בְּלִיַּעַל यहाँ किसी व्यक्तिवाचक नाम के रूप में नहीं, बल्कि नैतिक निकृष्टता के चरित्र-वर्णन के रूप में प्रयुक्त है। “अधम मनुष्य” इस अर्थ को संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּרֶה
  choice: खोद निकालता है
  rationale: כרה का मूल बिंब “खोदना” है। “खोद निकालता है” उस रूपक को बनाए रखते हुए बुराई को खोजकर या उत्पन्न करके सामने लाने का भाव देता है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द नैतिक बुराई और उससे होने वाली हानि या विपत्ति—दोनों को सूचित कर सकता है। मुख्य पाठ में “बुराई” व्यापक नैतिक अर्थ को रखता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: שפתיו
  choice: उसके होंठों पर
  rationale: मूल पाठ के शारीरिक और काव्यात्मक बिंब “उसके होंठ” को बनाए रखा गया है; यह उसकी विनाशकारी वाणी की ओर संकेत करता है।
- source_word: כְאֵשׁ צָרָבֶת
  choice: मानो झुलसा देने वाली आग
  rationale: כְ तुलना को व्यक्त करता है और दुर्लभ צָרָבֶת जलाने या झुलसाने वाली तीव्रता बताता है। “मानो झुलसा देने वाली आग” उपमा और विनाशकारी प्रभाव दोनों सुरक्षित रखता है।
