  text: ט֤וֹב אֶ֣רֶךְ אַ֭פַּיִם מִ/גִּבּ֑וֹר וּ/מֹשֵׁ֥ל בְּ֝/רוּח֗/וֹ מִ/לֹּכֵ֥ד עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/032.yaml
  text: Better is one who is slow to anger than a mighty man[b][a], and one who rules his spirit than one who captures a city.
translation:
  language: hi
  text: 'क्रोध करने में धीमा व्यक्ति वीर से उत्तम है,

    और जो अपने मन को वश में रखता है, वह नगर जीतनेवाले से।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: उत्तम है
  rationale: हिब्रू ज्ञान-साहित्य में यह शब्द מִן के साथ तुलना व्यक्त करता है; हिंदी में ‘से उत्तम है’ स्वाभाविक और कहावत-जैसा है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीमा व्यक्ति
  rationale: यह हिब्रू मुहावरा शाब्दिक रूप से ‘नथुनों में लंबा’ है और क्रोध में देर करने का भाव देता है; चुना हुआ रूप अर्थ को स्पष्ट रखते हुए मूल बिंब का आशय बचाता है।
- source_word: מִגִּבּוֹר
  choice: वीर से
  rationale: גִּבּוֹר बलवान अथवा युद्ध में पराक्रमी व्यक्ति को दर्शा सकता है। ‘वीर’ संक्षिप्त, गरिमापूर्ण है और सैन्य संदर्भ को अत्यधिक सीमित किए बिना व्यक्त करता है।
- source_word: וּמֹשֵׁל
  choice: और ... शासन करनेवाला
  rationale: कृदंत निरंतर चारित्रिक गुण बताता है। ‘शासन करनेवाला’ बाहरी विजय और भीतरी नियंत्रण के बीच समानांतरता बनाए रखता है।
- source_word: בְּרוּחוֹ
  choice: अपनी आत्मा पर
  rationale: רוּחַ यहाँ व्यक्ति की भीतरी प्रवृत्ति, आवेग या मनोभाव को सूचित करता है। ‘आत्मा’ मूल शब्द की व्यापकता बचाता है, जबकि ‘क्रोध’ या ‘अपने आप’ अर्थ को अधिक संकीर्ण अथवा व्याख्यात्मक बना देते।
- source_word: מִלֹּכֵד עִיר
  choice: नगर जीतनेवाले से
  rationale: לכד सैन्य संदर्भ में नगर पर अधिकार करने या उसे जीतने को बताता है। यह हिंदी अभिव्यक्ति बाहरी विजय के सजीव विरोध को सुरक्षित रखती है।
theological_decisions:
- issue: ज्ञान-साहित्य के संदर्भ में רוּחַ का मानवशास्त्रीय अर्थ
  choice: ‘अपनी आत्मा’—व्यक्ति की भीतरी प्रवृत्तियों और आवेगों की ओर संकेत
  alternative: ‘अपने आप पर’ या ‘अपने क्रोध पर’
  rationale: कहावत भीतरी जीवन पर अधिकार की तुलना सैन्य विजय से करती है। ‘आत्मा’ हिब्रू पद की अर्थ-व्यापकता और संभावित तनाव बनाए रखता है; ‘अपने आप’ व्यापक व्याख्या और ‘क्रोध’ संकीर्ण व्याख्या होगी।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। दोनों पंक्तियों की तुलनात्मक समानांतरता सुरक्षित रखी गई है। ‘क्रोध करने में धीमा’ साधारण पाठक के लिए स्पष्ट है, और ‘आत्मा पर शासन’ मूल की भीतरी स्वामित्व-वाली छवि को बनाए रखता है।
