  yaml_path: translation/ot/proverbs/016/026.yaml
  text: The appetite of a laborer labors for him[c][b][a], for his mouth presses him on.
translation:
  language: hi
  text: मेहनत करनेवाले की भूख उसे मेहनत करने को मजबूर करती है[a], क्योंकि उसका मुँह उस पर दबाव डालता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेहनत करनेवाले का प्राण/अभिलाषा उसके लिए मेहनत करता है।” हिब्रू נֶפֶשׁ का अर्थ “प्राण,” “जीवन,” “अभिलाषा” या “भूख” हो सकता है; यहाँ “उसका मुँह” के समानांतर होने के कारण “भूख” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका मुँह उसे उकसाता,” “हाँकता” अथवा “बाध्य करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: भूख
  rationale: נֶפֶשׁ के अर्थों में प्राण, जीवन, इच्छा और भूख शामिल हैं। यहाँ समानांतर पद में ‘उसका मुँह’ होने के कारण ‘भूख’ प्रसंग के सबसे अनुकूल है।
- source_word: עָמֵל
  choice: मेहनत करनेवाला
  rationale: यह शब्द परिश्रम करनेवाले व्यक्ति को दर्शाता है। यह सहज आधुनिक हिन्दी है और अगले सजातीय क्रिया-रूप के साथ संबंध बनाए रखता है।
- source_word: עָמְלָה
  choice: मेहनत करवाती है
  rationale: 'हिब्रू में कर्ता स्त्रीलिंग נֶפֶשׁ है और क्रिया उसी से मेल खाती है: मेहनत करनेवाले की भूख उसके लिए मेहनत करती है। हिन्दी में ‘उससे मेहनत करवाती है’ इस भाव को स्वाभाविक रूप से व्यक्त करता और मूल की शब्द-क्रीड़ा को आंशिक रूप से बनाए रखता है।'
- source_word: לּוֹ
  choice: उससे
  rationale: मूलतः इसका अर्थ ‘उसके लिए’ है। स्वाभाविक हिन्दी वाक्य-विन्यास में कारणकारी अभिव्यक्ति ‘उससे मेहनत करवाती है’ उसी आशय को देती है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है।
- source_word: אָכַף עָלָיו
  choice: उसे काम में लगाए रखता है
  rationale: क्रिया दबाव डालने, बाध्य करने या आगे बढ़ाने का भाव रखती है। प्रसंग में मुँह अर्थात भोजन की आवश्यकता व्यक्ति को निरंतर काम करने को प्रेरित करती है।
- source_word: פִּיהוּ
  choice: उसका मुँह
  rationale: हिब्रू का ठोस और मानवीकृत बिंब ज्यों का त्यों रखा गया है; इसे व्याख्यात्मक रूप से ‘भूख’ से बदलना उचित नहीं।
