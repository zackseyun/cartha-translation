id: PRO.16.31
reference: Proverbs 16:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲטֶ֣רֶת תִּפְאֶ֣רֶת שֵׂיבָ֑ה בְּ/דֶ֥רֶךְ צְ֝דָקָ֗ה תִּמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/031.yaml
  text: Gray hair is a crown of glory[b][a]; it is found in the way of righteousness.
translation:
  language: hi
  text: पके बाल गौरव का मुकुट हैं[b]; वे धार्मिकता के मार्ग पर पाए जाते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के जीवन-मार्ग में।” इब्रानी मुहावरे में ‘मार्ग’ धार्मिकता से पहचाने जाने वाले जीवन-क्रम को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पके बाल उस समय आदर के योग्य हैं जब वे धार्मिक जीवन के साथ जुड़े हों। यह नीतिवचन एक सामान्य ज्ञान-सिद्धांत व्यक्त करता है, यह निरपवाद प्रतिज्ञा नहीं कि हर धर्मी व्यक्ति अवश्य दीर्घायु होगा।
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: यह शब्द मुकुट या सिर को घेरने वाले अलंकार को दर्शाता है। ‘मुकुट’ सम्मान के रूपक को स्वाभाविक और स्पष्ट रूप से बनाए रखता है।
- source_word: תִּפְאֶרֶת
  choice: गौरव
  rationale: इस शब्द का अर्थ शोभा, वैभव या महिमा हो सकता है। यहाँ ‘गौरव’ वृद्धावस्था से जुड़े आदर और प्रतिष्ठा के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֵׂיבָה
  choice: पके बाल
  rationale: यह संज्ञा सीधे सफेद या धूसर बालों और विस्तार से वृद्धावस्था को दर्शाती है। ‘पके बाल’ मूल के सजीव चित्र को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: בְּדֶרֶךְ
  choice: मार्ग पर
  rationale: इब्रानी में ‘मार्ग’ जीवन के आचरण या जीवन-क्रम का प्रचलित रूपक है। हिन्दी में ‘मार्ग पर’ इस रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यहाँ शब्द न्यायपूर्ण और नैतिक रूप से सही जीवन को दर्शाता है। ‘धार्मिकता’ नीतिवचन के नैतिक आशय और स्रोत की व्यापक अर्थ-सीमा को सुरक्षित रखती है।
- source_word: תִּמָּצֵא
  choice: पाए जाते हैं
  rationale: निफ़अल रूप का मूल भाव ‘पाया जाना’ है। यह अनुवाद इस अस्पष्टता को बनाए रखता है कि पके बाल धार्मिक जीवन-मार्ग में मिलते हैं अथवा उससे विशेष रूप से जुड़े होते हैं।
theological_decisions:
- issue: दूसरे अर्धवाक्य का आशय
  choice: यह एक सामान्य ज्ञान-सिद्धांत बताता है कि धार्मिक जीवन के साथ जुड़े पके बाल आदरणीय अलंकार हैं; यह हर वृद्ध व्यक्ति के धर्मी होने या हर धर्मी व्यक्ति के दीर्घायु होने का निरपवाद दावा नहीं है।
  alternative: इसे या तो वृद्धावस्था के अपने-आप में सम्माननीय होने का सीधा कथन, या धार्मिकता से दीर्घायु की निश्चित गारंटी मानना।
  rationale: इब्रानी ज्ञान-साहित्य सामान्य जीवन-सत्यों को प्रायः लोकोक्तिपरक रूप में व्यक्त करता है, निरपवाद प्रतिज्ञाओं के रूप में नहीं। ‘धार्मिकता के मार्ग पर पाए जाते हैं’ इस तनाव को बिना यांत्रिक गारंटी बनाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। ‘पके बाल’ सामान्य पाठक के लिए स्वाभाविक है; ‘गौरव का मुकुट’ मूल रूपक को स्पष्ट रूप से बनाए रखता है।
