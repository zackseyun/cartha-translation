  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֲמַת מֶ֥לֶךְ מַלְאֲכֵי מָ֑וֶת וְ/אִ֖ישׁ חָכָ֣ם יְכַפְּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/014.yaml
  text: The wrath of a king is messengers of death[b][a], but a wise man will appease it.
translation:
  language: hi
  text: 'राजा का क्रोध मृत्यु के दूतों के समान है[a],

    परन्तु बुद्धिमान मनुष्य उसे शांत कर देता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मृत्यु के दूत’। ‘दूत’ के लिए प्रयुक्त शब्द का अर्थ ‘स्वर्गदूत’ भी हो सकता है, पर यहाँ सम्भवतः राजा के भेजे हुए प्रतिनिधि अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘शांत कर देता है’ के लिए प्रयुक्त इब्रानी क्रिया उसी धातु से है जिसका अनुवाद अनेक संदर्भों में ‘प्रायश्चित करना’ होता है; यहाँ इसका अर्थ राजा के क्रोध को शांत करना या टाल देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: क्रोध
  rationale: यह शब्द प्रचण्ड, जलते हुए रोष का बोध कराता है। आधुनिक हिन्दी में ‘क्रोध’ स्वाभाविक और गरिमापूर्ण है तथा मृत्यु के समानांतर उपस्थित गंभीर खतरे को व्यक्त करता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: मूल शब्द सीधे एक राजा या सम्राट को दर्शाता है; ‘राजा’ नीतिवचन के ठोस राजकीय परिवेश को बनाए रखता है।
- source_word: מַלְאֲכֵי מָוֶת
  choice: मृत्यु के दूतों के समान
  rationale: शाब्दिक पदबंध ‘मृत्यु के दूत’ है। यहाँ बहुवचन विधेय को हिन्दी में बिना भ्रामक व्याकरणिक असंगति के रूपकात्मक रूप से व्यक्त करने के लिए ‘के समान’ जोड़ा गया है; ‘दूत’ राजकीय आदेश लागू करने वाले प्रतिनिधियों के लिए स्वाभाविक है।
- source_word: וְאִישׁ חָכָם
  choice: परन्तु बुद्धिमान मनुष्य
  rationale: वाव यहाँ दोनों पंक्तियों का विरोध दर्शाता है, इसलिए ‘परन्तु’ उचित है। ‘मनुष्य’ हिब्रू के पुल्लिंग एकवचन प्रतिनिधि पात्र को रखते हुए हिन्दी में सामान्य मानवीय प्रयोग भी देता है।
- source_word: יְכַפְּרֶנָּה
  choice: उसे शांत कर देता है
  rationale: पिएल रूप का स्त्रीलिंग कर्म-प्रत्यय पहले आए ‘क्रोध’ की ओर संकेत करता है। इस गैर-अनुष्ठानिक राजकीय संदर्भ में अर्थ क्रोध को शांत या दूर करना है, न कि बलिदानी प्रायश्चित करना। सामान्य वर्तमान हिन्दी में नीतिवचन की सार्वकालिक प्रकृति व्यक्त होती है।
theological_decisions:
- issue: כפר को अनुष्ठानिक ‘प्रायश्चित करना’ मानें या गैर-अनुष्ठानिक रूप से क्रोध शांत करना
  choice: 'गैर-अनुष्ठानिक: ‘उसे शांत कर देता है’'
  alternative: ‘उसके लिए प्रायश्चित करता है’ अथवा ‘उसे तुष्ट करता है’
  rationale: तात्कालिक संदर्भ राजा के क्रोध का है, मंदिर या बलिदान का नहीं। ‘शांत कर देता है’ क्रोध को टालने का संदर्भगत अर्थ देता है, जबकि इसी धातु के प्रायश्चित-संबंधी प्रयोग की जानकारी पादटिप्पणी में सुरक्षित है।
- issue: מַלְאָךְ को मानवीय दूत मानें या स्वर्गदूत
  choice: राजकीय संदर्भ में ‘दूत’, सम्भवतः राजा के भेजे हुए प्रतिनिधि
  alternative: ‘स्वर्गदूत’
  rationale: शब्द दोनों अर्थ रख सकता है, पर राजदरबार और राजा के क्रोध के संदर्भ में आदेश लागू करने वाले मानवीय प्रतिनिधि अधिक संभावित हैं। अनावश्यक अलौकिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण नीतिवचनात्मक शैली। ‘परन्तु’ औपचारिक विरोध को स्पष्ट करता है। पहली पंक्ति में ‘के समान’ हिन्दी की स्वाभाविक अभिव्यक्ति के लिए है; दूसरी पंक्ति में सामान्य वर्तमान काल सार्वकालिक ज्ञान-वचन के अनुकूल है।
