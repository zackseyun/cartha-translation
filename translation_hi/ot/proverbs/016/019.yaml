  text: Better to be lowly in spirit with the poor than to divide plunder with the proud[a].
translation:
  language: hi
  text: 'मन से विनम्र होकर दीनों[a] के साथ रहना,

    घमंडियों के साथ लूट का माल बाँटने से अच्छा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दीनों’ का अनुवाद ‘गरीबों,’ ‘पीड़ितों’ या ‘नम्र लोगों’ के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह नीतिवचन के तुलनात्मक मूल्यांकन को व्यक्त करता है; दूसरे पदांश में ‘से’ के साथ स्वाभाविक हिन्दी तुलना बनती है।
- source_word: שְׁפַל רוּחַ
  choice: मन में नम्र रहना
  rationale: यह आंतरिक दीनता या नम्रता की प्रवृत्ति को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल भावना या मनोदशा तक सीमित किए।
- source_word: אֶת עניים
  choice: दीनों के साथ
  rationale: אֶת यहाँ संगति के अर्थ में है। עניים में गरीब, पीड़ित या दीन-नम्र होने की अर्थ-छायाएँ संभव हैं; ‘दीनों’ से इस बहुअर्थकता का कुछ अंश सुरक्षित रहता है।
- source_word: מֵחַלֵּק
  choice: बाँटने से
  rationale: מִן तुलनात्मक ‘से’ को दर्शाता है, और ‘बाँटने’ से लूट में भागीदारी का भाव स्वाभाविक हिन्दी में आता है।
- source_word: שָׁלָל
  choice: लूट का माल
  rationale: यह युद्ध या हिंसक अधिग्रहण से प्राप्त वस्तुओं को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: אֶת גֵּאִים
  choice: घमंडियों के साथ
  rationale: אֶת संगति दर्शाता है और גֵּאִים नम्रता के विपरीत घमंडी या अभिमानी लोगों को सूचित करता है।
