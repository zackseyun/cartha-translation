base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/025.yaml
  text: There is a way that seems right before a man, but its end is the ways of death.
translation:
  language: hi
  text: 'एक मार्ग मनुष्य को सही दिखाई देता है,

    पर उसका अंत मृत्यु के मार्ग हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: नीतिवचन के नैतिक और जीवन-दिशा संबंधी रूपक को स्वाभाविक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יָשָׁר לִפְנֵי אִישׁ
  choice: मनुष्य को सीधा दिखाई देता है
  rationale: शाब्दिक अर्थ ‘मनुष्य के सामने सीधा’ है; हिन्दी में ‘सीधा दिखाई देता है’ वस्तुनिष्ठ सत्य के बजाय मनुष्य की धारणा का भाव स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֲרִיתָהּ
  choice: उसका अन्त
  rationale: मार्ग के अंतिम परिणाम या परिणति को संक्षेप और निकटता से व्यक्त करता है।
- source_word: דַּרְכֵי מָוֶת
  choice: मृत्यु के मार्ग
  rationale: इब्रानी के असामान्य बहुवचन ‘मार्गों’ को समतल किए बिना उसका काव्यात्मक तनाव बनाए रखता है।
theological_decisions:
- issue: मानवीय आकलन और वास्तविक परिणाम के बीच विरोध
  choice: ‘सीधा दिखाई देता है’ और ‘पर’ के द्वारा विरोध बनाए रखा
  alternative: ‘मनुष्य की दृष्टि में सही है’
  rationale: चुना हुआ पाठ मूल के दृश्य/स्थानिक मुहावरे की छाया रखते हुए यह स्पष्ट करता है कि मार्ग केवल मनुष्य को सीधा प्रतीत होता है।
- issue: דַּרְכֵי का बहुवचन
  choice: ‘मृत्यु के मार्ग’
  alternative: ‘मृत्यु का मार्ग’ या ‘मृत्यु है’
  rationale: मूल के एकवचन आरम्भ और बहुवचन परिणाम के बीच जानबूझकर उपस्थित तनाव को सुरक्षित रखा गया है; इसका कोई विशिष्ट doctrinal अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘मार्ग’, ‘सीधा’ और ‘अन्त’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य हैं और ज्ञान-साहित्य के स्वर के अनुकूल हैं।
