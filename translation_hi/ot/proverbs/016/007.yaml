language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בִּ/רְצ֣וֹת יְ֭הוָה דַּרְכֵי אִ֑ישׁ גַּם א֝וֹיְבָ֗י/ו יַשְׁלִ֥ם אִתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/007.yaml
  text: When a man's ways please Yahweh[a], he makes even his enemies be at peace with him.
translation:
  language: hi
  text: जब किसी मनुष्य[a] के मार्ग यहोवा को भाते हैं, तब वह उसके शत्रुओं को भी उससे मेल कराता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य’ का प्रयोग सामान्य अर्थ में है; अर्थात कोई भी व्यक्ति।
    reason: प्रतिनिधिक पुल्लिंग के समावेशी आशय को स्पष्ट करना।
lexical_decisions:
- source_word: בִּרְצוֹת
  choice: जब ... प्रसन्न करते हैं
  rationale: בְּ के साथ infinitive construct यहाँ समय अथवा परिस्थिति बताता है। हिन्दी में ‘जब ... प्रसन्न करते हैं’ स्वाभाविक है और मूल वाक्य की रचना को भी निकटता से दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דַּרְכֵי אִישׁ
  choice: किसी मनुष्य के मार्ग
  rationale: דֶּרֶךְ यहाँ आचरण या जीवन-क्रम का रूपक है। אִישׁ अनिश्चित और प्रतिनिधिक एकवचन है; ‘किसी मनुष्य’ आधुनिक हिन्दी में उसके सामान्य मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גַּם
  choice: भी
  rationale: यहाँ גַּם आश्चर्यजनक विस्तार पर बल देता है—प्रभाव शत्रुओं तक भी पहुँचता है।
- source_word: אֹיְבָיו
  choice: उसके शत्रुओं
  rationale: यह बहुवचन संबंधवाचक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: יַשְׁלִם אִתּוֹ
  choice: उससे मेल कराता है
  rationale: שלם का हिफ़ील रूप इस संदर्भ में किसी को दूसरे के साथ शान्ति अथवा मेल में लाने का कारक भाव रखता है। ‘मेल कराता है’ उस कारकता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग
  choice: किसी मनुष्य
  alternative: किसी व्यक्ति
  rationale: मूल में पुल्लिंग एकवचन है, पर उसका आशय सामान्य है। ‘मनुष्य’ रूप को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि कथन केवल पुरुषों तक सीमित नहीं है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में ईश्वर का व्यक्तिगत नाम है। उसे उपाधि में बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण से रखा गया है।
- issue: יַשְׁלִם की कारकता
  choice: मेल कराता है
  alternative: मेल से रहने देता है
  rationale: हिफ़ील रूप सक्रिय कारकता दर्शाता है; ‘रहने देता है’ उस बल को कम कर सकता है। फिर भी अनुवाद यह निर्धारित नहीं करता कि मेल आन्तरिक मित्रता है या केवल शान्तिपूर्ण संबंध।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कहावत-सुलभ रखी गई है। ‘मार्ग’ जीवन और आचरण के रूपक को सुरक्षित रखता है; ‘मेल कराता है’ ईश्वरीय कारकता को स्पष्ट करता है।
