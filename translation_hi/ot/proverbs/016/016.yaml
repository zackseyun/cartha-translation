  text: קְֽנֹה חָכְמָ֗ה מַה טּ֥וֹב מֵ/חָר֑וּץ וּ/קְנ֥וֹת בִּ֝ינָ֗ה נִבְחָ֥ר מִ/כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/016.yaml
  text: To acquire wisdom—how much better than gold! And to acquire understanding is to be chosen over silver.
translation:
  language: hi
  text: बुद्धि प्राप्त करो—यह सोने से कितना बेहतर है! और समझ प्राप्त करना चाँदी की अपेक्षा अधिक वांछनीय है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְנֹה / וּקְנוֹת
  choice: प्राप्त करना
  rationale: दोनों रूपों में ज्ञान अथवा समझ को अर्जित करने का भाव है; समान हिंदी अभिव्यक्ति से पद की समानांतर रचना बनी रहती है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह जीवन को कुशलता और नैतिक विवेक से जीने वाली बुद्धि का सामान्य और प्रतिष्ठित हिंदी पद है।
- source_word: חָרוּץ
  choice: सोना
  rationale: यहाँ शब्द बहुमूल्य सोने को सूचित करता है; सामान्य पाठक के लिए सीधा और स्वाभाविक अनुवाद।
- source_word: בִּינָה
  choice: समझ
  rationale: यह भेद पहचानने और बात का अर्थ ग्रहण करने की क्षमता को व्यक्त करता है तथा חָכְמָה से संबंधित किंतु अलग समानांतर पद बना रहता है।
- source_word: נִבְחָר
  choice: अधिक चुनने योग्य
  rationale: निफ़अल रूप वरीयता या अधिक वांछनीय होने का भाव देता है; यह अनुवाद निष्क्रिय अर्थ और तुलना दोनों को सुरक्षित रखता है।
- source_word: כָּסֶף
  choice: चाँदी
  rationale: धातु के शाब्दिक अर्थ को रखा गया है, जो पहले खंड के सोने के साथ काव्यात्मक समानांतरता बनाता है।
theological_decisions:
- issue: बुद्धि और समझ की भौतिक धन से श्रेष्ठता
  choice: दोनों को सोने और चाँदी से अधिक मूल्यवान बताया गया है
  alternative: इसे केवल धन कमाने की व्यावहारिक सलाह के रूप में स्पष्ट करना
  rationale: मूल पाठ मूल्य की तुलना करता है, पर यह नहीं बताता कि श्रेष्ठता आध्यात्मिक, नैतिक या व्यावहारिक किस एक अर्थ में सीमित है; इसलिए व्यापक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला अनुवाद। विस्मयादिबोधक विन्यास מַה טּוֹב की जोरदार तुलना को व्यक्त करता है।
