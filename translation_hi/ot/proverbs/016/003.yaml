base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/003.yaml
  text: Commit your works to Yahweh[b][a], and your plans will be established.
translation:
  language: hi
  text: अपने काम याहवे को सौंप दो[a], और तुम्हारी योजनाएँ[b] स्थिर हो जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने काम याहवे पर लुढ़का दो”; यह मुहावरा उन्हें उसके भरोसे सौंपने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हारे विचार” अथवा “तुम्हारे अभिप्राय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּל
  choice: सौंप दो
  rationale: क्रिया का शाब्दिक बिंब किसी वस्तु को लुढ़काकर दूसरे पर रखने का है, पर याहवे के साथ यह मुहावरा अपने कामों को उसके भरोसे सौंपने का अर्थ देता है। ‘सौंप दो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֶל
  choice: को
  rationale: यह संबंध याहवे की ओर सौंपने को व्यक्त करता है। ‘याहवे को सौंप दो’ हिन्दी का स्वाभाविक मुहावरा है; ‘पर लुढ़का दो’ शाब्दिक बिंब तो रखता, पर मुख्य पाठ में अस्वाभाविक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מַעֲשֶׂיךָ
  choice: अपने काम
  rationale: यह शब्द कार्यों, कर्मों और उपक्रमों को व्यापक रूप से समेटता है। ‘काम’ सामान्य आधुनिक हिन्दी में इस व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיִכֹּנוּ
  choice: दृढ़ होंगी
  rationale: निफ़अल रूप स्थापित, स्थिर या दृढ़ होने का परिणाम व्यक्त करता है। ‘दृढ़ होंगी’ सफलता की अनिवार्य गारंटी जोड़े बिना उस स्थिरता को बनाए रखता है।
- source_word: מַחְשְׁבֹתֶיךָ
  choice: तुम्हारी योजनाएँ
  rationale: शब्द के अर्थ-क्षेत्र में विचार, अभिप्राय और योजनाएँ शामिल हैं। पूर्वार्ध के ‘काम’ के साथ ‘योजनाएँ’ इस नीतिवचन के व्यावहारिक संदर्भ में सबसे स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: मानवीय कार्य और ईश्वरीय दृढ़ीकरण का संबंध
  choice: अपने काम याहवे को सौंपने की आज्ञा और उसके फलस्वरूप योजनाओं के दृढ़ होने की बात को यथावत रखा गया है।
  alternative: इसे या तो हर योजना की सांसारिक सफलता की गारंटी, या मनुष्य की प्रतिक्रिया से निरपेक्ष पूर्ण नियतिवाद के कथन के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ ज्ञान-साहित्य की संक्षिप्त प्रतिज्ञा देता है, पर सफलता का स्वरूप या ईश्वरीय विधान की पूरी प्रणाली नहीं समझाता। अनुवाद इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन संबोधन को सामान्य हिन्दी के ‘तुम’ रूप में व्यक्त किया गया है। ‘दृढ़ होंगी’ को ‘सफल होंगी’ पर प्राथमिकता दी गई, ताकि मूल के स्थिर/स्थापित होने के भाव को रखा जाए और समृद्धि की अनिवार्य प्रतिज्ञा न जोड़ी जाए।
