source:
  edition: WLC
  text: בְּ/חֶ֣סֶד וֶ֭/אֱמֶת יְכֻפַּ֣ר עָוֺ֑ן וּ/בְ/יִרְאַ֥ת יְ֝הוָ֗ה ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/016/006.yaml
  text: By steadfast love and faithfulness iniquity is atoned for[b][a], and by the fear of Yahweh one turns away from evil.
translation:
  language: hi
  text: अटल प्रेम और विश्वासयोग्यता से अधर्म का प्रायश्चित होता है[a][b], और याहवे का भय मानने से मनुष्य बुराई से दूर रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अटल प्रेम और सच्चाई से अधर्म का प्रायश्चित होता है।” इब्रानी शब्द אֱמֶת का अर्थ “सच्चाई” और “विश्वासयोग्यता” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “प्रायश्चित होता है” का कर्ता नहीं बताया गया है; इसलिए यह वचन स्पष्ट नहीं करता कि बल परमेश्वर के कार्य पर है, इन सद्गुणों की भूमिका पर, या दोनों पर।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחֶסֶד
  choice: अटल प्रेम से
  rationale: חֶסֶד में स्थायी प्रेम, दया और निष्ठा का भाव है। ‘अटल प्रेम’ इसके संबंधपरक और टिकाऊ स्वरूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; בְּ को साधनसूचक ‘से’ कहा गया है।
- source_word: וֶאֱמֶת
  choice: और सच्चाई
  rationale: אֱמֶת का अर्थ ‘सच्चाई’ या ‘विश्वासयोग्यता’ हो सकता है। חֶסֶד के साथ यह निष्ठा का भाव भी देता है, पर ‘सच्चाई’ मूल की व्यापकता और हिन्दी में इस पारंपरिक युग्म की सहजता बनाए रखती है।
- source_word: יְכֻפַּר
  choice: प्रायश्चित होता है
  rationale: כפר के पुअल रूप का निष्क्रिय भाव सुरक्षित रखा गया है। हिन्दी में ‘का प्रायश्चित होता है’ कर्ता को अनकहा छोड़ता है और दोष-निवारण का धार्मिक अर्थ व्यक्त करता है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: עָוֺן नैतिक टेढ़ेपन, पाप या दोष को सूचित कर सकता है। ‘अधर्म’ नीतिवचन के नैतिक संदर्भ में स्वाभाविक है और इसे केवल मनोवैज्ञानिक ‘अपराध-बोध’ तक सीमित नहीं करता।
- source_word: וּבְיִרְאַת יְהוָה
  choice: और यहोवा का भय मानने से
  rationale: ज्ञान-साहित्य में יִרְאָה परमेश्वर के प्रति श्रद्धामय भय है। ‘भय मानने से’ आधुनिक हिन्दी में व्यवहारगत संबंध स्पष्ट करता है, जबकि भय की धारणा को केवल ‘श्रद्धा’ बनाकर हल्का नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: סוּר
  choice: मनुष्य ... दूर रहता है
  rationale: यह रूप नीतिवचन की सामान्य, व्यक्ति-निरपेक्ष बात व्यक्त करता है। ‘मनुष्य ... दूर रहता है’ हिन्दी में स्वाभाविक सामान्य कथन है और बुराई से हटने/बचने का भाव देता है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: इस संदर्भ में רָע का आशय नैतिक बुराई है, केवल हानि या विपत्ति नहीं।
theological_decisions:
- issue: क्या पहले खंड में क्षमा का कारण मानवीय पुण्य है या परमेश्वर का कार्य
  choice: निष्क्रिय वाक्य ‘अधर्म का प्रायश्चित होता है’ रखकर कर्ता को अनिर्दिष्ट छोड़ा गया है।
  alternative: इसे स्पष्ट रूप से परमेश्वर के अटल प्रेम का कार्य कहना, अथवा मनुष्य के प्रेम और सच्चाई को क्षमा अर्जित करने का साधन कहना।
  rationale: इब्रानी יְכֻפַּר कर्ता नहीं बताता। अनुवाद न तो मानवीय पुण्य का सिद्धांत जोड़ता है, न ही मूल में अनकहे दिव्य कर्ता को मुख्य पाठ में स्पष्ट करता है।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से प्रतिस्थापित नहीं किया गया; हिन्दी पाठकों के लिए परिचित लिप्यंतरण चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अटल प्रेम और सच्चाई’ संक्षिप्त काव्यात्मक समानांतरता बनाए रखता है; ‘प्रायश्चित होता है’ मूल के निष्क्रिय और धार्मिक अर्थ को सुरक्षित रखता है।
