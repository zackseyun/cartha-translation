source:
  edition: WLC
  text: יְקָ֣רָה הִ֭יא מ/פניים וְ/כָל חֲ֝פָצֶ֗י/ךָ לֹ֣א יִֽשְׁווּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/015.yaml
  text: She is more precious than jewels[a], and none of your delights can compare with her.
translation:
  language: hi
  text: वह रत्नों[a] से भी अधिक बहुमूल्य है, और तुम्हारी कोई भी मनचाही वस्तु उसकी बराबरी नहीं कर सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘माणिकों’ अथवा ‘मोतियों’; हिब्रू शब्द किसी बहुमूल्य रत्न को सूचित करता है, पर उसकी ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְקָרָה
  choice: अधिक बहुमूल्य
  rationale: विशेषण ऊँचे मूल्य या अनमोल होने का भाव देता है; מִן के साथ तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הִיא
  choice: वह
  rationale: स्त्रीलिंग एकवचन सर्वनाम संदर्भ में बुद्धि की ओर संकेत करता है; हिन्दी में ‘वह’ और स्त्रीलिंग विधेय मिलकर इस मानवीकरण को बनाए रखते हैं।
- source_word: מִפְּנִינִים
  choice: रत्नों
  rationale: פְּנִינִים किसी बहुमूल्य रत्न या रत्नों को सूचित करता है, पर उसकी ठीक पहचान अनिश्चित है; ‘रत्न’ इस अनिश्चितता को किसी एक प्रकार तक सीमित नहीं करता।
- source_word: וְכָל חֲפָצֶיךָ
  choice: और तुम्हारी कोई भी मनचाही वस्तु
  rationale: शाब्दिक ‘और तुम्हारी सब चाही हुई वस्तुएँ ... नहीं’ का नकारात्मक वितरण हिन्दी में ‘कोई भी ... नहीं’ से स्वाभाविक रूप से व्यक्त होता है। חֲפָצֶיךָ यहाँ इच्छित या प्रिय वस्तुओं को सूचित करता है।
- source_word: לֹא יִשְׁווּ בָּהּ
  choice: उसकी बराबरी नहीं कर सकती
  rationale: שוה का अर्थ बराबर होना या समकक्ष ठहरना है; בָּהּ तुलना के मानक, अर्थात बुद्धि, को चिह्नित करता है।
theological_decisions:
- issue: बुद्धि का स्त्रीलिंग मानवीकरण
  choice: ‘वह’ के साथ स्त्रीलिंग ‘बहुमूल्य’ और संदर्भगत स्त्री-व्यक्ति के रूप में प्रस्तुति
  alternative: नपुंसक भाव में ‘यह’ या अमूर्त ‘बुद्धि’ को दोहराना
  rationale: हिब्रू הִיא पूर्ववर्ती ‘बुद्धि’ का स्त्रीलिंग मानवीकरण बनाए रखता है; अनुवाद इसे किसी विशिष्ट धर्मवैज्ञानिक पहचान में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक वाक्य। ‘मनचाही वस्तु’ सामान्य पाठक के लिए स्पष्ट है और मूल के इच्छित/प्रिय पदार्थों के वस्तुगत अर्थ को सुरक्षित रखती है।
