  edition: WLC
  text: אֹ֣רֶךְ יָ֭מִים בִּֽ/ימִינָ֑/הּ בִּ֝/שְׂמֹאולָ֗/הּ עֹ֣שֶׁר וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/016.yaml
  text: Length of days is in her right hand[a]; in her left hand are riches and honor.
translation:
  language: hi
  text: 'उसके दाहिने हाथ में लंबी आयु[a] है;

    उसके बाएँ हाथ में धन और सम्मान हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “दिनों की लंबाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: लंबी आयु
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘दिनों की लंबाई’ है, पर आधुनिक हिन्दी में ‘लंबी आयु’ उसी अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בִּימִינָהּ
  choice: उसके दाहिने हाथ में
  rationale: בְּ को यहाँ ‘में’ कहना बुद्धि को मानवीकृत स्त्री के रूप में दिखाता है, जो इन वरदानों को अपने हाथों में रखती है; स्त्रीलिंग प्रत्यय के लिए ‘उसके’ रखा गया है।
- source_word: בִּשְׂמֹאולָהּ
  choice: उसके बाएँ हाथ में
  rationale: यह ‘दाहिने हाथ में’ के समानांतर है और इब्रानी काव्य की संतुलित रचना को बनाए रखता है।
- source_word: עֹשֶׁר
  choice: धन
  rationale: ‘धन’ आधुनिक हिन्दी में सहज है और यहाँ बुद्धि से जुड़े भौतिक साधन-संपन्नता के अर्थ को ठीक व्यक्त करता है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: नीतिवचन के इस संदर्भ में शब्द सामाजिक प्रतिष्ठा और आदर को सूचित करता है; इसलिए ‘महिमा’ की अपेक्षा ‘सम्मान’ अधिक उपयुक्त है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों का संदर्भ
  choice: ‘उसके’ से निकटवर्ती संदर्भ में मानवीकृत बुद्धि का संकेत
  alternative: प्रत्ययों को किसी देवी या स्त्रीलिंग दैवी सत्ता का संकेत मानना
  rationale: आस-पास के पदों में बुद्धि को एक स्त्री के रूप में काव्यात्मक ढंग से प्रस्तुत किया गया है। अनुवाद इस साहित्यिक मानवीकरण को बनाए रखता है, पर उसमें कोई अतिरिक्त धर्मवैज्ञानिक पहचान नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अर्ध-पंक्तियों की समानांतर काव्य-रचना बनाए रखने के लिए ‘दाहिने हाथ में’ और ‘बाएँ हाथ में’ का संतुलन सुरक्षित रखा गया है।
