  yaml_path: translation/ot/proverbs/003/031.yaml
  text: Do not envy a violent man[a], and do not choose any of his ways.
translation:
  language: hi
  text: हिंसक मनुष्य से ईर्ष्या मत करना[a], और उसके किसी भी मार्ग को मत चुनना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिंसक मनुष्य से जलन मत रखना।” इब्रानी क्रिया प्रसंग के अनुसार ईर्ष्या या जलन—दोनों भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: ईर्ष्या मत करना
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। קנא यहाँ किसी दूसरे की स्थिति या सामर्थ्य को चाहने वाली ईर्ष्या का भाव रखती है; आधुनिक हिन्दी में ‘ईर्ष्या मत करना’ स्वाभाविक और स्पष्ट है।
- source_word: בְּאִישׁ חָמָס
  choice: हिंसक मनुष्य से
  rationale: אִישׁ का अर्थ ‘मनुष्य/पुरुष’ है और חָמָס हिंसा, क्रूर अन्याय या उपद्रव का बोध कराता है। संयुक्त पद के लिए ‘हिंसक मनुष्य’ मूल रूपक और नैतिक आशय दोनों को बनाए रखता है। हिन्दी में ईर्ष्या के लक्ष्य के साथ ‘से’ स्वाभाविक है।
- source_word: וְאַל תִּבְחַר
  choice: और ... मत चुनना
  rationale: दूसरा निषेध पहले के समानांतर है। ‘और ... मत चुनना’ संयोजन तथा בחר के सामान्य अर्थ ‘चुनना’ को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּכָל דְּרָכָיו
  choice: उसके किसी भी मार्ग को
  rationale: शाब्दिक संरचना ‘उसके सब मार्गों में’ है, पर निषेध के अंतर्गत आशय यह है कि उसके आचरण का एक भी तरीका न अपनाया जाए। ‘किसी भी मार्ग को’ इस व्यापक निषेध को स्वाभाविक हिन्दी में व्यक्त करता है और ‘मार्ग’ के जीवन-आचरण संबंधी रूपक को बनाए रखता है।
