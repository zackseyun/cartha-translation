source:
  edition: WLC
  text: חֶ֥סֶד וֶ/אֱמֶ֗ת אַֽל יַעַ֫זְבֻ֥/ךָ קָשְׁרֵ֥/ם עַל גַּרְגְּרוֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/003.yaml
  text: Let steadfast love and faithfulness not forsake you[a]; bind them around your neck; write them on the tablet of your heart.
translation:
  language: hi
  text: अटल प्रेम और विश्वासयोग्यता तुम्हें न छोड़ें[a]; उन्हें अपने गले में बाँध लो; उन्हें अपने हृदय की पटिया पर लिख लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘करुणा और सत्य।’ इब्रानी शब्द-युग्म प्रायः निष्ठापूर्ण प्रेम और भरोसेमंदी का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: यह पद संबंधपरक निष्ठा से प्रकट होने वाले प्रेम और कृपा का भाव रखता है। ‘अटल प्रेम’ उसके प्रेमपूर्ण और स्थायी दोनों पहलुओं को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱמֶת
  choice: विश्वासयोग्यता
  rationale: חֶסֶד के साथ इस युग्म में इसका अर्थ केवल अमूर्त ‘सत्य’ नहीं, बल्कि भरोसेमंदी और निष्ठा भी है। ‘विश्वासयोग्यता’ उसी नैतिक-संबंधपरक भाव को सामने लाती है।
- source_word: אַל יַעַזְבֻךָ
  choice: तुम्हें न छोड़ें
  rationale: निषेधात्मक आग्रह को बनाए रखते हुए प्रेम और विश्वासयोग्यता को कर्ता के रूप में रहने दिया गया है; इस प्रकार मूल का मानवीकरण भी सुरक्षित रहता है।
- source_word: קָשְׁרֵם
  choice: उन्हें ... बाँध लो
  rationale: आज्ञार्थक क्रिया जानबूझकर थामे रखने की ठोस उपमा देती है। ‘बाँध लो’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: גַּרְגְּרוֹתֶיךָ
  choice: अपने गले में
  rationale: शब्द गले या कंठ के क्षेत्र को दर्शाता है। प्रसंग में किसी स्मरणीय आभूषण की तरह बाँधने का चित्र है, इसलिए ‘गले में’ सहज है।
- source_word: כָּתְבֵם
  choice: उन्हें ... लिख लो
  rationale: यह आंतरिक रूप से स्थायी बनाने की उपमा को आगे बढ़ाता है। ‘लिख लो’ आज्ञा की व्यक्तिगत और उद्देश्यपूर्ण शक्ति व्यक्त करता है।
- source_word: לוּחַ לִבֶּךָ
  choice: अपने हृदय की पटिया
  rationale: ‘पटिया’ लेखन की ठोस सतह का चित्र सुरक्षित रखती है और बात को केवल स्मरण रखने तक सीमित नहीं करती।
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת के संबंधपरक युग्म का अनुवाद
  choice: अटल प्रेम और विश्वासयोग्यता
  alternative: करुणा और सत्य
  rationale: चुना हुआ रूप प्रेमपूर्ण निष्ठा और भरोसेमंदी का संयुक्त भाव व्यक्त करता है, पर किसी संकीर्ण सांप्रदायिक व्याख्या को नहीं जोड़ता। ‘करुणा और सत्य’ शाब्दिक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आज्ञार्थक ज्ञान-साहित्यिक स्वर। मूल की समानांतर रचना, मानवीकरण और हृदय पर लिखने की ठोस उपमा सुरक्षित रखी गई है।
