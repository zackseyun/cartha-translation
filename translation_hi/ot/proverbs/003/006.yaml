  text: In all your ways acknowledge him[a], and he will make your paths straight.
translation:
  language: hi
  text: अपने सभी मार्गों में उसे पहचानो, और वह तुम्हारे पथों को सीधा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל
  choice: अपने सब ... में
  rationale: בְּ के साथ כָּל समग्रता व्यक्त करता है। हिंदी में ‘अपने सब मार्गों में’ स्वाभाविक है और जीवन के प्रत्येक क्षेत्र को समेटता है।
- source_word: דְּרָכֶיךָ
  choice: अपने सब मार्गों
  rationale: דֶּרֶךְ वास्तविक मार्ग और जीवन-व्यवहार, दोनों का बोध करा सकता है। ‘मार्गों’ इस व्यापक रूपक को बनाए रखता है और आगे के אֹרְחוֹתֶיךָ से हल्का शब्दगत भेद भी संभव करता है।
- source_word: דָעֵהוּ
  choice: उसे जानो
  rationale: יָדַע का आदेशात्मक रूप केवल बौद्धिक जानकारी नहीं, बल्कि संबंधपरक पहचान और जीवन में परमेश्वर का सक्रिय संज्ञान सूचित करता है। ‘उसे जानो’ हिब्रू के निकट रहते हुए इस गहराई को खुला रखता है; ‘उसे स्वीकार करो’ अर्थ को अधिक व्याख्यात्मक ढंग से सीमित कर सकता है।
- source_word: וְהוּא
  choice: और वह
  rationale: संयोजक וְ और स्पष्ट सर्वनाम הוּא को सीधे और स्वाभाविक हिंदी में ‘और वह’ कहा गया है।
- source_word: יְיַשֵּׁר
  choice: सीधे करेगा
  rationale: יָשַׁר के पिएल रूप का मूल चित्र सीधा या समतल बनाने का है। ‘सीधे करेगा’ इस चित्र को बनाए रखता है और केवल दिशा बताने तक अर्थ को सीमित नहीं करता।
- source_word: אֹרְחֹתֶיךָ
  choice: तुम्हारे पथ
  rationale: אֹרַח पथ या राह को दर्शाता है। ‘पथ’ रूपक को बनाए रखता है और पहले आए ‘मार्गों’ से हिब्रू के शब्दगत अंतर को भी दर्शाता है।
theological_decisions:
- issue: प्रतिज्ञा में परमेश्वर के मार्गदर्शन का स्वरूप
  choice: वह तुम्हारे पथ सीधे करेगा
  alternative: वह तुम्हारे पथों को दिशा देगा
  rationale: हिब्रू क्रिया का प्रमुख चित्र परमेश्वर द्वारा पथ को सीधा या सुगम करना है, न कि केवल दिशा-संबंधी सलाह देना। इसलिए मुख्य पाठ में मूल रूपक रखा गया है।
- issue: דָעֵהוּ में परमेश्वर के प्रति अपेक्षित प्रत्युत्तर
  choice: उसे जानो
  alternative: उसे स्वीकार करो / उसका ध्यान रखो
  rationale: ‘जानो’ हिब्रू की संबंधपरक और अनुभवात्मक व्यापकता को सुरक्षित रखता है। अन्य विकल्प अर्थ के किसी एक पक्ष को स्पष्ट करते हैं, पर मूल की अर्थ-समृद्धि को संकुचित कर सकते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, स्मरणीय और गरिमापूर्ण कहावतनुमा शैली। ‘मार्ग’ और ‘पथ’ के माध्यम से हिब्रू के दो निकटार्थक शब्दों का भेद रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि मुख्य पाठ हिब्रू के अधिक शाब्दिक चित्र को स्पष्ट रूप से व्यक्त करता है।
