  text: then your barns will be filled with abundance[a], and your vats will burst with new wine.
translation:
  language: hi
  text: 'तब तुम्हारे अन्न-भंडार लबालब भर जाएँगे,

    और तुम्हारे कुण्ड नए दाखमधु से छलक पड़ेंगे[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फूट निकलेंगे।” इब्रानी क्रिया का शाब्दिक भाव सीमा तोड़कर बाहर आने या फूट पड़ने का है; यहाँ यह अत्यधिक प्रचुरता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּלְאוּ
  choice: भर जाएँगे
  rationale: निफ़अल अपूर्ण रूप भावी परिणाम और कर्मवाच्य अर्थ देता है; ‘भर जाएँगे’ हिन्दी में स्वाभाविक रूप से दोनों को व्यक्त करता है।
- source_word: אֲסָמֶיךָ
  choice: तुम्हारे अन्न-भंडार
  rationale: यह शब्द अनाज या उपज रखने के भंडार को दर्शाता है। ‘अन्न-भंडार’ आधुनिक हिन्दी में स्पष्ट है और कृषि-संबंधी चित्र बनाए रखता है।
- source_word: שָׂבָע
  choice: लबालब
  rationale: संज्ञा भरपूरी, तृप्ति या प्रचुरता का भाव देती है। ‘लबालब भर जाएँगे’ शब्दशः पुनरुक्ति से बचते हुए अत्यधिक भरपूरी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִירוֹשׁ
  choice: नया दाखमधु
  rationale: यह सामान्य मदिरा से अधिक विशेष रूप से अंगूर की नई या ताज़ी उपज से बने दाखमधु को सूचित करता है; ‘नया दाखमधु’ उस भेद और कृषि-चित्र को सुरक्षित रखता है।
- source_word: יְקָבֶיךָ
  choice: तुम्हारे कुण्ड
  rationale: यह अंगूर दबाने और रस एकत्र करने से जुड़े कुण्ड या हौद को दर्शाता है। ‘कुण्ड’ पात्र की छवि को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
- source_word: יִפְרֹצוּ
  choice: छलक पड़ेंगे
  rationale: मूल क्रिया में फूट निकलने या सीमा तोड़कर बाहर आने का प्रबल भाव है। प्रसंग में ‘छलक पड़ेंगे’ विनाश का भ्रम उत्पन्न किए बिना प्रचुरता और बाहर उमड़ने की छवि देता है।
theological_decisions:
- issue: प्रतिज्ञात समृद्धि के चित्र का स्वरूप
  choice: अन्न-भंडारों और दाखमधु के कुण्डों की ठोस कृषि-संबंधी प्रचुरता को बनाए रखा गया है।
  alternative: इसे केवल सामान्य या आत्मिक आशीष के रूप में प्रस्तुत करना।
  rationale: इब्रानी पाठ मूर्त कृषि-चित्र देता है। अनुवाद यह पहले से निर्धारित नहीं करता कि यह कथन सार्वभौमिक, यांत्रिक प्रतिज्ञा है या केवल प्रतीकात्मक; वह मूल पाठ का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अन्न-भंडार’, ‘कुण्ड’ और ‘नया दाखमधु’ मूल कृषि-परिवेश को स्पष्ट रखते हैं; ‘लबालब’ और ‘छलक पड़ेंगे’ समानांतर पंक्तियों में प्रचुरता का सजीव भाव देते हैं।
