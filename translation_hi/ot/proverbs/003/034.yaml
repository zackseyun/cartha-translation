  text: אִם לַ/לֵּצִ֥ים הֽוּא יָלִ֑יץ ו/ל/עניים יִתֶּן חֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/034.yaml
  text: Surely he scoffs at scoffers[a], but gives favor[b] to the humble[c].
translation:
  language: hi
  text: निश्चय ही वह ठट्ठा करनेवालों का ठट्ठा करता है[a], पर दीन लोगों को अनुग्रह देता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उपहास करनेवालों का उपहास करता है।” इब्रानी में दोनों पदों में एक ही मूल शब्द दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “कृपा।”
    reason: lexical_alternative
  - marker: c
    text: “दीन लोगों” का अनुवाद “विनम्र लोगों,” “गरीबों” या “पीड़ितों” के रूप में भी किया जा सकता है। यह शब्द पद या परिस्थिति में दबे हुए लोगों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: निश्चय ही
  rationale: यहाँ אִם सामान्य शर्त नहीं, बल्कि कथन पर बल देने वाला निश्चयार्थक प्रयोग है; कोई शर्तफल-वाक्य नहीं आता।
- source_word: לַלֵּצִים ... יָלִיץ
  choice: ठट्ठा करनेवालों का ठट्ठा करता है
  rationale: एक ही इब्रानी मूल की पुनरावृत्ति और प्रतिफलात्मक समरूपता को हिन्दी में यथासंभव सुरक्षित रखता है।
- source_word: הוּא
  choice: वह
  rationale: इब्रानी में स्पष्ट सर्वनाम है; निकटवर्ती प्रसंग से इसका संकेत परमेश्वर की ओर समझा जाता है, इसलिए नाम जोड़ना उचित नहीं।
- source_word: וְלַעֲנִיִּים
  choice: पर दीन लोगों पर
  rationale: नीतिवचन के विरोधात्मक संदर्भ में विनम्र या नीची अवस्था वाले लोगों का भाव है; ‘दीन’ नैतिक और परिस्थितिजन्य दोनों आयामों को खुला रखता है।
- source_word: יִתֶּן חֵן
  choice: अनुग्रह करता है
  rationale: शाब्दिक रूप से ‘अनुग्रह देता है’; स्वाभाविक हिन्दी में ‘अनुग्रह करता है’ इस नीतिपरक, सामान्य क्रिया को स्पष्ट करता है।
theological_decisions:
- issue: הוּא सर्वनाम का संदर्भ
  choice: ‘वह’ रखा गया है; प्रसंग से परमेश्वर समझा जाता है।
  alternative: ‘यहोवा’ या ‘परमेश्वर’ स्पष्ट रूप से जोड़ना।
  rationale: मूल पद में ईश्वरीय नाम नहीं, सर्वनाम है; इसलिए अनावश्यक विस्तार से बचते हुए संदर्भगत अर्थ सुरक्षित रखा गया है।
- issue: עֲנִיִּים का अर्थ
  choice: दीन लोग
  alternative: विनम्र लोग; गरीब लोग; पीड़ित लोग
  rationale: यह शब्द नम्रता के साथ सामाजिक नीचता या दुःख की अवस्था भी व्यक्त कर सकता है; ‘दीन’ उस अर्थ-व्याप्ति को अपेक्षाकृत खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘ठट्ठा करनेवालों का ठट्ठा’ जानबूझकर रखी गई पुनरावृत्ति है, जो इब्रानी शब्दालंकार को दर्शाती है। मुख्य पाठ में [b] ‘अनुग्रह’ और [c] ‘दीन लोगों’ से क्रमशः जुड़े हैं।
