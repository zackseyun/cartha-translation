  text: for they will add to you length of days and years of life and peace[a].
translation:
  language: hi
  text: क्योंकि वे तेरे दिनों की लम्बाई, जीवन के वर्ष और शान्ति[a] बढ़ाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कल्याण’ अथवा ‘सम्पूर्ण कुशलता’; यहाँ ‘शान्ति’ के लिए प्रयुक्त इब्रानी शब्द शालोम केवल संघर्ष के अभाव से अधिक, जीवन की भलाई और पूर्णता को भी व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के उपदेश का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक और स्पष्ट है।
- source_word: אֹרֶךְ יָמִים
  choice: तेरी आयु के दिन
  rationale: हिब्रू के ‘दिनों की लम्बाई’ वाले मुहावरे को सहज हिन्दी में व्यक्त करता है और अगले समानांतर पदबंध से उसका काव्यात्मक संबंध बनाए रखता है।
- source_word: וּשְׁנוֹת חַיִּים
  choice: जीवन के वर्ष
  rationale: मूल की समानांतर रचना और अर्थ को सीधे रूप में सुरक्षित रखता है।
- source_word: וְשָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם का प्रचलित संक्षिप्त हिन्दी रूप है; इसमें निहित कुशलता, कल्याण और सम्पूर्णता का व्यापक भाव पादटिप्पणी में दिया गया है।
- source_word: יוֹסִיפוּ
  choice: बढ़ाएँगे … और … देंगे
  rationale: יסף के हिफ़ील रूप का मूल भाव ‘बढ़ाना/जोड़ना’ है। हिन्दी में आयु और वर्षों के साथ ‘बढ़ाएँगे’ तथा शान्ति के साथ ‘देंगे’ स्वाभाविक है; एक ही हिब्रू क्रिया का दोनों कर्मों पर लागू होना वाक्य-संरचना में बना रहता है।
- source_word: לָךְ
  choice: तेरी … तुझे
  rationale: एकवचन सम्बोधित व्यक्ति के लिए लाभार्थक/अप्रत्यक्ष कर्म का अर्थ सहज हिन्दी में व्यक्त करता है और पद 1 के व्यक्तिगत सम्बोधन से मेल खाता है।
theological_decisions:
- issue: प्रतिज्ञा-सदृश कथन का स्वर
  choice: निश्चयात्मक भविष्यकाल ‘बढ़ाएँगे … देंगे’
  alternative: संभाव्य या सामान्य परिणाम—‘बढ़ा सकते हैं’
  rationale: मूल में अपूर्ण क्रिया यहाँ परिणाम को सीधे और निश्चयात्मक ढंग से बताती है; पाठ में ऐसी कोई योग्यता नहीं जोड़ी गई जो कथन को केवल संभावना बना दे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तेरी/तुझे’ का प्रयोग नीतिवचन 3 के पिता-पुत्र वाले एकवचन आत्मीय सम्बोधन के अनुरूप है। काव्यात्मक समानांतरता को बनाए रखते हुए अस्वाभाविक ‘दिनों की लम्बाई’ से बचा गया है।
