base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/025.yaml
  text: Do not fear sudden terror[a], or the ruin of the wicked when it comes[b],
translation:
  language: hi
  text: 'अचानक आनेवाले आतंक से मत डरना,

    न दुष्टों की तबाही से, जब वह आए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दुष्टों की तबाही” का अर्थ दुष्टों पर आनेवाली विपत्ति भी हो सकता है, या दुष्ट लोगों से जुड़ी अथवा उनके द्वारा लाई गई विपत्ति। इब्रानी में यह संबंध स्पष्ट नहीं किया गया है। “तबाही” के लिए “विनाश” या “उजाड़” भी संभव है।
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डरना
  rationale: निषेधवाचक אַל और ירא के रूप का स्वाभाविक, संक्षिप्त हिन्दी निषेध; नीति-वचन के उपदेशात्मक प्रवाह में यह प्रयोग सहज है।
- source_word: מִפַּחַד פִּתְאֹם
  choice: अचानक आनेवाले आतंक से
  rationale: פַּחַד भय या आतंक को और פִּתְאֹם उसके आकस्मिक होने को व्यक्त करता है। हिन्दी में ‘से डरना’ मूल के מִן-संबंध को स्वाभाविक ढंग से रखता है।
- source_word: וּמִשֹּׁאַת
  choice: न ... तबाही से
  rationale: שֹׁאָה विनाशकारी विपत्ति, तबाही या उजाड़ को सूचित करता है। ‘तबाही’ आधुनिक हिन्दी में स्पष्ट है और पहले खंड के समानांतर बैठता है।
- source_word: רְשָׁעִים
  choice: दुष्टों की
  rationale: मूल का संक्षिप्त संबंध बनाए रखा गया है; यह अपने आप तय नहीं करता कि तबाही दुष्टों पर आती है या उनसे जुड़ी/उनके द्वारा लाई गई है।
- source_word: כִּי תָבֹא
  choice: जब वह आए
  rationale: यहाँ כִּי को कालवाचक समझना प्रसंगानुकूल है। स्त्रीलिंग एकवचन क्रिया תָבֹא का संकेत שֹׁאָה की ओर है, जिसे हिन्दी में स्त्रीलिंग ‘तबाही’ और ‘वह’ से रखा गया है।
theological_decisions:
- issue: ‘दुष्टों की तबाही’ में संबंध की अस्पष्टता
  choice: संक्षिप्त संबंधवाचक पद ‘दुष्टों की तबाही’ बनाए रखा
  alternative: ‘दुष्टों पर आनेवाली तबाही’ या ‘दुष्टों द्वारा लाई गई तबाही’
  rationale: इब्रानी रचना यह स्पष्ट नहीं करती कि दुष्ट उस विपत्ति के भोगी हैं या उससे किसी अन्य प्रकार जुड़े हैं; किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की वास्तविक अस्पष्टता मिटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। काव्यात्मक समानांतरता बनाए रखने के लिए दो पंक्तियाँ रखी गई हैं; ‘मत डरना’ उपदेशात्मक शैली में स्वाभाविक है।
