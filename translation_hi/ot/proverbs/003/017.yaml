  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-काव्य शैली अपनाई गई है। ‘मार्ग’ और ‘पथ’ मूल के समानांतर बिंब को बनाए रखते हैं; ‘मनोहर’ सामान्य पाठक के लिए सहज रहते हुए נֹעַם की सुखदता व्यक्त करता है।
