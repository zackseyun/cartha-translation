  text: Her ways are ways of pleasantness[a], and all her paths are peace.
translation:
  language: hi
  text: 'उसके मार्ग सुखद हैं,

    और उसके सभी पथ शांति के हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कल्याण” अथवा “संपूर्णता”; इब्रानी शब्द शालोम का अर्थ व्यापक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיהָ
  choice: उसके मार्ग
  rationale: दֶּרֶךְ मार्ग, रास्ता या जीवन-रीति को सूचित कर सकता है। स्त्रीलिंग प्रत्यय संदर्भ में बुद्धि की ओर संकेत करता है; ‘मार्ग’ ठोस बिंब और रूपक दोनों को बनाए रखता है।
- source_word: דַרְכֵי נֹעַם
  choice: मनोहर हैं
  rationale: शाब्दिक रचना ‘मनोहरता के मार्ग’ है। स्वाभाविक हिन्दी में ‘मार्ग मनोहर हैं’ נֹעַם की सुखद, रमणीय और प्रसन्नतादायक गुणवत्ता को संक्षेप में व्यक्त करता है, जबकि पहली पंक्ति में ‘मार्ग’ की पुनरावृत्ति बनी रहती है।
- source_word: וְכָל
  choice: और उसके सभी
  rationale: וְ के संयोजक बल और כָל की समग्रता को ‘और ... सभी’ स्पष्ट रूप से व्यक्त करता है।
- source_word: נְתִיבוֹתֶיהָ
  choice: उसके सभी पथ
  rationale: נְתִיבָה काव्यात्मक रूप से रास्ते या पगडंडी का बोध देता है और דֶּרֶךְ के समानांतर है। ‘पथ’ हिन्दी में काव्यात्मक गरिमा और समानांतर मार्ग-बिंब बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: שָׁלוֹם का अर्थ केवल संघर्ष का अभाव नहीं, बल्कि कुशलता, कल्याण और संपूर्णता भी हो सकता है। मुख्य पाठ में परिचित ‘शान्ति’ रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
