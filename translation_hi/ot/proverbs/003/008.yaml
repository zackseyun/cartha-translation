lexical_decisions:
- source_word: רִפְאוּת
  choice: चंगाई
  rationale: यह संज्ञा रोग या दुर्बलता से उबरने और स्वास्थ्य-बहाली का भाव व्यक्त करती है। ‘चंगाई’ परिणामसूचक अर्थ और शारीरिक बिंब दोनों को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: תְּהִי
  choice: होगी
  rationale: स्त्रीलिंग कर्ता ‘चंगाई’ के अनुरूप यह रूप पूर्ववर्ती उपदेश के परिणाम को व्यक्त करता है; इसलिए भविष्यसूचक ‘होगी’ उपयुक्त है।
- source_word: לְשָׁרֶּךָ
  choice: तुम्हारे शरीर के लिए
  rationale: שֹׁר का संकीर्ण अर्थ ‘नाभि’ हो सकता है, पर प्रसंग में यह संभवतः शारीरिक स्वास्थ्य या शरीर के केंद्रीय भाग का व्यापक संकेत है। मुख्य पाठ में ‘शरीर’ अर्थ को सहज बनाता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְשִׁקּוּי
  choice: और ... ताज़गी
  rationale: यह शब्द पिलाने, सींचने या नमी देने के विचार से निकला है। हड्डियों के समानांतर प्रयोग में ‘ताज़गी’ पुनर्जीवन और स्फूर्ति का स्वाभाविक हिन्दी भाव देती है, जबकि अधिक ठोस अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: לְעַצְמוֹתֶיךָ
  choice: तुम्हारी हड्डियों के लिए
  rationale: मूल का ठोस शारीरिक बिंब सीधे रखा गया है। हिब्रू प्रयोग में हड्डियाँ व्यक्ति की भीतरी संरचना और जीवन-शक्ति का भी संकेत दे सकती हैं।
