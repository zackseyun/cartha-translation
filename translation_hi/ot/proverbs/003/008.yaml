    text: या “तुम्हारी नाभि के लिए।” हिब्रू शब्द विशेष रूप से नाभि का उल्लेख कर सकता है, यद्यपि इस प्रसंग में संभवतः यह व्यापक रूप से शरीर के स्वास्थ्य को दर्शाता है।
