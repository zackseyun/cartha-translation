  yaml_path: translation/ot/proverbs/003/001.yaml
  text: My son[a], do not forget my instruction[b], and let your heart keep my commandments.
translation:
  language: hi
  text: हे मेरे पुत्र, मेरी शिक्षा[a] को मत भूल, और तेरा हृदय मेरी आज्ञाओं को सँभालकर रखे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी शिक्षा” के स्थान पर “मेरा उपदेश।” यहाँ इब्रानी शब्द तोराह का अर्थ केवल संकीर्ण कानूनी अर्थ में “व्यवस्था” नहीं, बल्कि शिक्षा या निर्देश भी है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी आज्ञाओं की रक्षा करे” या “मेरी आज्ञाओं का पालन करे।” इब्रानी क्रिया में सावधानी से सँभालकर रखने, सुरक्षित रखने और पालन करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: पुंलिंग एकवचन संबोधन और पिता-पुत्र के नीतिशिक्षात्मक प्रसंग को स्पष्ट तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: תּוֹרָתִי
  choice: मेरी शिक्षा
  rationale: यहाँ תּוֹרָה संकीर्ण कानूनी अर्थ में ‘व्यवस्था’ नहीं, बल्कि पिता की नीतिपरक शिक्षा या निर्देश है; ‘शिक्षा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אַל תִּשְׁכָּח
  choice: मत भूल
  rationale: निषेधात्मक आग्रह की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וּמִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: מִצְוָה के अधिकारपूर्ण निर्देश का भाव ‘आज्ञा’ से सुरक्षित रहता है।
- source_word: יִצֹּר
  choice: रक्षा करे
  rationale: נצר का मूल भाव सावधानी से सँभालने और पहरा देने का है; ‘रक्षा करे’ उसे केवल सामान्य पालन तक सीमित नहीं करता।
- source_word: לִבֶּךָ
  choice: तेरा हृदय
  rationale: हिब्रू में हृदय विचार, इच्छा और भाव का भी केंद्र है; शाब्दिक रूप इसे केवल ‘मन’ तक सीमित करने से बचाता है।
theological_decisions:
- issue: नीतिवचन के पितृपरक उपदेश में लिंगयुक्त संबोधन
  choice: पुंलिंग एकवचन ‘हे मेरे पुत्र’ बनाए रखा गया
  alternative: हे मेरे बच्चे
  rationale: मूल पाठ स्पष्ट रूप से पुंलिंग एकवचन है और पिता द्वारा पुत्र को दी जाने वाली ज्ञान-शिक्षा की साहित्यिक संरचना का अंग है।
- issue: आज्ञाओं को हृदय द्वारा ‘रखना’
  choice: ‘रक्षा करे’ द्वारा भीतर सँजोने और सावधानी से पालन करने की संयुक्त छवि रखी गई
  alternative: पालन करे
  rationale: क्रिया נצר केवल आज्ञापालन नहीं, बल्कि सावधानी से सुरक्षित रखने का अर्थ भी देती है; पाठ की आंतरिक नैतिकता को किसी एक पहलू तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में पिता-पुत्र संबोधन की गरिमा बनाए रखने के लिए ‘हे मेरे पुत्र’ और एकवचन आत्मीय ‘तेरा’ का प्रयोग किया गया है। ‘बल्कि’ हिब्रू समन्वय के प्रसंगगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
