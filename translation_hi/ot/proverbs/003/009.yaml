  text: כַּבֵּ֣ד אֶת יְ֭הוָה מֵ/הוֹנֶ֑/ךָ וּ֝/מֵ/רֵאשִׁ֗ית כָּל תְּבוּאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/009.yaml
  text: Honor Yahweh with your wealth and with the firstfruits of all your produce[a][b].
translation:
  language: hi
  text: अपनी धन-संपत्ति[a] से और अपनी सारी उपज के पहले फलों[b] से याहवे का आदर कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी धन-संपत्ति में से”; इब्रानी संबंधबोधक उपसर्ग का अर्थ यहाँ साधन (“से”) या स्रोत/हिस्सा (“में से”) हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पहले फल” फसल के आरम्भिक और उत्तम भाग को दर्शाता है, जिसे परमेश्वर के आदर में दिया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: כַּבֵּד
  choice: आदर कर
  rationale: पिएल आज्ञार्थक रूप यहाँ किसी को सम्मान देने का अर्थ रखता है। ‘आदर कर’ आधुनिक, स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: מֵהוֹנֶךָ
  choice: अपनी धन-सम्पत्ति से
  rationale: הוֹן भौतिक साधन, सम्पत्ति या धन को सूचित करता है; ‘धन-सम्पत्ति’ इसका व्यापक और सहज हिन्दी समतुल्य है। מִן को ‘से’ रखकर साधन और स्रोत के बीच की मूल अर्थगत गुंजाइश बनी रहती है।
- source_word: וּמֵרֵאשִׁית
  choice: और ... पहले फल से भी
  rationale: רֵאשִׁית का मूल अर्थ आरम्भ या पहला भाग है; कृषि-उपज के संदर्भ में ‘पहले फल’ सहज है और अर्पित किए जाने वाले आरम्भिक भाग की ओर संकेत करता है।
- source_word: כָּל
  choice: सारी
  rationale: כָּל यहाँ सम्पूर्ण उपज को विशेषित करता है; स्त्रीलिंग संज्ञा ‘उपज’ के साथ ‘सारी’ स्वाभाविक है।
- source_word: תְּבוּאָתֶךָ
  choice: अपनी सारी उपज
  rationale: תְּבוּאָה खेत की पैदावार, फसल या उपज को दर्शाता है। ‘उपज’ आधुनिक हिन्दी में स्पष्ट और कृषि-संदर्भ के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित देवनागरी रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आज्ञार्थक एकवचन को नीतिवचन की सीधी, शिक्षाप्रद शैली के अनुरूप रखा गया है। भाषा आधुनिक और गरिमापूर्ण है; ‘धन-सम्पत्ति’, ‘उपज’ और ‘पहले फल’ सामान्य पाठक के लिए स्पष्ट हैं।
