id: PRO.3.11
reference: Proverbs 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מוּסַ֣ר יְ֭הוָה בְּנִ֣/י אַל תִּמְאָ֑ס וְ/אַל תָּ֝קֹ֗ץ בְּ/תוֹכַחְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/011.yaml
  text: My son[a], do not despise Yahweh’s discipline, and do not loathe his reproof.
translation:
  language: hi
  text: हे मेरे बेटे, याहवे के अनुशासन को तुच्छ न जान, और उसकी फटकार से घृणा न कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी फटकार से ऊब न जा।’ इब्रानी क्रिया घृणा या विरक्ति के साथ-साथ ऊबने अथवा अधीर होने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסַר
  choice: अनुशासन
  rationale: नीतिवचन के संदर्भ में यह शब्द ऐसी सुधारात्मक शिक्षा और प्रशिक्षण को दर्शाता है जो चरित्र को सँवारता है; ‘अनुशासन’ इसके शिक्षाप्रद और सुधारात्मक दोनों पहलुओं को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित करता है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: यह एकवचन पुल्लिंग में पिता-सदृश सीधा संबोधन है। ‘हे मेरे बेटे’ मूल रूप और ज्ञान-साहित्य की आत्मीय शिक्षापरक शैली को बनाए रखता है।
- source_word: אַל תִּמְאָס
  choice: तुच्छ न जान
  rationale: מָאַס में तिरस्कार के साथ ठुकराने का भाव है। ‘तुच्छ न जान’ इस मनोवृत्ति को सहज और गरिमापूर्ण हिंदी में प्रकट करता है।
- source_word: תָּקֹץ
  choice: घृणा न कर
  rationale: קוּץ घृणा या विरक्ति के साथ-साथ ऊब अथवा अधीरता का अर्थ भी दे सकता है। मुख्य पाठ में ‘घृणा न कर’ समानांतर पंक्ति की प्रबल भावात्मक शक्ति रखता है, जबकि दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּתוֹכַחְתּוֹ
  choice: उसकी फटकार
  rationale: תּוֹכַחַת मौखिक सुधार, डाँट या प्रतिवचन को दर्शाता है। ‘फटकार’ व्यापक ‘अनुशासन’ से अलग इसके मौखिक सुधारात्मक पक्ष को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पद में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करके नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: קוּץ में घृणा और ऊब के बीच अर्थ-संभावना
  choice: मुख्य पाठ में ‘घृणा न कर’, पादटिप्पणी में ‘ऊब न जा’
  alternative: मुख्य पाठ में ‘उससे ऊब न जा’
  rationale: क्रिया भावात्मक विरक्ति और थकान/अधीरता दोनों व्यक्त कर सकती है। समानांतरता के कारण मुख्य पाठ में प्रबल अर्थ रखा गया है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन आत्मीय संबोधन के लिए ‘बेटे’ तथा आज्ञार्थक निषेध के लिए ‘न जान/न कर’ का प्रयोग ज्ञान-साहित्य की पितृवत शिक्षापरक शैली बनाए रखता है।
