  text: עֵץ חַיִּ֣ים הִ֭יא לַ/מַּחֲזִיקִ֣ים בָּ֑/הּ וְֽ/תֹמְכֶ֥י/הָ מְאֻשָּֽׁר־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/018.yaml
  text: She is a tree of life to those who take hold of her[b][a], and those who hold her fast are blessed.
translation:
  language: hi
  text: जो उसे थाम लेते हैं, उनके लिए वह जीवन का वृक्ष है; और जो उसे दृढ़ता से पकड़े रहते हैं[a], वे धन्य हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो उसे सँभाले रखते हैं।” इब्रानी क्रिया का अर्थ “सहारा देना,” “बनाए रखना,” या “दृढ़ता से पकड़े रहना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में स्त्रीलिंग सर्वनाम आसपास के संदर्भ में स्त्री के रूप में मानवीकृत बुद्धि की ओर संकेत करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: עֵץ חַיִּים
  choice: जीवन का वृक्ष
  rationale: इब्रानी समास का रूपक सीधे बनाए रखता है। यहाँ अनिश्चित उपपद न होने के कारण हिन्दी में स्वाभाविक रूप से ‘जीवन का वृक्ष’ कहा गया है, बिना इसे अनिवार्य रूप से अदन के विशिष्ट वृक्ष के समान ठहराए।
- source_word: הִיא
  choice: वह
  rationale: स्त्रीलिंग एकवचन सर्वनाम निकटवर्ती संदर्भ में मानवीकृत बुद्धि की ओर संकेत करता है। हिन्दी का ‘वह’ स्वाभाविक है; संदर्भ और पादटिप्पणी स्त्री-मानवीकरण स्पष्ट करते हैं।
- source_word: לַמַּחֲזִיקִים בָּהּ
  choice: जो उसे थाम लेते हैं
  rationale: חזק का रूप यहाँ किसी वस्तु को पकड़ने या थामने का ठोस भाव देता है। ‘थाम लेते हैं’ कठोर ‘झपट लेते हैं’ से अधिक स्वाभाविक है और रूपक को सुरक्षित रखता है।
- source_word: וְתֹמְכֶיהָ
  choice: और जो उसे दृढ़ता से पकड़े रहते हैं
  rationale: תמך में सहारा देने, बनाए रखने और दृढ़ता से थामे रहने की अर्थ-सीमा है। समानांतर पंक्ति में यह चुनाव बुद्धि से निरंतर और दृढ़ लगाव व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מְאֻשָּׁר
  choice: धन्य हैं
  rationale: यह शब्द प्रशंसनीय, समृद्ध और सुखमय दशा बताता है। ‘धन्य’ ज्ञान-साहित्य के गरिमापूर्ण स्वर को बनाए रखता है और ‘भाग्यशाली’ में निहित संयोग के भाव से बचता है।
theological_decisions:
- issue: बुद्धि का स्त्री-मानवीकरण
  choice: ‘वह/उसे’ के साथ पादटिप्पणी में स्पष्ट किया गया कि संकेत मानवीकृत बुद्धि की ओर है
  alternative: बुद्धि को निर्जीव अमूर्त वस्तु मानकर केवल ‘यह/इसे’ कहना
  rationale: इब्रानी पाठ स्त्रीलिंग एकवचन रूपों का प्रयोग करता है और आसपास के संदर्भ में बुद्धि को स्त्री के रूप में मानवीकृत करता है। हिन्दी में लिंग-निरपेक्ष सर्वनाम के कारण पादटिप्पणी साहित्यिक विशेषता को स्पष्ट करती है, बिना कोई अतिरिक्त धर्मवैज्ञानिक पहचान आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। दोनों अर्ध-पंक्तियों में पकड़ने/थामे रहने की ठोस समानांतर छवि सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
