base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/028.yaml
  text: Do not say to your neighbor[a], “Go, and come back[b], and tomorrow I will give,” when you have it with you.
translation:
  language: hi
  text: अपने पड़ोसी से यह मत कहना, “जाओ, फिर लौट आना; मैं कल दूँगा,” जबकि वह तुम्हारे पास ही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵעַ
  choice: पड़ोसी
  rationale: नीतिवचन में यह शब्द प्रायः सामाजिक निकटता वाले दूसरे व्यक्ति को सूचित करता है; ‘पड़ोसी’ इस व्यापक नैतिक दायित्व को बनाए रखता है।
- source_word: לֵךְ וָשׁוּב
  choice: जा, फिर आना
  rationale: दोनों आज्ञाओं का सीधा और स्वाभाविक हिन्दी रूप; इससे व्यक्ति को अभी लौटाकर बाद में आने को कहना स्पष्ट होता है।
- source_word: מָחָר
  choice: कल
  rationale: सामान्य कालवाचक शब्द का सहज हिन्दी समतुल्य।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: मूल में कर्म व्यक्त नहीं है, इसलिए हिन्दी में भी उसे अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: יֵשׁ אִתָּךְ
  choice: तेरे पास देने को हो
  rationale: यह उस वस्तु या साधन की वर्तमान उपलब्धता व्यक्त करता है जिसे दिया जा सकता है; ‘देने को’ हिन्दी में निहित प्रसंग को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: אַל
  choice: न कहना
  rationale: यह निषेधात्मक आदेश का सीधा हिन्दी रूप है और मूल से अधिक बल नहीं जोड़ता।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। एकवचन संबोधन में ‘तेरे/जा/आना’ का प्रयोग नीतिवचन की सीधी शिक्षात्मक शैली को बनाए रखता है। कारणसूचक अंतिम उपवाक्य को हिन्दी की स्वाभाविक सूचना-रचना के अनुसार आरम्भ में रखा गया है।
