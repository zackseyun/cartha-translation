source:
  edition: WLC
  text: כִּ֤י תוֹעֲבַ֣ת יְהוָ֣ה נָל֑וֹז וְֽ/אֶת יְשָׁרִ֥ים סוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/032.yaml
  text: For the crooked person is an abomination to Yahweh[a], but his counsel is with the upright.
translation:
  language: hi
  text: 'क्योंकि कुटिल मनुष्य याहवे को घृणित है,

    परन्तु सीधे लोगों के साथ उसकी गुप्त मंत्रणा होती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है और हिन्दी में स्वाभाविक कारणसूचक संयोजक है।
- source_word: תוֹעֲבַת
  choice: घृणित
  rationale: यह परमेश्वर की दृष्टि में अत्यन्त अप्रिय और नैतिक रूप से जघन्य होने का प्रबल भाव व्यक्त करता है; हिन्दी में विशेषणात्मक रचना स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम יהוה को उपाधि में बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: נָלוֹז
  choice: कुटिल मनुष्य
  rationale: यह नैतिक रूप से सीधे मार्ग से मुड़े हुए व्यक्ति को सूचित करता है; 'कुटिल' अगले चरण के 'सीधे' के साथ मूल विरोध बनाए रखता है।
- source_word: וְאֶת
  choice: परन्तु ... के साथ
  rationale: וְ यहाँ विरोधात्मक समानांतरता में है, जबकि אֶת संबंध/साथ होने का अर्थ ग्रहण करता है।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: यह नैतिक सीधेपन को व्यक्त करता है और נָלוֹז के टेढ़ेपन के रूपक के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: סוֹדוֹ
  choice: उसकी गुप्त मंत्रणा
  rationale: סוֹד में गोपनीय परामर्श, रहस्य और निकट संगति के परस्पर जुड़े भाव हैं। 'गुप्त मंत्रणा' मुख्य पाठ में गोपनीय विचार-विनिमय को सामने रखती है, जबकि पादटिप्पणी अन्य वास्तविक अर्थों को सुरक्षित रखती है।
theological_decisions:
- issue: सीधे लोगों के साथ סוֹד का अर्थ
  choice: याहवे की गुप्त मंत्रणा सीधे लोगों के साथ होती है
  alternative: याहवे का रहस्य सीधे लोगों के पास है; अथवा याहवे की घनिष्ठ संगति सीधे लोगों के साथ है
  rationale: इब्रानी शब्द गोपनीय सलाह और अंतरंग निकटता दोनों को व्यक्त कर सकता है। मुख्य पाठ एक अर्थ देता है और पादटिप्पणी दूसरे सम्भव अर्थों को खुला रखती है, ताकि कथन को केवल जानकारी देने या केवल संगति तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण ज्ञान-साहित्यीय लहजा रखा गया है। 'कुटिल' और 'सीधे' मूल के नैतिक टेढ़ेपन तथा सीधेपन के विरोध को बनाए रखते हैं; पंक्ति-विभाजन इब्रानी समानांतरता को स्पष्ट करता है।
