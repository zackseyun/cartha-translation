  yaml_path: translation/ot/proverbs/003/023.yaml
  text: Then you will walk securely on your way[a], and your foot will not stumble.
translation:
  language: hi
  text: तब तू अपने मार्ग पर सुरक्षित चलेगा,[a] और तेरे पाँव को ठोकर न लगेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चिंत होकर।’ इब्रानी पदबंध का अर्थ ‘सुरक्षा में’ या ‘सुरक्षित रीति से’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रिया-विशेषण पिछले उपदेश के परिणाम और क्रम को व्यक्त करता है; ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: תֵּלֵךְ
  choice: तू...चलेगा
  rationale: הלך का अर्थ ‘चलना/जाना’ है। ‘मार्ग’ के साथ ‘चलेगा’ नीतिवचन की जीवन-मार्ग वाली छवि को बनाए रखता है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: यह रूप सुरक्षा और निश्चिंतता की अवस्था बताता है। ‘सुरक्षित’ वस्तुगत सुरक्षा को स्पष्ट करता है, जबकि ‘निडर होकर’ मन की भावना पर अधिक बल दे सकता है।
- source_word: דַּרְכֶּךָ
  choice: अपने मार्ग पर
  rationale: דֶּרֶךְ वास्तविक रास्ते और जीवन-मार्ग दोनों का संकेत दे सकता है; ‘मार्ग’ इस दोहरे अर्थ को सुरक्षित रखता है।
- source_word: וְרַגְלְךָ
  choice: और तेरे पाँव को
  rationale: मूल में संज्ञा एकवचन और द्वितीय पुरुष पुल्लिंग एकवचन संबंधसूचक प्रत्यय के साथ है। हिंदी में ‘तेरे पाँव को’ इस रूप को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לֹא תִגּוֹף
  choice: ठोकर न लगेगी
  rationale: इस प्रसंग में נגף का आशय पाँव टकराने या ठोकर खाने से है। हिंदी का स्वाभाविक प्रयोग ‘पाँव को ठोकर लगना’ सुरक्षित यात्रा की छवि स्पष्ट रखता है।
