  text: for her profit is better than the profit of silver[b][a], and her yield than gold.
translation:
  language: hi
  text: 'क्योंकि उसका लाभ चाँदी के व्यापार के लाभ से उत्तम है,

    और उसकी उपज सोने[a] से भी उत्तम है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खरे सोने’; इब्रानी शब्द विशेष रूप से मूल्यवान या परिष्कृत सोने का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में बुद्धि को धन्य कहे जाने का कारण प्रस्तुत करता है।
- source_word: טוֹב
  choice: उत्तम है
  rationale: מִן के साथ यह तुलनात्मक अर्थ देता है; हिंदी में ‘से उत्तम’ स्वाभाविक और गरिमापूर्ण है।
- source_word: סַחְרָהּ
  choice: उससे मिलनेवाला लाभ
  rationale: स्त्रीलिंग प्रत्यय का संकेत व्यक्ति-रूप में प्रस्तुत बुद्धि की ओर है। ‘लाभ’ व्यापारिक रूपक को स्पष्ट रखता है, जबकि ‘उससे मिलनेवाला’ हिंदी में संबंध को सहज बनाता है।
- source_word: מִסְּחַר כָּסֶף
  choice: चाँदी के व्यापार से होनेवाले लाभ से
  rationale: मूल पाठ में चाँदी मात्र नहीं, उसके व्यापार अथवा वाणिज्य से प्राप्त लाभ की तुलना है; यह अनुवाद उस व्यापारिक बिंब को बनाए रखता है।
- source_word: וּמֵחָרוּץ
  choice: उत्तम सोने से
  rationale: חָרוּץ मूल्यवान अथवा परिष्कृत सोने को सूचित कर सकता है; मुख्य पाठ में ‘उत्तम सोना’ इस सूक्ष्मता को संक्षेप में व्यक्त करता है।
- source_word: תְּבוּאָתָהּ
  choice: उससे होनेवाली उपज
  rationale: यह शब्द उत्पन्न फल या पैदावार का बिंब रखता है। ‘उपज’ उस रूपक को सुरक्षित रखते हुए आधुनिक हिंदी में स्पष्ट है।
