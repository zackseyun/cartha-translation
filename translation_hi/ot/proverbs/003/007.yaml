base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/007.yaml
  text: Do not be wise in your own eyes[c][b][a]; fear Yahweh and turn away from evil.
translation:
  language: hi
  text: अपनी ही दृष्टि में बुद्धिमान न बनो[a]; याहवे का भय मानो[b] और बुराई से दूर हटो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी ही दृष्टि में बुद्धिमान न हो।”
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे के प्रति श्रद्धा रखो।” इब्रानी क्रिया परमेश्वर के सामने श्रद्धायुक्त भय या विस्मय का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “बुराई से अलग हो जाओ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל־תְּהִי
  choice: न बनो
  rationale: निषेधवाचक אַל के साथ היה का रूप किसी अवस्था में होने या बनने से रोकता है। आधुनिक हिन्दी में ‘न बनो’ सहज है और ‘न हो’ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: חָכָם בְּעֵינֶיךָ
  choice: अपनी ही दृष्टि में बुद्धिमान
  rationale: इब्रानी मुहावरा अपने आकलन में स्वयं को बुद्धिमान समझने का भाव देता है। ‘अपनी ही दृष्टि में’ इस आत्म-संदर्भ और चेतावनी के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְרָא
  choice: भय मानो
  rationale: यहाँ आज्ञार्थक क्रिया परमेश्वर के प्रति श्रद्धायुक्त भय और विस्मय का बोध कराती है। ‘भय मानो’ पारम्परिक धार्मिक भार बनाए रखता है; ‘श्रद्धा रखो’ सम्भव अर्थ को पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְסוּר
  choice: और दूर हटो
  rationale: סור का आज्ञार्थक रूप मुड़ने, हटने या अलग हो जाने की स्वेच्छापूर्ण क्रिया बताता है। ‘दूर हटो’ आधुनिक हिन्दी में नैतिक परिहार को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: रָע इस ज्ञान-साहित्यिक संदर्भ में नैतिक बुराई को सूचित करता है। ‘बुराई’ व्यापक अर्थ को बनाए रखता है और इसे किसी खास अपराध तक सीमित नहीं करता।
theological_decisions:
- issue: יהוה ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
- issue: יְרָא में भय और श्रद्धा का संबंध
  choice: भय मानो
  alternative: श्रद्धा रखो; श्रद्धापूर्वक भय मानो
  rationale: मुख्य पाठ में ‘भय’ इब्रानी शब्द की तीव्रता और ज्ञान-साहित्य के धर्मवैचारिक भार को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह परमेश्वर के प्रति श्रद्धायुक्त भय भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त ज्ञानोक्ति की शैली और गरिमा बनाए रखते हुए रखी गई है। समान पुरुष एकवचन आज्ञार्थक रूपों—‘न बनो’, ‘मानो’, ‘हटो’—से मूल की सीधी व्यक्तिगत सम्बोधन-शैली सुरक्षित है।
