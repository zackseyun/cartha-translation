revisions:
- from: जब तुम्हारा पड़ोसी तुम्हारे पास बेखटके रहता हो, तब उसके विरुद्ध बुराई की योजना मत बनाओ।
  to: जब तुम्हारा पड़ोसी तुम्हारे साथ निश्चिंत होकर रहता हो, तब उसके विरुद्ध बुरा करने की योजना मत बनाओ।
  rationale: The revision preserves the prohibition, the adversarial direction, the broad sense of “neighbor,” and the ongoing secure residence of the other person. It improves standard Hindi idiom and clarifies that the security described is the neighbor's untroubled state, not merely freedom from obstacles.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T23:27:48Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the idiomatic sense of חָרַשׁ as intentional scheming, renders the hostile force of עַל as “के विरुद्ध,” and retains the neighbor's secure, trusting residence. However, “बुराई की योजना” is less idiomatic in Hindi and can sound abstract rather than conveying intended injury.
  naturalness: The conditional structure is understandable, but “बेखटके” is colloquial and can suggest acting without hindrance rather than dwelling in safety/trust. “निश्चिंत होकर” is clearer, standard, and better suited to the proverb's register. “बुरा करने की योजना” is a more natural Hindi expression than “बुराई की योजना.”
  terminology: “पड़ोसी” appropriately preserves the broad ethical-social sense of רֵעַ. “बुरा करने की योजना” conveys the intended harmful wrongdoing without imposing a narrower interpretation. No theological terms are at issue.
  issues:
  - severity: medium
    issue: “बेखटके” is semantically less precise for לָבֶטַח.
    rationale: It can mean “without impediment” or “boldly,” whereas the Hebrew denotes secure, safe, and likely unsuspecting dwelling. “निश्चिंत होकर” directly conveys the required state.
  - severity: low
    issue: “बुराई की योजना” is awkward Hindi collocation.
    rationale: The phrase is intelligible but abstract. “बुरा करने की योजना” naturally expresses scheming to harm and reflects the verbal force of the Hebrew idiom.
  revised_text: जब तुम्हारा पड़ोसी तुम्हारे साथ निश्चिंत होकर रहता हो, तब उसके विरुद्ध बुरा करने की योजना मत बनाओ।
  revised_footnotes: []
  revision_rationale: The revision preserves the prohibition, the adversarial direction, the broad sense of “neighbor,” and the ongoing secure residence of the other person. It improves standard Hindi idiom and clarifies that the security described is the neighbor's untroubled state, not merely freedom from obstacles.
