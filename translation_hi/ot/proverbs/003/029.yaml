  text: אַל תַּחֲרֹ֣שׁ עַל רֵעֲ/ךָ֣ רָעָ֑ה וְ/הֽוּא יוֹשֵׁ֖ב לָ/בֶ֣טַח אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/029.yaml
  text: Do not devise harm against your neighbor while he dwells securely with you[a].
translation:
  language: hi
  text: जब तुम्हारा पड़ोसी तुम्हारे साथ निश्चिंत होकर रहता हो, तब उसके विरुद्ध बुरा करने की योजना मत बनाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחֲרֹשׁ
  choice: योजना मत बनाओ
  rationale: इस मुहावरे में क्रिया का अर्थ शाब्दिक रूप से ‘हल चलाना’ नहीं, बल्कि मन में कोई हानिकारक योजना बनाना है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: यह पूर्वसर्ग योजना की शत्रुतापूर्ण दिशा को पड़ोसी की ओर दर्शाता है।
- source_word: רֵעֲךָ
  choice: तुम्हारा पड़ोसी
  rationale: रֵעַ मित्र, साथी या पड़ोसी हो सकता है; इस नैतिक उपदेश में ‘पड़ोसी’ सामाजिक संबंध की व्यापकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָעָה
  choice: बुराई
  rationale: यह शब्द किसी के विरुद्ध हानि या दुष्कर्म का भाव रखता है; ‘बुराई’ मूल शब्द की नैतिक व्यापकता को बनाए रखता है।
- source_word: יוֹשֵׁב
  choice: रहता हो
  rationale: यह कृदंत लगातार निवास करने या रहने का भाव देता है; आधुनिक हिन्दी में ‘रहता हो’ सहज और स्पष्ट है।
- source_word: לָבֶטַח
  choice: बेखटके
  rationale: यह सुरक्षा और निश्चिंतता की अवस्था व्यक्त करता है; ‘बेखटके’ उस व्यक्ति के भरोसे से, बिना आशंका के रहने का भाव संक्षेप में देता है।
- source_word: אִתָּךְ
  choice: तुम्हारे पास
  rationale: यह साथ या निकटता दर्शाता है; ‘तुम्हारे पास’ संबंधगत और स्थानगत निकटता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष निषेधात्मक उपदेश। पद की शर्तात्मक संरचना तथा पड़ोसी की निश्चिंत सुरक्षा और संबोधित व्यक्ति की गुप्त दुर्भावना के बीच तनाव सुरक्षित रखा गया है।
