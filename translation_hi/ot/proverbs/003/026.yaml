base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/026.yaml
  text: For Yahweh will be your confidence[a], and he will keep your foot from being caught.
translation:
  language: hi
  text: 'क्योंकि याहवे तुम्हारा भरोसा होगा[a],

    और वह तुम्हारे पाँव को फँसने नहीं देगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे तुम्हारी बगल में होगा।” इब्रानी अभिव्यक्ति को अधिक शाब्दिक रूप से समझा जा सकता है, हालाँकि यहाँ उसका आशय सम्भवतः भरोसा या सुरक्षा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִהְיֶה בְכִסְלֶךָ
  choice: तुम्हारा भरोसा होगा
  rationale: כֶּסֶל का शाब्दिक अर्थ शरीर की बगल या कमर का भाग हो सकता है, पर यहाँ यह लाक्षणिक रूप से भरोसे या सुरक्षा को सूचित करता है। यह चयन अगले खंड में वर्णित ईश्वरीय रक्षा के अनुरूप है।
- source_word: וְשָׁמַר
  choice: और वह … बचाएगा
  rationale: שׁמר का अर्थ रक्षा करना या सुरक्षित रखना है। ‘बचाएगा’ अगले वाक्यांश ‘फँसने से’ के साथ सहज आधुनिक हिन्दी बनाता है।
- source_word: רַגְלְךָ
  choice: तुम्हारे पाँव को
  rationale: मूल का एकवचन सुरक्षित रखा गया है; यहाँ पाँव व्यक्ति की चाल और मार्ग के लिए भी संकेतक है।
- source_word: מִלָּכֶד
  choice: फँसने से
  rationale: לכד से बना यह रूप पकड़े या फँसाए जाने का भाव देता है। मूल में फंदे का स्पष्ट संज्ञात्मक उल्लेख नहीं है, इसलिए अनावश्यक वस्तु जोड़े बिना इसे ‘फँसने से’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְכִסְלֶךָ का आशय
  choice: तुम्हारा भरोसा
  alternative: तुम्हारे साथ/तुम्हारी बगल में
  rationale: संदर्भ में यह लाक्षणिक अर्थ सुरक्षा और आत्मविश्वास के आधार को व्यक्त करता है; फिर भी सम्भव अधिक शाब्दिक स्थानवाचक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘पाँव’ मूल इब्रानी के अनुरूप है। पद की काव्यात्मक समानांतरता बनाए रखने के लिए इसे दो पंक्तियों में प्रस्तुत किया गया है।
