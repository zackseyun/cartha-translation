  text: By his knowledge the depths were split open[b][a], and the clouds drip dew.
translation:
  language: hi
  text: उसके ज्ञान से गहरे जल फट गए[a], और बादल ओस टपकाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अथाह गहराइयाँ’ या ‘गहरी जलराशियाँ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘आकाश ओस टपकाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדַעְתּוֹ
  choice: उसके ज्ञान से
  rationale: בְּ यहाँ साधन का भाव देता है और דַּעַת का सीधा अर्थ ‘ज्ञान’ है। यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: תְּהוֹמוֹת
  choice: गहरे जल
  rationale: बहुवचन תְּהוֹמוֹת आदिम अथवा अथाह गहराइयों, विशेषकर गहरे जल, को दर्शाता है। ‘गहरे जल’ सामान्य पाठक के लिए स्पष्ट रहते हुए सृष्टि-संबंधी बिंब बनाए रखता है।
- source_word: נִבְקָעוּ
  choice: फूट निकले
  rationale: निफ़अल रूप के खुलने या फट जाने के भाव को ‘फूट निकले’ जल के संदर्भ में सजीव और स्वाभाविक ढंग से व्यक्त करता है; इसे केवल सृष्टि या केवल जलप्रलय तक सीमित नहीं करता।
- source_word: וּשְׁחָקִים
  choice: और बादल
  rationale: שְׁחָקִים का अर्थ आकाश या बादल हो सकता है। ओस टपकाने की अगली क्रिया के कारण मुख्य पाठ में ‘बादल’ संदर्भानुकूल है।
- source_word: יִרְעֲפוּ
  choice: टपकाते हैं
  rationale: क्रिया धीरे-धीरे बूंदें गिराने या टपकाने का भाव देती है, जो ओस के साथ उपयुक्त है और ‘बरसाते हैं’ से कम तीव्र है।
- source_word: טָל
  choice: ओस
  rationale: טָל का मानक और संदर्भानुकूल हिन्दी अर्थ ‘ओस’ है।
theological_decisions:
- issue: सृष्टि और ईश्वरीय प्रबंध का ब्रह्मांडीय बिंब
  choice: पद को परमेश्वर के ज्ञान द्वारा जगत की व्यवस्था के काव्यात्मक वर्णन के रूप में रखा गया है, जो आरंभिक सृष्टि और निरंतर प्रबंध दोनों के लिए खुला है।
  alternative: इसे केवल आरंभिक सृष्टि की घटना या केवल मौसम के निरंतर संचालन का उल्लेख माना जा सकता है।
  rationale: नीतिवचन 3:19–20 का संदर्भ सृष्टि की स्थापना पर बल देता है, पर अपूर्ण क्रिया יִרְעֲפוּ वर्तमान या निरंतर व्यवस्था का संकेत भी दे सकती है। अनुवाद इस तनाव को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘गहरे जल’ और ‘फूट निकले’ मूल के ब्रह्मांडीय जल-बिंब को सामान्य पाठक के लिए स्पष्ट बनाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
