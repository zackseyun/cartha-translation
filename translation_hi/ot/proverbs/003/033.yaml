source:
  edition: WLC
  text: מְאֵרַ֣ת יְ֭הוָה בְּ/בֵ֣ית רָשָׁ֑ע וּ/נְוֵ֖ה צַדִּיקִ֣ים יְבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/033.yaml
  text: Yahweh’s curse is on the house of the wicked[b][a], but he blesses the dwelling of the righteous.
translation:
  language: hi
  text: दुष्ट के घर पर याहवे का शाप रहता है,[a] पर धर्मियों के निवास को वह आशीष देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘दुष्ट के घर में’; यहाँ ‘घर पर ... शाप रहता है’ शाप के उस घराने पर बने रहने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֵרַת
  choice: शाप
  rationale: यह संज्ञा किसी शाप अथवा शापित दशा को व्यक्त करती है; हिन्दी में ‘शाप’ सीधा और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּבֵית
  choice: के घर पर ... रहता है
  rationale: בְּ का मूल अर्थ ‘में/पर’ हो सकता है। शाप के संदर्भ में ‘घर पर ... रहता है’ हिन्दी में उस घराने पर शाप के ठहरे होने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: इब्रानी में एकवचन रूप यहाँ नीतिवचन की सामान्य, प्रतिनिधिक श्रेणी बताता है; ‘दुष्ट’ इसी सामान्य अर्थ को बनाए रखता है।
- source_word: וּנְוֵה
  choice: पर ... के निवास को
  rationale: וְ संदर्भ में विरोध दिखाता है, इसलिए ‘पर’; נָוֶה के लिए ‘निवास’ ठहरने की जगह का ठोस चित्र सुरक्षित रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘धर्मी’ उसकी नैतिक श्रेणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְבָרֵךְ
  choice: आशीष देता है
  rationale: अपूर्ण क्रिया-रूप यहाँ सामान्य नीतिवचनात्मक सत्य बताता है, न कि केवल भविष्य की घटना; इसलिए सामान्य वर्तमान काल उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: रָשָׁע के प्रतिनिधिक एकवचन का अर्थ
  choice: दुष्ट
  alternative: दुष्ट मनुष्य
  rationale: ज्ञान-साहित्य में यह एकवचन किसी एक पुरुष तक सीमित नहीं, बल्कि सामान्य नैतिक श्रेणी का प्रतिनिधित्व करता है; ‘दुष्ट’ इस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले उपवाक्य की इब्रानी क्रियारहित रचना को स्वाभाविक हिन्दी बनाने के लिए ‘रहता है’ जोड़ा गया है; दूसरे उपवाक्य में कर्ता ‘वह’ याहवे की ओर संकेत करता है।
