base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/021.yaml
  text: My son[a], do not let them depart from your eyes[b]; guard sound wisdom and discretion.
translation:
  language: hi
  text: मेरे पुत्र, वे तेरी आँखों से ओझल न हों[a]; ठोस बुद्धि और विवेक को सँभालकर रख[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे तेरी आँखों से न हटें।” “वे” आसपास के प्रसंग में दी गई शिक्षाओं या गुणों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “ठोस बुद्धि” का अनुवाद “सही निर्णय” या “व्यावहारिक सूझ-बूझ” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: इब्रानी में पुल्लिंग एकवचन सम्बोधन है; नीतिवचन के पिता/गुरु से पुत्र वाले संवाद-ढाँचे को बनाए रखा गया है।
- source_word: אַל יָלֻזוּ
  choice: वे ... ओझल न हों
  rationale: बहुवचन क्रिया का निहित कर्ता आसपास के प्रसंग में बताई गई शिक्षाएँ या गुण हैं। आँखों से दूर होने के मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵעֵינֶיךָ
  choice: तेरी आँखों से
  rationale: मूल का दृश्य-बिम्ब बनाए रखता है और निरन्तर ध्यान में रखने का भाव देता है।
- source_word: נְצֹר
  choice: रक्षा कर
  rationale: आज्ञार्थक क्रिया सावधानी से सँभालकर रखने का सक्रिय भाव व्यक्त करती है।
- source_word: תֻּשִׁיָּה
  choice: खरी बुद्धि
  rationale: शब्द प्रभावकारी, ठोस और व्यावहारिक बुद्धि या सही निर्णय का बोध करा सकता है; 'खरी बुद्धि' इसकी सुदृढ़ता को संक्षेप में व्यक्त करती है।
- source_word: וּמְזִמָּה
  choice: और विवेक
  rationale: इस सकारात्मक ज्ञान-साहित्यिक सन्दर्भ में शब्द सूझ-बूझ, सावधानी और विचारशील योजना की क्षमता बताता है।
theological_decisions:
- issue: पुत्र के लिए लिंग-सूचक सम्बोधन
  choice: हे मेरे पुत्र
  alternative: हे मेरी सन्तान
  rationale: मूल इब्रानी स्पष्ट रूप से पुल्लिंग एकवचन है और नीतिवचन के पिता-पुत्र सम्बोधन को दर्शाता है; इसलिए इसे लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पिता-पुत्र सम्बोधन रखा गया है। काव्यात्मक दृश्य-बिम्ब बनाए रखते हुए अस्पष्ट बहुवचन 'वे' को मुख्य पाठ में स्पष्ट करके सीमित नहीं किया गया।
