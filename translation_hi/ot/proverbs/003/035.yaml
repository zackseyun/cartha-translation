source:
  edition: WLC
  text: כָּ֭בוֹד חֲכָמִ֣ים יִנְחָ֑לוּ וּ֝/כְסִילִ֗ים מֵרִ֥ים קָלֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/035.yaml
  text: The wise will inherit honor, but fools lift up disgrace.
translation:
  language: hi
  text: 'बुद्धिमान सम्मान के उत्तराधिकारी होंगे,

    पर मूर्ख अपमान को ऊँचा उठाते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבוֹד (kavod)
  choice: सम्मान
  rationale: यहाँ शब्द सामाजिक आदर और प्रतिष्ठा का बोध कराता है; ‘सम्मान’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: יִנְחָלוּ (yinchalu)
  choice: उत्तराधिकारी होंगे
  rationale: क्रिया का मूल अर्थ विरासत या स्थायी हिस्से के रूप में कुछ पाना है; यह अनुवाद उस उत्तराधिकार-संबंधी रूपक को बनाए रखता है।
- source_word: כְסִילִים (kesilim)
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और व्यवहारिक विवेक से रहित लोगों के लिए प्रचलित शब्द है; ‘मूर्ख’ इसका सीधा और स्पष्ट हिन्दी समकक्ष है।
- source_word: מֵרִים (merim)
  choice: ऊँचा उठाते हैं
  rationale: मसोराई पाठ के हिफ़ील रूप के प्रत्यक्ष अर्थ ‘उठाना/ऊँचा करना’ को सुरक्षित रखा गया है, भले ही कथन जानबूझकर तीखा और कुछ असामान्य लगे।
- source_word: קָלוֹן (qalon)
  choice: अपमान
  rationale: यह सम्मान के विपरीत लज्जा, तिरस्कार या बदनामी को व्यक्त करता है; समानांतरता में ‘अपमान’ सर्वाधिक स्पष्ट है।
theological_decisions:
- issue: मूर्खों और अपमान के बीच क्रिया का अर्थ
  choice: मूर्ख अपमान को ऊँचा उठाते हैं
  alternative: मूर्ख अपमान उठाते/पाते हैं
  rationale: मसोराई पाठ מֵרִים का सामान्य अर्थ ‘ऊँचा उठाता है’ है। सरल अर्थ के लिए इसे ‘पाते हैं’ या ‘ढोते हैं’ बनाना पाठ की वास्तविक असामान्यता को मिटा देता; इसलिए मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों पंक्तियों की विरोधात्मक समानांतरता तथा ‘उत्तराधिकारी होना/ऊँचा उठाना’ के रूपक सुरक्षित हैं।
