  text: אַשְׁרֵ֣י אָ֭דָם מָצָ֣א חָכְמָ֑ה וְ֝/אָדָ֗ם יָפִ֥יק תְּבוּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/013.yaml
  text: Blessed is the man who finds wisdom[a], and the man who obtains understanding.
translation:
  language: hi
  text: 'धन्य है वह मनुष्य जो बुद्धि पाता है,

    और वह मनुष्य जो समझ प्राप्त करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह हिब्रानी का आशीर्वचनात्मक मुहावरा है, जो केवल प्रसन्नता नहीं बल्कि सराहनीय और कल्याणमय दशा व्यक्त करता है; ‘धन्य है’ हिन्दी ज्ञान-साहित्य की गरिमा भी बनाए रखता है।
- source_word: אָדָם
  choice: वह मनुष्य
  rationale: यहाँ אָדָם किसी भी मानव का प्रतिनिधित्व करने वाला एकवचन है। ‘मनुष्य’ हिन्दी में स्वाभाविक रूप से समावेशी है और मूल की प्रतिनिधिक एकवचन रचना को बनाए रखता है।
- source_word: מָצָא
  choice: पाता है
  rationale: पूर्ण रूप यहाँ सार्वकालिक नीतिवचन के रूप में प्रयुक्त है; वर्तमानकालीन ‘पाता है’ सामान्य सत्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में חָכְמָה के लिए यह प्रचलित और सुसंगत हिन्दी पद है, जिसमें विवेकपूर्ण और कुशल जीवन का भाव शामिल है।
- source_word: וְאָדָם
  choice: और वह मनुष्य
  rationale: संज्ञा की पुनरावृत्ति मूल के समानांतर काव्य-विन्यास को सुरक्षित रखती है।
- source_word: יָפִיק
  choice: प्राप्त करता है
  rationale: क्रिया का अर्थ निकालना, उत्पन्न करना या हासिल करना हो सकता है; यहाँ ‘बुद्धि पाता है’ के समानांतर उपलब्धि का भाव प्रमुख है, इसलिए ‘प्राप्त करता है’ उपयुक्त है।
- source_word: תְּבוּנָה
  choice: समझ
  rationale: यह विवेकपूर्ण समझ या अंतर्दृष्टि को दर्शाता है; ‘समझ’ साधारण आधुनिक हिन्दी में स्पष्ट है और ‘बुद्धि’ के साथ स्वाभाविक युग्म बनाता है।
theological_decisions:
- issue: ज्ञान-वचन में אָדָם का प्रतिनिधिक अर्थ
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया है
  alternative: व्यक्ति; जो कोई
  rationale: मूल का एकवचन प्रतिनिधिक है और किसी विशेष लिंग तक सीमित नहीं है। हिन्दी ‘मनुष्य’ मूल की मानव-संज्ञा और उसके समावेशी आशय—दोनों को बिना अनावश्यक व्याख्या के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और नीतिवचन की दो समानांतर पंक्तियों को सुरक्षित रखने वाला रूप। अंग्रेज़ी की लिंग-स्पष्टीकरण संबंधी पाद-टिप्पणी हिन्दी में आवश्यक नहीं, क्योंकि ‘मनुष्य’ सामान्यतः समावेशी है।
