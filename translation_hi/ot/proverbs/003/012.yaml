source:
  edition: WLC
  text: כִּ֤י אֶ֥ת אֲשֶׁ֣ר יֶאֱהַ֣ב יְהוָ֣ה יוֹכִ֑יחַ וּ֝/כְ/אָ֗ב אֶת בֵּ֥ן יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/012.yaml
  text: For Yahweh reproves the one he loves[b][a], as a father the son in whom he delights.
translation:
  language: hi
  text: क्योंकि याहवे जिससे प्रेम करता है, उसे सुधारता है[a], जैसे पिता उस पुत्र को सुधारता है जिससे वह प्रसन्न होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “डाँटता है” अथवा “अनुशासित करता है।” इब्रानी क्रिया का मुख्य भाव दोष दिखाकर सुधारना है; प्रसंग में यह याहवे के व्यापक अनुशासन का भाग है।
    reason: lexical_alternative
  - marker: b
    text: या, “और पिता के समान उस पुत्र को जिससे वह प्रसन्न होता है।” इब्रानी के दूसरे अर्धपद में ‘सुधारता है’ क्रिया व्यक्त नहीं है, बल्कि पहले अर्धपद से समझी जाती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है; हिंदी में ‘क्योंकि’ इस तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת אֲשֶׁר
  choice: जिससे ... उसे
  rationale: कर्मसूचक चिह्न और संबंधवाचक अव्यय मिलकर एक व्यक्ति को कर्म के रूप में प्रस्तुत करते हैं; यह हिंदी रचना एकवचन व्यक्तिगत संदर्भ को स्पष्ट रखती है।
- source_word: יֶאֱהַב
  choice: प्रेम करता है
  rationale: यह אהב का सीधा और स्वाभाविक अर्थ है तथा पद में निहित आत्मीयता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय पवित्र नाम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में प्रस्तुत किया गया है।
- source_word: יוֹכִיחַ
  choice: सुधारता है
  rationale: Hiphil रूप यहाँ किसी की गलती दिखाकर उसे सुधारने का भाव रखता है। ‘सुधारता है’ सामान्य हिंदी में स्वाभाविक है; अधिक संकीर्ण ‘डाँटता है’ और व्यापक ‘अनुशासित करता है’ को पादटिप्पणी में रखा गया है।
- source_word: וּכְאָב
  choice: जैसे पिता
  rationale: तुलनासूचक כ को स्वाभाविक हिंदी उपमा के रूप में व्यक्त किया गया है; आरंभिक ו को अलग से ‘और’ कहना हिंदी में आवश्यक नहीं है।
- source_word: בֵּן
  choice: उस पुत्र को
  rationale: मूल का पुल्लिंग एकवचन पिता-पुत्र बिंब सुरक्षित रखा गया है। हिंदी में ‘उस’ उपमा के संबंधित पुत्र को स्वाभाविक रूप से संकेत करता है, बिना मूल में कोई स्पष्ट स्वत्वसूचक सर्वनाम जोड़ने के।
- source_word: יִרְצֶה
  choice: जिससे वह प्रसन्न होता है
  rationale: רצה यहाँ अनुकूल प्रसन्नता, स्वीकृति या कृपा का भाव देता है। यह चयन स्नेहपूर्ण प्रसन्नता को व्यक्त करता है और ‘कृपा करता है’ को संभावित विकल्प के रूप में खुला रखता है।
theological_decisions:
- issue: ईश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में निजी वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता और स्रोत-रूप के अधिक निकट है।
- issue: पिता-पुत्र का लिंगविशिष्ट बिंब
  choice: जैसे पिता उस पुत्र को
  alternative: जैसे माता-पिता अपनी संतान को
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘पिता’ और ‘पुत्र’ कहता है; इसलिए प्रतिनिधि नीतिवचन-बिंब को लिंग-निरपेक्ष नहीं किया गया।
- issue: ईश्वरीय सुधार का स्वरूप
  choice: सुधारता है
  alternative: डाँटता है / अनुशासित करता है
  rationale: तत्काल क्रिया का केंद्र दोष दिखाकर सुधारना है। यह चयन आसपास के अनुशासन-विषय को नकारता नहीं, पर इस एक क्रिया में उससे अधिक व्यापक अर्थ भी नहीं भरता।
- issue: दूसरे अर्धपद में पिता की क्रिया
  choice: ‘सुधारता है’ को संदर्भ से दोहराना
  alternative: और पिता के समान उस पुत्र को जिस पर वह कृपा करता है
  rationale: इब्रानी दूसरे अर्धपद में क्रिया को संक्षेप में छोड़ देता है। हिंदी में अर्थपूर्ण वाक्य के लिए पहली क्रिया दोहराई गई है, जबकि पादटिप्पणी अधिक शब्दानुगामी संरचना और רצה के ‘कृपा/पक्ष’ भाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पिता’ और ‘पुत्र’ का मूल बिंब सुरक्षित है। वाक्य को हिंदी में पूर्ण और स्पष्ट बनाने के लिए दूसरे अर्धपद में निहित क्रिया ‘सुधारता है’ दोहराई गई है; पादटिप्पणी मूल की संक्षिप्त संरचना बताती है।
