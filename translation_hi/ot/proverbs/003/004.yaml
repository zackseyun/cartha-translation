  text: וּ/מְצָא חֵ֖ן וְ/שֵֽׂכֶל ט֑וֹב בְּ/עֵינֵ֖י אֱלֹהִ֣ים וְ/אָדָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/004.yaml
  text: Then you will find favor and good sense in the eyes of God and man[a].
translation:
  language: hi
  text: तब तू परमेश्वर और मनुष्य[a] की दृष्टि में कृपा और सद्बुद्धि पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों” अथवा “मानवजाति”; यहाँ हिब्रू शब्द “मनुष्य” (אָדָם) परमेश्वर के विपरीत समस्त मनुष्यों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְצָא
  choice: तब तू ... पाएगा
  rationale: पिछली आज्ञाओं के बाद यह उनके परिणाम को व्यक्त करता है। हिंदी में ‘तब ... पाएगा’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: חֵן
  choice: कृपा
  rationale: यहाँ शब्द का अर्थ किसी की दृष्टि में अनुकूलता या स्वीकार्यता पाना है। ‘कृपा’ प्रचलित और गरिमापूर्ण है तथा अनावश्यक रूप से किसी विशेष धर्मवैज्ञानिक अर्थ तक सीमित नहीं करता।
- source_word: וְשֵׂכֶל טוֹב
  choice: और सद्बुद्धि
  rationale: שֵׂכֶל में समझ, विवेक और सूझ-बूझ का भाव है। ‘सद्बुद्धि’ संक्षिप्त और स्वाभाविक रूप से उसके बौद्धिक-नैतिक पक्ष को व्यक्त करती है; ‘सफलता’ की संभावित अर्थछाया को मुख्य पाठ में निर्णायक नहीं बनाया गया।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह हिब्रू मुहावरे ‘की आँखों में’ का स्वाभाविक हिंदी रूप है और मूल्यांकन अथवा सम्मान का भाव बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह एकमात्र परमेश्वर के लिए प्रयुक्त है।
- source_word: וְאָדָם
  choice: और मनुष्य
  rationale: אָדָם यहाँ परमेश्वर के विपरीत मानव-पक्ष को सामूहिक/प्रतिनिधिक अर्थ में रखता है। ‘मनुष्य’ मूल के एकवचन रूप और व्यापक मानव अर्थ—दोनों को निकटता से रखता है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक मानव अर्थ
  choice: मनुष्य
  alternative: लोग / मानवजाति
  rationale: मूल पाठ में एकवचन אָדָם है, पर आशय केवल पुरुष से नहीं बल्कि मनुष्यों से है। मुख्य पाठ में ‘मनुष्य’ स्रोत-रूप को बनाए रखता है और पादटिप्पणी उसका व्यापक अर्थ स्पष्ट करती है।
- issue: שֵׂכֶל טוֹב का अर्थ
  choice: सद्बुद्धि
  alternative: अच्छी समझ / अच्छी प्रतिष्ठा / सफलता
  rationale: शब्द समझ और विवेक को दर्शा सकता है, जबकि कुछ संदर्भगत व्याख्याएँ प्रतिष्ठा या सफलता की ओर जाती हैं। ‘सद्बुद्धि’ मूल शब्द का सीधा अर्थ रखती है और किसी विवादित परिणामवादी अर्थ को नहीं थोपती।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पिछले पदों के एकवचन संबोधन के अनुरूप ‘तू’ प्रयुक्त है। ‘की दृष्टि में’ हिंदी का स्वाभाविक मूल्यांकन-सूचक मुहावरा है।
