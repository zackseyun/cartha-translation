base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/005.yaml
  text: Trust in Yahweh with all your heart[a], and do not lean on your own understanding.
translation:
  language: hi
  text: 'अपने सम्पूर्ण हृदय से याहवे पर भरोसा रख,

    और अपनी समझ का सहारा न ले[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी समझ पर मत टिक।” इब्रानी क्रिया का अर्थ किसी वस्तु पर झुकना, टिकना या उससे सहारा लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטַח
  choice: भरोसा रख
  rationale: दूसरे पुरुष एकवचन की आज्ञा को सीधे और स्वाभाविक ढंग से व्यक्त करता है तथा संबंधपरक निर्भरता का भाव बनाए रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे पर
  rationale: בטח के साथ אֶל का स्वाभाविक हिन्दी रूप ‘पर भरोसा रखना’ है। יְהוָה को उपाधि से बदलने के बजाय व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בְּכָל לִבֶּךָ
  choice: अपने सम्पूर्ण हृदय से
  rationale: यह वाक्यांश आंतरिक व्यक्ति—विचार, इच्छा और भाव—की पूर्ण संलग्नता बताता है। ‘सम्पूर्ण हृदय’ मूल रूपक और समग्रता दोनों को सुरक्षित रखता है।
- source_word: בִּינָתְךָ
  choice: अपनी समझ
  rationale: בִּינָה यहाँ समझ, सूझ-बूझ या विवेक को दर्शाता है। ‘अपनी समझ’ व्यापक, सहज और स्वत्वसूचक प्रत्यय के अनुरूप है।
- source_word: אַל תִּשָּׁעֵן
  choice: सहारा न ले
  rationale: निषेधात्मक आज्ञा को स्पष्ट रखता है और שׁען के किसी वस्तु पर टिकने या उससे सहारा लेने के रूपक को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण है; यह उसे किसी उपाधि से नहीं बदलता और ‘यहोवा’ वाले वैकल्पिक उच्चारण से अलग रखता है।
- issue: हृदय और समझ के बीच संबंध
  choice: ‘हृदय’ को केवल भावना और ‘समझ’ को केवल बुद्धि तक सीमित नहीं किया गया
  alternative: हृदय को केवल भावनात्मक विश्वास के अर्थ में लेना
  rationale: इब्रानी לֵב आंतरिक व्यक्ति, विचार और इच्छा को भी समेटता है। पद मानव समझ को निरर्थक घोषित नहीं करता, बल्कि उसे याहवे के स्थान पर अंतिम सहारा बनाने से रोकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण आज्ञार्थक एकवचन रखा गया है। समानांतर काव्य-पंक्तियाँ मूल नीतिवचन की संक्षिप्तता और विरोधात्मक संरचना को बनाए रखती हैं।
