  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। एकवचन सम्बोधन के लिए निकटवर्ती ज्ञानोपदेश की शैली के अनुरूप ‘तेरा’ रखा गया है। ‘व्यक्ति’ אָדָם के यहाँ सामान्य मानव-संदर्भ को व्यक्त करता है।
