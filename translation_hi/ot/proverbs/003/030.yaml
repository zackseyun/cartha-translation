  yaml_path: translation/ot/proverbs/003/030.yaml
  text: Do not contend with a man without cause[b][a], if he has done you no harm.
translation:
  language: hi
  text: किसी व्यक्ति से बिना कारण विवाद न कर, यदि उसने तेरी कोई हानि न की हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל
  choice: न कर
  rationale: אַל के साथ अपूर्ण क्रिया निषेधात्मक आज्ञा व्यक्त करती है; हिन्दी में ‘न कर’ इसे स्वाभाविक और संक्षिप्त रूप से प्रकट करता है।
- source_word: תרוב
  choice: झगड़ा
  rationale: ריב का अर्थ वाद-विवाद, झगड़ा या कानूनी विवाद करना हो सकता है। ‘झगड़ा करना’ सामान्य हिन्दी में व्यापक रूप से समझ आता है और यहाँ किसी अनुचित विवाद को दर्शाता है।
- source_word: עִם
  choice: से
  rationale: हिन्दी में ‘किसी से झगड़ा करना’ स्वाभाविक प्रयोग है और इब्रानी संबंध को ठीक व्यक्त करता है।
- source_word: אָדָם
  choice: किसी व्यक्ति
  rationale: אָדָם यहाँ ज्ञान-साहित्य की सार्वभौमिक शिक्षा में किसी भी मनुष्य को सूचित करता है; ‘किसी व्यक्ति’ सामान्य अभिप्राय को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חִנָּם
  choice: बिना कारण
  rationale: חִנָּם का अर्थ ‘अकारण’ या ‘बिना किसी उचित आधार के’ है; ‘बिना कारण’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: אִם לֹא
  choice: यदि ... न ... हो
  rationale: यह शर्त प्रस्तुत करता है; हिन्दी में ‘यदि उसने ... न किया हो’ स्रोत की शर्तात्मक रचना और उसके वास्तविक तनाव को बनाए रखता है।
- source_word: גְמָלְךָ
  choice: उसने तेरा ... किया हो
  rationale: גמל किसी के साथ कुछ करने या उसे प्रतिफल देने का भाव रखता है; רָעָה के साथ ‘बुरा करना’ हिन्दी का स्वाभाविक समतुल्य है।
- source_word: רָעָה
  choice: कोई बुरा
  rationale: רָעָה यहाँ हानि, बुराई या अन्याय को सूचित कर सकता है। ‘कोई बुरा’ अर्थ की व्यापकता रखता है, जबकि फुटनोट में ‘हानि’ का अधिक ठोस विकल्प दिया गया है।
theological_decisions: []
