base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/019.yaml
  text: Yahweh founded the earth by wisdom[a]; he established the heavens by understanding.
translation:
  language: hi
  text: याहवे ने बुद्धि से पृथ्वी की नींव डाली[a]; उसने समझ से आकाश को स्थापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि के साथ” … “समझ के साथ।” हिब्रू पूर्वसर्ग साधन या साथ होने—दोनों का भाव दे सकता है; यहाँ “से” सृष्टि में साधन का भाव सबसे स्वाभाविक रूप से व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में सीधे लिप्यंतरित किया गया है।
- source_word: בְּחָכְמָה
  choice: बुद्धि से
  rationale: यहाँ בְּ साधन अथवा साथ होने का भाव दे सकता है; सृष्टि के संदर्भ और समानांतर पंक्ति में साधनार्थक ‘से’ सर्वाधिक स्वाभाविक है।
- source_word: יָסַד
  choice: नींव डाली
  rationale: क्रिया में नींव रखने का निर्माण-रूपक निहित है; यह हिंदी में ‘पृथ्वी’ के साथ स्पष्ट और स्वाभाविक है।
- source_word: אָרֶץ
  choice: पृथ्वी
  rationale: विश्व-सृष्टि के संदर्भ में इसका अर्थ किसी विशेष देश के बजाय पृथ्वी है।
- source_word: כּוֹנֵן
  choice: स्थापित किया
  rationale: यह दृढ़ता से ठहराने या स्थापित करने का भाव व्यक्त करता है और पहली पंक्ति के निर्माण-रूपक के समानांतर है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिंदी में ‘पृथ्वी और आकाश’ स्वाभाविक ब्रह्मांडीय युग्म है; ‘आकाश’ हिब्रू के बहुवचनात्मक सामूहिक भाव को सहज रूप से व्यक्त करता है।
- source_word: בִּתְבוּנָה
  choice: समझ से
  rationale: यह विवेकपूर्ण समझ को व्यक्त करता है और ‘बुद्धि’ के साथ नीतिवचन की ज्ञान-संबंधी समानांतर शब्दावली बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: सृष्टि में बुद्धि और समझ की भूमिका
  choice: ‘से’ द्वारा साधन का प्रमुख भाव
  alternative: ‘के साथ’ द्वारा संगति का भाव
  rationale: हिब्रू पूर्वसर्ग दोनों अर्थ दे सकता है। संदर्भ में साधनार्थक अर्थ अधिक उपयुक्त है, पर पाठ टिप्पणी में वैकल्पिक संगति-भाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। काव्यात्मक समानांतरता बनाए रखने के लिए ‘बुद्धि से/समझ से’ तथा ‘नींव डाली/स्थापित किया’ का संतुलित प्रयोग किया गया है।
