  text: אִם תִּשְׁכַּ֥ב לֹֽא תִפְחָ֑ד וְ֝/שָׁכַבְתָּ֗ וְֽ/עָרְבָ֥ה שְׁנָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/003/024.yaml
  text: If you lie down[a], you will not be afraid; when you lie down, your sleep will be pleasant.
translation:
  language: hi
  text: यदि तुम लेटोगे, तो नहीं डरोगे; और जब तुम लेटोगे, तो तुम्हारी नींद सुखद होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त या परिस्थिति सूचित करने वाला सामान्य हिब्रू अव्यय है। ‘यदि’ उसके मूल बल को बनाए रखता है।
- source_word: תִּשְׁכַּב
  choice: तुम लेटोगे
  rationale: שׁכב यहाँ सोने के लिए लेटने को सूचित करता है; यह सरल और स्रोत के निकट अभिव्यक्ति है।
- source_word: לֹא תִפְחָד
  choice: नहीं डरोगे
  rationale: निषेध के साथ अपूर्ण क्रिया आश्वासन व्यक्त करती है; यह इसे आज्ञा बनाए बिना פחד के भय-संबंधी अर्थ को रखता है।
- source_word: וְשָׁכַבְתָּ
  choice: और जब तुम लेटोगे
  rationale: वाव-संयुक्त पूर्ण क्रिया विचार को आगे बढ़ाती है और यहाँ परिस्थितिजन्य/कालिक भाव स्वाभाविक है; ‘और’ समानांतर पुनरुक्ति को भी बनाए रखता है।
- source_word: וְעָרְבָה
  choice: सुखद होगी
  rationale: ערב का अर्थ यहाँ मनभावन या मधुर होना है। नींद के संदर्भ में ‘सुखद’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक काव्यात्मकता के बिना व्यक्त करता है।
- source_word: שְׁנָתֶךָ
  choice: तुम्हारी नींद
  rationale: यह सोने की अवस्था या अनुभव को सूचित करता है; ‘नींद’ स्पष्ट और प्रचलित आधुनिक हिन्दी है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट रखी गई है। मूल पद में ‘सुखद’ के स्थान पर ‘मीठी’ सम्भव है, पर हिन्दी में ‘नींद सुखद होगी’ अधिक सहज है। अंग्रेज़ी परामर्श-पाठ का [a] चिह्न ‘lie down’ पर दिखाई देता है, जबकि उसकी टिप्पणी ‘sleep will be sweet’ से संबंधित है; इस असंगति को हिन्दी मसौदे में नहीं दोहराया गया।
