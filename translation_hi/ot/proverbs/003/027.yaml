  text: Do not withhold good from those to whom it is due when it is in your power to do it[a][b].
translation:
  language: hi
  text: जिन लोगों का भलाई पर अधिकार है, उनसे भलाई मत रोको, जब ऐसा करना तुम्हारे सामर्थ्य में हो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “भलाई को उसके स्वामियों से मत रोको”; अर्थात उन लोगों से, जिनका उस पर उचित दावा है।'
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: “जब करना तुम्हारे हाथ की शक्ति में हो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: मत चूको
  rationale: निषेध के साथ מנע का अर्थ किसी उचित भलाई को रोकना या न करना है। हिंदी में ‘भला करने से मत चूको’ स्वाभाविक ढंग से उस नैतिक आग्रह को व्यक्त करता है।
- source_word: טוֹב
  choice: भला
  rationale: हिब्रू शब्द व्यापक है और भलाई, लाभ तथा हितकारी कार्य को समेटता है; ‘भला’ इस खुले अर्थ को बनाए रखता है।
- source_word: מִבְּעָלָיו
  choice: जिनका ... करना तुम्हारा कर्तव्य है
  rationale: शाब्दिक रूप ‘उसके स्वामियों/अधिकारियों से’ है, पर संदर्भ में इसका आशय उन लोगों से है जिनका उस भलाई पर उचित दावा है। यह हिंदी रूप अर्थ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: בִּהְיוֹת לְאֵל יָדֶךָ
  choice: जब ऐसा करना तुम्हारे सामर्थ्य में हो
  rationale: ‘जब करने की शक्ति तुम्हारे हाथ में हो’ हिब्रू मुहावरा है, जिसका स्वाभाविक हिंदी अर्थ किसी काम का व्यक्ति के वश या सामर्थ्य में होना है।
- source_word: לַעֲשׂוֹת
  choice: ऐसा करना
  rationale: सामान्य क्रिया עשה पूर्वोक्त भलाई करने की ओर संकेत करती है; ‘ऐसा करना’ हिंदी में स्पष्ट और सहज है।
theological_decisions:
- issue: מִבְּעָלָיו में भलाई पाने वालों के दावे का स्वरूप
  choice: कर्तव्य है
  alternative: जो उसके अधिकारी हैं / जो उसके स्वामी हैं
  rationale: पद केवल सामान्य उदारता नहीं, बल्कि उचित दावे या दायित्व का संकेत दे सकता है। ‘कर्तव्य’ इस नैतिक बल को व्यक्त करता है, फिर भी किसी खास कानूनी या सांप्रदायिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन एकवचन है, जैसा हिब्रू יָדֶךָ में है। भाषा सरल और गरिमापूर्ण रखी गई है।
