base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/028.yaml
  text: When the wicked rise[a], a man hides himself, but when they perish[b], the righteous increase.
translation:
  language: hi
  text: जब दुष्ट उठ खड़े होते हैं, तब मनुष्य[b] छिप जाता है[a]; पर जब उनका नाश होता है, तब धर्मी बढ़ जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छिपा रहता है’ अथवा ‘छिपाया जाता है’; इब्रानी क्रिया को कर्मवाच्य या मध्यवाच्य/आत्मवाच्य अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मनुष्य’ इब्रानी אָדָם (आदाम) का अनुवाद है, जो यहाँ नीतिवचन की भाषा में सामान्य रूप से किसी भी मानव के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקוּם
  choice: जब ... उठ खड़े होते हैं
  rationale: בְּ के साथ קוּם का infinitive construct यहाँ समयसूचक है। ‘जब ... उठ खड़े होते हैं’ दुष्टों के प्रभाव या सत्ता में उभरने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल राजनीतिक शासन तक सीमित किए।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन substantival adjective है, अर्थात दुष्ट चरित्र वाले लोग। ‘दुष्ट’ हिन्दी नीतिवचन की संक्षिप्त और परिचित अभिव्यक्ति है।
- source_word: יִסָּתֵר
  choice: छिप जाता है
  rationale: סתר का निफ़अल रूप कर्मवाच्य (‘छिपाया जाता है/छिपा रहता है’) अथवा मध्यवाच्य-आत्मवाच्य (‘अपने को छिपाता है’) समझा जा सकता है। ‘छिप जाता है’ हिन्दी में इस प्रसंग का स्वाभाविक अर्थ देता है और मूल की कुछ अस्पष्टता भी बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: אָדָם यहाँ किसी एक प्रतिनिधि मानव के लिए सामान्य रूप से प्रयुक्त एकवचन है। ‘मनुष्य’ उस सामान्य अर्थ और नीतिवचन की गरिमा को बनाए रखता है, जबकि अनावश्यक रूप से केवल पुरुष का अर्थ नहीं जोड़ता।
- source_word: וּבְאָבְדָם
  choice: पर जब उनका नाश होता है
  rationale: וּ के साथ בְּ + infinitive construct और तृतीय पुरुष बहुवचन प्रत्यय का अर्थ ‘और/पर जब वे नष्ट होते हैं’ है। विरोधी समानांतरता के कारण ‘पर’ उपयुक्त है; संज्ञात्मक हिन्दी वाक्यांश ‘उनका नाश होता है’ मूल अर्थ को सहजता से व्यक्त करता है।
- source_word: יִרְבּוּ
  choice: बढ़ जाते हैं
  rationale: רבה का अर्थ संख्या या प्रत्यक्ष उपस्थिति में अधिक होना है। ‘बढ़ जाते हैं’ जानबूझकर यह खुला रखता है कि धर्मियों की संख्या बढ़ती है, वे अधिक सामने आते हैं, या उनका सार्वजनिक प्रभाव बढ़ता है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: यह धर्मी व्यक्तियों के लिए प्रयुक्त substantival plural है। ‘धर्मी’ हिन्दी बाइबलीय और नीतिवचन-संबंधी भाषा में संक्षिप्त, प्रतिष्ठित और सामान्यतः बोधगम्य है।
theological_decisions:
- issue: दुष्टों के उठने और धर्मियों के बढ़ने का आशय
  choice: भाषा को सामाजिक, संख्यात्मक और सार्वजनिक प्रभाव—तीनों संभावनाओं के लिए खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से दुष्ट शासकों के सत्ता में आने और धर्मियों की जनसंख्या बढ़ने के रूप में कहना।
  rationale: मूल पद में शासन, जनसंख्या या सार्वजनिक दृश्यता में से किसी एक अर्थ को स्पष्ट रूप से निर्दिष्ट नहीं किया गया; अतः अनुवाद उस तनाव और व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, संतुलित और गरिमापूर्ण नीतिवचन-शैली रखी गई है। दोनों खंडों की समयसूचक और विरोधी समानांतर रचना ‘जब... तब...; पर जब... तब...’ से सुरक्षित है।
