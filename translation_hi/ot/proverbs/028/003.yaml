  yaml_path: translation/ot/proverbs/028/003.yaml
  text: A poor man who oppresses the lowly is like a sweeping rain that leaves no food[a].
translation:
  language: hi
  text: 'जो गरीब मनुष्य दीनों पर अत्याचार करता है,

    वह ऐसी वर्षा के समान है जो बहा ले जाती है और रोटी नहीं बचने देती[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और रोटी नहीं है।” यहाँ “रोटी” से सामान्यतः भोजन या जीविका का आशय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר רָשׁ
  choice: गरीब मनुष्य
  rationale: גֶּבֶר यहाँ कहावत में एक प्रतिनिधि पुरुष को और רָשׁ उसकी निर्धनता को दर्शाता है। ‘गरीब मनुष्य’ मूल के व्याकरणिक पुल्लिंग और आर्थिक अभाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֹשֵׁק
  choice: अत्याचार करता है
  rationale: עשק का कृदन्त निरंतर शोषण, उत्पीड़न या हक मारने का भाव रखता है। ‘अत्याचार करता है’ सामान्य पाठक के लिए स्पष्ट है और सक्रिय क्रिया को बनाए रखता है।
- source_word: דַּלִּים
  choice: दीनों
  rationale: דַּלִּים निर्धन, निर्बल या निम्न दशा के लोगों को सूचित करता है। ‘दीनों’ पहले प्रयुक्त רָשׁ (‘गरीब’) से शब्दगत भेद रखते हुए उनकी असहाय और निम्न स्थिति व्यक्त करता है।
- source_word: מָטָר סֹחֵף
  choice: मूसलाधार वर्षा ... जो सब कुछ बहा ले जाए
  rationale: מָטָר का अर्थ वर्षा है और סֹחֵף बहा ले जाने वाली विनाशकारी शक्ति बताता है। हिन्दी में ‘मूसलाधार वर्षा’ तीव्रता व्यक्त करती है, जबकि ‘जो सब कुछ बहा ले जाए’ कृदन्त की क्रिया और उसके विनाशकारी प्रभाव को स्पष्ट करता है।
- source_word: וְאֵין לָחֶם
  choice: और रोटी न बचे
  rationale: यह मूल वाक्यांश के ‘और रोटी नहीं है’ के निकट रहते हुए वर्षा के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है। ‘रोटी’ לֶחֶם की ठोस छवि बचाती है और प्रसंग में भोजन या जीविका का भी संकेत देती है।
