base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/013.yaml
  text: Whoever covers his transgressions will not prosper[b][a], but he who confesses and forsakes them will be shown mercy.
translation:
  language: hi
  text: जो अपने अपराधों को छिपाता है[a], वह सफल नहीं होगा; पर जो अपने अपराधों को स्वीकार करता और उन्हें छोड़ देता है, उस पर दया की जाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘ढकता है’; अर्थात अपने अपराधों को छिपाता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में क्रिया निष्क्रिय है और दया करने वाले का नाम नहीं दिया गया है। अन्य अनुवाद: ‘वह दया पाएगा।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַסֶּה
  choice: छिपाता है
  rationale: כסה का अर्थ ढकना या छिपाना है। इस संदर्भ में अपने अपराधों को दूसरों से छिपाने का नैतिक भाव है; हिंदी में ‘छिपाता है’ स्वाभाविक और स्पष्ट है, जबकि ‘ढकता है’ अधिक शाब्दिक पर कम मुहावरेदार होता।
- source_word: פְשָׁעָיו
  choice: अपने अपराधों को
  rationale: פשע सामान्य भूल से अधिक गंभीर उल्लंघन या विद्रोही अपराध को सूचित करता है। ‘अपराध’ आधुनिक हिंदी में इस नैतिक गंभीरता को सहज रूप से व्यक्त करता है।
- source_word: יַצְלִיחַ
  choice: सफल नहीं होगा
  rationale: צלח के हिफ़ील रूप का अर्थ सफल या समृद्ध होना है। ‘सफल नहीं होगा’ व्यापक और स्वाभाविक है तथा इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: וּמוֹדֶה
  choice: मान लेता
  rationale: ידה यहाँ अपराध स्वीकार करने के अर्थ में है। ‘मान लेता’ साधारण आधुनिक हिंदी में स्वीकारोक्ति को स्पष्ट करता है; ‘अंगीकार करता’ अपेक्षाकृत धार्मिक और औपचारिक है।
- source_word: וְעֹזֵב
  choice: छोड़ देता है
  rationale: עזב का मूल अर्थ छोड़ना या त्यागना है। अपराधों के संदर्भ में ‘छोड़ देता है’ उनसे फिर जाने का नैतिक भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְרֻחָם
  choice: उस पर दया की जाएगी
  rationale: רחם का यह निष्क्रिय रूप दया या करुणा पाए जाने को व्यक्त करता है और दया करने वाले को स्पष्ट नहीं करता। हिंदी निष्क्रिय रचना मूल की इस विशेषता को सुरक्षित रखती है।
- source_word: implicit object after וּמוֹדֶה וְעֹזֵב
  choice: उन्हें
  rationale: इब्रानी में कर्म पहले आए ‘अपराधों’ से समझा जाता है। हिंदी में ‘उन्हें’ जोड़ने से दोनों क्रियाओं का संबंध स्पष्ट और वाक्य सहज बनता है।
- source_word: masculine singular participles/pronouns
  choice: जो ... वह / जो ... उस पर
  rationale: इब्रानी पुल्लिंग एकवचन यहाँ सामान्य प्रतिनिधिक अर्थ रखता है। हिंदी की संबंधवाचक रचना मूल का एकवचन बनाए रखते हुए स्त्री-पुरुष दोनों के लिए स्वाभाविक रूप से लागू होती है।
theological_decisions:
- issue: दया करने वाले का नाम निष्क्रिय क्रिया में व्यक्त नहीं है
  choice: ‘उस पर दया की जाएगी’ कहकर कर्ता को अप्रकट रखा गया
  alternative: ‘परमेश्वर उस पर दया करेगा’ या ‘वह दया पाएगा’
  rationale: नीतिवचन के धार्मिक संदर्भ में परमेश्वर की दया निहित हो सकती है, पर इब्रानी पाठ कर्ता का नाम नहीं लेता। निष्क्रिय अनुवाद इस अस्पष्टता और धार्मिक संकेत—दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपराध’, ‘मान लेता’ और ‘छोड़ देता है’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य की संतुलित नीतिवचनात्मक संरचना और मूल का निष्क्रिय अंतिम खंड सुरक्षित रखा गया है।
