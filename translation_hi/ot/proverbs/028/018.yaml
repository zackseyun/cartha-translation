  edition: WLC
  text: הוֹלֵ֣ךְ תָּ֭מִים יִוָּשֵׁ֑עַ וְ/נֶעְקַ֥שׁ דְּ֝רָכַ֗יִם יִפּ֥וֹל בְּ/אֶחָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/018.yaml
  text: Whoever walks in integrity will be delivered[b][a], but one crooked in his ways will fall at once.
translation:
  language: hi
  text: जो खराई से चलता है, वह बचा लिया जाएगा[a], पर जो अपने मार्गों में टेढ़ा है, वह एकाएक गिर पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार पाएगा’ अथवा ‘सुरक्षित रखा जाएगा।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘एक में’; संभवतः अर्थ ‘अचानक’ या ‘एक ही बार में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: चलता है
  rationale: नीतिवचन में यह क्रिया प्रायः जीवन-आचरण का रूपक है; ‘चलता है’ मूल बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תָּמִים
  choice: खराई से
  rationale: यहाँ शब्द नैतिक अखंडता और निष्कपट आचरण का बोध कराता है। ‘खराई’ पापरहित सिद्धता का अनावश्यक अर्थ दिए बिना इस भाव को व्यक्त करती है।
- source_word: יִוָּשֵׁעַ
  choice: बचा लिया जाएगा
  rationale: ישׁע के निफ़अल रूप का कर्मवाच्य भाव रखते हुए यह संकट से बचाए जाने अथवा सुरक्षित रखे जाने का व्यापक अर्थ देता है; इसे केवल पारलौकिक उद्धार तक सीमित नहीं करता।
- source_word: נֶעְקַשׁ
  choice: टेढ़ा है
  rationale: यह नैतिक विकृति या कुटिलता को मार्ग के बिंब के साथ व्यक्त करता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: דְּרָכַיִם
  choice: अपने मार्गों में
  rationale: द्विवचन/बहुवचन रूप को रखते हुए ‘मार्ग’ जीवन के तौर-तरीकों और आचरण का परिचित रूपक है।
- source_word: יִפּוֹל
  choice: गिर पड़ेगा
  rationale: यह मूल ‘गिरने’ के ठोस बिंब को बनाए रखता है, जिसमें प्रसंगानुसार पतन या विनाश का संकेत निहित रह सकता है।
- source_word: בְּאֶחָת
  choice: एकाएक
  rationale: शाब्दिक रूप ‘एक में’ है, पर यहाँ इसका संभावित क्रियाविशेषणीय अर्थ ‘अचानक’ या ‘एक ही बार में’ है। ‘एकाएक’ स्वाभाविक हिन्दी में इस अर्थ को व्यक्त करता है; अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יִוָּשֵׁעַ का आशय
  choice: सामान्य/सांसारिक संकट से ‘बचा लिया जाएगा’
  alternative: ‘उद्धार पाएगा’ या ‘सुरक्षित रखा जाएगा’
  rationale: नीतिवचन के ज्ञान-साहित्यिक संदर्भ में यह शब्द व्यावहारिक रक्षा या छुटकारे को सूचित कर सकता है। मुख्य पाठ किसी विशिष्ट उद्धार-सिद्धांत को आरोपित नहीं करता, जबकि पाद-टिप्पणी व्यापक संभावनाएँ बनाए रखती है।
- issue: पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: हिन्दी में सर्वसामान्य एकवचन ‘जो ... वह’
  alternative: बहुवचन अथवा स्पष्ट लिंग-विशिष्ट पुनर्गठन
  rationale: इब्रानी का व्याकरणिक पुल्लिंग एकवचन प्रतिनिधिक है। ‘जो ... वह’ आधुनिक हिन्दी में स्वाभाविक रूप से समावेशी है और वचन-संरचना भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कहावत-जैसी संक्षिप्त शैली। ‘खराई’, ‘मार्ग’ और ‘टेढ़ा’ नैतिक आचरण तथा जीवन-पथ के मूल रूपकों को स्वाभाविक ढंग से बनाए रखते हैं।
