  to: 'धनी व्यक्ति अपनी ही दृष्टि में बुद्धिमान होता है,

    पर समझदार गरीब व्यक्ति उसकी जाँच करता है।[a]'
  rationale: संशोधन आधुनिक हिन्दी की सहजता बढ़ाता है और अंतिम क्रिया में मूल इब्रानी के अपूर्ण, जाँच-पड़ताल वाले भाव को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी क्रिया के बाद रखा गया है और वैकल्पिक अर्थों में स्रोत की अर्थ-सीमा सुरक्षित रखी गई है।
