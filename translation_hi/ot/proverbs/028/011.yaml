base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/011.yaml
  text: A rich man is wise in his own eyes[a], but a poor man who has understanding searches him out.
translation:
  language: hi
  text: 'धनी व्यक्ति अपनी ही दृष्टि में बुद्धिमान होता है,

    पर समझदार गरीब व्यक्ति उसकी जाँच करता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे खोजता है,” “उसकी छानबीन करता है,” अथवा “उसे परखता है।” इब्रानी क्रिया में खोजने, जाँचने, या किसी व्यक्ति के वास्तविक चरित्र को गहराई से परखने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विधेय विशेषण है। ‘अपनी ही दृष्टि में’ उसके आत्म-मूल्यांकन का भाव स्पष्ट कर देता है, इसलिए अर्थ को ‘अपने को बुद्धिमान समझता है’ के रूप में विस्तार नहीं दिया गया।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: यह अपने विषय में व्यक्ति की धारणा या मूल्यांकन बताने वाला इब्रानी मुहावरा है। ‘ही’ आत्म-केंद्रित मूल्यांकन के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ עָשִׁיר
  choice: धनवान मनुष्य
  rationale: संज्ञा और विशेषण का यह मेल सीधे एक धनवान पुरुष/मनुष्य को सूचित करता है। ‘धनवान मनुष्य’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְדַל
  choice: परन्तु … निर्धन
  rationale: वाव का मूल अर्थ ‘और’ है, किन्तु दोनों पंक्तियों के विरोध के कारण यहाँ ‘परन्तु’ उपयुक्त है। דַל कम साधनों वाले, निर्धन व्यक्ति को दर्शाता है।
- source_word: מֵבִין
  choice: समझदार
  rationale: בין से बना यह कृदन्त समझ-बूझ और विवेक रखने वाले व्यक्ति को दर्शाता है। ‘समझदार’ निर्धन व्यक्ति की विशेषता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַחְקְרֶנּוּ
  choice: उसे जाँच-परख लेता है
  rationale: חקר खोजने, छानबीन करने या गहराई से परखने का अर्थ दे सकता है; प्रत्यय का अर्थ ‘उसे’ है। ‘जाँच-परख लेता है’ धनवान के वास्तविक स्वरूप या दावे को भेदकर जान लेने की संभावना बनाए रखता है, बिना उसे अत्यधिक स्पष्ट किए।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और सूक्ति की दो विरोधी पंक्तियों को बनाए रखती है। ‘अपनी ही दृष्टि में’ आत्म-मुग्ध मूल्यांकन को तथा ‘जाँच-परख लेता है’ विवेकी निर्धन की भेदक समझ को स्वाभाविक, गरिमापूर्ण ढंग से व्यक्त करता है। पाद-टिप्पणी चिह्न संबंधित इब्रानी क्रिया के बाद रखा गया है।
