review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly represents the two contrasting cola: the wealthy man is wise in his own estimation, while the poor person with discernment examines him. The pronominal object in ‘उसे’ is preserved. However, ‘जाँच-परख लेता है’ adds a completed/resultative nuance not explicit in the Hebrew imperfect; a non-resultative expression more closely preserves the source’s open-ended investigative sense.'
  naturalness: ‘धनवान मनुष्य’ and especially the substantivized phrase ‘समझदार निर्धन’ are somewhat formal and less idiomatic in modern standard Hindi. ‘धनी व्यक्ति’ and ‘समझदार गरीब व्यक्ति’ are natural while retaining the proverb’s dignified register.
  terminology: ‘बुद्धिमान’ aptly renders חָכָם, and ‘अपनी ही दृष्टि में’ naturally conveys the Hebrew idiom. ‘जाँच करता है’ faithfully covers חקר without prematurely specifying that the poor person exposes the wealthy person’s true character. The footnote retains appropriate lexical possibilities, but its alternatives should avoid the resultative ‘जान लेता है.’
  issues:
  - severity: low
    issue: Resultative wording in the final verb
    rationale: ‘जाँच-परख लेता है’ can imply that the investigation has been completed and its result obtained. יַחְקְרֶנּוּ more directly denotes investigating/examining him.
  - severity: low
    issue: Slightly unnatural substantivized adjective
    rationale: ‘समझदार निर्धन’ is intelligible, but ‘समझदार गरीब व्यक्ति’ is more idiomatic modern Hindi and makes the participial modifier’s referent explicit.
  revised_text: 'धनी व्यक्ति अपनी ही दृष्टि में बुद्धिमान होता है,

    पर समझदार गरीब व्यक्ति उसकी जाँच करता है।[a]'
  revised_footnotes:
