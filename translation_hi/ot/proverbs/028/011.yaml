    text: या “उसे खोजता है,” “उसकी छानबीन करता है,” अथवा “उसे परखता है।” इब्रानी क्रिया में खोजने, जाँचने, या किसी व्यक्ति के वास्तविक चरित्र को गहराई से परखने का भाव हो सकता है।
