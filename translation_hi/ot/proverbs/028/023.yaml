  edition: WLC
  text: מ֘וֹכִ֤יחַ אָדָ֣ם אַ֭חֲרַי חֵ֣ן יִמְצָ֑א מִֽ/מַּחֲלִ֥יק לָשֽׁוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/023.yaml
  text: Whoever rebukes a man will afterward find favor[a], more than one who flatters with the tongue.
translation:
  language: hi
  text: जो किसी व्यक्ति को फटकारता है, वह बाद में अपनी जीभ से चिकनी-चुपड़ी बातें करनेवाले की अपेक्षा अधिक कृपा पाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो किसी व्यक्ति को फटकारता है, वह बाद में जीभ से चापलूसी करनेवाले से अधिक कृपा पाएगा।”
    reason: तुलनात्मक वाक्यांश का वैकल्पिक, अधिक संक्षिप्त हिन्दी रूप; तुलना फटकारनेवाले और चापलूसी करनेवाले के बीच ही रहती है।
lexical_decisions:
- source_word: מוֹכִיחַ
  choice: फटकारता है
  rationale: हिफ़ील कृदन्त यहाँ गलती बताने और सुधारने के उद्देश्य से डाँटने का भाव रखता है। ‘फटकारता है’ चापलूसी के साथ इसके तीखे विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָדָם
  choice: किसी व्यक्ति को
  rationale: यहाँ शब्द किसी एक मनुष्य को कर्म के रूप में दर्शाता है। हिन्दी में ‘किसी व्यक्ति को’ लिंग की अनावश्यक विशिष्टता से बचते हुए अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: אַחֲרַי
  choice: बाद में
  rationale: 'सन्दर्भ में इसका क्रियाविशेषणीय अर्थ ‘इसके बाद/अन्ततः’ है: फटकार का अच्छा परिणाम तत्काल नहीं, बाद में सामने आता है।'
- source_word: חֵן יִמְצָא
  choice: कृपा पाएगा
  rationale: חֵן स्वीकृति, सद्भाव या अनुकूल दृष्टि को व्यक्त करता है और יִמְצָא का शाब्दिक भाव ‘पाएगा’ है। ‘कृपा पाएगा’ कथन की व्यापकता बनाए रखता है और कृपा किससे मिलेगी, यह अनिर्दिष्ट रहने देता है।
- source_word: מִמַּחֲלִיק לָשׁוֹן
  choice: उस व्यक्ति से अधिक ... जो अपनी जीभ से चिकनी-चुपड़ी बातें करता है
  rationale: तुलनात्मक מִן को ‘से अधिक’ से व्यक्त किया गया है। מחליק का मूल चित्र ‘चिकना करने’ का है, जो यहाँ चापलूसी बताता है; ‘जीभ’ और ‘चिकनी-चुपड़ी बातें’ दोनों रखकर हिब्रू बिम्ब को स्वाभाविक हिन्दी में संप्रेषित किया गया है।
