  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपनी जीभ से चिकनी-चुपड़ी बातें’ हिब्रू की शारीरिक उपमा को बचाते हुए हिन्दी का परिचित मुहावरा अपनाता है।
