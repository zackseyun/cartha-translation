source:
  edition: WLC
  text: מַשְׁגֶּ֤ה יְשָׁרִ֨ים בְּ/דֶ֥רֶךְ רָ֗ע בִּ/שְׁחוּת֥/וֹ הֽוּא יִפּ֑וֹל וּ֝/תְמִימִ֗ים יִנְחֲלוּ טֽוֹב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/010.yaml
  text: Whoever leads the upright astray in an evil way will himself fall into his own pit[a], but the blameless will inherit good.
translation:
  language: hi
  text: जो सीधे-सच्चे लोगों को बुरे मार्ग पर भटकाता है, वह स्वयं अपने ही गड्ढे में गिरेगा[a], पर निष्कलंक लोग भलाई विरासत में पाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ही विनाश में गिरेगा” अथवा “अपनी ही बरबादी में गिरेगा।” इब्रानी शब्द का अर्थ गड्ढा या विनाश/बरबादी हो सकता है; मुख्य पाठ नीतिवचन के जाल-जैसे बिंब को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁגֶּה
  choice: जो ... भटकाता है
  rationale: हिफ़ील कृदंत किसी को भूल या भटकाव में डालने का अर्थ देता है; ‘जो ... भटकाता है’ सामान्य और सार्वकालिक कथन को स्वाभाविक हिन्दी में रखता है।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोगों
  rationale: यह शब्द नैतिक रूप से सीधे और ईमानदार लोगों को सूचित करता है; ‘सीधे-सच्चे’ आधुनिक हिन्दी में इस नैतिक भाव को स्पष्ट रखता है।
- source_word: בְּדֶרֶךְ רָע
  choice: बुरे मार्ग पर
  rationale: ‘मार्ग’ आचरण के रूपक को बनाए रखता है; उपसर्ग בְּ के अनुरूप ‘पर’ स्वाभाविक है और अनावश्यक रूप से ‘में ले जाने’ की गति नहीं जोड़ता।
- source_word: בִּשְׁחוּתוֹ
  choice: अपने ही गड्ढे में
  rationale: संज्ञा ‘गड्ढा’ तथा ‘विनाश/बरबादी’ दोनों अर्थ दे सकती है। मुख्य पाठ में ‘गड्ढा’ रखने से अपने ही बिछाए जाल में फँसने का ठोस नीतिवचनात्मक बिंब सुरक्षित रहता है; प्रत्यय और बल को ‘अपने ही’ व्यक्त करता है।
- source_word: הוּא יִפּוֹל
  choice: वह ... गिरेगा
  rationale: स्पष्ट सर्वनाम के विरोधात्मक बल को ‘वह अपने ही’ से व्यक्त किया गया है।
- source_word: וּתְמִימִים
  choice: पर निर्दोष लोग
  rationale: תמים यहाँ नैतिक खराई और दोषरहित चाल का द्योतक है। ‘निर्दोष’ सामान्य पाठक के लिए स्पष्ट है और ‘पर’ दोनों परिणामों का विरोध प्रकट करता है।
- source_word: יִנְחֲלוּ
  choice: अधिकारी होंगे
  rationale: नחל का मूल भाव विरासत में पाना या स्थायी अधिकार प्राप्त करना है। ‘अधिकारी होंगे’ सहज हिन्दी में अधिकार/प्राप्ति का भाव देता है, यद्यपि अधिक शाब्दिक विकल्प ‘विरासत में पाएँगे’ है।
- source_word: טוֹב
  choice: भलाई
  rationale: मूल शब्द व्यापक और अनिर्दिष्ट है। ‘भलाई’ इस व्यापकता को बनाए रखती है और इसे केवल भौतिक समृद्धि तक सीमित नहीं करती।
theological_decisions:
- issue: בִּשְׁחוּתוֹ में नैतिक परिणाम का बिंब
  choice: मुख्य पाठ में ठोस रूपक ‘अपने ही गड्ढे में’ रखा गया
  alternative: अपने ही विनाश में / अपनी ही बरबादी में
  rationale: नीतिवचन न्यायोचित प्रतिफल दिखाता है, पर न्याय के ढंग को किसी संकीर्ण धर्मसैद्धांतिक अर्थ में निर्धारित नहीं करता। गड्ढे का बिंब मूल काव्यात्मक तनाव सुरक्षित रखता है।
- issue: יִנְחֲלוּ טוֹב का प्रतिफल
  choice: भलाई के अधिकारी होंगे
  alternative: भलाई विरासत में पाएँगे / अच्छा फल पाएँगे
  rationale: ‘भलाई’ को खुला रखा गया है ताकि इसे केवल धन-संपत्ति, सांसारिक सफलता या किसी विशिष्ट धर्मसैद्धांतिक प्रतिफल तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और नीतिवचन की संक्षिप्त विरोधात्मक शैली के अनुरूप है। ‘सीधे-सच्चे’ सामान्य पाठकों के लिए नैतिक सीधाई स्पष्ट करता है, और ‘गड्ढा’ मूल ठोस रूपक सुरक्षित रखता है।
