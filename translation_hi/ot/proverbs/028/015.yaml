  text: Like a roaring lion and a charging bear is a wicked ruler over a poor people[a].
translation:
  language: hi
  text: गरीब प्रजा पर शासन करने वाला दुष्ट शासक गरजते हुए सिंह और झपटते हुए भालू[a] के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूखा भालू” अथवा “तेज़ी से लपकता हुआ भालू”; भालू के लिए प्रयुक्त इब्रानी कृदंत आक्रामक खतरे का भाव देता है और उसके हिंसक वेग या शिकारी भूख में से किसी पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרִי
  choice: सिंह
  rationale: यह सामान्य रूप से सिंह को दर्शाता है; इस उपमा में ‘सिंह’ स्वाभाविक और सटीक है।
- source_word: נֹהֵם
  choice: गरजते हुए
  rationale: यह सिंह की धमकी भरी आवाज़ को व्यक्त करता है और वर्तमान कृदंत की सजीवता बनाए रखता है।
- source_word: דֹב
  choice: भालू
  rationale: यह पशु के लिए सीधा और मानक हिन्दी पर्याय है।
- source_word: שׁוֹקֵק
  choice: झपटते हुए
  rationale: यह आक्रामक ढंग से तेजी से बढ़ने या टूट पड़ने का भाव देता है। मूल शब्द में हिंसक गति और शिकारी भूख—दोनों की छाया संभव होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: מֹשֵׁל
  choice: शासन करने वाला…शासक
  rationale: मूल कृदंत किसी अधिकार चलाने वाले व्यक्ति को दर्शाता है। हिन्दी में यह संरचना उसके वास्तविक शासन और पद, दोनों को स्पष्ट करती है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह शासक के नैतिक चरित्र पर कठोर नकारात्मक निर्णय को बनाए रखता है और नीतिवचन की शब्दावली के अनुकूल है।
- source_word: עַל
  choice: पर
  rationale: यहाँ यह प्रजा पर शासनाधिकार को दर्शाता है, न कि केवल उसके विरुद्ध शत्रुता को।
- source_word: עַם
  choice: प्रजा
  rationale: संदर्भ किसी शासक के अधीन जनसमुदाय का है; ‘प्रजा’ हिन्दी में इस शासकीय संबंध को स्वाभाविक रूप से व्यक्त करती है।
- source_word: דָּל
  choice: गरीब
  rationale: यह आर्थिक अभाव और उससे जुड़ी सामाजिक निर्बलता का स्पष्ट सामान्य अर्थ देता है।
