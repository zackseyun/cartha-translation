base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/017.yaml
  text: A man burdened with the blood of a life will flee as far as the pit[b][a]; let no one support him.
translation:
  language: hi
  text: किसी व्यक्ति के रक्त से दबा हुआ मनुष्य गड्ढे तक भागेगा[b][a]; कोई उसे सहारा न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक प्राण के रक्त से दबा हुआ मनुष्य।” यहाँ किसी का प्राण लेने से लगे रक्त-दोष का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या “कब्र तक।” इब्रानी “गड्ढा” घातक अंत या कब्र का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक व्यक्ति का प्रतिनिधिक एकवचन है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और मूल के मानवीय संदर्भ को बनाए रखता है।
- source_word: עָשֻׁק
  choice: दबा हुआ
  rationale: शब्द का मूल अर्थ उत्पीड़ित या दबाया हुआ होना है। रक्त के साथ यह हत्या से उत्पन्न भारी दायित्व या रक्त-दोष के नीचे दबे होने का भाव देता है।
- source_word: בְּדַם נָפֶשׁ
  choice: किसी के प्राण के रक्त से
  rationale: यह मूल की ठोस ‘प्राण/जीवन के रक्त’ वाली छवि को रखता है। प्रसंग में इसका आशय किसी का प्राण लेने से लगे रक्त-दोष से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: עַד בּוֹר
  choice: गड्ढे तक
  rationale: בּוֹר का सामान्य अर्थ गड्ढा है, पर यह कब्र या घातक अंत की ओर भी संकेत कर सकता है। मुख्य पाठ में मूल बिंब सुरक्षित रखा गया है।
- source_word: יָנוּס
  choice: भागता रहेगा
  rationale: अपूर्ण क्रिया यहाँ लगातार या अनिवार्य रूप से भागते जाने का भाव दे सकती है; यह हिन्दी में उस गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַל יִתְמְכוּ בוֹ
  choice: कोई उसे सहारा न दे
  rationale: अनिर्दिष्ट बहुवचन निषेध को हिन्दी में ‘कोई ... न दे’ स्वाभाविक रूप से व्यक्त करता है। ‘सहारा’ सहायता देने और संभालने, दोनों भावों को समेटता है।
theological_decisions:
- issue: בְּדַם נָפֶשׁ में रक्त-दोष का आशय
  choice: मुख्य पाठ में रक्त की ठोस छवि रखी गई और पादटिप्पणी में रक्त-दोष का आशय बताया गया।
  alternative: ‘हत्या के रक्त-दोष से दबा हुआ’
  rationale: स्पष्ट व्याख्यात्मक अनुवाद अर्थ को तुरंत बता देता, पर मूल की असामान्य और तनावपूर्ण अभिव्यक्ति को पूरी तरह सुलझा देता। वर्तमान रूप छवि और आशय दोनों को उपलब्ध रखता है।
- issue: בּוֹר का अभिप्राय
  choice: गड्ढा
  alternative: कब्र
  rationale: मूल शब्द दोनों अर्थ-क्षेत्रों को छू सकता है। ‘गड्ढा’ शाब्दिक बिंब को सुरक्षित रखता है, जबकि पादटिप्पणी कब्र या घातक अंत की संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, नीतिवचन-संगत और गरिमापूर्ण शैली रखी गई है। मूल की रक्त और गड्ढे की ठोस छवियाँ बनाए रखते हुए कठिन मुहावरों को पादटिप्पणियों में स्पष्ट किया गया है।
