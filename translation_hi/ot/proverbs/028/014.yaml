  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַשְׁרֵ֣י אָ֭דָם מְפַחֵ֣ד תָּמִ֑יד וּ/מַקְשֶׁ֥ה לִ֝בּ֗/וֹ יִפּ֥וֹל בְּ/רָעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/014.yaml
  text: Blessed is the man who is always fearful[b][a], but whoever hardens his heart will fall into calamity.
translation:
  language: hi
  text: धन्य है वह मनुष्य जो सदा डरता रहता है[a], पर जो अपना हृदय कठोर करता है, वह विपत्ति में पड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो निरंतर भय मानता है।” हिब्रू पाठ यह स्पष्ट नहीं करता कि वह किसका भय मानता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बुराई/संकट में पड़ेगा।” हिब्रू शब्द का अर्थ बुराई, हानि, संकट या विपत्ति हो सकता है; यहाँ संभवतः विनाशकारी संकट अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह हिब्रू आशीर्वचन-रूप किसी व्यक्ति की वांछनीय और अनुगृहीत दशा बताता है; ‘धन्य है’ नीतिवचन की गरिमापूर्ण शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָדָם
  choice: वह मनुष्य
  rationale: एकवचन संज्ञा यहाँ नीतिवचन की शैली में सामान्य प्रतिनिधि अर्थ रखती है। ‘मनुष्य’ आधुनिक हिन्दी में सहज है और मूल के सामान्य मानवीय संदर्भ को बनाए रखता है।
- source_word: מְפַחֵד תָּמִיד
  choice: जो सदा डरता रहता है
  rationale: פחד का मूल अर्थ डरना या भय मानना है और תָּמִיד निरंतरता बताता है। यह अनुवाद भय की शाब्दिक शक्ति और उसके अनुल्लिखित विषय—दोनों को सुरक्षित रखता है; ‘सावधान रहता है’ अर्थ को अनावश्यक रूप से व्याख्यायित कर देता।
- source_word: וּמַקְשֶׁה לִבּוֹ
  choice: पर जो अपना हृदय कठोर करता है
  rationale: हिफ़ील रूप ‘कठोर करना’ व्यक्त करता है। ‘हृदय कठोर करना’ हिन्दी में स्पष्ट और परिचित अभिव्यक्ति है तथा नैतिक हठ की भावना बनाए रखती है।
- source_word: יִפּוֹל
  choice: पड़ेगा
  rationale: यहाँ अपूर्ण क्रिया नीतिवचनात्मक परिणाम व्यक्त करती है; ‘पड़ेगा’ हिन्दी में स्वाभाविक भविष्यपरक निष्कर्ष है।
- source_word: בְּרָעָה
  choice: विपत्ति में
  rationale: רָעָה का अर्थ बुराई, हानि, संकट या विपत्ति हो सकता है। इस संदर्भ में कठोर हृदय के विनाशकारी परिणाम के लिए ‘विपत्ति में’ स्वाभाविक है, जबकि पादटिप्पणी अर्थ-सीमा को खुला रखती है।
theological_decisions:
- issue: पहले खंड में प्रशंसनीय भय का स्वरूप और विषय
  choice: ‘जो सदा डरता रहता है’—भय का कोई विषय जोड़े बिना
  alternative: ‘जो सदा यहोवा का भय मानता है’ अथवा ‘जो सदा सावधान रहता है’
  rationale: हिब्रू पाठ भय का स्पष्ट विषय नहीं बताता। ‘यहोवा’ जोड़ना प्रसंगानुकूल संभावित व्याख्या तो है, पर पाठ में अनुल्लिखित है; ‘सावधान’ कहना פחד की भय-संबंधी शाब्दिक शक्ति को कम कर देता। मुख्य पाठ मूल की अस्पष्टता और ज्ञान-साहित्य की नैतिक-धार्मिक गूँज दोनों सुरक्षित रखता है।
- issue: רָעָה को नैतिक बुराई या आने वाली विपत्ति के रूप में समझना
  choice: मुख्य पाठ में ‘विपत्ति’
  alternative: ‘बुराई’ अथवा ‘संकट’
  rationale: दूसरा खंड कठोर हृदय के परिणाम की बात करता है, इसलिए विनाशकारी संकट का अर्थ अधिक संभावित है। फिर भी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में दी गई है, ताकि नैतिक ‘बुराई’ की संभावना पूरी तरह दब न जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतरता को ‘धन्य है... पर... पड़ेगा’ से उभारा गया है। ‘हृदय कठोर करना’ पारंपरिक किंतु आज भी सहज बोधगम्य बाइबलीय मुहावरा है।
