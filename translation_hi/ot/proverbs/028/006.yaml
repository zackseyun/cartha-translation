source:
  edition: WLC
  text: טֽוֹב רָ֭שׁ הוֹלֵ֣ךְ בְּ/תֻמּ֑/וֹ מֵ/עִקֵּ֥שׁ דְּ֝רָכַ֗יִם וְ/ה֣וּא עָשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/006.yaml
  text: Better is a poor man who walks in his integrity than one who is crooked in his ways[a], though he is rich.
translation:
  language: hi
  text: जो अपनी खराई में चलता है, वह निर्धन उस व्यक्ति से अच्छा है जिसके मार्ग टेढ़े हैं, भले ही वह धनी हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “अपनी खराई में चलनेवाला निर्धन, टेढ़े मार्गों वाले व्यक्ति से अच्छा है—और वह धनी है।” इब्रानी के अंतिम वाक्यांश का शाब्दिक अर्थ “और वह धनी है” है; यहाँ “वह” टेढ़े मार्गों वाले व्यक्ति को सूचित करता है।'
    reason: शाब्दिक संरचना और अंतिम सर्वनाम के संदर्भ को स्पष्ट करना
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: पद के आरम्भ में טוֹב तुलनात्मक अर्थ देता है; ‘उस व्यक्ति से अच्छा है’ हिन्दी में इस नीतिवचन की तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רָשׁ
  choice: निर्धन
  rationale: רָשׁ किसी गरीब या अभावग्रस्त पुरुष को सूचित करता है। ‘निर्धन’ संक्षिप्त, गरिमापूर्ण और प्रतिनिधिक एकवचन के अनुकूल है।
- source_word: הוֹלֵךְ
  choice: चलनेवाला
  rationale: הלך का मूल अर्थ ‘चलना’ है और ज्ञान-साहित्य में यह जीवन-आचरण का रूपक भी है; हिन्दी में ‘चलनेवाला’ दोनों स्तर बनाए रखता है।
- source_word: בְּתֻמּוֹ
  choice: अपनी खराई में
  rationale: תֹּם/תֻּם संपूर्णता, निष्कपटता और नैतिक खराई का भाव रखता है। ‘खराई’ पापरहित होने का अतिशयोक्त दावा किए बिना आंतरिक ईमानदारी व्यक्त करती है।
- source_word: מֵעִקֵּשׁ
  choice: उस व्यक्ति से ... टेढ़ी है
  rationale: तुलनात्मक מִן दूसरे पक्ष को प्रस्तुत करता है और עִקֵּשׁ नैतिक टेढ़ेपन को दर्शाता है। ‘टेढ़ी’ हिन्दी में ज्ञान-साहित्य की सीधी/टेढ़ी चाल की छवि बनाए रखती है।
- source_word: דְּרָכַיִם
  choice: चाल
  rationale: शाब्दिक रूप से ‘मार्गों’ का संकेत देने वाला यह शब्द यहाँ जीवन-व्यवहार को सूचित करता है। ‘चाल’ चलने के रूपक और नैतिक आचरण, दोनों को स्वाभाविक हिन्दी में समेटती है।
- source_word: וְהוּא עָשִׁיר
  choice: भले ही वह धनी हो
  rationale: मूल में शाब्दिक रूप से ‘और वह धनी है’ है और सर्वनाम टेढ़ी चाल वाले व्यक्ति की ओर लौटता है। ‘भले ही’ तुलना में निहित रियायती विरोध को स्पष्ट करता है, जबकि पादटिप्पणी मूल संरचना बताती है।
theological_decisions: []
