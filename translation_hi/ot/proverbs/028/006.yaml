  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘खराई’, ‘चाल’ और ‘धनी’ गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य हैं।
