  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֥ף רֵ֝קִ֗ים יִֽשְׂבַּֽע רִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/019.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues worthless things will have his fill of poverty.
translation:
  language: hi
  text: 'जो अपनी भूमि पर मेहनत करता है, वह भरपेट रोटी पाएगा,

    पर जो व्यर्थ चीज़ों के पीछे भागता है[a], वह गरीबी से भर जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘खाली चीज़ें’ भी हो सकता है; कुछ लोग इसे निकम्मे या व्यर्थ लोगों के लिए प्रयुक्त मानते हैं।
    reason: רֵקִים के संदर्भगत अर्थ में चीज़ों और लोगों के बीच वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: עֹבֵד
  choice: मेहनत करता है
  rationale: यहाँ क्रिया भूमि पर परिश्रम करके उसे उपजाऊ बनाने के अर्थ में है। ‘मेहनत करता है’ सामान्य पाठक के लिए स्वाभाविक है और केवल जुताई तक अर्थ को सीमित नहीं करता।
- source_word: אַדְמָתוֹ
  choice: अपनी भूमि
  rationale: अדמה का अर्थ भूमि, धरती या मिट्टी हो सकता है; कृषि-संदर्भ में ‘अपनी भूमि’ सहज और सटीक है।
- source_word: יִשְׂבַּע לָחֶם
  choice: भरपेट रोटी पाएगा
  rationale: इससे तृप्त होने और पर्याप्त आजीविका मिलने—दोनों भाव व्यक्त होते हैं, तथा मूल का ठोस ‘रोटी’ का बिंब बना रहता है।
- source_word: וּמְרַדֵּף
  choice: पर ... पीछे भागता है
  rationale: समांतर पंक्तियों में वाव विरोध दिखाता है; ‘पर’ उस विरोध को स्पष्ट करता है। ‘पीछे भागता है’ लगातार पीछा करने का सक्रिय भाव रखता है।
- source_word: רֵקִים
  choice: व्यर्थ बातें
  rationale: शब्द का मूल भाव ‘खाली’ है और यह चीज़ों, निष्फल उपक्रमों या संभवतः निकम्मे लोगों की ओर संकेत कर सकता है। ‘व्यर्थ बातें’ मुख्य पाठ में जानबूझकर कुछ व्यापकता बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יִשְׂבַּע רִישׁ
  choice: उसका पेट गरीबी से भरेगा
  rationale: यह पहले अर्ध-पद के ‘भरपेट’ भाव को दोहराकर मूल की कटु विडंबना बनाए रखता है और आधुनिक हिन्दी में समझने योग्य है।
