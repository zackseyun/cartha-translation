  text: Whoever turns his ear away from hearing the law—even his prayer is an abomination[a].
translation:
  language: hi
  text: 'जो व्यवस्था सुनने से अपना कान फेर लेता है,

    उसकी प्रार्थना भी घृणित है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यवस्था’ के स्थान पर ‘शिक्षा’ या ‘उपदेश’ भी हो सकता है। इब्रानी तोराह केवल कानूनी विधियों तक सीमित नहीं, बल्कि परमेश्वर की अधिकारपूर्ण शिक्षा को अधिक व्यापक रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: फेर लेता है
  rationale: हिफ़ील कृदंत एक सामान्य अथवा आदतन आचरण व्यक्त करता है। ‘फेर लेता है’ स्वेच्छा से न सुनने का भाव और कहावत का सामान्य कथन, दोनों स्वाभाविक हिन्दी में रखता है।
- source_word: אָזְנוֹ
  choice: अपना कान
  rationale: शरीर-अंग के मूल रूपक को बनाए रखता है और हिन्दी में जानबूझकर ध्यान न देने का अर्थ सहजता से देता है।
- source_word: מִשְּׁמֹעַ
  choice: सुनने से
  rationale: पूर्वसर्ग सहित infinitive construct से व्यक्त ‘सुनने की क्रिया से दूर होना’ को संक्षिप्त और स्रोत-सन्निकट हिन्दी में प्रस्तुत करता है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: ‘व्यवस्था’ परमेश्वर की अधिकारपूर्ण तोराह का प्रचलित बाइबलीय हिन्दी प्रतिशब्द है। मूल शब्द का अर्थ केवल कानूनी विधियों तक सीमित न होकर शिक्षा या उपदेश भी हो सकता है; यह व्यापकता पादटिप्पणी में दी गई है।
- source_word: גַּם
  choice: भी
  rationale: यहाँ גַּם परिणाम को बल देता है कि ऐसे व्यक्ति की प्रार्थना तक अस्वीकार्य है। हिन्दी वाक्य में ‘भी’ यह बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְּפִלָּתוֹ
  choice: उसकी प्रार्थना
  rationale: यह संज्ञा सामान्यतः प्रार्थना को दर्शाती है; सर्वनाम-संबंध को हिन्दी में स्पष्ट रखा गया है।
- source_word: תּוֹעֵבָה
  choice: घृणित
  rationale: यह शब्द परमेश्वर की दृष्टि में अत्यंत घिनौनी और अस्वीकार्य वस्तु का कठोर नैतिक मूल्यांकन करता है। ‘घृणित’ आधुनिक हिन्दी में इसकी तीव्रता को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
theological_decisions:
- issue: नीतिवचन के संदर्भ में תּוֹרָה का दायरा
  choice: मुख्य पाठ में ‘व्यवस्था’, जिसका आशय परमेश्वर की अधिकारपूर्ण शिक्षा से भी है
  alternative: शिक्षा; उपदेश
  rationale: पद परमेश्वर की अधिकारपूर्ण शिक्षा सुनने से इनकार और ऐसी अवज्ञा में की गई प्रार्थना के बीच तनाव रखता है। ‘व्यवस्था’ वाचाई और अधिकारपूर्ण भार बनाए रखती है, जबकि पादटिप्पणी मूल शब्द के व्यापक अर्थ को सुरक्षित रखती है।
- issue: प्रार्थना के ‘घृणित’ होने का कथन
  choice: बिना नरम किए सीधा कथन
  alternative: उसकी प्रार्थना स्वीकार नहीं होती
  rationale: मूल תּוֹעֵבָה केवल अनुत्तरित या अस्वीकृत प्रार्थना नहीं, बल्कि अधिक तीव्र नैतिक घृणा व्यक्त करता है। इसलिए मूल की धर्मवैचारिक कठोरता और तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। पहली पंक्ति में इब्रानी का कान फेरने वाला रूपक रखा गया है और दूसरी पंक्ति में मूल कथन की कठोरता बनाए रखी गई है।
