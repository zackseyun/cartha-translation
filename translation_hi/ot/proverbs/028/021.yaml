  text: הַֽכֵּר פָּנִ֥ים לֹא ט֑וֹב וְ/עַל פַּת לֶ֝֗חֶם יִפְשַׁע גָּֽבֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/021.yaml
  text: To show partiality is not good[c][b][a], yet for a piece of bread a man will transgress.
translation:
  language: hi
  text: पक्षपात करना अच्छा नहीं है[a]; फिर भी रोटी के एक टुकड़े के लिए[b] आदमी[c] अपराध करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘चेहरों को पहचानना’; यह पक्षपात या तरफ़दारी करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘रोटी के एक निवाले के लिए’; आशय यह है कि कोई बहुत छोटे लाभ के लिए भी गलत काम कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में ‘आदमी’ है, जिसका प्रयोग यहाँ कहावत में सामान्य प्रतिनिधिक अर्थ में हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: הַכֵּר פָּנִים
  choice: पक्षपात करना
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘चेहरों को पहचानना’ है, पर इसका आशय व्यवहार या निर्णय में किसी का पक्ष लेना है। ‘पक्षपात करना’ आधुनिक हिन्दी में स्वाभाविक और नैतिक अर्थ की दृष्टि से सटीक है।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं है
  rationale: यह इब्रानी के व्यापक नैतिक मूल्यांकन को सीधे व्यक्त करता है; ‘उचित नहीं’ की अपेक्षा मूल के ‘अच्छा’ को अधिक निकटता से बनाए रखता है।
- source_word: וְעַל
  choice: फिर भी ... के लिए
  rationale: संयोजन दूसरी पंक्ति को पहली पंक्ति के नैतिक सिद्धांत के विपरीत मानवीय व्यवहार के रूप में सामने लाता है, और עַל यहाँ लाभ या कारण को सूचित करता है।
- source_word: פַּת לֶחֶם
  choice: रोटी का एक टुकड़ा
  rationale: यह रोटी की थोड़ी-सी मात्रा को दर्शाता है और इस बात पर बल देता है कि अत्यंत छोटे लाभ के लिए भी गलत काम किया जा सकता है।
- source_word: יִפְשַׁע
  choice: अपराध कर बैठता है
  rationale: פשע में नैतिक अथवा विधिक उल्लंघन का गंभीर भाव है। ‘अपराध’ उस भार को बनाए रखता है, जबकि ‘कर बैठता है’ कहावत में व्यक्त होने वाली मानवीय प्रवृत्ति और तुच्छ लाभ के आगे चूक जाने को स्वाभाविक हिन्दी में बताता है।
- source_word: גָּבֶר
  choice: आदमी
  rationale: यह पुल्लिंग एकवचन संज्ञा है, जो यहाँ कहावत में प्रतिनिधिक या सामान्य अर्थ में प्रयुक्त हुई है। ‘आदमी’ स्रोत के लिंग-रूप को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: कहावत में पुल्लिंग शब्द का सामान्य प्रतिनिधिक प्रयोग
  choice: आदमी
  alternative: मनुष्य / व्यक्ति
  rationale: मूल में גָּבֶר स्पष्टतः पुल्लिंग है, यद्यपि कथन का नैतिक अनुप्रयोग सामान्य है। इसलिए अनुवाद स्रोत के लिंग-रूप को मिटाता नहीं, और पादटिप्पणी उसके कहावती सामान्य प्रयोग को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम कहावत की दोनों समांतर पंक्तियों को अलग करता है, जबकि ‘फिर भी’ उनके बीच के नैतिक विरोध को स्पष्ट करता है।
