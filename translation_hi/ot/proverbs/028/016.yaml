  text: נָגִ֗יד חֲסַ֣ר תְּ֭בוּנוֹת וְ/רַ֥ב מַעֲשַׁקּ֑וֹת שנאי בֶ֝֗צַע יַאֲרִ֥יךְ יָמִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/016.yaml
  text: A ruler lacking understanding is great in acts of oppression[b][a], but one who hates unjust gain will prolong his days.
translation:
  language: hi
  text: विवेकहीन शासक बहुत अत्याचार करता है[a], पर अनुचित लाभ से घृणा करने वाला दीर्घायु होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और अत्याचारों में बहुत [है]”; इसका अनुवाद “बहुत शोषण करता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अनुचित लाभ” का अनुवाद “लोभ का लाभ” या “गलत तरीके से पाया गया लाभ” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָגִיד
  choice: शासक
  rationale: यह शब्द अधिकार रखने वाले अगुआ को दर्शाता है; ‘शासक’ सामान्य नीतिवचन के लिए स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: חֲסַר תְּבוּנוֹת
  choice: समझ से रहित
  rationale: यह पद विवेक और उचित निर्णय की कमी व्यक्त करता है; ‘समझ से रहित’ आधुनिक हिन्दी में स्पष्ट है और ज्ञान-साहित्य का भाव बनाए रखता है।
- source_word: וְרַב מַעֲשַׁקּוֹת
  choice: बहुत अत्याचार करता है
  rationale: इब्रानी में शाब्दिक भाव ‘अत्याचारों में बहुत’ है। हिन्दी में क्रियात्मक रूप स्वाभाविक है और बार-बार या बड़े पैमाने पर किए गए दमनकारी कार्यों का अर्थ देता है।
- source_word: שׂנֵא בֶצַע
  choice: जो अन्याय की कमाई से घृणा करता है
  rationale: בֶצַע नैतिक रूप से दूषित, लोभ या अन्याय से प्राप्त लाभ को सूचित करता है; यह चयन तटस्थ ‘लाभ’ की अपेक्षा उस नैतिक बल को स्पष्ट करता है।
- source_word: יַאֲרִיךְ יָמִים
  choice: वह अपनी आयु बढ़ाएगा
  rationale: यह दीर्घ जीवन के लिए प्रयुक्त इब्रानी मुहावरा है; हिन्दी रूप मूल के ‘दिन बढ़ाने’ वाले बिंब को समझने योग्य ढंग से व्यक्त करता है।
theological_decisions:
- issue: नीतिवचन में दीर्घायु के कथन का स्वरूप
  choice: ‘वह अपनी आयु बढ़ाएगा’ के सामान्य प्रतिज्ञात्मक रूप को बनाए रखा गया
  alternative: ‘वह प्रायः दीर्घायु होगा’
  rationale: मूल पाठ सामान्य नीतिवचन को बिना किसी स्पष्ट सीमासूचक शब्द के कहता है; अनकहा अपवाद या संभाव्यता जोड़ना उसके कथन-बल को घटाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले अर्धवाक्य की अस्वाभाविक शाब्दिक संज्ञात्मक रचना को स्वाभाविक हिन्दी क्रिया में बदला गया है, जबकि दूसरे अर्धवाक्य में मूल का स्पष्ट विरोध ‘पर’ से सुरक्षित है।
