  verdict: revise
  source_fidelity: 'The draft conveys the two contrasting proverbial characterizations accurately: a ruler deficient in discernment engages in extensive oppression, while the one who rejects בֶּצַע receives the long-life outcome. However, “अपनी आयु बढ़ाएगा” can imply actively increasing his own lifespan, whereas the Hebrew idiom states that he will live long.'
  naturalness: The Hindi is generally clear and modern. “दीर्घायु होगा” is more idiomatic for the Hebrew long-life idiom than “अपनी आयु बढ़ाएगा.” “अनुचित लाभ” is a broader and more direct equivalent of בֶּצַע than “अन्याय की कमाई,” which can sound limited to earned income.
  terminology: “शासक” suitably renders נָגִיד. “विवेकहीन” clearly expresses the lack of discernment in חֲסַר תְּבוּנוֹת. “अत्याचार” appropriately represents oppressive acts, and “अनुचित लाभ” preserves the morally tainted gain denoted by בֶּצַע without narrowing it to a particular means of acquisition.
  issues:
  - severity: low
    issue: The phrase “वह अपनी आयु बढ़ाएगा” can suggest personal agency in extending one’s lifespan.
    rationale: יַאֲרִיךְ יָמִים is a conventional Hebrew expression for being long-lived. Hindi “वह दीर्घायु होगा” gives this result naturally without adding an agency nuance.
  - severity: low
    issue: “अन्याय की कमाई” is somewhat narrower than the source term.
    rationale: בֶּצַע denotes wrongful or greedy gain broadly, not necessarily income or earnings. “अनुचित लाभ” retains the broader semantic range.
