  yaml_path: translation/ot/proverbs/028/022.yaml
  text: A man with an evil eye hastens after wealth[a], and does not know that poverty will come upon him.
translation:
  language: hi
  text: 'बुरी दृष्टि वाला मनुष्य[a] धन के पीछे उतावला है,

    और नहीं जानता कि उस पर दरिद्रता आ पड़ेगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कंजूस” अथवा “लालची”; शाब्दिक अर्थ “बुरी आँख वाला मनुष्य” है। यह एक हिब्रू मुहावरा है, जो स्वार्थी, कंजूस, और दूसरों को देने में कुढ़ने वाले स्वभाव को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבֳהָל
  choice: उतावला रहता है
  rationale: निफ़अल कृदंत जल्दबाज़ी और हड़बड़ी में काम करने का भाव देता है। ‘उतावला रहता है’ धन के लिए उसकी निरंतर, अविवेकी तत्परता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַהוֹן
  choice: धन पाने को
  rationale: הוֹן का अर्थ धन-संपत्ति है और ל यहाँ लक्ष्य की ओर बढ़ने का भाव देता है। ‘धन पाने को’ इस लक्ष्य-केन्द्रित लालसा को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: हिब्रू में एकवचन पुल्लिंग संज्ञा है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और सूक्तिपरक प्रतिनिधि कथन को बनाए रखता है।
- source_word: רַע עָיִן
  choice: बुरी नज़र वाला
  rationale: यह शाब्दिक रूप से ‘बुरी आँख वाला’ हिब्रू मुहावरा है, जो कंजूसी, स्वार्थी ईर्ष्या या लालच का संकेत दे सकता है। मुख्य पाठ में चित्रात्मक मुहावरा रखा गया है और अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: וְלֹא יֵדַע
  choice: और नहीं जानता
  rationale: संयोजक और अपूर्ण क्रिया का सीधा अनुवाद है; इससे मूल की समन्वयी रचना और चेतावनी का प्रवाह बना रहता है।
- source_word: חֶסֶר
  choice: दरिद्रता
  rationale: חֶסֶר अभाव या कमी को दर्शाता है। धन के पीछे उतावलेपन के परिणाम के रूप में ‘दरिद्रता’ यहाँ ठोस आर्थिक अभाव को गरिमापूर्ण और संक्षिप्त हिन्दी में व्यक्त करती है।
- source_word: יְבֹאֶנּוּ
  choice: उस पर ... आ पड़ेगी
  rationale: क्रिया और सर्वनाम-प्रत्यय का अर्थ है कि अभाव उस व्यक्ति तक या उस पर आएगा। ‘आ पड़ेगी’ अनपेक्षित और प्रतिकूल परिणाम का चेतावनीपूर्ण भाव देता है।
