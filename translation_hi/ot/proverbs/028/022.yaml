  source_fidelity: The draft correctly represents the hurried pursuit of wealth, the warning that the subject is unaware, and the coming of lack. However, ‘बुरी नज़र वाला’ in contemporary Hindi strongly evokes the harmful ‘evil eye’ or a malevolent gaze, rather than the Hebrew idiom’s stingy, begrudging disposition. A slightly more literal yet less culturally misleading form, supported by an explanatory footnote, better preserves the source’s marked idiom.
  naturalness: The revised wording is clear, modern, and appropriately proverbial. ‘धन के पीछे उतावला है’ naturally conveys hasty pursuit, and ‘दरिद्रता उस पर आ पड़ेगी’ retains the warning’s force.
  terminology: ‘दरिद्रता’ suitably renders חֶסֶר in this economic wisdom context. The footnote retains the idiom’s lexical range—especially stinginess and greed—without reducing it to only one interpretation.
  issues:
  - severity: medium
    issue: ‘बुरी नज़र वाला’ is misleading in modern Hindi.
    rationale: It commonly suggests casting or possessing an ‘evil eye,’ a meaning not intended by the Hebrew phrase רַע עָיִן. The source idiom concerns a selfish, begrudging, stingy disposition; the revised main text and footnote retain its literal imagery while making this range accessible.
