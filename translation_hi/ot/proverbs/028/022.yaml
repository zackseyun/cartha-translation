translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूक्ति की दो-पंक्तीय चेतावनीपूर्ण संरचना सुरक्षित है। सांस्कृतिक रूप से विशिष्ट ‘बुरी नज़र’ के मुहावरे को मुख्य पाठ में बनाए रखते हुए उसके संभावित अर्थ पादटिप्पणी में स्पष्ट किए गए हैं।
