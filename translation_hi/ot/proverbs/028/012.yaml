  text: בַּ/עֲלֹ֣ץ צַ֭דִּיקִים רַבָּ֣ה תִפְאָ֑רֶת וּ/בְ/ק֥וּם רְ֝שָׁעִ֗ים יְחֻפַּ֥שׂ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/012.yaml
  text: When the righteous rejoice[a], there is great glory, but when the wicked rise, people hide themselves.
translation:
  language: hi
  text: जब धर्मी आनन्दित होते हैं, तब बड़ा गौरव होता है; पर जब दुष्ट उठ खड़े होते हैं, तब मनुष्य[a] छिप जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य’ एकवचन है, पर इसका सामान्य अर्थ किसी व्यक्ति या लोगों से है—अर्थात दुष्टों के प्रभावी होने पर साधारण लोग छिप जाते हैं।
    reason: इब्रानी אָדָם के सामान्य एकवचन अर्थ को स्पष्ट करता है और अंग्रेज़ी POB audit trail की lexical-alternative पादटिप्पणी के अनुरूप है।
lexical_decisions:
- source_word: בַּעֲלֹץ
  choice: जब … आनन्दित होते हैं
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक है। ‘आनन्दित होते हैं’ आधुनिक, सहज हिन्दी में עלץ के हर्ष या उल्लास का भाव देता है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: यह विशेषण बहुवचन में संज्ञा की तरह प्रयुक्त होकर धर्मी लोगों को दर्शाता है; ‘धर्मी’ हिन्दी बाइबिलीय और ज्ञान-साहित्यिक शैली में स्वाभाविक है।
- source_word: רַבָּה תִפְאָרֶת
  choice: बड़ा गौरव होता है
  rationale: רַבָּה प्रचुरता या महानता और תִפְאָרֶת शोभा, सम्मान या गौरव व्यक्त करता है। ‘बड़ा गौरव’ सार्वजनिक सम्मान और उत्कर्ष के भाव को बनाए रखता है, बिना उसे केवल राजनीतिक सफलता तक सीमित किए।
- source_word: וּבְקוּם
  choice: पर जब … उठ खड़े होते हैं
  rationale: וְ यहाँ दोनों अर्ध-पंक्तियों के विरोध को दिखाता है और בְּקוּם समयसूचक है। ‘उठ खड़े होते हैं’ सत्ता या प्रभाव में उभरने का संकेत दे सकता है, पर मूल की व्यापकता भी बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में नैतिक रूप से दुष्ट लोगों को दर्शाता है; ‘दुष्ट’ संक्षिप्त और प्रचलित समतुल्य है।
- source_word: יְחֻפַּשׂ
  choice: छिप जाता है
  rationale: यह Pual रूप शाब्दिक रूप से ‘ढूँढ़ा जाता है’ समझा जा सकता है, पर सन्दर्भ में आशय है कि व्यक्ति सार्वजनिक दृष्टि से ओझल हो जाता है और उसे खोजना पड़ता है। मुख्य पाठ में स्वाभाविक हिन्दी अर्थ दिया गया है और शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन אָדָם यहाँ प्रतिनिधिक या सामान्य अर्थ में है। ‘मनुष्य’ इब्रानी के एकवचन रूप को बनाए रखते हुए किसी भी साधारण व्यक्ति पर लागू होने वाला भाव व्यक्त करता है।
theological_decisions:
- issue: दुष्टों के उठने पर אָדָם और יְחֻפַּשׂ का संयुक्त अर्थ
  choice: मनुष्य छिप जाता है
  alternative: मनुष्य को ढूँढ़ा जाता है / लोग छिप जाते हैं
  rationale: मसोरेटी स्वरांकन क्रिया को Pual रूप में प्रस्तुत करता है, जिसका शाब्दिक बोध ‘ढूँढ़ा जाता है’ हो सकता है। कहावत के समानांतर विरोध और निकटवर्ती नीतिवचन 28:28 के आधार पर आशय यह है कि दुष्टों के प्रभावी होने पर सामान्य व्यक्ति ओझल या भूमिगत हो जाता है। एकवचन ‘मनुष्य’ मूल की व्याकरणिक आकृति को बनाए रखता है; पादटिप्पणी शाब्दिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण रखी गई है। समानांतर कहावत की संरचना ‘जब… तब…; पर जब… तब…’ से स्पष्ट की गई है। ‘उठ खड़े होते हैं’ को जानबूझकर ‘सत्ता में आते हैं’ नहीं बनाया गया, ताकि मूल के सामाजिक-राजनीतिक संकेत को संकीर्ण व्याख्या में न बदला जाए।
