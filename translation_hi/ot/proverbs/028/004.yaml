source:
  edition: WLC
  text: עֹזְבֵ֣י ת֭וֹרָה יְהַֽלְל֣וּ רָשָׁ֑ע וְ/שֹׁמְרֵ֥י ת֝וֹרָ֗ה יִתְגָּ֥רוּ בָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/004.yaml
  text: Those who forsake the law praise the wicked[b][a], but those who keep the law contend with them.
translation:
  language: hi
  text: 'जो शिक्षा[a] को त्याग देते हैं, वे दुष्ट की प्रशंसा करते हैं,

    पर जो शिक्षा का पालन करते हैं, वे उनका विरोध[b] करते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिक्षा’ का अनुवाद ‘व्यवस्था’, ‘निर्देश’ या ‘उपदेश’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनसे संघर्ष करते हैं’ अथवा ‘उनके विरुद्ध खड़े होते हैं।’ इब्रानी क्रिया में किसी के विरुद्ध सक्रिय रूप से भिड़ने या संघर्ष करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹזְבֵי
  choice: जो ... को त्याग देते हैं
  rationale: बहुवचन कृदन्त ऐसे लोगों का चरित्र बताता है जो जानबूझकर शिक्षा को छोड़ देते हैं। ‘त्याग देते हैं’ नैतिक गंभीरता और लोकोक्तिपरक लहजे को बनाए रखता है।
- source_word: תּוֹרָה
  choice: शिक्षा
  rationale: नीतिवचन के ज्ञान-साहित्यिक संदर्भ में תּוֹרָה प्रामाणिक नैतिक शिक्षा या निर्देश को दर्शा सकता है। ‘शिक्षा’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को केवल संहिताबद्ध व्यवस्था तक सीमित नहीं करती।
- source_word: יְהַלְלוּ
  choice: प्रशंसा करते हैं
  rationale: पिएल रूप का सीधा अर्थ प्रशंसा या सराहना करना है; यह दुष्ट को मिलने वाली विडंबनापूर्ण स्वीकृति को स्पष्ट रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: मूल में एकवचन विशेषण संज्ञा के रूप में है, पर वह किसी प्रतिनिधि दुष्ट व्यक्ति अथवा दुष्ट वर्ग को सूचित कर सकता है। हिन्दी का ‘दुष्ट’ इस संक्षिप्त और प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: שֹׁמְרֵי
  choice: जो ... का पालन करते हैं
  rationale: שׁמר में संभालकर रखने, मानने और पालन करने का भाव है। शिक्षा के साथ ‘पालन करते हैं’ स्वाभाविक हिन्दी है और आज्ञाकारिता का आशय व्यक्त करता है।
- source_word: יִתְגָּרוּ
  choice: विरोध करते हैं
  rationale: हित्पएल क्रिया किसी के विरुद्ध सक्रिय रूप से खड़े होने या संघर्ष करने का भाव रखती है। ‘विरोध करते हैं’ शत्रुतापूर्ण दिशा को स्पष्ट करता है, पर शारीरिक हिंसा को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בָם
  choice: उनका
  rationale: इस क्रिया के साथ ב विरोध के लक्ष्य को दर्शाता है। हिन्दी में ‘उनका विरोध करते हैं’ स्वाभाविक है और सर्वनाम के संदर्भ को मूल पाठ की तरह संक्षिप्त रखता है।
theological_decisions:
- issue: दूसरी पंक्ति में ‘उनका’ का संदर्भ
  choice: सर्वनाम को बिना अधिक स्पष्ट किए ‘उनका’ रखा गया है; संदर्भ दुष्ट अथवा पहली पंक्ति में वर्णित व्यवस्था-विरोधी लोगों के वर्ग की ओर जाता है।
  alternative: इसे स्पष्ट करके ‘ऐसे दुष्ट लोगों का’ या ‘शिक्षा को त्यागने वालों का’ कहा जा सकता था।
  rationale: इब्रानी में बहुवचन सर्वनाम है, जबकि ठीक पहले ‘दुष्ट’ रूपात्मक रूप से एकवचन किंतु प्रतिनिधिक है। संक्षिप्त सर्वनाम मूल की संदर्भगत लचक को सुरक्षित रखता है और किसी एक संभावित पूर्वपद को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों पंक्तियों की समानांतर रचना ‘त्याग देते हैं/पालन करते हैं’ और ‘प्रशंसा करते हैं/विरोध करते हैं’ से उभारी गई है। ‘शिक्षा’ ज्ञान-साहित्य के व्यापक अर्थ को मुख्य पाठ में रखती है, जबकि पादटिप्पणी पारंपरिक ‘व्यवस्था’ सहित विकल्प देती है।
