source:
  edition: WLC
  text: אַנְשֵׁי רָ֭ע לֹא יָבִ֣ינוּ מִשְׁפָּ֑ט וּ/מְבַקְשֵׁ֥י יְ֝הוָ֗ה יָבִ֥ינוּ כֹֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/005.yaml
  text: Evil men do not understand justice[a], but those who seek Yahweh understand all things.
translation:
  language: hi
  text: बुरे लोग न्याय को नहीं समझते, परन्तु जो यहोवा की खोज करते हैं, वे सब कुछ[a] समझते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सब कुछ’ से यहाँ सन्दर्भानुसार व्यापक नैतिक विवेक—विशेषकर न्याय की समझ—अभिप्रेत है, न कि हर बात का असीम ज्ञान।
    reason: अर्थ-सीमा और कहावत की प्रकृति स्पष्ट करना
lexical_decisions:
- source_word: אַנְשֵׁי רָע
  choice: बुरे लोग
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ ‘बुराई के पुरुष’ है; यहाँ वर्ग-सूचक अर्थ में ‘बुरे लोग’ स्वाभाविक और सटीक आधुनिक हिन्दी है।
- source_word: יָבִינוּ
  choice: समझते हैं
  rationale: בין समझने और विवेक से पहचानने, दोनों का भाव रखता है। दोनों पंक्तियों में ‘समझते हैं’ की पुनरावृत्ति इब्रानी समानता को बनाए रखती है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: नीतिवचन के नैतिक संदर्भ में यह शब्द केवल न्यायिक निर्णय नहीं, बल्कि न्याय और उचित व्यवस्था को दर्शाता है।
- source_word: מְבַקְשֵׁי יְהוָה
  choice: जो यहोवा की खोज करते हैं
  rationale: कृदन्त ऐसे लोगों के निरन्तर लक्षण को व्यक्त करता है जो यहोवा को खोजते हैं; हिन्दी में यह वाक्यांश स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כֹל
  choice: सब कुछ
  rationale: निरपेक्ष כֹל का सीधा और स्वाभाविक हिन्दी रूप ‘सब कुछ’ है; इससे मूल कथन की व्यापकता बनी रहती है।
theological_decisions:
- issue: ‘सब कुछ समझते हैं’ का दायरा
  choice: मूल की व्यापक कहावत को पाठ में ‘सब कुछ’ के रूप में बनाए रखा गया है; सन्दर्भ इसे विशेषतः नैतिक विवेक और न्याय की समझ से जोड़ता है।
  alternative: इसे बिना सीमा के सर्वज्ञान का कथन समझना, या मुख्य पाठ में ही इसे ‘हर सही बात’ तक सीमित कर देना।
  rationale: पहली पंक्ति न्याय न समझने की बात करती है, इसलिए समानान्तर दूसरी पंक्ति व्यापक नैतिक विवेक पर केन्द्रित है। फिर भी כֹל की व्यापकता को मुख्य पाठ में संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। इब्रानी समानान्तरता और दोनों पंक्तियों में ‘समझते हैं’ की पुनरावृत्ति सुरक्षित रखी गई है।
