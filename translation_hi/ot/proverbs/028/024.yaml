  text: גּוֹזֵ֤ל אָ֘בִ֤י/ו וְ/אִמּ֗/וֹ וְ/אֹמֵ֥ר אֵֽין פָּ֑שַׁע חָבֵ֥ר ה֝֗וּא לְ/אִ֣ישׁ מַשְׁחִֽית׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/024.yaml
  text: Whoever robs his father and his mother and says[a], “It is no transgression,” is a companion of a destructive man.
translation:
  language: hi
  text: जो अपने पिता और अपनी माता को लूटता है और कहता है, “यह कोई अपराध नहीं है,” वह विनाश करनेवाले का साथी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नाश करनेवाले के साथ मिला हुआ है” अथवा “वह विनाश करनेवाले का संगी है।”
    reason: חָבֵר ... לְ संबंध को साथीपन, संगति या संबद्धता के रूप में व्यक्त किया जा सकता है; वैकल्पिक अनुवाद इस सूक्ष्मता को दिखाते हैं।
lexical_decisions:
- source_word: גּוֹזֵל
  choice: लूटता है
  rationale: यह क्रिया बलपूर्वक या अन्यायपूर्वक छीन लेने का भाव रखती है। ‘लूटता है’ उसकी गंभीरता को बनाए रखता है और केवल सामान्य चोरी तक अर्थ को सीमित नहीं करता।
- source_word: אָבִיו וְאִמּוֹ
  choice: अपने पिता और अपनी माता
  rationale: इब्रानी में माता-पिता दोनों का अलग-अलग उल्लेख है; हिन्दी में भी दोनों को स्पष्ट रखने से मूल की रचना और बल सुरक्षित रहता है।
- source_word: וְאֹמֵר
  choice: और कहता है
  rationale: यह इब्रानी के सरल समन्वय और कृदन्तीय अभिव्यक्ति का स्वाभाविक हिन्दी रूप है।
- source_word: אֵין פָּשַׁע
  choice: यह कोई अपराध नहीं है
  rationale: פֶּשַׁע अपराध, उल्लंघन या विद्रोह का बोध करा सकता है। प्रसंग में ‘अपराध’ नैतिक दोष और अनुचित कर्म की गंभीरता को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे केवल धार्मिक ‘पाप’ या केवल विधिक अपराध तक सीमित किए।
- source_word: חָבֵר
  choice: साथी
  rationale: यह किसी से जुड़े या उसके साथ संबद्ध व्यक्ति को दर्शाता है। ‘साथी’ नैतिक सहभागिता या समानता का भाव देता है, जबकि ‘मित्र’ अनावश्यक रूप से व्यक्तिगत स्नेह का संकेत दे सकता है।
- source_word: לְאִישׁ מַשְׁחִית
  choice: विनाश करनेवाले का
  rationale: מַשְׁחִית विनाश या बरबादी करनेवाले व्यक्ति को सूचित करता है। חָבֵר के साथ आया לְ संबंध या संगति दर्शाता है; ‘विनाश करनेवाले का साथी’ हिन्दी में स्वाभाविक रहते हुए उस नैतिक संबद्धता को बनाए रखता है।
- source_word: הוּא
  choice: वह ... है
  rationale: सर्वनाम यहाँ नामवाचक वाक्य के कर्ता को फिर से सामने लाता है; हिन्दी में ‘वह ... है’ इसका स्पष्ट और स्वाभाविक रूप है।
