source:
  edition: WLC
  text: אִ֣ישׁ אֱ֭מוּנוֹת רַב בְּרָכ֑וֹת וְ/אָ֥ץ לְ֝/הַעֲשִׁ֗יר לֹ֣א יִנָּקֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/020.yaml
  text: A faithful man will abound with blessings[a], but one who hastens to become rich will not go unpunished.
translation:
  language: hi
  text: विश्वासयोग्य मनुष्य बहुत-सी आशीषें पाएगा, पर जो धनी होने की जल्दी करता है, वह दण्ड से नहीं बचेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह निर्दोष न ठहरेगा’ अथवा ‘वह दोषमुक्त न होगा।’
    reason: לֹא יִנָּקֶה के न्यायिक और दण्डात्मक अर्थ-क्षेत्र को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी पुल्लिंग एकवचन यहाँ प्रतिनिधिक, सामान्य अर्थ में है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस रूप को बनाए रखता है।
- source_word: אֱמוּנוֹת
  choice: विश्वासयोग्य
  rationale: बहुवचन भाववाचक संज्ञा यहाँ विशेषणवत् प्रयुक्त है—ऐसा मनुष्य जिसमें विश्वसनीयता और निष्ठा है। ‘विश्वासयोग्य’ इस व्यावहारिक नैतिक गुण को स्पष्ट करता है।
- source_word: רַב בְּרָכוֹת
  choice: बहुत-सी आशीषें पाएगा
  rationale: क्रियारहित इब्रानी वाक्यांश आशीषों की प्रचुरता बताता है। हिन्दी में ‘पाएगा’ नीतिवचन के सामान्य सिद्धान्त को स्वाभाविक ढंग से व्यक्त करता है, जबकि बहुवचन ‘आशीषें’ सुरक्षित रहता है।
- source_word: וְאָץ
  choice: पर जो ... जल्दी करता है
  rationale: אָץ उतावले या जल्दबाज़ होने का भाव देता है। विरोधसूचक ‘पर’ दोनों अर्ध-पंक्तियों के नैतिक अंतर को स्पष्ट रखता है।
- source_word: לְהַעֲשִׁיר
  choice: धनी होने की
  rationale: हिफ़ील रूप यहाँ धनवान बनने या धन प्राप्त करने का अर्थ देता है। यह अनुवाद धन को अपने-आप दोषी नहीं ठहराता, बल्कि उसके लिए की जाने वाली जल्दबाज़ी पर बल रखता है।
- source_word: לֹא יִנָּקֶה
  choice: दण्ड से नहीं बचेगा
  rationale: נקה का निफ़अल रूप निर्दोष ठहरने, दोषमुक्त होने या दण्ड से छूटने का अर्थ दे सकता है। प्रसंग में ‘दण्ड से नहीं बचेगा’ परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘आशीषें’ के स्वरूप को केवल भौतिक समृद्धि मानना
  choice: ‘आशीषें’ को व्यापक और अनिर्दिष्ट रखा गया
  alternative: इसे धन या भौतिक लाभ के रूप में स्पष्ट करना
  rationale: בְּרָכוֹת स्वयं अनेक प्रकार की कृपा या हित को समेट सकता है; समानांतर पंक्ति में धन का उल्लेख होने पर भी पहली पंक्ति को केवल आर्थिक अर्थ तक सीमित करना मूल से अधिक निश्चित होगा।
- issue: धनी होने और धनी होने की उतावली में भेद
  choice: निन्दा को ‘धनी होने की जल्दी’ से जोड़ा गया
  alternative: धनवान बनने की हर इच्छा को दोषी बताना
  rationale: मूल में नकारात्मक बल אָץ, अर्थात जल्दबाज़ी या उतावलेपन, पर है; केवल धनी होने की अवस्था पर नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विश्वासयोग्य’ नैतिक विश्वसनीयता को, ‘आशीषें’ मूल की व्यापकता को, और ‘दण्ड से नहीं बचेगा’ चेतावनी की स्पष्टता को बनाए रखते हैं। पादटिप्पणी-चिह्न संबंधित अंतिम पद के बाद रखा गया है।
