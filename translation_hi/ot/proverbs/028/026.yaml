source:
  edition: WLC
  text: בּוֹטֵ֣חַ בְּ֭/לִבּ/וֹ ה֣וּא כְסִ֑יל וְ/הוֹלֵ֥ךְ בְּ֝/חָכְמָ֗ה ה֣וּא יִמָּלֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/026.yaml
  text: Whoever trusts in his own heart is a fool[b][a], but he who walks in wisdom will escape.
translation:
  language: hi
  text: जो अपने ही हृदय[a] पर भरोसा करता है, वह मूर्ख है; पर जो बुद्धिमानी से चलता है, वह बच निकलेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “हृदय” प्रायः केवल भावनाओं को नहीं, बल्कि विचार, निर्णय और इच्छा सहित मनुष्य के भीतरी व्यक्तित्व को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या, “छुड़ाया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹטֵחַ
  choice: भरोसा रखता है
  rationale: यह प्रयोग किसी व्यक्ति या वस्तु पर अपना विश्वास टिकाने का भाव व्यक्त करता है और आत्मनिर्भरता के विरुद्ध कहावत की चेतावनी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּלִבּוֹ
  choice: अपने ही हृदय पर
  rationale: לֵב यहाँ केवल भावना नहीं, बल्कि विचार, निर्णय और इच्छा सहित भीतरी मनुष्य को दर्शाता है। “अपने ही” आत्म-भरोसे के भाव को स्पष्ट करता है, जबकि “हृदय” मूल बिंब को सुरक्षित रखता है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: यह नीतिवचन-साहित्य का स्थापित शब्द है, जो केवल कम बुद्धि नहीं बल्कि नैतिक और व्यावहारिक विवेक की कमी भी दर्शाता है।
- source_word: וְהוֹלֵךְ
  choice: जो ... चलता है
  rationale: הלך यहाँ जीवन-आचरण का रूपक है। “चलता है” उस रूपक को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּחָכְמָה
  choice: बुद्धि के अनुसार
  rationale: यह हिन्दी में स्वाभाविक रूप से बताता है कि व्यक्ति का आचरण बुद्धि द्वारा निर्देशित है, बिना “चलने” के मूल रूपक को हटाए।
- source_word: יִמָּלֵט
  choice: बच निकलेगा
  rationale: מלט के निफ़अल रूप में संकट से बच निकलने या छुड़ाए जाने—दोनों की संभावना है। मुख्य पाठ में संक्षिप्त और स्वाभाविक “बच निकलेगा” रखा गया है तथा कर्मवाच्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: הוּא ... הוּא
  choice: वह ... वह
  rationale: दोनों स्पष्ट सर्वनामों का बल हिन्दी की समानांतर उपवाक्य-रचना में रखा गया है, जिससे दोनों प्रकार के व्यक्ति स्पष्ट रूप से आमने-सामने आते हैं।
theological_decisions:
- issue: “हृदय” की मानवशास्त्रीय व्यापकता
  choice: “हृदय” को बनाए रखा गया है और पादटिप्पणी में उसका व्यापक हिब्रू अर्थ समझाया गया है।
  alternative: “अपने मन पर” या “अपने आप पर”
  rationale: “मन” या “अपने आप” अर्थ का एक भाग स्पष्ट कर सकते हैं, पर मूल के मानवशास्त्रीय बिंब को संकुचित कर देंगे। “हृदय” विचार, निर्णय और इच्छा सहित भीतरी व्यक्ति की व्यापक धारणा को सुरक्षित रखता है।
- issue: יִמָּלֵט में बच निकलने और छुड़ाए जाने का तनाव
  choice: मुख्य पाठ में “बच निकलेगा”
  alternative: “छुड़ाया जाएगा”
  rationale: हिब्रू रूप दोनों अर्थों की गुंजाइश देता है। मुख्य पाठ किसी उद्धारकर्ता को अनकहे रूप में जोड़ने से बचता है, जबकि कर्मवाच्य संभावना पादटिप्पणी में सुरक्षित है।
- issue: पुल्लिंग एकवचन की प्रतिनिधिक अभिव्यक्ति
  choice: “जो ... रखता है, वह ...; जो ... चलता है, वह ...”
  alternative: पूरी तरह लिंग-निरपेक्ष बहुवचन रचना
  rationale: यह रचना हिब्रू के पुल्लिंग एकवचन रूप से मेल खाती है और हिन्दी में सामान्य प्रतिनिधिक कथन के रूप में स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमा के अनुरूप रखी गई है। अर्धविराम विरोधी समानांतरता को स्पष्ट करता है। “बुद्धि के अनुसार चलता है” मूल के जीवन-मार्ग वाले रूपक को बचाते हुए सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
