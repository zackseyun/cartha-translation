source:
  edition: WLC
  text: בְּ/פֶ֣שַֽׁע אֶ֭רֶץ רַבִּ֣ים שָׂרֶ֑י/הָ וּ/בְ/אָדָ֥ם מֵבִ֥ין יֹ֝דֵ֗עַ כֵּ֣ן יַאֲרִֽיךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/002.yaml
  text: Because of a land's transgression[a], its rulers are many, but by a man of understanding and knowledge[b], stability endures.
translation:
  language: hi
  text: देश के अपराध के कारण उसके शासक बहुत होते हैं, परन्तु समझदार और ज्ञानी मनुष्य के द्वारा स्थिरता दीर्घकाल तक बनी रहती है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी की दूसरी पंक्ति कठिन है। अधिक शाब्दिक रूप संभव है: “परन्तु समझने और जाननेवाले मनुष्य के द्वारा वह दीर्घकाल तक बना रहता है।” यहाँ आशय संभवतः यह है कि विवेक और ज्ञान से देश की सुव्यवस्था दीर्घकाल तक बनी रहती है।'
    reason: alternative_reading
  - marker: b
    text: यहाँ “मनुष्य” इब्रानी आदाम का अनुवाद है। यह एकवचन में प्रतिनिधिक शब्द है और किसी बुद्धिमान अगुवे या सलाहकार को सूचित कर सकता है; इसका आशय अनिवार्य रूप से केवल पुरुष तक सीमित करना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע אֶרֶץ
  choice: देश के अपराध के कारण
  rationale: בְּ को यहाँ कारणसूचक माना गया है। אֶרֶץ राजनीतिक भूभाग या राष्ट्र के अर्थ में है, इसलिए आधुनिक हिन्दी में ‘देश’ स्वाभाविक है। פֶשַׁע के नैतिक और विधिक भाव को ‘अपराध’ सुरक्षित रखता है।
- source_word: רַבִּים שָׂרֶיהָ
  choice: उसके शासक बहुत हो जाते हैं
  rationale: שָׂרִים शासकों, प्रधानों या अधिकारियों को सूचित कर सकता है। ‘शासक’ राजनीतिक संदर्भ में स्पष्ट है; ‘हो जाते हैं’ इस कारणजन्य स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इब्रानी में क्रिया व्यक्त नहीं है।
- source_word: וּבְאָדָם
  choice: परन्तु ... मनुष्य के द्वारा
  rationale: वाव को विरोधात्मक समानांतरता के कारण ‘परन्तु’ किया गया है और בְּ को साधनसूचक ‘के द्वारा’। אָדָם एकवचन में प्रतिनिधिक, सामान्य मानव-संज्ञा है।
- source_word: מֵבִין יֹדֵעַ
  choice: समझदार और ज्ञानी
  rationale: दोनों कृदन्तों के अलग-अलग भाव—विवेकपूर्ण समझ और ज्ञान—को बनाए रखा गया है। यह हिन्दी में संक्षिप्त और स्वाभाविक भी है।
- source_word: כֵּן יַאֲרִיךְ
  choice: स्थिरता बनी रहती है
  rationale: यह कठिन और संभवतः संक्षिप्त इब्रानी वाक्यांश है। כֵּן को स्थापित या सुव्यवस्थित दशा के अर्थ में और יַאֲרִיךְ को उसके दीर्घ बने रहने के अर्थ में लिया गया है। हिन्दी अनुवाद अर्थ को स्पष्ट करता है, जबकि वैकल्पिक अधिक शाब्दिक पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: व्यक्ति / पुरुष
  rationale: ‘मनुष्य’ इब्रानी के सामान्य, प्रतिनिधिक अर्थ को बनाए रखता है और अनावश्यक रूप से केवल पुरुष लिंग तक सीमित नहीं करता। यहाँ किसी विशिष्ट लिंग-संबंधी धार्मिक निष्कर्ष को पाठ में नहीं जोड़ा गया है।
- issue: दूसरी पंक्ति का कठिन आशय
  choice: बुद्धिमान और ज्ञानी मनुष्य के द्वारा स्थिरता का बने रहना
  alternative: उसके द्वारा वह बहुत समय तक बना रहता है
  rationale: वाक्य का राजनीतिक समानांतर अर्थ स्थिर शासन या सुव्यवस्था की दीर्घता की ओर संकेत करता है, पर इब्रानी की अस्पष्टता स्वीकारते हुए अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘देश’, ‘शासक’, ‘समझदार’ और ‘ज्ञानी’ सामान्य पाठक के लिए सहज हैं। कठिन दूसरे अर्धांश में मुख्य पाठ अर्थ-स्पष्ट है, जबकि वास्तविक इब्रानी अस्पष्टता पादटिप्पणी में संरक्षित है।
