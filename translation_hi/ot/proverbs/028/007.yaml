base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/007.yaml
  text: Whoever keeps the law is a discerning son[b][a], but he who associates with gluttons shames his father.
translation:
  language: hi
  text: जो व्यवस्था का पालन करता है, वह समझदार पुत्र है; पर जो पेटुओं[b] की संगति करता है[a], वह अपने पिता को लज्जित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘पेटुओं को चराता है’ है; यहाँ चरवाही का यह चित्र ऐसे लोगों के साथ उठने-बैठने या संगति रखने के अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: ‘पेटू’ शब्द का अर्थ अधिक व्यापक रूप से अति, अपव्यय और उच्छृंखल जीवन में पड़े लोग भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹצֵר
  choice: पालन करता है
  rationale: यह कृदन्त किसी बात की रक्षा करने, उसे मानने और उसके अनुसार चलने का भाव देता है। ‘व्यवस्था का पालन करना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: नीतिवचन के इस भाग में यह शब्द अधिकारपूर्ण शिक्षा अथवा व्यवस्था को सूचित करता है। ‘व्यवस्था’ उसके विधिक और धर्मशिक्षात्मक दोनों संदर्भों के लिए उपयुक्त बाइबलीय हिन्दी है।
- source_word: בֵּן
  choice: पुत्र
  rationale: इब्रानी शब्द स्पष्ट रूप से पुल्लिंग एकवचन है और पिता-पुत्र के पारिवारिक संबंध को बनाए रखता है।
- source_word: מֵבִין
  choice: समझदार
  rationale: यह उस व्यक्ति को दर्शाता है जिसमें समझ और परख है; ‘समझदार’ सहज, वर्तमान हिन्दी में इसी गुण को व्यक्त करता है।
- source_word: וְרֹעֶה
  choice: की संगति करता है
  rationale: क्रिया का शाब्दिक अर्थ ‘चराना/चरवाही करना’ है, पर यहाँ इसका मुहावरेदार अर्थ किसी समूह के साथ उठना-बैठना या मेल-जोल रखना है।
- source_word: זֹלְלִים
  choice: पेटुओं
  rationale: यह शब्द मूलतः अत्यधिक खाने वालों के लिए है, पर अति और अपव्ययी जीवन में पड़े लोगों के व्यापक अर्थ को भी समेट सकता है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יַכְלִים
  choice: लज्जित करता है
  rationale: हिफ़ील रूप किसी पर लज्जा या अपमान लाने का कारण बनने को व्यक्त करता है।
- source_word: אָבִיו
  choice: अपने पिता को
  rationale: हिन्दी में कर्ता की ओर लौटते इस संबंध को ‘अपने पिता को’ स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
