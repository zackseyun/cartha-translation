  yaml_path: translation/ot/proverbs/028/027.yaml
  text: Whoever gives to the poor will have no lack[a], but he who hides his eyes will have many curses.
translation:
  language: hi
  text: 'जो गरीब को देता है, उसे किसी चीज़ की कमी नहीं होगी;

    पर जो अपनी आँखें मूँद लेता है[a], उसे बहुत-से शाप मिलेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आँखें छिपाता है”; अर्थात गरीब को जानबूझकर अनदेखा करता है या उससे आँखें फेर लेता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹתֵן לָרָשׁ
  choice: जो गरीब को देता है
  rationale: Qal कृदंत נוֹתֵן यहाँ सार्वकालिक, नीतिवचनात्मक कर्ता को व्यक्त करता है। רָשׁ किसी गरीब या निर्धन व्यक्ति को दर्शाता है; हिंदी में एकवचन ‘गरीब’ सामान्य वर्ग का स्वाभाविक बोध कराता है।
- source_word: אֵין מַחְסוֹר
  choice: उसे किसी बात की घटी न होगी
  rationale: अस्तित्ववाचक निषेध אֵין और מַחְסוֹר ‘कमी/अभाव न होने’ का अर्थ देते हैं। यह रूप कथन के प्रतिज्ञात्मक परिणाम को बनाए रखता है, पर अभाव का प्रकार निश्चित नहीं करता।
- source_word: וּמַעְלִים עֵינָיו
  choice: पर जो अपनी आँखें मूँद लेता है[a]
  rationale: עלם का Hiphil कृदंत ‘आँखों’ के साथ जानबूझकर अनदेखा करने का चित्रात्मक मुहावरा है। ‘आँखें मूँद लेना’ हिंदी में वही नैतिक चित्र और अभिप्राय दोनों सुरक्षित रखता है।
- source_word: רַב מְאֵרוֹת
  choice: उसे बहुत-से शाप मिलेंगे
  rationale: מְאֵרוֹת ‘शापों’ का बहुवचन है। इब्रानी में क्रिया व्यक्त नहीं है; हिंदी में पहले खंड के परिणाम के समानांतर स्वाभाविक वाक्य बनाने के लिए ‘मिलेंगे’ जोड़ा गया है, बिना शापों के स्रोत को निश्चित किए।
