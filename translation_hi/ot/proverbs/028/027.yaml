  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों अर्धपंक्तियों का नीतिवचनात्मक विरोध सुरक्षित है; ‘घटी’ बाइबिलीय गरिमा रखते हुए सामान्य हिंदी में बोधगम्य है।
