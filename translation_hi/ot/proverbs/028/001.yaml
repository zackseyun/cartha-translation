source:
  edition: WLC
  text: נָ֣סוּ וְ/אֵין רֹדֵ֣ף רָשָׁ֑ע וְ֝/צַדִּיקִ֗ים כִּ/כְפִ֥יר יִבְטָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/001.yaml
  text: The wicked flee when no one is pursuing[a], but the righteous are confident like a young lion.
translation:
  language: hi
  text: जब कोई पीछा नहीं करता, तब भी दुष्ट भागता है[a], पर धर्मी लोग जवान सिंह के समान निडर रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “दुष्ट भागता है, यद्यपि कोई उसका पीछा नहीं करता; पर धर्मी लोग जवान सिंह के समान आश्वस्त रहते हैं।” इब्रानी में अंतिम क्रिया का अर्थ “भरोसा रखना,” “सुरक्षित अनुभव करना” या “निडर होना” हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסוּ
  choice: भागता है
  rationale: क्रिया का रूप पूर्णकालिक है, पर नीतिवचन की सामान्य सत्यवाचक शैली में हिन्दी का वर्तमानकाल स्वाभाविक है। एकवचन ‘दुष्ट’ के साथ ‘भागता है’ रखा गया है।
- source_word: וְאֵין רֹדֵף
  choice: जब कोई पीछा नहीं करता, तब भी
  rationale: אֵין और कृदंत רֹדֵף पीछा करनेवाले के अभाव को व्यक्त करते हैं। ‘तब भी’ प्रसंग में निहित विरोधाभासी भाव को स्वाभाविक हिन्दी में सामने लाता है, बिना कारण को निश्चित किए।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: इब्रानी एकवचन यहाँ किसी एक व्यक्ति नहीं, बल्कि एक प्रतिनिधि नैतिक प्रकार को दर्शाता है; हिन्दी में ‘दुष्ट’ यही सामान्य अर्थ स्वाभाविक रूप से देता है।
- source_word: וְצַדִּיקִים
  choice: पर धर्मी लोग
  rationale: बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी लोग’ उसका बहुवचन और नैतिक वर्ग दोनों स्पष्ट करता है; וְ का विरोधसूचक बल ‘पर’ से व्यक्त है।
- source_word: כִּכְפִיר
  choice: जवान सिंह के समान
  rationale: כְּפִיר सामान्य सिंह की अपेक्षा विशेष रूप से युवा सिंह को सूचित करता है। ‘जवान सिंह’ इस भेद को बनाए रखता है और हिन्दी में गरिमापूर्ण है।
- source_word: יִבְטָח
  choice: निडर रहते हैं
  rationale: בטח का मूल अर्थ भरोसा रखना, सुरक्षित होना या आश्वस्त होना हो सकता है। भागने के विपरीत और सिंह की उपमा में यहाँ निर्भीक आत्मविश्वास प्रमुख है; ‘निडर रहते हैं’ सामान्य सत्य और बहुवचन कर्ता के अनुरूप है।
theological_decisions:
- issue: नीतिवचन में नैतिक प्रकारों का एकवचन और बहुवचन
  choice: ‘दुष्ट’ को प्रतिनिधि एकवचन और ‘धर्मी लोग’ को बहुवचन वर्ग के रूप में रखना
  alternative: ‘दुष्ट लोग ... धर्मी लोग’ अथवा ‘एक दुष्ट व्यक्ति ... धर्मी जन’
  rationale: मूल पाठ में רָשָׁע एकवचन और צַדִּיקִים बहुवचन है। हिन्दी में इस व्याकरणिक विषमता को बनाए रखते हुए दोनों को सामान्य नैतिक प्रकारों के रूप में समझा जा सकता है; किसी विशिष्ट पुरुष व्यक्ति का अर्थ आरोपित नहीं किया गया।
- issue: יִבְטָח में भरोसे और निर्भीकता का संबंध
  choice: मुख्य पाठ में ‘निडर रहते हैं’
  alternative: ‘भरोसा रखते हैं’, ‘आश्वस्त रहते हैं’ या ‘साहसी होते हैं’
  rationale: मूल क्रिया में भरोसे अथवा सुरक्षा का भाव मौजूद है, किंतु समानांतरता में दुष्ट के भयभीत भागने के विपरीत धर्मियों की निर्भीकता उभरती है। पादटिप्पणी वैकल्पिक अर्थ-छायाओं को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, संक्षिप्त और गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘पीछा नहीं करता’ सामान्य बोलचाल में स्पष्ट है; ‘धर्मी’ बाइबिलीय नैतिक श्रेणी को बनाए रखता है; और ‘जवान सिंह’ כְּפִיר की विशिष्टता व्यक्त करता है।
