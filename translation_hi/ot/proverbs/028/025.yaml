  yaml_path: translation/ot/proverbs/028/025.yaml
  text: A greedy person stirs up strife[b][a], but the one who trusts in Yahweh will be enriched.
translation:
  language: hi
  text: लालची व्यक्ति झगड़ा भड़काता है,[a] पर जो याहवे पर भरोसा रखता है, वह समृद्ध होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “प्राण में विशाल” है—अर्थात अतृप्त लालसा रखने वाला। इसका अर्थ “घमंडी व्यक्ति” या “बड़ी भूख वाला व्यक्ति” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “पुष्ट किया जाएगा” है; यह हिब्रू में भरपूरी, समृद्धि और कुशल-मंगल की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְחַב נֶפֶשׁ
  choice: लालची व्यक्ति
  rationale: शाब्दिक अर्थ ‘मन/प्राण में विस्तृत’ है, जो यहाँ अतृप्त, अधिक पाने को लालायित स्वभाव का मुहावरा है। ‘लालची व्यक्ति’ आधुनिक हिन्दी में इसका नैतिक आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְגָרֶה
  choice: भड़काता है
  rationale: हिफ़ील रूप किसी बात को उकसाने या उत्पन्न करने का भाव देता है; झगड़े के साथ ‘भड़काना’ सहज और सटीक हिन्दी है।
- source_word: מָדוֹן
  choice: झगड़ा
  rationale: यह ज्ञान-साहित्य में विवाद, कलह या संघर्ष का सामान्य शब्द है। ‘झगड़ा’ आम पाठक के लिए स्पष्ट और संक्षिप्त है।
- source_word: וּבֹטֵחַ
  choice: पर जो ... भरोसा रखता है
  rationale: वाव को विरोधसूचक समानांतरता के कारण ‘पर’ से व्यक्त किया गया है। कृदन्त का चरित्र-वर्णनकारी भाव ‘जो ... भरोसा रखता है’ में बना रहता है।
- source_word: עַל יְהוָה
  choice: यहोवा पर
  rationale: हिब्रू संबंधसूचक ‘पर’ हिन्दी में ‘भरोसा रखना’ के साथ स्वाभाविक है। परमेश्वर के व्यक्तिगत वाचा-नाम को ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: יְדֻשָּׁן
  choice: फलता-फूलता रहेगा
  rationale: शाब्दिक रूप ‘हृष्ट-पुष्ट किया जाएगा’ है और समृद्धि, भरपूरी तथा कुशलता की छवि देता है। ‘फलता-फूलता रहेगा’ इस रूपक को केवल धन-संपत्ति तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यहोवा के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को किसी उपाधि में नहीं बदलता।
- issue: יְדֻשָּׁן में समृद्धि का स्वरूप
  choice: फलता-फूलता रहेगा
  alternative: समृद्ध किया जाएगा; हृष्ट-पुष्ट किया जाएगा
  rationale: यह अभिव्यक्ति भरपूरी और कल्याण का रूपक है; इसे केवल आर्थिक धन का निश्चित वादा मानना आशय को अनावश्यक रूप से संकुचित करेगा।
- issue: रְחַב נֶפֶשׁ का नैतिक आशय
  choice: लालची व्यक्ति
  alternative: घमंडी व्यक्ति; बड़ी भूख वाला व्यक्ति
  rationale: मुहावरा अतृप्त और अधिक हथियाने वाली अभिलाषा को सूचित कर सकता है। ‘लालची’ मुख्य संदर्भगत अर्थ देता है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘व्यक्ति’ प्रतिनिधिक पुल्लिंग को अनावश्यक रूप से पुरुष तक सीमित नहीं करता। दोनों अर्धपंक्तियों की विरोधी समानांतरता स्पष्ट रखी गई है।
