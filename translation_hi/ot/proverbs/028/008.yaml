revisions:
- from: 'जो ब्याज और मुनाफ़े से अपनी दौलत बढ़ाता है,

    वह उसे उस व्यक्ति के लिए बटोरता है जो गरीबों पर कृपा करता है[a][b]।'
  to: 'जो ब्याज और बढ़ोतरी से अपनी दौलत बढ़ाता है,

    वह उसे गरीबों पर कृपा करने वाले के लिए बटोरता है[a][b]।'
  rationale: 'The revision makes two limited improvements: it renders תַרְבִּית as ‘बढ़ोतरी’ rather than the broader ‘मुनाफ़ा’, and it smooths the final beneficiary phrase into natural Hindi. No interpretive claim about how the wealth changes hands has been added.'
