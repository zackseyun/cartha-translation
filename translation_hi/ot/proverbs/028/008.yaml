source:
  edition: WLC
  text: מַרְבֶּ֣ה ה֭וֹנ/וֹ בְּ/נֶ֣שֶׁךְ ו/ב/תרבית לְ/חוֹנֵ֖ן דַּלִּ֣ים יִקְבְּצֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/028/008.yaml
  text: Whoever increases his wealth by interest and profit gathers it for one who is gracious to the poor[a][b].
translation:
  language: hi
  text: 'जो ब्याज और बढ़ोतरी से अपनी दौलत बढ़ाता है,

    वह उसे गरीबों पर कृपा करने वाले के लिए बटोरता है[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूद और बढ़ोतरी से।” दोनों इब्रानी शब्द उधार देकर कमाए गए लाभ को दर्शाते हैं और उनमें प्रायः शोषण का भाव होता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो गरीबों के प्रति उदार है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְבֶּה
  choice: बढ़ाता है
  rationale: हिफ़ील कृदंत का अर्थ किसी वस्तु को अधिक करना है; ‘बढ़ाता है’ सहज और सटीक है।
- source_word: הוֹנוֹ
  choice: अपनी दौलत
  rationale: הוֹן धन-संपत्ति को दर्शाता है; ‘दौलत’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक कहावत के अनुकूल है।
- source_word: בְּנֶשֶׁךְ
  choice: ब्याज से
  rationale: נֶשֶׁךְ ऋण पर लिए गए ब्याज को दर्शाता है और प्रायः शोषणकारी भाव रखता है; मुख्य पाठ में ‘ब्याज’ स्पष्ट है और यह भाव पादटिप्पणी में बताया गया है।
- source_word: וּבְתַרְבִּית
  choice: और मुनाफ़े से
  rationale: תַּרְבִּית विशेषतः उधार पर वसूली गई बढ़ोतरी या लाभ है; ‘मुनाफ़ा’ पहले पद से भेद रखते हुए आर्थिक लाभ व्यक्त करता है।
- source_word: לְחוֹנֵן
  choice: उस व्यक्ति के लिए … जो … कृपा करता है
  rationale: חנן अनुग्रह या कृपा दिखाने को व्यक्त करता है। यह अनुवाद मूल के कृपाभाव को बनाए रखता है और לְ को लाभार्थी अर्थ में स्पष्ट करता है।
- source_word: דַּלִּים
  choice: गरीबों
  rationale: דלים निर्धन, दीन या निर्बल लोगों को दर्शाता है; आर्थिक संदर्भ में ‘गरीबों’ सबसे सीधा विकल्प है।
- source_word: יִקְבְּצֶנּוּ
  choice: उसे … बटोरता है
  rationale: קבץ का अर्थ इकट्ठा या बटोरना है; सर्वनाम धन की ओर लौटता है और कथन की विडंबना सुरक्षित रहती है।
theological_decisions:
- issue: धन अंततः किसके लिए इकट्ठा होता है
  choice: उस व्यक्ति के लिए जो गरीबों पर कृपा करता है
  alternative: गरीबों के प्रति उदार व्यक्ति के लिए
  rationale: मूल पाठ धन के अंतिम हस्तांतरण की रीति या कर्ता नहीं बताता; इसलिए केवल लाभार्थी को व्यक्त किया गया है और दैवी हस्तक्षेप जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त नीतिवचनात्मक शैली और गरिमामय किंतु सामान्य शब्दावली। ‘मुनाफ़ा’ और ‘दौलत’ व्यापक रूप से समझे जाने वाले हिन्दुस्तानी शब्द हैं। मूल की दो पंक्तियों वाली लय और धन के विडंबनापूर्ण अंतिम लाभार्थी को बनाए रखा गया है।
