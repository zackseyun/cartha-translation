review_pass:
  verdict: revise
  source_fidelity: 'The verse is rendered faithfully overall: the participial subject, personal wealth, the paired lending-related terms, the beneficiary marked by לְ, the poor, and the pronominal object of ‘gathers’ are all retained. Replacing ‘मुनाफ़े’ with ‘बढ़ोतरी’ more directly reflects תַרְבִּית, which denotes an added amount/increase, especially in a lending context, rather than ordinary commercial profit.'
  naturalness: The revised wording is concise and idiomatic in modern standard Hindi. ‘गरीबों पर कृपा करने वाले’ is smoother than ‘जो गरीबों पर कृपा करता है’ while preserving the participial description.
  terminology: ‘ब्याज’ and ‘बढ़ोतरी’ preserve the distinct but related Hebrew lending terms. ‘कृपा’ appropriately represents חנן without importing a more specific doctrinal interpretation.
  issues:
  - severity: low
    issue: ‘मुनाफ़े’ can suggest general business profit.
    rationale: תַרְבִּית refers more specifically to an increment or additional amount, commonly in lending; ‘बढ़ोतरी’ better preserves that lexical sense and the pairing with ‘ब्याज’.
  - severity: low
    issue: The relative clause ‘जो गरीबों पर कृपा करता है’ is somewhat less polished than a participial phrase.
    rationale: ‘गरीबों पर कृपा करने वाले के लिए’ is a natural Hindi rendering of לְחוֹנֵן דַּלִּים and keeps the source’s descriptive participle.
  revised_text: 'जो ब्याज और बढ़ोतरी से अपनी दौलत बढ़ाता है,

    वह उसे गरीबों पर कृपा करने वाले के लिए बटोरता है[a][b]।'
  revised_footnotes:
