id: PRO.24.15
reference: Proverbs 24:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תֶּאֱרֹ֣ב רָ֭שָׁע לִ/נְוֵ֣ה צַדִּ֑יק אַֽל תְּשַׁדֵּ֥ד רִבְצ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/015.yaml
  text: Do not lie in wait[a], O wicked man, against the dwelling of the righteous[b]; do not devastate his resting place.
translation:
  language: hi
  text: हे दुष्ट, धर्मी के निवास पर घात न लगा[a]; उसके विश्राम-स्थान को उजाड़ न दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धर्मी के घर पर घात न लगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “उसके लेटने की जगह” या “उसके चैन से रहने की जगह” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: न … लगा / न … दे
  rationale: निषेधात्मक आज्ञा को आधुनिक और स्वाभाविक हिन्दी में सीधे आदेश के रूप में व्यक्त करता है।
- source_word: תֶּאֱרֹב
  choice: घात न लगा
  rationale: ארב का अर्थ छिपकर अवसर की प्रतीक्षा करना या घात लगाना है; यह चयन उसके हिंसक और शिकारी भाव को बनाए रखता है।
- source_word: רָשָׁע
  choice: हे दुष्ट
  rationale: पुल्लिंग एकवचन में सीधे संबोधन को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לִנְוֵה
  choice: निवास पर
  rationale: נוה निवास या बसेरे को सूचित करता है; ל यहाँ लक्ष्य की ओर शत्रुतापूर्ण रुख दर्शाता है, जिसे हिन्दी में ‘पर’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: नैतिक रूप से धर्मी व्यक्ति के लिए प्रचलित बाइबलीय हिन्दी शब्द है और मूल के एकवचन संदर्भ को बनाए रखता है।
- source_word: תְּשַׁדֵּד
  choice: उजाड़ न दे
  rationale: שדד में हिंसक रूप से नष्ट, बरबाद या लूटकर उजाड़ देने का भाव है; ‘उजाड़ देना’ केवल चोरी तक अर्थ को सीमित नहीं करता।
- source_word: רִבְצוֹ
  choice: उसके विश्राम-स्थान
  rationale: רבץ से बना यह शब्द लेटने या चैन से रहने की जगह का बिंब देता है; ‘विश्राम-स्थान’ इसे मनुष्य के संदर्भ में स्वाभाविक रूप से व्यक्त करता है।
