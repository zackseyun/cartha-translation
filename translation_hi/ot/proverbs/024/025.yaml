lexical_decisions:
- source_word: וְלַמּוֹכִיחִים
  choice: परन्तु जो उचित डाँट देते हैं
  rationale: יכח का कृदन्त उन लोगों को दर्शाता है जो आवश्यक भर्त्सना, सुधार या दोष-निर्देशन करते हैं। पिछले पद से विरोध दिखाने के लिए וְ को ‘परन्तु’ किया गया है। ‘उचित’ संदर्भगत आशय स्पष्ट करता है कि यहाँ सही सुधार की बात है, मनमानी निन्दा की नहीं।
- source_word: יִנְעָם
  choice: उनका भला होगा
  rationale: נעם सुखद, मनोहर या अनुकूल होने का भाव देता है। अवैयक्तिक हिब्रू अभिव्यक्ति को सहज हिन्दी में परिणाम को अनावश्यक रूप से निश्चित किए बिना ‘उनका भला होगा’ कहा गया है।
- source_word: וַעֲלֵיהֶם תָּבוֹא
  choice: और उन पर ... आएगी
  rationale: पूर्वसर्ग עַל प्राप्तकर्ताओं को सूचित करता है और בוא का सामान्य अर्थ ‘आना’ है; हिन्दी में आशीष के साथ यह बिंब स्वाभाविक है।
- source_word: בִרְכַּת טוֹב
  choice: भलाई की आशीष
  rationale: शाब्दिक संरचना ‘भलाई/अच्छाई की आशीष’ है। यह अनुकूल और हितकारी आशीष का अर्थ रखती है तथा ‘अच्छी आशीष’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है।
