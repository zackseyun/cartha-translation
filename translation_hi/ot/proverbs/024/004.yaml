  text: and by knowledge rooms are filled with all precious and pleasant wealth[a][b][c].
translation:
  language: hi
  text: और ज्ञान से कमरे हर प्रकार की बहुमूल्य और मनभावनी सम्पत्ति से भर जाते हैं[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कमरे’ के स्थान पर ‘भीतरी कक्ष’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: ‘भर जाते हैं’ का अनुवाद ‘भर जाएँगे’ भी किया जा सकता है; इब्रानी अपूर्ण क्रिया भविष्य का भाव दे सकती है, जबकि यहाँ इसे नीतिवचन के सामान्य सत्य के रूप में प्रस्तुत किया गया है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से: ‘सारी सम्पत्ति—बहुमूल्य और मनभावनी।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַעַת
  choice: और ज्ञान से
  rationale: संयोजक וּ और साधनसूचक בְ दोनों व्यक्त होते हैं; पिछले पद के समानांतर ज्ञान को वह साधन बताया गया है जिससे घर के कमरे सम्पन्न होते हैं।
- source_word: חֲדָרִים
  choice: कमरे
  rationale: यह घर के भीतर के कमरों या कोठरियों को दर्शाता है। आधुनिक मानक हिन्दी में ‘कमरे’ सबसे स्वाभाविक और स्पष्ट है।
- source_word: יִמָּלְאוּ
  choice: भर जाते हैं
  rationale: निफ़अल अपूर्ण रूप को नीतिवचन के सामान्य, बार-बार सत्य सिद्ध होने वाले कथन के रूप में वर्तमान काल में व्यक्त किया गया है; भविष्यकाल भी व्याकरणतः सम्भव है।
- source_word: כָּל הוֹן
  choice: हर प्रकार की ... सम्पत्ति
  rationale: כָּל के साथ एकवचन सामूहिक संज्ञा הוֹן का वितरणात्मक भाव स्वाभाविक हिन्दी में ‘हर प्रकार की सम्पत्ति’ से स्पष्ट होता है।
- source_word: יָקָר
  choice: बहुमूल्य
  rationale: यह मूल्यवान या कीमती होने का भाव देता है; ‘बहुमूल्य’ ज्ञान-साहित्य की गरिमामय शैली के अनुकूल है।
- source_word: וְנָעִים
  choice: और मनभावनी
  rationale: यह सुखद, रुचिकर और वांछनीय होने का भाव रखता है; ‘मनभावनी’ केवल आर्थिक मूल्य से आगे उसकी आकर्षकता भी व्यक्त करता है।
