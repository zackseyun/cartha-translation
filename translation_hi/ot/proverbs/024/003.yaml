  text: By wisdom a house is built[b][a], and by understanding it is established.
translation:
  language: hi
  text: बुद्धि से घर[a] बनता है, और समझ से वह स्थिर होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घराना’; यहाँ ‘घर’ का अर्थ मकान और, व्यापक रूप से, परिवार या घराना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्थापित होता है’ या ‘दृढ़ होता है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּחָכְמָה
  choice: बुद्धि से
  rationale: यहाँ בְ साधन या माध्यम को दर्शाता है। ‘बुद्धि से’ स्वाभाविक हिन्दी है और नीतिवचन के सामान्य सत्य को स्पष्ट रखता है।
- source_word: יִבָּנֶה
  choice: बनता है
  rationale: बנה का निफ़अल अपूर्ण रूप यहाँ सूक्तिपरक सामान्य वर्तमान का भाव देता है। ‘बनता है’ निष्क्रिय अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּיִת
  choice: घर
  rationale: בַּיִת का अर्थ भौतिक मकान और विस्तार से परिवार या घराना भी हो सकता है। ‘घर’ मूल बिंब और उसके व्यापक मानवीय अर्थ दोनों को सम्भव बनाए रखता है।
- source_word: וּבִתְבוּנָה
  choice: और समझ से
  rationale: תְּבוּנָה विवेकपूर्ण समझ या सूझ-बूझ को दर्शाता है। ‘समझ’ सरल, वर्तमान और ‘बुद्धि’ के समानांतर स्वाभाविक है।
- source_word: יִתְכּוֹנָן
  choice: वह दृढ़ किया जाता है
  rationale: כון का यह रूप स्थापित किए जाने, स्थिर किए जाने या दृढ़ किए जाने का परिणामसूचक भाव देता है। ‘दृढ़ किया जाता है’ निर्माण के समानांतर रहते हुए स्थिरता का आशय स्पष्ट करता है।
