  text: הִ֭תְרַפִּיתָ בְּ/י֥וֹם צָרָ֗ה צַ֣ר כֹּחֶֽ/כָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/010.yaml
  text: If you falter in a day of distress[a], your strength is small.
translation:
  language: hi
  text: यदि तू संकट के दिन ढीला पड़ जाए[a], तो तेरा बल कम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यदि तू संकट के दिन अपने को निर्बल दिखाए, तो तेरा बल सीमित है।’
    reason: הִתְרַפִּיתָ और צַר के अधिक शाब्दिक वैकल्पिक अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הִתְרַפִּיתָ
  choice: तू ढीला पड़ जाए
  rationale: हित्पाएल रूप संकट के सामने शिथिल, निर्बल या निरुत्साहित पड़ने का भाव देता है। ‘ढीला पड़ जाए’ आधुनिक और सहज हिंदी में शारीरिक तथा मनोबल—दोनों की कमी का संकेत दे सकता है और कथन की नैतिक धार बनाए रखता है।
- source_word: בְּיוֹם
  choice: के दिन
  rationale: בְּ के साथ ‘दिन’ यहाँ समयसूचक है। ‘संकट के दिन’ हिंदी नीतिवचन-शैली में संक्षिप्त और स्वाभाविक है।
- source_word: צָרָה
  choice: संकट
  rationale: यह शब्द विपत्ति, क्लेश या संकट को दर्शाता है। ‘संकट’ सामान्य आधुनिक हिंदी में स्पष्ट है और दबावपूर्ण परिस्थिति का भाव रखता है।
- source_word: צַר
  choice: कम है
  rationale: विशेषण का मूल भाव ‘संकरा/सीमित’ है; बल के संबंध में यह अपर्याप्त मात्रा बताता है। ‘कम है’ हिंदी में स्वाभाविक रहते हुए उस सीमितता को व्यक्त करता है।
- source_word: כֹּחֶךָ
  choice: तेरा बल
  rationale: כֹּחַ का सीधा अर्थ बल, शक्ति या सामर्थ्य है। ‘बल’ पद्यात्मक संक्षिप्तता रखता है और इस नीतिवचन में आंतरिक दृढ़ता सहित सामर्थ्य को व्यक्त कर सकता है।
