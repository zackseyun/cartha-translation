  register: आधुनिक मानक हिंदी में संक्षिप्त, स्मरणीय नीतिवचन-शैली रखी गई है। एकवचन संबोधन के लिए ‘तू/तेरा’ मूल इब्रानी के सीधे व्यक्तिगत संबोधन और पारंपरिक ज्ञान-साहित्य की निकटता को बनाए रखता है।
