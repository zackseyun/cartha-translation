source:
  edition: WLC
  text: יְרָֽא אֶת יְהוָ֣ה בְּנִ֣/י וָ/מֶ֑לֶךְ עִם שׁ֝וֹנִ֗ים אַל תִּתְעָרָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/021.yaml
  text: Fear Yahweh[a], my son, and the king; do not associate with those who are given to change.
translation:
  language: hi
  text: मेरे बेटे, यहोवा[a] और राजा का भय मान; जो लोग बदलाव की ओर झुके हुए हैं, उनके साथ मेल-जोल न रख।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (य्ह्व्ह) है, जिसे यहाँ ‘यहोवा’ लिखा गया है।
    reason: divine_name
  - marker: b
    text: या, “विद्रोहियों के साथ मत मिल।” इब्रानी में शाब्दिक अर्थ उन लोगों से है जो “बदलते हैं” या बदलाव की ओर प्रवृत्त हैं; संभवतः ऐसे लोग जो उथल-पुथल या निष्ठाहीन बदलाव की ओर झुके हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרָא
  choice: भय मान
  rationale: नीतिवचन के ज्ञान-साहित्य में यह क्रिया श्रद्धापूर्ण भय और उससे उपजनेवाली निष्ठावान आज्ञाकारिता को व्यक्त करती है। ‘भय मान’ इस अर्थ-तनाव को ‘आदर कर’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: मूल पाठ स्पष्टतः पुल्लिंग एकवचन संबोधन है और नीतिवचन की पिता-पुत्र शिक्षण शैली का प्रमुख अंग है।
- source_word: וָמֶלֶךְ
  choice: और राजा
  rationale: संयोजक उसी आज्ञा के साथ दूसरे कर्म को जोड़ता है। हिन्दी में ‘राजा’ इस सामान्य ज्ञान-राजनीतिक संदर्भ के लिए स्वाभाविक है।
- source_word: שׁוֹנִים
  choice: बदलाव चाहनेवालों
  rationale: शब्द का शाब्दिक संबंध ‘बदलने’ से है और यहाँ अस्थिरता, सत्ता-परिवर्तन या विद्रोही बदलाव की ओर झुकाव रखनेवालों का संकेत हो सकता है। मुख्य पाठ में व्यापक शब्द रखकर संभावित राजनीतिक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: אַל תִּתְעָרָב
  choice: मेल-जोल न रख
  rationale: हित्पएल रूप किसी समूह में अपने को मिलाने या उससे निकट संबंध रखने का भाव देता है। ‘मेल-जोल न रख’ आधुनिक हिन्दी में स्वाभाविक और चेतावनी के प्रसंग के अनुकूल है।
theological_decisions:
- issue: यहोवा और राजा—दोनों के प्रति भय का संबंध
  choice: 'एक ही आज्ञा के अंतर्गत दोनों कर्म रखे गए: ‘यहोवा और राजा का भय मान।’'
  alternative: ‘यहोवा का भय मान और राजा का आदर कर’ कहकर दोनों के लिए अलग क्रियाएँ देना।
  rationale: इब्रानी वाक्य-विन्यास एक ही क्रिया को यहोवा और राजा दोनों से जोड़ता है। अनुवाद इस तनाव को सुरक्षित रखता है, पर यह नहीं कहता कि दोनों का अधिकार या दर्जा समान है।
- issue: שׁוֹנִים का सामाजिक-राजनीतिक आशय
  choice: मुख्य पाठ में ‘बदलाव चाहनेवालों’ और पादटिप्पणी में ‘विद्रोहियों’ की संभावना।
  alternative: मुख्य पाठ में सीधे ‘विद्रोहियों’ कहना।
  rationale: संदर्भ राजनिष्ठा या उथल-पुथल की ओर संकेत करता है, लेकिन मूल शब्द स्वयं शाब्दिक रूप से ‘बदलनेवालों’ को बताता है। इसलिए अधिक निश्चित राजनीतिक व्याख्या को मुख्य पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे मेरे बेटे’ ज्ञान-साहित्य के पितृ-संबोधन को बनाए रखता है। ‘भय मान’ बाइबलीय हिन्दी में परिचित है, जबकि ‘मेल-जोल न रख’ सामान्य पाठक के लिए स्वाभाविक है।
