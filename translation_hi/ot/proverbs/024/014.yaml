  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। एकवचन आत्मीय संबोधन 'तू/तेरा' नीतिवचन में पिता से पुत्र के सीधे संबोधन के अनुरूप रखा गया है। 'प्राण' और 'काटी जाएगी' मूल इब्रानी बिंबों को सुरक्षित रखते हैं।
