language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֵּ֤ן דְּעֶ֥/ה חָכְמָ֗ה לְ/נַ֫פְשֶׁ֥/ךָ אִם מָ֭צָאתָ וְ/יֵ֣שׁ אַחֲרִ֑ית וְ֝/תִקְוָתְ/ךָ֗ לֹ֣א תִכָּרֵֽת׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/014.yaml
  text: 'Know that wisdom is thus for your soul: if you find it[a], then there is a future[b], and your hope will not be cut off.'
translation:
  language: hi
  text: इसी तरह जान ले कि बुद्धि तेरे प्राण के लिए है; यदि तू उसे पाए[a], तो तेरा भविष्य है[b], और तेरी आशा काटी नहीं जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तू उसे पा चुका है।”
    reason: इब्रानी पूर्ण क्रिया के कालगत अर्थ की वैकल्पिक सम्भावना।
  - marker: b
    text: या, “तब एक परिणाम है” अथवा “तब एक अन्त है”; इब्रानी אַחֲרִית किसी व्यक्ति के अन्तिम परिणाम, अन्त या भावी संभावना को दर्शा सकता है।
    reason: मूल शब्द की वास्तविक अर्थ-व्याप्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: כֵּן
  choice: इसी तरह
  rationale: यह पिछले पद में मधु की भलाई और इस पद में बुद्धि की भलाई के बीच उपमा-संबंध बनाए रखता है।
- source_word: דְּעֶה
  choice: जान ले
  rationale: एकवचन संबोधन में आज्ञार्थक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन के प्रमुख विषय חָכְמָה का मानक और संगत हिन्दी रूप है।
- source_word: לְנַפְשֶׁךָ
  choice: तेरे प्राण के लिए
  rationale: נֶפֶשׁ के जीवन, स्वयं और भीतरी प्राणी से जुड़े व्यापक अर्थ को अपेक्षाकृत मूर्त रूप में सुरक्षित रखता है।
- source_word: אִם מָצָאתָ
  choice: यदि तू उसे पा ले
  rationale: इब्रानी की शर्तसूचक रचना को बनाए रखता है; स्त्रीलिंग 'उसे' का संकेत बुद्धि की ओर है।
- source_word: וְיֵשׁ אַחֲרִית
  choice: तो तेरा भविष्य है
  rationale: אַחֲרִית यहाँ अंत, परिणाम या भावी संभावना का संकेत दे सकता है; आशा के समानांतर 'भविष्य' संदर्भानुकूल है।
- source_word: וְתִקְוָתְךָ
  choice: और तेरी आशा
  rationale: תִּקְוָה का सामान्य अर्थ 'आशा' है और यह भविष्य की धारणा के साथ स्वाभाविक जोड़ी बनाता है।
- source_word: לֹא תִכָּרֵת
  choice: नहीं काटी जाएगी
  rationale: כרת के मूल रूपक को बचाता है और आशा के समाप्त न होने का सशक्त भाव देता है।
