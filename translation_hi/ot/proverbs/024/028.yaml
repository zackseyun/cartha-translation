  yaml_path: translation/ot/proverbs/024/028.yaml
  text: Do not be a witness against your neighbor without cause[b][a], and do not deceive with your lips.
translation:
  language: hi
  text: अपने पड़ोसी के विरुद्ध अकारण[a] गवाह न बनो; और क्या तुम अपने होंठों से छल करोगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अकारण” का अनुवाद “बिना किसी कारण के” या “बिना आधार के” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह अलंकारिक प्रश्न पहले निषेध को आगे बढ़ाता है; भावार्थ: “और अपने होंठों से छल न करो।”'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: אַל תְּהִי
  choice: न बनो
  rationale: निषेधवाचक אַל के साथ היה का रूप सीधे निषेध को व्यक्त करता है; हिंदी में “न बनो” स्वाभाविक और स्पष्ट है।
- source_word: עֵד
  choice: गवाह
  rationale: यह शब्द न्यायिक या अर्ध-न्यायिक प्रसंग में साक्षी देने वाले व्यक्ति को दर्शाता है; “गवाह” सामान्य आधुनिक हिंदी का उपयुक्त शब्द है।
- source_word: חִנָּם
  choice: अकारण
  rationale: यहाँ क्रिया का आशय बिना उचित कारण या आधार के गवाही देना है; “अकारण” संक्षिप्त रूप में वही नैतिक और न्यायिक भाव देता है।
- source_word: בְּרֵעֶךָ
  choice: अपने पड़ोसी के विरुद्ध
  rationale: עֵד के साथ בְּ उस व्यक्ति को सूचित करता है जिसके विरुद्ध गवाही दी जाती है; רֵעַ के सामाजिक संबंध को “पड़ोसी” सुरक्षित रखता है।
- source_word: וַהֲפִתִּיתָ
  choice: और क्या तुम ... धोखा दोगे?
  rationale: रूप में संयोजक וַ के बाद प्रश्नवाचक הֲ और פתה का रूप है। इसलिए मूल की अलंकारिक प्रश्नवाचकता को बनाए रखा गया है, जबकि संदर्भ में इसका बल निषेधात्मक है।
- source_word: בִּשְׂפָתֶיךָ
  choice: अपने होंठों से
  rationale: यह वाणी के लिए प्रयुक्त ठोस इब्रानी बिंब है और हिंदी में भी स्पष्ट तथा स्वाभाविक है।
theological_decisions:
- issue: दूसरे खंड का व्याकरणिक और नैतिक बल
  choice: 'अलंकारिक प्रश्न के रूप में प्रस्तुत किया: “और क्या तुम ... धोखा दोगे?”'
  alternative: “और अपने होंठों से धोखा न दो”
  rationale: संदर्भ इसे निषेध के समान नैतिक बल देता है, पर मसोराई पाठ में उपस्थित प्रश्नवाचक הֲ को चुपचाप हटाना उचित नहीं। मुख्य पाठ मूल रूप को रखता है और पादटिप्पणी उसके निषेधात्मक अर्थ को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “गवाह,” “पड़ोसी” और “होंठों” जैसे परिचित शब्द मूल के न्यायिक-सामाजिक संदर्भ और ठोस काव्यात्मक बिंब को बनाए रखते हैं।
