  edition: WLC
  text: אַל תֹּאמַ֗ר כַּ/אֲשֶׁ֣ר עָֽשָׂה לִ֭/י כֵּ֤ן אֶֽעֱשֶׂה לּ֑/וֹ אָשִׁ֖יב לָ/אִ֣ישׁ כְּ/פָעֳלֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/029.yaml
  text: Do not say[a], “As he has done to me, so I will do to him; I will repay the man according to his deed.”
translation:
  language: hi
  text: यह मत कह, “जैसा उसने मेरे साथ किया है, वैसा ही मैं उसके साथ करूँगा; मैं उस आदमी को उसके किए के अनुसार बदला चुकाऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उस आदमी को उसके किए के अनुसार प्रतिफल दूँगा।”
    reason: אָשִׁיב और כְּפָעֳלוֹ को प्रतिशोधात्मक ‘बदला चुकाऊँगा’ के बजाय अधिक सामान्य प्रतिफल की भाषा में भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: मत कह
  rationale: निषेधसूचक אַל के साथ अपूर्ण क्रिया यहाँ सीधे निषेध को व्यक्त करती है; आधुनिक हिन्दी में ‘मत कह’ स्वाभाविक और सटीक है।
- source_word: כַּאֲשֶׁר עָשָׂה לִי כֵּן אֶעֱשֶׂה לּוֹ
  choice: जैसा उसने मेरे साथ किया है, वैसा ही मैं उसके साथ करूँगा
  rationale: ‘जैसा…वैसा ही’ मूल के तुलनात्मक ढाँचे और उसी प्रकार प्रत्युत्तर देने के संकल्प को सुरक्षित रखता है। ‘मेरे/उसके साथ’ हिन्दी में व्यक्तिगत व्यवहार के लिए ‘मुझको/उसको’ से अधिक स्वाभाविक है।
- source_word: אָשִׁיב
  choice: बदला दूँगा
  rationale: שׁוב के हिफ़ील रूप का मूल भाव ‘लौटाना’ है और इस प्रसंग में इसका अर्थ किए का प्रत्युत्तर या प्रतिफल देना है। ‘बदला दूँगा’ व्यक्तिगत प्रतिशोध के आशय को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: לָאִישׁ
  choice: उस आदमी को
  rationale: אִישׁ एकवचन पुरुषवाचक संज्ञा है और यहाँ पहले उल्लिखित अपराधी व्यक्ति की ओर संकेत करती है; ‘उस आदमी को’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כְּפָעֳלוֹ
  choice: उसके किए के अनुसार
  rationale: פֹּעַל का अर्थ काम, कार्य या किया हुआ कर्म है। इस प्रसंग में ‘उसके किए के अनुसार’ औपचारिक समानुपात को बनाए रखते हुए ‘उसके काम के अनुसार’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: व्यक्तिगत प्रतिशोध के विषय में इस नीतिवचन का नैतिक बल
  choice: पद प्रतिशोधपूर्ण कथन और उसी अनुपात में स्वयं बदला चुकाने के संकल्प को मना करता है।
  alternative: इसे हर प्रकार के दंडात्मक न्याय का पूर्ण निषेध या केवल उतावली बात के विरुद्ध व्यावहारिक चेतावनी माना जाए।
  rationale: मूल पाठ का सीधा लक्ष्य वह व्यक्ति है जो अपने साथ किए गए व्यवहार का वैसा ही प्रत्युत्तर देने और बदला चुकाने की बात करता है। अनुवाद इस नैतिक बल को रखता है, पर नागरिक न्याय के बारे में ऐसी व्यापक शिक्षा नहीं जोड़ता जो पद में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मत कह’ नीतिवचन की सीधी चेतावनी को बनाए रखता है; ‘जैसा…वैसा ही’ मूल की सममित रचना को सुनने योग्य हिन्दी में प्रस्तुत करता है।
