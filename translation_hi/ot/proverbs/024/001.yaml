  text: אַל תְּ֭קַנֵּא בְּ/אַנְשֵׁ֣י רָעָ֑ה וְ/אַל תתאו לִ/הְי֥וֹת אִתָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/001.yaml
  text: Do not envy evil men[b][a], and do not desire to be with them.
translation:
  language: hi
  text: बुरे मनुष्यों से ईर्ष्या मत कर, और उनके साथ होने की इच्छा मत कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: ईर्ष्या मत कर
  rationale: निषेधवाचक אַל के साथ क्रिया यहाँ स्पष्ट मनाही व्यक्त करती है; קנא इस संदर्भ में बुरे लोगों की स्थिति या सफलता को देखकर उनके समान पाने की ईर्ष्यापूर्ण चाह को दर्शाता है।
- source_word: בְּאַנְשֵׁי רָעָה
  choice: बुरे मनुष्यों से
  rationale: शाब्दिक अर्थ ‘बुराई के मनुष्य’ है। ‘बुरे मनुष्य’ मूल के पुल्लिंग बहुवचन और नैतिक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है; קנא के साथ ‘से’ हिन्दी का सामान्य कारक है।
- source_word: וְאַל תתאו
  choice: और न ... इच्छा कर
  rationale: दूसरा निषेध पहले के समानांतर है। אוה इच्छा या लालसा रखने को व्यक्त करता है; ‘इच्छा कर’ मूल की व्यापकता को बिना भाव की तीव्रता बढ़ाए सुरक्षित रखता है।
- source_word: לִהְיוֹת אִתָּם
  choice: उनके साथ रहने की
  rationale: היה और אֵת का सीधा अर्थ ‘उनके साथ होना’ है। हिन्दी में ‘उनके साथ रहने’ से संगति और साथ होने, दोनों का भाव स्वाभाविक रूप से व्यक्त होता है।
theological_decisions: []
