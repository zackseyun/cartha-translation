  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। एकवचन संबोधन के अनुरूप ‘कर’ प्रयोग किया गया है; ‘मनुष्यों’ मूल के स्पष्ट पुल्लिंग बहुवचन को बनाए रखता है।
