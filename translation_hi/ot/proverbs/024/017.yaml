  text: בִּ/נְפֹ֣ל אויבי/ך אַל תִּשְׂמָ֑ח וּ֝/בִ/כָּשְׁל֗/וֹ אַל יָגֵ֥ל לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/017.yaml
  text: Do not rejoice when your enemy falls[a], and do not let your heart exult when he stumbles,
translation:
  language: hi
  text: जब तुम्हारा शत्रु गिरे, तब प्रसन्न न हो; और जब वह ठोकर खाए, तब तुम्हारा मन उल्लसित न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְפֹל
  choice: जब ... गिरे
  rationale: ב के साथ infinitive construct यहाँ कालवाचक है; ‘जब ... गिरे’ इस इब्रानी प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹיְבֶיךָ
  choice: तुम्हारा शत्रु
  rationale: अगले खंड का एकवचन प्रत्यय एकवचन अर्थ का समर्थन करता है; ‘शत्रु’ आधुनिक हिन्दी में सीधा और गरिमापूर्ण विकल्प है।
- source_word: אַל תִּשְׂמָח
  choice: आनन्दित न हो
  rationale: אַל के साथ imperfect निषेध व्यक्त करता है, और שמח प्रसन्नता या आनन्द को दर्शाता है।
- source_word: וּבִכָּשְׁלוֹ
  choice: और जब वह ठोकर खाए
  rationale: यह रचना भी कालवाचक है; ‘ठोकर खाए’ כשל को נפל (‘गिरे’) से अलग रखता है।
- source_word: יָגֵל לִבֶּךָ
  choice: तुम्हारा मन मग्न न हो
  rationale: גיל प्रबल या उल्लसित आनन्द व्यक्त कर सकता है। हिन्दी में ‘मन मग्न होना’ आन्तरिक उल्लास को स्वाभाविक ढंग से व्यक्त करता है, जबकि לב के आन्तरिक व्यक्ति-संबंधी भाव को ‘मन’ संप्रेषित करता है।
