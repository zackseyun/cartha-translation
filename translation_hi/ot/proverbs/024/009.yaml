source:
  edition: WLC
  text: זִמַּ֣ת אִוֶּ֣לֶת חַטָּ֑את וְ/תוֹעֲבַ֖ת לְ/אָדָ֣ם לֵֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/009.yaml
  text: The scheme of folly is sin[b][a], and a scoffer is an abomination to mankind.
translation:
  language: hi
  text: मूर्खता की योजना पाप है, और उपहास करनेवाला लोगों के लिए[a] घृणित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मनुष्य के लिए’; यहाँ इब्रानी शब्द אָדָם सामान्य रूप से सभी लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִמַּת
  choice: योजना
  rationale: यह शब्द सोची या गढ़ी गई योजना अथवा मंशा को व्यक्त करता है। ‘योजना’ विचारपूर्वक रचे जाने के भाव को बनाए रखता है, पर अनिवार्य रूप से ‘षड्यंत्र’ जैसा अधिक संकीर्ण अर्थ नहीं जोड़ता।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह किसी मूर्ख व्यक्ति के बजाय मूर्खता के अमूर्त गुण या आचरण को दर्शाता है; ‘मूर्खता’ नीतिवचन की ज्ञान-साहित्यिक भाषा में स्वाभाविक है।
- source_word: חַטָּאת
  choice: पाप
  rationale: इब्रानी संज्ञा यहाँ विधेय के रूप में प्रयुक्त है—मूर्खता की योजना ‘पाप’ है। सीधा संज्ञात्मक अनुवाद मूल वाक्य की संक्षिप्तता बनाए रखता है।
- source_word: לֵץ
  choice: उपहास करनेवाला
  rationale: यह नीतिवचन में ऐसे व्यक्ति को दर्शाता है जो घमंड से उपहास करता और सुधार को ठुकराता है। ‘उपहास करनेवाला’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: תוֹעֲבַת
  choice: घृणित
  rationale: यह प्रबल घृणा और अस्वीकार का भाव रखता है। हिन्दी में ‘लोगों के लिए घृणित’ स्वाभाविक विधेयात्मक अभिव्यक्ति है और ‘घृणित वस्तु’ जैसे असहज शाब्दिक रूप से बचती है।
- source_word: לְאָדָם
  choice: लोगों के लिए
  rationale: אָדָם यहाँ किसी एक पुरुष का नहीं, सामान्य रूप से मानव-समुदाय का बोध कराता है। ‘लोगों के लिए’ इस व्यापक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לְאָדָם में सामान्य मानवता का अर्थ
  choice: लोगों के लिए
  alternative: मनुष्य के लिए / मानवजाति के लिए
  rationale: एकवचन אָדָם का प्रयोग यहाँ जातिवाचक और समावेशी है। ‘लोगों’ से इसका सामान्य मानवीय संदर्भ स्पष्ट होता है, जबकि किसी खास पुरुष या केवल एक व्यक्ति का अर्थ नहीं निकलता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमापूर्ण शैली के अनुरूप रखी गई है। ‘मूर्खता की योजना’ मूल के संक्षिप्त संज्ञात्मक संबंध और उसकी संभावित अर्थ-व्याप्ति को बनाए रखता है; इसे अधिक व्याख्यात्मक ‘मूर्खतापूर्ण योजना’ नहीं बनाया गया।
