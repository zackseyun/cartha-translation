id: PRO.24.22
reference: Proverbs 24:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי פִ֭תְאֹם יָק֣וּם אֵידָ֑/ם וּ/פִ֥יד שְׁ֝נֵי/הֶ֗ם מִ֣י יוֹדֵֽעַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/022.yaml
  text: For their disaster will rise suddenly[b][a], and who knows the ruin of them both?
translation:
  language: hi
  text: क्योंकि उनकी विपत्ति अचानक आ पड़ेगी,[a] और उन दोनों का विनाश कौन जानता है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उनकी विपत्ति अचानक उठ खड़ी होगी।”
    reason: इब्रानी क्रिया का अधिक शाब्दिक विकल्प।
  - marker: b
    text: “उन दोनों” से सम्भवतः पिछले पद में उल्लिखित प्रभु और राजा अभिप्रेत हैं। इब्रानी वाक्यांश में ‘विनाश’ का उन दोनों से संबंध पूरी तरह स्पष्ट नहीं है; इसे “उन दोनों का विनाश” अथवा उनके द्वारा आनेवाला विनाश समझा जा सकता है।
    reason: ‘दोनों’ के संदर्भ और विनाश से उसके संबंध की व्याख्यात्मक अस्पष्टता सुरक्षित रखता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक कारणसूचक संयोजक है।
- source_word: פִתְאֹם
  choice: अचानक
  rationale: यह घटना की आकस्मिकता और चेतावनी के तीखेपन को स्पष्ट रूप से व्यक्त करता है।
- source_word: יָקוּם
  choice: आ पड़ेगी
  rationale: קום का मूल बिंब ‘उठना/खड़ा होना’ है, पर विपत्ति के साथ ‘अचानक आ पड़ना’ स्वाभाविक हिन्दी है और उसके सहसा उपस्थित होने का भाव बनाए रखता है।
- source_word: אֵידָם
  choice: उनकी ओर से विपत्ति
  rationale: אֵיד का अर्थ भारी विपत्ति या संकट है। प्रत्यय को प्रसंग में स्रोत-संबंध के रूप में व्यक्त किया गया है, अर्थात पिछली पंक्ति में उल्लिखित प्रभु और राजा की ओर से आनेवाली विपत्ति; वैकल्पिक संबंध पादटिप्पणी में रखा गया है।
- source_word: וּפִיד
  choice: और ... विनाश
  rationale: פִיד विनाशकारी विपत्ति या बरबादी को दर्शाता है। ‘विनाश’ समानांतरता बनाए रखते हुए पहले प्रयुक्त ‘विपत्ति’ की अनावश्यक पुनरावृत्ति से बचाता है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों की ओर से
  rationale: इसका शाब्दिक अर्थ ‘उन दोनों का/उन दोनों से’ है। निकट प्रसंग के अनुसार ‘दोनों’ प्रभु और राजा की ओर संकेत कर सकता है; हिन्दी में स्रोत-संबंध चुना गया है, जबकि मूल की संदर्भगत अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: מִי יוֹדֵעַ
  choice: कौन जानता है?
  rationale: यह मनुष्य की पूर्वानुमान लगाने या पूरी सीमा समझने की असमर्थता बताने वाला संक्षिप्त आलंकारिक प्रश्न है।
theological_decisions:
- issue: שְׁנֵיהֶם (‘उन दोनों’) का संदर्भ और संबंध
  choice: इसे पिछले पद में उल्लिखित प्रभु और राजा—इन दो अधिकारियों—की ओर संकेत मानकर, उनके द्वारा आनेवाले विनाश के रूप में व्यक्त किया गया है।
  alternative: यह उन लोगों और राजा, अन्य निहित दो पक्षों, अथवा स्वयं उन दोनों पर आनेवाले विनाश की ओर संकेत कर सकता है।
  rationale: नीतिवचन 24:21 में स्पष्ट रूप से प्रभु और राजा का जोड़ा आता है, इसलिए निकटतम संदर्भ यही है। फिर भी इब्रानी संबंधवाचक रचना स्रोत और भोगी के बीच कुछ अर्थगत गुंजाइश छोड़ती है; अतः वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आ पड़ेगी’ चेतावनी की आकस्मिकता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘विपत्ति’ और ‘विनाश’ काव्यात्मक समानांतरता तथा अर्थ-भेद दोनों बनाए रखते हैं।
