  yaml_path: translation/ot/proverbs/024/007.yaml
  text: Wisdom is too high for a fool[b][a]; in the gate he does not open his mouth.
translation:
  language: hi
  text: मूर्ख के लिए बुद्धि बहुत ऊँची है[a]; नगर-द्वार[b] पर वह अपना मुँह नहीं खोलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख के लिए बुद्धियाँ ऊँची हैं।” इब्रानी में “बुद्धि” का रूप बहुवचन है; यहाँ वह भाववाचक या तीव्रतासूचक प्रयोग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: प्राचीन इस्राएली नगर में नगर-द्वार सार्वजनिक विचार-विमर्श, न्यायिक निर्णय और नागरिक नेतृत्व का स्थान था।
    reason: cultural_note
lexical_decisions:
- source_word: רָאמוֹת
  choice: बहुत ऊँची
  rationale: रום धातु की ऊँचाई की छवि को बनाए रखते हुए यह बताता है कि बुद्धि मूर्ख की पहुँच से परे है; ‘बहुत ऊँची’ स्वाभाविक हिन्दी है और ‘अप्राप्य’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचती है।
- source_word: לֶאֱוִיל
  choice: मूर्ख के लिए
  rationale: यहाँ ל संबंध या संदर्भ दर्शाता है। नीतिवचन में אֱוִיל के लिए ‘मूर्ख’ सामान्य और उपयुक्त हिन्दी शब्द है।
- source_word: חָכְמוֹת
  choice: बुद्धि
  rationale: यह रूप व्याकरणतः बहुवचन है, पर ज्ञान-साहित्य में इसे भाववाचक अथवा तीव्रतासूचक बहुवचन समझा जा सकता है; हिन्दी में एकवचन ‘बुद्धि’ स्वाभाविक है। वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בַּשַּׁעַר
  choice: नगर-द्वार पर
  rationale: सिर्फ ‘द्वार पर’ आधुनिक पाठक को निजी घर का द्वार लग सकता है। ‘नगर-द्वार’ प्राचीन इस्राएली सार्वजनिक, न्यायिक और नागरिक स्थल को संक्षेप में स्पष्ट करता है।
- source_word: לֹא יִפְתַּח פִּיהוּ
  choice: वह अपना मुँह नहीं खोलता
  rationale: मूल इब्रानी मुहावरे को बनाए रखता है और यह तय नहीं करता कि उसकी चुप्पी अक्षमता, लज्जा या बोलने की योग्यता के अभाव के कारण है।
