  text: A wise man is strong[b][a], and a man of knowledge strengthens his might.
translation:
  language: hi
  text: बुद्धिमान पुरुष शक्तिशाली होता है,[a] और ज्ञान रखनेवाला अपनी शक्ति बढ़ाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान बलवान पुरुष” अथवा “बुद्धिमान पुरुष शक्ति में रहता है।” इब्रानी रचना संक्षिप्त है और इसे विशेषणात्मक या विधेयात्मक समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ज्ञान रखनेवाला शक्ति बढ़ाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גֶּבֶר
  choice: पुरुष
  rationale: यहाँ इब्रानी पुल्लिंग एकवचन में एक प्रतिनिधि व्यक्ति की बात करता है। ‘पुरुष’ इस रूप को बनाए रखता है; संज्ञा में ही ‘बलवान’ जोड़ने से בַּעֹז के अर्थ को पहले से समाहित करना पड़ता।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: नीतिवचन में यह शब्द नैतिक और व्यावहारिक बुद्धि रखनेवाले व्यक्ति के लिए सामान्यतः प्रयुक्त होता है।
- source_word: בַּעֹז
  choice: शक्तिशाली होता है
  rationale: 'בְּ + עֹז की संक्षिप्त रचना को विधेय रूप में समझना स्वाभाविक है: बुद्धिमान पुरुष शक्ति से युक्त है। मूल की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।'
- source_word: אִישׁ דַּעַת
  choice: ज्ञान रखनेवाला
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ‘ज्ञान का पुरुष’ की अपेक्षा अधिक स्पष्ट है और इब्रानी का व्यक्ति-केंद्रित भाव बनाए रखता है।
- source_word: מְאַמֶּץ
  choice: बढ़ाता है
  rationale: פיעל कृदन्त किसी शक्ति को दृढ़ या अधिक प्रबल करने का भाव दे सकता है। ‘बढ़ाता है’ כֹּחַ के साथ स्वाभाविक हिन्दी है और दूसरे सम्भव पाठ—‘शक्ति बढ़ती है’—की दिशा को भी दर्शाता है।
- source_word: כֹּחַ
  choice: अपनी शक्ति
  rationale: यह सामर्थ्य या क्षमता को सूचित करता है। हिन्दी में सामान्य एकवचन कर्ता के साथ ‘अपनी’ स्वाभाविक रूप से उसी व्यक्ति की शक्ति बताता है, यद्यपि इब्रानी में अलग सर्वनाम नहीं है।
