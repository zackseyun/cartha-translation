source:
  edition: WLC
  text: שְׂפָתַ֥יִם יִשָּׁ֑ק מֵ֝שִׁ֗יב דְּבָרִ֥ים נְכֹחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/026.yaml
  text: He kisses the lips who gives upright words[a][b].
translation:
  language: hi
  text: सही शब्दों में उत्तर देनेवाला होंठों को चूमता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सही उत्तर होंठों पर चुंबन के समान है।” इब्रानी क्रिया सक्रिय है—“वह चूमता है”—पर यह नीतिवचन उचित उत्तर की तुलना चुंबन की आत्मीयता या निष्कपटता से मुहावरेदार ढंग से कर सकता है।
    reason: alternative_reading
  - marker: b
    text: “सही शब्दों” का अनुवाद “उचित शब्दों,” “सीधी बातों,” “स्पष्ट शब्दों,” या “ईमानदार शब्दों” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפָתַיִם
  choice: होंठों को
  rationale: द्विवचन संज्ञा का ठोस अर्थ ‘होंठ’ है; नीतिवचन की चुंबन-वाली सजीव छवि बनाए रखने के लिए इसे प्रत्यक्ष रूप से रखा गया है।
- source_word: יִשָּׁק
  choice: चूमता है
  rationale: यह נשׁק का सक्रिय काल/पक्ष-रूप है, जिसका सामान्य अर्थ ‘चूमना’ है। नीतिवचन के सार्वकालिक कथन के अनुरूप हिन्दी में सामान्य वर्तमान काल रखा गया है।
- source_word: מֵשִׁיב
  choice: उत्तर देता है
  rationale: שוב का हिफ़ील कृदंत यहाँ कही गई बात का प्रत्युत्तर देने के अर्थ में है; ‘उत्तर देता है’ हिन्दी में स्वाभाविक है और प्रत्युत्तर का भाव स्पष्ट रखता है।
- source_word: דְּבָרִים
  choice: बातों से
  rationale: मूल में बहुवचन ‘बातें/शब्द’ है। ‘बातों से उत्तर देता है’ बहुवचन को सुरक्षित रखते हुए हिन्दी में स्वाभाविक अभिव्यक्ति देता है।
- source_word: נְכֹחִים
  choice: सीधी-सच्ची
  rationale: इस विशेषण में सीधे, उचित और सत्यनिष्ठ होने के जुड़े हुए भाव हैं। ‘सीधी-सच्ची’ आधुनिक हिन्दी में स्पष्टवादिता और ईमानदारी दोनों को व्यक्त करता है, बिना इसे केवल तथ्यात्मक सत्य तक सीमित किए।
theological_decisions:
- issue: सक्रिय क्रिया और सम्भावित उपमात्मक आशय
  choice: मुख्य पाठ में सक्रिय ‘वह मानो होंठों को चूमता है’
  alternative: ‘सच्चा उत्तर होंठों पर चुंबन के समान है’
  rationale: इब्रानी क्रिया व्याकरणतः सक्रिय है, इसलिए सक्रियता को मुख्य पाठ में रखा गया है; ‘मानो’ जोड़कर नीतिवचन के सम्भावित उपमात्मक/मुहावरेदार बल को स्वाभाविक हिन्दी में व्यक्त किया गया है। वैकल्पिक संरचना पाद-टिप्पणी में दी गई है ताकि वास्तविक व्याख्यात्मक अस्पष्टता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सीधी-सच्ची’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘होंठों को चूमता है’ मूल की ठोस काव्यात्मक छवि और सक्रिय क्रिया को बनाए रखता है।
