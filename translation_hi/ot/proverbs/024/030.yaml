  yaml_path: translation/ot/proverbs/024/030.yaml
  text: I passed by the field of a sluggard[a], and by the vineyard of a man lacking sense.
translation:
  language: hi
  text: 'मैं एक आलसी के खेत के पास से गुज़रा,

    और समझ-बूझ से रहित एक मनुष्य की दाख की बारी के पास से भी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हृदय से रहित’; अर्थात विवेक या समझ का अभाव।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל ... עָבַרְתִּי
  choice: के पास से गुज़रा
  rationale: עבר के साथ עַל यहाँ किसी स्थान के निकट से आगे निकलने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: שְׂדֵה אִישׁ עָצֵל
  choice: आलसी के खेत
  rationale: निर्मित पदबंध का आशय आलसी मनुष्य के स्वामित्व वाला खेती का खेत है; हिन्दी में ‘आलसी के खेत’ संक्षिप्त और सहज है।
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: यह अंगूर की खेती के लिए प्रयुक्त स्थान है; ‘दाख की बारी’ बाइबलीय गरिमा रखते हुए हिन्दी में बोधगम्य है।
- source_word: אָדָם חֲסַר לֵב
  choice: उस मनुष्य ... जिसमें समझ की कमी थी
  rationale: אָדָם को उसके पुल्लिंग मानवीय संदर्भ में ‘मनुष्य’ रखा गया है। חֲסַר־לֵב का शाब्दिक अर्थ ‘हृदय की कमी वाला’ है, पर नीतिवचन में ‘हृदय’ विवेक और समझ का केंद्र है; इसलिए मुहावरे का आशय स्पष्ट किया गया है।
theological_decisions:
- issue: חֲסַר־לֵב में ‘हृदय’ का मानवीय-अंतःकरण संबंधी अर्थ
  choice: जिसमें समझ की कमी थी
  alternative: जिसमें हृदय की कमी थी
  rationale: शाब्दिक विकल्प हिन्दी में शारीरिक या भावनात्मक कमी का भ्रम पैदा कर सकता है। संदर्भ व्यावहारिक विवेक और उचित निर्णय की कमी का है; फिर भी इसे केवल ‘मूर्ख’ कहकर नैतिक-बौद्धिक तनाव को सपाट नहीं किया गया।
- issue: אָדָם का लिंग-सूचक अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: मूल पद पुल्लिंग एकवचन है और समानांतर איש से मेल खाता है; ‘मनुष्य’ इस रूप को बनाए रखता है, जबकि प्रतिनिधिक मानवीय अर्थ भी व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण काव्यात्मक गद्य। दोनों समानांतर पंक्तियों को बनाए रखा गया है। ‘दाख की बारी’ सामान्य पाठक के लिए समझने योग्य पारंपरिक बाइबलीय पद है।
