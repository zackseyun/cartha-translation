id: PRO.24.18
reference: Proverbs 24:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פֶּן יִרְאֶ֣ה יְ֭הוָה וְ/רַ֣ע בְּ/עֵינָ֑י/ו וְ/הֵשִׁ֖יב מֵ/עָלָ֣י/ו אַפּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/018.yaml
  text: lest Yahweh see it[a], and it be evil in his eyes, and he turn his anger away from him.
translation:
  language: hi
  text: कहीं ऐसा न हो कि याहवे इसे देखे और यह उसकी दृष्टि में बुरा लगे[a], और वह अपना क्रोध उस पर से हटा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और यह उसकी आँखों में बुरा हो।” इसका अर्थ “और यह उसे अप्रसन्न करे” भी हो सकता है।
    reason: इब्रानी मुहावरे की शाब्दिक छवि और उसके स्वाभाविक अर्थ—दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह चेतावनी के रूप में आने वाले संभावित, अवांछित परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִרְאֶה
  choice: देखे
  rationale: פֶּן के साथ संभाव्य परिणाम व्यक्त करने के लिए हिन्दी का संभावनार्थक क्रियारूप उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: וְרַע בְּעֵינָיו
  choice: और यह उसकी दृष्टि में बुरा लगे
  rationale: यह इब्रानी मूल्यांकन-संबंधी मुहावरे का स्वाभाविक हिन्दी रूप है; ‘दृष्टि में’ स्रोत की नेत्र-संबंधी छवि को भी बनाए रखता है।
- source_word: וְהֵשִׁיב
  choice: और वह ... हटा ले
  rationale: שׁוב के हिफ़ील रूप में किसी वस्तु को वापस मोड़ने या दूर कर देने का भाव है; क्रोध के संदर्भ में ‘हटा ले’ स्वाभाविक है।
- source_word: מֵעָלָיו
  choice: उस पर से
  rationale: यह מֵעַל के ‘उसके ऊपर से हटने’ के स्थानिक भाव को ‘उससे’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: אַפּוֹ
  choice: अपना क्रोध
  rationale: אַף का शाब्दिक अर्थ ‘नाक’ हो सकता है, पर यहाँ यह स्थापित इब्रानी मुहावरे के अनुसार क्रोध को दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: याहवे का क्रोध शत्रु पर से हटने की संभावना
  choice: वाक्य को मूल की चेतावनी के रूप में यथावत रखा गया
  alternative: यह स्पष्ट करना कि क्रोध किसी दूसरे व्यक्ति की ओर मुड़ेगा
  rationale: मूल पाठ केवल इतना कहता है कि याहवे अपना क्रोध ‘उस पर से’ हटा सकता है; वह क्रोध फिर किस ओर जाएगा, यह नहीं बताता। अतः उस तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहीं ऐसा न हो कि’ चेतावनी का स्वाभाविक हिन्दी रूप है। ‘उस पर से’ पूर्वसर्ग के मूल स्थानिक भाव को बनाए रखता है, जबकि वाक्य को पिछले पद के संदर्भ पर निर्भर रहने देता है।
