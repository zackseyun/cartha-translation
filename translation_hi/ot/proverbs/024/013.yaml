translation:
  language: hi
  text: मेरे बेटे, मधु खा, क्योंकि वह अच्छा है; और छत्ते का मधु[क] तेरे तालू को मीठा लगता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “छत्ते से निकला शहद।” इब्रानी नֹפֶת छत्ते के शहद अथवा उससे टपकने वाले शहद को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱכָל
  choice: खा
  rationale: यह אכל का पुल्लिंग एकवचन आज्ञार्थक रूप है; ‘खा’ सीधे उपदेशात्मक स्वर को बनाए रखता है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: ज्ञान-साहित्य का संबोधन है। यह पुल्लिंग एकवचन और पिता से पुत्र को दिए जा रहे निर्देश के प्रसंग को स्पष्ट व स्वाभाविक रूप से रखता है।
- source_word: דְבַשׁ
  choice: मधु
  rationale: यह मधु के लिए सामान्य इब्रानी संज्ञा है; ‘मधु’ आधुनिक हिंदी में गरिमापूर्ण और सुबोध है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह अच्छा है
  rationale: כִּי आज्ञा का कारण बताता है और טוֹב का व्यापक मूल्यांकन ‘अच्छा’ से सुरक्षित रहता है, केवल स्वादिष्ट या सुखद तक सीमित नहीं होता।
- source_word: וְנֹפֶת
  choice: और छत्ते का टपकता मधु
  rationale: נֹפֶת छत्ते से टपकने वाले अथवा छत्ते के मधु को सूचित कर सकता है। यह अनुवाद पहले ‘मधु’ और फिर उसके विशिष्ट, ताजे रूप के बीच का काव्यात्मक भेद बनाए रखता है।
- source_word: מָתוֹק
  choice: मीठा लगता है
  rationale: यह स्वाद की मिठास बताने वाला विशेषण है; हिंदी में तालू के संबंध में ‘मीठा लगता है’ स्वाभाविक है।
- source_word: עַל חִכֶּךָ
  choice: तेरे तालू को
  rationale: חֵךְ का प्रत्यक्ष अर्थ ‘तालू’ है। ‘तेरे तालू को’ मूल शारीरिक और स्वाद-संबंधी बिंब को बनाए रखते हुए सहज हिंदी देता है।
