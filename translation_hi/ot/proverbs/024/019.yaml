lexical_decisions:
- source_word: תִּתְחַר
  choice: व्याकुल हो
  rationale: हित्पाएल रूप यहाँ भीतर से गरम या उद्वेलित होने का भाव देता है। ‘व्याकुल हो’ भावनात्मक अशांति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, उसे केवल क्रोध तक सीमित नहीं करता।
- source_word: בַּמְּרֵעִים
  choice: बुराई करनेवालों के कारण
  rationale: इस क्रिया के साथ ב यहाँ कारण या भावनात्मक प्रतिक्रिया के विषय को दर्शाता है। participial מְרֵעִים का अर्थ बुराई करनेवाले लोग है।
- source_word: תְּקַנֵּא
  choice: ईर्ष्या कर
  rationale: नीतिवचन-साहित्य में ב के साथ קנא सामान्यतः किसी से ईर्ष्या करने का अर्थ देता है।
- source_word: בָּרְשָׁעִים
  choice: दुष्टों
  rationale: רְשָׁעִים नीतिवचन में नैतिक रूप से दुष्ट लोगों के लिए प्रचलित श्रेणीगत शब्द है; ‘दुष्टों’ इसकी संक्षिप्त लोकोक्तिपरक शैली बनाए रखता है।
- source_word: אַל
  choice: न ... कर / न हो
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; हिन्दी में ‘न ...’ इसका सहज और संक्षिप्त समतुल्य है।
