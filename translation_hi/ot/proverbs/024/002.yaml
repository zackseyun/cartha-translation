  yaml_path: translation/ot/proverbs/024/002.yaml
  text: For their heart meditates on destruction[b][a], and their lips speak trouble.
translation:
  language: hi
  text: क्योंकि उनका मन विनाश का विचार करता रहता है[a], और उनके होंठ हानिकारक बातें कहते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिंसा का विचार करता रहता है”; इब्रानी शब्द हिंसक बरबादी, लूट या विनाश को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उपद्रव की बातें कहते हैं”; इब्रानी शब्द यहाँ हानि पहुँचाने वाली बुराई या मुसीबत को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई मनाही का कारण बताता है और इब्रानी के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שֹׁד
  choice: विनाश
  rationale: यह शब्द हिंसक बरबादी, उजाड़ या लूट से उत्पन्न विनाश को सूचित कर सकता है। यहाँ दुष्टों के मन में पलने वाली विध्वंसकारी मंशा के लिए ‘विनाश’ सटीक और सहज है।
- source_word: יֶהְגֶּה
  choice: सोचता रहता है
  rationale: הגה मन में विचार करने या मनन करते रहने का भाव देता है। ‘सोचता रहता है’ निरंतर आंतरिक चिंतन को व्यक्त करता है, बिना इसे स्पष्ट रूप से ‘षड्यंत्र रचना’ बना देने के।
- source_word: לִבָּם
  choice: उनका मन
  rationale: इब्रानी ‘हृदय’ यहाँ विचार और इच्छा के भीतरी केंद्र को दर्शाता है। आधुनिक हिन्दी में ‘मन’ इस अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है और सामूहिक एकवचन को भी बनाए रखता है।
- source_word: וְעָמָל
  choice: अनर्थ
  rationale: עמל यहाँ परिश्रम नहीं, बल्कि हानिकारक उपद्रव या बुराई का संकेत देता है। ‘अनर्थ’ दुष्ट वाणी से होने वाली हानि और बुराई दोनों को संक्षेप में व्यक्त करता है।
- source_word: שִׂפְתֵיהֶם
  choice: उनके होंठ
  rationale: शाब्दिक काव्य-बिंब को सुरक्षित रखते हुए यह भीतर के ‘मन’ और बाहर व्यक्त होने वाली वाणी के बीच समानांतरता दिखाता है।
- source_word: תְּדַבֵּרְנָה
  choice: बातें करते हैं
  rationale: यह सामान्य, आदतन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और नीतिवचन की सार्वकालिक शैली के अनुकूल है।
