source:
  edition: WLC
  text: אֹ֤מֵ֨ר לְ/רָשָׁע֮ צַדִּ֪יק אָ֥תָּה יִקְּבֻ֥/הוּ עַמִּ֑ים יִזְעָמ֥וּ/הוּ לְאֻמִּֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/024.yaml
  text: Whoever says to the wicked[a], “You are righteous,” peoples will curse him; nations will denounce him.
translation:
  language: hi
  text: जो किसी दुष्ट से कहता है, “तुम धर्मी हो,” लोग उसे शाप देंगे; राष्ट्र उस पर क्रोधित होंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दुष्ट से कहता है, ‘तुम सही हो,’ लोग उसे शाप देंगे; राष्ट्र उस पर रोष प्रकट करेंगे।”
    reason: צַדִּיק का ‘धर्मी’ मुख्य अनुवाद नैतिक विरोध को बनाए रखता है; ‘सही’ वैकल्पिक रूप से उसके संभावित न्यायिक/विधिक आशय को दर्शाता है।
lexical_decisions:
- source_word: אֹמֵר
  choice: जो ... कहता है
  rationale: पुल्लिंग एकवचन कृदन्त यहाँ सामान्य, नीतिवचनात्मक कर्ता को व्यक्त करता है; हिन्दी में ‘जो ... कहता है’ स्वाभाविक रूप से यही अनिश्चित सामान्य अर्थ देता है।
- source_word: לְרָשָׁע
  choice: दुष्ट से
  rationale: रָשָׁע यहाँ केवल विधिक रूप से दोषी व्यक्ति नहीं, बल्कि नैतिक रूप से दुष्ट व्यक्ति को दर्शाता है; ‘दुष्ट’ इस नैतिक विरोध को बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: नीतिवचन के नैतिक संदर्भ में צַדִּיק का अर्थ धर्मी/न्यायी व्यक्ति है और यह ‘दुष्ट’ के साथ स्पष्ट विरोध बनाए रखता है; ‘सही’ अधिक विधिक अर्थ दे सकता था।
- source_word: אָתָּה
  choice: तू ... है
  rationale: इब्रानी में सर्वनाम स्पष्ट है; सीधे संबोधन में ‘तू’ उस स्पष्टता और नीतिवचन की सीधी, गंभीर शैली को स्वाभाविक हिन्दी में रखता है।
- source_word: יִקְּבֻהוּ
  choice: उसे ... शाप देंगे
  rationale: נקב यहाँ किसी के विरुद्ध शाप बोलने का अर्थ देता है; ‘शाप देंगे’ इसकी प्रबल अभिशापात्मक शक्ति को स्पष्ट रखता है।
- source_word: עַמִּים
  choice: लोग
  rationale: बहुवचन सामूहिक עַמִּים को सामान्य पाठक के लिए स्वाभाविक हिन्दी में ‘लोग’ कहा गया है, जबकि अगली पंक्ति के לְאֻמִּים के लिए ‘राष्ट्र’ रखकर शब्दगत भेद बचाया गया है।
- source_word: יִזְעָמֻהוּ
  choice: उस पर रोष प्रकट करेंगे
  rationale: यह क्रिया तीव्र क्रोध और विरोध व्यक्त करती है; ‘रोष प्रकट करेंगे’ सार्वजनिक आक्रोश का भाव देता है और पहले खंड के ‘शाप देंगे’ को अनावश्यक रूप से नहीं दोहराता।
- source_word: לְאֻמִּים
  choice: राष्ट्र
  rationale: עַמִּים के समानांतर इस शब्द के लिए ‘राष्ट्र’ रखने से समानार्थी काव्य-समानांतरता और दोनों इब्रानी पदों का शब्दगत अंतर बना रहता है।
theological_decisions:
- issue: צַדִּיק का नैतिक अथवा विधिक आशय
  choice: धर्मी
  alternative: तू सही है / तू निर्दोष है
  rationale: दुष्ट और धर्मी का नैतिक विरोध नीतिवचन-साहित्य में प्रमुख है। फिर भी प्रसंग में किसी दुष्ट को न्यायिक रूप से सही ठहराने की छाया संभव है; पाठ इसे किसी एक विशिष्ट न्यायालयीन परिस्थिति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘तू’ प्रत्यक्ष एकवचन संबोधन को स्पष्ट करता है; यहाँ इसका प्रयोग अपमानसूचक नहीं, बल्कि मूल की सीधी उक्ति को दर्शाने के लिए है। काव्यात्मक समानांतरता में ‘लोग/राष्ट्र’ और ‘शाप देंगे/रोष प्रकट करेंगे’ का भेद सुरक्षित रखा गया है।
