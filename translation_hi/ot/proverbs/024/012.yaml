id: PRO.24.12
reference: Proverbs 24:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי תֹאמַ֗ר הֵן֮ לֹא יָדַ֪עְנ֫וּ זֶ֥ה הֲֽ/לֹא תֹ֘כֵ֤ן לִבּ֨וֹת הֽוּא יָבִ֗ין וְ/נֹצֵ֣ר נַ֭פְשְׁ/ךָ ה֣וּא יֵדָ֑ע וְ/הֵשִׁ֖יב לְ/אָדָ֣ם כְּ/פָעֳלֽ/וֹ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/012.yaml
  text: If you say[a], “Look, we did not know this,” does not he who weighs hearts understand, and he who keeps your soul know[e][d][c][b], and will he not repay a man according to his work?
translation:
  language: hi
  text: यदि तुम कहो, “देखो, हम यह नहीं जानते थे,” तो क्या वह, जो हृदयों को तौलता है, इसे नहीं समझता? और जो तुम्हारे प्राण की रक्षा करता है, क्या वह नहीं जानता? क्या वह हर मनुष्य को उसके काम के अनुसार प्रतिफल नहीं देगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या वह मनुष्य को उसके किए के अनुसार लौटा नहीं देगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תֹאמַר
  choice: यदि तुम कहो
  rationale: כִּי यहाँ संभाव्य शर्त प्रस्तुत करता है और दूसरे पुरुष एकवचन תֹאמַר को आधुनिक हिन्दी में स्वाभाविक रूप से “तुम कहो” कहा गया है।
- source_word: הֵן
  choice: देखो
  rationale: उद्धृत बहाने पर ध्यान खींचने वाले संकेतवाचक विस्मयादिबोधक का सहज आधुनिक रूप।
- source_word: לֹא יָדַעְנוּ זֶה
  choice: हम यह नहीं जानते थे
  rationale: प्रथम पुरुष बहुवचन और स्पष्ट कर्म “यह” दोनों सुरक्षित रहते हैं; भूतकाल कथित अज्ञान के बहाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תֹכֵן לִבּוֹת
  choice: हृदयों को तौलता है
  rationale: תכן की तौलने/परखने की मूल उपमा और לִבּוֹת का हृदय-संबंधी मानवीय बिंब सुरक्षित रखा गया है।
- source_word: יָבִין
  choice: समझता
  rationale: हृदयों की जाँच से जुड़ी सूझ और पहचान को व्यापक, सहज हिन्दी में व्यक्त करता है।
- source_word: וְנֹצֵר נַפְשְׁךָ
  choice: और जो तुम्हारे प्राण की रक्षा करता है
  rationale: נצר का रक्षा/पहरा देने का भाव और נֶפֶשׁ का जीवन तथा व्यक्ति-सत्ता से जुड़ा व्यापक अर्थ “प्राण” में अपेक्षाकृत स्वाभाविक ढंग से बना रहता है।
- source_word: יֵדָע
  choice: जानता
  rationale: आरम्भ में किए गए अज्ञान के दावे के साथ मूल की शब्दगत प्रतिध्वनि बनाए रखता है।
- source_word: וְהֵשִׁיב לְאָדָם כְּפָעֳלוֹ
  choice: क्या वह हर मनुष्य को उसके काम के अनुसार प्रतिफल नहीं देगा?
  rationale: Hiphil וְהֵשִׁיב का नैतिक प्रतिदान वाला अर्थ “प्रतिफल देगा” से स्पष्ट होता है; אָדָם का प्रतिनिधिक एकवचन “हर मनुष्य” से सार्वभौमिक आशय सहज हिन्दी में व्यक्त है।
theological_decisions:
- issue: נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: तुम्हारे प्राण
  alternative: तुम्हारे जीवन / तुम्हारी आत्मा
  rationale: “प्राण” जीवन और व्यक्ति-सत्ता दोनों की ओर संकेत कर सकता है और इस प्रसंग में परमेश्वर की संरक्षणकारी भूमिका को व्यक्त करता है, बिना נֶפֶשׁ को केवल अमूर्त आत्मा के तकनीकी अर्थ तक सीमित किए।
- issue: परमेश्वर द्वारा हृदयों का मूल्यांकन
  choice: हृदयों को तौलता है
  alternative: हृदयों को परखता है
  rationale: “तौलता” मूल रूपक को सुरक्षित रखता है और परमेश्वर द्वारा भीतरी उद्देश्यों की जाँच का आशय पाठक के लिए खुला रहने देता है।
- issue: אָדָם का प्रतिनिधिक एकवचन
  choice: हर मनुष्य
  alternative: मनुष्य / हर व्यक्ति
  rationale: यहाँ אָדָם किसी खास पुरुष के बजाय प्रत्येक मानव के लिए सामान्य रूप से प्रयुक्त है; “हर मनुष्य” उसी सार्वभौमिक नैतिक उत्तरदायित्व को स्पष्ट करता है।
- issue: प्रतिदान का स्वरूप
  choice: उसके काम के अनुसार प्रतिफल देगा
  alternative: उसके किए के अनुसार लौटा देगा
  rationale: मूल में व्यक्ति के कर्म के अनुरूप दैवी प्रत्युत्तर है। “प्रतिफल” न्यायपूर्ण परिणाम को व्यक्त करता है, पर यह नहीं तय करता कि परिणाम पुरस्कार होगा या दंड।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। मूल के तीन आलंकारिक प्रश्न, “हृदयों को तौलता” रूपक, कथित अज्ञान और परमेश्वर के ज्ञान के बीच शब्दगत तनाव, तथा कर्मानुसार प्रतिदान सुरक्षित रखे गए हैं।
