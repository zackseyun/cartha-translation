source:
  edition: WLC
  text: כִּ֤י לֹֽא תִהְיֶ֣ה אַחֲרִ֣ית לָ/רָ֑ע נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/020.yaml
  text: For there will be no future for the evil[b][a]; the lamp of the wicked will be put out.
translation:
  language: hi
  text: क्योंकि बुरे व्यक्ति का कोई भविष्य[a] नहीं होगा; दुष्टों का दीपक बुझ जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंत’, ‘अंतिम दशा’ अथवा ‘परिणाम’। इब्रानी शब्द किसी व्यक्ति के भावी भाग्य या अंतिम परिणाम का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: दीपक का बुझना जीवन, समृद्धि या स्थायी प्रतिष्ठा के समाप्त होने का बिंब हो सकता है।
    reason: metaphor_clarification
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא תִהְיֶה
  choice: कोई ... नहीं होगा
  rationale: इब्रानी अस्तित्वसूचक नकारात्मक भविष्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַחֲרִית
  choice: भविष्य
  rationale: यहाँ शब्द किसी व्यक्ति के आगे के भविष्य, अंतिम दशा या परिणाम को सूचित कर सकता है; समानांतर दीपक के बुझने के साथ ‘भविष्य’ स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: לָרָע
  choice: बुरे व्यक्ति का
  rationale: लेखयुक्त एकवचन विशेषण यहाँ व्यक्ति के लिए संज्ञा की तरह प्रयुक्त है। ‘व्यक्ति’ व्यक्तिगत और एकवचन संदर्भ स्पष्ट करता है, बिना उसे केवल पुरुष तक सीमित किए या किसी विशिष्ट आध्यात्मिक सत्ता से जोड़े।
- source_word: נֵר
  choice: दीपक
  rationale: मूल ठोस बिंब को बनाए रखता है, जो जीवन, समृद्धि या स्थायी स्थिति का संकेत दे सकता है।
- source_word: רְשָׁעִים
  choice: दुष्टों का
  rationale: बहुवचन वर्गसूचक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יִדְעָךְ
  choice: बुझ जाएगा
  rationale: दीपक के स्वतः/निष्क्रिय रूप से बुझ जाने का सामान्य अर्थ देता है और इब्रानी में स्पष्ट कर्ता न होने पर बाहरी कर्ता आरोपित नहीं करता।
theological_decisions:
- issue: एकवचन רָע और बहुवचन רְשָׁעִים का रूपांतरण
  choice: पहले खंड में एकवचन ‘बुरे व्यक्ति’ और दूसरे में बहुवचन ‘दुष्टों’ रखा गया।
  alternative: दोनों को सामान्य रूप से ‘दुष्टों’ कहना; या एकवचन को ‘उस दुष्ट’ कहना।
  rationale: इब्रानी का एकवचन से बहुवचन की ओर परिवर्तन मूल पाठ की बनावट है। ‘बुरा व्यक्ति’ किसी खास शैतानी सत्ता का संकेत दिए बिना व्यक्तिगत संदर्भ रखता है।
- issue: אַחֲרִית का अर्थ
  choice: ‘भविष्य’ मुख्य पाठ में रखा गया।
  alternative: ‘अंत’, ‘अंतिम दशा’ या ‘परिणाम’।
  rationale: नीतिवचन के इस संदर्भ में शब्द आगे की संभावना और अंतिम परिणति दोनों को छू सकता है। ‘भविष्य’ सहज है, और अर्थ-व्याप्ति पादटिप्पणी में दी गई है।
- issue: दीपक बुझने के बिंब की व्याख्या
  choice: बिंब को बिना खोले शाब्दिक रूप में रखा गया।
  alternative: इसे जीवन, समृद्धि या वंश के समाप्त होने के रूप में सीधे समझाकर लिखना।
  rationale: मूल पाठ जानबूझकर रूपकात्मक है; किसी एक धर्मवैचारिक अर्थ तक सीमित करना अनुचित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर अपनाया गया है। अर्धविराम दोनों समानांतर पंक्तियों को जोड़ता है। ‘दीपक’ मूल रूपक को अक्षुण्ण रखता है और ‘बुझ जाएगा’ स्वाभाविक समकालीन प्रयोग है।
