lexical_decisions:
- source_word: וָאֶחֱזֶה
  choice: तब मैंने देखा
  rationale: חזה यहाँ देखने और समझने के लिए ध्यानपूर्वक अवलोकन को व्यक्त करता है। कथात्मक क्रम में जुड़े वाव को सहज हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: אָנֹכִי
  choice: मैंने
  rationale: स्वतंत्र सर्वनाम कर्ता पर हल्का बल देता है, पर हिन्दी में अलग से ‘मैं स्वयं’ कहना इस संदर्भ में अनावश्यक रूप से प्रबल होता; क्रिया के साथ ‘मैंने’ स्वाभाविक है।
- source_word: אָשִׁית לִבִּי
  choice: उस पर मन लगाया
  rationale: शाब्दिक अर्थ ‘मैंने अपना हृदय लगाया’ है। हिन्दी मुहावरे में ‘उस पर मन लगाया’ ध्यानपूर्वक विचार करने का अर्थ देता है और ‘मन में बसा लिया’ जैसे अधिक भावनात्मक अर्थ से बचता है।
- source_word: רָאִיתִי
  choice: मैंने ध्यान से देखा
  rationale: दूसरी दृष्टि-क्रिया चिंतनशील अवलोकन को आगे बढ़ाती है। ‘ध्यान से’ पुनरुक्ति को अर्थपूर्ण बनाता है, बिना इसे केवल बौद्धिक ‘विचार’ में बदलने के।
- source_word: לָקַחְתִּי מוּסָר
  choice: शिक्षा ग्रहण की
  rationale: מוּסָר में शिक्षा, अनुशासन और सुधार—तीनों अर्थ-छायाएँ संभव हैं। ‘शिक्षा ग्रहण की’ ज्ञान-साहित्य के शिक्षाप्रद आशय को स्वाभाविक हिन्दी में रखता है; विकल्प पादटिप्पणी में सुरक्षित हैं।
