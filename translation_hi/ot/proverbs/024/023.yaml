  text: גַּם אֵ֥לֶּה לַֽ/חֲכָמִ֑ים הַֽכֵּר פָּנִ֖ים בְּ/מִשְׁפָּ֣ט בַּל טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/023.yaml
  text: 'These also are sayings of the wise: to show partiality in judgment is not good[a][b].'
translation:
  language: hi
  text: 'ये भी बुद्धिमानों के वचन हैं:[a]

    न्याय करते समय पक्षपात करना अच्छा नहीं है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अक्षरशः, “ये भी बुद्धिमानों के लिए/के।” सम्भवतः अर्थ है, “ये भी बुद्धिमानों के वचन हैं।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में अक्षरशः, “न्याय में चेहरों को पहचानना”; यह किसी का पक्ष लेने या पक्षपात करने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: גַּם אֵלֶּה
  choice: ये भी
  rationale: यह पद पिछले संग्रह के बाद एक अतिरिक्त खंड प्रस्तुत करता है; ‘ये भी’ संयोजक और संकेतवाचक दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: לַחֲכָמִים
  choice: बुद्धिमानों के वचन हैं
  rationale: इब्रानी में अक्षरशः ‘बुद्धिमानों के लिए/के’ है, पर यहाँ यह संभवतः नए उपखंड का संक्षिप्त शीर्षक है। अर्थ स्पष्ट करने के लिए ‘वचन’ जोड़ा गया है, जबकि संबंध की मूल अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: הַכֵּר פָּנִים
  choice: पक्षपात करना
  rationale: अक्षरशः ‘चेहरों को पहचानना’ न्यायिक प्रसंग में किसी व्यक्ति का पक्ष लेने का मुहावरा है। ‘पक्षपात करना’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: בְּמִשְׁפָּט
  choice: न्याय करते समय
  rationale: यहाँ מִשְׁפָּט न्यायिक निर्णय की प्रक्रिया को सूचित करता है। ‘न्याय करते समय’ हिन्दी में स्वाभाविक है और कानूनी संदर्भ बनाए रखता है।
- source_word: בַּל טוֹב
  choice: अच्छा नहीं है
  rationale: यह सामान्य नैतिक मूल्यांकन है; ‘अच्छा नहीं है’ इब्रानी की व्यापकता को बिना केवल वैधानिक अर्थ तक सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: לַחֲכָמִים का संक्षिप्त शीर्षकीय अर्थ
  choice: ‘ये भी बुद्धिमानों के वचन हैं’—अतिरिक्त बुद्धिमानी के वचनों का परिचय
  alternative: ‘ये भी बुद्धिमानों के लिए हैं’ अथवा ‘ये भी बुद्धिमानों के हैं’
  rationale: पद एक नए उपखंड का आरंभ करता है, इसलिए शीर्षकीय अर्थ प्रसंग में सबसे संभावित है। फिर भी इब्रानी संबंधसूचक पदबंध अपने आप में संक्षिप्त और अस्पष्ट है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद को शीर्षक और नीति-वचन की दो पंक्तियों में प्रस्तुत किया गया है; न्यायिक अर्थ स्पष्ट है और मूल मुहावरे की जानकारी पादटिप्पणी में सुरक्षित है।
