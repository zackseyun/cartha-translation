translation:
  language: hi
  text: जो बुराई करने की योजना बनाता है, लोग उसे “कुटिल योजनाओं का उस्ताद” कहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְחַשֵּׁב לְהָרֵעַ
  choice: बुरा करने की योजना बनाता है
  rationale: यह हिब्रानी कृदंत लगातार या चरित्रगत रूप से बुराई की योजना बनाने वाले व्यक्ति को दर्शाता है; सरल आधुनिक हिन्दी में इसका स्वाभाविक रूप यही है।
- source_word: בַּעַל מְזִמּוֹת
  choice: षड्यंत्रों का स्वामी
  rationale: בַּעַל का मूल अर्थ ‘स्वामी/मालिक’ है और מְזִמּוֹת यहाँ संदर्भ के अनुसार कुटिल योजनाएँ या षड्यंत्र हैं। यह पद की निंदात्मक उपाधि को सुरक्षित रखता है।
- source_word: יִקְרָאוּ־לוֹ
  choice: उसे लोग … कहेंगे
  rationale: अनिर्दिष्ट बहुवचन कर्ता को हिन्दी में स्वाभाविक रूप से ‘लोग’ द्वारा व्यक्त किया गया है; לוֹ का आशय उस व्यक्ति को यह नाम दिए जाने से है।
