  text: Prepare your work outside[a]; make it ready for yourself in the field; afterward[b], build your house.
translation:
  language: hi
  text: बाहर अपने काम को तैयार करो; खेत में उसे अपने लिए व्यवस्थित करो; फिर अपना घर बनाओ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ज्ञान-साहित्य में ‘घर’ का व्यापक अर्थ घर-परिवार या गृहस्थी भी हो सकता है; लेकिन यहाँ ‘बाहर’ और ‘खेत’ के साथ विरोध ठोस घर के अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכֵן
  choice: तैयार कर लो
  rationale: כון के हिफ़ील आज्ञार्थक का अर्थ यहाँ किसी काम को तैयार या सुव्यवस्थित करना है। ‘तैयार कर लो’ आधुनिक हिंदी में स्वाभाविक है और पद में प्राथमिकताओं के क्रम को स्पष्ट रखता है।
- source_word: בַּחוּץ
  choice: बाहर
  rationale: यह घर से बाहर के खुले स्थान को दर्शाता है और आगे आए ‘घर’ के साथ स्थानगत विरोध बनाए रखता है।
- source_word: מְלַאכְתֶּךָ
  choice: अपना काम
  rationale: מְלָאכָה का अर्थ व्यापक रूप से काम, श्रम या कार्य है। यहाँ ‘अपना काम’ सरल और स्वाभाविक है तथा इसे किसी एक छोटे काम तक सीमित नहीं करता।
- source_word: וְעַתְּדָהּ
  choice: उसे ... ठीक कर लो
  rationale: עתד के पिएल रूप में तैयार या व्यवस्थित करने का भाव है। स्त्रीलिंग प्रत्यय का सबसे स्वाभाविक पूर्वपद מְלַאכָה है; ‘उसे ... ठीक कर लो’ पहली पंक्ति की अनावश्यक शब्द-पुनरावृत्ति घटाते हुए तैयारी का भाव रखता है।
- source_word: בַּשָּׂדֶה
  choice: खेत में
  rationale: שָׂדֶה यहाँ कृषि-कार्य के ठोस स्थान को सूचित करता है। ‘खेत में’ सीधा और सामान्य हिंदी रूप है।
- source_word: לָךְ
  choice: अपने लिए
  rationale: यह हितार्थक दातृकारक है और काम को स्वयं के लाभ के लिए व्यवस्थित करने का भाव प्रकट करता है।
- source_word: אַחַר
  choice: उसके बाद
  rationale: यह पहले बाहरी/खेत का उत्पादक काम तैयार करने और फिर घर बनाने का कालक्रम दर्शाता है।
- source_word: וּבָנִיתָ בֵיתֶךָ
  choice: अपना घर बनाओ
  rationale: शाब्दिक अर्थ ‘अपना घर बनाओ’ है। ‘घर’ परिवार या गृहस्थी का व्यापक संकेत भी दे सकता है, पर बाहर और खेत के साथ तत्काल विरोध ठोस भवन के अर्थ का समर्थन करता है।
theological_decisions:
- issue: בֵיתֶךָ का ठोस या व्यापक अर्थ
  choice: मुख्य पाठ में ‘अपना घर बनाओ’
  alternative: ‘अपना घर-परिवार बसाओ’
  rationale: ज्ञान-साहित्य में בַּיִת कभी परिवार या गृहस्थी का व्यापक अर्थ रख सकता है, किंतु इस पद में ‘बाहर’ और ‘खेत’ के साथ तुलना ठोस ‘घर’ को प्राथमिक बनाती है। व्यापक अर्थ को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों आज्ञाओं में ‘कर लो’ बोलचाल की सहजता देता है, जबकि वाक्य-संरचना सूक्ति का क्रम और संक्षिप्तता बनाए रखती है।
