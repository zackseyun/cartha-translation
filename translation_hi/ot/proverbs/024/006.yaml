id: PRO.24.6
reference: Proverbs 24:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י בְ֭/תַחְבֻּלוֹת תַּעֲשֶׂה לְּ/ךָ֣ מִלְחָמָ֑ה וּ֝/תְשׁוּעָ֗ה בְּ/רֹ֣ב יוֹעֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/006.yaml
  text: For by wise guidance you will wage war[b][a], and victory is in an abundance of counselors.
translation:
  language: hi
  text: क्योंकि कुशल रणनीति से तुम युद्ध करोगे,[a] और बहुत-से सलाहकारों से विजय मिलती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुशल मार्गदर्शन से” अथवा “सोची-समझी योजना से”; इब्रानी शब्द युक्तिपूर्ण मार्गदर्शन या रणनीतिक योजना का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या “छुटकारा मिलता है”; युद्ध के इस संदर्भ में इब्रानी शब्द विशेष रूप से “विजय” की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְתַחְבֻּלוֹת
  choice: कुशल रणनीति से
  rationale: यह शब्द दिशा-निर्देशन, युक्तिपूर्ण योजना और युद्धनीति का भाव रखता है; युद्ध के संदर्भ में ‘कुशल रणनीति’ साधनवाचक בְ को भी स्पष्ट करता है।
- source_word: תַּעֲשֶׂה לְּךָ מִלְחָמָה
  choice: तुम युद्ध करोगे
  rationale: עשה מלחמה का स्वाभाविक हिन्दी मुहावरा ‘युद्ध करना’ है। לְךָ का आत्म-संबंधी भाव हिन्दी में अलग से जोड़ने पर अस्वाभाविक होगा।
- source_word: וּתְשׁוּעָה
  choice: और ... विजय मिलती है
  rationale: सैन्य संदर्भ में תְּשׁוּעָה सफल परिणाम, अर्थात विजय, को सूचित करता है; व्यापक अर्थ ‘छुटकारा’ पादटिप्पणी में सुरक्षित है।
- source_word: בְּרֹב יוֹעֵץ
  choice: बहुत-से सलाहकारों से
  rationale: רֹב बहुलता बताता है और יוֹעֵץ रूपतः एकवचन होते हुए यहाँ सामूहिक अर्थ रखता है; हिन्दी में बहुवचन ‘सलाहकारों’ से आशय स्पष्ट और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। सैन्य संदर्भ को स्पष्ट रखते हुए मूल के व्यापक ‘छुटकारा’ अर्थ और रणनीतिक मार्गदर्शन की अर्थ-सीमा पादटिप्पणियों में सुरक्षित रखी गई है।
