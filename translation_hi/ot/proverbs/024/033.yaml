  text: מְעַ֣ט שֵׁ֭נוֹת מְעַ֣ט תְּנוּמ֑וֹת מְעַ֓ט חִבֻּ֖ק יָדַ֣יִם לִ/שְׁכָּֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/033.yaml
  text: A little sleep[a], a little slumber, a little folding of the hands to lie down—
translation:
  language: hi
  text: थोड़ी नींद, थोड़ी ऊँघ, लेटने के लिए हाथों को थोड़ा मोड़ना—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְעַט
  choice: थोड़ी / थोड़ा
  rationale: तीन बार की पुनरावृत्ति को बनाए रखते हुए हिन्दी में संबंधित संज्ञाओं के लिंग के अनुसार रूप रखा गया है; इससे क्रमिक रूप से ‘बस थोड़ा और’ की भावछटा सुरक्षित रहती है।
- source_word: שֵׁנוֹת
  choice: नींद
  rationale: इब्रानी में रूप बहुवचन है, पर आधुनिक हिन्दी में भाववाचक एकवचन ‘नींद’ स्वाभाविक और लोकोक्तिपूर्ण है।
- source_word: תְּנוּמוֹת
  choice: ऊँघ
  rationale: यह ‘नींद’ का निकटार्थी है, पर हल्की या झपकी-सी नींद का भेद व्यक्त करता है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: חִבֻּק יָדַיִם
  choice: हाथ बाँधना
  rationale: यह निष्क्रियता दर्शाने वाली इब्रानी अभिव्यक्ति का हिन्दी में संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: לִשְׁכָּב
  choice: लेटने के लिए
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेटना’ है; इसे ‘सोना’ या ‘आराम करना’ कहकर निहित परिणाम को अनावश्यक रूप से निश्चित नहीं किया गया।
