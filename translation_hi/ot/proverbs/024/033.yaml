  source_fidelity: ‘थोड़ी नींद’ and ‘थोड़ी ऊँघ’ accurately preserve the repeated Hebrew מְעַט and the near-synonymous sleep/slumber pairing. ‘लेटने के लिए’ appropriately renders לִשְׁכָּב without narrowing it to sleep. However, ‘हाथ बाँधना’ normally means tying one’s hands in modern Hindi and does not naturally convey the Hebrew idiom of folding/clasping the hands.
