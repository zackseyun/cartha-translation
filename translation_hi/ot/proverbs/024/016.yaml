base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/016.yaml
  text: For the righteous falls seven times and rises again[c][b][a], but the wicked stumble in calamity.
translation:
  language: hi
  text: क्योंकि धर्मी[a] सात बार[b] गिरता है और फिर उठ खड़ा होता है; पर दुष्ट विपत्ति में लड़खड़ा जाते हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक धर्मी व्यक्ति।” इब्रानी में पुल्लिंग एकवचन रूप है, जो इस नीतिवचन में प्रतिनिधि रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ “सात” संभवतः बार-बार होने या पूर्णता का मुहावरा है: धर्मी अनेक बार गिर सकता है और फिर उठ खड़ा होता है।'
    reason: cultural_note
  - marker: c
    text: या “संकट में ठोकर खाते हैं” अथवा “विपत्ति से धराशायी हो जाते हैं।” यहाँ इब्रानी शब्द नैतिक बुराई के बजाय अनिष्ट, संकट या विपत्ति का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का आधार बताता है; इसलिए कारणसूचक संबंध को स्पष्ट रखा गया है।
- source_word: שֶׁבַע
  choice: सात बार
  rationale: मूल का अंक और उसका बार-बार होने का नीतिवचनात्मक बिंब दोनों सुरक्षित रहते हैं।
- source_word: יִפּוֹל
  choice: गिरता है
  rationale: अपूर्ण क्रिया यहाँ सामान्य, बार-बार लागू होने वाला नीतिवचनात्मक सत्य व्यक्त करती है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: इब्रानी का पुल्लिंग एकवचन रूप यहाँ एक प्रतिनिधि व्यक्ति के लिए प्रयुक्त है; हिंदी में ‘धर्मी’ और एकवचन क्रिया इस रूप को स्वाभाविक ढंग से रखते हैं।
- source_word: וָקָם
  choice: फिर भी उठ खड़ा होता है
  rationale: ‘उठना’ मूल अर्थ है; ‘फिर भी’ विपरीत परिणाम और संकट से उबरने को स्वाभाविक हिंदी में प्रकट करता है, बिना इसे पाप से विशेष रूप से जोड़ने के।
- source_word: וּרְשָׁעִים
  choice: पर दुष्ट
  rationale: संदर्भ में वाव धर्मी और दुष्ट के परिणामों के बीच विरोध दिखाता है; बहुवचन अर्थ क्रिया में भी स्पष्ट है।
- source_word: יִכָּשְׁלוּ
  choice: लड़खड़ा जाते हैं
  rationale: यह मूल के ठोकर खाने या टिक न पाने के बिंब को रखता है और धर्मी के फिर उठने के साथ विरोध बनाता है।
- source_word: בְרָעָה
  choice: विपत्ति में
  rationale: इस संदर्भ में רָעָה का अर्थ नैतिक बुराई से अधिक संकट, अनिष्ट या विपत्ति है।
theological_decisions:
- issue: צַדִּיק का प्रतिनिधिक पुल्लिंग एकवचन
  choice: धर्मी
  alternative: धर्मी जन / एक धर्मी व्यक्ति
  rationale: मूल में पुल्लिंग एकवचन है, पर नीतिवचन में वह एक प्रतिनिधि प्रकार को दर्शाता है। हिंदी का ‘धर्मी’ एकवचन क्रिया के साथ रूप और सामान्य प्रयोग दोनों को बनाए रखता है।
- issue: नीतिवचन में ‘गिरने’ का आशय
  choice: विपत्ति में बार-बार गिरने के बाद धर्मी का संभलना
  alternative: बार-बार पाप करना और पश्चात्ताप करना / केवल शारीरिक रूप से गिरना
  rationale: ‘विपत्ति’ और दुष्टों के लड़खड़ाने का समानांतर संकट और पराजय की ओर संकेत करता है। पाठ गिरने को विशेष रूप से पाप नहीं कहता, इसलिए अनुवाद उस धार्मिक व्याख्या को नहीं जोड़ता।
- issue: רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: यहाँ विरोध नैतिक बुराई करने का नहीं, संकट आने पर धर्मी और दुष्ट के अलग परिणामों का है; फिर भी शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण नीतिवचनात्मक रूप। अर्धविराम दोनों विपरीत परिणामों को स्पष्ट करता है। ‘फिर भी’ मूल के निहित विरोध को स्वाभाविक हिंदी में व्यक्त करता है; कोई सांप्रदायिक या विशेष धर्मसैद्धांतिक अर्थ नहीं जोड़ा गया है।
