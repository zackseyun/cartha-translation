translation:
  language: hi
  text: तब तेरी गरीबी किसी घूमने-फिरने वाले की तरह आएगी, और तेरा अभाव ढालधारी आदमी की तरह आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: तब ... चली आएगी
  rationale: संयोजक वाव पिछले पद में बताई गई सुस्ती के परिणाम को आगे बढ़ाता है; कहावत की चेतावनी में भविष्यसूचक अर्थ स्वाभाविक है।
- source_word: מִתְהַלֵּךְ
  choice: दबे पाँव चली
  rationale: हित्पएल कृदंत इधर-उधर चलने या घूमने का भाव देता है। गरीबी के मानवीकरण और धमकीपूर्ण आगमन को स्वाभाविक हिन्दी में व्यक्त करने के लिए यह रूप चुना गया है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: רֵישֶׁךָ
  choice: तेरी गरीबी
  rationale: רֵישׁ का अर्थ गरीबी या कंगाली है; 'गरीबी' आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וּמַחְסֹרֶיךָ
  choice: और तेरा अभाव
  rationale: מַחְסוֹר कमी, जरूरत या अभाव को दर्शाता है। प्रत्यययुक्त रूप यहाँ सामूहिक भाव रखता है, जिसे हिन्दी में एकवचन 'अभाव' स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּאִישׁ מָגֵן
  choice: ढालधारी आदमी की तरह
  rationale: כְּ तुलना सूचित करता है और אִישׁ מָגֵן का निकट, मूर्त अर्थ 'ढाल वाला/ढालधारी आदमी' है। यह 'हथियारबंद आदमी' की अपेक्षा मूल बिंब को अधिक सीधे सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। 'तेरी/तेरा' पिछले पदों की एकवचन संबोधन-शैली के अनुरूप है। 'दबे पाँव' गरीबी के धीरे और भयावह ढंग से निकट आने के बिंब को व्यक्त करता है, जबकि पादटिप्पणी मूल कृदंत की व्यापकता बनाए रखती है।
