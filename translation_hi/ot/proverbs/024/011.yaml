  text: הַ֭צֵּל לְקֻחִ֣ים לַ/מָּ֑וֶת וּ/מָטִ֥ים לַ֝/הֶ֗רֶג אִם תַּחְשֽׂוֹךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/024/011.yaml
  text: Rescue those being taken away to death[a], and those staggering to the slaughter, hold them back.
translation:
  language: hi
  text: जो लोग मृत्यु की ओर ले जाए जा रहे हैं, उन्हें बचा[a]; और जो वध की ओर डगमगा रहे हैं, उन्हें रोक ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ के अन्तिम शब्दों का अधिक शाब्दिक अर्थ है: “और जो वध की ओर डगमगा रहे हैं—यदि तू अपने को रोके/पीछे हटे।” उनका वाक्य-विन्यास कठिन है। इन्हें ‘पीछे मत हट’ के निषेध के रूप में भी समझा गया है, या अगले पद के साथ जोड़ा जा सकता है। मुख्य पाठ सन्दर्भ में सम्भावित आशय प्रस्तुत करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצֵּל
  choice: बचा
  rationale: נצל का हिफ़ील आज्ञार्थक रूप तत्काल हस्तक्षेप करके संकट से छुड़ाने का आह्वान करता है। ‘बचा’ आधुनिक हिन्दी में स्वाभाविक, सीधा और तात्कालिक है।
- source_word: לְקֻחִים
  choice: जो ... ले जाए जा रहे हैं
  rationale: לקח का कर्मवाच्य कृदन्त पकड़े या ले जाए जा रहे लोगों और जारी क्रिया को व्यक्त करता है; ‘बन्दी’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: לַמָּוֶת
  choice: मृत्यु के लिए
  rationale: लामेद यहाँ लक्ष्य अथवा नियत परिणाम बताता है। ‘मृत्यु के लिए’ मूल की दिशा और भयावह परिणाम दोनों बनाए रखता है।
- source_word: וּמָטִים
  choice: जो ... लड़खड़ाते जा रहे हैं
  rationale: कृदन्त अस्थिर होकर गिरने या विनाश के कगार पर होने का चित्र देता है। ‘लड़खड़ाते जा रहे हैं’ आसन्न संकट और गतिशीलता को सहज हिन्दी में व्यक्त करता है।
- source_word: לַהֶרֶג
  choice: वध की ओर
  rationale: הרג हिंसक हत्या या वध का बोध कराता है। ‘वध की ओर’ लक्ष्य की छवि और मूल की कठोरता बनाए रखता है।
- source_word: אִם תַּחְשׂוֹךְ
  choice: उन्हें रोक ले
  rationale: मसोरेटिक पाठ का शाब्दिक रूप ‘यदि तू रोके/रोक रखे’ वाक्य-विन्यास की दृष्टि से कठिन है। सन्दर्भ और समानान्तरता में इसे हस्तक्षेप की दूसरी पुकार के रूप में प्रस्तुत किया गया है; वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पद के अन्त में אִם תַּחְשׂוֹךְ का वाक्यगत बल
  choice: 'इसे समानान्तर आग्रह के रूप में प्रस्तुत किया गया: ‘उन्हें रोक ले।’'
  alternative: अधिक शाब्दिक ‘यदि तू रोक रखे’ को पद 12 से जोड़ना, अथवा इसे ‘पीछे मत हट’ जैसे निषेध के रूप में समझना।
  rationale: यह मुख्यतः वाक्य-विन्यास और अनुवाद की समस्या है, कोई विशिष्ट सिद्धान्तगत दावा नहीं। अकेले पद में समानान्तर आज्ञा नैतिक आह्वान को स्पष्ट करती है, जबकि पाद-टिप्पणी मूल की कठिनता और वैकल्पिक सम्बन्ध को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन निकट आज्ञार्थक ‘बचा/रोक ले’ मूल के एकवचन सम्बोधन और तात्कालिकता को दर्शाता है। भाषा साधारण पाठक के लिए स्पष्ट रखते हुए ‘मृत्यु’ और ‘वध’ से गरिमामय, गम्भीर स्वर बनाए रखा गया है।
