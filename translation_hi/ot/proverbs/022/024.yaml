  text: Do not befriend a man given to anger[b][a], and do not go with a man of wrath.
translation:
  language: hi
  text: क्रोधी मनुष्य से मित्रता न करना,[a] और क्रोध से भरे हुए मनुष्य की संगति में न जाना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘क्रोधी मनुष्य की संगति न करना।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘क्रोध से भरे हुए मनुष्य के साथ न आना’; यहाँ आशय उसके साथ जुड़ने या उसकी संगति में रहने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְרַע
  choice: मित्रता करना
  rationale: हित्पएल रूप यहाँ किसी का मित्र या निकट साथी बनने का भाव देता है। ‘मित्रता करना’ आधुनिक हिन्दी में इस संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּעַל אָף
  choice: क्रोधी मनुष्य
  rationale: בעל के साथ गुण-सूचक संज्ञा उस गुण से पहचाने जानेवाले व्यक्ति को दर्शाती है। אף का शाब्दिक अर्थ ‘नाक’ है, पर यहाँ इसका प्रचलित अर्थ ‘क्रोध’ है।
- source_word: אִישׁ חֵמוֹת
  choice: क्रोध से भरा मनुष्य
  rationale: यह पद ऐसे मनुष्य का वर्णन करता है जो तीव्र क्रोध या क्रोध के प्रकोपों से चिह्नित है। यह अनुवाद दूसरे चरण को पहले के समान रखते हुए उसकी तीव्रता भी व्यक्त करता है।
- source_word: תָבֽוֹא
  choice: संगति में जाना
  rationale: בוא का मूल अर्थ ‘आना/जाना’ है; इस समानांतर संदर्भ में आशय ऐसे व्यक्ति के साथ जुड़ने या उसकी संगति में पड़ने से है।
- source_word: אַל ... לֹא
  choice: न करना ... न जाना
  rationale: इब्रानी की दोनों समानांतर निषेधाज्ञाओं को हिन्दी में अलग-अलग स्पष्ट निषेध के रूप में रखा गया है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: पुल्लिंग एकवचन रूप को नीतिवचन के प्रतिनिधि व्यक्ति के अर्थ में रखते हुए ‘मनुष्य’ चुना गया है।
