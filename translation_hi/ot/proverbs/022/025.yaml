  text: lest you learn his ways and take a snare for yourself[a][b].
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम उसके चाल-चलन को सीख लो[a] और अपने लिए फंदा ले लो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी राह” अथवा “उसकी जीवन-रीति।” इब्रानी का एकवचन रूप किसी व्यक्ति के अभ्यस्त आचरण को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने प्राण के लिए फंदा ले लो” अथवा “अपनी आत्मा के लिए फंदा ले लो।” यहाँ इब्रानी शब्द नेफ़ेश का अर्थ संभवतः स्वयं व्यक्ति है, न कि विशेष रूप से “आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक आशंका और चेतावनी को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תֶּאֱלַף
  choice: सीख लो
  rationale: क़ाल रूप यहाँ सीखने या संगति से अभ्यस्त हो जाने का भाव रखता है; ‘सीख लो’ सरल है और प्रसंग में व्यवहार अपनाने का संकेत देता है।
- source_word: אָרְחֹתוֹ
  choice: उसके चाल-चलन को
  rationale: इब्रानी में रूप एकवचन है और व्यक्ति के अभ्यस्त आचरण या जीवन-पद्धति को दर्शाता है; ‘चाल-चलन’ इस भाव को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלָקַחְתָּ
  choice: लगा लो
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है, पर फंदे के साथ हिन्दी में ‘अपने लिए फंदा लगा लेना’ रूपक को जीवंत रखते हुए स्वाभाविक अर्थ देता है।
- source_word: מוֹקֵשׁ
  choice: फंदा
  rationale: यह जाल या फंदे के रूपक द्वारा नैतिक संकट को व्यक्त करता है; ‘फंदा’ सामान्य पाठक के लिए स्पष्ट और साहित्यिक दोनों है।
- source_word: לְנַפְשֶׁךָ
  choice: अपने लिए
  rationale: נֶפֶשׁ यहाँ संभवतः पूरे व्यक्ति अथवा स्वयं को सूचित करता है, न कि आत्मा के विषय में कोई पारिभाषिक कथन; इसलिए प्रतिवर्ती हिन्दी स्वाभाविक है।
theological_decisions:
- issue: נֶפֶשׁ का आशय
  choice: अपने लिए
  alternative: अपने प्राण के लिए / अपनी आत्मा के लिए
  rationale: संदर्भ व्यक्तिगत हानि या विनाश की चेतावनी देता है। ‘अपने लिए’ मूल की व्यापक व्यक्ति-सूचक शक्ति बनाए रखता है और आत्मा के बारे में अनावश्यक पारिभाषिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; चेतावनी का नीतिवचन-सदृश संक्षिप्त और गरिमापूर्ण स्वर रखा गया है। ‘चाल-चलन’ habitual conduct को स्पष्ट करता है, और ‘फंदा लगा लो’ लक्ष्य भाषा में सहज रहते हुए मूल रूपक को सुरक्षित रखता है।
