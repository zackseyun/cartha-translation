  text: הַ֥ט אָזְנְ/ךָ֗ וּ֭/שְׁמַע דִּבְרֵ֣י חֲכָמִ֑ים וְ֝/לִבְּ/ךָ֗ תָּשִׁ֥ית לְ/דַעְתִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/017.yaml
  text: Incline your ear and hear the words of the wise[a], and set your heart on my knowledge.
translation:
  language: hi
  text: अपना कान झुका और बुद्धिमानों की बातें सुन; अपने मन को मेरे ज्ञान पर लगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन को मेरी शिक्षा पर लगा।” इब्रानी में शाब्दिक रूप से “मेरे ज्ञान” है। इसका अर्थ वक्ता का अपना ज्ञान भी हो सकता है, या विस्तार से वह शिक्षा जिसे उसका ज्ञान प्रदान करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַט
  choice: झुका
  rationale: हिफ़ील आज्ञार्थक क्रिया जानबूझकर किसी ओर मोड़ने या झुकाने का भाव देती है। ‘कान झुका’ मूल रूपक को बनाए रखता है और केवल ‘सुन’ कहने की अपेक्षा सचेत ध्यान पर अधिक बल देता है।
- source_word: אָזְנְךָ
  choice: अपना कान
  rationale: इब्रानी में संज्ञा एकवचन है और उसके साथ द्वितीय पुरुष एकवचन प्रत्यय है। हिन्दी में ‘अपना कान’ स्रोत की एकवचन छवि को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: וּשְׁמַע
  choice: और ... सुन
  rationale: שׁמע का सामान्य अर्थ ‘सुनना’ है, जिसमें ध्यान से सुनने का भाव भी हो सकता है। इसे अलग आज्ञा के रूप में रखने से ‘कान झुका’ और ‘सुन’—दोनों क्रियाएँ बनी रहती हैं।
- source_word: דִּבְרֵי חֲכָמִים
  choice: बुद्धिमानों की बातें
  rationale: דִּבְרֵי का अर्थ ‘बातें/वचन’ और חֲכָמִים का अर्थ ‘बुद्धिमान लोग’ है। ‘बुद्धिमानों की बातें’ आधुनिक हिन्दी में सहज है और मूल के बहुवचन तथा लिंग-अनिश्चित सामूहिक अर्थ को बनाए रखता है।
- source_word: וְלִבְּךָ
  choice: अपने मन को
  rationale: לֵב इब्रानी में भावना के साथ विचार, इच्छा और संकल्प के भीतरी केंद्र को दर्शाता है। इस प्रसंग में हिन्दी का ‘मन’ ध्यान और संकल्प दोनों को स्वाभाविक रूप से व्यक्त करता है; ‘हृदय’ अधिक शाब्दिक होता, पर यहाँ कम सहज लगता।
- source_word: תָּשִׁית
  choice: लगा
  rationale: क्रिया का मूल अर्थ रखना, स्थापित करना या किसी ओर लगाना है। ‘मन को ... ओर लगा’ हिन्दी में स्वाभाविक है और इच्छापूर्वक ध्यान केंद्रित करने का भाव रखता है।
- source_word: לְדַעְתִּי
  choice: मेरे ज्ञान की ओर
  rationale: रूप में לְ उपसर्ग, דַּעַת ‘ज्ञान’ और प्रथम पुरुष एकवचन प्रत्यय है। ‘मेरे ज्ञान की ओर’ प्रथम पुरुष संबंध और ‘ज्ञान’ की संकल्पना को बनाए रखते हुए लक्ष्यसूचक לְ का अर्थ व्यक्त करता है; ‘मेरी शिक्षा पर’ अधिक व्याख्यात्मक विकल्प है।
theological_decisions:
- issue: לְדַעְתִּי में ‘मेरे ज्ञान’ और ‘मेरी शिक्षा’ के बीच अर्थ-संबंध
  choice: मुख्य पाठ में ‘मेरे ज्ञान की ओर’
  alternative: ‘मेरी शिक्षा पर’
  rationale: इब्रानी पदबंध वक्ता के अपने ज्ञान को सीधे दर्शा सकता है, या विस्तार से उस शिक्षा को जिसे वह ज्ञान प्रदान करता है। मुख्य पाठ अपेक्षाकृत औपचारिक अर्थ रखता है और अधिक व्याख्यात्मक विकल्प को पादटिप्पणी में देता है, जिससे मूल की अस्पष्टता अनावश्यक रूप से समाप्त नहीं होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन मूल के द्वितीय पुरुष एकवचन पुल्लिंग के अनुरूप अनौपचारिक एकवचन आज्ञार्थक शैली में है, पर हिन्दी में कर्ता ‘तू’ को अनावश्यक रूप से व्यक्त नहीं किया गया। अर्धविराम पद के दो समांतर निर्देशों को स्पष्ट करता है।
