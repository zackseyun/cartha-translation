  text: עָשִׁ֣יר וָ/רָ֣שׁ נִפְגָּ֑שׁוּ עֹשֵׂ֖ה כֻלָּ֣/ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/002.yaml
  text: The rich and the poor meet together[a]; Yahweh is the maker of them all.
translation:
  language: hi
  text: धनी और निर्धन एक-दूसरे से मिलते हैं[a]; उन सबका रचयिता यहोवा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक व्याख्यात्मक रूप में, “धनी और निर्धन में यह बात समान है: उन सबका रचयिता यहोवा है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी
  rationale: यह विशेषण संज्ञा के रूप में किसी धनी व्यक्ति अथवा धनी वर्ग का सामान्य प्रतिनिधित्व करता है; संक्षिप्त ‘धनी’ नीतिवचन की शैली बनाए रखता है।
- source_word: וָרָשׁ
  choice: और निर्धन
  rationale: यह עָשִׁיר के विपरीत सामाजिक अवस्था को व्यक्त करता है। ‘निर्धन’ आधुनिक, गरिमापूर्ण और सामान्य वर्ग-सूचक रूप है।
- source_word: נִפְגָּשׁוּ
  choice: एक-दूसरे से मिलते हैं
  rationale: निफ़अल रूप पारस्परिक मिलने या आमने-सामने आने का भाव रखता है। यह चयन मूल ठोस बिंब को बनाए रखता है; ‘एक बात में समान हैं’ वाला व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עֹשֵׂה
  choice: रचयिता
  rationale: काल कृदंत यहाँ संज्ञात्मक रूप में ‘रचनेवाला’ दर्शाता है। ‘रचयिता’ स्वाभाविक और गरिमापूर्ण हिंदी में उस निरंतर संज्ञात्मक बल को संक्षेप में व्यक्त करता है।
- source_word: כֻלָּם
  choice: उन सबका
  rationale: यह धनी और निर्धन—दोनों को सामूहिक रूप से समेटता है और मूल के समावेशी विस्तार को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: पहले खंड का व्याख्यात्मक बल
  choice: धनी और निर्धन के एक-दूसरे से मिलने के ठोस बिंब को मुख्य पाठ में रखा गया है।
  alternative: धनी और निर्धन में यह बात समान है कि यहोवा उन सबका रचयिता है।
  rationale: נִפְגָּשׁוּ का सीधा अर्थ परस्पर मिलना है, यद्यपि नीतिवचन के संदर्भ में यह उनकी साझा मानवीय स्थिति का संकेत भी दे सकता है। मुख्य पाठ और पादटिप्पणी दोनों संभावनाओं को बिना अनावश्यक रूप से निर्णीत किए सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘एक-दूसरे से’ पारस्परिक क्रिया को स्वाभाविक हिंदी में स्पष्ट करता है; पादटिप्पणी वैकल्पिक व्याख्यात्मक अर्थ सुरक्षित रखती है।
