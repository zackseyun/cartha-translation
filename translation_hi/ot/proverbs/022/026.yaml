  yaml_path: translation/ot/proverbs/022/026.yaml
  text: Do not be among those who strike hands[a], among those who become surety for debts.
translation:
  language: hi
  text: 'हाथ पर हाथ मारकर ज़मानत देनेवालों में शामिल न होना,[a]

    और कर्ज़ों के ज़ामिनों में से भी न होना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हाथ पर हाथ मारनेवालों में।” यह ज़मानत की प्रतिज्ञा को पक्का करने के लिए किए जानेवाले संकेत का उल्लेख है।
    reason: मुहावरे का शाब्दिक रूप और सांस्कृतिक अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אַל תְּהִי
  choice: न होना
  rationale: निषेधवाचक אַל के साथ היה का अपूर्ण रूप यहाँ चेतावनीपूर्ण निषेध व्यक्त करता है। हिंदी में ‘न होना’ पद्यात्मक और स्वाभाविक है।
- source_word: בְתֹקְעֵי כָף
  choice: जो हाथ पर हाथ मारकर ज़मानत देते हैं
  rationale: תקע כף का शाब्दिक संकेत हाथ/हथेली मारने की ओर है, पर प्रसंग में यह ज़मानत की प्रतिज्ञा पक्की करने का व्यवहार है; अनुवाद क्रिया और आशय दोनों रखता है।
- source_word: בַּעֹרְבִים
  choice: जो ... ज़ामिन बनते हैं
  rationale: ערב यहाँ किसी दूसरे की आर्थिक देनदारी की ज़मानत लेने या ज़ामिन बनने के अर्थ में है। ‘ज़ामिन बनना’ आधुनिक हिंदी में संक्षिप्त और सटीक है।
- source_word: מַשָּׁאוֹת
  choice: कर्ज़ों के
  rationale: यह बहुवचन संज्ञा संदर्भ में ऋण अथवा आर्थिक देनदारियों को सूचित करती है; ‘कर्ज़ों’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; नीति-वचन के समानांतर काव्य-विन्यास को बनाए रखा गया है। ‘ज़मानत’ और ‘ज़ामिन’ प्रचलित कानूनी-आर्थिक शब्द हैं, जबकि पादटिप्पणी मूल शारीरिक संकेत को स्पष्ट करती है।
