    issue: Primary rendering of תַּסֵּג as “न हटाना”
    rationale: In this legal/wisdom collocation, the verb means to shift or move a landmark from its established position. “न खिसकाना” is a safer primary Hindi equivalent; “हटाना” may remain an alternative.
