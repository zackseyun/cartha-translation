  naturalness: The sentence is clear and suitably concise. The oblique plural form “पुरखाओं” is not standard here; after “तुम्हारे,” it should be “पुरखों.”
  terminology: “सीमा-चिह्न” appropriately makes explicit the concrete landmark implied by גְּבוּל in this context. “प्राचीन” suitably conveys עוֹלָם. “पुरखों” retains the masculine ‘fathers’ wording while footnote b responsibly notes the broader ancestral sense.
