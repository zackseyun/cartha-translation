  text: Do not move an ancient boundary marker that your fathers made[a][b].
translation:
  language: hi
  text: उस प्राचीन सीमा-चिह्न को न खिसकाना, जिसे तुम्हारे पुरखों ने स्थापित किया था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस प्राचीन सीमा-चिह्न को न हटाना, जिसे तुम्हारे पुरखों ने स्थापित किया था।”
    reason: lexical_alternative
  - marker: b
    text: “पुरखों” का अर्थ अधिक व्यापक रूप से पूर्वज भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: न हटाना
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। हिंदी में ‘न हटाना’ सूक्ति-साहित्य के सीधे निषेध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תַּסֵּג
  choice: हटाना
  rationale: נסג यहाँ सीमा को उसके ठहराए हुए स्थान से खिसकाने या हटाने के अर्थ में है। ‘हटाना’ सहज हिंदी है; ‘खिसकाना’ अधिक स्पष्ट वैकल्पिक अर्थ है।
- source_word: גְּבוּל
  choice: सीमा-चिह्न
  rationale: शब्द का मूल अर्थ ‘सीमा’ है, पर תסיג के साथ यह उस चिह्न या पत्थर की ओर संकेत करता है जिससे भूमि की सीमा निर्धारित होती थी।
- source_word: עוֹלָם
  choice: प्राचीन
  rationale: इस प्रसंग में עוֹלָם अनंतता नहीं, बल्कि बहुत पहले से स्थापित होने का भाव देता है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक उपवाक्य को स्वाभाविक आधुनिक हिंदी में जोड़ता है।
- source_word: עָשׂוּ
  choice: स्थापित किया था
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना/बनाना’ है, किंतु सीमा-चिह्न के प्रसंग में ‘स्थापित करना’ अभिप्रेत क्रिया को अधिक स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲבוֹתֶיךָ
  choice: तुम्हारे पुरखाओं
  rationale: बहुवचन אבות पूर्ववर्ती पिताओं या व्यापक रूप से पूर्वजों को सूचित कर सकता है। ‘पुरखा’ स्रोत के पुरुषवाची रूप को बनाए रखते हुए आधुनिक पाठक के लिए वंशगत अर्थ स्पष्ट करता है।
