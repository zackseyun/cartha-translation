  yaml_path: translation/ot/proverbs/022/001.yaml
  text: A name is to be chosen rather than great wealth[c][b][a], and favor is better than silver and gold.
translation:
  language: hi
  text: बहुत धन की अपेक्षा नाम चुनने योग्य है,[a][b] और अनुकूल दृष्टि चाँदी और सोने से उत्तम है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत धन की अपेक्षा नाम अधिक वांछनीय है; चाँदी और सोने से अनुकूल दृष्टि उत्तम है।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नाम” का अर्थ किसी व्यक्ति की प्रतिष्ठा या सम्मान भी है।
    reason: cultural_note
  - marker: c
    text: “अनुकूल दृष्टि” के लिए “कृपा” भी संभव है। इब्रानी शब्द प्रसंग के अनुसार मनोहरता, कृपा या किसी की अनुकूल दृष्टि का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִבְחָר
  choice: चुनने योग्य है
  rationale: निफ़अल कृदन्त यहाँ विधेय रूप में मूल्य और वरीयता व्यक्त करता है; यह केवल निष्क्रिय ‘चुना जाता है’ नहीं, बल्कि ‘वरीय ठहराया जाना चाहिए’ का भाव देता है।
- source_word: שֵׁם
  choice: नाम
  rationale: मूल शब्द का सीधा बिंब सुरक्षित रखा गया है; इस नीतिवचन में ‘नाम’ से सामाजिक प्रतिष्ठा और सम्मान भी अभिप्रेत हैं।
- source_word: מֵעֹשֶׁר רָב
  choice: बहुत धन के बजाय
  rationale: तुलनात्मक מִן को स्वाभाविक हिन्दी में ‘के बजाय’ से व्यक्त किया गया है; רָב यहाँ धन की बड़ी मात्रा बताता है।
- source_word: חֵן
  choice: कृपा-दृष्टि
  rationale: समानांतर पंक्ति और सामाजिक संदर्भ में यह दूसरों की अनुकूल दृष्टि या मान्यता को दर्शाता है; ‘कृपा-दृष्टि’ इस अर्थ को बिना अनावश्यक रूप से विशिष्ट धर्मवैज्ञानिक आशय देने के व्यक्त करती है।
- source_word: מִכֶּסֶף וּמִזָּהָב
  choice: चाँदी-सोने से
  rationale: मूल की बहुमूल्य धातुओं की जोड़ी को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: טוֹב
  choice: उत्तम
  rationale: यद्यपि शब्द मूलतः ‘अच्छा’ है, यहाँ מִן के साथ तुलना में ‘उत्तम’ स्वाभाविक रूप से ‘बेहतर’ का अर्थ व्यक्त करता है।
