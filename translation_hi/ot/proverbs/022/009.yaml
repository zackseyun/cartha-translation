  text: טֽוֹב עַ֭יִן ה֣וּא יְבֹרָ֑ךְ כִּֽי נָתַ֖ן מִ/לַּחְמ֣/וֹ לַ/דָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/009.yaml
  text: He who has a generous eye will be blessed[a], for he gives some of his bread to the poor.
translation:
  language: hi
  text: उदार व्यक्ति[a] आशीष पाएगा, क्योंकि वह अपनी रोटी में से गरीब को देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “भली आँख वाला”; यह उदारता या खुले हाथ से देने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב עַיִן
  choice: उदार व्यक्ति
  rationale: इब्रानी का शाब्दिक अर्थ ‘भली आँख वाला’ है, पर यह उदारता का मुहावरा है। हिन्दी में ‘उदार दृष्टि वाला’ व्यापक सोच रखने का अर्थ दे सकता है, इसलिए मुख्य पाठ में स्वाभाविक और स्पष्ट अर्थ रखा गया है तथा मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: יְבֹרָךְ
  choice: आशीष पाएगा
  rationale: यह निष्क्रिय क्रिया है। यह अनुवाद भावी/अपेक्षित परिणाम को व्यक्त करता है और आशीष देनेवाले को स्पष्ट करके मूल पाठ की अनिर्दिष्टता नहीं मिटाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या आधार प्रस्तुत करता है।
- source_word: נָתַן
  choice: देता है
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर नीतिवचन के सामान्य कथन में चरित्रगत, नियमित आचरण बताती है; हिन्दी का सामान्य वर्तमान काल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִלַּחְמוֹ
  choice: अपनी रोटी में से
  rationale: ‘में से’ מִן के अंशसूचक भाव को बनाए रखता है, और ‘रोटी’ मूल के ठोस बिंब को सुरक्षित रखती है।
- source_word: לַדָּל
  choice: गरीब को
  rationale: דַּל यहाँ आर्थिक रूप से निर्बल या निर्धन व्यक्ति को दर्शाता है; ‘गरीब’ सीधा और सामान्य हिन्दी शब्द है।
theological_decisions:
- issue: आशीष देनेवाले की पहचान
  choice: आशीष पाएगा
  alternative: परमेश्वर उसे आशीष देगा
  rationale: मूल इब्रानी में क्रिया निष्क्रिय है और कर्ता व्यक्त नहीं किया गया; इसलिए परमेश्वर को स्पष्ट कर्ता बनाकर निहित अर्थ को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘उदार व्यक्ति’ सामान्य पाठक के लिए मुहावरे का आशय स्पष्ट करता है; मूल ‘आँख’ का बिंब पादटिप्पणी में सुरक्षित है।
