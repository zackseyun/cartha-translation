base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/016.yaml
  text: One who oppresses the poor to increase his own wealth[a], or gives to the rich[b], will come only to poverty.
translation:
  language: hi
  text: जो अपना धन बढ़ाने के लिए गरीब का शोषण करता है, या धनी को देता है, वह केवल दरिद्रता में पड़ेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी का अर्थ यह भी हो सकता है: “जो अपना धन बढ़ाने के लिए गरीब का शोषण करता और धनी को देता है—वह केवल अभाव में पड़ेगा।” यहाँ दो अलग-अलग काम बताए गए हैं या एक ही मिला-जुला आचरण, यह निश्चित नहीं है। “दरिद्रता” का अनुवाद “अभाव” या “कमी” भी हो सकता है।'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: עֹשֵׁק
  choice: अत्याचार करता है
  rationale: क्रियाविशेषणात्मक कृदंत किसी ऐसे व्यक्ति को दर्शाता है जो गरीब का शोषण या दमन करता है; यह पद सामान्य और निरंतर आचरण का भाव रखता है।
- source_word: דָּל
  choice: गरीब
  rationale: यहाँ शब्द सामाजिक-आर्थिक रूप से निर्धन या असहाय व्यक्ति को सूचित करता है; आर्थिक संदर्भ में ‘गरीब’ स्वाभाविक है।
- source_word: לְהַרְבּוֹת לוֹ
  choice: अपने लाभ के लिए
  rationale: शाब्दिक भाव ‘अपने लिए बढ़ाने को’ है। हिंदी में ‘अपने लाभ के लिए’ उद्देश्य और स्वार्थपूर्ण आर्थिक वृद्धि को स्वाभाविक रूप से व्यक्त करता है, पर ‘धन’ को अनिवार्य रूप से जोड़कर अस्पष्टता समाप्त नहीं करता।
- source_word: נֹתֵן
  choice: या ... देता है
  rationale: दूसरा कृदंत पहले के समानांतर है। संक्षिप्त इब्रानी में दोनों कार्यों का संबंध अस्पष्ट है; मुख्य पाठ में ‘या’ उन्हें दो तुलनीय आत्मघाती आचरणों के रूप में प्रस्तुत करता है।
- source_word: לְעָשִׁיר
  choice: धनी को
  rationale: यह किसी धनवान व्यक्ति अथवा धनी वर्ग का सामान्य उल्लेख है; ‘धनी को’ संक्षिप्त और स्वाभाविक है।
- source_word: אַךְ
  choice: केवल
  rationale: 'यह परिणाम को सीमित और बलयुक्त करता है: अंतिम फल दरिद्रता के सिवा कुछ नहीं।'
- source_word: לְמַחְסוֹר
  choice: दरिद्रता में
  rationale: संज्ञा अभाव, कमी, जरूरत या गरीबी को दर्शाती है। आर्थिक नीति-वचन में ‘दरिद्रता’ स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: दोनों कृदंतों का वाक्यगत संबंध
  choice: दो तुलनीय कार्य—गरीब पर अपने लाभ के लिए अत्याचार करना, या धनी को देना—एक ही परिणाम, दरिद्रता, की ओर ले जाते हैं।
  alternative: एक ही व्यक्ति गरीब पर अत्याचार भी करता है और धनी को देता भी है; उसका यह संयुक्त आचरण दरिद्रता की ओर ले जाता है।
  rationale: इब्रानी कथन अत्यंत संक्षिप्त है और कोई स्पष्ट संयोजक नहीं देता। मुख्य पाठ में ‘या’ संतुलित चेतावनी को सहज बनाता है, जबकि पादटिप्पणी संयुक्त अर्थ की वास्तविक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, नीतिवचन-सुलभ और गरिमापूर्ण शैली। ‘अपने लाभ के लिए’ मूल के आर्थिक स्वार्थ को व्यक्त करता है, और पादटिप्पणी संक्षिप्त इब्रानी की वाक्यगत तथा शब्दार्थगत अस्पष्टता बनाए रखती है।
