  text: A prudent man sees danger and hides himself[b][a], but the simple pass on and suffer for it.
translation:
  language: hi
  text: समझदार व्यक्ति खतरे[a] को देखकर छिप जाता है, पर नासमझ लोग आगे बढ़ते रहते हैं और उसके परिणाम भुगतते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई,” “हानि” अथवा “विपत्ति।” इब्रानी शब्द नैतिक बुराई या किसी अनिष्टकारी परिस्थिति—दोनों को दर्शा सकता है; यहाँ संदर्भ सामने आने वाले खतरे का है।
    reason: lexical_alternative
  - marker: b
    text: या “दण्ड पाते हैं।” इब्रानी शब्द दण्ड पर बल दे सकता है, पर ज्ञान-साहित्य में यह अपने चुने हुए मार्ग के परिणाम भुगतने को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוּם
  choice: समझदार व्यक्ति
  rationale: नीतिवचन के संदर्भ में यह शब्द छल-कपट नहीं, बल्कि सूझ-बूझ और सावधानी से काम लेने वाले व्यक्ति को दर्शाता है। एकवचन रूप भी सुरक्षित रहता है।
- source_word: רָאָה
  choice: देखकर
  rationale: इब्रानी का पूर्ण रूप यहाँ लोकोक्तिपरक सामान्य सत्य व्यक्त करता है। हिंदी में संयुक्त क्रिया-रचना सामान्य वर्तमान अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: רָעָה
  choice: खतरे
  rationale: यह संज्ञा नैतिक बुराई, विपत्ति या हानि को दर्शा सकती है; यहाँ सामने आती हानिकारक परिस्थिति अभिप्रेत है, जिसे समझदार व्यक्ति पहचान लेता है।
- source_word: ו/יסתר
  choice: छिप जाता है
  rationale: निफ़अल रूप स्वयं को बचाने के लिए ओझल होने या आश्रय लेने का भाव देता है; यह चयन मूल बिंब को सहज हिंदी में बनाए रखता है।
- source_word: פְתָיִם
  choice: भोले लोग
  rationale: यह ज्ञान-साहित्य का विशेष शब्द है, जो अनुभव और विवेक की कमी वाले सरल या नासमझ लोगों को दर्शाता है; यहाँ 'भोले' अपमानजनक कठोरता के बिना वह अर्थ देता है।
- source_word: עָבְרוּ
  choice: आगे बढ़ते जाते हैं
  rationale: क्रिया बिना बचाव का उपाय किए उसी दिशा में चलते रहने को दर्शाती है। यह हिंदी अभिव्यक्ति उस निरंतरता को स्पष्ट करती है।
- source_word: וְנֶעֱנָשׁוּ
  choice: उसका फल भुगतते हैं
  rationale: क्रिया दण्डित होने या अपने आचरण के हानिकारक परिणाम सहने—दोनों का भाव दे सकती है। यह चयन न्यायिक दण्ड को अनिवार्य किए बिना परिणाम भुगतने का अर्थ बनाए रखता है।
theological_decisions:
- issue: וְנֶעֱנָשׁוּ में दण्ड और स्वाभाविक परिणाम के बीच अर्थगत तनाव
  choice: उसका फल भुगतते हैं
  alternative: दण्ड पाते हैं
  rationale: ज्ञान-साहित्य के इस सामान्य कथन में मूल क्रिया दण्ड का संकेत दे सकती है, पर यह मूर्खतापूर्ण मार्ग के परिणाम को भी व्यक्त कर सकती है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी अधिक न्यायिक विकल्प बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। वाक्य की संक्षिप्त लोकोक्तिपरक समानांतरता रखी गई है। 'समझदार व्यक्ति' और 'भोले लोग' सामान्य पाठक के लिए स्पष्ट हैं; पादटिप्पणियाँ मूल की वास्तविक अर्थगत व्यापकता सुरक्षित रखती हैं।
