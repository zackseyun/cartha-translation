source:
  edition: WLC
  text: אִ֭וֶּלֶת קְשׁוּרָ֣ה בְ/לֶב נָ֑עַר שֵׁ֥בֶט מ֝וּסָ֗ר יַרְחִיקֶ֥/נָּה מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/015.yaml
  text: Folly is bound up in the heart of a boy[a]; the rod of discipline will drive it far from him.
translation:
  language: hi
  text: मूर्खता लड़के के हृदय में बँधी है; अनुशासन की छड़ी उसे लड़के से दूर कर देगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्खता एक युवक के हृदय में बँधी है।”
    reason: נָעַר की आयु-सीमा बालक से युवक तक हो सकती है; ‘युवक’ इस वैकल्पिक आयु-संबंधी संभावना को दर्शाता है।
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह शब्द केवल बुद्धि की कमी नहीं, बल्कि नीतिवचन के संदर्भ में नैतिक और व्यावहारिक विवेकहीनता को व्यक्त करता है।
- source_word: קְשׁוּרָה
  choice: बँधी रहती है
  rationale: निष्क्रिय कृदंत किसी चीज़ के दृढ़ता से जुड़े होने का भाव देता है; यह हिन्दी में स्वाभाविक रूप से उसकी जड़ जमाए निकटता को व्यक्त करता है।
- source_word: בְלֶב
  choice: हृदय में
  rationale: हिब्रू में हृदय विचार, इच्छा और अभिलाषा का केंद्र है; स्रोत का रूपक बनाए रखा गया है।
- source_word: נָעַר
  choice: लड़के
  rationale: शब्द की सीमा बालक से युवक तक हो सकती है, पर यहाँ पुल्लिंग एकवचन और अनुशासनाधीन अपरिपक्व व्यक्ति के संदर्भ में 'लड़का' उपयुक्त है।
- source_word: שֵׁבֶט
  choice: छड़ी
  rationale: ठोस सुधारात्मक साधन की छवि को अमूर्त 'दंड' या केवल 'अनुशासन' में नहीं बदला गया है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: बुद्धि-साहित्य में यह सुधारात्मक प्रशिक्षण, शिक्षा और ताड़ना का व्यापक भाव रखता है।
- source_word: יַרְחִיקֶנָּה
  choice: उसे दूर कर देगी
  rationale: 'रחק के हिफ़ील रूप का कारक भाव सुरक्षित है: छड़ी मूर्खता को दूर करती है।'
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: यह लड़के से अलगाव को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या शारीरिक अनुशासन की ठोस छवि को नरम करके केवल रूपकात्मक या अमूर्त बनाया जाए
  choice: '''अनुशासन की छड़ी'' की ठोस अभिव्यक्ति बनाए रखी गई।'
  alternative: केवल 'अनुशासन' या 'सुधार' कहना
  rationale: हिब्रू में שֵׁבֶט स्पष्ट रूप से उपस्थित है। उसे हटाना स्रोत की तनावपूर्ण ठोस छवि को चुपचाप हल्का करना होता; साथ ही מוּסָר बताता है कि संदर्भ सुधारात्मक प्रशिक्षण का है।
- issue: נָעַר का लिंग और आयु-संबंधी अनुवाद
  choice: '''लड़का'''
  alternative: '''बालक'' या ''युवा'''
  rationale: स्रोत पुल्लिंग एकवचन है और प्रसंग अनुशासनाधीन अपरिपक्व पुरुष किशोर/बालक की ओर संकेत करता है; फिर भी शब्द की व्यापक आयु-सीमा पादटिप्पणी में दर्शाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और गरिमापूर्ण नीतिवचनात्मक रूप। 'हृदय' और 'छड़ी' जैसे मूल रूपकों को बनाए रखते हुए वाक्य को साधारण पाठक के लिए स्पष्ट रखा गया है।
