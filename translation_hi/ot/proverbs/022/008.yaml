source:
  edition: WLC
  text: זוֹרֵ֣עַ עַ֭וְלָה יקצור אָ֑וֶן וְ/שֵׁ֖בֶט עֶבְרָת֣/וֹ יִכְלֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/008.yaml
  text: Whoever sows injustice will reap trouble[b][a], and the rod of his fury will come to an end.
translation:
  language: hi
  text: जो अन्याय बोता है, वह मुसीबत काटेगा[a], और उसके क्रोध का डंडा समाप्त हो जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मुसीबत’ के स्थान पर ‘विपत्ति,’ ‘अनर्थ’ या ‘दुःख’ भी हो सकता है। इब्रानी אָוֶן अनिष्टकारी परिणाम या दुर्दशा का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इसका आशय यह भी हो सकता है: ‘उसकी क्रोधपूर्ण शक्ति का अंत हो जाएगा।’ इब्रानी वाक्यांश अन्यायी की हिंसक या दमनकारी शक्ति के मिट जाने की ओर संकेत कर सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹרֵעַ
  choice: जो ... बोता है
  rationale: पुल्लिंग एकवचन कृदंत यहाँ सामान्य नीतिवचन के रूप में प्रयुक्त है; यह चयन उसकी सार्वभौमिक और अभ्यस्त भावना रखते हुए बोने का रूपक बनाए रखता है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह संज्ञा नैतिक गलत काम और अन्याय को व्यक्त करती है; आधुनिक हिन्दी में ‘अन्याय’ स्पष्ट और गंभीर है।
- source_word: יקצור
  choice: काटेगा
  rationale: फसल काटने की क्रिया बोने के कृषि-रूपक को पूरा करती है और अपूर्ण क्रिया के परिणामसूचक भाव को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त करती है।
- source_word: אָוֶן
  choice: मुसीबत
  rationale: यह शब्द अनिष्टकारी परिणाम, विपत्ति या दुःख का बोध करा सकता है; यहाँ अन्याय की उपज के रूप में ‘मुसीबत’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְשֵׁבֶט
  choice: और ... छड़ी
  rationale: שֵׁבֶט छड़ी, डंडा या राजदंड हो सकता है। ‘छड़ी’ प्रहार करने के साधन और अधिकार—दोनों की छवि को खुला रखती है।
- source_word: עֶבְרָתוֹ
  choice: उसके क्रोध की
  rationale: मसोरेटिक पाठ में עֶבְרָה का सामान्य अर्थ क्रोध या प्रकोप है; ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट है और व्यक्ति की हिंसक शक्ति की संभावित व्यंजना भी रहने देता है।
- source_word: יִכְלֶה
  choice: समाप्त हो जाएगी
  rationale: כלה का अर्थ पूरा होना, चुक जाना या समाप्त होना हो सकता है; यह अनुवाद मूल अर्थ को निकटता से और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य וְשֵׁבֶט עֶבְרָתוֹ יִכְלֶה का आशय
  choice: उसके क्रोध की छड़ी समाप्त हो जाएगी
  alternative: उसके क्रोध से चलने वाली दमनकारी शक्ति का अंत हो जाएगा
  rationale: स्वरांकित इब्रानी पाठ का सीधा अर्थ ‘उसके क्रोध की छड़ी’ है। मुख्य पाठ मूल रूपक को बनाए रखता है, जबकि टिप्पणी यह संभावना बताती है कि छड़ी अन्यायी की क्रोधपूर्ण या हिंसक शक्ति का प्रतीक हो सकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बोता है—काटेगा’ कृषि-रूपक को सुरक्षित रखता है, और अंतिम पंक्ति की छड़ी वाली इब्रानी छवि को व्याख्या से बदलने के बजाय ज्यों का त्यों बनाए रखता है।
