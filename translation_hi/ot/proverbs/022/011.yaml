  text: He who loves purity of heart[b][a], and whose speech is gracious—the king is his friend.
translation:
  language: hi
  text: जो हृदय की शुद्धता से प्रेम करता है और जिसकी वाणी में अनुग्रह है[a], राजा उसका मित्र होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जिसके होंठों में अनुग्रह है।”
    reason: lexical_alternative
  - marker: b
    text: या “कोई राजा उसका मित्र होता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֹהֵב
  choice: जो ... प्रेम करता है
  rationale: कर्ता के रूप में प्रयुक्त क़ाल कृदंत एक सामान्य व्यक्ति का वर्णन करता है; यह रूप हिन्दी में लोकोक्तिपरक कथन के लिए स्वाभाविक है।
- source_word: טהור לֵב
  choice: मन की शुद्धता
  rationale: यह पद भीतरी नैतिक शुद्धता व्यक्त करता है। हिन्दी में ‘मन की शुद्धता’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: חֵן שְׂפָתָיו
  choice: जिसकी वाणी मनभावनी है
  rationale: शाब्दिक रूप से यह उसके ‘होंठों’ से जुड़े חֵן, अर्थात् आकर्षण, कृपा या मधुरता को व्यक्त करता है। ‘वाणी मनभावनी’ होंठों के लाक्षणिक अर्थ—बोली—को स्वाभाविक हिन्दी में रखता है।
- source_word: רֵעֵהוּ
  choice: उसका मित्र
  rationale: यह संज्ञा मित्र या साथी के संबंध को दर्शाती है; प्रसंग में ‘मित्र’ सबसे सहज विकल्प है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: इब्रानी में संज्ञा अनिश्चित भी समझी जा सकती है और लोकोक्तिपरक ढंग से किसी राजा को भी सूचित कर सकती है। हिन्दी में बिना निश्चित उपपद के ‘राजा’ इस अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
