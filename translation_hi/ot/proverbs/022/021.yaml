source:
  edition: WLC
  text: לְ/הוֹדִֽיעֲ/ךָ֗ קֹ֭שְׁטְ אִמְרֵ֣י אֱמֶ֑ת לְ/הָשִׁ֥יב אֲמָרִ֥ים אֱ֝מֶ֗ת לְ/שֹׁלְחֶֽי/ךָ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/021.yaml
  text: to make known to you the certainty of words of truth[b][a], so that you may return words of truth to those who sent you.
translation:
  language: hi
  text: ताकि मैं तुम्हें सत्य के वचनों की विश्वसनीयता[a] बता दूँ, ताकि तुम उन्हें, जिन्होंने तुम्हें भेजा है, सत्य के वचनों से उत्तर दे सको।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सत्य के वचनों की सच्चाई।” यहाँ प्रयुक्त शब्द का अर्थ “सच्चाई,” “शुद्धता” या “भरोसेमंदता” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “ताकि तुम जिन्होंने तुम्हें भेजा है, उन्हें सत्य के वचन लौटा सको।”
    reason: alternative_reading
lexical_decisions:
- source_word: לְהוֹדִיעֲךָ
  choice: तुम्हें…बता दूँ
  rationale: ידע के हिफ़ील रूप की कारणवाचक शक्ति—‘जान करा देना/बता देना’—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। प्रथम पुरुष कर्ता निकटवर्ती साहित्यिक संदर्भ से समझा जाता है।
- source_word: קֹשְׁט
  choice: विश्वसनीयता
  rationale: यह शब्द सत्यता, शुद्धता या भरोसेमंद होने का भाव दे सकता है। ‘विश्वसनीयता’ निर्देश के संदर्भ में वचनों की भरोसेमंद शुद्धता व्यक्त करती है और पद में बार-बार आए אֱמֶת से शब्दगत भेद बनाए रखती है।
- source_word: אִמְרֵי אֱמֶת
  choice: सत्य के वचन
  rationale: इब्रानी संबंधवाचक रचना का निकट और गरिमापूर्ण हिन्दी रूप है; यह केवल ‘सच्ची बातें’ कहने की तुलना में मूल संरचना को अधिक स्पष्ट रखता है।
- source_word: לְהָשִׁיב
  choice: उत्तर दे सको
  rationale: שׁוב का हिफ़ील रूप मूलतः ‘लौटाना’ दर्शाता है, पर वचनों के साथ यहाँ प्रत्युत्तर देने का भाव स्वाभाविक है। ‘उत्तर दे सको’ आधुनिक हिन्दी में आशय स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֲמָרִים אֱמֶת
  choice: सत्य के वचनों में
  rationale: ‘सत्य के वचन’ मूल पदबंध को निकटता से रखता है; ‘में’ उत्तर के साधन या स्वरूप को सहज हिन्दी में व्यक्त करता है।
- source_word: לְשֹׁלְחֶיךָ
  choice: जिन्होंने तुम्हें भेजा है
  rationale: बहुवचन कृदन्त और द्वितीय पुरुष एकवचन प्रत्यय का स्वाभाविक हिन्दी सापेक्ष उपवाक्य है; भेजनेवालों की बहुवचनता सुरक्षित रहती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘तुम’ मूल के द्वितीय पुरुष एकवचन को सुरक्षित रखता है। ‘विश्वसनीयता’ और ‘सत्य’ का भेद इब्रानी קֹשְׁט तथा אֱמֶת के शब्दगत अंतर को दर्शाता है।
