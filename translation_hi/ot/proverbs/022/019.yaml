id: PRO.22.19
reference: Proverbs 22:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לִ/הְי֣וֹת בַּ֭/יהוָה מִבְטַחֶ֑/ךָ הוֹדַעְתִּ֖י/ךָ הַ/יּ֣וֹם אַף אָֽתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/019.yaml
  text: So that your trust may be in Yahweh[a], I have made known to you today, even to you.
translation:
  language: hi
  text: ताकि तेरा भरोसा याहवे पर हो, मैंने आज तुझे—हाँ, तुझे ही—ये बातें बताई हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “बताई हैं” का कर्म स्पष्ट रूप से नहीं दिया गया है; आसपास के प्रसंग से बातों या शिक्षाओं का संकेत मिलता है, इसलिए हिन्दी में “ये बातें” जोड़ा गया है। अंतिम पदबंध का शाब्दिक अर्थ “हाँ, तुम भी/यहाँ तक कि तुम” है और वह संबोधित व्यक्ति पर बल देता है।
    reason: मूल में निहित कर्म को स्पष्ट करना; संबोधित व्यक्ति पर बल
lexical_decisions:
- source_word: לִהְיוֹת
  choice: ताकि ... हो
  rationale: ל prefixed infinitive construct यहां उद्देश्य व्यक्त करता है; हिन्दी में “ताकि ... हो” इस प्रयोजन को स्वाभाविक ढंग से प्रकट करता है।
- source_word: בַּיהוָה
  choice: याहवे पर
  rationale: ב भरोसे के आधार या लक्ष्य को दर्शाता है। परमेश्वर के व्यक्तिगत नाम יהוה को “याहवे” के रूप में लिप्यंतरित किया गया है।
- source_word: מִבְטַחֶךָ
  choice: तेरा भरोसा
  rationale: מִבְטָח का अर्थ भरोसा या विश्वास है; एकवचन पुरुषवाचक प्रत्यय को “तेरा” से सुरक्षित रखा गया है।
- source_word: הוֹדַעְתִּיךָ
  choice: मैंने ... तुझे ... बताई हैं
  rationale: ידע के हिफ़ील रूप का अर्थ किसी को जानने देना या बताना है। हिन्दी में संदर्भ से निहित विषय-वस्तु “ये बातें” जोड़ने पर वाक्य स्पष्ट और स्वाभाविक रहता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह समयसूचक शब्द का सीधा और आधुनिक हिन्दी रूप है।
- source_word: אַף אָתָּה
  choice: तुझे भी
  rationale: אַף और स्वतंत्र सर्वनाम संबोधित व्यक्ति पर बल देते हैं। “तुझे भी” सम्भावित अर्थ ‘तुम भी/यहां तक कि तुम’ को संक्षेप और स्वाभाविक रूप में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; “याहवे” उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: אַף אָתָּה में संबोधित व्यक्ति पर बल
  choice: तुझे भी
  alternative: हाँ, तुझे ही; यहां तक कि तुझे
  rationale: इब्रानी पदबंध ‘तुम भी’ और ‘यहां तक कि तुम’ के बीच अर्थ-छाया रख सकता है। मुख्य पाठ में “तुझे भी” चुना गया है ताकि ऐसा विशिष्ट ‘केवल तुम’ न जोड़ा जाए जो मूल में अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। एक ही संबोधित व्यक्ति के लिए निकटवर्ती नीतिवचन-संबंधी शिक्षण शैली के अनुरूप “तेरा/तुझे” रखा गया है।
