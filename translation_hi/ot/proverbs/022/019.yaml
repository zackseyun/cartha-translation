- from: ताकि तेरा भरोसा याहवे पर हो, मैंने आज तुझे भी ये बातें बताई हैं।[a]
  to: ताकि तेरा भरोसा याहवे पर हो, मैंने आज तुझे—हाँ, तुझे ही—ये बातें बताई हैं।[a]
  rationale: संशोधन केवल अंतिम बलवाचक पदबंध को अधिक सटीक बनाने के लिए है। “तुझे—हाँ, तुझे ही” इब्रानी के दोहरे संबोधन और उसके बल को सुरक्षित रखता है, जबकि “तुझे भी” से उत्पन्न होने वाली ‘अन्य लोगों के साथ भी’ वाली अर्थ-छाया से बचता है। निहित कर्म “ये बातें” प्रसंगानुसार रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
