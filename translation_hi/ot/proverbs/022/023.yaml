  edition: WLC
  text: כִּֽי יְ֭הוָה יָרִ֣יב רִיבָ֑/ם וְ/קָבַ֖ע אֶת קֹבְעֵי/הֶ֣ם נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/023.yaml
  text: For Yahweh will plead their case and rob of life those who rob them[a].
translation:
  language: hi
  text: 'क्योंकि याहवे उनका मुक़दमा लड़ेगा,

    और जो उन्हें लूटते हैं, उनका जीवन लूट लेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: יָרִיב רִיבָם
  choice: उनका मुक़दमा लड़ेगा
  rationale: क्रिया और सजातीय संज्ञा न्यायिक विवाद का बोध कराती हैं। यह हिन्दी अभिव्यक्ति कानूनी पक्षसमर्थन का अर्थ स्वाभाविक रूप से देती है।
- source_word: וְקָבַע
  choice: जीवन लूट लेगा
  rationale: קבע का अर्थ लूटना या छीनना है। נָפֶשׁ के साथ यह जीवन छीन लेने का संकेत देता है; 'लूट' उसी मूल की अगली कृदन्त क्रिया के साथ इब्रानी शब्द-पुनरावृत्ति को बचाती है।
- source_word: קֹבְעֵיהֶם
  choice: जो उन्हें लूटते हैं
  rationale: उसी मूल קבע की कृदन्त रचना है; समान हिन्दी क्रिया रखने से प्रतिफलात्मक काव्य-न्याय स्पष्ट होता है।
- source_word: נָפֶשׁ
  choice: जीवन
  rationale: यहाँ शब्द अमूर्त 'आत्मा' के बजाय व्यक्ति के जीवन को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी पाठकों में पहचाने जाने वाले व्यक्तिगत नाम 'यहोवा' को रखा गया है; इसे 'प्रभु' जैसी उपाधि से नहीं बदला गया।
- issue: ईश्वरीय प्रतिफल की प्रकृति
  choice: उनका जीवन लूट लेगा
  alternative: उनके प्राण छीन लेगा
  rationale: मूल में लूटने वाले और उनका जीवन लेने के लिए एक ही इब्रानी मूल प्रयुक्त है। चुना हुआ रूप उस कठोर प्रतिफल और शब्द-क्रीड़ा दोनों को बिना नरम किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'मुक़दमा लड़ना' न्यायिक रूपक को स्पष्ट करता है, जबकि 'लूट...लूट' मूल की जानबूझकर की गई पुनरावृत्ति और काव्यात्मक प्रतिफल को बनाए रखता है।
