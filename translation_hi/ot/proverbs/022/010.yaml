source:
  edition: WLC
  text: גָּ֣רֵֽשׁ לֵ֭ץ וְ/יֵצֵ֣א מָד֑וֹן וְ֝/יִשְׁבֹּ֗ת דִּ֣ין וְ/קָלֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/010.yaml
  text: Drive out a scoffer[a], and strife will go out[b]; judgment and disgrace will cease.
translation:
  language: hi
  text: हँसी उड़ानेवाले[a] को निकाल दे, तब कलह दूर हो जाएगा; विवाद[b] और अपमान समाप्त हो जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहास करनेवाले।” इब्रानी शब्द לֵץ नीतिवचन में ऐसे व्यक्ति के लिए बार-बार आता है जो घमंड से बुद्धि और सुधार की हँसी उड़ाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द דִּין का अर्थ यहाँ “विवाद” है; इसका अर्थ “न्याय” या “मुकदमा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: निकाल दे
  rationale: यह पुरुषवाचक एकवचन आज्ञार्थक क्रिया किसी को बलपूर्वक समूह या स्थान से बाहर करने का भाव देती है। ‘निकाल दे’ आधुनिक हिंदी में स्वाभाविक है और केवल ‘भेज देने’ से अधिक प्रबल है।
- source_word: לֵץ
  choice: हँसी उड़ानेवाला
  rationale: नीतिवचन में यह उस व्यक्ति के लिए पारिभाषिक ज्ञान-साहित्यिक शब्द है जो घमंड से बुद्धि और सुधार का उपहास करता है। यह वाक्यांश साधारण आधुनिक पाठक के लिए ‘निंदक’ की अपेक्षा अधिक स्पष्ट है।
- source_word: מָדוֹן
  choice: कलह
  rationale: यह शब्द झगड़े, फूट और संघर्ष को दर्शाता है। ‘कलह’ संक्षिप्त और गरिमापूर्ण है तथा यहाँ सामाजिक संघर्ष के परिणाम को स्पष्ट करता है।
- source_word: וְיֵצֵא
  choice: दूर हो जाएगा
  rationale: शाब्दिक अर्थ ‘निकल जाएगा’ है, पर कलह के साथ ‘दूर हो जाएगा’ स्वाभाविक हिंदी है। आज्ञा के बाद आया अपूर्ण रूप अपेक्षित परिणाम व्यक्त करता है।
- source_word: וְיִשְׁבֹּת
  choice: समाप्त हो जाएँगे
  rationale: שׁבת का अर्थ रुकना या समाप्त होना है। संयुक्त कर्ताओं ‘विवाद और अपमान’ के साथ बहुवचन रूप हिंदी व्याकरण और समानांतर संरचना के अनुकूल है।
- source_word: דִּין
  choice: विवाद
  rationale: דִּין का अर्थ न्याय, मुकदमा या विवाद हो सकता है। यहाँ מָדוֹן के समानांतर संघर्ष-संबंधी अर्थ अधिक संभावित है; फिर भी पादटिप्पणी वैकल्पिक न्यायिक अर्थ सुरक्षित रखती है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह सामाजिक लज्जा, अनादर या बदनामी को दर्शाता है। ‘अपमान’ आधुनिक हिंदी में स्पष्ट है और कलह से उत्पन्न सामाजिक अनादर का भाव देता है।
theological_decisions:
- issue: דִּין का अर्थ
  choice: विवाद
  alternative: न्याय अथवा मुकदमा
  rationale: निकटवर्ती מָדוֹן (‘कलह’) के साथ समानांतरता विवाद के अर्थ का समर्थन करती है, पर शब्द का न्यायिक अर्थ वास्तविक है और पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ आज्ञा और उसके अपेक्षित परिणाम का संबंध स्पष्ट करता है। पद की संक्षिप्त समानांतरता बनाए रखते हुए अस्पष्ट דין को मुख्य पाठ और पादटिप्पणी दोनों में सावधानी से प्रस्तुत किया गया है।
