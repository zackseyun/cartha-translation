lexical_decisions:
- source_word: עָצֵל
  choice: आलसी
  rationale: यह संज्ञा नीतिवचन में आदतन काम से जी चुराने वाले व्यक्ति का चरित्र-प्रकार बताती है; आधुनिक हिन्दी में ‘आलसी’ सहज और स्पष्ट है।
- source_word: אֲרִי
  choice: सिंह
  rationale: मूल शब्द का सीधा अर्थ सिंह है; निकट संदर्भ में इसे रूपक मानने का कोई संकेत नहीं है।
- source_word: בַחוּץ
  choice: बाहर
  rationale: यह घर या सुरक्षित भीतरी स्थान से बाहर के क्षेत्र को दर्शाता है और अगले सार्वजनिक-स्थान वाले पदांश से स्वाभाविक रूप से जुड़ता है।
- source_word: בְּתוֹךְ רְחֹבוֹת
  choice: चौकों के बीच
  rationale: רְחֹבוֹת चौड़े सार्वजनिक स्थानों, चौकों अथवा सड़कों को सूचित कर सकता है; ‘चौकों के बीच’ בְּתוֹךְ की ‘बीच में’ वाली शक्ति को बनाए रखता है और अस्वाभाविक हिन्दी से बचता है।
- source_word: אֵרָצֵחַ
  choice: मुझे मार डाला जाएगा
  rationale: רצח का निफ़अल अपूर्ण रूप यहाँ हिंसक ढंग से मारे जाने का निष्क्रिय भाव देता है; यह हिन्दी में स्वाभाविक है और केवल सामान्य मृत्यु से अधिक प्रबल मूल क्रिया को व्यक्त करता है।
- source_word: אָמַר עָצֵל
  choice: आलसी कहता है
  rationale: यद्यपि इब्रानी में निश्चित उपपद नहीं है, नीतिवचन की शैली में यह किसी वर्ग के प्रतिनिधि चरित्र को दर्शाता है; हिन्दी में ‘आलसी कहता है’ यही सामान्य कथन स्वाभाविक रूप से देता है।
