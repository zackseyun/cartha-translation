  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי נָ֭עִים כִּֽי תִשְׁמְרֵ֣/ם בְּ/בִטְנֶ֑/ךָ יִכֹּ֥נוּ יַ֝חְדָּ֗ו עַל שְׂפָתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/018.yaml
  text: For it is pleasant if you keep them within you[b][a], if they are established together on your lips.
translation:
  language: hi
  text: क्योंकि यदि तुम उन्हें अपने भीतर सँजोए रखोगे[a] और वे एक साथ तुम्हारे होंठों पर तैयार रहेंगे[b], तो यह सुखद होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘अपने पेट में’; इब्रानी में यह भीतरी व्यक्ति के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: या, ‘वे एक साथ तुम्हारे होंठों पर दृढ़ता से स्थापित होंगे।’ इस क्रिया में दृढ़ स्थापना अथवा बोलने के लिए तत्परता—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण या प्रेरणा बताता है; ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נָעִים
  choice: मनभावना
  rationale: यह सुखद और प्रिय लगने का भाव व्यक्त करता है; ‘मनभावना’ ज्ञान-साहित्य के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ दूसरा כִּי शर्तसूचक अर्थ ग्रहण करता है; ‘यदि’ उस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: תִשְׁמְרֵם
  choice: तुम उन्हें ... सँजोए रखोगे
  rationale: שׁמר में सुरक्षित रखने, बनाए रखने और संजोने का भाव है; प्रसंग में यह शिक्षाओं को भीतर धारण किए रहने को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּבִטְנֶךָ
  choice: अपने भीतर
  rationale: शाब्दिक अर्थ ‘अपने पेट में’ है, पर इब्रानी प्रयोग में यह भीतरी व्यक्ति को दर्शाता है; ‘अपने भीतर’ अर्थ को स्वाभाविक रखते हुए ‘हृदय’ जैसी अतिरिक्त व्याख्या से बचता है।
- source_word: יִכֹּנוּ
  choice: तैयार रहें
  rationale: כון के निफ़अल रूप में स्थापित, दृढ़ या तैयार रहने की अर्थ-सीमा है। होंठों के प्रसंग में ‘तैयार रहें’ बोलने के लिए सुलभ होने का स्वाभाविक भाव देता है; ‘दृढ़ता से स्थापित हों’ वैकल्पिक अर्थ है।
- source_word: יַחְדָּו
  choice: सब
  rationale: यह शिक्षाओं के सामूहिक रूप से उपस्थित होने को व्यक्त करता है; हिन्दी में ‘वे सब’ अधिक स्वाभाविक है और ‘एक साथ’ का निहित सामूहिक भाव रखता है।
- source_word: עַל שְׂפָתֶיךָ
  choice: तुम्हारे होंठों पर
  rationale: यह वाणी या बोलने के लिए तत्परता का इब्रानी मुहावरा है; हिन्दी में भी इसका शाब्दिक रूप समझने योग्य और स्वाभाविक है।
