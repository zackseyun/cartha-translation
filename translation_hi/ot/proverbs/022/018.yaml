translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ज्ञान-साहित्यिक शैली। वाक्य की दोनों शर्तों को ‘यदि ... और ...’ संरचना में रखा गया है। ‘अपने भीतर’ इब्रानी देह-संबंधी मुहावरे का अर्थ देता है, जबकि पादटिप्पणी उसका शाब्दिक रूप सुरक्षित रखती है।
