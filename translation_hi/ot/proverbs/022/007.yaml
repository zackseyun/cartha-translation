  text: עָ֭שִׁיר בְּ/רָשִׁ֣ים יִמְשׁ֑וֹל וְ/עֶ֥בֶד לֹ֝וֶ֗ה לְ/אִ֣ישׁ מַלְוֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/007.yaml
  text: The rich rules over the poor[a], and the borrower is a servant to the lender.
translation:
  language: hi
  text: 'धनी निर्धनों पर शासन करता है,

    और उधार लेनेवाला उधार देनेवाले का दास होता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשִׁיר
  choice: धनी
  rationale: विशेषण यहाँ संज्ञा के रूप में किसी धनी व्यक्ति अथवा धनी वर्ग को सामान्यतः दर्शाता है; ‘धनी’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: בְּרָשִׁים
  choice: निर्धनों पर
  rationale: מָשַׁל के साथ ב शासन के अधीन व्यक्ति या क्षेत्र को चिह्नित करता है; ‘पर’ इस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יִמְשׁוֹל
  choice: शासन करता है
  rationale: नीतिवचन के संदर्भ में अपूर्ण रूप सामान्य सत्य व्यक्त करता है, इसलिए वर्तमानकाल उपयुक्त है। ‘शासन करता है’ मूल क्रिया की सत्ता और प्रभुत्व की धारणा बनाए रखता है।
- source_word: וְעֶבֶד
  choice: दास होता है
  rationale: עֶבֶד का अर्थ ‘दास/सेवक’ हो सकता है। ऋण से उत्पन्न अधीनता इस कथन का केंद्र है, इसलिए ‘दास’ मूल की तीव्रता को ‘सेवक’ से बेहतर बनाए रखता है; हिंदी वाक्य के लिए ‘होता है’ जोड़ा गया है।
- source_word: לֹוֶה
  choice: उधार लेनेवाला
  rationale: कर्तृवाचक कृदंत संज्ञा की तरह प्रयुक्त है। ‘उधार लेनेवाला’ क्रिया से सीधा संबंध रखता है और ‘ऋणी’ की अपेक्षा अधिक पारदर्शी है।
- source_word: לְאִישׁ מַלְוֶה
  choice: उधार देनेवाले का
  rationale: शाब्दिक अर्थ ‘उधार देनेवाले व्यक्ति का/के लिए’ है। दासता या अधीनता के संबंध को हिंदी में संबंधकारक ‘का’ स्वाभाविक रूप से व्यक्त करता है; ‘उधार देनेवाला’ मूल के क्रियात्मक समानांतर को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘उधार लेनेवाला/उधार देनेवाला’ की समानांतर रचना मूल के लोוה/מלוה शब्द-संबंध को स्पष्ट करती है। मूल पाठ में मौजूद नहीं होने के कारण कोई पादटिप्पणी नहीं जोड़ी गई; उपलब्ध अंग्रेज़ी पादटिप्पणी का चिह्न मुख्य वाक्य से असंगत प्रतीत होता है और उसका अधिक शाब्दिक विकल्प हिंदी मुख्य पाठ में ही व्यक्त है।
