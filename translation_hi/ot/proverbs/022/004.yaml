  text: עֵ֣קֶב עֲ֭נָוָה יִרְאַ֣ת יְהוָ֑ה עֹ֖שֶׁר וְ/כָב֣וֹד וְ/חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/004.yaml
  text: The reward of humility and the fear of Yahweh is wealth and honor and life[a].
translation:
  language: hi
  text: नम्रता और यहोवा के भय का प्रतिफल धन, सम्मान और जीवन है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य, किंतु कम संभावित अर्थ: “नम्रता का प्रतिफल यहोवा का भय, धन, सम्मान और जीवन है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵקֶב
  choice: प्रतिफल
  rationale: यह शब्द परिणाम, फल या प्रतिदान का भाव दे सकता है। यहाँ गुणों के बाद मिलने वाली भलाई की सूची है, इसलिए ‘प्रतिफल’ कारण-परिणाम और पुरस्कार—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲנָוָה
  choice: नम्रता
  rationale: यह संज्ञा दीनता या नम्रता को सूचित करती है। आधुनिक मानक हिन्दी में ‘नम्रता’ स्पष्ट और सहज है तथा अनावश्यक निष्क्रियता का भाव नहीं जोड़ती।
- source_word: יִרְאַת יְהוָה
  choice: यहोवा का भय
  rationale: यह ज्ञान-साहित्य की स्थापित अभिव्यक्ति है, जिसमें परमेश्वर के प्रति श्रद्धापूर्ण भय निहित है। ‘भय’ मूल की धर्मवैचारिक गंभीरता को ‘श्रद्धा’ जैसे व्याख्यात्मक विकल्प से अधिक सीधे बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का निज नाम है; हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण ‘यहोवा’ शीर्षक से बदलने के बजाय उस नाम को स्पष्ट रखता है।
- source_word: עֹשֶׁר
  choice: धन
  rationale: यह भौतिक संपन्नता को सूचित करता है। ‘धन’ संक्षिप्त, सहज और नीतिवचन की शैली के अनुकूल है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: इस मानवीय और सामाजिक संदर्भ में शब्द का अर्थ प्रतिष्ठा या आदर है, न कि ईश्वरीय महिमा; इसलिए ‘सम्मान’ उपयुक्त है।
- source_word: חַיִּים
  choice: जीवन
  rationale: बहुवचन रूप होने पर भी यह प्रायः अमूर्त अर्थ में ‘जीवन’ को व्यक्त करता है। मूल में ‘लंबा’ नहीं है, इसलिए ‘दीर्घायु’ नहीं जोड़ा गया।
theological_decisions:
- issue: ‘नम्रता’ और ‘यहोवा के भय’ के बीच वाक्यगत संबंध
  choice: दोनों को साथ जुड़े गुण माना गया है, जिनका प्रतिफल धन, सम्मान और जीवन है।
  alternative: '‘यहोवा का भय’ को नम्रता का पहला प्रतिफल या उसकी समानार्थी व्याख्या माना जा सकता है: ‘नम्रता का प्रतिफल यहोवा का भय, धन, सम्मान और जीवन है।’'
  rationale: इब्रानी वाक्य संक्षिप्त है और दोनों संबंध संभव हैं। नीतिवचन की शैली और अंतिम तीन आशीषों की सूची के अनुसार दोनों गुणों को संयुक्त आधार मानना अधिक स्वाभाविक है; फिर भी वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज नीतिवचन-शैली अपनाई गई है। ‘यहोवा का भय’ को बाइबलीय पारिभाषिक अभिव्यक्ति के रूप में रखा गया है; मुख्य पाठ की संक्षिप्तता और मूल की वास्तविक वाक्यगत अस्पष्टता दोनों सुरक्षित हैं।
