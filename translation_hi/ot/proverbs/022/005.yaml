id: PRO.22.5
reference: Proverbs 22:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צִנִּ֣ים פַּ֭חִים בְּ/דֶ֣רֶךְ עִקֵּ֑שׁ שׁוֹמֵ֥ר נַ֝פְשׁ֗/וֹ יִרְחַ֥ק מֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/005.yaml
  text: Thorns and snares are in the way of the crooked[c][b][a]; he who guards his life keeps far from them.
translation:
  language: hi
  text: 'काँटे और फंदे[a] कुटिल[b] मनुष्य के मार्ग में होते हैं;

    जो अपने जीवन[c] की रक्षा करता है, वह उनसे दूर रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाल।”
    reason: lexical_alternative
  - marker: b
    text: या “टेढ़े” अथवा “कपटी।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “प्राण”; यहाँ आशय अपने जीवन या स्वयं को खतरे से बचाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִנִּים
  choice: काँटे
  rationale: यह शब्द तीखी, काँटेदार बाधाओं को सूचित करता है। ‘फंदे’ के साथ मिलकर यह जीवन-मार्ग में उपस्थित खतरों का सजीव चित्र प्रस्तुत करता है।
- source_word: פַּחִים
  choice: फंदे
  rationale: यह जाल या फंदों के लिए प्रयुक्त सामान्य शब्द है। ‘फंदे’ छिपे हुए खतरे और ज्ञान-साहित्य के रूपक—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּדֶרֶךְ
  choice: के मार्ग में
  rationale: דֶּרֶךְ सड़क, मार्ग या जीवन-चाल को दर्शा सकता है। यहाँ ‘मार्ग’ वास्तविक रास्ते और आचरण के रूपक, दोनों को खुला रखता है।
- source_word: עִקֵּשׁ
  choice: कुटिल मनुष्य
  rationale: यह विशेषण नैतिक रूप से टेढ़े, विकृत या छलपूर्ण व्यक्ति का वर्णन करता है। ‘कुटिल’ आधुनिक हिन्दी में नैतिक अर्थ स्पष्ट करता है, जबकि पादटिप्पणी ‘टेढ़े’ के ठोस रूपक को सुरक्षित रखती है।
- source_word: שׁוֹמֵר נַפְשׁוֹ
  choice: जो अपने जीवन की रक्षा करता है
  rationale: कृदंत एक सामान्य नीतिवचनात्मक सिद्धांत व्यक्त करता है। נֶפֶשׁ यहाँ स्वयं को संकट से बचाने के अर्थ में ‘जीवन’ है; ‘रक्षा करता है’ सावधानीपूर्वक संभालने का भाव देता है।
- source_word: יִרְחַק
  choice: दूर रहता है
  rationale: अपूर्ण क्रिया सामान्यतः होने वाले परिणाम को व्यक्त करती है। ‘दूर रहता है’ नीतिवचन के सामान्य वर्तमान और सोच-समझकर दूरी बनाए रखने के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵהֶם
  choice: उनसे
  rationale: बहुवचन सर्वनाम का सबसे स्वाभाविक संबंध पहले आए बहुवचन खतरों—काँटों और फंदों—से है।
theological_decisions:
- issue: ज्ञान-साहित्य में प्रतिनिधिक पुल्लिंग एकवचन
  choice: जो अपने जीवन की रक्षा करता है, वह
  alternative: जो कोई अपने जीवन की रक्षा करता है
  rationale: हिब्रू में पुल्लिंग एकवचन कृदंत है, पर कथन प्रतिनिधिक नीतिवचन है और केवल पुरुषों तक सीमित नहीं है। हिन्दी का ‘जो…वह’ ढाँचा मूल के एकवचन को बनाए रखते हुए अनावश्यक लैंगिक विशिष्टता से बचता है।
- issue: נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: इस संदर्भ में बात खतरे से स्वयं को सुरक्षित रखने की है; इसलिए ‘जीवन’ प्रसंगानुकूल है। ‘आत्मा’ कहने से यहाँ ऐसा धार्मिक-तत्त्वमीमांसात्मक अर्थ आ सकता है जिसे मूल कथन आवश्यक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविराम नीतिवचन के दो परस्पर संबंधित भागों को स्पष्ट करता है। ‘काँटे’, ‘फंदे’ और ‘मार्ग’ मूल के सजीव रूपक को बनाए रखते हैं; ‘होते हैं’ हिन्दी में सामान्य नीतिवचनात्मक कथन को स्वाभाविक बनाता है।
