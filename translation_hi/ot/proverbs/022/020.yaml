  text: הֲ/לֹ֤א כָתַ֣בְתִּי לְ֭/ךָ שלשום בְּ/מ֖וֹעֵצֹ֣ת וָ/דָֽעַת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/020.yaml
  text: Have I not written for you thirty sayings of counsel and knowledge?[a][b]
translation:
  language: hi
  text: क्या मैंने तुम्हारे लिए परामर्श और ज्ञान के तीस कथन नहीं लिखे हैं?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैंने तुम्हारे लिए पहले ही परामर्श और ज्ञान के विषय में नहीं लिखा है?” जिस इब्रानी शब्द का परंपरागत अनुवाद “पहले” किया गया है, वह यहाँ कठिन है; बहुत-से विद्वान उसे “तीस” के अर्थ में लेते हैं, जो सम्भवतः तीस कथनों के संग्रह की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: कुछ परंपरागत अनुवादों में “तीस कथन” के स्थान पर “उत्तम बातें” अनुवाद किया गया है। यह कठिन इब्रानी अभिव्यक्ति की भिन्न व्याख्या पर आधारित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह ऐसा अलंकारिक प्रश्न आरम्भ करता है जिसका अपेक्षित उत्तर सकारात्मक है; हिंदी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: כָתַבְתִּי
  choice: मैंने ... लिखी हैं
  rationale: כתב का काल पूर्ण हुई क्रिया को दर्शाता है जिसका वर्तमान में महत्व है; हिंदी का पूर्ण पक्ष यहाँ सहज है।
- source_word: לְךָ
  choice: तुम्हारे लिए
  rationale: ל दिशा अथवा हित का भाव दे सकता है; नीतिवचन के शिक्षात्मक संदर्भ में यह शिष्य के लाभ के लिए लिखी गई सामग्री को सूचित करता है।
- source_word: שלשום
  choice: तीस बातें
  rationale: यह रूप पाठ और शब्दार्थ की दृष्टि से कठिन है। संदर्भ में इसे ‘तीस’ से सम्बद्ध मानना सम्भवतः कथनों के एक संग्रह की ओर संकेत करता है। वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּמוֹעֵצוֹת
  choice: परामर्श की
  rationale: עֵצָה का मूल अर्थ परामर्श, सलाह या योजना है। पूर्वसर्ग ב का संबंध यहाँ कठिन है; ‘परामर्श ... की बातें’ हिंदी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וָדָעַת
  choice: और ज्ञान की
  rationale: דעת का सामान्य अर्थ ‘ज्ञान’ है; यह परामर्श के साथ समन्वित ज्ञान-साहित्य की शब्दावली को बनाए रखता है।
