  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और शिक्षात्मक शैली रखी गई है। ‘परामर्श’ और ‘ज्ञान’ से मूल ज्ञान-साहित्य की शब्दावली बनी रहती है; कठिन שלשום की अस्पष्टता मुख्य पाठ और पादटिप्पणियों के माध्यम से सुरक्षित है।
