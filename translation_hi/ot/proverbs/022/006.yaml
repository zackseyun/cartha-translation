id: PRO.22.6
reference: Proverbs 22:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חֲנֹ֣ךְ לַ֭/נַּעַר עַל פִּ֣י דַרְכּ֑/וֹ גַּ֥ם כִּֽי יַ֝זְקִ֗ין לֹֽא יָס֥וּר מִמֶּֽ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/006.yaml
  text: Train up a boy according to his way[b][a]; even when he grows old he will not turn from it.
translation:
  language: hi
  text: लड़के को उसकी राह के अनुसार शिक्षा दे[a][b]; वह बूढ़ा हो जाने पर भी उससे नहीं हटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक व्याख्यात्मक अनुवाद: “लड़के को उस राह की शिक्षा दे जिस पर उसे चलना चाहिए।” इब्रानी में अधिक शाब्दिक रूप से “उसकी राह के अनुसार” है।'
    reason: alternative_reading
  - marker: b
    text: “लड़का” उस इब्रानी पुल्लिंग एकवचन शब्द का अनुवाद है जो सामान्य रूप से किसी लड़के या युवक के लिए प्रयुक्त होता है। यह नीतिवचन एक सामान्य सिद्धांत बताता है, अपवादरहित प्रतिज्ञा नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: חֲנֹךְ
  choice: शिक्षा दे
  rationale: इस आज्ञार्थक क्रिया में आरंभ से संस्कार देने, प्रशिक्षित करने या समर्पित करने का भाव हो सकता है। नीतिवचन के शिक्षापरक संदर्भ में ‘शिक्षा दे’ स्वाभाविक और व्यापक है, तथा केवल औपचारिक पढ़ाई तक सीमित नहीं है।
- source_word: לַנַּעַר
  choice: लड़के को
  rationale: נַעַר पुल्लिंग एकवचन में लड़के या युवक को दर्शाता है और यहाँ सामान्य सिद्धांत प्रस्तुत करता है। ‘लड़के’ से स्रोत का व्याकरणिक रूप सुरक्षित रहता है।
- source_word: עַל־פִּי
  choice: के अनुसार
  rationale: यह इब्रानी मुहावरा सामान्यतः ‘के अनुसार’ या ‘के अनुरूप’ अर्थ देता है; शब्दशः ‘मुँह पर’ हिंदी में अस्पष्ट होगा।
- source_word: דַרְכּוֹ
  choice: उसकी राह
  rationale: इब्रानी में स्पष्ट रूप से ‘उसकी राह’ है। ‘जिस राह पर उसे चलना चाहिए’ अर्थ-स्पष्टीकरण है, मूल पद का सीधा अनुवाद नहीं; इसलिए मुख्य पाठ में मूल की खुली अर्थ-छाया रखी गई है।
- source_word: גַּם כִּי
  choice: पर भी
  rationale: वृद्ध होने की आगामी अवस्था के साथ यह concessive-temporal भाव व्यक्त करता है; हिंदी में ‘हो जाने पर भी’ इसे स्वाभाविक रूप से संप्रेषित करता है।
- source_word: יַזְקִין
  choice: बूढ़ा हो जाने
  rationale: क्रिया वृद्धावस्था तक पहुँचने का भाव देती है। ‘बूढ़ा हो जाने’ से प्रक्रिया और भावी अवस्था दोनों स्पष्ट होते हैं।
- source_word: לֹא יָסוּר
  choice: नहीं हटेगा
  rationale: סור का अर्थ मुड़ना, हटना या अलग होना है। ‘नहीं हटेगा’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: מִמֶּנָּה
  choice: उससे
  rationale: स्त्रीलिंग प्रत्यय का पूर्वपद דֶּרֶךְ ‘राह’ है; हिंदी में स्त्रीलिंग ‘राह’ की ओर ‘उससे’ स्वाभाविक रूप से संकेत करता है।
theological_decisions:
- issue: ‘उसकी राह’ की बहुअर्थी व्याख्या
  choice: मुख्य पाठ में ‘उसकी राह के अनुसार’ रखा गया है।
  alternative: ‘जिस राह पर उसे चलना चाहिए, उसी पर’ अथवा उसकी प्रवृत्ति/अवस्था के अनुरूप।
  rationale: मूल इब्रानी केवल ‘उसकी राह के अनुसार’ कहता है। उचित नैतिक मार्ग और बालक की प्रकृति या अवस्था के अनुरूप प्रशिक्षण—दोनों व्याख्याएँ संभव हैं; मुख्य पाठ किसी एक को निर्णायक नहीं बनाता।
- issue: नीतिवचन को निरपवाद प्रतिज्ञा समझना
  choice: इसे सामान्य ज्ञान-सिद्धांत के रूप में प्रस्तुत किया गया है।
  alternative: हर व्यक्ति के विषय में बिना किसी अपवाद की प्रतिज्ञा।
  rationale: नीतिवचन सामान्यतः जीवन के सुव्यवस्थित अनुभव और बुद्धि-सिद्धांत बताते हैं; उनकी शैली को यांत्रिक, निरपवाद गारंटी बना देना साहित्यिक स्वरूप से अधिक दावा करेगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिक्षा दे’ सामान्य पाठक के लिए स्पष्ट है और आरंभिक प्रशिक्षण तथा संस्कार का भाव वहन करता है। ‘राह’ ज्ञान-साहित्य की रूपकात्मक भाषा को स्वाभाविक हिंदी में सुरक्षित रखती है।
