  text: If you have nothing with which to pay[a], why should he take your bed from under you?
translation:
  language: hi
  text: यदि तुम्हारे पास चुकाने के लिए कुछ न हो, तो वह तुम्हारे नीचे से तुम्हारा बिस्तर[a] क्यों ले जाए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिछौना’ अथवा ‘सोने की जगह।’ इब्रानी में सामान्य ‘गिरवी’ नहीं, बल्कि ले ली जाने वाली वस्तु—बिस्तर या सोने की जगह—का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शब्द शर्त प्रस्तुत करता है; चेतावनी के इस संदर्भ में ‘यदि’ स्वाभाविक और सटीक है।
- source_word: אֵין לְךָ
  choice: तुम्हारे पास ... कुछ न हो
  rationale: इब्रानी में निषेध और संबंधसूचक रूप मिलकर अभाव या स्वामित्व की कमी व्यक्त करते हैं; यह उसका स्वाभाविक हिन्दी रूप है।
- source_word: לְשַׁלֵּם
  choice: चुकाने के लिए
  rationale: यहाँ क्रिया ऋण का भुगतान करने को सूचित करती है; ‘चुकाने’ से प्रसंग स्पष्ट रहता है और कोई अनावश्यक वस्तु नहीं जोड़ी जाती।
- source_word: לָמָּה
  choice: क्यों
  rationale: यह आलंकारिक प्रश्न का आरंभ करता है; हिन्दी वाक्य में ‘क्यों ... ले जाए?’ उसकी चेतावनीपूर्ण शक्ति बनाए रखता है।
- source_word: יִקַּח
  choice: वह ... ले जाए
  rationale: तीसरे पुरुष एकवचन का कर्ता पिछले पद के संदर्भ में संभवतः ऋणदाता है; ‘वह’ उसे नाम देकर अत्यधिक स्पष्ट किए बिना व्याकरणिक रूप बचाता है।
- source_word: מִשְׁכָּבְךָ
  choice: तुम्हारा बिस्तर
  rationale: संज्ञा लेटने या सोने की जगह अथवा वस्तु को दर्शाती है। ‘बिस्तर’ आधुनिक हिन्दी में स्पष्ट है और इसे सामान्य ‘गिरवी’ कहकर ठोस चित्र को नहीं मिटाता।
- source_word: מִתַּחְתֶּיךָ
  choice: तुम्हारे नीचे से
  rationale: यह मूल का सजीव चित्र सुरक्षित रखता है—मनुष्य जिस बिस्तर पर है, वही उसके नीचे से ले लिया जाता है।
