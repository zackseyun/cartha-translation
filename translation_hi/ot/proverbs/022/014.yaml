id: PRO.22.14
reference: Proverbs 22:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁוּחָ֣ה עֲ֭מֻקָּה פִּ֣י זָר֑וֹת זְע֥וּם יְ֝הוָ֗ה יפול שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/014.yaml
  text: The mouth of forbidden women is a deep pit[a]; he who is under Yahweh’s wrath will fall there.
translation:
  language: hi
  text: पराई स्त्रियों का मुँह एक गहरा गड्ढा है[a]; जिस पर यहोवा का क्रोध है, वह उसी में गिरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अजनबी स्त्रियों,” “विदेशी स्त्रियों,” अथवा “व्यभिचारिणी स्त्रियों।” नीतिवचन में प्रयुक्त इब्रानी शब्द प्रायः उचित वैवाहिक या यौन सीमाओं से बाहर की स्त्रियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּחָה
  choice: गड्ढा
  rationale: यह संज्ञा गहरे गड्ढे या खाई को दर्शाती है; ‘गड्ढा’ खतरे और फँसने के रूपक को सहज हिन्दी में बनाए रखता है।
- source_word: עֲמֻקָּה
  choice: गहरा
  rationale: यह विशेषण सीधे ‘गड्ढा’ का वर्णन करता है और मूल ठोस बिंब को सुरक्षित रखता है।
- source_word: פִּי
  choice: मुँह
  rationale: मूल शब्द का शाब्दिक अर्थ ‘मुँह’ है। प्रसंग में लुभाने वाली वाणी का संकेत हो सकता है, पर ‘मुँह’ रखने से इब्रानी रूपक बना रहता है।
- source_word: זָרוֹת
  choice: पराई स्त्रियाँ
  rationale: नीतिवचन में यह पद प्रायः उचित वैवाहिक या यौन सीमाओं से बाहर की स्त्रियों के लिए आता है। ‘पराई स्त्रियाँ’ हिन्दी में इस नैतिक-संबंधपरक अर्थ को व्यक्त करता है, यद्यपि मूल में ‘अजनबी’ या ‘विदेशी’ का शाब्दिक आयाम भी संभव है।
- source_word: זְעוּם
  choice: जिस पर ... का क्रोध है
  rationale: निष्क्रिय कृदन्त उस व्यक्ति को दर्शाता है जो यहोवा के रोष का पात्र है; यह अभिव्यक्ति आधुनिक हिन्दी में उसकी अवस्था स्पष्ट करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी बाइबलीय परंपरा में परिचित रूप ‘यहोवा’ द्वारा इसे उपाधि से अलग रखा गया है।
- source_word: יפול
  choice: गिरेगा
  rationale: अपूर्ण क्रिया यहाँ नीतिवचन-सदृश सामान्य परिणाम व्यक्त करती है।
- source_word: שָׁם
  choice: उसी में
  rationale: शाब्दिक अर्थ ‘वहाँ’ है, पर संकेत पहले आए गहरे गड्ढे की ओर है; हिन्दी में ‘उसी में’ दिशा और संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: नीतिवचन के ज्ञान-साहित्य में זָרוֹת का अर्थ
  choice: पराई स्त्रियाँ
  alternative: अजनबी स्त्रियाँ; विदेशी स्त्रियाँ; व्यभिचारिणी स्त्रियाँ; निषिद्ध स्त्रियाँ
  rationale: यह पद केवल जातीय विदेशिता तक सीमित नहीं और केवल विवाहित व्यभिचारिणी तक संकुचित करना भी आवश्यक नहीं। ‘पराई स्त्रियाँ’ अनुचित यौन-संबंध की व्यापक सीमा को व्यक्त करता है और मूल की कुछ अर्थगत खुलावट बनाए रखता है।
- issue: זְעוּם יְהוָה का बल
  choice: जिस पर यहोवा का क्रोध है
  alternative: जिसे यहोवा ने शाप दिया है; जिससे यहोवा घृणा करता है
  rationale: मूल निष्क्रिय रूप रोष का पात्र होने की अवस्था बताता है। ‘क्रोध’ इस अर्थ को ‘शाप’ या ‘घृणा’ की अपेक्षा कम संकीर्णता से व्यक्त करता है।
- issue: कारण और परिणाम का संबंध
  choice: क्रोध का पात्र व्यक्ति उस गड्ढे में गिरेगा
  alternative: यहोवा उसे दंडस्वरूप उस गड्ढे में गिराता है
  rationale: पाठ परिणाम बताता है, पर गिरने की क्रिया में प्रत्यक्ष दैवी प्रेरण को स्पष्ट रूप से नहीं कहता; अनुवाद इस तनाव को नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गंभीर शैली के अनुरूप रखी गई है। ‘मुँह’ और ‘गहरा गड्ढा’ मूल रूपक को सीधे बनाए रखते हैं; अर्धविराम दोनों कथनों का घनिष्ठ संबंध दिखाता है।
