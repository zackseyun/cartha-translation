base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/029.yaml
  text: Do you see a man skillful in his work? He will stand before kings[b][a]; he will not stand before obscure men.
translation:
  language: hi
  text: क्या तुमने किसी मनुष्य को अपने काम में निपुण देखा है?[a] वह राजाओं के सामने खड़ा होगा; वह गुमनाम लोगों के सामने खड़ा नहीं होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने काम में फुर्तीला।” इब्रानी विशेषण तत्परता या शीघ्रता और, उसके विस्तार में, दक्षता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “अस्पष्ट लोगों के सामने”; अर्थात् ऐसे लोग जिनकी कोई प्रमुखता या विशिष्ट पहचान नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזִיתָ
  choice: क्या तुमने ... देखा है?
  rationale: क़ाल पूर्ण 2 एकवचन पुल्लिंग यहाँ अलंकारिक प्रश्न के रूप में एक सामान्य अवलोकन सामने रखता है। हिन्दी का पूर्ण वर्तमान स्वाभाविक है और देखे हुए अनुभव से निष्कर्ष निकालने का भाव रखता है।
- source_word: אִישׁ
  choice: किसी मनुष्य को
  rationale: इब्रानी में एकवचन पुल्लिंग प्रतिनिधिक रूप है। ‘मनुष्य’ आधुनिक हिन्दी में गरिमापूर्ण और व्यापक रूप से समझ में आने वाला है, जबकि मूल की एकवचन संरचना भी बनी रहती है।
- source_word: מָהִיר
  choice: निपुण
  rationale: शब्द का मूल भाव फुर्ती या तत्परता हो सकता है, पर काम के संदर्भ में यह दक्षता और योग्यता की ओर संकेत करता है। ‘निपुण’ इस प्रशंसात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בִּמְלַאכְתּוֹ
  choice: अपने काम में
  rationale: מְלָאכָה काम, व्यवसाय, कारीगरी या कार्य को सूचित कर सकता है। ‘काम’ इतना व्यापक है कि इसे केवल हस्तकला या किसी खास पेशे तक सीमित नहीं करता।
- source_word: לִפְנֵי מְלָכִים
  choice: राजाओं के सामने
  rationale: यह शासकों की उपस्थिति या सेवा में स्थान पाने की मानक अभिव्यक्ति है। शाब्दिक बिंब और सामाजिक उन्नति दोनों सुरक्षित रहते हैं।
- source_word: יִתְיַצָּב
  choice: खड़ा होगा
  rationale: हित्पएल रूप अपना स्थान लेने या उपस्थित होने का भाव देता है। ‘खड़ा होगा’ मूल बिंब बनाए रखता है और दोनों समानांतर पंक्तियों में स्वाभाविक है।
- source_word: בַּל
  choice: नहीं होगा
  rationale: काव्यात्मक निषेध को भविष्यकालीन क्रिया के साथ रखकर पहली पंक्ति के स्पष्ट विरोध को सुरक्षित किया गया है।
- source_word: חֲשֻׁכִּים
  choice: गुमनाम लोगों
  rationale: शाब्दिक रूप से ‘अँधेरे/अस्पष्ट जन’ यहाँ रूपकतः ऐसे लोगों को बताता है जिनकी कोई प्रमुखता या प्रतिष्ठा नहीं। ‘गुमनाम’ इस सामाजिक अस्पष्टता को व्यक्त करता है, बिना इसे नैतिक अंधकार या निर्धनता मान लेने के।
