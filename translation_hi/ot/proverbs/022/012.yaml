id: PRO.22.12
reference: Proverbs 22:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֵינֵ֣י יְ֭הוָה נָ֣צְרוּ דָ֑עַת וַ֝/יְסַלֵּ֗ף דִּבְרֵ֥י בֹגֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/012.yaml
  text: The eyes of Yahweh preserve knowledge[c][b][a], but he overturns the words of the treacherous.
translation:
  language: hi
  text: याहवे की आँखें ज्ञान को सुरक्षित रखती हैं[a], पर वह विश्वासघाती[c] की बातों को उलट देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज्ञान की रक्षा करती हैं’ अथवा ‘ज्ञान को संभालकर रखती हैं।’ इब्रानी क्रिया का अर्थ रक्षा करना, संभालना या सुरक्षित रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बिगाड़ देता है,’ ‘टेढ़ा कर देता है’ अथवा ‘विफल कर देता है।’ इब्रानी क्रिया किसी चीज़ को टेढ़ा करने, भ्रष्ट करने या उलट देने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘निष्ठाहीन व्यक्ति।’ इब्रानी शब्द ऐसे व्यक्ति के लिए है जो छल या विश्वासघात करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי יְהוָה
  choice: याहवे की आँखें
  rationale: यह रूप मूल मानवीकरणात्मक बिंब और परमेश्वर की चौकस दृष्टि को बनाए रखता है; יְהוָה को उसके विशिष्ट नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: נָצְרוּ
  choice: सुरक्षित रखती हैं
  rationale: נצר में रक्षा करने, संभालकर रखने और संरक्षित रखने का भाव है। ‘सुरक्षित रखती हैं’ सहज हिन्दी में इस अर्थ को व्यक्त करता और अगली पंक्ति के विनाशकारी उलटाव से विरोध बनाए रखता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: नीतिवचन के ज्ञान-साहित्यिक संदर्भ में דָעַת का सीधा और स्वाभाविक अर्थ ‘ज्ञान’ है।
- source_word: וַיְסַלֵּף
  choice: वह ... उलट देता है
  rationale: סלף किसी चीज़ को टेढ़ा करने, बिगाड़ने या उलट देने का भाव रखता है। यहाँ याहवे विश्वासघाती की बातों को निष्फल या धराशायी करता है; ‘उलट देता है’ मूल की सक्रिय तीव्रता और कुछ अर्थगत व्यापकता बनाए रखता है।
- source_word: דִּבְרֵי
  choice: बातों को
  rationale: דבר का अर्थ ‘शब्द,’ ‘बात’ या ‘मामला’ हो सकता है। इस प्रसंग में ‘बातों’ स्वाभाविक हिन्दी है और विश्वासघाती के कथनों अथवा दावों को समेट सकती है।
- source_word: בֹגֵד
  choice: विश्वासघाती
  rationale: בגד छलपूर्वक विश्वास तोड़ने या निष्ठाहीन आचरण करने वाले व्यक्ति को दर्शाता है। ‘विश्वासघाती’ इस नैतिक बल को बनाए रखता है और प्रसंग को अनावश्यक रूप से केवल वाचा या निजी संबंध तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय विशिष्ट नाम יְהוָה है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है, न कि उसे किसी उपाधि से बदलता है।
- issue: ‘याहवे की आँखें’ का मानवीकरणात्मक बिंब
  choice: बिंब को अक्षुण्ण रखा गया
  alternative: याहवे ज्ञान की रक्षा करता है
  rationale: मूल पाठ परमेश्वर की सजग निगरानी को ‘आँखों’ के बिंब से व्यक्त करता है। इसे सपाट व्याख्या में बदलने के बजाय काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘आँखें’ का मूल काव्यात्मक बिंब सुरक्षित है; ‘ज्ञान,’ ‘बातों’ और ‘विश्वासघाती’ जैसे सामान्य, गरिमापूर्ण शब्द साधारण पाठक के लिए स्पष्ट हैं।
