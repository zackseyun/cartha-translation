  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। समानांतरता बनाए रखने के लिए दो निषेधात्मक खंड रखे गए हैं। ‘फाटक’ के प्राचीन न्यायिक आशय को मुख्य पाठ में खोलने के बजाय पादटिप्पणी में समझाया गया है।
