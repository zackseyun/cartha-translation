    issue: The word 'केवल' adds an explicit restriction not present in the Hebrew.
    rationale: The causal clause כִּי דַל הוּא means 'because he is poor'; the exploitative motive is clear without adding 'only.'
  - severity: low
    issue: The cultural footnote anchor is placed at the end of the entire verse rather than beside 'फाटक.'
    rationale: Moving it directly after 'नगर-द्वार' clearly identifies the term explained by the note.
