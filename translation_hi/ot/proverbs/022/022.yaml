  text: אַֽל תִּגְזָל דָּ֭ל כִּ֣י דַל ה֑וּא וְ/אַל תְּדַכֵּ֖א עָנִ֣י בַ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/022/022.yaml
  text: Do not rob the poor because he is poor[b][a], and do not crush the afflicted at the gate.
translation:
  language: hi
  text: गरीब को मत लूट क्योंकि वह गरीब है, और नगर-द्वार[a] पर दीन को मत कुचल।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात नगर के फाटक पर, जहाँ प्रायः मुकदमों की सुनवाई और सार्वजनिक न्याय-निर्णय होते थे।
    reason: cultural_note
  - marker: b
    text: या, “गरीब पर अत्याचार मत कर ... और अदालत में जरूरतमंद को मत कुचल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְזָל
  choice: लूट
  rationale: यह क्रिया बलपूर्वक या अन्याय से किसी की वस्तु छीनने का भाव रखती है; ‘लूट’ शोषण की गंभीरता को स्पष्ट करती है।
- source_word: דָּל
  choice: गरीब
  rationale: यहाँ सामाजिक और आर्थिक रूप से कमजोर व्यक्ति अभिप्रेत है; ‘गरीब’ स्वाभाविक है और अगले वाक्यांश में मूल की पुनरावृत्ति भी बनाए रखता है।
- source_word: כִּי דַל הוּא
  choice: केवल इसलिए कि वह गरीब है
  rationale: כִּי को कारणसूचक माना गया है। ‘केवल’ मूल में अलग शब्द के रूप में नहीं है, पर हिंदी में उस निंदनीय अवसरवादी कारण को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: תְּדַכֵּא
  choice: कुचल
  rationale: यह मूल के सजीव और कठोर रूपक को बनाए रखता है तथा कानूनी-सामाजिक उत्पीड़न की गंभीरता व्यक्त करता है।
- source_word: עָנִי
  choice: दीन
  rationale: यह गरीबी के साथ कष्ट, असहायता और सामाजिक दुर्बलता का भाव देता है तथा पहले आए דָּל से शब्दगत भेद बनाए रखता है।
- source_word: בַשָּׁעַר
  choice: फाटक पर
  rationale: यह नगर के फाटक का शाब्दिक चित्र सुरक्षित रखता है; उसके न्यायिक-सार्वजनिक कार्य की जानकारी पादटिप्पणी में दी गई है।
