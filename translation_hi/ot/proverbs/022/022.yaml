  naturalness: The wording is clear and dignified modern Hindi. 'नगर-द्वार' is more idiomatic and historically specific than the unqualified 'फाटक' in this context, and placing the cultural-note anchor directly after it makes its scope clear.
  terminology: '''गरीब'' suitably renders דל, while ''दीन'' is an acceptable elevated but still comprehensible rendering of עני and preserves the source''s lexical variation. ''लूट'' and ''कुचल'' retain the force of the Hebrew verbs.'
  issues:
