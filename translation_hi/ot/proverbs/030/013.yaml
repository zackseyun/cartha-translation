  yaml_path: translation/ot/proverbs/030/013.yaml
  text: There is a generation—how lofty are its eyes[a], and its eyelids are raised high.
translation:
  language: hi
  text: एक पीढ़ी है—कैसी ऊँची हैं उसकी आँखें, और उसकी पलकें ऊपर उठी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹר
  choice: एक ऐसी पीढ़ी है
  rationale: דּוֹר का अर्थ ‘पीढ़ी’ या एक प्रकार के लोगों का समूह हो सकता है। इस खंड में यह एक वर्ग के लोगों का परिचय देता है; ‘एक ऐसी पीढ़ी है’ हिन्दी में इसके सामूहिक और परिचयात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מָה
  choice: कितनी
  rationale: यहाँ מָה प्रश्नवाचक नहीं, विस्मयबोधक है और ऊँचाई की मात्रा पर बल देता है; आँखों के स्त्रीलिंग बहुवचन के साथ ‘कितनी’ स्वाभाविक है।
- source_word: רָמוּ
  choice: ऊँची हैं
  rationale: रूम धातु का मूल चित्र ‘ऊँचा होना’ है। ‘ऊँची’ शारीरिक मुद्रा और उससे झलकने वाले घमंड—दोनों को बनाए रखता है, जबकि सीधे ‘घमंडी’ कहना रूपक की व्याख्या कर देता।
- source_word: עֵינָיו
  choice: उसकी आँखें
  rationale: तीसरे पुरुष एकवचन प्रत्यय सामूहिक संज्ञा דּוֹר से मेल खाता है। ‘उसकी’ इब्रानी के एकवचन सामूहिक रूप को सुरक्षित रखता है।
- source_word: וְעַפְעַפָּיו
  choice: और उसकी पलकें
  rationale: עַפְעַף का ठोस अर्थ ‘पलक’ है। इसे बनाए रखने से कविता का शारीरिक और दृश्य बिंब सुरक्षित रहता है।
- source_word: יִנָּשֵׂאוּ
  choice: ऊपर उठी हुई हैं
  rationale: נשׂא का निफ़अल रूप यहाँ उठी हुई अवस्था बताता है। यह अभिव्यक्ति पलकों की मुद्रा और उससे सूचित अभिमान को बिना अमूर्त किए व्यक्त करती है।
theological_decisions:
- issue: ऊँची आँखों और उठी पलकों में निहित अभिमान
  choice: शारीरिक बिंब को ज्यों का त्यों रखते हुए ‘आँखें ऊँची’ और ‘पलकें ऊपर उठी हुई’ कहना
  alternative: ‘घमंडी दृष्टि’ या ‘अभिमानी लोग’ कहकर अर्थ स्पष्ट करना
  rationale: मूल पाठ अभिमान को सीधे नाम नहीं देता, बल्कि शारीरिक मुद्रा के रूपक से प्रकट करता है। अनुवाद में उसी नैतिक संकेत और काव्यात्मक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण काव्यात्मक गद्य। ‘पीढ़ी’ सामूहिक संज्ञा के रूप में प्रयुक्त है और उसके साथ एकवचन ‘उसकी’ रखकर मूल व्याकरण का प्रभाव बचाया गया है।
