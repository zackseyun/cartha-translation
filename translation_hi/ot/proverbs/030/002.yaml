source:
  edition: WLC
  text: כִּ֤י בַ֣עַר אָנֹכִ֣י מֵ/אִ֑ישׁ וְ/לֹֽא בִינַ֖ת אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/002.yaml
  text: For I am more brutish than anyone[a], and I do not have human understanding.
translation:
  language: hi
  text: क्योंकि मैं मनुष्य से भी अधिक पशु-समान नासमझ हूँ[a], और मुझमें मनुष्य की समझ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैं मनुष्य होने के लिए भी बहुत नासमझ हूँ, और मुझमें मनुष्य की समझ नहीं है।”
    reason: मֵאִישׁ को सीधी तुलना के बजाय ‘मनुष्य होने के लिए अत्यधिक नासमझ’ अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַעַר
  choice: पशु-समान नासमझ
  rationale: यह शब्द केवल साधारण मूर्खता नहीं, बल्कि पशुवत विवेकहीनता और जड़ता का तीखा भाव रखता है। इस संयुक्त अभिव्यक्ति से मूल का आत्म-दीनकारी स्वर बना रहता है।
- source_word: אָנֹכִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम वक्ता पर बल देता है; हिन्दी में ‘मैं’ और विधेय के साथ ‘हूँ’ इसका स्वाभाविक रूप है।
- source_word: מֵאִישׁ
  choice: किसी भी मनुष्य से अधिक
  rationale: מִן को तुलनात्मक मानते हुए यह अनुवाद ‘मनुष्य से अधिक’ का अर्थ देता है; ‘किसी भी’ हिन्दी में इस सामान्य तुलना को सहज बनाता है। वैकल्पिक विश्लेषण पादटिप्पणी में सुरक्षित है।
- source_word: וְלֹא
  choice: और ... नहीं
  rationale: सरल संयोजक और निषेध को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִינַת
  choice: समझ
  rationale: यहाँ संज्ञा का अर्थ समझ, विवेक या परख है; ‘समझ’ सामान्य पाठक के लिए स्पष्ट है और ज्ञान-साहित्य के प्रसंग में उपयुक्त है।
- source_word: אָדָם
  choice: मनुष्य की
  rationale: यहाँ אָדָם सामान्य मानवता को सूचित करता है, न कि केवल पुरुष को; ‘मनुष्य’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: לִי
  choice: मुझमें ... नहीं है
  rationale: हिब्रू की दत्तिवाचक अधिकार-रचना को हिन्दी में स्वाभाविक रूप से ‘मुझमें ... नहीं है’ कहा गया है, जो समझ के अभाव को स्पष्ट करता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संबंधी अर्थ
  choice: मनुष्य की समझ
  alternative: आदमी की समझ
  rationale: संदर्भ में शब्द पूरी मानव जाति के सामान्य विवेक को सूचित करता है; ‘मनुष्य’ लिंग-विशेष का अनावश्यक संकेत दिए बिना इस अर्थ को व्यक्त करता है।
- issue: מֵאִישׁ की वाक्यगत व्याख्या
  choice: किसी भी मनुष्य से अधिक पशु-समान नासमझ
  alternative: मनुष्य होने के लिए भी बहुत नासमझ
  rationale: मुख्य पाठ מִן को तुलना के चिह्न के रूप में ग्रहण करता है। फिर भी ‘मनुष्य होने योग्य नहीं/मनुष्य होने के लिए बहुत मूर्ख’ वाला विश्लेषण भाषिक रूप से संभव है, इसलिए उसे पादटिप्पणी में रखा गया है और तनाव को दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर आत्म-दीनकारी, तीखा और ज्ञान-साहित्य के अनुरूप गरिमापूर्ण रखा गया है। ‘पशु-समान नासमझ’ मूल के कठोर भाव को सामान्य पाठक के लिए स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक वाक्यगत अर्थ सुरक्षित रखती है।
