  text: דּ֭וֹר טָה֣וֹר בְּ/עֵינָ֑י/ו וּ֝/מִ/צֹּאָת֗/וֹ לֹ֣א רֻחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/012.yaml
  text: There is a generation that is pure in its own eyes[b][a], yet is not washed from its filth.
translation:
  language: hi
  text: एक ऐसी पीढ़ी है जो अपनी ही दृष्टि में शुद्ध है,[a] फिर भी अपनी गंदगी से धोई नहीं गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी ही दृष्टि में साफ़ है।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द का अर्थ “गंदगी,” “गोबर” या “मल” हो सकता है; यह बिंब जानबूझकर तीखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: यह शब्द सामान्यतः ‘पीढ़ी’ को दर्शाता है और नीतिवचन 30:11–14 में एक विशेष प्रकार के लोगों के लिए बार-बार प्रयुक्त सामूहिक अभिव्यक्ति को बनाए रखता है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: यह शब्द शारीरिक, धार्मिक या नैतिक शुद्धता का बोध करा सकता है। ‘शुद्ध’ आत्म-मूल्यांकन और वास्तविक अशुद्धता के बीच के विरोध को बिना किसी एक क्षेत्र तक सीमित किए सुरक्षित रखता है।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: शाब्दिक अर्थ ‘अपनी आँखों में’ है, पर यह आत्म-दृष्टि या अपने विषय में किए गए निर्णय का मुहावरा है। ‘अपनी ही दृष्टि में’ आधुनिक हिन्दी में स्वाभाविक है और आत्मभ्रम पर बल देता है।
- source_word: וּמִצֹּאָתוֹ
  choice: अपनी गंदगी से
  rationale: צֹאָה गंदगी, मल या विष्ठा को दर्शा सकता है। ‘गंदगी’ मूल बिंब की तीव्रता और व्यापक नैतिक संकेत बनाए रखती है; अधिक स्पष्ट विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: לֹא רֻחָץ
  choice: धोई नहीं गई
  rationale: निष्क्रिय क्रिया धुलने की परिणामी अवस्था बताती है और धोने वाले कर्ता को निर्दिष्ट नहीं करती। यह हिन्दी रूप उसी अस्पष्टता को बनाए रखता है।
theological_decisions:
- issue: शुद्धता की प्रकृति
  choice: स्वयं को शुद्ध समझने और वास्तव में गंदगी से न धुले होने का विरोध बनाए रखा गया है, बिना इसे केवल धार्मिक या केवल नैतिक अशुद्धता ठहराए।
  alternative: इसे मुख्यतः धार्मिक शुद्धता या मुख्यतः नैतिक शुद्धता के रूप में स्पष्ट करना।
  rationale: संदर्भ नैतिक अर्थ की ओर संकेत करता है, पर इब्रानी शुद्धता और धुलाई के ऐसे शब्दों का प्रयोग करती है जिनमें शारीरिक, धार्मिक और नैतिक आयाम साथ रह सकते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एक ऐसी पीढ़ी है’ मूल की संक्षिप्त सूक्तिपरक संरचना और पद 11–14 के आवर्ती ढाँचे को दर्शाता है। स्त्रीलिंग ‘धोई नहीं गई’ का संबंध ‘पीढ़ी’ से है।
