  yaml_path: translation/ot/proverbs/030/015.yaml
  text: 'The leech has two daughters: “Give[a], give.” Three things are never satisfied; four never say[c][b], “Enough.”'
translation:
  language: hi
  text: 'जोंक की दो बेटियाँ हैं: “दे[a], दे।” तीन वस्तुएँ कभी तृप्त नहीं होतीं; चार कभी नहीं कहतीं, “बस”[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दे, दे” को बेटियों की और पाने की पुकार समझा जा सकता है; कुछ लोग इसका अधिक भावार्थपूर्ण अनुवाद “और, और” करते हैं।
    reason: lexical_alternative
  - marker: b
    text: वैकल्पिक रूप से, “चार नहीं कहतीं, ‘पर्याप्त।’” यहाँ अंतिम इब्रानी शब्द को उसके अधिक प्रचलित अर्थ “धन” के बजाय पर्याप्तता बताने वाला मुहावरा समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲלוּקָה
  choice: जोंक की
  rationale: עֲלוּקָה का अर्थ ‘जोंक’ है। आरंभिक ל को विषय-सूचक/संबंध-सूचक मानकर स्वाभाविक हिन्दी में ‘जोंक की दो बेटियाँ हैं’ किया गया है।
- source_word: שְׁתֵּי בָנוֹת
  choice: दो बेटियाँ हैं
  rationale: मूल इब्रानी वाक्य क्रियारहित है; स्वाभाविक हिन्दी के लिए ‘हैं’ जोड़ा गया और कहावत का सजीव रूपक बनाए रखने हेतु ‘बेटियाँ’ को अक्षरशः रखा गया।
- source_word: הַב הַב
  choice: दे, दे
  rationale: दोहराया हुआ आदेश आग्रहपूर्ण माँग व्यक्त करता है। ‘दे, दे’ मूल की संक्षिप्तता और ध्वनि को बनाए रखता है; ‘और, और’ अधिक व्याख्यात्मक होता।
- source_word: שָׁלֹשׁ הֵנָּה לֹא תִשְׂבַּעְנָה
  choice: तीन कभी तृप्त नहीं होतीं
  rationale: यह नीतिवचन की संख्यात्मक कथन-शैली है। स्त्रीलिंग बहुवचन रूपों के अनुरूप ‘होतीं’ रखा गया और असंतुष्टि की निरंतरता को स्वाभाविक हिन्दी में ‘कभी ... नहीं’ से व्यक्त किया गया।
- source_word: אַרְבַּע לֹא אָמְרוּ הוֹן
  choice: चार कभी नहीं कहतीं, “बस”
  rationale: הוֹן को यहाँ सामान्य अर्थ ‘धन’ के बजाय पर्याप्तता की उद्गारात्मक अभिव्यक्ति माना गया है। ‘बस’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा अतृप्ति का भाव स्पष्ट करता है।
