  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל אִמְרַ֣ת אֱל֣וֹהַּ צְרוּפָ֑ה מָגֵ֥ן ה֝֗וּא לַֽ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/005.yaml
  text: Every word of God is proven; he is a shield to those who take refuge in him.
translation:
  language: hi
  text: परमेश्वर का हर वचन परखा हुआ है; जो उसकी शरण लेते हैं, उनके लिए वह ढाल है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל אִמְרַת אֱלוֹהַּ
  choice: परमेश्वर का हर वचन
  rationale: אִמְרָה यहाँ परमेश्वर के कथन या वचन को दर्शाता है; ‘हर वचन’ स्वाभाविक हिन्दी में वितरक כָּל का अर्थ बनाए रखता है।
- source_word: צְרוּפָה
  choice: परखा हुआ
  rationale: यह धातु धातु को गलाकर जाँचने और शुद्ध सिद्ध करने का बिंब रखती है। ‘परखा हुआ’ उस प्रमाणित विश्वसनीयता को व्यक्त करता है और केवल नैतिक ‘शुद्ध’ तक अर्थ सीमित नहीं करता।
- source_word: מָגֵן
  choice: ढाल
  rationale: मूल रूपक का सीधा और सहज हिन्दी रूप।
- source_word: לַחֹסִים בּוֹ
  choice: जो उसकी शरण लेते हैं, उनके लिए
  rationale: חסה सुरक्षा के लिए किसी की शरण लेने या उस पर भरोसा रखने का भाव देता है; यह रूप क्रियाशील आश्रय के बिंब को बनाए रखता है।
theological_decisions:
- issue: צְרוּפָה में शुद्धता और परीक्षित विश्वसनीयता का संबंध
  choice: परखा हुआ
  alternative: शुद्ध है / खरा है
  rationale: मूल शब्द गलाकर जाँचने के बिंब से ‘परीक्षित और खरा सिद्ध’ होने का भाव देता है। प्रसंग में ‘परखा हुआ’ परमेश्वर के प्रत्येक वचन की विश्वसनीयता पर बल देता है, जबकि अन्य निहितार्थों को नकारता नहीं।
- issue: परमेश्वर को ढाल कहने वाला रूपक
  choice: 'रूपक को प्रत्यक्ष रखा गया: ‘वह ढाल है’'
  alternative: वह रक्षा करता है
  rationale: मूल पाठ परमेश्वर को सीधे ढाल कहता है; इसे सामान्य रक्षा-वाक्य में बदलने से काव्यात्मक और धर्मवैचारिक बल घट जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। समानांतर काव्य-विन्यास तथा मूल का ढाल/शरण रूपक सुरक्षित रखा गया है।
