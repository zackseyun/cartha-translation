  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; दो पंक्तियों में मूल का विरोधात्मक लोकोक्तिपरक संतुलन रखा गया है। ‘चट्टानी बिज्जू’ सामान्य पाठक के लिए सुलभ नाम है, जबकि पादटिप्पणी अधिक सटीक पहचान और पारंपरिक विकल्प बताती है।
