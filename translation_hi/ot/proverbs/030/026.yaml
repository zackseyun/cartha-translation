  yaml_path: translation/ot/proverbs/030/026.yaml
  text: Rock badgers are a people not mighty[a], yet they make their home in the crag.
translation:
  language: hi
  text: 'हाइरैक्स[a] एक निर्बल जाति हैं,

    फिर भी वे चट्टान में अपना घर बनाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः रॉक हाइरैक्स; परंपरागत रूप से “शापान” कहा गया है और कुछ पुराने अनुवादों में “खरगोश”।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפַנִּים
  choice: चट्टानी बिज्जू
  rationale: यह शब्द संभवतः हाईरैक्स नामक चट्टानों में रहने वाले छोटे स्तनधारी को दर्शाता है। सामान्य पाठक के लिए प्राणी की पहचान सहज बनाने और उसके चट्टानी निवास से संबंध बनाए रखने के लिए ‘चट्टानी बिज्जू’ चुना गया है; सटीक प्राणिवैज्ञानिक नाम पादटिप्पणी में दिया गया है।
- source_word: עַם
  choice: जाति
  rationale: मूल शब्द का सामान्य अर्थ ‘लोग’ या ‘जन’ है, पर यहाँ पशुओं के एक समुदाय के लिए वर्गसूचक रूप में प्रयुक्त है। हिन्दी में ‘जाति’ इस असामान्य किन्तु जानबूझकर किए गए मानवीकरण को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לֹא עָצוּם
  choice: बलवान नहीं
  rationale: यह पद उनकी शक्ति या सामर्थ्य के अभाव को बताता है। ‘बलवान नहीं’ संक्षिप्त, लोकोक्तिपरक और मूल के प्रत्यक्ष विरोध को सुरक्षित रखता है।
- source_word: וַיָּשִׂימוּ
  choice: बनाते हैं
  rationale: क्रिया का मूल अर्थ ‘रखना/स्थापित करना’ है, किन्तु ‘घर’ के साथ हिन्दी में ‘घर बनाना’ स्वाभाविक है। सामान्य सत्य व्यक्त करने के लिए वर्तमान काल रखा गया है।
- source_word: בַסֶּלַע
  choice: चट्टान में
  rationale: סֶלַע चट्टान, शैल या खड़ी चट्टानी जगह को दर्शाता है। एकवचन और आश्रय के भीतर होने की धारणा बनाए रखने के लिए ‘चट्टान में’ चुना गया है।
- source_word: בֵּיתָם
  choice: अपना घर
  rationale: शाब्दिक अर्थ ‘उनका घर’ है। हिन्दी में कर्ता के अपने निवास के लिए ‘अपना घर’ अधिक स्वाभाविक है और पशुओं के बसेरे का आशय स्पष्ट रखता है।
