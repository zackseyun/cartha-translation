  yaml_path: translation/ot/proverbs/030/003.yaml
  text: And I have not learned wisdom[a], nor do I know the knowledge of the Holy One.
translation:
  language: hi
  text: 'मैंने बुद्धि नहीं सीखी,

    और न ही मुझे पवित्र परमेश्वर का ज्ञान है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמַדְתִּי
  choice: मैंने ... नहीं सीखी
  rationale: पूर्ण क्रिया वक्ता द्वारा बुद्धि की शिक्षा प्राप्त न करने की स्वीकारोक्ति व्यक्त करती है। हिन्दी में भूतकाल का यह रूप वर्तमान तक बनी हुई कमी को स्वाभाविक ढंग से बताता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह व्यावहारिक, नैतिक और विवेकपूर्ण जीवन की बुद्धि के लिए प्रचलित और स्वाभाविक हिन्दी शब्द है।
- source_word: דַעַת
  choice: ज्ञान
  rationale: यह संज्ञा सामान्यतः ‘ज्ञान’ का अर्थ देती है और आगे आए ידע धातु के भाव को भी बनाए रखती है।
- source_word: קְדֹשִׁים
  choice: परमपवित्र
  rationale: रूप व्याकरणतः बहुवचन है, पर नीतिवचन के ज्ञान-साहित्य में यह परमेश्वर के लिए महिमासूचक अथवा गहन बहुवचन हो सकता है। ‘परमपवित्र’ हिन्दी में एकवचन ईश्वरीय संकेत को संक्षेप और गरिमा के साथ व्यक्त करता है; शाब्दिक बहुवचन को पादटिप्पणी में रखा गया है।
- source_word: אֵדָע
  choice: मुझे ... ज्ञान है
  rationale: प्रथम पुरुष अपूर्ण क्रिया यहाँ वर्तमान स्थिति बताती है। हिन्दी में संज्ञा דַעַת के साथ ‘मुझे ... ज्ञान है’ मूल की पुनरुक्ति को बिना अस्वाभाविक वाक्य बनाए व्यक्त करता है।
theological_decisions:
- issue: क्या קְדֹשִׁים एकवचन में परमेश्वर को दर्शाता है या बहुवचन में पवित्र जनों/प्राणियों को
  choice: 'परमेश्वर के लिए एकवचन संकेत: ‘परमपवित्र’'
  alternative: ‘पवित्र जनों’
  rationale: इब्रानी रूप सतह पर बहुवचन है, इसलिए बहुवचन अर्थ वास्तविक संभावना है। फिर भी नीतिवचन 9:10 की निकट समानांतर भाषा और ज्ञान-साहित्य का प्रयोग परमेश्वर की ओर एकवचन संकेत का समर्थन करता है। मुख्य पाठ में संभावित आशय रखा गया है और रूपगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘नहीं ... और न ही’ मूल की समानांतर नकारात्मक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
