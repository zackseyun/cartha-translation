  yaml_path: translation/ot/proverbs/030/025.yaml
  text: The ants are a people not strong[a], yet they prepare their food in the summer.
translation:
  language: hi
  text: चींटियाँ एक ऐसा जनसमूह हैं जो बलवान नहीं है, फिर भी वे गर्मियों में अपना भोजन तैयार करती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנְּמָלִים
  choice: चींटियाँ
  rationale: निश्चित बहुवचन संज्ञा पूरी प्रजाति की ओर संकेत करती है; हिन्दी में सामान्य बहुवचन ‘चींटियाँ’ स्वाभाविक है।
- source_word: עַם
  choice: जाति
  rationale: यहाँ मनुष्यों के समुदाय के लिए प्रयुक्त शब्द चींटियों पर रूपक रूप में लागू है। ‘जाति’ उस सामूहिक रूपक को बनाए रखता है और ‘जीव’ कहकर उसे सपाट नहीं करता।
- source_word: לֹא עָז
  choice: बलवान नहीं
  rationale: मूल पाठ विशेषण ‘बलवान/शक्तिशाली’ का सीधा निषेध करता है। यह चयन ‘निर्बल’ की अपेक्षा हिब्रू संरचना और सूक्ष्मता को बेहतर बनाए रखता है।
- source_word: וַיָּכִינוּ
  choice: तैयार कर लेती हैं
  rationale: כון के हिफ़ील रूप का यहाँ अर्थ तैयार करना या प्रस्तुत रखना है। ‘कर लेती हैं’ हिन्दी में उनकी विवेकपूर्ण पूर्वतैयारी को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘संचय करती हैं’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: בַקַּיִץ
  choice: गर्मियों में
  rationale: यह ऋतु को तैयारी के समय के रूप में बताता है; आधुनिक मानक हिन्दी में ‘गर्मियों में’ सहज और स्पष्ट है।
- source_word: לַחְמָם
  choice: अपना भोजन
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर इसका व्यापक अर्थ भोजन भी होता है। चींटियों के संदर्भ में ‘भोजन’ अभिप्रेत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
