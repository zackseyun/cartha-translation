  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जाति’ द्वारा चींटियों को एक संगठित जनसमूह कहने वाला मूल रूपक सुरक्षित है; वाक्य में उनकी सीमित शक्ति और दूरदर्शी तैयारी का विरोधाभास भी बना रहता है।
