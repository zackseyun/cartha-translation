revisions:
- from: चींटियाँ बलवान जाति नहीं हैं, फिर भी वे गर्मियों में अपना भोजन तैयार कर लेती हैं।
  to: चींटियाँ एक ऐसा जनसमूह हैं जो बलवान नहीं है, फिर भी वे गर्मियों में अपना भोजन तैयार करती हैं।
  rationale: 'The revision preserves every element of the Hebrew: ants as a class, the figurative designation as a people-like collective, their being not strong, preparation in summer, and their food. It improves Hindi idiom and avoids an unnecessary completive implication.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T03:53:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the ants, their lack of strength, summer, and preparation of food. However, “जाति” in contemporary Hindi primarily suggests a biological species or social caste and does not clearly preserve the figurative collective sense of Hebrew עַם (“a people”). The completive “कर लेती हैं” also adds a slight nuance not explicit in the verb.
  naturalness: The sentence is generally fluent, but “बलवान जाति नहीं हैं” is syntactically compressed and somewhat unnatural. Recasting it with “जनसमूह” produces clear, modern Hindi while retaining the proverb’s collective metaphor.
  terminology: “जनसमूह” is a suitable non-doctrinal rendering of the figurative עַם in this animal context. “भोजन” appropriately represents לַחְמָם in its broad sense of food/provisions.
  issues:
  - severity: medium
    issue: “जाति” does not clearly convey the figurative collective meaning of עַם.
    rationale: In modern standard Hindi, “जाति” most readily denotes species, caste, or ethnicity. “जनसमूह” better retains the saying’s portrayal of ants as a collective people without importing caste or species terminology.
  - severity: low
    issue: “तैयार कर लेती हैं” adds a completive nuance.
    rationale: The Hiphil of כון means ‘prepare/make ready’; simple “तैयार करती हैं” is closer and remains natural.
  revised_text: चींटियाँ एक ऐसा जनसमूह हैं जो बलवान नहीं है, फिर भी वे गर्मियों में अपना भोजन तैयार करती हैं।
  revised_footnotes: []
  revision_rationale: 'The revision preserves every element of the Hebrew: ants as a class, the figurative designation as a people-like collective, their being not strong, preparation in summer, and their food. It improves Hindi idiom and avoids an unnecessary completive implication.'
