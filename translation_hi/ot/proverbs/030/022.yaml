lexical_decisions:
- source_word: תַּחַת
  choice: पर
  rationale: 'यह पद 21–23 की सूची को आगे बढ़ाता है: ये वे परिस्थितियाँ हैं जिनके कारण पृथ्वी काँपती है। हिन्दी में ‘...पर’ प्रत्येक परिस्थिति को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।'
- source_word: עֶבֶד
  choice: दास
  rationale: इब्रानी शब्द बँधे हुए सेवक या दास को दर्शाता है। यहाँ सामाजिक स्थिति का उलट जाना मुख्य बिंदु है, इसलिए ‘सेवक’ की अपेक्षा ‘दास’ अधिक सटीक है।
- source_word: כִּי
  choice: '...जाने पर / ...खाने पर'
  rationale: दोनों खंडों में כִּי उस परिस्थिति का परिचय देता है जिसमें यह अस्थिर करने वाली स्थिति उत्पन्न होती है। हिन्दी की ‘...पर’ रचना इसे सहज रूप से व्यक्त करती है।
- source_word: יִמְלֹךְ
  choice: राजा बन जाने
  rationale: क्रिया का अर्थ ‘राज करना’ या ‘राजा बनना’ हो सकता है। ‘राजा बन जाने’ से इस नीतिवचन में निहित सामाजिक उलटफेर स्पष्ट और स्वाभाविक रूप से सामने आता है।
- source_word: נָבָל
  choice: मूर्ख
  rationale: ज्ञान-साहित्य में यह शब्द केवल कम बुद्धि वाले व्यक्ति के लिए नहीं, बल्कि नैतिक और सामाजिक विवेकहीन व्यक्ति के लिए प्रयुक्त होता है। ‘मूर्ख’ इसका संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: יִשְׂבַּע
  choice: पेट भर ... खाने
  rationale: क्रिया तृप्त या भर जाने का भाव देती है। ‘पेट भर ... खाना’ हिन्दी में ठोस चित्र बनाए रखता है और संतुष्टि अथवा अतिरेक में से किसी एक अर्थ को अनावश्यक रूप से तय नहीं करता।
- source_word: לָחֶם
  choice: रोटी
  rationale: इब्रानी में शाब्दिक अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन का द्योतक भी हो सकता है। ‘रोटी’ मूल बिंब को बनाए रखती है और हिन्दी में स्वाभाविक है।
