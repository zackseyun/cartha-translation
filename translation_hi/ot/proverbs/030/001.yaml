  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דִּבְרֵ֤י אָג֥וּר בִּן יָקֶ֗ה הַ/מַּ֫שָּׂ֥א נְאֻ֣ם הַ֭/גֶּבֶר לְ/אִֽיתִיאֵ֑ל לְ/אִ֖יתִיאֵ֣ל וְ/אֻכָֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/001.yaml
  text: 'The words of Agur son of Jakeh[a], the oracle: the declaration of the man to Ithiel[b], to Ithiel and Ucal.'
translation:
  language: hi
  text: 'याके के पुत्र आगूर के वचन—वह वाणी: उस पुरुष का कथन ईतीएल को, ईतीएल को और ऊकाल को।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “मस्सा के याके के पुत्र आगूर के वचन,” यदि הַמַּשָּׂא को ‘वाणी’ के बजाय स्थान अथवा जाति का नाम माना जाए।
    reason: alternative_reading
  - marker: b
    text: या संभवतः, “हे परमेश्वर, मैं थक गया हूँ; हे परमेश्वर, मैं थक गया हूँ और निढाल हूँ,” यदि अंतिम शब्दों को नामों के बजाय अलग स्वरांकन के साथ एक क्रियात्मक कथन माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: דִּבְרֵי
  choice: वचन
  rationale: यह דָּבָר का संबंधकारक बहुवचन है और किसी संग्रह अथवा कथन का परिचय देता है। ‘वचन’ शीर्षकीय शैली और अर्थ की व्यापकता दोनों को बनाए रखता है।
- source_word: אָגוּר
  choice: आगूर
  rationale: व्यक्तिवाचक नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בִּן יָקֶה
  choice: याके के पुत्र
  rationale: בִּן मानक वंशसूचक पद है; आधुनिक हिंदी में ‘के पुत्र’ स्वाभाविक और गरिमापूर्ण है। יָקֶה को व्यक्तिवाचक नाम मानकर ‘याके’ लिप्यंतरित किया गया है।
- source_word: הַמַּשָּׂא
  choice: एक ईशवाणी
  rationale: מַשָּׂא यहाँ गंभीर, अधिकारपूर्ण वाणी अथवा oracle का सूचक हो सकता है। ‘ईशवाणी’ इस शीर्षकीय अर्थ को संक्षेप में व्यक्त करती है; ‘एक’ हिंदी में पदबंध को स्वाभाविक बनाता है। ‘मस्सा’ नाम की वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: נְאֻם הַגֶּבֶר
  choice: उस पुरुष की घोषणा
  rationale: נְאֻם औपचारिक और गंभीर कथन का परिचायक है, इसलिए ‘घोषणा’ चुना गया। הַגֶּבֶר का सीधा अर्थ ‘उस पुरुष’ रखा गया है; शक्ति अथवा वीरता का अतिरिक्त भाव आरोपित नहीं किया गया।
- source_word: לְאִיתִיאֵל
  choice: ईतीएल के लिए
  rationale: לְ को संबोधन अथवा प्राप्तकर्ता-सूचक मानकर ‘के लिए’ किया गया है। कठिन वाक्य-विन्यास में यह कम व्याख्यात्मक हिंदी रूप है।
- source_word: לְאִיתִיאֵל
  choice: ईतीएल के लिए
  rationale: हिब्रू की पुनरुक्ति को हटाया या समतल नहीं किया गया, ताकि पाठ की वास्तविक संरचना सुरक्षित रहे।
- source_word: וְאֻכָל
  choice: और ऊकाल
  rationale: मसोरेटी स्वरांकन इसे व्यक्तिवाचक नाम के रूप में प्रस्तुत करता है। इसलिए मुख्य पाठ में ‘ऊकाल’ रखा गया है; क्रियात्मक वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: הַמַּשָּׂא की व्याख्या
  choice: इसे सामान्य संज्ञा के रूप में ‘एक ईशवाणी’ पढ़ा गया है।
  alternative: इसे स्थान या जातीय नाम ‘मस्सा’ मानना।
  rationale: निश्चित उपपद और शीर्षकीय प्रयोग सामान्य संज्ञा वाले अर्थ का समर्थन करते हैं, पर ‘मस्सा’ की व्याख्या प्राचीन और संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: अंतिम शब्दों לְאִיתִיאֵל לְאִיתִיאֵל וְאֻכָל की व्याख्या
  choice: मसोरेटी स्वरांकन के अनुसार ईतीएल और ऊकाल को नाम माना गया है।
  alternative: व्यंजनों को अलग स्वर देकर ‘हे परमेश्वर, मैं थक गया हूँ …’ जैसा क्रियात्मक कथन पढ़ना।
  rationale: मुख्य पाठ प्राप्त मसोरेटी रूप का अनुसरण करता है, किंतु वैकल्पिक स्वरांकन अर्थ को बहुत बदल देता है और भाषिक रूप से संभव माना गया है; अतः वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में संक्षिप्त, शीर्षकीय और गरिमापूर्ण रखी गई है। नामों को हिब्रू के निकट देवनागरी में लिप्यंतरित किया गया है। कठिन पुनरुक्ति और दोनों प्रमुख पाठगत-व्याख्यात्मक संभावनाओं को मिटाने के बजाय मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
