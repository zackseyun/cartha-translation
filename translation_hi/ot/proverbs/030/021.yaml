lexical_decisions:
- source_word: תַּחַת
  choice: के कारण
  rationale: इस संख्यात्मक नीति-वचन में यह पूर्वसर्ग उन परिस्थितियों या बातों को बताता है जिनसे धरती व्याकुल होती है। शाब्दिक ‘के नीचे’ की तुलना में ‘के कारण’ आधुनिक हिन्दी में अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
