- source_word: רָגְזָה
  choice: काँप उठती है
  rationale: רָגַז काँपने, थरथराने या व्याकुल होने का भाव रखता है। ‘काँप उठती है’ धरती के मानवीकरण और स्थिति से उत्पन्न तीव्र हलचल—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶרֶץ
  choice: धरती
  rationale: यहाँ व्यापक रूप से मानवीकृत पृथ्वी अभिप्रेत है; ‘धरती’ सामान्य, गरिमापूर्ण और काव्यात्मक हिन्दी है।
- source_word: וְתַחַת אַרְבַּע
  choice: और चार के कारण
  rationale: यह अनुवाद ‘तीन... और चार’ की पारंपरिक संख्यात्मक समानांतर रचना को सुरक्षित रखता है; ‘बातों’ दूसरी पंक्ति में सहज रूप से समझा जाता है।
- source_word: לֹא תוּכַל שְׂאֵת
  choice: वह भार सह नहीं सकती
  rationale: נָשָׂא का अर्थ उठाना, ढोना अथवा सहना हो सकता है। ‘भार सह नहीं सकती’ धरती पर बोझ पड़ने की छवि और सहन न कर पाने के अर्थ को साथ रखता है।
