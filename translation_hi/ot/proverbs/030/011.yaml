  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דּ֭וֹר אָבִ֣י/ו יְקַלֵּ֑ל וְ/אֶת אִ֝מּ֗/וֹ לֹ֣א יְבָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/011.yaml
  text: There is a generation that curses its father and does not bless its mother[a][b].
translation:
  language: hi
  text: एक पीढ़ी ऐसी है जो अपने पिता को शाप देती है[a] और अपनी माता को आशीर्वाद नहीं देती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसके पिता’ है; ‘पीढ़ी’ सामूहिक संज्ञा होने के कारण यहाँ ‘अपने पिता’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘आशीर्वाद नहीं देती’ का भाव ‘उसके विषय में भला नहीं बोलती’ या ‘उसका आदर नहीं करती’ भी हो सकता है। इब्रानी में शाब्दिक रूप से ‘उसकी माता’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: पीढ़ी
  rationale: यह शब्द किसी काल की पीढ़ी या समान चरित्र वाले लोगों के वर्ग को दर्शा सकता है। 30:11–14 में दोहराए गए ढाँचे को बनाए रखने के लिए ‘पीढ़ी’ उपयुक्त है।
- source_word: אָבִיו / אִמּוֹ
  choice: अपने पिता / अपनी माता
  rationale: इब्रानी में पुल्लिंग एकवचन प्रत्यय हैं, जबकि ‘पीढ़ी’ सामूहिक संज्ञा है। हिन्दी में ‘अपने/अपनी’ सामूहिक वर्ग के प्रत्येक सदस्य के पारिवारिक संबंध को स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक रूप से लिंग निर्धारित नहीं करता।
- source_word: יְקַלֵּל
  choice: शाप देती है
  rationale: קלל का पिएल रूप यहाँ शाप देने या अपमानजनक वचन कहने की गंभीर क्रिया व्यक्त करता है। ‘शाप देती है’ इसका सीधा और प्रबल हिन्दी समतुल्य है।
- source_word: וְאֶת
  choice: और
  rationale: וְ का अनुवाद ‘और’ किया गया है; אֶת निश्चित कर्म का चिह्न है और हिन्दी में उसका अलग शब्द नहीं चाहिए।
- source_word: לֹא יְבָרֵךְ
  choice: आशीर्वाद नहीं देती
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ है। यहाँ माता के विषय में भला बोलने या उसका आदर करने का भाव भी संभव है, पर मुख्य पाठ में सीधा अर्थ रखने से ‘शाप’ के साथ विरोध स्पष्ट रहता है। वर्तमानकालीन रूप नीतिवचन की सामान्य और चरित्र-वर्णनात्मक शैली के अनुकूल है।
