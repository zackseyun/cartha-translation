  text: זַרְזִ֣יר מָתְנַ֣יִם אוֹ תָ֑יִשׁ וּ֝/מֶ֗לֶךְ אַלְק֥וּם עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/031.yaml
  text: a strutting rooster[a], a he-goat[b], and a king against whom there is no rising up.
translation:
  language: hi
  text: इतराता हुआ मुर्गा[a], नर बकरा, और वह राजा, जिसके विरुद्ध कोई उठ खड़ा नहीं होता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘इतराता हुआ मुर्गा’ के लिए प्रयुक्त इब्रानी पद दुर्लभ और अनिश्चित है। इसके अन्य सम्भव अर्थ हैं: ‘ग्रेहाउंड,’ ‘युद्ध का घोड़ा,’ या ‘कमर कसा हुआ प्राणी।’'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी अभिव्यक्ति कठिन है। एक अन्य सम्भव अनुवाद है: ‘वह राजा, जिसकी सेना उसके साथ है।’'
    reason: alternative_reading
lexical_decisions:
- source_word: זַרְזִיר מָתְנַיִם
  choice: अकड़कर चलता मुर्गा
  rationale: זַרְזִיר एक दुर्लभ और अनिश्चित शब्द है, जबकि מָתְנַיִם का शाब्दिक अर्थ ‘कमर’ है। प्रसंग में प्रभावशाली चाल वाले प्राणियों का वर्णन है; इसलिए सहज हिन्दी में ‘अकड़कर चलता मुर्गा’ चुना गया है। अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תָיִשׁ
  choice: नर बकरा
  rationale: यह शब्द विशेष रूप से बकरे, अर्थात नर बकरी, को सूचित करता है; ‘नर बकरा’ आधुनिक हिन्दी में अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: सामान्य इब्रानी संज्ञा का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: אַלְקוּם עִמּוֹ
  choice: जिसके विरुद्ध कोई उठ खड़ा नहीं होता
  rationale: यह कठिन और विवादित अभिव्यक्ति ‘जिसके विरुद्ध उठ खड़ा होना नहीं’ के अर्थ की अनुमति देती है और राजा की प्रभावशाली, निर्भीक गति के प्रसंग से मेल खाती है। अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: אַלְקוּם עִמּוֹ की व्याख्या
  choice: जिसके विरुद्ध कोई उठ खड़ा नहीं होता
  alternative: जिसकी सेना उसके साथ है; अथवा, जो अपने लोगों के साथ आगे बढ़ता है
  rationale: व्यंजनात्मक पाठ और शब्द-विभाजन कठिन हैं, इसलिए किसी एक व्याख्या को निर्विवाद नहीं माना गया। मुख्य पाठ में एक प्राचीन और व्याकरणतः सम्भव अर्थ रखा गया है तथा वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दुर्लभ पहले पद को अत्यधिक शाब्दिक ‘कमर वाला’ कहने के बजाय चाल के दृश्य प्रभाव के रूप में व्यक्त किया गया है। अंतिम पद की वास्तविक पाठगत और अर्थगत अनिश्चितता को दबाया नहीं गया है।
