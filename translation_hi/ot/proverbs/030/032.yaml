  text: אִם נָבַ֥לְתָּ בְ/הִתְנַשֵּׂ֑א וְ/אִם זַ֝מּ֗וֹתָ יָ֣ד לְ/פֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/032.yaml
  text: If you have acted foolishly by exalting yourself[a], or if you have plotted[b], put your hand over your mouth.
translation:
  language: hi
  text: यदि तुमने अपने आप को ऊँचा उठाकर मूर्खता की है, या यदि तुमने कोई योजना रची है[a], तो अपने मुँह पर हाथ रखो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अनुवाद ‘कोई चाल चली है’ या ‘षड्यंत्र रचा है’ भी हो सकता है; नीतिवचन के प्रसंगों में इसमें प्रायः नकारात्मक भाव होता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हाथ मुँह को।’ यह चुप रहने या अपनी बात आगे न बढ़ाने का संकेत है।
    reason: idiom_explanation
lexical_decisions:
- source_word: נָבַלְתָּ
  choice: मूर्खता की है
  rationale: क्रिया नैतिक और व्यवहारिक मूर्खता या अनुचित आचरण को व्यक्त कर सकती है। यह चयन नीतिवचन के प्रसंग में स्वाभाविक है और इसे केवल बुद्धि की कमी तक सीमित नहीं करता।
- source_word: בְהִתְנַשֵּׂא
  choice: अपने आप को ऊँचा उठाकर
  rationale: हित्पएल रूप आत्म-उन्नयन या स्वयं को बड़ा बनाने का भाव देता है। यह अनुवाद प्रतिवर्ती अर्थ और उस आचरण में निहित मूर्खता—दोनों को स्पष्ट रखता है।
- source_word: זַמּוֹתָ
  choice: कोई योजना रची है
  rationale: זמם का अर्थ मन में योजना बनाना, युक्ति रचना या षड्यंत्र करना हो सकता है। कर्म का उल्लेख मूल में नहीं है, इसलिए ‘बुरी’ को मुख्य पाठ में नहीं जोड़ा गया; संभावित नकारात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָד לְפֶה
  choice: अपने मुँह पर हाथ रखो
  rationale: मूल का संक्षिप्त चित्रात्मक वाक्यांश शाब्दिक रूप से ‘हाथ मुँह को/पर’ है और चुप रहने या अपनी वाणी रोकने का मुहावरा है। हिन्दी में यह रूप चित्र और आशय दोनों को सहजता से संप्रेषित करता है।
- source_word: אִם ... וְאִם
  choice: यदि ... या यदि
  rationale: दो संबद्ध संभावनाओं को वैकल्पिक शर्तों के रूप में प्रस्तुत करने के लिए ‘यदि ... या यदि’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: זמם में नकारात्मक आशय की स्पष्टता
  choice: मुख्य पाठ में ‘कोई योजना रची है’
  alternative: ‘कोई बुरी योजना बनाई है’ या ‘षड्यंत्र रचा है’
  rationale: मूल क्रिया प्रसंगानुसार नकारात्मक योजना का संकेत दे सकती है, पर यहाँ उसका कर्म व्यक्त नहीं किया गया। ‘बुरी’ जोड़ने से निहित भाव स्पष्ट होता, किंतु स्रोत की अस्पष्टता घट जाती; इसलिए अधिक खुला अनुवाद चुना गया और विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन संबोधन के लिए सहज और सम्मानपूर्ण ‘तुम’ रूप रखा गया है। भाषा संक्षिप्त, उपदेशात्मक और चित्रात्मक है, जैसा कि इब्रानी नीतिवचन की शैली में है।
