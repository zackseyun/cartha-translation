base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/033.yaml
  text: For churning milk produces butter[a], and pressing the nose produces blood[b], and pressing anger produces strife.
translation:
  language: hi
  text: 'क्योंकि दूध मथने से मक्खन[a] निकलता है,

    और नाक दबाने से खून निकलता है,

    और क्रोध को भड़काने से झगड़ा होता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दही/मलाई’; इब्रानी शब्द मथने या जमने से बने दुग्ध-उत्पाद के लिए व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शब्दों का खेल है: ‘नाक’ और ‘क्रोध’ के लिए אַף शब्द के अलग-अलग रूप प्रयुक्त हुए हैं। तीनों खंडों में מִיץ शब्द दोहराया गया है, जिसका मूल अर्थ ‘दबाना’ या ‘निचोड़ना’ है; तीसरे खंड में इसका अर्थ क्रोध को उकसाना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है और इब्रानी के कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִיץ
  choice: मथने / दबाने / भड़काने
  rationale: मूल शब्द तीनों पंक्तियों में दबाव या निचोड़ने की क्रिया को दोहराता है। दूध के संदर्भ में ‘मथने’, नाक के लिए ‘दबाने’, और क्रोध के लिए अर्थ-स्पष्ट ‘भड़काने’ स्वाभाविक हिन्दी देते हैं; शब्द-पुनरावृत्ति की हानि को टिप्पणी में बताया गया है।
- source_word: חָלָב
  choice: दूध
  rationale: सीधा और सर्वसुलभ हिन्दी अर्थ।
- source_word: יוֹצִיא
  choice: निकलता है
  rationale: हिफ़ील रूप के कारण और परिणाम को हिन्दी में सहज ढंग से व्यक्त करता है तथा तीनों पंक्तियों का समान ढाँचा बनाए रखता है।
- source_word: חֶמְאָה
  choice: मक्खन
  rationale: पारंपरिक और प्रसंगानुकूल अर्थ; शब्द किसी मथे या जमे हुए दुग्ध-उत्पाद को भी सूचित कर सकता है, इसलिए विकल्प टिप्पणी में दिया गया है।
- source_word: אַף
  choice: नाक
  rationale: यहाँ खून निकलने के कारण ठोस शारीरिक अर्थ अपेक्षित है।
- source_word: דָם
  choice: खून
  rationale: आम आधुनिक हिन्दी में स्वाभाविक और स्पष्ट शब्द।
- source_word: אַפַּיִם
  choice: क्रोध
  rationale: शाब्दिक रूप से ‘नथुने’ से संबंधित यह रूप इब्रानी में क्रोध का प्रचलित मुहावरा है। अर्थ स्पष्ट रखते हुए मूल का शब्द-खेल टिप्पणी में सुरक्षित किया गया है।
- source_word: רִיב
  choice: झगड़ा
  rationale: विवाद या कलह का सामान्य, स्पष्ट और लोकोक्तिपरक हिन्दी रूप।
