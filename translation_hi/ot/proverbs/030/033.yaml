  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण लोकोक्तिपरक शैली। तीन समान परिणामसूचक पंक्तियों को ‘निकलता है’ से जोड़ा गया है। मूल इब्रानी का אַף वाला शब्द-खेल हिन्दी मुख्य पाठ में पूर्णतः पुनरुत्पादित नहीं हो सकता, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है।
