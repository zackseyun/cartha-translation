  edition: WLC
  text: אַל תַּלְשֵׁ֣ן עֶ֭בֶד אֶל אדנ/ו פֶּֽן יְקַלֶּלְ/ךָ֥ וְ/אָשָֽׁמְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/010.yaml
  text: Do not slander a servant to his master[a], lest he curse you and you become guilty.
translation:
  language: hi
  text: किसी दास[a] की उसके स्वामी के पास निंदा मत करना, कहीं ऐसा न हो कि वह तुझे शाप दे और तू दोषी ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’; इब्रानी עֶבֶד अधीनस्थ सेवक या बंधुआ दास, दोनों के लिए प्रयुक्त हो सकता है। यहाँ ‘दास’ उसकी असुरक्षित सामाजिक स्थिति को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּלְשֵׁן
  choice: निंदा न करना
  rationale: यह क्रिया किसी के विरुद्ध जीभ का दुर्भावनापूर्ण उपयोग—बदनाम करने या हानि पहुँचाने वाली शिकायत—दर्शाती है। ‘निंदा’ नैतिक दोष को स्पष्ट रखती है और तटस्थ ‘सूचना देना’ से अधिक सटीक है।
- source_word: עֶבֶד
  choice: दास
  rationale: यहाँ शब्द अधीन और बंधी हुई सामाजिक स्थिति वाले व्यक्ति को सूचित करता है। ‘दास’ आधुनिक हिन्दी में ‘सेवक’ की अपेक्षा उस असमान और असुरक्षित स्थिति को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: אֶל אדניו
  choice: उसके स्वामी के सामने
  rationale: पूर्वसर्ग और संबंधसूचक प्रत्यय सहित संज्ञा का भाव दास के अपने स्वामी के समक्ष उसके विरुद्ध बोलना है। ‘स्वामी’ इस सामाजिक संबंध के लिए स्वाभाविक है; ‘प्रभु’ अनावश्यक धार्मिक अर्थ ला सकता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह वांछित न होने वाले संभावित परिणाम की चेतावनी देता है। यह हिन्दी में निषेधात्मक चेतावनी का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: יְקַלֶּלְךָ
  choice: वह तुझे शाप दे
  rationale: पिएल रूप यहाँ केवल अपमान करने के बजाय शाप देने का गंभीर अर्थ रखता है।
- source_word: וְאָשָׁמְתָּ
  choice: और तू दोषी ठहरे
  rationale: क्रिया दोष या दायित्व में आने का भाव देती है। ‘दोषी ठहरे’ परिणामस्वरूप दोषी पाए जाने या माने जाने की गुंजाइश बनाए रखता है, बिना प्रक्रिया को आवश्यकता से अधिक स्पष्ट किए।
theological_decisions:
- issue: दास के शाप और दोषी ठहरने के बीच संबंध
  choice: 'दोनों परिणामों को क्रम से रखा गया है: ‘वह तुझे शाप दे और तू दोषी ठहरे’'
  alternative: शाप को ही दोष उत्पन्न करने वाला स्पष्ट कारण बताना
  rationale: इब्रानी पाठ घटनाओं को जोड़ता है, पर यह निश्चित नहीं करता कि शाप स्वयं दोष उत्पन्न करता है, दोष प्रकट करता है, या न्याय को बुलाता है। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त नीतिवचनात्मक शैली रखी गई है। ‘तू/तुझे’ एकवचन इब्रानी संबोधन और पारंपरिक ज्ञान-साहित्य की सीधी, गंभीर वाणी को व्यक्त करता है।
