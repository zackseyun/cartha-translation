  text: פֶּ֥ן אֶשְׂבַּ֨ע וְ/כִחַשְׁתִּי֮ וְ/אָמַ֗רְתִּי מִ֥י יְה֫וָ֥ה וּ/פֶֽן אִוָּרֵ֥שׁ וְ/גָנַ֑בְתִּי וְ֝/תָפַ֗שְׂתִּי שֵׁ֣ם אֱלֹהָֽ/י׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/009.yaml
  text: lest I become full and deny you and say[b][a], “Who is Yahweh?” or lest I become poor and steal and profane the name of my God.
translation:
  language: hi
  text: कहीं ऐसा न हो कि मैं तृप्त होकर तुझसे मुकर जाऊँ और कहूँ, “याहवे कौन है?” या कहीं ऐसा न हो कि मैं गरीब होकर चोरी करूँ और अपने परमेश्वर के नाम को अपवित्र करूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अपने परमेश्वर के नाम को पकड़ूँ/थामूँ।” इसका अर्थ “अपने परमेश्वर के नाम का दुरुपयोग करूँ” या उसके नाम का अनादर करूँ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह प्रार्थना में आशंका और उससे बचने की इच्छा व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक रूप से उस भाव को बनाए रखता है।
- source_word: אֶשְׂבַּע
  choice: मैं तृप्त होकर
  rationale: मूल क्रिया पेट भरने या पर्याप्त होने की ठोस छवि देती है; ‘तृप्त’ समृद्धि से उपजने वाली आत्मनिर्भरता के संदर्भ में उपयुक्त है।
- source_word: כִחַשְׁתִּי
  choice: तुझसे मुकर जाऊँ
  rationale: इस संदर्भ में क्रिया परमेश्वर को नकारने या उससे संबंध अस्वीकार करने का भाव रखती है; ‘मुकर जाना’ साधारण झूठ बोलने से अधिक उपयुक्त है।
- source_word: מִי יְהוָה
  choice: याहवे कौन है?
  rationale: रूपकात्मक प्रश्न मूल की उद्दंड उपेक्षा को सीधे बनाए रखता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: אִוָּרֵשׁ
  choice: मैं गरीब होकर
  rationale: निफ़अल रूप यहाँ निर्धन हो जाने का भाव देता है और तृप्त होने के समानांतर है।
- source_word: גָנַבְתִּי
  choice: चोरी करूँ
  rationale: यह मूल क्रिया का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי
  choice: अपने परमेश्वर के नाम को अपवित्र करूँ
  rationale: शाब्दिक रूप से ‘अपने परमेश्वर के नाम को पकड़ूँ/थामूँ’ कठिन मुहावरा है। संदर्भ में चोरी के द्वारा परमेश्वर के नाम का अपमान या दुरुपयोग होने का भाव है; ‘अपवित्र करूँ’ इस व्यापक प्रभाव को व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक कठिनाई और विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וְתָפַשְׂתִּי שֵׁם אֱלֹהָי का आशय
  choice: अपने परमेश्वर के नाम को अपवित्र करूँ
  alternative: अपने परमेश्वर के नाम का दुरुपयोग करूँ
  rationale: वाक्यांश का सटीक मुहावरेदार अर्थ विवादित है। संदर्भ चोरी से परमेश्वर के नाम पर आने वाले कलंक का संकेत दे सकता है, पर ‘दुरुपयोग’ भी संभव है; इसलिए मुख्य पाठ व्यापक अर्थ देता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कहीं ऐसा न हो’ दोनों समानांतर आशंकाओं को स्पष्ट करता है; ‘तुझसे’ प्रार्थना के निकट, व्यक्तिगत संबोधन को बनाए रखता है।
