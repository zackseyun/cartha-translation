base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/024.yaml
  text: 'Four are small on the earth[a], yet they are exceedingly wise:'
translation:
  language: hi
  text: 'चार हैं, जो धरती पर छोटे हैं, फिर भी वे अत्यन्त बुद्धिमान[a] हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “बुद्धिमान, बुद्धिमान बनाए गए”—यह बहुत अधिक बुद्धिमान होने पर बल देने वाली अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעָה
  choice: चार हैं
  rationale: यह संख्या-वचन का संक्षिप्त आरम्भ है। हिन्दी में केवल ‘चार’ की अपेक्षा ‘चार हैं’ स्वाभाविक है और इब्रानी की संक्षिप्तता भी बनाए रखता है।
- source_word: קְטַנֵּי אָרֶץ
  choice: धरती पर छोटे
  rationale: शाब्दिक भाव ‘धरती/भूमि के छोटे’ है। ‘प्राणी’ संदर्भ से निहित है, पर इस पद में स्पष्ट नहीं; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְהֵמָּה
  choice: फिर भी वे
  rationale: संयोजक और स्वतंत्र सर्वनाम यहाँ छोटे होने तथा बुद्धिमान होने के बीच प्रभावी विरोध दिखाते हैं।
- source_word: חֲכָמִים
  choice: बुद्धिमान
  rationale: नीतिवचन के ज्ञान-साहित्यिक संदर्भ में חכם का सामान्य और स्वाभाविक हिन्दी रूप।
- source_word: מְחֻכָּמִים
  choice: अत्यन्त बुद्धिमान
  rationale: חֲכָמִים के साथ प्रयुक्त पुअल कृदन्त बलाघात पैदा करता है; ‘अत्यन्त बुद्धिमान’ हिन्दी में इस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
