base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/016.yaml
  text: Sheol[a], and a barren womb; earth, never satisfied with water; and fire, which never says[c][b], “Enough.”
translation:
  language: hi
  text: अधोलोक[a], और बाँझ कोख[b]; धरती, जो पानी से कभी तृप्त नहीं होती; और आग, जो कभी नहीं कहती, “बस।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “मृतकों का लोक।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “कोख का रुकना/बंद होना” है, अर्थात ऐसी कोख जो सन्तान नहीं जनती।
    reason: lexical_alternative
  - marker: c
    text: अन्त का इब्रानी पद कठिन है। बहुत-से लोग इसका अर्थ “बस!” समझते हैं; अन्य विद्वानों ने “धन” या “सम्पत्ति” से जुड़ा अर्थ प्रस्तावित किया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह इब्रानी धारणा मृतकों के लोक को सूचित करती है, केवल कब्र को नहीं; ‘अधोलोक’ आधुनिक हिन्दी में अर्थपूर्ण और गरिमापूर्ण है।
- source_word: עֹצֶר רָחַם
  choice: बाँझ गर्भ
  rationale: शाब्दिक अर्थ गर्भ का रोका या बंद होना है; सन्दर्भ में यह सन्तान न जनने वाले गर्भ की मुहावरेदार अभिव्यक्ति है।
- source_word: אֶרֶץ
  choice: धरती
  rationale: अतृप्त वस्तुओं की इस तात्त्विक सूची में किसी विशिष्ट देश के बजाय व्यापक धरती अभिप्रेत है।
- source_word: לֹא שָׂבְעָה מַּיִם
  choice: जो पानी से कभी तृप्त नहीं होती
  rationale: यह क्रिया तृप्त या भरपूर होने का भाव देती है; ‘कभी तृप्त नहीं होती’ कहावत की निरन्तरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सीधा और स्वाभाविक हिन्दी प्रतिरूप।
- source_word: לֹא אָמְרָה הוֹן
  choice: जो कभी नहीं कहती, “बस।”
  rationale: अन्तिम इब्रानी शब्द कठिन है, पर समानान्तर अतृप्तता के सन्दर्भ में ‘बस’ अर्थात ‘पर्याप्त’ सर्वाधिक उपयुक्त है; पाठ-टिप्पणी अन्य सम्भावना सुरक्षित रखती है।
