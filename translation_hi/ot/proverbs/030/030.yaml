  text: the lion[a], mighty among beasts, and does not turn back before any.
translation:
  language: hi
  text: पशुओं में पराक्रमी सिंह[a], जो किसी के सामने पीछे नहीं हटता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘सिंह’ के लिए एक काव्यात्मक शब्द और पशु-जगत के लिए व्यापक शब्द प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיִשׁ
  choice: सिंह
  rationale: यह सिंह के लिए प्रयुक्त एक काव्यात्मक इब्रानी शब्द है। हिन्दी में बिना विशेष संकेत के ‘सिंह’ इस नीतिवचन में जातिवाचक और आदर्श उदाहरण—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: גִּבּוֹר
  choice: पराक्रमी
  rationale: यह शब्द सामर्थ्य और प्रभावशाली बल का बोध कराता है। ‘पराक्रमी’ ऊँचे काव्यात्मक लहजे को बनाए रखता है, पर इसे अनिवार्य रूप से सैनिक वीरता तक सीमित नहीं करता।
- source_word: בַּבְּהֵמָה
  choice: पशुओं में
  rationale: यहाँ בְּהֵמָה किसी एक घरेलू पशु के बजाय व्यापक पशु-जगत को दर्शाता है; संबंधवाचक ב को हिन्दी में स्वाभाविक तुलनात्मक भाव ‘पशुओं में’ से व्यक्त किया गया है।
- source_word: וְלֹא יָשׁוּב
  choice: जो ... पीछे नहीं हटता
  rationale: שׁוּב का मूल चित्र मुड़ने या लौटने का है। प्रसंग में ‘पीछे नहीं हटता’ निर्भीकतापूर्वक न हटने का अर्थ स्वाभाविक हिन्दी में देता है, बिना अनावश्यक सैनिक शब्दावली जोड़े।
- source_word: מִפְּנֵי כֹל
  choice: किसी के सामने
  rationale: מִפְּנֵי सामना या उपस्थिति का भाव रखता है और כֹל व्यापक है। ‘किसी के सामने’ इस सर्वसमावेशी भाव को बनाए रखता है और सामने पड़ने पर न हटने का आशय स्पष्ट करता है।
