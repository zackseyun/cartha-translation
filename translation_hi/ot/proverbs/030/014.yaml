  text: a generation whose teeth are swords[a], and whose fangs are knives[b], to devour the poor from the earth and the needy from among mankind.
translation:
  language: hi
  text: एक ऐसी पीढ़ी है जिसके दाँत तलवारें हैं और जिसकी दाढ़ें छुरियाँ हैं, ताकि वह गरीबों को धरती[a] पर से और जरूरतमंदों को मनुष्यों के बीच से[b] निगल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश में से’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘मनुष्य में से’; यहाँ אָדָם का अर्थ सामान्य रूप से मानवजाति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר
  choice: एक ऐसी पीढ़ी है
  rationale: דּוֹר पीढ़ी अथवा एक प्रकार के लोगों के सामूहिक वर्ग को दर्शाता है। हिन्दी में पद की विस्मयात्मक पहचान को स्वाभाविक बनाने के लिए ‘एक ऐसी पीढ़ी है’ कहा गया है।
- source_word: חֲרָבוֹת שִׁנָּיו
  choice: जिसके दाँत तलवारें हैं
  rationale: शाब्दिक और तीखी हिंसक उपमा को ज्यों का त्यों रखा गया है; एकवचन सामूहिक דּוֹר के प्रत्यय को हिन्दी में ‘जिसके’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַאֲכָלוֹת מְתַלְּעֹתָיו
  choice: और जिसकी दाढ़ें छुरियाँ हैं
  rationale: מְתַלְּעוֹת जबड़े के दाँतों या दाढ़ों को सूचित करता है; ‘दाढ़ें’ सामान्य हिन्दी में स्पष्ट है। מַאֲכָלוֹת यहाँ काटने के औजार हैं, इसलिए ‘छुरियाँ’ समानांतर हिंसक बिंब बनाए रखता है।
- source_word: לֶאֱכֹל
  choice: ताकि वह … निगल जाए
  rationale: मूल क्रिया का आधारभूत अर्थ ‘खाना’ है, पर यहाँ हिंसक शोषण और समूल मिटाने का भक्षक-बिंब है; ‘निगल जाए’ उसे स्वाभाविक और सशक्त हिन्दी में व्यक्त करता है।
- source_word: עֲנִיִּים
  choice: दीनों
  rationale: עָנִי आर्थिक गरीबी के साथ पीड़ित और असहाय दशा भी व्यक्त कर सकता है। ‘दीन’ इस व्यापक अर्थ को संक्षेप में रखता है और अगले אֶבְיוֹנִים से भेद बनाए रखता है।
- source_word: מֵאֶרֶץ
  choice: धरती पर से
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘देश’ हो सकता है। מִן के साथ यहाँ किसी को धरती पर से मिटा देने का भाव स्वाभाविक है; प्रादेशिक अर्थ भी पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶבְיוֹנִים
  choice: जरूरतमंदों
  rationale: אֶבְיוֹן अभावग्रस्त और सहायता के जरूरतमंद लोगों को दर्शाता है। यह ‘दीनों’ के समानांतर रहते हुए शब्दगत भिन्नता भी बनाए रखता है।
- source_word: מֵאָדָם
  choice: मनुष्यों के बीच से
  rationale: אָדָם यहाँ किसी एक पुरुष का नहीं, मानव-समुदाय का सामान्य बोध कराता है। ‘मनुष्यों के बीच से’ हिन्दी में उस सामूहिक अर्थ और מִן के निष्कासन-बोध दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: मनुष्यों के बीच से
  alternative: मनुष्य में से / मानवजाति में से
  rationale: संदर्भ किसी विशिष्ट पुरुष का नहीं है। बहुवचन ‘मनुष्यों’ से समावेशी सामान्य अर्थ स्वाभाविक हिन्दी में आता है, जबकि ‘के बीच से’ लोगों के समुदाय से मिटा देने की समानांतर धारणा रखता है।
- issue: गरीबों को ‘खाने’ का रूपक
  choice: निगल जाए
  alternative: खा जाए / नष्ट कर दे
  rationale: ‘निगल जाए’ मूल भक्षक-रूपक और शोषण की हिंसा को सुरक्षित रखता है; ‘नष्ट कर दे’ रूपक को खोलकर व्याख्या कर देता, जबकि ‘खा जाए’ हिन्दी में अपेक्षाकृत कम तीखा हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक रूप अपनाया गया है। तलवार, छुरी और निगलने के समानांतर हिंसक बिंब सुरक्षित हैं। सामूहिक ‘पीढ़ी’ के लिए एकवचन ‘वह’ हिन्दी व्याकरण के अनुरूप रखा गया है।
