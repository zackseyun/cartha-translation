  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर से सीधे संबोधन के लिए एकवचन ‘तू’ रूप रखा गया है। पद के अंत का द्विबिंदु अगले पद में इन दो बातों के विवरण की ओर संकेत करता है।
