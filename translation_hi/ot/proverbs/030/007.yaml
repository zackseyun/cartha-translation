  yaml_path: translation/ot/proverbs/030/007.yaml
  text: 'Two things I have asked of you[a]; do not withhold them from me before I die:'
translation:
  language: hi
  text: 'मैंने तुझसे दो बातें[a] माँगी हैं; मेरे मरने से पहले मुझे उनसे वंचित न रख:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘दो’ है; संदर्भ के अनुसार ‘बातें’ शब्द निहित है और हिन्दी में स्पष्टता के लिए जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתַּיִם
  choice: दो बातें
  rationale: इब्रानी में स्त्रीलिंग संख्या ‘दो’ अकेली प्रयुक्त हुई है और संदर्भ से दो माँगी गई बातों का संकेत मिलता है। सहज हिन्दी के लिए ‘बातें’ जोड़ा गया है।
- source_word: שָׁאַלְתִּי
  choice: मैंने ... माँगी हैं
  rationale: पूर्ण क्रिया प्रार्थना के संदर्भ में पहले की गई और अब भी प्रभावी माँग को व्यक्त करती है; हिन्दी का पूर्णकाल यहाँ स्वाभाविक है।
- source_word: מֵאִתָּךְ
  choice: तुझसे
  rationale: यह माँग के संबोधित व्यक्ति और स्रोत को दर्शाता है; ‘तुझसे माँगी हैं’ सहज हिन्दी है।
- source_word: אַל־תִּמְנַע מִמֶּנִּי
  choice: मुझे उनसे वंचित न रख
  rationale: מנע का मूल भाव रोक रखना या न देना है। शाब्दिक ‘उन्हें मुझसे न रोक’ असहज हिन्दी होती; यह रूप उसी निषेधात्मक विनती को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּטֶרֶם אָמוּת
  choice: मेरे मरने से पहले
  rationale: समयवाचक पद का सीधा और स्वाभाविक हिन्दी रूप, जो माँग पूरी होने की समय-सीमा बनाए रखता है।
