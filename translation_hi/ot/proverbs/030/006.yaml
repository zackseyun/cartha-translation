  edition: WLC
  text: אַל תּ֥וֹסְףְּ עַל דְּבָרָ֑י/ו פֶּן יוֹכִ֖יחַ בְּ/ךָ֣ וְ/נִכְזָֽבְתָּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/006.yaml
  text: Do not add to his words[a], lest he rebuke you and you be proved a liar.
translation:
  language: hi
  text: उसके वचनों में कुछ न जोड़ो, कहीं ऐसा न हो कि वह तुम्हें डाँटे और तुम झूठे ठहरो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תּוֹסְףְּ
  choice: कुछ न जोड़ो
  rationale: निषेधसूचक אַל और יסף के हिफ़ील रूप का स्वाभाविक हिन्दी अर्थ स्पष्ट मनाही के रूप में ‘कुछ न जोड़ो’ है।
- source_word: עַל דְּבָרָיו
  choice: उसके वचनों में
  rationale: עַל यहाँ ‘जोड़ना’ क्रिया के साथ सम्बन्ध बताता है। דְּבָרָיו बहुवचन में ‘उसके वचन’ है; पिछले पद के कारण सर्वनाम का संकेत परमेश्वर की ओर है, पर मूल की तरह सर्वनाम ही रखा गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी प्रस्तुत करता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: יוֹכִיחַ בְּךָ
  choice: वह तुम्हें डाँटे
  rationale: יכח का हिफ़ील रूप यहाँ दोष दिखाने अथवा फटकारने का भाव रखता है। ‘डाँटे’ सामान्य पाठक के लिए स्पष्ट है और व्यक्तिगत प्रताड़ना के बजाय मौखिक ताड़ना का अर्थ देता है।
- source_word: וְנִכְזָבְתָּ
  choice: और तुम झूठे ठहरो
  rationale: כזב के निफ़ाल रूप में किसी के झूठा या असत्य सिद्ध होने का परिणामसूचक भाव है। ‘झूठे ठहरो’ निष्क्रिय/परिणामात्मक अर्थ और नैतिक गंभीरता दोनों बनाए रखता है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: मूल के अनुरूप ‘उसके’ रखा गया है; निकट संदर्भ में यह परमेश्वर की ओर संकेत करता है।
  alternative: स्पष्ट करके ‘परमेश्वर के वचनों में’ कहना।
  rationale: पद 5 में परमेश्वर के प्रत्येक वचन की चर्चा है, इसलिए वही सबसे स्वाभाविक संदर्भ है। फिर भी हिब्रू पाठ सर्वनाम का प्रयोग करता है; उसे बनाए रखने से पाठ की मूल संयोजकता और अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘वचन’ बाइबलीय संदर्भ में परिचित है, जबकि शेष वाक्य सामान्य आधुनिक हिन्दी में सहज है।
