translation:
  language: hi
  text: तीन बातें मेरी समझ से परे हैं; चार को मैं नहीं समझता:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुसार: “तीन मेरे लिए अद्भुत हैं, और चार को मैं नहीं जानता।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלֹשָׁה הֵמָּה
  choice: तीन बातें
  rationale: यह इब्रानी संख्यात्मक उक्ति का आरंभ है। स्वाभाविक हिन्दी में निहित संज्ञा को व्यक्त करने के लिए “बातें” जोड़ा गया है; הֵמָּה का बल अलग सर्वनाम के बजाय वाक्य-संरचना में समाहित है।
- source_word: נִפְלְאוּ מִמֶּנִּי
  choice: मेरे लिए समझ से परे हैं
  rationale: פלא यहाँ विस्मयकारी होने के साथ वक्ता की समझ से बढ़कर होने का भाव रखता है। “समझ से परे” इस संदर्भ में दोनों पदों के संयुक्त आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: וְאַרְבַּע
  choice: चार
  rationale: यह तीन/चार वाली क्रमवृद्धि की ज्ञान-साहित्यिक शैली है। अर्धविराम इस प्रगति को स्पष्ट रखता है; हिन्दी में “और” छोड़े बिना भी क्रम स्वाभाविक है।
- source_word: לֹא יְדַעְתִּים
  choice: को मैं नहीं समझता
  rationale: क्रिया का मूल अर्थ “मैं उन्हें नहीं जानता” है, पर प्रसंग में बोध या समझ प्रमुख है। “को” वस्तु-सूचक प्रत्यय के आशय को बनाए रखता है।
