  rationale: The revision changes only the repeated rendering of דֶּרֶךְ from ‘चाल’ to ‘मार्ग.’ This retains the proverb’s deliberately broad and enigmatic reference to a way or course, works naturally for a flying bird, a snake, and a ship, and leaves the final relational phrase appropriately non-explicit. Footnote markers remain attached to the relevant terms and the notes retain their source-based qualifications.
