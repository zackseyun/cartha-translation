language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דֶּ֤רֶךְ הַ/נֶּ֨שֶׁר בַּ/שָּׁמַיִם֮ דֶּ֥רֶךְ נָחָ֗שׁ עֲלֵ֫י צ֥וּר דֶּֽרֶךְ אֳנִיָּ֥ה בְ/לֶב יָ֑ם וְ/דֶ֖רֶךְ גֶּ֣בֶר בְּ/עַלְמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/019.yaml
  text: the way of an eagle in the sky[a], the way of a snake on a rock, the way of a ship in the heart of the sea[c][b], and the way of a man with a young woman.
translation:
  language: hi
  text: 'आकाश में उकाब का मार्ग,[a]


    चट्टान पर साँप का मार्ग,


    समुद्र के बीच जहाज़ का मार्ग,[b]


    और युवती के साथ पुरुष का मार्ग।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उकाब’ के लिए आया हिब्रानी शब्द अधिक व्यापक रूप से किसी बड़े शिकारी पक्षी को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रानी में शाब्दिक रूप से ‘समुद्र के हृदय में’—अर्थात समुद्र के बीच।
    reason: cultural_note
  - marker: c
    text: या ‘कुँवारी के साथ पुरुष का मार्ग।’ हिब्रानी עַלְמָה का सामान्य अर्थ विवाह योग्य आयु की ‘युवती’ है; यह शब्द अपने आप में उसके कुँवारी होने को अनिवार्य नहीं ठहराता।
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: चाल
  rationale: यह शब्द चारों पंक्तियों को बाँधता है और यहाँ गति के मार्ग, ढंग तथा ऐसी राह—जिसका निशान पकड़ना कठिन है—इन सबको समेटता है। हिंदी में बार-बार प्रयुक्त ‘चाल’ इस काव्यात्मक बहुअर्थकता को स्वाभाविक रूप से रखती है।
- source_word: הַנֶּשֶׁר
  choice: उकाब
  rationale: נֶשֶׁר किसी बड़े शिकारी पक्षी, विशेषतः उकाब, को सूचित कर सकता है। ‘उकाब’ संक्षिप्त, गरिमापूर्ण और इस आकाशीय बिंब के अनुकूल है; व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: संदर्भ उड़ते पक्षी के दिखाई देने वाले आकाश का है; अतः ‘आकाश’ यहाँ ‘स्वर्ग’ से अधिक ठोस और स्वाभाविक है।
- source_word: נָחָשׁ
  choice: साँप
  rationale: आधुनिक सामान्य हिंदी में स्पष्ट और सहज; ‘सर्प’ की अपेक्षा कम साहित्यिक तथा अनावश्यक प्रतीकात्मक अर्थों से मुक्त।
- source_word: עֲלֵי צוּר
  choice: चट्टान पर
  rationale: कठोर शिला पर साँप की गति का सीधा बिंब सुरक्षित रहता है।
- source_word: אֳנִיָּה
  choice: जहाज़
  rationale: समुद्र में चलने वाले बड़े जलयान के लिए सामान्य और उपयुक्त हिंदी शब्द।
- source_word: בְלֶב יָם
  choice: समुद्र के बीच
  rationale: शाब्दिक ‘समुद्र के हृदय में’ हिब्रानी मुहावरा है, जिसका स्वाभाविक हिंदी अर्थ ‘समुद्र के बीच’ है; मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: גֶּבֶר
  choice: पुरुष
  rationale: यह संज्ञा विशिष्ट रूप से वयस्क पुरुष को दर्शाती है; ‘पुरुष’ आधुनिक मानक हिंदी में सटीक और गरिमापूर्ण है।
- source_word: בְּעַלְמָה
  choice: युवती के साथ
  rationale: עַלְמָה विवाह योग्य आयु की युवती को बताता है, पर अपने आप में कौमार्य को अनिवार्यतः व्यक्त नहीं करता। בְ को यहाँ संबंधसूचक ‘के साथ’ रखा गया है, जिससे आकर्षण, प्रणय या घनिष्ठता की मूल अस्पष्टता बनी रहती है।
theological_decisions:
- issue: וְדֶרֶךְ גֶּבֶר בְּעַלְמָה का आशय
  choice: युवती के साथ पुरुष की चाल
  alternative: कुँवारी के साथ पुरुष की चाल; युवती में पुरुष की चाल
  rationale: यह अनुवाद पुरुष और युवती के बीच रहस्यमय संबंध या आकर्षण को व्यक्त करता है, पर हिब्रानी से अधिक स्पष्ट यौन अर्थ आरोपित नहीं करता। עַלְמָה को ‘कुँवारी’ कहना संभव पारंपरिक व्याख्या है, किन्तु शब्द स्वयं उस विशिष्टता की माँग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। चारों खंडों में ‘चाल’ की पुनरावृत्ति मूल की संरचना और रहस्यमय गति/ढंग की बहुअर्थकता बनाए रखती है। पंक्ति-विन्यास कहावत की समानांतर रचना को स्पष्ट करता है।
