source:
  edition: WLC
  text: כֵּ֤ן דֶּ֥רֶךְ אִשָּׁ֗ה מְנָ֫אָ֥פֶת אָ֭כְלָה וּ/מָ֣חֲתָה פִ֑י/הָ וְ֝/אָמְרָ֗ה לֹֽא פָעַ֥לְתִּי אָֽוֶן׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/020.yaml
  text: 'So is the way of an adulterous woman: she eats and wipes her mouth and says[b][a], “I have done no wrong.”'
translation:
  language: hi
  text: 'व्यभिचारिणी स्त्री का ढंग भी ऐसा ही है: वह खाती है, अपना मुँह पोंछती है और कहती है[b], “मैंने कोई बुराई नहीं की।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “मैंने कोई दुष्टता नहीं की।”'
    reason: lexical_alternative
  - marker: b
    text: खाने और मुँह पोंछने का चित्र लापरवाही से सबूत मिटा देने को दर्शाता है, मानो उस काम ने कोई नैतिक निशान छोड़ा ही न हो।
    reason: cultural_note
lexical_decisions:
- source_word: כֵּן
  choice: भी ऐसा ही है
  rationale: यह पिछले पद के चित्र से तुलना को जोड़ता है और हिन्दी में स्वाभाविक रूप से निष्कर्षात्मक-सादृश्य भाव व्यक्त करता है।
- source_word: דֶּרֶךְ
  choice: ढंग
  rationale: यहाँ शब्द किसी भौतिक मार्ग के बजाय व्यवहार के तरीके को दर्शाता है; ‘ढंग’ रूपक का आशय स्पष्ट और सहज रखता है।
- source_word: אִשָּׁה מְנָאָפֶת
  choice: व्यभिचारिणी स्त्री
  rationale: स्त्रीलिंग कृदन्त उस स्त्री को दर्शाता है जो व्यभिचार करती है; यह चयन संक्षिप्त, वर्तमान हिन्दी में स्पष्ट और मूल के नैतिक अर्थ के अनुरूप है।
- source_word: אָכְלָה
  choice: वह खाती है
  rationale: हिब्रू का पूर्ण क्रियारूप यहाँ नीतिवचन में जीवंत, सामान्य व्यवहार बताता है; हिन्दी का सामान्य वर्तमान काल इस आदतन अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמָחֲתָה פִיהָ
  choice: अपना मुँह पोंछती है
  rationale: यह मूल के ‘अपने मुँह को पोंछती है’ वाले ठोस चित्र को बनाए रखता है और भोजन के बाद निशान मिटाने का संकेत देता है।
- source_word: וְאָמְרָה
  choice: और कहती है
  rationale: अन्य क्रियाओं की तरह इसे भी नीतिवचन के आदतन वर्तमान के रूप में प्रस्तुत किया गया है।
- source_word: לֹא פָעַלְתִּי אָוֶן
  choice: मैंने कोई बुराई नहीं की
  rationale: ‘बुराई’ אָוֶן के नैतिक अपराध/दुष्टता के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करती है, जबकि ‘मैंने…नहीं की’ पूर्ण किए गए कार्य से इनकार को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल के तीखे नैतिक चित्र और आदतन व्यवहार के भाव को बनाए रखा गया है; व्याख्यात्मक बात मुख्य पाठ में जोड़ने के बजाय टिप्पणी में दी गई है।
