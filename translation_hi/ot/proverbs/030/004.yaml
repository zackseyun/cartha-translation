  edition: WLC
  text: מִ֤י עָלָֽה שָׁמַ֨יִם וַ/יֵּרַ֡ד מִ֤י אָֽסַף ר֨וּחַ בְּ/חָפְנָ֡י/ו מִ֤י צָֽרַר מַ֨יִם בַּ/שִּׂמְלָ֗ה מִ֭י הֵקִ֣ים כָּל אַפְסֵי אָ֑רֶץ מַה שְּׁמ֥/וֹ וּ/מַֽה שֶּׁם בְּ֝נ֗/וֹ כִּ֣י תֵדָֽע־׀־׀־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/004.yaml
  text: Who has gone up to heaven and come down? Who has gathered the wind in his hands? Who has wrapped the waters in a garment? Who has established all the ends of the earth? What is his name[a], and what is his son's name[c][b], surely you know!
translation:
  language: hi
  text: कौन आकाश[a] पर चढ़ा और फिर उतर आया? किसने हवा को अपने हाथों में समेटा? किसने जल को वस्त्र में बाँधा? किसने पृथ्वी के सारे छोर स्थापित किए? उसका नाम क्या है, और उसके पुत्र का नाम क्या है?[c]—यदि तुम जानते हो![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशों’; हिब्रू शब्द שָׁמַיִם का रूप व्याकरणतः बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निश्चय ही तुम जानते हो!’ हिब्रू वाक्यांश को व्यंग्यपूर्ण चुनौती के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: मसीही व्याख्या में ‘उसके पुत्र का नाम’ वाक्यांश को प्रायः विशेष महत्त्व दिया गया है, पर हिब्रू पाठ स्वयं उस पुत्र की पहचान स्पष्ट नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: עָלָה ... וַיֵּרַד
  choice: चढ़ा और फिर उतर आया
  rationale: पूर्ण क्रियाओं और ऊर्ध्व-अधो गति की छवि को स्वाभाविक हिन्दी में बनाए रखता है; ‘फिर’ क्रम को स्पष्ट करता है, कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: हिब्रू रूप व्याकरणतः बहुवचन है, पर इस सृष्टि-संदर्भ में हिन्दी का एकवचन ‘आकाश’ अधिक स्वाभाविक है; औपचारिक बहुवचन को पादटिप्पणी में रखा गया है।
- source_word: אָסַף רוּחַ
  choice: हवा को ... समेटा
  rationale: רוּחַ के ‘हवा’, ‘श्वास’ और ‘आत्मा’ अर्थ संभव हैं; जल और पृथ्वी के साथ ब्रह्मांडीय चित्रण में ‘हवा’ सर्वाधिक उपयुक्त है। ‘समेटा’ אָסַף की एकत्र करने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּחָפְנָיו
  choice: अपने हाथों में
  rationale: यह शब्द हथेलियों से बनी अंजलि या मुट्ठी-जितनी पकड़ का बोध देता है। ‘हाथों में’ छवि को समझने योग्य रखता है और ‘मुट्ठियों’ कहकर बंद मुट्ठी का अनावश्यक विशेषीकरण नहीं करता।
- source_word: צָרַר מַיִם בַּשִּׂמְלָה
  choice: जल को वस्त्र में बाँधा
  rationale: צָרַר बाँधने या गठरी करने और שִׂמְלָה बाहरी वस्त्र का बोध देता है। यह रूपक को स्पष्ट और संक्षिप्त रखता है।
- source_word: הֵקִים כָּל אַפְסֵי אָרֶץ
  choice: पृथ्वी के सारे छोर स्थापित किए
  rationale: הֵקִים का स्थापित या स्थिर करने का भाव और אַפְסֵי אָרֶץ का पृथ्वी के दूरस्थ छोरों का पारंपरिक ब्रह्मांडीय मुहावरा दोनों सुरक्षित रहते हैं।
- source_word: מַה שְּׁמוֹ וּמַה שֶּׁם בְּנוֹ
  choice: उसका नाम क्या है, और उसके पुत्र का नाम क्या है?
  rationale: दोनों प्रत्यक्ष प्रश्नों और בְּנוֹ के पुरुषवाची ‘पुत्र’ को बिना पहचान जोड़े ज्यों का त्यों रखता है।
- source_word: כִּי תֵדָע
  choice: यदि तुम जानते हो!
  rationale: यहाँ כִּי को शर्तात्मक और चुनौतीपूर्ण अर्थ में लिया गया है। विस्मयादिबोधक चिह्न प्रश्नमाला के अंत में निहित व्यंग्यपूर्ण चुनौती को व्यक्त करता है, इसे साधारण सूचना-वचन नहीं बनाता।
theological_decisions:
- issue: ‘उसके पुत्र’ की पहचान
  choice: मुख्य पाठ में ‘उसके पुत्र’ को बिना किसी स्पष्ट पहचान के बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से मसीह-संबंधी संकेत कहना, अथवा केवल किसी मानवीय व्यक्ति का पुत्र मानना।
  rationale: हिब्रू पाठ पुत्र का उल्लेख करता है, पर उसकी पहचान नहीं बताता। अनुवाद को इस धर्मवैज्ञानिक तनाव को सुरक्षित रखना चाहिए, न कि बाद की व्याख्या को मूल पाठ में जोड़ना चाहिए।
- issue: अंतिम वाक्यांश की वाक्यगत शक्ति
  choice: ‘यदि तुम जानते हो!’ के रूप में चुनौती
  alternative: ‘निश्चय ही तुम जानते हो!’ के रूप में व्यंग्यपूर्ण कथन
  rationale: כִּי תֵדָע दोनों प्रकार से समझा जा सकता है। संदर्भ में शर्तात्मक चुनौती सीधी और पाठ-संगत है; वैकल्पिक व्यंग्यपूर्ण कथन पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। क्रमिक आलंकारिक प्रश्नों की लय बनाए रखी गई है। ‘जल’, ‘वस्त्र’, ‘पृथ्वी’ और ‘पुत्र’ जैसे शब्द काव्यात्मक-ज्ञानसाहित्यिक गरिमा देते हैं, फिर भी सामान्य पाठक के लिए स्पष्ट हैं। सर्वनाम ‘तुम’ एकवचन हिब्रू संबोधन को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
