base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/008.yaml
  text: Keep falsehood and lying words far from me[a]; give me neither poverty nor riches[b]; feed me with the bread allotted to me.
translation:
  language: hi
  text: झूठ और छल की बातों को मुझसे दूर रख[a]; मुझे न निर्धनता दे, न धन-संपत्ति; मेरे हिस्से की रोटी मुझे खिला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठ और कपटपूर्ण बातों को।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव, “मेरे लिए नियत हिस्से की रोटी”; अन्य सम्भव अनुवाद, “मेरी प्रतिदिन की रोटी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁוְא
  choice: झूठ
  rationale: यहाँ समानांतर पदबंध ‘छल की बातें’ के साथ यह शब्द नैतिक और वाचिक असत्य को सूचित करता है; ‘झूठ’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: דְבַר כָּזָב
  choice: छल की बातें
  rationale: शाब्दिक अर्थ ‘झूठ/छल की बात’ है। हिन्दी में बहुवचन व्यापक प्रकार के कपटपूर्ण कथन को स्वाभाविक रूप से व्यक्त करता है और पहले शब्द के साथ अनावश्यक पुनरुक्ति से बचता है।
- source_word: הַרְחֵק מִמֶּנִּי
  choice: मुझसे दूर रख
  rationale: हिफ़ील आज्ञार्थक का कारक भाव ‘दूर कर/दूर रख’ है। प्रार्थना के संदर्भ में यह स्वाभाविक और अर्थनिष्ठ है।
- source_word: רֵאשׁ
  choice: निर्धनता
  rationale: यह संज्ञा गरीबी या अभाव की दशा बताती है। ‘निर्धनता’ स्पष्ट है और ‘धन-संपत्ति’ के साथ संतुलित विरोध बनाती है।
- source_word: עֹשֶׁר
  choice: धन-संपत्ति
  rationale: यह आर्थिक समृद्धि को दर्शाता है। ‘धन-संपत्ति’ आधुनिक हिन्दी में स्पष्ट है और निर्धनता के विपरीत अर्थ को ठीक से रखता है।
- source_word: אַל תִּתֶּן לִי
  choice: मुझे न ... दे, न ...
  rationale: एक ही निषेध निर्धनता और धन-संपत्ति दोनों पर लागू होता है; हिन्दी का ‘न ... न ...’ विन्यास इसे सहजता से व्यक्त करता है।
- source_word: הַטְרִיפֵנִי
  choice: मुझे खिला
  rationale: हिफ़ील रूप यहाँ भोजन उपलब्ध कराने या खिलाने का भाव रखता है। ‘मुझे खिला’ संक्षिप्त, प्रार्थनात्मक और स्वाभाविक है।
- source_word: לֶחֶם חֻקִּי
  choice: मेरे हिस्से की रोटी
  rationale: शाब्दिक भाव ‘मेरे नियत भाग की रोटी’ है। यह चयन रोटी के रूपक और निर्धारित हिस्से—दोनों को सहज हिन्दी में सुरक्षित रखता है; ‘प्रतिदिन की रोटी’ की बाद की प्रसिद्ध शब्दावली को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: לֶחֶם חֻקִּי में प्रावधान की प्रार्थना का अर्थ
  choice: अपने लिए नियत या उचित हिस्से के भोजन की याचना
  alternative: प्रतिदिन की रोटी
  rationale: निर्धनता और धन-संपत्ति दोनों से बचाने की याचना के बीच यह वाक्य पर्याप्त और संतुलित प्रावधान माँगता है। ‘मेरे हिस्से की’ मूल के नियत अंश को बनाए रखता है, पर इसे किसी विशिष्ट बाद की धार्मिक अभिव्यक्ति से नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण प्रार्थनात्मक हिन्दी में है। अर्धविराम मूल पद की तीन संबद्ध याचनाओं को स्पष्ट रखते हैं। ‘मेरे हिस्से की रोटी’ बोलचाल की सहजता और मूल के नियत भाग के भाव के बीच संतुलन रखता है।
