  text: A lizard you can catch with your hands[a], yet it is in kings’ palaces.
translation:
  language: hi
  text: छिपकली को तुम अपने हाथों से पकड़ सकते हो[a], फिर भी वह राजा के महलों में रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मकड़ी।’ इब्रानी शब्द שְׂמָמִית दुर्लभ है और इसका सटीक अर्थ अनिश्चित है। अनेक पारंपरिक अनुवादों में ‘मकड़ी’ है, जबकि अन्य इसे किसी प्रकार की छिपकली या गेको समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂמָמִית
  choice: छिपकली
  rationale: यह इब्रानी शब्द दुर्लभ है और इसका अर्थ अनिश्चित है। प्रसंग में दीवारों पर चढ़ने वाला छोटा सरीसृप स्वाभाविक बैठता है; ‘छिपकली’ आधुनिक हिन्दी में स्पष्ट है और ‘गेको’ जितनी विशिष्ट नहीं।
- source_word: בְּיָדַיִם
  choice: अपने हाथों से
  rationale: ב यहाँ साधन का बोध कराता है। ‘अपने हाथों से’ सहज हिन्दी है और मूल के ठोस चित्र को बनाए रखता है।
- source_word: תְּתַפֵּשׂ
  choice: तुम ... पकड़ सकते हो
  rationale: क्रिया द्वितीय पुरुष पुल्लिंग एकवचन में है और सामान्य श्रोता को संबोधित करती है। सम्भाव्यता सहित यह अभिव्यक्ति हिन्दी में पंक्ति का आशय और सजीवता स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְהִיא
  choice: फिर भी वह
  rationale: संयोजक और सर्वनाम यहाँ जीव की तुच्छ प्रतीत होने वाली स्थिति तथा राजमहलों में उसकी उपस्थिति के बीच विरोध उभारते हैं।
- source_word: בְּהֵיכְלֵי מֶלֶךְ
  choice: राजाओं के महलों में
  rationale: मूल का बहुवचन निर्माण सामान्य रूप से राजकीय निवासों का संकेत देता है। यह अनुवाद कहावत के सार्वकालिक भाव को बनाए रखता है।
