  text: עַ֤יִן תִּֽלְעַ֣ג לְ/אָב֮ וְ/תָב֪וּז לִֽ/יקֲּהַ֫ת אֵ֥ם יִקְּר֥וּ/הָ עֹרְבֵי נַ֑חַל וְֽ/יֹאכְל֥וּ/הָ בְנֵי נָֽשֶׁר׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/030/017.yaml
  text: The eye that mocks a father and despises obedience to a mother—the ravens of the valley will peck it out[c][b][a], and the young of the eagle will eat it.
translation:
  language: hi
  text: जो आँख पिता का उपहास करती है और माता की आज्ञा मानने को तुच्छ जानती है[a], उसे घाटी के कौए[b] नोच निकालेंगे, और उकाब के बच्चे[c] उसे खा जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘माता की शिक्षा/आज्ञा’; दुर्लभ हिब्रू शब्द का आशय संभवतः माता की बात मानने या उस पर ध्यान देने से है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘नखल के कौए’; ‘नखल’ का अर्थ घाटी, वादी, जलधारा या बरसाती नदी का तल हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू शब्द नेशेर उकाब या गिद्ध को सूचित कर सकता है; परंपरागत अनुवाद ‘उकाब’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: जो आँख
  rationale: एकवचन ‘आँख’ को लोकोक्तिपरक कर्ता के रूप में स्वाभाविक हिन्दी संबंधवाचक रचना ‘जो आँख’ से व्यक्त किया गया है।
- source_word: תִּלְעַג לְאָב
  choice: पिता का उपहास करती है
  rationale: לעג में उपहास और तिरस्कार का भाव है। हिब्रू में संबंधसूचक सर्वनाम नहीं है, इसलिए ‘अपने पिता’ जोड़ने के बजाय सामान्य ‘पिता’ रखा गया है।
- source_word: וְתָבוּז
  choice: और ... तुच्छ जानती है
  rationale: בוז का अर्थ तिरस्कार करना या तुच्छ समझना है; यह चयन पद के नैतिक और भावात्मक बल को बनाए रखता है।
- source_word: לִיקֲּהַת אֵם
  choice: माता की आज्ञा मानने को
  rationale: יקהת दुर्लभ और अर्थ की दृष्टि से विवादित संज्ञा है। प्रसंग में यह माता की बात मानने या उसके प्रति अपेक्षित आज्ञाकारिता को सूचित करती है; हिन्दी वाक्यांश इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִקְּרוּהָ
  choice: उसे ... नोच निकालेंगे
  rationale: נקר यहाँ पक्षियों द्वारा आँख निकाल देने की क्रिया बताता है। ‘नोच निकालेंगे’ चित्र की तीव्रता और परिणाम दोनों को स्पष्ट रखता है।
- source_word: עֹרְבֵי נַחַל
  choice: घाटी के कौए
  rationale: נחל घाटी, वादी अथवा बरसाती नदी की तलहटी का बोध करा सकता है। ‘घाटी’ सामान्य पाठक के लिए सहज है और स्थल-चित्र को बनाए रखता है।
- source_word: וְיֹאכְלוּהָ
  choice: उसे खा जाएँगे
  rationale: אכל का सामान्य अर्थ ‘खाना’ है; ‘खा जाएँगे’ हिन्दी में इस कठोर परिणाम को स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक तीव्रता जोड़े।
- source_word: בְנֵי נָשֶׁר
  choice: उकाब के बच्चे
  rationale: शाब्दिक रचना ‘נשר के बच्चे’ है। נשר उकाब या गिद्ध जैसे बड़े पक्षी को सूचित कर सकता है; मुख्य पाठ में पारंपरिक ‘उकाब’ रखा गया और विकल्प पादटिप्पणी में दिया गया है।
