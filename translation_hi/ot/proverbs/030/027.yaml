review_pass:
  verdict: revise
  source_fidelity: ‘राजा नहीं होता’ correctly conveys מֶלֶךְ אֵין לָאַרְבֶּה, and the plural ‘टिड्डियाँ/वे’ appropriately renders the collective אַרְבֶּה. ‘निकलती हैं’ reflects וַיֵּצֵא well. However, ‘दल बाँधकर’ can suggest forming a party or joining together, whereas חֹצֵץ more specifically retains the image of being divided/arranged in separate divisions.
  naturalness: The draft is fluent modern Hindi and has an appropriately concise proverbial register. ‘दलों में बँटकर’ is clearer and more idiomatic for the intended image than ‘दल बाँधकर’.
  terminology: ‘टिड्डियाँ’ and ‘राजा’ are accurate, natural choices. The revised phrasing preserves the source’s collective sense and the lexical ambiguity of חֹצֵץ without introducing an unnecessarily military sense.
  issues:
  - severity: medium
    issue: ‘दल बाँधकर’ is semantically imprecise for חֹצֵץ.
    rationale: In Hindi it may mean joining/forming a party, while the Hebrew participle is commonly understood as ‘divided’ or ‘in divisions.’ ‘दलों में बँटकर’ more directly communicates the relevant arrangement.
