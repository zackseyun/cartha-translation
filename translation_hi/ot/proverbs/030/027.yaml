  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली। सामूहिक हिब्रू एकवचन को स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है। ‘दल बाँधकर’ मूल के दुर्लभ חֹצֵץ में निहित विभाजन/व्यवस्था के भाव को बिना अनावश्यक सैन्य रंग दिए सुरक्षित रखता है।
