  yaml_path: translation/ot/proverbs/030/027.yaml
  text: The locusts have no king[a], yet all of them march out in ranks.
translation:
  language: hi
  text: 'टिड्डियों का कोई राजा नहीं होता,

    फिर भी वे सब दलों में बँटकर निकलती हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे सब विभाजित होकर निकलती हैं,” अर्थात् दलों या अलग-अलग समूहों में व्यवस्थित होकर।
    reason: חֹצֵץ के ‘विभाजित’/‘दलों में व्यवस्थित’ अर्थ की वैकल्पिक व्याख्या को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह संज्ञा सीधे राजा को दर्शाती है; पशु-जगत की इस तुलना में ‘राजा’ स्वाभाविक और सटीक है।
- source_word: אֵין לָאַרְבֶּה
  choice: टिड्डियों का कोई ... नहीं होता
  rationale: हिब्रू में अस्तित्व/अधिकार का यह प्रयोग स्वाभाविक हिन्दी में ‘टिड्डियों का कोई राजा नहीं होता’ के रूप में व्यक्त होता है।
- source_word: אַרְבֶּה
  choice: टिड्डियों
  rationale: रूप की दृष्टि से शब्द एकवचन है, पर यहाँ सामूहिक अर्थ रखता है; इसलिए हिन्दी में बहुवचन उपयुक्त है।
- source_word: וַיֵּצֵא
  choice: फिर भी ... निकलती हैं
  rationale: मूल का क्रिया-रूप सामूहिक एकवचन संज्ञा के अनुरूप है। हिन्दी में अर्थानुसार बहुवचन रखा गया है, और प्रसंग का विरोधाभास दिखाने के लिए ‘फिर भी’ प्रयुक्त है।
- source_word: חֹצֵץ
  choice: दल बाँधकर
  rationale: यह शब्द विभाजित अथवा व्यवस्थित समूहों में आगे बढ़ने का भाव देता है। ‘दल बाँधकर’ इस क्रमबद्ध सामूहिक गति को सहज हिन्दी में व्यक्त करता है।
- source_word: כֻּלּוֹ
  choice: वे सब
  rationale: एकवचन प्रत्यय सामूहिक ‘टिड्डी-दल’ की समग्रता बताता है; हिन्दी में ‘वे सब’ उसका स्वाभाविक अर्थ है।
