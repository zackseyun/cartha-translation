  yaml_path: translation/ot/proverbs/030/023.yaml
  text: under a hated woman when she is married[a], and a female servant when she inherits from her mistress.
translation:
  language: hi
  text: जिस स्त्री से घृणा की जाती है, उसके विवाह करने पर, और उस दासी के अपनी स्वामिनी का स्थान ले लेने पर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी स्वामिनी का उत्तराधिकार पाने पर।” इब्रानी क्रिया का सामान्य अर्थ ‘उत्तराधिकार पाना’ या ‘अधिकार में लेना’ है; यहाँ इसका आशय संभवतः स्वामिनी की जगह या हैसियत ले लेना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: के कारण
  rationale: पद 21–23 की सूची में यह उस परिस्थिति को बताता है जिसके कारण पृथ्वी काँपती है। शाब्दिक ‘के नीचे’ हिन्दी में अस्वाभाविक और अर्थ में अस्पष्ट होता; ‘के कारण’ प्रसंगगत भाव को स्पष्ट करता है।
- source_word: שְׂנוּאָה
  choice: जिससे घृणा की जाती है
  rationale: यह निष्क्रिय कृदन्त स्त्री के प्रति दूसरों की घृणा या अस्वीकृति को बताता है। यह ‘अप्रिय’ से अधिक सटीक है और यह संकेत नहीं देता कि वह घृणा की पात्र है।
- source_word: כִּי
  choice: जब
  rationale: दोनों उपवाक्यों में यह उस समय या परिस्थिति को प्रस्तुत करता है जिसमें स्थिति-परिवर्तन होता है।
- source_word: תִבָּעֵל
  choice: उसका विवाह हो जाए
  rationale: בעל के निफ़अल रूप में विवाहित होने या विवाह-संबंध में आने का भाव है। यह हिन्दी में स्वाभाविक ढंग से घटना और स्थिति-परिवर्तन दोनों व्यक्त करता है।
- source_word: שִׁפְחָה
  choice: दासी
  rationale: ‘दासी’ आधुनिक हिन्दी में संक्षिप्त और गरिमापूर्ण शब्द है, जो निम्न तथा पराधीन घरेलू स्थिति को व्यक्त करता है; केवल ‘नौकरानी’ कहने से बँधी हुई सामाजिक स्थिति धुंधली पड़ सकती है।
- source_word: תִירַשׁ
  choice: स्थान ले ले
  rationale: ירש सामान्यतः उत्तराधिकार पाने, अधिकार करने या किसी के स्थान/संपत्ति पर अधिकार पाने के लिए आता है। यहाँ स्वामिनी को सीधा कर्म बनाए जाने और सामाजिक उलटफेर के प्रसंग के कारण ‘स्थान ले ले’ स्वाभाविक है, जबकि पादटिप्पणी मूल की व्यापक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: גְּבִרְתָּהּ
  choice: अपनी स्वामिनी
  rationale: यह घर की वरिष्ठ स्त्री अथवा दासी की मालकिन को दर्शाता है। ‘स्वामिनी’ औपचारिक, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: स्त्री के प्रति घृणा और दासता का वर्णन
  choice: पद को सामाजिक परिस्थितियों और उनके उलटफेर के वर्णन के रूप में रखा गया है, न कि घृणा या दासता की स्वीकृति के रूप में।
  alternative: शब्दों को नरम करके ‘अप्रिय स्त्री’ और ‘नौकरानी’ कहना।
  rationale: मूल पाठ कठोर सामाजिक वास्तविकताओं का उल्लेख करता है। उन्हें नरम करना पाठ की तीव्रता घटाता, जबकि कोई नैतिक अनुमोदन जोड़ना भी मूल से आगे जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। पद 21–23 से जुड़े सूचीगत वाक्य-विन्यास को ध्यान में रखते हुए दोनों खंड समानांतर बनाए गए हैं।
