  text: When wickedness comes[a], contempt also comes, and with dishonor comes reproach.
translation:
  language: hi
  text: जब दुष्ट आता है, तिरस्कार भी आता है; और अपमान के साथ निंदा आती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא רָשָׁע
  choice: जब कोई दुष्ट आता है
  rationale: בְּ के साथ בוא का infinitive construct समयसूचक परिस्थिति व्यक्त करता है। רָשָׁע यहाँ एकवचन पुल्लिंग कर्ता के रूप में प्रयुक्त है, इसलिए इसे अमूर्त ‘दुष्टता’ के बजाय प्रतिनिधिक व्यक्ति ‘कोई दुष्ट’ के रूप में अनूदित किया गया है।
- source_word: בָּא גַם בּוּז
  choice: तो उसके साथ तिरस्कार भी आता है
  rationale: בָּא आरम्भ के בוא को दोहराता है और גַם साथ आने वाली बात जोड़ता है। हिन्दी में ‘उसके साथ’ निहित संबंध को स्वाभाविक रूप से स्पष्ट करता है, जबकि ‘भी आता है’ मूल की पुनरुक्ति बनाए रखता है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह सार्वजनिक अनादर या लज्जाजनक स्थिति को दर्शाता है। ‘अपमान’ आधुनिक हिन्दी में स्वाभाविक है और अगले शब्द से पर्याप्त भेद रखता है।
- source_word: חֶרְפָּה
  choice: निन्दा
  rationale: यह किसी पर आने वाली भर्त्सना, ताना या बदनामी का भाव रखता है। ‘निन्दा’ संबंधपरक और सार्वजनिक पक्ष को व्यक्त करती है तथा קָלוֹן से इसे अलग रखती है।
