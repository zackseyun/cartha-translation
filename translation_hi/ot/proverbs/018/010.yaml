source:
  edition: WLC
  text: מִגְדַּל עֹ֭ז שֵׁ֣ם יְהוָ֑ה בּֽ/וֹ יָר֖וּץ צַדִּ֣יק וְ/נִשְׂגָּֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/010.yaml
  text: The name of Yahweh is a strong tower[c][b][a]; the righteous runs into it and is set securely on high.
translation:
  language: hi
  text: याहवे[a] का नाम एक मज़बूत मीनार है; धर्मी उसमें दौड़ता है और ऊँचे स्थान पर सुरक्षित हो जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; परंपरागत रूप से ‘यहोवा’ और कई अनुवादों में ‘प्रभु’ कहा जाता है।'
    reason: alternative_reading
  - marker: b
    text: या, “और अगम्य ऊँचाई पर सुरक्षित रखा जाता है।” हिब्रू क्रिया ऊँचे, पहुँच से बाहर और इसलिए सुरक्षित होने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: दृढ़ गढ़
  rationale: शाब्दिक रूप से यह ‘सामर्थ्य का मीनार’ है, पर इस प्रसंग में ऊँचे रक्षात्मक ढाँचे और शरण—दोनों का बोध कराने के लिए ‘दृढ़ गढ़’ स्वाभाविक और सटीक हिंदी है।
- source_word: שֵׁם
  choice: नाम
  rationale: ‘नाम’ व्यक्ति के प्रकट चरित्र और प्रतिष्ठा का संकेत दे सकता है, फिर भी मूल रूपक और उसकी धर्मवैज्ञानिक गहराई बनाए रखने के लिए प्रत्यक्ष शब्द ‘नाम’ रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का विशिष्ट नाम YHWH है; उसे किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: בּוֹ
  choice: उसमें
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे निकट पूर्वपद रूपक का ‘गढ़’ है; इसलिए हिंदी में स्थानगत आश्रय का स्वाभाविक भाव ‘उसमें’ से व्यक्त होता है।
- source_word: יָרוּץ
  choice: दौड़कर जाता है
  rationale: क्रिया का मूल अर्थ ‘दौड़ना’ है। ‘दौड़कर जाता है’ शरण की ओर तत्काल गति का ठोस चित्र बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: मूल में विशेषण संज्ञा के रूप में पुल्लिंग एकवचन है और नीतिवचन में प्रतिनिधिक अर्थ रखता है। हिंदी ‘धर्मी’ व्यक्ति-सूचक अर्थ देते हुए अनावश्यक रूप से ‘पुरुष’ नहीं जोड़ता।
- source_word: וְנִשְׂגָּב
  choice: और ऊँचे सुरक्षित स्थान पर पहुँच जाता है
  rationale: निफ़अल रूप ऊँचा, पहुँच से बाहर और फलतः सुरक्षित किए जाने का भाव देता है। यह अनुवाद ऊँचाई तथा सुरक्षा दोनों को बनाए रखता है; कर्मवाच्य की अपेक्षा हिंदी में अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ विशिष्ट ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है; पाठकों के लिए परंपरागत विकल्प पादटिप्पणी में दिए गए हैं।
- issue: צַדִּיק का लिंग और प्रतिनिधिक बल
  choice: धर्मी
  alternative: धर्मी पुरुष; धर्मी जन
  rationale: हिब्रू रूप व्याकरणतः पुल्लिंग एकवचन है, पर नीतिवचन में प्रतिनिधिक है। ‘धर्मी’ एकवचन व्यक्ति का भाव सुरक्षित रखता है और मूल में न पाए जाने वाले ‘पुरुष’ को नहीं जोड़ता।
- issue: נִשְׂגָּב में ऊँचाई और सुरक्षा का संबंध
  choice: ऊँचे सुरक्षित स्थान पर पहुँच जाता है
  alternative: सुरक्षित रहता है; अगम्य ऊँचाई पर रखा जाता है
  rationale: क्रिया केवल सामान्य सुरक्षा नहीं, बल्कि ऊँचा और पहुँच से बाहर होने की छवि रखती है। चुना हुआ पाठ दोनों अर्थों को जोड़ता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘दृढ़ गढ़’ सामान्य पाठक के लिए रक्षात्मक रूपक को स्पष्ट करता है। अर्धविराम मूल की दो संतुलित पंक्तियों का संबंध दिखाता है।
