  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פִּֽי כְ֭סִיל מְחִתָּה ל֑/וֹ וּ֝/שְׂפָתָ֗י/ו מוֹקֵ֥שׁ נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/007.yaml
  text: A fool’s mouth is his ruin[b][a], and his lips are a snare to his life.
translation:
  language: hi
  text: 'मूर्ख का मुँह उसके लिए विनाश[a] है,

    और उसके होंठ उसके जीवन[b] के लिए फंदा हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख का मुँह उसी का विनाश है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उसके प्राण”; यहाँ अर्थ संभवतः “उसका जीवन” या “वह स्वयं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: मुँह
  rationale: शाब्दिक देह-अंग की छवि को बनाए रखता है और यहाँ वाणी के स्रोत को दर्शाता है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाला व्यक्ति नहीं, बल्कि नैतिक और व्यावहारिक विवेक से रहित व्यक्ति के लिए मानक ज्ञान-साहित्य संबंधी शब्द है।
- source_word: מְחִתָּה
  choice: विनाश
  rationale: इस संदर्भ में यह उस बर्बादी या विनाश को बताता है जो मूर्ख की अपनी वाणी उस पर लाती है; ‘भय’ या ‘घबराहट’ समानांतर पंक्ति के ‘फंदा’ से कम मेल खाते हैं।
- source_word: לוֹ
  choice: उसके लिए
  rationale: इब्रानी संबंधवाचक संरचना को स्पष्ट रखते हुए यह बताता है कि विनाश स्वयं मूर्ख पर आता है; इसे केवल अधिकारसूचक ‘उसका विनाश’ बनाकर निहित संबंध को सीमित नहीं किया गया।
- source_word: וּשְׂפָתָיו
  choice: और उसके होंठ
  rationale: ‘मुँह’ के साथ देह-अंग की ठोस छवि और काव्यात्मक समानांतरता दोनों सुरक्षित रहती हैं।
- source_word: מוֹקֵשׁ
  choice: फंदा
  rationale: ज्ञान-साहित्य में यह उस जाल की सजीव और स्वाभाविक छवि देता है जिसमें व्यक्ति फँसकर हानि उठाता है।
- source_word: נַפְשׁוֹ
  choice: उसके जीवन
  rationale: यहाँ נֶפֶשׁ संभवतः व्यक्ति के जीवन या स्वयं उस व्यक्ति को सूचित करता है, न कि अनिवार्य रूप से देह से अलग किसी अमूर्त आत्मा को। ‘जीवन’ आधुनिक हिन्दी में आशय को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
