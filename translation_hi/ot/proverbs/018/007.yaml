  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘मुँह’, ‘होंठ’ और ‘फंदा’ की ठोस इब्रानी छवियाँ सुरक्षित हैं; पंक्तियों का समानांतर काव्य-विन्यास भी बनाए रखा गया है।
