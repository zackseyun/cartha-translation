reference: Proverbs 18:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַ֣יִם עֲ֭מֻקִּים דִּבְרֵ֣י פִי אִ֑ישׁ נַ֥חַל נֹ֝בֵ֗עַ מְק֣וֹר חָכְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/004.yaml
  text: The words of a man's mouth are deep waters[b][a]; the fountain of wisdom is a flowing brook.
translation:
  language: hi
  text: मनुष्य के मुँह के वचन गहरे जल हैं[b][a]; बुद्धि का सोता बहती धारा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के मुँह के वचन गहरे जल, बहती धारा और बुद्धि का सोता हैं।” इब्रानी को इस प्रकार भी समझा जा सकता है कि जल के दोनों बिंब वचनों का ही वर्णन करते हैं, न कि दूसरी पंक्ति बुद्धि के विषय में अलग कथन हो।
    reason: alternative_reading
  - marker: b
    text: यहाँ “मनुष्य” के लिए इब्रानी में אִישׁ है, जो पुल्लिंग एकवचन शब्द है और नीतिवचन की शैली में किसी एक व्यक्ति के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם עֲמֻקִּים
  choice: गहरे जल
  rationale: यह अनुवाद ठोस जल-रूपक को बनाए रखता है और उसके आलंकारिक अर्थ को पहले से ‘गूढ़’ कहकर सीमित नहीं करता।
- source_word: דִּבְרֵי
  choice: वचन
  rationale: यहाँ बहुवचन संज्ञा व्यक्ति के मुँह से निकली बातों को दर्शाती है; ‘वचन’ काव्यात्मक और गरिमापूर्ण होते हुए भी आधुनिक हिन्दी में बोधगम्य है।
- source_word: פִי אִישׁ
  choice: मनुष्य के मुँह के
  rationale: इब्रानी में אִישׁ पुल्लिंग एकवचन है और नीतिवचन की शैली में एक व्यक्ति को सूचित करता है; ‘मनुष्य’ उसके सामान्य मानवीय प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल रूप की जानकारी देती है।
- source_word: נַחַל נֹבֵעַ
  choice: बहती धारा
  rationale: נַחַל जलधारा को और נֹבֵעַ उसके उमड़ने या बहने को व्यक्त करता है; यह पदबंध गतिशील जल-बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: מְקוֹר חָכְמָה
  choice: बुद्धि का सोता
  rationale: מְקוֹר किसी स्रोत या झरने को सूचित करता है; ‘सोता’ पानी के उद्गम का सजीव रूपक बनाए रखता है और ‘धारा’ के साथ स्वाभाविक समानांतर बनाता है।
theological_decisions:
- issue: दोनों अर्धपंक्तियों का वाक्य-संबंध
  choice: पहली अर्धपंक्ति को मनुष्य के वचनों का कथन और दूसरी को बुद्धि के सोते का अलग समानांतर कथन माना गया है।
  alternative: दोनों जल-बिंबों—‘गहरे जल’ और ‘बहती धारा, बुद्धि का सोता’—को मनुष्य के मुँह के वचनों का वर्णन माना जा सकता है।
  rationale: इब्रानी काव्य में स्पष्ट संयोजक और व्यक्त क्रिया का अभाव दोनों संरचनाओं की अनुमति देता है; मुख्य पाठ सामान्य समानांतर पठन अपनाता है और पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘गहरे जल’, ‘सोता’ और ‘बहती धारा’ मूल के परस्पर जुड़े जल-बिंबों को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में रखे गए हैं।
