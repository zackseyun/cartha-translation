  yaml_path: translation/ot/proverbs/018/019.yaml
  text: A brother offended is harder to win than a fortified city[b][a], and quarrels are like the bars of a citadel.
translation:
  language: hi
  text: जिस भाई को ठेस पहुँची हो, उसे मनाना एक दृढ़ नगर को जीतने से भी कठिन है[a]; और झगड़े गढ़ के द्वार की अर्गला के समान हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस भाई के साथ अन्याय हुआ हो, उसे मनाना एक दृढ़ नगर को जीतने से भी कठिन है।” इब्रानी शब्द उस व्यक्ति का बोध करा सकता है जिसे ठेस पहुँची हो या जिसके साथ अन्याय हुआ हो। वाक्य में ‘मनाना’ और ‘जीतना’ जैसी क्रियाएँ निहित हैं, स्पष्ट रूप से लिखी नहीं हैं।
    reason: lexical_and_ellipsis_alternative
  - marker: b
    text: या, “और विवाद महल के द्वार की अर्गला के समान हैं।” इब्रानी का अंतिम शब्द ‘गढ़/दुर्ग’ या ‘महल’ दोनों को दर्शा सकता है; निकटवर्ती रक्षात्मक बिंब के कारण मुख्य पाठ में ‘गढ़’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: भाई
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है; यह सगे भाई या निकट संबंध वाले व्यक्ति का बोध करा सकता है। मुख्य पाठ में इब्रानी बिंब को बनाए रखा गया है।
- source_word: נִפְשָׁע
  choice: जिस भाई को ठेस पहुँची हो
  rationale: यह रूप संबंध में चोट खाए या जिसके विरुद्ध अपराध हुआ हो ऐसे व्यक्ति की ओर संकेत कर सकता है। ‘ठेस पहुँची हो’ आधुनिक हिन्दी में संबंध-विच्छेद का भाव स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘अन्याय हुआ हो’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: מִקִּרְיַת עֹז
  choice: गढ़वाले नगर को जीतने से भी कठिन
  rationale: शाब्दिक बिंब ‘सुदृढ़/गढ़वाला नगर’ है। इब्रानी वाक्य संक्षिप्त और क्रियारहित है; हिन्दी में तुलना स्पष्ट करने के लिए ‘जीतने से भी कठिन’ जोड़ा गया है, जो नगर की दुर्गमता और संबंध की कठिन पुनर्स्थापना को व्यक्त करता है।
- source_word: וּמְדֹנִים
  choice: और झगड़े
  rationale: बहुवचन संज्ञा का अर्थ कलह, विवाद या झगड़े है। ‘झगड़े’ सरल, समकालीन और नीतिवचन की शैली के अनुकूल है।
- source_word: כִּבְרִיחַ
  choice: फाटक की आड़ी शहतीर के समान
  rationale: בְּרִיחַ उस मोटे आड़े डंडे या शहतीर को दर्शाता है जिससे बड़े फाटक को भीतर से बंद किया जाता था। यह अनुवाद आधुनिक पाठक के लिए वस्तु और उसके अवरोधक कार्य को स्पष्ट करता है।
- source_word: אַרְמוֹן
  choice: गढ़
  rationale: यह शब्द ‘महल’ या ‘गढ़/दुर्ग’ दोनों अर्थ दे सकता है। निकटवर्ती ‘गढ़वाले नगर’ और फाटक बंद करने वाली शहतीर के रक्षात्मक बिंब के कारण मुख्य पाठ में ‘गढ़’ चुना गया है।
