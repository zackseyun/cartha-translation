  yaml_path: translation/ot/proverbs/018/018.yaml
  text: The lot puts an end to disputes[a], and separates between the mighty.
translation:
  language: hi
  text: निर्णय के लिए चिट्ठी डालना विवादों को समाप्त कर देता है, और बलवानों के बीच अलगाव कर देता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चिट्ठी विवादों का निपटारा करती है और बलवानों के बीच फैसला कर देती है।”
    reason: शब्दार्थ और संदर्भगत वैकल्पिक अनुवाद
lexical_decisions:
- source_word: מִדְיָנִים
  choice: विवादों
  rationale: बहुवचन संज्ञा आपसी झगड़ों और न्यायिक विवादों, दोनों को व्यक्त कर सकती है; ‘विवादों’ आधुनिक हिंदी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: יַשְׁבִּית
  choice: समाप्त कर देती है
  rationale: שבת के हिफ़ील रूप का कारक अर्थ ‘रुकवा देना/समाप्त कर देना’ है; यह अनुवाद उस अर्थ को स्पष्ट और सहज रखता है।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: גורל निर्णय के लिए डाली जाने वाली चिट्ठी को दर्शाता है। ‘चिट्ठी’ संक्षिप्त है और नीतिवचन की सूक्तिपरक शैली के अनुकूल है।
- source_word: וּבֵין
  choice: और ... के बीच
  rationale: בין संबंधित पक्षों के बीच के संबंध को स्पष्ट करता है; हिंदी में ‘के बीच’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲצוּמִים
  choice: शक्तिशाली लोगों
  rationale: यह विशेषण बलवान या प्रभावशाली व्यक्तियों को दर्शाता है। हिंदी में संज्ञात्मक प्रयोग स्पष्ट करने के लिए ‘लोगों’ जोड़ा गया है, बिना लिंग को अनावश्यक रूप से सीमित किए।
- source_word: יַפְרִיד
  choice: अलगाव करा देती है
  rationale: פרד के हिफ़ील का मूल अर्थ ‘अलग करना’ है। ‘अलगाव करा देती है’ उस ठोस चित्र को बचाता है और चिट्ठी द्वारा विरोधी पक्षों को अलग करने का भाव व्यक्त करता है।
theological_decisions:
- issue: क्या יַפְרִיד को न्यायिक अर्थ में ‘फैसला करती है’ कहा जाए या मूल ठोस अर्थ ‘अलग करती है’ रखा जाए?
  choice: अलगाव करा देती है
  alternative: फैसला कर देती है
  rationale: संदर्भ में निर्णय का भाव संभव है, पर क्रिया का मूल अर्थ ‘अलग करना’ है। मुख्य पाठ में इस ठोस अर्थ को रखा गया है और पादटिप्पणी में अधिक व्याख्यात्मक न्यायिक विकल्प दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘चिट्ठी’ बाइबिलीय निर्णय-पद्धति को संक्षेप में व्यक्त करती है; पादटिप्पणी मुख्य पाठ के ठोस ‘अलग करने’ के भाव के साथ संभावित न्यायिक अर्थ भी दिखाती है।
