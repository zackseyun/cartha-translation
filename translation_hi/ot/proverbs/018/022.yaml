base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/022.yaml
  text: He who finds a wife finds a good thing and obtains favor from Yahweh[a].
translation:
  language: hi
  text: जो पत्नी पाता है, वह भलाई पाता है और यहोवा[a] से कृपा प्राप्त करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईश्वरीय नाम יהוה को यहाँ ‘यहोवा’ लिखा गया है; इसे ‘याहवे’ भी लिखा जाता है।
    reason: divine_name_transliteration
lexical_decisions:
- source_word: מָצָא
  choice: पाई
  rationale: नीतिवचन की शैली में पूर्ण क्रिया सामान्य और स्थायी सत्य व्यक्त करती है। हिंदी में दोहराया गया भूतकालीन रूप मूल की संरचना और सूक्तिपरक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: אִשָּׁה
  choice: पत्नी
  rationale: इस वैवाहिक संदर्भ में शब्द का अर्थ सामान्यतः ‘स्त्री’ नहीं, बल्कि ‘पत्नी’ है।
- source_word: טוֹב
  choice: अच्छी वस्तु
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है। ‘अच्छी वस्तु’ मूल के संक्षिप्त और अनिश्चित भाव को बनाए रखता है; इसका आशय पत्नी को वस्तु ठहराना नहीं, बल्कि पत्नी पाने को भलाई बताना है।
- source_word: וַיָּפֶק
  choice: प्राप्त की
  rationale: यहाँ क्रिया का अर्थ पाना अथवा प्राप्त करना है। ‘प्राप्त की’ हिंदी में स्वाभाविक है और ‘कृपा’ के साथ उपयुक्त बैठता है।
- source_word: רָצוֹן
  choice: कृपा
  rationale: यहोवा के संबंध में यह शब्द अनुग्रह, प्रसन्नता या सद्भाव को व्यक्त करता है। ‘कृपा’ संक्षिप्त, परिचित और धर्मवैचारिक रूप से तटस्थ है।
- source_word: מֵיְהוָה
  choice: यहोवा से
  rationale: מִן स्रोत को ‘से’ व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: implicit masculine singular subject of מָצָא
  choice: जिसने
  rationale: हिब्रू में कर्ता पुल्लिंग एकवचन है, पर स्पष्ट सर्वनाम नहीं है। ‘जिसने पत्नी पाई’ हिंदी में स्वाभाविक है, पुरुष कर्ता को वैवाहिक संदर्भ से स्पष्ट रखता है और अनावश्यक रूप से ‘वह पुरुष’ जोड़ने से बचता है।
theological_decisions:
- issue: सूक्तिपरक पुल्लिंग एकवचन कर्ता का अनुवाद
  choice: जिसने पत्नी पाई
  alternative: जो कोई पत्नी पाता है / जिस पुरुष ने पत्नी पाई
  rationale: मूल में निहित कर्ता पुल्लिंग एकवचन है और कथन सूक्तिपरक प्रतिनिधि रूप में है। चुना हुआ हिंदी वाक्य मूल के पुरुष-विषयक वैवाहिक रूप को संदर्भ से स्पष्ट रखता है, बिना उसके सामान्य नीतिवचन-संबंधी बल को सीमित किए।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता। पादटिप्पणी वैकल्पिक विद्वत्तापूर्ण उच्चारण बताती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। मूल की दोहरावयुक्त सूक्तिपरक रचना—‘पाई ... पाई’—को सुरक्षित रखा गया है। ‘अच्छी वस्तु’ औपचारिक निकटता देता है; सामान्य पाठक के लिए इसका अभिप्राय संदर्भ से पत्नी पाने की भलाई है।
