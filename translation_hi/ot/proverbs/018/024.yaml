source:
  edition: WLC
  text: אִ֣ישׁ רֵ֭עִים לְ/הִתְרֹעֵ֑עַ וְ/יֵ֥שׁ אֹ֝הֵ֗ב דָּבֵ֥ק מֵ/אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/024.yaml
  text: A man of many companions may come to ruin[a], but there is a friend who sticks closer than a brother.
translation:
  language: hi
  text: बहुत-से साथियों वाला मनुष्य बरबाद हो सकता है[a], पर ऐसा भी मित्र होता है जो भाई से भी अधिक निकट रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस मनुष्य के बहुत मित्र हों, उसे स्वयं भी मित्रवत होना चाहिए।” हिब्रू क्रिया לְהִתְרֹעֵעַ कठिन है और उसके एक से अधिक अर्थ लिए गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: मनुष्य
  rationale: हिब्रू में पुल्लिंग एकवचन है, पर नीति-वचन का आशय सामान्य मानवीय अनुभव है; आधुनिक मानक हिन्दी में ‘मनुष्य’ इसे स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: רֵעִים
  choice: साथियों
  rationale: यह शब्द मित्रों, साथियों या परिचित सहयोगियों को सूचित कर सकता है। ‘साथियों’ रखने से दूसरे खंड के अधिक गहरे और निष्ठावान ‘मित्र’ के साथ अंतर बना रहता है।
- source_word: לְהִתְרֹעֵעַ
  choice: बरबादी में पड़ सकता है
  rationale: यह कठिन क्रियारूप संभवतः टूटने या नाश में पड़ने का भाव देता है; ‘सकता है’ नीतिवचन की चेतावनी व्यक्त करता है, पर परिणाम को अनिवार्य नहीं बनाता। मित्रवत व्यवहार दिखाने वाला वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְיֵשׁ
  choice: पर ऐसा भी ... होता है
  rationale: संयोजक यहाँ बहुत से सतही साथियों और एक निष्ठावान मित्र के बीच विरोध प्रकट करता है।
- source_word: אֹהֵב
  choice: मित्र
  rationale: शाब्दिक भाव ‘प्रेम करने वाला’ है, पर इस ज्ञान-साहित्यिक संदर्भ में ‘मित्र’ स्वाभाविक है और अगले पदबंध से उसकी निष्ठा स्पष्ट होती है।
- source_word: דָּבֵק
  choice: जुड़ा रहता है
  rationale: यह कृदंत दृढ़ता से लगे रहने, चिपके रहने या निकट बने रहने का चित्र देता है। ‘जुड़ा रहता है’ हिन्दी में संबंधपरक निष्ठा को सहज रूप में व्यक्त करता है।
- source_word: מֵאָח
  choice: भाई से बढ़कर
  rationale: तुलनात्मक מִן यहाँ निकटता या निष्ठा में भाई से भी आगे होने का भाव देता है।
theological_decisions:
- issue: क्या ‘मित्र’ को किसी विशिष्ट मसीही या ईश्वरीय व्यक्ति की ओर संकेत मानकर अनूदित किया जाए
  choice: सामान्य मानवीय मित्र के रूप में अनुवाद
  alternative: इसे किसी विशिष्ट धर्मशास्त्रीय व्यक्ति का संकेत मानना
  rationale: हिब्रू पाठ स्वयं किसी विशिष्ट व्यक्ति की पहचान नहीं करता; इसलिए नीतिवचन की सामान्य संबंधपरक बात को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और नीतिवचन-संगत रूप अपनाया गया है। ‘साथियों’ और ‘मित्र’ के भेद से अनेक सामान्य संबंधों और एक निष्ठावान संबंध का विरोध सुरक्षित रखा गया है।
