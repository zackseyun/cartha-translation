  text: To show partiality to the wicked is not good[b][a], nor to deprive the righteous of justice.
translation:
  language: hi
  text: दुष्ट के प्रति पक्षपात करना अच्छा नहीं, और न न्याय में धर्मी के साथ अन्याय करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂאֵת פְּנֵי
  choice: पक्ष लेना
  rationale: शाब्दिक अर्थ ‘चेहरा उठाना’ है, पर न्यायिक संदर्भ में यह किसी के प्रति पक्षपात या कृपा दिखाने का मुहावरा है। ‘पक्ष लेना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘दुष्ट’ नैतिक श्रेणी को बनाए रखता है और इसे केवल कानूनी दोष तक सीमित नहीं करता।
- source_word: לֹא טוֹב
  choice: अच्छा नहीं
  rationale: यह इब्रानी के सीधे नैतिक मूल्यांकन को सरल और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְהַטּוֹת
  choice: अधिकार से वंचित करना
  rationale: क्रिया का मूल अर्थ ‘मोड़ना/हटा देना’ है; न्यायिक संदर्भ में आशय किसी व्यक्ति के विरुद्ध निर्णय को मोड़कर उसे उचित न्याय न देना है। इस प्रभाव को हिन्दी में स्पष्ट करने के लिए यह प्रयोग चुना गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह शब्द नैतिक रूप से धर्मी अथवा मुकदमे में सही पक्ष पर खड़े व्यक्ति—दोनों अर्थों को धारण कर सकता है। ‘धर्मी’ इस व्यापकता को बनाए रखता है।
- source_word: בַּמִּשְׁפָּט
  choice: न्याय में
  rationale: यह न्यायिक निर्णय या न्याय-प्रक्रिया का संकेत देता है। ‘न्याय में’ स्रोत के संक्षिप्त और कुछ हद तक व्यापक भाव को सुरक्षित रखता है, बिना ‘अदालत’ को स्पष्ट रूप से जोड़ने के।
