base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/011.yaml
  text: A rich man's wealth is his strong city[a], and like a high wall in his imagination.
translation:
  language: hi
  text: 'धनी का धन उसका सुदृढ़ नगर है,

    और उसकी कल्पना[a] में वह ऊँची दीवार के समान है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके मन में” अथवा “उसकी दृष्टि में।” इब्रानी शब्द किसी मानसिक छवि या देखने-समझने के ढंग को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: धन
  rationale: यह शब्द भौतिक संपत्ति या धन-दौलत को दर्शाता है; सामान्य नीति-वचन में ‘धन’ स्वाभाविक और व्यापक है।
- source_word: עָשִׁיר
  choice: धनी का
  rationale: विशेषण यहाँ संज्ञा के रूप में एक धनी व्यक्ति के लिए प्रयुक्त हुआ है; हिन्दी में ‘धनी का’ मूल के पुल्लिंग एकवचन और सामान्य कथन, दोनों को सहज रूप से रखता है।
- source_word: קִרְיַת עֻזּוֹ
  choice: उसका सुदृढ़ नगर
  rationale: शाब्दिक भाव ‘उसकी सामर्थ्य का नगर’ है। ‘सुदृढ़ नगर’ किलेबंद और सुरक्षित नगर का रूपक स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: וּכְחוֹמָה נִשְׂגָּבָה
  choice: और … ऊँची दीवार के समान
  rationale: נִשְׂגָּבָה ऊँचाई के साथ पहुँच से बाहर या सुरक्षित होने का संकेत दे सकता है; ‘ऊँची दीवार’ मूल बिंब को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- source_word: בְּמַשְׂכִּיתוֹ
  choice: उसकी कल्पना में
  rationale: यह पद किसी छवि, मानसिक चित्र या देखने-समझने के ढंग को सूचित कर सकता है। ‘कल्पना में’ धन से मिलने वाली सुरक्षा की व्यक्तिनिष्ठ धारणा को व्यक्त करता है, जबकि नकारात्मक ‘घमंड’ जैसा भाव अनावश्यक रूप से नहीं जोड़ता।
