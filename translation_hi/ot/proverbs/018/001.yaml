source:
  edition: WLC
  text: לְֽ֭/תַאֲוָה יְבַקֵּ֣שׁ נִפְרָ֑ד בְּ/כָל תּ֝וּשִׁיָּ֗ה יִתְגַּלָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/001.yaml
  text: Whoever isolates himself seeks his own desire[b][a]; he breaks out against all sound judgment.
translation:
  language: hi
  text: जो दूसरों से अलग-थलग रहता है, वह अपनी ही इच्छा पूरी करने के पीछे रहता है; वह हर खरी बुद्धि के विरुद्ध भड़क उठता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन इब्रानी पंक्ति का अनुवाद यह भी हो सकता है: “जो अपने को अलग करता है, वह इच्छा की खोज करता है; वह सारी खरी बुद्धि से झगड़ता है।” दूसरी पंक्ति की दुर्लभ क्रिया का अर्थ विशेष रूप से अनिश्चित है।'
    reason: alternative_reading
  - marker: b
    text: “खरी बुद्धि” का अनुवाद “सही विवेक” या “व्यावहारिक समझ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְתַאֲוָה
  choice: अपनी ही इच्छा पूरी करना
  rationale: תַּאֲוָה इच्छा, लालसा या अभिलाषा को दर्शाता है। לְ उद्देश्य या प्रेरणा बता सकता है; सन्दर्भ में आत्मकेंद्रित भाव निहित है, जिसे ‘अपनी ही’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְבַקֵּשׁ
  choice: चाहता है
  rationale: בקש का मूल अर्थ ‘ढूँढ़ना/खोजना’ या ‘प्राप्त करने का प्रयत्न करना’ है। ‘पूरी करना चाहता है’ हिन्दी में इच्छा को साधने का भाव स्वाभाविक ढंग से देता है।
- source_word: נִפְרָד
  choice: जो दूसरों से अलग-थलग रहता है
  rationale: פרד का निफ़अल कृदन्त अलग हुए या अपने को अलग करने वाले व्यक्ति को सूचित करता है। यह वाक्यांश सामान्य नीतिवचनात्मक कथन और समुदाय से दूरी—दोनों को स्पष्ट रखता है।
- source_word: בְּכָל
  choice: हर ... के विरुद्ध
  rationale: इस संक्षिप्त काव्य-पंक्ति में בְ का सम्बन्ध कठिन है। अगले दुर्लभ क्रिया-रूप के साथ विरोधात्मक अर्थ सन्दर्भानुकूल है।
- source_word: תּוּשִׁיָּה
  choice: खरी बुद्धि
  rationale: ज्ञान-साहित्य में תּוּשִׁיָּה ठोस, व्यावहारिक और सही बुद्धि या विवेक को दर्शा सकता है। ‘खरी बुद्धि’ संक्षिप्त और गरिमापूर्ण है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: יִתְגַּלָּע
  choice: भड़क उठता है
  rationale: यह दुर्लभ हित्पअेल रूप अर्थ की दृष्टि से अनिश्चित है। ‘भड़क उठता है’ विरोध में उग्रतापूर्वक फूट पड़ने का सम्भावित भाव व्यक्त करता है, पर निश्चित अर्थ का दावा नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। इब्रानी की संक्षिप्तता को यथासम्भव बचाते हुए अस्पष्ट दुर्लभ क्रिया तथा תּוּשִׁיָּה के अर्थ-विकल्प पादटिप्पणियों में सुरक्षित रखे गए हैं।
