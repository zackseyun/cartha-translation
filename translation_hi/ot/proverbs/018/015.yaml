  text: לֵ֣ב נָ֭בוֹן יִקְנֶה דָּ֑עַת וְ/אֹ֥זֶן חֲ֝כָמִ֗ים תְּבַקֶּשׁ דָּֽעַת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/015.yaml
  text: An understanding heart acquires knowledge[b][a], and the ear of the wise seeks knowledge.
translation:
  language: hi
  text: 'समझदार हृदय ज्ञान अर्जित करता है,

    और बुद्धिमानों का कान ज्ञान की खोज करता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बुद्धिमानों का कान’ एक रूपक है, जिसका अर्थ शिक्षा को ध्यान से सुनने और ग्रहण करने की तत्परता है।
    reason: cultural_note
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: हिब्रू ज्ञान-साहित्य में यह विचार, विवेक और इच्छा के भीतरी केंद्र को दर्शाता है। ‘हृदय’ मूल रूपक को बनाए रखता है और हिंदी में गरिमापूर्ण तथा बोधगम्य है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: यह विशेषण सूझ-बूझ और विवेक रखने वाले हृदय का वर्णन करता है; ‘समझदार हृदय’ स्वाभाविक हिंदी है।
- source_word: יִקְנֶה
  choice: अर्जित करता है
  rationale: यहाँ क्रिया का अर्थ जान-बूझकर प्राप्त करना है। ‘अर्जित करता है’ व्यापारिक अर्थ से बचते हुए सक्रिय प्राप्ति व्यक्त करता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: नीतिवचन में यह सीखी और समझी हुई जानकारी को दर्शाता है। दोनों पंक्तियों में ‘ज्ञान’ की पुनरावृत्ति मूल समानांतरता को सुरक्षित रखती है।
- source_word: אֹזֶן
  choice: कान
  rationale: मूल का एकवचन शारीरिक रूपक शिक्षा सुनने और ग्रहण करने की तत्परता को व्यक्त करता है; इसे बनाए रखा गया है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: पुल्लिंग बहुवचन यहाँ सामान्य प्रतिनिधिक अर्थ में है। ‘बुद्धिमानों’ किसी एक लिंग तक अर्थ को सीमित किए बिना स्वाभाविक संबंध-रचना देता है।
- source_word: תְּבַקֶּשׁ
  choice: खोज करता है
  rationale: यह सक्रिय और सतत चाह तथा तलाश को व्यक्त करता है और ज्ञान पाने की जान-बूझकर की जाने वाली चेष्टा को स्पष्ट रखता है।
