base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/016.yaml
  text: A man's gift makes room for him[b][a], and brings him before great men.
translation:
  language: hi
  text: मनुष्य की भेंट उसके लिए रास्ता खोल देती है[a], और उसे बड़े लोगों के सामने पहुँचा देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके लिए जगह चौड़ी कर देती है”; भावार्थ, उसके लिए अवसर या पहुँच का मार्ग खोल देती है।
    reason: literal_metaphor
  - marker: b
    text: या, “और उसे बड़े लोगों के सामने ले जाती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: भेंट
  rationale: यह संज्ञा दी जाने वाली वस्तु, उपहार या भेंट को दर्शाती है। यहाँ “भेंट” आधुनिक हिन्दी में स्वाभाविक है और नीतिवचन के सामान्य कथन के अनुकूल है।
- source_word: אָדָם
  choice: मनुष्य की
  rationale: यहाँ एकवचन रूप सामान्य रूप से किसी भी व्यक्ति को सूचित करता है। “मनुष्य” मूल के रूप को बनाए रखते हुए हिन्दी में सामान्य मानवीय संदर्भ देता है।
- source_word: יַרְחִיב לוֹ
  choice: उसके लिए रास्ता खोल देती है
  rationale: רחב के हिफ़ील का मूल भाव “चौड़ा करना” है। हिन्दी में “रास्ता खोल देना” उसी स्थान या पहुँच मिलने के रूपक को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְלִפְנֵי גְדֹלִים
  choice: बड़े लोगों के सामने
  rationale: לִפְנֵי का अर्थ “सामने/उपस्थिति में” और גְדֹלִים का आशय ऊँचे पद, प्रभाव या प्रतिष्ठा वाले लोगों से है। “बड़े लोग” संक्षिप्त है और मूल की सामाजिक व्यापकता को बनाए रखता है।
- source_word: יַנְחֶנּוּ
  choice: उसे ... पहुँचा देती है
  rationale: נחה के हिफ़ील का सामान्य अर्थ “ले जाना/मार्ग दिखाना” है। इस प्रसंग में “पहुँचा देती है” प्रभावशाली लोगों की उपस्थिति तक पहुँचने के परिणाम को सहज हिन्दी में व्यक्त करता है।
