  text: A fool’s lips enter into strife[b][a], and his mouth calls for blows.
translation:
  language: hi
  text: 'मूर्ख के होंठ झगड़े में पड़ते हैं,

    और उसका मुँह मार खाने को बुलाता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׂפְתֵי
  choice: होंठ
  rationale: शाब्दिक और सजीव रूपक को बनाए रखता है तथा दूसरी पंक्ति के ‘मुँह’ के साथ काव्यात्मक समानांतरता सुरक्षित करता है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन के ज्ञान-साहित्य में यह नैतिक और व्यवहारगत मूर्खता का मानक, स्वाभाविक हिन्दी पद है।
- source_word: יָבֹאוּ בְרִיב
  choice: झगड़े में पड़ते हैं
  rationale: हिब्रू בוא के साथ בְּרִיב विवाद में प्रवेश करने या उलझने का भाव देता है; हिन्दी में ‘झगड़े में पड़ना’ स्वाभाविक है।
- source_word: פִיו
  choice: उसका मुँह
  rationale: मूल की देहात्मक छवि और ‘होंठ’ के साथ समानांतरता बनाए रखता है।
- source_word: לְמַהֲלֻמוֹת
  choice: मार खाने को
  rationale: यह प्रहारों को अपने ऊपर बुलाने का आशय सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִקְרָא
  choice: बुलाता है
  rationale: ‘पुकारना/बुलाना’ के मूल अर्थ को रखते हुए इस मुहावरे का आशय व्यक्त करता है कि मूर्ख की वाणी उसके लिए मार आमंत्रित करती है।
