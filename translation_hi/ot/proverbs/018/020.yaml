source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ תִּשְׂבַּ֣ע בִּטְנ֑/וֹ תְּבוּאַ֖ת שְׂפָתָ֣י/ו יִשְׂבָּֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/020.yaml
  text: From the fruit of a man's mouth his stomach is satisfied[a]; he is satisfied by the produce of his lips.
translation:
  language: hi
  text: मनुष्य के मुँह के फल से उसका पेट तृप्त होता है[a]; अपने होंठों की उपज से वह तृप्त होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के मुँह के फल से उसका पेट भरता है; अपने होंठों की पैदावार से वह भरता है।”
    reason: מִן स्रोत या साधन का भाव दे सकता है, और שׂבע का अर्थ ‘तृप्त होना’ अथवा ‘भर जाना’ हो सकता है।
lexical_decisions:
- source_word: מִ/פְּרִי
  choice: के फल से
  rationale: מִן यहाँ स्रोत या साधन का भाव दे सकता है। ‘के फल से’ कारण/साधन की स्वाभाविक हिन्दी अभिव्यक्ति है और फल का रूपक बनाए रखती है।
- source_word: פִי
  choice: मुँह
  rationale: פֶּה का मूल अर्थ ‘मुँह’ है और यहाँ यह वाणी के लिए रूपकात्मक रूप से प्रयुक्त है; ‘होंठों’ के समानांतर इसे शाब्दिक रखना उचित है।
- source_word: אִישׁ
  choice: मनुष्य के
  rationale: אִישׁ पुल्लिंग एकवचन है, पर कहावत में सामान्य मनुष्य का बोध कराता है। ‘मनुष्य’ इस सामान्य अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תִּשְׂבַּע
  choice: तृप्त होता है
  rationale: שׂבע का अर्थ ‘तृप्त होना/भर जाना’ है। वर्तमान काल सार्वकालिक कहावत के अनुकूल है; ‘तृप्त’ भोजन-संबंधी रूपक को बनाए रखता है।
- source_word: בִּטְנוֹ
  choice: उसका पेट
  rationale: בֶּטֶן का यहाँ सीधा शारीरिक अर्थ ‘पेट’ है, जो मनुष्य द्वारा अपनी वाणी के परिणाम भोगने के रूपक को सहजता से व्यक्त करता है।
- source_word: תְּבוּאַת
  choice: उपज
  rationale: תְּבוּאָה कृषि की उपज या पैदावार को सूचित करता है। ‘उपज’ संक्षिप्त, आधुनिक और ‘फल’ के समानांतर कृषि-रूपक को सुरक्षित रखने वाला शब्द है।
- source_word: שְׂפָתָיו
  choice: अपने होंठों की
  rationale: שָׂפָה का शाब्दिक अर्थ ‘होंठ’ है और यहाँ वाणी का लक्षणालंकार है। ‘अपने’ से दूसरे खंड का कर्ता उसी मनुष्य से स्पष्ट रूप से जुड़ता है।
- source_word: יִשְׂבָּע
  choice: वह तृप्त होता है
  rationale: पहले खंड के שׂבע की पुनरावृत्ति को ‘तृप्त होता है’ दोहराकर रखा गया है, जिससे इब्रानी समानांतरता और वाणी के परिणाम पर बल सुरक्षित रहता है।
