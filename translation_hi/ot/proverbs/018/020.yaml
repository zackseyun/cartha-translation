  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कहावती शैली अपनाई गई है। ‘मुँह/होंठ’, ‘फल/उपज’ और ‘तृप्त’ की पुनरावृत्ति द्वारा मूल की शारीरिक तथा कृषि-संबंधी रूपक-योजना और काव्यात्मक समानांतरता सुरक्षित रखी गई है।
