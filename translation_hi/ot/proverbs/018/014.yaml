language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֽוּחַ אִ֭ישׁ יְכַלְכֵּ֣ל מַחֲלֵ֑/הוּ וְ/ר֥וּחַ נְ֝כֵאָ֗ה מִ֣י יִשָּׂאֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/014.yaml
  text: A man's spirit can sustain him in sickness[b][a], but a crushed spirit—who can bear it?
translation:
  language: hi
  text: मनुष्य की आत्मा उसकी बीमारी में उसे सँभाल सकती है, पर कुचली हुई आत्मा को कौन सह सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य की भीतरी शक्ति उसकी बीमारी में उसे सँभाल सकती है, पर टूटी हुई भीतरी शक्ति को कौन सह सकता है?” मूल में दोनों बार רוּחַ है; इसका अर्थ ‘आत्मा’, ‘भीतरी शक्ति’ या ‘हौसला’ हो सकता है।
    reason: रूअह के अर्थ-क्षेत्र और दोनों पंक्तियों में उसके शब्द-साम्य को स्पष्ट करने के लिए; ‘टूटी हुई’ נְכֵאָה का वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: רוּחַ
  choice: हौसला / मन
  rationale: यहाँ רוּחַ व्यक्ति की भीतरी जीवटता और मनःस्थिति को दर्शाता है। पहली पंक्ति में स्वाभाविक हिन्दी के लिए ‘हौसला’ और दूसरी में कुचली हुई आंतरिक दशा के लिए ‘मन’ चुना गया है।
- source_word: אִישׁ
  choice: मनुष्य का
  rationale: एकवचन पुल्लिंग रूप को बनाए रखते हुए ‘मनुष्य’ नीतिवचन के प्रतिनिधिक, सामान्य मानवीय अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְכַלְכֵּל
  choice: सँभाल सकता है
  rationale: כלכל का भाव सहारा देने, बनाए रखने या थामे रखने का है; ‘सँभाल सकता है’ बीमारी के बीच व्यक्ति को टिकाए रखने की क्षमता को सहज ढंग से व्यक्त करता है।
- source_word: מַחֲלֵהוּ
  choice: बीमारी में उसे
  rationale: शाब्दिक रूप में ‘उसकी बीमारी’ है, पर हिन्दी में ‘बीमारी में उसे सँभालना’ अधिक स्वाभाविक है और आशय सुरक्षित रहता है।
- source_word: נְכֵאָה
  choice: टूटे हुए
  rationale: यह विशेषण आहत, टूटी या कुचली दशा बताता है। ‘टूटा हुआ मन’ वर्तमान हिन्दी में परिचित और अर्थपूर्ण अभिव्यक्ति है।
- source_word: מִי
  choice: कौन
  rationale: मूल का प्रश्नवाचक शब्द एक आलंकारिक प्रश्न आरम्भ करता है; ‘कौन’ उसी संक्षिप्त बल को बनाए रखता है।
- source_word: יִשָּׂאֶנָּה
  choice: सह सकता है
  rationale: נשא का अर्थ उठाना, ढोना या सहना हो सकता है। यहाँ ऐसी आंतरिक टूटन को झेलने के अर्थ में ‘सह सकता है’ उपयुक्त है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘हौसला’ तथा ‘मन’ से नीतिवचन का व्यावहारिक विरोध स्पष्ट होता है, जबकि पादटिप्पणी मूल के एक ही हिब्रू शब्द और अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
