  text: גַּ֭ם מִתְרַפֶּ֣ה בִ/מְלַאכְתּ֑/וֹ אָ֥ח ה֝֗וּא לְ/בַ֣עַל מַשְׁחִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/009.yaml
  text: Even one who is slack in his work is brother to a master of destruction[a].
translation:
  language: hi
  text: जो अपने काम में ढिलाई बरतता है, वह भी विनाश करनेवाले का भाई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विनाशकारी व्यक्ति का भाई है।” इब्रानी पदबंध का अर्थ ऐसे व्यक्ति से हो सकता है जो विनाश करता है, या जो विनाश से पहचाना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: 'यह शब्द कथन में जोर और समावेश जोड़ता है: केवल खुलकर नाश करनेवाला ही नहीं, काम में लापरवाही करनेवाला भी उसी श्रेणी का है। हिंदी में वाक्य के भीतर रखा गया ‘भी’ इस बल को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: מִתְרַפֶּה
  choice: ढिलाई बरतता है
  rationale: हित्पाएल कृदंत अपने को ढीला छोड़ने, लापरवाह होने या प्रयत्न में शिथिल पड़ने का भाव देता है। ‘ढिलाई बरतता है’ अक्षमता के बजाय जिम्मेदारी में लापरवाही को स्पष्ट करता है।
- source_word: בִמְלַאכְתּוֹ
  choice: अपने काम में
  rationale: מְלָאכָה काम, कार्य या श्रम को सूचित करता है। ‘अपने काम में’ आधुनिक हिंदी में सहज है और उस क्षेत्र को बनाए रखता है जिसमें व्यक्ति ढिलाई करता है।
- source_word: אָח הוּא
  choice: वह ... का भाई है
  rationale: मूल पाठ का ठोस पारिवारिक रूपक निकट समानता और समान चरित्र को व्यक्त करता है। ‘भाई है’ इस रूपक को किसी अमूर्त व्याख्या में बदले बिना सुरक्षित रखता है।
- source_word: לְבַעַל מַשְׁחִית
  choice: विनाश करनेवाले का
  rationale: בַעַל के साथ מַשְׁחִית किसी ऐसे व्यक्ति को सूचित कर सकता है जो विनाशकारी गुण या काम से पहचाना जाता है। ‘विनाश करनेवाला’ हिंदी में स्वाभाविक है और व्यक्ति-सूचक अर्थ को स्पष्ट रखते हुए मूल की विनाश-संबंधी धारणा को व्यक्त करता है।
theological_decisions:
- issue: लापरवाही और सक्रिय विनाश के बीच नैतिक संबंध
  choice: मूल का ‘भाई’ रूपक बनाए रखा गया है
  alternative: ‘उसके समान है’ या ‘उसी श्रेणी में आता है’
  rationale: पद यह नहीं कहता कि दोनों के प्रत्येक कर्म सर्वथा एक जैसे हैं; वह उनके बीच घनिष्ठ नैतिक समानता स्थापित करता है। ठोस रूपक को बनाए रखने से इस तनाव को बिना बढ़ाए या घटाए व्यक्त किया जाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली। ‘ढिलाई बरतता है’ सामान्य पाठक के लिए सहज है, जबकि ‘भाई’ मूल इब्रानी की तीखी रूपकात्मक तुलना को बनाए रखता है।
