  text: לִ/פְנֵי שֶׁ֭בֶר יִגְבַּ֣הּ לֵב אִ֑ישׁ וְ/לִ/פְנֵ֖י כָב֣וֹד עֲנָוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/012.yaml
  text: Before destruction a man's heart is haughty[a], and before honor comes humility.
translation:
  language: hi
  text: 'विनाश से पहले मनुष्य का मन घमंडी होता है,

    और सम्मान से पहले नम्रता आती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: से पहले
  rationale: यहाँ पूर्वसर्ग का कालवाचक अर्थ है और दोनों चरणों में समानांतर संरचना बनाए रखता है।
- source_word: שֶׁבֶר
  choice: विनाश
  rationale: नीतिवचन के संदर्भ में यह शब्द शाब्दिक टूटने के बजाय पतन या बरबादी को सूचित करता है।
- source_word: יִגְבַּהּ לֵב
  choice: मन घमंडी होता है
  rationale: शाब्दिक रूप से ‘मन ऊँचा होता है’; यह इब्रानी मुहावरा अभिमान को व्यक्त करता है, जिसे स्वाभाविक आधुनिक हिन्दी में इस प्रकार दिया गया है।
- source_word: לֵב אִישׁ
  choice: मनुष्य का मन
  rationale: אִישׁ यहाँ एकवचन पुल्लिंग होते हुए सार्वत्रिक नीतिवचनात्मक अर्थ रखता है; ‘मनुष्य’ हिन्दी में स्रोत के मानवीय और प्रतिनिधिक भाव को स्वाभाविक ढंग से रखता है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: यहाँ आशय सामाजिक प्रतिष्ठा या आदर से है, न कि विशेष रूप से ईश्वरीय महिमा से।
- source_word: עֲנָוָה
  choice: नम्रता
  rationale: यह विनीत अवस्था या स्वभाव को दर्शाता है और घमंड के साथ स्पष्ट नैतिक विरोध बनाता है।
theological_decisions:
- issue: אִישׁ का सार्वत्रिक पुल्लिंग प्रयोग
  choice: मनुष्य का मन
  alternative: व्यक्ति का मन / आदमी का मन
  rationale: ‘मनुष्य’ मूल के एकवचन मानवीय प्रतिनिधि भाव को बनाए रखते हुए आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है; यह कथन केवल पुरुषों तक सीमित नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली। दोनों समानांतर चरणों में ‘से पहले’ रखा गया है। दूसरे चरण में हिन्दी की स्वाभाविक पूर्ण अभिव्यक्ति के लिए ‘आती है’ जोड़ा गया है, जो मूल के लुप्त क्रियापद को संदर्भानुसार व्यक्त करता है।
