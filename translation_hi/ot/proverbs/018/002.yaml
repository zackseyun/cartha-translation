  text: לֹֽא יַחְפֹּ֣ץ כְּ֭סִיל בִּ/תְבוּנָ֑ה כִּ֝֗י אִֽם בְּ/הִתְגַּלּ֥וֹת לִבּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/002.yaml
  text: A fool does not delight in understanding[a], but only in revealing his heart.
translation:
  language: hi
  text: 'मूर्ख समझ से प्रसन्न नहीं होता,

    बल्कि केवल अपने मन की बात प्रकट करने से प्रसन्न होता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: प्रसन्न होता
  rationale: यह क्रिया इच्छा रखने के साथ-साथ किसी बात में आनंद या प्रसन्नता पाने का भाव रखती है। समानांतर दोनों खंडों में “प्रसन्न होता” स्वाभाविक हिंदी में इस भाव को स्पष्ट करता है।
- source_word: כְּסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और बौद्धिक रूप से हठी व्यक्ति को सूचित करने वाला पारिभाषिक ज्ञान-साहित्य शब्द है।
- source_word: תְבוּנָה
  choice: समझ
  rationale: यहाँ शब्द विवेकपूर्ण समझ या अंतर्दृष्टि को सूचित करता है; “समझ” साधारण पाठक के लिए सहज और संदर्भानुकूल है।
- source_word: כִּי אִם
  choice: बल्कि केवल
  rationale: यह पदबंध पहले खंड के निषेध के विपरीत एक विशिष्ट रुचि पर बल देता है; “बल्कि केवल” विरोध और अनन्यता दोनों बनाए रखता है।
- source_word: בְּהִתְגַּלּוֹת
  choice: प्रकट करने
  rationale: גלה से बना यह रूप खोलने, उजागर करने या प्रकट करने का भाव देता है। संदर्भ में अपने भीतर की बात बाहर व्यक्त करना अभिप्रेत है।
- source_word: לִבּוֹ
  choice: अपने मन की बात
  rationale: हिब्रू ‘हृदय’ यहाँ केवल भावनाओं के बजाय भीतर के विचारों, इच्छाओं और रुझानों को सूचित करता है। आधुनिक हिंदी में “मन की बात” इस व्यापक आंतरिक आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: לֵב का मानव-अंतरात्मा संबंधी अर्थ
  choice: अपने मन की बात
  alternative: अपने हृदय को
  rationale: “हृदय” का शाब्दिक रूप भावनाओं तक सीमित समझा जा सकता है, जबकि हिब्रू में विचार, इच्छा और प्रवृत्ति भी सम्मिलित हैं। “मन की बात” संदर्भगत अर्थ को बिना किसी विशिष्ट धार्मिक व्याख्या के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूक्तिपरक रखी गई है। दूसरी पंक्ति में क्रिया दोहराने से हिंदी में अर्थ स्पष्ट होता है और यह संकेत मिलता है कि मूर्ख की प्रसन्नता समझ पाने में नहीं, अपने भीतर की बात उगलने में है।
