  edition: WLC
  text: מָ֣וֶת וְ֭/חַיִּים בְּ/יַד לָשׁ֑וֹן וְ֝/אֹהֲבֶ֗י/הָ יֹאכַ֥ל פִּרְיָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/021.yaml
  text: Death and life are in the power of the tongue[b][a], and those who love it will eat its fruit.
translation:
  language: hi
  text: मृत्यु और जीवन जीभ के वश में हैं[a], और जो उससे प्रेम करते हैं, वे उसका फल खाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मृत्यु और जीवन जीभ के हाथ में हैं।”
    reason: lexical_alternative
  - marker: b
    text: “जो उससे प्रेम करते हैं” संभवतः उन लोगों को दर्शाता है जो जीभ का उपयोग करना पसंद करते हैं; अर्थात वे अपने शब्दों के परिणाम—चाहे मृत्यु के हों या जीवन के—भोगेंगे।
    reason: cultural_note
lexical_decisions:
- source_word: מָוֶת
  choice: मृत्यु
  rationale: अमूर्त संज्ञा के रूप में ‘जीवन’ के साथ विरोधात्मक समानांतरता बनाए रखता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: रूप की दृष्टि से बहुवचन होने पर भी यहाँ प्रचलित अमूर्त एकवचन अर्थ ‘जीवन’ है।
- source_word: בְּיַד
  choice: के वश में
  rationale: शाब्दिक ‘हाथ में’ शक्ति, अधिकार या नियंत्रण का मुहावरा है; ‘वश में’ आधुनिक हिन्दी में वही भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָשׁוֹן
  choice: जीभ
  rationale: वाणी के लिए प्रयुक्त मूल देह-अंग रूपक को सुरक्षित रखता है।
- source_word: אֹהֲבֶיהָ
  choice: जो उससे प्रेम करते हैं
  rationale: स्त्रीलिंग प्रत्यय का स्वाभाविक पूर्वपद ‘जीभ’ है; यह अनुवाद बोलने से प्रेम, जीभ के अधिक उपयोग या उसकी शक्ति में आसक्ति के बीच मूल की अस्पष्टता बनाए रखता है।
- source_word: יֹאכַל
  choice: खाएँगे
  rationale: नीतिवचन में परिणाम का भाव व्यक्त करता है; सामूहिक कर्ता के अनुरूप हिन्दी में बहुवचन स्वाभाविक है।
- source_word: פִּרְיָהּ
  choice: उसका फल
  rationale: शब्दों के परिणाम के लिए प्रयुक्त कृषि-रूपक को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘जो उससे प्रेम करते हैं’ का आशय
  choice: मुख्य पाठ में संदर्भ को अनिर्धारित रखा गया है।
  alternative: ‘जो बोलना पसंद करते हैं’ या ‘जो जीभ का अधिक उपयोग करते हैं।’
  rationale: मूल इब्रानी में केवल स्त्रीलिंग सर्वनाम है, जो ‘जीभ’ की ओर संकेत करता है, पर प्रेम करने की सटीक व्यावहारिक धारणा स्पष्ट नहीं करता; अतः व्याख्या को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नीतिवचन शैली। ‘जीभ’ और ‘फल’ के मूल रूपकों को बनाए रखा गया है, जबकि בְּיַד के अर्थ को स्वाभाविक हिन्दी मुहावरे ‘के वश में’ से व्यक्त किया गया है।
