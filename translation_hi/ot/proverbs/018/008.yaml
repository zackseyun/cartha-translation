translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ठोस इब्रानी रूपक को मुख्य पाठ में सुरक्षित रखा गया है और उसके मुहावरेदार अर्थ तथा दुर्लभ शब्द की अनिश्चितता को पाद-टिप्पणियों में स्पष्ट किया गया है।
