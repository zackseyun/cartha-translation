source:
  edition: WLC
  text: דִּבְרֵ֣י נִ֭רְגָּן כְּ/מִֽתְלַהֲמִ֑ים וְ֝/הֵ֗ם יָרְד֥וּ חַדְרֵי בָֽטֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/008.yaml
  text: The words of a whisperer are like delicious morsels[b][a], and they go down into the inner chambers of the belly.
translation:
  language: hi
  text: चुग़ली करनेवाले की बातें स्वादिष्ट कौरों के समान होती हैं[a]; वे पेट की भीतरी कोठरियों तक उतर जाती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वादिष्ट टुकड़ों के समान”; इस दुर्लभ इब्रानी शब्द का अर्थ “घावों के समान” या “लालच से निगली जानेवाली वस्तुओं के समान” भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: “पेट की भीतरी कोठरियाँ” एक इब्रानी मुहावरा है, जिसका अर्थ मनुष्य का अंतरतम है।
    reason: cultural_note
lexical_decisions:
- source_word: דִּבְרֵי
  choice: की बातें
  rationale: रचना-सम्बन्धी बहुवचन का स्वाभाविक हिन्दी रूप; ‘बातें’ यहाँ बोले गए शब्दों को सहज ढंग से व्यक्त करता है।
- source_word: נִרְגָּן
  choice: चुग़ली करनेवाला
  rationale: यह संज्ञा छिपे या फूट डालनेवाले ढंग से बातें फैलानेवाले व्यक्ति को दर्शाती है। आधुनिक हिन्दी में ‘चुग़ली करनेवाला’ इस व्यवहार को ‘बड़बड़ानेवाला’ की अपेक्षा अधिक स्पष्ट करता है।
- source_word: כְּמִתְלַהֲמִים
  choice: स्वादिष्ट कौरों के समान
  rationale: यह दुर्लभ रूप विवादित है। नीतिवचन 26:22 में यही अभिव्यक्ति ऐसी लुभावनी वस्तु के अर्थ में समझी जाती है जिसे उत्सुकता से निगला जाता है; इसलिए मुख्य पाठ में स्वादिष्ट कौरों की छवि रखी गई और अन्य सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
- source_word: וְהֵם
  choice: वे
  rationale: स्वतंत्र सर्वनाम पहले कही गई ‘बातों’ को फिर से ग्रहण करता है; हिन्दी में ‘वे’ पर्याप्त और स्वाभाविक है।
- source_word: יָרְדוּ
  choice: उतर जाती हैं
  rationale: यद्यपि इब्रानी रूप पूर्ण क्रिया है, लोकोक्तिपरक सन्दर्भ में यह सामान्य सत्य बताता है; हिन्दी का सामान्य वर्तमान इस आशय को ठीक व्यक्त करता है।
- source_word: חַדְרֵי בָטֶן
  choice: पेट की भीतरी कोठरियों
  rationale: शाब्दिक चित्र ‘पेट की कोठरियाँ’ है। ‘भीतरी कोठरियाँ’ रूपक की ठोस छवि बनाए रखता है, जबकि पाद-टिप्पणी उसके मुहावरेदार अर्थ—मनुष्य का अंतरतम—को स्पष्ट करती है।
