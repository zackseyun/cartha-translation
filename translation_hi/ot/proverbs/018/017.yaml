  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। न्यायिक प्रसंग स्पष्ट है, पर अत्यधिक तकनीकी कानूनी शब्दावली से बचा गया है। मुख्य पाठ का [a] चिह्न संबंधित वैकल्पिक अनुवाद से मेल खाता है।
