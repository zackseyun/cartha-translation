  yaml_path: translation/ot/proverbs/018/017.yaml
  text: The first to present his case seems right[a], until his neighbor comes and examines him.
translation:
  language: hi
  text: जो अपने विवाद में पहले अपना पक्ष रखता है, वह सही जान पड़ता है[a], पर फिर दूसरा पक्ष आकर उसकी जाँच करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने विवाद में पहले आता है, वह न्यायी प्रतीत होता है; पर उसका साथी आकर उसकी जाँच करता है।”
    reason: צַדִּיק के ‘न्यायी’ अर्थ तथा רֵעֵהוּ और חֲקָרוֹ के अधिक शाब्दिक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: צַדִּיק
  choice: सही जान पड़ता है
  rationale: विशेषण का मूल अर्थ ‘धर्मी/न्यायी’ है, पर विवाद के संदर्भ में इसका आशय पहली सुनवाई में किसी का सही पक्ष पर दिखाई देना है। ‘सही जान पड़ता है’ आरंभिक दावे की विश्वसनीयता और बाद की जाँच से उत्पन्न तनाव दोनों बनाए रखता है।
- source_word: הָרִאשׁוֹן בְּרִיבוֹ
  choice: अपने विवाद में पहले बोलनेवाला
  rationale: इब्रानी पदबंध विवाद में पहले उपस्थित होने या अपना पक्ष पहले रखनेवाले व्यक्ति को सूचित करता है। हिंदी में ‘पहले बोलनेवाला’ इसे सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: יבא
  choice: आकर
  rationale: क्रिया का सीधा अर्थ ‘आना’ है। इसे ‘आकर’ रखने से दूसरे व्यक्ति के सामने आने का क्रम सुरक्षित रहता है।
- source_word: רֵעֵהוּ
  choice: दूसरा पक्ष
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या दूसरा संबंधित व्यक्ति हो सकता है। विवाद के प्रसंग में ‘दूसरा पक्ष’ स्वाभाविक है और अनावश्यक रूप से मित्रता का भाव नहीं जोड़ता।
- source_word: וַחֲקָרוֹ
  choice: उससे पूछताछ करता है
  rationale: חקר जाँचने, खोजबीन करने या परखने को सूचित करता है। व्यक्ति से संबंधित प्रत्यय के कारण ‘उससे पूछताछ’ उपयुक्त है; यह कानूनी ‘जिरह’ जितना तकनीकी हुए बिना दावे की पड़ताल का भाव देता है।
