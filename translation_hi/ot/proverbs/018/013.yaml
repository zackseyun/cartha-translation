  yaml_path: translation/ot/proverbs/018/013.yaml
  text: He who answers a matter before he hears it[a], it is folly and shame to him.
translation:
  language: hi
  text: जो किसी बात को सुने बिना उसका उत्तर देता है[a], यह उसके लिए मूर्खता और लज्जा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो किसी वचन या मामले को सुने बिना उसका उत्तर देता है।” इब्रानी דָּבָר का अर्थ “वचन,” “बात,” “मामला” या “मुकदमा” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵשִׁיב
  choice: उत्तर देता है
  rationale: यहाँ שוב का हिफ़ील कृदन्त मुहावरे के रूप में ‘उत्तर देना/प्रत्युत्तर देना’ व्यक्त करता है; ‘उत्तर देता है’ संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुकूल है।
- source_word: דָּבָר
  choice: किसी बात
  rationale: דָּבָר का अर्थ ‘वचन,’ ‘बात,’ ‘मामला’ या ‘मुकदमा’ हो सकता है। ‘किसी बात’ सामान्य पाठक के लिए सहज है और चर्चा, विवाद तथा किसी कथन—सभी पर कहावत को लागू रहने देता है।
- source_word: בְּטֶרֶם
  choice: से पहले ही
  rationale: यह स्पष्ट कालवाचक अर्थ ‘पहले’ देता है; ‘ही’ जल्दबाज़ी के निहित बल को स्वाभाविक हिन्दी में उभारता है, बिना नया अर्थ जोड़े।
- source_word: יִשְׁמָע
  choice: सुनने
  rationale: שׁמע यहाँ सुनने और ध्यानपूर्वक ग्रहण करने दोनों का संकेत दे सकता है। ‘सुनने’ मूल क्रिया के व्यापक अर्थ को बनाए रखता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: नीतिवचन साहित्य में यह नैतिक और बौद्धिक विवेकहीनता का प्रमुख शब्द है; ‘मूर्खता’ आधुनिक हिन्दी में स्पष्ट और प्रतिष्ठित समतुल्य है।
- source_word: הִיא
  choice: यह ... है
  rationale: स्त्रीलिंग सर्वनाम पहले वर्णित कृत्य की ओर संकेत करता है; हिन्दी में ‘यह ... है’ उस कार्य को स्वाभाविक ढंग से पुनः इंगित करता है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: लामेद व्यक्ति के संबंध या परिणाम को बताता है; ‘उसके लिए’ हिन्दी में स्वाभाविक रूप से बताता है कि मूर्खता और लज्जा उसी के हिस्से आती हैं।
- source_word: וּכְלִמָּה
  choice: और लज्जा की बात
  rationale: כְּלִמָּה अपमान, लज्जा या बदनामी को दर्शाता है। ‘लज्जा की बात’ हिन्दी में ‘मूर्खता’ के साथ सहज समन्वय बनाता और परिणाम की सामाजिक धार को बनाए रखता है।
