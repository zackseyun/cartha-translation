base_translation:
  language: en
  yaml_path: translation/ot/proverbs/018/023.yaml
  text: The poor man speaks with pleas[a], but the rich man answers harshly.
translation:
  language: hi
  text: गरीब मनुष्य गिड़गिड़ाकर बोलता है[a], पर धनवान रूखेपन से उत्तर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गरीब मनुष्य विनती की बातें करता है, पर धनवान कठोर शब्दों में उत्तर देता है।”
    reason: ‘विनतियाँ’ और עַזּוֹת दोनों को अधिक स्पष्ट, संज्ञात्मक/वाक्यांशात्मक ढंग से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: תַּחֲנוּנִים
  choice: गिड़गिड़ाकर
  rationale: बहुवचन संज्ञा दया या कृपा पाने के लिए की गई विनती को दर्शाती है और यहाँ बोलने की रीति बताती है। ‘गिड़गिड़ाकर’ आधुनिक हिन्दी में विनम्र और विवश याचना का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְדַבֶּר
  choice: बोलता है
  rationale: पिएल रूप का सामान्य अर्थ ‘बोलना’ है। सामान्य वर्तमान काल नीतिवचन की सार्वकालिक शैली के अनुकूल है।
- source_word: רָשׁ
  choice: गरीब मनुष्य
  rationale: यह शब्द अभावग्रस्त व्यक्ति के लिए प्रयुक्त एकवचन पुल्लिंग संज्ञार्थक विशेषण है। ‘गरीब मनुष्य’ उसके प्रतिनिधिक एकवचन को बनाए रखता है।
- source_word: וְעָשִׁיר
  choice: पर धनवान
  rationale: וְ मूलतः ‘और’ है, किंतु दोनों पंक्तियों के स्पष्ट विरोध के कारण हिन्दी में ‘पर’ स्वाभाविक है। ‘धनवान’ संज्ञा के रूप में प्रतिनिधिक एकवचन को व्यक्त करता है।
- source_word: יַעֲנֶה
  choice: उत्तर देता है
  rationale: काल रूप का सीधा अर्थ ‘उत्तर देना’ है और यह पहले खंड में किए गए निवेदन के प्रत्युत्तर को स्पष्ट करता है।
- source_word: עַזּוֹת
  choice: कड़ाई से
  rationale: बहुवचन स्त्रीलिंग रूप यहाँ क्रियाविशेषणवत उत्तर देने की रीति बताता है। संदर्भ में इसका भाव कठोर या रुखा है; ‘कड़ाई से’ मूल की संक्षिप्तता और कुछ अर्थगत व्यापकता बनाए रखता है।
