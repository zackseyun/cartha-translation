id: PRO.5.7
reference: Proverbs 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ/אַל תָּ֝ס֗וּרוּ מֵ/אִמְרֵי פִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/007.yaml
  text: And now[a], sons, listen to me, and do not turn aside from the words of my mouth.
translation:
  language: hi
  text: और अब, हे पुत्रो, मेरी सुनो, और मेरे मुँह की बातों से न हटो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को रखते हुए यह अभिव्यक्ति विचार के संक्रमण और नए आग्रह को स्वाभाविक ढंग से दिखाती है।
- source_word: בָנִים
  choice: हे पुत्रो
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और ज्ञान-साहित्य में शिष्यों को पुत्रवत संबोधित करता है। सम्बोधन स्पष्ट करने के लिए हिन्दी में ‘हे’ और सम्बोधन रूप ‘पुत्रो’ स्वाभाविक हैं; मूल में ‘मेरे’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: שִׁמְעוּ לִי
  choice: मेरी सुनो
  rationale: यह आधुनिक हिन्दी का स्वाभाविक मुहावरा है, जो ध्यान देकर सुनने का आग्रह व्यक्त करता है और अर्थ को अनावश्यक रूप से ‘आज्ञा मानो’ तक सीमित नहीं करता।
- source_word: וְאַל תָּסוּרוּ
  choice: और ... न हटो
  rationale: निषेधात्मक आदेश और पहले आदेश के साथ उसका समन्वय सुरक्षित रहता है। ‘हटो’ मार्ग से विचलित होने की नीतिवचन-संबंधी छवि को संक्षेप और सहज रूप में व्यक्त करता है।
- source_word: מֵאִמְרֵי פִי
  choice: मेरे मुँह की बातों से
  rationale: यह मूल के शाब्दिक चित्र ‘मेरे मुँह के वचनों/कथनों’ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; ‘बातों’ यहाँ बोले गए उपदेशों को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे पुत्रो’ मूल के प्रत्यक्ष सम्बोधन और पुल्लिंग बहुवचन को सुरक्षित रखता है; ‘मेरे पुत्रो’ नहीं किया गया, क्योंकि इस पद में अधिकारसूचक सर्वनाम नहीं है।
