  text: Drink water from your own cistern[a], and flowing water from your own well.
translation:
  language: hi
  text: अपने ही हौज का पानी पी, और अपने ही कुएँ के भीतर से बहता पानी पी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह जो तुम्हारे अपने कुएँ के भीतर से बहता है।” इब्रानी कृदंत का अधिक शाब्दिक अनुवाद ‘पानी’ शब्द जोड़े बिना भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: पी
  rationale: यह שׁתה का काल एकवचन पुल्लिंग आदेश है। ‘पी’ उसकी सीधी आज्ञार्थक शक्ति को बिना अतिरिक्त भाव जोड़े सुरक्षित रखता है।
- source_word: מַיִם
  choice: पानी
  rationale: מַיִם का सामान्य अर्थ ‘पानी’ है। आधुनिक हिंदी में ‘पानी’ सहज और सर्वसुलभ है।
- source_word: מִבּוֹרֶךָ
  choice: अपने ही हौज का
  rationale: בּוֹר यहाँ पानी जमा करने के हौज या कुंड को सूचित करता है। ‘हौज’ अगले समानांतर शब्द ‘कुआँ’ से भेद बनाए रखता है, और ‘अपने ही’ संबंधसूचक प्रत्यय तथा प्रसंगगत विशिष्टता को व्यक्त करता है। हिंदी में ‘हौज का पानी पी’ स्वाभाविक है।
- source_word: וְנֹזְלִים
  choice: और ... बहता पानी
  rationale: נזל से बना यह कृदंत ‘बहने’ का भाव देता है और समानांतर पंक्ति के कारण ‘पानी’ अर्थ में निहित समझा जा सकता है। मुख्य पाठ में ‘बहता पानी’ हिंदी में स्वाभाविक रूप से इस दीर्घवृत्त को पूरा करता है।
- source_word: מִתּוֹךְ בְּאֵרֶךָ
  choice: अपने ही कुएँ से
  rationale: בְּאֵר का सामान्य अर्थ ‘कुआँ’ है। מִתּוֹךְ स्रोत के भीतर से निकलने का भाव रखता है; हिंदी में ‘कुएँ से’ वही अर्थ सहज रूप से देता है। ‘अपने ही’ संबंधसूचक प्रत्यय और संदर्भ में निहित अनन्यता को प्रकट करता है।
theological_decisions:
- issue: क्या वैवाहिक और यौन रूपक को मुख्य पाठ में स्पष्ट कर दिया जाए
  choice: मुख्य पाठ में पानी, हौज और कुएँ के मूल रूपक को बनाए रखना
  alternative: अर्थ खोलकर ‘अपनी ही पत्नी से संतुष्ट रह’ जैसा अनुवाद करना
  rationale: इब्रानी पद जानबूझकर जल-संबंधी चित्रात्मक भाषा का प्रयोग करता है और निकटवर्ती प्रसंग उसका वैवाहिक आशय स्पष्ट करता है। मुख्य पाठ में आशय खोल देना अनुवाद से आगे बढ़कर व्याख्या करना होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन आज्ञा के लिए ‘पी’ मूल के व्याकरण से मेल खाता है। ‘हौज’ और ‘कुआँ’ समानांतर किंतु अलग जल-स्रोतों की छवि को बनाए रखते हैं; रूपक को व्याख्यात्मक रूप से नहीं खोला गया है।
