  yaml_path: translation/ot/proverbs/005/001.yaml
  text: My son[a], pay attention to my wisdom; incline your ear to my understanding[b],
translation:
  language: hi
  text: मेरे बेटे, मेरी बुद्धि पर ध्यान दे; मेरी समझ की ओर कान झुका।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: यह पिता अथवा शिक्षक का पुल्लिंग एकवचन संबोधन है; हिंदी में संबोधन को स्पष्ट और स्वाभाविक रखने के लिए ‘हे मेरे बेटे’ चुना गया।
- source_word: לְחָכְמָתִי
  choice: मेरी बुद्धि पर
  rationale: חָכְמָה का सामान्य अर्थ ‘बुद्धि’ है। הַקְשִׁיבָה के साथ हिंदी में ‘पर ध्यान देना’ स्वाभाविक है और मूल संज्ञा को बनाए रखता है।
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: यह आज्ञार्थक रूप ध्यानपूर्वक सुनने का भाव व्यक्त करता है; ‘ध्यान दे’ आधुनिक और सहज हिंदी है।
- source_word: לִתְבוּנָתִי
  choice: मेरी समझ की ओर
  rationale: תְּבוּנָה समझ, विवेक अथवा सूझ को दर्शाता है। ‘समझ’ मूल की अमूर्त संज्ञा और ‘बुद्धि’ के साथ समानांतरता बनाए रखती है।
- source_word: הַט אָזְנֶךָ
  choice: कान लगा
  rationale: शाब्दिक बिंब ‘अपना कान झुका’ है, पर ‘कान लगा’ हिंदी में ध्यानपूर्वक सुनने का स्वाभाविक मुहावरा है और एकवचन कान के बिंब को रखता है।
