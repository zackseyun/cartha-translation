base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/012.yaml
  text: and you say[a], “How I hated discipline[b], and my heart despised reproof!”
translation:
  language: hi
  text: और तुम कहोगे[a], “मैंने अनुशासन से कितनी घृणा की, और मेरे मन ने डाँट को कितना तुच्छ जाना![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और तुम कहते हो”; हिब्रू का पूर्ण कालरूप इस चेतावनी के प्रसंग में भावी परिणाम अथवा उसे सजीव वर्तमान की तरह व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “डाँट” का अनुवाद “फटकार” या “सुधार” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: और तुम कहोगे
  rationale: संयोजक के साथ प्रयुक्त कालरूप पिता की चेतावनी के भावी परिणाम को व्यक्त करता है; हिन्दी में भविष्यकाल इस प्रसंग को स्वाभाविक और स्पष्ट रखता है।
- source_word: אֵיךְ
  choice: कैसी
  rationale: यह प्रश्न नहीं, पछतावे से भरा विस्मयादिबोधक उद्गार है; ‘कैसी’ उसके भावात्मक बल को सहज हिन्दी में बनाए रखता है।
- source_word: שָׂנֵאתִי
  choice: मैंने ... घृणा की
  rationale: पूर्ण क्रिया पीछे मुड़कर की गई स्वीकारोक्ति व्यक्त करती है; यह हिन्दी प्रयोग उस पश्चात्तापपूर्ण स्मरण को स्पष्ट करता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द शिक्षा देने वाले सुधार और प्रशिक्षण दोनों का बोध कराता है; ‘अनुशासन’ इन अर्थों को संक्षेप में समेटता है।
- source_word: וְתוֹכַחַת
  choice: डाँट
  rationale: यह मौखिक सुधार, फटकार या दोष दिखाने को सूचित करता है; ‘डाँट’ साधारण आधुनिक हिन्दी में स्वाभाविक और सुलभ है।
- source_word: נָאַץ
  choice: तुच्छ जाना
  rationale: क्रिया केवल अस्वीकार करना नहीं, बल्कि अवमानना के साथ ठुकराना व्यक्त करती है; ‘तुच्छ जाना’ इसके प्रबल भाव और समानांतर काव्यात्मकता को सुरक्षित रखता है।
- source_word: לִבִּי
  choice: मेरे मन ने
  rationale: हिब्रू ‘हृदय’ यहाँ विचार, इच्छा और भीतरी व्यक्तित्व का केंद्र है; आधुनिक हिन्दी में ‘मन’ यही आशय स्वाभाविक रूप से व्यक्त करता है।
