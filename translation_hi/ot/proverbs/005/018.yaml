  text: Let your fountain be blessed[a], and rejoice in the wife of your youth.
translation:
  language: hi
  text: तेरा सोता धन्य रहे[a], और अपनी जवानी की पत्नी के साथ आनन्दित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरा जलस्रोत।” हिब्रू में पानी की उपमा बनी रहती है और इससे जीवन के स्रोत तथा वैवाहिक प्रजनन—दोनों का संकेत मिल सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: रहे
  rationale: हिब्रू आदेशार्थक रूप यहाँ कामना और प्रोत्साहन व्यक्त करता है; ‘रहे’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: מְקוֹרְךָ
  choice: तेरा सोता
  rationale: מָקוֹר का मूल अर्थ जल का सोता या स्रोत है। प्रसंग की जल-उपमा और वैवाहिक प्रजनन के सम्भावित संकेत को बनाए रखने के लिए ‘सोता’ चुना गया है।
- source_word: בָרוּךְ
  choice: आशीषित
  rationale: यह मूल के निष्क्रिय/विशेषणात्मक ‘आशीष पाया हुआ’ भाव को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וּשְׂמַח
  choice: और ... आनन्द मना
  rationale: यह रूप आज्ञार्थक प्रोत्साहन देता है; ‘आनन्द मना’ वैवाहिक प्रसन्नता के सकारात्मक आदेश को सहज हिन्दी में व्यक्त करता है।
- source_word: מֵאֵשֶׁת
  choice: पत्नी में
  rationale: שׂמח के साथ מן आनन्द के स्रोत या विषय को सूचित कर सकता है; ‘में आनन्द मना’ पत्नी पर केन्द्रित हर्ष को व्यक्त करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: נְעוּרֶיךָ
  choice: अपनी जवानी की
  rationale: ‘जवानी की पत्नी’ उस पत्नी के लिए प्रचलित हिब्रू अभिव्यक्ति है जिससे व्यक्ति ने युवावस्था में विवाह किया था; सीधा रूप मूल की अर्थवत्ता बचाता है।
