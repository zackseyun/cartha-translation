- from: तेरा सोता आशीषित रहे[a], और अपनी जवानी की पत्नी में आनन्द मना।
  to: तेरा सोता धन्य रहे[a], और अपनी जवानी की पत्नी के साथ आनन्दित हो।
  rationale: The revision retains the source text’s compact parallelism, water imagery, blessing language, and marital exhortation. It replaces two expressions that are awkward in modern standard Hindi with idiomatic, dignified equivalents. The footnote remains appropriately cautious about the metaphor’s possible implications.
  reviewer_model: gpt-5.6-terra
