source:
  edition: WLC
  text: כִּ֤י נֹ֨כַח עֵינֵ֣י יְ֭הוָה דַּרְכֵי אִ֑ישׁ וְֽ/כָל מַעְגְּלֹתָ֥י/ו מְפַלֵּֽס׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/021.yaml
  text: For a man's ways are before the eyes of Yahweh[a], and he watches all his paths.
translation:
  language: hi
  text: क्योंकि मनुष्य के मार्ग याहवे की आँखों के सामने हैं, और वह मनुष्य के सभी पथों को परखता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के सभी पथों को तौलता है।” इब्रानी क्रिया में किसी मार्ग को मापने या उसका मूल्यांकन करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है और नीतिवचन के व्याख्यात्मक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: נֹכַח עֵינֵי יְהוָה
  choice: याहवे की आँखों के सामने
  rationale: 'यह मूल पाठ की स्थान-संबंधी उपमा और मानवरूपी अभिव्यक्ति को बनाए रखता है: मनुष्य का आचरण याहवे की दृष्टि से छिपा नहीं है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: דַּרְכֵי אִישׁ
  choice: मनुष्य के मार्ग
  rationale: אִישׁ यहाँ किसी विशेष पुरुष का उल्लेख नहीं, बल्कि प्रतिनिधिक रूप से मनुष्य का है; 'मार्ग' आचरण के रूपक को सुरक्षित रखता है।
- source_word: מַעְגְּלֹתָיו
  choice: उसके सभी पथों
  rationale: '''पथ'' पहले खंड के ''मार्ग'' के साथ काव्यात्मक समानांतरता रखते हुए अधिक ठोस रास्ते की छवि भी बनाए रखता है।'
- source_word: מְפַלֵּס
  choice: परखता है
  rationale: संदर्भ में क्रिया याहवे द्वारा मनुष्य के आचरण के मापन या मूल्यांकन का भाव देती है। स्वाभाविक हिंदी में 'परखता है' यह भाव स्पष्ट करता है, जबकि 'तौलता है' की संभव रूपकात्मक व्यंजना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है; 'याहवे' उसे नाम के रूप में स्पष्ट और प्रत्यक्ष रखता है।
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग
  choice: मनुष्य
  alternative: पुरुष; व्यक्ति
  rationale: इस संदर्भ में कथन समस्त मानव आचरण पर लागू सामान्य सूक्ति है। 'मनुष्य' हिंदी में मूल के एकवचन प्रतिनिधिक बल को बनाए रखता है और अनावश्यक रूप से अर्थ को केवल वयस्क पुरुष तक सीमित नहीं करता।
- issue: מְפַלֵּס में निरीक्षण और मूल्यांकन का तनाव
  choice: परखता है
  alternative: तौलता है; समतल करता है
  rationale: यहाँ कर्ता याहवे है और कर्म मनुष्य के पथ हैं, इसलिए मूल्यांकन का अर्थ प्रसंगानुकूल है। फिर भी मापने या तौलने की मूल रूपकात्मक संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'आँखों के सामने,' 'मार्ग' और 'पथ' मूल इब्रानी की दृश्यात्मक तथा काव्यात्मक समानांतरता को बनाए रखते हैं; 'परखता है' सामान्य पाठक के लिए स्पष्ट है, और वैकल्पिक रूपक पादटिप्पणी में दिया गया है।
