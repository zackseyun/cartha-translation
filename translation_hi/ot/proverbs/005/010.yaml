- source_word: וַעֲצָבֶיךָ
  choice: तेरी मेहनत की कमाई
  rationale: यह शब्द कष्टपूर्ण परिश्रम और उससे प्राप्त फल दोनों की ओर संकेत कर सकता है; प्रसंग में दूसरे के घर पहुँचने वाली वस्तु के रूप में मेहनत का फल स्वाभाविक है।
- source_word: בְּבֵית
  choice: घर चली जाए
  rationale: मूल में शाब्दिक रूप से 'घर में' है, पर समानांतर चेतावनी वहाँ परिश्रम के फल के पहुँच जाने या हस्तांतरित होने को सूचित करती है।
- source_word: נָכְרִי
  choice: किसी परदेशी
  rationale: נכרי किसी बाहरी या विदेशी व्यक्ति को दर्शाता है; 'परदेशी' पहले खंड के 'पराए लोग' से शब्दगत भेद भी बनाए रखता है।
