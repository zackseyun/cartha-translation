  text: He dies for lack of discipline[a], and in the abundance of his folly he goes astray.
translation:
  language: hi
  text: अनुशासन के अभाव में वह मर जाता है[a], और अपनी मूर्खता की प्रचुरता में वह भटक जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुशासन के बिना वह मर जाएगा, और अपनी मूर्खता की प्रचुरता में भटक जाएगा।”
    reason: इब्रानी अपूर्ण क्रियाएँ नीतिवचन में सामान्य वर्तमान परिणाम अथवा निश्चित भावी परिणाम, दोनों रूपों में समझी जा सकती हैं।
lexical_decisions:
- source_word: יָמוּת
  choice: मर जाता है
  rationale: काल-अपूर्ण क्रिया ज्ञान-साहित्य में सामान्य और निश्चित परिणाम व्यक्त कर सकती है; हिन्दी का सामान्य वर्तमान नीतिवचन की शैली और परिणाम की अनिवार्यता दोनों को स्वाभाविक रूप से रखता है।
- source_word: בְּאֵין
  choice: के अभाव में
  rationale: בְּ के साथ אֵין परिस्थिति और कारण दोनों का बोध कराता है; यह प्रयोग हिन्दी में दोनों आयामों को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द सुधारने वाली शिक्षा, ताड़ना और चरित्र-निर्माण का भाव रखता है; ‘अनुशासन’ केवल सूचना देने की अपेक्षा इस व्यापक नैतिक अर्थ को बेहतर व्यक्त करता है।
- source_word: וּבְרֹב
  choice: और ... अपार ... के कारण
  rationale: רֹב मात्रा की बहुतायत या प्रचुरता बताता है। ‘अपार’ इस तीव्रता को सहज हिन्दी में रखता है, जबकि ‘के कारण’ इस प्रसंग में בְּ के परिणामकारी संबंध को स्पष्ट करता है।
- source_word: אִוַּלְתּוֹ
  choice: अपनी ... मूर्खता
  rationale: यह ज्ञान-साहित्य की नैतिक मूर्खता है, केवल बौद्धिक कमी नहीं। ‘अपनी मूर्खता’ स्वामित्व-सूचक प्रत्यय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁגֶּה
  choice: भटक जाता है
  rationale: שׁגה का अर्थ भटकना या मार्ग से चूकना है। यहाँ नैतिक और विनाशकारी पथभ्रष्टता अभिप्रेत है; अनुवाद मदहोशी या किसी बाहरी कर्ता द्वारा बहकाए जाने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הוּא
  choice: वह
  rationale: स्पष्ट सर्वनाम विषय पर हल्का बल देता है; हिन्दी में ‘वह’ इसे बिना अनावश्यक व्याख्या के बनाए रखता है।
