  yaml_path: translation/ot/proverbs/005/008.yaml
  text: Keep your way far from her[a], and do not go near the entrance of her house.
translation:
  language: hi
  text: अपना मार्ग उससे दूर रखो,[a] और उसके घर के द्वार के पास मत जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उससे दूर रहो, और उसके घर के द्वार के निकट मत जाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְחֵק
  choice: दूर रखो
  rationale: रחק का हिफ़ील आज्ञार्थक रूप दूरी बनाए रखने की सकर्मक आज्ञा देता है; ‘अपना मार्ग ... दूर रखो’ इस बल और मूल रूपक दोनों को सुरक्षित रखता है।
- source_word: מֵעָלֶיהָ
  choice: उससे
  rationale: यह पद उसकी निकटता या प्रभाव-क्षेत्र से अलग रहने का भाव देता है; दूरी का अर्थ पहले ही ‘दूर रखो’ में व्यक्त है।
- source_word: דַרְכֶּךָ
  choice: अपना मार्ग
  rationale: דֶּרֶךְ वास्तविक रास्ते और जीवन-आचरण, दोनों का रूपक हो सकता है; ‘मार्ग’ नीतिवचन की गरिमामय शैली और इस द्विअर्थी संभावना को बनाए रखता है।
- source_word: וְאַל תִּקְרַב
  choice: और ... पास मत जाओ
  rationale: निषेधात्मक रूप निकट जाने से रोकता है; ‘पास मत जाओ’ आधुनिक हिन्दी में स्वाभाविक है और गति की छवि बनाए रखता है।
- source_word: אֶל פֶּתַח
  choice: द्वार के पास
  rationale: פֶּתַח प्रवेश-स्थान, खुलाव या द्वार को दर्शाता है; ‘द्वार’ ठोस स्थानिक चेतावनी को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּיתָהּ
  choice: उसके घर
  rationale: בַּיִת का सीधा अर्थ ‘घर’ है और यहाँ स्थान संबंधी चेतावनी के अनुकूल है।
