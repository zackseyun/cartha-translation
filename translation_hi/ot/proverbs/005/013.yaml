  text: and I did not listen to the voice of my instructors[a], nor did I incline my ear to my teachers.
translation:
  language: hi
  text: और मैंने अपने शिक्षकों की बात नहीं सुनी[a], न अपने अध्यापकों की बात पर कान लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने शिक्षकों की बात नहीं मानी।” ज्ञान-साहित्य के इस संदर्भ में इब्रानी क्रिया सुनने के साथ आज्ञा मानने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: बात नहीं सुनी
  rationale: שׁמע בקול का अर्थ किसी की आवाज़/बात सुनना और उस पर ध्यान देना, यहाँ तक कि उसका पालन करना भी हो सकता है। आधुनिक हिन्दी में ‘बात सुनना’ स्वाभाविक है और सुनने तथा मानने—दोनों की अर्थ-छाया बनाए रखता है।
- source_word: מוֹרָי
  choice: अपने उपदेशकों
  rationale: ירה से निकला यह रूप शिक्षा या निर्देश देने वालों को दर्शाता है। ‘उपदेशकों’ से अगले מְלַמְּדַי के ‘शिक्षकों’ से हल्का भेद बना रहता है, बिना किसी विशिष्ट धार्मिक पद का संकेत दिए।
- source_word: מְלַמְּדַי
  choice: अपने शिक्षकों
  rationale: למד से बना यह शब्द सिखाने वालों के लिए है; ‘शिक्षकों’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: הִטִּיתִי אָזְנִי
  choice: कान लगाया
  rationale: शाब्दिक रूप से ‘अपना कान झुकाया’ ध्यानपूर्वक सुनने का मुहावरा है। ‘कान लगाया’ हिन्दी में इसी रूपक को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: וְ...וְלֹא
  choice: और ... न
  rationale: दोनों नकारात्मक उपवाक्यों का समन्वय हिन्दी में ‘और ... न’ द्वारा संक्षिप्त और स्वाभाविक रूप से व्यक्त किया गया है।
