  yaml_path: translation/ot/proverbs/005/017.yaml
  text: Let them be for you alone[a], and not for strangers with you.
translation:
  language: hi
  text: वे केवल तुम्हारे ही लिए हों[a], और तुम्हारे साथ परायों के लिए न हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे केवल तुम्हारे ही हों, और परायों के साथ बाँटे न जाएँ।” यह पद पिछले प्रसंग के सोतों और जलधाराओं के रूपक को आगे बढ़ाते हुए वैवाहिक संबंध की अनन्यता पर जोर देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: हों
  rationale: यहाँ अपूर्ण काल का रूप उपदेशात्मक/कामनार्थक बल रखता है; ‘हों’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְךָ לְבַדֶּךָ
  choice: केवल तुम्हारे ही लिए
  rationale: לְךָ स्वामित्व अथवा लाभ और לְבַדֶּךָ अनन्यता व्यक्त करता है; संयुक्त अनुवाद मूल के जोर को स्पष्ट और सहज रखता है।
- source_word: וְאֵין
  choice: नहीं
  rationale: अस्तित्ववाचक निषेध को दूसरे खंड में संक्षिप्त, स्वाभाविक निषेध के रूप में दिया गया है।
- source_word: לְזָרִים
  choice: परायों के लिए
  rationale: यहाँ זָרִים जातीय ‘विदेशियों’ के बजाय वैवाहिक संबंध से बाहर के लोगों को सूचित करता है; ‘पराये’ इस व्यापक अर्थ को बनाए रखता है।
- source_word: אִתָּךְ
  choice: तुम्हारे साथ
  rationale: सहभागिता के मूल संबंधसूचक अर्थ को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: पिछले पदों के सोतों/धाराओं के रूपक में अनन्यता
  choice: रूपक के बहुवचन संकेत को ‘वे’ से बनाए रखते हुए वैवाहिक निष्ठा का आशय निहित रखा गया है।
  alternative: रूपक को खोलकर सीधे पत्नी अथवा दाम्पत्य संबंध कहना।
  rationale: मूल पाठ रूपक को स्पष्ट रूप से नहीं खोलता; इसलिए उसकी वास्तविक काव्यात्मक अस्पष्टता और प्रसंगगत तनाव बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और संक्षिप्त उपदेशात्मक स्वर। ‘पराये’ को जातीय अर्थ वाले ‘विदेशी’ से बचने और संबंध से बाहर के लोगों का भाव व्यक्त करने के लिए चुना गया है।
