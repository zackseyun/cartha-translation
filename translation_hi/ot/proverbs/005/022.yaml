source:
  edition: WLC
  text: עַֽווֹנוֹתָ֗י/ו יִלְכְּדֻ/נ֥וֹ אֶת הָ/רָשָׁ֑ע וּ/בְ/חַבְלֵ֥י חַ֝טָּאת֗/וֹ יִתָּמֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/022.yaml
  text: His iniquities will capture the wicked man[b][a], and he will be held fast in the cords of his sin.
translation:
  language: hi
  text: 'दुष्ट को उसके अधर्मों पकड़ लेंगे,

    और वह अपने पाप की रस्सियों[a] में जकड़ा रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डोरियाँ”।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַוּוֹנוֹתָיו
  choice: उसके अपने अधर्म
  rationale: बहुवचन עָוֹן नैतिक बुराई और दोषपूर्ण कर्मों का भार व्यक्त करता है। “उसके अपने” से प्रत्यय का अर्थ और इस पद की प्रतिफलात्मक विडंबना स्वाभाविक हिन्दी में स्पष्ट होती है।
- source_word: יִלְכְּדֻנוֹ
  choice: पकड़ लेंगे
  rationale: לכד का अर्थ पकड़ना या बंदी बनाना है। यह चयन व्यक्ति के अपने अधर्मों द्वारा उसे धर लेने की सजीव छवि बनाए रखता है।
- source_word: הָרָשָׁע
  choice: दुष्ट
  rationale: यह निश्चित, एकवचन, पुल्लिंग विशेषण संज्ञा के रूप में प्रयुक्त है। “दुष्ट” हिन्दी में एक व्यक्ति को सूचित करते हुए ज्ञान-साहित्य की प्रतिनिधिक उक्ति को बनाए रखता है।
- source_word: וּבְחַבְלֵי
  choice: और ... की रस्सियों में
  rationale: חֶבֶל रस्सी, डोरी या बंधन को सूचित कर सकता है। “रस्सियों” से पकड़ने और जकड़ने की समानांतर छवि स्पष्ट रहती है।
- source_word: חַטָּאתוֹ
  choice: अपने पाप की
  rationale: एकवचन חַטָּאת यहाँ सामूहिक या भाववाचक अर्थ में है; “पाप” उसी संख्या और पाप के स्वयं बंधन बन जाने की छवि को सुरक्षित रखता है।
- source_word: יִתָּמֵךְ
  choice: जकड़ा रहेगा
  rationale: इस प्रसंग में תמך का निफ़अल रूप थामे या कसकर रोके जाने का भाव देता है। “जकड़ा रहेगा” निष्क्रिय बंधन और निरंतर फँसे रहने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नैतिक कर्तृत्व और अपने कर्मों में फँसने की छवि
  choice: दुष्ट अपने ही अधर्मों द्वारा पकड़ा और अपने पाप की रस्सियों में जकड़ा जाता है।
  alternative: इसे केवल बुरे कर्मों के सामान्य परिणामों का अमूर्त कथन मानना।
  rationale: दोनों समानांतर पंक्तियाँ अधर्म और पाप को पकड़ने तथा बाँधने के साधन के रूप में चित्रित करती हैं। अनुवाद इस नैतिक कारण-संबंध को रखता है, पर नियतिवाद या दंड की प्रक्रिया के बारे में कोई अतिरिक्त सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। “अधर्म,” “पाप,” “रस्सियों” और “जकड़ा” मूल की नैतिक गंभीरता तथा फँसने-बँधने की समानांतर छवि को साधारण पाठक के लिए स्पष्ट रखते हैं।
