  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַיֶּ֥לֶת אֲהָבִ֗ים וְֽ/יַעֲלַ֫ת חֵ֥ן דַּ֭דֶּי/הָ יְרַוֻּ֣/ךָ בְ/כָל עֵ֑ת בְּ֝/אַהֲבָתָ֗/הּ תִּשְׁגֶּ֥ה תָמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/019.yaml
  text: a loving doe[a], a graceful mountain goat—may her breasts satisfy you at all times[b]; be intoxicated always with her love.
translation:
  language: hi
  text: वह प्रेममयी हिरनी, वह मनोहर पहाड़ी बकरी[a]—उसके स्तन हर समय तुम्हें तृप्त करें; उसके प्रेम में सदा मदहोश रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनोहर आइबेक्स।” इब्रानी शब्द יַעֲלָה एक जंगली पहाड़ी बकरी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके प्रेम में सदा मग्न रहो।” यहाँ प्रयुक्त इब्रानी क्रिया का शाब्दिक अर्थ “भटकना” हो सकता है, पर इस प्रसंग में यह प्रेम से अभिभूत हो जाने के सकारात्मक भाव में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֶּלֶת אֲהָבִים
  choice: प्रेममयी हिरनी
  rationale: אַיֶּלֶת मादा हिरन को दर्शाता है और אֲהָבִים प्रेम से उसके संबंध या गुण को व्यक्त करता है। यह चयन काव्यात्मक पशु-बिंब और वैवाहिक प्रेम, दोनों को बनाए रखता है।
- source_word: וְיַעֲלַת חֵן
  choice: मनोहर पहाड़ी बकरी
  rationale: יַעֲלָה जंगली पहाड़ी बकरी या आइबेक्स है और חֵן मनोहरता या लावण्य को व्यक्त करता है। यह सहज हिन्दी में समानांतर काव्य-बिंब को सुरक्षित रखता है।
- source_word: דַּדֶּיהָ
  choice: उसके स्तन
  rationale: यह ठोस रूप से स्तनों को दर्शाता है। अध्याय के वैवाहिक और काम-संबंधी प्रसंग में स्पष्ट शारीरिक अभिव्यक्ति मूल पाठ के अनुरूप है।
- source_word: יְרַוֻּךָ
  choice: तुम्हें तृप्त करें
  rationale: रूट רוה भरपूर पीने, संतृप्त होने या पूरी तृप्ति पाने का भाव देता है। यहाँ 'तृप्त करें' स्वाभाविक हिन्दी में कामुक आनंद की पूर्णता व्यक्त करता है।
- source_word: בְכָל עֵת
  choice: हर समय
  rationale: यह कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בְּאַהֲבָתָהּ
  choice: उसके प्रेम में
  rationale: पूर्वसर्ग ב को यहाँ उस अवस्था या क्षेत्र के रूप में समझना सहज है जिसमें व्यक्ति मग्न रहता है; यह पत्नी के प्रेम पर केंद्रित रहता है।
- source_word: תִּשְׁגֶּה
  choice: मग्न रहो
  rationale: שׁגה सामान्यतः भटकने का अर्थ देता है, पर यहाँ प्रेम से अभिभूत या सुध-बुध खो देने का सकारात्मक, संभवतः विडंबनात्मक प्रयोग है। 'मग्न रहो' इसे स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: תָמִיד
  choice: सदा
  rationale: यह निरंतरता का सामान्य क्रियाविशेषण है; 'सदा' पद्यात्मक और स्पष्ट है।
theological_decisions:
- issue: ज्ञान-साहित्य में वैवाहिक कामुकता का स्पष्ट चित्रण
  choice: मूल पाठ के स्पष्ट वैवाहिक और कामुक बिंब को बिना शिष्टोक्तिपूर्ण नरमी के बनाए रखा गया।
  alternative: '''स्तन'' के स्थान पर ''वक्ष'' जैसे अपेक्षाकृत नरम शब्द का प्रयोग।'
  rationale: आसपास का प्रसंग अपनी पत्नी में आनंद को व्यभिचार के उचित विकल्प के रूप में प्रस्तुत करता है। मूल की ठोस भाषा को बनाए रखना पाठ में ऐसी संकोची व्याख्या जोड़ने से बचता है जो वहाँ उपस्थित नहीं है।
- issue: תִּשְׁגֶּה का सकारात्मक प्रयोग
  choice: प्रेम में 'मग्न रहो'।
  alternative: '''भटकते रहो'' या ''मदहोश रहो''।'
  rationale: क्रिया का सामान्य नकारात्मक अर्थ यहाँ प्रसंगानुसार प्रेम में बह जाने के सकारात्मक अर्थ में प्रयुक्त है। 'मग्न' सकारात्मक भाव को स्पष्ट करता है, जबकि पादटिप्पणी मूल क्रिया की अर्थगत तीव्रता और वैकल्पिक अनुवाद सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट किंतु गरिमापूर्ण वैवाहिक-कामुक भाषा, और मूल के समानांतर काव्य-बिंब को बनाए रखा गया है। 'पहाड़ी बकरी' सामान्य पाठक के लिए 'आइबेक्स' से अधिक तुरंत समझ में आता है; तकनीकी विकल्प पादटिप्पणी में दिया गया है।
