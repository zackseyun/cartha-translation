source:
  edition: WLC
  text: וְ/לָ֤/מָּה תִשְׁגֶּ֣ה בְנִ֣/י בְ/זָרָ֑ה וּ֝/תְחַבֵּ֗ק חֵ֣ק נָכְרִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/020.yaml
  text: Why[a], my son[b], should you go astray with a strange woman and embrace the bosom of a foreign woman?
translation:
  language: hi
  text: मेरे बेटे, तू पराई स्त्री के साथ क्यों भटके, और विदेशी स्त्री की गोद से क्यों लिपटे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पराई स्त्री’ और ‘विदेशी स्त्री’ इब्रानी के दो समानांतर पदों का अनुवाद हैं। इस प्रसंग में इनका आशय केवल जातीय विदेशीपन नहीं, बल्कि उचित वैवाहिक या वाचाई सीमाओं के बाहर की स्त्री भी हो सकता है। ‘गोद’ का शाब्दिक विकल्प ‘वक्ष’ है; इब्रानी में अंतरंग आलिंगन की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה
  choice: क्यों
  rationale: यह प्रश्नवाचक शब्द यहाँ समझाने और सावधान करने वाला आलंकारिक प्रश्न आरम्भ करता है।
- source_word: תִשְׁגֶּה
  choice: भटके
  rationale: क्रिया नैतिक मार्ग से भटकने का अर्थ देती है; प्रसंग में मोहित होने की छाया भी हो सकती है, जिसे 'भटके' बिना अतिव्याख्या के खुला रखता है।
- source_word: בְנִי
  choice: हे मेरे बेटे
  rationale: प्रथम पुरुष एकवचन प्रत्यय और नीतिवचन की पिता-पुत्र शिक्षात्मक संबोधन-शैली दोनों सुरक्षित रहते हैं।
- source_word: זָרָה
  choice: पराई स्त्री
  rationale: यहाँ आशय केवल जातीय रूप से विदेशी स्त्री नहीं, बल्कि उचित वैवाहिक संबंध से बाहर की स्त्री है। आधुनिक हिन्दी में 'पराई स्त्री' इस नैतिक-संबंधात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תְחַבֵּק
  choice: बाँहों में भरे
  rationale: यह חבק के अंतरंग आलिंगन को स्वाभाविक और काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: חֵק
  choice: बाँहों में
  rationale: शाब्दिक अर्थ छाती या गोद का क्षेत्र है; क्रिया के साथ हिन्दी मुहावरे 'बाँहों में भरना' में ढालने से अंतरंग आलिंगन का चित्र बना रहता है।
- source_word: נָכְרִיָּה
  choice: किसी दूसरी की पत्नी
  rationale: प्रसंग में यह वैवाहिक सीमा से बाहर की स्त्री को सूचित करता है। यह अनुवाद जातीय विदेशीपन का भ्रामक अर्थ टालता है, पर स्रोत के अधिक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: זָרָה और נָכְרִיָּה के समानांतर पदों का अर्थ
  choice: '''पराई स्त्री'' और ''किसी दूसरी की पत्नी'''
  alternative: '''अजनबी स्त्री'' और ''विदेशी स्त्री'''
  rationale: संदर्भ अनुचित यौन/वैवाहिक संबंध के विरुद्ध चेतावनी देता है, न कि जातीयता के विरुद्ध। मुख्य पाठ उस नैतिक और संबंधात्मक आशय को स्पष्ट करता है; पादटिप्पणी दूसरे पद की शाब्दिक व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। एकवचन आत्मीय संबोधन 'हे मेरे बेटे, तू' पिता-पुत्र शिक्षात्मक ढाँचे को बनाए रखता है। समानांतर स्त्री-संज्ञाओं को यांत्रिक रूप से 'विदेशी' नहीं बनाया गया, ताकि पद जातीय निषेध न लगे; स्रोत की ठोस देहगत छवि पादटिप्पणी में दी गई है।
