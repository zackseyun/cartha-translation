translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। विरोध को ‘किन्तु’ से स्पष्ट किया गया है। स्त्री-संदर्भ बनाए रखा गया है और इब्रानी की ‘उसका अन्त’ बनाम ‘अन्त में वह’ वाली अभिव्यक्तिगत सम्भावना पादटिप्पणी में सुरक्षित है।
