source:
  edition: WLC
  text: וְֽ֭/אַחֲרִיתָ/הּ מָרָ֣ה כַֽ/לַּעֲנָ֑ה חַ֝דָּ֗ה כְּ/חֶ֣רֶב פִּיּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/004.yaml
  text: but in the end she is bitter like wormwood[a], sharp like a two-edged sword.
translation:
  language: hi
  text: किन्तु अन्त में वह[a] नागदौने के समान कड़वी और दोधारी तलवार के समान धारदार होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “किन्तु उसका अन्त नागदौने के समान कड़वा और दोधारी तलवार के समान धारदार है।”'
    reason: וְאַחֲרִיתָהּ की शाब्दिक संज्ञात्मक रचना ‘उसका अन्त’ है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘अन्त में वह’ रखा गया है।
lexical_decisions:
- source_word: וְאַחֲרִיתָהּ
  choice: किन्तु अन्त में वह
  rationale: אַחֲרִיתָהּ का अर्थ ‘उसका अन्त/अन्तिम परिणाम’ है और आरम्भिक וְ यहाँ पिछले पद की मिठास के साथ विरोध दिखाता है। हिन्दी में ‘किन्तु अन्त में वह’ स्त्री-संदर्भ को स्पष्ट रखते हुए परिणाम का भाव स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: מָרָה
  choice: कड़वी
  rationale: यह स्त्रीलिंग विधेय विशेषण है। ‘कड़वी’ नागदौने की मूर्त उपमा और दुःखद परिणाम—दोनों अर्थों को बनाए रखता है।
- source_word: כַלַּעֲנָה
  choice: नागदौने के समान
  rationale: לַעֲנָה अत्यन्त कड़वे स्वाद के लिए प्रसिद्ध वनस्पति ‘wormwood’ है। हिन्दी बाइबलीय प्रयोग में ‘नागदौना’ इस ठोस वनस्पति-चित्र को सुरक्षित रखता है; पाठकों की सहायता के लिए संक्षिप्त पादटिप्पणी जोड़ी गई है।
- source_word: חַדָּה
  choice: धारदार
  rationale: חַדָּה का मूल अर्थ ‘तेज़/तीखा’ है। तलवार के प्रसंग में ‘धारदार’ आधुनिक हिन्दी में स्पष्ट है और ‘तेज़’ के ‘तीव्र गति’ वाले सम्भावित अर्थ से बचाता है।
- source_word: כְּחֶרֶב פִּיּוֹת
  choice: दोधारी तलवार के समान
  rationale: शाब्दिक रूप ‘धारों/मुखों वाली तलवार’ है और मुहावरे का आशय दोनों ओर धार वाली तलवार है। ‘दोधारी तलवार’ संक्षिप्त, प्रचलित और अर्थनिष्ठ है।
