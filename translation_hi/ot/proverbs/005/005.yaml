  text: רַ֭גְלֶי/הָ יֹרְד֣וֹת מָ֑וֶת שְׁ֝א֗וֹל צְעָדֶ֥י/הָ יִתְמֹֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/005.yaml
  text: Her feet go down to death[a]; her steps hold fast to Sheol.
translation:
  language: hi
  text: 'उसके पाँव मृत्यु की ओर उतरते हैं;

    उसके कदम शिओल[a] को थामे रहते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘कब्र’ या ‘मृतकों का लोक।’ इब्रानी में ‘शिओल।’
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֶיהָ
  choice: उसके पाँव
  rationale: बहुवचन रूप और स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय को बनाए रखते हुए ठोस शारीरिक बिंब सुरक्षित रखा गया है।
- source_word: יֹרְדוֹת
  choice: उतरते हैं
  rationale: क्रिया के नीचे जाने के मूल अर्थ और कृदंत के निरंतर/विशेषतापरक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द का सीधा अर्थ रखा गया है; इसे केवल संकट या विनाश कहकर हल्का नहीं किया गया।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: इब्रानी सांस्कृतिक और धर्मवैचारिक पद का लिप्यंतरण उसके विशिष्ट अर्थ तथा अंतर्निहित अस्पष्टता को सुरक्षित रखता है; अर्थ-सहायता पादटिप्पणी में दी गई है।
- source_word: צְעָדֶיהָ
  choice: उसके कदम
  rationale: बहुवचन के ठोस बिंब को बनाए रखता है और पहले चरण के ‘पाँव’ के साथ काव्यात्मक समानांतरता देता है।
- source_word: יִתְמֹכוּ
  choice: थामे रहते हैं
  rationale: תמך के पकड़ने/थामने के मूल भाव को व्यक्त करता है और इस प्रसंग में उसके मार्ग के शिओल से दृढ़ता से जुड़े होने का काव्यात्मक अर्थ बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: शिओल
  alternative: कब्र; मृतकों का लोक
  rationale: लिप्यंतरण इब्रानी ज्ञान-साहित्य के विशिष्ट पद को सुरक्षित रखता है और इसे केवल भौतिक कब्र या बाद की विकसित नरक-धारणा के रूप में निश्चित नहीं करता। विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों काव्य-पंक्तियों की समानांतर रचना तथा ‘पाँव/कदम’ और ‘मृत्यु/शिओल’ के बिंब सुरक्षित हैं।
