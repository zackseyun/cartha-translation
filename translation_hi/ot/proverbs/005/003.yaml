id: PRO.5.3
reference: Proverbs 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י נֹ֣פֶת תִּ֭טֹּפְנָה שִׂפְתֵ֣י זָרָ֑ה וְ/חָלָ֖ק מִ/שֶּׁ֣מֶן חִכָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/003.yaml
  text: For the lips of a forbidden woman drip honey[b][a], and her palate is smoother than oil.
translation:
  language: hi
  text: क्योंकि पराई स्त्री[a] के होंठ मधु टपकाते हैं, और उसका तालू[b] तेल से भी अधिक चिकना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अजनबी स्त्री,’ ‘विदेशी स्त्री’ अथवा ‘व्यभिचारिणी।’ नीतिवचन में यह इब्रानी शब्द प्रायः वैध यौन-संबंध की सीमा से बाहर की स्त्री के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: ‘तालू’ यहाँ लक्षणा से उसके मुँह या उसकी बातों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले उपदेश के लिए कारण प्रस्तुत करता है और प्रसंग का तार्किक संबंध बनाए रखता है।
- source_word: נֹפֶת
  choice: मधु
  rationale: यह छत्ते से बहने वाले मीठे शहद का बिंब है; क्रिया स्वयं टपकने का भाव व्यक्त करती है।
- source_word: תִּטֹּפְנָה
  choice: टपकाते हैं
  rationale: होंठों को कर्ता रखते हुए मूल के टपकने या चूने के कामुक रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שִׂפְתֵי
  choice: के होंठ
  rationale: रचनात्मक संबंध को स्पष्ट और मूल के निकट ढंग से व्यक्त करता है।
- source_word: זָרָה
  choice: पराई स्त्री
  rationale: नीतिवचन में यह प्रायः वैध यौन-संबंध की सीमा से बाहर की स्त्री को सूचित करता है; ‘पराई स्त्री’ नैतिक-संबंधपरक भाव रखता है, पर केवल जातीय विदेशिनी या हर स्थिति में विवाहित व्यभिचारिणी तक अर्थ को सीमित नहीं करता।
- source_word: וְחָלָק
  choice: और ... अधिक चिकना है
  rationale: מִן के साथ विशेषण तुलनात्मक अर्थ देता है; यह अभिव्यक्ति आकर्षक और फिसलनभरी वाणी की छवि को बनाए रखती है।
- source_word: מִשֶּׁמֶן
  choice: तेल से भी
  rationale: מִן तुलना का मानक बताता है; ‘भी’ हिन्दी में तुलना की तीव्रता को स्वाभाविक बनाता है।
- source_word: חִכָּהּ
  choice: उसका तालू
  rationale: शाब्दिक शारीरिक बिंब को सुरक्षित रखता है। यहाँ तालू लक्षणा से मुँह या उससे निकलने वाली बातों को सूचित कर सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: नीतिवचन के ज्ञान-साहित्यिक प्रसंग में זָרָה का अर्थ
  choice: पराई स्त्री
  alternative: अजनबी स्त्री; विदेशी स्त्री; व्यभिचारिणी
  rationale: शब्द का मुख्य बल निषिद्ध या अनुचित यौन-संबंध पर है। ‘पराई स्त्री’ इस नैतिक भाव को व्यक्त करता है, फिर भी जातीयता या वैवाहिक स्थिति से जुड़ी किसी एक संकीर्ण व्याख्या को अनिवार्य नहीं बनाता।
- issue: חִכָּהּ के शारीरिक बिंब और वाणी-संबंधी आशय का संबंध
  choice: मुख्य पाठ में ‘तालू’, पादटिप्पणी में लाक्षणिक अर्थ
  alternative: मुँह; बातें; वाणी
  rationale: ‘तालू’ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी पाठक को बताती है कि यहाँ आशय उसकी लुभावनी बातों से भी हो सकता है; इस प्रकार अनुवाद अंतर्निहित तनाव को चुपचाप समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, संक्षिप्त ज्ञान-साहित्यिक शैली रखी गई है। ‘मधु’ और ‘तालू’ काव्यात्मक शारीरिक बिंब को बनाए रखते हैं; अस्पष्ट शब्द זָרָה के विकल्प पादटिप्पणी में दिए गए हैं।
