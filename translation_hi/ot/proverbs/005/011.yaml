    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהַמְתָּ
  choice: और ... तुम कराहोगे
  rationale: נהם संकट और पीड़ा में निकली सुनाई देने वाली गहरी ध्वनि को व्यक्त करता है। ‘कराहोगे’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְאַחֲרִיתֶךָ
  choice: अपने अंत में
  rationale: אַחֲרִית जीवन के अंतिम समय और किसी मार्ग के अंतिम परिणाम—दोनों की ओर संकेत कर सकता है। ‘अपने अंत में’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
- source_word: בִּכְלוֹת
  choice: जब ... चुक जाएँगे
  rationale: כלה का यह रूप यहाँ समय अथवा परिस्थिति बताता है और शरीर के समाप्त या क्षीण हो जाने का भाव देता है। ‘चुक जाएँगे’ शारीरिक विनाश को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּשָׂרְךָ
  choice: तुम्हारा मांस
  rationale: בשר का ठोस अर्थ ‘मांस’ है। इसे बनाए रखने से अगले समानांतर शब्द שאר के साथ मूल का द्विपदीय शारीरिक चित्र सुरक्षित रहता है।
- source_word: וּשְׁאֵרֶךָ
  choice: और शरीर
  rationale: इस प्रसंग में שאר, בשר के समानांतर, देह या शरीर का बोध देता है। ‘शरीर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
