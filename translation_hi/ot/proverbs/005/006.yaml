source:
  edition: WLC
  text: אֹ֣רַח חַ֭יִּים פֶּן תְּפַלֵּ֑ס נָע֥וּ מַ֝עְגְּלֹתֶ֗י/הָ לֹ֣א תֵדָֽע־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/006.yaml
  text: Lest she should level the path of life[a], her tracks wander[b]; she does not know it.
translation:
  language: hi
  text: कहीं वह जीवन के मार्ग को समतल न कर ले[a]; उसकी राहें डगमगाती हैं; वह यह नहीं जानती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा न हो कि तू जीवन के मार्ग पर विचार करे; उसकी राहें भटकती हैं।” इस पद की हिब्रू रचना संक्षिप्त है और इसे एक से अधिक प्रकार से समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू यह नहीं जानता,” यदि अंतिम उपवाक्य को उस स्त्री का वर्णन करने के बजाय श्रोता को संबोधन माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: जीवन का मार्ग
  rationale: אֹרַח का अर्थ मार्ग या राह है और חַיִּים इसे जीवन के मार्ग के रूप में निर्धारित करता है। यह चयन मूल के ठोस मार्ग-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: פֶּן
  choice: कहीं … न
  rationale: פֶּן सामान्यतः आशंका, रोक या नकारात्मक प्रयोजन प्रकट करता है। हिन्दी में ‘कहीं … न’ चेतावनी की इसी छाया को सहज रूप से व्यक्त करता है।
- source_word: תְּפַלֵּס
  choice: समतल कर ले
  rationale: פלס के पिएल रूप में मार्ग को समतल या सीधा करने और तौलने/परखने की अर्थ-सम्भावनाएँ हैं। यहाँ मार्ग के रूपक के कारण ‘समतल’ मूल बिंब को सीधे बनाए रखता है।
- source_word: מַעְגְּלֹתֶיהָ
  choice: उसकी पगडंडियाँ
  rationale: מַעְגָּל किसी बने हुए रास्ते, पथ या पगडंडी को दर्शाता है। ‘पगडंडियाँ’ पहले प्रयुक्त ‘मार्ग’ से शब्दगत भेद रखते हुए यात्रा का रूपक बनाए रखता है।
- source_word: נָעוּ
  choice: भटकती रहती हैं
  rationale: क्रिया डोलने, अस्थिर होने या इधर-उधर फिरने का भाव देती है। रास्तों के संदर्भ में ‘भटकती रहती हैं’ नैतिक और दिशागत अस्थिरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תֵדָע
  choice: वह यह नहीं जानती
  rationale: सन्दर्भ में स्त्रीलिंग कर्ता पूर्ववर्ती स्त्री है। ‘यह’ उसकी पगडंडियों के भटकने या जीवन के मार्ग से उसके सम्बन्ध की ओर संकेत करता है; फिर भी क्रियारूप को दूसरे पुरुष के रूप में समझने की सम्भावना टिप्पणी में रखी गई है।
theological_decisions:
- issue: अन्तिम उपवाक्य का कर्ता
  choice: 'निषिद्ध स्त्री का वर्णन जारी रहता है: ‘वह यह नहीं जानती।’'
  alternative: 'श्रोता/पुत्र को सम्बोधन: ‘तू यह नहीं जानता।’'
  rationale: नीतिवचन 5:3–6 में वर्णन लगातार उसी स्त्री पर केन्द्रित है, इसलिए स्त्रीलिंग कर्ता प्रसंग का प्रवाह बनाए रखता है। फिर भी תֵדָע को दूसरे पुरुष एकवचन के रूप में भी पढ़ा जा सकता है, अतः विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पहले उपवाक्य की वाक्य-रचना
  choice: 'פֶּן को आशंकासूचक मानकर: ‘कहीं वह जीवन के मार्ग को समतल न कर ले।’'
  alternative: ‘तू जीवन के मार्ग पर विचार न करे; उसकी राहें भटकती हैं।’
  rationale: हिब्रू वाक्य अत्यन्त संक्षिप्त है और פֶּן तथा תְּפַלֵּס के सम्बन्ध को एक से अधिक प्रकार से समझा गया है। मुख्य पाठ मार्ग को समतल करने का ठोस रूपक और नकारात्मक आशंका बनाए रखता है, जबकि वैकल्पिक विश्लेषण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मार्ग’, ‘समतल’ और ‘पगडंडियाँ’ मूल के विस्तृत यात्रा-रूपक को सँजोते हैं। हिब्रू की वास्तविक वाक्यगत और कर्ता-सम्बन्धी अस्पष्टता को दो पादटिप्पणियों में सुरक्षित रखा गया है।
