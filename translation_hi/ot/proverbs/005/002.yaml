  yaml_path: translation/ot/proverbs/005/002.yaml
  text: so that you may keep discretion[b][a], and your lips may guard knowledge.
translation:
  language: hi
  text: ताकि तुम सूझ-बूझ[a] बनाए रखो और तुम्हारे होंठ[b] ज्ञान की रक्षा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवेक” अथवा “सही निर्णय-क्षमता”।
    reason: lexical_alternative
  - marker: b
    text: “होंठ” से आशय वाणी भी हो सकता है—ऐसी वाणी जो ज्ञान को सँभालती या व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: ताकि तुम ... बनाए रखो
  rationale: ल-prefix वाला infinitive construct यहाँ पिछले पद की शिक्षा का उद्देश्य व्यक्त करता है। यह रूप उद्देश्य-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है और ‘रखना/सुरक्षित रखना’ का भाव बनाए रखता है।
- source_word: מְזִמּוֹת
  choice: सूझ-बूझ
  rationale: नीतिवचन के सकारात्मक ज्ञान-साहित्यिक संदर्भ में यह शब्द विवेकपूर्ण सोच, समझदारी और उचित निर्णय-क्षमता को दर्शाता है; ‘सूझ-बूझ’ आधुनिक हिन्दी में इस व्यापक भाव को सहज रूप से व्यक्त करता है।
- source_word: וְדַעַת
  choice: ज्ञान
  rationale: दָּעַת नीतिवचन में प्रायः नैतिक और व्यावहारिक ज्ञान को दर्शाता है। ‘ज्ञान’ इसके मूल शब्दार्थ और पुस्तक में इसकी शब्दावली-संगति को सुरक्षित रखता है।
- source_word: שְׂפָתֶיךָ
  choice: तुम्हारे होंठ
  rationale: इब्रानी का ठोस शारीरिक बिंब बनाए रखा गया है। यहाँ होंठ लाक्षणिक रूप से वाणी को दर्शाते हैं, पर शाब्दिक बिंब हिन्दी में भी स्वाभाविक और काव्यात्मक है।
- source_word: יִנְצֹרוּ
  choice: रक्षा करें
  rationale: नצר में पहरा देने, सुरक्षित रखने और सँभालने का भाव है। ‘रक्षा करें’ पहले खंड के ‘बनाए रखो’ से उपयोगी भिन्नता रखते हुए संरक्षण का भाव व्यक्त करता है; क्रिया का विध्यर्थक रूप उद्देश्य/परिणाम की छाया बनाए रखता है।
