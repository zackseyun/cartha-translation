  - marker: b
    text: या ‘किसी क्रूर व्यक्ति को’ या ‘किसी बेरहम को।’
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अनचाहे परिणाम की चेतावनी देता है; यह हिंदी प्रयोग इब्रानी की निषेधात्मक आशंका को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּתֵּן
  choice: दे दो
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है; ‘दे दो’ प्रसंग में किसी मूल्यवान वस्तु के हाथ से निकल जाने का भाव भी रखता है।
- source_word: לַאֲחֵרִים
  choice: दूसरों को
  rationale: बहुवचन रूप का सीधा और व्यापक अर्थ है; ‘परायों’ की तुलना में यह अनावश्यक रूप से विदेशीपन का भाव नहीं जोड़ता।
- source_word: הוֹדֶךָ
  choice: अपना सम्मान
  rationale: הוֹד सम्मान, वैभव या तेज को सूचित कर सकता है। इस प्रसंग में ‘सम्मान’ व्यक्तिगत गरिमा और प्रतिष्ठा की हानि को स्वाभाविक रूप से व्यक्त करता है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וּשְׁנֹתֶיךָ
  choice: अपने जीवन के वर्ष
  rationale: शाब्दिक ‘अपने वर्ष’ हिंदी में अस्पष्ट लग सकता है; ‘अपने जीवन के वर्ष’ आयु या जीवनकाल का आशय स्पष्ट करता है।
- source_word: לְאַכְזָרִי
  choice: किसी निर्दयी को
  rationale: एकवचन विशेषण संज्ञा की तरह प्रयुक्त है। ‘किसी निर्दयी को’ संभावित मानवीय संदर्भ को खुला रखते हुए मूल की संक्षिप्तता और अनिश्चितता बनाए रखता है।
