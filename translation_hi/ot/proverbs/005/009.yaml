  text: lest you give your honor to others[b][a], and your years to the cruel one.
translation:
  language: hi
  text: कहीं ऐसा न हो कि तुम अपना सम्मान[a] दूसरों को दे दो और अपने जीवन के वर्ष किसी निर्दयी को[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना वैभव,’ ‘अपना तेज,’ या ‘अपनी शक्ति।’
