source:
  edition: WLC
  text: יָפ֣וּצוּ מַעְיְנֹתֶ֣י/ךָ ח֑וּצָ/ה בָּ֝/רְחֹב֗וֹת פַּלְגֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/005/016.yaml
  text: Should your springs be scattered abroad[b][a], streams of water in the streets?
translation:
  language: hi
  text: क्या तुम्हारे सोते बाहर फैल जाएँ, और पानी की धाराएँ सड़कों पर बहें?[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में इसका अनुवाद हो सकता है, “तुम्हारे सोते बाहर फैलें—पानी की धाराएँ सड़कों पर।” इब्रानी क्रियारूप ऐसा पढ़ा जा सकता है, पर व्यापक प्रसंग आलंकारिक प्रश्न का प्रबल समर्थन करता है।
    reason: alternative_reading
  - marker: b
    text: वैवाहिक निष्ठा के इस प्रसंग में जल का यह चित्र पुरुष की यौन-शक्ति और उसकी संतान की ओर रूपकात्मक संकेत करता है (नीतिवचन 5:15–18 देखें)।
    reason: cross_reference
lexical_decisions:
- source_word: יָפ֣וּצוּ
  choice: फैल जाएँ
  rationale: काल क्रिया का मूल भाव बिखरने या फैल जाने का है। प्रश्नवाचक रचना प्रसंग में निहित निषेधात्मक चेतावनी को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: מַעְיְנֹתֶיךָ
  choice: तुम्हारे सोते
  rationale: מַעְיָן प्राकृतिक जल-स्रोत या सोते को दर्शाता है। ‘सोते’ जल-रूपक और काव्यात्मक समानांतरता दोनों को बनाए रखता है।
- source_word: חוּצָה
  choice: बाहर
  rationale: यह दिशा-सूचक क्रियाविशेषण बाहर या बाहरी स्थान की ओर जाने का भाव देता है। ‘बाहर’ सरल और सटीक आधुनिक हिन्दी है।
- source_word: בָּרְחֹבוֹת
  choice: सड़कों पर
  rationale: רְחֹבוֹת खुले सार्वजनिक स्थानों, चौकों या चौड़ी सड़कों को सूचित कर सकता है। यहाँ ‘सड़कों पर’ निजी वैवाहिक क्षेत्र के विपरीत सार्वजनिक स्थान का भाव स्पष्ट करता है।
- source_word: פַּלְגֵי מָיִם
  choice: पानी की धाराएँ
  rationale: פֶּלֶג जल की धारा, नहर या प्रवाह को दर्शाता है। ‘पानी की धाराएँ’ सामान्य पाठक के लिए स्पष्ट है और सोतों के साथ काव्यात्मक समानांतरता रखता है।
theological_decisions:
- issue: पंक्ति को कथन/आज्ञा माना जाए या आलंकारिक प्रश्न
  choice: 'आलंकारिक प्रश्न: ‘क्या तुम्हारे सोते बाहर फैल जाएँ...?’'
  alternative: 'आज्ञार्थक या इच्छार्थक कथन: ‘तुम्हारे सोते बाहर फैलें...’'
  rationale: इब्रानी क्रियारूप को इच्छार्थक ढंग से समझना संभव है, पर नीतिवचन 5:15–17 का निकट प्रसंग वैवाहिक निष्ठा और अनन्यता पर बल देता है। आलंकारिक प्रश्न उस प्रवाह को बनाए रखता है और पाठ में कोई अतिरिक्त निषेध नहीं जोड़ता।
- issue: जल-रूपक का अभिप्राय
  choice: रूपक को मुख्य पाठ में बिना खोले सुरक्षित रखना
  alternative: मुख्य पाठ में इसे पुरुष की यौन-शक्ति या संतान के रूप में स्पष्ट कर देना
  rationale: मूल पाठ जानबूझकर जल की काव्यात्मक भाषा रखता है। उसका प्रसंगगत अर्थ पाद-टिप्पणी में बताना बेहतर है, ताकि रूपक और उसकी अर्थ-व्याप्ति दोनों सुरक्षित रहें।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सोते’ तथा ‘पानी की धाराएँ’ मूल काव्यात्मक जल-चित्र को बनाए रखते हैं; डैश दूसरी पंक्ति को पहली की समानांतर व्याख्या के रूप में प्रस्तुत करता है।
