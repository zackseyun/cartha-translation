base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/015.yaml
  text: The way of a fool is right in his own eyes[b][a], but he who listens to counsel is wise.
translation:
  language: hi
  text: मूर्ख का मार्ग उसकी अपनी दृष्टि में सही है[b][a], पर जो सलाह सुनता है, वह बुद्धिमान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख को अपना मार्ग सही लगता है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “उसकी अपनी आँखों में,” एक मुहावरा है जो व्यक्ति के अपने निर्णय या आत्म-मूल्यांकन को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: नीतिवचन के ज्ञान-साहित्य में यह जीवन की दिशा या आचरण का रूपक है; ‘मार्ग’ उस चित्रात्मकता को बनाए रखता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह शब्द ऐसी बुद्धिहीनता को दर्शाता है जिसमें नैतिक और व्यावहारिक विवेक की कमी शामिल है; ‘मूर्ख’ इसका स्वाभाविक और स्थापित हिन्दी समतुल्य है।
- source_word: יָשָׁר
  choice: सही
  rationale: यहाँ अर्थ किसी व्यक्ति के अपने आकलन में ठीक या उचित होने का है, न कि वस्तुनिष्ठ नैतिक खराई का।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: इब्रानी मुहावरा व्यक्ति के निजी निर्णय या आत्म-मूल्यांकन को व्यक्त करता है; यह हिन्दी रूप अर्थ और मुहावरे दोनों को स्पष्ट रखता है।
- source_word: וְשֹׁמֵעַ
  choice: पर जो ... सुनता है
  rationale: वाव यहाँ दोनों पंक्तियों का विरोध दिखाता है; कृदन्त एक ऐसे सामान्य व्यक्ति को दर्शाता है जिसकी विशेषता सुनना है।
- source_word: לְעֵצָה
  choice: सलाह
  rationale: यह विचारपूर्वक दी गई सम्मति या मार्गदर्शन को दर्शाता है और साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חָכָם
  choice: बुद्धिमान है
  rationale: विधेय रूप मूर्ख और सलाह सुनने वाले के बीच विरोध को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: सामान्य अर्थ वाले पुल्लिंग एकवचन रूप
  choice: ‘उसकी’ और ‘जो ... वह’ के द्वारा एकवचन प्रतिनिधिक कथन बनाए रखा गया है।
  alternative: ‘अपनी दृष्टि में’ अथवा स्पष्ट बहुवचन/लिंग-निरपेक्ष रचना
  rationale: इब्रानी में व्याकरणिक पुल्लिंग एकवचन सामान्य प्रतिनिधिक अर्थ में है। हिन्दी अनुवाद स्रोत की एकवचन संरचना को रखते हुए कथन को किसी एक जैविक लिंग तक सीमित नहीं करता।
- issue: יָשָׁר का वस्तुनिष्ठ या आत्म-मूल्यांकन संबंधी अर्थ
  choice: ‘उसकी अपनी दृष्टि में सही’
  alternative: ‘उसे सही लगता है’
  rationale: मुख्य पाठ इब्रानी के ‘उसकी आँखों में’ मुहावरे की छवि को निकटता से बचाता है, जबकि संदर्भ स्पष्ट करता है कि यह मूर्ख का निजी आकलन है, वस्तुनिष्ठ स्वीकृति नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘मार्ग’ ज्ञान-साहित्य की रूपकात्मक भाषा को सुरक्षित रखता है, जबकि ‘सलाह’ सामान्य पाठक के लिए ‘परामर्श’ की अपेक्षा अधिक स्वाभाविक है।
