  text: חָמַ֣ד רָ֭שָׁע מְצ֣וֹד רָעִ֑ים וְ/שֹׁ֖רֶשׁ צַדִּיקִ֣ים יִתֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/012.yaml
  text: A wicked man desires the prey of evil men[b][a], but the root of the righteous yields fruit.
translation:
  language: hi
  text: दुष्ट व्यक्ति बुरे लोगों की लूट की लालसा करता है,[a] पर धर्मियों की जड़ फल देती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्ट व्यक्ति बुरे लोगों के जाल की लालसा करता है।” यह इब्रानी संज्ञा कठिन है और इसका अर्थ जाल, फंदा, शिकार या लूट हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “धर्मियों की जड़ देती है।” यहाँ “फल” वृक्ष के चित्र में निहित अर्थ को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָמַד
  choice: लालसा करता है
  rationale: यह क्रिया प्रबल इच्छा व्यक्त करती है। प्रसंग इसे नकारात्मक रंग देता है, पर मूल क्रिया अपने आप में केवल अवैध लोभ तक सीमित नहीं है।
- source_word: רָשָׁע
  choice: दुष्ट व्यक्ति
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में सामान्य प्रकार के व्यक्ति को दर्शाता है। यह आधुनिक हिन्दी में स्वाभाविक और लिंग की दृष्टि से अनावश्यक रूप से सीमित न करने वाला प्रयोग है।
- source_word: מְצוֹד
  choice: लूट
  rationale: यह कठिन शब्द जाल, फंदा, शिकार या लूटी हुई वस्तु का अर्थ दे सकता है। यहाँ वह वस्तु जिसे बुरे लोग पकड़ते या हासिल करते हैं, समानांतर पंक्ति के साथ अच्छा बैठती है; इसलिए मुख्य पाठ में ‘लूट’ रखा गया और अन्य सम्भावना पादटिप्पणी में दी गई है।
- source_word: רָעִים
  choice: बुरे लोगों की
  rationale: बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है। यह उस समूह को सहज हिन्दी में व्यक्त करता है जिसकी प्राप्ति की दुष्ट व्यक्ति लालसा करता है।
- source_word: שֹׁרֶשׁ
  choice: जड़
  rationale: मूल में वनस्पति-संबंधी चित्र है; ‘जड़’ उसे सीधे और स्पष्ट रूप से बनाए रखती है।
- source_word: צַדִּיקִים
  choice: धर्मियों की
  rationale: यह बहुवचन विशेषण संज्ञा के रूप में उन लोगों के वर्ग को दर्शाता है जो धर्मी हैं। ‘धर्मी’ हिन्दी बाइबलीय भाषा में परिचित और गरिमापूर्ण है।
- source_word: יִתֵּן
  choice: फल देती है
  rationale: शाब्दिक अर्थ ‘देती है’ है। ‘जड़’ के साथ निहित कृषि-चित्र को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘फल देती है’ कहा गया है।
