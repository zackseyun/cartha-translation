  text: עֹבֵ֣ד אַ֭דְמָת/וֹ יִֽשְׂבַּֽע לָ֑חֶם וּ/מְרַדֵּ֖ף רֵיקִ֣ים חֲסַר לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/011.yaml
  text: Whoever works his land will have plenty of bread[a], but he who pursues empty things lacks sense.
translation:
  language: hi
  text: जो अपनी भूमि पर मेहनत करता है, वह भरपेट रोटी खाएगा; परन्तु जो व्यर्थ चीज़ों[a] के पीछे भागता है, उसमें समझ की कमी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निकम्मे लोगों’; इब्रानी में शब्द का अर्थ ‘खाली/व्यर्थ चीज़ें’ हो सकता है, और इसे लोगों के लिए भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵד
  choice: मेहनत करता है
  rationale: यहाँ क्रिया कृषि-भूमि पर परिश्रम करने को दर्शाती है। ‘मेहनत करता है’ सामान्य पाठक के लिए स्वाभाविक है और खेती के श्रम का आशय स्पष्ट करता है।
- source_word: אַדְמָתוֹ
  choice: अपनी भूमि
  rationale: אַדָמָה का अर्थ भूमि, जमीन या मिट्टी हो सकता है। कृषि-संबंधी इस नीति-वचन में ‘अपनी भूमि’ सहज और सटीक है।
- source_word: יִשְׂבַּע לָחֶם
  choice: भरपेट रोटी खाएगा
  rationale: इब्रानी पदबंध का शाब्दिक भाव ‘रोटी से तृप्त होगा’ है। ‘भरपेट रोटी खाएगा’ पर्याप्त भोजन मिलने का भाव और रोटी का ठोस बिंब दोनों बनाए रखता है।
- source_word: וּמְרַדֵּף
  choice: परन्तु जो ... के पीछे भागता है
  rationale: संयोजक यहाँ समानांतर पंक्तियों के बीच विरोध दिखाता है, इसलिए ‘परन्तु’ उपयुक्त है। ‘के पीछे भागता है’ किसी निष्फल लक्ष्य का लगातार पीछा करने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רֵיקִים
  choice: व्यर्थ बातों
  rationale: רֵיקִים का शाब्दिक अर्थ ‘खाली जन/वस्तुएँ’ है और यह व्यर्थ वस्तुओं, कामों या लोगों की ओर संकेत कर सकता है। मुख्य पाठ में ‘व्यर्थ बातों’ निष्फल pursuits का व्यापक अर्थ देता है; व्यक्ति-वाचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: חֲסַר לֵב
  choice: उसमें समझ की कमी है
  rationale: यह मुहावरा शाब्दिक रूप से ‘हृदय की कमी वाला’ है, जहाँ ‘हृदय’ विवेक और समझ का केंद्र है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है और ज्ञान-साहित्य का आशय बनाए रखता है।
