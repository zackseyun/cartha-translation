  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीति-वचनात्मक स्वर रखा गया है। अर्धविराम से विरोधी समानांतरता उभरती है। ‘रोटी’ का मूल कृषि-बिंब और רֵיקִים की वास्तविक संदिग्धता सुरक्षित रखी गई है।
