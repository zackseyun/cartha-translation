  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דִּבְרֵ֣י רְשָׁעִ֣ים אֱרָב דָּ֑ם וּ/פִ֥י יְ֝שָׁרִ֗ים יַצִּילֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/006.yaml
  text: The words of the wicked are an ambush for blood[b][a], but the mouth of the upright delivers them.
translation:
  language: hi
  text: 'दुष्टों की बातें खून बहाने के लिए घात लगाती हैं,[a]

    पर सीधे-सच्चे लोगों का मुँह उन्हें बचा लेता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खून के लिए घात हैं।” इब्रानी अभिव्यक्ति दुष्टों की बातों को जानलेवा घात के रूप में चित्रित करती है।
    reason: lexical_alternative
  - marker: b
    text: '“उन्हें” से सामान्यतः वे लोग समझे जा सकते हैं जिन पर ऐसी हिंसा का खतरा है। कुछ लोग इसका भाव आत्मवाचक मानते हैं: “सीधे-सच्चे लोगों का मुँह उन्हें स्वयं बचाता है,” या केवल “बचा लेता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי רְשָׁעִים
  choice: दुष्टों की बातें
  rationale: निर्मित बहुवचन דִּבְרֵי यहाँ बोले गए शब्दों या बातों को दर्शाता है। ‘दुष्टों की बातें’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक विरोध को बनाए रखता है।
- source_word: אֱרָב דָּם
  choice: खून बहाने के लिए घात लगाती हैं
  rationale: इब्रानी अभिव्यक्ति घात लगाकर हिंसक मृत्यु या रक्तपात कराने का चित्र प्रस्तुत करती है। हिन्दी में क्रियात्मक रूप स्वाभाविक है, जबकि ‘घात’ और ‘खून’ मूल बिंब को बनाए रखते हैं।
- source_word: וּפִי
  choice: पर ... का मुँह
  rationale: וּ यहाँ विरोध प्रकट करता है। ‘मुँह’ को ‘बातें’ या ‘वाणी’ से बदलने के बजाय मूल इब्रानी बिंब और दोनों पंक्तियों की समानांतरता सुरक्षित रखी गई है।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोग
  rationale: यह नैतिक रूप से सीधे और सत्यनिष्ठ लोगों के लिए प्रयुक्त विशेषण-संज्ञा है। ‘सीधे-सच्चे’ सामान्य पाठक के लिए स्पष्ट है और केवल व्यावसायिक ईमानदारी तक अर्थ सीमित नहीं करता।
- source_word: יַצִּילֵם
  choice: उन्हें बचा लेता है
  rationale: हिफ़ील रूप का अर्थ ‘छुड़ाना, बचाना’ है। पुल्लिंग बहुवचन कर्म-प्रत्यय को ‘उन्हें’ के रूप में स्पष्ट रखा गया है, पर उसका सटीक संदर्भ मुख्य पाठ में निर्धारित नहीं किया गया।
theological_decisions:
- issue: יַצִּילֵם में ‘उन्हें’ का संदर्भ
  choice: ‘उन्हें’ को उन लोगों के सामान्य संकेत के रूप में खुला रखा गया है जो हिंसा के संकट में हैं।
  alternative: इसे आत्मवाचक अर्थ में ‘अपने आपको बचाता है’ समझना।
  rationale: इब्रानी रूप में तृतीय पुरुष बहुवचन कर्म-प्रत्यय है; उसका पूर्वपद स्पष्ट नहीं है। इसलिए अनुवाद मूल अस्पष्टता को बनाए रखता है और आत्मवाचक व्याख्या को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता में ‘बातें’ और ‘मुँह’ के बिंब सुरक्षित हैं। ‘खून बहाने’ से דָּם का हिंसक रक्तपात वाला आशय स्पष्ट होता है, और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
