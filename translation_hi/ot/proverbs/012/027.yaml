  yaml_path: translation/ot/proverbs/012/027.yaml
  text: A lazy man does not roast his game[b][a], but diligence is a man’s precious wealth.
translation:
  language: hi
  text: आलसी व्यक्ति अपने शिकार को नहीं भूनता[a], पर परिश्रम मनुष्य की बहुमूल्य संपत्ति है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आलसी व्यक्ति अपना शिकार नहीं पकड़ता” अथवा “उसे तैयार नहीं करता।” क्रिया को ‘भूनना’ के ठोस अर्थ के बजाय शिकार पाने या तैयार करने के व्यापक अर्थ में भी लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी खंड अत्यंत संक्षिप्त है। इसका अनुवाद “पर परिश्रमी मनुष्य की संपत्ति बहुमूल्य है” भी संभव है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַחֲרֹךְ
  choice: भूनता
  rationale: חרך का ठोस अर्थ आग से झुलसाना या भूनना है। ‘शिकार’ के साथ यह उस आलसी व्यक्ति का चित्र प्रस्तुत करता है जो प्राप्त वस्तु का भी उपयोग करने का श्रम नहीं करता।
- source_word: רְמִיָּה
  choice: आलसी व्यक्ति
  rationale: नीतिवचन में यह शब्द छल की अपेक्षा ढिलाई, सुस्ती या लापरवाही का भाव दे सकता है; अगले खंड के חָרוּץ से इसका विरोध भी आलस्य का अर्थ पुष्ट करता है। ‘व्यक्ति’ सामान्य मानवीय संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צֵידוֹ
  choice: अपने शिकार को
  rationale: צַיִד शिकार किए गए पशु या शिकार से मिले आहार को दर्शाता है। ‘अपने शिकार को’ भूनने के चित्र से सहज रूप से जुड़ता है।
- source_word: הוֹן
  choice: संपत्ति
  rationale: הוֹן धन, वैभव या संपत्ति को दर्शाता है। यहाँ ‘संपत्ति’ परिश्रम के मूल्य को स्पष्ट और लोकोक्तिपूर्ण ढंग से व्यक्त करती है।
- source_word: אָדָם
  choice: मनुष्य की
  rationale: אָדָם यहाँ सामान्य रूप से मनुष्य को दर्शाता है। ‘मनुष्य’ आधुनिक हिन्दी में इस सार्वभौमिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָקָר
  choice: बहुमूल्य
  rationale: יָקָר मूल्यवान, अनमोल या बहुमूल्य होने का भाव देता है; ‘बहुमूल्य’ संपत्ति के साथ स्वाभाविक है।
- source_word: חָרוּץ
  choice: परिश्रम
  rationale: חָרוּץ परिश्रमी व्यक्ति अथवा परिश्रमशीलता का भाव दे सकता है। अत्यंत संक्षिप्त इब्रानी खंड में इसे भाववाचक ‘परिश्रम’ मानने से आलस्य के साथ स्पष्ट विरोध और सार्थक हिन्दी वाक्य बनता है।
theological_decisions:
- issue: दूसरे खंड की संक्षिप्त और अस्पष्ट इब्रानी रचना
  choice: परिश्रम मनुष्य की बहुमूल्य संपत्ति है
  alternative: परिश्रमी मनुष्य बहुमूल्य संपत्ति है; अथवा, परिश्रमी मनुष्य का धन बहुमूल्य है
  rationale: इब्रानी में संबंधसूचक और संयोजक शब्द निहित हैं, इसलिए शब्दों के व्याकरणिक संबंध के एक से अधिक अर्थ संभव हैं। मुख्य पाठ आलस्य और परिश्रम के गुणों का सीधा विरोध प्रस्तुत करता है, जबकि पादटिप्पणी अन्य संभावित संबंधों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भूनता’ मूल चित्र की ठोसता बनाए रखता है; ‘बहुमूल्य संपत्ति’ नीतिवचन की संक्षिप्त, स्मरणीय शैली को सुरक्षित रखती है।
