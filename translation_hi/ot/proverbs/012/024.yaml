lexical_decisions:
- source_word: יַד
  choice: हाथ
  rationale: ठोस बिंब ‘हाथ’ को बनाए रखा गया है; यहाँ यह काम करने की क्षमता और सामर्थ्य का लाक्षणिक संकेत भी है।
- source_word: חָרוּצִים
  choice: मेहनती लोग
  rationale: यह बहुवचन रूप परिश्रमी और लगन से काम करने वाले लोगों को दर्शाता है; आधुनिक हिन्दी में ‘मेहनती लोग’ स्पष्ट और स्वाभाविक है।
- source_word: תִּמְשׁוֹל
  choice: शासन करेगा
