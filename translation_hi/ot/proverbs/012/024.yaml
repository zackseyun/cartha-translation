- source_word: רְמִיָּה
  choice: आलसी हाथ
  rationale: यहाँ शब्द मेहनती लोगों के विपरीत ढिलाई या आलस्य का भाव देता है। पिछले खंड के ‘हाथ’ को निहित मानकर ‘आलसी हाथ’ कहना हिन्दी में स्वाभाविक है, जबकि अमूर्त अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: תִּהְיֶה
  choice: करनी पड़ेगी
  rationale: शाब्दिक ‘होगा/होगी’ को हिन्दी में परिणामस्वरूप अधीनता व्यक्त करने के लिए स्वाभाविक रूप से प्रस्तुत किया गया है।
- source_word: לָמַס
  choice: बेगार
  rationale: מַס अनिवार्य श्रम-सेवा या कोर्वे को दर्शाता है, केवल धनरूपी कर को नहीं। ‘बेगार’ इस सामाजिक वास्तविकता का संक्षिप्त और परिचित हिन्दी रूप है।
