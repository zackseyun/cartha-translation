  text: Anxiety in a man's heart weighs it down[b][a], but a good word makes it glad.
translation:
  language: hi
  text: मनुष्य[a] के मन में चिंता उसे दबा देती है[b], लेकिन अच्छी बात उसे आनंदित कर देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘एक पुरुष’ है; यहाँ एकवचन समस्त मनुष्यों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे झुका देती है।’ इब्रानी क्रिया नीचे लाए जाने या झुकने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּאָגָה
  choice: चिंता
  rationale: यह शब्द व्याकुल कर देने वाली चिंता या फिक्र को दर्शाता है। ‘चिंता’ आधुनिक मानक हिन्दी में स्वाभाविक है और भीतरी मानसिक बोझ का भाव बनाए रखता है।
- source_word: בְלֶב אִישׁ
  choice: मनुष्य के मन में
  rationale: इब्रानी में शाब्दिक अर्थ ‘मनुष्य के हृदय में’ है। इस संदर्भ में לֵב भीतरी व्यक्ति—विचारों और भावनाओं—को दर्शाता है; इसलिए हिन्दी में ‘मन’ अधिक स्वाभाविक है। אִישׁ यहाँ प्रतिनिधिक एकवचन है।
- source_word: יַשְׁחֶנָּה
  choice: उसे दबा देती है
  rationale: हिफ़ील क्रिया नीचे झुकाने या गिरा देने का चित्र प्रस्तुत करती है। ‘दबा देती है’ हिन्दी में चिंता के बोझ और नीचे लाए जाने, दोनों भावों को सहज रूप से व्यक्त करता है; ‘झुका देती है’ को पादटिप्पणी में रखा गया है।
- source_word: וְדָבָר טוֹב
  choice: लेकिन अच्छी बात
  rationale: דָבָר का अर्थ ‘शब्द, बात, संदेश’ हो सकता है। ‘अच्छी बात’ इस व्यापकता को बनाए रखती है, जबकि ‘लेकिन’ नीतिवचन की विरोधात्मक समानांतरता स्पष्ट करता है।
- source_word: יְשַׂמְּחֶנָּה
  choice: उसे आनंदित कर देती है
  rationale: पिएल रूप का अर्थ किसी को प्रसन्न या आनंदित करना है। यह चयन कारणात्मक अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
