source:
  edition: WLC
  text: יָתֵ֣ר מֵ/רֵעֵ֣/הוּ צַדִּ֑יק וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תַּתְעֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/026.yaml
  text: The righteous person is a guide to his neighbor[b][a], but the way of the wicked leads them astray.
translation:
  language: hi
  text: धर्मी अपने पड़ोसी[b] का मार्गदर्शन करता है[a], पर दुष्टों का मार्ग उन्हें भटका देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी अपने पड़ोसी से अधिक उत्तम है।” यहाँ इब्रानी क्रिया יָתֵר का अर्थ कठिन है; यह पारंपरिक अनुवाद भी संभव है।
    reason: alternative_reading
  - marker: b
    text: ‘पड़ोसी’ के लिए प्रयुक्त इब्रानी शब्द का अनुवाद ‘मित्र’ या ‘साथी’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָתֵר
  choice: सही राह दिखाता है
  rationale: यहाँ יָתֵר का अर्थ अत्यंत अनिश्चित है। नीतिवचन की विरोधात्मक समानांतरता में दूसरे चरण के ‘भटका देता है’ के सामने मार्गदर्शन का सक्रिय भाव स्वाभाविक बैठता है; फिर भी तुलनात्मक पारंपरिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מֵרֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। ‘पड़ोसी’ सामाजिक दायरे को व्यापक रखता है; उपसर्ग מ־ को कठिन क्रियात्मक रचना के साथ समझा गया है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और सामान्य व्यक्ति को सूचित करता है।
- source_word: וְדֶרֶךְ
  choice: पर … मार्ग
  rationale: וְ को विरोधात्मक समानांतरता के कारण ‘पर’ किया गया है। דֶּרֶךְ के लिए ‘मार्ग’ नीतिवचन की नैतिक जीवन-पद्धति की छवि बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: ज्ञान-साहित्य में यह नैतिक रूप से दुष्ट लोगों के लिए प्रचलित बहुवचन संज्ञात्मक प्रयोग है।
- source_word: תַּתְעֵם
  choice: उन्हें भटका देता है
  rationale: תעה के हिफ़ील रूप में कारणवाचक भाव और तृतीय पुरुष बहुवचन कर्म-प्रत्यय है; यह अनुवाद दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले चरण में धर्मी और उसके पड़ोसी के संबंध का अर्थ
  choice: धर्मी अपने पड़ोसी को सही राह दिखाता है
  alternative: धर्मी अपने पड़ोसी से अधिक उत्तम है
  rationale: इब्रानी יָתֵר की व्याख्या विवादित है। मुख्य पाठ में दूसरे चरण के ‘भटका देता है’ से मिलने वाला मार्गदर्शन का विरोध रखा गया है, जबकि प्राचीन तुलनात्मक समझ को पादटिप्पणी में दिया गया है; इस प्रकार अस्पष्टता को सिद्धांतगत रूप से नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सही राह दिखाता है’ दूसरे चरण के ‘भटका देता है’ के साथ स्पष्ट विरोध बनाता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद दिए गए हैं।
