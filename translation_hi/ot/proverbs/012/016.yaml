  text: A fool’s anger is known at once[b][a], but a prudent man covers shame.
translation:
  language: hi
  text: मूर्ख का क्रोध तुरन्त प्रकट हो जाता है[a], परन्तु विवेकी मनुष्य अपमान को छिपा लेता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख का क्रोध उसी दिन प्रकट हो जाता है”; इब्रानी में शाब्दिक रूप से “उस दिन” है।
    reason: lexical_alternative
  - marker: b
    text: या, “विवेकी मनुष्य लज्जा या बदनामी को छिपा लेता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: नीतिवचन के ज्ञान-साहित्य में यह शब्द केवल कम बुद्धि वाले व्यक्ति को नहीं, बल्कि नैतिक और व्यावहारिक मूर्खता वाले व्यक्ति को दर्शाता है; ‘मूर्ख’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּיּוֹם
  choice: उसी दिन
  rationale: इब्रानी का शाब्दिक अर्थ ‘दिन में/उस दिन’ है। ‘उसी दिन’ मूल अभिव्यक्ति को निकटता से रखते हुए तात्कालिकता का भाव देता है; ‘तुरन्त’ भी प्रसंगानुकूल सम्भव अर्थ है।
- source_word: יִוָּדַע
  choice: प्रकट हो जाता है
  rationale: ידע का निफ़अल रूप यहाँ ‘ज्ञात होना/प्रत्यक्ष हो जाना’ व्यक्त करता है। हिन्दी में क्रोध के विषय में ‘प्रकट हो जाता है’ स्वाभाविक है और निष्क्रिय भाव को बनाए रखता है।
- source_word: כַּעְסוֹ
  choice: उसका क्रोध
  rationale: כעס क्रोध, खीझ या रोष को व्यक्त करता है; ‘क्रोध’ स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए संबंध ‘मूर्ख का’ के रूप में व्यक्त हुआ है।
- source_word: וְכֹסֶה
  choice: परन्तु ... ढक देता है
  rationale: כסה का मूल अर्थ ‘ढकना/छिपाना’ है। ‘ढक देता है’ मूल रूपक को सुरक्षित रखता है, जबकि וְ यहाँ विरोधसूचक ‘परन्तु’ है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह शब्द लज्जा, अनादर, बदनामी या अपमान का अर्थ दे सकता है। इस समानान्तरता में ऐसा अपमान भी अभिप्रेत हो सकता है जिस पर मूर्ख तत्काल क्रोध दिखाता है; इसलिए ‘अपमान’ स्वाभाविक है, जबकि ‘लज्जा/बदनामी’ सम्भव विकल्प हैं।
- source_word: עָרוּם
  choice: चतुर मनुष्य
  rationale: नीतिवचन में यह विशेषण सामान्यतः सकारात्मक सूझ-बूझ और सावधानी को दर्शाता है। ‘चतुर मनुष्य’ आधुनिक हिन्दी में समझने योग्य है और इब्रानी के पुल्लिंग एकवचन प्रतिनिधि रूप को बनाए रखता है।
