  text: A man is praised according to his insight[b][a], but one with a twisted heart will be despised.
translation:
  language: hi
  text: मनुष्य की प्रशंसा उसकी सूझ-बूझ के अनुसार होती है[a], पर जिसका हृदय टेढ़ा है, वह तुच्छ समझा जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य की जितनी सूझ-बूझ होती है, उसी अनुपात में उसकी प्रशंसा होती है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “टेढ़े हृदय वाला”; यह भीतर की नैतिक रूप से विकृत प्रवृत्ति के लिए इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: לְפִי
  choice: के अनुसार
  rationale: यह इब्रानी मुहावरा यहाँ किसी मानक या अनुपात को व्यक्त करता है; ‘के अनुसार’ स्वाभाविक हिन्दी में वही संबंध बनाए रखता है।
- source_word: שִׂכְלוֹ
  choice: उसकी सूझ-बूझ
  rationale: שֵׂכֶל में समझ, विवेक और व्यवहारिक बुद्धिमानी का संयुक्त भाव है; ‘सूझ-बूझ’ आधुनिक हिन्दी में इस व्यापक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: יְהֻלַּל
  choice: प्रशंसा ... होती है
  rationale: पुअल रूप प्रशंसा किए जाने को व्यक्त करता है। सामान्य वर्तमान काल नीतिवचन के सार्वकालिक कथन के लिए उपयुक्त है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यद्यपि शब्द व्याकरणतः पुल्लिंग एकवचन है, यहाँ वह प्रतिनिधिक रूप से किसी व्यक्ति के लिए प्रयुक्त है; ‘मनुष्य’ इस सामान्य मानवीय संदर्भ को गरिमापूर्ण ढंग से रखता है।
- source_word: נַעֲוֵה לֵב
  choice: टेढ़े मन वाला
  rationale: मूल वाक्यांश का शाब्दिक भाव ‘हृदय का टेढ़ा’ है और यह भीतर की नैतिक विकृति का मुहावरा है। हिन्दी में ‘टेढ़े मन वाला’ रूपक और आशय दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: יִהְיֶה לָבוּז
  choice: तुच्छ समझा जाएगा
  rationale: यह रचना किसी के तिरस्कार का पात्र होने या बन जाने को व्यक्त करती है; ‘तुच्छ समझा जाएगा’ परिणामसूचक भाव को स्पष्ट और सहज हिन्दी में देता है।
