base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/018.yaml
  text: There is one who speaks rashly like the thrusts of a sword[b][a], but the tongue of the wise brings healing.
translation:
  language: hi
  text: कोई ऐसा है जो बिना सोचे-समझे बोलता है; उसकी बातें तलवार के वारों जैसी हैं[a]। पर बुद्धिमानों की जीभ चंगाई देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तलवार के वारों की तरह।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बुद्धिमानों की जीभ चंगाई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: यहाँ अस्तित्वसूचक प्रयोग एक प्रकार के व्यक्ति का परिचय देता है; हिंदी में ‘कोई’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בּוֹטֶה
  choice: बिना सोचे-समझे बोलता है
  rationale: यह कृदंत असंयमित और उतावले ढंग से बोलने का भाव देता है। चुना हुआ वाक्यांश सामान्य आधुनिक हिंदी में इस नैतिक आशय को स्पष्ट रखता है।
- source_word: כְּמַדְקְרוֹת חָרֶב
  choice: मानो तलवार से वार करता हो
  rationale: इब्रानी बहुवचन तलवार के चुभने वाले वारों का सजीव चित्र प्रस्तुत करता है। हिंदी में यह रूप उपमा और बार-बार घायल करने वाले प्रभाव को सहज ढंग से व्यक्त करता है।
- source_word: וּלְשׁוֹן
  choice: पर ... जीभ
  rationale: ‘जीभ’ को बनाए रखने से वाणी के लिए प्रयुक्त मूल इब्रानी रूपक सुरक्षित रहता है और पहली पंक्ति के उतावले बोलने से स्पष्ट विरोध बनता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों की
  rationale: बहुवचन संज्ञा सामान्य रूप से बुद्धिमान लोगों को सूचित करती है; यह रूप लिंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מַרְפֵּא
  choice: चंगाई देती है
  rationale: संज्ञा का अर्थ ‘चंगाई’ या ‘उपचार’ है। हिंदी में क्रियात्मक अभिव्यक्ति वचन के सुधारने और स्वस्थ करने वाले प्रभाव को स्वाभाविक रूप से बताती है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
