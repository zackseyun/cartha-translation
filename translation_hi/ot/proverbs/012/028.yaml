source:
  edition: WLC
  text: בְּ/אֹֽרַח צְדָקָ֥ה חַיִּ֑ים וְ/דֶ֖רֶךְ נְתִיבָ֣ה אַל מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/028.yaml
  text: In the path of righteousness is life[a], and in its pathway there is no death.
translation:
  language: hi
  text: 'धार्मिकता के मार्ग में जीवन है,

    और उसकी राह में मृत्यु नहीं है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसकी राह अमरता की ओर ले जाती है।” दूसरी पंक्ति के कठिन इब्रानी पाठ की यह एक वैकल्पिक समझ है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/אֹרַח
  choice: मार्ग में
  rationale: אֹרַח जीवन के आचरण या दिशा को रूपकात्मक ढंग से ‘मार्ग’ कहता है; उपसर्ग בְ को स्थान/क्षेत्र के अर्थ में ‘में’ किया गया है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: ज्ञान-साहित्य के इस नैतिक संदर्भ में צְדָקָה सही और धर्मानुकूल आचरण को दर्शाता है; ‘धार्मिकता’ हिंदी बाइबलीय भाषा में स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: रूप की दृष्टि से बहुवचन होने पर भी חַיִּים यहाँ मुहावरेदार एकवचन अर्थ ‘जीवन’ देता है।
- source_word: וְ/דֶרֶךְ נְתִיבָה
  choice: और उसकी राह में
  rationale: काव्यात्मक, संक्षिप्त इब्रानी पदबंध को पहली पंक्ति के समानांतर समझते हुए ‘उसकी राह में’ किया गया है; ‘उसकी’ धार्मिकता के मार्ग की ओर संकेत करता है। ‘राह’ शब्द पुनरुक्ति घटाते हुए मार्ग-रूपक बनाए रखता है।
- source_word: אַל מָוֶת
  choice: मृत्यु नहीं है
  rationale: कठिन पदबंध में אַל को नकारार्थक मानकर जीवन और मृत्यु का स्पष्ट विरोध सुरक्षित रखा गया है; מָוֶת का सीधा अर्थ ‘मृत्यु’ है।
theological_decisions:
- issue: दूसरी पंक्ति ודרך נתיבה אל־מות का अर्थ
  choice: धार्मिकता की राह में मृत्यु नहीं है।
  alternative: और उसकी राह अमरता की ओर ले जाती है।
  rationale: मसोरेटी पाठ अत्यंत संक्षिप्त और व्याख्यात्मक रूप से कठिन है। मुख्य पाठ में אַל को नकारार्थक लेकर पहली पंक्ति के ‘जीवन’ के साथ स्वाभाविक विरोध रखा गया है। ‘अमरता’ वाला प्राचीन/परंपरागत अर्थ संभव वैकल्पिक समझ के रूप में पादटिप्पणी में दिया गया है, ताकि अस्पष्टता छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कहावती शैली रखी गई है। समानांतरता के लिए ‘मार्ग’ और ‘राह’ का प्रयोग किया गया है; कठिन दूसरी पंक्ति की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
