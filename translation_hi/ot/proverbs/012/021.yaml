source:
  edition: WLC
  text: לֹא יְאֻנֶּ֣ה לַ/צַּדִּ֣יק כָּל אָ֑וֶן וּ֝/רְשָׁעִ֗ים מָ֣לְאוּ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/021.yaml
  text: No harm will happen to the righteous, but the wicked are filled with trouble.
translation:
  language: hi
  text: 'धर्मी पर कोई अनिष्ट नहीं आता,

    पर दुष्ट विपत्ति से भर जाते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְאֻנֶּה
  choice: आता
  rationale: यह क्रिया किसी घटना के घटित होने या किसी पर आ पड़ने का भाव देती है; हिन्दी में ‘पर ... आता’ इस भाव को सहज रूप से व्यक्त करता है।
- source_word: כָל אָוֶן
  choice: कोई अनिष्ट
  rationale: אָוֶן में अनिष्ट, विपत्ति, बुराई और अधर्म की अर्थ-छायाएँ संभव हैं। पहले खंड में धर्मी पर घटने वाली बात के रूप में ‘अनिष्ट’ स्वाभाविक है और नैतिक तथा आपदात्मक अस्पष्टता को पर्याप्त रूप से खुला रखता है।
- source_word: צַּדִּיק
  choice: धर्मी
  rationale: नीतिवचन में यह उस व्यक्ति के लिए प्रचलित और संक्षिप्त हिन्दी पद है जो सही और न्यायपूर्ण मार्ग पर चलता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह मूल के नैतिक विरोध को स्पष्ट रखते हुए आधुनिक हिन्दी में सहज और प्रतिष्ठित शब्द है।
- source_word: מָלְאוּ רָע
  choice: विपत्ति से भर जाते हैं
  rationale: רָע का अर्थ बुराई या विपत्ति दोनों हो सकता है। समानांतरता में दुष्टों को घेर लेने वाले संकट का भाव प्रमुख है; ‘विपत्ति’ इसे व्यक्त करता है, जबकि ‘भर जाते हैं’ मूल की पूर्णता की छवि बनाए रखता है।
theological_decisions:
- issue: क्या यह पद धर्मी के जीवन में किसी भी दुःख या हानि के पूर्ण अभाव की प्रतिज्ञा करता है?
  choice: मूल की नीतिवचनात्मक, सामान्य घोषणा को बिना अतिरिक्त योग्यता के बनाए रखा गया है।
  alternative: ‘अंततः कोई अनिष्ट नहीं होगा’ या ‘स्थायी हानि नहीं होगी’ जोड़ना।
  rationale: मूल पाठ ‘अंततः’ या ‘स्थायी’ नहीं कहता। ऐसी व्याख्यात्मक सीमाएँ जोड़ना तनाव को अनावश्यक रूप से सुलझा देता।
- issue: אָוֶן और רָע को नैतिक बुराई मानें या दुःख-विपत्ति?
  choice: पहले में ‘अनिष्ट’ और दूसरे में ‘विपत्ति’ रखा गया है।
  alternative: दोनों स्थानों पर ‘बुराई’ रखना।
  rationale: शब्दों में नैतिक और आपदात्मक दोनों अर्थ-छायाएँ हैं, पर वाक्य की घटना-प्रधान संरचना और अंग्रेज़ी परामर्श-पाठ का ‘harm/trouble’ आपदात्मक पक्ष को प्रमुख बनाते हैं। ‘अनिष्ट’ पहले पद में कुछ व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त काव्यात्मक समानांतरता और गरिमापूर्ण सामान्य शब्दावली। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
