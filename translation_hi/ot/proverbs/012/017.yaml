  text: He who breathes out truth declares righteousness[a], but a false witness[b], deceit.
translation:
  language: hi
  text: जो सच्चाई बोलता है, वह न्याय की बात कहता है; पर झूठा गवाह छल की बात कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָפִיחַ
  choice: बोलता है
  rationale: हिफ़ील रूप का शाब्दिक बिंब ‘फूँकना/साँस से निकालना’ है, पर यहाँ इसका मुहावरेदार अर्थ वाणी प्रकट करना है। हिंदी में ‘सच उगलता है’ अनचाहा नकारात्मक भाव ला सकता है; इसलिए स्वाभाविक ‘बोलता है’ चुना गया।
- source_word: אֱמוּנָה
  choice: सच
  rationale: गवाही और झूठे गवाह के विरोध में यह विश्वसनीय, सत्य कथन को दर्शाता है; ‘सच’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: יַגִּיד
  choice: बताता है
  rationale: נגד के हिफ़ील का अर्थ बताना या प्रकट करना है। ‘बताता है’ सहज हिंदी है और गवाही के प्रसंग में उपयुक्त है।
- source_word: צֶדֶק
  choice: सही बात
  rationale: यहाँ शब्द नैतिक सहीपन और न्यायोचित कथन दोनों की ओर संकेत कर सकता है। ‘सही बात’ कानूनी अर्थ तक सीमित किए बिना इस व्यापकता को स्वाभाविक हिंदी में रखता है।
- source_word: עֵד שְׁקָרִים
  choice: झूठा गवाह
  rationale: हिब्रू का प्रचलित न्यायिक पदबंध है; हिंदी में इसका सीधा और स्वाभाविक समतुल्य ‘झूठा गवाह’ है।
- source_word: מִרְמָה
  choice: छल की बात कहता है
  rationale: हिब्रू में अंतिम संज्ञा क्रियारहित और संक्षिप्त है। हिंदी में अर्थ स्पष्ट करने के लिए पहले खंड से क्रिया की पूर्ति करते हुए ‘छल की बात कहता है’ रखा गया है।
