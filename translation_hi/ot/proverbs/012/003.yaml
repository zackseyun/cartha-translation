id: PRO.12.3
reference: Proverbs 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹא יִכּ֣וֹן אָדָ֣ם בְּ/רֶ֑שַׁע וְ/שֹׁ֥רֶשׁ צַ֝דִּיקִ֗ים בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/003.yaml
  text: A man is not established by wickedness[b][a], but the root of the righteous will not be moved.
translation:
  language: hi
  text: 'दुष्टता से कोई मनुष्य स्थिर नहीं होता,

    पर धर्मियों की जड़ कभी नहीं डगमगाएगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִכּוֹן
  choice: स्थिर नहीं होता
  rationale: כון के निफ़अल रूप में स्थापित या दृढ़ होने का भाव है। सामान्य नीतिवचन के वर्तमानकालिक कथन के लिए ‘स्थिर नहीं होता’ स्वाभाविक है और टिकाऊ दृढ़ता का आशय बनाए रखता है।
- source_word: אָדָם
  choice: कोई मनुष्य
  rationale: यहाँ אָדָם किसी एक पुरुष विशेष के बजाय प्रतिनिधिक रूप से मनुष्य के लिए प्रयुक्त है। ‘कोई मनुष्य’ हिन्दी में एकवचन सामान्य कथन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרֶשַׁע
  choice: दुष्टता से
  rationale: 'यहाँ ב साधन या माध्यम का बोध कराता है: दुष्टता स्थायी दृढ़ता पाने का माध्यम नहीं बन सकती।'
- source_word: שֹׁרֶשׁ
  choice: जड़
  rationale: ठोस रूपक को बनाए रखा गया है; जड़ जीवन, स्थायित्व और दृढ़ आधार का चित्र प्रस्तुत करती है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण का संज्ञात्मक प्रयोग है। ‘धर्मी’ हिन्दी बाइबलीय भाषा में नैतिक रूप से सही जनों के लिए संक्षिप्त और सुबोध पद है।
- source_word: בַּל
  choice: कभी नहीं
  rationale: काव्यात्मक निषेध בַּל को ‘कभी नहीं’ से व्यक्त किया गया है, जो इस स्थायी अडिगता पर बल देता है और हिन्दी में स्वाभाविक है।
- source_word: יִמּוֹט
  choice: डगमगाएगी
  rationale: מוט का अर्थ हिलना, डगमगाना या अस्थिर होना है। स्त्रीलिंग क्रिया ‘जड़’ से मेल खाती है और स्थिरता के रूपक को बनाए रखती है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक एकवचन मानव-संदर्भ
  choice: कोई मनुष्य
  alternative: कोई पुरुष
  rationale: इस संदर्भ में אָדָם समस्त मनुष्यों पर लागू सामान्य नैतिक सत्य व्यक्त करता है। हिन्दी में ‘कोई मनुष्य’ मूल के एकवचन को रखते हुए अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
- issue: धर्मियों की स्थिरता का रूपक
  choice: ‘जड़’ और ‘डगमगाएगी’ के ठोस रूपक को बनाए रखना
  alternative: ‘धर्मी सदा स्थिर रहेंगे’ के रूप में अर्थ खोल देना
  rationale: मूल पाठ धर्मियों और उनकी जड़ के बीच रूपकात्मक संबंध रखता है। उसे सीधे सामान्य कथन में बदलना काव्यात्मक चित्र और उसकी अर्थ-गहनता घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली। दोनों पंक्तियों का विरोध स्पष्ट रखा गया है और मूल का जड़-वाला रूपक सुरक्षित है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई।
