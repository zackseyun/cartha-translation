  text: יוֹדֵ֣עַ צַ֭דִּיק נֶ֣פֶשׁ בְּהֶמְתּ֑/וֹ וְֽ/רַחֲמֵ֥י רְ֝שָׁעִ֗ים אַכְזָרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/010.yaml
  text: A righteous man knows the life of his animal[a], but the compassion of the wicked is cruel.
translation:
  language: hi
  text: 'धर्मी अपने पशु के प्राण की सुधि रखता है[a],

    पर दुष्टों की करुणा भी क्रूर होती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पशु की आवश्यकताओं को जानता है।” इब्रानी में शाब्दिक रूप से “अपने पशु के प्राण को जानता है,” अर्थात वह उसके जीवन, दशा और आवश्यकताओं का ध्यान रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדֵעַ
  choice: सुधि रखता है
  rationale: मूल क्रिया का अर्थ ‘जानना’ है, पर इस प्रसंग में वह पशु की दशा और आवश्यकताओं को ध्यानपूर्वक जानने तथा उनका खयाल रखने का भाव लिए है। ‘सुधि रखता है’ उस ज्ञान और सजग देखभाल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह नीतिवचन में धर्मी व्यक्ति के लिए प्रयुक्त पुल्लिंग एकवचन संज्ञार्थक विशेषण है। ‘धर्मी’ स्रोत की संक्षिप्तता और व्याकरणिक रूप को बनाए रखता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: נֶפֶשׁ का अर्थ यहाँ पशु का जीवन, जीवित दशा या उसकी आवश्यकताएँ हो सकता है। ‘प्राण’ शाब्दिक केंद्र को सुरक्षित रखता है और पशु के कल्याण की ओर संकेत करता है, जबकि पादटिप्पणी प्रसंगगत अर्थ खोलती है।
- source_word: בְּהֶמְתּוֹ
  choice: अपने पशु
  rationale: בְּהֵמָה किसी पशु, विशेषतः पालतू पशु या मवेशी, को दर्शा सकता है। ‘पशु’ व्यापक और आधुनिक हिन्दी में स्वाभाविक है; ‘अपने’ तीसरे पुरुष के स्वामित्व को सहज रूप से व्यक्त करता है।
- source_word: רַחֲמֵי
  choice: करुणा
  rationale: बहुवचन रचनात्मक रूप दया या करुणा के भाव अथवा कार्यों को समष्टिगत रूप से व्यक्त करता है। हिन्दी में भाववाचक एकवचन ‘करुणा’ स्वाभाविक है और विरोधाभास की धार बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: नीतिवचन साहित्य में यह दुष्ट लोगों के वर्ग को दर्शाने वाला बहुवचन संज्ञार्थक विशेषण है। संबंधकारक ‘दुष्टों की’ स्रोत की बहुवचन संरचना को बनाए रखता है।
- source_word: אַכְזָרִי
  choice: क्रूर
  rationale: इसका सीधा अर्थ क्रूर, निर्दयी या निष्ठुर है। ‘क्रूर’ संक्षिप्त और प्रबल है तथा उस विडंबना को सुरक्षित रखता है कि दुष्टों की करुणा तक क्रूर होती है।
theological_decisions:
- issue: नीतिवचन के कर्ता का पुल्लिंग एकवचन रूप
  choice: धर्मी
  alternative: धर्मी व्यक्ति / धर्मी जन
  rationale: इब्रानी पाठ पुल्लिंग एकवचन है और नीतिवचन में सामान्य प्रतिनिधि के रूप में कार्य करता है। ‘धर्मी’ इस रूप को अनावश्यक रूप से लिंग-निरपेक्ष या बहुवचन बनाए बिना सुरक्षित रखता है।
- issue: दुष्टों की ‘करुणा’ और क्रूरता का तनाव
  choice: दुष्टों की करुणा भी क्रूर होती है
  alternative: दुष्टों की दया निर्दयता है
  rationale: स्रोत कथन को तीखे विरोधाभास के रूप में रखता है और यह स्पष्ट नहीं करता कि वह दिखावटी करुणा है या करुणा समझे जाने वाले कार्यों का वास्तविक परिणाम। अनुवाद इस तनाव को व्याख्यात्मक ढंग से सुलझाने के बजाय बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘सुधि रखता है’ थोड़ा साहित्यिक किंतु प्रचलित पद है, जो केवल जानकारी रखने से अधिक सजग ध्यान का भाव देता है। समानांतर दो पंक्तियों और ‘पर’ से मूल नीतिवचन का विरोध स्पष्ट रखा गया है।
