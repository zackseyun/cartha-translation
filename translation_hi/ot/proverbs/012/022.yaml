  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה שִׂפְתֵי שָׁ֑קֶר וְ/עֹשֵׂ֖י אֱמוּנָ֣ה רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/022.yaml
  text: Lying lips are an abomination to Yahweh[a], but those who act faithfully are his delight.
translation:
  language: hi
  text: 'झूठ बोलनेवाले होंठ याहवे को घृणित हैं,

    पर जो निष्ठापूर्वक आचरण करते हैं[a], वे उसे प्रिय हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो विश्वासयोग्यता से आचरण करते हैं,” “जो सच्चाई से काम करते हैं,” अथवा “जो भरोसेमंद हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द नैतिक और धार्मिक रूप से अत्यंत अरुचिकर या घिनौनी वस्तु का प्रबल भाव व्यक्त करता है; ‘घृणित’ स्वाभाविक हिन्दी में उसी तीव्रता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम आया है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित करता है।
- source_word: שִׂפְתֵי שָׁקֶר
  choice: झूठ बोलनेवाले होंठ
  rationale: शाब्दिक अर्थ ‘झूठ के होंठ’ है। चुना हुआ रूप होंठों की मूल अलंकारिक छवि बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְעֹשֵׂי
  choice: पर जो ... आचरण करते हैं
  rationale: कृदन्त का अर्थ ‘करनेवाले’ है। नीतिवचन की विरोधात्मक समानांतरता के कारण וְ को स्वाभाविक रूप से ‘पर’ कहा गया है।
- source_word: אֱמוּנָה
  choice: निष्ठा से
  rationale: यह संज्ञा निष्ठा, सच्चाई, विश्वसनीयता या भरोसेमंदी का अर्थ दे सकती है। ‘निष्ठा से आचरण’ व्यवहार में प्रकट स्थिर सच्चाई और विश्वसनीयता को व्यक्त करता है, जबकि वैकल्पिक अर्थ टिप्पणी में सुरक्षित हैं।
- source_word: רְצוֹנוֹ
  choice: उससे वह प्रसन्न होता है
  rationale: यह पद उसकी प्रसन्नता, अनुग्रह या इच्छा का बोध करा सकता है। यहाँ यह पहले चरण के ‘घृणित’ होने के संबंधपरक प्रतिपक्ष को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ नाम को उपाधि में बदले बिना उसका प्रचलित विद्वत्तापूर्ण उच्चारण देवनागरी में प्रस्तुत करता है।
- issue: אֱמוּנָה में निष्ठा, सच्चाई और विश्वसनीयता का अर्थ-संबंध
  choice: निष्ठा से आचरण करते हैं
  alternative: सच्चाई से काम करते हैं; विश्वासयोग्य रहते हैं; भरोसेमंद ढंग से आचरण करते हैं
  rationale: संदर्भ झूठ के विपरीत आचरण की बात करता है, पर शब्द का अर्थ केवल तथ्यात्मक सत्य तक सीमित नहीं है। मुख्य पाठ में व्यापक ‘निष्ठा’ और टिप्पणी में अन्य वास्तविक संभावनाएँ रखी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। ‘होंठ’ का मूल रूपक सुरक्षित है और दूसरे चरण में स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
