  yaml_path: translation/ot/proverbs/012/004.yaml
  text: A wife of noble character is her husband's crown[b][a], but one who brings shame is like rot in his bones.
translation:
  language: hi
  text: योग्य पत्नी[a] अपने पति का मुकुट है, पर लज्जा लाने वाली पत्नी उसकी हड्डियों में सड़न के समान है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “सामर्थ्यवती पत्नी,” “वीर पत्नी” या “उत्कृष्ट पत्नी” भी हो सकता है। हिब्रू शब्द חַיִל में सामर्थ्य, मूल्य, योग्यता और उत्कृष्टता जैसे व्यापक भाव शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी हड्डियों में सड़न के समान।” यह गहरे भीतरी विनाश या भीतर से गलानेवाले अपमान की चित्रात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: सामर्थ्यवान पत्नी
  rationale: यह पदबंध ऐसी पत्नी को दर्शाता है जिसमें सामर्थ्य, योग्यता, मूल्य और उत्कृष्टता हो। ‘सामर्थ्यवान पत्नी’ हिब्रू की व्यापकता को यथासंभव बनाए रखता है और वैवाहिक संदर्भ भी स्पष्ट करता है।
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: यह सम्मान और गौरव के प्रतीक मुकुट या माला को दर्शाता है; हिंदी में ‘मुकुट’ रूपक को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: בַּעְלָהּ
  choice: अपने पति का
  rationale: संदर्भ में स्त्री का पति अभिप्रेत है; हिंदी में यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: מְבִישָׁה
  choice: लज्जा का कारण बननेवाली पत्नी
  rationale: हिफ़ील कृदंत का सक्रिय, कारणात्मक भाव—लज्जा या अपमान उत्पन्न करना—सुरक्षित रखा गया है। स्त्रीलिंग संदर्भ को स्पष्ट करने के लिए ‘पत्नी’ दोहराया गया है।
- source_word: כְרָקָב בְּעַצְמוֹתָיו
  choice: उसकी हड्डियों में सड़न के समान
  rationale: ‘हड्डियों’ और ‘सड़न’ की तीखी मूल रूपक-छवि को सामान्यीकृत किए बिना बनाए रखा गया है।
