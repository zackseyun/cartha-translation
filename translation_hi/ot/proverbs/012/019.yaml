base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/019.yaml
  text: A truthful lip is established forever[b][a], but a lying tongue lasts only a moment.
translation:
  language: hi
  text: सत्य बोलनेवाले होंठ सदा स्थिर रहते हैं, पर झूठ बोलनेवाली जीभ केवल पल भर टिकती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरे चरण का इब्रानी पदबंध कठिन है; सन्दर्भ में भाव यह है कि सत्य के स्थायित्व के विपरीत झूठी वाणी बहुत थोड़े समय तक टिकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂפַת אֱמֶת
  choice: सत्य बोलनेवाले होंठ
  rationale: शाब्दिक रचना ‘सत्य के होंठ’ है, पर हिन्दी में यह अस्वाभाविक लगती है। ‘सत्य बोलनेवाले होंठ’ मूल के ठोस वाणी-संबंधी रूपक और नैतिक आशय दोनों को सहज रूप में रखता है।
- source_word: תִּכּוֹן
  choice: स्थिर रहते हैं
  rationale: כון के निफ़अल रूप में स्थापित, दृढ़ और टिकाऊ बने रहने का भाव है। नीतिवचन के सामान्य सत्य के लिए वर्तमानकालीन बहुवचन हिन्दी में स्वाभाविक है।
- source_word: לָעַד
  choice: सदा
  rationale: यह दीर्घकालिक स्थायित्व व्यक्त करता है और दूसरे चरण के ‘पल भर’ के साथ स्पष्ट विरोध बनाता है।
- source_word: וְעַד אַרְגִּיעָה
  choice: पर ... केवल पल भर टिकती है
  rationale: पदबंध कठिन है, पर काव्यात्मक समानांतरता में इसका मुख्य भाव झूठी वाणी की अल्पकालिकता है। ‘टिकती है’ पहले चरण के स्थायित्व को प्रतिध्वनित करता है और हिन्दी में निहित क्रिया स्पष्ट करता है।
- source_word: לְשׁוֹן שָׁקֶר
  choice: झूठ बोलनेवाली जीभ
  rationale: ‘जीभ’ मूल ठोस रूपक को बनाए रखती है; ‘झूठ बोलनेवाली’ हिन्दी में ‘झूठ की जीभ’ से अधिक स्वाभाविक है।
