  yaml_path: translation/ot/proverbs/012/001.yaml
  text: Whoever loves discipline loves knowledge[a], but he who hates reproof is stupid.
translation:
  language: hi
  text: जो अनुशासन से प्रेम करता है, वह ज्ञान से प्रेम करता है; पर जो डाँट से घृणा करता है, वह मूर्ख[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुद्धिहीन” अथवा “पशु-समान जड़।” इब्रानी विशेषण בָּעַר ऐसे व्यक्ति को सूचित कर सकता है जो समझ से रहित, संवेदनहीन या पशु-समान हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: जो ... प्रेम करता है
  rationale: हिब्रू कृदन्त यहाँ सामान्य, नीतिवचनात्मक कथन व्यक्त करता है; यह रूप पुल्लिंग एकवचन की व्याकरणिक बनावट को सार्वभौमिक अर्थ में स्वाभाविक हिन्दी देता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द शिक्षा, प्रशिक्षण और सुधार—इन सबको समेटने वाला रचनात्मक अनुशासन दर्शाता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह शब्द नीतिवचन की ज्ञान-परम्परा का सामान्य पद है और अनुशासन से अर्जित समझ/ज्ञान का भाव बनाए रखता है।
- source_word: וְשֹׂנֵא
  choice: पर जो ... घृणा करता है
  rationale: वाव यहाँ विरोधात्मक समानान्तरता में है, इसलिए ‘पर’ दोनों पंक्तियों के तीखे विरोध को स्पष्ट करता है।
- source_word: תּוֹכַחַת
  choice: डाँट
  rationale: यह मौखिक सुधार, उलाहना या फटकार को दर्शाता है; ‘डाँट’ आधुनिक सामान्य हिन्दी में सहज और स्पष्ट है।
- source_word: בָּעַר
  choice: मूर्ख
  rationale: यह तीखा विशेषण बुद्धिहीन, संवेदनहीन अथवा पशु-समान जड़ व्यक्ति का बोध करा सकता है; ‘मूर्ख’ स्वाभाविक हिन्दी में नीतिवचन का कठोर मूल्यांकन सुरक्षित रखता है, जबकि व्यापक अर्थ-पट्टी पादटिप्पणी में दी गई है।
