reference: Proverbs 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ט֗וֹב יָפִ֣יק רָ֭צוֹן מֵ/יְהוָ֑ה וְ/אִ֖ישׁ מְזִמּ֣וֹת יַרְשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/002.yaml
  text: A good man obtains favor from Yahweh[b][a], but a man of schemes he condemns.
translation:
  language: hi
  text: भला मनुष्य यहोवा से कृपा पाता है, पर षड्यंत्र रचनेवाले मनुष्य को वह दोषी ठहराता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: भला मनुष्य
  rationale: यह विशेषण यहाँ संज्ञा के रूप में व्यक्ति के नैतिक चरित्र को बताता है। ‘भला मनुष्य’ व्यापक अर्थ बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: יָפִיק
  choice: पाता है
  rationale: רָצוֹן और מֵיְהוָה के साथ यह क्रिया सन्दर्भ में किसी से कृपा प्राप्त करने का भाव देती है। ‘पाता है’ संक्षिप्त और सहज है।
- source_word: רָצוֹן
  choice: कृपा
  rationale: यहाँ शब्द यहोवा की प्रसन्नता, स्वीकृति या अनुग्रह को सूचित करता है। ‘कृपा’ हिन्दी बाइबलीय और सामान्य धार्मिक भाषा में स्वाभाविक है।
- source_word: מֵיְהוָה
  choice: यहोवा से
  rationale: מִן स्रोत को दर्शाता है और יהוה परमेश्वर का व्यक्तिवाचक नाम है; इसलिए नाम को ‘यहोवा’ रूप में रखा गया है।
- source_word: אִישׁ מְזִמּוֹת
  choice: षड्यंत्र रचनेवाला मनुष्य
  rationale: מְזִמּוֹת अपने आप में योजनाओं या युक्तियों को सूचित कर सकता है, पर यहाँ ‘भले’ व्यक्ति के विरोध और दोषी ठहराने वाली क्रिया से नकारात्मक, कपटपूर्ण योजनाओं का भाव स्पष्ट है।
- source_word: יַרְשִׁיעַ
  choice: वह दोषी ठहराता है
  rationale: רשע के हिफ़ील रूप का अर्थ किसी को दोषी घोषित करना है। कर्ता पिछले खंड के ‘यहोवा’ से समझा जाता है; ‘वह’ मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में परमेश्वर का विशिष्ट नाम स्पष्ट रूप से आया है। हिन्दी में परिचित व्यक्तिवाचक रूप ‘यहोवा’ नाम और सामान्य उपाधि के बीच भेद बनाए रखता है।
- issue: יַרְשִׁיעַ का निहित कर्ता
  choice: ‘वह’—अर्थात यहोवा
  alternative: ‘यहोवा ... दोषी ठहराता है’ अथवा ‘दोषी ठहराया जाता है’
  rationale: दूसरे खंड में कर्ता व्यक्त नहीं है, पर पहले खंड का यहोवा स्वाभाविक रूप से कर्ता बना रहता है। सर्वनाम मूल की संक्षिप्त समानांतर शैली को बचाता है।
- issue: מְזִמּוֹת का नैतिक भाव
  choice: षड्यंत्र
  alternative: योजनाएँ / युक्तियाँ
  rationale: शब्द अन्य सन्दर्भों में तटस्थ या सकारात्मक हो सकता है, लेकिन इस पद का विरोधात्मक विन्यास और दोषी ठहराया जाना यहाँ नकारात्मक अर्थ का समर्थन करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘रचनेवाला’ को संयुक्त रूप में रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि मुख्य पाठ सन्दर्भगत अर्थ स्पष्ट करता है और मूल की प्रमुख अस्पष्टता ‘वह’ में बनी रहती है।
