source:
  edition: WLC
  text: מִ/פְּרִ֣י פִי אִ֭ישׁ יִשְׂבַּע ט֑וֹב וּ/גְמ֥וּל יְדֵי אָ֝דָ֗ם ישוב לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/014.yaml
  text: From the fruit of a man's mouth he is satisfied with good[b][a], and the recompense of a man's hands returns to him.
translation:
  language: hi
  text: मनुष्य अपने मुँह के फल से भलाई पाकर तृप्त होता है,[a] और मनुष्य के हाथों का प्रतिफल उसी के पास लौट आता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मनुष्य’ के लिए एकवचन पुल्लिंग शब्द है, पर यहाँ नीतिवचन सभी लोगों पर लागू होने वाला सामान्य सत्य कहता है।
    reason: cultural_note
  - marker: b
    text: ‘प्रतिफल’ का अर्थ किसी के हाथों से किए गए काम का वह परिणाम भी हो सकता है जो लौटकर उसी को मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּרִי פִי אִישׁ
  choice: मनुष्य अपने मुँह के फल से
  rationale: मִן को स्रोत/साधन के अर्थ में ‘से’ रखा गया है और ‘मुँह का फल’ रूपक सुरक्षित है। स्वाभाविक हिन्दी वाक्य-विन्यास के लिए संबंध को ‘अपने’ से व्यक्त किया गया है।
- source_word: יִשְׂבַּע טוֹב
  choice: भलाई पाकर तृप्त होता है
  rationale: שׂבע का अर्थ ‘तृप्त होना’ और טוֹב का व्यापक अर्थ ‘भलाई/हितकारी फल’ है। ‘भलाई’ नैतिक और लाभकारी दोनों भावों को खुला रखती है; अपूर्ण क्रिया को नीतिवचन की सामान्य सच्चाई के रूप में वर्तमान काल में व्यक्त किया गया है।
- source_word: וּגְמוּל יְדֵי אָדָם
  choice: मनुष्य के हाथों का प्रतिफल
  rationale: גְמוּל को केवल ‘काम’ न मानकर कर्म से मिलने या लौटने वाले परिणाम के अर्थ में ‘प्रतिफल’ किया गया है। ‘हाथों’ की मूल उपमा भी रखी गई है।
- source_word: יָשׁוּב לוֹ
  choice: उसी के पास लौट आता है
  rationale: שׁוּב के ‘लौटना’ अर्थ और לוֹ के उसी व्यक्ति की ओर संकेत को स्पष्ट रखा गया है। वर्तमान काल नीतिवचन की सामान्य सच्चाई के अनुकूल है।
theological_decisions:
- issue: אִישׁ और אָדָם के एकवचन पुल्लिंग रूपों का सामान्य मानवीय प्रयोग
  choice: दोनों पंक्तियों में ‘मनुष्य’
  alternative: ‘पुरुष’ अथवा ‘व्यक्ति’
  rationale: यहाँ दोनों इब्रानी शब्द किसी एक पुरुष तक कथन को सीमित नहीं करते, बल्कि प्रतिनिधिक एकवचन में सामान्य मानवीय सत्य कहते हैं। आधुनिक हिन्दी में ‘मनुष्य’ स्रोत के मानवीय और एकवचन भाव को स्वाभाविक रूप से व्यक्त करता है।
- issue: גְמוּל का अर्थ
  choice: प्रतिफल
  alternative: काम; किया हुआ; बदला
  rationale: शब्द में कर्म से उत्पन्न परिणाम, प्रत्युपकार या बदले का भाव हो सकता है। ‘प्रतिफल’ कारण और लौटकर मिलने वाले परिणाम की समानांतरता बचाता है, बिना उसे केवल पुरस्कार या दंड ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मुँह का फल’ और ‘हाथों’ की काव्यात्मक समानांतरता सुरक्षित है; ‘भलाई’ तथा ‘प्रतिफल’ के अर्थ को अनावश्यक रूप से केवल भौतिक समृद्धि, पुरस्कार या दंड तक सीमित नहीं किया गया।
