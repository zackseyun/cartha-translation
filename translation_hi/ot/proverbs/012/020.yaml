source:
  edition: WLC
  text: מִ֭רְמָה בְּ/לֶב חֹ֣רְשֵׁי רָ֑ע וּֽ/לְ/יֹעֲצֵ֖י שָׁל֣וֹם שִׂמְחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/020.yaml
  text: Deceit is in the heart of those who devise evil[b][a], but joy belongs to those who counsel peace.
translation:
  language: hi
  text: 'जो बुराई की योजनाएँ बनाते हैं, उनके हृदय में छल होता है,

    पर जो शान्ति की सलाह देते हैं, उन्हें आनन्द मिलता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִרְמָה
  choice: छल
  rationale: यह संज्ञा कपटपूर्ण मंशा या धोखे को व्यक्त करती है। ‘छल’ संक्षिप्त, स्वाभाविक और नीतिवचन की नैतिक भाषा के अनुकूल है।
- source_word: בְּלֶב
  choice: हृदय में
  rationale: इब्रानी में ‘हृदय’ विचार, इच्छा और आन्तरिक मंशा का केंद्र है; हिन्दी में ‘हृदय में’ इस आन्तरिक नैतिक प्रवृत्ति को बनाए रखता है।
- source_word: חֹרְשֵׁי רָע
  choice: जो बुराई की योजनाएँ बनाते हैं
  rationale: यह कृदन्त जान-बूझकर बुराई गढ़ने या उसकी योजना बनाने का भाव रखता है; यह सामान्यतः बुराई करने से अधिक विचारपूर्वक षड्यंत्र रचने पर बल देता है।
- source_word: וּלְיֹעֲצֵי שָׁלוֹם
  choice: पर जो शान्ति की सलाह देते हैं
  rationale: לְ विरोधी समूह को चिह्नित करता है और יֹעֲצֵי सलाह देने वालों को। यह अनुवाद इब्रानी की क्रियात्मक शक्ति और दोनों पंक्तियों का विरोध बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यहाँ शब्द मेल-मिलाप, कुशलता और समग्र भलाई तक विस्तृत अर्थ रख सकता है; मुख्य पाठ में ‘शान्ति’ सबसे स्वाभाविक है और बुराई की योजना के साथ स्पष्ट विरोध बनाती है।
- source_word: שִׂמְחָה
  choice: आनन्द मिलता है
  rationale: मूल में क्रियारहित वाक्य है—शाब्दिक रूप से ‘शान्ति की सलाह देने वालों के लिए आनन्द।’ ‘आनन्द मिलता है’ हिन्दी में स्वाभाविक ढंग से उस सम्बन्ध को व्यक्त करता है, बिना उसे पुरस्कार की किसी विशिष्ट धार्मिक धारणा में बदलने के।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और समानांतर काव्यात्मक संरचना रखी गई है। ‘हृदय’ को केवल भावना नहीं, बल्कि मंशा और विचार के केंद्र के रूप में रखा गया है। ‘शान्ति’ के व्यापक अर्थ को मुख्य पाठ में खुला छोड़ा गया है; अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
