id: PRO.12.9
reference: Proverbs 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ט֣וֹב נִ֭קְלֶה וְ/עֶ֣בֶד ל֑/וֹ מִ֝/מְּתַכַּבֵּ֗ד וַ/חֲסַר לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/009.yaml
  text: Better is one who is lightly esteemed and has a servant than one who honors himself and lacks bread[a].
translation:
  language: hi
  text: जो कम आदर पाता है, पर उसके पास एक सेवक है, वह उस व्यक्ति से बेहतर है जो अपना आदर करता है, पर रोटी से वंचित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अपने को बड़ा दिखाता है, पर उसके पास रोटी नहीं है।” ‘अपना आदर करता है’ के लिए प्रयुक्त इब्रानी अभिव्यक्ति का अर्थ स्वयं को आदरणीय या महत्त्वपूर्ण दिखाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: बेहतर है
  rationale: तुलनात्मक नीतिवचन में यह शब्द केवल ‘अच्छा’ नहीं, बल्कि ‘बेहतर’ का भाव देता है; हिन्दी में स्वाभाविक वाक्य-रचना के लिए ‘है’ जोड़ा गया है।
- source_word: נִקְלֶה
  choice: जो कम आदर पाता है
  rationale: निफ़अल कृदन्त उस व्यक्ति को दर्शाता है जिसे समाज में हल्का या कम माननीय समझा जाता है। यह अनुवाद ‘तुच्छ समझा गया’ जैसी अधिक कठोर अभिव्यक्ति से बचते हुए सामाजिक प्रतिष्ठा का भाव रखता है।
- source_word: וְעֶבֶד לוֹ
  choice: पर उसके पास एक सेवक है
  rationale: शाब्दिक अर्थ ‘और उसके लिए/उसका एक सेवक’ है, अर्थात वह सेवक रख सकने योग्य साधन रखता है। विरोध को सहज हिन्दी में स्पष्ट करने के लिए ‘पर’ प्रयुक्त है।
- source_word: מִמְּתַכַּבֵּד
  choice: जो अपना आदर करता है
  rationale: כבד का हित्पअेल कृदन्त आत्म-सम्मान अथवा स्वयं को प्रतिष्ठित दिखाने का प्रतिवर्ती भाव रखता है। मुख्य पाठ इस अस्पष्टता को खुला रखता है; दिखावे का संभावित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וַחֲסַר לָחֶם
  choice: पर रोटी से वंचित है
  rationale: לֶחֶם का ठोस बिंब ‘रोटी’ के रूप में सुरक्षित है और मूलभूत भोजन की कमी व्यक्त होती है। हिन्दी में तुलना का विरोध स्पष्ट करने के लिए ‘पर’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। सामाजिक प्रतिष्ठा और वास्तविक आर्थिक साधनों के बीच मूल विरोध को सुरक्षित रखा गया है।
