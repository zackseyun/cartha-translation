  yaml_path: translation/ot/proverbs/012/005.yaml
  text: The thoughts of the righteous are justice[b][a]; the counsels of the wicked are deceit.
translation:
  language: hi
  text: धर्मियों के विचार[a] न्यायपूर्ण हैं[b], पर दुष्टों की योजनाएँ छलपूर्ण हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “योजनाएँ।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “न्याय” या “निर्णय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: विचार
  rationale: इस संज्ञा का अर्थ विचार, मनसूबे या योजनाएँ हो सकता है। यहाँ ‘विचार’ स्वाभाविक है और व्यक्ति की भीतरी नैतिक प्रवृत्ति को व्यक्त करता है।
- source_word: צַדִּיקִים
  choice: धर्मी
  rationale: यह विशेषण संज्ञा के रूप में धर्मी लोगों के लिए प्रयुक्त है। ‘धर्मी’ प्रतिनिधिक बहुवचन और नैतिक विरोध दोनों बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्यायपूर्ण
  rationale: मूल में संज्ञा ‘न्याय/निर्णय’ है, जो धर्मियों के विचारों का गुण बताती है। हिन्दी में विधेय के रूप में ‘न्यायपूर्ण होते हैं’ स्वाभाविक है और न्याय के मूल भाव को स्पष्ट रखता है।
- source_word: תַּחְבֻּלוֹת
  choice: सलाह
  rationale: यह शब्द परामर्श, दिशा या सोच-समझकर बनाई गई रणनीति को सूचित कर सकता है। ‘सलाह’ अनावश्यक रूप से नकारात्मक अर्थ जोड़े बिना समानांतर पंक्ति में सहज बैठता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: यह संज्ञार्थक विशेषण दुष्ट लोगों को दर्शाता है और ‘धर्मी’ के साथ स्पष्ट नैतिक विरोध बनाता है।
- source_word: מִרְמָה
  choice: छल
  rationale: यह संज्ञा धोखे, कपट या छल का अर्थ देती है। ‘छल’ संक्षिप्त, सहज और नैतिक आशय में सटीक है।
