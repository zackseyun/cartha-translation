  text: A prudent man conceals knowledge[b][a], but the heart of fools proclaims folly.
translation:
  language: hi
  text: समझदार मनुष्य अपने ज्ञान को छिपाए रखता है[a], पर मूर्खों का हृदय मूर्खता की घोषणा करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चतुर मनुष्य ज्ञान को ढाँपता है।” हिब्रू विशेषण का अर्थ “चतुर” भी हो सकता है, और क्रिया का शाब्दिक अर्थ “ढाँपता है” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मूर्खों का हृदय मूर्खता पुकारता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एक व्यक्ति की बात है; आधुनिक मानक हिन्दी में ‘मनुष्य’ प्रतिनिधि एकवचन को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: עָרוּם
  choice: समझदार
  rationale: नीतिवचन में यहाँ इसका सकारात्मक अर्थ विवेकी और सावधान व्यक्ति है; ‘समझदार’ सामान्य पाठक के लिए सहज है, जबकि मूल में ‘चतुर’ अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: כֹּסֶה
  choice: छिपाए रखता है
  rationale: क्रिया का मूल अर्थ ढाँकना/छिपाना है; प्रसंग में यह ज्ञान का संयमपूर्वक प्रदर्शन न करने को व्यक्त करता है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह हिब्रू ज्ञान-साहित्य का मानक शब्द है और ‘मूर्खता’ के साथ स्पष्ट विरोध बनाता है।
- source_word: לֵב
  choice: हृदय
  rationale: मूल का देहात्मक रूपक बनाए रखा गया है; यहाँ हृदय विचार, स्वभाव और भीतरी व्यक्ति को दर्शाता है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: नीतिवचन की नैतिक-बौद्धिक श्रेणी के लिए ‘मूर्ख’ स्थापित और सीधा हिन्दी शब्द है।
- source_word: יִקְרָא
  choice: पुकारता है
  rationale: मूल क्रिया के ‘पुकारना’ अर्थ को निकटता से रखता है और मूर्खता के खुले रूप से प्रकट होने का चित्र सुरक्षित रखता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: नीतिवचन के प्रमुख शब्द का स्वाभाविक हिन्दी रूप है और ‘मूर्खों’ के साथ शब्दगत संबंध बनाए रखता है।
