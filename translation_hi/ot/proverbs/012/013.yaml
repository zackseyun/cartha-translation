source:
  edition: WLC
  text: בְּ/פֶ֣שַׁע שְׂ֭פָתַיִם מוֹקֵ֣שׁ רָ֑ע וַ/יֵּצֵ֖א מִ/צָּרָ֣ה צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/013.yaml
  text: In the transgression of the lips there is a snare for an evil man[b][a], but the righteous comes out of trouble.
translation:
  language: hi
  text: होंठों के अपराध में बुरे मनुष्य के लिए फंदा है[a][b], पर धर्मी संकट से बाहर निकल आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होंठों के अपराध से बुरा मनुष्य फँस जाता है।” इब्रानी वाक्य संक्षिप्त है; इसे अपराध के भीतर फंदा होने या अपराध के कारण फँसने—दोनों अर्थों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “होंठ” बोलने या बोले गए शब्दों के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּפֶשַׁע
  choice: अपराध में
  rationale: בְ स्थान, माध्यम या परिणाम-संबंध व्यक्त कर सकता है। ‘में’ इब्रानी की संक्षिप्तता और वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: שְׂפָתַיִם
  choice: होंठों के
  rationale: शाब्दिक देह-अंग रूपक रखा गया है; यहाँ ‘होंठ’ बोलने या बोले गए शब्दों का संकेत है।
- source_word: מוֹקֵשׁ
  choice: फंदा
  rationale: यह शिकार में फँसाने वाले साधन की सजीव नीतिवचनात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָע
  choice: बुरे मनुष्य
  rationale: विशेषण का संज्ञात्मक प्रयोग एक बुरे व्यक्ति को दर्शाता है। एकवचन पुल्लिंग प्रतिनिधिक प्रकार को यथासंभव रखा गया है।
- source_word: וַיֵּצֵא
  choice: बाहर निकल आता है
  rationale: क्रिया के ठोस ‘निकलना’ बिंब को बनाए रखता है और ‘बच निकलता है’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: מִצָּרָה
  choice: संकट से
  rationale: צָרָה मुसीबत, विपत्ति या संकट को दर्शाता है; ‘संकट’ यहाँ संक्षिप्त और स्वाभाविक है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: संज्ञात्मक विशेषण के लिए प्रचलित, संक्षिप्त हिन्दी शब्द, जो नीतिवचन में नैतिक विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक एकवचन पुल्लिंग संज्ञाएँ
  choice: बुरे मनुष्य ... धर्मी
  alternative: बुरा व्यक्ति ... धर्मी व्यक्ति
  rationale: इब्रानी में दोनों चरित्र-प्रकार एकवचन पुल्लिंग में हैं। हिन्दी में स्वाभाविक रहते हुए इस रूप को बनाए रखा गया है; इसका आशय केवल पुरुषों तक सीमित करना नहीं है।
- issue: वाणी के अपराध और फंदे का संबंध
  choice: अपराध में ... फंदा है
  alternative: होंठों के अपराध से बुरा मनुष्य फँस जाता है
  rationale: इब्रानी בְ स्थान अथवा माध्यम/परिणाम दोनों संबंधों की अनुमति देता है। मुख्य पाठ ने अधिक औपचारिक और अस्पष्ट ‘में’ रखा है, जबकि वैकल्पिक कारणात्मक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘फंदा’, ‘धर्मी’ और ‘संकट’ सामान्य पाठक के लिए बोधगम्य हैं; मूल का होंठों वाला रूपक और संबंधगत अस्पष्टता सुरक्षित रखी गई है।
