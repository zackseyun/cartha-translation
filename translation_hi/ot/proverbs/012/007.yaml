id: PRO.12.7
reference: Proverbs 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָפ֣וֹךְ רְשָׁעִ֣ים וְ/אֵינָ֑/ם וּ/בֵ֖ית צַדִּיקִ֣ים יַעֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/012/007.yaml
  text: The wicked are overthrown and are no more[b][a], but the house of the righteous will stand.
translation:
  language: hi
  text: दुष्ट उलट दिए जाते हैं और फिर नहीं रहते[a], पर धर्मियों का घराना बना रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और वे नहीं हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “धर्मियों का घर खड़ा रहेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָפוֹךְ
  choice: उलट दिए जाते हैं
  rationale: इब्रानी रूप यहाँ संक्षिप्त, परिणामसूचक कथन के रूप में काम करता है। यह चुनाव विनाश या सत्ता-पलट की छवि को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: רְשָׁעִים
  choice: दुष्ट
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में नैतिक रूप से बुरे लोगों को दर्शाता है; ‘दुष्ट’ हिन्दी नीतिवचन की संक्षिप्त और स्पष्ट अभिव्यक्ति है।
- source_word: וְאֵינָם
  choice: और फिर नहीं रहते
  rationale: शाब्दिक अर्थ ‘और वे नहीं हैं’ है। ‘फिर नहीं रहते’ उनके मिट जाने का स्वाभाविक हिन्दी अर्थ देता है, बिना ‘लुप्त हो जाते हैं’ जैसी अतिरिक्त क्रिया जोड़ने के।
- source_word: וּבֵית
  choice: पर ... का घराना
  rationale: בַּיִת भौतिक घर के साथ परिवार या वंश को भी सूचित कर सकता है। प्रसंग में स्थायी परिवार/वंश की सम्भावना प्रबल है; ‘पर’ दोनों अर्धपंक्तियों का विरोध स्पष्ट करता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह बहुवचन संज्ञार्थक विशेषण नैतिक रूप से सही आचरण करने वालों को दर्शाता है; ‘धर्मी’ आधुनिक बाइबलीय हिन्दी में परिचित और संक्षिप्त है।
- source_word: יַעֲמֹד
  choice: बना रहेगा
  rationale: मूल अर्थ ‘खड़ा रहेगा’ है, और यहाँ स्थिरता तथा टिके रहने को सूचित करता है। ‘बना रहेगा’ घराने के साथ स्वाभाविक है, जबकि पादटिप्पणी ठोस रूपक को सुरक्षित रखती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। मुख्य पाठ में ‘घराना’ सन्दर्भगत सामूहिक अर्थ को सहज बनाता है, जबकि पादटिप्पणी ‘घर’ और ‘खड़ा रहेगा’ की मूल ठोस छवि तथा वास्तविक अर्थगत व्यापकता को सुरक्षित रखती है।
