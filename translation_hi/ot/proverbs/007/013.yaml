  text: 'She seized him and kissed him[a]; with a bold face she said to him:'
translation:
  language: hi
  text: 'उसने उसे पकड़ लिया और चूमा; फिर निर्लज्ज होकर[a] उससे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ढिठाई से” अथवा “बेधड़क होकर।” इब्रानी मुहावरा धृष्ट और बिना लज्जा की बेबाकी व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱזִיקָה בּוֹ
  choice: उसने उसे पकड़ लिया
  rationale: החזיק ב का अर्थ किसी को दृढ़ता से पकड़ना या थाम लेना है। प्रसंग में अचानक और आक्रामक पहल को स्वाभाविक हिन्दी में व्यक्त करने के लिए यह चयन किया गया है।
- source_word: וְנָשְׁקָה לּוֹ
  choice: और चूमा
  rationale: Qal में נשק का सामान्य अर्थ ‘चूमना’ है। हिन्दी में कर्म पिछले खंड से स्पष्ट है, इसलिए अनावश्यक पुनरावृत्ति के बिना सीधा कथन रखा गया है।
- source_word: הֵעֵזָה פָנֶיהָ
  choice: निर्लज्ज होकर
  rationale: यह इब्रानी मुहावरा चेहरे को कठोर या साहसी बनाने के द्वारा धृष्ट, बेझिझक और लज्जाहीन व्यवहार व्यक्त करता है। शाब्दिक ‘अपना चेहरा कठोर किया’ आधुनिक हिन्दी में अस्पष्ट होता; ‘निर्लज्ज होकर’ प्रसंगगत बल को स्वाभाविक ढंग से रखता है।
- source_word: וַתֹּאמַר לוֹ
  choice: उससे कहा
  rationale: לוֹ संबोधित व्यक्ति को स्पष्ट करता है। ‘उससे कहा’ मूल के संबंध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रवाहपूर्ण और गरिमापूर्ण कथन। ‘निर्लज्ज होकर’ मुहावरे का अर्थ स्पष्ट करता है, जबकि पादटिप्पणी निकटवर्ती वैकल्पिक अर्थों को सुरक्षित रखती है।
