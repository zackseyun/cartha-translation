source:
  edition: WLC
  text: קָשְׁרֵ֥/ם עַל אֶצְבְּעֹתֶ֑י/ךָ כָּ֝תְבֵ֗/ם עַל ל֥וּחַ לִבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/003.yaml
  text: Tie them on your fingers[a]; write them on the tablet of your heart.
translation:
  language: hi
  text: उन्हें अपनी उँगलियों पर बाँध ले; उन्हें अपने हृदय की पटिया पर लिख ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָשְׁרֵם
  choice: उन्हें बाँध ले
  rationale: קשר का आदेशात्मक रूप वस्तुतः ‘बाँधना’ या ‘कसकर लगाना’ बताता है। ‘बाँध ले’ ठोस रूपक और निकटता से सँजोकर रखने का भाव बनाए रखता है।
- source_word: עַל אֶצְבְּעֹתֶיךָ
  choice: अपनी उँगलियों पर
  rationale: עַל यहाँ स्थानसूचक ‘पर’ है और אֶצְבְּעוֹת बहुवचन ‘उँगलियाँ’ है; यह अनुवाद इब्रानी बिंब को सीधे सुरक्षित रखता है।
- source_word: כָּתְבֵם
  choice: उन्हें ... लिख ले
  rationale: כתב का आदेशात्मक रूप ‘लिखना’ है। ‘लिख ले’ हिन्दी में स्वाभाविक है और शिक्षा को भीतर अंकित करने के समानांतर रूपक को बनाए रखता है।
- source_word: עַל לוּחַ
  choice: पटिया पर
  rationale: לוּחַ लिखने की पटिया या तख्ती को दर्शाता है। ‘पटिया’ ठोस लेखन-बिंब को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: לִבֶּךָ
  choice: अपने हृदय की
  rationale: לֵב विचार, इच्छा और भावना सहित भीतरी मनुष्य को समेट सकता है। ‘हृदय’ स्थापित और व्यापक हिन्दी समतुल्य है तथा मूल रूपक को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
theological_decisions:
- issue: शिक्षा को आत्मसात करने का रूपक
  choice: उँगलियों पर बाँधने और हृदय की पटिया पर लिखने के दोनों ठोस रूपक बनाए रखे गए हैं।
  alternative: उन्हें सदा याद रख और मन में गहराई से बसा ले।
  rationale: मूल पद केवल स्मरण का सार नहीं देता, बल्कि दो सजीव और परस्पर समानांतर बिंबों से शिक्षा की निरंतर उपस्थिति और भीतरी आत्मसातीकरण व्यक्त करता है। उन्हें ज्यों का त्यों रखना साहित्यिक और धर्मवैचारिक प्रतिध्वनि को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और गरिमापूर्ण है। एकवचन पुरुष को संबोधित अनौपचारिक आदेश ‘बाँध ले/लिख ले’ मूल के 2ms आदेशात्मक रूप को स्वाभाविक ढंग से दर्शाता है। ‘पटिया’ को ‘तख्ती’ पर इसलिए चुना गया कि ‘हृदय की पटिया’ लेखन के बिंब में अधिक सहज और बाइबलीय शैली के अनुकूल है।
