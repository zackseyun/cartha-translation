  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है; ‘खिड़की’ और ‘जाली’ अलग-अलग इब्रानी शब्दों का भेद सुरक्षित रखते हैं।
