base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/006.yaml
  text: For at the window of my house[a], through my lattice, I looked out,
translation:
  language: hi
  text: 'क्योंकि मैंने अपने घर की खिड़की से,

    अपनी जाली के आर-पार बाहर देखा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे आने वाले वर्णन का आधार प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּחַלּוֹן בֵּיתִי
  choice: अपने घर की खिड़की पर से
  rationale: חַלּוֹן का अर्थ ‘खिड़की’ है और בְּ यहाँ देखने की स्थिति या स्थान को सूचित करता है; ‘पर से’ वक्ता के खिड़की के पास रहकर बाहर देखने का दृश्य स्पष्ट करता है।
- source_word: בְּעַד אֶשְׁנַבִּי
  choice: अपनी जाली में से
  rationale: אֶשְׁנָב जालीदार झरोखे या खिड़की की जाली को दर्शाता है और בְּעַד उसके आर-पार देखने का भाव देता है; यह पहले आए ‘खिड़की’ से शब्दगत भेद भी बनाए रखता है।
- source_word: נִשְׁקָפְתִּי
  choice: बाहर देख रहा था
  rationale: क्रिया किसी ऊँचे या भीतर के स्थान से बाहर देखने को व्यक्त करती है; हिन्दी का अपूर्ण भूतकाल इस दृश्यात्मक, जारी निरीक्षण के लिए स्वाभाविक है और अनावश्यक तीव्रता नहीं जोड़ता।
