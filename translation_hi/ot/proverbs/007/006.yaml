  to: 'क्योंकि मैंने अपने घर की खिड़की से,

    अपनी जाली के आर-पार बाहर देखा।'
  rationale: The revision uses simple past for the Hebrew perfect, replaces the potentially misleading “पर से” with idiomatic “से,” and uses “के आर-पार” to express looking through the lattice. It retains the source’s explanatory connection and the window/lattice distinction without adding interpretive detail.
