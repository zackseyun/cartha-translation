base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/021.yaml
  text: She persuades him with her abundant persuasion[a]; with the smoothness of her lips she compels him.
translation:
  language: hi
  text: वह अपनी बहुत समझाइश से उसे मना लेती है[a]; अपने होंठों की चिकनी-चुपड़ी बातों से उसे आगे हाँक ले जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बहुत समझाइश से उसे मोड़ देती है; अपने होंठों की चिकनाई से उसे आगे धकेलती है।”
    reason: हिब्रू हिफ़ील क्रियाओं में किसी को मोड़ देने तथा आगे धकेलने या हाँकने का अधिक सशक्त भाव भी संभव है।
lexical_decisions:
- source_word: הִטַּתּוּ
  choice: उसे मना लेती है
  rationale: हिफ़ील रूप किसी को मोड़ने या प्रभावित करने का भाव देता है। प्रसंग में यह उसकी लुभावनी बातों के प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्रिया में स्वयं निहित अर्थ से अधिक स्पष्ट यौन अर्थ जोड़े।
- source_word: בְּרֹב לִקְחָהּ
  choice: अपनी ढेर सारी लुभावनी बातों से
  rationale: רֹב बहुतायत को और לֶקַח यहाँ प्रभाव डालने वाले कथन या मनाने की वाणी को दर्शाता है। संयुक्त पद हिन्दी में मात्रा और साधन दोनों को सहज रूप से व्यक्त करता है।
- source_word: בְּחֵלֶק שְׂפָתֶיהָ
  choice: अपने होंठों की चिकनी-चुपड़ी बातों से
  rationale: חֵלֶק की 'चिकनाई' वाली रूपक-छवि तथा שְׂפָתֶיהָ के 'होंठ' दोनों सुरक्षित रखे गए हैं; 'चिकनी-चुपड़ी बातें' आधुनिक हिन्दी में चापलूसी भरी मोहक वाणी का स्वाभाविक मुहावरा है।
- source_word: תַּדִּיחֶנּוּ
  choice: उसे बहका ले जाती है
  rationale: हिफ़ील क्रिया धकेलने, हटा देने या किसी दिशा में ले जाने का प्रबल भाव रखती है। 'बहका ले जाती है' भटकाने और आगे ले चलने के दोनों संदर्भगत पहलुओं को व्यक्त करता है, यद्यपि मूल का बलपूर्वक हाँकने वाला पक्ष वैकल्पिक पाठ में अधिक स्पष्ट है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियों में वाणी के प्रभाव की क्रमिक तीव्रता बनाए रखी गई है। मुख्य पाठ मुहावरेदार हिन्दी अपनाता है, जबकि पादटिप्पणी अधिक शाब्दिक और प्रबल वैकल्पिक अर्थ सुरक्षित रखती है।
