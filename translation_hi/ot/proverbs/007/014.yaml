  text: זִבְחֵ֣י שְׁלָמִ֣ים עָלָ֑/י הַ֝/יּ֗וֹם שִׁלַּ֥מְתִּי נְדָרָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/014.yaml
  text: Peace offerings were due from me[a]; today I have paid my vows.
translation:
  language: hi
  text: मुझे मेल-बलियाँ[a] चढ़ानी थीं; आज मैंने अपनी मन्नतें पूरी की हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन्हें ‘कुशल-बलियाँ’ या ‘सहभागिता-बलियाँ’ भी कहा जा सकता है। इब्रानी शब्द शांति या कुशलता से जुड़ी उन बलियों को दर्शाता है, जिनका कुछ मांस बलि चढ़ाने के बाद भोजन में खाया जा सकता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִבְחֵי שְׁלָמִים
  choice: मेलबलियाँ
  rationale: यह पदबंध शांति, कुशलता अथवा मेल से जुड़ी बलियों को दर्शाता है। ‘मेलबलियाँ’ हिन्दी बाइबिलीय संदर्भ में संक्षिप्त और स्पष्ट पंथ-संबंधी शब्द है; यह केवल साथ भोजन करने का भाव जोड़कर मूल को अधिक व्याख्यात्मक नहीं बनाता।
- source_word: עָלָי
  choice: मुझे … चढ़ानी थीं
  rationale: शाब्दिक रूप ‘मुझ पर’ है, पर यहाँ बलि और मन्नत के संदर्भ में यह वक्ता पर आए दायित्व को व्यक्त करता है। हिन्दी में ‘मुझे … चढ़ानी थीं’ उसी आशय को स्वाभाविक ढंग से रखता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह सीधे वर्तमान दिन का समय-सूचक शब्द है; ‘आज’ आधुनिक हिन्दी का सहज समतुल्य है।
- source_word: שִׁלַּמְתִּי
  choice: पूरी की हैं
  rationale: पिएल रूप, मन्नतों के साथ, उन्हें निभाने या पूरा करने का अर्थ देता है। ‘पूरी की हैं’ पूर्ण हुई क्रिया और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְדָרָי
  choice: अपनी मन्नतें
  rationale: यह נֶדֶר का बहुवचन तथा प्रथम पुरुष एकवचन संबंधसूचक रूप है। ‘अपनी मन्नतें’ धार्मिक प्रतिज्ञाओं का अर्थ स्पष्ट करता है और मूल में न होने वाला ‘भेंटें’ शब्द नहीं जोड़ता।
theological_decisions:
- issue: व्यभिचारिणी स्त्री के कथन में बलि और मन्नत की धार्मिक शब्दावली
  choice: बलि और मन्नत की स्पष्ट धार्मिक भाषा को यथावत रखना
  alternative: इसे केवल भोजन तैयार होने का सामान्य कथन बनाकर कहना
  rationale: वचन में स्त्री वैध उपासना की भाषा को अपने प्रलोभन के संदर्भ में इस्तेमाल करती है। अनुवाद इस नैतिक और धार्मिक तनाव को बनाए रखता है तथा न तो उसे नरम करता है, न उस पर अतिरिक्त नैतिक टिप्पणी जोड़ता है।
- issue: עָלָי का आशय
  choice: बलि चढ़ाने का दायित्व—‘मुझे … चढ़ानी थीं’
  alternative: स्थान या अधिकार का भाव—‘मेरे पास मेलबलियाँ थीं’
  rationale: ‘मुझ पर’ का मुहावरेदार आशय यहाँ मन्नत के कारण आई जिम्मेदारी हो सकता है, और अगली पंक्ति में मन्नतें पूरी करने का कथन इसे समर्थन देता है। फिर भी भोजन उपलब्ध होने का प्रसंगगत परिणाम पादटिप्पणी में स्पष्ट किया गया है, पाठ में आरोपित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक कथन के अनुकूल शैली रखी गई है। ‘मेलबलियाँ’ और ‘मन्नतें’ धार्मिक संदर्भ को स्पष्ट रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज है।
