  text: וְ/עַתָּ֣ה בָ֭נִים שִׁמְעוּ לִ֑/י וְ֝/הַקְשִׁ֗יבוּ לְ/אִמְרֵי פִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/024.yaml
  text: And now[a], sons, listen to me, and pay attention to the words of my mouth.
translation:
  language: hi
  text: और अब, हे बेटो,[a] मेरी सुनो और मेरे मुँह की बातों पर ध्यान दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चो।” इब्रानी में यह पुल्लिंग बहुवचन रूप है, जिसका ज्ञान-साहित्य में शिक्षा देते समय संबोधन के रूप में प्रयोग होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालवाचक क्रिया-विशेषण पिछले वर्णन से निष्कर्षात्मक संक्रमण करके नई चेतावनी आरम्भ करते हैं; इस संदर्भ में ‘इसलिए अब’ प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָנִים
  choice: हे बेटो
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और नीतिवचन की शिक्षात्मक संबोधन-शैली को बनाए रखता है। हिन्दी में ‘हे बेटो’ सीधा, गरिमापूर्ण संबोधन है।
- source_word: שִׁמְעוּ לִי
  choice: मेरी सुनो
  rationale: שׁמע के साथ ל वक्ता की ओर लगाकर सुनने का आदेश देता है; ‘मेरी सुनो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וְהַקְשִׁיבוּ
  choice: ध्यान दो
  rationale: हिफ़ील रूप सावधानी से सुनने की प्रबल आज्ञा देता है; ‘ध्यान दो’ उसका सहज हिन्दी रूप है।
- source_word: לְאִמְרֵי פִי
  choice: मेरे मुँह की बातों पर
  rationale: यह रूप मूल के ‘मेरे मुँह की बातों/वचनों’ वाले काव्यात्मक मुहावरे को बचाता है और हिन्दी में समझने योग्य रहता है।
theological_decisions:
- issue: ज्ञान-साहित्य के संबोधन में लिंग-सूचक बहुवचन
  choice: बेटो
  alternative: बच्चो
  rationale: मूल पाठ में स्पष्टतः पुल्लिंग बहुवचन है। मुख्य पाठ में इसे सुरक्षित रखा गया है, जबकि पादटिप्पणी यह बताती है कि शिक्षात्मक संबोधन के रूप में इसका दायरा व्यापक समझा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा शिक्षात्मक संबोधन, सहज आज्ञार्थक शैली और मूल की काव्यात्मक देह-छवि को बनाए रखा गया है।
