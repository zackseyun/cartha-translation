- source_word: בָּרְחֹבוֹת
  choice: चौकों में
  rationale: बहुवचन रूप नगर के खुले सार्वजनिक स्थानों या चौकों का बोध कराता है; यह पहले आए सड़क-क्षेत्र से भी भेद बनाए रखता है।
- source_word: וְאֵצֶל כָּל פִּנָּה
  choice: और हर मोड़ के पास
  rationale: אֵצֶל निकटता और פִּנָּה कोना या मोड़ व्यक्त करता है। हिंदी में “हर मोड़ के पास” नगर के रणनीतिक स्थानों पर प्रतीक्षा करने का स्वाभाविक चित्र देता है।
- source_word: תֶאֱרֹב
  choice: घात लगाए रहती है
  rationale: क्रिया छिपकर शिकार या अवसर की प्रतीक्षा करने का भाव रखती है। “घात लगाए रहती है” इसके गुप्त और शिकारी स्वर को सुरक्षित रखता है।
