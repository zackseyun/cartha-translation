    text: या “कभी बाहर, कभी खुले चौकों में।” इब्रानी में “कभी” का दोहराव उसके एक स्थान से दूसरे स्थान पर जाते रहने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या “छिपकर ताकती रहती है” अथवा “घात में बैठी रहती है।” इब्रानी क्रिया गुप्त और शिकारी ढंग से प्रतीक्षा करने का भाव देती है।
    reason: lexical_alternative
