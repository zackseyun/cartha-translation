  language: hi
  text: वह शोर मचाने वाली और विद्रोही है; उसके पैर घर में नहीं टिकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֹמִיָּה
  choice: शोर मचाने वाली
  rationale: यह शब्द ऊँची आवाज़ करने वाली या कोलाहलपूर्ण स्त्री का भाव देता है; यह सहज आधुनिक हिन्दी में उसी व्यवहार को व्यक्त करता है।
- source_word: סֹרָרֶת
  choice: विद्रोही
  rationale: यह हठपूर्वक अवज्ञा करने और नियंत्रण न मानने का भाव रखता है; ‘विद्रोही’ संक्षिप्त और संदर्भानुकूल है।
- source_word: לֹא יִשְׁכְּנוּ רַגְלֶיהָ
  choice: उसके पैर घर में नहीं टिकते
  rationale: इब्रानी मुहावरे में पैरों के न ठहरने से उसके लगातार घर से बाहर रहने का चित्र मिलता है; हिन्दी में ‘पैर नहीं टिकते’ इस चित्र और अर्थ दोनों को स्वाभाविक रूप से बनाए रखता है।
