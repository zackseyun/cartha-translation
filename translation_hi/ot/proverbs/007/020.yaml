translation:
  language: hi
  text: उसने अपने हाथ में पैसों की थैली ली है; वह पूर्णिमा के दिन घर आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְרוֹר הַכֶּסֶף
  choice: चाँदी की थैली
  rationale: צְרוֹר किसी बाँधी हुई पोटली या थैली को दर्शाता है, और הַכֶּסֶף का मूल अर्थ ‘चाँदी’ है, जो धन के अर्थ में भी प्रयुक्त होता है। ‘चाँदी की थैली’ मूल बिंब और धनराशि—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָקַח בְּיָדוֹ
  choice: अपने हाथ में लेकर गया है
  rationale: यह चयन इब्रानी के ठोस मुहावरे ‘अपने हाथ में लिया’ को सुरक्षित रखते हुए प्रसंग से स्पष्ट यात्रा का भाव स्वाभाविक हिन्दी में व्यक्त करता है। पूर्ण क्रिया को स्त्री के वर्तमान कथन में पूर्ण हो चुकी क्रिया के रूप में रखा गया है।
- source_word: לְיוֹם הַכֵּסֶא
  choice: पूर्णिमा के दिन ही
  rationale: כֵּסֶא दुर्लभ और विवादित शब्द है; इस प्रसंग में ‘पूर्णिमा’ सम्भावित अर्थ है और पति के देर से लौटने के आश्वासन से मेल खाता है। לְיוֹם के समय-सूचक बल को ‘के दिन’ और विलम्ब पर कथन के जोर को स्वाभाविक ‘ही’ से व्यक्त किया गया है।
- source_word: יָבֹא בֵיתוֹ
  choice: घर लौटेगा
  rationale: शाब्दिक अर्थ ‘अपने घर आएगा’ है; यात्रा पर गए व्यक्ति के विषय में ‘घर लौटेगा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को नहीं बदलता।
