source:
  edition: WLC
  text: דַּרְכֵ֣י שְׁא֣וֹל בֵּיתָ֑/הּ יֹ֝רְד֗וֹת אֶל חַדְרֵי מָֽוֶת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/027.yaml
  text: Her house is the way to Sheol[b][a], going down to the chambers of death.
translation:
  language: hi
  text: उसका घर अधोलोक[a] का मार्ग है[b], जो मृत्यु के भीतरी कक्षों में उतरता जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘शीओल’—मृतकों का लोक; इसका अनुवाद ‘कब्र’ भी किया जाता है।'
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, ‘मार्ग हैं’; इब्रानी में ‘मार्ग’ बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּרְכֵי
  choice: मार्ग
  rationale: इब्रानी में यह बहुवचन रचना है, पर आधुनिक हिन्दी में विधेय के रूप में सामूहिक एकवचन ‘मार्ग’ अधिक स्वाभाविक है। बहुवचन की वास्तविकता को पाद-टिप्पणी में रखा गया है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह केवल कब्र नहीं, मृतकों के लोक को सूचित करता है। ‘अधोलोक’ हिन्दी में अर्थ को स्पष्ट रखते हुए बाद की विकसित ‘नरक’ संबंधी धारणा आरोपित नहीं करता।
- source_word: בֵּיתָהּ
  choice: उसका घर
  rationale: संदर्भ में स्त्री का वास्तविक घर प्रमुख है और साथ ही उस स्थान का रूपक भी बना रहता है जिसमें प्रवेश किया जाता है।
- source_word: יֹרְדוֹת
  choice: उतरता जाता है
  rationale: यह निरंतर नीचे की ओर गति का जीवंत भाव व्यक्त करता है। हिन्दी में सामूहिक एकवचन ‘मार्ग’ के अनुसार क्रिया एकवचन रखी गई है; मूल इब्रानी में यह ‘मार्गों’ से सहमत स्त्रीलिंग बहुवचन कृदंत है।
- source_word: אֶל
  choice: में
  rationale: ‘भीतरी कक्षों में उतरना’ लक्ष्य की ओर जाने के साथ भीतर प्रवेश का स्वाभाविक हिन्दी बोध देता है।
- source_word: חַדְרֵי
  choice: भीतरी कक्षों
  rationale: यह भीतर के कमरों या कक्षों को दर्शाता है; ‘भीतरी कक्ष’ पद्य की गंभीर और अशुभ छवि बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: सामान्य संज्ञा के रूप में अनूदित किया गया है; मूल पाठ यहाँ व्यक्तिकरण को अनिवार्य नहीं बनाता।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: शीओल; कब्र; मृतकों का लोक
  rationale: ‘अधोलोक’ मृतकों के लोक का व्यापक अर्थ संप्रेषित करता है, उसे केवल दफनाने की कब्र तक सीमित नहीं करता और न ही उसे सीधे बाद की ‘नरक’ की धारणा से मिला देता है। पाद-टिप्पणी मूल इब्रानी नाम बताती है।
- issue: एकवचन ‘मार्ग’ बनाम बहुवचन ‘मार्गों’
  choice: मुख्य पाठ में सामूहिक एकवचन ‘मार्ग’
  alternative: ‘उसका घर अधोलोक के मार्ग हैं’
  rationale: मूल का बहुवचन महत्त्वपूर्ण है, पर उसका शब्दशः हिन्दी रूप अस्वाभाविक और व्याकरणतः खटकने वाला है। मुख्य पाठ में स्वाभाविक सामूहिक एकवचन रखा गया और बहुवचन को पाद-टिप्पणी में स्पष्ट किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अधोलोक’ शास्त्रीय गंभीरता बनाए रखता है, जबकि ‘उतरता जाता है’ मूल की निरंतर नीचे जाती गति को स्वाभाविक हिन्दी में व्यक्त करता है।
