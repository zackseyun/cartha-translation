translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गंभीर और चित्रात्मक गद्य। ‘कलेजा’ ने मूल के ठोस अंग को सामान्य पाठक के लिए स्वाभाविक रखा है; ‘यकृत’ अत्यधिक चिकित्सकीय लगता। विराम-चिह्न दोनों घातक उपमाओं की निकटता स्पष्ट करते हैं।
