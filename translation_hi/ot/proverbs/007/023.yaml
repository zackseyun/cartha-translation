source:
  edition: WLC
  text: עַ֤ד יְפַלַּ֪ח חֵ֡ץ כְּֽבֵד֗/וֹ כְּ/מַהֵ֣ר צִפּ֣וֹר אֶל פָּ֑ח וְ/לֹֽא יָ֝דַ֗ע כִּֽי בְ/נַפְשׁ֥/וֹ הֽוּא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/023.yaml
  text: until an arrow pierces his liver[a], like a bird rushing into a snare, and he does not know that it will cost him his life.
translation:
  language: hi
  text: जब तक कि तीर उसका कलेजा चीर न दे—जैसे कोई पक्षी फंदे की ओर झपटता है—और वह नहीं जानता कि इससे उसकी जान चली जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कि यह उसके प्राण के लिए है।” इब्रानी वाक्यांश संक्षिप्त है; संदर्भ में इसका अर्थ है कि यह उसके प्राण ले लेगा या उसकी मृत्यु का कारण बनेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: जब तक कि
  rationale: यह पिछले पद में वर्णित युवक की गति को उसके घातक परिणाम तक जारी रखने वाला काल-सूचक है।
- source_word: יְפַלַּח
  choice: चीर न दे
  rationale: पिएल रूप बलपूर्वक भीतर घुसने या आर-पार चीरने का भाव देता है; यह हिंदी में तीर की सजीव छवि बनाए रखता है।
- source_word: חֵץ
  choice: तीर
  rationale: हथियार के लिए सामान्य और सीधा हिंदी पर्याय।
- source_word: כְּבֵדוֹ
  choice: उसका कलेजा
  rationale: मूल शब्द शरीर के ठोस अंग ‘यकृत’ को दर्शाता है। ‘कलेजा’ सामान्य हिंदी में इस सजीव शारीरिक छवि को ‘यकृत’ की अपेक्षा अधिक स्वाभाविक ढंग से रखता है।
- source_word: כְמַהֵר צִפּוֹר אֶל־פָּח
  choice: जैसे कोई पक्षी फंदे की ओर झपटता है
  rationale: यह पक्षी की तेज और अनजान गति को स्वाभाविक हिंदी में व्यक्त करता है; मूल में गंतव्य ‘फंदे की ओर’ है, इसलिए उसे बनाए रखा गया है।
- source_word: וְלֹא יָדַע
  choice: और वह नहीं जानता
  rationale: मूल की सीधी नकारात्मक उपवाक्य-रचना और नीतिवचन की तात्कालिकता सुरक्षित रहती है।
- source_word: כִּי בְנַפְשׁוֹ הוּא
  choice: कि इसमें उसकी जान जाएगी
  rationale: इब्रानी वाक्यांश संक्षिप्त और अंडाकार है, शाब्दिक अर्थ ‘कि यह उसके प्राण के लिए है।’ संदर्भ में इसका आशय मृत्यु की ओर ले जाने वाला परिणाम है; हिंदी चयन इसे स्पष्ट करता है, बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
