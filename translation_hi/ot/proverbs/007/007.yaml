lexical_decisions:
- source_word: וָאֵרֶא
  choice: और मैंने ... देखा
  rationale: ראה के प्रथम पुरुष एकवचन कथात्मक रूप को क्रमिक अवलोकन के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַפְּתָאיִם
  choice: भोले लोगों में
  rationale: नीतिवचन में פְּתָאיִם ऐसे अनुभवहीन और आसानी से बहकाए जाने वाले लोगों का वर्ग है; ‘भोले’ इस आशय को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָבִינָה
  choice: मैंने ... पहचाना
  rationale: בין यहाँ केवल देखने से आगे विवेकपूर्वक ध्यान देकर पहचानने का भाव रखता है; ‘पहचाना’ पहले क्रिया-पद से भेद बनाए रखता है।
- source_word: בַבָּנִים
  choice: जवानों के बीच
  rationale: शाब्दिक अर्थ ‘पुत्रों में’ है, पर प्रसंग में सार्वजनिक स्थान पर मौजूद युवा पुरुषों का समूह अभिप्रेत है।
- source_word: נַעַר
  choice: एक ... युवक
  rationale: נַעַר की आयु-सीमा लड़के से युवक तक हो सकती है; प्रसंग में स्वतंत्र रूप से सड़क पर चलने वाले युवा के लिए ‘युवक’ स्वाभाविक है।
- source_word: חֲסַר לֵב
  choice: नासमझ
  rationale: शाब्दिक ‘हृदय से रहित’ हिब्रू ज्ञान-साहित्य में समझ, विवेक और नैतिक निर्णय की कमी का मुहावरा है; ‘नासमझ’ इसे संक्षेप और सहज रूप में व्यक्त करता है।
