  text: לִ֭/שְׁמָרְ/ךָ מֵ/אִשָּׁ֣ה זָרָ֑ה מִ֝/נָּכְרִיָּ֗ה אֲמָרֶ֥י/הָ הֶחֱלִֽיקָה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/005.yaml
  text: to keep you from the forbidden woman[a], from the foreign woman whose words are smooth.
translation:
  language: hi
  text: तुझे पराई स्त्री से, उस विदेशी स्त्री से बचाने के लिए जो चिकनी-चुपड़ी बातें करती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी बातें लुभावनी हैं” अथवा “जो अपनी बातों से चापलूसी करती है।” इब्रानी में शाब्दिक रूप से है, “जिसने अपनी बातों को चिकना बनाया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמָרְךָ
  choice: ताकि वह तुझे ... बचाए
  rationale: ל prefixed infinitive purpose expresses करता है और שמר का protective sense ‘बचाए’ से सहज आधुनिक हिन्दी में आता है; implied subject previous context की wisdom/instruction है।
- source_word: מֵאִשָּׁה זָרָה
  choice: पराई स्त्री से
  rationale: זָרָה का मूल भाव ‘पराई/बाहरी’ है और नीतिवचन के प्रसंग में अनुचित यौन संबंध के लिए उपलब्ध स्त्री का संकेत देता है; ‘पराई स्त्री’ हिन्दी में इस नैतिक और relational force को बनाए रखता है।
- source_word: מִנָּכְרִיָּה
  choice: उस अनजानी स्त्री से
  rationale: נָכְרִיָּה में foreign/alien का भाव है। ‘अनजानी’ पहले पद के ‘पराई’ से lexical distinction रखता है, बिना यह निश्चित किए कि केवल जातीय विदेशी स्त्री अभिप्रेत है।
- source_word: אֲמָרֶיהָ
  choice: अपनी बातों को
  rationale: Plural construct ‘उसकी बातें/वचन’ को verb के direct object के रूप में स्वाभाविक हिन्दी में ‘अपनी बातों को’ कहा गया है।
- source_word: הֶחֱלִיקָה
  choice: चिकना बनाती है
  rationale: Hiphil का शाब्दिक causative चित्र ‘बातों को चिकना करना’ सुरक्षित रखा गया है; इसका आशय लुभावनी या चापलूसी भरी वाणी है, जिसे footnote स्पष्ट करता है।
theological_decisions:
- issue: זָרָה और נָכְרִיָּה की पहचान
  choice: पराई स्त्री / अनजानी स्त्री
  alternative: व्यभिचारिणी / विदेशी स्त्री
  rationale: Hebrew parallel terms को एक ही निश्चित category में सीमित नहीं किया गया। प्रसंग की नैतिक चेतावनी बनी रहती है, जबकि ethnic foreignness या formal adultery को पाठ से अधिक निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तुझे’ से नीतिवचन में पिता द्वारा पुत्र को दिए जा रहे सीधे, एकवचन संबोधन की निकटता बनी रहती है। रूपक को मुख्य पाठ में रखा गया है और उसका व्यावहारिक अर्थ पाद-टिप्पणी में दिया गया है।
