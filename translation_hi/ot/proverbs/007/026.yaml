  text: כִּֽי רַבִּ֣ים חֲלָלִ֣ים הִפִּ֑ילָה וַ֝/עֲצֻמִ֗ים כָּל הֲרֻגֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/026.yaml
  text: For she has cast down many wounded[a], and all her slain are mighty.
translation:
  language: hi
  text: 'क्योंकि उसने बहुत-से घायलों[a] को गिरा दिया है,

    और उसके मारे हुए सभी जन बलवान[b] हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से मारे गए लोगों को।” यहाँ प्रयुक्त शब्द का अर्थ ‘घायल’ या ‘मारे गए’ हो सकता है; अगली पंक्ति में ‘मारे हुए’ के साथ बढ़ती हुई तीव्रता बनाए रखने के लिए मुख्य पाठ में ‘घायलों’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “बहुत-से” या “असंख्य”; इस शब्द से शक्ति अथवा बड़ी संख्या, दोनों का बोध हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में दी गई चेतावनी का कारण बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: רַבִּים
  choice: बहुत-से
  rationale: यह बड़ी संख्या बताने वाला सामान्य विशेषण है; ‘बहुत-से’ हिंदी में सहज और स्पष्ट है।
- source_word: חֲלָלִים
  choice: घायलों
  rationale: यह शब्द घायल अथवा मारे गए लोगों को सूचित कर सकता है। अगली पंक्ति के הֲרֻגֶיהָ (‘उसके मारे हुए’) से काव्यात्मक तीव्रता बनाए रखने के लिए मुख्य पाठ में ‘घायलों’ चुना गया है।
- source_word: הִפִּילָה
  choice: उसने ... गिरा दिया है
  rationale: נפל के हिफ़ील रूप का अर्थ किसी को गिराना या नीचे ला देना है; यह चुनाव क्रिया की कारकता और चेतावनी की सजीवता बनाए रखता है।
- source_word: וַעֲצֻמִים
  choice: और ... बलवान हैं
  rationale: עָצוּם शक्ति या प्रबलता व्यक्त कर सकता है; ‘बलवान’ इस आशय और इस बात को उभारता है कि शक्तिशाली लोग भी उसके शिकार बने। संख्या की अधिकता का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: כָּל
  choice: सभी
  rationale: सार्वभौमिक अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֲרֻגֶיהָ
  choice: उसके मारे हुए ... जन
  rationale: निष्क्रिय कृदंत के साथ स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय का अर्थ अक्षरशः ‘उसके मारे हुए लोग’ है; ‘जन’ काव्यात्मक संक्षिप्तता और मानवीय संदर्भ दोनों बनाए रखता है।
