translation:
  language: hi
  text: उसके मोड़ के पास की सड़क पर से गुज़रते हुए, वह उसके घर की ओर कदम बढ़ाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मोड़ के पास बाज़ार की सड़क पर से गुज़रते हुए, वह उसके घर के रास्ते पर चलता है।”
    reason: שׁוּק का अर्थ ‘बाज़ार की सड़क’ भी हो सकता है, और דֶרֶךְ בֵּיתָהּ को अधिक ठोस रूप में ‘उसके घर का रास्ता’ समझा जा सकता है।
lexical_decisions:
- source_word: עֹבֵר
  choice: गुज़रते हुए
  rationale: काल सहभागी रूप दृश्य की पृष्ठभूमि में जारी गति दिखाता है; यह हिन्दी में स्वाभाविक रूप से क्रियाविशेषणीय कृदंत द्वारा व्यक्त होता है।
- source_word: בַּשּׁוּק
  choice: सड़क से
  rationale: שׁוּק यहाँ नगर की सार्वजनिक सड़क या बाज़ार वाली सड़क का बोध करा सकता है। मुख्य पाठ में 'सड़क' प्रसंगानुकूल और सहज है; बाज़ार का संभावित भाव पाद-टिप्पणी में रखा गया है।
- source_word: אֵצֶל
  choice: के पास
  rationale: यह निकटता दर्शाने वाला स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: פִּנָּהּ
  choice: उसके मोड़
  rationale: स्त्रीलिंग एकवचन प्रत्यय के कारण मोड़ उस स्त्री से संबद्ध है। 'उसके मोड़' इस संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: וְדֶרֶךְ בֵּיתָהּ
  choice: उसके घर की ओर
  rationale: शाब्दिक संरचना 'उसके घर का मार्ग' है; प्रसंग में यह उसके घर की दिशा में गति बताती है, जिसे हिन्दी में 'उसके घर की ओर' स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִצְעָד
  choice: कदम बढ़ाता है
  rationale: צעד के ठोस 'कदम रखने/बढ़ाने' के चित्र को बनाए रखते हुए यह हिन्दी में स्वाभाविक और प्रवाहपूर्ण है।
