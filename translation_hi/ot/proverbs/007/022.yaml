  text: ה֤וֹלֵ֥ךְ אַחֲרֶ֗י/הָ פִּ֫תְאֹ֥ם כְּ֭/שׁוֹר אֶל טָ֣בַח יָב֑וֹא וּ֝/כְ/עֶ֗כֶס אֶל מוּסַ֥ר אֱוִֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/022.yaml
  text: He goes after her at once[a], like an ox going to the slaughter, and like a fetter to the discipline of a fool.
translation:
  language: hi
  text: 'वह तुरन्त उसके पीछे चल पड़ता है,

    जैसे बैल वध के लिए जाता है,

    और जैसे मूर्ख की ताड़ना के लिए बेड़ी होती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पंक्ति का इब्रानी पाठ कठिन है और इसका अर्थ अनिश्चित है। शाब्दिक रूप से इसमें “बेड़ी” और “मूर्ख की ताड़ना/अनुशासन” का उल्लेख है, पर उनका आपसी संबंध स्पष्ट नहीं है। इसका अनुवाद इस प्रकार भी किया गया है: “जैसे हिरन फंदे में जा पड़ता है,” या “जैसे मूर्ख को सुधारने के लिए बेड़ियाँ लगाई जाती हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ אַחֲרֶיהָ
  choice: उसके पीछे चल पड़ता है
  rationale: यह पदबंध उस स्त्री का अनुसरण करने की क्रिया बताता है। ‘चल पड़ता है’ प्रसंग में आरम्भ हुई तत्काल गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּתְאֹם
  choice: तुरन्त
  rationale: क्रिया की आकस्मिकता और बिना सोचे तत्काल अनुसरण करने का भाव व्यक्त करता है।
- source_word: כְּשׁוֹר
  choice: जैसे बैल
  rationale: שׁוֹר गोवंश या बैल को दर्शाता है; वध की ओर अनजान होकर जाने का चित्र हिन्दी में ‘बैल’ से स्पष्ट रहता है।
- source_word: אֶל טָבַח יָבֹא
  choice: वध के लिए जाता है
  rationale: इब्रानी का शाब्दिक भाव ‘वध की ओर आता/जाता है’ है; हिन्दी में यह गंतव्य और परिणाम दोनों को सहज रूप से व्यक्त करता है।
- source_word: וּכְעֶכֶס
  choice: और जैसे बेड़ी
  rationale: עֶכֶס का अर्थ यहाँ विवादित है। ‘बेड़ी’ बन्धन या रोक के सम्भावित अर्थ को रखती है, पर कठिन पाठ के कारण वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: אֶל מוּסַר אֱוִיל
  choice: मूर्ख को अनुशासन के लिए ले जाती है
  rationale: מוּסָר में सुधारात्मक अनुशासन, ताड़ना या शिक्षा का अर्थ हो सकता है। कठिन वाक्य-संबंध को पठनीय बनाने के लिए ‘ले जाती है’ निहित किया गया है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
