translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। अंतिम पंक्ति की वास्तविक पाठगत और अर्थगत अनिश्चितता को मुख्य पाठ में अत्यधिक बोझिल किए बिना पादटिप्पणी में स्पष्ट किया गया है।
