  text: I have perfumed my bed with myrrh[a], aloes, and cinnamon.
translation:
  language: hi
  text: मैंने अपने बिछौने को गन्धरस, अगर[a] और दालचीनी से सुगन्धित किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात सुगन्धित अगर-काष्ठ; यहाँ उस सामान्य एलोवेरा पौधे की बात नहीं है जिसे आज प्रायः ‘एलो’ कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְתִּי
  choice: सुगन्धित किया है
  rationale: पिएल रूप यहाँ सुगन्धित पदार्थ लगाने और उसके परिणामस्वरूप बिछौने को महकाने का भाव देता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: מִשְׁכָּבִי
  choice: अपने बिछौने को
  rationale: מִשְׁכָּב लेटने की जगह, पलंग या शय्या को सूचित कर सकता है। इस प्रसंग में ‘बिछौना’ सहज, स्पष्ट और मर्यादित आधुनिक हिन्दी है।
- source_word: מֹר
  choice: गन्धरस
  rationale: यह सुगन्धित राल ‘मिर्र’ का पारंपरिक और अर्थपूर्ण हिन्दी नाम है।
- source_word: אֲהָלִים
  choice: अगर
  rationale: यह शब्द सामान्य एलोवेरा नहीं, इत्र में प्रयुक्त सुगन्धित अगर-काष्ठ को सूचित करता है। ‘अगर’ आधुनिक हिन्दी में इस सुगन्धित लकड़ी का संक्षिप्त और सटीक नाम है।
- source_word: וְקִנָּמוֹן
  choice: और दालचीनी
  rationale: קִנָּמוֹן का सीधा अर्थ दालचीनी है; וְ को सूची की अंतिम संयोजक कड़ी के रूप में ‘और’ किया गया है।
