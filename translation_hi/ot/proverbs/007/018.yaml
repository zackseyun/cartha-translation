  text: Come[a], let us drink our fill of love until morning[b]; let us delight ourselves with love.
translation:
  language: hi
  text: आओ, हम भोर तक जी भरकर प्रेम का आनंद लें; हम प्रेम-क्रीड़ा में मग्न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: आओ
  rationale: הלך का यह आज्ञार्थक रूप यहाँ मुहावरेदार आमंत्रण है; स्त्री के लुभावने बुलावे के लिए ‘आओ’ स्वाभाविक है।
- source_word: נִרְוֶה
  choice: हम ... तृप्त हो जाएँ
  rationale: רוה का अर्थ भरपूर पीना या तृप्त होना है। हिन्दी में ‘तृप्त हो जाएँ’ भरपूर कामुक आनंद और मूल रूपक की तीव्रता को सहज ढंग से व्यक्त करता है।
- source_word: דֹדִים
  choice: प्रेम से
  rationale: कामुक संदर्भ में דֹדִים प्रेम, प्रणय या प्रेम-स्पर्शों को सूचित कर सकता है। ‘प्रेम से’ मूल की व्यापकता और संदर्भगत कामुकता दोनों को बनाए रखता है।
- source_word: עַד הַבֹּקֶר
  choice: भोर तक
  rationale: समयवाचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: נִתְעַלְּסָה
  choice: हम ... मग्न हों
  rationale: עלס का हित्पएल रूप आनंद लेने, उल्लसित होने या रस में डूबने का भाव देता है; ‘मग्न हों’ उस गहन पारस्परिक आनंद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּאֳהָבִים
  choice: प्रेम-क्रीड़ा में
  rationale: אהבים का बहुवचन यहाँ स्पष्ट रूप से कामुक प्रेम और उसके आनंद को दर्शाता है। ‘प्रेम-क्रीड़ा’ संदर्भगत अर्थ को स्पष्ट करता है, पर अशिष्ट या अनावश्यक रूप से चिकित्सकीय नहीं बनता।
