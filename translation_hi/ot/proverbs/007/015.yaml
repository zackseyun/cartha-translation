  yaml_path: translation/ot/proverbs/007/015.yaml
  text: Therefore I came out to meet you[a], to seek your face, and I have found you.
translation:
  language: hi
  text: इसीलिए मैं तुझसे मिलने और तुझे ढूँढ़ने के लिए,[a] बाहर आई, और मैंने तुझे पा लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुझे लगन से ढूँढ़ने के लिए” या “तुझे भोर में ढूँढ़ने के लिए”; इब्रानी क्रिया लगन से अथवा सवेरे खोजने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसीलिए
  rationale: यह पद स्त्री के बाहर आने का कारण बताता है। ‘इसीलिए’ आधुनिक हिंदी में स्वाभाविक है और इब्रानी पदबंध का कारणसूचक बल बनाए रखता है।
- source_word: יָצָאתִי
  choice: मैं ... बाहर आई
  rationale: क्रिया का अर्थ ‘बाहर जाना/आना’ है। वक्ता स्त्री है, इसलिए स्त्रीलिंग रूप रखा गया; अगले प्रयोजनवाचक खंड के साथ ‘निकली’ जोड़ने से हिंदी वाक्य स्वाभाविक बनता है।
- source_word: לִקְרָאתֶךָ
  choice: तुझसे मिलने
  rationale: यह पदबंध किसी से मिलने के लिए उसकी ओर निकलने का सामान्य अर्थ देता है।
- source_word: לְשַׁחֵר
  choice: मन लगाकर ढूँढ़ने
  rationale: क्रिया में खोजने के साथ तत्परता, लगन अथवा प्रातःकाल खोजने की छाया हो सकती है। मुख्य पाठ में संदर्भानुकूल लगन का भाव रखा गया है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: פָּנֶיךָ
  choice: तुझे
  rationale: शाब्दिक अर्थ ‘तेरे मुख को’ है, पर यहाँ यह स्वयं व्यक्ति को खोजने का इब्रानी मुहावरा है। हिंदी में ‘तेरा मुख ढूँढ़ना’ इस प्रसंग में अस्वाभाविक और भ्रामक लगेगा, इसलिए स्वाभाविक अर्थ दिया गया है।
- source_word: וָאֶמְצָאֶךָּ
  choice: और अब तू मुझे मिल गया है
  rationale: इब्रानी में शाब्दिक रूप ‘और मैंने तुझे पा लिया’ है। प्रत्यक्ष संबोधन और वर्तमान उपलब्धि के परिणाम को हिंदी में ‘अब तू मुझे मिल गया है’ स्वाभाविक तथा तत्काल बनाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सहज हिंदी। प्रसंग में स्त्री एक युवक को सीधे संबोधित करती है, इसलिए अंतरंग एकवचन ‘तू/तुझसे/तुझे’ और स्त्रीलिंग ‘आई/निकली’ रखा गया है। इब्रानी ‘तेरे मुख को खोजने’ का अर्थ हिंदी में स्वाभाविक रूप से ‘तुझे ढूँढ़ने’ दिया गया है; क्रिया की वास्तविक अर्थ-छाया पाद-टिप्पणी में सुरक्षित है।
