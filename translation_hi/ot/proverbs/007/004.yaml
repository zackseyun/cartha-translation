base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/004.yaml
  text: Say to wisdom[a], “You are my sister,” and call understanding your kinswoman,
translation:
  language: hi
  text: बुद्धि से कह, “तू मेरी बहन है,” और समझ को अपनी सखी[a] कह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी संबंधिनी,” “परिचिता,” अथवा “अंतरंग सखी।” हिब्रू शब्द מוֹדָע संदर्भ के अनुसार निकट परिचित से लेकर संबंधी तक किसी व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר לַחָכְמָה
  choice: बुद्धि से कह
  rationale: אמר का पुल्लिंग एकवचन आज्ञार्थक रूप सीधे संबोधन का निर्देश देता है; ל addressee को चिह्नित करता है। ‘बुद्धि’ नीतिवचन में חָכְמָה का स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: אֲחֹתִי אָתְּ
  choice: “तू मेरी बहन है”
  rationale: शाब्दिक पारिवारिक रूपक और स्त्रीलिंग संबोधन सुरक्षित रखे गए हैं। ‘तू’ यहाँ तिरस्कार नहीं, निकट आत्मीय संबंध व्यक्त करता है और ‘मेरी बहन’ के साथ स्वाभाविक है।
- source_word: לַבִּינָה
  choice: समझ को
  rationale: בִּינָה के लिए ‘समझ’ सरल, वर्तमान हिन्दी है और ‘बुद्धि’ के साथ काव्यात्मक समानांतरता बनाए रखती है।
- source_word: וּמוֹדָע
  choice: अपनी घनिष्ठ परिचिता
  rationale: מוֹדָע किसी निकट से जाने-पहचाने व्यक्ति को सूचित कर सकता है और कुछ संदर्भों में संबंधी भी हो सकता है। स्त्रीलिंग ‘परिचिता’ व्यक्तिकृत ‘समझ’ से मेल खाती है; ‘घनिष्ठ’ संदर्भ की आत्मीयता प्रकट करता है, पर रक्त-संबंध को अनिवार्य नहीं बनाता।
- source_word: תִקְרָא
  choice: कह
  rationale: यहाँ अपूर्ण रूप पहले आज्ञार्थक के समानांतर निर्देशात्मक बल रखता है। हिन्दी में किसी को किसी संबंध-संज्ञा से पुकारने के अर्थ में ‘कह’ सहज है।
theological_decisions:
- issue: बुद्धि और समझ का व्यक्तिकरण
  choice: दोनों को स्त्रीलिंग व्यक्ति के रूप में संबोधित किया गया है
  alternative: अमूर्त गुणों के रूप में निर्वैयक्तिक अनुवाद
  rationale: हिब्रू के स्त्रीलिंग रूप और ‘बहन’ का पारिवारिक रूपक स्पष्ट व्यक्तिकरण रचते हैं; इसे किसी विशिष्ट धर्मवैज्ञानिक सत्ता के रूप में और अधिक परिभाषित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। निकट संबोधन के कारण ‘तू’ चुना गया है। पद के अंत में पूर्णविराम रखा गया है; मुख्य पाठ में पादटिप्पणी-सूचक सम्मिलित है।
