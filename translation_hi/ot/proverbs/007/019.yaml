  text: For the man is not at his house[a]; he has gone on a journey far away.
translation:
  language: hi
  text: क्योंकि वह पुरुष अपने घर में नहीं है[a]; वह दूर की यात्रा पर गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा पति घर पर नहीं है।” इब्रानी में अधिक शाब्दिक रूप से “वह पुरुष अपने घर में नहीं है” कहा गया है; यह उसके पति के लिए प्रयुक्त एक अप्रत्यक्ष अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के प्रसंग में स्त्री के आश्वासन का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: אֵין
  choice: नहीं है
  rationale: स्थानसूचक पदबंध के साथ यह अनुपस्थिति व्यक्त करता है; हिन्दी में ‘अपने घर में नहीं है’ स्वाभाविक है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: इब्रानी में शाब्दिक रूप से ‘वह पुरुष’ है। प्रसंग में आशय स्त्री के पति से है, पर मूल की अप्रत्यक्ष अभिव्यक्ति मुख्य पाठ में सुरक्षित रखी गई है।
- source_word: בְּבֵיתוֹ
  choice: अपने घर में
  rationale: यह निवास-स्थान पर उपस्थिति और तीसरे पुरुष के स्वामित्व दोनों को व्यक्त करता है; कर्ता के संदर्भ में हिन्दी का निजवाचक ‘अपने’ उपयुक्त है।
- source_word: הָלַךְ
  choice: गया है
  rationale: पूर्ण हुई क्रिया का वर्तमान परिणाम—उसका अभी दूर होना—हिन्दी के पूर्ण वर्तमान से स्पष्ट होता है।
- source_word: בְּדֶרֶךְ
  choice: यात्रा पर
  rationale: ‘मार्ग में जाना’ वाला इब्रानी प्रयोग यहाँ यात्रा करने का अर्थ देता है; ‘यात्रा पर’ सहज आधुनिक हिन्दी है।
- source_word: מֵרָחוֹק
  choice: दूर की
  rationale: यह स्थानिक दूरी व्यक्त करता है। ‘दूर की यात्रा’ गंतव्य की दूरी बताती है, न कि अनिवार्य रूप से यात्रा की अवधि या लंबाई।
