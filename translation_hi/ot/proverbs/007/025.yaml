  yaml_path: translation/ot/proverbs/007/025.yaml
  text: Do not let your heart turn aside to her ways; do not wander into her paths.
translation:
  language: hi
  text: तेरा मन उसके मार्गों की ओर न मुड़े; उसकी राहों में मत भटक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבֶּךָ
  choice: तेरा मन
  rationale: हिब्रू में ‘हृदय’ इच्छा, विचार और निर्णय के आंतरिक केंद्र को दर्शाता है; आधुनिक हिन्दी में ‘मन’ इस संदर्भ में अधिक स्वाभाविक और स्पष्ट है।
- source_word: יֵשְׂטְ
  choice: न मुड़े
  rationale: क्रिया मार्ग से हटने या किसी दिशा की ओर झुकने का भाव देती है; ‘न मुड़े’ दिशा-सूचक אֶל के साथ सहज हिन्दी है।
- source_word: דְּרָכֶיהָ
  choice: उसके मार्गों
  rationale: बहुवचन और जीवन-चाल/आचरण के रूपक को बनाए रखता है।
- source_word: תֵּתַע
  choice: मत भटक
  rationale: यह लक्ष्यहीन घूमने अथवा सही राह से बहक जाने का भाव व्यक्त करता है और निषेधात्मक संबोधन को सीधे रखता है।
- source_word: בִּנְתִיבוֹתֶיהָ
  choice: उसकी राहों में
  rationale: בְּ का स्थानगत भाव तथा बहुवचन ‘पथों’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
