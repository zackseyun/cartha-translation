  text: at twilight[a], in the evening of the day, in the black of night and darkness.
translation:
  language: hi
  text: झुटपुटे में, दिन की साँझ में, रात के घोर अँधेरे[a] और कालिमा में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रात की पुतली में”; अर्थात रात के सबसे गहरे अँधेरे में।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶשֶׁף
  choice: झुटपुटे
  rationale: यह शब्द मंद प्रकाश के संक्रमणकाल को दर्शाता है। यहाँ साँझ और रात के साथ आने के कारण इसका आशय दिन ढलने के समय का झुटपुटा है।
- source_word: עֶרֶב יוֹם
  choice: दिन की साँझ
  rationale: दोनों संज्ञाओं को रखते हुए इब्रानी की क्रमिक समय-अभिव्यक्ति सुरक्षित रहती है और हिन्दी स्वाभाविक भी बनी रहती है।
- source_word: אִישׁוֹן לַיְלָה
  choice: रात के घोर अँधेरे
  rationale: शाब्दिक चित्र ‘रात की पुतली’ है, जो रात के सबसे गहरे और काले भाग का मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक चित्र पादटिप्पणी में रखा गया है।
- source_word: וַאֲפֵלָה
  choice: और कालिमा
  rationale: यह अँधेरे या गहन अंधकार को दर्शाता है। ‘कालिमा’ पिछले पदबंध की पुनरुक्ति किए बिना मूल की संचयी अंधकार-छवि बनाए रखती है।
- source_word: בְּ ... בְּ ... בְּ
  choice: में ... में ... में
  rationale: दोहराया गया सम्बन्धबोधक क्रमशः गहराते समय-परिवेश को दिखाता है; हिन्दी में इसकी पुनरावृत्ति मूल की लय और प्रगति को सुरक्षित रखती है।
