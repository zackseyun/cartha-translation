translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘झुटपुटा—साँझ—घोर अँधेरा—कालिमा’ का क्रम मूल पाठ में बढ़ते हुए अंधकार को सुनाई देने योग्य बनाता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘twilight’ के बाद था, पर उसकी सामग्री אִישׁוֹן לַיְלָה से संबंधित है; इसलिए स्रोत के आधार पर चिह्न सही पदबंध के बाद रखा गया है।
