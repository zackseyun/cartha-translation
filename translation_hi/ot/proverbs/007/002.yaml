  text: שְׁמֹ֣ר מִצְוֺתַ֣/י וֶ/חְיֵ֑ה וְ֝/תוֹרָתִ֗/י כְּ/אִישׁ֥וֹן עֵינֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/002.yaml
  text: Keep my commandments and live[a], and my instruction as the pupil of your eye.
translation:
  language: hi
  text: मेरी आज्ञाओं को मान और जीवित रह[a]; मेरी शिक्षा को अपनी आँख की पुतली के समान सुरक्षित रख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि तू जीवित रहे।” इब्रानी में इसका रूप संक्षिप्त है और इसे आज्ञा अथवा आज्ञाओं को मानने के परिणाम—दोनों अर्थों में समझा जा सकता है।
    reason: व्याकरणिक_वैकल्पिक_अर्थ
lexical_decisions:
- source_word: שְׁמֹר
  choice: मान / सुरक्षित रख
  rationale: शׁמר का अर्थ मानना, पालन करना और सावधानी से सुरक्षित रखना हो सकता है। हिंदी में आज्ञाओं के साथ ‘मान’ स्वाभाविक है; दूसरे खंड में निहित क्रिया को ‘सुरक्षित रख’ के रूप में पूरा करने से आँख की पुतली वाले बिंब का रक्षणार्थ स्पष्ट रहता है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: מִצְוָה का बहुवचन और प्रथम पुरुष प्रत्यय सीधे तथा स्वाभाविक रूप से व्यक्त होता है।
- source_word: וֶחְיֵה
  choice: और जीवित रह
  rationale: इब्रानी की संक्षिप्त आज्ञार्थक समन्वय-रचना को बनाए रखता है और फलसूचक अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וְתוֹרָתִי
  choice: मेरी शिक्षा
  rationale: नीतिवचन में תּוֹרָה यहाँ वक्ता की बुद्धिमत्तापूर्ण शिक्षा है; ‘शिक्षा’ इसका व्यापक अर्थ रखती है और इसे केवल विधिक ‘व्यवस्था’ तक सीमित नहीं करती।
- source_word: כְּאִישׁוֹן עֵינֶיךָ
  choice: अपनी आँख की पुतली के समान
  rationale: इब्रानी मुहावरे के वास्तविक बिंब—आँख की पुतली—को पारदर्शी, आधुनिक हिंदी में व्यक्त करता है और अत्यंत सावधानी से रक्षा करने का आशय बनाए रखता है।
theological_decisions:
- issue: नीतिवचन के प्रसंग में תּוֹרָה का अनुवाद
  choice: शिक्षा
  alternative: व्यवस्था / उपदेश
  rationale: यहाँ पिता अथवा ज्ञान-शिक्षक की शिक्षा अभिप्रेत है, विशेष रूप से मूसा की व्यवस्था नहीं; ‘शिक्षा’ अर्थ की व्यापकता और प्रसंग दोनों को सुरक्षित रखती है।
- issue: וֶחְיֵה में आज्ञा और परिणाम का संबंध
  choice: और जीवित रह
  alternative: ताकि तू जीवित रहे
  rationale: इब्रानी में दोनों क्रियाएँ आज्ञार्थक ढंग से साथ रखी गई हैं। चुना हुआ अनुवाद इस तनाव को बनाए रखता है और परिणामसूचक संबंध को व्याख्या द्वारा निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का आत्मीय एकवचन ‘तू’ निहित क्रियारूपों (‘मान’, ‘रह’, ‘रख’) में रखा गया है, जो पिता द्वारा पुत्र को संबोधन के प्रसंग के अनुकूल है। भाषा सरल और गरिमापूर्ण है; ‘आँख की पुतली’ बिंब को सीधे बनाए रखा गया है।
