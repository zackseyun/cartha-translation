  text: בְּ֭נִ/י שְׁמֹ֣ר אֲמָרָ֑/י וּ֝/מִצְוֺתַ֗/י תִּצְפֹּ֥ן אִתָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/007/001.yaml
  text: My son[a], keep my words, and treasure up my commandments with you.
translation:
  language: hi
  text: 'मेरे बेटे, मेरी बातें मान,

    और मेरी आज्ञाओं को अपने पास सँजोकर रख[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुरक्षित रख।” इब्रानी क्रिया किसी वस्तु को सावधानी से जमा करने या सुरक्षा के लिए छिपाकर रखने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: यह एकवचन पुल्लिंग में पिता-सदृश सीधा संबोधन है। ‘मेरे बेटे’ आधुनिक हिन्दी में स्वाभाविक है और मूल रूप को ठीक-ठीक बनाए रखता है।
- source_word: שְׁמֹר
  choice: मान
  rationale: इस प्रसंग में क्रिया का अर्थ केवल शब्दों को याद रखना नहीं, बल्कि उन्हें ध्यान से ग्रहण करके उनके अनुसार चलना भी है। ‘मान’ हिन्दी में इस आज्ञापालन के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲמָרָי
  choice: मेरी बातें
  rationale: यह वक्ता की दी हुई मौखिक शिक्षा को दर्शाता है। ‘मेरी बातें’ साधारण आधुनिक हिन्दी में सहज है और ‘मेरे वचन’ की अपेक्षा कम कृत्रिम सुनाई देता है।
- source_word: וּמִצְוֺתַי
  choice: और मेरी आज्ञाओं को
  rationale: מִצְוָה निर्देश के साथ उसके नैतिक अधिकार और बाध्यता को व्यक्त करता है; ‘आज्ञाएँ’ इस भार को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: תִּצְפֹּן
  choice: सँजोकर रख
  rationale: צפן किसी वस्तु को सुरक्षा के लिए छिपाकर या सावधानी से जमा करके रखने का भाव देता है। ‘सँजोकर रख’ मूल्यवान समझकर सुरक्षित रखने और अंतःकरण में धारण करने—दोनों अर्थ-संकेतों को बिना अत्यधिक व्याख्या के व्यक्त करता है।
- source_word: אִתָּךְ
  choice: अपने पास
  rationale: मूल अभिव्यक्ति का सीधा अर्थ ‘अपने साथ/पास’ है। ‘अपने पास’ आज्ञाओं को निकट और सुरक्षित रखने का भाव देता है, जबकि ‘अपने भीतर’ मूल से अधिक व्याख्यात्मक होता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और पिता द्वारा बेटे को दी जाने वाली ज्ञान-शिक्षा के अनुरूप आत्मीय किंतु गरिमापूर्ण रखी गई है। समानांतर पंक्तियों में ‘मान’ और ‘सँजोकर रख’ मूल के आज्ञापालन तथा सावधानी से सुरक्षित रखने के पूरक भावों को बनाए रखते हैं।
