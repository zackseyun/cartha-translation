  choice: बुद्धिमानों के होंठ
  rationale: मूल के ठोस अंग-चित्र और संबंधवाचक रचना को बनाए रखता है; इसे केवल ‘वचन’ या ‘बातें’ कहकर भावानुवाद नहीं किया गया।
- source_word: יְזָרוּ
  choice: फैलाते हैं
  rationale: זרה का मूल बिंब बिखेरने या छितराने का है। ज्ञान के साथ ‘फैलाते हैं’ स्वाभाविक आधुनिक हिन्दी है और प्रसार का बिंब भी बनाए रखता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: नीतिवचन-साहित्य में इस शब्द का सीधा और प्रचलित हिन्दी समतुल्य ‘ज्ञान’ है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में ‘हृदय’ विचार, स्वभाव और भीतरी व्यक्ति को भी सूचित करता है। मुख्य पाठ में मूल का प्रमुख ज्ञान-साहित्यिक बिंब सुरक्षित रखा गया है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: यह शब्द केवल कम बुद्धि नहीं, बल्कि नैतिक और व्यावहारिक हठमूर्खता का भी संकेत देता है; ‘मूर्ख’ हिन्दी के नीतिवचन-संदर्भ में उपयुक्त और संक्षिप्त है।
- source_word: לֹא כֵן
  choice: वैसा नहीं होता
  rationale: मूल का कथन अत्यंत संक्षिप्त और लुप्तपदीय है—शाब्दिक रूप से ‘पर मूर्खों का हृदय, ऐसा नहीं।’ यह रूप उस संक्षिप्त विरोध को बनाए रखता है और अनकहे आशय को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: मूर्खों के हृदय के बारे में लुप्तपदीय कथन
  choice: वैसा नहीं होता
  alternative: ज्ञान नहीं फैलाता
  rationale: वैकल्पिक रूप संदर्भगत आशय स्पष्ट करता है, पर मूल में अनुपस्थित क्रिया को जोड़कर सम्भावित अर्थ को निश्चित कर देता है। चुना हुआ रूप मूल की अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘होंठ’ और ‘हृदय’ जैसे मूल बिंब सुरक्षित हैं, जबकि ‘फैलाते हैं’ सामान्य पाठक के लिए स्वाभाविक है।
