  text: The lips of the wise spread knowledge[b][a], but the heart of fools is not so.
translation:
  language: hi
  text: बुद्धिमानों के होंठ ज्ञान फैलाते हैं[a], पर मूर्खों का हृदय ऐसा नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ज्ञान बिखेरते हैं।’ इब्रानी क्रिया में बिखेरने या चारों ओर छितराने का बिंब है; स्वाभाविक हिन्दी के लिए मुख्य पाठ में ‘फैलाते हैं’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्य अपूर्ण है; शाब्दिक रूप से, ‘पर मूर्खों का हृदय, ऐसा नहीं।’ आशय यह है कि मूर्ख बुद्धिमानों की तरह ज्ञान नहीं फैलाते।
    reason: lexical_alternative
