  text: A wise son brings joy to his father[a], but a foolish man despises his mother.
translation:
  language: hi
  text: बुद्धिमान बेटा अपने पिता को प्रसन्न करता है, पर मूर्ख मनुष्य अपनी माँ को तुच्छ समझता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּן
  choice: बेटा
  rationale: एकवचन पुल्लिंग संज्ञा को उसके पारिवारिक और समानांतर संदर्भ के अनुसार लिंग-सटीक रूप में रखा गया है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: नीतिवचन के संदर्भ में यह व्यावहारिक और नैतिक बुद्धि को व्यक्त करता है; ‘बुद्धिमान’ स्वाभाविक और स्पष्ट है।
- source_word: יְשַׂמַּח
  choice: आनन्दित करता है
  rationale: पिएल रूप का कारणवाचक भाव ‘प्रसन्न करता है’ है; यह चयन अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אָב
  choice: अपने पिता
  rationale: ‘बेटा’ के साथ संबंध स्पष्ट करने के लिए हिन्दी में स्वाभाविक निजवाचक ‘अपने’ प्रयुक्त है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: यह नैतिक रूप से विवेकहीन और हठी व्यक्ति का वर्णन करता है; ‘मूर्ख’ संक्षिप्त और सशक्त है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द किसी एक व्यक्ति को सूचित करता है; ‘मनुष्य’ मूल के सामान्य मानव-संज्ञात्मक रूप को बनाए रखता है और हिन्दी में सहज है।
- source_word: בּוֹזֶה
  choice: तुच्छ समझता है
  rationale: कृदन्त यहाँ स्वभावगत आचरण बताता है—किसी को हेय मानना; यह हिन्दी में ‘घृणा करता है’ की अपेक्षा मूल के अवमानना-भाव को अधिक ठीक व्यक्त करता है।
- source_word: אִמּוֹ
  choice: अपनी माँ
  rationale: इब्रानी प्रत्यय में अधिकार-संबंध स्पष्ट है; हिन्दी में कर्ता के अनुरूप ‘अपनी’ स्वाभाविक है।
