review_pass:
  verdict: revise
  source_fidelity: The first clause accurately preserves the comprehensive ‘all the days’ and the broad adverse sense of רָעִים. However, ‘दीन जन’ can suggest pious humility or social deference in modern Hindi, whereas עָנִי here broadly denotes someone poor, afflicted, or oppressed. ‘भोज ही भोज’ adds an emphatic/repetitive nuance not explicit in the singular Hebrew ‘a continual feast.’
  naturalness: The draft is generally idiomatic and proverbial. ‘पीड़ित’ is clearer and more contemporary than ‘दीन जन’ for the intended sense. ‘प्रसन्न हृदय वाले के लिए सदा भोज है’ is natural Hindi and clearly expresses the Hebrew contrast without the extra emphasis of ‘भोज ही भोज.’
  terminology: ‘पीड़ित’ appropriately retains the non-exclusive sense of עָנִי, while the footnote preserves poverty and oppression as valid alternatives. ‘प्रसन्न हृदय’ suitably conveys טוֹב לֵב as an inward cheerful/well-disposed state; ‘भोज’ and ‘सदा’ faithfully represent מִשְׁתֶּה and תָמִיד.
  issues:
  - severity: medium
    issue: ‘दीन जन’ is potentially misleading for עָנִי.
    rationale: In modern Hindi, ‘दीन’ can carry connotations of meekness, helplessness, or religious humility. The Hebrew term permits poverty, affliction, and oppression; ‘पीड़ित’ better represents the draft’s intended broad, non-economic reading.
  - severity: low
    issue: ‘भोज ही भोज’ heightens the source expression.
    rationale: The Hebrew says literally ‘a continual feast.’ The repetition ‘ही भोज’ makes the image more emphatic than the source. ‘सदा भोज’ retains the continual-feast metaphor without added intensification.
