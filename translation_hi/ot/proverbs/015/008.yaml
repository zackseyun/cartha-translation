source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֲבַ֣ת יְהוָ֑ה וּ/תְפִלַּ֖ת יְשָׁרִ֣ים רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/008.yaml
  text: The sacrifice of the wicked is an abomination to Yahweh[a], but the prayer of the upright is his delight.
translation:
  language: hi
  text: 'दुष्टों का बलिदान याहवे को घृणास्पद है,

    पर सज्जनों की प्रार्थना उसे प्रिय है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी प्रसन्नता’ अथवा ‘उसे स्वीकार्य है।’ इब्रानी संज्ञा प्रसन्नता, अनुकूलता या स्वीकार्यता का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह बलि के रूप में चढ़ाई गई भेंट को सूचित करता है; नीतिवचन में ‘बलिदान’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह नैतिक रूप से दोषी लोगों के वर्ग को सूचित करने वाला बहुवचन विशेषण है; ‘दुष्टों’ से नीतिवचन की संक्षिप्तता बनी रहती है।
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह परमेश्वर को अत्यन्त अप्रिय और वीभत्स लगने वाली वस्तु के लिए प्रबल नैतिक शब्द है; ‘घृणित’ इसका बल बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: תְפִלַּת
  choice: प्रार्थना
  rationale: एकवचन यहाँ नीतिवचन की शैली में प्रतिनिधिक अर्थ रखता है और हिन्दी में सहज है।
- source_word: יְשָׁרִים
  choice: खरे लोगों
  rationale: शब्द नैतिक रूप से सीधे और सत्यनिष्ठ लोगों को दर्शाता है; ‘खरे’ इस नैतिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רְצוֹנוֹ
  choice: उसे प्रिय है
  rationale: संज्ञा प्रसन्नता, अनुग्रह या स्वीकार्यता का अर्थ दे सकती है। ‘उसे प्रिय है’ पहले चरण के ‘घृणित’ के साथ स्पष्ट विरोध बनाता है, जबकि टिप्पणी में अन्य अर्थ सुरक्षित रखे गए हैं।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: दूसरे चरण में רְצוֹנוֹ का अर्थ
  choice: उसे प्रिय है
  alternative: उसे स्वीकार्य है / उस पर उसका अनुग्रह है
  rationale: इब्रानी संज्ञा में प्रसन्नता, अनुग्रह और स्वीकार्यता के अर्थ जुड़े हैं। मुख्य पाठ का चयन विरोधी समानांतरता को स्वाभाविक हिन्दी में रखता है; पादटिप्पणी वास्तविक अर्थ-विस्तार बताती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमा के अनुरूप रखी गई है। दोनों चरणों की समानांतर संरचना सुरक्षित है; ‘खरे लोगों’ से नैतिक सीधेपन का सहज हिन्दी बोध मिलता है।
