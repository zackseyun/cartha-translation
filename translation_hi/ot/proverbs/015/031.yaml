source:
  edition: WLC
  text: אֹ֗זֶן שֹׁ֭מַעַת תּוֹכַ֣חַת חַיִּ֑ים בְּ/קֶ֖רֶב חֲכָמִ֣ים תָּלִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/031.yaml
  text: An ear that listens to life-giving rebuke will remain among the wise[a][b].
translation:
  language: hi
  text: जो कान जीवन देनेवाली डाँट सुनता है, वह बुद्धिमानों के बीच बना रहेगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कान जीवन की डाँट सुनता है, वह बुद्धिमानों के बीच ठहरेगा।” इब्रानी क्रिया का शाब्दिक अर्थ “रात बिताना” या “ठहरना” है; यहाँ यह बुद्धिमानों के बीच बने रहने या निवास करने के अर्थ में रूपक के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “जीवन देनेवाली डाँट” के इब्रानी पदबंध का अनुवाद “जीवन की डाँट” या “जीवन के लिए डाँट” भी किया जा सकता है—अर्थात ऐसी डाँट जो जीवन की ओर ले जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹזֶן
  choice: कान
  rationale: इब्रानी रूपक को बनाए रखा गया है, जिसमें ‘कान’ ग्रहणशील व्यक्ति का प्रतिनिधित्व करता है; हिन्दी में भी यह प्रयोग सहज रूप से समझा जा सकता है।
- source_word: שֹׁמַעַת
  choice: सुनता है
  rationale: यह कृदन्त निरन्तर ग्रहणशीलता और ध्यान देकर सुनने का भाव रखता है; सन्दर्भ में साधारण श्रवण से अधिक, डाँट स्वीकार करना निहित है।
- source_word: תּוֹכַחַת
  choice: डाँट
  rationale: नीतिवचन के नैतिक सुधार वाले सन्दर्भ में यह वर्तमान हिन्दी का स्वाभाविक और स्पष्ट शब्द है; ‘ताड़ना’ अधिक पुरातन और ‘सुधार’ कुछ नरम है।
- source_word: חַיִּים
  choice: जीवन देनेवाली
  rationale: תּוֹכַחַת חַיִּים उस डाँट को सूचित कर सकता है जो जीवन की ओर ले जाती या जीवन बचाती है। मुख्य पाठ में इस सम्भावित अर्थ को सहज हिन्दी में व्यक्त किया गया है, जबकि पदबंध की अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: בְּקֶרֶב
  choice: के बीच
  rationale: यह किसी समूह के मध्य स्थान या सहभागिता को व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; यह अनावश्यक लिंग-विशेष के बिना उस श्रेणी को व्यक्त करता है।
- source_word: תָּלִין
  choice: बना रहेगा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘रात बिताना/ठहरना’ है, पर यहाँ यह बुद्धिमानों के बीच स्थायी संगति या स्थान का रूपक है। ‘बना रहेगा’ आधुनिक हिन्दी में उसका प्रसंगगत अर्थ स्पष्ट करता है।
theological_decisions:
- issue: תּוֹכַחַת חַיִּים में सम्बन्ध का प्रकार
  choice: जीवन देनेवाली डाँट
  alternative: जीवन की डाँट / जीवन के लिए डाँट
  rationale: इब्रानी समास यह खुला छोड़ता है कि डाँट जीवन से सम्बद्ध है, जीवन के लिए है, या जीवन की ओर ले जाती है। मुख्य पाठ में सम्भावित फल को पठनीय ढंग से रखा गया है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। ‘कान’ का मूल रूपक सुरक्षित है; ‘डाँट’ सामान्य पाठक के लिए ‘ताड़ना’ या ‘भर्त्सना’ से अधिक स्वाभाविक है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
