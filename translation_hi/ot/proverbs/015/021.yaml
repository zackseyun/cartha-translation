base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/021.yaml
  text: Folly is joy to one lacking sense[a], but a man of understanding makes his path straight.
translation:
  language: hi
  text: मूर्खता विवेकहीन[a] मनुष्य के लिए आनंद है, परंतु समझदार मनुष्य अपना मार्ग सीधा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘हृदय की कमी वाला’; इब्रानी मुहावरे में ‘हृदय’ समझ या विवेक का सूचक है।'
    reason: इब्रानी मुहावरे का शाब्दिक रूप और उसका प्रसंगानुकूल अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह भाववाचक संज्ञा बुद्धि और सही निर्णय के विपरीत मूर्खतापूर्ण प्रवृत्ति या आचरण को व्यक्त करती है।
- source_word: שִׂמְחָה
  choice: आनन्द है
  rationale: इब्रानी के संक्षिप्त विधेय-संज्ञा विन्यास को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַחֲסַר לֵב
  choice: निर्बुद्धि मनुष्य के लिए
  rationale: शाब्दिक अर्थ ‘हृदय की कमी वाला’ है; नीतिवचन में यह भावनाहीनता नहीं, बल्कि समझ और विवेक की कमी का मुहावरा है।
- source_word: אִישׁ תְּבוּנָה
  choice: समझदार मनुष्य
  rationale: स्रोत के प्रतिनिधिक पुल्लिंग एकवचन को रखते हुए תְּבוּנָה का स्वाभाविक हिन्दी अर्थ ‘समझ’ व्यक्त करता है।
- source_word: יְיַשֶׁר לָכֶת
  choice: सीधी राह चलता है
  rationale: वाक्यांश का आशय अपने चलने या जीवन-आचरण को सीधा रखना है। हिन्दी में ‘सीधी राह चलता है’ मार्ग-रूपक और नैतिक आशय दोनों को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: निर्बुद्धि मनुष्य ... समझदार मनुष्य
  alternative: निर्बुद्धि व्यक्ति ... समझदार व्यक्ति
  rationale: इब्रानी में दोनों पक्ष प्रतिनिधिक पुल्लिंग एकवचन में हैं; हिन्दी में ‘मनुष्य’ स्रोत-रूप को बनाए रखते हुए सामान्य मानवीय प्रयोग भी देता है।
- issue: יְיַשֶׁר की कारक बनाम आचरणगत अभिव्यक्ति
  choice: सीधी राह चलता है
  alternative: अपनी राह सीधी करता है
  rationale: पिएल रूप का शाब्दिक कारक अर्थ ‘सीधा करता है’ हो सकता है, पर לָכֶת (‘चलना’) के साथ वाक्यांश व्यक्ति के सीधे आचरण को भी दर्शाता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, बिना नैतिक मार्ग-रूपक को खोए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली। ‘आनन्द’ और ‘राह’ सामान्य पाठक के लिए सहज हैं; ‘निर्बुद्धि’ पद स्रोत के ज्ञान-साहित्य संबंधी विरोध को संक्षेप में व्यक्त करता है।
