base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/024.yaml
  text: The path of life leads upward for the prudent, so that he may turn away from Sheol below.
translation:
  language: hi
  text: समझदार के लिए जीवन का मार्ग ऊपर की ओर जाता है, ताकि वह नीचे स्थित अधोलोक से हट जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרַח חַיִּים
  choice: जीवन का मार्ग
  rationale: यह इब्रानी पदबंध का स्वाभाविक और निकट अर्थ है; नीतिवचन में ‘मार्ग’ जीवन की दिशा और आचरण दोनों को व्यक्त करता है।
- source_word: לְמַשְׂכִּיל
  choice: समझदार के लिए
  rationale: מַשְׂכִּיל विवेक और सूझ-बूझ से काम लेने वाले व्यक्ति को दर्शाता है; ‘समझदार’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: שְׁאוֹל मृतकों के नीचे स्थित लोक को सूचित करता है। ‘अधोलोक’ इस प्राचीन धारणा को ‘नरक’ कहकर दंडस्थान के अर्थ में सीमित नहीं करता।
- source_word: סוּר
  choice: दूर रहे
  rationale: क्रिया का अर्थ मुड़ना, हटना या बचना है। यहाँ मार्ग के परिणाम/उद्देश्य के रूप में ‘दूर रहे’ स्वाभाविक हिंदी देता है और मूल भाव बनाए रखता है।
theological_decisions:
- issue: לְמַעַן का उद्देश्य अथवा परिणाम
  choice: ताकि
  alternative: जिससे
  rationale: לְמַעַן सामान्यतः उद्देश्य व्यक्त करता है, पर परिणाम की छाया भी हो सकती है। ‘ताकि’ मूल की उद्देश्यपरक संरचना को सुरक्षित रखता है, बिना मुक्ति की प्रक्रिया को अतिरिक्त रूप से परिभाषित किए।
- issue: שְׁאוֹל की पहचान
  choice: अधोलोक
  alternative: मृतकों का लोक / कब्र
  rationale: इसे ‘नरक’ कहना बाद की दंड-संबंधी धारणा को अनावश्यक रूप से आयात कर सकता है, जबकि ‘कब्र’ इब्रानी शब्द की सामूहिक/स्थानिक कल्पना को संकुचित कर देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘ऊपर’ और ‘नीचे’ का मूल स्थानिक विरोध स्पष्ट रूप से सुरक्षित है।
