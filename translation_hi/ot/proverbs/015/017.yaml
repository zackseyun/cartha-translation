  text: Better is a meal of vegetables where there is love than a fattened ox with hatred[a][b].
translation:
  language: hi
  text: जहाँ प्रेम है वहाँ साग-सब्ज़ी का भोजन, उस मोटे किए हुए बैल[b] से अच्छा है जहाँ बैर[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘और उसमें बैर’ है; ‘उसमें’ संभवतः भोजन, दावत या घर के उस पूरे वातावरण की ओर संकेत करता है जिस पर बैर छाया हो।
    reason: lexical_alternative
  - marker: b
    text: या ‘नाँद पर पाला हुआ बैल’; इब्रानी अभिव्यक्ति नाँद पर खिलाए जाने या उससे मोटा किए जाने—दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: מִן के साथ यह तुलनात्मक कहावत है; हिंदी में ‘से अच्छा है’ स्वाभाविक रूप से ‘बेहतर’ का अर्थ व्यक्त करता है।
- source_word: אֲרֻחַת יָרָק
  choice: साग-सब्ज़ी का भोजन
  rationale: אֲרֻחַת पूरे भोजन या खाद्य-भाग को और יָרָק खाने योग्य हरी वनस्पति को दर्शाता है; यह चयन साधारण, अल्प-संपन्न भोजन का चित्र स्पष्ट रखता है।
- source_word: וְאַהֲבָה שָׁם
  choice: प्रेम के साथ
  rationale: शाब्दिक अर्थ ‘और वहाँ प्रेम’ है। हिंदी में यह संक्षिप्त रूप भोजन के घरेलू परिवेश में प्रेम की उपस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שׁוֹר אָבוּס
  choice: मोटा किया हुआ बैल
  rationale: שׁוֹר ‘बैल’ है और אָבוּס खूँटे/नाँद पर खिलाकर मोटा किए गए पशु की ओर संकेत करता है; मुख्य पाठ में परिणामस्वरूप मोटी दशा रखी गई है और वैकल्पिक बिंब पादटिप्पणी में दिया गया है।
- source_word: וְשִׂנְאָה בוֹ
  choice: बैर के साथ
  rationale: इब्रानी में शाब्दिक रूप से ‘और उसमें बैर’ है। ‘बैर के साथ’ हिंदी में सहज है और दावत या घर के वातावरण में व्याप्त शत्रुता का भाव बनाए रखता है।
