  yaml_path: translation/ot/proverbs/015/023.yaml
  text: A man has joy in the answer of his mouth[b][a], and a word in its time—how good it is!
translation:
  language: hi
  text: मनुष्य को अपने मुँह से दिए उत्तर में आनन्द मिलता है,[a] और उचित समय पर कही गई बात—वह कितनी अच्छी होती है![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के लिए उसके मुँह के उत्तर में आनन्द होता है।” इब्रानी रचना का यह अधिक शाब्दिक रूप है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने समय में कही गई बात।” इसका अर्थ “सही समय पर कही गई बात” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह संज्ञा हर्ष या आनन्द को दर्शाती है। ‘आनन्द’ आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और इस सूक्ति के भाव के अनुकूल है।
- source_word: לָאִישׁ
  choice: मनुष्य को ... मिलता है
  rationale: אִישׁ यहाँ एक प्रतिनिधि व्यक्ति को सूचित करता है और ל लाभ अथवा प्राप्ति का भाव देता है। हिन्दी में यह रचना मूल के अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: בְּמַעֲנֵה פִיו
  choice: अपने मुँह से दिए उत्तर में
  rationale: מַעֲנֶה का अर्थ ‘उत्तर’ है और פִיו का शाब्दिक अर्थ ‘उसका मुँह’ है। हिन्दी वाक्यांश बोलकर दिए गए उत्तर पर बल रखते हुए देह-अंग वाली इब्रानी अभिव्यक्ति को भी सुरक्षित रखता है।
- source_word: וְדָבָר
  choice: और ... कही गई बात
  rationale: דָבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। समानांतर पंक्ति में यह बोली गई बात को सूचित करता है; ‘कही गई बात’ हिन्दी में अर्थ स्पष्ट करती है।
- source_word: בְּעִתּוֹ
  choice: उचित समय पर
  rationale: शाब्दिक अर्थ ‘उसके समय में’ है, पर प्रसंग समयानुकूलता का भाव देता है। ‘उचित समय पर’ आधुनिक हिन्दी में यही आशय स्वाभाविक रूप से प्रकट करता है।
- source_word: מַה־טּוֹב
  choice: वह कितनी अच्छी होती है!
  rationale: यह समयानुकूल बात की अच्छाई की प्रशंसात्मक विस्मय-वाचक अभिव्यक्ति है। चुना हुआ रूप इब्रानी के भाव और बल को स्वाभाविक हिन्दी में रखता है।
