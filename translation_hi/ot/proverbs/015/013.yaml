  yaml_path: translation/ot/proverbs/015/013.yaml
  text: A joyful heart makes the face cheerful[b][a], but by the sorrow of the heart the spirit is crushed.
translation:
  language: hi
  text: प्रसन्न मन चेहरे को खिला देता है[a], पर मन के दुःख से आत्मा कुचल जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चेहरे को उजला करता है।’ इब्रानी में शाब्दिक अर्थ है, ‘चेहरे को अच्छा बनाता है’; यह चेहरे की बाहरी अभिव्यक्ति के निखरने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘आत्मा टूट जाती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב שָׂמֵחַ
  choice: आनन्दित मन
  rationale: לֵב यहाँ मनुष्य के भीतरी भाव-जगत को दर्शाता है। आधुनिक हिन्दी में भावात्मक अवस्था के लिए ‘मन’ स्वाभाविक है, और ‘आनन्दित’ שָׂמֵחַ की प्रसन्न अवस्था को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יֵיטִב פָּנִים
  choice: चेहरे को प्रसन्न करता है
  rationale: हिफ़ील יֵיטִב का अर्थ ‘अच्छा बनाना/सुधारना’ है; פָּנִים के साथ यह भीतरी आनन्द से चेहरे की अभिव्यक्ति खिल उठने का मुहावरेदार भाव देता है।
- source_word: וּבְעַצְּבַת לֵב
  choice: पर मन के दुःख से
  rationale: वाव यहाँ विरोधात्मक समानांतरता के कारण ‘पर’ है। בְּ को प्रसंगानुसार कारणसूचक ‘से’ और עַצְּבַת को ‘दुःख’ किया गया है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ רוּחַ शाब्दिक हवा या साँस नहीं, बल्कि व्यक्ति की भीतरी जीवन-शक्ति और दशा को सूचित करता है; ‘आत्मा’ इस गहराई को संक्षेप में बनाए रखता है।
- source_word: נְכֵאָה
  choice: टूट जाती है
  rationale: यह विशेषण कुचली, आहत या टूटी हुई भीतरी दशा दर्शाता है। हिन्दी में ‘आत्मा टूट जाती है’ स्वाभाविक और प्रभावशाली अभिव्यक्ति है।
