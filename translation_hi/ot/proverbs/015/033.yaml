  text: The fear of Yahweh is instruction in wisdom[a], and humility comes before honor.
translation:
  language: hi
  text: याहवे का भय बुद्धि की शिक्षा है[a], और सम्मान से पहले नम्रता आती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का भय बुद्धि का अनुशासन है।” ‘शिक्षा’ के लिए प्रयुक्त इब्रानी शब्द में सुधारात्मक अनुशासन का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय
  rationale: निर्मित पदबंध याहवे की ओर निर्देशित श्रद्धा और विस्मय से भरे भय को व्यक्त करता है। ‘भय’ को केवल ‘श्रद्धा’ बनाकर उसका व्यापक अर्थ कम नहीं किया गया।
- source_word: מוּסַר
  choice: शिक्षा
  rationale: नीतिवचन में यह शब्द शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन—इन अर्थों को समेट सकता है। मुख्य पाठ में सहज ‘शिक्षा’ रखा गया है और अनुशासन का भाव पादटिप्पणी में सुरक्षित है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन के ज्ञान-साहित्य में यह स्वाभाविक और प्रचलित हिन्दी समतुल्य है।
- source_word: וְלִפְנֵי
  choice: और ... से पहले
  rationale: यहाँ पदबंध समय अथवा तर्क की दृष्टि से पूर्वता दिखाता है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: इस ज्ञान-साहित्यिक संदर्भ में सामाजिक प्रतिष्ठा और आदर का भाव है; ‘महिमा’ की अपेक्षा ‘सम्मान’ अधिक स्वाभाविक है।
- source_word: עֲנָוָה
  choice: नम्रता आती है
  rationale: मूल इब्रानी में दूसरा खंड क्रियारहित है। हिन्दी में क्रम स्पष्ट और सहज करने के लिए ‘आती है’ जोड़ा गया है, बिना अर्थ को अनावश्यक रूप से विस्तृत किए।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। उसका व्यक्तिवाचक स्वरूप बनाए रखने के लिए ‘याहवे’ रखा गया है, न कि उसे उपाधि ‘प्रभु’ से बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और कहावत-जैसी लय रखी गई है। ‘याहवे’, ‘बुद्धि’, ‘शिक्षा’, ‘सम्मान’ और ‘नम्रता’ सामान्य पाठक के लिए स्पष्ट हैं; मूल की संक्षिप्त समानांतर संरचना भी बनी रहती है।
