    text: या ‘विनाश।’ ‘अबद्दोन’ विनाश अथवा विनाश के लोक या स्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह शब्द मृतकों के लोक को दर्शाता है। प्रचलित और सुबोध हिन्दी पद ‘अधोलोक’ हिब्रू अवधारणा को केवल ‘कब्र’ तक सीमित नहीं करता।
- source_word: אֲבַדּוֹן
  choice: अबद्दोन
  rationale: अधोलोक के साथ युग्मित, स्थान-सदृश नाम का बल बनाए रखने के लिए लिप्यंतरण किया गया; अर्थ-विकल्प ‘विनाश’ पादटिप्पणी में दिया गया है।
- source_word: נֶגֶד
  choice: के सामने खुले पड़े हैं
  rationale: मूलतः ‘के सामने’ है, पर प्रसंग में यहोवा की दृष्टि से पूर्णतः प्रकट होने का भाव है; हिन्दी मुहावरा इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप द्वारा मूल पाठ में आए परमेश्वर के विशिष्ट नाम को पदवी से नहीं बदला गया।
- source_word: אַף כִּי
  choice: तो ... उससे कहीं अधिक
  rationale: 'यह छोटा-से-बड़े की ओर तर्क को व्यक्त करता है: यदि छिपे हुए मृतलोक भी खुले हैं, तो मनुष्यों के हृदय और भी अधिक।'
- source_word: לִבּוֹת
  choice: हृदय
  rationale: हिब्रू रूपक को बनाए रखते हुए मनुष्य के विचार, इच्छा और अभिप्राय सहित भीतरी व्यक्तित्व का संकेत देता है।
- source_word: בְּנֵי אָדָם
  choice: मनुष्यों
  rationale: शाब्दिक अर्थ ‘मनुष्य के पुत्र’ है, पर यहाँ यह समस्त मानव जाति के लिए सामान्य हिब्रू मुहावरा है; ‘मनुष्यों’ आधुनिक हिन्दी में उसका अर्थ स्वाभाविक रूप से देता है।
