  text: Sheol and Abaddon lie open before Yahweh[b][a]; how much more the hearts of the sons of man.
translation:
  language: hi
  text: 'अधोलोक और अबद्दोन[a] याहवे के सामने खुले पड़े हैं;

    तो मनुष्यों के हृदय उससे भी कहीं अधिक उसके सामने खुले हैं।'
  philosophy: optimal-equivalence
  footnotes:
