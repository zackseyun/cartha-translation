  yaml_path: translation/ot/proverbs/015/019.yaml
  text: The way of the lazy is like a hedge of thorns[a], but the path of the upright is a raised highway.
translation:
  language: hi
  text: 'आलसी का मार्ग काँटों की बाड़ के समान है,

    पर सीधे लोगों की राह ऊँचा उठाया हुआ राजमार्ग है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: यह जीवन-चाल और आचरण के रूपक को बनाए रखता है और नीतिवचन की गरिमापूर्ण शैली के अनुकूल है।
- source_word: עָצֵל
  choice: आलसी
  rationale: यह आदतन परिश्रम से बचने वाले व्यक्ति के लिए सहज, आधुनिक और सामान्य हिंदी शब्द है।
- source_word: כִּמְשֻׂכַת
  choice: बाड़ के समान
  rationale: כִּ तुलना को व्यक्त करता है और מְשֻׂכָה घेरने या रोकने वाली बाड़ का चित्र प्रस्तुत करता है।
- source_word: חָדֶק
  choice: काँटों की
  rationale: यह काँटेदार झाड़ी या काँटों की रुकावट को दर्शाता है; ‘काँटों की बाड़’ बाधक और पीड़ादायक चित्र को स्वाभाविक हिंदी में रखता है।
- source_word: אֹרַח
  choice: राह
  rationale: यह דֶּרֶךְ का निकटार्थी है; ‘राह’ उसी जीवन-मार्ग के रूपक को रखते हुए स्वाभाविक शैलीगत विविधता देता है।
- source_word: יְשָׁרִים
  choice: खरे लोग
  rationale: यह नैतिक रूप से सीधे और निष्कपट लोगों को सूचित करता है; ‘खरे’ नैतिक अर्थ को रखता है और केवल कानूनी या सांप्रदायिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: סְלֻלָה
  choice: ऊँचा बनाया हुआ राजमार्ग
  rationale: סלל से बना यह रूप मिट्टी डालकर ऊपर उठाए और तैयार किए गए मार्ग का संकेत दे सकता है। यह अनावृत्त और सुगम मार्ग के निहित भाव सहित ठोस सड़क-चित्र को सुरक्षित रखता है।
