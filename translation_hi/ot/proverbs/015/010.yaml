language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מוּסָ֣ר רָ֭ע לְ/עֹזֵ֣ב אֹ֑רַח שׂוֹנֵ֖א תוֹכַ֣חַת יָמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/010.yaml
  text: Harsh discipline is for one who forsakes the path[b][a]; whoever hates reproof will die.
translation:
  language: hi
  text: 'मार्ग[b] छोड़नेवाले के लिए कठोर अनुशासन[a] है;

    जो फटकार से घृणा करता है, वह मर जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कड़ी ताड़ना।” इब्रानी विशेषण का अर्थ “बुरा” या “दुष्ट” भी हो सकता है, पर यहाँ संभवतः अनुशासन की पीड़ादायक कठोरता का वर्णन है।
    reason: lexical_alternative
  - marker: b
    text: या, “रास्ता।” इब्रानी में यह जीवन के नैतिक आचरण के लिए नीतिवचन साहित्य का एक सामान्य रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוּסָר
  choice: अनुशासन
  rationale: यह शब्द सुधारने के उद्देश्य से दी जानेवाली शिक्षा, अनुशासन या ताड़ना को दर्शाता है। यहाँ ‘फटकार’ से घृणा करने के समानांतर होने के कारण सुधारात्मक अनुशासन का भाव प्रमुख है।
- source_word: רָע
  choice: कठोर
  rationale: इस विशेषण के सामान्य अर्थ ‘बुरा’ और ‘दुष्ट’ भी हैं, पर यहाँ यह अनुशासन की दुखद या कड़ी प्रकृति को व्यक्त करता है। ‘कठोर’ इस प्रसंग में स्वाभाविक है और अनुशासन को नैतिक रूप से बुरा ठहराने से बचता है।
- source_word: לְעֹזֵב
  choice: छोड़नेवाले के लिए
  rationale: לְ संबंध या नियति (‘के लिए’) बताता है, और कृदंत עֹזֵב ऐसे व्यक्ति का सामान्य चरित्र प्रस्तुत करता है जो मार्ग को छोड़ता है।
- source_word: אֹרַח
  choice: मार्ग
  rationale: नीतिवचन साहित्य में यह शब्द प्रायः जीवन के नैतिक आचरण के लिए प्रयुक्त रूपक है। ‘मार्ग’ उस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שׂוֹנֵא
  choice: जो ... घृणा करता है
  rationale: कृदंत यहाँ किसी भी ऐसे व्यक्ति के विषय में सामान्य सत्य व्यक्त करता है। यह हिन्दी में सूक्तिपरक और स्पष्ट है।
- source_word: תוֹכַחַת
  choice: फटकार
  rationale: यह मौखिक सुधार, उलाहना या डाँट को दर्शाता है। ‘फटकार’ स्पष्ट आधुनिक हिन्दी है और पहले खंड के ‘अनुशासन’ से शब्दगत भेद बनाए रखती है।
- source_word: יָמוּת
  choice: मर जाएगा
  rationale: यहाँ अपूर्ण क्रिया सूक्तिपरक परिणाम या भविष्य व्यक्त करती है। ‘मर जाएगा’ चेतावनी की पूरी गंभीरता को सीधे रूप में रखता है।
theological_decisions:
- issue: नीतिवचन में बताई गई मृत्यु का स्वरूप
  choice: ‘मर जाएगा’—मृत्यु के स्वरूप को अनिर्धारित रखा गया है।
  alternative: ‘नाश हो जाएगा’ या केवल शारीरिक मृत्यु के रूप में स्पष्ट करना
  rationale: इब्रानी מות व्यापक अर्थ वाला शब्द है, और पद यह स्पष्ट नहीं करता कि यहाँ शारीरिक, नैतिक या अंतिम मृत्यु अभिप्रेत है। इसलिए अनुवाद इस तनाव को सुलझाए बिना मूल कथन को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी रखी गई है। दोनों पंक्तियों की समानांतर सूक्तिपरक रचना सुरक्षित है; ‘अनुशासन’ और ‘फटकार’ द्वारा दो अलग इब्रानी शब्दों का भेद भी बनाए रखा गया है।
