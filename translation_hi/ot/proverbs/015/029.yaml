id: PRO.15.29
reference: Proverbs 15:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רָח֣וֹק יְ֭הוָה מֵ/רְשָׁעִ֑ים וּ/תְפִלַּ֖ת צַדִּיקִ֣ים יִשְׁמָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/029.yaml
  text: Yahweh is far from the wicked[a], but he hears the prayer of the righteous.
translation:
  language: hi
  text: याहवे[a] दुष्टों से दूर है, पर धर्मियों की प्रार्थना सुनता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ इसे “याहवे” लिखा गया है।
    reason: divine_name
lexical_decisions:
- source_word: רָחוֹק
  choice: दूर है
  rationale: यह संबंधपरक और नैतिक दूरी व्यक्त करता है; इसे केवल भौगोलिक दूरी के अर्थ में सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत परमेश्वर-नाम יהוה को शीर्षक से बदलने के बजाय उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: מֵרְשָׁעִים
  choice: दुष्टों से
  rationale: רְשָׁעִים नैतिक रूप से दुष्ट लोगों के वर्ग को दर्शाता है; यह संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: וּתְפִלַּת
  choice: पर ... प्रार्थना
  rationale: वाव मूलतः संयोजक है, पर दोनों पंक्तियों का संबंध स्पष्ट रूप से विरोधात्मक है; इसलिए हिन्दी में ‘पर’ इस विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צַדִּיקִים
  choice: धर्मियों की
  rationale: यह उन लोगों को दर्शाता है जिनकी पहचान धार्मिकता से होती है; नीतिवचन के सन्दर्भ में ‘धर्मी’ उपयुक्त वर्ग-संज्ञा है।
- source_word: יִשְׁמָע
  choice: सुनता है
  rationale: שׁמע का मूल अर्थ सुनना या ध्यान देना है। प्रार्थना के सन्दर्भ में अनुकूल ध्यान निहित हो सकता है, पर ‘उत्तर देता है’ कहने से अधिक अर्थ जोड़ दिया जाता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदले बिना सुरक्षित रखता है।
- issue: दुष्टों से याहवे के ‘दूर’ होने का आशय
  choice: नैतिक-संबंधपरक दूरी
  alternative: स्थानिक अनुपस्थिति या किसी भी अर्थ में सुनने की पूर्ण असमर्थता
  rationale: पहली पंक्ति की ‘दूरी’ दूसरी पंक्ति में धर्मियों की प्रार्थना सुनने के विरोध में है। इसलिए कथन को परमेश्वर की सर्वथा अनुपस्थिति या अज्ञान के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। हिब्रू समानांतरता और विरोध को हिन्दी के स्वाभाविक ‘पर’ से व्यक्त किया गया है; ‘सुनता है’ मूल की अर्थगत खुलावट बनाए रखता है।
