  edition: WLC
  text: לֹ֣א יֶאֱהַב לֵ֭ץ הוֹכֵ֣חַֽ ל֑/וֹ אֶל חֲ֝כָמִ֗ים לֹ֣א יֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/012.yaml
  text: A mocker does not love one who corrects him[a]; he will not go to the wise.
translation:
  language: hi
  text: उपहास करनेवाला उस व्यक्ति से प्रेम नहीं करता जो उसे सुधारता है; वह बुद्धिमानों के पास नहीं जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: यह शब्द नीतिवचन में तिरस्कार और उपहास करनेवाले व्यक्ति को दर्शाता है। यह आधुनिक हिन्दी में सक्रिय उपहासपूर्ण भाव को स्पष्ट रखता है।
- source_word: יֶאֱהַב
  choice: प्रेम नहीं करता
  rationale: मूल क्रिया का सामान्य अर्थ ‘प्रेम करना’ है। सीधा अनुवाद मूल की तीव्रता को न तो बढ़ाता है और न घटाता है।
- source_word: הוֹכֵחַ לוֹ
  choice: उसे सुधारनेवाले
  rationale: यह कृदंत ऐसे व्यक्ति को दर्शाता है जो भूल बताकर सुधार करता है। ‘सुधारनेवाला’ हिन्दी में स्वाभाविक है और केवल कठोर डाँट का अनावश्यक भाव नहीं जोड़ता।
- source_word: אֶל חֲכָמִים
  choice: बुद्धिमानों के पास
  rationale: אֶל यहाँ व्यक्तियों की ओर जाने या उनके पास पहुँचने का भाव देता है। ‘बुद्धिमानों’ को सामान्य श्रेणी के रूप में रखा गया है; सन्दर्भ इसे केवल पुरुषों तक सीमित नहीं करता।
- source_word: לֹא יֵלֵךְ
  choice: नहीं जाएगा
  rationale: הלך यहाँ ‘जाना/पास जाना’ है। नीतिवचन के प्रसंग में भविष्यत् रूप इच्छापूर्वक इनकार या सामान्य प्रवृत्ति—दोनों का भाव दे सकता है; ‘नहीं जाएगा’ इस तनाव को बनाए रखता है।
theological_decisions:
- issue: חֲכָמִים के व्याकरणिक पुल्लिंग बहुवचन का निर्वचन
  choice: बुद्धिमानों
  alternative: बुद्धिमान पुरुषों
  rationale: इब्रानी रूप व्याकरणिक रूप से पुल्लिंग बहुवचन है, पर ज्ञान-साहित्य में यह प्रायः बुद्धिमान व्यक्तियों की सामान्य श्रेणी के लिए प्रयुक्त होता है। हिन्दी ‘बुद्धिमानों’ इस सामान्य अर्थ को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण नीतिवचन-शैली। दोनों खंडों की समानांतर संरचना और मूल का संक्षिप्त, तीखा कथन सुरक्षित रखा गया है।
