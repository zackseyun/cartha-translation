  text: Whoever is greedy for gain troubles his own house[a], but he who hates bribes will live.
translation:
  language: hi
  text: जो लाभ का लोभी है, वह अपने ही घराने पर मुसीबत लाता है; पर जो घूस[a] से घृणा करता है, वह जीवित रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘भेंटें’ है; इस संदर्भ में आशय संभवतः ‘घूस’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹכֵר
  choice: मुसीबत लाता है
  rationale: यह कृदंत किसी पर संकट या विपत्ति लाने का भाव देता है। यह अनुवाद कारण-परिणाम को स्वाभाविक हिंदी में व्यक्त करता है, बिना पूर्ण विनाश का अर्थ थोपे।
- source_word: בֵּיתוֹ
  choice: अपने ही घराने पर
  rationale: בַּיִת का अर्थ मकान के साथ परिवार या गृहस्थी भी हो सकता है। ‘घराने’ से व्यक्ति के आचरण से प्रभावित पूरे परिवार का भाव स्पष्ट होता है, जबकि घरेलू क्षेत्र की मूल छवि बनी रहती है।
- source_word: בּוֹצֵעַ בָּצַע
  choice: अनुचित लाभ का लोभी
  rationale: एक ही मूल से बने क्रिया-संज्ञा के इस प्रयोग में लाभ की तीव्र लालसा है और प्रायः बेईमानी या अन्याय से प्राप्त लाभ का नैतिक भाव जुड़ा है। ‘अनुचित लाभ’ इस नकारात्मक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: וְשׂוֹנֵא
  choice: पर जो … घृणा करता है
  rationale: וְ सामान्यतः ‘और’ है, किंतु यहाँ विरोधात्मक समानांतरता के कारण ‘पर’ स्वाभाविक और अर्थानुकूल है।
- source_word: מַתָּנוֹת
  choice: घूस
  rationale: शब्द का सामान्य अर्थ ‘भेंटें’ है, पर अनुचित लाभ के विरोध और नीतिवचन के नैतिक संदर्भ में न्याय या निर्णय को प्रभावित करने वाली भेंटें, अर्थात घूस, अभिप्रेत होने की प्रबल संभावना है। व्यापक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יִחְיֶה
  choice: जीवित रहेगा
  rationale: मूल की संक्षिप्तता बनाए रखता है और जीवन, बचाव तथा फलने-फूलने की संभावित व्यापक प्रतिध्वनि को किसी एक अर्थ तक सीमित नहीं करता।
