  text: אֱוִ֗יל יִ֭נְאַץ מוּסַ֣ר אָבִ֑י/ו וְ/שֹׁמֵ֖ר תּוֹכַ֣חַת יַעְרִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/005.yaml
  text: A fool despises his father's discipline[a], but whoever heeds reproof is prudent.
translation:
  language: hi
  text: 'मूर्ख अपने पिता के अनुशासन को तुच्छ जानता है,

    पर जो डाँट को मानता है, वह समझदार बनता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: यह नीतिवचन-साहित्य में नैतिक और व्यावहारिक मूर्खता बताने वाला सामान्य शब्द है; ‘मूर्ख’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יִנְאַץ
  choice: तुच्छ जानता है
  rationale: क्रिया में केवल अस्वीकार करना नहीं, बल्कि अवमानना के साथ ठुकराना निहित है; ‘तुच्छ जानता है’ इस भाव को सुरक्षित रखता है।
- source_word: מוּסַר
  choice: अनुशासन
  rationale: यहाँ शब्द में प्रशिक्षण, सुधार और सुधारात्मक शिक्षा का संयुक्त भाव है; पिता के संदर्भ में ‘अनुशासन’ उपयुक्त है।
- source_word: אָבִיו
  choice: अपने पिता के
  rationale: इब्रानी पाठ स्पष्ट रूप से ‘उसके पिता’ कहता है; हिन्दी में कर्ता के साथ स्वाभाविक संबंध के लिए ‘अपने पिता के’ रखा गया है।
- source_word: וְשֹׁמֵר
  choice: पर जो … मानता है
  rationale: शाब्दिक अर्थ ‘रखता/सँभालता है’ है, पर इस संदर्भ में सुधार को ग्रहण कर उसके अनुसार चलना अभिप्रेत है; ‘मानता है’ सहज हिन्दी में यही सक्रिय प्रत्युत्तर व्यक्त करता है।
- source_word: תּוֹכַחַת
  choice: डाँट
  rationale: यह शब्द मौखिक सुधार या फटकार को दर्शाता है; ‘डाँट’ सामान्य पाठक के लिए स्पष्ट है और पैतृक अनुशासन के प्रसंग में स्वाभाविक लगता है।
- source_word: יַעְרִם
  choice: समझदार बनता है
  rationale: यह क्रिया विवेकी या चतुर बनने/सिद्ध होने का अर्थ दे सकती है; ‘समझदार बनता है’ परिणामात्मक भाव और सकारात्मक व्यावहारिक बुद्धि दोनों व्यक्त करता है।
theological_decisions:
- issue: माता-पिता संबंधी लिंगविशिष्ट भाषा
  choice: अपने पिता के
  alternative: अपने माता-पिता के
  rationale: मूल इब्रानी में विशेष रूप से पिता का उल्लेख है, इसलिए उसे लिंग-निरपेक्ष बनाकर व्यापक नहीं किया गया।
- issue: अंतिम क्रिया का परिणामात्मक या वर्णनात्मक अर्थ
  choice: समझदार बनता है
  alternative: समझदारी से काम करता है
  rationale: יַעְרִם में ‘विवेकी बनना’ अथवा ‘विवेक दिखाना’ दोनों अर्थ संभव हैं। मुख्य पाठ में परिणामात्मक अर्थ रखा गया है, बिना इसे किसी विशेष धर्मशास्त्रीय निष्कर्ष में बदलने के।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की समानांतर काव्य-रचना के अनुरूप रखी गई है। ‘तुच्छ जानता है’ गरिमापूर्ण है, जबकि ‘डाँट को मानता है’ सामान्य पाठक के लिए सहज है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ मूल की अर्थ-सीमा को पर्याप्त रूप से व्यक्त करता है।
