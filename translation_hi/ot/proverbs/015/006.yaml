  text: בֵּ֣ית צַ֭דִּיק חֹ֣סֶן רָ֑ב וּ/בִ/תְבוּאַ֖ת רָשָׁ֣ע נֶעְכָּֽרֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/006.yaml
  text: In the house of the righteous there is great wealth[b][a], but in the income of the wicked there is trouble.
translation:
  language: hi
  text: 'धर्मी के घर में बहुत धन होता है,

    पर दुष्ट की कमाई में विपत्ति होती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कमाई’ का अर्थ ‘उपज,’ ‘फसल’ या ‘आय’ भी हो सकता है; ‘विपत्ति होती है’ का अनुवाद ‘वह अशांत होती है’ या ‘वह नष्ट हो जाती है’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית צַדִּיק
  choice: धर्मी के घर में
  rationale: रचना का ठोस चित्र ‘घर’ बनाए रखती है और साथ ही धर्मी व्यक्ति के गृहस्थ जीवन तथा संपत्ति की स्थिति का संकेत देती है। एकवचन यहाँ प्रतिनिधिक है।
- source_word: חֹסֶן רָב
  choice: बहुत धन
  rationale: חֹסֶן यहाँ संचित संपत्ति, धन या संसाधनों को सूचित करता है; רָב उसकी प्रचुरता व्यक्त करता है। ‘बहुत धन’ सहज आधुनिक हिन्दी है।
- source_word: וּבִתְבוּאַת רָשָׁע
  choice: पर दुष्ट की कमाई में
  rationale: ו यहाँ विरोधसूचक है। תְבוּאָה का मूल अर्थ उपज/फसल है, पर यह आर्थिक प्राप्ति या आय को भी सूचित कर सकता है; ‘कमाई’ सामान्य पाठक के लिए स्वाभाविक व्यापक अर्थ देती है।
- source_word: נֶעְכָּרֶת
  choice: विपत्ति होती है
  rationale: עכר से बना यह रूप परेशानी, उथल-पुथल या विनाश का भाव दे सकता है। ‘विपत्ति होती है’ पद की नकारात्मक परिणति को स्पष्ट रखते हुए उसकी सीमा को अत्यधिक संकीर्ण नहीं करता।
theological_decisions:
- issue: नीतिवचन को निरपेक्ष भौतिक-समृद्धि की प्रतिज्ञा समझने का जोखिम
  choice: मूल के सामान्य नीतिवचनात्मक कथन को बिना व्याख्यात्मक योग्यता जोड़े रखा गया है।
  alternative: ‘आमतौर पर’ या आध्यात्मिक धन जैसे स्पष्टीकरण जोड़ना।
  rationale: हिब्रू पाठ स्वयं ऐसी योग्यता या आध्यात्मिकीकरण नहीं जोड़ता; अनुवाद को कथन का तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। काव्यात्मक विरोध को दो पंक्तियों में रखा गया है। ‘धर्मी’ और ‘दुष्ट’ प्रतिनिधिक एकवचन हैं और अनावश्यक लिंग-विस्तार से बचते हैं।
