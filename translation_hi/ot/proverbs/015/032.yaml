  text: פּוֹרֵ֣עַ מ֭וּסָר מוֹאֵ֣ס נַפְשׁ֑/וֹ וְ/שׁוֹמֵ֥עַ תּ֝וֹכַ֗חַת ק֣וֹנֶה לֵּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/032.yaml
  text: Whoever ignores discipline despises himself, but he who listens to reproof gains understanding.
translation:
  language: hi
  text: जो अनुशासन को ठुकराता है, वह अपने आप से घृणा करता है; पर जो डाँट को सुनता है, वह समझ प्राप्त करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פּוֹרֵעַ מוּסָר
  choice: अनुशासन को ठुकराता है
  rationale: פּוֹרֵעַ यहाँ अनुशासन की उपेक्षा मात्र नहीं, बल्कि उसे छोड़ने या अस्वीकार करने का भाव रखता है; ‘ठुकराता है’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מוֹאֵס נַפְשׁוֹ
  choice: अपने आप से घृणा करता है
  rationale: נֶפֶשׁ यहाँ व्यक्ति के स्वयं/जीवन को सूचित करता है। ‘अपने आप से’ हिन्दी में स्वाभाविक है और मूल की तीखी अभिव्यक्ति बनाए रखता है।
- source_word: תּוֹכַחַת
  choice: डाँट
  rationale: यह सुधार के उद्देश्य से दी गई फटकार या ताड़ना है; ‘डाँट’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: קֹנֶה לֵּב
  choice: समझ प्राप्त करता है
  rationale: शाब्दिक रूप से ‘हृदय प्राप्त करता है’; इब्रानी ज्ञान-साहित्य में לֵב विवेक/समझ का केंद्र है। इसलिए अर्थ-संगत हिन्दी ‘समझ प्राप्त करता है’ है।
theological_decisions:
- issue: נַפְשׁוֹ का अर्थ
  choice: अपने आप से
  alternative: अपने प्राण से / अपने जीवन से
  rationale: इस संदर्भ में कथन व्यक्ति के अपने ही हित और अस्तित्व के प्रति घृणा को व्यक्त करता है; ‘अपने आप से’ मूल की व्यापकता को बिना किसी विशेष दार्शनिक अर्थ के रखता है।
- issue: קֹנֶה לֵּב का रूपक
  choice: समझ प्राप्त करता है
  alternative: हृदय प्राप्त करता है
  rationale: हिन्दी में ‘हृदय प्राप्त करता है’ अपेक्षित अर्थ नहीं पहुँचाता, जबकि इब्रानी मुहावरे का आशय विवेक या समझ पाना है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली। दोनों अर्ध-पंक्तियों का विरोध तथा मूल की नैतिक तीक्ष्णता सुरक्षित रखी गई है।
