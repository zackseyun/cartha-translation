  text: לֵ֣ב נָ֭בוֹן יְבַקֶּשׁ דָּ֑עַת ו/פני כְ֝סִילִ֗ים יִרְעֶ֥ה אִוֶּֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/014.yaml
  text: The heart of the discerning seeks knowledge[a], but the face of fools feeds on folly.
translation:
  language: hi
  text: 'समझदार का हृदय ज्ञान की खोज करता है,

    पर मूर्खों के चेहरे[a] मूर्खता चरते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “मूर्खों के चेहरे” है। “चरते हैं” के बिंब के अनुरूप कुछ अनुवाद इसका भाव “मूर्खों के मुँह” करते हैं।
    reason: मसोरेटी पाठ के असामान्य रूपक और प्रचलित व्याख्यात्मक अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: नीतिवचन में यह शब्द विचार, इच्छा और विवेक सहित भीतरी मनुष्य को दर्शाता है। ‘हृदय’ मूल रूपक को बनाए रखता है।
- source_word: נָבוֹן
  choice: समझदार
  rationale: यह ऐसे व्यक्ति को दर्शाता है जिसमें समझ और परख है; ‘समझदार’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יְבַקֶּשׁ
  choice: खोज करता है
  rationale: क्रिया जान-बूझकर और सक्रिय रूप से खोजने का भाव देती है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: ज्ञान-साहित्य के संदर्भ में यह इसका सीधा और उपयुक्त अर्थ है।
- source_word: וּפְנֵי
  choice: मुख
  rationale: मसोरेटी पाठ का शब्द शाब्दिक रूप से ‘चेहरा/मुख’ है। हिन्दी ‘मुख’ मूल शब्द को सुरक्षित रखते हुए ‘मुँह’ का भाव भी दे सकता है, जो ‘चरता है’ के बिंब से जुड़ता है।
- source_word: כְסִילִים
  choice: मूर्खों
  rationale: नीतिवचन में यह नैतिक और बौद्धिक मूर्खता की स्थापित श्रेणी है; ‘मूर्ख’ इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: יִרְעֶה
  choice: चरता है
  rationale: क्रिया का मूल अर्थ चरना या चराना है। ‘चरता है’ कहावत के सजीव और कुछ असामान्य मूल बिंब को बनाए रखता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह बुद्धि के विपरीत मूर्ख आचरण और प्रवृत्ति को दर्शाने वाला सामान्य ज्ञान-साहित्यिक शब्द है।
