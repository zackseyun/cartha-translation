  yaml_path: translation/ot/proverbs/015/016.yaml
  text: Better is a little with the fear of Yahweh than great treasure with turmoil[a].
translation:
  language: hi
  text: याहवे के भय के साथ थोड़ी संपत्ति होना, बड़े खज़ाने और उसके साथ की उथल-पुथल से अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके साथ परेशानी,” अथवा “उसमें गड़बड़ी।” इब्रानी शब्द अशांति, उपद्रव या गड़बड़ी का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: नीतिवचन की तुलनात्मक रचना में इसका अर्थ केवल ‘अच्छा’ नहीं, बल्कि ‘उससे अच्छा’ है; हिंदी में ‘से अच्छा है’ स्वाभाविक तुलना बनाता है।
- source_word: מְעַט
  choice: थोड़ा-सा होना
  rationale: यह थोड़ी संपत्ति या सीमित साधनों को सूचित करता है; ‘होना’ जोड़ने से क्रियारहित इब्रानी वाक्य हिंदी में स्पष्ट और सहज बनता है।
- source_word: בְּיִרְאַת יְהוָה
  choice: याहवे का भय मानते हुए
  rationale: בְּ को संगति या परिस्थिति के अर्थ में व्यक्त किया गया है। ‘भय मानना’ नीतिवचन के प्रमुख धर्मवैचारिक पद को बनाए रखता है और केवल आतंक तक सीमित नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵאוֹצָר רָב
  choice: उस बड़े खज़ाने से
  rationale: מִן तुलनात्मक ‘से’ है; אוֹצָר רָב संचित अथवा प्रचुर धन को ‘बड़ा खज़ाना’ के रूप में व्यक्त करता है।
- source_word: וּמְהוּמָה בוֹ
  choice: जिसके साथ अशांति हो
  rationale: מְהוּמָה उथल-पुथल, व्याकुलता या गड़बड़ी को सूचित कर सकता है। בוֹ को खज़ाने के साथ जुड़ी परिस्थिति के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: नीतिवचन साहित्य में ‘याहवे का भय’ का अर्थ
  choice: मुख्य पाठ में ‘याहवे का भय मानते हुए’
  alternative: ‘याहवे के प्रति श्रद्धा रखते हुए’
  rationale: ‘भय’ को बनाए रखने से मूल धर्मवैचारिक अभिव्यक्ति और उसकी व्यापक शास्त्रीय प्रतिध्वनि सुरक्षित रहती है; ‘श्रद्धा’ अकेले कहने से अर्थ कुछ अधिक संकीर्ण हो सकता है।
- issue: בוֹ का संबंध और מְהוּמָה की अर्थ-सीमा
  choice: बड़े खज़ाने के साथ अशांति
  alternative: उसमें गड़बड़ी / उसके साथ परेशानी
  rationale: पुल्लिंग एकवचन सर्वनाम स्वाभाविक रूप से ‘खज़ाने’ की ओर लौटता है, पर पूर्वसर्ग परिस्थिति की संगति अथवा उसके भीतर की अवस्था—दोनों रूपों में समझा जा सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘खज़ाना’ सामान्य पाठक के लिए सहज है; ‘अशांति’ मूल शब्द की व्यापकता को बिना अनावश्यक व्याख्या के व्यक्त करती है।
