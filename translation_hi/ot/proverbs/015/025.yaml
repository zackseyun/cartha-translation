  yaml_path: translation/ot/proverbs/015/025.yaml
  text: Yahweh tears down the house of the proud[b][a], but he sets firm the boundary of the widow.
translation:
  language: hi
  text: याहवे घमंडियों का घर ढा देता है[a], पर विधवा की सीमारेखा को स्थिर करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घमंडियों का घर उखाड़ देता है।” इब्रानी क्रिया में केवल ढाने ही नहीं, हटाने या जड़ से उखाड़ने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “विधवा की सीमारेखा (या सीमा-चिह्न) स्थापित करता है।” यह चित्र याहवे द्वारा असुरक्षित लोगों के भूमि और संपत्ति के अधिकारों की रक्षा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית
  choice: घर
  rationale: यह रचना-संबंधी रूप में ‘घर’ है; यहाँ भौतिक मकान के साथ परिवार या संपत्ति का व्यापक भाव भी संभव है, इसलिए ठोस चित्र को बनाए रखा गया है।
- source_word: גֵּאִים
  choice: घमंडियों
  rationale: यह शब्द अभिमानी या अहंकारी लोगों को दर्शाता है; ‘घमंडियों’ से नीतिवचन का नैतिक विरोध सहज और स्पष्ट रहता है।
- source_word: יִסַּח
  choice: ढा देता है
  rationale: क्रिया हटाने, उखाड़ने या नष्ट कर देने का बल रखती है। ‘घर’ के साथ ‘ढा देता है’ स्वाभाविक है, जबकि ‘उखाड़ देता है’ को पादटिप्पणी में वास्तविक वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: וְיַצֵּב
  choice: पर … दृढ़ करता है
  rationale: हिफ़इल क्रिया का अर्थ स्थापित या दृढ़ करना है। वाव को पद के विरोधात्मक समानांतर ढाँचे के कारण ‘पर’ कहा गया है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: मूल अर्थ सीमा, सरहद या संपत्ति की सीमारेखा है। ‘सीमा’ संक्षिप्त रहते हुए भूमि-अधिकार के चित्र को बनाए रखती है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: एकवचन यहाँ समाज के असुरक्षित वर्ग की प्रतिनिधि स्त्री को दर्शाता है; हिंदी में ‘विधवा’ वही प्रतिनिधिक बल रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित करता है।
- issue: וְיַצֵּב से पहले ו का अर्थ
  choice: पर
  alternative: और
  rationale: संयोजक का मूल रूप ‘और’ है, किंतु पद की विरोधात्मक समानांतरता में घमंडियों पर न्याय और विधवा की रक्षा आमने-सामने रखे गए हैं; ‘पर’ उसी वाक्यगत संबंध को स्पष्ट करता है।
- issue: विधवा की सीमा को दृढ़ करने का आशय
  choice: संपत्ति की सीमा की रक्षा का ठोस चित्र बनाए रखना
  alternative: विधवा के अधिकारों की रक्षा करता है
  rationale: व्याख्यात्मक भाव वास्तविक है, पर मूल पाठ ठोस सीमारेखा का चित्र देता है। मुख्य पाठ उस चित्र को सुरक्षित रखता है और पादटिप्पणी उसका सामाजिक-कानूनी निहितार्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘घर’, ‘ढा देता है’ और ‘सीमा’ मूल की ठोस काव्यात्मक छवियाँ बनाए रखते हैं। ‘घमंडियों’ और ‘विधवा’ का विरोध सामान्य पाठक के लिए स्पष्ट है; जहाँ मूल में अर्थ-विस्तार संभव है, उसे पादटिप्पणियों में सुरक्षित रखा गया है।
