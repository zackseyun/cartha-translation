base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/001.yaml
  text: A gentle answer turns away wrath[a], but a painful word stirs up anger.
translation:
  language: hi
  text: 'कोमल उत्तर क्रोध को शांत कर देता है,

    पर दुख देने वाली बात[a] गुस्सा भड़का देती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चोट पहुँचाने वाली बात” अथवा “कठोर बात।” इब्रानी पदबंध का शाब्दिक अर्थ “दुख/पीड़ा की बात” है; यह ऐसी वाणी को दर्शा सकता है जो दुख पहुँचाती है और इस प्रकार गुस्सा भड़काती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲנֶה
  choice: उत्तर
  rationale: यह संज्ञा कही गई बात के प्रत्युत्तर को दर्शाती है; ‘उत्तर’ संक्षिप्त, स्वाभाविक और नीतिवचन की शैली के अनुकूल है।
- source_word: רַךְ
  choice: कोमल
  rationale: मूल अर्थ ‘नरम/कोमल’ है। यहाँ ‘कोमल’ बोलने के ढंग की नम्रता और सौम्यता व्यक्त करता है तथा दूसरी पंक्ति की दुखदायक बात से स्पष्ट विरोध बनाता है।
- source_word: יָשִׁיב
  choice: शांत कर देता है
  rationale: שׁוב के हिफ़ील रूप का शाब्दिक भाव ‘वापस मोड़ना’ है। क्रोध के साथ हिंदी में ‘शांत कर देना’ उसके घटने या टलने का स्वाभाविक भाव व्यक्त करता है।
- source_word: חֵמָה
  choice: क्रोध
  rationale: यह शब्द तीव्र, तपते हुए रोष को दर्शाता है। ‘क्रोध’ गरिमापूर्ण और सामान्य हिंदी में सहज है।
- source_word: דְבַר עֶצֶב
  choice: दुख देने वाली बात
  rationale: इस पदबंध का शाब्दिक भाव ‘दुख/पीड़ा की बात’ है और यह ऐसी वाणी को सूचित कर सकता है जो चोट या दुख पहुँचाती है। यह अनुवाद अर्थ को स्वाभाविक हिंदी में रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: יַעֲלֶה
  choice: भड़का देती है
  rationale: עלה के हिफ़ील रूप का शाब्दिक अर्थ ‘ऊपर चढ़ाना’ है; गुस्से के प्रसंग में ‘भड़काना’ उसे उभारने के कारणवाचक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אָף
  choice: गुस्सा
  rationale: शब्द का शाब्दिक अर्थ ‘नाक’ है, पर यह प्रचलित मुहावरे के रूप में क्रोध को दर्शाता है। दूसरी पंक्ति में ‘गुस्सा’ सामान्य पाठक के लिए सहज है और पहली पंक्ति के ‘क्रोध’ के अनावश्यक शब्द-दोहराव से भी बचाता है।
