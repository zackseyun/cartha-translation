  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘जीभ’ और ‘मुँह’ के समानांतर बिंब सुरक्षित हैं; पंक्ति-विभाजन से इब्रानी विरोधात्मक समानांतरता स्पष्ट होती है।
