reference: Proverbs 15:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְשׁ֣וֹן חֲ֭כָמִים תֵּיטִ֣יב דָּ֑עַת וּ/פִ֥י כְ֝סִילִ֗ים יַבִּ֥יעַ אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/002.yaml
  text: The tongue of the wise makes knowledge good[b][a], but the mouth of fools pours out folly.
translation:
  language: hi
  text: 'बुद्धिमानों की जीभ ज्ञान को भली रीति से प्रस्तुत करती है[a],

    पर मूर्खों का मुँह मूर्खता उंडेलता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “ज्ञान को अच्छा बनाती है।” इसका अर्थ “ज्ञान का अच्छा उपयोग करती है,” “ज्ञान को सँवारती है,” या “ज्ञान को आकर्षक बनाती है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मूर्खता उगलता है,” “फूट पड़ता है,” अथवा “बहा देता है।” इब्रानी क्रिया बहुतायत में बाहर निकलने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשׁוֹן
  choice: जीभ
  rationale: वाणी के लिए प्रयुक्त ठोस शारीरिक बिंब को बनाए रखता है और दूसरे चरण के ‘मुँह’ के साथ काव्यात्मक समानता रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: यह बहुवचन विशेषण यहाँ एक वर्ग को सूचित करता है; ‘बुद्धिमानों’ से लिंग को अनावश्यक रूप से सीमित किए बिना वही भाव मिलता है।
- source_word: תֵּיטִיב
  choice: भली रीति से प्रस्तुत करती है
  rationale: हिफ़ील रूप के ‘अच्छा बनाना/भला करना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी इसके संभावित अर्थों—ज्ञान का अच्छा उपयोग करना या उसे आकर्षक ढंग से रखना—को खुला रखती है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: नीतिवचन साहित्य में इसका सामान्य अर्थ ‘ज्ञान’ है और यह दूसरे चरण की ‘मूर्खता’ के साथ स्पष्ट विरोध बनाता है।
- source_word: וּפִי
  choice: पर ... मुँह
  rationale: वाव को दोनों चरणों के तीखे विरोध के कारण ‘पर’ से व्यक्त किया गया है; ‘मुँह’ मूल शारीरिक बिंब को बनाए रखता है।
- source_word: כְסִילִים
  choice: मूर्खों
  rationale: यह नीतिवचन में नैतिक और बौद्धिक श्रेणी के लिए प्रयुक्त मानक शब्द है।
- source_word: יַבִּיעַ
  choice: उंडेलता है
  rationale: मूल क्रिया किसी वस्तु के बहुतायत में फूटकर या बहकर निकलने का चित्र देती है; ‘उंडेलता है’ इस प्रचुर और असंयमित अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह मूर्ख व्यक्ति के गुण और उसकी अभिव्यक्ति, दोनों को सूचित करने वाला स्वाभाविक हिन्दी अमूर्त संज्ञा है।
theological_decisions: []
