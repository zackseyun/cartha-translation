reference: Proverbs 15:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֵ֣ב צַ֭דִּיק יֶהְגֶּ֣ה לַ/עֲנ֑וֹת וּ/פִ֥י רְ֝שָׁעִ֗ים יַבִּ֥יעַ רָעֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/028.yaml
  text: The heart of the righteous considers how to answer[a], but the mouth of the wicked pours out evil things.
translation:
  language: hi
  text: 'धर्मी का मन सोचता है कि कैसे उत्तर दे,[a]

    पर दुष्टों का मुँह बुरी बातें उगलता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उत्तर देने के लिए मनन करता है।” इब्रानी क्रिया में मन ही मन विचारने या गहराई से सोचने का भाव हो सकता है; अधिक शाब्दिक रूप है, “उत्तर देने के लिए विचार करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: मन
  rationale: इब्रानी ज्ञान-साहित्य में यह शब्द विचार और विवेक सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिन्दी में उत्तर देने से पहले विचार करने के संदर्भ में ‘मन’ अधिक स्वाभाविक है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह विशेषण यहाँ संज्ञा के रूप में एक प्रतिनिधि धर्मी व्यक्ति के लिए प्रयुक्त है; ‘धर्मी’ संक्षिप्त, स्वाभाविक और लिंग की अनावश्यक स्पष्टता से मुक्त है।
- source_word: יֶהְגֶּה
  choice: सोचता है
  rationale: क्रिया मनन, चिंतन या विचारपूर्ण कथन का अर्थ दे सकती है। उत्तर देने के प्रसंग में ‘सोचता है’ सहज हिन्दी में सावधानीपूर्वक विचार को व्यक्त करता है।
- source_word: לַעֲנוֹת
  choice: कि कैसे उत्तर दे
  rationale: ל उपसर्गयुक्त infinitive उत्तर देने की ओर उन्मुख विचार को दर्शाता है। ‘कैसे’ निहित विचार-विमर्श को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक औपचारिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וּפִי
  choice: पर ... का मुँह
  rationale: ו का मूल अर्थ ‘और’ है, किंतु इस विरोधात्मक समानांतरता में ‘पर’ हिन्दी में स्पष्ट और स्वाभाविक विरोध व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में दुष्ट लोगों के वर्ग को दर्शाता है और धर्मी के साथ नैतिक विरोध बनाए रखता है।
- source_word: יַבִּיעַ
  choice: उगलता है
  rationale: हिफ़ील रूप किसी चीज़ को बहा देने या प्रचुरता से बाहर निकालने का जीवंत बिंब देता है। ‘उगलता है’ अनियंत्रित और घृणित वाणी की तीव्रता को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: רָעוֹת
  choice: बुरी बातें
  rationale: स्त्रीलिंग बहुवचन यहाँ बुरी बातों या बुराइयों को दर्शाता है। वाणी के संदर्भ में ‘बुरी बातें’ बहुवचन और नैतिक अर्थ दोनों को सहज रूप से सुरक्षित रखता है।
