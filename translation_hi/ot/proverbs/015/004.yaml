  text: A healing tongue is a tree of life[b][a], but perverseness in it is a breaking of the spirit.
translation:
  language: hi
  text: चंगाई देने वाली जीभ जीवन का वृक्ष है,[a] पर उसमें टेढ़ापन आत्मा को तोड़ता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरोग्यदायक जीभ जीवन का वृक्ष है।” מַרְפֵּא का अर्थ चंगाई, स्वास्थ्य या आरोग्य भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पर उसमें टेढ़ापन आत्मा का टूटना है।” ‘आत्मा’ यहाँ मनुष्य के भीतरी मन या आत्मबल का संकेत है।
    reason: formal_rendering
lexical_decisions:
- source_word: מַרְפֵּא
  choice: चंगा करने वाली
  rationale: यह शब्द चंगाई, उपचार या स्वास्थ्य का भाव रखता है। ‘चंगा करने वाली’ उसके पुनर्स्थापक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है; केवल ‘कोमल’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: לָשׁוֹן
  choice: जीभ
  rationale: मूल रूपक को बनाए रखते हुए ‘जीभ’ यहाँ वाणी के अर्थ में सहजता से समझी जाती है।
- source_word: עֵץ חַיִּים
  choice: जीवन का वृक्ष
  rationale: यह अनिश्चित अर्थ वाला रचनात्मक पद है, पर हिंदी में ‘जीवन का वृक्ष’ स्वाभाविक है और नीतिवचन तथा उत्पत्ति से इसकी साहित्यिक प्रतिध्वनि बनाए रखता है, बिना इसे अनिवार्यतः अदन के उसी विशिष्ट वृक्ष तक सीमित किए।
- source_word: סֶלֶף
  choice: टेढ़ापन
  rationale: यह विकृति या कुटिलता का बिंब व्यक्त करता है। ‘टेढ़ापन’ वाणी के नैतिक और अभिव्यक्तिगत बिगाड़ दोनों को समेटता है।
- source_word: בָּהּ
  choice: उसमें
  rationale: स्त्रीलिंग प्रत्यय का स्वाभाविक संबंध ‘जीभ’ से है; ‘उसमें’ मूल सर्वनामिक संबंध को बनाए रखता है।
- source_word: שֶׁבֶר
  choice: तोड़ देता है
  rationale: संज्ञा का मूल अर्थ टूटना, दरार या विध्वंस है। हिंदी में क्रियात्मक रूप अधिक स्वाभाविक है और टूटने के सजीव रूपक को बनाए रखता है।
- source_word: בְּרוּחַ
  choice: आत्मा को
  rationale: यहाँ רוּחַ मनुष्य के भीतरी जीवन या आत्मबल की ओर संकेत करता है। ‘आत्मा को’ हिंदी में विनाशकारी प्रभाव को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
theological_decisions:
- issue: רוּחַ का अभिप्राय
  choice: मनुष्य की आत्मा अथवा भीतरी जीवन
  alternative: परमेश्वर का आत्मा
  rationale: नीतिवचन का समानांतर विन्यास मनुष्य की वाणी के पुनर्स्थापक अथवा विनाशकारी प्रभाव का वर्णन करता है; इसलिए यहाँ मनुष्य का भीतरी जीवन अभिप्रेत है, न कि पवित्र आत्मा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘जीभ’ और ‘जीवन का वृक्ष’ जैसे मूल हिब्रू बिंब सुरक्षित रखे गए हैं; दूसरे खंड में अत्यधिक कृत्रिम संज्ञात्मक रचना के स्थान पर स्वाभाविक हिंदी क्रिया-विन्यास अपनाया गया है।
