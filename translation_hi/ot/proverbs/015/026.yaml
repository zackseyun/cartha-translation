  text: תּוֹעֲבַ֣ת יְ֭הוָה מַחְשְׁב֣וֹת רָ֑ע וּ֝/טְהֹרִ֗ים אִמְרֵי נֹֽעַם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/026.yaml
  text: Evil plans are an abomination to Yahweh[b][a], but pleasant words are pure.
translation:
  language: hi
  text: बुरी योजनाएँ[a] याहवे को घृणित हैं, पर मनभावने वचन शुद्ध हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुरे विचार” अथवा “बुरे इरादे।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी शब्द-क्रम: “पर शुद्ध हैं मनभावने वचन।” आरंभिक संयोजक का अनुवाद “और” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द उस वस्तु या बात को दर्शाता है जिससे याहवे को तीव्र नैतिक घृणा है। हिंदी में विधेय विशेषण ‘घृणित’ संक्षिप्त, स्वाभाविक और अर्थ की प्रबलता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: מַחְשְׁבוֹת רָע
  choice: बुरी योजनाएँ
  rationale: מַחְשְׁבוֹת विचारों, इरादों या योजनाओं को सूचित कर सकता है। इस नीति-वचन के नैतिक संदर्भ में ‘बुरी योजनाएँ’ सहज है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
- source_word: וּטְהֹרִים
  choice: पर ... शुद्ध हैं
  rationale: וְ को विरोधसूचक समानांतरता के कारण ‘पर’ कहा गया है। इब्रानी में ‘शुद्ध’ पहले आता है, किंतु हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
- source_word: אִמְרֵי נֹעַם
  choice: मनभावने वचन
  rationale: यह पदबंध pleasantness/sweetness वाले कथनों को दर्शाता है। ‘मनभावने वचन’ गरिमापूर्ण और सहज है तथा अनावश्यक रूप से ‘अनुग्रहपूर्ण’ जैसा धर्मशास्त्रीय अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: दूसरे चरण में וְ का संबंध
  choice: पर
  alternative: और
  rationale: व्याकरणतः ‘और’ संभव है, किंतु बुरी योजनाओं और शुद्ध वचनों के बीच नीति-वचन की विरोधसूचक समानांतरता ‘पर’ को संदर्भानुकूल बनाती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीति-वचन शैली रखी गई है। ‘वचन’ सामान्य पाठक के लिए बोधगम्य रहते हुए ‘कथन/उक्तियाँ’ की तुलना में अधिक काव्यात्मक है।
