  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमापूर्ण समानांतर शैली के अनुरूप रखी गई है। पहली और दूसरी पंक्ति में ‘कलह’ तथा ‘झगड़ा’ स्रोत के दो निकटार्थी किन्तु भिन्न शब्दों का स्वाभाविक हिन्दी प्रतिनिधित्व करते हैं।
