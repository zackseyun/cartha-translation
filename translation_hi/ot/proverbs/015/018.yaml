  text: A hot-tempered man stirs up strife[c][b][a], but one who is slow to anger quiets a dispute.
translation:
  language: hi
  text: 'क्रोधी मनुष्य कलह भड़काता है,

    परन्तु जो देर से क्रोधित होता है[a], वह झगड़ा शांत करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘नथुनों का लंबा’; यह इब्रानी मुहावरा उस व्यक्ति के लिए है जो देर से क्रोधित होता है।
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ חֵמָה
  choice: क्रोधी मनुष्य
  rationale: इस पदबंध का शाब्दिक भाव ‘क्रोध का मनुष्य’ है और यह एक स्वभाव-प्रकार बताता है। ‘क्रोधी मनुष्य’ स्रोत के एकवचन पुल्लिंग रूप और नीतिवचन की संक्षिप्त शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְגָרֶה
  choice: भड़काता है
  rationale: גרה के पिएल रूप में उकसाने या भड़का देने का भाव है। ‘भड़काता है’ कलह को सक्रिय रूप से बढ़ाने का सजीव और सहज अर्थ देता है।
- source_word: מָדוֹן
  choice: कलह
  rationale: यह शब्द विवाद, फूट और आपसी संघर्ष को सूचित करता है। ‘कलह’ नीतिवचन की गरिमापूर्ण शैली में संक्षिप्त तथा व्यापक है।
- source_word: אֶרֶך אַפַּיִם
  choice: जो क्रोध करने में धीमा है
  rationale: यह इब्रानी मुहावरा क्रोध में देर करने और संयम रखनेवाले व्यक्ति को दर्शाता है। चुना हुआ रूप इसके क्रोध-संबंधी अर्थ को स्पष्ट रखता है और केवल सामान्य ‘धैर्यवान’ कहकर अर्थ को व्यापक नहीं बनाता।
- source_word: יַשְׁקִיט
  choice: शांत कर देता है
  rationale: שקט का हिफ़ील रूप किसी चीज़ को शांत या स्थिर करने का कारक भाव रखता है। ‘शांत कर देता है’ आधुनिक हिन्दी में इस कारक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רִיב
  choice: झगड़ा
  rationale: यह शब्द झगड़े, विवाद या कभी-कभी कानूनी मुकदमे को भी सूचित कर सकता है। यहाँ समानांतर पंक्ति के आपसी कलह के संदर्भ में ‘झगड़ा’ सहज है और अनावश्यक कानूनी अर्थ नहीं जोड़ता।
theological_decisions: []
