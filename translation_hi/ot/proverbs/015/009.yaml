source:
  edition: WLC
  text: תּוֹעֲבַ֣ת יְ֭הוָה דֶּ֣רֶךְ רָשָׁ֑ע וּ/מְרַדֵּ֖ף צְדָקָ֣ה יֶאֱהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/009.yaml
  text: The way of the wicked is an abomination to Yahweh[b][a], but he loves the one who pursues righteousness.
translation:
  language: hi
  text: 'दुष्ट का मार्ग यहोवा को घृणित है,

    पर वह उस व्यक्ति से प्रेम करता है जो धार्मिकता की खोज करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: घृणित
  rationale: यह शब्द किसी ऐसी वस्तु या आचरण को दर्शाता है जिससे तीव्र नैतिक घृणा होती है। हिंदी में विशेषणात्मक वाक्य-विन्यास स्वाभाविक रहते हुए मूल संज्ञात्मक अभिव्यक्ति की प्रबलता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का निजी नाम है; हिंदी बाइबल परंपरा में प्रचलित रूप ‘यहोवा’ शीर्षक से बदलने के बजाय उस नाम को सुरक्षित रखता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: नीतिवचन में यह जीवन-चाल और आचरण का रूपक है। ‘मार्ग’ इस प्रमुख ज्ञान-साहित्यिक बिंब को बनाए रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन रूप यहाँ प्रतिनिधिक और सामान्य अर्थ रखता है। ‘दुष्ट’ लिंग-विशेष की अनावश्यक सीमा लगाए बिना उस व्यक्ति को व्यक्त करता है जिसका आचरण बुरा है।
- source_word: מְרַדֵּף
  choice: जो ... पीछा करता है
  rationale: पिएल कृदंत निरंतर और सक्रिय खोज का भाव देता है। यह वाक्यांश हिंदी में उस चरित्रगत लगन को स्पष्ट रूप से व्यक्त करता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यहाँ शब्द नैतिक खराई और उचित आचरण की व्यापक धारणा रखता है। ‘धार्मिकता’ इस विस्तार को बचाती है; केवल ‘न्याय’ अर्थ को संकरा कर सकता है।
- source_word: יֶאֱהָב
  choice: प्रेम करता है
  rationale: अपूर्ण क्रिया यहाँ भविष्यकाल नहीं, सार्वकालिक नीतिवचन-सत्य व्यक्त करती है; इसलिए हिंदी का सामान्य वर्तमानकाल उपयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरी निजी नाम है। हिंदी पाठकों में स्थापित नामरूप ‘यहोवा’ इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: רָשָׁע और מְרַדֵּף के व्याकरणिक पुल्लिंग एकवचन का सामान्य आशय
  choice: दुष्ट / जो धार्मिकता का पीछा करता है
  alternative: दुष्ट पुरुष / वह पुरुष जो धार्मिकता का पीछा करता है
  rationale: हिब्रू के पुल्लिंग एकवचन रूप प्रतिनिधिक हैं और केवल पुरुषों तक सीमित नहीं हैं। हिंदी रूप सामान्य व्यक्ति का आशय बनाए रखते हैं।
- issue: צְדָקָה का नैतिक अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस प्रसंग में शब्द उचित नैतिक जीवन की व्यापक धारणा दे सकता है, यद्यपि ‘न्याय’ भी संभावित अर्थ है। व्यापक और पारंपरिक अर्थ को मुख्य पाठ में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली। दोनों अर्ध-पंक्तियों का विरोध स्पष्ट रखा गया है। ‘पीछा करता है’ मूल की सक्रिय, निरंतर खोज का बिंब सुरक्षित रखता है।
