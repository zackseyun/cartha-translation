    reason: lexical_alternative
lexical_decisions:
- source_word: הָפֵר
  choice: विफल हो जाती हैं
  rationale: हिफ़ील रूप योजनाओं के टूटने या निष्फल किए जाने का भाव देता है; हिन्दी में योजनाओं के साथ ‘विफल हो जाती हैं’ स्वाभाविक रूप से परिणाम व्यक्त करता है।
- source_word: מַחֲשָׁבוֹת
  choice: योजनाएँ
  rationale: यहाँ सलाहकारों और योजना के कायम होने के संदर्भ में शब्द केवल विचारों के बजाय सोची-समझी योजनाओं या उद्देश्यों को दर्शाता है।
- source_word: בְּאֵין
  choice: न होने पर
  rationale: यह अभाव और उसके परिणाम, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: סוֹד
  choice: सलाह-मशविरा
  rationale: סוֹד गोपनीय विचार-विमर्श, परिषद या अंतरंग परामर्श को सूचित कर सकता है; अनेक सलाहकारों से समानांतरता के कारण यहाँ विचार-विमर्शयुक्त परामर्श अभिप्रेत है।
- source_word: וּבְרֹב
  choice: पर बहुत-से ... के होने पर
  rationale: संयोजक पहले चरण के साथ विरोध दिखाता है और רֹב बहुलता व्यक्त करता है।
- source_word: יוֹעֲצִים
  choice: सलाहकारों
  rationale: यह יעץ का सक्रिय कृदन्त है और सलाह देने वाले लोगों को दर्शाता है; ‘सलाहकार’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: תָּקוּם
  choice: वे सफल होती हैं
  rationale: קום का मूल भाव खड़े रहने या स्थापित होने का है। योजनाओं के संदर्भ में ‘सफल होती हैं’ उनके फलित और कायम होने का सहज हिन्दी परिणामार्थ देता है; अधिक रूपात्मक विकल्प पादटिप्पणी में रखा गया है।
