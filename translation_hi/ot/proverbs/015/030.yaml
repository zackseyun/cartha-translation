  edition: WLC
  text: מְֽאוֹר עֵ֭ינַיִם יְשַׂמַּֽח לֵ֑ב שְׁמוּעָ֥ה ט֝וֹבָ֗ה תְּדַשֶּׁן עָֽצֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/030.yaml
  text: The light of the eyes gladdens the heart[b][a]; good news fattens the bones.
translation:
  language: hi
  text: 'आँखों की चमक[a] हृदय को आनन्दित करती है;

    अच्छा समाचार हड्डियों को पुष्ट करता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आँखों का प्रकाश’; अर्थात उजली, प्रसन्न या चमकती हुई दृष्टि।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: ‘हड्डी को मोटा करता है।’ यह गहरी शारीरिक स्फूर्ति, पोषण या ताज़गी का मुहावरा है।'
    reason: cultural_note
lexical_decisions:
- source_word: מְאוֹר עֵינַיִם
  choice: आँखों की चमक
  rationale: यह पदबंध शाब्दिक रूप से ‘आँखों का प्रकाश’ है और किसी उजली, प्रसन्न दृष्टि या मुखभाव की ओर भी संकेत कर सकता है। ‘आँखों की चमक’ मूल बिंब और उसकी स्वाभाविक हिन्दी अभिव्यक्ति—दोनों को बनाए रखती है।
- source_word: יְשַׂמַּח
  choice: आनन्दित करती है
  rationale: पिएल रूप का कारणवाचक भाव है—प्रसन्न करना या आनन्द देना। यह चयन उस भाव को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֵב
  choice: हृदय
  rationale: हिब्रू में यह मनुष्य के भीतरी व्यक्तित्व का संकेत देता है। ‘हृदय’ पारंपरिक बिंब को सुरक्षित रखते हुए हिन्दी में स्वाभाविक है।
- source_word: שְׁמוּעָה טוֹבָה
  choice: अच्छा समाचार
  rationale: שְׁמוּעָה का अर्थ सुनी हुई खबर या समाचार है और טוֹבָה उसे अच्छा या अनुकूल बताता है। ‘अच्छा समाचार’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: תְּדַשֶּׁן
  choice: हृष्ट-पुष्ट करता है
  rationale: क्रिया का मूल चित्र ‘मोटा/समृद्ध करना’ है, जो यहाँ गहरी शारीरिक स्फूर्ति और पोषण का रूपक है। ‘हृष्ट-पुष्ट करता है’ उस फलित अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक चित्र सुरक्षित रखती है।
- source_word: עָצֶם
  choice: हड्डियों
  rationale: मूल में एकवचन रूप सामूहिक अर्थ में प्रयुक्त है। हिन्दी में ‘हड्डियों’ कहना पूरे शरीर की भीतरी शक्ति के बिंब को स्वाभाविक रूप से बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर काव्य-पंक्तियाँ सुरक्षित हैं; ‘आँखों की चमक’ और ‘हड्डियों’ के ठोस शारीरिक बिंबों को अत्यधिक व्याख्यात्मक बनाए बिना प्रस्तुत किया गया है।
