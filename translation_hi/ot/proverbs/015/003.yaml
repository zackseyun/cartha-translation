id: PRO.15.3
reference: Proverbs 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּֽ/כָל מָ֭קוֹם עֵינֵ֣י יְהוָ֑ה צֹ֝פ֗וֹת רָעִ֥ים ו/טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/015/003.yaml
  text: In every place the eyes of Yahweh watch over the evil and the good[a].
translation:
  language: hi
  text: हर स्थान में याहवे[a] की आँखें बुरे और भले लोगों को देखती रहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक निरूपण की जानकारी।
lexical_decisions:
- source_word: בְּכָל מָקוֹם
  choice: हर स्थान में
  rationale: यह इब्रानी के वितरणात्मक अर्थ ‘प्रत्येक स्थान में’ को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: עֵינֵי יְהוָה
  choice: याहवे की आँखें
  rationale: यह संबंधसूचक रचना और परमेश्वर की आँखों के मानव-सदृश बिंब—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए चतुरक्षरीय व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: צֹפוֹת
  choice: देखती रहती हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत निरंतर निरीक्षण का भाव देता है। ‘देखती रहती हैं’ इस जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से रक्षा करने का अर्थ नहीं जोड़ता।
- source_word: רָעִים וְטוֹבִים
  choice: बुरे और भले लोगों को
  rationale: दोनों विशेषण यहाँ संज्ञा के समान मनुष्यों के लिए प्रयुक्त हैं। ‘लोगों’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि बुरे और भले का संतुलित विरोध बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में व्यक्तिगत वाचा-नाम YHWH सीधे प्रयुक्त हुआ है। ‘याहवे’ नाम को सुरक्षित रखता है; पारंपरिक उपाधि ‘प्रभु’ को पादटिप्पणी में बताया गया है।
- issue: צֹפוֹת में निरीक्षण या संरक्षण का भाव
  choice: देखती रहती हैं
  alternative: निगरानी रखती हैं
  rationale: इस प्रसंग में क्रिया मुख्यतः सर्वव्यापी अवलोकन बताती है। ऐसा अनुवाद चुना गया है जो दुष्ट और भले दोनों पर समान रूप से लागू हो और संरक्षण का अतिरिक्त अर्थ न थोपे।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आँखें’ का मूल मानवीकरण सुरक्षित है और ‘देखती रहती हैं’ निरंतर निरीक्षण को सामान्य पाठक के लिए सहज ढंग से व्यक्त करता है।
