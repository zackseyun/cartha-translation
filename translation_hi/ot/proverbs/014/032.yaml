  yaml_path: translation/ot/proverbs/014/032.yaml
  text: By his evil the wicked is driven away[c][b][a], but the righteous finds refuge in his death.
translation:
  language: hi
  text: दुष्ट अपनी बुराई के कारण धकेल दिया जाता है[a], पर धर्मी अपनी मृत्यु में शरण पाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट अपनी विपत्ति में धकेल दिया जाता है।” यहाँ “बुराई” के हिब्रू शब्द का अर्थ “विपत्ति” या “आपदा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी मृत्यु में”; इसका अर्थ “अपनी मृत्यु के समय” या “जब वह मरता है” भी हो सकता है। कुछ अनुवाद इसे “अपनी मृत्यु के समय आशा रखता है” कहते हैं, पर हिब्रू में “आशा” शब्द स्पष्ट रूप से नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרָעָתוֹ
  choice: अपनी बुराई के कारण
  rationale: רָעָה नैतिक बुराई या विपत्ति—दोनों अर्थ दे सकता है। רָשָׁע के साथ नैतिक विरोध के कारण मुख्य पाठ में ‘बुराई’ लिया गया है; בְּ को कारणसूचक समझा गया है।
- source_word: יִדָּחֶה
  choice: गिरा दिया जाता है
  rationale: निफ़अल रूप निष्क्रिय भाव में धकेले जाने, हटा दिए जाने या पतन का संकेत देता है। ‘गिरा दिया जाता है’ दुष्ट के विनाश को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘धकेल दिया जाता है’ भी संभव है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त होकर नीतिवचन के एक प्रतिनिधि व्यक्ति को दर्शाता है; हिन्दी में ‘दुष्ट’ स्वाभाविक और संक्षिप्त है।
- source_word: וְחֹסֶה
  choice: शरण पाता है
  rationale: חסה शरण लेने या पाने का भाव देता है। यहाँ कर्म का स्पष्ट उल्लेख न होने और परिणामपरक विरोध के कारण ‘शरण पाता है’ उपयुक्त है।
- source_word: בְּמוֹתוֹ
  choice: अपनी मृत्यु में
  rationale: यह हिब्रू की संक्षिप्त रचना का निकट रूप है और मृत्यु के समय अथवा मृत्यु के भीतर सुरक्षा—दोनों संभावनाओं को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: संज्ञावत् प्रयुक्त विशेषण धर्मी व्यक्ति को नीतिवचन की प्रतिनिधि श्रेणी के रूप में दर्शाता है।
theological_decisions:
- issue: क्या पद मृत्यु के पार आशा सिखाता है या मृत्यु के समय सुरक्षा
  choice: ‘अपनी मृत्यु में शरण पाता है’ कहकर अस्पष्टता बनाए रखी गई है।
  alternative: ‘अपनी मृत्यु के समय आशा रखता है’ अथवा ‘मरते समय सुरक्षित रहता है।’
  rationale: हिब्रू में ‘आशा’ का कोई स्पष्ट शब्द नहीं है और शरण का स्वरूप भी परिभाषित नहीं किया गया। इसलिए मुख्य पाठ में परलोक संबंधी निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। ‘धर्मी’ और ‘दुष्ट’ सामान्य बाइबलीय शब्दावली हैं। मुख्य पाठ में स्रोत की मृत्यु-संबंधी धार्मिक अस्पष्टता सुरक्षित रखी गई है।
