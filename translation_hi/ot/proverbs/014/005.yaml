  yaml_path: translation/ot/proverbs/014/005.yaml
  text: A faithful witness does not lie[a], but a false witness breathes out lies.
translation:
  language: hi
  text: 'विश्वासयोग्य साक्षी झूठ नहीं बोलता,

    पर झूठा साक्षी झूठ उगलता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झूठी बातें निकालता है।” हिब्रू क्रिया में झूठी गवाही को साँस के साथ बाहर निकालने या उँडेलने का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד אֱמוּנִים
  choice: विश्वासयोग्य साक्षी
  rationale: אֱמוּנִים यहाँ साक्षी की विश्वसनीयता और निष्ठा बताता है। ‘विश्वासयोग्य’ आधुनिक हिन्दी में इस नैतिक गुण को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לֹא יְכַזֵּב
  choice: झूठ नहीं बोलता
  rationale: साक्ष्य देने के संदर्भ में כזב के पिएल रूप का आशय असत्य बोलना है; ‘झूठ नहीं बोलता’ सीधा और सहज अनुवाद है।
- source_word: וְיָפִיחַ
  choice: पर ... उगलता है
  rationale: וְ को दोनों पंक्तियों के विरोध के कारण ‘पर’ किया गया है। פוח के हिफ़ील रूप में बाहर निकालने या फूँककर प्रकट करने का सजीव बिंब है; ‘उगलता है’ लगातार और निर्बाध रूप से झूठ निकालने की छवि बनाए रखता है।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: हिब्रू बहुवचन अनेक असत्य कथनों का संकेत देता है। हिन्दी में ‘झूठ’ सामूहिक अर्थ में स्वाभाविक है और ‘झूठ उगलता है’ के साथ मुहावरेदार बैठता है।
- source_word: עֵד שָׁקֶר
  choice: झूठा साक्षी
  rationale: यह साक्षी की गवाही के झूठे होने अथवा उसके झूठ बोलने वाले चरित्र को व्यक्त करने वाला मानक पदबंध है; ‘झूठा साक्षी’ हिन्दी में संक्षिप्त और परिचित है।
