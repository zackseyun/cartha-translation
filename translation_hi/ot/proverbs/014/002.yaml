base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/002.yaml
  text: Whoever walks in uprightness fears Yahweh[b][a], but the one whose ways are crooked despises him.
translation:
  language: hi
  text: जो खराई से चलता है, वह याहवे का भय मानता है; पर जो अपने मार्गों में टेढ़ा है[a], वह उसे[b] तुच्छ जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर जो अपने मार्गों में कुटिल है”; इब्रानी शब्द आचरण में मुड़े या टेढ़े व्यक्ति का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसे’ का सबसे स्वाभाविक संदर्भ याहवे से है; कुछ लोग इसे अधिक सामान्य अर्थ में भी लेते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹלֵךְ
  choice: चलता है
  rationale: नीतिवचन के ज्ञान-साहित्य में यह क्रिया प्रायः जीवन-चाल या आचरण का रूपक है; ‘चलता है’ मूल बिंब को बनाए रखते हुए हिन्दी में सहज है।
- source_word: בְּיָשְׁרוֹ
  choice: अपनी खराई में
  rationale: यह पद नैतिक सीधेपन, निष्कपटता और खराई को व्यक्त करता है। ‘अपनी’ मूल के पुरुषवाचक प्रत्यय को सुरक्षित रखता है।
- source_word: יְרֵא יְהוָה
  choice: याहवे का भय मानता है
  rationale: यह नीतिवचन में स्थापित धार्मिक-नैतिक अभिव्यक्ति है। ‘भय मानता है’ श्रद्धा और उत्तरदायित्व दोनों की गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के रूप में चतुरक्षरी नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: וּנְלוֹז
  choice: पर जो ... टेढ़ा है
  rationale: नָלוֹז मुड़े, विकृत या कुटिल आचरण का बोध कराता है। ‘टेढ़ा’ अगले पद ‘मार्गों’ के ठोस रूपक के साथ स्वाभाविक बैठता है।
- source_word: דְּרָכָיו
  choice: अपने मार्गों में
  rationale: बहुवचन ‘मार्ग’ किसी व्यक्ति के आचरण और जीवन-पद्धतियों को सूचित करता है तथा मूल रूपक को बनाए रखता है।
- source_word: בּוֹזֵהוּ
  choice: वह उसे तुच्छ जानता है
  rationale: क्रिया का अर्थ तिरस्कार या अवमानना करना है। पुल्लिंग एकवचन प्रत्यय को ‘उसे’ से व्यक्त किया गया है; उसका सबसे स्वाभाविक पूर्वपद याहवे है।
theological_decisions:
- issue: בּוֹזֵהוּ में पुरुषवाचक प्रत्यय का संदर्भ
  choice: ‘उसे’ का संदर्भ याहवे से है।
  alternative: इसे सामान्य रूप से खरे व्यक्ति अथवा नैतिक व्यवस्था के संदर्भ में लिया जा सकता है।
  rationale: वचन की विरोधात्मक समानांतर रचना ‘याहवे का भय मानने’ के विपरीत ‘उसे तुच्छ जानने’ को रखती है; निकटतम और सबसे सुसंगत पूर्वपद याहवे है। फिर भी सर्वनाम में निहित संभावित अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और लोकोपयोगी शैली रखी गई है। ‘चलना’, ‘खराई’ और ‘मार्ग’ जैसे मूल ज्ञान-साहित्यिक बिंब सुरक्षित हैं; कठिन किंतु महत्त्वपूर्ण सर्वनाम-संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
