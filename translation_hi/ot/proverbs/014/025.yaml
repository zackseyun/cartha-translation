source:
  edition: WLC
  text: מַצִּ֣יל נְ֭פָשׁוֹת עֵ֣ד אֱמֶ֑ת וְ/יָפִ֖חַ כְּזָבִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/025.yaml
  text: A truthful witness rescues lives[c][b][a], but one who breathes out lies is deceitful.
translation:
  language: hi
  text: सच्चा गवाह लोगों की जान बचाता है,[a] पर झूठ उगलने वाला कपटी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्राणों को छुड़ाता है।” यहाँ इब्रानी शब्द का अर्थ व्यक्ति या उसका जीवन है, केवल देह से अलग आत्मा नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का शाब्दिक अर्थ “फूँकना” या “साँस से बाहर निकालना” है और यहाँ झूठ बोलने की सजीव छवि के लिए प्रयुक्त है। अंतिम पद अधिक शाब्दिक रूप से “झूठ उगलने वाला छल है” भी हो सकता है, अथवा इसका अर्थ “छल से झूठ उगलता है” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: बचाता है
  rationale: हिफ़ील कृदन्त किसी को संकट से छुड़ाने या बचाने का भाव देता है। यहाँ यह सहज आधुनिक हिन्दी है और अनावश्यक रूप से पारिभाषिक धार्मिक अर्थ नहीं जोड़ता।
- source_word: נְפָשׁוֹת
  choice: लोगों की जान
  rationale: यहाँ נֶפֶשׁ का बहुवचन अमूर्त या देह से अलग ‘आत्माओं’ के बजाय व्यक्तियों अथवा उनके जीवन को सूचित करता है। ‘लोगों की जान’ हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵד אֱמֶת
  choice: सच्चा गवाह
  rationale: यह पद ऐसे गवाह को दर्शाता है जिसकी गवाही सत्य है। ‘सच्चा गवाह’ संक्षिप्त, स्वाभाविक और नैतिक विश्वसनीयता को स्पष्ट करने वाला अनुवाद है।
- source_word: וְיָפִחַ
  choice: पर ... उगलने वाला
  rationale: פוח मूलतः साँस छोड़ने या बाहर फूँकने की सजीव छवि रखता है और यहाँ बोलने के लिए प्रयुक्त है। हिन्दी का ‘झूठ उगलना’ उस तीव्र वाणी-चित्र को स्वाभाविक ढंग से बनाए रखता है। संयोजक को विरोधसूचक ‘पर’ किया गया है, क्योंकि दोनों प्रकार के गवाहों का स्पष्ट विरोध है।
- source_word: כְּזָבִים
  choice: झूठ
  rationale: बहुवचन संज्ञा झूठी बातों को दर्शाती है; हिन्दी में सामूहिक अर्थ वाला ‘झूठ’ सर्वाधिक स्वाभाविक है।
- source_word: מִרְמָה
  choice: छल करता है
  rationale: पद के अंत की संज्ञा ‘छल’ वाक्य से ढीले ढंग से जुड़ी है और छलपूर्ण आचरण या ढंग को सूचित कर सकती है। ‘छल करता है’ सहज हिन्दी में उस अर्थ को व्यक्त करता है, जबकि वैकल्पिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נְפָשׁוֹת को ‘आत्माएँ’ समझने की सम्भावना
  choice: लोगों की जान
  alternative: प्राणों/व्यक्तियों को बचाता है
  rationale: संदर्भ न्यायिक या सामाजिक गवाही द्वारा व्यक्तियों को हानि से छुड़ाने का है; पाठ देह से पृथक आत्मा की कोई विशिष्ट धारणा नहीं सिखाता।
- issue: מִרְמָה का वाक्यगत सम्बन्ध
  choice: झूठ बोलने वाले के छलपूर्ण कार्य के रूप में ‘छल करता है’
  alternative: ‘छल है’ अथवा ‘छल से झूठ उगलता है’
  rationale: हिब्रू का संक्षिप्त संज्ञात्मक अंत एक से अधिक वाक्यगत समझ की अनुमति देता है। मुख्य पाठ सहज अर्थ देता है और वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्मरणीय नीतिवचन-शैली रखी गई है। ‘झूठ उगलना’ मूल की साँस छोड़ने वाली सजीव छवि का स्वाभाविक हिन्दी समतुल्य है। ‘जान’ बोलचाल में बोधगम्य है, जबकि ‘सच्चा गवाह’ गरिमामय और न्यायिक संदर्भ के अनुकूल है।
