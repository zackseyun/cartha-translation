base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/027.yaml
  text: The fear of Yahweh is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: hi
  text: याहवे का भय जीवन का सोता है[a], जो मृत्यु के फंदों से दूर करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवन का झरना।”
    reason: lexical_alternative
  - marker: b
    text: या, “मृत्यु के फंदों से दूर होने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת
  choice: भय
  rationale: नीतिवचन के प्रमुख ज्ञान-विषय को बनाए रखता है; इसमें श्रद्धा, विस्मय और परमेश्वर के प्रति आज्ञाकारी भाव समाहित हैं, पर इसे केवल ‘श्रद्धा’ तक सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מְקוֹר
  choice: सोता
  rationale: जीवन देने वाले जल-स्रोत का सजीव रूपक बनाए रखता है; ‘झरना’ निकट अर्थ वाला विकल्प है।
- source_word: חַיִּים
  choice: जीवन
  rationale: इब्रानी में रूप बहुवचन है, पर यहाँ अमूर्त अर्थ में सामान्यतः एकवचन ‘जीवन’ व्यक्त करता है।
- source_word: לָסוּר
  choice: ताकि ... दूर रहा जाए
  rationale: ל सहित क्रियार्थक रूप के प्रयोजन अथवा परिणाम के भाव को व्यक्त करता है और दूर होने वाले व्यक्ति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: מִמֹּקְשֵׁי
  choice: फंदों से
  rationale: छिपे हुए घातक जाल या फंदों का रूपक स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: शब्द के प्रत्यक्ष अर्थ के साथ नीतिवचन में निहित व्यापक विनाशकारी अर्थ की संभावना भी खुली रखता है।
theological_decisions:
- issue: ‘याहवे का भय’ का अर्थ
  choice: ‘भय’ को बनाए रखा गया।
  alternative: ‘याहवे के प्रति श्रद्धा’
  rationale: मूल पद में भय, श्रद्धापूर्ण विस्मय और आज्ञाकारी मुद्रा का तनाव है; केवल ‘श्रद्धा’ कहने से अर्थ नरम और संकरा हो सकता है।
- issue: לָסוּר के प्रयोजन अथवा परिणाम का संबंध
  choice: ‘ताकि मृत्यु के फंदों से दूर रहा जाए’
  alternative: ‘जो मृत्यु के फंदों से दूर करता है’
  rationale: मुख्य पाठ इब्रानी क्रियार्थक रचना और उसके अनिर्दिष्ट कर्ता को सुरक्षित रखता है; वैकल्पिक अनुवाद परिणाम के भाव को अधिक स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘सोता’ जल-स्रोत के मूल रूपक को बनाए रखता है, और निष्क्रिय ‘दूर रहा जाए’ मूल में व्यक्ति के अनिर्दिष्ट रहने तथा प्रयोजन/परिणाम की अस्पष्टता को यथासंभव सुरक्षित रखता है।
