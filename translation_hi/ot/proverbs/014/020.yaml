base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/020.yaml
  text: A poor person is hated even by his neighbor[a], but those who love the rich are many.
translation:
  language: hi
  text: 'निर्धन व्यक्ति से उसका पड़ोसी[a] भी घृणा करता है,

    पर धनवान से प्रेम करनेवाले बहुत हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मित्र” अथवा “साथी”; इब्रानी शब्द के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: 'यह निपात बात को तीखा बनाता है: निर्धन व्यक्ति को उसके अपने पड़ोसी तक से घृणा मिलती है।'
- source_word: לְרֵעֵהוּ
  choice: उसका पड़ोसी
  rationale: רֵעַ का व्यापक अर्थ ‘पड़ोसी’ है; ‘मित्र’ और ‘साथी’ भी संभव हैं, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: יִשָּׂנֵא
  choice: से ... घृणा करता है
  rationale: इब्रानी क्रिया निफ़अल में कर्मवाच्य है, अर्थात निर्धन व्यक्ति घृणा का पात्र है। स्वाभाविक हिन्दी सक्रिय रचना से उसी अर्थ को व्यक्त करती है और कर्ता-कर्म का उलटाव नहीं करती।
- source_word: רָשׁ
  choice: निर्धन व्यक्ति
  rationale: यह संज्ञा आर्थिक रूप से अभावग्रस्त व्यक्ति को दर्शाती है; ‘निर्धन व्यक्ति’ आधुनिक, सम्मानपूर्ण और सामान्य अर्थ वाला प्रयोग है।
- source_word: וְאֹהֲבֵי
  choice: पर ... से प्रेम करनेवाले
  rationale: कृदंत का क्रियात्मक बल बनाए रखा गया है और पहले खंड की ‘घृणा’ के साथ विरोध स्पष्ट किया गया है।
- source_word: עָשִׁיר
  choice: धनवान
  rationale: यह एक संपन्न व्यक्ति को सामान्य नीतिवचनात्मक रूप में दर्शाता है।
- source_word: רַבִּים
  choice: बहुत हैं
  rationale: यह बहुलता का सीधा और स्वाभाविक हिन्दी कथन है।
