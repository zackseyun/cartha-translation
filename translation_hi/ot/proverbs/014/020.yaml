  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन शैली रखी गई है। पहले खंड के इब्रानी कर्मवाच्य को स्वाभाविक हिन्दी सक्रिय वाक्य-विन्यास में व्यक्त किया गया है, पर अर्थ और भूमिकाएँ यथावत हैं।
