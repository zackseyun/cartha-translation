  yaml_path: translation/ot/proverbs/014/006.yaml
  text: A scoffer seeks wisdom and there is none[b][a], but knowledge comes easily to one who has understanding.
translation:
  language: hi
  text: ठट्ठा करने वाला बुद्धि खोजता है, और वह नहीं मिलती[a]; पर समझदार के लिए ज्ञान सहज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और नहीं है”; अर्थात् वह उसे नहीं पाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּקֶּשׁ
  choice: खोजता है
  rationale: नीतिवचन की सामान्य सत्य बताने वाली शैली में हिब्रू पूर्ण रूप वर्तमानकालीन आदतन क्रिया व्यक्त करता है।
- source_word: לֵץ
  choice: ठट्ठा करने वाला
  rationale: यह शब्द उस व्यक्ति को दर्शाता है जो घमंड से बुद्धि और सुधार का उपहास करता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह व्यावहारिक और नैतिक रूप से सही समझ का मानक हिन्दी पद है।
- source_word: וָאָיִן
  choice: पर वह उसे नहीं मिलती
  rationale: हिब्रू का शाब्दिक अर्थ ‘और नहीं है’ है; हिन्दी में यह संदर्भगत परिणाम को स्वाभाविक ढंग से व्यक्त करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וְדַעַת
  choice: ज्ञान
  rationale: यह केवल सूचना नहीं, बल्कि समझ से ग्रहण किए गए बोध को दर्शाता है और ‘बुद्धि’ के साथ नीतिवचन की शब्दावली बनाए रखता है।
- source_word: לְנָבוֹן
  choice: समझ रखने वाले के लिए
  rationale: हिब्रू पद विवेक या समझ से पहचाने जाने वाले व्यक्ति को दर्शाता है; हिन्दी में पुल्लिंग एकवचन रूप कहावत-सदृश प्रतिनिधिक प्रयोग को बनाए रखता है।
- source_word: נָקָל
  choice: सहज है
  rationale: यह विशेषण सरल या सुगम होने का भाव देता है और पहले खंड की निष्फल खोज के साथ स्पष्ट विरोध बनाता है।
theological_decisions:
- issue: ज्ञान की उपलब्धता और व्यक्ति का नैतिक-विवेकपूर्ण स्वभाव
  choice: समझ रखने वाले के लिए ज्ञान सहज है
  alternative: समझदार मनुष्य को ज्ञान आसानी से मिलता है
  rationale: मुख्य पाठ ज्ञान के ‘सहज’ होने का हिब्रू विधान बनाए रखता है; यह ऐसा कोई अतिरिक्त सिद्धान्त नहीं जोड़ता कि ज्ञान स्वतः आता है या बिना प्रयास के प्राप्त होता है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: समझ रखने वाले के लिए
  alternative: समझदार मनुष्य के लिए
  rationale: हिब्रू का रूप व्याकरणतः पुल्लिंग एकवचन है, पर नीतिवचन में उसका प्रयोग ऐसे किसी भी व्यक्ति के लिए सामान्य है जिसमें समझ हो; हिन्दी अभिव्यक्ति इस व्यापक अर्थ को स्वाभाविक रूप से संप्रेषित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, कहावत-सदृश और गरिमापूर्ण शैली। ‘ठट्ठा करने वाला’ नैतिक उपहास का भाव रखता है, और ‘समझ रखने वाला’ सामान्य पाठक के लिए स्पष्ट रहते हुए हिब्रू के प्रतिनिधिक एकवचन को स्वाभाविक रूप देता है।
