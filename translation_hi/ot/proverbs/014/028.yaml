  yaml_path: translation/ot/proverbs/014/028.yaml
  text: In a multitude of people is a king’s splendor[a], but without people, a ruler’s ruin.
translation:
  language: hi
  text: 'बहुत-सी प्रजा राजा का वैभव है,

    पर प्रजा के अभाव में शासक का विनाश[a] होता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आतंक” अथवा “भय”; इब्रानी शब्द भय और विनाशकारी पतन—दोनों का भाव दे सकता है। यहाँ “विनाश” इसलिए रखा गया है कि यह बड़ी प्रजा से मिलने वाले राजा के वैभव के विपरीत, प्रजा-विहीन शासक के पतन को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרָב עָם
  choice: बहुत-से लोगों में
  rationale: בְּרָב संख्यात्मक बहुतायत और עָם जनसमुदाय को व्यक्त करता है। यह रूप इब्रानी की संक्षिप्त संरचना और भाव—राजा का वैभव बड़ी जनसंख्या में है—दोनों बनाए रखता है।
- source_word: הַדְרַת מֶלֶךְ
  choice: राजा का वैभव
  rationale: הֲדָר शोभा, गौरव या प्रताप का सूचक है; 'वैभव' राजकीय गरिमा और प्रकट समृद्धि, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְאֶפֶס לְאֹם
  choice: पर प्रजा के न होने में
  rationale: אֶפֶס यहाँ अभाव या न होने का भाव देता है, जबकि לְאֹם सामूहिक जनसमुदाय को दर्शाता है। 'प्रजा' राजनीतिक संदर्भ में राजा या शासक के अधीन लोगों का स्वाभाविक संकेत है और किसी आधुनिक राष्ट्र-राज्य का अनावश्यक भाव नहीं लाता।
- source_word: מְחִתַּת
  choice: विनाश
  rationale: यह संज्ञा भय/आतंक अथवा टूट पड़ने वाले विनाश को सूचित कर सकती है। समानांतर विरोध में 'वैभव' के सामने 'विनाश' शासक के पतन का अर्थ स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: רָזוֹן
  choice: शासक
  rationale: यह अधिकार रखने वाले व्यक्ति, प्रधान या शासक को दर्शाता है। 'शासक' व्यापक है और 'राजा' के साथ समानार्थी राजनीतिक समानांतर को बनाए रखता है।
