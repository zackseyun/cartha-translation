    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתִי
  choice: भोला मनुष्य
  rationale: नीतिवचन में यह शब्द कम बुद्धि वाले व्यक्ति से अधिक अनुभवहीन और आसानी से बहकाए जाने वाले व्यक्ति को दर्शाता है। ‘भोला मनुष्य’ इस भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יַאֲמִין
  choice: विश्वास कर लेता है
  rationale: यहाँ हिफ़ील रूप किसी बात को सच या भरोसे योग्य मान लेने का अर्थ देता है। ‘कर लेता है’ बिना परखे स्वीकार करने की प्रवृत्ति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לְכָל דָּבָר
  choice: हर बात
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’, ‘विषय’ या ‘वस्तु’ हो सकता है। इस प्रसंग में ‘हर बात’ व्यापक अर्थ और कही गई बात पर सहज विश्वास—दोनों को समेटता है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: עָרוּם
  choice: समझदार
  rationale: नीतिवचन के इस सकारात्मक ज्ञान-सन्दर्भ में यह शब्द विवेकी और सावधान व्यक्ति को दर्शाता है, न कि कपटी व्यक्ति को। ‘समझदार’ सामान्य पाठक के लिए स्वाभाविक और प्रशंसात्मक है।
- source_word: יָבִין
  choice: विचार करता है
  rationale: בין यहाँ व्यावहारिक समझ-बूझ और सावधानी से जाँचने का भाव रखता है। कदमों के साथ ‘विचार करता है’ स्वाभाविक हिन्दी है।
- source_word: לַאֲשֻׁרוֹ
  choice: अपने कदमों पर
  rationale: मूल संज्ञा कदम, चाल या जीवन की दिशा का ठोस बिम्ब देती है। ‘अपने कदमों’ से यह बिम्ब सुरक्षित रहता है और आचरण पर विचार करने का रूपक स्पष्ट होता है।
