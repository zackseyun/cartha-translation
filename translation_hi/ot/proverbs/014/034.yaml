  text: צְדָקָ֥ה תְרֽוֹמֵֽם גּ֑וֹי וְ/חֶ֖סֶד לְאֻמִּ֣ים חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/034.yaml
  text: Righteousness exalts a nation[a], but sin is a disgrace to peoples.
translation:
  language: hi
  text: 'धार्मिकता किसी राष्ट्र को ऊँचा उठाती है,

    पर पाप लोगों के लिए कलंक है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति का इब्रानी पाठ कठिन है। परंपरागत रूप से इसे इस अर्थ में समझा गया है कि पाप लोगों के लिए अपमान या कलंक है। वैकल्पिक रूप से, यहाँ ‘पाप’ अनूदित शब्द का अर्थ ‘कलंक’ किया जा सकता है, और उसके साथ आए इब्रानी शब्द को उसके दुर्लभ अर्थ ‘अपमान’ या ‘निन्दा’ में भी समझा गया है; उसका सामान्य अर्थ करुणा, निष्ठा या अटल प्रेम है।
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह शब्द नैतिक और सामाजिक रूप से सही आचरण तथा न्यायपूर्ण चरित्र का व्यापक भाव रखता है। ‘धार्मिकता’ नीतिवचन के इस नैतिक अर्थ को सुरक्षित रखती है; केवल ‘न्याय’ कहना इसके अर्थ को कुछ संकीर्ण कर देता।
- source_word: תְרוֹמֵם
  choice: ऊँचा उठाती है
  rationale: רום धातु ऊँचा करने या प्रतिष्ठित करने का भाव देती है। यह पदबंध ऊँचाई के मूल बिंब और राष्ट्र की प्रतिष्ठा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גּוֹי
  choice: राष्ट्र
  rationale: यहाँ शब्द किसी राजनीतिक या जातीय समुदाय के लिए सामान्य रूप से प्रयुक्त है, न कि विशेष रूप से गैर-इस्राएली लोगों के लिए।
- source_word: חֶסֶד ... חַטָּאת
  choice: पाप ... कलंक
  rationale: 'दूसरी पंक्ति का इब्रानी पाठ कठिन है। सामान्यतः सकारात्मक अर्थ रखने वाले חֶסֶד की यहाँ असामान्य भूमिका और חַטָּאת के कारण वाक्यरचना विवादित है। मुख्य पाठ पारंपरिक, प्रतिकूल समानांतर अर्थ को व्यक्त करता है: राष्ट्रों का पाप उनके लिए अपमान या कलंक बनता है।'
- source_word: לְאֻמִּים
  choice: लोगों के लिए
  rationale: बहुवचन को बनाए रखते हुए यह सामान्य जनसमुदायों का अर्थ सहज आधुनिक हिन्दी में देता है और पहली पंक्ति के एकवचन ‘राष्ट्र’ के साथ काव्यात्मक भिन्नता बनाए रखता है।
theological_decisions:
- issue: दूसरी पंक्ति וְחֶסֶד לְאֻמִּים חַטָּאת की व्याख्या
  choice: ‘पर पाप लोगों के लिए कलंक है’
  alternative: ‘पर लोगों के प्रति करुणा/निष्ठा पाप है’ अथवा ‘पर कलंक लोगों का पाप है’
  rationale: इब्रानी व्याकरण और शब्दार्थ यहाँ असामान्य तथा विवादित हैं। नीतिवचन की विरोधात्मक समानांतरता धार्मिकता से राष्ट्र की प्रतिष्ठा के विपरीत पाप से लोगों के अपमान का अर्थ दृढ़ता से सुझाती है। फिर भी पाठ की वास्तविक कठिनाई को फुटनोट में स्पष्ट रखा गया है, न कि किसी एक व्याख्या को निर्विवाद बताकर।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचा उठाती है’ मूल रूपक को बनाए रखता है; ‘कलंक’ सार्वजनिक अपमान का स्वाभाविक हिन्दी बोध देता है।
