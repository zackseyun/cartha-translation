  text: חַיֵּ֣י בְ֭שָׂרִים לֵ֣ב מַרְפֵּ֑א וּ/רְקַ֖ב עֲצָמ֣וֹת קִנְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/030.yaml
  text: A tranquil heart is life to the body[b][a], but jealousy is rottenness to the bones.
translation:
  language: hi
  text: शांत हृदय शरीर के लिए जीवन है[a], पर ईर्ष्या हड्डियों को सड़ा देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आरोग्यकारी हृदय शरीर के लिए जीवन है।” ‘शांत’ अनूदित इब्रानी शब्द का अधिक शाब्दिक संबंध चंगाई या स्वास्थ्य से है।
    reason: lexical_alternative
  - marker: b
    text: ‘ईर्ष्या’ के लिए ‘डाह’ भी हो सकता है। इब्रानी शब्द प्रसंग के अनुसार ईर्ष्या, डाह या जोश का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי
  choice: जीवन देता है
  rationale: חַיֵּי का मूल अर्थ ‘जीवन’ है। क्रियारहित इब्रानी कथन को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘जीवन देता है’ कहा गया है।
- source_word: בְשָׂרִים
  choice: शरीर
  rationale: शाब्दिक अर्थ ‘मांस’ है, पर इस ज्ञान-साहित्यिक संदर्भ में यह पूरे शारीरिक अस्तित्व को सूचित करता है; आधुनिक हिन्दी में ‘शरीर’ अधिक स्पष्ट है।
- source_word: לֵב
  choice: हृदय
  rationale: यह मनुष्य की भीतरी प्रवृत्ति और भावनात्मक केंद्र का रूपक है; ‘हृदय’ उस बिंब को बनाए रखता है।
- source_word: מַרְפֵּא
  choice: शांत
  rationale: यह शब्द मूलतः चंगाई, आरोग्य या स्वास्थ्य से जुड़ा है। संदर्भ में यह स्वस्थ और शांत भीतरी अवस्था का संकेत देता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּרְקַב
  choice: पर ... सड़ा देती है
  rationale: וְ को दोनों पंक्तियों के विरोध के कारण ‘पर’ कहा गया है। רֶקֶב के क्षय/सड़न के सजीव बिंब को हिन्दी की स्वाभाविक क्रियात्मक अभिव्यक्ति में रखा गया है।
- source_word: עֲצָמוֹת
  choice: हड्डियों
  rationale: मूल का ठोस शारीरिक बिंब ज्यों का त्यों रखा गया है; यह शरीर के गहरे ढाँचे और आंतरिक जीवनी-शक्ति की ओर संकेत कर सकता है।
- source_word: קִנְאָה
  choice: ईर्ष्या
  rationale: यह शब्द प्रसंगानुसार ईर्ष्या, जलन या उत्साह/जोश सूचित कर सकता है। यहाँ हानिकारक समानांतरता नकारात्मक अर्थ ‘ईर्ष्या’ का समर्थन करती है।
