  text: הֲֽ/לוֹא יִ֭תְעוּ חֹ֣רְשֵׁי רָ֑ע וְ/חֶ֥סֶד וֶ֝/אֱמֶ֗ת חֹ֣רְשֵׁי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/022.yaml
  text: Will not those who devise evil go astray? But steadfast love and faithfulness belong to those who devise good[a].
translation:
  language: hi
  text: क्या बुराई की योजना बनाने वाले भटक नहीं जाते? पर भलाई की योजना बनाने वालों के लिए अटल प्रेम और निष्ठा[a] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दयालुता और सत्य,’ अथवा ‘करुणा और विश्वासयोग्यता।’ इब्रानी शब्द-युग्म प्रायः निष्ठावान प्रेम के साथ विश्वसनीयता या सत्यता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है जिसका अपेक्षित उत्तर ‘हाँ’ है; हिंदी में ‘क्या ... नहीं’ उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: יִתְעוּ
  choice: भटक जाते
  rationale: क्रिया सही मार्ग से भटकने या चूकने का भाव देती है और नीतिवचन के नैतिक मार्ग-रूपक को सुरक्षित रखती है।
- source_word: חֹרְשֵׁי רָע
  choice: बुराई की योजना बनानेवाले
  rationale: חרשׁ का कृदंत जान-बूझकर सोचने और योजना रचने का भाव रखता है; यह केवल बुराई करने की अपेक्षा अधिक सटीक है।
- source_word: רָע
  choice: बुराई
  rationale: यह טוֹב के विपरीत नैतिक अर्थ में प्रयुक्त है; ‘बुराई’ उस विरोध को स्पष्ट रखता है।
- source_word: חֶסֶד
  choice: अटल प्रेम
  rationale: חֶסֶד में स्थायी, निष्ठावान प्रेम और कृपा का भाव है; ‘अटल प्रेम’ इसकी दृढ़ता को व्यक्त करता है।
- source_word: אֱמֶת
  choice: सच्चाई
  rationale: חֶסֶד के साथ यह सत्यता, विश्वसनीयता या निष्ठा का भाव दे सकता है; ‘सच्चाई’ मूल शब्द की व्यापकता को बनाए रखता है, और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: חֹרְשֵׁי טוֹב
  choice: भलाई की योजना बनानेवाले
  rationale: पहले खंड के समान पद और रचना दोहराकर बुराई और भलाई की योजनाओं का जान-बूझकर रखा गया विरोध सुरक्षित रहता है।
- source_word: טוֹב
  choice: भलाई
  rationale: यह רָע के विपरीत संज्ञात्मक नैतिक अर्थ में है; हिंदी में ‘भलाई’ सहज और सममित है।
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת के बाद निहित विधेय का अर्थ
  choice: ‘भलाई की योजना बनानेवालों के लिए ... हैं’
  alternative: ‘भलाई की योजना बनानेवालों को ... मिलते हैं’ अथवा ‘भलाई की योजना बनानेवाले ... दिखाते हैं’
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है। ‘के लिए ... हैं’ संबंध को व्यक्त करता है, पर यह तय नहीं करता कि ये गुण उनमें पाए जाते हैं, उनके द्वारा दिखाए जाते हैं, या उन्हें प्राप्त होते हैं; इस प्रकार मूल की संक्षिप्तता और अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण ज्ञान-साहित्यिक स्वर रखा गया है। दोनों खंडों में ‘योजना बनानेवाले’ की पुनरावृत्ति इब्रानी समानांतरता को सुरक्षित रखती है।
