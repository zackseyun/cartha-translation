source:
  edition: WLC
  text: בְּ/כָל עֶ֭צֶב יִהְיֶ֣ה מוֹתָ֑ר וּ/דְבַר שְׂ֝פָתַ֗יִם אַךְ לְ/מַחְסֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/023.yaml
  text: In all labor there is profit[a], but mere talk leads only to lack.
translation:
  language: hi
  text: हर मेहनत में लाभ होता है, पर केवल बातें करने से अभाव[a] ही होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गरीबी।” इब्रानी शब्द का अर्थ अभाव, तंगी या गरीबी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/כָל
  choice: हर … में
  rationale: בְּ के साथ כָּל यहाँ एक सामान्य, नीतिवचनात्मक सिद्धांत बताता है; इसलिए आधुनिक हिन्दी में ‘हर … में’ स्वाभाविक है।
- source_word: עֶצֶב
  choice: मेहनत
  rationale: עֶצֶב कष्टसाध्य श्रम या परिश्रम को सूचित कर सकता है। यहाँ निष्फल बातों के विपरीत फलदायी काम का भाव है, इसलिए ‘मेहनत’ सहज और अर्थानुकूल है।
- source_word: יִהְיֶה
  choice: होता है
  rationale: नीतिवचन में अपूर्ण क्रिया सामान्य सत्य व्यक्त करती है; हिन्दी का सामान्य वर्तमान काल इसी भाव को स्वाभाविक रूप से देता है।
- source_word: מוֹתָר
  choice: लाभ
  rationale: מוֹתָר का मूल भाव बची हुई बढ़त, फायदा या लाभ है। श्रम के फल के संदर्भ में ‘लाभ’ संक्षिप्त और स्पष्ट है।
- source_word: וּ/דְבַר שְׂפָתַיִם
  choice: पर केवल बातें करने से
  rationale: शाब्दिक रूप से ‘होंठों की बात’ एक मुहावरा है जो ऐसे बोलने को दर्शाता है जिसके साथ काम न हो। विरोधसूचक ו को ‘पर’ और इस मुहावरे को सहज हिन्दी में ‘बातें करने’ के रूप में व्यक्त किया गया है।
- source_word: אַךְ
  choice: ही
  rationale: אַךְ परिणाम को सीमित करता है—ऐसी बातें अभाव के सिवा कुछ नहीं देतीं। हिन्दी में ‘ही’ इस विशेष बल को सुरक्षित रखता है।
- source_word: לְ/מַחְסוֹר
  choice: अभाव
  rationale: מַחְסוֹר कमी, तंगी या गरीबी को सूचित कर सकता है। ‘अभाव’ इसकी व्यापक अर्थ-सीमा को बनाए रखता है; अधिक तीव्र विकल्प ‘गरीबी’ को पादटिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक रूप अपनाया गया है। ‘होंठों की बात’ का कृत्रिम शाब्दिक अनुवाद न करके ‘बातें करने’ कहा गया है, जबकि ‘केवल/ही’ के द्वारा निष्फल वाणी पर मूल का जोर बनाए रखा गया है।
