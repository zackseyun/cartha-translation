source:
  edition: WLC
  text: חָכְמַ֣ת עָ֭רוּם הָבִ֣ין דַּרְכּ֑/וֹ וְ/אִוֶּ֖לֶת כְּסִילִ֣ים מִרְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/008.yaml
  text: The wisdom of the prudent is to understand his way[b][a], but the folly of fools is deceit.
translation:
  language: hi
  text: विवेकी की बुद्धि अपने मार्ग को समझने में है[a], पर मूर्खों की मूर्खता छल है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चतुर की बुद्धि अपने मार्ग को परखने में है।”
    reason: עָרוּם और הָבִין के लिए क्रमशः ‘चतुर’ और ‘परखना’ सम्भव शब्दार्थ हैं।
  - marker: b
    text: “छल” का अर्थ दूसरों को धोखा देने वाला व्यवहार भी हो सकता है और वह आत्म-छल भी, जो मूर्खों की मूर्खता की पहचान है।
    reason: מִרְמָה के संदर्भगत आशय की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: חָכְמַת
  choice: की बुद्धि
  rationale: 'रचनात्मक संबंध को स्वाभाविक हिन्दी में संबंधकारक ‘की’ से व्यक्त किया गया है: ‘विवेकी की बुद्धि’।'
- source_word: עָרוּם
  choice: विवेकी
  rationale: नीतिवचन के इस सकारात्मक संदर्भ में यह शब्द सावधान और सूझ-बूझ रखने वाले व्यक्ति को दर्शाता है; ‘विवेकी’ नकारात्मक धूर्तता का भाव जोड़े बिना इसे व्यक्त करता है।
- source_word: הָבִין
  choice: समझने में है
  rationale: यहाँ क्रिया बुद्धि की पहचान या सार बताती है। ‘समझने में है’ हिन्दी में इस परिभाषात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: דַּרְכּוֹ
  choice: अपने मार्ग को
  rationale: ‘मार्ग’ जीवन की दिशा, आचरण या चाल को समेट सकता है। ‘अपने’ मूल के एकवचन आत्मवाचक संबंध को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: וְאִוֶּלֶת
  choice: पर ... मूर्खता
  rationale: वाव यहाँ दोनों अर्धपंक्तियों के विरोध को जोड़ता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: כְּסִילִים
  choice: मूर्खों की
  rationale: बहुवचन संज्ञा को ज्ञान-साहित्य के ठोस नैतिक वर्ग ‘मूर्खों’ के रूप में रखा गया है।
- source_word: מִרְמָה
  choice: छल
  rationale: संक्षिप्त ‘छल’ धोखेबाज़ आचरण और स्वयं को धोखे में रखने—दोनों संभावित आशयों को खुला रखता है।
theological_decisions:
- issue: דַּרְכּוֹ में प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘अपने मार्ग’
  alternative: ‘उसके मार्ग’ या ‘अपने-अपने मार्ग’
  rationale: हिब्रू का एकवचन संबंध बना रहता है, जबकि हिन्दी का आत्मवाचक ‘अपने’ अनावश्यक रूप से लिंग को उभारता नहीं और वाक्य को स्वाभाविक रखता है।
- issue: עָרוּם का नैतिक भाव
  choice: सकारात्मक ‘विवेकी’
  alternative: ‘चतुर’, ‘धूर्त’ या ‘चालाक’
  rationale: बुद्धि और मूर्खता का विरोध इस पद में प्रशंसात्मक अर्थ की माँग करता है; नकारात्मक ‘धूर्त’ नैतिक ध्रुवता को उलट देगा।
- issue: מִרְמָה का आशय
  choice: अर्थ को ‘छल’ के रूप में खुला रखा गया
  alternative: केवल दूसरों को धोखा देना या केवल आत्म-छल
  rationale: पंक्ति यह स्पष्ट नहीं करती कि मूर्ख दूसरों को छलते हैं या उनकी मूर्खता स्वयं उन्हें भ्रमित करती है; अनुवाद इस वास्तविक अस्पष्टता को हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की संतुलित शैली के अनुरूप है। ‘विवेकी’, ‘मार्ग’, ‘मूर्खता’ और ‘छल’ गरिमापूर्ण होने के साथ सामान्य हिन्दी पाठक के लिए सुबोध हैं।
