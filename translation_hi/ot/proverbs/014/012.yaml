  text: יֵ֤שׁ דֶּ֣רֶךְ יָ֭שָׁר לִ/פְנֵי אִ֑ישׁ וְ֝/אַחֲרִיתָ֗/הּ דַּרְכֵי מָֽוֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/012.yaml
  text: There is a way that seems right to a man[a], but its end is the ways of death.
translation:
  language: hi
  text: एक मार्ग मनुष्य को सही जान पड़ता है[a], पर उसका अन्त मृत्यु के मार्ग हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मनुष्य के सामने सीधा’; यह इब्रानी मुहावरा उस बात को दर्शाता है जो किसी मनुष्य को अपनी दृष्टि में सही दिखाई देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: एक ... है / जान पड़ता है
  rationale: अस्तित्वसूचक प्रयोग सामान्य सत्य प्रस्तुत करता है; हिन्दी में ‘एक मार्ग ... जान पड़ता है’ स्वाभाविक रूप से वही बात कहता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: यह जीवन-चाल या आचरण के रूपक और वास्तविक रास्ते—दोनों अर्थों की गूँज बनाए रखता है।
- source_word: יָשָׁר
  choice: सही
  rationale: यहाँ शब्द व्यक्ति की दृष्टि में उचित होने का मूल्यांकन व्यक्त करता है, केवल भौतिक रूप से सीधा होना नहीं।
- source_word: לִפְנֵי אִישׁ
  choice: मनुष्य को ... जान पड़ता है
  rationale: शाब्दिक अर्थ ‘मनुष्य के सामने’ है, पर सन्दर्भ में यह उसकी अपनी दृष्टि में वैसा दिखाई देने का मुहावरा है; हिन्दी में यह अभिव्यक्ति अर्थ को स्वाभाविक ढंग से रखती है।
- source_word: וְאַחֲרִיתָהּ
  choice: पर उसका अन्त
  rationale: वाव यहाँ अर्थगत विरोध दिखाता है; ‘पर’ उस तीखे विरोध को स्पष्ट करता है और ‘अन्त’ परिणाम की संक्षिप्त नीतिवचनात्मक अभिव्यक्ति है।
- source_word: דַּרְכֵי
  choice: मार्ग हैं
  rationale: मूल का बहुवचन जानबूझकर सुरक्षित रखा गया है और पहले आए ‘मार्ग’ से शब्दगत सम्बन्ध बना रहता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द का सीधा और गंभीर अर्थ रखा गया है; इसे केवल विनाश या शारीरिक मृत्यु तक सीमित नहीं किया गया।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग אִישׁ
  choice: मनुष्य
  alternative: व्यक्ति / कोई जन / आदमी
  rationale: ‘मनुष्य’ व्याकरणिक एकवचन और प्रतिनिधिक मानवीय अर्थ दोनों को गरिमापूर्ण, सामान्य हिन्दी में व्यक्त करता है, बिना कथन को केवल पुरुषों तक सीमित किए।
- issue: नीतिवचन के सन्दर्भ में ‘मृत्यु’ का स्वरूप
  choice: मृत्यु
  alternative: विनाश / बरबादी
  rationale: पाठ स्वयं ‘मृत्यु’ कहता है; अनुवाद इसे केवल शारीरिक मृत्यु या सामान्य विनाश के रूप में व्याख्यायित करके तनाव को सीमित नहीं करता।
- issue: एकवचन मार्ग और बहुवचन मृत्यु के मार्ग
  choice: एक मार्ग ... मृत्यु के मार्ग हैं
  alternative: एक मार्ग ... मृत्यु का मार्ग है / उसका अन्त मृत्यु है
  rationale: इब्रानी में आरम्भिक דֶּרֶךְ एकवचन और अन्त का דַּרְכֵי बहुवचन है। असामान्य वचन-परिवर्तन को सहज बनाने के लिए मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक स्वर। ‘मार्ग’ की पुनरावृत्ति और मूल के एकवचन-बहुवचन तनाव को सुरक्षित रखा गया है; ‘जान पड़ता है’ लִפְנֵי के दृष्टिगत मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
