  text: בָּז לְ/רֵעֵ֥/הוּ חוֹטֵ֑א וּ/מְחוֹנֵ֖ן עניים אַשְׁרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/021.yaml
  text: Whoever despises his neighbor sins[a], but blessed is he who is gracious to the poor.
translation:
  language: hi
  text: 'जो अपने पड़ोसी को तुच्छ समझता है, वह पाप करता है;

    पर जो गरीबों पर कृपा करता है, वह धन्य[a] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह सुखी है।” इब्रानी शब्द केवल एक भावना नहीं, बल्कि कल्याण और आशीष की अवस्था व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: तुच्छ समझता है
  rationale: इब्रानी कृदंत किसी को तिरस्कार की दृष्टि से देखने या उसके साथ तुच्छ व्यवहार करने का भाव देता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और नैतिक कठोरता बनाए रखती है।
- source_word: לְרֵעֵהוּ
  choice: अपने पड़ोसी को
  rationale: רֵעַ सामाजिक निकटता के दायरे में आने वाले दूसरे व्यक्ति को दर्शाता है। ‘पड़ोसी’ हिन्दी बाइबलीय और सामान्य प्रयोग में स्पष्ट तथा परिचित है; संबंधसूचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: חוֹטֵא
  choice: वह पाप करता है
  rationale: यह कृदंत विधेय रूप में उस व्यक्ति के आचरण को स्पष्टतः पाप ठहराता है। ‘गलत करता है’ की अपेक्षा ‘पाप करता है’ मूल के नैतिक और धर्मवैचारिक भार को सुरक्षित रखता है।
- source_word: וּמְחוֹנֵן
  choice: कृपा करता है
  rationale: חנן का अर्थ अनुग्रह या उपकार दिखाना है। ‘कृपा करता है’ दया की भावना के साथ सक्रिय अनुग्रह का भाव भी बनाए रखता है।
- source_word: עניים
  choice: गरीबों
  rationale: עָנִי गरीब, दीन या पीड़ित व्यक्ति को सूचित कर सकता है। इस नैतिक विरोध में आर्थिक-सामाजिक असुरक्षा प्रमुख है, इसलिए ‘गरीबों’ सबसे सीधा और सहज विकल्प है, जबकि व्यापक अर्थ की संभावना टिप्पणी में स्वीकार्य रहती है।
- source_word: אַשְׁרָיו
  choice: वह धन्य है
  rationale: यह ज्ञान-साहित्य का सूत्र व्यक्ति की केवल क्षणिक खुशी नहीं, बल्कि कल्याण और आशीष की अवस्था घोषित करता है। ‘धन्य’ उस वस्तुगत भाव और गरिमामय शैली को सुरक्षित रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के पद אַשְׁרָיו का अनुवाद
  choice: वह धन्य है
  alternative: वह सुखी है
  rationale: मूल शब्द में सुख, कल्याण और आशीष की अवस्था समाहित है; इसे केवल भावनात्मक प्रसन्नता तक सीमित नहीं करना चाहिए। ‘धन्य’ इस व्यापक धर्मवैचारिक और नैतिक भार को बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और सहज ज्ञानोक्ति-शैली रखी गई है। दोनों समानांतर पंक्तियों का नैतिक विरोध स्पष्ट है; किसी सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
