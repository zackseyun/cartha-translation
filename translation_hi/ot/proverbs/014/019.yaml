  yaml_path: translation/ot/proverbs/014/019.yaml
  text: The evil bow down before the good[b][a], and the wicked at the gates of the righteous.
translation:
  language: hi
  text: 'बुरे लोग भले लोगों के सामने झुकेंगे,[a]

    और दुष्ट धर्मी के फाटकों पर झुकेंगे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि तक झुकेंगे।” इब्रानी क्रिया बहुत नीचे झुकने या दण्डवत् होने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “धर्मी के फाटकों पर” यह संकेत दे सकता है कि दुष्ट सहायता या कृपा की याचना में, निर्भरता में, अथवा धर्मी की प्रतिष्ठा स्वीकार करते हुए वहाँ झुकते हैं। दूसरे खंड में क्रिया मूल पाठ में व्यक्त नहीं है; वह पहले खंड से समझी जाती है।
    reason: cultural_and_textual_note
lexical_decisions:
- source_word: שַׁחוּ
  choice: झुकेंगे
  rationale: यह क्रिया झुकने या भूमि तक दण्डवत् होने का बोध करा सकती है। संदर्भ में रूप को भविष्यसूचक सामान्य कथन के रूप में रखा गया है; ‘झुकेंगे’ स्वाभाविक हिन्दी में अधीनता और अपमानित स्थिति का चित्र बनाए रखता है।
- source_word: רָעִים
  choice: बुरे लोग
  rationale: यह बहुवचन विशेषण संज्ञा की तरह प्रयुक्त है और बुरे व्यक्तियों को दर्शाता है। ‘बुरे लोग’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: इसका अर्थ ‘के आगे/के सामने/की उपस्थिति में’ है। झुकने के दृश्य में ‘के सामने’ स्वाभाविक है।
- source_word: טוֹבִים
  choice: भले लोग
  rationale: यह भी संज्ञावत् बहुवचन विशेषण है। ‘भले लोग’ पहले खंड के ‘बुरे लोग’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: וּרְשָׁעִים
  choice: और दुष्ट जन
  rationale: नीतिवचन साहित्य में यह शब्द नैतिक रूप से दुष्ट व्यक्तियों के लिए आता है। ‘दुष्ट जन’ संक्षिप्त और गरिमापूर्ण है।
- source_word: עַל
  choice: पर
  rationale: ‘फाटकों’ के साथ यह किसी प्रवेश-स्थान पर उपस्थित होने का स्थानीय अर्थ देता है।
- source_word: שַׁעֲרֵי
  choice: फाटकों
  rationale: मूल में बहुवचन रूप ‘फाटक’ है। इसे बनाए रखने से इब्रानी की औपचारिक आकृति और प्रवेश-स्थल का सांस्कृतिक चित्र सुरक्षित रहता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह एकवचन संज्ञावत् विशेषण है, जो प्रतिनिधि धर्मी व्यक्ति को दर्शाता है। ‘धर्मी’ हिन्दी बाइबलीय और ज्ञान-साहित्यिक संदर्भ में सहज है।
theological_decisions:
- issue: क्रिया שַׁחוּ का काल और भाव
  choice: झुकेंगे
  alternative: झुक गए / झुकते हैं
  rationale: इब्रानी पूर्ण रूप यहाँ नीतिवचन की निश्चित परिणति या भविष्याभिमुख कथन व्यक्त कर सकता है। ‘झुकेंगे’ उस सुनिश्चित उलटाव को दर्शाता है, पर इसे किसी विशिष्ट अंतिम न्याय तक सीमित नहीं करता।
- issue: फाटकों पर दुष्टों की स्थिति
  choice: आएँगे
  alternative: झुकेंगे / पड़े रहेंगे
  rationale: दूसरे खंड में क्रिया व्यक्त नहीं है और पहले खंड से अर्थ ग्रहण किया जा सकता है। ‘आएँगे’ उपस्थिति को स्पष्ट करता है, जबकि निर्भरता, विनती या अधीनता जैसे संभावित आशयों को पाद-टिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त नीतिवचनात्मक शैली। ‘बुरे लोग/भले लोग’ से मूल का समांतर विरोध स्पष्ट रखा गया है; ‘दुष्ट जन/धर्मी’ ज्ञान-साहित्य की नैतिक शब्दावली बनाए रखते हैं। पंक्ति-विभाजन इब्रानी समानांतरता को दिखाता है।
