  yaml_path: translation/ot/proverbs/014/003.yaml
  text: In the mouth of a fool is a rod of pride[b][a], but the lips of the wise will guard them.
translation:
  language: hi
  text: 'मूर्ख के मुँह में घमण्ड की छड़ी[a] होती है,

    पर बुद्धिमानों के होंठ उनकी रक्षा करते हैं[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घमण्ड की टहनी।” जिस इब्रानी शब्द का अनुवाद “छड़ी” किया गया है, उसका अर्थ “टहनी” या “शाखा” भी हो सकता है; यहाँ “छड़ी” का चित्र घमण्ड भरी वाणी के हानिकारक प्रभाव के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: “उनकी” सम्भवतः बुद्धिमानों की ओर संकेत करता है—अर्थात बुद्धिमानों के होंठ स्वयं उनकी रक्षा करते हैं।
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּפִי
  choice: के मुँह में
  rationale: स्थानवाचक अर्थ और इब्रानी काव्य-चित्र दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱוִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाले नहीं, बल्कि नैतिक रूप से हठी और विवेकहीन व्यक्ति का प्रतिनिधि शब्द है।
- source_word: חֹטֶר
  choice: छड़ी
  rationale: शब्द का अर्थ टहनी भी हो सकता है, पर यहाँ घमण्ड भरी वाणी के मारक या दण्डकारी प्रभाव के चित्र के लिए ‘छड़ी’ अधिक उपयुक्त है।
- source_word: גַּאֲוָה
  choice: घमण्ड
  rationale: यह अभिमान या अहंकार का सीधा, प्रचलित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: וְשִׂפְתֵי
  choice: पर ... के होंठ
  rationale: ו यहाँ दोनों पंक्तियों का विरोध दिखाता है; ‘होंठ’ रखने से ‘मुँह’ के साथ काव्यात्मक समानांतरता बनी रहती है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: यह विशेषण संज्ञा की तरह प्रयुक्त होकर बुद्धिमान लोगों के वर्ग को दर्शाता है।
- source_word: תִּשְׁמוּרֵם
  choice: उनकी रक्षा करते हैं
  rationale: क्रिया का अर्थ रक्षा करना है और प्रत्यय बहुवचन ‘उन्हें/उनकी’ है। हिन्दी में ‘उनकी रक्षा’ स्वाभाविक है, जबकि टिप्पणी सर्वनाम के सम्भावित संकेत को स्पष्ट करती है।
