  yaml_path: translation/ot/proverbs/014/010.yaml
  text: The heart knows the bitterness of its soul[b][a], and no stranger shares in its joy.
translation:
  language: hi
  text: हृदय अपने ही प्राण की कड़वाहट जानता है,[a] और कोई पराया उसके आनंद में सहभागी नहीं होता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके प्राण की कड़वाहट।” यहाँ “प्राण” व्यक्ति के भीतरी स्व या जीवन को दर्शाता है; यह मनुष्य की संरचना के विषय में कोई तकनीकी कथन नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “और कोई बाहरी उसके आनंद में शामिल नहीं हो सकता” या “भाग नहीं लेता” भी हो सकता है। इब्रानी क्रिया किसी बात में सम्मिलित होने या उसमें सहभागी होने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב
  choice: हृदय
  rationale: नीतिवचन में यह शब्द विचार और भावनाओं सहित भीतरी मनुष्य को दर्शाता है। ‘हृदय’ मूल रूपक को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण है।
- source_word: יֹדֵעַ
  choice: जानता है
  rationale: यहाँ क्रिया निजी, भीतरी अनुभव के प्रत्यक्ष बोध को व्यक्त करती है; ‘जानता है’ सरल और सटीक है।
- source_word: מָרַת נַפְשׁוֹ
  choice: अपने मन की कड़वाहट
  rationale: नֶפֶשׁ यहाँ व्यक्ति के भीतरी स्व या प्राणगत अनुभव को दर्शाता है, न कि मानव-संरचना के विषय में कोई तकनीकी कथन। ‘मन’ आधुनिक हिन्दी में इस आन्तरिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘कड़वाहट’ मूल रूपक बचाए रखती है।
- source_word: שִׂמְחָתוֹ
  choice: उसके आनन्द
  rationale: ‘आनन्द’ भावगत प्रसन्नता को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है। सर्वनाम का सम्बन्ध ‘हृदय’ से है।
- source_word: יִתְעָרַב
  choice: सहभागी नहीं होता
  rationale: हित्पएल रूप किसी बात में सम्मिलित होने या हिस्सा बाँटने का भाव दे सकता है। यह चयन प्रसंग में दूसरे के भीतरी आनन्द में भाग लेने का अर्थ स्पष्ट करता है।
- source_word: זָר
  choice: कोई पराया
  rationale: यहाँ अर्थ जातीय ‘विदेशी’ से अधिक उस व्यक्ति का है जो दूसरे के निजी आन्तरिक अनुभव से बाहर है; ‘पराया’ इस विरोध को सहज हिन्दी में व्यक्त करता है।
