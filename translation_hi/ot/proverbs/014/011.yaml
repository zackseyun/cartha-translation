source:
  edition: WLC
  text: בֵּ֣ית רְ֭שָׁעִים יִשָּׁמֵ֑ד וְ/אֹ֖הֶל יְשָׁרִ֣ים יַפְרִֽיחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/011.yaml
  text: The house of the wicked will be destroyed[a], but the tent of the upright will flourish.
translation:
  language: hi
  text: 'दुष्टों का घर नष्ट हो जाएगा,

    पर सीधे-सच्चे लोगों का तंबू फूले-फलेगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית רְשָׁעִים
  choice: दुष्टों का घर
  rationale: रचना-संबंध को स्वाभाविक हिन्दी में रखा गया है। ‘घर’ भौतिक भवन के साथ परिवार या घराने का संकेत भी दे सकता है और ‘तम्बू’ के साथ मूल बिंबात्मक विरोध बनाए रखता है।
- source_word: יִשָּׁמֵד
  choice: नष्ट हो जाएगा
  rationale: निफ़अल रूप विनाश या उजाड़े जाने को व्यक्त करता है; यह हिन्दी पदबंध अर्थ को स्पष्ट रखता है, पर अनावश्यक रूप से पूर्ण उन्मूलन का भाव नहीं बढ़ाता।
- source_word: אֹהֶל
  choice: तम्बू
  rationale: शाब्दिक निवास-बिंब को बनाए रखा गया है; इसे ‘घर’ करने पर पद के जानबूझकर रखे गए घर–तम्बू विरोध की धार कम हो जाती।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: यह नैतिक रूप से सीधे और ईमानदार लोगों को दर्शाता है। ‘सीधे लोग’ आधुनिक हिन्दी में बोधगम्य है और इब्रानी ‘सीधाई’ के बिंब को ‘धर्मी’ जैसे अलग पारिभाषिक शब्द में नहीं मिलाता।
- source_word: יַפְרִיחַ
  choice: फूले-फलेगा
  rationale: हिफ़ईल क्रिया अंकुरित होने, पुष्पित होने और फलने-फूलने का सजीव बिंब जगाती है। ‘फूले-फलेगा’ समृद्धि और बढ़ोतरी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानांतर पंक्तियों में ‘घर’ और ‘तम्बू’ का विरोध तथा विनाश और विकास का प्रतिलोम बिंब सुरक्षित है। ‘फूले-फलेगा’ स्वयं वनस्पतिक बिंब को पर्याप्त स्पष्ट करता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
