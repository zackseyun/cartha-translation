review_pass:
  verdict: revise
  source_fidelity: The parallel contrast and the images of ‘house’ (בֵּית) versus ‘tent’ (אֹהֶל) are retained, as are destruction (יִשָּׁמֵד) and flourishing (יַפְרִיחַ). ‘फूले-फलेगा’ suitably conveys the growth/prosperity image without forcing a narrower botanical sense.
  naturalness: The verse is clear and well balanced. However, ‘सीधे लोग’ can in modern Hindi suggest naïve or unsophisticated people, which risks obscuring the Hebrew’s ethical sense.
  terminology: ‘दुष्टों,’ ‘घर,’ and ‘तंबू’ are appropriate. ‘सीधे-सच्चे’ naturally conveys the morally upright/straight sense of יְשָׁרִים while avoiding a specialized theological label. ‘तंबू’ is the standard contemporary Hindi spelling.
  issues:
  - severity: medium
    issue: ‘सीधे लोग’ is semantically ambiguous in modern Hindi.
    rationale: 'While it reflects the literal image of ישרים, ordinary Hindi may understand it as ‘simple/unsophisticated people’ rather than people of moral integrity. The source contrast is explicitly ethical: wicked versus upright.'
  revised_text: 'दुष्टों का घर नष्ट हो जाएगा,

    पर सीधे-सच्चे लोगों का तंबू फूले-फलेगा।'
  revised_footnotes: []
  revision_rationale: 'The revision replaces the potentially misleading ‘सीधे लोग’ with ‘सीधे-सच्चे लोग’ to preserve the ethical force of יְשָׁרִים in idiomatic modern Hindi. It also standardizes ‘तम्बू’ to ‘तंबू.’ No footnote is required: ‘फूले-फलेगा’ adequately carries the Hebrew flourishing imagery in the verse itself.'
