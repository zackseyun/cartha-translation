  to: 'दुष्टों का घर नष्ट हो जाएगा,

    पर सीधे-सच्चे लोगों का तंबू फूले-फलेगा।'
  rationale: 'The revision replaces the potentially misleading ‘सीधे लोग’ with ‘सीधे-सच्चे लोग’ to preserve the ethical force of יְשָׁרִים in idiomatic modern Hindi. It also standardizes ‘तम्बू’ to ‘तंबू.’ No footnote is required: ‘फूले-फलेगा’ adequately carries the Hebrew flourishing imagery in the verse itself.'
