source:
  edition: WLC
  text: בְּ/אֵ֣ין אֲ֭לָפִים אֵב֣וּס בָּ֑ר וְ/רָב תְּ֝בוּא֗וֹת בְּ/כֹ֣חַ שֽׁוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/004.yaml
  text: Where there are no oxen[a], the manger is clean[b], but abundant crops come by the strength of an ox.
translation:
  language: hi
  text: जहाँ बैल नहीं होते, वहाँ नाँद[a] साफ रहती है, पर बैल के बल से भरपूर उपज[b] होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “चरनी।”
    reason: lexical_alternative
  - marker: b
    text: अथवा “फसल,” “पैदावार” या “कटनी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵין
  choice: जहाँ … नहीं होते
  rationale: यह पदबंध किसी परिस्थिति या दशा को प्रस्तुत करता है। हिंदी में “जहाँ … नहीं होते” कहावत के विरोधाभास को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲלָפִים
  choice: बैल
  rationale: बहुवचन शब्द व्यापक रूप से गोवंश का संकेत दे सकता है, पर शׁוֹר के समानांतर और कृषि-संदर्भ में यहाँ खेत के काम आने वाले बैल अभिप्रेत हैं। हिंदी में “बैल” रूप संदर्भानुसार बहुवचन भी है।
- source_word: אֵבוּס
  choice: नाँद
  rationale: यह पशुओं के चारा खाने के पात्र या स्थान को दर्शाता है। “नाँद” सटीक, संक्षिप्त और ग्रामीण-कृषि संदर्भ में स्वाभाविक है।
- source_word: בָּר
  choice: साफ
  rationale: यहाँ अर्थ नाँद के पशुओं से होने वाली गंदगी या बिखरे चारे से मुक्त होने का है। “साफ” व्यावहारिक संदर्भ को व्यक्त करता है और अमूर्त “शुद्ध” से अधिक उपयुक्त है।
- source_word: וְרָב
  choice: पर … भरपूर
  rationale: वाव यहाँ दोनों स्थितियों के बीच विरोध दिखाता है, जिसे “पर” स्वाभाविक बनाता है; רָב की प्रचुरता “भरपूर” से व्यक्त होती है।
- source_word: תְּבוּאוֹת
  choice: उपज
  rationale: यह कृषि से प्राप्त पैदावार या फसल को दर्शाता है। “उपज” आधुनिक हिंदी में स्पष्ट है और परिणाम की प्रचुरता पर बल देता है।
- source_word: בְּכֹחַ
  choice: के बल से
  rationale: पूर्वसर्ग साधन या माध्यम बताता है। “के बल से” बैल की श्रम-क्षमता को कारण और साधन दोनों रूपों में सहजता से व्यक्त करता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: एकवचन यहाँ जातिवाचक है। “बैल” खेत के काम में प्रयुक्त प्रतिनिधि पशु को स्वाभाविक रूप से व्यक्त करता है।
