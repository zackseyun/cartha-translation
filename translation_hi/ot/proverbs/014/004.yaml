  register: भाषा आधुनिक, संक्षिप्त और कहावत के अनुरूप रखी गई है। “नाँद” कृषि-जीवन की ठोस छवि बनाए रखता है; वाक्य का विरोध साफ-सफाई और उत्पादकता के बीच मूल तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
