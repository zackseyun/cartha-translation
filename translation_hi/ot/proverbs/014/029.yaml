- source_word: רַב תְּבוּנָה
  choice: वह बहुत समझ रखता है
  rationale: רַב यहाँ समझ की प्रचुरता बताता है। ‘बहुत समझ रखता है’ स्वाभाविक हिन्दी में मूल कथन का अर्थ देता है।
- source_word: קְצַר רוּחַ
  choice: जो जल्द क्रोधित हो जाता है
  rationale: शाब्दिक अर्थ ‘आत्मा में छोटा’ है। सन्दर्भ में यह अधीरता या शीघ्र भड़क उठने को बताता है और पहली पंक्ति के ‘क्रोध करने में धीमा’ से स्पष्ट विरोध बनाता है।
- source_word: מֵרִים
  choice: ऊँचा उठाता है
  rationale: रूप רום के हिफ़ील कृदन्त से है, जिसका मूल अर्थ ‘ऊँचा उठाना’ है। इस रूप से मूल रूपक और यह सम्भावना दोनों बनी रहती हैं कि ऐसा व्यक्ति मूर्खता को प्रतिष्ठित, बढ़ा या प्रकट करता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: नीतिवचन में यह शब्द नैतिक और बौद्धिक विवेकहीनता को दर्शाता है। ‘मूर्खता’ आधुनिक हिन्दी में सीधा और उपयुक्त समतुल्य है।
