  text: A short-tempered man acts foolishly[b][a], and a man of schemes is hated.
translation:
  language: hi
  text: जल्दी क्रोध करनेवाला मूर्खता करता है,[a] और कुटिल योजनाएँ बनानेवाला मनुष्य घृणा का पात्र होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुनकमिज़ाज।’
    reason: lexical_alternative
  - marker: b
    text: ‘कुटिल योजनाएँ’ के लिए इब्रानी शब्द का अर्थ ‘युक्तियाँ’ या ‘योजनाएँ’ भी हो सकता है; ज्ञान-साहित्य में इसका भाव अक्सर नकारात्मक होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצַר אַפַּיִם
  choice: जल्दी क्रोध करनेवाला
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘नथुनों/क्रोध में छोटा’ है और शीघ्र क्रोधित होनेवाले व्यक्ति को दर्शाता है। चुना हुआ हिन्दी रूप स्वाभाविक और अर्थ-सटीक है।
- source_word: יַעֲשֶׂה
  choice: करता है
  rationale: सामान्य क्रिया ‘करना/बनाना’ यहाँ אִוֶּלֶת के साथ ‘मूर्खता करता है’ के रूप में सहज और निकट अनुवाद देती है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: संज्ञा का अर्थ ‘मूर्खता’ है; इसे संज्ञा के रूप में रखना इब्रानी रचना और नीतिवचन की सूक्तिपरक शैली को सुरक्षित रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यह पुल्लिंग एकवचन में एक प्रतिनिधि व्यक्ति-प्रकार को बताता है। ‘मनुष्य’ आधुनिक हिन्दी में गरिमापूर्ण है और मूल के व्यक्तिवाचक रूप को बनाए रखता है।
- source_word: מְזִמּוֹת
  choice: षड्यंत्र
  rationale: इस शब्द का अर्थ योजनाएँ या युक्तियाँ हो सकता है और ज्ञान-साहित्य में प्रायः नकारात्मक भाव रखता है। ‘षड्यंत्र’ प्रसंग का संभावित निंदात्मक अर्थ व्यक्त करता है; व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יִשָּׂנֵא
  choice: से घृणा की जाती है
  rationale: निफ़अल रूप को कर्मवाच्य में रखा गया है। वर्तमान काल नीतिवचन के सामान्य, सार्वकालिक कथन के अनुकूल है।
theological_decisions:
- issue: מְזִמּוֹת के नैतिक भाव की स्पष्टता
  choice: मुख्य पाठ में ‘षड्यंत्र’
  alternative: ‘युक्तियाँ/योजनाएँ’
  rationale: संदर्भ में शब्द संभवतः नकारात्मक है, पर मूल शब्द अपने आप में व्यापक अर्थ भी रख सकता है। इसलिए संभावित नकारात्मक भाव मुख्य पाठ में और वास्तविक शाब्दिक विस्तार पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सूक्तिपरक और गरिमापूर्ण शैली रखी गई है। ‘जल्दी क्रोध करनेवाला’ सामान्य पाठक के लिए स्पष्ट है; ‘षड्यंत्र रचनेवाला’ दूसरे खंड का निंदात्मक भाव स्वाभाविक ढंग से व्यक्त करता है।
