  text: חָכָ֣ם יָ֭רֵא וְ/סָ֣ר מֵ/רָ֑ע וּ֝/כְסִ֗יל מִתְעַבֵּ֥ר וּ/בוֹטֵֽחַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/016.yaml
  text: A wise man fears and turns away from evil[a], but a fool is reckless and confident.
translation:
  language: hi
  text: बुद्धिमान डरता है और बुराई से दूर हट जाता है, पर मूर्ख उतावला हो जाता है[a] और निश्चिंत रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन हिब्रू क्रिया का अर्थ ‘क्रोधित हो उठता’, ‘हद पार करता’ या ‘बेलगाम हो जाता’ भी हो सकता है; यहाँ संभवतः उतावले, असंयमित व्यवहार का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। हिन्दी में ‘बुद्धिमान’ स्वाभाविक है और नीतिवचन के सार्वभौमिक कथन को बनाए रखता है।
- source_word: יָרֵא
  choice: डरता
  rationale: मूल क्रिया का सीधा अर्थ ‘डरना’ है। यहाँ यह बुराई के सामने विवेकपूर्ण भय या सावधानी व्यक्त करती है; ‘डरता’ मूल की संक्षिप्तता और अर्थ-तनाव दोनों को सुरक्षित रखता है।
- source_word: וְסָר
  choice: और ... से दूर रहता है
  rationale: סור का अर्थ मुड़ना या हट जाना है। ‘दूर रहता है’ आधुनिक हिन्दी में बुराई से सचेत परहेज़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: רַע नैतिक बुराई और हानिकारक बात, दोनों का संकेत दे सकता है। इस ज्ञान-साहित्यिक विरोध में ‘बुराई’ उपयुक्त है और विनाशकारी परिणाम की छाया को भी नहीं मिटाता।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और बौद्धिक विवेकहीनता के व्यक्ति के लिए मानक शब्द है; ‘मूर्ख’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: מִתְעַבֵּר
  choice: उतावली करता
  rationale: यह कठिन हिब्रू रूप नियंत्रण की सीमा लाँघने, उग्र होने या आवेश में बढ़ जाने का बोध दे सकता है। प्रसंग में ‘उतावली करता’ बुद्धिमान की सावधानी के विपरीत असंयमित आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבוֹטֵחַ
  choice: और निश्चिंत रहता है
  rationale: בטח का अर्थ भरोसा रखना, आश्वस्त होना या सुरक्षित अनुभव करना है। कोई कर्म नहीं दिया गया है; नकारात्मक प्रसंग में ‘निश्चिंत रहता है’ मूर्ख की बेपरवाह आश्वस्तता को व्यक्त करता है, बिना ‘अपने ऊपर’ जैसा अनुल्लिखित कर्म जोड़े।
theological_decisions:
- issue: יָרֵא में भय का लक्ष्य
  choice: ‘डरता’ रखा गया, परमेश्वर को लक्ष्य के रूप में नहीं जोड़ा गया
  alternative: ‘परमेश्वर का भय मानता है’ या केवल ‘सावधान रहता है’
  rationale: इस पद में भय का कोई स्पष्ट कर्म नहीं है। परमेश्वर को जोड़ना व्याख्यात्मक विस्तार होता, जबकि केवल ‘सावधान’ कहना मूल ‘भय’ को कमजोर करता।
- issue: וּבוֹטֵחַ में भरोसे का लक्ष्य
  choice: ‘निश्चिंत रहता है’
  alternative: ‘अपने ऊपर भरोसा रखता है’
  rationale: हिब्रू में भरोसे का कोई स्पष्ट लक्ष्य नहीं दिया गया। इसलिए आत्मनिर्भरता की धार्मिक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘बुद्धिमान’ और ‘मूर्ख’ सामान्य प्रतिनिधि व्यक्तियों के रूप में हैं। मुख्य पाठ में कठिन क्रिया की एक स्वाभाविक व्याख्या दी गई है और वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
