  yaml_path: translation/ot/proverbs/014/009.yaml
  text: Fools mock guilt[b][a], but among the upright there is favor.
translation:
  language: hi
  text: मूर्ख दोष का उपहास करते हैं[a], परन्तु सीधे-सच्चे लोगों के बीच अनुग्रह है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख दोषबलि का उपहास करते हैं।” इब्रानी शब्द אָשָׁם का अर्थ ‘दोष’ हो सकता है और बलिदान के संदर्भ में ‘दोषबलि’ भी।
    reason: alternative_reading
  - marker: b
    text: या, “कृपा,” “स्वीकृति,” अथवा “सद्भाव।” इब्रानी पाठ यह स्पष्ट नहीं करता कि यह अनुग्रह किसकी ओर से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: मूर्ख
  rationale: नीतिवचन में यह नैतिक और आत्मिक विवेकहीनता वाले लोगों के लिए प्रयुक्त बहुवचन संज्ञा है; ‘मूर्ख’ स्वाभाविक और संक्षिप्त हिन्दी समतुल्य है।
- source_word: יָלִיץ
  choice: उपहास करते हैं
  rationale: लוץ के हिफ़ील रूप का सामान्य अर्थ ठट्ठा या उपहास करना है। यह अनुवाद दोष को हल्का समझने की प्रवृत्ति व्यक्त करता है।
- source_word: אָשָׁם
  choice: दोष
  rationale: इस ज्ञान-साहित्यिक संदर्भ में अमूर्त अर्थ—अपराध या उसके कारण उत्पन्न दोष—उपयुक्त है। मूल शब्द ‘दोषबलि’ भी दर्शा सकता है, इसलिए वह विकल्प पादटिप्पणी में रखा गया है।
- source_word: וּבֵין
  choice: परन्तु ... के बीच
  rationale: वाव के साथ यह पद दूसरे चरण का विरोधात्मक संबंध प्रस्तुत करता है; ‘परन्तु’ हिन्दी में इस विरोध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְשָׁרִים
  choice: सीधे लोग
  rationale: शाब्दिक रूप से ‘सीधे’ और नैतिक अर्थ में खराई से चलने वाले लोग। ‘सीधे लोग’ सामान्य आधुनिक हिन्दी में सहज है और ज्ञान-साहित्य की नैतिक श्रेणी को बनाए रखता है।
- source_word: רָצוֹן
  choice: कृपा
  rationale: इस शब्द में अनुग्रह, स्वीकृति या सद्भाव का भाव हो सकता है। ‘कृपा’ संक्षिप्त है और कृपा देने वाले की पहचान को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: אָשָׁם का अर्थ
  choice: अमूर्त ‘दोष’
  alternative: ‘दोषबलि’
  rationale: पद का नैतिक विरोध ज्ञान-साहित्य के संदर्भ में अमूर्त अर्थ का समर्थन करता है, पर बलिदान-संबंधी अर्थ वास्तविक शाब्दिक संभावना है और पादटिप्पणी में सुरक्षित है।
- issue: רָצוֹן का स्रोत या कर्ता
  choice: अनिर्दिष्ट ‘कृपा’
  alternative: परमेश्वर की कृपा; मानवीय सद्भाव; स्वीकृति
  rationale: इब्रानी पाठ यह नहीं बताता कि कृपा किसकी है। अनुवाद उस धार्मिक और व्याख्यात्मक खुलेपन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘दोष’ और ‘कृपा’ मूल की अर्थगत अस्पष्टता को बनाए रखते हैं; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
