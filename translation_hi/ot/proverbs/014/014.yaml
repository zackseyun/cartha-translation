  edition: WLC
  text: מִ/דְּרָכָ֣י/ו יִ֭שְׂבַּע ס֣וּג לֵ֑ב וּ֝/מֵ/עָלָ֗י/ו אִ֣ישׁ טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/014.yaml
  text: The one who turns away in heart will be filled with his own ways[b][a], and a good man with what comes from himself.
translation:
  language: hi
  text: मन से फिरा हुआ व्यक्ति अपने ही चालचलन से तृप्त होगा[a], और भला मनुष्य अपने ही आचरण से तृप्त होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने ही चालचलन का भरपूर फल पाएगा।”
    reason: ‘तृप्त होगा’ हिब्रू क्रिया יִשְׂבַּע के भरने/संतुष्ट होने के ठोस रूपक को रखता है; वैकल्पिक अनुवाद उसके परिणामसूचक आशय को अधिक स्पष्ट करता है।
  - marker: b
    text: 'दूसरे खंड का हिब्रू कठिन और संक्षिप्त है। शाब्दिक रूप से पद का अर्थ लगभग “और उसके ऊपर/पास से भला मनुष्य” हो सकता है। पहले खंड की समानांतरता के आधार पर सम्भावित अर्थ है: “और भला मनुष्य अपने ही आचरण से तृप्त होगा।”'
    reason: וּמֵעָלָיו का संबंध और सटीक अर्थ विवादित है। मुख्य पाठ समानांतर संदर्भ के अनुसार सम्भावित अर्थ देता है, जबकि टिप्पणी उसकी शाब्दिक अस्पष्टता को बनाए रखती है।
lexical_decisions:
- source_word: מִדְּרָכָיו
  choice: अपनी ही चालों से
  rationale: מִן स्रोत को सूचित करता है और דְּרָכִים यहाँ व्यक्ति के आचरण या जीवन-मार्ग हैं। ‘चालों से’ मूल रूपक और उसके अपने आचरण से मिलने वाले परिणाम—दोनों को खुला रखता है; ‘ही’ स्वत्व के विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: יִשְׂבַּע
  choice: भर जाएगा
  rationale: क्रिया का मूल भाव पेट भरने, परिपूर्ण होने या तृप्त होने का है। ‘भर जाएगा’ ठोस रूपक को बनाए रखता है और पहले तथा दूसरे दोनों खंडों पर लागू हो सकता है।
- source_word: סוּג לֵב
  choice: जिसका मन भटक गया है
  rationale: סוּג पीछे हटने या मार्ग से फिर जाने को और לֵב भीतरी नैतिक अभिमुखता को दर्शाता है। यह रूप आधुनिक हिन्दी में सहज है और इसे किसी विशेष धार्मिक तकनीकी पद में नहीं बदलता।
- source_word: וּמֵעָלָיו
  choice: और ... उससे, जो उसके अपने भीतर से निकलता है
  rationale: यह कठिन और लुप्तपदीय पदबंध है। पहले खंड के स्रोत-सूचक מִן के समानांतर इसे भले मनुष्य से स्वयं निकलने वाले आचरण या चरित्र के फल के रूप में समझा गया है, पर ‘कर्म’ स्पष्ट रूप से जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: אִישׁ טוֹב
  choice: भला मनुष्य
  rationale: אִישׁ טוֹב का अर्थ ‘भला पुरुष/मनुष्य’ है। कहावत के सामान्य मानवीय संदर्भ में ‘भला मनुष्य’ स्वाभाविक और गरिमापूर्ण है तथा मूल के एकवचन को रखता है।
theological_decisions:
- issue: अपने आचरण के परिणाम से भरना
  choice: पद को नैतिक प्रतिफल की सामान्य कहावत के रूप में रखा गया है
  alternative: इसे परमेश्वर के न्याय, कर्मफल-सिद्धांत, या आत्मनिर्भर धार्मिक योग्यता का स्पष्ट कथन बनाना
  rationale: हिब्रू पाठ व्यक्ति की चालों और उससे स्वयं निकलने वाली बात के परिणाम पर बल देता है, पर परिणाम देने वाले माध्यम या किसी व्यवस्थित धार्मिक सिद्धांत को स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, कहावत के अनुरूप संक्षिप्त और गरिमापूर्ण रखी गई है। ‘मन भटक गया है’ भीतरी नैतिक विमुखता को सामान्य पाठक के लिए स्पष्ट करता है। अर्धविराम दोनों समानांतर खंडों को अलग करता है, और दूसरे खंड में ‘भर जाएगा’ स्वाभाविक रूप से लुप्त समझा जाता है।
