  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/לֵ֣ב נָ֭בוֹן תָּנ֣וּחַ חָכְמָ֑ה וּ/בְ/קֶ֥רֶב כְּ֝סִילִ֗ים תִּוָּדֵֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/033.yaml
  text: Wisdom rests in the heart of a discerning man[a], but in the midst of fools it makes itself known.
translation:
  language: hi
  text: समझ-बूझ रखनेवाले के हृदय में बुद्धि विश्राम करती है, परन्तु मूर्खों के बीच वह प्रकट हो जाती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जानी जाती है।”
    reason: हिब्रू क्रिया का अर्थ आत्मवाचक/आरंभसूचक ‘प्रकट हो जाती है’ अथवा निष्क्रिय ‘जानी जाती है’ हो सकता है।
lexical_decisions:
- source_word: בְּלֵב נָבוֹן
  choice: समझ-बूझ रखनेवाले के हृदय में
  rationale: לֵב के ठोस ‘हृदय’ रूपक को बनाए रखा गया है; נָבוֹן ऐसे व्यक्ति को दर्शाता है जिसमें समझ और परख है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और हिब्रू के प्रतिनिधि एकवचन को अनावश्यक रूप से केवल पुरुष तक सीमित नहीं करती।
- source_word: תָּנוּחַ
  choice: विश्राम करती है
  rationale: נוח से बना यह क्रियारूप ठहरने या विश्राम करने का भाव देता है। ‘विश्राम करती है’ समझदार व्यक्ति के भीतर बुद्धि की शांत, स्थिर उपस्थिति का चित्र सुरक्षित रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन के साहित्य में חָכְמָה के लिए ‘बुद्धि’ स्वाभाविक और स्थापित हिन्दी शब्द है। यहाँ इसे नामवत व्यक्तित्व मानने के बजाय एक अमूर्त गुण के रूप में रखा गया है।
- source_word: וּבְקֶרֶב כְּסִילִים
  choice: परन्तु मूर्खों के बीच
  rationale: ו यहाँ पहली और दूसरी पंक्ति के विरोध को जोड़ता है, इसलिए ‘परन्तु’ उपयुक्त है। קֶרֶב का स्थानवाचक भाव ‘के बीच’ से सहज हिन्दी में व्यक्त होता है; כְּסִילִים नैतिक और बौद्धिक विवेकहीनता वाले लोगों को सूचित करता है।
- source_word: תִּוָּדֵעַ
  choice: वह प्रकट हो जाती है
  rationale: ידע का निफ़अल रूप ‘जानी जाती है’ अथवा ‘प्रकट हो जाती है’ हो सकता है। ‘प्रकट हो जाती है’ पहली पंक्ति के शांत विश्राम के विपरीत बाहरी रूप से दिखाई देने का भाव देता है, जबकि पाद-टिप्पणी निष्क्रिय विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: क्या ‘बुद्धि’ को व्यक्तित्वयुक्त सत्ता के रूप में प्रस्तुत किया जाए
  choice: इसे व्याकरणिक स्त्रीलिंग अमूर्त संज्ञा के रूप में रखा गया है
  alternative: ‘बुद्धि अपने आपको प्रकट करती है’ कहकर अधिक स्पष्ट व्यक्तित्व देना
  rationale: हिब्रू क्रियारूप आत्मवाचक या आरंभसूचक अर्थ दे सकता है, पर यह पद अपने आप में पूर्ण व्यक्तित्वकरण को अनिवार्य नहीं करता; अतः अनावश्यक धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘हृदय’ और ‘विश्राम’ मूल के ठोस रूपकों को बचाते हैं, जबकि ‘समझ-बूझ रखनेवाला’ सामान्य पाठक के लिए सहज है।
