source:
  edition: WLC
  text: רְֽצוֹן מֶ֭לֶךְ לְ/עֶ֣בֶד מַשְׂכִּ֑יל וְ֝/עֶבְרָת֗/וֹ תִּהְיֶ֥ה מֵבִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/035.yaml
  text: A king’s favor is toward a servant who acts wisely[b][a], but his wrath is against one who brings shame.
translation:
  language: hi
  text: समझ-बूझ से काम करनेवाले सेवक पर राजा की कृपा होती है,[a] परन्तु लज्जा का कारण बननेवाले पर उसका प्रकोप होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विवेकी सेवक पर” अथवा “कुशल सेवक पर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका प्रकोप लज्जा का कारण बननेवाले के लिए/विरुद्ध होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: कृपा
  rationale: यहाँ शब्द राजा के अनुकूल रुख, प्रसन्नता और स्वीकृति को व्यक्त करता है; राजकीय संदर्भ में ‘कृपा’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: पुरुष शासक के लिए सामान्य संज्ञा का सीधा हिन्दी रूप।
- source_word: לְעֶבֶד
  choice: सेवक पर
  rationale: לְ अनुकूलता के लक्ष्य को सूचित करता है। दरबारी सेवा और कार्यकुशलता के संदर्भ में ‘सेवक’ उपयुक्त है; यहाँ बंधुआ स्थिति पर बल नहीं है।
- source_word: מַשְׂכִּיל
  choice: समझ-बूझ से काम करनेवाला
  rationale: שׂכל का हिफ़ील कृदंत अंतर्दृष्टि, विवेक और व्यावहारिक सफलता के साथ कार्य करने का भाव देता है; यह रूप उसकी क्रियात्मक शक्ति बनाए रखता है।
- source_word: וְעֶבְרָתוֹ
  choice: परन्तु ... उसका प्रकोप
  rationale: עֶבְרָה तीव्र, उमड़ते क्रोध को दर्शाता है; ‘प्रकोप’ उसकी शक्ति को बनाए रखता है। וְ को दोनों अर्धपंक्तियों के विरोध के कारण ‘परन्तु’ किया गया है।
- source_word: תִּהְיֶה
  choice: होता है
  rationale: היה अस्तित्व या स्थिति बताता है। नीतिवचन के सामान्य सत्य के अनुरूप हिन्दी में वर्तमानकाल स्वाभाविक है; भविष्यकाल जोड़ना आवश्यक नहीं।
- source_word: מֵבִישׁ
  choice: लज्जा का कारण बननेवाला
  rationale: בוש का हिफ़ील कृदंत उस व्यक्ति को सूचित करता है जो लज्जा या अपमान उत्पन्न करता है; यह अनुवाद कारणवाचक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: תִּהְיֶה के साथ निहित संबंध
  choice: प्रकोप ... पर होता है
  alternative: प्रकोप ... के लिए होगा
  rationale: हिब्रू में संबंध का पूर्वसर्ग स्पष्ट नहीं है। समानांतरता विरोधी लक्ष्य का संकेत देती है, इसलिए स्वाभाविक हिन्दी में ‘पर’ रखा गया है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक रूप अपनाया गया है। ‘समझ-बूझ से काम करनेवाला’ व्यावहारिक बुद्धिमत्ता को सामान्य पाठक के लिए स्पष्ट करता है; ‘प्रकोप’ मूल के तीव्र क्रोध को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
