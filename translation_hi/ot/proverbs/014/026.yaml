base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/026.yaml
  text: In the fear of Yahweh there is strong confidence[a], and for his children there will be a refuge.
translation:
  language: hi
  text: याहवे के भय में दृढ़ भरोसा है, और उसके[a] बच्चों के लिए शरण होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक अन्य, यद्यपि कम संभावित, व्याख्या के अनुसार ‘उसके बच्चे’ का अर्थ ‘याहवे के बच्चे’ हो सकता है; तब वाक्य होगा, ‘और याहवे के बच्चों के लिए शरण होगी।’
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יִרְאַת
  choice: के भय में
  rationale: בְּ के साथ יִרְאַת उस क्षेत्र या जीवन-दृष्टि को व्यक्त करता है जिसमें श्रद्धापूर्ण भय पाया जाता है; हिंदी में ‘के भय में’ मूल इब्रानी मुहावरे को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: מִבְטַח עֹז
  choice: दृढ़ भरोसा
  rationale: מִבְטַח भरोसे या सुरक्षा का बोध देता है और עֹז उसे सामर्थ्य/दृढ़ता से विशेषित करता है; ‘दृढ़ भरोसा’ स्वाभाविक हिंदी में इस संयुक्त अर्थ को व्यक्त करता है।
- source_word: וּ/לְ/בָנָי/ו
  choice: और उसके बच्चों के लिए
  rationale: לְ को ‘के लिए’ से स्पष्ट रखा गया है। בָּנִים यहाँ सामान्य वंशजों के अर्थ में ‘बच्चे’ है। प्रत्यय ‘उसके’ का मुख्य पाठ में निकटतम मानवीय संदर्भ, अर्थात याहवे का भय मानने वाला व्यक्ति, लिया गया है; दूसरी संभावना पादटिप्पणी में सुरक्षित है।
- source_word: יִהְיֶה
  choice: होगी
  rationale: היה यहाँ आगे आने वाली ‘शरण’ के अस्तित्व को बताता है; हिंदी में स्त्रीलिंग संज्ञा के अनुरूप ‘होगी’ स्वाभाविक है।
- source_word: מַחְסֶה
  choice: शरण
  rationale: מַחְסֶה सुरक्षा देने वाले आश्रय या शरण को दर्शाता है; ‘शरण’ संक्षिप्त, गरिमापूर्ण और बिंब-संगत है।
theological_decisions:
- issue: ‘उसके बच्चों’ में सर्वनाम का संदर्भ
  choice: ‘उसके’ को याहवे का भय मानने वाले व्यक्ति के संदर्भ में लिया गया है।
  alternative: ‘उसके’ का संदर्भ याहवे भी हो सकता है, अर्थात ‘याहवे के बच्चों के लिए शरण होगी।’
  rationale: तात्कालिक वाक्य-विन्यास और नीतिवचन की समानांतर विचार-रचना मनुष्य को संदर्भ मानने के पक्ष में हैं, पर इब्रानी सर्वनाम व्याकरणतः याहवे की ओर भी संकेत कर सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली रखी गई है। ‘याहवे’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘भय’ श्रद्धापूर्ण भय की पारंपरिक और स्रोत-संगत अभिव्यक्ति है। पादटिप्पणी-चिह्न मुख्य पाठ में वाक्य के अंत में रखा गया है।
