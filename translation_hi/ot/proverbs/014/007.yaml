  yaml_path: translation/ot/proverbs/014/007.yaml
  text: Go from the presence of a foolish man[a], for you do not perceive lips of knowledge.
translation:
  language: hi
  text: मूर्ख मनुष्य के पास से चला जा, क्योंकि तुझे ज्ञान की बातें नहीं मिलेंगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “मूर्ख मनुष्य के सामने से चला जा, और तू ज्ञान के होंठ नहीं जानता।” इब्रानी के दूसरे खंड में क्रिया के काल-भाव और दोनों खंडों के संबंध के कारण यह अर्थ भी संभव है: “मूर्ख मनुष्य से दूर हो जा, क्योंकि वहाँ तुझे ज्ञान की बातें नहीं मिलेंगी।”'
    reason: मूल इब्रानी के दूसरे खंड में क्रिया के काल-भाव और दोनों खंडों के संबंध में वास्तविक अस्पष्टता है।
lexical_decisions:
- source_word: לֵךְ מִנֶּגֶד
  choice: सामने से दूर हो जा
  rationale: आज्ञार्थक לֵךְ और स्थानसूचक מִנֶּגֶד मिलकर किसी के सामने अथवा पास से हट जाने का निर्देश देते हैं। यह रूप मूल की स्थान-संबंधी छवि और स्वाभाविक हिन्दी—दोनों को बनाए रखता है।
- source_word: לְאִישׁ כְּסִיל
  choice: मूर्ख मनुष्य
  rationale: אִישׁ का अर्थ ‘मनुष्य/पुरुष’ और כְּסִיל नीतिवचन साहित्य का प्रचलित शब्द ‘मूर्ख’ है। ‘मूर्ख मनुष्य’ दोनों शब्दों को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּבַל יָדַעְתָּ
  choice: क्योंकि ... तुझे ... नहीं मिलेगी
  rationale: 'בַל काव्यात्मक निषेध है और יָדַעְתָּ का पूर्ण रूप यहाँ सामान्य अथवा परिणामसूचक भाव दे सकता है। प्रसंग में यह आज्ञा का कारण बताता है: मूर्ख के पास ज्ञानपूर्ण वाणी उपलब्ध नहीं होगी।'
- source_word: שִׂפְתֵי דָעַת
  choice: उसके होंठों से ... ज्ञान की बात
  rationale: शाब्दिक अर्थ ‘ज्ञान के होंठ’ है। हिन्दी में ‘होंठों से ज्ञान की बात’ मूल की शारीरिक छवि को रखते हुए उसके आशय—ज्ञानपूर्ण वचन—को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। एकवचन पुल्लिंग आज्ञा के लिए ‘हो जा’ और ‘तुझे’ मूल के सीधे संबोधन को रखते हैं। मुख्य पाठ अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी मूल की असामान्य रचना और वैकल्पिक समझ को सुरक्षित रखती है।
