  text: עֲטֶ֣רֶת חֲכָמִ֣ים עָשְׁרָ֑/ם אִוֶּ֖לֶת כְּסִילִ֣ים אִוֶּֽלֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/024.yaml
  text: The crown of the wise is their wealth[a], but the folly of fools is folly.
translation:
  language: hi
  text: 'बुद्धिमानों का मुकुट उनका धन है,

    पर मूर्खों की मूर्खता मूर्खता ही है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कुछ प्राचीन अनुवादों और व्याख्याकारों के अनुसार, “मूर्खों का धन मूर्खता है।” मसोरेटिक पाठ का शाब्दिक अर्थ है, “मूर्खों की मूर्खता मूर्खता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: यह संज्ञा सम्मान और प्रतिष्ठा के दृश्यमान चिह्न के रूप में मुकुट या पुष्पमाला को दर्शाती है। हिंदी में “मुकुट” रूपक को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: חֲכָמִים
  choice: बुद्धिमानों
  rationale: बहुवचन रूप सामान्यतः बुद्धिमान लोगों को दर्शाता है; “बुद्धिमानों” आधुनिक हिंदी में स्वाभाविक है और अनावश्यक रूप से पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: עָשְׁרָם
  choice: उनका धन
  rationale: עֹשֶׁר का अर्थ धन या संपत्ति है और प्रत्यय तीसरे पुरुष बहुवचन का है। “उनका धन” संक्षिप्त, स्पष्ट और मूल के निकट है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह शब्द विवेकहीनता और मूर्ख स्वभाव को व्यक्त करता है। “मूर्खता” हिंदी नीतिवचन की शैली में सहज है और मूल की पुनरुक्ति को बनाए रखता है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: नीति-साहित्य में यह नैतिक और बौद्धिक रूप से विवेकहीन लोगों के लिए प्रयुक्त होता है; “मूर्खों” इसका सीधा और प्रचलित हिंदी समतुल्य है।
- source_word: אִוֶּלֶת כְּסִילִים אִוֶּלֶת
  choice: मूर्खों की मूर्खता मूर्खता ही है
  rationale: मसोरेटिक पाठ में אִוֶּלֶת की पुनरावृत्ति जानबूझकर की गई बलाघाती उक्तिपुनरुक्ति प्रतीत होती है। “ही” हिंदी में उस बल को स्वाभाविक बनाता है, बिना अर्थ को किसी वैकल्पिक पाठ की ओर मोड़े।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और नीतिवचन-सुलभ रखी गई है। पंक्ति-विभाजन समानांतरता को स्पष्ट करता है। मसोरेटिक पाठ की कठिन किंतु अर्थपूर्ण पुनरुक्ति को मुख्य पाठ में सुरक्षित रखा गया है; चूँकि मुख्य पाठ सीधे उपलब्ध हिब्रू का अनुसरण करता है, वैकल्पिक प्राचीन-पाठ संबंधी टिप्पणी आवश्यक नहीं मानी गई।
