  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: גַּם בִּ/שְׂח֥וֹק יִכְאַב לֵ֑ב וְ/אַחֲרִיתָ֖/הּ שִׂמְחָ֣ה תוּגָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/013.yaml
  text: Even in laughter the heart may ache[b][a], and the end of joy is grief.
translation:
  language: hi
  text: हँसी में भी हृदय दुख सकता है[a], और आनन्द का अन्त शोक है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हँसी में भी हृदय दुखता है”; इब्रानी अपूर्ण क्रिया-रूप नीतिवचन में सामान्य वर्तमान सत्य के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आनन्द का परिणाम शोक है” अथवा “आनन्द के बाद शोक आता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: 'यहाँ यह शब्द विरोधाभासी बल देता है: हँसी उपस्थित होने पर भी भीतर दुःख हो सकता है।'
- source_word: בִּשְׂחוֹק
  choice: हँसी में
  rationale: यह अनुवाद मूल के ठोस बिम्ब और בְּ उपसर्ग के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִכְאַב
  choice: दुख सकता है
  rationale: अपूर्ण क्रिया-रूप नीतिवचन में सामान्य या सम्भाव्य सत्य व्यक्त कर सकता है; यह चयन उस अर्थ को अनावश्यक रूप से पूर्ण सार्वभौमिक कथन नहीं बनाता।
- source_word: לֵב
  choice: हृदय
  rationale: यह मूल के ‘हृदय’ बिम्ब को सुरक्षित रखता है और यहाँ मनुष्य के भीतरी भाव-जगत को दर्शाता है।
- source_word: וְאַחֲרִיתָהּ
  choice: और ... का अन्त
  rationale: אַחֲרִית अन्त, परिणति या अन्तिम परिणाम को सूचित कर सकता है; ‘अन्त’ मूल रूपक को संक्षिप्त और स्पष्ट ढंग से रखता है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह आधुनिक, गरिमापूर्ण और व्यापक हिन्दी शब्द है, जो शोक के साथ स्पष्ट विरोध बनाता है।
- source_word: תוּגָה
  choice: शोक
  rationale: यह गहरे दुःख के अर्थ को संक्षेप में व्यक्त करता है और आनन्द के विपरीत स्वाभाविक बैठता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण नीतिवचनात्मक स्वर रखा गया है। ‘हृदय’ मूल बिम्ब को सुरक्षित रखता है, जबकि ‘दुख सकता है’ इब्रानी क्रिया-रूप की सम्भाव्यता और सामान्य कथन—दोनों की गुंजाइश बनाए रखता है।
