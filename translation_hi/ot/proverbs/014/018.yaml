  text: The simple inherit folly[a], but the prudent are crowned with knowledge.
translation:
  language: hi
  text: भोले लोग मूर्खता के वारिस होते हैं, पर समझदार लोग ज्ञान का मुकुट धारण करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समझदार लोग ज्ञान को अपना मुकुट बनाते हैं।” इब्रानी क्रिया का अर्थ सक्रिय रूप में मुकुट पहनाना या सजाना हो सकता है; इसका अर्थ ज्ञान से सुशोभित या मुकुटधारी होना भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָחֲלוּ
  choice: के वारिस होते हैं
  rationale: यह प्रयोग किसी वस्तु को विरासत या स्थायी हिस्से के रूप में पाने का रूपक बनाए रखता है; हिन्दी में वर्तमानकालीन कहावत के रूप में स्वाभाविक है।
- source_word: פְתָאיִם
  choice: भोले लोग
  rationale: नीतिवचन में यह शब्द अनुभवहीन और आसानी से बहकाए जाने वाले व्यक्ति को दर्शाता है। ‘भोले लोग’ आधुनिक हिन्दी में स्पष्ट है और केवल बौद्धिक कमी नहीं बताता।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: यह नैतिक और व्यावहारिक विवेकहीनता के लिए प्रचलित और सीधा हिन्दी शब्द है।
- source_word: עֲרוּמִים
  choice: समझदार लोग
  rationale: इस विरोधात्मक संदर्भ में शब्द का सकारात्मक अर्थ विवेकी और सावधान व्यक्ति है; ‘समझदार’ सामान्य पाठक के लिए सहज है।
- source_word: יַכְתִּרוּ
  choice: मुकुट पहनते हैं
  rationale: हिफ़ील रूप में घेरने या मुकुट पहनाने/धारण करने की छवि है। सक्रिय हिन्दी रूप मूल की संभावित सक्रियता को बनाए रखता है, जबकि पाठ-टिप्पणी वैकल्पिक परिणामी अर्थ बताती है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: यह मूल शब्द का सीधा और नीतिवचन-साहित्य में उपयुक्त समतुल्य है।
