  text: חַכְמ֣וֹת נָ֭שִׁים בָּנְתָ֣ה בֵיתָ֑/הּ וְ֝/אִוֶּ֗לֶת בְּ/יָדֶ֥י/הָ תֶהֶרְסֶֽ/נּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/001.yaml
  text: The wisest of women builds her house[b][a], but a foolish woman tears it down with her own hands.
translation:
  language: hi
  text: 'सबसे बुद्धिमान स्त्री[a] अपना घर[b] बनाती है,

    पर मूर्ख स्त्री अपने ही हाथों से उसे ढा देती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बुद्धिमान स्त्री अपना घर बनाती है।” इब्रानी आरंभ को उत्कृष्टतासूचक कथन के बजाय सामान्य वर्गवाचक कथन भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “घर” में केवल मकान ही नहीं, घराना या पारिवारिक व्यवस्था भी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַכְמוֹת נָשִׁים
  choice: सबसे बुद्धिमान स्त्री
  rationale: बहुवचन रूप חַכְמוֹת और נָשִׁים को यहाँ इब्रानी ज्ञान-साहित्य की उत्कृष्टतासूचक अभिव्यक्ति मानना एक स्वाभाविक संभावना है; स्त्रीलिंग एकवचन क्रिया בָּנְתָה और दूसरे चरण की एकवचन स्त्री से इसका समानांतर संबंध भी बनता है। सामान्य वर्गवाचक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: בָּנְתָה
  choice: बनाती है
  rationale: रूप पूर्णकालिक है, पर नीतिवचन में यह सार्वकालिक सामान्य सत्य व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल इस नीतिवचनात्मक बल को सहजता से देता है।
- source_word: בֵיתָהּ
  choice: अपना घर
  rationale: בַּיִת भौतिक मकान के साथ घराने या परिवार की व्यवस्था को भी सूचित कर सकता है। ‘घर’ मूल बिंब और अर्थ की व्यापकता दोनों बनाए रखता है।
- source_word: אִוֶּלֶת
  choice: मूर्ख स्त्री
  rationale: स्त्रीलिंग एकवचन क्रिया और पहले चरण की स्त्री के साथ विरोधात्मक समानांतरता के कारण अमूर्त ‘मूर्खता’ के बजाय व्यक्तिवाचक अर्थ अधिक स्वाभाविक है।
- source_word: בְּיָדֶיהָ
  choice: अपने ही हाथों से
  rationale: यह साधन और व्यक्तिगत उत्तरदायित्व दोनों पर बल देता है; ‘ही’ हिन्दी में उस जोर को स्वाभाविक रूप से प्रकट करता है।
- source_word: תֶהֶרְסֶנּוּ
  choice: उसे ढा देती है
  rationale: הרס का अर्थ किसी बनी हुई वस्तु को गिराना या ध्वस्त करना है। ‘ढा देती है’ ‘बनाती है’ के साथ ठोस और सजीव विरोध बनाए रखता है; सर्वनाम घर की ओर संकेत करता है।
