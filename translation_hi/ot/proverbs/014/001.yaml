translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और नीतिवचनात्मक शैली रखी गई है। ‘अपना’ और ‘अपने ही’ स्वाभाविक हिन्दी संबंध तथा कर्ता की व्यक्तिगत भूमिका स्पष्ट करते हैं। पादटिप्पणी चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [a][b] के अनुसार लगाए गए हैं।
