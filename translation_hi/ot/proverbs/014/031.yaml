source:
  edition: WLC
  text: עֹ֣שֵֽׁק דָּ֭ל חֵרֵ֣ף עֹשֵׂ֑/הוּ וּ֝/מְכַבְּד֗/וֹ חֹנֵ֥ן אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/014/031.yaml
  text: Whoever oppresses the poor insults his Maker[a], but whoever is gracious to the needy honors him.
translation:
  language: hi
  text: जो निर्धन पर अत्याचार करता है, वह उसके रचनेवाले का अपमान करता है; पर जो ज़रूरतमंद पर कृपा करता है, वह उसके रचनेवाले का आदर करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשֵׁק
  choice: जो ... अत्याचार करता है
  rationale: काल कृदन्त यहाँ सामान्य व्यक्ति को सूचित करता है; ‘अत्याचार करता है’ अन्यायपूर्ण दबाव और शोषण का स्वाभाविक हिन्दी भाव देता है।
- source_word: דָּל
  choice: निर्धन
  rationale: यह शब्द आर्थिक अभाव के साथ सामाजिक दुर्बलता भी व्यक्त कर सकता है; ‘निर्धन’ इस नीति-वचन में स्पष्ट और गरिमापूर्ण है।
- source_word: חֵרֵף
  choice: अपमान करता है
  rationale: क्रिया में निन्दा, तिरस्कार और अवमानना का भाव है; ‘अपमान करता है’ आधुनिक हिन्दी में इस आशय को सहजता से व्यक्त करता है।
- source_word: עֹשֵׂהוּ
  choice: उसके रचनेवाले
  rationale: प्रत्यय का स्वाभाविक पूर्वपद निर्धन व्यक्ति है; वाक्य कहता है कि निर्धन को सताने वाला उसके सृष्टिकर्ता का अपमान करता है। ‘रचनेवाला’ सहज और संक्षिप्त है।
- source_word: וּמְכַבְּדוֹ
  choice: वह उसका आदर करता है
  rationale: प्रत्यय व्याकरणतः निर्धन व्यक्ति अथवा उसके रचनेवाले की ओर संकेत कर सकता है। मुख्य पाठ में समानांतरता के आधार पर इसे रचनेवाले, अर्थात परमेश्वर, से जोड़ा गया है और अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: חֹנֵן
  choice: कृपा करता है
  rationale: यह कृदन्त अनुग्रह अथवा उदार दया दिखाने का अर्थ रखता है; ‘कृपा करता है’ मूल के अनुग्रह-भाव को बनाए रखता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: यह शब्द अभाव और आवश्यकता पर बल देता है; ‘ज़रूरतमंद’ पहले पद के דָּל से अर्थगत भेद भी बनाए रखता है।
theological_decisions:
- issue: וּמְכַבְּדוֹ के प्रत्यय का संदर्भ
  choice: 'मुख्य पाठ में ‘उसका’ परमेश्वर, अर्थात निर्धन के रचनेवाले, की ओर संकेत करता है: ज़रूरतमंद पर कृपा करना परमेश्वर का आदर करना है।'
  alternative: 'प्रत्यय निर्धन व्यक्ति की ओर संकेत कर सकता है: ‘पर जो निर्धन का आदर करता है, वह ज़रूरतमंद पर कृपा करता है।’'
  rationale: विरोधात्मक समानांतरता पहले अर्धपद के ‘उसके रचनेवाले का अपमान’ के सामने दूसरे अर्धपद में उसी रचनेवाले के ‘आदर’ को रखने का समर्थन करती है। फिर भी इब्रानी प्रत्यय स्वयं दोनों संदर्भों की अनुमति देता है, इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण नीतिवचनात्मक रूप। ‘निर्धन’ और ‘ज़रूरतमंद’ मूल के दो अलग शब्दों का अर्थगत अंतर बनाए रखते हैं। दिव्य संदर्भ को बड़े अक्षर जैसी हिन्दी में अनुपलब्ध परंपरा से कृत्रिम रूप से चिह्नित नहीं किया गया; आवश्यक स्पष्टीकरण पादटिप्पणी में है।
