- source_word: וּלְרוֹזְנִים
  choice: और न शासकों के लिए
  rationale: רוֹזְנִים उच्च पदस्थ शासनकर्ताओं या अधिकारियों को दर्शाता है। ‘शासक’ राजाओं के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: או שֵׁכָר
  choice: नशीले पेय की लालसा करना
  rationale: यह संक्षिप्त और कठिन इब्रानी अभिव्यक्ति संभवतः नशीला पेय ढूँढ़ने या चाहने का भाव देती है। सहज मुख्य पाठ में यह अर्थ रखा गया है, जबकि अधिक शाब्दिक प्रश्नवाचक रूप पादटिप्पणी में दिया गया है।
