  yaml_path: translation/ot/proverbs/031/028.yaml
  text: 'Her children rise up and call her blessed[a]; her husband also[b], and he praises her:'
translation:
  language: hi
  text: 'उसके बच्चे[a] उठ खड़े होते हैं और उसे धन्य[b] ठहराते हैं; उसका पति भी उसकी प्रशंसा करता है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके पुत्र।’ इब्रानी בָנֶיהָ का अर्थ विशेष रूप से पुत्र या अधिक व्यापक रूप से बच्चे हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे सुखी/भाग्यशाली घोषित करते हैं।’ इब्रानी क्रिया का भाव किसी को धन्य, सुखी या भाग्यशाली ठहराने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָמוּ
  choice: उठ खड़े होते हैं
  rationale: קום का मूल अर्थ उठना या खड़ा होना है। यहाँ यह अभिव्यक्ति सम्मान प्रकट करने की ठोस क्रिया को बनाए रखती है और नीतिवचन 31 के वर्णनात्मक संदर्भ में स्वाभाविक वर्तमान काल देती है।
- source_word: בָנֶיהָ
  choice: उसके बच्चे
  rationale: בנים का अर्थ विशेष रूप से ‘पुत्र’ और व्यापक रूप से ‘बच्चे’ दोनों हो सकता है। पारिवारिक प्रशंसा के इस संदर्भ में ‘बच्चे’ सामूहिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; विशिष्ट विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיְאַשְּׁרוּהָ
  choice: उसे धन्य कहते हैं
  rationale: אשר के पिएल रूप का अर्थ किसी को सुखी, भाग्यशाली या धन्य घोषित करना है। ‘धन्य कहते हैं’ सार्वजनिक सराहना का भाव बनाए रखते हुए हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: בַּעְלָהּ
  choice: उसका पति
  rationale: בעל के अन्य अर्थ भी हो सकते हैं, पर इस घरेलू संदर्भ और स्त्रीलिंग संबंधसूचक प्रत्यय के साथ अर्थ स्पष्टतः ‘उसका पति’ है।
- source_word: וַיְהַלְלָהּ
  choice: उसकी प्रशंसा करता है
  rationale: הלל का सीधा अर्थ प्रशंसा करना है। यह चयन पति को एकवचन कर्ता के रूप में स्पष्ट रखता है और अगले पद में आने वाली उसकी प्रशंसा की भूमिका से स्वाभाविक रूप से जुड़ता है।
- source_word: וְ (before בַּעְלָהּ)
  choice: भी
  rationale: संयोजक यहाँ बच्चों के बाद पति की समानांतर, अतिरिक्त प्रतिक्रिया प्रस्तुत करता है। आधुनिक हिन्दी में ‘भी’ इस योगात्मक बल को सहजता से व्यक्त करता है।
