  text: גְּמָלַ֣תְ/הוּ ט֣וֹב וְ/לֹא רָ֑ע כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/012.yaml
  text: She does him good[a], and not harm, all the days of her life.
translation:
  language: hi
  text: वह जीवन भर उसका भला करती है[a], बुरा नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उसे भलाई का प्रतिफल देती है, बुराई का नहीं।” इब्रानी क्रिया में किसी के साथ व्यवहार करने या उसे प्रतिफल देने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּמָלַתְהוּ
  choice: उसका ... करती है
  rationale: גמל किसी के साथ व्यवहार करने, उसे प्रतिफल देने या उसका बदला चुकाने का अर्थ दे सकता है। यहाँ טוֹב और רָע के साथ यह पति के प्रति लगातार भला या बुरा करने का भाव व्यक्त करता है; इसलिए सहज हिन्दी में 'उसका भला करती है' चुना गया है।
- source_word: טוֹב
  choice: भला
  rationale: טוֹב यहाँ संज्ञात्मक रूप में 'भलाई' या 'जो अच्छा है' के अर्थ में है। 'भला' इस संबंधपरक संदर्भ में स्वाभाविक और सीधा है।
- source_word: וְלֹא רָע
  choice: बुरा नहीं
  rationale: רָע का अर्थ नैतिक बुराई या किसी को होने वाली हानि दोनों हो सकता है। 'बुरा नहीं' मूल के व्यापक विरोध—भला बनाम बुरा—को बनाए रखता है और अनावश्यक रूप से केवल शारीरिक या व्यावहारिक हानि तक सीमित नहीं करता।
- source_word: כֹּל יְמֵי חַיֶּיהָ
  choice: जीवन भर
  rationale: शाब्दिक अर्थ 'उसके जीवन के सब दिन' है। आधुनिक हिन्दी में 'जीवन भर' उसी निरंतर कालगत भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिन्दी में स्वाभाविक शब्दक्रम के लिए कालवाचक पद 'जीवन भर' आरंभ में रखा गया है। स्त्रीलिंग कर्ता पिछले पद के संदर्भ से स्पष्ट है, और 'उसका' पति की ओर संकेत करता है।
