lexical_decisions:
- source_word: כַּפָּהּ
  choice: अपनी हथेली
  rationale: כַּף हाथ की हथेली या खोखले भाग को दर्शाता है। ‘हथेली’ खुले हाथ से उदारता करने के ठोस बिंब को बनाए रखता है।
- source_word: פָּרְשָׂה
  choice: खोलती है
  rationale: פרשׂ का अर्थ फैलाना या आगे करना है। ‘हथेली’ के साथ ‘खोलती है’ स्वाभाविक हिन्दी है और उदारता के लिए खुले हाथ का बिंब सुरक्षित रखता है।
- source_word: לֶעָנִי
  choice: गरीब के लिए
  rationale: עָנִי गरीब, पीड़ित या सामाजिक रूप से असहाय व्यक्ति को सूचित कर सकता है। यहाँ सहायता के संदर्भ में आर्थिक और सामाजिक अभाव का अर्थ प्रमुख है; ל को ‘के लिए’ कहना उसके हित में किए गए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָדֶיהָ
  choice: अपने हाथ
  rationale: यह रूप उसके दोनों हाथों की ओर संकेत करता है। हिन्दी में ‘अपने हाथ’ स्वाभाविक है और कर्ता से संबंध भी स्पष्ट करता है।
- source_word: שִׁלְּחָה
  choice: बढ़ाती है
  rationale: שלח का पिएल रूप भेजने, आगे करने या फैलाने का भाव दे सकता है। हाथों के साथ ‘बढ़ाती है’ सहायता हेतु उनकी ओर हाथ ले जाने का स्वाभाविक और गरिमापूर्ण चित्र देता है।
- source_word: לָאֶבְיוֹן
  choice: ज़रूरतमंद की ओर
  rationale: אֶבְיוֹן अभावग्रस्त या जरूरत में पड़े व्यक्ति को दर्शाता है। ‘ज़रूरतमंद’ पहले चरण के ‘गरीब’ से शब्दगत भेद बनाए रखता है, और ‘की ओर’ हाथ बढ़ाने की दिशा को स्पष्ट करता है।
