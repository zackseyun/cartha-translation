source:
  edition: WLC
  text: יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח רִישׁ֑/וֹ וַ֝/עֲמָל֗/וֹ לֹ֣א יִזְכָּר עֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/007.yaml
  text: Let him drink and forget his poverty[a], and remember his trouble no more.
translation:
  language: hi
  text: 'वह पीए और अपनी गरीबी भूल जाए,

    और अपने दुःख[a] को फिर कभी याद न करे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने परिश्रम’ या ‘अपने कष्ट’ को। हिब्रू शब्द का अर्थ परिश्रम, कठिनाई, कष्ट या विपत्ति हो सकता है।
    reason: हिब्रू עָמָלוֹ के अर्थ-क्षेत्र को स्पष्ट करता है और पादटिप्पणी को उसके सही मुख्य-पाठ शब्द ‘दुःख’ से जोड़ता है।
lexical_decisions:
- source_word: יִשְׁתֶּה
  choice: वह पीए
  rationale: संदर्भ में अपूर्ण क्रिया इच्छासूचक/अनुमतिसूचक भाव रखती है। हिंदी में “वह पीए” इस भाव को स्वाभाविक रूप से व्यक्त करता है और इसे साधारण भविष्यकाल नहीं बनाता।
- source_word: וְיִשְׁכַּח
  choice: और ... भूल जाए
  rationale: वाव के साथ अपूर्ण क्रिया पूर्ववर्ती इच्छासूचक प्रवाह को आगे बढ़ाती है। “और ... भूल जाए” उद्देश्य अथवा परिणाम में से किसी एक को अनावश्यक रूप से निश्चित किए बिना समानांतर क्रियात्मक प्रवाह बनाए रखता है।
- source_word: רִישׁוֹ
  choice: अपनी गरीबी
  rationale: רִישׁ निर्धनता या अभाव की दशा को दर्शाता है। “गरीबी” सीधा, प्रचलित और सामान्य पाठकों के लिए स्पष्ट रूप है।
- source_word: וַעֲמָלוֹ
  choice: अपना दुःख
  rationale: עָמָל का अर्थ परिश्रम, कष्ट, दुःख या विपत्ति हो सकता है। इस प्रसंग में “दुःख” व्यक्ति की व्यापक पीड़ा को स्वाभाविक हिंदी में व्यक्त करता है, जबकि शब्द की अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לֹא יִזְכָּר עוֹד
  choice: फिर याद न करे
  rationale: निषेध के साथ עוֹד किसी बात के आगे से न होने का भाव देता है। “फिर याद न करे” संक्षिप्त और स्वाभाविक हिंदी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता बनाए रखने वाला अनुवाद। मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं रखा गया, क्योंकि दी गई अंग्रेज़ी पादटिप्पणी का [a] चिह्न अंग्रेज़ी पाठ में “poverty” के बाद है, जबकि उसका विषय वास्तव में दूसरे पदांश का עָמָל (“trouble/toil”) है; गलत स्थान पर चिह्न लगाने के बजाय प्रकाशन से पहले स्रोत-संरेखन की जाँच आवश्यक है।
