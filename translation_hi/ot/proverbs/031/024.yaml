  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘कनानी को’; यहाँ इसका अर्थ संभवतः ‘व्यापारी’ या ‘सौदागर’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘कमर के पटके।’
    reason: lexical_alternative
lexical_decisions:
- source_word: סָדִין
  choice: सन के वस्त्र
  rationale: यह शब्द सन के महीन कपड़े से बनी वस्तु या परिधान को दर्शाता है। व्यापारिक प्रसंग में तैयार माल अभिप्रेत है, इसलिए बहुवचन ‘सन के वस्त्र’ स्वाभाविक है; ‘कपड़ा’ भी संभव है।
- source_word: עָשְׂתָה
  choice: बनाकर
  rationale: इब्रानी पूर्ण क्रिया यहाँ स्त्री के नियमित काम का चित्रण करती है। अगली क्रिया के साथ ‘बनाकर बेचती है’ आधुनिक हिन्दी में उसके अभ्यस्त कार्य को सहज रूप से व्यक्त करता है।
- source_word: וַתִּמְכֹּר
  choice: बेचती है
  rationale: काव्य में उसके नियमित उद्यम का वर्णन जारी है, इसलिए वर्तमानकालिक अभ्यस्त रूप उपयुक्त है।
- source_word: חֲגוֹר
  choice: कमरबंद
  rationale: यह कमर पर पहनी जाने वाली वस्तु है। ‘कमरबंद’ आधुनिक हिन्दी में स्पष्ट है और पटके या पेटी जैसे अधिक विशिष्ट रूप को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: נָתְנָה
  choice: देती है
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है। व्यापारिक संदर्भ में इसमें माल पहुँचाने या उपलब्ध कराने का भाव हो सकता है, पर ‘देती है’ मूल की व्यापकता बनाए रखता है।
- source_word: לַכְּנַעֲנִי
  choice: व्यापारी को
  rationale: शाब्दिक अर्थ ‘कनानी को’ है, किंतु इस व्यापारिक प्रसंग में ‘कनानी’ व्यापारी या सौदागर के लिए प्रयुक्त होने की प्रबल संभावना है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
