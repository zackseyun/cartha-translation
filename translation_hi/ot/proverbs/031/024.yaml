  text: She makes linen garments and sells them[c][b][a], and supplies belts to the merchant.
translation:
  language: hi
  text: वह सन के वस्त्र[a] बनाकर बेचती है, और व्यापारी[b] को कमरबंद[c] देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सन का कपड़ा’ अथवा ‘महीन सन के वस्त्र।’
