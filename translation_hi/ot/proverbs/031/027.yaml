  text: She watches over the ways of her household[b][a], and does not eat the bread of idleness.
translation:
  language: hi
  text: वह अपने घर के कामकाज पर नज़र रखती है[a], और आलस्य की रोटी नहीं खाती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने घर की गतिविधियों पर अच्छी तरह ध्यान देती है।” इब्रानी में शाब्दिक रूप से “उसके घर की गतियों/चलन” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: “आलस्य की रोटी खाना” एक इब्रानी रूपक है, जिसका अर्थ आलसी जीवन बिताना या बिना परिश्रम के सुख पर पलना है।
    reason: cultural_note
lexical_decisions:
- source_word: צוֹפִיָּה
  choice: ध्यान रखती है
  rationale: यह स्त्रीलिंग एकवचन कृदन्त निरंतर और सजग निगरानी का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और सक्रिय अभिव्यक्ति है।
- source_word: הֲלִיכוֹת
  choice: चाल-चलन
  rationale: मूल शब्द का शाब्दिक अर्थ चलना-फिरना या गतिविधियाँ है। ‘चाल-चलन’ घराने की गतिविधियों और कामकाज को समेटते हुए मूल रूपक से संबंध बनाए रखता है।
- source_word: בֵּיתָהּ
  choice: अपने घराने के
  rationale: यहाँ בַּיִת केवल भवन नहीं, बल्कि घरेलू समुदाय और उसके कामकाज को सूचित करता है; इसलिए ‘घराना’ उपयुक्त है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ‘रोटी’ मूल अर्थ और आलस्य पर निर्भर जीवन के रूपक—दोनों को सुरक्षित रखती है।
- source_word: עַצְלוּת
  choice: आलस्य
  rationale: यह संज्ञा निकम्मेपन अथवा सुस्ती को दर्शाती है; ‘आलस्य’ आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: לֹא תֹאכֵל
  choice: नहीं खाती
  rationale: अपूर्ण क्रिया यहाँ भविष्य नहीं, बल्कि उसके स्वभावगत आचरण को व्यक्त करती है; सामान्य वर्तमान काल इसे ठीक से संप्रेषित करता है।
