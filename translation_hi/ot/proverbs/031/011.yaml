  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हृदय’ मूल बिंब को सुरक्षित रखता है, जबकि ‘लाभ’ पद्य के गृहस्थ और आर्थिक संदर्भ को स्पष्ट करता है।
