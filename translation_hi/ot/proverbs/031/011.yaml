  text: The heart of her husband trusts in her, and he will lack no gain.
translation:
  language: hi
  text: उसके पति का हृदय उस पर भरोसा रखता है, और उसे लाभ की कोई कमी नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּטַח
  choice: भरोसा रखता है
  rationale: यह क्रिया सुरक्षित और निश्चिंत होकर विश्वास करने का भाव व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לֵב
  choice: हृदय
  rationale: मूल पाठ के शाब्दिक बिंब को बनाए रखते हुए व्यक्ति के भीतरी विश्वास और निश्चय को व्यक्त करता है।
- source_word: שָׁלָל
  choice: लाभ
  rationale: इस शब्द का मूल अर्थ युद्ध की लूट हो सकता है, पर इस घरेलू और आर्थिक प्रसंग में इससे प्राप्ति या लाभ अभिप्रेत है; इसलिए ‘लाभ’ प्रसंगानुकूल है और अनावश्यक सैन्य बिंब से बचाता है।
- source_word: לֹא יֶחְסָר
  choice: कोई कमी नहीं होती
  rationale: हिब्रू की अभाव न होने की सामान्य अभिव्यक्ति को सहज वर्तमानकालीन हिन्दी में प्रस्तुत करता है।
theological_decisions: []
