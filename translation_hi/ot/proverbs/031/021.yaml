  yaml_path: translation/ot/proverbs/031/021.yaml
  text: She does not fear snow for her household[a], for all her household are clothed in scarlet.
translation:
  language: hi
  text: 'उसे अपने घराने के लिए बर्फ़ का भय नहीं होता,

    क्योंकि उसके घराने के सभी लोग लाल रंग के वस्त्र पहने हुए हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके घराने के सभी लोग दोहरे वस्त्र पहने हुए हैं।” कुछ लोग यहाँ इब्रानी शब्द שָׁנִים को लाल रंग के कपड़े के बजाय दुहरेपन के अर्थ में लेते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: डर नहीं होता
  rationale: यिरा का क़ाल अपूर्ण 3 स्त्रीलिंग एकवचन रूप यहाँ उसकी निरंतर निश्चिंतता व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए क्रियात्मक भाव बनाए रखता है।
- source_word: לְבֵיתָהּ
  choice: अपने घराने के लिए
  rationale: בַּיִת भौतिक घर या घराने के लोगों को सूचित कर सकता है। घरेलू देखभाल के इस प्रसंग में लोगों का समुदाय अभिप्रेत है, इसलिए ‘घराना’ उपयुक्त है।
- source_word: מִשָּׁלֶג
  choice: हिमपात का
  rationale: מִן यहाँ चिंता उत्पन्न करने वाली परिस्थिति को चिह्नित करता है। ‘हिमपात का डर’ आधुनिक हिंदी में स्वाभाविक रूप से बर्फीले मौसम से जुड़े भय को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उसकी निर्भयता का कारण प्रस्तुत करता है और दोनों पंक्तियों का स्पष्ट व्याख्यात्मक संबंध बनाए रखता है।
- source_word: לָבֻשׁ
  choice: वस्त्र पहन रखे हैं
  rationale: हिब्रू में विधेय रूपतः एकवचन है, पर ‘पूरा घराना’ सामूहिक कर्ता है। हिंदी में बहुवचन क्रिया घराने के सभी सदस्यों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: שָׁנִים
  choice: लाल रंग के वस्त्र
  rationale: इस शब्द का सामान्य अर्थ किरमिजी या गहरे लाल रंग का कपड़ा है। साधारण पाठक के लिए ‘लाल रंग के वस्त्र’ सहज है; ‘दोहरे वस्त्र’ की प्रासंगिक वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
