source:
  edition: WLC
  text: נוֹדָ֣ע בַּ/שְּׁעָרִ֣ים בַּעְלָ֑/הּ בְּ֝/שִׁבְתּ֗/וֹ עִם זִקְנֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/023.yaml
  text: Her husband is known in the gates[b][a], when he sits among the elders of the land.
translation:
  language: hi
  text: उसका पति नगर-द्वारों पर जाना-पहचाना है,[a][b] जब वह देश के बुज़ुर्गों के बीच बैठता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर-द्वारों” से आशय उस सार्वजनिक स्थान से है जहाँ नागरिक, न्यायिक और सामुदायिक मामलों का निपटारा होता था।
    reason: cultural_note
  - marker: b
    text: या “पहचाना जाता है” अथवा “सम्मानित है।” इब्रानी में शाब्दिक अर्थ “ज्ञात है” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדָע
  choice: जाना-पहचाना है
  rationale: निफ़अल रूप का मूल अर्थ ‘ज्ञात/पहचाना हुआ होना’ है। ‘जाना-पहचाना’ स्वाभाविक हिन्दी में इस भाव को रखता है और इसे अनिवार्य रूप से ‘सम्मानित’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: בַּשְּׁעָרִים
  choice: नगर-द्वारों पर
  rationale: बहुवचन ‘द्वारों’ की इब्रानी छवि सुरक्षित रहती है, जबकि ‘नगर-’ जोड़ने से आधुनिक पाठक सार्वजनिक और नागरिक स्थान का आशय सहज समझ सकता है।
- source_word: בַּעְלָהּ
  choice: उसका पति
  rationale: इस घरेलू प्रसंग में בַּעַל का स्पष्ट अर्थ ‘पति’ है; ‘स्वामी’ अनावश्यक पदानुक्रम का भाव ला सकता है।
- source_word: בְּשִׁבְתּוֹ
  choice: जब वह ... बैठता है
  rationale: בְּ के साथ प्रत्यययुक्त infinitive construct यहाँ समयसूचक परिस्थिति बताता है; हिन्दी में ‘जब वह बैठता है’ स्वाभाविक है।
- source_word: עִם
  choice: के बीच
  rationale: शाब्दिक ‘के साथ’ सम्भव है, पर ‘के बीच’ बुज़ुर्गों की सभा में उसकी सहभागिता को सहज हिन्दी में व्यक्त करता है।
- source_word: זִקְנֵי אָרֶץ
  choice: देश के बुज़ुर्गों
  rationale: ‘देश के बुज़ुर्ग’ इब्रानी का व्यापक पद 그대로 रखता है; इसे ‘नगर के बुज़ुर्ग’ बनाकर संकुचित नहीं किया गया। ‘बुज़ुर्ग’ यहाँ समुदाय के वरिष्ठ अगुओं को सूचित करता है।
