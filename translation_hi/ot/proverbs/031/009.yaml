  yaml_path: translation/ot/proverbs/031/009.yaml
  text: Open your mouth[a], judge righteously, and plead the cause of the poor and needy.
translation:
  language: hi
  text: 'अपना मुँह खोलो[a], न्याय से फैसला करो,

    और गरीबों और ज़रूरतमंदों के पक्ष में न्याय करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आवाज़ उठाओ।”
    reason: פְּתַח פִּיךָ का शाब्दिक अर्थ “अपना मुँह खोलो” है, जबकि प्रसंग में इसका आशय निर्भीक होकर बोलना है।
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: अपना मुँह खोलो
  rationale: इब्रानी के शाब्दिक बिंब को बनाए रखता है; हिन्दी में भी यह बोलने के स्पष्ट आह्वान के रूप में समझा जा सकता है।
- source_word: שְׁפָט צֶדֶק
  choice: न्यायपूर्वक न्याय करो
  rationale: आज्ञार्थक שׁפט का न्यायिक अर्थ और צֶדֶק का क्रियाविशेषणात्मक भाव दोनों सुरक्षित रहते हैं।
- source_word: וְדִין
  choice: मुकदमे का न्याय करो
  rationale: דין यहाँ न्याय करने, किसी का मुकदमा सुनने या उसके पक्ष की पैरवी करने के अर्थ-क्षेत्र में है। यह रूप राजा की न्यायिक भूमिका के अनुकूल है और मूल की संभावित व्यापकता को पूरी तरह केवल ‘पैरवी’ तक सीमित नहीं करता।
- source_word: עָנִי
  choice: दीन
  rationale: शब्द की गरीबी और दुःख-दमन से जुड़ी अर्थछाया को संक्षेप में व्यक्त करता है।
- source_word: אֶבְיוֹן
  choice: ज़रूरतमंद
  rationale: अभाव और आवश्यकता के भाव को व्यक्त करता है तथा עָנִי के साथ अनावश्यक पुनरुक्ति से बचाता है।
