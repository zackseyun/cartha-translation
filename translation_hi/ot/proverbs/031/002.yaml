  text: מַה בְּ֭רִ/י וּ/מַֽה בַּר בִּטְנִ֑/י וּ֝/מֶה בַּר נְדָרָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/002.yaml
  text: What[a], my son? And what, son of my womb? And what, son of my vows?
translation:
  language: hi
  text: क्या[a], मेरे बेटे? और क्या, मेरी कोख के बेटे? और क्या, मेरी मन्नतों के बेटे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप में: “मैं क्या कहूँ, मेरे बेटे? मैं क्या कहूँ, मेरी कोख के बेटे? मैं क्या कहूँ, मेरी मन्नतों के बेटे?” इब्रानी में भावपूर्ण प्रभाव के लिए प्रश्नवाचक “क्या” तीन बार दोहराया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: क्या
  rationale: तीन बार आए प्रश्नवाचक शब्द को संक्षिप्त रूप में रखा गया है, ताकि इब्रानी की भावपूर्ण, अधूरी और आग्रहपूर्ण पुनरावृत्ति बनी रहे।
- source_word: בְּרִי
  choice: मेरे बेटे
  rationale: בַּר पर प्रथम पुरुष एकवचन प्रत्यय है; ‘मेरे बेटे’ मातृ-संबोधन और पुल्लिंग दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בַּר
  choice: …के बेटे
  rationale: हर बार उसी पुल्लिंग संज्ञा का अनुवाद ‘बेटे’ किया गया है, जिससे काव्यात्मक त्रिक और मूल का लिंग-सूचक रूप बना रहता है।
- source_word: בִּטְנִי
  choice: मेरी कोख
  rationale: मातृ-संदर्भ में בֶּטֶן गर्भ/कोख को सूचित करता है। ‘कोख’ आधुनिक हिन्दी में स्वाभाविक, आत्मीय और सटीक है।
- source_word: נְדָרָי
  choice: मेरी मन्नतों
  rationale: נֶדֶר का अर्थ मन्नत या व्रत है। ‘मन्नतों’ बहुवचन और माता के निजी संबंध को बनाए रखता है, पर उन मन्नतों की विषयवस्तु नहीं बताता।
theological_decisions:
- issue: तीन बार आए अधूरे प्रश्न का आशय
  choice: ‘क्या ...? और क्या ...? और क्या ...?’ के रूप में संक्षिप्त पुनरावृत्ति रखी गई है।
  alternative: ‘मैं क्या कहूँ ...?’ जोड़कर वाक्य को पूरा करना।
  rationale: इब्रानी में क्रिया नहीं है और कथन जानबूझकर भावपूर्ण तथा संक्षिप्त है। मुख्य पाठ में इस तनाव को सुरक्षित रखा गया है; सम्भावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- issue: पुत्र के लिए लिंग-सूचक शब्द
  choice: तीनों स्थानों पर ‘बेटा’ रखा गया है।
  alternative: लिंग-निरपेक्ष ‘सन्तान’ या ‘बच्चा’।
  rationale: मूल में पुल्लिंग בַּר तीन बार आया है; इसलिए उसे निरपेक्ष न बनाकर मातृ-संबोधन के रूप में सुरक्षित रखा गया है।
- issue: मन्नतों का पुत्र से संबंध
  choice: ‘मेरी मन्नतों के बेटे’—संबंध को खुला रखा गया है।
  alternative: ‘जिसे मैंने मन्नत माँगकर पाया’ या ‘जिसे मैंने मन्नत में समर्पित किया’।
  rationale: पाठ यह स्पष्ट नहीं करता कि मन्नतें गर्भधारण, जन्म, समर्पण या किसी अन्य बात से जुड़ी थीं; अतः किसी एक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, आत्मीय और काव्यात्मक रखी गई है। ‘कोख’ मातृ-संदर्भ में ‘गर्भ’ से अधिक स्वाभाविक है। ‘मन्नतों के बेटे’ सामान्य गद्य में असामान्य होते हुए भी मूल की सघन काव्यात्मक अभिव्यक्ति और अर्थगत खुलापन बनाए रखता है।
