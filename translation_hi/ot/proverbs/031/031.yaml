lexical_decisions:
- source_word: תְּנוּ
  choice: दो
  rationale: נתן का बहुवचन आज्ञार्थक रूप है। ‘दो’ सीधे आदेश को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָהּ
  choice: उसे
  rationale: यह स्त्रीलिंग परोक्ष कर्म सर्वनाम कविता में वर्णित स्त्री की ओर संकेत करता है; हिन्दी में प्रसंग से लिंग स्पष्ट रहता है।
- source_word: מִפְּרִי יָדֶיהָ
  choice: उसके हाथों के फल में से
  rationale: מִן स्रोत या अंश का भाव देता है, जबकि ‘हाथों का फल’ उसके परिश्रम और उससे हुई उपज का ठोस इब्रानी बिंब बनाए रखता है।
- source_word: וִיהַלְלוּהָ
  choice: उसकी प्रशंसा करें
  rationale: संयोजक के साथ यह अपूर्ण रूप यहाँ इच्छार्थक/आज्ञार्थक भाव रखता है और आरंभिक आदेश के समानांतर है।
- source_word: מַעֲשֶׂיהָ
  choice: उसके काम
  rationale: מעשה उसके कार्यों और उपलब्धियों को दर्शाता है। ‘काम’ सामान्य आधुनिक हिन्दी में सहज है और उन कामों द्वारा उसकी प्रशंसा किए जाने के मानवीकरण को बनाए रखता है।
- source_word: בַשְּׁעָרִים
  choice: नगर-द्वारों पर
  rationale: शाब्दिक ‘द्वारों पर’ प्राचीन नगर के उस सार्वजनिक स्थान को दर्शाता है जहाँ न्याय, नागरिक व्यवहार और सम्मान की घोषणा होती थी; ‘नगर-’ जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है।
