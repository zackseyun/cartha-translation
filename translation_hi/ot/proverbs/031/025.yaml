source:
  edition: WLC
  text: עֹז וְ/הָדָ֥ר לְבוּשָׁ֑/הּ וַ֝/תִּשְׂחַ֗ק לְ/י֣וֹם אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/025.yaml
  text: Strength and dignity are her clothing[a], and she laughs at the days to come.
translation:
  language: hi
  text: 'सामर्थ्य और गरिमा उसके वस्त्र हैं,

    और वह आने वाले दिन को देखकर हँसती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह भविष्य को देखकर हँसती है”; शाब्दिक रूप से, “वह बाद वाले या अंतिम दिन पर हँसती है।”
    reason: मूल पदबंध सामान्य भविष्य, बाद वाला दिन, या अंतिम दिन का अर्थ दे सकता है। मुख्य पाठ संदर्भानुकूल अर्थ देता है और पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
lexical_decisions:
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति या सामर्थ्य को दर्शाता है। यहाँ ‘सामर्थ्य’ स्त्री के चरित्रगत बल को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הָדָר
  choice: गरिमा
  rationale: इसका अर्थ वैभव, महिमा, सम्मान या गरिमा हो सकता है। इस चरित्र-वर्णन में ‘गरिमा’ आदरणीय व्यक्तित्व को व्यक्त करती है, बिना राजसी ठाठ का अनावश्यक भाव लाए।
- source_word: לְבוּשָׁהּ
  choice: उसके वस्त्र हैं
  rationale: 'मूल में वस्त्र का रूपक है: सामर्थ्य और गरिमा वे गुण हैं जिन्हें वह मानो पहने हुए है। ‘उसके वस्त्र हैं’ इस रूपक को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।'
- source_word: וַתִּשְׂחַק
  choice: वह ... हँसती है
  rationale: क्रिया का सीधा अर्थ ‘हँसना’ है। यह भविष्य के सामने उसके निर्भय आत्मविश्वास का सजीव चित्र बनाए रखता है; ‘मुस्कराती’ अपेक्षाकृत हल्का और ‘आनन्दित होती’ अधिक व्याख्यात्मक होता।
- source_word: לְיוֹם אַחֲרוֹן
  choice: आनेवाले दिन पर
  rationale: शाब्दिक रूप से यह ‘बाद के/अंतिम दिन’ की ओर संकेत करता है। नीतिवचन के संदर्भ में ‘आनेवाले दिन’ सामान्य भविष्य का स्वाभाविक अर्थ देता है, जबकि वचन में एकवचन ‘दिन’ को भी बनाए रखता है।
theological_decisions:
- issue: אַחֲרוֹן का संभावित अंतकाल-संबंधी अर्थ
  choice: 'ज्ञान-साहित्य के संदर्भ में सामान्य भविष्य: ‘आनेवाले दिन’'
  alternative: ‘अंतिम दिन’ या ‘बाद के दिन’
  rationale: इस प्रसंग में स्त्री की दूरदर्शिता और भविष्य के प्रति निर्भयता प्रमुख है, अंतिम न्याय का स्पष्ट सिद्धांत नहीं। फिर भी मूल शब्द की ‘अंतिम/बाद का’ अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और काव्यात्मक शैली। ‘वस्त्र’ का मूल रूपक तथा ‘हँसती है’ की सजीवता सुरक्षित रखी गई है।
