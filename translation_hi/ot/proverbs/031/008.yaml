  yaml_path: translation/ot/proverbs/031/008.yaml
  text: Open your mouth for the mute[a], for the cause of all the passing away.
translation:
  language: hi
  text: मूक के लिए अपना मुँह खोल; उन सबके मुकदमे की पैरवी कर, जो मिटते जा रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेसहारों के हक़ के लिए,” “जो नाश होते जा रहे हैं, उन सबके मुकदमे के लिए,” अथवा “नश्वरता के सभी पुत्रों के मुकदमे के लिए।” यहाँ प्रयुक्त इब्रानी पदबंध कठिन है, विशेषकर दुर्लभ शब्द חֲלוֹף।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּתַח פִּיךָ
  choice: अपना मुँह खोल
  rationale: शाब्दिक बिंब और एकवचन पुल्लिंग आज्ञार्थक बल को बनाए रखता है; अगले वाक्यांश में इसी का स्वाभाविक आशय ‘पैरवी कर’ से स्पष्ट होता है।
- source_word: לְאִלֵּם
  choice: मूक के लिए
  rationale: אִלֵּם ऐसे व्यक्ति को दर्शाता है जो बोल नहीं सकता। ‘मूक’ संक्षिप्त, गरिमापूर्ण और मूल के निकट है।
- source_word: אֶל־דִּין
  choice: मुकदमे की पैरवी कर
  rationale: דִּין यहाँ न्यायिक मामले या दावे का बोध देता है। हिंदी में केवल ‘मुकदमे के लिए अपना मुँह खोल’ की अपेक्षा ‘पैरवी कर’ अधिक स्वाभाविक है और न्यायिक आशय को सुरक्षित रखता है।
- source_word: כָּל בְּנֵי חֲלוֹף
  choice: उन सबके … जो मिटते जा रहे हैं
  rationale: בְּנֵי को किसी वर्ग के लोगों के लिए प्रयुक्त इब्रानी मुहावरे के रूप में लिया गया है। दुर्लभ חֲלוֹף के ‘बीतने/मिटने’ से जुड़े संभावित अर्थ को अनिश्चितता मिटाए बिना व्यक्त किया गया है।
