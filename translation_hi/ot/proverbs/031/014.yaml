id: PRO.31.14
reference: Proverbs 31:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָ֭יְתָה כָּ/אֳנִיּ֣וֹת סוֹחֵ֑ר מִ֝/מֶּרְחָ֗ק תָּבִ֥יא לַחְמָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/014.yaml
  text: She is like merchant ships[a]; from far away she brings her food.
translation:
  language: hi
  text: वह व्यापारी जहाज़ों के समान है; वह दूर से अपना भोजन[a] लाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “अपनी रोटी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: वह ... है
  rationale: यह क़ाल पूर्ण रूप है, पर नीतिवचन के इस प्रसंग में स्त्री के सामान्य और निरंतर चरित्र का वर्णन करता है; इसलिए हिन्दी में वर्तमान काल स्वाभाविक है।
- source_word: כָּאֳנִיּוֹת סוֹחֵר
  choice: व्यापारी जहाज़ों के समान
  rationale: כ तुलना प्रकट करता है, אֳנִיּוֹת का अर्थ बहुवचन में 'जहाज़' है, और סוֹחֵר व्यापार से उनका संबंध बताता है। संयुक्त पद का यह अनुवाद मूल उपमा को स्पष्ट और स्वाभाविक रखता है।
- source_word: מִמֶּרְחָק
  choice: दूर से
  rationale: מִן और מֶרְחָק का मेल किसी दूर स्थान से आने का भाव देता है; 'दूर से' संक्षिप्त और सहज हिन्दी है।
- source_word: תָּבִיא
  choice: लाती है
  rationale: בוא का हिफ़ील रूप यहाँ वस्तु को ले आने के अर्थ में है। स्त्रीलिंग कर्ता के अनुसार 'लाती है' उपयुक्त है।
- source_word: לַחְמָהּ
  choice: अपना भोजन
  rationale: לֶחֶם का शाब्दिक अर्थ 'रोटी' है, पर यह व्यापक रूप से भोजन भी दर्शाता है। घर के लिए सामग्री जुटाने के संदर्भ में 'भोजन' अर्थ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन की काव्यात्मक उपमा के अनुरूप भाषा रखी गई है। 'व्यापारी जहाज़' सामान्य पाठक के लिए स्पष्ट है, और अर्धविराम दोनों समानांतर कथनों को जोड़ता है।
