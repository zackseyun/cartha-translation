lexical_decisions:
- source_word: מַרְבַדִּים
  choice: ओढ़ने-बिछाने की वस्तुएँ
  rationale: यह बहुवचन संज्ञा फैलाए जाने वाले वस्त्रों के लिए व्यापक शब्द है, सम्भवतः पलंग या घर में काम आने वाले कीमती आवरण। हिन्दी में यह चयन अर्थ को अनावश्यक रूप से केवल चादर, पलंगपोश या सजावटी कपड़े तक सीमित नहीं करता।
- source_word: עָשְׂתָה
  choice: बनाती है
  rationale: काव्यात्मक चित्रण में पूर्ण रूप स्त्री के स्वभावगत और नियमित कार्य को व्यक्त करता है; इसलिए वर्तमान काल स्वाभाविक है।
- source_word: לָּהּ
  choice: अपने लिए
  rationale: लामेद और स्त्रीलिंग प्रत्यय लाभ अथवा अपने उपयोग का भाव देते हैं; यहाँ ‘अपने लिए’ उसी भाव को स्पष्ट करता है।
- source_word: שֵׁשׁ
  choice: बढ़िया मलमल
  rationale: यह उच्च कोटि के महीन सन-वस्त्र का द्योतक है। आधुनिक हिन्दी में ‘बढ़िया मलमल’ उसकी महीनता और मूल्य दोनों को सहज रूप से व्यक्त करता है।
- source_word: אַרְגָּמָן
  choice: बैंजनी वस्त्र
  rationale: यह बैंजनी रंग से रंगे मूल्यवान कपड़े को दर्शाता है। ‘वस्त्र’ जोड़ने से हिन्दी में स्पष्ट होता है कि बात केवल रंग की नहीं, पहनावे की है।
- source_word: לְבוּשָׁהּ
  choice: उसका पहनावा
  rationale: एकवचन संज्ञा यहाँ सामूहिक अर्थ में परिधान को सूचित करती है; ‘पहनावा’ किसी एक वस्त्र तक अर्थ को सीमित नहीं करता।
