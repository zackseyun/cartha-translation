source:
  edition: WLC
  text: תְּנוּ שֵׁכָ֣ר לְ/אוֹבֵ֑ד וְ֝/יַיִן לְ/מָ֣רֵי נָֽפֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/006.yaml
  text: Give strong drink to one who is perishing[b][a], and wine to those bitter in soul.
translation:
  language: hi
  text: नाश होने वाले को मादक पेय दो,[a] और मन में कड़वाहट रखने वालों को दाखमधु दो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरने वाले को।” इब्रानी कृदन्त का अर्थ व्यापक रूप से ऐसे व्यक्ति से हो सकता है जो नाश हो रहा है, बरबाद हो रहा है, या मृत्यु के निकट है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “प्राण के कड़वे लोगों को”; यह गहरी भीतरी पीड़ा या दुर्दशा का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ
  choice: दो
  rationale: נתן के बहुवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: שֵׁכָר
  choice: मदिरा
  rationale: दाखमधु से भिन्न मादक पेय का सामान्य अर्थ; हिन्दी में संक्षिप्त और सहज, यद्यपि पेय का विशिष्ट प्रकार निर्धारित नहीं करता।
- source_word: לְאוֹבֵד
  choice: नाश होनेवाले को
  rationale: אבד के कृदन्त का व्यापक भाव बनाए रखता है—वह जो नाश हो रहा है, बरबाद हो रहा है, या मृत्यु के निकट है।
- source_word: וְיַיִן
  choice: और ... दाखमधु
  rationale: יַיִן के लिए प्रचलित बाइबलीय हिन्दी शब्द, और संयोजक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: לְמָרֵי נָפֶשׁ
  choice: मन के कड़वे लोगों को
  rationale: शाब्दिक रूपक ‘प्राण/मन के कड़वे’ को बनाए रखते हुए נֶפֶשׁ के यहाँ भीतरी जीवन और गहरी व्यथा के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या आज्ञा को मद्यपान की सार्वभौमिक स्वीकृति न लगने देने के लिए नरम किया जाए
  choice: इब्रानी में दिए गए सीधे आज्ञार्थक भाव को बनाए रखा गया है।
  alternative: इसे केवल औषधीय प्रयोग बताना, या मुख्य पाठ में व्यंग्य के रूप में प्रस्तुत करना।
  rationale: इस पद में इब्रानी पाठ सीधी आज्ञाएँ देता है और स्वयं कोई सीमा या व्याख्या नहीं जोड़ता। नैतिक अथवा प्रसंगगत विवेचन आसपास के अनुच्छेद की व्याख्या का विषय है, अनुवाद में जोड़ने का नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘मन के कड़वे’ मूल रूपक और उसकी जानबूझकर रखी गई असहजता को बचाता है; पादटिप्पणी मुहावरे का आशय स्पष्ट करती है।
