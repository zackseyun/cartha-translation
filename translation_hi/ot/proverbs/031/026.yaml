  yaml_path: translation/ot/proverbs/031/026.yaml
  text: She opens her mouth with wisdom[b][a], and the instruction of kindness is on her tongue.
translation:
  language: hi
  text: वह बुद्धि से अपना मुँह खोलती है, और उसकी जीभ पर दयालुता की शिक्षा[a][b] रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दयालु शिक्षा” अथवा “दयालुता की व्यवस्था।” यहाँ इब्रानी תּוֹרָה का अर्थ “व्यवस्था” भी हो सकता है, पर इस प्रसंग में सामान्यतः शिक्षा या मार्गदर्शन अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: “दयालुता” के लिए प्रयुक्त इब्रानी חֶסֶד का अनुवाद प्रसंग के अनुसार “दया,” “अटल प्रेम,” या “निष्ठावान प्रेम” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּיהָ
  choice: अपना मुँह
  rationale: इब्रानी के ठोस मुहावरे को रखा गया है; हिन्दी में भी ‘मुँह खोलना’ बोलने के अर्थ में स्वाभाविक है।
- source_word: פָּתְחָה
  choice: खोलती है
  rationale: काव्यात्मक प्रसंग में पूर्ण क्रिया उसके स्वभावगत आचरण को बताती है, इसलिए हिन्दी का सामान्य वर्तमान काल उपयुक्त है।
- source_word: בְחָכְמָה
  choice: बुद्धि के साथ
  rationale: यह प्रयोग इब्रानी पूर्वसर्ग के साधन अथवा संगति के भाव को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וְתוֹרַת
  choice: शिक्षा
  rationale: यहाँ תּוֹרָה का अर्थ विशेष रूप से मूसा की व्यवस्था नहीं, बल्कि मार्गदर्शन या शिक्षण है।
- source_word: חֶסֶד
  choice: करुणा
  rationale: इस पारस्परिक ज्ञान-साहित्यिक प्रसंग में ‘करुणा’ दयालु और हितकारी व्यवहार का सहज बोध कराती है; शब्द में निष्ठावान प्रेम का भाव भी संभव है।
- source_word: תּוֹרַת חֶסֶד
  choice: करुणा की शिक्षा
  rationale: दोनों संज्ञाओं को बनाए रखकर इब्रानी संबंध-रचना संरक्षित की गई है; वाक्यांश शिक्षा के करुणामय विषय या चरित्र—दोनों की संभावित छाया खुली रखता है।
- source_word: עַל לְשׁוֹנָהּ
  choice: उसकी जीभ पर ... रहती है
  rationale: मूल बिंब को बनाए रखा गया है; ‘रहती है’ उसके तैयार और स्वभावगत वचन का भाव हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: תּוֹרַת חֶסֶד में חֶסֶד का अर्थ
  choice: करुणा की शिक्षा
  alternative: निष्ठावान प्रेम की शिक्षा; कृपा की शिक्षा
  rationale: प्रसंग मानवीय वाणी और व्यवहार का है, इसलिए ‘करुणा’ स्वाभाविक है; फिर भी חֶסֶד में निष्ठा, दया और स्थिर प्रेम की व्यापक अर्थ-छाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘अपना मुँह खोलती है’ और ‘जीभ पर’ जैसे मूल बिंब सुरक्षित हैं। पादटिप्पणी-चिह्न संबंधित वाक्यांश के तुरंत बाद दिए गए हैं।
