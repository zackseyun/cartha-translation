  language: hi
  text: वह बल से अपनी कमर[a] कसती है और अपनी भुजाओं को मजबूत करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह बल से अपनी कटि कसती है।” इब्रानी में तत्परता और स्फूर्ति का ठोस शारीरिक बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגְרָה
  choice: कसती है
  rationale: क्रिया का मूल अर्थ कमर के चारों ओर बाँधना या कसना है। ‘कमर कसती है’ ठोस शारीरिक बिंब के साथ तत्परता का भाव भी स्वाभाविक हिन्दी में बनाए रखता है। नीतिवचन की सामान्य शैली के अनुरूप वर्तमान काल रखा गया है।
- source_word: בְעֹז
  choice: बल से
  rationale: עֹז शक्ति या सामर्थ्य को दर्शाता है; यहाँ בְּ के साधनात्मक अर्थ को ‘बल से’ संक्षेप और स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: מָתְנֶיהָ
  choice: अपनी कमर
  rationale: यह शब्द कमर या कटि के क्षेत्र को सूचित करता है। आधुनिक हिन्दी में ‘कमर’ स्पष्ट और सहज है तथा मूल बिंब को सुरक्षित रखता है।
- source_word: וַתְּאַמֵּץ
  choice: मजबूत करती है
  rationale: पिएल रूप किसी वस्तु को दृढ़ या शक्तिशाली बनाने का भाव देता है। ‘मजबूत करती है’ इस सकर्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זְרֹעוֹתֶיהָ
  choice: अपनी भुजाओं
  rationale: बहुवचन संज्ञा भुजाओं को दर्शाती है। ‘भुजाएँ’ श्रम-सामर्थ्य और शारीरिक शक्ति के संदर्भ में गरिमापूर्ण तथा स्पष्ट है।
