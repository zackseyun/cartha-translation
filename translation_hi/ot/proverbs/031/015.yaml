  text: She rises while it is still night and gives food to her household and portions to her servant girls[a].
translation:
  language: hi
  text: वह रात रहते ही उठ जाती है और अपने घर के लोगों को भोजन तथा अपनी सेविकाओं को नियत हिस्सा देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם
  choice: वह ... उठ जाती है
  rationale: क़ाल वय्यिक्तोल को नीतिवचन के सजीव, सामान्य चरित्र-वर्णन के अनुरूप वर्तमानकालीन अभ्यस्त क्रिया के रूप में प्रस्तुत किया गया है।
- source_word: בְּעוֹד לַיְלָה
  choice: रात रहते ही
  rationale: यह स्वाभाविक आधुनिक हिन्दी मुहावरा उस अर्थ को बनाए रखता है कि रात अभी समाप्त नहीं हुई, बिना इसे अधिक स्पष्ट करके केवल 'भोर से पहले' कर देने के।
- source_word: וַתִּתֵּן
  choice: देती है
  rationale: נתן का सीधा अर्थ 'देना' है; वर्तमानकाल पद्य के अभ्यस्त वर्णन से मेल खाता है।
- source_word: טֶרֶף
  choice: भोजन
  rationale: यद्यपि शब्द का मूल अर्थ 'शिकार' भी हो सकता है, इस घरेलू संदर्भ और समानांतर रचना में इसका आशय खाने की सामग्री या आहार से है।
- source_word: לְבֵיתָהּ
  choice: अपने घराने को
  rationale: בַּיִת यहाँ भवन से अधिक उसमें रहने वाले पूरे घरेलू समुदाय को सूचित करता है; 'घराना' इस सामूहिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: וְחֹק
  choice: और ... उनका नियत भाग
  rationale: חֹק का अर्थ निर्धारित हिस्सा, नियत देय या बाँटा गया भाग हो सकता है। भोजन के समानांतर संदर्भ में 'नियत भाग' अर्थ को स्पष्ट रखते हुए उसकी निर्धारित प्रकृति भी बचाता है।
- source_word: לְנַעֲרֹתֶיהָ
  choice: अपनी दासियों को
  rationale: नारीलिंग बहुवचन यहाँ उसकी सेवा में लगी युवतियों या महिला सेविकाओं को दर्शाता है। 'दासियाँ' संक्षिप्त, प्रतिष्ठित और संदर्भानुकूल हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण घरेलू शब्द-भंडार अपनाया गया है। वाक्य को नीतिवचन के चरित्र-वर्णन के अनुरूप वर्तमानकाल में रखा गया है; मूल की क्रियात्मक समानता और חֹק की अर्थगत व्यापकता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित किया गया है।
