  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘ले लेती है’ मूल क्रिया की व्यापकता बचाता है, जबकि पादटिप्पणी आर्थिक अर्जन का आशय स्पष्ट करती है। ‘अपने हाथों की कमाई’ हिन्दी में स्वाभाविक है और मूल मुहावरे की श्रम-उपज संबंधी छवि को पर्याप्त रूप से बनाए रखती है।
