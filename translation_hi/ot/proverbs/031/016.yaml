  yaml_path: translation/ot/proverbs/031/016.yaml
  text: She considers a field and acquires it[b][a]; from the fruit of her hands she plants a vineyard.
translation:
  language: hi
  text: वह एक खेत के बारे में सोच-विचार करती है और उसे प्राप्त करती है[a]; अपने हाथों की कमाई से दाख की बारी लगाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह एक खेत लेने की योजना बनाती है और उसे लेती है।” इब्रानी क्रियाएँ उद्देश्यपूर्ण विचार और उसे अपने अधिकार में लेने—दोनों का भाव देती हैं; यह आवश्यक नहीं कि उसका साधन स्पष्ट रूप से खरीद ही हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने हाथों के फल से”; अर्थात अपने श्रम से मिली उपज या आय से।
    reason: cultural_note
lexical_decisions:
- source_word: זָמְמָה
  choice: विचार करती है
  rationale: यह क्रिया सोच-विचार और उद्देश्यपूर्ण योजना का भाव देती है; यह अनुवाद केवल इच्छा या पूरी तरह निश्चित योजना का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: שָׂדֶה
  choice: खेत
  rationale: यह शब्द खेत अथवा खेती योग्य भूमि का सामान्य और सीधा बोध कराता है।
- source_word: וַתִּקָּחֵהוּ
  choice: उसे ले लेती है
  rationale: לקח का व्यापक अर्थ ‘लेना’ या ‘प्राप्त करना’ है। संदर्भ संपत्ति अर्जित करने का संकेत देता है, पर मूल पाठ स्पष्ट रूप से ‘खरीदना’ नहीं कहता; इसलिए अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: מִפְּרִי כַפֶּיהָ
  choice: अपने हाथों की कमाई से
  rationale: शाब्दिक रूप ‘उसके हाथों के फल से’ है। आधुनिक हिन्दी में ‘हाथों की कमाई’ श्रम से प्राप्त उपज अथवा आय का स्वाभाविक अर्थ व्यक्त करती है।
- source_word: נטע
  choice: वह ... लगाती है
  rationale: क्रिया का अर्थ रोपना या लगाना है। यद्यपि लिखित रूप व्यंजन-पाठ में 3 पुल्लिंग एकवचन जैसा दिखता है, वाक्य और पूरे प्रसंग में स्त्री ही कर्ता है।
- source_word: כָּרֶם
  choice: एक दाख की बारी
  rationale: यह अंगूर की खेती के लिए लगाई गई बारी का मानक और सटीक हिन्दी पद है।
