revisions:
- from: वह किसी खेत पर विचार करती है और उसे ले लेती है[a]; अपने हाथों की कमाई से वह एक दाख की बारी लगाती है[b]।
  to: वह एक खेत के बारे में सोच-विचार करती है और उसे प्राप्त करती है[a]; अपने हाथों की कमाई से दाख की बारी लगाती है[b]।
  rationale: Revision makes the first clause idiomatic modern Hindi, aligns the indefinite ‘field’ with ‘एक खेत,’ and uses ‘प्राप्त करती है’ for contextually natural but non-specific acquisition. Footnote a is adjusted so that ‘planning’ concerns taking the field rather than the field itself. No theological or interpretive expansion is introduced.
