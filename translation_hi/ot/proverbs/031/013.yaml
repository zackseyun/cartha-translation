  text: She seeks wool and flax[a], and works with willing hands.
translation:
  language: hi
  text: 'वह ऊन और सन ढूँढ़ती है,

    और प्रसन्नता से अपने हाथों से काम करती है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דָּרְשָׁה
  choice: ढूँढ़ लाती है
  rationale: क्रिया सक्रिय रूप से खोजने या प्राप्त करने का भाव रखती है। संदर्भ में स्त्री वस्त्र-निर्माण की सामग्री जुटाती है; ‘ढूँढ़ लाती है’ आधुनिक हिन्दी में खोज और प्राप्ति, दोनों की सम्भावना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צֶמֶר
  choice: ऊन
  rationale: यह वस्त्र-निर्माण में प्रयुक्त ऊन का सीधा और प्रचलित हिन्दी पर्याय है।
- source_word: וּפִשְׁתִּים
  choice: सन
  rationale: इब्रानी शब्द तैयार मलमल या लिनन के बजाय सन के पौधे अथवा उसके रेशे को सूचित करता है। ऊन के साथ कच्ची वस्त्र-सामग्री के रूप में ‘सन’ उपयुक्त है।
- source_word: וַתַּעַשׂ
  choice: काम करती है
  rationale: עשה का अर्थ व्यापक रूप से करना या बनाना है। वस्त्र-श्रम के इस संदर्भ में ‘काम करती है’ स्वाभाविक है और किसी खास तैयार वस्तु को अनावश्यक रूप से नहीं जोड़ता।
- source_word: בְּחֵפֶץ
  choice: प्रसन्नतापूर्वक
  rationale: חֵפֶץ इच्छा, प्रसन्नता, रुचि या तत्परता व्यक्त कर सकता है। ‘प्रसन्नतापूर्वक’ काम के प्रति सकारात्मक और स्वेच्छापूर्ण मनोभाव को सहज हिन्दी में व्यक्त करता है, जबकि केवल उत्साह या भावनात्मक आनन्द तक अर्थ को सीमित नहीं करता।
- source_word: כַּפֶּיהָ
  choice: अपने हाथों से
  rationale: כף का शाब्दिक अर्थ हथेली हो सकता है, पर यहाँ हाथ श्रम के साधन हैं। हिन्दी में ‘अपने हाथों से’ इसका स्वाभाविक मुहावरेदार रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। यहाँ कोई आवश्यक पाठालोचनात्मक या धर्मवैज्ञानिक टिप्पणी नहीं है; בְּחֵפֶץ की अर्थ-व्याप्ति मुख्य अनुवाद में स्वाभाविक रूप से समाहित की गई है।
