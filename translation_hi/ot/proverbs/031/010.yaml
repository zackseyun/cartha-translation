  yaml_path: translation/ot/proverbs/031/010.yaml
  text: A wife of noble character—who can find? Her value is far beyond jewels[a][b][c].
translation:
  language: hi
  text: एक गुणी पत्नी—कौन पा सकता है? उसका मूल्य रत्नों से कहीं बढ़कर है[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामर्थ्यवती स्त्री।” इब्रानी शब्द सामान्य रूप से “स्त्री” के लिए भी प्रयुक्त हो सकता है, यद्यपि गृहस्थी के संदर्भ में “पत्नी” उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: “रत्नों” के लिए प्रयुक्त इब्रानी शब्द का सटीक अर्थ अनिश्चित है; इसका अनुवाद “मोती,” “मूँगे” या परंपरागत रूप से “माणिक” भी किया गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसका मोल रत्नों से कहीं अधिक है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵשֶׁת
  choice: पत्नी
  rationale: यह אִשָּׁה का संबंधसूचक रूप है। आगे के गृहस्थी-संबंधी संदर्भ में ‘पत्नी’ अधिक उपयुक्त है, यद्यपि मूल शब्द सामान्य अर्थ में ‘स्त्री’ भी हो सकता है।
- source_word: חַיִל
  choice: सामर्थ्यवान
  rationale: חַיִל में शक्ति, योग्यता, सद्गुण, उत्कृष्टता और साधन-संपन्नता के भाव समाए हैं। ‘सामर्थ्यवान’ यहाँ उस स्त्री की नैतिक दृढ़ता, कार्यकुशलता और क्षमता को संक्षेप में व्यक्त करता है, बिना इसे केवल युद्ध-वीरता तक सीमित किए।
- source_word: מִי יִמְצָא
  choice: कौन पा सकता है?
  rationale: अपूर्ण क्रिया यहाँ भविष्यकाल मात्र नहीं, बल्कि दुर्लभता जताने वाला आलंकारिक प्रश्न है। ‘कौन पा सकता है?’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְרָחֹק
  choice: कहीं बढ़कर है
  rationale: शाब्दिक अर्थ ‘दूर’ है, पर तुलना में यह अत्यधिक श्रेष्ठ या अधिक मूल्यवान होने का बोध देता है। ‘कहीं बढ़कर’ आधुनिक हिन्दी में वही तुलनात्मक बल व्यक्त करता है।
- source_word: פְּנִינִים
  choice: रत्नों
  rationale: इस शब्द से अभिप्रेत विशिष्ट बहुमूल्य पदार्थ अनिश्चित है; मोती, मूँगा या माणिक जैसे अर्थ प्रस्तावित हैं। ‘रत्न’ अनावश्यक विशिष्टीकरण से बचते हुए बहुमूल्यता बनाए रखता है।
- source_word: מִכְרָהּ
  choice: उसका मूल्य
  rationale: यह मूल्यांकन या कीमत को सूचित करता है। ‘उसका मूल्य’ तुलना को स्पष्ट रखता है और स्त्री को व्यापारिक वस्तु जैसा दिखाने वाले अनावश्यक भाव को कम करता है।
