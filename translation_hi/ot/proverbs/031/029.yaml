lexical_decisions:
- source_word: רַבּוֹת
  choice: बहुत-सी
  rationale: यह स्त्रीलिंग बहुवचन विशेषण संख्या की अधिकता व्यक्त करता है; ‘बहुत-सी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָּנוֹת
  choice: बेटियों
  rationale: शाब्दिक अर्थ ‘बेटियाँ’ है। काव्यात्मक हिब्रू में इसका आशय व्यापक रूप से स्त्रियों या युवतियों से भी हो सकता है; मूल बिंब को पाठ में रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: עָשׂוּ
  choice: काम किए हैं
  rationale: עשה का काल-रूप यहाँ अनेक स्त्रियों के किए या साधे हुए कार्यों को बताता है। ‘काम किए हैं’ हिन्दी में חַיִל के साथ सहज वाक्य बनाता है।
- source_word: חָיִל
  choice: उत्कृष्ट
  rationale: חַיִל में सामर्थ्य, वीरता, योग्यता और उत्कृष्टता जैसे अर्थ समाए हैं। इस प्रसंग में ‘उत्कृष्ट’ उसके नैतिक और व्यावहारिक सामर्थ्य को व्यक्त करता है, बिना अर्थ को केवल युद्ध-वीरता तक सीमित किए।
- source_word: וְאַתְּ
  choice: पर तू
  rationale: संयोजक और स्वतंत्र सर्वनाम यहाँ तुलना में विरोधात्मक बल देते हैं। निकट और व्यक्तिगत संबोधन को बनाए रखने के लिए ‘तू’ चुना गया है।
- source_word: עָלִית
  choice: बढ़कर है
  rationale: शाब्दिक रूप से ‘ऊपर चढ़ी’ के अर्थ वाला यह क्रिया-रूप עַל के साथ किसी से श्रेष्ठ या आगे होने का भाव देता है; ‘बढ़कर है’ हिन्दी में स्वाभाविक तुलना है।
- source_word: עַל כֻּלָּנָה
  choice: उन सब से
  rationale: अर्थ है ‘उन सभी के ऊपर’; ‘उन सब से बढ़कर’ हिन्दी में पूर्ण तुलना को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
