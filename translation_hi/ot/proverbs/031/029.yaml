  text: बहुत-सी बेटियों ने श्रेष्ठता दिखाई है,[a][b] पर तुम उन सब से बढ़कर हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘बेटियाँ’ है; काव्यात्मक प्रयोग में यह स्त्रियों या युवतियों के लिए भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बहुत-सी स्त्रियों ने उत्कृष्टता दिखाई है, पर तुम उन सब से बढ़कर हो।” यहाँ अनूदित इब्रानी शब्द में सामर्थ्य, वीरता, योग्यता और उत्कृष्टता के भाव भी हो सकते हैं।
