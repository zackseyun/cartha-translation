source:
  edition: WLC
  text: פֶּן יִ֭שְׁתֶּה וְ/יִשְׁכַּ֣ח מְחֻקָּ֑ק וִֽ֝/ישַׁנֶּה דִּ֣ין כָּל בְּנֵי עֹֽנִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/005.yaml
  text: lest he drink and forget what has been decreed[b][a], and pervert the justice due to all the afflicted.
translation:
  language: hi
  text: कहीं ऐसा न हो कि वह पीए और जो निर्धारित किया गया है उसे भूल जाए[a], और सभी पीड़ितों के न्याय को विकृत कर दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विधान भूल जाए” अथवा “जो ठहराया गया है, उसे भूल जाए।”
    reason: alternative_reading
  - marker: b
    text: “पीड़ितों” का शाब्दिक हिब्रू रूप “दुःख के पुत्र” है—अर्थात दुःख, अभाव या उत्पीड़न झेलने वाले लोग।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेधात्मक आशंका और चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִשְׁתֶּה וְיִשְׁכַּח
  choice: वह पीकर ... भूल जाए
  rationale: हिब्रू में समन्वित क्रियाओं के कारण-परिणाम संबंध को सहज हिन्दी वाक्य-विन्यास में स्पष्ट करता है।
- source_word: מְחֻקָּק
  choice: निर्धारित बात
  rationale: निष्क्रिय कृदंत का अर्थ उस बात से है जो निर्धारित, विधिवत ठहराई या आदेशित की गई हो; यह अनुवाद अर्थ को केवल ‘कानून’ तक सीमित नहीं करता।
- source_word: וִישַׁנֶּה
  choice: बिगाड़ दे
  rationale: पिएल रूप यहाँ न्यायिक निर्णय को अनुचित रीति से बदलने या विकृत करने का भाव देता है; ‘बिगाड़ दे’ सामान्य पाठक के लिए स्पष्ट और नैतिक रूप से नकारात्मक है।
- source_word: דִּין
  choice: मिलने वाला न्याय
  rationale: राजकीय-न्यायिक संदर्भ में यह उचित न्याय अथवा कानूनी अधिकार का संकेत करता है।
- source_word: כָּל בְּנֵי עֹנִי
  choice: सभी पीड़ितों
  rationale: शाब्दिक ‘दुःख के पुत्र’ एक हिब्रू मुहावरा है, जिसका आशय दुःख, अभाव या उत्पीड़न झेल रहे लोगों से है।
theological_decisions:
- issue: מְחֻקָּק का आशय
  choice: निर्धारित बात
  alternative: विधान / आदेश / जो ठहराया गया है
  rationale: मूल रूप में कुछ अस्पष्टता है कि संकेत किसी विशेष राजकीय आदेश, सामान्य विधान या निर्धारित न्यायिक कर्तव्य की ओर है; मुख्य पाठ इसे अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। चेतावनी का संक्षिप्त स्वर सुरक्षित है; न्यायिक अर्थ स्पष्ट किया गया है, जबकि מְחֻקָּק की वास्तविक अर्थ-व्याप्ति को पादटिप्पणी में खुला रखा गया है।
