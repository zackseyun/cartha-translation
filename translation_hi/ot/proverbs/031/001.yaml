  text: דִּ֭בְרֵי לְמוּאֵ֣ל מֶ֑לֶךְ מַ֝שָּׂ֗א אֲֽשֶׁר יִסְּרַ֥תּ/וּ אִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/001.yaml
  text: 'The words of King Lemuel[b][a], an oracle that his mother taught him:'
translation:
  language: hi
  text: 'राजा लमूएल के वचन—एक भविष्यवाणी[a], जो उसकी माँ ने उसे सिखाई[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मस्सा के राजा लमूएल के वचन, जो उसकी माँ ने उसे सिखाए।” इब्रानी शब्द מַשָּׂא का अर्थ “भविष्यवाणी” हो सकता है, या यह “मस्सा” नामक स्थान हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “सिखाई” के लिए प्रयुक्त इब्रानी क्रिया का अर्थ “अनुशासन दिया” या “शिक्षा दी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי
  choice: के वचन
  rationale: यह संज्ञा का रचनात्मक बहुवचन है, जो संग्रह के शीर्षक का परिचय देता है; हिंदी में ‘के वचन’ सीधा, स्वाभाविक और गरिमापूर्ण है।
- source_word: לְמוּאֵל
  choice: लमूएल
  rationale: व्यक्तिवाचक नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: מֶלֶךְ
  choice: राजा
  rationale: यह लमूएल के साथ प्रयुक्त सीधी उपाधि है।
- source_word: מַשָּׂא
  choice: एक भविष्यवाणी
  rationale: मसोरेटी स्वरांकन और इस शब्द के प्रचलित अर्थ के अनुसार यह किसी ईश्वरीय संदेश या भविष्यवाणी को सूचित कर सकता है। ‘मस्सा’ स्थान-नाम की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह संबंधवाचक अव्यय आगामी उपवाक्य को ‘भविष्यवाणी’ से जोड़ता है और हिंदी में ‘जो’ स्वाभाविक है।
- source_word: יִסְּרַתּוּ
  choice: उसे सिखाई
  rationale: יסר के अर्थ-क्षेत्र में शिक्षा देना, अनुशासन देना और सुधारना शामिल हैं। मातृ-प्रदत्त ज्ञान के संदर्भ में ‘सिखाई’ मुख्य पाठ में सर्वाधिक स्वाभाविक है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אִמּוֹ
  choice: उसकी माँ
  rationale: तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित संज्ञा का सीधा हिंदी रूप।
theological_decisions:
- issue: 'מַשָּׂא का अर्थ: संदेश अथवा स्थान-नाम'
  choice: मुख्य पाठ में ‘एक भविष्यवाणी’
  alternative: ‘मस्सा के राजा लमूएल के वचन, जो उसकी माँ ने उसे सिखाए’
  rationale: मसोरेटी पाठ का स्वरांकन सामान्य संज्ञा ‘भविष्यवाणी/ईश्वरीय संदेश’ का समर्थन करता है, पर व्यंजनात्मक पाठ स्थान-नाम ‘मस्सा’ भी समझा जा सकता है। इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, शीर्षक-सदृश और गरिमापूर्ण शैली रखी गई है। मूल की व्याकरणिक संरचना को यथासंभव सुरक्षित रखते हुए सहज हिंदी हेतु डैश का प्रयोग किया गया है। सभी वैध पाठगत और शब्दार्थगत विकल्प पादटिप्पणियों में स्पष्ट किए गए हैं।
