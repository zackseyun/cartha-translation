    reason: שִׁלְּחָה בַּכִּישׁוֹר के संबंध को ‘की ओर बढ़ाती है’ अथवा ‘पर रखती है’ समझा जा सकता है; कताई-उपकरणों की सटीक ऐतिहासिक पहचान भी कुछ हद तक अनिश्चित है।
