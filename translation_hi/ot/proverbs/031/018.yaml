  text: טָ֭עֲמָה כִּי ט֣וֹב סַחְרָ֑/הּ לֹֽא יִכְבֶּ֖ה ב/ליל נֵרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/018.yaml
  text: She perceives that her merchandise is good[b][a]; her lamp does not go out at night.
translation:
  language: hi
  text: वह अनुभव से जानती है[a] कि उसका व्यापार अच्छा[b] है; रात में उसका दीपक नहीं बुझता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘वह चखती है’; यहाँ ‘चखना’ अनुभव से परखने और समझने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका सौदा अच्छा है’ अथवा ‘उसका लाभ अच्छा है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: טָעֲמָה
  choice: अनुभव से जानती है
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘चखना’ है, पर यहाँ यह अनुभव के आधार पर परखने और समझने का भाव व्यक्त करती है। आधुनिक हिन्दी में ‘अनुभव से जानती है’ इस अर्थ को स्वाभाविक रूप से प्रकट करता है।
- source_word: כִּי
  choice: कि
  rationale: यह उसके जानने की विषय-वस्तु प्रस्तुत करता है और हिन्दी में स्वाभाविक पूरक-संयोजक है।
- source_word: טוֹב
  choice: अच्छा
  rationale: यह मूल शब्द के व्यापक अर्थ को बनाए रखता है; व्यापारिक संदर्भ में लाभकारी होने का भाव निहित रह सकता है, पर उसे अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: סַחְרָהּ
  choice: उसका व्यापार
  rationale: संज्ञा व्यापार, व्यापारिक माल अथवा उससे होने वाले लाभ को सूचित कर सकती है। ‘व्यापार’ इस प्रसंग में स्वाभाविक है और मूल की अर्थ-व्याप्ति को पर्याप्त रूप से बनाए रखता है।
- source_word: לֹא יִכְבֶּה
  choice: नहीं बुझता
  rationale: दीपक के बुझने के लिए यह सहज और प्रचलित हिन्दी अभिव्यक्ति है; नीतिवचन में वर्णित नियमित स्थिति के लिए वर्तमानकाल उपयुक्त है।
- source_word: בַלַּיְלָה
  choice: रात में
  rationale: यह आधुनिक हिन्दी में स्वाभाविक काल-सूचक अभिव्यक्ति है।
- source_word: נֵרָהּ
  choice: उसका दीपक
  rationale: मूल संज्ञा किसी अमूर्त प्रकाश के बजाय दीपक को दर्शाती है और घरेलू परिश्रम का ठोस बिंब बनाए रखती है।
