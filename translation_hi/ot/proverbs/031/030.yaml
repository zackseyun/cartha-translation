  text: שֶׁ֣קֶר הַ֭/חֵן וְ/הֶ֣בֶל הַ/יֹּ֑פִי אִשָּׁ֥ה יִרְאַת יְ֝הוָ֗ה הִ֣יא תִתְהַלָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/030.yaml
  text: Charm is deceitful[a], and beauty is fleeting[c][b], but a woman who fears Yahweh shall be praised.
translation:
  language: hi
  text: मोहकता धोखा देती है, और सुंदरता क्षणभंगुर है[a]; पर जो स्त्री[b] याहवे का भय मानती है, उसी की प्रशंसा की जाएगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक बिंब है, ‘सुंदरता वाष्प है’; इससे उसके शीघ्र मिट जाने के साथ-साथ उसके खोखले या व्यर्थ होने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पत्नी’; इब्रानी शब्द אִשָּׁה का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘वह अपनी प्रशंसा करे’ या ‘अपने पर गर्व करे’; क्रिया का प्रतिवर्ती अर्थ सम्भव है, यद्यपि यहाँ संदर्भ ‘उसकी प्रशंसा की जाएगी’ का अधिक समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שֶׁקֶר הַחֵן
  choice: मोहकता धोखा देती है
  rationale: שֶׁקֶר का मूल भाव झूठ या धोखा है। हिन्दी में ‘मोहकता झूठी है’ की अपेक्षा ‘मोहकता धोखा देती है’ अधिक स्वाभाविक है और बाहरी आकर्षण की भ्रामकता स्पष्ट करता है।
- source_word: וְהֶבֶל הַיֹּפִי
  choice: और सुंदरता क्षणभंगुर है
  rationale: הֶבֶל का मूल बिंब साँस या भाप है और यहाँ उससे नश्वरता तथा शीघ्र मिट जाने का भाव निकलता है। ‘क्षणभंगुर’ उस बिंब के आशय को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִשָּׁה
  choice: स्त्री
  rationale: शब्द का अर्थ संदर्भ के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यह कथन सामान्य गुण की प्रशंसा करता है, इसलिए मुख्य पाठ में व्यापक अर्थ ‘स्त्री’ रखा गया है।
- source_word: יִרְאַת יְהוָה
  choice: जो याहवे का भय मानती है
  rationale: शाब्दिक रूप से ‘याहवे का भय रखनेवाली स्त्री’। सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्पष्ट है और ज्ञान-साहित्य में परमेश्वर के प्रति श्रद्धापूर्ण भय का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: הִיא תִתְהַלָּל
  choice: वही प्रशंसा पाएगी
  rationale: הִיא के बल को ‘वही’ से व्यक्त किया गया है। תִתְהַלָּל का यहाँ प्रसंगानुकूल निष्क्रिय-सदृश अर्थ है कि वह प्रशंसा की पात्र होगी; ‘प्रशंसा पाएगी’ हिन्दी में सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: תִתְהַלָּל का वाच्य और अर्थ
  choice: वही प्रशंसा पाएगी
  alternative: वह अपनी प्रशंसा करेगी / अपने पर गर्व करेगी
  rationale: हित्पएल रूप प्रतिवर्ती अर्थ दे सकता है, पर पद का विरोधाभास और पूरी कविता का समापन निष्क्रिय-सदृश अर्थ का अधिक प्रबल समर्थन करते हैं। वैकल्पिक प्रतिवर्ती अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘याहवे का भय’ का आशय
  choice: याहवे का भय मानती है
  alternative: याहवे के प्रति श्रद्धा रखती है
  rationale: ‘भय’ ज्ञान-साहित्य का प्रमुख धर्मवैचारिक पद है। उसे केवल ‘श्रद्धा’ कर देने से उसके गम्भीर नैतिक और धार्मिक तनाव का कुछ भाग मिट सकता था।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मोहकता’ बाहरी आकर्षण के भाव को व्यक्त करती है; ‘क्षणभंगुर’ הֶבֶל के नश्वरता-वाले आशय को पाठ में देता है, जबकि उसके भाप और व्यर्थता के बिंब को पादटिप्पणी में सुरक्षित रखा गया है। ‘वही’ इब्रानी स्वतंत्र सर्वनाम הִיא के बल को बिना अस्वाभाविक विराम के व्यक्त करता है।
