base_translation:
  language: en
  yaml_path: translation/ot/proverbs/031/003.yaml
  text: Do not give your strength to women[b][a], or your ways to that which destroys kings.
translation:
  language: hi
  text: अपना बल स्त्रियों को मत दे[b], और अपना मार्ग उस ओर मत मोड़ जो राजाओं का नाश करती है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “और अपना मार्ग राजाओं के विनाश की ओर मत मोड़।” इब्रानी में यहाँ ‘नाश’ को अमूर्त क्रियावाचक संज्ञा के रूप में भी लिया जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “बल” में केवल शारीरिक शक्ति ही नहीं, बल्कि जीवन-शक्ति, साधन या संपदा भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן
  choice: मत दे
  rationale: निषेधवाचक אַל और अपूर्ण क्रिया यहाँ सीधे निषेध की आज्ञा देते हैं; आधुनिक हिन्दी में ‘मत दे’ स्वाभाविक और सटीक है।
- source_word: לַנָּשִׁים
  choice: स्त्रियों को
  rationale: נָשִׁים बहुवचन है और केवल ‘पत्नियों’ तक सीमित नहीं; इसलिए मूल की व्यापक अभिव्यक्ति बनाए रखी गई है।
- source_word: חֵילֶךָ
  choice: अपना बल
  rationale: חַיִל यहाँ शारीरिक सामर्थ्य के साथ जीवन-शक्ति, साधन और संपदा तक को समेट सकता है; ‘बल’ इस व्यापकता को संक्षेप में बनाए रखता है।
- source_word: וּדְרָכֶיךָ
  choice: और न अपने मार्ग उस ओर लगा
  rationale: דֶּרֶךְ जीवन की दिशा, आचरण या मार्ग को सूचित कर सकता है। शाब्दिक ‘मार्ग दे’ हिन्दी में अस्वाभाविक है, इसलिए समान रूपक को ‘उस ओर लगा’ से व्यक्त किया गया है।
- source_word: לַמְחוֹת
  choice: जो ... नाश करता है
  rationale: מחה मिटा देने या नष्ट करने का प्रबल भाव रखता है। यह रूप किसी विनाशकारी तत्व अथवा अमूर्त विनाश की ओर संकेत कर सकता है; मुख्य पाठ में उसे अनिर्दिष्ट रखा गया है।
- source_word: מְלָכִין
  choice: राजाओं का
  rationale: यह ‘राजा’ का बहुवचन है; ‘राजाओं’ से राजकीय संदर्भ और बहुवचन दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: स्त्रियों के विषय में चेतावनी का दायरा
  choice: राजा को स्त्रियों से जुड़े ऐसे संबंधों या भोग-विलास में अपना बल न गँवाने की व्यावहारिक बुद्धि-संबंधी चेतावनी
  alternative: सभी स्त्रियों की प्रकृति के विषय में सामान्य निंदा, अथवा केवल विदेशी पत्नियों के विषय में विशेष चेतावनी
  rationale: मूल पाठ सामान्य बहुवचन ‘स्त्रियों’ कहता है, पर वह स्त्रियों के स्वभाव पर कोई सार्वभौमिक सिद्धांत प्रतिपादित नहीं करता। अनुवाद न तो पाठ को संकुचित करता है, न उसके कथन से आगे बढ़कर निंदा जोड़ता है।
- issue: חֵילֶךָ का आशय
  choice: व्यापक अर्थ में बल, जिसमें जीवन-शक्ति, सामर्थ्य और साधन सम्मिलित हो सकते हैं
  alternative: केवल धन अथवा विशेष रूप से यौन-शक्ति
  rationale: इब्रानी शब्द का अर्थ-क्षेत्र व्यापक है; ‘बल’ किसी एक संकीर्ण अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: לַמְחוֹת की रचना
  choice: राजाओं का नाश करने वाले अनिर्दिष्ट विनाशकारी तत्व के रूप में मुख्य पाठ
  alternative: ‘राजाओं के विनाश के लिए’ जैसे अमूर्त क्रियावाचक अर्थ में पाठ
  rationale: इब्रानी पद को व्यक्तिगत कर्ता अथवा अमूर्त विनाश से जोड़ा जा सकता है। मुख्य पाठ सहज हिन्दी देता है और पादटिप्पणी वास्तविक व्याकरणिक-शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, चेतावनीपूर्ण और गरिमापूर्ण शैली रखी गई है। ‘स्त्रियों’ मूल के बहुवचन को बनाए रखता है; ‘मार्ग उस ओर लगा’ हिन्दी में स्वाभाविक रहते हुए जीवन-दिशा के रूपक को सुरक्षित रखता है।
