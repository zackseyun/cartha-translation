  text: רֵ֣ישׁ וְ֭/קָלוֹן פּוֹרֵ֣עַ מוּסָ֑ר וְ/שׁוֹמֵ֖ר תּוֹכַ֣חַת יְכֻבָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/018.yaml
  text: Poverty and disgrace come to one who ignores discipline[b][a], but whoever heeds reproof will be honored.
translation:
  language: hi
  text: जो अनुशासन को ठुकराता है, उसे गरीबी और अपमान मिलता है; पर जो सुधार की बात को मानता है, उसका सम्मान किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֵישׁ
  choice: गरीबी
  rationale: यह संज्ञा अभाव या निर्धनता को दर्शाती है; ‘गरीबी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: קָלוֹן
  choice: अपमान
  rationale: यह सार्वजनिक लज्जा या अनादर का बोध कराता है; ‘अपमान’ सामाजिक परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: פּוֹרֵעַ
  choice: जो ... ठुकराता है
  rationale: यहाँ कृदन्त का अर्थ अनुशासन की उपेक्षा करना, उसे छोड़ देना या अस्वीकार करना है; ‘ठुकराता है’ विरोधी समानांतरता को स्पष्ट रखते हुए जानबूझकर अस्वीकार करने का भाव देता है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह सुधारात्मक शिक्षा और प्रशिक्षण को सूचित करता है, केवल जानकारी को नहीं।
- source_word: שׁוֹמֵר
  choice: जो ... मानता है
  rationale: शाब्दिक अर्थ ‘रखना/सँभालना’ है; इस प्रसंग में सुधार पर ध्यान देकर उसे ग्रहण करने का भाव है, जिसे ‘मानता है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: תּוֹכַחַת
  choice: सुधार की बात
  rationale: यह मौखिक सुधार, डाँट या दोष दिखाने वाली बात को दर्शाता है; यह चयन सामान्य पाठक के लिए स्पष्ट है और מוּסָר से भेद बनाए रखता है।
- source_word: יְכֻבָּד
  choice: उसका सम्मान किया जाएगा
  rationale: पुअल रूप किसी से सम्मान प्राप्त होने का निष्क्रिय भाव व्यक्त करता है; हिन्दी का यह वाक्य उस सामाजिक परिणाम को सुरक्षित रखता है।
