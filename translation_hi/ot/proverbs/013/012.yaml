source:
  edition: WLC
  text: תּוֹחֶ֣לֶת מְ֭מֻשָּׁכָה מַחֲלָה לֵ֑ב וְ/עֵ֥ץ חַ֝יִּ֗ים תַּאֲוָ֥ה בָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/012.yaml
  text: Hope deferred makes the heart sick[a], but a desire fulfilled is a tree of life.
translation:
  language: hi
  text: आशा में देर होने से मन बीमार हो जाता है[a], पर पूरी हुई इच्छा जीवन का वृक्ष है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “लंबे समय तक खिंची हुई आशा हृदय की बीमारी है, और आ पहुँची इच्छा जीवन का वृक्ष है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹחֶלֶת
  choice: आशा
  rationale: यह संज्ञा आशापूर्ण प्रतीक्षा या अपेक्षा को व्यक्त करती है। आधुनिक हिन्दी में ‘आशा’ स्वाभाविक है और दूसरे चरण की ‘अभिलाषा’ के साथ अर्थपूर्ण समानांतरता रखती है।
- source_word: מְמֻשָּׁכָה
  choice: लम्बा खिंचना
  rationale: मूल अर्थ ‘खींचा हुआ’ या ‘लम्बा किया हुआ’ है। ‘लम्बा खिंचना’ विलम्ब की अनुभूति और हिब्रू रूपक, दोनों को बनाए रखता है।
- source_word: מַחֲלָה לֵב
  choice: मन को बीमार कर देता है
  rationale: हिब्रू में यह क्रियारहित वाक्यांश है, शाब्दिक रूप से ‘हृदय की बीमारी’। हिन्दी मुहावरे में ‘मन को बीमार कर देता है’ उसके विधेयात्मक अर्थ और भावनात्मक प्रभाव को स्पष्ट करता है।
- source_word: וְעֵץ חַיִּים
  choice: पर ... जीवन का वृक्ष
  rationale: ו का मूल अर्थ ‘और’ है, किन्तु यहाँ नीतिवचन की विरोधात्मक समानांतरता को स्वाभाविक हिन्दी में ‘पर’ व्यक्त करता है। ‘जीवन का वृक्ष’ बाइबलीय बिम्ब को सुरक्षित रखता है।
- source_word: תַּאֲוָה
  choice: अभिलाषा
  rationale: यह शब्द इच्छा या लालसा को दर्शाता है। ‘अभिलाषा’ यहाँ गरिमापूर्ण, स्वाभाविक और अनावश्यक नकारात्मक अर्थ से रहित है।
- source_word: בָאָה
  choice: पूरी हुई
  rationale: शाब्दिक अर्थ ‘आई हुई’ या ‘जो आ गई’ है। प्रसंग में अभिप्राय अभिलाषा की प्राप्ति से है; ‘पूरी हुई’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עֵץ חַיִּים से पहले ו का अनुवाद
  choice: पर
  alternative: और
  rationale: यद्यपि ו औपचारिक रूप से ‘और’ है, दोनों चरणों का सम्बन्ध स्पष्टतः विरोधात्मक है। ‘पर’ हिन्दी में इस समानांतर विरोध को बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के स्वाभाविक ढंग से प्रकट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन’ हिन्दी में भावनात्मक केंद्र के रूप में ‘हृदय’ से अधिक स्वाभाविक है, जबकि ‘जीवन का वृक्ष’ मूल बाइबलीय बिम्ब को यथावत रखता है।
