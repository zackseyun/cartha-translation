    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׂכֶל טוֹב
  choice: अच्छी समझ
  rationale: यह पदबंध व्यावहारिक सूझ-बूझ और सही निर्णय-क्षमता को व्यक्त करता है। ‘अच्छी समझ’ आधुनिक, सहज हिंदी है और मूल के सामान्य विशेषण ‘अच्छी’ को बनाए रखती है।
- source_word: יִתֶּן חֵן
  choice: कृपा मिलती है
  rationale: क्रिया का शाब्दिक अर्थ ‘देता है’ है, किंतु इस लोकोक्तिपरक प्रयोग में परिणामस्वरूप अनुग्रह या स्वीकृति पाने का भाव है। हिंदी में ‘कृपा मिलती है’ स्वाभाविक है और कारण-परिणाम संबंध स्पष्ट करता है।
- source_word: דֶרֶךְ
  choice: राह
  rationale: नीतिवचन में यह जीवन-चाल या आचरण के मार्ग का रूपक है। ‘राह’ संक्षिप्त, स्वाभाविक और काव्यात्मक गरिमा वाला विकल्प है।
- source_word: בֹּגְדִים
  choice: विश्वासघातियों
  rationale: यह कृदंत छल या निष्ठाहीनता से काम करने वाले लोगों को चरित्र-प्रकार के रूप में दर्शाता है। ‘विश्वासघाती’ इस नैतिक आशय को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֵיתָן
  choice: कठिन
  rationale: यहाँ शब्द राह की कठोर, दुर्गम या अटल प्रकृति बता सकता है। समानांतर विरोध के संदर्भ में ‘कठिन’ सहज है, जबकि ‘दुर्गम’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
