id: PRO.13.1
reference: Proverbs 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ֣ן חָ֭כָם מ֣וּסַר אָ֑ב וְ֝/לֵ֗ץ לֹא שָׁמַ֥ע גְּעָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/001.yaml
  text: A wise son accepts a father's discipline[b][a], but a scoffer does not listen to rebuke.
translation:
  language: hi
  text: बुद्धिमान बेटा पिता का अनुशासन स्वीकार करता है[a], पर उपहास करने वाला[b] फटकार नहीं सुनता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिमान बेटा पिता का अनुशासन सुनता है।” इब्रानी में पहले खंड की क्रिया निहित है; “सुनना” ध्यान देकर स्वीकार करने या मानने का भाव भी रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ठट्ठा करने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּן
  choice: बेटा
  rationale: इब्रानी संज्ञा एकवचन और पुल्लिंग है; नीतिवचन में यह एक प्रतिनिधि उदाहरण प्रस्तुत करती है। इसलिए लिंग को तटस्थ किए बिना ‘बेटा’ रखा गया है।
- source_word: חָכָם
  choice: बुद्धिमान
  rationale: ज्ञान-साहित्य में यह व्यावहारिक बुद्धि और नैतिक विवेक को व्यक्त करता है; ‘बुद्धिमान’ स्वाभाविक और मानक हिन्दी है।
- source_word: מוּסַר
  choice: अनुशासन
  rationale: नीतिवचन में यह केवल जानकारी नहीं, बल्कि सुधारने और प्रशिक्षित करने वाली शिक्षा का भाव रखता है। ‘अनुशासन’ इस व्यापक भाव को सुरक्षित रखता है।
- source_word: אָב
  choice: पिता का
  rationale: מוסר אב में कोई स्पष्ट स्वत्ववाचक प्रत्यय नहीं है। ‘पिता का’ हिन्दी में स्वाभाविक है और ‘अपने पिता का’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לֵץ
  choice: उपहास करने वाला
  rationale: यह नीतिवचन में ऐसे व्यक्ति की स्थापित श्रेणी है जो घमंड से सुधार का मज़ाक उड़ाता है। ‘उपहास करने वाला’ इस नैतिक मुद्रा को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַע
  choice: स्वीकार करता है / नहीं सुनता
  rationale: क्रिया का अर्थ सुनना, ध्यान देना या आज्ञापूर्वक मानना हो सकता है। पहले खंड में क्रिया निहित है और ‘स्वीकार करता है’ अनुशासन पर ध्यान देकर उसे मानने का आशय व्यक्त करता है; दूसरे खंड में ‘नहीं सुनता’ मूल क्रिया के स्पष्ट श्रवण-विषयक रूप को बनाए रखता है।
- source_word: גְּעָרָה
  choice: फटकार
  rationale: यह मौखिक डाँट या कड़ी ताड़ना को दर्शाता है। ‘फटकार’ आधुनिक हिन्दी में स्पष्ट है और अनुशासन के साथ उचित विरोध बनाती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और स्मरणीय नीतिवचनात्मक रूप रखा गया है। समानांतरता बनाए रखते हुए पहले खंड की निहित क्रिया को अर्थानुसार स्पष्ट किया गया है; वैकल्पिक अधिक शाब्दिक पाठ पादटिप्पणी में दिया गया है।
