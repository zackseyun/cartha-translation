  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सोता’ काव्यात्मक जल-बिंब को बनाए रखता है, और ‘ताकि … दूर रहा जाए’ इब्रानी के संक्षिप्त क्रियार्थक वाक्यांश को बिना अनावश्यक कर्ता जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
