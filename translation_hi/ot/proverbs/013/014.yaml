base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/014.yaml
  text: The instruction of a wise man is a fountain of life[b][a], to turn one away from the snares of death.
translation:
  language: hi
  text: बुद्धिमान पुरुष की शिक्षा[a] जीवन का सोता[b] है, मृत्यु के फंदों से दूर रहने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘बुद्धिमान पुरुष’ पुल्लिंग एकवचन में है; नीतिवचन में इसका प्रयोग प्रतिनिधिक अर्थ में होता है।
    reason: cultural_note
  - marker: b
    text: या, ‘जीवन का स्रोत’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: शिक्षा
  rationale: यहाँ תּוֹרָה किसी विधि-संहिता के बजाय ज्ञानपरक शिक्षा या उपदेश को दर्शाता है; ‘शिक्षा’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: חָכָם
  choice: बुद्धिमान पुरुष
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और नीतिवचन में प्रतिनिधिक रूप से प्रयुक्त होता है; मुख्य पाठ स्रोत की व्याकरणिक अभिव्यक्ति को बनाए रखता है।
- source_word: מְקוֹר חַיִּים
  choice: जीवन का सोता
  rationale: מְקוֹר भूमिगत स्रोत से फूटने वाले जलस्रोत या सोते का बिंब देता है; ‘जीवन का सोता’ उसके काव्यात्मक और जीवनदायी भाव को सुरक्षित रखता है।
- source_word: לָסוּר
  choice: ताकि … दूर रहा जाए
  rationale: इस क्रियार्थक रूप में प्रयोजन या परिणाम दोनों का संबंध संभव है। हिन्दी में ‘ताकि’ प्रयोजन को सहज बनाता है, जबकि निर्वैयक्तिक ‘दूर रहा जाए’ स्रोत में किसी स्पष्ट कर्म के न होने को बनाए रखता है।
- source_word: מִמֹּקְשֵׁי מָוֶת
  choice: मृत्यु के फंदों से
  rationale: מוֹקֵשׁ शिकार के फंदे या जाल को दर्शाता है; ‘मृत्यु के फंदे’ ज्ञान-साहित्य के रूपक को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
