  yaml_path: translation/ot/proverbs/013/011.yaml
  text: Wealth from vanity dwindles[b][a], but whoever gathers little by little increases it.
translation:
  language: hi
  text: व्यर्थता से आया धन घटता जाता है[a], पर जो थोड़ा-थोड़ा करके धन बटोरता है[b], वह उसे बढ़ाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “भाप/साँस से” है। यह ऐसी संपत्ति का संकेत दे सकता है जो क्षणभंगुर, सारहीन या अविश्वसनीय आधार पर हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “हाथ से”; यहाँ सम्भवतः आशय धीरे-धीरे या छोटी-छोटी मात्राओं में जमा करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: धन
  rationale: यह शब्द भौतिक संपत्ति या समृद्धि को दर्शाता है; ‘धन’ आधुनिक हिन्दी में स्वाभाविक, व्यापक और संक्षिप्त है।
- source_word: מֵהֶבֶל
  choice: व्यर्थता से मिला
  rationale: הֶבֶל का मूल बिंब ‘साँस/भाप’ और लाक्षणिक अर्थ ‘व्यर्थता, खोखलापन’ है। ‘व्यर्थता से मिला’ उस अस्पष्टता को बनाए रखता है कि ऐसा धन क्षणभंगुर, सारहीन या अनुचित आधार पर प्राप्त है; इसे केवल ‘जल्दी कमाया’ या ‘बेईमानी से कमाया’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: יִמְעָט
  choice: घटता जाता है
  rationale: क्रिया का अर्थ छोटा या कम होते जाना है। यह हिन्दी में धन के क्रमशः घटने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְקֹבֵץ
  choice: पर जो ... बटोरता है
  rationale: कृदन्त यहाँ किसी भी ऐसे व्यक्ति के लिए सामान्य संज्ञा की तरह प्रयुक्त है; ‘जो ... बटोरता है’ इस सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל יָד
  choice: थोड़ा-थोड़ा करके
  rationale: शाब्दिक रूप से इसका संबंध ‘हाथ’ से है, पर यहाँ मुहावरे का आशय छोटे-छोटे अंशों में या धीरे-धीरे जमा करना है। यह चयन पहली पंक्ति के अस्थिर धन के साथ नीतिवचन का व्यावहारिक विरोध स्पष्ट करता है।
- source_word: יַרְבֶּה
  choice: वह उसे बढ़ाता है
  rationale: हिफ़ील रूप का अर्थ ‘बढ़ाना/बहुत करना’ है। ‘उसे’ धन की ओर संकेत करता है, जो हिन्दी में आवश्यक स्पष्टता देता है।
