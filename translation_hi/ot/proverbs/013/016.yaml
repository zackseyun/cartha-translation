  text: Every prudent man acts with knowledge[a], but a fool displays folly.
translation:
  language: hi
  text: हर विवेकी व्यक्ति ज्ञान के आधार पर काम करता है, पर मूर्ख मूर्खता फैला देता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूर्खता खोलकर सामने रख देता है” या “मूर्खता प्रकट करता है।” हिब्रू क्रिया में किसी चीज़ को फैलाने अथवा खोलकर दिखाई देने योग्य बनाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: हर
  rationale: नीतिवचन की सामान्य, वितरणात्मक उक्ति में यह वर्ग के प्रत्येक व्यक्ति को दर्शाता है।
- source_word: עָרוּם
  choice: चतुर मनुष्य
  rationale: नीतिवचन में यह शब्द सामान्यतः व्यावहारिक सूझ-बूझ और सावधानी के सकारात्मक अर्थ में आता है; ‘चतुर’ आधुनिक हिंदी में संक्षिप्त और सहज है, जबकि ‘मनुष्य’ प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखता है।
- source_word: יַעֲשֶׂה
  choice: काम करता है
  rationale: व्यापक हिब्रू क्रिया को स्वाभाविक हिंदी में आदतन आचरण के रूप में व्यक्त करता है।
- source_word: בְדָעַת
  choice: ज्ञान के साथ
  rationale: 'בְ־ के साधनात्मक अथवा क्रियाविशेषणीय बल को बनाए रखता है: चतुर व्यक्ति ज्ञान के आधार पर कार्य करता है।'
- source_word: וּכְסִיל
  choice: पर मूर्ख
  rationale: हिब्रू संयोजक औपचारिक रूप से ‘और’ है, किंतु दोनों पंक्तियों के स्पष्ट विरोध को हिंदी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִפְרֹשׂ
  choice: फैला देता है
  rationale: क्रिया का मूल बिंब किसी वस्तु को फैलाने या खोलकर सामने रखने का है; यह अनुवाद उस ठोस बिंब को बनाए रखता है और मूर्खता के प्रकट हो जाने का भाव भी देता है।
- source_word: אִוֶּלֶת
  choice: मूर्खता
  rationale: हिब्रू ज्ञान-साहित्य के अमूर्त संज्ञा-पद का मानक और सहज हिंदी रूप।
