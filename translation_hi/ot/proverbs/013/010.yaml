source:
  edition: WLC
  text: רַק בְּ֭/זָדוֹן יִתֵּ֣ן מַצָּ֑ה וְ/אֶת נ֖וֹעָצִ֣ים חָכְמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/010.yaml
  text: Only by arrogance comes strife[a], but wisdom is with those who take counsel.
translation:
  language: hi
  text: केवल घमंड से झगड़ा पैदा होता है, पर जो सलाह लेते हैं, उनके पास बुद्धि होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: केवल
  rationale: यह शब्द कथन को सीमित और बलयुक्त करता है; ‘केवल’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: בְּזָדוֹן
  choice: घमंड से
  rationale: זָדוֹן में उद्दंड, ढीठ और स्वयं को बड़ा समझनेवाले अभिमान का भाव है। ‘घमंड’ सामान्य आधुनिक हिन्दी में स्पष्ट है, और ‘से’ कारण अथवा माध्यम का अर्थ व्यक्त करता है।
- source_word: יִתֵּן
  choice: पैदा होता है
  rationale: क्रिया का शाब्दिक अर्थ ‘देता है’ है, पर इस प्रसंग में वह झगड़े के उत्पन्न होने को व्यक्त करती है; ‘पैदा होता है’ हिन्दी में स्वाभाविक है।
- source_word: מַצָּה
  choice: झगड़ा
  rationale: यह शब्द विवाद, कलह या टकराव को दर्शाता है। ‘झगड़ा’ साधारण पाठक के लिए सहज और लोकोक्तिपरक है।
- source_word: וְאֶת
  choice: पर ... के पास
  rationale: दूसरा चरण पहले के विपरीत रखा गया है। ‘पर’ विरोध को स्पष्ट करता है और ‘के पास’ निहित ‘साथ होना’ की रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נוֹעָצִים
  choice: सलाह माननेवाले
  rationale: निफ़अल कृदंत उन लोगों की ओर संकेत कर सकता है जो सलाह लेते या उसे स्वीकार करते हैं। ‘सलाह माननेवाले’ ग्रहणशीलता के इस भाव को सहज हिन्दी में व्यक्त करता है, जबकि परस्पर सलाह करने का अर्थ भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह व्यावहारिक और नैतिक विवेक का प्रमुख शब्द है; ‘बुद्धि’ आधुनिक हिन्दी बाइबलीय शैली में स्वाभाविक है।
theological_decisions:
- issue: נוֹעָצִים का निष्क्रिय अथवा पारस्परिक भाव
  choice: सलाह माननेवाले
  alternative: जो आपस में सलाह करते हैं
  rationale: इब्रानी रूप सलाह दिए जाने या सलाह ग्रहण करने का भाव दे सकता है, पर परामर्श करने का पारस्परिक अर्थ भी संभव है। मुख्य पाठ ग्रहणशीलता को रखता है और पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है; किसी विशेष धर्मसैद्धांतिक निष्कर्ष को आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन-सुलभ रखी गई है। ‘घमंड’, ‘झगड़ा’, ‘सलाह माननेवाले’ और ‘बुद्धि’ सामान्य पाठकों के लिए स्पष्ट हैं, जबकि मूल के समानांतर विरोध को बनाए रखा गया है।
