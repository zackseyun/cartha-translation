  yaml_path: translation/ot/proverbs/013/003.yaml
  text: Whoever guards his mouth preserves his life[b][a]; whoever opens wide his lips comes to ruin.
translation:
  language: hi
  text: जो अपने मुँह की रखवाली करता है, वह अपने जीवन की रक्षा करता है[a]; पर जो अपने होंठों को चौड़ा खोलता है, उसका विनाश होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उसका नेफ़ेश”; संदर्भ में इसका अर्थ “उसका जीवन” सबसे स्वाभाविक है, पर इसका अर्थ “उसके प्राण” या “स्वयं उसे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वह अपने ऊपर विनाश लाता है” अथवा “विनाश उसके लिए है।” इब्रानी पदबंध संक्षिप्त है और इन निकट अर्थों की गुंजाइश रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹצֵר
  choice: रखवाली करता है
  rationale: यह कृदन्त सावधानी से पहरा देने या संभालकर रखने का भाव व्यक्त करता है; बोलने में संयम के संदर्भ में यह स्वाभाविक और स्पष्ट है।
- source_word: פִּיו
  choice: अपने मुँह की
  rationale: मूल पाठ की ठोस छवि को बनाए रखता है और दूसरे चरण के ‘होंठ’ के साथ समानांतरता सुरक्षित रखता है।
- source_word: שֹׁמֵר
  choice: रक्षा करता है
  rationale: क्रिया का मूल अर्थ ‘रखना/रक्षा करना’ है; ‘जीवन’ के साथ यह वाक्यांश संयम के फलस्वरूप जीवन के सुरक्षित रहने का भाव स्वाभाविक रूप से देता है।
- source_word: נַפְשׁוֹ
  choice: अपने जीवन की
  rationale: यहाँ נֶפֶשׁ सबसे स्वाभाविक रूप से व्यक्ति के जीवन को सूचित करता है; ‘आत्मा’ कहना इस नीतिवचन में अनावश्यक धर्मवैज्ञानिक संकीर्णता ला सकता है।
- source_word: פֹּשֵׂק
  choice: पूरे खोल देता है
  rationale: मूल क्रिया के ‘चौड़ा खोलने’ के ठोस चित्र को बनाए रखते हुए अनियंत्रित वाणी का निहित भाव प्रकट करता है, बिना उसे व्याख्यात्मक रूप से ‘उतावली बातें करना’ बना देने के।
- source_word: שְׂפָתָיו
  choice: अपने होंठ
  rationale: शाब्दिक और स्वाभाविक अनुवाद, जो ‘मुँह’ और ‘होंठ’ की काव्यात्मक समानांतरता बनाए रखता है।
- source_word: מְחִתָּה לוֹ
  choice: उसका विनाश होता है
  rationale: संक्षिप्त इब्रानी पदबंध विनाश या बरबादी के उस पर आने का परिणाम बताता है। हिंदी रूप मूल की संक्षिप्तता रखता है, जबकि निकट वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: נֶפֶשׁ का अर्थ
  choice: जीवन
  alternative: प्राण / स्वयं / आत्मा
  rationale: ज्ञान-साहित्य के इस संदर्भ में सांसारिक जीवन या व्यक्ति स्वयं मुख्य आशय है; ‘आत्मा’ शरीर से पृथक किसी तत्त्व का ऐसा अर्थ सुझा सकता है जिसे पद स्पष्ट रूप से नहीं कहता।
- issue: מְחִתָּה לוֹ का संबंध
  choice: उसका विनाश होता है
  alternative: वह अपने ऊपर विनाश लाता है / विनाश उसके लिए है
  rationale: इब्रानी पदबंध अत्यंत संक्षिप्त है और कारण, परिणाम तथा संबंध के बीच कुछ अस्पष्टता रहने देता है; मुख्य पाठ सहज परिणाम व्यक्त करता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण नीतिवचनात्मक ढंग अपनाया गया है। ‘मुँह’ और ‘होंठ’ की ठोस समानांतर छवियाँ तथा दोनों अर्धपंक्तियों का कारण-परिणाम संबंध बनाए रखा गया है।
