  text: צְ֭דָקָה תִּצֹּ֣ר תָּם דָּ֑רֶךְ וְ֝/רִשְׁעָ֗ה תְּסַלֵּ֥ף חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/006.yaml
  text: Righteousness guards the blameless in the way[a], but wickedness overturns sin.
translation:
  language: hi
  text: 'धार्मिकता निर्दोष चाल-चलन वाले की रक्षा करती है,

    पर दुष्टता पाप को उलट देती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर दुष्टता पापी को गिरा देती है।” यहाँ जिस इब्रानी शब्द का अनुवाद “पाप” किया गया है, उसे पापी व्यक्ति के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यहाँ यह शब्द व्यक्ति के नैतिक खरेपन और सही आचरण को दर्शाता है, जो उसकी रक्षा करता है। ‘धार्मिकता’ नीतिवचन की शब्दावली और इस शब्द के धर्मवैचारिक आयाम—दोनों को बनाए रखती है।
- source_word: תִּצֹּר
  choice: रक्षा करती है
  rationale: नצר का अर्थ पहरा देना, संभालना या सुरक्षित रखना है। ‘रक्षा करती है’ हिन्दी में स्वाभाविक है और क्रिया के संरक्षणकारी भाव को स्पष्ट रखता है।
- source_word: תָּם דָּרֶךְ
  choice: उस व्यक्ति ... जिसका चाल-चलन निर्दोष है
  rationale: इब्रानी पदबंध संक्षिप्त है और ऐसे व्यक्ति को चित्रित करता है जो अपने मार्ग अर्थात आचरण में खरा या निर्दोष है। हिन्दी में संबंधवाचक रचना से यही अर्थ सहज और स्पष्ट रूप में व्यक्त होता है; ‘निर्दोष’ का अर्थ पूर्ण निष्पापता नहीं, बल्कि नैतिक खरापन है।
- source_word: וְרִשְׁעָה
  choice: पर दुष्टता
  rationale: दोनों पंक्तियों में विरोध होने के कारण וְ को ‘पर’ कहा गया है। ‘दुष्टता’ अमूर्त नैतिक बुराई के अर्थ को बनाए रखती है।
- source_word: תְּסַלֵּף
  choice: उलट देती है
  rationale: סלף के पिएल रूप में मोड़ देने, बिगाड़ देने या उलट देने का भाव है। ‘उलट देती है’ मूल की असामान्य परंतु सशक्त अभिव्यक्ति को बिना अधिक व्याख्या जोड़े सुरक्षित रखती है।
- source_word: חַטָּאת
  choice: पाप
  rationale: शब्द का सीधा संज्ञात्मक अर्थ ‘पाप’ है। प्रसंग में ‘पापी’ का अर्थ भी संभव है; मुख्य पाठ में औपचारिक रूप से निकट ‘पाप’ रखकर वैकल्पिक व्यक्तिवाचक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दूसरी पंक्ति में חַטָּאת का अर्थ
  choice: मुख्य पाठ में ‘पाप’
  alternative: '‘पापी’: ‘पर दुष्टता पापी को गिरा देती है।’'
  rationale: इब्रानी कथन अत्यंत संक्षिप्त है। חַטָּאת सामान्यतः ‘पाप’ को दर्शाता है, किंतु इस विरोधी समानांतरता में इसे पापी व्यक्ति के लिए भी समझा गया है। किसी एक अर्थ से तनाव को पूरी तरह समाप्त न करते हुए मुख्य पाठ में सीधा संज्ञात्मक अर्थ और पादटिप्पणी में व्यक्तिवाचक अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण स्तर अपनाया गया है। ‘चाल-चलन’ मार्ग के नैतिक रूपक को साधारण पाठक के लिए स्पष्ट करता है। दूसरी पंक्ति की असामान्यता जानबूझकर बनाए रखी गई है, क्योंकि वह मूल इब्रानी की वास्तविक अर्थगत कठिनाई को दर्शाती है।
