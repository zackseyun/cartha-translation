translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली रखी गई है। दोनों खंडों का विरोध ‘तो ... पर’ और ‘किन्तु’ से उभारा गया है। मूल हिब्रू के शारीरिक-भूख संबंधी बिंब को ‘भूख’ और ‘तृप्त’ से बनाए रखा गया है, जबकि ‘मोटा किया जाएगा’ जैसे आज की हिन्दी में संभावित रूप से भ्रामक शाब्दिक अनुवाद से बचा गया है।
