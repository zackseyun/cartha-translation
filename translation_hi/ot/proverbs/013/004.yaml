  text: מִתְאַוָּ֣ה וָ֭/אַיִן נַפְשׁ֣/וֹ עָצֵ֑ל וְ/נֶ֖פֶשׁ חָרֻצִ֣ים תְּדֻשָּֽׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/004.yaml
  text: The sluggard craves[a], but has nothing; but the appetite of the diligent will be richly satisfied.
translation:
  language: hi
  text: आलसी लालसा तो करता है, पर उसे कुछ नहीं मिलता; किन्तु परिश्रमी की भूख भरपूर तृप्त होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִתְאַוָּה
  choice: लालसा तो करता है
  rationale: हित्पएल कृदन्त निरन्तर या आदतन प्रबल इच्छा को व्यक्त करता है। ‘लालसा करता है’ आधुनिक हिन्दी में इस सक्रिय चाह को स्वाभाविक रूप से प्रकट करता है; ‘तो’ आगे के निष्फल परिणाम के साथ विरोध उभारता है।
- source_word: וָאַיִן
  choice: पर उसे कुछ नहीं मिलता
  rationale: संयोजक के साथ अस्तित्ववाचक निषेध का शाब्दिक अर्थ ‘और कुछ नहीं’ है। प्रसंग में इच्छा के निष्फल रहने का भाव है, जिसे हिन्दी में ‘उसे कुछ नहीं मिलता’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַפְשׁוֹ
  choice: '[लालसा करने वाला व्यक्ति]'
  rationale: पहले खंड की वाक्य-रचना में נֶפֶשׁ प्रत्यय सहित आलसी व्यक्ति की चाह/भूख का संकेत देता है। हिन्दी में ‘आलसी लालसा करता है’ कहने पर व्यक्ति और उसकी भीतरी इच्छा दोनों का भाव आ जाता है; अलग से ‘प्राण’ या ‘आत्मा’ कहना यहाँ भ्रामक होता।
- source_word: עָצֵל
  choice: आलसी
  rationale: नीतिवचन में यह आदतन श्रम से बचने वाले व्यक्ति के लिए प्रचलित ज्ञान-साहित्यिक पद है। ‘आलसी’ संक्षिप्त, स्वाभाविक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְנֶפֶשׁ
  choice: किन्तु ... की भूख
  rationale: यहाँ נֶפֶשׁ व्यक्ति की आन्तरिक भूख, चाह या लालसा को दर्शाता है, न कि तकनीकी अर्थ में अमूर्त ‘आत्मा’ को। ‘भूख’ तृप्ति के अगले रूपक से स्वाभाविक रूप से जुड़ती है।
- source_word: חָרֻצִים
  choice: परिश्रमी
  rationale: बहुवचन विशेषण संज्ञा के रूप में परिश्रमशील लोगों को सूचित करता है। हिन्दी में जातिवाचक एकवचन ‘परिश्रमी’ सूक्तिपरक समानान्तरता बनाए रखता है।
- source_word: תְּדֻשָּׁן
  choice: भरपूर तृप्त की जाएगी
  rationale: דשׁן का पुअल रूप शाब्दिक रूप से ‘हृष्ट-पुष्ट/मोटा किया जाना’ और रूपकतः प्रचुरता तथा पूर्ण तृप्ति दर्शाता है। ‘भरपूर तृप्त की जाएगी’ कर्मवाच्य रूप और परिणाम—दोनों को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
