source:
  edition: WLC
  text: ט֗וֹב יַנְחִ֥יל בְּנֵֽי בָנִ֑ים וְ/צָפ֥וּן לַ֝/צַּדִּ֗יק חֵ֣יל חוֹטֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/022.yaml
  text: A good man leaves an inheritance to his grandchildren[b][a], but the wealth of a sinner is stored up for the righteous.
translation:
  language: hi
  text: भला मनुष्य अपने पोते-पोतियों[a] के लिए विरासत छोड़ जाता है, पर पापी की धन-संपत्ति धर्मी के लिए संचित[b] रहती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “बच्चों के बच्चे।”
    reason: lexical_alternative
  - marker: b
    text: या, “छिपाकर रखी हुई है” अथवा “धर्मी के लिए सुरक्षित रखी हुई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: भला मनुष्य
  rationale: यह विशेषण यहाँ संज्ञा के रूप में एक भले व्यक्ति को दर्शाता है। ‘भला मनुष्य’ आधुनिक, स्वाभाविक और नीतिवचन की प्रतिनिधिक एकवचन शैली के अनुरूप है।
- source_word: יַנְחִיל
  choice: विरासत छोड़ जाता है
  rationale: נחל के हिफ़ील रूप का अर्थ ‘उत्तराधिकार देना’ है; पारिवारिक पीढ़ियों के संदर्भ में यह हिंदी अभिव्यक्ति कारणवाचक भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: בְּנֵי בָנִים
  choice: अपने पोते-पोतियों
  rationale: शाब्दिक अर्थ ‘बच्चों के बच्चे’ है। ‘पोते-पोतियाँ’ हिंदी में अगली से अगली पीढ़ी का सहज और समावेशी संकेत है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְצָפוּן
  choice: पर ... संचित रहती है
  rationale: צפן का रूप छिपाकर रखने, जमा करने या सुरक्षित रखने का भाव देता है। विरोधात्मक समानांतरता में ‘पर’ और ‘संचित रहती है’ अर्थ को स्पष्ट रखते हैं, बिना यह तय किए कि संचय किसके द्वारा किया गया।
- source_word: לַצַּדִּיק
  choice: धर्मी के लिए
  rationale: לְ लाभार्थी को सूचित करता है और substantival singular צַדִּיק को ‘धर्मी’ के रूप में रखा गया है, जो हिंदी नीतिवचन शैली में वर्ग-प्रतिनिधि एकवचन है।
- source_word: חֵיל
  choice: धन-संपत्ति
  rationale: חֵיל यहाँ संसाधन, संपदा या धन का अर्थ देता है। विरासत के संदर्भ में ‘धन-संपत्ति’ स्पष्ट और स्वाभाविक है।
- source_word: חוֹטֵא
  choice: पापी
  rationale: संज्ञावत् प्रयुक्त कृदंत एक पाप करने वाले व्यक्ति को वर्ग-प्रतिनिधि रूप में दर्शाता है; ‘पापी’ संक्षिप्त और स्रोत-संगत है।
theological_decisions:
- issue: नीतिवचन में पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: भला मनुष्य ... धर्मी ... पापी
  alternative: भला व्यक्ति ... धर्मी जन ... पाप करने वाला व्यक्ति
  rationale: इब्रानी में तीनों पद पुल्लिंग एकवचन के वर्ग-प्रतिनिधि रूप हैं। हिंदी में ‘मनुष्य’, ‘धर्मी’ और ‘पापी’ स्रोत के व्याकरणिक रूप तथा नीतिवचन की संक्षिप्तता को बनाए रखते हैं, इन्हें केवल पुरुषों तक सीमित किए बिना।
- issue: צָפוּן में निहित कर्ता और भाव
  choice: संचित रहती है
  alternative: धर्मी के लिए छिपाकर रखी जाती है / सुरक्षित रखी जाती है
  rationale: इब्रानी निष्क्रिय/विशेषणात्मक रूप वस्तु की संचित या सुरक्षित अवस्था बताता है और संचय करने वाले को निर्दिष्ट नहीं करता। चुना हुआ रूप इस अस्पष्टता को सुरक्षित रखता है तथा किसी प्रत्यक्ष दैवी कर्ता को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, संक्षिप्त और गरिमापूर्ण नीतिवचन शैली में रखी गई है। ‘धन-संपत्ति’ सामान्य पाठक के लिए स्पष्ट है, और ‘संचित रहती है’ मूल के निष्क्रिय तथा कुछ हद तक अस्पष्ट भाव को बनाए रखता है।
