  text: יֵ֣שׁ מִ֭תְעַשֵּׁר וְ/אֵ֣ין כֹּ֑ל מִ֝תְרוֹשֵׁ֗שׁ וְ/ה֣וֹן רָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/007.yaml
  text: There is one who pretends to be rich[a], yet has nothing; another pretends to be poor, yet has great wealth.
translation:
  language: hi
  text: कोई अपने को धनी दिखाता है[a], फिर भी उसके पास कुछ नहीं होता; कोई अपने को निर्धन दिखाता है, फिर भी उसके पास बहुत धन होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई अपने को धनी बनाता है, फिर भी उसके पास कुछ नहीं होता; कोई अपने को निर्धन बनाता है, फिर भी उसके पास बहुत धन होता है।” इब्रानी के प्रतिवर्ती क्रियारूप स्वयं को वैसा दिखाने अथवा वास्तव में स्वयं को धनी या निर्धन बनाने—दोनों का भाव दे सकते हैं। मुख्य पाठ में नीतिवचन के तीखे व्यंग्य के कारण दिखावे का अर्थ अपनाया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ
  choice: कोई
  rationale: यह अस्तित्वसूचक पद एक सामान्य मानवीय स्थिति प्रस्तुत करता है; हिन्दी में “कोई” नीतिवचन की सूक्तिपरक शैली को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִתְעַשֵּׁר
  choice: अपने को धनी दिखाता है
  rationale: हित्पएल रूप स्वयं को धनी प्रस्तुत करने अथवा स्वयं को धनी बनाने का भाव दे सकता है। “उसके पास कुछ नहीं” के तीखे विरोध के कारण मुख्य पाठ में दिखावे का अर्थ अधिक उपयुक्त है।
- source_word: וְאֵין כֹּל
  choice: फिर भी उसके पास कुछ नहीं होता
  rationale: אֵין के साथ כֹּל पूर्ण अभाव पर बल देता है। “फिर भी” विरोध को और “कुछ नहीं” सर्वथा अभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתְרוֹשֵׁשׁ
  choice: अपने को निर्धन दिखाता है
  rationale: यह प्रतिवर्ती रूप स्वयं को निर्धन प्रस्तुत करने या स्वयं को निर्धन बनाने, दोनों अर्थों की संभावना रखता है। समानांतर पहले खंड के अनुरूप मुख्य पाठ में दिखावे का अर्थ रखा गया है।
- source_word: וְהוֹן רָב
  choice: फिर भी उसके पास बहुत धन होता है
  rationale: הוֹן धन-संपत्ति और רָב प्रचुरता को दर्शाता है। यह चयन संक्षिप्त, सहज और मूल विरोध को स्पष्ट रखता है।
