  text: רָב אֹ֭כֶל נִ֣יר רָאשִׁ֑ים וְ/יֵ֥שׁ נִ֝סְפֶּ֗ה בְּ/לֹ֣א מִשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/023.yaml
  text: The fallow ground of the poor[b][a] yields abundant food, but some are swept away for lack of justice.
translation:
  language: hi
  text: गरीबों की जोती हुई भूमि[b] भरपूर भोजन देती है, पर कोई न्याय के अभाव में नष्ट हो जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर कुछ ऐसा भी है जो बिना न्याय के नष्ट हो जाता है।” इब्रानी की दूसरी पंक्ति बहुत संक्षिप्त है और इसे अधिक निर्वैयक्तिक रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “जोती हुई भूमि” का अनुवाद “परती भूमि” या “नई जोती हुई भूमि” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָב
  choice: भरपूर
  rationale: यह भोजन की बड़ी मात्रा बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: कृषि-संदर्भ में यह खेत की खाद्य उपज को व्यापक रूप से व्यक्त करता है, बिना किसी विशेष फसल का संकेत दिए।
- source_word: נִיר
  choice: जोता हुआ खेत
  rationale: यह खेती योग्य, जोती गई या नई तोड़ी गई भूमि को दर्शाता है; ‘जोता हुआ खेत’ सामान्य पाठक के लिए स्पष्ट कृषि-चित्र देता है।
- source_word: רָאשִׁים
  choice: गरीबों
  rationale: यहाँ असामान्य रूप को परंपरागत और संदर्भानुकूल अर्थ ‘गरीब लोग’ में लिया गया है।
- source_word: וְיֵשׁ
  choice: पर ... कोई
  rationale: וְיֵשׁ अस्तित्वसूचक है और अगले एकवचन कृदंत के साथ किसी अनिर्दिष्ट व्यक्ति या वस्तु की ओर संकेत कर सकता है; ‘पर’ दोनों पंक्तियों का विरोध स्पष्ट करता है।
- source_word: נִסְפֶּה
  choice: नष्ट हो जाता है
  rationale: निफ़अल रूप का निष्क्रिय/परिणामात्मक भाव सुरक्षित रखते हुए यह मिट जाने, उजड़ने या विनाश को व्यापक रूप से व्यक्त करता है।
- source_word: בְּלֹא מִשְׁפָּט
  choice: न्याय के अभाव में
  rationale: यह न्याय, उचित निर्णय या न्यायपूर्ण व्यवस्था की अनुपस्थिति को व्यक्त करता है और कारण-संबंध को अनावश्यक रूप से अधिक निश्चित नहीं बनाता।
theological_decisions:
- issue: दूसरी पंक्ति में नष्ट होने वाले का संदर्भ
  choice: ‘कोई नष्ट हो जाता है’—अनिर्दिष्ट एकवचन को बनाए रखा गया है।
  alternative: ‘कुछ नष्ट हो जाता है’ अथवा ‘अन्याय के कारण उपज बह जाती है।’
  rationale: इब्रानी וְיֵשׁ נִסְפֶּה संक्षिप्त और संदर्भ की दृष्टि से अस्पष्ट है। अनिर्दिष्ट ‘कोई’ व्याकरणिक एकवचन और सामाजिक अन्याय की संभावित ओर संकेत दोनों को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक निर्वैयक्तिक पाठ की संभावना बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कृषि-चित्र को स्पष्ट बनाने के लिए ‘जोता हुआ खेत’ और मात्रा के लिए ‘भरपूर भोजन’ चुना गया है। दूसरी पंक्ति की इब्रानी अस्पष्टता को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
