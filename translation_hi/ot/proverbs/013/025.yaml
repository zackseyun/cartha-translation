translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की समानांतर शैली के अनुरूप रखी गई है। ‘भूख मिटने तक’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल इब्रानी की व्यापक अर्थ-सीमा सुरक्षित रखती है।
