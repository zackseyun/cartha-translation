  text: A righteous man eats to the satisfaction of his soul[a], but the belly of the wicked lacks.
translation:
  language: hi
  text: 'धर्मी अपनी भूख मिटने तक खाता है,[a]

    पर दुष्टों का पेट खाली रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “अपने प्राण की तृप्ति तक।” इब्रानी נֶפֶשׁ (नेफेश) का अर्थ संदर्भ के अनुसार “प्राण,” “जीवन,” “स्वयं,” या “भूख/लालसा” हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और नीतिवचन में एक प्रतिनिधि धर्मी व्यक्ति को दर्शाता है।
- source_word: אֹכֵל
  choice: खाता है
  rationale: कृदन्त सामान्य या अभ्यस्त सत्य व्यक्त करता है; हिन्दी का सामान्य वर्तमान काल स्वाभाविक है।
- source_word: לְשֹׂבַע נַפְשׁוֹ
  choice: अपनी भूख मिटने तक
  rationale: शाब्दिक रूप से यह ‘अपने नेफेश की तृप्ति तक’ है। भोजन के संदर्भ में נֶפֶשׁ भूख या इच्छा को सूचित कर सकता है; यह चयन हिन्दी में स्वाभाविक ढंग से पर्याप्त तृप्ति का भाव देता है।
- source_word: וּבֶטֶן
  choice: पर ... पेट
  rationale: संदर्भ में संयोजक विरोधसूचक है और בֶּטֶן का सीधा अर्थ ‘पेट’ है।
- source_word: רְשָׁעִים
  choice: दुष्टों का
  rationale: बहुवचन संज्ञात्मक विशेषण दुष्ट लोगों के वर्ग को दर्शाता है।
- source_word: תֶּחְסָר
  choice: भूखा रहता है
  rationale: क्रिया का अर्थ कमी में होना या अभावग्रस्त रहना है। ‘पेट’ के साथ यह हिन्दी में अभाव और अतृप्ति दोनों को संक्षेप में व्यक्त करता है।
