  yaml_path: translation/ot/proverbs/013/002.yaml
  text: From the fruit of a man's mouth he eats good[b][a], but the soul of the treacherous feeds on violence.
translation:
  language: hi
  text: मनुष्य अपने मुँह के फल से भलाई पाता है, पर विश्वासघातियों की लालसा[a] हिंसा की होती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘प्राण’ (नेफ़ेश); यहाँ इसका अर्थ सम्भवतः ‘भूख’ या ‘लालसा’ है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी की दूसरी पंक्ति संक्षिप्त है और उसमें क्रिया नहीं है। इसका अधिक शाब्दिक रूप हो सकता है: ‘पर विश्वासघातियों का प्राण हिंसा [खाता है]।’'
    reason: alternative_reading
lexical_decisions:
- source_word: מִפְּרִי פִי
  choice: अपने मुँह के फल से
  rationale: ‘फल’ के इब्रानी रूपक और ‘मुँह’ की ठोस छवि को बनाए रखते हुए מִן को स्रोत/परिणाम बताने वाले ‘से’ के रूप में प्रस्तुत किया गया है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन शब्द नीतिवचन में सामान्य प्रतिनिधि अर्थ रखता है; आधुनिक हिन्दी में ‘मनुष्य’ उसी सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹאכַל טוֹב
  choice: भलाई खाता है
  rationale: अपूर्ण क्रिया का नीतिवचन-संबंधी सामान्य वर्तमान अर्थ लिया गया है। ‘खाता है’ फल/भोजन की छवि बनाए रखता है और ‘भलाई’ טוֹב के व्यापक, अनिश्चित अर्थ को सुरक्षित रखती है।
- source_word: וְנֶפֶשׁ
  choice: पर … की भूख
  rationale: וְ को दोनों पंक्तियों के विरोध के कारण ‘पर’ किया गया है। נֶפֶשׁ का मूल अर्थ ‘प्राण/स्व’ है, पर इस प्रसंग में वह भूख या लालसा को सूचित कर सकता है; मूल शब्दार्थ फुटनोट में दिया गया है।
- source_word: בֹּגְדִים
  choice: विश्वासघातियों
  rationale: यह कृदंत उन लोगों के स्थायी चरित्र को बताता है जो छल या विश्वासघात से व्यवहार करते हैं।
- source_word: חָמָס
  choice: हिंसा
  rationale: यह शब्द हिंसा, क्रूरता या हिंसक अन्याय को व्यक्त करता है; ‘हिंसा’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: दूसरी पंक्ति में נֶפֶשׁ और लुप्त क्रिया का संबंध
  choice: ‘भूख … हिंसा की होती है’
  alternative: ‘विश्वासघातियों का प्राण हिंसा [खाता है]’
  rationale: इब्रानी पंक्ति अत्यंत संक्षिप्त और क्रियारहित है। मुख्य पाठ में सम्भावित आशय को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि शाब्दिक तथा दीर्घवृत्तीय विकल्प फुटनोट में रखकर मूल की अस्पष्टता सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुँह का फल’ और ‘खाना’ जैसी मूल काव्यात्मक छवियाँ सुरक्षित हैं; दूसरी पंक्ति की इब्रानी अस्पष्टता को मुख्य पाठ और फुटनोट के संयोजन से दर्शाया गया है।
