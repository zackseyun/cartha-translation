base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/013.yaml
  text: Whoever despises a word will be ruined by it[c][b][a], but he who fears the commandment will be rewarded.
translation:
  language: hi
  text: जो वचन[a] को तुच्छ जानता है, वह उसके कारण नष्ट हो जाएगा[b]; पर जो आज्ञा का भय मानता है, वह प्रतिफल पाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बात’ अथवा ‘विषय।’ इब्रानी דָבָר के ये सभी अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह उसके कारण हानि उठाएगा’ अथवा ‘वह अपने ऊपर विनाश लाता है।’
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, ‘उसे प्रतिदान दिया जाएगा’ या ‘उसे उसके किए का फल मिलेगा।’ यहाँ प्रसंग सकारात्मक प्रतिफल का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּז
  choice: तुच्छ जानता है
  rationale: यह कृदन्त किसी बात को हेय समझने या उसका तिरस्कार करने वाले व्यक्ति को दर्शाता है। ‘तुच्छ जानता है’ आधुनिक हिन्दी में स्वाभाविक है और मूल का नैतिक बल बनाए रखता है।
- source_word: לְדָבָר
  choice: वचन
  rationale: דָבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ ‘वचन’ कथित शिक्षा या परामर्श की ओर संकेत करता है, पर कहावत की व्यापकता भी बनाए रखता है।
- source_word: יֵחָבֶל לוֹ
  choice: वह उसके कारण नाश होगा
  rationale: חבל का निफ़अल रूप यहाँ हानि या विनाश में पड़ने का भाव देता है। ‘उसके कारण’ सर्वनाम-सहित इब्रानी अभिव्यक्ति को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि अन्य अर्थ-संभावनाएँ भी हैं।
- source_word: וִירֵא
  choice: जो … भय मानता है
  rationale: ירא श्रद्धामिश्रित भय का भाव रखता है। ‘भय मानता है’ मूल शब्दावली और ज्ञान-साहित्य के नैतिक भार को बनाए रखता है; इसे केवल ‘आदर करता है’ कहकर नरम नहीं किया गया।
- source_word: מִצְוָה
  choice: आज्ञा
  rationale: מִצְוָה का सीधा अर्थ ‘आज्ञा’ है। यह संक्षिप्त और प्रचलित हिन्दी शब्द है तथा पहले चरण के ‘वचन’ के साथ उचित विरोध प्रस्तुत करता है।
- source_word: יְשֻׁלָּם
  choice: प्रतिफल पाएगा
  rationale: שלם का पुअल रूप चुकाए जाने या किए के अनुसार फल मिलने का संकेत देता है। इस सकारात्मक संदर्भ में ‘प्रतिफल पाएगा’ स्वाभाविक है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הוּא
  choice: वह
  rationale: स्पष्ट सर्वनाम הוּא दूसरे चरण के कर्ता पर बल देता है। ‘वह’ इस बल को हिन्दी में बनाए रखता है और कहावत में सामान्य प्रतिनिधि व्यक्ति को सूचित करता है।
theological_decisions:
- issue: ज्ञान-वचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: दोनों चरणों में सामान्य व्यक्ति के लिए ‘जो … वह’ का प्रयोग
  alternative: दूसरे चरण में स्पष्ट पुरुषवाचक रूप, जैसे ‘जो पुरुष … वह’
  rationale: इब्रानी पुल्लिंग एकवचन कहावत में सामान्य मानव-प्रतिनिधि के रूप में काम करता है। हिन्दी का ‘जो … वह’ संख्या और वाक्य-संरचना को बनाए रखते हुए अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित नहीं करता।
- issue: יְשֻׁלָּם में प्रतिदान का स्वरूप
  choice: संदर्भानुसार सकारात्मक ‘प्रतिफल पाएगा’
  alternative: अधिक शाब्दिक ‘उसे बदला दिया जाएगा’ या ‘उसे चुकाया जाएगा’
  rationale: दूसरे चरण में आज्ञा का भय मानने वाले के लिए क्रिया सकारात्मक परिणाम बताती है। ‘प्रतिफल’ उस अर्थ को स्पष्ट करता है, पर किसी विशेष भौतिक समृद्धि या संप्रदायगत प्रतिफल-सिद्धान्त को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘तुच्छ जानता है’ और ‘भय मानता है’ सामान्य पाठक के लिए बोधगम्य हैं तथा इब्रानी कहावत की नैतिक तीक्ष्णता बनाए रखते हैं। अर्धविराम दोनों समांतर और विरोधी चरणों को स्पष्ट करता है।
