source:
  edition: WLC
  text: תַּאֲוָ֣ה נִ֭הְיָה תֶּעֱרַ֣ב לְ/נָ֑פֶשׁ וְ/תוֹעֲבַ֥ת כְּ֝סִילִ֗ים ס֣וּר מֵ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/019.yaml
  text: A desire fulfilled is sweet to the soul[a], but to turn away from evil is an abomination to fools.
translation:
  language: hi
  text: 'पूरी हुई अभिलाषा मन को मधुर लगती है,[a]

    परन्तु बुराई से हटना मूर्खों को घृणित लगता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साकार हुई अभिलाषा मन को सुखद लगती है।”
    reason: נִהְיָה और תֶּעֱרַב के क्रमशः ‘साकार हुई’ और ‘सुखद’ अर्थ मूल के वैध शाब्दिक विकल्प हैं।
lexical_decisions:
- source_word: תַּאֲוָה
  choice: अभिलाषा
  rationale: यह शब्द इच्छा या लालसा का व्यापक भाव व्यक्त करता है; ‘अभिलाषा’ यहाँ गरिमापूर्ण और स्वाभाविक है तथा अनुचित तीव्रता नहीं जोड़ता।
- source_word: נִהְיָה
  choice: पूरी हुई
  rationale: निफ़अल रूप उस अभिलाषा के साकार या पूर्ण हो जाने की अवस्था बताता है; हिंदी में ‘पूरी हुई अभिलाषा’ स्वाभाविक है।
- source_word: תֶּעֱרַב
  choice: मधुर लगती है
  rationale: मूल क्रिया में सुखद या मीठा होने का भाव है; ‘मधुर’ उस रूपक को बनाए रखता है और हिंदी में मन के साथ सहज है।
- source_word: לְנָפֶשׁ
  choice: मन को
  rationale: נפש यहाँ व्यक्ति के भीतरी अनुभव या स्वयं को सूचित करता है। आधुनिक हिंदी में ‘मन को’ भावात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक ‘प्राण को’ इस प्रसंग में असहज होता।
- source_word: וְתוֹעֲבַת
  choice: परन्तु ... घृणित लगता है
  rationale: संयोजक दोनों पंक्तियों का विरोध दिखाता है, इसलिए ‘परन्तु’ उपयुक्त है। תועבה की तीव्र घृणा को ‘घृणित’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּסִילִים
  choice: मूर्खों
  rationale: नीतिवचन में यह नैतिक और बौद्धिक हठ वाले व्यक्तियों के लिए प्रयुक्त मानक ज्ञान-साहित्य शब्द है; ‘मूर्ख’ दोनों आयामों को बनाए रखता है।
- source_word: סוּר
  choice: हटना
  rationale: यह बुराई को छोड़ने या उससे दूर होने की इच्छापूर्ण क्रिया है; ‘से हटना’ संक्षिप्त, सहज और नैतिक आशय के अनुकूल है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: ज्ञान-साहित्य के संदर्भ में רע नैतिक बुराई को सूचित करता है, न कि केवल हानि या विपत्ति को।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और लोकोक्तिपरक रखी गई है। पहली पंक्ति का स्वाद-संबंधी रूपक ‘मधुर’ से सुरक्षित है, जबकि נפש को प्रसंगानुकूल और सहज ‘मन’ से व्यक्त किया गया है।
