  text: אוֹר צַדִּיקִ֥ים יִשְׂמָ֑ח וְ/נֵ֖ר רְשָׁעִ֣ים יִדְעָֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/009.yaml
  text: The light of the righteous rejoices[a], but the lamp of the wicked goes out.
translation:
  language: hi
  text: धर्मियों का प्रकाश आनन्दित होता है[a], पर दुष्टों का दीपक बुझ जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रसन्न होता है।’ इब्रानी क्रिया का सामान्य अर्थ ‘आनन्दित होना’ या ‘प्रसन्न होना’ है; क्योंकि इसका कर्ता ‘प्रकाश’ है, कुछ लोग संदर्भ के अनुसार इसका भाव ‘तेज चमकता है’ समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: प्रकाश
  rationale: यह शब्द सामान्यतः प्रकाश या उजियाले को दर्शाता है। यहाँ ‘प्रकाश’ दूसरे चरण के ‘दीपक’ के साथ काव्यात्मक विरोध बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मियों’ नीतिवचन-साहित्य में नैतिक श्रेणी को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יִשְׂמָח
  choice: आनन्दित होता है
  rationale: שׂמח का सामान्य अर्थ ‘आनन्दित होना’ या ‘प्रसन्न होना’ है। प्रकाश को कर्ता बनाकर किया गया मानवीकरण सुरक्षित रखा गया है; ‘तेज चमकता है’ संदर्भानुकूल व्याख्या है, पर क्रिया का मूल अर्थ नहीं।
- source_word: נֵר
  choice: दीपक
  rationale: यह शब्द सामान्यतः तेल के दीपक को दर्शाता है, मोमबत्ती को नहीं। ‘दीपक’ आधुनिक हिन्दी में स्वाभाविक है और पहले चरण के ‘प्रकाश’ से भेद बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘दुष्टों’ नीतिवचन के नैतिक विरोध को स्पष्ट और संक्षिप्त रखता है।
- source_word: יִדְעָךְ
  choice: बुझ जाता है
  rationale: दीपक के विषय में इस क्रिया का अर्थ बुझना या बुझा दिया जाना है। अकर्मक ‘बुझ जाता है’ किसी बाहरी कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וְ
  choice: पर
  rationale: मूल संयोजक का सामान्य अर्थ ‘और’ है, किन्तु यहाँ वह विरोधी काव्य-पंक्तियों को जोड़ता है; ‘पर’ इस प्रतिकूल संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
