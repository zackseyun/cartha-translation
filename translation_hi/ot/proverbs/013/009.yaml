  terminology: “धर्मी/दुष्ट,” “प्रकाश,” and “दीपक” are established, comprehensible Hindi biblical and wisdom-literature terms. “दीपक” correctly avoids the anachronistic specificity of a candle. The footnote accurately distinguishes the verb’s ordinary sense from the contextual interpretation “तेज चमकता है.”
