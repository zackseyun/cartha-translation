  source_fidelity: 'The translation closely represents the Hebrew poetic contrast: אוֹר as “प्रकाश,” צַדִּיקִים as “धर्मियों,” the personified יִשְׂמָח as “आनन्दित होता है,” נֵר as “दीपक,” and יִדְעָךְ as “बुझ जाता है.” “पर” appropriately conveys the adversative force of the parallel cola without claiming that the Hebrew conjunction itself lexically means “but.”'
