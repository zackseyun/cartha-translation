  text: הלוך אֶת חֲכָמִ֣ים ו/חכם וְ/רֹעֶ֖ה כְסִילִ֣ים יֵרֽוֹעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/020.yaml
  text: Whoever walks with the wise will become wise[a], but a companion of fools will suffer harm.
translation:
  language: hi
  text: जो बुद्धिमानों के साथ चलता है, वह बुद्धिमान हो जाएगा; परन्तु मूर्खों की संगति करनेवाला हानि उठाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ אֶת חֲכָמִים
  choice: जो बुद्धिमानों के साथ चलता है
  rationale: इब्रानी में भाव सामान्य और नीतिवचनात्मक है। ‘साथ चलता है’ आचरण और संगति—दोनों का रूपक बनाए रखता है।
- source_word: וַחֲכָם
  choice: वह बुद्धिमान हो जाएगा
  rationale: 'यह रूप संगति के परिणाम को व्यक्त करता है: बुद्धिमानों के साथ रहने से व्यक्ति बुद्धिमान बनता है।'
- source_word: וְרֹעֶה כְסִילִים
  choice: परन्तु मूर्खों की संगति करनेवाला
  rationale: רעה का मूल अर्थ चराना हो सकता है, पर यहाँ समानांतरता में इसका अर्थ साथ रखना या संगति करना है। ‘संगति करनेवाला’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יֵרוֹעַ
  choice: हानि उठाएगा
  rationale: निफ़अल रूप प्रतिकूल परिणाम, चोट या नुकसान सहने का भाव देता है। ‘हानि उठाएगा’ कुल विनाश का अनावश्यक अर्थ जोड़े बिना इस व्यापकता को बनाए रखता है।
