  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और नीतिवचन की संक्षिप्त समानांतर शैली के अनुरूप रखी गई है। ‘बुद्धिमानों’ और ‘मूर्खों’ को लिंग-विशेष तक सीमित न मानकर सामान्य मानव-श्रेणियों के रूप में प्रस्तुत किया गया है।
