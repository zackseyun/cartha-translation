  text: חוֹשֵׂ֣ךְ שִׁ֭בְט/וֹ שׂוֹנֵ֣א בְנ֑/וֹ וְ֝/אֹהֲב֗/וֹ שִֽׁחֲר֥/וֹ מוּסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/024.yaml
  text: Whoever withholds his rod hates his son[b][a], but whoever loves him diligently seeks discipline.
translation:
  language: hi
  text: जो अपनी छड़ी को रोके रखता है[a], वह अपने बेटे से घृणा करता है; पर जो उससे प्रेम करता है, वह लगन से उसे अनुशासन देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी छड़ी का प्रयोग नहीं करता।’ इब्रानी क्रिया का अर्थ किसी वस्तु को रोक रखना, बचाए रखना, या उसका प्रयोग न करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, इब्रानी क्रिया का संबंध ‘भोर में’ या ‘जल्दी’ खोजने से है; यहाँ इसका भाव बेटे को अनुशासन देने में लगनशील और तत्पर होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹשֵׂךְ
  choice: रोके रखता है
  rationale: यह कृदन्त छड़ी का उपयोग न करने या उसे रोक रखने की सक्रियता व्यक्त करता है। ‘रोके रखता है’ आधुनिक हिन्दी में इस भाव को स्पष्ट करता है और इसे दयापूर्ण ‘बख्शने’ के अर्थ में नरम नहीं करता।
- source_word: שִׁבְטוֹ
  choice: अपनी छड़ी
  rationale: שֵׁבֶט का ठोस अर्थ छड़ी, दण्ड या लाठी है। पारिवारिक अनुशासन के इस सन्दर्भ में ‘छड़ी’ स्वाभाविक है और मूल बिम्ब को बनाए रखती है।
- source_word: שׂוֹנֵא
  choice: घृणा करता है
  rationale: मूल क्रिया का सीधा अर्थ ‘घृणा करना’ है। नीतिवचन की तीखी विरोधात्मक शैली बनाए रखने के लिए इसे कमजोर नहीं किया गया।
- source_word: בְנוֹ
  choice: अपने बेटे से
  rationale: इब्रानी पाठ विशेष रूप से ‘उसका बेटा’ कहता है; इसलिए लिंग-निरपेक्ष ‘बच्चा’ के बजाय ‘बेटा’ रखा गया।
- source_word: וְאֹהֲבוֹ
  choice: पर जो उससे प्रेम करता है
  rationale: कृदन्त और पुरुषवाचक कर्म-प्रत्यय को स्वाभाविक हिन्दी में प्रस्तुत किया गया है; ‘उससे’ का संकेत बेटे की ओर है।
- source_word: שִׁחֲרוֹ
  choice: उसे ... देने में तत्पर रहता है
  rationale: पिएल रूप का शाब्दिक सम्बन्ध भोर में या जल्दी खोजने से है, पर यहाँ यह लगन, तत्परता और समय रहते किए गए प्रयत्न का मुहावरेदार भाव देता है। हिन्दी अभिव्यक्ति उस भाव और बेटे की ओर संकेत करने वाले प्रत्यय, दोनों को रखती है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में מוּסָר सुधार, शिक्षा और नैतिक प्रशिक्षण को समेटता है। ‘अनुशासन’ दण्ड तक सीमित हुए बिना सुधारात्मक पक्ष को व्यक्त करता है।
theological_decisions:
- issue: क्या छड़ी के ठोस बिम्ब को सामान्य सुधार या मार्गदर्शन में बदल दिया जाए
  choice: ‘छड़ी’ के ठोस बिम्ब और ‘अनुशासन’ की व्यापक संकल्पना, दोनों को बनाए रखा गया।
  alternative: ‘छड़ी’ को हटाकर केवल ‘सुधार’, ‘मार्गदर्शन’ या ‘परवरिश’ कहना।
  rationale: मूल पाठ स्पष्ट रूप से שֵׁבֶט का प्रयोग करता है, इसलिए उसके बिम्ब को नैतिक बहस के कारण मिटाना उचित नहीं। साथ ही מוּסָר केवल शारीरिक दण्ड नहीं, बल्कि व्यापक सुधारात्मक प्रशिक्षण भी है; अतः अनुवाद इस तनाव को खुला रखता है।
- issue: ‘घृणा’ की कठोर भाषा को नरम करना
  choice: मूल की तीखी विरोधात्मक भाषा के अनुसार ‘घृणा करता है’ रखा गया।
  alternative: ‘भलाई नहीं चाहता’, ‘उपेक्षा करता है’ या ‘कम प्रेम करता है’।
  rationale: इस पद में שׂנא को तुलनात्मक बनाने की कोई अनिवार्यता नहीं है। नीतिवचन अतिशय तीखे विरोध द्वारा अपना बिन्दु रखता है, इसलिए उसका प्रभाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली अपनाई गई है। ‘घृणा’, ‘छड़ी’ और ‘अनुशासन’ सामान्य पाठक के लिए स्पष्ट हैं। समानान्तर रचना और ‘पर’ के द्वारा मूल का तीखा विरोध बनाए रखा गया है।
