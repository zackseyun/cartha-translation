base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/005.yaml
  text: A righteous man hates a lying word[b][a], but a wicked man acts shamefully and disgracefully.
translation:
  language: hi
  text: धर्मी मनुष्य झूठी बात से घृणा करता है, पर दुष्ट घृणित होता है और लज्जा लाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर दुष्ट अपने को घृणित बनाता है और लज्जित होता है।” अंतिम दो इब्रानी क्रियाओं को दुष्ट के घृणित होने और लज्जित होने, अथवा उसके अपने को घृणित बनाने और लज्जा लाने के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר שֶׁקֶר
  choice: झूठी बात
  rationale: इब्रानी रचना का शाब्दिक अर्थ ‘झूठ की बात/वचन’ है। ‘झूठी बात’ ठोस अभिव्यक्ति और स्वाभाविक आधुनिक हिन्दी—दोनों को बनाए रखती है।
- source_word: יִשְׂנָא
  choice: घृणा करता है
  rationale: שׂנא के सीधे और प्रबल नैतिक विरोध को व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी मनुष्य
  rationale: पुल्लिंग एकवचन में प्रयुक्त विशेषण यहाँ प्रतिनिधि व्यक्ति को दर्शाता है; यह चयन नीतिवचन की एकवचन शैली को बनाए रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह पुल्लिंग एकवचन संज्ञात्मक प्रयोग है। हिन्दी में ‘दुष्ट’ समानांतर विरोध को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַבְאִישׁ
  choice: घिनौना काम करता
  rationale: באש के हिफ़ील रूप में दुर्गंधयुक्त, घृणित या अप्रिय होने/करने का भाव है। प्रसंग में यह नैतिक घिनौनेपन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיַחְפִּיר
  choice: और बदनामी लाता है
  rationale: חפר का यह रूप लज्जित होने, लज्जाजनक आचरण करने या अपमान लाने के अर्थ की अनुमति देता है। मुख्य पाठ सक्रिय अर्थ चुनता है, जबकि वैकल्पिक अकर्मक अर्थ पादटिप्पणी में सुरक्षित है।
