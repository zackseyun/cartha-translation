source:
  edition: WLC
  text: חַ֭טָּאִים תְּרַדֵּ֣ף רָעָ֑ה וְ/אֶת צַ֝דִּיקִ֗ים יְשַׁלֶּם טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/021.yaml
  text: Disaster pursues sinners, but good repays the righteous.
translation:
  language: hi
  text: विपत्ति पापियों का पीछा करती है, पर भलाई धर्मियों को प्रतिफल देती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָעָה
  choice: विपत्ति
  rationale: यहाँ स्त्रीलिंग कर्ता के रूप में प्रयुक्त शब्द नैतिक बुराई से अधिक पापियों पर आने वाली मुसीबत या विपदा को दर्शाता है; इसलिए प्रसंगानुकूल और स्वाभाविक हिंदी में ‘विपत्ति’ चुना गया।
- source_word: תְּרַדֵּף
  choice: पीछा करती है
  rationale: हिब्रू क्रिया के सक्रिय, निरंतर पीछा करने वाले चित्र को सीधे और स्वाभाविक ढंग से बनाए रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: नीतिवचन में यह नैतिक रूप से सही आचरण करने वालों के लिए स्थापित और सुबोध शब्द है।
- source_word: יְשַׁלֶּם
  choice: प्रतिफल देती है
  rationale: क्रिया में बदला चुकाने या उचित फल देने का भाव है। ‘प्रतिफल देती है’ हिंदी में स्त्रीलिंग कर्ता ‘भलाई’ के साथ स्वाभाविक है और केवल पुरस्कार देने तक अर्थ को सीमित नहीं करती।
- source_word: טוֹב
  choice: भलाई
  rationale: पद के अंत में आया पुल्लिंग एकवचन शब्द क्रिया के पश्चात् स्थित कर्ता के रूप में समझा जा सकता है—अर्थात भलाई धर्मियों को उनका फल देती है। हिंदी में ‘भलाई’ इस व्यक्तिकरण को बनाए रखती है।
theological_decisions:
- issue: दूसरे अर्धपद में प्रतिफल देने वाला कौन है
  choice: ‘भलाई’ को व्यक्तिरूप कर्ता रखा गया है
  alternative: ईश्वर को अप्रकट कर्ता मानकर ‘वह धर्मियों को भलाई का फल देता है’
  rationale: हिब्रू में צַדִּיקִים को स्पष्ट कर्मचिह्न אֶת के साथ रखा गया है और טוֹב क्रिया के बाद कर्ता हो सकता है। पाठ में ईश्वर का स्पष्ट उल्लेख नहीं है, इसलिए उसे जोड़कर अस्पष्टता को धर्मसिद्धान्त की ओर नहीं मोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। दोनों अर्धपदों के समानांतर व्यक्तिकरण—‘विपत्ति पीछा करती है’ और ‘भलाई प्रतिफल देती है’—को सुरक्षित रखा गया है।
