base_translation:
  language: en
  yaml_path: translation/ot/proverbs/013/008.yaml
  text: A man's wealth is the ransom of his life[a], but a poor man does not hear a rebuke.
translation:
  language: hi
  text: 'मनुष्य के प्राण की छुड़ौती उसका धन है,

    पर निर्धन कोई फटकार नहीं सुनता।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर निर्धन कोई धमकी नहीं सुनता।” संभवतः भाव यह है कि निर्धन के पास देने को कुछ नहीं होता, इसलिए उससे धन ऐंठने या छुड़ौती माँगने के लिए उसे निशाना नहीं बनाया जाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: छुड़ौती-मूल्य
  rationale: यह शब्द किसी हानि या दंड को टालने के लिए दिए जाने वाले मूल्य को दर्शाता है। ‘छुड़ौती-मूल्य’ इसके ठोस आर्थिक और कानूनी भाव को बनाए रखता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ आशय मनुष्य के जीवन से है, किसी पृथक अमूर्त ‘आत्मा’ से नहीं। ‘प्राण’ हिंदी की नीतिवचनात्मक शैली में स्वाभाविक और सटीक है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन प्रतिनिधिक रूप में है। ‘मनुष्य’ उस सामान्य मानवीय संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עָשְׁרוֹ
  choice: उसका धन
  rationale: संज्ञा का अर्थ धन-संपत्ति है; ‘धन’ संक्षिप्त है और निर्धन के साथ स्पष्ट विरोध बनाता है।
- source_word: רָשׁ
  choice: निर्धन
  rationale: यह शब्द गरीब या अभावग्रस्त व्यक्ति को दर्शाता है। ‘निर्धन’ गरिमापूर्ण, संक्षिप्त और आधुनिक मानक हिंदी में सुबोध है।
- source_word: לֹא שָׁמַע
  choice: कोई ... नहीं सुनता
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना’ है। इसे बनाए रखने से यह खुला रहता है कि निर्धन ऐसी डाँट या धमकी का लक्ष्य ही नहीं बनता।
- source_word: גְּעָרָה
  choice: डाँट
  rationale: शब्द का मूल अर्थ कड़ी फटकार या डाँट है और प्रसंग में धमकी का भाव भी संभव है। मुख्य पाठ में सीधा अर्थ रखा गया है तथा वैकल्पिक सामाजिक संकेत पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। पहली पंक्ति की आर्थिक-कानूनी छवि और दूसरी पंक्ति के ‘सुनने’ वाले रूपक को सुरक्षित रखा गया है; प्रसंगगत धमकी या उगाही का अर्थ मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
