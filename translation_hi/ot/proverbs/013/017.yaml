    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  choice: दूत
  rationale: नीतिवचन के सामाजिक संदर्भ में यह मनुष्य द्वारा भेजे गए संदेशवाहक को दर्शाता है, स्वर्गदूत को नहीं।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह दूत के नैतिक चरित्र का वर्णन करता है और मूल के नैतिक बल को बनाए रखता है।
- source_word: יִפֹּל
  choice: पड़ता है
  rationale: अपूर्ण क्रिया नीतिवचन में सामान्य सत्य व्यक्त करती है; वर्तमानकालीन रूप स्वाभाविक हिन्दी लोकोक्तिपरक शैली के अनुकूल है।
- source_word: בְּרָע
  choice: विपत्ति में
  rationale: यहाँ רָע संभवतः नैतिक बुराई से अधिक हानि, संकट या दुर्दशा का बोध देता है; साथ ही मूल की संक्षिप्तता और कुछ अर्थगत व्यापकता बनी रहती है।
- source_word: צִיר
  choice: राजदूत
  rationale: यह शब्द नियुक्त अथवा आधिकारिक संदेशवाहक को सूचित कर सकता है। ‘राजदूत’ पहले पद के ‘दूत’ से शब्दगत भेद को स्पष्ट रखते हुए उसके प्रतिनिधिक दायित्व को व्यक्त करता है।
- source_word: אֱמוּנִים
  choice: विश्वासयोग्य
  rationale: यह बहुवचनात्मक/गुणवाचक रूप विश्वसनीयता और निष्ठा का भाव देता है; ‘विश्वासयोग्य’ दोनों को स्वाभाविक ढंग से समेटता है।
- source_word: מַרְפֵּא
  choice: चंगाई
  rationale: संज्ञा उपचार, स्वास्थ्य अथवा पुनर्स्थापन का अर्थ दे सकती है; ‘चंगाई’ इसके वास्तविक और रूपक दोनों लाभों को बनाए रखती है।
