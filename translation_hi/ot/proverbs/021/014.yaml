base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/014.yaml
  text: A gift in secret subdues anger[a], and a bribe in the bosom, fierce wrath.
translation:
  language: hi
  text: 'गुप्त रूप से दिया गया उपहार क्रोध को दबा देता है,

    और गोद में रखी घूस[a] प्रचण्ड रोष को दबा देती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘गोद में’; यह ‘वक्ष’ या वस्त्र की तह में छिपाई हुई वस्तु का भी संकेत हो सकता है, जिससे गोपनीयता पर बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתָּן
  choice: उपहार
  rationale: यह सामान्य भेंट या उपहार को दर्शाता है; दूसरे चरण के स्पष्टतः नकारात्मक שֹׁחַד से इसका भेद बनाए रखा गया है।
- source_word: בַּסֵּתֶר
  choice: गुप्त रूप से
  rationale: यह छिपे स्थान या गोपनीय ढंग का भाव देता है; आधुनिक हिन्दी में ‘गुप्त रूप से’ स्वाभाविक और स्पष्ट है।
- source_word: יִכְפֶּה
  choice: दबा देता है
  rationale: क्रोध को ढकने, रोकने या वश में करने का भाव है; ‘दबा देता है’ क्रोध के पूर्णतः मिट जाने का अनावश्यक दावा नहीं करता।
- source_word: אָף
  choice: क्रोध
  rationale: शाब्दिक अर्थ ‘नाक’ है, पर यहाँ यह क्रोध के लिए प्रचलित इब्रानी मुहावरा है।
- source_word: שֹׁחַד
  choice: घूस
  rationale: यह शब्द अनुचित लाभ के लिए दी गई रिश्वत को दर्शाता है और पहले चरण के सामान्य ‘उपहार’ से स्पष्ट भेद रखता है।
- source_word: בַּחֵק
  choice: गोद में रखी
  rationale: मूल चित्र गोद या छाती से लगी वस्त्र की तह में छिपाकर रखी वस्तु का है; मुख्य पाठ में उसका ठोस चित्र बनाए रखा गया है और पादटिप्पणी में आशय स्पष्ट किया गया है।
- source_word: חֵמָה עַזָּה
  choice: प्रचण्ड रोष
  rationale: यह पहले चरण के ‘क्रोध’ से अधिक तीव्र भाव व्यक्त करता है और समानांतर पंक्तियों की बढ़ती तीव्रता को सुरक्षित रखता है।
theological_decisions:
- issue: क्या नीतिवचन घूस देने को नैतिक स्वीकृति देता है?
  choice: पाठ को मानवीय व्यवहार के प्रभाव का संक्षिप्त अवलोकन बताते हुए बिना नैतिक अनुमोदन जोड़े अनूदित किया गया है।
  alternative: घूस की स्पष्ट निन्दा जोड़ना।
  rationale: मूल पद प्रभाव का वर्णन करता है, पर इसी पद में प्रत्यक्ष नैतिक निर्णय नहीं जोड़ता; अनुवाद को वह निर्णय आयात नहीं करना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उपहार/घूस’ तथा ‘क्रोध/प्रचण्ड रोष’ के भेद से इब्रानी समानांतरता और तीव्रता की वृद्धि सुरक्षित रखी गई है। दूसरे चरण में हिन्दी की स्पष्टता के लिए निहित क्रिया को ‘शांत कर देती है’ के रूप में व्यक्त किया गया है।
