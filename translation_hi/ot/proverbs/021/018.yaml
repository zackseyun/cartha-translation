  text: The wicked is a ransom for the righteous[a], and the treacherous one in place of the upright.
translation:
  language: hi
  text: दुष्ट धर्मी के लिए छुड़ौती है[a], और विश्वासघाती सीधे-सच्चे लोगों के स्थान पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुष्ट धर्मी के बदले है, और विश्वासघाती सीधे-सच्चे लोगों के बदले।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּפֶר
  choice: छुड़ौती
  rationale: यह शब्द किसी दूसरे के बदले दिए जाने वाले मूल्य या प्रतिपूर्ति को दर्शाता है। ‘छुड़ौती’ पद के संक्षिप्त प्रतिस्थापनात्मक रूपक को बनाए रखती है।
- source_word: לַצַּדִּיק
  choice: धर्मी के लिए
  rationale: ל संबंध या लाभ को सूचित करता है; एकवचन ‘धर्मी’ नीतिवचन की सामान्य श्रेणीगत शैली को बनाए रखता है।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: पुल्लिंग एकवचन रूप यहाँ सामान्य नैतिक श्रेणी के रूप में प्रयुक्त है और ‘धर्मी’ के साथ स्पष्ट विरोध बनाता है।
- source_word: וְתַחַת
  choice: और ... के स्थान पर
  rationale: यहाँ תַּחַת स्थानगत ‘नीचे’ नहीं, बल्कि प्रतिस्थापन व्यक्त करता है और पहली पंक्ति के כֹּפֶר के समानांतर है।
- source_word: יְשָׁרִים
  choice: सीधे लोगों
  rationale: नीतिवचन में यह शब्द नैतिक रूप से खरे या सीधे लोगों को दर्शाता है; बहुवचन को स्पष्ट रखा गया है।
- source_word: בּוֹגֵד
  choice: विश्वासघाती
  rationale: यह शब्द विश्वास तोड़ने या छलपूर्वक व्यवहार करने वाले व्यक्ति को दर्शाता है; ‘विश्वासघाती’ इसे राजनीतिक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: दुष्ट का धर्मी के लिए छुड़ौती या प्रतिस्थापन होना
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से दैवी दंड-विनिमय या ऐतिहासिक घटना के रूप में समझाना।
  rationale: मूल नीतिवचन यह नहीं बताता कि यह प्रतिस्थापन किस प्रक्रिया से होता है; अतः उसकी संक्षिप्तता और अर्थगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त नीतिवचन शैली। ‘ठहरता है’ हिंदी में विधेय संबंध को स्वाभाविक बनाता है, जबकि मूल के रूपक को नहीं खोलता।
