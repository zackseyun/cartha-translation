  yaml_path: translation/ot/proverbs/021/007.yaml
  text: The violence of the wicked will drag them away[a], because they refuse to do justice.
translation:
  language: hi
  text: दुष्टों की हिंसा उन्हें घसीट ले जाएगी[a], क्योंकि वे न्याय करने से इनकार करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुष्टों की लूट उन्हें बहा ले जाएगी।” इब्रानी क्रिया का अर्थ कठिन है; व्याख्याकारों में मतभेद है कि यहाँ बल हिंसा, लूट, भय, या अपने ही कुकर्म के कारण उठा ले जाए जाने पर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁד
  choice: हिंसा
  rationale: यह शब्द हिंसक विनाश या लूट को सूचित कर सकता है। दुष्टों और न्याय करने से उनके इनकार के संदर्भ में “हिंसा” उनके विनाशकारी अन्याय को स्वाभाविक और व्यापक रूप से व्यक्त करता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह नैतिक रूप से दोषी लोगों के लिए प्रयुक्त बहुवचन संज्ञात्मक विशेषण है; “दुष्ट” हिन्दी नीतिवचन की शैली में संक्षिप्त और स्वाभाविक है।
- source_word: יְגוֹרֵם
  choice: उन्हें घसीट ले जाएगी
  rationale: क्रिया का अर्थ कठिन और विवादित है। संदर्भ में यह दुष्टों की अपनी हिंसा द्वारा उन्हें बलपूर्वक विनाश की ओर ले जाए जाने का भाव सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है।
- source_word: מֵאֲנוּ
  choice: वे ... इनकार करते हैं
  rationale: पूर्ण क्रिया नीतिवचन के सामान्य सत्य में दुष्टों के चारित्रिक इनकार को व्यक्त करती है; वर्तमानकालीन हिन्दी स्वाभाविक है।
- source_word: לַעֲשׂוֹת
  choice: करने
  rationale: “इनकार करना” के साथ यह सहज infinitival पूरक है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यहाँ आशय केवल न्यायिक निर्णय नहीं, बल्कि न्यायपूर्ण आचरण है; “न्याय करना” मूल पदबंध को स्पष्ट रूप से व्यक्त करता है।
