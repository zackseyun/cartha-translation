  text: עֲ֭שֹׂה צְדָקָ֣ה וּ/מִשְׁפָּ֑ט נִבְחָ֖ר לַ/יהוָ֣ה מִ/זָּֽבַח׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/003.yaml
  text: To do righteousness and justice is more acceptable to Yahweh than sacrifice[a].
translation:
  language: hi
  text: 'धार्मिकता और न्याय करना,

    बलिदान से बढ़कर यहोवा को स्वीकार्य है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा इसे बलिदान से अधिक पसंद करता है।” इब्रानी में शाब्दिक भाव “यहोवा के लिए चुना हुआ” है, जो उसकी वरीयता या स्वीकार्यता प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֹׂה
  choice: करना
  rationale: इनफ़िनिटिव कंस्ट्रक्ट यहाँ क्रिया को सामान्य, संज्ञात्मक रूप में प्रस्तुत करता है; हिंदी में “करना” सीधा और स्वाभाविक है।
- source_word: צְדָקָה
  choice: सही काम
  rationale: यह शब्द धार्मिकता अथवा सही आचरण का बोध कराता है। “सही काम” साधारण आधुनिक हिंदी में नैतिक आचरण का अर्थ स्पष्ट करता है और साथ के מִשְׁפָּט से भेद बनाए रखता है।
- source_word: וּמִשְׁפָּט
  choice: और न्याय
  rationale: नीतिवचन के इस नैतिक संदर्भ में מִשְׁפָּט न्यायपूर्ण व्यवहार अथवा न्याय को दर्शाता है; “न्याय” इसका स्वाभाविक हिंदी प्रतिरूप है।
- source_word: נִבְחָר
  choice: से बढ़कर ... स्वीकार्य है
  rationale: निफ़अल कृदंत का मूल अर्थ “चुना हुआ/पसंद किया हुआ” है। तुलना-सूचक מִן के साथ यह यहोवा की वरीयता या स्वीकार्यता व्यक्त करता है; यह रूप तुलना को सहज हिंदी में स्पष्ट रखता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: לְ यहाँ वह व्यक्ति बताता है जिसकी दृष्टि में कोई बात चुनी हुई या स्वीकार्य है। वाचा के व्यक्तिगत नाम יהוה को हिंदी में प्रचलित रूप “यहोवा” से व्यक्त किया गया है।
- source_word: מִזָּבַח
  choice: बलिदान से
  rationale: उपसर्ग מִן तुलना दर्शाता है, इसलिए “से” उचित है; एकवचन זֶבַח यहाँ सामान्य/सामूहिक अर्थ में “बलिदान” है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। हिंदी पाठकों के लिए व्यापक रूप से पहचाने जाने वाले “यहोवा” को रखा गया है, न कि इसे उपाधि “प्रभु” से बदला गया है।
- issue: नैतिक आचरण और बलिदान के बीच तुलना
  choice: “बलिदान से बढ़कर ... स्वीकार्य” के रूप में ईश्वरीय वरीयता
  alternative: “बलिदान के बजाय” अर्थात बलिदान का पूर्ण निषेध
  rationale: מִן और נִבְחָר तुलनात्मक वरीयता व्यक्त करते हैं। पद नैतिक आचरण को बलिदान से श्रेष्ठ ठहराता है, पर अपने आप में हर बलिदान का पूर्ण निषेध नहीं कहता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। काव्यात्मक समानांतरता के लिए दो पंक्तियाँ रखी गई हैं। “धार्मिकता” की अपेक्षा “सही काम” सामान्य पाठक के लिए अधिक तत्काल बोधगम्य है, जबकि “न्याय” दूसरे नैतिक पद का अलग अर्थ बनाए रखता है।
