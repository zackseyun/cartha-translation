  yaml_path: translation/ot/proverbs/021/015.yaml
  text: Doing justice is a joy to the righteous[a], but destruction to evildoers.
translation:
  language: hi
  text: न्याय करना धर्मी के लिए आनन्द है,[a] पर अनर्थ करनेवालों के लिए विनाश।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय करना धर्मी के लिए आनन्द, और अनर्थ करनेवालों के लिए भय है।” इब्रानी शब्द מְחִתָּה का अर्थ भय, घबराहट या विनाश हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह संज्ञा हर्ष और आनन्द को व्यक्त करती है; हिन्दी के निर्वाचक वाक्य में ‘आनन्द’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לַצַּדִּיק
  choice: धर्मी के लिए
  rationale: ל संबंध अथवा हित को सूचित करता है, और एकवचन צַדִּיק यहाँ प्रतिनिधिक अर्थ रखता है।
- source_word: עֲשׂוֹת
  choice: करना
  rationale: इनफिनिटिव कंस्ट्रक्ट संज्ञात्मक रूप से सामान्य क्रिया को व्यक्त करता है; ‘करना’ इस सामान्य सिद्धान्त को सहज हिन्दी में रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: नीतिवचन के प्रसंग में यह न्यायपूर्ण आचरण अथवा न्याय के नैतिक मानदण्ड को सूचित करता है।
- source_word: וּמְחִתָּה
  choice: पर ... विनाश
  rationale: ו यहाँ समान्तर पंक्तियों के विरोध को हिन्दी में ‘पर’ से स्वाभाविक रूप से व्यक्त करता है। מְחִתָּה भय, घबराहट अथवा विनाश का अर्थ दे सकता है; मुख्य पाठ में ‘विनाश’ परिणामसूचक अर्थ को संक्षेप में रखता है और अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: לְפֹעֲלֵי אָוֶן
  choice: अनर्थ करनेवालों के लिए
  rationale: वाक्यांश का शाब्दिक भाव ‘अनर्थ/दुष्टता करनेवाले’ है। ‘अनर्थ करनेवाले’ אָוֶן के बुराई और विनाशकारी उपद्रव—दोनों अर्थच्छायाओं को बनाए रखता है।
