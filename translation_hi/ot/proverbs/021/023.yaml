  text: שֹׁמֵ֣ר פִּ֭י/ו וּ/לְשׁוֹנ֑/וֹ שֹׁמֵ֖ר מִ/צָּר֣וֹת נַפְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/023.yaml
  text: Whoever guards his mouth and his tongue guards his life from troubles[a].
translation:
  language: hi
  text: जो अपने मुँह और अपनी जीभ की रखवाली करता है, वह अपने जीवन को मुसीबतों से बचाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने आपको संकटों से बचाता है”; इब्रानी में शाब्दिक रूप से, “वह अपने नेफ़ेश को संकटों से बचाता है,” जहाँ नेफ़ेश का अर्थ जीवन, प्राण या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמֵר
  choice: रखवाली करता है / बचाता है
  rationale: इब्रानी कृदंत का अर्थ चौकसी से रक्षा करना है। पहले खंड में ‘रखवाली करता है’ वाणी पर निगरानी का भाव देता है, जबकि दूसरे खंड में उसी क्रिया का स्वाभाविक परिणाम ‘बचाता है’ से स्पष्ट होता है।
- source_word: פִּיו
  choice: अपने मुँह
  rationale: यह मूल संज्ञा और पुरुषवाचक प्रत्यय का सीधा अनुवाद है; यहाँ ‘मुँह’ वाणी का भी संकेत करता है।
- source_word: וּלְשׁוֹנוֹ
  choice: और अपनी जीभ
  rationale: शाब्दिक बिंब बनाए रखा गया है; नीतिवचन में ‘जीभ’ वाणी के लिए लक्षणा है।
- source_word: מִצָּרוֹת
  choice: मुसीबतों से
  rationale: बहुवचन शब्द व्यापक रूप से संकटों, तंगियों और विपत्तियों को दर्शाता है। ‘मुसीबतों’ आधुनिक हिन्दी में सहज है और अर्थ की व्यापकता बनाए रखता है।
- source_word: נַפְשׁוֹ
  choice: अपने जीवन को
  rationale: इस प्रसंग में נֶפֶשׁ व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित करता है, न कि अनिवार्य रूप से किसी तकनीकी अर्थ में अमूर्त ‘आत्मा’ को।
theological_decisions:
- issue: נַפְשׁוֹ का अनुवाद
  choice: अपने जीवन को
  alternative: अपने आपको; अपने प्राण को
  rationale: नीतिवचन का केंद्र संयमित वाणी द्वारा हानिकारक परिणामों से बचना है। ‘जीवन’ इस व्यावहारिक अर्थ को स्पष्ट रखता है और मानव-स्वरूप के विषय में ऐसा सैद्धांतिक निष्कर्ष नहीं जोड़ता जो मूल पाठ में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप रखा गया है। ‘मुँह’ और ‘जीभ’ के मूल इब्रानी बिंब सुरक्षित हैं; दूसरे खंड में हूबहू क्रिया-दोहराव के बजाय स्वाभाविक हिन्दी ‘बचाता है’ प्रयोग किया गया है।
