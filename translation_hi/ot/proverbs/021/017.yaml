  text: אִ֣ישׁ מַ֭חְסוֹר אֹהֵ֣ב שִׂמְחָ֑ה אֹהֵ֥ב יַֽיִן וָ֝/שֶׁ֗מֶן לֹ֣א יַעֲשִֽׁיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/017.yaml
  text: A man who loves pleasure will become poor[b][a]; whoever loves wine and oil will not become rich.
translation:
  language: hi
  text: जो मनुष्य मौज-मस्ती[a] से प्रेम करता है, वह अभाव में पड़ेगा; जो दाखमधु और तेल[b] से प्रेम करता है, वह धनी न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो आनन्द से प्रेम करता है” अथवा “जो उत्सव मनाने से प्रेम करता है।” इब्रानी शब्द आनन्द या उत्सवपूर्ण आमोद को दर्शा सकता है; यहाँ सम्भवतः मौज-मस्ती में डूबे जीवन की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: “तेल” से सम्भवतः जैतून का तेल अभिप्रेत है; यहाँ यह केवल सामान्य खाद्य पदार्थ नहीं, बल्कि विलासिता या महँगे सुगन्धित तेल का संकेत भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ מַחְסוֹר
  choice: मनुष्य ... अभाव में पड़ेगा
  rationale: אִישׁ यहाँ नीतिवचन की शैली में एक प्रतिनिधि व्यक्ति को दर्शाता है। מַחְסוֹר का शाब्दिक अर्थ ‘अभाव’ या ‘कमी’ है; इब्रानी का संक्षिप्त संज्ञात्मक कथन परिणाम बताता है, जिसे स्वाभाविक हिन्दी में ‘अभाव में पड़ेगा’ कहा गया है।
- source_word: אֹהֵב שִׂמְחָה
  choice: मौज-मस्ती से प्रेम करता है
  rationale: שִׂמְחָה का अर्थ आनन्द, हर्ष या उत्सवपूर्ण आमोद हो सकता है। इस चेतावनी के संदर्भ में ‘मौज-मस्ती’ सुख-विलास में लगे जीवन की ओर संकेत करती है, जबकि शब्द की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: אֹהֵב יַיִן וָשֶׁמֶן
  choice: दाखमधु और तेल से प्रेम करता है
  rationale: יַיִן के लिए dignified और परिचित बाइबिलीय हिन्दी ‘दाखमधु’ चुनी गई है। שֶׁמֶן मूलतः तेल, प्रायः जैतून का तेल, है और यहाँ महँगे सुगन्धित तेल अथवा विलास का संकेत भी दे सकता है; मूल बिंब को मुख्य पाठ में बनाए रखा गया है।
- source_word: לֹא יַעֲשִׁיר
  choice: धनी न होगा
  rationale: עשר का हिफ़ील रूप यहाँ अकर्मक परिणामार्थ में ‘धनी होना’ बताता है। ‘धनी न होगा’ धन-संबंधी आशय को सीधे और स्वाभाविक रूप में व्यक्त करता है।
