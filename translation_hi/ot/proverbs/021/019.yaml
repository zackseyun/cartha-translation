  text: It is better to live in a desert land than with a quarrelsome and angry wife[a].
translation:
  language: hi
  text: झगड़ालू और चिढ़ाने वाली पत्नी के साथ रहने से मरुभूमि में रहना अच्छा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झगड़ालू और क्रोधी पत्नी के साथ रहने से मरुभूमि में रहना अच्छा है।” अंतिम शब्द उसके स्वभाव (“क्रोधी”) अथवा दूसरों पर उसके प्रभाव (“चिढ़ाने वाली,” “खिझाने वाली”) को बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: यह तुलनात्मक कहावत का विधेय है; ‘...से ... अच्छा है’ स्वाभाविक हिन्दी में तुलना स्पष्ट करता है।
- source_word: שֶׁבֶת
  choice: रहना
  rationale: यहाँ क्रिया स्थायी निवास का भाव देती है; आधुनिक हिन्दी में ‘रहना’ सहज और सटीक है।
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: मरुभूमि में
  rationale: यह पद निर्जन और बंजर भूभाग को दर्शाता है; ‘मरुभूमि’ אֶרֶץ और מִדְבָּר के संयुक्त स्थान-बोध को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: מֵאֵשֶׁת
  choice: पत्नी के साथ रहने से
  rationale: तुलनात्मक מִן को ‘से’ द्वारा व्यक्त किया गया है और हिन्दी में संबंध को स्पष्ट करने के लिए ‘के साथ रहने’ रखा गया है।
- source_word: מדונים
  choice: झगड़ालू
  rationale: बहुवचन भाववाचक संज्ञा यहाँ पत्नी के निरंतर कलह करनेवाले स्वभाव को विशेषण रूप में बताती है।
- source_word: וָכָעַס
  choice: और चिढ़ानेवाली
  rationale: כעס क्रोध, खीझ अथवा दूसरों को खिझाने/उकसाने का भाव दे सकता है। ‘चिढ़ानेवाली’ यहाँ उसके प्रभाव को व्यक्त करता है, जबकि वैकल्पिक स्वभावगत अर्थ पादटिप्पणी में सुरक्षित है।
