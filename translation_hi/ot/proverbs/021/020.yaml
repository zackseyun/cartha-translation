  edition: WLC
  text: אוֹצָ֤ר נֶחְמָ֣ד וָ֭/שֶׁמֶן בִּ/נְוֵ֣ה חָכָ֑ם וּ/כְסִ֖יל אָדָ֣ם יְבַלְּעֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/020.yaml
  text: Precious treasure and oil are in the dwelling of a wise man[a], but a foolish man swallows them up.
translation:
  language: hi
  text: 'बुद्धिमान मनुष्य के घर में बहुमूल्य धन और तेल हैं,

    पर मूर्ख मनुष्य उसे निगल जाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘उसे निगल जाता है।’ यह मूर्ख के संचित साधनों को अविवेक से खपा देने की सजीव छवि है।
    reason: शाब्दिक रूपक और उसके प्रसंगगत भाव को स्पष्ट करना।
lexical_decisions:
- source_word: אוֹצָר נֶחְמָד
  choice: बहुमूल्य धन
  rationale: אוֹצָר संचित संपत्ति या मूल्यवान भंडार को और נֶחְמָד वांछनीय अथवा मूल्यवान होने को व्यक्त करता है। हिंदी में ‘बहुमूल्य धन’ इस संयुक्त भाव को स्वाभाविक रूप से बताता है और विवेकपूर्ण संचय तथा मूर्खतापूर्ण उपभोग का विरोध स्पष्ट रखता है।
- source_word: וָשֶׁמֶן
  choice: और तेल
  rationale: שֶׁמֶן सामान्यतः तेल, प्रायः जैतून का तेल, दर्शाता है; मूल पाठ तेल का प्रकार निर्दिष्ट नहीं करता, इसलिए केवल ‘तेल’ रखा गया है।
- source_word: בִּנְוֵה
  choice: के घर में
  rationale: נָוֶה निवास या रहने की जगह को दर्शाता है। आधुनिक हिंदी में ‘घर’ सहज और स्पष्ट है तथा किसी विशेष प्रकार की इमारत का अनावश्यक संकेत नहीं देता।
- source_word: חָכָם
  choice: बुद्धिमान मनुष्य
  rationale: पुल्लिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमान मनुष्य’ नीतिवचन के प्रतिनिधिक मानवीय प्रकार और मूल के व्याकरणिक रूप दोनों को बनाए रखता है।
- source_word: כְסִיל אָדָם
  choice: मूर्ख मनुष्य
  rationale: כְּסִיל ज्ञान-साहित्य में नैतिक और व्यावहारिक मूर्खता वाले व्यक्ति का प्रचलित शब्द है, और אָדָם उसके मानवीय प्रकार को स्पष्ट करता है। ‘मूर्ख मनुष्य’ पहले पद के समानांतर है।
- source_word: יְבַלְּעֶנּוּ
  choice: उसे निगल जाता है
  rationale: בלע का शाब्दिक अर्थ ‘निगलना’ है। यहाँ यह संचित साधनों को लापरवाही से समाप्त कर देने का सजीव रूपक है। एकवचन प्रत्यय के अनुरूप ‘उसे’ रखा गया है, जो संचित संपदा को समग्र रूप में ग्रहण कर सकता है।
theological_decisions:
- issue: חָכָם ... כְסִיל אָדָם में पुल्लिंग एकवचन द्वारा सामान्य मानवीय प्रकार
  choice: ‘बुद्धिमान मनुष्य ... मूर्ख मनुष्य’
  alternative: ‘बुद्धिमान व्यक्ति ... मूर्ख व्यक्ति’ अथवा ‘बुद्धिमान ... मूर्ख’
  rationale: इब्रानी में दोनों चरित्र-प्रकार पुल्लिंग एकवचन में हैं और सामान्य रूप से मनुष्यों पर लागू होते हैं। अनुवाद मूल रूप को बनाए रखता है, बिना इस शिक्षा को केवल पुरुषों तक सीमित बताने के।
- issue: יְבַלְּעֶנּוּ के एकवचन कर्म का संदर्भ
  choice: ‘उसे निगल जाता है’
  alternative: ‘उन्हें निगल जाता है’ अथवा ‘सब कुछ खपा देता है’
  rationale: प्रत्यय व्याकरणतः एकवचन है, यद्यपि पहले ‘धन और तेल’ दो तत्व आए हैं। ‘उसे’ उस संचित संपदा या भंडार को समग्र इकाई के रूप में पढ़ने की वास्तविक संभावना को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बहुमूल्य धन’ घरेलू संचय का भाव देता है, जबकि ‘निगल जाता है’ मूल इब्रानी की तीखी और सजीव छवि को बनाए रखता है।
