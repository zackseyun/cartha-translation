source:
  edition: WLC
  text: ס֗וּס מ֭וּכָן לְ/י֣וֹם מִלְחָמָ֑ה וְ֝/לַֽ/יהוָ֗ה הַ/תְּשׁוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/031.yaml
  text: A horse is prepared for the day of battle[a], but victory belongs to Yahweh.
translation:
  language: hi
  text: युद्ध के दिन के लिए घोड़ा तैयार किया जाता है, पर विजय[a] याहवे की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उद्धार” अथवा “छुटकारा।” इब्रानी शब्द व्यापक रूप से बचाव को दर्शा सकता है; यहाँ युद्ध के संदर्भ में “विजय” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּס
  choice: घोड़ा
  rationale: इब्रानी संज्ञा सामान्य रूप से घोड़े को दर्शाती है। सैन्य संदर्भ अगली पदबंध ‘युद्ध के दिन के लिए’ से स्पष्ट होता है, इसलिए ‘युद्ध का घोड़ा’ जोड़ना आवश्यक नहीं है।
- source_word: מוּכָן
  choice: तैयार रखा जाता है
  rationale: निष्क्रिय कृदन्त तैयारी की हुई अवस्था व्यक्त करता है। यह हिंदी प्रयोग उस निष्क्रिय भाव और युद्ध हेतु तत्परता, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְיוֹם מִלְחָמָה
  choice: युद्ध के दिन के लिए
  rationale: यह पदबंध उद्देश्य अथवा अवसर को दर्शाता है और इब्रानी अभिव्यक्ति ‘युद्ध का दिन’ को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: וְלַיהוָה
  choice: पर ... याहवे की होती है
  rationale: संयोजक यहाँ मानवीय तैयारी और परमेश्वर द्वारा निर्धारित परिणाम के बीच निहित विरोध प्रकट करता है; ‘पर’ इसे हिंदी में स्पष्ट और संक्षिप्त बनाता है।
- source_word: יהוה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम YHWH है; ‘याहवे’ उसका प्रचलित हिंदी लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- source_word: הַתְּשׁוּעָה
  choice: विजय
  rationale: इस संज्ञा का अर्थ उद्धार, छुटकारा या विजय हो सकता है। युद्ध के तत्काल संदर्भ में ‘विजय’ सबसे स्वाभाविक है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: इब्रानी पाठ में विशिष्ट वाचा-नाम उपस्थित है। ‘याहवे’ उसे नाम के रूप में प्रत्यक्ष रखता है, बिना उसे केवल उपाधि ‘प्रभु’ में बदलने के।
- issue: युद्ध-संदर्भ में תְּשׁוּעָה का अर्थ
  choice: विजय
  alternative: उद्धार / छुटकारा
  rationale: कहावत युद्ध की तैयारी और उसके अंतिम परिणाम की तुलना करती है, इसलिए ‘विजय’ संदर्भानुकूल है। फिर भी मूल शब्द का अर्थ व्यापक है; इस वास्तविक अर्थ-बहुलता को पादटिप्पणी में रखा गया है।
- issue: मानवीय तैयारी और दैवी परिणाम का संबंध
  choice: मानवीय तैयारी स्वीकार की गई है, पर अंतिम विजय याहवे की बताई गई है
  alternative: मानवीय तैयारी को निष्फल या अनुचित बताना
  rationale: पद घोड़े की तैयारी की निंदा नहीं करता; वह केवल इस पर बल देता है कि निर्णायक परिणाम मानव साधनों के अधिकार में नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और लोकोक्तिपरक रखी गई है। ‘तैयार रखा जाता है’ निष्क्रिय तैयारी को स्वाभाविक हिंदी में व्यक्त करता है, और ‘विजय याहवे की होती है’ मूल के संक्षिप्त अधिकार-संबंध को बनाए रखता है।
