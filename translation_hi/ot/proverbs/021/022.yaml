  yaml_path: translation/ot/proverbs/021/022.yaml
  text: A wise man goes up against the city of mighty men and brings down the stronghold in which they trust[a].
translation:
  language: hi
  text: बुद्धिमान व्यक्ति वीरों के नगर पर चढ़ाई करता है और उस गढ़ को ढा देता है जिस पर वे भरोसा रखते हैं।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उनके भरोसे के बल को ढा देता है।” हिब्रू शब्द का सामान्य अर्थ ‘बल’ या ‘सामर्थ्य’ है; यहाँ संदर्भ के कारण इसे रक्षात्मक गढ़ के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִיר
  choice: नगर
  rationale: यहाँ शब्द एक शहरी, सम्भवतः किलेबंद बस्ती को दर्शाता है; सैन्य प्रसंग में ‘नगर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: גִּבֹּרִים
  choice: वीरों
  rationale: यह बहुवचन संज्ञा बलवान और युद्ध-कुशल पुरुषों को सूचित कर सकती है; ‘वीरों’ से सामर्थ्य और सैन्य भाव दोनों बने रहते हैं।
- source_word: עָלָה
  choice: पर चढ़ाई करता है
  rationale: मूल अर्थ ‘ऊपर चढ़ना’ है, पर नगर के साथ सैन्य प्रयोग में इसका आशय उसके विरुद्ध आगे बढ़ना या आक्रमण करना है; ‘चढ़ाई करता है’ हिब्रू बिंब और विरोधात्मक अर्थ दोनों रखता है।
- source_word: חָכָם
  choice: बुद्धिमान व्यक्ति
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बुद्धिमान व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और नीतिवचन की प्रतिनिधिक उक्ति के अनुकूल है।
- source_word: וַיֹּרֶד
  choice: ढा देता है
  rationale: हिफ़ील रूप का अर्थ ‘नीचे ले आता है’ है; रक्षात्मक गढ़ के प्रसंग में ‘ढा देता है’ परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹז
  choice: गढ़
  rationale: शब्द का सामान्य अर्थ ‘बल’ या ‘सामर्थ्य’ है, किन्तु सैन्य नगर के प्रसंग में यह भरोसे के रक्षात्मक आधार को ठोस रूप में दर्शा सकता है; ‘गढ़’ इसी अर्थ को व्यक्त करता है।
- source_word: מִבְטֶחָה
  choice: जिस पर वे भरोसा रखते हैं
  rationale: संज्ञा का अर्थ भरोसा, विश्वास या सुरक्षा है; स्त्रीलिंग प्रत्यय सम्भवतः नगर की ओर संकेत करता है। सम्बन्धसूचक वाक्यांश हिन्दी में आश्रय और विश्वास का भाव स्पष्ट करता है।
