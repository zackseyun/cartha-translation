  yaml_path: translation/ot/proverbs/021/005.yaml
  text: The plans of the diligent surely lead to abundance[c][b][a], but everyone who is hasty surely comes to want.
translation:
  language: hi
  text: मेहनती की योजनाएँ निश्चय ही प्रचुरता तक पहुँचाती हैं[a], पर हर उतावला व्यक्ति निश्चय ही अभाव में पड़ता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लाभ तक’; इब्रानी शब्द का अर्थ अधिकता, लाभ या प्रचुरता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गरीबी में पड़ता है’; इब्रानी शब्द अभाव, कमी, जरूरत या निर्धनता को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְשְׁבוֹת
  choice: योजनाएँ
  rationale: नीतिवचन के व्यावहारिक संदर्भ में यह शब्द केवल मन के विचार नहीं, बल्कि सोच-समझकर बनाई गई योजनाएँ दर्शाता है।
- source_word: חָרוּץ
  choice: मेहनती
  rationale: यह परिश्रमी और लगन से काम करने वाले व्यक्ति को दर्शाता है; ‘मेहनती’ आधुनिक, सहज और व्यापक रूप से समझा जाने वाला शब्द है।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: दोनों अर्ध-पंक्तियों में यह परिणाम की निश्चितता और कथन के बल को व्यक्त करता है।
- source_word: לְמוֹתָר
  choice: भरपूरी की ओर
  rationale: מוֹתָר बचत, अधिकता, लाभ या प्रचुरता का बोध करा सकता है। विरोधी समानांतरता में ‘भरपूरी’ आगे आने वाली ‘घटी’ के साथ स्वाभाविक रूप से मेल खाती है।
- source_word: וְכָל
  choice: पर हर
  rationale: וְ का मूल अर्थ ‘और’ है, किंतु यहाँ स्पष्ट विरोधी समानांतरता के कारण हिंदी में ‘पर’ अधिक स्वाभाविक है; כָל का वितरणात्मक बल ‘हर’ से व्यक्त होता है।
- source_word: אָץ
  choice: उतावला
  rationale: यह जल्दबाज़ी या आवेग में आगे बढ़ने वाले व्यक्ति को दर्शाता है; ‘उतावला’ इसे व्यक्ति के स्वभावगत वर्णन के रूप में बनाए रखता है।
- source_word: לְמַחְסוֹר
  choice: घटी में
  rationale: מַחְסוֹר अभाव, कमी, जरूरत या निर्धनता को दर्शा सकता है। ‘घटी में पड़ता है’ व्यापक अर्थ बनाए रखता है और भरपूरी के साथ स्पष्ट विरोध रचता है।
