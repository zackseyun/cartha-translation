base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/006.yaml
  text: The getting of treasures by a lying tongue is a fleeting vapor[c][b][a], a snare of those who seek death.
translation:
  language: hi
  text: झूठी जीभ से[a] धन बटोरना उड़ती हुई वाष्प[b] है; वे मृत्यु के खोजी हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झूठ बोलकर।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उड़ाई जानेवाली वाष्प”; अर्थात ऐसी चीज़ जो असार है और शीघ्र मिट जाती है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम इब्रानी पदबंध कठिन है। इसका अर्थ यह भी हो सकता है कि ऐसा धन पानेवाले मृत्यु की खोज करते हैं, या “यह मृत्यु के खोजियों का है।” प्राचीन अनुवादों से प्रभावित कुछ अनुवादों में “यह मृत्यु का फंदा है” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: פֹּעַל אֹצָרוֹת
  choice: धन बटोरना
  rationale: פֹּעַל यहाँ कार्य या प्राप्त करने की प्रक्रिया को और אֹצָרוֹת संचित धन को सूचित करता है। ‘धन बटोरना’ आधुनिक हिन्दी में स्वाभाविक है और बेईमानी से संपत्ति जमा करने की गतिविधि स्पष्ट करता है।
- source_word: בִּלְשׁוֹן שָׁקֶר
  choice: झूठी जीभ से
  rationale: शाब्दिक अर्थ ‘झूठ की जीभ से’ है। यह अनुवाद साधन का भाव और इब्रानी का सजीव शारीरिक रूपक दोनों बनाए रखता है।
- source_word: הֶבֶל נִדָּף
  choice: हवा में उड़ती भाप
  rationale: הֶבֶל सांस, वाष्प या निस्सारता का और נִדָּף उड़ा दिए जाने का बोध देता है। यह अभिव्यक्ति धन की अस्थिरता और शीघ्र मिट जाने की छवि सुरक्षित रखती है।
- source_word: מְבַקְשֵׁי מָוֶת
  choice: ऐसा धन बटोरनेवाले मृत्यु को खोजते हैं
  rationale: मसोरेटिक पाठ का शाब्दिक भाव ‘मृत्यु को खोजनेवाले’ है। संक्षिप्त और कठिन इब्रानी वाक्य-विन्यास को हिन्दी में स्पष्ट करने के लिए इसे बेईमानी से धन बटोरनेवालों से जोड़ा गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
theological_decisions:
- issue: अंतिम पदबंध מְבַקְשֵׁי מָוֶת का संबंध
  choice: बेईमानी से धन बटोरनेवालों को ऐसे लोगों के रूप में प्रस्तुत करना जो मृत्यु को खोजते हैं
  alternative: ‘मृत्यु को खोजनेवालों का’; अथवा प्राचीन अनुवादों से प्रभावित पाठानुसार ‘मृत्यु का फंदा’
  rationale: मसोरेटिक पाठ में ‘फंदा’ के लिए कोई स्पष्ट शब्द नहीं है, इसलिए मुख्य पाठ में ‘मृत्यु को खोजनेवाले’ का वास्तविक शब्दार्थ रखा गया है। कठिन वाक्य-संबंध को निश्चित सिद्धांत बनाकर थोपने के बजाय विकल्प पादटिप्पणी में बताए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झूठी जीभ’ मूल का ठोस काव्यात्मक रूपक बचाता है; ‘हवा में उड़ती भाप’ सामान्य पाठक को क्षणभंगुरता की छवि देता है। अंतिम कठिन पदबंध को मुख्य पाठ में पठनीय बनाया गया है, पर उसकी वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित है।
