  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘साक्षी’ न्यायिक भाव बनाए रखता है; ‘ध्यान से’ सुनने में निहित सावधानी को स्पष्ट करता है। मुख्य पाठ में हिब्रू की अस्पष्टता रखकर पादटिप्पणी में संभावित अर्थ दिए गए हैं।
