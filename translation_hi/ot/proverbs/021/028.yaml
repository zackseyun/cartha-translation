  text: A false witness will perish[a], but a man who listens will speak forever.
translation:
  language: hi
  text: झूठा साक्षी नाश हो जाएगा, पर जो मनुष्य सुनता है, वह सदा बोलता रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निरंतर बोलता रहेगा” अथवा “उसकी बात का प्रभाव बना रहेगा।” यहाँ “सदा” का अर्थ अनिवार्य रूप से अंतहीन अवधि नहीं, बल्कि उसकी बात की स्थायी वैधता या प्रभाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵד כְּזָבִים
  choice: झूठा साक्षी
  rationale: शाब्दिक रूप से ‘झूठों का साक्षी’; यहाँ बहुवचन כְּזָבִים विशेषण-सदृश अर्थ देता है। ‘झूठा साक्षी’ स्वाभाविक हिन्दी है और न्यायिक संदर्भ बनाए रखता है।
- source_word: יֹאבֵד
  choice: नाश हो जाएगा
  rationale: אבד का अर्थ नष्ट होना, मिट जाना या विनाश को प्राप्त होना हो सकता है। यह चयन विनाश के ढंग को अनावश्यक रूप से निश्चित किए बिना चेतावनी की शक्ति बनाए रखता है।
- source_word: וְאִישׁ
  choice: पर जो मनुष्य
  rationale: וְ यहाँ दोनों कथनों के बीच विरोध प्रकट करता है, और אִישׁ पुरुषवाचक एकवचन है। ‘मनुष्य’ आधुनिक हिन्दी में सहज है और कहावत के प्रतिनिधिक भाव को बनाए रखता है।
- source_word: שׁוֹמֵעַ
  choice: ध्यान से सुनता है
  rationale: שמע का अर्थ सुनना, ध्यान देना या आज्ञा मानना हो सकता है। झूठी गवाही के विपरीत यहाँ बोलने से पहले विश्वसनीय रीति से सुनने का भाव सबसे संगत है।
- source_word: לָנֶצַח
  choice: सदा तक
  rationale: נֶצַח स्थायित्व, निरंतरता या दीर्घकालिक प्रभाव व्यक्त कर सकता है। ‘सदा तक’ हिब्रू की संक्षिप्तता और वास्तविक अर्थगत अस्पष्टता को बनाए रखता है।
- source_word: יְדַבֵּר
  choice: बोलता रहेगा
  rationale: דבר का मूल अर्थ ‘बोलना’ है। हिन्दी में ‘बोलता रहेगा’ לָנֶצַח के कालगत या टिकाऊपन के भाव को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी अन्य संभावित अर्थ स्पष्ट करती है।
