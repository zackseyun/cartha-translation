- source_word: צַדִּיק
  choice: धर्मी व्यक्ति
  rationale: इब्रानी में पुल्लिंग एकवचन का संज्ञार्थक प्रयोग है, पर नीतिवचन में यह धर्मी व्यक्ति के सामान्य चरित्र का प्रतिनिधित्व करता है। ‘व्यक्ति’ इसे हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: יִתֵּן
  choice: देता है
  rationale: साधारण अपूर्ण क्रिया का नीतिवचनात्मक और आदतन भाव वर्तमानकालीन ‘देता है’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לֹא יַחְשֹׂךְ
  choice: रोक नहीं रखता
  rationale: मूल क्रिया का अर्थ रोक रखना अथवा देने से बचाकर रखना है। यह अभिव्यक्ति उदारता के विरोधी चरित्र को बिना किसी अनिर्दिष्ट वस्तु को जोड़कर बनाए रखती है।
