    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “धर्मी” व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर यहाँ वह प्रतिनिधि एकवचन के रूप में सामान्यतः धर्मी व्यक्ति के चरित्र का वर्णन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: यह स्वाभाविक आधुनिक हिन्दी में पूरे दिन जारी रहने वाले समयगत भाव को व्यक्त करता है।
- source_word: הִתְאַוָּה תַאֲוָה
  choice: लालसा करता ही रहता है
