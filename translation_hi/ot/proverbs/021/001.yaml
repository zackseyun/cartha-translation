  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פַּלְגֵי מַ֣יִם לֶב מֶ֭לֶךְ בְּ/יַד יְהוָ֑ה עַֽל כָּל אֲשֶׁ֖ר יַחְפֹּ֣ץ יַטֶּֽ/נּוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/001.yaml
  text: A king’s heart is like channels of water in the hand of Yahweh[b][a]; he turns it wherever he desires.
translation:
  language: hi
  text: राजा का हृदय यहोवा के हाथ में पानी की नहरों के समान है; वह उसे जिधर चाहता है, उधर मोड़ देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּלְגֵי מַיִם
  choice: पानी की धाराओं
  rationale: यह पद विभाजित अथवा दिशा दी जा सकने वाली जलधाराओं का चित्र प्रस्तुत करता है। ‘पानी की धाराओं’ से सिंचाई की नालियों का बिंब स्वाभाविक हिन्दी में बना रहता है।
- source_word: לֶב מֶלֶךְ
  choice: राजा का हृदय
  rationale: निर्माण-वाक्यांश का अर्थ सामान्य रूप से किसी राजा का हृदय है; हिन्दी में ‘राजा का हृदय’ सूक्तिपरक सामान्य सत्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּיַד יְהוָה
  choice: यहोवा के हाथ में
  rationale: ‘हाथ में’ नियंत्रण और अधिकार का मूल इब्रानी मुहावरा तथा पद का रूपक सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
- source_word: עַל כָּל אֲשֶׁר יַחְפֹּץ
  choice: जिधर चाहता है, उधर
  rationale: संदर्भ में यह वाक्यांश इच्छित दिशा या गंतव्य बताता है। यह हिन्दी अभिव्यक्ति दिशा का भाव स्पष्ट रखती है और חפץ की इच्छा/चाह के अर्थ को सुरक्षित रखती है।
- source_word: יַטֶּנּוּ
  choice: उसे ... मोड़ देता है
  rationale: नָטָה का हिफ़ील रूप मोड़ने या दिशा देने का अर्थ रखता है। ‘उसे’ का संकेत राजा के हृदय की ओर है और ‘मोड़ देता है’ जलधाराओं के रूपक से मेल खाता है।
theological_decisions:
- issue: शासकों पर परमेश्वर की प्रभुता
  choice: पद यह कहता है कि यहोवा राजा के हृदय को वास्तविक रूप से अपनी इच्छित दिशा में मोड़ता है।
  alternative: इसे या तो पूर्ण नियतिवाद के कथन के रूप में, या केवल हल्के प्रभाव और मार्गदर्शन के रूप में पढ़ा जा सकता है।
  rationale: अनुवाद ‘हाथ में’ और ‘मोड़ देता है’ की प्रबल भाषा बनाए रखता है, परन्तु परमेश्वर की व्यवस्था और मानवीय स्वतंत्रता के किसी बाद के दार्शनिक प्रतिमान को पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूक्तिपरक शैली। ‘हृदय’ भीतरी इच्छा और अभिमुखता के बाइबलीय बिंब को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि मुख्य अनुवाद अर्थ और रूपक दोनों को पर्याप्त रूप से व्यक्त करता है।
