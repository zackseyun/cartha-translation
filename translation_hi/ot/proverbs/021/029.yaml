  text: הֵעֵ֬ז אִ֣ישׁ רָשָׁ֣ע בְּ/פָנָ֑י/ו וְ֝/יָשָׁ֗ר ה֤וּא יכין דרכי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/029.yaml
  text: A wicked man puts on a bold face[a], but an upright man makes his way sure.
translation:
  language: hi
  text: दुष्ट मनुष्य ढिठाई दिखाता है[a], परन्तु सीधा मनुष्य अपने मार्ग को सुस्थिर करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्ट मनुष्य अपना चेहरा कठोर कर लेता है, परन्तु सीधा मनुष्य अपने मार्गों को स्थिर करता है।”
    reason: हिब्रू में चेहरे को साहसी अथवा कठोर बनाने का मुहावरा है; साथ ही अंतिम संज्ञा रूपतः बहुवचन है। यह अधिक शाब्दिक विकल्प दोनों बातों को दिखाता है।
lexical_decisions:
- source_word: הֵעֵז ... בְּפָנָיו
  choice: ढिठाई दिखाता है
  rationale: यह हिब्रू मुहावरा चेहरे को साहसी या कठोर बनाने के द्वारा निर्लज्ज आत्म-दृढ़ता दिखाने का भाव देता है। सहज आधुनिक हिन्दी में ‘ढिठाई दिखाता है’ इसका मुख्य आशय व्यक्त करता है; चेहरे वाला अधिक शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: אִישׁ רָשָׁע
  choice: दुष्ट मनुष्य
  rationale: ‘दुष्ट’ नीतिवचन में नैतिक श्रेणी को व्यक्त करता है और ‘सीधा’ के साथ स्पष्ट विरोध बनाता है; ‘मनुष्य’ प्रतिनिधिक पुल्लिंग एकवचन को बनाए रखता है।
- source_word: וְיָשָׁר הוּא
  choice: परन्तु सीधा मनुष्य
  rationale: वाव यहाँ विरोधसूचक है। ‘सीधा’ नैतिक खराई का अर्थ रखता है, जबकि अनिश्चित ‘मनुष्य’ लेखरहित हिब्रू रूप और सामान्य नीतिवचनात्मक कथन के अनुकूल है।
- source_word: יכין
  choice: दृढ़ करता है
  rationale: כּוּן के हिफ़ील रूप का मूल भाव स्थापित करना, स्थिर करना या दृढ़ करना है। यह चुनाव जानबूझकर व्यवस्थित और स्थिर जीवन-मार्ग का भाव बनाए रखता है।
- source_word: דרכיו
  choice: अपने मार्ग को
  rationale: रूपतः बहुवचन होने पर भी ‘मार्ग’ यहाँ जीवन-चाल के सामूहिक अर्थ में समझा जा सकता है। हिन्दी में एकवचन ‘अपने मार्ग को’ अधिक स्वाभाविक और नीतिवचनात्मक है।
