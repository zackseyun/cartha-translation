source:
  edition: WLC
  text: בַּ/עְנָשׁ לֵ֭ץ יֶחְכַּם פֶּ֑תִי וּ/בְ/הַשְׂכִּ֥יל לְ֝/חָכָ֗ם יִקַּח דָּֽעַת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/011.yaml
  text: When a scoffer is punished[a], the simple become wise; and when a wise man is instructed[b], he gains knowledge.
translation:
  language: hi
  text: जब उपहास करनेवाले को दंड दिया जाता है, तब भोला बुद्धिमान हो जाता है; और जब बुद्धिमान को शिक्षा दी जाती है, तब वह ज्ञान प्राप्त करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּ/עְנָשׁ
  choice: जब ... को दण्ड दिया जाता है
  rationale: בְּ के साथ infinitive construct यहाँ परिस्थिति अथवा अवसर का भाव देता है—‘दण्ड दिए जाने पर/जब दण्ड दिया जाता है।’ यह हिन्दी में स्वाभाविक रूप से कर्मवाच्य कालवाचक उपवाक्य द्वारा व्यक्त हुआ है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: यह शब्द ऐसे उपहासपूर्ण और सुधार को ठुकरानेवाले व्यक्ति को दर्शाता है; ‘ठट्ठा करनेवाला’ उसके वाचिक और नैतिक दोनों पक्षों को व्यक्त करता है।
- source_word: יֶחְכַּם
  choice: बुद्धिमान हो जाता है
  rationale: חכם का Qal रूप यहाँ बुद्धि रखने की स्थिर दशा से अधिक बुद्धिमान बनने का भाव देता है।
- source_word: פֶּתִי
  choice: भोला
  rationale: नीतिवचन में यह नैतिक और बौद्धिक रूप से अपरिपक्व, आसानी से प्रभावित होनेवाले व्यक्ति की श्रेणी है; ‘भोला’ आधुनिक हिन्दी में इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: וּ/בְ/הַשְׂכִּיל
  choice: और जब ... को समझ दी जाती है
  rationale: שׂכל का Hiphil infinitive construct किसी को सूझ-बूझ देने या समझाने का अर्थ रख सकता है। ‘समझ दी जाती है’ इस causative अर्थ को ‘सिखाया जाता है’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: לְ/חָכָם
  choice: बुद्धिमान
  rationale: मूल में पुल्लिंग एकवचन विशेषण संज्ञा के रूप में एक प्रतिनिधि नीतिवचनात्मक प्रकार को दर्शाता है। हिन्दी में ‘बुद्धिमान’ का रूप लिंग-चिह्नित किए बिना उसी एकवचन प्रतिनिधि अर्थ को स्वाभाविक रूप से रखता है।
- source_word: יִקַּח
  choice: प्राप्त करता है
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर דּעת के साथ इसका मुहावरेदार अर्थ ज्ञान अर्जित या प्राप्त करना है।
- source_word: דָּעַת
  choice: ज्ञान
  rationale: यह नीतिवचन में ज्ञान का मानक पद है और ‘बुद्धि’ से संबंधित होते हुए भी उससे अलग शब्दगत पहचान रखता है।
theological_decisions:
- issue: नीतिवचन का पुल्लिंग एकवचन विषय
  choice: बुद्धिमान ... वह
  alternative: बुद्धिमान पुरुष
  rationale: मूल का חָכָם व्याकरणतः पुल्लिंग एकवचन और प्रतिनिधि प्रकार है। हिन्दी में ‘बुद्धिमान’ और ‘वह’ एकवचन को बनाए रखते हैं, जबकि अनावश्यक रूप से ‘पुरुष’ जोड़कर अर्थ को केवल जैविक पुरुष तक सीमित नहीं करते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों समांतर खंडों की ‘जब... तब...’ संरचना सुरक्षित है। ‘दण्ड’, ‘बुद्धिमान’ और ‘ज्ञान’ जैसे स्थापित ज्ञान-साहित्य पद प्रयुक्त हैं।
