source:
  edition: WLC
  text: זֶ֣בַח רְ֭שָׁעִים תּוֹעֵבָ֑ה אַ֝֗ף כִּֽי בְ/זִמָּ֥ה יְבִיאֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/027.yaml
  text: The sacrifice of the wicked is an abomination[a]; how much more when he brings it with evil intent.
translation:
  language: hi
  text: दुष्टों का बलिदान घृणित है; फिर कितना अधिक, जब कोई उसे बुरी नीयत से चढ़ाता है![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर कितना अधिक, जब वह उसे किसी दुष्ट योजना के साथ चढ़ाता है!” इब्रानी पदबंध भ्रष्ट नीयत या दुर्भावनापूर्ण योजना—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह शब्द विशेष रूप से वध करके चढ़ाए जाने वाले बलिदान को दर्शाता है; ‘बलिदान’ हिन्दी में स्वाभाविक और पर्याप्त रूप से विशिष्ट है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: बहुवचन संज्ञार्थक विशेषण नैतिक रूप से दोषी लोगों की सामान्य श्रेणी बताता है; ‘दुष्टों’ नीतिवचन की संक्षिप्त शैली बनाए रखता है।
- source_word: תּוֹעֵבָה
  choice: घृणित
  rationale: यह परमेश्वर की दृष्टि में अत्यंत अप्रिय और नैतिक रूप से जुगुप्सित वस्तु का प्रबल भाव व्यक्त करता है; ‘घृणित’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से पहुँचाता है।
- source_word: אַף כִּי
  choice: फिर कितना अधिक
  rationale: 'यह पहले कथन को आगे की परिस्थिति में और तीव्र करता है: दुष्टों का बलिदान स्वयं घृणित है, और बुरी नीयत से चढ़ाया जाए तो और भी अधिक।'
- source_word: בְּזִמָּה
  choice: बुरी नीयत से
  rationale: संदर्भ में शब्द दुराचारपूर्ण अभिप्राय, दुर्भावना या दुष्ट योजना सूचित कर सकता है; यहाँ ‘बुरी नीयत से’ भ्रष्ट उद्देश्य को स्पष्ट करता है, बिना इसे अनावश्यक रूप से यौन अर्थ देने के।
- source_word: יְבִיאֶנּוּ
  choice: कोई उसे ... चढ़ाता है
  rationale: हिफ़ील रूप का अर्थ ‘लाना/प्रस्तुत करना’ है और प्रत्यय स्वाभाविक रूप से बलिदान की ओर संकेत करता है। उपासना के प्रसंग में ‘चढ़ाता है’ सहज हिन्दी है; अनिर्दिष्ट एकवचन कर्ता को ‘कोई’ से व्यक्त किया गया है।
theological_decisions:
- issue: दुष्ट व्यक्ति द्वारा चढ़ाए गए बलिदान का नैतिक मूल्यांकन
  choice: यह नीतिवचन बताता है कि दुष्टों का बलिदान घृणित है, और बुरी नीयत से चढ़ाया गया बलिदान उससे भी अधिक घृणित है।
  alternative: दूसरे उपवाक्य का अर्थ अधिक सामान्य रूप से ‘विशेषकर जब वह उसे दुष्टता में चढ़ाता है’ लिया जा सकता है, जिसमें योजनाबद्ध मंशा स्पष्ट न हो।
  rationale: पद बलिदान-प्रथा को अपने आप में अस्वीकार नहीं करता, बल्कि दुष्टता और भ्रष्ट उद्देश्य से जुड़ी धार्मिक क्रिया की निंदा करता है। अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमामय शैली के अनुरूप रखी गई है। ‘बलिदान’ धार्मिक संदर्भ की विशिष्टता बनाए रखता है और ‘बुरी नीयत’ सामान्य पाठक के लिए सहज है।
