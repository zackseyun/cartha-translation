source:
  edition: WLC
  text: רֹ֭דֵף צְדָקָ֣ה וָ/חָ֑סֶד יִמְצָ֥א חַ֝יִּ֗ים צְדָקָ֥ה וְ/כָבֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/021.yaml
  text: Whoever pursues righteousness and steadfast love will find life[a], righteousness[c][b], and honor.
translation:
  language: hi
  text: '**नीतिवचन 21:21**


    जो धार्मिकता[a] और निष्ठावान प्रेम[b] के पीछे लगा रहता है,

    वह जीवन, धार्मिकता[c] और सम्मान पाएगा।


    **पादटिप्पणियाँ**


    [a] “धार्मिकता” के स्थान पर यहाँ या दोनों स्थानों पर “न्याय” भी समझा जा सकता है; इब्रानी शब्द में व्यक्तिगत धार्मिकता और न्यायपूर्ण आचरण—दोनों भाव समाए हो सकते हैं।


    [b] “निष्ठावान प्रेम” इब्रानी *हेसेद* का अनुवाद है। इसका अर्थ “दयालुता,” “करुणा” या “अटल प्रेम” भी हो सकता है।


    [c] दूसरी बार प्रयुक्त “धार्मिकता” का अर्थ इस प्रसंग में “सही ठहराया जाना” भी हो सकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “धार्मिकता” के स्थान पर यहाँ या दोनों स्थानों पर “न्याय” भी समझा जा सकता है; इब्रानी शब्द में व्यक्तिगत धार्मिकता और न्यायपूर्ण आचरण—दोनों भाव समाए हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: “निष्ठावान प्रेम” इब्रानी हेसेद का अनुवाद है। इसका अर्थ “दयालुता,” “करुणा” या “अटल प्रेम” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: दूसरी बार प्रयुक्त “धार्मिकता” का अर्थ इस प्रसंग में “सही ठहराया जाना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹדֵף
  choice: के पीछे लगा रहता है
  rationale: इब्रानी कृदंत लगातार और सक्रिय रूप से किसी लक्ष्य का पीछा करने का भाव देता है। यह हिंदी प्रयोग उस निरंतर प्रयत्न को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: यह शब्द धार्मिक और नैतिक खराई के साथ न्यायपूर्ण आचरण को भी समेट सकता है। “धार्मिकता” इसकी व्यापकता और पद में हुई पुनरावृत्ति को बनाए रखता है; “न्याय” की संभावना पादटिप्पणी में दी गई है।
- source_word: חֶסֶד
  choice: निष्ठावान प्रेम
  rationale: इब्रानी शब्द प्रेम, दया और स्थिर निष्ठा का संयुक्त भाव रखता है। “निष्ठावान प्रेम” इसे केवल दयालुता या करुणा तक सीमित नहीं करता।
- source_word: יִמְצָא
  choice: पाएगा
  rationale: यहाँ अपूर्ण क्रिया नीतिवचन के सामान्य परिणाम को व्यक्त करती है। “पाएगा” आधुनिक हिंदी में स्वाभाविक है और “प्राप्त करेगा” से अधिक सरल है।
- source_word: חַיִּים
  choice: जीवन
  rationale: रूप की दृष्टि से बहुवचन होने पर भी यह इब्रानी में प्रायः समष्टिगत अर्थ में “जीवन” को दर्शाता है।
- source_word: צְדָקָה
  choice: धार्मिकता
  rationale: दूसरे प्रयोग में भी वही हिंदी शब्द रखकर मूल की सार्थक पुनरावृत्ति और संक्षिप्तता सुरक्षित की गई है। प्रसंगानुसार “सही ठहराया जाना” संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: כָבוֹד
  choice: सम्मान
  rationale: ज्ञान-साहित्य के इस संदर्भ में शब्द प्रतिष्ठा, आदर या महिमा का संकेत दे सकता है। “सम्मान” सामाजिक प्रतिष्ठा का भाव स्पष्ट करता है, बिना इसे धन-संपत्ति तक सीमित किए।
theological_decisions:
- issue: पद में צְדָקָה की पुनरावृत्ति का अर्थ
  choice: दोनों स्थानों पर “धार्मिकता”
  alternative: एक या दोनों स्थानों पर “न्याय”; दूसरे स्थान पर “सही ठहराया जाना”
  rationale: एक ही शब्द को दोनों स्थानों पर रखने से इब्रानी की नैतिक-धार्मिक समरूपता बनी रहती है और पाठ किसी एक संकुचित अर्थ को अनावश्यक रूप से निर्धारित नहीं करता। वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और नीतिवचन-सुलभ काव्यात्मक गद्य रखा गया है। “के पीछे लगा रहता है” निरंतर सक्रिय खोज को बोलचाल की सहजता के साथ व्यक्त करता है। तकनीकी या सांप्रदायिक शब्दावली से बचते हुए मूल की पुनरावृत्ति और अर्थगत अस्पष्टता सुरक्षित रखी गई है।
