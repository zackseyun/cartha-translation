  text: אֵ֣ין חָ֭כְמָה וְ/אֵ֣ין תְּבוּנָ֑ה וְ/אֵ֥ין עֵ֝צָ֗ה לְ/נֶ֣גֶד יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/030.yaml
  text: There is no wisdom[a], no understanding, and no counsel against Yahweh.
translation:
  language: hi
  text: याहवे के विरुद्ध[a] न तो कोई बुद्धि है, न कोई समझ, और न कोई युक्ति।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे के सामने” अथवा “याहवे की उपस्थिति में।” इब्रानी अभिव्यक्ति किसी के सामने स्थित होने का अर्थ दे सकती है, पर यहाँ संभवतः विरोध में खड़े होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: न कोई … टिक सकती है
  rationale: तीन संज्ञाओं के साथ दोहराए गए अस्तित्ववाचक निषेध को हिन्दी में स्वाभाविक समानांतर रचना द्वारा व्यक्त किया गया है; अंतिम क्रिया पूरे त्रिक पर लागू होती है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में व्यावहारिक और कुशल विवेक के सामान्य अर्थ को व्यक्त करता है और हिन्दी पाठक के लिए सहज है।
- source_word: תְּבוּנָה
  choice: समझ
  rationale: बुद्धि से संबंधित, पर उससे अलग अंतर्दृष्टि और परख की क्षमता को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עֵצָה
  choice: युक्ति
  rationale: यहाँ सलाह के साथ योजना अथवा रणनीति का भाव भी है; विरोध के प्रसंग में ‘युक्ति’ इस विचार को संक्षेप में पकड़ती है।
- source_word: לְנֶגֶד
  choice: के विरुद्ध
  rationale: प्रसंग में केवल उपस्थिति नहीं, बल्कि विरोध में खड़े होने का भाव अधिक संभावित है; वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उपाधि जोड़ने से बचता है।
- issue: לְנֶגֶד יְהוָה का भाव
  choice: याहवे के विरुद्ध … टिक सकती है
  alternative: याहवे के सामने; याहवे की उपस्थिति में
  rationale: कहावत का आशय मानव बुद्धि, समझ या योजना के परमेश्वर के विरोध में सफल न हो सकने से सबसे स्वाभाविक रूप से समझ आता है; फिर भी स्थानसूचक अर्थ संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। ‘टिक सकती है’ को स्पष्ट, स्वाभाविक हिन्दी के लिए जोड़ा गया है; यह לְנֶגֶד में निहित विरोध में खड़े होने के भाव को सामने लाता है। तीनों संज्ञाओं का समानांतर बल बनाए रखा गया है।
