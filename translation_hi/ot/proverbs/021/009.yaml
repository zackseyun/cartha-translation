  text: ט֗וֹב לָ/שֶׁ֥בֶת עַל פִּנַּת גָּ֑ג מֵ/אֵ֥שֶׁת מִ֝דְיָנִ֗ים וּ/בֵ֥ית חָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/009.yaml
  text: Better to live on a corner of the roof than with a quarrelsome wife in a shared house[a].
translation:
  language: hi
  text: झगड़ालू पत्नी के साथ साझा घर[a] में रहने से छत के एक कोने पर रहना अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरों के साथ साझा किए गए घर में’; इब्रानी पदबंध का शाब्दिक अर्थ ‘संगति/साझेदारी का घर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा है
  rationale: नीतिवचन की तुलना में यह पदबंध ‘...से ... अच्छा है’ के रूप में स्वाभाविक हिन्दी तुलनात्मक अर्थ देता है।
- source_word: לָשֶׁבֶת
  choice: रहना
  rationale: यद्यपि मूल अर्थ ‘बैठना’ है, निवास के प्रसंग में यह क्रिया ‘रहना/बसना’ का अर्थ देती है।
- source_word: עַל פִּנַּת גָּג
  choice: छत के एक कोने पर
  rationale: גָּג प्राचीन घर की समतल छत और פִּנָּה उसके कोने को दर्शाता है; यह अभिव्यक्ति असुविधाजनक और खुली जगह का चित्र बनाए रखती है।
- source_word: מֵאֵשֶׁת מִדְיָנִים
  choice: झगड़ालू पत्नी के साथ ... से
  rationale: מִן तुलना को चिह्नित करता है, और מִדְיָנִים ‘झगड़ों/विवादों’ से पत्नी के झगड़ालू स्वभाव का संकेत देता है। हिन्दी में ‘के साथ ... रहने से’ निहित संबंध को सहजता से व्यक्त करता है।
- source_word: וּבֵית חָבֶר
  choice: साझे के घर
  rationale: חָבֶר का अर्थ संगति, सहभागिता या साथ हो सकता है। ‘साझे का घर’ सामूहिक/दूसरों के साथ साझा निवास का सम्भावित अर्थ देता है, जबकि मूल पदबंध की अनिश्चितता पादटिप्पणी में रखी गई है।
