  yaml_path: translation/ot/proverbs/021/016.yaml
  text: A man who wanders from the way of understanding will come to rest in the assembly of the dead[a].
translation:
  language: hi
  text: 'जो मनुष्य समझ के मार्ग से भटकता है,

    वह मृतकों की सभा में जा टिकेगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छायाओं की”; इब्रानी में “रफाईम,” जो ज्ञान-साहित्य में दिवंगत मृतकों के लिए प्रयुक्त शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह एक प्रतिनिधि व्यक्ति के लिए प्रयुक्त एकवचन संज्ञा है। हिंदी में ‘मनुष्य’ इस लोकोक्तिपरक सामान्य अर्थ को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: תּוֹעֶה
  choice: भटकता है
  rationale: कृदंत मार्ग से निरंतर भटकने या भटके रहने का भाव देता है; ‘भटकता है’ मार्ग-रूपक और क्रिया की जारी प्रकृति दोनों बनाए रखता है।
- source_word: מִדֶּרֶךְ
  choice: मार्ग से
  rationale: ‘मार्ग’ नीतिवचन में जीवन और आचरण की दिशा का प्रमुख रूपक है और मूल के מן उपसर्ग का अपादान भाव भी स्पष्ट रखता है।
- source_word: הַשְׂכֵּל
  choice: समझ के
  rationale: यह शब्द विवेकपूर्ण समझ या सूझ-बूझ को सूचित करता है। ‘समझ के मार्ग’ सहज हिंदी है और ज्ञान-साहित्य का भाव बनाए रखता है।
- source_word: בִּקְהַל
  choice: सभा में
  rationale: קהל एक एकत्रित समूह को दर्शाता है। ‘सभा’ सामूहिक चित्र को बनाए रखता है और अनावश्यक धार्मिक-सांप्रदायिक अर्थ से बचता है।
- source_word: רְפָאִים
  choice: मृतकों
  rationale: इस ज्ञान-साहित्यिक संदर्भ में यह अधोलोक के दिवंगत मृतकों को सूचित करता है, किसी जातीय समूह को नहीं। स्पष्टता के लिए मुख्य पाठ में ‘मृतकों’ और विशेष बिंब के लिए पादटिप्पणी दी गई है।
- source_word: יָנוּחַ
  choice: जा टिकेगा
  rationale: क्रिया विश्राम करने या ठहर जाने का अर्थ देती है। संदर्भ में परिणामस्वरूप मृतकों के बीच पहुँचकर ठहरना अभिप्रेत है; ‘जा टिकेगा’ इसे शांतिपूर्ण विश्राम समझने से बचाता है।
theological_decisions:
- issue: ज्ञान-साहित्य में רְפָאִים का अर्थ
  choice: मृतकों
  alternative: छायारूप मृतात्माओं; रफाईम
  rationale: पद का आशय यह चेतावनी देना है कि समझ के मार्ग से भटकने वाले का अंत मृतकों की संगति में होगा। ‘रफाईम’ सामान्य पाठक के लिए अस्पष्ट होगा, जबकि ‘मृतकों’ अर्थ साफ करता है; मूल के अधोलोक-संबंधी विशेष भाव को पादटिप्पणी में रखा गया है।
