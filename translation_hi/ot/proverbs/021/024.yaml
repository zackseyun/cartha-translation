source:
  edition: WLC
  text: זֵ֣ד יָ֭הִיר לֵ֣ץ שְׁמ֑/וֹ ע֝וֹשֶׂ֗ה בְּ/עֶבְרַ֥ת זָדֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/024.yaml
  text: “Proud[a], arrogant, a scoffer” is his name—one who acts in the fury of presumption.
translation:
  language: hi
  text: “उद्दंड, घमंडी और ठट्ठेबाज़”—यही उसका नाम है[a]; वह घमंड के उग्र आवेश में काम करनेवाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उद्दंड, घमंडी, ठट्ठेबाज़”—यही उसका नाम है; वह घमंडी उग्रता से काम करता है।
    reason: इब्रानी अंतिम पदबंध को शाब्दिक रूप से ‘घमंड के उग्र आवेश में’ अथवा अधिक मुहावरेदार ढंग से ‘घमंडी उग्रता से’ समझा जा सकता है।
lexical_decisions:
- source_word: זֵד
  choice: उद्दंड
  rationale: यह शब्द अहंकार से उपजी धृष्टता और मनमानी का बोध कराता है। ‘उद्दंड’ इसे ‘घमंडी’ से अलग रखते हुए व्यक्त करता है।
- source_word: יָהִיר
  choice: घमंडी
  rationale: यह आत्म-उत्कर्ष और दंभ को दर्शाता है; आधुनिक हिंदी में ‘घमंडी’ स्पष्ट और स्वाभाविक है।
- source_word: לֵץ
  choice: ठट्ठा करनेवाला
  rationale: नीतिवचन में यह उस व्यक्ति-प्रकार को दर्शाता है जो तिरस्कारपूर्वक उपहास करता है; यह केवल हास्य करनेवाले व्यक्ति से अधिक नकारात्मक है।
- source_word: שְׁמוֹ
  choice: यही उसका नाम है
  rationale: इब्रानी के ‘उसका नाम’ वाले चरित्र-निर्धारक सूत्र को बनाए रखता है और हिंदी में बल भी स्पष्ट करता है।
- source_word: עֹשֶׂה
  choice: वह ... काम करता है
  rationale: कृदंत आदतन आचरण बताता है; वर्तमानकालीन हिंदी वाक्य नीति-वचन के सामान्य और चरित्रगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּעֶבְרַת
  choice: उग्र आवेश में
  rationale: עֶבְרָה उफनते क्रोध या तीव्र आवेश का संकेत देता है। संदर्भ में ‘उग्र आवेश’ तीव्रता बनाए रखते हुए अगले शब्द ‘अहंकार’ के साथ स्वाभाविक बैठता है।
- source_word: זָדוֹן
  choice: अहंकार
  rationale: यह उद्दंड, धृष्ट आत्म-इच्छा और presumptuous pride को व्यक्त करता है। ‘अहंकार’ हिंदी में स्पष्ट है और मूल में זֵד के साथ शब्दगत संबंध की अर्थ-प्रतिध्वनि बनाए रखता है।
