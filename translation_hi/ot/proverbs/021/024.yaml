  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरंभिक तीन पदों की संक्षिप्त, प्रहारक शैली और ‘उसका नाम’ वाला इब्रानी चरित्र-निर्धारण मुख्य पाठ में सुरक्षित है।
