  text: Haughty eyes and a proud heart— the lamp of the wicked— are sin[a].
translation:
  language: hi
  text: घमंडी आँखें और गर्वीला हृदय—दुष्टों का दीपक—पाप हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टों की जुताई पाप है।” इसका अर्थ “दुष्टों की खेती” अथवा “दुष्टों की परती भूमि” भी समझा गया है। जिस इब्रानी शब्द का अनुवाद “दीपक” किया गया है, उसे कृषि-संबंधी अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רוּם עֵינַיִם
  choice: घमण्डी आँखें
  rationale: शाब्दिक रूप से ‘ऊँची आँखें’; यह घमण्ड का मुहावरा है। चुना हुआ रूपक आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וּרְחַב לֵב
  choice: अहंकारी मन
  rationale: शाब्दिक अर्थ ‘चौड़ा हृदय’ है, पर यहाँ आशय उदारता नहीं, आत्म-अभिमान है। हिन्दी में ‘मन’ इस नैतिक प्रवृत्ति को सहजता से व्यक्त करता है।
- source_word: נִר
  choice: दीपक
  rationale: मसोरेटिक स्वरांकन के अनुसार ‘दीपक’ लिया गया है। व्यंजनात्मक रूप से ‘जुताई/खेती’ की वैकल्पिक समझ सम्भव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: नीतिवचन में नैतिक रूप से दोषी लोगों के वर्ग के लिए प्रयुक्त मानक शब्द; ‘दुष्टों’ संक्षिप्त और स्वाभाविक है।
- source_word: חַטָּאת
  choice: पाप हैं
  rationale: मूल में संज्ञा ‘पाप’ है, इसलिए विशेषण ‘पापमय’ के बजाय संज्ञात्मक बल बनाए रखा गया है; संयुक्त विषय के अनुसार ‘हैं’ आया है।
theological_decisions:
- issue: נִר רְשָׁעִים का अर्थ
  choice: दुष्टों का दीपक
  alternative: दुष्टों की जुताई/खेती अथवा परती भूमि
  rationale: मसोरेटिक पाठ का स्वरांकन ‘दीपक’ का समर्थन करता है और यह घमण्डी स्वभाव के साथ एक सुसंगत कथन देता है। कृषि-संबंधी अर्थ भी प्राचीन और भाषिक रूप से सम्भव है, इसलिए उसे दबाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल की रूपकात्मकता तथा נִר की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
