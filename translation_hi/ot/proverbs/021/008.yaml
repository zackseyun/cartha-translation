source:
  edition: WLC
  text: הֲפַכְפַּ֬ךְ דֶּ֣רֶךְ אִ֣ישׁ וָזָ֑ר וְ֝/זַ֗ךְ יָשָׁ֥ר פָּעֳלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/008.yaml
  text: The way of a guilty man is crooked and strange[a], but the conduct of the pure is upright.
translation:
  language: hi
  text: दोषी मनुष्य का मार्ग टेढ़ा है, परन्तु शुद्ध जन का आचरण सीधा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲפַכְפַּךְ
  choice: टेढ़ा
  rationale: यह शब्द मुड़े हुए या विकृत होने का भाव देता है। ‘टेढ़ा’ सहज हिन्दी है और दूसरे चरण के ‘सीधा’ के साथ मूल का नैतिक तथा रूपकात्मक विरोध बनाए रखता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: नीतिवचन में यह जीवन-चाल या जीवन के ढंग का सामान्य रूपक है; ‘मार्ग’ उस रूपक को स्वाभाविक और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: इब्रानी में पुल्लिंग एकवचन है, पर यहाँ कथन सामान्य मानवीय प्रकार के विषय में है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक रहते हुए एकवचन कथन को बनाए रखता है।
- source_word: וָזָר
  choice: दोषी
  rationale: यह कठिन पाठरूप ‘पराया’, ‘अजनबी’ या ‘विचित्र’ का भाव भी दे सकता है। संदर्भ में ‘शुद्ध’ के नैतिक विरोध के कारण मुख्य पाठ में ‘दोषी’ उपयुक्त है, जबकि शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: זַךְ
  choice: शुद्ध
  rationale: यह नैतिक अथवा विधिसंबंधी स्वच्छता का बोध करा सकता है; नीतिवचन के नैतिक संदर्भ में ‘शुद्ध’ उपयुक्त और व्यापक है।
- source_word: יָשָׁר
  choice: सीधा
  rationale: यह नैतिक खराई के साथ मार्ग की सीधाई का रूपक भी व्यक्त करता है और ‘टेढ़ा’ का स्पष्ट स्वाभाविक विलोम है।
- source_word: פָּעֳלוֹ
  choice: आचरण
  rationale: शब्द का अर्थ काम, कर्म या किया हुआ कार्य हो सकता है। पहले चरण के ‘मार्ग’ के समानांतर ‘आचरण’ व्यक्ति के समग्र व्यवहार को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וָזָר की नैतिक अथवा बाहरीपन-संबंधी व्याख्या
  choice: मुख्य पाठ में ‘दोषी’
  alternative: ‘पराया/अजनबी’ अथवा ‘विचित्र’
  rationale: मूल शब्द कठिन है और उसकी व्युत्पत्तिगत दिशा बाहरीपन या परायेपन की ओर जा सकती है; फिर भी ‘शुद्ध’ के साथ नैतिक विरोध दोषभाव की व्याख्या को संभव बनाता है। अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है, न कि पूर्णतः सुलझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और गरिमापूर्ण नीतिवचनात्मक रूप। ‘टेढ़ा/सीधा’ से मूल का मार्ग-संबंधी रूपक और नैतिक विरोध दोनों सुरक्षित रखे गए हैं।
