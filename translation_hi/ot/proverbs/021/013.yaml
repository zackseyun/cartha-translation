source:
  edition: WLC
  text: אֹטֵ֣ם אָ֭זְנ/וֹ מִ/זַּעֲקַת דָּ֑ל גַּֽם ה֥וּא יִ֝קְרָ֗א וְ/לֹ֣א יֵעָנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/013.yaml
  text: Whoever shuts his ear to the cry of the poor will also call out and not be answered[a].
translation:
  language: hi
  text: जो गरीब[a] की दुहाई सुनने से अपने कान बंद कर लेता है, वह भी पुकारेगा और उसे उत्तर नहीं मिलेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निर्बल’ अथवा ‘ज़रूरतमंद’। इब्रानी शब्द דָּל किसी निर्धन, निर्बल या सामाजिक रूप से असुरक्षित व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹטֵם
  choice: बंद कर लेता है
  rationale: यह रूप जानबूझकर कान बंद करने की क्रिया बताता है; हिंदी में यह स्वाभाविक है और सचेत उपेक्षा का भाव बनाए रखता है।
- source_word: אָזְנוֹ
  choice: कान
  rationale: इब्रानी में एकवचन है; हिंदी मुहावरे में भी ‘कान बंद करना’ स्वाभाविक रूप से वही ठोस बिंब रखता है।
- source_word: מִזַּעֲקַת
  choice: दुहाई सुनने से
  rationale: यहाँ पूर्वसर्ग उस पुकार को दर्शाता है जिसे सुनने से व्यक्ति इनकार करता है। ‘दुहाई’ संकट में सहायता की तीव्र पुकार का भाव देती है।
- source_word: דָּל
  choice: कंगाल
  rationale: यह शब्द निर्धन, निर्बल या सामाजिक रूप से असुरक्षित व्यक्ति को सूचित कर सकता है। ‘कंगाल’ मुख्य अर्थ को संक्षेप में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: גַּם הוּא
  choice: वह भी
  rationale: 'यह प्रतिफल की समानता पर बल देता है: जो दूसरे की पुकार नहीं सुनता, उसकी अपनी पुकार भी अनुत्तरित रहेगी।'
- source_word: יִקְרָא
  choice: पुकारेगा
  rationale: यह क्रिया पुकारने या सहायता के लिए आवाज़ लगाने को दर्शाती है और उत्तर देने वाले की पहचान नहीं जोड़ती।
- source_word: וְלֹא יֵעָנֶה
  choice: पर उसे उत्तर नहीं मिलेगा
  rationale: इब्रानी का कर्मवाच्य अर्थ सुरक्षित है और हिंदी में स्वाभाविक ढंग से व्यक्त होता है; उत्तर न देने वाला कौन है, यह अस्पष्ट ही रहता है।
theological_decisions:
- issue: अनुत्तरित पुकार किससे की गई है
  choice: मुख्य पाठ में उत्तर देने वाले को अनिर्दिष्ट रखना
  alternative: स्पष्ट करना कि परमेश्वर या दूसरे लोग उत्तर नहीं देंगे
  rationale: इब्रानी पाठ उत्तर देने वाले कर्ता का उल्लेख नहीं करता। यह ईश्वरीय न्याय की ओर संकेत कर सकता है, पर अनिश्चितता को बनाए रखना स्रोत के प्रति अधिक निष्ठावान है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘जो... वह भी’ का प्रयोग
  alternative: बहुवचन या पूर्णतः लिंग-निरपेक्ष रचना
  rationale: इब्रानी में प्रतिनिधिक पुल्लिंग एकवचन है। हिंदी की यह रचना स्वाभाविक है और व्याकरणिक संख्या तथा प्रतिफलात्मक समानांतरता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण नीतिवचनात्मक लहजा रखा गया है। ‘दुहाई’ संकटपूर्ण पुकार की तीव्रता और ‘कान बंद कर लेना’ जानबूझकर अनसुना करने का ठोस बिंब सुरक्षित रखते हैं।
