source:
  edition: WLC
  text: תַּאֲוַ֣ת עָצֵ֣ל תְּמִיתֶ֑/נּוּ כִּֽי מֵאֲנ֖וּ יָדָ֣י/ו לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/025.yaml
  text: The craving of a lazy man puts him to death, because his hands refuse to work.
translation:
  language: hi
  text: आलसी की लालसा उसे मार डालती है, क्योंकि उसके हाथ काम करने से इनकार करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּאֲוַת
  choice: लालसा
  rationale: यह शब्द तीव्र इच्छा या लालसा व्यक्त करता है। प्रसंग में ऐसी निष्क्रिय चाह का भाव है जो श्रम के बिना पाने को तरसती है; इसलिए सामान्य ‘इच्छा’ की अपेक्षा ‘लालसा’ अधिक उपयुक्त है।
- source_word: עָצֵל
  choice: आलसी
  rationale: नीतिवचन में यह उस व्यक्ति के लिए प्रचलित पद है जो परिश्रम से बचता है; आधुनिक हिन्दी में ‘आलसी’ स्पष्ट और स्वाभाविक है।
- source_word: תְּמִיתֶנּוּ
  choice: उसे मार डालती है
  rationale: हिब्रू में ‘लालसा’ कर्ता है और क्रिया का अर्थ मृत्यु का कारण बनना है। यह सशक्त कारणात्मक अभिव्यक्ति मूल रूपक को बनाए रखती है।
- source_word: מֵאֲנוּ יָדָיו לַעֲשׂוֹת
  choice: उसके हाथ काम करने से इनकार करते हैं
  rationale: ‘हाथ’ को कर्ता बनाए रखने से मूल का सजीव मानवीकरण सुरक्षित रहता है; यहाँ सामान्य अर्थ में ‘करना’ हिन्दी में स्वाभाविक रूप से ‘काम करना’ है।
theological_decisions:
- issue: क्या मृत्यु को शाब्दिक या रूपकात्मक बनाकर स्पष्ट किया जाए
  choice: ‘मार डालती है’ की मूल, अनिर्धारित तीव्रता बनाए रखी गई
  alternative: ‘उसका विनाश कर देती है’ या ‘उसे बरबाद कर देती है’
  rationale: हिब्रू सीधे मृत्यु कराने की भाषा प्रयोग करता है। पद यह निश्चित नहीं करता कि आशय केवल शारीरिक मृत्यु है, सामाजिक-आर्थिक विनाश है, या दोनों; इसलिए अनुवाद उस तनाव को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, लोकोक्तिपरक और गरिमापूर्ण रखी गई है। मूल वाक्य के कारण-संबंध तथा ‘हाथों’ के मानवीकरण को सुरक्षित रखा गया है।
