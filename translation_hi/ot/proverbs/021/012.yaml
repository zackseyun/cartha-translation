  text: מַשְׂכִּ֣יל צַ֭דִּיק לְ/בֵ֣ית רָשָׁ֑ע מְסַלֵּ֖ף רְשָׁעִ֣ים לָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/012.yaml
  text: The righteous one considers the house of the wicked[a], bringing the wicked to ruin.
translation:
  language: hi
  text: धर्मी जन दुष्ट के घराने को ध्यान से परखता है, और दुष्टों को विपत्ति में डाल देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: ध्यान देता है
  rationale: हिफ़ील कृदंत यहाँ सूझ-बूझ के साथ विचार करने या सावधानी से ध्यान देने का भाव रखता है। ‘ध्यान देता है’ आधुनिक हिन्दी में स्वाभाविक रहते हुए विवेकपूर्ण निरीक्षण का आशय व्यक्त करता है।
- source_word: צַדִּיק
  choice: धर्मी जन
  rationale: पुल्लिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मी जन’ एक प्रतिनिधि धर्मी व्यक्ति का बोध कराता है और नीतिवचन की संक्षिप्त शैली बनाए रखता है।
- source_word: לְבֵית רָשָׁע
  choice: दुष्ट के घर पर
  rationale: בַּיִת का अर्थ घर या घराना दोनों हो सकता है। ‘घर’ अधिक सीधा अनुवाद है और व्यक्ति के गृहस्थ जीवन अथवा संपत्ति-क्षेत्र का व्यापक संकेत भी दे सकता है।
- source_word: מְסַלֵּף
  choice: डाल देता है
  rationale: סלף में उलटने, गिराने या विनाश की दशा में पहुँचा देने का भाव है। परिणामसूचक לָרָע के साथ ‘विनाश में डाल देता है’ हिन्दी में स्वाभाविक रूप से पूरी अभिव्यक्ति देता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह पुल्लिंग बहुवचन संज्ञात्मक विशेषण है; ‘दुष्टों’ उसका संक्षिप्त और स्वाभाविक सामूहिक रूप है।
- source_word: לָרָע
  choice: विनाश में
  rationale: רַע मूलतः बुराई अथवा अनिष्ट को सूचित कर सकता है, पर यहाँ परिणाम या विपत्ति का अर्थ अधिक उपयुक्त है। ‘विनाश में’ यह स्पष्ट करता है कि आशय नैतिक रूप से बुरा बनाने का नहीं, बल्कि अनिष्टकारी अंत तक पहुँचाने का है।
theological_decisions:
- issue: संक्षिप्त इब्रानी वाक्य में कर्ता की पहचान
  choice: पूरे पद में ‘धर्मी जन’ को मानवीय कर्ता माना गया है।
  alternative: '‘धर्मी’ को परमेश्वर का संकेत मानना: धर्मी परमेश्वर दुष्ट के घर पर ध्यान देता है और दुष्टों को विनाश में डाल देता है।'
  rationale: इब्रानी पाठ में परमेश्वर का कोई स्पष्ट नाम नहीं है। सबसे सीधा व्याकरणिक पाठ צַדִּיק को पहले कृदंत का मानवीय कर्ता मानता है और अगले एकवचन कृदंत में उसी कर्ता को जारी रखता है। फिर भी परमेश्वर को ‘धर्मी’ कर्ता मानने की प्राचीन/व्याख्यात्मक संभावना वास्तविक है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और नीतिवचन की गरिमापूर्ण शैली के अनुरूप रखी गई है। मुख्य पाठ में मानवीय कर्ता को प्राथमिकता दी गई है, जबकि सम्भव ईश्वरीय कर्ता को पादटिप्पणी में रखा गया है।
