  edition: WLC
  text: כָּֽל דֶּרֶךְ אִ֭ישׁ יָשָׁ֣ר בְּ/עֵינָ֑י/ו וְ/תֹכֵ֖ן לִבּ֣וֹת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/002.yaml
  text: Every man's way is right in his own eyes[a], but Yahweh weighs hearts.
translation:
  language: hi
  text: मनुष्य का हर मार्ग उसकी अपनी दृष्टि में सही होता है, लेकिन याहवे[a] हृदयों को तौलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसका लिप्यन्तरण “याहवे” किया गया है।
    reason: divine_name
lexical_decisions:
- source_word: כָּל דֶּרֶךְ אִישׁ
  choice: मनुष्य का हर मार्ग
  rationale: 'כָּל यहाँ דֶּרֶךְ को व्यापक बनाता है: मनुष्य अपने प्रत्येक मार्ग या जीवन-आचरण को सही समझ सकता है। यह रूप हिब्रू की एकवचन, प्रतिनिधिक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।'
- source_word: יָשָׁר
  choice: सही
  rationale: सन्दर्भ में शब्द का अर्थ अपनी दृष्टि में उचित या ठीक ठहरना है; ‘सही’ इस आत्म-मूल्यांकन को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: בְּעֵינָיו
  choice: उसकी अपनी दृष्टि में
  rationale: शाब्दिक अर्थ ‘उसकी आँखों में’ है, पर यह हिब्रू मुहावरा व्यक्ति के अपने आकलन को दर्शाता है। ‘अपनी’ आत्म-सन्दर्भ को स्पष्ट करता है।
- source_word: וְתֹכֵן
  choice: लेकिन … तौलता है
  rationale: וְ यहाँ पहले कथन के विपरीत परमेश्वर के निर्णायक आकलन को सामने लाता है। תכן जाँचने या मापने के साथ तौलने का रूपक रखता है, जिसे हिन्दी में सुरक्षित रखा गया है।
- source_word: לִבּוֹת
  choice: हृदयों
  rationale: हिब्रू में ‘हृदय’ विचारों, इच्छाओं और उद्देश्यों सहित भीतरी मनुष्य को दर्शाता है। बहुवचन और बाइबलीय रूपक दोनों सुरक्षित रखे गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। इसे किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण ‘याहवे’ दिया गया है।
theological_decisions:
- issue: मानवीय आत्म-मूल्यांकन और याहवे के आकलन का विरोध
  choice: मनुष्य अपने मार्ग को सही मानता है, लेकिन याहवे हृदयों को तौलता है
  alternative: मनुष्य का मार्ग वस्तुतः सही है, और याहवे केवल उसके मनोभाव देखता है
  rationale: पहली पंक्ति में ‘उसकी अपनी दृष्टि में’ कथन को व्यक्तिनिष्ठ बनाता है; दूसरी पंक्ति याहवे के गहरे आकलन को उसके सामने रखती है। अनुवाद यह घोषित नहीं करता कि हर मानवीय मार्ग वास्तव में सही है।
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: स्रोत में व्यक्तिगत वाचा-नाम है, सामान्य उपाधि नहीं। लिप्यन्तरण मूल की विशिष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग’, ‘दृष्टि’ और ‘हृदयों को तौलता है’ जैसे ज्ञान-साहित्य के प्रमुख रूपकों को बनाए रखते हुए वाक्य को स्वाभाविक हिन्दी क्रम दिया गया है।
