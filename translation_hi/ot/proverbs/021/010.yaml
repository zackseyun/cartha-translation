source:
  edition: WLC
  text: נֶ֣פֶשׁ רָ֭שָׁע אִוְּתָה רָ֑ע לֹא יֻחַ֖ן בְּ/עֵינָ֣י/ו רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/021/010.yaml
  text: The soul of the wicked desires evil[b][a]; his neighbor finds no favor in his eyes.
translation:
  language: hi
  text: 'दुष्ट का मन बुराई की लालसा करता है;

    उसकी नज़रों में उसका पड़ोसी[a] कोई कृपा नहीं पाता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका मित्र” अथवा “उसका साथी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: मन
  rationale: यहाँ נֶפֶשׁ व्यक्ति के भीतर की इच्छा और अभिलाषा के केंद्र को दर्शाता है। आधुनिक हिन्दी में ‘मन’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है; ‘प्राण’ या ‘आत्मा’ यहाँ भ्रामक धार्मिक अथवा अस्तित्वगत अर्थ दे सकते हैं।
- source_word: רָשָׁע
  choice: दुष्ट
  rationale: यह विशेषण संज्ञा की तरह प्रयुक्त होकर प्रतिनिधि रूप में दुष्ट व्यक्ति को सूचित करता है। ‘दुष्ट’ हिन्दी नीतिवचन की शैली में संक्षिप्त और स्वाभाविक है।
- source_word: אִוְּתָה
  choice: लालसा करता है
  rationale: क्रिया प्रबल इच्छा या चाह व्यक्त करती है। ‘लालसा करता है’ इसकी तीव्रता को ‘चाहता है’ से अधिक स्पष्ट करता है, पर अनावश्यक अतिशयोक्ति नहीं करता।
- source_word: רָע
  choice: बुराई
  rationale: नीतिवचन के नैतिक संदर्भ में רָע का आशय केवल हानि या विपत्ति नहीं, बल्कि नैतिक बुराई है।
- source_word: יֻחַן
  choice: कोई दया नहीं होती
  rationale: חנן के होफाल रूप का आशय कृपा, अनुग्रह या दयालु व्यवहार पाए जाने से है। नकार के साथ यह बताता है कि पड़ोसी को उससे दया या कृपा नहीं मिलती। सहज हिन्दी के लिए कथन को ‘के लिए कोई दया नहीं होती’ रूप में रखा गया है।
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह ‘उसकी आँखों में’ का हिब्रू मुहावरा है और दुष्ट व्यक्ति के मूल्यांकन या रवैये को दर्शाता है। ‘उसकी दृष्टि में’ हिन्दी में मुहावरे का अर्थ और चित्रात्मकता दोनों बनाए रखता है।
- source_word: רֵעֵהוּ
  choice: उसके पड़ोसी
  rationale: רֵעַ के अर्थ-क्षेत्र में पड़ोसी, साथी और मित्र शामिल हैं। यहाँ सामाजिक-नैतिक संदर्भ में ‘पड़ोसी’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
