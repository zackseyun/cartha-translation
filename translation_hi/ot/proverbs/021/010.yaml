translation_notes:
  register: भाषा आधुनिक, सहज और नीतिवचन के अनुरूप संक्षिप्त रखी गई है। ‘मन’ इच्छा-केंद्र का स्वाभाविक हिन्दी बोध देता है। दूसरी पंक्ति में हिब्रू ‘उसकी आँखों में’ को ‘उसकी दृष्टि में’ कहा गया है, और חנן के भाव को ‘दया’ से व्यक्त किया गया है।
