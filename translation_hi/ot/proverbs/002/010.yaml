source:
  edition: WLC
  text: כִּֽי תָב֣וֹא חָכְמָ֣ה בְ/לִבֶּ֑/ךָ וְ֝/דַ֗עַת לְֽ/נַפְשְׁ/ךָ֥ יִנְעָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/010.yaml
  text: For wisdom will enter your heart[b][a], and knowledge will be pleasant to your soul.
translation:
  language: hi
  text: क्योंकि[a] बुद्धि तुम्हारे हृदय में प्रवेश करेगी, और ज्ञान तुम्हारे प्राण[b] को सुखद लगेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब बुद्धि तुम्हारे हृदय में प्रवेश करेगी।”
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार “व्यक्ति,” “स्वयं” या “जीवन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत कर सकता है; इसलिए ‘क्योंकि’ स्वाभाविक है। प्रसंग में कालवाचक ‘जब’ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: תָבוֹא
  choice: प्रवेश करेगी
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है। בְלִבֶּךָ के साथ ‘हृदय में प्रवेश करेगी’ हिन्दी में स्पष्ट और मूल रूपक के अनुरूप है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में חָכְמָה के लिए ‘बुद्धि’ प्रचलित, सहज और विषयगत रूप से उपयुक्त शब्द है।
- source_word: בְלִבֶּךָ
  choice: तुम्हारे हृदय में
  rationale: ‘हृदय’ इब्रानी में विचार, इच्छा और भीतरी व्यक्तित्व को समेटता है; इसे ‘मन’ तक सीमित न करके मूल बिंब बनाए रखा गया है।
- source_word: וְדַעַת
  choice: और ज्ञान
  rationale: דַּעַת का सीधा अर्थ ‘ज्ञान’ है और यह बुद्धि-साहित्य की निकटवर्ती, पर अलग, संकल्पनाओं का भेद बनाए रखता है।
- source_word: לְנַפְשְׁךָ
  choice: तुम्हारे प्राण को
  rationale: נֶפֶשׁ व्यक्ति, जीवन या भीतरी अस्तित्व का बोध करा सकता है। ‘प्राण’ मूल की मानव-सम्बन्धी और काव्यात्मक गहराई बनाए रखता है; अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: יִנְעָם
  choice: सुखद लगेगा
  rationale: נעם सुखद, मधुर या मनभावन होने का बोध देता है। ‘सुखद लगेगा’ हिन्दी में स्वाभाविक रहते हुए विधेयात्मक अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: לֵב और נֶפֶשׁ में इब्रानी मानव-दृष्टि
  choice: मुख्य पाठ में ‘हृदय’ और ‘प्राण’ बनाए रखना
  alternative: ‘मन’ और ‘स्वयं/जीवन’
  rationale: मूल पाठ भीतरी मनुष्य के लिए परस्पर सम्बद्ध किन्तु समानार्थी न होने वाले शब्दों का प्रयोग करता है। ‘हृदय’ और ‘प्राण’ साहित्यिक तथा धर्मवैचारिक तनाव को बनाए रखते हैं, बिना इन शब्दों को किसी बाद की व्यवस्थित आत्मा-देह धारणा में सीमित किए।
- issue: כִּי का तर्कवाचक या कालवाचक अर्थ
  choice: मुख्य पाठ में ‘क्योंकि’
  alternative: ‘जब बुद्धि तुम्हारे हृदय में प्रवेश करेगी’
  rationale: पूर्ववर्ती उपदेश और प्रतिज्ञा के क्रम में इसे कारण या स्पष्टीकरण मानना उचित है, पर कालवाचक अर्थ भी व्याकरण और प्रसंग की दृष्टि से वास्तविक संभावना है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। एकवचन सम्बोधन के लिए सम्मानसूचक बहुवचन से बचते हुए ‘तुम्हारे’ चुना गया है, जिससे मूल का व्यक्तिगत सम्बोधन स्वाभाविक हिन्दी में बना रहता है।
