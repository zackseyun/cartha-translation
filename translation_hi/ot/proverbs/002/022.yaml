id: PRO.2.22
reference: Proverbs 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ֭/רְשָׁעִים מֵ/אֶ֣רֶץ יִכָּרֵ֑תוּ וּ֝/בוֹגְדִ֗ים יִסְּח֥וּ מִמֶּֽ/נָּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/022.yaml
  text: But the wicked will be cut off from the land[b][a], and the treacherous will be uprooted from it.
translation:
  language: hi
  text: पर दुष्ट लोग देश[a] में से काट डाले जाएँगे, और विश्वासघाती उसमें से उखाड़ दिए जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी’। इब्रानी शब्द אֶרֶץ के दोनों अर्थ हो सकते हैं; यहाँ पिछले पद में सीधे-सच्चे लोगों के उसमें बने रहने के विपरीत होने के कारण ‘देश’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘खींचकर निकाल दिए जाएँगे’। इब्रानी क्रिया बलपूर्वक हटा दिए जाने का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְשָׁעִים
  choice: दुष्ट लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में नैतिक रूप से दुष्ट व्यक्तियों के वर्ग को दर्शाता है; आधुनिक हिन्दी में ‘दुष्ट लोग’ स्पष्ट और स्वाभाविक है।
- source_word: מֵאֶרֶץ
  choice: देश में से
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है। पद 21 में उसी स्थान पर सीधे-सच्चे लोगों के बने रहने के विपरीत यहाँ निकाले जाने की बात है, इसलिए ‘देश’ प्रसंग के अनुकूल है।
- source_word: יִכָּרֵתוּ
  choice: काट डाले जाएँगे
  rationale: כרת के निफ़अल रूप में काटकर अलग कर दिए जाने अथवा निष्कासित किए जाने का बल है; यह अनुवाद मूल रूपक और कठोर परिणाम दोनों को बनाए रखता है।
- source_word: בוֹגְדִים
  choice: विश्वासघाती
  rationale: בגד का कृदन्त उन लोगों को दर्शाता है जो विश्वास तोड़ते या छलपूर्वक व्यवहार करते हैं; ‘विश्वासघाती’ इस स्थायी चरित्र को संक्षेप में व्यक्त करता है।
- source_word: יִסְּחוּ
  choice: उखाड़ दिए जाएँगे
  rationale: נסח बलपूर्वक खींचकर हटा देने का भाव देता है। ‘उखाड़ दिए जाएँगे’ देश से पूरी तरह हटाए जाने की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग एकवचन प्रत्यय אֶרֶץ की ओर लौटता है; हिन्दी में ‘उसमें से’ पूर्वोक्त देश को स्पष्ट रूप से संदर्भित करता है।
- source_word: וְ
  choice: पर ... और ...
  rationale: आरम्भिक संयोजक पद 21 के साथ विरोध दिखाता है, इसलिए ‘पर’; दूसरा संयोजक समानांतर कथनों को जोड़ता है, इसलिए ‘और’।
theological_decisions:
- issue: नीतिवचन के प्रसंग में אֶרֶץ का अर्थ
  choice: देश
  alternative: पृथ्वी
  rationale: पद 21–22 में सीधे-सच्चे लोगों के देश में बसे रहने और दुष्टों के उसमें से हटा दिए जाने का सीधा विरोध है। ‘देश’ इस साहित्यिक तनाव को बनाए रखता है और अनावश्यक रूप से सार्वभौमिक अन्तकालीन दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर काव्य-रचना तथा ‘काट डाले जाने/उखाड़ दिए जाने’ के सशक्त रूपक सुरक्षित हैं।
