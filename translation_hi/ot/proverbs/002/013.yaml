source:
  edition: WLC
  text: הַ֭/עֹ֣זְבִים אָרְח֣וֹת יֹ֑שֶׁר לָ֝/לֶ֗כֶת בְּ/דַרְכֵי חֹֽשֶׁךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/013.yaml
  text: who abandon the paths of uprightness to walk in the ways of darkness,[a]
translation:
  language: hi
  text: जो सीधाई के मार्गों को छोड़कर अन्धकार के रास्तों पर चलते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उचित मार्गों को छोड़कर अन्धकार के रास्तों पर चलते हैं।”
    reason: יֹשֶׁר के ‘सीधाई’ और ‘जो उचित है’—इन निकट अर्थों को दर्शाने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: הָעֹזְבִים
  choice: जो ... छोड़कर
  rationale: यह कृदन्त यहाँ संज्ञा की तरह उन लोगों का वर्णन करता है जिनकी चर्चा पिछले पद से चल रही है। ‘छोड़कर’ जान-बूझकर त्यागने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרְחוֹת
  choice: मार्गों
  rationale: यह बुद्धि-साहित्य में जीवन की दिशा या आचरण के लिए प्रयुक्त रूपक है; ‘मार्गों’ से वह रूपक बना रहता है।
- source_word: יֹשֶׁר
  choice: सीधाई
  rationale: यह शब्द नैतिक सीधेपन और उचित आचरण को सूचित करता है। ‘सीधाई’ मार्ग के रूपक और नैतिक अर्थ—दोनों को बनाए रखती है।
- source_word: לָלֶכֶת
  choice: चलते हैं
  rationale: הלך यहाँ आचरण के रूपक के रूप में प्रयुक्त है। हिन्दी में ‘चलना’ जीवन-व्यवहार की दिशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּדַרְכֵי
  choice: रास्तों पर
  rationale: बहुवचन रूप जीवन और आचरण के तरीकों का रूपक है। ‘पर’ हिन्दी में रास्ते पर चलने के साथ अधिक स्वाभाविक है।
- source_word: חֹשֶׁךְ
  choice: अन्धकार
  rationale: ‘अन्धकार’ मूल बिम्ब को बनाए रखता है और नैतिक अर्थ को सीधे ‘बुराई’ कहकर सीमित नहीं करता।
theological_decisions:
- issue: अन्धकार का नैतिक रूपक
  choice: मुख्य पाठ में ‘अन्धकार’ रखा गया है और उसे स्पष्ट करके ‘बुराई’ नहीं बनाया गया।
  alternative: बुराई / दुष्टता
  rationale: इब्रानी बिम्ब स्वयं नैतिक भटकाव का संकेत देता है। ‘बुराई’ कहना अनुवाद से आगे बढ़कर उसकी व्याख्या करना होता और मूल की रूपकात्मक व्यापकता घट जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘मार्गों’ और ‘रास्तों’ की विविधता मूल के אָרְחוֹת और דַרְכֵי के समानान्तर, किंतु अलग, शब्दों को दर्शाती है; ‘चलते हैं’ हिन्दी वाक्य में उद्देश्य और परिणामी आचरण—दोनों को स्वाभाविक रूप से व्यक्त करता है।
