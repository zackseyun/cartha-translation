  terminology: ‘मार्गों’ / ‘रास्तों’ appropriately reflects the two related but distinct Hebrew path terms without forcing an artificial distinction. ‘अन्धकार’ is standard, elevated Hindi and faithfully leaves the moral metaphor implicit. The footnote supplies a defensible lexical alternative for יֹשֶׁר.
