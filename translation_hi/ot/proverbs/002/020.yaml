source:
  edition: WLC
  text: לְמַ֗עַן תֵּ֭לֵךְ בְּ/דֶ֣רֶךְ טוֹבִ֑ים וְ/אָרְח֖וֹת צַדִּיקִ֣ים תִּשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/020.yaml
  text: so that you may walk in the way of the good and keep to the paths of the righteous[a][b].
translation:
  language: hi
  text: ताकि तुम भले लोगों के मार्ग पर चलो और धर्मियों के पथों पर बने रहो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मियों के पथों की रक्षा करो।” इब्रानी क्रिया का अर्थ “बने रहना,” “रक्षा करना,” या “पालन करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह पहले कही गई शिक्षा के उद्देश्य या अपेक्षित परिणाम को व्यक्त करता है; आधुनिक हिन्दी में ‘ताकि’ स्वाभाविक और संक्षिप्त है।
- source_word: תֵּלֵךְ
  choice: तुम ... चलो
  rationale: לְמַעַן के बाद प्रयुक्त अपूर्ण क्रिया उद्देश्य/अपेक्षित परिणाम बताती है; हिन्दी में ‘ताकि तुम ... चलो’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּדֶרֶךְ
  choice: मार्ग पर
  rationale: דֶּרֶךְ वास्तविक रास्ते और रूपकात्मक जीवन-रीति दोनों को सूचित कर सकता है; ‘मार्ग पर चलना’ हिन्दी में रूपक को बनाए रखता है।
- source_word: טוֹבִים
  choice: भले लोगों
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में लोगों के एक नैतिक वर्ग को दर्शाता है; ‘भले लोगों’ से अर्थ स्पष्ट और सहज रहता है।
- source_word: וְאָרְחוֹת
  choice: और ... पथों
  rationale: बहुवचन शब्द जीवन की राहों या चाल-चलन के मार्गों के लिए प्रयुक्त है; ‘पथ’ पहले खंड के ‘मार्ग’ के साथ काव्यात्मक समानांतरता और शब्दगत भिन्नता दोनों रखता है।
- source_word: צַדִּיקִים
  choice: धर्मियों
  rationale: यह संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण है और नैतिक रूप से सही लोगों को दर्शाता है; ‘धर्मी’ बाइबिलीय हिन्दी में स्थापित और बोधगम्य है।
- source_word: תִּשְׁמֹר
  choice: पर बने रहो
  rationale: שׁמר का अर्थ रखना, रक्षा करना या पालन करना हो सकता है। ‘पथों’ के साथ यहाँ उन पर टिके रहने/उनका अनुसरण करते रहने का भाव प्रसंग और समानांतर क्रिया ‘चलो’ के अनुकूल है।
