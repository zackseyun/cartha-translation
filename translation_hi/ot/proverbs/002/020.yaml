  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक समानांतरता बनाए रखने वाला अनुवाद। ‘भले लोगों’ से טוֹבִים के व्यक्तिवाचक प्रयोग को स्पष्ट किया गया है; ‘मार्ग’ और ‘पथ’ मूल के दो अलग समानार्थी शब्दों को दर्शाते हैं।
