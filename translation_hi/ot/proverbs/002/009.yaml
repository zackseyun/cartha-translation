  text: Then you will understand righteousness and justice and equity[a], every good path.
translation:
  language: hi
  text: तब तू धार्मिकता, न्याय और सीधाई[a], हर अच्छे मार्ग को समझेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खरापन” या “नैतिक सीधापन”; इब्रानी शब्द מֵישָׁרִים उस बात पर बल देता है जो सीधी और नैतिक रूप से खरी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह काल-सूचक और क्रम-सूचक अव्यय पिछले पदों में कही गई शर्त के परिणाम को प्रस्तुत करता है।
- source_word: תָּבִין
  choice: तू...समझेगा
  rationale: בין का क़ाल अपूर्ण रूप समझने अथवा भेद पहचानने की भावी क्षमता व्यक्त करता है; एकवचन संबोधन को बनाए रखा गया है।
- source_word: צֶדֶק
  choice: धार्मिकता
  rationale: यह नैतिक रूप से सही होने और सही आचरण का बोध देता है तथा अगले शब्द מִשְׁפָּט से भिन्नता बनाए रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: यह उचित निर्णय, न्याय और सही व्यवस्था का अर्थ दे सकता है; यहाँ ‘न्याय’ स्वाभाविक और सटीक है।
- source_word: מֵישָׁרִים
  choice: निष्पक्षता
  rationale: सीधाई और नैतिक समता से निकला यह बहुवचन संज्ञा-रूप संदर्भ में निष्पक्ष और खरे व्यवहार को दर्शाता है; ‘निष्पक्षता’ आधुनिक पाठक के लिए सहज है।
- source_word: כָּל מַעְגַּל טוֹב
  choice: हर अच्छे मार्ग को
  rationale: מַעְגַּל जीवन के मार्ग या आचरण की दिशा का रूपक है; एकवचन के साथ כָּל का वितरणात्मक अर्थ ‘हर’ स्वाभाविक है।
theological_decisions:
- issue: अंतिम पदबंध כָּל מַעְגַּל טוֹב का पहले आए तीन नैतिक पदों से संबंध
  choice: 'इसे व्याख्यात्मक पुनर्निर्देशन के रूप में रखा गया है: ‘धार्मिकता, न्याय और निष्पक्षता को—हर अच्छे मार्ग को—समझेगा।’'
  alternative: 'इसे एक अलग अतिरिक्त कर्म के रूप में पढ़ा जा सकता है: ‘और हर अच्छे मार्ग को समझेगा।’'
  rationale: इब्रानी में כָּל से पहले संयोजक नहीं है। विराम-चिह्न अंतिम पदबंध को पहले के त्रिक का सार या विस्तार बनने देता है, पर अलग अतिरिक्त कर्म की संभावित समझ को पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। नीतिवचन के पिता-पुत्र संबोधन के अनुरूप एकवचन ‘तू’ बनाए रखा गया है; ‘धार्मिकता, न्याय और निष्पक्षता’ मूल के तीन निकट-संबद्ध किंतु भिन्न नैतिक शब्दों को अलग-अलग व्यक्त करते हैं।
