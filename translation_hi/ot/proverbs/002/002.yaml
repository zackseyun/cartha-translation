translation:
  language: hi
  text: बुद्धि की ओर अपना कान लगाते हुए, समझ की ओर अपना हृदय झुकाते हुए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַקְשִׁיב
  choice: कान लगाते हुए
  rationale: हिफ़ील infinitive में जानबूझकर ध्यान देने का भाव है। हिंदी मुहावरा ‘कान लगाना’ श्रवण-बिंब और सक्रिय तत्परता दोनों को स्वाभाविक रूप से व्यक्त करता है तथा पिछले पद पर इसकी व्याकरणिक निर्भरता बनाए रखता है।
- source_word: לַחָכְמָה
  choice: बुद्धि की ओर
  rationale: ל यहाँ ध्यान की दिशा अथवा लक्ष्य बताता है। ‘की ओर’ इस दिशात्मक संबंध को स्पष्ट रखता है।
- source_word: אָזְנֶךָ
  choice: अपना कान
  rationale: मूल इब्रानी में संज्ञा एकवचन और संबोधन द्वितीय पुरुष एकवचन पुल्लिंग है। ‘अपना कान’ उसी ठोस श्रवण-बिंब और वचन को बनाए रखता है।
- source_word: תַּטֶּה
  choice: झुकाते हुए
  rationale: נטה का अर्थ झुकाना, मोड़ना या लगाना हो सकता है। ‘झुकाते हुए’ पहले खंड के समानांतर इच्छापूर्वक उन्मुख होने का भाव रखता है।
- source_word: לִבְּךָ
  choice: अपना मन
  rationale: इब्रानी לֵב बुद्धि, इच्छा और अंतःकरण सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिंदी में समझ की ओर उन्मुख होने के संदर्भ में ‘मन’ इस व्यापक आंतरिक अर्थ को ‘हृदय’ से अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल बौद्धिक क्षमता तक सीमित किए।
- source_word: לַתְּבוּנָה
  choice: समझ की ओर
  rationale: תְּבוּנָה समझ, सूझ-बूझ या विवेक को दर्शाता है। ‘समझ’ सामान्य आधुनिक हिंदी में स्वाभाविक है और ‘बुद्धि’ के साथ नीतिवचन की समानांतर शब्दावली बनाए रखता है।
