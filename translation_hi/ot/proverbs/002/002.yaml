  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। दोनों समानांतर खंडों को कृदंतीय रूप ‘—ते हुए’ में रखा गया है, क्योंकि इब्रानी का पहला रूप पिछले पद की शर्तसूचक रचना पर निर्भर है और दूसरा उसी के समानांतर है। पदांत अल्पविराम अगले पद में जारी वाक्य को संकेत करता है।
