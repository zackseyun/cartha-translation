id: PRO.2.5
reference: Proverbs 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֗ז תָּ֭בִין יִרְאַ֣ת יְהוָ֑ה וְ/דַ֖עַת אֱלֹהִ֣ים תִּמְצָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/005.yaml
  text: Then you will understand the fear of Yahweh and find the knowledge of God[a].
translation:
  language: hi
  text: तब तुम याहवे का भय समझोगे और परमेश्वर का ज्ञान पाओगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह पिछले पदों में बताई गई खोज और प्रयत्न की शर्तों के परिणाम को समय और तर्क—दोनों की दृष्टि से जोड़ता है।
- source_word: תָּבִין
  choice: तुम ... समझोगे
  rationale: בין का क़ाल अपूर्ण, द्वितीय पुरुष एकवचन रूप समझने या परखने तक पहुँचने का भाव देता है; यहाँ ‘समझोगे’ स्वाभाविक और सटीक है।
- source_word: יִרְאַת יְהוָה
  choice: याहवे का भय
  rationale: यह रचनात्मक संबंध वाली पदावली है, जो याहवे के प्रति भय और श्रद्धा से भरे भाव को व्यक्त करती है। ‘भय’ मूल पद की तीव्रता और नीतिवचन की स्थापित धारणा को बनाए रखता है।
- source_word: וְדַעַת אֱלֹהִים
  choice: और परमेश्वर का ज्ञान
  rationale: ‘ज्ञान’ דעת का सीधा अर्थ है। हिन्दी की संबंधकारक रचना मूल इब्रानी की संक्षिप्तता बनाए रखती है और परमेश्वर को जानने के भाव को व्यक्त करती है।
- source_word: תִּמְצָא
  choice: पाओगे
  rationale: מצא का मूल अर्थ ‘पाना/ढूँढ़ पाना’ है। ‘पाओगे’ पिछले पदों की खोज-विषयक भाषा के परिणाम को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: יִרְאַת का भाव
  choice: भय
  alternative: श्रद्धा
  rationale: केवल ‘श्रद्धा’ कहने से मूल शब्द में निहित भय का पहलू कम हो सकता है। ‘भय’ यहाँ श्रद्धा, अधीनता और नैतिक गंभीरता से युक्त धार्मिक भय को खुला रखता है।
- issue: דַעַת אֱלֹהִים में संबंध
  choice: परमेश्वर का ज्ञान
  alternative: परमेश्वर को जानना
  rationale: शाब्दिक संबंधकारक रचना मूल की संक्षिप्तता और संभावित अर्थ-व्याप्ति को बनाए रखती है; अधिक व्याख्यात्मक विकल्प इसे केवल वस्तुगत अर्थ तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। समानांतर क्रियाओं ‘समझोगे’ और ‘पाओगे’ से इब्रानी काव्य-संरचना स्पष्ट रहती है। असमर्थित वैकल्पिक पाठ की पादटिप्पणी नहीं जोड़ी गई।
