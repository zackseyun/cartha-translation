source:
  edition: WLC
  text: לִ֭/נְצֹר אָרְח֣וֹת מִשְׁפָּ֑ט וְ/דֶ֖רֶךְ חסיד/ו יִשְׁמֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/008.yaml
  text: to guard the paths of justice[a], and he watches over the way of his faithful ones.
translation:
  language: hi
  text: 'न्याय के मार्गों की रक्षा करने के लिए,


    और वह अपने निष्ठावान जनों के मार्ग की रखवाली करता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִנְצֹר
  choice: रक्षा करने के लिए
  rationale: इनफ़िनिटिव रूप पिछले संदर्भ से उद्देश्य या परिणाम का संबंध रखता है। ‘रक्षा करना’ नצר के संरक्षणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרְחוֹת
  choice: मार्गों
  rationale: बहुवचन रूप को बनाए रखते हुए यह हिन्दी में जीवन-आचरण के रास्तों के रूपक के लिए स्वाभाविक है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: नीतिवचन में यह शब्द केवल न्यायिक निर्णय नहीं, बल्कि नैतिक रूप से उचित और न्यायपूर्ण आचरण को भी सूचित करता है।
- source_word: וְדֶרֶךְ
  choice: और ... मार्ग
  rationale: एकवचन रूप को बनाए रखा गया है। हिन्दी में ‘मार्ग’ की पुनरावृत्ति यहाँ समानांतर रचना को स्पष्ट और गरिमापूर्ण रखती है।
- source_word: חסידו
  choice: अपने निष्ठावान जन
  rationale: दिए गए WLC पाठ में शब्द एकवचन है और तीसरे पुरुष पुल्लिंग एकवचन संबंधसूचक प्रत्यय रखता है। ‘निष्ठावान जन’ वाचा-संबंधी वफादारी और भक्ति—दोनों की अर्थछाया को बिना किसी बाद की पारिभाषिक उपाधि के व्यक्त करता है; ‘अपने’ का प्रयोग परमेश्वर की ओर संकेत करने वाले निहित कर्ता के अनुसार है।
- source_word: יִשְׁמֹר
  choice: वह ... रखवाली करता है
  rationale: यह שׁמר के सुरक्षा और सतर्क देखभाल के भाव को व्यक्त करता है तथा पहली पंक्ति के ‘रक्षा’ शब्द की हूबहू पुनरावृत्ति से बचाता है।
theological_decisions:
- issue: יִשְׁמֹר का निहित कर्ता
  choice: ‘वह’ से परमेश्वर का संकेत
  alternative: अनिश्चित या सामान्य कर्ता
  rationale: नीतिवचन 2:6–8 में याहवे ही बुद्धि देने, खरी बुद्धि संचित रखने और ढाल होने वाला कर्ता है; इसलिए यहाँ उसी कर्ता की निरंतरता सबसे स्वाभाविक है। नाम को अनावश्यक रूप से जोड़ने के बजाय सर्वनाम रखा गया है।
- issue: חסידו की वचन-संख्या और अर्थ
  choice: एकवचन ‘अपने निष्ठावान जन’
  alternative: बहुवचन ‘अपने निष्ठावान जनों’ अथवा ‘अपने भक्तों’
  rationale: प्रस्तुत मूल-पाठ रूप חסידו एकवचन है, इसलिए अंग्रेज़ी परामर्श-पाठ के नवीन बहुवचन संशोधन को मुख्य हिन्दी पाठ में नहीं अपनाया गया। ‘निष्ठावान’ वफादारी को प्रमुखता देता है, जबकि पादटिप्पणी भक्ति की वैध अर्थछाया सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप चुना गया है। पद की आरंभिक उद्देश्य-सूचक अपूर्ण संरचना को पिछले पद से उसके संबंध के कारण बनाए रखा गया है।
