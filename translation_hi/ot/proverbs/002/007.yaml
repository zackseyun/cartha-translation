  text: ו/צפן לַ֭/יְשָׁרִים תּוּשִׁיָּ֑ה מָ֝גֵ֗ן לְ/הֹ֣לְכֵי תֹֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/007.yaml
  text: He stores up sound wisdom for the upright[b][a]; he is a shield to those who walk in integrity.
translation:
  language: hi
  text: वह सीधे-सच्चे लोगों के लिए खरी बुद्धि[a] संचित रखता है; वह खराई से चलने वालों की ढाल है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सही विवेक,” “व्यावहारिक बुद्धि” अथवा “सफलता की सामर्थ्य”; इब्रानी शब्द ऐसी कारगर बुद्धि को सूचित कर सकता है जो कुशलता और भलाई की ओर ले जाती है।
    reason: lexical_alternative
  - marker: b
    text: '“खराई” का अर्थ “निष्कपटता” या “पूर्णता” भी हो सकता है। इब्रानी की संक्षिप्त रचना को यह भी समझा जा सकता है: “खराई से चलने वालों के लिए वह ढाल संचित रखता है।”'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וְצָפַן
  choice: संचित रखता है
  rationale: यह क्रिया किसी मूल्यवान या उपयोगी वस्तु को सँभालकर रखने अथवा समय आने के लिए सुरक्षित रखने का भाव देती है।
- source_word: לַיְשָׁרִים
  choice: सीधे-सच्चे लोगों के लिए
  rationale: यह बहुवचन विशेषण नैतिक रूप से सीधे और ईमानदार लोगों को सूचित करता है; यह अभिव्यक्ति आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: תּוּשִׁיָּה
  choice: खरी बुद्धि
  rationale: इस शब्द में ठोस, कारगर बुद्धि, सही विवेक और उससे मिलने वाली सफलता या कुशलता के अर्थ समाए हैं। ‘खरी बुद्धि’ इसकी नैतिक विश्वसनीयता और व्यावहारिक प्रभावशीलता दोनों को संक्षेप में व्यक्त करती है।
- source_word: מָגֵן
  choice: ढाल
  rationale: मूल पाठ के ठोस सुरक्षा-रूपक को अमूर्त ‘रक्षा’ में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: לְהֹלְכֵי
  choice: जो ... चाल चलते हैं
  rationale: इब्रानी में चलना जीवन के नियमित आचरण का रूपक है; हिन्दी का ‘चाल चलना’ उस नैतिक जीवन-पद्धति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תֹם
  choice: खरी चाल
  rationale: תֹם संपूर्णता, निष्कपटता और नैतिक अखंडता का भाव रखता है। ‘खरी चाल’ इसे पापरहित होने के अतिरंजित दावे के बिना आचरण से जोड़ती है।
theological_decisions:
- issue: दोनों उपवाक्यों का संबंध और दूसरे उपवाक्य का कर्ता
  choice: दूसरे उपवाक्य में भी परमेश्वर को निहित कर्ता मानकर ‘वह ढाल है’ अनूदित किया गया है।
  alternative: इसे लुप्त क्रिया के साथ ‘खरी चाल चलने वालों के लिए ढाल संचित है’ समझा जा सकता है।
  rationale: संदर्भ में प्रभु की क्रिया जारी रहती है और यह पठन हिन्दी में समानांतर कथन को स्वाभाविक बनाता है; फिर भी इब्रानी की संक्षिप्त रचना के कारण वैकल्पिक व्याकरणिक संबंध को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ढाल’ और जीवन में ‘चलने’ के मूल रूपक बनाए रखे गए हैं; ‘सीधे-सच्चे’ तथा ‘खरी चाल’ नैतिक सीधाई और अखंडता को सहज हिन्दी में व्यक्त करते हैं।
