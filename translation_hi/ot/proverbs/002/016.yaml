  yaml_path: translation/ot/proverbs/002/016.yaml
  text: to rescue you from the strange woman[c][b][a], from the foreign woman whose words are smooth.
translation:
  language: hi
  text: तुझे पराई स्त्री[a] से बचाने के लिए—उस अजनबी स्त्री से, जो चिकनी-चुपड़ी बातें करती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपरिचित स्त्री”; नीतिवचन में यह अभिव्यक्ति प्रायः उचित वैवाहिक या नैतिक सीमा से बाहर की स्त्री को दर्शाती है, केवल दूसरी जाति या देश की स्त्री को नहीं।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “जो अपनी बातों को चिकना बनाती है”; अर्थात् जो लुभावनी या खुशामद-भरी बातें करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: तुझे ... से बचाने के लिए
  rationale: हिफ़ील क्रिया का उद्देश्यसूचक रूप और द्वितीय पुरुष एकवचन प्रत्यय सुरक्षित रहते हैं; ‘बचाना’ आधुनिक हिन्दी में संकट से छुड़ाने का स्वाभाविक शब्द है।
- source_word: אִשָּׁה זָרָה
  choice: पराई स्त्री
  rationale: ‘पराई’ मूल शब्द के ‘दूसरी/बाहरी’ होने के भाव को रखता है और नीतिवचन के प्रसंग में उचित वैवाहिक या नैतिक सीमा से बाहर की स्त्री का संकेत देता है, बिना हर प्रसंग में सीधे ‘व्यभिचारिणी’ कहे।
- source_word: נָכְרִיָּה
  choice: अजनबी स्त्री
  rationale: यह समानांतर पद बाहरी या अपरिचित स्त्री का भाव प्रकट करता है। ‘अजनबी’ जातीय विदेशीपन को अनिवार्य नहीं बनाता और पहले पद की पुनरुक्ति भी नहीं करता।
- source_word: אֲמָרֶיהָ הֶחֱלִיקָה
  choice: जो चिकनी-चुपड़ी बातें करती है
  rationale: इब्रानी में वह अपने शब्दों को ‘चिकना बनाती’ है। हिन्दी मुहावरा ‘चिकनी-चुपड़ी बातें’ उसी रूपक और खुशामदी, लुभावनी वाणी के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: स्त्री को जातीय रूप से विदेशी या नैतिक-संबंधात्मक रूप से पराई समझना
  choice: मुख्य पाठ में ‘पराई स्त्री’ और समानांतर रूप में ‘अजनबी स्त्री’
  alternative: ‘विदेशी स्त्री’ अथवा ‘वर्जित स्त्री’
  rationale: दोनों इब्रानी विशेषण बाहरीपन का अर्थ रखते हैं, पर इस प्रसंग में केवल जातीय पहचान निश्चित नहीं है। अनुवाद उस अस्पष्टता को बनाए रखता है और अनैतिकता के प्रकार को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की उद्देश्यसूचक, पिछले वाक्य पर निर्भर संरचना को ‘...के लिए’ से बनाए रखा गया है। समानांतर इब्रानी पदों को डैश और पुनरुक्त ‘उस ... स्त्री से’ के द्वारा एक ही स्त्री के दो वर्णनों के रूप में प्रस्तुत किया गया है।
