source:
  edition: WLC
  text: כִּֽי יְ֭הוָה יִתֵּ֣ן חָכְמָ֑ה מִ֝/פִּ֗י/ו דַּ֣עַת וּ/תְבוּנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/006.yaml
  text: For Yahweh gives wisdom[c][b][a]; from his mouth come knowledge and understanding.
translation:
  language: hi
  text: क्योंकि याहवे बुद्धि देता है; उसके मुँह से ज्ञान और समझ निकलते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण बताता है; हिन्दी में पद के आरम्भ में ‘क्योंकि’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ इसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- source_word: יִתֵּן
  choice: देता है
  rationale: अपूर्ण क्रिया यहाँ नीतिवचन की सामान्य, सदा लागू होने वाली सच्चाई व्यक्त करती है, इसलिए वर्तमान काल उपयुक्त है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में חָכְמָה का स्वाभाविक और स्थापित हिन्दी प्रतिशब्द है।
- source_word: מִפִּיו
  choice: उसी के मुँह से ... निकलते हैं
  rationale: ‘उसके मुँह से’ की मूल उपमा सुरक्षित रखते हुए हिन्दी वाक्य के लिए आवश्यक क्रिया जोड़ी गई है; बल स्पष्ट करने के लिए ‘उसी’ प्रयोग हुआ है।
- source_word: דַּעַת
  choice: ज्ञान
  rationale: यह सीधा और प्रचलित अर्थ है तथा अगले पद ‘समझ’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: וּתְבוּנָה
  choice: और समझ
  rationale: תְבוּנָה का अर्थ समझ या विवेक हो सकता है; यहाँ ‘समझ’ सरल, व्यापक और प्रसंगानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में प्रयुक्त व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण द्वारा रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर संरचना तथा ‘मुँह से’ की ठोस वाणी-संबंधी उपमा सुरक्षित है; किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
