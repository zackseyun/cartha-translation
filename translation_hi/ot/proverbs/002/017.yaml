  yaml_path: translation/ot/proverbs/002/017.yaml
  text: who abandons the companion of her youth and forgets the covenant of her God[a][b].
translation:
  language: hi
  text: 'जो अपनी जवानी के साथी[a] को छोड़ देती है,

    और अपने परमेश्वर की वाचा[b] को भूल जाती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी जवानी के पति।’ इब्रानी शब्द किसी घनिष्ठ साथी को सूचित कर सकता है और यहाँ संभवतः उसके वैवाहिक साथी के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने परमेश्वर की वाचा’ से संभवतः परमेश्वर के अधिकार या साक्षी में बाँधी गई विवाह-वाचा अभिप्रेत है; फिर भी यह परमेश्वर के प्रति उसके व्यापक वाचागत दायित्व की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֹזֶבֶת
  choice: जो ... छोड़ देती है
  rationale: स्त्रीलिंग एकवचन कृदंत उस स्त्री का चरित्र बताता है जिसका उल्लेख पिछले संदर्भ में है। ‘छोड़ देती है’ आधुनिक और स्वाभाविक हिंदी में त्यागने का भाव व्यक्त करता है।
- source_word: אַלּוּף
  choice: साथी
  rationale: यह शब्द घनिष्ठ संगी या साथी को सूचित कर सकता है। इस प्रसंग में ‘अपनी जवानी के’ और वाचा की समानांतर पंक्ति वैवाहिक साथी की ओर संकेत करती है, पर ‘साथी’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: נְעוּרֶיהָ
  choice: अपनी जवानी के
  rationale: तीसरे पुरुष स्त्रीलिंग संबंधसूचक प्रत्यय को हिंदी में आत्मवाचक ‘अपनी’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: בְּרִית
  choice: वाचा
  rationale: ‘वाचा’ इस औपचारिक और धर्मवैचारिक रूप से महत्त्वपूर्ण संबंधसूचक शब्द का भार बनाए रखती है।
- source_word: אֱלֹהֶיהָ
  choice: अपने परमेश्वर की
  rationale: मूल के स्त्रीलिंग संबंधसूचक प्रत्यय को ‘अपने’ द्वारा स्पष्ट रखा गया है और व्यक्तिगत उत्तरदायित्व भी व्यक्त होता है।
- source_word: שָׁכֵחָה
  choice: भूल जाती है
  rationale: इब्रानी पूर्ण क्रिया को नीतिवचन के सामान्य चरित्र-वर्णन में हिंदी के सामान्य वर्तमान से प्रस्तुत किया गया है; प्रसंग में यह केवल स्मृति-भ्रंश नहीं, बल्कि वाचा की उपेक्षा भी सूचित करता है।
theological_decisions:
- issue: क्या בְּרִית אֱלֹהֶיהָ विशेष रूप से परमेश्वर के सामने की गई विवाह-वाचा है या परमेश्वर के प्रति व्यापक वाचागत दायित्व?
  choice: अपने परमेश्वर की वाचा
  alternative: परमेश्वर के सामने की गई अपनी विवाह-वाचा
  rationale: पहली पंक्ति में जवानी के साथी का उल्लेख विवाह-वाचा की प्रबल संभावना दिखाता है, लेकिन मूल अभिव्यक्ति शाब्दिक रूप से ‘उसके परमेश्वर की वाचा’ है। मुख्य पाठ व्यापक अभिव्यक्ति और धर्मवैचारिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य से जुड़ा संबंधवाचक उपवाक्य है, इसलिए आरंभ ‘जो’ से किया गया है। ‘साथी’ और ‘वाचा’ मूल की अर्थगत व्यापकता तथा वैवाहिक संकेत दोनों को सुरक्षित रखते हैं।
