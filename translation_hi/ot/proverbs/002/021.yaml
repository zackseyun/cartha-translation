  text: כִּֽי יְשָׁרִ֥ים יִשְׁכְּנוּ אָ֑רֶץ וּ֝/תְמִימִ֗ים יִוָּ֥תְרוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/021.yaml
  text: For the upright will dwell in the land[a], and the blameless will remain in it.
translation:
  language: hi
  text: क्योंकि सच्चरित्र लोग भूमि[a] में बसेंगे, और निर्दोष लोग उसी में बने रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी।’ इब्रानी शब्द אָרֶץ का अर्थ ‘भूमि’ या ‘पृथ्वी’ हो सकता है। यहाँ निवास करने और वहाँ से हटाए जाने के संदर्भ के कारण ‘भूमि’ चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार या कारण बताता है; इसलिए आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक तार्किक संबंध व्यक्त करता है।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोग
  rationale: शब्द नैतिक रूप से सीधे और सत्यनिष्ठ लोगों को दर्शाता है। ‘सीधे-सच्चे’ सामान्य पाठक के लिए सहज है और इसे अधिक विशिष्ट धार्मिक पदावली में सीमित नहीं करता।
- source_word: יִשְׁכְּנוּ
  choice: बसे रहेंगे
  rationale: שׁכן स्थायी निवास या बसने का भाव रखता है। ‘बसे रहेंगे’ निवास और निरंतरता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָרֶץ
  choice: देश
  rationale: אָרֶץ का अर्थ ‘देश/भूमि’ अथवा ‘पृथ्वी’ हो सकता है। अगले पद में वहाँ से उखाड़े जाने के विरोध के कारण यहाँ निवास-स्थान के अर्थ में ‘देश’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּתְמִימִים
  choice: निर्दोष लोग
  rationale: תמים यहाँ चरित्र की अखंडता और दोषरहित चाल को सूचित करता है। ‘निर्दोष’ स्पष्ट, गरिमापूर्ण और समानांतर पंक्ति के अनुकूल है।
- source_word: יִוָּתְרוּ
  choice: बने रहेंगे
  rationale: יתר के निफ़ाल रूप का अर्थ बचे रहना या शेष रहना है। ‘बने रहेंगे’ उसी स्थान में निरंतर उपस्थित रहने का भाव सहज हिन्दी में देता है।
- source_word: בָהּ
  choice: उसमें
  rationale: स्त्रीलिंग प्रत्यय पहले आए אָרֶץ की ओर संकेत करता है; ‘उसमें’ इस संबंध को संक्षेप और स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: אָרֶץ का दायरा
  choice: देश
  alternative: पृथ्वी
  rationale: संदर्भ में निवास करने और अगले पद में वहाँ से उखाड़े जाने का विरोध है, इसलिए ‘देश’ ठोस निवास-स्थान का अर्थ बेहतर व्यक्त करता है। फिर भी इब्रानी शब्द व्यापक रूप से ‘पृथ्वी’ भी दर्शा सकता है; अतः इस संभावना को पादटिप्पणी में रखा गया है और किसी संकीर्ण भूक्षेत्र-संबंधी सिद्धांत को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण नीतिवचन-शैली। समानांतरता बनाए रखने के लिए ‘बसे रहेंगे’ और ‘बने रहेंगे’ का प्रयोग किया गया है।
