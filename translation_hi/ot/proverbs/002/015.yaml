translation:
  language: hi
  text: 'जिनके रास्ते टेढ़े हैं[a],

    और जो अपनी राहों में कुटिल हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनकी राहें टेढ़ी हैं और जो अपनी पगडंडियों में कुटिल हैं।”
    reason: शब्दार्थिक विकल्प; אָרְחֹתֵיהֶם और מַעְגְּלוֹתָם दोनों के लिए ‘राह/पगडंडी’ जैसे निकटवर्ती मार्ग-संबंधी शब्द संभव हैं।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिनके
  rationale: यह संबंधवाचक अव्यय पिछले पद के बहुवचन व्यक्तियों से जोड़ता है; अगले पदबंध में आए संबंधसूचक रूप के कारण ‘जिनके’ स्वाभाविक है।
- source_word: אָרְחֹתֵיהֶם
  choice: रास्ते
  rationale: אֹרַח वास्तविक मार्ग और जीवन-चाल दोनों का बिंब रखता है; ‘रास्ते’ इस ठोस रूपक और नैतिक आशय को सहज हिंदी में बनाए रखता है।
- source_word: עִקְּשִׁים
  choice: टेढ़े
  rationale: यह शब्द मुड़े हुए तथा नैतिक रूप से विकृत होने, दोनों का बोध करा सकता है; ‘टेढ़े’ मार्ग-बिंब और नैतिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: וּנְלוֹזִים
  choice: भटके हुए
  rationale: मूल धातु सीधे मार्ग से हटने या मुड़ जाने का भाव देती है; ‘भटके हुए’ विचलन को व्यक्त करता है, बिना इसे केवल छल-कपट के अर्थ तक सीमित किए।
- source_word: בְּמַעְגְּלוֹתָם
  choice: अपनी राहों में
  rationale: מַעְגָּל पगडंडी, मार्ग या जीवन-चाल को सूचित करता है; ‘राहों’ पहले अर्धांश के समानांतर मार्ग-बिंब को स्वाभाविक हिंदी में बनाए रखता है।
