lexical_decisions:
- source_word: מְזִמָּה
  choice: विवेक
  rationale: नीतिवचन के इस सकारात्मक ज्ञान-संदर्भ में यह सोच-समझकर निर्णय लेने और सावधान योजना बनाने की क्षमता को दर्शाता है; ‘विवेक’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: תִּשְׁמֹר עָלֶיךָ
  choice: तेरी देखभाल करेगा
  rationale: שׁמר के साथ עַל यहाँ सुरक्षात्मक निगरानी का भाव देता है। ‘देखभाल करेगा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है और अगली समानांतर क्रिया से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: תְּבוּנָה
  choice: समझ
  rationale: यह नीतिवचन का प्रमुख ज्ञान-संबंधी शब्द है, जिसका आशय सही भेद करने की क्षमता से है; ‘समझ’ साधारण पाठक के लिए सहज है।
- source_word: תִנְצְרֶכָּה
  choice: तेरी रक्षा करेगी
  rationale: נצר का अर्थ संभालकर रखना, पहरा देना या सुरक्षित रखना है; ‘रक्षा करेगी’ समानांतर पंक्ति के सुरक्षात्मक आशय को स्पष्ट रखता है।
