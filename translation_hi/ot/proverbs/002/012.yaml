  text: לְ֭/הַצִּ֣ילְ/ךָ מִ/דֶּ֣רֶךְ רָ֑ע מֵ֝/אִ֗ישׁ מְדַבֵּ֥ר תַּהְפֻּכֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/012.yaml
  text: to deliver you from the evil way[a], from the man who speaks perverse things,
translation:
  language: hi
  text: 'ताकि वह तुम्हें बुराई के मार्ग से,

    और उस पुरुष से जो कुटिल बातें बोलता है, बचाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַצִּילְךָ
  choice: तुम्हें ... बचाए
  rationale: नצל के हिफ़ील रूप में यहाँ उद्देश्य या परिणाम का भाव है। ‘बचाए’ सुरक्षा और छुड़ाने, दोनों का स्वाभाविक हिन्दी भाव देता है।
- source_word: מִדֶּרֶךְ רָע
  choice: बुराई के मार्ग से
  rationale: דֶּרֶךְ नीतिवचन में जीवन-आचरण के मार्ग का रूपक है; רָע उसके नैतिक रूप से बुरे चरित्र को बताता है। यह पदबंध स्रोत की संज्ञात्मक रचना को बनाए रखता है।
- source_word: מֵאִישׁ
  choice: पुरुष से
  rationale: אִישׁ एकवचन पुल्लिंग है; ‘पुरुष’ आधुनिक मानक हिन्दी में स्रोत के लिंग-संकेत को स्पष्ट रूप से बनाए रखता है।
- source_word: מְדַבֵּר
  choice: बोलनेवाले
  rationale: कृदन्त उस पुरुष की विशेषता बताता है; हिन्दी में संबंधसूचक कृदन्त स्वाभाविक है।
- source_word: תַּהְפֻּכוֹת
  choice: उलटी-सीधी बातें
  rationale: बहुवचन संज्ञा विकृत, टेढ़ी या सत्य को उलटनेवाली बातों का संकेत करती है। यह चयन बोलचाल में समझने योग्य रहते हुए वाणी की नैतिक विकृति व्यक्त करता है।
theological_decisions:
- issue: אִישׁ का लिंग-सूचक अनुवाद
  choice: पुरुष से
  alternative: व्यक्ति से / मनुष्य से
  rationale: इब्रानी शब्द यहाँ व्याकरणतः पुल्लिंग एकवचन है और एक प्रकार के दुष्ट पुरुष का प्रतिनिधित्व करता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: תַּהְפֻּכוֹת में विकृति का स्वरूप
  choice: उलटी-सीधी बातें
  alternative: टेढ़ी बातें / विकृत बातें
  rationale: मूल शब्द में टेढ़ेपन, उलटाव और विकृति का अर्थक्षेत्र है। किसी विशेष प्रकार के झूठ या धर्मशास्त्रीय विद्रोह तक अर्थ को सीमित किए बिना व्यापक तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद को पूर्ववर्ती वाक्य से जुड़े उद्देश्यवाचक खंड के रूप में ‘ताकि’ से आरम्भ किया गया है। ‘बुराई के मार्ग’ से नीतिवचन का नैतिक मार्ग-रूपक सुरक्षित रहता है।
