translation:
  language: hi
  text: 'जो बुराई करने में आनन्दित होते हैं,

    और बुराई की कुटिलताओं में हर्ष मनाते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׂמֵחִים
  choice: जो ... आनन्दित होते हैं
  rationale: कृदन्त का चरित्र-वर्णन करने वाला बल बनाए रखता है और שמח के उल्लास को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: करने में
  rationale: עשה के सामान्य अर्थ ‘करना’ को बिना आदतन अभ्यास या अपराध करने का अतिरिक्त भाव जोड़े सीधे व्यक्त करता है।
- source_word: רָע
  choice: बुराई
  rationale: नीतिवचन के नैतिक संदर्भ में רָע की नैतिक बुराई को स्पष्ट और सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: יָגִילוּ
  choice: हर्ष मनाते हैं
  rationale: גיל के प्रबल उल्लास को व्यक्त करता है और पहली पंक्ति के ‘आनन्दित’ से शब्दगत भेद रखते हुए समानांतरता बनाए रखता है।
- source_word: בְּתַהְפֻּכוֹת
  choice: कुटिलताओं पर
  rationale: बहुवचन תַהְפֻּכוֹת के उलटे, विकृत या नैतिक रूप से टेढ़े कामों/बातों के भाव को संज्ञात्मक बहुवचन में सुरक्षित रखता है।
- source_word: רָע
  choice: बुराई की
  rationale: अंतिम רָע को תַהְפֻּכוֹת से संबद्ध रखते हुए इब्रानी की संक्षिप्त और कुछ हद तक अस्पष्ट संरचना को अनावश्यक विस्तार के बिना दर्शाता है।
