  yaml_path: translation/ot/proverbs/002/004.yaml
  text: if you seek it like silver and search for it like hidden treasures[b][a],
translation:
  language: hi
  text: यदि तू उसे[a] उसी तरह ढूँढ़े जिस तरह चाँदी को ढूँढ़ता है, और उसकी खोज उसी तरह करे जिस तरह छिपे हुए खज़ानों[b] की खोज करता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ एकवचन स्त्रीलिंग कर्म-प्रत्यय है—अर्थात् ‘उसे’ (स्त्रीलिंग); यह पिछले पदों में आई बुद्धि या समझ की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘गड़े हुए खज़ानों’ भी हो सकता है। इब्रानी शब्द भूमि में गाड़ी गई या किसी अन्य प्रकार से छिपाई गई मूल्यवान वस्तुओं के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह पिता की शिक्षा में आगे चल रही शर्त को प्रस्तुत करता है; ‘यदि’ उसके स्पष्ट शर्तसूचक अर्थ को बनाए रखता है।
- source_word: תְּבַקְשֶׁנָּה
  choice: तू उसे ढूँढ़े
  rationale: בקשׁ का अर्थ ‘ढूँढ़ना/खोजना’ है। एकवचन स्त्रीलिंग प्रत्यय पिछले पदों की बुद्धि या समझ की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक है और संदर्भ को खुला रखता है।
- source_word: כַכָּסֶף
  choice: चाँदी की तरह
  rationale: उपसर्ग כ तुलना व्यक्त करता है। यह वाक्यांश चाँदी जैसी मूल्यवान वस्तु को लगन से खोजने का बिंब स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְכַמַּטְמוֹנִים
  choice: और छिपे हुए खज़ानों की तरह
  rationale: מַטְמוֹנִים छिपाकर रखी या भूमि में गाड़ी गई मूल्यवान वस्तुओं को सूचित कर सकता है। ‘छिपे हुए खज़ाने’ इसके व्यापक अर्थ और मूल्य के भाव दोनों को रखता है।
- source_word: תַּחְפְּשֶׂנָּה
  choice: उसकी खोज करे
  rationale: חפשׂ सावधानी और लगन से खोजने को व्यक्त करता है। ‘उसकी खोज करे’ पहले खंड के समानांतर रहते हुए प्रयत्नशील खोज का भाव देता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसे/उसकी’ रखकर संदर्भ को पिछले पदों की बुद्धि या समझ से जुड़ा रहने दिया गया है।
  alternative: स्पष्ट रूप से ‘बुद्धि को’ या ‘समझ को’ लिखना।
  rationale: इब्रानी सर्वनाम स्वयं इस पद में संज्ञा को दोहराता नहीं; किसी एक पूर्ववर्ती संज्ञा को चुनना मूल की संदर्भगत लचक को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, काव्यात्मक और गरिमापूर्ण समानांतरता रखी गई है। ‘तू’ नीतिवचन के पिता-पुत्र संबोधन की निकट, एकवचन शैली को बनाए रखता है।
