  text: All who go in to her do not return, nor do they regain the paths of life.
translation:
  language: hi
  text: जो भी उसके पास जाते हैं, वे लौटते नहीं, और जीवन के मार्गों तक नहीं पहुँचते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֶיהָ
  choice: उसके पास जाते हैं
  rationale: यह स्त्री के पास जाने या उससे संबंध रखने की ओर संकेत करता है; हिंदी में यह स्वाभाविक है और मूल की संकेतात्मकता बनाए रखता है।
- source_word: לֹא יְשׁוּבוּן
  choice: लौटकर नहीं आते
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है; ‘लौटकर नहीं आते’ आधुनिक हिंदी में परिणाम की गंभीरता स्पष्ट करता है।
- source_word: וְלֹא יַשִּׂיגוּ
  choice: और ... फिर नहीं पाते
  rationale: נשׂג यहाँ जीवन के मार्गों तक पुनः पहुँचने या उन्हें फिर पाने का भाव देता है। संदर्भ में ‘फिर नहीं पाते’ अंग्रेज़ी consultation layer के ‘regain’ और हिब्रू के लक्ष्य तक पहुँचने—दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָרְחוֹת חַיִּים
  choice: जीवन के मार्गों
  rationale: ‘मार्ग’ ज्ञान-साहित्य की नैतिक जीवन-पद्धति की रूपकात्मक भाषा को बनाए रखता है; बहुवचन भी सुरक्षित है।
theological_decisions:
- issue: क्या कथन पूर्ण और अपरिवर्तनीय असंभवता सिखाता है या नीति-वचन की कठोर सामान्य चेतावनी है?
  choice: 'मूल का निरपेक्ष वाक्य बिना नरमी के रखा गया: ‘नहीं आते ... फिर नहीं पाते।’'
  alternative: ‘आमतौर पर नहीं लौटते’ या ‘बहुत कठिनाई से लौटते हैं।’
  rationale: हिब्रू में कोई qualifying expression नहीं है। अनुवाद को कथन की नीति-साहित्यिक तीव्रता बनाए रखनी चाहिए और व्यापक धर्मवैज्ञानिक समन्वय के लिए उसे नरम नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। वाक्य का समानांतर ढाँचा और गंभीर चेतावनी सुरक्षित रखी गई है।
