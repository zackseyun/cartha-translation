  yaml_path: translation/ot/proverbs/002/001.yaml
  text: My son[a], if you receive my words and store up my commandments with you[b],
translation:
  language: hi
  text: हे मेरे पुत्र[a], यदि तू मेरी बातें ग्रहण करे और मेरी आज्ञाओं को अपने पास सँभालकर रखे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मेरे बच्चे।” इब्रानी में पुल्लिंग एकवचन (“मेरे पुत्र”) है, जो नीतिवचन में पैतृक शिक्षा का सामान्य संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: या “संचित करके रखे।” इब्रानी क्रिया किसी वस्तु को सुरक्षित रखने के लिए सावधानी से सँजोने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे पुत्र
  rationale: इब्रानी संबोधन पुल्लिंग एकवचन है और नीतिवचन में पिता/गुरु द्वारा पुत्र को दी जाने वाली शिक्षा का मानक रूप है। ‘हे मेरे पुत्र’ मूल के संबंध और संबोधन दोनों को स्पष्ट रखता है।
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ इसकी सीधी शर्तसूचक शक्ति को सुरक्षित रखता है।
- source_word: תִּקַּח
  choice: ग्रहण करे
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर ‘मेरी बातें’ के साथ यहाँ आशय उन्हें स्वीकार करके अपनाने का है। ‘ग्रहण करना’ स्वाभाविक और गरिमापूर्ण हिन्दी में यह अर्थ देता है।
- source_word: אֲמָרָי
  choice: मेरी बातें
  rationale: बहुवचन शब्द कथनों या बोले हुए वचनों को दर्शाता है। ‘बातें’ साधारण आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक रूप से किसी विशेष साहित्यिक विधा तक सीमित नहीं करता।
- source_word: וּמִצְוֺתַי
  choice: और मेरी आज्ञाओं को
  rationale: מִצְוָה का अर्थ आज्ञा/आदेश है। ‘आज्ञाओं’ से मूल का नैतिक और शिक्षापरक भार बना रहता है तथा बाइबलीय हिन्दी में यह परिचित है।
- source_word: תִּצְפֹּן
  choice: सँभालकर रखे
  rationale: क्रिया छिपाकर या सुरक्षित रूप से संचित रखने का भाव देती है। ‘सँभालकर रखे’ सावधानी और सुरक्षा दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִתָּךְ
  choice: अपने पास
  rationale: इसका सीधा अर्थ ‘तेरे साथ/पास’ है। ‘अपने पास’ आज्ञाओं को निकट और सुरक्षित रखने की मूल छवि बनाए रखता है, बिना इसे ‘अपने भीतर’ कहकर अधिक व्याख्यायित किए।
theological_decisions:
- issue: ज्ञान-साहित्य में लिंगसूचक पुत्र-संबोधन
  choice: हे मेरे पुत्र
  alternative: हे मेरे बच्चे
  rationale: इब्रानी रूप व्याकरण की दृष्टि से पुल्लिंग एकवचन है और पैतृक शिक्षा की साहित्यिक शैली को दर्शाता है। मुख्य पाठ में इस रूप को बनाए रखा गया है; व्यापक प्रतिनिधिक प्रयोग समझने वालों के लिए लिंग-तटस्थ विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। मूल के एकवचन अनौपचारिक संबोधन के अनुरूप ‘तू/करे/रखे’ रखा गया है। पद आगे आने वाले शर्तसूचक वाक्य से जुड़ा है, इसलिए अंत में अल्पविराम रखा गया है।
