base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/018.yaml
  text: For her house sinks down to death[a], and her paths to the dead.
translation:
  language: hi
  text: क्योंकि उसका घर मृत्यु की ओर धँसता है, और उसके मार्ग मृतकों[a] की ओर जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छायाओं”; दिवंगत मृतकों के लिए प्रयुक्त एक काव्यात्मक शब्द।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ उसके व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: שָׁחָה
  choice: झुकता जाता है
  rationale: क्रिया नीचे झुकने या धँसने की गति व्यक्त करती है। घर के साथ ‘झुकता जाता है’ काव्यात्मक अधोगति को सुरक्षित रखता है और ‘ले जाता है’ जैसी अतिरिक्त कारणात्मकता नहीं जोड़ता।
- source_word: אֶל מָוֶת
  choice: मृत्यु की ओर
  rationale: אֶל दिशा को सूचित करता है; ‘की ओर’ गंतव्य की दिशा को बिना उसे परिणाम के रूप में अधिक निश्चित बनाए व्यक्त करता है।
- source_word: בֵּיתָהּ
  choice: उसका घर
  rationale: मूल शब्द ठोस रूप से ‘घर’ है और स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय रखता है; विस्तृत अर्थ ‘घराना’ को मुख्य पाठ में नहीं थोपा गया।
- source_word: רְפָאִים
  choice: मृतकों
  rationale: नीतिवचन के इस मृत्यु-संबंधी संदर्भ में यह अधोलोक के मृत निवासियों को सूचित करता है, न कि रपाई जाति को। सामान्य पाठक के लिए ‘मृतकों’ स्पष्ट है; विशिष्ट काव्यात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מַעְגְּלֹתֶיהָ
  choice: उसके मार्ग
  rationale: शब्द पगडंडियों, मार्गों या जीवन की अभ्यस्त चाल को दर्शाता है। ‘मार्ग’ समानांतर काव्य को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के काव्यात्मक संदर्भ में רְפָאִים का अर्थ
  choice: मृतकों
  alternative: प्रेत-छायाओं / दिवंगत आत्माओं
  rationale: यहाँ शब्द मृत्यु के लोक के निवासियों की ओर संकेत करता है। ‘मृतकों’ अनावश्यक रूप से किसी विशिष्ट परलोक-सिद्धांत को आरोपित किए बिना चेतावनी का आशय स्पष्ट करता है, जबकि अधिक विशिष्ट काव्यात्मक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और काव्यात्मक रूप। दूसरे खंड में इब्रानी के अनुसार क्रिया लुप्त रखी गई है और पहले खंड से समझी जाती है; इससे ‘ले जाते हैं’ जैसी अनुलिखित क्रिया नहीं जुड़ती।
