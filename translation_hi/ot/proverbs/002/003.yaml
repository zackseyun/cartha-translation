  text: כִּ֤י אִ֣ם לַ/בִּינָ֣ה תִקְרָ֑א לַ֝/תְּבוּנָ֗ה תִּתֵּ֥ן קוֹלֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/002/003.yaml
  text: yes[a], if you call out for understanding and lift up your voice for discernment,
translation:
  language: hi
  text: हाँ, यदि तू समझ को पुकारे और विवेक के लिए अपनी आवाज़ उठाए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי אִם
  choice: हाँ, यदि
  rationale: यह पद पिछले कथन को बल देते हुए शर्त को आगे बढ़ाता है; ‘हाँ, यदि’ दोनों पहलुओं को स्वाभाविक हिंदी में रखता है।
- source_word: בִּינָה
  choice: समझ
  rationale: ज्ञान-साहित्य के संदर्भ में यह बोध या अंतर्दृष्टि को दर्शाता है; ‘समझ’ सरल, व्यापक और स्वाभाविक है।
- source_word: תִקְרָא
  choice: पुकारे
  rationale: यहाँ क्रिया नाम लेने के बजाय उत्कट स्वर में सहायता माँगने का भाव रखती है; ‘पुकारे’ उसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּבוּנָה
  choice: विवेक
  rationale: यह בִּינָה का निकटार्थी है, पर विचारपूर्वक भेद करने की क्षमता पर कुछ अधिक बल दे सकता है; ‘विवेक’ दोनों शब्दों को पूरी तरह एक नहीं बनाता।
- source_word: תִּתֵּן קוֹלֶךָ
  choice: अपनी आवाज़ उठाए
  rationale: शाब्दिक मुहावरा ‘अपनी आवाज़ देना’ है, जिसका आशय ऊँचे या उत्कट स्वर में बोलना है; चुना हुआ रूप हिंदी में स्वाभाविक रहते हुए स्वर की तीव्रता बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। निकटार्थी ज्ञान-शब्दों का अंतर ‘समझ’ और ‘विवेक’ से रखा गया है। आसपास के नीतिवचन-संबोधन के अनुरूप एकवचन आत्मीय ‘तू’ प्रयुक्त है।
