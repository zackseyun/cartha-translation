  text: וְ֭/הָיִיתָ כְּ/שֹׁכֵ֣ב בְּ/לֶב יָ֑ם וּ֝/כְ/שֹׁכֵ֗ב בְּ/רֹ֣אשׁ חִבֵּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/034.yaml
  text: And you will be like one lying down in the heart of the sea[a], like one lying down on the top of the mast.
translation:
  language: hi
  text: तब तुम ऐसे होगे, मानो समुद्र के बीचोंबीच लेटे हो, मानो मस्तूल[a] की चोटी पर लेटे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ जहाज़ की रस्सियाँ या जहाज़ी साज-सामान भी हो सकता है; यहाँ ‘मस्तूल’ पारंपरिक प्रसंगानुकूल अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: तब तुम ऐसे होगे
  rationale: संयोजक सहित क़ाल पूर्ण रूप यहाँ चेतावनी के प्रसंग में भावी परिणाम व्यक्त करता है। ‘तब’ परिणाम-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है और ‘तुम’ प्रत्यक्ष एकवचन संबोधन को आधुनिक सामान्य हिन्दी में रखता है।
- source_word: כְּשֹׁכֵב
  choice: मानो ... लेटे हो
  rationale: שׁכב का कृदन्त लेटे होने की अवस्था बताता है; इसे ‘सोए हो’ कहना अनावश्यक रूप से नींद का अर्थ जोड़ देता।
- source_word: בְּלֶב יָם
  choice: समुद्र के बीचोंबीच
  rationale: לֵב का शाब्दिक अर्थ ‘हृदय’ है, पर स्थान-सूचक प्रयोग में यह ‘मध्य/बीच’ दर्शाता है। ‘समुद्र के बीचोंबीच’ हिन्दी में स्वाभाविक रहते हुए तीव्र स्थानिक बिंब बनाए रखता है।
- source_word: בְּרֹאשׁ
  choice: की चोटी पर
  rationale: רֹאשׁ यहाँ किसी समुद्री उपकरण के ऊपरी सिरे को दर्शाता है; ‘चोटी पर’ ऊँचाई और अस्थिरता का बिंब सहज रूप से व्यक्त करता है।
- source_word: חִבֵּל
  choice: मस्तूल
  rationale: दुर्लभ समुद्री पद को इस संदर्भ में परंपरागत रूप से ‘मस्तूल’ समझा गया है, और ‘चोटी पर’ के साथ यह स्पष्ट तथा स्वाभाविक चित्र देता है। रस्सियों या जहाज़ी साज-सामान का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
