source:
  edition: WLC
  text: כִּֽי שׁוּחָ֣ה עֲמֻקָּ֣ה זוֹנָ֑ה וּ/בְאֵ֥ר צָ֝רָ֗ה נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/027.yaml
  text: For a prostitute is a deep pit[a], and a foreign woman is a narrow well.
translation:
  language: hi
  text: क्योंकि वेश्या एक गहरा गड्ढा है, और विदेशी स्त्री[a] एक संकरा कुआँ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पराई स्त्री” या “अजनबी स्त्री”; कुछ अनुवाद अधिक व्याख्यात्मक रूप से “व्यभिचारिणी” कहते हैं।
    reason: नָכְרִיָּה के शाब्दिक ‘विदेशी/बाहरी’ अर्थ तथा प्रसंग से जुड़े, अधिक व्याख्यात्मक विकल्पों को अलग-अलग सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; ‘क्योंकि’ हिन्दी में इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שׁוּחָה
  choice: गड्ढा
  rationale: यह किसी गहरे खोखले स्थान या गड्ढे को दर्शाता है। ‘गड्ढा’ खतरे के ठोस बिंब को बनाए रखता है और मुख्य पाठ में इसे सीधे ‘फंदा’ नहीं बनाता।
- source_word: עֲמֻקָּה
  choice: गहरा
  rationale: यह ‘गड्ढा’ का सीधा विशेषण है और उसके खतरे को सजीव रखता है।
- source_word: זוֹנָה
  choice: वेश्या
  rationale: यह शब्द यहाँ वेश्यावृत्ति करने वाली स्त्री को सूचित करता है। ‘वेश्या’ आधुनिक, संक्षिप्त और अनावश्यक रूप से अशिष्ट हुए बिना स्पष्ट है।
- source_word: וּבְאֵר
  choice: और ... कुआँ
  rationale: בְּאֵר का सामान्य अर्थ ‘कुआँ’ है; ‘और’ समानांतर पंक्तियों को जोड़ता है।
- source_word: צָרָה
  choice: संकरा
  rationale: यह कुएँ के तंग और सीमित होने का ठोस बिंब सुरक्षित रखता है तथा उसमें फँसने का निहित भाव बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: נָכְרִיָּה
  choice: पराई स्त्री
  rationale: ‘पराई स्त्री’ हिन्दी में ऐसी स्त्री का स्वाभाविक बोध देता है जो अपने वैध संबंध या समुदाय से बाहर की है। यह ‘व्यभिचारिणी’ जैसी अधिक विशिष्ट व्याख्या आरोपित नहीं करता; शाब्दिक विकल्प ‘विदेशी स्त्री’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: नीतिवचन की चेतावनी में נָכְרִיָּה का अर्थ
  choice: पराई स्त्री
  alternative: विदेशी स्त्री; व्यभिचारिणी
  rationale: इब्रानी शब्द का मूल भाव बाहरी, पराई या विदेशी स्त्री का है, जबकि नीतिवचन के प्रसंग में इसके नैतिक और यौन निहितार्थ भी हैं। ‘पराई स्त्री’ इन दोनों स्तरों के बीच का तनाव बनाए रखता है; ‘व्यभिचारिणी’ अर्थ को आवश्यकता से अधिक विशिष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर बिंब—‘गहरा गड्ढा’ और ‘संकरा कुआँ’—को ठोस रूप में सुरक्षित रखा गया है। पादटिप्पणी का चिह्न उसी पदबंध के साथ रखा गया है जिससे उसका वास्तविक lexical संबंध है।
