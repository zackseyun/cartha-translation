  yaml_path: translation/ot/proverbs/023/016.yaml
  text: and my inmost being will rejoice when your lips speak what is upright[a][b].
translation:
  language: hi
  text: और जब तेरे होंठ सच्ची और सीधी बातें[b] कहेंगे, तब मेरा अंतर्मन[a] हर्षित होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मेरे गुर्दे’; यह एक हिब्रू अभिव्यक्ति है, जो भीतरी अस्तित्व या सबसे गहरी भावनाओं को दर्शाती है।
    reason: cultural_note
  - marker: b
    text: या, ‘जब तेरे होंठ उचित बातें कहेंगे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַעְלֹזְנָה
  choice: आनन्दित होगा
  rationale: क्रिया עלז प्रबल आनन्द या हर्ष व्यक्त करती है। ‘आनन्दित होगा’ आधुनिक, स्वाभाविक हिन्दी में भाव और हिब्रू के भावी अर्थ—दोनों को व्यक्त करता है।
- source_word: כִלְיוֹתָי
  choice: मेरा अंतर्मन
  rationale: शाब्दिक अर्थ ‘मेरे गुर्दे’ है, पर हिब्रू में यह मनुष्य के भीतरी अस्तित्व और गहरी भावनाओं का बिंब है। ‘मेरा अंतर्मन’ इस अर्थ को स्पष्ट रखता है और इसे केवल ‘हृदय’ तक सीमित नहीं करता।
- source_word: בְּדַבֵּר
  choice: जब ... कहेंगे
  rationale: यहाँ בְּ के साथ infinitive construct का स्वाभाविक कालवाचक अर्थ ‘जब बोलेंगे’ है। होंठों को कर्ता बनाकर हिन्दी में ‘जब तेरे होंठ ... कहेंगे’ काव्यात्मक और स्पष्ट है।
- source_word: שְׂפָתֶיךָ
  choice: तेरे होंठ
  rationale: मूल पाठ के ठोस काव्य-बिंब को बनाए रखने के लिए ‘होंठ’ रखा गया है। एकवचन संबोधन के अनुरूप ‘तेरे’ प्रयुक्त है।
- source_word: מֵישָׁרִים
  choice: सीधी बातें
  rationale: מֵישָׁרִים में सीधेपन और नैतिक खराई का भाव है। ‘सीधी बातें’ हिन्दी में सहज है और मूल की ‘सीधा/खरा’ छवि को बचाता है; ‘सही बातें’ भी संभव है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तेरे’ का प्रयोग नीतिवचन के पिता-पुत्र संबंध वाले एकवचन संबोधन तथा पारंपरिक काव्यात्मक निकटता को दर्शाता है। मूल का ‘होंठ’ बिंब सुरक्षित रखा गया है, जबकि सांस्कृतिक रूप से अपारदर्शी ‘गुर्दे’ को मुख्य पाठ में ‘अंतर्मन’ किया गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
