  yaml_path: translation/ot/proverbs/023/005.yaml
  text: Will you let your eyes fly to it[a], and it is gone? For it surely makes wings for itself; like an eagle, it flies to the heavens.
translation:
  language: hi
  text: क्या तुम उस पर नज़र दौड़ाओगे? वह तो गायब हो जाएगा। क्योंकि वह निश्चय ही अपने लिए पंख बना लेता है; उकाब[a] के समान आकाश की ओर उड़ जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिद्ध’; इब्रानी शब्द नेशेर किसी बड़े शिकारी पक्षी के लिए अधिक व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתָעוּף
  choice: क्या तुम ... उड़ाओगे?
  rationale: हिफ़ील रूप का मूल भाव ‘उड़ाना’ या ‘उड़ने देना’ है। आँखों के साथ यह किसी वस्तु पर तुरंत दृष्टि लगाने का सजीव रूपक है; हिंदी में असामान्य होते हुए भी ‘आँखें ... उड़ाओगे’ मूल काव्यात्मक चित्र को सुरक्षित रखता है।
- source_word: עֵינֶיךָ בּוֹ
  choice: अपनी आँखें उस पर
  rationale: ‘आँखें’ और ‘उस पर’ का सीधा रूपांतरण मूल इब्रानी बिंब और पिछले संदर्भ में वर्णित धन की ओर संकेत—दोनों को बनाए रखता है।
- source_word: וְאֵינֶנּוּ
  choice: वह तो गायब हो जाएगा
  rationale: शाब्दिक अर्थ ‘और वह नहीं है’ है। प्रसंग में अचानक लुप्त हो जाने का भाव है; भविष्यकाल हिंदी में प्रश्न से परिणाम की ओर स्वाभाविक संक्रमण करता है।
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: निश्चय ही ... बना लेता है
  rationale: क्रिया के साथ infinitive absolute निश्चितता और तीव्रता व्यक्त करता है; ‘निश्चय ही’ इस बल को स्पष्ट करता है।
- source_word: לּוֹ כְנָפַיִם
  choice: अपने लिए पंख
  rationale: दत्तिव सर्वनाम में निहित आत्मसंबंधी भाव को ‘अपने लिए’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְנֶשֶׁר
  choice: उकाब के समान
  rationale: נֶשֶׁר किसी बड़े शिकारी पक्षी को सूचित करता है। काव्यात्मक और पारंपरिक बिंब के लिए ‘उकाब’ उपयुक्त है, जबकि ‘गिद्ध’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: וְעָף הַשָּׁמָיִם
  choice: आकाश की ओर उड़ जाता है
  rationale: यह धन के दूर निकल जाने का परिणाम चित्रित करता है। ‘आकाश की ओर’ הַשָּׁמָיִם को इस ज्ञान-साहित्य के प्रसंग में प्राकृतिक, गैर-सैद्धांतिक अर्थ में व्यक्त करता है।
