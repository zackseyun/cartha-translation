  terminology: ‘उकाब’ is an appropriate Hindi rendering for the traditional ‘eagle’ image, and the footnote responsibly retains the broader possible sense of נֶשֶׁר as ‘vulture’/a large bird of prey. ‘आकाश’ is suitable in this poetic, non-doctrinal context.
