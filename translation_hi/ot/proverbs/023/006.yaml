  source_fidelity: The draft correctly understands תִּלְחַם as ‘eat,’ לֶחֶם as ‘bread,’ and תתאו as a prohibition against desiring the host’s especially tasty foods. However, ‘बुरी नज़र रखनेवाला’ normally means someone who casts a malicious or harmful glance in modern Hindi; it does not convey the Hebrew wisdom-literature idiom רַע עָיִן, denoting a stingy or begrudging person.
  naturalness: The syntax is generally fluent, but ‘बुरी नज़र रखनेवाले’ is misleading in contemporary standard Hindi because it evokes the distinct idea of an evil glance or the evil eye. ‘कंजूस व्यक्ति’ is clear and idiomatic; the literal Hebrew imagery can be retained in the footnote.
  terminology: ‘रोटी,’ ‘स्वादिष्ट व्यंजन,’ and ‘लालसा’ are suitable. Rendering the idiom semantically as ‘कंजूस व्यक्ति’ avoids importing a Hindi ‘बुरी नज़र’ concept not intended by the Hebrew.
  issues:
