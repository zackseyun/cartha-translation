  text: אַל תִּלְחַ֗ם אֶת לֶ֭חֶם רַ֣ע עָ֑יִן וְ/אַל תתאו לְ/מַטְעַמֹּתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/006.yaml
  text: Do not eat the bread of a man with an evil eye[a], and do not crave his delicacies.
translation:
  language: hi
  text: कंजूस व्यक्ति[a] की रोटी मत खाना, और उसके स्वादिष्ट व्यंजनों की लालसा मत करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “बुरी आँख वाले की रोटी।” यह मुहावरा किसी कंजूस, कुढ़नेवाले या अनुदार व्यक्ति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּלְחַם
  choice: खाना
  rationale: לֶחֶם के साथ यह क्रिया यहाँ भोजन करने के अर्थ में है; इसका समानाक्षरी अर्थ ‘लड़ना’ संदर्भानुकूल नहीं है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का सीधा अर्थ ‘रोटी’ है; यहाँ यह पूरे भोजन का भी संकेत दे सकता है, पर मूल बिंब बनाए रखा गया है।
- source_word: רַע עָיִן
  choice: बुरी नज़र रखनेवाला
  rationale: शाब्दिक नेत्र-विषयक मुहावरे को मुख्य पाठ में रखा गया है; इस प्रसंग में यह कंजूस, कुढ़नेवाले अथवा अनुदार व्यक्ति को सूचित करता है।
- source_word: תתאו
  choice: लालसा करना
  rationale: यह रूप प्रबल इच्छा व्यक्त करता है; ‘लालसा’ भीतर की तीव्र चाह के विरुद्ध चेतावनी को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְמַטְעַמֹּתָיו
  choice: उसके स्वादिष्ट व्यंजन
  rationale: शब्द विशेष रूप से स्वादिष्ट और लुभावने भोज्य पदार्थों को दर्शाता है; ‘स्वादिष्ट व्यंजन’ आधुनिक हिन्दी में सहज और स्पष्ट है।
theological_decisions: []
