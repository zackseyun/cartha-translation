  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण निषेधात्मक शैली अपनाई गई है। मूल का ‘रोटी’ और ‘बुरी नज़र’ वाला बिंब सुरक्षित रखा गया है तथा मुहावरे का आशय पादटिप्पणी में स्पष्ट किया गया है।
