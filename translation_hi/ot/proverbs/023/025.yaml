  text: Let your father and your mother be glad[a], and let her who gave birth to you rejoice.
translation:
  language: hi
  text: तेरे पिता और तेरी माता प्रसन्न हों, और जिसने तुझे जन्म दिया है वह हर्षित हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמַח
  choice: आनन्दित हों
  rationale: שׂמח का यह इच्छार्थक प्रयोग माता-पिता के आनन्दित होने की कामना या प्रेरणा व्यक्त करता है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन आदरसूचक रूप स्वाभाविक है।
- source_word: אָבִיךָ וְאִמֶּךָ
  choice: तेरे पिता और तेरी माता
  rationale: दूसरे पुरुष एकवचन पुल्लिंग संबंधसूचक प्रत्यय को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְתָגֵל
  choice: और ... हर्ष से झूम उठे
  rationale: גיל प्रबल और उल्लसित आनन्द को व्यक्त करता है। यह चयन पहले क्रियापद आनन्दित हों से काव्यात्मक भेद भी बनाए रखता है।
- source_word: יוֹלַדְתֶּךָ
  choice: जिसने तुझे जन्म दिया है
  rationale: स्त्रीलिंग कृदन्त उस स्त्री, अर्थात माता, को उसके जन्म देने के कार्य से फिर संबोधित करता है। यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
