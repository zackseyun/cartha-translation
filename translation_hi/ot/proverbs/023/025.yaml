  to: तेरे पिता और तेरी माता प्रसन्न हों, और जिसने तुझे जन्म दिया है वह हर्षित हो।
  rationale: The revision removes the added physical and inceptive imagery in ‘झूम उठे’ while preserving the jussive force, the coordinated reference to father and mother, and the feminine reference to the mother as the one who gave birth to the addressee. No footnote is necessary in Hindi because ‘जिसने तुझे जन्म दिया है’ already expresses the participial wording transparently.
