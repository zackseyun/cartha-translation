  yaml_path: translation/ot/proverbs/023/026.yaml
  text: My son[a], give me your heart, and let your eyes delight in my ways.
translation:
  language: hi
  text: 'हे मेरे बेटे, अपना हृदय मुझे दे,

    और तेरी आँखें मेरे मार्गों को देखकर प्रसन्न हों।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी आँखें मेरे मार्गों पर ध्यान दें।” हिब्रू क्रिया का अर्थ ध्यानपूर्वक देखना भी समझा जा सकता है; यहाँ उसमें पिता के जीवन-मार्ग को प्रसन्नता से स्वीकार करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: दे
  rationale: נתן के आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; पिता की व्यक्तिगत पुकार की स्पष्टता बनाए रखता है।
- source_word: בְנִי
  choice: हे मेरे बेटे
  rationale: पुल्लिंग एकवचन संबोधन और प्रथम पुरुष संबंधसूचक प्रत्यय, दोनों को सुरक्षित रखता है। 'हे' काव्यात्मक संबोधन को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לִבְּךָ
  choice: अपना हृदय
  rationale: हिब्रू में 'हृदय' भीतरी मनुष्य, इच्छा और अनुराग का बिंब है। हिन्दी में यही रूपक स्पष्ट और स्वाभाविक है।
- source_word: לִי
  choice: मुझे
  rationale: अप्रत्यक्ष कर्म को हिन्दी की स्वाभाविक पद-रचना 'अपना हृदय मुझे दे' में व्यक्त करता है।
- source_word: וְעֵינֶיךָ
  choice: और तेरी आँखें
  rationale: हिब्रू के समन्वित दूसरे उपवाक्य और 'आँखों' के सजीव रूपक को बनाए रखता है।
- source_word: דְּרָכַי
  choice: मेरे मार्गों में
  rationale: דרך यहाँ जीवन-चाल या आचरण के ढंग को सूचित करता है। 'मार्ग' ज्ञान-साहित्य के प्रचलित रूपक को सुरक्षित रखता है।
- source_word: תִּרְצֶנָה
  choice: आनंद पाएँ
  rationale: רצה का यह रूप अनुकूल लगाव, प्रसन्नता या स्वीकार को व्यक्त कर सकता है। 'आनंद पाएँ' आँखों के काव्यात्मक कर्ता के साथ स्वाभाविक है और केवल देखने से अधिक सकारात्मक स्वीकृति को सामने लाता है।
