  text: My son[a], if your heart is wise, my heart also will rejoice.
translation:
  language: hi
  text: मेरे बेटे, यदि तेरा हृदय बुद्धिमान हो, तो मेरा हृदय भी आनंदित होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो मेरा हृदय आनंदित होगा—मैं भी,” जहाँ “मैं भी” इब्रानी के बलयुक्त गַּם־אָנִי का अर्थ प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: इब्रानी में शाब्दिक अर्थ ‘मेरे पुत्र/बेटे’ है और यह नीतिवचन में पिता की ओर से प्रयुक्त सामान्य सम्बोधन है। ‘हे मेरे बेटे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए पुल्लिंग एकवचन को बनाए रखता है।
- source_word: אִם
  choice: यदि
  rationale: यह पद शर्त प्रस्तुत करता है; ‘यदि’ उसके सीधे सशर्त अर्थ को सुरक्षित रखता है।
- source_word: חָכַם
  choice: बुद्धिमान हो
  rationale: क्रिया पूर्ण रूप में है, पर सशर्त उपवाक्य में अवस्था का बोध कराती है। ‘बुद्धिमान हो’ प्रक्रिया के बजाय बुद्धि से युक्त होने की अवस्था व्यक्त करता है।
- source_word: לִבֶּךָ
  choice: तेरा हृदय
  rationale: ‘हृदय’ इब्रानी में विचार, इच्छा और भीतरी व्यक्ति का केंद्र हो सकता है। इसे बनाए रखने से अगले ‘मेरा हृदय’ के साथ काव्यात्मक समानांतरता सुरक्षित रहती है।
- source_word: יִשְׂמַח
  choice: आनन्दित होगा
  rationale: शर्त के परिणाम में अपूर्ण क्रिया भविष्यसूचक अर्थ देती है। ‘आनन्दित होगा’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: मूल पाठ स्पष्ट रूप से ‘मेरा हृदय’ कहता है। यह अनुवाद भावनात्मक केंद्र और ‘तेरा हृदय’ के साथ समानांतरता बनाए रखता है।
- source_word: גַם אָנִי
  choice: भी
  rationale: इस पदबंध में ‘मैं भी/यहाँ तक कि मैं’ का बल है। मुख्य पाठ में ‘मेरा हृदय भी’ सहज हिन्दी है; अधिक बलयुक्त सम्भावना पादटिप्पणी में दी गई है।
