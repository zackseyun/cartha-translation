  yaml_path: translation/ot/proverbs/023/020.yaml
  text: Do not be among heavy drinkers of wine[a], among gluttonous eaters of meat,
translation:
  language: hi
  text: 'दाखरस बहुत पीनेवालों के बीच मत रहना,

    न मांस बहुत खानेवालों के बीच।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “न उनके बीच जो अपने लिए मांस ठूँस-ठूँसकर खाते हैं।” अंतिम इब्रानी शब्द לָמוֹ का वाक्य-संबंध कठिन है; वह कोई अलग विचार जोड़ने के बजाय केवल बल भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהִי
  choice: न रहना
  rationale: אַל के साथ היה का यह रूप निषेध व्यक्त करता है। प्रसंग में किसी समूह की संगति में रहने से मना किया गया है; हिंदी उपदेशात्मक शैली में ‘न रहना’ स्वाभाविक है।
- source_word: בְסֹבְאֵי יָיִן
  choice: दाखमधु के अत्यधिक पीनेवालों के बीच
  rationale: בְ यहाँ संगति का भाव देता है और סבא साधारण पीने के बजाय अत्यधिक पीने की आदत बताता है। ‘दाखमधु’ יַיִן को स्पष्ट रूप से दर्शाता है।
- source_word: בְזֹלֲלֵי בָשָׂר
  choice: मांस के पेटुओं के बीच
  rationale: זלל लापरवाह और अति भोजन करने का भाव रखता है; בָשָׂר यहाँ भोजन के रूप में मांस है। ‘पेटू’ इस नियमित अति-भोजन को संक्षेप और सहज हिंदी में व्यक्त करता है।
- source_word: לָמוֹ
  choice: मुख्य पाठ में अलग अनुवाद नहीं
  rationale: अंतिम לָמוֹ का वाक्य-संबंध कठिन है और संभवतः पिछले पदबंध पर बल देता है। उसे मुख्य पाठ में अलग से रखने पर हिंदी कृत्रिम या अनावश्यक रूप से निश्चित हो जाती; संभावित अर्थ पाद-टिप्पणी में रखा गया है।
