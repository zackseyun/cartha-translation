  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। समानांतर काव्य-पंक्तियाँ सुरक्षित रखी गई हैं; ‘अत्यधिक पीनेवाले’ व्यवहार पर बल देता है, जबकि ‘पेटू’ संक्षिप्त और प्रचलित है।
