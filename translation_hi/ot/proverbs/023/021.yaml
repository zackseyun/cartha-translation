  yaml_path: translation/ot/proverbs/023/021.yaml
  text: For the drunkard and the glutton will come to poverty[a], and drowsiness will clothe one with rags.
translation:
  language: hi
  text: 'क्योंकि पियक्कड़ और पेटू कंगाल हो जाएंगे,

    और तंद्रा उन्हें चिथड़े पहना देगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סֹבֵא
  choice: पियक्कड़
  rationale: यह शब्द आदतन बहुत मदिरा पीने वाले व्यक्ति को दर्शाता है; ‘पियक्कड़’ संक्षिप्त, स्वाभाविक और नीतिवचन के नैतिक आशय के अनुकूल है।
- source_word: זוֹלֵל
  choice: पेटू
  rationale: इस संदर्भ में यह आत्मसंयमहीन होकर बहुत खाने वाले व्यक्ति को दर्शाता है; ‘पेटू’ पियक्कड़ के साथ स्वाभाविक युग्म बनाता है।
- source_word: יִוָּרֵשׁ
  choice: कंगाल हो जाएंगे
  rationale: यहाँ निफ़अल रूप का अर्थ संपत्ति से वंचित होकर निर्धन हो जाना है; यह अभिव्यक्ति परिणाम को सहज आधुनिक हिन्दी में बताती है।
- source_word: קְרָעִים
  choice: चिथड़े
  rationale: बहुवचन संज्ञा फटे-पुराने वस्त्रों को दर्शाती है; ‘चिथड़े’ अभाव की सजीव छवि बनाए रखता है।
- source_word: תַּלְבִּישׁ
  choice: पहना देगी
  rationale: हिफ़इल रूप का कारक अर्थ ‘वस्त्र पहनाना’ है; हिन्दी में यह रूप मूल रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: נוּמָה
  choice: ऊँघ
  rationale: यह संज्ञा तंद्रा, उनींदेपन या सुस्ती भरी नींद को दर्शाती है; ‘ऊँघ’ संक्षिप्त है और लापरवाही की ओर ले जाने वाली निद्रालु अवस्था को व्यक्त करती है।
