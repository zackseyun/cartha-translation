  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी में पहले उपवाक्य की क्रिया एकवचन है, पर संयुक्त कर्ता के कारण स्वाभाविक हिन्दी में बहुवचन प्रयोग किया गया है। दूसरे उपवाक्य में ‘ऊँघ’ को मानवीकृत कर्ता बनाकर मूल रूपक सुरक्षित रखा गया है।
