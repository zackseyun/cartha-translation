  text: In the end it bites like a snake[c][b][a], and it stings like a viper.
translation:
  language: hi
  text: अन्त में वह साँप के समान काटती है और विषैले साँप के समान डसती है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अन्तिम क्रिया का अर्थ शाब्दिक रूप से अनिश्चित है। इसका पारम्परिक अनुवाद ‘डसती है’ किया जाता है; ‘वार करती है’ या ‘विष फैलाती है’ भी सम्भव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרִיתוֹ
  choice: अन्त में
  rationale: यह शब्द बाद के परिणाम या अन्तिम नतीजे को दर्शाता है। सन्दर्भ में इसका सम्बन्ध दाखमधु से है; हिन्दी में ‘अन्त में’ स्वाभाविक रूप से उसके अन्ततः होने वाले परिणाम को व्यक्त करता है।
- source_word: כְּנָחָשׁ
  choice: साँप के समान
  rationale: נָחָשׁ साँप के लिए सामान्य शब्द है। ‘साँप’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: יִשָּׁךְ
  choice: काटती है
  rationale: נשׁך का अर्थ ‘काटना’ है। नीतिवचन की सामान्य सच्चाई व्यक्त करने के लिए वर्तमान काल रखा गया है; स्त्रीलिंग क्रिया का कर्ता सन्दर्भगत ‘दाखमधु’ है।
- source_word: וּכְצִפְעֹנִי
  choice: और विषधर के समान
  rationale: צִפְעֹנִי किसी विषैले साँप का सूचक है। ‘विषधर’ प्रजाति के विषय में अनावश्यक निश्चितता से बचते हुए विषैले साँप का भाव स्पष्ट करता है।
- source_word: יַפְרִשׁ
  choice: डसती है
  rationale: यह क्रिया शाब्दिक दृष्टि से कठिन है। समानान्तर विषैले साँप की हानिकारक क्रिया के लिए ‘डसती है’ स्वाभाविक पारम्परिक अर्थ देता है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
