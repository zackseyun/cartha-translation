  text: Your eyes will see strange things[b][a], and your heart will speak perverse things.
translation:
  language: hi
  text: तेरी आँखें विचित्र चीज़ें देखेंगी,[a] और तेरा मन विकृत बातें कहेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराई स्त्रियों को।’ हिब्रानी शब्द का अर्थ कुछ प्रसंगों में पराई अथवा अनुचित स्त्रियाँ हो सकता है; यहाँ वह नशे में दिखाई देने वाली विचित्र या विकृत चीज़ों को भी सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘टेढ़ी-मेढ़ी बातें’ अथवा ‘उलटी बातें।’ हिब्रानी शब्द विशेषकर वाणी में विकृति या टेढ़ेपन को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: द्विवचन रूप और एकवचन पुरुषवाचक प्रत्यय को स्वाभाविक हिन्दी बहुवचन में रखा गया है। निकटवर्ती चेतावनी की सीधी संबोधन-शैली के अनुरूप ‘तेरी’ चुना गया है।
- source_word: יִרְאוּ
  choice: देखेंगी
  rationale: अपूर्ण क्रिया यहाँ नशे के परिणाम को व्यक्त करती है; इसलिए भविष्यत्काल स्वाभाविक है।
- source_word: זָרוֹת
  choice: विचित्र चीज़ें
  rationale: स्त्रीलिंग बहुवचन रूप का अर्थ ‘पराई स्त्रियाँ’ भी हो सकता है, किंतु नशे से उत्पन्न असामान्य या विकृत दृश्यों का व्यापक अर्थ प्रसंग में उपयुक्त है। अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְלִבְּךָ
  choice: और तेरा मन
  rationale: हिब्रानी ‘हृदय’ यहाँ विचार और वाणी के भीतरी स्रोत को सूचित करता है। सामान्य आधुनिक हिन्दी में ‘मन’ इस अर्थ को अधिक सहजता से व्यक्त करता है।
- source_word: יְדַבֵּר
  choice: कहेगा
  rationale: अपूर्ण क्रिया पहली पंक्ति के समान परिणामसूचक भविष्य को व्यक्त करती है; ‘बातें कहेगा’ स्वाभाविक हिन्दी है।
- source_word: תַּהְפֻּכוֹת
  choice: विकृत बातें
  rationale: यह संज्ञा टेढ़ी, उलटी या नैतिक रूप से भ्रष्ट अभिव्यक्तियों को सूचित करती है। बोलने की क्रिया के साथ ‘विकृत बातें’ अर्थ को स्पष्ट और संक्षिप्त रखता है।
