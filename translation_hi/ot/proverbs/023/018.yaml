translation:
  language: hi
  text: क्योंकि निश्चय ही तुम्हारा भविष्य[a] है, और तुम्हारी आशा समाप्त नहीं होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अंत/परिणाम’; इब्रानी शब्द אַחֲרִית का अर्थ अंत, परिणाम, या भविष्य हो सकता है। यहाँ सकारात्मक आशा के संदर्भ में इसका अनुवाद ‘भविष्य’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि निश्चय ही
  rationale: यह पद पिछले उपदेश से कारणसूचक रूप में जुड़ता है और मुहावरा यहाँ शर्त नहीं, बल्कि दृढ़ आश्वासन व्यक्त करता है।
- source_word: יֵשׁ
  choice: है
  rationale: अस्तित्वसूचक भाव को स्वाभाविक हिन्दी वाक्य-रचना में व्यक्त करता है।
- source_word: אַחֲרִית
  choice: एक भविष्य
  rationale: शब्द का अर्थ अंत, परिणाम या भविष्य हो सकता है; आशा के साथ इस सकारात्मक संदर्भ में ‘भविष्य’ सबसे स्वाभाविक है, जबकि वास्तविक अर्थ-विस्तार पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְתִקְוָתְךָ
  choice: और तुम्हारी आशा
  rationale: תִּקְוָה के सकारात्मक प्रत्याशा-बोध को आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לֹא תִכָּרֵת
  choice: मिटाई नहीं जाएगी
  rationale: ख़त्म कर दिए जाने या समाप्त हो जाने की इब्रानी छवि को हिन्दी में स्वाभाविक निष्क्रिय अभिव्यक्ति से प्रस्तुत करता है; ‘काटी नहीं जाएगी’ आशा के साथ हिन्दी में असहज और भ्रमकारी होता।
