lexical_decisions:
- source_word: אֱמֶת
  choice: सत्य
  rationale: यहाँ אֱמֶת का व्यापक नैतिक और ज्ञान-संबंधी अर्थ है; ‘सत्य’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और पर्याप्त व्यापक है।
- source_word: קְנֵה
  choice: मोल ले
  rationale: कנה का अर्थ ‘खरीदना/प्राप्त करना’ हो सकता है। ‘मोल ले’ अगले निषेध ‘बेच न देना’ के साथ जानबूझकर प्रयुक्त व्यापारिक रूपक को बनाए रखता है।
- source_word: וְאַל תִּמְכֹּר
  choice: और उसे बेच न देना
  rationale: नकारात्मक आज्ञा का सीधा अनुवाद है। हिन्दी में ‘उसे’ जोड़ने से स्पष्ट होता है कि सत्य तथा आगे गिनाए गए गुणों को बेचने की मनाही है, जबकि मूल का संक्षिप्त विरोध बना रहता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन के संदर्भ में यह व्यावहारिक और नैतिक विवेक से युक्त जीवन-कौशल को व्यक्त करता है; ‘बुद्धि’ हिन्दी बाइबलीय और सामान्य प्रयोग में स्वाभाविक है।
- source_word: מוּסָר
  choice: शिक्षा
  rationale: מוּסָר में अनुशासन, सुधार और उनसे मिलने वाली शिक्षा के अर्थ शामिल हैं। ‘शिक्षा’ सूची में सहज है और अर्थ को केवल दंडात्मक सुधार तक सीमित नहीं करती।
- source_word: בִינָה
  choice: समझ
  rationale: בִינָה समझ, सूझ या विवेक को दर्शाता है। ‘समझ’ व्यापक, सरल और आधुनिक हिन्दी में स्वाभाविक है।
