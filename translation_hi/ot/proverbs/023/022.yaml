review_pass:
  verdict: revise
  source_fidelity: 'The imperative, the attentive sense of listening to one''s father, the warning against contempt, and the temporal force of כִּי are conveyed well. However, ‘जिसने तुम्हें जन्म दिया है’ is potentially misleading in Hindi: ‘जन्म देना’ ordinarily denotes a mother''s act of giving birth, whereas the Hebrew ילד here has the father as its male subject (‘who fathered/begot you’).'
  naturalness: The wording is otherwise fluent, clear modern Hindi with an appropriate wisdom-literature register. ‘अपने उस पिता की सुनो’ naturally carries the emphatic/clarifying force of the Hebrew demonstrative זֶה.
  terminology: ‘तुच्छ न समझो’ is a suitable rendering of בוז. ‘बूढ़ी हो जाए’ is natural and preserves the prospective circumstance of the mother’s old age. Replacing ‘जन्म दिया’ with ‘पैदा किया’ avoids assigning a specifically maternal birth-action to the father while remaining idiomatic.
  issues:
  - severity: medium
    issue: The phrase ‘जिसने तुम्हें जन्म दिया है’ can imply that the father physically gave birth.
    rationale: The Hebrew explicitly identifies the father as the one who begot/fathered the addressee. Modern Hindi normally uses ‘जन्म देना’ for maternal childbirth; ‘पैदा किया’ can be used of a father and better preserves the source’s paternal reference.
  revised_text: अपने उस पिता की सुनो, जिसने तुम्हें पैदा किया है; और जब तुम्हारी माँ बूढ़ी हो जाए, तो उसे तुच्छ न समझो।
  revised_footnotes: []
  revision_rationale: A minimal revision replaces a potentially maternal-specific expression with an idiomatic expression applicable to a father, while retaining the demonstrative clarification (‘उस’), the perfect-related sense (‘किया है’), and all other faithful elements of the draft.
