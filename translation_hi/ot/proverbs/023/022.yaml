  yaml_path: translation/ot/proverbs/023/022.yaml
  text: Listen to your father[a], who fathered you[b], and do not despise your mother when she is old.
translation:
  language: hi
  text: अपने उस पिता की सुनो, जिसने तुम्हें पैदा किया है; और जब तुम्हारी माँ बूढ़ी हो जाए, तो उसे तुच्छ न समझो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע לְאָבִיךָ
  choice: अपने पिता की सुनो
  rationale: आज्ञार्थक שׁמע यहाँ केवल सुन लेने के बजाय ध्यान देकर मानने का भाव रखता है; हिंदी में ‘की सुनो’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: זֶה יְלָדֶךָ
  choice: जिसने तुम्हें जन्म दिया है
  rationale: זֶה पिता पर बल देकर आगे स्पष्टीकरण देता है, जिसे हिंदी में संबंधवाचक ‘जिसने’ से सहज रूप मिलता है। ילד का पुरुष कर्ता पिता है; ‘जन्म दिया’ आधुनिक हिंदी में स्वाभाविक है और पितृत्व का संदर्भ वाक्य से स्पष्ट रहता है।
- source_word: וְאַל תָּבוּז
  choice: तो उसे तुच्छ न समझो
  rationale: בוז किसी को नीचा या तुच्छ मानने का अर्थ देता है। निषेधात्मक आज्ञा को ‘तुच्छ न समझो’ स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כִּי זָקְנָה אִמֶּךָ
  choice: जब तुम्हारी माँ बूढ़ी हो जाए
  rationale: כִּי यहाँ उस परिस्थिति या समय को प्रस्तुत करता है जिसमें चेतावनी विशेष रूप से लागू होती है। זָקְנָה वृद्धावस्था में पहुँचने की परिणामी दशा बताता है; ‘बूढ़ी हो जाए’ उस परिवर्तन और अवस्था दोनों को स्वाभाविक हिंदी में रखता है।
theological_decisions: []
