  register: आधुनिक मानक हिंदी; सरल, सीधे और गरिमापूर्ण ज्ञान-साहित्यिक आदेश। ‘बूढ़ी’ सामान्य और स्पष्ट शब्द है, जबकि पूरे वाक्य का सम्मानपूर्ण स्वर इसे अपमानसूचक बनने से रोकता है।
