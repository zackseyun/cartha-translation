  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कहावती प्रवाह रखा गया है। ‘हिसाब लगाता है’ से संदर्भगत कंजूसी और मन-ही-मन लागत आँकने का भाव आता है, जबकि पादटिप्पणी व्यापक अर्थ ‘सोचता है’ को सुरक्षित रखती है।
