id: PRO.23.7
reference: Proverbs 23:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י כְּמוֹ שָׁעַ֥ר בְּ/נַפְשׁ֗/וֹ כֶּ֫ן ה֥וּא אֱכֹ֣ל וּ֭/שְׁתֵה יֹ֣אמַר לָ֑/ךְ וְ֝/לִבּ֗/וֹ בַּל עִמָּֽ/ךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/007.yaml
  text: 'For as he calculates within himself[a], so he is: “Eat and drink,” he says to you, but his heart is not with you.'
translation:
  language: hi
  text: क्योंकि जैसा वह अपने भीतर हिसाब लगाता है,[a] वैसा ही वह है। वह तुमसे कहता है, “खाओ और पियो,” पर उसका हृदय तुम्हारे साथ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्योंकि जैसा वह अपने भीतर सोचता है, वैसा ही वह है।” इब्रानी क्रिया का अर्थ “सोचना” हो सकता है, पर अधिक विशेष रूप से उसमें हिसाब लगाने या आँकने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ की चेतावनी का कारण बताता है और नीतिवचन की व्याख्यात्मक कड़ी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּמוֹ...כֵּן
  choice: जैसा...वैसा
  rationale: तुलनात्मक रचना को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שָׁעַר
  choice: हिसाब लगाता है
  rationale: क्रिया केवल सामान्य सोच नहीं, बल्कि मन-ही-मन आँकने या लागत गिनने का भाव भी देती है; कंजूस मेज़बान के संदर्भ में यह अर्थ उपयुक्त है।
- source_word: בְּנַפְשׁוֹ
  choice: अपने भीतर
  rationale: यहाँ נֶפֶשׁ व्यक्ति के आंतरिक स्व को दर्शाता है, किसी तकनीकी अर्थ में ‘आत्मा’ को नहीं।
- source_word: כֵּן הוּא
  choice: वैसा ही वह है
  rationale: मूल की संक्षिप्त कहावती उक्ति और व्यक्ति के भीतर-बाहर के विरोध को बनाए रखता है।
- source_word: אֱכֹל וּשְׁתֵה
  choice: खाओ और पियो
  rationale: मेज़बान के निमंत्रण के दोनों आज्ञार्थक रूपों का सीधा और स्वाभाविक अनुवाद है।
- source_word: יֹאמַר לָךְ
  choice: वह तुमसे कहता है
  rationale: नीतिवचन के सामान्य वर्तमान भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלִבּוֹ
  choice: पर उसका हृदय
  rationale: संदर्भ में संयोजक विरोध दिखाता है; ‘हृदय’ उसकी वास्तविक इच्छा और आंतरिक लगाव को दर्शाता है।
- source_word: בַּל עִמָּךְ
  choice: तुम्हारे साथ नहीं है
  rationale: मूल के संबंधपरक मुहावरे को बनाए रखते हुए बताता है कि उसका वास्तविक मनोभाव अतिथि के पक्ष में नहीं है।
