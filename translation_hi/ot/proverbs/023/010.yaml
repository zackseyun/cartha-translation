source:
  edition: WLC
  text: אַל תַּ֭סֵּג גְּב֣וּל עוֹלָ֑ם וּ/בִ/שְׂדֵ֥י יְ֝תוֹמִ֗ים אַל תָּבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/010.yaml
  text: Do not move an ancient boundary marker[a], and do not enter the fields of orphans,
translation:
  language: hi
  text: पुराने समय से चले आ रहे सीमा-चिह्न को मत खिसकाओ[a], और अनाथों के खेतों में प्रवेश मत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुरानी सीमा को मत हटाओ।”
    reason: मूल में ‘सीमा’ और उसे हटाने या पीछे सरकाने—दोनों अर्थ-संभावनाएँ बनी रहती हैं।
lexical_decisions:
- source_word: תַּסֵּג
  choice: खिसकाओ
  rationale: यहाँ क्रिया का अर्थ संपत्ति की सीमा पर अतिक्रमण करने के लिए सीमा-चिह्न को उसके स्थान से हटाना है। ‘खिसकाओ’ इस आशय को स्वाभाविक और ठोस रूप में व्यक्त करता है।
- source_word: גְּבוּל
  choice: सीमा-चिह्न
  rationale: शब्द सामान्यतः सीमा या सरहद को दर्शा सकता है, पर इस भूमि-संपत्ति के प्रसंग में सीमा निर्धारित करने वाला ठोस चिह्न अभिप्रेत है।
- source_word: עוֹלָם
  choice: पुराने समय से चला आ रहा
  rationale: यहाँ अर्थ अनन्त नहीं, बल्कि बहुत पहले से स्थापित और दीर्घकाल से मान्य सीमा का है।
- source_word: וּ/בִ/שְׂדֵי
  choice: और ... के खेतों में
  rationale: गति-सूचक क्रिया के साथ ב खेतों के भीतर जाने या घुसने का भाव देता है।
- source_word: יְתוֹמִים
  choice: अनाथों
  rationale: शब्द विशेषतः पिता से वंचित बच्चों को सूचित कर सकता है; आधुनिक हिन्दी में ‘अनाथ’ स्पष्ट, सहज और सम्मानजनक है।
- source_word: תָּבֹא
  choice: प्रवेश मत करो
  rationale: पूर्वसर्गयुक्त पद के साथ क्रिया किसी की भूमि में जाने का निषेध व्यक्त करती है; ‘प्रवेश मत करो’ मूल का सीधा अर्थ बनाए रखता है, जबकि अतिक्रमण का आशय प्रसंग से स्पष्ट होता है।
