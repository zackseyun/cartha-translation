  text: הָבִ֣יאָ/ה לַ/מּוּסָ֣ר לִבֶּ֑/ךָ וְ֝/אָזְנֶ֗/ךָ לְ/אִמְרֵי דָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/012.yaml
  text: Apply your heart to instruction[a], and your ear to words of knowledge.
translation:
  language: hi
  text: 'अपने मन को शिक्षा[a] की ओर लगाओ,

    और अपने कान को ज्ञान की बातों की ओर लगाओ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने मन को अनुशासन की ओर ले आओ, और अपने कान को ज्ञान के वचनों की ओर लगाओ।”
    reason: מוּסָר का अर्थ ‘अनुशासन’ भी हो सकता है, और הָבִיאָה का अधिक शाब्दिक अर्थ ‘ले आओ’ है।
lexical_decisions:
- source_word: הָבִיאָה
  choice: की ओर लगा
  rationale: हिफ़ील आज्ञार्थक का मूल भाव ‘ले आ/पहुँचा’ है; हिन्दी में मन को किसी ओर ‘लगाना’ जानबूझकर ध्यान और इच्छा को उधर करने का स्वाभाविक मुहावरा है।
- source_word: לַמּוּסָר
  choice: शिक्षा
  rationale: מוּסָר में शिक्षा, अनुशासन और सुधार—तीनों का भाव हो सकता है। ‘ज्ञान की बातों’ के समानांतर यहाँ ‘शिक्षा’ सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לִבֶּךָ
  choice: अपने मन को
  rationale: इब्रानी לֵב बुद्धि, इच्छा और भीतरी व्यक्ति को सूचित करता है। आधुनिक हिन्दी में इस प्रसंग में ‘मन’ केवल भावनाओं की अपेक्षा ध्यान और संकल्प को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאָזְנֶךָ
  choice: और अपना कान
  rationale: स्रोत का एकवचन और ‘मन’ के साथ काव्यात्मक समानांतर सुरक्षित रखा गया है।
- source_word: לְאִמְרֵי
  choice: की बातों की ओर
  rationale: אִמְרֵי का अर्थ ‘बातें/वचन/कथन’ है। ‘बातों’ आधुनिक और सहज है; दोहराया गया ‘की ओर’ पहले खंड की क्रिया को दूसरे खंड पर भी लागू करता है।
- source_word: דָעַת
  choice: ज्ञान
  rationale: דַּעַת का सीधा और इस ज्ञान-साहित्य प्रसंग में उपयुक्त समतुल्य ‘ज्ञान’ है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण ज्ञान-साहित्य शैली। एकवचन अनौपचारिक आज्ञार्थक ‘लगा’ स्रोत के 2 पुल्लिंग एकवचन संबोधन को दर्शाता है; पंक्ति-विन्यास इब्रानी समानांतरता स्पष्ट करता है।
