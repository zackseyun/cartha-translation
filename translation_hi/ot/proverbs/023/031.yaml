base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/031.yaml
  text: Do not look at wine when it is red[a], when it sparkles in the cup[b], when it goes down smoothly.
translation:
  language: hi
  text: 'दाखमधु को मत देखना जब वह लाल दिखाई दे,

    जब वह प्याले में अपनी चमक दिखाए[a],

    और आसानी से गले उतर जाए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब वह प्याले में अपनी आँख देता है”; यह दाखमधु के आकर्षक रूप का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब वह सीधाई से चलता जाए”; यहाँ आशय संभवतः उसके आसानी और सहजता से गले उतरने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תֵּרֶא
  choice: नज़र मत लगाना
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। संदर्भ में ראה केवल अनायास देखने के बजाय आकर्षण से ध्यान टिकाने का भाव रखता है; इसलिए स्वाभाविक हिन्दी में ‘नज़र मत लगाना’ चुना गया।
- source_word: יַיִן
  choice: दाखमधु
  rationale: יַיִן अंगूर से बने मादक पेय को दर्शाता है। ‘दाखमधु’ आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट और गरिमापूर्ण है।
- source_word: כִּי יִתְאַדָּם
  choice: जब दाखमधु लाल दिखाई दे
  rationale: התאדם यहाँ लाल रंग दिखाने या लाल प्रतीत होने का भाव देता है। इस काव्यात्मक क्रम में כִּי को परिस्थितिवाचक ‘जब’ माना गया है, यद्यपि उसका कारणवाचक अर्थ भी संभव है।
- source_word: כִּי יִתֵּן בַּכּוֹס עֵינוֹ
  choice: जब वह प्याले में अपनी चमक दिखाए
  rationale: शाब्दिक रूप ‘जब वह प्याले में अपनी आँख दे’ है। यह दाखमधु के आकर्षक दृश्य रूप का मुहावरा है; ‘अपनी चमक दिखाए’ उस चित्र को सहज हिन्दी में व्यक्त करता है।
- source_word: יִתְהַלֵּךְ בְּמֵישָׁרִים
  choice: आसानी से गले उतर जाए
  rationale: शाब्दिक अर्थ ‘सीधाई में चलता जाए’ जैसा है। पेय के संदर्भ में यह उसके सहज, सुचारु रूप से पी लिए जाने का भाव देता है; ‘गले उतर जाए’ हिन्दी का स्वाभाविक समतुल्य है।
