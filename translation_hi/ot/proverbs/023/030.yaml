  text: For those who linger over wine[a], for those who come to search out mixed wine.
translation:
  language: hi
  text: 'जो देर तक दाखमधु पीते रहते हैं,


    जो मिश्रित दाखमधु[a] ढूँढ़ने आते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसालेदार दाखमधु” अथवा “मिश्रित पेय।” इब्रानी शब्द ऐसे दाखमधु को दर्शाता है जिसमें स्वाद या मादक प्रभाव बढ़ाने के लिए अन्य सामग्री मिलाई गई हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֲרִים עַל הַיָּיִן
  choice: दाखमधु पीते देर तक बैठे रहते हैं
  rationale: यह पदबंध दाखमधु के पास या उसे पीते हुए लंबे समय तक ठहरे रहने का भाव देता है। हिंदी में यह रूप दीर्घ और आसक्त सेवन का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּאִים
  choice: आते हैं
  rationale: मूल क्रिया का सीधा अर्थ ‘आना’ है; प्रयोजनसूचक क्रिया के साथ भी हिंदी में यह सहज और स्रोत के निकट है।
- source_word: לַחְקֹר
  choice: ढूँढ़ने
  rationale: यहाँ क्रिया सक्रिय रूप से खोजने या तलाश करने का संकेत देती है; ‘ढूँढ़ने’ सामान्य आधुनिक हिंदी में यही भाव रखता है।
- source_word: מִמְסָךְ
  choice: मसाला मिला दाखमधु
  rationale: संज्ञा मिले-जुले पेय, विशेषतः किसी सामग्री या मसाले से तैयार दाखमधु, को दर्शाती है। ‘मसाला मिला दाखमधु’ संभावित प्राचीन संदर्भ को स्पष्ट रखते हुए मिश्रण का मूल भाव बनाए रखता है।
