  edition: WLC
  text: אַל יְקַנֵּ֣א לִ֭בְּ/ךָ בַּֽ/חַטָּאִ֑ים כִּ֥י אִם בְּ/יִרְאַת יְ֝הוָ֗ה כָּל הַ/יּֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/017.yaml
  text: Do not let your heart envy sinners[a], but be in the fear of Yahweh all day long.
translation:
  language: hi
  text: तेरा मन पापियों से ईर्ष्या न करे[a], बल्कि दिन भर यहोवा के भय में रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा मन पापियों से न जले।”
    reason: קנא के ईर्ष्या अथवा जलन व्यक्त करने वाले निकटवर्ती अर्थ का हिंदी विकल्प।
lexical_decisions:
- source_word: אַל יְקַנֵּא
  choice: ईर्ष्या न करे
  rationale: निषेधात्मक אַל और קנא के यहाँ प्रयुक्त ईर्ष्या के भाव को स्वाभाविक तथा संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: לִבְּךָ
  choice: तेरा मन
  rationale: हिब्रू ‘हृदय’ व्यक्ति के भीतरी विचारों और इच्छाओं का केंद्र है; इस संदर्भ में ‘मन’ आधुनिक हिंदी में वही अर्थ अधिक स्वाभाविक रूप से देता है।
- source_word: בַּחַטָּאִים
  choice: पापियों से
  rationale: यह शब्द पाप से पहचाने जाने वाले लोगों को सीधे रूप में दर्शाता है; ईर्ष्या के साथ हिंदी में ‘से’ स्वाभाविक संबंधसूचक है।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: यह ‘यह नहीं, बल्कि वह’ वाला सुधारात्मक विरोध स्पष्ट करता है।
- source_word: בְּיִרְאַת יְהוָה
  choice: यहोवा के भय में
  rationale: नीतिवचन की प्रमुख बाइबलीय अभिव्यक्ति ‘यहोवा का भय’ को व्याख्यात्मक रूप से केवल ‘श्रद्धा’ बना देने के बजाय सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णी ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כָּל הַיּוֹם
  choice: दिन भर
  rationale: पूरे दिन की अवधि को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: दूसरे, क्रियारहित उपवाक्य का अर्थ
  choice: ‘तेरा मन’ को निहित कर्ता मानकर ‘यहोवा के भय में रहे’
  alternative: ‘यहोवा का भय मानता रहे’
  rationale: मूल हिब्रू में दूसरे उपवाक्य की क्रिया निहित है। ‘में रहे’ पूर्वसर्गीय रचना को निकटता से सुरक्षित रखता है और ‘लगातार बने रहने’ जैसी अतिरिक्त व्याख्या स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन का एकवचन ‘तेरा’ मूल के एकवचन रूप को बनाए रखता है। भाषा सहज, संक्षिप्त और गरिमापूर्ण रखी गई है।
