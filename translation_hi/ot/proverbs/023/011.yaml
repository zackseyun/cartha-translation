id: PRO.23.11
reference: Proverbs 23:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי גֹאֲלָ֥/ם חָזָ֑ק הֽוּא יָרִ֖יב אֶת רִיבָ֣/ם אִתָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/011.yaml
  text: for their Redeemer is strong[a]; he will plead their case against you.
translation:
  language: hi
  text: क्योंकि उनका छुड़ानेवाला[a] सामर्थी है; वह स्वयं तुम्हारे विरुद्ध उनका मुक़दमा लड़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका निकट संबंधी-उद्धारक” अथवा “उन्हें न्याय दिलानेवाला।” हिब्रू शब्द גֹאֵל उस व्यक्ति को दर्शाता है जो अपने परिवार के किसी सदस्य को छुड़ाने, उसकी रक्षा करने या उसे न्याय दिलाने के लिए आगे आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण बताता है और हिब्रू के कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גֹאֲלָם
  choice: उनका छुड़ानेवाला
  rationale: גאל परिवार-सदस्य को छुड़ाने, उसकी रक्षा करने या उसे न्याय दिलाने वाले व्यक्ति को दर्शाता है। ‘छुड़ानेवाला’ पद की मुक्ति और संरक्षण—दोनों संबंधी प्रतिध्वनियों को बनाए रखता है; वैकल्पिक कानूनी-पारिवारिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: חָזָק
  choice: सामर्थी
  rationale: यह उनकी ओर से प्रभावी ढंग से कार्य करने की शक्ति और योग्यता पर बल देता है। ‘सामर्थी’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: הוּא
  choice: वह स्वयं
  rationale: स्वतंत्र सर्वनाम के बलाघात को ‘स्वयं’ द्वारा व्यक्त किया गया है।
- source_word: יָרִיב אֶת רִיבָם
  choice: उनका मुक़दमा लड़ेगा
  rationale: क्रिया और उसी मूल से बने संज्ञा-पद का मेल कानूनी विवाद का भाव रखता है। यह हिन्दी अभिव्यक्ति उस न्यायिक चित्र को स्वाभाविक रूप से संप्रेषित करती है।
- source_word: אִתָּךְ
  choice: तुम्हारे विरुद्ध
  rationale: ריב के साथ यह पूर्वसर्ग यहाँ विरोधी पक्ष के विरुद्ध कानूनी संघर्ष को दर्शाता है।
theological_decisions:
- issue: नीतिवचन के संदर्भ में גֹאֵל का अनुवाद
  choice: छुड़ानेवाला
  alternative: निकट संबंधी-उद्धारक; न्याय दिलानेवाला
  rationale: यह चयन पद की व्यापक मुक्ति-संबंधी और धर्मवैधानिक गूँज को रखता है, पर यह अनावश्यक रूप से न तो केवल रक्त-संबंध निर्धारित करता है, न केवल प्रतिशोध। पादटिप्पणी इसके पारिवारिक और न्यायिक आयाम स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘मुक़दमा लड़ेगा’ कानूनी बिंब को सामान्य पाठक के लिए स्पष्ट करता है; ‘वह स्वयं’ मूल सर्वनाम के बलाघात को सुरक्षित रखता है।
