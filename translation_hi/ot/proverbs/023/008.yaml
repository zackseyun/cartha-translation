base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/008.yaml
  text: You will vomit up the morsel you have eaten[a], and you will waste your pleasant words.
translation:
  language: hi
  text: तूने जो कौर खाया है, उसे तू उगल देगा, और तू अपनी मनभावनी बातें व्यर्थ कर देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּתְּךָ
  choice: जो कौर
  rationale: פַּת भोजन के छोटे टुकड़े या कौर को दर्शाता है। यहाँ प्रत्यय के भाव को अगले क्रियापद के साथ स्वाभाविक हिंदी में ‘जो कौर खाया है’ द्वारा व्यक्त किया गया है।
- source_word: אָכַלְתָּ
  choice: तूने ... खाया है
  rationale: काल रूप पूर्ण हो चुकी क्रिया बताता है; हिंदी का पूर्ण वर्तमान आगामी परिणाम से उसका संबंध स्वाभाविक रूप से बनाए रखता है।
- source_word: תְקִיאֶנָּה
  choice: उसे तू उगल देगा
  rationale: קיא का अर्थ उलटी करके बाहर निकालना है। ‘उगल देगा’ हिंदी में संक्षिप्त और सजीव है तथा स्त्रीलिंग कर्म-प्रत्यय का संदर्भ ‘कौर’ की ओर ‘उसे’ से स्पष्ट करता है।
- source_word: וְשִׁחַתָּ
  choice: व्यर्थ हो जाएँगी
  rationale: इस प्रसंग में שׁחת का परिणाम यह है कि कही गई अच्छी बातें निष्फल चली जाती हैं। ‘व्यर्थ हो जाएँगी’ हिंदी में शब्दों के साथ स्वाभाविक है और अर्थ को अनावश्यक रूप से ‘नष्ट करना’ की ओर नहीं मोड़ता।
- source_word: דְּבָרֶיךָ
  choice: तेरी ... बातें
  rationale: बहुवचन דְּבָרִים को इस प्रसंग में ‘बातें’ कहना आधुनिक हिंदी में ‘शब्दों’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: הַנְּעִימִים
  choice: मनभावनी
  rationale: נעים सुखद, रुचिकर या मधुर होने का भाव देता है। ‘मनभावनी’ प्रशंसापूर्ण अथवा प्रसन्न करने वाली बातों की व्यापकता बनाए रखता है।
