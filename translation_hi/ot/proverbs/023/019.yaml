  text: שְׁמַע אַתָּ֣ה בְנִ֣/י וַ/חֲכָ֑ם וְ/אַשֵּׁ֖ר בַּ/דֶּ֣רֶךְ לִבֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/019.yaml
  text: Listen[a], my son, and be wise, and direct your heart in the way.
translation:
  language: hi
  text: मेरे बेटे, सुन और बुद्धिमान बन; अपने मन को मार्ग पर लगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुन, मेरे बेटे ... और अपने मन को मार्ग पर ले चल।”
    reason: वְאַשֵּׁר के लिए ‘दिशा देना/ले चलना’ का स्वाभाविक वैकल्पिक अनुवाद; इब्रानी रूपक को बनाए रखता है।
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: आज्ञार्थक रूप है। हिंदी में ‘सुन’ केवल ध्वनि ग्रहण करने के बजाय ध्यान देकर मानने का भाव भी स्वाभाविक रूप से व्यक्त कर सकता है।
- source_word: בְנִי
  choice: हे मेरे बेटे
  rationale: मूल पाठ का संबोधन पुल्लिंग एकवचन है और पिता-पुत्र ज्ञानोपदेश की शैली को बनाए रखता है। ‘हे’ संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: וַחֲכָם
  choice: और बुद्धिमान बन
  rationale: आज्ञार्थक क्रिया यहाँ बुद्धि प्राप्त करने और उसके अनुसार आचरण करने का आह्वान करती है; ‘बुद्धिमान बन’ हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וְאַשֵּׁר
  choice: लगा
  rationale: पिएल आज्ञार्थक का भाव सीधा करने, दिशा देने या उचित ओर प्रवृत्त करने का है। ‘मन को ... मार्ग पर लगा’ हिंदी में इसी सक्रिय दिशा-निर्धारण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּדֶּרֶךְ
  choice: सही मार्ग पर
  rationale: דרך आचरण के मार्ग का रूपक है। निश्चित पद के कारण संदर्भित उचित मार्ग का भाव है; हिंदी में ‘सही मार्ग पर’ अपेक्षित नैतिक दिशा को सहज ढंग से व्यक्त करता है।
- source_word: לִבֶּךָ
  choice: अपने मन को
  rationale: इब्रानी ‘हृदय’ विचार, इच्छा और अभिलाषा के भीतरी केंद्र को दर्शाता है। आधुनिक हिंदी में इस वाक्य-संयोजन में ‘मन’ वही व्यापक आंतरिक भाव अधिक सहजता से देता है।
theological_decisions:
- issue: ज्ञानोपदेश में पुत्र के लिए लिंग-विशिष्ट संबोधन
  choice: हे मेरे बेटे
  alternative: हे मेरे बच्चे
  rationale: इब्रानी संबोधन स्पष्ट रूप से पुल्लिंग एकवचन है; इसलिए उसे लिंग-निरपेक्ष नहीं किया गया।
- issue: לב का मानव-अंतरंग संबंधी अर्थ
  choice: अपने मन को
  alternative: अपने हृदय को
  rationale: यहाँ शब्द विचार, इच्छा और नैतिक दिशा के केंद्र को सूचित करता है। ‘मन’ आधुनिक हिंदी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘हृदय’ अधिक औपचारिक और शाब्दिक विकल्प है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण ज्ञानोपदेशात्मक शैली। संबोधन का पुल्लिंग एकवचन रूप सुरक्षित रखा गया है। समानांतर आज्ञाओं की लय बनाए रखते हुए अंतिम खंड को स्वाभाविक हिंदी मुहावरे में रखा गया है।
