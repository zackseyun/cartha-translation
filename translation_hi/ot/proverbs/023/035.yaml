base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/035.yaml
  text: “They struck me[a], but I was not hurt; they beat me, but I did not know it[b]. When shall I awake? I will seek it again.”
translation:
  language: hi
  text: “उन्होंने मुझे मारा, पर मुझे चोट नहीं लगी; उन्होंने मुझे पीटा, पर मुझे इसका पता ही नहीं चला। मैं कब जागूँगा? मैं फिर उसी को ढूँढ़ूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसी” से आशय आसपास के प्रसंग के अनुसार सम्भवतः दाखमधु या मादक पेय है।
    reason: cross_reference
lexical_decisions:
- source_word: הִכּוּנִי
  choice: उन्होंने मुझे मारा
  rationale: נכה का सामान्य अर्थ मारना या प्रहार करना है। ‘मारा’ सहज आधुनिक हिन्दी है और पहले क्रियापद को अगले ‘पीटा’ से अलग रखता है।
- source_word: בַל חָלִיתִי
  choice: पर मुझे चोट नहीं लगी
  rationale: חלה यहाँ मार खाने के संदर्भ में घायल या पीड़ित होने का भाव देता है। यह अनुवाद नशे से उत्पन्न संवेदनहीनता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֲלָמוּנִי
  choice: उन्होंने मुझे पीटा
  rationale: הלם प्रहार करने या पीटने का अर्थ देता है। ‘पीटा’ समानांतरता बनाए रखते हुए पहले ‘मारा’ से शब्दगत भिन्नता सुरक्षित रखता है।
- source_word: בַל יָדָעְתִּי
  choice: पर मुझे इसका पता ही नहीं चला
  rationale: ידע का मूल अर्थ जानना है; इस प्रसंग में नशे के कारण प्रहारों का भान न होना अभिप्रेत है। ‘पता ही नहीं चला’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מָתַי אָקִיץ
  choice: मैं कब जागूँगा?
  rationale: יקץ जागने का सीधा बोध देता है। इसे ‘होश में आऊँगा’ बनाना सम्भव होता, पर वह मूल रूपक की व्याख्या कर देता।
- source_word: אוֹסִיף אֲבַקְשֶׁנּוּ עוֹד
  choice: मैं फिर उसी को ढूँढ़ूँगा
  rationale: יסף और עוד पुनरावृत्ति का भाव देते हैं, जबकि בקש खोजने का। पुल्लिंग एकवचन प्रत्यय का संदर्भ आसपास के प्रसंग में मदिरा से है; ‘उसी को’ संकेत को बनाए रखता है।
