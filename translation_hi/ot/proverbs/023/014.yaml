  text: You shall strike him with the rod[b][a], and you will deliver his life from Sheol.
translation:
  language: hi
  text: तुम उसे छड़ी से मारोगे, और उसके जीवन[a] को शिओल[b] से बचाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके प्राण” अथवा “उसकी आत्मा।” इब्रानी शब्द नेफ़ेश का अर्थ प्रसंग के अनुसार “जीवन,” “स्वयं,” “प्राण,” या “आत्मा” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शिओल मृतकों के लोक के लिए प्रयुक्त इब्रानी शब्द है; इसका अनुवाद “कब्र” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשֵּׁבֶט
  choice: छड़ी से
  rationale: שֵׁבֶט का अर्थ छड़ी, डंडा या राजदंड हो सकता है। माता-पिता द्वारा अनुशासन के इस प्रसंग में “छड़ी” ठोस साधन को स्वाभाविक और स्पष्ट रूप से व्यक्त करती है।
- source_word: תַּכֶּנּוּ
  choice: उसे मारेगा
  rationale: נכה का हिफ़ील रूप यहाँ सीधे शारीरिक प्रहार को दर्शाता है। “मारेगा” मूल कथन की स्पष्टता बनाए रखता है; केवल “अनुशासन देगा” कहना क्रिया को अनावश्यक रूप से नरम और व्याख्यात्मक बना देता।
- source_word: נַפְשׁוֹ
  choice: उसके जीवन
  rationale: נֶפֶשׁ प्रसंग के अनुसार जीवन, स्वयं या प्राण/आत्मा को सूचित कर सकता है। शिओल से बचाने के समानांतर “जीवन” मृत्यु से बचाए जाने का भाव स्वाभाविक रूप से देता है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- source_word: מִשְּׁאוֹל
  choice: शिओल से
  rationale: שְׁאוֹל को लिप्यंतरित करके इब्रानी अवधारणा को केवल “कब्र” या किसी अधिक निश्चित परलोक-सिद्धांत तक सीमित नहीं किया गया है। अर्थ पाठक के लिए फुटनोट में दिया गया है।
- source_word: תַּצִּיל
  choice: बचाएगा
  rationale: נצל के हिफ़ील का अर्थ छुड़ाना या बचाना है। “बचाएगा” आधुनिक हिन्दी में स्वाभाविक है और शिओल से रक्षा का भाव स्पष्ट करता है।
theological_decisions:
- issue: शिओल के संबंध में נֶפֶשׁ का अर्थ
  choice: उसके जीवन
  alternative: उसके प्राण या उसकी आत्मा
  rationale: नीतिवचन का कथन उस मार्ग से बच्चे को बचाने की बात करता है जो मृत्यु की ओर ले जाता है। “जीवन” इब्रानी मुहावरे को स्पष्ट रखता है और इस एक पद से शरीर तथा आत्मा के संबंध पर कोई विशिष्ट मत आरोपित नहीं करता; दूसरी सम्भावना फुटनोट में बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। एकवचन सम्बोधन के लिए “तू” मूल इब्रानी के निकट और नीतिवचन की अभिभावकीय शिक्षा के अनुकूल है। “शिओल” को बनाए रखने से मूल अवधारणा की व्यापकता और अस्पष्टता सुरक्षित रहती है।
