  yaml_path: translation/ot/proverbs/023/001.yaml
  text: When you sit down to dine with a ruler[a], carefully consider what is before you.
translation:
  language: hi
  text: जब तुम किसी शासक के साथ भोजन करने बैठो, तो अपने सामने जो है, उसे भली-भाँति समझ लो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो तुम्हारे सामने परोसा गया है।’ इब्रानी वाक्यांश विशेष रूप से मेज़ पर रखे भोजन का संकेत कर सकता है, पर वह सामने की व्यापक परिस्थिति का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי कारण नहीं, बल्कि व्यावहारिक परिस्थिति प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: תֵשֵׁב לִלְחוֹם
  choice: भोजन करने बैठो
  rationale: ישׁב के बैठने और לחם के भोजन करने—दोनों ठोस भावों को सहज हिन्दी में बनाए रखता है।
- source_word: אֶת־מוֹשֵׁל
  choice: किसी शासक के साथ
  rationale: מוֹשֵׁל अधिकार रखने वाले व्यक्ति को सूचित करता है। भोजन के प्रसंग में אֶת का साथ-संबंधी अर्थ हिन्दी में ‘के साथ’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בִּין תָּבִין
  choice: भली-भाँति ध्यान दो
  rationale: क्रिया के साथ infinitive absolute तीव्रता और सावधानी का भाव देता है। यह अभिव्यक्ति उसी जोर को साधारण आधुनिक हिन्दी में व्यक्त करती है।
- source_word: אֶת אֲשֶׁר לְפָנֶיךָ
  choice: अपने सामने रखी हुई चीज़ पर
  rationale: वाक्यांश सामने उपस्थित वस्तु, विशेषकर परोसे भोजन, को सूचित कर सकता है। ‘चीज़’ संदर्भ को खुला रखती है, यद्यपि ‘रखी हुई’ भोजन की मेज़ की ओर कुछ अधिक संकेत करती है।
