  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शासक’ מוֹשֵׁל का व्यापक अधिकार-सूचक अर्थ बनाए रखता है। मूल इब्रानी की बलाघाती रचना בִּין תָּבִין को ‘भली-भाँति ध्यान दो’ से व्यक्त किया गया है।
