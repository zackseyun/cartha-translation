  text: אַל תִּ֭תְאָו לְ/מַטְעַמּוֹתָ֑י/ו וְ֝/ה֗וּא לֶ֣חֶם כְּזָבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/003.yaml
  text: Do not crave his delicacies[a], for they are deceptive food.
translation:
  language: hi
  text: उसके स्वादिष्ट व्यंजनों की लालसा न करना, क्योंकि वह छल का भोजन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּתְאָו
  choice: लालसा न करना
  rationale: निषेधात्मक אַל के साथ क्रिया तीव्र आंतरिक इच्छा को व्यक्त करती है। यह हिंदी में स्वाभाविक और चेतावनीपूर्ण है।
- source_word: לְמַטְעַמּוֹתָיו
  choice: उसके स्वादिष्ट व्यंजनों की
  rationale: מַטְעַמּוֹת स्वादिष्ट, मनभावने पकवानों को दर्शाता है; ‘स्वादिष्ट व्यंजन’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: וְהוּא
  choice: क्योंकि वह
  rationale: वाव यहाँ अगले कथन को निषेध का कारण बताने वाले रूप में जोड़ता है। पुल्लिंग एकवचन सर्वनाम को ज्यों का त्यों रखा गया है, जो सामूहिक भोजन अथवा भोज की ओर संकेत कर सकता है।
- source_word: לֶחֶם כְּזָבִים
  choice: छल का भोजन
  rationale: לֶחֶם का व्यापक अर्थ ‘भोजन’ है और כְּזָבִים का शाब्दिक संबंध झूठों/छलों से है। ‘छल का भोजन’ मूल रूपक और उसकी जानबूझकर रखी गई अर्थगत कसावट को सुरक्षित रखता है।
theological_decisions:
- issue: भोजन के छलपूर्ण होने का आशय
  choice: ‘छल का भोजन’ कहकर रूपक को खुला रखा गया
  alternative: ‘धोखा देने वाला भोजन’ या ‘उस भोजन के पीछे छल है’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि भोजन स्वयं भ्रामक है, मेज़बान के इरादे छलपूर्ण हैं, या भोज किसी छिपे उद्देश्य का साधन है; इसलिए अनुवाद किसी एक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण नीतिवचन-शैली। ‘व्यंजन’ और ‘भोजन’ साधारण पाठक के लिए परिचित हैं, जबकि ‘छल का भोजन’ मूल इब्रानी रूपक को बनाए रखता है।
