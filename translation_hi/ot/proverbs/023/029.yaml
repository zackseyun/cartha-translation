base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/029.yaml
  text: Who has woe? Who has sorrow? Who has strife? Who has complaining? Who has wounds for nothing? Who has redness of eyes?[a][b][c]
translation:
  language: hi
  text: किसे हाय है? किसे संताप है? किसके झगड़े हैं? किसकी शिकायतें हैं? किसे बेवजह घाव लगते हैं?[a] किसकी आँखें लाल हैं?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना कारण घाव लगते हैं?”
    reason: lexical_alternative
  - marker: b
    text: या “किसकी आँखों में लाली है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: हाय
  rationale: विपत्ति और व्यथा की संक्षिप्त पुकार को बनाए रखता है और नीतिवचन की तीखी प्रश्न-शैली के अनुकूल है।
- source_word: אֲבוֹי
  choice: संताप
  rationale: पहले पद 'हाय' से भेद रखते हुए विलाप, दुःख और मानसिक पीड़ा का भाव व्यक्त करता है।
- source_word: מדונים
  choice: झगड़े
  rationale: बहुवचन संज्ञा बार-बार होने वाले विवादों और कलह को दर्शाती है; 'झगड़े' साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: שִׂיחַ
  choice: शिकायतें
  rationale: इस संदर्भ में वाणी, शिकायत या व्यथित मनन के संभावित अर्थों में से 'शिकायतें' प्रसंग के अनुकूल है, पर अर्थ को नशे की बड़बड़ाहट तक सीमित नहीं करता।
- source_word: פְּצָעִים
  choice: घाव
  rationale: शारीरिक चोटों के ठोस और सजीव अर्थ को सीधे व्यक्त करता है।
- source_word: חִנָּם
  choice: बेवजह
  rationale: निरर्थक या बिना कारण लगी चोट का अर्थ स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: חַכְלִלוּת עֵינָיִם
  choice: आँखें लाल रहती हैं
  rationale: मदिरापान से जुड़ी आँखों की बदली हुई लाल अवस्था को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है, जबकि 'रक्ताभ आँखें' अपेक्षाकृत कृत्रिम होता।
- source_word: לְמִי
  choice: किस पर / किसके / किसको / किसकी
  rationale: दोहराए गए इब्रानी 'किसके लिए/किसको?' को प्रत्येक हिन्दी संज्ञा और मुहावरे के अनुसार विभक्ति बदलकर प्रस्तुत किया गया है, साथ ही प्रश्नात्मक पुनरावृत्ति कायम रखी गई है।
