  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नीतिवचनात्मक शैली रखी गई है। ‘मूर्ख’ पारंपरिक ज्ञान-साहित्यिक पद है; ‘समझ’ सामान्य पाठक के लिए सहज है और मूल शब्द की अर्थ-सीमा को खुला रखता है।
