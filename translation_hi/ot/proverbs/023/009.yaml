  text: בְּ/אָזְנֵ֣י כְ֭סִיל אַל תְּדַבֵּ֑ר כִּֽי יָ֝ב֗וּז לְ/שֵׂ֣כֶל מִלֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/009.yaml
  text: Do not speak in the hearing of a fool[b][a], for he will despise the wisdom of your words.
translation:
  language: hi
  text: मूर्ख के सुनते हुए मत बोलो,[a] क्योंकि वह तुम्हारी बातों की समझ को तुच्छ जानेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मूर्ख के कानों में मत बोलो।”
    reason: lexical_alternative
  - marker: b
    text: या “वह तुम्हारी बातों की सूझ-बूझ का तिरस्कार करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/אָזְנֵי
  choice: के सुनते हुए
  rationale: शाब्दिक अर्थ ‘कानों में’ है; यह मुहावरा ऐसी निकटता में बोलने को दर्शाता है जहाँ व्यक्ति सुन सके। ‘के सुनते हुए’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस भाव को सुरक्षित रखता है।
- source_word: כְסִיל
  choice: मूर्ख
  rationale: नीतिवचन में यह केवल कम बुद्धि वाले व्यक्ति के लिए नहीं, बल्कि नैतिक और बौद्धिक रूप से हठी व्यक्ति के लिए प्रयुक्त मानक ज्ञान-साहित्यिक शब्द है।
- source_word: אַל תְּדַבֵּר
  choice: मत बोलो
  rationale: निषेधात्मक आदेश का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले निषेध का कारण बताता है।
- source_word: יָב֗וּז
  choice: तुच्छ जानेगा
  rationale: क्रिया अवमानना और तिरस्कारपूर्ण अस्वीकार को व्यक्त करती है; ‘तुच्छ जानना’ हिन्दी में इस बल को स्पष्ट रखता है।
- source_word: לְ/שֵׂכֶל
  choice: समझ को
  rationale: שֵׂכֶל यहाँ विवेक, सूझ-बूझ या सार्थक समझ का संकेत देता है। ‘समझ’ सरल और व्यापक है तथा इसे पूर्ण ‘बुद्धि’ या ‘ज्ञान’ बनाकर अर्थ को अनावश्यक रूप से नहीं बढ़ाता। उपसर्ग ל को בזה के साथ तिरस्कार के कर्म को चिह्नित करने वाला माना गया है।
- source_word: מִלֶּֽי/ךָ
  choice: तुम्हारी बातों की
  rationale: यह ‘तुम्हारे शब्दों/कथनों’ का बहुवचन रूप है। ‘तुम्हारी बातों की समझ’ हिन्दी में संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
