lexical_decisions:
- source_word: וְ/שַׂמְתָּ
  choice: तो ... रख लो
  rationale: वाव से जुड़ा पूर्ण रूप पिछले पद की शिक्षा को आगे बढ़ाता है और यहाँ आदेश-सदृश अर्थ देता है; हिन्दी की यदि–तो रचना में इसे स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: שַׂכִּין
  choice: छुरी
  rationale: यह संज्ञा सामान्य काटने वाली छुरी को दर्शाती है; चयन चेतावनी के सजीव अतिशयोक्तिपूर्ण बिंब को बनाए रखता है।
- source_word: בְּ/לֹעֶךָ
  choice: अपने गले पर
  rationale: לֹעַ का अर्थ गला या कंठ है। שׂים के साथ हिन्दी में ‘गले पर ... रख’ स्वाभाविक है और मूल बिंब सुरक्षित रहता है।
- source_word: אִם
  choice: यदि
  rationale: शर्त सूचित करने वाले अव्यय को औपचारिक किंतु सामान्य आधुनिक हिन्दी में ‘यदि’ कहा गया है।
- source_word: בַּעַל נֶפֶשׁ
  choice: भूख के वश में रहते हो
  rationale: शाब्दिक रूप से यह ‘प्राण/लालसा का स्वामी’ है, पर भोजन के प्रसंग में तीव्र भूख या खाने की लालसा से नियंत्रित व्यक्ति का मुहावरा है। यह अनुवाद अर्थ स्पष्ट करता है, पर ‘पेटू’ कहकर आवश्यकता से अधिक निश्चित नहीं बनाता।
- source_word: אָתָּה
  choice: तुम ... रहते हो
  rationale: स्वतंत्र द्वितीय पुरुष एकवचन सर्वनाम को हिन्दी में स्पष्ट ‘तुम’ द्वारा व्यक्त किया गया है।
