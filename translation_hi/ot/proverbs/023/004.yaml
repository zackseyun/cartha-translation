  text: אַל תִּיגַ֥ע לְֽ/הַעֲשִׁ֑יר מִֽ/בִּינָתְ/ךָ֥ חֲדָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/004.yaml
  text: Do not wear yourself out to get rich[a]; stop relying on your own understanding.
translation:
  language: hi
  text: धनी बनने के लिए अपने आपको मत थका[a]; अपनी ही समझ पर भरोसा करना छोड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धनी बनने के लिए कठिन परिश्रम मत कर; अपनी समझ से बाज़ आ।”
    reason: יגע और חֲדָל מִבִּינָתְךָ के अधिक शाब्दिक अनुवाद तथा दूसरे अर्धपद की संक्षिप्तता को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: אַל תִּיגַע
  choice: अपने आपको मत थका
  rationale: יגע थका देने वाले परिश्रम और स्वयं को खपा देने का भाव रखता है; निषेध के साथ यह स्वाभाविक और चेतावनीपूर्ण हिन्दी है।
- source_word: לְהַעֲשִׁיר
  choice: धनी बनने के लिए
  rationale: यहाँ हिफ़ील क्रिया का अनंत रूप परिश्रम के लक्ष्य—धनी होना—को व्यक्त करता है।
- source_word: מִבִּינָתְךָ
  choice: अपनी ही समझ पर भरोसा करना
  rationale: בינה का अर्थ समझ या सूझ-बूझ है। חֲדָל के साथ लगे מִן को स्वाभाविक हिन्दी में निर्भरता से बाज़ आने के रूप में व्यक्त किया गया है; ‘ही’ आत्मनिर्देशित समझ पर बल देता है।
- source_word: חֲדָל
  choice: छोड़ दे
  rationale: आज्ञार्थक रूप का अर्थ रुकना, बाज़ आना या छोड़ देना है; संयुक्त वाक्यांश में ‘भरोसा करना छोड़ दे’ सहज हिन्दी है।
theological_decisions:
- issue: दूसरे अर्धपद का संक्षिप्त और अस्पष्ट संबंध
  choice: अपनी ही समझ पर भरोसा करना छोड़ दे
  alternative: अपनी समझ से बाज़ आ
  rationale: इब्रानी पदबंध संक्षिप्त है। मुख्य पाठ उस अर्थ को स्पष्ट करता है कि धन पाने के लिए अपनी चतुराई पर निर्भर न रहा जाए, जबकि पादटिप्पणी अधिक शाब्दिक संभावना को सुरक्षित रखती है। इससे नीतिवचन में समझ के सामान्यतः सकारात्मक मूल्य को निरस्त नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन एकवचन और अनौपचारिक आज्ञार्थक है, जैसा नीतिवचन की पिता-सदृश शिक्षा में स्वाभाविक है। भाषा सरल, गरिमापूर्ण और बोलचाल में बोधगम्य रखी गई है।
