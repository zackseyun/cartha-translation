base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/028.yaml
  text: Indeed[a], she lies in wait like a robber[b], and she increases the treacherous among men.
translation:
  language: hi
  text: निश्चय ही वह लुटेरे[a] के समान घात लगाती है, और मनुष्यों में विश्वासघातियों की संख्या बढ़ाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חֶתֶף दुर्लभ और अर्थ की दृष्टि से कठिन है। इसका अनुवाद ‘डाकू के समान’ भी हो सकता है; कुछ विद्वान इसे अधिक सामान्य रूप में हिंसक झपट्टा या अचानक आक्रमण समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: निश्चय ही
  rationale: यहाँ यह कण कथन पर बल देता है; ‘निश्चय ही’ आधुनिक हिन्दी में उस emphatic भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִיא
  choice: वह
  rationale: स्त्रीलिंग एकवचन सर्वनाम निकटवर्ती प्रसंग की पराई/व्यभिचारिणी स्त्री की ओर संकेत करता है; हिन्दी में क्रिया का स्त्रीलिंग रूप संदर्भ स्पष्ट रखता है।
- source_word: כְּחֶתֶף
  choice: लुटेरे के समान
  rationale: दुर्लभ और कठिन חֶתֶף को घात लगाने के संदर्भ में हिंसक ढंग से छीनने वाले व्यक्ति, अर्थात लुटेरे, के रूप में समझना सबसे संगत है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: תֶּאֱרֹב
  choice: घात लगाती है
  rationale: ארב छिपकर आक्रमण की प्रतीक्षा करने का भाव रखता है; ‘घात लगाना’ हिन्दी में सटीक और स्वाभाविक है।
- source_word: וּבוֹגְדִים
  choice: विश्वासघातियों
  rationale: בוגדים विश्वास या निष्ठा तोड़ने वालों की व्यापक नैतिक श्रेणी है; ‘विश्वासघाती’ इसे राजनीतिक अर्थ तक सीमित नहीं करता।
- source_word: בְּאָדָם
  choice: मनुष्यों में
  rationale: אָדָם यहाँ सामूहिक रूप से मानवजाति को सूचित करता है; ‘मनुष्यों में’ हिन्दी में स्वाभाविक और लिंग-समावेशी है।
- source_word: תּוֹסִף
  choice: की संख्या बढ़ाती है
  rationale: יסף का हिफ़ील रूप यहाँ कारणवाचक है—वह ऐसे लोगों को और बढ़ाती है; ‘संख्या बढ़ाती है’ आशय को स्पष्ट और सहज बनाता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घात लगाती है’ शिकारी और आक्रमणकारी बिंब को बनाए रखता है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] संबंधित कठिन इब्रानी शब्द के तुरंत बाद रखा गया है।
