  edition: WLC
  text: אַל תִּמְנַ֣ע מִ/נַּ֣עַר מוּסָ֑ר כִּֽי תַכֶּ֥/נּוּ בַ֝/שֵּׁ֗בֶט לֹ֣א יָמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/023/013.yaml
  text: Do not withhold discipline from a boy[a], for if you strike him with the rod[b], he will not die.
translation:
  language: hi
  text: बालक[a] से अनुशासन मत रोको, क्योंकि तुम उसे छड़ी[b] से मारोगे, तो वह नहीं मरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चे” अथवा “युवक।” इब्रानी संज्ञा किसी लड़के या अधिक व्यापक रूप से किसी कम आयु के व्यक्ति को सूचित कर सकती है; मुख्य पाठ कहावत के पुल्लिंग एकवचन रूप को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: कहावत का आशय है कि ऐसा सुधार अपने-आप में प्राणघातक नहीं है। इसे दुर्व्यवहारपूर्ण हिंसा की खुली स्वीकृति या हर परिस्थिति में लागू होने वाली निरपेक्ष गारंटी नहीं समझना चाहिए।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: वंचित न रखो
  rationale: निषेध के साथ מןע का अर्थ किसी आवश्यक वस्तु को रोक रखना या न देना है। ‘वंचित न रखो’ आधुनिक हिंदी में स्वाभाविक है और अनुशासन न देने की मनाही को स्पष्ट करता है।
- source_word: מִנַּעַר
  choice: बालक को
  rationale: נַעַר लड़के, बालक या युवक के लिए प्रयुक्त हो सकता है। घरेलू अनुशासन के प्रसंग और पुल्लिंग एकवचन रूप को बनाए रखने के लिए ‘बालक’ चुना गया है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מוּסָר
  choice: अनुशासन
  rationale: नीतिवचन में यह शब्द शिक्षा, सुधार और प्रशिक्षण से युक्त सुधारात्मक अनुशासन को व्यक्त करता है; निकटवर्ती छड़ी की छवि के कारण केवल ‘शिक्षा’ कहना अपर्याप्त होता।
- source_word: כִּי
  choice: क्योंकि यदि
  rationale: यह निषेध का आधार प्रस्तुत करता है। अगले कथन की परिस्थितिजन्य शक्ति को स्वाभाविक हिंदी में व्यक्त करने के लिए ‘क्योंकि यदि’ रखा गया है।
- source_word: תַכֶּנּוּ
  choice: तुम उसे मारोगे
  rationale: נכה का मूल अर्थ मारना या प्रहार करना है। ‘मारोगे’ ठोस क्रिया को बनाए रखता है, जबकि ‘अनुशासित करोगे’ मूल बिंब को अस्पष्ट कर देता।
- source_word: בַשֵּׁבֶט
  choice: छड़ी से
  rationale: इस अनुशासन-संबंधी प्रसंग में שֵׁבֶט का अर्थ छड़ी है, न कि राजदंड, लाठी या गोत्र। हिंदी में साधन को ‘से’ द्वारा सहज रूप से व्यक्त किया गया है।
- source_word: לֹא יָמוּת
  choice: वह नहीं मरेगा
  rationale: यह מות के निषेधयुक्त अपूर्ण रूप का सीधा अनुवाद है। मूल की कहावती दृढ़ता को बिना नरम किए बनाए रखा गया है।
theological_decisions:
- issue: ज्ञान-सूक्ति में נַעַר का पुल्लिंग संदर्भ
  choice: मुख्य पाठ में ‘बालक’
  alternative: ‘बच्चा’ या ‘युवक’
  rationale: इब्रानी संज्ञा और आगे के सर्वनाम पुल्लिंग एकवचन हैं। ‘बालक’ इस रूप को बनाए रखते हुए हिंदी में लड़के अथवा कम आयु के पुरुष के लिए गरिमापूर्ण और सहज शब्द है; शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
- issue: शारीरिक अनुशासन के विषय में कहावत के दावे का स्वरूप
  choice: ‘वह नहीं मरेगा’ को मुख्य पाठ में सीधे रखना
  alternative: ‘इससे उसकी मृत्यु नहीं होगी’ अथवा व्याख्यात्मक सीमा मुख्य पाठ में जोड़ना
  rationale: इब्रानी पाठ सीधा कहावती कथन करता है। मुख्य पाठ में शर्तें जोड़ने से मूल कथन नरम पड़ता; पर इसे दुर्व्यवहार की सर्वांगीण स्वीकृति या हर परिस्थिति की निरपेक्ष गारंटी न समझा जाए, इसलिए स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अनुशासन से वंचित न रखो’ सुधारात्मक प्रशिक्षण का भाव व्यक्त करता है, जबकि ‘छड़ी से मारोगे’ मूल की ठोस और असुविधाजनक छवि को बिना छिपाए बनाए रखता है।
