  yaml_path: translation/ot/proverbs/004/008.yaml
  text: Prize her highly[a], and she will exalt you[b]; she will honor you when you embrace her.
translation:
  language: hi
  text: उसे बहुत मान दे[a], और वह तुझे ऊँचा उठाएगी; जब तू उसे गले लगाएगा, तब वह तेरा सम्मान करेगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे सँजोकर रख।” आरम्भिक इब्रानी क्रिया दुर्लभ है और बुद्धि को मूल्यवान मानने, सँजोने, या उसकी प्रशंसा करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि तू उसे गले लगाएगा।” इब्रानी शब्द कारण (“क्योंकि”) या परिस्थिति/समय (“जब”) दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סַלְסְלֶהָ
  choice: उसका बहुत मान कर
  rationale: दुर्लभ क्रिया סלסל यहाँ स्त्रीलिंग रूप में व्यक्त बुद्धि को अत्यंत मूल्यवान मानने, सँजोने या ऊँचा स्थान देने का भाव रखती है। यह चयन अगली क्रिया के साथ अनावश्यक पुनरावृत्ति से बचते हुए मूल अर्थ-सीमा को बनाए रखता है।
- source_word: וּתְרוֹמְמֶךָ
  choice: और वह तुझे ऊँचा उठाएगी
  rationale: רומם का अर्थ उठाना या ऊँचा करना है। स्त्रीलिंग कर्ता व्यक्तिरूप में प्रस्तुत बुद्धि है; हिन्दी में यह वाक्यांश स्वाभाविक रहते हुए उन्नति और प्रतिष्ठा दोनों का संकेत देता है।
- source_word: תְכַבֵּדְךָ
  choice: वह तेरा सम्मान करेगी
  rationale: כבד का पिएल रूप यहाँ सम्मान देने या प्रतिष्ठित करने का अर्थ देता है। 'सम्मान करेगी' आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי का सामान्य कारणसूचक अर्थ बनाए रखा गया है। प्रसंग में कालसूचक 'जब' भी संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: תְחַבְּקֶנָּה
  choice: तू उसे गले लगाता है
  rationale: חבק का प्रत्यक्ष अर्थ गले लगाना है। यह बुद्धि के स्त्री-व्यक्तित्व और उसे निकटता से अपनाए रखने के रूपक को सुरक्षित रखता है।
