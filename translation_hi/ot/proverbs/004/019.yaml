    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: नीतिवचन साहित्य में यह जीवन-चाल या आचरण की दिशा का रूपक है। ‘मार्ग’ इस रूपक को स्वाभाविक और गरिमापूर्ण हिंदी में बनाए रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञात्मक रूप नैतिक रूप से दोषी लोगों को सूचित करता है। ‘दुष्टों’ संक्षिप्त और इस साहित्यिक संदर्भ में स्वाभाविक है।
- source_word: כָּאֲפֵלָה
  choice: घोर अंधकार के समान
  rationale: כְּ तुलना व्यक्त करता है और אֲפֵלָה साधारण अंधकार से अधिक गहरे, सघन अंधकार या उदासीपूर्ण धुँधलेपन को दर्शाता है। ‘घोर अंधकार’ इस तीव्रता को स्पष्ट रखता है।
- source_word: לֹא יָדְעוּ
  choice: वे नहीं जानते
  rationale: यह सीधा अनुवाद अज्ञान और समझ के अभाव—दोनों संभावित भावों को खुला रखता है।
- source_word: בַּמֶּה יִכָּשֵׁלוּ
  choice: कि किससे ठोकर खाते हैं
  rationale: ‘किससे’ कारण या साधन और उस वस्तु—दोनों की ओर संकेत कर सकता है जिससे टकराकर ठोकर लगती है; इस प्रकार हिब्रू की वास्तविक अस्पष्टता हिंदी में यथासंभव बनी रहती है। ‘ठोकर खाते हैं’ כשל के नैतिक और मार्ग-संबंधी बिंब को सुरक्षित रखता है।
