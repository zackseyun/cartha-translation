id: PRO.4.9
reference: Proverbs 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: תִּתֵּ֣ן לְ֭/רֹאשְׁ/ךָ לִוְיַת חֵ֑ן עֲטֶ֖רֶת תִּפְאֶ֣רֶת תְּמַגְּנֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/009.yaml
  text: She will place on your head a graceful wreath[b][a]; she will bestow on you a crown of beauty.
translation:
  language: hi
  text: वह तेरे सिर पर मनोहर माला रखेगी; वह तुझे शोभा का मुकुट प्रदान करेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתֵּן
  choice: रखेगी
  rationale: यह נתן का काल रूप है, जिसका स्त्रीलिंग कर्ता संदर्भ में बुद्धि है। सिर पर आभूषण रखने के प्रसंग में ‘रखेगी’ स्वाभाविक और ठोस चित्र प्रस्तुत करता है।
- source_word: לְרֹאשְׁךָ
  choice: तेरे सिर पर
  rationale: आभूषण के इस संदर्भ में לְ का स्वाभाविक हिन्दी रूप ‘पर’ है; द्वितीय पुरुष एकवचन को ‘तेरे’ से बनाए रखा गया है।
- source_word: לִוְיַת חֵן
  choice: मनोहर माला
  rationale: לִוְיָה सिर पर पहनी जाने वाली माला या हार-सदृश अलंकार है और חֵן आकर्षण, मनोहरता या अनुग्रह व्यक्त कर सकता है। ‘मनोहर माला’ काव्यात्मक समानांतरता और दृश्य अर्थ दोनों को सहज हिन्दी में रखता है।
- source_word: עֲטֶרֶת תִּפְאֶרֶת
  choice: शोभा का मुकुट
  rationale: עֲטֶרֶת का सामान्य अर्थ ‘मुकुट’ और תִּפְאֶרֶת का अर्थ शोभा, वैभव या गौरव हो सकता है। अलंकरण के संदर्भ में ‘शोभा’ उपयुक्त है और मूल की संबंधवाचक रचना को सुरक्षित रखता है।
- source_word: תְּמַגְּנֶךָּ
  choice: तुझे ... प्रदान करेगी
  rationale: यहाँ क्रिया का अर्थ किसी वस्तु को सौंपना या प्रदान करना है, न कि रक्षा करना। ‘प्रदान करेगी’ पद्य की गरिमा और मुकुट दिए जाने का भाव व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, dignified और काव्यात्मक रखी गई है। संदर्भ में व्यक्तित्व रूप में प्रस्तुत ‘बुद्धि’ स्त्रीलिंग कर्ता है, इसलिए दोनों क्रियाएँ स्त्रीलिंग में हैं। ‘तेरे/तुझे’ मूल के एकवचन निकट संबोधन को बनाए रखते हैं।
