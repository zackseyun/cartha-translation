  yaml_path: translation/ot/proverbs/004/011.yaml
  text: I have instructed you in the way of wisdom[a]; I have led you in paths of uprightness.
translation:
  language: hi
  text: मैंने तुम्हें बुद्धि का मार्ग सिखाया है; मैंने तुम्हें सीधे मार्गों[a] पर चलाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सीधाई के मार्गों पर।” हिब्रू शब्द में शाब्दिक सीधेपन और नैतिक खराई, दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּדֶרֶךְ חָכְמָה
  choice: बुद्धि के मार्ग की
  rationale: ‘मार्ग’ जीवन की दिशा और आचरण—दोनों का रूपक बनाए रखता है; ‘बुद्धि के’ से हिब्रू पदबंध का स्वाभाविक हिन्दी रूप मिलता है।
- source_word: הֹרֵתִיךָ
  choice: मैंने तुम्हें ... शिक्षा दी है
  rationale: हिफ़ील रूप का अर्थ ‘सिखाना/निर्देश देना’ है। ‘शिक्षा दी है’ ज्ञान-साहित्य के शिक्षक-शिष्य प्रसंग में स्वाभाविक है और पूर्ण हुई शिक्षा की वर्तमान प्रासंगिकता भी व्यक्त करता है।
- source_word: הִדְרַכְתִּיךָ
  choice: मैंने तुम्हें ... चलाया है
  rationale: क्रिया मार्ग पर अगुवाई कराने का बोध देती है। ‘चलाया है’ गति और मार्ग—दोनों बिंबों को बनाए रखता है।
- source_word: בְּמַעְגְּלֵי
  choice: मार्गों पर
  rationale: बहुवचन ‘मार्गों’ मूल के अनेक पथों/पटरियों का भाव रखता है और पहले खंड के ‘मार्ग’ के साथ काव्यात्मक समानांतरता बनाता है।
- source_word: יֹשֶׁר
  choice: सीधे
  rationale: यह शब्द भौतिक सीधेपन और नैतिक खराई दोनों का बोध करा सकता है। ‘सीधे मार्ग’ हिन्दी में इस द्विअर्थी मार्ग-बिंब को ‘सच्चाई/धार्मिकता’ जैसी व्याख्यात्मक संज्ञा की अपेक्षा अधिक अच्छी तरह बचाता है।
