  text: Put away crookedness of mouth from you[a], and put devious lips far from you.
translation:
  language: hi
  text: अपने मुँह की कुटिल बातों को अपने से दूर कर दे[a], और अपने होंठों की टेढ़ी बातों को अपने से बहुत दूर रख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुटिल मुँह को अपने से दूर कर दे” और “कुटिल होंठों को अपने से बहुत दूर रख।” दोनों इब्रानी संज्ञाएँ नैतिक रूप से टेढ़ी या विकृत वाणी का वर्णन करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵר
  choice: दूर कर दे
  rationale: हिफ़ील आज्ञार्थक सक्रिय और जानबूझकर हटाने का आदेश देता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִמְּךָ
  choice: खुद से
  rationale: पूर्वसर्ग और एकवचन पुल्लिंग प्रत्यय संबोधित व्यक्ति से अलगाव बताते हैं; ‘खुद से’ उसकी निजी जिम्मेदारी को उभारता है।
- source_word: עִקְּשׁוּת פֶּה
  choice: मुँह की टेढ़ी बातें
  rationale: עִקְּשׁוּת नैतिक रूप से टेढ़ेपन या विकृतता का बोध कराता है और פֶּה का मुख-बिंब बनाए रखता है। हिन्दी में बहुवचन ‘बातें’ अमूर्त ‘टेढ़ापन’ की अपेक्षा अधिक सहज है।
- source_word: וּלְזוּת
  choice: छल-कपट की बातें
  rationale: यह संज्ञा विकृत, कुटिल या धूर्त वाणी को सूचित करती है; ‘छल-कपट’ उसके नैतिक और भ्रामक स्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂפָתַיִם
  choice: होंठों
  rationale: शाब्दिक देह-बिंब को बनाए रखकर पहले खंड के ‘मुँह’ के साथ काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: הַרְחֵק מִמֶּךָ
  choice: अपने होंठों से बहुत दूर रख
  rationale: कारक आज्ञार्थक दूरी उत्पन्न करने का आदेश देता है। हिन्दी वाक्य-विन्यास में ‘अपने होंठों से’ जोड़ने से आशय स्पष्ट और स्वाभाविक रहता है, जबकि ‘बहुत दूर रख’ तीव्रता व्यक्त करता है।
