  text: בְּ֭נִ/י לִ/דְבָרַ֣/י הַקְשִׁ֑יבָ/ה לַ֝/אֲמָרַ֗/י הַט אָזְנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/020.yaml
  text: My son[a], pay attention to my words[b]; incline your ear to my sayings.
translation:
  language: hi
  text: हे मेरे बेटे, मेरी बातों पर ध्यान दे; मेरे वचनों की ओर अपना कान लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: पिता या गुरु का अपने पुरुष संतान से सीधा संबोधन है; इब्रानी पुल्लिंग एकवचन को बनाए रखा गया है।
- source_word: לִדְבָרַי
  choice: मेरी बातों पर
  rationale: דברים यहाँ वक्ता की शिक्षा या कही हुई बातों को दर्शाता है; आधुनिक हिन्दी में ‘बातों पर ध्यान दे’ स्वाभाविक है।
- source_word: הַקְשִׁיבָה
  choice: ध्यान दे
  rationale: हिफ़ील आज्ञार्थक रूप सक्रिय और सावधान सुनने का आग्रह करता है; ‘ध्यान दे’ इसका सहज आधुनिक हिन्दी रूप है।
- source_word: לַאֲמָרַי
  choice: मेरे वचनों की ओर
  rationale: אמרים को पहले चरण की ‘बातों’ से हल्का अलग रखते हुए काव्यात्मक समानांतरता सुरक्षित की गई है; ‘वचन’ गरिमापूर्ण और सुबोध है।
- source_word: הַט
  choice: लगा
  rationale: נטה और ‘कान’ का मेल ध्यानपूर्वक सुनने का रूपक है; ‘कान लगाना’ हिन्दी का स्वाभाविक समतुल्य मुहावरा है।
- source_word: אָזְנֶךָ
  choice: अपना कान
  rationale: मूल के एकवचन को रखा गया है और हिन्दी मुहावरे ‘कान लगाना’ में यह स्वाभाविक है।
