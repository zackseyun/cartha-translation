source:
  edition: WLC
  text: וְ/אֹ֣רַח צַ֭דִּיקִים כְּ/א֣וֹר נֹ֑גַהּ הוֹלֵ֥ךְ וָ֝/א֗וֹר עַד נְכ֥וֹן הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/018.yaml
  text: But the path of the righteous is like the light of dawn[b][a], going on and shining until the day is fully established.
translation:
  language: hi
  text: परन्तु धर्मियों का मार्ग भोर की ज्योति[a] के समान है, जो दिन के पूरी तरह निकल आने तक बढ़ती और चमकती जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चमकती हुई ज्योति।’
    reason: lexical_alternative
  - marker: b
    text: या ‘जो पूरा दिन होने तक और अधिक उज्ज्वल होती जाती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֹרַח
  choice: परन्तु ... मार्ग
  rationale: אֹרַח का अर्थ ‘मार्ग’ है। पूर्ववर्ती पद में दुष्टों के मार्ग से विरोध होने के कारण וְ को हिन्दी में स्वाभाविक रूप से ‘परन्तु’ कहा गया है।
- source_word: צַדִּיקִים
  choice: धर्मियों का
  rationale: यह बहुवचन संज्ञात्मक विशेषण ‘धर्मी जनों’ की नैतिक श्रेणी को सूचित करता है; ‘धर्मियों’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: כְּ/אוֹר נֹגַהּ
  choice: भोर की ज्योति के समान
  rationale: כְּ तुलना प्रकट करता है, אוֹר ‘प्रकाश/ज्योति’ है और נֹגַהּ चमक या दीप्ति को दर्शाता है। पूर्ण दिन की ओर बढ़ती छवि के कारण ‘भोर की ज्योति’ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הוֹלֵךְ וָ/אוֹר
  choice: निरन्तर आगे बढ़ती और चमकती जाती है
  rationale: दोनों सहभागी क्रियाओं के ‘चलते जाने और चमकने’ के क्रम को बनाए रखते हुए हिन्दी में प्रकाश की सतत प्रगति व्यक्त की गई है; ‘और अधिक उज्ज्वल होती जाती है’ को व्याख्यात्मक विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: עַד נְכוֹן הַ/יּוֹם
  choice: दिन के पूरी तरह निकल आने तक
  rationale: עַד अंतिम समय-बिन्दु बताता है और נְכוֹן स्थापित अथवा दृढ़ हो जाने का भाव देता है। हिन्दी में ‘दिन के पूरी तरह निकल आने तक’ पूर्ण दिन के स्थापित हो जाने की छवि को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: צַדִּיקִים की नैतिक श्रेणी
  choice: धर्मी
  alternative: न्यायी लोग
  rationale: यह पद अपने निकटवर्ती प्रसंग में धर्मियों के जीवन-मार्ग को दुष्टों के मार्ग से अलग करता है। ‘धर्मी’ इस नीतिपरक श्रेणी को बनाए रखता है और किसी बाद की सम्प्रदायगत परिभाषा को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक किन्तु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘ज्योति’ ने सूक्ति की प्रकाश-छवि को बनाए रखा है; क्रियात्मक क्रम में मूल इब्रानी की प्रगतिशीलता और वास्तविक अर्थगत विकल्प दोनों सुरक्षित रखे गए हैं।
