id: PRO.4.17
reference: Proverbs 4:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לָ֭חֲמוּ לֶ֣חֶם רֶ֑שַׁע וְ/יֵ֖ין חֲמָסִ֣ים יִשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/017.yaml
  text: For they eat the bread of wickedness[b][a], and drink the wine of violence.
translation:
  language: hi
  text: क्योंकि वे दुष्टता की रोटी खाते[a] और हिंसा का दाखमधु[b] पीते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टता की रोटी से अपना पेट भरते हैं।” यहाँ प्रयुक्त क्रिया का अर्थ खाना या उससे आहार पाना हो सकता है; “खाते” अगले खंड के “पीते हैं” के साथ सबसे सीधा समानांतर है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हिंसाओं का दाखमधु।” इब्रानी बहुवचन अनेक हिंसक कर्मों को सामूहिक रूप से या उनकी तीव्रता को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में दी गई चेतावनी का कारण बताता है; ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: לָחֲמוּ
  choice: वे ... खाते
  rationale: यहाँ दुर्लभ क्रिया לחם II का अर्थ ‘खाना/भोजन करना’ है और अगले खंड के ‘पीते हैं’ के साथ समानांतर है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: ‘रोटी’ मूल ठोस बिंब को बनाए रखती है और ‘दाखमधु’ के साथ भोजन-पेय की काव्यात्मक जोड़ी बनाती है।
- source_word: רֶשַׁע
  choice: दुष्टता
  rationale: नीतिवचन के नैतिक संदर्भ में यह शब्द बुरे चरित्र और आचरण, दोनों को समेटता है।
- source_word: וְיֵין
  choice: और ... दाखमधु
  rationale: ‘दाखमधु’ יין के ठोस अर्थ ‘wine’ को गरिमापूर्ण, प्रचलित बाइबलीय हिन्दी में व्यक्त करता है और रोटी के बिंब को बनाए रखता है।
- source_word: חֲמָסִים
  choice: हिंसा
  rationale: यद्यपि इब्रानी रूप बहुवचन है, यहाँ वह हिंसक कर्मों को सामूहिक या तीव्र भाव में व्यक्त करता है; हिन्दी में एकवचन भाववाचक ‘हिंसा’ स्वाभाविक है।
- source_word: יִשְׁתּוּ
  choice: पीते हैं
  rationale: अपूर्ण क्रिया-रूप यहाँ उनकी नियमित या अभ्यस्त गतिविधि का वर्णन करता है; वर्तमान काल हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions: []
