source:
  edition: WLC
  text: כִּ֤י לֶ֣קַח ט֭וֹב נָתַ֣תִּי לָ/כֶ֑ם תּֽ֝וֹרָתִ֗/י אַֽל תַּעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/002.yaml
  text: For I have given you good instruction[a]; do not forsake my teaching.
translation:
  language: hi
  text: क्योंकि मैंने तुम्हें उत्तम शिक्षा दी है; मेरी सीख[a] को मत छोड़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे निर्देश’ अथवा ‘मेरी व्यवस्था’। इब्रानी शब्द तोराह का अर्थ व्यापक रूप से शिक्षा या निर्देश भी हो सकता है; यह केवल विधि-संहिता के लिए प्रयुक्त नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के उपदेश का कारण या आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֶקַח טוֹב
  choice: उत्तम शिक्षा
  rationale: לֶקַח यहाँ ग्रहण करने की क्रिया नहीं, बल्कि दी जाने वाली शिक्षा है; טוֹב उसकी श्रेष्ठ गुणवत्ता बताता है। ‘उत्तम शिक्षा’ अर्थ और गरिमा दोनों बनाए रखता है।
- source_word: נָתַתִּי לָכֶם
  choice: मैंने तुम्हें ... दी है
  rationale: इब्रानी पूर्ण क्रिया पहले दिए जा चुके उपदेश और उसकी वर्तमान प्रासंगिकता को दर्शाती है; हिन्दी का पूर्ण वर्तमान इसे सहज ढंग से व्यक्त करता है। बहुवचन לָכֶם के लिए ‘तुम्हें’ स्वाभाविक है।
- source_word: תּוֹרָתִי
  choice: मेरी सीख
  rationale: नीतिवचन के पिता-संतान संबंधी प्रसंग में תּוֹרָה व्यापक रूप से आधिकारिक शिक्षा या निर्देश को दर्शाता है, केवल विधान-संहिता को नहीं। ‘सीख’ पहले आए ‘शिक्षा’ से अनावश्यक पुनरावृत्ति भी बचाती है।
- source_word: אַל תַּעֲזֹבוּ
  choice: मत छोड़ो
  rationale: निषेधात्मक रूप निरंतर निष्ठा का आह्वान करता है। ‘मत छोड़ो’ आधुनिक, स्पष्ट और स्वाभाविक हिन्दी है, जबकि अर्थ में त्यागने का नैतिक भार बनाए रखता है।
theological_decisions:
- issue: ज्ञान-साहित्य के प्रसंग में תּוֹרָתִי का अनुवाद
  choice: मेरी सीख
  alternative: मेरी व्यवस्था; मेरा निर्देश
  rationale: यहाँ वक्ता का पैतृक ज्ञानोपदेश सामने है, इसलिए शब्द को केवल मूसा की संहिताबद्ध व्यवस्था तक सीमित करना प्रसंग से अधिक विशिष्ट होगा। ‘सीख’ תּוֹרָה के व्यापक शिक्षात्मक अर्थ को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। ‘उत्तम शिक्षा’ और ‘मेरी सीख’ से इब्रानी के दो निकटार्थी, पर अलग शब्दों का भेद रखा गया है।
