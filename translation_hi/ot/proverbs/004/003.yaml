  text: כִּי בֵ֭ן הָיִ֣יתִי לְ/אָבִ֑/י רַ֥ךְ וְ֝/יָחִ֗יד לִ/פְנֵ֥י אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/003.yaml
  text: For I was a son to my father[b][a], tender and an only child before my mother.
translation:
  language: hi
  text: क्योंकि मैं अपने पिता का पुत्र था, कोमल और अपनी माता की दृष्टि में इकलौता[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इकलौता’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘एकमात्र’, ‘अद्वितीय’ या कुछ प्रसंगों में ‘अत्यन्त प्रिय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले और अगले कथन के बीच कारण अथवा व्याख्या का संबंध प्रकट करता है।
- source_word: בֵן הָיִיתִי לְאָבִי
  choice: मैं अपने पिता का पुत्र था
  rationale: इब्रानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप; ‘पुत्र’ मूल पाठ के पुरुषवाचक संबंध को बनाए रखता है।
- source_word: רַךְ
  choice: कोमल
  rationale: शब्द में कोमलता, अल्पायु और नाज़ुकपन के भाव संभव हैं; ‘कोमल’ मूल की अर्थ-व्याप्ति को अनावश्यक रूप से केवल आयु तक सीमित नहीं करता।
- source_word: וְיָחִיד
  choice: और … इकलौता
  rationale: यह ‘एकमात्र/अद्वितीय’ का निकट और स्वाभाविक हिन्दी रूप है; ‘प्रिय’ या ‘लाड़ला’ अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: לִפְנֵי אִמִּי
  choice: अपनी माता की दृष्टि में
  rationale: शाब्दिक ‘अपनी माता के सामने’ की अपेक्षा यह हिन्दी में संबंधगत स्थिति को अधिक स्वाभाविक ढंग से व्यक्त करता है और ‘उसकी उपस्थिति/दृष्टि में’ का भाव बनाए रखता है।
theological_decisions:
- issue: יָחִיד को ‘इकलौता’ अथवा ‘लाड़ला’ समझना
  choice: इकलौता
  alternative: लाड़ला/अत्यन्त प्रिय
  rationale: मूल शब्द का प्राथमिक अर्थ ‘एकमात्र, अकेला, अद्वितीय’ है; कुछ प्रसंगों में उससे प्रियता का भाव निकल सकता है, पर उसे यहाँ मुख्य पाठ में निश्चित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘कोमल’ और ‘अपनी माता की दृष्टि में’ मूल इब्रानी की अर्थगत खुलावट और संबंधसूचक अभिव्यक्ति को बनाए रखते हैं।
