  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שְׁמַ֣ע בְּ֭נִ/י וְ/קַ֣ח אֲמָרָ֑/י וְ/יִרְבּ֥וּ לְ֝/ךָ֗ שְׁנ֣וֹת חַיִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/010.yaml
  text: Hear[a], my son, and receive my words[c][b], and the years of your life will be many.
translation:
  language: hi
  text: मेरे बेटे, सुन और मेरी बातें ग्रहण कर, और तेरे जीवन के वर्ष बढ़ेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע
  choice: सुन
  rationale: आज्ञार्थक क्रिया में केवल श्रवण नहीं, बल्कि ध्यान देकर मानने का भाव भी है; हिंदी में “सुन” दोनों अर्थों को स्वाभाविक रूप से वहन करता है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: पुंलिंग एकवचन संबोधन और नीतिवचन के पिता-पुत्र शिक्षण-परिवेश को स्पष्ट तथा स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: וְקַח
  choice: और … ग्रहण कर
  rationale: לקח का मूल भाव “लेना” है; शिक्षा अथवा वचनों के संदर्भ में “ग्रहण कर” आधुनिक हिंदी में स्वाभाविक रूप से स्वीकार करने और मन में उतारने का भाव देता है।
- source_word: אֲמָרָי
  choice: मेरी बातों को
  rationale: बहुवचन और प्रथम पुरुष एकवचन संबंध को सरल, बोलचाल-संगत किंतु गरिमापूर्ण हिंदी में व्यक्त करता है; “मेरे वचनों” की अपेक्षा यहाँ कम कृत्रिम है।
- source_word: וְיִרְבּוּ
  choice: बढ़ेंगे
  rationale: רבה के अपूर्ण रूप का अर्थ बढ़ना अथवा बहुत होना है। “वर्ष बढ़ेंगे” हिंदी में स्वाभाविक है और वृद्धि के मूल बिंब को बनाए रखता है।
- source_word: לְךָ שְׁנוֹת חַיִּים
  choice: तेरे जीवन के वर्ष
  rationale: शाब्दिक “तेरे लिए जीवन के वर्ष” की अपेक्षा हिंदी में संबंध को स्वाभाविक ढंग से व्यक्त करता है, जबकि दीर्घ जीवन के आशय को अनावश्यक रूप से विस्तार नहीं देता।
theological_decisions:
- issue: ज्ञान-साहित्य में लिंग-सूचक संबोधन
  choice: हे मेरे बेटे
  alternative: हे मेरे बच्चे
  rationale: इब्रानी पाठ स्पष्ट रूप से पुंलिंग एकवचन में है और पिता द्वारा पुत्र को शिक्षा देने वाले साहित्यिक ढाँचे का भाग है; इसलिए लिंग-निरपेक्ष रूप से इसे समतल नहीं किया गया।
- issue: दूसरी पंक्ति का संबंध
  choice: तब तेरे जीवन के वर्ष बढ़ेंगे
  alternative: और तेरे लिए जीवन के वर्ष बढ़ेंगे
  rationale: इब्रानी וְ परिणाम अथवा क्रम दोनों व्यक्त कर सकता है। संदर्भ में निर्देश ग्रहण करने और दीर्घ जीवन के बीच परिणाम-संबंध स्वाभाविक है; “तब” इसे स्पष्ट करता है, पर इसे कठोर यांत्रिक प्रतिज्ञा के रूप में नहीं बढ़ाता।
translation_notes:
  register: आधुनिक मानक हिंदी, निकट और पितृवत संबोधन के लिए “तू/तेरा” रूप; भाषा सरल, गरिमापूर्ण और ज्ञान-साहित्य की संक्षिप्त शिक्षात्मक शैली के अनुरूप रखी गई है।
