  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; निकटवर्ती नीतिवचन-संबोधन के अनुरूप एकवचन अनौपचारिक 'तेरी/तेरे' रखा गया है। हिब्रू की दो समानांतर पंक्तियाँ और 'आँखें/पलकें' का ठोस काव्यात्मक बिंब सुरक्षित रखा गया है।
