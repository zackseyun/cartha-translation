translation:
  language: hi
  text: 'तेरी आँखें सीधे सामने देखती रहें,

    और तेरी पलकें तेरे सामने सीधी रहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינֶיךָ
  choice: तेरी आँखें
  rationale: यह बहुवचन रूप है, जिसके साथ द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय लगा है; हिन्दी में 'तेरी आँखें' स्वाभाविक और स्रोत के अनुरूप है।
- source_word: לְנֹכַח
  choice: सीधे सामने
  rationale: यह पद ठीक सामने की दिशा बताता है। 'सीधे सामने' दृष्टि की एकाग्रता और मार्ग की सीधाई—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַבִּיטוּ
  choice: देखती रहें
  rationale: नבט का मूल अर्थ देखना या ध्यान से देखना है। प्रसंग में सतत केंद्रित दृष्टि व्यक्त करने के लिए 'देखती रहें' सहज है, बिना अनावश्यक तीव्रता जोड़े।
- source_word: וְעַפְעַפֶּיךָ
  choice: और तेरी पलकें
  rationale: स्रोत में विशेष रूप से 'पलकें' हैं, जो 'आँखों' के समानांतर ठोस काव्यात्मक चित्र बनाती हैं; इसे सामान्य 'दृष्टि' में नहीं बदला गया।
- source_word: יַיְשִׁרוּ
  choice: सीधी लगी रहें
  rationale: ישר यहाँ सीधा होने या सीधी दिशा में स्थित रहने का भाव देता है। 'सीधी लगी रहें' पलकों के माध्यम से दृष्टि के सामने टिके रहने को स्वाभाविक हिन्दी में व्यक्त करता है और सीधाई का शब्दचित्र बनाए रखता है।
- source_word: נֶגְדֶּךָ
  choice: तेरे आगे
  rationale: यह सामने या आगे स्थित दिशा को दर्शाता है। 'तेरे आगे' संक्षिप्त है और पहली पंक्ति के 'सीधे सामने' के साथ काव्यात्मक समानांतरता रखता है।
