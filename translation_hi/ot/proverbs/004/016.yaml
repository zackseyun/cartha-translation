id: PRO.4.16
reference: Proverbs 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י לֹ֣א יִֽ֭שְׁנוּ אִם לֹ֣א יָרֵ֑עוּ וְֽ/נִגְזְלָ֥ה שְׁ֝נָתָ֗/ם אִם לֹ֥א יכשולו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/016.yaml
  text: For they do not sleep unless they have done evil[a], and their sleep is taken away unless they make someone stumble.
translation:
  language: hi
  text: क्योंकि वे तब तक नहीं सोते, जब तक बुराई न कर लें; और जब तक वे किसी को ठोकर न खिला दें[a], उनकी नींद छिन जाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वे स्वयं ठोकर न खा लें।” इब्रानी रूप संक्षिप्त है और इसका अर्थ या तो किसी दूसरे को ठोकर खिलाना या स्वयं ठोकर खाना समझा जा सकता है; प्रसंग दूसरों को हानि पहुँचाने के अर्थ का समर्थन करता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दी गई चेतावनी का कारण बताता है; ‘क्योंकि’ इब्रानी के कारणसूचक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יִשְׁנוּ
  choice: वे तब तक नहीं सोते
  rationale: ישׁן का सामान्य अर्थ ‘सोना’ है। निषेध और दोनों אִם לֹא उपवाक्यों की रचना यहाँ तब तक…जब तक नहीं का भाव देती है।
- source_word: יָרֵעוּ
  choice: बुराई न कर लें
  rationale: רעע का हिफ़ील रूप बुराई या हानि करने का अर्थ दे सकता है। कर्म व्यक्त नहीं है, इसलिए सामान्य नैतिक अर्थ रखा गया है; ‘कर लें’ सोने से पहले पूरी की जाने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִגְזְלָה
  choice: छिन जाती है
  rationale: גזל का निफ़ाल रूप किसी वस्तु के छीन लिए जाने या चले जाने को व्यक्त करता है। यह चुनाव मूल के निष्क्रिय भाव और उसकी तीव्रता को सहज हिन्दी में रखता है।
- source_word: שְׁנָתָם
  choice: उनकी नींद
  rationale: संज्ञा यहाँ सोने की अवस्था को दर्शाती है; आधुनिक हिन्दी में ‘नींद’ स्पष्ट और स्वाभाविक है।
- source_word: יכשולו
  choice: वे किसी को ठोकर न खिला दें
  rationale: प्रसंग और समानांतर पंक्ति दुष्टों द्वारा दूसरे को गिराने या उसका पतन कराने का भाव सुझाती है। ‘ठोकर खिलाना’ मूल रूपक को बनाए रखता है; संक्षिप्त इब्रानी रूप से संभव अकर्मक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: יָרֵעוּ में कर्म का उल्लेख न होना
  choice: सामान्य रूप से ‘बुराई करना’
  alternative: ‘दूसरों को हानि पहुँचाना’
  rationale: इब्रानी पाठ कर्म को निर्दिष्ट नहीं करता, इसलिए अनुवाद किसी पीड़ित को जोड़कर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: יכשולו का कर्तृवाचक अथवा प्रेरणार्थक आशय
  choice: प्रसंग में किसी दूसरे को ठोकर खिलाना
  alternative: स्वयं ठोकर खाना
  rationale: बुराई करने वाली समानांतर पंक्ति और नीतिवचन का तर्क दूसरों के पतन का कारण बनने के अर्थ का समर्थन करते हैं। फिर भी इब्रानी रूप की संक्षिप्तता के कारण अकर्मक अर्थ वास्तविक संभावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘तब तक…जब तक’ दोनों अर्धपंक्तियों की शर्त और दुष्टों की अभ्यस्त बेचैनी स्पष्ट करता है। ‘ठोकर खिलाना’ पतन के रूपक को बनाए रखता है और केवल शारीरिक गिरने तक अर्थ को सीमित नहीं करता।
