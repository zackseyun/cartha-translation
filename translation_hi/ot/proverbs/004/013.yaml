  text: הַחֲזֵ֣ק בַּ/מּוּסָ֣ר אַל תֶּ֑רֶף נִ֝צְּרֶ֗/הָ כִּי הִ֥יא חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/013.yaml
  text: Hold fast to instruction; do not let go. Guard her[a], for she is your life.
translation:
  language: hi
  text: शिक्षा[a] को दृढ़ता से थामे रह; उसे मत छोड़। उसकी रक्षा कर, क्योंकि वही तेरा जीवन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुशासन” अथवा “सुधार”; इब्रानी शब्द מוּסָר में सिखाने के साथ-साथ चरित्र गढ़ने वाले प्रशिक्षण और सुधार का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲזֵק
  choice: दृढ़ता से थामे रह
  rationale: यह आज्ञार्थक रूप मजबूती से पकड़ने और लगातार उससे जुड़े रहने—दोनों भावों को व्यक्त करता है।
- source_word: בַּמּוּסָר
  choice: शिक्षा
  rationale: नीतिवचन में מוּסָר ऐसी शिक्षा है जिसमें प्रशिक्षण, अनुशासन और सुधार का भाव भी शामिल है। मुख्य पाठ में सहज और व्यापक शब्द 'शिक्षा' रखा गया है तथा अन्य अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אַל תֶּרֶף
  choice: उसे मत छोड़
  rationale: רפה यहाँ पकड़ ढीली करने या हाथ से जाने देने का भाव रखता है; यह अनुवाद पहले खंड के पकड़ने वाले रूपक को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: נִצְּרֶהָ
  choice: उसकी रक्षा कर
  rationale: נצר का अर्थ संभालकर रखना, पहरा देना या रक्षा करना है। स्त्रीलिंग प्रत्यय 'शिक्षा' की ओर संकेत करता है।
- source_word: כִּי הִיא
  choice: क्योंकि वही
  rationale: स्त्रीलिंग सर्वनाम का संबंध 'शिक्षा' से है। हिन्दी में 'वही' इस संदर्भ को स्वाभाविक रूप से बनाए रखते हुए शिक्षा की निर्णायक महत्ता पर बल देता है।
- source_word: חַיֶּיךָ
  choice: तेरा जीवन
  rationale: חַיִּים रूप की दृष्टि से बहुवचन है, पर इब्रानी में प्रायः समग्र 'जीवन' के अर्थ में प्रयुक्त होता है। एकवचन हिन्दी यहाँ स्वाभाविक है।
