  text: כִּֽי חַיִּ֣ים הֵ֭ם לְ/מֹצְאֵי/הֶ֑ם וּֽ/לְ/כָל בְּשָׂר֥/וֹ מַרְפֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/022.yaml
  text: For they are life to those who find them[a], and healing to all their flesh.
translation:
  language: hi
  text: क्योंकि जो उन्हें पाते हैं, उनके लिए वे जीवन हैं और उनके पूरे शरीर के लिए चंगाई हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: ‘उसके सारे मांस के लिए चंगाई।’ इसका अर्थ ‘उसके पूरे शरीर के लिए स्वास्थ्य’ भी हो सकता है।'
    reason: मूल इब्रानी की शाब्दिक अभिव्यक्ति और उसके स्वाभाविक अर्थगत विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में दिए गए निर्देश का कारण बताता है; हिंदी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חַיִּים
  choice: जीवन
  rationale: यद्यपि इब्रानी रूप बहुवचन है, यहाँ यह प्रायः प्रयुक्त भाववाचक अर्थ ‘जीवन’ रखता है।
- source_word: הֵם
  choice: वे ... हैं
  rationale: यह निकटवर्ती संदर्भ में पिता के वचनों की ओर संकेत करता है; हिंदी में बहुवचन सर्वनाम उसी संदर्भ को बनाए रखता है।
- source_word: לְמֹצְאֵיהֶם
  choice: जो उन्हें पा लेता है, उसके लिए
  rationale: शाब्दिक रूप बहुवचन ‘उन्हें पानेवालों के लिए’ है, पर अगली पंक्ति के एकवचन ‘उसका’ के साथ प्रतिनिधिक व्यक्ति का भाव स्वाभाविक हिंदी में एकवचन द्वारा स्पष्ट किया गया है।
- source_word: בְּשָׂרוֹ
  choice: उसके पूरे शरीर
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है, किंतु यहाँ व्यक्ति की संपूर्ण शारीरिक सत्ता अभिप्रेत है; ‘शरीर’ आधुनिक हिंदी में अर्थ को स्वाभाविक ढंग से देता है, जबकि शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: מַרְפֵּא
  choice: आरोग्य
  rationale: यह संज्ञा चंगाई, स्वास्थ्य या रोगमुक्ति को व्यक्त करती है। ‘आरोग्य’ यहाँ किसी ठोस औषधि का अर्थ जोड़े बिना परिणामसूचक भाव बनाए रखता है।
theological_decisions:
- issue: नीतिवचन में प्रतिनिधिक पुल्लिंग एकवचन
  choice: मुख्य पाठ में ‘जो ... पा लेता है, उसके’
  alternative: ‘जो ... पाते हैं, उनके’
  rationale: इब्रानी में ‘पानेवाले’ बहुवचन है, पर ‘उसका मांस’ एकवचन पुल्लिंग है। स्वाभाविक हिंदी में प्रतिनिधिक व्यक्ति को एकवचन रखकर एकवचन प्रत्यय सुरक्षित किया गया है; इससे कथन को किसी विशेष पुरुष तक सीमित नहीं किया जाता।
- issue: בָּשָׂר का शाब्दिक और प्रसंगगत अर्थ
  choice: मुख्य पाठ में ‘शरीर’
  alternative: ‘मांस’
  rationale: यहाँ शारीरिक समग्रता अभिप्रेत है। ‘शरीर’ सामान्य हिंदी में स्पष्ट है, और इब्रानी की शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- issue: מַרְפֵּא का अर्थ
  choice: ‘आरोग्य’
  alternative: ‘चंगाई’ या ‘औषधि’
  rationale: ‘आरोग्य’ उपचार के परिणाम को व्यक्त करता है और पाठ में न कही गई किसी ठोस दवा का भाव नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘पा लेता है’ खोजकर प्राप्त करने का भाव देता है; ‘आरोग्य’ संक्षिप्त और सम्मानपूर्ण है।
