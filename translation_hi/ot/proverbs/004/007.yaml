id: PRO.4.7
reference: Proverbs 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֵאשִׁ֣ית חָ֭כְמָה קְנֵ֣ה חָכְמָ֑ה וּ/בְ/כָל קִ֝נְיָנְ/ךָ֗ קְנֵ֣ה בִינָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/007.yaml
  text: 'The beginning of wisdom is this: acquire wisdom[a], and with all you acquire[b], acquire understanding.'
translation:
  language: hi
  text: 'बुद्धि का आरम्भ यह है: बुद्धि प्राप्त करो[a]; और जो कुछ तुम प्राप्त करते हो[b], उससे समझ प्राप्त करो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धि सबसे प्रधान है; इसलिए बुद्धि प्राप्त करो।” यहाँ रֵאשִׁית का अर्थ “प्रधान” या “सबसे महत्त्वपूर्ण” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “अपनी सारी प्राप्ति के साथ” या “अपनी सारी सम्पत्ति के साथ।” इब्रानी में “प्राप्त करो” और “प्राप्ति” सम्बन्धित शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: आरम्भ
  rationale: यह शब्द आरम्भ, पहला भाग या प्रधान वस्तु दर्शा सकता है। ‘आरम्भ’ इब्रानी वाक्य की संरचना बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह व्यावहारिक और नैतिक विवेक से युक्त बुद्धि को दर्शाता है; दोनों बार इसकी पुनरावृत्ति जोर देने के लिए सुरक्षित रखी गई है।
- source_word: קְנֵה
  choice: प्राप्त करो
  rationale: आज्ञार्थक क्रिया का अर्थ खरीदना, अर्जित करना या प्राप्त करना हो सकता है। ‘प्राप्त करो’ सहज हिंदी है और इसे केवल धन देकर खरीदने तक सीमित नहीं करता।
- source_word: וּבְכָל קִנְיָנְךָ
  choice: और जो कुछ तुम प्राप्त करते हो, उससे
  rationale: यह पदबंध ‘अपनी सारी प्राप्ति/सम्पत्ति के साथ’ भी समझा जा सकता है। चुनी हुई अभिव्यक्ति קנה और קִנְיָן के शब्द-साम्य को हिंदी में कुछ हद तक बनाए रखती है और सम्पत्ति से अधिक व्यापक रहती है।
- source_word: בִינָה
  choice: समझ
  rationale: यह विवेकपूर्ण समझ या परख को दर्शाता है। ‘समझ’ सामान्य आधुनिक हिंदी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
theological_decisions:
- issue: רֵאשִׁית חָכְמָה की वाक्यगत अस्पष्टता
  choice: ‘बुद्धि का आरम्भ यह है’—अगली आज्ञा को आरम्भ की व्याख्या माना गया है।
  alternative: ‘बुद्धि सबसे प्रधान है; इसलिए बुद्धि प्राप्त करो।’
  rationale: इब्रानी में संयोजक क्रिया नहीं है और רֵאשִׁית का अर्थ ‘आरम्भ’ या ‘प्रधान वस्तु’ दोनों हो सकता है। मुख्य पाठ स्रोत की रूपरेखा सुरक्षित रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण उपदेशात्मक स्वर रखा गया है। ‘बुद्धि,’ ‘समझ’ और ‘प्राप्त करो’ सामान्य पाठक के लिए सहज हैं; इब्रानी की पुनरावृत्ति तथा वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
