  text: בְּֽ֭/לֶכְתְּ/ךָ לֹא יֵצַ֣ר צַעֲדֶ֑/ךָ וְ/אִם תָּ֝ר֗וּץ לֹ֣א תִכָּשֵֽׁל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/012.yaml
  text: When you walk[a], your step will not be hindered; and if you run, you will not stumble.
translation:
  language: hi
  text: जब तुम चलोगे, तो तुम्हारा कदम बाधित[a] न होगा; और यदि तुम दौड़ोगे, तो ठोकर न खाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारा कदम तंग या सीमित न होगा।’ इब्रानी क्रिया में संकरा किए जाने या गति सीमित होने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ
  choice: जब तुम चलोगे
  rationale: ב् उपसर्गयुक्त infinitive construct और द्वितीय पुरुष एकवचन प्रत्यय यहाँ कालगत अर्थ देता है—‘जब तुम चलोगे।’ यह स्वाभाविक आधुनिक हिन्दी में मूल भाव को बनाए रखता है।
- source_word: יֵצַר
  choice: बाधित न होगा
  rationale: क्रिया का मूल बोध संकरा या सीमित किए जाने का है। ‘बाधित न होगा’ कदम की गति पर रोक न लगने का आशय स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: צַעֲדֶךָ
  choice: तुम्हारा कदम
  rationale: मूल में संज्ञा एकवचन है और द्वितीय पुरुष एकवचन प्रत्यय के साथ आती है। ‘तुम्हारा कदम’ मार्ग पर आगे बढ़ने की चित्रात्मकता और व्याकरणिक वचन दोनों बनाए रखता है।
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक וְ तथा शर्तसूचक אִם का सीधा और स्वाभाविक हिन्दी रूप है; यह शर्त के भाव को अनावश्यक रूप से निश्चित कालगत कथन में नहीं बदलता।
- source_word: תָּרוּץ
  choice: तुम दौड़ोगे
  rationale: רץ का सामान्य अर्थ ‘दौड़ना’ है; प्रसंग में इसे ‘जल्दी करना’ या ‘दौड़ लगाना’ जैसे अधिक व्याख्यात्मक रूप देने की आवश्यकता नहीं है।
- source_word: תִכָּשֵׁל
  choice: ठोकर न खाओगे
  rationale: נפעל रूप כשל ठोकर खाने या लड़खड़ाने का भाव देता है। यह हिन्दी अभिव्यक्ति मार्ग की प्रतिमा को बनाए रखते हुए शारीरिक और नैतिक दोनों संभावित अनुगूँजों को खुला रखती है।
