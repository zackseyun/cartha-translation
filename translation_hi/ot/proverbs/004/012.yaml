  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की चलने-दौड़ने और ठोकर खाने वाली मार्ग-प्रतिमा सुरक्षित है। एकवचन ‘कदम’ मूल इब्रानी के वचन का अनुसरण करता है; ‘बाधित’ के साथ पादटिप्पणी मूल क्रिया की ‘तंग/सीमित’ अर्थ-छाया स्पष्ट करती है।
