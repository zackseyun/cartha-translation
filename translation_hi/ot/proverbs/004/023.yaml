  yaml_path: translation/ot/proverbs/004/023.yaml
  text: Guard your heart more than all guarding[b][a], for from it are the springs of life.
translation:
  language: hi
  text: सब प्रकार की रखवाली से बढ़कर अपने हृदय की रक्षा कर[a], क्योंकि उसी से जीवन के सोते निकलते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सारी रखवाली से बढ़कर अपने हृदय की रखवाली कर।” अर्थात जिन बातों की भी रक्षा की जाती है, उन सबमें हृदय की रक्षा को सर्वोच्च प्राथमिकता दे।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि उसी से जीवन के स्रोत/निर्गम निकलते हैं।” इब्रानी शब्द का अर्थ बाहर निकलने के स्थान, प्रवाह या स्रोत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל מִשְׁמָר
  choice: सब प्रकार की रखवाली से बढ़कर
  rationale: מן का तुलनात्मक बल और מִשְׁמָר का ‘रखवाली/चौकसी’ अर्थ बनाए रखते हुए यह पदबंध हृदय की रक्षा को सर्वोच्च प्राथमिकता देता है तथा अगले क्रियापद के साथ मूल का शब्द-साम्य यथासंभव बचाता है।
- source_word: נְצֹר
  choice: रक्षा कर
  rationale: आज्ञार्थक क्रिया सक्रिय और सावधान संरक्षण का निर्देश देती है; ‘रक्षा कर’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: לִבֶּךָ
  choice: अपने हृदय
  rationale: ‘हृदय’ को विचार, इच्छा और भावनाओं सहित आंतरिक जीवन के केंद्र के रूप में मूल रूपक के साथ रखा गया है; इसे केवल ‘मन’ या ‘भावनाएँ’ बनाकर संकुचित नहीं किया गया।
- source_word: כִּי מִמֶּנּוּ
  choice: क्योंकि उसी से
  rationale: כִּי कारण प्रस्तुत करता है और प्रत्यय हृदय की ओर लौटता है। ‘उसी’ स्रोत पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תּוֹצְאוֹת חַיִּים
  choice: जीवन के सोते
  rationale: תּוֹצְאוֹת में निकलने के स्थान, स्रोत या निर्गम का भाव हो सकता है। ‘सोते’ जीवन के हृदय से प्रवाहित होने की सजीव छवि देता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ‘हृदय’ का मानव-स्वभाव संबंधी अर्थ
  choice: ‘हृदय’ को मूल रूप में रखना
  alternative: ‘मन’ या ‘अंतरात्मा’
  rationale: इब्रानी प्रयोग में हृदय केवल भावनाओं का नहीं, बल्कि सोच, इच्छा और भावों सहित भीतरी व्यक्ति का केंद्र है। मूल शब्द रखने से इसका व्यापक अर्थ और वैचारिक संसार सुरक्षित रहता है।
- issue: תּוֹצְאוֹת חַיִּים की प्रवाह-संबंधी छवि
  choice: ‘जीवन के सोते’
  alternative: ‘जीवन के स्रोत’ या ‘जीवन के निर्गम’
  rationale: पद जीवन के हृदय से निकलने की बात करता है, पर यह निश्चित नहीं करता कि आशय केवल नैतिक आचरण, जीवन की दिशा या जीवनदायी प्रवाह में से किसी एक से है। इसलिए मुख्य पाठ में छवि और पादटिप्पणी में शाब्दिक विकल्प रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन अनौपचारिक आज्ञार्थक शैली रखी गई है, जो नीतिवचन में पिता द्वारा पुत्र को दिए जा रहे सीधे उपदेश के अनुरूप है। भाषा सरल और गरिमापूर्ण है; ‘हृदय’ तथा ‘सोते’ मूल की काव्यात्मक छवि बनाए रखते हैं।
