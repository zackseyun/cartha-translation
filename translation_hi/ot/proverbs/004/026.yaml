  yaml_path: translation/ot/proverbs/004/026.yaml
  text: Level the path of your feet[a], and all your ways will be established.
translation:
  language: hi
  text: अपने पैरों की राह समतल कर[a], और तेरे सब मार्ग स्थिर होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पैरों की राह पर ध्यान से विचार कर”; हिब्रू क्रिया का अर्थ तौलना या सावधानी से विचार करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּלֵּס
  choice: समतल कर
  rationale: पिएल आज्ञार्थक रूप राह को समतल या सुगम बनाने का ठोस बिंब देता है। इसी क्रिया में तौलने या ध्यान से विचार करने का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מַעְגַּל
  choice: राह
  rationale: यह शब्द पगडंडी, राह या जीवन की दिशा को सूचित कर सकता है। ‘राह’ हिन्दी में स्वाभाविक है और शाब्दिक तथा नैतिक दोनों अर्थ बनाए रखता है।
- source_word: רַגְלֶךָ
  choice: अपने पैरों की
  rationale: हिब्रू पदबंध चलने के सजीव बिंब को बनाए रखता है; हिन्दी में बहुवचन ‘पैरों’ अधिक स्वाभाविक है।
- source_word: וְכָל
  choice: और ... सब
  rationale: साधारण संयोजक अर्थ को बनाए रखा गया है; इसे अधिक व्याख्यात्मक परिणामसूचक ‘तब’ नहीं बनाया गया।
- source_word: דְּרָכֶיךָ
  choice: तेरे सब मार्ग
  rationale: यह बहुवचन व्यक्ति के आचरण और जीवन-क्रम का संकेत देता है। पहले खंड के ‘राह’ से अनावश्यक पुनरावृत्ति बचाने के लिए यहाँ ‘मार्ग’ चुना गया है।
- source_word: יִכֹּנוּ
  choice: स्थिर होंगे
  rationale: निफ़अल रूप स्थापित, दृढ़ या स्थिर होने का परिणामसूचक भाव रखता है। ‘स्थिर होंगे’ संक्षिप्त, स्वाभाविक और मूल की कर्मवाच्य/अकर्मक अस्पष्टता के निकट है।
