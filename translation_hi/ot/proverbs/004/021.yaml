  text: אַל יַלִּ֥יזוּ מֵ/עֵינֶ֑י/ךָ שָׁ֝מְרֵ֗/ם בְּ/ת֣וֹךְ לְבָבֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/021.yaml
  text: Do not let them depart from your eyes[b][a]; keep them within your heart.
translation:
  language: hi
  text: वे तेरी आँखों से ओझल न हों[a]; उन्हें अपने हृदय में सँभालकर रख[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “वे तेरी आँखों से न हटें।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी प्रयोग में “हृदय” मनुष्य के भीतरी व्यक्तित्व—उसके विचार, इच्छा और भावनाओं—का केंद्र है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל יַלִּיזוּ
  choice: ओझल न हों
  rationale: निषेध के साथ לוז का भाव यहाँ पिता के वचनों के दृष्टि और ध्यान से हट जाने का है। यह हिन्दी में स्वाभाविक है और मूल दृश्य-बिंब को बनाए रखता है।
- source_word: מֵעֵינֶיךָ
  choice: तेरी आँखों से
  rationale: मूल का ठोस बिंब सुरक्षित रखा गया है; पूरे वाक्य में इसका स्वाभाविक अर्थ 'दृष्टि से ओझल होना' बनता है।
- source_word: שָׁמְרֵם
  choice: उन्हें ... सँभालकर रख
  rationale: שׁמר में सुरक्षित रखने, संजोने और ध्यानपूर्वक बनाए रखने का व्यापक भाव है। 'सँभालकर रख' आधुनिक हिन्दी में इस संदर्भ के लिए सहज है।
- source_word: בְּתוֹךְ לְבָבֶךָ
  choice: अपने हृदय में
  rationale: בְּתוֹךְ भीतर स्थित होने पर बल देता है और לְבָבֶךָ व्यक्ति के आंतरिक विचार, इच्छा और भाव के केंद्र को दर्शाता है। 'हृदय' मूल रूपक को सुरक्षित रखता है।
theological_decisions: []
