  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन एकवचन और निकट संबंध वाला है, इसलिए 'तेरी/अपने' रखा गया है। मुख्य पाठ में ठोस नेत्र-बिंब और हृदय-रूपक दोनों सुरक्षित हैं।
