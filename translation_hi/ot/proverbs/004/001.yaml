source:
  edition: WLC
  text: שִׁמְע֣וּ בָ֭נִים מ֣וּסַר אָ֑ב וְ֝/הַקְשִׁ֗יבוּ לָ/דַ֥עַת בִּינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/001.yaml
  text: Hear[a], sons, a father's instruction, and pay attention to know understanding.
translation:
  language: hi
  text: हे पुत्रो[a], पिता की शिक्षा सुनो, और समझ प्राप्त करने के लिए ध्यान दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चो।” इब्रानी में शाब्दिक रूप से “पुत्रो” है, जो नीतिवचन में सामान्य पिता-पुत्र शिक्षण-रूपरेखा को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: बहुवचन आज्ञार्थक क्रिया attentive hearing का आह्वान करती है; ‘सुनो’ संक्षिप्त, स्वाभाविक और ज्ञान-साहित्य के अनुरूप है।
- source_word: בָנִים
  choice: पुत्रो
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन ‘पुत्र’ है और पिता-पुत्र शिक्षण-रूपरेखा को बनाए रखता है; व्यापक अर्थ की संभावना पाद-टिप्पणी में दी गई है।
- source_word: מוּסַר
  choice: शिक्षा
  rationale: ज्ञान-साहित्य में यह अनुशासन, सुधार और चरित्र-निर्माण करने वाली शिक्षा को दर्शा सकता है; यहाँ ‘शिक्षा’ प्रसंगानुकूल और सहज है।
- source_word: אָב
  choice: पिता की
  rationale: इब्रानी संबंध-रचना अनिश्चित है; हिन्दी में ‘पिता की शिक्षा’ स्वाभाविक है और किसी विशिष्ट पिता को अनावश्यक रूप से चिह्नित नहीं करती।
- source_word: וְהַקְשִׁיבוּ
  choice: और ... ध्यान दो
  rationale: यह पहले ‘सुनो’ से अधिक केंद्रित ध्यान देने का भाव रखता है; ‘ध्यान दो’ आधुनिक हिन्दी में स्वाभाविक भेद बनाए रखता है।
- source_word: לָדַעַת
  choice: जानने के लिए
  rationale: ל सहित infinitive उद्देश्य अथवा परिणाम व्यक्त कर सकता है; ‘जानने के लिए’ उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּינָה
  choice: समझ
  rationale: यह ज्ञान-साहित्य का प्रमुख शब्द है, जिसका अर्थ समझ, विवेक या अंतर्दृष्टि हो सकता है; ‘समझ’ व्यापक और सामान्य हिन्दी विकल्प है।
theological_decisions:
- issue: ज्ञानोपदेश में लिंगसूचक संबोधन
  choice: पुत्रो
  alternative: बच्चो
  rationale: मूल इब्रानी में पुल्लिंग बहुवचन है और पिता से पुत्रों को दिए जाने वाले उपदेश की रूपरेखा स्पष्ट है। इसलिए इसे मुख्य पाठ में रखा गया है, जबकि शिक्षा की व्यापक प्रयोज्यता को नकारे बिना वैकल्पिक अर्थ पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पुत्रो’ मूल की संबोधन-रूपरेखा को सुरक्षित रखता है; ‘समझ को जानने’ की कुछ असामान्य अभिव्यक्ति मूल के לדעת בינה को निकटता से प्रतिबिंबित करती है।
