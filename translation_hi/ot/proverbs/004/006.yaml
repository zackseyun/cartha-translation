id: PRO.4.6
reference: Proverbs 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תַּעַזְבֶ֥/הָ וְ/תִשְׁמְרֶ֑/ךָּ אֱהָבֶ֥/הָ וְ/תִצְּרֶֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/006.yaml
  text: Do not forsake her[a], and she will keep you; love her, and she will guard you.
translation:
  language: hi
  text: उसे[a] मत छोड़; वह तेरी रक्षा करेगी। उससे प्रेम कर; वह तुझे सुरक्षित रखेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् बुद्धि, जिसे इस प्रसंग में एक स्त्री के रूप में प्रस्तुत किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל
  choice: मत
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; हिन्दी में संबोधन के एकवचन रूप के साथ ‘मत’ स्वाभाविक और बिना अतिरिक्त बल जोड़े सटीक है।
- source_word: תַּעַזְבֶהָ
  choice: उसे मत छोड़
  rationale: עזב का अर्थ छोड़ना या त्यागना है। ‘छोड़’ आधुनिक हिन्दी में सहज है और स्त्रीलिंग कर्म-सर्वनाम निकट संदर्भ की बुद्धि की ओर संकेत करता है।
- source_word: וְתִשְׁמְרֶךָּ
  choice: वह तेरी रक्षा करेगी
  rationale: שׁמר में रखवाली, रक्षा और निगरानी का भाव है। ‘रक्षा करेगी’ परिणामसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱהָבֶהָ
  choice: उससे प्रेम कर
  rationale: אהב का सीधा अर्थ प्रेम करना है। हिन्दी में व्यक्ति-सदृश बुद्धि के प्रति प्रेम के लिए ‘उससे प्रेम कर’ स्वाभाविक है।
- source_word: וְתִצְּרֶךָּ
  choice: वह तुझे सुरक्षित रखेगी
  rationale: נצר संरक्षण और सावधानी से सँभालने का भाव देता है। ‘सुरक्षित रखेगी’ पहले समानांतर पद की ‘रक्षा करेगी’ से हल्का शब्दगत भेद बनाए रखता है।
theological_decisions:
- issue: बुद्धि का स्त्री के रूप में मानवीकरण
  choice: स्त्रीलिंग संकेत ‘उसे’ और ‘वह ... करेगी’ बनाए रखे गए
  alternative: बुद्धि को निर्जीव भाव मानकर ‘इसे/यह’ कहना या हर बार ‘बुद्धि’ दोहराना
  rationale: हिब्रू में स्त्रीलिंग प्रत्यय और क्रियारूप निकट संदर्भ में बुद्धि के स्त्रीरूप मानवीकरण को बनाए रखते हैं। हिन्दी में स्त्रीलिंग सर्वनाम और क्रियारूप इस साहित्यिक चित्र को सुरक्षित रखते हैं, बिना उसे किसी अलग धर्मसैद्धांतिक पहचान में बदलने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी; एकवचन आत्मीय उपदेश के अनुरूप ‘तेरी/तुझे’ रखा गया है। समानांतर क्रियाओं के अर्थगत निकटत्व को ‘रक्षा करेगी’ और ‘सुरक्षित रखेगी’ से व्यक्त किया गया है।
