lexical_decisions:
- source_word: קְנֵה
  choice: प्राप्त कर
  rationale: आज्ञार्थक क्रिया यहाँ किसी मूल्यवान वस्तु को जान-बूझकर पाने या अर्जित करने का भाव देती है। ‘प्राप्त कर’ व्यापारिक अर्थ को अनावश्यक रूप से प्रमुख किए बिना दोनों आवृत्तियों की बलपूर्ण पुनरुक्ति बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: नीतिवचन में यह व्यावहारिक और नैतिक बुद्धिमत्ता का प्रचलित हिन्दी पद है।
- source_word: בִינָה
  choice: समझ
  rationale: यह समझने और विवेक करने की क्षमता को व्यक्त करता है तथा ‘बुद्धि’ के साथ स्वाभाविक, किंतु अलग, अर्थ वाला युग्म बनाता है।
- source_word: אַל תִּשְׁכַּח
  choice: भूल मत
  rationale: שׁכח का सीधा अर्थ ‘भूलना’ है; संक्षिप्त निषेधात्मक आज्ञा हिन्दी में मूल की तत्परता बनाए रखती है।
- source_word: וְאַל תֵּט
  choice: और ... न मुड़
  rationale: נטה यहाँ कही गई शिक्षा से हटने या दूसरी ओर मुड़ने का संकेत देता है। ‘न मुड़’ मूल की गति-संबंधी छवि को संक्षेप में सुरक्षित रखता है।
- source_word: מֵאִמְרֵי פִי
  choice: मेरे मुँह की बातों से
  rationale: यह अनुवाद बोलकर दी गई शिक्षा की मूल छवि को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
