  text: Do not enter the path of the wicked[a], and do not walk in the way of evil men.
translation:
  language: hi
  text: 'दुष्टों की राह में प्रवेश मत करना,

    और बुरे लोगों के मार्ग पर आगे मत बढ़ना।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू क्रिया का अर्थ ‘आगे बढ़ना,’ ‘चलते जाना,’ या ‘सीधे चलना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרַח
  choice: राह
  rationale: यह शब्द वास्तविक पगडंडी या जीवन की दिशा दोनों को सूचित कर सकता है; ‘राह’ ठोस रूपक को स्वाभाविक हिन्दी में बनाए रखता है और दूसरे चरण के דֶּרֶךְ से हल्का शब्दगत भेद भी रखता है।
- source_word: רְשָׁעִים
  choice: दुष्टों
  rationale: यह बहुवचन संज्ञात्मक विशेषण दुष्ट व्यक्तियों को सामूहिक रूप से बताता है; ‘दुष्टों’ संक्षिप्त, स्वाभाविक और लिंग को अनावश्यक रूप से सीमित किए बिना मूल का भाव देता है।
- source_word: אַל תָּבֹא
  choice: प्रवेश न करना
  rationale: בְּאֹרַח के साथ בוא किसी राह या जीवन-दिशा में कदम रखने का अर्थ देता है; ‘प्रवेश न करना’ इस आरंभिक प्रवेश को स्पष्ट रखता है।
- source_word: תְּאַשֵּׁר
  choice: आगे न बढ़ना
  rationale: पिएल रूप यहाँ सीधे चलते जाने, आगे बढ़ने या प्रगति करने का भाव रखता है; ‘आगे न बढ़ना’ सामान्य ‘चलना’ की अपेक्षा इस विशिष्ट अर्थ को अधिक ठीक से व्यक्त करता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: यह सड़क, रास्ते या जीवन-पद्धति का सामान्य शब्द है; ‘मार्ग’ नैतिक जीवन-दिशा के रूपक के लिए गरिमापूर्ण और सहज है।
- source_word: רָעִים
  choice: बुरे लोगों
  rationale: मूल का पुल्लिंग बहुवचन विशेषण यहाँ व्यक्तियों के लिए संज्ञात्मक रूप में प्रयुक्त है। हिन्दी में ‘बुरे लोगों’ प्रतिनिधिक समूह को स्वाभाविक ढंग से व्यक्त करता है और केवल पुरुषों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: רָעִים के व्याकरणिक पुल्लिंग बहुवचन का हिन्दी रूप
  choice: बुरे लोगों
  alternative: बुरे पुरुषों / कुकर्मियों
  rationale: संदर्भ सामान्य नैतिक शिक्षा का है और पुल्लिंग बहुवचन प्रतिनिधिक है; ‘बुरे लोगों’ मूल के व्यक्ति-संदर्भ को सुरक्षित रखते हुए हिन्दी में अनावश्यक जैविक-लिंग सीमा से बचता है। ‘कुकर्मी’ कर्म पर अधिक बल देकर ‘बुरे’ के व्यापक चरित्रार्थ को संकरा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण निषेधात्मक उपदेश। दोनों समानांतर चरणों में ‘राह/मार्ग’ का भेद रखा गया है। תְּאַשֵּׁר की विशिष्ट गति को ‘आगे न बढ़ना’ से व्यक्त किया गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
