  text: וַ/יֹּרֵ֗/נִי וַ/יֹּ֥אמֶר לִ֗/י יִֽתְמָךְ דְּבָרַ֥/י לִבֶּ֑/ךָ שְׁמֹ֖ר מִצְוֺתַ֣/י וֶֽ/חְיֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/004.yaml
  text: Then he taught me and said to me[a], “Let your heart hold fast my words[b]; keep my commandments and live.”
translation:
  language: hi
  text: तब उन्होंने मुझे शिक्षा दी और मुझसे कहा, “तेरा मन[a] मेरे वचनों को दृढ़ता से थामे रहे; मेरी आज्ञाओं का पालन कर और जीवित रह।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “तेरा हृदय।” इब्रानी में “हृदय” विचार, इच्छा और समझ सहित मनुष्य के भीतरी व्यक्तित्व को भी दर्शाता है।
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיֹּרֵנִי
  choice: उन्होंने मुझे शिक्षा दी
  rationale: हिफ़ील रूप यहाँ सिखाने या शिक्षा देने का अर्थ रखता है। पिता के प्रति आदरसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: וַיֹּאמֶר לִי
  choice: और मुझसे कहा
  rationale: प्रत्यक्ष कथन की भूमिका को बिना अतिरिक्त व्याख्या के सहज हिन्दी में व्यक्त करता है।
- source_word: יִתְמָךְ
  choice: दृढ़ता से थामे रहे
  rationale: תמך का मूल भाव थामना, सहारा देना या पकड़े रखना है। यहाँ मन को कर्ता मानकर यह वचनों को भीतर दृढ़ता से बनाए रखने का भाव देता है।
- source_word: דְּבָרַי
  choice: मेरे वचनों
  rationale: דברים का सीधा और प्रसंगानुकूल अनुवाद; ‘वचन’ गरिमापूर्ण होते हुए भी सामान्य हिन्दी पाठक के लिए परिचित है।
- source_word: לִבֶּךָ
  choice: तेरा मन
  rationale: इब्रानी לב भावना तक सीमित नहीं, बल्कि विचार, इच्छा और समझ सहित भीतरी व्यक्ति को दर्शाता है। इस निर्देशात्मक प्रसंग में हिन्दी ‘मन’ उस व्यापक आंतरिक ग्रहणशीलता को ‘हृदय’ से अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁמֹר
  choice: पालन कर
  rationale: आज्ञाओं के साथ हिन्दी में ‘पालन करना’ स्वाभाविक है और שמר के आज्ञाओं को मानने तथा बनाए रखने के आशय को स्पष्ट करता है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: מצוה के अधिकारपूर्ण आदेश के भाव को सटीक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: וֶחְיֵה
  choice: और जीवित रह
  rationale: संयोजक सहित आज्ञार्थक रूप की संक्षिप्तता बनाए रखता है और इसे स्पष्टतः केवल उद्देश्य या भविष्यवाणी बनाकर मूल की संभावित अर्थ-छाया को सीमित नहीं करता।
theological_decisions:
- issue: ‘आज्ञाओं का पालन कर और जीवित रह’ में आज्ञा तथा जीवन का संबंध
  choice: संक्षिप्त आज्ञार्थक-परिणाम संरचना को बनाए रखा गया
  alternative: ‘जिससे तू जीवित रहे’ या ‘तू जीवित रहेगा’
  rationale: וֶחְיֵה स्वयं आज्ञार्थक है। मूल पाठ उद्देश्य, परिणाम और निरंतर जीवन की अर्थ-छायाओं को संक्षिप्त रूप में साथ रखता है; किसी एक व्यवस्थित धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। पिता के लिए ‘उन्होंने’ तथा पुत्र को संबोधन में मूल के एकवचन के अनुरूप ‘तेरा/कर’ रखा गया है।
