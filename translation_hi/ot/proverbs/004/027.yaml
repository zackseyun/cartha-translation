id: PRO.4.27
reference: Proverbs 4:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַֽל תֵּט יָמִ֥ין וּ/שְׂמֹ֑אול הָסֵ֖ר רַגְלְ/ךָ֣ מֵ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/027.yaml
  text: Do not turn to the right or to the left[b][a]; remove your foot from evil.
translation:
  language: hi
  text: न दाईं ओर मुड़, न बाईं ओर; अपने पाँव को बुराई से हटा ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּט
  choice: मुड़
  rationale: נטה का यह निषेधात्मक रूप दिशा बदलने या मार्ग से हटने का भाव देता है। ‘मुड़’ सहज आधुनिक हिन्दी है और दाईं तथा बाईं ओर के समानांतर उल्लेख के साथ स्वाभाविक बैठता है।
- source_word: יָמִין וּשְׂמֹאול
  choice: दाईं ओर…बाईं ओर
  rationale: ये दोनों दिशासूचक शब्द हैं। समानांतर संरचना बनाए रखने के लिए दोनों को स्पष्ट दिशासूचक पदों के रूप में रखा गया है।
- source_word: הָסֵר
  choice: हटा ले
  rationale: आज्ञार्थक रूप यहाँ किसी वस्तु को दूर करने या अलग रखने का भाव देता है। ‘हटा ले’ पाँव के ठोस बिंब और बुराई से नैतिक दूरी—दोनों को बनाए रखता है।
- source_word: רַגְלְךָ
  choice: अपने पाँव को
  rationale: इब्रानी में एकवचन ‘तेरा पाँव’ है। हिन्दी में निजवाचक ‘अपने’ संबोधित व्यक्ति के साथ स्वाभाविक है और मार्ग पर चलने के शारीरिक रूपक को सुरक्षित रखता है।
- source_word: מֵרָע
  choice: बुराई से
  rationale: नीतिवचन के नैतिक संदर्भ में רַע का व्यापक अर्थ ‘बुराई’ उपयुक्त है; इसे केवल हानि या किसी विशिष्ट दुष्कर्म तक सीमित नहीं किया गया।
theological_decisions: []
translation_notes:
  register: वचन को संक्षिप्त, आज्ञार्थक और काव्यात्मक रखा गया है। एकवचन अनौपचारिक संबोधन हिन्दी ज्ञान-साहित्य की सीधी पिता-पुत्र शिक्षा के अनुरूप है; ‘पाँव’ का मूल रूपक व्याख्यात्मक विस्तार के बिना सुरक्षित है।
