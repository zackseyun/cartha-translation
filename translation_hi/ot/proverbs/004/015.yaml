  text: פְּרָעֵ֥/הוּ אַל תַּעֲבָר בּ֑/וֹ שְׂטֵ֖ה מֵ/עָלָ֣י/ו וַ/עֲבֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/proverbs/004/015.yaml
  text: Avoid it[a]; do not pass through it[b]. Turn away from it and pass on.
translation:
  language: hi
  text: उससे दूर रहो[a]; उस पर मत चलो। उससे मुड़ जाओ[b] और आगे बढ़ जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उससे बचकर रहो।’ इब्रानी क्रिया दुर्लभ है और दुष्टों के मार्ग से अलग रहने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके ऊपर से एक ओर मुड़ जाओ और आगे निकल जाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָעֵהוּ
  choice: उससे दूर रहो
  rationale: यह दुर्लभ क्रिया इस संदर्भ में दुष्टों के मार्ग से बचकर रहने का आदेश देती है। ‘उससे दूर रहो’ आधुनिक हिन्दी में स्वाभाविक है और जानबूझकर दूरी बनाए रखने का भाव स्पष्ट करता है।
- source_word: אַל תַּעֲבָר בּוֹ
  choice: उस पर मत चलो
  rationale: עבר के साथ ב यहाँ पहले उल्लिखित मार्ग पर चलने या उससे होकर जाने का संकेत देता है। हिन्दी में मार्ग के संदर्भ में ‘उस पर मत चलो’ स्थानगत रूपक को स्वाभाविक ढंग से बनाए रखता है।
- source_word: שְׂטֵה מֵעָלָיו
  choice: उससे मुड़ जाओ
  rationale: שְׂטֵה का अर्थ एक ओर मुड़ना या हट जाना है, और מֵעָלָיו उस मार्ग से अलग होने का भाव देता है। यह चयन संक्षिप्त, स्पष्ट और वर्तमान हिन्दी में सहज है।
- source_word: וַעֲבוֹר
  choice: और आगे बढ़ जाओ
  rationale: अंतिम आज्ञा उसी मार्ग में प्रवेश किए बिना उससे आगे निकल जाने को कहती है। ‘आगे बढ़ जाओ’ गति और निरंतरता दोनों को व्यक्त करता है।
theological_decisions: []
