base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/014.yaml
  text: So he listened to them in this matter and tested them for ten days[a].
translation:
  language: hi
  text: तब उसने इस बात में उनकी सुनी[a] और दस दिन तक उन्हें परखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बात में वह उनकी बात मान गया”; इब्रानी क्रिया का अर्थ सुनने के बाद ध्यान देना या सहमत होकर मान लेना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: उनकी सुनी
  rationale: שׁמע के साथ לְ का अर्थ किसी की बात सुनना या उस पर ध्यान देकर मान लेना हो सकता है। ‘उनकी सुनी’ स्वाभाविक हिन्दी में सुनने और प्रस्ताव स्वीकार करने—दोनों का संकेत देती है, बिना ‘आज्ञा मानी’ जैसा सामाजिक रूप से अधिक प्रबल अर्थ दिए।
- source_word: לָהֶם
  choice: उनकी
  rationale: हिन्दी मुहावरे ‘किसी की सुनना’ में यह रूप इब्रानी ‘उनकी ओर/उनके लिए सुनना’ का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: לַדָּבָר הַזֶּה
  choice: इस बात में
  rationale: דָּבָר यहाँ पिछले पद में रखे गए विशेष प्रस्ताव या मामले को सूचित करता है; ‘इस बात में’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: וַיְנַסֵּם
  choice: उन्हें परखा
  rationale: Piel रूप נסה का अर्थ जाँचना या परीक्षा करना है। भोजन-संबंधी इस सीमित प्रयोग के लिए ‘परखा’ सहज और सटीक है।
- source_word: יָמִים עֲשָׂרָה
  choice: दस दिन तक
  rationale: यह कालावधि सूचक कर्मकारक है; हिन्दी में ‘दस दिन तक’ परीक्षण की अवधि को स्पष्ट रूप से व्यक्त करता है।
