  text: וּ/מִ/קְצָת֙ יָמִ֣ים עֲשָׂרָ֔ה נִרְאָ֤ה מַרְאֵי/הֶם֙ ט֔וֹב וּ/בְרִיאֵ֖י בָּשָׂ֑ר מִן כָּל הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֥ג הַ/מֶּֽלֶךְ־־׃
