  yaml_path: translation/ot/daniel/001/015.yaml
  text: And at the end of ten days, their appearance seemed better, and they were healthier in flesh than all the youths who were eating the king’s food.
translation:
  language: hi
  text: दस दिन पूरे होने पर वे उन सब युवकों से अधिक अच्छे और हृष्ट-पुष्ट दिखाई दिए, जो राजा का भोजन खाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִקְצָת יָמִים עֲשָׂרָה
  choice: दस दिन पूरे होने पर
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप; दस दिनों की अवधि के अंत को स्पष्ट करता है।
- source_word: נִרְאָה מַרְאֵיהֶם טוֹב
  choice: वे ... अधिक अच्छे ... दिखाई दिए
  rationale: נראה के दृश्य/प्रतीत होने वाले अर्थ को बनाए रखता है और उनकी बाहरी दशा की तुलना व्यक्त करता है।
- source_word: וּבְרִיאֵי בָּשָׂר
  choice: हृष्ट-पुष्ट
  rationale: शाब्दिक ‘शरीर में मोटे/स्वस्थ’ के बजाय आधुनिक, सम्मानजनक हिन्दी में सुदृढ़ शारीरिक दशा व्यक्त करता है।
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: राजा का भोजन
  rationale: फ़ारसी मूल के इस शब्द का आशय राजकीय भोजन/व्यंजन है; संदर्भ में सरल और सटीक रूप।
