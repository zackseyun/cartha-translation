  terminology: “राजा का भोजन” is a sound primary rendering of פַּתְבַּג הַמֶּלֶךְ, and the footnote responsibly supplies lexical alternatives. “युवकों” properly avoids implying small children, and “सेवकों” conveys the deferential court-language force of עֲבָדֶיךָ without importing an unwarranted social-status emphasis.
