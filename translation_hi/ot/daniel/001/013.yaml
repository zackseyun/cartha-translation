  source_fidelity: 'The draft accurately represents the Hebrew proposal: the visible condition of Daniel’s group and that of the youths eating the royal provisions is to be seen before the official, followed by action toward the speakers on the basis of that observation. The passive/jussive force of וְיֵרָאוּ is suitably retained in “देखे जाएँ,” without adding the more interpretive notion of formal examination.'
