id: DAN.1.13
reference: Daniel 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֵרָא֤וּ לְ/פָנֶ֨י/ךָ֙ מַרְאֵ֔י/נוּ וּ/מַרְאֵה֙ הַ/יְלָדִ֔ים הָ/אֹ֣כְלִ֔ים אֵ֖ת פַּתְבַּ֣ג הַ/מֶּ֑לֶךְ וְ/כַ/אֲשֶׁ֣ר תִּרְאֵ֔ה עֲשֵׂ֖ה עִם עֲבָדֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/013.yaml
  text: Then let our appearance and the appearance of the youths who are eating the king’s food be seen before you[a], and according to what you see, deal with your servants.
translation:
  language: hi
  text: तब हमारा रूप-रंग और राजा का भोजन[a] खानेवाले युवकों का रूप-रंग आपके सामने देखे जाएँ। फिर जैसा आप देखें, वैसा ही अपने सेवकों के साथ कीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा का निर्धारित भाग’ या ‘राजा के स्वादिष्ट व्यंजन।’ इब्रानी शब्द राजकीय भोजन-सामग्री को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרָאוּ
  choice: देखे जाएँ
  rationale: निफ़अल रूप का कर्मवाच्य भाव बनाए रखता है और संदर्भ में दोनों समूहों के रूप-रंग को सामने देखकर परखने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַרְאֵינוּ / וּמַרְאֵה הַיְלָדִים
  choice: हमारा रूप-रंग / युवकों का रूप-रंग
  rationale: מַרְאֶה यहाँ दिखाई देनेवाली बाहरी दशा को दर्शाता है। ‘रूप-रंग’ आधुनिक हिन्दी में स्वाभाविक है और केवल चेहरे तक अर्थ को सीमित नहीं करता।
- source_word: הַיְלָדִים
  choice: युवकों
  rationale: राजदरबार में प्रशिक्षण पा रहे किशोर या जवान पुरुषों के लिए ‘युवकों’ उपयुक्त है; ‘बच्चों’ से अनावश्यक रूप से कम आयु का बोध हो सकता है।
- source_word: פַּתְבַּג הַמֶּלֶךְ
  choice: राजा का भोजन
  rationale: फ़ारसी मूल का यह शब्द राजा द्वारा उपलब्ध कराए गए विशेष भोजन या राजकीय खाद्य-भाग को सूचित करता है। मुख्य पाठ में सरल और स्पष्ट ‘राजा का भोजन’ रखा गया है, जबकि अन्य संभावित अर्थ टिप्पणी में दिए गए हैं।
- source_word: וְכַאֲשֶׁר תִּרְאֵה
  choice: फिर जैसा आप देखें
  rationale: अधिकारी के अपने निरीक्षण के आधार पर निर्णय करने का भाव रखता है और हिन्दी में स्वाभाविक है।
- source_word: עֲשֵׂה עִם עֲבָדֶיךָ
  choice: वैसा ही अपने सेवकों के साथ कीजिए
  rationale: עשה עם का व्यवहार करने वाला मुहावरेदार अर्थ और दानिय्येल का विनम्र दरबारी संबोधन दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: עֲבָדֶיךָ का अनुवाद
  choice: अपने सेवकों
  alternative: अपने दासों
  rationale: यहाँ वक्ता अधिकारी के प्रति विनम्र दरबारी भाषा में स्वयं और अपने साथियों को उसके ‘सेवक’ कहता है। इस पद में बंधुआ स्थिति पर विशेष बल नहीं है, इसलिए ‘सेवकों’ संदर्भानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ और ‘कीजिए’ का प्रयोग किया गया है। शैली सरल, गरिमापूर्ण और दरबारी संदर्भ के अनुरूप है; कर्मवाच्य ‘देखे जाएँ’ मूल की संरचना और वास्तविक अस्पष्टता को बनाए रखता है।
