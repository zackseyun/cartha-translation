  text: וַ/יִּתֵּ֤ן הָֽ/אֱלֹהִים֙ אֶת דָּ֣נִיֵּ֔אל לְ/חֶ֖סֶד וּֽ/לְ/רַחֲמִ֑ים לִ/פְנֵ֖י שַׂ֥ר הַ/סָּרִיסִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/009.yaml
  text: And God gave Daniel favor and compassion before the chief of the eunuchs[a].
translation:
  language: hi
  text: और परमेश्वर ने दानिय्येल को खोजों[a] के प्रधान की दृष्टि में कृपा और करुणा प्रदान की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दरबारी अधिकारियों का प्रधान” अथवा “राजमहल के अधिकारियों का प्रधान”; हिब्रू शब्द वास्तविक खोजों या व्यापक अर्थ में शाही अधिकारियों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दिलाई
  rationale: 'यहाँ נתן परमेश्वर की सक्रिय भूमिका बताता है: उसने अधिकारी के मन में दानिय्येल के प्रति अनुकूल भाव उत्पन्न किया। हिन्दी में ‘कृपा और करुणा दिलाई’ इस कारक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के सच्चे परमेश्वर के लिए है। मूल में वाचा-नाम नहीं, सामान्य पद אֱלֹהִים है; हिन्दी बाइबलीय शैली में ‘परमेश्वर’ उपयुक्त है।
- source_word: אֶת דָּנִיֵּאל
  choice: दानिय्येल को
  rationale: אֶת प्रत्यक्ष कर्म का चिह्न है और ‘को’ से उसका हिन्दी वाक्य-संबंध स्वाभाविक रूप में व्यक्त होता है। नाम का प्रचलित हिन्दी रूप ‘दानिय्येल’ रखा गया है।
- source_word: לְחֶסֶד
  choice: कृपा
  rationale: इस प्रसंग में חֶסֶד का आशय अधिकारी की अनुकूल दृष्टि या सद्भाव से है, न कि यहाँ स्पष्ट रूप से वाचा-निष्ठा से। ‘कृपा’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: וּלְרַחֲמִים
  choice: और करुणा
  rationale: רַחֲמִים सहानुभूतिपूर्ण दया या करुण भाव को व्यक्त करता है। ‘करुणा’ अधिकारी के दानिय्येल के प्रति संवेदनशील व्यवहार को स्पष्ट करता है।
- source_word: לִפְנֵי
  choice: की दृष्टि में
  rationale: शाब्दिक अर्थ ‘के सामने’ है, पर इस संदर्भ में यह किसी की निगाह या आकलन में अनुग्रह पाने का मुहावरा है। ‘की दृष्टि में’ अर्थ और हिब्रू भाव दोनों को सुरक्षित रखता है।
- source_word: שַׂר
  choice: प्रधान
  rationale: שַׂר पद और अधिकार रखने वाले प्रमुख अधिकारी को दर्शाता है। अगले संज्ञापद के साथ ‘प्रधान’ उसके पर्यवेक्षी पद को सहज हिन्दी में बताता है।
- source_word: הַסָּרִיסִים
  choice: खोजों
  rationale: סָרִיסִים का सीधा और पारंपरिक अर्थ ‘खोजे’ है। राजदरबार में इसका व्यापक अर्थ ‘दरबारी अधिकारी’ भी हो सकता है, इसलिए वह संभावना पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: बाबुल के राजदरबार में סָרִיסִים का अर्थ
  choice: खोजों
  alternative: दरबारी अधिकारियों अथवा राजमहल के अधिकारियों
  rationale: हिब्रू शब्द वास्तविक खोजों और व्यापक अर्थ में शाही अधिकारियों—दोनों के लिए प्रयुक्त हो सकता है। पद में शारीरिक स्थिति निश्चित करने वाला अतिरिक्त संकेत नहीं है। अतः मुख्य पाठ में सीधा शब्द रखा गया है और वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘की दृष्टि में कृपा और करुणा दिलाई’ हिब्रू संरचना और परमेश्वर की सक्रिय भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है। पाद-टिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से दिया गया है।
