  yaml_path: translation/ot/daniel/001/021.yaml
  text: And Daniel remained until the first year of King Cyrus[a].
translation:
  language: hi
  text: और दानिय्येल राजा कुस्रू के पहले वर्ष तक बना रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दानिय्येल राजा कुस्रू के पहले वर्ष तक वहाँ रहा।” इब्रानी क्रिया का शाब्दिक अर्थ “था” है, पर यहाँ संभवतः उसका भाव निरंतर उपस्थित रहने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: बना रहा
  rationale: क्रिया का मूल अर्थ ‘था’ है, पर व्यक्ति-वाचक कर्ता और עַד (‘तक’) के साथ यहाँ यह दानिय्येल की निरंतर उपस्थिति को व्यक्त करती है। ‘बना रहा’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से बताता है।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: עַד
  choice: तक
  rationale: समय की उस सीमा को दर्शाता है जहाँ तक स्थिति जारी रही।
- source_word: שְׁנַת אַחַת
  choice: पहले वर्ष
  rationale: यहाँ ‘एक वर्ष’ वाला पदबंध राजकीय कालगणना में क्रमवाचक अर्थ, अर्थात पहले शासन-वर्ष, में प्रयुक्त है।
- source_word: לְכוֹרֶשׁ
  choice: कुस्रू के
  rationale: राजकीय वर्ष बताने की इब्रानी रीति में לְ उस राजा को चिह्नित करता है जिसके शासन-वर्ष की बात है; हिन्दी में संबंधकारक ‘के’ स्वाभाविक है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ में दी गई राजकीय उपाधि को स्पष्ट रूप से सुरक्षित रखा गया है; हिन्दी में स्वाभाविक क्रम ‘राजा कुस्रू’ है।
