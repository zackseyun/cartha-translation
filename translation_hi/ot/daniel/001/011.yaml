  yaml_path: translation/ot/daniel/001/011.yaml
  text: Then Daniel said to the steward whom the chief of the eunuchs had appointed over Daniel[a], Hananiah, Mishael, and Azariah,
translation:
  language: hi
  text: तब दानिय्येल ने उस भण्डारी से कहा, जिसे खोजों के प्रधान ने दानिय्येल, हनन्याह, मीशाएल और अजर्याह की देखरेख के लिए नियुक्त किया था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक क्रम व्यक्त करता है।
- source_word: הַמֶּלְצַר
  choice: प्रबंधक
  rationale: यह संभवतः उस पदाधिकारी की पदवी है जो युवकों और उनके भोजन की प्रत्यक्ष देखरेख करता था; ‘प्रबंधक’ भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר מִנָּה
  choice: जिसे ... ने ... नियुक्त किया था
  rationale: सम्बन्धवाचक उपवाक्य पदाधिकारी की पहचान कराता है, और ‘नियुक्त किया था’ बताता है कि नियुक्ति दानिय्येल के बोलने से पहले हुई थी।
- source_word: שַׂר הַסָּרִיסִים
  choice: खोजों के प्रधान
  rationale: यह इब्रानी पदबंध का सीधा अर्थ है; फिर भी סָרִיסִים राजदरबार के अधिकारियों के लिए व्यापक अर्थ में भी प्रयुक्त हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַל
  choice: पर
  rationale: नियुक्ति के प्रसंग में यह देखरेख या अधिकार का सम्बन्ध व्यक्त करता है; हिन्दी में ‘पर नियुक्त किया’ संक्षिप्त और स्वाभाविक है।
- source_word: דָּנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: दानिय्येल, हनन्याह, मीशाएल और अजर्याह
  rationale: मूल पाठ में आए इब्रानी नामों को लिप्यंतरित किया गया है; यहाँ बाबिली नाम नहीं रखे गए हैं।
