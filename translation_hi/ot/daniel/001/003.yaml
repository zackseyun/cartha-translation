  yaml_path: translation/ot/daniel/001/003.yaml
  text: Then the king told Ashpenaz[a], the chief of his court officials, to bring some of the sons of Israel, both from the royal offspring and from the nobles,
translation:
  language: hi
  text: तब राजा ने अपने दरबारी अधिकारियों के प्रधान अशपनज से कहा कि वह इस्राएलियों में से कुछ को, अर्थात् राजवंश के वंशजों और कुलीनों में से, ले आए,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... से कहा
  rationale: वाव-परिणामी कथानक को आगे बढ़ाता है, इसलिए ‘तब’ क्रम को स्वाभाविक ढंग से व्यक्त करता है। इसके बाद आने वाला प्रयोजनसूचक क्रियारूप कथन को निर्देश का भाव देता है, पर मूल क्रिया स्वयं ‘आज्ञा दी’ जितनी प्रबल नहीं है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चयवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לְאַשְׁפְּנַז
  choice: अशपनज
  rationale: इब्रानी व्यक्तिनाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: רַב סָרִיסָיו
  choice: अपने दरबारी अधिकारियों के प्रधान
  rationale: רַב का अर्थ प्रधान है। סָרִיס शब्द वास्तविक नपुंसकों अथवा व्यापक अर्थ में राजकीय/दरबारी अधिकारियों को सूचित कर सकता है; मुख्य पाठ में प्रसंगानुकूल व्यापक अर्थ रखा गया और दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְהָבִיא
  choice: कि वह ... लाए
  rationale: בוא के हिफ़ील क्रियारूप का कारक अर्थ ‘लाना’ है। हिन्दी में ‘से कहा कि वह ... लाए’ निर्देशात्मक वाक्यरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में से कुछ युवकों को
  rationale: मुहावरा मूलतः ‘इस्राएल के पुत्रों में से’ है। अगले पद में चुने जाने वालों के युवा और पुरुष होने का विवरण स्पष्ट होता है; आधुनिक हिन्दी में ‘इस्राएलियों में से कुछ युवकों’ से आशय स्वाभाविक और प्रसंगानुकूल बनता है।
- source_word: וּמִזֶּרַע הַמְּלוּכָה
  choice: जो राजवंश ... से हों
  rationale: זֶרַע वंश या संतान का बोध कराता है। ‘राजवंश से’ रक्त-संबंध और राजकीय वंश दोनों को संक्षेप तथा स्वाभाविकता से व्यक्त करता है।
- source_word: וּמִן הַפַּרְתְּמִים
  choice: और कुलीन परिवारों से
  rationale: दुर्लभ शब्द פַּרְתְּמִים उच्च सामाजिक पद वाले कुलीनों को सूचित करता है। व्यक्तियों के चयन की वंशगत समानांतर रचना में ‘कुलीन परिवारों से’ सहज हिन्दी है और किसी अनिश्चित तकनीकी पद को अनावश्यक रूप से निश्चित नहीं करता।
