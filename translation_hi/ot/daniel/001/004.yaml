source:
  edition: WLC
  text: יְלָדִ֣ים אֲשֶׁ֣ר אֵֽין בָּ/הֶ֣ם כָּל מאום וְ/טוֹבֵ֨י מַרְאֶ֜ה וּ/מַשְׂכִּילִ֣ים בְּ/כָל חָכְמָ֗ה וְ/יֹ֤דְעֵי דַ֨עַת֙ וּ/מְבִינֵ֣י מַדָּ֔ע וַ/אֲשֶׁר֙ כֹּ֣חַ בָּ/הֶ֔ם לַ/עֲמֹ֖ד בְּ/הֵיכַ֣ל הַ/מֶּ֑לֶךְ וּֽ/לֲ/לַמְּדָ֥/ם סֵ֖פֶר וּ/לְשׁ֥וֹן כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/004.yaml
  text: young men in whom there was no defect at all[a], good in appearance, skillful in all wisdom, knowledgeable in learning, discerning in understanding, and who had the ability to stand in the king’s palace[c][b], and to teach them the literature and language of the Chaldeans.
translation:
  language: hi
  text: ऐसे युवक, जिनमें कोई भी शारीरिक दोष न हो, जो रूपवान हों, हर प्रकार की बुद्धि में निपुण, ज्ञानवान और विद्या को समझने वाले हों, तथा जो राजा के महल में उपस्थित रहने[a] की क्षमता रखते हों, और जिन्हें कसदियों[c] का साहित्य[b] और भाषा सिखाई जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के महल में खड़े रहने।” इसका अर्थ राजा के दरबार में उपस्थित रहना या सेवा करना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “साहित्य” के लिए प्रयुक्त शब्द का अधिक शाब्दिक अर्थ “लेखन” या “पुस्तक” हो सकता है; यह लिपिकीय शिक्षा का भी संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: “कसदी” शब्द इस संदर्भ में व्यापक रूप से बाबुलियों को सूचित कर सकता है, पर हिब्रू पाठ में विशेष रूप से “कसदी” ही है।
    reason: cultural_note
lexical_decisions:
- source_word: יְלָדִים
  choice: युवक
  rationale: राजदरबार के लिए चुने जा रहे किशोर या युवा पुरुषों के संदर्भ में यह स्वाभाविक और आयु-संगत शब्द है।
- source_word: אֵין בָּהֶם כָּל מְאוּם
  choice: जिनमें कोई भी शारीरिक दोष न हो
  rationale: מְאוּם यहाँ शारीरिक दोष को सूचित करता है; 'शारीरिक' जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है और 'कोई भी' כָּל की व्यापकता रखता है।
- source_word: טוֹבֵי מַרְאֶה
  choice: देखने में सुंदर
  rationale: यह रूप-रंग के अनुकूल मूल्यांकन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַשְׂכִּילִים בְּכָל חָכְמָה
  choice: हर प्रकार की बुद्धि में निपुण
  rationale: שכל से व्यक्त सूझ-बूझ या दक्षता और כָּל חָכְמָה के व्यापक ज्ञान-क्षेत्र, दोनों को सुरक्षित रखता है।
- source_word: יֹדְעֵי דַעַת
  choice: ज्ञान से संपन्न
  rationale: हिब्रू के 'ज्ञान जानने वाले' रूप को यांत्रिक ढंग से दोहराए बिना बौद्धिक उपलब्धि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְבִינֵי מַדָּע
  choice: विद्या को समझने वाले
  rationale: בין की समझने-परखने की क्षमता और מַדָּע के अर्जित ज्ञान या विद्या के भाव को अलग पहचान देता है।
- source_word: כֹּחַ בָּהֶם
  choice: जिनमें ... की योग्यता हो
  rationale: संदर्भ में כֹּחַ केवल शारीरिक बल नहीं, बल्कि राजकीय उपस्थिति या सेवा की क्षमता है।
- source_word: לַעֲמֹד בְּהֵיכַל הַמֶּלֶךְ
  choice: राजा के महल में उपस्थित रहने
  rationale: शाब्दिक 'खड़े रहने' के दरबारी मुहावरे को अनावश्यक रूप से केवल 'सेवा करने' तक सीमित किए बिना उसके उपस्थित/तैनात रहने के भाव को व्यक्त करता है।
- source_word: הֵיכַל
  choice: महल
  rationale: राजकीय बाबुली संदर्भ में यह मंदिर नहीं, राजा का महल है।
- source_word: לְלַמְּדָם
  choice: उन्हें ... सिखाई जाए
  rationale: וּלֲלַמְּדָם पूर्ववर्ती राजकीय आदेश/चयन से जुड़ा उद्देश्यसूचक रूप है; हिन्दी में कर्मवाच्य इस खंड को सहज बनाता है।
- source_word: סֵפֶר
  choice: लिपि
  rationale: यहाँ סֵפֶר लेखन, अक्षर-ज्ञान या शास्त्रीय साहित्यिक शिक्षा को सूचित कर सकता है; भाषा के साथ युग्म में 'लिपि' संक्षिप्त और संदर्भोचित है, जबकि व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְשׁוֹן כַּשְׂדִּים
  choice: कसदियों की ... भाषा
  rationale: हिब्रू जातिनाम כַּשְׂדִּים को सामान्यीकृत करके केवल 'बाबुलियों' नहीं किया गया; לָשׁוֹן का स्पष्ट आधुनिक समतुल्य 'भाषा' है।
