source:
  edition: WLC
  text: נַס נָ֥א אֶת עֲבָדֶ֖י/ךָ יָמִ֣ים עֲשָׂרָ֑ה וְ/יִתְּנוּ לָ֜/נוּ מִן הַ/זֵּרֹעִ֛ים וְ/נֹאכְלָ֖ה וּ/מַ֥יִם וְ/נִשְׁתֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/012.yaml
  text: Please test your servants for ten days[a], and let us be given vegetables to eat and water to drink.
translation:
  language: hi
  text: “कृपया अपने सेवकों को दस दिन तक आज़माइए[a], और हमें खाने के लिए बीजों से उपजा भोजन तथा पीने के लिए पानी दिया जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परखिए।”
    reason: נסה के लिए निकट अर्थ वाला अनुवाद-विकल्प; दोनों रूप सीमित अवधि के परीक्षण के अनुरोध को व्यक्त करते हैं।
lexical_decisions:
- source_word: נַס נָא
  choice: कृपया ... परखकर देखिए
  rationale: נסה का आदेशात्मक रूप यहाँ सीमित अवधि के परीक्षण का अनुरोध है, और נָא उसे विनम्र बनाता है। ‘परखकर देखिए’ आधुनिक हिन्दी में परीक्षणात्मक भाव और विनीत अनुरोध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: दरबारी प्रसंग में यह अधिकारी के सामने दीनतापूर्ण आत्म-संबोधन है। ‘सेवक’ सामाजिक विनम्रता रखता है, जबकि ‘दास’ यहाँ अनावश्यक रूप से बंधुआपन पर बल दे सकता है।
- source_word: יָמִים עֲשָׂרָה
  choice: दस दिन तक
  rationale: हिब्रू में अवधि का कर्मकारक है; हिन्दी में ‘तक’ परीक्षण की अवधि को सहज रूप से व्यक्त करता है।
- source_word: וְיִתְּנוּ לָנוּ
  choice: हमें ... दिया जाए
  rationale: तृतीय पुरुष बहुवचन इच्छासूचक रूप एक अनुरोध व्यक्त करता है। हिन्दी का कर्मवाच्य अज्ञात/अप्रमुख देनेवालों के बजाय माँगी गई व्यवस्था पर ध्यान रखता है।
- source_word: מִן הַזֵּרֹעִים
  choice: बीज से उपजा भोजन
  rationale: זֵרֹעִים का अर्थ केवल आधुनिक संकीर्ण अर्थ वाले ‘सब्ज़ियाँ’ तक सीमित नहीं है, बल्कि बीज से उत्पन्न खाद्य वनस्पति को व्यापक रूप से सूचित करता है। मुख्य पाठ में यह व्यापकता सुरक्षित रखी गई है।
- source_word: וְנֹאכְלָה וּמַיִם וְנִשְׁתֶּה
  choice: खाने के लिए ... और पीने के लिए पानी
  rationale: दोनों इच्छासूचक क्रियाओं को हिन्दी में प्रयोजनसूचक समानांतर वाक्यांशों से स्वाभाविक और स्पष्ट बनाया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, विनीत और दरबारी प्रसंग के अनुरूप है। ‘बीज से उपजा भोजन’ जानबूझकर ‘सब्ज़ियाँ’ से व्यापक रखा गया है, ताकि मूल हिब्रू की अर्थ-सीमा संकुचित न हो।
