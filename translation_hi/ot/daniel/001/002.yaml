source:
  edition: WLC
  text: וַ/יִּתֵּן֩ אֲדֹנָ֨/י בְּ/יָד֜/וֹ אֶת יְהוֹיָקִ֣ים מֶֽלֶךְ יְהוּדָ֗ה וּ/מִ/קְצָת֙ כְּלֵ֣י בֵית הָֽ/אֱלֹהִ֔ים וַ/יְבִיאֵ֥/ם אֶֽרֶץ שִׁנְעָ֖ר בֵּ֣ית אֱלֹהָ֑י/ו וְ/אֶת הַ/כֵּלִ֣ים הֵבִ֔יא בֵּ֖ית אוֹצַ֥ר אֱלֹהָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/002.yaml
  text: And the Lord gave Jehoiakim king of Judah into his hand[a], along with some of the vessels of the house of God. He brought them to the land of Shinar, to the house of his god[c][b], and he brought the vessels into the treasury of his god.
translation:
  language: hi
  text: और प्रभु ने यहूदा के राजा यहोयाकीम को और परमेश्वर के भवन के कुछ पात्रों को उसके हाथ में दे दिया[a]। वह उन्हें शिनार देश[b] में अपने देवता के भवन[c] में ले आया, और पात्रों को अपने देवता के कोषागार में ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदा के राजा यहोयाकीम को उसके हाथ में सौंप दिया।’
    reason: lexical_alternative
  - marker: b
    text: शिनार बाबेल देश का प्राचीन नाम है।
    reason: cultural_note
  - marker: c
    text: या ‘अपने देवता के मन्दिर में।’ इब्रानी में परमेश्वर के भवन और बाबेली देवता के भवन, दोनों के लिए ‘भवन’ शब्द आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: व्यंजनात्मक पाठ में אֲדֹנָי है, יהוה नहीं। इसलिए इसे ‘प्रभु’ कहा गया है; ‘यहोवा’ कहना स्रोत-पाठ से आगे जाना होता।
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का मूल अर्थ ‘देना’ है। यहाँ इसका भाव किसी को दूसरे के अधिकार में सौंपना है, पर सरल इब्रानी अभिव्यक्ति और परमेश्वर की सक्रिय भूमिका बनाए रखने के लिए ‘दे दिया’ रखा गया है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: यह सामर्थ्य या अधिकार में दिए जाने का इब्रानी मुहावरा है। हिन्दी में ‘हाथ में’ वही सजीव बिंब बनाए रखता है और सन्दर्भ से इसका संकेत नबूकदनेस्सर की ओर है।
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोयाकीम
  rationale: हिन्दी की स्वाभाविक पद-रचना में राजकीय उपाधि और नाम को सीधे व्यक्त किया गया है।
- source_word: וּמִקְצָת כְּלֵי בֵית הָאֱלֹהִים
  choice: और परमेश्वर के भवन के कुछ पात्रों को
  rationale: מִקְצָת का अर्थ ‘कुछ/एक भाग’ और כְּלֵי का अर्थ वस्तुएँ या पात्र है। ‘भवन’ से בֵית का शाब्दिक बिंब और आगे आने वाला साहित्यिक साम्य सुरक्षित रहता है।
- source_word: וַיְבִיאֵם
  choice: वह उन्हें ... ले आया
  rationale: बहुवचन कर्म-प्रत्यय को ‘उन्हें’ से सुरक्षित रखा गया है। इससे पूर्ववर्ती संयुक्त कर्म—यहोयाकीम और पात्र—की सम्भावित सामूहिक ओर-संकेतना को सीमित नहीं किया गया।
- source_word: אֶרֶץ שִׁנְעָר
  choice: शिनार देश
  rationale: אֶרֶץ को ‘देश’ से व्यक्त किया गया और प्राचीन स्थान-नाम שִׁנְעָר का लिप्यन्तरण रखा गया है।
- source_word: בֵּית אֱלֹהָיו
  choice: अपने देवता के भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है। ‘भवन’ रखने से परमेश्वर के भवन और बाबेली देवता के भवन के बीच का साहित्यिक साम्य बचता है; मूर्तिपूजक देवता के लिए ‘देवता’ प्रयुक्त है।
- source_word: בֵּית אוֹצַר אֱלֹהָיו
  choice: अपने देवता के कोषागार
  rationale: אוֹצָר का अर्थ भंडार या कोष है। ‘कोषागार’ मन्दिर में मूल्यवान वस्तुएँ रखने के स्थान को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: וְאֶת הַכֵּלִים הֵבִיא
  choice: और पात्रों को ... ले आया
  rationale: इब्रानी में ‘ले आया’ की पुनरावृत्ति है; अनावश्यक रूप से पाठ को सँवारने के बजाय उसे हिन्दी में भी बनाए रखा गया है।
theological_decisions:
- issue: यरूशलेम की पराजय में प्रभु की सार्वभौमिक सक्रियता
  choice: प्रभु ने यहोयाकीम को नबूकदनेस्सर के हाथ में दे दिया।
  alternative: प्रभु ने केवल यहोयाकीम को पराजित होने दिया।
  rationale: परमेश्वर कर्ता के रूप में נתן क्रिया का प्रयोग सक्रिय दैवी कार्य बताता है। अनुवाद इस कथन को केवल अनुमति देने तक नरम नहीं करता।
- issue: וַיְבִיאֵם में ‘उन्हें’ का संदर्भ
  choice: बहुवचन ‘उन्हें’ को बनाए रखा गया, जो निकटवर्ती संयुक्त कर्म यहोयाकीम और पात्रों की ओर संकेत कर सकता है।
  alternative: इसे केवल पात्रों के रूप में स्पष्ट कर देना।
  rationale: इब्रानी में बहुवचन सर्वनाम है और उसका संदर्भ व्याकरणतः सामूहिक हो सकता है। अगले उपवाक्य में पात्रों का अलग उल्लेख है; इसलिए मूल की सम्भावित व्यापकता को चुपचाप सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘प्रभु’ और ‘परमेश्वर’ के बीच स्रोत-पाठ का भेद रखा गया है। ‘देवता’ बाबेली आराध्य के लिए प्रयुक्त है। ‘भवन’, ‘पात्र’ और ‘कोषागार’ औपचारिकता तथा प्राचीन मन्दिर-सन्दर्भ दोनों को संतुलित करते हैं।
