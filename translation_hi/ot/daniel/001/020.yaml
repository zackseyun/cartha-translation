  text: וְ/כֹ֗ל דְּבַר֙ חָכְמַ֣ת בִּינָ֔ה אֲשֶׁר בִּקֵּ֥שׁ מֵ/הֶ֖ם הַ/מֶּ֑לֶךְ וַֽ/יִּמְצָאֵ֞/ם עֶ֣שֶׂר יָד֗וֹת עַ֤ל כָּל הַֽ/חַרְטֻמִּים֙ הָֽ/אַשָּׁפִ֔ים אֲשֶׁ֖ר בְּ/כָל מַלְכוּתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/020.yaml
  text: And in every matter of wisdom and understanding that the king asked of them[b][a], he found them ten times better than all the magicians and enchanters who were in all his kingdom.
translation:
  language: hi
  text: और बुद्धि और समझ के हर विषय में जो राजा ने उनसे पूछा, राजा ने उन्हें अपने पूरे राज्य के सब जादूगरों और मंत्रविदों[b] से दस गुना श्रेष्ठ[a] पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दस हाथ ऊपर।” यह इब्रानी मुहावरा बहुत अधिक श्रेष्ठ होने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या “जादूगरों और ज्योतिषियों।” दूसरा शब्द बेबीलोन के विद्वानों के एक वर्ग को दर्शाता है, पर हिंदी में उसका सटीक समतुल्य अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֹל דְּבַר
  choice: और ... हर बात में
  rationale: संयोजक वाव पिछले पद से कथन को जोड़ता है, और דָּבָר यहाँ किसी शब्द के बजाय जाँच या विचार के विषय को दर्शाता है। हिंदी में ‘हर बात में’ स्वाभाविक रूप से इस व्यापकता को व्यक्त करता है।
- source_word: חָכְמַת בִּינָה
  choice: बुद्धि और समझ की
  rationale: यह पदबंध बौद्धिक विवेक के क्षेत्र को सूचित करता है। ‘बुद्धि और समझ’ दोनों संज्ञाओं को अलग रखते हुए सहज आधुनिक हिंदी देता है।
- source_word: אֲשֶׁר בִּקֵּשׁ מֵהֶם הַמֶּלֶךְ
  choice: जिसके विषय में राजा ने उनसे पूछा
  rationale: בקשׁ עם מן इस प्रसंग में पूछताछ या परीक्षा लेने का भाव रखता है। ‘जिसके विषय में ... पूछा’ राजा द्वारा उनकी जाँच किए जाने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּמְצָאֵם
  choice: उसने उन्हें ... पाया
  rationale: क्रिया राजा के मूल्यांकन और निष्कर्ष को व्यक्त करती है। हिंदी में ‘उसने उन्हें ... पाया’ मूल के प्रत्यक्ष कर्म और आकलन दोनों को सुरक्षित रखता है।
- source_word: עֶשֶׂר יָדוֹת עַל
  choice: से दस गुना श्रेष्ठ
  rationale: शाब्दिक अभिव्यक्ति ‘दस हाथ ऊपर’ श्रेष्ठता का इब्रानी मुहावरा है। ‘दस गुना श्रेष्ठ’ संख्यात्मक अतिशयोक्ति और तुलना दोनों को स्पष्ट रूप से संप्रेषित करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הַחַרְטֻמִּים
  choice: जादूगरों
  rationale: यह शब्द राजदरबार से जुड़े गूढ़ या धार्मिक कलाओं के विशेषज्ञों को दर्शाता है। ‘जादूगर’ सामान्य पाठक के लिए सुबोध है और शब्द को अत्यधिक तकनीकी नहीं बनाता।
- source_word: הָאַשָּׁפִים
  choice: मंत्रविदों
  rationale: यह बेबीलोनी बुद्धिमानों के एक ऐसे वर्ग का संकेत करता है जिसका संबंध संभवतः मंत्रों या गूढ़ विद्या से था, पर सटीक समतुल्य अनिश्चित है। ‘मंत्रविद’ पहले समूह से भेद बनाए रखता है और ‘ज्योतिषी’ जैसी अधिक विशिष्ट व्याख्या थोपने से बचता है।
- source_word: אֲשֶׁר בְּכָל מַלְכוּתוֹ
  choice: अपने पूरे राज्य के सब
  rationale: यह वाक्यांश नबूकदनेस्सर के समूचे राज्य में मौजूद विशेषज्ञों को समेटता है। ‘अपने पूरे राज्य के सब’ हिंदी में सीमा और समग्रता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: बेबीलोनी राजदरबार के विशेषज्ञों के पदनामों को बाद की या अत्यधिक विशिष्ट श्रेणियों से बचाते हुए प्रस्तुत करना
  choice: जादूगरों और मंत्रविदों
  alternative: जादूगरों और ज्योतिषियों
  rationale: पद दानिय्येल और उसके साथियों की परमेश्वर-प्रदत्त बुद्धि की तुलना बेबीलोन के मान्य दरबारी गूढ़-विद्या विशेषज्ञों से करता है। चुना हुआ अनुवाद इस विरोध को स्पष्ट रखता है, पर दूसरे इब्रानी पद का अर्थ केवल ज्योतिष तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य-क्रम हिंदी की स्वाभाविक तुलना-रचना के अनुसार है। ‘मंत्रविद’ दुर्लभ तकनीकी सटीकता का दावा किए बिना दरबारी गूढ़-विद्या की पृष्ठभूमि बनाए रखता है।
