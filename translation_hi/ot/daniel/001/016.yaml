  text: So the steward kept taking away their choice food and the wine they were to drink[b][a], and kept giving them vegetables.
translation:
  language: hi
  text: इस प्रकार प्रबंधक उनके लिए निर्धारित राजकीय उत्तम व्यंजन[a] और उनके पीने की दाखमधु हटाता रहा और उन्हें सब्ज़ियाँ[b] देता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के उत्तम व्यंजनों में से उनका निर्धारित भाग।” इब्रानी शब्द פַּתְבָּגָם विशेष रूप से निर्धारित राजकीय भोजन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवादों में “दाल-दलहन।” इब्रानी शब्द זֵרְעֹנִים बीजों से मिलने वाले वनस्पति-आहार को दर्शाता है, जिसमें संभवतः सब्ज़ियाँ और फलियाँ शामिल थीं।
    reason: lexical_alternative
