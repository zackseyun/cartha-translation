  text: וַ/יֹּ֜אמֶר שַׂ֤ר הַ/סָּרִיסִים֙ לְ/דָ֣נִיֵּ֔אל יָרֵ֤א אֲנִי֙ אֶת אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ אֲשֶׁ֣ר מִנָּ֔ה אֶת מַאֲכַלְ/כֶ֖ם וְ/אֶת מִשְׁתֵּי/כֶ֑ם אֲשֶׁ֡ר לָ/מָּה֩ יִרְאֶ֨ה אֶת פְּנֵי/כֶ֜ם זֹֽעֲפִ֗ים מִן הַ/יְלָדִים֙ אֲשֶׁ֣ר כְּ/גִֽילְ/כֶ֔ם וְ/חִיַּבְתֶּ֥ם אֶת רֹאשִׁ֖/י לַ/מֶּֽלֶךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/010.yaml
  text: But the chief of the eunuchs said to Daniel[a], “I fear my lord the king, who assigned your food and your drink[c][b]. Why should he see your faces looking worse than the youths who are of your own age? Then you would endanger my head with the king.”
translation:
  language: hi
  text: लेकिन राजकीय खोजों के प्रधान[a] ने दानिय्येल से कहा, “मैं राजा से, जो मेरे स्वामी हैं, डरता हूँ। उसी ने तुम्हारे खाने और पीने का प्रबंध ठहराया है। वह क्यों देखे कि तुम्हारे चेहरे तुम्हारी ही उम्र के युवकों की अपेक्षा अधिक म्लान दिखाई दें?[b] तब तुम राजा के सामने मेरे सिर को जोखिम में डाल दोगे।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खोजों के प्रधान” का हिब्रू पद राजदरबार के अधिकारियों के प्रधान के अर्थ में भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अधिक म्लान दिखाई दें” का शाब्दिक भाव “चेहरे उदास, मलिन या परेशान दिखाई दें” है।
    reason: lexical_alternative
  - marker: c
    text: “मेरे सिर को जोखिम में डाल दोगे” मूल भाषा का मुहावरा है; इसका अर्थ है कि राजा के सामने उसका जीवन संकट में पड़ सकता था।
    reason: idiom_explanation
lexical_decisions:
- source_word: שַׂר הַסָּרִיסִים
  choice: खोजों के प्रधान
  rationale: यह पदबंध शाब्दिक रूप से खोजों के प्रधान को दर्शाता है; סָרִיס का अर्थ राजदरबारी अधिकारी भी हो सकता है, इसलिए व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: יָרֵא אֲנִי אֶת אֲדֹנִי הַמֶּלֶךְ
  choice: मैं अपने स्वामी राजा से डरता हूँ
  rationale: वर्तमान आशंका और राजदरबार के सम्मानसूचक भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִנָּה אֶת מַאֲכַלְכֶם וְאֶת מִשְׁתֵּיכֶם
  choice: जिसने तुम्हारे खाने-पीने की वस्तुएँ ठहराई हैं
  rationale: מִנָּה में निर्धारित करने का भाव है; מִשְׁתֵּיכֶם को केवल मदिरा कहना मूल से अधिक विशिष्ट होता।
- source_word: פְּנֵיכֶם זֹעֲפִים
  choice: तुम्हारे चेहरे ... अधिक मुरझाए हुए
  rationale: זֹעֲפִים उदास, मलिन या खराब दिखाई देने की अवस्था बता सकता है; संदर्भ में शारीरिक दशा की दृश्य तुलना है।
- source_word: הַיְלָדִים אֲשֶׁר כְּגִילְכֶם
  choice: तुम्हारी ही उम्र के दूसरे युवकों
  rationale: दरबारी प्रशिक्षण के संदर्भ में יְלָדִים के लिए ‘युवक’ उपयुक्त है और כְּגִילְכֶם समान आयु दर्शाता है।
- source_word: וְחִיַּבְתֶּם אֶת רֹאשִׁי לַמֶּלֶךְ
  choice: तुम राजा के सामने मेरा सिर खतरे में डाल दोगे
  rationale: मूल का सजीव ‘मेरा सिर’ रूपक सुरक्षित रखते हुए दंड अथवा प्राणहानि की जवाबदेही का आशय स्पष्ट किया गया है।
