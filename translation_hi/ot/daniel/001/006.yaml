  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: थे
  rationale: यहाँ היה का रूप कथा में एक समूह के भीतर इन व्यक्तियों की उपस्थिति बताता है। हिन्दी में वाक्य के अंत में ‘थे’ स्वाभाविक है; अलग से ‘और ऐसा हुआ’ कहना अनावश्यक रूप से शब्दशः होता।
- source_word: בָהֶם
  choice: उनमें
  rationale: पूर्ववर्ती प्रसंग में बताए गए बड़े समूह के भीतर समावेश का भाव है; ‘उनमें’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: מִבְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: शाब्दिक अर्थ ‘यहूदा के पुत्रों’ है, पर यहाँ यह वंश अथवा समुदाय की पहचान बताता है। ‘वंशजों’ मूल के संबंध को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित लिप्यंतरण।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: हिब्रू व्यक्तिगत नाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִישָׁאֵל
  choice: मीशाएल
  rationale: हिब्रू नाम की ध्वनियों और उसके घटकों को स्पष्ट रखने वाला हिन्दी लिप्यंतरण।
- source_word: וַעֲזַרְיָה
  choice: और अजर्याह
  rationale: वाव को सूची के अंतिम नाम से जोड़ने के लिए ‘और’ से व्यक्त किया गया है; नाम का हिन्दी में प्रचलित लिप्यंतरण ‘अजर्याह’ है।
