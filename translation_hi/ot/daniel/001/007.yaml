base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/007.yaml
  text: 'And the chief of the eunuchs gave them names: he gave Daniel the name Belteshazzar[a], Hananiah the name Shadrach, Mishael the name Meshach, and Azariah the name Abed-nego.'
translation:
  language: hi
  text: 'हिजड़ों के प्रधान[a] ने उन्हें नाम दिए: उसने दानिय्येल का नाम बेल्तशस्सर, हनन्याह का नाम शद्रक, मीशाएल का नाम मेशक और अजर्याह का नाम अबेद-नगो रखा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकीय अधिकारियों का प्रधान” अथवा “दरबारी अधिकारियों का प्रधान”; इब्रानी शब्द का अर्थ हिजड़ा हो सकता है और विस्तृत अर्थ में राजदरबार का अधिकारी भी।
    reason: lexical_alternative
lexical_decisions:
