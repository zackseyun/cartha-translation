- source_word: שַׂר הַסָּרִיסִים
  choice: हिजड़ों के प्रधान
  rationale: סָרִיס का मूल अर्थ ‘हिजड़ा’ है, जबकि राजदरबार के प्रसंग में यह व्यापक अर्थ में राजकीय या दरबारी अधिकारी भी हो सकता है। मुख्य पाठ में प्रत्यक्ष अर्थ रखा गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיָּשֶׂם
  choice: नाम ... रखा
  rationale: दोहराए गए इब्रानी क्रिया-भाव को हिन्दी में पहले सामूहिक रूप ‘नाम रखे’ और फिर प्रत्येक व्यक्ति के लिए वितरणात्मक वाक्य-रचना ‘का नाम ... रखा’ से व्यक्त किया गया है।
- source_word: לְדָנִיֵּאל ... בֵּלְטְשַׁאצַּר
  choice: दानिय्येल का नाम बेलतशस्सर
  rationale: पूर्वसर्गयुक्त पुराने नाम के बाद दिया गया नया नाम नामकरण को सूचित करता है; हिन्दी में ‘का नाम ... रखा’ इसे स्पष्ट और सहज बनाता है।
- source_word: שַׁדְרַךְ / מֵישַׁךְ / עֲבֵד נְגוֹ
  choice: शद्रक / मेशक / अबेदनगो
  rationale: व्यक्तिवाचक नामों को अर्थानुवाद करने के बजाय हिन्दी की प्रचलित बाइबलीय वर्तनी के अनुसार लिप्यंतरित किया गया है।
