source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אִתָּ/ם֮ הַ/מֶּלֶךְ֒ וְ/לֹ֤א נִמְצָא֙ מִ/כֻּלָּ֔/ם כְּ/דָנִיֵּ֣אל חֲנַנְיָ֔ה מִֽישָׁאֵ֖ל וַ/עֲזַרְיָ֑ה וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/019.yaml
  text: The king spoke with them[a], and among them all no one was found like Daniel, Hananiah, Mishael, and Azariah; so they stood before the king.
translation:
  language: hi
  text: राजा ने उनसे बात की, और उन सब में दानिय्येल, हनन्याह, मीशाएल और अजर्याह के समान कोई नहीं पाया गया; इसलिए वे राजा के सामने खड़े हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे राजा की सेवा में नियुक्त हुए।” इब्रानी में शाब्दिक रूप से “वे राजा के सामने खड़े हुए” है; राजदरबार के संदर्भ में यह राजा की सेवा में उपस्थित होने का भाव भी व्यक्त करता है।
    reason: मुख्य पाठ में शाब्दिक दरबारी अभिव्यक्ति सुरक्षित रखते हुए उसका प्रसंगगत, वैकल्पिक अर्थ बताया गया है; आरम्भसूचक अतिरिक्त अर्थ नहीं जोड़ा गया है।
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם
  choice: उनसे बातचीत की
  rationale: דבר के साथ אִתָּם प्रत्यक्ष संवाद को व्यक्त करता है। “बातचीत की” स्वाभाविक हिन्दी है और इसे अधिक व्याख्यात्मक “साक्षात्कार लिया” नहीं बनाती।
- source_word: וְלֹא נִמְצָא מִכֻּלָּם
  choice: उन सब में ... कोई नहीं पाया गया
  rationale: מצא के निफ़अल रूप का शाब्दिक भाव “पाया गया” रखा गया है, जबकि מִכֻּלָּם की पूरे समूह से तुलना को सहज हिन्दी में “उन सब में” कहा गया है।
- source_word: כְּדָנִיֵּאל חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: दानिय्येल, हनन्याह, मीशाएल और अजर्याह के समान
  rationale: כְּ तुलना सूचित करता है; इसलिए “के समान” स्रोत के अर्थ को स्पष्ट रूप से रखता है। व्यक्तिनामों का अनुवाद नहीं, लिप्यंतरण किया गया है।
- source_word: וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: इसलिए वे राजा के सामने खड़े हुए
  rationale: עמד और לִפְנֵי का दृश्यात्मक, शाब्दिक रूप मुख्य पाठ में सुरक्षित है। प्रसंग में यह राजकीय सेवा में उपस्थित होने का मुहावरा भी है, जिसे पादटिप्पणी में बताया गया है। संयोजक “इसलिए” पिछले मूल्यांकन के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
