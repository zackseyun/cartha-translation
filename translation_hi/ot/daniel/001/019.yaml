  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मुख्य पाठ में इब्रानी की तुलना और दरबारी अभिव्यक्ति सुरक्षित हैं; पादटिप्पणी उसके प्रसंगगत अर्थ को स्पष्ट करती है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न पहले खंड के बाद था, पर उसकी सामग्री अंतिम अभिव्यक्ति से संबंधित होने के कारण हिन्दी में चिह्न उसी स्थान पर रखा गया है।
