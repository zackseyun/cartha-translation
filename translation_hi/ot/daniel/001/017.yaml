source:
  edition: WLC
  text: וְ/הַ/יְלָדִ֤ים הָ/אֵ֨לֶּה֙ אַרְבַּעְתָּ֔/ם נָתַ֨ן לָ/הֶ֧ם הָֽ/אֱלֹהִ֛ים מַדָּ֥ע וְ/הַשְׂכֵּ֖ל בְּ/כָל סֵ֣פֶר וְ/חָכְמָ֑ה וְ/דָנִיֵּ֣אל הֵבִ֔ין בְּ/כָל חָז֖וֹן וַ/חֲלֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/017.yaml
  text: As for these four youths[a], God gave them knowledge and insight in every kind of literature and wisdom[b]; and Daniel had understanding in every vision and dream.
translation:
  language: hi
  text: इन चारों युवकों को परमेश्वर ने हर प्रकार की विद्या[a] और बुद्धि में ज्ञान और समझ दी; और दानिय्येल को हर दर्शन और स्वप्न के विषय में समझ[b] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर पुस्तक”; यहाँ यह अभिव्यक्ति संभवतः व्यापक अर्थ में लिखित विद्या या साहित्य को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “हर दर्शन और स्वप्न को समझता था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְלָדִים הָאֵלֶּה אַרְבַּעְתָּם
  choice: इन चारों युवकों को
  rationale: ‘युवकों’ से उनकी कम आयु व्यक्त होती है, पर ‘बालकों’ जैसा बचकाना भाव नहीं आता। प्रत्यय सहित संख्या को स्वाभाविक हिन्दी में ‘इन चारों’ कहा गया है।
- source_word: נָתַן לָהֶם הָאֱלֹהִים
  choice: परमेश्वर ने ... दी
  rationale: मूल पाठ ज्ञान और समझ का कर्ता तथा दाता स्पष्ट रूप से परमेश्वर को बताता है।
- source_word: מַדָּע וְהַשְׂכֵּל
  choice: ज्ञान और सूझ-बूझ
  rationale: दोनों निकटवर्ती बौद्धिक गुणों का भेद बनाए रखने के लिए מַדָּע को ‘ज्ञान’ और שכל से बने रूप को व्यावहारिक समझ दर्शाने वाला ‘सूझ-बूझ’ कहा गया है।
- source_word: בְּכָל סֵפֶר
  choice: हर प्रकार के लिखित ज्ञान
  rationale: סֵפֶר का शाब्दिक अर्थ ‘पुस्तक’ है, पर इस दरबारी शिक्षा-संदर्भ में अभिव्यक्ति व्यापक लिखित विद्या या साहित्य की ओर संकेत करती है। ‘लिखित ज्ञान’ सामान्य पाठक के लिए उस शैक्षिक क्षेत्र को स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְחָכְמָה
  choice: और बुद्धि में
  rationale: חָכְמָה का सामान्य और प्रसंगानुकूल अर्थ ‘बुद्धि’ है; यह लिखित ज्ञान के साथ व्यापक विवेकपूर्ण योग्यता को जोड़ता है।
- source_word: הֵבִין בְּכָל חָזוֹן וַחֲלֹמוֹת
  choice: हर दर्शन और स्वप्न के विषय में समझ थी
  rationale: यह दानिय्येल की विशेष समझ बताता है, पर यह अनावश्यक रूप से तय नहीं करता कि वह केवल व्याख्या करता था या स्वयं सभी दर्शन और स्वप्न पाता था।
theological_decisions:
- issue: युवकों की योग्यता में परमेश्वर की भूमिका
  choice: उनका ज्ञान, सूझ-बूझ और बुद्धि परमेश्वर की देन के रूप में स्पष्ट रखी गई है।
  alternative: इन योग्यताओं को केवल उनके स्वाभाविक विकास या प्रशिक्षण का फल मानना।
  rationale: נָתַן का कर्ता הָאֱלֹהִים है; इसलिए मूल पाठ में परमेश्वर की सक्रिय भूमिका स्पष्ट है।
- issue: दर्शनों और स्वप्नों के संबंध में दानिय्येल की देन का स्वरूप
  choice: दानिय्येल को उनके विषय में समझ थी।
  alternative: यह निश्चित करना कि वह हर दर्शन और स्वप्न को स्वयं पाता था, या यह कि वह केवल उनकी व्याख्या करता था।
  rationale: मूल वाक्य समझ को दर्शनों और स्वप्नों से जोड़ता है, पर ग्रहण और व्याख्या के बीच स्पष्ट चुनाव नहीं करता; अनुवाद उसी व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘सूझ-बूझ’ निकट अर्थ वाले दो हिब्रू शब्दों का अंतर स्पष्ट करती है। वाक्य की समानांतर संरचना और दानिय्येल को मिली विशिष्ट योग्यता दोनों सुरक्षित रखे गए हैं।
