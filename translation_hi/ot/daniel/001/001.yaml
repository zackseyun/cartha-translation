base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/001.yaml
  text: In the third year of the reign of Jehoiakim king of Judah[b][a], Nebuchadnezzar king of Babylon came to Jerusalem and besieged it.
translation:
  language: hi
  text: यहूदा के राजा यहोयाकीम के शासन के तीसरे वर्ष में, बाबेल का राजा नबूकदनेस्सर[b] यरूशलेम आया और उसने उसे घेर लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसकी घेराबंदी कर दी।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ नाम का रूप “नबूकदनेस्सर” है; कुछ परम्पराओं और अन्य पदों में “नबूकदरेस्सर” रूप भी मिलता है।
    reason: lexical_alternative
