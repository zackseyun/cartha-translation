  choice: शासन के तीसरे वर्ष में
  rationale: यह राजकीय काल-निर्धारण की स्वाभाविक हिन्दी अभिव्यक्ति है; ‘तीसरे’ क्रमवाचक अर्थ को और ‘शासन’ מַלְכוּת के सन्दर्भगत अर्थ को व्यक्त करता है।
- source_word: יְהוֹיָקִים מֶלֶךְ יְהוּדָה
  choice: यहूदा के राजा यहोयाकीम
  rationale: नाम और पद को आधुनिक हिन्दी में स्वाभाविक क्रम में रखा गया है और इब्रानी संबंध-संरचना का अर्थ सुरक्षित है।
- source_word: בָּא
  choice: आया
