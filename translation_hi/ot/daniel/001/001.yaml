- source_word: נְבוּכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: यह इब्रानी रूप के अनुरूप प्रचलित हिन्दी बाइबलीय लिप्यंतरण है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबेल का राजा
  rationale: यह पद और राज्य के संबंध को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: וַיָּצַר עָלֶיהָ
  choice: और उसने उसे घेर लिया
  rationale: צור के साथ על सैन्य प्रसंग में नगर को घेरने अथवा उसकी घेराबंदी करने का अर्थ देता है। यह रूप संक्षिप्त और सहज है।
