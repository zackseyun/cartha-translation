base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/005.yaml
  text: And the king assigned to them a daily portion from the king’s food and from the wine he drank[a], and to bring them up for three years[c][b]; and at the end of them they were to stand before the king.
translation:
  language: hi
  text: और राजा ने उनके लिए प्रतिदिन राजा के भोजन में से और उसके पीने के दाखरस में से एक भाग निर्धारित किया,[a] और उनके तीन वर्ष तक पालन-पोषण की व्यवस्था की; उन वर्षों के अंत में[b] उन्हें राजा के सामने सेवा के लिए उपस्थित होना था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘राजा का भोजन’ का अर्थ राजा की मेज़ से मिलने वाला विशेष या बढ़िया भोजन भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उनके अंत में,’ अर्थात उन तीन वर्षों के अंत में।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वे राजा के सामने खड़े हों।’ यह राजदरबार में सेवा के लिए उपस्थित होने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַן
  choice: निर्धारित किया
  rationale: क्रिया का अर्थ किसी वस्तु को किसी के लिए नियुक्त या आवंटित करना है; राजकीय व्यवस्था के संदर्भ में ‘निर्धारित किया’ स्वाभाविक है।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: प्रतिदिन ... कुछ
  rationale: यह मुहावरा हर दिन के लिए निश्चित अंश को दर्शाता है; हिन्दी में वाक्य के साथ ‘प्रतिदिन ... कुछ’ सहज रूप से वही भाव देता है।
- source_word: מִפַּת בַּג הַמֶּלֶךְ
  choice: अपने राजकीय भोजन में से कुछ
  rationale: पत-बग राजकीय मेज़ से मिलने वाले विशेष भोजन या प्रावधान को सूचित करता है। मुख्य पाठ में संयत अर्थ रखा गया है और विलासपूर्ण भोजन की सम्भावना पादटिप्पणी में दी गई है।
- source_word: וּמִיֵּין מִשְׁתָּיו
  choice: अपने पीने के दाखमधु में से कुछ
  rationale: यह राजा के पीने के लिए प्रयुक्त दाखमधु को स्पष्ट करता है और मूल के व्यक्तिगत सम्बन्ध को बनाए रखता है।
- source_word: וּלְגַדְּלָם
  choice: आज्ञा दी कि ... उनका पालन-पोषण किया जाए
  rationale: हिफ़ील रूप उन्हें बढ़ाने, पोसने या परिपक्व करने की व्यवस्था बताता है। ‘पालन-पोषण’ शारीरिक पोषण और विकास दोनों को समेटता है, बिना इसे केवल शिक्षा तक सीमित किए।
- source_word: שָׁנִים שָׁלוֹשׁ
  choice: तीन वर्ष तक
  rationale: अवधि को आधुनिक हिन्दी में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמִקְצָתָם
  choice: उस अवधि के अंत में
  rationale: सर्वनाम का संकेत तीन वर्षों की अवधि की ओर है। हिन्दी में स्पष्टता हेतु उसका संदर्भ व्यक्त किया गया है; शाब्दिक रूप पादटिप्पणी में है।
- source_word: יַעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: राजा के सामने उपस्थित होकर सेवा करनी थी
  rationale: ‘राजा के सामने खड़े होना’ दरबारी मुहावरा है, जिसका आशय राजकीय उपस्थिति और सेवा है। हिन्दी में अर्थ स्पष्ट किया गया है और मूल बिंब पादटिप्पणी में सुरक्षित है।
