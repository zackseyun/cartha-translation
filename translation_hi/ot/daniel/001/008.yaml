  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּנִיֵּאל֙ עַל לִבּ֔/וֹ אֲשֶׁ֧ר לֹֽא יִתְגָּאַ֛ל בְּ/פַתְבַּ֥ג הַ/מֶּ֖לֶךְ וּ/בְ/יֵ֣ין מִשְׁתָּ֑י/ו וַ/יְבַקֵּשׁ֙ מִ/שַּׂ֣ר הַ/סָּרִיסִ֔ים אֲשֶׁ֖ר לֹ֥א יִתְגָּאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/001/008.yaml
  text: But Daniel resolved in his heart that he would not defile himself with the king’s food or with the wine he drank[a], and he sought permission from the chief of the eunuchs that he might not defile himself.
translation:
  language: hi
  text: परन्तु दानिय्येल ने अपने मन में ठान लिया कि वह राजा के भोजन और उसके पीने की दाखमधु से अपने को अशुद्ध नहीं करेगा। इसलिए उसने खोजों के प्रधान[a] से अनुमति माँगी कि वह अपने को अशुद्ध न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजकीय अधिकारियों का प्रधान”; इब्रानी शब्द का अर्थ शाब्दिक रूप से खोजे अथवा अधिक व्यापक रूप से ऊँचे पद के राजकीय अधिकारी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם ... עַל לִבּוֹ
  choice: अपने मन में ठान लिया
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘अपने हृदय पर रखना’ है और यह भीतरी, दृढ़ निश्चय व्यक्त करता है। आधुनिक हिन्दी में ‘अपने मन में ठान लिया’ वही भाव स्वाभाविक रूप से देता है।
- source_word: יִתְגָּאַל
  choice: अपने को अशुद्ध करेगा / करे
  rationale: हित्पएल रूप यहाँ स्वयं को दूषित या अशुद्ध करने का भाव देता है। ‘अशुद्ध’ नैतिक-अनुष्ठानिक व्यापकता बनाए रखता है और अशुद्धता का कारण तय नहीं करता।
- source_word: פַּתְבַּג
  choice: भोजन
  rationale: यह राजा की ओर से नियत खाद्य-सामग्री को सूचित करता है। ‘भोजन’ स्पष्ट और व्यापक है; ‘स्वादिष्ट व्यंजन’ विलासिता का भाव आवश्यकता से अधिक जोड़ सकता है।
- source_word: יֵין מִשְׁתָּיו
  choice: उसके पीने का दाखमधु
  rationale: निर्माण का अर्थ राजा के पीने के लिए नियत दाखमधु है। यह अनुवाद राजा से उसके सम्बन्ध को बनाए रखते हुए हिन्दी में बोधगम्य है।
- source_word: שַׂר הַסָּרִיסִים
  choice: खोजों का प्रधान
  rationale: סָרִיס का मूल अर्थ ‘खोजा’ हो सकता है, यद्यपि यह राजकीय अधिकारी का व्यापक पदनाम भी बन सकता है। मुख्य पाठ स्रोत के प्रत्यक्ष अर्थ को रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में देता है।
- source_word: וַיְבַקֵּשׁ
  choice: अनुमति माँगी
  rationale: क्रिया ‘माँगना/निवेदन करना’ बताती है; सन्दर्भ में माँगी गई वस्तु अनुमति है, इसलिए यह निहित आशय स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: אֲשֶׁר לֹא יִתְגָּאָל
  choice: कि वह अपने को अशुद्ध न करे
  rationale: यह दानिय्येल के निवेदन की विषय-वस्तु अथवा उद्देश्य बताता है। ‘कि ... न करे’ दोनों सम्भावनाओं को स्वाभाविक हिन्दी में समेटता है।
theological_decisions:
- issue: राजकीय भोजन से दानिय्येल के अशुद्ध होने की प्रकृति
  choice: ‘अपने को अशुद्ध’ कहा गया है, पर अशुद्धता का सटीक कारण नहीं बताया गया।
  alternative: इसे केवल मूसा की भोजन-व्यवस्था का उल्लंघन, अनुष्ठानिक अशुद्धता, अथवा मूर्तिपूजक भोजन में सहभागिता कहना।
  rationale: इब्रानी पद स्वयं कारण स्पष्ट नहीं करता। व्यापक शब्द पाठ की वास्तविक धार्मिक और व्याख्यात्मक अनिश्चितता को सुरक्षित रखता है।
- issue: סָרִיסִים का आशय
  choice: मुख्य पाठ में ‘खोजों’ और पादटिप्पणी में व्यापक प्रशासनिक अर्थ।
  alternative: मुख्य पाठ में केवल ‘राजकीय अधिकारियों’ या ‘दरबारियों’ कहना।
  rationale: शब्द वास्तविक खोजों और सामान्य राजकीय अधिकारियों—दोनों को सूचित कर सकता है। मूल अर्थ को मुख्य पाठ में रखते हुए ऐतिहासिक अनिश्चितता पादटिप्पणी में सुरक्षित की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबलीय साहित्य में परिचित और सटीक शब्द है; ‘मन में ठान लिया’ शाब्दिकता और स्वाभाविकता का संतुलन रखता है।
