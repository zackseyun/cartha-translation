  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी वाक्य की समय-सूचक संरचना तथा ‘कहा था’ की सामान्य क्रिया को यथासम्भव सुरक्षित रखा गया है।
