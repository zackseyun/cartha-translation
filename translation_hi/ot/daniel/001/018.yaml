  yaml_path: translation/ot/daniel/001/018.yaml
  text: And at the end of the days that the king had said to bring them in[a], the chief of the eunuchs brought them before Nebuchadnezzar.
translation:
  language: hi
  text: और उस अवधि के अन्त में, जिसके बारे में राजा ने कहा था कि उन्हें लाया जाए, खोजों का प्रधान उन्हें नबूकदनेस्सर के सामने ले आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְמִקְצָת הַיָּמִים
  choice: और उन दिनों के अन्त में
  rationale: यह पदबंध निर्धारित अवधि की समाप्ति बताता है। ‘उन दिनों’ पूर्वप्रसंग में बताई गई अवधि की ओर संकेत करता है और इब्रानी के बहुवचन को बनाए रखता है।
- source_word: אֲשֶׁר אָמַר הַמֶּלֶךְ לַהֲבִיאָם
  choice: जिनके विषय में राजा ने कहा था कि उन्हें उसके सामने लाया जाए
  rationale: אָמַר के सामान्य अर्थ ‘कहा’ को बनाए रखते हुए हिन्दी में निर्देश का आशय स्वाभाविक ढंग से व्यक्त किया गया है। ‘उसके सामने’ दरबारी प्रसंग में निहित गन्तव्य को स्पष्ट करता है, पर क्रिया को अधिक व्याख्यात्मक ‘प्रस्तुत करना’ नहीं बनाता।
- source_word: וַיְבִיאֵם
  choice: उन्हें ... ले आया
  rationale: बוא के हिफ़ील रूप का सीधा कारक अर्थ ‘ले आना’ है; अगला पद गन्तव्य बताता है।
- source_word: שַׂר הַסָּרִיסִים
  choice: खोजों का प्रधान
  rationale: סָרִיס का प्रत्यक्ष और पारम्परिक दरबारी अर्थ ‘खोजा’ है। व्यापक अर्थ ‘राजकीय अधिकारी’ भी सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह किसी व्यक्ति की उपस्थिति में लाए जाने का सामान्य और स्वाभाविक हिन्दी रूप है।
- source_word: נְבֻכַדְנֶצַּר
  choice: नबूकदनेस्सर
  rationale: नाम को हिन्दी बाइबलीय प्रचलन के अनुरूप लिप्यन्तरित किया गया है।
