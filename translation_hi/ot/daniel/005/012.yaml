  rationale: 'संशोधन मूल अरामी सूची को एकीकृत करता है: दानिय्येल में ज्ञान-संबंधी गुणों के साथ व्याख्या और समाधान की क्षमताएँ भी पाई गई थीं। ‘पहेलियों का अर्थ बताने’ से אַחֲוָיַת אֲחִידָן का स्पष्टीकरणात्मक भाव स्पष्ट होता है, जबकि ‘कठिन समस्याएँ सुलझाने’ מְשָׁרֵא קִטְרִין के रूपकात्मक अर्थ को स्वाभाविक हिन्दी में देता है। मौजूदा ‘आत्मा’ संबंधी वैकल्पिक-पाठ पादटिप्पणी पर्याप्त है; चूँकि ‘गाँठें’ का शाब्दिक रूप मुख्य पाठ में नहीं रखा गया है, उसके लिए अलग पादटिप्पणी आवश्यक नहीं है।'
