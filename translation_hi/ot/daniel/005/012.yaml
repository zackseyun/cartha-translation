source:
  edition: WLC
  text: כָּ/ל קֳבֵ֡ל דִּ֣י ר֣וּחַ יַתִּירָ֡ה וּ/מַנְדַּ֡ע וְ/שָׂכְלְתָנ֡וּ מְפַשַּׁ֣ר חֶלְמִין֩ וַֽ/אַֽחֲוָיַ֨ת אֲחִידָ֜ן וּ/מְשָׁרֵ֣א קִטְרִ֗ין הִשְׁתְּכַ֤חַת בֵּ/הּ֙ בְּ/דָ֣נִיֵּ֔אל דִּֽי מַלְכָּ֥/א שָׂם שְׁמֵ֖/הּ בֵּלְטְשַׁאצַּ֑ר כְּעַ֛ן דָּנִיֵּ֥אל יִתְקְרֵ֖י וּ/פִשְׁרָ֥/ה יְהַֽחֲוֵֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/012.yaml
  text: because an extraordinary spirit[a], knowledge, and understanding to interpret dreams, explain riddles, and solve difficulties were found in him, in Daniel, whom the king named Belteshazzar. Now let Daniel be called[c][b], and he will show the interpretation.
translation:
  language: hi
  text: क्योंकि दानिय्येल में—जिसे राजा ने बेलतशस्सर नाम दिया था—एक असाधारण आत्मा[a], ज्ञान और समझ, तथा सपनों का अर्थ बताने, पहेलियों का अर्थ बताने और कठिन समस्याएँ सुलझाने की क्षमता पाई गई थी। अब दानिय्येल को बुलाया जाए, और वह उसका अर्थ बता देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्कृष्ट आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: क्योंकि
  rationale: यह अरामी कारणसूचक पद रानी द्वारा दानिय्येल की अनुशंसा का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: רוּחַ יַתִּירָה
  choice: असाधारण आत्मा
  rationale: יַתִּירָה उत्कृष्ट अथवा सामान्य से बढ़कर होने का भाव देता है। ‘असाधारण आत्मा’ स्रोत की अस्पष्टता बनाए रखता है और इसे स्पष्ट रूप से परमेश्वर के आत्मा के रूप में निर्धारित नहीं करता।
- source_word: מַנְדַּע וְשָׂכְלְתָנוּ
  choice: ज्ञान और समझ
  rationale: दोनों निकटवर्ती किंतु अलग गुणों को हिन्दी में अलग रखते हुए संचयी वर्णन सुरक्षित रखा गया है।
- source_word: מְפַשַּׁר חֶלְמִין
  choice: सपनों का अर्थ बताने
  rationale: यह दानिय्येल की सपनों की व्याख्या करने की क्षमता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַחֲוָיַת אֲחִידָן
  choice: पहेलियाँ समझाने
  rationale: वाक्यांश कठिन अथवा गूढ़ बातों को स्पष्ट करने का बोध देता है; ‘पहेलियाँ समझाने’ से दरबारी ज्ञान-संदर्भ भी बना रहता है।
- source_word: מְשָׁרֵא קִטְרִין
  choice: कठिन समस्याएँ सुलझाने
  rationale: शाब्दिक चित्र ‘गाँठें खोलना’ है, पर इसका आशय कठिन समस्याएँ हल करना है। मुख्य पाठ में स्वाभाविक मुहावरेदार हिन्दी चुनी गई है।
- source_word: הִשְׁתְּכַחַת בֵּהּ
  choice: उसमें ... पाई गई थी
  rationale: अरामी के एकवचन रूप को हिन्दी में गुणों के समेकित वर्णन के रूप में स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: דִּי מַלְכָּא שָׂם שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: जिसका नाम राजा ने बेलतशस्सर रखा था
  rationale: ‘उसका नाम रखा’ की अरामी अभिव्यक्ति का स्वाभाविक और निकट हिन्दी रूप।
- source_word: יִתְקְרֵי
  choice: बुलाया जाए
  rationale: निष्क्रिय आज्ञार्थक भाव सुरक्षित है और ‘पुकारा जाए’ की अपेक्षा इस प्रसंग में अधिक स्वाभाविक है।
- source_word: פִשְׁרָה יְהַחֲוֵה
  choice: वह इसका अर्थ बता देगा
  rationale: क्रिया का अर्थ व्याख्या को प्रकट या ज्ञात कराना है; ‘अर्थ बता देगा’ स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: ‘असाधारण आत्मा’ में ‘आत्मा’ का आशय
  choice: ‘असाधारण आत्मा’ कहकर स्रोत की खुली हुई भाषा बनाए रखी गई
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर का आत्मा’ अथवा केवल ‘असाधारण योग्यता’ कहना
  rationale: इस उपवाक्य में आत्मा के दिव्य स्रोत को स्पष्ट रूप से नहीं कहा गया है। अनुवाद न तो दिव्य अनुग्रह की संभावना को नकारता है, न उसे पाठ में जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। वाक्य की लंबी अरामी संरचना को डैश और अर्धविराम से स्पष्ट किया गया है। ‘गाँठें खोलना’ के शाब्दिक रूप के स्थान पर मुख्य पाठ में अर्थगत हिन्दी मुहावरा रखा गया है।
