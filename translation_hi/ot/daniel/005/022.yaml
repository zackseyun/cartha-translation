  text: ו/אנתה בְּרֵ/הּ֙ בֵּלְשַׁאצַּ֔ר לָ֥א הַשְׁפֵּ֖לְתְּ לִבְבָ֑/ךְ כָּ/ל קֳבֵ֕ל דִּ֥י כָל דְּנָ֖ה יְדַֽעְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/022.yaml
  text: But you[a], his son, Belshazzar, have not humbled your heart, though you knew all this.
translation:
  language: hi
  text: परन्तु उसके पुत्र[a] बेलशस्सर, तुमने अपने मन को नम्र नहीं किया, यद्यपि तुम यह सब जानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी में “पुत्र” का अर्थ “वंशज” या “उत्तराधिकारी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנְתָּה
  choice: परन्तु ... तुमने
  rationale: संयोजक और स्वतंत्र सर्वनाम नबूकदनेस्सर के अनुभव के साथ तीखा विरोध दिखाते हैं; हिन्दी में ‘परन्तु’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרֵהּ
  choice: उसके पुत्र
  rationale: मूल अरामी शब्द का सीधा अर्थ ‘उसका पुत्र’ है, पर यह वंशज या राजकीय उत्तराधिकारी के व्यापक अर्थ में भी प्रयुक्त हो सकता है; मुख्य पाठ में मूल संबंध-संज्ञा रखी गई है और व्यापक संभावना पाद-टिप्पणी में दी गई है।
- source_word: בֵּלְשַׁאצַּר
  choice: बेलशस्सर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: הַשְׁפֵּלְתְּ
  choice: नम्र नहीं किया
  rationale: क्रिया का अर्थ नीचा या नम्र करना है; ‘अपना मन नम्र करना’ नैतिक अभिमान के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: לִבְבָךְ
  choice: अपना मन
  rationale: अरामी ‘हृदय’ भीतरी व्यक्ति—इच्छा, समझ और वृत्ति—को सूचित करता है। इस वाक्यांश में आधुनिक हिन्दी का ‘मन नम्र करना’ स्रोत के आशय को अधिक स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: כָּל־קֳבֵל דִּי
  choice: यद्यपि
  rationale: 'यहाँ पदबंध रियायती विरोध व्यक्त करता है: सब जानने के बावजूद बेलशस्सर ने स्वयं को नम्र नहीं किया।'
- source_word: כָל־דְּנָה
  choice: यह सब
  rationale: यह पिछले वर्णन में नबूकदनेस्सर के साथ हुई समस्त घटना की ओर संकेत करता है।
- source_word: יְדַעְתָּ
  choice: जानते थे
  rationale: पूर्ण क्रिया बेलशस्सर के पहले से विद्यमान ज्ञान को बताती है; हिन्दी में ‘जानते थे’ संदर्भानुकूल है।
theological_decisions:
- issue: नबूकदनेस्सर के संबंध में ‘उसके पुत्र’ का अर्थ
  choice: मुख्य पाठ में ‘उसके पुत्र’ रखा गया है।
  alternative: उसका वंशज; उसका उत्तराधिकारी
  rationale: अरामी ‘पुत्र’ वंश अथवा राजकीय उत्तराधिकार का व्यापक संबंध भी बता सकता है। अनुवाद ऐतिहासिक संबंध को चुपचाप निश्चित किए बिना स्रोत की अभिव्यक्ति और उसके तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘परन्तु’ और ‘यद्यपि’ आरोप की गंभीरता बनाए रखते हैं; संबोधन को स्पष्ट करने के लिए ‘हे बेलशस्सर’ रखा गया है।
