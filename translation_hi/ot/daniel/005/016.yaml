source:
  edition: WLC
  text: וַ/אֲנָה֙ שִׁמְעֵ֣ת עלי/ך דִּֽי תוכל פִּשְׁרִ֛ין לְ/מִפְשַׁ֖ר וְ/קִטְרִ֣ין לְ/מִשְׁרֵ֑א כְּעַ֡ן הֵן֩ תוכל כְּתָבָ֜/א לְ/מִקְרֵ֗א וּ/פִשְׁרֵ/הּ֙ לְ/הוֹדָ֣עֻתַ֔/נִי אַרְגְּוָנָ֣/א תִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארָ֔/ךְ וְ/תַלְתָּ֥א בְ/מַלְכוּתָ֖/א תִּשְׁלַֽט־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/016.yaml
  text: But I have heard about you that you are able to give interpretations and to solve difficulties[a]. Now, if you are able to read the writing and make its interpretation known to me, you shall be clothed with purple, and a chain of gold shall be put around your neck[b], and you shall rule as third in the kingdom.
translation:
  language: hi
  text: परन्तु मैंने तुम्हारे विषय में सुना है कि तुम अर्थ बता सकते और कठिन गुत्थियाँ सुलझा सकते हो।[a] अब यदि तुम उस लिखावट को पढ़कर उसका अर्थ मुझे बता सको, तो तुम्हें बैंगनी वस्त्र पहनाया जाएगा, तुम्हारे गले में सोने की जंजीर डाली जाएगी, और तुम राज्य में तीसरे पद पर शासन करोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी में शाब्दिक भाव ‘गाँठें खोलना’ है—अर्थात कठिन समस्याओं या उलझनों को सुलझाना।
    reason: lexical_alternative
  - marker: b
    text: या “तुम राज्य में तीसरे शासक होगे।” सम्भवतः इसका अर्थ राज्य में तीसरा पद पाना है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנָה
  choice: परन्तु मैंने
  rationale: संयोजक और स्वतंत्र सर्वनाम बल तथा पिछले कथन से विरोधात्मक संक्रमण दिखाते हैं; हिन्दी में ‘परन्तु मैंने’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: פִּשְׁרִין לְמִפְשַׁר
  choice: अर्थ बता सकते
  rationale: संज्ञा-क्रिया का यह अरामी मेल अर्थों की व्याख्या करने की क्षमता दर्शाता है; सहज हिन्दी में ‘अर्थ बता सकते’ उपयुक्त है।
- source_word: וְקִטְרִין לְמִשְׁרֵא
  choice: कठिन गुत्थियाँ सुलझा सकते
  rationale: शाब्दिक चित्र ‘गाँठें खोलना’ है; ‘गुत्थियाँ सुलझाना’ उसी रूपक और कठिन समस्याएँ हल करने के आशय दोनों को बचाता है।
- source_word: כְּתָבָא
  choice: उस लिखावट
  rationale: यह दीवार पर उपस्थित विशिष्ट लेख की ओर संकेत करता है; ‘उस लिखावट’ संदर्भ में स्पष्ट और सामान्य पाठक के लिए स्वाभाविक है।
- source_word: וּפִשְׁרֵהּ לְהוֹדָעוּתַנִי
  choice: उसका अर्थ मुझे बता सको
  rationale: यह व्याख्या को राजा पर प्रकट या ज्ञात करने का भाव संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְגְּוָנָא תִלְבַּשׁ
  choice: तुम्हें बैंगनी वस्त्र पहनाया जाएगा
  rationale: ‘बैंगनी’ राजकीय प्रतिष्ठा का रंग/वस्त्र है; कर्मवाच्य रूप सम्मान के औपचारिक रूप से प्रदान किए जाने को दर्शाता है।
- source_word: וְתַלְתָּא בְמַלְכוּתָא תִּשְׁלַט
  choice: तुम राज्य में तीसरे पद पर शासन करोगे
  rationale: वाक्यांश का सबसे संभावित आशय राज्य में तीसरी श्रेणी या पद पर अधिकार करना है; पद का उल्लेख अस्पष्ट हिन्दी ‘तीसरे होकर’ से बचाता है।
theological_decisions:
- issue: राज्य में ‘तीसरा’ होने का सटीक प्रशासनिक अर्थ
  choice: तीसरे पद पर शासन करोगे
  alternative: राज्य में तीसरे शासक होगे
  rationale: अरामी पदक्रम अथवा तीसरे शासक—दोनों प्रकार से समझा जा सकता है। मुख्य पाठ पदक्रम के संभावित आशय को स्पष्ट करता है और पादटिप्पणी वैकल्पिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजदरबारी स्वर रखा गया है। ‘गुत्थियाँ सुलझाना’ मूल अरामी रूपक के निकट रहते हुए सामान्य पाठक के लिए स्पष्ट है; ‘बैंगनी वस्त्र’ राजकीय सम्मान को सहज रूप में व्यक्त करता है।
