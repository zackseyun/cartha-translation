source:
  edition: WLC
  text: אִיתַ֨י גְּבַ֜ר בְּ/מַלְכוּתָ֗/ךְ דִּ֠י ר֣וּחַ אֱלָהִ֣ין קַדִּישִׁין֮ בֵּ/הּ֒ וּ/בְ/יוֹמֵ֣י אֲב֗/וּךְ נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה כְּ/חָכְמַת אֱלָהִ֖ין הִשְׁתְּכַ֣חַת בֵּ֑/הּ וּ/מַלְכָּ֤/א נְבֻֽכַדְנֶצַּר֙ אֲב֔/וּךְ רַ֧ב חַרְטֻמִּ֣ין אָֽשְׁפִ֗ין כַּשְׂדָּאִין֙ גָּזְרִ֔ין הֲקִימֵ֖/הּ אֲב֥/וּךְ מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/011.yaml
  text: There is a man in your kingdom in whom is a spirit of the holy gods[a], and in the days of your father light and insight and wisdom like the wisdom of the gods were found in him. And King Nebuchadnezzar, your father, appointed him chief of the magicians, enchanters, Chaldeans, and diviners—your father[b], the king.
translation:
  language: hi
  text: तेरे राज्य में एक पुरुष है, जिसमें पवित्र देवताओं की आत्मा[a] है। तेरे पिता के दिनों में उसमें प्रकाश, समझ और देवताओं-जैसी बुद्धि पाई गई थी। राजा नबूकदनेस्सर, तेरे पिता ने, उसे जादूगरों, मंत्र-तंत्र करनेवालों, कसदियों और ज्योतिषियों का प्रधान नियुक्त किया था—तेरे पिता, राजा ने ही।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र परमेश्वर की आत्मा।” अरामी में “देवता” बहुवचन है, पर कुछ लोग रानी के शब्दों को एक परमेश्वर के लिए प्रयुक्त मानते हैं।
    reason: alternative_reading
  - marker: b
    text: यहाँ “पिता” का अर्थ इस राजदरबारी और राजवंशीय संदर्भ में “पूर्वज” या “पूर्ववर्ती राजा” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: אִיתַי גְּבַר
  choice: एक पुरुष है
  rationale: अस्तित्वसूचक अरामी पद और גְּבַר का सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप।
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: पवित्र देवताओं की आत्मा
  rationale: אֱלָהִין और קַדִּישִׁין दोनों बहुवचन हैं; बाबुली दरबार में वक्ता की दृष्टि को मुख्य पाठ में बनाए रखा गया है।
- source_word: נַהִירוּ וְשָׂכְלְתָנוּ וְחָכְמָה
  choice: प्रकाश, समझ और ... ज्ञान
  rationale: ‘प्रकाश’ बौद्धिक स्पष्टता का मूल रूपक बनाए रखता है; ‘समझ’ שָׂכְלְתָנוּ का सहज रूप है और ‘ज्ञान’ חָכְמָה के लिए सामान्य आधुनिक हिन्दी है।
- source_word: כְּחָכְמַת אֱלָהִין
  choice: देवताओं के ज्ञान के समान ज्ञान
  rationale: तुलनात्मक संरचना और अरामी बहुवचन दोनों स्पष्ट रखे गए हैं।
- source_word: רַב חַרְטֻמִּין אָשְׁפִין כַּשְׂדָּאִין גָּזְרִין
  choice: जादूगरों, तांत्रिकों, कसदियों और ज्योतिषियों का प्रधान
  rationale: चार अलग दरबारी वर्गों को सूची के रूप में सुरक्षित रखा गया है; ‘कसदी’ यहाँ विद्वान-दरबारी वर्ग का पारंपरिक नाम है।
- source_word: אֲבוּךְ
  choice: तेरे पिता
  rationale: मूल का शाब्दिक संबंध सुरक्षित है; व्यापक वंशगत अथवा राजवंशीय अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: אֱלָהִין קַדִּישִׁין और אֱלָהִין का वचन
  choice: पवित्र देवताओं / देवताओं
  alternative: पवित्र परमेश्वर की आत्मा / परमेश्वर
  rationale: अरामी शब्द और विशेषण व्याकरणतः बहुवचन हैं और कथन बाबुली दरबार की रानी का है। एकेश्वरवादी अर्थ को मुख्य पाठ में आरोपित न करके पादटिप्पणी में सुरक्षित रखा गया है।
- issue: बेलशस्सर के संबंध में नबूकदनेस्सर के लिए ‘पिता’
  choice: तेरे पिता
  alternative: तेरा पूर्वज / तेरा पूर्ववर्ती
  rationale: अरामी अभिव्यक्ति को मुख्य पाठ में ज्यों का त्यों रखा गया है; प्राचीन राजवंशीय प्रयोग की व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। राजकीय संबोधन के अनुरूप ‘तेरे’ रखा गया है। अंतिम दोहराव को हिन्दी में स्वाभाविक बनाने के लिए ‘हाँ, हे राजा, तेरे पिता ने ही’ किया गया है, जबकि मूल का बल और पुनरुक्ति सुरक्षित हैं।
