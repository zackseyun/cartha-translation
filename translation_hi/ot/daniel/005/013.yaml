base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/013.yaml
  text: Then Daniel was brought in before the king. The king answered and said to Daniel[a], “Are you that Daniel, one of the exiles of Judah, whom the king my father brought from Judah?”
translation:
  language: hi
  text: तब दानिय्येल को राजा के सामने लाया गया। राजा ने दानिय्येल से उत्तर में कहा, “क्या तुम वही दानिय्येल हो, जो यहूदा के निर्वासितों में से एक हो, जिसे मेरे पिता राजा[a] यहूदा से ले आए थे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पूर्ववर्ती”; राजकीय भाषा में “पिता” किसी पूर्वज या पहले के राजा के लिए भी कहा जा सकता था, केवल सगे पिता के लिए नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को क्रम में प्रस्तुत करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: הֻעַל
  choice: लाया गया
  rationale: यह कर्मवाच्य/कारणवाचक रूप बताता है कि दूसरे लोग दानिय्येल को राजा की उपस्थिति में लाए।
- source_word: קֳדָם מַלְכָּא
  choice: राजा के सामने
  rationale: यह किसी की उपस्थिति में आने के लिए प्रयुक्त स्वाभाविक दरबारी अभिव्यक्ति है।
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर में ... कहा
  rationale: यह स्रोत के दोनों क्रियात्मक तत्वों को सहज हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से शाब्दिक ‘उत्तर दिया और कहा’ अपनाए।
- source_word: אַנְתָּה הוּא דָנִיֵּאל
  choice: क्या तुम वही दानिय्येल हो
  rationale: संदर्भ में यह पहचान की पुष्टि करने वाला प्रश्न है; ‘वही’ मूल के संकेतात्मक और पहचानसूचक बल को बनाए रखता है।
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: जो यहूदा के निर्वासित लोगों में से एक हो
  rationale: शाब्दिक ‘निर्वासन की सन्तानों में से’ के भाव को आधुनिक हिन्दी में निर्वासित समुदाय की सदस्यता के रूप में स्पष्ट किया गया है।
- source_word: דִּי הַיְתִי מַלְכָּא אַבִי מִן יְהוּד
  choice: जिसे राजा, मेरे पिता, यहूदा से ले आए थे
  rationale: मूल का ‘राजा, मेरा पिता’ सुरक्षित है और निर्वासन हेतु यहूदा से ले आने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: राजकीय कथन में אַבִי (‘मेरे पिता’) का अर्थ
  choice: मुख्य पाठ में ‘मेरे पिता’ रखा गया है।
  alternative: ‘मेरे पूर्ववर्ती’
  rationale: मूल स्पष्ट रूप से ‘मेरे पिता’ कहता है। प्राचीन राजकीय भाषा में यह पूर्वज या पहले के राजा को भी सूचित कर सकता है; इसलिए ऐतिहासिक तनाव को मुख्य पाठ में चुपचाप हल करने के बजाय पादटिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘निर्वासित लोग’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘राजा, मेरे पिता’ मूल की राजकीय अभिव्यक्ति और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है।
