  yaml_path: translation/ot/daniel/005/005.yaml
  text: At that moment the fingers of a human hand came out and wrote opposite the lampstand on the plaster of the wall of the king’s palace[e][d][c][b][a], and the king saw the palm of the hand that was writing.
translation:
  language: hi
  text: उसी क्षण मनुष्य के हाथ की उँगलियाँ निकल आईं और दीपाधार के सामने राजमहल की दीवार के पलस्तर पर लिख रही थीं। राजा ने उस हाथ की हथेली[a] देखी जो लिख रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “हाथ”; अरामी शब्द פַּס का यहाँ ठीक-ठीक आशय निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָה
  choice: उसी क्षण
  rationale: यह अरामी मुहावरा तत्काल समय को दर्शाता है; ‘उसी क्षण’ घटना की अचानकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נפקו
  choice: निकल आईं
  rationale: क्रिया का मूल भाव ‘बाहर निकलना’ है; यह ‘दिखाई दीं’ की अपेक्षा उँगलियों के प्रकट होने का सजीव चित्र सुरक्षित रखता है।
- source_word: אֶצְבְּעָן דִּי יַד אֱנָשׁ
  choice: मनुष्य के हाथ की उँगलियाँ
  rationale: אֱנָשׁ का व्यापक अर्थ ‘मनुष्य’ है; यह किसी विशेष पुरुष का संकेत दिए बिना मानवीय हाथ का भाव व्यक्त करता है।
- source_word: וְכָתְבָן
  choice: लिखने लगीं
  rationale: स्त्रीलिंग बहुवचन ‘उँगलियाँ’ के अनुरूप है और दृश्य में आरम्भ हुई लेखन-क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: לָקֳבֵל נֶבְרַשְׁתָּא
  choice: दीपाधार के सामने
  rationale: לָקֳבֵל का अर्थ ‘सामने’ या ‘आमने-सामने’ और נֶבְרַשְׁתָּא का अर्थ दीप रखने का आधार है; यह स्थानिक संबंध को स्पष्ट रखता है।
- source_word: עַל גִּירָא
  choice: पलस्तर पर
  rationale: גִּירָא दीवार पर चढ़े चूने के पलस्तर या सफेदी को दर्शाता है; ‘पलस्तर’ सामान्य और सटीक हिन्दी है।
- source_word: דִּי כְתַל הֵיכְלָא דִּי מַלְכָּא
  choice: राजमहल की दीवार
  rationale: खण्ड का स्वाभाविक हिन्दी रूप; הֵיכְלָא इस राजकीय प्रसंग में महल अथवा उसका भव्य सभागार हो सकता है।
- source_word: וּמַלְכָּא חָזֵה
  choice: राजा ने ... देखी
  rationale: वर्णनात्मक रूप को हिन्दी की स्वाभाविक पूर्ण भूतकालीन कथा-शैली में रखा गया है।
- source_word: פַּס יְדָה
  choice: हाथ की हथेली
  rationale: פַּס का सटीक अंग-संबंधी आशय विवादित है, पर यहाँ ‘हथेली’ एक प्रमुख सम्भावना है; अस्पष्टता पादटिप्पणी में दी गई है।
- source_word: דִּי כָתְבָה
  choice: लिखते हुए
  rationale: सापेक्ष उपवाक्य हाथ को लेखन की चलती हुई क्रिया में दिखाता है; हिन्दी कृदन्त इसे संक्षिप्त और स्वाभाविक बनाता है।
