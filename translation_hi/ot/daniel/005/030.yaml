  text: In that very night Belshazzar[a], the Chaldean king, was killed.
translation:
  language: hi
  text: उसी रात कसदियों का राजा बेलशस्सर मार डाला गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुरूप: “उस रात कसदियों का राजा बेलशस्सर मारा गया।”'
    reason: मूल अरामी पदबंध और निष्क्रिय क्रिया के अधिक औपचारिक विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: בֵּהּ בְּלֵילְיָא
  choice: उसी रात
  rationale: अरामी पदबंध का स्वाभाविक हिन्दी अर्थ ‘उसी रात’ है; इससे संकेत और बल दोनों व्यक्त होते हैं, जबकि शब्दशः रूप अनावश्यक रूप से असहज होगा।
- source_word: קְטִיל
  choice: मार डाला गया
  rationale: यह रूप निष्क्रिय अथवा परिणामसूचक अर्थ देता है। ‘मार डाला गया’ आधुनिक हिन्दी में स्पष्ट है और घटना की पूर्णता व्यक्त करता है।
- source_word: בֵּלְאשַׁצַּר
  choice: बेलशस्सर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: מַלְכָּא כשדיא
  choice: कसदियों का राजा
  rationale: यह अरामी संबंध को ठीक रूप से व्यक्त करता है और ‘कसदी राजा’ की तुलना में सामान्य हिन्दी पाठक के लिए अधिक स्पष्ट है; ‘बेबीलोन का राजा’ कहना मूल के जातिवाचक शब्द की व्याख्यात्मक व्यापकता बढ़ा देता।
