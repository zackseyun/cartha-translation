id: DAN.5.17
reference: Daniel 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אדַ֜יִן עָנֵ֣ה דָנִיֵּ֗אל וְ/אָמַר֙ קֳדָ֣ם מַלְכָּ֔/א מַתְּנָתָ/ךְ֙ לָ֣/ךְ לֶֽהֶוְיָ֔ן וּ/נְבָ֥זְבְּיָתָ֖/ךְ לְ/אָחֳרָ֣ן הַ֑ב בְּרַ֗ם כְּתָבָ/א֙ אֶקְרֵ֣א לְ/מַלְכָּ֔/א וּ/פִשְׁרָ֖/א אֲהוֹדְעִנֵּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/017.yaml
  text: Then Daniel answered and said before the king, “Let your gifts remain yours, and give your rewards to another. Nevertheless, I will read the writing for the king and make its interpretation known to him.”
translation:
  language: hi
  text: तब दानिय्येल ने राजा के सामने उत्तर देकर कहा, “आपके उपहार आपके ही पास रहें, और अपने पुरस्कार किसी दूसरे को दे दीजिए। फिर भी मैं राजा के लिए यह लेख पढ़ूँगा और उसका अर्थ उन्हें बता दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से क्रम को बनाए रखता है।
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर देकर कहा
  rationale: दोनों अरामी क्रियाओं का भाव सुरक्षित रखते हुए हिन्दी की स्वाभाविक अभिव्यक्ति अपनाई गई है।
- source_word: קֳדָם מַלְכָּא
  choice: राजा के सामने
  rationale: קֳדָם उपस्थिति या सम्मुख होने का भाव देता है; यह अनुवाद राजदरबार के प्रसंग को बनाए रखता है।
- source_word: מַתְּנָתָךְ ... לָךְ לֶהֶוְיָן
  choice: आपके उपहार आपके ही पास रहें
  rationale: यह दानिय्येल द्वारा राजकीय उपहार अस्वीकार करने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְבָזְבְּיָתָךְ
  choice: अपने पुरस्कार
  rationale: संदर्भ में यह राजा द्वारा दी जाने वाली प्रतिफल-सामग्री या सम्मानसूचक पुरस्कारों को दर्शाता है।
- source_word: לְאָחֳרָן הַב
  choice: किसी दूसरे को दे दीजिए
  rationale: ‘दूसरे’ से अरामी के एकवचन विशेषण का substantival प्रयोग सुरक्षित रहता है; आदरसूचक क्रिया आधुनिक राजकीय संबोधन के अनुरूप है।
- source_word: בְּרַם
  choice: फिर भी
  rationale: यह भुगतान अस्वीकार करने और व्याख्या करने की सहमति के बीच विरोधात्मक तथा concessive संबंध को स्पष्ट करता है।
- source_word: כְּתָבָא
  choice: यह लेख
  rationale: यह दीवार पर लिखी रहस्यमय सामग्री को सूचित करता है; ‘लेख’ संक्षिप्त, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: אֶקְרֵא לְמַלְכָּא
  choice: मैं राजा के लिए यह लेख पढ़ूँगा
  rationale: अनुवाद स्पष्ट कर्म ‘लेख’ और लाभार्थी/प्राप्तकर्ता ‘राजा’ दोनों को बनाए रखता है।
- source_word: פִשְׁרָא
  choice: उसका अर्थ
  rationale: अरामी शब्द रहस्यमय संदेश की व्याख्या को दर्शाता है; सामान्य हिन्दी पाठक के लिए ‘अर्थ’ सहज है और लेख से उसका संबंध स्पष्ट करता है।
- source_word: אֲהוֹדְעִנֵּהּ
  choice: उन्हें बता दूँगा
  rationale: कारक क्रिया का आशय राजा को अर्थ ज्ञात करा देना है; ‘उन्हें’ राजा के लिए आदरसूचक सर्वनाम है।
