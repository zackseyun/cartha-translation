translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजदरबारी संबोधन के लिए ‘आप’ और आदरसूचक क्रियारूप रखे गए हैं। वाक्य स्रोत के औपचारिक क्रम और प्रमुख पदों को सुरक्षित रखते हुए सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
