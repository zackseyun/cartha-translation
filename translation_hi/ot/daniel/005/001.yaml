  yaml_path: translation/ot/daniel/005/001.yaml
  text: King Belshazzar made a great feast for a thousand of his nobles[a], and in the presence of the thousand he was drinking wine.
translation:
  language: hi
  text: राजा बेलशस्सर ने अपने एक हज़ार सरदारों के लिए बड़ी दावत दी, और उन एक हज़ार सरदारों के सामने[a] वह दाखमधु पी रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उस हज़ार के सामने।” अरामी पदबंध का अर्थ “सामने” या “उपस्थिति में” हो सकता है; यहाँ संभवतः आशय है कि वह उन एक हज़ार अतिथियों के सामने, सबके देखते, दाखमधु पी रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: राजा
  rationale: यह पदवी व्यक्तिवाचक नाम के साथ समानाधिकरण में है; हिन्दी में स्वाभाविक क्रम ‘राजा बेलशस्सर’ है।
- source_word: עֲבַד
  choice: दावत दी
  rationale: क्रिया का मूल अर्थ ‘किया/बनाया’ है, पर לְחֶם רַב के साथ भोज आयोजित करने का भाव है; आधुनिक हिन्दी में ‘दावत दी’ स्वाभाविक और अर्थ-सटीक है।
- source_word: לְחֶם רַב
  choice: एक बड़ी दावत
  rationale: לְחֶם का मूल अर्थ रोटी/भोजन है, किंतु इस राजकीय प्रसंग में यह भोज को सूचित करता है; רַב को ‘बड़ी’ से व्यक्त किया गया है।
- source_word: לְרַבְרְבָנֹוהִי
  choice: अपने ... सरदारों के लिए
  rationale: शब्द उच्च पदस्थ अधिकारियों अथवा राज्य के बड़े लोगों को दर्शाता है। ‘सरदार’ सामान्य आधुनिक हिन्दी में दरबारी पद और प्रतिष्ठा का भाव देता है, बिना किसी विशिष्ट सामंती व्यवस्था को आरोपित किए।
- source_word: אֲלַף
  choice: एक हज़ार
  rationale: मूल संख्या का सीधा हिन्दी समतुल्य।
- source_word: וְלָקֳבֵל
  choice: और उन हज़ारों के सामने
  rationale: पदबंध का शाब्दिक अर्थ ‘सामने/उपस्थिति में’ है। ‘के सामने’ स्थानगत अर्थ और सभा के सम्मुख सार्वजनिक रूप से पीने—दोनों संभावनाओं को सुरक्षित रखता है।
- source_word: חַמְרָא
  choice: दाखमधु
  rationale: यह अरामी में अंगूरी मदिरा के लिए सामान्य शब्द है; ‘दाखमधु’ dignified biblical Hindi में स्पष्ट तथा प्रचलित है।
- source_word: שָׁתֵה
  choice: पी रहा था
  rationale: भागसूचक रूप जारी क्रिया व्यक्त करता है, इसलिए हिन्दी अपूर्ण भूतकाल मूल के प्रगतिशील भाव को बनाए रखता है।
