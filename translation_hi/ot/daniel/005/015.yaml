translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण दरबारी कथन। अरामी वाक्य की दोहरावपूर्ण संरचना को यथासंभव रखा गया है, पर हिन्दी में स्वाभाविक प्रवाह के लिए ‘अर्थ मुझे बताएं’ और ‘अर्थ नहीं बता सके’ प्रयुक्त हैं।
