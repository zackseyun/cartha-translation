  yaml_path: translation/ot/daniel/005/015.yaml
  text: And now the wise men, the enchanters, have been brought before me to read this writing and make its interpretation known to me, but they were not able to show the interpretation of the message.
translation:
  language: hi
  text: और अब बुद्धिमान लोग और जादू-मंत्र के जानकार मेरे सामने लाए गए कि वे इस लेख को पढ़ें और इसका अर्थ मुझे बताएं, पर वे इस संदेश का अर्थ नहीं बता सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכִּימַיָּא
  choice: बुद्धिमान लोग
  rationale: दरबारी विद्वानों और ज्ञानियों के सामान्य वर्ग के लिए सहज और व्यापक हिन्दी पद।
- source_word: אָשְׁפַיָּא
  choice: तांत्रिक
  rationale: यह अरामी पद जादू-मंत्र अथवा गूढ़ क्रियाओं से जुड़े दरबारी विशेषज्ञों को दर्शाता है; ‘तांत्रिक’ आधुनिक पाठक के लिए संक्षिप्त और बोधगम्य है।
- source_word: כְתָבָה דְנָה
  choice: इस लेख
  rationale: दीवार पर लिखी हुई सामग्री के लिए ‘लेख’ मूल के सामान्य अर्थ को बनाए रखता है।
- source_word: פִשְׁרֵהּ / פְּשַׁר מִלְּתָא
  choice: इसका अर्थ / इस संदेश का अर्थ
  rationale: פְּשַׁר का आशय व्याख्यायित अर्थ है; दूसरी अभिव्यक्ति में מִלְּתָא को प्रसंगानुसार ‘संदेश’ कहा गया है, जिससे अनावश्यक पुनरुक्ति से बचते हुए आशय स्पष्ट रहता है।
- source_word: לְהַחֲוָיָה
  choice: बता सके
  rationale: मूल क्रिया ‘दिखाना/प्रकट करना/बताना’ के अर्थ में है; हिन्दी में अर्थ प्रकट करने के संदर्भ में ‘बताना’ स्वाभाविक है।
