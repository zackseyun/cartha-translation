base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/020.yaml
  text: But when his heart was lifted up and his spirit was hardened in arrogance[a], he was brought down from his royal throne[b], and his glory was taken away from him.
translation:
  language: hi
  text: परन्तु जब उसका हृदय फूल उठा और उसका मन अभिमान में कठोर हो गया[a], तब उसे उसके राजसिंहासन से उतार दिया गया, और उसकी महिमा उससे छीन ली गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसका मन धृष्टता में दृढ़ हो गया’ अथवा ‘उसका मन अभिमानी हो गया।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘सम्मान’ अथवा ‘राजकीय वैभव’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְדִי
  choice: परन्तु जब
  rationale: यह अरामी संयोजन समय का संबंध व्यक्त करता है और पिछले पद के साथ विरोध भी दिखाता है; इसलिए ‘परन्तु जब’ दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: רִם לִבְבֵהּ
  choice: उसका मन ऊँचा हो गया
  rationale: मूल में हृदय के ऊँचा होने का रूपक है, जो घमण्ड का संकेत देता है। हिन्दी में ‘मन ऊँचा हो गया’ रूपक और नैतिक भाव दोनों बनाए रखता है।
- source_word: וְרוּחֵהּ תִּקְפַת לַהֲזָדָה
  choice: उसकी आत्मा अभिमान में कठोर हो गई
  rationale: תִּקְפַת में दृढ़ या कठोर होने और לַהֲזָדָה में धृष्ट अभिमान का भाव है। यह अनुवाद आन्तरिक कठोरता और अभिमानी दशा दोनों को रखता है।
- source_word: הָנְחַת
  choice: उसे उतार दिया गया
  rationale: सन्दर्भ में यह राजकीय पद से नीचे किए जाने का कर्मवाच्य अर्थ देता है और पहले आए ‘ऊँचा’ के साथ साहित्यिक विरोध भी बनाए रखता है।
- source_word: מִן כָּרְסֵא מַלְכוּתֵהּ
  choice: उसके राजसिंहासन से
  rationale: כָּרְסֵא सिंहासन और מַלְכוּתֵהּ राजत्व या राजकीय शासन को सूचित करता है; ‘राजसिंहासन’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: וִיקָרֵהּ
  choice: उसका वैभव
  rationale: יְקָר के अर्थ-क्षेत्र में सम्मान, महिमा और राजकीय वैभव शामिल हैं। राजा के अपदस्थ होने के प्रसंग में ‘वैभव’ उपयुक्त है, जबकि अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: הֶעְדִּיוּ מִנֵּהּ
  choice: उससे छीन लिया गया
  rationale: बहुवचन क्रिया यहाँ अनिश्चित कर्ता के साथ मुहावरेदार ढंग से प्रयुक्त है। हिन्दी कर्मवाच्य अनावश्यक कर्ता जोड़े बिना अर्थ स्पष्ट करता है।
theological_decisions:
- issue: नबूकदनेस्सर के पतन का कर्ता
  choice: राजसिंहासन से उतारे जाने और वैभव छिने जाने को कर्मवाच्य में रखा गया है; इस पंक्ति में परमेश्वर को स्पष्ट कर्ता नहीं बनाया गया।
  alternative: व्यापक प्रसंग के आधार पर इसे स्पष्टतः परमेश्वर का कार्य कहा जा सकता था।
  rationale: मूल पद में कर्मवाच्य अथवा अनिश्चित कर्ता वाले रूप हैं। अनुवाद उसी संयम को बनाए रखता है और परमेश्वर की भूमिका को व्यापक प्रसंग से समझने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘मन ऊँचा हो गया’ मूल रूपक को बनाए रखता है; ‘आत्मा…कठोर हो गई’ जानबूझकर मूल की आन्तरिक कठोरता और अभिमान के बीच तनाव सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
