id: DAN.5.2
reference: Daniel 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּלְשַׁאצַּ֞ר אֲמַ֣ר בִּ/טְעֵ֣ם חַמְרָ֗/א לְ/הַיְתָיָה֙ לְ/מָאנֵי֙ דַּהֲבָ֣/א וְ/כַסְפָּ֔/א דִּ֤י הַנְפֵּק֙ נְבוּכַדְנֶצַּ֣ר אֲב֔/וּהִי מִן הֵיכְלָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וְ/יִשְׁתּ֣וֹן בְּ/ה֗וֹן מַלְכָּ/א֙ וְ/רַבְרְבָנ֔וֹ/הִי שֵׁגְלָתֵ֖/הּ וּ/לְחֵנָתֵֽ/הּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/002.yaml
  text: Belshazzar gave the order[a], as he tasted the wine, to bring the vessels of gold and silver that Nebuchadnezzar his father had taken out of the temple that was in Jerusalem, so that the king and his nobles, his wives and his concubines[b], might drink from them.
translation:
  language: hi
  text: जब बेलशस्सर दाखमधु का स्वाद ले रहा था[a], तब उसने आज्ञा दी कि सोने और चाँदी के वे पात्र लाए जाएँ, जिन्हें उसका पिता[b] नबूकदनेस्सर यरूशलेम के मन्दिर से निकाल लाया था, ताकि राजा और उसके सरदार, उसकी पत्नियाँ और उसकी रखेलियाँ उनमें से पीएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दाखमधु के प्रभाव में रहते हुए’; अरामी मुहावरे का शाब्दिक अर्थ है ‘दाखमधु के स्वाद में।’
    reason: lexical_alternative
  - marker: b
    text: अरामी में शाब्दिक रूप से ‘उसका पिता’; राजकीय प्रयोग में इसका अर्थ ‘उसका पूर्वज’ या ‘उसका पूर्ववर्ती’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲמַר
  choice: उसने आज्ञा दी
  rationale: क्रिया का मूल अर्थ ‘कहा’ है, पर इसके बाद पात्र लाने का निर्देश है; इसलिए प्रसंग में ‘आज्ञा दी’ उसके आदेशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּטְעֵם חַמְרָא
  choice: दाखमधु का स्वाद ले रहा था
  rationale: अरामी मुहावरे का शाब्दिक भाव ‘दाखमधु के स्वाद में’ है। यह अनुवाद स्वाद लेने/पीने की ठोस छवि रखता है और मुख्य पाठ में नशे की अवस्था को निश्चित नहीं करता।
- source_word: לְהַיְתָיָה
  choice: लाए जाएँ
  rationale: कारक रूप पात्रों को मँगवाने का भाव देता है; राजा की आज्ञा के बाद हिन्दी में कर्मवाच्य ‘लाए जाएँ’ स्वाभाविक है।
- source_word: מָאנֵי דַּהֲבָא וְכַסְפָּא
  choice: सोने और चाँदी के वे पात्र
  rationale: מָאנֵי बर्तनों या उपकरणों के लिए व्यापक शब्द है। ‘पात्र’ मन्दिर-संबंधी अर्थ बनाए रखता है और इसे केवल प्यालों तक सीमित नहीं करता।
- source_word: הַנְפֵּק
  choice: निकाल लाया था
  rationale: क्रिया का अर्थ ‘बाहर निकालना/ले आना’ है; यहाँ यरूशलेम के मन्दिर से पवित्र पात्र हटाकर ले आने का भाव है।
- source_word: אֲבוּהִי
  choice: उसका पिता
  rationale: अरामी में सामान्य संबंधवाची शब्द ‘पिता’ है। राजकीय प्रयोग में इसका अर्थ पूर्वज या पूर्ववर्ती भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הֵיכְלָא
  choice: मन्दिर
  rationale: यरूशलेम के संदर्भ में यही स्पष्ट और प्रचलित अर्थ है।
- source_word: וְיִשְׁתּוֹן בְּהוֹן
  choice: उनमें से पीएँ
  rationale: अपूर्ण क्रिया आज्ञा के उद्देश्य को व्यक्त करती है; ‘ताकि ... पीएँ’ यह प्रयोजन स्वाभाविक हिन्दी में देता है।
- source_word: רַבְרְבָנוֹהִי
  choice: उसके सरदार
  rationale: यह शब्द उच्च अधिकारियों या दरबार के बड़े लोगों को दर्शाता है; ‘सरदार’ सामान्य आधुनिक हिन्दी में स्पष्ट और दरबारी संदर्भ के अनुकूल है।
- source_word: שֵׁגְלָתֵהּ
  choice: उसकी पत्नियाँ
  rationale: यह राजघराने की स्त्रियों या पत्नियों को दर्शाता है। ‘पत्नियाँ’ व्यापक और सावधान अनुवाद है; ‘रानियाँ’ औपचारिक पद को अनावश्यक रूप से निश्चित कर सकता है।
- source_word: לְחֵנָתֵהּ
  choice: उसकी रखेलियाँ
  rationale: यह पत्नियों से निम्न दर्जे की राजकीय स्त्रियों को दर्शाता है। ‘रखेलियाँ’ आधुनिक हिन्दी में ‘उपपत्नियों’ की अपेक्षा अधिक सहज और अर्थ की सामाजिक भिन्नता को स्पष्ट करता है।
theological_decisions:
- issue: नबूकदनेस्सर के लिए राजकीय संबंधवाची शब्द
  choice: मुख्य पाठ में शाब्दिक ‘उसका पिता’ रखा गया
  alternative: ‘उसका पूर्वज’ या ‘उसका पूर्ववर्ती’
  rationale: अरामी पाठ सामान्य संबंधवाची शब्द ‘पिता’ का प्रयोग करता है। ऐतिहासिक/राजकीय व्यापकता को मुख्य पाठ में व्याख्यात्मक रूप से निश्चित करने के बजाय पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखमधु’ बाइबिलीय संदर्भ में मदिरा को स्पष्ट करता है; ‘पात्र’ मन्दिर-संबंधी व्यापक अर्थ बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से उलटा था; हिन्दी मुख्य पाठ में दाखमधु वाले विकल्प को [a] और ‘पिता’ की राजकीय व्यापकता को [b] के साथ सही स्थान पर लगाया गया है।
