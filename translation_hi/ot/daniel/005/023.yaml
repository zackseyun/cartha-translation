  text: וְ/עַ֣ל מָרֵֽא שְׁמַיָּ֣/א הִתְרוֹמַ֡מְתָּ וּ/לְ/מָֽאנַיָּ֨/א דִֽי בַיְתֵ֜/הּ הַיְתִ֣יו קדמי/ך ו/אנתה ו/רברבני/ך שֵֽׁגְלָתָ֣/ךְ וּ/לְחֵנָתָ/ךְ֮ חַמְרָ/א֮ שָׁתַ֣יִן בְּ/הוֹן֒ וְ/לֵֽ/אלָהֵ֣י כַסְפָּֽ/א וְ֠/דַהֲבָ/א נְחָשָׁ֨/א פַרְזְלָ֜/א אָעָ֣/א וְ/אַבְנָ֗/א דִּ֠י לָֽא חָזַ֧יִן וְ/לָא שָׁמְעִ֛ין וְ/לָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְ/לֵֽ/אלָהָ֞/א דִּֽי נִשְׁמְתָ֥/ךְ בִּ/ידֵ֛/הּ וְ/כָל אֹרְחָתָ֥/ךְ לֵ֖/הּ לָ֥א הַדַּֽרְתָּ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/023.yaml
  text: But you have exalted yourself against the Lord of heaven[a], and the vessels of his house were brought before you, and you and your nobles, your wives, and your concubines have been drinking wine from them. And you have praised the gods of silver and gold, bronze, iron, wood, and stone, which do not see or hear or know; but the God in whose hand is your breath, and to whom belong all your ways[c][b], you have not honored.
translation:
  language: hi
  text: परन्तु तूने स्वर्ग के प्रभु[a] के विरुद्ध अपने आपको ऊँचा उठाया। उसके भवन के पात्र तेरे सामने लाए गए, और तू, तेरे सामन्त, तेरी पत्नियाँ और तेरी रखेलियाँ उनमें से दाखमधु पीते रहे। तूने चाँदी और सोने, काँसे, लोहे, लकड़ी और पत्थर के देवताओं की स्तुति की, जो न देखते, न सुनते और न जानते हैं; परन्तु जिस परमेश्वर के हाथ में तेरा श्वास[b] है और जिसके हैं तेरे सारे मार्ग, उसका तूने आदर[c] नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग के स्वामी।’ अरामी पद का अर्थ ‘प्रभु’ या ‘स्वामी’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो तेरे श्वास को अपने हाथ में रखता है।’
    reason: lexical_alternative
  - marker: c
    text: या ‘उसकी महिमा नहीं की’ अथवा ‘उसे महिमा नहीं दी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מָרֵא שְׁמַיָּא
  choice: स्वर्ग के प्रभु
  rationale: מָרֵא का अर्थ प्रभु या स्वामी हो सकता है। यहाँ परमेश्वर की सार्वभौमिक प्रभुता के लिए ‘स्वर्ग के प्रभु’ स्वाभाविक और गरिमापूर्ण है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: הִתְרוֹמַמְתָּ
  choice: अपने आपको ऊँचा उठाया
  rationale: हित्पएल रूप आत्म-उन्नयन और अहंकारी विरोध व्यक्त करता है; यह हिन्दी वाक्यांश मूल की ऊर्ध्व दिशा वाली छवि भी बनाए रखता है।
- source_word: מָאנַיָּא דִי בַיְתֵהּ
  choice: उसके भवन के पात्र
  rationale: ‘भवन’ मूल के ‘घर’ को गरिमापूर्ण ढंग से रखता है और प्रसंग से मन्दिर स्पष्ट है; ‘पात्र’ उपासना में प्रयुक्त वस्तुओं के लिए उपयुक्त है।
- source_word: רַבְרְבָנַיִךְ
  choice: तेरे सामन्त
  rationale: यह राजदरबार के उच्च पदस्थ पुरुषों को सूचित करता है; ‘सामन्त’ इस ऐतिहासिक राजकीय प्रसंग में संक्षिप्त और स्पष्ट है।
- source_word: שֵׁגְלָתָךְ וּלְחֵנָתָךְ
  choice: तेरी पत्नियाँ और तेरी रखेलियाँ
  rationale: दोनों समूहों की भिन्न वैवाहिक-सामाजिक स्थिति को स्पष्ट रखते हुए सामान्य आधुनिक हिन्दी प्रयुक्त हुई है।
- source_word: חַמְרָא שָׁתַיִן בְּהוֹן
  choice: उनमें से दाखमधु पीते रहे
  rationale: अरामी कृदन्त चल रही सामूहिक क्रिया को दर्शाता है; ‘पीते रहे’ भोज में जारी अपवित्रीकरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שַׁבַּחְתָּ
  choice: स्तुति की
  rationale: क्रिया का सीधा अर्थ प्रशंसा या स्तुति करना है; देवताओं के संदर्भ में ‘स्तुति’ उपयुक्त धार्मिक भाषा है।
- source_word: אֱלָהֵי כַסְפָּא וְדַהֲבָא נְחָשָׁא פַרְזְלָא אָעָא וְאַבְנָא
  choice: चाँदी और सोने, काँसे, लोहे, लकड़ी और पत्थर के देवता
  rationale: मूल की पदार्थ-सूची और ‘के देवता’ वाली संरचना सुरक्षित रखी गई है, बिना व्याख्यात्मक ‘से बने’ जोड़ने के।
- source_word: דִּי לָא חָזַיִן וְלָא שָׁמְעִין וְלָא יָדְעִין
  choice: जो न देखते, न सुनते और न जानते हैं
  rationale: तीन समानांतर क्रियाओं और ‘जानने’ के मूल अर्थ को सुरक्षित रखा गया है।
- source_word: אֱלָהָא דִּי נִשְׁמְתָךְ בִּידֵהּ
  choice: जिस परमेश्वर के हाथ में तेरा प्राणवायु है
  rationale: ‘हाथ में’ की ठोस प्रभुसत्ता-छवि और נִשְׁמָה का श्वास/जीवन-श्वास अर्थ रखा गया है; ‘प्राणवायु’ हिन्दी में जीवित रखने वाली साँस को स्पष्ट करता है।
- source_word: וְכָל אֹרְחָתָךְ לֵהּ
  choice: जिसके अधीन तेरे सारे मार्ग हैं
  rationale: अरामी संबंध परमेश्वर के अधिकार या स्वामित्व को व्यक्त करता है। शाब्दिक रूप से अस्वाभाविक हिन्दी से बचते हुए ‘अधीन’ से प्रभुसत्ता व्यक्त की गई, पर ‘मार्ग’ की मूल छवि रखी गई है।
- source_word: לָא הַדַּרְתָּ
  choice: आदर नहीं किया
  rationale: हदर का अर्थ सम्मान देना या महिमा देना है। ‘आदर नहीं किया’ सहज आधुनिक हिन्दी है; निकट विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: מָרֵא के लिए ईश्वरीय पदवी
  choice: स्वर्ग के प्रभु
  alternative: स्वर्ग के स्वामी
  rationale: दोनों अर्थ सम्भव हैं। मुख्य पाठ में प्रचलित गरिमापूर्ण ईश्वरीय पदवी रखी गई है, जबकि वास्तविक शब्दार्थ-विकल्प पादटिप्पणी में सुरक्षित है।
- issue: मूर्तियों और सच्चे परमेश्वर का विरोध
  choice: ‘प्राणवायु’, ‘हाथ’ और ‘मार्ग’ की ठोस भाषा बनाए रखना
  alternative: ‘जीवन’ और ‘नियति’ जैसे अमूर्त विस्तार
  rationale: मूल परमेश्वर की जीवन और मनुष्य के समस्त आचरण पर प्रभुता को ठोस रूपकों से व्यक्त करता है; अनुवाद उन रूपकों की व्याख्यात्मक पुनर्रचना नहीं करता।
- issue: וְכָל אֹרְחָתָךְ לֵהּ में संबंध
  choice: जिसके अधीन तेरे सारे मार्ग हैं
  alternative: जिसके तेरे सारे मार्ग हैं / जिसके हैं तेरे सारे मार्ग
  rationale: लֵהּ अधिकार या संबंध दर्शाता है। चुना हुआ रूप स्वाभाविक हिन्दी में परमेश्वर की प्रभुता व्यक्त करता है और ‘मार्ग’ की व्यापकता—आचरण, जीवन-पथ और गतिविधियाँ—को खुला रखता है।
- issue: לָא הַדַּרְתָּ का अनुवाद
  choice: आदर नहीं किया
  alternative: महिमा नहीं दी
  rationale: मूल क्रिया सम्मान और महिमा दोनों के क्षेत्र में आती है। मुख्य पाठ में सहज हिन्दी रखी गई है और धार्मिक रूप से अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष राजकीय भर्त्सना। राजा के लिए एकवचन ‘तू/तेरा’ मूल के तीखे संबोधन और बाइबिलीय न्याय-वचन को बनाए रखता है। ‘दाखमधु’, ‘सामन्त’, ‘पात्र’ और ‘प्राणवायु’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए ऐतिहासिक-धार्मिक गरिमा देते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
