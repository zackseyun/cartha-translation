  language: en
  yaml_path: translation/ot/daniel/005/018.yaml
  text: As for you[a], O king, the Most High God gave kingship and greatness and glory and majesty to Nebuchadnezzar your father.
translation:
  language: hi
  text: हे राजा, परमप्रधान परमेश्वर ने आपके पिता[a] नबूकदनेस्सर को राजकीय सत्ता, महानता, महिमा और प्रताप दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके पूर्वज” अथवा “आपके पूर्ववर्ती”; अरामी शब्द का शाब्दिक अर्थ “आपके पिता” है, पर राजवंशीय भाषा में इसका प्रयोग अधिक व्यापक अर्थ में भी हो सकता है।
    reason: lexical_alternative
