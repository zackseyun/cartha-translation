  choice: नबूकदनेस्सर को
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: אֲבוּךְ
  choice: आपके पिता
  rationale: मूल का सामान्य संबंधसूचक शब्द मुख्य पाठ में सुरक्षित है; राजवंशीय भाषा में इसके व्यापक अर्थ की सूचना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: '''आपके पिता'' का राजकीय या वंशगत अर्थ'
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति 'आपके पिता' रखना
  alternative: '''आपके पूर्वज'' अथवा ''आपके पूर्ववर्ती'''
  rationale: मूल अरामी सामान्य संबंधसूचक शब्द का प्रयोग करता है, पर प्राचीन राजवंशीय भाषा में वह पूर्वज या राजकीय पूर्ववर्ती के लिए भी प्रयुक्त हो सकता है। अनुवाद इस ऐतिहासिक प्रश्न को मुख्य पाठ में निर्णायक रूप से हल नहीं करता, बल्कि विकल्प पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजदरबारी संबोधन रखा गया है। 'राजत्व, महानता, महिमा और प्रताप' मूल की संचयी चार-संज्ञा संरचना को स्वाभाविक हिन्दी में बनाए रखता है; आदरसूचक 'आप' प्रसंग के अनुरूप है।
