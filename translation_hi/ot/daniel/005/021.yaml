  choice: निकाल दिया गया
  rationale: निष्कासन और मनुष्यों से अलग किए जाने का निष्क्रिय भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי אֲנָשָׁא
  choice: मनुष्यों के बीच से
  rationale: अरामी मुहावरे का आशय सामान्य मानव-समाज है; हिन्दी में यह रूप लिंग-समावेशी और स्वाभाविक है।
- source_word: לִבְבֵהּ ... שוי
  choice: उसका मन ... जैसा कर दिया गया
  rationale: לִבְבֵהּ का शाब्दिक अर्थ 'हृदय' है, पर यहाँ आंतरिक समझ, मानसिक दशा या प्रवृत्ति अभिप्रेत हो सकती है; मुख्य पाठ में 'मन' अर्थ को सहज बनाता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: חֵיוְתָא
  choice: पशुओं
  rationale: सामान्य पशु-जगत से तुलना को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: עֲרָדַיָּא
  choice: जंगली गधों
  rationale: यह शब्द विशेषतः वनगर्दभों/ओनेगरों को दर्शाता है; 'जंगली गधे' साधारण पाठक के लिए स्पष्ट है।
- source_word: מְדוֹרֵהּ
  choice: वह ... रहने लगा
  rationale: संज्ञात्मक वाक्यांश 'उसका निवास' को स्वाभाविक हिन्दी क्रियात्मक अभिव्यक्ति में प्रस्तुत करता है, बिना अर्थ बदले।
- source_word: עִשְׂבָּא כְתוֹרִין יְטַעֲמוּנֵּהּ
  choice: उसे बैलों की तरह घास खिलाई गई
  rationale: क्रिया का कारक भाव है—उसे घास खाने को दी गई; हिन्दी का कर्मवाच्य आसपास के निष्क्रिय वर्णन से भी मेल खाता है।
- source_word: גִּשְׁמֵהּ יִצְטַבַּע
  choice: उसका शरीर ... भीगता रहा
  rationale: शरीर के ओस से लगातार भीगने का भाव व्यक्त करता है; प्रसंग में पुनरावृत्त दशा होने के कारण 'रहा' उपयुक्त है।
- source_word: אֱלָהָא עליא
