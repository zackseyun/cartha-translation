  choice: मुख्य पाठ में 'मन', पादटिप्पणी में शाब्दिक 'हृदय'
  alternative: उसका हृदय पशुओं जैसा कर दिया गया
  rationale: प्रसंग मानसिक/आंतरिक दशा की ओर संकेत करता है, जबकि शाब्दिक बिंब भी महत्वपूर्ण है; पादटिप्पणी दोनों को बिना निर्णायक अतिव्याख्या के सुरक्षित रखती है।
- issue: אֲנָשָׁא को सामान्य मानवता के अर्थ में प्रस्तुत करना
  choice: मनुष्यों के राज्य
  alternative: मनुष्यजाति का राज्य
  rationale: यहाँ शब्द केवल पुरुषों तक सीमित नहीं है; 'मनुष्यों' सामान्य मानव-जगत का स्वाभाविक हिन्दी संकेत है।
