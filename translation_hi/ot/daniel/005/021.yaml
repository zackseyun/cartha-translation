base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/021.yaml
  text: He was driven away from the sons of men[a], and his heart was made like the beasts, and his dwelling was with the wild donkeys. He was fed grass like oxen, and his body was drenched with the dew of heaven[d][c][b], until he knew that the Most High God rules over the kingdom of mankind and sets over it whomever he wills.
translation:
  language: hi
  text: उसे मनुष्यों के बीच से निकाल दिया गया[a], उसका मन पशुओं जैसा कर दिया गया[b], और वह जंगली गधों के साथ रहने लगा[c]। उसे बैलों की तरह घास खिलाई गई, और उसका शरीर आकाश की ओस से भीगता रहा, जब तक कि उसने जान न लिया कि परमप्रधान परमेश्वर मनुष्यों के राज्य पर शासन करता है[d] और जिसे चाहता है, उसे उस पर नियुक्त करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्यों के पुत्रों में से।” इसका अर्थ मानव-समाज से अलग कर दिया जाना है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका हृदय पशुओं जैसा कर दिया गया”; अरामी में “हृदय” मन, समझ और भीतरी प्रवृत्ति को भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: “जंगली गधे” से आशय वनगर्दभों, अर्थात ओनेगरों से है।
    reason: cultural_note
  - marker: d
    text: या, “मनुष्यजाति के राज्य पर।”
    reason: lexical_alternative
