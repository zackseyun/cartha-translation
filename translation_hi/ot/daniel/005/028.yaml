    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרֵס
  choice: परेस
  rationale: दीवार पर लिखे अरामी शब्द को अनुवाद करने के बजाय लिप्यंतरित किया गया है, क्योंकि दानिय्येल उसी लिखे हुए शब्द का अर्थ बता रहा है। इससे अगले क्रियापद और ‘फ़ारसियों’ के साथ उसका शब्दालंकार भी संकेतित रहता है।
- source_word: פְּרִיסַת
  choice: बाँट दिया गया है
  rationale: यह उसी मूल से बना क्रियापद है जिससे ‘परेस’ बना है और राज्य के विभाजन को दर्शाता है। पूर्ण क्रिया को निर्णीत और प्रभावी न्याय के रूप में व्यक्त करने के लिए यह रूप चुना गया है।
- source_word: מַלְכוּתָךְ
  choice: तेरा राज्य
  rationale: संदर्भ में यह बेलशस्सर के शासनाधीन राज्य को सूचित करता है; ‘राजत्व’ की तुलना में ‘राज्य’ आधुनिक हिन्दी में अधिक स्वाभाविक और स्पष्ट है। एक राजा से सीधे संबोधन के अनुरूप ‘तेरा’ रखा गया है।
- source_word: וִיהִיבַת
  choice: और ... दे दिया गया है
  rationale: यह राज्य के नए शासकों को सौंपे जाने के निष्क्रिय और परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמָדַי
  choice: मादियों को
  rationale: इस जातिवाचक रूप को फ़ारसियों के समानांतर एक जनसमूह के रूप में प्रस्तुत किया गया है।
- source_word: וּפָרָס
  choice: और फ़ारसियों को
  rationale: ऐतिहासिक जनसमूह का स्पष्ट उल्लेख किया गया है। अरामी ध्वनि-साम्य को मुख्य पाठ में पूरी तरह बचाना संभव नहीं, इसलिए उसे पादटिप्पणी में समझाया गया है।
