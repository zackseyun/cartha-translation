  text: They drank the wine and praised the gods of gold and silver[a], bronze, iron, wood, and stone.
translation:
  language: hi
  text: उन्होंने दाखमधु पिया और सोने, चाँदी, काँसे[a], लोहे, लकड़ी और पत्थर के देवताओं की स्तुति की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताँबे’। अरामी शब्द ताँबे या काँसे, दोनों को दर्शा सकता है; यहाँ मूर्तियों की प्रचलित सामग्री-सूची में ‘काँसा’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִשְׁתִּיו
  choice: उन्होंने ... पिया
  rationale: पְּעַל पूर्ण, तृतीय पुरुष बहुवचन, कथा में सम्पन्न क्रिया बताता है; हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: חַמְרָא
  choice: दाखमधु
  rationale: यह निश्चित एकवचन संज्ञा भोज में पिए जा रहे मद्य को दर्शाती है। ‘दाखमधु’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए गरिमापूर्ण बाइबिलीय शैली देता है।
- source_word: וְשַׁבַּחוּ
  choice: और ... स्तुति की
  rationale: क्रिया का अर्थ प्रशंसा या स्तुति करना है; देवताओं को संबोधित उपासना-संदर्भ में ‘स्तुति की’ स्वाभाविक और सटीक है।
- source_word: לֵאלָהֵי
  choice: देवताओं की
  rationale: ל प्रशंसा के लक्ष्य को चिह्नित करता है। हिन्दी में ‘देवताओं की स्तुति की’ उसका स्वाभाविक रूप है।
- source_word: דַּהֲבָא וְכַסְפָּא
  choice: सोने, चाँदी
  rationale: मूर्तियों से संबद्ध पदार्थों की सूची को सम्बन्धकारक ‘के’ के साथ रखा गया है।
- source_word: נְחָשָׁא
  choice: काँसे
  rationale: शब्द ताँबा या काँसा दोनों का बोध करा सकता है; मूर्ति-पदार्थों की पारंपरिक सूची में ‘काँसा’ अधिक उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: פַרְזְלָא
  choice: लोहे
  rationale: धातु के लिए मानक आधुनिक हिन्दी शब्द।
- source_word: אָעָא
  choice: लकड़ी
  rationale: मूर्ति बनाने की सामग्री के संदर्भ में स्वाभाविक हिन्दी समतुल्य।
- source_word: וְאַבְנָא
  choice: पत्थर
  rationale: मूर्ति बनाने की सामग्री के संदर्भ में ‘पत्थर’ स्वाभाविक समतुल्य है।
theological_decisions:
- issue: אֱלָהֵי का अनुवाद एकवचन ‘परमेश्वर’ हो या बहुवचन ‘देवता’
  choice: देवताओं
  alternative: परमेश्वर
  rationale: अरामी बहुवचन रूप और उसके बाद सोने आदि पदार्थों की सूची से मूर्तियों से जुड़े अनेक अन्य देवता अभिप्रेत हैं; इसलिए बहुवचन आवश्यक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। पदार्थों की पूरी सूची एक ही सम्बन्धसूचक ‘के’ से जोड़ी गई है, जो हिन्दी में स्वाभाविक है।
