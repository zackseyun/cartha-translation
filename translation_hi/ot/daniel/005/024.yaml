- from: तब उसके सम्मुख से हाथ का पंजा भेजा गया[a], और यह लेख अंकित किया गया[b]।
  to: तब उसके सम्मुख से एक हाथ की हथेली भेजी गई[a], और यह लेख अंकित किया गया[b]।
  rationale: The revision is limited to a clearer, more idiomatic anatomical expression and an improved lexical-alternative footnote. It retains the Aramaic sequence, passive construction, indefinite sense of ‘a hand,’ pronoun ambiguity, and the distinction between inscription and ordinary writing.
