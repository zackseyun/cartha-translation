  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אדַ֨יִן֙ מִן קֳדָמ֔וֹ/הִי שְׁלִ֖יַחַ פַּסָּ֣/א דִֽי יְדָ֑/א וּ/כְתָבָ֥/א דְנָ֖ה רְשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/024.yaml
  text: Then from before him the palm of a hand was sent[b][a], and this writing was inscribed.
translation:
  language: hi
  text: तब उसके सम्मुख से एक हाथ की हथेली भेजी गई[a], और यह लेख अंकित किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी उपस्थिति से।’ अरामी में इसका शाब्दिक भाव ‘उसके सामने से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यह लेख लिखा गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को प्रस्तुत करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से क्रमिक प्रगति व्यक्त करता है।
- source_word: מִן קֳדָמוֹהִי
  choice: उसके सम्मुख से
  rationale: इसका शाब्दिक भाव ‘उसके सामने से’ है। ‘उसके सम्मुख से’ उस उपस्थिति से उद्गम की स्थानिक और व्यक्तिगत छवि को बनाए रखता है, जबकि केवल ‘उससे’ कहना उसे धुंधला कर देता।
- source_word: שְׁלִיחַ
  choice: भेजा गया
  rationale: मूल क्रिया कर्मवाच्य है और सीधे तौर पर भेजे जाने को व्यक्त करती है; हिन्दी का यह रूप उसी व्याकरणिक बल को सुरक्षित रखता है।
- source_word: פַּסָּא דִי יְדָא
  choice: हाथ का पंजा
  rationale: פַּסָּא हाथ के पंजे या अंतिम भाग को सूचित कर सकता है। सन्दर्भ में ‘हाथ का पंजा’ स्पष्ट और स्वाभाविक है तथा शरीर-रचना को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וּכְתָבָא דְנָה
  choice: और यह लेख
  rationale: כְתָבָא लिखी हुई सामग्री या लेख को दर्शाता है और דְנָה निकट संकेतवाचक ‘यह’ है; ‘यह लेख’ आगे उद्धृत सन्देश की ओर संकेत करता है।
- source_word: רְשִׁים
  choice: अंकित किया गया
  rationale: क्रिया का अर्थ लिखना या अंकित करना हो सकता है। दीवार पर प्रकट हुए लेख के सन्दर्भ में ‘अंकित किया गया’ उपयुक्त है और साधारण लेखन की अपेक्षा दृश्य अभिलेख का भाव देता है।
theological_decisions:
- issue: ‘उसके सम्मुख से’ में सर्वनाम का अभिप्राय
  choice: सर्वनाम को यथावत रखते हुए उसके सम्मुख से उद्गम की छवि सुरक्षित रखी गई है।
  alternative: इसे स्पष्ट करके ‘परमप्रधान परमेश्वर की उपस्थिति से’ या सामान्य बनाकर ‘उससे’ कहा जा सकता था।
  rationale: निकटवर्ती सन्दर्भ स्रोत को परमेश्वर से जोड़ता है, पर इस पद का अरामी पाठ स्वयं यहाँ संज्ञा के बजाय सर्वनाम रखता है। इसलिए अनुवाद स्पष्ट ईश्वरीय संज्ञा जोड़कर पाठ की संयमित अभिव्यक्ति को नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘सम्मुख’ मूल की उपस्थिति-संबंधी छवि को बनाए रखने के लिए चुना गया है; ‘अंकित’ दीवार पर लिखे जाने के दृश्य के अनुकूल है।
