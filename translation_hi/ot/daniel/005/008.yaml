  text: Then all the king’s wise men came in[b][a], but they were not able to read the writing or make its interpretation known to the king.
translation:
  language: hi
  text: तब राजा के सभी ज्ञानी भीतर आए, पर वे उस लेख को पढ़ न सके[a] और उसका अर्थ[b] राजा को न बता सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस लिखे हुए संदेश को पढ़ न सके।’ अरामी शब्द लिखी हुई बात या संदेश का भी उल्लेख कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसकी व्याख्या राजा को न बता सके।’ ‘व्याख्या’ के लिए प्रयुक्त अरामी शब्द दानिय्येल की पुस्तक में किसी रहस्यमय संदेश या स्वप्न को समझाने के लिए बार-बार आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को क्रम में प्रस्तुत करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: עללין
  choice: भीतर आए
  rationale: बहुवचन क्रिया राजदरबार में प्रवेश करने को व्यक्त करती है; ‘भीतर आए’ प्रसंगानुकूल आधुनिक हिन्दी है।
- source_word: כֹּל חַכִּימֵי מַלְכָּא
  choice: राजा के सभी बुद्धिमान पुरुष
  rationale: सम्बन्धवाचक पदबंध राजा के दरबार से जुड़े पूरे ज्ञानी वर्ग को दर्शाता है। ‘बुद्धिमान पुरुष’ मूल शब्द के व्यापक अर्थ को बनाए रखता है।
- source_word: וְלָא כָהֲלִין
  choice: पर वे ... न सके
  rationale: नकारयुक्त रूप उनकी असमर्थता बताता है और संयोजक यहाँ प्रवेश तथा विफलता के बीच विरोध प्रकट करता है।
- source_word: כְּתָבָא לְמִקְרֵא
  choice: उस लेख को पढ़
  rationale: כְּתָבָא लिखी हुई सामग्री या संदेश का द्योतक है; ‘लेख’ हिन्दी में संक्षिप्त है और ‘लिखे हुए संदेश’ की सम्भावना खुली रखता है।
- source_word: וּפִשְׁרָא
  choice: उसका अर्थ
  rationale: פְּשַׁר दानिय्येल में किसी रहस्यमय लेख या स्वप्न की व्याख्या/अर्थ के लिए बार-बार आता है। ‘अर्थ’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी तकनीकी ‘व्याख्या’ को सुरक्षित रखती है।
- source_word: לְהוֹדָעָה לְמַלְכָּא
  choice: राजा को बता सके
  rationale: ידע के कारक infinitive का अर्थ ‘ज्ञात कराना’ है; ‘बता सके’ हिन्दी में स्वाभाविक रूप से राजा को अर्थ ज्ञात कराने की क्रिया व्यक्त करता है।
