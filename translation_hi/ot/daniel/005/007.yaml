  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दरबारी वातावरण के लिए ‘बाबेल’, ‘बुद्धिमान’, ‘बैंगनी वस्त्र’ और ‘शासन करेगा’ जैसे प्रतिष्ठित किंतु सामान्यतः समझ आने वाले पद चुने गए हैं। स्रोत के रूढ़ ‘उत्तर दिया और कहा’ को हिंदी प्रवाह के लिए ‘कहा’ किया गया है; कसदियों की पहचान और तीसरे शासकीय स्थान की वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
