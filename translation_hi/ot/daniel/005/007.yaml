  text: קָרֵ֤א מַלְכָּ/א֙ בְּ/חַ֔יִל לְ/הֶֽעָלָה֙ לְ/אָ֣שְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/חַכִּימֵ֣י בָבֶ֗ל דִּ֣י כָל אֱ֠נָשׁ דִּֽי יִקְרֵ֞ה כְּתָבָ֣/ה דְנָ֗ה וּ/פִשְׁרֵ/הּ֙ יְחַוִּנַּ֔/נִי אַרְגְּוָנָ֣/א יִלְבַּ֗שׁ ו/המונכ/א דִֽי דַהֲבָ/א֙ עַֽל צַוְּארֵ֔/הּ וְ/תַלְתִּ֥י בְ/מַלְכוּתָ֖/א יִשְׁלַֽט׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/007.yaml
  text: The king called out loudly to bring in the enchanters[a], the Chaldeans, and the diviners. The king answered and said to the wise men of Babylon, “Any man who reads this writing and makes its interpretation known to me shall be clothed with purple, have a chain of gold around his neck[c][b], and rule as third in the kingdom.”
translation:
  language: hi
  text: राजा ने ऊँचे स्वर में पुकारकर आदेश दिया कि जादूगरों, कसदियों[a] और शकुन बताने वालों को भीतर लाया जाए। राजा ने बाबेल के बुद्धिमानों से कहा, “जो कोई इस लिखावट को पढ़े और इसका अर्थ मुझे बताए, उसे बैंगनी वस्त्र पहनाया जाएगा, उसके गले में सोने की जंजीर डाली जाएगी, और वह राज्य में तीसरा अधिकारी होगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कसदी” यहाँ केवल एक जाति का नाम ही नहीं, बल्कि बाबेल के ज्योतिषियों अथवा दरबारी विद्वानों के एक वर्ग का पदनाम भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “राज्य का तीसरा शासक होगा।” अरामी वाक्यांश संभवतः अधिकार की दृष्टि से तीसरे स्थान को सूचित करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵא ... בְּחַיִל
  choice: ऊँचे स्वर में पुकारकर कहा
  rationale: यह अरामी मुहावरा बलपूर्वक और सार्वजनिक रूप से पुकारने का भाव देता है; यह हिंदी प्रयोग उसकी तीव्रता और राजकीय आदेश—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהֶעָלָה
  choice: भीतर लाया जाए
  rationale: हाफेल धातुरूप का अर्थ यहाँ व्यक्तियों को राजा की उपस्थिति में बुलाकर लाना है; दरबारी प्रसंग में यह सहज हिंदी है।
- source_word: אָשְׁפַיָּא
  choice: तांत्रिकों
  rationale: यह शब्द जादुई या मंत्र-संबंधी क्रियाओं के विशेषज्ञों के एक वर्ग को सूचित करता है। ‘तांत्रिक’ सामान्य पाठक के लिए बोधगम्य है और इसे व्यापक ‘बुद्धिमानों’ से अलग रखता है।
- source_word: כשדי/א
  choice: कसदियों
  rationale: मूल जातीय/तकनीकी पदनाम को सुरक्षित रखा गया है; प्रसंग में यह बाबेली दरबार के विद्वान-ज्योतिषी वर्ग को भी सूचित कर सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: גָזְרַיָּא
  choice: शकुन-विचारकों
  rationale: यह पद शकुनों का निर्णय अथवा उनका अर्थ बताने वालों को सूचित करता है। यह अनुवाद उनकी भविष्यसूचक-व्याख्यात्मक भूमिका स्पष्ट करता है।
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: राजा ने ... कहा
  rationale: अरामी का ‘उत्तर दिया और कहा’ एक रूढ़ कथात्मक सूत्र है; यहाँ कोई प्रत्यक्ष प्रश्न नहीं है, इसलिए आधुनिक हिंदी में केवल ‘कहा’ अधिक स्वाभाविक है और कथन का आशय अक्षुण्ण रखता है।
- source_word: לְחַכִּימֵי בָבֶל
  choice: बाबेल के बुद्धिमानों से
  rationale: यह दरबारी विद्वानों के सामूहिक पदनाम का सीधा और प्रतिष्ठित हिंदी रूप है।
- source_word: כָל אֱנָשׁ
  choice: जो कोई
  rationale: अरामी पुल्लिंग एकवचन यहाँ सामान्य अर्थ में प्रयुक्त है। ‘जो कोई’ उस व्यापक अर्थ को स्वाभाविक हिंदी में बिना अनावश्यक लैंगिक सीमांकन के व्यक्त करता है।
- source_word: יִקְרֵה כְּתָבָה דְנָה
  choice: इस लिखावट को पढ़कर
  rationale: ‘लिखावट’ दीवार पर दिखाई देने वाले लिखित संदेश को सूचित करती है और ‘लेख’ की अपेक्षा सामान्य पाठक के लिए अधिक प्रत्यक्ष है।
- source_word: וּפִשְׁרֵהּ יְחַוִּנַּנִי
  choice: इसका अर्थ मुझे बताएगा
  rationale: פְּשַׁר का आशय व्याख्या या अर्थ है और क्रिया का अर्थ उसे ज्ञात कराना है; हिंदी में यह संयोजन स्पष्ट और सहज है।
- source_word: אַרְגְּוָנָא יִלְבַּשׁ
  choice: उसे बैंगनी वस्त्र पहनाया जाएगा
  rationale: बैंगनी वस्त्र राजकीय सम्मान का चिह्न है। कर्मवाच्य रचना सम्मान प्रदान किए जाने का स्रोतगत भाव बनाए रखती है।
- source_word: ו/המונכא די דהבא על צוארהּ
  choice: उसके गले में सोने की माला डाली जाएगी
  rationale: संदिग्ध रूप והמונכא के प्रसंगगत अर्थ को स्वर्ण की सम्मानसूचक गले की माला/जंजीर के रूप में प्रस्तुत किया गया है; ‘माला’ आधुनिक हिंदी में स्वाभाविक आभूषण-पद है।
- source_word: וְ/תַלְתִּי בְ/מַלְכוּתָ/א יִשְׁלַט
  choice: राज्य में तीसरे स्थान पर शासन करेगा
  rationale: यह वाक्यांश तीसरी श्रेणी के अधिकार या राज्य में तीसरे शासकीय पद को व्यक्त करता है। ‘तीसरे स्थान पर’ स्रोत की क्रम-संबंधी अस्पष्टता को किसी विशेष प्रशासनिक उपाधि में बदले बिना बनाए रखता है।
theological_decisions:
- issue: राज्य में ‘तीसरा’ होने का आशय
  choice: राज्य में तीसरे स्थान पर शासन करेगा
  alternative: राज्य का तीसरा शासक होगा
  rationale: अरामी תַלְתִּי पद या क्रम में तीसरे होने का संकेत देता है, पर यह अनिवार्यतः किसी निश्चित त्रिशासकीय व्यवस्था की तकनीकी उपाधि नहीं बताता। चुना हुआ रूप ऐतिहासिक-प्रशासनिक प्रश्न को खुला रखता है।
