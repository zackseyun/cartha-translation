  text: אֱ֠דַיִן מַלְכָּ֤/א בֵלְשַׁאצַּר֙ שַׂגִּ֣יא מִתְבָּהַ֔ל וְ/זִיוֺ֖/הִי שָׁנַ֣יִן עֲל֑וֹ/הִי וְ/רַבְרְבָנ֖וֹ/הִי מִֽשְׁתַּבְּשִֽׁין׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/009.yaml
  text: Then King Belshazzar became greatly alarmed[a], his color changed[b], and his nobles were perplexed.
translation:
  language: hi
  text: तब राजा बेलशस्सर बहुत घबरा गया, उसके चेहरे की रंगत बदल गई[a], और उसके बड़े अधिकारी उलझन में पड़ गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी मुखाकृति बदल गई।” अरामी शब्द का शाब्दिक अर्थ उसकी आभा, रूप या दिखाई देने वाली मुख-रंगत हो सकता है; यहाँ यह भय से चेहरे पर आए परिवर्तन का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके सरदार हैरान रह गए।” यह शब्द राजा के प्रमुख अधिकारियों या प्रतिष्ठित दरबारियों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: מַלְכָּא בֵלְשַׁאצַּר
  choice: राजा बेलशस्सर
  rationale: राजकीय उपाधि और व्यक्तिगत नाम को हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: שַׂגִּיא מִתְבָּהַל
  choice: बहुत घबरा गया
  rationale: שַׂגִּיא तीव्रता बताता है और מִתְבָּהַל भयजनित व्याकुलता या घबराहट; यह चयन दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְזִיוֹהִי שָׁנַיִן עֲלוֹהִי
  choice: उसके चेहरे की रंगत बदल गई
  rationale: זִיו का अर्थ आभा, रूप या मुख की रंगत हो सकता है। भय के प्रसंग में यह दृश्य मुख-परिवर्तन का मुहावरा है; ‘चेहरे की रंगत’ अर्थ को स्पष्ट रखते हुए मूल की देहगत प्रतिक्रिया को व्यक्त करती है।
- source_word: וְרַבְרְבָנוֹהִי
  choice: उसके बड़े अधिकारी
  rationale: यह शब्द राजा के प्रमुख व्यक्तियों, सरदारों या उच्च पदाधिकारियों को दर्शाता है; ‘बड़े अधिकारी’ सामान्य पाठक के लिए स्पष्ट और दरबारी संदर्भ के अनुकूल है।
- source_word: מִשְׁתַּבְּשִׁין
  choice: उलझन में पड़ गए
  rationale: यह रूप भ्रमित, व्याकुल या अव्यवस्थित हो जाने का भाव देता है; चुना हुआ वाक्यांश मानसिक असमंजस को स्वाभाविक हिन्दी में प्रकट करता है।
