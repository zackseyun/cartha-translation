base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/003.yaml
  text: Then they brought in the gold vessels that had been taken out of the temple[a], the house of God, which was in Jerusalem, and the king and his nobles[b], his wives and his concubines drank from them.
translation:
  language: hi
  text: तब वे सोने के पात्र ले आए, जिन्हें यरूशलेम में स्थित परमेश्वर के भवन, अर्थात् मन्दिर में से निकाला गया था[a]; और राजा, उसके उच्च अधिकारियों, उसकी पत्नियों[b] और उसकी रखैलियों ने उनमें से पीया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें यरूशलेम में स्थित परमेश्वर के भवन, अर्थात् मन्दिर में से निकाला गया था।” अरामी क्रिया को कर्मवाच्य रूप में भी अनुवाद किया जा सकता है; मुख्य पाठ में सक्रिय रूप मूल के बहुवचन कर्ता को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: “पत्नियाँ” के लिए प्रयुक्त अरामी शब्द राजकीय सहधर्मिणियों को सूचित कर सकता है; कुछ अनुवादों में “रानियाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले क्रमिक घटनाक्रम का परिचय देता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: הַיְתִיו
  choice: लाए गए
  rationale: संदर्भ में सोने के पात्र भीतर लाए जाने का भाव है। कर्मवाच्य हिन्दी पात्रों पर कथात्मक बल बनाए रखती है और अनिर्दिष्ट कर्ता नहीं जोड़ती।
- source_word: מָאנֵי דַהֲבָא
  choice: सोने के वे पात्र
  rationale: מָאנֵי का अर्थ पात्र या उपकरण हो सकता है; मन्दिर और पीने के संदर्भ में ‘पात्र’ सटीक तथा स्वाभाविक है।
- source_word: דִּי הַנְפִּקוּ
  choice: जिन्हें ... निकाला गया था
  rationale: रूप को अनिर्दिष्ट बहुवचन कर्ता के साथ सक्रिय भी समझा जा सकता है, पर हिन्दी कर्मवाच्य पात्रों को केन्द्र में रखता है और मूल का आशय सुरक्षित रखता है।
- source_word: מִן הֵיכְלָא דִּי בֵית אֱלָהָא
  choice: परमेश्वर के भवन, अर्थात् मन्दिर में से
  rationale: הֵיכְלָא और ‘परमेश्वर का भवन’ के संबंध को स्पष्ट करने के लिए व्याख्यात्मक समानाधिकरण रखा गया है; इससे दोनों मूल पद सुरक्षित रहते हैं और हिन्दी में संबंध अस्पष्ट नहीं होता।
- source_word: דִּי בִירוּשְׁלֶם
  choice: यरूशलेम में स्थित
  rationale: यह परमेश्वर के भवन/मन्दिर का स्थान बताता है; ‘स्थित’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: וְאִשְׁתִּיו בְּהוֹן
  choice: उन पात्रों में से पीने लगे
  rationale: पूर्वसर्ग पात्रों को पीने के साधन/स्रोत के रूप में दर्शाता है। ‘में से पीने लगे’ आधुनिक हिन्दी में स्पष्ट है और क्रिया के आरम्भिक कथात्मक भाव को सहज रूप देता है।
- source_word: רַבְרְבָנוֹהִי
  choice: उसके उच्च अधिकारी
  rationale: यह राजकीय बड़े लोगों या पदाधिकारियों को सूचित करता है; ‘उच्च अधिकारी’ आज के सामान्य पाठक के लिए ‘सरदारों’ या ‘महान पुरुषों’ से अधिक स्पष्ट है।
- source_word: שֵׁגְלָתֵהּ
  choice: उसकी पत्नियाँ
  rationale: यह शब्द राजकीय पत्नियों या सहधर्मिणियों के लिए प्रयुक्त हो सकता है। ‘पत्नियाँ’ सबसे पारदर्शी है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּלְחֵנָתֵהּ
  choice: उसकी रखैलियाँ
  rationale: यह राजकीय गृह की निम्न वैवाहिक स्थिति वाली स्त्रियों को अलग वर्ग के रूप में दर्शाता है; ‘रखैलियाँ’ आधुनिक हिन्दी में समझ में आने वाला सटीक भेद रखता है।
