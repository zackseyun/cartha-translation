source:
  edition: WLC
  text: וְ/שִׁמְעֵ֣ת עלי/ך דִּ֛י ר֥וּחַ אֱלָהִ֖ין בָּ֑/ךְ וְ/נַהִיר֧וּ וְ/שָׂכְלְתָנ֛וּ וְ/חָכְמָ֥ה יַתִּירָ֖ה הִשְׁתְּכַ֥חַת בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/014.yaml
  text: And I have heard about you that the spirit of the gods is in you[b][a], and that light and insight and extraordinary wisdom are found in you.
translation:
  language: hi
  text: और मैंने तुम्हारे विषय में सुना है कि देवताओं की आत्मा तुममें है[a], और तुममें प्रकाश[b], समझ और असाधारण बुद्धि पाई गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की आत्मा।” अरामी में शाब्दिक रूप से “देवताओं की आत्मा” है, जो राजा की भाषा और दृष्टिकोण को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “प्रकाश” मानसिक स्पष्टता या प्रबोधन के लिए रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁמְעֵת עֲלָיִךְ
  choice: और मैंने तुम्हारे विषय में सुना है
  rationale: अरामी पूर्णकाल प्राप्त सूचना को व्यक्त करता है; हिन्दी में ‘मैंने ... सुना है’ प्रसंग के अनुरूप स्वाभाविक है।
- source_word: רוּחַ אֱלָהִין
  choice: देवताओं की आत्मा
  rationale: אֱלָהִין रूप की दृष्टि से बहुवचन है और यह एक बाबिलोनी राजा की वाणी है; इसलिए वक्ता का दृष्टिकोण सुरक्षित रखा गया है।
- source_word: בָּךְ
  choice: तुममें है
  rationale: यह सीधा स्थानवाचक प्रयोग है।
- source_word: נַהִירוּ
  choice: प्रकाश
  rationale: मूल अर्थ ‘प्रकाश/चमक’ है और यहाँ मानसिक स्पष्टता के रूपक के तौर पर प्रयुक्त है; ‘प्रकाश’ मूल रूपक को बनाए रखता है।
- source_word: שָׂכְלְתָנוּ
  choice: समझ
  rationale: यह समझ-बूझ या सूझ को दर्शाता है; साधारण आधुनिक हिन्दी में ‘समझ’ स्पष्ट और स्वाभाविक है।
- source_word: חָכְמָה יַתִּירָה
  choice: असाधारण बुद्धि
  rationale: יַתִּירָה सामान्य से बढ़कर होने का भाव देता है; ‘असाधारण’ उस बल को व्यक्त करता है।
- source_word: הִשְׁתְּכַחַת
  choice: पाई गई है
  rationale: क्रिया का अर्थ ‘पाया जाना’ है; निकटतम स्त्रीलिंग एकवचन संज्ञा के साथ अरामी क्रिया भी स्त्रीलिंग एकवचन है, जबकि पूरी गुण-सूची सामूहिक रूप से अभिप्रेत है।
theological_decisions:
- issue: אֱלָהִין को एकवचन ‘परमेश्वर’ मानना या बहुवचन ‘देवताओं’ के रूप में अनुवाद करना
  choice: देवताओं की आत्मा
  alternative: परमेश्वर की आत्मा / परमेश्वर का आत्मा
  rationale: तत्काल वक्ता बेलशस्सर है और अरामी रूप बहुवचन है। बहुवचन अनुवाद बाबिलोनी दरबारी दृष्टिकोण को सुरक्षित रखता है और वक्ता की भाषा को इस्राएली या मसीही धर्मवैज्ञानिक भाषा में नहीं बदलता; एकवचन व्याख्या को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण दरबारी कथन। ‘तुम’ मूल के एकवचन संबोधन को सहज रूप में रखता है। पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
