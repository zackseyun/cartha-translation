    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְנָה
  choice: और ... यह है
  rationale: संयोजक וּ और संकेतवाचक דְנָה दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में सुरक्षित रखा गया है।
- source_word: כְתָבָא
  choice: लेख
  rationale: दीवार पर लिखे संदेश के लिए यह संक्षिप्त, गरिमापूर्ण और सामान्य हिन्दी शब्द है; ‘लिखावट’ भी सम्भव है, पर वह यहाँ कम औपचारिक लगता है।
- source_word: דִּי רְשִׁים
  choice: जो ... लिखा गया था
  rationale: सम्बन्धवाचक कण और निष्क्रिय क्रिया को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: מְנֵא מְנֵא
  choice: मने, मने
  rationale: अरामी शब्द और उसकी पुनरावृत्ति ज्यों की त्यों रखी गई है, ताकि अगले पदों में होने वाली व्याख्या और शब्दक्रीड़ा पहले से न सुलझा दी जाए।
- source_word: תְּקֵל
  choice: तकेल
  rationale: रहस्यमय लेख और ‘तौला गया’ से जुड़ी आगामी शब्दक्रीड़ा को बनाए रखने के लिए लिप्यन्तरण किया गया है।
- source_word: וּפַרְסִין
  choice: और परसीन
  rationale: वाव को ‘और’ से व्यक्त किया गया तथा बहुवचन रूप का लिप्यन्तरण रखा गया, क्योंकि अगले पद में एकवचन ‘पेरेस’ के माध्यम से विभाजन और फारसियों की ध्वनि-संगति उभरती है।
theological_decisions:
- issue: लेख के शब्दों का अर्थ इसी पद में खोलना या उन्हें लिप्यन्तरित रखना
  choice: शब्दों को लिप्यन्तरित रखा गया
  alternative: ‘गिना गया, तौला गया और बाँटा गया’ जैसे अर्थानुवाद
  rationale: मूल कथा जानबूझकर इन शब्दों को पहले रहस्यमय रूप में प्रस्तुत करती है और फिर दानिय्येल से उनकी व्याख्या कराती है; अर्थानुवाद उस साहित्यिक और धर्मवैचारिक तनाव को समय से पहले समाप्त कर देता।
translation_notes:
  register: 'आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण गद्य। ‘लेख’ को ‘लिखावट’ या ‘अभिलेख’ पर प्राथमिकता दी गई: पहला अधिक सामान्य और सन्दर्भानुकूल है, जबकि ‘अभिलेख’ अनावश्यक रूप से तकनीकी लग सकता है। अरामी नामों का देवनागरी लिप्यन्तरण हिन्दी उच्चारण के अनुरूप रखा गया है।'
