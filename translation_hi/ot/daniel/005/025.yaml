  text: 'और यह वह लेख[b] है जो लिखा गया था: मेने[a], मेने, तेकेल और परसीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इन अरामी शब्दों को लिप्यन्तरित रखा गया है, क्योंकि अगले पदों में दानिय्येल उनकी व्याख्या शब्द-खेल के साथ करता है: ‘मेने’ का सम्बन्ध गिनने से, ‘तेकेल’ का तौलने से, और ‘परसीन/पेरेस’ का विभाजित करने से है; ‘पेरेस’ में फारस/फारसियों के साथ भी शब्द-खेल है।'
    reason: lexical_alternative
  - marker: b
