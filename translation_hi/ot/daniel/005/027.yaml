  text: 'तकेल: तुम्हें तराजू में तौला गया और तुम कम पाए गए[a][b][c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी ‘तकेल’ वह लिखा हुआ शब्द है जिसकी दानिय्येल व्याख्या करता है; इसका संबंध तौले जाने के विचार से है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तराजू पर।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपर्याप्त पाए गए’ अथवा ‘कमी वाले पाए गए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּקֵל
  choice: तकेल
  rationale: यह दीवार पर लिखा अरामी शब्द है जिसकी व्याख्या दानिय्येल करता है। इसलिए इसे अर्थानुवाद करने के बजाय लिप्यंतरित किया गया है, ताकि लिखे हुए संकेत-शब्द और उसकी व्याख्या का भेद बना रहे।
- source_word: תְּקִילְתָּה
  choice: तुम्हें ... तौला गया
  rationale: यह बेलशस्सर को संबोधित कर्मवाच्य रूप है और पूर्ण हो चुके मूल्यांकन को व्यक्त करता है।
- source_word: בְמֹאזַנְיָא
  choice: तराजू में
  rationale: यह तौलने के साधन को दर्शाता है। ‘तराजू में’ आधुनिक हिन्दी में स्वाभाविक है और मूल न्यायात्मक रूपक को सुरक्षित रखता है।
- source_word: וְהִשְׁתְּכַחַתְּ
  choice: और तुम ... पाए गए
  rationale: यह जाँच या मूल्यांकन के बाद सामने आए परिणाम को व्यक्त करता है; हिन्दी में स्पष्टता के लिए संबोधित व्यक्ति ‘तुम’ दोहराया गया है।
- source_word: חַסִּיר
  choice: कम
  rationale: यह अपेक्षित माप या भार से कम होने की कमी को व्यक्त करता है। ‘कम’ तौल के रूपक को बनाए रखते हुए साधारण आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: न्याय के रूपक का स्वरूप
  choice: ईश्वरीय मूल्यांकन को तौले जाने और कम पाए जाने की छवि द्वारा व्यक्त किया गया है।
  alternative: ‘परमेश्वर ने तुम्हारा न्याय करके तुम्हें दोषी पाया’ जैसा व्याख्यात्मक विस्तार, अथवा केवल व्यापारिक तौल का शाब्दिक अर्थ।
  rationale: मूल पाठ तौल और कमी का रूपक रखता है; अनुवाद उसी तनाव और चित्रात्मकता को बनाए रखता है, उसे न तो विस्तृत धर्मवैज्ञानिक व्याख्या में बदलता है, न केवल वास्तविक व्यापारिक तौल तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘तकेल’ को संकेत-शब्द के रूप में लिप्यंतरित किया गया है और न्यायात्मक तौल का मूल रूपक सुरक्षित रखा गया है।
