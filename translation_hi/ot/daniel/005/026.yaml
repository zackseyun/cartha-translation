  yaml_path: translation/ot/daniel/005/026.yaml
  text: 'This is the interpretation of the message: MENE—God has numbered your kingdom and finished it[a][b].'
translation:
  language: hi
  text: 'इस संदेश[b] की व्याख्या यह है: “मेने”[a]—परमेश्वर ने तुम्हारे राज्य को गिन लिया है और उसका अन्त कर दिया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी शब्द “मेने” उस क्रिया की ध्वनि से मिलता है जिसका अर्थ “गिनना” या “गणना करना” है।
    reason: lexical_alternative
  - marker: b
    text: “संदेश” के स्थान पर “वचन,” “बात,” “विषय” या “लेख” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: यह है
  rationale: अरामी संकेतवाचक शब्द व्याख्या का परिचय देता है; हिन्दी में निहित योजक क्रिया को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: פְּשַׁר
  choice: अर्थ
  rationale: दानिय्येल में यह रहस्यमय लेख या स्वप्न की व्याख्या को दर्शाता है। यहाँ ‘अर्थ’ सहज आधुनिक हिन्दी है और प्रसंग में स्पष्ट है।
- source_word: מִלְּתָא
  choice: संदेश
  rationale: इस शब्द का अर्थ ‘वचन,’ ‘बात,’ ‘विषय’ या प्रसंगानुसार ‘लेख’ हो सकता है। दीवार पर लिखे शब्दों को अर्थपूर्ण सूचना के रूप में दर्शाने के लिए ‘संदेश’ चुना गया; विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: מְנֵא
  choice: मने
  rationale: यह दीवार पर लिखे उस अरामी शब्द का लिप्यंतरण है जिसकी व्याख्या आगे की क्रिया करती है; इसे अनूदित कर देने के बजाय मूल शब्द-खेल सुरक्षित रखा गया है।
- source_word: מְנָה
  choice: गिन लिया है
  rationale: यह क्रिया ‘मने’ की व्याख्या करती है। ‘गिन लिया है’ गणना और निर्धारित अवधि पूरी होने—दोनों के न्याय-संबंधी संकेत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלָהָא
  choice: परमेश्वर
  rationale: प्रसंग में यह उस परमेश्वर को दर्शाता है जो राज के विषय में न्याय का निर्णय करता है; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक है।
- source_word: מַלְכוּתָךְ
  choice: तुम्हारे राज्य
  rationale: संज्ञा राजकीय प्रभुत्व, राजत्व या राज्य को दर्शा सकती है। ‘तुम्हारे राज्य’ बेलशस्सर के शासन और राज्य दोनों के लिए सहज और पर्याप्त व्यापक है।
- source_word: וְהַשְׁלְמַהּ
  choice: और उसका अन्त कर दिया है
  rationale: कारक रूप वाली यह क्रिया किसी वस्तु को पूरा करने या समाप्त कर देने का भाव रखती है। न्याय के प्रसंग में ‘अन्त कर दिया है’ सफल समापन के बजाय राज की समाप्ति स्पष्ट करता है।
theological_decisions:
- issue: ‘मने’ की व्याख्या में परमेश्वर के कार्य का स्वरूप
  choice: परमेश्वर ने राज्य को गिन लिया और उसका अन्त कर दिया है
  alternative: परमेश्वर ने राज्य के दिन गिनकर उसे समाप्त कर दिया है
  rationale: मूल पाठ ‘दिन’ नहीं कहता, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया। अनुवाद परमेश्वर के सार्वभौम न्याय और राज्य की निर्धारित समाप्ति को व्यक्त करता है, पर गणना की उपमा को अनावश्यक रूप से नहीं खोलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और संक्षिप्त शैली रखी गई है। राजा को संबोधित करते हुए अत्यधिक पुरातन ‘तेरे’ के बजाय सामान्य ‘तुम्हारे’ चुना गया है। अरामी शब्द-खेल बचाने के लिए ‘मने’ का लिप्यंतरण मुख्य पाठ में रखा गया है।
