base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/029.yaml
  text: Then Belshazzar gave the command[a], and they clothed Daniel with purple, put a chain of gold around his neck[b], and proclaimed concerning him that he should be the third ruler in the kingdom.
translation:
  language: hi
  text: तब बेलशस्सर ने आज्ञा दी, और उन्होंने दानिय्येल को बैंगनी वस्त्र[a] पहनाए, उसके गले में सोने की जंजीर डाली, और उसके विषय में घोषणा की कि वह राज्य में तीसरा शासक[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने दानिय्येल को बैंगनी पोशाक पहनाई।” अरामी शब्द बैंगनी वस्त्र या राजकीय सम्मान के चिह्न के रूप में बैंगनी कपड़े को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “राज्य में तीसरे स्थान का शासक।” यह पदबंध राज्य में अधिकार के क्रम को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को क्रम में जोड़ता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: אֲמַר בֵּלְשַׁאצַּר
  choice: बेलशस्सर ने आज्ञा दी
  rationale: अक्षरशः क्रिया ‘कहा’ है, पर अगले बहुवचन कर्ताओं द्वारा आदेश पूरा किए जाने के कारण यहाँ राजकीय आज्ञा का भाव है।
- source_word: וְהַלְבִּישׁוּ לְדָנִיֵּאל אַרְגְּוָנָא
  choice: उन्होंने दानिय्येल को बैंगनी वस्त्र पहनाए
  rationale: बहुवचन क्रिया को सक्रिय रूप में रखा गया है। אַרְגְּוָנָא बैंगनी कपड़े अथवा राजकीय सम्मानसूचक बैंगनी पोशाक को दर्शाता है; हिंदी में ‘बैंगनी वस्त्र’ दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְהַמּוֹנְכָא דִי דַהֲבָא עַל צַוְּארֵהּ
  choice: उसके गले में सोने की माला डाली
  rationale: संज्ञा गले में पहने जाने वाले सम्मानसूचक स्वर्ण आभूषण को दर्शाती है। ‘सोने की माला’ आधुनिक हिंदी में ‘सोने की जंजीर’ से अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: וְהַכְרִזוּ עֲלוֹהִי
  choice: उसके विषय में घोषणा की
  rationale: क्रिया सार्वजनिक उद्घोषणा को और संबंधसूचक पदबंध दानिय्येल के विषय में की गई घोषणा को व्यक्त करता है।
- source_word: דִּי לֶהֱוֵא שַׁלִּיט תַּלְתָּא בְּמַלְכוּתָא
  choice: कि वह राज्य में तीसरे पद का शासक होगा
  rationale: यह राजकीय नियुक्ति की घोषणा है। ‘तीसरे पद का’ क्रमसूचक शब्द को अधिकार-क्रम के रूप में स्पष्ट करता है, पर यह निर्धारित नहीं करता कि उससे ऊपर कौन-कौन थे।
theological_decisions:
- issue: राज्य में दानिय्येल के ‘तीसरे’ होने का सटीक प्रशासनिक अर्थ
  choice: तीसरे पद का शासक
  alternative: राज्य का तीसरा शासक
  rationale: अरामी पदबंध पद अथवा अधिकार-क्रम को दर्शाता है। चुना हुआ रूप यह अस्पष्टता बनाए रखता है कि यह सह-शासन था या दरबार का तीसरा सर्वोच्च पद, और किसी ऐतिहासिक पुनर्निर्माण को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। राजदरबार के प्रसंग के अनुरूप ‘आज्ञा’, ‘घोषणा’ और ‘शासक’ प्रयुक्त हैं। अनिर्दिष्ट बहुवचन कर्ता को ‘उन्होंने’ के रूप में बनाए रखा गया है; पाठ में ‘सेवकों’ या ‘दरबारियों’ को नहीं जोड़ा गया।
