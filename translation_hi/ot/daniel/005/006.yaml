- source_word: רַעְיוֹנֹהִי
  choice: उसके विचारों
  rationale: संज्ञा मानसिक विचारों या मन में उठने वाली धारणाओं को व्यक्त करती है; बहुवचन को बनाए रखा गया है।
- source_word: יְבַהֲלוּנֵּהּ
  choice: ने उसे भयभीत कर दिया
  rationale: क्रिया तीव्र और अचानक भय या घबराहट व्यक्त करती है; आगे वर्णित शारीरिक प्रतिक्रिया इस तीव्रता का समर्थन करती है।
- source_word: קִטְרֵי חַרְצֵהּ
  choice: उसके कूल्हों के जोड़
  rationale: यह कठिन मुहावरा कमर-कूल्हे के जोड़ने वाले अंगों का संकेत देता है; यह अनुवाद शारीरिक दुर्बलता की छवि को स्पष्ट रखते हुए मूल के निकट है।
- source_word: מִשְׁתָּרַיִן
  choice: ढीले पड़ गए
  rationale: रूप का अर्थ खुलना, ढीला होना या शिथिल पड़ना है; भय से शरीर की शक्ति जाती रहने के प्रसंग में यह स्वाभाविक है।
- source_word: אַרְכֻבָּתֵהּ
  choice: उसके घुटने
  rationale: अरामी संज्ञा सीधे घुटनों को दर्शाती है।
- source_word: דָּא לְדָא
  choice: आपस में
  rationale: यह पारस्परिक अरामी अभिव्यक्ति है, जिसका स्वाभाविक हिन्दी रूप ‘आपस में’ है।
- source_word: נָקְשָׁן
  choice: टकराने लगे
  rationale: क्रिया का अर्थ चोट करना या टकराना है; घुटनों के लिए ‘टकराने लगे’ भय से लगातार काँपने की स्वाभाविक छवि देता है।
