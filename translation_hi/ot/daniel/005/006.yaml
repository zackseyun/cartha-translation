  text: Then the king’s color changed[a], and his thoughts terrified him; the joints of his hips gave way[b], and his knees knocked against each other.
translation:
  language: hi
  text: तब राजा के चेहरे का रंग बदल गया[a], और उसके विचारों ने उसे भयभीत कर दिया। उसके कूल्हों के जोड़ ढीले पड़ गए[b], और उसके घुटने आपस में टकराने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसकी चमक बदल गई।” यह अरामी मुहावरा भय के कारण उसके रूप या चेहरे का रंग बदलने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी कमर के जोड़ ढीले पड़ गए।” यह अभिव्यक्ति आतंक के कारण आई शारीरिक शिथिलता या ढह जाने जैसी दशा का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कालवाचक क्रियाविशेषण घटनाक्रम में अगली घटना को दर्शाता है; ‘तब’ स्वाभाविक और सटीक है।
