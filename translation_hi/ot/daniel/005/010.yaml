base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/010.yaml
  text: Because of the words of the king and his nobles[a], the queen entered the banquet hall. The queen spoke and said, “O king, live forever! Do not let your thoughts terrify you[b], and do not let your face grow pale.”
translation:
  language: hi
  text: राजा और उसके सरदारों की बातों के कारण रानी भोज-कक्ष में आई। रानी कहने लगी[a], “हे राजा, आप सदा जीवित रहें! आपके विचार आपको भयभीत न करें, और आपका चेहरा पीला न पड़े[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उत्तर दिया और कहा।” अरामी का यह मुहावरा किसी उत्तर को भी और केवल कथन के आरंभ को भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आपकी चमक/मुखाकृति न बदले।” यह चेहरे की दशा या रंग बदलने का मुहावरा है; इसी अध्याय में भय के कारण चेहरे का रंग बदलने की ऐसी ही अभिव्यक्ति मिलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָקֳבֵל מִלֵּי
  choice: बातें सुनकर
  rationale: यह पदबंध यहाँ उन बातों को रानी के आने का कारण या अवसर बताता है। सहज हिन्दी में ‘बातें सुनकर’ घटनाक्रम को स्पष्ट करता है, यद्यपि इसका अधिक शाब्दिक रूप ‘बातों के कारण’ है।
- source_word: רַבְרְבָנוֹהִי
  choice: उसके सरदारों
  rationale: यह शब्द ऊँचे पद वाले अधिकारियों या सामंतों को दर्शाता है; ‘सरदार’ आधुनिक पाठक के लिए स्पष्ट है और दरबारी पद-प्रतिष्ठा बनाए रखता है।
- source_word: לְבֵית מִשְׁתְּיָא
  choice: भोज-कक्ष में
  rationale: शाब्दिक अर्थ ‘पान/भोज का भवन’ है। ‘भोज-कक्ष’ राजकीय दावत के स्थान को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲנָת ... וַאֲמֶרֶת
  choice: कहने लगी
  rationale: अरामी का दोहरा वाक्-सूत्र शब्दशः ‘उत्तर दिया और कहा’ है, पर यहाँ किसी ने रानी को सीधे संबोधित नहीं किया। ‘कहने लगी’ हिन्दी में स्वाभाविक रूप से उसके भाषण का आरंभ कराता है; वैकल्पिक शाब्दिक अर्थ फुटनोट में रखा गया है।
- source_word: לְעָלְמִין חֱיִי
  choice: हे राजा, आप सदा जीवित रहें!
  rationale: यह राजदरबार में प्रयुक्त सम्मानसूचक शुभकामना है। आधुनिक हिन्दी का आदरसूचक ‘आप’ प्रसंग के अनुकूल है।
- source_word: רַעְיוֹנָךְ
  choice: आपके विचार
  rationale: संज्ञा का मूल अर्थ विचार या मन के चिंतन हैं। भय की तीव्रता अगले क्रियापद में है, इसलिए इसे ‘चिंताएँ’ बनाकर अर्थ को पहले ही सीमित नहीं किया गया।
- source_word: יְבַהֲלוּךְ
  choice: आपको भयभीत न करें
  rationale: क्रिया घबरा देने, व्याकुल करने या भयभीत करने का अर्थ देती है। राजा की तीव्र दशा के अनुरूप ‘भयभीत’ उपयुक्त है।
- source_word: זִיוָיךְ ... יִשְׁתַּנּוֹ
  choice: आपका चेहरा पीला न पड़े
  rationale: शब्दशः यह चमक, मुखाकृति या रूप के बदलने की बात है। इसी अध्याय के प्रसंग में भय से चेहरे का रंग बदलना अभिप्रेत है; सहज हिन्दी में ‘चेहरा पीला पड़ना’ इस मुहावरे का निकटतम अर्थ देता है, जबकि शाब्दिक अस्पष्टता फुटनोट में सुरक्षित है।
