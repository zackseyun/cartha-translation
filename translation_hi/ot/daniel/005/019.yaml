  text: וּ/מִן רְבוּתָ/א֙ דִּ֣י יְהַב לֵ֔/הּ כֹּ֣ל עַֽמְמַיָּ֗/א אֻמַיָּ/א֙ וְ/לִשָּׁ֣נַיָּ֔/א הֲו֛וֹ זאעין וְ/דָחֲלִ֖ין מִן קֳדָמ֑וֹ/הִי דִּֽי הֲוָ֨ה צָבֵ֜א הֲוָ֣א קָטֵ֗ל וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מַחֵ֔א וְ/דִֽי הֲוָ֤ה צָבֵא֙ הֲוָ֣ה מָרִ֔ים וְ/דִֽי הֲוָ֥ה צָבֵ֖א הֲוָ֥ה מַשְׁפִּֽיל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/005/019.yaml
  text: And because of the greatness that he gave him[a], all peoples, nations, and languages were trembling and fearing before him. Whomever he wanted, he killed; and whomever he wanted, he kept alive; and whomever he wanted, he raised up; and whomever he wanted[c][b], he humbled.
translation:
  language: hi
  text: और उस महानता के कारण जो उसने उसे दी थी,[a] सभी जातियों, राष्ट्रों और भाषाओं के लोग उसके सामने काँपते और डरते थे। वह जिसे चाहता, मार डालता; जिसे चाहता, जीवित रखता; जिसे चाहता, ऊँचा उठाता; और जिसे चाहता, नीचा करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उसने’ का संकेत पिछले पद में उल्लिखित परमेश्वर की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: רְבוּתָא
  choice: महानता
  rationale: यह संज्ञा महानता, महिमा या ऊँचे राजकीय पद को दर्शाती है। ‘महानता’ मूल की व्यापकता बनाए रखते हुए सहज आधुनिक हिन्दी है।
- source_word: יְהַב לֵהּ
  choice: उसने उसे दी थी
  rationale: अरामी में कर्ता व्यक्त नहीं है; पिछले पद से उसका संकेत परमेश्वर की ओर है। हिन्दी में सर्वनाम रखकर मूल की निहितता सुरक्षित रखी गई है।
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: जातियों, राष्ट्रों और भिन्न-भिन्न भाषा बोलनेवाले लोग
  rationale: यह त्रिक साम्राज्य के अधीन विविध जनसमूहों की समग्रता व्यक्त करता है। ‘भाषाएँ’ को लोगों के समानांतर कर्ता बनाने के बजाय हिन्दी में उसके आशय को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: זאעין וְדָחֲלִין
  choice: काँपते और डरते थे
  rationale: दोनों सहभागी क्रियाओं को अलग-अलग रखकर भय की तीव्रता और मूल की युग्मित अभिव्यक्ति सुरक्षित की गई है।
- source_word: מִן קֳדָמוֹהִי
  choice: उसके सामने
  rationale: यह अरामी मुहावरा उसकी उपस्थिति और अधिकार के सामने होने को दर्शाता है; ‘उसके सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: דִּי הֲוָה צָבֵא
  choice: जिसे चाहता
  rationale: बार-बार दोहराई गई रचना राजा की व्यक्तिगत इच्छा और निरंकुश अधिकार पर बल देती है; हिन्दी में वही पुनरावृत्ति रखी गई है।
- source_word: קָטֵל
  choice: मार डालता
  rationale: यह क्रिया सीधे हत्या या प्राण लेने को बताती है। ‘मार डालता’ स्पष्ट, प्रभावी और प्रसंगानुकूल है।
- source_word: מַחֵא
  choice: जीवित रखता
  rationale: ‘मार डालता’ के विरोध में इसका अर्थ जीवन बनाए रखना या प्राण बख्शना है। ‘जीवित रखता’ निकट और स्वाभाविक अनुवाद है।
- source_word: מָרִים
  choice: ऊँचा उठाता
  rationale: मूल क्रिया उठाने या ऊँचा करने का रूपक रखती है और यहाँ पद-प्रतिष्ठा बढ़ाने को दर्शाती है।
- source_word: מַשְׁפִּיל
  choice: नीचा कर देता
  rationale: यह ऊँचा उठाने के विपरीत किसी को नीचे करने या दीन करने को दर्शाता है। यह हिन्दी में स्पष्ट है और साहित्यिक विरोध बनाए रखता है।
theological_decisions:
- issue: नबूकदनेस्सर को महानता देने वाले की पहचान
  choice: मुख्य पाठ में कर्ता को ‘उसने’ के रूप में निहित रखा गया है और पादटिप्पणी में पिछले पद के आधार पर परमेश्वर की ओर संकेत स्पष्ट किया गया है।
  alternative: मुख्य पाठ में सीधे ‘परमेश्वर ने उसे दी थी’ कहना।
  rationale: अरामी पद में कर्ता दोबारा व्यक्त नहीं है, यद्यपि पिछले पद से उसका संदर्भ स्पष्ट है। सर्वनाम मूल की संरचना और संदर्भगत संबंध दोनों को सुरक्षित रखता है।
- issue: राजा के जीवन-मरण और पद देने के अधिकार का स्वरूप
  choice: चारों समानांतर कथनों को बिना नैतिक या धार्मिक टिप्पणी जोड़े सीधे रखा गया है।
  alternative: राजा के कार्यों को स्पष्ट रूप से ‘मनमाने’ या ‘निरंकुश’ कहना।
  rationale: पुनरावृत्त ‘जिसे चाहता’ उसकी व्यापक व्यक्तिगत सत्ता दिखाता है, पर मूल इस पद में कोई अतिरिक्त विशेषण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर वाक्य-विन्यास तथा ‘ऊँचा उठाता/नीचा कर देता’ का विरोध मूल की लय और अर्थ को बनाए रखता है।
