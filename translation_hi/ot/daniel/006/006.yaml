source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ אָֽמְרִ֔ין דִּ֣י לָ֧א נְהַשְׁכַּ֛ח לְ/דָנִיֵּ֥אל דְּנָ֖ה כָּל עִלָּ֑א לָהֵ֕ן הַשְׁכַּ֥חְנָֽה עֲל֖וֹ/הִי בְּ/דָ֥ת אֱלָהֵֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/006.yaml
  text: Then these men said[a], ‘We will not find any charge against this Daniel unless we find it against him in the law of his God.’
translation:
  language: hi
  text: तब इन लोगों ने कहा, “हम इस दानिय्येल के विरुद्ध आरोप लगाने का कोई आधार[a] नहीं पाएँगे, सिवाय इसके कि उसके परमेश्वर की व्यवस्था के संबंध में हमें उसके विरुद्ध कोई आधार मिले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई आरोप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह कालसूचक/क्रमसूचक क्रियाविशेषण कथा में अगले घटनाक्रम को प्रस्तुत करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: उन लोगों
  rationale: मूल का अर्थ ‘इन/उन पुरुषों’ है। हिन्दी कथन में ‘उन लोगों’ संदर्भगत समूह को स्वाभाविक ढंग से व्यक्त करता है और कोई अतिरिक्त पदवी नहीं जोड़ता।
- source_word: דִּי לָא נְהַשְׁכַּח
  choice: हम ... नहीं ढूँढ़ पाएँगे
  rationale: अरामी अपूर्ण क्रिया यहाँ उनकी अपेक्षित असफलता का भाव देती है; यह हिन्दी प्रयोग भविष्यगत निष्कर्ष और असमर्थता, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְדָנִיֵּאל דְּנָה
  choice: इस दानिय्येल के विरुद्ध
  rationale: ‘इस’ संकेतवाचक को बनाए रखता है, जिसमें तिरस्कारपूर्ण या लक्ष्य बनाकर कहने का हल्का भाव हो सकता है; न्यायिक संदर्भ में संबंधसूचक उपसर्ग का स्वाभाविक अर्थ ‘के विरुद्ध’ है।
- source_word: כָּל עִלָּא
  choice: कोई आरोप
  rationale: עִלָּא आरोप लगाने के आधार, कारण या अवसर को दर्शाता है। ‘कोई आरोप’ मुख्य पाठ में संक्षिप्त और न्यायिक संदर्भ के अनुकूल है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: לָהֵן
  choice: जब तक कि ... न
  rationale: यह पहले कथन के एकमात्र अपवाद को प्रस्तुत करता है। हिन्दी में ‘जब तक कि ... न’ उस अपवादात्मक शर्त को सहजता से व्यक्त करता है।
- source_word: הַשְׁכַּחְנָה עֲלוֹהִי
  choice: हम ... उसके विरुद्ध कुछ न ढूँढ़ लें
  rationale: दोहराई गई ‘ढूँढ़ना’ धातु मूल की पुनरुक्ति बनाए रखती है; ‘कुछ’ पहले आए आरोप या आधार की ओर संकेत करता है।
- source_word: בְּדָת אֱלָהֵהּ
  choice: उसके परमेश्वर की व्यवस्था के संबंध में
  rationale: דָת का अर्थ व्यवस्था या विधि है। यहाँ בְ संबंध या क्षेत्र सूचित कर सकता है; ‘के संबंध में’ इस अर्थ को स्पष्ट रखता है, बिना यह कहे कि आरोप स्वयं व्यवस्था के भीतर लिखा हुआ था।
theological_decisions:
- issue: אֱלָהֵהּ का हिन्दी रूप
  choice: उसके परमेश्वर
  alternative: उसके देवता
  rationale: संदर्भ दानिय्येल द्वारा उपासित विशिष्ट परमेश्वर का है। ‘परमेश्वर’ हिन्दी में उस व्यक्तिगत संदर्भ को स्वाभाविक रूप से बताता है, जबकि अरामी मूल से कोई अतिरिक्त सांप्रदायिक दावा नहीं जोड़ा जाता।
- issue: בְּדָת का संबंध
  choice: व्यवस्था के संबंध में
  alternative: व्यवस्था में / व्यवस्था के आधार पर
  rationale: उपसर्ग בְ यहाँ क्षेत्र, संबंध या आधार का भाव दे सकता है। ‘के संबंध में’ इस अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता और यह तनाव बनाए रखता है कि षड्यंत्रकारी दानिय्येल की धार्मिक निष्ठा को आरोप का आधार बनाएँगे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज शैली अपनाई गई है। ‘इस दानिय्येल’ मूल के संकेतवाचक और संभावित तिरस्कारपूर्ण स्वर को बनाए रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में आरोप के तुरंत बाद दिया गया है।
