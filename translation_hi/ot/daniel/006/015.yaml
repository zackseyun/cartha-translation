    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को प्रस्तुत करता है; ‘तब’ स्वाभाविक हिन्दी है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: संदर्भ में यह निश्चित और पहले से पहचाना हुआ राजा है; हिन्दी में ‘राजा’ पर्याप्त रूप से निश्चित है।
- source_word: כְּדִי מִלְּתָא שְׁמַע
  choice: ने वह बात सुनी तो
  rationale: כְּדִי यहाँ कालवाचक उपवाक्य बनाता है और מִלְּתָא का अर्थ ‘बात/वचन/मामला’ हो सकता है; पिछले कथन की ओर संकेत के लिए ‘वह बात’ सहज है।
- source_word: שַׂגִּיא בְּאֵשׁ עֲלוֹהִי
  choice: वह बहुत व्याकुल हुआ
  rationale: यह मुहावरा तीव्र आंतरिक व्यथा या अपने ऊपर अप्रसन्नता व्यक्त कर सकता है। मुख्य पाठ में व्यापक अर्थ ‘बहुत व्याकुल’ रखा गया है और आत्म-निर्देशित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְעַל דָּנִיֵּאל שָׂם בָּל
  choice: उसने दानिय्येल को बचाने का मन बनाया
  rationale: शाब्दिक रूप से ‘दानिय्येल के विषय में हृदय लगाया’; हिन्दी मुहावरे में यह उसे बचाने के दृढ़ निश्चय को व्यक्त करता है।
- source_word: לְשֵׁיזָבוּתֵהּ
  choice: बचाने
  rationale: यह शब्द संकट या दण्ड से मुक्त करने का भाव देता है; यहाँ ‘बचाने’ स्पष्ट और स्वाभाविक है।
- source_word: וְעַד מֶעָלֵי שִׁמְשָׁא
  choice: और सूर्यास्त तक
  rationale: अरामी अभिव्यक्ति सूर्य के ढलने का संकेत करती है; ‘सूर्यास्त तक’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: הֲוָא מִשְׁתַּדַּר
  choice: प्रयास करता रहा
  rationale: परिप्रयुक्त क्रिया-रचना लगातार किए गए प्रयास को दर्शाती है; ‘करता रहा’ उसका कालगत पक्ष बनाए रखता है।
- source_word: לְהַצָּלוּתֵהּ
  choice: उसे छुड़ाने
  rationale: यह भी बचाव या छुटकारे का शब्द है। ‘छुड़ाने’ कानूनी संकट से मुक्त कराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
