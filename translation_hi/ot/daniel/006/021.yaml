source:
  edition: WLC
  text: וּ/כְ/מִקְרְבֵ֣/הּ לְ/גֻבָּ֔/א לְ/דָ֣נִיֵּ֔אל בְּ/קָ֥ל עֲצִ֖יב זְעִ֑ק עָנֵ֨ה מַלְכָּ֜/א וְ/אָמַ֣ר לְ/דָנִיֵּ֗אל דָּֽנִיֵּאל֙ עֲבֵד֙ אֱלָהָ֣/א חַיָּ֔/א אֱלָהָ֗/ךְ דִּ֣י אנתה פָּֽלַֽח לֵ/הּ֙ בִּ/תְדִירָ֔/א הַ/יְכִ֥ל לְ/שֵׁיזָבוּתָ֖/ךְ מִן אַרְיָוָתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/021.yaml
  text: And when he came near the den[a], he cried out to Daniel with a distressed voice. The king spoke and said to Daniel, “Daniel, servant of the living God, has your God, whom you continually serve[c][b], been able to deliver you from the lions?”
translation:
  language: hi
  text: जब वह मांद के पास आया, तो उसने दुखभरी आवाज़ में दानिय्येल को पुकारा। राजा ने दानिय्येल से कहा, “दानिय्येल, जीवित परमेश्वर के सेवक! क्या तुम्हारा परमेश्वर, जिसकी तुम निरन्तर सेवा करते हो, तुम्हें सिंहों से बचा सका?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְמִקְרְבֵהּ
  choice: जब वह ... पास आया
  rationale: अरामी रचना समय-संबंध व्यक्त करती है; यह हिंदी में स्वाभाविक रूप से घटनाक्रम और निकट आने की ठोस गति दोनों को रखती है।
- source_word: גֻבָּא
  choice: मांद
  rationale: सिंहों वाले इस कथानक में ‘मांद’ स्वाभाविक और संदर्भानुकूल है; ‘गड्ढा’ भी संभव है, पर बाड़े के आशय को कम स्पष्ट करता है।
- source_word: בְּקָל עֲצִיב
  choice: दुखभरी आवाज़ में
  rationale: עֲצִיב दुःख, पीड़ा अथवा व्याकुलता व्यक्त करता है; यह चयन राजा की भावनात्मक दशा को सहज आधुनिक हिंदी में बताता है।
- source_word: זְעִק
  choice: पुकारा
  rationale: क्रिया ऊंची और व्याकुल पुकार को सूचित करती है; संदर्भ में ‘पुकारा’ स्वाभाविक है और केवल क्रोधपूर्ण चिल्लाहट का अनावश्यक भाव नहीं जोड़ता।
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: राजा ने ... कहा
  rationale: यह मानक सामी भाषण-सूत्र है। हिंदी में ‘उत्तर देकर कहा’ यहां कृत्रिम लगेगा क्योंकि तत्काल कोई पूर्व कथन नहीं है; संक्षिप्त ‘कहा’ भाषण आरंभ को ठीक से व्यक्त करता है।
- source_word: עֲבֵד אֱלָהָא חַיָּא
  choice: जीवित परमेश्वर के सेवक
  rationale: עֲבֵד सेवक या दास हो सकता है; इस राजकीय-धार्मिक संबोधन में निष्ठावान सेवा का सम्मानसूचक भाव प्रमुख है।
- source_word: דִּי אנתה פָּלַח לֵהּ בִּתְדִירָא
  choice: जिसकी तुम निरन्तर सेवा करते हो
  rationale: פָּלַח धार्मिक सेवा अथवा आराधना सूचित कर सकता है; ‘सेवा’ व्यापक अर्थ और ‘सेवक’ के साथ शब्द-संबंध दोनों बनाए रखती है, जबकि בִּתְדִירָא की निरंतरता भी स्पष्ट रहती है।
- source_word: הַיְכִל לְשֵׁיזָבוּתָךְ
  choice: तुम्हें ... बचा सका
  rationale: प्रश्न बीती रात के बाद परिणाम जानना चाहता है; हिंदी में ‘बचा सका’ पूर्ण हुई परिस्थिति में सामर्थ्य की परीक्षा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִן אַרְיָוָתָא
  choice: सिंहों से
  rationale: यह पूर्वसर्गीय वाक्यांश का सीधा और पर्याप्त अनुवाद है; ‘सिंहों के पंजे से’ जैसा विस्तार स्रोत में नहीं है।
theological_decisions:
- issue: עֲבֵד द्वारा दानिय्येल और परमेश्वर के संबंध का निरूपण
  choice: जीवित परमेश्वर के सेवक
  alternative: जीवित परमेश्वर के दास
  rationale: शब्द में दास का अर्थ संभव है, पर यहां संबोधन दानिय्येल की निष्ठा और समर्पित सेवा को सम्मानपूर्वक चिह्नित करता है; सामाजिक-कानूनी दासता को उभारना संदर्भ से अधिक होगा।
- issue: פָּלַח का अनुवाद
  choice: सेवा करते हो
  alternative: आराधना करते हो
  rationale: धार्मिक संदर्भ निर्विवाद है, फिर भी क्रिया केवल उपासना-विधि तक सीमित नहीं, बल्कि दानिय्येल की सतत निष्ठावान सेवा को व्यक्त करती है। ‘सेवा’ इस व्यापकता और मूल के शब्द-संबंध को सुरक्षित रखती है।
- issue: ईश्वरीय सामर्थ्य पर राजा का प्रश्न
  choice: क्या ... बचा सका?
  alternative: क्या ... बचाने में समर्थ हुआ है?
  rationale: वाक्य को वास्तविक प्रश्न ही रखा गया है; दानिय्येल के बचने को पहले से कथन बनाकर राजा की अनिश्चितता और कथात्मक तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज कथात्मक शैली। ‘परमेश्वर’, ‘सेवक’, ‘निरन्तर’ और ‘सिंह’ बाइबिलीय संदर्भ के अनुकूल परिचित शब्द हैं। मूल की वास्तविक शब्दार्थगत संभावनाओं को निर्णय-टिप्पणियों में दर्ज किया गया है; मुख्य पाठ को अनावश्यक पादटिप्पियों से नहीं भरा गया।
