id: DAN.6.29
reference: Daniel 6:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/דָנִיֵּ֣אל דְּנָ֔ה הַצְלַ֖ח בְּ/מַלְכ֣וּת דָּרְיָ֑וֶשׁ וּ/בְ/מַלְכ֖וּת כּ֥וֹרֶשׁ פרסי/א׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/029.yaml
  text: And this Daniel prospered during the reign of Darius and during the reign of Cyrus the Persian[a].
translation:
  language: hi
  text: और यह दानिय्येल दारा के शासनकाल में और कुस्रू फ़ारसी के शासनकाल में फलता-फूलता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “दारा के शासनकाल में, अर्थात कुस्रू फ़ारसी के शासनकाल में,” यदि दोनों नाम एक ही शासक के लिए समझे जाएँ।
    reason: alternative_reading
lexical_decisions:
- source_word: דְּנָה
  choice: यह
  rationale: यह संकेतवाचक शब्द अभी उल्लिखित दानिय्येल की ओर विशेष रूप से संकेत करता है और अरामी की बलाघातपूर्ण, पुनरारंभिक अभिव्यक्ति को बनाए रखता है।
- source_word: הַצְלַח
  choice: फलता-फूलता रहा
  rationale: यह क्रिया सफल होने या उन्नति करने का अर्थ देती है। यह स्वाभाविक हिन्दी है और अर्थ को केवल भौतिक समृद्धि तक सीमित नहीं करती।
- source_word: בְּמַלְכוּת
  choice: के शासनकाल में
  rationale: शाब्दिक अर्थ 'के राज्य/शासन में' है, पर यहाँ समय-संबंधी भाव प्रमुख है; 'शासनकाल में' इसे स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: דָּרְיָוֶשׁ
  choice: दारा
  rationale: राजा के नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: וּבְמַלְכוּת
  choice: और ... के शासनकाल में
  rationale: स्पष्टता और स्रोत की समानांतर संरचना बनाए रखने के लिए दूसरी पूर्वसर्गीय अभिव्यक्ति भी दोहराई गई है।
- source_word: כּוֹרֶשׁ
  choice: कुस्रू
  rationale: राजा के नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: פרסי
  choice: फ़ारसी
  rationale: यह जातिवाचक/साम्राज्य-संबंधी पद कुस्रू की पहचान बताता है; 'फ़ारसी' आधुनिक हिन्दी में सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: इस पद में दारा और कुस्रू का परस्पर संबंध
  choice: दोनों शासनकालों को पाठ के अनुसार अलग-अलग पदबंधों में रखा गया है, पर यह तय नहीं किया गया कि वे दो क्रमिक शासक थे या एक ही शासक के दो नाम/उपाधियाँ।
  alternative: इसे स्पष्ट रूप से दो क्रमिक शासकों का उल्लेख मानना; अथवा 'दारा, अर्थात फ़ारसी कुस्रू' अनुवाद करके दोनों को एक ही व्यक्ति मानना।
  rationale: अरामी पाठ दोनों नामों के साथ 'शासनकाल में' की समानांतर अभिव्यक्ति देता है। मुख्य पाठ उसी सहज संरचना को रखता है, जबकि संभावित समान-व्यक्ति-पाठ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर रखा गया है। 'फलता-फूलता रहा' सफलता और उन्नति दोनों को व्यक्त करता है; नामों के लिए हिन्दी बाइबल-परंपरा में परिचित 'दारा' और 'कुस्रू' प्रयुक्त हैं।
