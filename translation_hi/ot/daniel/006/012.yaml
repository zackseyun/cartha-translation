source:
  edition: WLC
  text: אֱ֠דַיִן גֻּבְרַיָּ֤/א אִלֵּךְ֙ הַרְגִּ֔שׁוּ וְ/הַשְׁכַּ֖חוּ לְ/דָנִיֵּ֑אל בָּעֵ֥א וּ/מִתְחַנַּ֖ן קֳדָ֥ם אֱלָהֵֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/012.yaml
  text: Then these men came by agreement and found Daniel petitioning and pleading before his God[a][b].
translation:
  language: hi
  text: तब वे पुरुष एक राय होकर आए[a] और उन्होंने दानिय्येल को अपने परमेश्वर के सामने विनती और प्रार्थना करते पाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक साथ इकट्ठे हुए”; इस अरामी क्रिया में मिलकर, एक ही उद्देश्य से कार्य करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रार्थना और विनती करते पाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कालवाचक क्रियाविशेषण कथा में अगली घटना को आगे बढ़ाता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: वे पुरुष
  rationale: संज्ञा और संकेतवाचक पद का यह रूप पहले बताए गए षड्यंत्रकारियों की ओर संकेत करता है।
- source_word: הַרְגִּשׁוּ
  choice: एक राय होकर आए
  rationale: इस प्रसंग में क्रिया का आशय मिलकर और समन्वित उद्देश्य से आने का है; यह अनुवाद उस षड्यंत्रपूर्ण सामूहिकता को व्यक्त करता है और वैकल्पिक ‘एक साथ इकट्ठे हुए’ अर्थ को पाद-टिप्पणी में रखता है।
- source_word: וְהַשְׁכַּחוּ
  choice: और उन्होंने ... पाया
  rationale: यह सामान्य कथात्मक क्रिया किसी को कोई कार्य करते हुए पा लेने को दर्शाती है।
- source_word: לְדָנִיֵּאל
  choice: दानिय्येल को
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; अरामी चिह्न यहाँ प्रत्यक्ष कर्म को सूचित करता है।
- source_word: בָּעֵא
  choice: विनती
  rationale: यह कृदंत माँगने या निवेदन करने की क्रिया बताता है; ‘विनती करना’ प्रार्थना-संदर्भ में सहज और अर्थ-संगत है।
- source_word: וּמִתְחַנַּן
  choice: और प्रार्थना
  rationale: यह कृदंत अनुग्रह अथवा दया के लिए गिड़गिड़ाने/याचना करने का भाव रखता है; मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘प्रार्थना’ और पाद-टिप्पणी में अधिक शाब्दिक विकल्प दिया गया है।
- source_word: קֳדָם
  choice: के सामने
  rationale: इस संबंधबोधक का अर्थ ‘सामने’ या ‘उपस्थिति में’ है।
- source_word: אֱלָהֵהּ
  choice: अपने परमेश्वर
  rationale: संज्ञा के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय है; हिन्दी वाक्य में कर्ता दानिय्येल की ओर स्पष्ट संकेत के लिए ‘अपने’ स्वाभाविक है।
theological_decisions:
- issue: दानिय्येल की प्रार्थना का वर्णन बिना बाद की पारिभाषिक धर्मशास्त्रीय भाषा जोड़े करना
  choice: विनती और प्रार्थना करते
  alternative: माँगते और दया की याचना करते
  rationale: दोनों अरामी कृदंतों का अलग-अलग भाव बनाए रखा गया है, पर कोई ऐसा स्पष्ट कर्म नहीं जोड़ा गया जिसे मूल पाठ सीधे नहीं कहता। अधिक शाब्दिक ‘दया की याचना’ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘एक राय होकर’ समन्वित षड्यंत्र का संकेत देता है, जबकि पाद-टिप्पणियाँ अरामी क्रियाओं की वास्तविक अर्थ-सीमा सुरक्षित रखती हैं।
