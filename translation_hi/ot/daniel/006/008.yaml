  text: אִתְיָעַ֜טוּ כֹּ֣ל סָרְכֵ֣י מַלְכוּתָ֗/א סִגְנַיָּ֤/א וַֽ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ הַדָּֽבְרַיָּ֣/א וּ/פַחֲוָתָ֔/א לְ/קַיָּמָ֤ה קְיָם֙ מַלְכָּ֔/א וּ/לְ/תַקָּפָ֖ה אֱסָ֑ר דִּ֣י כָל דִּֽי יִבְעֵ֣ה בָ֠עוּ מִן כָּל אֱלָ֨הּ וֶֽ/אֱנָ֜שׁ עַד יוֹמִ֣ין תְּלָתִ֗ין לָהֵן֙ מִנָּ֣/ךְ מַלְכָּ֔/א יִתְרְמֵ֕א לְ/גֹ֖ב אַרְיָוָתָֽ/א׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/008.yaml
  text: 'All the high officials of the kingdom[a], the prefects and satraps, the counselors and governors, have agreed together to establish a royal statute and to enforce an injunction: that whoever makes a petition to any god or man for thirty days, except to you, O king[c][b], shall be thrown into the lions’ den.'
translation:
  language: hi
  text: 'राज्य के सभी उच्च अधिकारियों—प्रशासकों, क्षत्रपों, परामर्शदाताओं और राज्यपालों—ने मिलकर यह तय किया है[a] कि एक राजकीय विधान स्थापित किया जाए और एक निषेधाज्ञा को दृढ़ किया जाए[b]: कि जो कोई तीस दिनों तक, हे राजा, तेरे सिवा किसी देवता या मनुष्य से याचना करे[c], उसे सिंहों की माँद में फेंक दिया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ने मिलकर विचार-विमर्श किया है।” अरामी क्रिया संयुक्त विचार-विमर्श के साथ-साथ साझा सहमति पर भी बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “राजकीय राजाज्ञा स्थापित की जाए और निषेध को बाध्यकारी किया जाए।” यहाँ के अरामी कानूनी शब्दों के अर्थ-क्षेत्र में विधान, राजाज्ञा, निषेध और बाध्यकारी आदेश के भाव एक-दूसरे से मिलते हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “किसी देवता या मनुष्य से याचना माँगे।” दोहराव वाली अरामी अभिव्यक्ति का अर्थ औपचारिक रूप से याचना करना है।
    reason: literal_rendering
lexical_decisions:
- source_word: אִתְיָעַטוּ
  choice: ने मिलकर यह सम्मति की है
  rationale: इथपाएल रूप पारस्परिक विचार-विमर्श और साझा निर्णय, दोनों का संकेत देता है; यह हिंदी अभिव्यक्ति दोनों पहलुओं को बनाए रखती है।
- source_word: סָרְכֵי מַלְכוּתָא
  choice: राज्य के सभी उच्च अधिकारियों
  rationale: यह वरिष्ठ राजकीय पदाधिकारियों के लिए व्यापक पदनाम है; आधुनिक हिंदी में यह स्पष्ट और स्वाभाविक है।
- source_word: סִגְנַיָּא
  choice: प्रशासकों
  rationale: यह शाही प्रशासनिक पद है; 'प्रशासक' सामान्य पाठक के लिए स्पष्ट है और पद-सूची में स्वाभाविक बैठता है।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रपों
  rationale: फारसी प्रांतीय शासकों के लिए स्थापित ऐतिहासिक हिंदी शब्द।
- source_word: הַדָּבְרַיָּא
  choice: मंत्रियों
  rationale: यह राजकीय परामर्शदाताओं को सूचित करता है; 'मंत्री' हिंदी में उनकी सलाहकारी और शासकीय भूमिका को संक्षेप में व्यक्त करता है।
- source_word: פַחֲוָתָא
  choice: राज्यपालों
  rationale: प्रांतीय शासकीय पद के लिए स्पष्ट आधुनिक हिंदी समतुल्य।
- source_word: לְקַיָּמָה קְיָם מַלְכָּא
  choice: एक राजकीय विधान स्थापित किया जाए
  rationale: क्रिया-संज्ञा का युग्म विधान को औपचारिक रूप से लागू और स्थिर करने का भाव देता है।
- source_word: וּלְתַקָּפָה אֱסָר
  choice: एक निषेधाज्ञा को बाध्यकारी बनाया जाए
  rationale: वाक्यांश किसी निषेध को कानूनी रूप से दृढ़ और अनिवार्य बनाने का भाव व्यक्त करता है।
- source_word: יִבְעֵה בָעוּ
  choice: कोई विनती करेगा
  rationale: यह औपचारिक रूप से कुछ माँगने की अरामी अभिव्यक्ति है; 'विनती करना' प्रार्थना तक अर्थ को सीमित किए बिना उपयुक्त अर्थ देता है।
- source_word: מִן כָּל אֱלָהּ וֶאֱנָשׁ
  choice: किसी देवता या मनुष्य से
  rationale: अरामी पूर्वसर्ग का मूल अर्थ 'से' है और हिंदी में 'विनती करना' के साथ यह स्वाभाविक भी है, इसलिए स्रोत की संरचना सुरक्षित रहती है।
- source_word: עַד יוֹמִין תְּלָתִין
  choice: अगले तीस दिनों तक
  rationale: यह निषेध की समयावधि को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לָהֵן מִנָּךְ
  choice: तुझे छोड़
  rationale: यह राजा को निषेध का एकमात्र अपवाद बताता है और संबोधन के साथ सहज हिंदी देता है।
- source_word: לְגֹב אַרְיָוָתָא
  choice: सिंहों की माँद में
  rationale: '''गर्त/गड्ढा'' मूल स्थान का बोध करा सकता है, पर प्रचलित और संदर्भानुकूल हिंदी में ''सिंहों की माँद'' स्पष्ट है।'
