base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/023.yaml
  text: My God sent his angel and shut the mouths of the lions[a], and they have not harmed me, because innocence was found in me before him; and also before you, O king[c][b], I have done no harm.
translation:
  language: hi
  text: मेरे परमेश्वर ने अपना स्वर्गदूत[a] भेजा और सिंहों के मुँह बंद कर दिए, और उन्होंने मुझे कोई हानि नहीं पहुँचाई, क्योंकि परमेश्वर के सामने मुझमें निर्दोषता[b] पाई गई; और हे राजा, मैंने आपके सामने भी कोई हानि नहीं की।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूत।” अरामी शब्द किसी मानवीय दूत या स्वर्गदूत, दोनों के लिए प्रयुक्त हो सकता है; यहाँ चमत्कारपूर्ण प्रसंग “स्वर्गदूत” का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “निष्कलंकता” अथवा “शुद्धता।”
    reason: lexical_alternative
  - marker: c
    text: या “मैंने आपके विरुद्ध भी कोई अपराध नहीं किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהִי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष संबंधसूचक रूप को स्पष्ट रखता है और संदर्भ में दानिय्येल के परमेश्वर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְאֲכֵהּ
  choice: अपने स्वर्गदूत
  rationale: शब्द का अर्थ दूत या स्वर्गदूत हो सकता है; चमत्कारपूर्ण उद्धार के संदर्भ में स्वर्गदूत अधिक स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: פֻּם אַרְיָוָתָא
  choice: सिंहों के मुँह
  rationale: स्रोत के सामूहिक पदबंध को सहज हिन्दी बहुवचन में व्यक्त करता है।
- source_word: וְלָא חַבְּלוּנִי
  choice: उन्होंने मुझे कोई हानि नहीं पहुँचाई
  rationale: बहुवचन क्रिया का कर्ता सिंह हैं; यह वाक्यांश शारीरिक क्षति न होने का आशय साफ़ रखता है।
- source_word: זָכוּ
  choice: निर्दोषता
  rationale: न्यायिक और नैतिक संदर्भ में यह 'शुद्धता' की अपेक्षा अधिक उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: הִשְׁתְּכַחַת לִי
  choice: मुझमें ... पाई गई
  rationale: अरामी निष्क्रिय मुहावरे और दानिय्येल में निर्दोषता पाए जाने के भाव को निकटता से सुरक्षित रखता है।
- source_word: וְאַף קֳדָמָיךְ ... חֲבוּלָה לָא עַבְדֵת
  choice: मैंने आपके विरुद्ध भी कोई अपराध नहीं किया
  rationale: राजा के प्रति किए गए अन्याय या हानि के अभाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
theological_decisions:
- issue: מַלְאֲכֵהּ की पहचान
  choice: स्वर्गदूत
  alternative: दूत
  rationale: अलौकिक उद्धार का प्रसंग स्वर्गीय दूत की ओर संकेत करता है, पर पद स्वयं उसकी और विशिष्ट पहचान नहीं बताता।
- issue: זָכוּ का नैतिक-न्यायिक आशय
  choice: निर्दोषता
  alternative: निष्कलंकता या शुद्धता
  rationale: यहाँ दावा सर्वांगीण पापहीनता का नहीं, परमेश्वर के सामने इस आरोप के संबंध में निर्दोष पाए जाने का है; अनुवाद इस संदर्भगत तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'हे राजा' का दरबारी संबोधन सुरक्षित है, जबकि अंतिम खंड को हिन्दी की स्वाभाविक पद-रचना में रखा गया है।
