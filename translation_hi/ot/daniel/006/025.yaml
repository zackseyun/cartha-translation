base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/025.yaml
  text: Then the king commanded[a], and those men who had maliciously accused Daniel were brought and thrown into the lions’ den—they, their sons, and their wives. And before they reached the bottom of the den, the lions overpowered them and crushed all their bones.
translation:
  language: hi
  text: तब राजा ने आज्ञा दी, और जिन पुरुषों ने दुर्भावना से दानिय्येल पर अभियोग लगाया था[a], उन पुरुषों को उनके पुत्रों और उनकी पत्नियों समेत सिंहों की मांद में फेंक दिया गया। वे मांद के तल तक पहुँचे भी न थे कि सिंहों ने उन्हें दबोच लिया और उनकी सारी हड्डियाँ चूर-चूर कर दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी मुहावरे का शाब्दिक अर्थ है, ‘दानिय्येल के टुकड़े खाए’; यहाँ इसका अर्थ है उसके विरुद्ध निंदा करना या दुर्भावना से अभियोग लगाना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַר
  choice: तब राजा ने आज्ञा दी
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहा’ है, पर राजकीय आदेश और उसके तत्काल क्रियान्वयन के संदर्भ में ‘आज्ञा दी’ स्वाभाविक रूप से उसके कार्यगत अर्थ को व्यक्त करता है; ‘तब’ कथा की प्रगति दर्शाता है।
- source_word: וְהַיְתִיו
  choice: उन्हें लाकर
  rationale: कारक रूप बताता है कि उन पुरुषों को आने के लिए बाध्य किया गया अथवा लाया गया; हिन्दी में ‘उन्हें लाकर’ संक्षिप्त और स्वाभाविक है।
- source_word: אֲכַלוּ קַרְצֹוהִי דִּי דָנִיֵּאל
  choice: दानिय्येल पर दुर्भावना से दोष लगाया था
  rationale: अरामी मुहावरे का शाब्दिक अर्थ ‘उसके टुकड़े खाए’ है, किंतु इसका आशय किसी के विरुद्ध निंदापूर्ण या शत्रुतापूर्ण अभियोग लगाना है। ‘दुर्भावना से दोष लगाया’ न्यायिक आरोप और शत्रुता दोनों को बनाए रखता है।
- source_word: וּלְגֹב אַרְיָוָתָא רְמוֹ
  choice: सिंहों की मांद में फेंक दिया गया
  rationale: גּוֹב गड्ढे अथवा मांद को सूचित करता है; इस अध्याय के प्रसंग में ‘मांद’ उपयुक्त है और ‘फेंक दिया गया’ हिंसक दंडात्मक क्रिया को स्पष्ट करता है।
- source_word: אִנּוּן בְּנֵיהוֹן וּנְשֵׁיהוֹן
  choice: उन्हें, उनके पुत्रों और उनकी पत्नियों को
  rationale: मूल पाठ पुरुषों के साथ विशेष रूप से उनके पुत्रों और पत्नियों का उल्लेख करता है। ‘पुत्रों’ कहना ‘बच्चों’ की अपेक्षा अधिक सटीक है।
- source_word: וְלָא מְטוֹ לְאַרְעִית גֻּבָּא
  choice: वे मांद की तलहटी तक पहुँचे भी न थे
  rationale: यह मूल के नकारात्मक-कालिक कथन ‘वे मांद की भूमि/तल तक नहीं पहुँचे थे’ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भी’ आक्रमण की तात्कालिकता पर बल देता है।
- source_word: שְׁלִטוּ בְהוֹן אַרְיָוָתָא
  choice: सिंहों ने उन्हें दबोच लिया
  rationale: क्रिया का भाव उन पर अधिकार या प्रभुत्व पा लेने का है। हिंसक प्रसंग में ‘दबोच लिया’ इसे सहज और सजीव हिन्दी में व्यक्त करता है।
- source_word: וְכָל גַּרְמֵיהוֹן הַדִּקוּ
  choice: उनकी सारी हड्डियाँ चूर-चूर कर दीं
  rationale: मूल में सभी हड्डियों को कुचलने या तोड़ डालने का व्यापक और प्रबल भाव है; ‘चूर-चूर कर दीं’ उसकी तीव्रता और पूर्णता को बनाए रखता है।
theological_decisions:
- issue: अभियोग लगाने वालों के परिवारों का सामूहिक दंड
  choice: ‘उन्हें, उनके पुत्रों और उनकी पत्नियों को’ के रूप में मूल पाठ का स्पष्ट ऐतिहासिक कथन यथावत रखा गया है।
  alternative: इसे सामान्य बनाकर ‘उनके बच्चों’ कहना, परिवार का उल्लेख छोड़ देना, अथवा अनुवाद में नैतिक स्पष्टीकरण जोड़ना।
  rationale: पद राजा के दंड में परिवारों को स्पष्टतः सम्मिलित करता है। अनुवाद न तो इस कठोरता को नरम करता है, न ही पाठ में अनुपस्थित कोई धार्मिक समर्थन या निंदा जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘आज्ञा दी,’ ‘दुर्भावना से दोष लगाया,’ ‘तलहटी,’ और ‘चूर-चूर’ सामान्य पाठक के लिए स्पष्ट हैं। फुटनोट-चिह्न को उसी मुहावरे के बाद रखा गया है जिसकी वह व्याख्या करता है।
