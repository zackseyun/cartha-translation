  text: And over them were three high officials[a], of whom Daniel was one[b], so that these satraps might give account to them and the king might suffer no loss.
translation:
  language: hi
  text: और उनके ऊपर तीन प्रधान अधिकारी थे, जिनमें से एक दानिय्येल था, ताकि ये क्षत्रप उन्हें हिसाब दें[a] और राजा को कोई हानि न हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें प्रतिवेदन प्रस्तुत करें’; अरामी पदबंध प्रशासनिक अर्थ में हिसाब देने या प्रतिवेदन प्रस्तुत करने, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजा को कोई घाटा न हो’; यहाँ आशय संभवतः राजा को होने वाली प्रशासनिक या आर्थिक क्षति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעֵלָּא מִנְּהוֹן
  choice: और उनके ऊपर
  rationale: यह पदबंध क्षत्रपों से ऊँचे प्रशासनिक स्तर को दर्शाता है; ‘उनके ऊपर’ पदानुक्रम का अर्थ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: סָרְכִין תְּלָתָא
  choice: तीन प्रधान अधिकारी
  rationale: यह शब्द क्षत्रपों के ऊपर रखे गए वरिष्ठ निरीक्षकों के लिए है। ‘प्रधान अधिकारी’ उनके ऊँचे पद और प्रशासनिक कार्य को स्पष्ट करता है, बिना किसी आधुनिक राजनीतिक पदनाम को आरोपित किए।
- source_word: דִּי דָנִיֵּאל חַד מִנְּהוֹן
  choice: जिनमें से एक दानिय्येल था
  rationale: यह सापेक्ष उपवाक्य स्पष्ट रूप से बताता है कि दानिय्येल उन तीन अधिकारियों में से एक था।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: ‘क्षत्रप’ इस फ़ारसी प्रशासनिक पद का प्रचलित ऐतिहासिक हिन्दी रूप है और प्राचीन सांस्कृतिक परिवेश को सुरक्षित रखता है।
- source_word: יָהֲבִין לְהוֹן טַעְמָא
  choice: उन्हें हिसाब देते रहें
  rationale: अरामी पदबंध प्रशासनिक रूप से जवाबदेह होने, हिसाब देने या प्रतिवेदन प्रस्तुत करने का भाव रखता है। ‘हिसाब देते रहें’ इस संदर्भ में उत्तरदायित्व को सहज हिन्दी में व्यक्त करता है।
- source_word: וּמַלְכָּא לָא לֶהֱוֵא נָזִק
  choice: ताकि राजा को कोई हानि न हो
  rationale: यहाँ נזק राजकीय हितों को होने वाली क्षति या घाटे को सूचित करता है, जो प्रशासनिक अथवा आर्थिक हो सकता है। ‘हानि’ मूल की व्यापकता बनाए रखता है।
