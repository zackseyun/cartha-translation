- source_word: הַרְגִּשׁוּ עַל
  choice: मिलकर राजा के पास आए
  rationale: क्रिया में सामूहिक, समन्वित और आग्रहपूर्ण कार्रवाई का भाव है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि विरोध या दबाव की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: דַּע מַלְכָּא
  choice: हे राजा, जान ले
  rationale: आज्ञार्थक क्रिया और औपचारिक संबोधन दोनों को वर्तमान, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: דִּי דָת לְמָדַי וּפָרַס
  choice: मादियों और फ़ारसियों का यह कानून है
  rationale: यह साम्राज्य की स्थिर कानूनी प्रथा की ओर अपील है; ‘यह कानून है’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כָל אֱסָר
  choice: जिस किसी निषेधाज्ञा
  rationale: אֱסָר औपचारिक रूप से लगाए गए निषेध या प्रतिबंध को दर्शाता है; ‘निषेधाज्ञा’ कानूनी अर्थ को सटीक रखता है।
- source_word: וּקְיָם
  choice: या विधि
  rationale: यह स्थापित अथवा नियत कानूनी विधान को दर्शाता है; ‘विधि’ पहले पद से भेद रखते हुए व्यापक कानूनी अर्थ देता है।
- source_word: דִּי מַלְכָּא יְהָקֵים
  choice: राजा ... लागू करे
  rationale: क्रिया किसी नियम को स्थापित या प्रभावी करने का भाव देती है; ‘लागू करे’ दोनों कानूनी संज्ञाओं के साथ सहज बैठता है।
- source_word: לָא לְהַשְׁנָיָה
  choice: उसे बदला नहीं जा सकता
  rationale: यह राजकीय विधान की व्यावहारिक अपरिवर्तनीयता को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
