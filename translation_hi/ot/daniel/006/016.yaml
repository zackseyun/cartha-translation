base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/016.yaml
  text: Then these men came by agreement to the king and said to the king[a], "Know, O king[b], that it is a law of the Medes and Persians that any injunction or statute that the king establishes cannot be changed."
translation:
  language: hi
  text: तब ये लोग एकजुट होकर राजा के पास आए और राजा से कहा[a], “हे राजा, जान लें कि मादियों और फ़ारसियों का यह कानून है कि राजा जिस किसी निषेधाज्ञा या विधान को स्थापित करे, उसे बदला नहीं जा सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा के विरुद्ध एकजुट होकर आए।” अरामी क्रिया केवल पास आने के बजाय समन्वित और आग्रहपूर्ण कार्रवाई का भाव भी दे सकती है।
    reason: lexical_alternative
