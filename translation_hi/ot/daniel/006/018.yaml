source:
  edition: WLC
  text: וְ/הֵיתָ֨יִת֙ אֶ֣בֶן חֲדָ֔ה וְ/שֻׂמַ֖ת עַל פֻּ֣ם גֻּבָּ֑/א וְ/חַתְמַ֨/הּ מַלְכָּ֜/א בְּ/עִזְקְתֵ֗/הּ וּ/בְ/עִזְקָת֙ רַבְרְבָנ֔וֹ/הִי דִּ֛י לָא תִשְׁנֵ֥א צְב֖וּ בְּ/דָנִיֵּֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/018.yaml
  text: Then a stone was brought and placed over the mouth of the pit[a], and the king sealed it with his signet ring and with the signet rings of his nobles, so that nothing concerning Daniel might be changed.
translation:
  language: hi
  text: तब एक पत्थर लाया गया और गड्ढे के मुंह पर रख दिया गया। राजा ने अपनी मुहरवाली अंगूठी और अपने सरदारों की मुहरवाली अंगूठियों से उस पर मुहर लगा दी, ताकि दानिय्येल के विषय में कुछ भी[a] बदला न जा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि दानिय्येल के विषय में किया गया निर्णय बदला न जा सके।” अरामी शब्द צְבוּ का अर्थ बात, इच्छा, मंशा या निर्णय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶבֶן חֲדָה
  choice: एक पत्थर
  rationale: अरामी חֲדָה का सामान्य अर्थ ‘एक’ है। हिंदी में ‘एक पत्थर’ स्वाभाविक है और अनावश्यक रूप से ‘केवल एक’ पर बल नहीं देता।
- source_word: וְשֻׂמַת עַל פֻּם גֻּבָּא
  choice: गड्ढे के मुंह पर रख दिया गया
  rationale: פֻּם का शाब्दिक अर्थ ‘मुंह’ है और यहां खुलने की जगह को दर्शाता है; גֻּבָּא गड्ढे या मांद-सदृश खोह को बताता है। ‘गड्ढे का मुंह’ मूल बिंब को बनाए रखता है।
- source_word: וְחַתְמַהּ מַלְכָּא
  choice: राजा ने ... उस पर मुहर लगा दी
  rationale: क्रिया का अर्थ मुहर लगाकर बंद या प्रमाणित करना है। ‘उस पर’ का संकेत प्रसंग में पत्थर अथवा बंद किए गए मुंह की ओर है।
- source_word: בְּעִזְקְתֵהּ
  choice: अपनी मुहरवाली अंगूठी से
  rationale: עִזְקְתָא अंगूठी को दर्शाता है, जो यहां राजकीय मुहर लगाने के साधन के रूप में प्रयुक्त हुई।
- source_word: וּבְעִזְקָת רַבְרְבָנֹוהִי
  choice: अपने सरदारों की मुहरवाली अंगूठियों से
  rationale: רַבְרְבָנִין बड़े पदाधिकारियों, सरदारों या कुलीनों के लिए प्रयुक्त है। ‘सरदार’ दरबारी संदर्भ में सहज और व्यापक है; बहुवचन ‘अंगूठियों’ मूल रूप को दर्शाता है।
- source_word: דִּי לָא תִשְׁנֵא צְבוּ בְדָנִיֵּאל
  choice: ताकि दानिय्येल के विषय में कोई बात बदली न जा सके
  rationale: צְבוּ का अर्थ बात, इच्छा, मंशा या निर्णय हो सकता है। ‘कोई बात’ इस प्रसंग में मूल की व्यापकता और अस्पष्टता को सुरक्षित रखता है।
- source_word: וְהֵיתָיִת
  choice: तब ... लाया गया
  rationale: यह रूप कथा में अगली घटना को आगे बढ़ाता है; ‘तब’ हिंदी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
