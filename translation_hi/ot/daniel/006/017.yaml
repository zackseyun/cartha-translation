base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/017.yaml
  text: Then the king gave the command[a], and they brought Daniel and threw him into the den of lions. The king answered and said to Daniel, “Your God, whom you continually serve[b], he will deliver you.”
translation:
  language: hi
  text: तब राजा ने आज्ञा दी, और वे दानिय्येल को लाकर सिंहों की मांद[a] में फेंक दिया। राजा ने दानिय्येल से कहा, “तेरा परमेश्वर, जिसकी तू निरन्तर सेवा करता है, वही तुझे बचाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंहों के गड्ढे में।”
    reason: अरामी גֻּבָּא का अर्थ गड्ढा, कुण्ड या मांद हो सकता है।
  - marker: b
    text: या, “वही तुझे बचाए!” अरामी कथन को कुछ लोग कामना के रूप में भी समझते हैं, यद्यपि मुख्य पाठ इसे सीधे भविष्यसूचक कथन के रूप में प्रस्तुत करता है।
    reason: क्रियारूप के घोषणात्मक और कामनासूचक अर्थों के बीच सम्भव व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक और क्रमसूचक है।
- source_word: אֲמַר
  choice: आज्ञा दी
  rationale: मूल अर्थ ‘कहा’ है, पर राजकीय प्रसंग में इसके तुरन्त बाद आदेश का पालन होता है; इसलिए ‘आज्ञा दी’ प्रसंगगत भाव को स्पष्ट करता है।
- source_word: וְהַיְתִיו
  choice: लाकर
  rationale: यह ‘आने’ की कारक क्रिया है; अधिकारियों द्वारा दानिय्येल को उपस्थित किए जाने के लिए ‘लाकर’ स्वाभाविक हिन्दी है।
- source_word: וּרְמוֹ
  choice: फेंक दिए
  rationale: क्रिया का अर्थ डालना या फेंकना है; ‘फेंक दिए’ उसके बल और हिंसक क्रिया को बनाए रखता है।
- source_word: לְגֻבָּא דִּי אַרְיָוָתָא
  choice: सिंहों की मांद में
  rationale: शाब्दिक संरचना ‘सिंहों के गड्ढे/मांद में’ है। ‘सिंहों की मांद’ हिन्दी में स्पष्ट और परिचित है, जबकि ‘गड्ढा’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: עָנֵה ... וְאָמַר
  choice: कहा
  rationale: यह सामान्य सामी कथात्मक सूत्र है। हिन्दी में ‘उत्तर देकर कहा’ यहाँ अस्वाभाविक लगेगा क्योंकि कोई प्रत्यक्ष प्रश्न नहीं है; ‘कहा’ उसका संप्रेषणीय कार्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּי אנתה פָּלַח לֵהּ
  choice: जिसकी तू ... सेवा करता है
  rationale: פּלח में देवता की सेवा और उपासना दोनों का भाव हो सकता है। ‘सेवा करता है’ इस व्यापक अर्थ-क्षेत्र को बनाए रखता है।
- source_word: בִּתְדִירָא
  choice: निरन्तर
  rationale: यह शब्द लगातार या नियमित रूप से जारी रहने का भाव देता है; ‘निरन्तर’ दानिय्येल की स्थायी निष्ठा को व्यक्त करता है।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम बलाघात देता है। हिन्दी का ‘वही’ इस जोर को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
- source_word: יְשֵׁיזְבִנָּךְ
  choice: तुझे बचाएगा
  rationale: क्रिया संकट से छुड़ाने या बचाने को दर्शाती है। ‘बचाएगा’ आधुनिक हिन्दी में स्वाभाविक है और तत्काल शारीरिक संकट के अनुकूल है।
theological_decisions:
- issue: राजा के अन्तिम कथन का भाव
  choice: 'घोषणात्मक विश्वास: ‘वही तुझे बचाएगा’'
  alternative: 'कामना या प्रार्थनात्मक भाव: ‘वही तुझे बचाए’'
  rationale: अरामी क्रियारूप को स्वाभाविक रूप से भविष्यसूचक कथन या विश्वास की अभिव्यक्ति माना जा सकता है। फिर भी प्रसंग के कारण इसे कामना के रूप में समझने की सम्भावना मौजूद है; मुख्य पाठ घोषणात्मक अर्थ रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। राजकीय आज्ञा और दानिय्येल को सीधे सम्बोधन के कारण ‘तेरा/तू’ मूल के एकवचन सम्बोधन को बनाए रखते हैं; यह अनादर जोड़ने के बजाय स्रोत की व्याकरणिक निकटता दर्शाता है।
