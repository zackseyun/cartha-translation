  yaml_path: translation/ot/daniel/006/011.yaml
  text: And when Daniel knew that the document had been signed[a], he went to his house. Now the windows in his upper room were open toward Jerusalem, and three times a day he knelt on his knees and prayed and gave thanks before his God[c][b], just as he had been doing before this.
translation:
  language: hi
  text: जब दानिय्येल को मालूम हुआ कि उस लिखित आदेश पर हस्ताक्षर हो चुके थे[a], तब वह अपने घर गया। उसके ऊपरी कमरे की खिड़कियाँ यरूशलेम की ओर खुली थीं[b]। वह दिन में तीन बार घुटने टेककर[c] अपने परमेश्वर के सामने प्रार्थना करता और धन्यवाद देता था, ठीक वैसे ही जैसे वह इससे पहले करता आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लिखित दस्तावेज़ पर विधिवत हस्ताक्षर किए जा चुके थे।” अरामी अभिव्यक्ति किसी आधिकारिक लिखित आदेश के औपचारिक रूप से हस्ताक्षरित अथवा प्रभावी किए जाने को बताती है।
    reason: lexical_alternative
  - marker: b
    text: या “यरूशलेम की ओर मुख किए हुए।” अरामी वाक्यांश निकटतम रूप से खिड़कियों की दिशा बताता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “अपने घुटनों पर”; यह दानिय्येल की प्रार्थना की शारीरिक मुद्रा पर बल देता है।
    reason: cultural_note
