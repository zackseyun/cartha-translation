source:
  edition: WLC
  text: כְּעַ֣ן מַלְכָּ֔/א תְּקִ֥ים אֱסָרָ֖/א וְ/תִרְשֻׁ֣ם כְּתָבָ֑/א דִּ֣י לָ֧א לְ/הַשְׁנָיָ֛ה כְּ/דָת מָדַ֥י וּ/פָרַ֖ס דִּי לָ֥א תֶעְדֵּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/009.yaml
  text: Now[a], O king, establish the injunction and sign the document so that it cannot be changed, according to the law of the Medes and Persians[b], which cannot be revoked.
translation:
  language: hi
  text: अब, हे राजा, इस निषेधाज्ञा को लागू कर और दस्तावेज़ पर हस्ताक्षर कर, ताकि इसे बदला न जा सके[a]—मादियों और फ़ारसियों की उस व्यवस्था के अनुसार, जिसे रद्द नहीं किया जा सकता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिसे बदला न जाए।’ अरामी पाठ इस बात पर बल देता है कि लिखित आदेश को बदला नहीं जाना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जिसे निरस्त नहीं किया जा सकता।’ शाब्दिक अर्थ है, ‘जो बीत नहीं जाती’; यह किसी व्यवस्था के कानूनी रूप से रद्द न हो सकने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: अब
  rationale: यह वार्तालाप को आगे बढ़ाते हुए तत्काल आग्रह व्यक्त करता है। ‘अब’ स्वाभाविक हिन्दी है और इसमें अनावश्यक निष्कर्षसूचक अर्थ नहीं जोड़ता।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: यह प्रत्यक्ष संबोधन है। ‘हे राजा’ राजदरबार के सम्मानपूर्ण संबोधन को स्पष्ट रूप से व्यक्त करता है।
- source_word: תְּקִים
  choice: लागू कर
  rationale: मूल क्रिया का अर्थ स्थापित करना या दृढ़ करना है; कानूनी संदर्भ में ‘लागू कर’ निषेधाज्ञा को प्रभावी बनाने का भाव सहज हिन्दी में देता है।
- source_word: אֱסָרָא
  choice: निषेधाज्ञा
  rationale: यह संदर्भ में प्रस्तावित बाध्यकारी निषेध को दर्शाता है। ‘निषेधाज्ञा’ व्यापक ‘आज्ञा’ या ‘फरमान’ की अपेक्षा प्रतिबंधात्मक कानूनी स्वरूप को अधिक ठीक रखता है।
- source_word: וְתִרְשֻׁם
  choice: और दस्तावेज़ पर हस्ताक्षर कर
  rationale: क्रिया का मूल भाव लिखना या अंकित करना है, पर इस कानूनी संदर्भ में राजा द्वारा लिखित आदेश को औपचारिक मान्यता देना अभिप्रेत है; ‘हस्ताक्षर कर’ आधुनिक हिन्दी में वही प्रशासनिक कार्य स्पष्ट करता है।
- source_word: כְּתָבָא
  choice: दस्तावेज़
  rationale: यह आधिकारिक लिखित सामग्री को सूचित करता है। ‘दस्तावेज़’ उसके लिखित और कानूनी स्वरूप दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דִּי לָא לְהַשְׁנָיָה
  choice: ताकि इसे बदला न जा सके
  rationale: यह लिखित निषेधाज्ञा को अपरिवर्तनीय बनाने का उद्देश्य व्यक्त करता है। हिन्दी वाक्यांश मूल की कानूनी दृढ़ता बनाए रखता है।
- source_word: כְּדָת
  choice: व्यवस्था के अनुसार
  rationale: דָּת कानूनी नियम, विधान या प्रचलित व्यवस्था को दर्शाता है। ‘व्यवस्था’ यहाँ पूरे विधिक नियम को सहज हिन्दी में व्यक्त करती है।
- source_word: מָדַי וּפָרַס
  choice: मादियों और फ़ारसियों
  rationale: यह दोनों जातीय-राजकीय समूहों की विधिक परंपरा का उल्लेख है। पारंपरिक नामों को आधुनिक देवनागरी वर्तनी में रखा गया है।
- source_word: דִּי לָא תֶעְדֵּא
  choice: जिसे रद्द नहीं किया जा सकता
  rationale: शाब्दिक अर्थ ‘जो टलती/बीतती नहीं’ है, पर कानूनी मुहावरे में आशय उसके निरस्त न हो सकने से है। ‘रद्द नहीं किया जा सकता’ सामान्य पाठक के लिए स्पष्ट और सटीक है।
