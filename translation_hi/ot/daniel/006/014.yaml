base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/014.yaml
  text: Then they answered and said before the king[a], “Daniel, who is one of the exiles from Judah, pays no attention to you, O king, or to the injunction that you have signed[c][b], but three times a day he makes his petition.”
translation:
  language: hi
  text: तब उन्होंने राजा के सामने उत्तर देकर कहा, “यहूदा के निर्वासितों में से एक दानियेल न तो आपकी, हे राजा, परवाह करता है[a], न उस निषेधाज्ञा की[b] जिस पर आपने हस्ताक्षर किए हैं; बल्कि वह दिन में तीन बार अपनी विनती प्रस्तुत करता है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपका कोई मान नहीं रखता।’ अरामी मुहावरा शाब्दिक रूप से राजा की ओर ध्यान या आदर न रखने की बात करता है।
    reason: lexical_alternative
  - marker: b
    text: ‘निषेधाज्ञा’ के लिए ‘प्रतिबंध’ या ‘राजकीय निषेध’ भी संभव है। यह शब्द कानूनी रूप से बाध्यकारी मनाही को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वह अपनी विनती माँगता है।’ इसका अर्थ है कि वह अपनी याचना प्रस्तुत करता रहता है। इस उपवाक्य में विनती पाने वाले का स्पष्ट नाम नहीं है, यद्यपि प्रसंग से दानियेल के परमेश्वर का संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक क्रमसूचक अगले घटनाक्रम का परिचय देता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से कथा का प्रवाह बनाए रखता है।
- source_word: עֲנוֹ וְאָמְרִין
  choice: उन्होंने ... उत्तर देकर कहा
  rationale: मूल की सामी भाषाई द्वि-क्रियात्मक वाणी-भूमिका को हिन्दी के स्वाभाविक मुहावरे में दोनों अर्थों सहित रखा गया है।
- source_word: קֳדָם מַלְכָּא
  choice: राजा के सामने
  rationale: קֳדָם उपस्थिति या किसी के सम्मुख होने को व्यक्त करता है; यह चुनाव राजदरबार की औपचारिक स्थिति को बनाए रखता है।
- source_word: דִּי מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: यहूदा से निर्वासित लोगों में से एक
  rationale: בְּנֵי גָלוּתָא निर्वासित समुदाय के सदस्यों के लिए प्रयुक्त मुहावरा है। हिन्दी रूप आरोप लगाने वालों की जातीय-राजनीतिक पहचान कराने वाली भाषा को सुरक्षित रखता है।
- source_word: לָא שָׂם עֲלַיִךְ ... טְעֵם
  choice: आपकी परवाह नहीं करता
  rationale: शाब्दिक रूप से यह किसी पर ध्यान या मान न रखने का मुहावरा है। ‘परवाह नहीं करता’ आधुनिक हिन्दी में उपेक्षा और अवज्ञा की आरोपात्मक शक्ति स्पष्ट करता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: मूल में संबोधन स्पष्ट रूप से दोहराया गया है; इसे रखने से दरबारी संबोधन और आरोप की अलंकारिक तीव्रता बनी रहती है।
- source_word: וְעַל אֱסָרָא דִּי רְשַׁמְתָּ
  choice: और न उस निषेधाज्ञा की जिस पर आपने हस्ताक्षर किए हैं
  rationale: אֱסָרָא यहाँ बाध्यकारी कानूनी निषेध है और רְשַׁמְתָּ औपचारिक रूप से लिखकर अथवा हस्ताक्षर करके लागू करने की ओर संकेत करता है। यह हिन्दी प्रयोग प्रसंग की कानूनी शक्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְזִמְנִין תְּלָתָה בְּיוֹמָא
  choice: बल्कि वह दिन में तीन बार
  rationale: यह प्रतिदिन दोहराई जाने वाली क्रिया बताता है। ‘दिन में तीन बार’ इसका स्वाभाविक हिन्दी समतुल्य है; ‘बल्कि’ आरोप के विरोधात्मक बल को स्पष्ट करता है।
- source_word: בָּעֵא בָּעוּתֵהּ
  choice: अपनी विनती करता है
  rationale: सजातीय क्रिया-संज्ञा अभिव्यक्ति निवेदन करने की क्रिया पर बल देती है। ‘अपनी विनती करता है’ औपचारिक याचना का भाव रखता है और ऐसा प्राप्तकर्ता नहीं जोड़ता जिसका इस उपवाक्य में स्पष्ट उल्लेख नहीं है।
theological_decisions:
- issue: क्या दानियेल की विनती के प्राप्तकर्ता को स्पष्ट रूप से परमेश्वर कहा जाए
  choice: 'प्राप्तकर्ता को अव्यक्त रखना: ‘अपनी विनती करता है’'
  alternative: ‘अपने परमेश्वर से प्रार्थना करता है’ अथवा ‘परमेश्वर से विनती करता है’
  rationale: इस अरामी उपवाक्य में विनती पाने वाले का स्पष्ट उल्लेख नहीं है, यद्यपि निकटवर्ती प्रसंग उसकी पहचान कराता है। मूल से अतिरिक्त शब्द न जोड़ते हुए अनुवाद उस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजदरबार की औपचारिकता के लिए ‘राजा के सामने’ और ‘हे राजा’ बनाए रखे गए हैं। कानूनी पद के लिए अपेक्षाकृत स्पष्ट ‘निषेधाज्ञा’ चुना गया है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
