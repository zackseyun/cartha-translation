translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। ऐतिहासिक प्रशासनिक पद ‘क्षत्रप’ बनाए रखा गया है। सम्बोधन में सम्मानसूचक बहुवचन ‘जीवित रहें’ राजदरबारी संदर्भ के अनुकूल है।
