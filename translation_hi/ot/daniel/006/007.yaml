source:
  edition: WLC
  text: אֱ֠דַיִן סָרְכַיָּ֤/א וַ/אֲחַשְׁדַּרְפְּנַיָּ/א֙ אִלֵּ֔ן הַרְגִּ֖שׁוּ עַל מַלְכָּ֑/א וְ/כֵן֙ אָמְרִ֣ין לֵ֔/הּ דָּרְיָ֥וֶשׁ מַלְכָּ֖/א לְ/עָלְמִ֥ין חֱיִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/007.yaml
  text: 'Then these high officials and satraps came before the king and said this to him: “King Darius[b][a], live forever!”'
translation:
  language: hi
  text: तब ये उच्च अधिकारी और क्षत्रप एक साथ राजा के पास आए[a] और उससे बोले, “राजा दारा, युगों-युगों तक जीवित रहें!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “राजा के सामने इकट्ठे हुए,” “आपसी सहमति से राजा के पास आए,” या “हल्ला करते हुए राजा के पास आए” भी हो सकता है। अरामी मुहावरा उनके समन्वित सामूहिक आगमन पर बल देता है और प्रसंग में षड्यंत्रपूर्ण मंशा का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह राजदरबार में बोली जाने वाली परम्परागत शुभकामना थी; इसका आशय यह नहीं कि राजा सचमुच कभी न मरे।
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह कालवाचक/क्रमसूचक क्रियाविशेषण कथा की अगली घटना आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: סָרְכַיָּא
  choice: उच्च अधिकारी
  rationale: यह साम्राज्य के वरिष्ठ प्रशासनिक पदाधिकारियों का पदनाम है; ‘उच्च अधिकारी’ आधुनिक पाठक को पद की वरिष्ठता स्पष्ट करता है।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: फ़ारसी प्रांतीय शासक या प्रशासक के लिए यह हिन्दी में स्थापित ऐतिहासिक शब्द है और तत्कालीन प्रशासनिक परिवेश बनाए रखता है।
- source_word: אִלֵּן
  choice: ये
  rationale: यह निकटवर्ती संकेतवाचक शब्द पहले उल्लिखित अधिकारियों की ओर संकेत करता है।
- source_word: הַרְגִּשׁוּ עַל
  choice: एक साथ राजा के पास आए
  rationale: अरामी मुहावरा समन्वित सामूहिक आगमन पर बल देता है; यह अनुवाद उस सामूहिकता को रखता है, पर मुख्य पाठ में शोर-शराबे या षड्यंत्र का आशय अनिवार्य नहीं बनाता।
- source_word: וְכֵן אָמְרִין לֵהּ
  choice: और उससे बोले
  rationale: शाब्दिक ‘और इस प्रकार उससे कह रहे थे’ के स्थान पर यह हिन्दी कथन-शैली में स्वाभाविक है और अर्थ पूरा रखता है।
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: राजा दारा
  rationale: सम्बोधन में राजकीय उपाधि और नाम रखा गया है; ‘दारा’ हिन्दी में इस फ़ारसी नाम का प्रचलित रूप है।
- source_word: לְעָלְמִין חֱיִי
  choice: युगों-युगों तक जीवित रहें
  rationale: बहुवचन ‘युगों/कालों तक’ का रूप सुरक्षित रहता है और राजदरबार की परम्परागत शुभकामना स्वाभाविक हिन्दी में व्यक्त होती है।
