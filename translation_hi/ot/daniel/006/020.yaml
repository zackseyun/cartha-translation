- source_word: מַלְכָּא
  choice: राजा
  rationale: निश्चित अर्थ वाला रूप है; प्रसंग में राजा पहले से परिचित पात्र है।
- source_word: בִּשְׁפַּרְפָּרָא
  choice: भोर होते ही
  rationale: शब्द दिन निकलने या बहुत सवेरे का संकेत देता है; ‘होते ही’ सुबह-सुबह की तत्परता भी व्यक्त करता है।
- source_word: יְקוּם
  choice: उठा
  rationale: क्रिया उठने या खड़े होने को बताती है; आधुनिक हिन्दी में ‘उठा’ सहज और सटीक है।
- source_word: בְּנָגְהָא
  choice: पहली रोशनी में
  rationale: यह प्रकाश या उजाला होने से जुड़ी दूसरी समय-सूचक अभिव्यक्ति है। अलग अनुवाद मूल की दो निकटार्थक भोर-अभिव्यक्तियों का बल बनाए रखता है।
- source_word: וּבְהִתְבְּהָלָה
  choice: घबराई हुई जल्दबाज़ी में
  rationale: संज्ञा में शीघ्रता के साथ व्याकुलता या घबराहट की छाया भी है; संयुक्त हिन्दी अभिव्यक्ति दोनों संभावित अर्थों को समेटती है।
- source_word: לְגֻבָּא
  choice: मांद की ओर
  rationale: दानिय्येल 6 के प्रसंग में यह सिंहों के बाड़े या गड्ढेनुमा मांद को दर्शाता है; ‘मांद’ हिन्दी बाइबलीय कथन में स्वाभाविक है।
- source_word: דִי
  choice: की
  rationale: सम्बन्धवाचक कण यहां मांद और सिंहों को जोड़ता है; हिन्दी में सम्बन्धकारक सबसे स्वाभाविक है।
- source_word: אַרְיָוָתָא
  choice: सिंहों
  rationale: बहुवचन निश्चित रूप है; प्रसंग के ज्ञात सिंहों को दर्शाता है।
- source_word: אֲזַל
  choice: गया
  rationale: जाने की सामान्य अरामी क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
