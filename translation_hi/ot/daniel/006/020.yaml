    issue: The two dawn expressions are rendered somewhat awkwardly together.
    rationale: «भोर होते ही, पहली रोशनी में» is semantically understandable, but «भोर में, उजाला होते ही» more naturally represents the paired expressions while preserving their emphatic closeness.
  revised_text: तब राजा भोर में[a], उजाला होते ही, उठा और बड़ी उतावली से[b] सिंहों की मांद की ओर गया।
