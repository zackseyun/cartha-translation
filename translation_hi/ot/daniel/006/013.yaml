base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/013.yaml
  text: 'Then they came near and spoke before the king concerning the king’s injunction: “Did you not sign an injunction that any man who makes a petition to any god or man for thirty days[a], except to you, O king, shall be thrown into the lions’ den?” The king answered and said, “The matter is certain, according to the law of the Medes and Persians[c][b], which cannot be changed.”'
translation:
  language: hi
  text: तब वे राजा के पास आए और राजा के प्रतिबंध[a] के विषय में राजा के सामने बोले, “हे राजा, क्या आपने इस प्रतिबंध पर हस्ताक्षर नहीं किए थे कि तीस दिन तक कोई भी मनुष्य[b] आपको छोड़कर किसी भी देवता या मनुष्य से कोई विनती करे, तो वह सिंहों की मांद में फेंक दिया जाए?” राजा ने उत्तर दिया, “यह बात मादियों और फ़ारसियों की व्यवस्था के अनुसार पक्की है और बदली नहीं जा सकती[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निषेधाज्ञा” अथवा “राजकीय रोक।” अरामी शब्द विशेष रूप से किसी बाध्यकारी निषेध को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “कोई भी मनुष्य” मूल के एकवचन शब्द का अनुवाद है, जिसका इस कानूनी कथन में सामान्य अर्थ है; अनुवाद “कोई भी व्यक्ति” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “निरस्त नहीं की जा सकती” अथवा “हटाई नहीं जा सकती”।
    reason: lexical_alternative
