theological_decisions:
- issue: कानूनी कथन में אֱנָשׁ का सामान्य प्रयोग
  choice: कोई भी मनुष्य
  alternative: कोई भी व्यक्ति; कोई भी जन
  rationale: मूल में एकवचन ‘मनुष्य/व्यक्ति’ सामान्य कानूनी अर्थ में है। हिन्दी ‘मनुष्य’ मूल शब्द का मानवीय और सामान्य विस्तार बनाए रखता है, बिना कथन की सीमा को कृत्रिम रूप से बदलने के।
- issue: אֱסָר का विधिक स्वरूप
  choice: प्रतिबंध
  alternative: राजाज्ञा; निषेधाज्ञा
  rationale: प्रसंग में आदेश का मुख्य बल किसी कार्य पर बाध्यकारी रोक है। ‘प्रतिबंध’ इस विशिष्टता को सामान्य ‘राजाज्ञा’ से अधिक स्पष्ट रखता है।
- issue: मादियों और फ़ारसियों की व्यवस्था की अपरिवर्तनीयता
  choice: बदली नहीं जा सकती
  alternative: निरस्त नहीं की जा सकती; हटाई नहीं जा सकती
  rationale: मूल क्रिया हट जाने या समाप्त होने की व्यापक धारणा रख सकती है। मुख्य पाठ सामान्य अर्थ देता है और पादटिप्पणी वैधानिक विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक और राजकीय-कानूनी रजिस्टर रखा गया है। ‘हे राजा’ दरबारी संबोधन को बनाए रखता है; ‘प्रतिबंध,’ ‘हस्ताक्षर,’ और ‘व्यवस्था’ सामान्य पाठक के लिए स्पष्ट रहते हुए विधिक प्रसंग को व्यक्त करते हैं।
