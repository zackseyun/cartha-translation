  text: אֱדַ֨יִן֙ דָּנִיֵּ֣אל דְּנָ֔ה הֲוָ֣א מִתְנַצַּ֔ח עַל סָרְכַיָּ֖/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֑/א כָּ/ל קֳבֵ֗ל דִּ֣י ר֤וּחַ יַתִּירָא֙ בֵּ֔/הּ וּ/מַלְכָּ֣/א עֲשִׁ֔ית לַ/הֲקָמוּתֵ֖/הּ עַל כָּל מַלְכוּתָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/004.yaml
  text: Then this Daniel distinguished himself above the high officials and the satraps[a], because an extraordinary spirit was in him[b], and the king planned to set him over the whole kingdom.
translation:
  language: hi
  text: तब यह दानियेल प्रधान अधिकारियों और क्षत्रपों से बढ़कर प्रतिष्ठित था, क्योंकि उसमें एक असाधारण आत्मा थी[a]; और राजा उसे सारे राज्य पर नियुक्त करने का विचार कर रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक उत्कृष्ट आत्मा थी।’ यह वाक्यांश दानियेल के असाधारण आंतरिक गुण, बुद्धि या स्वभाव को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘राजा का इरादा उसे सारे राज्य पर नियुक्त करने का था।’
    reason: alternative_rendering
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह कथा में अगले घटनाक्रम का संकेत देने वाला कालवाचक/क्रमवाचक क्रियाविशेषण है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: דָּנִיֵּאל דְּנָה
  choice: यही दानियेल
  rationale: संकेतवाचक शब्द दानियेल पर बल देता है। ‘यही दानियेल’ उस चिह्नित बल को केवल ‘दानियेल’ कहने से बेहतर सुरक्षित रखता है।
- source_word: הֲוָא מִתְנַצַּח
  choice: बढ़कर प्रतिष्ठित होता गया
  rationale: यह रचना दानियेल की निरंतर प्रकट होती श्रेष्ठता को व्यक्त करती है। चयनित पदबंध तुलना और कथानक की प्रगतिशीलता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: סָרְכַיָּא
  choice: प्रधान अधिकारी
  rationale: यह साम्राज्य के उच्च प्रशासनिक अधिकारियों का पद है। ‘प्रधान अधिकारी’ स्पष्ट आधुनिक हिन्दी है और आधुनिक राजनीतिक पद ‘राष्ट्रपति’ जैसे भ्रामक शब्द से बचता है।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: ‘क्षत्रप’ फ़ारसी प्रांतीय शासकीय पद का स्थापित ऐतिहासिक हिन्दी नाम है और सामान्यीकृत ‘राज्यपाल’ की अपेक्षा मूल पदवी की विशिष्टता बनाए रखता है।
- source_word: כָּל־קֳבֵל דִּי
  choice: क्योंकि
  rationale: यह पदबंध दानियेल की श्रेष्ठता का कारण बताता है; ‘क्योंकि’ उसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: רוּחַ יַתִּירָא
  choice: एक असाधारण आत्मा
  rationale: ‘असाधारण’ יַתִּירָא की उत्कृष्टता या विलक्षणता व्यक्त करता है, जबकि ‘आत्मा’ मूल के רוּחַ को सुरक्षित रखकर उसके आशय को केवल योग्यता, स्वभाव या किसी विशेष दैवी पहचान तक सीमित नहीं करता।
- source_word: וּמַלְכָּא עֲשִׁית
  choice: और राजा ने ... योजना बनाई थी
  rationale: यह राजा के विचार, संकल्प या अभिप्राय को बताता है, पूरी हो चुकी नियुक्ति को नहीं। ‘योजना बनाई थी’ उस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לַהֲקָמוּתֵהּ
  choice: उसे ... नियुक्त करने
  rationale: कारक क्रिया का शाब्दिक भाव ‘उसे खड़ा करना’ है, पर यहाँ प्रशासनिक पद पर स्थापित करना अभिप्रेत है; ‘नियुक्त करना’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: עַל כָּל מַלְכוּתָא
  choice: पूरे राज्य के ऊपर
  rationale: यह समूचे राजकीय क्षेत्र पर अधिकार का संकेत देता है। ‘पूरे राज्य के ऊपर’ मूल के व्यापक क्षेत्र और अधिकार-संबंध दोनों को बनाए रखता है।
theological_decisions:
- issue: दानियेल में ‘आत्मा’ का आशय
  choice: मूल की ‘आत्मा’ संबंधी भाषा को बनाए रखते हुए उसे ‘असाधारण आत्मा’ कहना
  alternative: ‘असाधारण योग्यता’, ‘उत्तम चरित्र’ या स्पष्ट रूप से ‘पवित्र आत्मा’ कहना
  rationale: यह पद स्वयं स्पष्ट नहीं करता कि आशय मुख्यतः दानियेल की बुद्धि, स्वभाव, आंतरिक गुण या दैवी सामर्थ्य से है। ‘आत्मा’ बनाए रखने से यह वास्तविक अर्थगत और धर्मवैचारिक खुलापन सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘प्रधान अधिकारी’ प्रशासनिक पद को स्पष्ट करता है, जबकि ऐतिहासिक पदवी ‘क्षत्रप’ को सुरक्षित रखा गया है। ‘यही दानियेल’ मूल संकेतवाचक बल को व्यक्त करता है।
