  text: אֱדַ֨יִן סָֽרְכַיָּ֜/א וַ/אֲחַשְׁדַּרְפְּנַיָּ֗/א הֲו֨וֹ בָעַ֧יִן עִלָּ֛ה לְ/הַשְׁכָּחָ֥ה לְ/דָנִיֵּ֖אל מִ/צַּ֣ד מַלְכוּתָ֑/א וְ/כָל עִלָּ֨ה וּ/שְׁחִיתָ֜ה לָא יָכְלִ֣ין לְ/הַשְׁכָּחָ֗ה כָּ/ל קֳבֵל֙ דִּֽי מְהֵימַ֣ן ה֔וּא וְ/כָל שָׁלוּ֙ וּ/שְׁחִיתָ֔ה לָ֥א הִשְׁתְּכַ֖חַת עֲלֽוֹ/הִי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/005.yaml
  text: Then the high officials and satraps tried to find grounds for accusing Daniel in matters of the kingdom, but they could find no grounds for accusation or corruption, because he was trustworthy[a], and no negligence[b] or corruption could be found against him.
translation:
  language: hi
  text: तब वे उच्च अधिकारी और क्षत्रप राजकाज के मामलों में दानिय्येल पर दोष लगाने का कोई आधार ढूँढ़ने लगे; पर वे उसके विरुद्ध दोष लगाने का कोई आधार या भ्रष्ट आचरण नहीं पा सके, क्योंकि वह भरोसेमंद[a] था, और उसके विरुद्ध कोई लापरवाही[b] या भ्रष्ट आचरण नहीं पाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्य” या “निष्ठावान”; अरामी शब्द यहाँ पद पर दानिय्येल की भरोसेमंद कार्यशैली बताता है।
    reason: lexical_alternative
  - marker: b
    text: या “चूक,” “त्रुटि” अथवा “असावधानी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह कालक्रम और कथा में अगले घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סָרְכַיָּא
  choice: उच्च अधिकारी
  rationale: यह शाही प्रशासन के वरिष्ठ पदाधिकारियों के लिए स्पष्ट आधुनिक पद है और अनावश्यक रूप से किसी विशिष्ट बाद की नौकरशाही संरचना को नहीं मानता।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: फ़ारसी प्रांतीय शासकों का स्थापित ऐतिहासिक पदनाम होने के कारण यह मूल परिवेश को बनाए रखता है।
- source_word: בָעַיִן ... לְהַשְׁכָּחָה
  choice: ढूँढ़ने लगे
  rationale: यह जारी प्रयास को सहज हिन्दी में व्यक्त करता है; आशय है कि वे ऐसा आधार खोज रहे थे।
- source_word: עִלָּה
  choice: दोष लगाने का कोई आधार
  rationale: शब्द किसी सिद्ध औपचारिक आरोप से अधिक आरोप लगाने के बहाने या आधार को सूचित करता है।
- source_word: מִצַּד מַלְכוּתָא
  choice: राजकाज के मामलों में
  rationale: यह उस क्षेत्र को स्पष्ट करता है जिसमें वे दानिय्येल के विरुद्ध आधार खोज रहे थे—राज्य का प्रशासन।
- source_word: שְׁחִיתָה
  choice: भ्रष्ट आचरण
  rationale: प्रशासनिक संदर्भ में यह भ्रष्ट या हानिकारक कदाचार को स्पष्ट रूप से व्यक्त करता है।
- source_word: מְהֵימַן
  choice: भरोसेमंद
  rationale: यह दानिय्येल की पद संबंधी विश्वसनीयता और निष्ठापूर्ण आचरण को व्यक्त करता है, बिना शब्द को अनिवार्य रूप से धार्मिक अर्थ देने के।
- source_word: שָׁלוּ
  choice: लापरवाही
  rationale: यह प्रशासनिक चूक, त्रुटि या असावधानी की अर्थ-सीमा में संदर्भानुकूल मुख्य विकल्प है।
- source_word: הִשְׁתְּכַחַת עֲלֹוהִי
  choice: उसके विरुद्ध ... नहीं पाया गया
  rationale: 'यह अरामी पूर्वसर्ग की न्यायिक दिशा को बनाए रखता है: खोजी गई बात दानिय्येल के विरुद्ध आरोप का आधार होती।'
theological_decisions:
- issue: दानिय्येल की विश्वसनीयता का स्वरूप
  choice: भरोसेमंद
  alternative: विश्वासयोग्य / निष्ठावान
  rationale: संदर्भ दानिय्येल के शासकीय पद पर भरोसेमंद आचरण का है। यह चुनाव नैतिक वजन बनाए रखता है, पर अनावश्यक रूप से कोई विशिष्ट धार्मिक दावा आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। “राजकाज” प्रशासनिक संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है; “क्षत्रप” ऐतिहासिक पदनाम को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
