  yaml_path: translation/ot/daniel/006/019.yaml
  text: Then the king went to his palace and spent the night fasting; no entertainment was brought before him[a], and sleep fled from him.
translation:
  language: hi
  text: तब राजा अपने महल में गया और उसने उपवास करते हुए रात बिताई। उसके सामने मनोरंजन के लिए कुछ भी नहीं लाया गया[a], और उसकी नींद उड़ गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने कोई गायक-वादक नहीं लाया गया।” अरामी शब्द का अर्थ अनिश्चित है; यह विशेष रूप से मनोरंजन करनेवालों या मन बहलाने के साधनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
