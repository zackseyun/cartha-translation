- source_word: וּבָת טְוָת
  choice: उसने उपवास करते हुए रात बिताई
  rationale: यह पदबंध रात उपवास में बिताने का भाव देता है; यह हिन्दी रूप अर्थ और वाक्य-प्रवाह दोनों को बनाए रखता है।
- source_word: וְדַחֲוָן
  choice: मनोरंजन की कोई चीज़
  rationale: इस दुर्लभ अरामी शब्द का सटीक अर्थ अनिश्चित है और इसे मनोरंजन, मन बहलाव या गायक-बजानेवालों से जोड़ा गया है। व्यापक हिन्दी अभिव्यक्ति किसी एक संकीर्ण अर्थ को निर्णायक नहीं बनाती।
- source_word: לָא הַנְעֵל קָדָמוֹהִי
  choice: उसके सामने ... नहीं लाई गई
  rationale: कारक रूप का प्रसंगानुकूल निष्क्रिय अनुवाद राजा की उपस्थिति में कुछ न लाए जाने को स्पष्ट करता है।
- source_word: וְשִׁנְתֵּהּ נַדַּת עֲלוֹהִי
  choice: और उसकी नींद उड़ गई
  rationale: यह स्वाभाविक हिन्दी मुहावरा नींद के उससे दूर चले जाने की अरामी चित्रात्मकता को बनाए रखता है।
