base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/024.yaml
  text: Then the king was very glad because of him[a], and he ordered that Daniel be brought up from the pit. So Daniel was brought up from the pit, and no kind of harm was found on him[b], because he had trusted in his God.
translation:
  language: hi
  text: तब राजा उसके कारण बहुत प्रसन्न हुआ और उसने आदेश दिया कि दानिय्येल को गड्ढे[a] में से बाहर निकाला जाए। फिर दानिय्येल को गड्ढे में से बाहर निकाला गया, और उस पर किसी भी प्रकार की चोट नहीं पाई गई, क्योंकि उसने अपने परमेश्वर पर भरोसा रखा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मांद’। अरामी संज्ञा गड्ढे जैसे घेरे को दर्शाती है; इस प्रसंग में यह सिंहों की मांद है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने परमेश्वर पर विश्वास किया था’। अरामी क्रिया का अर्थ ‘भरोसा रखना’ या ‘विश्वास करना’ हो सकता है; यहाँ ‘भरोसा रखा था’ व्यक्तिगत निर्भरता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को क्रम में प्रस्तुत करता है; ‘तब’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: שַׂגִּיא טְאֵב עֲלוֹהִי
  choice: राजा उसके कारण बहुत प्रसन्न हुआ
  rationale: यह वाक्यांश राजा की अत्यधिक प्रसन्नता और दानिय्येल को उसका कारण या अवसर होने—दोनों को व्यक्त करता है।
- source_word: וּלְדָנִיֵּאל אֲמַר לְהַנְסָקָה
  choice: उसने आदेश दिया कि दानिय्येल को ... ऊपर निकाला जाए
  rationale: शाब्दिक रूप में ‘कहा’ है, पर आगामी कारक infinitive संदर्भ में आदेश का भाव देता है; ‘ऊपर निकाला जाए’ गड्ढे से बाहर लाने की दिशा को बनाए रखता है।
- source_word: גֻּבָּא
  choice: गड्ढे
  rationale: अरामी संज्ञा गड्ढे जैसे घेरे को बताती है। प्रसंग में यह सिंहों की मांद है, पर ‘गड्ढा’ मूल स्थान-रूप और ‘ऊपर निकालने’ की छवि को अधिक सीधे रखता है।
- source_word: וְכָל חֲבָל לָא הִשְׁתְּכַח בֵּהּ
  choice: उस पर किसी भी प्रकार की चोट नहीं पाई गई
  rationale: ‘किसी भी प्रकार की’ כָּל की व्यापकता व्यक्त करता है; ‘चोट’ यहाँ חֲבָל का प्रसंगानुकूल अर्थ है और ‘पाई गई’ मूल की जाँच-सदृश अभिव्यक्ति को बनाए रखता है।
- source_word: דִּי הֵימִן בֵּאלָהֵהּ
  choice: क्योंकि उसने अपने परमेश्वर पर भरोसा रखा था
  rationale: דִּי कारण बताता है और הֵימִן विश्वास अथवा भरोसे का अर्थ दे सकता है। ‘भरोसा रखा था’ इस प्रसंग में व्यक्तिगत निर्भरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दानिय्येल के बचाए जाने का कारण
  choice: क्योंकि उसने अपने परमेश्वर पर भरोसा रखा था
  alternative: क्योंकि उसने अपने परमेश्वर पर विश्वास किया था
  rationale: मूल पाठ दानिय्येल की सुरक्षित दशा को उसके परमेश्वर पर विश्वास/भरोसे से स्पष्ट रूप से जोड़ता है। अनुवाद इस कारण-संबंध को रखता है, पर यह नहीं बताता कि उद्धार का कोई विस्तृत धार्मिक तंत्र या अर्जित योग्यता यहाँ सिखाई गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर’ सामान्य बाइबलीय हिन्दी के अनुरूप है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के ठीक बाद रखे गए हैं; अंग्रेज़ी परामर्श-पाठ में पहले चिह्न की स्थिति और उसकी पादटिप्पणी में असंगति थी, जिसे मूल अरामी के अनुसार सुधारा गया है।
