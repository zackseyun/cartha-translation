base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/026.yaml
  text: 'Then King Darius wrote to all the peoples[a], nations[b], and languages that dwell in all the earth: “May your peace abound.”'
translation:
  language: hi
  text: 'तब राजा दारा ने सारी पृथ्वी[b] पर रहनेवाले सब लोगों, राष्ट्रों और भाषाओं को लिखा: “तुम्हारी शांति बहुत बढ़े।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा कुशल-मंगल बहुत बढ़े।”
    reason: lexical_alternative
  - marker: b
    text: “सारी पृथ्वी” अरामी शब्दावली को दर्शाता है; इस प्रसंग में इसका आशय दारा के साम्राज्य के पूरे विस्तार से है।
    reason: cultural_note
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथासूचक पद अगले क्रमिक प्रसंग को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: राजा दारा
  rationale: हिन्दी की स्वाभाविक पद-रचना में राजकीय उपाधि नाम से पहले आती है।
- source_word: כְּתַב
  choice: लिखा
  rationale: मूल क्रिया सीधे लिखने का कार्य बताती है; इसे ‘आज्ञा जारी की’ कहकर अधिक विशिष्ट नहीं बनाया गया।
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: सब लोगों, जातियों और भाषाओं के नाम
  rationale: यह दानिय्येल में साम्राज्य की विविध प्रजा के लिए प्रयुक्त पारंपरिक त्रिक है। ‘भाषाओं’ को शाब्दिक रूप में रखा गया है, जबकि ‘के नाम’ हिन्दी में पत्र के प्राप्तकर्ताओं को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דִּי דארין
  choice: रहनेवाले
  rationale: यह सम्बंधवाचक सहभागी रूप सम्बोधित समुदायों का वर्णन करता है; ‘रहनेवाले’ आधुनिक हिन्दी में सहज है।
- source_word: בְּכָל אַרְעָא
  choice: सारी पृथ्वी पर
  rationale: אַרְעָא का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है। मुख्य पाठ में राजकीय उद्घोषणा की व्यापक शब्दावली रखी गई है; साम्राज्यगत संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שְׁלָמְכוֹן יִשְׂגֵּא
  choice: तुम्हारी शान्ति बढ़ती रहे
  rationale: שְׁלָם शान्ति और कुशल-मंगल दोनों को समेटता है, और יִשְׂגֵּא वृद्धि की शुभकामना व्यक्त करता है। यह अनुवाद सम्बोधन के बहुवचन को भी स्पष्ट रखता है।
