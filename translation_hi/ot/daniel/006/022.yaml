  language: hi
  text: तब दानिय्येल ने राजा से कहा, “हे राजा[a], आप सदा जीवित रहें!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अरामी में यह एक परंपरागत राजकीय शुभकामना है: “राजा सदा जीवित रहे!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक क्रियाविशेषण घटनाओं का क्रम दिखाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: דָּנִיֶּאל
  choice: दानिय्येल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: עִם
  choice: से
  rationale: इसका मूल अर्थ ‘के साथ’ है, पर बोलने की क्रिया के साथ यह संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘राजा से कहा’ अधिक स्वाभाविक है।
- source_word: מַלִּל
  choice: कहा
  rationale: इस क्रिया का अर्थ ‘बोला/कहा’ है। ‘कहा’ हिन्दी में संबोधन का सहज परिचय देता है और मूल में अनुपस्थित ‘उत्तर दिया’ नहीं जोड़ता।
- source_word: מַלְכָּא
  choice: राजा
  rationale: पहला प्रयोग निश्चित संज्ञा के रूप में बोलने के संबोधित व्यक्ति को दर्शाता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: दूसरा प्रयोग प्रत्यक्ष संबोधन है; ‘हे राजा’ उसके सम्मानपूर्ण और औपचारिक स्वर को बनाए रखता है।
- source_word: לְעָלְמִין
  choice: सदा
  rationale: यह दीर्घकालिक अथवा निरंतर अवधि का मुहावरा है; राजकीय शुभकामना में ‘सदा’ स्वाभाविक हिन्दी है।
- source_word: חֱיִי
  choice: आप ... जीवित रहें
  rationale: रूप आज्ञार्थक है, पर यहाँ परंपरागत शुभकामना के रूप में इच्छार्थक भाव रखता है। सम्मानसूचक ‘आप ... रहें’ हिन्दी में वही भाव स्वाभाविक ढंग से व्यक्त करता है।
