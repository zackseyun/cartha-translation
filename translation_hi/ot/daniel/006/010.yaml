    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इस कारण
  rationale: यह अरामी मुहावरा पिछली घटना के परिणाम या कारण को व्यक्त करता है; ‘इस कारण’ आधुनिक हिन्दी में उसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: מַלְכָּא דָּרְיָוֶשׁ
  choice: राजा दारा
  rationale: राजकीय उपाधि और नाम को हिन्दी के स्वाभाविक क्रम में रखा गया है; ‘दारा’ हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप है।
- source_word: רְשַׁם
  choice: पर हस्ताक्षर कर दिए
  rationale: मूल क्रिया का सामान्य अर्थ लिखना या दर्ज करना है, पर इस विधिक प्रसंग में राजा द्वारा दस्तावेज़ को औपचारिक रूप से प्रभावी करने का भाव है; ‘हस्ताक्षर कर दिए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּתָבָא
  choice: दस्तावेज़
  rationale: यह संज्ञा किसी लिखित पाठ या दस्तावेज़ को दर्शाती है; ‘दस्तावेज़’ विधिक संदर्भ में स्पष्ट है और मूल से अधिक विशिष्ट नहीं होता।
- source_word: וֶאֱסָרָא
  choice: और निषेधाज्ञा
  rationale: यह शब्द बाध्यकारी निषेध या रोक को दर्शाता है; ‘निषेधाज्ञा’ उसकी औपचारिक कानूनी शक्ति को स्पष्ट रूप से व्यक्त करती है।
