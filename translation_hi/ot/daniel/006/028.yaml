lexical_decisions:
- source_word: מְשֵׁיזִב וּמַצִּל
  choice: बचाता और छुड़ाता है
  rationale: दोनों निकटार्थक अरामी क्रियाओं को अलग-अलग हिन्दी क्रियाओं से रखा गया है; पहली रक्षा/उबारने और दूसरी संकट से छुड़ाने का भाव देती है।
- source_word: וְעָבֵד אָתִין וְתִמְהִין
  choice: और ... चिन्ह और अद्भुत काम करता है
  rationale: עבד का स्वाभाविक अर्थ ‘करता है’ है; ‘चिन्ह’ और ‘अद्भुत काम’ क्रमशः אָתִין और תִמְהִין का स्पष्ट, सामान्य हिन्दी रूप हैं।
- source_word: בִּשְׁמַיָּא וּבְאַרְעָא
  choice: आकाश और पृथ्वी पर
  rationale: अरामी स्थानवाचक संरचना को सहज हिन्दी में व्यक्त करता है और दोनों क्षेत्रों की व्यापकता बनाए रखता है।
- source_word: מִן יַד אַרְיָוָתָא
  choice: सिंहों के पंजे से
  rationale: शाब्दिक ‘सिंहों के हाथ से’ हिन्दी में अस्वाभाविक है; पशुओं के संदर्भ में ‘पंजे’ वही शक्ति/कब्जे का सजीव रूपक बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य का संबंध
  choice: —उसी ने दानिय्येल को ... बचाया है
  alternative: जो दानिय्येल को ... बचाता है
  rationale: अरामी דִּי पहले वर्णित परमेश्वर की पहचान उसके ऐतिहासिक उद्धारकारी कार्य से कराता है। ‘उसी ने’ इस संबंध को स्पष्ट करता है, बिना किसी अतिरिक्त धार्मिक निष्कर्ष के।
