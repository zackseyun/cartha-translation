reference: Daniel 6:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִן קֳדָמַ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י בְּ/כָל שָׁלְטָ֣ן מַלְכוּתִ֗/י לֶהֱוֺ֤ן זאעין וְ/דָ֣חֲלִ֔ין מִן קֳדָ֖ם אֱלָהֵ֣/הּ דִּי דָֽנִיֵּ֑אל דִּי ה֣וּא אֱלָהָ֣/א חַיָּ֗/א וְ/קַיָּם֙ לְ/עָ֣לְמִ֔ין וּ/מַלְכוּתֵ/הּ֙ דִּֽי לָ֣א תִתְחַבַּ֔ל וְ/שָׁלְטָנֵ֖/הּ עַד סוֹפָֽ/א־׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/027.yaml
  text: A decree is issued by me[a], that in all the dominion of my kingdom people are to tremble and fear before the God of Daniel, for he is the living God, enduring forever; and his kingdom will not be destroyed[c][b], and his dominion will be to the end.
translation:
  language: hi
  text: मेरी ओर से यह आज्ञा दी जाती है कि मेरे राज्य के पूरे अधिकार-क्षेत्र में लोग दानिय्येल के परमेश्वर के सामने थरथराएँ और भय मानें, क्योंकि वही जीवित परमेश्वर है और सदा बना रहता है; उसका राज्य कभी नष्ट नहीं होगा, और उसका प्रभुत्व अन्त तक बना रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִן קֳדָמַי שִׂים טְעֵם
  choice: मेरी ओर से यह आज्ञा दी जाती है
  rationale: राजकीय आदेश के अरामी मुहावरे को औपचारिक किंतु स्वाभाविक हिन्दी में व्यक्त करता है और आदेश के राजा की ओर से जारी होने का भाव बनाए रखता है।
- source_word: בְּכָל שָׁלְטָן מַלְכוּתִי
  choice: मेरे राज्य के पूरे अधिकार-क्षेत्र में
  rationale: שָׁלְטָן यहाँ शासन के भौगोलिक और राजकीय विस्तार को सूचित करता है; ‘अधिकार-क्षेत्र’ इस दोहरे भाव को स्पष्ट हिन्दी में रखता है।
- source_word: לֶהֱוֺן זאעין וְדָחֲלִין
  choice: लोग ... थरथराएँ और भय मानें
  rationale: दोनों प्रबल अरामी पदों को अलग-अलग बनाए रखकर विस्मय और भय की तीव्रता सुरक्षित रखी गई है।
- source_word: מִן קֳדָם אֱלָהֵהּ דִּי דָנִיֵּאל
  choice: दानिय्येल के परमेश्वर के सामने
  rationale: संबंधवाचक संरचना और परमेश्वर के सम्मुख होने का भाव सीधे तथा स्वाभाविक रूप में व्यक्त होता है।
- source_word: דִּי הוּא אֱלָהָא חַיָּא
  choice: क्योंकि वही जीवित परमेश्वर है
  rationale: सर्वनाम की बलात्मकता को ‘वही’ से व्यक्त किया गया है और जीवित परमेश्वर की उद्घोषणा यथावत रखी गई है।
- source_word: וְקַיָּם לְעָלְמִין
  choice: और सदा बना रहता है
  rationale: קַיָּם के स्थायित्व और निरंतर अस्तित्व—दोनों भावों को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַלְכוּתֵהּ דִּי לָא תִתְחַבַּל
  choice: उसका राज्य कभी नष्ट नहीं होगा
  rationale: अरामी क्रिया के विनाश या बरबादी के प्रसंगगत अर्थ को स्पष्ट रूप से व्यक्त करता है; ‘कभी’ नकार की स्थायी व्यापकता को स्वाभाविक हिन्दी में बताता है।
- source_word: וְשָׁלְטָנֵהּ עַד סוֹפָא
  choice: उसका प्रभुत्व अन्त तक बना रहेगा
  rationale: ‘प्रभुत्व’ शासन-सत्ता को व्यक्त करता है और ‘अन्त तक बना रहेगा’ स्रोत की संक्षिप्त, कुछ हद तक खुली कालगत अभिव्यक्ति को पठनीय रूप देता है।
theological_decisions:
- issue: दानिय्येल के परमेश्वर के प्रति आदेशित प्रतिक्रिया
  choice: थरथराएँ और भय मानें
  alternative: श्रद्धा रखें और भय मानें
  rationale: मूल के दोनों शब्द तीव्र भय और विस्मय व्यक्त करते हैं। ‘श्रद्धा’ कहना पहले शब्द की शक्ति को कम करके उसका अर्थ व्याख्यात्मक रूप से नरम कर देता।
- issue: परमेश्वर और उसके राज्य की स्थायित्व-संबंधी घोषणा
  choice: वही जीवित परमेश्वर है और सदा बना रहता है; उसका राज्य कभी नष्ट नहीं होगा
  alternative: वह जीवित और सनातन परमेश्वर है; उसका राज्य अविनाशी है
  rationale: चुना गया रूप मूल के पृथक कथनों और क्रियात्मक भाषा को बनाए रखता है तथा ‘सनातन’ या ‘अविनाशी’ जैसे संक्षेपी धर्मवैज्ञानिक पदों से अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: עַד סוֹפָא का कालगत आशय
  choice: अन्त तक बना रहेगा
  alternative: उसका प्रभुत्व अनन्त है
  rationale: मूल में ‘अन्त तक’ है; सीधे ‘अनन्त’ कहने से स्रोत की अभिव्यक्ति में निहित औपचारिक अस्पष्टता समाप्त हो सकती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, राजकीय घोषणा के अनुरूप गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परमेश्वर’, ‘राज्य’ और ‘प्रभुत्व’ बाइबलीय प्रसंग के परिचित शब्द हैं; अनावश्यक संस्कृतनिष्ठता और साम्प्रदायिक शब्दावली से बचा गया है।
