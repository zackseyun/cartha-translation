base_translation:
  language: en
  yaml_path: translation/ot/daniel/006/001.yaml
  text: And Darius the Mede received the kingdom[a], being about sixty-two years old.
translation:
  language: hi
  text: और मादी दारा ने राज्य प्राप्त किया[a]। उस समय वह लगभग बासठ वर्ष का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राज्य अपने अधिकार में लिया।” अरामी क्रिया का अर्थ अधिक व्यापक रूप में भी लिया जा सकता है, पर “प्राप्त किया” मूल शब्दावली को अधिक निकटता से दर्शाता है और यह निश्चित नहीं करता कि दारा ने किस प्रकार राज्य पाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/דָרְיָוֶשׁ
  choice: और दारा
  rationale: संयोजक וְ को सरलता से “और” कहा गया है, जिससे कथा की कड़ी बनी रहती है और उसके संबंध की अनावश्यक व्याख्या नहीं होती। नाम का प्रचलित हिन्दी रूप “दारा” रखा गया है।
- source_word: מָדָיָא
  choice: मादी
  rationale: यह जातिवाचक पद दारा की मादी पहचान बताता है; “मादी” आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और संक्षिप्त है।
- source_word: קַבֵּל
  choice: प्राप्त किया
  rationale: अरामी क्रिया का सामान्य अर्थ “पाना/प्राप्त करना” है। “प्राप्त किया” सत्ता मिलने की रीति—विजय, उत्तराधिकार या नियुक्ति—को निर्धारित किए बिना मूल कथन की सीमितता बनाए रखता है।
- source_word: מַלְכוּתָא
  choice: राज्य
  rationale: यहाँ शब्द राजकीय शासन या अधिकार के क्षेत्र को सूचित करता है। कथा के संदर्भ में “राज्य” सबसे स्वाभाविक हिन्दी रूप है, यद्यपि “राजसत्ता” भी संभव है।
- source_word: כְּבַר שְׁנִין
  choice: उस समय वह लगभग … वर्ष का था
  rationale: शाब्दिक रूप से “लगभग … वर्षों का पुत्र” वाली अरामी आयु-अभिव्यक्ति को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में दिया गया है; “लगभग” अनुमान का भाव सुरक्षित रखता है।
- source_word: שִׁתִּין וְתַרְתֵּין
  choice: बासठ
  rationale: “साठ और दो” को मानक आधुनिक हिन्दी संख्या “बासठ” के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: दारा के राज्यारोहण का स्वरूप
  choice: राज्य प्राप्त किया
  alternative: राज्य अपने अधिकार में लिया
  rationale: “प्राप्त किया” अरामी के निकट रहते हुए यह तय नहीं करता कि दारा ने राज्य विजय, उत्तराधिकार या नियुक्ति से पाया था। इस प्रकार ऐतिहासिक और व्याख्यात्मक प्रश्न को पाठ से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आयु-सूचक अरामी मुहावरे का शब्दशः अनुवाद करने के बजाय स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
