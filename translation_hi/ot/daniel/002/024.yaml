base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/024.yaml
  text: 'Therefore Daniel went in to Arioch[a], whom the king had appointed to destroy the wise men of Babylon. He went and said this to him: “Do not destroy the wise men of Babylon. Bring me in before the king[b], and I will show the interpretation to the king.”'
translation:
  language: hi
  text: इसलिए दानिय्येल अर्योक के पास गया, जिसे राजा ने बाबेल के बुद्धिमानों को नष्ट करने के लिए नियुक्त किया था। उसने जाकर उससे इस प्रकार कहा, “बाबेल के बुद्धिमानों को नष्ट मत कर[a]। मुझे राजा के सामने ले चल, और मैं राजा को इसका अर्थ बताऊँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मार मत डाल।” अरामी क्रिया का अर्थ किसी को नष्ट करना या मरवा डालना हो सकता है; यहाँ बुद्धिमानों के मृत्युदण्ड का आदेश संदर्भ में है।
    reason: lexical_alternative
  - marker: b
    text: या “मैं राजा को इसका अर्थ ज्ञात कराऊँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इसलिए
  rationale: यह अरामी कारणसूचक और कथानक-संयोजक पद है, जो पिछले पद में रहस्य प्रकट होने के परिणाम को वर्तमान कार्य से जोड़ता है।
- source_word: עַל עַל־אַרְיוֹךְ
  choice: अर्योक के पास गया
  rationale: अरामी क्रिया यहाँ किसी के पास जाने या उसके सामने पहुँचने का भाव देती है। हिन्दी में यह अभिव्यक्ति स्वाभाविक है और अनावश्यक रूप से भवन में प्रवेश का अर्थ नहीं जोड़ती।
- source_word: דִּי מַנִּי מַלְכָּא
  choice: जिसे राजा ने ... नियुक्त किया था
  rationale: מני किसी काम के लिए नियुक्त या ठहराए जाने को व्यक्त करता है; पूर्वकालिक क्रिया हिन्दी कथानक में संबंध स्पष्ट करती है।
- source_word: לְהוֹבָדָה / אַל תְּהוֹבֵד
  choice: नष्ट करने / नष्ट मत कर
  rationale: אבד का कारक रूप नष्ट करने या मरवा डालने का अर्थ दे सकता है। दोनों occurrences में एक ही हिन्दी शब्द रखकर मूल की शब्दगत पुनरावृत्ति बचाई गई है; प्रसंग में मृत्युदण्ड अभिप्रेत है।
- source_word: לְחַכִּימֵי בָבֶל
  choice: बाबेल के बुद्धिमानों
  rationale: यह बाबेल के राजदरबारी ज्ञानियों के समूह के लिए प्रयुक्त पद है। 'बुद्धिमान' सरल, प्रतिष्ठित और प्रचलित हिन्दी समतुल्य है।
- source_word: אֲזַל וְכֵן אֲמַר לֵהּ
  choice: उसने जाकर उससे इस प्रकार कहा
  rationale: यह अनुवाद मूल के गमन और उसके बाद कथन—दोनों को बनाए रखता है तथा כֵן के 'इस प्रकार' भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַעֵלְנִי קֳדָם מַלְכָּא
  choice: मुझे राजा के सामने ले चल
  rationale: कारक आज्ञार्थक क्रिया और 'राजा के सामने/उपस्थिति में' का अर्थ संयुक्त रूप से सहज हिन्दी में व्यक्त होता है।
- source_word: וּפִשְׁרָא
  choice: इसका अर्थ
  rationale: פשר स्वप्न या रहस्य की व्याख्या/अर्थ के लिए दानिय्येल में तकनीकी पद है। हिन्दी में 'इसका अर्थ' संदर्भानुकूल और सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֲחַוֵּא
  choice: बताऊँगा
  rationale: क्रिया का अर्थ 'दिखाना, ज्ञात कराना' है। अर्थ या व्याख्या के साथ हिन्दी में 'बताऊँगा' अधिक स्वाभाविक है, जबकि 'ज्ञात कराऊँगा' अधिक औपचारिक विकल्प है।
