source:
  edition: WLC
  text: כָּ/ל קֳבֵ֣ל דִּֽי חֲזַ֡יְתָ דִּ֣י מִ/טּוּרָ/א֩ אִתְגְּזֶ֨רֶת אֶ֜בֶן דִּי לָ֣א בִ/ידַ֗יִן וְ֠/הַדֶּקֶת פַּרְזְלָ֨/א נְחָשָׁ֤/א חַסְפָּ/א֙ כַּסְפָּ֣/א וְ/דַהֲבָ֔/א אֱלָ֥הּ רַב֙ הוֹדַ֣ע לְ/מַלְכָּ֔/א מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/יַצִּ֥יב חֶלְמָ֖/א וּ/מְהֵימַ֥ן פִּשְׁרֵֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/045.yaml
  text: Just as you saw that a stone was cut from the mountain not by hands[a], and that it crushed the iron, the bronze, the clay, the silver, and the gold, the great God has made known to the king what will happen after this. The dream is certain, and its interpretation is trustworthy.
translation:
  language: hi
  text: जैसा आपने देखा कि पहाड़ में से एक पत्थर हाथों से नहीं[a] काटा गया और उसने लोहे, काँसे, मिट्टी, चाँदी और सोने को चूर-चूर कर दिया, उसी के अनुसार महान परमेश्वर ने राजा को ज्ञात कराया है कि इसके बाद क्या होगा। स्वप्न निश्चित है और उसकी व्याख्या विश्वसनीय है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बिना हाथों के।’ अरामी मुहावरा संकेत करता है कि पत्थर को काटना मानवीय कर्तृत्व से नहीं हुआ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: जैसा... वैसे ही
  rationale: यह अरामी पदबंध स्वप्न में देखी बात और उसकी व्याख्या के बीच अनुरूपता तथा व्याख्यात्मक संबंध प्रकट करता है। हिंदी में ‘जैसा... वैसे ही’ इस संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִטּוּרָא
  choice: पहाड़ में से
  rationale: निर्धारित रूप किसी परिचित पहाड़ की ओर संकेत करता है; ‘पहाड़ में से’ पत्थर के काटकर निकाले जाने की स्थानिक छवि को स्पष्ट रखता है।
- source_word: אִתְגְּזֶרֶת אֶבֶן
  choice: एक पत्थर ... काटा गया
  rationale: अरामी में पत्थर कर्ता वाले निष्क्रिय रूप को हिंदी में सीधे निष्क्रिय वाक्य से व्यक्त किया गया है।
- source_word: דִּי לָא בִידַיִן
  choice: बिना हाथों के
  rationale: शाब्दिक अरामी मुहावरे को बनाए रखा गया है ताकि गैर-मानवीय कर्तृत्व का संकेत रहे, पर मुख्य पाठ में उसकी व्याख्या जोड़कर अर्थ को सीमित न किया जाए।
- source_word: וְהַדֶּקֶת
  choice: और उसने ... चूर-चूर कर दिया
  rationale: क्रिया कुचलने या टुकड़े-टुकड़े करने का प्रबल अर्थ देती है। ‘चूर-चूर कर दिया’ प्रतिमा के पदार्थों के पूर्ण विनाश को स्वाभाविक और सजीव हिंदी में व्यक्त करता है।
- source_word: פַּרְזְלָא נְחָשָׁא חַסְפָּא כַּסְפָּא וְדַהֲבָא
  choice: लोहे, काँसे, मिट्टी, चाँदी और सोने
  rationale: अरामी सूची का क्रम यथावत रखा गया है। נְחָשָׁא के लिए ऐतिहासिक धातु के अर्थ में ‘काँसा’ चुना गया है।
- source_word: אֱלָהּ רַב
  choice: महान परमेश्वर
  rationale: विशेषण और संज्ञा का सीधा, प्रतिष्ठित और आधुनिक हिंदी रूप; यह परमेश्वर की महानता बताता है, बिना अतिरिक्त धर्मवैज्ञानिक उपाधि जोड़े।
- source_word: הוֹדַע לְמַלְכָּא
  choice: राजा को बता दिया है
  rationale: कारक क्रिया का अर्थ ‘ज्ञात करा देना’ है। ‘बता दिया है’ सामान्य आधुनिक हिंदी में पूर्ण और स्पष्ट सूचना देने का भाव रखता है।
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: इसके बाद क्या होगा
  rationale: भविष्यसूचक खंड का सरल और सटीक आधुनिक हिंदी रूप।
- source_word: וְיַצִּיב חֶלְמָא
  choice: स्वप्न निश्चित है
  rationale: יַצִּיב का भाव दृढ़, स्थापित और निश्चित होने का है; ‘निश्चित’ स्वप्न की सत्यता और सुनिश्चितता को संक्षेप में व्यक्त करता है।
- source_word: וּמְהֵימַן פִּשְׁרֵהּ
  choice: उसका अर्थ विश्वसनीय है
  rationale: מְהֵימַן भरोसेमंद या विश्वसनीय होने का अर्थ देता है। פִּשְׁרֵהּ के लिए सहज हिंदी ‘उसका अर्थ’ चुना गया है, जिसका संदर्भ स्वप्न की व्याख्या से स्पष्ट है।
theological_decisions:
- issue: ‘बिना हाथों के’ में निहित कर्तृत्व
  choice: मुख्य पाठ में अरामी मुहावरा ‘बिना हाथों के’ बनाए रखना
  alternative: ‘मनुष्य के हाथों के बिना’ या ‘किसी मनुष्य के हाथ से नहीं’
  rationale: यह पदबंध गैर-मानवीय और अंततः ईश्वरीय कर्तृत्व की ओर संकेत करता है। मुहावरे को बिना विस्तार दिए रखने से मूल की धर्मवैज्ञानिक गूंज और तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वप्न’, ‘महान परमेश्वर’ और ‘विश्वसनीय’ जैसे शब्द बाइबलीय गंभीरता बनाए रखते हैं; वाक्य-संरचना हिंदी की स्वाभाविक ‘जैसा... वैसे ही’ अनुरूपता का उपयोग करती है।
