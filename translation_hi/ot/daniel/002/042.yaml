base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/042.yaml
  text: And as the toes of the feet were partly iron and partly clay[a], so part of the kingdom will be strong[b], and part of it will be brittle.
translation:
  language: hi
  text: और जैसे पैरों की उँगलियाँ कुछ लोहे की और कुछ मिट्टी[a] की थीं, वैसे ही राज्य का कुछ भाग मज़बूत होगा और कुछ भाग भंगुर[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिट्टी का बर्तन” अथवा “मृद्भांड”; अरामी शब्द मिट्टी से बनी वस्तु का भी बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “नाज़ुक” अथवा “टूटने योग्य”।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְבְּעָת רַגְלַיָּא
  choice: पैरों की उँगलियाँ
  rationale: यह रचनात्मक पदबंध शाब्दिक रूप से पैरों की उँगलियों को दर्शाता है और मूर्ति के पैरों से इसका संबंध बनाए रखता है।
- source_word: מנ/הון ... ו/מנ/הון
  choice: कुछ ... और कुछ
  rationale: शाब्दिक अर्थ 'उनमें से ... और उनमें से' है; हिन्दी में मिश्रित संरचना बताने के लिए 'कुछ ... और कुछ' स्वाभाविक और स्पष्ट है।
- source_word: פַּרְזֶל
  choice: लोहा
  rationale: मूर्ति के बिंब में प्रयुक्त धातु का सीधा और मानक हिन्दी पर्याय।
- source_word: חֲסַף
  choice: मिट्टी
  rationale: यह अरामी शब्द मिट्टी या मिट्टी से बनी वस्तु का बोध करा सकता है; लोहे के साथ विरोध और अध्याय के बिंब में 'मिट्टी' सर्वाधिक स्वाभाविक है।
- source_word: מִן קְצָת
  choice: कुछ भाग
  rationale: यह पद राज्य के एक अंश या हिस्से को चिह्नित करता है; 'कुछ भाग' उसके विभाजक अर्थ को बनाए रखता है।
- source_word: מַלְכוּתָא
  choice: राज्य
  rationale: सपने में पैरों और उँगलियों द्वारा दर्शाए गए राजकीय क्षेत्र के लिए मानक और प्रसंगानुकूल शब्द।
- source_word: תֶּהֱוֵה
  choice: होगा
  rationale: यहाँ क्रिया राज्य की भावी दशा बताती है; आधुनिक हिन्दी में 'होगा' स्पष्ट और स्वाभाविक है।
- source_word: תַקִּיפָה
  choice: मज़बूत
  rationale: विशेषण शक्ति या दृढ़ता दर्शाता है; लोहे और मिट्टी के विरोध में 'मज़बूत' सहज है।
- source_word: וּ/מִנַּהּ
  choice: और कुछ भाग
  rationale: स्त्रीलिंग एकवचन प्रत्यय 'राज्य' की ओर लौटता है; 'और कुछ भाग' हिन्दी में विभाजक विरोध स्पष्ट करता है।
- source_word: תְבִירָה
  choice: भंगुर
  rationale: यह शब्द टूटे हुए या आसानी से टूट सकने वाले गुण को व्यक्त कर सकता है। यहाँ पहले से टूटा होने की अपेक्षा संरचनात्मक दुर्बलता अभिप्रेत है, इसलिए 'भंगुर' उपयुक्त है।
