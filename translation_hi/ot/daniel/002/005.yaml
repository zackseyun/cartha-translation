source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֣ר ל/כשדי/א מִלְּתָ֖/א מִנִּ֣/י אַזְדָּ֑א הֵ֣ן לָ֤א תְהֽוֹדְעוּנַּ֨/נִי֙ חֶלְמָ֣/א וּ/פִשְׁרֵ֔/הּ הַדָּמִין֙ תִּתְעַבְד֔וּן וּ/בָתֵּי/כ֖וֹן נְוָלִ֥י יִתְּשָׂמֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/005.yaml
  text: 'The king answered and said to the Chaldeans[a], “The word from me is firm: if you do not make known to me the dream and its interpretation, you will be made into limbs[b], and your houses will be made a refuse heap.”'
translation:
  language: hi
  text: 'राजा ने कसदियों को उत्तर दिया, “मेरी ओर से यह बात अटल है[a]: यदि तुम मुझे स्वप्न और उसका अर्थ न बताओ, तो तुम्हारे अंग काट-काटकर अलग कर दिए जाएँगे[b], और तुम्हारे घर कूड़े के ढेर बना दिए जाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी ओर से बात निकल चुकी है।”
    reason: alternative_reading
  - marker: b
    text: परंपरागत अनुवाद, “तुम्हारे टुकड़े-टुकड़े कर दिए जाएँगे।” अरामी शब्द का अधिक शाब्दिक अर्थ “अंग” या “अवयव” है और यह अंग-विच्छेद की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכָּא
  choice: राजा
  rationale: राजकीय उपाधि का मानक, स्वाभाविक और कथात्मक प्रसंग के अनुकूल हिन्दी रूप।
- source_word: לכשדיא
  choice: कसदियों को
  rationale: मूल पद जातीय अथवा व्यावसायिक नाम ‘कसदी’ को सूचित करता है। प्रसंग में वे राजदरबार के ज्ञानी हैं, फिर भी मुख्य पाठ में उनकी भूमिका बताने के बजाय मूल पदनाम रखा गया है।
- source_word: מִלְּתָא
  choice: यह बात
  rationale: इस अरामी शब्द का अर्थ ‘वचन’, ‘बात’ या ‘आदेश’ हो सकता है। यहाँ यह राजा की निश्चित घोषणा को सूचित करता है; आधुनिक हिन्दी में ‘यह बात’ स्वाभाविक है और अगले वाक्य से सहजता से जुड़ता है।
- source_word: מִנִּי אַזְדָּא
  choice: मेरी ओर से यह बात अटल है
  rationale: विवादित पद אַזְדָּא को प्रसंगानुसार ‘दृढ़/निश्चित’ समझा गया है, क्योंकि राजा अपने निर्णय और धमकी की अपरिवर्तनीयता जता रहा है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: תְהוֹדְעוּנַּנִי
  choice: मुझे ... न बताओ
  rationale: हפעל रूप का आशय ‘मुझे ज्ञात कराना’ है। ‘मुझे बताना’ साधारण आधुनिक हिन्दी में उसी कारक अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: חֶלְמָא
  choice: स्वप्न
  rationale: दानिय्येल के राजदरबारी प्रसंग में यह सीधा और प्रतिष्ठित हिन्दी समतुल्य है।
- source_word: פִשְׁרֵהּ
  choice: उसका अर्थ
  rationale: यहाँ पद स्वप्न की व्याख्या अथवा अर्थ को दर्शाता है। ‘उसका अर्थ’ सामान्य पाठक के लिए स्वाभाविक है और व्याख्यात्मक आशय बनाए रखता है।
- source_word: הַדָּמִין
  choice: अंग अलग-अलग
  rationale: मूल संज्ञा का शाब्दिक बिंब ‘अंगों’ का है और दंड शरीर के अंग-विच्छेद को सूचित करता है। ‘अंग अलग-अलग कर दिए जाएँगे’ हिन्दी में बोधगम्य रहते हुए उस शारीरिक बिंब को बनाए रखता है।
- source_word: תִּתְעַבְדוּן
  choice: कर दिए जाएँगे
  rationale: 'कर्मवाच्य धमकी को सुरक्षित रखा गया है: दंड पाने वाले स्वयं अवस्था नहीं बदलते, बल्कि उन पर यह किया जाएगा।'
- source_word: נְוָלִי
  choice: कूड़े के ढेर
  rationale: पद अपमानजनक उजाड़ अथवा कूड़ा-करकट के स्थान का बिंब देता है। ‘कूड़े के ढेर’ आधुनिक हिन्दी में स्पष्ट है और पुराने ‘घूरे’ जैसे कम प्रचलित शब्द से बचता है।
- source_word: יִתְּשָׂמוּן
  choice: बना दिए जाएँगे
  rationale: अरामी कर्मवाच्य ‘रखे/बनाए जाएँगे’ को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: מִנִּי אַזְדָּא का अर्थ
  choice: राजा की बात अटल है
  alternative: मेरी ओर से बात निकल चुकी है
  rationale: शब्दार्थ और अनुवाद-परंपरा में दोनों संभावनाएँ मिलती हैं। निकट प्रसंग राजा की माँग और दंडादेश की दृढ़ता पर बल देता है, इसलिए मुख्य पाठ में ‘अटल’ रखा गया; वास्तविक वैकल्पिक समझ पादटिप्पणी में दी गई है।
- issue: הַדָּמִין में दंड का बिंब
  choice: अंग अलग-अलग कर दिए जाएँगे
  alternative: टुकड़े-टुकड़े कर दिए जाओगे
  rationale: मूल पद सामान्य ‘टुकड़ों’ की अपेक्षा शरीर के ‘अंगों’ को अधिक सीधे व्यक्त करता है। मुख्य पाठ में शारीरिक बिंब रखा गया है, जबकि प्रचलित सहज रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर राजकीय धमकी के अनुरूप गरिमापूर्ण और कठोर लहजा रखा गया है। ‘कसदी’, ‘स्वप्न’ और ‘अटल’ जैसे परिचित बाइबलीय-साहित्यिक शब्दों के साथ वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है। पादटिप्पणी [a] को उसी विवादित वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
