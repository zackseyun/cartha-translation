translation:
  language: hi
  text: तब दानिय्येल राजा के पास गया और उससे विनती की कि उसे कुछ समय दिया जाए, ताकि वह राजा को स्वप्न की व्याख्या बता सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעָה
  choice: विनती की
  rationale: अरामी क्रिया का अर्थ माँगना या निवेदन करना है; राजदरबार के प्रसंग में ‘विनती की’ स्वाभाविक और सम्मानसूचक है।
- source_word: פִשְׁרָא
  choice: उसका अर्थ
  rationale: यहाँ शब्द स्वप्न के अर्थ अथवा व्याख्या को सूचित करता है। ‘उसका अर्थ’ सामान्य पाठक के लिए सहज है और पूर्वप्रसंग में उल्लिखित स्वप्न की ओर संकेत बनाए रखता है।
- source_word: לְהַחֲוָיָה
  choice: बता सके
  rationale: कारक रूप का भाव ‘ज्ञात कराना/बताना’ है; प्रयोजनसूचक वाक्य में ‘बता सके’ स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: समय माँगने का उद्देश्य
  choice: ‘ताकि’ के द्वारा स्पष्ट प्रयोजन व्यक्त किया गया
  alternative: ‘और वह राजा को उसका अर्थ बताएगा’
  rationale: अरामी דִּי यहाँ उद्देश्य/परिणाम की आश्रित उपवाक्य-रचना आरम्भ करता है; ‘ताकि’ स्रोत और प्रसंग के अनुकूल है तथा अनावश्यक निश्चितता नहीं जोड़ता।
