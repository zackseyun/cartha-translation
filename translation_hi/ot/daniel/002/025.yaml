base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/025.yaml
  text: Then Arioch hurriedly brought Daniel before the king and said to him[a], “I have found a man from among the exiles of Judah who will make the interpretation known to the king.”
translation:
  language: hi
  text: तब अर्योक जल्दी से दानिय्येल को राजा के सामने ले आया और राजा से कहा, “मैंने यहूदा के निर्वासितों में से एक पुरुष को ढूँढ़ लिया है[a], जो राजा को उसका अर्थ बताएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी” अथवा “यहूदिया का।” अरामी में दानिय्येल की पहचान निर्वासन में रह रहे यहूदा के लोगों में से एक के रूप में की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: בְּהִתְבְּהָלָה
  choice: जल्दी से
  rationale: शब्द यहाँ शीघ्रता और तत्परता व्यक्त करता है; ‘घबराकर’ संभव है, पर संदर्भ में साधारण शीघ्रता अधिक उपयुक्त है।
- source_word: הַנְעֵל ... קֳדָם מַלְכָּא
  choice: राजा के सामने ले जाकर
  rationale: कारक क्रिया किसी को राजकीय उपस्थिति में ले आने का भाव देती है; हिन्दी में यह प्रयोग सहज है।
- source_word: הַשְׁכַּחַת גְּבַר
  choice: मैंने ... एक पुरुष को ढूँढ़ लिया है
  rationale: पूर्ण क्रिया सफल खोज के वर्तमान परिणाम को उभारती है और גְּבַר स्पष्टतः पुरुष व्यक्ति को सूचित करता है।
- source_word: מִן בְּנֵי גָלוּתָא דִּי יְהוּד
  choice: यहूदा के निर्वासित लोगों में से
  rationale: यह अभिव्यक्ति निर्वासन में यहूदा से संबद्ध जनसमुदाय में से किसी व्यक्ति को सूचित करती है; हिन्दी में ‘निर्वासित लोगों’ से सामूहिक अर्थ स्पष्ट रहता है।
- source_word: פִשְׁרָא
  choice: इसका अर्थ
  rationale: दानिय्येल में यह स्वप्न के अर्थ अथवा व्याख्या का तकनीकी शब्द है। प्रसंग में ‘इसका अर्थ’ आधुनिक हिन्दी में स्वाभाविक है और आशय स्पष्ट रखता है।
- source_word: יְהוֹדַע
  choice: बताएगा
  rationale: कारक रूप ‘ज्ञात कराना’ सूचित करता है; ‘बताएगा’ सहज हिन्दी में वही अर्थ देता है, बिना ‘प्रकट करेगा’ जैसी अतिरिक्त धार्मिक छटा जोड़े।
theological_decisions:
- issue: דִּי יְהוּד का ऐतिहासिक-जातीय संकेत
  choice: यहूदा के निर्वासित लोग
  alternative: यहूदी निर्वासित / यहूदिया के निर्वासित
  rationale: अरामी पद निर्वासन के संदर्भ में यहूदा से जुड़े लोगों की पहचान करता है। मुख्य पाठ स्रोत के निकट रहता है, जबकि पादटिप्पणी संभावित जातीय और भौगोलिक अर्थों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। राजदरबार के प्रसंग के लिए ‘राजा के सामने’ स्वाभाविक है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित जातीय पहचान के बाद रखा गया है।
