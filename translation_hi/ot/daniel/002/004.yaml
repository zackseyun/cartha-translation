translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण राजदरबारी स्वर और साधारण पाठक के लिए स्पष्ट शब्दावली। राजा को प्रत्यक्ष सम्बोधन में एकवचन “तू” मूल अरामी क्रिया के एकवचन रूप और प्राचीन राजकीय अभिवादन की शैली को रखता है; इसे अनादर के अर्थ में नहीं समझना चाहिए।
