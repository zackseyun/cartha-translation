base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/004.yaml
  text: 'Then the Chaldeans spoke to the king in Aramaic: “O king[a], live forever! Tell the dream to your servants[c][b], and we will declare the interpretation.”'
translation:
  language: hi
  text: तब कसदियों ने राजा से अरामी भाषा में[a] कहा, “हे राजा, आप सदा जीवित रहें! स्वप्न अपने सेवकों को बताइए, और हम उसकी व्याख्या बता देंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
