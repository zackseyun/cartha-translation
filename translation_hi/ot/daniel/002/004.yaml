    reason: cross_reference
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: तब ... कहा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכַּשְׂדִּים
  choice: कसदियों
  rationale: यह समूह का जातीय अथवा पद-सदृश नाम है; संदर्भगत पेशे को व्याख्यात्मक रूप से जोड़ने के बजाय मूल नाम रखा गया है।
- source_word: אֲרָמִית
  choice: अरामी भाषा में
  rationale: यह कथन की भाषा और दानिय्येल के अरामी खंड के आरम्भ, दोनों को स्पष्ट करता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: सम्बोधन और दरबारी शैली को स्वाभाविक, गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: לְעָלְמִין חֱיִי
  choice: तू सदा जीवित रहे
  rationale: यह राजकीय अभिवादन एक कामनासूचक वाक्य है; हिन्दी में “रहे” उस अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱמַר חֶלְמָא
  choice: स्वप्न बता
  rationale: संदर्भ में राजा से स्वप्न की विषयवस्तु सुनाने को कहा जा रहा है; “बता” केवल “कह” से अधिक स्वाभाविक है।
- source_word: לְעַבְדָךְ
  choice: अपने सेवकों को
  rationale: राजदरबार में यह अधीनस्थों का विनम्र आत्मनिर्देश है; “सेवक” कानूनी दासत्व का अनावश्यक निष्कर्ष नहीं थोपता।
- source_word: וּפִשְׁרָא נְחַוֵּא
  choice: और हम उसका अर्थ बता देंगे
  rationale: פִשְׁרָא स्वप्न की व्याख्या/अर्थ का तकनीकी शब्द है और נְחַוֵּא उसे प्रकट या ज्ञात कराने को दर्शाता है; वर्तमान हिन्दी में संयुक्त वाक्यांश सहज और स्पष्ट है।
