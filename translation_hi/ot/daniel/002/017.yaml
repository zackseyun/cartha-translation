lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी क्रियाविशेषण कथा में घटनाओं का क्रम बताता है; ‘तब’ स्वाभाविक और सटीक हिन्दी है।
- source_word: לְבַיְתֵהּ
  choice: अपने घर
  rationale: ‘घर’ के साथ तृतीय पुरुष एकवचन प्रत्यय और दिशासूचक पूर्वसर्ग का अर्थ है; हिन्दी में कर्ता की ओर संकेत के लिए ‘अपने घर’ स्वाभाविक है।
- source_word: אֲזַל
  choice: गया
  rationale: यह जाने के लिए प्रयुक्त सामान्य अरामी क्रिया है; ‘गया’ संदर्भानुकूल सरल समतुल्य है।
- source_word: חַבְרוֹהִי
  choice: अपने साथियों
  rationale: यह शब्द दानिय्येल से निकटता से जुड़े व्यक्तियों को दर्शाता है। ‘साथी’ संबंध को बनाए रखता है और ‘मित्र’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: מִלְּתָא
  choice: यह बात
  rationale: संदर्भ में यह पहले वर्णित विषय को सूचित करता है। हिन्दी में ‘यह बात’ स्वाभाविक है और संज्ञा की व्यापक अर्थ-सीमा को अनावश्यक रूप से सीमित नहीं करता।
- source_word: הוֹדַע
  choice: बता दी
  rationale: यह ‘जानना’ क्रिया का कारक रूप है, अर्थात किसी को ज्ञात कराना। ‘बता दी’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: וְלַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה
  choice: हनन्याह, मीशाएल और अजर्याह को
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और अरामी पूर्वसर्ग को नामों की पूरी शृंखला पर लागू हिन्दी परसर्ग ‘को’ से व्यक्त किया गया है।
