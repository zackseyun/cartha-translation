  text: וּ/בִ/שְׁנַ֣ת שְׁתַּ֗יִם לְ/מַלְכוּת֙ נְבֻֽכַדְנֶצַּ֔ר חָלַ֥ם נְבֻֽכַדְנֶצַּ֖ר חֲלֹמ֑וֹת וַ/תִּתְפָּ֣עֶם רוּח֔/וֹ וּ/שְׁנָת֖/וֹ נִהְיְתָ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/001.yaml
  text: In the second year of Nebuchadnezzar’s reign[a], Nebuchadnezzar dreamed dreams, and his spirit was troubled[c][b], and his sleep left him.
translation:
  language: hi
  text: नबूकदनेस्सर के शासन के दूसरे वर्ष में, नबूकदनेस्सर ने स्वप्न देखे। उसकी आत्मा व्याकुल हो उठी[a], और उसकी नींद उससे दूर हो गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आत्मा उद्विग्न हो उठी।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “उसकी नींद उससे दूर हो गई।”'
    reason: literal_rendering
lexical_decisions:
- source_word: וּבִשְׁנַת שְׁתַּיִם
  choice: दूसरे वर्ष में
  rationale: इब्रानी पदबंध का स्वाभाविक हिन्दी काल-सूचक रूप; आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: לְמַלְכוּת
  choice: के शासन के
  rationale: यहाँ शब्द राज्य-क्षेत्र नहीं, नबूकदनेस्सर के राजकीय शासन की अवधि बताता है।
- source_word: נְבֻכַדְנֶצַּר
  choice: नबूकदनेस्सर
  rationale: हिन्दी बाइबल परम्परा में परिचित नाम-रूप, जो मूल नाम को पर्याप्त रूप से दर्शाता है।
- source_word: חָלַם ... חֲלֹמוֹת
  choice: स्वप्न देखे
  rationale: मूल में एक ही धातु से बना क्रिया-संज्ञा प्रयोग है। हिन्दी का ‘स्वप्न देखे’ स्वाभाविक रहते हुए बहुवचन और अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: וַתִּתְפָּעֶם רוּחוֹ
  choice: उसकी आत्मा व्याकुल हो उठी
  rationale: ‘आत्मा’ רוּחַ को सीधे दर्शाता है और क्रिया से व्यक्त भीतरी विक्षोभ को ‘व्याकुल हो उठी’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁנָתוֹ נִהְיְתָה עָלָיו
  choice: उसकी नींद जाती रही
  rationale: यह इब्रानी मुहावरा नींद के उससे दूर हो जाने को बताता है; हिन्दी मुहावरा अर्थ को स्पष्ट और सहज रूप में रखता है।
theological_decisions:
- issue: רוּחַ का मानव-संबंधी अर्थ
  choice: आत्मा
  alternative: मन
  rationale: ‘आत्मा’ मूल शब्द की व्यापकता और मानवीय भीतरी सत्ता का संकेत बनाए रखता है; ‘मन’ अर्थ को केवल मानसिक दशा तक सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की पुनरुक्ति में नबूकदनेस्सर का नाम दोनों बार रखा गया है; ‘स्वप्न देखे’ और ‘नींद जाती रही’ स्वाभाविक हिन्दी मुहावरे हैं।
