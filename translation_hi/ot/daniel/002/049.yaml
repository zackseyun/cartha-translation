  text: וְ/דָנִיֵּאל֙ בְּעָ֣א מִן מַלְכָּ֔/א וּ/מַנִּ֗י עַ֤ל עֲבִֽידְתָּ/א֙ דִּ֚י מְדִינַ֣ת בָּבֶ֔ל לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ וְ/דָנִיֵּ֖אל בִּ/תְרַ֥ע מַלְכָּֽ/א־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/049.yaml
  text: And Daniel requested of the king[a], and he appointed Shadrach, Meshach, and Abed-nego over the administration of the province of Babylon. But Daniel remained at the king’s court.
translation:
  language: hi
  text: तब दानियेल ने राजा से निवेदन किया, और राजा ने बाबेल प्रान्त के प्रशासन का भार शद्रक, मेशक और अबेदनगो को सौंप दिया। पर दानियेल राज-द्वार[a] पर रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “राजा के द्वार पर।” यह पद राजकीय दरबार में दानियेल के स्थान या राजा के सामने उसकी प्रशासनिक उपस्थिति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעָא מִן מַלְכָּא
  choice: राजा से निवेदन किया
  rationale: अरामी क्रिया का अर्थ पूछना या अनुरोध करना है। राजकीय संदर्भ में ‘निवेदन किया’ स्वाभाविक और सम्मानपूर्ण है, पर इसे औपचारिक कानूनी याचिका नहीं बनाता।
- source_word: וּמַנִּי
  choice: राजा ने ... नियुक्त किया
  rationale: क्रिया तृतीय पुरुष एकवचन है और उसका कर्ता व्यक्त नहीं है। संदर्भ में राजा ही स्वाभाविक कर्ता है; हिन्दी में अस्पष्ट ‘उसने’ के बजाय ‘राजा ने’ स्पष्ट और सहज है।
- source_word: עַל עֲבִידְתָּא
  choice: प्रशासन का अधिकारी
  rationale: संज्ञा का अर्थ काम, सेवा या प्रशासन हो सकता है। प्रान्तीय शासन के संदर्भ में यह पदबंध प्रशासनिक उत्तरदायित्व को सामान्य हिन्दी में व्यक्त करता है।
- source_word: דִּי מְדִינַת בָּבֶל
  choice: बाबेल प्रान्त के
  rationale: מְדִינָה यहाँ प्रशासनिक प्रान्त को दर्शाता है। ‘बाबेल’ मूल नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो को
  rationale: व्यक्तिनामों के परिचित हिन्दी बाइबलीय रूप रखे गए हैं; उपसर्ग לְ नियुक्त किए जाने वाले व्यक्तियों को चिह्नित करता है।
- source_word: בִּתְרַע מַלְכָּא
  choice: राज-द्वार पर
  rationale: शाब्दिक अर्थ ‘राजा के द्वार पर’ है। यह राजकीय दरबार या प्रशासनिक उपस्थिति का मुहावरा हो सकता है; मुख्य पाठ में स्रोत की ठोस छवि और पाद-टिप्पणी में सम्भावित संस्थागत अर्थ सुरक्षित रखा गया है।
- source_word: וְדָנִיֵּאל
  choice: पर दानियेल
  rationale: संयोजक यहाँ मित्रों की प्रान्तीय नियुक्ति और दानियेल की राजकीय उपस्थिति के बीच प्रसंगगत विरोध दिखाता है; ‘पर’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
