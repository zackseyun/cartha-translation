- from: तब दानियेल ने राजा से निवेदन किया, और राजा ने शद्रक, मेशक और अबेदनगो को बाबेल प्रान्त के प्रशासन का अधिकारी नियुक्त किया। पर दानियेल राज-द्वार[a] पर रहा।
  to: तब दानियेल ने राजा से निवेदन किया, और राजा ने बाबेल प्रान्त के प्रशासन का भार शद्रक, मेशक और अबेदनगो को सौंप दिया। पर दानियेल राज-द्वार[a] पर रहा।
  rationale: The revision removes the grammatically and semantically awkward singular “अधिकारी” for the three appointees. “प्रशासन का भार ... को सौंप दिया” communicates that the king placed them in charge of the provincial administration, while retaining the formal register. The literal-but-idiomatic “राज-द्वार” and its explanatory footnote are retained.
