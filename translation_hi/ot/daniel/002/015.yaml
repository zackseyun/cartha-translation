  yaml_path: translation/ot/daniel/002/015.yaml
  text: He answered and said to Arioch[a], the king’s commander[b], “Why is the decree so harsh from before the king?” Then Arioch made the matter known to Daniel.
translation:
  language: hi
  text: उसने राजा के अधिकारी अर्योक से पूछा, “राजा की ओर से निकला यह आदेश इतना कठोर[a] क्यों है?” तब अर्योक ने दानिय्येल को सारी बात बता दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ “इतना कड़ा,” “इतना सख्त,” या “इतनी जल्दबाज़ी/शीघ्रता से जारी किया गया” भी हो सकता है। अरामी शब्द कठोरता और उतावली—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה וְאָמַר
  choice: पूछा
  rationale: यह सामी कथात्मक युग्म शाब्दिक रूप से ‘उत्तर दिया और कहा’ है, पर यहाँ आगामी प्रश्न का स्वाभाविक आधुनिक हिन्दी रूप ‘पूछा’ है।
- source_word: שַׁלִּיטָא דִי מַלְכָּא
  choice: राजा का अधिकारी
  rationale: शब्द अधिकार रखने वाले शाही पदाधिकारी को सूचित करता है। प्रसंग में अर्योक को दंड लागू करने का दायित्व मिला है; ‘अधिकारी’ उसके पद को अनावश्यक रूप से सैन्य नहीं बनाता।
- source_word: דָתָא
  choice: आदेश
  rationale: राजदरबार के प्रसंग में यह राजा द्वारा जारी बाध्यकारी आदेश है; आधुनिक हिन्दी में ‘आदेश’ सहज और स्पष्ट है।
- source_word: מְהַחְצְפָה
  choice: इतना कठोर
  rationale: दुर्लभ अरामी रूप कठोरता, तीव्रता अथवा उतावली का भाव दे सकता है। ‘कठोर’ राजाज्ञा की दंडात्मक तीव्रता को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: מִן קֳדָם מַלְכָּא
  choice: राजा की ओर से निकला
  rationale: शाब्दिक अर्थ ‘राजा के सामने से’ है; यह अरामी मुहावरा राजा की उपस्थिति या अधिकार से आदेश निकलने को बताता है। हिन्दी में चुना गया रूप अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: אֱדַיִן
  choice: तब
  rationale: कथा के अगले चरण को दिखाने वाला स्वाभाविक हिन्दी संयोजक।
- source_word: מִלְּתָא הוֹדַע
  choice: सारी बात बता दी
  rationale: अरामी पदबंध का भाव है कि अर्योक ने विषय या परिस्थिति दानिय्येल को ज्ञात करा दी; यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
