id: DAN.2.30
reference: Daniel 2:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנָ֗ה לָ֤א בְ/חָכְמָה֙ דִּֽי אִיתַ֥י בִּ/י֙ מִן כָּל חַיַּיָּ֔/א רָזָ֥/א דְנָ֖ה גֱּלִ֣י לִ֑/י לָהֵ֗ן עַל דִּבְרַת֙ דִּ֤י פִשְׁרָ/א֙ לְ/מַלְכָּ֣/א יְהוֹדְע֔וּן וְ/רַעְיוֹנֵ֥י לִבְבָ֖/ךְ תִּנְדַּֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/030.yaml
  text: But as for me[a], this mystery has been revealed to me not because of wisdom that is in me more than in all the living, but in order that the interpretation may be made known to the king[b], and that you may know the thoughts of your heart.
translation:
  language: hi
  text: परन्तु जहाँ तक मेरी बात है, यह रहस्य मुझे इसलिए प्रकट नहीं किया गया है कि मुझमें सभी जीवित मनुष्यों से अधिक बुद्धि है, बल्कि इसलिए कि इसकी व्याख्या राजा को ज्ञात हो और आप अपने हृदय के विचारों को जान सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנָה
  choice: परन्तु जहाँ तक मेरी बात है
  rationale: संयोजक और स्वतंत्र सर्वनाम दानिय्येल की भूमिका को विरोधात्मक बल के साथ सामने लाते हैं; यह हिन्दी प्रयोग उस बल को स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: לָא בְחָכְמָה דִּי אִיתַי בִּי מִן כָּל חַיַּיָּא
  choice: इसलिए नहीं ... कि मुझमें सभी जीवित मनुष्यों से अधिक बुद्धि है
  rationale: בְ यहाँ कारण या आधार बताता है और מִן तुलना को; अनुवाद दानिय्येल द्वारा अपनी श्रेष्ठ बुद्धि का स्पष्ट निषेध बनाए रखता है। חַיַּיָּא को प्रसंगानुसार मनुष्यों के लिए समझा गया है।
- source_word: רָזָא דְנָה
  choice: यह रहस्य
  rationale: दानिय्येल में רָז किसी छिपी हुई बात, विशेषतः परमेश्वर द्वारा खोली गई बात, के लिए प्रयुक्त होता है; ‘रहस्य’ इस प्रकाशनात्मक अर्थ को रखता है।
- source_word: גֱּלִי לִי
  choice: मुझ पर ... प्रकट किया गया
  rationale: अरामी रूप दानिय्येल को प्रकाशन का प्राप्तकर्ता, न कि स्रोत, दिखाता है; हिन्दी कर्मवाच्य इसे स्पष्ट करता है।
- source_word: לָהֵן עַל דִּבְרַת דִּי
  choice: बल्कि इसलिए कि
  rationale: ये पद पिछले निषेध के विपरीत प्रकाशन का उद्देश्य प्रस्तुत करते हैं; हिन्दी में एक संयुक्त उद्देश्य-वाक्यांश स्वाभाविक है।
- source_word: פִשְׁרָא
  choice: इसका अर्थ
  rationale: यह स्वप्न अथवा रहस्य के अर्थ/व्याख्या का मानक अरामी शब्द है; सामान्य हिन्दी में ‘इसका अर्थ’ स्पष्ट और सहज है।
- source_word: לְמַלְכָּא יְהוֹדְעוּן
  choice: राजा को ... बताया जाए
  rationale: बहुवचन क्रिया यहाँ अनिर्दिष्ट कर्ता वाला, कर्मवाच्य-सदृश भाव देती है; ‘बताया जाए’ बिना अनावश्यक कर्ता जोड़े वही अर्थ देता है।
- source_word: וְרַעְיוֹנֵי לִבְבָךְ תִּנְדַּע
  choice: आप अपने हृदय के विचारों को जान सकें
  rationale: ‘हृदय’ स्रोत की मानव-अंतरात्मा और विचार-जीवन संबंधी भाषा को बनाए रखता है, और संभावनार्थक क्रिया उद्देश्य को व्यक्त करती है।
theological_decisions:
- issue: प्रकाशन पाने में दानिय्येल की व्यक्तिगत श्रेष्ठता का निषेध
  choice: स्पष्ट किया गया कि रहस्य दानिय्येल की अन्य सभी जीवित मनुष्यों से अधिक बुद्धि के कारण प्रकट नहीं हुआ।
  alternative: तुलना हटाकर केवल यह कहना कि रहस्य उसकी अपनी बुद्धि के कारण प्रकट नहीं हुआ।
  rationale: מִן כָּל חַיַּיָּא स्पष्ट तुलनात्मक वाक्यांश है; इसे रखने से दानिय्येल की विनम्रता और प्रकाशन के गैर-मानवीय स्रोत पर पाठ का बल सुरक्षित रहता है।
- issue: ‘हृदय’ की मानवशास्त्रीय भाषा
  choice: हृदय
  alternative: मन
  rationale: बाइबिल की भाषा में हृदय विचार और अभिप्राय दोनों को समेटता है; ‘हृदय’ रखने से स्रोत की व्यापक और जानबूझकर प्रयुक्त छवि बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए स्पष्ट शैली। राजा को सीधे संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘सभी जीवित मनुष्यों’ से अरामी के शाब्दिक ‘सभी जीवितों’ का मानवीय संदर्भ स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
