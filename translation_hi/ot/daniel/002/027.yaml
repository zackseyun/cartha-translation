  text: עָנֵ֧ה דָנִיֵּ֛אל קֳדָ֥ם מַלְכָּ֖/א וְ/אָמַ֑ר רָזָ/ה֙ דִּֽי מַלְכָּ֣/א שָׁאֵ֔ל לָ֧א חַכִּימִ֣ין אָֽשְׁפִ֗ין חַרְטֻמִּין֙ גָּזְרִ֔ין יָכְלִ֖ין לְ/הַֽחֲוָיָ֥ה לְ/מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/027.yaml
  text: Daniel answered before the king and said[a], “The mystery that the king asks, no wise men, enchanters, magicians[b], or diviners are able to make known to the king.”
translation:
  language: hi
  text: दानिय्येल ने राजा के सामने उत्तर दिया, “जिस रहस्य[a] के विषय में राजा पूछ रहा है, उसे न बुद्धिमान लोग, न मंत्र-साधक[b], न जादूगर और न शकुन-विचारक राजा को बता सकते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भेद।’ अरामी शब्द उस छिपी हुई बात को दर्शाता है जिसे परमेश्वर ही प्रकट करता है; यहाँ ‘रहस्य’ पूरे अध्याय में दोहराए गए इस विषय को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘मंत्र-साधक’ बाबुल के विशेषज्ञों के एक वर्ग के तकनीकी पद का अनुवाद है; इसका सटीक अर्थ अनिश्चित है। ‘ज्योतिषी’ पारंपरिक वैकल्पिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה
  choice: उत्तर दिया
  rationale: यह अरामी कथात्मक क्रिया संवाद में प्रत्युत्तर का परिचय देती है; ‘उत्तर दिया’ राजदरबार के औपचारिक प्रसंग के अनुकूल है।
- source_word: קֳדָם
  choice: के सामने
  rationale: इस संबंधसूचक अव्यय का अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है; यह राजा की उपस्थिति में बोलने का दरबारी दृश्य बनाए रखता है।
- source_word: רָזָה
  choice: रहस्य
  rationale: यह उस छिपी हुई बात को दर्शाता है जिसे केवल परमेश्वर प्रकट कर सकता है। ‘रहस्य’ पूरे अध्याय में इस विषयगत संबंध को बनाए रखता है; ‘भेद’ भी संभव है।
- source_word: שָׁאֵל
  choice: पूछ रहा है
  rationale: यह राजा की वर्तमान माँग को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חַכִּימִין
  choice: बुद्धिमान
  rationale: यह राजदरबार के विद्वान सलाहकारों के एक मान्य वर्ग का पद है और दानिय्येल की कथा में स्थापित अर्थ को सुरक्षित रखता है।
- source_word: אָשְׁפִין
  choice: मंत्र-साधक
  rationale: ठीक तकनीकी अर्थ अनिश्चित है, पर यह बाबुल के गूढ़ विद्या से जुड़े विशेषज्ञों के एक वर्ग को दर्शाता है। ‘मंत्र-साधक’ इसे सूची के अन्य वर्गों से अलग रखते हुए समझने योग्य बनाता है।
- source_word: חַרְטֻמִּין
  choice: जादूगर
  rationale: बाइबिल के प्रयोग में यह मिस्र या बाबुल के गूढ़ कलाओं के विशेषज्ञों का एक वर्ग है; ‘जादूगर’ इसका स्पष्ट और प्रचलित हिन्दी पर्याय है।
- source_word: גָּזְרִין
  choice: शकुन-विचारक
  rationale: दानिय्येल में यह छिपी बातों का निर्णय या कथन करनेवाले एक विशेषज्ञ वर्ग को सूचित करता है। ‘शकुन-विचारक’ बिना ‘भविष्यवक्ता’ की धार्मिक अर्थच्छाया लाए उसके फलित-कथन संबंधी कार्य को व्यक्त करता है।
- source_word: יָכְלִין
  choice: बता सकते हैं
  rationale: यह सामर्थ्य व्यक्त करता है; नकार के साथ ‘नहीं बता सकते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְהַחֲוָיָה
  choice: बता
  rationale: यह कारक क्रिया छिपी बात को ज्ञात कराने या प्रकट करने का अर्थ देती है; ‘बता’ सरल हिन्दी में उसी प्रकटीकरण को व्यक्त करता है।
- source_word: לְמַלְכָּא
  choice: राजा को
  rationale: यह प्रकटीकरण के अप्रत्यक्ष कर्म को व्यक्त करता है और पद के आरम्भ में आए ‘राजा के सामने’ से स्पष्ट रूप से अलग रहता है।
