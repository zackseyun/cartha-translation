  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘न…न…न…और न’ की रचना मूल की सभी विशेषज्ञ श्रेणियों पर नकार का विस्तार स्पष्ट करती है, जबकि दरबारी संबोधन की औपचारिकता बनी रहती है।
