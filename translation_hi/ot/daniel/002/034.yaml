source:
  edition: WLC
  text: חָזֵ֣ה הֲוַ֗יְתָ עַ֠ד דִּ֣י הִתְגְּזֶ֤רֶת אֶ֨בֶן֙ דִּי לָ֣א בִ/ידַ֔יִן וּ/מְחָ֤ת לְ/צַלְמָ/א֙ עַל רַגְל֔וֹ/הִי דִּ֥י פַרְזְלָ֖/א וְ/חַסְפָּ֑/א וְ/הַדֵּ֖קֶת הִמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/034.yaml
  text: You were watching until a stone was cut out[a], not by hands[b], and it struck the statue on its feet of iron and clay and crushed them.
translation:
  language: hi
  text: आप देखते रहे, जब तक कि एक पत्थर काटकर अलग किया गया, पर हाथों से नहीं[a]; उसने मूर्ति[b] के लोहे और मिट्टी से बने पैरों पर प्रहार किया और उन्हें चूर-चूर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना हाथों के।” अरामी मुहावरे का अर्थ है कि पत्थर मानवीय अभिकरण से नहीं काटा गया था।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रतिमा।” अरामी शब्द प्रतिमा या मूर्ति का अर्थ दे सकता है; यहाँ यह स्वप्न में दिखाई गई विशाल आकृति को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוַיְתָ
  choice: आप देखते रहे
  rationale: कृदंत और הוה का यह संयोजन भूतकाल में जारी क्रिया व्यक्त करता है; इसलिए साधारण ‘आपने देखा’ के बजाय ‘आप देखते रहे’ चुना गया।
- source_word: עַד דִּי
  choice: जब तक कि
  rationale: यह उस बिंदु को बताता है जहाँ तक देखना जारी रहा; आधुनिक हिन्दी में ‘जब तक कि’ स्वाभाविक है।
- source_word: הִתְגְּזֶרֶת אֶבֶן
  choice: एक पत्थर काटकर अलग नहीं किया गया
  rationale: अरामी रूप निष्क्रिय भाव रखता है और पत्थर के काटकर अलग किए जाने को दर्शाता है। हिन्दी में ‘नहीं’ अगले अभिकरण-वाक्यांश के साथ मिलकर ‘मनुष्य के हाथों से नहीं’ का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּי לָא בִידַיִן
  choice: मनुष्य के हाथों से नहीं
  rationale: शाब्दिक ‘हाथों से नहीं’ का आशय मानवीय अभिकरण का निषेध है; ‘मनुष्य के’ जोड़ने से आधुनिक पाठक के लिए मुहावरे का अर्थ स्पष्ट होता है, बिना उसे किसी विशिष्ट अलौकिक अभिकर्ता के रूप में व्याख्यायित किए।
- source_word: וּמְחָת
  choice: और उसने … मारा
  rationale: क्रिया का कर्ता पत्थर है। ‘मारा’ प्रभावशाली टक्कर को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: לְצַלְמָא
  choice: उस मूर्ति को
  rationale: צְלֵם का अर्थ ‘प्रतिमा/मूर्ति’ हो सकता है। स्वप्न की विशाल मानवाकार आकृति के लिए ‘मूर्ति’ ठोस और सहज है; ‘प्रतिमा’ पादटिप्पणी में रखा गया है।
- source_word: עַל רַגְלוֹהִי דִּי פַרְזְלָא וְחַסְפָּא
  choice: लोहे और मिट्टी के पैरों पर
  rationale: यह संबंधवाचक वाक्यांश मूर्ति के पैरों की सामग्री बताता है; संक्षिप्त हिन्दी संरचना मूल अर्थ को सुरक्षित रखती है।
- source_word: וְהַדֵּקֶת הִמּוֹן
  choice: और उन्हें चूर-चूर कर दिया
  rationale: क्रिया कुचलकर टुकड़े या चूर्ण करने का प्रबल भाव रखती है और बहुवचन सर्वनाम पैरों की ओर संकेत करता है। ‘चूर-चूर’ इस तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मानवीय अभिकरण का निषेध करने वाला मुहावरा
  choice: मनुष्य के हाथों से नहीं
  alternative: बिना हाथों के
  rationale: मूल वाक्यांश निकट रूप से ‘हाथों से नहीं’ कहता है और उसका आशय यह है कि पत्थर सामान्य मानवीय क्रिया से नहीं काटा गया। अनुवाद इस निषेध को स्पष्ट करता है, पर अभिकर्ता की पहचान जोड़कर निहित धार्मिक अर्थ को समय से पहले निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में राजा के लिए आदरसूचक ‘आप’ रखा गया है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। डैश मूल के बीच आए अभिकरण-वाक्यांश को स्पष्ट रखते हैं और ‘मनुष्य के हाथों से नहीं’ को पत्थर काटे जाने से जोड़ते हैं।
