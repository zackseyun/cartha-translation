base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/026.yaml
  text: The king answered and said to Daniel, whose name was Belteshazzar, “Are you able to make known to me the dream that I saw, and its interpretation?”
translation:
  language: hi
  text: राजा ने दानिय्येल से, जिसका नाम बेल्तशस्सर था, उत्तर देकर कहा, “क्या तुम मुझे वह स्वप्न, जो मैंने देखा था, और उसकी व्याख्या भी बता सकते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: राजा ने ... उत्तर देकर कहा
  rationale: अरामी कथात्मक युग्म ‘उत्तर दिया और कहा’ के दोनों पक्षों को स्वाभाविक आधुनिक हिन्दी में ‘उत्तर देकर कहा’ के रूप में सुरक्षित रखा गया है।
- source_word: לְדָנִיֵּאל
  choice: दानिय्येल से
  rationale: कहने या पूछने के संबोधित व्यक्ति के लिए आधुनिक हिन्दी में ‘से’ स्वाभाविक है; नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: जिसका नाम बेलतशस्सर था
  rationale: शाब्दिक अरामी संबंधवाचक रचना और भूतकालीन कथात्मक संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: הֲאִיתָךְ כָּהֵל
  choice: क्या तुम ... बता सकते हो?
  rationale: प्रश्नवाचक रचना और सामर्थ्य का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: לְהוֹדָעֻתַנִי
  choice: मुझे ... बता सकते हो
  rationale: कारक रूप का अर्थ ‘मुझे ज्ञात कराना’ है; यहाँ ‘मुझे बताना’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः पर्याप्त है।
- source_word: חֶלְמָא דִי חֲזֵית
  choice: वह स्वप्न जो मैंने देखा था
  rationale: निर्धारित संज्ञा और उससे जुड़ा संबंधवाचक उपवाक्य स्पष्ट रखे गए हैं; ‘देखा था’ पूर्ववर्ती अनुभव को स्वाभाविक हिन्दी काल में व्यक्त करता है।
- source_word: וּפִשְׁרֵהּ
  choice: और उसका अर्थ
  rationale: स्वप्न के संदर्भ में פשר उसका व्याख्यायित अर्थ दर्शाता है। ‘अर्थ’ सामान्य पाठक के लिए सहज है और संदर्भ में ‘व्याख्या’ का आशय वहन करता है।
