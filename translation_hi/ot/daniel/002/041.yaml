  text: וְ/דִֽי חֲזַ֜יְתָה רַגְלַיָּ֣/א וְ/אֶצְבְּעָתָ֗/א מנ/הון חֲסַ֤ף דִּֽי פֶחָר֙ ו/מנ/הון פַּרְזֶ֔ל מַלְכ֤וּ פְלִיגָה֙ תֶּהֱוֵ֔ה וּ/מִן נִצְבְּתָ֥/א דִ֥י פַרְזְלָ֖/א לֶֽהֱוֵא בַ֑/הּ כָּ/ל קֳבֵל֙ דִּ֣י חֲזַ֔יְתָה פַּ֨רְזְלָ֔/א מְעָרַ֖ב בַּ/חֲסַ֥ף טִינָֽ/א־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/041.yaml
  text: And as you saw the feet and toes[a], partly of potter’s clay and partly of iron, the kingdom will be divided; yet some of the firmness of iron will be in it[b], just as you saw the iron mixed with clay mud.
translation:
  language: hi
  text: और जैसा आपने पाँवों और उनकी उँगलियों को देखा—उनका कुछ भाग कुम्हार की मिट्टी का और कुछ भाग लोहे का था—वैसे ही वह राज्य विभाजित होगा; फिर भी उसमें लोहे की कुछ दृढ़ता[a] होगी, ठीक जैसे आपने लोहे को मिट्टी के गारे में मिला हुआ देखा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोहे की कुछ शक्ति’ अथवा ‘लोहे का कुछ स्थायित्व’। अरामी शब्द दृढ़ता, शक्ति या स्थिरता का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गीली मिट्टी में मिला हुआ’। यहाँ मिट्टी और गारे के अर्थ वाले दो शब्द साथ आए हैं, जो इस अस्थिर मिश्रण पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלַיָּא וְאֶצְבְּעָתָא
  choice: पाँवों और उनकी उँगलियों
  rationale: प्रतिमा के संदर्भ में רַגְלַיָּא का अर्थ ‘पाँव’ है; उँगलियों के साथ यह हिंदी में स्वाभाविक और संदर्भानुकूल युग्म बनाता है।
- source_word: מנ/הון ... ו/מנ/הון
  choice: कुछ भाग ... और कुछ भाग
  rationale: शाब्दिक ‘उनमें से कुछ ... और उनमें से कुछ’ के आशय को सामग्री की आंशिक संरचना के रूप में स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֲסַף דִּי פֶחָר
  choice: कुम्हार की मिट्टी
  rationale: חֲסַף मिट्टी/मृत्तिका और פֶחָר कुम्हार को सूचित करता है; यह पद दोनों तत्वों को सहज हिंदी में बनाए रखता है।
- source_word: פַּרְזֶל
  choice: लोहा
  rationale: दर्शन में प्रयुक्त धातु के लिए सीधा और मानक हिंदी शब्द।
- source_word: מַלְכוּ פְלִיגָה
  choice: वह राज्य विभाजित होगा
  rationale: संदर्भ किसी विशिष्ट, प्रतिमा द्वारा दर्शाए गए राज्य का है; פְלִיגָה उसकी विभाजित अवस्था बताता है।
- source_word: נִצְבְּתָא דִי פַרְזְלָא
  choice: लोहे की कुछ दृढ़ता
  rationale: נִצְבְּתָא दृढ़ता, शक्ति या स्थिरता का बोध करा सकता है। ‘दृढ़ता’ लोहे की ठोस छवि को बनाए रखती है, और וּמִן का आंशिक भाव ‘कुछ’ से व्यक्त होता है।
- source_word: כָּל־קֳבֵל דִּי
  choice: ठीक जैसे
  rationale: यहाँ पद देखी गई वस्तु और उसकी व्याख्या के बीच अनुरूपता प्रस्तुत करता है; ‘ठीक जैसे’ उस संबंध को स्वाभाविक हिंदी में व्यक्त करता है, यद्यपि कारणात्मक अर्थ भी संभव है।
- source_word: מְעָרַב בַּחֲסַף טִינָא
  choice: गीली चिकनी मिट्टी में मिला हुआ
  rationale: מְעָרַב मिश्रण बताता है, जबकि חֲסַף और טִינָא मिलकर मिट्टी तथा गीले गारे/कीचड़ का भाव देते हैं। यह चयन दोनों के संयुक्त भौतिक चित्र को पठनीय हिंदी में रखता है।
