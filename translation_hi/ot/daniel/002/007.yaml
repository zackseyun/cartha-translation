id: DAN.2.7
reference: Daniel 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲנ֥וֹ תִנְיָנ֖וּת וְ/אָמְרִ֑ין מַלְכָּ֕/א חֶלְמָ֛/א יֵאמַ֥ר לְ/עַבְד֖וֹ/הִי וּ/פִשְׁרָ֥/ה נְהַחֲוֵֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/007.yaml
  text: They answered a second time and said[a], “Let the king tell the dream to his servants[b], and we will show the interpretation.”
translation:
  language: hi
  text: उन्होंने दूसरी बार[a] उत्तर देकर कहा, “राजा अपने सेवकों को स्वप्न बताए, और हम उसका अर्थ बता देंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से।” अरामी शब्द अधिक विशेष रूप से “दूसरी बार” का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “हम उसका अर्थ प्रकट कर देंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנוֹ
  choice: उत्तर देकर
  rationale: पईल पूर्णकाल, अन्य पुरुष बहुवचन है। संवाद के प्रसंग में ‘उत्तर देकर कहा’ स्वाभाविक हिन्दी कथन है और עֲנוֹ तथा וְאָמְרִין दोनों को स्पष्ट रखता है।
- source_word: תִנְיָנוּת
  choice: दूसरी बार
  rationale: यह क्रियाविशेषण केवल ‘फिर’ नहीं, बल्कि स्पष्ट रूप से दूसरी बार किए गए उत्तर का बोध कराता है।
- source_word: וְאָמְרִין
  choice: कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाला बहुवचन कृदन्त है; कथात्मक हिन्दी में ‘कहा’ स्वाभाविक है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: यह יֵאמַר का कर्ता है, सम्बोधन नहीं; इसलिए ‘हे राजा’ के बजाय ‘राजा’ रखा गया है।
- source_word: חֶלְמָא
  choice: स्वप्न
  rationale: दरबारी और बाइबलीय प्रसंग के अनुकूल, आधुनिक हिन्दी में समझा जाने वाला गरिमापूर्ण शब्द।
- source_word: יֵאמַר
  choice: बताए
  rationale: अरामी अपूर्ण क्रिया यहाँ इच्छार्थक/निवेदनात्मक बल रखती है; हिन्दी संभावनार्थक ‘बताए’ उस विनम्र आग्रह को बनाए रखता है।
- source_word: לְעַבְדוֹהִי
  choice: अपने सेवकों को
  rationale: राजदरबार में वक्ता अपने लिए सम्मानसूचक रूप से ‘सेवक’ कहते हैं; यहाँ दासत्व पर बल नहीं है।
- source_word: וּפִשְׁרָה
  choice: और हम उसका अर्थ
  rationale: פשר स्वप्न की व्याख्या या अर्थ को सूचित करता है। प्रत्यय के सम्बन्धसूचक भाव को हिन्दी में ‘उसका’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: נְהַחֲוֵה
  choice: बता देंगे
  rationale: हफएल प्रथम पुरुष बहुवचन का अर्थ ‘दिखाना/ज्ञात कराना’ है। ‘अर्थ बता देंगे’ वर्तमान हिन्दी में सहज है और आश्वासन का भाव बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘राजा’ को सम्बोधन न बनाकर वाक्य का कर्ता रखा गया है, और दरबारी आत्म-सन्दर्भ के लिए ‘सेवकों’ का प्रयोग किया गया है।
