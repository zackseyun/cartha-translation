source:
  edition: WLC
  text: דִּ֣י הֵן חֶלְמָ/א֩ לָ֨א תְהֽוֹדְעֻנַּ֜/נִי חֲדָה הִ֣יא דָֽתְ/כ֗וֹן וּ/מִלָּ֨ה כִדְבָ֤ה וּ/שְׁחִיתָה֙ הזמנתון לְ/מֵאמַ֣ר קָֽדָמַ֔/י עַ֛ד דִּ֥י עִדָּנָ֖/א יִשְׁתַּנֵּ֑א לָהֵ֗ן חֶלְמָ/א֙ אֱמַ֣רוּ לִ֔/י וְֽ/אִנְדַּ֕ע דִּ֥י פִשְׁרֵ֖/הּ תְּהַחֲוֻנַּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/009.yaml
  text: But if you do not make the dream known to me[a], there is only one decree for you, for you have agreed to speak lying and corrupt words before me until the time changes. Therefore tell me the dream[c][b], and I will know that you can make its interpretation known to me.
translation:
  language: hi
  text: परन्तु यदि तुम मुझे स्वप्न नहीं बताओगे, तो तुम सबके लिए केवल एक ही राजाज्ञा है[a], क्योंकि तुमने मेरे सामने झूठी और छलपूर्ण बातें कहने की ठान ली है[b], जब तक कि समय बदल न जाए[c]। इसलिए मुझे स्वप्न बताओ; तब मैं जान लूँगा कि तुम मुझे उसका अर्थ भी बता सकते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम सबके लिए एक ही न्यायिक निर्णय है’ अथवा ‘एक ही नियम है।’ अरामी शब्द דָּת राज-दरबार के प्रसंग में राजाज्ञा, नियम या न्यायिक निर्णय को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तुमने ... कहने की तैयारी कर ली है’ अथवा ‘व्यवस्था कर ली है।’ मूल क्रिया जान-बूझकर तैयारी या प्रबन्ध करने का भाव रखती है; मुख्य पाठ में ‘ठान ली है’ उस जानबूझकर किए गए निश्चय को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जब तक परिस्थितियाँ बदल न जाएँ।’ अरामी में ‘समय’ एकवचन है, इसलिए मुख्य पाठ में उसी के निकट रूप रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי הֵן
  choice: परन्तु यदि
  rationale: यह पद पिछले कथन के विपरीत स्थिति रखते हुए एक शर्त प्रस्तुत करता है; ‘परन्तु यदि’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶלְמָא
  choice: स्वप्न
  rationale: सन्दर्भ में वही निश्चित स्वप्न अभिप्रेत है जिसकी चर्चा पहले से हो रही है; हिन्दी में विभक्ति और प्रसंग से निश्चितता स्पष्ट है।
- source_word: לָא תְהוֹדְעֻנַּנִי
  choice: तुम मुझे ... नहीं बताओगे
  rationale: हफेल रूप का मूल भाव ‘मुझे ज्ञात कराना’ है। यहाँ ‘मुझे बताना’ आधुनिक हिन्दी में उसका स्वाभाविक और स्पष्ट समतुल्य है।
- source_word: חֲדָה הִיא דָתְכוֹן
  choice: तुम सबके लिए केवल एक ही राजाज्ञा है
  rationale: דָּת राज-दरबार के प्रसंग में राजकीय आदेश, नियम अथवा न्यायिक निर्णय को सूचित कर सकता है। ‘राजाज्ञा’ दरबारी सन्दर्भ बनाए रखती है, और ‘केवल एक ही’ सब पर लागू एक निर्णय का बल व्यक्त करता है।
- source_word: וּמִלָּה כִדְבָה וּשְׁחִיתָה
  choice: झूठी और भ्रष्ट बातें
  rationale: यह अनुवाद असत्यता और विकृत/भ्रष्ट स्वरूप—दोनों विशेषणों को बिना किसी एक में मिला दिए बनाए रखता है।
- source_word: הזמנתון
  choice: आपस में ठान ली है
  rationale: क्रिया तैयार करने, तय करने या व्यवस्थित करने का भाव रखती है। बहुवचन आरोप के प्रसंग में ‘आपस में ठान ली है’ उनकी सोची-समझी सामूहिक योजना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד דִּי עִדָּנָא יִשְׁתַּנֵּא
  choice: जब तक कि समय बदल न जाए
  rationale: एकवचन עִדָּנָא को ‘समय’ के रूप में रखा गया है। वाक्यांश राजा के इस आरोप को व्यक्त करता है कि वे परिस्थितियाँ बदलने तक टालना चाहते हैं, पर मुख्य पाठ में ‘परिस्थितियाँ’ जोड़कर अर्थ को सीमित नहीं किया गया।
- source_word: לָהֵן
  choice: इसलिए
  rationale: यह पिछले आरोप से निकले निष्कर्ष और अगली आज्ञा के बीच स्पष्ट तार्किक सम्बन्ध दिखाता है।
- source_word: פִשְׁרֵהּ
  choice: उसका अर्थ
  rationale: פשר स्वप्न की व्याख्या/अर्थ के लिए दानिय्येल में प्रयुक्त विशिष्ट शब्द है। साधारण आधुनिक हिन्दी में ‘अर्थ’ स्पष्ट है और स्वप्न की व्याख्या को सूचित करता है।
- source_word: תְּהַחֲוֻנַּנִי
  choice: तुम मुझे ... बता सकते हो
  rationale: शाब्दिक रूप से यह ‘तुम मुझे प्रकट/ज्ञात कराओगे’ है; प्रसंग में राजा स्वप्न बताने की उनकी क्षमता को अर्थ बताने की क्षमता की कसौटी बनाता है, इसलिए ‘बता सकते हो’ अपेक्षित आशय को स्वाभाविक रूप से व्यक्त करता है।
