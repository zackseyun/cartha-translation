source:
  edition: WLC
  text: בֵּ֠/אדַיִן מַלְכָּ֤/א נְבֽוּכַדְנֶצַּר֙ נְפַ֣ל עַל אַנְפּ֔וֹ/הִי וּ/לְ/דָנִיֵּ֖אל סְגִ֑ד וּ/מִנְחָה֙ וְ/נִ֣יחֹחִ֔ין אֲמַ֖ר לְ/נַסָּ֥כָה לֵֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/046.yaml
  text: Then King Nebuchadnezzar fell on his face and paid homage to Daniel[c][b][a], and he commanded that an offering and incense be offered to him.
translation:
  language: hi
  text: तब राजा नबूकदनेस्सर मुँह के बल गिर पड़ा और उसने दानिय्येल को दंडवत किया[a], और उसने आज्ञा दी कि उसके लिए भेंट और सुगंध-द्रव्य[c] चढ़ाए जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दानिय्येल की आराधना की” अथवा “दानिय्येल के सामने झुका।” अरामी क्रिया दंडवत होने या श्रद्धापूर्ण सम्मान देने का अर्थ रख सकती है।
    reason: alternative_reading
  - marker: b
    text: मूल क्रिया अधिक विशिष्ट रूप से उसके लिए तरल भेंट उंडेलने का संकेत देती है।
    reason: lexical_alternative
  - marker: c
    text: या “मनभावनी सुगंधें” अथवा “सुखद सुगंधें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को स्पष्ट रखता है।
- source_word: מַלְכָּא נְבוּכַדְנֶצַּר
  choice: राजा नबूकदनेस्सर
  rationale: उपाधि और नाम के इस संयोजन का आधुनिक हिन्दी में यही स्वाभाविक रूप है।
- source_word: נְפַל עַל אַנְפּוֹהִי
  choice: मुँह के बल गिर पड़ा
  rationale: मूल की सजीव शारीरिक मुद्रा को मुहावरेदार और स्पष्ट हिन्दी में सुरक्षित रखा गया है।
- source_word: סְגִד
  choice: दंडवत किया
  rationale: यह क्रिया भूमि पर झुकने, गहरी श्रद्धा प्रकट करने या आराधना करने का अर्थ दे सकती है। ‘दंडवत किया’ बाहरी क्रिया और अत्यधिक आदर को व्यक्त करता है, पर दानिय्येल को ईश्वर मानकर उसकी आराधना किए जाने का निष्कर्ष अनावश्यक रूप से नहीं थोपता।
- source_word: מִנְחָה
  choice: भेंट
  rationale: इस शब्द में उपहार और बलिदानी चढ़ावे दोनों का अर्थ हो सकता है; प्रसंग में ‘भेंट’ पर्याप्त व्यापक है और धार्मिक रंग भी बनाए रखता है।
- source_word: נִיחֹחִין
  choice: सुगंध-द्रव्य
  rationale: शब्द का अधिक शाब्दिक अर्थ सुखद या मनभावनी सुगंधों से जुड़ा है। बलिदानी प्रसंग में ‘सुगंध-द्रव्य’ स्वाभाविक है, पर पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
- source_word: אֲמַר לְנַסָּכָה לֵהּ
  choice: आज्ञा दी कि उसके लिए … चढ़ाए जाएँ
  rationale: ‘कहा’ यहाँ आदेश का भाव देता है। मूल क्रिया अधिक विशिष्ट रूप से उंडेलने या अर्घ चढ़ाने की ओर संकेत करती है, किन्तु संयुक्त वस्तुओं के साथ ‘चढ़ाए जाएँ’ सहज हिन्दी है; विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दानिय्येल के प्रति סְגִד को ‘आराधना की’ कहना या कम धर्मवैचारिक रूप से निर्णायक अभिव्यक्ति चुनना
  choice: दंडवत किया
  alternative: उसकी आराधना की; उसके सामने झुका
  rationale: अरामी क्रिया प्रणाम, श्रद्धापूर्ण दंडवत या आराधना का अर्थ दे सकती है। ‘दंडवत किया’ राजा की चरम श्रद्धा और शारीरिक मुद्रा को बनाए रखता है, लेकिन यह निश्चित नहीं करता कि दानिय्येल को दिव्य मानकर उसकी आराधना की गई थी। इस प्रकार मूल का धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दंडवत किया’ पारंपरिक धार्मिक शब्द होते हुए भी आज समझ में आता है और मूल की शारीरिक मुद्रा तथा श्रद्धा—दोनों को संक्षेप में व्यक्त करता है।
