  text: וְ֠/הוּא מְהַשְׁנֵ֤א עִדָּנַיָּ/א֙ וְ/זִמְנַיָּ֔/א מְהַעְדֵּ֥ה מַלְכִ֖ין וּ/מְהָקֵ֣ים מַלְכִ֑ין יָהֵ֤ב חָכְמְתָ/א֙ לְ/חַכִּימִ֔ין וּ/מַנְדְּעָ֖/א לְ/יָדְעֵ֥י בִינָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/021.yaml
  text: He changes times and seasons[a]; he removes kings and sets up kings[b]; he gives wisdom to the wise and knowledge to those who have understanding.
translation:
  language: hi
  text: वह समयों और नियत अवसरों[a] को बदलता है; राजाओं को हटाता और राजाओं को स्थापित करता है; बुद्धिमानों को बुद्धि और समझ रखने वालों को ज्ञान देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नियत अवसरों’ के स्थान पर ‘ऋतुएँ’ भी संभव हैं। अरामी शब्द-युग्म सामान्य समयों और उनके उपयुक्त या निर्धारित अवसरों—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהַשְׁנֵא
  choice: बदलता है
  rationale: यह कारक क्रिया परिवर्तन कराने या बदलने का सक्रिय अर्थ देती है; हिन्दी में ‘बदलता है’ स्वाभाविक और सीधा है।
- source_word: עִדָּנַיָּא וְזִמְנַיָּא
  choice: समयों और नियत अवसरों
  rationale: पहला पद सामान्य समयों या अवधियों को और दूसरा उपयुक्त अथवा निर्धारित अवसरों को सूचित कर सकता है। यह युग्म दोनों निकट अर्थों के बीच का अंतर बनाए रखता है।
- source_word: מְהַעְדֵּה
  choice: हटाता है
  rationale: क्रिया का व्यापक अर्थ दूर करना या हटा देना है। राजाओं के संदर्भ में ‘पदच्युत करता है’ संभव है, पर वह राजनीतिक अर्थ को अधिक स्पष्ट करके मूल की व्यापकता घटाता है।
- source_word: מַלְכִין
  choice: राजाओं
  rationale: बहुवचन संज्ञा का सीधा और सामान्य हिन्दी रूप।
- source_word: מְהָקֵים
  choice: स्थापित करता है
  rationale: क्रिया उठाने, खड़ा करने या स्थापित करने का अर्थ देती है। राजाओं के संदर्भ में ‘स्थापित करता है’ स्वाभाविक है और मूल के सक्रिय भाव को रखता है।
- source_word: יָהֵב
  choice: देता है
  rationale: देने के लिए प्रयुक्त सामान्य अरामी क्रिया का सरल और सीधा अनुवाद।
- source_word: חָכְמְתָא לְחַכִּימִין
  choice: बुद्धिमानों को बुद्धि
  rationale: एक ही शब्द-परिवार की संज्ञा और विशेषण-संज्ञा के संबंध को हिन्दी में ‘बुद्धि/बुद्धिमान’ से सुरक्षित रखा गया है।
- source_word: מַנְדְּעָא
  choice: ज्ञान
  rationale: यह पद ज्ञान को व्यक्त करता है; इसे ‘ज्ञान’ कहने से बाद के בִינָה अर्थात समझ से भेद बना रहता है।
- source_word: לְיָדְעֵי בִינָה
  choice: समझ रखनेवालों को
  rationale: शाब्दिक संरचना ‘समझ को जाननेवालों’ जैसी है। ‘समझ रखनेवाले’ आधुनिक हिन्दी में स्वाभाविक है और ऐसे लोगों का बोध कराता है जो समझ से युक्त हैं।
theological_decisions:
- issue: राजनीतिक शासकों पर परमेश्वर की प्रभुता
  choice: राजाओं को हटाने और स्थापित करने की क्रियाएँ सीधे उसी के विषय में कही गई हैं।
  alternative: वह राजाओं के उठने और गिरने की केवल अनुमति देता है।
  rationale: अरामी पाठ दोनों क्रियाओं का कर्ता स्पष्ट रूप से उसी को बनाता है। अनुवाद इस प्रबल कथन को बनाए रखता है, पर उसके कार्य करने की दार्शनिक या तंत्रगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय और काव्यात्मक समानांतरता वाला रूप। आरम्भ में ‘वही’ की पुनरावृत्ति अरामी के स्पष्ट कर्ता और वाक्य की लय पर बल देती है। ‘समझ रखनेवालों’ को शाब्दिक ‘समझ को जाननेवालों’ की अपेक्षा स्वाभाविक हिन्दी के लिए चुना गया है।
