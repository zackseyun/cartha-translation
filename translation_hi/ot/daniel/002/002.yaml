base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/002.yaml
  text: Then the king ordered the magicians[a], the enchanters, the sorcerers, and the Chaldeans to tell the king his dreams[b]. So they came and stood before the king.
translation:
  language: hi
  text: तब राजा ने जादूगरों, मंत्र-साधकों, टोना करने वालों और कसदियों[b] को बुलाने की आज्ञा दी[a], ताकि वे राजा को उसके स्वप्न बताएँ। तब वे आकर राजा के सामने खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘राजा ने बुलाने को कहा’ है; इस प्रयोग का अर्थ है कि उसने उन्हें बुलाने की आज्ञा दी।
    reason: lexical_alternative
  - marker: b
    text: ‘कसदी’ से कसदी जाति के लोग अभिप्रेत हो सकते हैं या इस प्रसंग में बाबेली राजदरबार के विद्वान विशेषज्ञों का एक वर्ग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... לִקְרֹא
  choice: बुलाने की आज्ञा दी
  rationale: शाब्दिक रूप से यह ‘बुलाने को कहा’ है, पर इस राजकीय संदर्भ में रचना आदेश देने का भाव व्यक्त करती है। हिंदी में यह चयन स्वाभाविक रहते हुए बुलाने और आदेश—दोनों अर्थों को सुरक्षित रखता है।
- source_word: חַרְטֻמִּים
  choice: जादूगरों
  rationale: यह शब्द राजदरबार से जुड़े जादू-विद्या अथवा शकुन-विचार के विशेषज्ञों को सूचित करता है। ‘जादूगर’ सामान्य आधुनिक पाठक के लिए स्पष्ट और सुलभ है।
- source_word: אַשָּׁפִים
  choice: मंत्र-साधकों
  rationale: इस पद का ठीक-ठीक विशेषार्थ अनिश्चित है, पर यह गूढ़ अथवा मंत्र-संबंधी विद्या के विशेषज्ञों का एक अलग वर्ग सूचित करता है। ‘मंत्र-साधक’ इसे जादूगरों और टोना करने वालों से अलग रखते हुए अनावश्यक रूप से ‘ज्योतिषी’ नहीं बनाता।
- source_word: מְכַשְּׁפִים
  choice: टोना करने वालों
  rationale: मूल धातु जादू-टोना करने को सूचित करती है। यह सहज आधुनिक हिंदी है और अन्य दरबारी विशेषज्ञों से इस वर्ग का भेद भी बनाए रखती है।
- source_word: כַּשְׂדִּים
  choice: कसदियों
  rationale: 'लिप्यंतरित जातीय नाम मूल की अस्पष्टता बनाए रखता है: इसका संकेत कसदी जाति की ओर भी हो सकता है और इस प्रसंग में बाबेली दरबार के विद्वान विशेषज्ञों के एक वर्ग की ओर भी।'
- source_word: לְהַגִּיד לַמֶּלֶךְ חֲלֹמֹתָיו
  choice: ताकि वे राजा को उसके स्वप्न बताएँ
  rationale: उद्देश्यसूचक infinitive को हिंदी में ‘ताकि’ से स्वाभाविक बनाया गया है। बहुवचन ‘स्वप्न’ और राजा की ओर संकेत करने वाला सर्वनाम दोनों सुरक्षित हैं।
- source_word: וַיָּבֹאוּ וַיַּעַמְדוּ לִפְנֵי הַמֶּלֶךְ
  choice: तब वे आकर राजा के सामने खड़े हो गए
  rationale: यह मूल की क्रमिक कथात्मक क्रियाओं को सहज हिंदी में व्यक्त करता है और राजकीय उपस्थिति का दृश्य बनाए रखता है।
