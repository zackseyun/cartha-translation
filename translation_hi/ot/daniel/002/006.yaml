  text: וְ/הֵ֨ן חֶלְמָ֤/א וּ/פִשְׁרֵ/הּ֙ תְּֽהַחֲוֺ֔ן מַתְּנָ֤ן וּ/נְבִזְבָּה֙ וִ/יקָ֣ר שַׂגִּ֔יא תְּקַבְּל֖וּן מִן קֳדָמָ֑/י לָהֵ֕ן חֶלְמָ֥/א וּ/פִשְׁרֵ֖/הּ הַחֲוֺֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/006.yaml
  text: But if you make known the dream and its interpretation[a], you will receive from me gifts and rewards and great honor. Therefore make known to me the dream and its interpretation.
translation:
  language: hi
  text: परन्तु यदि तुम मुझे स्वप्न और उसका अर्थ बता दोगे[a], तो तुम मुझसे उपहारों, पुरस्कारों और बहुत सम्मान पाओगे। इसलिए मुझे स्वप्न और उसका अर्थ बताओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ज्ञात करा दोगे’ या ‘घोषित कर दोगे।’ यहाँ और वाक्य के अंत में प्रयुक्त अरामी क्रिया का अर्थ ‘बताना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵן
  choice: परन्तु यदि
  rationale: यह पद 5 की धमकी के विपरीत एक शर्त प्रस्तुत करता है; ‘परन्तु यदि’ संयोजक और शर्त—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶלְמָא
  choice: स्वप्न
  rationale: राजा पहले से चर्चा में आए एक निश्चित स्वप्न की बात कर रहा है; हिन्दी में प्रसंग से निश्चितता स्पष्ट है।
- source_word: וּפִשְׁרֵהּ
  choice: और उसका अर्थ
  rationale: פשר स्वप्न की व्याख्या अथवा अर्थ को सूचित करता है। ‘उसका अर्थ’ सामान्य पाठक के लिए सहज है और मूल आशय को ठीक रखता है।
- source_word: תְּהַחֲוֺן / הַחֲוֺנִי
  choice: बता दोगे / बताओ
  rationale: חוה के हफ़एल रूप का अर्थ ‘ज्ञात कराना, घोषित करना’ है। प्रसंग में ‘बताना’ स्वाभाविक आधुनिक हिन्दी है; दोनों प्रयोगों में मूल क्रिया की पुनरावृत्ति बनी रहती है।
- source_word: מַתְּנָן
  choice: उपहार
  rationale: बहुवचन संज्ञा मूल्यवान भेंटों को सूचित करती है; हिन्दी में ‘उपहार’ रूप संख्या की दृष्टि से संदर्भानुकूल और स्वाभाविक है।
- source_word: וּנְבִזְבָּה
  choice: पुरस्कार
  rationale: यह राजकीय इनाम या प्रतिफल का द्योतक है। ‘पुरस्कार’ प्रतिष्ठित और सामान्य आधुनिक हिन्दी में उपयुक्त है।
- source_word: וִיקָר שַׂגִּיא
  choice: और बड़ा सम्मान
  rationale: יְקָר प्रतिष्ठा/सम्मान और שַׂגִּיא उसकी प्रचुरता या महानता बताता है; ‘बड़ा सम्मान’ सहज रूप से बलाघात सुरक्षित रखता है।
- source_word: תְּקַבְּלוּן
  choice: पाओगे
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण रूप यहाँ शर्त के परिणाम में भविष्य का अर्थ देता है; ‘पाओगे’ सीधी और स्वाभाविक हिन्दी है।
- source_word: מִן קֳדָמַי
  choice: मुझसे
  rationale: अरामी मुहावरा यहाँ राजा को प्रदान करने वाले स्रोत के रूप में दिखाता है; ‘मुझसे’ इसका मुहावरेदार हिन्दी रूप है।
- source_word: לָהֵן
  choice: इसलिए
  rationale: यह प्रतिज्ञात प्रतिफल से अगले आदेश की ओर निष्कर्षात्मक संबंध दिखाता है।
