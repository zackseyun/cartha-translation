source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּ֣קוּ כַ/חֲדָ֡ה פַּרְזְלָ/א֩ חַסְפָּ֨/א נְחָשָׁ֜/א כַּסְפָּ֣/א וְ/דַהֲבָ֗/א וַ/הֲווֹ֙ כְּ/ע֣וּר מִן אִדְּרֵי קַ֔יִט וּ/נְשָׂ֤א הִמּוֹן֙ רוּחָ֔/א וְ/כָל אֲתַ֖ר לָא הִשְׁתֲּכַ֣ח לְ/ה֑וֹן וְ/אַבְנָ֣/א דִּֽי מְחָ֣ת לְ/צַלְמָ֗/א הֲוָ֛ת לְ/ט֥וּר רַ֖ב וּ/מְלָ֥ת כָּל אַרְעָֽ/א־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/035.yaml
  text: Then the iron[a], the clay, the bronze, the silver, and the gold were crushed all at once and became like chaff from the summer threshing floors, and the wind carried them away so that no place was found for them[c][b]. But the stone that struck the statue became a great mountain and filled the whole earth.
translation:
  language: hi
  text: तब लोहा, मिट्टी, काँसा, चाँदी और सोना—सब एक साथ चूर-चूर हो गए और गर्मियों के खलिहानों की भूसी के समान हो गए। हवा उन्हें उड़ा ले गई, और उनके लिए कहीं कोई स्थान नहीं मिला। पर जिस पत्थर ने उस मूर्ति को मारा था, वह एक विशाल पर्वत बन गया और उसने सारी पृथ्वी को भर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को प्रस्तुत करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: דָּקוּ כַחֲדָה
  choice: सब एक साथ चूर-चूर हो गए
  rationale: क्रिया पदार्थों के बलपूर्वक टूटकर बारीक हो जाने को और כַחֲדָה उनके एक साथ ऐसा होने को व्यक्त करता है।
- source_word: פַּרְזְלָא חַסְפָּא נְחָשָׁא כַּסְפָּא וְדַהֲבָא
  choice: लोहा, मिट्टी, काँसा, चाँदी और सोना
  rationale: मूर्ति के पदार्थों की निश्चित सूची को उसी क्रम में सरल आधुनिक हिन्दी में रखा गया है; נְחָשָׁא के लिए प्रसंगानुकूल ‘काँसा’ चुना गया है।
- source_word: כְּעוּר מִן אִדְּרֵי קַיִט
  choice: गर्मियों के खलिहानों की भूसी के समान
  rationale: अरामी उपमा सूखे मौसम में खलिहान से हवा में उड़ जाने वाले हल्के अवशेष की है; ‘भूसी’ साधारण हिन्दी में यह चित्र स्पष्ट करती है।
- source_word: וּנְשָׂא הִמּוֹן רוּחָא
  choice: हवा उन्हें उड़ा ले गई
  rationale: हवा कर्ता है और पदार्थ उसके द्वारा पूरी तरह हटा दिए जाते हैं; ‘उड़ा ले गई’ दृश्य को सहज रूप से व्यक्त करता है।
- source_word: וְכָל אֲתַר לָא הִשְׁתֲּכַח לְהוֹן
  choice: उनका कहीं कोई निशान तक न मिला
  rationale: शाब्दिक अर्थ ‘उनके लिए कोई स्थान न मिला’ है; प्रसंग में यह उनके पूर्णतः लुप्त हो जाने का मुहावरा है, जिसे वर्तमान हिन्दी में यह वाक्य स्वाभाविक रूप से प्रकट करता है।
- source_word: הֲוָת לְטוּר רַב
  choice: एक विशाल पर्वत बन गया
  rationale: רַב आकार की महानता बताता है; ‘विशाल पर्वत’ स्पष्ट और गरिमापूर्ण है।
- source_word: וּמְלָת כָּל אַרְעָא
  choice: सारी पृथ्वी पर फैल गया
  rationale: क्रिया का मूल भाव भर देना है; पर्वत के बिंब के साथ ‘सारी पृथ्वी पर फैल गया’ स्वाभाविक हिन्दी है और व्यापक क्षेत्र को व्यक्त करता है।
theological_decisions:
- issue: אַרְעָא का दायरा
  choice: पृथ्वी
  alternative: देश/भूमि
  rationale: शब्द ‘भूमि’ या ‘देश’ भी हो सकता है, पर इस दर्शन में पर्वत के सार्वभौमिक विस्तार के कारण ‘पृथ्वी’ व्यापक दायरे को बेहतर व्यक्त करता है।
- issue: पत्थर से पहले וְ का संबंध
  choice: पर
  alternative: और
  rationale: मूल संयोजक सामान्यतः ‘और’ है, किंतु यहाँ मिट जाने वाली मूर्ति और बढ़ने वाले पत्थर के बीच स्पष्ट विरोध है; ‘पर’ उस विमर्शगत संबंध को स्वाभाविक हिन्दी में प्रकट करता है।
- issue: מְלָת का रूपक
  choice: सारी पृथ्वी पर फैल गया
  alternative: सारी पृथ्वी को भर दिया
  rationale: ‘भर दिया’ अधिक औपचारिक रूप से निकट है; ‘फैल गया’ पर्वत के बढ़कर व्यापक हो जाने के दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके प्रतीक की पहचान समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। धातुओं और कृषि-बिंब के लिए आम पाठक को समझ आने वाले शब्द चुने गए हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
