  text: וּ/מַלְכוּ֙ רביעיה תֶּהֱוֵ֥א תַקִּיפָ֖ה כְּ/פַרְזְלָ֑/א כָּ/ל קֳבֵ֗ל דִּ֤י פַרְזְלָ/א֙ מְהַדֵּ֤ק וְ/חָשֵׁל֙ כֹּ֔לָּ/א וּֽ/כְ/פַרְזְלָ֛/א דִּֽי מְרָעַ֥ע כָּל אִלֵּ֖ין תַּדִּ֥ק וְ/תֵרֹֽעַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/040.yaml
  text: And the fourth kingdom will be strong like iron[a], because iron crushes and shatters everything; and like iron that breaks all these things[b], it will crush and shatter.
translation:
  language: hi
  text: और चौथा राज्य[a] लोहे के समान शक्तिशाली होगा, क्योंकि लोहा सब कुछ कुचलता और चूर-चूर करता है; और जिस प्रकार लोहा इन सबको[b] तोड़ता है, उसी प्रकार वह इन सबको कुचलकर चूर-चूर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एक चौथा राज्य।” अरामी में निश्चित उपपद नहीं है, यद्यपि प्रसंग में यह क्रम का चौथा राज्य है।
    reason: lexical_alternative
  - marker: b
    text: “इन सब” से सम्भवतः मूर्ति के दर्शन में दर्शाए गए पहले के राज्यों का संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: וּמַלְכוּ רביעיה
  choice: और चौथा राज्य
  rationale: וּ क्रम को आगे बढ़ाता है और רביעיה राज्य को चौथे स्थान पर रखता है। अरामी में निश्चित उपपद नहीं है, इसलिए ‘एक चौथा राज्य’ भी व्याकरणतः संभव है; इसे पादटिप्पणी में रखा गया है।
- source_word: תֶּהֱוֵא
  choice: होगा
  rationale: बाइबिलीय अरामी का अपूर्ण रूप यहाँ भावी अवस्था व्यक्त करता है।
- source_word: תַקִּיפָה
  choice: शक्तिशाली
  rationale: यह विशेषण बल और प्रबलता व्यक्त करता है; राज्य के लिए ‘शक्तिशाली’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: כְּפַרְזְלָא
  choice: लोहे के समान
  rationale: तुलनात्मक उपसर्ग כְ को स्पष्ट और गरिमापूर्ण हिन्दी उपमा के रूप में प्रस्तुत किया गया है।
- source_word: כָּל קֳבֵל דִּי
  choice: क्योंकि
  rationale: यह पदबंध लोहे से की गई तुलना का कारण प्रस्तुत करता है।
- source_word: מְהַדֵּק וְחָשֵׁל כֹּלָּא
  choice: सब कुछ चूर-चूर कर तोड़ डालता है
  rationale: दोनों क्रियाओं की तीव्र विनाशकारी शक्ति और उनका युग्म सुरक्षित रखा गया है; ‘चूर-चूर’ कुचलने को और ‘तोड़ डालता’ विखंडन को व्यक्त करता है।
- source_word: וּכְפַרְזְלָא דִּי מְרָעַע
  choice: और जिस प्रकार लोहा ... तोड़ देता है
  rationale: दूसरी लौह-उपमा को स्वाभाविक हिन्दी में रखा गया है और מְרָעַע का तोड़ने/खंडित करने का अर्थ सुरक्षित है।
- source_word: כָּל אִלֵּין
  choice: इन सबको
  rationale: संकेतवाचक अभिव्यक्ति को जानबूझकर खुला रखा गया है; इसका संभावित संदर्भ पादटिप्पणी में बताया गया है।
- source_word: תַּדִּק וְתֵרֹעַ
  choice: उन्हें चूर-चूर करके तोड़ डालेगा
  rationale: दो निकटार्थी किंतु अलग विनाशकारी क्रियाओं का संचयी प्रभाव बनाए रखा गया है और हिन्दी में कर्म को संदर्भ से स्पष्ट किया गया है।
theological_decisions:
- issue: ‘इन सब’ का संदर्भ
  choice: मुख्य पाठ में संदर्भ को अनिर्धारित रखा गया है
  alternative: इसे सीधे ‘पहले के राज्यों’ के रूप में अनूदित करना
  rationale: अरामी पाठ केवल ‘इन सब’ कहता है। पहले वर्णित राज्यों की ओर संकेत संभव और प्रबल है, पर उसे मुख्य पाठ में स्पष्ट कर देना मूल की सांकेतिक खुली प्रकृति को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। विनाश की पुनरुक्त और तीव्र छवि को घटाए बिना ‘चूर-चूर’ तथा ‘तोड़’ के युग्म से अरामी क्रियाओं का संचयी बल व्यक्त किया गया है।
