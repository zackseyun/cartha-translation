base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/023.yaml
  text: To you[a], O God of my fathers, I give thanks and praise, because you have given me wisdom and might, and now you have made known to me what we requested from you[c][b], for you have made known to us the king’s matter.
translation:
  language: hi
  text: हे मेरे पूर्वजों के परमेश्वर, मैं तेरा धन्यवाद देता और तेरी स्तुति करता हूँ, क्योंकि तूने मुझे बुद्धि और सामर्थ्य दिया है, और अब तूने मुझे वह बता दिया है जो हमने तुझसे माँगा था, क्योंकि तूने हमें राजा का विषय बता दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “राजा का विषय” का अनुवाद “राजा की बात” या “राजा का मामला” भी हो सकता है। अरामी शब्द व्यापक है और राजा द्वारा सामने रखी गई बात को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלָהּ אֲבָהָתִי
  choice: मेरे पूर्वजों के परमेश्वर
  rationale: अक्षरशः ‘मेरे पितरों का परमेश्वर’; आधुनिक हिन्दी में ‘पूर्वजों’ से वंशगत और वाचागत निरन्तरता स्वाभाविक रूप से व्यक्त होती है, जबकि ‘पितरों’ से अनचाहा पारिभाषिक या कर्मकाण्डीय अर्थ जुड़ सकता है।
- source_word: מְהוֹדֵא וּמְשַׁבַּח אֲנָה
  choice: मैं तेरा धन्यवाद और स्तुति करता हूँ
  rationale: दोनों समन्वित कृदन्तों—धन्यवाद देना और स्तुति करना—को अलग रखते हुए हिन्दी प्रार्थना की स्वाभाविक अभिव्यक्ति अपनाई गई है।
- source_word: חָכְמְתָא וּגְבוּרְתָא
  choice: बुद्धि और सामर्थ्य
  rationale: חָכְמְתָא के लिए ‘बुद्धि’ और גְבוּרְתָא के लिए ‘सामर्थ्य’ मानसिक या शारीरिक बल तक सीमित किए बिना प्रदत्त योग्यता और शक्ति का अर्थ देते हैं।
- source_word: יְהַבְתְּ לִי
  choice: तूने मुझे ... दिया है
  rationale: अरामी सिद्ध क्रिया को वर्तमान प्रासंगिकता वाले पूर्ण कार्य के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: הוֹדַעְתַּנִי
  choice: तूने मुझे ... बता दिया है
  rationale: ידע के कारक रूप का मूल अर्थ ‘ज्ञात कराना’ है। ‘बता दिया’ आधुनिक और सुबोध है तथा अगले समान क्रियारूप की पुनरावृत्ति बनाए रखता है।
- source_word: דִּי בְעֵינָא מִנָּךְ
  choice: जो हमने तुझसे माँगा था
  rationale: पहले पुरुष बहुवचन को सुरक्षित रखा गया है। בעא के माँगने/खोजने के अर्थ में इस प्रार्थना-सन्दर्भ में ‘माँगा’ सर्वाधिक स्वाभाविक है।
- source_word: מִלַּת מַלְכָּא
  choice: राजा का विषय
  rationale: מִלָּה का अर्थ ‘वचन’, ‘बात’ या ‘मामला’ हो सकता है। ‘विषय’ राजा द्वारा सामने रखी गई बात को व्यापक रखता है और स्वप्न तथा उसके अर्थ को पाठ से अधिक स्पष्ट नहीं करता।
- source_word: הוֹדַעְתֶּנָא
  choice: तूने हमें ... बता दिया है
  rationale: पहले पुरुष बहुवचन प्रत्यय को ठीक प्रकार बनाए रखा गया है; प्रकाशना केवल दानिय्येल को नहीं, प्रार्थना करने वाले समूह को दी गई मानी जाती है।
theological_decisions:
- issue: परमेश्वर के सम्बोधन में वंशगत/वाचागत भाषा
  choice: हे मेरे पूर्वजों के परमेश्वर
  alternative: हे मेरे पितरों के परमेश्वर
  rationale: मूल की ऐतिहासिक और पारिवारिक निरन्तरता सुरक्षित है, पर आधुनिक हिन्दी में सम्भावित कर्मकाण्डीय अर्थ से बचा गया है।
- issue: पद के उत्तरार्ध में एकवचन और बहुवचन का तनाव
  choice: मुझे ... जो हमने ... हमें
  alternative: मुझे ... जो मैंने ... मुझे
  rationale: अरामी पाठ जानबूझकर एकवचन से बहुवचन में जाता है। इसे बनाए रखने से दानिय्येल की व्यक्तिगत प्राप्ति और उसके साथियों की सामूहिक प्रार्थना दोनों व्यक्त होते हैं।
- issue: מִלַּת מַלְכָּא का अर्थ-क्षेत्र
  choice: राजा का विषय
  alternative: राजा की बात
  rationale: ‘विषय’ शब्द मूल की व्यापकता को बनाए रखता है और पद में स्पष्ट रूप से न कही गई व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज प्रार्थना-रजिस्टर अपनाया गया है। परमेश्वर के लिए निकट सम्बोधन ‘तू’ रखा गया है; एकवचन और बहुवचन सर्वनामों का मूल पाठानुसार परिवर्तन सुरक्षित है।
