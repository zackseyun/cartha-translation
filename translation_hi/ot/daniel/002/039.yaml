id: DAN.2.39
reference: Daniel 2:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָתְרָ֗/ךְ תְּק֛וּם מַלְכ֥וּ אָחֳרִ֖י ארע/א מִנָּ֑/ךְ וּ/מַלְכ֨וּ תליתיא אָחֳרִי֙ דִּ֣י נְחָשָׁ֔/א דִּ֥י תִשְׁלַ֖ט בְּ/כָל אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/039.yaml
  text: And after you another kingdom[a], inferior to yours, will arise; and yet a third kingdom, of bronze[b], which will rule over all the earth.
translation:
  language: hi
  text: और तेरे बाद एक और राज्य उठ खड़ा होगा, जो तेरे राज्य से कमतर होगा[a]; फिर एक तीसरा राज्य होगा, जो काँसे का होगा और सारी पृथ्वी पर शासन करेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझसे नीचे।” अरामी पदबंध कठिन है; आशय संभवतः यह है कि अगला राज्य नबूकदनेस्सर के राज्य से पद या वैभव में कम होगा।
    reason: lexical_alternative
  - marker: b
    text: या, “सारी भूमि पर।” अरामी शब्द का अर्थ “पृथ्वी” या “भूमि/देश” दोनों हो सकता है; यहाँ संभवतः व्यापक साम्राज्यवादी प्रभुत्व का आशय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָתְרָךְ
  choice: और तेरे बाद
  rationale: यह पदबंध नबूकदनेस्सर के बाद समय और राजकीय उत्तराधिकार को दर्शाता है; एकवचन आत्मीय/प्रत्यक्ष संबोधन के अनुरूप ‘तेरे’ रखा गया है।
- source_word: תְּקוּם
  choice: उठ खड़ा होगा
  rationale: क्रिया का मूल बिंब ‘उठना/खड़ा होना’ है और यहाँ किसी राज्य के उदय को सूचित करता है; यह हिंदी में स्वाभाविक रहते हुए स्रोत की छवि भी बनाए रखता है।
- source_word: מַלְכוּ אָחֳרִי
  choice: एक और राज्य
  rationale: מַלְכוּ यहाँ शासन करने की क्रिया से अधिक एक राजकीय सत्ता या साम्राज्य का बोध कराता है, और אָחֳרִי क्रम में आने वाले भिन्न राज्य को दर्शाता है।
- source_word: ארעא מִנָּךְ
  choice: जो तेरे राज्य से कमतर होगा
  rationale: अरामी पदबंध कठिन है। संदर्भ में यह अगले राज्य की तुलनात्मक हीनता दर्शाता प्रतीत होता है; ‘तेरे राज्य’ कहने से तुलना व्यक्ति के बजाय उसकी राजसत्ता से स्पष्ट होती है।
- source_word: וּמַלְכוּ תליתיא
  choice: फिर एक तीसरा राज्य
  rationale: संयोजक क्रम को आगे बढ़ाता है; ‘फिर’ आधुनिक हिंदी में उत्तराधिकार को सहज रूप से व्यक्त करता है।
- source_word: דִּי נְחָשָׁא
  choice: जो काँसे का होगा
  rationale: यह तीसरे राज्य को मूर्ति के काँसे वाले भाग से जोड़ता है। ‘काँसा’ נְחָשָׁא के धातु-संदर्भ का स्वाभाविक हिंदी रूप है।
- source_word: דִּי תִשְׁלַט
  choice: शासन करेगा
  rationale: क्रिया प्रभुत्व या अधिकार चलाने का अर्थ देती है; ‘शासन करेगा’ स्पष्ट और गरिमापूर्ण आधुनिक हिंदी है।
- source_word: בְּכָל אַרְעָא
  choice: सारी पृथ्वी पर
  rationale: אַרְעָא का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। यहाँ विश्व-साम्राज्य के व्यापक दावे के संदर्भ में ‘सारी पृथ्वी’ मुख्य पाठ में उपयुक्त है, जबकि विकल्प टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ארעא מִנָּךְ का तुलनात्मक अर्थ
  choice: तेरे राज्य से कमतर
  alternative: तुझसे नीचे
  rationale: वाक्य-विन्यास असामान्य है, पर धातुओं के क्रम और राजकीय संदर्भ में अगले राज्य की पद, महिमा या वैभव में हीनता सबसे संभावित अर्थ है। अनुवाद किसी विशेष ऐतिहासिक साम्राज्य की पहचान नहीं जोड़ता।
- issue: בְּכָל אַרְעָא का विस्तार
  choice: सारी पृथ्वी पर
  alternative: सारे देश पर / सारी भूमि पर
  rationale: अरामी शब्द दोनों अर्थ दे सकता है। व्यापक साम्राज्यवादी भाषा मुख्य पाठ के चयन का समर्थन करती है, पर वास्तविक भाषिक अस्पष्टता फुटनोट में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली अपनाई गई है। राजकीय उत्तराधिकार स्पष्ट रखा गया है और कठिन अरामी अभिव्यक्ति तथा ‘पृथ्वी/भूमि’ की वास्तविक अस्पष्टता फुटनोटों में सुरक्षित की गई है।
