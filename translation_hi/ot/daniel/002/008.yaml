  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר מִן יַצִּיב֙ יָדַ֣ע אֲנָ֔ה דִּ֥י עִדָּנָ֖/א אַנְתּ֣וּן זָבְנִ֑ין כָּ/ל קֳבֵל֙ דִּ֣י חֲזֵית֔וֹן דִּ֥י אַזְדָּ֖א מִנִּ֥/י מִלְּתָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/008.yaml
  text: The king answered and said[a], “I know for certain that you are trying to gain time, because you have seen that the matter has gone from me.”
translation:
  language: hi
  text: राजा ने उत्तर दिया, “मैं निश्चित रूप से जानता हूँ कि तुम लोग समय पाने की कोशिश कर रहे हो, क्योंकि तुमने देख लिया है कि वह बात मुझसे चली गई है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वचन मुझसे निकल गया है,” “बात मुझे याद नहीं रही,” अथवा संभवतः “मेरी ओर से आदेश अटल है।” अरामी वाक्यांश संक्षिप्त है और इस प्रसंग में उसके एक से अधिक अर्थ समझे गए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: מִן יַצִּיב
  choice: निश्चय
  rationale: यह अरामी मुहावरा दृढ़ निश्चितता व्यक्त करता है; ‘निश्चय’ आधुनिक और गरिमापूर्ण हिन्दी में राजा के दावे का बल बनाए रखता है।
- source_word: יָדַע אֲנָה
  choice: मैं ... जानता हूँ
  rationale: यह प्रथम पुरुष एकवचन का सीधा ज्ञानवाचक कथन है।
- source_word: עִדָּנָא אַנְתּוּן זָבְנִין
  choice: तुम लोग समय टाल रहे हो
  rationale: शाब्दिक रूप से ‘समय खरीद रहे हो’; प्रसंग में इसका स्वाभाविक हिन्दी अर्थ जानबूझकर विलंब करना या समय टालना है। बहुवचन ‘तुम लोग’ अरामी बहुवचन को स्पष्ट करता है।
- source_word: כָּל־קֳבֵל דִּי
  choice: क्योंकि
  rationale: यह संयोजक राजा के आरोप का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: חֲזֵיתוֹן
  choice: तुमने देख लिया है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित व्यक्त करता है और यहाँ ‘समझ गए हो’ का संकेत भी रहने देता है।
- source_word: אַזְדָּא מִנִּי
  choice: मेरे हाथ से निकल गई है
  rationale: ‘मुझसे चली गई’ का स्वाभाविक हिन्दी रूप है, जो किसी बात के राजा के वश या उपलब्धता से बाहर हो जाने का भाव देता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: מִלְּתָא
  choice: वह बात
  rationale: अरामी शब्द ‘वचन, बात, मामला, आदेश’ के अर्थ दे सकता है। ‘वह बात’ प्रसंगगत संदर्भ रखता है और उसे केवल स्वप्न या आदेश मानकर अस्पष्टता नहीं मिटाता।
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: राजा ने उत्तर दिया
  rationale: हिन्दी में ‘उत्तर दिया और कहा’ अनावश्यक रूप से दोहरावपूर्ण लगता है; एक स्वाभाविक कथन में दोनों अरामी क्रियाओं का संवादात्मक कार्य समाहित है।
theological_decisions:
- issue: מִלְּתָא / אַזְדָּא מִנִּי की अस्पष्टता
  choice: वह बात मेरे हाथ से निकल गई है
  alternative: वचन मुझसे निकल चुका है; बात मुझे याद नहीं रही; मेरी ओर से आदेश अटल है
  rationale: अरामी पदबंध संक्षिप्त और विवादित है। व्यापक प्रसंग को राजा के स्वप्न भूलने या उसके आदेश के अटल होने में से किसी एक अर्थ तक सीमित किए बिना मुख्य पाठ निकटस्थ अर्थ रखता है और पादटिप्पणी अन्य संभव पाठों को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण बाइबलीय कथन। ‘समय टाल रहे हो’ हिन्दी में मुहावरेदार है, जबकि पादटिप्पणी स्रोत की वास्तविक अर्थगत अस्पष्टता बनाए रखती है।
