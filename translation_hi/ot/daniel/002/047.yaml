base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/047.yaml
  text: The king answered Daniel and said[a], “Truly, your God is God of gods and Lord of kings, and a revealer of mysteries, because you were able to reveal this mystery.”
translation:
  language: hi
  text: राजा ने दानियेल को उत्तर दिया और कहा, “सचमुच, तुम्हारा परमेश्वर देवताओं का परमेश्वर और राजाओं का प्रभु है, और रहस्यों[a] को प्रकट करनेवाला है, क्योंकि तुम इस रहस्य को प्रकट कर सके।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुप्त बातों को प्रकट करनेवाला।” अरामी शब्द सामान्य रूप से छिपी हुई बातों को भी दर्शा सकता है; यहाँ ‘रहस्यों’ दानियेल में दिव्य प्रकाशन से प्रकट होनेवाली बातों की आवर्ती शब्दावली को बेहतर बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर दिया और कहा
  rationale: यह अरामी कथा-वर्णन का प्रचलित द्वि-क्रियात्मक सूत्र है; दोनों क्रियाओं को रखना मूल की अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִן קְשֹׁט
  choice: सचमुच
  rationale: यह पद सत्यता और निश्चय पर बल देता है; ‘सचमुच’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से emphatic है।
- source_word: אֱלָהֲכוֹן
  choice: तुम्हारा परमेश्वर
  rationale: रूप में प्रत्यय बहुवचन है और दानियेल तथा उसके साथियों से संबंधित परमेश्वर की ओर संकेत कर सकता है; सीधे संबोधन में ‘तुम्हारा परमेश्वर’ सहज हिन्दी है और आगे के सर्वोच्चता-सूचक कथन के अनुरूप है।
- source_word: אֱלָהּ אֱלָהִין
  choice: देवताओं का परमेश्वर
  rationale: यह संबंध-सूचक पदबंध अन्य देवताओं पर सर्वोच्चता व्यक्त करता है; हिन्दी बाइबलीय प्रयोग में यह स्पष्ट और गरिमापूर्ण है।
- source_word: וּמָרֵא מַלְכִין
  choice: और राजाओं का प्रभु
  rationale: מָרֵא का अर्थ स्वामी या प्रभु है; ‘प्रभु’ राजकीय और धर्मवैचारिक गरिमा बनाए रखता है।
- source_word: וְגָלֵה רָזִין
  choice: और रहस्यों को प्रकट करनेवाला
  rationale: कृदन्त परमेश्वर के विशिष्ट कार्य या गुण को व्यक्त करता है। यह हिन्दी रचना मूल के विधेयात्मक अर्थ को स्वाभाविक रूप में रखती है।
- source_word: רָזִין
  choice: रहस्यों
  rationale: दानियेल में רָז उन छिपी हुई बातों को दर्शाता है जो दिव्य प्रकाशन से खोली जाती हैं; ‘रहस्य’ इस आवर्ती विषयगत शब्दावली को सुरक्षित रखता है।
- source_word: דִּי יְכֵלְתָּ
  choice: क्योंकि तुम ... कर सके
  rationale: यह संयोजक राजा की स्वीकारोक्ति का आधार बताता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट करता है और क्रिया पुल्लिंग एकवचन दानियेल के अनुरूप है।
- source_word: לְמִגְלֵא רָזָה דְנָה
  choice: इस रहस्य को प्रकट
  rationale: ‘प्रकट’ पहले आए גלה के साथ शब्दगत संगति रखता है, और ‘इस रहस्य’ विशेष स्वप्न तथा उसके अर्थ की ओर संकेत करता है।
theological_decisions:
- issue: क्या नबूकदनेस्सर के कथन को पूर्ण एकेश्वरवादी परिवर्तन मानकर अनूदित किया जाए या सर्वोच्चता की सीमित स्वीकृति के रूप में
  choice: ‘तुम्हारा परमेश्वर देवताओं का परमेश्वर और राजाओं का प्रभु है’ के रूप में एक ऊँची स्वीकारोक्ति रखी गई है, पर अनन्य उपासना या स्थायी परिवर्तन नहीं जोड़ा गया।
  alternative: ‘केवल तुम्हारा परमेश्वर ही परमेश्वर है’ जैसी अधिक स्पष्ट एकेश्वरवादी व्याख्या, अथवा सर्वोच्चता को कमजोर करने वाला बहुदेववादी रूप।
  rationale: अरामी पाठ सर्वोच्चता-सूचक उपाधियों से दानियेल के परमेश्वर की महानता स्वीकार करता है, लेकिन यह स्पष्ट नहीं कहता कि राजा ने अन्य सभी देवताओं को त्याग दिया। अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर,’ ‘प्रभु,’ ‘रहस्य’ और ‘प्रकट करना’ जैसे परिचित बाइबलीय शब्द मूल की राजकीय तथा प्रकाशन-संबंधी ध्वनि को बनाए रखते हैं।
