  edition: WLC
  text: די חֲזַ֗יְתָ פַּרְזְלָ/א֙ מְעָרַב֙ בַּ/חֲסַ֣ף טִינָ֔/א מִתְעָרְבִ֤ין לֶהֱוֺן֙ בִּ/זְרַ֣ע אֲנָשָׁ֔/א וְ/לָֽא לֶהֱוֺ֥ן דָּבְקִ֖ין דְּנָ֣ה עִם דְּנָ֑ה הֵֽא כְ/דִ֣י פַרְזְלָ֔/א לָ֥א מִתְעָרַ֖ב עִם חַסְפָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/043.yaml
  text: As you saw the iron mixed with clay[a], they will mix themselves with the seed of man, but they will not hold together, this one with that one[c][b], just as iron does not mix with pottery.
translation:
  language: hi
  text: जैसा कि आपने लोहे को मिट्टी के साथ मिला हुआ देखा था, वे मनुष्य के बीज के साथ अपने आपको मिलाएँगे[a]; फिर भी वे एक-दूसरे से चिपके न रहेंगे[b], ठीक जैसे लोहा मिट्टी के बरतन के साथ मिश्रित नहीं होता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के बीज के साथ।” अनेक व्याख्याकार इसे आपसी विवाह से जोड़ते हैं, पर अरामी अभिव्यक्ति स्वयं अस्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यह इसके साथ”; अर्थात् “एक का दूसरे के साथ।”
    reason: lexical_alternative
  - marker: c
    text: अंतिम अरामी शब्द का अनुवाद “मिट्टी,” “मिट्टी का बरतन” या “ठीकरा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַיְתָ
  choice: आपने ... देखा था
  rationale: अरामी में द्वितीय पुरुष एकवचन का रूप नबूकदनेस्सर के दर्शन की ओर संकेत करता है; आदरसूचक ‘आप’ और पूर्ण भूतकाल स्वाभाविक हिन्दी देते हैं।
- source_word: פַּרְזְלָא
  choice: लोहा
  rationale: प्रतिमा के धातु-संबंधी बिंब के लिए मानक और सटीक हिन्दी शब्द।
- source_word: חֲסַף טִינָא
  choice: गीली मिट्टी
  rationale: संयुक्त पद मिट्टी/चिकनी मिट्टी जैसे पदार्थ को दर्शाता है। ‘गीली मिट्टी’ उसे पद के अंत में आए मिट्टी के बरतन से अलग रखते हुए पदार्थगत बिंब स्पष्ट करती है।
- source_word: מִתְעָרְבִין לֶהֱוֺן
  choice: अपने आपको मिलाएँगे
  rationale: रूप की आत्मवाचक अथवा मध्यवाचक छाया को बनाए रखता है; केवल ‘मिलेंगे’ कहने से यह छाया दब सकती थी।
- source_word: בִּזְרַע אֲנָשָׁא
  choice: मनुष्य के वंश के साथ
  rationale: शाब्दिक बिंब ‘मनुष्य का बीज’ है। हिन्दी में ‘वंश’ अधिक स्वाभाविक है, फिर भी अस्पष्टता बनाए रखता है और इसे सीधे विवाह-संबंध में नहीं बदलता।
- source_word: דָּבְקִין
  choice: चिपके न रहेंगे
  rationale: धातु का मूल अर्थ चिपकने अथवा जुड़े रहने का है; यह लोहे और मिट्टी के भौतिक बिंब को भी बनाए रखता है।
- source_word: דְּנָה עִם דְּנָה
  choice: एक-दूसरे से
  rationale: ‘यह उसके साथ’ की पारस्परिक और वितरणात्मक भावना का सहज आधुनिक हिन्दी रूप।
- source_word: חַסְפָּא
  choice: मिट्टी का बरतन
  rationale: यह पद मिट्टी, ठीकरा या मिट्टी के बने बरतन को सूचित कर सकता है। यहाँ आरंभिक गीली मिट्टी से हल्का lexical contrast बनाए रखने के लिए ‘मिट्टी का बरतन’ चुना गया है।
theological_decisions:
- issue: ‘मनुष्य के वंश के साथ अपने आपको मिलाएँगे’ का आशय और ‘वे’ का संदर्भ
  choice: संदर्भ को अनिर्दिष्ट रखते हुए स्रोत की अस्पष्ट अभिव्यक्ति को बनाए रखा गया।
  alternative: इसे स्पष्ट रूप से आपसी विवाह, राजवंशीय विवाह, सामान्य मानवता के साथ मिश्रण, या किसी विशेष अंत-कालीन समूह के रूप में समझाना।
  rationale: अरामी पाठ पक्षों की पहचान या मिश्रण का तरीका स्पष्ट नहीं करता। किसी एक ऐतिहासिक अथवा मतगत व्याख्या को मुख्य पाठ में रखना स्रोत से अधिक निश्चितता उत्पन्न करता।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और गरिमापूर्ण रखी गई है। वाक्य में प्रतीकात्मक पदार्थों और अनिर्दिष्ट बहुवचन ‘वे’ के बीच मूल पाठ का तनाव सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
