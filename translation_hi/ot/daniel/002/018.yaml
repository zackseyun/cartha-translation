source:
  edition: WLC
  text: וְ/רַחֲמִ֗ין לְ/מִבְעֵא֙ מִן קֳדָם֙ אֱלָ֣הּ שְׁמַיָּ֔/א עַל רָזָ֖/ה דְּנָ֑ה דִּ֣י לָ֤א יְהֹֽבְדוּן֙ דָּנִיֵּ֣אל וְ/חַבְר֔וֹ/הִי עִם שְׁאָ֖ר חַכִּימֵ֥י בָבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/018.yaml
  text: and to seek mercy from before the God of heaven concerning this mystery[a], so that Daniel and his companions might not perish with the rest of the wise men of Babylon.
translation:
  language: hi
  text: और इस रहस्य[a] के विषय में स्वर्ग के परमेश्वर से दया की विनती करें, ताकि दानिय्येल और उसके साथी बाबुल के बाकी बुद्धिमानों के साथ नष्ट न हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गुप्त बात।” अरामी शब्द ऐसी छिपी हुई बात को दर्शाता है जिसे प्रकट किए जाने की आवश्यकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַחֲמִין לְמִבְעֵא
  choice: दया की विनती करें
  rationale: बहुवचन ‘दया/करुणा’ अरामी मुहावरे में सामूहिक अर्थ देता है। हिन्दी में ‘दया की विनती करना’ स्वाभाविक रूप से गंभीर प्रार्थना और ईश्वरीय करुणा की याचना व्यक्त करता है।
- source_word: מִן קֳדָם אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर से
  rationale: מִן קֳדָם का शाब्दिक बिंब ‘के सामने से’ है, पर याचना के प्रसंग में हिन्दी का ‘से’ उसी संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। ‘स्वर्ग का परमेश्वर’ पदवी को सुरक्षित रखा गया है।
- source_word: עַל רָזָה דְּנָה
  choice: इस रहस्य के विषय में
  rationale: רָז किसी ऐसी छिपी हुई बात को दर्शाता है जिसे ईश्वरीय प्रकाशन की आवश्यकता है। ‘रहस्य’ इस भाव को रखता है; ‘गुप्त बात’ पादटिप्पणी में दिया गया है।
- source_word: דִּי לָא יְהֹבְדוּן
  choice: ताकि ... नष्ट न हों
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम बताता है। ‘नष्ट न हों’ मृत्यु के तात्कालिक संकट को व्यक्त करता है, पर क्रिया को केवल ‘मार डाले जाएँ’ तक सीमित नहीं करता।
- source_word: וְחַבְרוֹהִי
  choice: उसके साथी
  rationale: यह दानिय्येल के निकट सहयोगियों को सूचित करता है; ‘साथी’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: עִם שְׁאָר חַכִּימֵי בָבֶל
  choice: बाबुल के बाकी बुद्धिमानों के साथ
  rationale: यह दानिय्येल और उसके साथियों को उस बड़े समूह के साथ रखता है जिस पर नाश का संकट था। ‘बुद्धिमान’ दरबारी विद्वानों के लिए दानिय्येल की प्रचलित शब्दावली बनाए रखता है।
theological_decisions:
- issue: दानिय्येल के राजदरबारी प्रसंग में רָז का अनुवाद
  choice: रहस्य
  alternative: गुप्त बात
  rationale: इस अध्याय में वह बात मानवीय बुद्धि की पहुँच से छिपी है और परमेश्वर द्वारा प्रकट की जानी है। ‘रहस्य’ इस प्रकाशनात्मक आयाम को बनाए रखता है, बिना बाद की किसी विशिष्ट धर्मवैज्ञानिक पारिभाषिकता को आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पूर्ववर्ती आज्ञा पर निर्भर वाक्यांश है, इसलिए ‘विनती करें’ का बहुवचन क्रियारूप संदर्भगत निरंतरता बनाए रखता है।
