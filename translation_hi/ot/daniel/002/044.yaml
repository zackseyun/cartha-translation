  text: וּֽ/בְ/יוֹמֵי/ה֞וֹן דִּ֧י מַלְכַיָּ֣/א אִנּ֗וּן יְקִים֩ אֱלָ֨הּ שְׁמַיָּ֤/א מַלְכוּ֙ דִּ֤י לְ/עָלְמִין֙ לָ֣א תִתְחַבַּ֔ל וּ/מַ֨לְכוּתָ֔/ה לְ/עַ֥ם אָחֳרָ֖ן לָ֣א תִשְׁתְּבִ֑ק תַּדִּ֤ק וְ/תָסֵיף֙ כָּל אִלֵּ֣ין מַלְכְוָתָ֔/א וְ/הִ֖יא תְּק֥וּם לְ/עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/044.yaml
  text: And in the days of those kings[a], the God of heaven will set up a kingdom that will never be destroyed, and the kingdom will not be left to another people. It will crush and put an end to all these kingdoms[b], and it will stand forever.
translation:
  language: hi
  text: उन राजाओं के दिनों में[a] स्वर्ग का परमेश्वर एक ऐसा राज्य स्थापित करेगा, जो कभी नष्ट नहीं होगा। वह राज्य किसी अन्य जनसमूह को नहीं सौंपा जाएगा। वह इन सभी राज्यों को चूर-चूर कर[b] उनका अन्त कर देगा, और वह सदा बना रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उन राजाओं’ से नबूकदनेस्सर के स्वप्न में दर्शाए गए राजाओं या राज्यों की ओर संकेत है; इसका सटीक ऐतिहासिक संदर्भ क्या है, इस पर व्याख्याकारों में मतभेद है।
    reason: alternative_reading
  - marker: b
    text: इस अरामी क्रिया का अर्थ ‘कुचल देना’, ‘टुकड़े-टुकड़े कर देना’ या ‘चकनाचूर कर देना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹמֵיהוֹן דִּי מַלְכַיָּא אִנּוּן
  choice: उन राजाओं के दिनों में
  rationale: यह पदबंध पहले बताए गए राजाओं की ओर संकेत करता है। हिन्दी में यह स्वाभाविक है और आरम्भिक संयोजक को अलग से जोड़कर वाक्य को बोझिल नहीं बनाता।
- source_word: יְקִים
  choice: स्थापित करेगा
  rationale: क्रिया का अर्थ किसी राज्य को खड़ा करना या स्थापित करना है; आधुनिक हिन्दी में ‘स्थापित करेगा’ स्पष्ट और गरिमापूर्ण है।
- source_word: אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग का परमेश्वर
  rationale: यह अरामी का प्रचलित ईश्वरीय संबोधन है और उसके एकवचन शीर्षकीय भाव को सुरक्षित रखता है।
- source_word: מַלְכוּ דִּי לְעָלְמִין לָא תִתְחַבַּל
  choice: एक ऐसा राज्य ... जो कभी नष्ट नहीं होगा
  rationale: अनिश्चित एकवचन राज्य और नकार के साथ अनन्त अवधि—दोनों को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: וּמַלְכוּתָהּ לְעַם אָחֳרָן לָא תִשְׁתְּבִק
  choice: उसका राज्य किसी अन्य जनसमूह के हाथ नहीं छोड़ा जाएगा
  rationale: ‘उसका’ मूल के स्त्रीलिंग प्रत्यय को बनाए रखता है, जबकि ‘के हाथ’ स्वामित्व दूसरे समुदाय को न सौंपे जाने का भाव स्वाभाविक हिन्दी में देता है। ‘जनसमूह’ עם को जाति-व्यवस्था के अनचाहे अर्थ से बचाता है।
- source_word: תַּדִּק
  choice: चूर-चूर कर
  rationale: कारक रूप वाली क्रिया कुचलने, तोड़ने या चकनाचूर करने का तीव्र भाव रखती है; ‘चूर-चूर’ स्वप्न में पत्थर की छवि के अनुकूल है।
- source_word: וְתָסֵיף
  choice: उनका अन्त कर देगा
  rationale: यह क्रिया किसी वस्तु को समाप्त कर देने का अर्थ देती है और पहले प्रयुक्त ‘चूर-चूर’ से अलग क्रियात्मक भाव बनाए रखती है।
- source_word: וְהִיא תְּקוּם לְעָלְמַיָּא
  choice: और वह सदा बना रहेगा
  rationale: קום यहाँ राज्य के स्थायी रूप से कायम रहने को व्यक्त करता है; हिन्दी में ‘सदा बना रहेगा’ यही स्थायित्व सहज ढंग से बताता है।
theological_decisions:
- issue: अन्तिम राज्य की पहचान
  choice: केवल उसके ईश्वरीय उद्गम, अविनाशिता, विजय और अनन्त स्थायित्व को व्यक्त किया गया है।
  alternative: मुख्य पाठ में इसे स्पष्ट रूप से मसीह का राज्य कहना।
  rationale: पद स्वयं ‘स्वर्ग का परमेश्वर’ द्वारा स्थापित राज्य कहता है, पर यहाँ उससे आगे कोई विशिष्ट उत्तरकालीन धार्मिक पहचान नहीं देता।
- issue: ‘उन राजाओं’ का सटीक ऐतिहासिक संकेत
  choice: अनिश्चय को बनाए रखते हुए ‘उन राजाओं’ अनूदित किया गया है।
  alternative: इसे केवल विभाजित राज्य के शासकों या किसी विशेष ऐतिहासिक शासक-समूह तक सीमित करना।
  rationale: संकेतवाचक पद पहले के स्वप्न-वर्णन की ओर लौटता है, पर उसका सटीक ऐतिहासिक दायरा इस पद में स्पष्ट नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘जनसमूह’ सामान्य पाठक के लिए स्पष्ट है और ‘जाति’ के आधुनिक सामाजिक अर्थ से बचाता है। मूल अरामी की पुनरुक्ति और राज्य की कर्तृवाचक भूमिका को यथासम्भव सुरक्षित रखा गया है।
