base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/028.yaml
  text: 'But there is a God in heaven who reveals mysteries[a], and he has made known to King Nebuchadnezzar what will happen in the latter days. Your dream, and the visions of your head as you lay on your bed[c][b], were these:'
translation:
  language: hi
  text: 'परन्तु स्वर्ग में एक परमेश्वर है, जो रहस्यों को प्रकट करता है[a]; और उसने राजा नबूकदनेस्सर को बता दिया है कि अन्त के दिनों में क्या होगा[b]। तेरा स्वप्न और तेरे मन में आए दर्शन, जब तू अपने बिस्तर पर था[c], ये हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्ग में परमेश्वर’ या ‘स्वर्ग का परमेश्वर।’ अरामी अभिव्यक्ति औपचारिक रूप से अनिश्चित है, यद्यपि संदर्भ में संकेत सच्चे परमेश्वर की ओर है।
    reason: alternative_reading
  - marker: b
    text: या, ‘बाद के दिनों में।’ यह वाक्यांश भविष्य के किसी निर्णायक काल का संकेत दे सकता है, पर अपने आप में किसी खास अन्त-समय व्यवस्था को निर्धारित नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘तेरे सिर के दर्शन।’
    reason: literal_rendering
lexical_decisions:
- source_word: בְּרַם
  choice: परन्तु
  rationale: यह पद पिछले संदर्भ में बाबेल के बुद्धिमानों की असमर्थता के विपरीत परमेश्वर की सामर्थ्य प्रस्तुत करता है।
- source_word: אֱלָהּ בִּשְׁמַיָּא
  choice: स्वर्ग में एक परमेश्वर
  rationale: अरामी अभिव्यक्ति व्याकरण की दृष्टि से अनिश्चित है; ‘एक परमेश्वर’ उसके रूप और राजदरबार की कथात्मक परिस्थिति को बनाए रखता है, जबकि ‘परमेश्वर’ स्पष्ट करता है कि संकेत इस्राएल के सच्चे परमेश्वर की ओर है।
- source_word: גָּלֵא רָזִין
  choice: जो रहस्यों को प्रकट करता है
  rationale: कृदन्त परमेश्वर के विशिष्ट कार्य को व्यक्त करता है; ‘रहस्य’ दानिय्येल में दैवी प्रकाशन द्वारा खोली जाने वाली गुप्त बातों के प्रमुख विषय को बनाए रखता है।
- source_word: וְהוֹדַע
  choice: और उसने ... बता दिया है
  rationale: कारणवाचक क्रिया ‘जानने योग्य कर देना’ बताती है। ‘बता दिया है’ पूर्ण कार्य और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है तथा पिछली क्रिया ‘प्रकट करता है’ से शब्दगत भेद रखता है।
- source_word: מָה דִּי לֶהֱוֵא
  choice: क्या होगा
  rationale: यह भविष्य की ओर संकेत करने वाला उपवाक्य है; ‘क्या होगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּאַחֲרִית יוֹמַיָּא
  choice: आने वाले दिनों में
  rationale: यह भावी, संभवतः चरम काल की ओर संकेत करता है। यह चयन किसी विशिष्ट अंत-समय व्यवस्था को आरोपित किए बिना सामान्य पाठक के लिए अर्थ स्पष्ट करता है; ‘अन्त के दिनों में’ वैकल्पिक अधिक शाब्दिक रूप है।
- source_word: חֶלְמָךְ וְחֶזְוֵי רֵאשָׁךְ
  choice: तेरा स्वप्न और ... तेरे मन में आए दर्शन
  rationale: ‘तेरा’ राजा को सीधे एकवचन संबोधन को सुरक्षित रखता है। अरामी ‘तेरे सिर के दर्शन’ का आशय स्वाभाविक हिन्दी में ‘तेरे मन में आए दर्शन’ से व्यक्त किया गया है।
- source_word: עַל מִשְׁכְּבָךְ
  choice: बिस्तर पर
  rationale: यह स्वप्न-दर्शनों की परिस्थिति बताता है; हिन्दी में संक्षिप्त स्थानवाचक अभिव्यक्ति पर्याप्त और स्वाभाविक है।
theological_decisions:
- issue: एकेश्वरवादी संदर्भ में אֱלָהּ की अनिश्चित अभिव्यक्ति
  choice: स्वर्ग में एक परमेश्वर
  alternative: स्वर्ग में परमेश्वर; स्वर्ग का परमेश्वर
  rationale: मूल अरामी रूप औपचारिक रूप से अनिश्चित है और मूर्तिपूजक राजदरबार में सच्चे रहस्योद्घाटक को अन्य दावेदारों से अलग करता है। ‘एक परमेश्वर’ इस आलंकारिक स्थिति को बचाता है, बिना यह संकेत दिए कि दानिय्येल अनेक वास्तविक देवताओं में से एक की बात कर रहा है।
- issue: בְּאַחֲרִית יוֹמַיָּא का कालगत और संभावित युगान्त-विषयक अर्थ
  choice: आने वाले दिनों में
  alternative: अन्त के दिनों में; दिनों के अन्त में
  rationale: मूल वाक्यांश भावी चरम अवधि का संकेत दे सकता है, पर किसी विशिष्ट युगान्त-विषयक तंत्र को निर्धारित नहीं करता। मुख्य पाठ सहज हिन्दी रखता है और पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजा के लिए मूल के एकवचन संबोधन के अनुरूप ‘तेरा/तेरे’ रखा गया है। ‘नबूकदनेस्सर’ हिन्दी बाइबलीय परंपरा में परिचित नाम-रूप है।
