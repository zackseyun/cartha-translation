source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֔/א מֶ֖לֶךְ מַלְכַיָּ֑/א דִּ֚י אֱלָ֣הּ שְׁמַיָּ֔/א מַלְכוּתָ֥/א חִסְנָ֛/א וְ/תָקְפָּ֥/א וִֽ/יקָרָ֖/א יְהַב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/037.yaml
  text: You[a], O king, are the king of kings, to whom the God of heaven has given the kingdom, the might, the power, and the glory.
translation:
  language: hi
  text: हे राजा, आप राजाओं के राजा हैं। स्वर्ग के परमेश्वर ने आपको राज्य, सामर्थ्य, शक्ति और महिमा[a] दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“महिमा” के लिए वैकल्पिक अनुवाद: “सम्मान” या “वैभव।”'
    reason: अरामी शब्द וִיקָרָא में महिमा, सम्मान और वैभव की अर्थ-छायाएँ हैं।
lexical_decisions:
- source_word: אַנְתְּה מַלְכָּא
  choice: हे राजा, आप
  rationale: स्वतंत्र द्वितीय पुरुष सर्वनाम और संबोधन को आधुनिक, आदरपूर्ण हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ מַלְכַיָּא
  choice: राजाओं के राजा
  rationale: अरामी संबंध-रचना का सीधा और हिन्दी में प्रचलित राजकीय शीर्षक।
- source_word: אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर
  rationale: इस बाइबलीय उपाधि का स्वाभाविक हिन्दी रूप, जो मूल के निश्चित अर्थ को बनाए रखता है।
- source_word: מַלְכוּתָא
  choice: राज्य
  rationale: यह राजसत्ता और उसके अधीन क्षेत्र, दोनों की अर्थ-व्याप्ति को खुला रखता है।
- source_word: חִסְנָא
  choice: सामर्थ्य
  rationale: बल या प्रबलता का भाव देता है और अगले निकटार्थी शब्द से पर्याप्त भेद बनाए रखता है।
- source_word: תָקְפָּא
  choice: शक्ति
  rationale: बल और प्रभाव की अर्थ-छाया को व्यक्त करता है तथा मूल में आए समानार्थी पदों की पुनरुक्ति बनाए रखता है।
- source_word: וִיקָרָא
  choice: महिमा
  rationale: राजकीय गौरव, सम्मान और वैभव की विस्तृत अर्थ-सीमा को ऊँचे किंतु सहज हिन्दी पद से व्यक्त करता है।
- source_word: יְהַב לָךְ
  choice: आपको ... दी है
  rationale: पूर्ण क्रिया को वर्तमान परिणाम सहित व्यक्त करता है और प्राप्तकर्ता को स्पष्ट रखता है।
theological_decisions:
- issue: नबूकदनेस्सर की राजसत्ता का स्रोत
  choice: राज्य, सामर्थ्य, शक्ति और महिमा स्वर्ग के परमेश्वर द्वारा दिए गए हैं।
  alternative: ये गुण राजा को विजय या पद के कारण अपने आप प्राप्त हैं।
  rationale: मूल पाठ इन सबको स्पष्ट रूप से परमेश्वर के दान के रूप में प्रस्तुत करता है; अनुवाद इस कथन को न घटाता है, न उससे आगे बढ़ाता है।
translation_notes:
  register: आदरपूर्ण दरबारी संबोधन के लिए “आप” और “हे राजा” रखा गया है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है; निकटार्थी “सामर्थ्य” और “शक्ति” मूल की शब्द-श्रृंखला को सुरक्षित रखते हैं।
