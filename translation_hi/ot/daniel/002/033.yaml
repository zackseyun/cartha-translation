base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/033.yaml
  text: its legs were of iron[a], its feet partly of iron and partly of clay.
translation:
  language: hi
  text: उसकी टाँगें लोहे की थीं; उसके पाँव कुछ लोहे के और कुछ मिट्टी[a] के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिट्टी के बर्तन” अथवा “मृद्भांड”।
    reason: अरामी חֲסַף का अर्थ मिट्टी के साथ-साथ मिट्टी से बने बर्तन या मृद्भांड भी हो सकता है।
lexical_decisions:
- source_word: שָׁקוֹהִי
  choice: उसकी टाँगें
  rationale: यह अरामी शब्द मूर्ति की निचली टाँगों को दर्शाता है। आधुनिक हिन्दी में ‘टाँगें’ स्वाभाविक है और अगले शब्द ‘पाँव’ से शारीरिक भेद बनाए रखता है।
- source_word: דִּי
  choice: की / के
  rationale: सामग्री बताने वाले इस सम्बन्ध को हिन्दी में ‘लोहे की’ और ‘मिट्टी के’ जैसे स्वाभाविक सम्बन्धसूचक रूपों से व्यक्त किया गया है।
- source_word: פַרְזֶל
  choice: लोहा
  rationale: अरामी धातुनाम का सीधा और प्रचलित हिन्दी समतुल्य। वाक्य में व्याकरण के अनुसार ‘लोहे’ रूप आया है।
- source_word: רַגְלוֹהִי
  choice: उसके पाँव
  rationale: यह शब्द यहाँ पहले उल्लिखित टाँगों से अलग, मूर्ति के पाँवों को दर्शाता है; ‘पाँव’ इस भेद को स्पष्ट और सहज रूप से बनाए रखता है।
- source_word: מנ/הון ... ו/מנ/הון
  choice: कुछ ... और कुछ
  rationale: शाब्दिक अर्थ ‘उनमें से’ है, पर सन्दर्भ में यह पाँवों की सामग्री का विभाजन बताता है। ‘कुछ ... और कुछ’ उस वितरण को स्वाभाविक हिन्दी में व्यक्त करता है और यह अनावश्यक रूप से तय नहीं करता कि प्रत्येक पाँव मिश्रित था या पाँवों के अलग-अलग हिस्से अलग सामग्री के थे।
- source_word: חֲסַף
  choice: मिट्टी
  rationale: यह अरामी शब्द मिट्टी अथवा उससे बने मृद्भांड/मिट्टी के बरतन की सामग्री को सूचित कर सकता है। मुख्य पाठ में ‘मिट्टी’ प्रतिमा की सामग्री के वर्णन में सबसे सरल और स्वाभाविक है; व्यापक अर्थ-सीमा पादटिप्पणी में रखी गई है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टाँगें’ और ‘पाँव’ का भेद मूल अरामी शरीर-वर्णन को सुरक्षित रखता है। अर्धविराम पद के दो समानान्तर अंगों को स्पष्ट करता है।
