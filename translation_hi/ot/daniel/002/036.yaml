  yaml_path: translation/ot/daniel/002/036.yaml
  text: This was the dream[a], and we will tell its interpretation before the king.
translation:
  language: hi
  text: यही वह स्वप्न था[a]; अब हम राजा के सामने उसका अर्थ बताएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यही स्वप्न है; अब हम राजा के सामने उसका अर्थ बताएँगे।” अरामी वाक्य में काल और विराम-चिह्न को थोड़ा भिन्न ढंग से व्यक्त किया जा सकता है, पर मूल आशय नहीं बदलता।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּנָה
  choice: यही
  rationale: यह अरामी संकेतवाचक शब्द अभी-अभी सुनाए गए स्वप्न की ओर लौटकर संकेत करता है; ‘यही’ हिन्दी में इस सार-वाक्य को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: חֶלְמָא
  choice: वह स्वप्न
  rationale: अरामी संज्ञा निश्चित है और नबूकदनेस्सर के उसी विशिष्ट स्वप्न को बताती है जिसका वर्णन अभी किया गया है।
- source_word: וּפִשְׁרֵהּ
  choice: उसका अर्थ
  rationale: פִשְׁרָא स्वप्न या रहस्य के अर्थ अथवा व्याख्या को दर्शाता है। आधुनिक हिन्दी में ‘उसका अर्थ’ सहज है और प्रत्यय का संबंध स्वप्न से बनाए रखता है।
- source_word: נֵאמַר
  choice: हम बताएँगे
  rationale: यह אמר का प्रथम पुरुष बहुवचन अपूर्ण रूप है। प्रसंग में यह राजा को आगे बताई जाने वाली व्याख्या की घोषणा करता है; ‘बताएँगे’ भावी अर्थ और स्वाभाविक हिन्दी दोनों को सुरक्षित रखता है।
- source_word: קֳדָם
  choice: के सामने
  rationale: इसका अर्थ ‘के सम्मुख’ या ‘की उपस्थिति में’ है। ‘राजा के सामने’ दरबारी परिस्थिति को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: संज्ञा निश्चित है, पर हिन्दी में परसर्गयुक्त पद ‘राजा के सामने’ बिना अतिरिक्त निश्चितताबोधक शब्द के स्वाभाविक है; संदर्भ से व्यक्ति स्पष्ट है।
