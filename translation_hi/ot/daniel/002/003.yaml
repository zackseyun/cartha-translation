  footnotes:
  - marker: a
    text: 'इब्रानी में ‘सपना’ संज्ञा और ‘सपना देखना’ क्रिया एक ही मूल से हैं; इस प्रयोग से कथन पर बल पड़ता है। वैकल्पिक अनुवाद: “मैंने एक सपना देखा।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का शाब्दिक अर्थ “मेरी आत्मा” या “मेरी आत्मिक चेतना” भी हो सकता है; यहाँ यह राजा के भीतरी मन या भावावेश को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में केवल “सपने को जानना” है; प्रसंग में इसका संबंध सपने की विषयवस्तु, उसके अर्थ, या दोनों से हो सकता है।
    reason: ambiguity
