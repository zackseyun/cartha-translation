  choice: मुख्य पाठ में व्यापक और कुछ हद तक अस्पष्ट अभिव्यक्ति ‘उस सपने को जानने’ को रखा गया है।
  alternative: ‘उस सपने का अर्थ जानने’ या ‘सपना क्या था, यह जानने’
