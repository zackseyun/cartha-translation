  yaml_path: translation/ot/daniel/002/031.yaml
  text: You[a], O king, were watching, and behold, there was one great statue[b]. That statue was immense, and its splendor was extraordinary; it was standing before you[c], and its appearance was terrifying.
translation:
  language: hi
  text: हे राजा, आप देख रहे थे, और देखिए, एक विशाल प्रतिमा[a] थी। वह प्रतिमा अत्यंत बड़ी थी, उसकी चमक असाधारण थी, वह आपके सामने खड़ी थी, और उसका रूप भयावह था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी शब्द צְלֵם का अनुवाद “प्रतिमा” या “मूर्ति” किया जा सकता है। यहाँ स्वप्न में राजा के सामने खड़ी विशाल आकृति के कारण “प्रतिमा” चुना गया है।
    reason: lexical_alternative
