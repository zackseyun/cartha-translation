- source_word: קָאֵם לְקָבְלָךְ
  choice: आपके सामने खड़ी थी
  rationale: कृदन्त स्थिर दृश्य का वर्णन करता है और לְקָבְלָךְ का स्वाभाविक अर्थ ‘आपके सामने’ है।
- source_word: וְרֵוֵהּ דְּחִיל
  choice: उसका रूप भयावह था
  rationale: רֵו को ‘रूप’ और भय उत्पन्न करने वाले דְּחִיל को ‘भयावह’ से व्यक्त किया गया है।
