  rationale: दर्शक-सूचक पुनरुल्लेख और आकार पर दोहरे बल को हिन्दी में ‘विशाल’ तथा ‘अत्यंत बड़ी’ से व्यक्त किया गया है।
- source_word: וְזִיוֵהּ יַתִּיר
