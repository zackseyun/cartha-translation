  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן דָּנִיֵּ֗אל הֲתִיב֙ עֵטָ֣א וּ/טְעֵ֔ם לְ/אַרְי֕וֹךְ רַב טַבָּחַיָּ֖/א דִּ֣י מַלְכָּ֑/א דִּ֚י נְפַ֣ק לְ/קַטָּלָ֔ה לְ/חַכִּימֵ֖י בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/014.yaml
  text: Then Daniel answered Arioch[a], the chief of the king’s executioners, with counsel and discretion—the one who had gone out to kill the wise men of Babylon.
translation:
  language: hi
  text: तब दानियेल ने राजा के जल्लादों के प्रधान[a] अर्योक को, जो बाबेल के बुद्धिमानों को मार डालने के लिए निकला था, समझ-बूझ और विवेक से उत्तर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजा के अंगरक्षक-दल का प्रधान।’ अरामी पद का शाब्दिक अर्थ ‘वध करने वालों का प्रधान’ है; राजकीय संदर्भ में यह जल्लादों अथवा राजा के अंगरक्षकों के अधिकारी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले क्रमिक प्रसंग को आरम्भ करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: הֲתִיב
  choice: उत्तर दिया
  rationale: बाइबिलीय अरामी में यह क्रिया मौखिक प्रत्युत्तर को व्यक्त करती है; हिन्दी में ‘उत्तर दिया’ प्रसंगानुकूल है।
- source_word: עֵטָא וּטְעֵם
  choice: समझ-बूझ और विवेक से
  rationale: दोनों संज्ञाएँ दानियेल के उत्तर में बुद्धिमत्तापूर्ण सलाह/सूझ और विवेकपूर्ण निर्णय या युक्ति का भाव रखती हैं। यह प्रयोग दोनों पहलुओं को अलग रखते हुए स्वाभाविक हिन्दी देता है और किसी अतिरिक्त विशेषण को नहीं जोड़ता।
- source_word: לְאַרְיוֹךְ
  choice: अर्योक
  rationale: व्यक्तिवाचक नाम का अरामी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: רַב טַבָּחַיָּא דִּי מַלְכָּא
  choice: राजा के जल्लादों के प्रधान
  rationale: रַב ‘प्रधान’ और טַבָּחַיָּא मूलतः वध करने वालों को दर्शाता है। निकटवर्ती प्रसंग में उन्हें बुद्धिमानों को मारने का आदेश है, इसलिए ‘जल्लादों’ मुख्य पाठ में सबसे सीधा अर्थ देता है; राजकीय अंगरक्षकों के अधिकारी का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: דִּי נְפַק לְקַטָּלָה
  choice: जो ... मार डालने के लिए निकला था
  rationale: सम्बन्धवाचक उपवाक्य अर्योक के पहले ही इस उद्देश्य से निकल चुकने को बताता है; ‘निकला था’ घटनाक्रम को स्पष्ट रखता है और ‘मार डालने’ से उद्देश्य की कठोरता बनी रहती है।
- source_word: לְחַכִּימֵי בָּבֶל
  choice: बाबेल के बुद्धिमानों को
  rationale: यह दानियेल में राजदरबार से जुड़े विद्वान वर्ग की मानक पदवी है; ‘बुद्धिमान’ व्यापक मूल पद को किसी एक विशिष्ट पेशे तक सीमित नहीं करता।
