  yaml_path: translation/ot/daniel/002/012.yaml
  text: Because of this[a], the king became furious and very enraged[b], and he commanded that all the wise men of Babylon be destroyed.
translation:
  language: hi
  text: इस कारण[a] राजा क्रोधित हो गया और अत्यन्त रोष में भर गया, और उसने बाबुल के सभी बुद्धिमानों को नष्ट कर देने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस वजह से” अथवा “इसलिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इस कारण
  rationale: यह अरामी कारणसूचक पदबंध है, जिसका अर्थ ‘इस कारण’ या ‘इस वजह से’ है। संक्षिप्त और स्वाभाविक हिन्दी में इसका स्पष्ट कारणात्मक बल बना रहता है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: यह अरामी का निश्चित रूप है; प्रसंग में हिन्दी का सामान्य ‘राजा’ पर्याप्त और स्वाभाविक है।
- source_word: בְּנַס וּקְצַף שַׂגִּיא
  choice: आग-बबूला हो गया और उसका क्रोध बहुत भड़क उठा
  rationale: दोनों क्रोधसूचक अभिव्यक्तियों तथा שַׂגִּיא की तीव्रता को बनाए रखते हुए यह वर्तमान हिन्दी में स्वाभाविक ढंग से क्रोध की वृद्धि व्यक्त करता है।
- source_word: וַאֲמַר
  choice: आज्ञा दी
  rationale: क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर यहाँ वह राजकीय आदेश प्रस्तुत करती है; इसलिए ‘आज्ञा दी’ प्रसंगगत बल को स्पष्ट करता है।
- source_word: לְהוֹבָדָה
  choice: नष्ट कर देने
  rationale: אבד का यह कारक रूप किसी को मिटा देने या मरवा डालने का भाव रखता है। ‘नष्ट कर देने’ मूल की व्यापकता बनाए रखता है और आदेश के घातक आशय को व्यक्त करता है।
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: बाबुल के सभी बुद्धिमानों को
  rationale: यह समग्रता व्यक्त करने वाला संबंधसूचक पदबंध है। ‘बुद्धिमान’ दरबारी ज्ञानियों के वर्ग के लिए प्रतिष्ठित, सुबोध हिन्दी शब्द है।
