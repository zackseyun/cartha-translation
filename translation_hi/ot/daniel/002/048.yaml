source:
  edition: WLC
  text: אֱדַ֨יִן מַלְכָּ֜/א לְ/דָנִיֵּ֣אל רַבִּ֗י וּ/מַתְּנָ֨ן רַבְרְבָ֤ן שַׂגִּיאָן֙ יְהַב לֵ֔/הּ וְ/הַ֨שְׁלְטֵ֔/הּ עַ֖ל כָּל מְדִינַ֣ת בָּבֶ֑ל וְ/רַב סִגְנִ֔ין עַ֖ל כָּל חַכִּימֵ֥י בָבֶֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/048.yaml
  text: Then the king made Daniel great and gave him many great gifts[b][a], and he made him ruler over the whole province of Babylon and chief prefect over all the wise men of Babylon.
translation:
  language: hi
  text: तब राजा ने दानिय्येल को महान बनाया[a] और उसे बहुत-से बड़े-बड़े उपहार दिए। उसने उसे बाबेल के पूरे प्रांत पर शासक और बाबेल के सभी बुद्धिमानों पर प्रधान अधिकारी[b] नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दानिय्येल को ऊँचा पद दिया।” अरामी क्रिया का शाब्दिक अर्थ “महान बनाया” है; इस प्रसंग में यह राजा द्वारा उसे प्रतिष्ठित करने या पदोन्नत करने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: यह पदवी ऐसे उच्च अधिकारी को सूचित करती है जिसे दूसरे दरबारी अधिकारियों या प्रशासकों के ऊपर नियुक्त किया जाता था।
    reason: cultural_note
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह कालवाचक/क्रमवाचक क्रियाविशेषण कथा में अगली घटना का संकेत देता है; ‘तब’ सहज और संक्षिप्त है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: अरामी का निश्चित रूप है; हिन्दी में प्रसंग से राजा की पहचान स्पष्ट है।
- source_word: לְדָנִיֵּאל
  choice: दानिय्येल को
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है और לְ को कर्मसूचक ‘को’ से व्यक्त किया गया है।
- source_word: רַבִּי
  choice: महान बनाया
  rationale: रבה के कारक अर्थ ‘महान करना’ को सीधे सुरक्षित रखता है; राजदरबार के प्रसंग में इसका आशय पदोन्नति/प्रतिष्ठा बढ़ाना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וּמַתְּנָן רַבְרְבָן שַׂגִּיאָן
  choice: बहुत-से बड़े-बड़े उपहार
  rationale: מַתְּנָן ‘उपहार’, רַבְרְבָן ‘बड़े/महान’ और שַׂגִּיאָן ‘बहुत-से’—तीनों के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהַב לֵהּ
  choice: उसे ... दिए
  rationale: क्रिया और परोक्ष कर्म का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: וְהַשְׁלְטֵהּ
  choice: उसे ... शासक ... नियुक्त किया
  rationale: שלט के कारक रूप का अर्थ ‘शासन करने का अधिकार देना’ है; ‘शासक नियुक्त किया’ प्रसंगानुकूल और स्पष्ट है।
- source_word: עַל כָּל מְדִינַת בָּבֶל
  choice: बाबेल के पूरे प्रांत पर
  rationale: מְדִינָה साम्राज्यिक प्रशासनिक संदर्भ में ‘प्रांत’ है; एकवचन के साथ כָּל का अर्थ ‘पूरा’ है।
- source_word: וְרַב סִגְנִין
  choice: प्रधान अधिकारी
  rationale: רַב का अर्थ ‘प्रधान’ है और סִגְנִין उच्च प्रशासनिक अधिकारियों की पदवी सूचित करता है। हिन्दी में अत्यधिक तकनीकी या अनिश्चित पदनाम थोपे बिना प्रशासनिक आशय सुरक्षित रखा गया है।
- source_word: עַל כָּל חַכִּימֵי בָבֶל
  choice: बाबेल के सभी बुद्धिमानों पर
  rationale: दरबार के ज्ञानियों, विद्वानों और सलाहकारों के पारंपरिक सामूहिक पदनाम को ‘बुद्धिमान’ से व्यक्त किया गया है।
