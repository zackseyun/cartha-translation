id: DAN.2.11
reference: Daniel 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִלְּתָ֨/א דִֽי מַלְכָּ֤/ה שָׁאֵל֙ יַקִּירָ֔ה וְ/אָחֳרָן֙ לָ֣א אִיתַ֔י דִּ֥י יְחַוִּנַּ֖/הּ קֳדָ֣ם מַלְכָּ֑/א לָהֵ֣ן אֱלָהִ֔ין דִּ֚י מְדָ֣רְ/ה֔וֹן עִם בִּשְׂרָ֖/א לָ֥א אִיתֽוֹ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/011.yaml
  text: And the thing that the king asks is difficult[a], and there is no other who can declare it before the king except the gods[b], whose dwelling is not with flesh.
translation:
  language: hi
  text: और जो बात राजा पूछ रहा है, वह कठिन[a] है; और देवताओं[b] को छोड़कर कोई दूसरा नहीं है जो उसे राजा के सामने प्रकट कर सके, जिनका निवास मांस के साथ नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा जो बात पूछ रहा है, वह भारी है।”
    reason: विशेषण יַקִּירָה का अर्थ ‘कठिन’ के साथ-साथ ‘भारी’ या ‘दुर्लभ’ भी हो सकता है; यहाँ आशय असाधारण कठिनता का है।
  - marker: b
    text: शाब्दिक रूप से, “देवताओं को छोड़कर, जिनका निवास मांस के साथ नहीं है।” ‘मांस’ से यहाँ मनुष्य या नश्वर देह वाले प्राणी अभिप्रेत हैं।
    reason: अरामी בִּשְׂרָא का शाब्दिक अर्थ ‘मांस’ है; पादटिप्पणी उसके प्रसंगगत मानवीय आशय को स्पष्ट करती है।
lexical_decisions:
- source_word: מִלְּתָא
  choice: बात
  rationale: यह अरामी संज्ञा ‘बात’, ‘विषय’ या ‘वचन’ का अर्थ दे सकती है। यहाँ यह राजा द्वारा माँगी गई जानकारी को सूचित करती है; इसलिए ‘बात’ स्वाभाविक और अर्थ-संगत है।
- source_word: שָׁאֵל
  choice: पूछ रहा है
  rationale: कृदन्त राजा की वर्तमान माँग को व्यक्त करता है। ‘पूछ रहा है’ मूल क्रिया के निकट है और ‘माँग करता है’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: יַקִּירָה
  choice: कठिन
  rationale: विशेषण का अर्थ ‘भारी’, ‘दुर्लभ’ या ‘कठिन’ हो सकता है। प्रसंग में राजकीय माँग पूरी करने की कठिनता अभिप्रेत है।
- source_word: וְאָחֳרָן לָא אִיתַי
  choice: कोई दूसरा नहीं
  rationale: यह मुहावरा किसी अन्य सक्षम प्रकट करने वाले के न होने को व्यक्त करता है।
- source_word: יְחַוִּנַּהּ
  choice: उसे ... प्रकट कर सके
  rationale: क्रिया का अर्थ दिखाना, बताना या प्रकट करना है। स्वप्न के रहस्योद्घाटन के प्रसंग में ‘प्रकट करना’ उपयुक्त है।
- source_word: קֳדָם מַלְכָּא
  choice: राजा के सामने
  rationale: यह वाक्यांश राजा की उपस्थिति में कहने या प्रकट करने को दर्शाता है।
- source_word: לָהֵן
  choice: को छोड़
  rationale: यहाँ अव्यय पहले कथन के एकमात्र अपवाद को प्रस्तुत करता है।
- source_word: אֱלָהִין
  choice: देवताओं
  rationale: रूप बहुवचन है और बाबुल के ज्ञानी पुरुषों के कथन में अनेक देवताओं का संकेत स्वाभाविक है।
- source_word: מְדָרְהוֹן
  choice: उनका निवास
  rationale: संज्ञा रहने के स्थान या वास को व्यक्त करती है; ‘निवास’ आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: עִם בִּשְׂרָא
  choice: देहधारियों के साथ
  rationale: शाब्दिक अर्थ ‘मांस के साथ’ है, पर यहाँ ‘मांस’ नश्वर मनुष्यों के लिए प्रयोग हुआ है। ‘देहधारी’ मूल बिंब और आशय दोनों को स्वाभाविक हिन्दी में रखता है; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: לָא אִיתוֹהִי
  choice: नहीं है
  rationale: यह अस्तित्वसूचक/संयोजक अभिव्यक्ति यहाँ निवास के विषय में साधारण निषेध का कार्य करती है।
theological_decisions:
- issue: אֱלָהִין का संदर्भ
  choice: देवताओं
  alternative: ईश्वरीय प्राणी; परमेश्वर
  rationale: अरामी रूप बहुवचन है और वक्ता बाबुल के दरबारी ज्ञानी हैं। एकवचन ‘परमेश्वर’ करना उनके कथन पर इस्राएली एकेश्वरवादी भाषा आरोपित करता।
- issue: בִּשְׂרָא का अर्थ
  choice: देहधारी
  alternative: मांस; मनुष्य; नश्वर मनुष्य
  rationale: मूल शब्द का शाब्दिक अर्थ ‘मांस’ है और यहाँ उससे देहधारी नश्वर प्राणी अभिप्रेत हैं। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए मूल रूपक का संबंध बनाए रखा गया है और शाब्दिकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण दरबारी कथन। वाक्य-संरचना मूल अरामी के तर्कक्रम को बनाए रखती है। ‘देवताओं’ का बहुवचन सुरक्षित है और ‘देहधारियों’ से मूल ‘मांस’ का मानवीय संदर्भ स्वाभाविक रूप में व्यक्त होता है।
