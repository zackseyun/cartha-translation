  text: וּ/בְ/כָל דִּ֣י דארין בְּֽנֵי אֲ֠נָשָׁ/א חֵיוַ֨ת בָּרָ֤/א וְ/עוֹף שְׁמַיָּ/א֙ יְהַ֣ב בִּ/ידָ֔/ךְ וְ/הַשְׁלְטָ֖/ךְ בְּ/כָלְּ/ה֑וֹן אַנְתְּה ה֔וּא רֵאשָׁ֖/ה דִּ֥י דַהֲבָֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/038.yaml
  text: And wherever the children of men dwell[a], the beasts of the field and the birds of the heavens—he has given them into your hand and made you ruler over all of them[c][b]. You are the head of gold.
translation:
  language: hi
  text: और जहाँ कहीं मनुष्य रहते हैं, वहाँ मैदान के पशु और आकाश के पक्षी—उसने उन्हें आपके हाथ में दे दिया है और आपको उन सब पर शासक बनाया है।[a] आप ही सोने का सिर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसने’ का आशय स्वर्ग के परमेश्वर से है, जिसका उल्लेख पिछले पद में हुआ है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְכָל דִּי דארין בְּנֵי אֲנָשָׁא
  choice: और जहाँ कहीं मनुष्य रहते हैं
  rationale: 'अरामी रचना स्थानवाचक अर्थ देती है: ‘जहाँ कहीं ... रहते हैं।’ ‘मनुष्य’ בְּנֵי אֲנָשָׁא का स्वाभाविक, समावेशी हिन्दी रूप है; शाब्दिक ‘मनुष्यों की सन्तान’ यहाँ असहज और अर्थभ्रमकारी होता।'
- source_word: חֵיוַת בָּרָא
  choice: मैदान के पशु
  rationale: בָּרָא खुले भूभाग या मैदान को सूचित करता है। यह रूप ठोस बिंब बनाए रखता है और केवल जंगली पशुओं तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְעוֹף שְׁמַיָּא
  choice: आकाश के पक्षी
  rationale: यह मूल के ‘आकाश के पक्षी’ बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: יְהַב בִּידָךְ
  choice: उसने उन्हें आपके हाथ में दे दिया है
  rationale: ‘हाथ में देना’ अधिकार और नियंत्रण सौंपने का स्रोत-पाठ का मुहावरा सुरक्षित रखता है; पूर्ण क्रिया के लिए ‘दे दिया है’ उपयुक्त है।
- source_word: וְהַשְׁלְטָךְ בְּכָלְּהוֹן
  choice: और आपको उन सब पर शासक बनाया है
  rationale: कारक क्रिया का अर्थ किसी को शासन करने के पद या अधिकार में स्थापित करना है। ‘उन सब पर’ पूर्वोक्त प्राणियों की ओर स्पष्ट संकेत करता है।
- source_word: אַנְתְּה הוּא רֵאשָׁה דִּי דַהֲבָא
  choice: आप ही सोने का वह सिर हैं
  rationale: ‘आप ही’ मूल के बलाघात को व्यक्त करता है, जबकि ‘सोने का ... सिर’ प्रतिमा के बिंब को विशेषण ‘सुनहरा’ की अपेक्षा अधिक ठीक से सुरक्षित रखता है। ‘वह’ स्वप्न में पहले बताए गए सिर की पहचान दर्शाता है।
theological_decisions:
- issue: ‘दे दिया’ और ‘शासक बनाया’ का अप्रकट कर्ता
  choice: मुख्य पाठ में ‘उसने’ रखा गया है और टिप्पणी में पिछले पद के आधार पर उसका संदर्भ स्पष्ट किया गया है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर ने’ जोड़ना।
  rationale: अरामी पाठ यहाँ कर्ता का नाम नहीं दोहराता; दानिय्येल 2:37 का संदर्भ स्वर्ग के परमेश्वर को कर्ता ठहराता है। ‘उसने’ मूल की अंतर्निहितता और प्रसंगगत पहचान दोनों सुरक्षित रखता है।
- issue: בְּנֵי אֲנָשָׁא का मानव-वाचक अर्थ
  choice: ‘मनुष्य’
  alternative: ‘मनुष्यों की सन्तान’
  rationale: मुहावरे का आशय सामान्य रूप से मानव समुदाय है। स्वाभाविक हिन्दी में ‘मनुष्य’ अर्थ को ठीक संप्रेषित करता है, जबकि शाब्दिक रूप जैविक वंश का अनपेक्षित संकेत दे सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजा को संबोधन होने के कारण आदरसूचक ‘आप’ प्रयुक्त है। वाक्य में डैश सूची और उसके बाद आने वाली मुख्य क्रिया के संबंध को स्पष्ट करता है।
