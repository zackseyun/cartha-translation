reference: Daniel 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֛וּא גָּלֵ֥א עַמִּיקָתָ֖/א וּ/מְסַתְּרָתָ֑/א יָדַע֙ מָ֣ה בַ/חֲשׁוֹכָ֔/א ו/נהיר/א עִמֵּ֥/הּ שְׁרֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/022.yaml
  text: He reveals deep and hidden things[a]; he knows what is in the darkness[b], and light dwells with him.
translation:
  language: hi
  text: वही गहरी और छिपी हुई बातें[a] प्रकट करता है; वह जानता है कि अन्धकार में क्या है, और ज्योति उसके साथ निवास करती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गुप्त बातें।”
    reason: lexical_alternative
  - marker: b
    text: या “और ज्योति उसके साथ है।” अरामी क्रिया का अनुवाद अधिक स्थितिपरक ढंग से किया जा सकता है, पर “निवास करती है” मूल की छवि को बेहतर बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלֵא
  choice: प्रकट करता है
  rationale: अरामी कृदन्त किसी छिपी बात को खोलकर ज्ञात कराने का भाव देता है; ‘प्रकट करता है’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: עַמִּיקָתָא
  choice: गहरी बातें
  rationale: यह विशेषण का संज्ञात्मक बहुवचन प्रयोग है; ‘गहरी बातें’ मूल रूपक और अर्थ की व्यापकता बनाए रखता है।
- source_word: וּמְסַתְּרָתָא
  choice: और छिपी हुई बातें
  rationale: मूल शब्द छिपी या गुप्त वस्तुओं/बातों का संकेत देता है; ‘छिपी हुई बातें’ पारदर्शी अनुवाद है।
- source_word: יָדַע מָה בַחֲשׁוֹכָא
  choice: वह जानता है कि अन्धकार में क्या है
  rationale: यह हिन्दी में स्वाभाविक ढंग से ईश्वर के उस ज्ञान को व्यक्त करता है जो अन्धकार में स्थित बातों तक पहुँचता है, और मूल की ठोस छवि बची रहती है।
- source_word: וּנְהִירָא
  choice: और ज्योति
  rationale: ‘ज्योति’ पद काव्यात्मक विरोध—अन्धकार और प्रकाश—को गरिमापूर्ण आधुनिक बाइबलीय हिन्दी में रखता है।
- source_word: עִמֵּהּ שְׁרֵא
  choice: उसके साथ निवास करती है
  rationale: שְׁרֵא का अर्थ ठहरना, रहना या निवास करना हो सकता है; ‘निवास करती है’ केवल ‘साथ है’ की अपेक्षा मूल की सजीव छवि को बेहतर बनाए रखता है।
- source_word: הוּא
  choice: वही
  rationale: वाक्य के आरम्भ में आए बलयुक्त सर्वनाम को ‘वही’ से व्यक्त किया गया है, जिससे हिन्दी में उसका जोर स्वाभाविक रूप से उभरता है।
theological_decisions:
- issue: ईश्वर के साथ ज्योति का व्यक्तिरूप वर्णन
  choice: और ज्योति उसके साथ निवास करती है
  alternative: और ज्योति उसके साथ है
  rationale: अरामी क्रिया मात्र स्थिर उपस्थिति से अधिक रहने या निवास करने की छवि देती है। इसे बनाए रखने से काव्यात्मक व्यक्तिरूपता सुरक्षित रहती है, बिना कोई अतिरिक्त धर्मसैद्धान्तिक दावा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘वही’ मूल सर्वनाम के बल को व्यक्त करता है; ‘अन्धकार’ और ‘ज्योति’ मूल के विरोध को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
