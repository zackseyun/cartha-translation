base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/019.yaml
  text: Then the mystery was revealed to Daniel in a vision of the night[c][b][a]. Then Daniel blessed the God of heaven.
translation:
  language: hi
  text: तब रात के दर्शन में दानिय्येल को वह रहस्य प्रकट किया गया।[a][b] तब दानिय्येल ने स्वर्ग के परमेश्वर को धन्य कहा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात में मिले एक दर्शन में।”
    reason: lexical_alternative
  - marker: b
    text: या, “वह गुप्त बात प्रकट की गई।”
    reason: lexical_alternative
  - marker: c
    text: या, “स्वर्ग के परमेश्वर की स्तुति की।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक शब्द घटनाओं का क्रम बताता है। दोनों वाक्यांशों में इसका दोहराव मूल पाठ के अनुरूप रखा गया है।
- source_word: בְּחֶזְוָא דִי לֵילְיָא
  choice: रात के दर्शन में
  rationale: यह मूल अरामी पदबंध की छवि को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है; ‘रात में मिले दर्शन में’ भी आशय दे सकता है, पर अधिक व्याख्यात्मक है।
- source_word: רָזָה
  choice: वह रहस्य
  rationale: दानिय्येल के इस प्रसंग में यह राजा के स्वप्न और उसके अर्थ से जुड़ी छिपी हुई बात को दर्शाता है। निर्धारक रूप के कारण ‘वह’ प्रसंग में पहले से उल्लिखित रहस्य की ओर संकेत करता है।
- source_word: גֲלִי
  choice: प्रकट किया गया
  rationale: अरामी रूप निष्क्रिय है। यह अनकही दिव्य कर्तृता और इस भाव को सुरक्षित रखता है कि रहस्य मानवीय खोज से नहीं, प्रकाशन द्वारा ज्ञात हुआ।
- source_word: בָּרִךְ
  choice: धन्य कहा
  rationale: परमेश्वर के प्रति प्रयुक्त ברך का निकट और सुबोध हिन्दी रूप है। ‘स्तुति की’ प्रसंगानुकूल विकल्प है, पर मूल क्रिया की विशिष्टता कम कर देता है।
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर
  rationale: यह इस अरामी उपाधि का प्रचलित, गरिमापूर्ण और सहज हिन्दी रूप है।
- source_word: דָנִיֵּאל
  choice: दानिय्येल
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: रहस्य के प्रकाशन में कर्ता
  choice: प्रकट किया गया
  alternative: परमेश्वर ने प्रकट किया
  rationale: संदर्भ में परमेश्वर कर्ता हैं, पर इस पद के अरामी पाठ में निष्क्रिय क्रिया है और कर्ता स्पष्ट रूप से नहीं कहा गया। निष्क्रिय अनुवाद उस अर्थपूर्ण अव्यक्तता को बनाए रखता है।
- issue: רָז के लिए धार्मिक अर्थ-सूचक शब्द
  choice: रहस्य
  alternative: गुप्त बात
  rationale: ‘रहस्य’ ऐसी छिपी बात को व्यक्त करता है जिसे परमेश्वर प्रकट करते हैं; इससे यह निष्कर्ष नहीं निकलता कि वह सदा अगम्य रहेगी।
- issue: मनुष्य द्वारा परमेश्वर को ברך
  choice: परमेश्वर को धन्य कहा
  alternative: परमेश्वर की स्तुति की
  rationale: चुना हुआ रूप मूल क्रिया के अधिक निकट है, जबकि विकल्प उसका प्रसंगगत भाव स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। मूल अरामी का ‘तब’ दो बार सुरक्षित है। निष्क्रिय ‘प्रकट किया गया’ मूल पाठ में कर्ता के अव्यक्त रहने को बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
