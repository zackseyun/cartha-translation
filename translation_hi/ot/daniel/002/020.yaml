id: DAN.2.20
reference: Daniel 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָנֵ֤ה דָֽנִיֵּאל֙ וְ/אָמַ֔ר לֶהֱוֵ֨א שְׁמֵ֤/הּ דִּֽי אֱלָהָ/א֙ מְבָרַ֔ךְ מִן עָלְמָ֖/א וְ/עַ֣ד עָלְמָ֑/א דִּ֧י חָכְמְתָ֛/א וּ/גְבוּרְתָ֖/א דִּ֥י לֵֽ/הּ הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/020.yaml
  text: 'Daniel answered and said: “Blessed be the name of God from everlasting to everlasting[b][a], for wisdom and might belong to him.”'
translation:
  language: hi
  text: दानियेल ने उत्तर दिया और कहा, “परमेश्वर का नाम युगानुयुग धन्य हो[a], क्योंकि बुद्धि और सामर्थ्य उसके हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युग से युग तक” अथवा “सदा-सर्वदा।”
    reason: lexical_alternative
  - marker: b
    text: या “बुद्धि और शक्ति उसी की हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर दिया और कहा
  rationale: अरामी कथात्मक मुहावरे के दोनों अंगों को बनाए रखते हुए यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לֶהֱוֵא ... מְבָרַךְ
  choice: धन्य हो
  rationale: इच्छा अथवा आशीर्वचन व्यक्त करने वाले रूप को हिन्दी की प्रतिष्ठित स्तुतिपरक अभिव्यक्ति में प्रस्तुत करता है।
- source_word: שְׁמֵהּ דִּי אֱלָהָא
  choice: परमेश्वर का नाम
  rationale: यह परमेश्वर की प्रकट पहचान और सम्मान से जुड़े मूल बाइबलीय मुहावरे को सुरक्षित रखता है।
- source_word: מִן עָלְמָא וְעַד עָלְמָא
  choice: युगानुयुग
  rationale: मूल वाक्यांश की असीम कालावधि को संक्षिप्त, गरिमापूर्ण और सहज आधुनिक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: דִּי
  choice: क्योंकि
  rationale: यह कण स्तुति का आधार प्रस्तुत करता है और हिन्दी में कारण-संबंध को साफ़ करता है।
- source_word: חָכְמְתָא
  choice: बुद्धि
  rationale: अमूर्त संज्ञा का सीधा और संदर्भानुकूल हिन्दी रूप है।
- source_word: גְבוּרְתָא
  choice: सामर्थ्य
  rationale: यह शक्ति या पराक्रम के अर्थ को गरिमापूर्ण ढंग से व्यक्त करता है और 'बुद्धि' के साथ स्वाभाविक युग्म बनाता है।
- source_word: דִּי לֵהּ הִיא
  choice: उसके हैं
  rationale: मूल के स्वामित्व-संबंध को सीधे व्यक्त करता है और 'केवल उसी के' जैसी अनकही विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: स्तुतिपरक सूत्र और परमेश्वर के गुण
  choice: परमेश्वर के नाम को धन्य कहा गया है, और इसका आधार यह है कि बुद्धि और सामर्थ्य उसके हैं।
  alternative: 'अधिक शब्दशः रूप: “परमेश्वर का नाम युग से युग तक धन्य हो, क्योंकि बुद्धि और शक्ति उसकी है।”'
  rationale: पद को तत्त्वमीमांसात्मक परिभाषा के बजाय स्तुति के रूप में रखा गया है। इसमें मूल पाठ से आगे कोई सम्प्रदायगत या दार्शनिक दावा नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर स्तुति के प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘धन्य हो’ और ‘युगानुयुग’ परिचित धार्मिक अभिव्यक्तियाँ हैं, जबकि वाक्य-संरचना साधारण पाठक के लिए स्पष्ट है।
