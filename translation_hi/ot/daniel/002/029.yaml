id: DAN.2.29
reference: Daniel 2:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣נְתְּה מַלְכָּ֗/א רַעְיוֹנָ/ךְ֙ עַל מִשְׁכְּבָ֣/ךְ סְלִ֔קוּ מָ֛ה דִּ֥י לֶהֱוֵ֖א אַחֲרֵ֣י דְנָ֑ה וְ/גָלֵ֧א רָזַיָּ֛/א הוֹדְעָ֖/ךְ מָה דִ֥י לֶהֱוֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/029.yaml
  text: As for you[a], O king, your thoughts came up on your bed about what would happen after this, and he who reveals mysteries has made known to you what would happen.
translation:
  language: hi
  text: हे राजा, जहाँ तक आपकी बात है, जब आप अपने बिछौने पर थे, तब आपके मन में ये विचार उठे कि इसके बाद क्या होगा; और रहस्यों को प्रकट करनेवाले[a] ने आपको बता दिया है कि क्या होनेवाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो रहस्यों को प्रकट करता है।” अरामी कृदंत को उपाधि-सदृश रूप के बजाय वर्णनात्मक उपवाक्य के रूप में भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֣נְתְּה
  choice: जहाँ तक आपकी बात है
  rationale: स्वतंत्र सर्वनाम पर विषयगत बल है। यह हिंदी अभिव्यक्ति उस बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: यह प्रत्यक्ष और दरबारी संबोधन है; ‘हे राजा’ आधुनिक, गरिमापूर्ण हिंदी में संबोधन का बल स्पष्ट करता है।
- source_word: רַעְיוֹנָךְ ... סְלִקוּ
  choice: आपके मन में ये विचार उठे
  rationale: क्रिया में ‘ऊपर उठने’ का रूपक है। ‘विचार उठे’ हिंदी में स्वाभाविक है और स्रोत की छवि भी बचाता है।
- source_word: עַל מִשְׁכְּבָךְ
  choice: जब आप अपने बिछौने पर थे
  rationale: शाब्दिक स्थान-सूचक अर्थ को सहज हिंदी वाक्य में व्यक्त करता है, बिना नींद या जागने जैसी अतिरिक्त बात जोड़े।
- source_word: מָה דִּי לֶהֱוֵא אַחֲרֵי דְנָה
  choice: कि इसके बाद क्या होगा
  rationale: राजा के विचारों की विषयवस्तु और भविष्य की ओर संकेत, दोनों स्पष्ट रहते हैं।
- source_word: וְגָלֵא רָזַיָּא
  choice: और रहस्यों को प्रकट करनेवाले
  rationale: निश्चित कृदंत को संज्ञा-सदृश वर्णन के रूप में रखा गया है। इससे परमेश्वर का नाम पाठ में जोड़े बिना उसके कार्य पर मूल बल बना रहता है।
- source_word: הוֹדְעָךְ
  choice: ने आपको बता दिया है
  rationale: कारक क्रिया ‘जानने योग्य करना’ को वर्तमान प्रसंग में स्वाभाविक हिंदी पूर्ण रूप से व्यक्त किया गया है।
- source_word: מָה דִי לֶהֱוֵא
  choice: कि क्या होनेवाला है
  rationale: भविष्य की घटना का अर्थ साफ रहता है और पहले कथन की पुनरावृत्ति भी स्वाभाविक रूप में बनी रहती है।
theological_decisions:
- issue: וְגָלֵא רָזַיָּא में परमेश्वर के लिए प्रयुक्त कृदंत-सदृश अभिव्यक्ति
  choice: रहस्यों को प्रकट करनेवाले
  alternative: जो रहस्यों को प्रकट करता है
  rationale: मूल अरामी में यहाँ ‘परमेश्वर’ या कोई दिव्य नाम स्पष्ट रूप से नहीं है। चुना हुआ रूप अभिव्यक्ति की उपाधि-सदृश शक्ति बनाए रखता है, पर उसे अनिवार्य औपचारिक नाम नहीं बनाता; वैकल्पिक वर्णनात्मक अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, आदरार्थी ‘आप’ और दरबारी संबोधन ‘हे राजा’ के साथ रखी गई है। ‘बिछौना’ प्रसंग की प्राचीन गरिमा बनाए रखता है, जबकि पूरा वाक्य सामान्य पाठक के लिए सहज है।
