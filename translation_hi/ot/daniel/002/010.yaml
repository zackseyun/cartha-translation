id: DAN.2.10
reference: Daniel 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֲנ֨וֹ כשדי/א קֳדָם מַלְכָּ/א֙ וְ/אָ֣מְרִ֔ין לָֽא אִיתַ֤י אֲנָשׁ֙ עַל יַבֶּשְׁתָּ֔/א דִּ֚י מִלַּ֣ת מַלְכָּ֔/א יוּכַ֖ל לְ/הַחֲוָיָ֑ה כָּ/ל קֳבֵ֗ל דִּ֚י כָּל מֶ֨לֶךְ֙ רַ֣ב וְ/שַׁלִּ֔יט מִלָּ֤ה כִ/דְנָה֙ לָ֣א שְׁאֵ֔ל לְ/כָל חַרְטֹּ֖ם וְ/אָשַׁ֥ף וְ/כַשְׂדָּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/002/010.yaml
  text: The Chaldeans answered before the king and said, “There is not a man on earth who can make known the king’s matter, because no great and powerful king has asked for a thing like this from any diviner-priest, enchanter, or Chaldean.”
translation:
  language: hi
  text: कसदियों ने राजा के सामने उत्तर दिया, “धरती पर ऐसा कोई मनुष्य नहीं जो राजा की बात बता सके, क्योंकि किसी भी महान और शक्तिशाली राजा ने किसी ज्योतिषी-पुरोहित, मंत्रविद् या कसदी से ऐसी बात नहीं पूछी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כשדי/א
  choice: कसदियों
  rationale: यह अरामी जाति/विद्वान-वर्ग के पारंपरिक नाम का सीधा लिप्यंतरण है; प्रसंग में यह दरबारी विशेषज्ञों के एक वर्ग को सूचित करता है।
- source_word: עַל יַבֶּשְׁתָּא
  choice: धरती पर
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप, जिसका अर्थ समस्त पृथ्वी पर है।
- source_word: מִלַּת מַלְכָּא
  choice: राजा की बात
  rationale: מִלָּה का अर्थ यहाँ राजा द्वारा माँगी गई बात/विषय है; ‘बात’ मूल की व्यापकता और हल्की अस्पष्टता बनाए रखती है।
- source_word: לְהַחֲוָיָה
  choice: बता सके
  rationale: हफेल infinitive का अर्थ ‘ज्ञात कराना/बताना’ है; वर्तमान संदर्भ में सहज और सटीक हिन्दी।
- source_word: רַב וְשַׁלִּיט
  choice: महान और शक्तिशाली
  rationale: दोनों विशेषणों को अलग रखते हुए राजा की महानता और शासन-सामर्थ्य व्यक्त की गई है।
- source_word: חַרְטֹּם
  choice: ज्योतिषी-पुरोहित
  rationale: दरबारी गूढ़-विद्या विशेषज्ञ और पुरोहितीय भूमिका दोनों को संकेत करने वाला संयुक्त पद; केवल ‘ज्योतिषी’ इसकी व्यापकता घटा सकता है।
- source_word: אָשַׁף
  choice: ओझा
  rationale: मंत्र-तंत्र अथवा जादुई क्रियाओं से जुड़े विशेषज्ञ के लिए सामान्य आधुनिक हिन्दी में बोधगम्य शब्द।
- source_word: שְׁאֵל
  choice: पूछी
  rationale: अरामी क्रिया का सामान्य अर्थ ‘पूछना/माँगना’ है; किसी व्यक्ति से बात पूछने की वाक्य-रचना हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: कसदियों के दावे की सार्वभौमिकता
  choice: उनके कथन को प्रत्यक्ष कथन के रूप में रखा गया, बिना उसकी सत्यता की पुष्टि जोड़े
  alternative: ‘उनके अनुसार’ अथवा ‘वास्तव में’ जोड़ना
  rationale: पद वक्ताओं का दावा प्रस्तुत करता है; अनुवाद को न उसे कमजोर करना चाहिए, न धर्मवैचारिक तथ्य के रूप में प्रमाणित करना चाहिए।
- issue: मִלַּת מַלְכָּא की व्याख्या
  choice: राजा की बात
  alternative: राजा का स्वप्न या राजा की माँग
  rationale: मूल पद व्यापक है। प्रसंग स्वप्न और उसकी व्याख्या की माँग से जुड़ा है, पर इस पद में स्वयं ‘स्वप्न’ स्पष्ट नहीं है; अतः अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दरबारी संबोधन की औपचारिकता ‘राजा के सामने’ से बनी रहती है। मूल अरामी की पुनरुक्त उद्धरण-भूमिका ‘उत्तर दिया और कहा’ को स्वाभाविक हिन्दी में संक्षिप्त करके ‘उत्तर दिया’ किया गया; उसके बाद प्रत्यक्ष कथन स्वतः ‘कहा’ का कार्य करता है।
