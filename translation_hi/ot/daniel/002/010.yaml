  source_fidelity: 'Draft closely reflects the Aramaic: the Chaldeans respond before the king; no person on earth can make known the king’s matter; and no great, powerful king has made such a request of these expert classes. ‘राजा की बात’ appropriately preserves the source’s nonspecific ‘matter/word,’ rather than prematurely specifying the dream.'
  naturalness: The sentence is fluent modern Hindi. However, ‘ओझा’ commonly evokes a local folk-healer/exorcist and can impose a culturally specific, pejorative image not required by the Aramaic or the English audit trail. ‘मंत्रविद्’ is a more neutral designation for an enchanter in this list of court specialists.
  terminology: ‘कसदी/कसदियों’ consistently renders Chaldean(s). ‘ज्योतिषी-पुरोहित’ adequately conveys the audit trail’s ‘diviner-priest.’ Replacing ‘ओझा’ with ‘मंत्रविद्’ better distinguishes the second technical category without importing Indian folk-religious connotations.
