  text: וַ/יֹּ֣אמֶר אֵלַ֡/י דָּנִיֵּ֣אל אִישׁ חֲ֠מֻדוֹת הָבֵ֨ן בַּ/דְּבָרִ֜ים אֲשֶׁר֩ אָנֹכִ֨י דֹבֵ֤ר אֵלֶ֨י/ךָ֙ וַ/עֲמֹ֣ד עַל עָמְדֶ֔/ךָ כִּ֥י עַתָּ֖ה שֻׁלַּ֣חְתִּי אֵלֶ֑י/ךָ וּ/בְ/דַבְּר֥/וֹ עִמִּ֛/י אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה עָמַ֥דְתִּי מַרְעִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/011.yaml
  text: And he said to me[a], “Daniel, man greatly beloved, understand the words that I am speaking to you, and stand in your place, for now I have been sent to you.” And when he spoke this word to me[c][b], I stood trembling.
translation:
  language: hi
  text: उसने मुझसे कहा, “हे दानिय्येल, अति प्रिय पुरुष,[a] जो बातें मैं तुझसे कह रहा हूँ, उन्हें समझ और अपने स्थान पर खड़ा हो जा,[b] क्योंकि अब मैं तेरे पास भेजा गया हूँ।” जब वह मुझसे यह बात कह रहा था,[c] तब मैं काँपता हुआ खड़ा हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अत्यन्त सम्मानित पुरुष।” इब्रानी पदबंध शाब्दिक रूप से बहुमूल्यता या मनोहरता से पहचाने जाने वाले पुरुष का वर्णन करता है और यहाँ सम्मानसूचक संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: या “सीधा खड़ा हो जा” अथवा “अपने नियत स्थान पर खड़ा हो जा।” इब्रानी मुहावरा शाब्दिक रूप से “अपने खड़े होने पर खड़ा हो” जैसा है।
    reason: lexical_alternative
  - marker: c
    text: या “जब उसने मुझसे यह बात कही” अथवा “जब उसने मुझे यह संदेश दिया।” यहाँ ‘बात’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘शब्द,’ ‘विषय’ या ‘संदेश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: अति प्रिय पुरुष
  rationale: यह पदबंध शाब्दिक रूप से बहुमूल्यता या मनोहरता से पहचाने जाने वाले पुरुष को दर्शाता है और यहाँ सम्मानसूचक संबोधन है। ‘अति प्रिय’ उसके आत्मीय और आदरसूचक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָבֵן
  choice: समझ
  rationale: आज्ञार्थक क्रिया दानिय्येल से आगे कही जाने वाली बातों का अर्थ ग्रहण करने को कहती है; ‘समझ’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בַּדְּבָרִים
  choice: बातें
  rationale: דבר का अर्थ शब्द, बात या विषय हो सकता है। बोलने के तात्कालिक संदर्भ में ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ की व्यापकता भी रखता है।
- source_word: דֹבֵר אֵלֶיךָ
  choice: मैं तुझसे कह रहा हूँ
  rationale: कृदन्त चल रही अथवा तात्कालिक वाणी को व्यक्त करता है। यह रूप वर्तमान प्रगतिशील भाव को सहज हिन्दी में देता है।
- source_word: וַעֲמֹד עַל עָמְדֶךָ
  choice: अपने स्थान पर खड़ा हो जा
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का प्रयोग है—लगभग ‘अपने खड़े होने के स्थान पर खड़ा हो।’ चुना हुआ रूप स्थान और सीधे खड़े होने, दोनों संभावित भावों को पर्याप्त रूप से बनाए रखता है।
- source_word: שֻׁלַּחְתִּי אֵלֶיךָ
  choice: मैं तेरे पास भेजा गया हूँ
  rationale: निष्क्रिय पूर्ण क्रिया का वर्तमान प्रसंग से संबंध है; ‘भेजा गया हूँ’ दूत के वर्तमान उद्देश्य को स्पष्ट रखता है।
- source_word: וּבְדַבְּרוֹ עִמִּי אֶת־הַדָּבָר הַזֶּה
  choice: जब उसने मुझसे यह बात कही
  rationale: पूर्वसर्गयुक्त infinitive construct समकालिक क्रिया बताता है। עִמִּי का शाब्दिक भाव ‘मेरे साथ’ है, पर बोलने के इस प्रसंग में ‘मुझसे’ स्वाभाविक हिन्दी है। ‘बात’ דבר के शब्द/संदेश/विषय संबंधी अर्थ-विस्तार को बनाए रखती है।
- source_word: מַרְעִיד
  choice: काँपता हुआ
  rationale: हिफ़ील कृदन्त शारीरिक थरथराहट व्यक्त करता है। ‘काँपता हुआ’ साधारण, स्पष्ट और प्रसंगानुकूल हिन्दी है।
theological_decisions:
- issue: स्वर्गीय दूत द्वारा दानिय्येल का सम्मानसूचक वर्णन
  choice: अति प्रिय पुरुष
  alternative: अत्यन्त सम्मानित पुरुष
  rationale: यह अनुवाद दानिय्येल के प्रति अनुग्रहपूर्ण और आदरसूचक भाव को व्यक्त करता है, पर किसी बाद की सैद्धान्तिक श्रेणी को पाठ में नहीं जोड़ता।
- issue: וַעֲמֹד עַל עָמְדֶךָ की आज्ञा का आशय
  choice: अपने स्थान पर खड़ा हो जा
  alternative: सीधा खड़ा हो जा; अपने नियत स्थान पर खड़ा हो जा
  rationale: मूल मुहावरा शारीरिक रूप से खड़े होने और अपने स्थान पर स्थित होने, दोनों की ओर संकेत कर सकता है। चुना हुआ रूप इस तनाव को पूरी तरह किसी एक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध बाइबलीय गद्य। दानिय्येल के एकवचन संबोधन में ‘तू/तेरा’ रूप स्रोत की निकटता और पारंपरिक धर्मग्रंथीय गरिमा के लिए रखा गया है। वाक्य-विन्यास को स्वाभाविक हिन्दी बनाया गया है, जबकि मूल की पुनरुक्ति, सम्मानसूचकता और अर्थगत अस्पष्टता को आवश्यक टिप्पणियों में सुरक्षित रखा गया है।
