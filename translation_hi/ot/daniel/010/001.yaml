base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/001.yaml
  text: In the third year of Cyrus king of Persia[a], a word was revealed to Daniel, who was called Belteshazzar. The word was true, and it concerned a great conflict; and he understood the word and had understanding in the vision.
translation:
  language: hi
  text: फ़ारस के राजा कुस्रू के तीसरे वर्ष में दानिय्येल को, जो बेलतशस्सर कहलाता था, एक संदेश प्रकट हुआ। वह संदेश सत्य था और एक बड़े संघर्ष के विषय में था[a]। दानिय्येल ने उस संदेश को समझ लिया, और उसे दर्शन में समझ मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और बड़ा युद्ध था।” इब्रानी वाक्यांश को अधिक शाब्दिक सैन्य अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבָר
  choice: संदेश
  rationale: यहाँ शब्द का अर्थ दानिय्येल को दी गई प्रकाशन-सामग्री है। ‘संदेश’ आधुनिक हिन्दी में स्वाभाविक है और दोनों occurrences में इसकी पुनरावृत्ति मूल पाठ की पुनरावृत्ति को बनाए रखती है।
- source_word: נִגְלָה
  choice: प्रकट हुआ
  rationale: निफ़अल रूप किसी बात के प्रकट या उद्घाटित होने को व्यक्त करता है। ‘प्रकट हुआ’ दैवी प्रकाशन का भाव रखता है, पर कर्ता को वहाँ नहीं जोड़ता जहाँ इब्रानी पाठ उसे स्पष्ट नहीं करता।
- source_word: נִקְרָא שְׁמוֹ
  choice: जो बेलतशस्सर कहलाता था
  rationale: यह इब्रानी नामकरण-वाक्यांश का स्वाभाविक हिन्दी रूप है और दानिय्येल के दूसरे नाम की पहचान कराता है।
- source_word: בֵּלְטְשַׁאצַּר
  choice: बेलतशस्सर
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार दिया गया है।
- source_word: וֶאֱמֶת הַדָּבָר
  choice: वह संदेश सत्य था
  rationale: यह प्रकाशन की विश्वसनीयता की पुष्टि करता है और דָּבָר के लिए पहले प्रयुक्त ‘संदेश’ को दोहराता है।
- source_word: וְצָבָא גָדוֹל
  choice: और एक बड़े संघर्ष के विषय में था
  rationale: צָבָא सेना, युद्ध, सैन्य सेवा या कठिन संघर्ष का बोध करा सकता है। दानिय्येल 10–12 के प्रसंग में ‘बड़ा संघर्ष’ संभावित आशय को स्पष्ट करता है, जबकि सैन्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּבִין אֶת־הַדָּבָר
  choice: दानिय्येल ने उस संदेश को समझ लिया
  rationale: בין यहाँ संदेश को समझने या उसका बोध पाने का अर्थ देता है। स्पष्ट कर्ता के साथ यह हिन्दी में सहज है।
- source_word: וּבִינָה לוֹ בַּמַּרְאֶה
  choice: और दर्शन की समझ उसे मिली
  rationale: בִּינָה לוֹ समझ के उसके पास होने या उसे प्राप्त होने को व्यक्त करता है। ‘समझ उसे मिली’ प्राप्त अंतर्दृष्टि का भाव रखता है; בַּמַּרְאֶה को ‘दर्शन की’ के रूप में जोड़ना हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: כּוֹרֶשׁ
  choice: कुस्रू
  rationale: फ़ारस के राजा Cyrus के लिए प्रचलित हिन्दी बाइबलीय नाम-रूप अपनाया गया है।
theological_decisions:
- issue: וְצָבָא גָדוֹל का अर्थ
  choice: एक बड़े संघर्ष के विषय में था
  alternative: और बड़ा युद्ध था / और बड़ी युद्ध-स्थिति थी
  rationale: वाक्यांश अर्थ की दृष्टि से कठिन है और צָבָא का सैन्य तथा व्यापक संघर्ष—दोनों अर्थ हो सकता है। मुख्य पाठ प्रसंगानुकूल व्यापक अर्थ देता है; पादटिप्पणी अधिक शाब्दिक सैन्य संभावना को बनाए रखती है।
- issue: अंतिम खंड में समझ का स्वरूप
  choice: दानिय्येल ने संदेश को समझ लिया और दर्शन की समझ उसे मिली
  alternative: संदेश को समझ, क्योंकि दर्शन की समझ उसे मिली
  rationale: रूप को दानिय्येल की वास्तविक समझ के कथन के रूप में लिया गया है, जैसा निकटवर्ती संज्ञा בִּינָה भी संकेत करती है। आदेशात्मक विश्लेषण व्याकरणतः विचारणीय है, पर इस कथात्मक भूमिका में पूर्ण घटना का कथन अधिक संभावित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘संदेश’, ‘प्रकट हुआ’, ‘संघर्ष’ और ‘दर्शन’ जैसे शब्द स्पष्ट हैं, जबकि नामों में प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। पादटिप्पणी-चिह्न उसी कठिन वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
