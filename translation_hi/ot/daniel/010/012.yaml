source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ/י֮ אַל תִּירָ֣א דָנִיֵּאל֒ כִּ֣י מִן הַ/יּ֣וֹם הָ/רִאשׁ֗וֹן אֲשֶׁ֨ר נָתַ֧תָּ אֶֽת לִבְּ/ךָ֛ לְ/הָבִ֧ין וּ/לְ/הִתְעַנּ֛וֹת לִ/פְנֵ֥י אֱלֹהֶ֖י/ךָ נִשְׁמְע֣וּ דְבָרֶ֑י/ךָ וַ/אֲנִי בָ֖אתִי בִּ/דְבָרֶֽי/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/012.yaml
  text: Then he said to me[a], “Do not fear, Daniel, because from the first day that you set your heart to understand and to humble yourself before your God, your words were heard[b], and I have come because of your words.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “दानिय्येल, मत डर। क्योंकि जिस पहले दिन तूने समझने और अपने परमेश्वर के सामने अपने को दीन करने[a] में मन लगाया, उसी दिन तेरी बातें सुनी गईं; और मैं तेरी बातों के कारण[b] आया हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने को कष्ट देने।” इब्रानी अभिव्यक्ति भक्तिपूर्ण संदर्भ में आत्म-संयम, आत्म-क्लेश या अपने को दीन करने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी बातों के उत्तर में।”
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּירָא
  choice: मत डर
  rationale: नकारात्मक आज्ञा का सीधा और स्वाभाविक हिन्दी रूप; स्वर्गदूत के आश्वासन की संक्षिप्तता बनाए रखता है।
- source_word: מִן הַיּוֹם הָרִאשׁוֹן
  choice: जिस पहले दिन … उसी दिन
  rationale: इब्रानी के आरंभ-बिंदु पर बल को स्वाभाविक हिन्दी वाक्य-रचना में व्यक्त करता है और आगे ‘सुनी गईं’ से उसका संबंध स्पष्ट रखता है।
- source_word: נָתַתָּ אֶת לִבְּךָ
  choice: अपना मन लगाया
  rationale: इब्रानी मुहावरे की संकल्प, ध्यान और आंतरिक अभिमुखता—तीनों को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהָבִין
  choice: समझने
  rationale: हिफ़ील रूप का यहाँ सीधा अर्थ समझ या अंतर्दृष्टि प्राप्त करना है; ‘समझने’ सबसे स्पष्ट और कम व्याख्यात्मक है।
- source_word: וּלְהִתְעַנּוֹת
  choice: स्वयं को दीन करने
  rationale: भक्ति और पश्चात्ताप के संदर्भ में आत्म-दीनता व्यक्त करता है, पर किसी विशिष्ट तपस्या या अनुष्ठान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לִפְנֵי אֱלֹהֶיךָ
  choice: अपने परमेश्वर के सामने
  rationale: स्थानिक और संबंधपरक दोनों भावों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: נִשְׁמְעוּ דְבָרֶיךָ
  choice: तेरी बातें सुन ली गईं
  rationale: ‘बातें’ मूल के דְבָרִים के निकट है और उन्हें स्पष्टतः ‘प्रार्थनाएँ’ कहकर व्याख्या नहीं करता; कर्मवाच्य ईश्वरीय सुनवाई को मूल की तरह अप्रत्यक्ष रखता है।
- source_word: וַאֲנִי בָאתִי בִּדְבָרֶיךָ
  choice: और मैं तेरी बातों के कारण आया हूँ
  rationale: בְּ का कारणसूचक अर्थ सरलता से व्यक्त करता है; ‘आया हूँ’ संदेशवाहक की वर्तमान उपस्थिति और पूर्व कारण के संबंध को दर्शाता है।
theological_decisions:
- issue: וּלְהִתְעַנּוֹת में दानिय्येल के भक्तिपूर्ण कार्य का अर्थ
  choice: स्वयं को दीन करने
  alternative: स्वयं को कष्ट देने
  rationale: मुख्य पाठ आध्यात्मिक आत्म-दीनता को व्यक्त करता है, लेकिन इब्रानी शब्द में आत्म-संयम या आत्म-क्लेश का भाव भी संभव है; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- issue: पद के अंत में בִּדְבָרֶיךָ का बल
  choice: तेरी बातों के कारण
  alternative: तेरी बातों के उत्तर में
  rationale: यह संदेशवाहक के आने और दानिय्येल की बातों के बीच कारणात्मक संबंध बनाए रखता है, पर स्वर्गदूतीय कार्यवाही की प्रक्रिया को आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, मानक और सम्मानपूर्ण हिन्दी है। संबोधन में ‘तू/तेरी’ का प्रयोग मूल के एकवचन निकट संबोधन तथा बाइबलीय प्रसंग के अनुरूप है। वाक्य-रचना को सहज रखने के लिए ‘जिस पहले दिन … उसी दिन’ का संबंधात्मक ढाँचा अपनाया गया है; वास्तविक शब्दार्थगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
