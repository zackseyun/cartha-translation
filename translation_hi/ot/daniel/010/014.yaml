id: DAN.10.14
reference: Daniel 10:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָ֨אתִי֙ לַ/הֲבִ֣ינְ/ךָ֔ אֵ֛ת אֲשֶׁר יִקְרָ֥ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֣ית הַ/יָּמִ֑ים כִּי ע֥וֹד חָז֖וֹן לַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/014.yaml
  text: And I have come to make you understand what will happen to your people in the latter days[b][a], for the vision is yet for days to come.
translation:
  language: hi
  text: और मैं तुम्हें यह समझाने आया हूँ कि अन्तिम दिनों में[a] तुम्हारे लोगों के साथ क्या होगा, क्योंकि यह दर्शन अभी आनेवाले दिनों के विषय में है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाद के दिनों में” अथवा अधिक शब्दशः, “दिनों के अन्त में।” यह हिब्रू भविष्यसूचक मुहावरा घटनाओं की भावी परिणति की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: या, “यह दर्शन बहुत दिनों बाद के समय के विषय में है।” हिब्रू वाक्यांश ऐसे समय की ओर संकेत करता है जो अभी भविष्य में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתִי
  choice: और मैं ... आया हूँ
  rationale: वाव-संयोजित काल पूर्ण क्रिया वक्ता के आकर उपस्थित होने और उसके वर्तमान उद्देश्य, दोनों को व्यक्त करती है; हिन्दी का पूर्ण वर्तमान इस संदर्भ में स्वाभाविक है।
- source_word: לַהֲבִינְךָ
  choice: तुम्हें यह समझाने
  rationale: בין का हिफ़ील रूप कारणवाचक है—वक्ता केवल स्वयं समझने नहीं, बल्कि दानिय्येल को समझाने आया है।
- source_word: יִקְרָה לְעַמְּךָ
  choice: तुम्हारे लोगों के साथ क्या होगा
  rationale: קרה के साथ ל प्रभावित पक्ष को दर्शाता है। ‘के साथ क्या होगा’ सहज हिन्दी है और घटना को अनावश्यक रूप से विपत्तिपूर्ण नहीं बनाता।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: अन्तिम दिनों में
  rationale: यह हिब्रू का भविष्यसूचक काल-सूचक मुहावरा है। चुना हुआ रूप उसकी पारंपरिक छवि बनाए रखता है, जबकि पादटिप्पणी अधिक शब्दशः विकल्प देती है।
- source_word: כִּי עוֹד חָזוֹן לַיָּמִים
  choice: क्योंकि यह दर्शन अभी आनेवाले दिनों के विषय में है
  rationale: כִּי कारण या स्पष्टीकरण देता है; עוֹד भविष्य में शेष होने का भाव रखता है; और לַיָּמִים दर्शन के भावी समय से संबंध को दर्शाता है। ‘अभी’ यहाँ दर्शन के पूरे होने में समय बाकी होने का संकेत देता है।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים का युगान्त-संबंधी आशय
  choice: अन्तिम दिनों में
  alternative: बाद के दिनों में
  rationale: मूल मुहावरा घटनाओं की भावी परिणति की ओर संकेत करता है, पर किसी विशेष सम्प्रदाय की अन्त-समय संबंधी समय-सारणी निर्धारित नहीं करता। मुख्य पाठ परिचित भविष्यसूचक भाषा रखता है और पादटिप्पणी उसकी शाब्दिक व्यापकता दिखाती है।
- issue: לַיָּמִים में समय की दूरी या अवधि
  choice: आनेवाले दिनों के विषय में
  alternative: बहुत दिनों बाद के समय के विषय में
  rationale: व्यंजनरहित/संक्षिप्त हिब्रू वाक्यांश भावी दिनों, और संभवतः समय की दूरी, दोनों की गुंजाइश रखता है। मुख्य पाठ भविष्याभिमुखता स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे लोगों के साथ क्या होगा’ सामान्य पाठक के लिए स्वाभाविक है; भविष्यसूचक मुहावरे की धार्मिक गूँज को बनाए रखते हुए उसका अर्थ किसी विशिष्ट अन्त-समय सिद्धान्त तक सीमित नहीं किया गया।
