base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/004.yaml
  text: On the twenty-fourth day of the first month[a], I was by the side of the great river—that is, the Tigris.
translation:
  language: hi
  text: पहले महीने के चौबीसवें दिन मैं बड़ी नदी के किनारे था—वह दजला[a] नदी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “हिद्देकेल”, जो दजला नदी का प्रचलित हिब्रू नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: चौबीसवें दिन
  rationale: हिब्रू में संख्या अक्षरशः ‘चौबीस’ है, पर तिथि बताने के लिए आधुनिक हिन्दी में क्रमवाचक ‘चौबीसवें दिन’ स्वाभाविक है। आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी प्रवाह में आवश्यक नहीं है।
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के
  rationale: यह तिथि-सूत्र में महीने को निर्दिष्ट करता है; ‘पहले महीने के’ आधुनिक हिन्दी का सहज और निकट समतुल्य है।
- source_word: וַאֲנִי הָיִיתִי
  choice: मैं ... था
  rationale: यहाँ היה वक्ता की उस समय की स्थिति और स्थान बताता है; साधारण हिन्दी ‘मैं ... था’ इसके अर्थ को स्पष्ट रखती है।
- source_word: עַל יַד הַנָּהָר
  choice: नदी के किनारे
  rationale: עַל יַד का अर्थ ‘बगल में/पास’ है। नदी के संदर्भ में ‘किनारे’ स्वाभाविक हिन्दी है, यद्यपि मूल पद में ‘तट’ के लिए कोई विशिष्ट संज्ञा नहीं है।
- source_word: הַנָּהָר הַגָּדוֹל
  choice: बड़ी नदी
  rationale: यह संज्ञा और विशेषण का सीधा अनुवाद है। ‘महानदी’ को हिन्दी में किसी नदी का विशिष्ट नाम समझा जा सकता है, इसलिए ‘बड़ी नदी’ अधिक स्पष्ट है।
- source_word: הוּא חִדָּקֶל
  choice: वह दजला नदी थी
  rationale: הוּא यहाँ पहले कही गई नदी की पहचान स्पष्ट करता है। חִדָּקֶל का आधुनिक हिन्दी में परिचित भौगोलिक नाम ‘दजला’ है; मूल हिब्रू नाम फुटनोट में सुरक्षित रखा गया है।
