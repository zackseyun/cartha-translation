  text: וַ/אֲנִי֙ נִשְׁאַ֣רְתִּי לְ/בַדִּ֔/י וָֽ/אֶרְאֶ֗ה אֶת הַ/מַּרְאָ֤ה הַ/גְּדֹלָה֙ הַ/זֹּ֔את וְ/לֹ֥א נִשְׁאַר בִּ֖/י כֹּ֑ח וְ/הוֹדִ֗/י נֶהְפַּ֤ךְ עָלַ/י֙ לְ/מַשְׁחִ֔ית וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/008.yaml
  text: So I alone was left and saw this great vision[a], and no strength remained in me; my splendor was turned to ruin upon me[b], and I retained no strength.
translation:
  language: hi
  text: और मैं अकेला रह गया और मैंने यह महान दर्शन[a] देखा। मुझमें कोई शक्ति न रही; मेरा तेज बिगड़कर नष्ट हो गया[b], और मैं कोई शक्ति सँभाल न सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “यह महान दृश्य” या “यह महान दिखाई देने वाला रूप।”
    reason: lexical_alternative
  - marker: b
    text: अथवा “मेरा रूप बिगड़कर नष्ट हो गया” या “मेरी स्फूर्ति नष्ट हो गई।” इब्रानी पद का अधिक शाब्दिक अर्थ है, “मेरा तेज मुझ पर विनाश में बदल गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁאַרְתִּי לְבַדִּי
  choice: मैं अकेला रह गया
  rationale: यह נִשְׁאַרְתִּי के ‘रह जाना’ और לְבַדִּי के ‘अकेला’—दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: הַמַּרְאָה הַגְּדֹלָה הַזֹּאת
  choice: यह महान दर्शन
  rationale: מַרְאָה दृश्य, प्रकट रूप या दर्शन को सूचित कर सकता है; दानिय्येल 10 के प्रकाशनात्मक संदर्भ में ‘दर्शन’ सबसे स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: כֹּחַ
  choice: शक्ति
  rationale: दोनों प्रयोगों में दानिय्येल की शारीरिक सामर्थ्य अभिप्रेत है; ‘शक्ति’ स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: וְלֹא נִשְׁאַר בִּי כֹּחַ
  choice: मुझमें कोई शक्ति न रही
  rationale: यह בִּי के आंतरिक स्थान और נִשְׁאַר के ‘शेष रहना’ के भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹדִי
  choice: मेरा तेज
  rationale: הוֹד का मूल भाव तेज, शोभा या प्रताप है। यहाँ यह दानिय्येल की सामान्य दीप्ति अथवा स्वस्थ बाहरी दशा की ओर संकेत कर सकता है; ‘तेज’ उस शाब्दिक केंद्र को बनाए रखता है।
- source_word: נֶהְפַּךְ עָלַי לְמַשְׁחִית
  choice: बिगड़कर नष्ट हो गया
  rationale: निफ़ाल נֶהְפַּךְ परिवर्तन को और מַשְׁחִית विनाशकारी अथवा बिगड़ी हुई दशा को व्यक्त करता है। शाब्दिक ‘मुझ पर विनाश में बदल गया’ हिन्दी में अत्यंत अस्वाभाविक है; चुना हुआ रूप कठोर परिणाम को बचाते हुए अर्थ स्पष्ट करता है। עָלַי का सम्बन्ध स्वयं दानिय्येल से है और हिन्दी में ‘मेरा’ तथा क्रिया-संरचना से निहित है।
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: मैं कोई शक्ति सँभाल न सका
  rationale: עצר यहाँ शक्ति को रोके रखने या बनाए रखने का भाव देता है। ‘सँभाल न सका’ क्षमता की विफलता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अपोकैलिप्टिक संदर्भ में הַמַּרְאָה का स्वरूप
  choice: दर्शन
  alternative: दृश्य; प्रकट रूप
  rationale: व्यापक संदर्भ प्रकाशनात्मक दर्शन का है, पर इब्रानी शब्द की दृश्य अथवा प्रकट रूप वाली अर्थ-सीमा पादटिप्पणी में सुरक्षित रखी गई है।
- issue: दानिय्येल की दशा के सम्बन्ध में הוֹדִי का अर्थ
  choice: मेरा तेज
  alternative: मेरा रूप; मेरी स्फूर्ति
  rationale: ‘तेज’ इब्रानी शब्द के शोभा/दीप्ति वाले मूल भाव को बनाए रखता है और इसे केवल शारीरिक रूप या बल तक सीमित नहीं करता।
- issue: לְמַשְׁחִית द्वारा सूचित परिवर्तन
  choice: बिगड़कर नष्ट हो गया
  alternative: विनाश में बदल गया; मेरा रूप बिगड़ गया
  rationale: पद दानिय्येल की दशा में तीव्र ह्रास व्यक्त करता है, लेकिन ठीक-ठीक यह रूप, तेज या स्फूर्ति का नाश है—इस तनाव को मुख्य पाठ और पादटिप्पणी मिलकर सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘महान दर्शन,’ ‘तेज’ और ‘शक्ति’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर अस्वाभाविक इब्रानी वाक्य-विन्यास की नकल नहीं की गई। दोनों पादटिप्पणी-चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
