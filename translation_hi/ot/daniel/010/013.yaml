  text: וְ/שַׂ֣ר מַלְכ֣וּת פָּרַ֗ס עֹמֵ֤ד לְ/נֶגְדִּ/י֙ עֶשְׂרִ֣ים וְ/אֶחָ֣ד י֔וֹם וְ/הִנֵּ֣ה מִֽיכָאֵ֗ל אַחַ֛ד הַ/שָּׂרִ֥ים הָ/רִאשֹׁנִ֖ים בָּ֣א לְ/עָזְרֵ֑/נִי וַ/אֲנִי֙ נוֹתַ֣רְתִּי שָׁ֔ם אֵ֖צֶל מַלְכֵ֥י פָרָֽס׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/013.yaml
  text: But the prince of the kingdom of Persia stood against me for twenty-one days[a], and behold, Michael, one of the chief princes, came to help me[b], and I was left there beside the kings of Persia.
translation:
  language: hi
  text: परन्तु फ़ारस के राज्य का अधिपति इक्कीस दिन तक मेरा विरोध करता रहा; और देखो, प्रमुख अधिपतियों में से एक, मीकाएल[a], मेरी सहायता करने आया; और मैं वहाँ फ़ारस के राजाओं के पास रह गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहले अधिपतियों में से एक” अथवा “सबसे प्रमुख अधिपतियों में से एक।”
    reason: इब्रानी הָרִאשֹׁנִים क्रम में ‘पहले’ या पद में ‘प्रमुख’ का बोध करा सकता है।
  - marker: b
    text: मूल इब्रानी में “फ़ारस के राजाओं” बहुवचन है; “के पास” का अर्थ “के साथ” या “के निकट” भी हो सकता है।
    reason: बहुवचन מַלְכֵי और संबंधसूचक אֵצֶל—दोनों की सूक्ष्मता को सुरक्षित रखना।
lexical_decisions:
- source_word: שַׂר
  choice: हाकिम
  rationale: यह शब्द ऊँचे पद के शासक या अधिकारी को सूचित करता है। संदर्भ अलौकिक सत्ता की ओर संकेत करता है, पर मूल शब्द स्वयं ‘स्वर्गदूत’ नहीं कहता; इसलिए ‘हाकिम’ मानवीय और स्वर्गीय दोनों संभावनाएँ खुली रखता है।
- source_word: מַלְכוּת פָּרַס
  choice: फ़ारस का राज्य
  rationale: यह संबंधवाचक इब्रानी पदबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और फ़ारस के प्रभुत्व-क्षेत्र का स्पष्ट उल्लेख बनाए रखता है।
- source_word: עֹמֵד לְנֶגְדִּי
  choice: मेरा विरोध करता रहा
  rationale: कृदन्त के लगातार जारी विरोध के भाव को अवधि-सूचक अगले पद के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶשְׂרִים וְאֶחָד יוֹם
  choice: इक्कीस दिन तक
  rationale: अवधि को आधुनिक हिन्दी की सहज रचना में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: अचानक ध्यान आकर्षित करने वाली मूल अभिव्यक्ति की सजीवता और गंभीरता को बनाए रखता है।
- source_word: מִיכָאֵל
  choice: मीकाएल
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אַחַד הַשָּׂרִים הָרִאשֹׁנִים
  choice: प्रधान हाकिमों में से एक
  rationale: רִאשֹׁנִים यहाँ पद, प्रमुखता या क्रम में ‘पहले’ होने का संकेत दे सकता है; ‘प्रधान’ सन्दर्भ में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בָּא לְעָזְרֵנִי
  choice: मेरी सहायता करने आया
  rationale: गति और उद्देश्य दोनों को सीधे और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: נוֹתַרְתִּי
  choice: रह गया
  rationale: निफ़अल रूप के ‘छूटे रहना/बने रहना’ भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: אֵצֶל מַלְכֵי פָרָס
  choice: फ़ारस के राजाओं के पास
  rationale: אֵצֶל के ‘पास/निकट/साथ’ अर्थ को व्यक्त करता है और मूल के बहुवचन ‘राजाओं’ को सुरक्षित रखता है।
theological_decisions:
- issue: फ़ारस के राज्य के हाकिम और प्रधान हाकिमों की पहचान
  choice: मुख्य पाठ में ‘हाकिम’ रखकर उनकी पहचान को स्पष्टतः स्वर्गदूत या मनुष्य के रूप में निर्धारित नहीं किया गया।
  alternative: ‘स्वर्गदूत’, ‘दुष्ट आत्मिक हाकिम’, या ‘राजकुमार’ कहकर पहचान को अधिक निश्चित करना।
  rationale: संदर्भ अलौकिक संघर्ष का प्रबल संकेत देता है, विशेषकर मीकाएल के समानांतर उल्लेख से; फिर भी इब्रानी שַׂר का अनुवाद व्याख्यात्मक रूप से ‘स्वर्गदूत’ करना मूल की वास्तविक अस्पष्टता को मिटा देगा।
- issue: מַלְכֵי פָרָס का बहुवचन
  choice: ‘फ़ारस के राजाओं’ के रूप में बहुवचन सुरक्षित रखा गया।
  alternative: सन्दर्भ को सरल बनाने के लिए ‘फ़ारस के राजा’ कहना।
  rationale: मसोरेटिक इब्रानी पाठ स्पष्टतः बहुवचन है। यह राजवंश, अनेक राजाओं या अन्य राजकीय सत्ताओं की ओर संकेत कर सकता है; अनुवाद इनमें से किसी एक को निर्णायक नहीं बनाता।
- issue: אֵצֶל का संबंधसूचक अर्थ
  choice: ‘के पास’
  alternative: ‘के साथ’ या ‘के निकट’
  rationale: मूल पद सामान्यतः निकटता या संगति बताता है। ‘के पास’ स्थानिक संबंध को बचाता है और यह अनावश्यक रूप से नहीं बताता कि वक्ता उन राजाओं का सहयोगी था या विरोधी।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हाकिम’ को दोनों समानांतर occurrences में एकरूप रखा गया है ताकि राजनीतिक और अलौकिक पद की मूल अस्पष्टता बनी रहे। वाक्य-विन्यास इब्रानी के क्रम के निकट है, पर हिन्दी में अवधि और जारी विरोध के भाव के लिए ‘इक्कीस दिन तक ... करता रहा’ अपनाया गया है।
