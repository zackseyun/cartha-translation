    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अभिव्यक्ति अचानक घटती बात की ओर ध्यान खींचती है; ‘और देखो’ इसकी जीवंत कथात्मक शक्ति बनाए रखता है।
- source_word: יָד
  choice: एक हाथ
  rationale: इब्रानी में संज्ञा अनिश्चित है, इसलिए ‘एक हाथ’ उपयुक्त है और हाथ किसका था, इस कथात्मक अनिश्चितता को बनाए रखता है।
- source_word: נָגְעָה בִּי
  choice: मुझे छुआ
  rationale: नגע का सामान्य और संदर्भानुकूल अर्थ शारीरिक रूप से ‘छूना’ है।
- source_word: וַתְּנִיעֵנִי
  choice: मुझे हिलाकर
  rationale: נוע के हिफ़ील रूप में किसी को हिलाने, चलाने या कंपाने का भाव हो सकता है। ‘हिलाकर’ कारणवाचक अर्थ बनाए रखते हुए जानबूझकर व्यापक है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: עַל בִּרְכַּי וְכַפּוֹת יָדָי
  choice: मेरे घुटनों और हथेलियों के बल
  rationale: यह परिणामी शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है और כַּפּוֹת יָדַי के विशिष्ट अर्थ ‘हथेलियाँ’ को सुरक्षित रखता है।
