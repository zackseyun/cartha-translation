  edition: WLC
  text: וַ/יֹּ֗אמֶר הֲ/יָדַ֨עְתָּ֙ לָ/מָּה בָּ֣אתִי אֵלֶ֔י/ךָ וְ/עַתָּ֣ה אָשׁ֔וּב לְ/הִלָּחֵ֖ם עִם שַׂ֣ר פָּרָ֑ס וַ/אֲנִ֣י יוֹצֵ֔א וְ/הִנֵּ֥ה שַׂר יָוָ֖ן בָּֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/020.yaml
  text: Then he said[a], “Do you know why I have come to you? And now I will return to fight against the prince of Persia; and when I go out, behold[c][b], the prince of Greece is coming.”
translation:
  language: hi
  text: तब उसने कहा, “क्या तुम जानते हो कि मैं तुम्हारे पास क्यों आया हूँ? अब मैं फारस के प्रधान[b] से लड़ने के लिए लौटूँगा; और जब मैं निकलूँगा[a], तो देखो, यूनान[c] का प्रधान आ रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और मैं निकल रहा हूँ।” इब्रानी वाक्यांश संक्षिप्त है; इसका अर्थ साधारण प्रस्थान या कालगत क्रम—“जब मैं निकलूँगा”—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “प्रधान” संभवतः किसी राष्ट्र से जुड़ी अलौकिक सत्ता को दर्शाता है, हालाँकि इस पद में पाठ उसे स्पष्ट रूप से ऐसा नहीं कहता।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में “यावान,” जो सामान्यतः यूनान या यूनानी साम्राज्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדַעְתָּ
  choice: क्या तुम जानते हो
  rationale: प्रश्नवाचक रूप यहाँ दानिय्येल से पूछता है कि क्या वह आने का कारण जानता या समझता है। यह आधुनिक हिन्दी में सहज और अर्थनिष्ठ है।
- source_word: לָמָּה בָּאתִי אֵלֶיךָ
  choice: मैं तुम्हारे पास क्यों आया हूँ
  rationale: לָמָּה कारण पूछता है और पूर्ण क्रिया का वर्तमान बातचीत से संबंध है; इसलिए ‘क्यों आया हूँ’ स्वाभाविक है।
- source_word: וְעַתָּה אָשׁוּב
  choice: अब मैं ... लौटूँगा
  rationale: यह कथन में आगे बढ़ने का संकेत देता है और אָשׁוּב संदर्भ में भविष्य की ओर उन्मुख वापसी को व्यक्त करता है।
- source_word: לְהִלָּחֵם עִם
  choice: से लड़ने के लिए
  rationale: यह प्रयोग विरोधी के साथ संघर्ष करने का अर्थ देता है; हिन्दी में ‘से लड़ना’ स्पष्ट और स्वाभाविक है।
- source_word: שַׂר פָּרָס
  choice: फारस का प्रधान
  rationale: שַׂר का अर्थ प्रधान, सरदार, अधिकारी या राजकुमार हो सकता है। ‘प्रधान’ पद की व्यापकता बनाए रखता है और इस पद में ही उसे मानव या अलौकिक घोषित नहीं करता।
- source_word: וַאֲנִי יוֹצֵא
  choice: जब मैं निकलूँगा
  rationale: संक्षिप्त इब्रानी उपवाक्य को प्रसंगानुसार कालगत क्रम के रूप में पढ़ा गया है; शाब्दिक समन्वयी अर्थ फुटनोट में सुरक्षित है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह कण आगे आने वाली बात की ओर विशेष ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दर्शन की गंभीरता बनाए रखता है।
- source_word: יָוָן
  choice: यूनान
  rationale: इस संदर्भ में יָוָן यूनान अथवा यूनानी साम्राज्य का प्रचलित संकेत है; ‘यूनान’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: בָּא
  choice: आ रहा है
  rationale: कृदन्त रूप चल रही या निकट आती क्रिया को व्यक्त करता है; ‘आ रहा है’ इस पहलू को सीधे व्यक्त करता है।
theological_decisions:
- issue: फारस और यूनान के ‘प्रधान’ की पहचान
  choice: मुख्य पाठ में केवल ‘प्रधान’ रखा गया है।
  alternative: उन्हें अलौकिक क्षेत्रीय शासक, दुष्ट आत्मिक सत्ता, स्वर्गदूत या मानवीय राजनीतिक शासक के रूप में स्पष्ट करना।
  rationale: व्यापक प्रसंग अलौकिक सत्ताओं की ओर प्रबल संकेत करता है, पर इस पद में इब्रानी पाठ स्वयं ऐसा कोई स्पष्ट विशेषण नहीं लगाता। इसलिए अनुवाद व्याख्यात्मक पहचान आरोपित नहीं करता।
- issue: וַאֲנִי יוֹצֵא का संबंध
  choice: ‘जब मैं निकलूँगा’ के रूप में कालगत क्रम व्यक्त किया गया है।
  alternative: ‘और मैं निकल रहा हूँ’ अथवा ‘और मैं निकलता हूँ।’
  rationale: इब्रानी वाक्यांश संक्षिप्त है और उसके संबंध की सूक्ष्मता अस्पष्ट रह सकती है। सहज हिन्दी के लिए कालगत अर्थ मुख्य पाठ में है, जबकि सरल प्रस्थान वाला अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ मूल शब्द की व्यापकता और पद की धार्मिक अस्पष्टता बनाए रखता है; ‘देखो’ दर्शनात्मक कथन में ध्यानाकर्षण का स्वाभाविक हिन्दी रूप है।
