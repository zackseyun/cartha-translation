  text: Again one with the appearance of a man touched me and strengthened me[a].
translation:
  language: hi
  text: फिर मनुष्य के समान दिखाई देने वाले ने[a] मुझे छुआ और मुझे बल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के स्वरूप जैसा”; या, “मनुष्य जैसा कोई।” इब्रानी में उस आकृति की दिखाई देने वाली समानता का वर्णन है; उसे केवल मनुष्य नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: फिर
  rationale: यहाँ יסף के साथ अगली क्रिया किसी कार्य के दोबारा होने का भाव देती है। ‘फिर’ आधुनिक हिन्दी में इस पुनरावृत्ति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּגַּע בִּי
  choice: मुझे छुआ
  rationale: इस प्रसंग में נגע के साथ ב शारीरिक स्पर्श को दर्शाता है; इसके बाद बल दिए जाने का उल्लेख भी इसी अर्थ के अनुकूल है।
- source_word: כְּמַרְאֵה אָדָם
  choice: मनुष्य के समान दिखाई देने वाले
  rationale: מַרְאֶה दृश्य रूप या स्वरूप को बताता है और כְּ समानता प्रकट करता है। यह अनुवाद उस आकृति को केवल मनुष्य घोषित किए बिना उसके मानवीय रूप का वर्णन करता है।
- source_word: וַיְחַזְּקֵנִי
  choice: मुझे बल दिया
  rationale: पिएल रूप में חזק का अर्थ बल देना या दृढ़ करना है। ‘बल दिया’ दानिय्येल की शारीरिक और भावनात्मक दशा—दोनों पर लागू हो सकता है और अर्थ को केवल प्रोत्साहन तक सीमित नहीं करता।
theological_decisions:
- issue: मनुष्य के समान दिखाई देने वाली आकृति की पहचान
  choice: आकृति का केवल वर्णन किया गया है; उसकी पहचान निर्धारित नहीं की गई
  alternative: उसे स्वर्गदूत या देहधारण से पहले का मसीह मानना
  rationale: इब्रानी पाठ केवल उसके मनुष्य-समान दिखाई देने की बात कहता है। इसलिए अनुवाद किसी ऐसी विशिष्ट धार्मिक पहचान को नहीं जोड़ता जिसे यह पद स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य के समान दिखाई देने वाले’ से मूल की दृश्य समानता और आकृति की अनिर्धारित पहचान दोनों सुरक्षित रहती हैं।
