  text: לֶ֣חֶם חֲמֻד֞וֹת לֹ֣א אָכַ֗לְתִּי וּ/בָשָׂ֥ר וָ/יַ֛יִן לֹא בָ֥א אֶל פִּ֖/י וְ/ס֣וֹךְ לֹא סָ֑כְתִּי עַד מְלֹ֕את שְׁלֹ֥שֶׁת שָׁבֻעִ֖ים יָמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/003.yaml
  text: I ate no delicacies[a], and no meat or wine entered my mouth, nor did I anoint myself at all[b], until the completion of three full weeks.
translation:
  language: hi
  text: मैंने कोई उत्तम भोजन[a] नहीं खाया; न मांस और न दाखमधु मेरे मुँह में आया, और मैंने अपने शरीर पर बिलकुल तेल नहीं लगाया, जब तक पूरे तीन सप्ताह[b] समाप्त नहीं हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मनभावनी वस्तुओं की रोटी”; अर्थात उत्तम या रुचिकर भोजन।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तीन सप्ताह, दिन”; अर्थात पूरे तीन सप्ताह।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם חֲמֻדוֹת
  choice: स्वादिष्ट भोजन
  rationale: शाब्दिक रूप से यह पदबंध ‘मनभावनी/बहुमूल्य वस्तुओं की रोटी’ है, पर यहाँ मुहावरे के रूप में उत्तम या रुचिकर भोजन को दर्शाता है। ‘स्वादिष्ट भोजन’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और इसे केवल रोटी तक सीमित नहीं करता।
- source_word: בָשָׂר
  choice: मांस
  rationale: भोजन के प्रसंग में इसका सीधा और स्वाभाविक हिन्दी पर्याय ‘मांस’ है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का परंपरागत, स्पष्ट और सटीक हिन्दी बाइबलीय पर्याय है।
- source_word: לֹא בָא אֶל־פִּי
  choice: मेरे मुँह में नहीं गया
  rationale: हिब्रू अभिव्यक्ति को निकटता से रखते हुए हिन्दी में स्वाभाविक ढंग से सेवन से परहेज़ व्यक्त करता है।
- source_word: וְסוֹךְ לֹא סָכְתִּי
  choice: मैंने अपने शरीर पर तेल भी बिलकुल नहीं लगाया
  rationale: हिब्रू क्रिया शरीर पर तेल लगाने की सामान्य सज्जा या ताज़गी देने वाली प्रथा बताती है। ‘बिलकुल नहीं’ उसी धातु के infinitive absolute और finite verb के मेल से आए बल को व्यक्त करता है। ‘अपने शरीर पर’ आशय स्पष्ट करता है, बिना धार्मिक अभिषेक का अनावश्यक संकेत दिए।
- source_word: עַד מְלֹאת
  choice: बीतने तक
  rationale: यह अवधि के पूर्ण हो जाने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹשֶׁת שָׁבֻעִים יָמִים
  choice: पूरे तीन सप्ताह
  rationale: शाब्दिक संरचना ‘तीन सप्ताह, दिन’ है; प्रसंग में यह तीन पूर्ण सप्ताहों पर बल देती है।
theological_decisions:
- issue: तेल लगाने की क्रिया का स्वरूप
  choice: शरीर पर तेल लगाना
  alternative: अपना अभिषेक करना
  rationale: प्रसंग उपवास-सदृश शोक और व्यक्तिगत सज्जा या ताज़गी से परहेज़ का है। ‘अभिषेक’ धार्मिक संस्कार का ऐसा अर्थ ला सकता है जो मूल पाठ में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य अपनाया गया है। ‘दाखमधु’ बाइबलीय संदर्भ में परिचित शब्द है; बाकी वाक्यावली सामान्य पाठकों के लिए सहज रखी गई है।
