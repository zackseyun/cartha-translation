source:
  edition: WLC
  text: וְ/רָאִיתִי֩ אֲנִ֨י דָנִיֵּ֤אל לְ/בַדִּ/י֙ אֶת הַ/מַּרְאָ֔ה וְ/הָ/אֲנָשִׁים֙ אֲשֶׁ֣ר הָי֣וּ עִמִּ֔/י לֹ֥א רָא֖וּ אֶת הַ/מַּרְאָ֑ה אֲבָ֗ל חֲרָדָ֤ה גְדֹלָה֙ נָפְלָ֣ה עֲלֵי/הֶ֔ם וַֽ/יִּבְרְח֖וּ בְּ/הֵחָבֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/007.yaml
  text: And I[a], Daniel, alone saw the vision, and the men who were with me did not see the vision; but a great trembling fell upon them[b], and they fled to hide themselves.
translation:
  language: hi
  text: और मैं, दानिय्येल, ने ही उस दर्शन को देखा। जो पुरुष मेरे साथ थे, उन्होंने उस दर्शन को नहीं देखा; फिर भी उन पर बड़ी थरथराहट[a] छा गई, और वे छिपने के लिए भाग गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़ा आतंक।” इब्रानी חֲרָדָה का अर्थ थरथराहट, भय या आतंक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे भागकर छिप गए” अथवा “वे भागकर कहीं छिप गए।” इब्रानी בְּהֵחָבֵא उनके भागने का उद्देश्य या ढंग व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתִי אֲנִי דָנִיֵּאל לְבַדִּי
  choice: और केवल मैंने, दानिय्येल ने, ... देखा
  rationale: स्पष्ट सर्वनाम, नाम और לְבַדִּי मिलकर दानिय्येल पर बल देते हैं। यह रचना उस बल और इस बात को स्वाभाविक हिन्दी में रखती है कि दर्शन केवल उसी ने देखा।
- source_word: הַמַּרְאָה
  choice: उस दर्शन को
  rationale: מַרְאָה का अर्थ दिखाई देने वाला रूप भी हो सकता है, पर दानिय्येल के इस प्रकाशनात्मक प्रसंग में ‘दर्शन’ सबसे उपयुक्त है। निश्चित उपपद को प्रसंगानुकूल ‘उस’ से व्यक्त किया गया है।
- source_word: וְהָאֲנָשִׁים אֲשֶׁר הָיוּ עִמִּי
  choice: जो पुरुष मेरे साथ थे
  rationale: אֲנָשִׁים यहाँ पुल्लिंग बहुवचन है और साथ उपस्थित पुरुषों को सूचित करता है; ‘पुरुष’ स्रोत के लिंग-संकेत को बनाए रखता है।
- source_word: לֹא רָאוּ אֶת הַמַּרְאָה
  choice: उन्होंने उस दर्शन को नहीं देखा
  rationale: पहले खंड के ‘दर्शन’ और ‘देखा’ को दोहराने से दानिय्येल और उसके साथियों के अनुभव का स्पष्ट विरोध बना रहता है।
- source_word: אֲבָל
  choice: फिर भी
  rationale: साथियों ने दर्शन नहीं देखा, फिर भी उस घटना का भयावह प्रभाव उन पर पड़ा। ‘फिर भी’ इस अप्रत्याशित विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: חֲרָדָה גְדֹלָה
  choice: बड़ी थरथराहट
  rationale: חֲרָדָה शारीरिक कंपकंपी के साथ भय या आतंक भी व्यक्त कर सकता है। ‘बड़ी थरथराहट’ मूल बिंब को रखती है, जबकि अर्थ-विकल्प पादटिप्पणी में दिया गया है।
- source_word: נָפְלָה עֲלֵיהֶם
  choice: उन पर ... छा गई
  rationale: शाब्दिक ‘उन पर गिर पड़ी’ हिन्दी में अस्वाभाविक लग सकता है। ‘छा गई’ किसी प्रबल अनुभव द्वारा अभिभूत होने का इब्रानी भाव सहजता से व्यक्त करता है।
- source_word: וַיִּבְרְחוּ בְּהֵחָבֵא
  choice: वे छिपने के लिए भाग गए
  rationale: וַיִּבְרְחוּ कथा को आगे बढ़ाता है और בְּהֵחָבֵא उनके भागने के उद्देश्य या ढंग को बताता है। ‘छिपने के लिए भाग गए’ उद्देश्य का स्वाभाविक पाठ देता है।
