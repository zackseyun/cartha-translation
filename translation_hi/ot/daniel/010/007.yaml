  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘केवल मैंने, दानिय्येल ने’ मूल के आत्मपरिचय और बल को सुरक्षित रखता है। स्रोत की शब्दावली और विरोधात्मक संरचना को यथासंभव बनाए रखते हुए केवल उन मुहावरों को स्वाभाविक हिन्दी रूप दिया गया है जो शाब्दिक अनुवाद में कृत्रिम लगते।
