  yaml_path: translation/ot/daniel/010/015.yaml
  text: And when he spoke these words with me[b][a], I set my face toward the ground and became speechless.
translation:
  language: hi
  text: जब वह मुझसे ये बातें कह रहा था, तब मैंने अपना चेहरा भूमि की ओर झुका लिया और बोल न सका।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְדַבְּרוֹ
  choice: जब वह ... कह रहा था
  rationale: ב के साथ infinitive construct यहाँ काल-सूचक है। अपूर्णकालिक भाव को स्वाभाविक हिन्दी में ‘जब ... कह रहा था’ से व्यक्त किया गया है।
- source_word: עִמִּי
  choice: मुझसे
  rationale: עם का मूल अर्थ ‘साथ’ है, पर बोलने के प्रसंग में आधुनिक हिन्दी का ‘मुझसे कहना’ स्वाभाविक है और परस्पर उपस्थिति का भाव बनाए रखता है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דברים का अर्थ ‘शब्द’ या ‘बातें’ हो सकता है। यहाँ कही जा रही विषय-वस्तु के लिए ‘ये बातें’ अधिक स्वाभाविक है।
- source_word: נָתַתִּי פָנַי אַרְצָה
  choice: मैंने अपना मुँह भूमि की ओर झुका लिया
  rationale: हिब्रू मुहावरे में मुख को धरती की ओर करने का चित्र है। ‘झुका लिया’ शारीरिक मुद्रा को स्पष्ट करता है, जबकि ‘भूमि की ओर’ दिशासूचक ה को व्यक्त करता है।
- source_word: וְנֶאֱלָמְתִּי
  choice: और बोल न सका
  rationale: אלם का निफ़अल यहाँ वाणीहीन हो जाने को दर्शाता है। ‘बोल न सका’ प्रसंगगत असमर्थता को सहज हिन्दी में व्यक्त करता है और स्थायी गूंगेपन अथवा बाहरी बल से चुप कराए जाने का अनावश्यक अर्थ नहीं जोड़ता।
