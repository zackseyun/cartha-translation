review_pass:
  verdict: revise
  source_fidelity: The temporal construction is represented well by “जब ... कह रहा था,” and “बोल न सका” accurately conveys the contextual sense of the Niphal, namely becoming unable to speak rather than permanent muteness. “भूमि की ओर” suitably preserves the earthward direction. However, “मुँह ... झुका लिया” is less precise for the Hebrew idiom ‘set/turn my face earthward’; it can sound as though only the mouth is being lowered.
  naturalness: The sentence is generally fluent modern Hindi. Replacing “मुँह” with “चेहरा” makes the posture both more idiomatic and clearer in contemporary Hindi.
  terminology: No theological terminology occurs. “भूमि” is appropriately dignified and readily understood. No footnote is required, since the Hindi wording does not make a disputed lexical alternative necessary.
  issues:
  - severity: low
    issue: ‘मुँह’ is used for ‘face’ in the posture idiom.
    rationale: The Hebrew פָּנַי refers to the speaker’s face. In modern Hindi, “अपना चेहरा भूमि की ओर झुका लिया” more naturally conveys the intended bodily posture than “अपना मुँह ... झुका लिया.”
