  text: וַ/יֹּ֜אמֶר אַל תִּירָ֧א אִישׁ חֲמֻד֛וֹת שָׁל֥וֹם לָ֖/ךְ חֲזַ֣ק וַ/חֲזָ֑ק וּֽ/בְ/דַבְּר֤/וֹ עִמִּ/י֙ הִתְחַזַּ֔קְתִּי וָ/אֹֽמְרָ֛/ה יְדַבֵּ֥ר אֲדֹנִ֖/י כִּ֥י חִזַּקְתָּֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/019.yaml
  text: And he said[a], “Do not fear, man greatly beloved; peace be to you. Be strong, yes, be strong.” And when he spoke with me, I was strengthened and said, “Let my lord speak, for you have strengthened me.”
translation:
  language: hi
  text: तब उसने कहा, “हे अत्यन्त प्रिय पुरुष,[a] मत डर। तुझे शान्ति मिले। दृढ़ हो—हाँ, दृढ़ हो।” जब वह मुझसे बात कर रहा था, तब मुझे बल मिला और मैंने कहा, “मेरे स्वामी बोलें, क्योंकि आपने मुझे बल दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे अत्यन्त सम्मानित पुरुष” अथवा “हे अति वांछित पुरुष।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “अभिलाषाओं/बहुमूल्य वस्तुओं का पुरुष” है; यह विशेष प्रियता या अनुग्रह का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ חֲמֻדוֹת
  choice: हे अत्यन्त प्रिय पुरुष
  rationale: यह इब्रानी पद शाब्दिक रूप से ‘अभिलाषाओं/बहुमूल्य वस्तुओं का पुरुष’ जैसा है, पर मुहावरे के रूप में विशेष प्रियता, अनुग्रह या आदर व्यक्त करता है। ‘अत्यन्त प्रिय पुरुष’ स्वाभाविक हिन्दी में इसका व्यक्तिगत और स्नेहपूर्ण बल बनाए रखता है।
- source_word: שָׁלוֹם לָךְ
  choice: तुझे शान्ति मिले
  rationale: यह केवल अवस्था का कथन नहीं, बल्कि आशीर्वाद या मंगलकामना का सूत्र है; इसलिए ‘शान्ति मिले’ उसका इच्छासूचक भाव स्पष्ट करता है।
- source_word: חֲזַק וַחֲזָק
  choice: दृढ़ हो—हाँ, दृढ़ हो
  rationale: दोहराई गई आज्ञा प्रोत्साहन को तीव्र करती है। ‘हाँ’ और पुनरावृत्ति उस बल को स्वाभाविक हिन्दी में बनाए रखते हैं, जबकि ‘दृढ़’ आगे आने वाले बल मिलने के भाव से भी जुड़ा रहता है।
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: जब वह मुझसे बात कर रहा था
  rationale: पूर्वसर्ग सहित infinitive construct यहाँ समकालिक कालगत अर्थ देता है। यह अनुवाद बोलने के दौरान दानिय्येल के बल पाने को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: הִתְחַזַּקְתִּי
  choice: मुझे बल मिला
  rationale: Hitpael रूप यहाँ बलवान अवस्था में आने का भाव देता है। ‘मुझे बल मिला’ हिन्दी में स्वाभाविक है और अगले कथन ‘आपने मुझे बल दिया है’ से शब्दार्थगत संबंध बनाए रखता है।
- source_word: יְדַבֵּר אֲדֹנִי
  choice: मेरे स्वामी बोलें
  rationale: अपूर्ण क्रिया यहाँ विनम्र अनुरोध का भाव रखती है। ‘मेरे स्वामी बोलें’ सम्मानसूचक संबोधन है और वक्ता को परमेश्वर मान लेने जैसी अतिरिक्त पहचान आरोपित नहीं करता।
- source_word: כִּי חִזַּקְתָּנִי
  choice: क्योंकि आपने मुझे बल दिया है
  rationale: כִּי कारण बताता है कि दानिय्येल अब सुनने को तैयार क्यों है। ‘बल दिया’ पूरे पद में חזק धातु की पुनरावृत्ति को यथासंभव बनाए रखता है।
theological_decisions:
- issue: वक्ता के लिए אֲדֹנִי का अनुवाद
  choice: मेरे स्वामी
  alternative: मेरे प्रभु
  rationale: यह रूप किसी सम्मानित वरिष्ठ के लिए एकवचन आदरसूचक संबोधन हो सकता है। प्रसंग में यह दानिय्येल से बोलने वाली स्वर्गीय हस्ती के लिए है, न कि परमेश्वर के विशिष्ट नाम के लिए; इसलिए ‘स्वामी’ अनावश्यक धर्मवैज्ञानिक पहचान आरोपित किए बिना सम्मान बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। दानिय्येल के लिए एकवचन ‘तू’ रूप मूल इब्रानी के निकट और आत्मीय संबोधन के अनुकूल है; दानिय्येल की ओर से ‘आप’ तथा ‘मेरे स्वामी’ सम्मान व्यक्त करते हैं।
