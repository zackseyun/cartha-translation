  text: וּ/גְוִיָּת֣/וֹ כְ/תַרְשִׁ֗ישׁ וּ/פָנָ֞י/ו כְּ/מַרְאֵ֤ה בָרָק֙ וְ/עֵינָי/ו֙ כְּ/לַפִּ֣ידֵי אֵ֔שׁ וּ/זְרֹֽעֹתָי/ו֙ וּ/מַרְגְּלֹתָ֔י/ו כְּ/עֵ֖ין נְחֹ֣שֶׁת קָלָ֑ל וְ/ק֥וֹל דְּבָרָ֖י/ו כְּ/ק֥וֹל הָמֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/006.yaml
  text: His body was like beryl[a], his face like the appearance of lightning, his eyes like torches of fire, his arms and his feet like the gleam of polished bronze[c][b], and the sound of his words like the sound of a multitude.
translation:
  language: hi
  text: उसका शरीर तरशीश रत्न जैसा था[a], उसका चेहरा बिजली की चमक जैसा था, उसकी आँखें आग की मशालों जैसी थीं, उसकी बाँहें और उसके पाँव माँजे हुए काँसे की चमक जैसे थे[b], और उसकी वाणी का स्वर जनसमूह की आवाज़ जैसा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुखराज,” “बेरिल,” “क्राइसोलाइट,” अथवा कोई अन्य बहुमूल्य रत्न; इब्रानी शब्द ‘तरशीश’ से अभिप्रेत रत्न की ठीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “दमकते काँसे के रूप जैसे थे।”
    reason: lexical_alternative
  - marker: c
    text: या “भीड़ की आवाज़ जैसी” अथवा “जनसमूह की गर्जना जैसी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְוִיָּתוֹ
  choice: उसका शरीर
  rationale: גְוִיָּה यहाँ दृश्य आकृति के शरीर या देह को बताता है; आधुनिक हिन्दी में ‘शरीर’ स्वाभाविक और पर्याप्त रूप से ठोस है।
- source_word: כְתַרְשִׁישׁ
  choice: तरशीश रत्न जैसा
  rationale: תַּרְשִׁישׁ किसी बहुमूल्य रत्न का नाम है, पर उसकी ठीक खनिज-पहचान अनिश्चित है। नाम का लिप्यंतरण उस अनिश्चितता को मुख्य पाठ में सुरक्षित रखता है।
- source_word: כְמַרְאֵה בָרָק
  choice: बिजली की चमक जैसा
  rationale: מַרְאֶה दृश्य रूप या दिखाई देने वाली छटा को व्यक्त करता है। ‘बिजली की चमक’ हिन्दी में स्वाभाविक रहते हुए उस दीप्त दृश्य प्रभाव को संप्रेषित करती है।
- source_word: כְלַפִּידֵי אֵשׁ
  choice: आग की मशालों जैसी
  rationale: לַפִּיד जलती मशाल या अग्निशिखा वाला पलीता है; यह चयन मूल का सजीव बहुवचन बिंब बनाए रखता है।
- source_word: זְרֹעֹתָיו וּמַרְגְּלֹתָיו
  choice: उसकी बाँहें और उसके पाँव
  rationale: दोनों शारीरिक अंगों को सीधे और सामान्य आधुनिक हिन्दी में व्यक्त किया गया है; מַרְגְּלוֹתָיו यहाँ पाँव अथवा निचले अंगों का बोध करा सकता है।
- source_word: כְעֵין נְחֹשֶׁת קָלָל
  choice: माँजे हुए काँसे की चमक जैसे
  rationale: עֵין इस प्रयोग में रूप या चमक है, נְחֹשֶׁת काँसा/ताँबा और קָלָל संभवतः चमकाया या दमकता हुआ धातु बताता है। ‘माँजा हुआ काँसा’ दृश्य बिंब को सहज हिन्दी में रखता है।
- source_word: קוֹל דְּבָרָיו
  choice: उसके शब्दों की आवाज़
  rationale: यह चयन ‘उसके शब्दों की ध्वनि/आवाज़’ की इब्रानी संरचना और वाणी के श्रव्य प्रभाव दोनों को सुरक्षित रखता है।
- source_word: כְקוֹל הָמוֹן
  choice: जनसमूह की आवाज़ जैसी
  rationale: הָמוֹן जनसमूह और उससे उठने वाली भारी, कोलाहलपूर्ण ध्वनि—दोनों का संकेत दे सकता है। मुख्य पाठ अपेक्षाकृत तटस्थ है और विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: वर्णित पुरुष की पहचान
  choice: पद में उसे केवल दर्शन में दिखाई देने वाली मानव-सदृश आकृति के रूप में वर्णित किया गया है; उसकी पहचान नहीं जोड़ी गई।
  alternative: उसे स्वर्गदूत, ईश्वरीय प्रकट रूप, या मसीह के देहधारण-पूर्व दर्शन के रूप में स्पष्ट रूप से पहचानना।
  rationale: इस पद में आकृति का वर्णन है, पर उसकी पहचान स्पष्ट नहीं की गई। अनुवाद व्याख्यात्मक या सम्प्रदायगत निष्कर्ष जोड़े बिना इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—दृश्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। समानांतर उपमाओं की काव्यात्मक शृंखला बनाए रखी गई है। ‘तरशीश रत्न’ मूल की वास्तविक शाब्दिक अनिश्चितता को छिपाने के बजाय सुरक्षित रखता है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में सही स्थान पर दिए गए हैं।
