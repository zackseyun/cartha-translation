language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲבָל֙ אַגִּ֣יד לְ/ךָ֔ אֶת הָ/רָשׁ֥וּם בִּ/כְתָ֖ב אֱמֶ֑ת וְ/אֵ֨ין אֶחָ֜ד מִתְחַזֵּ֤ק עִמִּ/י֙ עַל אֵ֔לֶּה כִּ֥י אִם מִיכָאֵ֖ל שַׂרְ/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/021.yaml
  text: But I will tell you what is recorded in the writing of truth[a]. And there is no one who stands firmly with me against these except Michael[b], your prince.
translation:
  language: hi
  text: परन्तु मैं तुम्हें बताऊँगा कि सत्य के लेख में क्या अंकित है[a]। इनका सामना करने में मेरे साथ दृढ़ता से खड़ा होने वाला[b] तुम्हारा प्रधान मीकाएल ही है; उसके सिवा कोई नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो कुछ सत्य के लेख में लिखा है।’
    reason: रָשׁוּם के लिए ‘अंकित’ और ‘लिखा’ दोनों सम्भव हैं।
  - marker: b
    text: या, ‘इन बातों में मेरा समर्थन करने वाला।’ इब्रानी अभिव्यक्ति का अर्थ किसी के साथ दृढ़ता से खड़ा होना हो सकता है, और ‘इन’ का संकेत विरोधी शक्तियों या विचाराधीन बातों की ओर हो सकता है।
    reason: מִתְחַזֵּק עִמִּי עַל אֵלֶּה की अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: אֲבָל
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध अथवा मोड़ दर्शाने वाला अव्यय है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक है।
- source_word: אַגִּיד לְךָ
  choice: मैं तुम्हें बताऊँगा
  rationale: हिफ़ील रूप यहाँ बताने या प्रकट करने का अर्थ देता है और भविष्यकाल तथा सीधे संबोधन को बनाए रखता है।
- source_word: הָרָשׁוּם
  choice: जो कुछ ... अंकित है
  rationale: רשם का कर्मवाच्य कृदन्त लिखकर दर्ज या अंकित की गई बात को सूचित करता है; ‘अंकित’ आधिकारिक लिखित अभिलेख की छाया बनाए रखता है।
- source_word: בִּכְתָב אֱמֶת
  choice: सत्य के लेख में
  rationale: כְּתָב किसी लेख, लिखित दस्तावेज़ या अभिलेख को दर्शाता है। ‘लेख’ मूल के ‘पुस्तक’ से अधिक व्यापक अर्थ को सुरक्षित रखता है, जबकि संबंधवाचक रचना אֱמֶת को ‘सत्य के’ के रूप में बनाए रखती है।
- source_word: וְאֵין אֶחָד
  choice: और कोई नहीं है
  rationale: निषेधात्मक अस्तित्ववाचक रचना का यह स्वाभाविक हिन्दी रूप है।
- source_word: מִתְחַזֵּק עִמִּי
  choice: मेरा दृढ़ता से साथ देने वाला
  rationale: हित्पएल रूप किसी के साथ बलपूर्वक खड़े होने या दृढ़ सहयोग देने का भाव रखता है; यह हिन्दी मूल की सामर्थ्य और सहकारिता दोनों को व्यक्त करती है।
- source_word: עַל אֵלֶּה
  choice: इनका सामना करने में
  rationale: संघर्ष के प्रसंग में עַל को विरोधात्मक रूप से समझा गया है। यह ‘इनके विरुद्ध’ का भाव देता है, पर ‘इन’ के संभावित संकेत को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כִּי אִם
  choice: को छोड़
  rationale: नकारात्मक वाक्य के बाद यह अपवादसूचक रचना है; हिन्दी में ‘को छोड़’ स्वाभाविक है।
- source_word: מִיכָאֵל
  choice: मीकाएल
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: שַׂרְכֶם
  choice: तुम्हारे प्रधान
  rationale: שַׂר शासक, राजकुमार या उच्चाधिकारी का पद है। दानिय्येल के स्वर्गीय प्रसंग में ‘प्रधान’ स्वाभाविक है और पद को ‘महादूत’ जैसी बाद की विशिष्ट संज्ञा में नहीं बदलता।
theological_decisions:
- issue: मीकाएल की पहचान और भूमिका
  choice: ‘तुम्हारे प्रधान’
  alternative: ‘तुम्हारा राजकुमार’ अथवा ‘तुम्हारा महादूत’
  rationale: पद में केवल שַׂרְכֶם है। ‘तुम्हारे प्रधान’ मीकाएल का दानिय्येल के लोगों से संबंध बनाए रखता है, पर इस पद में स्पष्ट न कही गई बाद की धर्मवैज्ञानिक पहचान नहीं जोड़ता।
- issue: ‘इन’ का संकेत और עַל का संबंध
  choice: ‘इनका सामना करने में’
  alternative: ‘इन बातों में’ अथवा ‘इनके विरुद्ध’
  rationale: आसपास का प्रसंग विरोधी स्वर्गीय शक्तियों से संघर्ष का है, इसलिए विरोधात्मक भाव उपयुक्त है; फिर भी सर्वनाम किसकी ओर संकेत करता है, इसे मुख्य पाठ में नाम देकर निश्चित नहीं किया गया।
- issue: ‘सत्य का लेख’ का स्वरूप
  choice: ‘सत्य के लेख’
  alternative: ‘सत्य की पुस्तक’ अथवा ‘सच्चे लेख’
  rationale: मूल शब्द लिखित दस्तावेज़ या अभिलेख को सूचित करता है, लेकिन उसका ठीक स्वरूप नहीं बताता। इसलिए ‘लेख’ उस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘सत्य के लेख’ स्रोत के כְּתָב को ‘पुस्तक’ बनाकर अधिक निश्चित करने से बचता है। ‘इनका सामना करने में’ संघर्ष-प्रसंग को व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक अर्थ को सुरक्षित रखती है।
