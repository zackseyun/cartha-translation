  text: וָ/אֶשְׁמַ֖ע אֶת ק֣וֹל דְּבָרָ֑י/ו וּ/כְ/שָׁמְעִ/י֙ אֶת ק֣וֹל דְּבָרָ֔י/ו וַ/אֲנִ֗י הָיִ֛יתִי נִרְדָּ֥ם עַל פָּנַ֖/י וּ/פָנַ֥/י אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/009.yaml
  text: Then I heard the sound of his words[a], and when I heard the sound of his words, I fell into a deep sleep on my face[b], with my face to the ground.
translation:
  language: hi
  text: तब मैंने उसके वचनों की ध्वनि[a] सुनी; और उसके वचनों की ध्वनि सुनते समय मैं मुँह के बल पड़ा हुआ गहरी नींद में था[b], और मेरा चेहरा भूमि की ओर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके वचनों का स्वर।”
    reason: lexical_alternative
  - marker: b
    text: या “मैं सो गया” अथवा “मैं स्तब्ध होकर सो गया”; इब्रानी शब्द गहरी, भारी नींद का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: तब मैंने सुनी
  rationale: שׁמע के क़ाल वय्यिक्तोल रूप से कथा का अगला क्रम व्यक्त होता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से प्रकट करता है।
- source_word: קוֹל דְּבָרָיו
  choice: उसके वचनों की आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़/ध्वनि’ और דְּבָרָיו का अर्थ ‘उसके वचन’ है। यह चयन इब्रानी की पुनरुक्त अभिव्यक्ति को बनाए रखते हुए हिन्दी में बोधगम्य रहता है।
- source_word: וּכְשָׁמְעִי
  choice: सुनते ही
  rationale: כְּ के साथ यह रूप समय-संबंधी अर्थ देता है। प्रसंग में ‘सुनते ही’ तत्काल अनुक्रम को सहज हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: נִרְדָּם
  choice: गहरी नींद में पड़ गया
  rationale: רדם का निफ़ाल रूप भारी या गहरी नींद की दशा बताता है। ‘गहरी नींद में पड़ गया’ तीव्रता और अवस्था में प्रवेश—दोनों को व्यक्त करता है; ‘समाधि’ या ‘भावावस्था’ जैसा व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: עַל פָּנַי
  choice: मुँह के बल
  rationale: यह स्थान-सूचक वाक्यांश हिन्दी में स्वाभाविक रूप से ‘मुँह के बल’ कहा जाता है और दानिय्येल की शारीरिक मुद्रा स्पष्ट करता है।
- source_word: וּפָנַי אָרְצָה
  choice: और मेरा मुँह भूमि की ओर था
  rationale: אָרְצָה दिशासूचक है—‘भूमि की ओर’। अलग उपवाक्य मूल की बलाघातपूर्ण पुनरुक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन के प्रभाव में दानिय्येल की दशा
  choice: गहरी नींद में शारीरिक रूप से मुँह के बल पड़ जाना
  alternative: उन्मादपूर्ण या समाधि-जैसी भावावस्था
  rationale: נִרְדָּם का सामान्य अर्थ गहरी या भारी नींद है। पाठ दानिय्येल की अभिभूत शारीरिक दशा बताता है, पर किसी तकनीकी आध्यात्मिक भावावस्था को अनिवार्य नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘वचन’ बाइबलीय प्रसंग के अनुकूल होते हुए भी सामान्य पाठक के लिए परिचित है। मूल इब्रानी में ‘उसके वचनों की आवाज़’ की पुनरावृत्ति तथा ‘मुँह’ का दोहरा उल्लेख अर्थपूर्ण बलाघात देते हैं, इसलिए दोनों को बनाए रखा गया है।
