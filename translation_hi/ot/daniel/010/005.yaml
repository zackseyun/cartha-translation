source:
  edition: WLC
  text: וָ/אֶשָּׂ֤א אֶת עֵינַ/י֙ וָ/אֵ֔רֶא וְ/הִנֵּ֥ה אִישׁ אֶחָ֖ד לָב֣וּשׁ בַּדִּ֑ים וּ/מָתְנָ֥י/ו חֲגֻרִ֖ים בְּ/כֶ֥תֶם אוּפָֽז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/005.yaml
  text: I lifted up my eyes and looked[a], and behold, a man clothed in linen, with his waist girded with the gold of Uphaz.
translation:
  language: hi
  text: मैंने अपनी आँखें उठाकर देखा, और देखो, सन के वस्त्र पहने हुए एक पुरुष था। उसकी कमर ऊफाज के सोने के कमरबंद से बँधी हुई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी कमर ऊफाज के उत्तम सोने से बँधी हुई थी।” इब्रानी पदबंध सोने के स्रोत के साथ-साथ उसकी उत्तम गुणवत्ता पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא אֶת עֵינַי
  choice: मैंने अपनी आँखें उठाकर
  rationale: ‘आँखें उठाना’ इब्रानी मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है और अगले क्रियापद ‘देखा’ को अनावश्यक रूप से समाहित नहीं करता।
- source_word: וָאֵרֶא
  choice: देखा
  rationale: यह ראה का सीधा और स्वाभाविक अर्थ है; पिछले वाक्यांश के साथ मिलकर दृष्टि उठाने और फिर देखने की क्रमिक क्रिया व्यक्त होती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दर्शनात्मक वर्णन में हִנֵּה की ध्यान आकर्षित करने वाली और आकस्मिक उपस्थिति सूचित करने वाली शक्ति को सुरक्षित रखता है।
- source_word: אִישׁ אֶחָד
  choice: एक पुरुष
  rationale: אִישׁ के पुरुषवाचक अर्थ और אֶחָד द्वारा सूचित एकल आकृति को स्पष्ट रखता है, पर उसकी पहचान के विषय में कुछ नहीं जोड़ता।
- source_word: לָבוּשׁ בַּדִּים
  choice: सन के वस्त्र पहने हुए
  rationale: בַּדִּים यहाँ सन के कपड़े अथवा वस्त्र को सूचित करता है; हिन्दी में बहुवचन ‘वस्त्र’ स्वाभाविक है और किसी विशेष परिधान का अनुमान नहीं लगाता।
- source_word: מָתְנָיו חֲגֻרִים
  choice: उसकी कमर ... पेटी से कसी हुई थी
  rationale: מָתְנָיו शरीर के कमर-प्रदेश को और חֲגֻרִים बाँधे अथवा कमरबंद लगाए होने को दर्शाता है। ‘पेटी से कसी’ आधुनिक हिन्दी में दृश्य को स्पष्ट करती है।
- source_word: בְּכֶתֶם אוּפָז
  choice: ऊफाज के सोने की
  rationale: כֶּתֶם मूल्यवान या उत्तम सोने को सूचित कर सकता है, जबकि אוּפָז को स्थान-नाम मानकर लिप्यंतरित किया गया है। मुख्य पाठ स्रोत-संबंध को रखता है; गुणवत्ता का संभावित संकेत पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दर्शन में दिखाई देने वाली आकृति की पहचान
  choice: केवल ‘एक पुरुष’ के रूप में तटस्थ वर्णन
  alternative: स्वर्गदूत, मसीह, या परमेश्वर का दृश्य प्रकटन
  rationale: इस पद में आकृति के रूप और वस्त्रों का वर्णन है, पर उसकी पहचान स्पष्ट नहीं की गई। इसलिए अनुवाद किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और देखो’ दर्शन के ऊँचे कथात्मक स्वर को बनाए रखता है। ‘ऊफाज’ स्थान-नाम का हिन्दी लिप्यंतरण है।
