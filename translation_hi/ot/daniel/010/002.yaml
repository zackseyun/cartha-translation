    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी के मानक कालवाचक बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और कथा की समय-पृष्ठभूमि बनाए रखता है।
- source_word: אֲנִי דָנִיֵּאל
  choice: मैं, दानिय्येल,
  rationale: स्वतंत्र सर्वनाम और नाम के आत्मपरिचयात्मक बल को हिन्दी में अल्पविरामयुक्त समानाधिकरण द्वारा सुरक्षित रखा गया है।
- source_word: הָיִיתִי מִתְאַבֵּל
  choice: शोक मनाता रहा
  rationale: היה और हित्पएल कृदन्त का मेल अतीत में जारी अवस्था या क्रिया बताता है; ‘मनाता रहा’ उस कालगत निरंतरता को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: שְׁלֹשָׁה שָׁבֻעִים יָמִים
  choice: पूरे तीन सप्ताह तक
  rationale: शाब्दिक रूप ‘तीन सप्ताह, दिन’ है। यहाँ יָמִים साधारण दिनों से बने वास्तविक सप्ताहों पर बल देता है; ‘पूरे तीन सप्ताह’ हिन्दी में इस भाव को स्वाभाविक ढंग से संप्रेषित करता है।
theological_decisions:
- issue: ‘सप्ताह’ को साधारण दिनों के सप्ताह या प्रतीकात्मक सप्तक समझना
  choice: मुख्य पाठ में ‘पूरे तीन सप्ताह’ और पादटिप्पणी में शाब्दिक रूप देना
  alternative: ‘तीन सप्ताह दिनों तक’
  rationale: इब्रानी יָמִים इस स्थान पर दिनों से बने सप्ताहों को स्पष्ट करता है, विशेषकर दानिय्येल में ‘सप्ताह’ के अन्य संभावित अर्थों की पृष्ठभूमि में। फिर भी शाब्दिक बनावट पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘शोक मनाता रहा’ निरंतर क्रिया को व्यक्त करता है और ‘पूरे तीन सप्ताह’ अस्वाभाविक शाब्दिक अनुवाद से बचते हुए इब्रानी पदबंध के बल को बनाए रखता है।
