  text: וְ/הִנֵּ֗ה כִּ/דְמוּת֙ בְּנֵ֣י אָדָ֔ם נֹגֵ֖עַ עַל שְׂפָתָ֑/י וָ/אֶפְתַּח פִּ֗/י וָ/אֲדַבְּרָ/ה֙ וָ/אֹֽמְרָ/ה֙ אֶל הָ/עֹמֵ֣ד לְ/נֶגְדִּ֔/י אֲדֹנִ֗/י בַּ/מַּרְאָה֙ נֶהֶפְכ֤וּ צִירַ/י֙ עָלַ֔/י וְ/לֹ֥א עָצַ֖רְתִּי כֹּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/016.yaml
  text: And behold[a], something like the likeness of a son of man touched my lips. Then I opened my mouth and spoke, and I said to the one standing before me, “My lord, because of the vision my pains have come upon me[c][b], and I have retained no strength.”
translation:
  language: hi
  text: और देखो, मनुष्य जैसी किसी आकृति ने[a] मेरे होंठों को छुआ। तब मैंने अपना मुँह खोला और बोलकर अपने सामने खड़े व्यक्ति से कहा, “मेरे स्वामी, इस दर्शन के कारण मेरी पीड़ाएँ मुझ पर आ पड़ी हैं[b], और मुझमें कोई बल नहीं रहा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अभिव्यक्ति असामान्य रूप से परतदार है: “मनुष्यों की समानता जैसी।” इसका अर्थ “मानवीय समानता वाला कोई” या “मनुष्य जैसी कोई आकृति” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: या “मेरी घोर व्यथा मुझ पर आ पड़ी है” अथवा “मेरी प्रसव-वेदना जैसी पीड़ाएँ मुझे आ घेरती हैं।” मूल शब्द तीव्र पीड़ा और व्याकुलता का बोध कराता है।
    reason: lexical_alternative
  - marker: c
    text: अधिक शाब्दिक रूप में, “और मैं कोई बल बनाए न रख सका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּדְמוּת בְּנֵי אָדָם
  choice: मनुष्य जैसी आकृति वाले किसी ने
  rationale: כְּ और דְּמוּת की तुलनात्मक, दृश्यात्मक अनिश्चितता को ‘जैसी आकृति’ से रखा गया है। בְּנֵי אָדָם यहाँ बहुवचन रूप में मानवजाति/मनुष्यों के लिए मुहावरा है, कोई मसीही पदवी नहीं। सहज हिन्दी के लिए इसका अर्थ ‘मनुष्य’ से व्यक्त किया गया, जबकि ‘किसी ने’ उस आकृति की पहचान को अनिश्चित रखता है।
- source_word: נֹגֵעַ עַל שְׂפָתָי
  choice: मेरे होंठों को छुआ
  rationale: נגע עם עַל स्पर्श को व्यक्त करता है। प्रसंग में कृदंत को कथा-क्रम की पूर्ण क्रिया के रूप में देना स्वाभाविक है।
- source_word: וָאֶפְתַּח פִּי
  choice: तब मैंने अपना मुँह खोला
  rationale: मूल का ‘मुँह खोलना’ मुहावरा बनाए रखते हुए ‘तब’ कथा के क्रम को स्पष्ट करता है।
- source_word: וָאֲדַבְּרָה וָאֹמְרָה
  choice: और बोलकर ... कहा
  rationale: दोनों इब्रानी क्रियाओं—बोलना और कहना—को हिन्दी में अनावश्यक बोझिलता के बिना सुरक्षित रखा गया है।
- source_word: הָעֹמֵד לְנֶגְדִּי
  choice: अपने सामने खड़े व्यक्ति
  rationale: לְנֶגְדִּי सामने अथवा सम्मुख होने को दर्शाता है; ‘अपने सामने खड़े व्यक्ति’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֲדֹנִי
  choice: हे मेरे स्वामी
  rationale: यह दर्शनीय आकृति के प्रति आदरपूर्ण संबोधन है, परमेश्वर का निज नाम नहीं। ‘स्वामी’ श्रद्धा रखता है, पर इसे यहोवा की पदवी नहीं बनाता।
- source_word: בַּמַּרְאָה
  choice: इस दर्शन के कारण
  rationale: 'בְּ को यहाँ प्रसंगानुसार कारणसूचक समझा गया है: दर्शन दानिय्येल की पीड़ा का कारण है।'
- source_word: נֶהֶפְכוּ צִירַי עָלַי
  choice: मेरी पीड़ाएँ मुझ पर टूट पड़ी हैं
  rationale: צִירַי तीव्र पीड़ा, वेदना या ऐंठन का बोध करा सकता है; נהפכו ... עלי के साथ यह पीड़ाओं के उसे आ घेरने का सजीव भाव देता है।
- source_word: וְלֹא עָצַרְתִּי כֹּחַ
  choice: और मुझमें कोई बल नहीं रहा
  rationale: शाब्दिक भाव ‘मैं बल सँभाल/बनाए न रख सका’ है। चुना हुआ वाक्यांश परिणाम को सहज हिन्दी में व्यक्त करता है और यह अस्पष्ट नहीं करता कि दानिय्येल का बल चुक गया था।
theological_decisions:
- issue: दर्शनीय वर्णन में בְּנֵי אָדָם का अर्थ
  choice: सामान्य मानवीय समानता—‘मनुष्य जैसी आकृति’
  alternative: ‘मनुष्य का पुत्र’ अथवा मसीही पदवी ‘मनुष्य का पुत्र’
  rationale: मूल में בְּנֵי אָדָם बहुवचन है और तुलना के सूत्र में आता है। इसलिए इसे मसीही उपाधि बनाना पाठ से परे अर्थ जोड़ना होगा।
- issue: אֲדֹנִי का संबोधन
  choice: हे मेरे स्वामी
  alternative: हे प्रभु / महोदय
  rationale: यह स्वर्गीय आकृति के लिए सम्मानसूचक संबोधन है, न कि यहोवा नाम। ‘मेरे स्वामी’ आदर बनाए रखता है और आकृति को अनावश्यक रूप से परमेश्वर के साथ अभिन्न नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘तभी देखो’ दर्शनीय आश्चर्य को बनाए रखता है; ‘हे मेरे स्वामी’ आदरपूर्ण है, पर दिव्य नाम या विशिष्ट धर्मसैद्धान्तिक पहचान नहीं जोड़ता। मुख्य पाठ सहज हिन्दी अपनाता है और मूल की असामान्य परतदार संरचना तथा वैकल्पिक अर्थों को पादटिप्पणियों में सुरक्षित रखता है।
