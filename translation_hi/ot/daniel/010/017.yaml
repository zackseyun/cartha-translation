id: DAN.10.17
reference: Daniel 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֣יךְ יוּכַ֗ל עֶ֤בֶד אֲדֹנִ/י֙ זֶ֔ה לְ/דַבֵּ֖ר עִם אֲדֹ֣נִ/י זֶ֑ה וַ/אֲנִ֤י מֵ/עַ֨תָּה֙ לֹֽא יַעֲמָד בִּ֣/י כֹ֔חַ וּ/נְשָׁמָ֖ה לֹ֥א נִשְׁאֲרָה בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/010/017.yaml
  text: So how can this servant of my lord speak with my lord like this? As for me[a], from now on no strength remains in me[c][b], and no breath is left in me.
translation:
  language: hi
  text: तो मेरे प्रभु का यह सेवक मेरे प्रभु से इस प्रकार कैसे बात कर सकता है? जहाँ तक मेरी बात है, अब मुझमें कोई शक्ति नहीं रही और मुझमें साँस भी बाकी नहीं रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵיךְ יוּכַל
  choice: तो ... कैसे ... सकता है
  rationale: संयोजक और सामर्थ्यसूचक क्रिया को प्रसंग से निकलने वाले स्वाभाविक आलंकारिक प्रश्न के रूप में व्यक्त करता है।
- source_word: עֶבֶד אֲדֹנִי זֶה
  choice: मेरे प्रभु का यह सेवक
  rationale: यह विनम्र दरबारी आत्म-संबोधन है; ‘सेवक’ दासत्व का अनावश्यक अर्थ लाए बिना भाव रखता है, और ‘यह’ संकेतवाचक बल को बनाए रखता है।
- source_word: לְדַבֵּר עִם אֲדֹנִי זֶה
  choice: मेरे प्रभु से ... बात कर सकता है
  rationale: עִם का ‘से’ स्वाभाविक हिन्दी है। दूसरे זֶה को अलग से दोहराना हिन्दी में असहज और अर्थ की दृष्टि से संदिग्ध होता; प्रत्यक्ष स्थिति प्रश्न की संरचना से स्पष्ट रहती है।
- source_word: וַאֲנִי
  choice: जहाँ तक मेरी बात है
  rationale: सर्वनाम के बल और वक्ता द्वारा अपनी दशा की ओर किए गए विषय-परिवर्तन को सहज हिन्दी में दिखाता है।
- source_word: מֵעַתָּה
  choice: अब
  rationale: प्रसंग में वर्तमान क्षण से उत्पन्न तत्काल दशा अभिप्रेत है; ‘अब से’ दीर्घकालिक अर्थ का अनावश्यक आभास दे सकता है।
- source_word: לֹא יַעֲמָד בִּי כֹחַ
  choice: मुझमें कोई शक्ति नहीं रही
  rationale: ‘शक्ति मुझमें खड़ी नहीं रहती’ वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और आंतरिक शारीरिक दुर्बलता व्यक्त करता है।
- source_word: וּנְשָׁמָה לֹא נִשְׁאֲרָה בִי
  choice: मुझमें साँस भी बाकी नहीं रही
  rationale: शक्ति-क्षय के समानांतर נְשָׁמָה यहाँ ‘साँस’ या जीवन-श्वास है; ‘आत्मा’ कहना संदर्भ में अनावश्यक धर्मवैज्ञानिक अर्थ जोड़ सकता है।
theological_decisions:
- issue: मानवीय या स्वर्गीय संबोधन में אֲדֹנִי का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: यह आदरपूर्ण उपाधि है, परमेश्वर का वाचा-नाम नहीं। ‘मेरे प्रभु’ ऊँचे संबोधन को बनाए रखता है, जबकि इसे यहोवा के रूप में नहीं पढ़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण और गरिमामय शैली रखी गई है। मूल के विनम्र आत्म-संबोधन को सुरक्षित रखा गया है; कृत्रिम शब्दशः पुनरावृत्ति से बचते हुए तत्कालता और शारीरिक निःशक्तता स्पष्ट की गई है।
