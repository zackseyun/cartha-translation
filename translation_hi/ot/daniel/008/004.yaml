  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। पशु-दर्शन के बिंब हेतु ‘सींग मारते हुए’ और प्रतिरोध की असमर्थता हेतु ‘टिक नहीं सकता था’ जैसे सामान्यतः बोधगम्य पद चुने गए हैं; ‘उसके हाथ से’ मूल इब्रानी मुहावरे को सुरक्षित रखता है।
