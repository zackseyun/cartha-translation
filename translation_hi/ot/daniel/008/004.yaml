base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/004.yaml
  text: I saw the ram charging westward and northward and southward[a], and no beasts could stand before him, and there was no one who could rescue from his hand. He did as he pleased and became great.
translation:
  language: hi
  text: मैंने उस मेढ़े को पश्चिम, उत्तर और दक्षिण की ओर सींग मारते हुए देखा। कोई भी पशु उसके सामने टिक नहीं सकता था, और उसके हाथ से छुड़ानेवाला कोई नहीं था। उसने अपनी इच्छा के अनुसार किया और महान हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपने को महान किया,” अथवा “वह बढ़कर महान हो गया।” इब्रानी अभिव्यक्ति महान होने या अपने को महान करने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: मैंने ... देखा
  rationale: ראה का क़ाल पूर्ण 1cs यहाँ दर्शन के भूतकालीन वर्णन में स्वाभाविक रूप से ‘मैंने देखा’ है।
- source_word: הָאַיִל
  choice: उस मेढ़े
  rationale: אַיִל का अर्थ ‘मेढ़ा’ है; निश्चित पद को हिन्दी में पूर्वोक्त/दृष्टिगत पात्र के लिए ‘उस’ से व्यक्त किया गया है।
- source_word: מְנַגֵּחַ
  choice: सींग मारते हुए
  rationale: נגח का कृदन्त सींगवाले पशु के बलपूर्वक प्रहार को बताता है। ‘सींग मारते हुए’ बिंब को स्पष्ट और स्वाभाविक रखता है।
- source_word: יָמָּה וְצָפוֹנָה וָנֶגְבָּה
  choice: पश्चिम, उत्तर और दक्षिण की ओर
  rationale: दिशासूचक ה गति की दिशा व्यक्त करता है; ‘की ओर’ उस भाव को सुरक्षित रखता है।
- source_word: וְכָל חַיּוֹת לֹא יַעַמְדוּ לְפָנָיו
  choice: कोई भी पशु उसके सामने टिक नहीं सकता था
  rationale: חַיּוֹת दर्शन के संदर्भ में पशुओं को सूचित करता है और नकारयुक्त अपूर्ण क्रिया प्रतिरोध की असमर्थता व्यक्त करती है। ‘टिक नहीं सकता था’ हिन्दी में मुहावरे का स्वाभाविक अर्थ देता है।
- source_word: וְאֵין מַצִּיל מִיָּדוֹ
  choice: उसके हाथ से छुड़ानेवाला कोई नहीं था
  rationale: हिफ़ील מַצִּיל का अर्थ छुड़ाने या बचानेवाला है। ‘हाथ से’ को सामर्थ्य/अधिकार के इब्रानी बिंब के रूप में बनाए रखा गया है।
- source_word: וְעָשָׂה כִרְצֹנוֹ
  choice: उसने अपनी इच्छा के अनुसार किया
  rationale: यह पद अपनी इच्छा के अनुसार काम करने को व्यक्त करता है। यह हिन्दी अनुवाद मूल संरचना और अर्थ दोनों को स्पष्ट रखता है।
- source_word: וְהִגְדִּיל
  choice: और महान हो गया
  rationale: גדל का हिफ़ील यहाँ महान बनने या अपने को महान करने—दोनों अर्थ दे सकता है। मुख्य पाठ में परिणामसूचक अर्थ चुना गया है और वैकल्पिक आत्मवाचक अर्थ टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या וְהִגְדִּיל का अर्थ आत्मवाचक ‘अपने को महान किया’ है या सामान्य परिणामसूचक ‘महान हो गया’
  choice: और महान हो गया
  alternative: और अपने को महान किया
  rationale: मूल में स्पष्ट आत्मवाचक सर्वनाम नहीं है और निकट संदर्भ मेढ़े की बढ़ती शक्ति व सफलता पर बल देता है। मुख्य पाठ अनावश्यक नैतिक मूल्यांकन जोड़े बिना परिणाम बताता है; टिप्पणी वास्तविक शाब्दिक अस्पष्टता को बनाए रखती है।
