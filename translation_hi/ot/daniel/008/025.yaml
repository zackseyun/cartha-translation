base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/025.yaml
  text: And through his shrewdness he will make deceit prosper in his hand; and in his heart he will magnify himself. In a time of security he will destroy many[a], and he will rise up against the Prince of princes; but he will be broken without hand.
translation:
  language: hi
  text: अपनी चतुराई से वह अपने हाथ में छल को सफल करेगा। वह अपने मन में अपने आपको बड़ा समझेगा। निश्चिंतता के समय वह बहुतों को नष्ट कर देगा। वह प्रधानों के प्रधान के विरुद्ध भी उठ खड़ा होगा; पर वह बिना हाथ के[a] टूट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मनुष्य के हाथ के बिना,’ अर्थात साधारण मानवीय शक्ति के द्वारा नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂכְלוֹ
  choice: अपनी चतुराई
  rationale: यह शब्द समझ-बूझ, सूझ या व्यावहारिक कुशलता को दर्शा सकता है। विरोधी और छलपूर्ण संदर्भ में ‘चतुराई’ उसकी बुद्धिमत्ता का नकारात्मक प्रयोग दिखाती है, पर ‘धूर्तता’ जितना अर्थ नहीं थोपती।
- source_word: וְהִצְלִיחַ מִרְמָה בְּיָדוֹ
  choice: वह छल को अपने हाथों सफल बनाएगा
  rationale: צלח का हिफ़ील रूप यहाँ कारक है और מִרְמָה उसका कर्म है; इसलिए आशय केवल उसका स्वयं सफल होना नहीं, बल्कि छल को सफल बनाना है। ‘अपने हाथों’ मूल बिंब और उसकी सक्रिय भूमिका दोनों बनाए रखता है।
- source_word: וּבִלְבָבוֹ יַגְדִּיל
  choice: वह अपने मन में अपने आपको बड़ा समझेगा
  rationale: मूल में आत्मवाचक कर्म निहित है। यह अनुवाद भीतर के घमंड को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּבְשַׁלְוָה
  choice: जब लोग निश्चिंत होंगे
  rationale: שַׁלְוָה शांति, निश्चिंतता या सुरक्षित होने की अवस्था बता सकता है। यहाँ विनाश का शिकार होने वाले लोगों की बेखबर और निश्चिंत दशा संदर्भ के अनुकूल है।
- source_word: יַשְׁחִית רַבִּים
  choice: बहुतों को नष्ट कर देगा
  rationale: इस संदर्भ में שׁחת का हिफ़ील रूप विनाश या बरबादी लाने का अर्थ देता है; ‘नष्ट कर देगा’ उसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: שַׂר שָׂרִים
  choice: प्रधानों के प्रधान
  rationale: यह रचना सर्वोच्च या सब प्रधानों से ऊपर प्रधान होने का भाव देती है। ‘प्रधानों के प्रधान’ पदवी की ऊंचाई को रखता है और उसके सटीक अभिप्रेत को इस पद से आगे निर्धारित नहीं करता।
- source_word: וְעַל ... יַעֲמֹד
  choice: के विरुद्ध भी उठ खड़ा होगा
  rationale: עַל के साथ עמד यहाँ शत्रुतापूर्ण विरोध दर्शाता है। ‘विरुद्ध उठ खड़ा होगा’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְאֶפֶס יָד
  choice: बिना किसी हाथ के
  rationale: मूल वाक्यांश संक्षिप्त और मुहावरेदार है। मुख्य पाठ में हाथ का बिंब रखा गया है, जबकि उसका संभावित अभिप्राय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יִשָּׁבֵר
  choice: तोड़ दिया जाएगा
  rationale: שׁבר का निफ़ाल रूप कर्मवाच्य है। यह अनुवाद टूटने के मूल रूपक और कर्ता की अनकही पहचान दोनों को बनाए रखता है।
theological_decisions:
- issue: שַׂר שָׂרִים का अभिप्रेत और पदवी-सूचक स्वरूप
  choice: प्रधानों के प्रधान
  alternative: सब प्रधानों का सर्वोच्च प्रधान
  rationale: यह पदवी सर्वोच्च शासक को दर्शाती है और दानिय्येल के संदर्भ में दिव्य या पारलौकिक अभिप्राय रख सकती है। चुना हुआ रूप उसकी ऊंची पदवी बनाए रखता है, पर इस पद में अभिप्रेत की पहचान जरूरत से अधिक निश्चित नहीं करता।
- issue: וּבְאֶפֶס יָד में विनाश का माध्यम
  choice: बिना किसी हाथ के
  alternative: बिना मनुष्य के हाथ के
  rationale: इब्रानी में ‘मनुष्य’ स्पष्ट रूप से नहीं है, यद्यपि मुहावरा साधारण मानवीय शक्ति से अलग किसी माध्यम की ओर संकेत करता है। मुख्य पाठ मूल की संक्षिप्तता और तनाव रखता है; पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘अपने हाथों,’ ‘प्रधानों के प्रधान’ और ‘बिना किसी हाथ के’ जैसे मूल बिंब सुरक्षित रखे गए हैं; जहाँ शाब्दिक रूप अकेला अस्पष्ट हो सकता था, वहाँ पादटिप्पणी दी गई है।
