  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הִנְ/נִ֣י מוֹדִֽיעֲ/ךָ֔ אֵ֥ת אֲשֶׁר יִהְיֶ֖ה בְּ/אַחֲרִ֣ית הַ/זָּ֑עַם כִּ֖י לְ/מוֹעֵ֥ד קֵֽץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/019.yaml
  text: Then he said, “Look, I am making known to you what will happen in the latter part of the indignation, for the end is for the appointed time.”
translation:
  language: hi
  text: तब उसने कहा, “देखो, मैं तुम्हें बताता हूँ कि क्रोध के अंतिम चरण में क्या होगा, क्योंकि अंत के लिए समय नियत है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेत को स्वाभाविक और स्पष्ट हिन्दी में रखा गया है।
- source_word: מוֹדִיעֲךָ
  choice: मैं तुम्हें बताता हूँ
  rationale: हिफ़ील कृदन्त का आशय ‘तुम्हें ज्ञात कराना’ है; सामान्य आधुनिक हिन्दी में ‘बताता हूँ’ अधिक सहज है।
- source_word: בְּאַחֲרִית הַזָּעַם
  choice: क्रोध के अंतिम समय में
  rationale: אַחֲרִית को केवल समाप्ति-बिंदु न बनाकर अंतिम चरण/समय के अर्थ में रखा गया है, और זַעַם के प्रबल दैवी रोष-संबंधी भाव के लिए ‘क्रोध’ चुना गया है।
- source_word: לְמוֹעֵד קֵץ
  choice: अंत नियत समय पर होगा
  rationale: संक्षिप्त और कुछ कठिन हिब्रू वाक्यांश में ‘अंत’ को कर्ता और מוֹעֵד को उसके निर्धारित समय के रूप में समझते हुए अंग्रेज़ी परामर्श-पाठ के अनुरूप स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: ‘क्रोध’ का कर्ता या धारक
  choice: क्रोध
  alternative: परमेश्वर का क्रोध
  rationale: मूल में परमेश्वर का नाम स्पष्ट रूप से नहीं है; उसे जोड़ने से सम्भावित धार्मिक आशय अनावश्यक रूप से निश्चित हो जाता।
- issue: अंत और नियत समय का संबंध
  choice: अंत नियत समय पर होगा
  alternative: यह अंत के नियत समय के लिए है
  rationale: हिब्रू का संक्षिप्त विधान व्याख्यात्मक तनाव रखता है। चुना हुआ रूप मुख्य अर्थ स्पष्ट करता है, पर किसी विस्तृत अंत-कालीन योजना को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ प्रत्यक्ष संबोधन और भविष्यसूचक घोषणा की गंभीरता बनाए रखता है।
