  yaml_path: translation/ot/daniel/008/002.yaml
  text: And I saw in the vision[a], and when I saw, I was in Susa the citadel, which is in the province of Elam; and I saw in the vision that I was beside the Ulai Canal.
translation:
  language: hi
  text: और मैंने उस दर्शन में देखा। जब मैंने देखा, तब मैं शूशन के दुर्ग में था, जो एलाम प्रान्त में है; और मैंने उस दर्शन में देखा कि मैं ऊलै नहर[a] के किनारे था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊलै नदी” अथवा “ऊलै जलधारा।” इब्रानी शब्द व्यापक अर्थ में किसी जलमार्ग के लिए प्रयुक्त हो सकता है, पर शूशन के सम्भावित परिवेश में “नहर” अधिक उपयुक्त है।
    reason: lexical_alternative
