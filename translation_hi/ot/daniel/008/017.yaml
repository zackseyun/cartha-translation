  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹא֙ אֵ֣צֶל עָמְדִ֔/י וּ/בְ/בֹא֣/וֹ נִבְעַ֔תִּי וָ/אֶפְּלָ֖/ה עַל פָּנָ֑/י וַ/יֹּ֤אמֶר אֵלַ/י֙ הָבֵ֣ן בֶּן אָדָ֔ם כִּ֖י לְ/עֶת קֵ֥ץ הֶ/חָזֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/017.yaml
  text: So he came near where I was standing[a], and when he came, I was terrified and fell on my face. Then he said to me, “Understand, son of man[b], that the vision is for the time of the end.”
translation:
  language: hi
  text: तब वह मेरे खड़े होने की जगह के पास आया। जब वह आया, तो मैं भयभीत हो गया और मुँह के बल गिर पड़ा। उसने मुझसे कहा, “हे मनुष्य के पुत्र[a], समझ कि यह दर्शन अंत के समय के लिए है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे मनुष्य” अथवा “हे नश्वर मनुष्य।” इब्रानी में शाब्दिक अर्थ “मनुष्य का पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “यह दर्शन अंत के समय से संबंध रखता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵצֶל עָמְדִי
  choice: मेरे खड़े होने की जगह के पास
  rationale: אֵצֶל निकटता व्यक्त करता है और עָמְדִי उस स्थान की ओर संकेत करता है जहाँ दानिय्येल खड़ा था। यह रूप स्थानिक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נִבְעַתִּי
  choice: मैं भय से काँप उठा
  rationale: בעת का निफ़अल रूप तीव्र भय से व्याकुल हो जाने का भाव देता है। यह अभिव्यक्ति साधारण ‘डर गया’ से अधिक तीव्रता दिखाती है, पर अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: וָאֶפְּלָה עַל־פָּנַי
  choice: मुँह के बल गिर पड़ा
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और भूमि पर औंधे गिरने की क्रिया स्पष्ट करता है।
- source_word: הָבֵן
  choice: समझ ले
  rationale: בין के हिफ़इल आज्ञार्थक रूप में समझने या बूझने का सीधा आदेश है। एक व्यक्ति को संबोधित करने के कारण ‘समझ ले’ स्वाभाविक है।
- source_word: בֶּן אָדָם
  choice: हे मनुष्य के पुत्र
  rationale: शाब्दिक संबोधन को बनाए रखने से दानिय्येल की मानवीय स्थिति और पुस्तक के भीतर इसकी साहित्यिक प्रतिध्वनि दोनों सुरक्षित रहती हैं।
- source_word: לְעֵת קֵץ
  choice: अन्त के समय के लिए
  rationale: यह अनुवाद अन्त अथवा परिणति से जुड़े समय का सीधा अर्थ देता है और किसी विशिष्ट अन्त-कालीन व्यवस्था को पाठ में नहीं जोड़ता।
- source_word: הֶחָזוֹן
  choice: यह दर्शन
  rationale: निश्चित संज्ञा पहले वर्णित दर्शन की ओर संकेत करती है; हिन्दी में ‘यह दर्शन’ उस संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: बֶּן אָדָם का सर्वनाश-दर्शी संदर्भ में अर्थ
  choice: हे मनुष्य के पुत्र
  alternative: हे मनुष्य; हे नश्वर मनुष्य
  rationale: शाब्दिक रूप दानिय्येल में मौजूद अन्तरपाठीय और साहित्यिक तनाव को सुरक्षित रखता है, जबकि पादटिप्पणी इसका सामान्य मानवीय अर्थ बताती है।
- issue: לְעֵת קֵץ का आशय
  choice: यह दर्शन अन्त के समय के लिए है
  alternative: यह दर्शन निर्धारित अन्त से सम्बन्ध रखता है
  rationale: मुख्य पाठ समय और अन्त के बीच मूल सम्बन्ध बनाए रखता है तथा किसी विशेष युगान्त-विषयक मत को आरोपित नहीं करता। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हे मनुष्य के पुत्र’ में मूल संबोधन सुरक्षित है; ‘अन्त के समय’ को किसी विशेष सम्प्रदायगत अन्त-काल सिद्धान्त से नहीं जोड़ा गया।
