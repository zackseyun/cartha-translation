  to: तब वह मेरे खड़े होने की जगह के पास आया। जब वह आया, तो मैं भयभीत हो गया और मुँह के बल गिर पड़ा। उसने मुझसे कहा, “हे मनुष्य के पुत्र[a], समझ कि यह दर्शन अंत के समय के लिए है[b]।”
