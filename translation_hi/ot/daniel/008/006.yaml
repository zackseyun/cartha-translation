id: DAN.8.6
reference: Daniel 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֗א עַד הָ/אַ֨יִל֙ בַּ֣עַל הַ/קְּרָנַ֔יִם אֲשֶׁ֣ר רָאִ֔יתִי עֹמֵ֖ד לִ/פְנֵ֣י הָ/אֻבָ֑ל וַ/יָּ֥רָץ אֵלָ֖י/ו בַּ/חֲמַ֥ת כֹּחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/006.yaml
  text: He came up to the ram with the two horns[a], which I had seen standing before the canal[b], and ran at him in the fury of his power.
translation:
  language: hi
  text: वह दो सींगों वाले उस मेढ़े के पास आया, जिसे मैंने नहर[a] के सामने खड़ा देखा था, और अपने बल के प्रचंड क्रोध में उस पर दौड़ा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘जलधारा’। हिब्रू אוּבָל किसी जलमार्ग को दर्शाता है; दानिय्येल 8 के परिवेश के कारण यहाँ ‘नहर’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘अपने सामर्थ्य के क्रोध में उसकी ओर दौड़ा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא עַד הָאַיִל
  choice: उस मेढ़े के पास आया
  rationale: בוא के साथ עַד मेढ़े तक पहुँचने की दिशा और निकटता व्यक्त करता है; ‘के पास आया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए यह भाव बनाए रखता है।
- source_word: בַּעַל הַקְּרָנַיִם
  choice: दो सींगों वाले
  rationale: בעל का शाब्दिक अर्थ ‘स्वामी/धारक’ है, पर पशु के वर्णन में हिन्दी का ‘दो सींगों वाला’ सहज है और קְּרָנַיִם के द्विवचन को स्पष्ट रखता है।
- source_word: אֲשֶׁר רָאִיתִי עֹמֵד
  choice: जिसे मैंने ... खड़ा देखा था
  rationale: यह सापेक्ष उपवाक्य पहले देखे गए मेढ़े की पहचान कराता है; ‘देखा था’ वर्तमान वर्णित घटना से पूर्व के दर्शन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי הָאֻבָל
  choice: नहर के सामने
  rationale: אוּבָל किसी जलमार्ग को सूचित करता है; दानिय्येल 8 के परिवेश में ‘नहर’ उपयुक्त है, जबकि ‘जलधारा’ को पाठ-टिप्पणी में वास्तविक विकल्प के रूप में रखा गया है।
- source_word: וַיָּרָץ אֵלָיו
  choice: उस पर दौड़ा
  rationale: רוץ का मूल अर्थ ‘दौड़ना’ है; शत्रुतापूर्ण प्रसंग में ‘उस पर दौड़ा’ आक्रमण की दिशा भी व्यक्त करता है।
- source_word: בַּחֲמַת כֹּחוֹ
  choice: अपने बल के प्रचंड क्रोध में
  rationale: यह अनुवाद חמה के क्रोध/प्रचंडता और כֹּחַ के बल—दोनों संज्ञात्मक तत्वों को बनाए रखता है तथा उनके बीच के सघन हिब्रू संबंध को अत्यधिक सरल नहीं करता।
