  text: וְ/הַ֨/נִּשְׁבֶּ֔רֶת וַ/תַּֽעֲמֹ֥דְנָה אַרְבַּ֖ע תַּחְתֶּ֑י/הָ אַרְבַּ֧ע מַלְכֻי֛וֹת מִ/גּ֥וֹי יַעֲמֹ֖דְנָה וְ/לֹ֥א בְ/כֹחֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/022.yaml
  text: 'And as for the broken horn[a], in whose place four arose: four kingdoms will arise from that nation, but not with its power.'
translation:
  language: hi
  text: और वह टूटा हुआ सींग, जिसके स्थान पर चार सींग उठ खड़े हुए—उस राष्ट्र से चार राज्य उठ खड़े होंगे, पर उसकी शक्ति के समान शक्तिशाली नहीं होंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर उस राजा की शक्ति के समान नहीं,” अर्थात टूटे हुए सींग द्वारा दर्शाए गए पहले राजा की शक्ति के समान नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַנִּשְׁבֶּרֶת
  choice: वह टूटा हुआ सींग
  rationale: स्त्रीलिंग एकवचन कृदंत का संकेत पिछले पद के ‘सींग’ की ओर है; हिन्दी में आशय स्पष्ट करने के लिए संज्ञा जोड़ी गई है।
- source_word: וַתַּעֲמֹדְנָה אַרְבַּע תַּחְתֶּיהָ
  choice: जिसके स्थान पर चार सींग उठ खड़े हुए
  rationale: עמד यहाँ सत्ता में उभरने का बोध देता है। मूल में ‘चार’ के साथ संज्ञा निहित है; पिछले संदर्भ के आधार पर ‘सींग’ स्पष्ट किया गया है।
- source_word: אַרְבַּע מַלְכֻיּוֹת
  choice: चार राज्य
  rationale: מַלְכוּת राजसत्ता या राज्य दोनों का अर्थ दे सकता है; यहाँ उत्तराधिकारी राजनीतिक सत्ताओं के लिए ‘राज्य’ स्वाभाविक है।
- source_word: מִגּוֹי
  choice: उस जाति से
  rationale: גּוֹי का अर्थ जाति या राष्ट्र है। ‘उस’ पिछले संदर्भ की ओर संकेत को स्पष्ट रखता है, बिना किसी ऐतिहासिक पहचान को पाठ में जोड़ने के।
- source_word: יַעֲמֹדְנָה
  choice: उठ खड़े होंगे
  rationale: भविष्यसूचक राजनीतिक संदर्भ में यह अभिव्यक्ति राज्यों के उभरने और स्थापित होने का भाव देती है।
- source_word: וְלֹא בְכֹחוֹ
  choice: पर उसकी शक्ति के समान शक्तिशाली नहीं होंगे
  rationale: शाब्दिक ‘पर उसकी शक्ति में नहीं’ हिन्दी में अस्पष्ट और अस्वाभाविक है। यह रूप उत्तराधिकारी राज्यों की शक्ति को पहले सींग की शक्ति से कम बताता है, जबकि पुल्लिंग प्रत्यय की संदर्भगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: וְלֹא בְכֹחוֹ में अंतिम पुल्लिंग सर्वनाम का संदर्भ
  choice: ‘उसकी शक्ति’ को टूटे हुए सींग द्वारा दर्शाई गई पहली सत्ता की शक्ति के संदर्भ में रखा गया है।
  alternative: ‘उस राजा की शक्ति’, अर्थात टूटे हुए सींग द्वारा दर्शाए गए पहले राजा की व्यक्तिगत शक्ति।
  rationale: सींग इस दर्शन में राजा और राज्य के निकट-संबद्ध प्रतीक हैं। मुख्य पाठ प्रतीकात्मक संदर्भ बनाए रखता है और किसी नामित ऐतिहासिक व्यक्ति को अनावश्यक रूप से नहीं जोड़ता; वैकल्पिक व्यक्तिगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज भविष्यसूचक गद्य। ‘उठ खड़े होना’ मूल के עמד को बनाए रखते हुए राजनीतिक सत्ता के उभार को व्यक्त करता है। मुख्य पाठ में [a] चिह्न संबंधित अस्पष्ट अंतिम खंड से अर्थगत रूप से जुड़ा है।
