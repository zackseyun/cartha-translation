base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/008.yaml
  text: And the male goat grew exceedingly great[a], but when he was strong, the great horn was broken[b], and in its place four conspicuous horns came up toward the four winds of heaven.
translation:
  language: hi
  text: और वह बकरा अत्यन्त महान हो गया; पर जब वह अपनी पूरी शक्ति में था, तब उसका बड़ा सींग टूट गया। उसके स्थान पर[b] चार प्रमुख सींग[a] आकाश की चारों हवाओं की ओर निकल आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चार साफ़ दिखाई देने वाले सींग’; इब्रानी शब्द किसी दिखाई देने वाली या प्रमुख वस्तु का वर्णन करता है, और ‘सींग’ शब्द संदर्भ से लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘उसके नीचे’; यहाँ भाव ‘उसके स्थान पर’ या ‘उसकी जगह’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְפִיר הָעִזִּים
  choice: बकरा
  rationale: यह इब्रानी पद विशेष रूप से नर बकरी को दर्शाता है। आधुनिक हिन्दी में ‘बकरा’ स्वाभाविक और स्पष्ट है।
- source_word: הִגְדִּיל עַד מְאֹד
  choice: अत्यन्त शक्तिशाली हो गया
  rationale: यह पद असाधारण रूप से महान, प्रभावशाली या सामर्थी होने का भाव व्यक्त करता है। दर्शन के राजनीतिक-सामरिक संदर्भ में ‘अत्यन्त शक्तिशाली’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּכְעָצְמוֹ
  choice: जब वह शक्तिशाली था
  rationale: वाक्यांश उसकी शक्ति की अवस्था का समयसूचक उल्लेख करता है। यह अनुवाद किसी अतिरिक्त ऐतिहासिक व्याख्या को जोड़े बिना उस भाव को बनाए रखता है।
- source_word: נִשְׁבְּרָה
  choice: टूट गया
  rationale: निफ़अल रूप यहाँ निष्क्रिय घटना व्यक्त करता है; हिन्दी में ‘टूट गया’ सहज है और तोड़ने वाले की पहचान नहीं जोड़ता।
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: उसका बड़ा सींग
  rationale: ‘सींग’ दर्शन की प्रतीकात्मक छवि को सुरक्षित रखता है, और ‘बड़ा’ आकार तथा महत्त्व दोनों का भाव दे सकता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘उसका’ जोड़ा गया है।
- source_word: וַתַּעֲלֶנָה
  choice: निकल आए
  rationale: यह क्रिया सींगों के उभरने या बढ़ निकलने की दृश्यात्मक क्रिया बताती है। ‘निकल आए’ आधुनिक हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: חָזוּת אַרְבַּע
  choice: चार प्रमुख सींग
  rationale: חָזוּת दृश्यता या प्रमुखता का भाव देता है। इब्रानी में संज्ञा संदर्भ से समझी जाती है; हिन्दी में स्पष्टता के लिए ‘सींग’ की पूर्ति की गई है।
- source_word: תַּחְתֶּיהָ
  choice: उसके स्थान पर
  rationale: शाब्दिक अर्थ ‘उसके नीचे’ हो सकता है, पर प्रतिस्थापन के इस संदर्भ में ‘उसके स्थान पर’ स्वाभाविक अर्थ है।
- source_word: לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: आकाश की चारों हवाओं की ओर
  rationale: यह अनुवाद चार दिशाओं का संकेत देने वाली मूल ‘हवाओं’ की प्रतीकात्मक छवि को समतल किए बिना बनाए रखता है।
theological_decisions:
- issue: दर्शन की प्रतीकात्मक भाषा का अनुवाद या उसकी ऐतिहासिक व्याख्या
  choice: मुख्य पाठ में ‘सींग’ और ‘आकाश की चारों हवाएँ’ बनाए रखना
  alternative: ‘सींग’ को सीधे राजा या राज्य और ‘हवाओं’ को केवल दिशाएँ कहना
  rationale: यह पद दर्शन की छवियाँ प्रस्तुत करता है। ऐतिहासिक पहचान को अनुवाद में जोड़ने के बजाय अध्याय की अपनी व्याख्या के लिए प्रतीकात्मक भाषा को सुरक्षित रखा गया है।
- issue: बड़े सींग के टूटने का कर्ता
  choice: ‘टूट गया’ द्वारा कर्ता को अनिर्दिष्ट रखना
  alternative: किसी व्यक्ति या परमेश्वर को सींग तोड़ने वाला स्पष्ट करना
  rationale: इब्रानी निष्क्रिय रूप घटना बताता है, पर यहाँ कर्ता का नाम नहीं देता। अनुवाद इस अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। अपोकैलिप्टिक प्रतीकों की व्याख्या मुख्य पाठ में आरोपित नहीं की गई। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं; अंग्रेज़ी परामर्श-पाठ में चिह्नों का स्थान उनकी पादटिप्पणी की सामग्री से मेल नहीं खाता था, इसलिए हिन्दी में उन्हें संबद्ध शब्दों के साथ रखा गया है।
