  text: וּ/בְ/דַבְּר֣/וֹ עִמִּ֔/י נִרְדַּ֥מְתִּי עַל פָּנַ֖/י אָ֑רְצָ/ה וַ/יִּ֨גַּע בִּ֔/י וַ/יַּֽעֲמִידֵ֖/נִי עַל עָמְדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/018.yaml
  text: And while he was speaking with me[a], I fell into a deep sleep with my face to the ground[b]; but he touched me and made me stand up where I had been standing.
translation:
  language: hi
  text: और जब वह मुझसे बात कर रहा था, तब मैं भूमि पर मुँह के बल गहरी नींद में पड़ गया[a]। फिर उसने मुझे छुआ और मुझे मेरे खड़े होने के स्थान पर खड़ा कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं गहरी नींद में था,” अथवा “मैं निद्रा-जैसी स्तब्धता में पड़ गया।” इब्रानी शब्द गहरी नींद या अचेत-सी अवस्था से अभिभूत होने का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मुझे मेरे खड़े होने पर खड़ा कर दिया।” इसका अर्थ संभवतः यह है कि उसने मुझे फिर से उसी स्थान पर सीधा खड़ा कर दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְדַבְּרוֹ עִמִּי
  choice: जब वह मुझसे बात कर रहा था
  rationale: ב के साथ infinitive construct चल रही समकालीन क्रिया व्यक्त करता है; עִם का सामान्य अर्थ ‘के साथ/से’ है। यह हिन्दी में स्वाभाविक है और इब्रानी की कालगत तथा संबंधगत बारीकी बनाए रखता है।
- source_word: נִרְדַּמְתִּי
  choice: मैं गहरी नींद में पड़ गया
  rationale: रदम के निफ़अल रूप में गहरी नींद या स्तब्धतापूर्ण निद्रा से अभिभूत हो जाने का भाव है; ‘पड़ गया’ उसके आरम्भिक पहलू को व्यक्त करता है।
- source_word: עַל־פָּנַי אָרְצָה
  choice: मेरा मुँह भूमि की ओर था
  rationale: शाब्दिक अर्थ ‘अपने मुँह के बल, धरती की ओर’ है। चुना हुआ रूप शरीर की भूमि की ओर झुकी या गिरी अवस्था को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַיִּגַּע בִּי
  choice: उसने मुझे छुआ
  rationale: נגע के साथ ב का यहाँ सामान्य अर्थ ‘छूना’ है; प्रसंग इससे अधिक प्रबल क्रिया की माँग नहीं करता।
- source_word: וַיַּעֲמִידֵנִי
  choice: मुझे ... खड़ा कर दिया
  rationale: עמד का हिफ़इल रूप कारणवाचक है—‘खड़ा करना’; यह अनुवाद उस कारणवाचक बल को बनाए रखता है।
- source_word: עַל־עָמְדִי
  choice: मेरे खड़े होने के स्थान पर
  rationale: इब्रानी का संक्षिप्त वाक्यांश शाब्दिक रूप से ‘मेरे खड़े होने पर/स्थान पर’ है। यह चयन अस्पष्ट स्थानगत संकेत को बचाता है और बिना आधार ‘पैरों पर’ नहीं जोड़ता।
theological_decisions:
- issue: दर्शन के दौरान दानिय्येल की अवस्था
  choice: गहरी नींद या निद्रा-सदृश स्तब्धता
  alternative: समाधि या तकनीकी अर्थ में भावावेश
  rationale: רדם गहरी नींद अथवा स्तब्धता का वर्णन करता है। पाठ किसी विशिष्ट धार्मिक या रहस्यवादी अवस्था के लिए तकनीकी शब्द अनिवार्य नहीं करता, इसलिए मुख्य पाठ में साधारण वर्णन रखा गया है और विकल्प पादटिप्पणी में बताया गया है।
- issue: עַל־עָמְדִי का अर्थ
  choice: मेरे खड़े होने के स्थान पर
  alternative: मुझे पैरों पर खड़ा कर दिया / मुझे सीधा खड़ा कर दिया
  rationale: मूल पद में ‘पैर’ नहीं है और अभिव्यक्ति स्थान अथवा खड़ी अवस्था दोनों का संकेत दे सकती है। अधिक औपचारिक रूप मूल की संक्षिप्तता और संभावित स्थानगत अर्थ को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भूमि’ और ‘खड़ा कर दिया’ सहज हैं, जबकि अंतिम पद में मूल इब्रानी की असामान्य और कुछ हद तक अस्पष्ट अभिव्यक्ति को जानबूझकर पूरी तरह समतल नहीं किया गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
