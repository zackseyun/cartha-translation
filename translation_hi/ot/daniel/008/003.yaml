reference: Daniel 8:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אֶשָּׂ֤א עֵינַ/י֙ וָ/אֶרְאֶ֔ה וְ/הִנֵּ֣ה אַ֣יִל אֶחָ֗ד עֹמֵ֛ד לִ/פְנֵ֥י הָ/אֻבָ֖ל וְ/ל֣/וֹ קְרָנָ֑יִם וְ/הַ/קְּרָנַ֣יִם גְּבֹה֗וֹת וְ/הָ/אַחַת֙ גְּבֹהָ֣ה מִן הַ/שֵּׁנִ֔ית וְ/הַ֨/גְּבֹהָ֔ה עֹלָ֖ה בָּ/אַחֲרֹנָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/003.yaml
  text: Then I lifted up my eyes and saw[a], and behold, one ram was standing before the canal, and it had two horns. The horns were high, but one was higher than the other[b], and the higher one came up last.
translation:
  language: hi
  text: तब मैंने आँखें उठाकर देखा, तो नहर[a] के सामने एक मेढ़ा खड़ा था, और उसके दो सींग थे। दोनों सींग ऊँचे थे, पर एक सींग दूसरे से ऊँचा था; और ऊँचा सींग बाद में उभरा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलधारा” या “नदी।” इब्रानी शब्द जलमार्ग को दर्शाता है और दानिय्येल में संभवतः नहर के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: या, “ऊँचा सींग बाद में उठा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: तब मैंने आँखें उठाकर
  rationale: यह दृष्टि को किसी ओर लगाने का इब्रानी मुहावरा है। अपेक्षाकृत शाब्दिक हिन्दी रूप दर्शन-वर्णन की शैली बनाए रखते हुए स्वाभाविक भी है।
- source_word: וָאֶרְאֶה וְהִנֵּה
  choice: 'देखा: वहाँ'
  rationale: וְהִנֵּה अचानक और सजीव रूप से दिखाई पड़ी वस्तु की ओर ध्यान खींचता है। हिन्दी में विराम-चिह्न और ‘वहाँ’ इस बल को स्वाभाविक ढंग से व्यक्त करते हैं; ‘देखो’ लगाने से दानिय्येल के प्रथम-पुरुष वर्णन में अनावश्यक प्रत्यक्ष संबोधन आता।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל विशेष रूप से नर भेड़ अर्थात मेढ़े को दर्शाता है, और אֶחָד को ‘एक’ से स्पष्ट रखा गया है।
- source_word: עֹמֵד לִפְנֵי הָאֻבָל
  choice: नहर के सामने ... खड़ा था
  rationale: עֹמֵד मेढ़े की स्थिति बताने वाला कृदन्त है। Daniel में אֻבָל संभवतः जल-नहर को दर्शाता है, इसलिए ‘नहर’ प्रसंगानुकूल है।
- source_word: וְלוֹ קְרָנָיִם
  choice: उसके दो सींग थे
  rationale: शाब्दिक अर्थ ‘उसके लिए/उसके पास दो सींग थे’ है; हिन्दी में स्वामित्व का यह रूप सहज और सटीक है।
- source_word: וְהַקְּרָנַיִם גְּבֹהוֹת
  choice: दोनों सींग ऊँचे थे
  rationale: גְּבֹהוֹת भौतिक ऊँचाई बताता है। ‘दोनों’ द्विवचन-संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהָאַחַת גְּבֹהָה מִן הַשֵּׁנִית
  choice: पर एक दूसरे से ऊँचा था
  rationale: ‘पर’ सींगों की समान ऊँचाई न होने का विरोध स्पष्ट करता है। ‘दूसरे से’ हिन्दी में शाब्दिक ‘दूसरे वाले से’ की अपेक्षा सहज है।
- source_word: וְהַגְּבֹהָה עֹלָה בָּאַחֲרֹנָה
  choice: और जो ऊँचा था, वह बाद में निकला
  rationale: עֹלָה यहाँ सींग के उभरने या बढ़ने को दर्शाता है, जबकि בָּאַחֲרֹנָה उसका बाद में प्रकट होना बताता है। ‘बाद में निकला’ दोनों भावों को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: दर्शन में प्रतीकात्मक पशु और सींगों का चित्रण
  choice: मुख्य पाठ में ‘मेढ़ा’ और ‘सींग’ का ठोस चित्रण बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: इसी पद में मेढ़े और सींगों की बाद में दी गई ऐतिहासिक पहचान जोड़ना।
  rationale: दर्शन के प्रतीकों की व्याख्या अध्याय में आगे दी जाती है। यहाँ उनका अर्थ पहले ही खोल देना पाठ की क्रमिकता और जानबूझकर बनी व्याख्यात्मक प्रतीक्षा को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण दर्शन-वर्णन। ‘मेढ़ा’, ‘नहर’ और ‘सींग’ सामान्य पाठक के लिए स्पष्ट हैं। स्रोत में वास्तविक पाठांतर या ऐसी अनिवार्य शब्दार्थ-अस्पष्टता नहीं मिली जिसके लिए इस पद में पादटिप्पणी आवश्यक हो; ‘बाद में निकला’ उभरने और कालक्रम दोनों को समेटता है।
