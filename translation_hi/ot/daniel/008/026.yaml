source:
  edition: WLC
  text: וּ/מַרְאֵ֨ה הָ/עֶ֧רֶב וְ/הַ/בֹּ֛קֶר אֲשֶׁ֥ר נֶאֱמַ֖ר אֱמֶ֣ת ה֑וּא וְ/אַתָּה֙ סְתֹ֣ם הֶֽ/חָז֔וֹן כִּ֖י לְ/יָמִ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/026.yaml
  text: And the vision of the evening and the morning that was spoken is true; but you, seal up the vision, for it concerns many days from now.
translation:
  language: hi
  text: और संध्या और भोर का वह दर्शन, जिसकी बात कही गई थी, सत्य है। परन्तु तुम उस दर्शन को मुहरबंद कर दो, क्योंकि यह बहुत दिनों बाद की बात है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַרְאֵה הָעֶרֶב וְהַבֹּקֶר
  choice: संध्या और भोर का वह दर्शन
  rationale: मूल पदबंध को निकटता से रखते हुए מַרְאֶה के लिए स्वाभाविक हिन्दी ‘दर्शन’ चुना गया; संध्या और भोर की युगल अभिव्यक्ति पूर्ववर्ती दर्शन से संबंध बनाए रखती है।
- source_word: סְתֹם
  choice: मुहर लगा दो
  rationale: क्रिया का अर्थ केवल छिपाना या बन्द करना नहीं, बल्कि किसी अभिलेख को मुहरबंद करके सुरक्षित रखना भी है; अतः ‘मुहर लगा दो’ मूल रूपक को बनाए रखता है।
- source_word: לְיָמִים רַבִּים
  choice: बहुत दिनों बाद के समय के विषय में
  rationale: शाब्दिक ‘बहुत दिनों के लिए’ लक्ष्य समय की दूरी को अस्पष्ट कर सकता है; प्रसंग में दर्शन के दूर भविष्य से संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि ‘दिनों’ की मूल छवि भी रखी गई है।
theological_decisions:
- issue: ‘संध्या और भोर’ का अर्थ
  choice: पदबंध को व्याख्यायित किए बिना ज्यों का त्यों रखा गया
  alternative: इसे सीधे ‘संध्याओं और भोरों की अवधि’ या किसी निश्चित कालगणना के रूप में स्पष्ट करना
  rationale: मूल पाठ यहाँ पहले बताए गए दर्शन की पुष्टि करता है, पर इस पद में उसकी गणना या प्रतीकात्मक व्याख्या नहीं खोलता; इसलिए धार्मिक-कालक्रम संबंधी निष्कर्ष अनुवाद में नहीं जोड़ा गया।
- issue: दर्शन पर मुहर लगाने का आशय
  choice: ‘मुहर लगा दो’
  alternative: ‘गुप्त रखो’ या ‘बन्द कर दो’
  rationale: मुहर लगाने में संरक्षण, प्रमाणीकरण और सीमित उपलब्धता की संभावनाएँ साथ रहती हैं; किसी एक आशय को निर्णायक बनाना मूल की संभावित व्यापकता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘परन्तु’ कथन के विरोधात्मक मोड़ को स्पष्ट करता है; किसी सांप्रदायिक अंत-समय व्याख्या को पाठ में नहीं जोड़ा गया।
