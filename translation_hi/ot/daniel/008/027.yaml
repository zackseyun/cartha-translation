source:
  edition: WLC
  text: וַ/אֲנִ֣י דָנִיֵּ֗אל נִהְיֵ֤יתִי וְ/נֶֽחֱלֵ֨יתִי֙ יָמִ֔ים וָ/אָק֕וּם וָ/אֶֽעֱשֶׂ֖ה אֶת מְלֶ֣אכֶת הַ/מֶּ֑לֶךְ וָ/אֶשְׁתּוֹמֵ֥ם עַל הַ/מַּרְאֶ֖ה וְ/אֵ֥ין מֵבִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/027.yaml
  text: And I[a], Daniel, was overcome and was sick for days. Then I rose and did the king’s work, but I was appalled by the vision, and there was no one who understood it.
translation:
  language: hi
  text: और मैं, दानिय्येल, निढाल हो गया और दिनों तक बीमार रहा। फिर मैं उठा और राजा का काम किया, पर मैं उस दर्शन से स्तब्ध था, और उसे समझने वाला कोई न था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर मैं उसे समझ न सका।” इब्रानी कथन संक्षिप्त है और इसका अर्थ निर्वैयक्तिक रूप से (“उसे समझने वाला कोई न था”) या स्वयं दानिय्येल के विषय में व्यक्तिगत रूप से लिया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נִהְיֵיתִי
  choice: निढाल हो गया
  rationale: यहाँ क्रिया दर्शन के बाद उत्पन्न हुई शारीरिक और मानसिक टूटन की अवस्था बताती है; ‘निढाल हो गया’ बिना मूर्छा को निश्चित किए इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנֶחֱלֵיתִי יָמִים
  choice: कई दिन तक बीमार रहा
  rationale: נֶחֱלֵיתִי बीमारी या दुर्बलता को और יָמִים अनिर्दिष्ट दिनों की अवधि को दर्शाता है। हिन्दी में ‘कई दिन तक’ अवधि को सहज रूप से व्यक्त करता है, यद्यपि मूल कोई ठीक संख्या नहीं बताता।
- source_word: וָאָקוּם
  choice: फिर मैं उठा
  rationale: वाव-क्रम कथा को अगले चरण में ले जाता है; ‘फिर’ स्वास्थ्यलाभ के बाद उठने और गतिविधि पुनः आरम्भ करने का क्रम स्पष्ट करता है।
- source_word: וָאֶעֱשֶׂה אֶת־מְלֶאכֶת הַמֶּלֶךְ
  choice: राजा का काम करने लगा
  rationale: מְלָאכָה राजा से संबंधित काम या दायित्व है। ‘करने लगा’ हिन्दी में काम पर लौटने का आशय स्वाभाविक रूप से देता है, बिना विशिष्ट पद या प्रशासनिक कार्य जोड़ने के।
- source_word: וָאֶשְׁתּוֹמֵם
  choice: मैं स्तब्ध था
  rationale: यह रूप गहरे आघात, विस्मय और व्याकुलता की अवस्था व्यक्त करता है। ‘स्तब्ध’ केवल आश्चर्य से अधिक तीव्र प्रतिक्रिया बताता है और आधुनिक गरिमामय हिन्दी में स्वाभाविक है।
- source_word: הַמַּרְאֶה
  choice: उस दर्शन
  rationale: दानिय्येल के इस प्रसंग में यह दृश्यात्मक प्रकाशन को सूचित करता है; ‘दर्शन’ प्रासंगिक और प्रचलित हिन्दी विकल्प है।
- source_word: וְאֵין מֵבִין
  choice: उसे समझने वाला कोई न था
  rationale: इब्रानी में समझने वाले का स्पष्ट कर्ता नहीं है। अस्तित्ववाचक हिन्दी वाक्य मूल के सबसे सीधे रूप को बनाए रखता है; दानिय्येल को कर्ता मानने की सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: וְאֵין מֵבִין का कर्ता
  choice: 'अस्तित्ववाचक/निर्वैयक्तिक अर्थ: ‘उसे समझने वाला कोई न था’'
  alternative: 'व्यक्तिगत अर्थ: ‘पर मैं उसे समझ न सका’'
  rationale: मसोरेटिक पाठ में प्रथम पुरुष का स्पष्ट सर्वनाम या क्रियारूप नहीं है, इसलिए निर्वैयक्तिक अर्थ रूप की अधिक सीधी अभिव्यक्ति है। फिर भी निकट प्रसंग में दानिय्येल की प्रतिक्रिया के कारण व्यक्तिगत अर्थ सम्भव है; अतः अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमामय कथात्मक शैली। ‘निढाल’ और ‘स्तब्ध’ दर्शन के तीव्र शारीरिक-मानसिक प्रभाव को बिना अनावश्यक व्याख्या के व्यक्त करते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित अस्पष्ट कथन के बाद रखा गया है।
