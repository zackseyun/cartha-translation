source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/רְאֹתִ֛/י אֲנִ֥י דָנִיֵּ֖אל אֶת הֶ/חָז֑וֹן וָ/אֲבַקְשָׁ֣/ה בִינָ֔ה וְ/הִנֵּ֛ה עֹמֵ֥ד לְ/נֶגְדִּ֖/י כְּ/מַרְאֵה גָֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/015.yaml
  text: And it happened[a], when I, Daniel, had seen the vision and was seeking understanding, behold, standing before me was one with the appearance of a man.
translation:
  language: hi
  text: और ऐसा हुआ कि जब मैं, दानिय्येल, उस दर्शन को देख चुका था और समझ पाने की कोशिश कर रहा था, तो देखो, मेरे सामने एक आकृति खड़ी थी, जो देखने में पुरुष जैसी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह सामान्य इब्रानी कथात्मक सूत्र एक नए घटनाक्रम का परिचय देता है; यह हिन्दी में स्वाभाविक रहते हुए उसके कथात्मक कार्य को बनाए रखता है।
- source_word: בִּרְאֹתִי
  choice: जब मैं ... देख चुका
  rationale: ב־युक्त infinitive construct समय-संबंधी उपवाक्य बनाता है। यहाँ दर्शन देखने के बाद समझ की खोज का क्रम है, इसलिए पूर्ण क्रिया स्वाभाविक है।
- source_word: אֲנִי דָנִיֵּאל
  choice: मैं, दानिय्येल
  rationale: स्पष्ट सर्वनाम और नाम आत्म-पहचान तथा हल्का बल व्यक्त करते हैं।
- source_word: הֶחָזוֹן
  choice: उस दर्शन को
  rationale: חזון संदर्भ में दानिय्येल द्वारा देखे गए दर्शन को सूचित करता है; हिन्दी में पूर्वोक्त दृश्य के लिए ‘उस दर्शन’ स्वाभाविक है।
- source_word: וָאֲבַקְשָׁה בִינָה
  choice: समझ पाने की कोशिश कर रहा था
  rationale: בקשׁ के साथ בינה समझ/अंतर्दृष्टि प्राप्त करने की सक्रिय चेष्टा व्यक्त करता है; अपूर्णकालीन हिन्दी रूप इस जारी प्रयास को स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: הנה अगले दृश्य की ओर सजीव ढंग से ध्यान खींचता है; ‘देखो’ उसकी साहित्यिक और प्रत्यक्षता की शक्ति बनाए रखता है।
- source_word: עֹמֵד לְנֶגְדִּי
  choice: मेरे सामने कोई खड़ा था
  rationale: עמד का कृदन्त और לנגדי दानिय्येल के सामने स्थित आकृति का दृश्य प्रस्तुत करते हैं; यह क्रम आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְּמַרְאֵה גָבֶר
  choice: जिसका रूप एक पुरुष जैसा था
  rationale: כְּ तुलना व्यक्त करता है और מראה दृश्य रूप को; यह अनुवाद आकृति की पहचान तय किए बिना केवल दिखावट की समानता बताता है।
- source_word: גָבֶר
  choice: पुरुष
  rationale: यहाँ גבר एक वयस्क पुरुष की दृश्य आकृति सूचित करता है; ‘पुरुष’ लिंग-विशिष्ट अर्थ को ठीक से रखता है, जबकि ‘मनुष्य’ उसे अस्पष्ट कर सकता है।
theological_decisions:
- issue: כְּמַרְאֵה גָבֶר से वर्णित आकृति की प्रकृति
  choice: केवल इतना कहना कि उसका रूप एक पुरुष जैसा था
  alternative: उसे स्पष्टतः स्वर्गदूत, वास्तविक पुरुष, या देहधारण-पूर्व दिव्य आकृति कहना
  rationale: यह पद आकृति को उसके दिखाई देने वाले रूप के आधार पर वर्णित करता है और उसकी सत्ता या पहचान निश्चित नहीं करता; इसलिए तुलनात्मक और प्रेक्षणात्मक भाषा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, साहित्यिक गरिमा और सामान्य पठनीयता के संतुलन के साथ। ‘तो देखो’ मूल के ध्यानाकर्षक הנה को बनाए रखता है; वाक्य में अनावश्यक प्राचीनता और संप्रदायगत व्याख्या से बचा गया है।
