  text: And I heard the voice of a man between the banks of the Ulai[a], and he called out and said, “Gabriel[c][b], make this one understand the vision.”
translation:
  language: hi
  text: तब मैंने ऊलै के बीच से एक मनुष्य की आवाज़ सुनी। वह पुकारकर बोला, “जिब्राएल, इस व्यक्ति को यह दर्शन समझा दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶשְׁמַע
  choice: तब मैंने ... सुनी
  rationale: वाव-युक्त कथात्मक क्रिया घटनाक्रम को आगे बढ़ाती है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קוֹל אָדָם
  choice: एक मनुष्य की आवाज़
  rationale: शाब्दिक अर्थ ‘मनुष्य की आवाज़’ है; इससे ठोस मानवीय वक्ता का संकेत बना रहता है।
- source_word: בֵּין אוּלָי
  choice: ऊलै की दोनों धाराओं के बीच से
  rationale: בֵּין का अर्थ ‘बीच’ है और ऊलै जलमार्ग का नाम है। ‘दोनों धाराओं’ से सम्भवतः उसके दो किनारे/शाखाएँ अभिप्रेत हैं; ‘से’ आवाज़ के आने के स्थान को स्वाभाविक हिन्दी में बताता है।
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: उसने पुकारकर कहा
  rationale: दोनों क्रियाओं का भाव संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: גַּבְרִיאֵל
  choice: जिब्राएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הָבֵן
  choice: समझा दे
  rationale: 'हिफ़ील आज्ञार्थक का कारणवाचक बल व्यक्त करता है: स्वयं समझना नहीं, किसी को समझाना।'
- source_word: לְהַלָּז
  choice: इस व्यक्ति को
  rationale: दुर्लभ संकेतवाचक पद का आशय दृश्य में उपस्थित व्यक्ति, अर्थात् दानिय्येल, है; ‘इस व्यक्ति’ लिंग जोड़े बिना स्वाभाविक हिन्दी देता है।
- source_word: אֶת הַמַּרְאֶה
  choice: वह दर्शन
  rationale: दानिय्येल के प्रकाशनात्मक प्रसंग में מַרְאֶה का उपयुक्त अर्थ ‘दर्शन’ है; संकेतित दर्शन पहले से प्रसंग में उपस्थित है।
theological_decisions:
- issue: אָדָם और לְהַלָּז के व्यक्तिसूचक अनुवाद
  choice: पहले पद को ‘एक मनुष्य’ और दूसरे को ‘इस व्यक्ति’
  alternative: ‘एक पुरुष’ और ‘इस मनुष्य’ / ‘इस जन’
  rationale: पहले पद में אָדָם स्पष्टतः मानवीय आवाज़ बताता है, जबकि दूसरे पद में केवल संकेतवाचक शब्द है। अतः दूसरे स्थान पर ‘मनुष्य’ जोड़कर स्रोत से अधिक निश्चितता नहीं दी गई।
- issue: ऊलै के स्थानवाचक वाक्यांश की व्याख्या
  choice: ‘ऊलै की दोनों धाराओं के बीच से’
  alternative: ‘ऊलै के दोनों किनारों के बीच से’ / ‘ऊलै के बीच से’
  rationale: प्राचीन अनुवाद-परम्परा और स्थल-संदर्भ में ऊलै की दो धाराओं/शाखाओं के बीच का स्थान सम्भव है। ‘किनारे’ कहना भी सम्भव है, पर वह स्रोत में स्पष्ट नहीं; इसलिए पाठ में ‘धाराओं’ और पादटिप्पणी में विकल्प रखा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। अनावश्यक तकनीकी शब्दावली से बचते हुए कारणवाचक आज्ञा और दृश्य का स्थानिक भाव सुरक्षित रखा गया है।
