source:
  edition: WLC
  text: וַ/תִּגְדַּ֖ל עַד צְבָ֣א הַ/שָּׁמָ֑יִם וַ/תַּפֵּ֥ל אַ֛רְצָ/ה מִן הַ/צָּבָ֥א וּ/מִן הַ/כּוֹכָבִ֖ים וַֽ/תִּרְמְסֵֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/010.yaml
  text: It grew as high as the host of heaven[a], and it cast some of the host and some of the stars down to the earth, and trampled them.
translation:
  language: hi
  text: वह बढ़ते-बढ़ते स्वर्ग की सेना तक पहुँच गया। उसने उस सेना में से कुछ को और तारों में से कुछ को धरती पर गिरा दिया और उन्हें रौंद डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּגְדַּל
  choice: वह बढ़ते-बढ़ते
  rationale: גדל के क़ाल रूप में बढ़ने या महान होने का भाव है। यहाँ सींग के विस्तार की गतिशील छवि को स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना आत्म-महिमा का अर्थ जोड़े।
- source_word: עַד צְבָא הַשָּׁמַיִם
  choice: आकाश की सेना तक पहुँच गया
  rationale: עַד सीमा या पहुँच को दर्शाता है। हिन्दी में ‘तक पहुँच गया’ ऊर्ध्व दिशा और विस्तार को सहज रूप से व्यक्त करता है।
- source_word: צְבָא הַשָּׁמַיִם
  choice: आकाश की सेना
  rationale: צָבָא का अर्थ सेना या विशाल समूह हो सकता है। ‘आकाश की सेना’ सैन्य बिंब बनाए रखता है और स्वर्गीय प्राणियों, परमेश्वर के लोगों या खगोलीय शक्तियों के बीच निहित अस्पष्टता को नहीं मिटाता।
- source_word: וַתַּפֵּל
  choice: गिरा दिया
  rationale: נפל का हिफ़ील रूप किसी को गिराने का कारण बनने को व्यक्त करता है। ‘गिरा दिया’ स्पष्ट, स्वाभाविक और बलपूर्ण हिन्दी है।
- source_word: אַרְצָה
  choice: धरती पर
  rationale: दिशासूचक रूप नीचे धरती की ओर गति बताता है। ब्रह्मांडीय संदर्भ में ‘धरती पर’ उपयुक्त है।
- source_word: מִן הַצָּבָא וּמִן הַכּוֹכָבִים
  choice: उस सेना और तारों में से कुछ को
  rationale: यहाँ מִן का अंशवाचक अर्थ स्वाभाविक है। ‘में से कुछ’ स्पष्ट करता है कि पूरी सेना और सभी तारे नहीं गिराए गए।
- source_word: הַכּוֹכָבִים
  choice: तारों
  rationale: כּוֹכָבִים का सीधा अर्थ ‘तारे’ है। सम्भावित प्रतीकात्मक अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: וַתִּרְמְסֵם
  choice: उन्हें रौंद डाला
  rationale: רמס का अर्थ रौंदना है। ‘रौंद डाला’ मूल क्रिया की हिंसक और निर्णायक शक्ति को वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘आकाश की सेना’ और ‘तारों’ की पहचान
  choice: मुख्य पाठ में मूल दृश्यात्मक शब्द रखे गए हैं और उनके संकेतार्थ को अनिर्धारित छोड़ा गया है।
  alternative: इन्हें स्वर्गदूत, परमेश्वर के लोग/पवित्र जन, या प्रतीकात्मक खगोलीय शासक कहना।
  rationale: यह दर्शन प्रतीकात्मक है, पर इस पद का इब्रानी पाठ इनकी पहचान स्पष्ट नहीं करता। किसी एक व्याख्या को मुख्य पाठ में रखने से मूल धार्मिक और साहित्यिक तनाव समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘आकाश की सेना’ मूल सैन्य और ब्रह्मांडीय बिंब बनाए रखता है; ‘बढ़ते-बढ़ते … तक पहुँच गया’ हिन्दी में उस ऊर्ध्व विस्तार को सहज बनाता है।
