  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/צָבָ֛א תִּנָּתֵ֥ן עַל הַ/תָּמִ֖יד בְּ/פָ֑שַׁע וְ/תַשְׁלֵ֤ךְ אֱמֶת֙ אַ֔רְצָ/ה וְ/עָשְׂתָ֖ה וְ/הִצְלִֽיחָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/012.yaml
  text: And a host was given over with the regular burnt offering because of transgression[a]; and it cast truth to the ground[c][b], and it acted and prospered.
translation:
  language: hi
  text: और अपराध के कारण एक दल को नियमित होमबलि[a] के साथ[b] सौंप दिया गया; उसने[c] सत्य को भूमि पर पटक दिया, और उसने कार्य किया और वह सफल हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दैनिक बलि’ अथवा ‘निरंतर चढ़ावा।’ इब्रानी शब्द तामीद मंदिर में नियमित रूप से चढ़ाए जाने वाले बलिदान को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नियमित होमबलि के विरुद्ध।’ यहाँ ‘दल’ और ‘नियमित होमबलि’ को जोड़ने वाली इब्रानी रचना कठिन है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में यहाँ और इसके बाद की क्रियाएँ स्त्रीलिंग एकवचन हैं। दर्शन की संक्षिप्त भाषा में उनका सटीक कर्ता स्पष्ट नहीं है; वे पिछले प्रसंग में प्रतीकित विरोधी शक्ति की ओर संकेत कर सकती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְצָבָא
  choice: एक दल
  rationale: צָבָא सेना, सैन्य-दल या लोगों के एक संगठित समूह को सूचित कर सकता है। ‘दल’ सामूहिक अर्थ को रखते हुए इसे केवल सैनिक सेना तक सीमित नहीं करता।
- source_word: תִּנָּתֵן
  choice: सौंप दिया गया
  rationale: נתן का निफ़अल रूप कर्मवाच्य है। ‘सौंप दिया गया’ किसी के अधिकार में दिए जाने का प्रसंगानुकूल भाव व्यक्त करता है, पर प्राप्तकर्ता को स्पष्ट करके पाठ की अस्पष्टता नहीं मिटाता।
- source_word: עַל
  choice: के साथ
  rationale: यहाँ עַל का संबंध कठिन है। ‘के साथ’ दल और नियमित होमबलि के साझा भाग्य को व्यक्त करता है; ‘के विरुद्ध’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: הַתָּמִיד
  choice: नियमित होमबलि
  rationale: मन्दिर-संबंधी प्रसंग में תָּמִיד नियमित रूप से चढ़ाए जाने वाले बलिदान को सूचित करता है। ‘नियमित होमबलि’ आधुनिक पाठक के लिए इसके बलिदान-संबंधी अर्थ को स्पष्ट करता है।
- source_word: בְּפָשַׁע
  choice: अपराध के कारण
  rationale: यहाँ בְּ को कारणसूचक समझना स्वाभाविक है। यह अनुवाद यह निर्धारित नहीं करता कि अपराध किसका था।
- source_word: וְתַשְׁלֵךְ
  choice: पटक दिया
  rationale: שלך का मूल भाव फेंकना या नीचे डालना है। ‘भूमि पर पटक दिया’ दमन और अपमान की सजीव छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱמֶת
  choice: सत्य
  rationale: אֱמֶת का अर्थ सत्य या विश्वासयोग्यता हो सकता है। यहाँ ‘सत्य’ इसके व्यापक नैतिक और धार्मिक बल को सुरक्षित रखता है।
- source_word: אַרְצָה
  choice: भूमि पर
  rationale: दिशासूचक रूप אַרְצָה का मुहावरेदार अर्थ भूमि या धरती की ओर है; ‘भूमि पर’ हिन्दी में स्वाभाविक है।
- source_word: וְעָשְׂתָה
  choice: काम करता रहा
  rationale: עשה व्यापक क्रिया है जिसका कर्म यहाँ व्यक्त नहीं है। ‘काम करता रहा’ मूल की संक्षिप्तता रखता है और ‘मनमाना करता रहा’ जैसा व्याख्यात्मक भाव नहीं जोड़ता।
- source_word: וְהִצְלִיחָה
  choice: सफल होता रहा
  rationale: צלח के हिफ़ईल रूप का अर्थ सफल या समृद्ध होना है। ‘सफल होता रहा’ इस विरोधी शक्ति की लगातार सफलता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन क्रियाओं का कर्ता
  choice: मुख्य पाठ में ‘उसने/वह’ रखा गया और किसी विशिष्ट शक्ति या छोटे सींग का नाम नहीं जोड़ा गया।
  alternative: ‘उस सींग ने’ अथवा ‘उस विरोधी शक्ति ने’
  rationale: इब्रानी में बाद की क्रियाएँ स्त्रीलिंग एकवचन हैं, पर दृष्टान्त की संक्षिप्त रचना में उनका सटीक कर्ता स्पष्ट नहीं है। हिन्दी में निकटतम व्याकरणिक संगति के कारण क्रियाएँ पुल्लिंग हैं, जबकि पादटिप्पणी मूल की स्त्रीलिंग रचना और कर्ता की अनिश्चितता बताती है।
- issue: תָּמִיד का धार्मिक-सांस्कृतिक अर्थ
  choice: ‘नियमित होमबलि’
  alternative: ‘दैनिक बलि’ अथवा ‘निरन्तर चढ़ावा’
  rationale: यह पद मन्दिर में नियमित रूप से चढ़ाए जाने वाले बलिदान की ओर संकेत करता है। चुना हुआ रूप सामान्य पाठक के लिए बलिदान-संबंधी अर्थ स्पष्ट करता है, जबकि अन्य सम्भव रूप पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दल’ से צָבָא की सामूहिकता बनी रहती है और अर्थ को केवल ‘सेना’ तक सीमित नहीं किया गया। मूल की कठिन वाक्यरचना और कर्ता की अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
