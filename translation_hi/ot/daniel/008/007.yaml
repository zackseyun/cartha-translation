  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथन। पशुओं के लिए प्रसंगानुसार पुल्लिंग सर्वनाम रखे गए हैं। संघर्ष की तीव्रता सुरक्षित है; मुहावरों की मूल छवि मुख्य पाठ में जहाँ संभव था, बनाए रखी गई है और पादटिप्पणियों में अर्थ स्पष्ट किया गया है।
