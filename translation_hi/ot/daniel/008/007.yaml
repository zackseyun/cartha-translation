reference: Daniel 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/רְאִיתִ֞י/ו מַגִּ֣יעַ אֵ֣צֶל הָ/אַ֗יִל וַ/יִּתְמַרְמַ֤ר אֵלָי/ו֙ וַ/יַּ֣ךְ אֶת הָ/אַ֔יִל וַ/יְשַׁבֵּר֙ אֶת שְׁתֵּ֣י קְרָנָ֔י/ו וְ/לֹא הָ֥יָה כֹ֛חַ בָּ/אַ֖יִל לַ/עֲמֹ֣ד לְ/פָנָ֑י/ו וַ/יַּשְׁלִיכֵ֤/הוּ אַ֨רְצָ/ה֙ וַֽ/יִּרְמְסֵ֔/הוּ וְ/לֹא הָיָ֥ה מַצִּ֛יל לָ/אַ֖יִל מִ/יָּדֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/007.yaml
  text: And I saw him come up to the ram[a], and he was enraged against him, and he struck the ram and broke its two horns. And there was no strength in the ram to stand before him; he threw him to the ground and trampled him[d][c][b], and there was no one to rescue the ram from his hand.
translation:
  language: hi
  text: मैंने उसे मेढ़े के पास आते देखा[a]। वह उस पर क्रोध से भड़क उठा[b] और उसने मेढ़े पर प्रहार करके उसके दोनों सींग तोड़ दिए। मेढ़े में उसका सामना करने की शक्ति नहीं थी[c]। उसने उसे भूमि पर पटक दिया और उसे रौंद डाला; और मेढ़े को उसके हाथ से छुड़ानेवाला कोई न था[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेढ़े तक पहुँचते देखा।” इब्रानी क्रिया पास आने या पहुँचने—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उसके विरुद्ध कटुता से भर गया।” इब्रानी अभिव्यक्ति तीव्र वैर और भड़के हुए क्रोध का भाव देती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “उसके सामने खड़े रहने की शक्ति नहीं थी”; इस संघर्ष में इसका अर्थ उसका सामना करना या उसका प्रतिरोध करना है।
    reason: lexical_alternative
  - marker: d
    text: “उसके हाथ से” इब्रानी मुहावरा है, जिसका आशय उसकी शक्ति या नियंत्रण से है।
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתִיו
  choice: मैंने उसे ... देखा
  rationale: प्रथम पुरुष क्रिया और पुल्लिंग एकवचन कर्म-प्रत्यय को सीधे व्यक्त करता है; संदर्भ में यह बकरा है।
- source_word: מַגִּיעַ אֵצֶל הָאַיִל
  choice: मेढ़े के पास आते
  rationale: नגע के कृदंत और אֵצֶל से निकट आने या पहुँचने की गति व्यक्त होती है; ‘पास आते’ स्वाभाविक है और मूल की कुछ अर्थ-व्याप्ति बनाए रखता है।
- source_word: וַיִּתְמַרְמַר אֵלָיו
  choice: वह उस पर क्रोध से भड़क उठा
  rationale: Hitpael रूप तीव्र कटुता और वैरपूर्ण रोष दर्शाता है; यह चुनाव युद्ध-संदर्भ में उसकी भावात्मक तीव्रता व्यक्त करता है।
- source_word: וַיַּךְ אֶת הָאַיִל
  choice: उसने मेढ़े पर प्रहार किया
  rationale: נכה का सीधा और वर्तमान हिन्दी में स्वाभाविक अर्थ ‘प्रहार करना’ है।
- source_word: וַיְשַׁבֵּר אֶת שְׁתֵּי קְרָנָיו
  choice: उसके दोनों सींग तोड़ दिए
  rationale: שבר का सीधा अर्थ ‘तोड़ना’ है; प्रत्यय मेढ़े की ओर संकेत करता है।
- source_word: וְלֹא הָיָה כֹחַ בָּאַיִל לַעֲמֹד לְפָנָיו
  choice: मेढ़े में उसका सामना करने की शक्ति नहीं थी
  rationale: כֹחַ को ‘शक्ति’ और संघर्ष-संदर्भ में ‘उसके सामने खड़ा रहने’ को स्वाभाविक हिन्दी ‘उसका सामना करने’ से व्यक्त किया गया है।
- source_word: וַיַּשְׁלִיכֵהוּ אַרְצָה
  choice: उसने उसे भूमि पर पटक दिया
  rationale: השליך और दिशासूचक אַרְצָה नीचे भूमि पर बलपूर्वक फेंकने का दृश्य देते हैं; ‘पटक दिया’ इस युद्ध-दृश्य में स्वाभाविक है।
- source_word: וַיִּרְמְסֵהוּ
  choice: उसे रौंद डाला
  rationale: רמס का अर्थ रौंदना है; ‘रौंद डाला’ हिंसक और निर्णायक क्रिया को स्पष्ट करता है।
- source_word: וְלֹא הָיָה מַצִּיל לָאַיִל מִיָּדוֹ
  choice: मेढ़े को उसके हाथ से छुड़ानेवाला कोई न था
  rationale: מַצִּיל सक्रिय ‘छुड़ानेवाला’ है; ‘हाथ से’ मूल इब्रानी शक्ति अथवा नियंत्रण के मुहावरे को सुरक्षित रखता है।
