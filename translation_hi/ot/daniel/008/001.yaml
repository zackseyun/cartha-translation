  yaml_path: translation/ot/daniel/008/001.yaml
  text: In the third year of the reign of Belshazzar the king[a], a vision appeared to me—I, Daniel—after the one that had appeared to me at the first.
translation:
  language: hi
  text: राजा बेलशस्सर के शासन के तीसरे वर्ष में मुझ दानिय्येल को एक दर्शन दिखाई दिया, उस दर्शन के बाद जो मुझे पहले दिखाई दिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שָׁלוֹשׁ לְמַלְכוּת
  choice: के शासन के तीसरे वर्ष में
  rationale: यह राजकीय कालगणना का स्वाभाविक आधुनिक हिन्दी रूप है; शाब्दिक संख्या ‘तीन’ यहाँ क्रमवाचक ‘तीसरे’ के अर्थ में है।
- source_word: בֵּלְאשַׁצַּר הַמֶּלֶךְ
  choice: राजा बेलशस्सर
  rationale: हिब्रू में नाम के साथ उपाधि अलग आती है; हिन्दी में ‘राजा बेलशस्सर’ अधिक स्वाभाविक है और दोनों तत्व सुरक्षित रखता है।
- source_word: חָזוֹן נִרְאָה אֵלַי
  choice: मुझको ... एक दर्शन दिखाई दिया
  rationale: निफ़अल נִרְאָה को ‘दिखाई दिया’ कहना दर्शन के प्रकट होने और दानिय्येल के उसे देखने—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲנִי דָנִיֵּאל
  choice: मुझको—मुझ दानिय्येल को—
  rationale: स्पष्ट सर्वनाम और नाम का बलाघात बनाए रखने के लिए आत्म-पहचान को मध्यस्थ पदबंध के रूप में रखा गया है।
- source_word: אַחֲרֵי הַנִּרְאָה אֵלַי בַּתְּחִלָּה
  choice: यह उस दर्शन के बाद हुआ, जो मुझे पहले दिखाई दिया था
  rationale: हिब्रू में ‘दर्शन’ दूसरी बार स्पष्ट रूप से नहीं दोहराया गया, पर पूर्ववर्ती חָזוֹן उसका स्वाभाविक आशय देता है। हिन्दी में अस्पष्ट ‘उसके’ से बचने के लिए संज्ञा दोहराई गई है; ‘पहले’ आरम्भिक/पूर्व दर्शन की ओर संकेत करता है।
