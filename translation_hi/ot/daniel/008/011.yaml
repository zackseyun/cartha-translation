id: DAN.8.11
reference: Daniel 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַ֥ד שַֽׂר הַ/צָּבָ֖א הִגְדִּ֑יל וּ/מִמֶּ֨/נּוּ֙ הרים הַ/תָּמִ֔יד וְ/הֻשְׁלַ֖ךְ מְכ֥וֹן מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/011.yaml
  text: It even magnified itself up to the Prince of the host[a], and from him the regular offering was taken away[c][b], and the place of his sanctuary was cast down.
translation:
  language: hi
  text: उसने सेना के प्रधान तक भी अपने आपको ऊँचा किया। उससे[b] नियमित भेंट[a] हटा दी गई, और उसके पवित्रस्थान का स्थल[c] ढा दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निरन्तर भेंट’ अथवा ‘प्रतिदिन की भेंट’। मन्दिर के प्रसंग में इब्रानी पद नियमित रूप से जारी बलिदानी सेवा को सूचित करता है, जिसे परम्परागत रूप से नियमित होमबलि समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘उससे’ इब्रानी सर्वनाम का सीधा रूप है; यह सर्वनाम किसकी ओर संकेत करता है, इस पर मतभेद है।
    reason: alternative_reading
  - marker: c
    text: या ‘उसके पवित्रस्थान की नींव ढा दी गई।’ इब्रानी शब्द का अर्थ ‘स्थान/स्थल’ या ‘नींव’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד
  choice: यहाँ ‘इतना...कि ... तक’ की रचना
  rationale: עַד सीमा या विस्तार (‘तक’) बताता है। हिन्दी में यह रचना सींग के आत्म-बड़प्पन की चरम सीमा को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: שַׂר הַצָּבָא
  choice: सेना का प्रधान
  rationale: שַׂר के शासक, प्रधान या सेनापति जैसे अर्थ हो सकते हैं और צָבָא सेना अथवा स्वर्गीय समुदाय को सूचित कर सकता है। ‘प्रधान’ पद की ऊँचाई बनाए रखते हुए उसके अभिप्रेत व्यक्ति की पहचान खुली रखता है।
- source_word: הִגְדִּיל
  choice: अपने आपको इतना बड़ा करने लगा
  rationale: इस अध्याय में यह क्रिया घमण्डपूर्ण आत्म-वृद्धि या आत्म-महिमा का भाव रखती है। हिन्दी प्रयोग प्रतिवर्ती अर्थ और प्रसंग की पुनरावृत्त धारणा दोनों को व्यक्त करता है।
- source_word: וּמִמֶּנּוּ
  choice: उससे
  rationale: पुल्लिंग एकवचन प्रत्यय का सीधा हिन्दी रूप है। ‘उससे’ इस बात को अनिर्णीत रहने देता है कि सर्वनाम का पूर्वपद प्रधान है, सींग है, या प्रसंग का कोई और पुल्लिंग पद।
- source_word: הרים
  choice: हटा दी गई
  rationale: शाब्दिक रूप ‘ऊपर उठाना’ से जुड़ा है, पर הַתָּמִיד के साथ प्रसंग में नियमित उपासना को दूर किए जाने का अर्थ निकलता है। हिन्दी कर्मवाच्य उस पाठगत और वाक्यगत कठिनाई को बिना अनावश्यक रूप से कर्ता तय किए व्यक्त करता है।
- source_word: הַתָּמִיד
  choice: नियमित बलि
  rationale: תָּמִיד का मूल भाव नियमित या निरन्तर होने का है; मन्दिर के प्रसंग में यह नियमित बलिदानी सेवा के लिए संक्षिप्त पद है। ‘बलि’ हिन्दी पाठक को उपासना-सन्दर्भ स्पष्ट करता है, जबकि पादटिप्पणी अन्य सम्भव रूप देती है।
- source_word: וְהֻשְׁלַךְ
  choice: ढा दिया गया
  rationale: होफल का कर्मवाच्य और नीचे फेंकने/गिरा देने की हिंसक छवि हिन्दी के इस स्वाभाविक प्रयोग में बनी रहती है।
- source_word: מְכוֹן
  choice: स्थल
  rationale: מָכוֹן किसी स्थिर स्थान, स्थापित स्थल या नींव को सूचित कर सकता है। ‘स्थल’ मुख्य पाठ में व्यापक अर्थ रखता है; ‘नींव’ पादटिप्पणी में सुरक्षित है।
- source_word: מִקְדָּשׁוֹ
  choice: उसका पवित्रस्थान
  rationale: यह पद पवित्र या आराधना-स्थल को सूचित करता है। ‘पवित्रस्थान’ धार्मिक अर्थ बनाए रखता है और उसे अनिवार्यतः पूरे मन्दिर-परिसर तक सीमित नहीं करता।
theological_decisions:
- issue: ‘सेना के प्रधान’ की पहचान
  choice: मुख्य पाठ में पदवी को तटस्थ रूप से ‘सेना का प्रधान’ रखा गया है।
  alternative: इसे परमेश्वर, किसी स्वर्गीय प्रधान, महायाजक ओनियास तृतीय, या मसीह के रूप में स्पष्ट करना।
  rationale: इब्रानी पदवी ऊँची है, पर स्वयं उस व्यक्ति की पहचान निश्चित नहीं करती। अनुवाद किसी एक धार्मिक या ऐतिहासिक व्याख्या को मुख्य पाठ में नहीं थोपता।
- issue: ‘उससे’ सर्वनाम का पूर्वपद
  choice: मुख्य पाठ में ‘उससे’ रखकर अस्पष्टता सुरक्षित की गई है।
  alternative: इसे सींग, सेना, प्रधान या किसी निर्वैयक्तिक कर्मवाच्य सम्बन्ध के रूप में स्पष्ट करना।
  rationale: पुल्लिंग एकवचन प्रत्यय का पूर्वपद विवादित है; किसी एक को चुनने से मूल पाठ की वास्तविक अस्पष्टता मिट जाती।
- issue: नियमित बलि हटाने वाले कर्ता की पहचान
  choice: ‘हटा दी गई’ कर्मवाच्य रखा गया है।
  alternative: ‘उसने नियमित बलि हटा दी’ कहकर सींग को स्पष्ट कर्ता बनाना।
  rationale: इब्रानी रूप और वाक्य-संरचना कठिन हैं, और परम्परागत पाठ-समझ में सक्रिय तथा कर्मवाच्य दोनों प्रकार के निरूपण मिलते हैं। कर्मवाच्य प्रसंग का आशय देता है, पर कर्ता को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण रखी गई है। ‘सेना का प्रधान’, ‘नियमित बलि’ और ‘पवित्रस्थान’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल के धार्मिक और प्रतीकात्मक स्वर को बनाए रखते हैं।
