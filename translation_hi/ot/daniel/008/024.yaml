source:
  edition: WLC
  text: וְ/עָצַ֤ם כֹּח/וֹ֙ וְ/לֹ֣א בְ/כֹח֔/וֹ וְ/נִפְלָא֥וֹת יַשְׁחִ֖ית וְ/הִצְלִ֣יחַ וְ/עָשָׂ֑ה וְ/הִשְׁחִ֥ית עֲצוּמִ֖ים וְ/עַם קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/024.yaml
  text: His power will become strong[a], but not by his own power. He will bring about extraordinary destruction, and he will succeed and act; he will destroy the mighty and the people of the holy ones.
translation:
  language: hi
  text: उसकी शक्ति प्रबल हो जाएगी, पर अपनी ही शक्ति से नहीं। वह असाधारण विनाश करेगा; वह सफल होगा और कार्य करेगा। वह शक्तिशाली लोगों और पवित्र जनों के लोगों[a] को नष्ट करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र प्रजा”; अथवा, “संतों की प्रजा।”
    reason: इब्रानी עַם קְדֹשִׁים का शाब्दिक अर्थ “पवित्र जनों के लोग” है; किंतु इसे मुहावरेदार रूप में “पवित्र प्रजा” अथवा “संतों की प्रजा” भी समझा जा सकता है।
lexical_decisions:
- source_word: וְעָצַם כֹּחוֹ
  choice: उसकी शक्ति प्रबल हो जाएगी
  rationale: עָצַם के साथ כֹּחַ शक्ति के बलवान या प्रबल हो जाने को व्यक्त करता है। क्रियात्मक अनुवाद इब्रानी के भाव को बनाए रखता है।
- source_word: וְלֹא בְכֹחוֹ
  choice: पर अपनी शक्ति से नहीं
  rationale: בְ यहाँ साधन या माध्यम दर्शाता है। ‘अपनी’ पहले और दूसरे उपवाक्य के बीच का विरोध स्पष्ट करता है, बिना उस बाहरी शक्ति के स्रोत की पहचान तय किए।
- source_word: וְנִפְלָאוֹת יַשְׁחִית
  choice: वह असाधारण विनाश करेगा
  rationale: נִפְלָאוֹת असाधारण या विस्मयकारी बातों का बोध कराता है; שׁחת के साथ यह असाधारण पैमाने या ढंग के विनाश को व्यक्त करता है।
- source_word: וְהִצְלִיחַ וְעָשָׂה
  choice: वह सफल होगा और कार्य करेगा
  rationale: הִצְלִיחַ सफलता को और עָשָׂה व्यापक रूप से करने या कार्य करने को दर्शाता है। अनुवाद ‘अपनी इच्छा के अनुसार’ जैसी ऐसी बात नहीं जोड़ता जो मूल में स्पष्ट नहीं है।
- source_word: וְהִשְׁחִית עֲצוּמִים
  choice: वह शक्तिशाली लोगों ... को नष्ट करेगा
  rationale: संज्ञा के रूप में प्रयुक्त עֲצוּמִים बलवान या शक्तिशाली व्यक्तियों को दर्शाता है; सैन्य-दमनकारी संदर्भ में שׁחת के लिए ‘नष्ट करेगा’ उपयुक्त है।
- source_word: וְעַם קְדֹשִׁים
  choice: और पवित्र जनों की प्रजा
  rationale: यह अनुवाद construct संबंध और קְדֹשִׁים के बहुवचन ‘पवित्र जनों’ को बनाए रखता है। अधिक मुहावरेदार वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: וְעַם קְדֹשִׁים का संदर्भ और अर्थ-छाया
  choice: पवित्र जनों की प्रजा
  alternative: पवित्र प्रजा; या संतों की प्रजा
  rationale: इब्रानी में קְדֹשִׁים बहुवचन है और इसका संबंध स्वर्गीय पवित्र जनों, संतों, अथवा परमेश्वर की पवित्र प्रजा से समझा जा सकता है। मुख्य पाठ अधिक शाब्दिक संबंध बनाए रखता है और पाद-टिप्पणी मुहावरेदार विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। छोटे समन्वित वाक्य भविष्यवाणी की दृढ़ लय बनाए रखते हैं। ‘प्रबल’, ‘असाधारण विनाश’ और ‘पवित्र जन’ मूल की अर्थ-छायाओं को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त करते हैं।
