  text: וַ/יֹּ֣אמֶר אֵלַ֔/י עַ֚ד עֶ֣רֶב בֹּ֔קֶר אַלְפַּ֖יִם וּ/שְׁלֹ֣שׁ מֵא֑וֹת וְ/נִצְדַּ֖ק קֹֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/014.yaml
  text: And he said to me[a], “Until 2,300 evenings and mornings[b]; then the sanctuary will be restored.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “दो हज़ार तीन सौ साँझ-सवेरे तक[a]; तब पवित्रस्थान को उचित दशा में बहाल किया जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दो हज़ार तीन सौ साँझ-सवेरे तक।” यह वाक्यांश 2,300 पूरे दिनों को या 2,300 साँझ-सवेरे के अर्पणों को (लगभग 1,150 दिन) सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या “तब पवित्रस्थान शुद्ध किया जाएगा,” “सही ठहराया जाएगा,” अथवा “न्यायोचित ठहराया जाएगा।” हिब्रू क्रिया का मूल भाव है “ठीक दशा में किया जाना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: और उसने मुझसे कहा
  rationale: यह कथन के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और वक्ता के लिए मूल के पुल्लिंग एकवचन रूप को बनाए रखता है।
- source_word: עַד
  choice: बीतने तक
  rationale: עַד समय की सीमा बताता है। गिने हुए ‘साँझ और सवेरे’ के साथ ‘बीतने तक’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: עֶרֶב בֹּקֶר
  choice: साँझ और सवेरे
  rationale: दोनों हिब्रू संज्ञाओं को निकटता से बनाए रखता है और यह तय नहीं करता कि संख्या पूरे दिनों की है या साँझ-सवेरे के बलिदानों की।
- source_word: אַלְפַּיִם וּשְׁלֹשׁ מֵאוֹת
  choice: दो हज़ार तीन सौ
  rationale: मूल संख्या का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: וְנִצְדַּק
  choice: फिर ठीक दशा में लाया जाएगा
  rationale: צדק के निफ़अल रूप का व्यापक भाव ‘ठीक किया जाना/उचित दशा में लाया जाना’ है। यह केवल ‘शुद्ध किया जाएगा’ जैसे संकुचित अनुष्ठानिक अर्थ को मुख्य पाठ में आरोपित नहीं करता।
- source_word: קֹדֶשׁ
  choice: पवित्रस्थान
  rationale: दानिय्येल 8 के मन्दिर-सन्दर्भ में यह पवित्र स्थान अथवा पवित्रस्थान को सूचित करता है; ‘पवित्रस्थान’ सटीक और परिचित हिन्दी पद है।
theological_decisions:
- issue: עֶרֶב בֹּקֶר की कालगत व्याख्या
  choice: मुख्य पाठ में ‘दो हज़ार तीन सौ साँझ और सवेरे’
  alternative: 2,300 पूरे दिन; अथवा 2,300 साँझ-सवेरे के बलिदान, यानी लगभग 1,150 दिन
  rationale: मूल अभिव्यक्ति व्याख्यात्मक रूप से खुली है; मुख्य पाठ किसी एक कालगणना को निश्चित नहीं करता।
- issue: וְנִצְדַּק קֹדֶשׁ का अर्थ
  choice: पवित्रस्थान को फिर ठीक दशा में लाया जाएगा
  alternative: पवित्रस्थान शुद्ध किया जाएगा; उसका औचित्य सिद्ध होगा; उसे न्यायोचित ठहराया जाएगा
  rationale: यहाँ טהר (‘शुद्ध करना’) के बजाय צדק प्रयुक्त है। चुना हुआ रूप ‘ठीक किए जाने’ का व्यापक अर्थ रखता है और किसी विशिष्ट साम्प्रदायिक व्याख्या को नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘साँझ और सवेरे’ मूल की विशिष्ट अभिव्यक्ति तथा उसकी कालगत अस्पष्टता को बचाता है; ‘ठीक दशा में लाया जाएगा’ क्रिया के व्यापक न्याय/पुनर्स्थापन संबंधी भाव को व्यक्त करता है।
