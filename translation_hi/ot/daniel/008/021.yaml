base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/021.yaml
  text: And the shaggy male goat is the king of Greece[b][a], and the great horn that is between his eyes is the first king.
translation:
  language: hi
  text: और वह रोएँदार नर बकरा यूनान का राजा है[a][b], और उसकी आँखों के बीच का बड़ा सींग पहला राजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नर बकरा” अथवा केवल “बकरा।” इब्रानी अभिव्यक्ति अधिक सजीव है और रोएँदार नर बकरे का वर्णन करती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “यावान,” जो यहाँ सामान्यतः यूनान अथवा यूनानी सत्ता को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּפִיר הַשָּׂעִיר
  choice: वह रोएँदार बकरा
  rationale: दोनों इब्रानी पद नर बकरे और उसके झबरे/रोएँदार स्वरूप को व्यक्त करते हैं। ‘रोएँदार बकरा’ इस सजीव वर्णन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מֶלֶךְ יָוָן
  choice: यूनान का राजा
  rationale: इस संदर्भ में יָוָן यूनान अथवा यूनानी सत्ता को सूचित करता है; מֶלֶךְ एकवचन ‘राजा’ है, इसलिए पाठ के व्यक्तिगत और राजनीतिक रूपक को ज्यों का त्यों रखा गया है।
- source_word: הַקֶּרֶן הַגְּדוֹלָה
  choice: बड़ा सींग
  rationale: यह प्रतीकात्मक बिंब के आकार और प्रमुखता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר בֵּין עֵינָיו
  choice: उसकी आँखों के बीच का
  rationale: सम्बन्धवाचक उपवाक्य को संक्षिप्त और स्वाभाविक हिन्दी विशेषण-पदबंध में व्यक्त किया गया है; ‘उसकी’ इब्रानी के पुल्लिंग एकवचन प्रत्यय का अनुसरण करता है।
- source_word: הוּא הַמֶּלֶךְ הָרִאשׁוֹן
  choice: पहला राजा है
  rationale: רִאשׁוֹן यहाँ क्रम में प्रथम को सूचित करता है। दोनों स्थानों पर מֶלֶךְ के लिए ‘राजा’ रखने से पद की आंतरिक संगति बनी रहती है।
theological_decisions:
- issue: प्रतीकात्मक बकरे और सींग का संकेतार्थ
  choice: बकरा यूनान के राजा को और बड़ा सींग पहले राजा को दर्शाता है।
  alternative: बकरे को केवल किसी एक राजा के बजाय सामूहिक रूप से यूनानी राज्य का प्रतीक समझना।
  rationale: इब्रानी पाठ स्पष्टतः מֶלֶךְ יָוָן (‘यूनान का राजा’) कहता है और फिर सींग को ‘पहला राजा’ बताता है। अनुवाद इसी प्रतीक-व्याख्या को रखता है और मुख्य पाठ में बाद की किसी विशिष्ट ऐतिहासिक पहचान को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘रोएँदार बकरा’ मूल के वर्णनात्मक बल को सुरक्षित रखता है; ‘यूनान’ सामान्य पाठक के लिए ‘यावान’ से अधिक स्पष्ट है। पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरंत बाद रखे गए हैं।
