  text: וַ/אֲנִ֣י הָיִ֣יתִי מֵבִ֗ין וְ/הִנֵּ֤ה צְפִיר הָֽ/עִזִּים֙ בָּ֤א מִן הַֽ/מַּעֲרָב֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֵ֥ין נוֹגֵ֖עַ בָּ/אָ֑רֶץ וְ/הַ֨/צָּפִ֔יר קֶ֥רֶן חָז֖וּת בֵּ֥ין עֵינָֽי/ו׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/005.yaml
  text: As I was considering[a], behold, a male goat came from the west over the face of the whole earth, without touching the ground[c][b]; and the goat had a conspicuous horn between its eyes.
translation:
  language: hi
  text: जब मैं विचार कर रहा था, तो देखो, पश्चिम से एक नर बकरा समूची पृथ्वी के ऊपर से, धरती को छुए बिना, चला आ रहा था। उस बकरे की आँखों के बीच एक प्रमुख सींग[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “एक साफ़ दिखाई देने वाला सींग” अथवा “एक विशिष्ट सींग।”
    reason: חָזוּת सींग की दृष्टिगोचर प्रमुखता या विशिष्टता का भाव दे सकता है।
lexical_decisions:
- source_word: הָיִיתִי מֵבִין
  choice: मैं इस पर विचार कर रहा था
  rationale: היה के साथ कृदंत जारी क्रिया को व्यक्त करता है; यहाँ מֵבִין दर्शन पर सक्रिय मनन को दर्शाता है, केवल प्राप्त समझ को नहीं।
- source_word: וְהִנֵּה
  choice: तभी देखो
  rationale: यह दर्शन में अचानक सामने आए नए दृश्य को जीवंत ढंग से प्रस्तुत करता है। ‘देखो’ भविष्यद्वक्ताओं की दर्शन-भाषा का बल बनाए रखता है, और ‘तभी’ प्रसंगगत संक्रमण को स्वाभाविक बनाता है।
- source_word: צְפִיר הָעִזִּים
  choice: एक नर बकरा
  rationale: इब्रानी पदबंध विशेष रूप से बकरे के नर होने को बताता है; आधुनिक हिन्दी में ‘नर बकरा’ स्पष्ट और स्वाभाविक है।
- source_word: מִן הַמַּעֲרָב
  choice: पश्चिम से
  rationale: מַעֲרָב यहाँ सूर्यास्त की दिशा, अर्थात पश्चिम, को सूचित करता है।
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: समूची पृथ्वी के ऊपर से
  rationale: यह चयन पृथ्वी के पूरे विस्तार पर गति करने की इब्रानी छवि को बनाए रखता है और अगले उपवाक्य में धरती को न छूने के दृश्य से स्वाभाविक रूप से जुड़ता है।
- source_word: וְאֵין נוֹגֵעַ בָּאָרֶץ
  choice: पर वह धरती को छू नहीं रहा था
  rationale: यह मूल की असामान्य, अत्यंत तीव्र गति वाली दृश्यात्मक भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: קֶרֶן חָזוּת
  choice: एक साफ़ दिखाई देने वाला सींग
  rationale: קֶרֶן का सीधा अर्थ ‘सींग’ है। חָזוּת यहाँ उस सींग की दृश्य प्रमुखता या विशिष्टता बताता है; चुनी हुई अभिव्यक्ति उसके दिखाई देने पर बल देती है और वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: בֵּין עֵינָיו
  choice: उसकी आँखों के बीच
  rationale: यह स्थान-सूचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
theological_decisions:
- issue: दर्शन में पशु और सींग की प्रतीकात्मक छवि
  choice: ‘नर बकरा’ और ‘सींग’ की शाब्दिक दृश्य-छवि को बनाए रखना
  alternative: बाद के पदों की व्याख्या के आधार पर इन्हें सीधे किसी राज्य या शासक के रूप में अनूदित करना
  rationale: यह पद अभी दर्शन का प्रतीकात्मक दृश्य प्रस्तुत करता है और उसके अभिप्राय की पहचान बाद में करता है। यहाँ प्रतीकों की व्याख्या जोड़ना पाठ के क्रम को बदल देता और अनुवाद में व्याख्या मिला देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘तभी देखो’ दर्शन की जीवंतता बनाए रखता है; वाक्य में अनावश्यक व्याख्यात्मक शब्द नहीं जोड़े गए हैं।
