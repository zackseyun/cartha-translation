  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘बोलनेवाले’, ‘नियमित होमबलि’, ‘पवित्रस्थान’ और ‘रौंदे जाने’ जैसे शब्द मूल की संरचना तथा मंदिर-संबंधी प्रसंग को स्पष्ट रखते हैं। मुख्य प्रश्न को स्वाभाविक बनाने के लिए डैश और ‘अर्थात’ का प्रयोग किया गया है; सभी वैकल्पिक या अनिश्चित पाठ पादटिप्पणियों में सुरक्षित हैं।
