base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/013.yaml
  text: Then I heard a holy one speaking[a], and one holy one said to the one speaking, “How long is the vision concerning the regular burnt offering and the desolating transgression[d][c][b], and the giving over of both the sanctuary and the host to be trampled?”
translation:
  language: hi
  text: तब मैंने एक पवित्र जन को बोलते सुना, और एक पवित्र जन ने उस बोलनेवाले[a] से कहा, “नियमित होमबलि[b], उजाड़नेवाले अपराध[c], और पवित्रस्थान तथा सेना[d] को रौंदे जाने के लिए सौंपे जाने के विषय में यह दर्शन कब तक रहेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'दूसरा संभव अनुवाद: “पलमोनी नामक बोलनेवाले से,” यदि לַפַּלְמוֹנִי को अनिर्दिष्ट संकेत के बजाय नाम या उपाधि माना जाए।'
    reason: alternative_reading
  - marker: b
    text: 'परंपरागत अनुवाद: “नित्य बलिदान।” इब्रानी תָּמִיד मंदिर की उपासना में नियमित रूप से चढ़ाई जानेवाली निरंतर भेंट को सूचित करता है।'
    reason: lexical_alternative
  - marker: c
    text: 'या: “वह अपराध जो उजाड़ देता है।”'
    reason: lexical_alternative
  - marker: d
    text: “सेना” से पवित्रस्थान से जुड़े लोग, कोई सेना, अथवा कोई अन्य सामूहिक दल अभिप्रेत हो सकता है; यहाँ इब्रानी शब्द का संदर्भ पूरी तरह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָדוֹשׁ
  choice: पवित्र जन
  rationale: दर्शन के प्रसंग में यह विशेषण संज्ञा के रूप में किसी स्वर्गीय पवित्र प्राणी को सूचित करता है। ‘पवित्र जन’ मूल की व्यापकता बनाए रखता है और मुख्य पाठ में ‘स्वर्गदूत’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לַפַּלְמוֹנִי הַמְדַבֵּר
  choice: उस बोलनेवाले से
  rationale: לַפַּלְמוֹנִי दुर्बोध है और संभवतः किसी अनिर्दिष्ट अथवा विशिष्ट वार्ताकार का संकेत करता है। सहज हिन्दी के लिए इसे ‘उस बोलनेवाले से’ किया गया है; नाम या उपाधि ‘पलमोनी’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: הַתָּמִיד
  choice: नियमित होमबलि
  rationale: मंदिर की निरंतर नियमित भेंट अभिप्रेत है। ‘नियमित होमबलि’ परंपरागत ‘नित्य बलिदान’ से अधिक स्पष्ट है, जबकि प्रसंग से अधिक विवरण नहीं जोड़ता।
- source_word: הַפֶּשַׁע שֹׁמֵם
  choice: उजाड़नेवाला अपराध
  rationale: यह अनुवाद अपराध/विद्रोह और उसके उजाड़ उत्पन्न करनेवाले प्रभाव, दोनों को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: תֵּת
  choice: सौंप दिया जाना
  rationale: क्रिया के भाववाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और पवित्रस्थान तथा सेना-दल के अपवित्रीकरण हेतु सौंपे जाने को दिखाता है।
- source_word: קֹדֶשׁ
  choice: पवित्रस्थान
  rationale: मंदिर-दर्शन के प्रसंग में ठोस उपासना-स्थान अभिप्रेत है, न कि अमूर्त पवित्रता।
- source_word: צָבָא
  choice: सेना-दल
  rationale: यह शब्द सेना, समुदाय या स्वर्गीय दल को सूचित कर सकता है। ‘सेना-दल’ सामूहिक बल का अर्थ रखता है; वास्तविक संदर्भ की अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: מִרְמָס
  choice: रौंदे जाने के लिए
  rationale: मूल संज्ञा का भाव स्वाभाविक हिन्दी क्रियात्मक रचना में दिया गया है और अपवित्रीकरण का बोध बना रहता है।
theological_decisions:
- issue: ‘पवित्र जनों’ की पहचान
  choice: मुख्य पाठ में ‘पवित्र जन’, जो इस दर्शन में स्वर्गीय पवित्र प्राणी की ओर संकेत करता है
  alternative: मानवीय संत अथवा स्पष्ट रूप से ‘स्वर्गदूत’
  rationale: दर्शन का प्रसंग स्वर्गीय प्राणियों का समर्थन करता है, पर मूल में ‘स्वर्गदूत’ शब्द नहीं है; अतः अनुवाद मूल अभिव्यक्ति को बनाए रखता है।
- issue: צָבָא का संदर्भ
  choice: ‘सेना-दल’, बिना यह निश्चित किए कि वह कौन-सा दल है
  alternative: परमेश्वर की प्रजा; स्वर्गीय सेना; सांसारिक सेना
  rationale: इस पद में संदर्भ पूरी तरह निश्चित नहीं है। मुख्य पाठ इसे किसी एक धर्मवैज्ञानिक पहचान तक सीमित नहीं करता और पादटिप्पणी विकल्पों को सुरक्षित रखती है।
- issue: प्रश्न ‘कब तक’ का विस्तार
  choice: दर्शन और उसमें वर्णित अपवित्रीकरण की अवधि
  alternative: केवल नियमित होमबलि के हटाए जाने की अवधि
  rationale: वाक्य की पूरी समन्वित शृंखला प्रश्न के अधीन है; हिन्दी में ‘कब तक’ को अंत में दोहराकर इसका विस्तार स्पष्ट किया गया है, बिना घटनाओं के परस्पर संबंध को सिद्धान्तगत रूप से तय किए।
