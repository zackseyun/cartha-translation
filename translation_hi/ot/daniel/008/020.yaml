  text: הָ/אַ֥יִל אֲשֶׁר רָאִ֖יתָ בַּ֣עַל הַ/קְּרָנָ֑יִם מַלְכֵ֖י מָדַ֥י וּ/פָרָֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/020.yaml
  text: The ram that you saw[a], the one with the two horns, is the kings of Media and Persia.
translation:
  language: hi
  text: तुमने जिस मेढ़े को देखा था[a], जिसके दो सींग थे, वह मादै और फ़ारस के राजाओं का प्रतीक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “वह मेढ़ा जिसे तुमने देखा, दो सींगों का अधिकारी, मादै और फ़ारस के राजा [हैं]।”'
    reason: मूल इब्रानी की ‘अधिकारी’ वाली अभिव्यक्ति तथा क्रियारहित, एकवचन-बहुवचन संरचना दिखाने के लिए।
lexical_decisions:
- source_word: הָאַיִל
  choice: मेढ़ा
  rationale: אַיִל नर भेड़, अर्थात् मेढ़े, को दर्शाता है; दर्शन के इस प्रसंग में यही सटीक और स्वाभाविक हिन्दी शब्द है।
- source_word: אֲשֶׁר רָאִיתָ
  choice: तुमने जिस…को देखा था
  rationale: सम्बन्धवाचक אֲשֶׁר और Qal पूर्ण 2ms רָאִיתָ को स्वाभाविक हिन्दी सम्बन्धवाचक रचना और भूतकाल में व्यक्त किया गया है।
- source_word: בַּעַל הַקְּרָנַיִם
  choice: दो सींगों वाला
  rationale: בַּעַל का शाब्दिक अर्थ ‘स्वामी/अधिकारी’ है, पर इस गुणवाचक प्रयोग में इसका अर्थ ‘वाला’ है; קְּרָנַיִם द्विवचन होने के कारण ‘दो सींग’ किया गया है।
- source_word: מַלְכֵי
  choice: राजाओं
  rationale: מֶלֶךְ के बहुवचन construct रूप को सम्बन्धसूचक हिन्दी पदबंध ‘मादै और फ़ारस के राजाओं’ में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: מָדַי
  choice: मादै
  rationale: यह इस प्राचीन जाति/राज्य के लिए प्रचलित हिन्दी बाइबलीय नाम है और मूल इब्रानी नाम के निकट है।
- source_word: וּפָרָס
  choice: और फ़ारस
  rationale: וּ समुच्चयबोधक ‘और’ है और פָרָס का मानक आधुनिक हिन्दी नाम ‘फ़ारस’ है।
theological_decisions:
- issue: प्रतीक और उसके अभिप्राय के बीच क्रियारहित पहचान-वाक्य
  choice: राजाओं का प्रतीक है
  alternative: राजा हैं
  rationale: इब्रानी में स्पष्ट क्रिया नहीं है और एकवचन ‘मेढ़ा’ के बाद बहुवचन ‘राजा’ आते हैं। दर्शन की व्याख्या में ‘प्रतीक है’ इस संबंध को सहज हिन्दी में स्पष्ट करता है, जबकि शाब्दिक संरचना को पादटिप्पणी में सुरक्षित रखा गया है; इससे राजाओं की संख्या या पहचान के प्रश्न को अतिरिक्त रूप से नहीं सुलझाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दो सींगों वाला’ स्वाभाविक हिन्दी है, जबकि ‘मादै’ और ‘फ़ारस’ ऐतिहासिक नामों की पहचान बनाए रखते हैं।
