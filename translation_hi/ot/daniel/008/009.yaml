  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִן הָ/אַחַ֣ת מֵ/הֶ֔ם יָצָ֥א קֶֽרֶן אַחַ֖ת מִ/צְּעִירָ֑ה וַ/תִּגְדַּל יֶ֛תֶר אֶל הַ/נֶּ֥גֶב וְ/אֶל הַ/מִּזְרָ֖ח וְ/אֶל הַ/צֶּֽבִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/009.yaml
  text: And out of one of them came a small horn[a], and it grew exceedingly great toward the south, toward the east[b], and toward the Beautiful Land.
translation:
  language: hi
  text: और उनमें से एक से एक छोटा-सा सींग[a] निकला। वह दक्षिण, पूर्व और शोभायमान देश[b] की ओर अत्यन्त बढ़ता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक छोटा सींग।”
    reason: lexical_alternative
  - marker: b
    text: या “सुंदर देश” अथवा “मनोहर देश।” इब्रानी में यह एक वर्णनात्मक उपाधि है, जो संभवतः इस्राएल के देश को सूचित करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הָאַחַת מֵהֶם
  choice: और उनमें से एक में से
  rationale: दोनों מִן संबंधों को रखते हुए यह सींग के उन चार सींगों/दिशाओं में से एक से निकलने का स्रोत-संबंध व्यक्त करता है। इब्रानी में संदर्भ-सामंजस्य की कठिनाई को किसी निश्चित व्याख्या से नहीं सुलझाया गया।
- source_word: יָצָא
  choice: निकला
  rationale: क्रिया का मूल अर्थ बाहर निकलना है; सींग के उभरने के चित्र के लिए ‘निकला’ स्वाभाविक और सटीक है।
- source_word: קֶרֶן אַחַת מִצְּעִירָה
  choice: एक छोटा-सा सींग
  rationale: कֶרֶן के प्रतीकात्मक चित्र को बिना राजा या राज्य के रूप में समझाए रखा गया है; מִצְּעִירָה आरंभिक छोटेपन को दर्शाता है।
- source_word: וַתִּגְדַּל יֶתֶר
  choice: अत्यन्त बढ़ता गया
  rationale: גדל की वृद्धि और יתר की तीव्रता दोनों व्यक्त होती हैं। हिन्दी में सींग व्याकरणिक रूप से पुल्लिंग है, इसलिए क्रिया पुल्लिंग रखी गई है।
- source_word: אֶל הַנֶּגֶב
  choice: दक्षिण की ओर
  rationale: दिशाओं की इस शृंखला में נגב का दिशासूचक अर्थ ‘दक्षिण’ सर्वाधिक स्वाभाविक है।
- source_word: וְאֶל הַמִּזְרָח
  choice: पूर्व की ओर
  rationale: भौगोलिक दिशासूचक प्रयोग में מזרח का सामान्य अर्थ ‘पूर्व’ है।
- source_word: וְאֶל הַצְּבִי
  choice: शोभायमान देश की ओर
  rationale: צבי की शोभा, सुंदरता और मनोहरता की वर्णनात्मक शक्ति सुरक्षित रखी गई है; संभावित भौगोलिक संकेत को मुख्य पाठ में स्पष्ट पहचान में नहीं बदला गया।
theological_decisions:
- issue: प्रकाशनात्मक प्रतीक ‘सींग’ की पहचान
  choice: मुख्य पाठ में ‘सींग’ का प्रतीक ज्यों का त्यों रखा गया
  alternative: राजा, शक्ति या राज्य
  rationale: इब्रानी पाठ प्रतीक का प्रयोग करता है; उसकी व्याख्यात्मक पहचान जोड़ना अनुवाद की सीमा से आगे जाता।
- issue: הַצְּבִי का अर्थ और भौगोलिक संकेत
  choice: ‘शोभायमान देश’
  alternative: ‘सुंदर देश’, ‘मनोहर देश’, अथवा सीधे ‘इस्राएल देश’
  rationale: यह वर्णनात्मक उपाधि संभवतः इस्राएल के देश की ओर संकेत करती है, पर मुख्य पाठ में संकेत और उसकी काव्यात्मक अस्पष्टता दोनों सुरक्षित रखे गए हैं।
- issue: וּמִן הָאַחַת מֵהֶם में संदर्भ-सामंजस्य
  choice: रूपगत कठिनाई को ‘उनमें से एक में से’ द्वारा बनाए रखा
  alternative: ‘उनमें से एक से’ या संदर्भ को स्पष्ट करके ‘उन चार सींगों में से एक से’
  rationale: इब्रानी में הָאַחַת स्त्रीलिंग है, जबकि निकटवर्ती מֵהֶם पुल्लिंग बहुवचन है। अनुवाद ने इसे चुपचाप किसी एक निश्चित पूर्वपद से नहीं जोड़ा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘छोटा-सा सींग’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘शोभायमान देश’ इब्रानी की वर्णनात्मक उपाधि को किसी निश्चित व्याख्यात्मक नाम से बदले बिना बनाए रखता है।
