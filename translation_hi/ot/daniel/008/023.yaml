id: DAN.8.23
reference: Daniel 8:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּֽ/בְ/אַחֲרִית֙ מַלְכוּתָ֔/ם כְּ/הָתֵ֖ם הַ/פֹּשְׁעִ֑ים יַעֲמֹ֛ד מֶ֥לֶךְ עַז פָּנִ֖ים וּ/מֵבִ֥ין חִידֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/008/023.yaml
  text: And at the latter end of their kingdom[a], when the transgressors have reached their full measure, a king will arise, fierce in countenance and skilled in intrigue.
translation:
  language: hi
  text: और उनके राज्य के अंतिम काल में, जब विद्रोहियों का अपराध अपनी पूरी सीमा तक पहुँच जाएगा, तब एक कठोर मुख वाला और गूढ़ बातों को समझनेवाला[a] राजा उठ खड़ा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहेलियों को समझनेवाला” अथवा “गूढ़ कथनों को समझनेवाला।”
    reason: इब्रानी חִידוֹת पहेलियों या गूढ़/रहस्यमय कथनों का संकेत कर सकता है। यह पादटिप्पणी मुख्य पाठ की व्यापकता बनाए रखते हुए अधिक शाब्दिक विकल्प देती है।
lexical_decisions:
- source_word: וּבְאַחֲרִית מַלְכוּתָם
  choice: और उनके राज्य के अंतिम काल में
  rationale: אַחֲרִית किसी अवधि के अंतिम भाग या अंत को दर्शाता है। मַלְכוּתָם व्याकरणतः एकवचन है, इसलिए ‘उनके राज्य’ रखा गया है, न कि ‘उनके राज्यों’ को।
- source_word: כְּהָתֵם הַפֹּשְׁעִים
  choice: जब विद्रोही अपने अपराध की पूरी सीमा तक पहुँच जाएँगे
  rationale: תמם पूर्णता या चरम सीमा तक पहुँचने का भाव देता है। פשׁע में सामान्य पाप के साथ जानबूझकर किए गए विद्रोह या उल्लंघन का भाव है; इसलिए ‘विद्रोही’ चुना गया और पूर्णता का आशय स्वाभाविक हिन्दी में स्पष्ट किया गया।
- source_word: יַעֲמֹד מֶלֶךְ
  choice: तब ... राजा उठ खड़ा होगा
  rationale: राजकीय संदर्भ में עמד किसी शासक के उभरने या सत्ता के मंच पर आने को व्यक्त कर सकता है। ‘उठ खड़ा होगा’ मूल क्रिया की छवि और प्रसंगगत अर्थ दोनों को बनाए रखता है।
- source_word: עַז פָּנִים
  choice: कठोर मुखवाला
  rationale: शाब्दिक अर्थ ‘मुख से प्रबल/कठोर’ है और मुहावरा धृष्ट, कठोर या उग्र स्वभाव का संकेत देता है। ‘कठोर मुखवाला’ चेहरे की मूल छवि को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: וּמֵבִין חִידוֹת
  choice: और गूढ़ बातों को समझनेवाला
  rationale: חידות पहेलियों, गूढ़ कथनों या रहस्यमय बातों को सूचित कर सकता है। यह चयन मूल की व्यापक अस्पष्टता बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है; राजनीतिक चालाकी वाला संभावित आशय पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: וּמֵבִין חִידוֹת का अर्थ
  choice: गूढ़ बातों को समझनेवाला
  alternative: पहेलियों को समझनेवाला; अथवा षड्यंत्रकारी युक्तियों में निपुण
  rationale: इब्रानी पदबंध बौद्धिक रूप से गूढ़ कथनों को समझने और व्यावहारिक कपटपूर्ण चतुराई—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में अपेक्षाकृत निकट और व्यापक अर्थ रखा गया है तथा राजनीतिक-कपटपूर्ण अर्थ को निश्चित बनाकर पाठ पर आरोपित नहीं किया गया।
- issue: כְּהָתֵם הַפֹּשְׁעִים में पूर्णता का आशय
  choice: विद्रोही अपने अपराध की पूरी सीमा तक पहुँच जाएँगे
  alternative: विद्रोहियों का अंत हो जाएगा
  rationale: यहाँ पूर्ण होने का भाव उनके अस्तित्व की समाप्ति से अधिक उनके विद्रोह या अपराध के परिपूर्ण होने की ओर संकेत करता है। चयन इस भेद को स्पष्ट करता है, पर किसी विशिष्ट अंत-समय संबंधी व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अंतिम काल’, ‘कठोर मुखवाला’ और ‘गूढ़ बातें’ मूल की कालगत, दृश्यात्मक और अर्थगत विशेषताओं को सुरक्षित रखते हैं; वाक्य में ‘तब’ जोड़कर लम्बी कालसूचक संरचना को हिन्दी में स्पष्ट बनाया गया है।
