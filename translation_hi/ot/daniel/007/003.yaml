id: DAN.7.3
reference: Daniel 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַרְבַּ֤ע חֵיוָן֙ רַבְרְבָ֔ן סָלְקָ֖ן מִן יַמָּ֑/א שָׁנְיָ֖ן דָּ֥א מִן דָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/003.yaml
  text: And four great beasts were coming up from the sea[a], different from one another.
translation:
  language: hi
  text: और चार विशाल पशु समुद्र से[a] ऊपर आ रहे थे; वे एक-दूसरे से भिन्न थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘समुद्र में से।’
    reason: मूल अरामी में מִן यַמָּא का अर्थ ‘समुद्र से’ है; सन्दर्भ में ‘समुद्र में से’ उद्भव/बाहर आने की स्थानगत बारीकी को भी व्यक्त करता है।
lexical_decisions:
- source_word: וְ/אַרְבַּע
  choice: और चार
  rationale: सरल संयोजक और संख्या को ज्यों का त्यों रखते हुए यह दर्शन के अगले दृश्य को स्वाभाविक ढंग से जोड़ता है।
- source_word: חֵיוָן
  choice: पशु
  rationale: अरामी शब्द जीवित प्राणियों या पशुओं को दर्शाता है; इस दर्शनीय और भयावह संदर्भ में ‘पशु’ स्वाभाविक है और बाद की व्याख्या को पद में नहीं जोड़ता।
- source_word: רַבְרְבָן
  choice: विशाल
  rationale: यह बहुवचन विशेषण बड़े आकार या महानता का भाव देता है। ‘विशाल’ आधुनिक हिन्दी में इन पशुओं के असाधारण आकार और प्रभाव को स्पष्ट करता है।
- source_word: סָלְקָן
  choice: निकल रहे थे
  rationale: क्रिया का रूप दर्शन में जारी ऊपर आने की क्रिया दिखाता है। समुद्र के साथ हिन्दी में ‘निकल रहे थे’ स्वाभाविक है और उद्गम तथा गति दोनों को व्यक्त करता है।
- source_word: מִן יַמָּא
  choice: समुद्र से
  rationale: מִן स्रोत या भीतर से बाहर आने का अर्थ दे सकता है। मुख्य पाठ में संक्षिप्त ‘समुद्र से’ रखा गया है और अधिक स्पष्ट स्थानगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: שָׁנְיָן
  choice: भिन्न
  rationale: यहाँ शब्द परस्पर अलग होने का अर्थ देता है। ‘भिन्न’ स्पष्ट, गरिमापूर्ण और तुलना के इस वाक्य-विन्यास में स्वाभाविक है।
- source_word: דָּא מִן דָּא
  choice: एक-दूसरे से
  rationale: यह अरामी मुहावरा चारों पशुओं के परस्पर भिन्न होने को व्यक्त करता है; ‘एक-दूसरे से’ उसका सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: दर्शनीय संदर्भ में חֵיוָן का प्रतीकात्मक प्रभाव
  choice: तटस्थ ‘जीवित प्राणी’ के बजाय ‘पशु’
  alternative: जीवित प्राणी; जानवर
  rationale: आगे ये आकृतियाँ राजाओं या राज्यों से संबंधित प्रतीकों के रूप में समझाई जाती हैं। ‘पशु’ उनके भयावह दर्शनीय प्रभाव को बनाए रखता है, पर उस बाद की व्याख्या को इस पद में स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनीय वर्णन के अनुकूल भाषा। ‘निकल रहे थे’ जारी क्रिया को व्यक्त करता है; अर्धविराम अंतिम परस्पर-विभिन्नता को स्पष्ट रूप से जोड़ता है।
