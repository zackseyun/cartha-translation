reference: Daniel 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נְהַ֣ר דִּי נ֗וּר נָגֵ֤ד וְ/נָפֵק֙ מִן קֳדָמ֔וֹ/הִי אֶ֤לֶף אלפים יְשַׁמְּשׁוּנֵּ֔/הּ וְ/רִבּ֥וֹ רבון קָֽדָמ֣וֹ/הִי יְקוּמ֑וּן דִּינָ֥/א יְתִ֖ב וְ/סִפְרִ֥ין פְּתִֽיחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/010.yaml
  text: A river of fire was flowing and coming out from before him[a]; a thousand thousands were serving him, and ten thousand times ten thousand were standing before him. The court sat[c][b], and the books were opened.
translation:
  language: hi
  text: आग की एक नदी बहती हुई उसके सामने से निकल रही थी; हज़ार गुणा हज़ार उसकी सेवा कर रहे थे, और दस हज़ार गुना दस हज़ार उसके सामने खड़े थे। न्याय-सभा बैठी[a], और पुस्तकें खोली गईं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “न्याय बैठा”; यह वाक्य न्याय करने के लिए स्वर्गीय न्याय-सभा के बैठने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “लिखित अभिलेख खोले गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהַר דִּי נוּר
  choice: आग की एक नदी
  rationale: अरामी पदबंध का स्वाभाविक हिन्दी रूप; ‘नदी’ दृश्य की विशालता और सजीवता बनाए रखता है।
- source_word: נָגֵד וְנָפֵק
  choice: बहती हुई ... निकल रही थी
  rationale: दोनों कृदन्त जारी क्रिया का चित्र देते हैं; हिन्दी का अपूर्ण भूतकाल इस गतिशीलता को सुरक्षित रखता है।
- source_word: מִן קֳדָמוֹהִי
  choice: उसके सामने से
  rationale: मूल की स्थानवाची छवि को बनाए रखता है और इसे केवल अमूर्त ‘उपस्थिति’ नहीं बनाता।
- source_word: אֶלֶף אלפים
  choice: हज़ारों-हज़ार
  rationale: मूल की आवृत्तिमूलक विशाल संख्या को सहज, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְשַׁמְּשׁוּנֵּהּ
  choice: उसकी सेवा कर रहे थे
  rationale: क्रिया का सामान्य अर्थ सेवा या परिचर्या करना है; यह दरबारी उपस्थिति को व्यक्त करता है, बिना किसी विशेष अनुष्ठानिक अर्थ को आरोपित किए।
- source_word: וְרִבּוֹ רבון
  choice: दस हज़ार गुना दस हज़ार
  rationale: संख्यात्मक बिंब को बनाए रखता है और असंख्य स्वर्गीय सेवकों की भव्यता को स्पष्ट करता है।
- source_word: קָדָמוֹהִי יְקוּמוּן
  choice: उसके सामने खड़े थे
  rationale: न्याय-दरबार के प्रसंग में ‘खड़े थे’ सेवा और उपस्थिति दोनों का स्वाभाविक संकेत देता है।
- source_word: דִּינָא יְתִב
  choice: न्याय-सभा बैठी
  rationale: शाब्दिक ‘न्याय बैठा’ अरामी न्यायिक मुहावरा है; ‘न्याय-सभा बैठी’ हिन्दी में न्यायालय के कार्यारम्भ को स्पष्ट रखते हुए मूल बिंब के निकट है।
- source_word: וְסִפְרִין פְּתִיחוּ
  choice: और पुस्तकें खोली गईं
  rationale: סִפְרִין लिखित पुस्तकों या अभिलेखों को सूचित कर सकता है; ‘पुस्तकें’ व्यापक और पारंपरिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: דִּינָא יְתִב का न्यायिक मुहावरा
  choice: न्याय-सभा बैठी
  alternative: न्याय बैठा; न्यायालय ने आसन ग्रहण किया
  rationale: चुना हुआ रूप स्वर्गीय न्यायिक सभा के बैठने का आशय स्पष्ट करता है, पर न्याय के स्वरूप या परिणाम के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: स्वर्गीय सेवकों की संख्याएँ
  choice: हज़ारों-हज़ार ... दस हज़ार गुना दस हज़ार
  alternative: एक हज़ार हज़ार ... असंख्य असंख्य
  rationale: यह मूल के संख्यात्मक और आवृत्तिमूलक बिंबों को बनाए रखता है; उन्हें न तो सटीक गणना घोषित करता है, न केवल सामान्य ‘असंख्य’ में समतल करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘हज़ारों-हज़ार’ और ‘दस हज़ार गुना दस हज़ार’ मूल की काव्यात्मक विशालता बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
