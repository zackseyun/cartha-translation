reference: Daniel 7:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַל קַרְנַיָּ֤/א עֲשַׂר֙ דִּ֣י בְ/רֵאשַׁ֔/הּ וְ/אָחֳרִי֙ דִּ֣י סִלְקַ֔ת ו/נפלו מִן קדמי/ה תְּלָ֑ת וְ/קַרְנָ֨/א דִכֵּ֜ן וְ/עַיְנִ֣ין לַ֗/הּ וְ/פֻם֙ מְמַלִּ֣ל רַבְרְבָ֔ן וְ/חֶזְוַ֖/הּ רַ֥ב מִן חַבְרָתַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/020.yaml
  text: and about the ten horns that were on its head[a], and the other horn that came up, before which three fell—the horn that had eyes and a mouth speaking great things, and whose appearance was greater than that of its companions.
translation:
  language: hi
  text: और उसके सिर पर के दस सींगों के विषय में, और उस दूसरे सींग के विषय में जो निकल आया था और जिसके सामने तीन सींग गिर गए थे—उस सींग के विषय में जिसकी आँखें थीं और जिसका एक मुँह बड़ी-बड़ी बातें बोलता था[a], और जिसका रूप उसके साथी सींगों से बड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घमंड की बातें बोलता था”; अथवा, “बड़ी-बड़ी डींगें हाँकता था।”
    reason: רַבְרְבָן का शाब्दिक भाव ‘बड़ी बातें’ है, जबकि प्रसंग में अहंकारी या डींगपूर्ण वाणी का भाव भी संभव है।
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: दस सींग
  rationale: अरामी बहुवचन संज्ञा और संख्या का सीधा अनुवाद है। दर्शन के प्रतीकात्मक चित्र को बिना उसकी व्याख्या किए सुरक्षित रखा गया है।
- source_word: בְרֵאשַׁהּ
  choice: उसके सिर पर
  rationale: ב उपसर्ग, ‘सिर’ और स्त्रीलिंग एकवचन प्रत्यय उस पशु की ओर संकेत करते हैं; यह हिन्दी में स्वाभाविक और स्थान-सूचक है।
- source_word: אָחֳרִי דִּי סִלְקַת
  choice: उस दूसरे सींग ... जो निकल आया था
  rationale: אָחֳרִי पहले बताए गए दस सींगों से भेद करता है और סִלְקַת उसके उभरने का दृश्यात्मक भाव देता है। ‘निकल आया’ समय या पहचान के विषय में अनावश्यक व्याख्या जोड़े बिना चित्र को बनाए रखता है।
- source_word: וּנְפַלּוּ מִן־קֳדָמַהּ תְּלָת
  choice: जिसके सामने तीन सींग गिर गए थे
  rationale: सापेक्ष उपवाक्य उसी सींग का वर्णन करता है। मूल में ‘तीन’ के बाद संज्ञा निहित है; हिन्दी में अर्थ की स्पष्टता के लिए ‘सींग’ जोड़ा गया है। ‘सामने’ उपस्थिति अथवा उसके आगे गिरने—दोनों संभावित भावों को खुला रखता है।
- source_word: וְעַיְנִין לַהּ
  choice: जिसकी आँखें थीं
  rationale: सींग की असाधारण दृश्यात्मक विशेषता को सरल और सजीव हिन्दी में व्यक्त किया गया है।
- source_word: וְפֻם מְמַלִּל רַבְרְבָן
  choice: जिसका एक मुँह बड़ी-बड़ी बातें बोलता था
  rationale: רַבְרְבָן का मूल अर्थ ‘बड़ी बातें’ है। ‘बड़ी-बड़ी बातें’ हिन्दी में स्वाभाविक है और संदर्भ में घमंड का संकेत दे सकती है, पर मुख्य पाठ में उसे स्पष्ट रूप से ‘डींगें’ बनाकर अर्थ सीमित नहीं करती।
- source_word: וְחֶזְוַהּ רַב מִן חַבְרָתַהּ
  choice: जिसका रूप उसके साथी सींगों से बड़ा था
  rationale: חֶזְוַהּ दृश्य रूप या स्वरूप को और רַב तुलनात्मक बड़ाई को व्यक्त करता है। ‘बड़ा’ आकार, महत्त्व या प्रभाव की वास्तविक अस्पष्टता को बनाए रखता है; ‘साथी सींगों’ से संबंधित अन्य सींग स्पष्ट होते हैं।
theological_decisions:
- issue: רַבְרְבָן को शाब्दिक ‘बड़ी-बड़ी बातें’ या व्याख्यात्मक ‘घमंड की बातें/डींगें’ के रूप में देना
  choice: बड़ी-बड़ी बातें
  alternative: घमंड की बातें; बड़ी-बड़ी डींगें
  rationale: तात्कालिक अरामी शब्दावली स्पष्ट रूप से ‘बड़ी बातें’ कहती है। व्यापक संदर्भ अहंकारी या डींगपूर्ण वाणी का समर्थन करता है, फिर भी मुख्य पाठ स्रोत की कम स्पष्ट अभिव्यक्ति को सुरक्षित रखता है और व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
- issue: רַב को केवल शारीरिक आकार या प्रभावशाली स्वरूप मानना
  choice: बड़ा
  alternative: अधिक विशाल; अधिक प्रभावशाली
  rationale: अरामी विशेषण आकार, महत्त्व या प्रमुखता का भाव दे सकता है। सामान्य हिन्दी ‘बड़ा’ इस बहुअर्थकता को व्याख्यात्मक रूप से सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और दृश्यात्मक रूप अपनाया गया है। पद पिछले वाक्य से जुड़ी विषय-सूची है, इसलिए आरम्भिक ‘और ... के विषय में’ तथा बाद की पुनरुक्ति को रखा गया है। पादटिप्पणी चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
