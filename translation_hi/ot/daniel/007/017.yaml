  text: These great beasts[a], which are four, are four kings who will arise from the earth.
translation:
  language: hi
  text: ये बड़े पशु, जो चार हैं, चार राजा हैं जो पृथ्वी[a] से उभरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि” अथवा “देश।” अरामी शब्द אַרְעָא का अर्थ “पृथ्वी,” “भूमि” या “देश” हो सकता है; इस अध्याय के व्यापक दर्शनात्मक संदर्भ के कारण यहाँ “पृथ्वी” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִלֵּין
  choice: ये
  rationale: बहुवचन संकेतवाचक शब्द निकट संदर्भ में अभी देखे गए पशुओं की ओर संकेत करता है।
- source_word: חֵיוָתָא
  choice: पशु
  rationale: दर्शन के प्रतीकात्मक और भयावह संदर्भ में ‘पशु’ स्वाभाविक है तथा तटस्थ ‘जानवर’ की अपेक्षा मूल का प्रभाव बेहतर बनाए रखता है।
- source_word: רַבְרְבָתָא
  choice: बड़े
  rationale: यह विशेषण आकार या महत्ता, दोनों का बोध करा सकता है; ‘बड़े’ इस अर्थ-विस्तार को सहज हिन्दी में बनाए रखता है।
- source_word: דִּי אִנִּין אַרְבַּע
  choice: जो चार हैं
  rationale: यह मूल की संबंधवाचक रचना और पशुओं की संख्या को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: אַרְבְּעָה מַלְכִין
  choice: चार राजा
  rationale: मूल में स्पष्ट रूप से ‘राजा’ हैं, ‘राज्य’ नहीं; इसलिए प्रतीक की संभावित व्यापक व्याख्या को मुख्य पाठ में नहीं मिलाया गया।
- source_word: יְקוּמוּן
  choice: उभरेंगे
  rationale: क्रिया का मूल भाव उठने या खड़े होने का है; शासकों के प्रकट होने के भविष्यसूचक संदर्भ में ‘उभरेंगे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מִן אַרְעָא
  choice: पृथ्वी से
  rationale: אַרְעָא का अर्थ ‘पृथ्वी’ या ‘भूमि/देश’ हो सकता है। अध्याय के व्यापक दर्शनात्मक परिप्रेक्ष्य में ‘पृथ्वी’ को मुख्य पाठ में रखा गया और विकल्प को पादटिप्पणी में सुरक्षित किया गया।
theological_decisions:
- issue: प्रतीकात्मक भाषा में ‘चार राजाओं’ का संदर्भ
  choice: मुख्य पाठ में मूल के स्पष्ट शब्द ‘चार राजा’ को बनाए रखना
  alternative: व्याख्यात्मक रूप से ‘चार राज्य’ अनुवाद करना
  rationale: अरामी पाठ מַלְכִין अर्थात ‘राजा’ कहता है। निकट संदर्भ में राजा राज्यों का प्रतिनिधित्व कर सकते हैं, पर अनुवाद में ‘राज्य’ रख देने से मूल की शब्दावली और उसकी व्याख्यात्मक तनावशीलता समय से पहले हल हो जाएगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ये बड़े पशु, जो चार हैं’ मूल की व्याख्यात्मक संरचना को बनाए रखता है, जबकि ‘उभरेंगे’ भविष्य में शासकों के प्रकट होने का भाव स्वाभाविक हिन्दी में देता है। पादटिप्पणी का चिह्न उसी शब्द ‘पृथ्वी’ के बाद रखा गया है जिससे वह संबंधित है।
