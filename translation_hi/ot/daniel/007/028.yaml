id: DAN.7.28
reference: Daniel 7:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד כָּ֖ה סוֹפָ֣/א דִֽי מִלְּתָ֑/א אֲנָ֨ה דָֽנִיֵּ֜אל שַׂגִּ֣יא רַעְיוֹנַ֣/י יְבַהֲלֻנַּ֗/נִי וְ/זִיוַ/י֙ יִשְׁתַּנּ֣וֹן עֲלַ֔/י וּ/מִלְּתָ֖/א בְּ/לִבִּ֥/י נִטְרֵֽת־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/028.yaml
  text: This is the end of the matter[a]. As for me, Daniel, my thoughts greatly terrified me, and my appearance changed because of it[b]; but I kept the matter in my heart.
translation:
  language: hi
  text: यहीं इस बात का अंत है[a]। मैं, दानिय्येल, अपने विचारों से बहुत घबरा गया, और मेरा रूप बदल गया[b]; पर मैंने इस बात को अपने हृदय में रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यहीं इस बात का निष्कर्ष है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मेरा मुखमंडल बदल गया’ अथवा ‘मेरी चमक बदल गई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד כָּה
  choice: यहाँ
  rationale: यह अरामी पदबंध विवरण के समाप्ति-बिंदु को सूचित करता है। ‘यहाँ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: סוֹפָא דִי מִלְּתָא
  choice: इस बात का अन्त
  rationale: סוֹפָא का सीधा अर्थ ‘अन्त’ और מִלְּתָא का प्रसंगानुसार अर्थ ‘बात/विषय’ है; दर्शन-विवरण की समाप्ति यहाँ अभिप्रेत है।
- source_word: אֲנָה דָנִיֵּאל
  choice: मुझ दानिय्येल को
  rationale: स्वतंत्र सर्वनाम और नाम के बलाघात को हिन्दी की स्वाभाविक वाक्य-रचना में बनाए रखता है।
- source_word: שַׂגִּיא רַעְיוֹנַי יְבַהֲלֻנַּנִי
  choice: मेरे विचारों ने बहुत भयभीत कर दिया
  rationale: שַׂגִּיא तीव्रता व्यक्त करता है, רַעְיוֹן विचार को और בהל प्रबल घबराहट या भय को; यह अनुवाद तीनों का स्वाभाविक संयोजन है।
- source_word: וְזִיוַי יִשְׁתַּנּוֹן עֲלַי
  choice: और मेरे चेहरे का रंग बदल गया
  rationale: זִיו में चमक, मुखाकृति या बाहरी रूप का अर्थ-सामर्थ्य है। हिन्दी मुहावरा ‘चेहरे का रंग बदल गया’ दृश्य शारीरिक परिवर्तन को स्वाभाविक रूप से व्यक्त करता है, जबकि पाद-टिप्पणी मूल की व्यापकता सुरक्षित रखती है।
- source_word: וּמִלְּתָא
  choice: फिर भी मैंने इस बात को
  rationale: ו यहाँ दानिय्येल की बाहरी व्याकुलता और उसके भीतर बात को सुरक्षित रखने के बीच विरोधसूचक सम्बन्ध व्यक्त कर सकता है; ‘फिर भी’ उसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: בְּלִבִּי נִטְרֵת
  choice: अपने हृदय में रखा
  rationale: ‘हृदय’ मूल बाइबलीय मानव-विज्ञान की भाषा बनाए रखता है, और ‘रखा’ נטר के सुरक्षित रखने के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּלִבִּי में मनुष्य के भीतरी अस्तित्व की भाषा
  choice: अपने हृदय में
  alternative: अपने मन में
  rationale: ‘हृदय’ मूल की देहात्मक और धर्मवैचारिक भाषा को बनाए रखता है तथा अर्थ को केवल बौद्धिक स्मरण तक सीमित नहीं करता।
- issue: זִיוַי का अर्थ
  choice: मेरे चेहरे का रंग
  alternative: मेरा रूप / मेरी मुखाकृति / मेरी चमक
  rationale: प्रसंग दानिय्येल पर पड़े दृश्य प्रभाव की ओर संकेत करता है, पर मूल शब्द की ‘रूप’ और ‘चमक’ सम्बन्धी अर्थ-व्याप्ति को पाद-टिप्पणी में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सामान्य पाठक के लिए सहज शैली। ‘अन्त’ और ‘हृदय’ मूल की बाइबलीय भाषा को बनाए रखते हैं; अरामी זִיו की वास्तविक अर्थगत व्यापकता पाद-टिप्पणी में सुरक्षित है।
