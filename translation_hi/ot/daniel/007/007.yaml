source:
  edition: WLC
  text: בָּאתַ֣ר דְּנָה֩ חָזֵ֨ה הֲוֵ֜ית בְּ/חֶזְוֵ֣י לֵֽילְיָ֗/א וַ/אֲר֣וּ חֵיוָ֣ה רביעיה דְּחִילָה֩ וְ/אֵֽימְתָנִ֨י וְ/תַקִּיפָ֜א יַתִּ֗ירָא וְ/שִׁנַּ֨יִן דִּֽי פַרְזֶ֥ל לַ/הּ֙ רַבְרְבָ֔ן אָֽכְלָ֣ה וּ/מַדֱּקָ֔ה וּ/שְׁאָרָ֖/א ב/רגלי/ה רָפְסָ֑ה וְ/הִ֣יא מְשַׁנְּיָ֗ה מִן כָּל חֵֽיוָתָ/א֙ דִּ֣י קָֽדָמַ֔י/הּ וְ/קַרְנַ֥יִן עֲשַׂ֖ר לַֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/007.yaml
  text: After this I kept looking in the visions of the night[a], and behold, a fourth beast, terrifying and dreadful and exceedingly strong. It had large iron teeth; it devoured and crushed, and it trampled the remainder with its feet. It was different from all the beasts that were before it[b], and it had ten horns.
translation:
  language: hi
  text: इसके बाद मैं रात के दर्शनों में देखता रहा, और देखो, एक चौथा पशु था—भयावह, भयानक और अत्यन्त शक्तिशाली। उसके लोहे के बड़े-बड़े दाँत थे। वह निगलता और चूर-चूर करता था, और जो बच जाता, उसे अपने पैरों से रौंद डालता था। वह उन सब पशुओं से भिन्न था जो उससे पहले थे, और उसके दस सींग थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: इसके बाद
  rationale: दर्शन के अगले दृश्य की कालक्रमिक शुरुआत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חָזֵה הֲוֵית
  choice: मैं ... देखता रहा
  rationale: कृदन्त और सहायक क्रिया की भूतकालीन निरन्तरता को बनाए रखता है।
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: रात के दर्शनों में
  rationale: अरामी संबंध-वाक्यांश और रात्रिकालीन दर्शनीय परिवेश को निकट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַאֲרוּ
  choice: और देखो
  rationale: दृश्य में अचानक प्रकट होने वाली बात की ओर ध्यान खींचने वाले सूचक को सुरक्षित रखता है।
- source_word: חֵיוָה רביעיה
  choice: एक चौथा पशु
  rationale: दानिय्येल 7 की प्रतीकात्मक पशु-छवि के अनुरूप है; किसी विशिष्ट साम्राज्य की पहचान अनुवाद में नहीं जोड़ी गई।
- source_word: דְּחִילָה וְאֵימְתָנִי
  choice: भयावह, भयानक
  rationale: दोनों निकटार्थक विशेषणों की संचयी तीव्रता को अलग-अलग शब्दों से बनाए रखता है।
- source_word: וְתַקִּיפָא יַתִּירָא
  choice: अत्यन्त शक्तिशाली
  rationale: विशेष बल और तीव्रता को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְשִׁנַּיִן דִּי פַרְזֶל לַהּ רַבְרְבָן
  choice: उसके लोहे के बड़े-बड़े दाँत थे
  rationale: दाँतों की सामग्री और विशाल आकार, दोनों को सहज हिन्दी क्रम में रखता है।
- source_word: אָכְלָה וּמַדֱּקָה
  choice: वह खाता और चूर-चूर करता था
  rationale: पशु-छवि तथा हिंसक विनाश को बनाए रखते हुए क्रियाओं की अपूर्ण, निरन्तर प्रकृति व्यक्त करता है।
- source_word: וּשְׁאָרָא בְרגליה רָפְסָה
  choice: जो बच जाता उसे अपने पैरों से रौंद डालता था
  rationale: שְׁאָרָא को प्रसंगानुसार बचे हुए अंश के रूप में स्वाभाविक हिन्दी में व्यक्त करता और रौंदने की हिंसक शक्ति बनाए रखता है।
- source_word: מְשַׁנְּיָה
  choice: भिन्न था
  rationale: अन्य पशुओं की तुलना में उसके अलग प्रकार के होने को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: קַרְנַיִן עֲשַׂר
  choice: दस सींग
  rationale: प्रतीकात्मक विवरण को सीधे रखता है और उसका अर्थ अनुवाद के भीतर निर्धारित नहीं करता।
theological_decisions:
- issue: चौथे पशु की ऐतिहासिक या युगान्त-संबंधी पहचान
  choice: पद में उसे केवल प्रतीकात्मक ‘चौथा पशु’ कहा गया है।
  alternative: उसे रोम, हेलेनवादी साम्राज्य या किसी भावी संयुक्त राज्य के रूप में अनुवाद में पहचानना।
  rationale: मूल पद पशु का रूप, उसकी विनाशकारी शक्ति और भिन्नता बताता है, पर राज्य का नाम नहीं देता; इसलिए संभावित व्याख्याओं के बीच का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘दर्शन’, ‘पशु’ और ‘सींग’ जैसी स्थापित बाइबलीय शब्दावली रखी गई है। निकटार्थक भय-सूचक विशेषणों को जानबूझकर दोहरा कर मूल की तीव्रता सुरक्षित रखी गई है।
