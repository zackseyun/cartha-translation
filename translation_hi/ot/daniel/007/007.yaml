review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal transition, Daniel’s continuing vision, the fourth beast, its paired fearfulness, exceptional strength, iron teeth, destructive actions, distinctiveness, and ten horns. However, “दिखाई दिया” adds an explicit appearance verb not present in the Aramaic; וַאֲרוּ is better represented by the attention-directing “देखो.” “खाता” is possible, but “निगलता” more clearly conveys the destructive force of אָכְלָה in this beast imagery.
  naturalness: The register is generally clear and suitably elevated. Revising the opening to “एक चौथा पशु था” makes the Hindi syntax complete without adding the appearance event. “निगलता” is more idiomatic and vivid than “खाता” in this context.
  terminology: “दर्शन,” “पशु,” “लोहे के ... दाँत,” and “सींग” are appropriate established biblical Hindi terms. The paired “भयावह, भयानक” legitimately retains the source’s cumulative terror language without imposing an interpretation.
  issues:
  - severity: low
    issue: “दिखाई दिया” introduces an explicit appearance verb.
    rationale: The source says “and behold, a fourth beast,” using a deictic marker rather than stating that the beast appeared. Hindi can express this naturally with “और देखो, एक चौथा पशु था.”
  - severity: low
    issue: “वह खाता ... था” understates the predatory destructive nuance.
    rationale: Although literally defensible, “निगलता” better communicates the force of the beast-image and aligns with “devoured,” while preserving the source meaning.
  revised_text: इसके बाद मैं रात के दर्शनों में देखता रहा, और देखो, एक चौथा पशु था—भयावह, भयानक और अत्यन्त शक्तिशाली। उसके लोहे के बड़े-बड़े दाँत थे। वह निगलता और चूर-चूर करता था, और जो बच जाता, उसे अपने पैरों से रौंद डालता था। वह उन सब पशुओं से भिन्न था जो उससे पहले थे, और उसके दस सींग थे।
