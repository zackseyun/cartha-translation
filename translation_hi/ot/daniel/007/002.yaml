source:
  edition: WLC
  text: עָנֵ֤ה דָנִיֵּאל֙ וְ/אָמַ֔ר חָזֵ֥ה הֲוֵ֛ית בְּ/חֶזְוִ֖/י עִם לֵֽילְיָ֑/א וַ/אֲר֗וּ אַרְבַּע֙ רוּחֵ֣י שְׁמַיָּ֔/א מְגִיחָ֖ן לְ/יַמָּ֥/א רַבָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/002.yaml
  text: Daniel answered and said[a], “I was seeing in my vision by night, and behold, the four winds of heaven were stirring up the great sea.”
translation:
  language: hi
  text: दानिय्येल ने उत्तर दिया और कहा, “मैं रात में अपने दर्शन में देख रहा था, और देखो, आकाश की चार हवाएँ[a] बड़े समुद्र को मथ रही थीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश की चार आत्माएँ।” अरामी शब्द का अर्थ “हवाएँ” या “आत्माएँ” दोनों हो सकता है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर दिया और कहा
  rationale: अरामी कथन-सूत्र की संरचना सुरक्षित रखता है, भले ही इससे पहले कोई प्रश्न न हो।
- source_word: חָזֵה הֲוֵית
  choice: देख रहा था
  rationale: कृदंत और सहायक क्रिया से व्यक्त भूतकालीन जारी क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בְּחֶזְוִי
  choice: अपने दर्शन में
  rationale: एकवचन और प्रथम-पुरुष प्रत्यय को स्पष्ट रूप से व्यक्त करता है।
- source_word: עִם לֵילְיָא
  choice: रात में
  rationale: दर्शन के समय को आधुनिक और सहज हिन्दी में बताता है।
- source_word: וַאֲרוּ
  choice: और देखो
  rationale: आगे आने वाले दृश्य की ओर ध्यान खींचने वाली सजीव, दर्शनीय शैली को बनाए रखता है।
- source_word: אַרְבַּע רוּחֵי שְׁמַיָּא
  choice: आकाश की चार हवाएँ
  rationale: समुद्र को आंदोलित करने वाले तत्काल संदर्भ में ‘हवाएँ’ प्रमुख अर्थ है; ‘आत्माएँ’ की वास्तविक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: מְגִיחָן
  choice: मथ रही थीं
  rationale: समुद्र पर बलपूर्वक क्रिया करती हवाओं और उनके द्वारा जल में मचाई जा रही हलचल को संक्षिप्त, चित्रात्मक हिन्दी में व्यक्त करता है।
- source_word: לְיַמָּא רַבָּא
  choice: विशाल समुद्र
  rationale: विशेषण ‘विशाल’ सहित पद का सीधा अर्थ देता है और किसी निश्चित भौगोलिक पहचान को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: सर्वनामी संज्ञा רוּחֵי का इस प्रकाशनात्मक दर्शन में अर्थ
  choice: मुख्य पाठ में ‘हवाएँ’
  alternative: ‘आत्माएँ’
  rationale: समुद्र को मथने का दृश्य ‘हवाएँ’ अर्थ का समर्थन करता है, पर अरामी शब्द ‘आत्माएँ’ भी दर्शा सकता है। प्रतीकात्मक और आत्मिक अर्थ-संभावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उत्तर दिया और कहा’ मूल अरामी कथन-सूत्र की औपचारिकता को बनाए रखता है, जबकि ‘देख रहा था’ दर्शन की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
