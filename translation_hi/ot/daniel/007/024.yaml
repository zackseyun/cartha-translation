  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/קַרְנַיָּ֣/א עֲשַׂ֔ר מִנַּ/הּ֙ מַלְכוּתָ֔/ה עַשְׂרָ֥ה מַלְכִ֖ין יְקֻמ֑וּן וְ/אָחֳרָ֞ן יְק֣וּם אַחֲרֵי/ה֗וֹן וְ/ה֤וּא יִשְׁנֵא֙ מִן קַדְמָיֵ֔/א וּ/תְלָתָ֥ה מַלְכִ֖ין יְהַשְׁפִּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/024.yaml
  text: As for the ten horns[a], out of this kingdom ten kings will arise; and another will arise after them. He will be different from the former ones[b], and he will humble three kings.
translation:
  language: hi
  text: जहाँ तक उन दस सींगों की बात है, इस राज्य में से दस राजा उठ खड़े होंगे। उनके बाद एक और राजा उठ खड़ा होगा। वह पूर्ववर्ती राजाओं से भिन्न होगा[a] और तीन राजाओं को नीचा कर देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्ववर्ती राजाओं से अलग प्रकार का होगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “तीन राजाओं को गिरा देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַרְנַיָּא עֲשַׂר
  choice: उन दस सींगों
  rationale: प्रकाशनात्मक प्रतीक ‘सींगों’ को उसकी व्याख्या में बदले बिना बनाए रखा गया है। आरंभिक पदबंध के विषयसूचक बल को ‘जहाँ तक…की बात है’ से व्यक्त किया गया है।
- source_word: מִנַּהּ מַלְכוּתָה
  choice: इस राज्य में से
  rationale: स्त्रीलिंग प्रत्यय उस राज्य की ओर संकेत करता है जिसका प्रतिनिधित्व पशु करता है। ‘इस राज्य में से’ उद्भव के स्रोत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְכִין יְקֻמוּן
  choice: दस राजा उठ खड़े होंगे
  rationale: यहाँ קום शासकों के उदय को सूचित करता है। ‘उठ खड़े होंगे’ मूल क्रिया की छवि और राजकीय उदय, दोनों को बनाए रखता है।
- source_word: וְאָחֳרָן יְקוּם אַחֲרֵיהוֹן
  choice: उनके बाद एक और राजा उठ खड़ा होगा
  rationale: ‘एक और’ अगले शासक को संदर्भ से स्पष्ट करता है, जबकि ‘उनके बाद’ मूल की कालक्रम-सूचना को सुरक्षित रखता है।
- source_word: יִשְׁנֵא מִן קַדְמָיֵא
  choice: वह पहले राजाओं से भिन्न होगा
  rationale: इस प्रसंग में क्रिया भिन्नता या अलग स्वरूप को सूचित करती है, घृणा को नहीं। ‘भिन्न’ कथन को किसी विशिष्ट ऐतिहासिक या धर्मवैज्ञानिक पहचान से नहीं बाँधता।
- source_word: וּתְלָתָה מַלְכִין יְהַשְׁפִּל
  choice: तीन राजाओं को नीचा कर देगा
  rationale: שׁפל के हफेल रूप में ‘नीचा करना’ या ‘गिराना’ निहित है। यह चयन मूल की ऊँच-नीच वाली रूपक-छवि बनाए रखता है और राजनीतिक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: अंतिम शासक की पहले राजाओं से भिन्नता का स्वरूप
  choice: वह पहले राजाओं से भिन्न होगा
  alternative: वह पहले राजाओं से अधिक कठोर होगा
  rationale: मूल पाठ उसकी भिन्नता बताता है, पर यह नहीं बताता कि वह किस विशिष्ट अर्थ में भिन्न होगा। इसलिए किसी बाद की व्याख्यात्मक व्यवस्था या पहचान को पाठ में नहीं जोड़ा गया।
- issue: तीन राजाओं को नीचा करने की प्रकृति
  choice: तीन राजाओं को नीचा कर देगा
  alternative: तीन राजाओं को पद से हटा देगा
  rationale: मूल क्रिया नीचे करने का विचार देती है, पर यह स्पष्ट नहीं करती कि इसका अर्थ अपमान, अधीनता, पराजय या पदच्युति में से ठीक कौन-सा है। मुख्य पाठ इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु भविष्यद्वाणी के अनुरूप गरिमामय रखी गई है। ‘उठ खड़े होंगे’ और ‘नीचा कर देगा’ मूल अरामी की स्थान-संबंधी रूपक-छवियों को सहज हिन्दी में बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में अपने संबंधित पदबंधों के साथ दिए गए हैं।
