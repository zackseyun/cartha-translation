base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/022.yaml
  text: until the Ancient of Days came[a], and judgment was given to the saints of the Most High, and the time arrived[c][b], and the saints took possession of the kingdom.
translation:
  language: hi
  text: जब तक अति प्राचीन[a] आया और परमप्रधान के पवित्र जनों के पक्ष में न्यायिक निर्णय दिया गया; और समय आ पहुँचा, और पवित्र जनों ने राज्य पर अधिकार कर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘दिनों का प्राचीन।’ यह परमेश्वर की एक उपाधि है।'
    reason: literal_rendering
lexical_decisions:
- source_word: עַד דִּי
  choice: जब तक
  rationale: यह पद पिछले प्रसंग में बताए गए अत्याचार की समय-सीमा प्रकट करता है; हिन्दी में ‘जब तक’ स्वाभाविक और सटीक है।
- source_word: עַתִּיק יוֹמַיָּא
  choice: अति प्राचीन
  rationale: यह परमेश्वर की उपाधि है। ‘अति प्राचीन’ उसकी अत्यन्त पुरातनता का चित्र बनाए रखता है और आधुनिक हिन्दी में गरिमापूर्ण है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וְדִינָא יְהִב
  choice: न्याय का निर्णय दिया गया
  rationale: דִּין में न्याय, न्यायिक निर्णय अथवा न्याय-विधान का भाव हो सकता है। यह अनुवाद कानूनी संदर्भ और अरामी की निष्क्रिय अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: לְקַדִּישֵׁי עֶלְיוֹנִין
  choice: परमप्रधान के पवित्र जनों के पक्ष में
  rationale: संदर्भ में निर्णय सताए गए पवित्र जनों के अनुकूल है। ‘पवित्र जन’ קַדִּישִׁין का सीधा, व्यापक और संप्रदाय-निरपेक्ष हिन्दी रूप है। לְ का ‘को’ अर्थ भी सम्भव है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְזִמְנָא מְטָה
  choice: और वह समय आ पहुँचा
  rationale: यह निर्णायक समय के आगमन को व्यक्त करता है। ‘वह’ प्रसंग में पहले से अपेक्षित समय की ओर संकेत करता है, पर ‘नियत’ जैसा ऐसा अर्थ नहीं जोड़ता जो शब्द में स्पष्ट नहीं है।
- source_word: וּמַלְכוּתָא
  choice: राज्य
  rationale: दानिय्येल 7 के संदर्भ में यह राज्य अथवा राजकीय प्रभुत्व को दर्शाता है; ‘राज्य’ सहज और प्रसंगानुकूल है।
- source_word: הֶחֱסִנוּ
  choice: अपने अधिकार में ले लिया
  rationale: क्रिया अधिकार प्राप्त करने अथवा अधिकार में रखने का भाव देती है। यह रूप राज्य पर वास्तविक अधिकार ग्रहण करने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְדִינָא יְהִב לְקַדִּישֵׁי עֶלְיוֹנִין में לְ का अर्थ
  choice: पवित्र जनों के पक्ष में न्याय का निर्णय दिया गया
  alternative: पवित्र जनों को न्याय का निर्णय दिया गया / उन्हें न्याय करने का अधिकार दिया गया
  rationale: प्रसंग छोटे सींग के अत्याचार के बाद पवित्र जनों के न्यायिक समर्थन की ओर संकेत करता है। फिर भी अरामी संबंधसूचक לְ अप्रत्यक्ष कर्म का अर्थ भी दे सकता है; इसलिए इस वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
- issue: קַדִּישִׁין का संदर्भ
  choice: पवित्र जन
  alternative: पवित्र लोग / पवित्र प्राणी
  rationale: मूल पद स्वयं इस समूह का इससे अधिक संकीर्ण परिचय नहीं देता। ‘पवित्र जन’ मानवीय संदर्भ के अनुकूल है, पर किसी विशेष संप्रदायगत या अंत-समय संबंधी पहचान को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। पद की मूल क्रमिक संरचना बनाए रखते हुए अंतिम दो उपवाक्यों को ‘वह समय...जब’ से जोड़ा गया है, जिससे हिन्दी सहज रहे। ‘पवित्र जन’ को तकनीकी या संप्रदायगत शब्दावली के बजाय व्यापक बाइबिलीय पद के रूप में रखा गया है।
