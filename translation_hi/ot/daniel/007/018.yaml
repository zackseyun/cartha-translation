source:
  edition: WLC
  text: וִֽ/יקַבְּלוּן֙ מַלְכוּתָ֔/א קַדִּישֵׁ֖י עֶלְיוֹנִ֑ין וְ/יַחְסְנ֤וּן מַלְכוּתָ/א֙ עַֽד עָ֣לְמָ֔/א וְ/עַ֖ד עָלַ֥ם עָלְמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/018.yaml
  text: But the holy ones of the Most High will receive the kingdom and possess the kingdom forever—forever and ever[a].
translation:
  language: hi
  text: परन्तु परमप्रधान के पवित्र जन[a] राज्य को प्राप्त करेंगे और राज्य को सदा के लिए—युगानुयुग तक—अपने अधिकार में रखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमप्रधान के संत।” अरामी पद परमेश्वर के पवित्र लोगों की ओर संकेत कर सकता है; इस संदर्भ में कुछ व्याख्याकार इसे स्वर्गीय पवित्र प्राणियों के लिए भी समझते हैं।
    reason: ‘पवित्र जन’ के वैकल्पिक शब्दार्थ को दर्शाना और पद की मानवीय अथवा स्वर्गीय पहचान संबंधी वास्तविक संदर्भगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וִיקַבְּלוּן
  choice: प्राप्त करेंगे
  rationale: अरामी क्रिया का सीधा अर्थ ‘प्राप्त करना’ है। यह न तो बलपूर्वक छीनने का भाव जोड़ता है, न मूल में निहित न होने वाले कर्मवाच्य को स्पष्ट करता है।
- source_word: מַלְכוּתָא
  choice: राज्य
  rationale: यह संज्ञा राज्य-क्षेत्र और राजकीय प्रभुत्व दोनों का बोध करा सकती है। ‘राज्य’ स्वाभाविक हिन्दी है और दानिय्येल 7 में पशु-सदृश राज्यों के साथ विरोध को बनाए रखता है।
- source_word: קַדִּישֵׁי
  choice: पवित्र जन
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त होकर ‘पवित्र जन/पवित्र लोग’ का अर्थ देता है। ‘पवित्र जन’ गरिमापूर्ण और सुबोध है; संदर्भ में इसके मानवीय या स्वर्गीय संकेत को पादटिप्पणी में खुला रखा गया है।
- source_word: עֶלְיוֹנִין
  choice: परमप्रधान के
  rationale: यह दानिय्येल में परमेश्वर की उपाधि है। ‘परमप्रधान’ उसके सर्वोच्च होने का भाव और उपाधि का धार्मिक स्वरूप दोनों सुरक्षित रखता है।
- source_word: וְיַחְסְנוּן
  choice: अपने अधिकार में रखेंगे
  rationale: क्रिया स्थायी रूप से अधिकार या स्वामित्व रखने का भाव देती है। यह ‘विरासत में पाएँगे’ की अपेक्षा कम व्याख्यात्मक है और ‘प्राप्त करेंगे’ के बाद दीर्घकालीन अधिकार को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: עַד עָלְמָא
  choice: सदा के लिए
  rationale: यह अरामी मुहावरा अनन्त अवधि को व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְעַד עָלַם עָלְמַיָּא
  choice: युगानुयुग तक
  rationale: दोहराया हुआ अरामी पद पहले काल-वाक्यांश को तीव्र करता है। ‘युगानुयुग तक’ उसकी अनन्तता और काव्यात्मक उत्कर्ष को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: קַדִּישֵׁי עֶלְיוֹנִין की पहचान
  choice: ‘परमप्रधान के पवित्र जन’ कहकर पहचान को व्यापक रखा गया है।
  alternative: इसे केवल परमेश्वर की पवित्र प्रजा अथवा केवल स्वर्गीय पवित्र प्राणियों/स्वर्गदूतों के रूप में निर्दिष्ट करना।
  rationale: दानिय्येल 7 में इस पद का संदर्भ विवादित है और यह पद अकेले मानवीय या स्वर्गीय पहचान को निर्णायक नहीं बनाता। इसलिए अनुवाद किसी एक व्याख्या को मूल पाठ पर आरोपित नहीं करता; पादटिप्पणी दोनों संभावनाएँ बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘सदा के लिए—युगानुयुग तक—’ मूल की बढ़ती हुई कालगत तीव्रता को दर्शाता है, और ‘अपने अधिकार में रखेंगे’ स्थायी अधिपत्य को बिना ‘विरासत’ का अतिरिक्त अर्थ जोड़े व्यक्त करता है।
