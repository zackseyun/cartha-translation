  language: en
  yaml_path: translation/ot/daniel/007/005.yaml
  text: 'And look[a], another beast, a second one, resembling a bear; it was raised up on one side, and three ribs were in its mouth between its teeth. And this is what they were saying to it: “Arise[b], eat much flesh.”'
translation:
  language: hi
  text: और देखो, एक और पशु था—दूसरा—जो भालू के समान था। वह एक ओर से उठा हुआ था[b], और उसके मुँह में, उसके दाँतों के बीच, तीन पसलियाँ[a] थीं। उससे इस प्रकार कहा जा रहा था, “उठ, बहुत-सा मांस खा।”
  philosophy: optimal-equivalence
  footnotes:
