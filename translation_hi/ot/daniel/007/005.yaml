  rationale: अरामी क्रिया बहुवचन है, पर बोलने वालों की पहचान नहीं दी गई; हिन्दी का भाववाच्य उन्हें अनावश्यक रूप से निश्चित किए बिना कथन व्यक्त करता है।
- source_word: קוּמִי
  choice: उठ
  rationale: स्त्रीलिंग पशु को दी गई आज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: אֲכֻלִי בְּשַׂר שַׂגִּיא
