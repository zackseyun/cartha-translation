  text: בָּאתַ֨ר דְּנָ֜ה חָזֵ֣ה הֲוֵ֗ית וַ/אֲר֤וּ אָֽחֳרִי֙ כִּ/נְמַ֔ר וְ/לַ֨/הּ גַּפִּ֥ין אַרְבַּ֛ע דִּי ע֖וֹף עַל גבי/ה וְ/אַרְבְּעָ֤ה רֵאשִׁין֙ לְ/חֵ֣יוְתָ֔/א וְ/שָׁלְטָ֖ן יְהִ֥יב לַֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/006.yaml
  text: After this I kept looking[a], and behold, another, like a leopard; it had four wings of a bird on its back, and the beast had four heads, and dominion was given to it.
translation:
  language: hi
  text: इसके बाद मैं देखता रहा, और देखो, एक और पशु था, जो तेंदुए के समान था। उसकी पीठ[a] पर पक्षी के चार पंख थे। उस पशु के चार सिर थे, और उसे प्रभुत्व दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पार्श्वों पर”; अरामी अभिव्यक्ति उस प्राणी की पीठ या अधिक सामान्य रूप से उसके शरीर के ऊपरी भाग को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאתַר דְּנָה
  choice: इसके बाद
  rationale: यह कालसूचक अरामी अभिव्यक्ति दर्शन में अगला दृश्य प्रस्तुत करती है; ‘इसके बाद’ स्वाभाविक रूप से क्रम को बनाए रखता है।
- source_word: חָזֵה הֲוֵית
  choice: मैं देखता रहा
  rationale: कृदंत और सहायक क्रिया का मेल भूतकाल में जारी क्रिया व्यक्त करता है; यह अनुवाद उस कालगत निरंतरता को सुरक्षित रखता है।
- source_word: וַאֲרוּ
  choice: और देखो
  rationale: दर्शन-वर्णन में यह विस्मयसूचक शब्द पाठक का ध्यान नए दृश्य की ओर खींचता है और वर्णन की सजीवता बनाए रखता है।
- source_word: אָחֳרִי כִּנְמַר
  choice: एक और पशु था, जो चीते के समान था
  rationale: ‘एक और’ पशुओं के क्रम को स्पष्ट करता है और तुलना-सूचक उपसर्ग को ‘चीते के समान’ द्वारा ठीक तरह व्यक्त किया गया है।
- source_word: גַּפִּין אַרְבַּע דִּי עוֹף
  choice: पक्षी के चार पंख
  rationale: यह पंखों की संख्या और प्रकार दोनों को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל גבי/ה
  choice: उसकी पीठ पर
  rationale: गַּב का यहाँ सबसे सीधा अर्थ ‘पीठ’ है; अभिव्यक्ति की व्यापक या वैकल्पिक स्थान-संबंधी संभावना पादटिप्पणी में रखी गई है।
- source_word: וְאַרְבְּעָה רֵאשִׁין לְחֵיוְתָא
  choice: उस पशु के चार सिर थे
  rationale: अरामी के क्रियारहित उपवाक्य को स्वाभाविक हिन्दी में ‘थे’ के साथ व्यक्त किया गया है और חֵיוְתָא के लिए अध्याय-संगत ‘पशु’ रखा गया है।
- source_word: שָׁלְטָן יְהִיב לַהּ
  choice: उसे शासन करने का अधिकार दिया गया
  rationale: ‘शासन करने का अधिकार’ राजनीतिक प्रभुत्व का स्पष्ट और सहज हिन्दी रूप है; कर्मवाच्य मूल पाठ की तरह देने वाले को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: शासनाधिकार देने वाला निहित कर्ता
  choice: उसे शासन करने का अधिकार दिया गया
  alternative: उसे परमेश्वर से शासन करने का अधिकार मिला
  rationale: इस पद में देने वाले का नाम स्पष्ट रूप से नहीं बताया गया है। इसलिए अनुवाद कर्मवाच्य रखकर संभावित ईश्वरीय कर्ता को मुख्य पाठ में जोड़ता नहीं और मूल की धर्मवैचारिक संयमता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण रखी गई है। ‘और देखो’ दर्शन-वर्णन की सजीवता बनाए रखता है, जबकि छोटे वर्णनात्मक वाक्य सामान्य पाठक के लिए दृश्य को स्पष्ट करते हैं।
