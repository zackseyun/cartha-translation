  text: בִּ/שְׁנַ֣ת חֲדָ֗ה לְ/בֵלְאשַׁצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל דָּנִיֵּאל֙ חֵ֣לֶם חֲזָ֔ה וְ/חֶזְוֵ֥י רֵאשֵׁ֖/הּ עַֽל מִשְׁכְּבֵ֑/הּ בֵּ/אדַ֨יִן֙ חֶלְמָ֣/א כְתַ֔ב רֵ֥אשׁ מִלִּ֖ין אֲמַֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/001.yaml
  text: In the first year of Belshazzar king of Babylon[a], Daniel saw a dream and visions in his head while on his bed. Then he wrote down the dream—the summary of the words he told.
translation:
  language: hi
  text: बाबुल के राजा बेलशस्सर के शासन के पहले वर्ष में, दानिय्येल ने अपने बिस्तर पर एक स्वप्न देखा और अपने मन में दर्शन देखे। तब उसने उस स्वप्न को लिख लिया और उसका सार बताया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “उसने स्वप्न को लिखा; उसने वचनों का सिर कहा।” अरामी मुहावरे का सम्भावित अर्थ है कि उसने मुख्य बातें या विषय का सार दर्ज किया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת חֲדָה לְבֵלְאשַׁצַּר
  choice: बेलशस्सर के शासन के पहले वर्ष में
  rationale: अरामी राजकीय तिथि-सूत्र का स्वाभाविक हिन्दी रूप; 'शासन' अर्थ में निहित काल-संदर्भ को स्पष्ट करता है।
- source_word: מֶלֶךְ בָּבֶל
  choice: बाबुल के राजा
  rationale: नाम के साथ जुड़ी राजकीय उपाधि का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: חֵלֶם חֲזָה
  choice: एक स्वप्न ... देखे
  rationale: मूल क्रिया 'देखना' को बनाए रखता है और दर्शनात्मक बल सुरक्षित रखता है; संयुक्त वाक्य में हिन्दी व्याकरण के अनुसार क्रिया बहुवचन में है।
- source_word: וְחֶזְוֵי רֵאשֵׁהּ
  choice: और अपने मन में दर्शन
  rationale: शाब्दिक 'उसके सिर के दर्शन' आधुनिक हिन्दी में अस्वाभाविक और भ्रामक होगा; यहाँ आन्तरिक मानसिक दर्शन अभिप्रेत हैं।
- source_word: עַל מִשְׁכְּבֵהּ
  choice: अपने बिस्तर पर
  rationale: स्थान-सूचक पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: בֵּאדַיִן
  choice: तब
  rationale: सामान्य अरामी कथात्मक अनुक्रम-सूचक का संक्षिप्त हिन्दी समानार्थक।
- source_word: חֶלְמָא כְתַב
  choice: उस स्वप्न को लिख लिया
  rationale: लिखकर दर्ज करने का भाव स्वाभाविक हिन्दी में व्यक्त होता है, बिना अतिरिक्त व्याख्या के।
- source_word: רֵאשׁ מִלִּין אֲמַר
  choice: और उसका सार बताया
  rationale: शाब्दिक 'वचनों का सिर कहा' अरामी मुहावरा है; सन्दर्भ में इसका आशय मुख्य बात या सार बताना है। अस्पष्ट शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। 'मन में दर्शन' हिन्दी पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी अंतिम अरामी मुहावरे की वास्तविक संरचना और अर्थगत सम्भावना को सुरक्षित रखती है।
