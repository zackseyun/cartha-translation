  yaml_path: translation/ot/daniel/007/015.yaml
  text: As for me[a], Daniel, my spirit was distressed within me, and the visions of my head terrified me.
translation:
  language: hi
  text: मुझ दानिय्येल की आत्मा अपने म्यान[a] के भीतर व्याकुल हो उठी, और मेरे सिर के दर्शनों ने मुझे भयभीत कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने शरीर के भीतर।’ यहाँ प्रयुक्त दुर्लभ अरामी शब्द का शाब्दिक अर्थ ‘म्यान’ है—अर्थात वह देह जिसमें आत्मा रहती है, उसका एक रूपक।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶתְכְּרִיַּת
  choice: व्याकुल हो उठी
  rationale: यह क्रिया भीतर से दुखी या विचलित होने का भाव व्यक्त करती है। ‘व्याकुल हो उठी’ आंतरिक पीड़ा और बेचैनी को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: यहाँ רוּחַ हवा या साँस नहीं, बल्कि दानिय्येल के भीतरी अस्तित्व को सूचित करता है; ‘आत्मा’ इस अर्थ को बनाए रखता है।
- source_word: בְּגוֹא נִדְנֶה
  choice: अपने म्यान के भीतर
  rationale: दुर्लभ अरामी संज्ञा נִדְנֶה का मूल चित्र ‘म्यान’ या आवरण का है, जो शरीर को आत्मा के आवरण के रूप में प्रस्तुत करता है। मुख्य पाठ में इस सजीव रूपक को रखा गया है और स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֶזְוֵי רֵאשִׁי
  choice: मेरे सिर के दर्शन
  rationale: ‘दर्शन’ प्रकाशनात्मक दृश्य के लिए प्रसंगानुकूल है, और ‘मेरे सिर के’ मूल अरामी अभिव्यक्ति की विशिष्टता को सपाट किए बिना बनाए रखता है।
- source_word: יְבַהֲלֻנַּנִי
  choice: मुझे भयभीत कर दिया
  rationale: क्रिया तीव्र भय और घबराहट व्यक्त करती है; यह हिन्दी प्रयोग उस तीव्रता को स्पष्ट और स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: आत्मा और शरीर के संबंध का रूपक
  choice: ‘आत्मा’ और उसके ‘म्यान’ की मूल रूपकात्मक भाषा को बनाए रखा गया है।
  alternative: ‘मैं अपने शरीर के भीतर व्याकुल हो उठा’
  rationale: व्याख्यात्मक विकल्प अधिक सहज है, पर वह अरामी पाठ के दुर्लभ और सजीव ‘म्यान’ रूपक को मिटा देता है। पादटिप्पणी अर्थ स्पष्ट करती है, बिना किसी विशिष्ट मानवशास्त्रीय सिद्धांत को पाठ में आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। विराम-चिह्न ‘मैं, दानिय्येल’ को विषय-प्रस्तावना के रूप में उभारता है। दुर्लभ मूल रूपक को मुख्य पाठ में सुरक्षित रखकर पादटिप्पणी में उसका सहज अर्थ दिया गया है।
