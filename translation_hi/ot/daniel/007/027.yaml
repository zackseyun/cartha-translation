base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/027.yaml
  text: And the kingdom and the dominion and the greatness of the kingdoms under all heaven shall be given to the people of the saints of the Most High[a]. His kingdom shall be an everlasting kingdom[c][b], and all dominions shall serve and obey him.
translation:
  language: hi
  text: और राज्य, प्रभुता और समूचे आकाश के नीचे के राज्यों की महानता परमप्रधान के पवित्र जनों के समुदाय[a] को दे दी जाएगी। उसका[b] राज्य अनन्तकाल का राज्य होगा, और सभी प्रभुताएँ उसकी सेवा करेंगी[c] और उसकी आज्ञा मानेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘परमप्रधान के पवित्र जनों के लोग’ या ‘परमप्रधान की पवित्र प्रजा’ भी हो सकता है। ‘पवित्र जन’ स्वर्गीय पवित्र प्राणियों के अर्थ में भी समझे जा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'अरामी पाठ में यहाँ और आगे के सर्वनाम एकवचन हैं: ‘उसका राज्य ... उसकी सेवा करेंगी और उसकी आज्ञा मानेंगी।’ राज्य पवित्र जनों के समुदाय को दिया जाता है, फिर भी यह एकवचन इससे पहले दर्शन में दिखाई दिए प्रतिनिधि शासक की ओर संकेत कर सकता है।'
    reason: alternative_reading
  - marker: c
    text: दानिय्येल में जब यह सेवा किसी देवता को दी जाती है, तब ‘सेवा करना’ क्रिया में ‘आराधना करना’ का भाव भी हो सकता है।
    reason: lexical_alternative
