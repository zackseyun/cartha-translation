  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रभुता’ जैसे औपचारिक शब्द को मूल की राजकीय शब्दावली और पद के भीतर उसकी पुनरावृत्ति बचाने के लिए रखा गया है। विराम-चिह्नों से लम्बी अरामी संरचना को पठनीय बनाया गया है।
