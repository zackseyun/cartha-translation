theological_decisions:
- issue: दूसरे वाक्य में एकवचन सर्वनाम का संदर्भ
  choice: ‘उसका ... उसकी’ के रूप में मूल का एकवचन सुरक्षित रखा गया है।
  alternative: ‘उनका ... उनकी’ करके इसे पवित्र जनों की प्रजा से सीधे जोड़ना, अथवा सर्वनाम हटाकर राज्य को ही कर्ता मानना।
  rationale: अध्याय में राज्य मनुष्य के पुत्र-सदृश व्यक्ति और परमप्रधान के पवित्र जनों—दोनों से संबद्ध है। मूल के एकवचन को रखना इस अर्थगत और धर्मवैचारिक तनाव को बिना सुलझाए सुरक्षित रखता है।
- issue: קַדִּישֵׁי עֶלְיוֹנִין की पहचान
  choice: ‘परमप्रधान के पवित्र जनों की प्रजा’
  alternative: ‘परमप्रधान की पवित्र प्रजा’ या ‘परमप्रधान के पवित्र प्राणियों की प्रजा’
  rationale: मुख्य पाठ बहुवचन ‘पवित्र जनों’ को बनाए रखता है और पाद-टिप्पणी सामूहिक ‘पवित्र प्रजा’ सहित संभव अर्थों को दर्ज करती है; इससे मनुष्यों अथवा स्वर्गीय प्राणियों की पहचान पूर्वनिर्धारित नहीं होती।
- issue: יִפְלְחוּן में सेवा अथवा आराधना
  choice: मुख्य पाठ में ‘सेवा करेंगी’
  alternative: ‘आराधना करेंगी’
  rationale: क्रिया दानिय्येल में देवता को दी गई सेवा के लिए प्रयुक्त होकर आराधना का भाव रख सकती है, पर ‘सेवा’ उसका व्यापक अर्थ बचाती है और संदर्भ को स्वयं बोलने देती है।
