base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/019.yaml
  text: Then I wanted to know for certain about the fourth beast[a], which was different from all of them, exceedingly terrifying, with teeth of iron and claws of bronze, which devoured, crushed[b], and trampled what was left with its feet.
translation:
  language: hi
  text: तब मैं चौथे पशु के विषय में निश्चित रूप से जानना चाहता था[a]। वह उन सब से भिन्न और अत्यन्त भयानक था। उसके लोहे के दाँत और काँसे के नख थे। वह निगलता और चूर-चूर करता था, और जो बच जाता उसे अपने पैरों से रौंद डालता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब मैं चौथे पशु के विषय में सच्चाई निश्चित करना चाहता था।” अरामी अभिव्यक्ति किसी बात को पक्के तौर पर जानने या निश्चित करने की इच्छा व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह काल-सूचक कथन को दानिय्येल की पूछताछ के अगले चरण से जोड़ता है।
- source_word: צְבִית לְיַצָּבָא
  choice: निश्चित रूप से जानना चाहता था
  rationale: चाहने की क्रिया और विषय को पक्का/निश्चित करने के अरामी भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: चौथे पशु
  rationale: संज्ञा और क्रमवाचक विशेषण का सीधा तथा प्रसंगानुकूल अनुवाद।
- source_word: שָׁנְיָה מִן כלהון
  choice: उन सब से भिन्न
  rationale: तुलनात्मक भाव को संक्षिप्त और स्पष्ट हिन्दी में सुरक्षित रखता है।
- source_word: דְּחִילָה יַתִּירָה
  choice: अत्यन्त भयानक
  rationale: मूल के तीव्र भयकारी वर्णन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שִׁנַּיּהּ דִּי פַרְזֶל
  choice: उसके दाँत लोहे के
  rationale: पशु की शारीरिक विशेषता का सीधा वर्णन।
- source_word: טִפְרַיּהּ דִּי נְחָשׁ
  choice: पंजे काँसे के
  rationale: טפר के पंजे/नाखून अर्थों में पशु-चित्र के अनुकूल 'पंजे' चुना गया; נחש को इस धातु-संदर्भ में 'काँसा' किया गया।
- source_word: אָכְלָה מַדֲּקָה
  choice: निगलता और चूर-चूर करता था
  rationale: दो पृथक हिंसक क्रियाओं और दूसरी क्रिया की टुकड़े करने की तीव्रता को सुरक्षित रखता है।
- source_word: וּשְׁאָרָא בְּרַגְלַיּהּ רָפְסָה
  choice: जो बच जाता उसे अपने पैरों से रौंद डालता था
  rationale: शेष वस्तु और पैरों से कुचलने की सजीव क्रिया को सहज हिन्दी में व्यक्त करता है।
