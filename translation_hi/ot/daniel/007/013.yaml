source:
  edition: WLC
  text: חָזֵ֤ה הֲוֵית֙ בְּ/חֶזְוֵ֣י לֵֽילְיָ֔/א וַ/אֲרוּ֙ עִם עֲנָנֵ֣י שְׁמַיָּ֔/א כְּ/בַ֥ר אֱנָ֖שׁ אָתֵ֣ה הֲוָ֑ה וְ/עַד עַתִּ֤יק יֽוֹמַיָּ/א֙ מְטָ֔ה וּ/קְדָמ֖וֹ/הִי הַקְרְבֽוּ/הִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/013.yaml
  text: I kept looking in the visions of the night[a], and behold, with the clouds of heaven one like a son of man was coming, and he came to the Ancient of Days[b], and they brought him near before him.
translation:
  language: hi
  text: मैं रात के दर्शनों में देखता ही रहा। और देखो, आकाश के बादलों के साथ[a] मनुष्य के पुत्र-जैसा कोई[b] आ रहा था। वह अति प्राचीन[c] के पास पहुँचा, और वे उसे उनके सम्मुख ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “आकाश के बादलों पर।” यहाँ अरामी पूर्वसर्ग का शाब्दिक अर्थ “साथ” है; वह बादलों की संगति बताता है, उन पर गति करना आवश्यक रूप से नहीं।'
    reason: alternative_reading
  - marker: b
    text: या, “मानव-जैसा कोई।” अरामी में शाब्दिक रूप से “मनुष्य के पुत्र-जैसा” है। यह किसी मानवीय आकृति को दर्शा सकता है और बाद की बाइबिलीय व्याख्या में एक महत्त्वपूर्ण मसीहाई उपाधि बनता है।
    reason: lexical_alternative
  - marker: c
    text: अरामी उपाधि का शाब्दिक रूप “दिनों का प्राचीन” है।
    reason: literal_rendering
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: मैं ... देखता ही रहा
  rationale: कृदन्त और הוה की रचना भूतकाल में जारी क्रिया बताती है। ‘देखता ही रहा’ उस निरंतरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּחֶזְוֵי לֵילְיָא
  choice: रात के दर्शनों में
  rationale: बहुवचन ‘दर्शनों’ और रात के साथ उसके संबंध—दोनों को सुरक्षित रखा गया है।
- source_word: וַאֲרוּ
  choice: तब देखो
  rationale: यह विस्मयकारी नए दृश्य की ओर ध्यान खींचने वाला कथन-संकेत है; ‘देखो’ उसकी सजीवता और प्रकाशन-साहित्य की गरिमा बनाए रखता है।
- source_word: עִם עֲנָנֵי שְׁמַיָּא
  choice: आकाश के बादलों के साथ
  rationale: עִם का सामान्य अर्थ ‘साथ’ है, ‘पर’ नहीं। इसलिए मुख्य पाठ मूल पूर्वसर्ग का अनुसरण करता है और परंपरागत विकल्प को पादटिप्पणी में रखता है।
- source_word: כְּבַר אֱנָשׁ
  choice: मनुष्य के पुत्र-जैसा कोई
  rationale: यह रूप तुलना-सूचक כְּ, एकवचन मानवीय आकृति और शाब्दिक ‘मनुष्य का पुत्र’—तीनों को बनाए रखता है। ‘कोई’ हिन्दी में तुलना की अनिश्चित प्रस्तुति को स्वाभाविक बनाता है।
- source_word: אָתֵה הֲוָה
  choice: आ रहा था
  rationale: यह कृदन्तीय रचना दृश्य में जारी आगमन को व्यक्त करती है, इसलिए अपूर्णतावाची रूप चुना गया है।
- source_word: עַתִּיק יוֹמַיָּא
  choice: अति प्राचीन
  rationale: यह हिन्दी में सुबोध, गरिमापूर्ण उपाधि है। अरामी पद का अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है ताकि मूल बिंब न खोए।
- source_word: מְטָה
  choice: पहुँचा
  rationale: जारी आगमन के बाद गंतव्य तक पहुँचने की पूर्ण क्रिया को स्पष्ट करता है।
- source_word: הַקְרְבוּהִי
  choice: वे उसे ... निकट ले आए
  rationale: हफ़एल कारक क्रिया और उसके अनिर्दिष्ट बहुवचन कर्ता को सक्रिय रूप में सुरक्षित रखा गया है; कर्ताओं की पहचान पाठ से बाहर जाकर नहीं की गई।
theological_decisions:
- issue: मसीहाई व्याख्या में महत्त्वपूर्ण כְּבַר אֱנָשׁ का अनुवाद
  choice: मनुष्य के पुत्र-जैसा कोई
  alternative: मानव-जैसा कोई
  rationale: मुख्य पाठ तुलना और पारंपरिक रूप से महत्त्वपूर्ण ‘मनुष्य का पुत्र’ दोनों को सुरक्षित रखता है, पर उस आकृति की पहचान को बाद की व्याख्या के आधार पर निश्चित नहीं करता।
- issue: עִם עֲנָנֵי שְׁמַיָּא में संबंधसूचक पूर्वसर्ग
  choice: आकाश के बादलों के साथ
  alternative: आकाश के बादलों पर
  rationale: मूल अरामी में עִם ‘साथ’ है। ‘पर’ प्रसिद्ध परंपरागत और अंतर्पाठीय पठन है, पर वह मूल पूर्वसर्ग से अधिक विशिष्ट अर्थ देता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: עַתִּיק יוֹמַיָּא की ईश्वरीय उपाधि
  choice: अति प्राचीन
  alternative: दिनों का प्राचीन
  rationale: ‘अति प्राचीन’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है, जबकि पादटिप्पणी शाब्दिक अरामी संरचना उपलब्ध कराती है और उपाधि की विशिष्टता को सुरक्षित रखती है।
- issue: הַקְרְבוּהִי के अनिर्दिष्ट बहुवचन कर्ता
  choice: वे उसे उनके सामने निकट ले आए
  alternative: उसे उनके सामने लाया गया
  rationale: सक्रिय बहुवचन को बनाए रखने से मूल पाठ का व्याकरण सुरक्षित रहता है; ‘वे’ कौन हैं, यह अनिर्णीत छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रकाशन-दर्शन की सजीवता के लिए ‘तब देखो’ तथा जारी क्रियाओं के लिए ‘देखता ही रहा’ और ‘आ रहा था’ प्रयुक्त हैं। ईश्वरीय संदर्भ में आदरसूचक बहुवचन ‘उनके’ रखा गया है; अंतिम वाक्य में ‘वे’ मूल के अनिर्दिष्ट बहुवचन कर्ता को जानबूझकर अनिर्दिष्ट ही रखता है।
