base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/025.yaml
  text: He will speak words against the Most High[a], and he will wear out the saints of the Most High. He will intend to change times and law, and they will be given into his hand for a time, times[c][b], and half a time.
translation:
  language: hi
  text: वह परमप्रधान के विरुद्ध बातें कहेगा और परमप्रधान के पवित्र जनों को थका डालेगा। वह नियत समयों[a] और व्यवस्था को बदलने का इरादा करेगा; और वे उसके हाथ में सौंप दिए जाएँगे[b]—एक समय, समयों और आधे समय तक[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समयों”; अरामी शब्द सामान्य समयों के साथ नियत ऋतुओं या पर्व-समयों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात सम्भवतः पवित्र जन उसके हाथ में सौंप दिए जाएँगे; मूल पाठ में बहुवचन कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “एक समय, समयों और आधे समय तक”; इसे प्रायः साढ़े तीन समय या वर्ष समझा जाता है, पर यह एक सीमित अवधि का प्रतीक भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִלִּין לְצַד עֶלְיָא
  choice: परमप्रधान के विरुद्ध बातें
  rationale: संदर्भ में לְצַד का भाव विरोध का है; מִלִּין को स्वाभाविक हिन्दी में ‘बातें’ कहा गया है।
- source_word: קַדִּישֵׁי עֶלְיוֹנִין
  choice: परमप्रधान के पवित्र जन
  rationale: ‘पवित्र जन’ मनुष्यों और स्वर्गीय पवित्र प्राणियों के बीच स्रोत की कुछ हद तक खुली पहचान को ‘लोग’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: יְבַלֵּא
  choice: थका डालेगा
  rationale: यह क्रिया लगातार सताकर क्षीण या निढाल कर देने का भाव रखती है; ‘थका डालेगा’ उसके रूपक और तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: יִסְבַּר לְהַשְׁנָיָה
  choice: बदलने का इरादा करेगा
  rationale: यह सोचने या इरादा करने को बताता है, परिवर्तन की सफलता को नहीं; इसलिए प्रयास और परिणाम में भेद रखा गया है।
- source_word: זִמְנִין וְדָת
  choice: नियत समयों और व्यवस्था
  rationale: זִמְנִין सामान्य समयों के साथ नियुक्त ऋतुओं अथवा पर्व-समयों को भी सूचित कर सकता है; דָת के लिए ‘व्यवस्था’ कानून या स्थापित विधान की व्यापकता रखता है।
- source_word: יִתְיַהֲבוּן בִּידֵהּ
  choice: वे उसके हाथ में सौंप दिए जाएँगे
  rationale: अरामी बहुवचन निष्क्रिय क्रिया को सुरक्षित रखा गया है। सर्वनाम का स्पष्ट पूर्ववर्ती नहीं बताया गया, यद्यपि संदर्भ में पवित्र जन सबसे स्वाभाविक हैं।
- source_word: עַד עִדָּן וְעִדָּנִין וּפְלַג עִדָּן
  choice: एक समय, दो समय और आधे समय तक
  rationale: द्विवचन-सदृश ‘समयों’ को हिन्दी में समझने योग्य ‘दो समय’ किया गया है, पर इसे वर्षों में बदलकर विवादित काल-मूल्य निश्चित नहीं किया गया।
theological_decisions:
- issue: ‘परमप्रधान के पवित्र जनों’ की पहचान
  choice: पवित्र जन
  alternative: परमप्रधान के पवित्र लोग; स्वर्गीय पवित्र जन/स्वर्गदूत
  rationale: दानिय्येल 7 में राज्य पाने वाले समुदाय से संबंध मानव प्रजा की ओर संकेत करता है, फिर भी संज्ञा स्वयं ‘पवित्र जनों’ की है; मुख्य पाठ अनावश्यक रूप से पहचान को सीमित नहीं करता।
- issue: बहुवचन ‘वे’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम को बनाए रखना
  alternative: ‘पवित्र जन उसके हाथ में सौंप दिए जाएँगे’
  rationale: सबसे निकट और प्रसंगानुकूल आशय पवित्र जन हैं, पर स्रोत में विषय व्यक्त नहीं है। पाठ और पादटिप्पणी मिलकर अर्थ तथा व्याकरणिक अस्पष्टता दोनों सुरक्षित रखते हैं।
- issue: अंतिम काल-सूत्र का अर्थ
  choice: एक समय, दो समय और आधे समय तक
  alternative: साढ़े तीन वर्ष; प्रतीकात्मक सीमित अवधि
  rationale: मूल अरामी सूत्र को कैलेंडरी वर्षों या किसी विशिष्ट अंतकालीन योजना में बदले बिना रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘परमप्रधान’, ‘पवित्र जन’ और ‘उसके हाथ में’ जैसे बाइबलीय पद तथा रूपक बनाए गए हैं; विवादित संदर्भों और काल-मूल्य को पादटिप्पणियों में खुला रखा गया है।
