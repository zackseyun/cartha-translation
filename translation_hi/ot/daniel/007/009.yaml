reference: Daniel 7:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֗ית עַ֣ד דִּ֤י כָרְסָוָן֙ רְמִ֔יו וְ/עַתִּ֥יק יוֹמִ֖ין יְתִ֑ב לְבוּשֵׁ֣/הּ כִּ/תְלַ֣ג חִוָּ֗ר וּ/שְׂעַ֤ר רֵאשֵׁ/הּ֙ כַּ/עֲמַ֣ר נְקֵ֔א כָּרְסְיֵ/הּ֙ שְׁבִיבִ֣ין דִּי נ֔וּר גַּלְגִּלּ֖וֹ/הִי נ֥וּר דָּלִֽק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/009.yaml
  text: I kept watching until thrones were set in place[a], and the Ancient of Days took his seat. His clothing was white as snow, and the hair of his head was like pure wool. His throne was flames of fire[b]; its wheels were a burning fire.
translation:
  language: hi
  text: मैं देखता रहा, जब तक कि सिंहासन अपने स्थान पर रखे गए[a] और अति प्राचीन[b] विराजमान हुए। उनका वस्त्र बर्फ के समान उजला था, और उनके सिर के बाल शुद्ध ऊन के समान थे। उनका सिंहासन आग की लपटों से बना था; उसके पहिए धधकती आग थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंहासन रखे गए।” पारंपरिक अनुवाद “सिंहासन गिरा दिए गए” भी संभव माना गया है, पर यहाँ इसकी संभावना कम है, क्योंकि इसके तुरंत बाद स्वर्गीय न्यायसभा के बैठने का दृश्य आता है।
    reason: alternative_reading
  - marker: b
    text: अरामी “अति प्राचीन” एक उपाधि है, जो अत्यंत प्राचीनता और अनन्त महिमा पर बल देती है।
    reason: cultural_note
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: मैं देखता रहा
  rationale: कृदंत और सहायक क्रिया मिलकर भूतकाल में जारी क्रिया व्यक्त करते हैं; यह हिन्दी प्रयोग उस निरंतरता को स्वाभाविक ढंग से रखता है।
- source_word: עַד דִּי
  choice: जब तक कि
  rationale: यह उस बिंदु को प्रस्तुत करता है जहाँ तक दानिय्येल दर्शन में देखता रहा।
- source_word: כָרְסָוָן
  choice: सिंहासन
  rationale: बहुवचन रूप राजकीय और न्यायिक आसनों को सूचित करता है, इसलिए साधारण 'आसन' की अपेक्षा 'सिंहासन' स्वर्गीय न्यायसभा का चित्र बेहतर बनाए रखता है।
- source_word: רְמִיו
  choice: अपने स्थान पर रखे गए
  rationale: निकटवर्ती संदर्भ में स्वर्गीय न्यायसभा सजाई जा रही है; अतः यहाँ क्रिया का अर्थ सिंहासनों को स्थापित करना अधिक उपयुक्त है।
- source_word: וְעַתִּיק יוֹמִין
  choice: और अति प्राचीन
  rationale: यह संक्षिप्त, गरिमापूर्ण उपाधि अत्यधिक प्राचीनता और सनातन महिमा के भाव को बनाए रखती है, बिना अर्थ में अतिरिक्त व्याख्या जोड़े।
- source_word: יְתִב
  choice: विराजमान हुए
  rationale: क्रिया बैठने या आसन ग्रहण करने को दर्शाती है; 'विराजमान हुए' राजकीय और न्यायिक प्रसंग में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: לְבוּשֵׁהּ כִּתְלַג חִוָּר
  choice: उनका वस्त्र बर्फ के समान उजला था
  rationale: एकवचन 'वस्त्र' और हिम की उज्ज्वल श्वेतता की उपमा दोनों सुरक्षित रहते हैं।
- source_word: וּשְׂעַר רֵאשֵׁהּ כַּעֲמַר נְקֵא
  choice: और उनके सिर के बाल शुद्ध ऊन के समान थे
  rationale: נְקֵא का स्वच्छता या शुद्धता का भाव 'शुद्ध' से व्यक्त होता है; समानांतर पंक्ति से श्वेतता का संकेत मिलता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: כָּרְסְיֵהּ שְׁבִיבִין דִּי נוּר
  choice: उनका सिंहासन आग की लपटों से बना था
  rationale: שְׁבִיבִין लपटों या अग्निमय चिनगारियों को सूचित कर सकता है; 'आग की लपटें' दृश्य की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करती हैं। 'से बना था' हिन्दी में विधेय संबंध को स्पष्ट करता है।
- source_word: גַּלְגִּלּוֹהִי נוּר דָּלִק
  choice: उसके पहिए धधकती आग थे
  rationale: सर्वनाम सिंहासन की ओर लौटता है; 'धधकती आग' निरंतर जलती हुई अग्नि का सजीव चित्र रखती है और रथ-सिंहासन की छवि बचाती है।
theological_decisions:
- issue: עַתִּיק יוֹמִין को ईश्वरीय उपाधि के रूप में प्रस्तुत करना
  choice: अति प्राचीन
  alternative: अति प्राचीन पुरुष; दिनों का प्राचीन
  rationale: अरामी पद यहाँ स्वर्गीय न्यायसभा में एक श्रद्धापूर्ण उपाधि की तरह कार्य करता है। 'अति प्राचीन' उसकी संक्षिप्तता, रहस्य और गरिमा को बनाए रखता है तथा किसी विशिष्ट व्याख्यात्मक परंपरा को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सहज शैली अपनाई गई है। 'विराजमान हुए' जैसे औपचारिक किन्तु प्रचलित पद से राजकीय-न्यायिक वातावरण रखा गया है। मुख्य पाठ में केवल वही [a] चिह्न है जिसकी पादटिप्पणी दी गई है।
