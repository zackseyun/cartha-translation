  text: קַדְמָיְתָ֣/א כְ/אַרְיֵ֔ה וְ/גַפִּ֥ין דִּֽי נְשַׁ֖ר לַ֑/הּ חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּי מְּרִ֨יטוּ גַפַּ֜י/הּ וּ/נְטִ֣ילַת מִן אַרְעָ֗/א וְ/עַל רַגְלַ֨יִן֙ כֶּ/אֱנָ֣שׁ הֳקִימַ֔ת וּ/לְבַ֥ב אֱנָ֖שׁ יְהִ֥יב לַֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/004.yaml
  text: The first was like a lion[a], and it had the wings of an eagle. I kept watching until its wings were plucked off, and it was lifted up from the earth and made to stand on two feet like a man[c][b], and a human heart was given to it.
translation:
  language: hi
  text: पहला पशु सिंह के समान था और उसके उकाब के पंख थे। मैं तब तक देखता रहा, जब तक उसके पंख नोच लिए गए। फिर उसे धरती से उठा लिया गया और मनुष्य के समान दो पैरों पर खड़ा किया गया[a], और उसे मनुष्य का हृदय दिया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्य के समान पैरों पर खड़ा किया गया।”
    reason: lexical_alternative
  - marker: b
    text: या “उसे मानवीय हृदय दिया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַדְמָיְתָא
  choice: पहला पशु
  rationale: स्त्रीलिंग क्रमवाचक शब्द दर्शन में वर्णित पहले पशु की ओर संकेत करता है; हिंदी में संदर्भ स्पष्ट रखने के लिए ‘पशु’ जोड़ा गया है।
- source_word: כְאַרְיֵה
  choice: सिंह के समान था
  rationale: उपसर्ग כ तुलना व्यक्त करता है, पहचान नहीं; इसलिए दर्शन की उपमा सुरक्षित रखी गई है।
- source_word: וְגַפִּין דִּי נְשַׁר לַהּ
  choice: और उसके उकाब के-से पंख थे
  rationale: शाब्दिक अरामी रचना ‘उकाब के पंख उसके थे’ अधिकार दर्शाती है; हिंदी में स्वाभाविक रूप से ‘उसके ... पंख थे’ कहा गया है।
- source_word: חָזֵה הֲוֵית
  choice: मैं ... देखता रहा
  rationale: कृदंत और सहायक क्रिया का मेल भूतकाल में जारी क्रिया बताता है; ‘देखता रहा’ उस कालगत विस्तार को व्यक्त करता है।
- source_word: מְּרִיטוּ גַפַּיהּ
  choice: उसके पंख नोच नहीं लिए गए
  rationale: क्रिया पंखों को खींचकर अलग कर देने का सजीव भाव रखती है; ‘नोच लिए गए’ हिंदी में उस हिंसक निष्कासन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּנְטִילַת מִן אַרְעָא
  choice: उसे धरती से उठा लिया गया
  rationale: मूल का कर्मवाच्य और धरती से ऊपर उठाए जाने की गति दोनों बनाए गए हैं।
- source_word: וְעַל רַגְלַיִן כֶּאֱנָשׁ הֳקִימַת
  choice: मनुष्य के समान पैरों पर खड़ा किया गया
  rationale: कारक क्रिया बताती है कि पशु को खड़ा किया गया। मूल में ‘दो’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וּלְבַב אֱנָשׁ יְהִיב לַהּ
  choice: उसे मनुष्य का हृदय दिया गया
  rationale: यह रचना शाब्दिक संबंध को सुरक्षित रखती है और पशु-सदृश रूप के विपरीत मानवीय अंतःस्वभाव या समझ के संकेत को बिना व्याख्यात्मक रूप से सीमित किए रहने देती है।
theological_decisions:
- issue: पशु और मनुष्य के बीच मानवरूप तुलना
  choice: ‘मनुष्य के समान’ और ‘मनुष्य का हृदय’
  alternative: ‘मानव के समान’ और ‘मानवीय हृदय’
  rationale: אֱנָשׁ यहाँ सामान्य मनुष्य को दर्शाता है। ‘मनुष्य’ आधुनिक हिंदी में स्वाभाविक है और तुलना को जैविक लिंग तक सीमित नहीं करता। ‘मनुष्य का हृदय’ मूल की अस्पष्टता बनाए रखता है कि आशय अंतःस्वभाव, बुद्धि या संवेदना में से किस पर केंद्रित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सिंह’, ‘उकाब’, ‘धरती’ और ‘हृदय’ दर्शन की सजीवता तथा बाइबिलीय गरिमा बनाए रखते हैं। मुख्य पाठ में मूल अरामी की कर्मवाच्य रचना और मानवीकरण की क्रमिक गति संरक्षित है।
