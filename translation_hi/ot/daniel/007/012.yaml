source:
  edition: WLC
  text: וּ/שְׁאָר֙ חֵֽיוָתָ֔/א הֶעְדִּ֖יו שָׁלְטָנְ/ה֑וֹן וְ/אַרְכָ֧ה בְ/חַיִּ֛ין יְהִ֥יבַת לְ/ה֖וֹן עַד זְמַ֥ן וְ/עִדָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/012.yaml
  text: As for the rest of the beasts[a], their dominion was taken away, but an extension of life was given to them for a time and a season.
translation:
  language: hi
  text: बाकी पशुओं का शासन-अधिकार छीन लिया गया, पर उनका जीवन एक समय और एक काल तक बढ़ाया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक समय और एक काल के लिए।” अरामी अभिव्यक्ति को उन्हें दिए गए जीवन-विस्तार की अंतिम सीमा बताते हुए भी समझा जा सकता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: וּשְׁאָר חֵיוָתָא
  choice: बाकी पशुओं का
  rationale: यह पिछले पशु से ध्यान हटाकर दर्शन के शेष प्रतीकात्मक पशुओं की ओर ले जाता है। ‘पशु’ दानिय्येल 7 के संदर्भ में स्वाभाविक और सटीक है।
- source_word: הֶעְדִּיו שָׁלְטָנְהוֹן
  choice: उनका शासन-अधिकार छीन लिया गया
  rationale: अरामी क्रिया अधिकार को हटा दिए जाने का भाव देती है। ‘शासन-अधिकार’ राजनीतिक सत्ता और शासन करने के अधिकार—दोनों को व्यक्त करता है।
- source_word: וְאַרְכָה בְחַיִּין
  choice: पर ... उनके जीवन की अवधि बढ़ा दी गई
  rationale: सत्ता छिनने और जीवन बने रहने के बीच विरोध को ‘पर’ स्पष्ट करता है। यह वाक्यांश जीवन के सीमित विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהִיבַת לְהוֹן
  choice: उनके ... बढ़ा दी गई
  rationale: मूल का कर्मवाच्य रूप सुरक्षित रखा गया है और देने वाले की पहचान पाठ से बाहर जाकर नहीं जोड़ी गई।
- source_word: עַד זְמַן וְעִדָּן
  choice: कुछ समय और एक काल के लिए
  rationale: यह सीमित अवधि का भाव रखता है और दोनों अरामी कालवाची शब्दों को अलग-अलग व्यक्त करता है, बिना उन्हें किसी निश्चित अंत-कालीन गणना में बाँधे।
theological_decisions:
- issue: शासन-अधिकार छिनने के बाद पशुओं के जीवित रहने की समय-सीमा
  choice: कुछ समय और एक काल के लिए
  alternative: एक समय और एक काल तक
  rationale: मुख्य पाठ सीमित अवधि पर बल देता है, जबकि पादटिप्पणी עַד के संभावित सीमा-बोध को सुरक्षित रखती है। किसी तकनीकी अंत-कालीन योजना को पाठ पर आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘शासन-अधिकार’ सांकेतिक राजसत्ता को स्पष्ट करता है; ‘काल’ साहित्यिक होते हुए भी सामान्य पाठक के लिए बोधगम्य है।
