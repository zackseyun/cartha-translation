  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘सच्चाई’ के साथ मूल अरामी की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित है; किसी खड़े हुए व्यक्ति की पहचान या स्वरूप को पाठ से आगे बढ़कर निश्चित नहीं किया गया।
