id: DAN.7.16
reference: Daniel 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קִרְבֵ֗ת עַל חַד֙ מִן קָ֣אֲמַיָּ֔/א וְ/יַצִּיבָ֥א אֶבְעֵֽא מִנֵּ֖/הּ עַֽל כָּל דְּנָ֑ה וַ/אֲמַר לִ֕/י וּ/פְשַׁ֥ר מִלַּיָּ֖/א יְהוֹדְעִנַּֽ/נִי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/016.yaml
  text: I approached one of those standing there and asked him the certainty about all this[b][a]. So he told me and made known to me the interpretation of the matter.
translation:
  language: hi
  text: मैं वहाँ खड़े लोगों में से एक के पास गया और उससे इस सब की सच्चाई[a] पूछी। तब उसने मुझे बताया और उन बातों का अर्थ[b] मुझे समझा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस सब के विषय में निश्चित बात’। अरामी शब्द में दृढ़, निश्चित या सत्य होने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘शब्दों की व्याख्या’; यहाँ ‘शब्दों’ से आशय सम्भवतः दर्शन की बातों या विषयवस्तु से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְבֵת
  choice: मैं ... के पास गया
  rationale: यह प्रथम पुरुष एकवचन क्रिया किसी के निकट जाने को व्यक्त करती है; आधुनिक हिन्दी में ‘के पास गया’ स्वाभाविक और स्पष्ट है।
- source_word: עַל חַד מִן קָאֲמַיָּא
  choice: वहाँ खड़े लोगों में से एक
  rationale: यह पद वहाँ उपस्थित और खड़े हुए लोगों में से एक व्यक्ति की ओर संकेत करता है, पर उसकी पहचान को अधिक निश्चित नहीं करता।
- source_word: וְיַצִּיבָא ... עַל כָּל דְּנָה
  choice: इस सब की सच्चाई
  rationale: יַצִּיבָא में दृढ़, निश्चित और सत्य होने के परस्पर जुड़े अर्थ हैं। ‘सच्चाई’ हिन्दी में सहज है, जबकि पादटिप्पणी ‘निश्चित बात’ की वैकल्पिक छाया सुरक्षित रखती है।
- source_word: אֶבְעֵא מִנֵּהּ
  choice: उससे ... पूछी
  rationale: בעא के साथ מן यहाँ किसी व्यक्ति से पूछने या जानकारी माँगने का भाव देता है।
- source_word: וַאֲמַר לִי
  choice: तब उसने मुझे बताया
  rationale: कथात्मक क्रम में यह उसके उत्तर को आरम्भ करता है; ‘तब’ क्रम को और ‘बताया’ प्रसंगानुकूल कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּפְשַׁר מִלַּיָּא
  choice: उन बातों का अर्थ
  rationale: פְשַׁר का अर्थ व्याख्या या अर्थ है। מִלַּיָּא शाब्दिक रूप से ‘शब्दों’ है, पर यहाँ दर्शन में कही या दिखाई गई बातों की विषयवस्तु को सूचित करता है।
- source_word: יְהוֹדְעִנַּנִי
  choice: मुझे समझा दिया
  rationale: यह ידע का कारक रूप है, अर्थात किसी को जानने या समझने योग्य बनाना; ‘समझा दिया’ उस कारक भाव को सहज आधुनिक हिन्दी में रखता है।
theological_decisions: []
