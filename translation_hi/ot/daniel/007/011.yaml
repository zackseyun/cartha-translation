id: DAN.7.11
reference: Daniel 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָזֵ֣ה הֲוֵ֔ית בֵּ/אדַ֗יִן מִן קָל֙ מִלַּיָּ֣/א רַבְרְבָתָ֔/א דִּ֥י קַרְנָ֖/א מְמַלֱּלָ֑ה חָזֵ֣ה הֲוֵ֡ית עַד֩ דִּ֨י קְטִילַ֤ת חֵֽיוְתָ/א֙ וְ/הוּבַ֣ד גִּשְׁמַ֔/הּ וִ/יהִיבַ֖ת לִ/יקֵדַ֥ת אֶשָּֽׁא־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/011.yaml
  text: I kept watching then because of the sound of the great words that the horn was speaking. I kept watching until the beast was killed[a], and its body was destroyed and given over to the burning fire.
translation:
  language: hi
  text: तब मैं उस सींग के बड़ी-बड़ी बातें[a] बोलने की आवाज़ के कारण देखता रहा। मैं तब तक देखता रहा, जब तक कि वह पशु मारा नहीं गया और उसके शरीर को नष्ट करके धधकती आग के हवाले नहीं कर दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डींग भरी बातें’ अथवा ‘घमंड भरी बातें’; शाब्दिक अर्थ ‘बड़े शब्द।’
    reason: मूल पदबंध शाब्दिक रूप से ‘बड़े शब्द’ है, जबकि प्रसंग में अहंकारी या डींग भरी वाणी का भाव निहित हो सकता है।
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: मैं देखता रहा
  rationale: कृदंत और सहायक क्रिया का मेल भूतकाल में जारी क्रिया व्यक्त करता है; ‘देखता रहा’ इस कालगत बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह दर्शन की घटनाओं का क्रम बताने वाला संक्षिप्त कालवाचक क्रियाविशेषण है।
- source_word: מִן קָל
  choice: आवाज़ के कारण
  rationale: यहाँ מִן कारण अथवा अवसर बताता है और קָל सुनाई देने वाली आवाज़ को; संयुक्त अनुवाद वाक्य का कारणात्मक संबंध स्पष्ट रखता है।
- source_word: מִלַּיָּא רַבְרְבָתָא
  choice: बड़े-बड़े शब्द
  rationale: मूल पदबंध का शाब्दिक अर्थ सुरक्षित रखा गया है। प्रसंग में डींग और घमंड का भाव संभव है, जिसे पाद-टिप्पणी में दिया गया है।
- source_word: קַרְנָא
  choice: सींग
  rationale: दर्शन के प्रतीक को बिना व्याख्यात्मक पहचान जोड़े सीधे रूप में रखा गया है।
- source_word: מְמַלֱּלָה
  choice: बोले जा रहे
  rationale: कृदंत जारी वाणी को दर्शाता है; यह रूप उसी प्रगतिशील भाव को व्यक्त करता है।
- source_word: עַד דִּי
  choice: जब तक
  rationale: यह दानिय्येल के देखते रहने की अंतिम सीमा बताने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: קְטִילַת חֵיוְתָא
  choice: वह पशु मार नहीं डाला गया
  rationale: मूल के कर्मवाच्य और दर्शन में पशु की प्रतीकात्मक छवि दोनों को सुरक्षित रखा गया है। ‘जब तक’ के साथ हिन्दी में अपेक्षित निषेधात्मक रचना अपनाई गई है।
- source_word: וְהוּבַד גִּשְׁמַהּ
  choice: उसका शरीर नष्ट नहीं किया गया
  rationale: शरीर और उसके विनाश का स्पष्ट उल्लेख रखते हुए मूल का कर्मवाच्य सुरक्षित रखा गया है।
- source_word: וִיהִיבַת לִיקֵדַת אֶשָּׁא
  choice: उसे धधकती आग के हवाले नहीं कर दिया गया
  rationale: ‘दिया गया’ के हस्तांतरण और आग में जलाए जाने के न्याय-दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना प्रतीक की अलग व्याख्या किए।
theological_decisions:
- issue: ‘बड़े-बड़े शब्दों’ को मुख्य पाठ में स्पष्ट रूप से घमंडी या निंदात्मक कहना
  choice: मुख्य पाठ में ‘बड़े-बड़े शब्द’ रखा गया
  alternative: ‘डींग भरी बातें’, ‘घमंड भरी बातें’ या ‘निंदा की बातें’
  rationale: प्रसंग अहंकारी वाणी का संकेत देता है, पर मूल पदबंध सीधे ‘बड़े शब्द’ कहता है। मुख्य पाठ उस शब्दगत खुलापन को बचाता है और निहित भाव पाद-टिप्पणी में बताता है।
- issue: पशु के न्याय के प्रतीकों की व्याख्यात्मक पहचान
  choice: ‘पशु’, ‘शरीर’ और ‘धधकती आग’ की दृश्यात्मक भाषा बनाए रखी गई
  alternative: इसे किसी राज्य के विनाश अथवा संपूर्ण न्याय के रूप में स्पष्ट करना
  rationale: पद दर्शन का वर्णन करता है; प्रतीकों की पहचान अनुवाद में जोड़ना मूल से आगे जाना होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘देखता रहा’ दर्शन की जारी क्रिया को, और ‘जब तक ... नहीं’ स्वाभाविक हिन्दी वाक्य-विन्यास को व्यक्त करता है। प्रतीकात्मक भाषा को व्याख्या में बदले बिना सुरक्षित रखा गया है।
