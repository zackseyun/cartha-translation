id: DAN.7.8
reference: Daniel 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִשְׂתַּכַּ֨ל הֲוֵ֜ית בְּ/קַרְנַיָּ֗/א וַ֠/אֲלוּ קֶ֣רֶן אָחֳרִ֤י זְעֵירָה֙ סִלְקָ֣ת ביני/הון וּ/תְלָ֗ת מִן קַרְנַיָּ/א֙ קַדְמָ֣יָתָ֔/א אתעקרו מִן קדמי/ה וַ/אֲל֨וּ עַיְנִ֜ין כְּ/עַיְנֵ֤י אֲנָשָׁ/א֙ בְּ/קַרְנָ/א דָ֔א וּ/פֻ֖ם מְמַלִּ֥ל רַבְרְבָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/008.yaml
  text: I was considering the horns[a], and behold, another horn, a little one, came up among them, and three of the first horns were uprooted before it. And behold, in this horn were eyes like the eyes of a man[b], and a mouth speaking great things.
translation:
  language: hi
  text: मैं उन सींगों को ध्यान से देख रहा था कि तभी एक और सींग—एक छोटा-सा सींग—उनके बीच से ऊपर निकला। उसके सामने पहले वाले सींगों में से तीन जड़ से उखाड़ दिए गए। फिर मैंने देखा कि इस सींग में मनुष्य की आँखों जैसी आँखें[a] थीं और बड़ी बातें बोलने वाला एक मुँह था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय आँखों जैसी आँखें।”
    reason: lexical_alternative
  - marker: b
    text: या, “घमंड की बातें बोलने वाला मुँह,” अथवा “बड़ी-बड़ी डींगें हाँकने वाला मुँह।”
    reason: alternative_reading
lexical_decisions:
- source_word: מִשְׂתַּכַּל הֲוֵית
  choice: मैं ... ध्यान से देख रहा था
  rationale: कृदंत और सहायक क्रिया भूतकाल में जारी क्रिया व्यक्त करते हैं। यह चयन दर्शन में दानिय्येल के लगातार और ध्यानपूर्वक देखने का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: בְּקַרְנַיָּא
  choice: उन सींगों को
  rationale: अरामी का निश्चित बहुवचन निकटवर्ती संदर्भ के पहचाने हुए सींगों की ओर संकेत करता है; हिन्दी में ‘उन’ यह संदर्भ स्पष्ट करता है।
- source_word: וַאֲלוּ
  choice: कि तभी / फिर मैंने देखा
  rationale: यह अव्यय दर्शन में अचानक उभरते नए दृश्य पर ध्यान खींचता है। दोनों स्थानों पर प्रसंगानुकूल, स्वाभाविक हिन्दी प्रयोग किया गया है।
- source_word: קֶרֶן אָחֳרִי זְעֵירָה
  choice: एक और सींग—एक छोटा-सा सींग
  rationale: ‘और’ तथा ‘छोटा’ दोनों अर्थ सुरक्षित हैं; पुनरुक्त apposition मूल क्रम और नए सींग पर पड़े जोर को बनाए रखती है।
- source_word: סִלְקָת בֵּינֵיהוֹן
  choice: उनके बीच से ऊपर निकला
  rationale: ‘ऊपर आना/चढ़ना’ और बहुवचन के बीच प्रकट होने की दृश्यात्मकता दोनों स्पष्ट रहती हैं।
- source_word: וּתְלָת מִן קַרְנַיָּא קַדְמָיָתָא
  choice: पहले वाले सींगों में से तीन
  rationale: कַדְמָיָתָא क्रम में पहले से मौजूद सींगों को दर्शाता है; ‘पहले वाले’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: אתעקרו
  choice: जड़ से उखाड़ दिए गए
  rationale: मूल धातु का उखाड़ने और पूर्ण हटाने का प्रबल भाव तथा रूप का कर्मवाच्य दोनों सुरक्षित हैं।
- source_word: מִן קֳדָמֵיהּ
  choice: उसके सामने
  rationale: यह स्थान या उपस्थिति—दोनों की सम्भावना खुली रखता है और हिन्दी में स्वाभाविक है।
- source_word: עַיְנִין כְּעַיְנֵי אֲנָשָׁא
  choice: मनुष्य की आँखों जैसी आँखें
  rationale: स्पष्ट उपमा और אֲנָשָׁא का एकवचन रूप बनाए रखा गया है, बिना सींग को स्वयं मनुष्य घोषित किए।
- source_word: בְּקַרְנָא דָא
  choice: इस सींग में
  rationale: सरल स्वामित्व ‘इस सींग के पास’ कहने के बजाय मूल के भीतर/में उपस्थित अंगों की विलक्षण दृश्यात्मकता रखी गई है।
- source_word: וּפֻם מְמַלִּל רַבְרְבָן
  choice: बड़ी बातें बोलने वाला एक मुँह
  rationale: यह मूलतः ‘बड़ी बातें’ के निकट रहता है और प्रसंग में दंभ का संकेत भी दे सकता है; अधिक स्पष्ट व्याख्यात्मक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या רַבְרְבָן को स्पष्ट रूप से घमंडी या अहंकारपूर्ण वाणी कहा जाए
  choice: बड़ी बातें
  alternative: घमंड की बातें / बड़ी-बड़ी डींगें
  rationale: अरामी पद का औपचारिक अर्थ ‘बड़ी बातें’ है, जबकि अहंकार का भाव प्रसंग से निकलता है। मुख्य पाठ मूल की अर्थगत व्यापकता बनाए रखता है और अधिक व्याख्यात्मक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, दर्शनात्मक वर्णन के अनुरूप गरिमापूर्ण पर सहज रखी गई है। ‘छोटा-सा सींग,’ ‘जड़ से उखाड़ दिए गए’ और ‘बड़ी बातें’ सामान्य पाठक के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न [a] और [b] मुख्य पाठ में अपने सम्बद्ध पदों के साथ उपस्थित हैं।
