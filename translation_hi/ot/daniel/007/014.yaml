base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/014.yaml
  text: And to him was given dominion and glory and a kingdom[a], that all peoples, nations, and languages should serve him. His dominion is an everlasting dominion, which will not pass away, and his kingdom is one that will not be destroyed.
translation:
  language: hi
  text: और उसे प्रभुत्व, महिमा और राज्य दिया गया, ताकि हर जाति, राष्ट्र और भाषा के लोग उसकी सेवा करें[a]। उसका प्रभुत्व सदा रहनेवाला प्रभुत्व है, जो कभी समाप्त नहीं होगा, और उसका राज्य कभी नष्ट नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी उपासना करें” या “उसे श्रद्धा से नमन करें।” अरामी क्रिया सामान्य सेवा के साथ धार्मिक सेवा भी सूचित कर सकती है; इसलिए यहाँ केवल राजनीतिक अधीनता से अधिक अर्थ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִיב
  choice: दिया गया
  rationale: अरामी रूप का निष्क्रिय अर्थ बनाए रखता है और देनेवाले को स्पष्ट रूप से जोड़े बिना निहित प्रदान को व्यक्त करता है।
- source_word: שָׁלְטָן
  choice: प्रभुत्व
  rationale: यह राजकीय अधिकार और शासन-शक्ति दोनों को व्यक्त करता है तथा पद में इसकी पुनरावृत्ति को बनाए रखने देता है।
- source_word: וִיקָר
  choice: महिमा
  rationale: राजकीय सम्मान, वैभव और गौरव के ऊँचे भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְכוּ / מַלְכוּתֵהּ
  choice: राज्य
  rationale: संदर्भ में दिए गए राजकीय शासन और उसके क्षेत्र दोनों का स्वाभाविक बोध कराता है; दोनों प्रयोगों में समान शब्द रखा गया है।
- source_word: עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: सभी लोग, राष्ट्र और भिन्न-भिन्न भाषा बोलनेवाले
  rationale: तीन समूह-सूचक पदों की व्यापकता बनाए रखते हुए हिन्दी में यह स्पष्ट करता है कि सेवा मनुष्य करते हैं, अमूर्त भाषाएँ नहीं।
- source_word: יִפְלְחוּן
  choice: उसकी सेवा करें
  rationale: क्रिया राजनीतिक अधीनता के साथ धार्मिक सेवा का भाव भी धारण कर सकती है। ‘सेवा करें’ इस अर्थ-विस्तार और उद्देश्य/परिणाम के भाव को बिना अनावश्यक रूप से सीमित किए सुरक्षित रखता है।
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: उसका प्रभुत्व सदा रहनेवाला प्रभुत्व है
  rationale: मूल की संज्ञा-पुनरावृत्ति को बनाए रखता है और क्षणभंगुर सांसारिक राज्यों के विपरीत स्थायित्व को स्पष्ट करता है।
- source_word: יֶעְדֵּה
  choice: कभी समाप्त नहीं होगा
  rationale: संदर्भ में प्रभुत्व के न मिटने, न टलने और न समाप्त होने का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: תִתְחַבַּל
  choice: कभी नष्ट नहीं होगा
  rationale: राज्य के विषय में क्रिया का प्रासंगिक अर्थ विनाश या बरबादी है, न कि नैतिक भ्रष्टता।
theological_decisions:
- issue: मनुष्य के पुत्र-सदृश व्यक्ति के प्रति יִפְלְחוּן का आशय
  choice: उसकी सेवा करें
  alternative: उसकी उपासना करें; उसे श्रद्धांजलि दें
  rationale: दानिय्येल में यह क्रिया धार्मिक सेवा का संकेत दे सकती है, पर केवल ‘उपासना’ कहना राजनीतिक निष्ठा, राजकीय सेवा और धार्मिक सेवा के बीच मूल पाठ में विद्यमान अर्थगत तनाव को आवश्यकता से अधिक निश्चित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘प्रभुत्व’ की पुनरावृत्ति मूल के बलाघात को सुरक्षित रखती है। पादटिप्पणी-चिह्न को उसी क्रिया के बाद रखा गया है जिससे वह संबंधित है।
