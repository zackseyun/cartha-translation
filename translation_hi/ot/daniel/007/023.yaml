base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/023.yaml
  text: 'Thus he said: ‘The fourth beast will be a fourth kingdom on the earth[a], which will be different from all the kingdoms[b]; and it will devour the whole earth and trample it down and crush it.’'
translation:
  language: hi
  text: 'उसने इस प्रकार कहा: “चौथा पशु पृथ्वी पर[a] चौथा राज्य होगा, जो सभी राज्यों से भिन्न होगा। वह सारी पृथ्वी को निगल जाएगा, उसे रौंदेगा और कुचल देगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश में।”
    reason: אַרְעָא का अर्थ प्रसंग के अनुसार ‘पृथ्वी’ अथवा ‘देश/भूमि’ हो सकता है।
  - marker: b
    text: या, “टुकड़े-टुकड़े कर देगा।”
    reason: अरामी क्रिया पूर्णतः कुचलने अथवा टुकड़ों में तोड़ने, दोनों प्रकार से व्यक्त की जा सकती है।
lexical_decisions:
- source_word: כֵּן אֲמַר
  choice: उसने इस प्रकार कहा
  rationale: यह व्याख्या आरम्भ करने वाला कथन है; ‘इस प्रकार’ औपचारिक किंतु स्वाभाविक हिन्दी है और प्रसंग से कर्ता ‘उसने’ स्पष्ट होता है।
- source_word: חֵיוְתָא רְבִיעָיְתָא
  choice: चौथा पशु
  rationale: दर्शन में दिखाई देने वाले भयानक जीव के लिए ‘पशु’ उपयुक्त है और प्रतीक की अपशकुनी शक्ति बनाए रखता है।
- source_word: מַלְכוּ רביעיא
  choice: एक चौथा राज्य
  rationale: अरामी पाठ स्वयं पशु की पहचान एक राजनीतिक राज्य के रूप में करता है; विधेयात्मक प्रयोग के कारण ‘एक चौथा राज्य’ स्वाभाविक है।
- source_word: בְאַרְעָא
  choice: पृथ्वी पर
  rationale: दानिय्येल 7 के विश्वव्यापी साम्राज्य-संबंधी प्रसंग में ‘पृथ्वी’ प्राथमिक अर्थ है, यद्यपि ‘देश’ भी संभव है।
- source_word: דִּי תִשְׁנֵא מִן כָּל מַלְכְוָתָא
  choice: जो दूसरे सभी राज्यों से भिन्न होगा
  rationale: क्रिया अन्य राज्यों से भिन्न या अलग होने का भाव देती है। ‘दूसरे’ जोड़ने से तुलना का आशय हिन्दी में स्पष्ट होता है, बिना नई पहचान निर्धारित किए।
- source_word: וְתֵאכֻל כָּל אַרְעָא
  choice: वह सारी पृथ्वी को निगल जाएगा
  rationale: ‘निगलना’ पशु-संबंधी हिंसक रूपक को बनाए रखता है; ‘सारी पृथ्वी’ כָּל के व्यापक अर्थ को व्यक्त करती है।
- source_word: וּתְדוּשִׁנַּהּ
  choice: उसे रौंदेगा
  rationale: यह पाँवों तले रौंदने की क्रिया को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: וְתַדְּקִנַּהּ
  choice: और कुचल देगा
  rationale: यह रौंदने के बाद और तीव्र विनाश को दर्शाता है; ‘टुकड़े-टुकड़े कर देगा’ भी संभव है।
theological_decisions:
- issue: चौथे पशु का अभिप्राय
  choice: पशु को स्पष्ट रूप से ‘एक चौथा राज्य’ कहा गया है।
  alternative: प्रतीक को राजनीतिक अर्थ दिए बिना केवल ‘पशु’ के रूप में छोड़ना।
  rationale: यह पहचान किसी बाद की व्याख्या से नहीं, इसी अरामी पद में दी गई स्वर्गदूतीय व्याख्या से आती है। किसी विशिष्ट ऐतिहासिक साम्राज्य का नाम अनावश्यक रूप से नहीं जोड़ा गया।
- issue: ‘सारी पृथ्वी’ का विस्तार
  choice: विश्वव्यापी भाषा को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल किसी सीमित देश या भूभाग तक बाँधना।
  rationale: אַרְעָא का अर्थ ‘पृथ्वी’ या ‘देश’ हो सकता है; व्यापक साम्राज्यवादी प्रसंग में ‘पृथ्वी’ उचित है, पर सीमित अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और दृश्यात्मक रूप अपनाया गया है। वाक्य में पशु से राज्य की पहचान, हिंसक क्रियाओं की क्रमिक तीव्रता और मूल पाठ की भौगोलिक व्यापकता बनाए रखी गई है।
