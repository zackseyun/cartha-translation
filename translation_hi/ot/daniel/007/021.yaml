  text: חָזֵ֣ה הֲוֵ֔ית וְ/קַרְנָ֣/א דִכֵּ֔ן עָבְדָ֥ה קְרָ֖ב עִם קַדִּישִׁ֑ין וְ/יָכְלָ֖ה לְ/הֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/021.yaml
  text: I kept watching[a], and that horn was making war with the holy ones and was prevailing over them,
translation:
  language: hi
  text: मैं देखता रहा, और वह सींग पवित्र जनों[a] से युद्ध कर रहा था और उन पर प्रबल हो रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संतों’ अथवा ‘परमेश्वर के पवित्र लोगों।’ अरामी में शाब्दिक रूप से ‘पवित्र जन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: मैं देखता रहा
  rationale: कृदंत और अस्तित्ववाचक क्रिया का संयोजन भूतकाल में जारी क्रिया को व्यक्त करता है; ‘देखता रहा’ इस दीर्घकालिक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וְקַרְנָא דִכֵּן
  choice: और वह सींग
  rationale: דִכֵּן पहले वर्णित सींग की ओर संकेत करता है; ‘वह सींग’ हिन्दी में इस पूर्वसंदर्भ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: עָבְדָה קְרָב
  choice: युद्ध कर रहा था
  rationale: शाब्दिक मुहावरा ‘युद्ध करना/बनाना’ है। हिन्दी में ‘युद्ध कर रहा था’ स्वाभाविक है और दर्शन में जारी संघर्ष का भाव बनाए रखता है।
- source_word: עִם
  choice: से
  rationale: अरामी पूर्वसर्ग का मूल अर्थ ‘साथ’ है, पर हिन्दी मुहावरे में ‘किसी से युद्ध करना’ विरोधी मुठभेड़ को स्वाभाविक रूप से व्यक्त करता है और स्रोत के संबंधात्मक ढाँचे के निकट रहता है।
- source_word: קַדִּישִׁין
  choice: पवित्र जनों
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त होकर शाब्दिक रूप से ‘पवित्र जन’ कहता है। यह चयन ‘संतों’ से जुड़ी बाद की कलीसियाई धारणाओं से बचता और संभावित व्यापक संदर्भ को खुला रखता है।
- source_word: וְיָכְלָה לְהוֹן
  choice: और उन पर प्रबल हो रहा था
  rationale: क्रिया में समर्थ होने, प्रबल पड़ने या जीतने का अर्थ है। ‘प्रबल हो रहा था’ दर्शन में चल रही प्रक्रिया को व्यक्त करता है और इसे केवल एक पूर्ण, क्षणिक विजय नहीं बनाता।
theological_decisions:
- issue: קַדִּישִׁין का अभिप्रेत समूह
  choice: पवित्र जन
  alternative: संत; परमेश्वर के पवित्र लोग
  rationale: पद स्वयं केवल ‘पवित्र जनों’ कहता है। यह रूप इस तनाव को सुरक्षित रखता है कि संदर्भ परमेश्वर की समर्पित प्रजा पर केंद्रित है या पवित्र जनों की किसी अधिक व्यापक श्रेणी पर; अनुवाद उस प्रश्न को अनावश्यक रूप से तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुरूप रखी गई है। जारी भूतकाल के लिए ‘देखता रहा’, ‘युद्ध कर रहा था’ और ‘प्रबल हो रहा था’ का समानांतर प्रयोग किया गया है।
