base_translation:
  language: en
  yaml_path: translation/ot/daniel/007/026.yaml
  text: But the court will sit[a], and his dominion will be taken away[c][b], to be destroyed and annihilated to the end.
translation:
  language: hi
  text: परन्तु न्यायसभा बैठेगी[a], और उसका शासनाधिकार[b] छीन लिया जाएगा, जिसे अन्त तक नष्ट और मिटा दिया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय बैठेगा”; अरामी में बल न्यायसभा के एकत्र होकर बैठने पर अथवा स्वयं न्यायिक कार्यवाही पर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका प्रभुत्व” अथवा “उसका शासन।”
    reason: lexical_alternative
  - marker: c
    text: या “पूरी तरह”; अरामी वाक्यांश का शाब्दिक अर्थ “अन्त तक” है और यह न्याय की अन्तिमता पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִינָא
  choice: न्यायसभा
  rationale: अरामी संज्ञा न्यायिक प्रक्रिया अथवा न्याय करने वाली सभा/न्यायपीठ को सूचित कर सकती है। ‘बैठेगी’ के साथ ‘न्यायसभा’ स्वाभाविक है और स्वर्गीय न्यायालय के बैठने का चित्र बनाए रखती है।
- source_word: יִתִּב
  choice: बैठेगी
  rationale: मूल अर्थ ‘बैठना’ है; न्यायिक प्रसंग में इसका आशय न्यायसभा के आसन ग्रहण करने अथवा कार्यवाही आरम्भ करने से है।
- source_word: שָׁלְטָנֵהּ
  choice: उसका शासनाधिकार
  rationale: यह शब्द शासन करने की सामर्थ्य, प्रभुत्व या अधिकार को दर्शाता है। ‘शासनाधिकार’ आधुनिक हिन्दी में स्पष्ट है और दानिय्येल 7 के राजकीय प्रसंग के अनुकूल है।
- source_word: יְהַעְדּוֹן
  choice: उससे छीन लिया जाएगा
  rationale: बहुवचन क्रिया यहाँ अनिश्चित अथवा निर्वैयक्तिक कर्ता के अर्थ में समझी जा सकती है। कर्मवाच्य हिन्दी किसी ऐसे कर्ता को जोड़ने से बचती है जिसका उल्लेख मूल पाठ में नहीं है; ‘उससे’ स्पष्ट करता है कि शासनाधिकार उस शासक से हटाया जाता है।
- source_word: לְהַשְׁמָדָה וּלְהוֹבָדָה
  choice: ताकि उसे नष्ट करके ... मिटा दिया जाए
  rationale: दोनों क्रियारूप उद्देश्य अथवा परिणाम बताते हुए पूर्ण विनाश को तीव्र करते हैं। ‘नष्ट’ और ‘मिटा’ की जोड़ी पुनरुक्त बल को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: עַד סוֹפָא
  choice: अन्त तक
  rationale: यह शाब्दिक अर्थ को बनाए रखता है और न्याय की अन्तिमता अथवा पूर्णता दोनों की सम्भावना खुली छोड़ता है।
theological_decisions:
- issue: ‘उसका शासनाधिकार’ का संकेत
  choice: एकवचन सर्वनाम को यथावत रखते हुए इसे पिछले प्रसंग के अहंकारी छोटे सींग से सम्बद्ध रहने दिया गया है।
  alternative: इसे समूचे चौथे पशु के शासन के व्यापक संकेत के रूप में समझना।
  rationale: निकटवर्ती प्रसंग छोटे सींग के न्याय पर बल देता है, फिर भी वह पशुरूपी राज्य से जुड़ा है। अनुवाद किसी विशिष्ट अन्त-समय के व्यक्ति या ऐतिहासिक सत्ता की पहचान जोड़कर तनाव का समाधान नहीं करता।
- issue: विनाश का व्याकरणिक लक्ष्य
  choice: ‘उसे’ निकटतम एकवचन संकेत के साथ विनाश का लक्ष्य व्यक्त करता है, जबकि सन्दर्भ शासनाधिकार और उसके धारक के घनिष्ठ सम्बन्ध को बनाए रखता है।
  alternative: केवल शासनाधिकार को विनष्ट होने वाला मानना, अथवा केवल शासक को।
  rationale: अरामी रचना संक्षिप्त है और विभक्ति-संबंध को विस्तार से नहीं खोलती। हिन्दी पाठ स्पष्ट रहते हुए इस सम्बन्ध को अनावश्यक रूप से सिद्धान्तगत नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘परन्तु’, ‘न्यायसभा’ और ‘शासनाधिकार’ दर्शन के न्यायिक तथा राजकीय स्वर को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
