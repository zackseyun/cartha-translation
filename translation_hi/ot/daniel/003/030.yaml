    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत पिछले घटनाक्रम के परिणाम और अगली घटना का क्रम बताता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: एम्फैटिक अवस्था का संज्ञा-रूप ‘राजा’ है। सन्दर्भ से नबूकदनेस्सर स्पष्ट है, पर मूल पद यहाँ उसका नाम दोबारा नहीं देता।
- source_word: הַצְלַח
  choice: समृद्ध किया
  rationale: क्रिया का कारक रूप किसी को सफल या समृद्ध करने का अर्थ देता है और राजा की सक्रिय भूमिका बनाए रखता है। ‘पदोन्नत किया’ सन्दर्भतः सम्भव है, पर मूल क्रिया के अर्थ को अधिक संकीर्ण कर देता है।
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों का आधुनिक हिन्दी देवनागरी में प्रचलित और स्रोत-संगत लिप्यन्तरण किया गया है।
- source_word: בִּמְדִינַת בָּבֶל
  choice: बाबेल प्रान्त में
  rationale: מְדִינָה प्रशासनिक क्षेत्र या प्रान्त को सूचित करता है; ‘बाबेल प्रान्त में’ हिन्दी में संक्षिप्त और स्वाभाविक है।
