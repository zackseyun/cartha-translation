source:
  edition: WLC
  text: אנתה מַלְכָּ/א֮ שָׂ֣מְתָּ טְּעֵם֒ דִּ֣י כָל אֱנָ֡שׁ דִּֽי יִשְׁמַ֡ע קָ֣ל קַרְנָ֣/א מַ֠שְׁרֹקִיתָ/א קיתרס שַׂבְּכָ֤א פְסַנְתֵּרִין֙ ו/סיפניה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א יִפֵּ֥ל וְ/יִסְגֻּ֖ד לְ/צֶ֥לֶם דַּהֲבָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/010.yaml
  text: You[a], O king, have issued a decree that every man who hears the sound of the horn, pipe, lyre[b], trigon, psaltery, and bagpipe, and every kind of music, must fall down and worship the golden image.
translation:
  language: hi
  text: हे राजा, आपने यह आदेश दिया है कि हर मनुष्य[a], जब नरसिंगे, बाँसुरी, वीणा, त्रिकोणी वीणा, स्वरमंडल, मशकबीन[b] और हर प्रकार के संगीत की ध्वनि सुने, तो गिर पड़े और सोने की मूर्ति की आराधना करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हर व्यक्ति’ अथवा ‘हर कोई’; अरामी में पुल्लिंग एकवचन का प्रयोग सामान्य प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दोहरी बाँसुरी’; इस अरामी वाद्य-नाम की ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְתָּה מַלְכָּא
  choice: हे राजा, आपने
  rationale: स्वतंत्र सर्वनाम और संबोधन को स्वाभाविक, औपचारिक राज-दरबारी हिन्दी में व्यक्त करता है; अनावश्यक बल देने के लिए ‘आपने स्वयं’ नहीं जोड़ा गया।
- source_word: שָׂמְתָּ טְּעֵם
  choice: आपने यह आदेश दिया है
  rationale: शाब्दिक मुहावरा ‘आदेश ठहराना’ है; चुना हुआ रूप उसके औपचारिक और विधिक भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: כָל אֱנָשׁ
  choice: हर मनुष्य
  rationale: अरामी में पुल्लिंग एकवचन का प्रतिनिधिक, सामान्य अर्थ है। ‘हर मनुष्य’ स्रोत के रूप और व्यापक आशय दोनों को रखता है; वैकल्पिक सहज रूप पादटिप्पणी में है।
- source_word: יִשְׁמַע קָל
  choice: ध्वनि ... सुने
  rationale: קָל का सीधा अर्थ ‘ध्वनि/आवाज़’ है और इसके बाद वाद्यों की सूची आती है।
- source_word: קַרְנָא
  choice: नरसिंगा
  rationale: सींग से बने या सींग के आकार वाले फूँक-वाद्य के लिए प्रचलित और समझने योग्य हिन्दी शब्द।
- source_word: מַשְׁרֹקִיתָא
  choice: बाँसुरी
  rationale: यह किसी फूँक-वाद्य को सूचित करता है; ‘बाँसुरी’ आधुनिक पाठक के लिए सहज है, यद्यपि उसकी ठीक बनावट निश्चित नहीं है।
- source_word: קיתרס
  choice: वीणा
  rationale: यूनानी किथारा से संबंधित तार-वाद्य के लिए सहज हिन्दी समतुल्य; यह आधुनिक पाठक को वाद्य की सामान्य श्रेणी स्पष्ट करता है।
- source_word: שַׂבְּכָא
  choice: त्रिकोणी वीणा
  rationale: संभवतः त्रिकोणाकार तार-वाद्य; यह अनिश्चित पहचान को किसी अधिक निश्चित आधुनिक वाद्य में नहीं बदलता।
- source_word: פְסַנְתֵּרִין
  choice: स्वरमंडल
  rationale: प्साल्टरी जैसे अनेक तारों वाले झंकार-वाद्य के लिए निकट और पठनीय हिन्दी नाम, साथ ही इसे सूची के अन्य वाद्यों से अलग रखता है।
- source_word: סִיפֹנְיָה
  choice: मशकबीन
  rationale: परंपरागत रूप से इसे बैगपाइप माना गया है; हिन्दी ‘मशकबीन’ उसी अर्थ को व्यक्त करता है। ठीक पहचान अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: יִפֵּל וְיִסְגֻּד
  choice: गिर पड़े और ... की आराधना करे
  rationale: दोनों क्रियाओं को अलग रखता है और मूर्ति की ओर किए गए कार्य के धार्मिक भाव को स्पष्ट करता है।
- source_word: צֶלֶם דַּהֲבָא
  choice: सोने की मूर्ति
  rationale: ‘स्वर्ण-प्रतिमा’ की अपेक्षा अधिक सामान्य आधुनिक हिन्दी, जबकि सामग्री और प्रतिमात्मक अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: אֱנָשׁ के प्रतिनिधिक पुल्लिंग का अनुवाद
  choice: हर मनुष्य
  alternative: हर व्यक्ति / हर कोई
  rationale: स्रोत में पुल्लिंग एकवचन का सामान्य प्रतिनिधिक प्रयोग है। ‘हर मनुष्य’ उस रूप को बनाए रखते हुए सभी लोगों पर लागू आदेश का अर्थ देता है।
- issue: וְיִסְגֻּד का धार्मिक बल
  choice: आराधना करे
  alternative: दण्डवत् करे / श्रद्धा से झुके
  rationale: कार्य सोने की मूर्ति की ओर निर्देशित है और प्रसंग धार्मिक निष्ठा की माँग करता है; इसलिए केवल शारीरिक झुकने की अपेक्षा ‘आराधना’ उसका धार्मिक भार बेहतर रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, औपचारिक किन्तु सहज रखी गई है। दरबारी संबोधन के लिए ‘हे राजा’ और विधिक कथन के लिए ‘आदेश दिया है’ चुना गया। दुर्लभ प्राचीन वाद्यों में जहाँ संभव हुआ वहाँ समझने योग्य हिन्दी समतुल्य दिए गए हैं, और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
