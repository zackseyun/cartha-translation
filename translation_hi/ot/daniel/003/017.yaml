reference: Daniel 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֣ן אִיתַ֗י אֱלָהַ֨/נָא֙ דִּֽי אֲנַ֣חְנָא פָֽלְחִ֔ין יָכִ֖ל לְ/שֵׁיזָבוּתַ֑/נָא מִן אַתּ֨וּן נוּרָ֧/א יָקִֽדְתָּ֛/א וּ/מִן יְדָ֥/ךְ מַלְכָּ֖/א יְשֵׁיזִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/017.yaml
  text: If it is so[a], our God whom we serve is able to deliver us from the furnace of blazing fire, and he will deliver us from your hand[c][b], O king.
translation:
  language: hi
  text: यदि ऐसा ही है[a], तो हमारा परमेश्वर, जिसकी हम सेवा करते हैं, हमें धधकती आग की भट्ठी से बचाने में समर्थ है; और हे राजा, वह हमें आपके हाथ से बचा लेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप में: “यदि ऐसी बात है।” अरामी आरम्भ एक मुहावरा है, जो राजा द्वारा दी गई दंड की धमकी की ओर संकेत करता है।'
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “वह हमें बचाए” या “वह शायद हमें बचाए” भी हो सकता है। अरामी क्रियारूप को अलग-अलग ढंग से समझा जा सकता है; मुख्य पाठ इसे विश्वासपूर्ण भविष्य-कथन मानता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן אִיתַי
  choice: यदि ऐसा ही है
  rationale: अरामी पदबंध प्रसंग में राजा की धमकी की ओर संकेत करता हुआ एक शर्तात्मक, मुहावरेदार आरम्भ है।
- source_word: אֱלָהַנָא
  choice: हमारा परमेश्वर
  rationale: सम्बन्धवाचक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: דִּי אֲנַחְנָא פָלְחִין
  choice: जिसकी हम सेवा करते हैं
  rationale: ‘सेवा’ मूल क्रिया के अर्थ को बनाए रखती है; प्रसंग से उसकी उपासना-संबंधी भावना स्पष्ट है।
- source_word: יָכִל לְשֵׁיזָבוּתַנָא
  choice: हमें ... बचाने में समर्थ है
  rationale: यह परमेश्वर की सामर्थ्य पर बल देता है और संकट से छुड़ाने के अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִן אַתּוּן נוּרָא יָקִדְתָּא
  choice: धधकती आग की भट्ठी से
  rationale: ‘भट्ठी’, ‘आग’ और उसके जलते या धधकते होने—तीनों मूल तत्त्वों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: וּמִן יְדָךְ
  choice: आपके हाथ से
  rationale: मूल रूपक को सुरक्षित रखते हुए राजा की शक्ति या अधिकार से छुटकारे का अर्थ व्यक्त करता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: प्रत्यक्ष सम्बोधन की गरिमापूर्ण और स्पष्ट हिन्दी अभिव्यक्ति।
- source_word: יְשֵׁיזִב
  choice: वह ... बचा लेगा
  rationale: मुख्य पाठ में क्रिया को विश्वासपूर्ण भविष्य-कथन माना गया है, जबकि उसकी वैकल्पिक विधि-सूचक सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अन्तिम अपूर्ण क्रिया יְשֵׁיזִב का भाव
  choice: 'विश्वासपूर्ण भविष्य-कथन: ‘वह हमें ... बचा लेगा’'
  alternative: ‘वह हमें ... बचा सकता है’ अथवा ‘वह हमें ... बचाए’
  rationale: वाक्य-विन्यास और राजा के सामने दिया गया उत्तर दृढ़ विश्वास का कथन सुझाते हैं। अगले पद में ‘यदि वह ऐसा न भी करे’ की स्वीकृति इस दृढ़ कथन के साथ मौजूद वास्तविक धर्मवैचारिक तनाव को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज रूप अपनाया गया है। ‘परमेश्वर’, ‘समर्थ’, ‘हे राजा’ और ‘आपके हाथ से’ कथन की औपचारिकता तथा मूल रूपक को बनाए रखते हैं; ‘धधकती आग की भट्ठी’ सामान्य पाठक के लिए स्वाभाविक है।
