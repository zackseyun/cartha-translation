  text: וּ/לְ/גֻבְרִ֤ין גִּבָּֽרֵי חַ֨יִל֙ דִּ֣י בְ/חַיְלֵ֔/הּ אֲמַר֙ לְ/כַפָּתָ֔ה לְ/שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ לְ/מִרְמֵ֕א לְ/אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/020.yaml
  text: And he commanded certain mighty men of valor who were in his army to bind Shadrach[a], Meshach, and Abednego, to throw them into the blazing furnace of fire.
translation:
  language: hi
  text: और उसने अपनी सेना के कुछ बलवान योद्धाओं को आज्ञा दी कि वे शद्रक, मेशक और अबेदनगो को बाँधकर धधकती आग की भट्ठी में फेंक दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְגֻבְרִין גִּבָּרֵי חַיִל
  choice: अपनी सेना के कुछ बलवान योद्धाओं को
  rationale: यह पदबंध सामर्थी और युद्ध-कुशल पुरुषों को दर्शाता है। ‘बलवान योद्धा’ सैन्य संदर्भ और शारीरिक सामर्थ्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कुछ’ अरामी के अनिश्चित बहुवचन भाव को सामने लाता है।
- source_word: דִּי בְחַיְלֵהּ
  choice: अपनी सेना के
  rationale: यहाँ חַיִל अमूर्त ‘सामर्थ्य’ नहीं, राजा की सैन्य टुकड़ी या सेना को सूचित करता है। सम्बन्धवाचक उपवाक्य को हिन्दी में संक्षिप्त विशेषणात्मक रूप दिया गया है।
- source_word: אֲמַר
  choice: आज्ञा दी
  rationale: क्रिया का मूल अर्थ ‘कहा’ है, पर इसके बाद आए उद्देश्यसूचक क्रियारूप इसे स्पष्ट आदेश बनाते हैं। ‘आज्ञा दी’ कथानक की गरिमा और निर्देश की शक्ति दोनों रखता है।
- source_word: לְכַפָּתָה
  choice: बाँधकर
  rationale: क्रिया का अर्थ बाँधना या कसकर बाँधना है। अगले कार्य से इसका क्रमिक सम्बन्ध हिन्दी के ‘बाँधकर ... फेंक दें’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों को आधुनिक मानक हिन्दी में प्रचलित बाइबिलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: לְמִרְמֵא
  choice: फेंक दें
  rationale: यह क्रिया फेंकने या डाल देने को दर्शाती है। ‘फेंक दें’ आधुनिक हिन्दी में बलपूर्वक किए जाने वाले कार्य को स्पष्ट करता है।
- source_word: לְאַתּוּן נוּרָא יָקִדְתָּא
  choice: धधकती आग की भट्ठी में
  rationale: ‘भट्ठी’, ‘आग’ और जलने/धधकने के तीनों अर्थ-तत्त्व सुरक्षित हैं। ‘धधकती आग की भट्ठी’ सहज, सजीव और स्रोत के जोर के निकट है।
