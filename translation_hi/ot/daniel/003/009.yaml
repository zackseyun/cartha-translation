- source_word: עֲנוֹ וְאָמְרִין
  choice: उन्होंने ... कहा
  rationale: अरामी का शाब्दिक उत्तर-सूत्र ‘उन्होंने उत्तर दिया और कहा’ हिन्दी में अनावश्यक रूप से भारी लगता है; प्रसंग में ‘उन्होंने कहा’ उत्तर देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִנְבוּכַדְנֶצַּר מַלְכָּא
  choice: राजा नबूकदनेस्सर से
  rationale: पूर्वसर्ग संबोधित व्यक्ति को दर्शाता है और उपाधि को नाम से पहले रखना आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַלְכָּא (second occurrence)
  choice: हे राजा
  rationale: दूसरी आवृत्ति प्रत्यक्ष, सम्मानपूर्ण राजकीय संबोधन है; ‘हे राजा’ उसके संबोधन-बल को सुरक्षित रखता है।
- source_word: לְעָלְמִין חֱיִי
  choice: आप सदा जीवित रहें
  rationale: शाब्दिक रूप ‘युगों तक जीवित रहिए’ है, पर यह एक प्रचलित राजदरबारी अभिवादन है। सम्मानसूचक ‘आप’ और विधिलिंग ‘रहें’ हिन्दी में उसके कामनात्मक भाव को स्वाभाविक ढंग से व्यक्त करते हैं।
