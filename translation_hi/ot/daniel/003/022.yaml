  yaml_path: translation/ot/daniel/003/022.yaml
  text: Because of this, since the king’s command was harsh and the furnace had been heated exceedingly, the flame of the fire killed those men who brought up Shadrach, Meshach, and Abed-nego.
translation:
  language: hi
  text: इस कारण कि राजा की आज्ञा कठोर थी और भट्ठी बहुत अधिक तपाई गई थी, आग की लपट ने उन पुरुषों को मार डाला जो शद्रक, मेशक और अबेदनगो को ऊपर ले गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל קֳבֵל דְּנָה
  choice: इस कारण
  rationale: यह अरामी कारणसूचक पद का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: מִלַּת מַלְכָּא מַחְצְפָה
  choice: राजा की आज्ञा कठोर थी
  rationale: מַחְצְפָה आज्ञा की कठोरता या कड़ाई बताता है; संदर्भ में ‘कठोर’ अर्थ को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: אַתּוּנָא אֵזֵה יַתִּירָא
  choice: भट्ठी बहुत अधिक तपाई गई थी
  rationale: अरामी में भट्ठी के अत्यधिक गरम किए जाने का भाव है; हिन्दी में ‘तपाई गई’ अग्नि-भट्ठी के लिए स्वाभाविक है।
- source_word: שְׁבִיבָא דִּי נוּרָא
  choice: आग की लपट
  rationale: שְׁבִיבָא अग्नि की ज्वाला या लपट को सूचित करता है; ‘लपट’ प्रसंग में स्पष्ट और सहज है।
- source_word: הַסִּקוּ
  choice: ऊपर ले गए थे
  rationale: क्रिया का मूल भाव ऊपर चढ़ाने या ले जाने का है, सम्भवतः ऊँचे भट्ठी-मुख की ओर; मूल की स्थानिक अभिव्यक्ति बनाए रखी गई है।
