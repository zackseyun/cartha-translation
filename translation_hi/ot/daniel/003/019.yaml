base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/019.yaml
  text: Then Nebuchadnezzar was filled with fury[a], and the expression of his face was changed against Shadrach, Meshach, and Abed-nego. He answered and said to heat the furnace seven times more than it was usually heated.
translation:
  language: hi
  text: तब नबूकदनेस्सर क्रोध से भर गया, और शद्रक, मेशक और अबेदनगो के प्रति उसके चेहरे का भाव बदल गया। उसने उत्तर दिया और आदेश दिया कि भट्ठी को सामान्यतः जितनी गरम की जाती थी, उससे सात गुना[a] गरम किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अरामी मुहावरा: ‘सातगुना’; अर्थात भट्ठी को उसके सामान्य ताप की सात गुनी तीव्रता तक गरम करना।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम का परिचय देता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से कथा का क्रम बनाए रखता है।
- source_word: הִתְמְלִי חֱמָא
  choice: क्रोध से भर गया
  rationale: क्रिया और संज्ञा मिलकर अत्यन्त क्रोधित हो जाने का भाव व्यक्त करती हैं; यह रूपक को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: וּצְלֵם אַנְפּוֹהִי אשתנו
  choice: उसके चेहरे का भाव बदल गया
  rationale: शाब्दिक अर्थ चेहरे की आकृति या रूप बदलने का है; प्रसंग में यह दिखाई देने वाले चेहरे के भाव को दर्शाता है।
- source_word: עַל
  choice: के प्रति
  rationale: प्रसंग में यह तीनों पुरुषों की ओर शत्रुतापूर्ण रुख दर्शाता है; ‘के प्रति’ वाक्य में स्वाभाविक है और शत्रुता का भाव आसपास के क्रोध और बदले हुए चेहरे से स्पष्ट रहता है।
- source_word: עָנֵה וְאָמַר
  choice: उसने उत्तर दिया और आज्ञा दी
  rationale: ‘उत्तर दिया’ सामी कथन-सूत्र के पहले अंग को सुरक्षित रखता है, जबकि अगले उद्देश्यवाचक रूप को हिन्दी में ‘आज्ञा दी कि’ स्वाभाविक और प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: לְמֵזֵא לְאַתּוּנָא
  choice: भट्ठी को ... गरम किया जाए
  rationale: अरामी उद्देश्यवाचक रूप भट्ठी का ताप बढ़ाने की राजाज्ञा व्यक्त करता है; हिन्दी का कर्मवाच्य आदेश की भाषा में स्वाभाविक है।
- source_word: חַד שִׁבְעָה
  choice: सात गुना
  rationale: अरामी अभिव्यक्ति सात गुने परिमाण या तीव्रता को दर्शाती है; ‘सात गुना’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: עַל דִּי חֲזֵה לְמֵזְיֵהּ
  choice: सामान्य से ... अधिक गरम
  rationale: यह मुहावरेदार उपवाक्य उस प्रचलित या उचित तापमान से आगे बढ़ाने का भाव देता है जिस तक भट्ठी सामान्यतः गरम की जाती थी।
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों को प्रचलित हिन्दी बाइबलीय रूपों में लिप्यंतरित किया गया है।
