base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/002.yaml
  text: Then King Nebuchadnezzar sent to assemble the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces, to come to the dedication of the image that King Nebuchadnezzar had set up.
translation:
  language: hi
  text: तब राजा नबूकदनेस्सर ने क्षत्रपों, प्रशासकों, राज्यपालों, सलाहकारों, कोषाध्यक्षों, न्यायाधीशों, दंडाधिकारियों और प्रान्तों के सभी अधिकारियों को इकट्ठा होने के लिए संदेश भेजा, ताकि वे उस प्रतिमा[a] के समर्पण समारोह में आएँ जिसे राजा नबूकदनेस्सर ने स्थापित किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ति।” अरामी शब्द सामान्य रूप से किसी छवि को या, इस प्रसंग में, किसी विशाल प्रतिमा को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח
  choice: संदेश भेजा
  rationale: मूल क्रिया का अर्थ ‘भेजना’ है। हिन्दी में व्यक्तियों को एकत्र होने के लिए ‘संदेश भेजा’ कहना स्वाभाविक है और प्रसंग में निहित राजकीय बुलावे को व्यक्त करता है।
- source_word: לְמִכְנַשׁ
  choice: इकट्ठा होने के लिए
  rationale: अरामी रूप लोगों को एक स्थान पर एकत्र करने या बुलाने का उद्देश्य बताता है। यह सहज आधुनिक हिन्दी है।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रपों
  rationale: यह फ़ारसी प्रशासनिक पदनाम है। ऐतिहासिक साम्राज्यिक परिवेश और पदों के भेद को बनाए रखने के लिए प्रचलित शब्द ‘क्षत्रप’ रखा गया है।
- source_word: סִגְנַיָּא
  choice: प्रशासकों
  rationale: यह एक उच्च प्रशासनिक पद था। ‘प्रशासक’ आधुनिक पाठक के लिए स्पष्ट है, यद्यपि पद का सटीक आधुनिक समकक्ष निश्चित नहीं है।
- source_word: פַחֲוָתָא
  choice: राज्यपालों
  rationale: यह प्रादेशिक शासन से जुड़ा मान्य पदनाम है; ‘राज्यपाल’ हिन्दी में इसका स्पष्ट प्रशासनिक समकक्ष है।
- source_word: אֲדַרְגָּזְרַיָּא
  choice: सलाहकारों
  rationale: पद का ठीक कार्य कुछ अनिश्चित है, पर यह उच्च अधिकारियों के एक सलाहकारी वर्ग को सूचित करता प्रतीत होता है।
- source_word: גְדָבְרַיָּא
  choice: कोषाध्यक्षों
  rationale: यह शब्द सामान्यतः राजकोष या वित्त का प्रबन्ध करने वाले अधिकारियों के लिए समझा जाता है।
- source_word: דְּתָבְרַיָּא
  choice: न्यायाधीशों
  rationale: शब्द कानूनी निर्णय देने वाले अधिकारियों से जुड़ा है; ‘न्यायाधीश’ इसका सीधा और सुबोध रूप है।
- source_word: תִּפְתָּיֵא
  choice: दंडनायकों
  rationale: यह एक अन्य न्यायिक या नागरिक अधिकारी-वर्ग का पद है, जिसकी सटीक भूमिका विवादित है। ‘दंडनायक’ न्यायिक-प्रशासनिक भाव और पद-सूची का भेद बनाए रखता है।
- source_word: שִׁלְטֹנֵי מְדִינָתָא
  choice: प्रान्तों के सभी अधिकारियों
  rationale: विशिष्ट पदों की सूची के बाद यह प्रान्तीय शासकीय अधिकारियों के लिए व्यापक समाहारक पद है।
- source_word: לְמֵתֵא
  choice: आएँ
  rationale: मूल क्रिया का सीधा अर्थ ‘आना’ है। इसे ‘उपस्थित हों’ बनाकर अधिक व्याख्यात्मक करने के बजाय मूल गति-भाव रखा गया है।
- source_word: חֲנֻכַּת
  choice: समर्पण समारोह
  rationale: संज्ञा किसी वस्तु के औपचारिक समर्पण या उद्घाटन के अवसर को बताती है। ‘समर्पण समारोह’ हिन्दी में घटना का स्वरूप स्पष्ट करता है।
- source_word: צַלְמָא
  choice: प्रतिमा
  rationale: यह शब्द सामान्यतः छवि और इस प्रसंग में खड़ी की गई विशाल मूर्ति या प्रतिमा को सूचित कर सकता है। ‘प्रतिमा’ प्रसंगानुकूल है और ‘मूर्ति’ से जुड़ी अतिरिक्त धार्मिक ध्वनि को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: הֲקֵים
  choice: खड़ा कराया था
  rationale: हिफ़ील रूप स्थापित करने या खड़ा कराने का कारक भाव रखता है; राजा द्वारा निर्माण/स्थापना करवाने के प्रसंग में यह स्वाभाविक हिन्दी है।
