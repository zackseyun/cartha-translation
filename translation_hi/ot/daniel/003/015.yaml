source:
  edition: WLC
  text: כְּעַ֞ן הֵ֧ן אִֽיתֵי/כ֣וֹן עֲתִידִ֗ין דִּ֣י בְ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַשְׁרוֹקִיתָ֣/א קיתרס שַׂבְּכָ֡א פְּסַנְתֵּרִין֩ וְ/סוּמְפֹּ֨נְיָ֜ה וְ/כֹ֣ל זְנֵ֣י זְמָרָ֗/א תִּפְּל֣וּן וְ/תִסְגְּדוּן֮ לְ/צַלְמָ֣/א דִֽי עַבְדֵת֒ וְ/הֵן֙ לָ֣א תִסְגְּד֔וּן בַּ/הּ שַׁעֲתָ֣/ה תִתְרְמ֔וֹן לְ/גֽוֹא אַתּ֥וּן נוּרָ֖/א יָקִֽדְתָּ֑/א וּ/מַן ה֣וּא אֱלָ֔הּ דֵּ֥י יְשֵֽׁיזְבִנְ/כ֖וֹן מִן יְדָֽ/י־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/015.yaml
  text: Now if you are ready[a], when you hear the sound of the horn, pipe, lyre, trigon, harp, and bagpipe, and every kind of music, to fall down and worship the image that I have made, well and good. But if you do not worship, in that very hour you will be thrown into the midst of a blazing furnace of fire[d][c][b]. And who is the god who will deliver you out of my hands?
translation:
  language: hi
  text: अब यदि तुम तैयार हो कि जब तुम नरसिंगा, बाँसुरी, वीणा, त्रिकोण-वीणा[a], हार्प[b], मशकबीन[c] और हर प्रकार के संगीत की ध्वनि सुनोगे, तब गिरकर उस मूर्ति की उपासना करोगे जिसे मैंने बनवाया है, तो ठीक है।[d] लेकिन यदि तुम उसकी उपासना नहीं करोगे, तो उसी घड़ी तुम्हें धधकती आग की भट्ठी के बीच फेंक दिया जाएगा। और ऐसा कौन-सा देवता है जो तुम्हें मेरे हाथों से छुड़ा सकेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘त्रिकोणाकार तार-वाद्य’; שַׂבְּכָא से अभिप्रेत वाद्य की ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: इस वाद्य (פְּסַנְתֵּרִין) को पारंपरिक रूप से ‘प्साल्टरी’ भी कहा जाता है।
    reason: lexical_alternative
  - marker: c
    text: संभवतः ‘दोहरी बाँसुरी’; סוּמְפֹּנְיָה की पहचान विवादित है। पुराना अंग्रेज़ी शब्द ‘सिम्फनी’ इस शब्द के रूप को प्रतिबिंबित करता है, आधुनिक वाद्यवृंद को नहीं।
    reason: lexical_alternative
  - marker: d
    text: ‘तो ठीक है’ मूल अरामी में व्यक्त नहीं है। वहाँ ‘जिसे मैंने बनवाया है’ के बाद वाक्य अधूरा छोड़ दिया गया है; आशय है कि आज्ञा मानने पर दण्ड नहीं दिया जाएगा।
    reason: elliptical_source
lexical_decisions:
- source_word: כְּעַן הֵן אִיתֵיכון עֲתִידִין
  choice: अब यदि तुम तैयार हो
  rationale: अरामी वाक्यांश राजा की तत्काल चुनौती को शर्त के रूप में रखता है; यह हिन्दी में स्वाभाविक रहते हुए ‘तैयार’ होने का भाव बनाए रखता है।
- source_word: קַרְנָא מַשְׁרוֹקִיתָא קיתרס
  choice: नरसिंगा, बाँसुरी, वीणा
  rationale: ये क्रमशः फूँककर और तारों से बजाए जाने वाले वाद्यों के सुबोध हिन्दी नाम हैं; जहाँ पहचान अपेक्षाकृत स्पष्ट है वहाँ अनावश्यक लिप्यंतरण से बचा गया है।
- source_word: שַׂבְּכָא
  choice: त्रिकोण-वीणा
  rationale: वाद्य की सटीक पहचान अनिश्चित है; सम्भावित त्रिकोणाकार तार-वाद्य का संकेत मुख्य पाठ में दिया गया और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: פְּסַנְתֵּרִין
  choice: हार्प
  rationale: यह किसी तार-वाद्य का नाम है। आधुनिक पाठक के लिए ‘हार्प’ सुबोध है, जबकि पारम्परिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: סוּמְפֹּנְיָה
  choice: मशकबीन
  rationale: यह बहसग्रस्त वाद्य-नाम है; ‘मशकबीन’ सामान्यतः प्रस्तावित बैगपाइप-सदृश अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, और दूसरा सम्भव अर्थ पादटिप्पणी में है।
- source_word: בַּהּ שַׁעֲתָה תִתְרְמוֹן לְגוֹא אַתּוּן נוּרָא יָקִדְתָּא
  choice: उसी घड़ी तुम्हें धधकती आग की भट्ठी के बीच फेंक दिया जाएगा
  rationale: ‘उसी घड़ी’ दण्ड की तात्कालिकता, ‘बीच’ मूल के आन्तरिक स्थान, और ‘धधकती आग की भट्ठी’ तीव्र जलन के भाव को सुरक्षित रखता है।
- source_word: וּמַן הוּא אֱלָהּ דֵּי יְשֵׁיזְבִנְכוֹן מִן יְדָי
  choice: और ऐसा कौन-सा देवता है जो तुम्हें मेरे हाथों से छुड़ा सकेगा?
  rationale: प्रश्न राजा की उद्दंड चुनौती को बनाए रखता है; ‘देवता’ यहाँ किसी देवता के लिए प्रयुक्त सामान्य संज्ञा है और ‘मेरे हाथों से’ मूल रूपक के निकट है।
theological_decisions:
- issue: मूर्ति के सामने סגד का अर्थ
  choice: उपासना करना
  alternative: दण्डवत् करना / श्रद्धा प्रकट करना
  rationale: मूल में गिरने की शारीरिक क्रिया अलग से व्यक्त है; मूर्ति के प्रसंग में ‘उपासना’ धार्मिक निष्ठा की माँग को स्पष्ट करती है और दोनों क्रियाओं को एक नहीं करती।
- issue: नबूकदनेस्सर की चुनौती में אֱלָהּ
  choice: देवता
  alternative: परमेश्वर
  rationale: वक्ता किसी एक सच्चे परमेश्वर को स्वीकार नहीं कर रहा, बल्कि सामान्य और चुनौतीपूर्ण ढंग से पूछ रहा है कि कौन-सा देवता उसके अधिकार से बचा सकता है।
- issue: ‘जिसे मैंने बनवाया है’ के बाद लुप्त शर्त-परिणाम
  choice: तो ठीक है
  alternative: वाक्य को अधूरा छोड़ना
  rationale: अरामी में आज्ञापालन वाली शर्त का परिणाम स्पष्ट रूप से नहीं कहा गया है। हिन्दी में अर्थपूर्ण वाक्य के लिए न्यूनतम पूर्ति की गई है और पादटिप्पणी में मूल की अपूर्णता बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। परिचित वाद्यों के लिए सामान्य हिन्दी नाम और अनिश्चित विदेशी वाद्यों के लिए समझ में आने वाले नाम चुने गए हैं। राजा की धमकी सीधी और कठोर है, पर अनावश्यक रूप से अलंकृत नहीं।
