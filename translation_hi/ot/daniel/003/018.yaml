reference: Daniel 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵ֣ן לָ֔א יְדִ֥יעַ לֶהֱוֵא לָ֖/ךְ מַלְכָּ֑/א דִּ֤י ל/אלהי/ך לָא איתי/נא פָֽלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א נִסְגֻּֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/018.yaml
  text: But if not[a], let it be known to you, O king, that we will not serve your gods, and we will not bow down to the golden image that you have set up.
translation:
  language: hi
  text: पर यदि नहीं[a], तो हे राजा, आपको मालूम हो कि हम आपके देवताओं की सेवा नहीं करेंगे और सोने के उस प्रतिरूप के सामने, जिसे आपने स्थापित किया है, दण्डवत नहीं करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “पर यदि ऐसा न भी हो”; पिछले पद से निहित अर्थ है: “यदि वह हमें न बचाए।”'
    reason: वैकल्पिक पाठ और मूल में निहित पर अनकहे आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וְהֵן לָא
  choice: पर यदि नहीं
  rationale: यह अरामी मुहावरा पिछले पद में कही गई छुटकारे की आशा के विपरीत संभावना प्रस्तुत करता है। संक्षिप्त और अपूर्ण कथन मूल की अर्थगत अनिर्दिष्टता बनाए रखता है।
- source_word: יְדִיעַ לֶהֱוֵא לָךְ
  choice: आपको मालूम हो
  rationale: यह निर्वैयक्तिक घोषणा का स्वाभाविक आधुनिक हिन्दी रूप है और राजा को संबोधित औपचारिक दृढ़ता बनाए रखता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: संबोधन कारक को गरिमापूर्ण और स्पष्ट रूप में व्यक्त करता है।
- source_word: לֵאלָהָיִךְ ... פָלְחִין
  choice: आपके देवताओं की सेवा नहीं करेंगे
  rationale: פְּלַח का मूल अर्थ सेवा करना है; प्रसंग में धार्मिक सेवा निहित है, पर अनुवाद उसे केवल ‘पूजा’ कहकर सीमित नहीं करता। कृदंत यहाँ उनकी दृढ़ वर्तमान-भावी अस्वीकृति व्यक्त करता है।
- source_word: צֶלֶם דַּהֲבָא
  choice: सोने का प्रतिरूप
  rationale: צֶלֶם के ‘प्रतिरूप/मूर्ति’ अर्थ और דַּהֲבָא की पदार्थ-सूचना को व्यक्त करता है, बिना वस्तु का आकार अनावश्यक रूप से निर्धारित किए।
- source_word: הֲקֵימְתָּ
  choice: आपके खड़े कराए हुए
  rationale: राजा द्वारा पहले ही उस प्रतिरूप को स्थापित करवाने की पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִסְגֻּד
  choice: दण्डवत नहीं करेंगे
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि तक नत होने को दर्शाती है। ‘दण्डवत’ आराधनात्मक प्रसंग सहित उस ठोस क्रिया को बनाए रखता है।
theological_decisions:
- issue: आरंभिक सशर्त कथन की अनिर्दिष्टता
  choice: पर यदि नहीं
  alternative: पर यदि वह हमें न बचाए
  rationale: पिछला पद उस बात की पूर्ति करता है जो यहाँ कही नहीं गई है। मूल की संक्षिप्त अनिर्दिष्टता को बनाए रखने से विश्वास और संभावित न-छुटकारे के बीच का धार्मिक तनाव चुपचाप हल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृढ़ राजदरबारी संबोधन। ‘आप’ से सम्मान बना रहता है; ‘मालूम हो’ सामान्य पाठक के लिए ‘विदित हो’ से अधिक सहज है।
