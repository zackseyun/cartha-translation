translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। सामी वचन-सूत्रों का अर्थ सुरक्षित रखते हुए हिन्दी में अस्वाभाविक दोहराव से बचा गया है। उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से हटे हुए प्रतीत होते हैं; हिन्दी मुख्य पाठ में [a] को ‘सलाहकारों’ और [b] को ‘आग के बीच में’ पर स्रोत-संगत स्थान दिया गया है।
