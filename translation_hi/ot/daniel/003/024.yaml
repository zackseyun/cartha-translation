reference: Daniel 3:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֱדַ֨יִן֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א תְּוַ֖הּ וְ/קָ֣ם בְּ/הִתְבְּהָלָ֑ה עָנֵ֨ה וְ/אָמַ֜ר לְ/הַדָּֽבְר֗וֹ/הִי הֲ/לָא֩ גֻבְרִ֨ין תְּלָתָ֜א רְמֵ֤ינָא לְ/גוֹא נוּרָ/א֙ מְכַפְּתִ֔ין עָנַ֤יִן וְ/אָמְרִין֙ לְ/מַלְכָּ֔/א יַצִּיבָ֖א מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/024.yaml
  text: Then King Nebuchadnezzar was astonished and rose up in haste[a]. He answered and said to his counselors, “Did we not throw three men, bound, into the midst of the fire?” They answered and said to the king, “Certainly[b], O king.”
translation:
  language: hi
  text: तब राजा नबूकदनेस्सर चकित हो गया और घबराकर झट से उठ खड़ा हुआ। उसने अपने सलाहकारों[a] से कहा, “क्या हमने तीन पुरुषों को बाँधकर आग के बीच में[b] नहीं फेंका था?” उन्होंने राजा को उत्तर दिया, “निश्चय ही, हे राजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने अधिकारियों’ अथवा ‘अपने मंत्रियों’; अरामी शब्द राजदरबार में राजा की सेवा करने वाले व्यक्तियों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या केवल ‘आग में’; अरामी में अधिक पूर्ण रूप से ‘आग के बीच में’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले घटनाक्रम को आरंभ करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक रूप से क्रम बनाए रखता है।
- source_word: תְּוַהּ
  choice: चकित हो गया
  rationale: क्रिया अचानक विस्मय और व्याकुलता का भाव देती है; भट्ठी में दिखाई दिए दृश्य पर राजा की प्रतिक्रिया के लिए यह उपयुक्त है।
- source_word: בְּהִתְבְּהָלָה
  choice: घबराकर झट से
  rationale: इस पद में शीघ्रता के साथ व्याकुलता भी निहित है; यह अनुवाद दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָנֵה וְאָמַר
  choice: उसने … से कहा
  rationale: यह मानक सामी भाषायी वचन-सूत्र है। हिन्दी में ‘उत्तर देकर कहा’ यहाँ अस्वाभाविक लगेगा क्योंकि पहले कोई प्रश्न नहीं है; ‘कहा’ उसके कार्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: לְהַדָּבְרוֹהִי
  choice: अपने सलाहकारों
  rationale: यह संज्ञा राजदरबार में राजा की सेवा करने वाले सलाहकारी या प्रशासनिक व्यक्तियों को सूचित करती है; ‘सलाहकार’ तत्काल प्रसंग में उपयुक्त है।
- source_word: הֲלָא
  choice: क्या … नहीं
  rationale: यह ऐसी आलंकारिक प्रश्न-रचना है जिसमें पुष्टि की अपेक्षा है; हिन्दी में ‘क्या … नहीं’ उसी बल को बनाए रखता है।
- source_word: גֻבְרִין תְּלָתָא
  choice: तीन पुरुषों
  rationale: यह संख्या और पुरुषवाचक संज्ञा का सीधा तथा प्रसंगानुकूल अनुवाद है।
- source_word: רְמֵינָא
  choice: फेंका था
  rationale: अरामी क्रिया का अर्थ फेंकना या डालना है; ‘फेंका’ बलपूर्वक किए गए कार्य और आधुनिक कथात्मक शैली, दोनों के अनुकूल है।
- source_word: לְגוֹא נוּרָא
  choice: आग के बीच में
  rationale: לְגוֹא आग के भीतर या मध्य में होने का स्थानिक भाव देता है; ‘बीच में’ उस पूर्ण अर्थ को सुरक्षित रखता है।
- source_word: מְכַפְּתִין
  choice: बाँधकर
  rationale: यह उन पुरुषों की बँधी हुई अवस्था बताता है। हिन्दी वाक्य में ‘बाँधकर’ स्वाभाविक रूप से बताता है कि फेंके जाते समय वे बँधे थे।
- source_word: עָנַיִן וְאָמְרִין
  choice: उन्होंने … उत्तर दिया
  rationale: मानक सामी वचन-सूत्र का हिन्दी में स्वाभाविक समतुल्य ‘उत्तर दिया’ है; दोनों मूल क्रियाओं को यांत्रिक रूप से दोहराने से बचते हुए प्रत्युत्तर का अर्थ सुरक्षित है।
- source_word: יַצִּיבָא
  choice: निश्चय ही
  rationale: यह सत्यता या निश्चित पुष्टि व्यक्त करता है; राजा के प्रश्न के उत्तर में ‘निश्चय ही’ स्वाभाविक और सम्मानपूर्ण है।
