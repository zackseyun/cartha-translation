    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַן דִּי
  choice: और जो कोई
  rationale: यह अनिश्चित सम्बन्धवाचक अरामी पद सामान्य और सार्वभौमिक शर्त व्यक्त करता है; ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לָא יִפֵּל וְיִסְגֻּד
  choice: गिरकर दण्डवत् न करे
  rationale: दोनों क्रियाएँ शारीरिक रूप से गिरने और आराधनापूर्ण प्रणाम करने को साथ रखती हैं। हिन्दी में ‘गिरकर दण्डवत् करना’ दोनों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּהּ שַׁעֲתָא
  choice: उसी घड़ी
  rationale: मूल का शाब्दिक समय-सूचक मुहावरा सुरक्षित रहता है और तत्काल दण्ड का भाव भी व्यक्त होता है।
- source_word: יִתְרְמֵא
  choice: फेंक दिया जाएगा
  rationale: अरामी क्रिया का कर्मवाच्य अर्थ स्पष्ट है; यह आधुनिक हिन्दी में सहज और सीधा है।
- source_word: לְגוֹא
  choice: के बीच में
  rationale: यह भट्ठी के भीतर या मध्य में फेंके जाने की सजीवता बनाए रखता है।
- source_word: אַתּוּן
  choice: भट्ठी
  rationale: इस प्रसंग में बड़ी अग्नि-भट्ठी के लिए यही सर्वाधिक स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: נוּרָא יָקִדְתָּא
  choice: धधकती आग
  rationale: शाब्दिक रूप से ‘जलती हुई आग’ का तीव्र भाव आधुनिक, स्वाभाविक हिन्दी में व्यक्त होता है।
