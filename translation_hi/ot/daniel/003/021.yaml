translation:
  language: hi
  text: तब उन पुरुषों को उनकी पतलूनें, कुर्ते, चोगे और दूसरे वस्त्र पहने हुए बाँधा गया और उन्हें धधकती आग की भट्ठी के बीच में फेंक दिया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथानक-सूचक अगले क्रमिक घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: उन पुरुषों
  rationale: संज्ञा और संकेतवाचक शब्द पहले उल्लिखित तीन यहूदी अधिकारियों की ओर संकेत करते हैं; हिन्दी में ‘उन पुरुषों’ कथानक-संदर्भ में स्वाभाविक है।
- source_word: כְּפִתוּ
  choice: बाँध दिया गया
  rationale: कर्मवाच्य रूप बताता है कि भट्ठी में फेंके जाने से पहले उन्हें बाँधा गया था।
- source_word: סַרְבָּלֵיהוֹן
  choice: उनकी पतलूनों
  rationale: यह सम्भवतः निचले शरीर के फ़ारसी ढंग के वस्त्र का नाम है; ‘पतलून’ उपलब्ध साक्ष्य के अनुसार सबसे सटीक सामान्य हिन्दी शब्द है।
- source_word: פטישי/הון
  choice: कुरतों
  rationale: यह दुर्लभ और अनिश्चित वस्त्र-शब्द है। सूची में इसे पतलून और चोगे से भिन्न मुख्य परिधान मानते हुए ‘कुरते’ पठनीय किंतु सावधान चयन है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כַרְבְּלָתְהוֹן
  choice: चोगों
  rationale: यह बाहरी ओढ़ने या पहनने के वस्त्र को सूचित करता है; ‘चोगा’ अन्य सूचीबद्ध परिधानों से इसे स्पष्ट रूप से अलग रखता है।
- source_word: לְבֻשֵׁיהוֹן
  choice: दूसरे वस्त्रों
  rationale: यह वस्त्रों के लिए व्यापक शब्द है और विशिष्ट परिधानों की सूची के अंत में शेष पहनावे को समेटता है।
- source_word: וּרְמִיו
  choice: फेंक दिया गया
  rationale: कथानक में पुरुष क्रिया के भोक्ता हैं; हिन्दी कर्मवाच्य इसी केंद्रबिंदु को बनाए रखता है।
- source_word: לְגוֹא
  choice: के बीच में
  rationale: यह केवल भीतर जाने की दिशा नहीं, बल्कि भट्ठी के अंदरूनी मध्य भाग को व्यक्त करता है।
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: धधकती आग की भट्ठी
  rationale: मूल पदबंध में भट्ठी, आग और जलने—तीनों के शब्द हैं। यह रूप हिन्दी में स्वाभाविक रहते हुए मूल की तीव्रता और ‘आग’ के स्पष्ट उल्लेख को बनाए रखता है।
