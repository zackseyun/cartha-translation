  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। अरामी मुहावरे का शाब्दिक अनुवाद न करके उसके आरोपात्मक और दुर्भावनापूर्ण आशय को स्पष्ट किया गया है; जातीय पद की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
