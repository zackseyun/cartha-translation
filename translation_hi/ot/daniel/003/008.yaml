source:
  edition: WLC
  text: כָּ/ל קֳבֵ֤ל דְּנָה֙ בֵּ/הּ זִמְנָ֔/א קְרִ֖בוּ גֻּבְרִ֣ין כַּשְׂדָּאִ֑ין וַ/אֲכַ֥לוּ קַרְצֵי/ה֖וֹן דִּ֥י יְהוּדָיֵֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/008.yaml
  text: For this reason[a], at that time certain Chaldean men came forward and maliciously accused the Jews.
translation:
  language: hi
  text: इसी कारण उस समय कुछ कसदी लोग आगे आए और उन्होंने यहूदियों[a] पर दुर्भावना से आरोप लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के लोग।” अरामी शब्द जातीय-भौगोलिक अर्थ में यहूदा के लोगों के साथ-साथ “यहूदियों” को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इसी कारण
  rationale: यह अरामी मुहावरा कारणात्मक संबंध व्यक्त करता है; ‘इसी कारण’ पूर्ववर्ती घटना से संबंध को स्वाभाविक और स्पष्ट हिन्दी में रखता है।
- source_word: בֵּהּ זִמְנָא
  choice: उस समय
  rationale: यह समयसूचक पद उसी अवसर की ओर संकेत करता है; ‘उस समय’ आधुनिक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: קְרִבוּ
  choice: आगे आए
  rationale: क्रिया का मूल अर्थ पास आना या निकट जाना है; राजदरबार के प्रसंग में ‘आगे आए’ उपयुक्त है और आरोप प्रस्तुत करने की क्रिया से स्वाभाविक रूप से जुड़ता है।
- source_word: גֻּבְרִין כַּשְׂדָּאִין
  choice: कुछ कसदी पुरुष
  rationale: यह पद शाब्दिक रूप से ‘कसदी पुरुष’ कहता है। ‘कुछ’ अनिश्चित समूह का भाव देता है, जबकि ‘अधिकारी’ जोड़कर उनकी भूमिका का अनावश्यक निर्धारण नहीं किया गया।
- source_word: וַאֲכַלוּ קַרְצֵיהוֹן
  choice: दुर्भावना से आरोप लगाया
  rationale: यह अरामी मुहावरा शाब्दिक रूप से किसी के ‘टुकड़े खाने’ की छवि रखता है, पर अर्थ शत्रुतापूर्वक निंदा या अभियोग लगाना है। चुना हुआ अनुवाद वैधानिक आरोप और दुर्भावना दोनों को व्यक्त करता है।
- source_word: דִּי יְהוּדָיֵא
  choice: यहूदियों
  rationale: यह शब्द जातीय-भौगोलिक अर्थ में यहूदा के लोगों और व्यापक अर्थ में यहूदियों, दोनों को सूचित कर सकता है। निर्वासनकालीन दरबार के इस प्रसंग में ‘यहूदियों’ स्पष्ट और प्रचलित है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
theological_decisions: []
