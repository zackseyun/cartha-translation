- source_word: תִמְהוֹהִי
  choice: उसके आश्चर्यकर्म
  rationale: यह ऐसे अद्भुत कार्यों को दर्शाता है जो विस्मय उत्पन्न करते हैं। ‘आश्चर्यकर्म’ ऊँची किंतु सुबोध शैली बनाए रखता है।
