  yaml_path: translation/ot/daniel/003/033.yaml
  text: How great are his signs[a], and how mighty are his wonders! His kingdom is an everlasting kingdom[c][b], and his dominion is from generation to generation.
translation:
  language: hi
  text: उसके चिह्न कितने महान हैं, और उसके आश्चर्यकर्म कितने शक्तिशाली हैं[a]! उसका राज्य अनन्त राज्य है[b], और उसका शासन पीढ़ी से पीढ़ी तक बना रहता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके अद्भुत कार्य’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सदा बना रहने वाला राज्य’।
    reason: lexical_alternative
  - marker: c
    text: अरामी में शाब्दिक रूप से ‘पीढ़ी और पीढ़ी के साथ’; यह सभी पीढ़ियों तक निरंतर बने रहने का मुहावरा है।
    reason: cultural_note
