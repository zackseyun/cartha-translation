  rationale: यह परमप्रधान के राज्य अथवा राजकीय शासन को सूचित करने वाला संबंधवाचक रूप है।
- source_word: מַלְכוּת עָלַם
  choice: सदा बना रहने वाला राज्य
  rationale: यह पदबंध निरंतर और स्थायी राज्य का भाव देता है। यह हिन्दी रूप स्वाभाविक है और ‘अनन्त’ अर्थ की संभावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: שָׁלְטָנֵהּ
