- source_word: אַתּוּן
  choice: भट्ठी
  rationale: यह शब्द आग की भट्ठी/भट्ठे को सूचित करता है; प्रसंग में ‘भट्ठी’ सहज और स्पष्ट है।
- source_word: נוּרָא יָקִדְתָּא
  choice: धधकती आग
  rationale: נוּרָא ‘आग’ है और יָקִדְתָּא उसके जलते या धधकते होने को विशेषित करता है; ‘धधकती आग’ स्रोत की संरचना और तीव्रता दोनों बनाए रखती है।
