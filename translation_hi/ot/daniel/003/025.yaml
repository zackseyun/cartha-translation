id: DAN.3.25
reference: Daniel 3:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָנֵ֣ה וְ/אָמַ֗ר הָֽא אֲנָ֨ה חָזֵ֜ה גֻּבְרִ֣ין אַרְבְּעָ֗ה שְׁרַ֨יִן֙ מַהְלְכִ֣ין בְּ/גֽוֹא נוּרָ֔/א וַ/חֲבָ֖ל לָא אִיתַ֣י בְּ/ה֑וֹן וְ/רֵוֵ/הּ֙ דִּ֣י רביעי/א דָּמֵ֖ה לְ/בַר אֱלָהִֽין־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/025.yaml
  text: He answered and said[a], “Look! I see four men unbound, walking in the midst of the fire, and there is no harm on them; and the appearance of the fourth is like a son of the gods.”
translation:
  language: hi
  text: उसने उत्तर दिया, “देखो! मुझे चार पुरुष बंधन से मुक्त होकर आग के बीच चलते दिखाई दे रहे हैं। उन्हें कोई हानि नहीं पहुँची है, और चौथे का रूप देवताओं के एक पुत्र के समान है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पारंपरिक मसीही व्याख्या के अनुसार, “परमेश्वर के पुत्र के समान।” अरामी पद अधिक शाब्दिक रूप से “देवताओं के एक पुत्र के समान” है और यहाँ नबूकदनेस्सर का अपना दृष्टिकोण झलकता है। इसे सामान्य अर्थ में “किसी दिव्य प्राणी के समान” भी समझा जा सकता है।
    reason: चौथे व्यक्ति की पहचान और अरामी אֱלָהִין के अर्थ से जुड़ी वास्तविक व्याख्यात्मक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הָא
  choice: देखो!
  rationale: यह विस्मय और आकस्मिक, ज़ोरदार अवलोकन प्रकट करने वाला उद्गार है; आधुनिक हिन्दी में “देखो!” स्वाभाविक और सजीव है।
- source_word: חָזֵה
  choice: मुझे … दिखाई दे रहे हैं
  rationale: राजा उसी क्षण जो देख रहा है उसका वर्णन करता है। हिन्दी का यह प्रयोग प्रत्यक्ष और वर्तमान अवलोकन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֻּבְרִין אַרְבְּעָה
  choice: चार पुरुष
  rationale: यहाँ अरामी शब्द पुरुषों को सूचित करता है और उन तीन पुरुषों से सीधा संबंध बनाए रखता है जिन्हें भट्ठे में फेंका गया था।
- source_word: שְׁרַיִן
  choice: बंधन से मुक्त
  rationale: यह पहले बाँधे जाने की स्थिति के विपरीत है। “बंधन से मुक्त” आधुनिक हिन्दी में “खुले हुए” से अधिक स्पष्ट है।
- source_word: מַהְלְכִין בְּגוֹא נוּרָא
  choice: आग के बीच चलते
  rationale: कृदन्त निरंतर क्रिया बताता है और स्थानवाचक पद आग के भीतर, उसके बीच होने पर बल देता है।
- source_word: וַחֲבָל לָא אִיתַי בְּהוֹן
  choice: उन्हें कोई हानि नहीं पहुँची है
  rationale: यह अरामी कथन के अर्थ—उनमें किसी चोट या हानि का न होना—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רֵוֵהּ דִּי רביעיא
  choice: चौथे का रूप
  rationale: रֵוֵהּ दृश्य रूप या आकृति को बताता है; “चौथे का रूप” संक्षिप्त और सटीक है।
- source_word: דָּמֵה
  choice: के समान है
  rationale: क्रिया समानता बताती है, पहचान नहीं; इसलिए अनुवाद तुलना को खुला रखता है।
- source_word: לְבַר אֱלָהִין
  choice: देवताओं के एक पुत्र के समान
  rationale: शाब्दिक रूप से पद “देवताओं के एक पुत्र” जैसा है और नबूकदनेस्सर के दृष्टिकोण से किसी दिव्य प्राणी का संकेत देता है। “एक” अनिश्चितता को स्पष्ट करता है; पारंपरिक मसीही पाठ को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: चौथे व्यक्ति की पहचान
  choice: मुख्य पाठ में नबूकदनेस्सर के अपने दृष्टिकोण के अनुसार “देवताओं के एक पुत्र के समान” रखा गया है।
  alternative: “परमेश्वर के पुत्र के समान”; अथवा सामान्य अर्थ में “किसी दिव्य प्राणी के समान।”
  rationale: अरामी वाक्य तुलना करता है, स्पष्ट पहचान नहीं देता। बहुवचन रूप और गैर-इस्राएली राजा का कथन मुख्य पाठ के चुनाव का समर्थन करते हैं, जबकि पद 28 में वह परमेश्वर के दूत का उल्लेख करता है। इसलिए किसी निश्चित मसीही पहचान को मुख्य पाठ में आरोपित नहीं किया गया, पर पारंपरिक मसीही समझ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “बंधन से मुक्त” पूर्ववर्ती प्रसंग से संबंध स्पष्ट करता है; “देवताओं के एक पुत्र” वक्ता के दृष्टिकोण और मूल तुलना को बिना सांप्रदायिक निष्कर्ष थोपे बनाए रखता है।
