id: DAN.3.5
reference: Daniel 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/עִדָּנָ֡/א דִּֽי תִשְׁמְע֡וּן קָ֣ל קַרְנָ֣/א מַ֠שְׁרוֹקִיתָ/א קיתרוס סַבְּכָ֤א פְּסַנְתֵּרִין֙ סוּמְפֹּ֣נְיָ֔ה וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א תִּפְּל֤וּן וְ/תִסְגְּדוּן֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/005.yaml
  text: At the time when you hear the sound of the horn[a], pipe, lyre, trigon, psaltery, bagpipe, and every kind of music[b], you are to fall down and pay homage to the golden image that King Nebuchadnezzar has set up.
translation:
  language: hi
  text: जिस समय तुम नरसिंगे, बाँसुरी, वीणा, त्रिगोन, स्वरमंडल, मशकबीन[b] और हर प्रकार के संगीत की ध्वनि सुनो, तब गिर पड़ना और राजा नबूकदनेस्सर की खड़ी कराई हुई सोने की प्रतिमा के सामने दण्डवत करना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आराधना करना’; अरामी क्रिया श्रद्धा से झुकने या दण्डवत करने को दर्शाती है और इस प्रसंग में मूर्तिपूजक आराधना का भाव रखती है।
    reason: alternative_reading
  - marker: b
    text: ‘सुम्पोन्या’ नामक इस वाद्य की ठीक-ठीक पहचान अनिश्चित है; ‘दोहरी बाँसुरी’ जैसे अन्य अर्थ भी प्रस्तावित किए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעִדָּנָא דִּי
  choice: जिस समय
  rationale: यह अरामी कालवाचक मुहावरे की औपचारिकता को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תִשְׁמְעוּן קָל
  choice: ध्वनि सुनो
  rationale: क़ाल यहाँ वाद्यों से निकलने वाली सुनाई देने योग्य ध्वनि को सूचित करता है; कालवाचक उपवाक्य में हिन्दी का यह रूप सहज है।
- source_word: קַרְנָא
  choice: नरसिंगा
  rationale: यह एक फूँककर बजाया जाने वाला सींगनुमा वाद्य है; ‘नरसिंगा’ सामान्य हिन्दी पाठक के लिए अर्थपूर्ण है और अत्यधिक विशिष्ट पहचान नहीं थोपता।
- source_word: מַשְׁרוֹקִיתָא
  choice: बाँसुरी
  rationale: शब्द नली अथवा बाँसुरी जैसे वायु-वाद्य को सूचित करता है; आधुनिक हिन्दी में ‘बाँसुरी’ स्पष्ट और स्वाभाविक है।
- source_word: קיתרוס
  choice: वीणा
  rationale: यह किथारा/लायर जैसा तार-वाद्य था; ‘वीणा’ हिन्दी में इसके वर्ग का सुबोध कार्यात्मक समतुल्य है।
- source_word: סַבְּכָא
  choice: त्रिगोन
  rationale: वाद्य की सटीक पहचान अनिश्चित है, पर इसे प्रायः त्रिकोणाकार तार-वाद्य माना जाता है; लिप्यंतरण उस अनिश्चितता को सुरक्षित रखता है।
- source_word: פְּסַנְתֵּרִין
  choice: स्वरमंडल
  rationale: यह झंकारकर बजाया जाने वाला तार-वाद्य था; ‘स्वरमंडल’ हिन्दी पाठक को वाद्य का प्रकार समझाता है और सूची के दूसरे तार-वाद्यों से अलग रखता है।
- source_word: סוּמְפֹּנְיָה
  choice: मशकबीन
  rationale: यह प्रचलित आधुनिक पहचान है, पर मूल वाद्य की पहचान विवादित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: और हर प्रकार के संगीत
  rationale: मूल वाक्यांश व्यापक रूप से सभी प्रकार के संगीत का उल्लेख करता है, केवल वाद्य-यंत्रों का नहीं।
- source_word: תִּפְּלוּן
  choice: गिर पड़ना
  rationale: राजकीय आदेश के प्रसंग में अरामी अपूर्ण रूप आज्ञार्थक बल रखता है; हिन्दी संयुक्त आज्ञा में यह बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְתִסְגְּדוּן
  choice: दण्डवत करना
  rationale: क्रिया भूमि पर झुककर श्रद्धा या अधीनता प्रकट करने को दर्शाती है। ‘दण्डवत करना’ शारीरिक क्रिया और आदर दोनों को व्यक्त करता है, बिना शब्द में निहित धार्मिक अर्थ को आवश्यकता से अधिक निश्चित किए।
- source_word: צֶלֶם דַּהֲבָא
  choice: सोने की प्रतिमा
  rationale: यह मूल संज्ञा और उसके पदार्थ का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: דִּי הֲקֵים נְבוּכַדְנֶצַּר מַלְכָּא
  choice: राजा नबूकदनेस्सर की खड़ी कराई हुई
  rationale: הקים प्रतिमा को स्थापित या खड़ा कराने का भाव देता है; कर्ता की राजकीय उपाधि भी सुरक्षित रखी गई है।
theological_decisions:
- issue: मूर्तिपूजा के प्रसंग में סגד का अनुवाद
  choice: दण्डवत करना
  alternative: आराधना करना
  rationale: क्रिया का मूल अर्थ झुककर श्रद्धा अथवा अधीनता प्रकट करना है। इस प्रसंग में वह कार्य मूर्तिपूजक है, फिर भी ‘दण्डवत करना’ शाब्दिक क्रिया और धार्मिक तनाव दोनों को बनाए रखता है; ‘आराधना करना’ सम्भव प्रसंगगत अर्थ के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। दुर्लभ वाद्यों में जहाँ सुबोध हिन्दी समतुल्य उपलब्ध था वहाँ उसका प्रयोग किया गया है; ‘त्रिगोन’ को पहचान की अनिश्चितता के कारण लिप्यंतरित रखा गया है। दोनों पादटिप्पणी-चिह्न सम्बद्ध शब्दों के ठीक बाद मुख्य पाठ में दिए गए हैं।
