  text: בֵּ/אדַ֡יִן מִֽתְכַּנְּשִׁ֡ין אֲחַשְׁדַּרְפְּנַיָּ֡/א סִגְנַיָּ֣/א וּֽ/פַחֲוָתָ֡/א אֲדַרְגָּזְרַיָּ֣/א גְדָבְרַיָּ/א֩ דְּתָ֨בְרַיָּ֜/א תִּפְתָּיֵ֗/א וְ/כֹל֙ שִׁלְטֹנֵ֣י מְדִֽינָתָ֔/א לַ/חֲנֻכַּ֣ת צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֣ר מַלְכָּ֑/א ו/קאמין לָ/קֳבֵ֣ל צַלְמָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/003.yaml
  text: Then the satraps[a], the prefects, and the governors, the counselors, the treasurers, the judges, the magistrates, and all the officials of the provinces were assembled for the dedication of the image that King Nebuchadnezzar had set up, and they stood before the image that Nebuchadnezzar had set up.
translation:
  language: hi
  text: तब क्षत्रप, प्रशासक, राज्यपाल, सलाहकार, कोषाध्यक्ष, न्यायाधीश, दंडाधिकारी और प्रांतों के सभी अधिकारी उस प्रतिमा[a] की प्रतिष्ठा के लिए इकट्ठे हुए, जिसे राजा नबूकदनेस्सर ने खड़ा कराया था; और वे उस प्रतिमा के सामने खड़े हुए, जिसे नबूकदनेस्सर ने खड़ा कराया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मूर्ति’। अरामी शब्द צַלְמָא किसी भौतिक प्रतिरूप या विशाल आकृति को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी आख्यान में अगली घटना आरंभ करने वाला काल-सूचक है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: מִתְכַּנְּשִׁין
  choice: इकट्ठे हुए
  rationale: रूप सामूहिक रूप से एकत्र होने को व्यक्त करता है; आधुनिक हिन्दी में यह सहज है और निष्क्रियता पर अनावश्यक बल नहीं देता।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: यह फ़ारसी साम्राज्य का विशिष्ट प्रशासनिक पद है; हिन्दी में स्थापित ऐतिहासिक पदनाम ‘क्षत्रप’ उसकी विशिष्टता बनाए रखता है।
- source_word: סִגְנַיָּא
  choice: प्रशासक
  rationale: यह एक शासकीय पद को सूचित करता है; ‘प्रशासक’ सामान्य पाठक के लिए स्पष्ट है और निकटवर्ती पदों से पर्याप्त भिन्न है।
- source_word: פַחֲוָתָא
  choice: राज्यपाल
  rationale: यह प्रांतीय शासनाधिकारी का बोध कराता है; ‘राज्यपाल’ आधुनिक हिन्दी में सबसे निकट और सुबोध प्रशासनिक समतुल्य है।
- source_word: אֲדַרְגָּזְרַיָּא
  choice: सलाहकार
  rationale: पद का सटीक कार्य अनिश्चित है, पर यह उच्च अधिकारियों की एक श्रेणी है; ‘सलाहकार’ संभावित अर्थ देता है, बिना अधिक निश्चितता जताए।
- source_word: גְדָבְרַיָּא
  choice: कोषाध्यक्ष
  rationale: शब्द सामान्यतः राजकोष अथवा वित्त से जुड़े अधिकारियों के लिए समझा जाता है।
- source_word: דְּתָבְרַיָּא
  choice: न्यायाधीश
  rationale: यह संभवतः न्यायिक अधिकारियों को दर्शाता है; ‘न्यायाधीश’ सीधा और स्पष्ट समतुल्य है।
- source_word: תִּפְתָּיֵא
  choice: दंडाधिकारी
  rationale: यह एक अन्य न्यायिक-प्रशासनिक पद है; ‘दंडाधिकारी’ न्यायाधीश से भेद बनाए रखते हुए उसके सरकारी-कानूनी स्वरूप को व्यक्त करता है।
- source_word: כֹל שִׁלְטֹנֵי מְדִינָתָא
  choice: प्रांतों के सभी अधिकारी
  rationale: यह शेष प्रांतीय सत्ताधारियों को समेटने वाला व्यापक पदबंध है; ‘अधिकारी’ पदों की विविधता को समाविष्ट करता है।
- source_word: לַחֲנֻכַּת
  choice: समर्पण के लिए
  rationale: यह किसी वस्तु की औपचारिक प्रतिष्ठा अथवा dedication को दर्शाता है; ‘समर्पण’ धार्मिक अर्थ को अनावश्यक रूप से निश्चित किए बिना समारोह का भाव देता है।
- source_word: צַלְמָא
  choice: प्रतिमा
  rationale: यह शब्द भौतिक छवि या विशाल मूर्ति दोनों को सूचित कर सकता है; प्रसंग में ‘प्रतिमा’ स्वाभाविक है, जबकि पादटिप्पणी ‘मूर्ति’ विकल्प और मूल की अर्थ-व्याप्ति बताती है।
- source_word: הֲקֵים
  choice: खड़ा कराया था
  rationale: राजा के आदेश या संरक्षण में प्रतिमा स्थापित किए जाने का भाव हिन्दी में स्वाभाविक रीति से व्यक्त होता है।
theological_decisions:
- issue: צַלְמָא की प्रकृति
  choice: प्रतिमा
  alternative: मूर्ति
  rationale: मूल शब्द यह निश्चित नहीं करता कि आकृति किसी देवता, राजा या अन्य विषय की थी। ‘प्रतिमा’ इस अनिश्चितता को अपेक्षाकृत खुला रखता है; ‘मूर्ति’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, औपचारिक और कथात्मक रखी गई है। प्रशासनिक पदों की लंबी सूची को मूल क्रम में सुरक्षित रखा गया है, तथा अंतिम उपवाक्य की पुनरावृत्ति भी मूल अरामी के अनुरूप बनाए रखी गई है।
