  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָֽתַיָּ/א֙ וְ/תִמְהַיָּ֔/א דִּ֚י עֲבַ֣ד עִמִּ֔/י אֱלָהָ֖/א עלי/א שְׁפַ֥ר קָֽדָמַ֖/י לְ/הַחֲוָיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/032.yaml
  text: It has seemed good to me to declare the signs and wonders that the Most High God has done for me[a][b].
translation:
  language: hi
  text: परमप्रधान परमेश्वर ने मेरे साथ[b] जो चिन्ह और चमत्कार किए हैं, उन्हें प्रकट करना मैंने उचित समझा है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें प्रकट करना मुझे अच्छा लगा”; अरामी अभिव्यक्ति राजकीय स्वीकृति या निश्चय का औपचारिक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “मेरे साथ”; इसका अर्थ नबूकदनेस्सर के संबंध में या उसके लिए परमेश्वर के किए हुए कार्य भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָתַיָּא
  choice: चिन्ह
  rationale: यह अरामी बहुवचन संज्ञा अलौकिक अर्थ रखने वाले संकेतों को दर्शाती है; हिन्दी में युग्मित पदावली ‘चिन्ह और अद्भुत काम’ स्वाभाविक है।
- source_word: וְתִמְהַיָּא
  choice: और अद्भुत काम
  rationale: यह असाधारण और विस्मयकारी दैवी कार्यों का द्योतक है। ‘अद्भुत काम’ सामान्य आधुनिक हिन्दी में अर्थ को स्पष्ट रखता है।
- source_word: עֲבַד
  choice: किए हैं
  rationale: मूल क्रिया का अर्थ ‘करना’ है; पूर्ण वर्तमान उन बीते कार्यों की वर्तमान घोषणा-संगत प्रासंगिकता व्यक्त करता है।
- source_word: עִמִּי
  choice: मेरे लिए
  rationale: शाब्दिक अर्थ ‘मेरे साथ’ है, पर यहाँ परमेश्वर ने नबूकदनेस्सर के संबंध में जो किया उसका भाव है; ‘मेरे लिए’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: אֱלָהָא עִלָּיָא
  choice: परमप्रधान परमेश्वर
  rationale: यह परमेश्वर की सर्वोच्चता बताने वाली स्पष्ट उपाधि है; हिन्दी बाइबलीय और सामान्य धार्मिक प्रयोग में यह स्वाभाविक तथा गरिमापूर्ण है।
- source_word: שְׁפַר קָדָמַי
  choice: मुझे अच्छा लगा है
  rationale: यह राजकीय स्वीकृति या निश्चय का औपचारिक अरामी मुहावरा है। हिन्दी रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהַחֲוָיָה
  choice: वर्णन करना
  rationale: क्रिया का अर्थ ‘ज्ञात कराना, बताना’ है। आगामी वृत्तांत के संदर्भ में ‘वर्णन करना’ सार्वजनिक रूप से बताने का भाव सहजता से देता है।
theological_decisions:
- issue: अर्माइकी उपाधि אֱלָהָא עִלָּיָא का अनुवाद
  choice: परमप्रधान परमेश्वर
  alternative: सर्वोच्च परमेश्वर
  rationale: चुना हुआ रूप परमेश्वर की सर्वोच्चता को सीधे व्यक्त करता है और किसी बाद की पंथगत व्याख्या को आरोपित नहीं करता।
- issue: עִמִּי में परमेश्वर के कार्य और राजा के संबंध का भाव
  choice: मेरे लिए
  alternative: मेरे साथ
  rationale: संदर्भ में राजा अपने संबंध में हुए दैवी कार्य घोषित करता है। ‘मेरे लिए’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय-घोषणा शैली रखी गई है। वाक्य-क्रम हिन्दी के लिए स्वाभाविक है, जबकि मूल का औपचारिक मुहावरा और עִמִּי की अर्थगत गुंजाइश पादटिप्पणियों में सुरक्षित है।
