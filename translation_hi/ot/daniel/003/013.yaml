base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/013.yaml
  text: Then Nebuchadnezzar, in rage and fury, commanded that Shadrach, Meshach, and Abed-nego be brought in. Then these men were brought before the king.
translation:
  language: hi
  text: तब नबूकदनेस्सर ने क्रोध और रोष में आकर शद्रक, मेशक और अबेदनगो को लाने की आज्ञा दी। तब उन पुरुषों को राजा के सामने लाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और क्रम-सूचक है।
- source_word: בִּרְגַז וַחֲמָה
  choice: क्रोध और रोष में आकर
  rationale: दोनों संज्ञाओं की तीव्रता और अलंकारिक पुनरुक्ति बनाए रखी गई है; ‘में आकर’ आधुनिक हिन्दी में भावावस्था को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲמַר לְהַיְתָיָה
  choice: लाने की आज्ञा दी
  rationale: ‘कहा’ के साथ प्रयुक्त कारक infinitive यहाँ आदेश का भाव देता है; हिन्दी में यह प्रयोग आदेश और किसी से बुलवाकर लाने, दोनों को स्पष्ट करता है।
- source_word: לְשַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों को हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरित किया गया है, उनका अर्थानुवाद नहीं किया गया।
- source_word: גֻּבְרַיָּא אִלֵּךְ
  choice: उन पुरुषों
  rationale: यह पद अभी-अभी नामित तीन व्यक्तियों की ओर संकेत करता है; हिन्दी कथावाचन में ‘उन पुरुषों’ स्वाभाविक पूर्वसंदर्भ देता है।
- source_word: הֵיתָיוּ קֳדָם מַלְכָּא
  choice: राजा के सामने लाया गया
  rationale: क्रिया के कारक/निष्क्रिय भाव को सुरक्षित रखते हुए दरबारी संदर्भ में קֳדָם को ‘के सामने’ कहा गया है।
