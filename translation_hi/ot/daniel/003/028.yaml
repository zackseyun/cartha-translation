  text: עָנֵ֨ה נְבֽוּכַדְנֶצַּ֜ר וְ/אָמַ֗ר בְּרִ֤יךְ אֱלָהֲ/הוֹן֙ דִּֽי שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ דִּֽי שְׁלַ֤ח מַלְאֲכֵ/הּ֙ וְ/שֵׁיזִ֣ב לְ/עַבְד֔וֹ/הִי דִּ֥י הִתְרְחִ֖צוּ עֲל֑וֹ/הִי וּ/מִלַּ֤ת מַלְכָּ/א֙ שַׁנִּ֔יו וִ/יהַ֣בוּ גשמי/הון דִּ֠י לָֽא יִפְלְח֤וּן וְ/לָֽא יִסְגְּדוּן֙ לְ/כָל אֱלָ֔הּ לָהֵ֖ן לֵ/אלָֽהֲ/הֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/028.yaml
  text: Nebuchadnezzar answered and said[a], “Blessed be the God of Shadrach, Meshach, and Abed-nego, who sent his angel and delivered his servants, who trusted in him, and set aside the king’s command, and gave up their bodies[c][b], that they might not serve or worship any god except their own God.”
translation:
  language: hi
  text: इस पर नबूकदनेस्सर ने कहा, “शद्रक, मेशक और अबेदनगो का परमेश्वर धन्य है! उसने अपना स्वर्गदूत[a] भेजकर अपने उन सेवकों को बचाया, जिन्होंने उस पर भरोसा रखा, राजा की आज्ञा को ठुकरा दिया[b] और अपने शरीरों को जोखिम में डाल दिया, ताकि वे अपने परमेश्वर के सिवा किसी भी देवता की सेवा न करें और न उसे दण्डवत् करें[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूत।” अरामी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “राजा की बात को बदल दिया”; अर्थात् उन्होंने राजा की आज्ञा मानने से इनकार कर दिया।
    reason: idiom_clarification
  - marker: c
    text: या “उपासना करें।” मूल क्रिया झुकने या भूमि पर गिरकर दण्डवत् करने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: इस पर ... ने कहा
  rationale: यह अरामी कथात्मक सूत्र किसी कथन पर प्रतिक्रिया का संकेत देता है। ‘इस पर ... ने कहा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से शाब्दिक ‘उत्तर देकर कहा’ से बचता है।
- source_word: בְּרִיךְ
  choice: धन्य है
  rationale: यह परमेश्वर की स्तुति करने वाला आशीर्वादात्मक उद्गार है; ‘धन्य है’ आधुनिक, गरिमापूर्ण और परिचित हिन्दी अभिव्यक्ति है।
- source_word: שְׁלַח מַלְאֲכֵהּ
  choice: अपना दूत भेजकर
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता और व्यक्ति की पहचान संबंधी संयम बनाए रखता है।
- source_word: וְשֵׁיזִב
  choice: बचाया
  rationale: क्रिया आग के प्राणघातक संकट से छुड़ाने को व्यक्त करती है; ‘बचाया’ सामान्य पाठक के लिए स्पष्ट और सटीक है।
- source_word: לְעַבְדוהִי
  choice: अपने ... सेवकों को
  rationale: राजदरबार और परमेश्वर के प्रति निष्ठा के इस प्रसंग में ‘सेवक’ अर्थ और गरिमा दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִתְרְחִצוּ עֲלֹוהִי
  choice: उस पर भरोसा रखा
  rationale: यह पदबंध किसी पर विश्वासपूर्वक निर्भर होने का भाव देता है; ‘भरोसा रखा’ सम्बन्धपरक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וּמִלַּת מַלְכָּא שַׁנִּיו
  choice: राजा की बात को बदल दिया
  rationale: यह मूल अरामी के ‘राजा के वचन/बात को बदलना’ रूपक को बनाए रखता है। प्रसंग में इसका आशय राजाज्ञा को न मानना या निष्प्रभावी करना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וִיהַבוּ גשמי/הון
  choice: अपने शरीर सौंप दिए
  rationale: यह अपने शरीरों को संकट और सम्भावित मृत्यु के हवाले कर देने की तत्परता व्यक्त करता है; अनुवाद मूल की देहगत भाषा बनाए रखता है।
- source_word: לָא יִפְלְחוּן
  choice: सेवा न करें
  rationale: यहाँ क्रिया किसी देवता को दी जाने वाली धार्मिक सेवा के लिए प्रयुक्त है; ‘सेवा करना’ इस अर्थ को स्पष्ट रखता है।
- source_word: וְלָא יִסְגְּדוּן
  choice: दण्डवत् न करें
  rationale: क्रिया का ठोस अर्थ झुककर या भूमि पर गिरकर सम्मान देना है। ‘दण्डवत् करना’ उपासना के शारीरिक कर्म को ‘सेवा’ से अलग बनाए रखता है।
- source_word: לָהֵן
  choice: के सिवा
  rationale: यह अपवाद सूचक अव्यय है; ‘अपने परमेश्वर के सिवा’ हिन्दी में इसका स्पष्ट और स्वाभाविक रूप है।
theological_decisions:
- issue: मַלְאֲכֵהּ की पहचान
  choice: दूत
  alternative: स्वर्गदूत; अथवा कुछ व्याख्याओं में अधिक विशिष्ट ईशप्रकाशित व्यक्ति
  rationale: अरामी शब्द स्वयं मानवीय या स्वर्गीय ‘दूत’ दोनों अर्थ दे सकता है। पद नबूकदनेस्सर का कथन है और किसी अधिक विशिष्ट मसीही या ईशप्रकाशीय पहचान को अनिवार्य नहीं करता; इसलिए अनुवाद अस्पष्टता को खुला रखता है।
- issue: तीनों व्यक्तियों की राजाज्ञा के प्रति प्रतिक्रिया
  choice: राजा की बात को बदल दिया
  alternative: राजा की आज्ञा को ठुकरा दिया / न माना
  rationale: मूल का मुहावरा शाब्दिक रूप से राजा की ‘बात’ या ‘वचन’ को ‘बदलने’ की भाषा रखता है, जबकि प्रसंग उसका पालन न करने का अर्थ बताता है। मुख्य पाठ मूल रूपक रखता है और पादटिप्पणी अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और जनसुलभ रखी गई है। ‘दूत’, ‘राजा की बात को बदल दिया’ और ‘दण्डवत् करें’ मूल अरामी की अर्थगत व्यापकता तथा ठोस बिम्बों को बनाए रखते हैं; पादटिप्पणियाँ बिना किसी साम्प्रदायिक निष्कर्ष के प्रमुख विकल्प स्पष्ट करती हैं।
