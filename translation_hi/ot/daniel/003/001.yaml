source:
  edition: WLC
  text: נְבוּכַדְנֶצַּ֣ר מַלְכָּ֗/א עֲבַד֙ צְלֵ֣ם דִּֽי דְהַ֔ב רוּמֵ/הּ֙ אַמִּ֣ין שִׁתִּ֔ין פְּתָיֵ֖/הּ אַמִּ֣ין שִׁ֑ת אֲקִימֵ/הּ֙ בְּ/בִקְעַ֣ת דּוּרָ֔א בִּ/מְדִינַ֖ת בָּבֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/001.yaml
  text: King Nebuchadnezzar made an image of gold[a], its height sixty cubits and its width six cubits. He set it up in the plain of Dura[b], in the province of Babylon.
translation:
  language: hi
  text: राजा नबूकदनेस्सर ने सोने की एक प्रतिमा[a] बनाई। उसकी ऊँचाई साठ हाथ[b] और चौड़ाई छह हाथ थी। उसने उसे बाबेल प्रान्त में दूरा के मैदान में स्थापित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने की मूर्ति।” अरामी शब्द का अर्थ प्रतिमा या मूर्ति हो सकता है। आगे के प्रसंग के प्रकाश में “मूरत” भी संभव है, पर इस पद के मुख्य पाठ में अपेक्षाकृत तटस्थ शब्द रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: एक हाथ प्राचीन लम्बाई की मानक इकाई थी, जो लगभग कोहनी से उँगलियों के सिरों तक की दूरी के बराबर मानी जाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: עֲבַד
  choice: बनवाई
  rationale: राजकीय कर्ता और विशाल प्रतिमा के प्रसंग में हिन्दी का प्रयोजक रूप स्वाभाविक है; इससे यह आवश्यक रूप से नहीं कहा जाता कि राजा ने अपने हाथों से उसे बनाया।
- source_word: צְלֵם
  choice: प्रतिमा
  rationale: यह शब्द किसी छवि या मूर्ति को सूचित कर सकता है। ‘प्रतिमा’ आधुनिक हिन्दी में अपेक्षाकृत तटस्थ है और इस पद में ही ‘मूरत’ या ‘मूर्ति’ कहकर उपासना-संबंधी अर्थ को समय से पहले प्रमुख नहीं बनाता।
- source_word: דִּי דְהַב
  choice: सोने की
  rationale: यह पदार्थ को व्यक्त करता है, पर यह निश्चित नहीं करता कि प्रतिमा ठोस सोने की थी या सोने से मढ़ी हुई।
- source_word: רוּמֵהּ / פְּתָיֵהּ
  choice: उसकी ऊँचाई / चौड़ाई
  rationale: आयामों के लिए ये स्पष्ट और प्रचलित आधुनिक हिन्दी शब्द हैं।
- source_word: אַמִּין שִׁתִּין / אַמִּין שִׁת
  choice: साठ हाथ / छः हाथ
  rationale: प्राचीन माप ‘अम्मा’ के लिए हिन्दी बाइबलीय प्रयोग में ‘हाथ’ सहज है; फुटनोट इसका अनुमानित अर्थ स्पष्ट करता है।
- source_word: אֲקִימֵהּ
  choice: खड़ा करवाया
  rationale: विशाल प्रतिमा स्थापित करने की क्रिया और राजकीय आदेश, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּבִקְעַת
  choice: मैदान में
  rationale: यह शब्द चौड़े समतल भूभाग अथवा घाटी के मैदान को बता सकता है; इस स्थान-संदर्भ में ‘मैदान’ उपयुक्त है।
- source_word: דּוּרָא
  choice: दूरा
  rationale: स्थान-नाम का देवनागरी लिप्यन्तरण।
- source_word: בִּמְדִינַת בָּבֶל
  choice: बाबेल प्रान्त में
  rationale: מְדִינָה प्रशासनिक प्रान्त को सूचित करता है; ‘बाबेल’ स्रोत के स्थान-नाम को सुरक्षित रखता है।
- source_word: מַלְכָּא
  choice: राजा
  rationale: व्यक्तिनाम से पहले पदवी के रूप में यह स्वाभाविक हिन्दी क्रम है।
theological_decisions:
- issue: क्या צְלֵם का अनुवाद स्पष्ट रूप से धार्मिक शब्द से किया जाए
  choice: प्रतिमा
  alternative: मूर्ति; मूरत
  rationale: इस पद में वस्तु की सामग्री, माप और स्थान बताए गए हैं, पर उसके धार्मिक कार्य को अभी स्पष्ट नाम नहीं दिया गया। ‘प्रतिमा’ आगे के प्रसंग को उसका स्वरूप निर्धारित करने देता है।
