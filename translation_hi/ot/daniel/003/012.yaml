  text: אִיתַ֞י גֻּבְרִ֣ין יְהוּדָאיִ֗ן דִּֽי מַנִּ֤יתָ יָתְ/הוֹן֙ עַל עֲבִידַת֙ מְדִינַ֣ת בָּבֶ֔ל שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ גֻּבְרַיָּ֣/א אִלֵּ֗ךְ לָא שָׂ֨מֽוּ עלי/ך מַלְכָּ/א֙ טְעֵ֔ם ל/אלהי/ך לָ֣א פָלְחִ֔ין וּ/לְ/צֶ֧לֶם דַּהֲבָ֛/א דִּ֥י הֲקֵ֖ימְתָּ לָ֥א סָגְדִֽין־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/012.yaml
  text: 'There are certain Jewish men whom you have appointed over the administration of the province of Babylon—Shadrach[a], Meshach, and Abed-nego. These men have paid no attention to you, O king: they do not serve your gods[b], and they do not worship the golden image that you have set up.'
translation:
  language: hi
  text: कुछ यहूदी पुरुष हैं, जिन्हें आपने बाबेल प्रान्त के प्रशासन का भार सौंपा है—शद्रक, मेशक और अबेदनगो। हे राजा, इन पुरुषों ने आपकी कोई परवाह नहीं की है[a]। वे आपके देवताओं की सेवा नहीं करते[b] और न आपकी खड़ी की हुई सोने की प्रतिमा को दण्डवत् करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपका कोई मान नहीं रखा” अथवा “आपकी बात नहीं मानी।” अरामी मुहावरे का शाब्दिक भाव है कि उन्होंने राजा की ओर ध्यान या मान ‘नहीं रखा।’
    reason: lexical_alternative
  - marker: b
    text: 'अरामी में यहाँ दो अलग क्रियाएँ हैं: वे राजा के देवताओं की “सेवा” नहीं करते और सोने की प्रतिमा को “दण्डवत्” नहीं करते।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִיתַי גֻּבְרִין יְהוּדָאיִן
  choice: कुछ यहूदी पुरुष हैं
  rationale: अस्तित्ववाचक अंश और स्पष्ट पुल्लिंग संज्ञा, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דִּי מַנִּיתָ יָתְהוֹן עַל עֲבִידַת מְדִינַת בָּבֶל
  choice: जिन्हें आपने बाबेल प्रान्त के प्रशासन पर नियुक्त किया है
  rationale: מַנִּיתָ नियुक्ति और עֲבִידַת इस शासकीय सन्दर्भ में प्रशासनिक कार्य को सूचित करता है।
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यन्तरण रखा गया है।
- source_word: לָא שָׂמוּ עֲלַיִךְ ... טְעֵם
  choice: आपकी ओर कोई ध्यान नहीं दिया है
  rationale: अरामी मुहावरे का आशय अनादर अथवा न मानने से है; यह अनुवाद किसी अनुल्लिखित ‘आज्ञा’ को जोड़ने से बचता है।
- source_word: לֵאלָהַיִךְ לָא פָלְחִין
  choice: वे आपके देवताओं की सेवा नहीं करते
  rationale: פְלַח का धार्मिक सेवा करना अर्थ रखा गया है और इसे अगले क्रियापद से अलग व्यक्त किया गया है।
- source_word: וּלְצֶלֶם דַּהֲבָא דִּי הֲקֵימְתָּ
  choice: आपके खड़े किए हुए सोने के पुतले को
  rationale: צֶלֶם के लिए ‘पुतला’ प्रसंगानुकूल मूर्ति/प्रतिमा का बोध देता है और הֲקֵים के खड़ा करने के भाव को बनाए रखता है।
- source_word: לָא סָגְדִין
  choice: दण्डवत् करते हैं
  rationale: סְגַד में झुककर आराधनापूर्ण सम्मान करने का शारीरिक भाव है; ‘दण्डवत् करना’ इसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: धार्मिक क्रिया के दो भिन्न अरामी क्रियापद
  choice: פָלְחִין को ‘सेवा करते’ और סָגְדִין को ‘दण्डवत् करते’ अनूदित करना
  alternative: दोनों को ‘आराधना करते’ कहना
  rationale: मूल पाठ देवताओं की धार्मिक सेवा और सोने के पुतले के आगे झुकने के बीच शब्दगत भेद रखता है; हिन्दी में भी उस भेद को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय पद के लिए ‘प्रशासन’, सम्बोधन के लिए ‘हे राजा’, और धार्मिक क्रियाओं के भेद के लिए ‘सेवा’ तथा ‘दण्डवत्’ का प्रयोग किया गया है।
