  text: כָּ/ל קֳבֵ֣ל דְּנָ֡ה בֵּ/הּ זִמְנָ֡/א כְּ/דִ֣י שָֽׁמְעִ֣ין כָּֽל עַמְמַיָּ֡/א קָ֣ל קַרְנָ/א֩ מַשְׁר֨וֹקִיתָ֜/א קיתרס שַׂבְּכָא֙ פְּסַנְטֵרִ֔ין וְ/כֹ֖ל זְנֵ֣י זְמָרָ֑/א נָֽפְלִ֨ין כָּֽל עַֽמְמַיָּ֜/א אֻמַיָּ֣/א וְ/לִשָּׁנַיָּ֗/א סָֽגְדִין֙ לְ/צֶ֣לֶם דַּהֲבָ֔/א דִּ֥י הֲקֵ֖ים נְבוּכַדְנֶצַּ֥ר מַלְכָּֽ/א־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/007.yaml
  text: Therefore[a], at that time, when all the peoples heard the sound of the horn, pipe, lyre, trigon, psaltery, and every kind of music, all the peoples, nations, and languages fell down and worshiped the golden image that King Nebuchadnezzar had set up.
translation:
  language: hi
  text: इसलिए, उस समय जब सब लोगों ने नरसिंगे, बाँसुरी, वीणा, त्रिकोण-वीणा, स्वरमंडल[a] और हर प्रकार के संगीत की ध्वनि सुनी, तब सभी लोग, जातियाँ और भाषाएँ गिरकर उस सोने की मूर्ति की आराधना करने लगे, जिसे राजा नबूकदनेस्सर ने स्थापित किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन प्राचीन वाद्ययंत्रों में से कई की ठीक-ठीक पहचान निश्चित नहीं है। “त्रिकोण-वीणा” संभवतः त्रिकोणाकार वीणा थी, और “स्वरमंडल” किसी प्रकार का तार वाद्य रहा होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इसलिए
  rationale: यह अरामी मुहावरा राजाज्ञा के परिणाम को प्रस्तुत करता है; ‘इसलिए’ उसका निष्कर्षात्मक बल स्वाभाविक हिंदी में रखता है।
- source_word: בֵּהּ זִמְנָא
  choice: उस समय
  rationale: यह घटना के समय को चिह्नित करने वाला सहज और गरिमापूर्ण हिंदी प्रयोग है।
- source_word: כְּדִי שָׁמְעִין
  choice: जब ... सुनी
  rationale: कालवाचक संबंध को बनाए रखता है और मूल से अधिक तात्कालिकता नहीं जोड़ता।
- source_word: כָּל עַמְמַיָּא
  choice: सब लोगों
  rationale: बहुवचन जनसमूहों को सामान्य आधुनिक हिंदी में व्यक्त करता है; आगे की त्रयी ‘लोग, जातियाँ और भाषाएँ’ से साम्राज्य की विविधता स्पष्ट होती है।
- source_word: קָל
  choice: ध्वनि
  rationale: यहाँ वाद्ययंत्रों से उत्पन्न सुनाई देने वाली आवाज़ अभिप्रेत है, बोलने की वाणी नहीं।
- source_word: קַרְנָא
  choice: नरसिंगा
  rationale: सींग से बने अथवा सींग-जैसे फूँक वाद्य के लिए परिचित हिंदी शब्द है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: מַשְׁרוֹקִיתָא
  choice: बाँसुरी
  rationale: एक फूँक वाद्य का सहज हिंदी समतुल्य; सटीक प्राचीन स्वरूप निश्चित नहीं है।
- source_word: קיתרס
  choice: वीणा
  rationale: यूनानी किथारा-संबंधी तार वाद्य के लिए सामान्य पाठक को समझ आने वाला व्यापक हिंदी शब्द।
- source_word: שַׂבְּכָא
  choice: त्रिकोण-वीणा
  rationale: संभवतः त्रिकोणाकार तार वाद्य को संकेत करता है, पर पहचान अनिश्चित है; इसीलिए पादटिप्पणी में अनिश्चितता स्पष्ट की गई है।
- source_word: פְּסַנְטֵרִין
  choice: स्वरमंडल
  rationale: किसी प्रकार के झंकारयुक्त तार वाद्य के लिए पठनीय हिंदी समतुल्य है; सटीक पहचान पादटिप्पणी में अनिश्चित रखी गई है।
- source_word: וְכֹל זְנֵי זְמָרָא
  choice: और हर प्रकार के संगीत
  rationale: सूची के बाद आने वाले व्यापक सारांश को प्राकृतिक हिंदी में व्यक्त करता है।
- source_word: נָפְלִין
  choice: मुँह के बल गिर पड़ीं
  rationale: शारीरिक दंडवत क्रिया को मूर्त रूप देता है; स्त्रीलिंग क्रिया निकटवर्ती संयुक्त कर्ता-समूह की अंतिम संज्ञा ‘भाषाएँ’ के अनुरूप स्वाभाविक हिंदी में है।
theological_decisions:
- issue: मूर्ति के प्रति किए गए कृत्य का अनुवाद
  choice: आराधना की
  alternative: दंडवत किया / श्रद्धा प्रकट की
  rationale: आज्ञा और मूर्ति से जुड़े उपासना-संदर्भ में अरामी क्रिया केवल नागरिक सम्मान से अधिक धार्मिक कृत्य व्यक्त करती है; ‘आराधना की’ उस बल को बिना अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। अपरिचित प्राचीन वाद्यों के लिए समझने योग्य हिंदी नाम चुने गए हैं, किंतु पादटिप्पणी में उनकी वास्तविक पहचान की अनिश्चितता सुरक्षित रखी गई है।
