source:
  edition: WLC
  text: עֲנ֗וֹ שַׁדְרַ֤ךְ מֵישַׁךְ֙ וַ/עֲבֵ֣ד נְג֔וֹ וְ/אָמְרִ֖ין לְ/מַלְכָּ֑/א נְבֽוּכַדְנֶצַּ֔ר לָֽא חַשְׁחִ֨ין אֲנַ֧חְנָה עַל דְּנָ֛ה פִּתְגָ֖ם לַ/הֲתָבוּתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/016.yaml
  text: Shadrach, Meshach, and Abed-nego answered and said to the king, Nebuchadnezzar, “We have no need to give you an answer concerning this matter.”
translation:
  language: hi
  text: शद्रक, मेशक और अबेदनगो ने राजा नबूकदनेस्सर से कहा, “इस विषय में आपको उत्तर देने की हमें कोई आवश्यकता नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנוֹ ... וְאָמְרִין
  choice: ने ... कहा
  rationale: अरामी का शाब्दिक दोहरा प्रयोग ‘उत्तर दिया और कहा’ हिन्दी में अनावश्यक रूप से भारी लगता है; ‘कहा’ उत्तर देने के प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמַלְכָּא נְבוּכַדְנֶצַּר
  choice: राजा से कहा, “हे नबूकदनेस्सर
  rationale: मूल में ‘राजा’ के बाद संबोधन के रूप में नबूकदनेस्सर आता है; हिन्दी में संबोधन स्पष्ट रखने के लिए ‘हे’ जोड़ा गया है।
- source_word: לָא חַשְׁחִין אֲנַחְנָה
  choice: हमें ... कोई आवश्यकता नहीं है
  rationale: यह अरामी मुहावरा आवश्यकता या बाध्यता न होने को व्यक्त करता है।
- source_word: פִּתְגָם לַהֲתָבוּתָךְ
  choice: आपको उत्तर देने की
  rationale: פִּתְגָם यहाँ ‘वचन/उत्तर’ और הֲתָבָה ‘लौटाना’ के अर्थ में मिलकर ‘उत्तर देना’ व्यक्त करते हैं। राजा के लिए आदरसूचक ‘आपको’ आधुनिक मानक हिन्दी के अनुकूल है।
- source_word: עַל דְּנָה
  choice: इस विषय में
  rationale: संदर्भगत अर्थ ‘इस मामले/विषय के संबंध में’ है; ‘इस विषय में’ सहज और सटीक है।
theological_decisions:
- issue: 'कथन का भाव: असमर्थता या उत्तर देने की आवश्यकता का अभाव'
  choice: उत्तर देने की कोई आवश्यकता नहीं
  alternative: हम आपको उत्तर नहीं देंगे
  rationale: मूल לָא חַשְׁחִין बाध्यता अथवा आवश्यकता न होने पर बल देता है, केवल दृढ़ इनकार पर नहीं; इसलिए तनाव को अधिक कठोर बनाकर नहीं प्रस्तुत किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। व्यक्तिनाम प्रचलित हिन्दी बाइबलीय रूपों में रखे गए हैं; संवाद में राजा के पद और उसके नाम-संबोधन, दोनों को सुरक्षित रखा गया है।
