base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/027.yaml
  text: And the satraps[a], the prefects, the governors, and the king’s counselors gathered together and saw concerning these men that the fire had no power over their bodies, and the hair of their heads was not singed, and their cloaks were not changed, and no smell of fire had come upon them.
translation:
  language: hi
  text: और क्षत्रप, प्रशासक, राज्यपाल और राजा के सलाहकार इकट्ठे हुए और इन पुरुषों को देखकर पाया कि आग का उनके शरीरों पर कोई वश नहीं चला था; उनके सिर के बाल नहीं झुलसे थे, उनके चोगों[a] में कोई बदलाव नहीं आया था और उनमें आग की गंध तक नहीं आई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वस्त्रों’; इस अरामी शब्द से ठीक किस प्रकार का पहनावा अभिप्रेत है, यह निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִתְכַּנְּשִׁין
  choice: इकट्ठे हुए
  rationale: यह रूप अधिकारियों के एकत्र होने को व्यक्त करता है; ‘इकट्ठे हुए’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: אֲחַשְׁדַּרְפְּנַיָּא
  choice: क्षत्रप
  rationale: यह फ़ारसी शासन-व्यवस्था का ऐतिहासिक पदनाम है; ‘क्षत्रप’ उस विशिष्ट पद को सामान्य ‘अधिकारी’ में बदलने से बचाता है।
- source_word: סִגְנַיָּא
  choice: प्रशासक
  rationale: यह उच्च पदस्थ प्रशासनिक अधिकारियों का संकेत देता है; ‘प्रशासक’ सूची के अन्य पदों से पर्याप्त भेद रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: פַחֲוָתָא
  choice: राज्यपाल
  rationale: यह प्रान्तीय शासनाधिकारी के लिए प्रचलित और स्पष्ट हिन्दी शब्द है।
- source_word: הַדָּבְרֵי מַלְכָּא
  choice: राजा के सलाहकार
  rationale: दरबारी संदर्भ में यह राजकीय अधिकारियों अथवा परामर्शदाताओं को सूचित करता है; ‘सलाहकार’ पद को अनावश्यक रूप से अधिक तकनीकी नहीं बनाता।
- source_word: חָזַיִן לְגֻבְרַיָּא אִלֵּךְ
  choice: उन्होंने उन पुरुषों के विषय में देखा कि
  rationale: לְ यहाँ सीधे कर्म के बजाय सम्बन्ध या विषय सूचित करता है। यह अभिव्यक्ति उस वाक्य-विन्यास और प्रत्यक्ष निरीक्षण के भाव को सुरक्षित रखती है।
- source_word: לָא שְׁלֵט נוּרָא בְּגֶשְׁמְהוֹן
  choice: आग का उनके शरीरों पर कोई वश नहीं चला था
  rationale: שׁלט अधिकार या प्रभुत्व चलाने का प्रबल भाव रखता है; ‘कोई वश नहीं चला’ केवल ‘असर नहीं हुआ’ की अपेक्षा उसे बेहतर बनाए रखता है।
- source_word: שְׂעַר רֵאשְׁהוֹן לָא הִתְחָרַךְ
  choice: उनके सिर के बाल नहीं झुलसे थे
  rationale: बालों के सन्दर्भ में क्रिया का अर्थ आग से झुलसना है; हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: סָרְבָּלֵיהוֹן
  choice: उनके चोगों[a]
  rationale: शब्द किसी विशेष पहनावे को सूचित करता है, पर उसकी ठीक पहचान अनिश्चित है। ‘चोगे’ एक सम्भव ऐतिहासिक वस्त्र है और अनिश्चितता पाद-टिप्पणी में बताई गई है।
- source_word: לָא שְׁנוֹ
  choice: कोई बदलाव नहीं आया था
  rationale: यह शब्द वस्त्रों की दशा न बदलने को बताता है; अनुवाद आग से क्षति जैसे अधिक विशिष्ट अर्थ को मूल में जोड़े बिना बात स्पष्ट करता है।
- source_word: רֵיחַ נוּר לָא עֲדָת בְּהוֹן
  choice: उनमें आग की गंध तक नहीं आई थी
  rationale: यह स्वाभाविक हिन्दी में व्यक्त करता है कि आग की गंध भी उन पर नहीं आई; ‘तक’ पूर्ण संरक्षण के अंतिम निरीक्षित विवरण पर बल देता है।
