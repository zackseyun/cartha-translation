base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/031.yaml
  text: 'King Nebuchadnezzar[a], to all peoples, nations[b], and languages that dwell in all the earth: May your peace abound.'
translation:
  language: hi
  text: 'राजा नबूकदनेस्सर की ओर से, सारी पृथ्वी पर[b] रहने वाले सभी लोगों, राष्ट्रों और भाषा-समूहों को: तुम्हारी शांति बढ़ती जाए।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी शांति बहुतायत से हो।”
    reason: lexical_alternative
  - marker: b
    text: “सारी पृथ्वी” एक प्रचलित साम्राज्यिक अभिव्यक्ति है; यहाँ इसका आलंकारिक अर्थ “पूरे राज्य में” भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: מַלְכָּא
  choice: राजा
  rationale: यह उपाधि नबूकदनेस्सर के नाम के साथ समानाधिकरण में है। हिन्दी राजकीय उद्घोषणा में स्वाभाविकता के लिए इसे नाम से पहले रखा गया है।
- source_word: לְכָל עַמְמַיָּא אֻמַיָּא וְלִשָּׁנַיָּא
  choice: उन सब जातियों, राष्ट्रों और भाषा-समूहों के नाम
  rationale: यह साम्राज्यिक त्रयी अधीनस्थ जनसमुदायों की व्यापक विविधता व्यक्त करती है। 'भाषा-समूह' मूल के ठोस भाषाई वर्गों को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: דִּי דארין
  choice: जो ... रहते हैं
  rationale: सम्बन्धवाचक अव्यय और कृदन्त सम्बोधित समुदायों को निवासियों के रूप में बताते हैं; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: בְּכָל אַרְעָא
  choice: सारी पृथ्वी पर
  rationale: אַרְעָא का अर्थ 'भूमि/देश' या 'पृथ्वी' हो सकता है। साम्राज्यिक उद्घोषणा की व्यापक, आलंकारिक भाषा को मुख्य पाठ में 'सारी पृथ्वी' से रखा गया है और उसके प्रचलित राजकीय आशय को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: שְׁלָמְכוֹן
  choice: तुम्हारी शान्ति
  rationale: यह शब्द शान्ति, कुशल और समग्र कल्याण का बोध कराता है। 'शान्ति' सामी अभिवादन की परिचित शब्दावली और उसकी गरिमा बनाए रखता है।
- source_word: יִשְׂגֵּא
  choice: बढ़ती जाए
  rationale: क्रिया का अर्थ बढ़ना या बहुत होना है। 'बढ़ती जाए' इच्छासूचक आशीर्वचन को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है; अधिक शब्दशः विकल्प पाद-टिप्पणी में दिया गया है।
