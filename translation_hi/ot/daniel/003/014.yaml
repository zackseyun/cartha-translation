  text: Nebuchadnezzar answered and said to them[a], “Is it true, Shadrach, Meshach, and Abed-nego, that you do not serve my god and do not bow down to the golden image that I have set up?”
translation:
  language: hi
  text: नबूकदनेस्सर ने उन्हें उत्तर देकर कहा, “शद्रक, मेशक और अबेदनगो, क्या यह सच है[a] कि तुम मेरे देवता की सेवा नहीं करते और उस सोने की प्रतिमा के आगे दण्डवत् नहीं करते जिसे मैंने स्थापित किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी हַצְדָּא का अर्थ ‘क्या यह जानबूझकर है?’ या ‘क्या तुम जानबूझकर ऐसा कर रहे हो?’ भी हो सकता है।
    reason: हַצְדָּא की वास्तविक शब्दार्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: ने ... कहा
  rationale: अरामी में यह वाणी आरम्भ कराने वाला प्रचलित कथात्मक मुहावरा है। हिन्दी में शाब्दिक ‘उत्तर दिया और कहा’ अनावश्यक रूप से भारी लगता है; ‘कहा’ प्रसंग में उत्तर देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהוֹן
  choice: उनसे
  rationale: यह तृतीय पुरुष बहुवचन सर्वनाम है और सामूहिक रूप से उन तीनों यहूदियों की ओर संकेत करता है।
- source_word: הַצְדָּא
  choice: क्या यह सच है
  rationale: प्रसंग में राजा पहले सुनाए गए आरोप की सच्चाई पूछ रहा है। शब्द में जानबूझकर किए जाने का अर्थ भी सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: לֵאלָהַי
  choice: मेरे देवता की
  rationale: यहाँ रूप एकवचन है और उसके साथ प्रथम पुरुष एकवचन प्रत्यय है। ‘देवता’ राजा द्वारा पूजे जाने वाले दैवी अस्तित्व को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פָּלְחִין
  choice: सेवा नहीं करते
  rationale: क्रिया धार्मिक अथवा उपासना-संबंधी सेवा दर्शाती है। ‘सेवा करना’ अगली क्रिया ‘दण्डवत् करना’ से इसका शब्दार्थगत भेद बनाए रखता है।
- source_word: וּלְצֶלֶם דַּהֲבָא
  choice: उस सोने की प्रतिमा के सामने
  rationale: ‘सोने की प्रतिमा’ आधुनिक हिन्दी में स्वाभाविक है। ‘के सामने’ हिन्दी में दण्डवत् करने के लक्ष्य को सहज रूप से व्यक्त करता है, यद्यपि अरामी में संबंधसूचक उपसर्ग अधिक संक्षिप्त है।
- source_word: דִּי הֲקֵימֶת
  choice: जिसे मैंने खड़ा कराया है
  rationale: राजा ने प्रतिमा बनवाकर स्थापित कराई थी; प्रेरणार्थक ‘खड़ा कराया’ उसके राजकीय आदेश और पूर्ण हो चुकी, वर्तमान प्रसंग में प्रासंगिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סָגְדִין
  choice: दण्डवत् नहीं करते
  rationale: यह क्रिया झुककर भूमि पर प्रणाम करने की शारीरिक क्रिया बताती है। ‘दण्डवत् करना’ उपासना-संबंधी प्रसंग में सटीक है और ‘सेवा करना’ से भेद बनाए रखता है।
theological_decisions:
- issue: मूर्तिपूजा-संबंधी दोनों अरामी क्रियाओं को अलग रखना या एक ही ‘आराधना’ शब्द में मिला देना
  choice: ‘सेवा करना’ और ‘दण्डवत् करना’ को अलग-अलग क्रियाओं के रूप में रखा गया
  alternative: एक या दोनों क्रियाओं के लिए ‘आराधना करना’
  rationale: मूल पाठ धार्मिक सेवा और झुककर प्रणाम करने के लिए दो भिन्न क्रियाएँ प्रयोग करता है। दोनों को सुरक्षित रखना मूल की आलंकारिक शक्ति और अर्थगत भेद को बनाए रखता है।
- issue: הַצְדָּא का अर्थ
  choice: मुख्य पाठ में ‘क्या यह सच है’
  alternative: ‘क्या तुम जानबूझकर...?’ अथवा ‘क्या यह जानबूझकर है...?’
  rationale: शब्द आरोप की सत्यता और जानबूझकर अवज्ञा—दोनों अर्थों की सम्भावना रखता है। प्रसंग के प्रश्नात्मक प्रवाह के कारण मुख्य पाठ में सत्यता वाला अर्थ रखा गया और दूसरा अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘दण्डवत्’ धार्मिक प्रसंग में परिचित और स्रोत की शारीरिक क्रिया के अनुकूल है।
