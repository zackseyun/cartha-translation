source:
  edition: WLC
  text: בֵּ/אדַ֜יִן קְרֵ֣ב נְבוּכַדְנֶצַּ֗ר לִ/תְרַע֮ אַתּ֣וּן נוּרָ֣/א יָקִֽדְתָּ/א֒ עָנֵ֣ה וְ/אָמַ֗ר שַׁדְרַ֨ךְ מֵישַׁ֧ךְ וַ/עֲבֵד נְג֛וֹ עַבְד֛וֹ/הִי דִּֽי אֱלָהָ֥/א עלי/א פֻּ֣קוּ וֶ/אֱת֑וֹ בֵּ/אדַ֣יִן נָֽפְקִ֗ין שַׁדְרַ֥ךְ מֵישַׁ֛ךְ וַ/עֲבֵ֥ד נְג֖וֹ מִן גּ֥וֹא נוּרָֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/026.yaml
  text: Then Nebuchadnezzar came near to the door of the blazing fiery furnace[a]. He answered and said, “Shadrach, Meshach, and Abed-nego, servants of the Most High God, come out and come here.” Then Shadrach, Meshach[b], and Abed-nego came out from the midst of the fire.
translation:
  language: hi
  text: तब नबूकदनेस्सर धधकती हुई आग की भट्ठी[a] के द्वार[b] के निकट आया। उसने उत्तर देकर कहा, “हे शद्रक, मेशक और अबेदनगो, परमप्रधान परमेश्वर के सेवकों, बाहर निकलो और यहाँ आओ!” तब शद्रक, मेशक और अबेदनगो आग के बीच से बाहर निकल आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जलती हुई आग की भट्ठी।”
    reason: lexical_alternative
  - marker: b
    text: या, “मुहाने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगली घटना को क्रम में प्रस्तुत करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: קְרֵב
  choice: के पास गया
  rationale: क्रिया शारीरिक रूप से निकट आने को बताती है; प्रसंग में राजा का भट्ठी के द्वार तक पहुँचना अभिप्रेत है।
- source_word: לִתְרַע
  choice: के द्वार
  rationale: संज्ञा का अर्थ द्वार, प्रवेश या खुला मुहाना हो सकता है। मुख्य पाठ में ‘द्वार’ सरल है और ‘मुहाने’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: אַתּוּן נוּרָא יָקִדְתָּא
  choice: धधकती हुई आग की भट्ठी
  rationale: यह अनुवाद ‘भट्ठी’, ‘आग’ और जलने/धधकने के वर्णन—तीनों को रखकर मूल की जोरदार अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: עָנֵה וְאָמַר
  choice: उसने उत्तर देकर कहा
  rationale: सामान्य सामी भाषायी वाक्-सूत्र को संक्षिप्त करके केवल ‘कहा’ करने के बजाय उसकी मूल बनावट को बनाए रखा गया है।
- source_word: עַבְדוֹהִי
  choice: सेवको
  rationale: शब्द सेवक या दास का अर्थ दे सकता है; यहाँ परमेश्वर की सेवा और उससे संबंध पर बल है, इसलिए संबोधन में ‘सेवको’ उपयुक्त है।
- source_word: אֱלָהָא עליא
  choice: परमप्रधान परमेश्वर
  rationale: यह दिव्य उपाधि परमेश्वर की सर्वोच्चता व्यक्त करती है और हिन्दी बाइबलीय शैली में स्पष्ट तथा प्रतिष्ठित है।
- source_word: פֻּקוּ וֶאֱתוֹ
  choice: बाहर निकलो और यहाँ आओ
  rationale: 'दोनों आज्ञाओं को अलग रखा गया है: पहली भट्ठी से बाहर आने और दूसरी वक्ता की ओर आने को व्यक्त करती है।'
- source_word: מִן גּוֹא נוּרָא
  choice: आग के बीच से
  rationale: גּוֹא आग के भीतर या बीच को सूचित करता है; यह अनुवाद उनके आग के अंदर से निकलने की सजीवता बनाए रखता है।
theological_decisions:
- issue: दिव्य उपाधि אֱלָהָא עליא का अनुवाद
  choice: परमप्रधान परमेश्वर
  alternative: परमप्रधान ईश्वर
  rationale: उपाधि को व्याख्यात्मक विस्तार दिए बिना शीर्षक के रूप में रखा गया है। इससे नबूकदनेस्सर द्वारा परमेश्वर की सर्वोच्चता की स्वीकृति बनी रहती है, पर उसके कथन में बाद की धर्मवैज्ञानिक धारणाएँ नहीं जोड़ी जातीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। नामों के प्रचलित हिन्दी रूप अपनाए गए हैं। मूल अरामी की पुनरुक्त, जोरदार अग्नि-छवि और दोहरी आज्ञा को सुरक्षित रखते हुए वाक्य सहज बनाए गए हैं।
