  text: וְ/גֻבְרַיָּ֤/א אִלֵּךְ֙ תְּלָ֣תֵּ/ה֔וֹן שַׁדְרַ֥ךְ מֵישַׁ֖ךְ וַ/עֲבֵ֣ד נְג֑וֹ נְפַ֛לוּ לְ/גֽוֹא אַתּוּן נוּרָ֥/א יָֽקִדְתָּ֖/א מְכַפְּתִֽין־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/003/023.yaml
  text: And these three men—Shadrach[a], Meshach[b], and Abed-nego—fell bound into the midst of the blazing furnace.
translation:
  language: hi
  text: और वे तीनों पुरुष—शद्रक, मेशक और अबेदनगो—बँधे हुए धधकती आग की भट्ठी के भीतर जा गिरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גֻבְרַיָּא אִלֵּךְ תְּלָתֵּהוֹן
  choice: वे तीनों पुरुष
  rationale: यह पद पहले से पहचाने गए तीन पुरुषों की ओर संकेत करता है। आधुनिक हिन्दी में ‘वे तीनों पुरुष’ स्वाभाविक रूप से संकेतवाचक और संख्या, दोनों को व्यक्त करता है।
- source_word: שַׁדְרַךְ מֵישַׁךְ וַעֲבֵד נְגוֹ
  choice: शद्रक, मेशक और अबेदनगो
  rationale: व्यक्तिवाचक नामों का हिन्दी बाइबल परंपरा में पहचाना जाने वाला देवनागरी लिप्यंतरण रखा गया है।
- source_word: נְפַלוּ
  choice: जा गिरे
  rationale: अरामी क्रिया का मूल अर्थ ‘गिरे’ है। ‘जा गिरे’ हिन्दी में भीतर की ओर हुई गति और परिणामी गिरने को सहज ढंग से व्यक्त करता है, जबकि इस पद में स्वयं निहित न होने वाला कर्मवाच्य ‘फेंक दिए गए’ नहीं जोड़ता।
- source_word: לְגוֹא
  choice: के भीतर
  rationale: यह भट्ठी के अंदरूनी भाग में प्रवेश को व्यक्त करता है। ‘के भीतर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אַתּוּן
  choice: भट्ठी
  rationale: कथा के संदर्भ में यह तीव्र आग वाली बड़ी भट्ठी है; ‘भट्ठी’ आधुनिक हिन्दी में ‘तंदूर’ या सामान्य ‘ओवन’ से अधिक उपयुक्त है।
- source_word: נוּרָא יָקִדְתָּא
  choice: धधकती आग की भट्ठी
  rationale: अरामी पदबंध में ‘आग’ और ‘जलती/धधकती’ दोनों भाव स्पष्ट हैं। यह अनुवाद स्रोत की अभिव्यक्ति को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: מְכַפְּתִין
  choice: बँधे हुए
  rationale: निष्क्रिय कृदंत का अर्थ ‘बँधे हुए’ है। इससे ‘हाथ-पाँव’ जैसी अनुल्लिखित विशिष्टता नहीं जोड़ी जाती।
