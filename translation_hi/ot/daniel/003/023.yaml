  register: भाषा आधुनिक, स्पष्ट और कथात्मक गरिमा वाली रखी गई है। स्रोत की सरल क्रिया ‘गिरे’ को संरक्षित किया गया है और संदर्भ से ‘फेंके गए’ अर्थ को मुख्य पाठ में नहीं जोड़ा गया।
