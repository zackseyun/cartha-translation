id: DAN.12.9
reference: Daniel 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר לֵ֣ךְ דָּנִיֵּ֑אל כִּֽי סְתֻמִ֧ים וַ/חֲתֻמִ֛ים הַ/דְּבָרִ֖ים עַד עֵ֥ת קֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/009.yaml
  text: And he said[a], “Go your way, Daniel, because the words are concealed and sealed until the time of the end.”
translation:
  language: hi
  text: तब उसने कहा, “दानिय्येल, तुम अपने मार्ग पर जाओ, क्योंकि ये वचन अन्त के समय तक बन्द और मुहरबन्द हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: वय्यिक्तोल यहाँ कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब उसने कहा’ स्वाभाविक क्रम व्यक्त करता है।
- source_word: לֵךְ
  choice: तुम अपने मार्ग पर जाओ
  rationale: הלך के आज्ञार्थक रूप का प्रसंगानुकूल अर्थ केवल स्थान छोड़ना नहीं, बल्कि दानिय्येल को अपने निर्धारित मार्ग पर आगे बढ़ने देना है।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा का कारण प्रस्तुत करने वाले स्पष्ट कारणवाचक अर्थ को व्यक्त करता है।
- source_word: סְתֻמִים
  choice: बन्द
  rationale: סתם का कर्मवाच्य कृदन्त यहाँ वचनों के अभी अप्राप्य या न खोले जाने की स्थिति बताता है; ‘बन्द’ मूल रूपक को सीधे बनाए रखता है।
- source_word: וַחֲתֻמִים
  choice: और मुहरबन्द
  rationale: חתם का कर्मवाच्य कृदन्त दस्तावेज़ पर मुहर लगाने की छवि रखता है; ‘मुहरबन्द’ हिन्दी में इसे सटीक व्यक्त करता है।
- source_word: הַדְּבָרִים
  choice: ये वचन
  rationale: דברים यहाँ अभी दिए गए प्रकाशन-सन्देश की ओर संकेत करता है; ‘वचन’ उस सन्दर्भ को बनाए रखता है और ‘ये’ हिन्दी में संकेत को स्पष्ट करता है।
- source_word: עַד עֵת קֵץ
  choice: अन्त के समय तक
  rationale: दानिय्येल की प्रमुख अभिव्यक्ति की औपचारिक संरचना और अन्तकाल-संबंधी भार को बिना समयक्रम अधिक निर्दिष्ट किए सुरक्षित रखता है।
theological_decisions:
- issue: עֵת קֵץ का अन्तकाल-संबंधी आशय
  choice: अन्त के समय
  alternative: अन्तकाल
  rationale: ‘अन्त के समय’ हिब्रू पदबंध की संरचना और दानिय्येल में उसकी धर्मवैचारिक अनिश्चितता को बनाए रखता है; ‘अन्तकाल’ अपेक्षाकृत अधिक पारिभाषिक और व्याख्यात्मक हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘बन्द और मुहरबन्द’ दो अलग हिब्रू कर्मवाच्य कृदन्तों को स्पष्टतः बनाए रखता है; अलग पादटिप्पणी आवश्यक नहीं समझी गई।
