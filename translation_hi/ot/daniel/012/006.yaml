id: DAN.12.6
reference: Daniel 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לָ/אִישׁ֙ לְב֣וּשׁ הַ/בַּדִּ֔ים אֲשֶׁ֥ר מִ/מַּ֖עַל לְ/מֵימֵ֣י הַ/יְאֹ֑ר עַד מָתַ֖י קֵ֥ץ הַ/פְּלָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/006.yaml
  text: And he said to the man clothed in linen[a], who was above the waters of the river[b], “How long until the end of these wonders?”
translation:
  language: hi
  text: और उसने उस पुरुष से, जिसने सन के वस्त्र पहने थे और जो नदी के जल के ऊपर था, पूछा, “इन अद्भुत बातों का अन्त कब होगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने ... पूछा
  rationale: אמר का मूल अर्थ ‘कहा’ है, पर प्रत्यक्ष प्रश्न के साथ आधुनिक हिन्दी में ‘पूछा’ स्वाभाविक है; ‘और’ हिब्रू कथात्मक क्रम को बनाए रखता है।
- source_word: לָאִישׁ
  choice: उस पुरुष से
  rationale: उपपद निश्चित और प्रसंग में पहले से पहचाने जाने योग्य व्यक्ति को सूचित करता है; ‘पुरुष’ दर्शनीय वर्णन के गरिमापूर्ण भाव के अनुकूल है।
- source_word: לְבוּשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने
  rationale: यह कृदन्तीय पद उस व्यक्ति की वेशभूषा बताता है। यहाँ בַּדִּים महीन सन के वस्त्र के लिए है; ‘मलमल के वस्त्र’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר מִמַּעַל לְמֵימֵי הַיְאֹר
  choice: जो नदी के जल के ऊपर था
  rationale: מִמַּעַל स्थानगत रूप से ‘ऊपर’ दर्शाता है। יְאֹר को प्रसंगानुसार सामान्य ‘नदी’ रखा गया है, न कि ‘नील’, क्योंकि दर्शन का प्रसंग मिस्र की पहचान की माँग नहीं करता।
- source_word: עַד מָתַי
  choice: और कितना समय है
  rationale: मुहावरा किसी घटना तक शेष अवधि पूछता है। ‘अन्त होने में और कितना समय है?’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: קֵץ
  choice: अन्त
  rationale: यह घटनाओं के समापन-बिन्दु को सूचित करता है; संबंध-वाक्य में ‘अन्त होना’ हिन्दी में सहज है।
- source_word: הַפְּלָאוֹת
  choice: इन अद्भुत घटनाओं
  rationale: פלא से बना शब्द आश्चर्यजनक या असाधारण बातों/कार्यों को दर्शाता है। प्रसंगगत निश्चितता को ‘इन’ व्यक्त करता है और ‘घटनाओं’ से आशय सामान्य पाठक के लिए स्पष्ट होता है।
theological_decisions:
- issue: वक्ता और मलमल के वस्त्र पहने पुरुष की पहचान
  choice: वक्ता को केवल ‘उसने’ और दूसरे पात्र को ‘मलमल के वस्त्र पहने उस पुरुष’ कहा गया है।
  alternative: वक्ता को स्पष्टतः स्वर्गदूत और मलमल के वस्त्र पहने पुरुष को कोई विशिष्ट दिव्य या मसीही व्यक्तित्व बताना।
  rationale: हिब्रू पाठ इस पद में दोनों की इससे अधिक पहचान नहीं करता। अनुवाद किसी स्वर्गदूतीय या मसीही पहचान को आरोपित किए बिना पाठ की धार्मिक अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु दर्शन-वर्णन के अनुरूप गरिमापूर्ण रखी गई है। वाक्य-रचना को हिन्दी के स्वाभाविक प्रश्नरूप में ढाला गया है और अनावश्यक सांप्रदायिक व्याख्या से बचा गया है।
