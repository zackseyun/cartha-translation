id: DAN.12.5
reference: Daniel 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/רָאִ֨יתִי֙ אֲנִ֣י דָנִיֵּ֔אל וְ/הִנֵּ֛ה שְׁנַ֥יִם אֲחֵרִ֖ים עֹמְדִ֑ים אֶחָ֥ד הֵ֨נָּה֙ לִ/שְׂפַ֣ת הַ/יְאֹ֔ר וְ/אֶחָ֥ד הֵ֖נָּה לִ/שְׂפַ֥ת הַ/יְאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/005.yaml
  text: 'Then I[a], Daniel, looked, and behold, two others were standing: one on this bank of the river, and one on that bank of the river.'
translation:
  language: hi
  text: तब मैंने, दानिय्येल ने, देखा, और देखो, दो और व्यक्ति खड़े थे—एक नदी के इस किनारे पर और दूसरा नदी के उस किनारे पर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרָאִיתִי
  choice: तब ... ने देखा
  rationale: वाव के साथ पूर्ण क्रिया यहाँ दर्शन के वर्णन को आगे बढ़ाती है; ‘तब’ क्रमसूचक भाव को और ‘देखा’ देखने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲנִי דָנִיֵּאל
  choice: मुझ दानिय्येल ने
  rationale: स्पष्ट सर्वनाम और नाम आत्म-पहचान पर बल देते हैं। ‘मुझ दानिय्येल ने’ हिन्दी में इस बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह संकेतक दर्शन में सामने आए नए दृश्य की ओर ध्यान खींचता है; ‘और देखो’ उसकी सजीवता को बनाए रखता है।
- source_word: שְׁנַיִם אֲחֵרִים
  choice: दो अन्य जन
  rationale: यह पद पहले से उपस्थित व्यक्ति से अलग दो और व्यक्तियों को सूचित करता है। ‘जन’ उनके स्वरूप या स्वर्गदूतीय पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עֹמְדִים
  choice: खड़े थे
  rationale: कृदन्त लगातार बनी हुई मुद्रा का दृश्य प्रस्तुत करता है; ‘खड़े थे’ हिन्दी में उस स्थितिमूलक भाव को व्यक्त करता है।
- source_word: הֵנָּה
  choice: इस ... उस
  rationale: दोनों प्रयोग नदी के विपरीत किनारों पर स्थित स्थानों का संकेत देते हैं; हिन्दी में ‘इस’ और ‘उस’ स्पष्ट तथा स्वाभाविक विरोध प्रस्तुत करते हैं।
- source_word: לִשְׂפַת
  choice: किनारे पर
  rationale: שָׂפָה का मूल अर्थ ओंठ या छोर है, पर नदी के संदर्भ में ‘किनारा’ सबसे स्वाभाविक अर्थ है।
- source_word: הַיְאֹר
  choice: नदी
  rationale: यद्यपि यह शब्द कुछ संदर्भों में नील नदी को सूचित कर सकता है, यहाँ दर्शन की नदी के लिए सामान्य ‘नदी’ अधिक संदर्भानुकूल और कम व्याख्यात्मक है।
theological_decisions:
- issue: ‘दो अन्य’ की पहचान
  choice: ‘दो अन्य जन’ कहकर पहचान को अनिर्धारित रखा गया है।
  alternative: ‘दो अन्य स्वर्गदूत’ या ‘दो अन्य स्वर्गीय प्राणी’
  rationale: इब्रानी पाठ इस पद में उनकी पहचान स्पष्ट नहीं करता; इसलिए अनुवाद में स्वर्गदूतीय पहचान जोड़ना मूल से अधिक विशिष्ट होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘और देखो’ दर्शन की सजीवता तथा ‘मुझ दानिय्येल ने’ मूल के आत्म-पहचान संबंधी बल को सुरक्षित रखते हैं। किसी अनावश्यक सांप्रदायिक या व्याख्यात्मक पहचान को नहीं जोड़ा गया।
