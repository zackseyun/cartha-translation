  text: אַשְׁרֵ֥י הַֽ/מְחַכֶּ֖ה וְ/יַגִּ֑יעַ לְ/יָמִ֕ים אֶ֕לֶף שְׁלֹ֥שׁ מֵא֖וֹת שְׁלֹשִׁ֥ים וַ/חֲמִשָּֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/012.yaml
  text: Blessed is the one who waits and reaches the 1,335 days[a].
translation:
  language: hi
  text: धन्य है वह जो प्रतीक्षा करता है और 1,335 दिनों तक पहुँचता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुखी है वह जो प्रतीक्षा करता है और 1,335 दिनों तक पहुँचता है।’
    reason: אַשְׁרֵי के लिए ‘सुखी’ वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: धन्य है
  rationale: यह अभिव्यक्ति आशीषपूर्ण और वांछनीय दशा बताती है। ‘धन्य है’ भविष्यसूचक प्रसंग की गरिमापूर्ण, धन्य-वचन जैसी शैली बनाए रखता है।
- source_word: הַמְחַכֶּה
  choice: जो प्रतीक्षा करता है
  rationale: חכה का कृदन्त अपेक्षापूर्ण और निरंतर प्रतीक्षा का भाव रखता है। यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए उस जारी भाव को व्यक्त करता है।
- source_word: וְיַגִּיעַ
  choice: और ... तक पहुँचता है
  rationale: यहाँ נגע का हिफ़ील रूप किसी निश्चित समय-बिंदु तक आने या पहुँचने के अर्थ में है। ‘तक पहुँचता है’ हिन्दी में कालावधि के साथ स्वाभाविक है।
- source_word: לְיָמִים
  choice: दिनों तक
  rationale: לְ उस निर्दिष्ट दिनों की संख्या तक पहुँचने का लक्ष्य सूचित करता है; ‘दिनों तक’ इस समय-सीमा को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: אֶלֶף שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וַחֲמִשָּׁה
  choice: 1,335
  rationale: इब्रानी संख्या का कुल योग 1,335 है। पठनीयता के लिए इसे आधुनिक अंकीय रूप में रखा गया है।
theological_decisions:
- issue: प्रलयदर्शी समय-सारणी में इस धन्य-वचन का अर्थ
  choice: 1,335 दिनों को बिना प्रतीकात्मक या शाब्दिक रूप में व्याख्यायित किए समय-सूचक कथन के रूप में बनाए रखना
  alternative: इसे या तो पूरी तरह शाब्दिक कालावधि अथवा प्रतीकात्मक प्रलयदर्शी संख्या मानना
  rationale: पद निर्दिष्ट समय तक धीरज रखने वाले को धन्य कहता है, पर इब्रानी पाठ उस संख्या की प्रकृति स्पष्ट नहीं करता; इसलिए अनुवाद विवादित अंत-काल संबंधी अर्थ का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘धन्य है’ पद की ऊँची, धन्य-वचन जैसी ध्वनि रखता है; ‘प्रतीक्षा करता है’ कृदन्त का जारी भाव देता है।
