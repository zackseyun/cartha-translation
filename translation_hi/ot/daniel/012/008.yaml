id: DAN.12.8
reference: Daniel 12:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲנִ֥י שָׁמַ֖עְתִּי וְ/לֹ֣א אָבִ֑ין וָ/אֹ֣מְרָ֔/ה אֲדֹנִ֕/י מָ֥ה אַחֲרִ֖ית אֵֽלֶּה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/008.yaml
  text: As for me[a], I heard, but I did not understand. So I said, “My lord, what will be the outcome of these things?”
translation:
  language: hi
  text: मैंने तो सुना, पर समझ नहीं पाया। तब मैंने कहा, “हे मेरे स्वामी, इन बातों का परिणाम क्या होगा[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन बातों का अंत क्या होगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: मैंने तो
  rationale: स्वतंत्र सर्वनाम אֲנִי दानिय्येल के अपने अनुभव पर हल्का बल देता है; हिंदी का ‘तो’ इस विमर्शगत बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמַעְתִּי
  choice: सुना
  rationale: यहाँ קל रूप का सामान्य अर्थ ‘सुनना’ है और दानिय्येल द्वारा प्रकाशन के शब्द सुनने को दर्शाता है।
- source_word: וְלֹא אָבִין
  choice: पर समझ नहीं पाया
  rationale: 'בין का अर्थ ‘समझना, discern करना’ है। संदर्भ में וְ विरोध प्रकट करता है: उसने सुना, फिर भी अर्थ न समझ सका। ‘नहीं पाया’ उसकी वास्तविक असमर्थता को स्वाभाविक हिंदी में व्यक्त करता है।'
- source_word: וָאֹמְרָה
  choice: तब मैंने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ सुनने और न समझने के बाद उसके प्रश्न को स्वाभाविक क्रम में रखता है।
- source_word: אֲדֹנִי
  choice: हे मेरे स्वामी
  rationale: यह सम्मानसूचक संबोधन है, जिसका शाब्दिक भाव ‘मेरे स्वामी’ है। इससे संबोधित स्वर्गीय संदेशवाहक के प्रति आदर बना रहता है, पर इसे परमेश्वर के विशिष्ट नाम या अनिवार्यतः ईश्वरीय उपाधि के रूप में नहीं ठहराया जाता।
- source_word: מָה אַחֲרִית אֵלֶּה
  choice: इन बातों का परिणाम क्या होगा
  rationale: אַחֲרִית ‘अंत, अंतिम अवस्था, परिणाम’ बता सकता है। ‘परिणाम’ आधुनिक हिंदी में प्रश्न का आशय स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: אֲדֹנִי का संदर्भ
  choice: स्वर्गीय संदेशवाहक अथवा व्याख्या करने वाले व्यक्ति के लिए सम्मानसूचक ‘हे मेरे स्वामी’
  alternative: परमेश्वर को सीधे संबोधित करते हुए ‘हे प्रभु’
  rationale: निकटवर्ती संदर्भ में दानिय्येल प्रकाशन देने वाले व्यक्ति से बोलता दिखाई देता है। ‘मेरे स्वामी’ मूल के सम्मानसूचक संबोधन को बनाए रखता है और संबोधित व्यक्ति की पहचान के विषय में पाठ से अधिक निश्चित दावा नहीं करता।
- issue: אַחֲרִית का आशय
  choice: परिणाम
  alternative: अंत
  rationale: सर्वनाश-दर्शी संदर्भ में शब्द अंतिम परिणति अथवा नतीजे की ओर संकेत कर सकता है। मुख्य पाठ में ‘परिणाम’ सहज है; ‘अंत’ को पादटिप्पणी में देकर वास्तविक अर्थ-व्याप्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘मैंने तो’ दानिय्येल के व्यक्तिगत दृष्टिकोण पर मूल का हल्का बल व्यक्त करता है। संबोधन में ‘स्वामी’ आदर बनाए रखता है, जबकि ‘प्रभु’ से उत्पन्न हो सकने वाली अनावश्यक निश्चित ईश्वरीय पहचान से बचता है।
