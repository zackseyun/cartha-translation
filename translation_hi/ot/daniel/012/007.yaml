source:
  edition: WLC
  text: וָ/אֶשְׁמַ֞ע אֶת הָ/אִ֣ישׁ לְב֣וּשׁ הַ/בַּדִּ֗ים אֲשֶׁ֣ר מִ/מַּעַל֮ לְ/מֵימֵ֣י הַ/יְאֹר֒ וַ/יָּ֨רֶם יְמִינ֤/וֹ וּ/שְׂמֹאל/וֹ֙ אֶל הַ/שָּׁמַ֔יִם וַ/יִּשָּׁבַ֖ע בְּ/חֵ֣י הָ/עוֹלָ֑ם כִּי֩ לְ/מוֹעֵ֨ד מֽוֹעֲדִ֜ים וָ/חֵ֗צִי וּ/כְ/כַלּ֛וֹת נַפֵּ֥ץ יַד עַם קֹ֖דֶשׁ תִּכְלֶ֥ינָה כָל אֵֽלֶּה־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/007.yaml
  text: Then I heard the man clothed in linen[a], who was above the waters of the river, and he raised his right hand and his left hand to heaven and swore by him who lives forever that it would be for a time, times, and half a time; and when the shattering of the power of the holy people is finished[b], all these things will be completed.
translation:
  language: hi
  text: तब मैंने सन के वस्त्र पहने हुए उस पुरुष को सुना, जो नदी के जल के ऊपर था। उसने अपना दाहिना और बायाँ हाथ आकाश की ओर उठाया और सदा जीवित रहनेवाले की शपथ खाई कि यह एक समय, समयों और आधे समय तक होगा[a]; और जब पवित्र प्रजा की शक्ति को चकनाचूर करने का काम पूरा हो जाएगा[b], तब ये सब बातें पूरी हो जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “एक नियत समय, नियत समयों और आधा समय।” बहुत-से लोग इसका अर्थ “एक वर्ष, दो वर्ष और आधा वर्ष” समझते हैं।
    reason: रहस्यात्मक समय-सूत्र के अधिक शाब्दिक रूप और प्रचलित व्याख्या को दर्शाना।
  - marker: b
    text: इब्रानी में, “पवित्र प्रजा का हाथ”; यहाँ “हाथ” का अर्थ संभवतः शक्ति या सामर्थ्य है।
    reason: मूल इब्रानी रूपक और उसके संभावित अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: לְבוּשׁ הַבַּדִּים
  choice: मलमल के वस्त्र पहने
  rationale: यह प्रयोग वस्त्र की ठोस छवि और participial construction, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַיְאֹר
  choice: नदी
  rationale: दर्शन के संदर्भ में यह बड़ी नदी को सूचित करता है; यहाँ विशेष रूप से नील नदी कहना मूल पाठ से अधिक निश्चित होगा।
- source_word: וַיָּרֶם יְמִינוֹ וּשְׂמֹאלוֹ
  choice: उसने अपना दाहिना और बायाँ हाथ ... उठाया
  rationale: इब्रानी पाठ दोनों हाथों का अलग-अलग उल्लेख करता है; अनुवाद शपथ के इस गंभीर संकेत को सुरक्षित रखता है।
- source_word: בְּחֵי הָעוֹלָם
  choice: सदा जीवित रहनेवाले की शपथ खाकर
  rationale: इब्रानी शपथ-वाक्य का दिव्य संकेत स्पष्ट रखते हुए यह हिन्दी में स्वाभाविक और गंभीर है।
- source_word: לְמוֹעֵד מוֹעֲדִים וָחֵצִי
  choice: एक समय, समयों और आधे समय तक
  rationale: यह रहस्यात्मक काल-सूत्र की अनिश्चितता को बनाए रखता है और इकाइयों को स्पष्ट रूप से वर्ष नहीं बनाता।
- source_word: נַפֵּץ יַד עַם קֹדֶשׁ
  choice: पवित्र प्रजा की शक्ति को चकनाचूर करना
  rationale: יַד का यहाँ लाक्षणिक अर्थ ‘शक्ति’ है, जबकि ‘चकनाचूर’ נַפֵּץ की हिंसक तीव्रता को सुरक्षित रखता है।
- source_word: תִּכְלֶינָה כָל אֵלֶּה
  choice: ये सब बातें पूरी हो जाएँगी
  rationale: यह भविष्यवाणी की सभी बातों के अपने निर्धारित अंत तक पहुँचने का भाव देता है, विनाश का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: लְמוֹעֵד מוֹעֲדִים וָחֵצִי में रहस्यात्मक समयावधि
  choice: एक समय, समयों और आधे समय तक
  alternative: एक वर्ष, दो वर्ष और आधा वर्ष; अथवा एक नियत समय, नियत समयों और आधा
  rationale: मूल पाठ यहाँ समय की इकाइयों को स्पष्ट रूप से परिभाषित नहीं करता। मुख्य पाठ में रहस्यात्मक तनाव सुरक्षित रखा गया है और अधिक विशिष्ट व्याख्याएँ पादटिप्पणी में दी गई हैं।
- issue: יַד का लाक्षणिक अर्थ
  choice: पवित्र प्रजा की शक्ति
  alternative: पवित्र प्रजा का हाथ; पवित्र प्रजा का सामर्थ्य
  rationale: ‘शक्ति’ आधुनिक हिन्दी में इब्रानी लक्षणा को स्पष्ट करता है, बिना प्रजा पर होनेवाले प्रहार की गंभीरता घटाए।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। शपथ की गंभीरता तथा दर्शन की रहस्यात्मकता बनाए रखी गई है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘linen’ के बाद था, पर उसकी पादटिप्पणी समय-सूत्र से संबंधित है; इसलिए हिन्दी मुख्य पाठ में उसे संबंधित समय-वाक्यांश के बाद रखा गया है।
