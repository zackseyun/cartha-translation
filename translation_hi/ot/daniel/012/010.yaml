reference: Daniel 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִ֠תְבָּֽרֲרוּ וְ/יִֽתְלַבְּנ֤וּ וְ/יִצָּֽרְפוּ֙ רַבִּ֔ים וְ/הִרְשִׁ֣יעוּ רְשָׁעִ֔ים וְ/לֹ֥א יָבִ֖ינוּ כָּל רְשָׁעִ֑ים וְ/הַ/מַּשְׂכִּלִ֖ים יָבִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/010.yaml
  text: Many will purify themselves and make themselves white and be refined[a], but the wicked will act wickedly; and none of the wicked will understand[b], but those who have insight will understand.
translation:
  language: hi
  text: बहुत-से लोग अपने को शुद्ध करेंगे, अपने को उजला करेंगे और तपाए जाएँगे[a]; पर दुष्ट लोग दुष्टता करेंगे। दुष्टों में से कोई भी नहीं समझेगा, पर जो सूझ-बूझ रखते हैं, वे समझेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत-से लोग शुद्ध किए जाएँगे, उजले किए जाएँगे और तपाए जाएँगे।” पहली दो इब्रानी क्रियाएँ कर्मवाच्य अर्थ में भी समझी जा सकती हैं, यद्यपि उनके रूप मुख्य पाठ में दिए आत्मवाचक भाव की भी अनुमति देते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “बुद्धिमान लोग समझेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְבָּרֲרוּ
  choice: अपने आपको शुद्ध करेंगे
  rationale: हित्पएल रूप में आत्मवाचक या मध्यवाच्य भाव संभव है। यह चयन लोगों की प्रक्रिया में सहभागिता दिखाता है, पर वैकल्पिक कर्मवाच्य अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: יִתְלַבְּנוּ
  choice: अपने आपको उजला करेंगे
  rationale: לבן के हित्पएल रूप की ठोस ‘उजला होना/करना’ छवि को बनाए रखा गया है; केवल अमूर्त ‘शुद्ध’ कहने से मूल रूपक लुप्त हो जाता।
- source_word: יִצָּרְפוּ
  choice: तपाकर निर्मल किए जाएँगे
  rationale: צרף का निफ़अल रूप धातु को तपाकर मैल हटाने की कर्मवाच्य/मध्यवाच्य छवि देता है। यह हिन्दी अभिव्यक्ति परिष्कार और परीक्षा दोनों की रूपकात्मक संभावना बनाए रखती है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यहाँ विशेषण संज्ञा के रूप में अनिश्चित बहुवचन कर्ता है; स्पष्ट और सहज हिन्दी के लिए ‘लोग’ जोड़ा गया है।
- source_word: וְהִרְשִׁיעוּ רְשָׁעִים
  choice: दुष्ट लोग दुष्टता करते रहेंगे
  rationale: समजातीय शब्दों से बने मूल के जोर को ‘दुष्ट’ और ‘दुष्टता’ द्वारा बचाया गया है। प्रसंग में भावी निरंतर आचरण के लिए ‘करते रहेंगे’ स्वाभाविक है।
- source_word: וְלֹא יָבִינוּ כָּל רְשָׁעִים
  choice: दुष्टों में से कोई भी नहीं समझेगा
  rationale: इब्रानी के ‘सब’ के साथ निषेध को स्वाभाविक हिन्दी में पूर्ण निषेध के रूप में व्यक्त किया गया है।
- source_word: וְהַמַּשְׂכִּלִים יָבִינוּ
  choice: जो सूझ-बूझ रखते हैं, वे समझेंगे
  rationale: הַמַּשְׂכִּלִים में विवेक और अंतर्दृष्टि रखने वालों का भाव है। यह अनुवाद अंतिम יָבִינוּ के ‘समझेंगे’ से अर्थगत संबंध भी स्पष्ट रखता है।
theological_decisions:
- issue: पहली तीन क्रियाओं को आत्मवाचक सहभागिता या कर्मवाच्य शुद्धिकरण के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में पहली दो क्रियाएँ आत्मवाचक और तीसरी कर्मवाच्य रखी गई हैं।
  alternative: बहुत-से लोग शुद्ध किए जाएँगे, उजले किए जाएँगे और तपाकर निर्मल किए जाएँगे।
  rationale: पहली दो क्रियाएँ हित्पएल हैं और आत्मवाचक/मध्यवाच्य अर्थ दे सकती हैं, जबकि तीसरी निफ़अल है और स्वाभाविक रूप से कर्मवाच्य/मध्यवाच्य है। कर्ता के रूप में परमेश्वर को मूल पाठ स्पष्टतः नहीं कहता, इसलिए उसे अनुवाद में नहीं जोड़ा गया।
- issue: הַמַּשְׂכִּלִים को सामान्य ‘बुद्धिमान’ कहना या अंतर्दृष्टि रखने वालों के रूप में अनुवाद करना
  choice: जो सूझ-बूझ रखते हैं
  alternative: बुद्धिमान लोग
  rationale: यह पद केवल सामान्य बुद्धिमत्ता नहीं, समझने-विवेक करने की क्षमता पर बल देता है और अगली क्रिया ‘समझेंगे’ से निकट संबंध रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘उजला’ मूल की ठोस श्वेतता की छवि बचाता है, और ‘तपाकर निर्मल’ धातु-परिष्कार के रूपक को साधारण पाठक के लिए स्पष्ट करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
