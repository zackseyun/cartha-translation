source:
  edition: WLC
  text: וְ/הַ֨/מַּשְׂכִּלִ֔ים יַזְהִ֖רוּ כְּ/זֹ֣הַר הָ/רָקִ֑יעַ וּ/מַצְדִּיקֵי֙ הָֽ/רַבִּ֔ים כַּ/כּוֹכָבִ֖ים לְ/עוֹלָ֥ם וָ/עֶֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/003.yaml
  text: And those who have insight will shine like the brightness of the expanse[a], and those who make the many righteous[c][b], like the stars forever and ever.
translation:
  language: hi
  text: और जो समझ-बूझ रखते हैं, वे आकाश-मंडल की चमक के समान चमकेंगे[a]; और जो बहुतों को धर्मी बनाते हैं[b], वे तारों के समान सदा-सर्वदा चमकेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बुद्धिमान हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो बहुतों को धार्मिकता की ओर ले जाते हैं”; हिब्रू का अधिक शाब्दिक अर्थ “जो बहुतों को धर्मी बनाते हैं” अथवा “जो बहुतों को धर्मी ठहराते हैं” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּשְׂכִּלִים
  choice: जो समझ रखते हैं
  rationale: 'यह שכל के सहभागी रूप का भाव सुरक्षित रखता है: ऐसे लोग जिनकी पहचान समझ-बूझ या विवेक से होती है। यह केवल स्थिर विशेषण ‘बुद्धिमान’ से अधिक क्रियात्मक है।'
- source_word: יַזְהִרוּ
  choice: चमकेंगे
  rationale: यहाँ זהר का हिफ़ील रूप प्रकाशमान होने या चमकने का भाव देता है; आगे आने वाली उपमाओं के साथ ‘चमकेंगे’ स्वाभाविक है।
- source_word: כְּזֹהַר הָרָקִיעַ
  choice: आकाश-मंडल की चमक के समान
  rationale: זֹהַר को ‘चमक’ और רָקִיעַ को विस्तृत आकाशीय मंडल के अर्थ में लिया गया है। ‘आकाश-मंडल’ सामान्य ‘आकाश’ से अधिक स्रोत-सन्निकट और ‘नभमंडल’ से अधिक सहज है।
- source_word: וּמַצְדִּיקֵי הָרַבִּים
  choice: जो बहुतों को धर्मी ठहराते हैं
  rationale: צדק के हिफ़ील सहभागी रूप की कारक शक्ति को सीधे व्यक्त किया गया है। ‘धर्मी ठहराते हैं’ न्यायिक/घोषणात्मक अर्थ को सम्भव रखता है, जबकि पादटिप्पणी नैतिक-परिवर्तनकारी अर्थ भी सुरक्षित करती है। हिन्दी में निश्चितता-सूचक הָ को अलग शब्द द्वारा व्यक्त करना अस्वाभाविक होता, इसलिए הָרַבִּים का सहज रूप ‘बहुतों’ रखा गया है।
- source_word: כַּכּוֹכָבִים
  choice: तारों के समान
  rationale: यह स्पष्ट उपमा का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: לְעוֹלָם וָעֶד
  choice: सदा-सर्वदा
  rationale: युगानुयुग स्थायित्व पर दिए गए दोहरे बल को संक्षिप्त, प्रचलित और गरिमापूर्ण हिन्दी में बनाए रखता है।
theological_decisions:
- issue: מַצְדִּיקֵי הָרַבִּים का अर्थ
  choice: जो बहुतों को धर्मी ठहराते हैं
  alternative: जो बहुतों को धार्मिकता की ओर ले जाते हैं; जो बहुतों को धर्मी बनाते हैं
  rationale: हिब्रू कारक सहभागी रूप किसी को धर्मी घोषित करने, धर्मी बनाने, या धार्मिकता की ओर लाने के अर्थ दे सकता है। मुख्य पाठ में स्रोत के निकट ‘धर्मी ठहराते हैं’ रखा गया है और अन्य वास्तविक सम्भावनाएँ पादटिप्पणी में दी गई हैं, ताकि बाद की किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य न बनाया जाए।
- issue: प्रतिज्ञात चमक का वाक्यगत विस्तार
  choice: दूसरे खंड में ‘चमकेंगे’ दोहराया गया
  alternative: क्रिया को केवल पहले खंड से अध्याहृत मानना
  rationale: हिब्रू में दूसरे खंड की क्रिया अध्याहृत है। हिन्दी में उसे दोहराने से अर्थ स्पष्ट और स्वाभाविक होता है, बिना कोई नया दावा जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। ‘आकाश-मंडल’ स्रोत के רָקִיעַ की विस्तृत आकाशीय धारणा को व्यक्त करता है। पद की समानांतर रचना स्पष्ट करने के लिए दूसरे खंड में ‘चमकेंगे’ दोहराया गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
