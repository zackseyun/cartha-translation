  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘नियत भाग’ सामान्य पाठक के लिए ‘चिट्ठी’ से अधिक स्पष्ट है, जबकि मूल आवंटन-रूपक पादटिप्पणी में सुरक्षित है। ‘विश्राम’ और ‘खड़े होना’ को व्याख्यात्मक विस्तार दिए बिना रखा गया है।
