  text: But as for you[a], go to the end[d][c][b]; and you will rest and stand in your allotted place at the end of the days.
translation:
  language: hi
  text: परन्तु तुम अंत तक चले जाओ[a]। तुम विश्राम करोगे[b] और दिनों के अंत में अपने नियत भाग पर खड़े होगे[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘अंत की ओर चले जाओ।’ इब्रानी पदबंध किसी अंत-बिंदु की ओर जाने या अंत तक बने रहने—दोनों भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विश्राम करोगे’ सम्भवतः अंतिम पूर्णता से पहले दानिय्येल की मृत्यु की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘चिट्ठी द्वारा ठहराए गए अपने भाग के लिए/पर खड़े होगे’; भाव आवंटित हिस्सा या विरासत पाने का हो सकता है। संदर्भ में ‘खड़े होना’ पुनरुत्थान की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘दिनों के अंत में’ युगांत-संबंधी अभिव्यक्ति है; दानिय्येल 12:2 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: परन्तु तुम
  rationale: संयोजक और स्वतंत्र सर्वनाम दानिय्येल की ओर व्यक्तिगत तथा विरोधसूचक वापसी दिखाते हैं। ‘परन्तु तुम’ इस प्रवचनात्मक बदलाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵךְ לַ/קֵּץ
  choice: अन्त तक चले जाओ
  rationale: הלך का आदेशात्मक रूप ‘जाओ/चले जाओ’ है और לַקֵּץ किसी अन्त-बिन्दु की ओर जाने या वहाँ तक बने रहने का भाव दे सकता है। हिन्दी में ‘अन्त तक चले जाओ’ सहज है, जबकि वैकल्पिक दिशात्मक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְ/תָנוּחַ
  choice: तुम विश्राम करोगे
  rationale: अपूर्ण क्रिया यहाँ आदेश के बाद भविष्यकालीन परिणाम बताती है। נוח का मूल अर्थ ‘विश्राम करना’ है; यह मृत्यु की ओर संकेत कर सकता है, पर मुख्य पाठ उसे स्पष्ट करके अर्थ को सीमित नहीं करता।
- source_word: וְ/תַעֲמֹד
  choice: खड़े होगे
  rationale: עמד का सीधा अर्थ ‘खड़ा होना’ है। अध्याय के सन्दर्भ में पुनरुत्थान की अनुगूँज सम्भव है, फिर भी ‘खड़े होगे’ मूल रूपक और उसकी अर्थगत खुली सम्भावना को बनाए रखता है।
- source_word: לְ/גֹרָלְ/ךָ
  choice: अपने नियत भाग के लिए
  rationale: גּוֹרָל मूलतः चिट्ठी द्वारा ठहराया गया भाग और फिर आवंटित हिस्सा या विरासत है। ‘नियत भाग’ आधुनिक हिन्दी में बोधगम्य है और ‘भाग्य’ जैसे भ्रामक अर्थ से बचता है।
- source_word: לְ/קֵץ הַ/יָּמִין
  choice: दिनों के अन्त में
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है। इसका युगान्त-संबंधी भाव सुरक्षित रहता है, पर मुख्य पाठ उससे अधिक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: क्या וְתָנוּחַ मृत्यु को स्पष्ट रूप से बताता है या केवल विश्राम को
  choice: मुख्य पाठ में ‘तुम विश्राम करोगे’
  alternative: ‘तुम मृत्यु में विश्राम करोगे’
  rationale: सन्दर्भ सम्भवतः अन्तिम पूर्णता से पहले दानिय्येल की मृत्यु की ओर संकेत करता है, लेकिन क्रिया स्वयं केवल ‘विश्राम करना’ कहती है। इसलिए निहितार्थ को पादटिप्पणी में रखा गया है।
- issue: क्या וְתַעֲמֹד को स्पष्ट रूप से पुनरुत्थान के रूप में अनूदित किया जाए
  choice: ‘खड़े होगे’
  alternative: ‘फिर उठोगे’ या ‘जी उठोगे’
  rationale: दानिय्येल 12:2 के निकट सन्दर्भ में पुनरुत्थान स्वाभाविक संकेत है, पर עמד का शाब्दिक अर्थ ‘खड़ा होना’ है। मुख्य पाठ शब्द-चित्र को बनाए रखता है और धर्मवैज्ञानिक तनाव को हल नहीं करता।
- issue: לְגֹרָלְךָ में ‘भाग’ का स्वरूप
  choice: ‘अपने नियत भाग के लिए’
  alternative: ‘अपनी विरासत पाने के लिए’
  rationale: ‘विरासत’ सम्भव अर्थ है, पर मूल शब्द आवंटित भाग के व्यापक भाव को खुला रखता है। ‘नियत भाग’ उस व्यापकता को सुरक्षित रखता है।
