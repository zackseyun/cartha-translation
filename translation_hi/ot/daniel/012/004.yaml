reference: Daniel 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַתָּ֣ה דָֽנִיֵּ֗אל סְתֹ֧ם הַ/דְּבָרִ֛ים וַ/חֲתֹ֥ם הַ/סֵּ֖פֶר עַד עֵ֣ת קֵ֑ץ יְשֹׁטְט֥וּ רַבִּ֖ים וְ/תִרְבֶּ֥ה הַ/דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/004.yaml
  text: But you[a], Daniel, shut up the words and seal the book until the time of the end. Many will roam about[b], and knowledge will increase.
translation:
  language: hi
  text: परन्तु हे दानिय्येल, वचनों को बन्द रख और पुस्तक[a] को अन्त के समय तक मुहरबन्द कर दे। बहुत-से लोग इधर-उधर फिरेंगे[b], और ज्ञान बढ़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लपेटा हुआ ग्रन्थ।”
    reason: lexical_alternative
  - marker: b
    text: या, “बहुत-से लोग यहाँ-वहाँ दौड़ेंगे”; इब्रानी में खोजने या छानबीन करने का भाव भी सम्भव है, जिससे अर्थ हो सकता है, “बहुत-से लोग खोज करेंगे, और ज्ञान बढ़ेगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: סְתֹם
  choice: बन्द रख
  rationale: आज्ञार्थक क्रिया में किसी बात को बन्द करके पहुँच से दूर रखने का ठोस रूपक है। ‘बन्द रख’ इस रूपक को बनाए रखता है और पूर्ण गोपनीयता का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הַדְּבָרִים
  choice: इन वचनों
  rationale: דבר का अर्थ ‘वचन’ या ‘बात’ हो सकता है। प्रसंग में यह दानियेल को दिए गए प्रकाशन की ओर संकेत करता है; ‘इन वचनों’ हिन्दी में उस निकट सन्दर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֲתֹם
  choice: मुहर लगा दे
  rationale: यह किसी लिखित ग्रन्थ को मुहरबन्द करने की आज्ञा है। ‘मुहर लगा दे’ हिन्दी में स्पष्ट और स्वाभाविक है तथा संरक्षण और सीमित पहुँच—दोनों सम्भावनाएँ खुली रखता है।
- source_word: הַסֵּפֶר
  choice: इस पुस्तक
  rationale: סֵפֶר लिखित दस्तावेज़, पुस्तक या लपेटे हुए ग्रन्थ को सूचित कर सकता है। मुख्य पाठ में ‘पुस्तक’ सहज और व्यापक है; भौतिक स्वरूप का विकल्प पादटिप्पणी में रखा गया है।
- source_word: עַד עֵת קֵץ
  choice: अन्त के समय तक
  rationale: यह अन्त से सम्बन्धित निश्चित समय-सीमा बताता है। यह रूप स्थापित, संक्षिप्त और अनावश्यक व्याख्या से मुक्त है।
- source_word: יְשֹׁטְטוּ רַבִּים
  choice: बहुत-से लोग इधर-उधर फिरेंगे
  rationale: שוטט इधर-उधर चलने, घूमने या किसी वस्तु में खोज करने का भाव दे सकता है। मुख्य पाठ व्यापक गतिशील अर्थ रखता है, जबकि खोज या छानबीन की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְתִרְבֶּה הַדָּעַת
  choice: और ज्ञान बढ़ेगा
  rationale: רבה के साथ דַּעַת का सीधा और स्वाभाविक अर्थ है कि ज्ञान बढ़ेगा। यह कथन ज्ञान के प्रकार को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: יְשֹׁטְטוּ רַבִּים וְתִרְבֶּה הַדָּעַת का अभिप्राय
  choice: मुख्य पाठ यह कहता है कि बहुत-से लोग इधर-उधर फिरेंगे और ज्ञान बढ़ेगा, पर यह निश्चित नहीं करता कि बात सामान्य यात्रा, खोजपूर्ण छानबीन या भविष्यवाणी की बढ़ती समझ की है।
  alternative: इसे शाब्दिक आवागमन और सामान्य मानवीय ज्ञान की वृद्धि, अथवा ग्रन्थ में खोज करने और भविष्यवाणी की समझ बढ़ने के अर्थ में लिया जा सकता है।
  rationale: इब्रानी वाक्य एक से अधिक अर्थ-छायाओं की अनुमति देता है। अनुवाद किसी आधुनिक तकनीकी प्रगति या केवल भविष्यवाणी-अध्ययन को निश्चित अर्थ बनाकर मूल की व्याख्यात्मक और धर्मवैचारिक अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज रूप अपनाया गया है। दानियेल को एकवचन सम्बोधन और आज्ञाएँ (‘रख’, ‘लगा दे’) मूल व्याकरण को दर्शाती हैं। सभी पादटिप्पणी-चिह्न सम्बन्धित शब्द या वाक्यांश के तुरन्त बाद रखे गए हैं।
