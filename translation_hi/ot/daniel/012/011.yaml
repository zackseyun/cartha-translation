source:
  edition: WLC
  text: וּ/מֵ/עֵת֙ הוּסַ֣ר הַ/תָּמִ֔יד וְ/לָ/תֵ֖ת שִׁקּ֣וּץ שֹׁמֵ֑ם יָמִ֕ים אֶ֖לֶף מָאתַ֥יִם וְ/תִשְׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/011.yaml
  text: And from the time that the regular offering is removed and the abomination that desolates is set up[b][a], there will be 1,290 days.
translation:
  language: hi
  text: और जिस समय से नियमित भेंट[a] हटा दी जाएगी और उजाड़ने वाली घृणित वस्तु[b] स्थापित की जाएगी, तब से 1,290 दिन होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या परम्परागत रूप से, “नित्य बलिदान।” इब्रानी शब्द नियमित अथवा निरन्तर चढ़ाई जाने वाली मन्दिर की भेंट के लिए संक्षिप्त पद है।
    reason: lexical_alternative
  - marker: b
    text: या, “उजाड़ की घृणित वस्तु”; अथवा, “उजाड़ मचाने वाली घृणित वस्तु।”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵעֵת
  choice: और जिस समय से
  rationale: מִן के साथ עֵת समय के आरम्भ-बिंदु को सूचित करता है, और आरम्भिक וְ पिछले कथन से संबंध बनाए रखता है। यह हिन्दी प्रयोग दोनों बातों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּסַר
  choice: हटा दी जाएगी
  rationale: यह סור का होफ़ाल रूप है और निष्क्रिय रूप से हटाए जाने का अर्थ देता है। भविष्यकाल इस भविष्यसूचक संदर्भ में स्वाभाविक है।
- source_word: הַתָּמִיד
  choice: नियमित भेंट
  rationale: תָּמִיד यहाँ मन्दिर में नियमित रूप से चढ़ाई जाने वाली भेंट के लिए संक्षिप्त उपासना-संबंधी पद है। ‘नियमित भेंट’ मूल की संक्षिप्तता बनाए रखता है और उसे केवल एक विशेष प्रकार की बलि तक सीमित नहीं करता।
- source_word: וְלָתֵת
  choice: और ... स्थापित की जाएगी
  rationale: शाब्दिक अर्थ ‘और रखने/स्थापित करने के लिए’ है। समय-सूचक वाक्य में हिन्दी की स्वाभाविकता के लिए इसे आगामी संज्ञा के साथ निष्क्रिय क्रिया के रूप में व्यक्त किया गया है।
- source_word: שִׁקּוּץ
  choice: घृणित वस्तु
  rationale: यह शब्द विशेषकर मूर्तिपूजक या पवित्रता भंग करने वाली किसी घिनौनी वस्तु के लिए आता है। ‘घृणित वस्तु’ अर्थ को स्पष्ट रखता है, पर वस्तु की पहचान तय नहीं करता।
- source_word: שֹׁמֵם
  choice: उजाड़ने वाली
  rationale: שמם का यह कृदन्त שִׁקּוּץ को विशेषित करता और उसके उजाड़ने वाले प्रभाव को व्यक्त करता है। स्त्रीलिंग रूप हिन्दी में ‘वस्तु’ के अनुरूप है।
- source_word: יָמִים אֶלֶף מָאתַיִם וְתִשְׁעִים
  choice: 1,290 दिन होंगे
  rationale: इब्रानी में अवधि संक्षेप में ‘दिन—एक हजार दो सौ नब्बे’ कही गई है। ‘होंगे’ जोड़ने से हिन्दी वाक्य पूर्ण और स्पष्ट बनता है।
theological_decisions:
- issue: सर्वनामी उपासना-पद הַתָּמִיד का अर्थ
  choice: नियमित भेंट
  alternative: नित्य बलिदान
  rationale: इब्रानी पद में भेंट या बलि का संज्ञा-पद लुप्त है और यह नियमित मन्दिर-अनुष्ठान का संक्षिप्त संकेत है। मुख्य पाठ व्यापक अर्थ को बनाए रखता है; परम्परागत और अधिक विशिष्ट अनुवाद पादटिप्पणी में दिया गया है।
- issue: שִׁקּוּץ שֹׁמֵם की व्याकरणिक और धर्मवैचारिक अभिव्यक्ति
  choice: उजाड़ने वाली घृणित वस्तु
  alternative: उजाड़ का घृणित कारण; उजाड़ने वाली घृणित वस्तु के स्थान पर परम्परागत ‘उजाड़ने वाली घृणित वस्तु/उजाड़ का घृणित कारण’
  rationale: मुख्य अनुवाद שֹׁמֵם के सक्रिय कृदन्त-बल को बनाए रखता है। सम्बन्धवाचक या परिणामवाचक समझ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है, बिना उस वस्तु या घटना की पहचान निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘घृणित वस्तु’ जानबूझकर उसकी ऐतिहासिक पहचान को अनिर्धारित रखता है। अंक को 1,290 के रूप में रखा गया है ताकि अवधि तुरंत स्पष्ट हो।
