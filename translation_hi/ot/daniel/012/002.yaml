source:
  edition: WLC
  text: וְ/רַבִּ֕ים מִ/יְּשֵׁנֵ֥י אַדְמַת עָפָ֖ר יָקִ֑יצוּ אֵ֚לֶּה לְ/חַיֵּ֣י עוֹלָ֔ם וְ/אֵ֥לֶּה לַ/חֲרָפ֖וֹת לְ/דִרְא֥וֹן עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/002.yaml
  text: And many of those sleeping in the dust of the earth will awake[a], these to everlasting life, and those to reproaches[c][b], to everlasting contempt.
translation:
  language: hi
  text: और धरती की धूल में सोए हुओं में से बहुत-से जाग उठेंगे[a]—ये अनन्त जीवन के लिए, और वे निन्दाओं[b] के लिए और अनन्त घृणा[c] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धरती की धूल में सोए हुओं की बड़ी भीड़ जाग उठेगी।” इब्रानी में “बहुत-से” है, स्पष्ट रूप से “सब” नहीं।
    reason: alternative_reading
  - marker: b
    text: या, “लज्जा” अथवा “अपमान”।
    reason: lexical_alternative
  - marker: c
    text: या, “अनन्त घोर तिरस्कार” अथवा “अनन्त जुगुप्सा।” यशायाह 66:24 की तुलना करें, जहाँ न्याय के प्रसंग में सम्बन्धित विचार आता है।
    reason: cross_reference
lexical_decisions:
- source_word: רַבִּים
  choice: बहुत-से
  rationale: मूल शब्द का सीधा अर्थ ‘बहुत-से’ है। इसे ‘सब’ बनाना व्याख्यात्मक निष्कर्ष होगा; ‘बहुत-से’ मूल की वास्तविक अस्पष्टता बनाए रखता है।
- source_word: מִיְּשֵׁנֵי
  choice: सोए हुओं में से
  rationale: यह कृदन्त सोने वालों को दर्शाता है और मृत्यु के लिए प्रयुक्त निद्रा-रूपक को बिना खोले सुरक्षित रखता है।
- source_word: אַדְמַת עָפָר
  choice: धरती की धूल में
  rationale: यह स्वाभाविक हिन्दी में धूलमय भूमि, दफ़न और नश्वरता की मूल छवि बनाए रखता है।
- source_word: יָקִיצוּ
  choice: जाग उठेंगे
  rationale: यह जागने की क्रिया को व्यक्त करके सोने के रूपक को जारी रखता है; ‘जी उठेंगे’ पुनरुत्थान को अधिक स्पष्ट करता, पर मूल क्रिया की छवि को बदल देता।
- source_word: אֵלֶּה ... וְאֵלֶּה
  choice: इनमें से कुछ ... और कुछ
  rationale: शाब्दिक ‘ये ... और वे’ हिन्दी में पूर्व उल्लिखित समूहों के बिना असहज है। यह रूप दोनों विपरीत वर्गों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְחַיֵּי עוֹלָם
  choice: अनन्त जीवन के लिए
  rationale: ‘अनन्त जीवन’ आधुनिक हिन्दी में स्वाभाविक और स्थापित है तथा दीर्घकालिक, अंतहीन जीवन का भाव देता है।
- source_word: חֲרָפוֹת
  choice: निन्दाओं
  rationale: बहुवचन रूप और सामाजिक अपमान/धिक्कार के भाव को सुरक्षित रखने के लिए बहुवचन चुना गया है; ‘लज्जा’ अधिक प्रवाहपूर्ण विकल्प है।
- source_word: דִרְאוֹן
  choice: घृणा
  rationale: यह दुर्लभ संज्ञा घोर अरुचि या जुगुप्सा का संकेत देती है। ‘घृणा’ सामान्य पाठक के लिए स्पष्ट है; ‘घोर तिरस्कार’ एक सम्भव विकल्प है।
- source_word: עוֹלָם
  choice: अनन्त
  rationale: दोनों बार एक ही शब्द रखकर मूल समानान्तरता सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘बहुत-से’ द्वारा संकेतित पुनरुत्थान का विस्तार
  choice: רַבִּים का अनुवाद ‘बहुत-से’ किया गया है, ‘सब’ नहीं।
  alternative: इसे सामान्य पुनरुत्थान के अर्थ में ‘सब’ समझना, या बड़ी संख्या पर बल देने के लिए ‘असंख्य’ कहना।
  rationale: इब्रानी पाठ स्पष्टतः ‘बहुत-से’ कहता है। अनुवाद यह निर्णय नहीं करता कि प्रसंग में इसका आशय अन्ततः सभी मृतकों से है या नहीं।
- issue: नकारात्मक परिणाम का स्वरूप
  choice: दो अलग पदों को ‘निन्दाओं’ और ‘अनन्त घृणा’ के रूप में अलग रखा गया है।
  alternative: ‘लज्जा और अनन्त तिरस्कार’ अथवा ‘अपमान और अनन्त जुगुप्सा’।
  rationale: मूल में एक बहुवचन और एक एकवचन संज्ञा है। दोनों को अलग रखने से नकारात्मक परिणाम को बाद की किसी व्यवस्थित धर्मशास्त्रीय अभिव्यक्ति में समेटे बिना उसका गंभीर बल बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण पंजीकरण रखा गया है। ‘जाग उठेंगे’ निद्रा-रूपक को बनाए रखता है। ‘निन्दाओं’ कुछ असामान्य होते हुए भी मूल बहुवचन को दर्शाता है, इसलिए सरल विकल्प पादटिप्पणी में दिए गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
