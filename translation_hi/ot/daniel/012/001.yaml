reference: Daniel 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָ/עֵ֣ת הַ/הִיא֩ יַעֲמֹ֨ד מִֽיכָאֵ֜ל הַ/שַּׂ֣ר הַ/גָּד֗וֹל הָ/עֹמֵד֮ עַל בְּנֵ֣י עַמֶּ/ךָ֒ וְ/הָיְתָה֙ עֵ֣ת צָרָ֔ה אֲשֶׁ֤ר לֹֽא נִהְיְתָה֙ מִֽ/הְי֣וֹת גּ֔וֹי עַ֖ד הָ/עֵ֣ת הַ/הִ֑יא וּ/בָ/עֵ֤ת הַ/הִיא֙ יִמָּלֵ֣ט עַמְּ/ךָ֔ כָּל הַ/נִּמְצָ֖א כָּת֥וּב בַּ/סֵּֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/012/001.yaml
  text: And at that time Michael[a], the great prince who stands over the sons of your people, will arise. And there will be a time of distress such as has not happened since there was a nation until that time. And at that time your people will escape[c][b], everyone who is found written in the book.
translation:
  language: hi
  text: और उस समय मीकाएल, वह महान प्रधान जो तुम्हारे लोगों के पुत्रों के ऊपर खड़ा रहता है[a], उठ खड़ा होगा। और उस समय ऐसा संकट का समय आएगा, जैसा किसी जाति के अस्तित्व में आने से लेकर उस समय तक कभी नहीं आया होगा। और उस समय तुम्हारे लोग बच निकलेंगे[b]—हर वह व्यक्ति जो पुस्तक में लिखा हुआ पाया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हारे लोगों के पुत्रों की ओर से खड़ा रहता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “छुड़ाए जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲמֹד
  choice: उठ खड़ा होगा
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; इस अपोकैलिप्टिक प्रसंग में यह निर्णायक रूप से सक्रिय होने का भाव भी रखता है। ‘उठ खड़ा होगा’ दोनों पक्षों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַשַּׂר הַגָּדוֹל
  choice: वह महान प्रधान
  rationale: שׂר शासक, प्रधान अथवा राजकुमार को सूचित कर सकता है। दानिय्येल के स्वर्गीय सत्ताओं वाले प्रसंग में ‘महान प्रधान’ पद और अधिकार का भाव देता है तथा आधुनिक हिन्दी में सहज है।
- source_word: הָעֹמֵד עַל
  choice: जो ... के ऊपर खड़ा रहता है
  rationale: मुख्य पाठ में इब्रानी के ‘ऊपर खड़ा’ बिंब को सुरक्षित रखा गया है; इसके रक्षात्मक अथवा प्रतिनिधिक आशय को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: בְּנֵי עַמֶּךָ
  choice: तुम्हारे लोगों के पुत्रों
  rationale: בני के स्पष्ट पुल्लिंग रूप ‘पुत्रों’ को बनाए रखा गया है, यद्यपि इब्रानी प्रयोग में यह समुदाय के सदस्यों या वंशजों को सामूहिक रूप से भी सूचित कर सकता है।
- source_word: עֵת צָרָה
  choice: संकट का समय
  rationale: צרה का अर्थ संकट, क्लेश या विपत्ति है। ‘संकट’ गंभीरता को स्पष्ट, वर्तमान और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר לֹא נִהְיְתָה מִהְיוֹת גּוֹי
  choice: जैसा किसी जाति के अस्तित्व में आने से ... कभी नहीं आया होगा
  rationale: यह तुलना जाति के अस्तित्व में आने से लेकर उस समय तक के पूरे पूर्व इतिहास से करती है। हिन्दी वाक्य स्रोत का कालगत विस्तार बनाए रखता है।
- source_word: יִמָּלֵט
  choice: बच निकलेंगे
  rationale: מלט के निफ़अल रूप में बच निकलने और छुड़ाए जाने—दोनों की संभावना है। मुख्य पाठ में ‘बच निकलेंगे’ रखा गया है और दैवी निष्क्रिय अर्थ वाला विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: כָּל הַנִּמְצָא כָּתוּב
  choice: हर वह व्यक्ति जिसका नाम ... लिखा पाया जाएगा
  rationale: ‘लिखा पाया जाएगा’ इब्रानी संरचना को बनाए रखता है। हिन्दी में स्वाभाविक स्पष्टता के लिए ‘नाम’ जोड़ा गया है; इसका आशय व्यक्ति का पुस्तक में दर्ज होना है।
- source_word: בַּסֵּפֶר
  choice: पुस्तक में
  rationale: ספר पुस्तक या चर्मपत्र-पुस्तिका को सूचित कर सकता है। इस स्वर्गीय अभिलेख के प्रसंग में ‘पुस्तक’ मानक और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: मीकाएल की कार्रवाई का स्वरूप
  choice: ‘उठ खड़ा होगा’—लोगों की ओर से निर्णायक कार्रवाई के लिए खड़ा होना
  alternative: केवल ‘खड़ा होगा’, अथवा न्यायिक/सैनिक प्रतिरक्षा पर विशेष बल
  rationale: इब्रानी कई निकटवर्ती अर्थों की अनुमति देता है। चुना हुआ वाक्य सक्रियता और मूल ‘खड़े होने’ के बिंब दोनों को रखता है, पर स्वर्गदूत-विज्ञान का कोई विस्तृत निष्कर्ष आरोपित नहीं करता।
- issue: יִמָּלֵט में बचाव का अर्थ
  choice: मुख्य पाठ में ‘बच निकलेंगे’
  alternative: ‘छुड़ाए जाएँगे’, जिसमें बाहरी अथवा दैवी उद्धारकर्ता अधिक प्रत्यक्ष है
  rationale: रूप बच निकलने और छुड़ाए जाने दोनों को वहन कर सकता है। मुख्य पाठ तत्काल अपोकैलिप्टिक संकट से सुरक्षित निकलने को सामने रखता है; व्यापक अंतिम उद्धार की संभावना को न तो नकारता है, न ही शब्द में अनिवार्य रूप से भरता है।
- issue: पुस्तक में लिखे होने का आशय
  choice: पाठ इसे स्वर्गीय अभिलेख के रूप में रहने देता है
  alternative: इसे सीधे किसी विकसित पारिभाषिक सिद्धान्त, जैसे ‘जीवन की पुस्तक’, से नामित करना
  rationale: यह पद केवल ‘पुस्तक’ कहता है। अनिर्दिष्टता बनाए रखने से निकट और व्यापक शास्त्रीय संदर्भों के बीच तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। इब्रानी की पुनरुक्ति ‘उस समय’ और ‘और’ को बनाए रखा गया है। ‘मीकाएल’ मूल מיכאל के निकट लिप्यंतरण है। मुख्य पाठ में शाब्दिक बिंब और स्वाभाविक हिन्दी के बीच संतुलन रखा गया है; जहाँ स्रोत वास्तविक अर्थ-विकल्प देता है, वहाँ पादटिप्पणी जोड़ी गई है।
