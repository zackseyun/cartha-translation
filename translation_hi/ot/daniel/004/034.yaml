language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּעַ֞ן אֲנָ֣ה נְבוּכַדְנֶצַּ֗ר מְשַׁבַּ֨ח וּ/מְרוֹמֵ֤ם וּ/מְהַדַּר֙ לְ/מֶ֣לֶךְ שְׁמַיָּ֔/א דִּ֤י כָל מַעֲבָד֨וֹ/הִי֙ קְשֹׁ֔ט וְ/אֹרְחָתֵ֖/הּ דִּ֑ין וְ/דִי֙ מַהְלְכִ֣ין בְּ/גֵוָ֔ה יָכִ֖ל לְ/הַשְׁפָּלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/034.yaml
  text: I, Nebuchadnezzar, praise and exalt and honor the King of heaven, because all his works are truth, and his ways are justice; and those who walk in pride he is able to humble.
translation:
  language: hi
  text: अब मैं, नबूकदनेस्सर, स्वर्ग के राजा की स्तुति करता हूँ, उसे महान ठहराता हूँ और उसका आदर करता हूँ, क्योंकि उसके सभी काम सत्य हैं और उसके मार्ग न्यायपूर्ण[a] हैं; और जो घमंड में चलते हैं, उन्हें वह नीचा कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: न्याय के हैं।'
    reason: अरामी में यहाँ विशेषण नहीं, ‘न्याय’ अर्थ वाली संज्ञा דִּין है; वैकल्पिक रूप मूल संरचना को अधिक सीधे दर्शाता है।
lexical_decisions:
- source_word: כְּעַן
  choice: अब
  rationale: यह अरामी काल-सूचक क्रियाविशेषण है; पद में नबूकदनेस्सर के बदले हुए दृष्टिकोण और वर्तमान घोषणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְשַׁבַּח וּמְרוֹמֵם וּמְהַדַּר
  choice: स्तुति करता हूँ, उसे ऊँचा ठहराता हूँ और उसका आदर करता हूँ
  rationale: तीनों समानांतर कृदन्तों की अलग-अलग अर्थछटाएँ और संचयी बल बनाए रखे गए हैं।
- source_word: קְשֹׁט
  choice: सत्य
  rationale: अरामी संज्ञा का सीधा अर्थ ‘सत्य’ है; यह परमेश्वर के सभी कामों की विश्वसनीय और खरी प्रकृति बताती है।
- source_word: דִּין
  choice: न्यायपूर्ण
  rationale: ‘मार्ग’ के साथ विधेय संज्ञा को स्वाभाविक हिन्दी विशेषण के रूप में व्यक्त किया गया है, जबकि न्याय/न्याय-विधान की मूल धारणा सुरक्षित है।
- source_word: מַהְלְכִין בְּגֵוָה
  choice: जो घमंड से चलते हैं
  rationale: ‘चलना’ रूपक और घमंडी जीवन-रीति दोनों को मूल के निकट रखते हुए सुरक्षित किया गया है।
- source_word: יָכִל לְהַשְׁפָּלָה
  choice: उन्हें वह नीचा कर सकता है
  rationale: सामर्थ्य सूचक क्रिया ‘सकना’ और कारणवाचक ‘नीचा करना’ दोनों स्पष्ट रूप से बनाए रखे गए हैं।
theological_decisions:
- issue: परमेश्वर के मार्गों के लिए דִּין का अर्थ
  choice: न्यायपूर्ण
  alternative: न्याय / न्याय-विधान
  rationale: यह अनुवाद परमेश्वर के मार्गों की न्याय-संगतता बताता है, पर शब्द को केवल दंडात्मक न्याय तक सीमित नहीं करता।
- issue: घमंडियों को नीचा करने की सामर्थ्य
  choice: नीचा कर सकता है
  alternative: नीचा करता है
  rationale: मूल अरामी יָכִל स्पष्टतः सामर्थ्य व्यक्त करता है; इसे सामान्य अनिवार्य क्रिया में बदलना मूल की कथन-सीमा से आगे जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। राजकीय स्वीकारोक्ति की औपचारिकता बनाए रखने के लिए तीनों स्तुतिपरक क्रियाएँ अलग-अलग दी गई हैं।
