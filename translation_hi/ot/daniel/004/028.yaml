source:
  edition: WLC
  text: ע֗וֹד מִלְּתָ/א֙ בְּ/פֻ֣ם מַלְכָּ֔/א קָ֖ל מִן שְׁמַיָּ֣/א נְפַ֑ל לָ֤/ךְ אָֽמְרִין֙ נְבוּכַדְנֶצַּ֣ר מַלְכָּ֔/א מַלְכוּתָ֖/ה עֲדָ֥ת מִנָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/028.yaml
  text: 'While the word was still in the king’s mouth[a], a voice fell from heaven: “To you it is said, King Nebuchadnezzar, the kingdom has departed from you.”'
translation:
  language: hi
  text: 'जब राजा के मुँह में अभी बात ही थी कि स्वर्ग से एक आवाज़ आई: “हे राजा नबूकदनेस्सर, तुझे यह कहा जाता है: राज्य तुझसे चला गया है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राज्य तुझसे ले लिया गया है।”
    reason: עֲדָת सन्दर्भ में राज्य के हटाए या ले लिए जाने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: עוֹד מִלְּתָא בְּפֻם מַלְכָּא
  choice: बात अभी राजा के मुँह में ही थी
  rationale: अरामी मुहावरे और घटना के बीच में अचानक आए व्यवधान—दोनों को बनाए रखता है। ‘बात’ आधुनिक हिन्दी में स्वाभाविक है, जबकि ‘मुँह में ही थी’ मूल बिंब को सुरक्षित रखता है।
- source_word: קָל מִן שְׁמַיָּא נְפַל
  choice: स्वर्ग से एक आवाज़ आई
  rationale: נְפַל का शाब्दिक अर्थ ‘गिरी’ है, पर हिन्दी में ‘आवाज़ गिरी’ अस्वाभाविक और भ्रामक होगा। ‘आई’ आवाज़ के ऊपर से पहुँचने का भाव स्वाभाविक ढंग से व्यक्त करता है; שְׁמַיָּא को न्याय की ईश्वरीय घोषणा के संदर्भ में ‘स्वर्ग’ किया गया है।
- source_word: לָךְ אָמְרִין
  choice: तुझसे कहा जाता है
  rationale: अरामी बहुवचन कृदंत यहाँ अनिश्चित कर्ता वाला, कर्मवाच्य-सदृश औपचारिक कथन है। यह रूप उस अस्पष्टता को बनाए रखता है और किसी वक्ता का नाम नहीं जोड़ता।
- source_word: נְבוּכַדְנֶצַּר מַלְכָּא
  choice: हे राजा नबूकदनेस्सर
  rationale: सम्बोधन को स्पष्ट करने के लिए ‘हे’ और आधुनिक हिन्दी के स्वाभाविक पदक्रम में उपाधि को नाम से पहले रखा गया है।
- source_word: מַלְכוּתָה עֲדָת מִנָּךְ
  choice: राज्य तुझसे चला गया है
  rationale: עֲדָת के ‘चले जाने/हट जाने’ के मूल भाव को बनाए रखता है और सीधे कर्मवाच्य ‘छीन लिया गया’ को मुख्य पाठ में थोपने से बचता है। सन्दर्भ में राजकीय शासन और अधिकार दोनों निहित हैं।
theological_decisions:
- issue: घोषणा में ‘स्वर्ग’ का आशय
  choice: स्वर्ग से
  alternative: आकाश से
  rationale: यह ईश्वरीय न्याय की घोषणा है; ‘स्वर्ग’ मूल पद के धार्मिक और स्थानगत दोनों संकेतों को बनाए रखता है, जबकि ‘आकाश’ इसे केवल भौतिक दिशा जैसा बना सकता है।
- issue: राज्य के जाने में कर्ता की अभिव्यक्ति
  choice: राज्य तुझसे चला गया है
  alternative: राज्य तुझसे ले लिया गया है
  rationale: मूल क्रिया सीधे उस कर्ता का उल्लेख नहीं करती जिसने राज्य हटाया। मुख्य पाठ इस व्याकरणिक खुलापन को बनाए रखता है, जबकि सन्दर्भ में ईश्वरीय न्याय स्पष्ट बना रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राजा के मुँह में’ मूल अरामी बिंब को जानबूझकर सुरक्षित रखता है; ‘आवाज़ आई’ हिन्दी की स्वाभाविक अभिव्यक्ति है। सम्बोधन में एकवचन ‘तू’ के रूप (‘तुझसे’) मूल के प्रत्यक्ष, न्यायसूचक सम्बोधन और हिन्दी बाइबिलीय गरिमा के अनुरूप हैं।
