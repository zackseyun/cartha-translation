  text: וּ/מִנִּ/י֙ שִׂ֣ים טְעֵ֔ם לְ/הַנְעָלָ֣ה קָֽדָמַ֔/י לְ/כֹ֖ל חַכִּימֵ֣י בָבֶ֑ל דִּֽי פְשַׁ֥ר חֶלְמָ֖/א יְהֽוֹדְעֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/003.yaml
  text: And by me a decree was issued to bring before me all the wise men of Babylon[a], that they might make known to me the interpretation of the dream.
translation:
  language: hi
  text: और मेरी ओर से एक आदेश जारी किया गया कि बाबुल के सभी बुद्धिमानों को मेरे सामने लाया जाए, ताकि वे मुझे स्वप्न की व्याख्या[a] बता सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वप्न का अर्थ मुझे बता सकें।”
    reason: פְשַׁר का अर्थ ‘व्याख्या’ या ‘अर्थ’ हो सकता है। मुख्य पाठ में ‘व्याख्या’ दानिय्येल में इस पद के तकनीकी प्रयोग को अधिक प्रत्यक्ष रूप से दर्शाता है।
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: और मैंने आदेश जारी किया
  rationale: अरामी पदबंध का शाब्दिक भाव है कि आदेश राजा की ओर से निर्धारित हुआ। राजकीय-प्रशासनिक संदर्भ में सक्रिय हिन्दी वाक्य ‘मैंने आदेश जारी किया’ इसी अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לְהַנְעָלָה קָדָמַי
  choice: मेरे सामने लाया जाए
  rationale: कारक क्रिया-रूप व्यक्तियों को राजा की उपस्थिति में ले आने का भाव देता है; हिन्दी में कर्मवाच्य आदेश की विषयवस्तु को सहजता से व्यक्त करता है।
- source_word: לְכֹל חַכִּימֵי בָבֶל
  choice: बाबुल के सभी बुद्धिमानों को
  rationale: यह रचना बाबुल के राजदरबार से जुड़े ज्ञानी विशेषज्ञों के पूरे वर्ग को सूचित करती है। ‘बुद्धिमान’ सामान्य पाठक के लिए स्पष्ट है और मूल के व्यापक पद को अनावश्यक रूप से किसी खास पेशे तक सीमित नहीं करता।
- source_word: דִּי
  choice: ताकि
  rationale: यहाँ यह कण आदेश के उद्देश्य को प्रस्तुत करता है; ‘ताकि’ हिन्दी में उस प्रयोजन को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְשַׁר חֶלְמָא
  choice: स्वप्न का अर्थ
  rationale: פְשַׁר स्वप्न के अर्थ या उसकी व्याख्या को दर्शाने वाला तकनीकी पद है। ‘स्वप्न का अर्थ’ सहज आधुनिक हिन्दी है, जबकि ‘व्याख्या’ को पादटिप्पणी में समान रूप से संभव विकल्प के रूप में रखा गया है।
- source_word: יְהוֹדְעֻנַּנִי
  choice: वे मुझे … बता सकें
  rationale: कारक क्रिया का मूल भाव ‘मुझे ज्ञात कराएँ’ है। ‘मुझे … बता सकें’ आधुनिक हिन्दी में स्वाभाविक है और प्रयोजनवाचक आशय बनाए रखता है।
