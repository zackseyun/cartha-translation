id: DAN.4.4
reference: Daniel 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אדַ֣יִן עללין חַרְטֻמַיָּ/א֙ אָֽשְׁפַיָּ֔/א כשדי/א וְ/גָזְרַיָּ֑/א וְ/חֶלְמָ֗/א אָמַ֤ר אֲנָה֙ קֳדָ֣מֵי/ה֔וֹן וּ/פִשְׁרֵ֖/הּ לָא מְהוֹדְעִ֥ין לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/004.yaml
  text: Then the magicians[a], enchanters, Chaldeans, and diviners came in, and I told the dream before them[b], but they did not make its interpretation known to me.
translation:
  language: hi
  text: तब जादूगर, मंत्रवेत्ता, कसदी[a] और शकुन-विचारक भीतर आए। मैंने उनके सामने स्वप्न बताया, पर उन्होंने उसकी व्याख्या मुझे नहीं बताई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कसदी’ केवल एक जातीय समूह का नाम नहीं, बल्कि बाबुल के दरबार में विद्या और शकुन-विचार से जुड़े विशेषज्ञों के एक वर्ग का पदनाम भी हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, “वे उसकी व्याख्या मुझे नहीं बता सके।” अरामी पाठ सीधे कहता है कि उन्होंने व्याख्या नहीं बताई; उनकी असमर्थता प्रसंग से निकाला गया निष्कर्ष है।
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: עללין
  choice: भीतर आए
  rationale: बहुवचन क्रिया प्रवेश करने या राजदरबार में उपस्थित होने का भाव देती है; ‘भीतर आए’ उस दृश्य को सहज रूप से व्यक्त करता है।
- source_word: חַרְטֻמַיָּא
  choice: जादूगर
  rationale: यह बाबुल के गुप्त विद्याओं से जुड़े दरबारी विशेषज्ञों के एक वर्ग का प्रचलित और सामान्य पाठक के लिए स्पष्ट नाम है।
- source_word: אָשְׁפַיָּא
  choice: मंत्रवेत्ता
  rationale: यह मंत्र या जादुई क्रियाओं से जुड़े विशेषज्ञों के एक अलग वर्ग को सूचित करता है और सूची में ‘जादूगर’ से यथासम्भव भेद बनाए रखता है।
- source_word: כשדי/א
  choice: कसदी
  rationale: मूल का जातिनाम अथवा पदनाम सुरक्षित रखा गया है; इस दरबारी सूची में यह बाबुली विद्वान-विशेषज्ञों के एक वर्ग को भी सूचित कर सकता है।
- source_word: גָזְרַיָּא
  choice: शकुन-विचारक
  rationale: सन्दर्भ में यह भविष्यसूचक संकेतों के आधार पर निष्कर्ष या व्याख्या बताने वालों का बोध कराता है; यह हिन्दी में ‘भविष्यवक्ता’ जैसे धार्मिक रूप से भिन्न पद से बचता है।
- source_word: חֶלְמָא
  choice: स्वप्न
  rationale: सन्दर्भ में राजा का निश्चित स्वप्न अभिप्रेत है। हिन्दी में ‘स्वप्न बताया’ उसी पहचाने हुए स्वप्न का स्वाभाविक उल्लेख है।
- source_word: אָמַר אֲנָה קֳדָמֵיהוֹן
  choice: मैंने उनके सामने स्वप्न बताया
  rationale: ‘उनके सामने’ मूल के उपस्थिति-बोध को सुरक्षित रखता है, जबकि पूरा वाक्य आधुनिक हिन्दी में स्वाभाविक रहता है।
- source_word: וּפִשְׁרֵהּ
  choice: उसकी व्याख्या
  rationale: दानिय्येल में यह पद स्वप्न या रहस्य की व्याख्या के तकनीकी अर्थ में आता है; ‘व्याख्या’ केवल सामान्य ‘अर्थ’ से अधिक सटीक है।
- source_word: לָא מְהוֹדְעִין לִי
  choice: उन्होंने उसकी व्याख्या मुझे नहीं बताई
  rationale: कारक क्रिया का अर्थ ‘ज्ञात कराना/बताना’ है। हिन्दी रूप मूल के सीधे कथन—उन्होंने नहीं बताया—को बनाए रखता है और स्पष्ट रूप से ‘नहीं बता सके’ नहीं जोड़ता।
theological_decisions:
- issue: अन्तिम खण्ड को केवल न बताने के रूप में अनुवादित किया जाए या असमर्थता के रूप में
  choice: उन्होंने उसकी व्याख्या मुझे नहीं बताई
  alternative: वे उसकी व्याख्या मुझे नहीं बता सके
  rationale: अरामी पाठ निषेध के साथ ‘ज्ञात कराना’ क्रिया का प्रयोग करता है और सीधे तौर पर यह कहता है कि व्याख्या नहीं बताई गई। प्रसंग से असमर्थता का अनुमान हो सकता है, पर उसे मुख्य पाठ में जोड़ना मूल से अधिक स्पष्ट दावा करना होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। दरबारी गुप्त-विद्या विशेषज्ञों की चार श्रेणियों के बीच भेद बनाए रखने के लिए ‘जादूगर’, ‘मंत्रवेत्ता’, ‘कसदी’ और ‘शकुन-विचारक’ चुने गए हैं। मुख्य पाठ मूल की अस्पष्टता बनाए रखता है और असमर्थता को केवल पादटिप्पणी में वैकल्पिक अर्थ के रूप में देता है।
