source:
  edition: WLC
  text: דְּנָה֙ חֶלְמָ֣/א חֲזֵ֔ית אֲנָ֖ה מַלְכָּ֣/א נְבוּכַדְנֶצַּ֑ר ו/אנתה בֵּלְטְשַׁאצַּ֜ר פִּשְׁרֵ֣/א אֱמַ֗ר כָּ/ל קֳבֵל֙ דִּ֣י כָּל חַכִּימֵ֣י מַלְכוּתִ֗/י לָֽא יָכְלִ֤ין פִּשְׁרָ/א֙ לְ/הוֹדָ֣עֻתַ֔/נִי ו/אנתה כָּהֵ֔ל דִּ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בָּֽ/ךְ׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/015.yaml
  text: This is the dream that I[a], King Nebuchadnezzar, saw. And you, Belteshazzar, tell its interpretation, because all the wise men of my kingdom are not able to make its interpretation known to me, but you are able, for the spirit of the holy gods is in you.
translation:
  language: hi
  text: यह वह स्वप्न है जिसे मैंने देखा—मैं, राजा नबूकदनेस्सर। और हे बेलतशस्सर, तू इसका अर्थ बता, क्योंकि मेरे राज्य के सभी ज्ञानी जन इसका अर्थ मुझे बताने में समर्थ नहीं हैं; पर तू समर्थ है, क्योंकि पवित्र देवताओं की आत्मा[a] तुझमें है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र परमेश्वर की आत्मा तुझमें है।” अरामी में “देवताओं” और “पवित्र” के रूप बहुवचन हैं, पर कुछ लोग इस वाक्यांश को एकमात्र परमेश्वर के संदर्भ में समझते हैं।
    reason: वैकल्पिक व्याख्या और मूल की वास्तविक धार्मिक-व्याकरणिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: דְּנָה חֶלְמָא
  choice: यह वही स्वप्न है
  rationale: निर्देशक सर्वनाम और निश्चित संज्ञा को स्वाभाविक हिन्दी में प्रस्तुत करता है; ‘वही’ पहले वर्णित स्वप्न की ओर स्पष्ट संकेत देता है।
- source_word: חֲזֵית אֲנָה מַלְכָּא נְבוּכַדְנֶצַּר
  choice: जो मुझ राजा नबूकदनेस्सर ने देखा
  rationale: प्रथम पुरुष और राजकीय पदनाम की समानाधिकरण संरचना को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: וְאַנתָּה בֵּלְטְשַׁאצַּר
  choice: और हे बेलतशस्सर, तू
  rationale: प्रत्यक्ष संबोधन और मूल संयोजक ‘और’ दोनों सुरक्षित हैं; ‘हे’ हिन्दी में संबोधन स्पष्ट करता है।
- source_word: פִּשְׁרֵא אֱמַר
  choice: इसका अर्थ बता
  rationale: פשר का प्रसंगानुकूल अर्थ स्वप्न की व्याख्या है; सामान्य पाठक के लिए ‘अर्थ’ स्वाभाविक है और ‘इसका’ इसे स्वप्न से जोड़ता है।
- source_word: כָּל־קֳבֵל דִּי
  choice: क्योंकि
  rationale: अरामी कारणसूचक पदबंध का स्पष्ट आधुनिक हिन्दी समतुल्य।
- source_word: כָּל חַכִּימֵי מַלְכוּתִי
  choice: मेरे राज्य के सभी बुद्धिमान
  rationale: दरबारी ज्ञानी वर्ग का सामान्य और प्रसंगोचित हिन्दी निरूपण।
- source_word: לָא יָכְלִין פִּשְׁרָא לְהוֹדָעוּתַנִי
  choice: इसका अर्थ मुझे बताने में समर्थ नहीं हैं
  rationale: ידע के causative भाव ‘ज्ञात कराना’ को सहज हिन्दी ‘मुझे बताना’ से व्यक्त किया गया है।
- source_word: וְאַנתָּה כָּהֵל
  choice: पर तू समर्थ है
  rationale: मूल संयोजक औपचारिकतः ‘और’ है, पर पूर्ववर्ती असमर्थता के साथ स्पष्ट विरोध को हिन्दी में ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: पवित्र देवताओं की आत्मा
  rationale: אֱלָהִין और קַדִּישִׁין के बहुवचन रूपों तथा बाबुली राजा की वाणी को मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין का एकवचन या बहुवचन धार्मिक संदर्भ
  choice: पवित्र देवताओं की आत्मा
  alternative: पवित्र परमेश्वर का आत्मा
  rationale: ‘देवताओं’ और ‘पवित्र’ के अरामी रूप रूपात्मक रूप से बहुवचन हैं और वक्ता बाबुल का राजा है। फिर भी व्याकरण और संदर्भ के आधार पर इसे इस्राएल के एक परमेश्वर का उल्लेख मानने की परंपरा मौजूद है; इसलिए वैकल्पिक पाठ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। राजकीय प्रत्यक्ष वचन में ‘तू’ रखा गया है, क्योंकि राजा अपने अधीनस्थ को एकवचन में संबोधित कर रहा है; भाषा अपमानजनक न होकर प्रसंगानुकूल है।
