source:
  edition: WLC
  text: חֵ֥לֶם חֲזֵ֖ית וִֽ/ידַחֲלִנַּ֑/נִי וְ/הַרְהֹרִין֙ עַֽל מִשְׁכְּבִ֔/י וְ/חֶזְוֵ֥י רֵאשִׁ֖/י יְבַהֲלֻנַּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/002.yaml
  text: I saw a dream[a], and it frightened me; and the thoughts on my bed and the visions of my head terrified me.
translation:
  language: hi
  text: मैंने एक स्वप्न देखा, और उसने मुझे डरा दिया; मेरे बिछौने पर के विचारों और मेरे मन में आए दर्शनों ने मुझे व्याकुल कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मेरे बिछौने पर के चिंतन और मेरे सिर के दर्शनों ने मुझे घबरा दिया।”
    reason: ‘विचार/चिंतन,’ ‘मन में आए/सिर के,’ और ‘व्याकुल/घबरा’ के वैध शाब्दिक विकल्पों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: חֵלֶם
  choice: एक स्वप्न
  rationale: अरामी संज्ञा का सीधा अर्थ ‘स्वप्न’ है। ‘एक स्वप्न’ इस कथन की अनिश्चितता और आरंभिक प्रत्यक्षता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֲזֵית
  choice: मैंने ... देखा
  rationale: यह חזי का प्रथम पुरुष एकवचन पूर्ण रूप है; ‘मैंने देखा’ सीधा और स्वाभाविक अनुवाद है।
- source_word: וִידַחֲלִנַּנִי
  choice: और उसने मुझे डरा दिया
  rationale: क्रिया भय उत्पन्न करने का भाव व्यक्त करती है और एकवचन कर्ता निकटवर्ती ‘स्वप्न’ की ओर संकेत करता है; इसलिए ‘उसने’ उस संबंध को स्पष्ट करता है।
- source_word: וְהַרְהֹרִין
  choice: विचारों
  rationale: यह शब्द मानसिक विचार, चिंतन या मन में उठने वाली बातों को दर्शाता है। ‘विचार’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: עַל מִשְׁכְּבִי
  choice: मेरे बिछौने पर उठे
  rationale: ‘बिछौने पर’ मूल स्थान-संबंधी चित्र को रखता है; ‘उठे’ हिन्दी में विचारों के उस समय मन में आने का स्वाभाविक संकेत देता है।
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: और मेरे मन में आए दर्शनों
  rationale: शाब्दिक रूप ‘मेरे सिर के दर्शन’ है, जो मानसिक दृश्यों के लिए सामी मुहावरा है। ‘मेरे मन में आए दर्शन’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: יְבַהֲלֻנַּנִי
  choice: मुझे आतंकित कर दिया
  rationale: בהל तीव्र व्याकुलता, घबराहट या आतंक उत्पन्न करने का भाव देता है। यह चुनाव पहले प्रयुक्त ‘डरा दिया’ से इसकी अधिक तीव्रता को अलग रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बिछौना,’ ‘स्वप्न’ और ‘दर्शन’ मूल के स्वप्न-वर्णन की गंभीरता और चित्रात्मकता बनाए रखते हैं; अधिक शाब्दिक सामी अभिव्यक्ति पाद-टिप्पणी में दी गई है।
