  text: בֵּ/הּ זִמְנָ֞/א מַנְדְּעִ֣/י יְת֣וּב עֲלַ֗/י וְ/לִ/יקַ֨ר מַלְכוּתִ֜/י הַדְרִ֤/י וְ/זִוִ/י֙ יְת֣וּב עֲלַ֔/י וְ/לִ֕/י הַדָּֽבְרַ֥/י וְ/רַבְרְבָנַ֖/י יְבַע֑וֹן וְ/עַל מַלְכוּתִ֣/י הָתְקְנַ֔ת וּ/רְב֥וּ יַתִּירָ֖ה ה֥וּסְפַת לִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/033.yaml
  text: At that time my reason returned to me[a], and for the glory of my kingdom, my majesty and splendor returned to me. My counselors and my nobles sought me, and I was reestablished over my kingdom[c][b], and surpassing greatness was added to me.
translation:
  language: hi
  text: उसी समय मेरी समझ-बूझ मेरे पास लौट आई[a]। मेरे राज्य की महिमा के लिए मेरा गौरव और वैभव भी मेरे पास लौट आया। मेरे सलाहकारों और उच्चाधिकारियों ने मेरी खोज की[b]। मुझे अपने राज्य पर फिर से स्थापित किया गया[c], और मुझे और भी बड़ी महानता दी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी बुद्धि’ अथवा ‘मेरा विवेक’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे मंत्री और मेरे सामन्तों ने मुझे खोजा’।
    reason: lexical_alternative
  - marker: c
    text: या ‘मुझे अपने राज्य पर बहाल किया गया’ अथवा ‘मेरे राज्य पर मेरी स्थिति फिर दृढ़ की गई’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: उसी समय
  rationale: यह अरामी कालसूचक पद बहाली की घटना को पिछले प्रसंग से जोड़ता है; ‘उसी समय’ स्वाभाविक है और समय की निकटता बनाए रखता है।
- source_word: מַנְדְּעִי
  choice: मेरी समझ-बूझ
  rationale: प्रसंग में यह नबूकदनेस्सर की लौटी हुई मानसिक और विवेकशील क्षमता को दर्शाता है। ‘समझ-बूझ’ आधुनिक हिन्दी में स्पष्ट है और केवल ज्ञान-संग्रह तक अर्थ को सीमित नहीं करता।
- source_word: יְתוּב עֲלַי
  choice: मेरे पास लौट आई
  rationale: मूल क्रिया ‘लौटना’ है। यह अनुवाद पद में दोहराई गई बहाली की भाषा को बनाए रखता है।
- source_word: לִיקַר מַלְכוּתִי
  choice: मेरे राज्य की महिमा के लिए
  rationale: לִ उपसर्ग के प्रयोजन अथवा संबंधसूचक बल को खुला रखते हुए मूल की कुछ कठिन अभिव्यक्ति को संरक्षित किया गया है।
- source_word: הַדְרִי וְזִוִי
  choice: मेरा गौरव और वैभव
  rationale: दोनों निकटार्थी शब्द राजकीय प्रतिष्ठा, गरिमा और बाहरी तेज को व्यक्त करते हैं; अलग हिन्दी शब्द रखकर मूल का युग्म बचाया गया है।
- source_word: הַדָּבְרַי וְרַבְרְבָנַי
  choice: मेरे सलाहकार और मेरे उच्चाधिकारी
  rationale: पहला पद राजकीय परामर्शदाताओं और दूसरा राज्य के बड़े पदाधिकारियों अथवा कुलीनों को सूचित करता है। यह रूप आधुनिक पाठक के लिए स्पष्ट है।
- source_word: יְבַעוֹן
  choice: मुझे ढूँढ़ने लगे
  rationale: क्रिया का मूल अर्थ ‘ढूँढ़ना/खोज करना’ है। हिन्दी में यह पुनः राजा की ओर आने और उसका पता करने का भाव देता है, बिना ‘परामर्श करना’ निश्चित किए।
- source_word: עַל מַלְכוּתִי הָתְקְנַת
  choice: मुझे अपने राज्य पर फिर से स्थापित किया गया
  rationale: निष्क्रिय रूप और पुनर्बहाली दोनों सुरक्षित हैं; कर्ता को स्पष्ट रूप से परमेश्वर बताकर पद से अधिक नहीं जोड़ा गया।
- source_word: רְבוּ יַתִּירָה הוּסְפַת לִי
  choice: मुझे पहले से भी बढ़कर महानता प्रदान की गई
  rationale: यह अत्यधिक अथवा अतिरिक्त महानता और उसके बाहर से मिलने का भाव स्वाभाविक हिन्दी में व्यक्त करता है, जबकि निष्क्रिय वाक्य-रचना बनी रहती है।
theological_decisions:
- issue: राजा की बहाली में परमेश्वर के कर्तृत्व की स्पष्टता
  choice: निष्क्रिय अभिव्यक्तियाँ रखी गईं, पर इस पद में ‘परमेश्वर ने’ नहीं जोड़ा गया।
  alternative: बहाली और महानता को स्पष्ट रूप से परमेश्वर द्वारा दिया हुआ कहना।
  rationale: व्यापक प्रसंग परमप्रधान के कर्तृत्व को स्पष्ट करता है, पर इस पद की अरामी भाषा कर्ता को अप्रकट रखती है। अनुवाद उसी निहितता को बनाए रखता है।
- issue: לִיקַר מַלְכוּתִי का संबंध
  choice: ‘मेरे राज्य की महिमा के लिए’ के रूप में प्रयोजन/संबंध की अस्पष्टता बनाए रखी गई।
  alternative: ‘मेरे राज्य की महिमा सहित’ या ‘मेरे राज्य के सम्मान के अनुरूप’ कहना।
  rationale: अरामी לִ का सटीक संबंध व्याख्यायित किया जा सकता है; मुख्य पाठ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय प्रसंग के लिए ‘गौरव’, ‘वैभव’, ‘उच्चाधिकारी’ और ‘स्थापित’ जैसे औपचारिक किंतु प्रचलित शब्द चुने गए हैं। मूल अरामी के निष्क्रिय रूप और अर्थगत तनाव को यथासंभव सुरक्षित रखा गया है।
