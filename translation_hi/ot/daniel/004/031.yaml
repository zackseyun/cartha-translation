  text: וְ/לִ/קְצָ֣ת יֽוֹמַיָּ/ה֩ אֲנָ֨ה נְבוּכַדְנֶצַּ֜ר עַיְנַ֣/י לִ/שְׁמַיָּ֣/א נִטְלֵ֗ת וּ/מַנְדְּעִ/י֙ עֲלַ֣/י יְת֔וּב ו/ל/עלי/א בָּרְכֵ֔ת וּ/לְ/חַ֥י עָלְמָ֖/א שַׁבְּחֵ֣ת וְ/הַדְּרֵ֑ת דִּ֤י שָׁלְטָנֵ/הּ֙ שָׁלְטָ֣ן עָלַ֔ם וּ/מַלְכוּתֵ֖/הּ עִם דָּ֥ר וְ/דָֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/031.yaml
  text: At the end of the days[a], I, Nebuchadnezzar, lifted my eyes to heaven, and my understanding returned to me; and I blessed the Most High, and I praised and honored him who lives forever, for his dominion is an everlasting dominion, and his kingdom is from generation to generation.
translation:
  language: hi
  text: उन दिनों के अन्त में मैं, नबूकदनेस्सर, अपनी आँखें आकाश की ओर उठाईं, और मेरी समझ[a] मेरे पास लौट आई। मैंने परमप्रधान को धन्य कहा और जो सदा जीवित है उसकी स्तुति और उसका आदर किया, क्योंकि उसका प्रभुत्व सदा का प्रभुत्व है, और उसका राज्य पीढ़ी से पीढ़ी तक बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा विवेक मेरे पास लौट आया।” अरामी शब्द का अर्थ ज्ञान, समझ या विवेक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִקְצָת יֽוֹמַיָּה
  choice: उन दिनों के अन्त में
  rationale: यह अरामी मुहावरा पहले बताई गई नियत अवधि की समाप्ति को सूचित करता है। यह अनुवाद मूल के ‘दिनों’ को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: עַיְנַי לִשְׁמַיָּא נִטְלֵת
  choice: अपनी आँखें आकाश की ओर उठाईं
  rationale: यह मूल शारीरिक क्रिया और परमेश्वर की ओर उन्मुख होने के निहित भाव—दोनों को सुरक्षित रखता है।
- source_word: וּמַנְדְּעִי עֲלַי יְתוּב
  choice: मेरी समझ मेरे पास लौट आई
  rationale: מַנְדַּע ज्ञान, समझ या विवेक को सूचित कर सकता है। प्रसंग में ‘समझ’ मानसिक स्पष्टता की बहाली बताती है, पर किसी आधुनिक चिकित्सीय श्रेणी को अनावश्यक रूप से आरोपित नहीं करती।
- source_word: לעליא
  choice: परमप्रधान
  rationale: दानिय्येल में प्रयुक्त इस ईश्वरीय उपाधि का यह प्रतिष्ठित, संक्षिप्त और अर्थ-सटीक हिन्दी रूप है।
- source_word: בָּרְכֵת
  choice: धन्य कहा
  rationale: इसके बाद स्तुति के लिए अलग क्रिया आती है; इसलिए ‘धन्य कहा’ दोनों क्रियाओं का भेद सुरक्षित रखता है।
- source_word: לְחַי עָלְמָא
  choice: जो सदा जीवित है
  rationale: यह परमेश्वर को अनन्तकाल तक जीवित रहनेवाले के रूप में व्यक्त करता है और हिन्दी में सहज है।
- source_word: שַׁבְּחֵת וְהַדְּרֵת
  choice: उसकी स्तुति और उसका आदर किया
  rationale: दोनों निकटार्थी किन्तु भिन्न क्रियाओं को अलग रखते हुए समानान्तरता सुरक्षित की गई है।
- source_word: שָׁלְטָנֵהּ שָׁלְטָן עָלַם
  choice: उसका प्रभुत्व सदा का प्रभुत्व है
  rationale: मूल की सजातीय पुनरुक्ति बल देती है; ‘प्रभुत्व’ दानिय्येल के राजकीय शब्द-संसार के अनुकूल है।
- source_word: וּמַלְכוּתֵהּ עִם דָּר וְדָר
  choice: उसका राज्य पीढ़ी से पीढ़ी तक बना रहता है
  rationale: अरामी पदबंध लगातार आनेवाली पीढ़ियों को दर्शाता है। ‘बना रहता है’ क्रियारहित उपवाक्य में निहित स्थायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: नबूकदनेस्सर की परमेश्वर-विषयक स्तुति में व्यक्तिगत संदर्भ
  choice: जो सदा जीवित है उसकी स्तुति और उसका आदर किया
  alternative: सदा जीवित रहनेवाले की स्तुति और महिमा की
  rationale: मूल में पूर्वसर्गीय पद के बाद कृदन्तीय वर्णन है। चुना हुआ रूप व्यक्तिगत और स्तुतिपरक बल बनाए रखता है तथा ‘आदर’ द्वारा הַדְּרֵת को ‘महिमा’ जैसी अधिक व्याख्यात्मक धार्मिक शब्दावली में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। पारम्परिक रूप से परिचित ‘परमप्रधान’, ‘धन्य कहा’ और ‘प्रभुत्व’ को रखा गया है, जबकि अस्पष्ट मानसिक अवस्था को किसी आधुनिक चिकित्सीय शब्द से निश्चित नहीं किया गया। फुटनोट का चिह्न उसी शब्द ‘समझ’ पर रखा गया है जिससे वह वास्तव में सम्बद्ध है।
