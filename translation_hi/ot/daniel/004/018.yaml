id: DAN.4.18
reference: Daniel 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָפְיֵ֤/הּ שַׁפִּיר֙ וְ/אִנְבֵּ֣/הּ שַׂגִּ֔יא וּ/מָז֨וֹן לְ/כֹ֖לָּ/א בֵ֑/הּ תְּחֹת֗וֹ/הִי תְּדוּר֙ חֵיוַ֣ת בָּרָ֔/א וּ/בְ/עַנְפ֕וֹ/הִי יִשְׁכְּנָ֖ן צִפֲּרֵ֥י שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/018.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field lived, and in its branches the birds of the heavens dwelled.
translation:
  language: hi
  text: उसके पत्ते सुंदर थे और उसका फल बहुत था; उसमें सबके लिए भोजन था। उसके नीचे खुले मैदान के पशु रहते थे, और उसकी शाखाओं में आकाश के पक्षी[a] रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाशों के पक्षी।”
    reason: मूल अरामी में “आकाश” का बहुवचन रूप है; मुख्य पाठ में स्वाभाविक हिन्दी प्रयोग रखा गया है।
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: उसके पत्ते
  rationale: यह सामूहिक रूप से पेड़ के पत्तों या पर्णसमूह को दर्शाता है। साधारण आधुनिक हिन्दी में “पत्ते” अधिक सहज है।
- source_word: שַׁפִּיר
  choice: सुंदर
  rationale: यह विशेषण सुंदरता या मनोहरता व्यक्त करता है; “सुंदर” स्पष्ट और स्वाभाविक आधुनिक हिन्दी है।
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: उसका फल बहुतायत में था
  rationale: אִנְבֵּהּ पेड़ के फल को और שַׂגִּיא उसकी बड़ी मात्रा को दर्शाता है। यह वाक्यांश अर्थ और हिन्दी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: उसमें सबके लिए भोजन था
  rationale: यह अनुवाद मूल के स्थानवाचक भाव “उसमें” को सुरक्षित रखते हुए מָזוֹן का सीधा अर्थ “भोजन” देता है।
- source_word: תְּחֹתוֹהִי תְּדוּר חֵיוַת בָּרָא
  choice: उसके नीचे मैदान के पशु रहते थे
  rationale: חֵיוַת בָּרָא खुले मैदान या वन्य क्षेत्र के पशुओं को दर्शाता है, और תְּדוּר के निवास करने के भाव को “रहते थे” सहज रूप से व्यक्त करता है।
- source_word: וּבְעַנְפוֹהִי
  choice: उसकी डालियों में
  rationale: עַנְפוֹהִי पेड़ की शाखाओं को दर्शाता है। “डालियाँ” पक्षियों और पेड़ के इस दृश्य में स्वाभाविक हिन्दी है।
- source_word: יִשְׁכְּנָן
  choice: बसेरा करते थे
  rationale: क्रिया बसने या निवास करने का भाव देती है। पक्षियों के संदर्भ में “बसेरा करते थे” स्वाभाविक है और घोंसला बनाने का अनावश्यक विशिष्ट अर्थ नहीं जोड़ता।
- source_word: צִפֲּרֵי שְׁמַיָּא
  choice: आकाश के पक्षी
  rationale: शाब्दिक संरचना “आकाशों के पक्षी” है, पर आधुनिक हिन्दी में “आकाश के पक्षी” उसी अर्थ का स्वाभाविक रूप है; बहुवचन रूप को पादटिप्पणी में बताया गया है।
