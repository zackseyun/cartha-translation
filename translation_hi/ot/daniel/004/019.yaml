- from: तू ही वह राजा है, जो महान और शक्तिशाली हो गया है। तेरी महानता बढ़कर आकाश तक पहुँच गई है, और तेरा प्रभुत्व पृथ्वी के छोर तक[a] पहुँच गया है।
  to: आप ही वह राजा हैं, जो महान और शक्तिशाली हो गए हैं। आपकी महानता बहुत बढ़ गई है और आकाश तक पहुँच गई है, और आपका प्रभुत्व पृथ्वी के छोर तक[a] पहुँच गया है।
  rationale: The revision retains the source’s emphatic identification and its royal-hyperbolic extent language, while using modern respectful Hindi for the king and making the growth of his greatness explicit. The singular ‘छोर’ remains in the text; the alternative plural is retained only as a lexical footnote.
