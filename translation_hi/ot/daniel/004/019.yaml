review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the king and preserves the sequence of royal growth, greatness reaching heaven, and dominion extending to the earth’s extremity. ‘आकाश’ suitably renders the idiomatic Aramaic plural ‘heavens’ in this image. The proposed revision more clearly represents the intensified/repeated רבה wording in ‘your greatness has become great’ as ‘बहुत बढ़ गई है.’
  naturalness: The draft’s repeated ‘तू/तेरी/तेरा’ is grammatically possible in older Bible register but is liable to sound disrespectful or overly archaic in modern standard Hindi when addressing a king. Honorific ‘आप/आपकी/आपका’ is natural, dignified, and does not alter the source’s singular address.
  terminology: ‘राजा,’ ‘महान,’ ‘शक्तिशाली,’ and ‘प्रभुत्व’ are appropriate modern formal terms. ‘पृथ्वी के छोर तक’ properly reflects the singular Aramaic expression, while the footnote transparently supplies the idiomatic plural alternative without deciding the historical scope of the royal hyperbole.
  issues:
  - severity: medium
    issue: Second-person register is not optimally natural for a royal direct address in modern standard Hindi.
    rationale: ‘तू’ can be used in traditional biblical idiom, but in current Hindi it commonly conveys intimacy, inferiority, or disrespect. ‘आप’ supplies an appropriately dignified direct address without adding theological or interpretive content.
  - severity: low
    issue: The source’s emphatic repetition concerning the king’s greatness is somewhat muted.
    rationale: ‘महानता बढ़कर’ is understandable, but ‘महानता बहुत बढ़ गई है’ expresses the resulting magnitude more explicitly and reads more naturally.
  revised_text: आप ही वह राजा हैं, जो महान और शक्तिशाली हो गए हैं। आपकी महानता बहुत बढ़ गई है और आकाश तक पहुँच गई है, और आपका प्रभुत्व पृथ्वी के छोर तक[a] पहुँच गया है।
