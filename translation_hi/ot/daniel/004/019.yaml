id: DAN.4.19
reference: Daniel 4:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אנתה ה֣וּא מַלְכָּ֔/א דִּ֥י רְבַ֖ית וּ/תְקֵ֑פְתְּ וּ/רְבוּתָ֤/ךְ רְבָת֙ וּ/מְטָ֣ת לִ/שְׁמַיָּ֔/א וְ/שָׁלְטָנָ֖/ךְ לְ/ס֥וֹף אַרְעָֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/019.yaml
  text: You are the king[a], who has grown great and strong; your greatness has become great and reached to heaven, and your dominion to the end of the earth.
translation:
  language: hi
  text: आप ही वह राजा हैं, जो महान और शक्तिशाली हो गए हैं। आपकी महानता बहुत बढ़ गई है और आकाश तक पहुँच गई है, और आपका प्रभुत्व पृथ्वी के छोर तक[a] पहुँच गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के छोरों तक।”
    reason: अरामी में ‘छोर’ एकवचन है, पर हिन्दी में बहुवचन भी इसी व्यापक अर्थ को स्वाभाविक ढंग से व्यक्त कर सकता है।
lexical_decisions:
- source_word: אַנְתָּה הוּא מַלְכָּא
  choice: तू ही वह राजा है
  rationale: सर्वनाम और संकेतवाचक पद के बलयुक्त पहचान-वाक्य को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ राजा को स्वप्न के वृक्ष के रूप में पहचाना गया है।
- source_word: דִּי רְבַית וּתְקֵפְתְּ
  choice: जो महान और शक्तिशाली हो गया है
  rationale: दोनों क्रियाएँ राजा के महान तथा शक्तिशाली हो जाने को दर्शाती हैं; संयुक्त पूर्ण रूप हिन्दी में सहज है।
- source_word: וּרְבוּתָךְ רְבָת
  choice: तेरी महानता बढ़कर
  rationale: רבה से जुड़े शब्दों की पुनरुक्ति का कुछ अंश ‘महानता बढ़कर’ में बना रहता है, जबकि असहज ‘तेरी महानता महान हो गई’ से बचा गया है।
- source_word: וּמְטָת לִשְׁמַיָּא
  choice: आकाश तक पहुँच गई है
  rationale: क्रिया का अर्थ ‘पहुँचना’ है और अरामी बहुवचन यहाँ आकाश/स्वर्ग के लिए मुहावरेदार है; दृश्य ऊँचाई के संदर्भ में ‘आकाश’ स्वाभाविक है।
- source_word: וְשָׁלְטָנָךְ
  choice: तेरा प्रभुत्व
  rationale: राजकीय अधिकार और शासन-क्षेत्र का भाव सुरक्षित रखता है तथा दानिय्येल की राजकीय भाषा के अनुकूल है।
- source_word: לְסוֹף אַרְעָא
  choice: पृथ्वी के छोर तक
  rationale: शाब्दिक एकवचन ‘पृथ्वी के छोर तक’ रखा गया है; यह व्यापक राजकीय प्रभुत्व बताता है, बिना उसके ऐतिहासिक विस्तार को व्याख्या द्वारा सीमित या पूर्णतः वैश्विक ठहराए।
theological_decisions:
- issue: राजा के शासन का विस्तार
  choice: पृथ्वी के छोर तक
  alternative: पृथ्वी के छोरों तक
  rationale: मूल अरामी का एकवचन व्यापक राजकीय प्रभुत्व की भाषा को ज्यों का त्यों रखता है। अनुवाद यह तय नहीं करता कि कथन कठोर भौगोलिक अर्थ में विश्वव्यापी है या प्राचीन राजकीय अतिशयोक्ति।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सुबोध हिन्दी। नबूकदनेस्सर से सीधे संबोधन के कारण ‘तू/तेरी/तेरा’ रखा गया है; यह निकट या अनादरपूर्ण बोलचाल नहीं, बल्कि बाइबिलीय एकवचन प्रत्यक्ष संबोधन है।
