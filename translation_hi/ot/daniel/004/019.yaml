  revision_rationale: The revision retains the source’s emphatic identification and its royal-hyperbolic extent language, while using modern respectful Hindi for the king and making the growth of his greatness explicit. The singular ‘छोर’ remains in the text; the alternative plural is retained only as a lexical footnote.
