base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/001.yaml
  text: I[a], Nebuchadnezzar[b], was at ease in my house and flourishing in my palace.
translation:
  language: hi
  text: मैं, नबूकदनेस्सर, अपने घर में निश्चिन्त[a] और अपने राजमहल में फलता-फूलता[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुरक्षित”; अरामी शब्द शान्ति या सुरक्षा की अवस्था पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “खुशहाल”; यह शब्द स्फूर्ति, उन्नति और समृद्धि का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנָה
  choice: मैं
  rationale: स्वतंत्र प्रथम-पुरुष सर्वनाम है; नाम के साथ मूल की समानाधिकरण संरचना को ‘मैं, नबूकदनेस्सर’ के रूप में रखा गया है।
- source_word: נְבוּכַדְנֶצַּר
  choice: नबूकदनेस्सर
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप रखा गया है।
- source_word: שְׁלֵה
  choice: निश्चिन्त
  rationale: अरामी विशेषण शान्ति, चैन अथवा सुरक्षित अवस्था का बोध करा सकता है; ‘निश्चिन्त’ आधुनिक हिन्दी में इस व्यक्तिगत दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲוֵית
  choice: था
  rationale: यहाँ सरल भूतकालीन संयोजक क्रिया है, जो स्वप्न से पहले राजा की अवस्था बताती है।
- source_word: בְּבֵיתִי
  choice: अपने घर में
  rationale: मूल के ठोस स्थान और ‘अपने राजमहल में’ के साथ समानांतरता को बनाए रखता है।
- source_word: וְרַעְנַן
  choice: और ... फलता-फूलता
  rationale: यह शब्द ताज़गी, स्फूर्ति और समृद्ध दशा का बोध कराता है; ‘फलता-फूलता’ हिन्दी में जीवन्त उन्नति और खुशहाली दोनों व्यक्त करता है।
- source_word: בְּהֵיכְלִי
  choice: अपने राजमहल में
  rationale: इस राजकीय संदर्भ में הֵיכַל का अर्थ मंदिर नहीं, राजा का महल है; ‘राजमहल’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
