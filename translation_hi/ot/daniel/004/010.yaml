    text: या ‘एक स्वर्गीय पहरेदार’; अरामी में शाब्दिक रूप से ‘एक पहरेदार, एक पवित्र जन’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָזֵה הֲוֵית
  choice: देख रहा था
  rationale: कृदंत और ‘होना’ क्रिया का यह परिप्रयुक्त रूप भूतकाल में जारी क्रिया बताता है; इसलिए हिन्दी का अपूर्ण भूतकाल उपयुक्त है।
- source_word: בְּחֶזְוֵי רֵאשִׁי
  choice: मन में आए दर्शन
  rationale: शाब्दिक अर्थ ‘मेरे सिर के दर्शनों में’ है, पर आधुनिक हिन्दी में वह अस्वाभाविक होगा। यह चयन मानसिक-दर्शन का आशय स्पष्ट रखते हुए ‘दर्शन’ की बहुवचन धारणा बनाए रखता है।
- source_word: עַל מִשְׁכְּבִי
  choice: अपने बिस्तर पर लेटा हुआ
  rationale: यह स्थान और परिस्थिति दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַאֲלוּ
  choice: और देखो
  rationale: यह ध्यान आकृष्ट करनेवाले अरामी कथन-सूचक का निकट और स्पष्ट हिन्दी समतुल्य है।
- source_word: עִיר
  choice: एक पहरेदार
  rationale: विशिष्ट पद ‘जागते रहनेवाले/निगरानी करनेवाले’ स्वर्गीय प्राणी को सूचित करता है। इसे केवल ‘स्वर्गदूत’ कहने के बजाय विशिष्ट रूपक बनाए रखा गया है।
- source_word: וְקַדִּישׁ
  choice: एक पवित्र जन
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और ‘पहरेदार’ के समानाधिकरण में उसी प्राणी का वर्णन करता है।
- source_word: מִן שְׁמַיָּא
  choice: स्वर्ग से
  rationale: अरामी रूप व्याकरणतः बहुवचन है, पर इस प्रसंग में हिन्दी का एकवचन ‘स्वर्ग’ स्वाभाविक और अर्थसंगत है।
- source_word: נָחִת
  choice: नीचे उतरा
  rationale: क्रिया की नीचे की ओर गति को सरल, कथात्मक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: עִיר וְקַדִּישׁ की पहचान
  choice: ‘एक पहरेदार, एक पवित्र जन’ के रूप में विशिष्ट अरामी पदों को बनाए रखा गया है।
  alternative: ‘एक स्वर्गदूत’ या ‘एक स्वर्गीय दूत’
  rationale: पद स्वयं इस प्राणी को सामान्य शब्द ‘स्वर्गदूत’ नहीं कहता। शाब्दिक पहचान बनाए रखने से पाठ से अधिक विशिष्ट धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन में आए दर्शन’ अरामी मुहावरे ‘मेरे सिर के दर्शन’ का स्वाभाविक हिन्दी रूप है, जबकि ‘पहरेदार, एक पवित्र जन’ की विशिष्ट और कुछ असामान्य पदावली जानबूझकर सुरक्षित रखी गई है।
