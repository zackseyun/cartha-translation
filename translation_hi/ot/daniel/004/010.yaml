  text: मैं अपने बिस्तर पर लेटा हुआ मन में दर्शन देख रहा था। और देखो, एक पहरेदार, एक पवित्र जन[a], स्वर्ग से नीचे उतरा।
  philosophy: optimal-equivalence
  footnotes:
