source:
  edition: WLC
  text: וְ/כָל דארי אַרְעָ/א֙ כְּ/לָ֣ה חֲשִׁיבִ֔ין וּֽ/כְ/מִצְבְּיֵ֗/הּ עָבֵד֙ בְּ/חֵ֣יל שְׁמַיָּ֔/א ו/דארי אַרְעָ֑/א וְ/לָ֤א אִיתַי֙ דִּֽי יְמַחֵ֣א בִ/ידֵ֔/הּ וְ/יֵ֥אמַר לֵ֖/הּ מָ֥ה עֲבַֽדְתְּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/032.yaml
  text: And all the inhabitants of the earth are regarded as nothing[a], and he does according to his will among the army of heaven and among the inhabitants of the earth; and there is no one who can strike his hand or say to him[b], “What have you done?”
translation:
  language: hi
  text: और पृथ्वी के सारे निवासी न के बराबर समझे जाते हैं। वह स्वर्ग की सेना[a] में और पृथ्वी के निवासियों में अपनी इच्छा के अनुसार कार्य करता है; और कोई भी उसके हाथ पर प्रहार नहीं कर सकता[b] या उससे यह नहीं कह सकता, “तूने क्या किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गीय दल।” यह पद स्वर्गीय प्राणियों या शक्तियों के समूह को व्यापक रूप से दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उसके हाथ पर प्रहार कर सकता”; अर्थात उसके काम में बाधा डाल सकता या उसे रोक सकता।
    reason: idiom_explanation
lexical_decisions:
- source_word: דארי אַרְעָא
  choice: पृथ्वी के निवासी
  rationale: अरामी कृदन्तीय पद पृथ्वी पर रहने वालों को दर्शाता है। यह सहज आधुनिक हिन्दी है और प्रसंग के सार्वभौमिक दायरे को बनाए रखता है।
- source_word: כְּלָה חֲשִׁיבִין
  choice: न के बराबर समझे जाते हैं
  rationale: यह पद मूल्यांकन या गिनती में कुछ न माने जाने का भाव देता है; यह उनके अस्तित्व का निषेध किए बिना मूल अर्थ व्यक्त करता है।
- source_word: וּכְמִצְבְּיֵהּ
  choice: अपनी इच्छा के अनुसार
  rationale: संज्ञा इच्छा, अभिलाषा या प्रसन्नता का अर्थ दे सकती है। चुना हुआ रूप स्वाभाविक है और दैवी प्रभुता के कथन को यथावत रखता है।
- source_word: עָבֵד
  choice: कार्य करता है
  rationale: सामान्य क्रिया ‘करना/कार्य करना’ है। हिन्दी में ‘कार्य करता है’ इस वाक्य में सहज और गरिमापूर्ण है।
- source_word: בְּחֵיל שְׁמַיָּא
  choice: स्वर्ग की सेना
  rationale: חֵיל का अर्थ सेना, सैन्यबल या दल हो सकता है। ‘स्वर्ग की सेना’ मूल सैन्य बिंब को सुरक्षित रखती है और इसे केवल स्वर्गदूतों या तारों तक सीमित नहीं करती।
- source_word: וְלָא אִיתַי דִּי
  choice: और कोई भी ... नहीं कर सकता
  rationale: अरामी अस्तित्ववाचक रचना आगे कही गई बात की असम्भवता पर बल देती है; हिन्दी में यह रूप स्वाभाविक रूप से वही बल व्यक्त करता है।
- source_word: יְמַחֵא בִידֵהּ
  choice: उसके हाथ पर प्रहार नहीं कर सकता
  rationale: शाब्दिक बिंब ‘उसके हाथ पर प्रहार करना’ है, जबकि मुहावरे का आशय उसके काम में बाधा डालना या उसे रोकना है। मुख्य पाठ बिंब को रखता है और पादटिप्पणी उसका आशय बताती है।
- source_word: מָה עֲבַדְתְּ
  choice: तूने क्या किया है?
  rationale: अरामी में यह सीधे एकवचन पुरुष को सम्बोधित पूर्ण क्रिया है। हिन्दी पूर्णकाल और सीधी चुनौती की प्रश्नवाचक शक्ति को सुरक्षित रखा गया है।
theological_decisions:
- issue: प्रभुतापूर्वक कार्य करने वाले का संदर्भ
  choice: मूल के अनुसार ‘वह/उसके’ सर्वनामों से संकेत
  alternative: ‘परमप्रधान’ या ‘परमेश्वर’ नाम स्पष्ट रूप से जोड़ना
  rationale: निकटवर्ती प्रसंग कर्ता की पहचान परमप्रधान के रूप में करता है, पर इस वाक्य में अरामी पाठ सर्वनाम रखता है। अनुवाद संदर्भ को पहचान करने देता है और नाम नहीं जोड़ता।
- issue: בְּחֵיל שְׁמַיָּא में स्वर्गीय समुदाय का दायरा
  choice: स्वर्ग की सेना
  alternative: स्वर्गदूतों की सेना; आकाशीय पिंडों का समूह
  rationale: अरामी पद स्वर्गीय सेना को व्यापक रूप से सूचित करता है। किसी एक विशिष्ट पहचान को चुनना पाठ की अपेक्षा अधिक निश्चितता जोड़ देता।
- issue: יְמַחֵא בִידֵהּ का बिंब और मुहावरेदार अर्थ
  choice: मुख्य पाठ में ‘उसके हाथ पर प्रहार’ और पादटिप्पणी में बाधा देने/रोकने का आशय
  alternative: मुख्य पाठ में केवल ‘उसका हाथ रोक सके’
  rationale: यह चयन मूल का सजीव बिंब और उसका व्यवहारिक अर्थ दोनों सुरक्षित रखता है, बिना मुहावरे को चुपचाप केवल व्याख्यात्मक रूप में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘न के बराबर’ साधारण पाठक के लिए स्पष्ट है, जबकि ‘स्वर्ग की सेना’ मूल सैन्य बिंब को बनाए रखती है। परमेश्वर से प्रत्यक्ष प्रश्न में ‘तूने’ का प्रयोग अरामी एकवचन सम्बोधन और हिन्दी बाइबलीय गरिमा के अनुरूप है।
