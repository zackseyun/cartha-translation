  text: וְ/לָ֣/ךְ טָֽרְדִ֣ין מִן אֲנָשָׁ֡/א וְ/עִם חֵיוַ֣ת בָּרָ/א֩ לֶהֱוֵ֨ה מְדֹרָ֜/ךְ וְ/עִשְׂבָּ֥/א כְ/תוֹרִ֣ין לָ֣/ךְ יְטַֽעֲמ֗וּן וּ/מִ/טַּ֤ל שְׁמַיָּ/א֙ לָ֣/ךְ מְצַבְּעִ֔ין וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עֲלָ֑/יךְ עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/022.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and you will be drenched with the dew of heaven, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: hi
  text: और तुझे मनुष्यों के बीच से निकाल दिया जाएगा, और तेरा निवास मैदान के पशुओं के साथ होगा। तुझे बैलों के समान घास खिलाई जाएगी, और तू आकाश की ओस से भीग जाएगा। तेरे ऊपर सात काल[a] बीतेंगे, जब तक कि तू यह न जान ले कि परमप्रधान मनुष्यों के राज्य[b] पर शासन करता है और जिसे चाहता है, उसे वह दे देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सात अवधियाँ’; अनेक लोग इसे ‘सात वर्ष’ समझते हैं।
    reason: alternative_reading
  - marker: b
    text: ‘मनुष्यों का राज्य’ से आशय मानवीय शासन या मानवजाति का राजकीय क्षेत्र हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: טָרְדִין
  choice: तुझे ... निकाल दिया जाएगा
  rationale: अरामी बहुवचन क्रिया का कर्ता अनिर्दिष्ट है; हिन्दी में कर्मवाच्य इसके बलपूर्वक निष्कासन के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲנָשָׁא
  choice: मनुष्यों
  rationale: यहाँ मानव समाज और पशुओं के बीच विरोध है; ‘मनुष्यों के बीच से’ इस सामाजिक अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: חֵיוַת בָּרָא
  choice: मैदान के जंगली पशु
  rationale: यह पद खुले क्षेत्र में रहने वाले वन्य पशुओं को दर्शाता है; यह हिन्दी रूप अर्थ और दृश्यात्मकता दोनों बनाए रखता है।
- source_word: מְדֹרָךְ
  choice: तेरा निवास
  rationale: निवास-स्थान का ठोस अर्थ रखते हुए यह गरिमापूर्ण और वर्तमान हिन्दी है।
- source_word: יְטַעֲמוּן
  choice: तुझे ... खिलाई जाएगी
  rationale: 'कारक क्रिया का आरोपित भाव सुरक्षित है: राजा केवल स्वयं नहीं खाता, बल्कि उसे घास खाने को विवश किया जाता है।'
- source_word: כְתוֹרִין
  choice: बैलों के समान
  rationale: यह गोवंशीय पशुओं का बहुवचन है; चरने की उपमा में ‘बैलों’ निकट और परिचित हिन्दी समतुल्य है।
- source_word: מִטַּל שְׁמַיָּא ... מְצַבְּעִין
  choice: आकाश की ओस से भीग जाएगा
  rationale: मूल की सजीव छवि और बाहर पड़े रहने से ओस में भीगने का भाव सीधे व्यक्त होता है।
- source_word: שִׁבְעָה עִדָּנִין
  choice: सात काल
  rationale: עִדָּנִין किसी निश्चित अवधि या समय-खंड को सूचित कर सकता है; ‘काल’ अवधि को अनावश्यक रूप से ‘वर्ष’ निर्धारित किए बिना अस्पष्टता बनाए रखता है।
- source_word: יַחְלְפוּן עֲלָיךְ
  choice: तेरे ऊपर ... बीतेंगे
  rationale: समय के व्यक्ति पर से गुजरने का मूल मुहावरा और उसके अनुभवात्मक भार को सुरक्षित रखता है।
- source_word: שַׁלִּיט עִלָּיָא
  choice: परमप्रधान ... शासन करता है
  rationale: ‘परमप्रधान’ ईश्वर के इस अरामी पद का प्रचलित, गरिमापूर्ण और अर्थसंगत हिन्दी रूप है; ‘शासन करता है’ सार्वभौम अधिकार व्यक्त करता है।
- source_word: מַלְכוּת אֲנָשָׁא
  choice: मनुष्यों का राज्य
  rationale: शाब्दिक संरचना को रखते हुए इसका आशय मानव शासन अथवा मानवजाति के राजकीय क्षेत्र से है; व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: नबूकदनेस्सर के दण्ड में עִדָּנִין की अवधि
  choice: सात काल
  alternative: सात अवधियाँ; अनेक लोग इसे सात वर्ष समझते हैं
  rationale: अरामी शब्द स्वयं कोई निश्चित पंचांगी इकाई नहीं बताता। मुख्य पाठ उसकी अस्पष्टता बनाए रखता है और ‘सात वर्ष’ को व्याख्या के रूप में पादटिप्पणी में रखता है।
- issue: מַלְכוּת אֲנָשָׁא का आशय
  choice: मनुष्यों का राज्य
  alternative: मानवीय शासन या मानवजाति का राजकीय क्षेत्र
  rationale: मूल पदबंध को निकटता से रखा गया है, बिना यह तय किए कि जोर राजनीतिक सत्ता पर है या समूचे मानवीय क्षेत्र पर।
- issue: ईश्वरीय सार्वभौमिकता और राज्य प्रदान करना
  choice: परमप्रधान मनुष्यों के राज्य पर शासन करता है और जिसे चाहता है, उसे वह दे देता है
  alternative: परमप्रधान मानव शासन का अधिकारी है और उसे अपनी इच्छा के अनुसार देता है
  rationale: 'मुख्य पाठ मूल के प्रत्यक्ष कथन को बनाए रखता है: सर्वोच्च सत्ता और राज्य देने की इच्छा दोनों परमप्रधान से संबद्ध हैं; कोई अतिरिक्त धर्मसैद्धान्तिक व्यवस्था नहीं जोड़ी गई।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। राजा को सीधे संबोधन के कारण ‘तू/तेरा/तुझे’ का प्रयोग मूल के एकवचन संबोधन और बाइबिलीय प्रसंग के अनुरूप है। वाक्य स्वाभाविक रखे गए हैं, पर अवधि और ‘मनुष्यों का राज्य’ की वास्तविक अर्थगत व्यापकता पादटिप्पणियों द्वारा सुरक्षित है।
