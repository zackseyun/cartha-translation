  text: לִבְבֵ/הּ֙ מִן אנוש/א יְשַׁנּ֔וֹן וּ/לְבַ֥ב חֵיוָ֖ה יִתְיְהִ֣ב לֵ֑/הּ וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֥וּן עֲלֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/013.yaml
  text: Let his heart be changed from that of a man[a], and let the heart of a beast be given to him, and let seven times pass over him.
translation:
  language: hi
  text: उसका हृदय मनुष्य का न रहे, और उसे पशु का हृदय दिया जाए; और सात काल[a] उस पर बीतें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सात अवधियाँ’ अथवा ‘सात ऋतुएँ’; अरामी शब्द नियत समयों या अवधियों को दर्शाता है, पर यहाँ उनकी ठीक-ठीक लंबाई नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְבֵהּ מִן אֱנוֹשָׁא
  choice: उसका मानवीय हृदय
  rationale: लְבַב भीतरी मनुष्य, सोच और प्रवृत्ति को दर्शाता है। ‘हृदय’ मूल रूपक को बनाए रखता है, और ‘मानवीय’ מִן אֱנוֹשָׁא के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְשַׁנּוֹן
  choice: बदल दिया जाए
  rationale: बहुवचन क्रिया यहाँ अनिर्दिष्ट कर्ता के साथ निष्क्रिय अर्थ देती है। हिन्दी का कर्मवाच्य किसी विशिष्ट कर्ता को जोड़े बिना इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּלְבַב חֵיוָה
  choice: और उसे पशु का हृदय
  rationale: חֵיוָה पशु या वन्य जीव को सूचित करता है। ‘पशु का हृदय’ न्याय के प्रसंग और मूल बिंब दोनों को स्पष्ट तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יִתְיְהִב לֵהּ
  choice: दिया जाए
  rationale: मूल क्रिया का अर्थ ‘दिया जाए’ है। कर्मवाच्य रूप को बनाए रखने से दाता की पहचान अनावश्यक रूप से निर्धारित नहीं होती।
- source_word: שִׁבְעָה עִדָּנִין
  choice: सात काल
  rationale: עִדָּן किसी नियत समय, अवधि या ऋतु को दर्शा सकता है। ‘सात काल’ अवधि को अनिर्धारित रखते हुए संक्षिप्त और प्रसंगानुकूल है।
- source_word: יַחְלְפוּן עֲלֹוהִי
  choice: उस पर ... बीत जाएँ
  rationale: यह अरामी मुहावरा उसके संबंध में समय के गुजरने को व्यक्त करता है। ‘उस पर ... बीत जाएँ’ मूल संरचना और न्याय के अनुभव—दोनों को बनाए रखता है।
theological_decisions:
- issue: वर्णित न्याय का स्वरूप
  choice: मनुष्य के हृदय का बदलना और पशु का हृदय दिया जाना मूल बिंब के रूप में रखा गया है।
  alternative: इसे शाब्दिक शारीरिक रूपांतरण या केवल मानसिक विक्षिप्तता के रूप में स्पष्ट कर देना।
  rationale: यह पद स्वयं यह निर्धारित नहीं करता कि परिवर्तन शारीरिक है या पशु-सदृश मानसिक दशा। अनुवाद इस धर्मवैचारिक तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु ‘हृदय’ और ‘काल’ जैसे शब्द मूल बिंब तथा गरिमापूर्ण बाइबिलीय शैली को बनाए रखते हैं। पाद-टिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिसे वह स्पष्ट करती है।
