source:
  edition: WLC
  text: לָהֵ֣ן מַלְכָּ֗/א מִלְכִּ/י֙ יִשְׁפַּ֣ר עלי/ך ו/חטי/ך בְּ/צִדְקָ֣ה פְרֻ֔ק וַ/עֲוָיָתָ֖/ךְ בְּ/מִחַ֣ן עֲנָ֑יִן הֵ֛ן תֶּהֱוֵ֥א אַרְכָ֖ה לִ/שְׁלֵוְתָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/024.yaml
  text: 'Therefore[a], O king, let my counsel be acceptable to you: break off your sins by righteousness, and your iniquities by showing mercy to the poor[b], that there may perhaps be a prolonging of your prosperity.'
translation:
  language: hi
  text: 'इसलिए, हे राजा, मेरी सलाह आपको स्वीकार हो: सही काम करके अपने पापों को छोड़ दीजिए[a], और दीन-दुखियों पर दया करके अपने अधर्मों को त्याग दीजिए। हो सकता है कि तब आपकी सुख-शांति अधिक समय तक बनी रहे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के द्वारा अपने पापों से छुटकारा पा लीजिए।” अरामी क्रिया का अधिक शाब्दिक अर्थ “तोड़ देना/छोड़ देना” है, और कुछ संदर्भों में “छुड़ाना” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आपकी शांति अथवा निश्चिंतता लंबे समय तक बनी रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अरामी अव्यय स्वप्न के अर्थ से निकलने वाली दानिय्येल की सलाह को प्रस्तुत करता है।
- source_word: מַלְכָּא
  choice: हे राजा
  rationale: संबोधन और दरबारी विनम्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִלְכִּי יִשְׁפַּר עֲלָיִךְ
  choice: मेरी सलाह आपको स्वीकार हो
  rationale: शाब्दिक भाव ‘मेरी सलाह आपको अच्छी लगे’ है; चुना हुआ रूप विनम्र आग्रह को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בְּצִדְקָה
  choice: सही काम करके
  rationale: צדקה यहाँ धार्मिकता, न्यायपूर्ण आचरण अथवा सही काम को दर्शाता है। क्रियात्मक हिन्दी संदर्भ में अपेक्षित नैतिक परिवर्तन को सहज बनाती है, बिना इसे केवल दान तक सीमित किए।
- source_word: פְרֻק
  choice: छोड़ दीजिए
  rationale: मूल क्रिया में तोड़ने, छुड़ाने या मुक्त करने का अर्थ हो सकता है। इस संदर्भ में पापमय आचरण से निर्णायक रूप से हटना प्रमुख है; वैकल्पिक ‘छुड़ा/मोल देकर छुड़ा’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַעֲוָיָתָךְ
  choice: अपने अधर्मों को त्याग दीजिए
  rationale: ‘अधर्म’ पहले आए ‘पाप’ से निकट संबंध रखते हुए भी टेढ़े अथवा दुष्ट आचरण की अलग छाया बनाए रखता है; दोहराई गई क्रिया हिन्दी में समानांतर वाक्य को पूरा करती है।
- source_word: בְּמִחַן עֲנָיִן
  choice: दीन-दुखियों पर दया करके
  rationale: मूल पद दीन, गरीब अथवा पीड़ित लोगों के प्रति करुणामय व्यवहार बताता है। ‘दीन-दुखियों’ में गरीबी और पीड़ा दोनों संभावित अर्थ समाहित हैं।
- source_word: הֵן
  choice: हो सकता है कि तब
  rationale: यह परिणाम को निश्चित न बताकर एक संभावित परिणाम के रूप में प्रस्तुत करता है।
- source_word: לִשְׁלֵוְתָךְ
  choice: आपकी सुख-शांति
  rationale: अरामी संज्ञा शांति, निश्चिंतता, कुशलता या समृद्ध दशा का संकेत दे सकती है। ‘सुख-शांति’ इस व्यापकता को हिन्दी में स्वाभाविक रूप से रखती है।
theological_decisions:
- issue: क्या यह उपदेश धार्मिक कर्मों द्वारा पाप का प्रायश्चित खरीदने की शिक्षा देता है या पश्चाताप को सही और दयालु आचरण में दिखाने का आह्वान है
  choice: मुख्य पाठ में राजा को पाप छोड़कर सही और दयालु आचरण अपनाने का आह्वान व्यक्त किया गया है।
  alternative: ‘धार्मिकता के द्वारा अपने पापों को छुड़ा लीजिए’ अथवा ‘दान देकर अपने पापों का प्रायश्चित कीजिए।’
  rationale: פְרֻק का अर्थ ‘तोड़ना/छोड़ना’ और कुछ संदर्भों में ‘छुड़ाना’ हो सकता है। तत्काल संदर्भ नैतिक परिवर्तन की मांग करता है, पर मूल की दूसरी सम्भावना को पादटिप्पणी में रखा गया है ताकि पाठ के धर्मवैज्ञानिक तनाव को मिटाया न जाए।
- issue: राजा के बदलने पर सुख-शांति बढ़ने की निश्चितता
  choice: इसे केवल सम्भावना के रूप में रखा गया है।
  alternative: परिवर्तन के निश्चित फल के रूप में दीर्घ समृद्धि।
  rationale: הֵן परिणाम को अनिश्चित अथवा सम्भाव्य बनाता है; इसलिए ‘हो सकता है’ मूल की सावधानी को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का विनम्र, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘हे राजा’ से दरबारी संबोधन, ‘आप’ से सम्मान, और ‘हो सकता है’ से मूल की अनिश्चितता सुरक्षित रखी गई है।
