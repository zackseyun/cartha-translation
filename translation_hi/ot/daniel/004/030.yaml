base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/030.yaml
  text: At that moment the word was fulfilled against Nebuchadnezzar. He was driven away from among men[a], and he ate grass like oxen, and his body was drenched with the dew of heaven, until his hair grew like eagles’ feathers and his nails like birds’ claws.
translation:
  language: hi
  text: उसी घड़ी नबूकदनेस्सर के विरुद्ध वह वचन पूरा हुआ। उसे मनुष्यों के बीच से निकाल दिया गया। वह बैलों के समान घास खाता रहा, और उसका शरीर आकाश की ओस से भीगता रहा, यहाँ तक कि उसके बाल उकाबों[a] के पंखों के समान और उसके नाखून पक्षियों के पंजों के समान बढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उकाबों’ के स्थान पर ‘गिद्धों’ भी संभव है; अरामी शब्द बड़े शिकारी पक्षियों के लिए अधिक व्यापक अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהּ שַׁעֲתָא
  choice: उसी घड़ी
  rationale: अरामी मुहावरे का समय-सूचक और तात्कालिक बल सुरक्षित रहता है तथा यह स्वाभाविक हिन्दी है।
- source_word: מִלְּתָא סָפַת עַל נְבוּכַדְנֶצַּר
  choice: नबूकदनेस्सर के विरुद्ध वह वचन पूरा हुआ
  rationale: מִלְּתָא का मूल अर्थ ‘वचन/बात’ है और यहाँ यह पहले सुनाए गए न्याय-वचन की ओर संकेत करता है; ‘के विरुद्ध’ עַל की प्रतिकूल न्यायिक दिशा स्पष्ट करता है।
- source_word: וּמִן אֲנָשָׁא טְרִיד
  choice: उसे मनुष्यों के बीच से निकाल दिया गया
  rationale: टְרִיד के निष्कासन के भाव और मानव समाज से अलग किए जाने की बात को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעִשְׂבָּא כְתוֹרִין יֵאכֻל
  choice: वह बैलों के समान घास खाने लगा
  rationale: घास और गोवंश की मूल उपमा बनी रहती है; प्रसंग में आरम्भ हुई निरंतर दशा के लिए ‘खाने लगा’ स्वाभाविक है।
- source_word: וּמִטַּל שְׁמַיָּא גִּשְׁמֵהּ יִצְטַבַּע
  choice: उसका शरीर आकाश की ओस से भीगता रहा
  rationale: शरीर के ओस से लगातार गीला रहने की दशा स्पष्ट होती है और ‘आकाश की ओस’ स्रोत की अभिव्यक्ति को निकटता से रखता है।
- source_word: שַׂעְרֵהּ כְּנִשְׁרִין רְבָה
  choice: उसके बाल उकाबों के पंखों जैसे ... बढ़ गए
  rationale: רְבָה को बालों के बढ़ने के रूप में स्वाभाविक ढंग से व्यक्त किया गया है; נִשְׁרִין के पारंपरिक अर्थ ‘उकाब’ को मुख्य पाठ में रखा गया है और व्यापक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: וְטִפְרוֹהִי כְצִפְּרִין
  choice: उसके नाखून पक्षियों के पंजों जैसे बढ़ गए
  rationale: टִפְרִין का नाखून/पंजा अर्थ तुलना में स्पष्ट किया गया है; साझा क्रिया ‘बढ़ गए’ बालों और नाखूनों दोनों पर स्वाभाविक रूप से लागू होती है।
theological_decisions:
- issue: אֲנָשָׁא का मानव-सामाजिक अर्थ
  choice: मनुष्यों के बीच से
  alternative: लोगों के बीच से
  rationale: यह शब्द समस्त मानव समाज के विपरीत राजा की पशु-सदृश दशा दिखाता है; ‘मनुष्यों’ से यह विरोध स्पष्ट रहता है और इसे केवल पुरुषों तक सीमित नहीं किया जाता।
- issue: מִלְּתָא का न्याय-वचन संबंधी अर्थ
  choice: वचन
  alternative: दण्डादेश
  rationale: ‘वचन’ स्रोत की शब्दगत व्यापकता और पूर्वघोषणा से संबंध बनाए रखता है; ‘दण्डादेश’ न्यायिक अर्थ को अधिक निश्चित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है, जबकि अरामी पाठ की तीव्रता, निष्कासन और पशु-सदृश दशा की छवि सुरक्षित है।
