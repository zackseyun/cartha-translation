reference: Daniel 4:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/דִ֣י אֲמַ֗רוּ לְ/מִשְׁבַּ֞ק עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ דִּ֣י אִֽילָנָ֔/א מַלְכוּתָ֖/ךְ לָ֣/ךְ קַיָּמָ֑ה מִן דִּ֣י תִנְדַּ֔ע דִּ֥י שַׁלִּטִ֖ן שְׁמַיָּֽ/א־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/023.yaml
  text: And because they said to leave the stump of the tree with its roots[a], your kingdom will remain yours from the time that you know that Heaven rules.
translation:
  language: hi
  text: और क्योंकि उन्होंने कहा कि पेड़ के ठूँठ को उसकी जड़ों समेत छोड़ दिया जाए, आपका राज्य आपका बना रहेगा, जब आप जान लेंगे कि स्वर्ग[a] शासन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश शासन करते हैं।” अरामी में “आकाश” बहुवचन है और यहाँ परमेश्वर की सार्वभौम सत्ता के लिए आदरसूचक अभिव्यक्ति है।
    reason: मूल अरामी के व्याकरणिक बहुवचन और उसके आदरसूचक लाक्षणिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְדִי אֲמַרוּ
  choice: और जो यह कहा गया
  rationale: अरामी में सक्रिय बहुवचन ‘उन्होंने कहा’ अनिश्चित कर्ता के कारण भाववाचक अर्थ दे सकता है। हिन्दी में ‘यह कहा गया’ स्वाभाविक है और स्वर्गदूतों की घोषणा का भाव बनाए रखता है।
- source_word: לְמִשְׁבַּק עִקַּר שָׁרְשׁוֹהִי דִּי אִילָנָא
  choice: पेड़ के ठूँठ को उसकी जड़ों समेत छोड़ दिया जाए
  rationale: वाक्यांश कटे हुए पेड़ के बचे आधार और जड़-तंत्र को दर्शाता है; ‘ठूँठ ... जड़ों समेत’ चित्र को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: מַלְכוּתָךְ לָךְ קַיָּמָה
  choice: आपका राज्य आपके लिए बना रहेगा
  rationale: कַיָּמָה का अर्थ स्थिर रहना या बना रहना है, और לָךְ को ‘आपके लिए’ कहने से स्रोत की अभिव्यक्ति सुरक्षित रहती है।
- source_word: מִן דִּי תִנְדַּע
  choice: जब आप जान लेंगे
  rationale: מִן דִּי यहाँ उस समय-बिंदु को बताता है जिसके बाद राज्य की पुनर्स्थापना होगी। सहज हिन्दी में ‘जब ... जान लेंगे’ यही आशय व्यक्त करता है।
- source_word: שַׁלִּטִן שְׁמַיָּא
  choice: स्वर्ग शासन करता है
  rationale: ‘स्वर्ग’ परमेश्वर की सार्वभौम सत्ता के लिए आदरसूचक परोक्ष अभिव्यक्ति है। इसे सीधे ‘परमेश्वर’ में बदलने के बजाय मूल रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: שְׁמַיָּא को ‘स्वर्ग’ या ‘आकाश’ के रूप में प्रस्तुत करना
  choice: स्वर्ग शासन करता है
  alternative: आकाश शासन करते हैं
  rationale: दानिय्येल के प्रसंग में ‘स्वर्ग’ परमेश्वर के शासन के लिए आदरसूचक लक्षणा है। एकवचन हिन्दी रूप स्वाभाविक है, पर टिप्पणी मूल अरामी बहुवचन की सम्भावना भी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। राजा से संबोधन के कारण ‘आप’ रखा गया है। व्याख्यात्मक संबंध को स्पष्ट करने के लिए ‘उसका अर्थ यह है कि’ प्रयुक्त हुआ है; यह पिछले स्वप्न-विवरण से दानिय्येल की व्याख्या की ओर संक्रमण को स्वाभाविक बनाता है।
