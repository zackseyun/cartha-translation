base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/011.yaml
  text: 'He cried aloud and said thus: ‘Chop down the tree[a], and cut off its branches; strip off its foliage, and scatter its fruit. Let the beasts flee from beneath it[b], and the birds from its branches.’'
translation:
  language: hi
  text: उसने ऊँचे स्वर में पुकारकर इस प्रकार कहा, “इस वृक्ष को काट डालो[a] और इसकी डालियाँ काट दो; इसके पत्ते झाड़ दो और इसके फल बिखेर दो। जानवर इसके नीचे से भाग जाएँ, और पक्षी इसकी डालियों से भाग जाएँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस वृक्ष को काट गिराओ।”
    reason: lexical_alternative
  - marker: b
    text: अरामी में अंतिम खंड क्रियाविहीन है; यहाँ “भाग जाएँ” पिछले खंड से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרֵא בְחַיִל
  choice: ऊँचे स्वर में पुकारकर
  rationale: शाब्दिक भाव ‘बल के साथ पुकारना’ है; यह चयन घोषणा की ऊँची और प्रबल आवाज़ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְכֵן אָמַר
  choice: इस प्रकार कहा
  rationale: כֵן आगे आने वाली घोषणा की विषयवस्तु का परिचय देता है; ‘इस प्रकार कहा’ गरिमापूर्ण और स्पष्ट है।
- source_word: גֹּדּוּ אִילָנָא
  choice: इस वृक्ष को काट डालो
  rationale: आज्ञार्थक क्रिया वृक्ष को काटकर गिराने का प्रबल आदेश देती है; ‘काट डालो’ उसकी तीव्रता बनाए रखता है।
- source_word: וְקַצִּצוּ עַנְפוֹהִי
  choice: और इसकी डालियाँ काट दो
  rationale: क्रिया का अर्थ अलग करके काट देना है; ‘डालियाँ’ सामान्य पाठक के लिए स्वाभाविक वृक्ष-संबंधी शब्द है।
- source_word: אַתַּרוּ עָפְיֵהּ
  choice: इसके पत्ते झाड़ दो
  rationale: यह पद पत्तेदार आवरण को हटा देने का बोध देता है; ‘पत्ते झाड़ दो’ दृश्य को सहज और सजीव हिन्दी में रखता है।
- source_word: וּבַדַּרוּ אִנְבֵּהּ
  choice: और इसके फल बिखेर दो
  rationale: בדר का अर्थ बिखेरना है और אִנְבֵּהּ वृक्ष के फल को सामूहिक रूप में सूचित करता है।
- source_word: תְּנֻד חֵיוְתָא מִן תַּחְתּוֹהִי
  choice: जानवर इसके नीचे से भाग जाएँ
  rationale: क्रिया दूर हटने या भाग जाने का भाव रखती है; वृक्ष काटे जाने के प्रसंग में ‘भाग जाएँ’ आकस्मिक प्रस्थान को स्पष्ट करता है।
- source_word: וְצִפְּרַיָּא מִן עַנְפוֹהִי
  choice: और पक्षी इसकी डालियों से
  rationale: अरामी में अंतिम समानांतर खंड क्रियाविहीन है। मुख्य पाठ में उसकी संक्षिप्तता सुरक्षित रखी गई है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: घोषणा में आज्ञार्थक और इच्छार्थक बल
  choice: वृक्ष से संबंधित आदेशों को सीधे आज्ञार्थक रूप में और जानवरों के प्रस्थान को इच्छार्थक रूप में प्रस्तुत किया गया है।
  alternative: सभी खंडों को एक समान सीधे आदेशों के रूप में अनूदित करना।
  rationale: मूल अरामी में पहले कई आज्ञार्थक क्रियाएँ हैं, फिर जानवरों के लिए अपूर्ण/इच्छार्थक रूप आता है; हिन्दी में यह भेद बनाए रखना व्याकरणिक और अर्थगत तनाव को सुरक्षित रखता है।
- issue: पक्षियों वाले अंतिम खंड की क्रियाविहीनता
  choice: मुख्य पाठ में ‘और पक्षी इसकी डालियों से’ रखकर मूल का लोपात्मक रूप बनाए रखा गया है।
  alternative: ‘और पक्षी इसकी डालियों से भाग जाएँ’ कहकर निहित क्रिया को मुख्य पाठ में पूरा करना।
  rationale: मूल खंड में क्रिया व्यक्त नहीं है, यद्यपि पिछले खंड से ‘भाग जाएँ’ समझी जाती है। पादटिप्पणी के साथ संक्षिप्तता बनाए रखने से अस्पष्टता नहीं रहती और मूल की रचना भी सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और मौखिक घोषणा के अनुकूल स्वर रखा गया है। ‘वृक्ष’ और ‘इस प्रकार’ औपचारिक गरिमा देते हैं, जबकि ‘काट डालो’, ‘झाड़ दो’ और ‘भाग जाएँ’ सामान्य पाठकों के लिए सहज हैं।
