  text: בֵּלְטְשַׁאצַּר֮ רַ֣ב חַרְטֻמַיָּ/א֒ דִּ֣י אֲנָ֣ה יִדְעֵ֗ת דִּ֠י ר֣וּחַ אֱלָהִ֤ין קַדִּישִׁין֙ בָּ֔/ךְ וְ/כָל רָ֖ז לָא אָנֵ֣ס לָ֑/ךְ חֶזְוֵ֨י חֶלְמִ֧/י דִֽי חֲזֵ֛ית וּ/פִשְׁרֵ֖/הּ אֱמַֽר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/006.yaml
  text: Belteshazzar[a], chief of the magicians, whom I know has the spirit of the holy gods in you, and no mystery is too difficult for you, tell me the visions of my dream that I saw, and its interpretation.
translation:
  language: hi
  text: बेलतशस्सर[a], जादूगरों का प्रधान, मैं जानता हूँ कि पवित्र देवताओं की आत्मा तुम में है और कोई भी रहस्य तुम्हारे लिए कठिन नहीं है। मेरे स्वप्न के जो दर्शन मैंने देखे, वे और उनका अर्थ मुझे बताओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र परमेश्वर की आत्मा।”
    reason: अरामी पदबंध को बहुवचन ‘पवित्र देवताओं’ के रूप में पढ़ना सबसे स्वाभाविक है, पर इसे एकवचन में परमेश्वर के संदर्भ के रूप में भी समझा गया है।
lexical_decisions:
- source_word: רַב חַרְטֻמַיָּא
  choice: जादूगरों के प्रधान
  rationale: दरबारी संदर्भ में यह बेबीलोन के विद्वान-जादूगर वर्ग के मुखिया को दर्शाता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: רוּחַ אֱלָהִין קַדִּישִׁין
  choice: पवित्र देवताओं की आत्मा
  rationale: אֱלָהִין और קַדִּישִׁין का बहुवचन रूप तथा नबूकदनेस्सर की वाणी मुख्य पाठ में बहुवचन का समर्थन करते हैं; विवादित एकवचन अर्थ पादटिप्पणी में रखा गया है।
- source_word: וְכָל רָז לָא אָנֵס לָךְ
  choice: और कोई भी रहस्य तेरे लिए कठिन नहीं है
  rationale: मुहावरे का आशय है कि कोई गुप्त बात दानिय्येल की समझ या सामर्थ्य से परे नहीं है।
- source_word: חֶזְוֵי חֶלְמִי דִי חֲזֵית
  choice: मैंने अपने स्वप्न में जो दर्शन देखे
  rationale: मूल के बहुवचन 'दर्शन' और राजा के स्वयं देखने के भाव, दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में सुरक्षित रखा गया है।
- source_word: וּפִשְׁרֵהּ אֱמַר
  choice: वे और उनका अर्थ मुझे बता
  rationale: दानिय्येल में פשר स्वप्न के अर्थ अथवा व्याख्या का तकनीकी शब्द है; सामान्य पाठक के लिए 'अर्थ' सहज है, और आज्ञार्थक אֱמַר को 'मुझे बता' किया गया है।
theological_decisions:
- issue: רוּחַ אֱלָהִין קַדִּישִׁין बहुवचन में पवित्र देवताओं का उल्लेख है या एकवचन में पवित्र परमेश्वर का
  choice: पवित्र देवताओं की आत्मा
  alternative: पवित्र परमेश्वर का आत्मा; अथवा पवित्र परमेश्वर की आत्मा
  rationale: अरामी में संज्ञा और विशेषण दोनों का बहुवचन तथा मूर्तिपूजक राजा का दृष्टिकोण मुख्य पाठ में बहुवचन को अधिक स्वाभाविक बनाते हैं। फिर भी एकवचन व्याख्या प्राचीन भाषिक प्रयोग के आधार पर संभव मानी जाती है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज राजदरबारी संबोधन रखा गया है। राजा द्वारा दानिय्येल को सीधे संबोधित करने के कारण एकवचन ‘तू/तेरे/तुझ’ शैली प्रयुक्त है। ‘दर्शन’ का बहुवचन मूल के अनुरूप सुरक्षित है।
