id: DAN.4.27
reference: Daniel 4:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עָנֵ֤ה מַלְכָּ/א֙ וְ/אָמַ֔ר הֲ/לָ֥א דָא הִ֖יא בָּבֶ֣ל רַבְּתָ֑/א דִּֽי אֲנָ֤ה בֱנַיְתַ/הּ֙ לְ/בֵ֣ית מַלְכ֔וּ בִּ/תְקַ֥ף חִסְנִ֖/י וְ/לִ/יקָ֥ר הַדְרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/027.yaml
  text: The king answered and said[a], “Is this not Babylon the Great[b], which I myself built as a royal residence by the might of my power and for the glory of my majesty?”
translation:
  language: hi
  text: राजा ने उत्तर देकर कहा, “क्या यह महान बाबुल नहीं है[a], जिसे मैंने स्वयं अपने सामर्थ्य के बल से राजकीय निवास के रूप में[b] और अपने प्रताप की महिमा के लिए बनाया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाबुल महान।”
    reason: lexical_alternative
  - marker: b
    text: या “राज्य के घर के रूप में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָנֵה ... וְאָמַר
  choice: उत्तर देकर कहा
  rationale: यह अरामी कथा-वर्णन का प्रचलित दोहरा सूत्र है। हिन्दी में ‘उत्तर देकर कहा’ दोनों क्रियाओं को बनाए रखते हुए स्वाभाविक लगता है।
- source_word: הֲלָא
  choice: क्या ... नहीं है
  rationale: यह ऐसा आलंकारिक प्रश्न प्रस्तुत करता है जिसका अपेक्षित उत्तर सहमति में है; प्रश्नवाचक बल को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: בָּבֶל רַבְּתָא
  choice: महान बाबुल
  rationale: विशेषण मूल में संज्ञा के बाद है, पर आधुनिक हिन्दी में ‘महान बाबुल’ स्वाभाविक है और राजा के आत्मश्लाघापूर्ण कथन की भव्यता बनाए रखता है।
- source_word: אֲנָה
  choice: मैंने स्वयं
  rationale: स्वतंत्र सर्वनाम का प्रयोग कर्ता पर विशेष बल देता है; ‘स्वयं’ उस आत्मगौरव को व्यक्त करता है, पर ‘अकेले’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: לְבֵית מַלְכוּ
  choice: राजकीय निवास के रूप में
  rationale: शाब्दिक अर्थ ‘राजत्व/राज्य का घर’ है। प्रसंग में ‘राजकीय निवास’ आधुनिक पाठक के लिए सहज है, जबकि पादटिप्पणी व्यापक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: בִּתְקַף חִסְנִי
  choice: अपने सामर्थ्य के बल से
  rationale: मूल की जानबूझकर भव्य और कुछ हद तक पुनरुक्त अभिव्यक्ति को हिन्दी में पठनीय रहते हुए सुरक्षित रखा गया है।
- source_word: וְלִיקָר הַדְרִי
  choice: अपने ऐश्वर्य की महिमा के लिए
  rationale: יְקָר महिमा/गौरव और הֲדָר ऐश्वर्य/वैभव का बोध कराते हैं। यह रूप राजा की आत्ममहिमामंडित वाणी को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बाबुल की महानता के विषय में नबूकदनेस्सर का गर्वोक्तिपूर्ण कथन
  choice: महान बाबुल
  alternative: बाबुल महान
  rationale: यह किसी अनिवार्य तकनीकी उपाधि के बजाय वर्णनात्मक और बलाघातयुक्त पदबंध है। ‘महान बाबुल’ हिन्दी में स्वाभाविक रहते हुए गर्व और भव्यता को बनाए रखता है।
- issue: בֵּית מַלְכוּ का आशय
  choice: राजकीय निवास
  alternative: राज्य का घर
  rationale: पदबंध राजसत्ता के केंद्र या निवास का संकेत दे सकता है। मुख्य पाठ में सहज प्रसंगानुकूल अर्थ लिया गया है और अधिक शाब्दिक, व्यापक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। राजा की डींग, आलंकारिक प्रश्न और मूल की भव्य पुनरुक्ति को जानबूझकर बनाए रखा गया है।
