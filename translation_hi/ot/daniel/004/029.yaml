  edition: WLC
  text: וּ/מִן אֲנָשָׁ/א֩ לָ֨/ךְ טָֽרְדִ֜ין וְֽ/עִם חֵיוַ֧ת בָּרָ֣/א מְדֹרָ֗/ךְ עִשְׂבָּ֤/א כְ/תוֹרִין֙ לָ֣/ךְ יְטַעֲמ֔וּן וְ/שִׁבְעָ֥ה עִדָּנִ֖ין יַחְלְפ֣וּן עלי/ך עַ֣ד דִּֽי תִנְדַּ֗ע דִּֽי שַׁלִּ֤יט עִלָּיָ/א֙ בְּ/מַלְכ֣וּת אֲנָשָׁ֔/א וּ/לְ/מַן דִּ֥י יִצְבֵּ֖א יִתְּנִנַּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/029.yaml
  text: And you will be driven away from men[a], and your dwelling will be with the beasts of the field. You will be made to eat grass like oxen, and seven times will pass over you[b], until you know that the Most High rules in the kingdom of men and gives it to whomever he wills.
translation:
  language: hi
  text: और तुझे मनुष्यों के बीच से खदेड़ दिया जाएगा[a], और तेरा निवास जंगली पशुओं के बीच होगा। तुझे बैलों के समान घास खिलाई जाएगी, और तेरे ऊपर सात काल बीतेंगे[b], जब तक कि तू यह न जान ले कि परमप्रधान मनुष्यों के राज्य पर शासन करता है और जिसे चाहता है, उसे वह राज्य दे देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” से आशय पशुओं के विपरीत मानव प्राणियों से है।
    reason: lexical_alternative
  - marker: b
    text: अरामी में “सात काल”; संभवतः “सात वर्ष” या अधिक सामान्य रूप से “सात समयावधियाँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: טָרְדִין
  choice: तुझे ... खदेड़ दिया जाएगा
  rationale: अरामी रूप शाब्दिक रूप से अनिर्दिष्ट बहुवचन कर्ता के साथ ‘वे तुझे खदेड़ेंगे’ है; हिंदी में कर्मवाच्य न्याय की घोषणा को स्वाभाविक और स्रोतार्थ के अनुरूप रखता है।
- source_word: אֲנָשָׁא
  choice: मनुष्यों
  rationale: यहाँ सामूहिक मानवजाति का बोध है और पशुओं के साथ स्पष्ट विरोध बना रहता है।
- source_word: חֵיוַת בָּרָא
  choice: मैदान के पशु
  rationale: यह पद खुले देश या मैदान में रहने वाले पशुओं को सूचित करता है; यह रूप बाइबलीय चित्र और सहज हिंदी दोनों को बनाए रखता है।
- source_word: עִשְׂבָּא כְתוֹרִין
  choice: बैलों के समान घास
  rationale: चरने के प्रसंग में עִשְׂבָּא के लिए ‘घास’ और गोवंशवाचक תוֹרִין के लिए ‘बैल’ सटीक और स्वाभाविक हैं।
- source_word: יְטַעֲמוּן
  choice: खिलाई जाएगी
  rationale: कारणवाचक भाव को बनाए रखने के लिए केवल ‘तू खाएगा’ के बजाय उस पर थोपी गई दशा व्यक्त की गई है।
- source_word: שִׁבְעָה עִדָּנִין
  choice: सात काल
  rationale: עִדָּנִין समय की अवधियों को बताता है, पर स्वयं ‘वर्ष’ निश्चित नहीं करता; ‘काल’ उस वास्तविक अनिश्चितता को सुरक्षित रखता है।
- source_word: יַחְלְפוּן עֲלָךְ
  choice: तेरे ऊपर ... बीतेंगे
  rationale: यह अवधि के बीतने और उसके द्वारा राजा के प्रभावित होने, दोनों को स्रोत के मुहावरे के निकट रखता है।
- source_word: שַׁלִּיט עִלָּיָא
  choice: परमप्रधान ... शासन करता है
  rationale: ईश्वरीय उपाधि और सक्रिय सार्वभौमिक अधिकार दोनों स्पष्ट होते हैं।
- source_word: בְּמַלְכוּת אֲנָשָׁא
  choice: मनुष्यों के राज्य पर
  rationale: हिंदी में ‘शासन करना’ के साथ ‘पर’ स्वाभाविक है और मानव राजसत्ता पर परमप्रधान के अधिकार को व्यक्त करता है।
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: जिसे चाहता है, उसे वह राज्य दे देता है
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ ‘राज्य’ है; संज्ञा को दोहराने से हिंदी में संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: नबूकदनेस्सर के दंड में עִדָּנִין की अवधि
  choice: सात काल
  alternative: सात वर्ष; सात समयावधियाँ
  rationale: अरामी शब्द एक समय या अवधि को दर्शाता है, किंतु इस पद में अवधि को स्पष्ट रूप से वर्ष नहीं कहता। मुख्य पाठ में अनिश्चितता रखी गई है और संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- issue: אֲנָשָׁא का मानवशास्त्रीय आशय
  choice: मनुष्य
  alternative: लोग; मानवजाति
  rationale: शब्द का आशय सामूहिक रूप से मानव प्राणियों से है, जिनका इस पद में पशुओं से विरोध है; ‘मनुष्य’ आधुनिक हिंदी में समावेशी सामूहिक अर्थ देता है।
- issue: परमप्रधान और मानव राजसत्ता का संबंध
  choice: मनुष्यों के राज्य पर शासन करता है
  alternative: मनुष्यों के राज्य में प्रभुता रखता है
  rationale: यह सक्रिय सार्वभौमिक अधिकार को स्पष्ट करता है, बिना इस बात को बदलने के कि वही अपनी इच्छा के अनुसार राज्य देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट भविष्यवाणी-संबंधी शैली रखी गई है। ‘तू/तेरे’ का प्रयोग राजा को किए गए सीधे एकवचन संबोधन और निकटवर्ती दानिय्येल-पाठ की शैली के अनुरूप है। कर्मवाच्य रूप अनिर्दिष्ट मानवीय कर्ताओं को अनावश्यक प्रमुखता दिए बिना मूल के भाव को सुरक्षित रखते हैं।
