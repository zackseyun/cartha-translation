id: DAN.4.12
reference: Daniel 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּרַ֨ם עִקַּ֤ר שָׁרְשׁ֨וֹ/הִי֙ בְּ/אַרְעָ֣/א שְׁבֻ֔קוּ וּ/בֶֽ/אֱסוּר֙ דִּֽי פַרְזֶ֣ל וּ/נְחָ֔שׁ בְּ/דִתְאָ֖/א דִּ֣י בָרָ֑/א וּ/בְ/טַ֤ל שְׁמַיָּ/א֙ יִצְטַבַּ֔ע וְ/עִם חֵיוְתָ֥/א חֲלָקֵ֖/הּ בַּ/עֲשַׂ֥ב אַרְעָֽ/א־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/012.yaml
  text: Nevertheless[a], leave the stump of its roots in the earth, even with a band of iron and bronze in the grass of the field; and let him be drenched with the dew of heaven, and let his portion be with the beasts in the grass of the earth.
translation:
  language: hi
  text: परन्तु उसकी जड़ों का ठूँठ भूमि में छोड़ दो—लोहे और काँसे के बन्धन[a] में, मैदान की घास के बीच। वह आकाश की ओस से भीगता रहे, और पृथ्वी की घास में वन-पशुओं के साथ उसका भाग हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोहे और काँसे की बेड़ी में,” अथवा “लोहे और काँसे के घेरे में।” अरामी शब्द बाँधने वाली वस्तु या रोक को सूचित कर सकता है।
    reason: 'शब्दार्थ की वास्तविक अस्पष्टता को सुरक्षित रखना: अभिव्यक्ति पेड़ के चारों ओर के घेरे अथवा व्यक्ति पर लगी बेड़ी का संकेत दे सकती है।'
lexical_decisions:
- source_word: בְּרַם
  choice: परन्तु
  rationale: यह विरोधसूचक अव्यय पेड़ को काट डालने की आज्ञा में एक अपवाद प्रस्तुत करता है। ‘परन्तु’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: उसकी जड़ों का ठूँठ
  rationale: यह अभिव्यक्ति कटे हुए पेड़ के भूमि में जड़ जमाए बचे हुए आधार को दर्शाती है; अनुवाद में ठूँठ और जड़ों, दोनों की छवि रखी गई है।
- source_word: בְּאַרְעָא
  choice: भूमि में
  rationale: यहाँ स्थानीय और कृषि-संबंधी अर्थ है—ठूँठ का मिट्टी में बने रहना।
- source_word: שְׁבֻקוּ
  choice: छोड़ दो
  rationale: बहुवचन आज्ञार्थक क्रिया को आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक आज्ञा के रूप में व्यक्त किया गया है।
- source_word: וּבֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: लोहे और काँसे के बन्धन में
  rationale: אֱסוּר किसी बाँधने वाली वस्तु, बन्धन या रोक को सूचित कर सकता है। ‘बन्धन’ पेड़ के चारों ओर के घेरे और व्यक्ति पर लगी बेड़ी, दोनों सम्भावनाओं को खुला रखता है; נְחָשׁ के लिए प्राचीन धातु के अर्थ में ‘काँसा’ चुना गया है।
- source_word: בְּדִתְאָא דִּי בָרָא
  choice: मैदान की घास के बीच
  rationale: यह खुले मैदान की घास या वनस्पति का बोध कराता है। ‘के बीच’ दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְטַל שְׁמַיָּא יִצְטַבַּע
  choice: वह आकाश की ओस से भीगता रहे
  rationale: क्रिया का अर्थ ओस से भिगोए जाने या भीगने का है। ‘भीगता रहे’ आदेशात्मक भाव को बनाए रखता है और पेड़ की छवि से मानव व्यक्ति की ओर होने वाले संकेत को सहजता से उभरने देता है।
- source_word: וְעִם חֵיוְתָא חֲלָקֵהּ
  choice: वन-पशुओं के साथ उसका भाग हो
  rationale: חֲלָקֵהּ का शाब्दिक भाव ‘उसका भाग/हिस्सा’ है। ‘वन-पशु’ खुले मैदान में रहने वाले पशुओं का आशय स्पष्ट करता है और पालतू पशुओं का अनचाहा अर्थ टालता है।
- source_word: בַּעֲשַׂב אַרְעָא
  choice: पृथ्वी की घास में
  rationale: यह पृथ्वी की वनस्पति के बीच रहने की दशा बताता है। ‘घास’ पिछले वाक्यांश की दृश्यात्मक कड़ी को बनाए रखता है।
theological_decisions:
- issue: पेड़ की छवि से उस व्यक्ति की ओर संकेत, जिसका वह पेड़ प्रतीक है
  choice: दूसरे वाक्य में पुल्लिंग एकवचन ‘वह’ और ‘उसका’ रखा गया है।
  alternative: पूरे पद में केवल निर्जीव पेड़ या ठूँठ के अनुरूप ‘यह/इसका’ प्रयोग करना।
  rationale: अरामी पाठ का पुल्लिंग प्रत्यय और व्यक्ति-संबंधी ‘उसका भाग’ पेड़ के प्रतीक से राजा की ओर जानबूझकर बढ़ता संकेत देता है। हिन्दी में इस परिवर्तन को बनाए रखना दर्शन की कथात्मक और धर्मवैचारिक गहनता को सुरक्षित रखता है, बिना व्यक्ति का नाम जोड़कर अर्थ को आवश्यकता से अधिक स्पष्ट किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर दर्शन के राजकीय आदेश जैसे गरिमापूर्ण स्वर को बनाए रखती है। ‘ठूँठ,’ ‘बन्धन,’ ‘आकाश की ओस’ और ‘उसका भाग’ जैसे पद मूल अरामी की ठोस छवि और औपचारिकता को सुरक्षित रखते हैं।
