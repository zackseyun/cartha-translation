  yaml_path: translation/ot/daniel/004/016.yaml
  text: Then Daniel[a], whose name was Belteshazzar, was appalled for about an hour, and his thoughts terrified him. The king answered and said, “Belteshazzar, do not let the dream or its interpretation terrify you.” Belteshazzar answered and said, “My lord, may the dream be for those who hate you[b], and its interpretation for your enemies.”
translation:
  language: hi
  text: तब दानिय्येल, जिसका नाम बेलतशस्सर था, लगभग एक घंटे तक स्तब्ध रह गया[a], और उसके विचारों ने उसे भयभीत कर दिया। राजा ने कहा, “बेलतशस्सर, स्वप्न या उसकी व्याख्या तुझे भयभीत न करे।” बेलतशस्सर ने उत्तर दिया, “मेरे स्वामी, यह स्वप्न उन लोगों के लिए हो जो आपसे घृणा करते हैं, और इसकी व्याख्या आपके शत्रुओं के लिए हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी क्रिया का अर्थ ‘चकित रह जाना’ या ‘आघात से मौन हो जाना’ भी हो सकता है; यहाँ आने वाले अनिष्ट के विचार से उत्पन्न व्याकुल स्तब्धता अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक क्रमसूचक है; ‘तब’ घटनाक्रम को सहज और स्पष्ट रूप से आगे बढ़ाता है।
- source_word: דָּנִיֵּאל דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: दानिय्येल, जिसका नाम बेलतशस्सर था
  rationale: यह सम्बन्धवाचक पद दानिय्येल को उसके बाबुली नाम से पहचानता है; हिन्दी में भूतकालीन कथन के लिए यह स्वाभाविक है।
- source_word: אֶשְׁתּוֹמַם
  choice: स्तब्ध रह गया
  rationale: क्रिया विस्मय या आघात से मौन और जड़ हो जाने का भाव व्यक्त करती है; आगामी वाक्य में उसके भय का अलग उल्लेख होने के कारण ‘स्तब्ध’ दोनों भावों को मिलाए बिना मूल तनाव बनाए रखता है।
- source_word: כְּשָׁעָה חֲדָה
  choice: लगभग एक घड़ी तक
  rationale: כְּ अनुमान का और שָׁעָה समयावधि का बोध करा सकता है। ‘घड़ी’ प्राचीन, अनिर्धारित समयावधि को आधुनिक साठ मिनट मान लेने से बचाती है।
- source_word: וְרַעְיֹנֹהִי יְבַהֲלֻנֵּהּ
  choice: और उसके विचारों ने उसे भयभीत कर दिया
  rationale: यह मूल के बहुवचन ‘विचारों’ और भय उत्पन्न करने वाली क्रिया का सीधा तथा स्वाभाविक हिन्दी रूप है।
- source_word: עָנֵה מַלְכָּא וְאָמַר
  choice: राजा ने कहा
  rationale: अरामी की द्वि-क्रियात्मक वाणी-भूमिका हिन्दी में केवल ‘कहा’ से स्वाभाविक रूप से व्यक्त होती है; ‘उत्तर देकर कहा’ यहाँ अनावश्यक रूप से भारी होता।
- source_word: חֶלְמָא וּפִשְׁרֵא אַל יְבַהֲלָךְ
  choice: न तो स्वप्न और न ही उसका अर्थ तुझे भयभीत करे
  rationale: यह निषेध, दोनों समन्वित संज्ञाओं और मूल में प्रयुक्त भयवाचक क्रिया को सुरक्षित रखता है।
- source_word: מָרִי
  choice: हे मेरे स्वामी
  rationale: राजदरबार में राजा के लिए यह सम्मानसूचक मानवीय सम्बोधन है; ‘स्वामी’ शिष्टता को रखता है और प्रसंग इसे ईश्वरीय उपाधि समझने से रोकता है।
- source_word: לְשָׂנְאָיִךְ ... לְעָרָיִךְ
  choice: उनसे सम्बन्ध रखे जो आपसे घृणा करते हैं ... आपके शत्रुओं से
  rationale: לְ का प्रयोग स्वप्न और अर्थ के लागू होने अथवा सम्बन्धित होने की कामना बताता है। यह हिन्दी रूप उस अप्रत्यक्ष अभिशंसात्मक कामना को स्पष्ट करता है, बिना उसे भविष्यवाणी में बदलने के।
- source_word: וּפִשְׁרֵהּ
  choice: और इसका अर्थ
  rationale: स्वप्न के सन्दर्भ में פִשְׁרָא उसकी व्याख्यायित अर्थवस्तु है; सामान्य पाठक के लिए ‘अर्थ’ अधिक सहज है।
theological_decisions:
- issue: नबूकदनेस्सर के लिए दानिय्येल का सम्बोधन מָרִי
  choice: हे मेरे स्वामी
  alternative: हे महाराज / प्रभु
  rationale: यह राजकीय सम्मानसूचक मानवीय सम्बोधन है। ‘मेरे स्वामी’ मूल की निजी अधीनता और आदर बनाए रखता है, जबकि ‘प्रभु’ अनावश्यक ईश्वरीय ध्वनि ला सकता है।
- issue: स्वप्न को घृणा करने वालों और शत्रुओं के लिए बताने का वाक्य
  choice: कामनासूचक सम्बन्ध—‘यह स्वप्न उनसे सम्बन्ध रखे...’
  alternative: निश्चयात्मक कथन—‘यह स्वप्न आपके बैरियों पर घटेगा’
  rationale: अरामी वाक्य में स्पष्ट भविष्यकालीन क्रिया नहीं है। अतः दानिय्येल की शिष्ट, अप्रत्यक्ष कामना को बनाए रखा गया है और उसे निश्चित भविष्यवाणी नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। राजा के सीधे सम्बोधन में ‘तुझे’ मूल के एकवचन रूप और राजकीय निकटता को दर्शाता है; दानिय्येल के उत्तर में आदरसूचक ‘आप’ हिन्दी की स्वाभाविक दरबारी मर्यादा बनाए रखता है। ‘घड़ी’ को आधुनिक साठ मिनट की बिल्कुल निश्चित अवधि के बजाय प्राचीन समयावधि के रूप में रखा गया है।
