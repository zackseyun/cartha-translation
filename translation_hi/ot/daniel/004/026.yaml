  text: לִ/קְצָ֥ת יַרְחִ֖ין תְּרֵֽי עֲשַׂ֑ר עַל הֵיכַ֧ל מַלְכוּתָ֛/א דִּ֥י בָבֶ֖ל מְהַלֵּ֥ךְ הֲוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/026.yaml
  text: At the end of twelve months[a], he was walking on the roof of the royal palace of Babylon.
translation:
  language: hi
  text: बारह महीने बीतने पर, वह बाबुल के राजमहल की छत पर[a] टहल रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बाबुल के राज्य के महल पर।” यह स्थान महल की छत या उसके ऊपरी भाग को सूचित कर सकता है।
    reason: मूल अरामी में ‘छत’ के लिए अलग शब्द नहीं है; मुख्य पाठ स्वाभाविक अर्थ देता है और टिप्पणी मूल की स्थानगत अस्पष्टता सुरक्षित रखती है।
lexical_decisions:
- source_word: לִ/קְצָת
  choice: बीतने पर
  rationale: यह काल-सूचक रचना किसी अवधि की समाप्ति बताती है। ‘बारह महीने बीतने पर’ आधुनिक हिन्दी में स्वाभाविक है और अवधि के अंत का भाव सुरक्षित रखती है।
- source_word: יַרְחִין תְּרֵי עֲשַׂר
  choice: बारह महीने
  rationale: अरामी पद का सीधा अर्थ ‘बारह महीने’ है; इसे ‘एक वर्ष’ कहना मूल की विशिष्ट गणना को संक्षिप्त कर देता।
- source_word: עַל
  choice: पर
  rationale: यहाँ पूर्वसर्ग स्थान सूचित करता है। प्रसंग में महल की छत या ऊपरी संरचना अभिप्रेत हो सकती है।
- source_word: הֵיכַל
  choice: राजमहल
  rationale: बाबुल के राजा के इस प्रसंग में यह शब्द मंदिर के बजाय महल को सूचित करता है। ‘राजमहल’ हिन्दी में शाही निवास का अर्थ स्पष्ट करता है।
- source_word: מַלְכוּתָא דִּי בָבֶל
  choice: बाबुल के राजमहल
  rationale: शाब्दिक रचना ‘बाबुल के राज्य का महल’ है। स्वाभाविक हिन्दी में ‘बाबुल का राजमहल’ उसी शाही और राजनीतिक संबंध को संक्षेप में व्यक्त करता है।
- source_word: מְהַלֵּךְ הֲוָה
  choice: टहल रहा था
  rationale: कृदंत और הוה का मेल भूतकाल में जारी क्रिया दर्शाता है। इस स्थानगत प्रसंग में ‘टहल रहा था’ स्वाभाविक रूप से उस निरंतर क्रिया को व्यक्त करता है।
