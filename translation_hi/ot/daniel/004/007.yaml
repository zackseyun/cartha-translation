translation:
  language: hi
  text: अपने बिछौने पर लेटा हुआ मैं अपने मन के दर्शन देख रहा था; और देखो, पृथ्वी के बीच में एक पेड़ था, और उसकी ऊँचाई बड़ी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְחֶזְוֵי רֵאשִׁי
  choice: मैं मन में दर्शन देख रहा था
  rationale: अरामी मुहावरे का शाब्दिक अर्थ ‘मेरे सिर के दर्शन’ है। स्वाभाविक आधुनिक हिन्दी में ‘मन में दर्शन’ उसके आंतरिक स्वप्न-दृश्यों का भाव व्यक्त करता है; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל מִשְׁכְּבִי
  choice: अपने बिछौने पर लेटे हुए
  rationale: दृश्य की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और मूल के ‘मेरे बिछौने पर’ का आशय बनाए रखता है।
- source_word: חָזֵה הֲוֵית
  choice: देख रहा था
  rationale: कृदन्त और הוה से बनी अरामी परिप्रयुक्त रचना का अपूर्णकालिक भाव हिन्दी के प्रगतिशील रूप से स्पष्ट होता है।
- source_word: וַאֲלוּ
  choice: और देखो
  rationale: दर्शन में अचानक सामने आने वाली उल्लेखनीय वस्तु की ओर ध्यान खींचने वाला मूल उद्गार सुरक्षित रहता है।
- source_word: אִילָן
  choice: एक पेड़
  rationale: पहली बार उल्लिखित अरामी संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: בְּגוֹא אַרְעָא
  choice: पृथ्वी के बीचोंबीच
  rationale: בְּגוֹא का अर्थ ‘बीच में’ और אַרְעָא का अर्थ ‘पृथ्वी/देश’ हो सकता है; दर्शन के व्यापक परिप्रेक्ष्य में ‘पृथ्वी’ उपयुक्त है।
- source_word: וְרוּמֵהּ שַׂגִּיא
  choice: और उसकी ऊँचाई बहुत अधिक थी
  rationale: पेड़ की ऊर्ध्वाकार विशालता को मूल की संज्ञात्मक अभिव्यक्ति के निकट रहते हुए सहज हिन्दी में प्रस्तुत करता है।
