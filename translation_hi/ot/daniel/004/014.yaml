source:
  edition: WLC
  text: בִּ/גְזֵרַ֤ת עִירִין֙ פִּתְגָמָ֔/א וּ/מֵאמַ֥ר קַדִּישִׁ֖ין שְׁאֵֽלְתָ֑/א עַד דִּבְרַ֡ת דִּ֣י יִנְדְּע֣וּן חַ֠יַּיָּ/א דִּֽי שַׁלִּ֨יט עלי/א בְּ/מַלְכ֣וּת אנוש/א וּ/לְ/מַן דִּ֤י יִצְבֵּא֙ יִתְּנִנַּ֔/הּ וּ/שְׁפַ֥ל אֲנָשִׁ֖ים יְקִ֥ים עלי/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/014.yaml
  text: The sentence is by the decree of the watchers[a], and the decision by the word of the holy ones, so that the living may know that the Most High rules in the kingdom of mankind and gives it to whom he wills[c][b], and sets up over it the lowliest of men.
translation:
  language: hi
  text: यह फैसला पहरुओं[a] के आदेश से है, और यह माँग पवित्र जनों के वचन के अनुसार है[b], ताकि जीवित लोग जान लें कि परमप्रधान मनुष्यों के राज्य पर शासन करता है[c]; वह यह राज्य जिसे चाहता है उसे देता है और उस पर मनुष्यों में से सबसे निम्न दर्जे के मनुष्य को नियुक्त करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहरूए’ दानिय्येल में स्वर्गीय प्राणियों के लिए प्रयुक्त एक विशेष पद है; बहुत-से व्याख्याकार इन्हें स्वर्गदूत मानते हैं।
    reason: cultural_note
  - marker: b
    text: अरामी वाक्य बहुत संक्षिप्त है। שְׁאֵלְתָא का अर्थ ‘माँग’, ‘निवेदन’ या ‘याचना’ हो सकता है; इसलिए इस खंड का अनुवाद ‘और यह निर्णय पवित्र जनों के वचन से है’ भी किया जा सकता है।
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: अक्षरशः ‘मनुष्यों के राज्य में’; प्रसंग में अर्थ ‘मनुष्यों के राज्य पर’ या ‘मानव-जगत पर’ शासन करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְזֵרַת עִירִין
  choice: पहरुओं के निर्णय से
  rationale: גְזֵרָה औपचारिक निर्णय या आदेश को दर्शाता है। עִירִין दानिय्येल में स्वर्गीय प्राणियों के लिए प्रयुक्त विशेष पद है; ‘पहरूए’ उसकी जागते और निगरानी करते रहने की छवि को बनाए रखता है, जबकि ‘स्वर्गदूत’ अर्थ की व्याख्या कर देता।
- source_word: פִּתְגָמָא
  choice: दण्डादेश
  rationale: इस न्यायिक प्रसंग में यह घोषित निर्णय या दण्ड-वचन है। ‘दण्डादेश’ कानूनी बल को स्पष्ट करता है और सामान्य ‘बात’ से अधिक सटीक है।
- source_word: וּמֵאמַר קַדִּישִׁין שְׁאֵלְתָא
  choice: और यह माँग पवित्र जनों के वचन से है
  rationale: शब्द-विन्यास अत्यंत संक्षिप्त है। ‘पवित्र जन’ स्वर्गीय सभा की मूल पदावली को सुरक्षित रखता है, और שְׁאֵלְתָא का सामान्य अर्थ ‘माँग/निवेदन’ मुख्य पाठ में रखा गया है; इसकी वैकल्पिक वाक्यगत समझ पादटिप्पणी में दी गई है।
- source_word: עַד דִּבְרַת דִּי
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: חַיַּיָּא
  choice: जीवित लोग
  rationale: यह व्यापक सामूहिक अभिव्यक्ति है। ‘जीवित लोग’ हिन्दी में स्पष्ट है और इसे केवल किसी विशेष समूह तक सीमित नहीं करता।
- source_word: שַׁלִּיט עִלָּיָא
  choice: परमप्रधान ... प्रभुता रखता है
  rationale: עִלָּיָא ईश्वर की उपाधि ‘परमप्रधान’ है और שַׁלִּיט उसकी सक्रिय शासकीय सत्ता व्यक्त करता है।
- source_word: בְּמַלְכוּת אֱנוֹשָׁא
  choice: मनुष्यों के राज्य पर
  rationale: अक्षरशः पूर्वसर्ग ‘में’ हो सकता है, पर प्रसंग में शासकीय अधिकार ‘पर’ के अर्थ में है। אֱנוֹשָׁא सामूहिक मानव-जगत को दर्शाता है; ‘मनुष्यों का राज्य’ इसे ठोस और सुबोध रखता है।
- source_word: וּלְמַן דִּי יִצְבֵּא יִתְּנִנַּהּ
  choice: वह जिसे चाहता है, उसे यह राज्य देता है
  rationale: यह परमप्रधान की स्वतंत्र इच्छा और राज्य प्रदान करने के अधिकार को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁפַל אֲנָשִׁים יְקִים עֲלַהּ
  choice: मनुष्यों में से सबसे निम्न व्यक्ति को उस पर नियुक्त करता है
  rationale: मुहावरा सामाजिक पद या प्रतिष्ठा में अत्यंत निम्न व्यक्ति को दर्शाता है। ‘सबसे निम्न’ स्रोत की तीक्ष्णता बनाए रखता है, पर ‘नीच’ से उत्पन्न अनावश्यक नैतिक अर्थ से बचता है।
theological_decisions:
- issue: ‘पहरुओं’ और ‘पवित्र जनों’ की पहचान
  choice: मूल स्वर्गीय-दरबार की पदावली ‘पहरूए’ और ‘पवित्र जन’ बनाए रखी गई।
  alternative: ‘स्वर्गदूत’ या ‘स्वर्गीय प्राणी’
  rationale: पाठ इन प्राणियों की श्रेणी को सीधे ‘स्वर्गदूत’ नहीं कहता। मूल चित्रात्मक पदों को रखने से उनकी पहचान संबंधी वास्तविक व्याख्यात्मक खुलापन बना रहता है।
- issue: स्वर्गीय निर्णय और परमप्रधान की सर्वोच्च प्रभुता का संबंध
  choice: पहरूओं और पवित्र जनों के निर्णय-वचन को यथावत रखा गया, साथ ही उद्देश्य-वाक्य में परमप्रधान की सर्वोच्च प्रभुता स्पष्ट रखी गई।
  alternative: स्वर्गीय प्राणियों की भाषा को केवल परमेश्वर की आज्ञा का पर्याय बना देना
  rationale: पद स्वर्गीय सभा की वास्तविक भाषा और परमप्रधान के सार्वभौम शासन—दोनों को साथ रखता है। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी एक व्यवस्थित व्याख्या में नहीं समेटता।
- issue: שְׁפַל אֲנָשִׁים का आशय
  choice: सामाजिक पद में ‘सबसे निम्न व्यक्ति’
  alternative: ‘सबसे दीन’, ‘सबसे नम्र’ या ‘सबसे नीच मनुष्य’
  rationale: ‘दीन/नम्र’ सद्गुण का और ‘नीच’ नैतिक भ्रष्टता का संकेत दे सकता है। स्रोत मुख्यतः निम्न हैसियत या प्रतिष्ठा पर बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। न्यायिक शब्दावली के लिए ‘दण्डादेश’ और ‘निर्णय’, स्वर्गीय-दरबार की विशिष्ट शब्दावली के लिए ‘पहरूए’ और ‘पवित्र जन’, तथा राजकीय अधिकार के लिए ‘प्रभुता रखता है’ चुना गया है। स्रोत की संक्षिप्त और अस्पष्ट पहली पंक्ति को अत्यधिक सहज बनाकर उसका अर्थ निश्चित नहीं किया गया; विकल्प पादटिप्पणी में सुरक्षित हैं।
