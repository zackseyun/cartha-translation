base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/008.yaml
  text: The tree grew large and became strong[a], and its height reached to the heavens, and it was visible to the end of the whole earth.
translation:
  language: hi
  text: वह वृक्ष बढ़कर विशाल और बलवान हो गया। उसकी ऊँचाई आकाश तक पहुँच गई, और वह सारी पृथ्वी के छोर तक दिखाई देता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका रूप सारी पृथ्वी के छोर तक था।” अरामी संज्ञा का अर्थ “रूप/आकृति” भी हो सकता है, पर इस प्रसंग में वृक्ष की दृश्यता का अर्थ अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְבָה אִילָנָא
  choice: वह वृक्ष बढ़कर विशाल ... हो गया
  rationale: रְבָה बढ़ने अथवा बड़ा होने की प्रक्रिया व्यक्त करता है। वृक्ष के संदर्भ में ‘बढ़कर विशाल हो गया’ स्वाभाविक है और विकास का भाव बनाए रखता है; अִילָנָא को प्रसंग के निश्चित वृक्ष के रूप में ‘वह वृक्ष’ कहा गया है।
- source_word: וּתְקִף
  choice: और बलवान हो गया
  rationale: क्रिया दृढ़ या शक्तिशाली होने का भाव देती है। ‘बलवान हो गया’ वृक्ष की असाधारण सामर्थ्य को व्यक्त करते हुए विकासक्रम को सुरक्षित रखता है।
- source_word: וְרוּמֵהּ
  choice: उसकी ऊँचाई
  rationale: यह संज्ञा वृक्ष की ऊँचाई या उन्नति को सूचित करती है; आधुनिक हिन्दी में ‘ऊँचाई’ सबसे सीधा और स्पष्ट विकल्प है।
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: आकाश तक पहुँच गई
  rationale: יִמְטֵא का अर्थ ‘पहुँचना’ है। अरामी שְׁמַיָּא रूपतः बहुवचन है, पर मानक हिन्दी में इस दृश्य के लिए ‘आकाश’ स्वाभाविक सामूहिक पद है और ऊर्ध्वगामी बिंब को बनाए रखता है।
- source_word: וַחֲזוֹתֵהּ
  choice: वह ... दिखाई देता था
  rationale: संज्ञा ‘रूप/दृश्यता/जो देखा जाए’ का अर्थ दे सकती है। पृथ्वी के छोर तक वाली रचना में दृश्यता का भाव प्रसंगानुकूल है; हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है।
- source_word: לְסוֹף כָּל אַרְעָא
  choice: सारी पृथ्वी के छोर तक
  rationale: यह पद पूरे भू-विस्तार की अंतिम सीमा का चित्र देता है। स्वप्न के व्यापक परिप्रेक्ष्य में ‘पृथ्वी’ स्थानीय ‘देश’ की अपेक्षा अधिक उपयुक्त है।
theological_decisions:
- issue: वृक्ष की दृश्यता बनाम उसके रूप का विस्तार
  choice: मुख्य पाठ में वृक्ष का सारी पृथ्वी के छोर तक दिखाई देना
  alternative: उसका रूप सारी पृथ्वी के छोर तक था
  rationale: अरामी חֲזוֹתֵהּ ‘उसका रूप/दृश्य’ भी हो सकता है, पर स्थान-विस्तार बताने वाले अगले पद के साथ दृश्यता का अर्थ अधिक सहज है। वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विशाल और बलवान’ स्वप्न के अतिशयोक्तिपूर्ण वृक्ष-बिंब को बनाए रखते हैं; वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट है।
