base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/009.yaml
  text: Its foliage was beautiful and its fruit abundant[a], and in it was food for all. Under it the beasts of the field found shade, and in its branches the birds of the heavens dwelt, and from it all flesh was fed.
translation:
  language: hi
  text: उसके पत्ते सुन्दर थे और उसके फल बहुतायत में थे। उसमें सबके लिए भोजन था। उसके नीचे मैदान के पशु छाया पाते थे, उसकी डालियों में आकाश के पक्षी बसेरा करते थे, और उससे समस्त प्राणी[a] भोजन पाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘सारा मांस’; यह समस्त सजीव प्राणियों के लिए प्रयुक्त एक बाइबलीय मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָפְיֵהּ
  choice: उसके पत्ते
  rationale: यह सामूहिक रूप से पेड़ के पत्तों अथवा पर्णसमूह को दर्शाता है। ‘पत्ते’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: שַׁפִּיר
  choice: सुन्दर
  rationale: इस विशेषण का सीधा अर्थ ‘सुन्दर’ या ‘मनोहर’ है; यहाँ पेड़ के पत्तों का वर्णन है।
- source_word: אִנְבֵּהּ שַׂגִּיא
  choice: उसके फल बहुतायत में थे
  rationale: אִנְבֵּהּ पेड़ के फल को और שַׂגִּיא उसकी प्रचुरता को व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए स्रोत का अर्थ बनाए रखता है।
- source_word: מָזוֹן לְכֹלָּא בֵהּ
  choice: उसमें सबके लिए भोजन था
  rationale: मूल का शब्दक्रम और व्यापक ‘सबके लिए’ सुरक्षित रखा गया है; आगे की पंक्तियाँ इसके दायरे को स्पष्ट करती हैं।
- source_word: תַּטְלֵל חֵיוַת בָּרָא
  choice: मैदान के पशु छाया पाते थे
  rationale: क्रिया छाया या आश्रय पाने का भाव देती है। חֵיוַת בָּרָא खुले क्षेत्र के पशुओं के लिए प्रयुक्त बाइबलीय अभिव्यक्ति है।
- source_word: וּבְעַנְפוֹהִי ידרון צִפֲּרֵי שְׁמַיָּא
  choice: उसकी डालियों में आकाश के पक्षी बसेरा करते थे
  rationale: ‘डालियाँ’ עַנְפִין का सुबोध रूप है और ‘बसेरा करते थे’ निवास करने की क्रिया को पक्षियों के प्रसंग में स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल घोंसला बनाने तक सीमित किए।
- source_word: וּמִנֵּהּ יִתְּזִין כָּל בִּשְׂרָא
  choice: और उससे समस्त प्राणी भोजन पाते थे
  rationale: क्रिया पोषण अथवा भोजन पाने को बताती है। כָּל בִּשְׂרָא का शाब्दिक रूप हिन्दी में अस्वाभाविक और संभावित रूप से भ्रामक है, इसलिए उसके सन्दर्भगत अर्थ को मुख्य पाठ में और शाब्दिक मुहावरे को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: כָּל בִּשְׂרָא का बाइबलीय मुहावरा
  choice: समस्त प्राणी
  alternative: सारा मांस
  rationale: अरामी में शाब्दिक अर्थ ‘सारा मांस’ है, पर यह यहाँ समस्त सजीव प्राणियों के लिए प्रयुक्त मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और स्रोत की अभिव्यक्ति पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मैदान के पशु’ और ‘आकाश के पक्षी’ मूल की बाइबलीय छवियों को बनाए रखते हैं, जबकि ‘बसेरा करते थे’ और ‘भोजन पाते थे’ स्वाभाविक हिन्दी प्रवाह देते हैं।
