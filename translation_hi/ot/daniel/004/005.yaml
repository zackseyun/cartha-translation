  text: וְ/עַ֣ד אָחֳרֵ֡ין עַל֩ קָֽדָמַ֨/י דָּנִיֵּ֜אל דִּֽי שְׁמֵ֤/הּ בֵּלְטְשַׁאצַּר֙ כְּ/שֻׁ֣ם אֱלָהִ֔/י וְ/דִ֛י רֽוּחַ אֱלָהִ֥ין קַדִּישִׁ֖ין בֵּ֑/הּ וְ/חֶלְמָ֖/א קָֽדָמ֥וֹ/הִי אַמְרֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/005.yaml
  text: 'At last Daniel came in before me—he whose name was Belteshazzar[a], after the name of my god, and in whom is the spirit of the holy gods—and I told the dream before him:'
translation:
  language: hi
  text: 'अन्त में दानिय्येल मेरे सामने आया—वही जिसका नाम मेरे देवता के नाम पर बेलतशस्सर[a] रखा गया था और जिसमें पवित्र देवताओं की आत्मा है—और मैंने उसे अपना स्वप्न बताया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और जिसमें पवित्र परमेश्वर की आत्मा है।” अरामी वाक्यांश को अलग-अलग ढंग से समझा जा सकता है, पर यहाँ राजा के शब्द उसकी बहुदेववादी दृष्टि को सबसे स्वाभाविक रूप से दर्शाते हैं: “पवित्र देवताओं की आत्मा।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַד אָחֳרֵין
  choice: अन्त में
  rationale: यह अरामी पद समय में बाद की अवस्था और विलंब के बाद आगमन को व्यक्त करता है; ‘अन्त में’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַל קָדָמַי
  choice: मेरे सामने आया
  rationale: यह राजा की उपस्थिति में आने का भाव रखता है; हिन्दी में ‘मेरे सामने आया’ गति और राजकीय उपस्थिति दोनों को सहज रूप से व्यक्त करता है।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: דִּי שְׁמֵהּ בֵּלְטְשַׁאצַּר
  choice: वही जिसका नाम ... बेलतशस्सर रखा गया था
  rationale: सम्बन्धवाचक उपवाक्य दानिय्येल की पहचान उसके बेबीलोनी नाम से कराता है; ‘रखा गया था’ अगले पदबंध में नामकरण का संबंध स्पष्ट करता है।
- source_word: כְּשֻׁם אֱלָהִי
  choice: मेरे देवता के नाम पर
  rationale: पूर्वसर्ग और ‘नाम’ का मेल किसी के नाम के अनुसार अथवा उसके नाम पर नाम रखे जाने को सूचित करता है।
- source_word: וְדִי רוּחַ אֱלָהִין קַדִּישִׁין בֵּהּ
  choice: और जिसमें पवित्र देवताओं की आत्मा है
  rationale: अरामी में ‘देवता’ और उसका विशेषण बहुवचन हैं। राजा की बहुदेववादी दृष्टि को मुख्य पाठ में बनाए रखा गया है; वाक्यांश की वैकल्पिक एकवचन समझ पादटिप्पणी में दी गई है।
- source_word: וְחֶלְמָא קָדָמוֹהִי אַמְרֵת
  choice: और मैंने उसे अपना स्वप्न बताया
  rationale: शाब्दिक रूप ‘उसके सामने स्वप्न कहा’ है। स्वाभाविक आधुनिक हिन्दी में ‘उसे ... बताया’ वही आशय स्पष्ट करता है; ‘अपना’ प्रसंग से वक्ता के स्वप्न को निर्दिष्ट करता है।
theological_decisions:
- issue: नबूकदनेस्सर के कथन में רוּחַ אֱלָהִין קַדִּישִׁין का अनुवाद
  choice: पवित्र देवताओं की आत्मा
  alternative: पवित्र परमेश्वर का आत्मा; पवित्र परमेश्वर की आत्मा
  rationale: अֱלָהִין और קַדִּישִׁין दोनों के बहुवचन रूप तथा बहुदेववादी राजा के कथन के कारण मुख्य पाठ में बहुवचन अर्थ सबसे स्वाभाविक है। फिर भी अरामी वाक्यांश को कुछ प्रसंगों में आदरसूचक एकवचन समझा गया है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। राजकीय उपस्थिति के शाब्दिक मुहावरे को अत्यधिक कृत्रिम बनाए बिना व्यक्त किया गया है। ‘देवता’ शब्द वक्ता की बहुदेववादी दृष्टि को सुरक्षित रखता है, जबकि वैकल्पिक एकवचन पाठ पादटिप्पणी में दिया गया है।
