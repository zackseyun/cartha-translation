base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/020.yaml
  text: And because the king saw a watcher[a], a holy one, coming down from heaven and saying, ‘Cut down the tree and destroy it, but leave the stump of its roots in the earth, with a band of iron and bronze, in the grass of the field, and let him be drenched with the dew of heaven[c][b], and let his portion be with the beasts of the field until seven times pass over him’—
translation:
  language: hi
  text: और इसलिए कि राजा ने एक प्रहरी[a], एक पवित्र जन को स्वर्ग से उतरते और यह कहते देखा, ‘इस वृक्ष को काट डालो और इसे नष्ट कर दो; पर इसकी जड़ों का ठूँठ धरती में, मैदान की घास के बीच, लोहे और काँसे के बंधन[b] के साथ रहने दो। वह आकाश की ओस से भीगता रहे और उसका भाग मैदान के पशुओं के साथ हो, जब तक उस पर सात काल[c] न बीत जाएँ’—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जागता रहनेवाला’; अरामी शब्द ऐसे स्वर्गीय प्राणी को दर्शाता है जिसकी विशेषता जागते और निगरानी करते रहना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘लोहे और काँसे की बेड़ी के साथ।’
    reason: lexical_alternative
  - marker: c
    text: ‘सात काल’ का अर्थ समय की सात अवधियाँ हो सकता है; पाठ उनकी निश्चित इकाई नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: עִיר
  choice: पहरेदार
  rationale: यह अरामी पद ऐसे स्वर्गीय प्राणी को सूचित करता है जिसकी विशेषता जागते और निगरानी करते रहना है। ‘पहरेदार’ आधुनिक हिन्दी में स्वाभाविक है और पद को केवल ‘स्वर्गदूत’ कहकर अधिक विशिष्ट नहीं बनाता।
- source_word: וְקַדִּישׁ
  choice: एक पवित्र जन
  rationale: यह ‘पहरेदार’ के साथ उसी स्वर्गीय व्यक्ति का दूसरा, समानाधिकरणात्मक वर्णन है; अलग श्रेणी का दूसरा प्राणी नहीं।
- source_word: גֹּדּוּ אִילָנָא וְחַבְּלוּהִי
  choice: इस वृक्ष को काट डालो और इसे नष्ट कर दो
  rationale: दोनों बहुवचन आज्ञाओं की प्रबलता और वृक्ष को गिराने तथा बरबाद करने का क्रम सुरक्षित रहता है।
- source_word: עִקַּר שָׁרְשׁוֹהִי
  choice: इसकी जड़ों का ठूँठ
  rationale: यह केवल जड़ों को नहीं, बल्कि धरती में जड़ सहित बचे हुए ठूँठ को दर्शाता है।
- source_word: בֶאֱסוּר דִּי פַרְזֶל וּנְחָשׁ
  choice: लोहे और काँसे के बंधन में
  rationale: אֱסוּר बंधन, पट्टा या बेड़ी का अर्थ दे सकता है। ‘बंधन’ वृक्ष के ठूँठ को बाँधने और आगे व्यक्ति पर लागू होने वाली छवि—दोनों को खुला रखता है।
- source_word: יִצְטַבַּע
  choice: भीगता रहे
  rationale: यह निष्क्रिय रूप ओस से गहराई तक भीगने का भाव देता है; हिन्दी में ‘भीगता रहे’ स्वाभाविक और स्पष्ट है।
- source_word: וְעִם חֵיוַת בָּרָא חֲלָקֵהּ
  choice: मैदान के पशुओं के साथ उसका भाग हो
  rationale: ‘भाग’ חֲלָקֵהּ के हिस्से, नियत दशा या संगति के अर्थ को औपचारिक रूप से बनाए रखता है।
- source_word: שִׁבְעָה עִדָּנִין
  choice: सात काल
  rationale: עִדָּנִין समय की अवधियों को बताता है, पर उनकी निश्चित इकाई नहीं बताता; ‘काल’ इस अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: ‘पहरेदार, एक पवित्र जन’ की पहचान
  choice: मूल पदनामों के अनुसार एक स्वर्गीय प्राणी के रूप में वर्णन, बिना उसे स्पष्टतः ‘स्वर्गदूत’ कहे
  alternative: ‘एक स्वर्गदूत’ अथवा किसी विशिष्ट स्वर्गीय वर्ग का सदस्य
  rationale: अरामी पाठ उस प्राणी की ठीक-ठीक स्वर्गीय श्रेणी निर्धारित नहीं करता। इसलिए उसके अपने दोनों वर्णनों को सुरक्षित रखा गया है।
- issue: वृक्ष से व्यक्ति की ओर व्याकरणिक परिवर्तन
  choice: ठूँठ के बाद ‘वह’ और ‘उसका’ जैसे पुरुषवाचक रूप बनाए रखना
  alternative: पूरे कथन में केवल निर्जीव वृक्ष/ठूँठ के रूप रखना
  rationale: मूल पाठ वृक्ष की छवि से उस व्यक्ति की दशा की ओर जाता है जिसका वह वृक्ष प्रतीक है। इस तनाव को समतल किए बिना हिन्दी में भी रखा गया है।
- issue: ‘सात काल’ की अवधि
  choice: समय की इकाई अनिर्धारित रखना
  alternative: ‘सात वर्ष’
  rationale: पाठ ‘सात समय-अवधियाँ’ कहता है और यहाँ उनकी इकाई स्पष्ट नहीं करता; ‘वर्ष’ जोड़ना व्याख्यात्मक निर्णय होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय संबोधन की अनावश्यक पुनरावृत्ति से बचते हुए अरामी वाक्य का अधूरा, अगले पद से जुड़ने वाला अंत दीर्घ डैश द्वारा सुरक्षित रखा गया है।
