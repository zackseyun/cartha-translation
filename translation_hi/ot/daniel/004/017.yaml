base_translation:
  language: en
  yaml_path: translation/ot/daniel/004/017.yaml
  text: The tree that you saw[a], which grew and became strong, whose height reached to the heavens and was visible to all the earth—
translation:
  language: hi
  text: वह पेड़ जिसे आपने देखा था, जो बढ़कर बलवान हो गया, जिसकी ऊँचाई आकाश तक पहुँच गई और जो सारी पृथ्वी[a] पर दिखाई देता था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी शब्द אַרְעָא का अर्थ “देश” या “भूमि” भी हो सकता है; यहाँ स्वप्न-दृष्टि के सार्वभौमिक विस्तार के कारण “पृथ्वी” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִילָנָא
  choice: वह पेड़
  rationale: निश्चित अरामी संज्ञा उस विशेष पेड़ की ओर संकेत करती है जिसे राजा ने स्वप्न में देखा था; हिन्दी में ‘वह पेड़’ इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּי חֲזַיְתָ
  choice: जिसे आपने देखा था
  rationale: सम्बन्धवाचक अव्यय और द्वितीय पुरुष एकवचन क्रिया को सम्मानसूचक आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त किया गया है।
- source_word: רְבָה וּתְקִף
  choice: जो बढ़कर बलवान हो गया
  rationale: रूपक में पेड़ की वृद्धि और शक्ति प्राप्त करने की क्रमिकता बनी रहती है; ‘बढ़कर’ हिन्दी में दोनों क्रियाओं को सहजता से जोड़ता है।
- source_word: וְרוּמֵהּ
  choice: जिसकी ऊँचाई
  rationale: רוּם यहाँ पेड़ की ऊँचाई या ऊँचे विस्तार को दर्शाता है; ‘ऊँचाई’ ‘चोटी’ की अपेक्षा मूल शब्द के अधिक निकट है।
- source_word: יִמְטֵא לִשְׁמַיָּא
  choice: आकाश तक पहुँच गई
  rationale: יִמְטֵא का अर्थ ‘पहुँचना’ है। अरामी बहुवचन שְׁמַיָּא के लिए हिन्दी का स्वाभाविक सामूहिक रूप ‘आकाश’ प्रयुक्त हुआ है, जो इसे केवल भौतिक आसमान तक सीमित नहीं करता।
- source_word: וַחֲזוֹתֵהּ לְכָל אַרְעָא
  choice: और जो सारी पृथ्वी से दिखाई देता था
  rationale: वाक्यांश का आशय पेड़ की व्यापक दृश्यता है। ‘सारी पृथ्वी से’ मूल के לְכָל को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אַרְעָא
  choice: पृथ्वी
  rationale: शब्द का अर्थ ‘देश/भूमि’ भी हो सकता है, पर आकाश तक पहुँचने और सर्वत्र दिखाई देने वाले पेड़ की स्वप्न-दृष्टि में ‘पृथ्वी’ उसका सार्वभौमिक विस्तार बेहतर व्यक्त करता है।
theological_decisions:
- issue: राजकीय स्वप्न-दृष्टि में אַרְעָא का भौगोलिक विस्तार
  choice: पृथ्वी
  alternative: देश / भूमि
  rationale: अरामी शब्द दोनों अर्थ दे सकता है, पर इस पद की विशाल, सार्वभौमिक छवि ‘पृथ्वी’ के पक्ष में है। यह चयन दृश्य का पैमाना बनाए रखता है, बिना उससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष निकाले।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। राजा को संबोधन में ‘आपने’ प्रयोग किया गया है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में दीर्घ डैश रखा गया है।
