  rationale: यह संबोधन है; ‘हे राजा’ दरबारी गरिमा और प्रत्यक्ष संबोधन दोनों बनाए रखता है।
- source_word: וּגְזֵרַת
  choice: और ... आदेश
  rationale: यहाँ संज्ञा दैवी निर्णय या आदेश को व्यक्त करती है; ‘आदेश’ सामान्य पाठक के लिए स्वाभाविक है और राजकीय-दैवी अधिकार का भाव रखता है।
- source_word: עִלָּיָא
  choice: परमप्रधान
  rationale: यह परमेश्वर की सर्वोच्चता बताने वाली उपाधि है; ‘परमप्रधान’ हिन्दी बाइबलीय शैली में सटीक, प्रतिष्ठित और सुबोध है।
- source_word: דִּי מְטָת עַל
  choice: जो ... पर आ पहुँचा है
  rationale: मूल में आदेश के किसी व्यक्ति तक पहुँचने या उस पर आने का भाव है; यह अनुवाद उस गंभीर न्याय-संदर्भ को बिना ‘विरुद्ध’ जोड़कर अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: מָרִי מַלְכָּא
  choice: मेरे प्रभु राजा
  rationale: यह राजा के प्रति सम्मानपूर्ण दरबारी संबोधन है; ‘प्रभु’ यहाँ मानवीय स्वामी/अधिपति के आदरसूचक अर्थ में है।
theological_decisions:
- issue: दैवी उपाधि עִלָּיָא का अनुवाद
  choice: परमप्रधान
  alternative: सर्वोच्च जन
  rationale: ‘परमप्रधान’ परमेश्वर की सभी सांसारिक शासकों पर सर्वोच्चता को व्यक्त करता है और मूल से अधिक कोई विशेष सिद्धान्त नहीं जोड़ता।
- issue: आदेश के राजा ‘पर आने’ का भाव
  choice: पर आ पहुँचा है
  alternative: के विरुद्ध आया है
  rationale: संदर्भ में न्याय का प्रतिकूल भाव है, पर עַל को स्पष्टतः ‘विरुद्ध’ कहना मूल की व्यापकता को संकुचित कर सकता है; इसलिए आगमन/लागू होने की छवि सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण दरबारी स्वर के साथ रखी गई है। अर्धविराम मूल के दो जुड़े हुए कथनों को स्पष्ट करता है, और अंत का द्विबिंदु अगले पद में आने वाली व्याख्या की ओर संकेत करता है।
