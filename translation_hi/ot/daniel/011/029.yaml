  footnotes:
  - marker: a
    text: या, ‘पर वह न तो पहले के समान होगा, न बाद के समान।’ इब्रानी में तुलना संक्षिप्त है और यह स्पष्ट नहीं किया गया कि ‘पहले’ और ‘बाद’ किस बात को सूचित करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד
  choice: नियत समय पर
  rationale: מוֹעֵד यहाँ किसी निर्धारित समय को सूचित करता है; यह अनुवाद किसी पर्व या सभा का अनावश्यक अर्थ जोड़े बिना समय की निश्चितता बनाए रखता है।
- source_word: יָשׁוּב וּבָא
  choice: वह फिर ... आएगा
  rationale: शाब्दिक क्रम ‘वह लौटेगा और आएगा’ हिन्दी में असहज है। ‘फिर आएगा’ वापसी और पुनः अभियान—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַנֶּגֶב
  choice: दक्षिण देश में
  rationale: दानिय्येल 11 में उत्तर-दक्षिण के भूराजनीतिक संदर्भ के कारण נֶגֶב से केवल नेगेव क्षेत्र नहीं, दक्षिणी राज्य या भूभाग अभिप्रेत है।
- source_word: וְלֹא תִהְיֶה
  choice: पर इस बार वैसा नहीं होगा
  rationale: स्त्रीलिंग एकवचन क्रिया का संकेत संभवतः निहित यात्रा या सैन्य अभियान की ओर है। हिन्दी में निरपेक्ष अभिव्यक्ति मूल की संदर्भगत अस्पष्टता रखती है; ‘इस बार’ वर्तमान अभियान को सहजता से चिह्नित करता है।
- source_word: כָרִאשֹׁנָה וְכָאַחֲרֹנָה
  choice: जैसा पहले हुआ था या जैसा बाद में होगा
  rationale: इब्रानी तुलना संक्षिप्त और कुछ हद तक लुप्तपद है। यह रूप ‘पहले’ और ‘बाद में’ की कालगत तुलना को बनाए रखते हुए हिन्दी में अर्थपूर्ण है, पर तुलना की अघोषित वस्तु को निश्चित नहीं करता।
