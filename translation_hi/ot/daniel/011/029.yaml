  naturalness: The revision is idiomatic modern standard Hindi and retains a suitably restrained biblical register. ‘न तो ... न ...’ naturally conveys the scope of the Hebrew negation.
  terminology: ‘नियत समय,’ ‘दक्षिण देश,’ and ‘लौटकर ... आएगा’ are appropriate. ‘पहले जैसा’ and ‘बाद जैसा’ preserve the Hebrew’s elliptical former/latter comparison without identifying particular campaigns.
