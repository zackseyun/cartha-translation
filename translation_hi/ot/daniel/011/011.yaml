base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/011.yaml
  text: Then the king of the South will become enraged and go out and fight with him[a], with the king of the North; and he will raise up a great multitude[c][b], but the multitude will be given into his hand.
translation:
  language: hi
  text: तब दक्षिण का राजा क्रोध से भड़क उठेगा[a] और निकलकर उत्तर के राजा से युद्ध करेगा। उत्तर का राजा एक विशाल सेना[b] खड़ी करेगा, पर वह सेना दक्षिण के राजा के हाथ में सौंप दी जाएगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ ‘भीतर से उत्तेजित होना’ या ‘कटुता से भर उठना’ भी हो सकता है; यहाँ यह कार्रवाई की ओर ले जाने वाले तीव्र आंतरिक क्षोभ को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘एक विशाल जनसमूह’; युद्ध के इस प्रसंग में इसका आशय बड़ी सेना से है। इब्रानी पाठ में यहाँ कर्ता केवल ‘वह’ है; संदर्भ के आधार पर इसे उत्तर का राजा समझा गया है।
    reason: lexical_and_referential_note
  - marker: c
    text: ‘हाथ में सौंप दिया जाना’ इब्रानी मुहावरा है, जिसका अर्थ किसी के अधिकार या वश में कर दिया जाना है। इब्रानी में ‘उसके हाथ में’ है; संदर्भ के आधार पर इसका संकेत दक्षिण के राजा की ओर समझा गया है।
    reason: cultural_and_referential_note
