- source_word: הָמוֹן רָב
  choice: एक विशाल सेना
  rationale: הָמוֹן मूलतः बड़ी भीड़ या जनसमूह है, पर यहाँ स्पष्ट सैन्य प्रसंग में संगठित विशाल सैन्यदल अभिप्रेत है। ‘सेना’ साधारण हिन्दी पाठक के लिए संदर्भ को साफ करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
