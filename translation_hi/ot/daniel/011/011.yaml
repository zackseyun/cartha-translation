  choice: पर वह सेना दक्षिण के राजा के हाथ में कर दी जाएगी
  rationale: निफ़अल रूप सौंपे या वश में किए जाने को व्यक्त करता है। ‘हाथ में’ की इब्रानी उपमा को बनाए रखा गया है, जबकि संदर्भ से सर्वनाम का आशय स्पष्ट करने के लिए ‘दक्षिण के राजा’ कहा गया है।
