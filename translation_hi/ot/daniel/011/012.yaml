- source_word: הֶהָמוֹן
  choice: वह विशाल जनसमूह
  rationale: यह शब्द भीड़, जनसमूह या बड़ी संख्या को दर्शाता है। प्रसंग में सेना अभिप्रेत हो सकती है, पर ‘जनसमूह’ मूल शब्द की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ירום לְבָבוֹ
  choice: उसका मन घमंड से भर जाएगा
  rationale: शाब्दिक अर्थ ‘उसका हृदय ऊँचा होगा’ है, जो घमंडी या अहंकारी होने का इब्रानी मुहावरा है। आधुनिक हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त किया गया है, जबकि [b] में मूल बिंब दिया गया है।
- source_word: וְהִפִּיל
  choice: वह ... मार गिराएगा
  rationale: हिफ़ील रूप का मूल अर्थ ‘गिरा देना’ है। युद्ध के संदर्भ में ‘मार गिराना’ उसका स्वाभाविक हिन्दी अर्थ है।
- source_word: רִבֹּאוֹת
  choice: दसियों हज़ार लोगों को
  rationale: बहुवचन रूप बहुत बड़ी संख्या, अर्थात ‘दस हज़ारों’ या ‘असंख्य बड़ी संख्या’, को व्यक्त करता है। हिन्दी में ‘दसियों हज़ार’ स्पष्ट और स्वाभाविक है; ‘लोगों’ को क्रिया के निहित कर्म को स्पष्ट करने के लिए जोड़ा गया है।
- source_word: וְלֹא יָעוֹז
  choice: फिर भी वह प्रबल न होगा
  rationale: क्रिया का अर्थ बलवान होना या प्रबल होना है। ‘प्रबल न होगा’ विजय न पाने और अपनी शक्ति सुदृढ़ न कर पाने—दोनों संभावनाओं के प्रति अपेक्षाकृत खुला रहता है।
