base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/012.yaml
  text: And when the multitude is carried away[a], his heart will be lifted up, and he will cast down tens of thousands[c][b], but he will not prevail.
translation:
  language: hi
  text: और जब वह विशाल जनसमूह हटा दिया जाएगा[a], तब उसका मन घमंड से भर जाएगा[b]। वह दसियों हज़ार लोगों को धराशायी कर देगा, फिर भी वह प्रबल न होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वह विशाल जनसमूह ऊपर उठाया जाएगा,” अथवा “उठाकर ले जाया जाएगा।” इब्रानी क्रिया के ये अर्थ संभव हैं; युद्ध का प्रसंग “हटा दिया जाएगा” के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका हृदय ऊँचा हो जाएगा”—अर्थात वह घमंडी हो जाएगा।
    reason: cultural_note
  - marker: c
    text: या “वह बलवान न होगा।” इब्रानी में आशय प्रबल न होने या अपनी शक्ति सुदृढ़ न कर पाने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשָּׂא
  choice: और जब ... हटा दिया जाएगा
