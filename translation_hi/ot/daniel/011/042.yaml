translation:
  language: hi
  text: वह देशों के विरुद्ध अपना हाथ बढ़ाएगा, और मिस्र का देश बच नहीं पाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִשְׁלַח
  choice: बढ़ाएगा
  rationale: שׁלח का मूल अर्थ ‘भेजना’ या ‘फैलाना/बढ़ाना’ है। ‘अपना हाथ बढ़ाएगा’ सैन्य संदर्भ में शक्ति अथवा आक्रमण के विस्तार का इब्रानी बिंब बनाए रखता है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिन्दी में कर्ता की ओर लौटने वाले अंग-संबंध के लिए ‘अपना’ स्वाभाविक है; ‘हाथ बढ़ाना’ मूल मुहावरे और उसकी आक्रामक शक्ति की छवि को सुरक्षित रखता है।
- source_word: בָּאֲרָצוֹת
  choice: देशों पर
  rationale: बहुवचन אֲרָצוֹת को ‘देशों’ से व्यक्त किया गया है। इस सैन्य प्रसंग में בְּ को लक्ष्यसूचक ‘पर’ कहना स्वाभाविक है और अनावश्यक रूप से सामान्य ‘धरती’ का अर्थ नहीं देता।
- source_word: וְאֶרֶץ מִצְרַיִם
  choice: और मिस्र देश
  rationale: मूल पाठ के स्पष्ट भौगोलिक पदबंध ‘मिस्र का देश’ को आधुनिक हिन्दी में सहज और प्रतिष्ठित रूप ‘मिस्र देश’ से सुरक्षित रखा गया है।
- source_word: לֹא תִהְיֶה לִפְלֵיטָה
  choice: बच नहीं पाएगा
  rationale: शाब्दिक संरचना ‘बच निकलने के लिए नहीं होगा’ हिन्दी में अस्वाभाविक है। प्रसंगानुसार इसका अर्थ है कि मिस्र उसकी पहुँच या आक्रमण से बच नहीं सकेगा; ‘बच नहीं पाएगा’ इस अर्थ को स्पष्ट और स्वाभाविक रूप से देता है।
