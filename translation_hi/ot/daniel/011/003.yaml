source:
  edition: WLC
  text: וְ/עָמַ֖ד מֶ֣לֶךְ גִּבּ֑וֹר וּ/מָשַׁל֙ מִמְשָׁ֣ל רַ֔ב וְ/עָשָׂ֖ה כִּ/רְצוֹנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/003.yaml
  text: Then a mighty king will arise[a], and he will rule with great dominion and do as he pleases.
translation:
  language: hi
  text: तब एक पराक्रमी राजा उठ खड़ा होगा और बड़े प्रभुत्व के साथ शासन करेगा और अपनी इच्छा के अनुसार करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָמַד
  choice: तब ... उठ खड़ा होगा
  rationale: भविष्यसूचक घटनाक्रम में עמד किसी शासक के उदित होने या सामने आने को व्यक्त करता है; ‘तब’ क्रमिक प्रवाह को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: מֶלֶךְ גִּבּוֹר
  choice: एक पराक्रमी राजा
  rationale: גִּבּוֹר सामर्थ्य और वीरता दोनों का बोध करा सकता है। ‘पराक्रमी’ राजनीतिक और सैनिक बल को समेटता है, बिना अर्थ को केवल युद्ध-कौशल तक सीमित किए।
- source_word: וּמָשַׁל
  choice: शासन करेगा
  rationale: משל अधिकारपूर्वक शासन करने को व्यक्त करता है। ‘शासन करेगा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִמְשָׁל רַב
  choice: बड़े प्रभुत्व के साथ
  rationale: משל से संबंधित यह संज्ञा शासन के व्यापक अधिकार और सामर्थ्य पर बल देती है; ‘बड़े प्रभुत्व के साथ’ मूल के संज्ञात्मक बल को बनाए रखता है।
- source_word: וְעָשָׂה כִּרְצוֹנוֹ
  choice: और अपनी इच्छा के अनुसार करेगा
  rationale: यह वाक्यांश अपनी इच्छा के अनुरूप कार्य करने को दर्शाता है। यह रूप मूल की संरचना और संभावित निरंकुश स्वतंत्रता, दोनों को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पराक्रमी’, ‘प्रभुत्व’ और ‘अपनी इच्छा के अनुसार’ मूल के अर्थ और औपचारिक स्वर को स्वाभाविक हिन्दी के साथ संतुलित करते हैं।
