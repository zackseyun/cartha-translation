id: DAN.11.32
reference: Daniel 11:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מַרְשִׁיעֵ֣י בְרִ֔ית יַחֲנִ֖יף בַּ/חֲלַקּ֑וֹת וְ/עַ֛ם יֹדְעֵ֥י אֱלֹהָ֖י/ו יַחֲזִ֥קוּ וְ/עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/032.yaml
  text: He will corrupt with smooth words those who act wickedly against the covenant[b][a], but the people who know their God will stand firm and take action.
translation:
  language: hi
  text: जो वाचा के विरुद्ध दुष्टता करते हैं, उन्हें वह चिकनी-चुपड़ी बातों से भ्रष्ट करेगा[a]; परन्तु जो लोग अपने परमेश्वर को जानते हैं, वे दृढ़ रहेंगे और कार्य करेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुशामद से’ अथवा ‘लुभावनी बातों से’।
    reason: lexical_alternative
  - marker: b
    text: या ‘बलवन्त होंगे और कार्य करेंगे’; मूल भाषा में अन्तिम क्रिया का सामान्य अर्थ ‘करना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַרְשִׁיעֵי בְרִית
  choice: जो वाचा के विरुद्ध दुष्टता करते हैं
  rationale: यह कृदन्त उन लोगों को दर्शाता है जो वाचा के सम्बन्ध में दोषपूर्ण या दुष्ट आचरण करते हैं। ‘वाचा के विरुद्ध’ उस सम्बन्धगत भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַחֲנִיף
  choice: भ्रष्ट करेगा
  rationale: हिफ़ील रूप यहाँ किसी को अधर्मी या अपवित्र बनाने अथवा बहकाकर दुष्टता में ले जाने का भाव रखता है। ‘भ्रष्ट करेगा’ नैतिक और धार्मिक बिगाड़ को व्यक्त करता है, पर प्रक्रिया को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בַּחֲלַקּוֹת
  choice: चिकनी-चुपड़ी बातों से
  rationale: मूल शब्द ‘चिकनाई’ से निकला है और मुहावरे में खुशामदी, लुभावनी या छलपूर्ण वाणी को दर्शाता है। यह हिन्दी प्रयोग रूपक और आशय दोनों को स्वाभाविक ढंग से रखता है।
- source_word: וְעַם
  choice: परन्तु ... लोग
  rationale: וְ का मूल अर्थ ‘और’ है, किन्तु यहाँ दो समूहों के बीच स्पष्ट विरोध है; इसलिए ‘परन्तु’ प्रसंगगत सम्बन्ध को सहज हिन्दी में प्रकट करता है।
- source_word: יֹדְעֵי אֱלֹהָיו
  choice: जो लोग अपने परमेश्वर को जानते हैं
  rationale: कृदन्त निरन्तर और सम्बन्धपरक जानने का भाव देता है। एकवचन प्रत्यय को सामूहिक ‘लोग’ के साथ हिन्दी में स्वाभाविक रूप से ‘अपने परमेश्वर’ कहा गया है।
- source_word: יַחֲזִקוּ
  choice: दृढ़ रहेंगे
  rationale: यहाँ חזק का हिफ़ील रूप परिणामसूचक या अकर्मक अर्थ में शक्ति और स्थिरता बनाए रखने का संकेत देता है। ‘दृढ़ रहेंगे’ विरोध के बीच अटल रहने का भाव स्पष्ट करता है।
- source_word: וְעָשׂוּ
  choice: और कार्य करेंगे
  rationale: עשה व्यापक क्रिया है, जिसका अर्थ करना या कार्य करना है। ‘कार्य करेंगे’ उसकी व्यापकता बनाए रखता है और ‘बड़े पराक्रम करेंगे’ जैसे अधिक व्याख्यात्मक विस्तार से बचता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में विश्वासयोग्य लोगों की प्रतिक्रिया का स्वरूप
  choice: वे दृढ़ रहेंगे और कार्य करेंगे
  alternative: वे बलवन्त होंगे और करेंगे; अथवा वे दृढ़ रहकर निर्णायक कदम उठाएँगे
  rationale: यह अनुवाद सताव के बीच दृढ़ता और वास्तविक कर्म, दोनों को रखता है। साथ ही עשה के व्यापक अर्थ को किसी विशेष सैन्य पराक्रम या बाद की धर्मवैज्ञानिक धारणा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘वाचा’ बाइबलीय सम्बन्ध की तकनीकी संज्ञा के रूप में रखा गया है। ‘चिकनी-चुपड़ी बातें’ सामान्य पाठक के लिए स्वाभाविक है और मूल रूपक को भी बचाती हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
