  text: וְ/שָׁב֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/הֶעֱמִ֣יד הָמ֔וֹן רַ֖ב מִן הָ/רִאשׁ֑וֹן וּ/לְ/קֵ֨ץ הָֽ/עִתִּ֤ים שָׁנִים֙ יָ֣בוֹא ב֔וֹא בְּ/חַ֥יִל גָּד֖וֹל וּ/בִ/רְכ֥וּשׁ רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/013.yaml
  text: Then the king of the north will return and raise a multitude greater than the former one[a]; and at the end of the times, after some years[c][b], he will surely come with a great army and with much equipment.
translation:
  language: hi
  text: तब उत्तर का राजा लौटेगा और पहले वाले से भी बड़ी सेना[a] खड़ी करेगा; और वर्षों के बाद, समयों के अंत में[b], वह निश्चय ही एक विशाल सेना और बहुत-से सामान[c] के साथ आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहले वाले से भी बड़ा जनसमूह।” इब्रानी पदबंध संख्या अथवा आकार की विशालता पर बल दे सकता है; प्रसंग सैन्य है।
    reason: lexical_alternative
  - marker: b
    text: या “वर्षों के बाद, नियत समयों के अंत में।” इब्रानी अभिव्यक्ति संक्षिप्त है और किसी निश्चित अवधि के पूरा होने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: या “बहुत-से संसाधनों,” “बहुत-सी रसद,” अथवा “बहुत-सी युद्ध-सामग्री” के साथ। इब्रानी शब्द अभियान के साथ लाई गई संपत्ति, सामग्री या साधनों को व्यापक रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁב
  choice: तब ... लौटेगा
  rationale: शׁוּב का सामान्य अर्थ ‘लौटना’ है; आरंभिक संयोजक कथा को आगे बढ़ाता है, जिसे स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: उत्तर का राजा
  rationale: यह पूरे अध्याय में प्रयुक्त दिशासूचक राजकीय उपाधि को सीधे और स्पष्ट रूप में बनाए रखता है।
- source_word: וְהֶעֱמִיד
  choice: खड़ी करेगा
  rationale: עמד के हिफ़ील रूप का यहाँ आशय किसी सैन्य दल को तैयार या संगठित करने से है; ‘सेना खड़ी करना’ स्वाभाविक हिन्दी सैन्य प्रयोग है।
- source_word: הָמוֹן רַב
  choice: बड़ी सेना
  rationale: הָמוֹן का अर्थ जनसमूह या विशाल दल हो सकता है; सैन्य प्रसंग में ‘सेना’ आशय स्पष्ट करता है, जबकि ‘बड़ी’ רַב के परिमाणात्मक बल को सुरक्षित रखता है।
- source_word: מִן הָרִאשׁוֹן
  choice: पहले वाले से भी बड़ी
  rationale: מִן का तुलनात्मक अर्थ है और הָרִאשׁוֹן पहले सैन्य दल की ओर संकेत करता है; ‘वाले’ निहित संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּלְקֵץ הָעִתִּים שָׁנִים
  choice: कुछ वर्षों के बाद, निर्धारित समयों के अंत में
  rationale: संक्षिप्त और कुछ अस्पष्ट इब्रानी पदबंध में वर्षों के बीतने और समयों के अंत—दोनों तत्व हैं। यह अनुवाद दोनों को बनाए रखता है और עִתִּים में संभव नियत-अवधि के भाव को ‘निर्धारित समयों’ से व्यक्त करता है।
- source_word: יָבוֹא בּוֹא
  choice: निश्चय ही ... आएगा
  rationale: समापिका क्रिया के साथ infinitive absolute क्रिया पर बल देता है; ‘निश्चय ही’ उस तीव्रता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בְּחַיִל גָּדוֹל
  choice: एक विशाल सेना के साथ
  rationale: חַיִל के अर्थों में शक्ति, संपत्ति और सेना सम्मिलित हैं; यहाँ अभियान के सैन्य संदर्भ में ‘सेना’ सबसे उपयुक्त है।
- source_word: וּבִרְכוּשׁ רָב
  choice: और बहुत-सी युद्ध-सामग्री के साथ
  rationale: רְכוּשׁ संपत्ति, माल या संसाधनों का व्यापक बोध करा सकता है; अभियान के संदर्भ में ‘युद्ध-सामग्री’ सैन्य उपयोग को स्पष्ट करती है, जबकि पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
