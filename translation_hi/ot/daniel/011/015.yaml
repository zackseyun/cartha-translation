source:
  edition: WLC
  text: וְ/יָבֹא֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/יִשְׁפֹּךְ֙ סֽוֹלֲלָ֔ה וְ/לָכַ֖ד עִ֣יר מִבְצָר֑וֹת וּ/זְרֹע֤וֹת הַ/נֶּ֨גֶב֙ לֹ֣א יַעֲמֹ֔דוּ וְ/עַם֙ מִבְחָרָ֔י/ו וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/015.yaml
  text: Then the king of the north will come and heap up a siege ramp and capture a fortified city[a], and the forces of the south will not stand, nor his choice troops[b], for there will be no strength to stand.
translation:
  language: hi
  text: तब उत्तर का राजा आएगा, घेराबंदी का टीला खड़ा करेगा और एक किलेबंद नगर पर अधिकार कर लेगा। दक्षिण की सेनाएँ उसका सामना नहीं कर पाएँगी, न ही दक्षिण के राजा के चुने हुए सैनिक[a] टिक पाएँगे, क्योंकि सामना करने की शक्ति नहीं रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दक्षिण के राजा के चुने हुए लोग।” प्रसंग में यह वाक्यांश सम्भवतः दक्षिण के राजा के चुनिंदा सैनिकों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָבֹא
  choice: तब ... आएगा
  rationale: वाव-सहित अपूर्ण क्रिया भविष्यसूचक वर्णन को क्रमशः आगे बढ़ाती है; आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: उत्तर का राजा
  rationale: यह दानिय्येल 11 में बार-बार आने वाला दिशात्मक-राजनीतिक पद है और ‘दक्षिण’ के साथ उसका विरोध बनाए रखता है।
- source_word: וְיִשְׁפֹּךְ סֹלֲלָה
  choice: घेराबंदी का ढेर खड़ा करेगा
  rationale: इब्रानी मुहावरा नगर पर आक्रमण के लिए मिट्टी-पत्थर का घेराबंदी-ढेर या चढ़ाई का मार्ग बनाने को दर्शाता है; यह हिन्दी में अर्थ को स्पष्ट रखते हुए मूल बिंब भी बचाता है।
- source_word: וְלָכַד
  choice: अधिकार कर लेगा
  rationale: सैन्य प्रसंग में नगर को जीतकर अपने नियंत्रण में लेने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: עִיר מִבְצָרוֹת
  choice: एक किलेबंद नगर
  rationale: बहुवचन संज्ञा यहाँ नगर की सुदृढ़ किलेबंदी बताती है; हिन्दी में विशेषणात्मक अनुवाद सहज है।
- source_word: וּזְרֹעוֹת הַנֶּגֶב
  choice: दक्षिण की सेनाएँ
  rationale: ‘भुजाएँ’ सैन्य शक्ति या बल का रूपक है; प्रसंगगत अर्थ ‘सेनाएँ’ से स्पष्ट होता है।
- source_word: לֹא יַעֲמֹדוּ
  choice: उसका सामना नहीं कर पाएँगी
  rationale: शाब्दिक ‘खड़ी नहीं रहेंगी’ सैन्य प्रसंग में प्रतिरोध न कर पाने का अर्थ देता है; चुना गया रूप आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: וְעַם מִבְחָרָיו
  choice: यहाँ तक कि उसके चुने हुए सैनिक भी नहीं
  rationale: עַם सामान्यतः ‘लोग’ हो सकता है, पर इस सैन्य प्रसंग में राजा के चुनिंदा योद्धा अभिप्रेत जान पड़ते हैं; मूल की संभावित व्यापकता पादटिप्पणी में रखी गई है।
- source_word: וְאֵין כֹּחַ לַעֲמֹד
  choice: क्योंकि सामना करने की शक्ति नहीं रहेगी
  rationale: यह पिछली असमर्थता का कारण बताता है; ‘सामना’ पहले प्रयुक्त सैन्य अर्थ-संबंध को बनाए रखता है।
theological_decisions:
- issue: וְעַם מִבְחָרָיו में संदर्भ और अर्थ
  choice: ‘उसके’ को दक्षिण के राजा से संबंधित मानते हुए ‘चुने हुए सैनिक’
  alternative: ‘उसके चुने हुए लोग’
  rationale: निकटवर्ती विषय दक्षिण की सैन्य शक्तियाँ हैं, इसलिए चुनिंदा सैनिक प्रसंगानुकूल हैं; फिर भी संज्ञा עַם की व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य बिंबों को अनावश्यक तकनीकी शब्दावली के बिना व्यक्त किया गया है; जहाँ मूल में वास्तविक शाब्दिक अस्पष्टता है, उसे पादटिप्पणी में सुरक्षित रखा गया है।
