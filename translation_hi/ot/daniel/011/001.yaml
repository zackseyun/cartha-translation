  text: וַ/אֲנִי֙ בִּ/שְׁנַ֣ת אַחַ֔ת לְ/דָרְיָ֖וֶשׁ הַ/מָּדִ֑י עָמְדִ֛/י לְ/מַחֲזִ֥יק וּ/לְ/מָע֖וֹז לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/001.yaml
  text: And as for me[a], in the first year of Darius the Mede[b], I stood up to strengthen and be a fortress to him.
translation:
  language: hi
  text: और मैं[a], मादी दारा के शासन के पहले वर्ष में, उसे सामर्थ्य देने और उसके लिए गढ़ बनने को खड़ा हुआ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और मैं... उसे सामर्थ्य देने और उसके लिए एक दृढ़ गढ़ बनने को खड़ा हुआ।”'
    reason: lexical_alternative
  - marker: b
    text: हिब्रू पद-विभाजन में यह दानिय्येल 11:1 है; कुछ परंपराओं में अध्याय और पद का विभाजन थोड़ा भिन्न है और इसे पिछले अध्याय के अंतिम कथन से जोड़ा जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं
  rationale: संयोजक और स्वतंत्र सर्वनाम वक्ता की ओर हल्का बलयुक्त संक्रमण दिखाते हैं; आधुनिक हिन्दी में ‘और मैं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּשְׁנַת אַחַת
  choice: शासन के पहले वर्ष में
  rationale: राजकीय कालगणना में इस पदबंध का अर्थ ‘पहले वर्ष में’ है; ‘शासन के’ जोड़ने से हिन्दी में आशय स्पष्ट और स्वाभाविक होता है।
- source_word: לְדָרְיָוֶשׁ הַמָּדִי
  choice: मादी दारा के
  rationale: व्यक्तिनाम को प्रचलित हिन्दी रूप ‘दारा’ और जातीय उपाधि को ‘मादी’ के रूप में रखा गया है।
- source_word: עָמְדִי
  choice: खड़ा हुआ
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ या ‘डटकर खड़ा होना’ है; यहाँ सहायता के लिए सक्रिय रूप से खड़े होने का भाव है।
- source_word: לְמַחֲזִיק
  choice: दृढ़ करने
  rationale: हिफ़ील रूप किसी को शक्ति या दृढ़ता देने का अर्थ देता है; ‘दृढ़ करने’ से यह कारणवाचक भाव बना रहता है।
- source_word: וּלְמָעוֹז
  choice: और उसके लिए गढ़ बनने
  rationale: מָעוֹז संज्ञा है जिसका अर्थ गढ़, दृढ़ स्थान या शरणस्थान हो सकता है। इसे केवल ‘रक्षा करने’ में बदलने के बजाय संज्ञात्मक रूपक सुरक्षित रखा गया है।
- source_word: לוֹ
  choice: उसे / उसके लिए
  rationale: पहला प्रयोग हिन्दी वाक्य-विन्यास में ‘दृढ़ करने’ का कर्म है और दूसरा ‘गढ़ बनने’ के साथ अधिक स्वाभाविक है; संदर्भतः संकेत मादी दारा की ओर है।
theological_decisions:
- issue: वक्ता और ‘उसे/उसके’ का संकेत
  choice: वक्ता पिछले प्रसंग का स्वर्गदूतीय पात्र है और सर्वनाम मादी दारा की ओर संकेत करता है।
  alternative: अध्याय-विभाजन की भिन्न परंपरा के कारण यह पद पिछले अध्याय के समापन के रूप में भी पढ़ा जा सकता है।
  rationale: अनुवाद तत्काल प्रसंग के स्वाभाविक संकेत को रखता है, पर वक्ता की कोई अधिक विशिष्ट पहचान या सैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: מָעוֹז का रूपक
  choice: ‘गढ़ बनने’ के रूप में संज्ञात्मक रूपक सुरक्षित रखा गया है।
  alternative: इसे कार्यात्मक रूप से ‘रक्षा करने’ कहा जा सकता है।
  rationale: हिब्रू में यहाँ क्रिया ‘रक्षा करना’ नहीं, बल्कि ‘गढ़/दृढ़ स्थान’ संज्ञा है; इसलिए मूल की चित्रात्मक और संभावित धर्मवैचारिक गहराई को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गढ़ बनने’ से मूल हिब्रू संज्ञात्मक रूपक सुरक्षित रहता है; ‘शासन के’ हिन्दी में राजकीय वर्ष का आशय स्पष्ट करता है।
