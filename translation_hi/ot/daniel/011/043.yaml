base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/043.yaml
  text: And he will rule over the treasures of gold and silver[a], and over all the precious things of Egypt[b]; and the Libyans and Cushites will be in his train.
translation:
  language: hi
  text: वह सोने-चाँदी के छिपे हुए भंडारों[a] और मिस्र की सभी बहुमूल्य वस्तुओं पर अधिकार करेगा; और लीबियाई तथा कूशी लोग उसके पीछे-पीछे चलेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने और चाँदी के खज़ाने।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके कदमों पर होंगे।” इसका आशय उसके पीछे चलना या उसके अभियान में साथ होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁל
  choice: पर अधिकार करेगा
  rationale: यह क्रिया यहाँ शासन या नियंत्रण स्थापित करने का अर्थ देती है। ‘पर अधिकार करेगा’ आधुनिक हिन्दी में स्वाभाविक है और वस्तुओं तथा भंडारों पर नियंत्रण के संदर्भ में उपयुक्त है।
- source_word: בְּמִכְמַנֵּי
  choice: छिपे हुए भंडारों
  rationale: מִכְמָן में छिपाकर या सुरक्षित रखी गई संचित संपत्ति का भाव है। यह अनुवाद उस विशेष अर्थ को केवल ‘खज़ानों’ कहने की अपेक्षा अधिक स्पष्टता से बनाए रखता है।
- source_word: הַזָּהָב וְהַכֶּסֶף
  choice: सोने-चाँदी
  rationale: दोनों धातुओं के सामान्य और प्रचलित हिन्दी नाम, संयुक्त रूप में स्वाभाविक ढंग से व्यक्त किए गए हैं।
- source_word: וּבְכֹל חֲמֻדוֹת מִצְרָיִם
  choice: और मिस्र की सभी बहुमूल्य वस्तुओं
  rationale: חֲמֻדוֹת मूल्यवान या मनभावनी वस्तुओं को सूचित करता है। ‘बहुमूल्य वस्तुएँ’ अर्थ को केवल धन या खज़ाने तक सीमित नहीं करता।
- source_word: לֻבִים
  choice: लीबियाई
  rationale: यह जातिनाम लीबिया के लोगों को सूचित करता है। ‘लीबियाई’ आधुनिक हिन्दी पाठक के लिए स्पष्ट और परिचित रूप है।
- source_word: כֻשִׁים
  choice: कूशी लोग
  rationale: ‘कूशी’ मूल ऐतिहासिक-भौगोलिक जातिनाम कूश को सुरक्षित रखता है और इसे आधुनिक इथियोपियाई राष्ट्रीय पहचान के साथ अनावश्यक रूप से नहीं मिलाता।
- source_word: בְּמִצְעָדָיו
  choice: उसके पीछे-पीछे चलेंगे
  rationale: पदबंध में कदम, कूच या किसी के कदमों के साथ चलने का चित्र है। संदर्भ में यह उन लोगों के उसके पीछे चलने या उसके अभियान में साथ होने को स्वाभाविक हिन्दी में व्यक्त करता है।
