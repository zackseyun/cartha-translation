source:
  edition: WLC
  text: וְ/יָשֹׁ֤ב אַרְצ/וֹ֙ בִּ/רְכ֣וּשׁ גָּד֔וֹל וּ/לְבָב֖/וֹ עַל בְּרִ֣ית קֹ֑דֶשׁ וְ/עָשָׂ֖ה וְ/שָׁ֥ב לְ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/028.yaml
  text: Then he will return to his land with great wealth[a], but his heart will be against the holy covenant[b]; and he will act and return to his land.
translation:
  language: hi
  text: तब वह बहुत धन-संपत्ति[a] लेकर अपने देश लौटेगा, पर उसका मन पवित्र वाचा के विरुद्ध होगा; वह कुछ करेगा और अपने देश लौट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत माल-असबाब’; इब्रानी शब्द संपत्ति, सामान या धन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֹׁב
  choice: तब वह ... लौटेगा
  rationale: שוב का सामान्य अर्थ ‘लौटना’ है। आरंभिक וְ को आधुनिक हिन्दी में कथा की आगे बढ़ती कड़ी के रूप में ‘तब’ से व्यक्त किया गया है।
- source_word: אַרְצוֹ
  choice: अपने देश
  rationale: אֶרֶץ का अर्थ ‘देश’ या ‘भूमि’ हो सकता है; यहाँ राजनैतिक-भौगोलिक संदर्भ में ‘देश’ अधिक स्वाभाविक है।
- source_word: בִּרְכוּשׁ גָּדוֹל
  choice: बहुत धन-संपत्ति
  rationale: רְכוּשׁ संपत्ति, माल-असबाब या धन को सूचित करता है। ‘धन-संपत्ति’ अर्थ की व्यापकता बनाए रखता है और इसे अनिवार्यतः लूट नहीं ठहराता।
- source_word: וּלְבָבוֹ עַל
  choice: पर उसका मन ... के विरुद्ध होगा
  rationale: לֵבָב के साथ עַל यहाँ विरोध की ओर उन्मुख आंतरिक अभिप्राय व्यक्त करता है। ‘मन ... के विरुद्ध’ मूल की संक्षिप्तता और शत्रुतापूर्ण भाव दोनों बनाए रखता है।
- source_word: בְּרִית קֹדֶשׁ
  choice: पवित्र वाचा
  rationale: בְּרִית के लिए ‘वाचा’ और विशेषणवत् प्रयुक्त קֹדֶשׁ के लिए ‘पवित्र’ पारदर्शी और धर्मशास्त्रीय रूप से अनिर्णायक अनुवाद है।
- source_word: וְעָשָׂה
  choice: वह कार्रवाई करेगा
  rationale: עשה का कर्म यहाँ व्यक्त नहीं है। ‘कार्रवाई करेगा’ अनिर्दिष्ट किंतु उद्देश्यपूर्ण कार्य को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कार्य का स्वरूप जोड़ने के।
- source_word: וְשָׁב לְאַרְצוֹ
  choice: और अपने देश लौट जाएगा
  rationale: שוב की पुनरावृत्ति को ‘लौट’ से बनाए रखा गया है; ‘लौट जाएगा’ बीच की कार्रवाई के बाद स्वदेश-गमन की पूर्णता को स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: ‘पवित्र वाचा’ का अभिप्रेत संदर्भ
  choice: वाचा की मूल शब्दावली को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
  alternative: यहूदी धर्म; परमेश्वर की वाचा से जुड़े लोग और व्यवस्था
  rationale: वाक्यांश संभवतः परमेश्वर के पवित्र लोगों से संबद्ध वाचागत व्यवस्था की ओर संकेत करता है, पर मूल पाठ स्वयं ‘वाचा’ कहता है। अनुवाद उस धर्मशास्त्रीय व्यापकता को संकुचित नहीं करता।
- issue: וְעָשָׂה में अनिर्दिष्ट कार्य
  choice: ‘वह कार्रवाई करेगा’
  alternative: वह अपना मनचाहा करेगा; वह पवित्र वाचा के विरुद्ध कार्रवाई करेगा
  rationale: मूल में कर्म नहीं दिया गया। संदर्भ विरोधी कार्य का संकेत देता है, किंतु अनुवाद स्पष्ट रूप से न कही गई वस्तु या परिणाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘वाचा’ बाइबलीय धर्मशास्त्रीय पद को सुरक्षित रखता है। आरंभ और अंत में ‘लौटना’ की इब्रानी पुनरावृत्ति हिन्दी में भी बनाए रखी गई है।
