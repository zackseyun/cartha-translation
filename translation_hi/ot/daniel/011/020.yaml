source:
  edition: WLC
  text: וְ/עָמַ֧ד עַל כַּנּ֛/וֹ מַעֲבִ֥יר נוֹגֵ֖שׂ הֶ֣דֶר מַלְכ֑וּת וּ/בְ/יָמִ֤ים אֲחָדִים֙ יִשָּׁבֵ֔ר וְ/לֹ֥א בְ/אַפַּ֖יִם וְ/לֹ֥א בְ/מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/020.yaml
  text: Then one will arise in his place who will send an exactor through the splendor of the kingdom[a]; but within a few days he will be broken[c][b], though not in anger and not in battle.
translation:
  language: hi
  text: तब उसके स्थान पर एक व्यक्ति उठ खड़ा होगा, जो राज्य के वैभव में से होकर कर-वसूलनेवाले को भेजेगा[a]; परन्तु थोड़े ही दिनों में वह नाश हो जाएगा—न क्रोध में और न युद्ध में[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वसूली करनेवाले” अथवा “अत्याचारी को।” इब्रानी शब्द कर, लगान या अन्य भुगतान कठोरता से वसूलनेवाले व्यक्ति के लिए प्रयुक्त हो सकता है। “राज्य के वैभव” का अर्थ राज्य का सबसे शानदार भाग या सामान्य रूप से उसका गौरव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “न क्रोध में” का अनुवाद “क्रोध के द्वारा नहीं” या “कोप से नहीं” भी हो सकता है। इब्रानी अभिव्यक्ति संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל כַּנּוֹ
  choice: तब उसके स्थान पर ... उठ खड़ा होगा
  rationale: यह दानिय्येल 11 में राजवंशीय उत्तराधिकार का सूत्र है; ‘तब’ कथा की प्रगति और ‘उसके स्थान पर’ पूर्ववर्ती शासक के पद पर आने का भाव व्यक्त करता है।
- source_word: מַעֲבִיר
  choice: भेजेगा
  rationale: हिफ़िल कृदन्त यहाँ अधिकारी को राज्य में फिराने या भेजने का संकेत देता है; आधुनिक हिन्दी में ‘भेजेगा’ स्वाभाविक है।
- source_word: נוֹגֵשׂ
  choice: कर वसूलनेवाले
  rationale: शब्द कर, लगान या अनिवार्य भुगतान वसूलनेवाले अधिकारी को सूचित कर सकता है। प्रसंग में यह स्पष्ट और सहज हिन्दी है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הֶדֶר מַלְכוּת
  choice: राज्य के वैभव के बीच
  rationale: הדר वैभव, शोभा या महिमा को व्यक्त करता है। ‘राज्य के वैभव’ मूल सम्बन्ध को बनाए रखता है; ‘के बीच’ מַעֲבִיר के निहित मार्ग-भाव को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: וּבְיָמִים אֲחָדִים
  choice: कुछ ही दिनों में
  rationale: यह थोड़े समय का संकेत देने वाला मुहावरा है; अनिवार्यतः दिनों की सटीक संख्या नहीं बताता।
- source_word: יִשָּׁבֵר
  choice: तोड़ दिया जाएगा
  rationale: שבר के निफ़ाल रूप की ‘टूटने/नष्ट होने’ की मूल उपमा को सुरक्षित रखा गया है और उसके हटाए जाने या मारे जाने की विधि को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וְלֹא בְאַפַּיִם
  choice: न क्रोध में
  rationale: אַפַּיִם का अर्थ क्रोध या कोप है, पर בְּ के कारण अभिव्यक्ति संक्षिप्त और कुछ अस्पष्ट है। शब्दशः निकट रूप उस अस्पष्टता को बनाए रखता है।
- source_word: וְלֹא בְמִלְחָמָה
  choice: और न युद्ध में
  rationale: यह उसके पतन की रीति को युद्ध से अलग बताता है; ‘युद्ध’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
