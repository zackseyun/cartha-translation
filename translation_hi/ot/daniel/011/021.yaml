source:
  edition: WLC
  text: וְ/עָמַ֤ד עַל כַּנּ/וֹ֙ נִבְזֶ֔ה וְ/לֹא נָתְנ֥וּ עָלָ֖י/ו ה֣וֹד מַלְכ֑וּת וּ/בָ֣א בְ/שַׁלְוָ֔ה וְ/הֶחֱזִ֥יק מַלְכ֖וּת בַּ/חֲלַקְלַקּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/021.yaml
  text: And in his place a despised man will arise[a], on whom they had not bestowed the majesty of kingship[b]; he will come in quietly and seize the kingdom by intrigues.
translation:
  language: hi
  text: उसके स्थान पर एक ऐसा व्यक्ति उठ खड़ा होगा जिसे तुच्छ समझा जाता है। उसे राजपद का गौरव नहीं दिया गया था। वह शांत ढंग से[a] आएगा और चिकनी-चुपड़ी बातों[b] से राजसत्ता पर अधिकार कर लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चिंतता की स्थिति में’; בְשַׁלְוָה शांति, सहजता या सुरक्षा की अवस्था का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘चालबाज़ियों से’; בַּחֲלַקְלַקּוֹת का शाब्दिक संबंध चिकनाई से है और यह चापलूसी भरी बातों या छलपूर्ण राजनीतिक उपायों, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד עַל־כַּנּוֹ
  choice: उसके स्थान पर ... उठ खड़ा होगा
  rationale: उत्तराधिकार के इस प्रसंग में עמד का अर्थ किसी पद पर उभरना या सत्ता में आना है; यह अनुवाद स्थान-ग्रहण और भविष्यकालीन भाव दोनों को बनाए रखता है।
- source_word: נִבְזֶה
  choice: एक ऐसा व्यक्ति ... जिसे तुच्छ समझा जाता है
  rationale: यह शब्द उस व्यक्ति को दूसरों की दृष्टि में तिरस्कृत या तुच्छ ठहराया हुआ बताता है; अनुवाद इसे केवल उसके स्वभाव का वस्तुनिष्ठ वर्णन नहीं बनाता।
- source_word: וְלֹא נָתְנוּ עָלָיו הוֹד מַלְכוּת
  choice: उसे राजपद का गौरव नहीं दिया गया था
  rationale: मूल में अनिर्दिष्ट बहुवचन कर्ता है। हिन्दी का कर्मवाच्य उस अनिर्दिष्ट कर्ता को बनाए रखता है, और ‘राजपद’ מַלְכוּת को यहाँ राज्य-क्षेत्र के बजाय राजकीय पद या शासनाधिकार के अर्थ में व्यक्त करता है।
- source_word: וּבָא בְשַׁלְוָה
  choice: वह शांत ढंग से आएगा
  rationale: שַׁלְוָה शांति, निश्चिंतता या सुरक्षित अवस्था का बोध करा सकता है। ‘शांत ढंग से’ खुले आक्रमण के विपरीत सहज प्रवेश का भाव देता है, पर नैतिक शांतिप्रियता का अनावश्यक दावा नहीं करता।
- source_word: וְהֶחֱזִיק מַלְכוּת
  choice: राजसत्ता पर अधिकार कर लेगा
  rationale: Hiphil रूप सत्ता को दृढ़ता से पकड़ लेने या अपने नियंत्रण में कर लेने का संकेत देता है। ‘राजसत्ता’ यहाँ राज्य के भूभाग से अधिक शासनाधिकार को स्पष्ट करता है।
- source_word: בַּחֲלַקְלַקּוֹת
  choice: चिकनी-चुपड़ी बातों से
  rationale: यह शब्द ‘चिकनाई’ से निकला है और रूपकतः चापलूसी, लुभावनी भाषा या छलपूर्ण उपायों को सूचित करता है। चुना हुआ हिन्दी पद मूल रूपक और धोखे से मनाने के भाव दोनों को सुरक्षित रखता है।
