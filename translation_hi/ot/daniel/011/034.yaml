    text: या ‘चापलूसी से।’ इब्रानी में शाब्दिक रूप से ‘चिकनी बातों’ का भाव है, जो छलपूर्ण या खुशामदी वाणी का सामान्य बिंब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהִכָּשְׁלָם
  choice: और जब वे ठोकर खाएँगे
  rationale: בְּ के साथ infinitive construct यहाँ समय-सूचक परिस्थिति व्यक्त करता है। ‘ठोकर खाएँगे’ मूल रूपक को बनाए रखता है और ‘गिर पड़ेंगे’ की अपेक्षा पूर्ण पतन का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: יֵעָזְרוּ
  choice: उन्हें ... सहायता मिलेगी
  rationale: निफ़अल रूप सहायता पाने का भाव देता है। यह हिन्दी में स्वाभाविक है और स्पष्ट करता है कि सहायता उन्हें प्राप्त होगी।
- source_word: עֵזֶר מְעָט
  choice: थोड़ी सहायता
  rationale: संज्ञा और विशेषण का यह मेल सहायता की सीमित मात्रा पर बल देता है; ‘थोड़ी सहायता’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: וְנִלְווּ עֲלֵיהֶם
  choice: उनके साथ हो जाएँगे
  rationale: यह पद किसी समूह से अपने को जोड़ लेने या उसके साथ आ मिलने का भाव देता है। ‘उनके साथ हो जाएँगे’ सहज हिन्दी में इस संलग्नता को व्यक्त करता है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह सामान्य परिमाणवाचक शब्द है; सन्दर्भ में व्यक्तियों की बड़ी संख्या बताने के लिए यह स्वाभाविक हिन्दी रूप है।
- source_word: בַּחֲלַקְלַקּוֹת
  choice: चिकनी-चुपड़ी बातों से
  rationale: חלקלקות का मूल चित्र ‘चिकनी बातों’ का है और प्रसंग में चापलूसी अथवा छलपूर्ण वाणी का संकेत देता है। ‘चिकनी-चुपड़ी बातों’ से मूल बिंब और निहित कपट दोनों बने रहते हैं।
