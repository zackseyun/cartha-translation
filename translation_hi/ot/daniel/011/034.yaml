  text: और जब वे ठोकर खाएँगे, तब उन्हें थोड़ी सहायता मिलेगी; और बहुत-से लोग चिकनी-चुपड़ी बातों से[a] उनसे आ मिलेंगे।
  philosophy: optimal-equivalence
  footnotes:
