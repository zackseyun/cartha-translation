  text: וְ/עָשָׂ֞ה לְ/מִבְצְרֵ֤י מָֽעֻזִּים֙ עִם אֱל֣וֹהַּ נֵכָ֔ר אֲשֶׁ֥ר הכיר יַרְבֶּ֣ה כָב֑וֹד וְ/הִמְשִׁילָ/ם֙ בָּֽ/רַבִּ֔ים וַ/אֲדָמָ֖ה יְחַלֵּ֥ק בִּ/מְחִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/039.yaml
  text: And he will act against the strongest fortresses with a foreign god[a]. Those whom he acknowledges, he will increase with honor, and he will make them rule over many[d][c][b], and he will divide land for a price.
translation:
  language: hi
  text: वह एक विदेशी देवता के साथ सबसे दृढ़ दुर्गों के विरुद्ध कार्रवाई करेगा।[a][b] जिन्हें वह मान्यता देगा, उन्हें वह बहुत सम्मान देगा और बहुतों पर शासक बनाएगा;[c] और वह मूल्य के बदले भूमि बाँटेगा।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किलेबंद गढ़ों के साथ’ अथवा ‘दृढ़ गढ़ों के लिए।’ हिब्रू पदबंध संक्षिप्त है और इसे कुछ भिन्न प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘एक विदेशी देवता के द्वारा।’ ‘के साथ’ संगति या साधन—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जो उसे मान्यता देते हैं।’ हिब्रू को इस प्रकार भी समझा गया है, यद्यपि ‘जिन्हें वह मान्यता देगा’ क्रियारूप और आगे आने वाले बहुवचन संकेत से अधिक स्वाभाविक मेल खाता है।
    reason: alternative_reading
  - marker: d
    text: या ‘वह भुगतान के बदले भूमि के भाग बाँटेगा’ अथवा ‘प्रतिफल के रूप में भूमि बाँटेगा।’ इस पदबंध में लेन-देन का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: वह…कार्रवाई करेगा
  rationale: עשה का अर्थ व्यापक है—करना या कार्रवाई करना। सैन्य-राजनीतिक प्रसंग में ‘कार्रवाई करेगा’ स्वाभाविक है और क्रिया की दिशा अगले पदबंध से स्पष्ट होने देता है।
- source_word: לְמִבְצְרֵי מָעֻזִּים
  choice: सबसे दृढ़ किलों के विरुद्ध
  rationale: מִבְצָר किलेबंद स्थान और מָעוֹז दृढ़ता या गढ़ को सूचित करता है। प्रसंग में לְ को विरोध अथवा दिशा के अर्थ में लेकर यह अनुवाद स्वाभाविक है; पदबंध की संक्षिप्तता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עִם אֱלוֹהַּ נֵכָר
  choice: एक पराए देवता के साथ
  rationale: עִם का सामान्य अर्थ ‘के साथ’ है। यह साथ देने और साधन होने—दोनों संभावनाएँ खुली रखता है। נֵכָר के लिए ‘पराया’ इस संदर्भ में अपरिचित अथवा विदेशी देवता का भाव देता है।
- source_word: אֲשֶׁר הִכִּיר
  choice: जिन्हें वह मान्यता देगा
  rationale: נכר के हिफ़ील रूप का अर्थ पहचानना या मान्यता देना है। 3 पुं. एकवचन क्रिया में राजा कर्ता है और आगे का बहुवचन प्रत्यय उन्हीं व्यक्तियों की ओर संकेत करता है।
- source_word: יַרְבֶּה כָבוֹד
  choice: उन्हें वह बहुत सम्मान देगा
  rationale: शाब्दिक भाव सम्मान को बढ़ाने का है। आधुनिक हिन्दी में ‘बहुत सम्मान देगा’ कारणवाचक प्रचुरता को स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: וְהִמְשִׁילָם בָּרַבִּים
  choice: बहुतों पर शासक बनाएगा
  rationale: משל का हिफ़ील रूप ‘शासन करवाना/शासक बनाना’ है और בָּרַבִּים का स्वाभाविक अर्थ ‘बहुतों पर’ है।
- source_word: וַאֲדָמָה יְחַלֵּק בִּמְחִיר
  choice: दाम लेकर भूमि बाँटेगा
  rationale: אֲדָמָה भूमि, חלק बाँटना या भाग देना, और מְחִיר दाम या मूल्य है। यह अनुवाद लेन-देन का भाव रखता है, पर यह तय नहीं करता कि दाम धन, रिश्वत या राजनीतिक प्रतिफल था।
theological_decisions:
- issue: मान्यता पाने वाले व्यक्तियों का संदर्भ
  choice: राजा कुछ व्यक्तियों को मान्यता देकर उन्हें सम्मान और शासनाधिकार देता है।
  alternative: वे लोग जो राजा अथवा पराए देवता को मानते हैं, पुरस्कृत किए जाते हैं।
  rationale: हिब्रू क्रियारूप में स्वाभाविक रूप से राजा ही ‘मान्यता देने’ वाला कर्ता है। इससे पराए देवता के उपासकों के विषय में कोई अनावश्यक विशिष्ट धार्मिक दावा नहीं जोड़ा जाता।
- issue: पराए देवता की भूमिका
  choice: ‘के साथ’ रखकर संगति और साधन—दोनों अर्थ खुले रखे गए हैं।
  alternative: ‘पराए देवता के द्वारा’, जिसमें देवता को स्पष्ट रूप से साधन माना जाता है।
  rationale: עִם सामान्यतः ‘साथ’ व्यक्त करता है, पर यहाँ साधनात्मक अर्थ भी संभव है; मुख्य पाठ में किसी एक को निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पराया देवता’, ‘दृढ़ किले’, ‘मान्यता देगा’ और ‘दाम लेकर’ मूल के धार्मिक-सैन्य तथा राजनीतिक-लेनदेन संबंधी भाव को बिना अनावश्यक व्याख्या के व्यक्त करते हैं। सभी वैध अस्पष्टताओं को पादटिप्पणियों में रखा गया है।
