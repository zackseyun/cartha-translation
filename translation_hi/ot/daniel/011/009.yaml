  yaml_path: translation/ot/daniel/011/009.yaml
  text: Then he will come into the realm of the king of the South[a], but he will return to his own land.
translation:
  language: hi
  text: तब वह दक्षिण के राजा के राज्य में आएगा[a], परन्तु वह अपने देश लौट जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह दक्षिण के राजा के राज्य में आएगा और अपने देश लौट जाएगा।”
    reason: मूल के दोनों वाव को ‘और’ के रूप में अधिक प्रत्यक्ष ढंग से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וּבָא
  choice: तब वह…आएगा
  rationale: भविष्यवाणी के क्रम में वाव + क़ातल अगली घटना को व्यक्त करता है। ‘तब’ पिछले प्रसंग से क्रम को स्वाभाविक हिन्दी में दिखाता है, जबकि ‘आएगा’ मूल क्रिया בוא के सामान्य अर्थ को बनाए रखता है।
- source_word: בְּמַלְכוּת
  choice: राज्य में
  rationale: מַלְכוּת यहाँ राजा के राजनीतिक-भौगोलिक अधिकार-क्षेत्र को सूचित करता है। गति-सूचक ‘आएगा’ के साथ हिन्दी का ‘में’ गन्तव्य की दिशा भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: दक्षिण के राजा
  rationale: दानिय्येल 11 में यह दक्षिणी सत्ता के शासक की प्रासंगिक भू-राजनीतिक उपाधि है; यहाँ הַנֶּגֶב को स्थानीय नाम ‘नेगेव’ के बजाय ‘दक्षिण’ कहना अधिक उपयुक्त है।
- source_word: וְשָׁב
  choice: परन्तु वह…लौट जाएगा
  rationale: वाव का मूल संयोजक अर्थ ‘और’ है, किन्तु यहाँ चढ़ाई के बाद वापसी घटनाक्रम में विरोध अथवा अप्रत्याशित मोड़ लाती है। ‘परन्तु’ इस प्रवचनगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל אַדְמָתוֹ
  choice: अपने देश
  rationale: אֲדָמָה का मूल अर्थ भूमि है, पर इस राजनीतिक-सैन्य प्रसंग में ‘देश’ सहज है। तीसरे पुरुष प्रत्यय को हिन्दी में कर्ता-सापेक्ष ‘अपने’ से ठीक प्रकार व्यक्त किया गया है।
