base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/017.yaml
  text: He will set his face to come with the strength of his whole kingdom[a], and upright terms will be with him; and he will act. He will give him the daughter of women to destroy it, but she will not stand[d][c][b], and she will not be for him.
translation:
  language: hi
  text: वह अपने पूरे राज्य की शक्ति के साथ आने का निश्चय करेगा, और उसके साथ न्यायसंगत शर्तें होंगी[a]; और वह कार्य करेगा। वह उसे स्त्रियों की बेटी[b] उसका नाश करने के लिए देगा[c]; पर वह नहीं टिकेगी[d], और न वह उसकी होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और खरे लोग उसके साथ होंगे,” अथवा “और उसके साथ एक समझौता होगा।” इस प्रसंग में इब्रानी पदबंध का अर्थ कठिन है; वह उसके साथ आए लोगों या न्यायसंगत शर्तों/व्यवस्था की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से “स्त्रियों की बेटी”; सम्भवतः विवाह में दी जाने वाली राजकुमारी। बहुत-से लोग इसे राजनीतिक विवाह-संधि का संकेत समझते हैं।
    reason: cultural_note
  - marker: c
    text: “नाश करने” के इब्रानी क्रियारूप में स्त्रीलिंग एकवचन प्रत्यय है। इसका संबंध उस स्त्री से—“उसका नाश करने के लिए”—या किसी स्त्रीलिंग राज्य, योजना अथवा व्यवस्था से हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: या, “पर वह योजना कायम नहीं रहेगी,” अथवा “पर वह सफल नहीं होगी।” स्त्रीलिंग क्रिया का संबंध स्त्री से या योजना से हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשֵׂם פָּנָיו
  choice: आने का निश्चय करेगा
  rationale: शाब्दिक चित्र ‘अपना मुख लगाएगा’ दृढ़ संकल्प और लक्ष्य की ओर मुड़ने को व्यक्त करता है। आधुनिक हिन्दी में ‘निश्चय करेगा’ वही भाव स्वाभाविक रूप से देता है।
- source_word: לָבוֹא
  choice: आने
  rationale: בוא का सामान्य अर्थ ‘आना’ है। सैन्य प्रसंग होने पर भी ‘आक्रमण करना’ पाठ से अधिक विशिष्ट होता।
- source_word: בְּתֹקֶף כָּל מַלְכוּתוֹ
  choice: अपने पूरे राज्य की शक्ति के साथ
  rationale: תֹקֶף शक्ति या सामर्थ्य को और כָּל מַלְכוּתוֹ उसके समूचे राज्य को दर्शाता है; यह रूप मूल संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: וִישָׁרִים עִמּוֹ
  choice: और उसके साथ न्यायसंगत शर्तें होंगी
  rationale: संदर्भ में बहुवचन יְשָׁרִים संभवतः निष्पक्ष या उचित शर्तों/व्यवस्था को सूचित करता है। शब्दशः ‘सीधे/खरे लोग’ भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְעָשָׂה
  choice: फिर वह अपना काम करेगा
  rationale: עשה व्यापक क्रिया है। यह अनुवाद कार्य को अनावश्यक रूप से निश्चित किए बिना हिन्दी में वाक्य को पूरा करता है।
- source_word: וּבַת הַנָּשִׁים
  choice: स्त्रियों की बेटी
  rationale: दुर्लभ इब्रानी पदबंध को मुख्य पाठ में निकटता से सुरक्षित रखा गया है; प्रसंगगत राजकुमारी और विवाह-संधि की सम्भावना पादटिप्पणी में स्पष्ट है।
- source_word: לְהַשְׁחִיתָהּ
  choice: ताकि उसका नाश करे
  rationale: स्त्रीलिंग एकवचन प्रत्यय स्त्री की ओर संकेत कर सकता है, किंतु किसी स्त्रीलिंग राज्य, योजना या व्यवस्था की ओर भी। हिन्दी ‘उसका’ संदर्भ को खुला रखता है।
- source_word: וְלֹא תַעֲמֹד
  choice: पर वह नहीं टिकेगी
  rationale: स्त्रीलिंग क्रिया का सतही संदर्भ बेटी है। ‘टिकेगी’ עמד के मूल ‘खड़े रहने/कायम रहने’ के भाव को रखता है और असफलता का अर्थ भी सम्भव रहने देता है।
- source_word: וְלֹא לוֹ תִהְיֶה
  choice: और न वह उसकी होगी
  rationale: यह संक्षिप्त रूप स्वामित्व, वैवाहिक संबंध और राजनीतिक निष्ठा के बीच मूल की अस्पष्टता को बनाए रखता है।
