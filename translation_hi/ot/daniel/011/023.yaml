  text: וּ/מִן הִֽתְחַבְּר֥וּת אֵלָ֖י/ו יַעֲשֶׂ֣ה מִרְמָ֑ה וְ/עָלָ֥ה וְ/עָצַ֖ם בִּ/מְעַט גּֽוֹי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/023.yaml
  text: And from the time of an alliance with him[a], he will act deceitfully; and he will rise and become strong with a small nation.
translation:
  language: hi
  text: और उसके साथ संधि होने के बाद से वह छल से काम करेगा; वह ऊपर उठेगा और एक छोटे राष्ट्र के सहारे[a] शक्तिशाली हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “थोड़े-से लोगों के सहारे।” इब्रानी पदबंध בִּמְעַט גּוֹי संक्षिप्त है और इसका बल या तो एक छोटे राष्ट्र पर या उन थोड़े-से लोगों पर हो सकता है जिनके सहारे वह शक्तिशाली होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הִתְחַבְּרוּת אֵלָיו
  choice: और उसके साथ संधि होने के बाद से
  rationale: यह पदबंध पिछले कथन से क्रमिक संबंध बनाए रखता है। הִתְחַבְּרוּת राजनीतिक संदर्भ में जुड़ने या संधि करने को सूचित करता है, और אֵלָיו का संबंधपरक अर्थ स्वाभाविक हिन्दी में ‘उसके साथ’ है।
- source_word: יַעֲשֶׂה מִרְמָה
  choice: वह छल से काम करेगा
  rationale: शाब्दिक ‘छल करेगा’ की अपेक्षा यह हिन्दी में स्वाभाविक है और जानबूझकर कपटपूर्ण आचरण करने का अर्थ सुरक्षित रखता है।
- source_word: וְעָלָה
  choice: वह ऊपर उठेगा
  rationale: עלה के मूल ‘ऊपर चढ़ने/उठने’ के भाव को रखते हुए यहाँ राजनीतिक उत्कर्ष का संकेत मिलता है, पर अनुवाद उस अर्थ को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: וְעָצַם
  choice: शक्तिशाली हो जाएगा
  rationale: क्रिया बलवान या प्रबल होने को व्यक्त करती है; ‘हो जाएगा’ उसके क्रमशः शक्ति प्राप्त करने के भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: בִּמְעַט גּוֹי
  choice: एक छोटे राष्ट्र के सहारे
  rationale: גּוֹי का राजनीतिक अर्थ ‘राष्ट्र’ यहाँ उपयुक्त है और בִּ का साधन/सहारे का भाव उसके सीमित आधार से शक्तिशाली होने को दर्शाता है। फिर भी इब्रानी पदबंध संख्या की दृष्टि से ‘थोड़े-से लोगों’ का अर्थ भी दे सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
