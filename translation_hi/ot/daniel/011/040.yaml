base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/040.yaml
  text: At the time of the end[a], the king of the South will clash with him, and the king of the North will storm against him with chariots, horsemen, and many ships[d][c][b]; he will enter into the lands and sweep through and pass on.
translation:
  language: hi
  text: अंत के समय दक्षिण का राजा उससे[d] भिड़ेगा,[a] और उत्तर का राजा रथों, घुड़सवारों और बहुत-से जहाज़ों के साथ उस पर[d] टूट पड़ेगा।[b] वह देशों[c] में प्रवेश करेगा और उमड़ता हुआ आगे बढ़ जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर सींग मारेगा” या “उससे टकराएगा।” इब्रानी क्रिया का शाब्दिक बिम्ब सींग मारने का है; यहाँ वह शत्रुतापूर्ण टकराव को व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर तूफ़ानी वेग से चढ़ आएगा।” इब्रानी क्रिया प्रचण्ड, तूफ़ानी ढंग से उमड़ने या आक्रमण करने का बिम्ब देती है।
    reason: lexical_alternative
  - marker: c
    text: या, “प्रदेशों।” इब्रानी बहुवचन का अर्थ अनेक देश या क्षेत्र हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘उससे/उस पर’ में आए सर्वनाम का सटीक संदर्भ इब्रानी पाठ में स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְעֵת קֵץ
  choice: अन्त के समय
  rationale: यह स्वाभाविक हिन्दी में उस निर्णायक या नियत अन्तकालीन अवधि को व्यक्त करता है, पर उसकी सटीक काल-सीमा निर्धारित नहीं करता।
- source_word: יִתְנַגַּח עִמּוֹ
  choice: उससे भिड़ेगा
  rationale: נגח के सींग मारने या टकराने के मूल बिम्ब से निकले शत्रुतापूर्ण संघर्ष को ‘भिड़ेगा’ संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है; सर्वनाम को अनिर्दिष्ट रखा गया है।
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: दक्षिण का राजा
  rationale: दानिय्येल 11 में प्रयुक्त भूराजनीतिक उपाधि का स्पष्ट और सुसंगत अनुवाद।
- source_word: וְיִשְׂתָּעֵר עָלָיו
  choice: उस पर आँधी की तरह टूट पड़ेगा
  rationale: यह क्रिया हिंसक, तूफ़ानी वेग से आक्रमण का बिम्ब रखती है; हिन्दी मुहावरा उस तीव्रता को स्पष्ट करता है।
- source_word: מֶלֶךְ הַצָּפוֹן
  choice: उत्तर का राजा
  rationale: आवर्ती भूराजनीतिक उपाधि का स्वाभाविक हिन्दी रूप।
- source_word: בְּרֶכֶב וּבְפָרָשִׁים וּבָאֳנִיּוֹת רַבּוֹת
  choice: रथों, घुड़सवारों और बहुत-से जहाज़ों के साथ
  rationale: सैन्य साधनों की सूची और उन पर लागू बְּ संबंध को स्पष्ट, प्रवाहपूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: וּבָא בָאֲרָצוֹת
  choice: वह देशों में घुस आएगा
  rationale: בוא का प्रवेशार्थ और बहुवचन אֲרָצוֹת का व्यापक ‘देशों/प्रदेशों’ अर्थ सुरक्षित है; युद्ध-संदर्भ में ‘घुस आएगा’ स्वाभाविक है।
- source_word: וְשָׁטַף וְעָבָר
  choice: बाढ़ की तरह उमड़ता हुआ आगे निकल जाएगा
  rationale: שׁטף के बाढ़ या उमड़ते प्रवाह के रूपक और עבר के आगे बढ़कर पार निकलने के क्रम, दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उससे/उस पर’ सर्वनाम का सन्दर्भ
  choice: व्यक्ति की पहचान बताए बिना सर्वनाम को बनाए रखना
  alternative: इसे पिछले प्रसंग के राजा, किसी अन्तकालीन शासक, अथवा किसी विशिष्ट ऐतिहासिक व्यक्ति के रूप में स्पष्ट करना
  rationale: इब्रानी पद में केवल सर्वनाम है और उसका पूर्वपद यहाँ दोहराया नहीं गया। किसी विशिष्ट व्याख्यात्मक या अन्तकाल-विषयक पद्धति को आरोपित न करने के लिए अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सुबोध रूप। सैन्य गति की तीव्रता तथा बाढ़ के रूपक को बनाए रखा गया है; अनिर्दिष्ट सर्वनाम को व्याख्या द्वारा नहीं भरा गया।
