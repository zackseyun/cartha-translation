source:
  edition: WLC
  text: וּ/בָ֨אוּ ב֜/וֹ צִיִּ֤ים כִּתִּים֙ וְ/נִכְאָ֔ה וְ/שָׁ֛ב וְ/זָעַ֥ם עַל בְּרִֽית ק֖וֹדֶשׁ וְ/עָשָׂ֑ה וְ/שָׁ֣ב וְ/יָבֵ֔ן עַל עֹזְבֵ֖י בְּרִ֥ית קֹֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/030.yaml
  text: For ships of Kittim will come against him[a], and he will be disheartened. Then he will turn back and rage against the holy covenant, and he will act[b]. He will turn back and pay attention to those who forsake the holy covenant.
translation:
  language: hi
  text: क्योंकि कित्तीम के जहाज़ उसके विरुद्ध आएँगे[a], और वह हताश हो जाएगा। तब वह लौटकर पवित्र वाचा के विरुद्ध क्रोधित होगा और कार्रवाई करेगा। वह फिर लौटेगा और पवित्र वाचा को त्यागने वालों पर ध्यान देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कित्तीम से जहाज़’; ‘कित्तीम’ कुप्रुस अथवा अधिक व्यापक रूप से पश्चिम की समुद्री शक्तियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह पवित्र वाचा को त्यागने वालों का पक्ष करेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: צִיִּים כִּתִּים
  choice: कित्तीम के जहाज़
  rationale: צִיִּים यहाँ समुद्री जहाज़ों अथवा नौसैनिक शक्ति को दर्शाता है, और כִּתִּים का संकेत कित्तीम/कुप्रुस या व्यापक रूप से पश्चिमी समुद्री शक्तियों की ओर हो सकता है। पारंपरिक भौगोलिक नाम को बनाए रखा गया है।
- source_word: וְנִכְאָה
  choice: और वह हताश हो जाएगा
  rationale: क्रिया विरोध के कारण निरुत्साहित, भयभीत या अपमानित होने का भाव रखती है। ‘हताश’ सैन्य-राजनीतिक संदर्भ में स्वाभाविक है और शारीरिक विनाश का अर्थ नहीं जोड़ता।
- source_word: וְשָׁב
  choice: तब वह लौटकर / वह फिर लौटेगा
  rationale: שׁוּב असफलता के बाद वापस मुड़ने या लौटने को व्यक्त करता है। हिंदी में प्रसंगानुसार इन स्वाभाविक रूपों का प्रयोग किया गया है।
- source_word: וְזָעַם עַל
  choice: पर क्रोध उतारेगा
  rationale: यह पदबंध किसी के विरुद्ध प्रकट तीव्र रोष को व्यक्त करता है। ‘क्रोध उतारेगा’ लक्ष्य के विरुद्ध सक्रिय शत्रुता को स्वाभाविक हिंदी में बताता है।
- source_word: בְּרִית קֹדֶשׁ / בְּרִית קוֹדֶשׁ
  choice: पवित्र वाचा
  rationale: यह मूल पदबंध का सीधा और स्थापित अनुवाद है तथा वाचा की पहचान को पाठ से अधिक संकीर्ण नहीं करता।
- source_word: וְעָשָׂה
  choice: और कार्रवाई करेगा
  rationale: क्रिया व्यापक रूप से ‘करना/काम करना’ बताती है। यहाँ कोई कर्म उल्लिखित नहीं है; इसलिए अनुवाद उसकी संक्षिप्तता और अनिर्दिष्टता बनाए रखता है।
- source_word: וְיָבֵן עַל
  choice: पर ध्यान देगा
  rationale: בין का यह प्रयोग किसी पर विचार करने, उसकी ओर ध्यान देने या उसका पक्ष लेने तक का भाव रख सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है।
- source_word: עֹזְבֵי
  choice: त्यागनेवालों
  rationale: कृदंत उन लोगों को दर्शाता है जो वाचा छोड़ देते हैं। यह अनुवाद किसी बाद की तकनीकी धार्मिक संज्ञा को आरोपित नहीं करता।
theological_decisions:
- issue: ‘पवित्र वाचा’ का संदर्भ
  choice: पदबंध को बिना अतिरिक्त पहचान दिए ‘पवित्र वाचा’ रखा गया है।
  alternative: ‘इस्राएल के साथ परमेश्वर की वाचा’ या ‘यहूदी वाचा’
  rationale: संदर्भ पवित्र प्रजा और उपासना से जुड़ी वाचा की ओर संकेत करता है, पर इब्रानी पाठ स्वयं यहाँ इससे अधिक स्पष्ट पहचान नहीं देता।
- issue: וְעָשָׂה और וְיָבֵן עַל का परस्पर संबंध
  choice: 'दोनों को अलग क्रमिक कथनों के रूप में अनूदित किया गया है: ‘कार्रवाई करेगा’ और फिर ‘ध्यान देगा।’'
  alternative: וְעָשָׂה को अगले कथन के साथ जोड़कर यह अर्थ देना कि वह वाचा त्यागनेवालों पर कृपा या उनका पक्ष करेगा।
  rationale: इब्रानी वाक्यरचना संक्षिप्त है और व्याख्यात्मक संबंध पूरी तरह स्पष्ट नहीं करती। मुख्य पाठ क्रियाओं को अलग रखकर अस्पष्टता बचाता है; वैकल्पिक संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। ‘वाचा’ बाइबिलीय संदर्भ में प्रचलित तथा मूल के निकट है। वाक्य की भविष्यसूचक लय, दो बार लौटने का क्रम, और मूल पाठ की संक्षिप्त अस्पष्टता सुरक्षित रखी गई है।
