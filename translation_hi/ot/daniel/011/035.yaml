source:
  edition: WLC
  text: וּ/מִן הַ/מַּשְׂכִּילִ֣ים יִכָּֽשְׁל֗וּ לִ/צְר֥וֹף בָּ/הֶ֛ם וּ/לְ/בָרֵ֥ר וְ/לַ/לְבֵּ֖ן עַד עֵ֣ת קֵ֑ץ כִּי ע֖וֹד לַ/מּוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/035.yaml
  text: And some of those who have insight will stumble[a], so that they may be refined among them, purified, and made white, until the time of the end[d][c][b]; for it is still for the appointed time.
translation:
  language: hi
  text: और समझ रखनेवालों में से कुछ ठोकर खाएँगे[a], ताकि उनके बीच[b] उन्हें परिष्कृत किया जाए, शुद्ध किया जाए और उजला बनाया जाए[c], अंत के समय तक; क्योंकि नियत समय अभी बाकी है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिर पड़ेंगे।’ इब्रानी क्रिया में ठोकर खाने की छवि है और यहाँ इसका संकेत सताव या परीक्षा के कारण होनेवाले पतन की ओर हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके बीच’ का अनुवाद ‘उनके द्वारा’ या ‘उनके माध्यम से’ भी हो सकता है। इब्रानी वाक्यांश संक्षिप्त है और यह बता सकता है कि शोधन इस समूह के भीतर होता है या उनके साथ घटनेवाली बातों के माध्यम से।
    reason: lexical_alternative
  - marker: c
    text: ‘उजला बनाया जाए’ इब्रानी की शाब्दिक छवि है, जो शुद्ध किए जाने को व्यक्त करती है।
    reason: lexical_alternative
  - marker: d
    text: या ‘क्योंकि नियत समय अभी आनेवाला है।’
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִן הַמַּשְׂכִּילִים
  choice: और समझ रखनेवालों में से कुछ
  rationale: מִן का प्रयोग अंशसूचक है, इसलिए ‘में से कुछ’; participle הַמַּשְׂכִּילִים विवेक और समझ रखनेवाले लोगों को दर्शाता है।
- source_word: יִכָּשְׁלוּ
  choice: ठोकर खाएँगे
  rationale: यह כשל की ठोकर खाने की मूल छवि बनाए रखता है और नैतिक चूक, उत्पीड़न में पतन या मृत्यु में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לִצְרוֹף בָּהֶם
  choice: ताकि उनके बीच उन्हें परखा जाए
  rationale: צרף धातु-शोधन की छवि रखता है; हिन्दी में ‘परखा’ उस अग्नि-परीक्षा और शोधन को स्वाभाविक ढंग से व्यक्त करता है। בָּהֶם को कठिन और संक्षिप्त वाक्यांश मानते हुए ‘उनके बीच’ रखा गया है।
- source_word: וּלְבָרֵר
  choice: शुद्ध किया जाए
  rationale: ברר यहाँ छाँटकर मैल दूर करने अथवा शुद्ध करने का भाव देता है और शोधन-क्रम के समानांतर है।
- source_word: וְלַלְבֵּן
  choice: उजला बनाया जाए
  rationale: Hiphil रूप का शाब्दिक चित्र ‘सफेद/उजला बनाना’ है; ‘उजला’ आधुनिक हिन्दी में इस ठोस रूपक को बनाए रखता है।
- source_word: עַד עֵת קֵץ
  choice: अन्त के समय तक
  rationale: यह दानिय्येल में प्रयुक्त मानक कालसूचक अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: כִּי עוֹד לַמּוֹעֵד
  choice: क्योंकि नियत समय अभी बाकी है
  rationale: מוֹעֵד को ‘नियत समय’ कहा गया है; इब्रानी के संक्षिप्त वाक्य को सहज हिन्दी में रखते हुए यह भाव बचाया गया है कि वह निर्धारित समय अभी भविष्य में है।
theological_decisions:
- issue: समझ रखनेवालों के कष्ट का प्रयोजन या परिणाम
  choice: ठोकर खाने को उनके परखे और शुद्ध किए जाने की दिशा में प्रयोजन/परिणाम के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल भविष्यवाणी मानना, जिसमें शोधन का कोई प्रयोजन न हो।
  rationale: יִכָּשְׁלוּ के बाद आनेवाली לְ-युक्त infinitive-श्रृंखला स्वाभाविक रूप से प्रयोजन या परिणाम व्यक्त करती है; अनुवाद इससे आगे कष्ट का कोई व्यापक सिद्धान्त आरोपित नहीं करता।
- issue: בָּהֶם का सम्बन्ध
  choice: ‘उनके बीच’—शोधन इसी समुदाय के भीतर घटित होता है।
  alternative: ‘उनके द्वारा’ या ‘उनके कारण’—घटनाओं अथवा व्यक्तियों को शोधन का साधन मानना।
  rationale: इब्रानी वाक्यांश व्याकरण की दृष्टि से संक्षिप्त और बहुअर्थी है। मुख्य पाठ एक सम्भव स्थानगत अर्थ देता है, और पादटिप्पणी अन्य वास्तविक सम्भावनाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘ठोकर खाना’, ‘परखा जाना’ और ‘उजला बनाया जाना’ जैसी मूल इब्रानी छवियाँ सुरक्षित रखी गई हैं। मुख्य पाठ की पठनीयता बनाए रखते हुए בָּהֶם और अन्तिम संक्षिप्त काल-वाक्य की वास्तविक अस्पष्टता पादटिप्पणियों में दी गई है।
