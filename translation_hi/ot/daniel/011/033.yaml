  text: וּ/מַשְׂכִּ֣ילֵי עָ֔ם יָבִ֖ינוּ לָֽ/רַבִּ֑ים וְ/נִכְשְׁל֞וּ בְּ/חֶ֧רֶב וּ/בְ/לֶהָבָ֛ה בִּ/שְׁבִ֥י וּ/בְ/בִזָּ֖ה יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/033.yaml
  text: And those among the people who have insight will give understanding to the many[a], but they will stumble by sword and by flame, by captivity and by plunder[d][c][b], for days.
translation:
  language: hi
  text: और प्रजा के विवेकी लोग[a] बहुतों को समझाएँगे[b]; लेकिन वे तलवार और ज्वाला से, बंदी बनाए जाने और लूटे जाने से, दिनों तक ठोकर खाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रजा में जो समझ-बूझ रखते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या, “बहुतों को समझ देंगे” अथवा “बहुतों को समझने योग्य बनाएँगे।”
    reason: lexical_alternative
  - marker: c
    text: या, “गिर पड़ेंगे।” इब्रानी रूपक उत्पीड़न में पतन, पराजय या मृत्यु को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּילֵי עָם
  choice: प्रजा में जो समझ-बूझ रखते हैं
  rationale: यह अभिव्यक्ति विवेक और अंतर्दृष्टि रखनेवाले लोगों को दर्शाती है। ‘समझ-बूझ’ आधुनिक हिन्दी में सहज है और केवल सामान्य ‘बुद्धिमान’ कहने की अपेक्षा इब्रानी सहभागी रूप की विशिष्टता बचाती है। עָם को बिना अतिरिक्त जातीय पहचान जोड़े ‘प्रजा’ रखा गया है।
- source_word: יָבִינוּ לָרַבִּים
  choice: वे बहुतों को समझ प्रदान करेंगे
  rationale: यहाँ हिफ़ील रूप दूसरों को समझ देने या समझाने का कारणवाचक भाव रखता है। ‘बहुतों’ से לָרַבִּים का समूहवाचक और अनिश्चित विस्तार बना रहता है।
- source_word: וְנִכְשְׁלוּ
  choice: लेकिन वे ... ठोकर खाएँगे
  rationale: ‘ठोकर खाना’ इब्रानी रूपक को बनाए रखता है और उसे केवल मृत्यु तक सीमित नहीं करता; प्रसंग में इसमें पराजय, पतन या उत्पीड़न के अधीन होना सम्मिलित हो सकता है।
- source_word: בְּחֶרֶב וּבְלֶהָבָה
  choice: तलवार और ज्वाला से
  rationale: दोनों साधनवाचक पदों की समानांतर रचना रखी गई है। לֶהָבָה के विशिष्ट अर्थ ‘ज्वाला’ को व्यापक ‘आग’ में नहीं बदला गया।
- source_word: בִּשְׁבִי וּבְבִזָּה
  choice: बंदी बनाए जाने और लूटे जाने से
  rationale: हिन्दी में स्वाभाविक निष्क्रिय रचना द्वारा दोनों प्रकार की पीड़ा व्यक्त होती है। ‘बंदी बनाए जाने’ में captivity की दशा और उसमें ले जाए जाने—दोनों का भाव संभव रहता है।
- source_word: יָמִים
  choice: दिनों तक
  rationale: नंगे बहुवचन का अनिश्चित कालावधि-सूचक प्रयोग यथासंभव सीधे रखा गया है; ‘कुछ दिनों’ या ‘बहुत दिनों’ जैसी संख्या-संबंधी व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: क्या נִכְשְׁלוּ को निश्चित मृत्यु या पूर्ण विनाश के रूप में प्रस्तुत किया जाए
  choice: ठोकर खाएँगे
  alternative: गिर पड़ेंगे; परास्त किए जाएँगे
  rationale: इब्रानी रूपक उत्पीड़न में मृत्यु, पतन, पराजय या अस्थायी आघात—कई संभावनाएँ खुली रखता है। ‘ठोकर खाएँगे’ इस तनाव को समय से पहले हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। समानांतर विपत्तियों की सूची तथा इब्रानी रूपक को सुरक्षित रखा गया है। ‘दिनों तक’ कुछ असामान्य सुन सकता है, पर यह मूल के अनिश्चित बहुवचन को बिना व्याख्यात्मक संख्या जोड़े दर्शाता है।
