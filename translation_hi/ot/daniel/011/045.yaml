source:
  edition: WLC
  text: וְ/יִטַּע֙ אָהֳלֶ֣י אַפַּדְנ֔/וֹ בֵּ֥ין יַמִּ֖ים לְ/הַר צְבִי קֹ֑דֶשׁ וּ/בָא֙ עַד קִצּ֔/וֹ וְ/אֵ֥ין עוֹזֵ֖ר לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/045.yaml
  text: He will pitch the tents of his royal pavilion between the seas and the beautiful holy mountain[a]; yet he will come to his end[b], and there will be no one to help him.
translation:
  language: hi
  text: वह समुद्रों और सुंदर पवित्र पर्वत[b] के बीच अपने राजकीय मंडप[a] के तंबू गाड़ेगा; फिर भी उसका अंत आ जाएगा, और उसकी सहायता करने वाला कोई न होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका महल,’ ‘उसका महलनुमा तंबू,’ अथवा ‘उसका मंडप।’ यह दुर्लभ शब्द संभवतः किसी राजकीय निवास या शाही मंडप को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वैभवशाली पवित्र पर्वत।’ हिब्रू अभिव्यक्ति पवित्र पर्वत की सुंदरता या महिमा का बोध करा सकती है और संभवतः सिय्योन/यरूशलेम की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִטַּע
  choice: गाड़ेगा
  rationale: נטע का मूल अर्थ ‘रोपना’ है, पर तंबुओं के साथ इसका मुहावरेदार अर्थ उन्हें खड़ा करना या गाड़ना है। ‘तंबू गाड़ना’ स्वाभाविक हिन्दी प्रयोग है और मूल बिंब को भी बनाए रखता है।
- source_word: אָהֳלֵי
  choice: के तंबू
  rationale: मूल में बहुवचन संबंध-रूप है। बहुवचन राजकीय पड़ाव या मंडप-समूह का संकेत दे सकता है, इसलिए इसे बनाए रखा गया है।
- source_word: אַפַּדְנוֹ
  choice: अपने राजकीय मंडप
  rationale: यह दुर्लभ शब्द संभवतः महल, राजकीय निवास या शाही मंडप को दर्शाता है। तंबुओं के संदर्भ में ‘राजकीय मंडप’ अस्थायी शाही पड़ाव का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּין יַמִּים
  choice: समुद्रों ... के बीच
  rationale: हिब्रू में ‘समुद्र’ बहुवचन है। हिन्दी में ‘समुद्रों ... के बीच’ भौगोलिक अभिव्यक्ति और मूल बहुवचन दोनों को सुरक्षित रखता है।
- source_word: לְהַר צְבִי קֹדֶשׁ
  choice: पवित्र शोभायमान पर्वत
  rationale: צְבִי यहाँ शोभा, सुंदरता या वैभव का बोध करा सकता है। ‘पवित्र शोभायमान पर्वत’ मूल की अर्थगत खुलावट बनाए रखता है और इसे स्पष्टतः सिय्योन या यरूशलेम कहकर व्याख्या नहीं जोड़ता।
- source_word: וּבָא עַד קִצּוֹ
  choice: फिर भी उसका अंत आ जाएगा
  rationale: शाब्दिक भाव ‘अपने अंत तक पहुँचना’ है। स्वाभाविक हिन्दी में ‘उसका अंत आ जाएगा’ वही परिणाम व्यक्त करता है; ‘फिर भी’ संदर्भ में उसकी शक्ति और उसके अनिवार्य अंत के बीच विरोध को सामने लाता है।
- source_word: וְאֵין עוֹזֵר לוֹ
  choice: और उसकी सहायता करने वाला कोई न होगा
  rationale: עֹזֵר का अर्थ सहायता करने वाला या सहायक है। यह रूप उसकी पूर्ण असहायता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दानिय्येल 11:45 में राजा की पहचान
  choice: कर्ता को केवल ‘वह’ के रूप में निहित रखा गया है और पाठ में उसकी पहचान नहीं बताई गई।
  alternative: उसे अन्तियोकस चतुर्थ एपिफेनेस, अंत-समय का मसीह-विरोधी, अथवा एक सम्मिश्र/प्रतिरूपात्मक शासक मानना।
  rationale: हिब्रू पाठ केवल तीसरे पुरुष के क्रियारूपों और प्रत्ययों का प्रयोग करता है। इस व्यक्ति की पहचान विवादित होने के कारण अनुवाद कोई विशिष्ट व्याख्या आरोपित नहीं करता।
- issue: पवित्र पर्वत का विशिष्ट भौगोलिक नाम
  choice: मूल वर्णन ‘पवित्र शोभायमान पर्वत’ रखा गया है।
  alternative: इसे सीधे ‘सिय्योन’ या ‘यरूशलेम’ कहना।
  rationale: वाक्यांश संभवतः सिय्योन/यरूशलेम की ओर संकेत करता है, पर मूल पाठ यहाँ वह नाम नहीं देता; इसलिए संकेत को बनाए रखते हुए पहचान को मुख्य पाठ में स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘राजकीय मंडप के तंबू’ मूल के दुर्लभ पद और बहुवचन ‘तंबू’ दोनों को सुरक्षित रखता है। फुटनोट चिह्न संबंधित शब्दों के तुरंत बाद लगाए गए हैं।
