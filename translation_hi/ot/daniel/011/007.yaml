  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और भविष्यसूचक शैली रखी गई है। वंशावली का वनस्पति-रूपक सुरक्षित रखा गया है और अस्पष्ट सर्वनाम को व्याख्यात्मक नाम से नहीं बदला गया।
