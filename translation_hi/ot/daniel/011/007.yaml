id: DAN.11.7
reference: Daniel 11:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָמַ֛ד מִ/נֵּ֥צֶר שָׁרָשֶׁ֖י/הָ כַּנּ֑/וֹ וְ/יָבֹ֣א אֶל הַ/חַ֗יִל וְ/יָבֹא֙ בְּ/מָעוֹז֙ מֶ֣לֶךְ הַ/צָּפ֔וֹן וְ/עָשָׂ֥ה בָ/הֶ֖ם וְ/הֶחֱזִֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/007.yaml
  text: And one from a branch of her roots shall arise in his place[a], and he shall come against the army and enter the fortress of the king of the north[d][c][b], and he shall act against them and prevail.
translation:
  language: hi
  text: और उसकी जड़ों की एक शाखा से कोई उसके स्थान पर उठ खड़ा होगा[a]। वह सेना के विरुद्ध आएगा और उत्तर के राजा के गढ़ में प्रवेश करेगा[b]। वह उनके विरुद्ध कार्रवाई करेगा[c] और प्रबल होगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी जड़ों से निकले एक अंकुर से,” अर्थात उसके वंश में से।
    reason: lexical_alternative
  - marker: b
    text: या “उत्तर के राजा के सुदृढ़ स्थान में प्रवेश करेगा।”
    reason: lexical_alternative
  - marker: c
    text: या “उनसे निपटेगा” अथवा “उनके बीच कार्य करेगा”; इब्रानी मुहावरे का अर्थ व्यापक है।
    reason: lexical_alternative
  - marker: d
    text: या “अपना बल दिखाएगा” अथवा “बढ़त पा लेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמַד
  choice: उठ खड़ा होगा
  rationale: उत्तराधिकार के भविष्यसूचक संदर्भ में यह क्रिया केवल शारीरिक रूप से खड़े होने के बजाय किसी उत्तराधिकारी के उभरने को व्यक्त करती है।
- source_word: מִנֵּצֶר שָׁרָשֶׁיהָ
  choice: उसकी जड़ों की एक शाखा से
  rationale: यह अनुवाद पौधे के अंकुर या शाखा का रूपक बनाए रखता है, जो यहाँ उसके वंश या परिवार से निकले व्यक्ति की ओर संकेत करता है।
- source_word: כַּנּוֹ
  choice: उसके स्थान पर
  rationale: यह प्रतिस्थापन या उत्तराधिकार का भाव रखता है और सर्वनाम के संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַחַיִל
  choice: सेना
  rationale: इस सैनिक संदर्भ में חַיִל धन या सामर्थ्य के बजाय सैन्य बल को सूचित करता है।
- source_word: בְּמָעוֹז מֶלֶךְ הַצָּפוֹן
  choice: उत्तर के राजा के गढ़ में
  rationale: מָעוֹז किसी दृढ़ और सुरक्षित स्थान को सूचित करता है; 'गढ़' स्वाभाविक और ठोस हिन्दी है। गति-सूचक क्रिया के साथ בְּ को यहाँ प्रवेश के अर्थ में लिया गया है।
- source_word: וְעָשָׂה בָהֶם
  choice: वह उनके विरुद्ध कार्रवाई करेगा
  rationale: इब्रानी मुहावरा व्यापक है। सैन्य प्रसंग में यह शत्रुतापूर्ण कार्य का संकेत देता है, पर उसके स्वरूप को अधिक निश्चित नहीं करता।
- source_word: וְהֶחֱזִיק
  choice: प्रबल होगा
  rationale: हिफ़ील रूप शक्ति दिखाने, बढ़त पाने या विजयी होने का भाव दे सकता है; 'प्रबल होगा' इस व्यापकता को संक्षिप्त और गरिमापूर्ण ढंग से रखता है।
theological_decisions: []
