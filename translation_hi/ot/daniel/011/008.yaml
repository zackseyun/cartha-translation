source:
  edition: WLC
  text: וְ/גַ֣ם אֱֽלֹהֵי/הֶ֡ם עִם נְסִֽכֵי/הֶם֩ עִם כְּלֵ֨י חֶמְדָּתָ֜/ם כֶּ֧סֶף וְ/זָהָ֛ב בַּ/שְּׁבִ֖י יָבִ֣א מִצְרָ֑יִם וְ/הוּא֙ שָׁנִ֣ים יַעֲמֹ֔ד מִ/מֶּ֖לֶךְ הַ/צָּפֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/008.yaml
  text: He will also carry off to Egypt their gods[a], with their cast images and with their precious vessels of silver and gold, as plunder; and for some years he will stand aloof from the king of the north.
translation:
  language: hi
  text: वह उनके देवताओं को भी, उनकी ढाली हुई मूर्तियों और चाँदी और सोने के उनके बहुमूल्य पात्रों समेत, लूट के रूप में मिस्र ले जाएगा; और वह कुछ वर्षों तक उत्तर के राजा से दूर रहेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उत्तर के राजा से कुछ वर्ष अधिक समय तक बना रहेगा”; अथवा, “वह वर्षों तक उत्तर के राजा से अधिक शक्तिशाली बना रहेगा।” इब्रानी वाक्यांश संक्षिप्त है और इसे अलग रहने के बजाय तुलनात्मक अर्थ में भी पढ़ा जा सकता है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह पिछले कथन में एक और कार्रवाई जोड़ता है और इब्रानी के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके देवताओं
  rationale: बहुवचन रूप पराजित लोगों के देवताओं को सीधे सूचित करता है; ‘मूर्तियों’ कहना यहाँ अनावश्यक रूप से अर्थ को संकीर्ण कर देता।
- source_word: נְסִכֵיהֶם
  choice: उनकी ढाली हुई मूर्तियों
  rationale: यह शब्द धातु ढालकर बनाई गई प्रतिमाओं को सूचित करता है; यह अनुवाद निर्माण-विधि और वस्तु, दोनों को स्पष्ट रखता है।
- source_word: כְּלֵי חֶמְדָּתָם
  choice: उनके बहुमूल्य पात्रों
  rationale: כְּלֵי का अर्थ पात्र, सामान या उपकरण हो सकता है; मंदिर अथवा राजकोषीय लूट के प्रसंग में ‘पात्र’ उपयुक्त है और חֶמְדָּתָם का मूल्यवान/मनभावना भाव ‘बहुमूल्य’ से व्यक्त होता है।
- source_word: כֶּסֶף וְזָהָב
  choice: चाँदी-सोने के
  rationale: यह सामग्री को बहुमूल्य पात्रों से स्वाभाविक हिन्दी में जोड़ता है और दोनों धातुओं को यथावत रखता है।
- source_word: בַּשְּׁבִי
  choice: लूट के रूप में
  rationale: यहाँ युद्ध में जब्त वस्तुओं को मिस्र ले जाने की बात है; वस्तुओं के लिए ‘बन्दी बनाकर’ की अपेक्षा ‘लूट के रूप में’ अधिक सटीक है।
- source_word: יָבִא מִצְרָיִם
  choice: मिस्र ले जाएगा
  rationale: בוא का हिफ़ील रूप ‘ले आना/ले जाना’ है; युद्ध-लूट के प्रसंग में यह हिन्दी प्रयोग जब्त वस्तुओं के परिवहन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁנִים
  choice: कुछ वर्षों तक
  rationale: बहुवचन ‘वर्षों’ यहाँ अनिश्चित अवधि बताता है; ‘कुछ’ कोई निश्चित संख्या जोड़े बिना हिन्दी में उस अनिश्चितता को स्पष्ट करता है।
- source_word: יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן
  choice: उत्तर के राजा से अलग रहेगा
  rationale: עמד के साथ מן को दूरी या अलगाव के अर्थ में लेकर यह अनुवाद इब्रानी क्रिया की स्थिति बनाए रखने वाली छवि को बचाता है और ‘आक्रमण नहीं करेगा’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: וְהוּא שָׁנִים יַעֲמֹד מִמֶּלֶךְ הַצָּפוֹן की व्याख्या
  choice: वह कुछ वर्षों तक उत्तर के राजा से अलग रहेगा
  alternative: वह उत्तर के राजा से कुछ वर्ष अधिक बना रहेगा; अथवा वह वर्षों तक उत्तर के राजा से अधिक शक्तिशाली बना रहेगा
  rationale: इब्रानी वाक्यांश संक्षिप्त है और מן को अलगावसूचक या तुलनात्मक माना जा सकता है। मुख्य पाठ עמד की ‘बने/खड़े रहने’ की छवि और מן के अलगावसूचक अर्थ को रखता है; अन्य सम्भव तुलनात्मक पाठों को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘देवता’, ‘ढाली हुई मूर्तियाँ’, ‘बहुमूल्य पात्र’ और ‘लूट’ सामान्य पाठक के लिए स्पष्ट हैं। अंतिम खंड की वास्तविक इब्रानी अस्पष्टता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
