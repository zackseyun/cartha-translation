source:
  edition: WLC
  text: וּ/שְׁנֵי/הֶ֤ם הַ/מְּלָכִים֙ לְבָבָ֣/ם לְ/מֵרָ֔ע וְ/עַל שֻׁלְחָ֥ן אֶחָ֖ד כָּזָ֣ב יְדַבֵּ֑רוּ וְ/לֹ֣א תִצְלָ֔ח כִּי ע֥וֹד קֵ֖ץ לַ/מּוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/027.yaml
  text: As for both of them[a], the kings—their hearts are set on evil, and at one table they will speak lies, but it will not succeed[c][b], for the end is still for the appointed time.
translation:
  language: hi
  text: जहाँ तक उन दोनों राजाओं की बात है, उनके मन बुराई पर तुले होंगे। वे एक ही मेज़ पर बैठकर झूठ बोलेंगे,[a] पर यह सफल नहीं होगा,[b] क्योंकि अंत होने में अभी नियत समय बाकी है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मिथ्या बातें कहेंगे’ अथवा ‘झूठी बातें कहेंगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘पर यह सफल न होगा।’ इब्रानी क्रिया स्त्रीलिंग एकवचन है और संभवतः उनकी योजना, बातचीत, या उसके परिणाम की ओर अनिर्दिष्ट रूप से संकेत करती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘क्योंकि अंत के लिए अभी भी नियत समय है।’ मूल शब्दावली इस बात पर बल देती है कि परिणाम एक निश्चित समय की प्रतीक्षा करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁנֵיהֶם הַמְּלָכִים
  choice: जहाँ तक उन दोनों राजाओं की बात है
  rationale: संयोजक, संख्या और सर्वनाम-प्रत्यय पहले से वर्णित दोनों शासकों को विषय के रूप में सामने लाते हैं। यह हिन्दी अभिव्यक्ति उस विषयात्मक बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לְבָבָם לְמֵרָע
  choice: उनके मन बुराई पर लगे होंगे
  rationale: इब्रानी मुहावरा दोनों राजाओं के दृढ़ बुरे इरादे को बताता है। ‘मन ... लगे होंगे’ सहज आधुनिक हिन्दी है और मूल के आशय को बिना विस्तार के रखता है।
- source_word: וְעַל שֻׁלְחָן אֶחָד
  choice: एक ही मेज़ पर बैठकर
  rationale: मूल में ‘एक मेज़ पर’ का दृश्य है। ‘बैठकर’ प्रसंग में स्वाभाविक रूप से निहित है और साझा राजनयिक अथवा भोज-संबंधी परिवेश को स्पष्ट करता है।
- source_word: כָּזָב יְדַבֵּרוּ
  choice: झूठ बोलेंगे
  rationale: כָּזָב झूठ, मिथ्या या छलपूर्ण कथन को दर्शाता है। ‘झूठ बोलेंगे’ संक्षिप्त, स्वाभाविक और सीधा अनुवाद है।
- source_word: וְלֹא תִצְלָח
  choice: पर यह सफल नहीं होगा
  rationale: क्रिया स्त्रीलिंग एकवचन है और यहाँ संभवतः निरपेक्ष रूप से उनकी बातचीत, योजना या उसके परिणाम की ओर संकेत करती है। ‘यह’ किसी एक अनकहे संदर्भ को निश्चित किए बिना मूल की अस्पष्टता बनाए रखता है।
- source_word: כִּי עוֹד קֵץ לַמּוֹעֵד
  choice: क्योंकि अंत अब भी ठहराए हुए समय पर ही होगा
  rationale: यह वाक्यांश बताता है कि अंत तत्कालीन षड्यंत्रों से नहीं, बल्कि पहले से निश्चित समय पर आएगा। ‘ठहराया हुआ समय’ מוֹעֵד के निश्चित या नियुक्त समय के अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ‘अंत ... ठहराए हुए समय पर’ में इतिहास पर परमेश्वर की प्रभुता का निहितार्थ
  choice: समय-संबंधी कथन को बनाए रखा गया है, पर परमेश्वर का नाम व्याख्यात्मक रूप से नहीं जोड़ा गया।
  alternative: ‘क्योंकि अंत परमेश्वर के ठहराए हुए समय पर ही होगा।’
  rationale: दानिय्येल के व्यापक संदर्भ में निश्चित समय परमेश्वर की प्रभुता की ओर संकेत करता है, लेकिन इस उपवाक्य में परमेश्वर का स्पष्ट उल्लेख नहीं है। इसलिए अनुवाद निहित धर्मवैज्ञानिक अर्थ को स्पष्ट कथन में नहीं बदलता।
- issue: ‘यह सफल नहीं होगा’ का अनिर्दिष्ट कर्ता
  choice: ‘यह’ के द्वारा योजना, झूठी बातचीत या परिणाम के बीच मूल की अस्पष्टता सुरक्षित रखी गई है।
  alternative: ‘पर उनकी योजना सफल नहीं होगी।’
  rationale: इब्रानी में ‘योजना’ जैसा स्पष्ट संज्ञा-पद नहीं है। उसे मुख्य पाठ में जोड़ना एक संभावित अर्थ को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘मेज़’, ‘झूठ बोलेंगे’ और ‘सफल’ प्रचलित शब्द हैं; ‘ठहराया हुआ समय’ दानिय्येल के भविष्यदर्शी संदर्भ की गंभीरता और निश्चित समय की धारणा को बनाए रखता है।
