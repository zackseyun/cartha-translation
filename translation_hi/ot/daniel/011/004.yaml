base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/004.yaml
  text: And as soon as he has arisen[a], his kingdom will be broken and divided toward the four winds of heaven, but not to his posterity, and not according to the dominion with which he ruled[b]; for his kingdom will be uprooted and given to others besides these.
translation:
  language: hi
  text: और जब वह उठ खड़ा होगा, तब उसका राज्य तोड़ दिया जाएगा और आकाश की चारों दिशाओं में बाँट दिया जाएगा[a]। पर वह न तो उसके वंशजों को मिलेगा[b], न उसका प्रभुत्व वैसा होगा जैसा उसका शासन था; क्योंकि उसका राज्य जड़ से उखाड़ दिया जाएगा और इनके सिवा दूसरे लोगों को दे दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आकाश की चार हवाओं की ओर।” यह चारों दिशाओं में बँट जाने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “उसके बाद आने वालों को” है; इस राजवंशीय संदर्भ में आशय उसके वंशजों या उत्तराधिकारियों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעָמְדוֹ
  choice: और जब वह उठ खड़ा होगा
  rationale: עמד का यह प्रयोग राजा के सत्ता में उभरने की ओर संकेत करता है। ‘उठ खड़ा होगा’ मूल बिंब को रखते हुए राजनीतिक उदय का भाव भी देता है; כְּ को सामान्य कालवाचक ‘जब’ से व्यक्त किया गया है, क्योंकि मूल में अपने आप ‘तुरंत’ का अर्थ निश्चित नहीं है।
- source_word: תִּשָּׁבֵר מַלְכוּתוֹ
  choice: तब उसका राज्य तोड़ दिया जाएगा
  rationale: נפעל रूप राज्य पर होने वाली कार्रवाई व्यक्त करता है। ‘तोड़ दिया जाएगा’ विभाजन की अगली बात से स्वाभाविक रूप से जुड़ता है।
- source_word: וְתֵחָץ לְאַרְבַּע רוּחוֹת הַשָּׁמָיִם
  choice: और आकाश की चारों दिशाओं में बाँट दिया जाएगा
  rationale: शाब्दिक ‘आकाश की चार हवाओं की ओर’ एक दिशासूचक मुहावरा है। हिन्दी में ‘चारों दिशाओं में’ उसका अर्थ स्पष्ट और स्वाभाविक रूप से देता है, जबकि ‘आकाश’ मूल अभिव्यक्ति की छवि बनाए रखता है।
- source_word: וְלֹא לְאַחֲרִיתוֹ
  choice: पर न तो उसके वंशजों को
  rationale: אַחֲרִית का मूल अर्थ ‘अंत/बाद का भाग’ है, पर राजवंशीय उत्तराधिकार के इस संदर्भ में उससे उसके बाद आने वाले वंशज अभिप्रेत हैं। पाद-टिप्पणी मूल की व्यापकता बताती है।
- source_word: וְלֹא כְמָשְׁלוֹ אֲשֶׁר מָשָׁל
  choice: और न उस प्रभुत्व के अनुसार, जिससे उसने शासन किया था
  rationale: מָשְׁל और מָשַׁל की सजातीय पुनरुक्ति को ‘प्रभुत्व’ और ‘शासन’ से यथासंभव बनाए रखा गया है। वाक्यांश यह बताता है कि बाद का बँटवारा उसके पूर्व शासन की शक्ति या परिमाण के अनुरूप नहीं होगा।
- source_word: תִנָּתֵשׁ מַלְכוּתוֹ
  choice: उसका राज्य जड़ से उखाड़ दिया जाएगा
  rationale: נתש स्थापित स्थान से उखाड़े या खींचे जाने का सशक्त रूपक है। ‘जड़ से उखाड़ दिया जाएगा’ हिन्दी में उस रूपक और पूर्ण निष्कासन दोनों को व्यक्त करता है।
- source_word: וְלַאֲחֵרִים מִלְּבַד אֵלֶּה
  choice: और इनके सिवा दूसरे लोगों को दे दिया जाएगा
  rationale: मूल में ‘दूसरों के लिए/को’ है; राज्य के हस्तांतरण के संदर्भ से ‘दे दिया जाएगा’ स्पष्ट रूप से निहित है। ‘इनके सिवा’ संकेतवाचक אֵלֶּה को बिना ऐतिहासिक पहचान जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: राजा और राज्य-विभाजन की ऐतिहासिक पहचान
  choice: मुख्य पाठ में किसी राजा, साम्राज्य या उत्तराधिकारी का नाम नहीं जोड़ा गया।
  alternative: राजा और चार भागों को विशिष्ट ऐतिहासिक व्यक्तियों या राज्यों से पहचानना।
  rationale: पद स्वयं केवल राजा के उदय, उसके राज्य के टूटने और दूसरों को दिए जाने का वर्णन करता है। ऐतिहासिक पहचान व्याख्या का विषय है और उसे अनुवाद में आरोपित नहीं करना चाहिए।
- issue: ‘उसके बाद’ और ‘वंशज’ के बीच अर्थ-संबंध
  choice: राजवंशीय संदर्भ में ‘उसके वंशजों’ को मुख्य पाठ में रखा गया और मूल का अधिक शाब्दिक अर्थ पाद-टिप्पणी में दिया गया।
  alternative: मुख्य पाठ में केवल ‘उसके बाद के लोगों’ या ‘उसके उत्तरकाल’ कहना।
  rationale: संदर्भ उत्तराधिकार का है, इसलिए ‘वंशज’ सहज अर्थ देता है; फिर भी אַחֲרִית की वास्तविक अर्थ-व्याप्ति को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। निष्क्रिय क्रियाएँ मूल की कार्रवाई-केंद्रित शैली बनाए रखती हैं। ‘प्रभुत्व के अनुसार’ थोड़ा औपचारिक है, पर मूल की अर्थगत और व्याकरणिक कसावट को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
