language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בְּ/שַׁלְוָ֞ה וּ/בְ/מִשְׁמַנֵּ֣י מְדִינָה֮ יָבוֹא֒ וְ/עָשָׂ֗ה אֲשֶׁ֨ר לֹא עָשׂ֤וּ אֲבֹתָי/ו֙ וַ/אֲב֣וֹת אֲבֹתָ֔י/ו בִּזָּ֧ה וְ/שָׁלָ֛ל וּ/רְכ֖וּשׁ לָ/הֶ֣ם יִבְז֑וֹר וְ/עַ֧ל מִבְצָרִ֛ים יְחַשֵּׁ֥ב מַחְשְׁבֹתָ֖י/ו וְ/עַד עֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/024.yaml
  text: 'In a time of security he will come into the richest parts of the province[a], and he will do what neither his fathers nor his fathers’ fathers did: he will scatter among them plunder, spoil, and goods; and against fortresses he will devise his plans[c][b], but only until a time.'
translation:
  language: hi
  text: 'सुरक्षा के समय वह प्रान्त के सबसे समृद्ध भागों में प्रवेश करेगा[a]। वह ऐसा काम करेगा जो न उसके पिताओं ने किया था, न उसके पिताओं के पिताओं ने: वह लूट, युद्ध की लूट और सम्पत्ति उनके बीच बाँट देगा[b]। वह गढ़ों के विरुद्ध अपनी योजनाएँ बनाएगा[c], पर केवल एक समय तक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह शान्तिपूर्वक” अथवा “अचानक प्रान्त के सबसे समृद्ध भागों में प्रवेश करेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह लूट, युद्ध की लूट और सम्पत्ति उनके लिए बिखेर देगा।”
    reason: lexical_alternative
  - marker: c
    text: या, “वह गढ़ों के विरुद्ध षड्यन्त्र रचेगा।” अन्तिम वाक्यांश का अनुवाद “ठहराए हुए समय तक” भी किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשַׁלְוָה
  choice: सुरक्षा के समय
  rationale: यह पद शान्ति, निश्चिन्तता या सुरक्षित स्थिति का बोध करा सकता है। राजनीतिक-सैनिक प्रसंग में यह अनुकूल सुरक्षित परिस्थिति को व्यक्त करता है, पर यह दावा नहीं करता कि प्रवेश अनिवार्यतः शान्तिपूर्वक ही होगा।
- source_word: וּבְמִשְׁמַנֵּי מְדִינָה
  choice: प्रान्त के सबसे समृद्ध भागों में
  rationale: מִשְׁמַנִּים का शाब्दिक भाव ‘मोटे/उपजाऊ स्थान’ है और यहाँ मुहावरे के रूप में धनवान या समृद्ध क्षेत्रों को सूचित करता है। מְדִינָה का सामान्य प्रशासनिक अर्थ ‘प्रान्त’ रखा गया है।
- source_word: יָבוֹא
  choice: प्रवेश करेगा
  rationale: मूल क्रिया सामान्यतः आने या प्रवेश करने की है। ‘आक्रमण करेगा’ सैनिक आशय को अधिक स्पष्ट कर देता, पर वह क्रिया में स्वयं अनिवार्य नहीं है।
- source_word: וְעָשָׂה אֲשֶׁר לֹא עָשׂוּ
  choice: वह ऐसा काम करेगा जो ... ने किया था
  rationale: सरल और प्रत्यक्ष अनुवाद पूर्वजों से किए गए बलपूर्ण विरोध को बनाए रखता है।
- source_word: אֲבֹתָיו וַאֲבוֹת אֲבֹתָיו
  choice: उसके पिताओं ... उसके पिताओं के पिताओं
  rationale: मूल की दोहरावपूर्ण अभिव्यक्ति और उसके आलंकारिक बल को ‘पूर्वजों’ कहकर समतल करने के बजाय सुरक्षित रखा गया है।
- source_word: בִּזָּה וְשָׁלָל וּרְכוּשׁ
  choice: लूट, युद्ध की लूट और सम्पत्ति
  rationale: तीनों निकटार्थक संज्ञाओं के संचय को बनाए रखा गया है। दूसरी संज्ञा के लिए ‘युद्ध की लूट’ पहले शब्द से भेद स्पष्ट करती है, जबकि רְכוּשׁ के लिए ‘सम्पत्ति’ स्वाभाविक है।
- source_word: לָהֶם יִבְזוֹר
  choice: उनके बीच बाँट देगा
  rationale: בזר का मूल अर्थ बिखेरना है; इस प्रसंग में लूटी हुई सम्पत्ति लोगों में वितरित करने का आशय है। स्वाभाविक हिन्दी के लिए ‘बाँट देगा’ मुख्य पाठ में रखा गया है, जबकि शाब्दिक बिम्ब पादटिप्पणी में दिया गया है।
- source_word: וְעַל מִבְצָרִים יְחַשֵּׁב מַחְשְׁבֹתָיו
  choice: गढ़ों के विरुद्ध अपनी योजनाएँ बनाएगा
  rationale: सजातीय क्रिया-संज्ञा रचना का भाव योजनाएँ या युक्तियाँ गढ़ना है। ‘गढ़’ सैन्य सुरक्षा-स्थल का संक्षिप्त और सुबोध हिन्दी शब्द है।
- source_word: וְעַד עֵת
  choice: पर केवल एक समय तक
  rationale: मूल में शाब्दिक रूप से ‘और एक समय तक’ है। ‘केवल’ सीमा का भाव स्पष्ट करता है, पर ‘ठहराए हुए’ जैसा विशेषण नहीं जोड़ता।
theological_decisions:
- issue: समय-सीमा को स्पष्टतः दैवी रूप से नियुक्त बताना या अनिश्चित रहने देना
  choice: पर केवल एक समय तक
  alternative: ठहराए हुए समय तक; केवल कुछ समय तक
  rationale: यहाँ עֵת के साथ ‘ठहराया हुआ’ जैसा कोई स्पष्ट विशेषण नहीं है। इसलिए मुख्य पाठ अनिश्चित काल-सीमा को बनाए रखता है और व्यापक प्रसंग से दैवी नियुक्ति का विचार सीधे इस पद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध शैली अपनाई गई है। ‘पिताओं के पिताओं’ जैसी मूल की पुनरुक्ति जानबूझकर रखी गई है। ‘गढ़’, ‘सम्पत्ति’ और ‘योजनाएँ बनाएगा’ अत्यधिक संस्कृतनिष्ठ या सम्प्रदायगत भाषा से बचते हुए सैन्य-राजनीतिक प्रसंग को स्पष्ट रखते हैं।
