source:
  edition: WLC
  text: ו/בנ/ו יִתְגָּר֗וּ וְ/אָסְפוּ֙ הֲמוֹן֙ חֲיָלִ֣ים רַבִּ֔ים וּ/בָ֥א ב֖וֹא וְ/שָׁטַ֣ף וְ/עָבָ֑ר וְ/יָשֹׁ֥ב ו/יתגרו עַד מעז/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/010.yaml
  text: His sons will stir themselves up and assemble a multitude of great forces[a], and one will certainly come and overflow and pass through[b]; then he will return and stir up war as far as his fortress.
translation:
  language: hi
  text: उसके पुत्र युद्ध के लिए उठ खड़े होंगे और बहुत बड़ी सेना इकट्ठी करेंगे। फिर उनमें से एक निश्चय ही आएगा[a], बाढ़ की तरह उमड़ेगा और पार निकल जाएगा। इसके बाद वह लौटेगा और उसके गढ़ तक युद्ध छेड़ेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘उसके पुत्र’ के बहुवचन से अचानक एकवचन में बदलाव आता है; शाब्दिक रूप से, “वह निश्चय ही आएगा।” पाठ यह नहीं बताता कि वह कौन-सा पुत्र है।
    reason: alternative_reading
  - marker: b
    text: या “उसके दृढ़ गढ़ तक।” इब्रानी में गढ़ का स्वामी स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנָיו
  choice: उसके पुत्र
  rationale: राजवंशीय और सैनिक संदर्भ में בנים पुरुष वंशजों को सूचित करता है; इसलिए व्यापक ‘संतान’ के बजाय ‘पुत्र’ अधिक सटीक है।
- source_word: יִתְגָּרוּ
  choice: युद्ध के लिए उठ खड़े होंगे
  rationale: हित्पएल रूप संघर्ष के लिए स्वयं को उभारने या भिड़ने का भाव देता है। यह हिन्दी में स्वाभाविक रहते हुए आत्म-प्रेरित सैनिक गतिविधि को व्यक्त करता है।
- source_word: וְאָסְפוּ הֲמוֹן חֲיָלִים רַבִּים
  choice: बहुत बड़ी सेना इकट्ठी करेंगे
  rationale: शब्दसमूह का आशय बड़ी संख्या में सैनिक बल जुटाना है। ‘बहुत बड़ी सेना’ मूल के बहुलता और सैन्य बल—दोनों भावों को सहज हिन्दी में समेटता है।
- source_word: וּבָא בּוֹא
  choice: फिर उनमें से एक निश्चय ही आएगा
  rationale: क्रिया के साथ infinitive absolute आने से कथन पर बल पड़ता है। बहुवचन पुत्रों से एकवचन कर्ता की ओर बदलाव को ‘उनमें से एक’ स्पष्ट करता है, पर यह नहीं बताता कि वह कौन-सा पुत्र है।
- source_word: וְשָׁטַף
  choice: बाढ़ की तरह उमड़ेगा
  rationale: שטף भारी सैन्य चढ़ाई को बाढ़ के रूपक में दिखाता है। इस अनुवाद से वह सजीव रूपक सुरक्षित रहता है।
- source_word: וְעָבָר
  choice: पार निकल जाएगा
  rationale: עבר यहाँ प्रदेश के आर-पार बढ़ते जाने का संकेत देता है। ‘पार निकल जाएगा’ सैन्य गति को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְיָשֹׁב
  choice: इसके बाद वह लौटेगा
  rationale: שוב का मूल अर्थ लौटना है; ‘इसके बाद’ घटनाओं का क्रम स्पष्ट करता है, बिना नई ऐतिहासिक सूचना जोड़े।
- source_word: וְיִתְגָּרֶה
  choice: और ... युद्ध करेगा
  rationale: यहाँ उसी धातु का सैनिक संदर्भ में एकवचन प्रयोग युद्ध में भिड़ने या युद्ध करने का भाव देता है। हिन्दी में ‘युद्ध करेगा’ स्वाभाविक और स्पष्ट है।
- source_word: עַד מָעֻזֹּה
  choice: उसके गढ़ तक
  rationale: מָעוֹז किलेबंद गढ़ या दृढ़ स्थान है। एकवचन पुल्लिंग संबंधसूचक प्रत्यय को ‘उसके’ से रखा गया है, जबकि उसका संदर्भ जानबूझकर अनिर्धारित छोड़ा गया है।
theological_decisions:
- issue: बहुवचन ‘उसके पुत्र’ के बाद एकवचन कर्ता
  choice: ‘उनमें से एक निश्चय ही आएगा’ द्वारा व्याकरणिक बदलाव को स्पष्ट रखना, पर व्यक्ति की पहचान न बताना
  alternative: ‘वह निश्चय ही आएगा’ कहना, या किसी एक ऐतिहासिक पुत्र की पहचान अनुवाद में जोड़ना
  rationale: इब्रानी में बहुवचन से एकवचन की ओर अचानक बदलाव है। पाठ किसी व्यक्ति का नाम नहीं बताता, इसलिए अनुवाद बदलाव को दिखाता है पर ऐतिहासिक पहचान तय नहीं करता।
- issue: ‘उसके गढ़’ में संबंधसूचक सर्वनाम का संदर्भ
  choice: एकवचन ‘उसके गढ़’ को बनाए रखना और उसके स्वामी को अनिर्धारित छोड़ना
  alternative: व्याख्यात्मक रूप से ‘उनके गढ़’ करना या किसी विशेष राजा का नाम जोड़ना
  rationale: इब्रानी प्रत्यय एकवचन पुल्लिंग है, किंतु उसका पूर्वपद संदर्भगत रूप से विवादित है। अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। सैन्य संदर्भ स्पष्ट किया गया है, साथ ही बाढ़ का मूल रूपक और सर्वनाम-संबंधी अस्पष्टताएँ सुरक्षित रखी गई हैं।
