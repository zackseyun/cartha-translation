source:
  edition: WLC
  text: וְ/לֶ/אֱלֹ֨הַּ֙ מָֽעֻזִּ֔ים עַל כַּנּ֖/וֹ יְכַבֵּ֑ד וְ/לֶ/אֱל֜וֹהַּ אֲשֶׁ֧ר לֹא יְדָעֻ֣/הוּ אֲבֹתָ֗י/ו יְכַבֵּ֛ד בְּ/זָהָ֥ב וּ/בְ/כֶ֛סֶף וּ/בְ/אֶ֥בֶן יְקָרָ֖ה וּ/בַ/חֲמֻדֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/038.yaml
  text: Instead[a], he will honor a god of fortresses in his place; he will honor a god whom his fathers did not know with gold, silver, precious stones[c][b], and desirable things.
translation:
  language: hi
  text: परन्तु वह उसके स्थान पर[a] दुर्गों के देवता[b] का सम्मान करेगा; और एक ऐसे देवता का, जिसे उसके पूर्वज नहीं जानते थे, वह सोने, चाँदी, बहुमूल्य पत्थरों और मूल्यवान वस्तुओं[c] से सम्मान करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “उसके आधार पर” या “उसके चबूतरे पर”; यह कठिन वाक्यांश “उसके स्थान पर” अथवा “उसके बदले” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “गढ़ों के देवता।”
    reason: lexical_alternative
  - marker: c
    text: या “बहुमूल्य वस्तुओं” अथवा “खज़ानों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֶאֱלֹהַּ מָעֻזִּים
  choice: परन्तु ... किलों के देवता
  rationale: संबंधसूचक לְ के साथ यह पद पिछले कथन के विपरीत दिशा दिखाता है; מָעֻזִּים रक्षा के दृढ़ स्थानों या किलों को सूचित करता है। किसी विशिष्ट देवता की पहचान किए बिना वर्णनात्मक अनुवाद रखा गया है।
- source_word: עַל־כַּנּוֹ
  choice: उसके स्थान पर
  rationale: शाब्दिक अर्थ 'उसके आधार/चबूतरे पर' हो सकता है, पर प्रसंग में स्थान या प्रतिस्थापन का भाव सम्भावित है। सर्वनाम का संदर्भ अस्पष्ट रहने दिया गया है।
- source_word: יְכַבֵּד
  choice: सम्मान करेगा
  rationale: כבד के पिएल रूप का यहाँ अर्थ आदर या महिमा देना है; दोनों प्रयोगों में एक ही सहज अभिव्यक्ति रखी गई है।
- source_word: אֲשֶׁר לֹא יְדָעֻהוּ אֲבֹתָיו
  choice: जिसे उसके पुरखे नहीं जानते थे
  rationale: ידע को सामान्यतः 'जानना' और אֲבֹתָיו को वंशगत अर्थ में 'पुरखे' अनूदित किया गया है; इससे आधुनिक हिन्दी में पैतृक पूर्वजों का आशय स्वाभाविक रूप से आता है।
- source_word: בְּזָהָב וּבְכֶסֶף
  choice: सोने, चाँदी ... से
  rationale: בְ यहाँ उस साधन या सामग्री को बताता है जिसके द्वारा सम्मान किया जाएगा; हिन्दी में 'से' स्वाभाविक है।
- source_word: וּבְאֶבֶן יְקָרָה
  choice: बहुमूल्य पत्थरों
  rationale: एकवचन אֶבֶן सूची में सामूहिक अर्थ दे सकता है; हिन्दी में बहुवचन स्वाभाविक है और मूल्यवान रत्न-पत्थरों का व्यापक अर्थ सुरक्षित रखता है।
- source_word: וּבַחֲמֻדוֹת
  choice: मनभावनी वस्तुओं
  rationale: חֲמֻדוֹת का मूल भाव चाही या प्रिय वस्तुएँ है। यह चयन 'खज़ानों' की अपेक्षा व्यापक है; विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘किलों के देवता’ की पहचान
  choice: वाक्यांश को बिना किसी ऐतिहासिक, पौराणिक या अंतकालीन देवता से पहचाने वर्णनात्मक रूप में रखा गया है।
  alternative: इसे किसी ज्ञात युद्ध-देवता या स्वयं सैन्य शक्ति का प्रतीक मानना।
  rationale: इस पद का इब्रानी पाठ किसी विशिष्ट पहचान के लिए पर्याप्त सूचना नहीं देता; अनुवाद को विवादित पहचान आरोपित नहीं करनी चाहिए।
- issue: עַל־כַּנּוֹ का अर्थ
  choice: उसके स्थान पर
  alternative: उसके आधार/चबूतरे पर; उसके बदले
  rationale: वाक्यांश संक्षिप्त और संदिग्ध है। मुख्य पाठ में सम्भावित स्थानापन्न अर्थ दिया गया है, जबकि शाब्दिक स्थानवाचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट स्तर रखा गया है। 'पुरखे' वंशगत अर्थ को सहजता से व्यक्त करता है। पाठ की कठिन सर्वनाम-संबंधी और देवता की पहचान संबंधी अस्पष्टताएँ सुलझाने के बजाय सुरक्षित रखी गई हैं।
