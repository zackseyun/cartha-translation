base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/031.yaml
  text: And forces from him will arise[a], and they will profane the sanctuary fortress, and remove the regular burnt offering[d][c][b], and set up the abomination that desolates.
translation:
  language: hi
  text: और उसकी ओर से सैन्य-दल उठ खड़े होंगे[a]। वे पवित्रस्थान-गढ़[b] को अपवित्र करेंगे, नियमित होमबलि[c] को हटा देंगे, और उजाड़ने वाली घृणित वस्तु[d] को स्थापित करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘भुजाएँ’; यहाँ आशय सैन्य-दल या सशस्त्र शक्ति है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘पवित्रस्थान, गढ़’; इसका अर्थ ‘गढ़रूपी पवित्रस्थान’ या ‘पवित्रस्थान, अर्थात गढ़’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में केवल ‘नियमित’ या ‘निरन्तर’; यहाँ नियमित रूप से चढ़ाई जाने वाली होमबलि अभिप्रेत है।
    reason: lexical_alternative
  - marker: d
    text: या ‘उजाड़ का कारण बनने वाली घृणित वस्तु’।
    reason: alternative_reading
lexical_decisions:
- source_word: וּזְרֹעִים
  choice: सैन्य-दल
  rationale: शाब्दिक अर्थ ‘भुजाएँ’ है, पर यहाँ सैन्य-राजनीतिक संदर्भ में यह सशस्त्र शक्ति या सेना को दर्शाता है। ‘सैन्य-दल’ आधुनिक हिन्दी में आशय स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: מִמֶּנּוּ
  choice: उसकी ओर से
  rationale: प्रत्यय पूर्ववर्ती राजकीय व्यक्ति की ओर संकेत करता है। ‘उसकी ओर से’ स्रोत, समर्थन या आदेश की सम्भावना को बिना अनावश्यक रूप से तय किए स्वाभाविक हिन्दी देता है।
- source_word: יַעֲמֹדוּ
  choice: उठ खड़े होंगे
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है; यहाँ सैन्य-दलों के आगे आने या मोर्चा लेने का भाव है।
- source_word: וְחִלְּלוּ
  choice: अपवित्र करेंगे
  rationale: पिएल रूप पवित्र वस्तु को सामान्य या अशुद्ध ठहराने, अर्थात उसका अपमान करने, का भाव देता है। ‘अपवित्र करना’ पवित्रस्थान के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: הַמִּקְדָּשׁ הַמָּעוֹז
  choice: गढ़रूपी पवित्रस्थान
  rationale: दोनों निश्चित संज्ञाओं का संक्षिप्त संबंध पवित्रस्थान को गढ़ या दृढ़स्थान के रूप में चित्रित कर सकता है। यह अनुवाद दोनों अर्थ-घटकों को बनाए रखता है; वैकल्पिक वाक्य-संबंध पादटिप्पणी में दिया गया है।
- source_word: וְהֵסִירוּ
  choice: हटा देंगे
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को दूर करना या समाप्त कर देना है। ‘हटा देंगे’ क्रिया को स्पष्ट रखता है, पर उसकी अवधि के विषय में अतिरिक्त निष्कर्ष नहीं जोड़ता।
- source_word: הַתָּמִיד
  choice: नियमित होमबलि
  rationale: शब्द स्वयं ‘नियमित/निरन्तर’ कहता है, किंतु दानिय्येल के उपासना-संदर्भ में यह नियमित बलिदान का संक्षिप्त संकेत है। ‘होमबलि’ संदर्भित कर्म को पाठक के लिए स्पष्ट करता है।
- source_word: וְנָתְנוּ
  choice: स्थापित करेंगे
  rationale: נתן का मूल भाव ‘रखना’ है; किसी घृणित उपासना-वस्तु को नियत स्थान पर खड़ा करने के संदर्भ में ‘स्थापित करना’ स्वाभाविक है।
- source_word: הַשִּׁקּוּץ
  choice: घृणित वस्तु
  rationale: שִׁקּוּץ किसी अत्यन्त घृणित, प्रायः मूर्तिपूजक वस्तु को दर्शाता है। ‘घृणित वस्तु’ अर्थ को बिना उसके स्वरूप को अनावश्यक रूप से निश्चित किए व्यक्त करता है।
- source_word: מְשׁוֹמֵם
  choice: उजाड़ने वाली
  rationale: कृदन्त सक्रिय कारण अथवा विनाशकारी प्रभाव व्यक्त कर सकता है। ‘उजाड़ने वाली’ इस सक्रिय भाव को बनाए रखता है; ‘उजाड़ का कारण बनने वाली’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: הַמִּקְדָּשׁ הַמָּעוֹז में ‘पवित्रस्थान’ और ‘गढ़’ का संबंध
  choice: मुख्य पाठ में ‘गढ़रूपी पवित्रस्थान’
  alternative: ‘पवित्रस्थान, अर्थात गढ़’ अथवा ‘पवित्रस्थान और गढ़’
  rationale: इब्रानी में दोनों निश्चित संज्ञाएँ बिना स्पष्ट संयोजक के साथ रखी गई हैं। मुख्य पाठ संभावित विशेषणात्मक/समानाधिकरण संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी मूल की संक्षिप्त वाक्यगत अस्पष्टता सुरक्षित रखती है।
- issue: הַתָּמִיד का अंतर्निहित बलिदानी संदर्भ
  choice: ‘नियमित होमबलि’
  alternative: ‘नियमित बलि’ अथवा केवल ‘नियमित’
  rationale: संज्ञा ‘बलि’ मूल में व्यक्त नहीं है, फिर भी दानिय्येल के पवित्रस्थान-संदर्भ में नियमित बलिदान अभिप्रेत है। स्पष्टता के लिए इसे मुख्य पाठ में पूरा किया गया है और शाब्दिक स्थिति पादटिप्पणी में बताई गई है।
- issue: מְשׁוֹמֵם का कारणात्मक या वर्णनात्मक बल
  choice: ‘उजाड़ने वाली’
  alternative: ‘उजाड़ का कारण बनने वाली’
  rationale: यह अनुवाद कृदन्त के सक्रिय विनाशकारी भाव को बनाए रखता है और किसी विशेष ऐतिहासिक या अन्तकालीन पहचान को पाठ में नहीं थोपता।
