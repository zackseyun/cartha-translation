  text: וְ/עָשָׂ֨ה כִ/רְצוֹנ֜/וֹ הַ/מֶּ֗לֶךְ וְ/יִתְרוֹמֵ֤ם וְ/יִתְגַּדֵּל֙ עַל כָּל אֵ֔ל וְ/עַל֙ אֵ֣ל אֵלִ֔ים יְדַבֵּ֖ר נִפְלָא֑וֹת וְ/הִצְלִ֨יחַ֙ עַד כָּ֣לָה זַ֔עַם כִּ֥י נֶחֱרָצָ֖ה נֶעֱשָֽׂתָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/036.yaml
  text: And the king will do as he pleases[a]. He will exalt himself and magnify himself above every god, and against the God of gods he will speak astonishing things. And he will prosper until the indignation is finished[c][b], for what has been decreed will be done.
translation:
  language: hi
  text: और वह राजा अपनी इच्छा के अनुसार करेगा। वह हर देवता से भी ऊपर अपने को उठाएगा और महान बनाएगा। वह देवताओं के परमेश्वर के विरुद्ध आश्चर्यजनक बातें कहेगा[a]। वह तब तक सफल होता रहेगा, जब तक रोष का अन्त न हो जाए[b], क्योंकि जो ठहराया गया है, वह पूरा किया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अद्भुत बातें।” हिब्रू शब्द असाधारण या विस्मयकारी बातों को दर्शा सकता है; यहाँ प्रसंग चौंका देने वाले, अहंकारी कथनों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब तक क्रोध पूरा न हो जाए।”
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि जो निश्चय किया गया है, वह किया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה כִרְצוֹנוֹ
  choice: अपनी इच्छा के अनुसार करेगा
  rationale: यह मूल के ‘अपनी इच्छा के अनुसार’ अर्थ को सीधे और स्वाभाविक हिन्दी में रखता है तथा राजा की स्वेच्छाचारी प्रवृत्ति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: वह राजा
  rationale: हिब्रू के निश्चित संज्ञा-रूप ‘राजा’ को पूर्व प्रसंग से जोड़ने के लिए हिन्दी में ‘वह राजा’ स्वाभाविक है।
- source_word: וְיִתְרוֹמֵם
  choice: अपने आप को ऊँचा उठाएगा
  rationale: हित्पएल रूप का आत्मवाचक भाव स्पष्ट रखते हुए आत्म-उन्नयन को व्यक्त करता है।
- source_word: וְיִתְגַּדֵּל
  choice: अपने आप को महान बनाएगा
  rationale: पहले क्रियापद के साथ मूल की बढ़ती हुई आत्म-महिमा की अभिव्यक्ति को बनाए रखता है।
- source_word: עַל כָּל אֵל
  choice: हर देवता से ऊपर
  rationale: ऊँचा उठाने और महान बनाने वाली क्रियाओं के साथ עַל यहाँ श्रेष्ठता अथवा ऊपर होने का भाव देता है।
- source_word: וְעַל אֵל אֵלִים
  choice: देवताओं के परमेश्वर के विरुद्ध
  rationale: निर्माण ‘देवताओं का परमेश्वर’ सर्वोच्च ईश्वर की ओर संकेत करता है; इस क्रिया के साथ עַל विरोध का भाव देता है।
- source_word: יְדַבֵּר נִפְלָאוֹת
  choice: आश्चर्यजनक बातें कहेगा
  rationale: नִפְלָאוֹת की असाधारण अथवा विस्मयकारी बातों की अर्थ-सीमा सुरक्षित रहती है; hostile context को मुख्य पाठ में अत्यधिक निर्णायक रूप से नहीं जोड़ा गया।
- source_word: וְהִצְלִיחַ
  choice: सफल होता रहेगा
  rationale: क्रिया अस्थायी सफलता या उन्नति बताती है; ‘होता रहेगा’ अगले ‘जब तक’ खंड से उसके सीमित काल को सहज रूप से जोड़ता है।
- source_word: עַד כָּלָה זַעַם
  choice: जब तक रोष का अन्त न हो जाए
  rationale: זַעַם के प्रबल क्रोध/रोष के भाव और כָּלָה के समाप्ति तक पहुँचने के अर्थ को गम्भीर भविष्यद्वाणीपरक शैली में रखता है, बिना मुख्य पाठ में रोष के कर्ता को स्पष्ट किए।
- source_word: כִּי נֶחֱרָצָה נֶעֱשָׂתָה
  choice: क्योंकि जो ठहराया गया है, वह पूरा होकर रहेगा
  rationale: यह दिव्य निर्णय और उसके निश्चित कार्यान्वयन—दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: אֵל אֵלִים का अभिप्रेत और हिन्दी पदावली
  choice: ‘देवताओं के परमेश्वर’ द्वारा सर्वोच्च सच्चे परमेश्वर का संकेत
  alternative: ‘देवताओं का देवता’ को अधिक सामान्य अर्थ में लेना
  rationale: प्रसंग में राजा हर देवता से ऊपर उठता है और फिर सर्वोच्च परमेश्वर के विरुद्ध बोलता है। ‘परमेश्वर’ सम्भावित अभिप्रेत को व्यक्त करता है, पर वाक्य में उससे आगे कोई पहचान नहीं जोड़ता।
- issue: זַעַם का स्वरूप
  choice: ‘रोष’ के रूप में अनुवाद, उसके कर्ता को अव्यक्त रखना
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर का क्रोध’ कहना अथवा सामान्य ‘क्रोध’ कहना
  rationale: दानिय्येल के भविष्यद्वाणीपरक प्रसंग में यह सम्भवतः निर्धारित अवधि वाले दिव्य रोष को दर्शाता है, पर हिब्रू इस पद में कर्ता नहीं बताता; इसलिए अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण भविष्यद्वाणीपरक शैली में रखी गई है। ‘देवता’ और ‘परमेश्वर’ का भेद प्रसंग के सामान्य देवताओं और सर्वोच्च परमेश्वर के बीच के विरोध को स्पष्ट करता है। सभी अस्पष्टताओं को अनावश्यक रूप से सुलझाने के बजाय वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
