  text: ו/ישב פָּנָ֛י/ו לְ/אִיִּ֖ים וְ/לָכַ֣ד רַבִּ֑ים וְ/הִשְׁבִּ֨ית קָצִ֤ין חֶרְפָּת/וֹ֙ ל֔/וֹ בִּלְתִּ֥י חֶרְפָּת֖/וֹ יָשִׁ֥יב לֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/018.yaml
  text: Then he will turn his face to the coastlands and capture many[b][a]. But a commander will put an end to his reproach against him; indeed, he will repay his reproach to him.
translation:
  language: hi
  text: फिर वह अपना मुँह समुद्र-तटीय प्रदेशों[a] की ओर करेगा और बहुतों को अपने वश में कर लेगा। पर एक सेनापति अपने विरुद्ध उसके अपमान का अंत कर देगा; वास्तव में, वह उसका अपमान उसी पर लौटा देगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “द्वीपों।” इब्रानी शब्द द्वीपों अथवा अधिक व्यापक रूप से समुद्र-तटीय क्षेत्रों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अंतिम उपवाक्यों का इब्रानी पाठ कठिन है। इसका अर्थ यह भी समझा गया है कि सेनापति उसके अपमान का अंत कर देगा और अपना अपमान अपने ऊपर लौटने नहीं देगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וישב פניו
  choice: वह अपना मुँह ... की ओर करेगा
  rationale: इब्रानी मुहावरे की ‘मुँह’ वाली छवि को बनाए रखते हुए किसी दिशा में अभियान मोड़ने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לאיים
  choice: समुद्र-तटीय प्रदेशों
  rationale: אִיִּים द्वीपों के साथ-साथ व्यापक समुद्री तटवर्ती क्षेत्रों को भी दर्शा सकता है। प्रसंग में व्यापक अर्थ उपयुक्त है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: ולכד רבים
  choice: बहुतों को अपने वश में कर लेगा
  rationale: לכד का सैन्य भाव पकड़ने या अधिकार में करने का है। רבים के साथ कोई स्पष्ट संज्ञा नहीं है; ‘बहुतों’ स्रोत की संक्षिप्तता और लोगों अथवा स्थानों की संभावित व्यापकता बनाए रखता है।
- source_word: והשבית
  choice: अंत कर देगा
  rationale: שבת के हिफ़ील रूप का अर्थ किसी बात को रुकवा देना या समाप्त कर देना है; यह हिन्दी में संक्षिप्त और प्रभावशाली है।
- source_word: קצין
  choice: एक सेनापति
  rationale: קצין नेता, अधिकारी या सैन्य प्रधान को सूचित कर सकता है। युद्ध-संबंधी प्रसंग में ‘सेनापति’ सबसे स्वाभाविक है।
- source_word: חרפתו לו
  choice: अपने विरुद्ध उसके अपमान
  rationale: कठिन सर्वनामिक रचना को इस प्रकार व्यक्त किया गया है कि सेनापति अपमान को रोकता है और राजा उस अपमान का कर्ता है; पादटिप्पणी पाठ की कठिनाई बताती है।
- source_word: בלתי חרפתו ישיב לו
  choice: बल्कि उसका अपमान उसी पर लौटा देगा
  rationale: ישיב का प्रतिफल अथवा पलटकर लौटाने का भाव रखा गया है। בלתי को यहाँ निषेधात्मक ‘बिना’ के बजाय बलाघाती/पूरक अर्थ में समझा गया है, जैसा वाक्य के प्रतिशोधात्मक समानांतर से संभव है।
theological_decisions:
- issue: अंतिम दो उपवाक्यों के सर्वनाम और कर्ता
  choice: सेनापति राजा के किए अपमान को रोकता है और वही अपमान राजा पर लौटा देता है।
  alternative: सेनापति अपने ऊपर से अपमान हटाता है और उसका अपना अपमान उस पर वापस नहीं आता; अथवा राजा का अपमान बिना प्रतिदान के समाप्त किया जाता है।
  rationale: इब्रानी वाक्यरचना संक्षिप्त और विवादित है। मुख्य पाठ में सबसे स्वाभाविक प्रतिफलात्मक पाठ रखा गया है, पर किसी ऐतिहासिक व्यक्ति की पहचान नहीं जोड़ी गई और पादटिप्पणी में वास्तविक वैकल्पिक समझ दर्ज की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और कथात्मक-सैन्य रजिस्टर अपनाया गया है। ‘अपमान’ सामान्य पाठक के लिए स्पष्ट है, जबकि सर्वनामों की कठिनाई पादटिप्पणी में खुलकर बताई गई है।
