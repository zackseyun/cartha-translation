id: DAN.11.16
reference: Daniel 11:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יַ֨עַשׂ הַ/בָּ֤א אֵלָי/ו֙ כִּ/רְצוֹנ֔/וֹ וְ/אֵ֥ין עוֹמֵ֖ד לְ/פָנָ֑י/ו וְ/יַעֲמֹ֥ד בְּ/אֶֽרֶץ הַ/צְּבִ֖י וְ/כָלָ֥ה בְ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/016.yaml
  text: And the one who comes against him will do as he pleases[a], and no one will stand before him. He will stand in the Beautiful Land[b], and it will be consumed in his hand.
translation:
  language: hi
  text: और जो उसके विरुद्ध आएगा, वह अपनी इच्छा के अनुसार करेगा, और उसके सामने कोई टिक न सकेगा। वह शोभायमान देश[a] में आ खड़ा होगा, और उसके हाथ में विनाश होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनोहर देश।” इब्रानी अभिव्यक्ति सुंदरता, शोभा या मनोहरता वाले देश को दर्शाती है और यहाँ इस्राएल/यहूदा की भूमि की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: या “और वह उसके हाथ में नष्ट हो जाएगा,” अथवा “और वह अपने हाथ से विनाश करेगा।” इब्रानी वाक्यांश संक्षिप्त है और या तो उसके नियंत्रण में विनाशकारी शक्ति पर, या देश के नष्ट किए जाने पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַעַשׂ
  choice: करेगा
  rationale: עשה का मूल अर्थ ‘करना’ है; व्यापक क्रिया-भाव को बिना अनावश्यक विशिष्टीकरण के बनाए रखता है।
- source_word: הַבָּא אֵלָיו
  choice: जो उसके विरुद्ध आएगा
  rationale: אֶל सामान्यतः ‘की ओर’ है, पर युद्ध-संदर्भ में यहाँ विरोधी दिशा स्पष्ट है; ‘विरुद्ध’ स्वाभाविक हिन्दी में इसे व्यक्त करता है।
- source_word: כִּרְצוֹנוֹ
  choice: अपनी इच्छा के अनुसार
  rationale: यह मूल वाक्यांश का निकट और गरिमापूर्ण हिन्दी रूप है तथा निर्बाध कार्य करने का भाव रखता है।
- source_word: וְאֵין עוֹמֵד לְפָנָיו
  choice: उसके सामने कोई टिक न सकेगा
  rationale: सैन्य प्रसंग में ‘सामने खड़ा होना’ प्रतिरोध करने का मुहावरा है; ‘टिक न सकेगा’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और खड़े रहने की छवि भी बचाता है।
- source_word: וְיַעֲמֹד
  choice: आ खड़ा होगा
  rationale: עמד की ‘खड़ा होना/स्थान लेना’ वाली छवि को रखता है और उस देश में सैन्य उपस्थिति स्थापित करने का प्रसंगगत भाव देता है।
- source_word: בְּאֶרֶץ הַצְּבִי
  choice: शोभायमान देश
  rationale: צְבִי यहाँ शोभा, सुंदरता या मनोहरता दर्शाता है। ‘शोभायमान देश’ शीर्षक-सदृश भौगोलिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וְכָלָה בְיָדוֹ
  choice: और उसके हाथ में विनाश होगा
  rationale: संक्षिप्त और कुछ हद तक अंडाकार इब्रानी वाक्यांश में כָלָה समाप्ति, संहार या विनाश का भाव दे सकता है। यह रूप हाथ में विनाशकारी सामर्थ्य की मूल छवि रखता है, जबकि कर्मवाच्य विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘शोभायमान देश’ का अभिप्राय
  choice: दानिय्येल के दर्शन में इस्राएल/यहूदा की भूमि के लिए रूपकात्मक भौगोलिक पद
  alternative: सामान्य अर्थ में केवल ‘शोभा का देश’, बिना स्पष्ट ऐतिहासिक पहचान के
  rationale: मुख्य पाठ रूपकात्मक नाम का अनुवाद करता है, पर ‘इस्राएल/यहूदा’ को पाठ में जोड़कर पहचान को आवश्यकता से अधिक स्पष्ट नहीं करता; स्पष्टीकरण पादटिप्पणी में रखा गया है।
- issue: अंतिम उपवाक्य का कर्ता और बल
  choice: विनाश उसके हाथ में, अर्थात उसके नियंत्रण में होगा
  alternative: देश उसके हाथ से नष्ट हो जाएगा
  rationale: וְכָלָה בְיָדוֹ अत्यंत संक्षिप्त है और विनाशकारी शक्ति तथा देश के नष्ट होने—दोनों की ओर संकेत कर सकता है। मुख्य पाठ इब्रानी की ‘हाथ में’ छवि रखता है और दूसरा संभव अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘टिक न सकेगा’ सैन्य मुहावरे को स्वाभाविक बनाता है; ‘शोभायमान देश’ मूल रूपक को बनाए रखता है। अंतिम उपवाक्य की वास्तविक अस्पष्टता मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित है।
