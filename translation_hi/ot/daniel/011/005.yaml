  yaml_path: translation/ot/daniel/011/005.yaml
  text: Then the king of the South will grow strong[a], but one of his commanders will grow stronger than he and will rule, and his dominion will be a great dominion.
translation:
  language: hi
  text: तब दक्षिण का राजा शक्तिशाली होगा; पर उसके अधिकारियों में से एक उससे भी अधिक शक्तिशाली होगा और शासन करेगा। उसका प्रभुत्व बहुत बड़ा होगा।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या, अधिक शाब्दिक रूप से: “उसके सरदारों में से एक उसके ऊपर शक्तिशाली होगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶחֱזַק
  choice: शक्तिशाली हो जाएगा
  rationale: חזק का क़ाल अपूर्ण रूप यहाँ राजनीतिक और सैनिक सामर्थ्य प्राप्त करने या उसमें बढ़ने को व्यक्त करता है; भविष्यकालीन दर्शन-वर्णन के लिए यह स्वाभाविक हिन्दी है।
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: दक्षिण का राजा
  rationale: यह दानिय्येल 11 में बार-बार आने वाली दिशात्मक-राजनीतिक उपाधि है; औपचारिक ढाँचे को बनाए रखते हुए हिन्दी में स्पष्ट है।
- source_word: וּמִן שָׂרָיו
  choice: पर उसके सेनापतियों में से एक
  rationale: מִן और बहुवचन संज्ञा से आशय उसके अधिकारियों में से एक व्यक्ति है। इस सैनिक-राजनीतिक संदर्भ में שַׂר के लिए ‘सेनापति’ उपयुक्त है, और अगले कथन का विरोधाभास दिखाने के लिए ‘पर’ स्वाभाविक है।
- source_word: וְיֶחֱזַק עָלָיו
  choice: उससे भी अधिक शक्तिशाली हो जाएगा
  rationale: यहाँ עַל के साथ חזק पहले राजा की तुलना में श्रेष्ठ सामर्थ्य का संकेत देता है; हिन्दी में तुलनात्मक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וּמָשָׁל
  choice: शासन करेगा
  rationale: संयोजक के साथ आया पूर्ण क्रियारूप भविष्यसूचक कथा-क्रम को आगे बढ़ाता है; ‘शासन करेगा’ अर्थ को स्पष्ट रखता है।
- source_word: מִמְשָׁל רַב מֶמְשַׁלְתּוֹ
  choice: उसका शासन बहुत विस्तृत होगा
  rationale: इब्रानी पदबंध उसके शासन की बड़ी सीमा या व्यापकता पर बल देता है। ‘बहुत विस्तृत’ आधुनिक हिन्दी में ‘महान प्रभुत्व’ की अपेक्षा अधिक सहजता से क्षेत्र और अधिकार की व्यापकता बताता है।
