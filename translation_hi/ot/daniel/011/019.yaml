source:
  edition: WLC
  text: וְ/יָשֵׁ֣ב פָּנָ֔י/ו לְ/מָעוּזֵּ֖י אַרְצ֑/וֹ וְ/נִכְשַׁ֥ל וְ/נָפַ֖ל וְ/לֹ֥א יִמָּצֵֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/019.yaml
  text: Then he will turn his face toward the fortresses of his own land[a], but he will stumble and fall[b], and he will not be found.
translation:
  language: hi
  text: तब वह अपने देश के गढ़ों[a] की ओर अपना रुख करेगा; पर वह ठोकर खाएगा और गिर पड़ेगा, और उसका कहीं पता न चलेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किलों” अथवा “सुरक्षित स्थानों।” इब्रानी शब्द शक्ति, शरण या रक्षा के स्थानों के लिए व्यापक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “और वह नहीं पाया जाएगा।” यह उसके दृश्य से लुप्त हो जाने को सूचित करता है—संभवतः मृत्यु या सत्ता से हटाए जाने के कारण—पर मूल पाठ इसका तरीका स्पष्ट नहीं करता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשֵׁב פָּנָיו
  choice: तब वह ... की ओर अपना मुँह फेरेगा
  rationale: שׁוב के साथ פָּנָיו दिशा बदलने का भाव देता है। ‘अपना मुँह फेरेगा’ मूल बिंब को बनाए रखते हुए स्वाभाविक हिन्दी है; आरम्भिक וְ को प्रसंगानुकूल ‘तब’ से व्यक्त किया गया है।
- source_word: לְמָעוּזֵּי
  choice: गढ़ों
  rationale: מָעוֹז शक्ति, सुरक्षा या किलेबंदी के स्थान को दर्शाता है। सैन्य-राजनीतिक प्रसंग में ‘गढ़’ संक्षिप्त और स्वाभाविक है, जबकि पादटिप्पणी में व्यापक अर्थ बताया गया है।
- source_word: אַרְצוֹ
  choice: अपने देश के
  rationale: אֶרֶץ यहाँ उसके अपने भूभाग या देश को सूचित करता है। ‘अपने देश’ हिन्दी में स्वाभाविक रूप से स्वामित्व और वापसी की दिशा स्पष्ट करता है।
- source_word: וְנִכְשַׁל וְנָפַל
  choice: पर वह ठोकर खाकर गिर पड़ेगा
  rationale: כשל और נפל के क्रमिक रूपक—ठोकर खाना और गिरना—को सुरक्षित रखा गया है। प्रसंगगत विरोध को ‘पर’ व्यक्त करता है।
- source_word: וְלֹא יִמָּצֵא
  choice: और उसका कहीं पता न चलेगा
  rationale: शाब्दिक ‘वह नहीं पाया जाएगा’ की अपेक्षा यह आधुनिक हिन्दी का स्वाभाविक मुहावरा है और दृश्य से लुप्त हो जाने का भाव देता है, बिना मृत्यु या सत्ता-पलट की रीति निश्चित किए।
theological_decisions:
- issue: राजा के अन्त का स्वरूप
  choice: उसका कहीं पता न चलेगा
  alternative: वह मर जाएगा / उसका अन्त हो जाएगा
  rationale: इब्रानी वाक्य मृत्यु या अपदस्थ किए जाने की रीति स्पष्ट नहीं करता। अनुवाद उसी अप्रत्यक्षता और अनिश्चितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मुँह फेरेगा’ मूल दिशात्मक बिंब रखता है, और ‘ठोकर खाकर गिर पड़ेगा’ दो क्रमिक इब्रानी क्रियाओं को स्वाभाविक हिन्दी में व्यक्त करता है।
