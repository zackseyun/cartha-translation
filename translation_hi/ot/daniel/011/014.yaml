id: DAN.11.14
reference: Daniel 11:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בָ/עִתִּ֣ים הָ/הֵ֔ם רַבִּ֥ים יַֽעַמְד֖וּ עַל מֶ֣לֶךְ הַ/נֶּ֑גֶב וּ/בְנֵ֣י פָּרִיצֵ֣י עַמְּ/ךָ֗ יִֽנַּשְּׂא֛וּ לְ/הַעֲמִ֥יד חָז֖וֹן וְ/נִכְשָֽׁלוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/014.yaml
  text: And in those times many will rise up against the king of the South[a], and the violent among your people will lift themselves up to establish the vision[c][b], but they will stumble.
translation:
  language: hi
  text: और उन दिनों बहुत-से लोग दक्षिण के राजा के विरुद्ध उठ खड़े होंगे; और तुम्हारे लोगों में से उपद्रवी लोग[a] दर्शन को स्थापित करने के लिए अपने आपको ऊँचा उठाएँगे[b], परन्तु वे ठोकर खाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लोगों के हिंसक लोगों के पुत्र।” इब्रानी पदबंध जटिल है।
    reason: कठिन construct पदबंध के अधिक शाब्दिक वैकल्पिक अर्थ को दर्शाता है, बिना किसी विशिष्ट समूह की पहचान थोपे।
  - marker: b
    text: “दर्शन को स्थापित करने” का अनुवाद “दर्शन को पूरा करने” भी किया जा सकता है। “अपने आपको ऊँचा उठाएँगे” का अर्थ “अपने आपको महान बनाएँगे” भी हो सकता है।
    reason: ‘दर्शन को स्थापित करने’ के लिए व्याख्यात्मक वैकल्पिक अर्थ तथा आत्मोन्नति वाली क्रिया की अर्थ-छाया को उसी वाक्यांश के चिह्न पर स्पष्ट करता है।
lexical_decisions:
- source_word: וּבָעִתִּים הָהֵם
  choice: और उन दिनों
  rationale: यह पद ऐतिहासिक क्रम के उसी समयकाल की ओर संकेत करता है। आधुनिक हिन्दी में ‘उन दिनों’ स्वाभाविक है और इसे केवल चौबीस घंटे के दिनों तक सीमित नहीं करता।
- source_word: יַעַמְדוּ עַל
  choice: के विरुद्ध उठ खड़े होंगे
  rationale: संघर्ष के प्रसंग में यह मुहावरा विरोध में सक्रिय रूप से खड़े होने का भाव देता है।
- source_word: מֶלֶךְ הַנֶּגֶב
  choice: दक्षिण का राजा
  rationale: दानिय्येल 11 में נֶגֶב भूराजनीतिक दिशा-सूचक पद है; यहाँ सामान्यतः नेगेव प्रदेश अभिप्रेत नहीं है।
- source_word: וּבְנֵי פָּרִיצֵי עַמְּךָ
  choice: तुम्हारे लोगों में से उपद्रवी लोग
  rationale: जटिल इब्रानी पदबंध का शाब्दिक रूप ‘तुम्हारे लोगों के हिंसकों/उपद्रवियों के पुत्र’ जैसा है। ‘उपद्रवी लोग’ उसके नकारात्मक और विद्रोही भाव को सहज हिन्दी में रखता है, पर किसी विशिष्ट ऐतिहासिक या धार्मिक समूह की पहचान नहीं थोपता।
- source_word: יִנַּשְּׂאוּ
  choice: अपने आपको ऊँचा उठाएँगे
  rationale: रूप आत्मोन्नति या स्वयं को ऊपर उठाने का भाव देता है। यह हिन्दी अभिव्यक्ति मूल रूपक और आत्म-दावे, दोनों को बनाए रखती है।
- source_word: לְהַעֲמִיד חָזוֹן
  choice: दर्शन को स्थापित करने के लिए
  rationale: העמיד का मूल अर्थ ‘खड़ा करना/स्थापित करना’ है। यह अनुवाद ‘पूरा करना’ जैसे अधिक व्याख्यात्मक अर्थ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: וְנִכְשָׁלוּ
  choice: परन्तु वे ठोकर खाएँगे
  rationale: כשל ठोकर खाने का चित्र प्रस्तुत करता है और प्रसंग में विफलता या पतन—दोनों की संभावना खुली रखता है।
theological_decisions:
- issue: וּבְנֵי פָּרִיצֵי עַמְּךָ में वर्णित समूह की पहचान
  choice: तुम्हारे लोगों में से उपद्रवी लोग
  alternative: तुम्हारे लोगों के हिंसक लोगों के पुत्र
  rationale: मुख्य पाठ नैतिक और विद्रोही विशेषता को व्यक्त करता है, लेकिन किसी बाद के संप्रदाय, दल या ऐतिहासिक पहचान को पद में नहीं जोड़ता।
- issue: לְהַעֲמִיד חָזוֹן का आशय
  choice: दर्शन को स्थापित करने के लिए
  alternative: दर्शन को पूरा करने के लिए
  rationale: मूल क्रिया ‘स्थापित करना/खड़ा करना’ है। पद यह स्पष्ट नहीं करता कि वे जानबूझकर भविष्यवाणी पूरी करना चाहते हैं, उसे प्रमाणित करना चाहते हैं, या अपने कार्यों से उसे साकार करने का प्रयास करते हैं; इसलिए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है और व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दर्शन’ को दानिय्येल की भविष्यसूचक शब्दावली के अनुरूप बनाए रखा गया है। ‘परन्तु’ विफलता की स्पष्ट विरोधात्मक परिणति दिखाता है।
