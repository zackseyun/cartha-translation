  yaml_path: translation/ot/daniel/011/022.yaml
  text: The flood-like forces will be swept away from before him and be broken[b][a], and also the prince of the covenant.
translation:
  language: hi
  text: बाढ़-सी उमड़ती सेनाएँ[a] उसके सामने से बहा दी जाएँगी और टूट जाएँगी—और वाचा का प्रधान भी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘बाढ़ की भुजाएँ’; संभवतः प्रबल सैन्य शक्तियों के लिए प्रयुक्त मुहावरा।'
    reason: lexical_alternative
  - marker: b
    text: या, ‘वाचा का अगुआ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: זְרֹעוֹת הַשֶּׁטֶף
  choice: बाढ़-सी उमड़ती सेनाएँ
  rationale: शाब्दिक रूप से यह पदबंध ‘बाढ़ की भुजाएँ’ है। राजनीतिक-सैनिक संदर्भ में זְרֹעוֹת सशस्त्र शक्ति या सेनाओं को सूचित करता है, जबकि הַשֶּׁטֶף प्रबल बाढ़ का बिंब बनाए रखता है।
- source_word: יִשָּׁטְפוּ
  choice: बहा दी जाएँगी
  rationale: निफ़अल रूप को यहाँ कर्मवाच्य अर्थ में लेना स्वाभाविक है; यह बाढ़ के बिंब को जारी रखते हुए सेनाओं के परास्त होकर हट जाने का भाव देता है।
- source_word: מִלְּפָנָיו
  choice: उसके सामने से
  rationale: यह स्थानिक और टकराव-संबंधी दोनों भावों को सहज हिन्दी में बनाए रखता है।
- source_word: וְיִשָּׁבֵרוּ
  choice: और चकनाचूर हो जाएँगी
  rationale: שבר के निफ़अल का अर्थ टूटना या चूर होना है; यहाँ सैन्य पराजय की तीव्रता के लिए ‘चकनाचूर’ स्वाभाविक है।
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पिछले क्रियापदों से प्रभावित एक अतिरिक्त व्यक्ति को जोड़ता है।
- source_word: נְגִיד בְּרִית
  choice: वाचा का प्रधान
  rationale: נְגִיד किसी अगुए, शासक या प्रधान को दर्शाता है और आवश्यक रूप से राजपुत्र नहीं। ‘वाचा का प्रधान’ पदवी को खुला रखता है तथा किसी ऐतिहासिक पहचान को अनुवाद में नहीं थोपता।
theological_decisions:
- issue: ‘वाचा के प्रधान’ की पहचान और निश्चितता
  choice: पदवी को ‘वाचा का प्रधान’ कहकर पारदर्शी रूप में रखा गया और व्यक्ति की पहचान नहीं की गई।
  alternative: इसे ओनियास तृतीय, किसी सामान्य वाचागत शासक, या मसीही व्यक्ति के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ स्वयं उस व्यक्ति की ऐतिहासिक पहचान नहीं बताता। अतः विवादित व्याख्या को अनुवाद में शामिल करने के बजाय अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘बाढ़-सी उमड़ती’ मूल रूपक को बचाता है, ‘सेनाएँ’ उसके सम्भावित सैन्य आशय को स्पष्ट करता है, और ‘वाचा का प्रधान’ पारंपरिक धार्मिक शब्दावली तथा मूल की व्याख्यात्मक खुलावट दोनों बनाए रखता है।
