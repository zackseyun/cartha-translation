  terminology: ‘विनाश के लिए अर्पित कर दे’ is a sound, suitably careful rendering of חרם and avoids collapsing it into the preceding ‘नाश करे.’ The explanatory footnote responsibly notes both ‘प्रतिबंध के अधीन करना’ and ‘विनाश के लिए अर्पित करना,’ without imposing a theological interpretation. Footnote markers are correctly anchored and correspond to the stated lexical alternatives.
