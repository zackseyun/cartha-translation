id: DAN.11.44
reference: Daniel 11:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/שְׁמֻע֣וֹת יְבַהֲלֻ֔/הוּ מִ/מִּזְרָ֖ח וּ/מִ/צָּפ֑וֹן וְ/יָצָא֙ בְּ/חֵמָ֣א גְדֹלָ֔ה לְ/הַשְׁמִ֥יד וּֽ/לְ/הַחֲרִ֖ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/044.yaml
  text: But reports from the east and from the north will alarm him[b][a], and he will go out with great fury to destroy and to devote many to destruction.
translation:
  language: hi
  text: परन्तु पूर्व और उत्तर से आने वाले समाचार[a] उसे घबरा देंगे। तब वह घोर क्रोध में निकल पड़ेगा, ताकि बहुतों का नाश करे और उन्हें विनाश के लिए अर्पित कर दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खबरें’ अथवा ‘अफ़वाहें’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त हिब्रू क्रिया का अर्थ किसी को ‘प्रतिबंध के अधीन करना’ या ‘विनाश के लिए अर्पित करना’ हो सकता है; यह इससे पहले आए ‘नाश करना’ से अधिक विशिष्ट और प्रबल शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֻעוֹת
  choice: समाचार
  rationale: बहुवचन संज्ञा का अर्थ सुनी हुई बातें, समाचार या खबरें है। संदर्भ में ‘समाचार’ स्वाभाविक है और ‘अफ़वाहें’ की अनावश्यक अटकल से बचता है।
- source_word: יְבַהֲלֻהוּ
  choice: उसे घबरा देंगे
  rationale: पिएल रूप अचानक व्याकुल या आतंकित कर देने का भाव रखता है। ‘घबरा देंगे’ कारणवाचक बल को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना पूर्ण आतंक का अर्थ थोपे।
- source_word: מִמִּזְרָח וּמִצָּפוֹן
  choice: पूर्व और उत्तर से आने वाले
  rationale: दोनों दिशासूचक पदों के साथ מן स्रोत को दर्शाता है; यह रूप हिब्रू की समानांतर संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: וְיָצָא
  choice: तब वह ... निकल पड़ेगा
  rationale: יצא का मूल अर्थ बाहर जाना या निकलना है। ‘निकल पड़ेगा’ प्रसंग की तत्परता को व्यक्त करता है, पर क्रिया में ‘युद्ध करने’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: בְּחֵמָא גְדֹלָה
  choice: घोर क्रोध में
  rationale: חֵמָה तीव्र क्रोध या प्रकोप को दर्शाता है। ‘घोर क्रोध’ युद्ध-संदर्भ में सशक्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: לְהַשְׁמִיד
  choice: नाश करे
  rationale: שׁמד के हिफ़ील रूप का सामान्य अर्थ नष्ट करना है। ‘नाश करे’ सीधा है और विनाश की सीमा को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: וּלְהַחֲרִים
  choice: विनाश के लिए अर्पित कर दे
  rationale: חרם सामान्य नाश से अधिक विशिष्ट रूप से किसी को प्रतिबंध के अधीन करके विनाश के लिए अर्पित करने का भाव रख सकता है। यह अनुवाद पहले प्रयुक्त ‘नाश’ से भेद बनाए रखता है।
- source_word: רַבִּים
  choice: बहुतों
  rationale: यह सामान्य बहुवचनात्मक पद ‘बहुत से लोगों’ को दर्शाता है; ‘बहुतों’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: सैन्य-विनाश के संदर्भ में חרם का अनुवाद
  choice: उन्हें विनाश के लिए अर्पित कर दे
  alternative: बहुतों का पूरी तरह विनाश कर दे; बहुतों को प्रतिबंध के अधीन कर दे
  rationale: हिब्रू में לְהַשְׁמִיד और וּלְהַחֲרִים अलग क्रियाएँ हैं। चुना गया रूप दोनों को समानार्थी बनाकर חרם की विशिष्टता मिटाने के बजाय उसके विनाशार्थ अर्पण के भाव को सुरक्षित रखता है, पर कोई बाद की सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘समाचार’, ‘घोर क्रोध’ और ‘निकल पड़ेगा’ सामान्य पाठक के लिए स्पष्ट हैं। חרם की विशिष्टता बनाए रखने के लिए अपेक्षाकृत असामान्य ‘विनाश के लिए अर्पित’ रखा गया है और उसे पाद-टिप्पणी में स्पष्ट किया गया है।
