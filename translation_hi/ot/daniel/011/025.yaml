source:
  edition: WLC
  text: וְ/יָעֵר֩ כֹּח֨/וֹ וּ/לְבָב֜/וֹ עַל מֶ֣לֶךְ הַ/נֶּגֶב֮ בְּ/חַ֣יִל גָּדוֹל֒ וּ/מֶ֣לֶךְ הַ/נֶּ֗גֶב יִתְגָּרֶה֙ לַ/מִּלְחָמָ֔ה בְּ/חַֽיִל גָּד֥וֹל וְ/עָצ֖וּם עַד מְאֹ֑ד וְ/לֹ֣א יַעֲמֹ֔ד כִּֽי יַחְשְׁב֥וּ עָלָ֖י/ו מַחֲשָׁבֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/025.yaml
  text: And he will stir up his power and his heart against the king of the South with a great army[a], and the king of the South will engage in battle with a very great and mighty army, but he will not stand[b], for they will devise schemes against him.
translation:
  language: hi
  text: वह बड़ी सेना के साथ दक्षिण के राजा के विरुद्ध अपनी शक्ति और साहस जगाएगा। दक्षिण का राजा भी अत्यन्त बड़ी और शक्तिशाली सेना के साथ युद्ध के लिए उठ खड़ा होगा; फिर भी वह टिक नहीं सकेगा,[a] क्योंकि वे उसके विरुद्ध षड्यंत्र रचेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “वह खड़ा नहीं रहेगा।” अर्थात, वह टिक नहीं पाएगा या विजयी नहीं होगा।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “वे उसके विरुद्ध योजनाएँ बनाएँगे।” हिब्रू में शाब्दिक रूप से, “वे उसके विरुद्ध विचार सोचेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָעֵר כֹּחוֹ וּלְבָבוֹ
  choice: अपनी शक्ति और साहस को उभारेगा
  rationale: हिफ़ील क्रिया यहाँ शक्ति और आन्तरिक दृढ़ता को सक्रिय करने या जुटाने का भाव देती है। ‘साहस’ לְבָבוֹ के प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘शक्ति’ दोनों पदों का भेद बनाए रखती है।
- source_word: עַל מֶלֶךְ הַנֶּגֶב
  choice: दक्षिण के राजा के विरुद्ध
  rationale: दानिय्येल 11 में נֶגֶב भौगोलिक-दिशात्मक राजकीय पदनाम है; ‘दक्षिण का राजा’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: בְּחַיִל גָּדוֹל
  choice: एक विशाल सेना लेकर
  rationale: सैन्य प्रसंग में חַיִל का अर्थ सेना या सैन्य बल है। ‘विशाल सेना’ आकार और सामर्थ्य का स्वाभाविक संकेत देती है।
- source_word: יִתְגָּרֶה לַמִּלְחָמָה
  choice: युद्ध के लिए उठ खड़ा होगा
  rationale: हित्पएल रूप स्वयं को युद्ध के लिए उकसाने या युद्ध में उतरने का भाव देता है। यह हिन्दी प्रयोग उस सक्रिय तैयारी को स्पष्ट रखता है।
- source_word: בְּחַיִל גָּדוֹל וְעָצוּם עַד מְאֹד
  choice: एक अत्यन्त विशाल और शक्तिशाली सेना लेकर
  rationale: अनुवाद גָּדוֹל, עָצוּם और עַד מְאֹד—आकार, सामर्थ्य और तीव्रता—तीनों को व्यक्त करता है।
- source_word: וְלֹא יַעֲמֹד
  choice: फिर भी वह टिक नहीं सकेगा
  rationale: शाब्दिक ‘खड़ा नहीं रहेगा’ इस युद्ध-सन्दर्भ में स्थिर रहने, सामना कर पाने या सफल होने की असमर्थता का मुहावरा है। ‘टिक नहीं सकेगा’ अर्थ को स्वाभाविक रखते हुए मुहावरे की छवि भी बचाता है।
- source_word: יַחְשְׁבוּ עָלָיו מַחֲשָׁבוֹת
  choice: लोग उसके विरुद्ध षड्यंत्र रचेंगे
  rationale: सजातीय पदों वाली शाब्दिक अभिव्यक्ति ‘उसके विरुद्ध विचार सोचेंगे’ यहाँ शत्रुतापूर्ण योजनाएँ बनाने को सूचित करती है। ‘लोग’ हिब्रू के अनिर्दिष्ट बहुवचन कर्ता को अनावश्यक पहचान दिए बिना व्यक्त करता है।
theological_decisions:
- issue: וְלֹא יַעֲמֹד में सर्वनाम का संदर्भ
  choice: निकटतम कर्ता, दक्षिण के राजा, के लिए ‘वह’ बनाए रखा गया
  alternative: राजा का नाम दोहराकर संदर्भ को पूर्णतः स्पष्ट करना
  rationale: हिब्रू में केवल पुल्लिंग एकवचन सर्वनाम निहित है। निकटतम व्याकरणिक संदर्भ दक्षिण का राजा है, पर मूल की सर्वनामात्मक शैली और उसकी सम्भावित सूक्ष्म अस्पष्टता बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सैन्य पदावली स्पष्ट है; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दों से बचते हुए मूल की तीव्रता और सर्वनामगत तनाव सुरक्षित रखा गया है।
