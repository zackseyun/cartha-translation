source:
  edition: WLC
  text: וְ/עַל אֱלֹהֵ֤י אֲבֹתָי/ו֙ לֹ֣א יָבִ֔ין וְ/עַל חֶמְדַּ֥ת נָשִׁ֛ים וְ/עַֽל כָּל אֱל֖וֹהַּ לֹ֣א יָבִ֑ין כִּ֥י עַל כֹּ֖ל יִתְגַּדָּֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/037.yaml
  text: He will show no regard for the gods of his fathers[a], or for the desire of women, or for any god[b], because he will magnify himself above all.
translation:
  language: hi
  text: वह अपने पुरखाओं के देवताओं[a] की परवाह नहीं करेगा, न स्त्रियों की अभिलाषा[b] का, और न किसी देवता का भी; क्योंकि वह सबके ऊपर अपने आपको महान ठहराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने पुरखाओं के परमेश्वर।’ इब्रानी रूप बहुवचन (‘देवताओं’) है, पर कुछ लोग इसे इस्राएल के परमेश्वर के लिए प्रयुक्त परिचित मुहावरा मानते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, ‘स्त्रियों की अभिलाषा।’ इसका अर्थ ‘वह जिसे स्त्रियाँ चाहती हैं’ या ‘स्त्रियों की चाही हुई वस्तु या व्यक्ति’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אֲבֹתָיו
  choice: अपने पुरखाओं के देवताओं
  rationale: इब्रानी रचना रूप की दृष्टि से बहुवचन है। निकट संदर्भ में अन्य देवता का उल्लेख भी बहुवचन अर्थ का समर्थन करता है। ‘पुरखाओं’ से मूल के ‘पितरों’ का आशय सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: לֹא יָבִין
  choice: परवाह नहीं करेगा
  rationale: בין का मूल अर्थ ‘समझना/विचार करना’ है, पर עַל के साथ यहाँ किसी को महत्त्व या ध्यान न देने का भाव है। ‘परवाह नहीं करेगा’ इस मुहावरेदार अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֶמְדַּת נָשִׁים
  choice: स्त्रियों की अभिलाषा
  rationale: 'समास पदबंध अस्पष्ट है: इसका अर्थ स्त्रियों द्वारा चाही जाने वाली वस्तु या व्यक्ति हो सकता है। शाब्दिक-सहज अनुवाद इस अस्पष्टता को मुख्य पाठ में बनाए रखता है।'
- source_word: כָּל אֱלוֹהַּ
  choice: किसी देवता
  rationale: כָּל के साथ एकवचन אֱלוֹהַּ यहाँ वितरणात्मक अर्थ देता है—‘किसी भी देवता’। निषेधात्मक हिन्दी वाक्य में ‘किसी देवता’ स्वाभाविक है।
- source_word: כִּי עַל כֹּל יִתְגַּדָּל
  choice: क्योंकि वह अपने आपको सबसे ऊपर महान बनाएगा
  rationale: हित्पएल रूप आत्म-उन्नयन का भाव देता है और עַל כֹּל का अर्थ ‘सबसे ऊपर’ है। यह अनुवाद प्रतिवर्ती बल को बनाए रखता है।
theological_decisions:
- issue: חֶמְדַּת נָשִׁים की व्याख्या
  choice: मुख्य पाठ में अस्पष्ट पदबंध ‘स्त्रियों की अभिलाषा’ रखा गया।
  alternative: ‘जिसकी स्त्रियाँ अभिलाषा करती हैं’ अथवा ‘स्त्रियों का अभिलषित जन’।
  rationale: इब्रानी पदबंध वास्तविक रूप से अस्पष्ट है। इसे विवाह, संतान, किसी देवता या किसी मसीही अपेक्षा से निश्चित रूप से जोड़ना स्रोत से अधिक कहना होगा।
- issue: אֱלֹהֵי אֲבֹתָיו का वचन
  choice: बहुवचन ‘अपने पुरखाओं के देवताओं’।
  alternative: एकवचन ‘अपने पुरखाओं के परमेश्वर’।
  rationale: रूपात्मक बहुवचन और निकट संदर्भ बहुवचन को प्राथमिक बनाते हैं; फिर भी परिचित बाइबलीय मुहावरे के कारण एकवचन पाठ महत्त्वपूर्ण विकल्प है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘परवाह नहीं करेगा’ मुहावरेदार है, जबकि ‘स्त्रियों की अभिलाषा’ स्रोत की जानबूझकर अनिर्णीत अस्पष्टता को सुरक्षित रखता है।
