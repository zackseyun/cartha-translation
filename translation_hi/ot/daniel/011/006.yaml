source:
  edition: WLC
  text: וּ/לְ/קֵ֤ץ שָׁנִים֙ יִתְחַבָּ֔רוּ וּ/בַ֣ת מֶֽלֶךְ הַ/נֶּ֗גֶב תָּבוֹא֙ אֶל מֶ֣לֶךְ הַ/צָּפ֔וֹן לַ/עֲשׂ֖וֹת מֵישָׁרִ֑ים וְ/לֹֽא תַעְצֹ֞ר כּ֣וֹחַ הַ/זְּר֗וֹעַ וְ/לֹ֤א יַעֲמֹד֙ וּ/זְרֹע֔/וֹ וְ/תִנָּתֵ֨ן הִ֤יא וּ/מְבִיאֶ֨י/הָ֙ וְ/הַ/יֹּ֣לְדָ֔/הּ וּ/מַחֲזִקָ֖/הּ בָּ/עִתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/006.yaml
  text: At the end of years they will join together[a], and the daughter of the king of the South will come to the king of the North to make an agreement. But she will not retain the strength of her arm, and he and his arm will not stand; and she will be given up, along with those who brought her, and the one who fathered her[b], and the one who supported her in those times.
translation:
  language: hi
  text: वर्षों के बाद वे आपस में जुड़ेंगे। दक्षिण के राजा की बेटी उत्तर के राजा के पास समझौता करने[a] आएगी। पर वह अपनी भुजा की शक्ति बनाए नहीं रख सकेगी; न वह टिकेगा, न उसकी भुजा। वह और उसे लानेवाले, उसका जनक[b] और उन दिनों उसे सहारा देनेवाला—सब सौंप दिए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सीधाइयाँ/न्यायसंगत शर्तें स्थापित करने।” इसका अर्थ “उचित शर्तें तय करने” या “न्यायसंगत समझौता करने” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “जनक” इब्रानी के पुल्लिंग कृदंत के अनुसार है। कुछ अनुवाद इसे “संतान” मानते हैं या इसका संकेत किसी दूसरे व्यक्ति की ओर समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְקֵץ שָׁנִים
  choice: कुछ वर्षों के अंत में
  rationale: קֵץ का मूल अर्थ ‘अंत’ है; हिन्दी में ‘कुछ वर्षों के अंत में’ समय बीतने का भाव स्पष्ट करते हुए इब्रानी संरचना को निकटता से रखता है।
- source_word: יִתְחַבָּרוּ
  choice: वे आपस में जुड़ेंगे
  rationale: हित्पएल रूप परस्पर जुड़ने या गठबंधन करने का संकेत देता है। ‘आपस में जुड़ेंगे’ राजनीतिक संबंध की संभावना रखता है, पर क्रिया से अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: מֶלֶךְ הַנֶּגֶב / מֶלֶךְ הַצָּפוֹן
  choice: दक्षिण का राजा / उत्तर का राजा
  rationale: ये दानिय्येल 11 में प्रयुक्त दिशात्मक-राजनीतिक पद हैं; ‘दक्षिण’ और ‘उत्तर’ सरल तथा सुसंगत हैं।
- source_word: לַעֲשׂוֹת מֵישָׁרִים
  choice: समझौता करने
  rationale: מֵישָׁרִים का शाब्दिक क्षेत्र सीधाई, न्यायसंगतता और उचित शर्तों को समेटता है। राजनयिक प्रसंग में ‘समझौता’ स्वाभाविक है; शाब्दिक बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: לֹא תַעְצֹר כּוֹחַ הַזְּרוֹעַ
  choice: अपनी भुजा की शक्ति बनाए नहीं रख सकेगी
  rationale: עצר का अर्थ थामे या बनाए रखना है और זְרוֹעַ शक्ति का रूपक हो सकता है। अनुवाद शक्ति स्पष्ट करता है और ‘भुजा’ का मूल रूपक भी बचाता है।
- source_word: וְלֹא יַעֲמֹד וּזְרֹעוֹ
  choice: न वह टिकेगा, न उसकी भुजा
  rationale: पुल्लिंग एकवचन और ‘उसकी भुजा’ को अलग-अलग रखते हुए עמד के स्थिर रहने या कायम रहने के अर्थ को ‘टिकेगा’ से व्यक्त किया गया है।
- source_word: וְתִנָּתֵן הִיא
  choice: वह स्त्री ... सौंप दिए जाएँगे
  rationale: נתן का निफ़अल यहाँ निष्क्रिय है—सौंप दिया जाना। संयुक्त सूची के कारण हिन्दी में अंत में बहुवचन निष्क्रिय क्रिया स्वाभाविक है।
- source_word: וּמְבִיאֶיהָ
  choice: उसे लानेवाले
  rationale: בוא के कृदंत का सीधा अर्थ उसे लाने या पहुँचानेवाले लोगों से है; ‘लानेवाले’ अनावश्यक पहचान जोड़े बिना इसे व्यक्त करता है।
- source_word: וְהַיֹּלְדָהּ
  choice: उसका जनक
  rationale: मसोरेटिक पाठ में कृदंत पुल्लिंग एकवचन है। ‘जनक’ इस व्याकरणिक रूप को संक्षेप और स्पष्टता से व्यक्त करता है, जबकि पाठगत/संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּמַחֲזִקָהּ בָּעִתִּים
  choice: उन दिनों उसे सहारा देनेवाला
  rationale: חזק का हिफ़ईल रूप मजबूत करने, संभालने या समर्थन देने का अर्थ देता है। ‘सहारा देनेवाला’ निजी या राजनीतिक समर्थन—दोनों की संभावना खुली रखता है; बहुवचन עִתִּים को ‘उन दिनों’ से व्यक्त किया गया है।
theological_decisions:
- issue: וְלֹא יַעֲמֹד में पुल्लिंग कर्ता की पहचान
  choice: ‘वह टिकेगा’ द्वारा पुल्लिंग रखा गया, पर व्यक्ति का नाम स्पष्ट रूप से नहीं जोड़ा गया
  alternative: ‘उत्तर का राजा टिकेगा नहीं’
  rationale: संदर्भ में उत्तर का राजा संभावित अभिप्रेत है, किंतु इब्रानी केवल पुल्लिंग सर्वनाम-सूचक क्रिया देता है। अनुवाद वास्तविक संदर्भगत संभावना को खुला रखता है।
- issue: וְהַיֹּלְדָהּ का संदर्भ
  choice: मसोरेटिक पुल्लिंग रूप के अनुसार ‘उसका जनक’
  alternative: ‘उसकी संतान’ या किसी अन्य संबंधित व्यक्ति का संकेत
  rationale: प्राप्त पाठ पुल्लिंग कृदंत का समर्थन करता है, पर प्राचीन अनुवाद-परंपरा और संदर्भ के कारण दूसरा अर्थ संभव माना गया है; इसे पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली रखी गई है। ‘भुजा’ जैसे मूल रूपक को बचाते हुए उसके साथ ‘शक्ति’ जोड़ा गया है। दिशात्मक पदों को ‘दक्षिण का राजा’ और ‘उत्तर का राजा’ के रूप में संक्षिप्त और सुसंगत रखा गया है।
