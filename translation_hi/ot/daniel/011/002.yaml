reference: Daniel 11:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֕ה אֱמֶ֖ת אַגִּ֣יד לָ֑/ךְ הִנֵּה עוֹד֩ שְׁלֹשָׁ֨ה מְלָכִ֜ים עֹמְדִ֣ים לְ/פָרַ֗ס וְ/הָֽ/רְבִיעִי֙ יַעֲשִׁ֤יר עֹֽשֶׁר גָּדוֹל֙ מִ/כֹּ֔ל וּ/כְ/חֶזְקָת֣/וֹ בְ/עָשְׁר֔/וֹ יָעִ֣יר הַ/כֹּ֔ל אֵ֖ת מַלְכ֥וּת יָוָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/011/002.yaml
  text: 'And now I will tell you the truth: behold[a], three more kings will arise for Persia, and the fourth will become far richer than all of them; and when he becomes strong through his riches[c][b], he will stir up everyone against the kingdom of Greece.'
translation:
  language: hi
  text: 'और अब मैं तुम्हें सत्य बताऊँगा: देखो, फ़ारस में तीन और राजा उठेंगे, और चौथा उन सब से कहीं अधिक धनवान हो जाएगा; और जब वह अपने धन के कारण शक्तिशाली हो जाएगा, तब वह सब लोगों को यूनान के राज्य के विरुद्ध उकसाएगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालसूचक עַתָּה दोनों को स्वाभाविक हिन्दी में बनाए रखता है और प्रकाशना के अगले चरण का संकेत देता है।
- source_word: אֱמֶת אַגִּיד לָךְ
  choice: मैं तुम्हें सत्य बताऊँगा
  rationale: נגד के हिफ़ील रूप का अर्थ यहाँ ‘बताना/प्रकट करना’ है; यह वाक्य स्रोत के कर्म ‘सत्य’ को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली भविष्यसूचक शक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: עוֹד שְׁלֹשָׁה מְלָכִים
  choice: तीन और राजा
  rationale: עוֹד की अतिरिक्तता का भाव ‘और’ से सहज रूप में व्यक्त होता है।
- source_word: עֹמְדִים לְפָרַס
  choice: फ़ारस के लिए ... उठ खड़े होंगे
  rationale: राजकीय उत्तराधिकार के प्रसंग में עמד का अर्थ ‘उठ खड़ा होना’ है; לְ का संबंधसूचक/हितसूचक रूप ‘के लिए’ से सुरक्षित रहता है, यद्यपि ‘फ़ारस में’ भी प्रसंगानुकूल सम्भव है।
- source_word: יַעֲשִׁיר עֹשֶׁר גָּדוֹל מִכֹּל
  choice: उन सब से कहीं अधिक धनवान हो जाएगा
  rationale: क्रिया और उसी मूल की संज्ञा की तीव्रता तथा מִן की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּכְחֶזְקָתוֹ בְעָשְׁרוֹ
  choice: जब वह अपने धन के कारण शक्तिशाली हो जाएगा
  rationale: כְ को कालगत/परिस्थितिगत ‘जब’ और בְ को साधन अथवा आधार बताने वाले ‘के कारण’ के रूप में समझा गया है।
- source_word: יָעִיר
  choice: उकसाएगा
  rationale: עור के हिफ़ील का ‘जगाना, भड़काना, सक्रिय करना’ भाव इस राजनीतिक-सैन्य प्रसंग में ‘उकसाना’ से स्पष्ट होता है।
- source_word: הַכֹּל
  choice: सब लोगों को
  rationale: शाब्दिक ‘सब’ को प्रसंगानुसार व्यक्तियों के रूप में समझकर ‘सब लोगों’ कहा गया है, जिससे राजनीतिक-सैन्य लामबंदी का आशय स्पष्ट होता है।
- source_word: אֵת מַלְכוּת יָוָן
  choice: यूनान के राज्य के विरुद्ध
  rationale: עור और प्रसंग के साथ אֵת-वाक्यांश का आशय विरोध की दिशा में है; מַלְכוּת को ‘राज्य’ और יָוָן को ‘यूनान’ अनूदित किया गया है।
theological_decisions:
- issue: अंतिम उपवाक्य का ऐतिहासिक-राजनीतिक आशय
  choice: चौथा फ़ारसी राजा अपने अधीन सब लोगों को यूनान के राज्य के विरुद्ध सक्रिय या उत्तेजित करेगा।
  alternative: वह सब कुछ, जिसमें यूनान का राज्य भी सम्मिलित है, उकसाएगा; अथवा वह यूनान के राज्य की ओर से सबको उकसाएगा।
  rationale: यह मुख्यतः शब्दार्थ और वाक्य-विन्यास का प्रश्न है। इस प्रसंग में עור, הַכֹּל और उसके बाद אֵת מַלְכוּת יָוָן का मेल विरोधी दिशा को सबसे स्वाभाविक रूप से व्यक्त करता है, पर अनुवाद किसी विशेष ऐतिहासिक राजा की पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक नहीं बल्कि एकवचन निकट संबोधन ‘तुम्हें’, क्योंकि मूल में לָךְ एकवचन है। शैली भविष्यसूचक और गरिमापूर्ण रखी गई है, पर ‘निहारो’ जैसे अप्रचलित शब्दों से बचते हुए ‘देखो’ चुना गया है। मूल की अस्पष्टताओं को व्याख्यात्मक विस्तार से अनावश्यक रूप से नहीं बाँधा गया।
