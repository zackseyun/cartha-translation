source:
  edition: WLC
  text: וְ/עַתָּ֣ה שְׁמַ֣ע אֱלֹהֵ֗י/נוּ אֶל תְּפִלַּ֤ת עַבְדְּ/ךָ֙ וְ/אֶל תַּ֣חֲנוּנָ֔י/ו וְ/הָאֵ֣ר פָּנֶ֔י/ךָ עַל מִקְדָּשְׁ/ךָ֖ הַ/שָּׁמֵ֑ם לְמַ֖עַן אֲדֹנָֽ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/017.yaml
  text: And now[a], our God, hear the prayer of your servant and his pleas for mercy, and let your face shine upon your sanctuary, which lies desolate, for the Lord’s sake.
translation:
  language: hi
  text: और अब, हे हमारे परमेश्वर, अपने दास की प्रार्थना और दया के लिए उसकी विनतियाँ सुन, और अपने उस पवित्रस्थान पर अपने मुख का प्रकाश चमका जो उजाड़ पड़ा है—प्रभु के निमित्त[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे प्रभु, अपने ही निमित्त।” इब्रानी में सीधे संबोधन के बीच ईश्वरीय उपाधि “प्रभु” तीसरे पुरुष में आई है।
    reason: वैकल्पिक पाठ और इब्रानी वाक्यरूप की वास्तविक असामान्यता को स्पष्ट करना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालसूचक עַתָּה दोनों को रखते हुए यह दानिय्येल की नई विनती का स्वाभाविक आरम्भ है।
- source_word: שְׁמַע אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर, ... सुन
  rationale: प्रत्यक्ष संबोधन और एकवचन आज्ञार्थक प्रार्थना-भाषा को स्पष्ट और गरिमापूर्ण ढंग से रखा गया है।
- source_word: תְּפִלַּת עַבְדְּךָ
  choice: अपने दास की प्रार्थना
  rationale: संबंधसूचक पदबंध को सुरक्षित रखते हुए עֶבֶד को विनम्र ईश्वरीय संबोधन के संदर्भ में ‘दास’ किया गया है।
- source_word: תַּחֲנוּנָיו
  choice: दया के लिए उसकी विनतियाँ
  rationale: शब्द अनुग्रह अथवा दया पाने के लिए की गई गहरी याचनाओं को दर्शाता है; यह आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: וְהָאֵר פָּנֶיךָ
  choice: अपने मुख का प्रकाश चमका
  rationale: ईश्वरीय कृपा व्यक्त करने वाले ‘मुख चमकाने’ के आशीष-संबंधी रूपक को मिटाए बिना हिन्दी में स्वाभाविक बनाया गया है।
- source_word: עַל מִקְדָּשְׁךָ
  choice: अपने ... पवित्रस्थान पर
  rationale: מִקְדָּשׁ का अर्थ केवल भवन के रूप में ‘मन्दिर’ से व्यापक है; ‘पवित्रस्थान’ उसकी पवित्र और परमेश्वर-संबंधी प्रकृति बनाए रखता है।
- source_word: הַשָּׁמֵם
  choice: जो उजाड़ पड़ा है
  rationale: विशेषण को संबंधवाचक उपवाक्य में व्यक्त करने से पवित्रस्थान की जारी उजड़ी दशा स्वाभाविक हिन्दी में सामने आती है।
- source_word: לְמַעַן אֲדֹנָי
  choice: प्रभु के निमित्त
  rationale: לְמַעַן प्रयोजन अथवा आधार बताता है और אֲדֹנָי को, सीधे संबोधन के भीतर भी, तीसरे पुरुष की ईश्वरीय उपाधि के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: לְמַעַן אֲדֹנָי में सीधे संबोधन के भीतर ईश्वरीय उपाधि का तीसरे पुरुष में प्रयोग
  choice: प्रभु के निमित्त
  alternative: हे प्रभु, अपने ही निमित्त
  rationale: इब्रानी पाठ सर्वनाम के बजाय אֲדֹנָי उपाधि का प्रयोग करता है। मुख्य पाठ में उसी तनाव और वाक्यरूप को रखा गया है; अधिक स्वाभाविक प्रत्यक्ष-संबोधन वाला अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। परमेश्वर के प्रति एकवचन आज्ञार्थक ‘सुन’ और ‘चमका’ मूल इब्रानी की सीधी विनती तथा निकट संबोधन को रखते हैं; शब्दावली सामान्य पाठक के लिए बोधगम्य है।
