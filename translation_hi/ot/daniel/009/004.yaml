  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। ‘हे’ से सीधे संबोधन की गंभीरता बनी रहती है। वाक्य अगले पद में जारी रहने के कारण अंत में पूर्णविराम नहीं लगाया गया।
