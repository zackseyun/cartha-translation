base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/004.yaml
  text: And I prayed to Yahweh my God and confessed and said[a], “Please, Lord, the great and awesome God[b], who keeps the covenant and steadfast love for those who love him and keep his commandments,”
translation:
  language: hi
  text: और मैंने अपने परमेश्वर यहोवा से प्रार्थना की, अपने पापों को स्वीकार किया और कहा, “हे प्रभु, हे महान और भययोग्य[a] परमेश्वर, जो उनसे प्रेम करनेवालों और उसकी आज्ञाओं का पालन करनेवालों के लिए वाचा और अटल प्रेम[b] को निभाता है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विस्मयकारी।” इब्रानी शब्द ऐसे व्यक्ति का बोध कराता है जो श्रद्धामिश्रित भय उत्पन्न करता है।
    reason: lexical_alternative
  - marker: b
    text: या “वाचा और वाचा की निष्ठा।” इब्रानी חֶסֶד में अटल प्रेम, दया और वाचागत निष्ठा के भाव निहित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפַּלְלָה
  choice: और मैंने ... प्रार्थना की
  rationale: वाव-क्रमिक क्रिया कथा में अगली कार्रवाई बताती है; हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: לַיהוָה אֱלֹהַי
  choice: अपने परमेश्वर यहोवा से
  rationale: ל प्रार्थना के संबोधित व्यक्ति को चिह्नित करता है; יהוה को वाचा-संबंधी व्यक्तिगत नाम ‘यहोवा’ के रूप में और प्रथम पुरुष प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: וָאֶתְוַדֶּה
  choice: पापों को स्वीकार किया
  rationale: हित्पएल में ידה यहाँ पाप स्वीकार करने का अर्थ देता है; निहित कर्म को स्पष्ट करने से आधुनिक हिन्दी में आशय सहज बनता है।
- source_word: וָאֹמְרָה אָנָּא אֲדֹנָי
  choice: और कहा, “हे प्रभु
  rationale: אָנָּא विनती और भावपूर्ण संबोधन का कण है; हिन्दी का ‘हे’ प्रत्यक्ष संबोधन और आग्रह का भाव स्वाभाविक ढंग से देता है।
- source_word: הָאֵל הַגָּדוֹל וְהַנּוֹרָא
  choice: हे महान और भययोग्य परमेश्वर
  rationale: נוֹרָא श्रद्धामिश्रित भय उत्पन्न करनेवाले को दर्शाता है; ‘भययोग्य’ न तो केवल आतंक का अर्थ देता है, न आधुनिक बोलचाल के ‘अद्भुत’ तक सीमित होता है।
- source_word: שֹׁמֵר הַבְּרִית וְהַחֶסֶד
  choice: जो ... वाचा और अटल प्रेम बनाए रखता है
  rationale: सहभागी रूप परमेश्वर के स्थायी चरित्रगत कार्य को व्यक्त करता है; חֶסֶד की निष्ठावान, दयालु और वाचागत प्रेम-भावना को ‘अटल प्रेम’ व्यक्त करता है।
- source_word: לְאֹהֲבָיו וּלְשֹׁמְרֵי מִצְוֺתָיו
  choice: अपने प्रेम रखनेवालों और अपनी आज्ञाओं का पालन करनेवालों के लिए
  rationale: दोनों ל-वाक्यांश लाभार्थी/संबंधित जनों को बताते हैं; समानांतर रचना और दोनों तृतीय पुरुष प्रत्यय सुरक्षित रखे गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में टेट्राग्रामटन प्रत्यक्ष है। हिन्दी पाठकों में पहचाना जानेवाला व्यक्तिगत नाम ‘यहोवा’ इसे उपाधि אֲדֹנָי (‘प्रभु’) से अलग रखता है।
- issue: חֶסֶד का वाचा-संदर्भित अर्थ
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा / करुणा
  rationale: शब्द में प्रेम, दया और संबंधगत निष्ठा एक साथ निहित हैं; किसी एक आयाम तक सीमित करने के बजाय ‘अटल प्रेम’ व्यापकता बनाए रखता है।
- issue: נוֹרָא में भय और विस्मय का तनाव
  choice: भययोग्य
  alternative: विस्मयकारी / भयानक
  rationale: ‘भययोग्य’ श्रद्धामिश्रित भय को सुरक्षित रखता है और परमेश्वर को केवल आतंककारी बताने से बचता है।
