source:
  edition: WLC
  text: אֲדֹנָ֗/י כְּ/כָל צִדְקֹתֶ֨/ךָ֙ יָֽשָׁב נָ֤א אַפְּ/ךָ֙ וַ/חֲמָ֣תְ/ךָ֔ מֵ/עִֽירְ/ךָ֥ יְרוּשָׁלִַ֖ם הַר קָדְשֶׁ֑/ךָ כִּ֤י בַ/חֲטָאֵ֨י/נוּ֙ וּ/בַ/עֲוֺנ֣וֹת אֲבֹתֵ֔י/נוּ יְרוּשָׁלִַ֧ם וְ/עַמְּ/ךָ֛ לְ/חֶרְפָּ֖ה לְ/כָל סְבִיבֹתֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/016.yaml
  text: Lord[a], according to all your righteous acts, please let your anger and your wrath turn away from your city Jerusalem, your holy mountain; because through our sins and the iniquities of our fathers[b], Jerusalem and your people have become a reproach to all those around us.
translation:
  language: hi
  text: हे प्रभु, अपने सभी धर्मपूर्ण कार्यों[a] के अनुसार, कृपा करके अपना क्रोध और प्रकोप अपने नगर यरूशलेम—अपने पवित्र पर्वत—से हटा लीजिए; क्योंकि हमारे पापों और हमारे पुरखाओं[b] के अधर्म के कारण यरूशलेम और आपकी प्रजा हमारे आसपास के सभी लोगों के लिए निन्दा का विषय हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “अपने न्याय के सभी कार्यों” या “अपनी समस्त धार्मिकता” भी हो सकता है। इब्रानी शब्द बहुवचन में है और सम्भवतः केवल एक अमूर्त गुण के बजाय परमेश्वर के धर्मपूर्ण कार्यों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: “हमारे पुरखाओं” से आशय लोगों की पिछली पीढ़ियों, अर्थात उनके पूर्वजों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: सीधे सम्बोधन का स्वाभाविक, गरिमापूर्ण हिन्दी रूप; ‘हे’ इब्रानी सम्बोधन-बल को स्पष्ट करता है।
- source_word: כְּכָל צִדְקֹתֶיךָ
  choice: अपने सब धर्ममय कामों के अनुसार
  rationale: बहुवचन צִדְקֹתֶיךָ को अमूर्त ‘धार्मिकता’ तक सीमित न करके परमेश्वर के ठोस धर्मपूर्ण कार्यों के रूप में व्यक्त करता है।
- source_word: יָשָׁב נָא אַפְּךָ וַחֲמָתְךָ
  choice: कृपा करके अपना क्रोध और प्रकोप ... हटा लीजिए
  rationale: נָא की विनती और שוב के ‘मुड़ जाने/हट जाने’ के भाव को स्वाभाविक आदरसूचक हिन्दी में व्यक्त करता है।
- source_word: מֵעִירְךָ יְרוּשָׁלַם הַר קָדְשֶׁךָ
  choice: अपने नगर यरूशलेम से, जो आपका पवित्र पर्वत है
  rationale: यरूशलेम और ‘आपका पवित्र पर्वत’ के समानाधिकरण सम्बन्ध को स्पष्ट रखते हुए हिन्दी में संभावित भ्रम से बचाता है।
- source_word: בַחֲטָאֵינוּ וּבַעֲוֹנוֹת אֲבֹתֵינוּ
  choice: हमारे पापों और हमारे पुरखाओं के अधर्म के कारण
  rationale: ב का कारणसूचक भाव और חטא तथा עון के बीच पाप/अधर्म का अर्थभेद बनाए रखता है; ‘पुरखा’ पूर्वज पीढ़ियों का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: לְחֶרְפָּה לְכָל סְבִיבֹתֵינוּ
  choice: हमारे चारों ओर के सब लोगों के लिए निन्दा का विषय बन गए हैं
  rationale: לְחֶרְפָּה से व्यक्त परिणामी अपमानजनक दशा को सहज हिन्दी में प्रकट करता है; סְבִיבֹתֵינוּ का आशय आसपास के लोगों/जातियों से है।
theological_decisions:
- issue: צִדְקֹתֶיךָ में परमेश्वर की धार्मिकता और उसके कार्यों का सम्बन्ध
  choice: अपने सब धर्ममय कामों
  alternative: अपनी समस्त धार्मिकता; अपने न्याय के सब कामों
  rationale: बहुवचन ठोस कार्यों की ओर संकेत करता है, पर ‘धर्ममय’ उनके नैतिक और न्यायपूर्ण चरित्र दोनों को खुला रखता है।
- issue: वर्तमान समुदाय और पूर्वजों की सामूहिक दोष-स्वीकृति
  choice: हमारे पापों और हमारे पुरखाओं के अधर्म
  alternative: हमारे और हमारे पूर्वजों के पाप
  rationale: मूल पाठ वर्तमान पीढ़ी और पिछली पीढ़ियों दोनों को स्पष्टतः अलग रखता है तथा חטא और עון का शब्दगत भेद भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक प्रार्थना-शैली रखी गई है। ‘धर्ममय काम’, ‘अधर्म’ और ‘निन्दा का विषय’ गरिमापूर्ण हैं, पर सामान्य पाठक के लिए बोधगम्य भी हैं।
