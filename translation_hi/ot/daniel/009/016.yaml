review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the plea, the plural sense of God's righteous deeds, the paired terms for anger, corporate guilt, and Jerusalem and God's people as an object of reproach. However, the relative clause ‘जो आपका पवित्र पर्वत है’ makes Jerusalem itself straightforwardly identical with a mountain in Hindi. The Hebrew uses apposition, which is better retained without this potentially misleading relative-clause construction. The final Hebrew clause is verbless; Hindi ‘निन्दा का विषय हैं’ represents its stated condition directly.
  naturalness: The prayer register is appropriate. ‘धर्ममय कामों’ is understandable but less idiomatic than ‘धर्मपूर्ण कार्यों’; ‘हमारे आसपास के सभी लोगों’ is also more natural than ‘हमारे चारों ओर के सब लोगों।’
  terminology: ‘प्रभु,’ ‘क्रोध,’ ‘प्रकोप,’ ‘पाप,’ ‘अधर्म,’ and ‘प्रजा’ are suitable. ‘धर्मपूर्ण कार्यों’ preserves the sense of plural righteous deeds without narrowing it to judicial acts alone.
  issues:
  - severity: medium
    issue: यरूशलेम और ‘आपका पवित्र पर्वत’ का सम्बन्ध
    rationale: ‘यरूशलेम से, जो आपका पवित्र पर्वत है’ Hindi में यरूशलेम नगर को सीधे पर्वत कहता है। मूल इब्रानी में दोनों पद समानाधिकरण में हैं; विराम-चिह्नों से उसे अधिक निकटता से रखा जा सकता है।
  - severity: low
    issue: ‘धर्ममय कामों’ की शैली
    rationale: यह अर्थतः संभव है, पर आधुनिक मानक हिन्दी में ‘धर्मपूर्ण कार्यों’ अधिक स्वाभाविक और स्पष्ट है।
  - severity: low
    issue: अन्तिम विधेय में ‘बन गए हैं’
    rationale: मूल में कोई स्पष्ट ‘हो जाना’ क्रिया नहीं है; ‘निन्दा का विषय हैं’ वर्तमान अपमानजनक स्थिति को अधिक सीधे व्यक्त करता है।
