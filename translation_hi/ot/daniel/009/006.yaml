id: DAN.9.6
reference: Daniel 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֤א שָׁמַ֨עְנוּ֙ אֶל עֲבָדֶ֣י/ךָ הַ/נְּבִיאִ֔ים אֲשֶׁ֤ר דִּבְּרוּ֙ בְּ/שִׁמְ/ךָ֔ אֶל מְלָכֵ֥י/נוּ שָׂרֵ֖י/נוּ וַ/אֲבֹתֵ֑י/נוּ וְ/אֶ֖ל כָּל עַ֥ם הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/006.yaml
  text: We have not listened to your servants the prophets[a], who spoke in your name to our kings, our officials, our fathers[b], and to all the people of the land.
translation:
  language: hi
  text: हमने तेरे दास नबियों की नहीं सुनी[a], जो तेरे नाम से हमारे राजाओं, हमारे अधिकारियों, हमारे पुरखाओं[b] और देश के सब लोगों से बोले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमने आज्ञा नहीं मानी।” इब्रानी क्रिया में केवल सुनना ही नहीं, बल्कि ध्यान देकर उसके अनुसार चलना भी शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हमारे पिताओं।” यहाँ पिछली पीढ़ियों के पुरखे अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ אֶל
  choice: हमने … की नहीं सुनी
  rationale: שׁמע के साथ אֶל का अर्थ किसी की बात सुनना और उस पर ध्यान देना है। हिन्दी मुहावरा ‘किसी की सुनना’ साधारणतः केवल आवाज़ सुनने से अधिक, उसकी बात मानने का भाव भी खुला रखता है।
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: तेरे दास नबियों
  rationale: यह समानाधिकरण पदबंध है—नबी परमेश्वर के सेवक हैं। ‘दास’ मूल עבד के समर्पित सेवा-भाव और प्रचलित बाइबिलीय गरिमा, दोनों को बनाए रखता है।
- source_word: דִּבְּרוּ בְּשִׁמְךָ
  choice: तेरे नाम से … बोले
  rationale: בְּשֵׁם अधिकार और प्रतिनिधित्व के साथ बोलने का संकेत देता है। ‘तेरे नाम से’ मूल मुहावरे के निकट रहते हुए यह अर्थ सुरक्षित रखता है।
- source_word: שָׂרֵינוּ
  choice: हमारे अधिकारियों
  rationale: שׂרים शासन करने वाले प्रधानों या पदाधिकारियों को दर्शाता है। आधुनिक हिन्दी में ‘अधिकारी’ इस व्यापक शासकीय भूमिका को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲבֹתֵינוּ
  choice: हमारे पुरखाओं
  rationale: शाब्दिक अर्थ ‘हमारे पिता’ है, पर यहाँ पूर्ववर्ती पीढ़ियों के पुरुष पूर्वज अभिप्रेत हैं। ‘पुरखे’ आधुनिक हिन्दी में इस ऐतिहासिक अर्थ को स्पष्ट रखते हैं और मूल के पुल्लिंग रूप को भी नहीं मिटाते।
- source_word: כָּל עַם הָאָרֶץ
  choice: देश के सब लोगों
  rationale: עַם एक सामूहिक संज्ञा है और הָאָרֶץ यहाँ देश/भूमि को सूचित करता है। यह हिन्दी रूप पूरे जनसमुदाय का स्वाभाविक बोध कराता है।
theological_decisions:
- issue: שָׁמַעְנוּ को केवल सुनने या आज्ञा मानने के अर्थ में प्रस्तुत करना
  choice: हमने … की नहीं सुनी
  alternative: हमने … की आज्ञा नहीं मानी
  rationale: प्रार्थना के संदर्भ में अवज्ञा निहित है, पर इब्रानी क्रिया सुनने, ध्यान देने और मानने के बीच की अर्थ-व्याप्ति रखती है। ‘की नहीं सुनी’ हिन्दी में यही तनाव सुरक्षित रखता है।
- issue: אֲבֹתֵינוּ को ‘पिता’, ‘पुरखे’ या लिंग-निरपेक्ष ‘पूर्वज’ कहना
  choice: हमारे पुरखाओं
  alternative: हमारे पिताओं / हमारे पूर्वजों
  rationale: संदर्भ में पिछली पीढ़ियाँ अभिप्रेत हैं। ‘पुरखे’ शाब्दिक ‘पिताओं’ की अपेक्षा अधिक स्वाभाविक है, फिर भी मूल के पुरुष-सूचक रूप को लिंग-निरपेक्ष बनाकर समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर के लिए निकट और पारंपरिक एकवचन संबोधन ‘तेरे’ अपनाया गया है। वाक्य-क्रम हिन्दी के अनुसार स्वाभाविक है, जबकि सूची और भविष्यद्वक्ताओं के दिव्य अधिकार का मूल ढाँचा सुरक्षित रखा गया है।
