  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुनःस्थापित’ जैसे प्रशासनिक शब्द के बजाय ‘फिर से बसाने’ का प्रयोग नगर-संदर्भ को सहज बनाता है। ‘अभिषिक्त जन’ और ‘प्रधान’ व्याख्यात्मक पहचान को खुला रखते हैं।
