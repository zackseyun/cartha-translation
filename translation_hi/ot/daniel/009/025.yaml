- source_word: עַד מָשִׁיחַ נָגִיד
  choice: एक अभिषिक्त जन, एक प्रधान, तक
  rationale: מָשִׁיחַ का मूल अर्थ ‘अभिषिक्त जन’ रखकर उसकी पहचान को खुला छोड़ता है; נָגִיד को नेतृत्वसूचक ‘प्रधान’ कहा गया है, बिना राजवंशीय अर्थ अनिवार्य किए।
