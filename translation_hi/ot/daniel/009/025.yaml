theological_decisions:
- issue: מָשִׁיחַ को विशिष्ट उपाधि ‘मसीह’ माना जाए या सामान्य अर्थ ‘अभिषिक्त जन’
  choice: मुख्य पाठ में ‘एक अभिषिक्त जन’
  alternative: ‘मसीह, प्रधान’ अथवा ‘मसीह प्रधान’
  rationale: इब्रानी शब्द स्वयं किसी अभिषिक्त व्यक्ति को सूचित कर सकता है और इस पद में उसकी विशिष्ट पहचान विवादित है। मुख्य पाठ शाब्दिक अर्थ और अनिश्चितता बनाए रखता है; पारंपरिक मसीही पाठ पादटिप्पणी में दिया गया है।
- issue: שָׁבֻעִים की कालगत इकाई
  choice: मुख्य पाठ में ‘सप्ताह’
  alternative: ‘सात-सात के कालखंड’ अथवा व्याख्यात्मक ‘वर्षों के सप्ताह’
  rationale: ‘सप्ताह’ भाषिक और परंपरागत रूप से उचित है, पर शब्द मूलतः सात की इकाइयों को भी सूचित कर सकता है। कालक्रम को अनावश्यक रूप से निश्चित न करने के लिए विकल्प पादटिप्पणी में रखा गया है।
- issue: सात और बासठ सप्ताहों के बीच वाक्य-विभाजन
  choice: सात सप्ताह के बाद अर्धविराम, और पुनर्बहाली को बासठ सप्ताह से जोड़ना
  alternative: सात और बासठ सप्ताहों को एक संयुक्त अवधि बनाकर अभिषिक्त जन तक जोड़ना
  rationale: WLC के मासोरेटिक उच्चारण-चिह्न सात सप्ताह के बाद प्रमुख विभाजन का समर्थन करते हैं। फिर भी पद की विराम-व्यवस्था और कालक्रम पर व्याख्यात्मक मतभेद विद्यमान हैं; अनुवाद स्रोत-पाठ की चिह्नित संरचना का अनुसरण करता है।
