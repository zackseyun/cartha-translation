  yaml_path: translation/ot/daniel/009/025.yaml
  text: 'So know and understand: from the issuing of the word to restore and rebuild Jerusalem until an anointed one[a], a prince, there will be seven weeks, and for sixty-two weeks it will be restored and rebuilt, with plaza and moat[c][b], but in troubled times.'
translation:
  language: hi
  text: 'इसलिए जान और समझ ले: यरूशलेम को पुनःस्थापित करने और बनाने के वचन के जारी होने से लेकर एक अभिषिक्त जन—एक प्रधान—तक सात सप्ताह[b] होंगे; फिर बासठ सप्ताह तक वह चौक और खाई[c] के साथ पुनःस्थापित किया जाएगा और बनाया जाएगा, पर संकटपूर्ण समयों में।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: इब्रानी “सात सप्ताह” का अनुवाद “सात-सात के कालखंड” भी हो सकता है। इसी प्रकार “बासठ सप्ताह” का अनुवाद “बासठ सात-सात के कालखंड” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “खंदक।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; यह खंदक या सुरक्षा के लिए बनाई गई खाई को सूचित कर सकता है।
    reason: lexical_alternative
