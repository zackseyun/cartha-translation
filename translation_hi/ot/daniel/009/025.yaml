- source_word: תָּשׁוּב וְנִבְנְתָה
  choice: वह ... फिर से बसाया और बनाया जाएगा
  rationale: स्त्रीलिंग एकवचन क्रियाओं का संबंध यरूशलेम से रखता है और नगर की बहाली तथा निर्माण, दोनों को व्यक्त करता है।
- source_word: רְחוֹב
  choice: चौक
  rationale: नगर के खुले सार्वजनिक स्थान का स्वाभाविक हिन्दी नाम है।
- source_word: וְחָרוּץ
