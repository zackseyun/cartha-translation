base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/007.yaml
  text: To you[a], O Lord, belongs righteousness, but to us belongs shame of face, as it is this day—to the men of Judah, to the inhabitants of Jerusalem, and to all Israel, those who are near and those who are far away[b], in all the lands where you have driven them[c], because of their unfaithfulness that they committed against you.
translation:
  language: hi
  text: हे प्रभु, धार्मिकता आपकी है, पर आज की-सी खुली लज्जा हम पर है[a]—यहूदा के पुरुषों[b] पर, यरूशलेम के निवासियों पर, और समस्त इस्राएल पर, चाहे वे निकट हों या दूर, उन सभी देशों में जहाँ आपने उन्हें दूर भेज दिया है; उनकी उस बेवफाई के कारण, जो उन्होंने आपके विरुद्ध की है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मुँह की लज्जा’; इसका अर्थ प्रत्यक्ष या सार्वजनिक अपमान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यहूदा के हर पुरुष’। इब्रानी में पुल्लिंग एकवचन रूप वितरणात्मक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘विश्वासघात’ अथवा ‘विश्वासघाती आचरण’। मूल शब्द विश्वास या वाचा तोड़ने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: यह परमेश्वर को प्रार्थना में किया गया सीधा संबोधन है। यहाँ יהוה नहीं, बल्कि אֲדֹנָי है; इसलिए आधुनिक, गरिमापूर्ण हिंदी में ‘हे प्रभु’ उपयुक्त है।
- source_word: הַצְּדָקָה
  choice: धार्मिकता
  rationale: संदर्भ में यह परमेश्वर के नैतिक रूप से सही और न्यायोचित होने को व्यक्त करता है। ‘धार्मिकता’ इस व्यापक वाचा-संबंधी अर्थ को ‘न्याय’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: בֹּשֶׁת הַפָּנִים
  choice: लज्जा हमारे मुँह पर है
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘मुँह की लज्जा’ है और यह प्रत्यक्ष या सार्वजनिक अपमान दर्शाता है। हिंदी वाक्यांश मुहावरे की देहात्मक छवि को बनाए रखते हुए स्वाभाविक है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज स्पष्ट है
  rationale: यह वर्तमान में दिखाई देने वाली दशा की ओर संकेत करता है। यह रूप ‘आज’ के संकेत को बनाए रखता है और हिंदी में सहज है।
- source_word: לְאִישׁ יְהוּדָה
  choice: यहूदा के हर पुरुष
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक अर्थ में है। ‘हर पुरुष’ मूल के पुल्लिंग एकवचन रूप और प्रत्येक व्यक्ति पर लागू होने वाले भाव दोनों को स्पष्ट करता है।
- source_word: הַקְּרֹבִים וְהָרְחֹקִים
  choice: चाहे वे निकट हों या दूर
  rationale: यह भौगोलिक रूप से पास रहने वालों और दूर देशों में बिखरे लोगों का विरोध व्यक्त करता है।
- source_word: הִדַּחְתָּם
  choice: आपने उन्हें खदेड़ दिया है
  rationale: हिफ़ील रूप निर्वासन में दूर कर दिए जाने की कारणात्मक शक्ति और परमेश्वर की सक्रिय भूमिका को व्यक्त करता है; ‘खदेड़ दिया’ उस तीव्रता को बनाए रखता है।
- source_word: בְּמַעֲלָם אֲשֶׁר מָעֲלוּ בָךְ
  choice: क्योंकि उन्होंने आपके विरुद्ध विश्वासघात किया
  rationale: מעל विश्वास या वाचा तोड़ने, बेवफाई करने अथवा विश्वासघात का बोध देता है। संज्ञा और उसी धातु की क्रिया की पुनरुक्ति को हिंदी में स्वाभाविक कारण-वाक्य के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर की धार्मिकता और इस्राएल की लज्जा का विरोध
  choice: परमेश्वर के पक्ष में धार्मिकता और लोगों के पक्ष में प्रत्यक्ष लज्जा का स्पष्ट विरोध बनाए रखा गया है।
  alternative: הַצְּדָקָה को केवल न्यायिक ‘न्याय’ के रूप में प्रस्तुत करना।
  rationale: स्वीकारोक्ति का आशय है कि परमेश्वर सही ठहरते हैं और लोगों की निर्वासन-संबंधी लज्जा उनके विश्वासघात के कारण है। ‘धार्मिकता’ न्याय सहित व्यापक नैतिक और वाचा-संबंधी भाव को सुरक्षित रखता है।
- issue: לְאִישׁ יְהוּדָה का लिंग और वितरणात्मक अर्थ
  choice: ‘यहूदा के हर पुरुष’ द्वारा मूल का पुल्लिंग एकवचन और वितरणात्मक बल बनाए रखा गया है।
  alternative: ‘यहूदा के लोग’ या ‘यहूदा का प्रत्येक व्यक्ति’।
  rationale: मूल पाठ में אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन है और सामूहिक सूची के भीतर प्रत्येक पुरुष पर कथन लागू करता है; इसे बिना आवश्यकता लिंग-निरपेक्ष नहीं किया गया।
- issue: निर्वासन में परमेश्वर की सक्रिय भूमिका
  choice: ‘जहाँ आपने उन्हें खदेड़ दिया है’ द्वारा परमेश्वर की कारणात्मक भूमिका स्पष्ट रखी गई है।
  alternative: ‘जहाँ वे बिखर गए हैं’।
  rationale: हिफ़ील הִדַּחְתָּם लोगों के स्वयं बिखरने के बजाय परमेश्वर द्वारा उन्हें दूर किए जाने को कहता है; इस तनाव को नरम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘धार्मिकता’, ‘लज्जा’ और ‘विश्वासघात’ जैसे प्रमुख धर्मवैचारिक शब्दों को स्पष्ट संदर्भ के साथ रखा गया है; इब्रानी मुहावरे और निर्वासन में ईश्वरीय सक्रियता को अनावश्यक रूप से सरल नहीं किया गया।
