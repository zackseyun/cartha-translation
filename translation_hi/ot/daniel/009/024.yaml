base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/024.yaml
  text: 'Seventy weeks are decreed concerning your people and your holy city: to finish the transgression[a], to seal up sins, to make atonement for iniquity, to bring in everlasting righteousness, to seal up vision and prophet[d][c][b], and to anoint the most holy place.'
translation:
  language: hi
  text: तेरे लोगों और तेरे पवित्र नगर के विषय में सत्तर सप्ताह[a] ठहराए गए हैं—अपराध का अन्त करने, पापों पर मुहर लगाने[b], अधर्म के लिए प्रायश्चित करने, सदा की धार्मिकता लाने, दर्शन और नबी पर मुहर लगाने[c], और परमपवित्र स्थान का अभिषेक करने[d] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘सत्तर सात’ है; बहुत-से लोग इसे वर्षों के सत्तर सप्ताह समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पापों का अन्त करने।’
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ में ‘दर्शन और नबी’ है; कुछ प्राचीन और आधुनिक व्याख्याकार इसे ‘दर्शन और भविष्यवाणी’ समझते हैं।
    reason: alternative_reading
  - marker: d
    text: या, ‘किसी परमपवित्र जन का अभिषेक करने।’ यह इब्रानी पदबंध परमपवित्र स्थान या वस्तु को भी सूचित कर सकता है, और कुछ लोग इसे किसी व्यक्ति के लिए समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁבֻעִים שִׁבְעִים
  choice: सत्तर सप्ताह
  rationale: שָׁבֻעִים का सामान्य अर्थ ‘सप्ताह’ अथवा सात-सात की इकाइयाँ है। पद में ‘वर्ष’ स्पष्ट नहीं है, इसलिए मुख्य पाठ में कम व्याख्यात्मक ‘सत्तर सप्ताह’ रखा गया और ‘सत्तर सात’/वर्ष-सप्ताह की समझ पादटिप्पणी में दी गई।
- source_word: נֶחְתַּךְ
  choice: ठहराए गए हैं
  rationale: निफ़अल रूप यहाँ निश्चित या निर्धारित किए जाने का भाव देता है। ‘ठहराए गए हैं’ स्वाभाविक हिन्दी में दैवी निर्धारण का अर्थ व्यक्त करता है; शाब्दिक ‘काटे गए’ यहाँ भ्रामक होता।
- source_word: עַל עַמְּךָ וְעַל עִיר קָדְשֶׁךָ
  choice: तेरे लोगों और तेरे पवित्र नगर के विषय में
  rationale: עַל यहाँ आदेश के दायरे या विषय को दर्शाता है। ‘के विषय में’ इस सम्बन्ध को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: לְכַלֵּא הַפֶּשַׁע
  choice: अपराध का अन्त करने
  rationale: क्रिया का भाव समाप्त या पूरा करने का है और निश्चित एकवचन הַפֶּשַׁע को ‘अपराध’ रखा गया है। यह अनावश्यक रूप से किसी विशिष्ट ऐतिहासिक अपराध की पहचान नहीं करता।
- source_word: וְלַחְתֹּם חטאות
  choice: पापों पर मुहर लगाने
  rationale: חתם का मूल रूपक ‘मुहर लगाना’ है। हिन्दी वाक्य-विन्यास में ‘पर मुहर लगाना’ रूपक को बनाए रखता है; सम्भावित अर्थ ‘पापों का अन्त करना’ पादटिप्पणी में सुरक्षित है।
- source_word: וּלְכַפֵּר עָוֺן
  choice: अधर्म का प्रायश्चित करने
  rationale: כפר के प्रायश्चित्तकारी भाव को स्थापित हिन्दी धर्मशास्त्रीय शब्द ‘प्रायश्चित’ ठीक प्रकार व्यक्त करता है। עָוֺן के लिए ‘अधर्म’ नैतिक दोष का भार बनाए रखता है।
- source_word: וּלְהָבִיא צֶדֶק עֹלָמִים
  choice: सदा की धार्मिकता लाने
  rationale: צֶדֶק को ‘धार्मिकता’ और עֹלָמִים के स्थायी भाव को ‘सदा की’ से व्यक्त किया गया है। यह आधुनिक हिन्दी में सुबोध है और चिरस्थायी न्यायपूर्ण धार्मिक दशा का भाव बनाए रखता है।
- source_word: וְלַחְתֹּם חָזוֹן וְנָבִיא
  choice: दर्शन और नबी पर मुहर लगाने
  rationale: मसोरेटिक पाठ में अमूर्त ‘भविष्यवाणी’ नहीं बल्कि נָבִיא, ‘नबी’, है। इसलिए मुख्य पाठ स्रोत की असहज किन्तु वास्तविक अभिव्यक्ति को रखता है; ‘दर्शन और भविष्यवाणी’ पादटिप्पणी में दिया गया है।
- source_word: וְלִמְשֹׁחַ
  choice: अभिषेक करने
  rationale: משׁח के लिए ‘अभिषेक करना’ सटीक और प्रचलित हिन्दी समतुल्य है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह पदबंध प्रायः अत्यन्त पवित्र स्थान, वस्तु या पवित्रतम भाग के लिए आता है। प्रसंग में स्थानवाचक अनुवाद स्वाभाविक है, किन्तु व्यक्तिगत अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים का अभिप्रेत सन्दर्भ
  choice: परमपवित्र स्थान
  alternative: कोई परमपवित्र जन; अथवा परमपवित्र वस्तु/पवित्रतम स्थान
  rationale: इब्रानी पदबंध स्वयं स्पष्ट रूप से किसी व्यक्ति की पहचान नहीं करता और प्रायः पवित्रस्थान या पवित्र वस्तु के लिए प्रयुक्त होता है। मुख्य पाठ में स्थानवाचक अर्थ रखा गया, जबकि व्यक्तिगत सम्भावना पादटिप्पणी में दी गई ताकि मसीही या अन्य पहचान अनुवाद में आरोपित न हो।
- issue: שָׁבֻעִים की समय-संरचना
  choice: सप्ताह
  alternative: सात-सात की इकाइयाँ; वर्षों के सप्ताह
  rationale: मूल शब्द सात की इकाइयों को दर्शा सकता है, पर इस पद में ‘वर्ष’ नहीं कहा गया। इसलिए मुख्य पाठ कम व्याख्यात्मक है और प्रचलित वर्ष-सप्ताह की व्याख्या टिप्पणी में रखी गई है।
- issue: חָזוֹן וְנָבִיא में נָבִיא का अर्थ
  choice: दर्शन और नबी
  alternative: दर्शन और भविष्यवाणी
  rationale: स्वरांकित इब्रानी पाठ में ‘नबी’ है। ‘भविष्यवाणी’ अर्थगत रूप से सम्भव और कई व्याख्याकारों में प्रचलित है, पर उसे मुख्य पाठ में रखकर पाठ की वास्तविक अस्पष्टता को मिटाना उचित नहीं।
