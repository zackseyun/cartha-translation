  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सुबोध रूप अपनाया गया है। दानिय्येल को एकवचन सम्बोधन होने के कारण ‘तेरे’ रखा गया। ‘मुहर लगाना’, ‘प्रायश्चित’, ‘धार्मिकता’ और ‘अभिषेक’ जैसे प्रमुख मूल-पाठ रूपकों और धर्मशास्त्रीय शब्दों को बनाए रखा गया है। वास्तविक पाठगत और अर्थगत अस्पष्टताएँ पादटिप्पणियों में स्पष्ट की गई हैं।
