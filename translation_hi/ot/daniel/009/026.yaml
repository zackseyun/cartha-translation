  text: וְ/אַחֲרֵ֤י הַ/שָּׁבֻעִים֙ שִׁשִּׁ֣ים וּ/שְׁנַ֔יִם יִכָּרֵ֥ת מָשִׁ֖יחַ וְ/אֵ֣ין ל֑/וֹ וְ/הָ/עִ֨יר וְ/הַ/קֹּ֜דֶשׁ יַ֠שְׁחִית עַ֣ם נָגִ֤יד הַ/בָּא֙ וְ/קִצּ֣/וֹ בַ/שֶּׁ֔טֶף וְ/עַד֙ קֵ֣ץ מִלְחָמָ֔ה נֶחֱרֶ֖צֶת שֹׁמֵמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/026.yaml
  text: And after the sixty-two weeks[a], an anointed one will be cut off and will have nothing. And the city and the sanctuary the people of the coming ruler will destroy. Its end will come with a flood, and until the end there will be war[d][c][b]; desolations are decreed.
translation:
  language: hi
  text: और बासठ सप्ताहों[a] के बाद एक अभिषिक्त जन[b] काट डाला जाएगा, और उसके पास कुछ भी न रहेगा[c]। आने वाले शासक[d] की प्रजा नगर और पवित्र स्थान को नष्ट कर देगी। उसका अंत बाढ़ के साथ होगा[e], और अंत तक युद्ध होता रहेगा; विनाश निश्चित किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सप्ताहों’ का अर्थ ‘सात-सात के समूहों’ से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘मसीह काट डाला जाएगा।’ इब्रानी में ‘एक अभिषिक्त जन’ है; यह विशेष रूप से मसीह को सूचित करता है या नहीं, इस पर मतभेद है।
    reason: alternative_reading
  - marker: c
    text: या, ‘उसके लिए कुछ भी न होगा,’ अथवा ‘उसका कोई न होगा।’ इब्रानी वाक्यांश संक्षिप्त और कठिन है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘एक आने वाले प्रधान की प्रजा।’
    reason: lexical_alternative
  - marker: e
    text: या, ‘उस शासक का अंत बाढ़ के साथ होगा।’ ‘उसका’ किसे सूचित करता है, यह विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׁבֻעִים שִׁשִּׁים וּשְׁנַיִם
  choice: बासठ सप्ताहों
  rationale: ‘सप्ताह’ שָׁבוּעַ का प्रचलित और पठनीय अर्थ है; साथ ही यह दानिय्येल में निहित ‘सात-सात के समूह’ की समय-इकाई को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יִכָּרֵת
  choice: काट डाला जाएगा
  rationale: निफ़अल रूप हिंसक रूप से अलग या नष्ट किए जाने का गंभीर भाव रखता है; यह इब्रानी मुहावरे की शक्ति को बनाए रखता है।
- source_word: מָשִׁיחַ
  choice: एक अभिषिक्त जन
  rationale: शब्द यहाँ निश्चित उपपद के बिना है और सामान्यतः किसी अभिषिक्त व्यक्ति को सूचित कर सकता है; इसलिए मुख्य पाठ विवादित पहचान को पहले से तय नहीं करता।
- source_word: וְאֵין לוֹ
  choice: और उसके पास कुछ भी न रहेगा
  rationale: संक्षिप्त और कठिन वाक्यांश को अभाव के व्यापक अर्थ में रखा गया है, बिना यह तय किए कि अभाव संपत्ति, अधिकार या समर्थकों का है।
- source_word: הָעִיר וְהַקֹּדֶשׁ
  choice: नगर और पवित्रस्थान
  rationale: הַקֹּדֶשׁ यहाँ नगर के समानांतर मन्दिर अथवा पवित्र परिसर को दर्शाता है; ‘पवित्रस्थान’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: עַם נָגִיד הַבָּא
  choice: आनेवाले शासक की प्रजा
  rationale: נָגִיד राजनीतिक अगुआ या शासक को दर्शाता है; ‘शासक’ आधुनिक हिन्दी में सहज है और הַבָּא के ‘आनेवाले’ भाव को बनाए रखता है।
- source_word: וְקִצּוֹ בַשֶּׁטֶף
  choice: उसका अन्त बाढ़ के साथ होगा
  rationale: सर्वनाम का संदर्भ मूल में अस्पष्ट है; ‘उसका’ उस अस्पष्टता को बनाए रखता है और ‘बाढ़’ मूल बिंब को सुरक्षित रखती है।
- source_word: וְעַד קֵץ מִלְחָמָה
  choice: और अन्त तक युद्ध होता रहेगा
  rationale: यह स्वाभाविक हिन्दी में अन्त तक युद्ध की जारी अवस्था व्यक्त करता है।
- source_word: נֶחֱרֶצֶת שֹׁמֵמוֹת
  choice: उजाड़ निर्धारित किए गए हैं
  rationale: निष्क्रिय रूप निर्णायक रूप से ठहराई गई बात व्यक्त करता है, जबकि बहुवचन שֹׁמֵמוֹת को ‘उजाड़’ के रूप में रखा गया है।
theological_decisions:
- issue: क्या מָשִׁיחַ को मुख्य पाठ में स्पष्ट रूप से ‘मसीह’ कहा जाए
  choice: मुख्य पाठ में ‘एक अभिषिक्त जन’
  alternative: ‘मसीह काट डाला जाएगा’
  rationale: इब्रानी में निश्चित उपपद नहीं है और व्यक्ति की पहचान विवादित है। शाब्दिक रूप से पारदर्शी अनुवाद धार्मिक पहचान को अनुवाद के स्तर पर तय नहीं करता; मसीही पाठ-पद्धति पादटिप्पणी में सुरक्षित है।
- issue: וְאֵין לוֹ का आशय
  choice: ‘उसके पास कुछ भी न रहेगा’
  alternative: ‘उसके लिए कुछ भी न होगा’ अथवा ‘उसका कोई न होगा’
  rationale: मूल वाक्यांश अत्यन्त संक्षिप्त है और अभाव, त्याग या अधिकारहीनता में से किसी ओर संकेत कर सकता है। चुना हुआ रूप इस तनाव को खुला रखता है।
- issue: וְקִצּוֹ में सर्वनाम का संदर्भ
  choice: ‘उसका अन्त’ द्वारा संदर्भ को अस्पष्ट रखना
  alternative: इसे नगर/पवित्रस्थान का अन्त या शासक का अन्त स्पष्ट करना
  rationale: व्याकरणिक प्रत्यय पुल्लिंग एकवचन है, पर निकटवर्ती संभावित संदर्भ एक से अधिक हैं; किसी एक पहचान को मुख्य पाठ में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। ‘अभिषिक्त जन,’ ‘पवित्रस्थान,’ और ‘उजाड़’ जैसे शब्द मूल के धार्मिक एवं भविष्यदर्शी स्वर को रखते हैं, पर किसी विशिष्ट व्याख्यात्मक परम्परा को मुख्य पाठ में आरोपित नहीं करते।
