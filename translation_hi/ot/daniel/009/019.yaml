source:
  edition: WLC
  text: אֲדֹנָ֤/י שְׁמָ֨עָ/ה֙ אֲדֹנָ֣/י סְלָ֔חָ/ה אֲדֹנָ֛/י הַֽקֲשִׁ֥יבָ/ה וַ/עֲשֵׂ֖ה אַל תְּאַחַ֑ר לְמַֽעֲנְ/ךָ֣ אֱלֹהַ֔/י כִּֽי שִׁמְ/ךָ֣ נִקְרָ֔א עַל עִירְ/ךָ֖ וְ/עַל עַמֶּֽ/ךָ׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/019.yaml
  text: Lord[a], hear! Lord, forgive! Lord, pay attention and act! Do not delay, for your own sake, my God, because your name is called over your city and your people.
translation:
  language: hi
  text: हे प्रभु, सुन! हे प्रभु, क्षमा कर! हे प्रभु, ध्यान दे और कार्य कर! देर न कर—अपने ही निमित्त, हे मेरे परमेश्वर—क्योंकि तेरा नाम तेरे नगर और तेरी प्रजा पर रखा गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप में: “तेरा नगर और तेरी प्रजा तेरे नाम से कहलाते हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: हे प्रभु
  rationale: परमेश्वर को संबोधित करने वाला दिव्य पद है। हिन्दी में संबोधन की स्पष्टता और प्रार्थना की गरिमा के लिए ‘हे प्रभु’ स्वाभाविक है; व्याकरणिक रूप में निहित ‘मेरे’ को यहाँ अलग से व्यक्त करना आवश्यक नहीं।
- source_word: שְׁמָעָה
  choice: सुन
  rationale: आज्ञार्थक विनती की सीधी और संक्षिप्त शक्ति बनाए रखता है।
- source_word: סְלָחָה
  choice: क्षमा कर
  rationale: पश्चात्ताप की प्रार्थना में סלח का स्पष्ट और प्रचलित हिन्दी समतुल्य।
- source_word: הַקֲשִׁיבָה
  choice: ध्यान दे
  rationale: साधारण सुनने से बढ़कर सावधान और सक्रिय रूप से ध्यान देने की विनती व्यक्त करता है।
- source_word: וַעֲשֵׂה
  choice: और कार्य कर
  rationale: עשה व्यापक रूप से ‘करना’ है; यहाँ प्रसंग परमेश्वर से हस्तक्षेप करने की विनती का है। ‘कार्य कर’ निहित भाव व्यक्त करता है, पर कोई विशिष्ट कार्य नहीं जोड़ता।
- source_word: אַל תְּאַחַר
  choice: देर न कर
  rationale: माँगी गई कार्रवाई को न टालने की संक्षिप्त और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: לְמַעַנְךָ
  choice: अपने ही निमित्त
  rationale: परमेश्वर के अपने नाम और सम्मान के कारण कार्रवाई की विनती को स्पष्ट करता है; ‘ही’ आत्म-संबंधी बल को बनाए रखता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: व्यक्तिगत संबंधसूचक रूप को संबोधन सहित स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: विनती का कारण प्रस्तुत करने वाले संयोजक का सीधा आधुनिक हिन्दी रूप।
- source_word: שִׁמְךָ נִקְרָא עַל
  choice: तेरा नाम ... पर पुकारा जाता है
  rationale: हिब्रू की निष्क्रिय रचना और עַל की ‘पर’ वाली छवि को सुरक्षित रखता है। इसका आशय अधिकार, संबंध और पहचान से है; अधिक मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: עִירְךָ
  choice: तेरे नगर
  rationale: सरल संबंधसूचक अनुवाद; प्रसंग में नगर यरूशलेम है, पर पद में नाम स्पष्टतः नहीं जोड़ा गया।
- source_word: עַמֶּךָ
  choice: तेरी प्रजा
  rationale: परमेश्वर से संबंधित सामूहिक जन के लिए ‘प्रजा’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: वाचा-संबंध और स्वामित्व दर्शाने वाला मुहावरा שִׁמְךָ נִקְרָא עַל
  choice: तेरा नाम तेरे नगर और तेरी प्रजा पर पुकारा जाता है
  alternative: तेरा नगर और तेरी प्रजा तेरे नाम से कहलाते हैं
  rationale: मुख्य पाठ हिब्रू की निष्क्रिय रचना और ‘पर’ की छवि बनाए रखता है, जिससे परमेश्वर के नाम का नगर और प्रजा पर होना व्यक्त होता है। अधिक सहज हिन्दी अर्थ पादटिप्पणी में रखा गया है, ताकि वास्तविक मुहावरेगत विकल्प छिपाया न जाए।
- issue: लगातार तीन बार אֲדֹנָי का संबोधन
  choice: हर बार ‘हे प्रभु’ को दोहराना
  alternative: दूसरी और तीसरी बार संबोधन को संक्षिप्त या लोप करना
  rationale: दोहराव प्रार्थना की तात्कालिकता और भावनात्मक तीव्रता का अंग है; इसलिए उसे पूर्णतः सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। एकवचन आत्मीय संबोधन के अनुरूप ‘तेरा/तेरी’ और ‘कर/सुन’ का प्रयोग पूरे पद में सुसंगत है। छोटे विस्मयात्मक वाक्य मूल की आवेगपूर्ण पुनरावृत्ति को बनाए रखते हैं।
