base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/010.yaml
  text: and we have not obeyed the voice of Yahweh our God[a], to walk in his laws, which he set before us through his servants the prophets.
translation:
  language: hi
  text: और हमने अपने परमेश्वर याहवे की वाणी नहीं मानी कि हम उसकी व्यवस्थाओं के अनुसार चलें, जिन्हें उसने अपने सेवक नबियों के द्वारा हमारे सामने रखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: ‘अपने सेवक नबियों के हाथ से’; यह माध्यम या प्रतिनिधित्व का मुहावरा है, अर्थात ‘उनके द्वारा।’'
    reason: בְּיַד (‘हाथ से’) के माध्यम-सूचक इब्रानी मुहावरे को स्पष्ट करता है।
lexical_decisions:
- source_word: שָׁמַעְנוּ בְּקוֹל
  choice: वाणी नहीं मानी
  rationale: इस प्रयोग में שׁמע केवल सुनने नहीं, बल्कि सुनकर आज्ञा मानने का भाव रखता है; ‘वाणी मानी’ मूल अभिव्यक्ति और आज्ञाकारिता दोनों को बनाए रखता है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर यहोवा
  rationale: प्रथम पुरुष बहुवचन संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לָלֶכֶת בְּתוֹרֹתָיו
  choice: कि हम उसकी शिक्षाओं पर चलें
  rationale: לָלֶכֶת आचरण के रूपक को बनाए रखता है। תּוֹרָה का बहुवचन यहाँ परमेश्वर द्वारा दी गई हिदायतों/निर्देशों को सूचित करता है; ‘शिक्षाओं’ से इसका विधिक और निर्देशात्मक विस्तार खुला रहता है।
- source_word: אֲשֶׁר נָתַן לְפָנֵינוּ
  choice: जिन्हें उसने ... हमारे सामने रखा
  rationale: शाब्दिक ‘हमारे सामने दिया’ का स्वाभाविक हिन्दी मुहावरा ‘हमारे सामने रखा’ है।
- source_word: בְּיַד עֲבָדָיו הַנְּבִיאִים
  choice: अपने सेवकों, नबियों, के द्वारा
  rationale: בְּיַד का शाब्दिक अर्थ ‘हाथ के द्वारा’ है, पर यहाँ यह माध्यम/प्रतिनिधित्व का मुहावरा है; हिन्दी में ‘के द्वारा’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है, कोई उपाधि नहीं। हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ रखा गया है; संभावित उच्चारण ‘याहवे’ फुटनोट में दिया गया है।
- issue: תּוֹרָה के बहुवचन का अर्थ
  choice: शिक्षाओं
  alternative: व्यवस्थाओं
  rationale: बहुवचन תּוֹרֹתָיו को केवल संकीर्ण कानूनी अर्थ तक सीमित न करके परमेश्वर के निर्देशों के व्यापक अर्थ में रखा गया है; संदर्भ में उन पर ‘चलना’ आज्ञाकारी जीवन को दर्शाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘वाणी मानी’ और ‘पर चलें’ मूल इब्रानी रूपकों को स्वाभाविक हिन्दी में सुरक्षित रखते हैं। footnote marker मुख्य पाठ में उसी दावे के अंत में रखा गया है जिससे टिप्पणी संबंधित है।
