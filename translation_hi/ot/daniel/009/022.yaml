base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/022.yaml
  text: He made me understand[a], and spoke with me, and said, “Daniel[b], I have now come out to give you insight and understanding.”
translation:
  language: hi
  text: उसने मुझे समझाया[a], मुझसे बात की और कहा, “दानिय्येल, अब मैं तुम्हें अंतर्दृष्टि और समझ देने के लिए निकला हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझे समझने योग्य बनाया।” इब्रानी क्रिया को यहाँ करणार्थक अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं बाहर निकला हूँ”; इसका अर्थ “मैं प्रस्थान कर चुका हूँ” या प्रसंगानुसार “मैं आया हूँ” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֶן
  choice: उसने मुझे समझाया
  rationale: 'בין का यह रूप यहाँ सन्दर्भानुसार करणार्थक है: बोलने वाले ने दानिय्येल को समझने में समर्थ किया। ‘मुझे समझाया’ आधुनिक हिन्दी में स्वाभाविक है और निहित कर्म को स्पष्ट करता है।'
- source_word: וַיְדַבֵּר עִמִּי
  choice: मेरे साथ बात करते हुए
  rationale: עִם का अर्थ ‘साथ’ सुरक्षित रखा गया है। अगले וַיֹּאמַר के साथ सहज हिन्दी वाक्य बनाने के लिए इसे ‘बात करते हुए ... कहा’ के रूप में जोड़ा गया है।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: हिन्दी बाइबल परम्परा में प्रचलित और इब्रानी नाम के निकट लिप्यन्तरण।
- source_word: עַתָּה
  choice: अब
  rationale: वक्ता के वर्तमान मिशन को सूचित करने वाले कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: יָצָאתִי
  choice: मैं ... निकला हूँ
  rationale: יצא के मूल ‘बाहर निकलना/प्रस्थान करना’ भाव को सुरक्षित रखता है और वक्ता के भेजे जाने के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: לְהַשְׂכִּילְךָ
  choice: तुझे अंतर्दृष्टि ... देने के लिए
  rationale: שׂכל के करणार्थक भाव को ‘अंतर्दृष्टि देना’ व्यक्त करता है और अगले בִינָה से अर्थगत भेद भी बनाए रखता है।
- source_word: בִינָה
  choice: समझ
  rationale: यह सामान्य आधुनिक हिन्दी में बोध और समझने की क्षमता को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: יָצָאתִי में गति की दिशा
  choice: निकला हूँ
  alternative: आया हूँ / भेजा गया हूँ
  rationale: इब्रानी क्रिया केवल निकलने या प्रस्थान करने को स्पष्ट करती है; ‘आया हूँ’ दृष्टिकोण बदलता और ‘भेजा गया हूँ’ निहित प्रेषण को स्पष्ट कथन बना देता। इसलिए मूल की दिशा-संबंधी खुली प्रकृति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुझे’ दानिय्येल को किए गए एकवचन सम्बोधन और बाइबलीय गरिमा के अनुकूल है। दो लगातार कथन-क्रियाओं को हिन्दी में अनावश्यक भारीपन से बचाने के लिए ‘बात करते हुए कहा’ बनाया गया है।
