source:
  edition: WLC
  text: הַטֵּ֨ה אֱלֹהַ֥/י אָזְנְ/ךָ֮ וּֽ/שֲׁמָע֒ פקח/ה עֵינֶ֗י/ךָ וּ/רְאֵה֙ שֹֽׁמְמֹתֵ֔י/נוּ וְ/הָ/עִ֕יר אֲשֶׁר נִקְרָ֥א שִׁמְ/ךָ֖ עָלֶ֑י/הָ כִּ֣י לֹ֣א עַל צִדְקֹתֵ֗י/נוּ אֲנַ֨חְנוּ מַפִּילִ֤ים תַּחֲנוּנֵ֨י/נוּ֙ לְ/פָנֶ֔י/ךָ כִּ֖י עַל רַחֲמֶ֥י/ךָ הָ/רַבִּֽים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/018.yaml
  text: Incline your ear[a], my God, and hear; open your eyes and see our desolations and the city that is called by your name. For we are not presenting our pleas before you because of our righteousnesses[b], but because of your abundant mercies.
translation:
  language: hi
  text: हे मेरे परमेश्वर, अपना कान झुका[a] और सुन; अपनी आँखें खोल और हमारी उजड़ी हुई दशा तथा उस नगर को देख, जो तेरे नाम से कहलाता है[b]। क्योंकि हम अपनी विनतियाँ तेरे सामने अपने धर्मी कामों के कारण नहीं, बल्कि तेरी अपार दयाओं के कारण रख रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “अपना कान झुका”; यह ध्यान देकर सुनने का इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी मुहावरा: “वह नगर, जिस पर तेरा नाम पुकारा गया है।” इसका भाव है कि नगर परमेश्वर के नाम से जुड़ा है और उसका है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַטֵּה ... אָזְנְךָ
  choice: अपना कान लगा
  rationale: कान झुकाने के इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है और ध्यानपूर्वक सुनने की प्रार्थनापूर्ण छवि बनाए रखता है।
- source_word: שֹׁמְמֹתֵינוּ
  choice: हमारी उजड़ी हुई दशा
  rationale: बहुवचन रूप उजाड़ स्थानों और समुदाय की विनष्ट अवस्था—दोनों की ओर संकेत कर सकता है; हिन्दी में सामूहिक अर्थ को स्वाभाविक रखते हुए मूल की व्यापकता बचाई गई है।
- source_word: אֲשֶׁר נִקְרָא שִׁמְךָ עָלֶיהָ
  choice: जिस पर तेरा नाम पुकारा जाता है
  rationale: मूल इब्रानी मुहावरे को निकटता से सुरक्षित रखता है; इससे नगर पर परमेश्वर के नाम, संबंध और अधिकार का भाव बना रहता है।
- source_word: צִדְקֹתֵינוּ
  choice: अपनी धार्मिकताओं
  rationale: मूल का बहुवचन बनाए रखा गया है, जो धार्मिक कामों, न्यायसंगत दावों या धार्मिकता के आधारों की ओर संकेत कर सकता है।
- source_word: מַפִּילִים תַּחֲנוּנֵינוּ לְפָנֶיךָ
  choice: अपनी विनतियाँ तेरे सामने रख रहे हैं
  rationale: शाब्दिक रूप से 'गिराने' वाले इब्रानी मुहावरे का स्वाभाविक हिन्दी अर्थ है—किसी के सामने प्रार्थना या याचना प्रस्तुत करना।
- source_word: רַחֲמֶיךָ הָרַבִּים
  choice: तेरी अपार दयाओं
  rationale: רַבִּים के बहुतायत/प्रचुरता के भाव और רַחֲמִים के बहुवचन को सहज, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के लिए 'कान' और 'आँखें' जैसी मानवरूपी भाषा
  choice: प्रत्यक्ष प्रार्थनात्मक बिंबों को बनाए रखा गया
  alternative: अर्थ खोलकर 'मेरी ओर ध्यान दे' और 'हमारी दशा पर ध्यान कर' कहना
  rationale: मूल पाठ परमेश्वर का ध्यान आकर्षित करने के लिए देहात्मक बिंबों का प्रयोग करता है; उन्हें बनाए रखने से प्रार्थना की तात्कालिकता और काव्यात्मक समानांतरता सुरक्षित रहती है।
- issue: नगर पर परमेश्वर का नाम पुकारा जाना
  choice: मुहावरे को निकट रूप में रखा गया
  alternative: '''जो तेरे नाम से कहलाता है'' या ''जो तेरा नाम धारण करता है'''
  rationale: निकट अनुवाद संबंध, स्वामित्व और वाचा-संबंधी पहचान के संभावित भावों को किसी एक व्याख्या में सीमित नहीं करता।
- issue: विनती का आधार
  choice: मानवीय धार्मिकताओं के बजाय परमेश्वर की अपार दयाओं का स्पष्ट विरोध रखा गया
  alternative: '''हमारी योग्यता के कारण नहीं'' जैसा सामान्यीकृत रूप'
  rationale: यह पद मानवीय धार्मिकता के दावे और ईश्वरीय दया के बीच तनाव को स्पष्ट रूप से रखता है; अनुवाद इसे बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थनात्मक हिन्दी। परमेश्वर के लिए एकवचन आत्मीय संबोधन 'तू/तेरा' रखा गया है। वाक्य-विन्यास पठनीय बनाया गया है, पर मानवरूपी बिंब, 'धार्मिकताओं' का असामान्य बहुवचन और नगर पर नाम पुकारे जाने का इब्रानी मुहावरा जानबूझकर सुरक्षित रखे गए हैं।
