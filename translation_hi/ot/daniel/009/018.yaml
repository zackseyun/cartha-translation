  - severity: medium
    issue: “जिस पर तेरा नाम पुकारा जाता है” is too literal to sound idiomatic in Hindi.
    rationale: Hindi naturally expresses the underlying naming association as “जो तेरे नाम से कहलाता है.” The literal Hebrew construction is preserved in the footnote without imposing a narrower interpretation.
  - severity: medium
    issue: “धार्मिकताओं” is not natural modern Hindi.
    rationale: The Hebrew plural likely refers to righteous acts or grounds of righteousness. “हमारे धर्मी कामों” is idiomatic and preserves the contrast without introducing doctrinal interpretation.
