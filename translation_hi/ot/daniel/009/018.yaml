  terminology: “परमेश्वर,” “विनतियाँ,” and “दयाओं” suit a dignified modern prayer register. “जो तेरे नाम से कहलाता है” is a natural Hindi equivalent for the city upon which God's name is called, while the footnote retains the Hebrew idiom.
