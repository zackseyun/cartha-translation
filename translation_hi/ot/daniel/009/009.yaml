base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/009.yaml
  text: To the Lord our God belong compassion and forgiveness[a], for we have rebelled against him.
translation:
  language: hi
  text: दया और क्षमा हमारे प्रभु परमेश्वर की हैं[a], क्योंकि हमने उनके विरुद्ध विद्रोह किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दयाएँ और क्षमाएँ।’ इब्रानी में दोनों संज्ञाएँ बहुवचन हैं; यह प्रचुरता व्यक्त कर सकता है या भाववाचक अर्थ में प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנָי אֱלֹהֵינוּ
  choice: हमारे प्रभु परमेश्वर ही ... के धनी हैं
  rationale: इब्रानी का ल- उपसर्ग अधिकार या संबंध व्यक्त करता है—ये गुण प्रभु के हैं। हिन्दी में ‘के धनी हैं’ इस क्रियारहित उपवाक्य को स्वाभाविक बनाता है; ‘ही’ इस विरोध को उभारता है कि विद्रोह हमारा है, जबकि दया और क्षमा परमेश्वर की ओर से हैं।
- source_word: הָרַחֲמִים
  choice: दया
  rationale: रूप की दृष्टि से यह बहुवचन है, पर यहाँ प्रचुरता सूचित करने वाले भाववाचक अर्थ में प्रयुक्त है। ‘दया’ आधुनिक हिन्दी में स्वाभाविक और अर्थसंगत है।
- source_word: וְהַסְּלִחוֹת
  choice: क्षमा
  rationale: इब्रानी में बहुवचन होने पर भी यह भाववाचक रूप में समझा जा सकता है। ‘क्षमा’ सहज हिन्दी है और दोष माफ करने का अर्थ सुरक्षित रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: 'यह परमेश्वर की दया और क्षमा की आवश्यकता का कारण बताता है: लोगों ने उनके विरुद्ध विद्रोह किया है।'
- source_word: מָרַדְנוּ בּוֹ
  choice: हमने उनके विरुद्ध विद्रोह किया है
  rationale: מרד साधारण पाप से अधिक स्पष्ट रूप से विद्रोह दर्शाता है; בּוֹ उस व्यक्ति को बताता है जिसके विरुद्ध विद्रोह हुआ। पूर्ण वर्तमान हिन्दी में उस किए हुए विद्रोह की वर्तमान प्रासंगिकता बनाए रखता है।
theological_decisions:
- issue: אֲדֹנָי के लिए दिव्य उपाधि
  choice: प्रभु
  alternative: स्वामी
  rationale: प्रार्थना के इस संदर्भ में ‘प्रभु’ श्रद्धापूर्ण दिव्य उपाधि के रूप में स्वाभाविक है और ‘हमारे परमेश्वर’ के साथ सुगमता से जुड़ता है।
- issue: दया और क्षमा के बहुवचन रूप
  choice: भाववाचक एकवचन—‘दया और क्षमा’
  alternative: ‘दयाएँ और क्षमादान’
  rationale: दोनों इब्रानी संज्ञाएँ बहुवचन हैं, जो बहुतायत भी जता सकती हैं या भाववाचक संज्ञाओं की तरह काम कर सकती हैं। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और यह वास्तविक द्विअर्थकता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण प्रार्थनात्मक शैली। ‘परमेश्वर’ covenantal address को स्वाभाविक रूप से व्यक्त करता है; ‘विद्रोह’ मूल क्रिया की तीव्रता बनाए रखता है।
