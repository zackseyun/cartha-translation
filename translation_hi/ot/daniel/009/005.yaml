id: DAN.9.5
reference: Daniel 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חָטָ֥אנוּ וְ/עָוִ֖ינוּ ו/הרשענו וּ/מָרָ֑דְנוּ וְ/ס֥וֹר מִ/מִּצְוֺתֶ֖/ךָ וּ/מִ/מִּשְׁפָּטֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/005.yaml
  text: We have sinned and done wrong and acted wickedly and rebelled[b][a], turning aside from your commandments and your judgments.
translation:
  language: hi
  text: हमने पाप किया, अधर्म किया[a], दुष्टता की, विद्रोह किया, और आपकी आज्ञाओं तथा आपके न्याय-निर्णयों[b] से हट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टेढ़े या विकृत ढंग से आचरण किया।” इब्रानी क्रिया में कुटिल या विकृत आचरण करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “विधियों।” इब्रानी शब्द न्यायिक निर्णयों, विधानों या निर्धारित नियमों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאנוּ
  choice: हमने पाप किया
  rationale: חטא का यह प्रथम पुरुष बहुवचन रूप नैतिक अपराध को स्वीकार करता है। हिन्दी में सामान्य भूतकाल सामूहिक अंगीकार के प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעָוִינוּ
  choice: गलत काम किए
  rationale: עוה में टेढ़े या विकृत ढंग से आचरण करने और दोषी होने का भाव है। ‘गलत काम किए’ आधुनिक और सहज है; अधिक विशिष्ट ‘अधर्म किया’ को पादटिप्पणी में रखा गया है।
- source_word: וְהִרְשַׁעְנוּ
  choice: दुष्टता की
  rationale: רשע के हिफ़ील रूप का अर्थ दुष्ट आचरण करना है। यह अभिव्यक्ति पिछले क्रियापद से अलग रहकर मूल के क्रमिक अंगीकार को बनाए रखती है।
- source_word: וּמָרָדְנוּ
  choice: और विद्रोह किया
  rationale: מרד का सीधा अर्थ विद्रोह करना है और यहाँ परमेश्वर के विरुद्ध जानबूझकर अवज्ञा का भाव व्यक्त करता है।
- source_word: וְסוֹר
  choice: हम ... से हट गए
  rationale: סור यहाँ पहले क्रियापदों के साथ हट जाने या मार्ग से फिर जाने का अंगीकार आगे बढ़ाता है। हिन्दी में पूर्ण क्रिया-वाक्य मूल भाव को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמִּצְוֺתֶיךָ
  choice: आपकी आज्ञाओं से
  rationale: מצוה के लिए ‘आज्ञा’ प्रचलित, स्पष्ट और वाचा-संबंधी संदर्भ के अनुरूप है।
- source_word: וּמִמִּשְׁפָּטֶיךָ
  choice: और आपके न्याय-निर्णयों से
  rationale: משפט में न्यायिक निर्णय, विधान या निर्धारित नियम का अर्थ हो सकता है। ‘न्याय-निर्णय’ इसके न्यायिक पक्ष को स्पष्ट रखता है, जबकि ‘विधियाँ’ पादटिप्पणी में विकल्प के रूप में दी गई है।
theological_decisions:
- issue: अंगीकार के निकटार्थी क्रियापदों के क्रम को बनाए रखना
  choice: पाप किया, गलत काम किए, दुष्टता की और विद्रोह किया
  alternative: हमने पाप और बुराई करके विद्रोह किया
  rationale: इब्रानी पाठ कई अलग-अलग क्रियापद जोड़कर अंगीकार की तीव्रता बढ़ाता है। उन्हें एक सामान्य कथन में समेटने के बजाय प्रत्येक को अलग रखना मूल की आलंकारिक और धर्मवैचारिक गंभीरता को सुरक्षित रखता है।
- issue: מִשְׁפָּטִים के न्यायिक और विधिक अर्थों को व्यक्त करना
  choice: आपके न्याय-निर्णयों
  alternative: आपकी विधियों
  rationale: मूल शब्द में न्यायिक निर्णय और निर्धारित विधान दोनों का अर्थ संभव है। मुख्य पाठ में न्यायिक बल रखा गया है और दूसरा वास्तविक अर्थ पादटिप्पणी में दिया गया है, जिससे अर्थ की व्यापकता अनावश्यक रूप से सीमित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामूहिक प्रार्थना और अंगीकार का गंभीर, किंतु सहज रूप रखा गया है। परमेश्वर को संबोधित करने के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। मूल के चार क्रमिक अपराध-सूचक क्रियापद अलग-अलग रखे गए हैं।
