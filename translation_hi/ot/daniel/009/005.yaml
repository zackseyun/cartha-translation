revisions:
- from: हमने पाप किया, गलत काम किए[a], दुष्टता की और विद्रोह किया; हम आपकी आज्ञाओं और आपके न्याय-निर्णयों[b] से हट गए।
  to: हमने पाप किया, अधर्म किया[a], दुष्टता की, विद्रोह किया, और आपकी आज्ञाओं तथा आपके न्याय-निर्णयों[b] से हट गए।
  rationale: The revision uses “अधर्म किया” for the second confession verb to represent its iniquity/perversity nuance more faithfully, while retaining a footnote that makes its figurative lexical sense explicit. The final clause is integrated with the preceding verbs to reflect the Hebrew syntax and rhetorical buildup. No disputed reading or doctrinal interpretation has been introduced.
