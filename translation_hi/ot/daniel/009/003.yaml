  text: וָ/אֶתְּנָ֣/ה אֶת פָּנַ֗/י אֶל אֲדֹנָ/י֙ הָֽ/אֱלֹהִ֔ים לְ/בַקֵּ֥שׁ תְּפִלָּ֖ה וְ/תַחֲנוּנִ֑ים בְּ/צ֖וֹם וְ/שַׂ֥ק וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/003.yaml
  text: So I turned my face to the Lord God[a], to seek prayer and pleas for mercy, with fasting, sackcloth[b], and ashes.
translation:
  language: hi
  text: तब मैंने उपवास, टाट[b] और राख के साथ प्रार्थना और दया के लिए विनतियाँ करने के लिए प्रभु परमेश्वर की ओर अपना मुख किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने अपना मुख प्रभु परमेश्वर की ओर लगाया।” यह इब्रानी मुहावरा ध्यान और दृढ़ निश्चय के साथ उसकी ओर उन्मुख होने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: टाट मोटा कपड़ा था, जिसे शोक, दीनता या पश्चात्ताप प्रकट करने के लिए पहना जाता था।
    reason: cultural_explanation
lexical_decisions:
- source_word: וָאֶתְּנָה אֶת־פָּנַי
  choice: मैंने ... की ओर अपना मुख किया
  rationale: शाब्दिक बिंब और इब्रानी मुहावरे में निहित जानबूझकर ध्यान लगाने तथा दृढ़ निश्चय करने का भाव, दोनों सुरक्षित रहते हैं।
- source_word: אֶל אֲדֹנָי הָאֱלֹהִים
  choice: प्रभु परमेश्वर की ओर
  rationale: אֲדֹנָי को ‘प्रभु’ और הָאֱלֹהִים को ‘परमेश्वर’ कहा गया है; यहाँ יהוה नाम नहीं है।
- source_word: לְבַקֵּשׁ תְּפִלָּה וְתַחֲנוּנִים
  choice: प्रार्थना और दया की विनतियाँ करते हुए
  rationale: इब्रानी रचना का आशय प्रार्थना और अनुग्रह की याचना के द्वारा परमेश्वर की ओर उन्मुख होकर खोजने से है। हिन्दी में यह रूप स्वाभाविक है और ऐसा स्पष्ट कर्म नहीं जोड़ता जो मूल में व्यक्त नहीं है।
- source_word: בְּצוֹם
  choice: उपवास ... के साथ
  rationale: בְּ यहाँ साथ चलने वाली परिस्थिति या साधन दर्शाता है।
- source_word: וְשַׂק
  choice: टाट
  rationale: שַׂק शोक और दीनता के चिह्न के रूप में प्रयुक्त मोटे वस्त्र को दर्शाता है; ‘टाट’ हिन्दी में संक्षिप्त और परिचित समतुल्य है।
- source_word: וָאֵפֶר
  choice: राख
  rationale: राख शोक, पश्चात्ताप और दीनता का बाहरी चिह्न थी; एकवचन सामूहिक हिन्दी संज्ञा स्वाभाविक है।
theological_decisions:
- issue: אֲדֹנָי הָאֱלֹהִים में ईश्वरीय उपाधि
  choice: प्रभु परमेश्वर
  alternative: यहोवा परमेश्वर
  rationale: मूल में אֲדֹנָי है, יהוה नहीं; इसलिए ‘यहोवा’ कहना स्रोत में निहित भेद को मिटा देता।
- issue: לְבַקֵּשׁ का अव्यक्त कर्म
  choice: कोई स्पष्ट कर्म न जोड़कर ‘प्रार्थना ... करते हुए’
  alternative: उसे खोजने के लिए
  rationale: संदर्भ में परमेश्वर की खोज का भाव संभव है, पर इब्रानी में सर्वनाम ‘उसे’ स्पष्ट नहीं है। अनुवाद उस संभावित आशय को बाध्यकारी नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘अपना मुख किया’ मूल के ठोस बिंब को रखता है; ‘दया की विनतियाँ’ תחנונים की नम्र और अनुग्रह-याचक तीव्रता व्यक्त करता है।
