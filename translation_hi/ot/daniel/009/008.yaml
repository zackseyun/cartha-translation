base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/008.yaml
  text: O Lord[a], to us belongs shame of face—to our kings, to our princes[b], and to our fathers—because we have sinned against you.
translation:
  language: hi
  text: हे यहोवा, हम पर—हमारे राजाओं, हमारे अधिकारियों और हमारे पुरखों पर—लज्जा है,[क] क्योंकि हमने तेरे विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: इब्रानी में शाब्दिक रूप से, “मुख की लज्जा”; यह सार्वजनिक अपमान या गहरी लज्जा का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לָנוּ בֹּשֶׁת הַפָּנִים
  choice: हमारे लिए लज्जित होना ही रह गया है
  rationale: शाब्दिक ‘चेहरे की लज्जा’ सार्वजनिक अपमान और लज्जा का इब्रानी मुहावरा है। स्वाभाविक हिन्दी में इसका भाव रखा गया है, जबकि ‘हमारे लिए’ मूल के संबंधसूचक לָנוּ को व्यक्त करता है।
- source_word: לִמְלָכֵינוּ
  choice: हमारे राजाओं के लिए
  rationale: राजकीय पद और आरंभिक संबंधसूचक संरचना दोनों सुरक्षित रखे गए हैं।
- source_word: לְשָׂרֵינוּ
  choice: हमारे हाकिमों के लिए
  rationale: שָׂרִים यहाँ राजकीय शासकों या अधिकारियों को सूचित करता है; ‘हाकिम’ आधुनिक हिन्दी में व्यापक राजनीतिक अर्थ देता है और अनिवार्य वंशगत ‘राजकुमार’ का अतिरिक्त भाव नहीं जोड़ता।
- source_word: וְלַאֲבֹתֵינוּ
  choice: और हमारे पुरखों के लिए भी
  rationale: אָבוֹת का संदर्भ पूर्वज पिताओं से है; ‘पुरखे’ हिन्दी में स्वाभाविक रूप से वही ऐतिहासिक अर्थ देता है।
- source_word: אֲשֶׁר חָטָאנוּ לָךְ
  choice: क्योंकि हमने तेरे विरुद्ध पाप किया है
  rationale: אֲשֶׁר यहाँ कारण बताता है, और חטא के साथ לָךְ अपराध से प्रभावित पक्ष को दर्शाता है; हिन्दी में ‘तेरे विरुद्ध पाप’ स्वाभाविक है। पूर्ण क्रिया का वर्तमान-संबद्ध दोषस्वीकार ‘किया है’ से व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाता है और नाम को उपाधि में विलीन नहीं करता।
- issue: सामूहिक दोषस्वीकार की व्यापकता
  choice: हमारे राजाओं, हाकिमों और पुरखों को भी सामूहिक लज्जा में सम्मिलित रखना
  alternative: केवल वर्तमान वक्ताओं तक कथन सीमित करना
  rationale: बार-बार प्रयुक्त לְ प्रत्यययुक्त पद सभी तीन समूहों को उसी लज्जा से जोड़ते हैं; अनुवाद इस ऐतिहासिक और सामूहिक उत्तरदायित्व को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। परमेश्वर को संबोधन में ‘तेरे’ रखा गया है, जो हिन्दी धर्मग्रंथीय प्रयोग में निकट और गंभीर दोनों है। इब्रानी मुहावरे का यांत्रिक ‘मुख की लज्जा’ न देकर उसका सहज हिन्दी भाव दिया गया है।
