base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/021.yaml
  text: while I was still speaking in prayer[a], the man Gabriel, whom I had seen in the vision at the beginning, came to me in swift flight at the time of the evening offering.
translation:
  language: hi
  text: जब मैं अभी प्रार्थना में बोल ही रहा था, तब वह पुरुष जिब्राईल, जिसे मैंने आरम्भ में दर्शन में देखा था, तीव्र गति से उड़ता हुआ[a] सायंकाल की भेंट के समय मेरे पास पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कम सम्भावना से, “थका हुआ” अथवा “थकावट में।” इब्रानी पदबंध कठिन है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹד אֲנִי מְדַבֵּר בַּתְּפִלָּה
  choice: जब मैं प्रार्थना में अभी बोल ही रहा था
  rationale: यह अनुवाद जारी क्रिया और उसी समय घटे जिब्राईल के आगमन को स्वाभाविक हिन्दी में व्यक्त करता है, साथ ही ‘प्रार्थना में बोलने’ की मूल अभिव्यक्ति को बनाए रखता है।
- source_word: הָאִישׁ גַּבְרִיאֵל
  choice: वही पुरुष जिब्राईल
  rationale: ‘पुरुष’ इब्रानी אִישׁ का सीधा अर्थ है और जिब्राईल के मानवीय रूप में दिखाई देने का वर्णन सुरक्षित रखता है। ‘वही’ पहले देखे गए व्यक्ति की ओर संकेत स्पष्ट करता है।
- source_word: אֲשֶׁר רָאִיתִי בֶחָזוֹן בַּתְּחִלָּה
  choice: जिसे मैंने आरम्भ में दर्शन में देखा था
  rationale: यह בַּתְּחִלָּה के ‘आरम्भ में/पहले’ वाले अर्थ को बिना अनावश्यक रूप से किसी विशेष पूर्व दर्शन तक सीमित किए बनाए रखता है।
- source_word: מֻעָף בִּיעָף
  choice: तीव्र गति से उड़ता हुआ
  rationale: कठिन पदबंध की पारम्परिक और सन्दर्भानुकूल व्याख्या तेज उड़ान की है। वैकल्पिक ‘थकावट’ सम्बन्धी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נֹגֵעַ אֵלַי
  choice: मेरे पास पहुँचा
  rationale: נגע यहाँ ‘छूना’ या ‘पहुँचना’ हो सकता है। आगमन के सन्दर्भ में ‘मेरे पास पहुँचा’ स्वाभाविक है और शारीरिक स्पर्श को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: כְּעֵת מִנְחַת עָרֶב
  choice: लगभग साँझ की भेंट के समय
  rationale: כְּעֵת की अनुमानसूचक कालगत शक्ति को ‘लगभग’ व्यक्त करता है। ‘साँझ की भेंट’ מִנְחָה को किसी विशेष सामग्री वाली बलि तक सीमित नहीं करती।
theological_decisions:
- issue: מֻעָף בִּיעָף में जिब्राईल की गति का स्वरूप
  choice: जिब्राईल तीव्र गति से उड़ता हुआ आया।
  alternative: जिब्राईल थका-माँदा या थकावट में आया।
  rationale: पदबंध शब्दार्थ की दृष्टि से कठिन है। प्रसंग और प्राचीन प्रचलित समझ तेज गति या उड़ान का समर्थन करते हैं, पर थकावट से जुड़ा पाठार्थ भी सम्भव माना गया है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिब्राईल,’ ‘दर्शन,’ और ‘साँझ की भेंट’ जैसे स्थापित बाइबलीय शब्द प्रयुक्त हुए हैं; कठिन इब्रानी पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में संरक्षित है।
