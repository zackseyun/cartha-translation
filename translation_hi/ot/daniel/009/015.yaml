source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנָ֣/י אֱלֹהֵ֗י/נוּ אֲשֶׁר֩ הוֹצֵ֨אתָ אֶֽת עַמְּ/ךָ֜ מֵ/אֶ֤רֶץ מִצְרַ֨יִם֙ בְּ/יָ֣ד חֲזָקָ֔ה וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כַּ/יּ֣וֹם הַ/זֶּ֑ה חָטָ֖אנוּ רָשָֽׁעְנוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/015.yaml
  text: And now[a], O Lord our God, who brought your people out of the land of Egypt with a strong hand and made for yourself a name, as it is this day—we have sinned[c][b]; we have acted wickedly.
translation:
  language: hi
  text: और अब, हे प्रभु, हमारे परमेश्वर, आपने अपने लोगों को शक्तिशाली हाथ से मिस्र देश से निकाला और अपने लिए नाम कमाया[a], जैसा कि आज भी है[b]—हमने पाप किया है; हमने दुष्टता की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने लिए नाम बनाया”; अर्थात अपने लिए ख्याति प्राप्त की।
    reason: मूल इब्रानी मुहावरे और हिन्दी में उसके आशय को स्पष्ट करना।
  - marker: b
    text: या, “आज के दिन तक।”
    reason: כַּיּוֹם הַזֶּה के संभव कालगत अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: हे प्रभु हमारे परमेश्वर
  rationale: प्रार्थना में संबोधन को स्पष्ट रखते हुए אֲדֹנָי को ‘प्रभु’ और אֱלֹהֵינוּ को स्वाभाविक हिन्दी ‘हमारे परमेश्वर’ से व्यक्त किया गया है।
- source_word: הוֹצֵאתָ אֶת־עַמְּךָ מֵאֶרֶץ מִצְרַיִם
  choice: आपने अपने लोगों को ... मिस्र देश से निकाला
  rationale: हिफ़ील क्रिया का अर्थ ‘बाहर निकालना’ है। यह अनुवाद निर्गमन के संकेत और परमेश्वर से सीधे किए गए आदरपूर्ण संबोधन, दोनों को बनाए रखता है।
- source_word: בְּיָד חֲזָקָה
  choice: शक्तिशाली हाथ से
  rationale: मूल के ‘हाथ’ रूपक को सुरक्षित रखा गया है; ‘शक्तिशाली’ חֲזָקָה की सामर्थ्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: अपने लिए नाम कमाया
  rationale: इब्रानी मुहावरे में ख्याति या यश प्राप्त करने का भाव है। ‘नाम कमाया’ हिन्दी का स्वाभाविक मुहावरा है और मूल के ‘नाम’ बिंब को भी बचाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा आज भी है
  rationale: यह वाक्यांश परमेश्वर के नाम की वर्तमान और निरंतर प्रसिद्धि की ओर संकेत करता है। वैकल्पिक कालगत अर्थ को पादटिप्पणी में रखा गया है।
- source_word: חָטָאנוּ רָשָׁעְנוּ
  choice: हमने पाप किया है; हमने दुष्टता की है
  rationale: 'दोनों स्वीकारोक्तिपरक क्रियाओं को अलग रखा गया है: पहली पाप करने को और दूसरी दुष्ट आचरण को व्यक्त करती है। पूर्ण वर्तमान रूप वर्तमान में स्वीकारे जा रहे दोष को दर्शाता है।'
theological_decisions:
- issue: निर्गमन का संकेत और परमेश्वर के नाम का मुहावरा
  choice: ‘मिस्र देश’, ‘शक्तिशाली हाथ’ और ‘नाम’ की मूल छवियों को बनाए रखना
  alternative: ‘अपनी सामर्थ्य से मिस्र से छुड़ाया और यश पाया’ जैसा अधिक भावानुवादी रूप
  rationale: पद जानबूझकर इस्राएल के मूल उद्धार-इतिहास को स्मरण करता है। मूल छवियाँ रखने से उसका वाचागत और धर्मवैचारिक संबंध सुरक्षित रहता है, जबकि हिन्दी अभी भी स्वाभाविक है।
- issue: כַּיּוֹם הַזֶּה का कालगत बल
  choice: ‘जैसा आज भी है’
  alternative: ‘आज के दिन तक’
  rationale: दोनों अर्थ निकट हैं। मुख्य पाठ वर्तमान में दिखाई देने वाली ख्याति पर बल देता है; पादटिप्पणी निरंतरता पर बल देने वाला वैकल्पिक अनुवाद सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक है। ‘आपने’ परमेश्वर से सीधे संबोधन में स्वाभाविक हिन्दी आदरसूचक रूप है। निर्गमन से जुड़ी ‘शक्तिशाली हाथ’ और ‘नाम’ की छवियाँ जानबूझकर रखी गई हैं; अति-संस्कृत या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
