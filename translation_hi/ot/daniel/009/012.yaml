  text: וַ/יָּ֜קֶם אֶת דברי/ו אֲשֶׁר דִּבֶּ֣ר עָלֵ֗י/נוּ וְ/עַ֤ל שֹֽׁפְטֵ֨י/נוּ֙ אֲשֶׁ֣ר שְׁפָט֔וּ/נוּ לְ/הָבִ֥יא עָלֵ֖י/נוּ רָעָ֣ה גְדֹלָ֑ה אֲשֶׁ֣ר לֹֽא נֶעֶשְׂתָ֗ה תַּ֚חַת כָּל הַ/שָּׁמַ֔יִם כַּ/אֲשֶׁ֥ר נֶעֶשְׂתָ֖ה בִּ/ירוּשָׁלִָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/012.yaml
  text: He has confirmed his words that he spoke against us and against our judges who judged us[a], by bringing upon us a great disaster such as had not been done under all heaven, as it was done in Jerusalem.
translation:
  language: hi
  text: उसने अपने वे वचन पूरे किए जो उसने हमारे और हमारे न्यायाधीशों, जिन्होंने हमारा न्याय किया, के विरुद्ध कहे थे[a], हम पर बड़ी विपत्ति लाकर; सारे आकाश के नीचे वैसी विपत्ति कहीं नहीं आई थी जैसी यरूशलेम में आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर शासन करनेवाले हमारे शासकों के विरुद्ध।” यहाँ “न्यायाधीशों” और “न्याय किया” के लिए प्रयुक्त इब्रानी शब्द अधिक व्यापक अर्थ में शासन करनेवाले अधिकारियों और उनके शासन को भी दर्शा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: उसने ... वचन पूरे किए
  rationale: हिफ़ील रूप यहाँ पहले कहे गए न्याय-वचनों को प्रभावी करने या पूरा करने का अर्थ देता है। ‘पूरे किए’ स्वाभाविक हिन्दी में यह बताता है कि परमेश्वर ने अपनी कही बात सत्य कर दिखाई।
- source_word: דבריו
  choice: अपने वे वचन
  rationale: इब्रानी बहुवचन को बनाए रखा गया है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य से वचनों को स्वाभाविक रूप से जोड़ता है।
- source_word: דִּבֶּר עָלֵינוּ
  choice: हमारे ... विरुद्ध कहे थे
  rationale: न्याय के इस प्रसंग में עַל का विरोधात्मक भाव ‘विरुद्ध’ से स्पष्ट होता है।
- source_word: שֹׁפְטֵינוּ אֲשֶׁר שְׁפָטוּנוּ
  choice: हमारा न्याय करनेवाले हमारे न्यायियों
  rationale: संज्ञा और क्रिया की इब्रानी शब्द-पुनरावृत्ति को हिन्दी में यथासंभव सुरक्षित रखा गया है। शפט का शासन-संबंधी व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְהָבִיא עָלֵינוּ
  choice: उसने हम पर ... ला दी
  rationale: इनफ़िनिटिव को परिणाम/साधन के रूप में स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है; इससे वचनों का पूरा होना विपत्ति लाने के द्वारा स्पष्ट होता है।
- source_word: רָעָה גְדֹלָה
  choice: बड़ी विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, दंडस्वरूप विपत्ति को दर्शाता है। ‘बड़ी विपत्ति’ प्रतिष्ठित, स्पष्ट और प्रसंगानुकूल हिन्दी है।
- source_word: אֲשֶׁר לֹא נֶעֶשְׂתָה
  choice: जैसी ... कहीं नहीं आई थी
  rationale: शाब्दिक ‘की नहीं गई थी’ हिन्दी में अस्वाभाविक और विपत्ति के लिए अस्पष्ट होता। ‘आई थी’ अभूतपूर्व आपदा का भाव सहज रूप से संप्रेषित करता है।
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: सारे आकाश के नीचे
  rationale: इब्रानी विश्वव्यापी मुहावरे की छवि बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है।
- source_word: כַּאֲשֶׁר נֶעֶשְׂתָה בִּירוּשָׁלָם
  choice: वैसी ही जैसी यरूशलेम में आई
  rationale: स्त्रीलिंग क्रिया का संबंध ‘विपत्ति’ से है। हिन्दी में ‘आई’ इस संबंध को स्पष्ट रखती है और मूल तुलना को सुरक्षित करती है।
theological_decisions:
- issue: पूरे पद में निहित कर्ता का संदर्भ
  choice: आरंभ में ‘उसने’ रखकर कर्ता को नामित नहीं किया गया; निकटवर्ती संदर्भ में यह परमेश्वर है।
  alternative: ‘परमेश्वर ने’ स्पष्ट रूप से जोड़ना
  rationale: प्रार्थना के संदर्भ से कर्ता परमेश्वर स्पष्ट है, पर इब्रानी पद में नाम नहीं दोहराया गया। सर्वनाम मूल की शैली को सुरक्षित रखता है और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- issue: यरूशलेम की विपत्ति के लिए कर्मवाच्य बनाम घटनात्मक अभिव्यक्ति
  choice: ‘यरूशलेम में आई’
  alternative: ‘यरूशलेम में की गई’
  rationale: इब्रानी में कर्मवाच्य है, पर स्पष्ट मानवीय कर्ता नहीं दिया गया। हिन्दी में ‘विपत्ति आई’ प्राकृतिक है और इस अस्पष्टता को बनाए रखता है कि विनाश के प्रत्यक्ष कर्ता कौन थे, जबकि व्यापक प्रसंग इसे परमेश्वर के न्याय के रूप में देखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘वचन पूरे किए’ तथा ‘बड़ी विपत्ति’ जैसे परिचित बाइबलीय पदबंध रखे गए हैं। मूल की ‘न्यायी/न्याय करना’ शब्द-पुनरावृत्ति मुख्य पाठ में सुरक्षित है, जबकि उसके व्यापक शासन-संबंधी अर्थ को पादटिप्पणी में बताया गया है।
