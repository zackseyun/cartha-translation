base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/020.yaml
  text: While I was still speaking and praying[a], confessing my sin and the sin of my people Israel, and presenting my plea before Yahweh my God concerning the holy mountain of my God[b],
translation:
  language: hi
  text: जब मैं अभी भी बोल रहा था और प्रार्थना कर रहा था, अपने पाप और अपनी प्रजा इस्राएल के पाप को स्वीकार कर रहा था, और याहवे, अपने परमेश्वर, के सामने अपने परमेश्वर के पवित्र पर्वत[b] के विषय में अपनी विनती[a] प्रस्तुत कर रहा था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी मुहावरे का शाब्दिक अर्थ है, “अपनी विनती को याहवे के सामने गिरा रहा था।” ‘विनती’ का अनुवाद ‘अनुनय’ या ‘याचना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे परमेश्वर का पवित्र पर्वत” सिय्योन/यरूशलेम की ओर संकेत करता है, जहाँ परमेश्वर का पवित्र स्थान था।
    reason: cultural_note
lexical_decisions:
- source_word: וְעוֹד אֲנִי
  choice: जब मैं अभी ... ही रहा था
  rationale: यह चल रही क्रिया का समय-संबंध व्यक्त करता है और हिन्दी में आगामी कृदन्तों के साथ स्वाभाविक है।
- source_word: מְדַבֵּר וּמִתְפַּלֵּל
  choice: बोल ही रहा था और प्रार्थना कर रहा था
  rationale: दोनों समकालिक क्रियाओं को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: וּמִתְוַדֶּה
  choice: स्वीकार कर रहा था
  rationale: पाप को कर्म के रूप में लेने पर मूल धातु का अर्थ पाप मानना या स्वीकार करना है; यहाँ धन्यवाद या स्तुति का अर्थ उपयुक्त नहीं।
- source_word: חַטָּאתִי וְחַטַּאת עַמִּי יִשְׂרָאֵל
  choice: अपने पाप और अपनी प्रजा इस्राएल के पाप
  rationale: मूल के एकवचन ‘पाप’ और ‘मेरी प्रजा इस्राएल’ के संबंध को बनाए रखता है।
- source_word: וּמַפִּיל תְּחִנָּתִי
  choice: अपनी विनती प्रस्तुत कर रहा था
  rationale: शाब्दिक रूप से ‘अपनी विनती गिरा रहा था’, पर परमेश्वर के सामने प्रार्थना रखने के इस इब्रानी मुहावरे को आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: עַל הַר קֹדֶשׁ אֱלֹהָי
  choice: अपने परमेश्वर के पवित्र पर्वत के विषय में
  rationale: עַל का प्रसंगानुकूल विषयवाचक अर्थ और ‘मेरे परमेश्वर’ की पुनरावृत्ति सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरीय नाम है; ‘याहवे’ उसे नाम के रूप में स्पष्ट रखता है, जबकि ‘प्रभु’ उसे उपाधि बना देता है।
- issue: ‘पवित्र पर्वत’ की पहचान
  choice: मुख्य पाठ में केवल ‘पवित्र पर्वत’; पहचान पादटिप्पणी में
  alternative: मुख्य पाठ में ‘सिय्योन/यरूशलेम’ जोड़ना
  rationale: मूल की अभिव्यक्ति को ज्यों का त्यों रखते हुए उसका ऐतिहासिक संकेत पाठक के लिए पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद आगे आने वाले वाक्य से जुड़ा है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है। मूल में ‘मेरे परमेश्वर’ की दोहरी उपस्थिति को हिन्दी में दोनों स्थानों पर सुरक्षित रखा गया है।
