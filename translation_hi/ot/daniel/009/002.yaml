  text: בִּ/שְׁנַ֤ת אַחַת֙ לְ/מָלְכ֔/וֹ אֲנִי֙ דָּֽנִיֵּ֔אל בִּינֹ֖תִי בַּ/סְּפָרִ֑ים מִסְפַּ֣ר הַ/שָּׁנִ֗ים אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶל יִרְמִיָ֣ה הַ/נָּבִ֔יא לְ/מַלֹּ֛אות לְ/חָרְב֥וֹת יְרוּשָׁלִַ֖ם שִׁבְעִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/002.yaml
  text: 'In the first year of his reign[a], I, Daniel, understood from the books the number of the years about which the word of Yahweh had come to Jeremiah the prophet, for the completion of the desolations of Jerusalem: seventy years.'
translation:
  language: hi
  text: उसके राज्यकाल के पहले वर्ष में मैं दानिय्येल पुस्तकों[a] से समझ सका कि यरूशलेम के उजाड़ पड़े रहने के सत्तर वर्ष पूरे होने थे; याहवे का यह वचन यिर्मयाह नबी के पास आया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लपेटे हुए ग्रंथों।” हिब्रू शब्द सामान्य रूप से लिखित दस्तावेज़ों के लिए प्रयुक्त हो सकता है; प्राचीन काल में वे प्रायः लपेटे हुए ग्रंथ होते थे।
    reason: cultural_note
lexical_decisions:
- source_word: בִּשְׁנַת אַחַת לְמָלְכוֹ
  choice: उसके राज्यकाल के पहले वर्ष में
  rationale: कार्डिनल ‘एक’ यहाँ मुहावरे के रूप में क्रमवाचक ‘पहला’ व्यक्त करता है। ‘राज्यकाल’ उसके शासन की अवधि को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: בִּינֹתִי בַּסְּפָרִים
  choice: मैंने पुस्तकों से ... समझी
  rationale: בין यहाँ समझ या अंतर्दृष्टि पाने का भाव देता है, और בַּסְּפָרִים को साधन/स्रोत के अर्थ में ‘पुस्तकों से’ कहा गया है। प्राचीन लिखित सामग्री के रूप में ‘पुस्तकें’ और ‘लपेटे हुए ग्रंथ’ दोनों संभावित हैं।
- source_word: מִסְפַּר הַשָּׁנִים
  choice: उन वर्षों की संख्या
  rationale: यह विशिष्ट भविष्यवाणी में बताई गई वर्षों की कुल संख्या को व्यक्त करता है और हिन्दी में सहज है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय ‘याहवे’ रूप में लिप्यंतरित किया गया है; דְבַר के लिए भविष्यसूचक संदर्भ में ‘वचन’ उपयुक्त है।
- source_word: לְמַלֹּאות לְחָרְבוֹת יְרוּשָׁלִַם שִׁבְעִים שָׁנָה
  choice: यरूशलेम के उजाड़ पड़े रहने के सत्तर वर्ष पूरे होने थे
  rationale: यह पूर्ण अवधि तक पहुँचने का समय-संबंधी भाव स्पष्ट करता है। חָרְבוֹת के बहुवचन को हिन्दी में स्वाभाविक अवस्थावाचक अभिव्यक्ति ‘उजाड़ पड़े रहने’ से प्रस्तुत किया गया है, केवल भौतिक खंडहरों तक सीमित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: לְמַלֹּאות और यरूशलेम के उजाड़ होने की अवधि का संबंध
  choice: यरूशलेम के उजाड़ पड़े रहने के सत्तर वर्ष पूरे होने थे
  alternative: यरूशलेम के उजाड़ों को पूरा करने के लिए सत्तर वर्ष
  rationale: चुना हुआ पाठ सत्तर वर्षों की अवधि के पूरा होने पर बल देता है, पर यह निर्धारित नहीं करता कि ‘पूरा करने’ का कर्ता कौन है। इस प्रकार हिब्रू की समय-संबंधी बात बनी रहती है और अनावश्यक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। ‘मुझ दानिय्येल’ मूल के आत्म-उल्लेख पर बल को बनाए रखता है। मुख्य वाक्य में दीर्घ उपवाक्य को स्पष्ट करने के लिए दीर्घ विराम-चिह्न का प्रयोग किया गया है।
