  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘वाचा’, ‘बलिदान’ और ‘भेंट’ जैसे स्थापित बाइबिलीय शब्द सुरक्षित हैं। अत्यन्त कठिन ‘पंख’ वाले रूपक को सहज बनाने के नाम पर व्याख्यात्मक ढंग से नहीं बदला गया।
