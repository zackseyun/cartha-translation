base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/027.yaml
  text: And he will make a firm covenant with the many for one week[a], and for half of the week he will put a stop to sacrifice and offering. And on the wing of abominations will come one who makes desolate[e][d][c][b], until the decreed end is poured out on the desolator.
translation:
  language: hi
  text: वह एक सप्ताह के लिए बहुतों के साथ वाचा को दृढ़ बनाएगा[a], और आधे सप्ताह तक वह बलिदान और भेंट[b] को बन्द कर देगा। घृणित वस्तुओं के पंख पर[c] उजाड़ने वाला आएगा[d], जब तक कि ठहराया हुआ अन्त उजाड़ने वाले पर उँडेला न जाए[e]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वाचा की पुष्टि करेगा’ अथवा ‘वाचा को बलवन्त करेगा।’ हिब्रू क्रिया का अर्थ किसी चीज़ को दृढ़ या प्रबल करना है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बलिदान और अन्नबलि।’ दूसरा शब्द विशेष रूप से अन्न की भेंट को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘घृणित वस्तुओं के पंख पर।’ यह पदबंध कठिन है; ‘घृणित वस्तुओं के शिखर पर’ भी सम्भव है।
    reason: alternative_reading
  - marker: d
    text: या ‘उजाड़ करने वाला’ अथवा ‘उजाड़ उत्पन्न करने वाला।’ ‘आएगा’ हिन्दी में वाक्य पूरा करने के लिए जोड़ा गया है।
    reason: lexical_alternative
  - marker: e
    text: या ‘उजाड़े गए व्यक्ति पर’ अथवा ‘उजाड़ स्थान पर।’ अन्तिम वाक्यांश का पाठ स्थिर है, पर उसका वाक्य-विन्यास कठिन है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגְבִּיר
  choice: वाचा को दृढ़ करेगा
  rationale: हिफ़ईल रूप का मूल भाव किसी वस्तु को दृढ़ या प्रबल करना है। यह अनुवाद किसी पहले से विद्यमान वाचा की केवल पुष्टि मान लेने के बजाय हिब्रू की व्यापक अर्थ-सीमा बनाए रखता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह बाइबिलीय हिब्रू का गंभीर वाचागत शब्द है; ‘समझौता’ इसका धार्मिक और साहित्यिक भार घटा देता।
- source_word: לָרַבִּים
  choice: बहुतों के साथ
  rationale: לְ यहाँ संबंधसूचक ‘के साथ’ समझा जा सकता है, और רַבִּים एक सामूहिक समूह की ओर संकेत करता है।
- source_word: שָׁבוּעַ אֶחָד
  choice: एक सप्ताह के लिए
  rationale: इस संदर्भ में שָׁבוּעַ सात की एक अवधि को दर्शाता है। ‘सप्ताह’ प्रचलित और सुबोध है, जबकि उसकी प्रतीकात्मक या कालगत व्याख्या पाठक पर छोड़ी गई है।
- source_word: וַחֲצִי הַשָּׁבוּעַ
  choice: और आधे सप्ताह तक
  rationale: यह स्वाभाविक हिन्दी में अवधि का भाव देता है और ‘सप्ताह के बीच में’ कहकर समय-बिंदु की व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יַשְׁבִּית
  choice: बन्द कर देगा
  rationale: שׁבת के हिफ़ईल रूप में किसी चीज़ को रुकवा देने या समाप्त कर देने का कारणवाचक भाव है।
- source_word: זֶבַח וּמִנְחָה
  choice: बलिदान और भेंट
  rationale: זֶבַח वध-संबंधी बलिदान है; מִנְחָה भेंट है और यहाँ विशेषतः अन्नबलि भी हो सकती है। मुख्य पाठ में सामान्य ‘भेंट’ रखा गया और विशिष्ट अर्थ टिप्पणी में दिया गया है।
- source_word: וְעַל כְּנַף שִׁקּוּצִים
  choice: घृणित वस्तुओं के पंख पर
  rationale: כָּנָף का सामान्य अर्थ ‘पंख’ है। कठिन रूपक को ‘शिखर’ जैसे स्थापत्य अर्थ से चुपचाप बदलने के बजाय मूल अस्पष्टता सुरक्षित रखी गई है।
- source_word: מְשֹׁמֵם
  choice: उजाड़ने वाला आएगा
  rationale: यह שׁמם का कारणवाचक कृदन्त है और उजाड़ उत्पन्न करने वाले को दर्शाता है। हिन्दी वाक्य पूरा करने के लिए ‘आएगा’ जोड़ा गया है, जैसा संदर्भ में निहित माना जा सकता है।
- source_word: וְעַד כָּלָה וְנֶחֱרָצָה
  choice: जब तक कि ठहराया हुआ अन्त
  rationale: दोनों शब्द मिलकर ऐसे अन्त या पूर्ण विनाश का भाव देते हैं जो निर्धारित किया जा चुका है।
- source_word: תִּתַּךְ
  choice: उण्डेल न दिया जाए
  rationale: נתך का अर्थ उण्डेलना है और न्याय के उण्डेले जाने की छवि को बनाए रखना उचित है। ‘जब तक कि’ के बाद हिन्दी में यह रूप स्वाभाविक है।
- source_word: עַל שֹׁמֵם
  choice: उजाड़ने वाले पर
  rationale: पुल्लिंग एकवचन कृदन्त को कर्ता—अर्थात उजाड़ उत्पन्न करने वाला—मानना रूप-विज्ञान की दृष्टि से सबसे सीधा है, यद्यपि अन्य वाक्यगत संभावनाएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: पूरे पद में ‘वह’ की पहचान
  choice: सर्वनाम को बिना किसी स्पष्ट पहचान के ‘वह’ ही रखा गया है।
  alternative: अभिषिक्त जन/मसीह; पिछले पद का आने वाला प्रधान; अन्तियोकस चतुर्थ जैसा ऐतिहासिक अपवित्रकर्ता; या अन्तकालीन मसीह-विरोधी शासक।
  rationale: इस पद का हिब्रू पाठ स्वयं कर्ता की स्पष्ट पहचान नहीं करता। किसी एक धार्मिक या ऐतिहासिक व्याख्या को मुख्य पाठ में बैठाना मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: כְּנַף שִׁקּוּצִים का अर्थ
  choice: ‘घृणित वस्तुओं के पंख’ के रूप में अपेक्षाकृत शाब्दिक अनुवाद।
  alternative: घृणित वस्तुओं का शिखर; घृणित वस्तुओं का छोर; अथवा घृणित वस्तुओं के साथ/ऊपर।
  rationale: पदबंध शब्दार्थ और वाक्य-विन्यास दोनों की दृष्टि से कठिन है। शाब्दिक रूपक को बनाए रखने और विकल्प टिप्पणी में देने से विवादित स्थापत्य या प्रतीकात्मक व्याख्या आरोपित नहीं होती।
- issue: अन्तिम שֹׁמֵם का संकेत
  choice: ‘उजाड़ने वाला’।
  alternative: उजाड़ा गया व्यक्ति; अथवा उजाड़ स्थान।
  rationale: पुल्लिंग एकवचन कृदन्त कर्ता को सूचित करने की सबसे स्वाभाविक संभावना देता है, पर कठिन वाक्य-विन्यास के कारण कर्मवाचक या स्थानसूचक समझ भी टिप्पणी में रखी गई है।
