source:
  edition: WLC
  text: וַ/יִּשְׁקֹ֤ד יְהוָה֙ עַל הָ֣/רָעָ֔ה וַ/יְבִיאֶ֖/הָ עָלֵ֑י/נוּ כִּֽי צַדִּ֞יק יְהוָ֣ה אֱלֹהֵ֗י/נוּ עַל כָּל מַֽעֲשָׂי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה וְ/לֹ֥א שָׁמַ֖עְנוּ בְּ/קֹלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/014.yaml
  text: So Yahweh kept watch over the disaster and brought it upon us[a], for Yahweh our God is righteous in all the works that he has done[c][b], and we have not listened to his voice.
translation:
  language: hi
  text: इसलिए यहोवा उस विपत्ति[a] पर नज़र रखता रहा[b] और उसे हम पर ले आया, क्योंकि यहोवा, हमारा परमेश्वर, अपने किए हुए सब कामों में धर्मी है, और हमने उसकी बात नहीं मानी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विपत्ति’ का अनुवाद ‘संकट’ भी हो सकता है। इब्रानी शब्द का अर्थ ‘बुराई’ भी होता है, पर यहाँ वह न्याय के रूप में लोगों पर आई विपत्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नज़र रखता रहा’ का अर्थ ‘सतर्क रहा’ या ‘उसके विषय में जागरूक रहा’ भी हो सकता है; अधिक भावानुवाद में, ‘उसे लाने में देर नहीं की।’
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक अर्थ: ‘हमने उसकी आवाज़ नहीं सुनी।’ इस इब्रानी मुहावरे का आशय उसकी कही बात न मानना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁקֹד
  choice: सतर्क रहा
  rationale: שׁקד जागते रहने, चौकस रहने या किसी बात के पूरा होने पर निगाह रखने का भाव देता है। यहाँ यहोवा की घोषित न्याय-विपत्ति को कार्यान्वित करने में उसकी सतर्कता व्यक्त होती है; यह अनुवाद रूपक को बचाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है और इसे किसी उपाधि से नहीं बदलता।
- source_word: הָרָעָה
  choice: उस विपत्ति
  rationale: न्याय के इस प्रसंग में רָעָה नैतिक बुराई के बजाय लोगों पर आई दंडात्मक विपत्ति को दर्शाता है। निश्चित पद הָ और पूर्व प्रसंग की ओर संकेत को ध्यान में रखते हुए 'उस' रखा गया है।
- source_word: וַיְבִיאֶהָ עָלֵינוּ
  choice: उसे हम पर ले आया
  rationale: स्त्रीलिंग प्रत्यय का संबंध 'विपत्ति' से है। यह causative בוא और עָלֵינוּ का स्वाभाविक तथा निकट हिन्दी रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का आधार प्रस्तुत करता है और हिन्दी में कारण-संबंध स्पष्ट करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह परमेश्वर के कार्यों की नैतिक और न्यायपूर्ण सही अवस्था को व्यक्त करने वाला मानक बाइबलीय शब्द है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: मूल के प्रथम पुरुष बहुवचन संबंधसूचक रूप को सीधे व्यक्त करता है।
- source_word: עַל כָּל מַעֲשָׂיו אֲשֶׁר עָשָׂה
  choice: अपने किए हुए सभी कामों में
  rationale: यह עַל के 'के संबंध में/में' भाव तथा मूल की पूर्ण क्रिया को सहज हिन्दी में व्यक्त करता है, बिना अनावश्यक पुनरुक्ति के।
- source_word: וְלֹא שָׁמַעְנוּ בְּקֹלוֹ
  choice: फिर भी हमने उसकी बात नहीं मानी
  rationale: שׁמע בקול केवल ध्वनि सुनने नहीं, बल्कि कही हुई बात मानने का मुहावरा है। प्रसंग में विरोध स्पष्ट होने के कारण 'फिर भी' स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर के कार्य के संबंध में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई; संकट
  rationale: न्याय-संदर्भ में यह लोगों पर लाई गई दंडात्मक आपदा है, न कि परमेश्वर द्वारा नैतिक बुराई किया जाना। साथ ही पाठ का स्पष्ट दावा सुरक्षित रहता है कि वही इसे उन पर लाया और अपने कार्यों में धर्मी है।
- issue: וְלֹא के संबंध का हिन्दी निरूपण
  choice: फिर भी हमने
  alternative: और हमने
  rationale: मूल वाव सामान्य संयोजक है, पर कथन में परमेश्वर की धार्मिकता और लोगों की अवज्ञा के बीच प्रसंगगत विरोध है। 'फिर भी' हिन्दी में उस संबंध को स्वाभाविक रूप से व्यक्त करता है, बिना मूल कथन को बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। वाक्य में न्याय-विपत्ति, परमेश्वर की धार्मिकता और लोगों की अवज्ञा—तीनों दावों को स्पष्ट रखा गया है। 'यहोवा' व्यक्तिगत नाम के रूप में और 'परमेश्वर' אֱלֹהִים के लिए प्रयुक्त है।
