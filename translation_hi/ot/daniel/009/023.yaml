base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/023.yaml
  text: At the beginning of your pleas[a], a word went out, and I have come to tell it, because you are greatly beloved[b]. So consider the word and understand the vision.
translation:
  language: hi
  text: तुम्हारी विनतियों के आरम्भ में एक वचन[a] निकला, और मैं तुम्हें बताने आया हूँ, क्योंकि तुम अत्यन्त प्रिय[b] हो। इसलिए इस वचन को समझो और दर्शन को समझो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक संदेश निकला।’ इब्रानी में शाब्दिक रूप से ‘एक वचन निकला’ है; इसका आशय बोले गए संदेश या जारी की गई आज्ञा से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम बहुत सम्मानित हो।’ इब्रानी अभिव्यक्ति बताती है कि दानिय्येल विशेष रूप से मूल्यवान या प्रिय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת תַּחֲנוּנֶיךָ
  choice: तुम्हारी विनतियों के आरम्भ में
  rationale: यह कालवाचक पद बताता है कि दानिय्येल की earnest प्रार्थनाएँ आरम्भ होते ही अगली घटना घटी। ‘विनतियाँ’ आधुनिक, गरिमापूर्ण और प्रार्थनापरक आग्रह के लिए स्वाभाविक है।
- source_word: יָצָא דָבָר
  choice: एक वचन निकला
  rationale: शाब्दिक इब्रानी मुहावरे ‘एक वचन निकला’ को बनाए रखता है; यहाँ ‘वचन’ संदेश या जारी की गई आज्ञा—दोनों की सम्भावना खुली रखता है।
- source_word: וַאֲנִי בָּאתִי לְהַגִּיד
  choice: और मैं उसे बताने आया हूँ
  rationale: वक्ता के आने का उद्देश्य पहले उल्लिखित वचन को बताना है। ‘उसे’ सन्दर्भ से स्पष्ट पूरक है और हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: כִּי חֲמוּדוֹת אָתָּה
  choice: क्योंकि तुम अत्यन्त प्रिय हो
  rationale: כִּי को कारणसूचक ‘क्योंकि’ और गहन मूल्य/प्रियता व्यक्त करने वाले बहुवचन חֲמוּדוֹת को ‘अत्यन्त प्रिय’ के रूप में प्रस्तुत किया गया है।
- source_word: וּבִין בַּדָּבָר
  choice: इसलिए उस वचन पर ध्यान दो
  rationale: בין का भाव समझ-बूझ से विचार करने का है। ‘ध्यान दो’ अगले ‘समझो’ से अनावश्यक पुनरुक्ति घटाते हुए विवेकपूर्ण ग्रहण करने की आज्ञा व्यक्त करता है; ‘उस वचन’ पहले आए דָבָר से सम्बन्ध बनाए रखता है।
- source_word: וְהָבֵן בַּמַּרְאֶה
  choice: और दर्शन को समझो
  rationale: מַרְאֶה दानिय्येल में दर्शनीय प्रकाशन या दर्शन को सूचित करता है; आज्ञार्थक ‘समझो’ मूल आग्रह को सीधे व्यक्त करता है।
theological_decisions:
- issue: חֲמוּדוֹת אָתָּה में परमेश्वर के सामने दानिय्येल की स्थिति
  choice: तुम अत्यन्त प्रिय हो
  alternative: तुम्हारा बहुत आदर है
  rationale: ‘अत्यन्त प्रिय’ इस अभिव्यक्ति के सम्बन्धपरक और मूल्यसूचक बल को व्यक्त करता है, पर किसी बाद की धर्मसैद्धान्तिक श्रेणी को इसमें नहीं जोड़ता। पादटिप्पणी सम्मान/मूल्य के वैकल्पिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। दानिय्येल को सम्बोधन में ‘तुम’ प्रयोग हुआ है, जो आज की हिन्दी में स्वाभाविक है और अनावश्यक रूप से कठोर या पुरातन ‘तू’ से बचता है। ‘वचन निकला’ मूल इब्रानी मुहावरे और उसकी अर्थगत व्यापकता को सुरक्षित रखता है।
