source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר כָּתוּב֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֵ֛ת כָּל הָ/רָעָ֥ה הַ/זֹּ֖את בָּ֣אָה עָלֵ֑י/נוּ וְ/לֹֽא חִלִּ֜ינוּ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֵ֗י/נוּ לָ/שׁוּב֙ מֵֽ/עֲוֺנֵ֔/נוּ וּ/לְ/הַשְׂכִּ֖יל בַּ/אֲמִתֶּֽ/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/013.yaml
  text: Just as it is written in the Law of Moses[a], all this calamity has come upon us[c][b], yet we have not sought the favor of Yahweh our God by turning from our iniquities and by gaining insight into your truth.
translation:
  language: hi
  text: जैसा मूसा की व्यवस्था में लिखा है, यह सारी विपत्ति[a] हम पर आ पड़ी है; फिर भी हमने अपने अधर्म से फिरने और आपकी सच्चाई को समझने[c] के द्वारा अपने परमेश्वर याहवे की कृपा नहीं माँगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह सारी आपदा’। यहाँ प्रयुक्त हिब्रू शब्द न्याय के प्रसंग में विपत्ति या विनाशकारी संकट को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हमने अपने परमेश्वर याहवे के मुख/उपस्थिति के सामने विनती नहीं की।’ यह मुहावरा उनकी कृपा या दया पाने के लिए विनती करने का भाव देता है।
    reason: idiom_explanation
  - marker: c
    text: या ‘आपकी विश्वासयोग्यता को समझने’। हिब्रू पद का अनुवाद ‘आपकी सच्चाई में समझदार होने’ के रूप में भी किया जा सकता है।
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: כַּאֲשֶׁר כָּתוּב
  choice: जैसा ... लिखा है
  rationale: तुलना और लिखित चेतावनी के वर्तमान में पूरा होने के संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था में
  rationale: इस वाचा-संबंधी प्रसंग में תּוֹרָה मूसा से जुड़ी विधि और शिक्षा के लिखित निकाय को दर्शाता है; ‘व्यवस्था’ प्रचलित और स्पष्ट हिन्दी पद है।
- source_word: אֵת כָּל הָרָעָה הַזֹּאת
  choice: यह सारी विपत्ति
  rationale: रָעָה यहाँ नैतिक बुराई नहीं, न्यायस्वरूप आई घोर आपदा को दर्शाता है।
- source_word: בָּאָה עָלֵינוּ
  choice: हम पर आ पड़ी है
  rationale: न्याय या आपदा के किसी पर आने का हिब्रू मुहावरा हिन्दी में स्वाभाविक रूप से व्यक्त होता है और वर्तमान परिणाम भी बनाए रखता है।
- source_word: וְלֹא חִלִּינוּ אֶת פְּנֵי
  choice: फिर भी ... कृपा नहीं माँगी
  rationale: शाब्दिक ‘मुख को मनाना/विनती करना’ मुहावरे का आशय अनुग्रह या दया चाहना है; ‘फिर भी’ विपत्ति के बावजूद पश्चात्ताप न करने का विरोध स्पष्ट करता है।
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: अपने परमेश्वर याहवे
  rationale: वाचा के निजी नाम को ‘याहवे’ के रूप में और אֱלֹהֵינוּ के संबंधसूचक अर्थ को ‘अपने परमेश्वर’ से सुरक्षित रखा गया है।
- source_word: לָשׁוּב מֵעֲוֺנֵנוּ
  choice: अपने अधर्म से फिरने
  rationale: שׁוב का पश्चात्ताप-संबंधी ‘फिरना’ और עָוֹן का दोषयुक्त नैतिक भार सुरक्षित रहता है। हिब्रू रूप को सामूहिक एकवचन ‘अधर्म’ के रूप में रखा गया है।
- source_word: וּלְהַשְׂכִּיל בַּאֲמִתֶּךָ
  choice: आपकी सच्चाई को समझने
  rationale: हिफ़ील क्रिया यहाँ विवेकपूर्वक समझने का भाव देती है। בְּ का संबंध ‘सच्चाई’ के विषय या क्षेत्र से हो सकता है; हिन्दी में कर्मवाचक रचना अर्थ को सहज रखती है।
theological_decisions:
- issue: रָעָה का न्याय-संबंधी अर्थ
  choice: विपत्ति
  alternative: बुराई; आपदा
  rationale: प्रसंग मूसा की व्यवस्था में घोषित वाचा-दंड के आ पड़ने का है। ‘विपत्ति’ कठोर न्याय को व्यक्त करती है, पर परमेश्वर पर नैतिक बुराई करने का अनपेक्षित आरोप नहीं लगाती।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; लिप्यंतरण उस नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אֱמֶת का अर्थ
  choice: सच्चाई
  alternative: विश्वासयोग्यता
  rationale: शब्द सत्य और विश्वासयोग्यता दोनों अर्थ दे सकता है। मुख्य पाठ में ‘सच्चाई’ समझने की क्रिया के साथ सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थना-संगत रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आपकी’ रखा गया है। वाक्य की हिब्रू संरचना और कारण-साधन संबंध को बचाते हुए अत्यधिक शाब्दिक एवं अस्वाभाविक मुहावरों से परहेज़ किया गया है।
