source:
  edition: WLC
  text: וְ/כָל יִשְׂרָאֵ֗ל עָֽבְרוּ֙ אֶת תּ֣וֹרָתֶ֔/ךָ וְ/ס֕וֹר לְ/בִלְתִּ֖י שְׁמ֣וֹעַ בְּ/קֹלֶ֑/ךָ וַ/תִּתַּ֨ךְ עָלֵ֜י/נוּ הָ/אָלָ֣ה וְ/הַ/שְּׁבֻעָ֗ה אֲשֶׁ֤ר כְּתוּבָה֙ בְּ/תוֹרַת֙ מֹשֶׁ֣ה עֶֽבֶד הָֽ/אֱלֹהִ֔ים כִּ֥י חָטָ֖אנוּ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/daniel/009/011.yaml
  text: All Israel has transgressed your law and turned aside[a], not listening to your voice. So the curse and the oath that are written in the law of Moses, the servant of God, have been poured out on us, because we have sinned against him.
translation:
  language: hi
  text: सारा इस्राएल तेरी व्यवस्था का उल्लंघन कर चुका है और तेरी आवाज़ न सुनकर भटक गया है। इसलिए वह शाप और वह शपथ[a], जो परमेश्वर के सेवक मूसा की व्यवस्था में लिखे हैं, हम पर उंडेल दिए गए हैं, क्योंकि हमने उसके विरुद्ध पाप किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शपथपूर्वक दिया गया शाप।” इब्रानी में शाब्दिक रूप से “शाप और शपथ” है; संभवतः इसका संकेत मूसा की व्यवस्था में शपथ से दृढ़ किए गए वाचा-दंडों की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: सारे इस्राएल ने
  rationale: כָל पूरे राष्ट्र को सामूहिक रूप से समेटता है। हिंदी में ‘सारे इस्राएल’ व्यापक और स्वाभाविक है, और ‘ने’ के साथ इस्राएल को एक सामूहिक इकाई माना गया है।
- source_word: עָבְרוּ אֶת תּוֹרָתֶךָ
  choice: तेरी व्यवस्था का उल्लंघन किया है
  rationale: व्यवस्था के साथ עבר का अर्थ सीमा लाँघना, अर्थात उल्लंघन करना है। ‘व्यवस्था’ यहाँ वाचा की ठहराई हुई आज्ञाओं के अर्थ को स्पष्ट रखती है।
- source_word: וְסוֹר לְבִלְתִּי שְׁמֹעַ בְּקוֹלֶךָ
  choice: और तेरी आवाज़ न सुनकर उससे भटक गया है
  rationale: סור सही मार्ग से हटने या भटकने का बिंब रखता है; לְבִלְתִּי שְׁמֹעַ न सुनने को उस विचलन से जोड़ता है। ‘तेरी आवाज़’ मूल इब्रानी मुहावरे को बनाए रखता है, जबकि ‘उससे’ का संदर्भ व्यवस्था से है।
- source_word: וַתִּתַּךְ עָלֵינוּ
  choice: हम पर उंडेल दिए गए हैं
  rationale: נתך का मूल बिंब किसी वस्तु को उंडेलने का है और यहाँ न्याय के लागू होने को व्यक्त करता है। हिंदी निष्क्रिय प्रयोग आगामी कर्ताओं—शाप और शपथ—के अनुरूप है।
- source_word: הָאָלָה וְהַשְּׁבֻעָה
  choice: वह शाप और वह शपथ
  rationale: दोनों अलग इब्रानी संज्ञाओं को बनाए रखा गया है। ‘शपथ’ को व्याख्यात्मक रूप से ‘शपथपूर्वक दिया गया शाप’ नहीं बनाया गया, ताकि मूल पाठ का संबंध खुला रहे।
- source_word: אֲשֶׁר כְּתוּבָה בְּתוֹרַת מֹשֶׁה
  choice: जो ... मूसा की व्यवस्था में लिखे हैं
  rationale: ‘मूसा की व्यवस्था’ वाचा-संबंधी दस्तावेज़ का परिचित और सटीक रूप है। हिंदी में संयुक्त पूर्वपद ‘शाप और शपथ’ के कारण बहुवचन ‘लिखे हैं’ स्वाभाविक है, यद्यपि इब्रानी कृदंत स्त्रीलिंग एकवचन है।
- source_word: עֶבֶד הָאֱלֹהִים
  choice: परमेश्वर के सेवक
  rationale: यह मूसा की सम्मानसूचक उपाधि है; ‘परमेश्वर का सेवक’ संबंध को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है। वाक्य में संबंध-चिह्न के कारण ‘के सेवक’ हुआ है।
- source_word: כִּי חָטָאנוּ לוֹ
  choice: क्योंकि हमने उसके विरुद्ध पाप किया है
  rationale: חטא के साथ ל किसी के विरुद्ध पाप करने को दर्शा सकता है। इब्रानी में प्रार्थना के प्रत्यक्ष संबोधन के बीच तृतीय पुरुष לוֹ आता है; ‘उसके विरुद्ध’ उस वास्तविक बदलाव को सुरक्षित रखता है।
theological_decisions:
- issue: सामूहिक अपराध और वचन-सामंजस्य
  choice: इस्राएल को सामूहिक इकाई मानते हुए एकवचन ‘भटक गया है’ रखा गया, फिर दानिय्येल को समुदाय में सम्मिलित करने वाला ‘हम पर ... हमने’ सुरक्षित रखा गया।
  alternative: 'पूरे वाक्य में बहुवचन प्रयोग करना: ‘सारे इस्राएली ... भटक गए हैं।’'
  rationale: मूल पाठ पूरे इस्राएल को एक उत्तरदायी समुदाय के रूप में प्रस्तुत करता है और बाद में वक्ता स्वयं को उसी दोषी समुदाय में सम्मिलित करता है।
- issue: वाचा के संदर्भ में ‘शपथ’ का अर्थ
  choice: मुख्य पाठ में ‘शाप और शपथ’ दोनों को अलग-अलग बनाए रखा गया।
  alternative: दोनों को मिलाकर ‘शपथपूर्वक दिया गया शाप’ करना।
  rationale: संदर्भ संभवतः मूसा की व्यवस्था में शपथ से दृढ़ किए गए वाचा-दंडों का है, पर मूल पाठ दो संज्ञाएँ देता है। उन्हें अलग रखना वास्तविक अर्थगत तनाव को अनावश्यक रूप से हल नहीं करता।
- issue: परमेश्वर के लिए द्वितीय से तृतीय पुरुष का बदलाव
  choice: अंत में ‘उसके विरुद्ध’ रखा गया।
  alternative: प्रार्थना के संबोधन से सामंजस्य बैठाकर ‘तेरे विरुद्ध’ करना।
  rationale: इब्रानी כִּי חָטָאנוּ לוֹ में स्पष्टतः तृतीय पुरुष है। हिंदी में यह बदलाव असामान्य होने पर भी बोधगम्य है और स्रोत की शैली को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के प्रत्यक्ष संबोधन में ‘तेरी’ मूल पाठ की निकटता और सहज हिंदी बाइबलीय शैली के लिए चुना गया। ‘उंडेल दिए गए’ न्याय के लिए प्रयुक्त इब्रानी रूपक को बनाए रखता है।
