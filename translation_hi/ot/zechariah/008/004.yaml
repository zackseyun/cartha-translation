  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֹ֤ד יֵֽשְׁבוּ֙ זְקֵנִ֣ים וּ/זְקֵנ֔וֹת בִּ/רְחֹב֖וֹת יְרוּשָׁלִָ֑ם וְ/אִ֧ישׁ מִשְׁעַנְתּ֛/וֹ בְּ/יָד֖/וֹ מֵ/רֹ֥ב יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/004.yaml
  text: 'Thus says Yahweh of hosts: Old men and old women will yet sit in the streets of Jerusalem[a], each with his staff in his hand because of great age.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: यरूशलेम के चौकों[a] में फिर वृद्ध पुरुष और वृद्ध स्त्रियाँ बैठेंगे, और उनमें से हर एक के हाथ में बड़ी आयु के कारण अपनी लाठी होगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सड़कों”।
    reason: רְחֹבוֹת चौकों, चौड़े खुले स्थानों अथवा सड़कों का अर्थ दे सकता है।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह मानक भविष्यद्वक्तीय संदेश-सूत्र को गरिमापूर्ण और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन संज्ञा के सैन्य और व्यापक स्वर्गीय समूहों के अर्थ को बनाए रखती है; पूरे पदनाम में स्वाभाविक हिन्दी क्रम अपनाया गया है।
- source_word: עֹד
  choice: फिर
  rationale: यहाँ शब्द पुनर्स्थापना के बाद उस दशा के दोबारा दिखाई देने का संकेत देता है; 'फिर' आधुनिक हिन्दी में इस भाव को सहजता से व्यक्त करता है।
- source_word: יֵשְׁבוּ
  choice: बैठेंगे
  rationale: सार्वजनिक स्थानों में वृद्ध लोगों के दृश्य के संदर्भ में क्रिया का ठोस अर्थ 'बैठना' उपयुक्त है।
- source_word: זְקֵנִים וּזְקֵנוֹת
  choice: वृद्ध पुरुष और वृद्ध स्त्रियाँ
  rationale: जोड़ी स्पष्ट रूप से अधिक आयु के पुरुषों और स्त्रियों को बताती है, किसी पदधारी प्राचीनों को नहीं।
- source_word: בִּרְחֹבוֹת
  choice: चौकों में
  rationale: רְחֹבוֹת नगर के खुले, चौड़े सार्वजनिक स्थानों को सूचित कर सकता है; प्राचीन यरूशलेम के इस दृश्य में 'चौकों' सटीक और स्वाभाविक है, जबकि 'सड़कों' को पादटिप्पणी में रखा गया है।
- source_word: וְאִישׁ
  choice: हर पुरुष
  rationale: אִישׁ यहाँ वितरणार्थक है, पर उसका पुल्लिंग रूप आगे के दोनों 3ms प्रत्ययों से जुड़ा है; इसलिए इसे स्पष्ट रखा गया है।
- source_word: מִשְׁעַנְתּוֹ
  choice: उसकी लाठी
  rationale: संज्ञा सहारे के लिए प्रयुक्त लाठी को दर्शाती है और 3ms स्वत्ववाचक प्रत्यय को 'उसकी' से सुरक्षित रखा गया है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: मूल के स्पष्ट 3ms प्रत्यय और सजीव शारीरिक चित्र को यथावत रखा गया है।
- source_word: מֵרֹב יָמִים
  choice: बड़ी आयु के कारण
  rationale: शाब्दिक अर्थ 'बहुत दिनों के कारण/से' उन्नत आयु का मुहावरा है; चुना हुआ रूप कारणात्मक संबंध और आशय दोनों स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को 'प्रभु' जैसी उपाधि से प्रतिस्थापित नहीं किया गया। 'यहोवा' आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; 'याहवे' अधिक पुनर्निर्मित उच्चारण को दर्शाता है, पर मूल उच्चारण पूर्णतः निश्चित नहीं है।
- issue: וְאִישׁ और 3ms प्रत्ययों का सामंजस्य
  choice: हर पुरुष के हाथ में उसकी लाठी
  alternative: हर एक के हाथ में लाठी
  rationale: वचन वृद्ध पुरुषों और स्त्रियों दोनों का उल्लेख करता है, फिर भी इब्रानी वितरणार्थक אִישׁ और दो पुल्लिंग एकवचन प्रत्ययों का प्रयोग करता है। मुख्य पाठ इस व्याकरणिक रूप को मिटाए बिना रखता है और उसे केवल पुरुषों तक सीमित करने वाला अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यद्वक्तीय सूत्र के लिए 'यों कहता है' औपचारिकता बनाए रखता है। 'वृद्ध' सम्मानपूर्ण सामान्य हिन्दी है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित शब्द के तुरंत बाद दिया गया है।
