base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/009.yaml
  text: 'Thus says Yahweh of Armies: Let your hands be strong[c][b][a], you who in these days are hearing these words from the mouth of the prophets who were present on the day the house of Yahweh of Armies was founded for the temple to be built.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा[a] यों कहता है: “तुम्हारे हाथ दृढ़ हों, तुम जो इन दिनों ये वचन उन भविष्यद्वक्ताओं के मुँह से[b] सुन रहे हो, जो उस दिन उपस्थित थे जब सेनाओं के यहोवा के भवन, अर्थात् मन्दिर, को बनाने के लिए उसकी नींव डाली गई थी।[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेनाओं का प्रभु।’
    reason: lexical_alternative
  - marker: b
    text: ‘भविष्यद्वक्ताओं के मुँह से’ इब्रानी मुहावरा है, जिसका अर्थ है उनके द्वारा बोला गया सन्देश सुनना।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी सम्बन्धवाचक उपवाक्य बहुत संक्षिप्त है। इसका अनुवाद यह भी हो सकता है: ‘उन भविष्यद्वक्ताओं के मुँह से, जिन्होंने उस दिन ये वचन कहे थे जब सेनाओं के यहोवा के भवन, अर्थात् मन्दिर, को बनाने के लिए उसकी नींव डाली गई थी।’'
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी का मानक संदेशवाहक-सूत्र है; ‘यों कहता है’ मूल की औपचारिक लय को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת को आधुनिक पाठक के लिए पारदर्शी ‘सेनाओं’ से अनूदित किया गया है।
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: तुम्हारे हाथ दृढ़ हों
  rationale: मूल इब्रानी मुहावरे को सुरक्षित रखते हुए यह साहस, संकल्प और काम में लगे रहने का आह्वान व्यक्त करता है।
- source_word: הַשֹּׁמְעִים בַּיָּמִים הָאֵלֶּה
  choice: तुम जो इन दिनों ... सुन रहे हो
  rationale: कृदन्त का वर्तमान और निरन्तर भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: ये वचन
  rationale: सन्दर्भ भविष्यद्वक्ताओं के बोले हुए सन्देश का है; ‘वचन’ अर्थ और गरिमापूर्ण बाइबिलीय शैली दोनों को व्यक्त करता है।
- source_word: מִפִּי הַנְּבִיאִים
  choice: भविष्यद्वक्ताओं के मुँह से
  rationale: मूल की सजीव अभिव्यक्ति को बनाए रखा गया है; हिन्दी में भी इसका अर्थ उनके मुख से निकला सन्देश समझा जा सकता है।
- source_word: יֻסַּד
  choice: नींव डाली गई
  rationale: יסד के निष्क्रिय रूप का भवन-निर्माण के इस सन्दर्भ में ठोस और स्वाभाविक अर्थ है।
- source_word: בֵּית יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा का भवन
  rationale: ‘भवन’ בית को व्यक्त करता है, जबकि अगले पद ‘मन्दिर’ से उसका धार्मिक सन्दर्भ स्पष्ट होता है।
- source_word: הַהֵיכָל לְהִבָּנוֹת
  choice: ताकि मन्दिर बनाया जाए
  rationale: हिब्रानी infinitive के प्रयोजन/परिणाम सम्बन्ध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ रखा गया है।
- issue: צְבָאוֹת की उपाधि
  choice: सेनाओं
  alternative: स्वर्गीय सेनाओं / मेज़बानों
  rationale: ‘सेनाओं’ इस उपाधि के सामरिक और स्वर्गीय समुदाय—दोनों संकेतों को अनावश्यक व्याख्या जोड़े बिना आधुनिक पाठक तक पहुँचाता है।
- issue: אֲשֶׁר से आरम्भ होने वाले संक्षिप्त सम्बन्धवाचक उपवाक्य का सम्बन्ध
  choice: भविष्यद्वक्ताओं को उस दिन उपस्थित मानकर अनुवाद
  alternative: उस दिन बोले गए वचनों के रूप में समझना
  rationale: इब्रानी वाक्य संक्षिप्त है और उसमें स्पष्ट क्रिया नहीं है। मुख्य पाठ एक व्याकरणतः सम्भव अर्थ देता है, जबकि पादटिप्पणी दूसरे सम्भव सम्बन्ध को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। ‘तुम्हारे हाथ दृढ़ हों’ जैसे मूल मुहावरे को अर्थपूर्ण रहते हुए सुरक्षित रखा गया है। वाक्य की वास्तविक इब्रानी अस्पष्टता को मुख्य पाठ में मनमाने ढंग से समाप्त करने के बजाय पादटिप्पणी में वैकल्पिक विन्यास दिया गया है।
