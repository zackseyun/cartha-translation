  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वाणी के संदेश का प्रचलित सूत्र है; इब्रानी पूर्णकाल यहाँ वर्तमान घोषणा का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह पदवी स्वर्गीय और पार्थिव दोनों प्रकार की सेनाओं के व्यापक भाव को बिना अनावश्यक रूप से सीमित किए व्यक्त करती है।
- source_word: עֹד אֲשֶׁר יָבֹאוּ
  choice: फिर भी ... आएँगे
  rationale: यह आगे होने वाली एक अतिरिक्त बात की भविष्यसूचक घोषणा करता है; हिन्दी भविष्यकाल कथन को स्वाभाविक बनाता है।
- source_word: עַמִּים
  choice: लोग
  rationale: बहुवचन शब्द अनेक जनसमुदायों को सूचित करता है और आधुनिक हिन्दी में स्वाभाविक है; ‘जातियाँ’ भी संभव है।
- source_word: וְיֹשְׁבֵי עָרִים רַבּוֹת
  choice: और बहुत-से नगरों के निवासी
  rationale: समुच्चय और संबंध को स्पष्ट रखते हुए רַבּוֹת को संख्या के अर्थ में अनूदित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम को ‘प्रभु’ जैसे शीर्षक से प्रतिस्थापित नहीं किया गया; ‘यहोवा’ उसका हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है।
- issue: עַמִּים का दायरा
  choice: लोग
  alternative: जातियाँ
  rationale: शब्द विभिन्न जनसमुदायों अथवा जातियों को सूचित कर सकता है; मुख्य पाठ में सहज ‘लोग’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित किया गया है।
