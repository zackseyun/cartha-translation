source:
  edition: WLC
  text: וְ/עַתָּ֗ה לֹ֣א כַ/יָּמִ֤ים הָ/רִֽאשֹׁנִים֙ אֲנִ֔י לִ/שְׁאֵרִ֖ית הָ/עָ֣ם הַ/זֶּ֑ה נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/011.yaml
  text: But now I will not be to the remnant of this people as in the former days[b][a], declares Yahweh of Armies.
translation:
  language: hi
  text: पर अब मैं इस प्रजा के शेष लोगों के प्रति पहले के दिनों के समान नहीं हूँ—सेनाओं के यहोवा[b] की यह घोषणा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं इस प्रजा के शेष लोगों के साथ पहले के दिनों के समान व्यवहार नहीं करूँगा।” इब्रानी वाक्य में स्पष्ट विधेय नहीं है; सटीक भाव प्रसंग से समझा जाता है।
    reason: alternative_reading
  - marker: b
    text: 'परंपरागत अनुवाद: “सेनाओं के प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह पद पहले के संकटपूर्ण दिनों के विपरीत अब बदली हुई स्थिति बताता है; इसलिए ‘पर अब’ प्रसंग का विरोधसूचक भाव स्पष्ट करता है।
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: पहले दिनों जैसा
  rationale: כ तुलना प्रकट करता है और הָרִאשֹׁנִים यहाँ बीते हुए दिनों की ओर संकेत करता है। यह अभिव्यक्ति हिन्दी में सहज रहते हुए तुलना बनाए रखती है।
- source_word: לִשְׁאֵרִית הָעָם הַזֶּה
  choice: इस प्रजा के बचे हुए लोगों के प्रति
  rationale: שְׁאֵרִית उस शेष समुदाय को सूचित करता है जो बचा रहा है। ‘बचे हुए लोग’ सामान्य पाठक के लिए स्पष्ट है, और ‘के प्रति’ ל के संबंधसूचक भाव को बनाए रखता है।
- source_word: נְאֻם
  choice: यह घोषणा है
  rationale: यह नबूवत में प्रयुक्त अधिकारपूर्ण दिव्य कथन का सूत्र है; ‘घोषणा’ उसके औपचारिक और दृढ़ स्वर को व्यक्त करती है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: ईश्वरीय नाम को ‘यहोवा’ के रूप में रखा गया है और צְבָאוֹת का अर्थ ‘सेनाएँ’ दिया गया है, जिससे उसकी सैन्य और स्वर्गीय व्यापकता पारंपरिक ‘गणों’ की अपेक्षा अधिक पारदर्शी रहती है।
theological_decisions:
- issue: אֲנִי के बाद स्पष्ट विधेय का लोप
  choice: ‘मैं पहले दिनों जैसा नहीं रहूँगा’ कहकर कथन को अपेक्षाकृत खुला रखा गया है।
  alternative: ‘मैं इस प्रजा के बचे हुए लोगों के साथ पहले दिनों जैसा व्यवहार नहीं करूँगा।’
  rationale: इब्रानी में ‘मैं’ के बाद कोई स्पष्ट क्रिया या विधेय नहीं है। हिन्दी व्याकरण के लिए ‘रहूँगा’ आवश्यक सहारा देता है, पर ‘व्यवहार करूँगा’ जैसे अधिक निश्चित अर्थ को मूल पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रजा’ सामूहिक עָם का भाव देती है, जबकि ‘बचे हुए लोग’ שְׁאֵרִית को अनावश्यक तकनीकी शब्दावली के बिना व्यक्त करता है। मूल इब्रानी की वाक्यगत अपूर्णता को हिन्दी की सीमा के भीतर यथासंभव सुरक्षित रखा गया है।
