  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁ֚בְתִּי אֶל צִיּ֔וֹן וְ/שָׁכַנְתִּ֖י בְּ/ת֣וֹךְ יְרֽוּשָׁלִָ֑ם וְ/נִקְרְאָ֤ה יְרוּשָׁלִַ֨ם֙ עִ֣יר הָֽ/אֱמֶ֔ת וְ/הַר יְהוָ֥ה צְבָא֖וֹת הַ֥ר הַ/קֹּֽדֶשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/003.yaml
  text: 'Thus says Yahweh: I have returned to Zion and will dwell in the midst of Jerusalem[a], and Jerusalem will be called the City of Truth, and the mountain of Yahweh of Armies[b], the Holy Mountain.'
translation:
  language: hi
  text: 'याहवे यों कहता है: “मैं सिय्योन लौट आया हूँ और यरूशलेम के बीच में निवास करूँगा। यरूशलेम सत्य का नगर[a] कहलाएगा, और सेनाओं के याहवे का पर्वत[b] पवित्र पर्वत कहलाएगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता का नगर” अथवा “निष्ठावान नगर”; इब्रानी शब्द אֱמֶת सत्य, विश्वसनीयता या निष्ठा का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सेनाओं का याहवे”; पारंपरिक रूप “सेनाओं के प्रभु” है। इब्रानी צְבָאוֹת का अर्थ सेनाएँ या दल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वाणी का मानक संदेशवाहक-सूत्र है। יְהוָה को उसके वाचा-संबंधी नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: שַׁבְתִּי אֶל צִיּוֹן
  choice: मैं सिय्योन लौट आया हूँ
  rationale: प्रथम पुरुष पूर्ण क्रिया पूरी हुई वापसी और उसकी वर्तमान प्रासंगिकता को व्यक्त करती है; אֶל की दिशात्मकता ‘लौट आया’ में स्वाभाविक रूप से समाहित है।
- source_word: וְשָׁכַנְתִּי בְּתוֹךְ יְרוּשָׁלִָם
  choice: और यरूशलेम के बीच में निवास करूँगा
  rationale: संदर्भ में क्रिया भावी निवास को बताती है। ‘निवास करना’ שכן की स्थायी और वाचा-संबंधी प्रतिध्वनि बनाए रखता है, जबकि ‘के बीच में’ בְּתוֹךְ की विशिष्टता को सुरक्षित रखता है।
- source_word: עִיר הָאֱמֶת
  choice: सत्य का नगर
  rationale: אֱמֶת का सीधा अर्थ ‘सत्य’ है, यद्यपि संदर्भ में ‘विश्वासयोग्यता’ या ‘निष्ठा’ भी संभव है; इस अर्थ-व्याप्ति को पाद-टिप्पणी में रखा गया है।
- source_word: הַר יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे का पर्वत
  rationale: צְבָאוֹת का अर्थ पाठक के लिए स्पष्ट करते हुए ‘सेनाओं’ किया गया है और दिव्य नाम को नाम के रूप में बनाए रखा गया है।
- source_word: הַר הַקֹּדֶשׁ
  choice: पवित्र पर्वत
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है, जो पर्वत की परमेश्वर के लिए अलग ठहराई हुई पवित्रता व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय दिव्य नाम सीधे उपस्थित है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: שַׁבְתִּי ... וְשָׁכַנְתִּי का काल-संबंध
  choice: लौट आया हूँ ... निवास करूँगा
  alternative: लौटता हूँ ... निवास करता हूँ; लौट आया हूँ ... निवास किया है
  rationale: पहली क्रिया पूरी हुई वापसी को और दूसरी उसके परिणामस्वरूप प्रतिज्ञात भावी निवास को व्यक्त करती है। इससे भविष्यद्वाणी में उपस्थित पूर्णता और अपेक्षा का तनाव बना रहता है।
- issue: אֱמֶת की अर्थ-व्याप्ति
  choice: सत्य
  alternative: विश्वासयोग्यता; निष्ठा
  rationale: ‘सत्य’ सबसे सीधा शब्दार्थ है, पर इब्रानी शब्द नैतिक विश्वसनीयता और निष्ठा भी सूचित कर सकता है; इसलिए विकल्प को पाद-टिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी की गरिमा बनाए रखने के लिए ‘यों कहता है’, ‘निवास’ और ‘पवित्र पर्वत’ जैसे परिचित बाइबलीय पद चुने गए हैं। संयुक्त इब्रानी निष्क्रिय क्रिया को सहज हिन्दी के लिए दोनों समन्वित कर्ताओं के साथ ‘कहलाएगा’ दोहराकर व्यक्त किया गया है। पाद-टिप्पणी चिह्नों को उनके वास्तविक शब्दगत विषयों—‘सत्य’ और ‘सेनाओं’—के पास रखा गया है।
