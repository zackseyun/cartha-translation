source:
  edition: WLC
  text: אֵ֥לֶּה הַ/דְּבָרִ֖ים אֲשֶׁ֣ר תַּֽעֲשׂ֑וּ דַּבְּר֤וּ אֱמֶת֙ אִ֣ישׁ אֶת רֵעֵ֔/הוּ אֱמֶת֙ וּ/מִשְׁפַּ֣ט שָׁל֔וֹם שִׁפְט֖וּ בְּ/שַׁעֲרֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/016.yaml
  text: 'These are the things that you must do: speak truth to one another[c][b][a]; judge with truth and a judgment of peace in your gates.'
translation:
  language: hi
  text: 'तुम्हें ये काम करने हैं: हर व्यक्ति अपने पड़ोसी से सच बोले; और अपने नगर-द्वारों पर सच्चाई और शान्ति का न्याय करो।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नगर-द्वार” प्राचीन नगरों में वह सार्वजनिक स्थान था जहाँ मुकदमे सुने जाते और न्यायिक निर्णय दिए जाते थे। “सच्चाई और शान्ति का न्याय” का अनुवाद “सच्चा और शान्ति लानेवाला न्याय” भी हो सकता है।
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים אֲשֶׁר תַּעֲשׂוּ
  choice: तुम्हें ये काम करने हैं
  rationale: यह वाक्य आगे आने वाली व्यावहारिक आज्ञाओं का परिचय देता है। आधुनिक हिन्दी में यह रूप दायित्व को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: דַּבְּרוּ אֱמֶת
  choice: सच बोले
  rationale: आज्ञार्थक भाव और नैतिक बल को संक्षिप्त, सहज हिन्दी में बनाए रखता है।
- source_word: אִישׁ אֶת־רֵעֵהוּ
  choice: हर व्यक्ति अपने पड़ोसी से
  rationale: इब्रानी का प्रतिनिधिक एकवचन समुदाय के प्रत्येक सदस्य पर लागू होता है; 'पड़ोसी' רֵעַ के सामुदायिक सम्बन्ध को सुरक्षित रखता है।
- source_word: אֱמֶת וּמִשְׁפַּט שָׁלוֹם שִׁפְטוּ
  choice: सच्चाई और शान्ति का न्याय करो
  rationale: 'सघन इब्रानी संज्ञा-समूह की वास्तविक अस्पष्टता को अधिक व्याख्यायित किए बिना रखता है: न्याय सच्चाई पर आधारित और शान्ति से सम्बद्ध होना चाहिए।'
- source_word: בְּשַׁעֲרֵיכֶם
  choice: अपने नगर-द्वारों पर
  rationale: शाब्दिक द्वार-चित्र को रखते हुए हिन्दी पाठक के लिए नगर का आशय स्पष्ट करता है; सांस्कृतिक न्यायिक भूमिका पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: אִישׁ का प्रतिनिधिक पुल्लिंग एकवचन
  choice: हर व्यक्ति अपने पड़ोसी से
  alternative: हर पुरुष अपने पड़ोसी से
  rationale: यह नैतिक आदेश केवल पुरुषों तक सीमित नहीं है। 'हर व्यक्ति' प्रतिनिधिक अर्थ को आधुनिक हिन्दी में स्पष्ट करता है, जबकि एकवचन और पड़ोसी-संबंध सुरक्षित रहते हैं।
- issue: न्यायिक वाक्यांश में שָׁלוֹם का अर्थ
  choice: शान्ति का न्याय
  alternative: शान्ति लानेवाला न्याय
  rationale: मुख्य पाठ मूल की संक्षिप्तता और सम्भावित सम्बन्ध को सुरक्षित रखता है; परिणामसूचक अर्थ को अनिवार्य बनाकर तनाव का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और आज्ञात्मक है। 'शान्ति' की वर्तनी औपचारिक बाइबलीय पंजी के अनुरूप रखी गई है।
