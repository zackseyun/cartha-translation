id: ZEC.8.6
reference: Zechariah 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת כִּ֣י יִפָּלֵ֗א בְּ/עֵינֵי֙ שְׁאֵרִית֙ הָ/עָ֣ם הַ/זֶּ֔ה בַּ/יָּמִ֖ים הָ/הֵ֑ם גַּם בְּ/עֵינַ/י֙ יִפָּלֵ֔א נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/006.yaml
  text: 'Thus says Yahweh of hosts: If it is marvelous in the eyes of the remnant of this people in those days[a], should it also be marvelous in my eyes? declares Yahweh of hosts.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: यदि उन दिनों यह बात इस प्रजा के बचे हुओं की दृष्टि में अद्भुत[a] हो, तो क्या यह मेरी दृष्टि में भी अद्भुत होगी? सेनाओं के यहोवा की यही वाणी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत कठिन” अथवा “असंभव।” इब्रानी क्रिया किसी असाधारण बात या मनुष्य की सामर्थ्य से परे बात का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: भविष्यद्वाणी के मानक संदेशवाहक सूत्र को गरिमापूर्ण और स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: दिव्य नाम को लिप्यंतरित करता है और צְבָאוֹת के व्यापक सैन्य/स्वर्गीय भाव को सुरक्षित रखता है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ अगले समानांतर खंड से जुड़ी शर्त अथवा मान्यता प्रस्तुत करता है; प्रश्न का अपेक्षित उत्तर नकारात्मक है।
- source_word: יִפָּלֵא
  choice: अद्भुत हो / अद्भुत होगी
  rationale: פלא के ‘असाधारण, आश्चर्यजनक’ तथा ‘मानवीय सामर्थ्य से परे’ अर्थों की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: इब्रानी दृष्टिकोण-सूचक मुहावरे और दोनों खंडों के समानांतरपन को सहज हिन्दी में बनाए रखता है।
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: इस प्रजा के बचे हुओं
  rationale: שְׁאֵרִית का निर्वासन और न्याय के बाद बचे समुदाय वाला अर्थ व्यक्त करता है, बिना अनावश्यक पारिभाषिक बोझ के।
- source_word: בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: भविष्यद्वाणी की कालसूचक अभिव्यक्ति और बहुवचन को सुरक्षित रखता है।
- source_word: גַּם בְּעֵינַי
  choice: मेरी दृष्टि में भी
  rationale: लोगों की धारणा और यहोवा की दृष्टि के बीच तुलना तथा मूल समानांतरता बनाए रखता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की यही वाणी है
  rationale: गंभीर भविष्यद्वाणी-समापन सूत्र को आधुनिक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अलंकारिक प्रश्न और परमेश्वर की सामर्थ्य
  choice: “तो क्या यह मेरी दृष्टि में भी अद्भुत होगी?” के रूप में अलंकारिक प्रश्न
  alternative: “यह मेरी दृष्टि में भी अद्भुत होगी” के रूप में कथन
  rationale: समान क्रिया और גַּם मानव दृष्टि तथा यहोवा की दृष्टि का विरोध स्थापित करते हैं। प्रश्न का निहित उत्तर ‘नहीं’ है, पर उसे पाठ में जोड़कर स्पष्ट नहीं किया गया, जिससे मूल का तनाव बना रहता है।
- issue: יִפָּלֵא का अर्थ
  choice: मुख्य पाठ में “अद्भुत,” पादटिप्पणी में कठिनता/असंभवता का वैकल्पिक अर्थ
  alternative: मुख्य पाठ में केवल “बहुत कठिन” या “असंभव”
  rationale: इब्रानी क्रिया आश्चर्यजनक होने और सामर्थ्य से परे होने—दोनों भाव दे सकती है; किसी एक अर्थ को चुपचाप निर्णायक बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण भविष्यद्वाणी-शैली के साथ सामान्य पाठक के लिए बोधगम्य शब्दावली। “प्रजा” सामूहिक הָעָם के लिए और “बचे हुए” שְׁאֵרִית के ऐतिहासिक-भविष्यद्वाणी संदर्भ के लिए चुना गया है।
