  text: כֵּ֣ן שַׁ֤בְתִּי זָמַ֨מְתִּי֙ בַּ/יָּמִ֣ים הָ/אֵ֔לֶּה לְ/הֵיטִ֥יב אֶת יְרוּשָׁלִַ֖ם וְ/אֶת בֵּ֣ית יְהוּדָ֑ה אַל תִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/015.yaml
  text: So now I have returned and purposed in these days to do good to Jerusalem and to the house of Judah. Do not fear.
translation:
  language: hi
  text: उसी प्रकार, इन दिनों मैंने फिर यरूशलेम और यहूदा के घराने का भला करने का निश्चय किया है। मत डरो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֵּן
  choice: उसी प्रकार
  rationale: पिछले पद में बताए गए दण्ड के निश्चय और अब भलाई के निश्चय के बीच समानांतरता को व्यक्त करता है।
- source_word: שַׁבְתִּי זָמַמְתִּי
  choice: मैंने फिर ... निश्चय किया है
  rationale: שַׁבְתִּי को यहाँ सहायक भाव में 'फिर' और זָמַמְתִּי को दृढ़ संकल्प के रूप में प्रस्तुत किया गया है; 'लौट आया हूँ' कहना हिन्दी में भौतिक वापसी का अनचाहा अर्थ दे सकता है।
- source_word: לְהֵיטִיב
  choice: भला करने
  rationale: हिफ़ील रूप के सक्रिय, हितकारी अर्थ को सरल और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा के घराने
  rationale: यहाँ 'घर' से आशय वंश/समुदाय है; 'घराना' आधुनिक पाठक के लिए वही सामूहिक अर्थ स्पष्ट करता है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: बहुवचन निषेधात्मक आज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वर के 'फिर' निश्चय करने का अर्थ
  choice: मैंने फिर ... निश्चय किया है
  alternative: मैं लौट आया हूँ और मैंने निश्चय किया है
  rationale: मूल के שַׁבְתִּי को सुरक्षित रखते हुए उसे पूर्ववर्ती दण्ड-संकल्प के विपरीत अब भलाई के संकल्प की ओर पुनः मुड़ने के रूप में व्यक्त किया गया है; इससे ईश्वर की भौतिक वापसी या किसी विशिष्ट व्यवस्थित धर्मवैज्ञानिक व्याख्या को आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामुदायिक संबोधन में बहुवचन भाव। मूल पद में प्रत्यक्ष वक्ता परमेश्वर है, पर इस पद में दिव्य नाम नहीं आता।
