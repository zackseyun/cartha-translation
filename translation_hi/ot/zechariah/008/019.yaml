source:
  edition: WLC
  text: כֹּֽה אָמַ֞ר יְהוָ֣ה צְבָא֗וֹת צ֣וֹם הָ/רְבִיעִ֡י וְ/צ֣וֹם הַ/חֲמִישִׁי֩ וְ/צ֨וֹם הַ/שְּׁבִיעִ֜י וְ/צ֣וֹם הָ/עֲשִׂירִ֗י יִהְיֶ֤ה לְ/בֵית יְהוּדָה֙ לְ/שָׂשׂ֣וֹן וּ/לְ/שִׂמְחָ֔ה וּֽ/לְ/מֹעֲדִ֖ים טוֹבִ֑ים וְ/הָ/אֱמֶ֥ת וְ/הַ/שָּׁל֖וֹם אֱהָֽבוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/019.yaml
  text: 'Thus says Yahweh of hosts: The fast of the fourth month[a], and the fast of the fifth, and the fast of the seventh, and the fast of the tenth, shall become for the house of Judah joy and gladness and good appointed feasts[c][b]. Therefore love truth and peace.'
translation:
  language: hi
  text: सेनाओं का याहवे यों कहता है, “चौथे महीने का उपवास[a], पाँचवें महीने का उपवास, सातवें महीने का उपवास और दसवें महीने का उपवास यहूदा के घराने के लिए हर्ष, आनन्द और नियत किए हुए शुभ पर्व बन जाएँगे[b][c]। इसलिए सत्य और शान्ति से प्रेम करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चौथा उपवास, पाँचवाँ उपवास, सातवाँ उपवास और दसवाँ उपवास।” इब्रानी में उपवास क्रमवाचक संख्याओं से बताए गए हैं; सम्भवतः ये महीनों का उल्लेख करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “होंगे।” इब्रानी क्रिया का सीधा अर्थ “होंगे” है; “बन जाएँगे” सन्दर्भ में उपवास से उत्सव की ओर होने वाले परिवर्तन को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: c
    text: “नियत किए हुए शुभ पर्व” उस इब्रानी शब्द का अनुवाद है जो निर्धारित समय या पर्व, विशेषकर पवित्र उत्सव, के लिए प्रयुक्त होता है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह पदवी स्वर्गीय और पार्थिव सेनाओं की व्यापकता बनाए रखती है और आधुनिक हिन्दी में बोधगम्य है।
- source_word: צ֣וֹם ... הָרְבִיעִי / הַחֲמִישִׁי / הַשְּׁבִיעִי / הָעֲשִׂירִי
  choice: चौथे महीने का उपवास, पाँचवें महीने का उपवास, सातवें महीने का उपवास और दसवें महीने का उपवास
  rationale: इब्रानी में प्रत्येक क्रमवाचक संख्या के साथ ‘उपवास’ दोहराया गया है। सन्दर्भतः निहित ‘महीने’ को जोड़ने से आधुनिक पाठक के लिए आशय स्पष्ट होता है और पुनरुक्त संरचना भी बनी रहती है।
- source_word: יִהְיֶה
  choice: बन जाएँगे
  rationale: मूल क्रिया सामान्यतः ‘होंगे’ है, पर सन्दर्भ में शोकमय उपवासों के आनन्दमय अवसरों में रूपान्तरित होने का भाव है। विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: לְבֵית יְהוּדָה
  choice: यहूदा के घराने के लिए
  rationale: ‘घराना’ इब्रानी पद की सामूहिक और वाचागत पहचान को केवल ‘यहूदा’ कहने की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
- source_word: לְשָׂשׂוֹן וּלְשִׂמְחָה
  choice: हर्ष, आनन्द
  rationale: दो समीपार्थी संज्ञाओं को अलग हिन्दी शब्द देकर मूल की आलंकारिक जोड़ी को बनाए रखा गया है।
- source_word: וּלְמֹעֲדִים טוֹבִים
  choice: और अच्छे नियत पर्व
  rationale: מוֹעֵד नियत समय अथवा विशेषतः धार्मिक पर्व का संकेत देता है; ‘नियत पर्व’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: וְהָאֱמֶת וְהַשָּׁלוֹם אֱהָבוּ
  choice: इसलिए सत्य और शान्ति से प्रेम करो
  rationale: आज्ञार्थक बल स्पष्ट रखा गया है। ‘इसलिए’ प्रतिज्ञा से नैतिक प्रत्युत्तर की ओर प्रवचनात्मक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱמֶת
  choice: सत्य
  rationale: नैतिक उपदेश में यह सीधा और सन्दर्भानुकूल अर्थ है; ‘विश्वासयोग्यता’ सम्भव अर्थ होते हुए भी यहाँ कम स्वाभाविक है।
- source_word: שָׁלוֹם
  choice: शान्ति
  rationale: यह मानक और सन्दर्भानुकूल अनुवाद है, जो सामाजिक मेल और कुशलता के व्यापक संकेत को भी ग्रहण कर सकता है।
theological_decisions:
- issue: स्मारक उपवासों का रूपान्तरण
  choice: उपवास यहूदा के घराने के लिए हर्ष, आनन्द और नियत पर्व बन जाएँगे।
  alternative: उपवास यहूदा के घराने के लिए हर्ष, आनन्द और नियत पर्व होंगे।
  rationale: अनुवाद उनके कार्य और स्वरूप में परिवर्तन को दर्शाता है, पर यह अतिरिक्त दावा नहीं करता कि उपवास विधिवत समाप्त अथवा दूसरे पर्वों से प्रतिस्थापित कर दिए गए।
- issue: अन्तिम आज्ञा का सम्बन्धसूचक बल
  choice: इसलिए सत्य और शान्ति से प्रेम करो।
  alternative: और सत्य और शान्ति से प्रेम करो।
  rationale: मूल में आज्ञा स्पष्ट है; ‘इसलिए’ प्रतिज्ञा के प्रत्युत्तर के रूप में उपदेश को सुबोध बनाता है, बिना किसी विशिष्ट साम्प्रदायिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘यों कहता है’ भविष्यद्वाणी की पारम्परिक गम्भीरता बनाए रखता है; वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ होने से बचाया गया है।
