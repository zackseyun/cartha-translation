  register: आधुनिक मानक हिन्दी की गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘दाखलता’, ‘उपज’, ‘ओस’ और ‘उत्तराधिकारी’ जैसे शब्द मूल कृषि-चित्र तथा विरासत की भाषा को स्पष्ट रखते हैं।
