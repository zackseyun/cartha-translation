base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/012.yaml
  text: 'For there will be the seed of peace: the vine will give its fruit[a], the land will give its produce, and the heavens will give their dew; and I will cause the remnant of this people to inherit all these things.'
translation:
  language: hi
  text: 'क्योंकि शांति का बीज होगा[a]: दाखलता अपना फल देगी, भूमि अपनी उपज देगी, और आकाश अपनी ओस देगा; और मैं इस प्रजा के बचे हुए लोगों को इन सबका उत्तराधिकारी बनाऊँगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समृद्धि का बीज होगा,” “बोआई शांतिपूर्ण होगी,” अथवा “कुशलता का बीज होगा।” इब्रानी पद संक्षिप्त है और संभवतः यहाँ बहाल की गई कृषि-समृद्धि के पूरे दृश्य का सार प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע הַשָּׁלוֹם
  choice: शान्ति का बीज
  rationale: यह संक्षिप्त इब्रानी पद कृषि-सन्दर्भ में बीज, बोआई या उपज का भाव दे सकता है, जबकि שָׁלוֹם में शान्ति, कुशलता, समृद्धि और पूर्णता का व्यापक अर्थ है। ‘शान्ति का बीज’ मूल रूपक और उसकी अर्थ-समृद्धि को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले वचन की प्रतिज्ञा का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: הַגֶּפֶן תִּתֵּן פִּרְיָהּ
  choice: दाखलता अपना फल देगी
  rationale: यह मूल के कृषि-चित्र और נתן (‘देना’) की सीधी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: יְבוּל
  choice: उपज
  rationale: यह भूमि से उत्पन्न होने वाली कृषि-उपज का व्यापक और सहज हिन्दी शब्द है।
- source_word: הַשָּׁמַיִם יִתְּנוּ טַלָּם
  choice: आकाश अपनी ओस देगा
  rationale: हिन्दी में ‘आकाश’ स्वाभाविक रूप से एकवचन है; ‘अपनी ओस देगा’ मूल के ठोस चित्र और बार-बार आए נתן को सुरक्षित रखता है।
- source_word: וְהִנְחַלְתִּי
  choice: उत्तराधिकारी बनाऊँगा
  rationale: हिफ़इल रूप के कारणवाचक अर्थ—किसी को विरासत का अधिकारी बनाना—और वाचा-संबंधी उत्तराधिकार की ध्वनि, दोनों को सुरक्षित रखता है।
- source_word: שְׁאֵרִית הָעָם הַזֶּה
  choice: इस प्रजा के बचे हुए लोग
  rationale: यह ‘शेष’ की भविष्यद्वाणी-संबंधी धारणा को सामान्य आधुनिक हिन्दी में स्पष्ट करता है, बिना केवल जीवित बचे लोगों तक अर्थ को अनावश्यक रूप से सीमित किए।
- source_word: אֶת כָּל אֵלֶּה
  choice: इन सबका
  rationale: यह पहले गिनाई गई कृषि-संबंधी आशीषों की ओर संक्षिप्त और स्वाभाविक ढंग से संकेत करता है।
theological_decisions:
- issue: कृषि-आशीष के सन्दर्भ में שָׁלוֹם का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘शान्ति’ रखकर ‘शान्ति का बीज’ अनुवाद किया गया।
  alternative: ‘समृद्धि का बीज’, ‘कुशलता की उपज’, या ‘बोआई निर्विघ्न होगी’।
  rationale: שָׁלוֹם में समृद्धि और कुशलता सम्मिलित हैं, पर उसे केवल आर्थिक समृद्धि बनाना मूल की व्यापक धार्मिक और सामाजिक अर्थवत्ता को संकुचित कर देगा।
- issue: וְהִנְחַלְתִּי में उत्तराधिकार की भाषा
  choice: ‘इन सबका उत्तराधिकारी बनाऊँगा’ द्वारा कारणवाचक उत्तराधिकार स्पष्ट रखा गया।
  alternative: ‘ये सब वस्तुएँ दे दूँगा’ या ‘इन सब पर अधिकार दूँगा’।
  rationale: सिर्फ देने या अधिकार करने की भाषा मूल क्रिया में निहित विरासत और वाचा-संबंधी उपहार की ध्वनि को कम कर देती है।
