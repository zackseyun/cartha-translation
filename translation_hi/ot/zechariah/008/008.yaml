base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/008.yaml
  text: I will bring them[a], and they will dwell in the midst of Jerusalem; and they will be my people, and I will be their God[c][b], in truth and in righteousness.
translation:
  language: hi
  text: मैं उन्हें ले आऊँगा, और वे यरूशलेम के बीच में[a] निवास करेंगे। वे मेरी प्रजा होंगे, और मैं उनका परमेश्वर होऊँगा—सत्य[b] और धार्मिकता[c] में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के भीतर।” इब्रानी का अधिक शाब्दिक अर्थ “यरूशलेम के बीच में” है।
    reason: lexical_alternative
  - marker: b
    text: “सत्य” का अर्थ यहाँ “विश्वासयोग्यता” या “सच्चाई से” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “धार्मिकता” का अनुवाद इस संदर्भ में “न्याय” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: मैं उन्हें ले आऊँगा
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘ले आना’ है। संदर्भ में लौटाकर लाने का भाव निहित है, पर मूल पद में ‘वापस’ स्पष्ट रूप से नहीं है।
- source_word: וְשָׁכְנוּ
  choice: वे ... निवास करेंगे
  rationale: שׁכן स्थायी रूप से रहने या बसने का अर्थ देता है। ‘निवास करेंगे’ गरिमापूर्ण और स्वाभाविक है तथा बसाहट के भाव को बनाए रखता है।
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: यरूशलेम के बीच में
  rationale: यह साधारण ‘यरूशलेम में’ से अधिक विशिष्ट है और בְּתוֹךְ के स्थानवाचक बल को सुरक्षित रखता है।
- source_word: וְהָיוּ לִי לְעָם
  choice: वे मेरी प्रजा होंगे
  rationale: यह स्थापित वाचा-सूत्र का स्वाभाविक हिन्दी रूप है और अन्य बाइबलीय संदर्भों से उसका संबंध बनाए रखता है।
- source_word: וַאֲנִי אֶהְיֶה לָהֶם לֵאלֹהִים
  choice: मैं उनका परमेश्वर होऊँगा
  rationale: वाचा-सूत्र का सीधा और स्वाभाविक हिन्दी रूप, जो संबंध को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: בֶּאֱמֶת
  choice: सच्चाई ... के साथ
  rationale: אֱמֶת में सत्य, सच्चाई और विश्वासयोग्यता के अर्थ संभव हैं। ‘सच्चाई’ संज्ञात्मक रूप और अर्थगत खुलापन बनाए रखती है।
- source_word: וּבִצְדָקָה
  choice: धार्मिकता के साथ
  rationale: צְדָקָה धार्मिकता अथवा न्याय का अर्थ दे सकता है। ‘धार्मिकता’ वाचा-सूत्र और समानांतर संज्ञात्मक रचना के अनुकूल है; ‘न्याय’ को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: वाचा-सूत्र की भाषा
  choice: ‘वे मेरी प्रजा होंगे, और मैं उनका परमेश्वर होऊँगा’ को बनाए रखा गया।
  alternative: ‘वे मेरे होंगे और मैं उनके परमेश्वर के रूप में उनकी देखभाल करूँगा’ जैसी व्याख्यात्मक भाषा।
  rationale: इब्रानी में सुविख्यात वाचा-सूत्र है। उसका सीधा रूप अंतर्पाठीय संबंधों को बनाए रखता और अतिरिक्त धर्मवैचारिक व्याख्या से बचता है।
- issue: בֶּאֱמֶת וּבִצְדָקָה का संबंध और अर्थ
  choice: ‘सच्चाई और धार्मिकता के साथ’ के रूप में रखा गया, ताकि इसका संबंध समूचे वाचा-वाक्य से खुला रहे।
  alternative: इसे केवल परमेश्वर के कार्य की रीति मानकर ‘मैं सच्चाई और धार्मिकता से उनका परमेश्वर होऊँगा’ कहना।
  rationale: इब्रानी में इस पदबंध का सटीक व्याकरणिक दायरा कुछ हद तक खुला है। विराम-चिह्न और शब्द-क्रम को ऐसा रखा गया है कि इसे अनावश्यक रूप से केवल एक उपवाक्य तक सीमित न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली। ‘प्रजा’, ‘निवास’ और ‘परमेश्वर’ वाचा-संदर्भ की गंभीरता बनाए रखते हैं। अंतिम पदबंध से पहले दीर्घ विराम उसके खुले व्याकरणिक दायरे को सुरक्षित रखने में सहायता करता है।
