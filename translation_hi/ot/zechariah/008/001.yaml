base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/001.yaml
  text: And the word of Yahweh of hosts came[a], saying[b],
translation:
  language: hi
  text: 'और सेनाओं[b] के याहवे का वचन आया[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और ऐसा हुआ: सेनाओं के याहवे का वचन आया, कहते हुए।”'
