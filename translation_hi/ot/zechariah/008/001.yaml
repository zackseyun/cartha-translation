    text: “सेनाओं” का अर्थ “फौजों” भी हो सकता है; यह उपाधि स्वर्गीय और पृथ्वी की शक्तियों पर याहवे के शासन पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और … आया
  rationale: यहाँ वाव-क्रमागत के साथ היה अगले कथन का क्रमिक परिचय देता है। हिन्दी में ‘और … आया’ स्वाभाविक रूप से घटना और कथानक-संबंध दोनों व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यवाणी के सूत्र में यह परमेश्वर से प्राप्त वचन या संदेश को दर्शाता है। ‘वचन’ इस स्थापित धार्मिक-साहित्यिक प्रयोग को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम है, इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं
  rationale: यह बहुवचन संज्ञा सेनाओं या संगठित दलों को दर्शाती है। ‘सेनाओं’ मूल सैन्य और विश्वव्यापी बिंब को ‘सर्वशक्तिमान’ जैसे व्याख्यात्मक अनुवाद से अधिक सीधे सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह क्रियारूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। आधुनिक हिन्दी में उद्धरण से पहले का विसर्ग ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से यही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और प्रचलित विद्वत्तापूर्ण उच्चारण के निकट है।
- issue: יְהוָה צְבָאוֹת उपाधि का अनुवाद
  choice: सेनाओं के याहवे
  alternative: सेनाओं का यहोवा; सर्वशक्तिमान प्रभु
  rationale: अपेक्षाकृत औपचारिक अनुवाद उपाधि के सैन्य/ब्रह्मांडीय बिंब और साहित्यिक भार को बनाए रखता है। ‘सर्वशक्तिमान’ अर्थ की व्याख्या करता है, पर צְבָאוֹת को सीधे नहीं दर्शाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और संक्षिप्त रखी गई है। भविष्यवाणी-सूत्र के लिए ‘वचन आया’ अपनाया गया है, और לֵאמֹר को अगले पद की प्रत्यक्ष वाणी से जोड़ने हेतु विसर्ग से व्यक्त किया गया है।
