  yaml_path: translation/ot/zechariah/008/022.yaml
  text: And many peoples and mighty nations will come to seek Yahweh of hosts in Jerusalem and to entreat the favor of Yahweh[a].
translation:
  language: hi
  text: अनेक जनसमुदाय और शक्तिशाली राष्ट्र यरूशलेम में सेनाओं के याहवे को खोजने और याहवे से अनुग्रह की विनती करने आएँगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे की कृपा खोजने।’ इब्रानी मुहावरे में शाब्दिक रूप से ‘याहवे के मुख’ का उल्लेख है; इसका अर्थ उसकी कृपा पाने या उसकी अनुकूल उपस्थिति के लिए विनती करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: आएँगे
  rationale: भविष्यसूचक संदर्भ में संयोजक के साथ आया पूर्ण क्रियारूप भावी घटना बताता है; ‘आएँगे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַמִּים רַבִּים
  choice: बहुत-से जनसमुदाय
  rationale: ‘जनसमुदाय’ विभिन्न लोगों के समूहों को व्यक्त करता है और अगले शब्द גּוֹיִם (‘राष्ट्र’) से भेद बनाए रखता है।
- source_word: וְגוֹיִם עֲצוּמִים
  choice: और शक्तिशाली राष्ट्र
  rationale: גּוֹיִם का सामूहिक-राजनीतिक अर्थ ‘राष्ट्र’ और עֲצוּמִים का बल-सूचक अर्थ ‘शक्तिशाली’ से स्पष्ट होता है।
- source_word: לְבַקֵּשׁ אֶת יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे को खोजें
  rationale: בקשׁ का सीधा अर्थ ‘खोजना’ है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में और צְבָאוֹת को उसकी सेना-संबंधी छवि बचाते हुए ‘सेनाओं के’ कहा गया है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: यह सरल स्थानवाचक प्रयोग है और तीर्थयात्रा के संदर्भ में ‘यरूशलेम में’ स्वाभाविक हिन्दी है।
- source_word: וּלְחַלּוֹת אֶת פְּנֵי יְהוָה
  choice: और याहवे से अनुग्रह की विनती करें
  rationale: इस इब्रानी मुहावरे का आशय किसी के सम्मुख कृपा या अनुकूलता के लिए गिड़गिड़ाना है। यह अनुवाद उसके विनयपूर्ण और संबंधपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे पदवी में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: צְבָאוֹת का अनुवाद
  choice: सेनाओं के
  alternative: सर्वशक्तिमान
  rationale: यह शब्द स्पष्ट रूप से सेनाओं या दलों की छवि रखता है। ‘सर्वशक्तिमान’ व्यापक धर्मवैचारिक गुण तो बताता है, पर मूल की यह विशिष्ट छवि मिटा देता है।
- issue: חלה את־פני יהוה मुहावरे का अर्थ
  choice: याहवे से अनुग्रह की विनती करें
  alternative: याहवे के मुख के सामने विनती करें; याहवे की उपस्थिति पाने की विनती करें
  rationale: शाब्दिक ‘मुख’ यहाँ अनुकूल उपस्थिति या कृपा का मुहावरा है। मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी मूल रूपक तथा संभावित अर्थ-विस्तार सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘जनसमुदाय’ और ‘राष्ट्र’ का भेद मूल के עַמִּים और גּוֹיִם के भेद को सुरक्षित रखता है; ईश्वरीय नाम ‘याहवे’ के रूप में दिया गया है।
