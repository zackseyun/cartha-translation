source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת קִנֵּ֥אתִי לְ/צִיּ֖וֹן קִנְאָ֣ה גְדוֹלָ֑ה וְ/חֵמָ֥ה גְדוֹלָ֖ה קִנֵּ֥אתִי לָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/002.yaml
  text: 'Thus says Yahweh of hosts: I am jealous for Zion with great jealousy[b][a], and with great wrath I am jealous for her.'
translation:
  language: hi
  text: 'सेनाओं का याहवे[a] यह कहता है: “मैं सिय्योन के लिए बड़ी जलन से उद्दीप्त हूँ[b], और उसके लिए बड़े क्रोध से उद्दीप्त हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ इब्रानी में परमेश्वर के नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: alternative_reading
  - marker: b
    text: या, ‘मैं सिय्योन के लिए बड़े उत्साह से उद्दीप्त हूँ।’ इब्रानी में क्रिया और संज्ञा एक ही मूल से हैं, जो तीव्र वाचा-संबंधी जलन या लगन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन शब्द स्वर्गीय और पार्थिव दोनों प्रकार की सेनाओं के व्यापक भाव को बनाए रखता है।
- source_word: קִנֵּאתִי ... קִנְאָה גְדוֹלָה
  choice: मैं ... बड़ी जलन से जलता हूँ
  rationale: क्रिया और उसी मूल से बने संज्ञा-रूप की तीव्र पुनरुक्ति को स्वाभाविक हिन्दी में यथासंभव सुरक्षित रखा गया है। 'जलन' वाचा से जुड़ी प्रबल और अनन्य लगन का तनाव बनाए रखती है; इसे केवल सामान्य 'चिन्ता' बनाकर हल्का नहीं किया गया।
- source_word: לְצִיּוֹן
  choice: सिय्योन के लिए
  rationale: सम्बन्धसूचक उपसर्ग यहाँ सिय्योन की ओर निर्देशित अनुराग और अधिकारपूर्ण लगन व्यक्त करता है।
- source_word: וְחֵמָה גְדוֹלָה
  choice: और ... बड़े क्रोध से
  rationale: חֵמָה की उग्र, दहकते हुए क्रोध की तीव्रता को 'बड़े क्रोध' से व्यक्त किया गया है।
- source_word: לָהּ
  choice: उसके लिए
  rationale: स्त्रीलिंग सर्वनाम सिय्योन को नगर-स्त्री के रूप में व्यक्त करता है; हिन्दी में 'उसके' इस सन्दर्भ को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: याहवे की जलन का वर्णन
  choice: '''जलन'' की भाषा को बनाए रखा गया है।'
  alternative: '''मैं सिय्योन के लिए बड़े उत्साह से भरा हूँ'' या ''मुझे सिय्योन की बहुत चिन्ता है''।'
  rationale: इब्रानी קנא में जलन और प्रबल लगन दोनों का अर्थक्षेत्र है, और सजातीय संज्ञा इसकी तीव्रता बढ़ाती है। 'जलन' परमेश्वर के वाचागत, अनन्य दावे और सिय्योन के प्रति प्रबल अनुराग को सुरक्षित रखती है, बिना इसे मनुष्य की पापपूर्ण ईर्ष्या के समान ठहराए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘बड़ी जलन से जलता हूँ’ जानबूझकर तीव्र और कुछ असहज रखा गया है, क्योंकि मूल इब्रानी की सजातीय पुनरुक्ति और धर्मवैज्ञानिक तनाव को केवल ‘चिन्ता’ या ‘उत्साह’ में सीमित करना उचित नहीं होगा।
