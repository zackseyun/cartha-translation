reference: Zechariah 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֗י לִ/פְנֵי֙ הַ/יָּמִ֣ים הָ/הֵ֔ם שְׂכַ֤ר הָֽ/אָדָם֙ לֹ֣א נִֽהְיָ֔ה וּ/שְׂכַ֥ר הַ/בְּהֵמָ֖ה אֵינֶ֑/נָּה וְ/לַ/יּוֹצֵ֨א וְ/לַ/בָּ֤א אֵין שָׁלוֹם֙ מִן הַ/צָּ֔ר וַ/אֲשַׁלַּ֥ח אֶת כָּל הָ/אָדָ֖ם אִ֥ישׁ בְּ/רֵעֵֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/010.yaml
  text: For before those days there was no wage for man[a], and no wage for beast; and for the one going out and the one coming in there was no peace because of the adversary[c][b], and I set every man against his neighbor.
translation:
  language: hi
  text: क्योंकि उन दिनों से पहले न तो मनुष्य के लिए कोई मजदूरी थी, न पशु के लिए कोई मजदूरी थी; और आने-जानेवाले को शत्रु[b] के कारण कोई शान्ति[a] नहीं थी। मैंने हर मनुष्य को उसके पड़ोसी के विरुद्ध कर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शान्ति’ का अर्थ यहाँ ‘सुरक्षा’ या ‘कुशलता’ भी हो सकता है; इब्रानी शालोम में ये सभी भाव समाए हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘विरोधी’; इब्रानी शब्द किसी वैरी अथवा शत्रुतापूर्ण विरोधी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘मैंने हर मनुष्य को, प्रत्येक को उसके पड़ोसी के विरुद्ध भेज दिया।’ भाव यह है कि परमेश्वर ने उन्हें परस्पर विरोध में डाल दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण और आगे आनेवाले विरोधाभास की पृष्ठभूमि बताता है; इसलिए हिन्दी में कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: לִפְנֵי הַיָּמִים הָהֵם
  choice: उन दिनों से पहले
  rationale: इब्रानी कालवाचक अभिव्यक्ति को निकटता से और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: שְׂכַר הָאָדָם
  choice: मनुष्य के लिए कोई मजदूरी
  rationale: שׂכר का मूल अर्थ मजदूरी या मेहनताना है। הָאָדָם यहाँ पशु के साथ तुलना में सामान्य रूप से मनुष्य को दर्शाता है।
- source_word: וּשְׂכַר הַבְּהֵמָה אֵינֶנָּה
  choice: न पशु के लिए कोई मजदूरी थी
  rationale: मानवीय और पशु-श्रम के समानान्तर ढाँचे को बनाए रखता है; בְּהֵמָה को किसी खास पशु-प्रजाति तक सीमित नहीं करता।
- source_word: וְלַיּוֹצֵא וְלַבָּא
  choice: आने-जानेवाले को
  rationale: इब्रानी के बाहर जाने और भीतर आने के मुहावरे का संक्षिप्त, सहज हिन्दी समतुल्य है, जो सामान्य आवागमन को व्यक्त करता है।
- source_word: אֵין שָׁלוֹם
  choice: कोई शान्ति नहीं थी
  rationale: שָׁלוֹם का प्रमुख अर्थ शान्ति है, जबकि प्रसंग में सुरक्षा और कुशलता की छाया भी है; वह विस्तार पाद-टिप्पणी में रखा गया है।
- source_word: מִן הַצָּר
  choice: शत्रु के कारण
  rationale: צַר यहाँ विरोधी या शत्रु को सूचित कर सकता है और מִן अभाव के कारण अथवा स्रोत को दर्शाता है।
- source_word: וַאֲשַׁלַּח
  choice: मैंने ... विरुद्ध कर दिया
  rationale: क्रिया का शाब्दिक अर्थ ‘मैंने भेज दिया’ है, पर अगले संबंधवाचक वाक्यांश के साथ इसका भाव लोगों को परस्पर विरोध में छोड़ने या लगा देने का है।
- source_word: אֶת כָּל הָאָדָם אִישׁ בְּרֵעֵהוּ
  choice: हर मनुष्य को उसके पड़ोसी के विरुद्ध
  rationale: כָּל और אִישׁ की वितरणात्मक शक्ति तथा רֵעַ के निकट सामाजिक संबंध, दोनों को बनाए रखता है।
theological_decisions:
- issue: सामाजिक संघर्ष में परमेश्वर की सक्रिय भूमिका
  choice: मैंने हर मनुष्य को उसके पड़ोसी के विरुद्ध कर दिया
  alternative: मैंने लोगों को एक-दूसरे से लड़ने दिया
  rationale: इब्रानी पाठ प्रथम पुरुष में परमेश्वर की क्रिया को स्पष्ट रूप से व्यक्त करता है। अनुवाद इस कठिन धर्मवैज्ञानिक तनाव को अनुमति मात्र बताकर नरम नहीं करता।
- issue: הָאָדָם का सामान्य मानवीय आशय
  choice: मनुष्य
  alternative: लोग
  rationale: यहाँ शब्द मानव-श्रम को पशु-श्रम के सामने रखता है और समस्त मानव वर्ग का प्रतिनिधि है; ‘मनुष्य’ इस तुलना को स्पष्ट रखता है, बिना आशय को केवल पुरुषों तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यद्वाणी के लिए गरिमामय रखी गई है। ‘मजदूरी’, ‘शान्ति’, ‘शत्रु’ और ‘पड़ोसी’ जैसे सामान्य शब्द व्यापक पाठक-वर्ग के लिए सहज हैं। अर्धविराम समानान्तर अभावों को जोड़ता है और अंतिम वाक्य में परमेश्वर की क्रिया को स्पष्ट बल देता है।
