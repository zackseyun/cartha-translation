source:
  edition: WLC
  text: כֹּ֥ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֲשֶׁ֤ר יַחֲזִ֨יקוּ֙ עֲשָׂרָ֣ה אֲנָשִׁ֔ים מִ/כֹּ֖ל לְשֹׁנ֣וֹת הַ/גּוֹיִ֑ם וְֽ/הֶחֱזִ֡יקוּ בִּ/כְנַף֩ אִ֨ישׁ יְהוּדִ֜י לֵ/אמֹ֗ר נֵֽלְכָה֙ עִמָּ/כֶ֔ם כִּ֥י שָׁמַ֖עְנוּ אֱלֹהִ֥ים עִמָּ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/023.yaml
  text: 'Thus says Yahweh of Armies: In those days ten men from every language of the nations will take hold—yes[a], they will take hold of the garment edge of a Jewish man, saying, ‘Let us go with you[c][b], for we have heard that God is with you.’'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: उन दिनों राष्ट्रों की हर भाषा में से दस पुरुष एक यहूदी पुरुष के वस्त्र का छोर पकड़ेंगे—हाँ, वे उसके वस्त्र का छोर पकड़कर कहेंगे, ‘हम तुम्हारे[a] साथ चलें, क्योंकि हमने सुना है कि परमेश्वर तुम्हारे साथ है।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे” दोनों स्थानों पर मूल भाषा में बहुवचन है।
    reason: मूल में एक यहूदी पुरुष का वस्त्र पकड़ा जाता है, पर उससे कही गई बात में बहुवचन संबोधन आता है; यह अर्थपूर्ण व्याकरणिक तनाव हिन्दी पाठक के लिए स्पष्ट किया गया है।
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: दिव्य नाम को लिप्यंतरित रूप ‘यहोवा’ से और צְבָאוֹת को उसके ठोस अर्थ ‘सेनाओं’ से व्यक्त किया गया है; पूरा पदबंध हिन्दी में स्वाभाविक संबंध-रचना रखता है।
- source_word: בַּיָּמִים הָהֵמָּה
  choice: उन दिनों
  rationale: यह इब्रानी कालवाचक मुहावरे का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יַחֲזִיקוּ ... וְהֶחֱזִיקוּ
  choice: पकड़ेंगे—हाँ, वे उसे पकड़कर
  rationale: חזק के हिफ़ील रूप की पुनरावृत्ति और बल को हिन्दी में दोहराव तथा ‘हाँ’ के द्वारा सुरक्षित रखा गया है।
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: दस पुरुष
  rationale: पुल्लिंग बहुवचन और प्रतिनिधि पुरुषों के ठोस उल्लेख को सुरक्षित रखता है।
- source_word: מִכֹּל לְשֹׁנוֹת הַגּוֹיִם
  choice: राष्ट्रों की हर भाषा में से
  rationale: לְשֹׁנוֹת के ‘भाषाएँ’ अर्थ और מִכֹּל के वितरणात्मक विस्तार को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּכְנַף
  choice: वस्त्र का छोर
  rationale: כָּנָף यहाँ वस्त्र के छोर, किनारे या कोने को सूचित करता है; ‘छोर’ ठोस चित्र को बिना वस्त्र का प्रकार निर्धारित किए बनाए रखता है।
- source_word: אִישׁ יְהוּדִי
  choice: एक यहूदी पुरुष
  rationale: אִישׁ और יְהוּדִי दोनों को स्पष्ट रूप से व्यक्त करता है और जातीय-सामुदायिक अर्थ को बनाए रखता है।
- source_word: נֵלְכָה עִמָּכֶם
  choice: हम तुम्हारे साथ चलें
  rationale: कोहोर्टेटिव की इच्छात्मकता को ‘चलें’ स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन ‘तुम्हारे’ मूल के बहुवचन संबोधन को सुरक्षित रखता है।
- source_word: אֱלֹהִים עִמָּכֶם
  choice: परमेश्वर तुम्हारे साथ है
  rationale: עִם का सीधा अर्थ ‘साथ’ और संबोधित समुदाय के लिए बहुवचन ‘तुम्हारे’ रखा गया है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु; स्वर्गीय सेनाओं का यहोवा
  rationale: मूल में आए व्यक्तिगत दिव्य नाम को सामान्य उपाधि से नहीं बदला गया और צְבָאוֹת के ठोस सैन्य अर्थ को सुरक्षित रखा गया है।
- issue: יְהוּדִי का संदर्भ
  choice: यहूदी पुरुष
  alternative: यहूदिया का पुरुष; यहूदी
  rationale: भविष्यसूचक संदर्भ में यह पद केवल भौगोलिक निवास से अधिक यहूदा से पहचाने जाने वाले समुदाय को दर्शा सकता है; ‘पुरुष’ जोड़ने से אִישׁ भी अनूदित रहता है।
- issue: עִמָּכֶם में बहुवचन संबोधन
  choice: तुम्हारे साथ
  alternative: आपके साथ
  rationale: इब्रानी प्रत्यय बहुवचन है और सम्भवतः उस यहूदी पुरुष द्वारा प्रतिनिधित्व किए गए समुदाय की ओर संकेत करता है; हिन्दी बहुवचन रूप इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वाचनयोग्य रखी गई है। ‘यों कहता है’ भविष्यसूचक सूत्र के लिए परिचित हिन्दी है। पुनरुक्त क्रिया को मिटाने के बजाय स्वाभाविक ढंग से बनाए रखा गया है, और एक पुरुष तथा बहुवचन संबोधन के बीच मूल का तनाव सुरक्षित है।
