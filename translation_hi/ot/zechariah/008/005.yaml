lexical_decisions:
- source_word: וּ/רְחֹבוֹת
  choice: और नगर की चौड़ी गलियाँ
  rationale: רְחֹבוֹת नगर के चौड़े सार्वजनिक मार्गों या खुले चौकों को दर्शा सकता है। ‘चौड़ी गलियाँ’ मूल शब्द के विस्तार और आधुनिक हिन्दी की स्वाभाविकता, दोनों को बनाए रखता है।
- source_word: הָ/עִיר
  choice: नगर की
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है; यह प्रसंग में सहज और गरिमापूर्ण हिन्दी है।
- source_word: יִמָּלְאוּ
  choice: भर जाएँगी
  rationale: מלא के निफ़अल अपूर्ण रूप का भाव भविष्य में भर जाने का है; यह हिन्दी में स्वाभाविक रूप से उस परिवर्तन को व्यक्त करता है।
- source_word: יְלָדִים וִֽ/ילָדוֹת
  choice: लड़कों और लड़कियों से
  rationale: पुल्लिंग और स्त्रीलिंग संज्ञाओं की जोड़ी को अलग-अलग व्यक्त करके इब्रानी की स्पष्ट लैंगिक समानांतरता सुरक्षित रखी गई है।
- source_word: מְשַׂחֲקִים
  choice: जो ... खेलेंगे
  rationale: שׂחק का कृदंत यहाँ बहाल नगर में बच्चों के आनंदपूर्ण खेल को दर्शाता है। ‘खेलेंगे’ मुख्य भविष्यकालीन कथन के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: בִּ/רְחֹבֹתֶי/הָ
  choice: उसकी गलियों में
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है। ‘उसकी’ हिन्दी में स्वाभाविक है, और ‘गलियों’ की पुनरावृत्ति मूल के बलाघात को बनाए रखती है।
