  edition: WLC
  text: כִּ֣י כֹ֣ה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ כַּ/אֲשֶׁ֨ר זָמַמְ֜תִּי לְ/הָרַ֣ע לָ/כֶ֗ם בְּ/הַקְצִ֤יף אֲבֹֽתֵי/כֶם֙ אֹתִ֔/י אָמַ֖ר יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֖א נִחָֽמְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/014.yaml
  text: 'For thus says Yahweh of Armies: Just as I purposed to do harm to you when your fathers provoked me to wrath[a], says Yahweh of Armies, and I did not relent[c][b],'
translation:
  language: hi
  text: 'क्योंकि सेनाओं का यहोवा यों कहता है: “जैसे मैंने, जब तुम्हारे पुरखों ने मुझे क्रोध दिलाया, तुम्हें हानि पहुँचाने का निश्चय किया था,” सेनाओं का यहोवा कहता है, “और मैंने अपना मन नहीं बदला[a],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने निश्चय से नहीं हटा”; अथवा, “मैं नहीं पछताया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह शब्द सैन्य दलों अथवा विशाल समूहों का बोध कराता है; ‘सेनाओं का यहोवा’ उपाधि के सामरिक और व्यापक भाव को स्पष्ट रखता है।
- source_word: כִּי כֹה אָמַר
  choice: क्योंकि ... यह कहता है
  rationale: כִּי पिछले कथन का आधार प्रस्तुत करता है और כֹה אָמַר भविष्यद्वाणी की संदेश-सूत्र शैली है।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: यह अगले पद में आने वाली तुलना का पहला भाग आरम्भ करता है और पूर्व न्याय तथा भावी भलाई के बीच समानता बनाए रखता है।
- source_word: זָמַמְתִּי
  choice: मैंने ... निश्चय किया था
  rationale: क्रिया सोची-समझी योजना या दृढ़ इरादे को व्यक्त करती है; ‘निश्चय किया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְהָרַע לָכֶם
  choice: तुम्हारी हानि करने
  rationale: यहाँ हिफ़ील रूप का आशय विपत्ति या दंड पहुँचाना है, नैतिक बुराई करना नहीं; यह अनुवाद मूल कथन की कठोरता बनाए रखता है।
- source_word: בְּהַקְצִיף ... אֹתִי
  choice: मुझे क्रोध दिलाने पर
  rationale: कारणवाचक क्रिया का अर्थ क्रोधित करना है और בְּ परिस्थिति अथवा कारण बताता है।
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखों
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिता’ है, पर सामूहिक ऐतिहासिक संदर्भ में ‘पुरखे’ स्वाभाविक हिन्दी है और पूर्वज पुरुषों का भाव भी रखता है।
- source_word: וְלֹא נִחָמְתִּי
  choice: और मैं नहीं पछताया
  rationale: נחם के निफ़अल रूप में पछताने, मन बदलने या ठहराए हुए कार्य से हटने की अर्थ-सीमा है। ‘नहीं पछताया’ स्रोत की मानवीय भावभाषा और उसकी वास्तविक अस्पष्टता को सुरक्षित रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: לְהָרַע में परमेश्वर के न्याय की भाषा
  choice: तुम्हारी हानि करने
  alternative: तुम पर विपत्ति लाने
  rationale: मूल क्रिया हानि या विपत्ति पहुँचाने को व्यक्त करती है। ‘हानि करने’ पाठ की सीधी और असहज शक्ति को बनाए रखता है, जबकि इसे परमेश्वर द्वारा नैतिक बुराई करने के दावे में नहीं बदलता।
- issue: וְלֹא נִחָמְתִּי में परमेश्वर के पछताने अथवा मन बदलने की भाषा
  choice: मैं नहीं पछताया
  alternative: मैं अपने निश्चय से नहीं हटा / मैंने अपना मन नहीं बदला
  rationale: मूल शब्द की अर्थ-सीमा में पछताना और ठहराए हुए कार्य से हटना दोनों आते हैं। मुख्य पाठ में मानवीय भावभाषा को दबाया नहीं गया; पादटिप्पणी न्याय से न हटने का प्रसंगानुकूल अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद 15 के साथ जुड़ी ‘जैसे ... वैसे’ संरचना को खुला रखा गया है। उद्धरण-चिह्न वक्ता की वाणी स्पष्ट करते हैं; पद के अंत की अल्पविराम-सदृश निरंतरता अगले पद से वाक्यगत संबंध दिखाती है।
