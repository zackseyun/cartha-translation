source:
  edition: WLC
  text: וַ/יְהִ֛י דְּבַר יְהוָ֥ה צְבָא֖וֹת אֵלַ֥/י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/018.yaml
  text: 'And the word of Yahweh of hosts came to me[a], saying:'
translation:
  language: hi
  text: 'और सेनाओं के याहवे का वचन मेरे पास आया:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... आया
  rationale: यहाँ वाव-क्रम के साथ היה अगले भविष्यद्वाणी-वचन का क्रमिक परिचय देता है। हिन्दी में ‘और ... आया’ मूल मुहावरे का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी के इस प्रचलित सूत्र में यह किसी विशिष्ट ईश्वरीय कथन को दर्शाता है; ‘वचन’ उसकी औपचारिक और धार्मिक साहित्यिक शैली को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिवाचक नाम है; हिन्दी में ‘याहवे’ उसका लिप्यंतरण है, न कि उसकी जगह प्रयुक्त कोई उपाधि।
- source_word: צְבָאוֹת
  choice: सेनाओं के
  rationale: यह יְהוָה के साथ जुड़ी उपाधि का अंग है। ‘सेनाओं के याहवे’ सैन्य/स्वर्गीय समूहों की मूल छवि को बनाए रखता है और इसे व्याख्यात्मक ‘सर्वशक्तिमान’ में नहीं बदलता।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: भविष्यद्वाणी का वचन वक्ता को प्राप्त होने का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। चूँकि कथन अगले पद में आरम्भ होता है, हिन्दी में कोलन वही कार्य संक्षेप और स्वाभाविक रूप से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक उच्चारण है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं के याहवे
  alternative: सर्वशक्तिमान याहवे
  rationale: ‘सेनाओं’ मूल צְבָאוֹת की ठोस और कुछ हद तक व्यापक छवि को बनाए रखता है; ‘सर्वशक्तिमान’ एक व्याख्यात्मक समानार्थी उपाधि है और मूल रूपक को मिटा देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। भविष्यद्वाणी-सूत्र ‘वचन ... आया’ सुरक्षित है। अगले पद में कथन जारी होने के कारण अन्त में कोलन रखा गया है। अंग्रेज़ी परामर्श-पाठ की फुटनोट सामग्री मूल पाठ में किसी वास्तविक वैकल्पिक पाठ को नहीं दर्शाती और उसका चिह्न भी असंगत है, इसलिए स्रोत-साक्ष्य के आधार पर उसे हिन्दी प्रारूप में शामिल नहीं किया गया।
