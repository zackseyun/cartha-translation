  text: וְֽ/הָלְכ֡וּ יֹשְׁבֵי֩ אַחַ֨ת אֶל אַחַ֜ת לֵ/אמֹ֗ר נֵלְכָ֤ה הָלוֹךְ֙ לְ/חַלּוֹת֙ אֶת פְּנֵ֣י יְהוָ֔ה וּ/לְ/בַקֵּ֖שׁ אֶת יְהוָ֣ה צְבָא֑וֹת אֵלְכָ֖ה גַּם אָֽנִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/021.yaml
  text: And the inhabitants of one city will go to another, saying, ‘Let us surely go to entreat the favor of the LORD and to seek the LORD of hosts.’ ‘I myself am going too.’
translation:
  language: hi
  text: और एक नगर के निवासी दूसरे नगर में जाएंगे और कहेंगे, “चलो, हम निश्चय ही जाएँ और यहोवा की कृपा पाने के लिए विनती करें और सेनाओं के यहोवा को खोजें।” “मैं भी जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹשְׁבֵי אַחַת אֶל אַחַת
  choice: एक नगर के निवासी दूसरे नगर में
  rationale: संदर्भ में स्त्रीलिंग ‘एक’ का आशय नगर से है; हिन्दी में ‘एक नगर...दूसरे नगर’ स्वाभाविक और स्पष्ट है।
- source_word: נֵלְכָה הָלוֹךְ
  choice: आओ, हम अवश्य चलें
  rationale: एक ही धातु की infinitive absolute रचना आग्रह और दृढ़ निश्चय को बल देती है; ‘अवश्य’ उस बल को व्यक्त करता है।
- source_word: לְחַלּוֹת אֶת־פְּנֵי יְהוָה
  choice: यहोवा से कृपा की विनती करें
  rationale: मुहावरे का शाब्दिक अर्थ ‘यहोवा के मुख को कोमल करना’ है, पर यहाँ आशय अनुग्रह पाने के लिए विनती करना है।
- source_word: לְבַקֵּשׁ אֶת־יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा को खोजें
  rationale: ‘खोजना’ मूल क्रिया की प्रत्यक्षता और परमेश्वर की ओर मन लगाकर मुड़ने का व्यापक अर्थ बनाए रखता है।
- source_word: אֵלְכָה גַּם־אָנִי
  choice: मैं भी स्वयं चलूँगा
  rationale: स्वतंत्र सर्वनाम אָנִי कर्ता पर बल देता है; ‘स्वयं’ उस बल को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी बाइबल परंपरा में परिचित रूप ‘यहोवा’ रखा गया है।
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सर्वशक्तिमान यहोवा
  rationale: ‘सेनाओं’ मूल צְבָאוֹת की ठोस छवि को बनाए रखता है और उसे व्याख्यात्मक धर्मवैज्ञानिक उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामूहिक आमंत्रण और दृढ़ संकल्प का बल रखा गया है। उद्धरण-विन्यास से नगरवासियों की पुकार और प्रत्युत्तर अलग दिखाई देते हैं।
