source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֶת רָעַ֣ת רֵעֵ֗/הוּ אַֽל תַּחְשְׁבוּ֙ בִּ/לְבַבְ/כֶ֔ם וּ/שְׁבֻ֥עַת שֶׁ֖קֶר אַֽל תֶּאֱהָ֑בוּ כִּ֧י אֶת כָּל אֵ֛לֶּה אֲשֶׁ֥ר שָׂנֵ֖אתִי נְאֻם יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/017.yaml
  text: And let no man devise evil against his neighbor in his heart[a], and do not love a false oath, for all these are what I hate, declares Yahweh.
translation:
  language: hi
  text: और तुममें से कोई भी अपने पड़ोसी के विरुद्ध अपने मन में बुराई की योजना न बनाए[a], और झूठी शपथ से प्रेम न करो, क्योंकि इन सभी बातों से मैं घृणा करता हूँ—यह याहवे की घोषणा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक, अधिक शाब्दिक क्रम: “और प्रत्येक व्यक्ति, अपने पड़ोसी के विषय में बुराई अपने मनों में न सोचे।” इब्रानी में ‘प्रत्येक व्यक्ति’ एकवचन है, पर निषेध समुदाय को बहुवचन में संबोधित करता है; इसलिए आशय समुदाय के हर व्यक्ति से है।'
    reason: व्याकरणिक संख्या और वितरणात्मक अर्थ की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: וְאִישׁ
  choice: और तुममें से कोई भी
  rationale: אִישׁ एकवचन है, पर निषेध और बहुवचन संबोधन के साथ यहाँ समुदाय के प्रत्येक व्यक्ति पर बात लागू होती है। यह हिंदी अभिव्यक्ति उस वितरणात्मक अर्थ को स्वाभाविक रूप से प्रकट करती है।
- source_word: רָעַת רֵעֵהוּ
  choice: अपने पड़ोसी के विरुद्ध ... बुराई
  rationale: רָעָה यहाँ किसी दूसरे के लिए सोची गई बुराई या हानि को व्यक्त करता है, और רֵעַ पड़ोसी, साथी या सहचर के अर्थ में है। 'पड़ोसी' व्यापक पारस्परिक नैतिक संदर्भ के अनुकूल है।
- source_word: תַּחְשְׁבוּ בִּלְבַבְכֶם
  choice: अपने मन में ... योजना न बनाए
  rationale: חשב का अर्थ सोचना, गढ़ना या योजना बनाना हो सकता है। बुराई के संदर्भ में 'योजना बनाना' जानबूझकर किए जाने वाले भीतरी विचार को स्पष्ट करता है; 'मन में' לֵב के विचार और संकल्प के केंद्र वाले अर्थ को व्यक्त करता है।
- source_word: שְׁבֻעַת שֶׁקֶר
  choice: झूठी शपथ
  rationale: यह पदबंध शाब्दिक रूप से 'झूठ की शपथ' है। 'झूठी शपथ' स्वाभाविक हिंदी है और इसे केवल न्यायालयीन झूठी गवाही तक सीमित नहीं करता।
- source_word: תֶּאֱהָבוּ
  choice: प्रेम न करो
  rationale: אהב का सीधा अर्थ 'प्रेम करना' है। इसे बनाए रखने से यह नैतिक बल सुरक्षित रहता है कि निषेध केवल झूठी शपथ बोलने का नहीं, बल्कि उसे चाहने या स्वीकार करने का भी है।
- source_word: כִּי אֶת כָּל אֵלֶּה אֲשֶׁר שָׂנֵאתִי
  choice: क्योंकि इन सभी बातों से मैं घृणा करता हूँ
  rationale: अनुवाद सूचीबद्ध सभी आचरणों की समग्रता तथा उनके प्रति परमेश्वर की घृणा, दोनों को स्पष्ट और स्वाभाविक हिंदी में रखता है।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם मानक भविष्यवाणीय घोषणा-सूत्र है। याहवे वाचा के व्यक्तिगत नाम יהוה का लिप्यंतरण है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। 'याहवे' उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: झूठी शपथ के प्रति निषेध का बल
  choice: प्रेम न करो
  alternative: मत खाओ; पसंद न करो
  rationale: मूल क्रिया אהב वास्तव में प्रेम करने की भाषा इस्तेमाल करती है। इसे केवल झूठी शपथ खाने के निषेध में बदलना पाठ के उस गहरे नैतिक बल को घटा देता, जो मनुष्य की अभिरुचि और लगाव को संबोधित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामुदायिक संबोधन वाला रूप अपनाया गया है। मुख्य पाठ में वितरणात्मक आशय को स्वाभाविक बनाने के लिए 'तुममें से कोई भी ... अपने मन में' रखा गया है; इब्रानी के एकवचन संज्ञा और बहुवचन संबोधन का मेल पादटिप्पणी में सुरक्षित है।
