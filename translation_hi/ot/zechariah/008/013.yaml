  text: וְ/הָיָ֡ה כַּ/אֲשֶׁר֩ הֱיִיתֶ֨ם קְלָלָ֜ה בַּ/גּוֹיִ֗ם בֵּ֤ית יְהוּדָה֙ וּ/בֵ֣ית יִשְׂרָאֵ֔ל כֵּ֚ן אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וִ/הְיִיתֶ֖ם בְּרָכָ֑ה אַל תִּירָ֖אוּ תֶּחֱזַ֥קְנָה יְדֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/013.yaml
  text: And it shall happen that just as you were a curse among the nations[a], O house of Judah and house of Israel, so I will save you, and you shall be a blessing. Do not fear[c][b]; let your hands be strong.
translation:
  language: hi
  text: और ऐसा होगा कि जैसे तुम, हे यहूदा के घराने और इस्राएल के घराने, जातियों के बीच अभिशाप[a] थे, वैसे ही मैं तुम्हें बचाऊँगा[b], और तुम आशीष बनोगे। मत डरो; तुम्हारे हाथ मजबूत हों[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाप देने की उक्ति में लिया जाने वाला नाम”—अर्थात ऐसा समुदाय जिसका नाम जातियों के बीच शाप देने की उक्तियों में प्रयोग किया जाता था।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें छुड़ाऊँगा।” इब्रानी क्रिया व्यापक अर्थ में बचाने या छुड़ाने को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “तुम्हारे हाथ मजबूत हों।” यह साहस रखने और दृढ़ता से काम करने की इब्रानी अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: भविष्य में होने वाली स्थिति और परिणाम का परिचय देता है; यह आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यसूचक भाव बनाए रखता है।
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसे ... वैसे ही
  rationale: बीती दशा और आने वाले उलटाव के बीच स्पष्ट समानांतर संबंध व्यक्त करता है।
- source_word: קְלָלָה
  choice: अभिशाप
  rationale: मूल संज्ञा का सीधा अर्थ बनाए रखता है; इसमें स्वयं शापित होना और शाप देने की उक्तियों में उदाहरण बनना, दोनों की सम्भावना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: בַּגּוֹיִם
  choice: जातियों के बीच
  rationale: आसपास के अन्य जनसमूहों या राष्ट्रों को दर्शाता है और बाद के यहूदी–गैर-यहूदी वर्गीकरण को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: בֵּית יְהוּדָה וּבֵית יִשְׂרָאֵל
  choice: हे यहूदा के घराने और इस्राएल के घराने
  rationale: प्रत्यक्ष सम्बोधन तथा सामूहिक वाचा-संबंधी पहचान, दोनों को सुरक्षित रखता है।
- source_word: אוֹשִׁיעַ
  choice: मैं तुम्हें बचाऊँगा
  rationale: क्रिया के व्यापक बचाव या उद्धार के अर्थ को रखता है, बिना इसे केवल राजनीतिक अथवा किसी बाद की विशिष्ट धर्मवैज्ञानिक धारणा तक सीमित किए।
- source_word: וִהְיִיתֶם בְּרָכָה
  choice: तुम आशीष ठहरोगे
  rationale: ऐसे लोगों का भाव व्यक्त करता है जो आशीष का रूप या स्रोत बनेंगे; 'ठहरोगे' भविष्य की बदली हुई दशा को गरिमापूर्ण हिन्दी में प्रकट करता है।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का संक्षिप्त, स्वाभाविक और स्पष्ट अनुवाद है।
- source_word: תֶּחֱזַקְנָה יְדֵיכֶם
  choice: तुम्हारे हाथ दृढ़ हों
  rationale: साहस और दृढ़तापूर्वक कार्य करने के इब्रानी रूपक को मुख्य पाठ में बनाए रखता है।
theological_decisions:
- issue: אוֹשִׁיעַ में ईश्वरीय बचाव का दायरा
  choice: मैं तुम्हें बचाऊँगा
  alternative: मैं तुम्हें छुड़ाऊँगा
  rationale: '''बचाऊँगा'' वाचा की पुनर्स्थापना और संकट से रक्षा, दोनों के व्यापक अर्थ की गुंजाइश रखता है; यह क्रिया को केवल राजनीतिक मुक्ति या बाद की विशिष्ट उद्धार-धारणा तक सीमित नहीं करता।'
- issue: यहूदा और इस्राएल की सामूहिक पहचान
  choice: हे यहूदा के घराने और इस्राएल के घराने
  alternative: हे यहूदा और इस्राएल
  rationale: '''घराने'' को बनाए रखने से सम्बोधित समुदायों की सामूहिक और वाचा-संबंधी पहचान सुरक्षित रहती है।'
- issue: आशीष बनने का आशय
  choice: तुम आशीष ठहरोगे
  alternative: तुम आशीष के कारण बनोगे
  rationale: मूल की संक्षिप्त और अर्थपूर्ण अभिव्यक्ति को सुरक्षित रखता है तथा यह खुला छोड़ता है कि लोग आशीष का मूर्त उदाहरण भी होंगे और दूसरों के लिए आशीष का माध्यम भी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण भविष्यसूचक स्वर रखा गया है। 'घराने', 'अभिशाप' और 'आशीष' जैसे परिचित बाइबलीय पद सामूहिक पहचान और मूल की प्रतिमा को सुरक्षित रखते हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में अर्थ-संबंधित पद के तुरन्त बाद रखे गए हैं।
