source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הִנְ/נִ֥י מוֹשִׁ֛יעַ אֶת עַמִּ֖/י מֵ/אֶ֣רֶץ מִזְרָ֑ח וּ/מֵ/אֶ֖רֶץ מְב֥וֹא הַ/שָּֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/008/007.yaml
  text: 'Thus says Yahweh of hosts: Behold[b][a], I will save my people from the land of the east and from the land of the setting of the sun.'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: देखो, मैं अपनी प्रजा को पूरब के देश से और सूर्यास्त के देश से बचाऊँगा।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं अपनी प्रजा को बचा रहा हूँ” या “मैं अपनी प्रजा को बचाने पर हूँ” भी हो सकता है। हिब्रू कृदन्त भविष्यवाणी में आसन्न अथवा निश्चित भावी कार्य व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पूरब के देश से और सूर्यास्त के देश से।” यह पूरब और पश्चिम—दोनों छोरों पर स्थित दूर-दूर के स्थानों को समेटने वाली अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यवाणी के अधिकारपूर्ण संदेश-सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यहोवा को वाचा के विशिष्ट नाम के रूप में रखता है और צְבָאוֹת के सैन्य तथा व्यापक सामर्थ्य-संबंधी भाव को 'सेनाओं' से व्यक्त करता है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: वक्ता की जोरदार आत्म-उपस्थिति और घोषित कार्य की निकटता पर बल देता है; हिन्दी में 'देखो' भविष्यवाणी की गंभीरता बनाए रखता है।
- source_word: מוֹשִׁיעַ
  choice: बचाऊँगा
  rationale: हिब्रू कृदन्त यहाँ भविष्यवाणी में आसन्न अथवा निश्चित भावी कार्य व्यक्त कर सकता है; हिन्दी का सामान्य भविष्यकाल इस प्रतिज्ञा को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: वाचागत समुदाय के अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מֵאֶרֶץ מִזְרָח
  choice: पूरब के देश से
  rationale: एकवचन 'देश' और पूर्व दिशा, दोनों को बनाए रखता है; किसी विशिष्ट राष्ट्र का नाम नहीं जोड़ता।
- source_word: וּמֵאֶרֶץ מְבוֹא הַשָּׁמֶשׁ
  choice: और उस देश से, जहाँ सूर्य अस्त होता है
  rationale: पश्चिम के लिए प्रयुक्त हिब्रू चित्रात्मक मुहावरे को केवल 'पश्चिम' में सपाट किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के अंतर को सुरक्षित रखता है।
- issue: מוֹשִׁיעַ का काल-पक्ष
  choice: बचाऊँगा
  alternative: बचा रहा हूँ / बचाने पर हूँ
  rationale: הִנְנִי के साथ कृदन्त भविष्यवाणी में आसन्न या निश्चित भविष्य को व्यक्त कर सकता है। हिन्दी भविष्यकाल अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी पक्षगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यवाणी-शैली रखी गई है। 'यों कहता है' और 'देखो' औपचारिकता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
