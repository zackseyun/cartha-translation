  text: וְ/עָמְד֣וּ רַגְלָ֣י/ו בַּ/יּוֹם הַ֠/הוּא עַל הַ֨ר הַ/זֵּתִ֜ים אֲשֶׁ֨ר עַל פְּנֵ֥י יְרוּשָׁלִַם֮ מִ/קֶּדֶם֒ וְ/נִבְקַע֩ הַ֨ר הַ/זֵּיתִ֤ים מֵֽ/חֶצְי/וֹ֙ מִזְרָ֣חָ/ה וָ/יָ֔מָּ/ה גֵּ֖יא גְּדוֹלָ֣ה מְאֹ֑ד וּ/מָ֨שׁ חֲצִ֥י הָ/הָ֛ר צָפ֖וֹנָ/ה וְ/חֶצְי/וֹ נֶֽגְבָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/004.yaml
  text: On that day his feet will stand on the Mount of Olives[a], which is before Jerusalem on the east; and the Mount of Olives will be split in two from east to west into a very great valley[b], with half of the mountain moving northward and half of it southward.
translation:
  language: hi
  text: उस दिन उसके पाँव जैतून पर्वत पर खड़े होंगे, जो यरूशलेम के सामने पूर्व की ओर है; और जैतून पर्वत अपने बीच से पूर्व और पश्चिम की ओर फट जाएगा[a], जिससे एक बहुत बड़ी घाटी बन जाएगी। पर्वत का आधा भाग उत्तर की ओर और आधा भाग दक्षिण की ओर खिसक जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: पर्वत अपने बीच से पूर्व की ओर और पश्चिम की ओर फट जाएगा।'
    reason: मूल हिब्रू विभाजन की दिशा को दोनों ओर फैलते हुए दर्शाता है; टिप्पणी इस स्थानिक चित्र को स्पष्ट करती है।
lexical_decisions:
- source_word: וְעָמְדוּ רַגְלָיו
  choice: उसके पाँव खड़े होंगे
  rationale: मूल के ठोस शारीरिक चित्रण को बनाए रखता है और भविष्यसूचक प्रसंग में क्रिया को स्वाभाविक हिन्दी भविष्यकाल में व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक पदबंध का सहज और सटीक हिन्दी रूप है।
- source_word: הַר הַזֵּתִים
  choice: जैतून पर्वत
  rationale: हिब्रू संरचना का प्रचलित और सहज हिन्दी भौगोलिक नाम।
- source_word: אֲשֶׁר עַל פְּנֵי יְרוּשָׁלִַם מִקֶּדֶם
  choice: जो यरूशलेम के सामने पूर्व की ओर है
  rationale: עַל־פְּנֵי के ‘सामने’ और מִקֶּדֶם के पूर्वी स्थान-संबंध, दोनों को सुरक्षित रखता है।
- source_word: וְנִבְקַע ... מֵחֶצְיוֹ מִזְרָחָה וָיָמָּה
  choice: अपने बीच से पूर्व और पश्चिम की ओर फट जाएगा
  rationale: हिब्रू में विभाजन बीच से दोनों दिशाओं की ओर होता है; यह ‘पूर्व से पश्चिम’ कहने की अपेक्षा स्रोत की स्थानिक रचना को अधिक ठीक रखता है।
- source_word: גֵּיא גְּדוֹלָה מְאֹד
  choice: एक बहुत बड़ी घाटी
  rationale: גֵּיא और מְאֹד की तीव्रता को सामान्य आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: וּמָשׁ
  choice: खिसक जाएगा
  rationale: क्रिया में स्थान से हटने या सरकने का भाव है; ‘खिसकना’ पर्वत के दोनों भागों के विस्थापन को स्पष्ट करता है।
- source_word: צָפוֹנָה / נֶגְבָּה
  choice: उत्तर की ओर / दक्षिण की ओर
  rationale: दिशासूचक प्रत्यय का स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: प्रसंग में परमेश्वर के लिए मानव-सदृश शारीरिक भाषा
  choice: ‘उसके पाँव खड़े होंगे’ का अक्षरार्थक चित्रण बनाए रखा गया
  alternative: ‘उसकी उपस्थिति ठहरेगी’ या ‘वह प्रकट होगा’
  rationale: मूल पाठ ठोस शारीरिक भाषा का प्रयोग करता है। उसका भावार्थीकरण करने से पाठ का वास्तविक धर्मवैचारिक तनाव समय से पहले हल हो जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अर्धविराम दो निकट संबद्ध भविष्यसूचक घटनाओं को जोड़ता है; दूसरे वाक्य में पर्वत के दोनों भागों की गति स्पष्ट की गई है।
