source:
  edition: WLC
  text: וְ/הָיָ֗ה כָּל הַ/נּוֹתָר֙ מִ/כָּל הַ/גּוֹיִ֔ם הַ/בָּאִ֖ים עַל יְרֽוּשָׁלִָ֑ם וְ/עָל֞וּ מִ/דֵּ֧י שָׁנָ֣ה בְ/שָׁנָ֗ה לְ/הִֽשְׁתַּחֲוֺת֙ לְ/מֶ֨לֶךְ֙ יְהוָ֣ה צְבָא֔וֹת וְ/לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/016.yaml
  text: Then all who remain from all the nations that came against Jerusalem shall go up year after year to worship the King[a], Yahweh of Armies[b], and to celebrate the Feast of Booths.
translation:
  language: hi
  text: तब उन सब जातियों में से जितने लोग बच रहेंगे, जो यरूशलेम के विरुद्ध आए थे, वे प्रति वर्ष राजा, सेनाओं के याहवे, की आराधना करने और झोपड़ियों का पर्व मनाने के लिए ऊपर जाया करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ... जाया करेंगे
  rationale: यह अभिव्यक्ति भविष्यसूचक क्रम में परिणाम का परिचय देती है। ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘जाया करेंगे’ भविष्य तथा नियमितता दोनों बनाए रखता है।
- source_word: כָּל הַנּוֹתָר
  choice: जितने लोग बच रहेंगे
  rationale: एकवचन सामूहिक कृदन्त उन सभी व्यक्तियों को दर्शाता है जो शेष अथवा जीवित बचेंगे; यह हिन्दी में स्वाभाविक है और ‘बचे हुए लोगों’ का भाव स्पष्ट करता है।
- source_word: מִכָּל הַגּוֹיִם
  choice: उन सब जातियों में से
  rationale: यहाँ גּוֹיִם विभिन्न राष्ट्रों/जनसमूहों को दर्शाता है। ‘जातियों’ बाइबलीय हिन्दी में परिचित है, और ‘में से’ स्रोत के चयनात्मक भाव को स्पष्ट रखता है।
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: जो यरूशलेम के विरुद्ध चढ़ आई थीं
  rationale: עַל इस प्रसंग में शत्रुतापूर्ण बढ़ाई को दर्शाता है। ‘विरुद्ध चढ़ आई थीं’ सैन्य संदर्भ और यरूशलेम की ओर चढ़ने की गति दोनों को व्यक्त करता है, बिना आक्रमण के किसी विशिष्ट चरण को तय किए।
- source_word: וְעָלוּ
  choice: ऊपर जाया करेंगे
  rationale: עלה यरूशलेम की भौगोलिक चढ़ाई और तीर्थयात्रा, दोनों की परिचित अभिव्यक्ति है। ‘ऊपर जाना’ इन दोनों अर्थछायाओं को बनाए रखता है।
- source_word: מִדֵּי שָׁנָה בְשָׁנָה
  choice: प्रति वर्ष
  rationale: यह वितरणात्मक पदबंध हर वर्ष होने वाली नियमित पुनरावृत्ति बताता है। ‘प्रति वर्ष’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में स्पष्ट है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: आराधना करने
  rationale: क्रिया का मूर्त अर्थ झुकना या दण्डवत करना है, पर इस उपासना-संबंधी प्रसंग में वह आराधना को सूचित करती है।
- source_word: לְמֶלֶךְ
  choice: राजा
  rationale: ‘राजा’ को याहवे की उपाधि के रूप में रखा गया है। हिन्दी वाक्य-विन्यास में ‘राजा—सेनाओं के याहवे—की आराधना’ स्रोत की संबंध-रचना को स्पष्ट करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: व्यक्तिगत दिव्य नाम יְהוָה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है। צְבָאוֹת का अर्थ पारदर्शी रखने के लिए ‘सेनाओं के’ चुना गया है; इससे पारंपरिक ‘सेनाओं के यहोवा’ की संरचना भी पहचानी जा सकती है।
- source_word: וְלָחֹג
  choice: और ... पर्व मनाने
  rationale: חגג किसी तीर्थ-पर्व को विधिवत मनाने या उत्सव करने को दर्शाता है। ‘पर्व मनाना’ स्वाभाविक हिन्दी है।
- source_word: חַג הַסֻּכּוֹת
  choice: झोपड़ियों का पर्व
  rationale: סֻכּוֹת अस्थायी झोपड़ियों या छप्परों को दर्शाता है। ‘झोपड़ियों का पर्व’ मूल चित्र को सामान्य पाठक के लिए स्पष्ट रखता है; परिचित वैकल्पिक नाम पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में चार-अक्षरीय व्यक्तिगत दिव्य नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे केवल उपाधि ‘प्रभु’ में बदलने से बचाता है।
- issue: צְבָאוֹת का दिव्य उपाधि में अर्थ
  choice: सेनाओं के
  alternative: स्वर्गीय सेनाओं के; सब सेनाओं के; मेज़बानों के
  rationale: मूल शब्द सैन्य दलों और स्वर्गीय समुदायों दोनों की अर्थछाया रख सकता है। ‘सेनाओं के’ अर्थ को स्पष्ट रखते हुए यह तय नहीं करता कि यहाँ केवल मानवीय या केवल स्वर्गीय सेनाएँ अभिप्रेत हैं।
- issue: जातियों की भावी तीर्थयात्रा का स्वरूप
  choice: भविष्यसूचक चित्र को उसके प्रत्यक्ष वार्षिक और उपासना-संबंधी रूप में बनाए रखा
  alternative: इसे केवल शाब्दिक भावी तीर्थयात्रा या केवल सार्वभौमिक आराधना का प्रतीक मानकर स्पष्ट करना
  rationale: पद स्वयं बचे हुए लोगों के प्रतिवर्ष यरूशलेम जाने और पर्व मनाने का चित्र देता है। अनुवाद उसके शाब्दिक, प्रतीकात्मक अथवा अपोकैलिप्टिक संबंध को किसी एक धर्मवैज्ञानिक योजना में सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण मानक हिन्दी अपनाई गई है। ‘आराधना’, ‘पर्व’ और ‘प्रति वर्ष’ जैसे शब्द व्यापक रूप से समझे जाते हैं। सैन्य संदर्भ में ‘चढ़ आई थीं’ तथा तीर्थयात्रा में ‘ऊपर जाया करेंगे’ रखकर עלה की प्रसंगानुसार भिन्न अर्थछायाएँ सुरक्षित की गई हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
