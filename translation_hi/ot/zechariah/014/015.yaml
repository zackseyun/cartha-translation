id: ZEC.14.15
reference: Zechariah 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֵ֨ן תִּֽהְיֶ֜ה מַגֵּפַ֣ת הַ/סּ֗וּס הַ/פֶּ֨רֶד֙ הַ/גָּמָ֣ל וְ/הַ/חֲמ֔וֹר וְ/כָ֨ל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/מַּחֲנ֣וֹת הָ/הֵ֑מָּה כַּ/מַּגֵּפָ֖ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/015.yaml
  text: And so the plague will be on the horse[a], the mule, the camel, the donkey, and every animal that is in those camps—the same plague as this.
translation:
  language: hi
  text: और घोड़े, खच्चर, ऊँट, गधे और उन छावनियों में रहने वाले हर पशु पर भी इस महामारी जैसी ही महामारी पड़ेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֵן
  choice: और ... भी वैसी ही
  rationale: यह पद पिछले पद में बताए गए न्याय से समानता जोड़ता है। हिन्दी में ‘भी वैसी ही’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תִּהְיֶה מַגֵּפַת
  choice: महामारी पड़ेगी
  rationale: हिब्रू में शाब्दिक रूप से ‘महामारी होगी’ है; हिन्दी में किसी पर महामारी आने के लिए ‘महामारी पड़ेगी’ अधिक स्वाभाविक है और भावी न्याय का अर्थ बनाए रखता है।
- source_word: הַסּוּס הַפֶּרֶד הַגָּמָל וְהַחֲמוֹר
  choice: घोड़े, खच्चर, ऊँट, गधे
  rationale: ये पशु-संज्ञाओं के सीधे आधुनिक हिन्दी समतुल्य हैं; हिब्रू एकवचन रूपों का सामूहिक अर्थ हिन्दी सूची में भी स्वाभाविक है।
- source_word: וְכָל הַבְּהֵמָה
  choice: और ... हर पशु
  rationale: בְּהֵמָה यहाँ पहले गिनाए पशुओं से आगे सभी संबंधित पशुओं को समेटता है। ‘हर पशु’ व्यापक, स्पष्ट और गरिमापूर्ण है।
- source_word: אֲשֶׁר יִהְיֶה בַּמַּחֲנוֹת הָהֵמָּה
  choice: उन छावनियों में रहनेवाले
  rationale: מַחֲנוֹת का सीधा अर्थ ‘छावनियाँ’ है। ‘रहनेवाले’ स्थानगत संबंध को सहज हिन्दी में व्यक्त करता है, बिना इसे ‘सेनाएँ’ बनाकर व्याख्यायित किए।
- source_word: כַּמַּגֵּפָה הַזֹּאת
  choice: वैसी ही महामारी ... जैसी यह महामारी
  rationale: כְּ तुलना सूचित करता है। यह रचना पशुओं पर पड़ने वाली महामारी को अभी वर्णित महामारी के समान बताती है और हिब्रू की तुलना को स्पष्ट रखती है।
theological_decisions:
- issue: शत्रु की छावनियों के पशुओं पर न्याय का स्वरूप
  choice: पिछले पद में वर्णित महामारी के समान वास्तविक महामारी को पशुओं तक फैलते हुए प्रस्तुत किया
  alternative: इसे सामान्य रूप से ‘विपत्ति’ या ‘कष्ट’ कहना
  rationale: निकटवर्ती संदर्भ में מַגֵּפָה की पुनरावृत्ति ठोस महामारी-सदृश दैवी न्याय का समर्थन करती है। ‘महामारी’ उसकी तीव्रता को कम किए बिना पशुओं तक उसके विस्तार को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य स्वाभाविक, स्पष्ट और गरिमापूर्ण रखा गया है। ‘छावनियों’ ने सैन्य प्रसंग बनाए रखा है, जबकि ‘महामारी पड़ेगी’ बोलचाल की सहजता और पाठ की गंभीरता दोनों को साधता है।
