base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/009.yaml
  text: And Yahweh will be king over all the earth[a]. On that day Yahweh will be one[b], and his name one.
translation:
  language: hi
  text: और याहवे सारी पृथ्वी पर राजा होगा। उस दिन याहवे एक होगा[a], और उसका नाम एक होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल याहवे ही होगा” अथवा “याहवे अद्वितीय होगा”; इब्रानी शब्द “एक” एकता के साथ-साथ एकमात्रता या अनन्यता भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “केवल उसी का नाम होगा” अथवा “उसका नाम अद्वितीय होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... होगा
  rationale: भविष्यसूचक कथन में संयोजक सहित यह पूर्ण क्रिया भविष्य का भाव व्यक्त करती है; ‘होगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לְמֶלֶךְ
  choice: राजा होगा
  rationale: यहाँ לְ राजकीय पद और भूमिका को व्यक्त करता है; ‘राजा होगा’ स्वाभाविक हिन्दी है।
- source_word: עַל כָּל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: עַל राजकीय प्रभुत्व दर्शाता है और इस भविष्यसूचक संदर्भ में הָאָרֶץ का विस्तार समस्त पृथ्वी है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक काल-सूचक पदबंध है और आधुनिक हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: יִהְיֶה יְהוָה אֶחָד
  choice: याहवे एक होगा
  rationale: אֶחָד का सीधा अर्थ ‘एक’ रखा गया है, ताकि एकता, अनन्यता और एकमात्रता के बीच इब्रानी कथन की संक्षिप्त अर्थ-विस्तारिता बनी रहे।
- source_word: וּשְׁמוֹ אֶחָד
  choice: और उसका नाम एक होगा
  rationale: पहले खंड के साथ समानांतरता बनाए रखने और ‘एकमात्र’ या ‘अद्वितीय’ जैसे किसी एक अर्थ को मुख्य पाठ में निर्णायक न बनाने के लिए ‘एक’ रखा गया है।
theological_decisions:
- issue: परमेश्वर के व्यक्तिगत नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में יְהוָה व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना अपेक्षाकृत निकट लिप्यंतरण देता है।
- issue: ‘याहवे एक होगा’ का अर्थ
  choice: मुख्य पाठ में ‘एक’ बनाए रखना
  alternative: केवल याहवे ही होगा; याहवे अद्वितीय होगा
  rationale: इब्रानी אֶחָד एकता के साथ-साथ अनन्यता या एकमात्रता भी व्यक्त कर सकता है। मुख्य पाठ में ‘एक’ रखने से इस धार्मिक अर्थ-विस्तार को संकीर्ण नहीं किया जाता।
- issue: ‘उसका नाम एक होगा’ का अर्थ
  choice: मुख्य पाठ में समानांतर शब्द ‘एक’ बनाए रखना
  alternative: केवल उसी का नाम होगा; उसका नाम अद्वितीय होगा
  rationale: यह पहले खंड के साथ जानबूझकर रची गई समानांतरता को सुरक्षित रखता है और ‘नाम’ के सार्वभौमिक, अनन्य सम्मान के आशय को अनावश्यक रूप से नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी की संक्षिप्त समानांतर रचना—‘याहवे एक ... उसका नाम एक’—को हिन्दी में जानबूझकर सुरक्षित रखा गया है; संभावित अर्थों को पादटिप्पणियों में दिया गया है।
