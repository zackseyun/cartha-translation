source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ עַל מְצִלּ֣וֹת הַ/סּ֔וּס קֹ֖דֶשׁ לַֽ/יהוָ֑ה וְ/הָיָ֤ה הַ/סִּירוֹת֙ בְּ/בֵ֣ית יְהוָ֔ה כַּ/מִּזְרָקִ֖ים לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/020.yaml
  text: On that day[a], there will be on the bells of the horses[c][b], “Holy to Yahweh,” and the pots in the house of Yahweh will be like the bowls before the altar.
translation:
  language: hi
  text: उस दिन घोड़ों की घंटियों[a] पर “यहोवा के लिए पवित्र”[b] होगा, और यहोवा के भवन की हाँड़ियाँ वेदी के सामने के कटोरों[c] के समान होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह शब्द घोड़े के साज पर लगी छोटी, झंकारने वाली धातु की वस्तुओं के लिए हो सकता है; ‘घंटियाँ’ इसका सबसे सम्भावित अर्थ है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “यहोवा के लिए पवित्रता” भी हो सकता है। यह वाक्य निर्गमन 28:36 में महायाजक की सोने की पट्टी पर लिखे शब्दों की प्रतिध्वनि है।
    reason: lexical_alternative
  - marker: c
    text: या, “पात्रों।” ये मन्दिर की विधियों में प्रयुक्त पवित्र पात्र थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक सूत्र का स्वाभाविक और सटीक आधुनिक हिन्दी रूप है।
- source_word: יִהְיֶה עַל
  choice: पर लिखा होगा
  rationale: इब्रानी में केवल ‘पर होगा’ है, पर इसके बाद उद्धृत समर्पण-वाक्य होने के कारण हिन्दी में ‘लिखा होगा’ आशय को स्वाभाविक बनाता है; यह निहित लेख को व्यक्त करता है।
- source_word: מְצִלּוֹת הַסּוּס
  choice: घोड़ों की घंटियाँ
  rationale: מְצִלּוֹת संभवतः घोड़े के साज पर लगी छोटी झंकारने वाली धातु की वस्तुएँ हैं; एकवचन הַסּוּס यहाँ जातिवाचक/समूहवाचक है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: यहोवा के लिए पवित्र
  rationale: यह निर्गमन 28:36 के महायाजकीय अभिलेख की प्रतिध्वनि करता है और पवित्रता तथा समर्पण दोनों का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से दर्शाया गया है, ताकि मूल पाठ में नाम की उपस्थिति स्पष्ट रहे।
- source_word: הַסִּירוֹת בְּבֵית יְהוָה
  choice: यहोवा के भवन की हाँड़ियाँ
  rationale: ‘भवन’ मूल ‘घर’ की मन्दिर-संबंधी अभिव्यक्ति को बनाए रखता है; ‘हाँड़ियाँ’ पकाने या उबालने के पात्रों का सहज हिन्दी नाम है।
- source_word: כַּמִּזְרָקִים לִפְנֵי הַמִּזְבֵּחַ
  choice: वेदी के सामने के कटोरों के समान
  rationale: מִזְרָקִים बलि-विधि में प्रयुक्त कटोरे अथवा पात्र हैं; ‘कटोरे’ सामान्य पाठक के लिए स्पष्ट है और स्थान-संबंध भी सुरक्षित रहता है।
theological_decisions:
- issue: साधारण वस्तुओं तक पवित्रता का विस्तार
  choice: घोड़ों के साज और भवन की हाँड़ियों को पवित्र अभिलेख तथा वेदी के पात्रों के समान दर्जा मिलने का दृश्य यथावत रखा गया है।
  alternative: इसे केवल सामान्य आशीष का प्रतीक मानकर पवित्र और सामान्य वस्तुओं के बीच के भेद के लोप को अस्पष्ट करना।
  rationale: स्पष्ट अभिलेख ‘यहोवा के लिए पवित्र’ और हाँड़ियों की वेदी-सामने के कटोरों से तुलना भविष्य के व्यापक पवित्रीकरण को दर्शाती है; अनुवाद इसे बिना अतिरिक्त धर्मशास्त्रीय व्याख्या के प्रस्तुत करता है।
- issue: קֹדֶשׁ לַיהוָה में गुण और समर्पण का संबंध
  choice: ‘यहोवा के लिए पवित्र’
  alternative: ‘यहोवा की पवित्रता’ या ‘यहोवा को पवित्र’
  rationale: चुना हुआ रूप वस्तु की पवित्र स्थिति और यहोवा के लिए उसके समर्पण—दोनों को खुला रखता है तथा महायाजक की पट्टी की प्रतिध्वनि बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य में भविष्यसूचक लय रखी गई है; मन्दिर-संबंधी शब्दावली स्पष्ट है, पर अनावश्यक रूप से पुरातन नहीं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
