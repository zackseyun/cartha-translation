  text: और वे उसमें बसेंगे[a], और फिर विनाश के लिए समर्पित कुछ भी न होगा; यरूशलेम सुरक्षित बसा रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और फिर कोई श्राप न होगा”; इब्रानी शब्द חֵרֶם किसी प्रतिबंधित अथवा विनाश के लिए समर्पित वस्तु को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשְׁבוּ בָהּ
  choice: और वे उसमें बसेंगे
  rationale: तीसरे पुरुष बहुवचन को बिना कोई नया स्पष्ट कर्ता जोड़े ‘वे’ से व्यक्त किया गया है। ‘बसेंगे’ ישׁב के निवास और स्थायी बसावट के भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: חֵרֶם
  choice: विनाश के लिए समर्पित वस्तु
  rationale: חֵרֶם किसी प्रतिबंधित अथवा विनाश के लिए अर्पित/समर्पित वस्तु को सूचित कर सकता है। यह चयन केवल अमूर्त ‘श्राप’ कहने के बजाय न्याय के अधीन विनाश हेतु ठहराए जाने का भाव बनाए रखता है।
- source_word: לֹא יִהְיֶה עוֹד
  choice: फिर ... न होगी
  rationale: यह हिन्दी प्रयोग उस दशा के आगे से समाप्त हो जाने का भाव सहज रूप में व्यक्त करता है।
- source_word: וְיָשְׁבָה יְרוּשָׁלִַם
  choice: यरूशलेम ... बसा रहेगा
  rationale: स्त्रीलिंग एकवचन क्रिया का नगर से संबंध और पहले प्रयुक्त ישׁב की निवास-छवि सुरक्षित रखी गई है। हिन्दी में ‘यरूशलेम बसेगा’ की अपेक्षा ‘यरूशलेम बसा रहेगा’ अधिक स्वाभाविक है और नगर के सुरक्षित, स्थिर रूप से बसे रहने को व्यक्त करता है।
- source_word: לָבֶטַח
  choice: निडर
  rationale: לָבֶטַח सुरक्षा और भयमुक्त निवास का भाव देता है। ‘निडर बसा रहेगा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: अंतकालीन पुनर्स्थापना के संदर्भ में חֵרֶם का अर्थ
  choice: विनाश के लिए समर्पित वस्तु
  alternative: श्राप; विनाश का प्रतिबंध; पूर्ण विनाश
  rationale: यह पद यरूशलेम के फिर कभी दैवी न्याय के अंतर्गत विनाश के लिए ठहराई गई वस्तु बनने की दशा न रहने की प्रतिज्ञा करता है। मुख्य पाठ में ‘श्राप’ रखने से शब्द का व्यापक अमूर्त अर्थ लिया जा सकता था; इसलिए मूल की प्रतिबंध/समर्पण संबंधी धारणा रखी गई और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। समान इब्रानी धातु ישׁב की पुनरावृत्ति को ‘बसेंगे/बसा रहेगा’ द्वारा यथासंभव बनाए रखा गया है।
