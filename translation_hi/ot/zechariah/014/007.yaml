  yaml_path: translation/ot/zechariah/014/007.yaml
  text: And it will be one day[a], known to Yahweh, neither day nor night[c][b]; but at evening time there will be light.
translation:
  language: hi
  text: एक दिन होगा[a], जो याहवे को ज्ञात होगा[b]—न दिन, न रात; पर साँझ के समय उजियाला होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “एक दिन।” प्रसंग में इसका आशय एकमात्र या विलक्षण दिन भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में: “याहवे को ज्ञात।” “याहवे” परमेश्वर के व्यक्तिगत इब्रानी नाम का लिप्यंतरण है।'
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: वह … होगा
  rationale: भविष्यसूचक कथन को स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानी की भविष्य-दिशा बनाए रखता है।
- source_word: יוֹם אֶחָד
  choice: एक दिन
  rationale: इब्रानी का सीधा अर्थ ‘एक दिन’ है। प्रसंग में वह दिन विलक्षण हो सकता है, पर मुख्य पाठ में ‘अनोखा’ जोड़ने के बजाय इस अर्थ-संभावना को टिप्पणी में सुरक्षित रखा गया है।
- source_word: יִוָּדַע לַיהוָה
  choice: जो याहवे को ज्ञात होगा
  rationale: निफ़अल रूप और संबंधसूचक ל को निकटता से व्यक्त करता है। ‘केवल याहवे को’ नहीं कहा गया, क्योंकि ‘केवल’ मूल पाठ में स्पष्ट नहीं है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत इब्रानी नाम को लिप्यंतरित करके मूल पाठ की विशिष्टता बनाए रखी गई है।
- source_word: לֹא יוֹם וְלֹא לָיְלָה
  choice: न दिन, न रात
  rationale: दोनों श्रेणियों के तीखे निषेध और कथन के रहस्यपूर्ण तनाव को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְעֵת עֶרֶב
  choice: साँझ के समय
  rationale: समय-सूचक इब्रानी वाक्यांश का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: יִהְיֶה אוֹר
  choice: उजियाला होगा
  rationale: साँझ में प्रकाश होने के आश्चर्यपूर्ण उलटाव को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: उस असाधारण दिन का स्वरूप
  choice: एक ऐसे विलक्षण भविष्यसूचक दिन का वर्णन रखा गया है जिसकी ठीक प्रकृति याहवे को ज्ञात है और जिसमें साँझ के समय उजियाला होगा।
  alternative: इसे किसी निश्चित खगोलीय घटना, केवल प्रतीकात्मक उद्धार, या किसी खास सहस्राब्दी-कालक्रम के रूप में स्पष्ट करना।
  rationale: पद उस दिन की असाधारणता और दिन-रात से परे उसके रहस्यपूर्ण स्वरूप को बताता है, पर किसी विशिष्ट अंत-कालीन प्रणाली या घटना-तंत्र को परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘न दिन, न रात’ मूल के संक्षिप्त और विरोधाभासी बल को बनाए रखता है; ‘उजियाला’ भविष्यसूचक काव्य-लहजे के अनुकूल है।
