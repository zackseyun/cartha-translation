source:
  edition: WLC
  text: וְ/נַסְתֶּ֣ם גֵּֽיא הָרַ֗/י כִּֽי יַגִּ֣יעַ גֵּי הָרִים֮ אֶל אָצַל֒ וְ/נַסְתֶּ֗ם כַּ/אֲשֶׁ֤ר נַסְתֶּם֙ מִ/פְּנֵ֣י הָ/רַ֔עַשׁ בִּ/ימֵ֖י עֻזִּיָּ֣ה מֶֽלֶךְ יְהוּדָ֑ה וּ/בָא֙ יְהוָ֣ה אֱלֹהַ֔/י כָּל קְדֹשִׁ֖ים עִמָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/005.yaml
  text: And you will flee by the valley of my mountains[a], for the valley of the mountains will reach to Azal. Yes, you will flee as you fled from before the earthquake in the days of Uzziah king of Judah. Then Yahweh my God will come[b], and all the holy ones with him.
translation:
  language: hi
  text: तब तुम मेरे पहाड़ों की घाटी में भागोगे, क्योंकि पहाड़ों की घाटी आसल तक पहुँचेगी। हाँ, तुम वैसे ही भागोगे जैसे यहूदा के राजा उज्जियाह के दिनों में भूकंप के कारण भागे थे। तब मेरे परमेश्वर याहवे आएगा, और सब पवित्र जन[a] तेरे साथ होंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र जन’ से स्वर्गीय सेवक अभिप्रेत हो सकते हैं; कुछ लोग इसका अर्थ ‘संत’ या ‘स्वर्गदूत’ समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पाठ में ‘तेरे साथ’ है; कुछ प्राचीन पाठ-साक्ष्यों के अनुसार ‘उसके साथ।’
    reason: textual_variant
lexical_decisions:
- source_word: וְנַסְתֶּם
  choice: तुम ... भागोगे
  rationale: נוּס का सामान्य अर्थ ‘भागना’ है, और भूकंप के समय भागने से की गई अगली तुलना इसी अर्थ की पुष्टि करती है।
- source_word: גֵּיא הָרַי
  choice: मेरे पहाड़ों की घाटी
  rationale: גיא के लिए ‘घाटी’ स्वाभाविक है और הָרַי में प्रथम पुरुष एकवचन प्रत्यय को ‘मेरे’ के रूप में बनाए रखा गया है। गति के मार्ग को स्वाभाविक हिन्दी में स्पष्ट करने के लिए ‘से होकर’ जोड़ा गया है।
- source_word: יַגִּיעַ ... אֶל אָצַל
  choice: आसल तक पहुँचेगी
  rationale: यहाँ נגע का हिफ़इल रूप स्थानिक विस्तार बताता है; אָצַל स्थान-नाम है, जिसे ‘आसल’ लिप्यंतरित किया गया है।
- source_word: מִפְּנֵי הָרַעַשׁ
  choice: भूकंप से बचने के लिए
  rationale: शाब्दिक ‘भूकंप के सामने से’ आधुनिक हिन्दी में अस्वाभाविक है; प्रसंग में आशय भूकंप के कारण उससे बचकर भागना है।
- source_word: יְהוָה אֱלֹהַי
  choice: मेरे परमेश्वर यहवे
  rationale: אֱלֹהַי का प्रथम पुरुष प्रत्यय सुरक्षित रखा गया है और יהוה को व्यक्तिगत ईश्वरीय नाम ‘यहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: כָּל קְדֹשִׁים
  choice: सब पवित्र जन
  rationale: यह अभिव्यक्ति स्वर्गीय सेवकों, संतों या अन्य पवित्र व्यक्तियों को सूचित कर सकती है; ‘पवित्र जन’ मूल की व्यापकता को बिना ‘स्वर्गदूत’ निश्चित किए बनाए रखता है।
- source_word: עִמָּךְ
  choice: तेरे साथ
  rationale: WLC में द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय स्पष्ट है। संबोधन का अचानक एकवचन हो जाना कठिन है, पर मुख्य पाठ मूल साक्ष्य को सुरक्षित रखता है।
theological_decisions:
- issue: प्रभु के आगमन से जुड़े קְדֹשִׁים की पहचान
  choice: सब पवित्र जन
  alternative: सब संत; सब पवित्र स्वर्गदूत
  rationale: इब्रानी पद उनकी पहचान स्पष्ट रूप से न तो स्वर्गदूतों के रूप में करता है, न छुड़ाए हुए मनुष्यों के रूप में; इसलिए व्यापक अभिव्यक्ति रखी गई है।
- issue: עִמָּךְ में साथ होने वाला व्यक्ति
  choice: तेरे साथ
  alternative: उसके साथ
  rationale: मसोरेटिक पाठ में ‘तेरे साथ’ है, जबकि कुछ प्राचीन साक्ष्य और संदर्भगत समझ ‘उसके साथ’ का समर्थन करते हैं। मुख्य पाठ में WLC को रखा गया और पाठांतर पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יהוה
  choice: यहवे
  alternative: प्रभु; यहोवा
  rationale: पद में व्यक्तिगत चतुरक्षरीय नाम सीधे प्रयुक्त है; उसे उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। बहुवचन ‘तुम’ से अंत के एकवचन ‘तेरे’ में मूल पाठ का कठिन परिवर्तन जानबूझकर सुरक्षित रखा गया है; इसे चुपचाप समतल नहीं किया गया।
