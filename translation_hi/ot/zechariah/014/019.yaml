source:
  edition: WLC
  text: זֹ֥את תִּהְיֶ֖ה חַטַּ֣את מִצְרָ֑יִם וְ/חַטַּאת֙ כָּל הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/019.yaml
  text: This will be the punishment of Egypt[b][a], and the punishment of all the nations that do not go up to celebrate the Festival of Booths.
translation:
  language: hi
  text: यह मिस्र का दण्ड[a] होगा और उन सभी राष्ट्रों का भी जो झोंपड़ियों का पर्व[b] मनाने के लिए ऊपर नहीं जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दण्ड-फल।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ दूसरे संदर्भों में “पाप” भी हो सकता है, पर यहाँ वह पर्व के लिए ऊपर जाने से इनकार करने पर आने वाले न्याय को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इसे परम्परागत रूप से “मण्डपों का पर्व” या “तम्बुओं का पर्व” भी कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת תִּהְיֶה
  choice: यही ... होगा
  rationale: स्त्रीलिंग एकवचन संकेतवाचक और अपूर्ण क्रिया यहाँ पहले बताए गए परिणाम की ओर संकेत करते हैं; हिन्दी में इस वाक्य-विन्यास से भाव स्वाभाविक और स्पष्ट रहता है।
- source_word: חַטַּאת
  choice: दण्ड
  rationale: यद्यपि इस शब्द का सामान्य अर्थ ‘पाप’ भी है, पद 18–19 के न्याय-संदर्भ में यह आज्ञा न मानने के कारण आने वाले दण्ड को सूचित करता है।
- source_word: מִצְרָיִם
  choice: मिस्र
  rationale: देश और राष्ट्र के नाम का प्रचलित हिन्दी रूप।
- source_word: כָּל הַגּוֹיִם
  choice: सभी राष्ट्रों
  rationale: यहाँ शब्द इस्राएल के बाहर के समस्त राष्ट्रों को व्यापक रूप से सूचित करता है; ‘राष्ट्र’ आधुनिक हिन्दी में स्पष्ट और निष्पक्ष है।
- source_word: אֲשֶׁר לֹא יַעֲלוּ
  choice: जो ... ऊपर नहीं जाएँगे
  rationale: यरूशलेम की तीर्थयात्रा के लिए ‘ऊपर जाने’ के इब्रानी मुहावरे को सुरक्षित रखते हुए भविष्यगत संदर्भ व्यक्त किया गया है।
- source_word: לָחֹג
  choice: मनाने के लिए
  rationale: क्रिया का अर्थ तीर्थ-पर्व मनाना या उसका पालन करना है; ‘मनाना’ साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חַג הַסֻּכּוֹת
  choice: झोंपड़ियों का पर्व
  rationale: यह अनुवाद पर्व के इब्रानी नाम में निहित अस्थायी निवासों की छवि को स्पष्ट रखता है।
theological_decisions:
- issue: न्याय के संदर्भ में חַטַּאת का अर्थ
  choice: दण्ड
  alternative: पाप; अपराध का फल; दण्ड-विधान
  rationale: यह पद मिस्र और अन्य राष्ट्रों द्वारा पर्व के लिए न आने पर होने वाले न्याय का सार देता है। ‘दण्ड’ तात्कालिक संदर्भ को स्पष्ट करता है, जबकि पादटिप्पणी मूल शब्द की वास्तविक अर्थ-व्याप्ति को सुरक्षित रखती है।
- issue: חַג הַסֻּכּוֹת पर्व के नाम का अनुवाद
  choice: झोंपड़ियों का पर्व
  alternative: मण्डपों का पर्व; तम्बुओं का पर्व
  rationale: अनूदित नाम सामान्य पाठक को पर्व के अस्थायी आश्रयों की छवि समझाता है और किसी विशेष सम्प्रदाय की शब्दावली को प्राथमिकता नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊपर जाना’ यरूशलेम की तीर्थयात्रा का मूल मुहावरा सुरक्षित रखता है। वाक्य में ‘यही दण्ड होगा’ को अंत में रखकर इब्रानी संकेतवाचक बल को स्वाभाविक हिन्दी में व्यक्त किया गया है।
