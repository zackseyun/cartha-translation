  text: וְ/אִם מִשְׁפַּ֨חַת מִצְרַ֧יִם לֹֽא תַעֲלֶ֛ה וְ/לֹ֥א בָאָ֖ה וְ/לֹ֣א עֲלֵי/הֶ֑ם תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ לֹ֣א יַֽעֲל֔וּ לָ/חֹ֖ג אֶת חַ֥ג הַ/סֻּכּֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/018.yaml
  text: And if the family of Egypt does not go up and does not come[c][b][a], then the plague will not be upon them—the plague with which Yahweh strikes the nations that do not go up to celebrate the Feast of Booths.
translation:
  language: hi
  text: और यदि मिस्र का कुल ऊपर न जाए और न आए,[a] तो उन पर वह महामारी नहीं पड़ेगी—वह महामारी जिससे याहवे उन जातियों पर प्रहार करता है जो झोंपड़ियों का पर्व[c] मनाने के लिए ऊपर नहीं जातीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “ऊपर न जाए और न आए।” इब्रानी में दोनों क्रियाएँ हैं; सम्भवतः वे यरूशलेम की तीर्थयात्रा के विचार पर बल देती हैं।
    reason: lexical_alternative
  - marker: c
    text: 'परम्परागत नाम: “मण्डपों का पर्व।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת מִצְרַיִם
  choice: मिस्र का कुल
  rationale: מִשְׁפָּחָה परिवार या कुल जैसे सामूहिक समूह को दर्शाता है। ‘मिस्र का कुल’ इब्रानी के एकवचन सामूहिक रूप को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תַעֲלֶה
  choice: ऊपर जाए
  rationale: עלה यरूशलेम या तीर्थ-पर्व के लिए जाने का प्रचलित क्रियापद है। ‘ऊपर जाए’ उस तीर्थयात्रा-संबंधी भाव को सुरक्षित रखता है।
- source_word: וְלֹא בָאָה
  choice: और न आए
  rationale: בוא का सामान्य अर्थ ‘आना/प्रवेश करना’ है। दोनों क्रियाओं को बनाए रखने से इब्रानी का ‘ऊपर जाना’ और ‘आना’ वाला दोहरा कथन सुरक्षित रहता है।
- source_word: וְלֹא עֲלֵיהֶם תִּהְיֶה הַמַּגֵּפָה
  choice: तो उन पर वह महामारी नहीं पड़ेगी
  rationale: इब्रानी पाठ का निषेध व्याकरणतः ‘उन पर’ और ‘महामारी’ वाले कथन के साथ है। अनुवाद प्रसंग की कठिनाई को मिटाए बिना हिन्दी में बोधगम्य रहता है।
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: מַגֵּפָה प्रायः ईश्वरीय प्रहार के रूप में आने वाली महामारी या विपत्ति को दर्शाता है। आगे נָגַף के कारण ‘महामारी’ प्रसंगानुकूल है।
- source_word: יִגֹּף
  choice: मारता है
  rationale: נָגַף का अर्थ मारना, प्रहार करना या पीड़ित करना है। ‘मारता है’ सरल, वर्तमान हिन्दी में प्रहार का बल बनाए रखता है।
- source_word: הַגּוֹיִם
  choice: जातियों
  rationale: यहाँ גּוֹיִם सामान्य रूप से विभिन्न राष्ट्रों या जातियों को दर्शाता है; इसे बाद के धार्मिक अर्थ वाले किसी संकुचित पद से नहीं बाँधा गया है।
- source_word: לָחֹג
  choice: मनाने के लिए
  rationale: חגג किसी तीर्थ-पर्व को मनाने या उसका पालन करने को दर्शाता है। ‘पर्व मनाने’ का प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חַג הַסֻּכּוֹת
  choice: झोंपड़ियों का पर्व
  rationale: סֻכּוֹת अस्थायी झोंपड़ियों या आश्रयों को दर्शाता है। यह चयन इब्रानी बिंब को पारदर्शी रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी में परमेश्वर का व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; इसलिए उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: पिछले पद में वर्षा न होने और इस पद में महामारी न पड़ने के बीच प्रत्यक्ष तनाव
  choice: मुख्य पाठ में मसोराई पाठ के निषेध सहित ‘उन पर वह महामारी नहीं पड़ेगी’ बनाए रखना
  alternative: प्रसंग के आधार पर अर्थ करना कि मिस्र पर वर्षा नहीं होगी, या निषेध हटाकर कहना कि उस पर महामारी पड़ेगी
  rationale: प्राप्त इब्रानी पाठ स्पष्ट रूप से הַמַּגֵּפָה (‘महामारी’) और निषेध לֹא रखता है। प्रसंग कठिन होने पर भी अनुवाद में इसे चुपचाप सुधारना या पिछले पद से ‘वर्षा’ जोड़ना उचित नहीं है; कठिनाई पादटिप्पणी में बताई गई है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम आया है। ‘याहवे’ उसका नाम होने का स्वरूप सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य रखी गई है। ‘कुल’ सामूहिक एकवचन को, ‘ऊपर जाना’ यरूशलेम की तीर्थयात्रा को, और ‘झोंपड़ियों का पर्व’ मूल सांस्कृतिक बिंब को सुरक्षित रखते हैं। कठिन इब्रानी निषेध को मुख्य पाठ में यथावत रखा गया है और उसकी प्रसंगगत समस्या पादटिप्पणी में स्पष्ट की गई है।
