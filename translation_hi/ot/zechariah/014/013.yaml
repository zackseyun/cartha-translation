  text: וְ/הָיָה֙ בַּ/יּ֣וֹם הַ/ה֔וּא תִּֽהְיֶ֧ה מְהֽוּמַת יְהוָ֛ה רַבָּ֖ה בָּ/הֶ֑ם וְ/הֶחֱזִ֗יקוּ אִ֚ישׁ יַ֣ד רֵעֵ֔/הוּ וְ/עָלְתָ֥ה יָד֖/וֹ עַל יַ֥ד רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/013.yaml
  text: And on that day a great panic from Yahweh will be among them[a], and each man will seize the hand of his neighbor[b], and his hand will rise against the hand of his neighbor.
translation:
  language: hi
  text: उस दिन उनके बीच यहोवा की ओर से बड़ी घबराहट[a] फैलेगी। हर पुरुष अपने साथी का हाथ जकड़ लेगा, और उसका हाथ उसके साथी के हाथ के विरुद्ध उठेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बड़ी उलझन’ अथवा ‘यहोवा की ओर से बड़ी खलबली।’ इब्रानी शब्द यहोवा द्वारा भेजी गई अस्त-व्यस्त घबराहट या आतंक की दशा भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसका हाथ उसके साथी के हाथ के विरुद्ध उठेगा।’ यह इब्रानी की सजीव अभिव्यक्ति है, जिसका भाव है कि वे हिंसक रूप से एक-दूसरे के विरुद्ध हो जाएँगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוּמַת
  choice: घबराहट
  rationale: यह संज्ञा आतंक, अव्यवस्था और उथल-पुथल की ऐसी दशा बताती है जो यहाँ ईश्वरीय न्याय के रूप में आती है। ‘घबराहट’ आधुनिक हिन्दी में स्वाभाविक है; पादटिप्पणी इसके व्यापक अर्थ-क्षेत्र को सुरक्षित रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परमेश्वर के व्यक्तिगत नाम का प्रचलित और पहचाना हुआ रूप।
- source_word: רַבָּה
  choice: बड़ी
  rationale: विशेषण घबराहट की तीव्रता पर बल देता है; ‘बड़ी घबराहट’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: בָּהֶם
  choice: उनके बीच
  rationale: ב यहाँ समूह के भीतर फैलने वाली दशा को सूचित करता है, जैसा कि आगे परस्पर हिंसा से स्पष्ट होता है; फिर भी इसे ‘उनमें’ या ‘उन पर’ समझने की संभाव्यता पूरी तरह समाप्त नहीं की गई है।
- source_word: וְהֶחֱזִיקוּ
  choice: जकड़ लेगा
  rationale: חזק का हिफ़ील रूप बलपूर्वक पकड़ने का भाव देता है। ‘जकड़ लेना’ शत्रुतापूर्ण और आकस्मिक क्रिया को साधारण ‘पकड़ना’ से अधिक स्पष्ट करता है।
- source_word: אִישׁ
  choice: हर पुरुष
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक अर्थ में है। ‘हर पुरुष’ स्रोत के व्याकरणिक रूप और युद्ध-संदर्भ को बनाए रखता है।
- source_word: רֵעֵהוּ
  choice: अपने साथी
  rationale: इस प्रसंग में शब्द उसी समूह के दूसरे सदस्य या सहयोद्धा की ओर संकेत करता है; ‘साथी’ हिन्दी में ‘पड़ोसी’ की अपेक्षा प्रसंगानुकूल है।
- source_word: וְעָלְתָה יָדוֹ עַל יַד רֵעֵהוּ
  choice: उसका हाथ उसके साथी के हाथ के विरुद्ध उठेगा
  rationale: मूल पाठ दोनों ओर ‘हाथ’ दोहराकर परस्पर शारीरिक आक्रमण का सजीव चित्र देता है। अनुवाद इस असामान्य लेकिन अर्थपूर्ण बिंब को सरल व्याख्या में नहीं बदलता।
theological_decisions:
- issue: ईश्वर की ओर से उत्पन्न अव्यवस्था का स्वरूप
  choice: घबराहट यहोवा की ओर से आती है और विरोधी समूह के भीतर परस्पर संघर्ष उत्पन्न करती है।
  alternative: वाक्यांश को अधिक सामान्य रूप से यहोवा के हस्तक्षेप से जुड़ी ‘उलझन’ या ‘खलबली’ माना जा सकता है।
  rationale: מְהוּמַת יְהוָה स्वाभाविक रूप से यहोवा द्वारा भेजी गई घबराहट बताता है। अगली पंक्ति का परस्पर आक्रमण इस न्याय के आंतरिक अराजकता के रूप की पुष्टि करता है, पर अनुवाद उसके कारण या कार्य-विधि के विषय में पाठ से आगे नहीं जाता।
- issue: वितरणात्मक पुल्लिंग भाषा
  choice: हर पुरुष
  alternative: हर व्यक्ति; हर कोई
  rationale: मूल में אִישׁ पुल्लिंग एकवचन में वितरणात्मक रूप से प्रयुक्त है। युद्ध-संदर्भ में ‘हर पुरुष’ स्रोत के रूप को स्पष्ट रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पहले वाक्य में स्वाभाविक हिन्दी प्रवाह के लिए ‘फैलेगी’ का प्रयोग किया गया है; दूसरे वाक्य में मूल की ठोस ‘हाथ’ वाली छवि और उसकी जानबूझकर की गई पुनरावृत्ति सुरक्षित है।
