base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/010.yaml
  text: All the land will be turned into a plain[a], from Geba to Rimmon south of Jerusalem. But Jerusalem will be raised up and will remain in its place, from the Benjamin Gate to the place of the First Gate, to the Corner Gate, and from the Tower of Hananel to the king’s winepresses.
translation:
  language: hi
  text: सारा देश मैदान जैसा हो जाएगा[a]—गेबा से लेकर यरूशलेम के दक्षिण में स्थित रिम्मोन तक। पर यरूशलेम ऊँचा उठाया जाएगा और अपने स्थान पर बसी रहेगी—बिन्यामीन फाटक से लेकर पहले फाटक के स्थान और कोने के फाटक तक, और हननेल की मीनार से लेकर राजा के दाखरस-कुण्डों तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अरावा जैसा हो जाएगा।’ इब्रानी शब्द किसी सामान्य समतल मैदान अथवा विशेष रूप से अरावा घाटी/मैदानी क्षेत्र की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסּוֹב כָּל הָאָרֶץ כָּעֲרָבָה
  choice: सारा देश मैदान जैसा हो जाएगा
  rationale: सीमाओं के रूप में गेबा और रिम्मोन का उल्लेख स्थानीय भूभाग की ओर संकेत करता है, इसलिए הָאָרֶץ के लिए ‘देश’ उपयुक्त है। כָּעֲרָבָה में तुलना का כ स्पष्ट रखते हुए ‘मैदान जैसा’ कहा गया है; इससे अरावा नामक विशिष्ट भूक्षेत्र और सामान्य समतल मैदान—दोनों की संभाव्यता बनी रहती है।
- source_word: מִגֶּבַע לְרִמּוֹן נֶגֶב יְרוּשָׁלִָם
  choice: गेबा से लेकर यरूशलेम के दक्षिण में स्थित रिम्मोन तक
  rationale: ‘यरूशलेम के दक्षिण में’ को रिम्मोन से स्पष्ट रूप से जोड़ा गया है, जिससे आधुनिक हिन्दी में भौगोलिक संबंध असंदिग्ध रहता है।
- source_word: וְרָאֲמָה
  choice: ऊँचा उठाया जाएगा
  rationale: आसपास के भूभाग के समतल होने के विपरीत यरूशलेम की ऊँचाई का भाव व्यक्त होता है। कर्मवाच्य रूप परिणामात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: וְיָשְׁבָה תַחְתֶּיהָ
  choice: अपने स्थान पर बसा रहेगा
  rationale: इब्रानी अभिव्यक्ति नगर के अपने निर्धारित स्थान पर स्थिर और आबाद रहने का संकेत देती है। ‘बसा रहेगा’ ישב के निवास-संबंधी भाव को केवल ‘रहेगा’ की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
- source_word: מְקוֹם שַׁעַר הָרִאשׁוֹן
  choice: पहले फाटक के स्थान
  rationale: מְקוֹם से यह सूक्ष्मता बनी रहती है कि बात फाटक के स्थल की है, संभवतः उस समय वहाँ फाटक विद्यमान न रहा हो।
- source_word: שַׁעַר הַפִּנִּים
  choice: कोने के फाटक
  rationale: यह פנה से संबंधित फाटक का वर्णन है; ‘कोने का फाटक’ आधुनिक हिन्दी में स्पष्ट और पारंपरिक अर्थ के अनुकूल है।
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: हननेल के गुम्मट
  rationale: व्यक्तिवाचक नाम को लिप्यंतरित किया गया है और מִגְדָּל के लिए नगर-रक्षा संरचना के संदर्भ में स्वाभाविक हिन्दी ‘गुम्मट’ चुना गया है।
- source_word: יִקְבֵי הַמֶּלֶךְ
  choice: राजा के दाखरस-कुण्डों
  rationale: יֶקֶב दाख दबाने अथवा रस एकत्र करने की संरचना को सूचित करता है। ‘दाखरस-कुण्ड’ सामान्य हिन्दी पाठक के लिए उसका कार्य स्पष्ट करता है और बहुवचन को बनाए रखता है।
theological_decisions:
- issue: भौगोलिक परिवर्तन का विस्तार
  choice: यरूशलेम के आसपास सीमांकित पूरे देश/भूभाग का परिवर्तन
  alternative: समूची पृथ्वी का मैदान जैसा हो जाना
  rationale: गेबा, रिम्मोन और यरूशलेम के नगर-स्थलों से दी गई सीमाएँ क्षेत्रीय अर्थ को प्रमुख बनाती हैं। इसलिए אָרֶץ को ‘देश’ कहा गया है, बिना भविष्यसूचक भू-परिवर्तन की वास्तविकता को कम किए।
- issue: כָּעֲרָבָה का स्वरूप
  choice: तुलना को ‘मैदान जैसा’ के रूप में बनाए रखना
  alternative: परिणाम को निश्चित करके ‘मैदान में बदल जाएगा’ कहना, अथवा इसे केवल विशिष्ट अरावा क्षेत्र मानना
  rationale: इब्रानी כ तुलना व्यक्त करता है और עֲרָבָה सामान्य मैदान/मरु-मैदान या विशिष्ट अरावा दोनों को सूचित कर सकता है। मुख्य पाठ और पादटिप्पणी इस वास्तविक द्विअर्थता को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। स्थान-नामों को प्रचलित हिन्दी बाइबिलीय रूप के निकट लिप्यंतरित किया गया है। समानांतर सीमा-वाक्यों को दीर्घ विराम से व्यवस्थित किया गया है, और पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
