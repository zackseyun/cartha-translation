base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/003.yaml
  text: Then Yahweh will go out and fight against those nations[a], as when he fights in a day of battle.
translation:
  language: hi
  text: तब याहवे निकलकर उन राष्ट्रों के विरुद्ध लड़ेगा, जैसे वह युद्ध के दिन लड़ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा वह युद्ध के दिन लड़ा था।” हिब्रू में तुलना को भूतकाल की किसी लड़ाई के संकेत के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: तब ... निकलकर
  rationale: भविष्यसूचक क्रम में वाव के साथ आया यह रूप पिछले संदर्भ के बाद होने वाली कार्रवाई बताता है। ‘तब’ क्रम को और ‘निकलकर’ बाहर जाकर हस्तक्षेप करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का शीर्षक से प्रतिस्थापन न करके हिन्दी लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: וְנִלְחַם
  choice: लड़ेगा
  rationale: לחם का निफ़अल रूप यहाँ युद्ध में उतरने या लड़ने को व्यक्त करता है। ‘लड़ेगा’ स्पष्ट, स्वाभाविक और भविष्यसूचक संदर्भ के अनुकूल है।
- source_word: בַּגּוֹיִם הָהֵם
  choice: उन राष्ट्रों के विरुद्ध
  rationale: לחם के साथ ב युद्ध के प्रतिपक्ष को सूचित कर सकता है; इसलिए ‘के विरुद्ध’ उपयुक्त है। ‘उन’ से ההם और ‘राष्ट्रों’ से अंतरराष्ट्रीय संदर्भ में גוים सुरक्षित रहता है।
- source_word: כְּיוֹם הִלָּחֲמוֹ
  choice: जैसे वह ... लड़ता है
  rationale: शाब्दिक ‘उसके लड़ने के दिन के समान’ हिन्दी में असहज है। यह रूप तुलना को स्वाभाविक ढंग से व्यक्त करता है, जबकि कालगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּיוֹם קְרָב
  choice: युद्ध के दिन
  rationale: קרב का अर्थ युद्ध या संग्राम है। ‘युद्ध के दिन’ हिब्रू की ‘दिन’ वाली अभिव्यक्ति को बनाए रखते हुए सहज और गरिमापूर्ण हिन्दी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: वचन में स्वयं YHWH युद्ध करने निकलता है। व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय स्रोत के निकट प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ रखा गया है।
- issue: तुलना को सामान्य वर्तमान या पिछले युद्ध के रूप में समझना
  choice: जैसे वह युद्ध के दिन लड़ता है
  alternative: जैसा वह युद्ध के दिन लड़ा था
  rationale: हिब्रू infinitive construct स्वयं स्पष्ट काल निर्धारित नहीं करता। मुख्य पाठ में सामान्य/विशेषतासूचक तुलना रखी गई है और संभव भूतकालीन अर्थ पादटिप्पणी में दिया गया है, ताकि धर्मवैज्ञानिक या ऐतिहासिक पहचान थोपी न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, स्वाभाविक और गरिमापूर्ण शैली। सैन्य भाषा सीधी रखी गई है और हिब्रू की कालगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
