source:
  edition: WLC
  text: וְ֠/הָיָה אֲשֶׁ֨ר לֹֽא יַעֲלֶ֜ה מֵ/אֵ֨ת מִשְׁפְּח֤וֹת הָ/אָ֨רֶץ֙ אֶל יְר֣וּשָׁלִַ֔ם לְ/הִֽשְׁתַּחֲוֺ֔ת לְ/מֶ֖לֶךְ יְהוָ֣ה צְבָא֑וֹת וְ/לֹ֥א עֲלֵי/הֶ֖ם יִהְיֶ֥ה הַ/גָּֽשֶׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/017.yaml
  text: And if any of the families of the earth does not go up to Jerusalem to worship the King[a], Yahweh of Armies[b], there will be no rain on them.
translation:
  language: hi
  text: और यदि पृथ्वी के कुलों में से कोई यरूशलेम को चढ़कर राजा, सेनाओं के याहवे, की आराधना[a] करने न जाए, तो उन पर वर्षा न होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दण्डवत् करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אֲשֶׁר
  choice: और यदि ... कोई
  rationale: यह इब्रानी पदबंध यहाँ शर्त और उसके परिणाम को प्रस्तुत करता है। आधुनिक हिन्दी में ‘और यदि ... कोई’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: לֹא יַעֲלֶה
  choice: चढ़कर ... न जाए
  rationale: עלה यरूशलेम की तीर्थयात्रा और उसकी भौगोलिक ऊँचाई—दोनों के कारण ‘चढ़ने’ का भाव रखता है; ‘चढ़कर ... जाना’ आधुनिक हिन्दी में इस भाव को सुरक्षित रखता है।
- source_word: מֵאֵת מִשְׁפְּחוֹת הָאָרֶץ
  choice: पृथ्वी के कुलों में से
  rationale: מִשְׁפְּחוֹת के लिए ‘कुल’ व्यापक वंशीय या जातीय समूह का स्वाभाविक हिन्दी शब्द है। अध्याय के अंतरराष्ट्रीय संदर्भ में הָאָרֶץ का अर्थ ‘पृथ्वी’ है, केवल इस्राएल की ‘भूमि’ नहीं।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: आराधना करने
  rationale: क्रिया का मूल भाव झुकने या दण्डवत् करने का है, पर इस उपासना-संदर्भ में ‘आराधना करना’ अभिप्रेत कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְמֶלֶךְ יְהוָה צְבָאוֹת
  choice: राजा अर्थात् सेनाओं के याहवे
  rationale: ‘अर्थात्’ राजा और याहवे के बीच समानाधिकरण को स्पष्ट करता है, बिना उन्हें दो अलग व्यक्तियों के रूप में प्रस्तुत किए। צְבָאוֹת का अनुवाद ‘सेनाओं’ किया गया है और दिव्य नाम को ‘याहवे’ रखा गया है।
- source_word: וְלֹא עֲלֵיהֶם יִהְיֶה הַגָּשֶׁם
  choice: तो उन पर वर्षा न होगी
  rationale: यह सहज हिन्दी में शर्त का परिणाम बताता है और עֲלֵיהֶם के बहुवचन ‘उन पर’ को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का निज नाम सीधे आया है। ‘याहवे’ उसके प्रचलित विद्वतापूर्ण उच्चारण को दर्शाता है; परंपरागत हिन्दी रूप पादटिप्पणी में शीर्षक के साथ दिया गया है।
- issue: הָאָרֶץ का दायरा
  choice: पृथ्वी
  alternative: भूमि
  rationale: जकर्याह 14 में राष्ट्रों और पृथ्वी के कुलों का व्यापक संदर्भ है, इसलिए यहाँ ‘पृथ्वी’ सार्वभौमिक दायरे को अधिक उपयुक्त रूप से व्यक्त करता है।
- issue: מֶלֶךְ और יְהוָה צְבָאוֹת का संबंध
  choice: राजा अर्थात् सेनाओं के याहवे
  alternative: राजा, सेनाओं के याहवे
  rationale: इब्रानी में दोनों पद समानाधिकरण में हैं। हिन्दी में ‘अर्थात्’ इस संबंध को स्पष्ट करता है और यह अस्पष्टता टालता है कि दो अलग-अलग व्यक्तियों की बात हो रही है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘कुल’ व्यापक पारिवारिक/वंशीय समूह के लिए चुना गया है; ‘चढ़कर ... जाना’ यरूशलेम की तीर्थयात्रा का पारंपरिक दिशात्मक भाव बनाए रखता है।
