source:
  edition: WLC
  text: וְ/זֹ֣את תִּֽהְיֶ֣ה הַ/מַּגֵּפָ֗ה אֲשֶׁ֨ר יִגֹּ֤ף יְהוָה֙ אֶת כָּל הָ֣/עַמִּ֔ים אֲשֶׁ֥ר צָבְא֖וּ עַל יְרוּשָׁלִָ֑ם הָמֵ֣ק בְּשָׂר֗/וֹ וְ/הוּא֙ עֹמֵ֣ד עַל רַגְלָ֔י/ו וְ/עֵינָי/ו֙ תִּמַּ֣קְנָה בְ/חֹֽרֵי/הֶ֔ן וּ/לְשׁוֹנ֖/וֹ תִּמַּ֥ק בְּ/פִי/הֶֽם׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/012.yaml
  text: 'And this will be the plague with which Yahweh will strike all the peoples that wage war against Jerusalem: while he is standing on his feet[a], his flesh will rot away, his eyes will rot away in their sockets, and his tongue will rot away in his mouth.'
translation:
  language: hi
  text: 'और यह वह विपत्ति होगी जिसके द्वारा यहोवा उन सभी जातियों[a] पर प्रहार करेगा जिन्होंने यरूशलेम के विरुद्ध युद्ध किया है: उनमें से हर एक का मांस उसके अपने पैरों पर खड़े रहते गल जाएगा; उसकी आँखें अपने कोटरों में गल जाएँगी, और उसकी जीभ उसके मुँह में[b] गल जाएगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभी राष्ट्रों’। इब्रानी शब्द अनेक लोगों के समूहों या राष्ट्रों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी व्यंजन-पाठ में शाब्दिक रूप से ‘उनके मुँह में’ है; प्रसंग में यह प्रत्येक व्यक्ति के लिए वितरणात्मक अर्थ में ‘उसके मुँह में’ समझा जाता है।
    reason: textual_grammatical_note
lexical_decisions:
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: यह शब्द दैवी प्रहार या विपत्ति को सूचित कर सकता है। यहाँ ‘महामारी’ स्वाभाविक हिंदी है, पर रोग की किसी निश्चित प्राकृतिक प्रक्रिया का निर्णय नहीं करती।
- source_word: יִגֹּף
  choice: मारेगा
  rationale: נגף का मूल अर्थ प्रहार करना या विपत्ति से मारना है। ‘मारेगा’ संक्षिप्त और स्वाभाविक है तथा संज्ञा ‘महामारी’ की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: כָּל־הָעַמִּים
  choice: उन सब जातियों
  rationale: עַמִּים अनेक जनसमुदायों या राष्ट्रों को दर्शाता है। ‘जातियाँ’ बाइबिलीय संदर्भ में समझ में आने वाला बहुवचन है; ‘राष्ट्र’ भी संभव है।
- source_word: צָבְאוּ עַל
  choice: जो ... के विरुद्ध युद्ध करेंगी
  rationale: क्रिया सैन्य रूप से चढ़ आने या युद्ध करने का भाव रखती है। यह चयन केवल इकट्ठा होने से अधिक स्पष्ट सैन्य अर्थ देता है।
- source_word: הָמֵק / תִּמַּקְנָה / תִּמַּק
  choice: गल जाएगा / गल जाएँगी / गल जाएगी
  rationale: מקק शारीरिक क्षय या गलने का अत्यंत सजीव चित्र देता है। एक ही हिंदी धातु की पुनरावृत्ति मूल की कठोर लय और चित्रात्मकता बनाए रखती है।
- source_word: בְּשָׂרוֹ
  choice: उसका मांस
  rationale: ‘मांस’ ठोस शारीरिक बिंब को ‘शरीर’ की अपेक्षा अधिक सीधे सुरक्षित रखता है।
- source_word: וְהוּא עֹמֵד עַל־רַגְלָיו
  choice: जब कोई अपने पैरों पर खड़ा ही होगा
  rationale: सामान्यवाची एकवचन को हिंदी में ‘कोई’ से स्वाभाविक बनाया गया है। ‘ही’ यह चौंकाने वाला भाव रखता है कि क्षय व्यक्ति के अभी खड़े रहते घटता है।
- source_word: בְחֹרֵיהֶן
  choice: अपने कोटरों में
  rationale: यह आँखों की शारीरिक गुहाओं का उल्लेख है; ‘कोटर’ सटीक और बोधगम्य हिंदी शब्द है।
- source_word: בְּפִיהֶם
  choice: उसके मुँह में
  rationale: मसोरेटिक व्यंजन-पाठ में बहुवचन प्रत्यय है, जबकि वाक्य का व्यक्ति-वाचक क्रम एकवचन है। मुख्य पाठ वितरणात्मक एकवचन अर्थ देता है और पाठगत रूप को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिंदी बाइबिलीय प्रयोग में ‘यहोवा’ अधिक परिचित है, जबकि ‘याहवे’ संभावित विद्वत्तापरक लिप्यंतरण है।
- issue: न्याय के दृश्य की प्रकृति
  choice: शारीरिक गलने के सजीव वर्णन को यथावत रखना
  alternative: इसे केवल रूपकात्मक पराजय या किसी विशिष्ट रोग के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ मांस, आँखों और जीभ के गलने का कठोर चित्र देता है, पर उसके प्राकृतिक, चमत्कारी या सैन्य कारण को निर्दिष्ट नहीं करता। अनुवाद इस तनाव को खुला रखता है।
- issue: एकवचन व्यक्ति और सामूहिक जातियों का संबंध
  choice: ‘कोई ... उसका’ द्वारा वितरणात्मक एकवचन
  alternative: बहुवचन ‘वे ... उनका’
  rationale: मूल में ‘सब जातियों’ के बाद शरीर के अंगों का वर्णन पुल्लिंग एकवचन में है। हिंदी में ‘कोई ... उसका’ प्रत्येक प्रभावित व्यक्ति पर लागू होने वाला अर्थ स्पष्ट करता है, बिना सामूहिक संदर्भ मिटाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी। मूल की कठोर शारीरिक चित्रात्मकता को नरम नहीं किया गया। ‘जातियाँ’ के लिए ‘राष्ट्र’ भी संभव है, पर अनावश्यक पादटिप्पणी से बचते हुए मुख्य पाठ में पारंपरिक और व्यापक बाइबिलीय शब्द रखा गया है।
