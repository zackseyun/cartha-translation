  yaml_path: translation/ot/zechariah/014/001.yaml
  text: Behold[a], a day is coming for Yahweh, when your plunder will be divided in your midst.
translation:
  language: hi
  text: देखो[a], यहोवा के लिए एक दिन आ रहा है, जब तेरी लूट तेरे बीच बाँटी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक पारंपरिक रूप में, “यहोवा का दिन आ रहा है।” इब्रानी का शाब्दिक अर्थ है, “यहोवा के लिए एक दिन आ रहा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह गंभीर भविष्यवाणी की ओर ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके बल को बनाए रखता है।
- source_word: יוֹם בָּא
  choice: एक दिन आ रहा है
  rationale: अनिश्चित ‘एक दिन’ और भविष्यसूचक अर्थ वाले कृदन्त ‘आ रहा है’ को सहज हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग के ‘के लिए/से संबंधित’ अर्थ को सीधे बनाए रखता है और इसे चुपचाप पारंपरिक ‘यहोवा का दिन’ में नहीं बदलता।
- source_word: וְחֻלַּק
  choice: बाँटी जाएगी
  rationale: पुअल रूप के कर्मवाच्य और भविष्यसूचक भाव, दोनों को स्पष्ट रखता है।
- source_word: שְׁלָלֵךְ
  choice: तेरी लूट
  rationale: युद्ध में लूटे गए माल का अर्थ रखता है। स्त्रीलिंग एकवचन संबोधन यरूशलेम की ओर है; ‘तेरी’ उस प्रत्यक्ष संबोधन को बनाए रखता है।
- source_word: בְּקִרְבֵּךְ
  choice: तेरे ही बीच
  rationale: नगर के भीतर ही लूट बाँटे जाने की स्थान-संबंधी और जोरदार विडंबना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: भविष्यसूचक ‘दिन’ के साथ לַיהוָה का संबंध
  choice: यहोवा के लिए एक दिन
  alternative: यहोवा का एक दिन
  rationale: इब्रानी में सामान्य संबंधवाचक रचना के बजाय ל उपसर्ग है। मुख्य पाठ उसका असामान्य ‘के लिए’ संबंध सुरक्षित रखता है, जबकि पारंपरिक और वैचारिक रूप से संबद्ध पाठ फुटनोट में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यवाणी के अनुरूप गरिमापूर्ण रखी गई है। यरूशलेम को संबोधित अनौपचारिक एकवचन ‘तेरी/तेरे’ मूल के स्त्रीलिंग एकवचन संबोधन को यथासंभव दर्शाता है; हिन्दी में संबोधित व्यक्ति का व्याकरणिक स्त्रीलिंग अलग से चिह्नित नहीं होता।
