  register: भाषा आधुनिक मानक हिन्दी में सीधी, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। हिंसा का वर्णन बिना सनसनी और बिना शिष्टोक्तिपूर्ण नरमी के किया गया है। ‘नगर से काटे नहीं जाएँगे’ कुछ औपचारिक है, पर मूल की अर्थगत अस्पष्टता बचाने के लिए जानबूझकर रखा गया है।
