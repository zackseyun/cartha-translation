base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/002.yaml
  text: And I will gather all the nations against Jerusalem for battle[a], and the city will be captured, and the houses plundered, and the women raped, and half of the city will go out into exile[b]; but the rest of the people will not be cut off from the city.
translation:
  language: hi
  text: और मैं सब राष्ट्रों को यरूशलेम के विरुद्ध युद्ध के लिए इकट्ठा करूँगा। नगर पर अधिकार कर लिया जाएगा, घर लूटे जाएँगे और स्त्रियों के साथ बलात्कार किया जाएगा[a]। नगर के आधे लोग निर्वासन में चले जाएँगे, पर शेष लोग नगर से अलग नहीं किए जाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का लिखित शब्द कठोर है और यौन हिंसा को दर्शाता है। मसोराई पढ़ने की परंपरा में इसके स्थान पर एक अपेक्षाकृत शिष्ट शब्द पढ़ा जाता है, जिसका शाब्दिक भाव है, ‘उनके साथ शयन किया जाएगा।’
    reason: textual_and_lexical_alternative
  - marker: b
    text: या, “पर शेष लोग नगर से काटे नहीं जाएँगे”; अथवा अधिक प्रबल अर्थ में, “पर शेष लोग नष्ट नहीं किए जाएँगे।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָסַפְתִּי
  choice: और मैं ... इकट्ठा करूँगा
  rationale: भविष्यसूचक कथन में वाव-संयुक्त पूर्ण क्रिया को दैवी वक्ता के भावी कार्य के रूप में व्यक्त किया गया है; इससे परमेश्वर की सक्रिय भूमिका बनी रहती है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: सैन्य और अंतरराष्ट्रीय प्रसंग में גּוֹיִם के लिए ‘राष्ट्र’ स्वाभाविक और सटीक है।
- source_word: אֶל יְרוּשָׁלִַם לַמִּלְחָמָה
  choice: यरूशलेम के विरुद्ध युद्ध के लिए
  rationale: אֶל का मूल भाव ‘की ओर’ है, पर शत्रुतापूर्ण सैन्य प्रसंग में हिन्दी में ‘के विरुद्ध’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְנִלְכְּדָה הָעִיר
  choice: नगर पर अधिकार कर लिया जाएगा
  rationale: לכד का निफ़ाल युद्ध में नगर के पकड़े या जीत लिए जाने को दर्शाता है; यह हिन्दी प्रयोग स्वाभाविक है।
- source_word: וְנָשַׁסּוּ הַבָּתִּים
  choice: घर लूटे जाएँगे
  rationale: क्रिया युद्धकालीन लूट-पाट को दर्शाती है; ‘लूटे जाएँगे’ सामान्य पाठक के लिए सीधा और गरिमापूर्ण है।
- source_word: וְהַנָּשִׁים תשגלנה
  choice: स्त्रियों का बलात्कार किया जाएगा
  rationale: लिखित इब्रानी शब्द कठोर और स्पष्ट रूप से युद्धकालीन यौन हिंसा का द्योतक है। ‘बलात्कार’ अत्याचार को किसी शिष्टोक्ति से हल्का नहीं करता।
- source_word: וְיָצָא חֲצִי הָעִיר בַּגּוֹלָה
  choice: नगर का आधा भाग निर्वासन में चला जाएगा
  rationale: मूल पाठ की ‘आधा नगर’ वाली सामूहिक और लाक्षणिक अभिव्यक्ति को बनाए रखते हुए בַּגּוֹלָה को ‘निर्वासन में’ कहा गया है।
- source_word: וְיֶתֶר הָעָם
  choice: पर शेष लोग
  rationale: יֶתֶר का सामान्य अर्थ बचा हुआ हिस्सा है। ‘शेष लोग’ स्वाभाविक है और ‘अवशेष’ से जुड़ी अतिरिक्त धर्मवैज्ञानिक ध्वनि नहीं जोड़ता।
- source_word: לֹא יִכָּרֵת מִן הָעִיר
  choice: नगर से काटे नहीं जाएँगे
  rationale: यह मूल ‘काटे जाने’ की छवि और हटाए जाने अथवा नष्ट किए जाने के बीच की अर्थगत अस्पष्टता को यथासंभव बनाए रखता है।
theological_decisions:
- issue: युद्धकालीन यौन हिंसा का अनुवाद
  choice: स्त्रियों का बलात्कार किया जाएगा
  alternative: स्त्रियों के साथ ज़बरदस्ती की जाएगी / स्त्रियों को भ्रष्ट किया जाएगा
  rationale: मूल लिखित इब्रानी शब्द की कठोरता को स्पष्ट रूप से व्यक्त करना अत्याचार को कम करके दिखाने से बचाता है; पाठ कोई नरम शिष्टोक्ति नहीं माँगता।
- issue: לֹא יִכָּרֵת מִן הָעִיר का आशय
  choice: शेष लोग नगर से काटे नहीं जाएँगे
  alternative: शेष लोग नगर से निकाले नहीं जाएँगे / शेष लोग नष्ट नहीं किए जाएँगे
  rationale: निफ़ाल क्रिया यहाँ हटाए जाने और नष्ट किए जाने—दोनों का भाव दे सकती है। मुख्य पाठ औपचारिक छवि को रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
