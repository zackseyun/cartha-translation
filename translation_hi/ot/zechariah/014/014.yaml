source:
  edition: WLC
  text: וְ/גַ֨ם יְהוּדָ֔ה תִּלָּחֵ֖ם בִּ/ירֽוּשָׁלִָ֑ם וְ/אֻסַּף֩ חֵ֨יל כָּל הַ/גּוֹיִ֜ם סָבִ֗יב זָהָ֥ב וָ/כֶ֛סֶף וּ/בְגָדִ֖ים לָ/רֹ֥ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/014.yaml
  text: 'And Judah also will fight at Jerusalem[a], and the wealth of all the surrounding nations will be gathered: gold and silver and garments, in very great abundance.'
translation:
  language: hi
  text: और यहूदा भी यरूशलेम में[a] युद्ध करेगा, और चारों ओर की सब जातियों की धन-संपत्ति इकट्ठी की जाएगी—सोना, चाँदी और वस्त्र बहुत ही बड़ी मात्रा में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के विरुद्ध।” इब्रानी पूर्वसर्ग का सामान्य अर्थ “में” है, पर आस-पास के प्रसंग के कारण कुछ लोग यहाँ विरोध का भाव समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: यह संयोजन पूर्ववर्ती कथन को आगे बढ़ाते हुए समावेश और बल दोनों व्यक्त करता है; आधुनिक हिन्दी में ‘और ... भी’ स्वाभाविक है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: यह लोगों अथवा क्षेत्र का व्यक्तिवाचक नाम है; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: תִּלָּחֵם
  choice: युद्ध करेगा
  rationale: लड़ाई में सम्मिलित होने का अर्थ व्यक्त करता है। ‘युद्ध करेगा’ गरिमापूर्ण और स्पष्ट है तथा युद्ध के ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: पूर्वसर्ग ב का सामान्य और सीधा अर्थ स्थानसूचक ‘में’ है। प्रसंग के आधार पर ‘यरूशलेम के विरुद्ध’ समझना भी संभव माना गया है, इसलिए उस विकल्प को पादटिप्पणी में रखा गया है।
- source_word: וְאֻסַּף
  choice: इकट्ठी की जाएगी
  rationale: रूप कर्मवाच्य है और भविष्यसूचक क्रम में भविष्य का भाव देता है; स्त्रीलिंग क्रिया ‘धन-संपत्ति’ के साथ स्वाभाविक हिन्दी बनाती है।
- source_word: חֵיל
  choice: धन-संपत्ति
  rationale: इस शब्द के अर्थों में सामर्थ्य, सेना और संपत्ति आते हैं, पर आगे सोना, चाँदी और वस्त्र गिनाए जाने से यहाँ भौतिक संपदा अभिप्रेत है।
- source_word: כָּל הַגּוֹיִם סָבִיב
  choice: चारों ओर की सब जातियों की
  rationale: यह निकटवर्ती अथवा चारों ओर स्थित राष्ट्र-समुदायों को सूचित करता है। ‘जातियाँ’ हिन्दी बाइबलीय प्रयोग में גּוֹיִם का परिचित और व्यापक समतुल्य है।
- source_word: זָהָב וָכֶסֶף וּבְגָדִים
  choice: सोना, चाँदी और वस्त्र
  rationale: मूल की बहुमूल्य वस्तुओं की सूची को सीधे और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: לָרֹב מְאֹד
  choice: बहुत ही बड़ी मात्रा में
  rationale: यह पद अत्यधिक परिमाण पर बल देता है; चुनी हुई अभिव्यक्ति רֹב और מְאֹד दोनों की तीव्रता स्पष्ट करती है।
theological_decisions:
- issue: क्या בִּירוּשָׁלִָם का अर्थ यहूदा का यरूशलेम में युद्ध करना है या यरूशलेम के विरुद्ध युद्ध करना
  choice: यहूदा भी यरूशलेम में युद्ध करेगा
  alternative: यहूदा भी यरूशलेम के विरुद्ध युद्ध करेगा
  rationale: ב का सबसे स्वाभाविक अर्थ यहाँ स्थानसूचक ‘में’ है। फिर भी अध्याय के व्यापक प्रसंग के कारण कुछ लोग विरोध का अर्थ ग्रहण करते हैं। वास्तविक व्याख्यात्मक तनाव को बनाए रखने के लिए मुख्य पाठ में सीधा स्थानसूचक अर्थ और पादटिप्पणी में वैकल्पिक अर्थ दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘जातियों’, ‘वस्त्र’ और ‘युद्ध करेगा’ जैसे शब्द बाइबलीय गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
