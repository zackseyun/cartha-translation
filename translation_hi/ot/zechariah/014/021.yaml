source:
  edition: WLC
  text: וְ֠/הָיָה כָּל סִ֨יר בִּ/ירוּשָׁלִַ֜ם וּ/בִֽ/יהוּדָ֗ה קֹ֚דֶשׁ לַ/יהוָ֣ה צְבָא֔וֹת וּ/בָ֨אוּ֙ כָּל הַ/זֹּ֣בְחִ֔ים וְ/לָקְח֥וּ מֵ/הֶ֖ם וּ/בִשְּׁל֣וּ בָ/הֶ֑ם וְ/לֹא יִהְיֶ֨ה כְנַעֲנִ֥י ע֛וֹד בְּ/בֵית יְהוָ֥ה צְבָא֖וֹת בַּ/יּ֥וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/021.yaml
  text: And every pot in Jerusalem and in Judah will be holy to Yahweh of hosts[a], and all who sacrifice will come and take from them and boil in them. And there will no longer be a Canaanite in the house of Yahweh of hosts on that day.
translation:
  language: hi
  text: और यरूशलेम और यहूदा में हर हाँडी सेनाओं के यहोवा के लिए पवित्र होगी। बलिदान चढ़ाने वाले सभी लोग आएँगे, उनमें से हाँडियाँ लेंगे और उन्हीं में पकाएँगे। उस दिन सेनाओं के यहोवा के भवन में फिर कोई कनानी[a] नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यापारी” अथवा “सौदागर”; कुछ प्रसंगों में इस इब्रानी शब्द का यह अर्थ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: סִיר
  choice: हाँडी
  rationale: यह पकाने या उबालने के पात्र को दर्शाता है। ‘हाँडी’ साधारण आधुनिक हिन्दी में स्वाभाविक है और आगे आने वाली पकाने की क्रिया से मेल खाता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यह पात्रों को यहोवा के लिए अलग ठहराए जाने का उपासना-संबंधी भाव बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम और צְבָאוֹת के पारंपरिक भविष्यद्वक्ताई शीर्षक, दोनों को स्पष्ट रूप से बनाए रखता है; वाक्य में विभक्ति के अनुसार ‘सेनाओं के यहोवा’ रूप आया है।
- source_word: הַזֹּבְחִים
  choice: बलि चढ़ानेवाले सभी लोग
  rationale: कृदंत का आशय बलिदान करने वाले उपासकों से है; यह हिन्दी में स्वाभाविक और स्पष्ट रूप है।
- source_word: מֵהֶם
  choice: उनमें से हाँडियाँ
  rationale: सर्वनाम का पूर्वपद हाँडियाँ हैं। हिन्दी में संदर्भ स्पष्ट रखने के लिए संज्ञा दोहराई गई है, बिना अर्थ में कुछ जोड़े।
- source_word: וּבִשְּׁלוּ בָהֶם
  choice: और उन्हीं में पकाएँगे
  rationale: क्रिया उबालने या पकाने को व्यक्त कर सकती है। ‘पकाएँगे’ सहज हिन्दी है और मूल की तरह कर्म को अनकहा छोड़ती है।
- source_word: כְנַעֲנִי
  choice: कनानी
  rationale: शब्द का सामान्य अर्थ ‘कनानी’ है। सम्भव व्यावसायिक अर्थ को मुख्य पाठ में निर्णीत करने के बजाय पादटिप्पणी में रखा गया है।
- source_word: בְּבֵית יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा के भवन में
  rationale: ‘भवन’ בית के मूल रूपक को बनाए रखते हुए यहाँ मन्दिर-संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वक्ताओं में प्रयुक्त समय-सूचक सूत्र का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अन्तिम वाक्यांश में כְנַעֲנִי का अर्थ
  choice: मुख्य पाठ में ‘कनानी’
  alternative: व्यापारी या सौदागर
  rationale: इब्रानी शब्द सामान्यतः जातीय ‘कनानी’ को दर्शाता है, पर कुछ प्रसंगों में ‘व्यापारी’ भी हो सकता है। मुख्य पाठ शाब्दिक और धर्मवैधानिक प्रतिध्वनि बनाए रखता है, जबकि वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए हल्का पुनर्गठित है; मूल पाठ की पुनरावृत्ति, सार्वभौमिकता (‘हर’, ‘सभी’) और अन्तिम पद की अर्थगत अनिश्चितता सुरक्षित रखी गई है।
