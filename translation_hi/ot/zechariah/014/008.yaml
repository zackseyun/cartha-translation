  alternative: केवल ‘बहता जल’ या ‘ताजा जल’ कहना
  rationale: मूल अभिव्यक्ति सामान्यतः बहते या जीवनदायी जल को दर्शाती है, पर भविष्यसूचक प्रसंग में व्यापक धर्मवैचारिक अनुनाद भी हो सकता है; अनुवाद किसी एक अर्थ को अंतिम रूप से आरोपित नहीं करता।
