  text: And on that day living waters will flow out from Jerusalem[a], half of them to the eastern sea and half of them to the western sea[c][b]; it will be so in summer as well as in winter.
translation:
  language: hi
  text: उस दिन यरूशलेम से जीवित जल[a] बहेगा; उसका आधा भाग पूर्वी समुद्र[b] की ओर और आधा भाग पश्चिमी समुद्र[c] की ओर बहेगा। वह गर्मी और सर्दी, दोनों में बहता रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहता जल’ अथवा ‘ताज़ा जल’; इब्रानी में शाब्दिक रूप से ‘जीवित जल’ है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यरूशलेम के पूर्व का समुद्र, जिसे परंपरागत रूप से मृत सागर माना जाता है।
    reason: cultural_note
  - marker: c
    text: अर्थात यरूशलेम के पश्चिम का समुद्र, जिसे परंपरागत रूप से भूमध्य सागर माना जाता है।
    reason: cultural_note
