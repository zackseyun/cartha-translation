base_translation:
  language: en
  yaml_path: translation/ot/zechariah/014/006.yaml
  text: 'And it will happen on that day: there will be no light[a]; the glorious ones will congeal.'
translation:
  language: hi
  text: 'उस दिन ऐसा होगा: उजाला नहीं होगा[a]; तेजस्वी वस्तुएँ जम जाएँगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, एक दूसरी पारंपरिक व्याख्या के अनुसार: “न उजाला होगा, न ठंड, न पाला।” अंतिम वाक्यांश का इब्रानी पाठ कठिन है और उसे कई प्रकार से समझा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: भविष्य की घटना बताने वाले सामान्य नबूवत-सूत्र को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: नबूवत में प्रयुक्त इस निश्चित काल-सूचक अभिव्यक्ति का सीधा और प्रचलित हिन्दी रूप।
- source_word: לֹא יִהְיֶה אוֹר
  choice: उजाला नहीं होगा
  rationale: नकारात्मक अस्तित्ववाचक वाक्य का स्पष्ट और स्वाभाविक अनुवाद; यहाँ אוֹר के मूल अर्थ को बनाए रखता है।
- source_word: יְקָרוֹת
  choice: तेजस्वी पिंड
  rationale: יְקָרוֹת का अर्थ बहुमूल्य, भव्य या तेजस्वी हो सकता है। संदर्भ में यह संभवतः आकाशीय प्रकाश-पिंडों की ओर संकेत करता है; ‘पिंड’ जोड़ना हिन्दी में संज्ञार्थ स्पष्ट करता है, पर पहचान को अधिक विशिष्ट नहीं बनाता।
- source_word: יקפאון
  choice: जम जाएँगे
  rationale: मसोरेटिक पाठ के जमने या ठोस होने से जुड़े ठोस बिंब को सहज हिन्दी में सुरक्षित रखता है, जबकि ‘मंद पड़ेंगे’ जैसे व्याख्यात्मक अर्थ से बचता है।
theological_decisions:
- issue: कठिन अंतिम वाक्यांश יְקָרוֹת יקפאון की व्याख्या
  choice: मसोरेटिक व्यंजन-पाठ के निकट रहते हुए इसे तेजस्वी आकाशीय पिंडों के जम जाने के रूप में प्रस्तुत किया गया है।
  alternative: “न उजाला होगा, न ठंड, न पाला,” अथवा “प्रकाश मंद पड़ जाएँगे।”
  rationale: इब्रानी वाक्यांश पाठगत, रूपगत और अर्थगत दृष्टि से अत्यंत कठिन है। मुख्य पाठ मसोरेटिक शब्दों के ठोस बिंब को बनाए रखता है और प्राचीन अनुवादों तथा दूसरी पारंपरिक व्याख्या को पादटिप्पणी में देता है, ताकि अनिश्चितता को किसी एक धर्मवैज्ञानिक निष्कर्ष से न ढका जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण नबूवतीय शैली। ‘उजाला’ साधारण पाठक के लिए स्वाभाविक है। कठिन अंतिम उपवाक्य को जानबूझकर कुछ असामान्य रखा गया है, क्योंकि स्रोत-पाठ स्वयं अस्पष्ट है; पादटिप्पणी प्रमुख वैकल्पिक व्याख्या सुरक्षित रखती है।
