id: ZEC.9.15
reference: Zechariah 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֣ה צְבָאוֹת֮ יָגֵ֣ן עֲלֵי/הֶם֒ וְ/אָכְל֗וּ וְ/כָֽבְשׁוּ֙ אַבְנֵי קֶ֔לַע וְ/שָׁת֥וּ הָמ֖וּ כְּמוֹ יָ֑יִן וּ/מָֽלְאוּ֙ כַּ/מִּזְרָ֔ק כְּ/זָוִיּ֖וֹת מִזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/015.yaml
  text: The LORD of Armies will shield them, and they will devour and trample the sling stones; they will drink and roar as if with wine, and they will be filled like a bowl, like the corners of the altar.
translation:
  language: hi
  text: सेनाओं का यहोवा उनकी रक्षा करेगा। वे गोफन के पत्थरों को निगल जाएँगे और रौंद डालेंगे। वे पीएँगे और दाखमधु पिए हुओं के समान गरजेंगे। वे कटोरे के समान, वेदी के कोनों के समान भर जाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: ईश्वरीय नाम और צְבָאוֹת के सैन्य/स्वर्गीय समूहों से जुड़े अर्थ को स्पष्ट और पारंपरिक हिन्दी रूप में सुरक्षित रखा गया है।
- source_word: יָגֵן עֲלֵיהֶם
  choice: उनकी रक्षा करेगा
  rationale: क्रिया מגן यहाँ ढाल बनकर बचाने या सुरक्षा देने का भाव रखती है; स्वाभाविक हिन्दी में ‘रक्षा करेगा’ उपयुक्त है।
- source_word: וְאָכְלוּ
  choice: वे ... निगल जाएँगे
  rationale: मूल क्रिया का सीधा अर्थ ‘खाना’ है, पर युद्ध-विजय के इस बिंब में ‘निगल जाना’ उसकी तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְכָבְשׁוּ אַבְנֵי קֶלַע
  choice: गोफन के पत्थरों को ... रौंद डालेंगे
  rationale: כָּבַשׁ का अर्थ दबाना, वश में करना या रौंदना हो सकता है। निकटवर्ती युद्ध-बिंब के कारण ‘रौंद डालेंगे’ चुना गया, जबकि ‘गोफन के पत्थर’ की वास्तविक अस्पष्टता कायम रखी गई है।
- source_word: וְשָׁתוּ הָמוּ כְּמוֹ יָיִן
  choice: वे पीएँगे और दाखमधु पिए हुओं के समान गरजेंगे
  rationale: המה का कोलाहल/गरजना-संबंधी अर्थ लिया गया है। तुलना का आशय नशे जैसी प्रचंड दशा है, इसलिए हिन्दी में तुलना के निहित मानवीय संदर्भ को स्पष्ट किया गया है।
- source_word: כַּמִּזְרָק
  choice: कटोरे के समान
  rationale: מִזְרָק वेदी की उपासना में प्रयुक्त रक्त ग्रहण या छिड़काव का पात्र है; मुख्य पाठ में पठनीय ‘कटोरा’ रखा गया है।
- source_word: כְּזָוִיּוֹת מִזְבֵּחַ
  choice: वेदी के कोनों के समान
  rationale: शाब्दिक चित्र सुरक्षित रखा गया है; बलिदान का रक्त वेदी के भागों पर पड़ने से भरने/भीगने का आशय संदर्भ में निहित रहता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम उपस्थित है। ‘यहोवा’ उसे सामान्य उपाधि में बदलने से बचाता है और हिन्दी पाठकों के लिए पहचाना हुआ रूप है।
- issue: हिंसक और बलिदानी बिंब
  choice: निगलने, रौंदने, कटोरे और वेदी के कोनों के बिंब यथावत रखे गए
  alternative: विजय और उत्सव के सामान्यीकृत शब्द
  rationale: पद की काव्यात्मक तीव्रता और रक्त/बलिदान से संबंधित संभावित संकेत को किसी विशिष्ट धर्मवैज्ञानिक व्याख्या में सीमित किए बिना सुरक्षित रखना आवश्यक है।
- issue: ‘गोफन के पत्थरों’ की भूमिका
  choice: उन्हें क्रियाओं का कर्म रखा गया
  alternative: उन्हें इस्राएली योद्धाओं या हथियारों के रूपक के रूप में स्पष्ट करना
  rationale: हिब्रू व्याकरण उन्हें कर्म के रूप में पढ़ने देता है, पर उनका सटीक सांकेतिक आशय विवादित है; अनुवाद ने इस तनाव को नहीं सुलझाया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और काव्यात्मक युद्ध-भाषा रखी गई है। छोटे वाक्यों से जटिल हिब्रू समन्वय को पठनीय बनाया गया, पर मूल के क्रमिक बिंबों और पुनरावृत्त ‘वे’ को बनाए रखा गया है।
