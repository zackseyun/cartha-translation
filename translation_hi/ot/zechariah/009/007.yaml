  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’, ‘कुल-प्रधान’ और ‘यबूसी’ मूल की भविष्यसूचक तथा ऐतिहासिक छवि को बनाए रखते हैं। वाक्य का प्रतिनिधिक एकवचन और उसके धार्मिक अथवा सामुदायिक समावेशन की सीमा जानबूझकर खुली रखी गई है।
