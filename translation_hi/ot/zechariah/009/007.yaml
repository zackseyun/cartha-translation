base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/007.yaml
  text: I will remove his blood from his mouth and his detestable things from between his teeth[a]. Then he too will be a remnant for our God; he will be like a clan leader in Judah[c][b], and Ekron will be like the Jebusite.
translation:
  language: hi
  text: मैं उसके मुँह से लहू और उसके दाँतों के बीच से उसकी घिनौनी वस्तुएँ[a] निकाल दूँगा। तब वह भी हमारे परमेश्वर का होकर बचा रहेगा;[b] वह यहूदा में एक कुल-प्रधान के समान होगा, और एक्रोन यबूसी के समान होगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “घिनौनी वस्तुएँ” से सम्भवतः मूर्तिपूजा या अनुष्ठानिक अशुद्धता से जुड़ी वस्तुएँ—शायद गैर-इस्राएली उपासना से सम्बन्धित भोजन—अभिप्रेत हैं। “लहू” की छवि भी ऐसे भोजन या उससे जुड़े दोष की ओर संकेत कर सकती है।
    reason: cultural_note
  - marker: b
    text: इब्रानी का अनुवाद “वह भी हमारे परमेश्वर के लिए शेष रहेगा” या “वह भी हमारे परमेश्वर के लिए बचा हुआ अंश होगा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “यबूसी के समान” को सम्भवतः यहूदा में समाहित हो जाने के संकेत के रूप में समझा जाता है; यबूसियों के यरूशलेम में समावेशन से यह तुलना जुड़ी हो सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: मैं ... निकाल दूँगा
  rationale: सोर के हिफ़ील रूप का कारणवाचक अर्थ है—हटा देना। मुँह और दाँतों के बीच की सजीव छवि के साथ ‘निकाल दूँगा’ स्वाभाविक हिन्दी है और दोनों कर्मों पर लागू होता है।
- source_word: דָמָיו
  choice: उसके ... लहू
  rationale: मूल पाठ के ठोस ‘लहू’ को बनाए रखा गया है। यह रक्तयुक्त भोजन या रक्त-दोष की ओर संकेत कर सकता है, पर मुख्य पाठ उस अस्पष्टता को नहीं सुलझाता।
- source_word: שִׁקֻּצָיו
  choice: उसकी घिनौनी वस्तुएँ
  rationale: शिक्कूत्स मूर्तिपूजा या अनुष्ठानिक अशुद्धता से जुड़ी घृणित वस्तुओं को सूचित कर सकता है। यह चयन उसकी तीव्र नकारात्मकता को बनाए रखते हुए अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: מִבֵּין שִׁנָּיו
  choice: उसके दाँतों के बीच से
  rationale: मूल की ठोस शारीरिक छवि को अक्षुण्ण रखा गया है।
- source_word: וְנִשְׁאַר גַּם הוּא
  choice: तब वह भी ... बचा रहेगा
  rationale: निफ़अल क्रिया का सामान्य अर्थ ‘बचा रहना’ या ‘शेष रहना’ है। यह सहज हिन्दी में भविष्यसूचक ‘बचे हुए लोगों’ की सम्भावित अनुगूँज को भी खुला रखता है।
- source_word: לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर के लिए
  rationale: ल उपसर्ग यहाँ सम्बन्ध या संबद्धता व्यक्त करता है। यह वाक्यांश उस व्यक्ति अथवा प्रतिनिधि समुदाय के परमेश्वर की प्रजा में सम्मिलित होने का संकेत देता है, पर उसे विस्तार से व्याख्यायित नहीं करता।
- source_word: וְהָיָה כְּאַלֻּף בִּיהוּדָה
  choice: वह यहूदा में एक कुल-प्रधान के समान होगा
  rationale: अल्लूफ़ का अर्थ कुल या गोत्र का प्रधान हो सकता है। ‘कुल-प्रधान’ सामाजिक प्रतिष्ठा और नेतृत्व दोनों को स्पष्ट, संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: וְעֶקְרוֹן כִּיבוּסִי
  choice: और एक्रोन यबूसी के समान होगा
  rationale: मूल की संक्षिप्त तुलना और जाति-सूचक एकवचन को सुरक्षित रखा गया है; सम्भावित समावेशन की व्याख्या पादटिप्पणी में दी गई है।
theological_decisions:
- issue: शुद्ध किए गए पलिश्ती की स्थिति
  choice: एकवचन और शुद्धिकरण की छवि को बनाए रखते हुए परमेश्वर से उसकी नई संबद्धता व्यक्त की गई है।
  alternative: इसे केवल राजनीतिक अधीनता कहना, या मुख्य पाठ में सीधे पूरे पलिश्तिया समुदाय का नाम लेना।
  rationale: लहू और घिनौनी वस्तुओं को हटाने के बाद ‘वह भी’ और ‘हमारे परमेश्वर के लिए’ कहना विजय से बढ़कर शुद्धिकरण और समावेशन का संकेत देता है। फिर भी एकवचन किसी व्यक्ति या समुदाय के प्रतिनिधि—दोनों रूपों में समझा जा सकता है, इसलिए उसे सुरक्षित रखा गया है।
- issue: וְנִשְׁאַר में ‘शेष’ की भविष्यसूचक अनुगूँज
  choice: मुख्य पाठ में ‘बचा रहेगा’ और पादटिप्पणी में ‘बचा हुआ अंश’ की सम्भावना।
  alternative: मुख्य पाठ में ‘बचा हुआ अंश होगा’।
  rationale: क्रिया का सामान्य अर्थ पहले रखा गया है ताकि हिन्दी स्वाभाविक रहे और इब्रानी की व्यापक अर्थ-सीमा बनी रहे; भविष्यसूचक अवशेष की अनुगूँज पादटिप्पणी में स्पष्ट की गई है।
- issue: यबूसी के समान होने का आशय
  choice: मुख्य पाठ में तुलना को बिना खोले रखा गया है।
  alternative: मुख्य पाठ में ही यहूदा में समाहित होने का अर्थ जोड़ना।
  rationale: ऐतिहासिक समावेशन सम्भावित आशय है, पर इब्रानी वाक्य केवल तुलना करता है; इसलिए व्याख्या को पादटिप्पणी तक सीमित रखा गया है।
