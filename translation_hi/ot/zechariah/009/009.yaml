  text: גִּילִ֨י מְאֹ֜ד בַּת צִיּ֗וֹן הָרִ֨יעִי֙ בַּ֣ת יְרוּשָׁלִַ֔ם הִנֵּ֤ה מַלְכֵּ/ךְ֙ יָ֣בוֹא לָ֔/ךְ צַדִּ֥יק וְ/נוֹשָׁ֖ע ה֑וּא עָנִי֙ וְ/רֹכֵ֣ב עַל חֲמ֔וֹר וְ/עַל עַ֖יִר בֶּן אֲתֹנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/009.yaml
  text: Rejoice greatly[a], daughter Zion! Shout in triumph, daughter Jerusalem! Look, your king is coming to you—righteous and victorious is he, humble and riding on a donkey, on a colt[c][b], the foal of a she-donkey.
translation:
  language: hi
  text: हे सिय्योन की बेटी, बहुत आनन्द मना! हे यरूशलेम की बेटी, जयजयकार कर! देख, तेरा राजा तेरे पास आ रहा है—वह धर्मी और विजयी[a] है, दीन[b] है और गधे पर, और गधी के बच्चे—एक बछेड़े—पर सवार है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उद्धार पाया हुआ,’ अथवा ‘जिसके पास उद्धार है।’ हिब्रू शब्द उस व्यक्ति का वर्णन कर सकता है जिसे परमेश्वर ने छुड़ाया है और जो इसलिए विजय के साथ आता है।
    reason: alternative_reading
  - marker: b
    text: या ‘नम्र,’ ‘निर्धन’ अथवा ‘पीड़ित।’ हिब्रू शब्द मनोभाव के साथ-साथ किसी व्यक्ति की दीन या दुःखपूर्ण दशा भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘गधे पर, और गधी के बच्चे—एक बछेड़े—पर’ सम्भवतः काव्यात्मक समानान्तरता है, जिसमें एक ही पशु का दो प्रकार से वर्णन किया गया है।
    reason: literary_note
lexical_decisions:
- source_word: גִּילִי מְאֹד
  choice: बहुत आनन्द मना
  rationale: स्त्रीलिंग एकवचन आज्ञा और उसके तीव्रताबोधक क्रियाविशेषण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּת צִיּוֹן / בַּת יְרוּשָׁלִַם
  choice: हे सिय्योन की बेटी / हे यरूशलेम की बेटी
  rationale: नगर और उसके लोगों के मानवीकरण वाली भविष्यद्वाणी की छवि को विस्तार देकर समझाने के बजाय सुरक्षित रखा गया है।
- source_word: הָרִיעִי
  choice: जयजयकार कर
  rationale: यह क्रिया ऊँची पुकार को दर्शाती है, जो प्रायः हर्ष, विजय या राजकीय अभिनन्दन की होती है; इस प्रसंग में केवल ‘चिल्ला’ की अपेक्षा ‘जयजयकार कर’ अधिक सटीक और स्वाभाविक है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान खींचने वाले हिब्रू अव्यय का सीधा, वर्तमान और गैर-पुरातन हिन्दी रूप।
- source_word: מַלְכֵּךְ יָבוֹא לָךְ
  choice: तेरा राजा तेरे पास आ रहा है
  rationale: हिब्रू अपूर्ण क्रिया की भावी अथवा आसन्न घटना की सजीवता को व्यक्त करता है और दिशासूचक ‘तेरे पास’ को बनाए रखता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: राजा के नैतिक और वाचा-संबंधी सही चरित्र को व्यक्त करने वाला परिचित बाइबलीय हिन्दी शब्द।
- source_word: וְנוֹשָׁע
  choice: विजयी
  rationale: निफ़अल कृदन्त मूलतः बचाए या छुड़ाए जाने का भाव रख सकता है; राजकीय आगमन के प्रसंग में ‘विजयी’ उस ईश्वर-प्रदत्त छुटकारे के परिणाम को स्वाभाविक हिन्दी में बताता है। निष्क्रिय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עָנִי
  choice: दीन
  rationale: यह शब्द नम्रता के साथ-साथ नीची दशा, निर्धनता या पीड़ा भी सूचित कर सकता है। ‘दीन’ इस व्यापकता को ‘नम्र’ की तुलना में अधिक सुरक्षित रखता है।
- source_word: וְרֹכֵב עַל חֲמוֹר וְעַל עַיִר בֶּן אֲתֹנוֹת
  choice: और गधे पर, और गधी के बच्चे, एक बछेड़े पर सवार है
  rationale: दो समानान्तर पशु-वर्णनों को स्रोत के क्रम में रखा गया है और ‘अर्थात’ जोड़कर उनकी व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाया गया है।
theological_decisions:
- issue: मसीही राजकीय भविष्यद्वाणी में וְנוֹשָׁע का अर्थ
  choice: विजयी
  alternative: उद्धार पाया हुआ; जिसके पास उद्धार है
  rationale: रूप निष्क्रिय है और ईश्वर द्वारा बचाए या छुड़ाए गए व्यक्ति का बोध करा सकता है, जबकि राजकीय संदर्भ में इससे प्राप्त विजय भी अभिप्रेत हो सकती है। मुख्य पाठ में सहज ‘विजयी’ रखा गया है, पर मूल की निष्क्रियता और उद्धार-संबंधी तनाव पादटिप्पणी में स्पष्ट है।
- issue: आने वाले राजा के लिए עָנִי का अर्थ
  choice: दीन
  alternative: नम्र; निर्धन; पीड़ित
  rationale: किसी एक मनोभाव या सामाजिक दशा को निर्णायक मानने के बजाय ‘दीन’ चुना गया है, जो राजा की निम्न और आडम्बरहीन दशा को व्यक्त करते हुए शब्द की व्यापक अर्थ-सीमा खुली रखता है।
- issue: गधे और बछेड़े के उल्लेख का संबंध
  choice: दोनों समानान्तर पदों को मुख्य पाठ में बनाए रखा गया
  alternative: इन्हें स्पष्ट रूप से एक ही पशु के दो वर्णन बताना
  rationale: हिब्रू की काव्यात्मक समानान्तरता सम्भवतः एक ही पशु का दो प्रकार से वर्णन करती है, पर मुख्य पाठ में ‘अर्थात’ डालकर इसे पूर्णतः तय नहीं किया गया; सम्भावित व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे … की बेटी’ से भविष्यद्वाणी का मानवीकरण बचता है; ‘जयजयकार कर’ राजकीय हर्ष की ध्वनि देता है। ‘दीन’ सामान्य पाठक के लिए परिचित है और मूल की नम्रता, निम्न दशा तथा पीड़ा की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
