base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/004.yaml
  text: Behold[a], the Lord will dispossess her and strike her wealth into the sea, and she will be consumed by fire.
translation:
  language: hi
  text: देखो, प्रभु उसे उसके अधिकार से वंचित कर देगा; उसकी संपत्ति[a] को समुद्र में गिरा देगा, और वह आग से भस्म हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी शक्ति,’ ‘उसकी सेना,’ अथवा ‘उसका सामर्थ्य’; इब्रानी शब्द संपत्ति, साधन या सैनिक शक्ति का बोध करा सकता है। यहाँ पिछले पद में सूर की धन-संपदा के उल्लेख के कारण ‘संपत्ति’ संदर्भ के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यद्वाणी की ओर ध्यान खींचने वाले संकेतात्मक और गंभीर बल को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यहाँ इब्रानी पाठ में परमेश्वर की उपाधि अदोनाय है, न कि चतुरक्षरीय पवित्र नाम; इसलिए ‘प्रभु’ उपयुक्त है।
- source_word: יוֹרִשֶׁנָּה
  choice: उसे बेदखल कर देगा
  rationale: यरश के हिफ़ील रूप में किसी को उसके अधिकार या संपत्ति से निकाल देने का भाव है। ‘बेदखल’ विजय और अधिकार-हरण दोनों को व्यक्त करता है, बिना रीति को अनावश्यक रूप से निश्चित किए।
- source_word: וְהִכָּה בַיָּם
  choice: समुद्र में नष्ट कर देगा
  rationale: शाब्दिक ‘समुद्र में प्रहार करेगा’ हिन्दी में अस्वाभाविक है। यह अभिव्यक्ति समुद्र में सूर की संपदा या सामर्थ्य पर विनाशकारी प्रहार का अर्थ स्वाभाविक ढंग से देती है; בַיָּם का स्थानीय अर्थ ‘समुद्र में’ सुरक्षित रखा गया है।
- source_word: חֵילָהּ
  choice: उसकी संपत्ति
  rationale: חַיִל संपत्ति, साधन, शक्ति या सेना को सूचित कर सकता है। पिछले पद में सूर की चाँदी और सोने के कारण ‘संपत्ति’ निकटतम संदर्भ के अनुकूल है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: בָּאֵשׁ תֵּאָכֵל
  choice: आग से भस्म हो जाएगी
  rationale: आग द्वारा ‘खा लिए जाने’ की इब्रानी रूपकात्मक अभिव्यक्ति का स्वाभाविक और गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: स्त्रीलिंग प्रत्ययों और सर्वनाम का संदर्भ
  choice: इन्हें संदर्भ में संबोधित सूर नगरी से जोड़ा गया है और ‘वह/उसे/उसकी’ से व्यक्त किया गया है।
  alternative: नगरी को निर्जीव स्थान मानकर अधिक स्पष्ट रूप से ‘उस नगर’ कहना।
  rationale: इब्रानी में स्त्रीलिंग एकवचन रूप नगर के मानवीकरण को बनाए रखते हैं। हिन्दी के ये सर्वनाम स्वाभाविक हैं और संदर्भ को बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और भविष्यद्वाणी-सुलभ शैली रखी गई है। ‘बेदखल’ सामान्य पाठक के लिए बोधगम्य रहते हुए अधिकार-हरण का अर्थ व्यक्त करता है। पादटिप्पणी का चिह्न उस विवादित शब्द ‘संपत्ति’ के साथ रखा गया है।
