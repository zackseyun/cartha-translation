base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/001.yaml
  text: 'An oracle: the word of Yahweh is against the land of Hadrach[a], and Damascus is its resting place[d][c][b]; for the eye of man and of all the tribes of Israel is toward Yahweh.'
translation:
  language: hi
  text: 'घोषणा: याहवे का वचन हद्राक देश के विरुद्ध है,[a] और दमिश्क उसका विश्राम-स्थान है;[b] क्योंकि मनुष्य की और इस्राएल के सभी गोत्रों की दृष्टि याहवे की ओर लगी है।[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हद्राक देश के विषय में।” हिब्रू पूर्वसर्ग का शाब्दिक अर्थ “में” है, पर भविष्यसूचक शीर्षकों में वह घोषणा के लक्ष्य या विषय को भी सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “दमिश्क उसका [याहवे का] विश्राम-स्थान है।” ‘उसका’ में निहित हिब्रू प्रत्यय का पूर्वपद स्पष्ट नहीं है; वह वचन/संदेश या याहवे की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि मानवजाति और इस्राएल के सभी गोत्रों की दृष्टि याहवे की ओर लगी है।” यहाँ ‘मनुष्य’ का अर्थ सामान्य रूप से समस्त मानवजाति हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: 'कुछ लोग इस खंड का अर्थ इस प्रकार समझते हैं: “क्योंकि याहवे की दृष्टि मनुष्य और इस्राएल के सभी गोत्रों पर है।” हिब्रू वाक्यरचना संक्षिप्त है और एक से अधिक अर्थों की गुंजाइश देती है।'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשָּׂא
  choice: घोषणा
  rationale: भविष्यद्वक्ताओं के लेखों में यह शब्द किसी गंभीर ईश्वरीय कथन या न्याय-संदेश की भूमिका के रूप में आता है। ‘घोषणा’ आधुनिक और सुबोध है तथा ‘बोझ’ जैसे अत्यधिक शाब्दिक किंतु भ्रामक अनुवाद से बचती है।
- source_word: דְבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह मानक भविष्यसूचक पदबंध है। संबंधवाचक हिब्रू रचना को हिन्दी में स्वाभाविक रूप से ‘याहवे का वचन’ कहा गया है।
- source_word: בְּאֶרֶץ חַדְרָךְ
  choice: हद्राक देश के विरुद्ध
  rationale: पूर्वसर्ग בְ का मूल अर्थ ‘में’ है, पर न्याय-संबंधी भविष्यसूचक भूमिका में यह संदेश के लक्ष्य को सूचित कर सकता है। प्रसंग में ‘के विरुद्ध’ उसका बल स्वाभाविक हिन्दी में व्यक्त करता है; ‘के विषय में’ को पादटिप्पणी में रखा गया है।
- source_word: חַדְרָךְ
  choice: हद्राक
  rationale: स्थान-नाम को उसके हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְדַמֶּשֶׂק
  choice: और दमिश्क
  rationale: प्रचलित हिन्दी बाइबलीय स्थान-नाम का प्रयोग किया गया है।
- source_word: מְנֻחָתוֹ
  choice: उसका विश्राम-स्थान
  rationale: संज्ञा का अर्थ ‘विश्राम-स्थान’ है। तृतीय पुरुष एकवचन प्रत्यय का पूर्वपद स्पष्ट नहीं है; हिन्दी ‘उसका’ वचन/संदेश अथवा याहवे, दोनों संभावनाओं को खुला रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या कारण प्रस्तुत करता है।
- source_word: לַיהוָה עֵין אָדָם
  choice: मनुष्य की दृष्टि याहवे की ओर लगी है
  rationale: संक्षिप्त और विवादित हिब्रू वाक्यांश को इस प्रकार समझा गया है कि ‘दृष्टि’ कर्ता है और לַיהוָה दिशा या अभिमुखता बताता है। वैकल्पिक व्याकरणिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन शब्द का अर्थ सामान्यतः मानव या मानवजाति है। ‘मनुष्य’ हिब्रू के एकवचन प्रतिनिधिक रूप को बनाए रखते हुए आधुनिक हिन्दी में व्यापक मानवीय अर्थ दे सकता है।
- source_word: וְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: और इस्राएल के सभी गोत्रों की
  rationale: इसे ‘दृष्टि’ से जुड़ा दूसरा संबंधवाचक पद माना गया है। हिन्दी में ‘की’ जोड़ने से वाक्य का संबंध स्पष्ट और स्वाभाविक होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत ध्वन्यात्मक रूप है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: אָדָם का सामान्य मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति
  rationale: मुख्य पाठ में हिब्रू का एकवचन प्रतिनिधिक रूप रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि आशय केवल पुरुषों से नहीं बल्कि समस्त मानवजाति से हो सकता है।
- issue: लַיהוָה עֵין אָדָם की कर्ता-दिशा संबंधी अस्पष्टता
  choice: मनुष्य और इस्राएल के गोत्रों की दृष्टि याहवे की ओर है
  alternative: याहवे की दृष्टि मनुष्य और इस्राएल के सभी गोत्रों पर है
  rationale: हिब्रू शब्दक्रम और לְ का प्रयोग दोनों व्याख्याओं की गुंजाइश देते हैं। मुख्य पाठ सरल संबंधात्मक/दिशात्मक वाचन अपनाता है, पर ईश्वरीय निगरानी वाले वाचन को पादटिप्पणी में स्पष्ट रूप से रखा गया है।
