  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घोषणा’ भविष्यसूचक शीर्षक का गंभीर भाव देती है; ‘विश्राम-स्थान’ मूल रूपक को बनाए रखता है। ‘दृष्टि ... की ओर लगी है’ हिन्दी का स्वाभाविक मुहावरा है। सभी वास्तविक पाठगत और व्याकरणिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
