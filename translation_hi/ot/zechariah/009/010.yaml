base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/010.yaml
  text: And I will cut off the chariot from Ephraim and the horse from Jerusalem[a], and the battle bow will be cut off; and he will speak peace to the nations, and his dominion will be from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: hi
  text: मैं एप्रैम से रथों और यरूशलेम से घोड़ों को हटा दूँगा; युद्ध का धनुष भी नष्ट कर दिया जाएगा। वह राष्ट्रों को शांति की घोषणा करेगा। उसका शासन समुद्र से समुद्र तक और नदी[a] से पृथ्वी के छोरों तक होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘नदी’ से संभवतः फ़रात नदी का अभिप्राय है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכְרַתִּי
  choice: मैं ... हटा दूँगा
  rationale: हिफ़इल रूप का अर्थ काट डालना, दूर करना या समाप्त करना हो सकता है। यहाँ सैन्य साधनों को हटाने का भाव स्पष्ट है; ‘हटा दूँगा’ स्वाभाविक हिन्दी में इस अर्थ को बिना विनाश की विधि तय किए व्यक्त करता है।
- source_word: רֶכֶב ... וְסוּס
  choice: रथों ... और ... घोड़ों
  rationale: इब्रानी में दोनों एकवचन सामूहिक अर्थ रखते हैं। हिन्दी में बहुवचन सैन्य रथबल और घुड़सवार शक्ति के सामूहिक भाव को अधिक स्वाभाविक ढंग से प्रकट करता है।
- source_word: וְנִכְרְתָה קֶשֶׁת מִלְחָמָה
  choice: युद्ध का धनुष भी नष्ट कर दिया जाएगा
  rationale: निफ़अल रूप निष्क्रिय परिणाम व्यक्त करता है। ‘युद्ध का धनुष’ मूल रचना और सैन्य बिंब को बनाए रखता है; ‘भी’ समानांतर सैन्य साधनों की श्रृंखला को हिन्दी में स्पष्ट करता है।
- source_word: וְדִבֶּר שָׁלוֹם לַגּוֹיִם
  choice: वह राष्ट्रों के बीच शांति की घोषणा करेगा
  rationale: דבר का पिअेल यहाँ बोलने या घोषित करने का अर्थ देता है। ‘शांति की घोषणा’ स्वाभाविक हिन्दी है, जबकि ‘राष्ट्रों के बीच’ उस शांति के अंतरराष्ट्रीय विस्तार को व्यक्त करता है और केवल राष्ट्रों को संबोधन तक अर्थ को सीमित नहीं करता।
- source_word: וּמָשְׁלוֹ
  choice: उसका शासन
  rationale: यह क्रिया नहीं, प्रत्यययुक्त संज्ञा है—‘उसका शासन/प्रभुत्व’। ‘उसका शासन’ आधुनिक हिन्दी में स्वाभाविक है और राजकीय अर्थ बनाए रखता है।
- source_word: מִיָּם עַד יָם
  choice: समुद्र से समुद्र तक
  rationale: यह व्यापक शासन का भौगोलिक मुहावरा है। शाब्दिक रूप हिन्दी में भी स्पष्ट और गरिमापूर्ण है।
- source_word: וּמִנָּהָר עַד אַפְסֵי אָרֶץ
  choice: और नदी से पृथ्वी के छोरों तक
  rationale: ‘नदी’ संदर्भ में किसी सुविख्यात नदी, संभवतः फ़रात, का संकेत है। मुख्य पाठ उसका नाम निश्चित नहीं करता; इसलिए पहचान को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘वह’ और ‘उसका’ का संदर्भ
  choice: तीसरे पुरुष एकवचन को व्यक्तिगत रूप में रखा गया है और इसे पिछले पद में आए राजा से स्वाभाविक रूप से जुड़ने दिया गया है।
  alternative: ‘शांति की घोषणा की जाएगी’ और ‘शासन फैल जाएगा’ जैसे निर्वैयक्तिक रूप।
  rationale: पहले पुरुष में परमेश्वर के कथन से तीसरे पुरुष में परिवर्तन वास्तविक है। व्यक्तिगत सर्वनाम आने वाले राजा की निकटवर्ती संदर्भगत भूमिका को सुरक्षित रखते हैं, पर बाद की धर्मसैद्धांतिक पहचान को पाठ में नहीं जोड़ते।
- issue: राजा के शासन का विस्तार
  choice: ‘समुद्र से समुद्र तक’ और ‘पृथ्वी के छोरों तक’ की व्यापक, सार्वभौमिक भाषा को यथावत रखा गया है।
  alternative: इसे केवल इस्राएल या निकटवर्ती क्षेत्र तक सीमित करके स्पष्ट करना।
  rationale: मूल के समानांतर भौगोलिक वाक्यांश जानबूझकर अत्यंत विस्तृत शासन दर्शाते हैं। अनुवाद उस विस्तार को सुरक्षित रखता है और उसकी पूर्ति के स्वरूप का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी के सामूहिक एकवचन ‘रथ’ और ‘घोड़ा’ को स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है। सैन्य शक्ति के हटने, राष्ट्रों में शांति और राजा के व्यापक शासन की काव्यात्मक समानांतरता सुरक्षित है।
