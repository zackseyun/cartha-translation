id: ZEC.9.12
reference: Zechariah 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁ֚וּבוּ לְ/בִצָּר֔וֹן אֲסִירֵ֖י הַ/תִּקְוָ֑ה גַּם הַ/יּ֕וֹם מַגִּ֥יד מִשְׁנֶ֖ה אָשִׁ֥יב לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/012.yaml
  text: Return to the stronghold[a], prisoners of hope[b]; even today I declare that I will restore double to you.
translation:
  language: hi
  text: हे आशा के बंदियो[b], दुर्ग[a] में लौट आओ! आज भी मैं घोषणा करता हूँ कि मैं तुम्हें दुगुना लौटा दूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गढ़’ अथवा ‘किलेबंद स्थान’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘आशा के बंदी’; यह रूपक ऐसे लोगों का संकेत दे सकता है जो बंदी होते हुए भी आशा से बँधे या उसी से संभले हुए हैं।
    reason: lexical_alternative
  - marker: c
    text: या ‘मैं तुम्हें दोहरा भाग फिर से दूँगा’ अथवा ‘मैं तुम्हें दुगुना प्रतिफल दूँगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  choice: लौट आओ
  rationale: बहुवचन आदेश का स्वाभाविक हिन्दी रूप; यह स्थान की ओर लौटने और व्यापक वाचागत वापसी—दोनों संभावित संकेतों को खुला रखता है।
- source_word: לְבִצָּרוֹן
  choice: दुर्ग में
  rationale: בִּצָּרוֹן किसी किलेबंद और सुरक्षित स्थान को दर्शाता है। ‘दुर्ग’ ठोस बिंब को बनाए रखता है; ‘में लौट आओ’ हिन्दी में गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲסִירֵי הַתִּקְוָה
  choice: आशा के बंदियो
  rationale: सम्बन्धवाचक पदबंध का निकट और प्रभावशाली अनुवाद, जो आशा से बँधे बंदियों के असामान्य रूपक को सरल करके नष्ट नहीं करता।
- source_word: גַּם הַיּוֹם
  choice: आज भी
  rationale: גַּם के समावेशी अथवा बलाघाती भाव और घोषणा की वर्तमान तात्कालिकता को सहज हिन्दी में व्यक्त करता है।
- source_word: מַגִּיד
  choice: मैं घोषणा करता हूँ
  rationale: वक्ता की वर्तमान, सार्वजनिक घोषणा को हिन्दी के स्वाभाविक पूर्ण वाक्य में व्यक्त करता है।
- source_word: מִשְׁנֶה
  choice: दुगुना
  rationale: शब्द का अर्थ ‘दुगुना’ या ‘दोहरा भाग’ हो सकता है। ‘दुगुना’ मूल की तरह लौटाई जाने वाली वस्तु को अनिर्दिष्ट रहने देता है।
- source_word: אָשִׁיב לָךְ
  choice: मैं तुम्हें ... लौटा दूँगा
  rationale: हिफ़ील रूप के लौटाने या पुनः देने के भाव को स्वाभाविक हिन्दी में रखता है। ‘तुम्हें’ मूल के स्त्रीलिंग एकवचन संबोधन को बिना किसी विशिष्ट संदर्भ को मुख्य पाठ में जोड़ने के सामूहिक संबोधन के रूप में खुला रखता है।
theological_decisions:
- issue: לָךְ में स्त्रीलिंग एकवचन संबोधन का संदर्भ
  choice: ‘तुम्हें’ के द्वारा प्रत्यक्ष संबोधन को बनाए रखा गया है, बिना यह स्पष्ट किए कि संबोधन सिय्योन, यरूशलेम या वाचा-समुदाय से है।
  alternative: इसे स्पष्ट रूप से ‘हे सिय्योन’ अथवा प्रत्येक बंदी के लिए बहुवचन संबोधन के रूप में विस्तृत किया जा सकता था।
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन है और सम्भवतः व्यक्तिरूप में सिय्योन/यरूशलेम या समुदाय की ओर संकेत करता है; हिन्दी ‘तुम्हें’ इस संकेत को अनावश्यक रूप से निश्चित किए बिना प्रत्यक्षता बनाए रखता है।
- issue: מִשְׁנֶה אָשִׁיב का प्रतिफल या पुनर्स्थापन का भाव
  choice: ‘दुगुना लौटा दूँगा’
  alternative: ‘दुगुना बदला दूँगा’ या ‘दोहरा भाग फिर से दूँगा’
  rationale: मूल में प्रतिपूर्ति और पुनर्स्थापन दोनों की छाया सम्भव है। चुना हुआ रूप लेन-देन या दंड के अर्थ को अनावश्यक रूप से प्रधान नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज संबोधन अपनाया गया है। ‘आशा के बंदियो’ मूल के तीखे रूपक को बचाता है, जबकि ‘दुर्ग’ भविष्यद्वाणी के ठोस सुरक्षा-बिंब को बनाए रखता है। विस्मयादिबोधक चिह्न आदेश की तत्परता दिखाता है; दूसरा वाक्य गंभीर घोषणात्मक लहजे में है।
