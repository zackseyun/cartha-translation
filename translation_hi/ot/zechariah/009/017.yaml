base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/017.yaml
  text: For how great is his goodness[a], and how great his beauty! Grain will make the young men flourish[c][b], and new wine the young women.
translation:
  language: hi
  text: क्योंकि उसकी भलाई कितनी महान है, और उसका सौन्दर्य कितना मनोहर है![a][b] अन्न जवानों को फलने-फूलने देगा, और नया दाखमधु युवतियों को फलने-फूलने देगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “वह कितना भला और कितना सुन्दर है!” इब्रानी में अमूर्त संज्ञाएँ हैं: “उसकी भलाई” और “उसका सौन्दर्य।”'
    reason: lexical_alternative
  - marker: b
    text: “उसकी” और “उसका” सम्भवतः प्रसंग में यहोवा की ओर संकेत करते हैं; कुछ लोग इन्हें इस्राएल की पुनर्स्थापित दशा या राजा की ओर संकेत मानते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “कुँवारियों को।” इब्रानी शब्द विशेष रूप से अविवाहित कुँवारी युवतियों को सूचित कर सकता है, यद्यपि यहाँ वह सम्भवतः “जवानों” के स्त्रीलिंग समानान्तर के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद से जुड़ा हुआ विस्मयपूर्ण कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इसके संयोजक बल को बनाए रखता है।
- source_word: מַה טּוּבוֹ
  choice: उसकी भलाई कितनी महान
  rationale: מַה यहाँ विस्मयबोधक है और טוּב अमूर्त संज्ञा ‘भलाई/कल्याण’ है। यह अनुवाद संज्ञा और पुल्लिंग एकवचन संबंधसूचक प्रत्यय, दोनों को सुरक्षित रखता है।
- source_word: וּמַה יָפְיוֹ
  choice: और उसका सौन्दर्य कितना अद्भुत
  rationale: यह समानान्तर विस्मयबोधक पद है। ‘सौन्दर्य’ मूल की अमूर्त संज्ञा और संबंधसूचक प्रत्यय को बनाए रखता है, जबकि ‘अद्भुत’ स्वाभाविक हिन्दी में विस्मय व्यक्त करता है।
- source_word: דָּגָן
  choice: अन्न
  rationale: यह सामान्य रूप से अनाज या धान्य-उपज को दर्शाता है, किसी एक विशेष फसल को नहीं; आधुनिक हिन्दी में ‘अन्न’ काव्यात्मक और सहज है।
- source_word: בַּחוּרִים
  choice: जवानों
  rationale: सन्दर्भ में यह युवा पुरुषों को दर्शाता है और अगले पदांश की युवतियों के समानान्तर है।
- source_word: יְנוֹבֵב
  choice: फलने-फूलने देगा
  rationale: यह दुर्लभ क्रिया सशक्त वृद्धि या समृद्ध होने का कारण बनने का भाव रखती है। चुना गया रूप कृषि-सम्बन्धी बिम्ब और कारक अर्थ, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְתִירוֹשׁ
  choice: और नया दाखमधु
  rationale: תִּירוֹשׁ सामान्यतः नया या ताज़ा दाखमधु है; ‘नया दाखमधु’ अन्न के साथ इसकी काव्यात्मक समानता और विशिष्ट अर्थ को सुरक्षित रखता है।
- source_word: בְּתֻלוֹת
  choice: युवतियों
  rationale: यह शब्द अधिक विशेष रूप से कुँवारी कन्याओं को सूचित कर सकता है, पर यहाँ जवानों के स्त्रीलिंग समानान्तर सामाजिक समूह के रूप में ‘युवतियों’ स्वाभाविक है; विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘उसकी भलाई’ और ‘उसका सौन्दर्य’ में पुल्लिंग एकवचन प्रत्यय का सन्दर्भ
  choice: मुख्य पाठ में अस्पष्ट सर्वनाम ‘उसकी/उसका’ को बनाए रखा गया है; प्रसंग में इसका सर्वाधिक सम्भावित सन्दर्भ यहोवा है।
  alternative: यह प्रत्यय इस्राएल/सिय्योन की पुनर्स्थापित दशा या अध्याय में पहले उल्लिखित राजा की ओर संकेत कर सकता है।
  rationale: पद 16 यहोवा के उद्धारकारी कार्य का उत्सव मनाता है, इसलिए उसकी भलाई और सौन्दर्य सर्वाधिक सुसंगत हैं। फिर भी इब्रानी प्रत्यय स्वयं अपने सन्दर्भ को स्पष्ट नहीं करता; अतः मुख्य पाठ में पहचान जोड़ने के बजाय विकल्प पादटिप्पणी में सुरक्षित हैं।
