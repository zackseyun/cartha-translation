  register: आधुनिक मानक हिन्दी में गरिमामय, सहज और काव्यात्मक शैली रखी गई है। समानान्तर रचना तथा कृषि-समृद्धि के बिम्ब को सुरक्षित रखा गया है। दूसरे पदांश में क्रिया की पुनरावृत्ति न करके इब्रानी काव्य की संक्षिप्तता और हिन्दी की स्वाभाविकता बनाए रखी गई है।
