  text: וְ/חָנִ֨יתִי לְ/בֵיתִ֤/י מִצָּבָה֙ מֵ/עֹבֵ֣ר וּ/מִ/שָּׁ֔ב וְ/לֹֽא יַעֲבֹ֧ר עֲלֵי/הֶ֛ם ע֖וֹד נֹגֵ֑שׂ כִּ֥י עַתָּ֖ה רָאִ֥יתִי בְ/עֵינָֽ/י־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/008.yaml
  text: And I will encamp at my house as a guard[a], so that none may pass to and fro, and no oppressor will pass over them again[c][b]; for now I have seen with my own eyes.
translation:
  language: hi
  text: मैं अपने घर के पास पहरा देने के लिए डेरा डालूँगा[a], गुज़रने और लौटने वालों से बचाव के लिए[b]; फिर कोई अत्याचारी उन पर से होकर नहीं गुज़रेगा[c], क्योंकि अब मैंने अपनी आँखों से देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक छावनी/पहरे की चौकी के रूप में।” इब्रानी शब्द तैनात रक्षक-दल, चौकी, या सैन्य रक्षा-स्थान का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गुज़रने वाले और लौटने वाले से।” यह संभवतः दोनों दिशाओं में होने वाली शत्रुतापूर्ण आवाजाही का संकेत है।
    reason: lexical_alternative
  - marker: c
    text: “अत्याचारी” का अनुवाद “बेगार कराने वाला” या “कर वसूलने वाला” भी हो सकता है। इब्रानी में वह “उन पर फिर से होकर गुज़रेगा” नहीं कहा गया है; इससे उन पर चढ़ आने या उन्हें रौंदने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָנִיתִי
  choice: मैं ... डेरा डालूँगा
  rationale: חנה का मूल अर्थ ‘डेरा डालना’ है; इससे परमेश्वर की सक्रिय, रक्षात्मक उपस्थिति का सैन्य बिंब बना रहता है।
- source_word: לְבֵיתִי
  choice: अपने भवन के पास
  rationale: לְ का स्थानगत और हितार्थक भाव यहाँ रक्षा के संदर्भ में है। ‘भवन’ मूल ‘मेरे घर’ को जानबूझकर मंदिर या समस्त प्रजा तक सीमित नहीं करता।
- source_word: מִצָּבָה
  choice: पहरे की चौकी के रूप में
  rationale: यह शब्द तैनात चौकी, पहरे या सैन्य रक्षा-स्थान का बोध कराता है। यह पदबंध आधुनिक हिन्दी में स्पष्ट है और सैन्य बिंब बनाए रखता है।
- source_word: מֵעֹבֵר וּמִשָּׁב
  choice: ताकि कोई वहाँ से इधर-उधर न आए-जाए
  rationale: शाब्दिक रूप से ‘गुज़रने वाले और लौटने वाले से’ है। युग्म दोनों दिशाओं में होने वाली आवाजाही, संदर्भतः शत्रु-सैन्य आवागमन, को व्यक्त करता है; सहज हिन्दी में उसका आशय रखा गया है।
- source_word: וְלֹא יַעֲבֹר עֲלֵיהֶם עוֹד נֹגֵשׂ
  choice: फिर कोई अत्याचारी उन पर चढ़ाई नहीं करेगा
  rationale: עבר על का संदर्भगत अर्थ किसी भूभाग या लोगों पर चढ़ आना अथवा उन्हें रौंदते हुए पार करना हो सकता है। ‘चढ़ाई करेगा’ सैन्य दमन का भाव स्वाभाविक हिन्दी में देता है।
- source_word: נֹגֵשׂ
  choice: अत्याचारी
  rationale: यह कृदंत दबाने, बेगार कराने या कर वसूलने वाले शासक के लिए प्रयुक्त हो सकता है। ‘अत्याचारी’ व्यापक अर्थ को रखता है; ‘बेगार कराने वाला’ या ‘कर वसूलने वाला’ अनावश्यक रूप से संकीर्ण होते।
- source_word: כִּי עַתָּה רָאִיתִי בְעֵינָי
  choice: क्योंकि अब मैंने अपनी आँखों से देख लिया है
  rationale: כִּי कारण बताता है, עַתָּה निर्णायक वर्तमान क्षण को सूचित करता है, और ‘अपनी आँखों से’ प्रत्यक्ष देखने के जोर को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘मेरे भवन’ का संदर्भ
  choice: मुख्य पाठ में ‘अपने भवन’ रखकर संदर्भ को खुला रखा गया है।
  alternative: इसे केवल मंदिर, अथवा व्यापक रूप से परमेश्वर की भूमि और प्रजा, के रूप में स्पष्ट करना।
  rationale: यह पद मंदिर की ओर संकेत कर सकता है, पर आगे का बहुवचन ‘उन पर’ उससे जुड़े लोगों को भी समेटता है। इसलिए अनुवाद मूल की व्यापकता को संकीर्ण नहीं करता।
- issue: ‘मैंने अपनी आँखों से देखा’ का आशय
  choice: प्रत्यक्ष दिव्य अवलोकन के कथन को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे स्पष्टतः उनकी दुर्दशा, शत्रुओं या न्याय की घड़ी को देखने के रूप में प्रस्तुत करना।
  rationale: मूल वाक्य यह नहीं बताता कि परमेश्वर ने ठीक क्या देखा है। उस अर्थगत तनाव को मुख्य पाठ में बनाए रखना उचित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहरे की चौकी,’ ‘डेरा डालना’ और ‘चढ़ाई करना’ मूल के सैन्य-रक्षात्मक बिंब को बनाए रखते हैं। अस्पष्ट संदर्भों को पादटिप्पणियों में खोला गया है, मुख्य पाठ में संप्रदायगत व्याख्या नहीं जोड़ी गई।
