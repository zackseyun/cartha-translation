source:
  edition: WLC
  text: כִּֽי דָרַ֨כְתִּי לִ֜/י יְהוּדָ֗ה קֶ֚שֶׁת מִלֵּ֣אתִי אֶפְרַ֔יִם וְ/עוֹרַרְתִּ֤י בָנַ֨יִ/ךְ֙ צִיּ֔וֹן עַל בָּנַ֖יִ/ךְ יָוָ֑ן וְ/שַׂמְתִּ֖י/ךְ כְּ/חֶ֥רֶב גִּבּֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/013.yaml
  text: For I have bent Judah as my bow; I have filled it with Ephraim. I will stir up your sons[a], Zion, against your sons, Greece, and make you like a warrior’s sword.
translation:
  language: hi
  text: क्योंकि मैंने यहूदा को अपने धनुष के रूप में ताना है और उसे एप्रैम से भरा है। हे सिय्योन, मैं तेरे पुत्रों को यूनान[a] के पुत्रों के विरुद्ध उठाऊँगा और तुझे योद्धा की तलवार के समान बना दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “यावान”; यह यूनानी लोगों या यूनानी संसार का पारंपरिक नाम है।
    reason: मूल पारंपरिक नाम और आधुनिक ऐतिहासिक अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले वचन में दी गई प्रतिज्ञा का आधार या स्पष्टीकरण प्रस्तुत करता है।
- source_word: דָרַכְתִּי לִי יְהוּדָה קֶשֶׁת
  choice: मैंने यहूदा को अपने धनुष के समान चढ़ाया है
  rationale: דרך और קשת का संयुक्त प्रयोग धनुष को युद्ध के लिए चढ़ाने या तानने का मुहावरा है; לִי के स्वामित्व अथवा हितार्थ भाव को ‘अपने’ से व्यक्त किया गया है।
- source_word: מִלֵּאתִי אֶפְרַיִם
  choice: उसे एप्रैम से भरा है
  rationale: ‘उसे’ का संकेत पिछले धनुष की ओर है। इब्रानी रूपक एप्रैम को धनुष में भरी या लगाई गई युद्ध-सामग्री के रूप में रखता है; अनिश्चित विवरण को स्पष्ट करके ‘तीर’ नहीं बनाया गया।
- source_word: וְעוֹרַרְתִּי
  choice: मैं ... उठाऊँगा
  rationale: भविष्यसूचक क्रम में यह युद्ध के लिए जगाने या सक्रिय करने की आगामी क्रिया बताता है।
- source_word: בָנַיִךְ צִיּוֹן
  choice: हे सिय्योन, ... तेरे पुत्रों
  rationale: सिय्योन को स्त्री अथवा माता के रूप में संबोधित किया गया है; ‘पुत्रों’ से मूल का पुरुषवाची युद्ध-संदर्भ सुरक्षित रहता है।
- source_word: עַל בָּנַיִךְ יָוָן
  choice: यूनान के पुत्रों के विरुद्ध
  rationale: יָוָן यूनानी लोगों या यूनानी संसार का पारंपरिक नाम है। आधुनिक हिन्दी में ‘यूनान’ ऐतिहासिक-जातीय संकेत को स्पष्ट करता है और समानांतर मातृ-रूपक को ‘पुत्रों’ से बनाए रखता है।
- source_word: וְשַׂמְתִּיךְ
  choice: और तुझे ... बना दूँगा
  rationale: उपमा के साथ हिन्दी में ‘बना दूँगा’ स्वाभाविक है और युद्ध के साधन के रूप में नियुक्त करने का भाव देता है।
- source_word: כְּחֶרֶב גִּבּוֹר
  choice: योद्धा की तलवार के समान
  rationale: גִּבּוֹר यहाँ शक्तिशाली योद्धा को सूचित करता है; यह चयन युद्धात्मक बिंब को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
theological_decisions:
- issue: יָוָן का संदर्भ और अनुवाद
  choice: यूनान
  alternative: यावान
  rationale: यह शब्द यहाँ यूनानी लोगों या संसार को सूचित करता है। ‘यूनान’ आधुनिक पाठक के लिए संदर्भ स्पष्ट करता है, जबकि पारंपरिक नाम ‘यावान’ पादटिप्पणी में रखा गया है।
- issue: भविष्यसूचक कथन में पूर्ण क्रियाओं का कालगत बल
  choice: तैयारी की क्रियाओं के लिए पूर्ण वर्तमान (‘चढ़ाया है’, ‘भरा है’) और आगामी युद्ध-क्रिया के लिए भविष्य (‘उठाऊँगा’, ‘बना दूँगा’)
  alternative: सभी क्रियाओं को भविष्य में, अथवा सभी को पूर्ण भूतकाल में प्रस्तुत करना
  rationale: यह भेद पहले से पूरी मानी गई ईश्वरीय तैयारी और उसके बाद होने वाली लामबंदी के बीच इब्रानी कथन की गति को सुरक्षित रखता है।
- issue: מִלֵּאתִי אֶפְרַיִם में रूपक की अनिश्चितता
  choice: ‘उसे एप्रैम से भरा है’
  alternative: ‘एप्रैम को तीर बनाकर उसमें लगाया है’
  rationale: मूल पाठ धनुष के बिंब में एप्रैम की भूमिका को स्पष्ट रूप से ‘तीर’ नहीं कहता। इसलिए वास्तविक अस्पष्टता को बिना अनावश्यक व्याख्या के बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण भविष्यसूचक शैली और सामान्य पाठक के लिए सहज वाक्य-विन्यास। ‘सिय्योन’, ‘यहूदा’ और ‘एप्रैम’ जैसे प्रचलित बाइबिलीय नाम बनाए गए हैं।
