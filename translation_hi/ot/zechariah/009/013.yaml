review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the Hebrew sequence and imagery well: Judah is the bow, Ephraim is associated with its filling without adding ‘arrow,’ Zion’s sons are stirred against the sons of Javan/Greece, and Zion becomes like a warrior’s sword. The future force of the latter verbs is appropriately represented.'
  naturalness: ‘धनुष के समान चढ़ाया है’ is not the most natural Hindi expression for bending a bow and can suggest mounting or attaching it. ‘अपने धनुष के रूप में ताना है’ clearly conveys the bow-bending image in idiomatic modern Hindi. The rest is clear and suitably elevated.
  terminology: ‘यहूदा,’ ‘एप्रैम,’ ‘सिय्योन,’ and ‘यूनान’ are appropriate established Hindi biblical/historical forms. The footnote correctly preserves ‘यावान’ and explains its historical reference. ‘योद्धा की तलवार’ faithfully conveys the genitive image.
  issues:
  - severity: medium
    issue: ‘धनुष के समान चढ़ाया है’ for דָרַכְתִּי ... קֶשֶׁת
    rationale: In current Hindi, a bow is normally ‘ताना’ for use; ‘चढ़ाया’ is less idiomatic here and may obscure the intended martial action. ‘अपने धनुष के रूप में ताना है’ retains the possessive force of לִי and the source metaphor.
