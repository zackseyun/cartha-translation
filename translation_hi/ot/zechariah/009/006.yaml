- source_word: מַמְזֵר
  choice: मिली-जुली जाति के लोग
  rationale: यह दुर्बोध संज्ञा व्याकरणतः एकवचन है, पर इस भविष्यवाणी के संदर्भ में मिश्रित अथवा सामाजिक रूप से बहिष्कृत आबादी का सामूहिक बोध करा सकती है। मुख्य पाठ में सामूहिक अर्थ रखा गया है, जबकि व्यक्तिगत अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: בְּאַשְׁדּוֹד
  choice: अशदोद में
  rationale: उपसर्ग ב यहाँ स्थान सूचित करता है; नगर के भीतर निवास के लिए “अशदोद में” स्वाभाविक अनुवाद है।
- source_word: הִכְרַתִּי
  choice: मैं ... मिटा दूँगा
  rationale: כרת के हिफ़ील रूप का अर्थ काट देना, हटा देना या समाप्त कर देना हो सकता है। घमंड के साथ “मिटा दूँगा” आधुनिक हिन्दी में स्वाभाविक रहते हुए पूर्ण उन्मूलन का न्यायसूचक बल बनाए रखता है।
- source_word: גְּאוֹן
  choice: घमंड
  rationale: यह शब्द गौरव, ऊँचाई या अभिमान का अर्थ दे सकता है। न्याय की इस घोषणा में नकारात्मक अर्थ “घमंड” संदर्भानुकूल है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इब्रानी रूप देश नहीं, लोगों के समुदाय को सूचित करता है; इसलिए “पलिश्तियों” सटीक है।
