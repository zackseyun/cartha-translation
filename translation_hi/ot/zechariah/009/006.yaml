  choice: अशदोद में बसने वाली मिली-जुली जाति के लोगों के रूप में सामूहिक अनुवाद
  alternative: “अशदोद में एक अवैध संतान बसेगी” अथवा “एक बहिष्कृत व्यक्ति बसेगा”
  rationale: पद का प्रसंग पलिश्ती पहचान और घमंड के अपमान या विस्थापन से जुड़ा है। केवल एक व्यक्ति का उल्लेख सम्भव है, पर सामूहिक अर्थ प्रसंग से अधिक सहज बैठता है। फिर भी इब्रानी शब्द की कठिनाई और व्यक्तिगत अर्थ की सम्भावना पाद-टिप्पणी में स्पष्ट रखी गई है।
