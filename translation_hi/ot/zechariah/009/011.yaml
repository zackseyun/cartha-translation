source:
  edition: WLC
  text: גַּם אַ֣תְּ בְּ/דַם בְּרִיתֵ֗/ךְ שִׁלַּ֤חְתִּי אֲסִירַ֨יִ/ךְ֙ מִ/בּ֔וֹר אֵ֥ין מַ֖יִם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/011.yaml
  text: As for you also[a], because of the blood of your covenant[b], I have sent out your prisoners from the pit in which there is no water.
translation:
  language: hi
  text: तेरे विषय में भी, तेरी वाचा के लहू के कारण[a], मैंने तेरे बंदियों को उस गड्ढे[b] से निकाल दिया है, जिसमें पानी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी वाचा के लहू के द्वारा।” इब्रानी पूर्वसर्ग कारण और साधन, दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गड्ढे” का अनुवाद “जलकुंड” या “बंदीगृह” भी हो सकता है; आशय पानी से खाली ऐसे स्थान से है जहाँ बंदियों को रखा जा सकता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אַתְּ
  choice: और जहाँ तक तेरी बात है
  rationale: यह पदबंध स्त्रीलिंग एकवचन में संबोधित सिय्योन/यरूशलेम को पिछली प्रतिज्ञाओं से जोड़ते हुए विषय के रूप में आगे रखता है। यह हिंदी में स्वाभाविक ढंग से उसके योगात्मक और बलाघाती भाव को व्यक्त करता है।
- source_word: בְּדַם בְּרִיתֵךְ
  choice: तेरी वाचा के लहू के कारण
  rationale: בְּ उपसर्ग यहाँ कारण अथवा साधन, दोनों का भाव दे सकता है। मुख्य पाठ में कारणसूचक अर्थ रखा गया है और साधनसूचक विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּרִיתֵךְ
  choice: तेरी वाचा
  rationale: בְּרִית के लिए ‘वाचा’ भविष्यद्वाणी और परमेश्वर-प्रजा संबंध के संदर्भ में मानक, संक्षिप्त और धर्मवैचारिक रूप से अनिर्दिष्ट शब्द है।
- source_word: שִׁלַּחְתִּי
  choice: मैंने ... निकाल दिया है
  rationale: पिएल पूर्ण क्रिया बंदियों को बाहर भेजने अथवा छुड़ाने का भाव देती है। ‘निकाल दिया है’ गड्ढे से बाहर लाने की छवि बनाए रखते हुए स्वाभाविक हिंदी है।
- source_word: אֲסִירַיִךְ
  choice: तेरे बंदियों को
  rationale: यह शब्द बँधे हुए या कैद लोगों को दर्शाता है। ‘बंदी’ गड्ढे में रखे जाने की छवि और संबोधित समुदाय से उनके संबंध, दोनों को स्पष्ट रखता है।
- source_word: מִבּוֹר
  choice: उस गड्ढे से
  rationale: בּוֹר गड्ढे, जलकुंड या बंदीगृह जैसे स्थान को सूचित कर सकता है। ‘गड्ढा’ व्यापक रूपक को बनाए रखता है; जलहीन होने का अगला वाक्यांश उसका स्वरूप स्पष्ट करता है।
- source_word: אֵין מַיִם בּוֹ
  choice: जिसमें पानी नहीं है
  rationale: यह अस्तित्वसूचक उपवाक्य गड्ढे का वर्णन करता है और मूल की सरल, तीखी छवि को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘तेरी वाचा के लहू’ का अभिप्राय
  choice: वाचा के लहू की भाषा को बिना किसी विशिष्ट वाचा की पहचान तय किए बनाए रखा गया है।
  alternative: इसे सीनै की लहू से पक्की की गई वाचा का संकेत अथवा नई वाचा का पूर्वाभास मानना।
  rationale: वाक्यांश वाचा को लहू से प्रमाणित करने की छवि जगाता है, पर पद स्वयं किसी खास ऐतिहासिक या भावी वाचा को स्पष्ट रूप से नहीं बताता। इसलिए अनुवाद धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन आत्मीय संबोधन के लिए ‘तेरी/तेरे’ मूल के स्त्रीलिंग एकवचन संबोधन को संदर्भानुकूल व्यक्त करता है; हिंदी सर्वनाम स्वयं लिंग नहीं दर्शाता। पादटिप्पणी-चिह्न संबंधित शब्द-समूहों के तुरंत बाद रखे गए हैं।
