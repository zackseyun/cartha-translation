source:
  edition: WLC
  text: וְֽ/הוֹשִׁיעָ֞/ם יְהוָ֧ה אֱלֹהֵי/הֶ֛ם בַּ/יּ֥וֹם הַ/ה֖וּא כְּ/צֹ֣אן עַמּ֑/וֹ כִּ֚י אַבְנֵי נֵ֔זֶר מִֽתְנוֹסְס֖וֹת עַל אַדְמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/016.yaml
  text: And Yahweh their God will save them on that day as the flock of his people[b][a], for they will sparkle like the stones of a crown over his land.
translation:
  language: hi
  text: उस दिन याहवे, उनका परमेश्वर, उन्हें अपनी प्रजा के झुंड के समान बचाएगा; क्योंकि वे उसकी भूमि पर मुकुट के रत्नों[a] के समान दमकेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मुकुट के पत्थर’। इसे ‘मुकुट के रत्न’ कहा जा सकता है; कम सम्भावना से, ‘समर्पित पत्थर’ भी, क्योंकि ‘मुकुट’ के लिए प्रयुक्त इब्रानी शब्द में अभिषेक या समर्पण की संगति हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसकी भूमि के ऊपर मुकुट के रत्नों के समान ऊँचे उठाए जाएँगे।’ इब्रानी क्रिया केवल चमकने ही नहीं, बल्कि ऊँचा उठाए जाने या प्रमुखता से प्रदर्शित होने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹשִׁיעָם
  choice: उन्हें ... बचाएगा
  rationale: ישׁע के हिफ़ील रूप में बचाने, छुड़ाने और विजय दिलाने का भाव हो सकता है। ‘बचाएगा’ इन अर्थों को अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम יהוה का लिप्यंतरण किया गया है, ताकि इसे सामान्य उपाधि में न बदला जाए।
- source_word: אֱלֹהֵיהֶם
  choice: उनका परमेश्वर
  rationale: सर्वनाम-प्रत्यय सहित इब्रानी पद का सीधा अनुवाद है और वाचा-संबंधी निकटता को बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: भविष्यद्वाणी के इस प्रचलित कालवाचक पद का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: כְּצֹאן עַמּוֹ
  choice: अपनी प्रजा के झुंड के समान
  rationale: צֹאן के सामूहिक चरवाही-बिंब और עַמּוֹ के संबंध को बनाए रखता है। वाक्यांश में यह भी सुनाई दे सकता है कि वह उन्हें उस प्रकार बचाता है जैसे किसी झुंड को बचाया जाता है; मुख्य पाठ लोगों को उसके झुंड के रूप में चित्रित करने वाली अधिक स्वाभाविक समझ रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पिछले कथन से व्याख्यात्मक अथवा कारणसूचक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַבְנֵי נֵזֶר
  choice: मुकुट के रत्नों
  rationale: शाब्दिक बिंब ‘मुकुट के पत्थर’ का आशय आभूषण-जड़े मूल्यवान पत्थरों से है; ‘मुकुट के रत्न’ हिन्दी में काव्यात्मक और बोधगम्य है। נֵזֶר में समर्पण/अभिषेक की संगति भी हो सकती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִתְנוֹסְסוֹת
  choice: दमकेंगे
  rationale: रत्नों के प्रसंग में यह प्रमुखता से दिखाई देने और दीप्त होने का काव्यात्मक भाव देता है। क्रिया में ऊपर उठाए या प्रमुखता से प्रदर्शित किए जाने की सम्भावना भी है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: עַל אַדְמָתוֹ
  choice: उसकी भूमि पर
  rationale: אֲדָמָה के लिए ‘भूमि’ स्वाभाविक है। निकटतम व्याकरणिक संदर्भ में ‘उसकी’ याहवे की भूमि को सूचित करता है, यद्यपि वह उसकी प्रजा की भूमि के रूप में भी समझी जा सकती है।
theological_decisions:
- issue: झुंड और मुकुट के रत्नों के बिंबों का संबंध
  choice: याहवे अपनी प्रजा को बचाता है; वही प्रजा पहले उसके झुंड और फिर उसकी भूमि पर दमकते मुकुट के रत्नों के रूप में चित्रित होती है।
  alternative: ‘झुंड के समान’ को बचाने की रीति के रूप में समझा जा सकता है, और ‘मुकुट के पत्थर’ को स्मारक अथवा समर्पित पत्थरों के रूप में भी लिया जा सकता है।
  rationale: वाक्य-विन्यास लोगों को याहवे की प्रजा रूपी झुंड और फिर बहुमूल्य, प्रमुखता से दिखाई देने वाले रत्नों के रूप में पढ़ने का समर्थन करता है। पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्पों को खुला रखती हैं।
- issue: ‘उसकी भूमि’ में सर्वनाम का संदर्भ
  choice: ‘उसकी’ को याहवे से संबद्ध रखा गया है।
  alternative: इसे याहवे के अधिकार में उसकी प्रजा की भूमि की ओर संकेत करते हुए भी सुना जा सकता है।
  rationale: पुल्लिंग एकवचन प्रत्यय का निकट और प्रमुख संदर्भ याहवे है; हिन्दी में सर्वनाम को यथावत रखने से मूल की संभावित व्यापकता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘याहवे’ विशिष्ट ईश्वरीय नाम को सुरक्षित रखता है; ‘झुंड’, ‘भूमि’, ‘मुकुट के रत्न’ और ‘दमकेंगे’ मूल के चरवाही तथा राजकीय बिंबों को सामान्य पाठक के लिए स्पष्ट रखते हैं।
