translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। नगरों के लिए हिन्दी के स्वाभाविक पुल्लिंग क्रिया-रूप प्रयुक्त हुए हैं। भविष्यसूचक लय और न्याय की तीव्रता को संक्षिप्त वाक्य-विन्यास में बनाए रखा गया है।
