  to: अश्कलोन देखेगा और डर जाएगा; गाज़ा बहुत तड़पेगा, और एक्रोन भी, क्योंकि उसकी आशा को लज्जित किया गया है। गाज़ा से एक राजा नष्ट हो जाएगा, और अश्कलोन में कोई नहीं बसेगा।
