  text: תֵּרֶ֨א אַשְׁקְל֜וֹן וְ/תִירָ֗א וְ/עַזָּה֙ וְ/תָחִ֣יל מְאֹ֔ד וְ/עֶקְר֖וֹן כִּֽי הֹבִ֣ישׁ מֶבָּטָ֑/הּ וְ/אָ֤בַד מֶ֨לֶךְ֙ מֵֽ/עַזָּ֔ה וְ/אַשְׁקְל֖וֹן לֹ֥א תֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/005.yaml
  text: Ashkelon will see and fear[a]; Gaza also will writhe greatly, and Ekron, because her hope has been put to shame. A king will perish from Gaza[b], and Ashkelon will not be inhabited.
translation:
  language: hi
  text: अश्कलोन देखेगा और डर जाएगा; गाज़ा बहुत तड़पेगा, और एक्रोन भी, क्योंकि उसकी आशा को लज्जित किया गया है। गाज़ा से एक राजा नष्ट हो जाएगा, और अश्कलोन में कोई नहीं बसेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרֶא ... וְתִירָא
  choice: यह देखकर डर जाएगा
  rationale: ראה और ירא के क्रम को स्वाभाविक हिन्दी में कारणात्मक प्रवाह के साथ रखा गया है। ‘यह’ पिछले प्रसंग में वर्णित न्याय की ओर संकेत करता है, यद्यपि इब्रानी में कर्म स्पष्ट रूप से नहीं दिया गया।
- source_word: וְתָחִיל מְאֹד
  choice: भी बहुत तड़पेगा
  rationale: חול/חיל यहाँ तीव्र शारीरिक और भावनात्मक व्याकुलता व्यक्त करता है। ‘बहुत तड़पेगा’ इस प्रबल भाव को सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: כִּי הֹבִישׁ מֶבָּטָהּ
  choice: क्योंकि जिस पर उसने आशा लगाई थी, वह उसे लज्जित करेगा
  rationale: מֶבָּטָהּ केवल मनोभाव नहीं, आशा या अपेक्षा के आधार को भी सूचित कर सकता है; הֹבִישׁ का कारक भाव उस आधार के निराशाजनक और लज्जाजनक सिद्ध होने को व्यक्त करता है।
- source_word: וְאָבַד מֶלֶךְ מֵעַזָּה
  choice: गाज़ा से राजा मिट जाएगा
  rationale: מֶלֶךְ अनिश्चित है और אָבַד शासन से राजा के लुप्त या नष्ट हो जाने को बताता है। हिन्दी में लेख न होने के कारण ‘राजा’ स्वाभाविक रूप से यह अर्थ वहन करता है।
- source_word: לֹא תֵשֵׁב
  choice: कोई नहीं बसेगा
  rationale: नगर को कर्ता बनाकर शाब्दिक ‘नहीं बसाया जाएगा’ की अपेक्षा यह हिन्दी में अधिक सहज ढंग से अश्कलोन के निर्जन होने का भाव देता है।
- source_word: אַשְׁקְלוֹן / עַזָּה / עֶקְרוֹן
  choice: अश्कलोन / गाज़ा / एक्रोन
  rationale: स्थान-नामों का आधुनिक हिन्दी देवनागरी में प्रचलित या स्रोत-सन्निकट लिप्यंतरण किया गया है।
