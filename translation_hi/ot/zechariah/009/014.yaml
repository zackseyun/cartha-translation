source:
  edition: WLC
  text: וַֽ/יהוָה֙ עֲלֵי/הֶ֣ם יֵֽרָאֶ֔ה וְ/יָצָ֥א כַ/בָּרָ֖ק חִצּ֑/וֹ וַֽ/אדֹנָ֤/י יְהֹוִה֙ בַּ/שּׁוֹפָ֣ר יִתְקָ֔ע וְ/הָלַ֖ךְ בְּ/סַעֲר֥וֹת תֵּימָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/014.yaml
  text: Then Yahweh will appear over them[a], and his arrow will go out like lightning[b]; and the Lord GOD will sound the trumpet and march in the whirlwinds of the south.
translation:
  language: hi
  text: तब याहवे उनके ऊपर प्रकट होगा, और उसका तीर बिजली के समान निकलेगा; प्रभु याहवे शोफ़ार[a] फूँकेगा और दक्षिण के बवंडरों[b] में आगे बढ़ेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शोफ़ार’ मेढ़े के सींग से बना वाद्य था, जिसे युद्ध-संकेत या धार्मिक समारोहों में फूँका जाता था।
    reason: cultural_note
  - marker: b
    text: या, “तेमान के बवंडरों में।” इब्रानी शब्द ‘तेमान’ का अर्थ स्थान-नाम ‘तेमान’ अथवा ‘दक्षिण’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित सीधे रूप को रखा गया है, शीर्षक से प्रतिस्थापित नहीं किया गया।
- source_word: עֲלֵיהֶם יֵרָאֶה
  choice: उनके ऊपर प्रकट होगा
  rationale: स्थानिक अर्थ और ईश-प्रकटन की छवि दोनों सुरक्षित रहते हैं; ‘उनके’ का संदर्भ जानबूझकर स्पष्ट नहीं किया गया।
- source_word: וְיָצָא כַבָּרָק חִצּוֹ
  choice: उसका तीर बिजली के समान निकलेगा
  rationale: तीर के छूटने तथा बिजली जैसी तीव्र, चमकदार गति की मूल उपमा को निकटता से व्यक्त करता है।
- source_word: אֲדֹנָי יְהוִה
  choice: प्रभु यहोवा
  rationale: दोनों इब्रानी तत्वों—स्वामित्व-सूचक उपाधि और व्यक्तिगत नाम—को स्पष्ट रूप से बनाए रखता है।
- source_word: בַּשּׁוֹפָר יִתְקָע
  choice: नरसिंगा फूँकेगा
  rationale: ‘नरसिंगा’ सींग से बने युद्ध अथवा समारोह-संकेत वाद्य को सामान्य हिन्दी में व्यक्त करता है; ‘फूँकना’ इस वाद्य के साथ स्वाभाविक क्रिया है।
- source_word: וְהָלַךְ
  choice: आगे बढ़ेगा
  rationale: मूल ‘जाना/चलना’ को युद्ध-संबंधी प्रसंग में स्वाभाविक ढंग से व्यक्त करता है, बिना अनावश्यक रूप से सैन्य ‘कूच’ थोपे।
- source_word: בְּסַעֲרוֹת תֵימָן
  choice: दक्षिण की बवंडरी हवाओं में
  rationale: סַעֲרוֹת के प्रचंड घूमते तूफ़ानी पवनों के बहुवचन चित्र को व्यक्त करता है; תֵימָן का दिशासूचक अर्थ मुख्य पाठ में रखा गया है और स्थान-नाम की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה और संयुक्त पद אֲדֹנָי יְהוִה
  choice: यहोवा … प्रभु यहोवा
  alternative: प्रभु … परमेश्वर प्रभु; याहवे … प्रभु याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को उपाधि में बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से व्यक्त किया गया है; संयुक्त पद में उपाधि और नाम दोनों रखे गए हैं।
- issue: עֲלֵיהֶם में ‘उनके’ का संदर्भ
  choice: उनके ऊपर
  alternative: उनके विरुद्ध; अपने लोगों के ऊपर
  rationale: मूल वाक्य स्थानिक रूप से खुला है। निकटवर्ती प्रसंग सम्भवतः परमेश्वर के लोगों की ओर संकेत करता है, पर मुख्य पाठ में संदर्भ को निर्णायक बनाना उचित नहीं।
- issue: תֵימָן का अर्थ
  choice: दक्षिण
  alternative: तेमान
  rationale: यह शब्द दिशा ‘दक्षिण’ और स्थान-नाम ‘तेमान’ दोनों हो सकता है। तूफ़ानी हवाओं के प्रसंग में दिशासूचक अर्थ सहज है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक युद्ध-प्रकटन की छवियाँ—ऊपर प्रकट होना, बिजली-जैसा तीर, नरसिंगा और बवंडरी हवाएँ—संक्षिप्त तथा प्रत्यक्ष रूप में सुरक्षित हैं।
