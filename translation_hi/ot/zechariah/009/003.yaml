source:
  edition: WLC
  text: וַ/תִּ֥בֶן צֹ֛ר מָצ֖וֹר לָ֑/הּ וַ/תִּצְבָּר כֶּ֨סֶף֙ כֶּֽ/עָפָ֔ר וְ/חָר֖וּץ כְּ/טִ֥יט חוּצֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/003.yaml
  text: Tyre built herself a fortress[a], and piled up silver like dust[b], and gold like the mud of the streets.
translation:
  language: hi
  text: सोर ने अपने लिए एक गढ़[a] बनाया, और चाँदी को धूल के समान तथा सोने को गलियों की कीचड़ के समान ढेर कर लिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किला’ अथवा ‘दुर्ग’। इब्रानी מָצוֹר किसी किलेबंद स्थान या रक्षात्मक निर्माण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सोने’ के लिए ‘खरे सोने’ का अनुवाद भी संभव है। इब्रानी חָרוּץ कुछ संदर्भों में विशेष रूप से परिष्कृत सोने को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: सोर
  rationale: यह फ़ोनीकी नगर Tyre का मानक हिन्दी बाइबलीय नाम है।
- source_word: וַתִּבֶן
  choice: बनाया
  rationale: वय्यिक्तोल रूप भूतकाल की क्रिया बताता है; ‘बनाया’ सहज और सीधा अनुवाद है।
- source_word: מָצוֹר
  choice: गढ़
  rationale: संदर्भ में यह नगर की सुरक्षा के लिए बनाए गए किलेबंद स्थान या रक्षात्मक दुर्ग को सूचित करता है; ‘गढ़’ संक्षिप्त और स्वाभाविक है।
- source_word: לָהּ
  choice: अपने लिए
  rationale: स्त्रीलिंग एकवचन प्रत्यय नगर सोर की ओर संकेत करता है; हिन्दी में ‘अपने लिए’ इसका स्वाभाविक प्रतिवर्ती भाव रखता है।
- source_word: וַתִּצְבָּר
  choice: ढेर कर लिया
  rationale: क्रिया बड़ी मात्रा में इकट्ठा करने का ठोस चित्र देती है, जिसे आगे की उपमाएँ पुष्ट करती हैं।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: सोने के साथ समानांतर होने के कारण यहाँ धन के बजाय धातु का अर्थ उपयुक्त है।
- source_word: כֶּעָפָר
  choice: धूल के समान
  rationale: यह अत्यधिक बहुतायत की उपमा को स्पष्ट और काव्यात्मक रूप में बनाए रखता है।
- source_word: חָרוּץ
  choice: सोना
  rationale: इस संदर्भ में यह बहुमूल्य धातु को सूचित करता है; ‘खरा सोना’ संभव है, पर तत्काल संदर्भ उसे अनिवार्य नहीं बनाता।
- source_word: כְּטִיט חוּצוֹת
  choice: गलियों की कीचड़ के समान
  rationale: यह सार्वजनिक मार्गों में पाई जाने वाली प्रचुर कीचड़ का मूल चित्र सुरक्षित रखता है।
