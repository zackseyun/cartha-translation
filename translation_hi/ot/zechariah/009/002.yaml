base_translation:
  language: en
  yaml_path: translation/ot/zechariah/009/002.yaml
  text: and also Hamath[a], which borders on it; Tyre and Sidon, because they are very wise.
translation:
  language: hi
  text: और हमात भी, जो उसकी सीमा से लगा है; सोर और सीदोन, क्योंकि वे बहुत बुद्धिमान हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमात भी, जो उसकी सीमा से लगा है; सोर और सीदोन, क्योंकि वह बहुत बुद्धिमान है।” हिब्रू में एकवचन और साथ रखे गए नगर-नामों के बीच असहज बदलाव है।
    reason: मूल पाठ के स्त्रीलिंग एकवचन और सोर-सीदोन के संयुक्त उल्लेख से उत्पन्न वचन-संबंधी अस्पष्टता को दर्ज करना।
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: वाव के संयोजक अर्थ और גַּם के समावेशी बल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמָת
  choice: हमात
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: תִּגְבָּל בָּהּ
  choice: जो उसकी सीमा से लगा है
  rationale: גבל के सीमा से लगे होने के अर्थ और स्त्रीलिंग प्रत्यय בָּהּ को बनाए रखता है; ‘उसकी’ का संदर्भ पिछले पद के भूभाग की ओर है।
- source_word: צֹר וְצִידוֹן
  choice: सोर और सीदोन
  rationale: दोनों स्थान-नामों के प्रचलित हिन्दी बाइबलीय रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: मूल के कारणसूचक या व्याख्यात्मक संबंध को बिना विस्तार दिए व्यक्त करता है।
- source_word: חָכְמָה מְאֹד
  choice: वे बहुत बुद्धिमान हैं
  rationale: हिब्रू क्रिया औपचारिक रूप से स्त्रीलिंग एकवचन है, पर सोर और सीदोन की संयुक्त जोड़ी के संदर्भ को आधुनिक हिन्दी में बहुवचन से स्पष्ट किया गया है; מְאֹד का स्वाभाविक अर्थ ‘बहुत’ है।
theological_decisions:
- issue: सोर और सीदोन वाले उपवाक्य का वाक्यगत संबंध
  choice: כִּי को कारणसूचक ‘क्योंकि’ के रूप में रखा गया
  alternative: इसे व्याख्यात्मक ‘निश्चय ही’ या कोष्ठकीय कथन माना जा सकता है
  rationale: मूल पाठ का कारणसूचक तनाव सुरक्षित रहता है और न्याय-वाणी में इन नगरों के उल्लेख का कोई अतिरिक्त धर्मवैज्ञानिक कारण नहीं जोड़ा जाता।
- issue: חָכְמָה में वचन और लिंग का असामंजस्य
  choice: संयुक्त नगर-नामों के लिए ‘वे बहुत बुद्धिमान हैं’
  alternative: ‘क्योंकि वह बहुत बुद्धिमान है’, जहाँ निकटतम नगर सीदोन या नगर-समूह को एकवचन माना जाए
  rationale: बहुवचन हिन्दी में दोनों नगरों को सहज रूप से समेटता है, जबकि पादटिप्पणी मूल हिब्रू के स्त्रीलिंग एकवचन और उससे उपजी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘सीमा से लगा है’ सामान्य पाठक के लिए स्वाभाविक है; नगर-नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
