id: ZEC.13.8
reference: Zechariah 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֤ה בְ/כָל הָ/אָ֨רֶץ֙ נְאֻם יְהוָ֔ה פִּֽי שְׁנַ֣יִם בָּ֔/הּ יִכָּרְת֖וּ יִגְוָ֑עוּ וְ/הַ/שְּׁלִשִׁ֖ית יִוָּ֥תֶר בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/008.yaml
  text: And it will happen in all the land, declares the LORD, that two-thirds in it will be cut off and die, but one-third will be left in it.
translation:
  language: hi
  text: और पूरे देश में ऐसा होगा—यह यहोवा की घोषणा है—कि उसके दो-तिहाई लोग काट डाले जाएँगे और मर जाएँगे, पर एक-तिहाई उसमें बचे रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְכָל־הָאָרֶץ
  choice: पूरे देश में
  rationale: הָאָרֶץ का अर्थ संदर्भ के अनुसार ‘देश’ या ‘पृथ्वी’ हो सकता है। जकर्याह 12–14 के यहूदा और यरूशलेम-केंद्रित संदर्भ में ‘देश’ अधिक स्वाभाविक है, यद्यपि व्यापक अर्थ संभव है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह नबूवत में प्रयुक्त प्रामाणिक घोषणा-सूत्र है; परमेश्वर के व्यक्तिगत नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: פִּי שְׁנַיִם
  choice: दो-तिहाई लोग
  rationale: मुहावरे का अर्थ तीन भागों में से दो भाग है। ‘लोग’ स्पष्टता के लिए जोड़ा गया है, क्योंकि क्रियाएँ बहुवचन हैं और आशय देश में रहने वालों से है।
- source_word: יִכָּרְתוּ יִגְוָעוּ
  choice: काट डाले जाएँगे और मर जाएँगे
  rationale: 'दोनों समन्वित क्रियाओं को अलग रखा गया है: पहली विनाश या हटा दिए जाने को, दूसरी मृत्यु को व्यक्त करती है।'
- source_word: יִוָּתֶר
  choice: बचे रहेंगे
  rationale: निफ़ाल रूप का अर्थ शेष छोड़ दिया जाना या बचा रहना है; हिंदी में ‘बचे रहेंगे’ स्वाभाविक और संदर्भानुकूल है।
theological_decisions:
- issue: ‘देश’ में दो-तिहाई और एक-तिहाई किसके सूचक हैं
  choice: पाठ में ‘लोग’ कहकर मानवीय समूह स्पष्ट किया, पर किसी विशिष्ट ऐतिहासिक या अंतिम-कालीन पहचान को निर्धारित नहीं किया
  alternative: इसे विशेष रूप से इस्राएल, समस्त मानवजाति, या किसी निश्चित अंतिम-कालीन समुदाय के रूप में अनूदित करना
  rationale: मूल पद स्वयं समूह की ऐसी विशिष्ट पहचान नहीं करता; निकटवर्ती संदर्भ के संकेतों को रखते हुए व्याख्यात्मक अतिरेक से बचना उचित है।
- issue: ‘काट डाले जाएँगे’ और ‘मर जाएँगे’ का संबंध
  choice: दोनों क्रियाओं को समन्वित और पृथक रखा
  alternative: दोनों को मिलाकर केवल ‘नष्ट हो जाएँगे’ कहना
  rationale: मूल इब्रानी में दो क्रियाएँ हैं; उन्हें बनाए रखने से कथन की तीव्रता और संभावित अर्थ-भेद सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गंभीर, स्पष्ट और वाचनयोग्य नबूवतीय गद्य। वाक्य-विन्यास मूल की घोषणा-शैली को बनाए रखता है, जबकि ‘लोग’ का सीमित स्पष्टकारी प्रयोग हिंदी में अर्थ को सहज बनाता है।
