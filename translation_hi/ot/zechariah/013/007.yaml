  text: חֶ֗רֶב עוּרִ֤י עַל רֹעִ/י֙ וְ/עַל גֶּ֣בֶר עֲמִיתִ֔/י נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת הַ֤ךְ אֶת הָֽ/רֹעֶה֙ וּ/תְפוּצֶ֣יןָ הַ/צֹּ֔אן וַ/הֲשִׁבֹתִ֥י יָדִ֖/י עַל הַ/צֹּעֲרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/007.yaml
  text: Awake[a], O sword, against my shepherd, against the man who is my companion, declares Yahweh of Armies. Strike the shepherd, and the sheep will be scattered[c][b]; and I will turn my hand against the little ones.
translation:
  language: hi
  text: “हे तलवार, जाग उठ! मेरे चरवाहे के विरुद्ध, उस मनुष्य के विरुद्ध जो मेरा सहचर है[a]”—सेनाओं के यहोवा[b] की यह घोषणा है। “चरवाहे पर प्रहार कर, और भेड़ें तितर-बितर हो जाएँगी; और मैं छोटों की ओर अपना हाथ फिराऊँगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो मेरा निकट साथी है”; संभवतः “जो मेरे समान है।” इब्रानी शब्द किसी निकट संबद्ध व्यक्ति को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: “सेनाओं के यहोवा” का अनुवाद “सेनाओं का प्रभु” भी किया जाता है।
    reason: lexical_alternative
  - marker: c
    text: या “मैं छोटों के विरुद्ध अपना हाथ करूँगा,” अथवा “मैं छोटों पर अपना हाथ फिराऊँगा।” यह मुहावरा उनके विरुद्ध कार्रवाई, या अधिक सामान्य रूप से उनकी ओर फिरकर व्यवहार करने को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֶרֶב עוּרִי
  choice: हे तलवार, जाग उठ!
  rationale: तलवार को सीधे संबोधित करने वाला सजीव मानवीकरण और स्त्रीलिंग एकवचन आज्ञार्थक का बल सुरक्षित रखा गया है।
- source_word: רֹעִי
  choice: मेरे चरवाहे
  rationale: संज्ञा रूप में प्रयुक्त कृदंत और प्रथम पुरुष संबंधसूचक प्रत्यय का सीधा, स्वाभाविक अनुवाद।
- source_word: גֶּבֶר עֲמִיתִי
  choice: उस पुरुष के विरुद्ध जो मेरा निकट साथी है
  rationale: גֶּבֶר का सामान्य व्यक्तिगत अर्थ ‘पुरुष’ रखा गया है; עֲמִיתִי की घनिष्ठ संबद्धता दिखाने के लिए ‘निकट साथी’ चुना गया, बिना ‘मेरे समान’ जैसा अधिक निश्चित तात्त्विक अर्थ थोपे।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की यह घोषणा है
  rationale: נְאֻם को प्रामाणिक भविष्यद्वाणी-घोषणा के रूप में और יהוה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया; צְבָאוֹת का अर्थ आधुनिक हिन्दी में स्पष्ट किया गया।
- source_word: הַךְ
  choice: प्रहार कर
  rationale: नכה के आज्ञार्थक का बल आधुनिक और गरिमापूर्ण हिन्दी में सुरक्षित रहता है।
- source_word: וּתְפוּצֶיןָ הַצֹּאן
  choice: और भेड़ें तितर-बितर हो जाएँगी
  rationale: चरवाहे की छवि के अनुरूप הצאן को ‘भेड़ें’ और परिणामी बिखराव को सहज हिन्दी में व्यक्त किया गया है।
- source_word: וַהֲשִׁבֹתִי יָדִי עַל
  choice: फिर मैं ... पर अपना हाथ फेरूँगा
  rationale: हिब्रू मुहावरे की दिशात्मक अस्पष्टता बनाए रखी गई है; मुख्य पाठ न तो निश्चित रूप से दंडात्मक ‘विरुद्ध’ कहता है, न निश्चित रूप से संरक्षण का अर्थ आरोपित करता है।
- source_word: הַצֹּעֲרִים
  choice: छोटे लोगों
  rationale: צעיר में निहित आयु, आकार या सामाजिक अल्पता की व्यापकता को ‘छोटे’ कुछ हद तक खुला रखता है; केवल बच्चों या मेमनों तक अर्थ सीमित नहीं किया गया।
theological_decisions:
- issue: עֲמִיתִי द्वारा चरवाहे और यहोवा के संबंध का स्वरूप
  choice: जो मेरा निकट साथी है
  alternative: जो मेरा सहचर है; जो मेरे समान है
  rationale: शब्द घनिष्ठ संबंध या संबद्धता बताता है, किंतु अपने आप में किसी बाद की तात्त्विक व्याख्या को निर्णायक नहीं बनाता। मुख्य पाठ संबंध की निकटता रखता है और अधिक प्रबल विकल्प पादटिप्पणी में देता है।
- issue: छोटों की ओर हाथ फेरने का आशय
  choice: अपना हाथ फेरूँगा
  alternative: अपना हाथ उनके विरुद्ध करूँगा; अपना हाथ उनकी ओर फिराऊँगा
  rationale: संदर्भ दंडात्मक कार्रवाई का समर्थन कर सकता है, पर मुहावरा व्यापक रूप से फिर से उनकी ओर कार्रवाई करने को भी सूचित कर सकता है। इसलिए मूल तनाव को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में भविष्यद्वाणी-संबंधी गरिमा और काव्यात्मक प्रत्यक्ष संबोधन रखा गया है। वाक्य साधारण पाठक के लिए स्पष्ट है, जबकि עֲמִיתִי और हाथ फेरने वाले मुहावरे की वास्तविक अर्थगत तथा धर्मवैचारिक अस्पष्टता पादटिप्पणियों में सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
