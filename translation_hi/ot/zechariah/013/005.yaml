base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/005.yaml
  text: And he will say[a], ‘I am not a prophet; I am a man who works the ground, for the land has been my possession from my youth.’
translation:
  language: hi
  text: तब वह कहेगा, “मैं नबी नहीं हूँ; मैं भूमि पर काम करनेवाला आदमी हूँ, क्योंकि एक मनुष्य ने मुझे युवावस्था से ही अपने अधिकार में कर लिया था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कठिन हिब्रू वाक्यांश का अनुवाद ‘क्योंकि एक मनुष्य ने मुझे युवावस्था से ही खरीद लिया था’ भी हो सकता है। प्रयुक्त क्रिया अर्जित करने, खरीदने या अपने अधिकार में लेने का भाव दे सकती है; यहाँ संबंध का ठीक-ठीक स्वरूप अस्पष्ट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: तब वह कहेगा
  rationale: भविष्यसूचक प्रसंग में वाव के साथ पूर्ण क्रिया आगे होने वाली घटना को व्यक्त करती है; इसलिए भविष्यकाल और प्रसंगगत क्रम के लिए ‘तब’ स्वाभाविक है।
- source_word: נָבִיא
  choice: नबी
  rationale: यह आधुनिक हिन्दी में बाइबलीय ‘भविष्यद्वक्ता’ के लिए प्रचलित, स्पष्ट और संक्षिप्त शब्द है।
- source_word: אִישׁ עֹבֵד אֲדָמָה
  choice: भूमि जोतनेवाला मनुष्य
  rationale: यह אִישׁ को व्यक्त करता है और עֹבֵד אֲדָמָה के कृषि-संबंधी, जारी व्यवसाय के भाव को सहज हिन्दी में रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले उपवाक्य को वक्ता के कथन के स्पष्टीकरण के रूप में जोड़ता है।
- source_word: אָדָם
  choice: एक मनुष्य
  rationale: मसोरेटी पाठ में यह एकवचन, अनिश्चित मानवीय कर्ता है; इसे ‘भूमि’ मानना पाठ में प्रत्यक्ष रूप से उपस्थित अर्थ नहीं है।
- source_word: הִקְנַנִי
  choice: मुझे ... अपने अधिकार में कर लिया था
  rationale: קנה के अर्जित करने, खरीदने या अधिकार में लेने के अर्थ-क्षेत्र को हिन्दी में व्यापक ढंग से व्यक्त करता है, बिना दासत्व अथवा किसी खास सामाजिक व्यवस्था को निश्चित किए।
- source_word: מִנְּעוּרָי
  choice: युवावस्था से ही
  rationale: यह आरंभ-बिंदु से निरंतरता के संभावित भाव सहित मूल समय-सूचक पद का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: वक्ता की पहचान और उसके कथन की सत्यता
  choice: वक्ता के नबी होने से इनकार और कृषि-कार्य के दावे को बिना निर्णय दिए प्रस्तुत किया गया है।
  alternative: इसे स्पष्ट रूप से किसी झूठे नबी का छलपूर्ण बचाव या किसी पूर्व नबी का सच्चा त्याग बताना।
  rationale: आस-पास का प्रसंग लज्जित होकर भविष्यवाणी से इनकार करने की स्थिति बताता है, पर यह पद स्वयं दावे की सत्यता निश्चित नहीं करता।
- issue: הִקְנַנִי का सामाजिक और वैधानिक आशय
  choice: ‘अपने अधिकार में कर लिया था’ जैसा व्यापक रूप
  alternative: ‘मुझे खरीद लिया था’, ‘मुझे बेच दिया था’, या ‘मुझसे खेती करवाता रहा है’
  rationale: दुर्लभ क्रियारूप और प्रसंग के कारण सटीक संबंध अस्पष्ट है। मुख्य पाठ मूल के अर्जन/अधिकार के केंद्रीय भाव को रखता है और विकल्प पादटिप्पणी में देता है।
- issue: אָדָם को भूमि के रूप में समझना
  choice: मसोरेटी पाठ के अनुसार ‘एक मनुष्य’
  alternative: ‘भूमि मेरी संपत्ति रही है’ या ‘मैं युवावस्था से किसान रहा हूँ’
  rationale: אָדָם का सामान्य अर्थ ‘मनुष्य’ है; ‘भूमि’ वाला अर्थ אֲדָמָה से आता, जो इस अंतिम उपवाक्य में नहीं है। इसलिए अंग्रेज़ी परामर्श-पाठ के बजाय मूल हिब्रू को प्राथमिकता दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भूमि जोतनेवाला’ कृषि-व्यवसाय को स्पष्ट करता है, जबकि अंतिम कठिन उपवाक्य की वास्तविक हिब्रू अस्पष्टता पादटिप्पणी में सुरक्षित है।
