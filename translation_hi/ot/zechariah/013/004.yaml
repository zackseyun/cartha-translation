  text: וְ/הָיָ֣ה בַּ/יּ֣וֹם הַ/ה֗וּא יֵבֹ֧שׁוּ הַ/נְּבִיאִ֛ים אִ֥ישׁ מֵ/חֶזְיֹנ֖/וֹ בְּ/הִנָּֽבְאֹת֑/וֹ וְ/לֹ֧א יִלְבְּשׁ֛וּ אַדֶּ֥רֶת שֵׂעָ֖ר לְמַ֥עַן כַּחֵֽשׁ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/004.yaml
  text: And on that day the prophets will each be ashamed of his vision when he prophesies[b][a], and they will not put on a hairy cloak in order to deceive.
translation:
  language: hi
  text: और उस दिन ऐसा होगा कि हर एक भविष्यद्वक्ता अपने दर्शन के विषय में, जब वह भविष्यवाणी करेगा, लज्जित होगा; और वे छल करने के लिए बालों वाला खुरदरा चोगा[a] नहीं पहनेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बालों का लबादा।” यह भविष्यद्वक्ताओं के रूप-रंग से जुड़ा खुरदरा वस्त्र था। इब्रानी के अंतिम शब्दों का अर्थ “झूठ बोलने के लिए” भी हो सकता है।
    reason: अद्‍देरेत सेआर के वैकल्पिक शब्दार्थ तथा כחש के “झूठ बोलना/छल करना” वाले अर्थ-क्षेत्र को सुरक्षित रखता है।
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם הַהוּא
  choice: और उस दिन ऐसा होगा कि
  rationale: यह भविष्य की स्थिति का परिचय देने वाला सामान्य भविष्यसूचक सूत्र है; हिन्दी में यह स्वाभाविक रहते हुए उसके संक्रमणकारी बल को बनाए रखता है।
- source_word: יֵבֹשׁוּ
  choice: लज्जित होंगे
  rationale: यह क्रिया लज्जा या अपमान को व्यक्त करती है। यह अनुवाद इस अस्पष्टता को खुला रखता है कि लज्जा भीतर से अनुभव की गई है या भंडाफोड़ होने के कारण आई है।
- source_word: הַנְּבִיאִים אִישׁ
  choice: भविष्यद्वक्ता अपने-अपने
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में है। ‘अपने-अपने’ प्रत्येक भविष्यद्वक्ता को अलग-अलग उभारता है और आधुनिक हिन्दी में सहज है।
- source_word: מֵחֶזְיֹנוֹ
  choice: अपने-अपने दर्शन के कारण
  rationale: लज्जित होने की क्रिया के साथ מִן लज्जा के कारण या विषय को दर्शा सकता है। ‘के कारण’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּהִנָּבְאֹתוֹ
  choice: भविष्यद्वाणी करते समय
  rationale: बेथ-युक्त infinitive construct का समयवाचक बल है; यह वाक्यांश उसी समय-संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: אַדֶּרֶת שֵׂעָר
  choice: बालों का खुरदरा चोगा
  rationale: यह बालों से बने या बालदार, खुरदरे बाहरी वस्त्र को दर्शाता है, जो भविष्यद्वक्ताओं के रूप से जुड़ा हो सकता था। ‘खुरदरा’ वस्त्र की प्रकृति स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक रूप देती है।
- source_word: לְמַעַן כַּחֵשׁ
  choice: छल करने के लिए
  rationale: כחש झूठ बोलने या छल करने को व्यक्त कर सकता है। यहाँ भविष्यद्वक्ता-जैसा वस्त्र अपनाकर दूसरों को भ्रमित करने के संदर्भ में ‘छल करने’ उपयुक्त है।
theological_decisions:
- issue: क्या הַנְּבִיאִים का अनुवाद स्पष्ट रूप से ‘झूठे भविष्यद्वक्ता’ किया जाए
  choice: केवल ‘भविष्यद्वक्ता’ रखा गया
  alternative: ‘झूठे भविष्यद्वक्ता’
  rationale: व्यापक संदर्भ झूठी भविष्यद्वाणी की ओर संकेत करता है, पर इस पद में संज्ञा केवल ‘भविष्यद्वक्ता’ है। ‘झूठे’ जोड़ने से मूल पाठ की अपेक्षा व्याख्या अधिक निश्चित हो जाती।
- issue: כחש को ‘झूठ बोलना’ या ‘छल करना’ समझना
  choice: ‘छल करना’
  alternative: ‘झूठ बोलना’
  rationale: दोनों अर्थ संभव हैं। वस्त्र पहनकर भ्रामक भविष्यसूचक पहचान प्रस्तुत करने के संदर्भ में ‘छल करना’ अधिक स्वाभाविक है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘भविष्यद्वक्ता’ पारंपरिक बाइबलीय शब्दावली को बनाए रखता है; वाक्य-विन्यास मूल की भविष्यसूचक गंभीरता के साथ स्वाभाविक हिन्दी प्रवाह देता है।
