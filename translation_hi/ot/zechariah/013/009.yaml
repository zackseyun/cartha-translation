  text: וְ/הֵבֵאתִ֤י אֶת הַ/שְּׁלִשִׁית֙ בָּ/אֵ֔שׁ וּ/צְרַפְתִּי/ם֙ כִּ/צְרֹ֣ף אֶת הַ/כֶּ֔סֶף וּ/בְחַנְתִּ֖י/ם כִּ/בְחֹ֣ן אֶת הַ/זָּהָ֑ב ה֣וּא יִקְרָ֣א בִ/שְׁמִ֗/י וַֽ/אֲנִי֙ אֶעֱנֶ֣ה אֹת֔/וֹ אָמַ֨רְתִּי֙ עַמִּ֣/י ה֔וּא וְ/ה֥וּא יֹאמַ֖ר יְהוָ֥ה אֱלֹהָֽ/י־־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/009.yaml
  text: And I will bring the third part through the fire[a], and I will refine them as silver is refined, and test them as gold is tested. He will call on my name, and I will answer him. I will say, ‘He is my people,’ and he will say, ‘Yahweh is my God.’
translation:
  language: hi
  text: और मैं उस एक-तिहाई भाग को आग में से होकर ले आऊँगा[a]; मैं उन्हें वैसे शुद्ध करूँगा जैसे चाँदी शुद्ध की जाती है, और उन्हें वैसे परखूँगा जैसे सोना परखा जाता है। वह मेरा नाम पुकारेगा, और मैं उसे उत्तर दूँगा। मैं कहूँगा, ‘वह मेरी प्रजा है,’ और वह कहेगा, ‘याहवे मेरा परमेश्वर है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “आग में ले आऊँगा।” इब्रानी वाक्यांश आग में लाने का अधिक शाब्दिक भाव रखता है; संदर्भ में यह शोधन की अग्नि से होकर ले जाने का बिंब है।'
    reason: मुख्य पाठ में शोधन-प्रक्रिया का निहित भाव स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक शाब्दिक ‘आग में’ विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: הַשְּׁלִשִׁית
  choice: उस एक-तिहाई भाग
  rationale: संज्ञीकृत स्त्रीलिंग क्रमवाचक पद पिछले पद में बचे हुए तीसरे भाग की ओर संकेत करता है। ‘उस एक-तिहाई भाग’ संदर्भ और अंशात्मक अर्थ दोनों स्पष्ट करता है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: הֵבֵאתִי के साथ यह आग में लाए जाने और शोधन की प्रक्रिया में प्रवेश का बोध देता है। हिन्दी में ‘आग में ले आऊँगा’ मूल संरचना और धातु-शोधन के रूपक को स्वाभाविक ढंग से रखता है।
- source_word: וּצְרַפְתִּים
  choice: मैं उन्हें ... शुद्ध करूँगा
  rationale: צרף धातुओं को गलाकर मैल अलग करने, अर्थात शुद्ध करने, के लिए प्रयुक्त होता है। ‘शुद्ध करना’ आधुनिक हिन्दी में स्पष्ट है और चाँदी के समानांतर उपयुक्त बैठता है।
- source_word: וּבְחַנְתִּים
  choice: उन्हें ... परखूँगा
  rationale: בחן असलियत या गुणवत्ता जाँचने का अर्थ देता है। ‘परखना’ सोने की कसौटी के रूपक और लोगों की परीक्षा—दोनों को बनाए रखता है।
- source_word: הוּא יִקְרָא בִשְׁמִי
  choice: वह मेरा नाम पुकारेगा
  rationale: קרא בשם यहाँ प्रार्थना या उपासना में किसी का नाम पुकारने का प्रचलित अर्थ रखता है। यह हिन्दी में सहज और धर्मवैचारिक रूप से अनावश्यक विस्तार से मुक्त है।
- source_word: וַאֲנִי אֶעֱנֶה אֹתוֹ
  choice: और मैं उसे उत्तर दूँगा
  rationale: एकवचन सर्वनाम सामूहिक बचे हुए समुदाय को प्रतिनिधिक एकवचन में प्रस्तुत करता है; हिन्दी में ‘उसे’ उसी व्याकरणिक तनाव को बनाए रखता है।
- source_word: עַמִּי הוּא
  choice: वह मेरी प्रजा है
  rationale: मूल में ‘प्रजा’ सामूहिक संज्ञा है, पर उसके साथ एकवचन सर्वनाम है। हिन्दी का यह रूप मूल के प्रतिनिधिक एकवचन और वाचा-सूत्र को बिना बहुवचन में समतल किए सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהָי
  choice: मेरा परमेश्वर
  rationale: यह प्रथम पुरुष एकवचन संबंधसूचक रूप है। ‘मेरा परमेश्वर’ व्यक्तिगत वाचा-स्वीकार को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम वाचा-सूत्र में बहुवचन से एकवचन की ओर परिवर्तन
  choice: ‘उन्हें’ के बाद ‘वह/उसे’ और ‘वह मेरी प्रजा है’ को बनाए रखा गया।
  alternative: ‘वे मेरा नाम पुकारेंगे ... वे मेरी प्रजा हैं ... याहवे हमारा परमेश्वर है।’
  rationale: इब्रानी पाठ पहले बचे हुए लोगों के लिए बहुवचन और फिर उसी सामूहिक समुदाय के लिए प्रतिनिधिक एकवचन प्रयोग करता है। इसे बहुवचन बनाकर सहज करना संभव है, पर ऐसा करने से पाठ का वास्तविक व्याकरणिक और धर्मवैचारिक तनाव मिट जाएगा।
- issue: दिव्य नाम יהוה का रूप
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी विशिष्ट सम्प्रदायगत परंपरा को प्राथमिकता नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। धातु-शोधन के समानांतर बिंबों को ‘शुद्ध करना’ और ‘परखना’ से रखा गया है। सामूहिक प्रजा के लिए मूल का चिह्नित प्रतिनिधिक एकवचन जानबूझकर सुरक्षित है।
