  text: וְ/הָיָ֗ה כִּֽי יִנָּבֵ֣א אִישׁ֮ עוֹד֒ וְ/אָמְר֣וּ אֵ֠לָי/ו אָבִ֨י/ו וְ/אִמּ֤/וֹ יֹֽלְדָי/ו֙ לֹ֣א תִֽחְיֶ֔ה כִּ֛י שֶׁ֥קֶר דִּבַּ֖רְתָּ בְּ/שֵׁ֣ם יְהוָ֑ה וּ/דְקָרֻ֜/הוּ אָבִ֧י/הוּ וְ/אִמּ֛/וֹ יֹלְדָ֖י/ו בְּ/הִנָּבְאֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/003.yaml
  text: And it will happen that if a man still prophesies[a], his father and his mother who bore him will say to him, ‘You shall not live, because you have spoken lies in the name of Yahweh’[b]; and his father and his mother who bore him will pierce him through when he prophesies.
translation:
  language: hi
  text: और ऐसा होगा कि यदि कोई मनुष्य फिर भी भविष्यवाणी करे[a], तो उसके पिता और उसकी माता, जिन्होंने उसे जन्म दिया, उससे कहेंगे, “तू जीवित नहीं रहेगा, क्योंकि तूने याहवे के नाम से झूठ बोला है”; और उसके पिता और उसकी माता, जिन्होंने उसे जन्म दिया, जब वह भविष्यवाणी कर रहा होगा, उसे आर-पार छेद देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर भविष्यवाणी करे।” हिब्रू עוֹד जारी अथवा दोबारा होने वाली क्रिया का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसे भोंक देंगे” अथवा “उसे बेध देंगे।” हिब्रू क्रिया किसी हथियार से छेदने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य की परिस्थिति का स्वाभाविक और गरिमापूर्ण परिचय देता है तथा हिब्रू मुहावरे की कथात्मक शक्ति बनाए रखता है।
- source_word: כִּי יִנָּבֵא אִישׁ עוֹד
  choice: यदि कोई मनुष्य फिर भी भविष्यवाणी करे
  rationale: כִּי को प्रसंगानुसार शर्तसूचक, אִישׁ को प्रतिनिधिक एकवचन, और עוֹד को शुद्धिकरण के बाद भी जारी गतिविधि के अर्थ में प्रस्तुत किया गया है।
- source_word: יֹלְדָיו
  choice: जिन्होंने उसे जन्म दिया
  rationale: यह माता-पिता के लिए प्रयुक्त ठोस सहभागी अभिव्यक्ति को केवल ‘माता-पिता’ कहने की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: לֹא תִחְיֶה
  choice: तू जीवित नहीं रहेगा
  rationale: यह कथन की न्यायिक और दंडात्मक गंभीरता को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁקֶר דִּבַּרְתָּ
  choice: तूने ... झूठ बोला है
  rationale: यह आरोप को स्पष्ट रखता है; भविष्यवाणी को स्वयं क्रिया में ‘झूठी’ कहकर अर्थ पहले से नहीं जोड़ता।
- source_word: בְּשֵׁם יְהוָה
  choice: यहवे के नाम से
  rationale: व्यक्तिगत वाचा-नाम को लिप्यंतरित करते हुए प्रतिनिधिक अधिकार के भाव को ‘के नाम से’ में सुरक्षित रखा गया है।
- source_word: וּדְקָרֻהוּ
  choice: उसे आर-पार छेद देंगे
  rationale: דקר हथियार से भेदने की हिंसक क्रिया बताता है; यह चयन उसकी तीव्रता को नरम नहीं करता।
- source_word: בְּהִנָּבְאוֹ
  choice: उसके भविष्यवाणी करते समय
  rationale: בְּ सहित infinitive construct का कालगत संबंध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: झूठे भविष्यद्वक्ता के विरुद्ध माता-पिता की कठोर कार्रवाई
  choice: मृत्युदंड की घोषणा और आर-पार छेदने की कार्रवाई दोनों को स्पष्ट रखा गया है।
  alternative: इसे केवल त्यागने, सामाजिक बहिष्कार या हल्का घायल करने के रूप में नरम करना।
  rationale: हिब्रू पाठ לֹא תִחְיֶה और דקר दोनों के द्वारा कठोर न्याय को प्रत्यक्ष रूप से व्यक्त करता है; अनुवाद को इस तनाव को बनाए रखना चाहिए।
- issue: ईश्वरीय नाम יְהוָה
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-नाम सीधे आया है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। संबोधन में ‘तू’ मूल एकवचन की सीधी और न्यायिक तीव्रता बनाए रखता है। माता-पिता संबंधी दोहराव को मूल की अलंकारिक दृढ़ता के कारण सुरक्षित रखा गया है।
