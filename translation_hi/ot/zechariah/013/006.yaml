base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/006.yaml
  text: And if one says to him[a], “What are these wounds between your hands?” he will say[c][b], “Those with which I was wounded in the house of those who love me.”
translation:
  language: hi
  text: और कोई उससे पूछेगा, “तुम्हारे हाथों के बीच ये घाव क्या हैं?”[a] तब वह उत्तर देगा, “ये वे घाव हैं जो मुझे मुझसे प्रेम करनेवालों के घर में लगे थे।”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘तुम्हारे हाथों के बीच’; सम्भवतः यह बाँहों के बीच, अर्थात छाती या धड़ के भाग के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे प्रेमियों के घर में’; इब्रानी अभिव्यक्ति निकट साथियों, प्रियजनों या घनिष्ठ संबंध रखनेवालों को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: कुछ मसीही व्याख्याकार इन घावों को मसीह की पीड़ा से जोड़ते हैं; पर इस पद में यह पहचान स्पष्ट रूप से नहीं की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמַר אֵלָיו
  choice: और कोई उससे पूछेगा
  rationale: इब्रानी में क्रिया का कर्ता पुल्लिंग एकवचन में निहित है, पर उसका परिचय नहीं दिया गया है। प्रसंग के भावी संवाद को स्वाभाविक हिन्दी में व्यक्त करने के लिए अनिश्चित कर्ता ‘कोई’ और प्रश्नसूचक क्रिया ‘पूछेगा’ रखी गई है।
- source_word: הַמַּכּוֹת
  choice: घाव
  rationale: מַכָּה प्रहार अथवा उससे बने घाव, दोनों को सूचित कर सकता है। यहाँ दिखाई देनेवाले चिह्नों के विषय में प्रश्न है, इसलिए ‘घाव’ उपयुक्त है।
- source_word: בֵּין יָדֶיךָ
  choice: तुम्हारे हाथों के बीच
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखा गया है ताकि मूल की अस्पष्टता सुरक्षित रहे; सम्भवतः यह मुहावरे के रूप में बाँहों के बीच, अर्थात छाती या धड़ के भाग को सूचित करती है।
- source_word: הֻכֵּיתִי
  choice: मुझे … लगे थे
  rationale: נכה का होफ़ल रूप निष्क्रिय अर्थ देता है—‘मैं मारा/घायल किया गया।’ हिन्दी में घावों के लिए ‘मुझे … लगे थे’ वही निष्क्रिय भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּית
  choice: घर में
  rationale: यह בַּיִת का संबंधसूचक रूप है। ‘घर में’ स्थान का सीधा अर्थ रखता है, यद्यपि यहाँ परिवार या संगति का भाव भी सम्भव है।
- source_word: מְאַהֲבָי
  choice: अपने प्रेम करनेवालों
  rationale: אהב के कृदन्त का अर्थ ‘मुझसे प्रेम करनेवाले’ या ‘मेरे प्रेमी’ है। ‘प्रेम करनेवाले’ निकट संबंध का भाव सुरक्षित रखता है और आधुनिक हिन्दी में अनावश्यक रूप से केवल यौन संबंध का संकेत नहीं देता।
theological_decisions:
- issue: क्या घायल व्यक्ति को मुख्य पाठ में सीधे मसीह और घावों को क्रूस के घावों के रूप में पहचाना जाए
  choice: मुख्य पाठ किसी मसीही पहचान को स्पष्ट रूप से नहीं जोड़ता और इब्रानी पाठ की अस्पष्टता बनाए रखता है।
  alternative: कुछ मसीही व्याख्याकार इन घावों को मसीह के दुःख और क्रूस पर चढ़ाए जाने से जोड़ते हैं; दूसरी व्याख्या में वक्ता झूठा भविष्यद्वक्ता है, जो अपने घावों का उत्तर दे रहा है।
  rationale: पद में केवल दिखाई देनेवाले घावों और उनके विषय में दिए गए उत्तर का वर्णन है; न मसीह का नाम है, न क्रूस का स्पष्ट उल्लेख। इसलिए अनुवाद व्याख्यात्मक पहचान को मुख्य पाठ पर आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण संवाद रखा गया है। संबोधन के लिए ‘तुम’ मूल के एकवचन निकट संबोधन को स्वाभाविक रूप से व्यक्त करता है। शाब्दिक ‘हाथों के बीच’ को मुख्य पाठ में रखकर उसके सम्भावित मुहावरेदार अर्थ को पादटिप्पणी में दिया गया है।
