language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא נְאֻ֣ם יְהוָ֣ה צְבָא֗וֹת אַכְרִ֞ית אֶת שְׁמ֤וֹת הָֽ/עֲצַבִּים֙ מִן הָ/אָ֔רֶץ וְ/לֹ֥א יִזָּכְר֖וּ ע֑וֹד וְ/גַ֧ם אֶת הַ/נְּבִיאִ֛ים וְ/אֶת ר֥וּחַ הַ/טֻּמְאָ֖ה אַעֲבִ֥יר מִן הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/002.yaml
  text: And it shall happen in that day[a], declares Yahweh of hosts, that I will cut off the names of the idols from the land, and they shall be remembered no more[b]. And also I will remove from the land the prophets and the unclean spirit.
translation:
  language: hi
  text: “उस दिन ऐसा होगा,” सेनाओं के यहोवा की यह वाणी है, “कि मैं इस देश से मूर्तियों के नाम मिटा दूँगा, और फिर कभी उनका स्मरण नहीं किया जाएगा। मैं भविष्यवक्ताओं[a] और अशुद्ध आत्मा[b] को भी इस देश से दूर कर दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भविष्यवक्ताओं’ से प्रसंगतः वे अवैध भविष्यवक्ता अभिप्रेत हैं जो मूर्ति-पूजा और अशुद्धता से जुड़े थे।
    reason: cultural_note
  - marker: b
    text: या, ‘अशुद्धता की आत्मा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: ऐसा होगा
  rationale: यह भविष्य में होने वाली घटना का परिचय देने वाला भविष्यसूचक सूत्र है। ‘ऐसा होगा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके भाव को बनाए रखता है।
- source_word: בַיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक साहित्य का प्रचलित काल-सूचक पद है; ‘उस दिन’ संक्षिप्त, स्वाभाविक और अर्थ-सटीक है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की यह वाणी है
  rationale: נְאֻם को परमेश्वर की अधिकारपूर्ण घोषणा के रूप में व्यक्त किया गया है। יהוה को ‘यहोवा’ और צְבָאוֹת को उसके मूल सामूहिक सैन्य बोध के अनुरूप ‘सेनाओं के’ कहा गया है।
- source_word: אַכְרִית
  choice: मिटा दूँगा
  rationale: כרת का हिफ़ील रूप यहाँ निर्णायक रूप से समाप्त कर देने या हटा देने का अर्थ देता है। ‘मिटा दूँगा’ मूर्तियों के नाम और स्मृति के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: שְׁמוֹת הָעֲצַבִּים
  choice: मूर्तियों के नाम
  rationale: עֲצַבִּים यहाँ उपासना की मूर्तियों को सूचित करता है। ‘नाम’ को स्पष्ट रूप से बनाए रखने से उनके पूजागत अस्तित्व और स्मृति, दोनों के उन्मूलन का भाव सुरक्षित रहता है।
- source_word: מִן הָאָרֶץ
  choice: इस देश से
  rationale: इस प्रसंग में הָאָרֶץ का आशय उस देश से है जहाँ वाचा-समुदाय रहता है। हिन्दी में निश्चित पद को स्वाभाविक ढंग से व्यक्त करने के लिए ‘इस देश’ चुना गया है।
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: फिर कभी उनका स्मरण नहीं किया जाएगा
  rationale: निफ़ाल की कर्मवाच्य रचना और भविष्य में पूर्ण विस्मरण, दोनों को यह अनुवाद स्पष्ट रूप से बनाए रखता है।
- source_word: וְגַם
  choice: भी
  rationale: यह अगले शुद्धिकरण-कार्य को पहले कार्य से जोड़ता है। हिन्दी में क्रिया के साथ ‘भी’ रखना संयोजक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנְּבִיאִים
  choice: भविष्यवक्ताओं
  rationale: मूल पाठ केवल ‘भविष्यवक्ताओं’ कहता है, ‘झूठे’ विशेषण नहीं जोड़ता। नकारात्मक आशय निकटवर्ती प्रसंग से सामने आता है और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: רוּחַ הַטֻּמְאָה
  choice: अशुद्ध आत्मा
  rationale: यह संबंधसूचक पद अशुद्धता से चिह्नित आत्मा को सूचित कर सकता है। ‘अशुद्ध आत्मा’ स्वाभाविक हिन्दी है, जबकि वैकल्पिक अधिक अमूर्त अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַעֲבִיר
  choice: दूर कर दूँगा
  rationale: עבר का हिफ़ील यहाँ हटा देने या चले जाने के लिए विवश करने का अर्थ देता है। ‘दूर कर दूँगा’ देश से निष्कासन का भाव स्पष्ट करता है।
theological_decisions:
- issue: क्या הַנְּבִיאִים को मुख्य पाठ में ‘झूठे भविष्यवक्ता’ कहा जाए
  choice: मुख्य पाठ में केवल ‘भविष्यवक्ताओं’ रखा गया है और प्रसंगगत आशय पादटिप्पणी में बताया गया है।
  alternative: झूठे भविष्यवक्ताओं
  rationale: मूर्ति-पूजा और अशुद्ध आत्मा को हटाने का प्रसंग इन भविष्यवक्ताओं को अवैध या छलपूर्ण सिद्ध करता है, पर मूल इब्रानी में ‘झूठे’ विशेषण नहीं है। उसे मुख्य पाठ में जोड़ना मूल की तनावपूर्ण अभिव्यक्ति को समय से पहले सुलझा देता।
- issue: רוּחַ הַטֻּמְאָה व्यक्तिगत आत्मिक सत्ता है या अशुद्धता का प्रभाव
  choice: अशुद्ध आत्मा
  alternative: अशुद्धता की आत्मा
  rationale: इब्रानी संबंधसूचक रचना दोनों प्रकार की समझ के लिए कुछ गुंजाइश रखती है। मुख्य अनुवाद संभावित व्यक्तिगत/आत्मिक अर्थ को स्वाभाविक हिन्दी में प्रस्तुत करता है, और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। भविष्यसूचक घोषणा को उद्धरण-चिह्नों से स्पष्ट किया गया है। ‘सेनाओं के यहोवा’ मूल उपाधि को पारदर्शी ढंग से सुरक्षित रखता है; ‘इस देश से’ और ‘दूर कर दूँगा’ सामान्य आधुनिक हिन्दी में स्वाभाविक हैं।
