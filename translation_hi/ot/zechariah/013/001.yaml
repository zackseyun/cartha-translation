  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִֽהְיֶה֙ מָק֣וֹר נִפְתָּ֔ח לְ/בֵ֥ית דָּוִ֖יד וּ/לְ/יֹשְׁבֵ֣י יְרֽוּשָׁלִָ֑ם לְ/חַטַּ֖את וּ/לְ/נִדָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/013/001.yaml
  text: On that day a fountain will be opened for the house of David and for the inhabitants of Jerusalem[c][b][a], for sin and for impurity.
translation:
  language: hi
  text: उस दिन दाऊद के घराने और यरूशलेम के निवासियों के लिए एक सोता[a] खोला जाएगा, पाप[b] और अशुद्धता[c] से शुद्धि के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झरना” अथवा “जल-स्रोत”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “पापबलि” भी हो सकता है, यद्यपि यहाँ शुद्धिकरण का संदर्भ “पाप” अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: या “अपवित्रता।” इब्रानी शब्द विशेष रूप से मासिक धर्म से जुड़ी अशुद्धता या अधिक व्यापक धार्मिक-अनुष्ठानिक अशुद्धता को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यसूचक समय-सूचक सूत्र का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: מָקוֹר
  choice: सोता
  rationale: यह शब्द बहते जल के प्राकृतिक स्रोत या झरने को दर्शाता है। हिन्दी में “सोता” इस शुद्ध करने वाले जल-स्रोत की छवि को स्वाभाविक रूप से बनाए रखता है।
- source_word: נִפְתָּח
  choice: खोल दिया जाएगा
  rationale: यह פתח का निष्क्रिय रूप है। भविष्यकालीन निष्क्रिय क्रिया मूल भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: לְבֵית דָּוִיד
  choice: दाऊद के घराने के लिए
  rationale: यहाँ ל उपलब्धता या हित का भाव देता है। “घराना” राजवंश और उससे जुड़े समुदाय, दोनों के सामूहिक अर्थ को बनाए रखता है।
- source_word: וּלְיֹשְׁבֵי יְרוּשָׁלִָם
  choice: और यरूशलेम के निवासियों के लिए
  rationale: यह सहभागी संज्ञा वहाँ रहने वाले लोगों को सामूहिक रूप से दर्शाती है; “निवासी” आधुनिक मानक हिन्दी में स्पष्ट है।
- source_word: לְחַטַּאת
  choice: पाप से शुद्ध करेगा
  rationale: חַטָּאת का सामान्य अर्थ “पाप” है, यद्यपि यह “पापबलि” भी हो सकता है। सोते और अशुद्धता के संदर्भ में शुद्ध किए जाने का अर्थ मुख्य पाठ में सर्वाधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּלְנִדָּה
  choice: और अशुद्धता से शुद्ध करेगा
  rationale: נִדָּה विशेष रूप से मासिक धर्म से जुड़ी अशुद्धता या व्यापक रूप से धार्मिक-अनुष्ठानिक अशुद्धता को दर्शा सकता है। सामान्य “अशुद्धता” संदर्भ की व्यापकता को सुरक्षित रखती है।
theological_decisions:
- issue: भविष्यसूचक शुद्धिकरण के साधन की पहचान
  choice: सोते की छवि और पाप तथा अशुद्धता से शुद्ध करने के उसके उद्देश्य को व्यक्त किया गया है, पर उसके साधन की आगे धर्मसैद्धान्तिक पहचान नहीं की गई।
  alternative: सोते को प्रायश्चित, मसीह के लहू या किसी अन्य बाद की धर्मसैद्धान्तिक व्याख्या के रूप में स्पष्ट करना।
  rationale: पद परमेश्वर द्वारा उपलब्ध कराए गए शुद्धिकरण को प्रस्तुत करता है, पर स्वयं उसके तंत्र या बाद की धर्मसैद्धान्तिक पूर्ति को निर्दिष्ट नहीं करता।
- issue: חַטָּאת का अर्थ
  choice: मुख्य पाठ में “पाप” लिया गया है।
  alternative: “पापबलि”।
  rationale: शुद्ध करने वाले सोते और साथ आए נִדָּה के कारण “पाप” संदर्भ में अधिक उपयुक्त है, फिर भी मूल शब्द की वास्तविक द्विअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यसूचक लहजा रखा गया है। “जो उन्हें…शुद्ध करेगा” हिन्दी में उद्देश्य और सोते की शुद्धिकारी भूमिका को स्पष्ट करता है, बिना उसके धर्मसैद्धान्तिक साधन को परिभाषित किए। सभी पादटिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
