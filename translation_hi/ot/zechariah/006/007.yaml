source:
  edition: WLC
  text: וְ/הָ/אֲמֻצִּ֣ים יָצְא֗וּ וַ/יְבַקְשׁוּ֙ לָ/לֶ֨כֶת֙ לְ/הִתְהַלֵּ֣ך בָּ/אָ֔רֶץ וַ/יֹּ֕אמֶר לְכ֖וּ הִתְהַלְּכ֣וּ בָ/אָ֑רֶץ וַ/תִּתְהַלַּ֖כְנָה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/007.yaml
  text: And the strong ones came out and sought to go[a], to walk throughout the earth. And he said, “Go[b], walk throughout the earth,” and they walked throughout the earth.
translation:
  language: hi
  text: और बलवान[a] निकल आए और पूरी पृथ्वी[b] पर घूमने के लिए जाने की इच्छा की। तब उसने कहा, “जाओ, पूरी पृथ्वी पर घूमो।” और वे पूरी पृथ्वी पर घूमे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चितकबरे”; परंपरागत रूप से इसे घोड़ों या उनके दलों के रंग का संकेत माना गया है। मसोरेटी पाठ में दिए गए स्वरांकन के अनुसार इब्रानी शब्द का अधिक स्वाभाविक अर्थ “बलवान” है।
    reason: alternative_reading
  - marker: b
    text: या “सारे देश में”; इब्रानी אֶרֶץ का अर्थ प्रसंग के अनुसार “पृथ्वी” या “देश/भूमि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲמֻצִּים
  choice: बलवान
  rationale: मसोरेटी स्वरांकन के अनुसार यह अमץ मूल से बना विशेषण है, जिसका सामान्य अर्थ सामर्थी या बलवान है। आसपास के प्रसंग में घोड़ों के रंगों का उल्लेख होने के कारण रंग-सूचक अर्थ भी संभव माना गया है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: יָצְאוּ
  choice: निकले
  rationale: יצא का मूल अर्थ बाहर निकलना है; दृश्य के वर्णन में हिंदी का सरल ‘निकले’ स्वाभाविक और स्रोत के निकट है।
- source_word: וַיְבַקְשׁוּ לָלֶכֶת
  choice: जाने की इच्छा की
  rationale: בקש यहाँ चाहने या जाने का अवसर माँगने का भाव दे सकता है। ‘इच्छा की’ अभिप्राय को व्यक्त करता है, पर स्पष्ट रूप से ‘अनुमति माँगी’ जोड़कर स्रोत से अधिक नहीं कहता।
- source_word: לְהִתְהַלֵּךְ / הִתְהַלְּכוּ / וַתִּתְהַלַּכְנָה
  choice: घूमने / घूमो / घूमे
  rationale: הלך के हित्पएल रूप यहाँ किसी क्षेत्र में इधर-उधर या चारों ओर चलते रहने का भाव देते हैं। ‘घूमना’ इस पुनरावृत्त गतिशीलता को सहज हिंदी में बनाए रखता है; ‘गश्त लगाना’ अधिक व्याख्यात्मक होता।
- source_word: בָּאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है। इस दर्शन में विभिन्न दिशाओं में भेजे गए दैवी प्रतिनिधियों का व्यापक कार्यक्षेत्र ‘पृथ्वी’ के अनुकूल है; ‘सारी’ पूरे क्षेत्र में घूमने के भाव को व्यक्त करती है।
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है और कर्ता निहित है। ‘उसने’ वक्ता की पहचान को अनावश्यक रूप से स्पष्ट किए बिना व्याकरणिक रूप बनाए रखता है।
- source_word: לְכוּ
  choice: जाओ
  rationale: यह הלך का सीधा बहुवचन आज्ञार्थक रूप है।
theological_decisions:
- issue: दर्शन में אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश या भूमि
  rationale: चारों दिशाओं में निकलने वाले दैवी प्रतिनिधियों का प्रसंग विश्वव्यापी दायरे की ओर संकेत करता है, पर शब्द का स्थानीय ‘देश/भूमि’ अर्थ भी संभव है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: הָאֲמֻצִּים की पहचान
  choice: बलवान
  alternative: चितकबरे या गहरे रंग के
  rationale: मुख्य पाठ मसोरेटी स्वरांकन के बल-संबंधी अर्थ का अनुसरण करता है। निकटवर्ती पदों में घोड़ों के रंग होने के कारण रंग-सूचक पारंपरिक व्याख्या को पादटिप्पणी में रखा गया है, ताकि वास्तविक पाठगत तनाव न मिटे।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण वर्णनात्मक स्तर रखा गया है। ‘घूमना’ सामान्य पाठक के लिए सहज है और मूल में बार-बार आए हित्पएल रूपों की पुनरावृत्ति को तीनों स्थानों पर बनाए रखता है। निहित वक्ता को केवल ‘उसने’ कहा गया है, ताकि पाठ से बाहर की पहचान न जोड़ी जाए।
