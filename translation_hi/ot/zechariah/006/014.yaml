base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/014.yaml
  text: And the crowns shall be for Helem[a], Tobijah, Jedaiah, and Hen son of Zephaniah, as a memorial in the temple of Yahweh.
translation:
  language: hi
  text: और मुकुट हेलेम[a], तोबियाह, यदायाह और सपन्याह के पुत्र हेन के लिए होंगे और यहवे के मंदिर में स्मारक के रूप में रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जकर्याह 6:10 में हेलेम को ‘हेल्दय’ कहा गया है; संभव है कि ये उसी नाम के दो रूप हों।
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲטָרֹת
  choice: मुकुट
  rationale: इब्रानी संज्ञा बहुवचन है। हिन्दी में ‘मुकुट’ का रूप एकवचन और बहुवचन दोनों में समान रह सकता है; ‘होंगे’ और ‘वे’ से बहुवचन स्पष्ट है।
- source_word: תִּהְיֶה
  choice: होंगे
  rationale: एकवचन क्रिया-रूप के बावजूद बहुवचन कर्ता ‘मुकुट’ के अनुरूप स्वाभाविक हिन्दी में बहुवचन रखा गया है; भावी/परिणामी अर्थ सुरक्षित है।
- source_word: לְחֵלֶם
  choice: हेलेम
  rationale: इस पद के मसोराई पाठ में आए व्यक्तिवाचक नाम का लिप्यंतरण; 6:10 के ‘हेल्दय’ से इसका अंतर पादटिप्पणी में रखा गया है।
- source_word: וּלְטוֹבִיָּה
  choice: तोबियाह
  rationale: हिब्रू व्यक्तिवाचक नाम का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: וְלִידַעְיָה
  choice: यदायाह
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: וּלְחֵן
  choice: हेन
  rationale: ‘सपन्याह के पुत्र’ के बाद आने के कारण חֵן यहाँ सामान्य संज्ञा ‘अनुग्रह’ नहीं, व्यक्तिवाचक नाम के रूप में समझा गया है।
- source_word: בֶּן צְפַנְיָה
  choice: सपन्याह के पुत्र
  rationale: पितृ-परिचय बताने वाली इब्रानी रचना का स्वाभाविक हिन्दी रूप।
- source_word: לְזִכָּרוֹן
  choice: स्मारक बने रहें
  rationale: वस्तुओं को मन्दिर में स्मरणार्थ सुरक्षित रखने का उद्देश्य और स्थायी स्मारक का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בְּהֵיכַל
  choice: मन्दिर में
  rationale: यहवे के संदर्भ में הֵיכָל राजमहल नहीं, मन्दिर/पवित्रस्थान को सूचित करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: ईश्वरीय निज नाम का देवनागरी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
theological_decisions:
- issue: इस पद और जकर्याह 6:10 के बीच नाम-भिन्नता
  choice: इस पद के मसोराई पाठ के अनुसार ‘हेलेम’ और ‘हेन’ रखा गया है।
  alternative: ‘हेलेम’ को ‘हेल्दय’ से समरूप करना, अथवा ‘हेन’ का अर्थ ‘अनुग्रह’ करना।
  rationale: निकटवर्ती पद से सामंजस्य बैठाने के लिए मूल पाठ को बदला नहीं गया; वास्तविक पाठगत/नामगत तनाव सुरक्षित रखा गया है।
- issue: מुकुटों का स्मारक होना
  choice: मुकुट स्वयं यहवे के मन्दिर में स्मारक बने रहेंगे।
  alternative: इसे केवल उल्लिखित व्यक्तियों की स्मृति का अस्पष्ट संकेत मानना।
  rationale: לְזִכָּרוֹן का सीधा प्रयोजनात्मक अर्थ रखा गया है, जबकि स्मारक किस-किस बात की याद दिलाता है, उसे अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘मुकुट’ का रूप हिन्दी में बहुवचन में भी अपरिवर्तित रहता है, इसलिए बहुवचन क्रिया और सर्वनाम से संख्या स्पष्ट की गई है। सभी नाम देवनागरी में स्रोत-निकट रूप से लिप्यंतरित हैं।
