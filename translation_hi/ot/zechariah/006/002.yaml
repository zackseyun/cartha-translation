  text: בַּ/מֶּרְכָּבָ֥ה הָ/רִֽאשֹׁנָ֖ה סוּסִ֣ים אֲדֻמִּ֑ים וּ/בַ/מֶּרְכָּבָ֥ה הַ/שֵּׁנִ֖ית סוּסִ֥ים שְׁחֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/002.yaml
  text: In the first chariot were red horses, and in the second chariot black horses.
translation:
  language: hi
  text: पहले रथ में लाल घोड़े थे, और दूसरे रथ में काले घोड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּמֶּרְכָּבָה
  choice: रथ में
  rationale: מֶרְכָּבָה का सामान्य अर्थ ‘रथ’ है। उपसर्ग ב यहाँ स्थान अथवा संबंध बताता है; दर्शन के इस वर्णन में स्वाभाविक हिन्दी ‘रथ में’ है।
- source_word: הָרִאשֹׁנָה
  choice: पहले
  rationale: यह विशेषण दर्शन में आए रथों का क्रम बताता है; ‘पहले’ सहज और सीधा हिन्दी रूप है।
- source_word: סוּסִים
  choice: घोड़े
  rationale: यह ‘घोड़े’ के लिए प्रयुक्त सामान्य बहुवचन संज्ञा है; संदर्भ में अर्थ को सीमित या विस्तृत करने का कोई कारण नहीं है।
- source_word: אֲדֻמִּים
  choice: लाल
  rationale: यह लाल रंग सूचित करने वाला विशेषण है। ‘लाल’ दर्शन के दृश्यात्मक वर्णन में इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: וּבַמֶּרְכָּבָה
  choice: और ... रथ में
  rationale: संयोजक और पूर्वसर्ग पहली उपवाक्य-संरचना को दोहराते हैं; हिन्दी में इसे स्पष्ट रखकर मूल समानांतरता सुरक्षित की गई है।
- source_word: הַשֵּׁנִית
  choice: दूसरे
  rationale: यह क्रम में अगले रथ को सूचित करने वाला विशेषण है; ‘दूसरे’ सीधा और मुहावरेदार रूप है।
- source_word: שְׁחֹרִים
  choice: काले
  rationale: यह काले रंग का सामान्य विशेषण है। ‘काले’ मूल दर्शन में लाल घोड़ों के साथ दृश्यात्मक विरोध को बनाए रखता है।
