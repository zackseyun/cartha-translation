base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/010.yaml
  text: Take from the exiles—from Heldai[a], from Tobijah, and from Jedaiah—and you yourself shall go on that day and enter the house of Josiah the son of Zephaniah[d][c][b], who have come from Babylon.
translation:
  language: hi
  text: निर्वासित समुदाय[a] से—हेल्दै, तोबिय्याह और यदायाह से—ले। तू स्वयं उसी दिन जा[b] और सपन्याह के पुत्र योशिय्याह के घर पहुँच; ये लोग बाबेल से आए हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वासितों से।” हिब्रू शब्द निर्वासन की अवस्था के बजाय निर्वासित लोगों के समूह को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू क्रिया का अनुवाद दृष्टिकोण के अनुसार “आ” या “जा” किया जा सकता है; यहाँ जकर्याह को दूसरे स्थान पर जाने की आज्ञा दी गई है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “आए हैं” बहुवचन है; इसका सबसे स्वाभाविक संबंध हेल्दै, तोबिय्याह और यदायाह से है, केवल योशिय्याह से नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: לָקוֹחַ
  choice: ले
  rationale: यहाँ काल इनफ़िनिटिव ऐब्सोल्यूट आज्ञात्मक अर्थ में प्रयुक्त है। हिन्दी का संक्षिप्त आज्ञार्थक ‘ले’ उसी बल को स्वाभाविक रूप से व्यक्त करता है; वस्तु इस पद में स्पष्ट नहीं की गई है।
- source_word: מֵאֵת הַגּוֹלָה
  choice: निर्वासित समुदाय से
  rationale: הַגּוֹלָה अमूर्त ‘निर्वासन’ के बजाय निर्वासित अथवा लौटे हुए निर्वासित लोगों के समुदाय को सूचित करता है।
- source_word: חֶלְדַּי / טוֹבִיָּה / יְדַעְיָה
  choice: हेल्दै / तोबिय्याह / यदायाह
  rationale: व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּבָאתָ אַתָּה
  choice: तू स्वयं ... जाकर
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ दूसरे स्थान की ओर गति के कारण ‘जाकर’ स्वाभाविक है, और स्पष्ट सर्वनाम אַתָּה का बल ‘स्वयं’ से सुरक्षित रखा गया है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: हिन्दी में यह पदबंध संदर्भित दिन और निर्देश की तात्कालिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבָאתָ בֵּית
  choice: घर जा
  rationale: दूसरे בוא को हिन्दी में ‘घर जा’ कहना स्वाभाविक है और घर के भीतर प्रवेश का ऐसा अतिरिक्त दावा नहीं करता जो हिब्रू में अनिवार्य नहीं है।
- source_word: אֲשֶׁר בָּאוּ מִבָּבֶל
  choice: ये लोग बाबेल से आए हैं
  rationale: בָּאוּ बहुवचन है। स्वतंत्र उपवाक्य और ‘ये लोग’ निकटवर्ती एकवचन योशियाह के बजाय पहले बताए तीन व्यक्तियों की ओर संकेत को स्पष्ट करते हैं।
theological_decisions:
- issue: अंतिम बहुवचन संबंधवाचक उपवाक्य का पूर्वपद
  choice: इसे हेल्दै, तोबिय्याह और यदायाह से संबंधित माना गया है
  alternative: इसे केवल योशियाह या उसके घराने से संबंधित मानना
  rationale: हिब्रू क्रिया בָּאוּ बहुवचन है, जबकि निकटवर्ती योशियाह एकवचन है; इसलिए तीन नामित व्यक्तियों से संबंध व्याकरण और संदर्भ दोनों के अनुसार अधिक स्वाभाविक है। यह निर्णय धर्मसिद्धान्त पर नहीं, वचन-विन्यास पर आधारित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘तू’ एकवचन आज्ञा और निकट संबोधन को बनाए रखता है; ‘स्वयं’ मूल के बलाघात को व्यक्त करता है। मूल पद में ली जाने वाली वस्तु अनिर्दिष्ट है, इसलिए अनुवाद ने उसे अगले पद से आयात नहीं किया।
