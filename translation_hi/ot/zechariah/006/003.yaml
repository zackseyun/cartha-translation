  yaml_path: translation/ot/zechariah/006/003.yaml
  text: and in the third chariot[a], white horses; and in the fourth chariot, dappled horses, strong ones.
translation:
  language: hi
  text: और तीसरे रथ में[a] सफ़ेद घोड़े थे, और चौथे रथ में चितकबरे, बलवान घोड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “और चौथे रथ में चितकबरे घोड़े और बलवान घोड़े थे,” यदि “बलवान” को चितकबरे घोड़ों का दूसरा वर्णन न मानकर एक अलग समूह माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַמֶּרְכָּבָה
  choice: और ... रथ में
  rationale: ב का अर्थ यहाँ ‘में’ या ‘पर’ हो सकता है; रथ से जुते घोड़ों के दल के लिए हिन्दी में ‘रथ में’ स्वाभाविक और स्पष्ट है।
- source_word: הַשְּׁלִשִׁית
  choice: तीसरे
  rationale: ‘रथ’ को विशेषित करने वाला सामान्य क्रमवाचक विशेषण।
- source_word: סוּסִים
  choice: घोड़े
  rationale: मानक बहुवचन संज्ञा; दोनों खंडों में समान रूप से अनूदित।
- source_word: לְבָנִים
  choice: सफ़ेद
  rationale: रंग के लिए प्रचलित आधुनिक हिन्दी शब्द।
- source_word: הָרְבִעִית
  choice: चौथे
  rationale: ‘रथ’ को विशेषित करने वाला सामान्य क्रमवाचक विशेषण।
- source_word: בְּרֻדִּים
  choice: चितकबरे
  rationale: यह शब्द मिश्रित रंग अथवा धब्बों वाली आकृति बताता है; घोड़ों के लिए ‘चितकबरे’ स्वाभाविक हिन्दी है।
- source_word: אֲמֻצִּים
  choice: बलवान
  rationale: मूल אמץ से शक्ति और दृढ़ता का भाव निकलता है; ‘बलवान’ गरिमापूर्ण और सहज है।
theological_decisions:
- issue: क्या אֲמֻצִּים चितकबरे घोड़ों का दूसरा वर्णन है या अलग घोड़ा-समूह को सूचित करता है
  choice: 'मुख्य पाठ में इसे चौथे रथ के घोड़ों का दूसरा वर्णन माना गया: ‘चितकबरे, बलवान घोड़े।’'
  alternative: ‘चितकबरे घोड़े—और बलवान घोड़े,’ अर्थात इसे एक अलग समूह माना जा सकता है।
  rationale: इब्रानी में ‘घोड़े’ के बाद दोनों विशेषण क्रम से आते हैं और संज्ञा दोहराई नहीं गई है, इसलिए दोनों को एक ही दल का वर्णन मानना सहज है। फिर भी अलग समूह वाली व्याख्या सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। मूल के संक्षिप्त सूची-विन्यास को पठनीय हिन्दी के लिए ‘थे’ जोड़कर व्यक्त किया गया है। ‘चितकबरे’ घोड़ों के संदर्भ में स्वाभाविक है और रंग-विविधता का दृश्य भाव बनाए रखता है।
