base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/005.yaml
  text: Then the angel answered and said to me[a], “These are the four winds of heaven, going out from standing before the Lord of all the earth.”
translation:
  language: hi
  text: तब स्वर्गदूत ने उत्तर देकर मुझसे कहा, “ये आकाश की चार हवाएँ[a] हैं, जो सारी पृथ्वी के प्रभु के सामने उपस्थित रहने के बाद निकल रही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग की चार आत्माएँ।” इब्रानी शब्द का अर्थ “हवाएँ” या “आत्माएँ,” दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר אֵלַי
  choice: उत्तर देकर मुझसे कहा
  rationale: इब्रानी के दोहरे कथन-सूत्र ‘उत्तर दिया और मुझसे कहा’ को स्वाभाविक आधुनिक हिन्दी में रखते हुए दोनों क्रियाओं का भाव सुरक्षित करता है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: दर्शन के संदर्भ में यह व्याख्या करने वाले स्वर्गीय संदेशवाहक को सूचित करता है; आधुनिक बाइबलीय हिन्दी में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है।
- source_word: אַרְבַּע רֻחוֹת הַשָּׁמַיִם
  choice: आकाश की चार हवाएँ
  rationale: רוּחוֹת का मूल अर्थ यहाँ ब्रह्मांडीय और दिशात्मक चित्र के अनुरूप ‘हवाएँ’ लिया गया है; ‘आत्माएँ’ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: יוֹצְאוֹת
  choice: निकल रही हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत जारी गति को व्यक्त करता है; हिन्दी का अपूर्ण वर्तमान रूप इसे स्वाभाविक ढंग से दर्शाता है।
- source_word: מֵהִתְיַצֵּב עַל
  choice: के सामने खड़ी होकर
  rationale: התייצב किसी अधिकारी के सामने अपना स्थान लेने या उपस्थित खड़े रहने का भाव देता है। यह अनुवाद इब्रानी की गति और पूर्व उपस्थिति के संबंध को अत्यधिक व्याख्यायित किए बिना व्यक्त करता है।
- source_word: אֲדוֹן כָּל הָאָרֶץ
  choice: सारी पृथ्वी के प्रभु
  rationale: אֲדוֹן परमेश्वर की सार्वभौम सत्ता का पद है और כָּל הָאָרֶץ का संदर्भ विश्वव्यापी है; इसलिए ‘प्रभु’ और ‘सारी पृथ्वी’ उपयुक्त हैं।
theological_decisions:
- issue: दर्शन में רֻחוֹת का अर्थ
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: इब्रानी शब्द में ‘हवाओं’ और ‘आत्माओं’ दोनों का अर्थ संभव है। चार रथों के संसार में निकलने की दृश्यात्मक और दिशात्मक पृष्ठभूमि में ‘हवाएँ’ मुख्य पाठ के लिए उपयुक्त है, पर स्वर्गीय आत्मिक प्रतिनिधियों का संभावित संकेत पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उत्तर देकर मुझसे कहा’ मूल कथन-सूत्र को बिना अस्वाभाविक पुनरुक्ति के व्यक्त करता है। ‘के सामने खड़ी होकर निकल रही हैं’ मूल की कुछ असामान्य गति-रचना और उसके अर्थगत तनाव को बनाए रखता है।
