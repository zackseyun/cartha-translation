- source_word: דְבַר
  choice: वचन
  rationale: דְבַר יְהוָה की स्थापित भविष्यद्वाणी-संबंधी अभिव्यक्ति में “वचन” स्रोत की औपचारिकता और बाइबलीय अंतर्संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण “यहोवा” से प्रस्तुत किया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: दिशासूचक पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय को स्वाभाविक हिन्दी भविष्यद्वाणी-सूत्र “मेरे पास आया” में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कोलन द्वारा अगले कथन का परिचय
  rationale: यह क्रियारूप आगे आने वाली वाणी की विषयवस्तु प्रस्तुत करता है। हिन्दी में “यह कहते हुए” की अपेक्षा कोलन अधिक स्वाभाविक और संक्षिप्त है तथा वही वाक्यगत कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए परिचित “यहोवा” नाम को बनाए रखता है; पादटिप्पणी मूल हिब्रू रूप स्पष्ट करती है।
translation_notes:
