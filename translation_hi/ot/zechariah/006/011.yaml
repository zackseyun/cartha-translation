base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/011.yaml
  text: Take silver and gold[a], make crowns, and set them on the head of Joshua son of Jehozadak, the high priest.
translation:
  language: hi
  text: तू चाँदी और सोना ले, उनसे मुकुट बना[a], और उन्हें यहोसादाक के पुत्र महायाजक यहोशू के सिर पर रख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मुकुट’ बहुवचन है। कुछ लोग इसे कई भागों से बना एक ही मुकुट समझते हैं और इसलिए इसका अर्थ एकवचन ‘मुकुट’ लेते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: तू ... ले
  rationale: संयोजक वाव के साथ क़ाल पूर्ण 2 पुं. एक. यहाँ भविष्यसूचक निर्देश में आज्ञार्थक अर्थ देता है; हिन्दी में एकवचन संबोधन सहित सीधी आज्ञा स्वाभाविक है।
- source_word: כֶסֶף וְזָהָב
  choice: चाँदी और सोना
  rationale: ये स्पष्ट रूप से धातुओं के नाम हैं; इन्हें ‘धन’ या सामान्य ‘बहुमूल्य धातुएँ’ कहना मूल की विशिष्टता घटा देगा।
- source_word: וְעָשִׂיתָ עֲטָרוֹת
  choice: उनके मुकुट बना
  rationale: עֲטָרוֹת व्याकरणतः बहुवचन है, इसलिए ‘मुकुट’ को बहुवचन अर्थ में रखा गया है। ‘उनके’ चाँदी और सोने से निर्माण का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְשַׂמְתָּ
  choice: रख
  rationale: किसी वस्तु को किसी स्थान पर रखने के लिए यह सरल और स्वाभाविक आधुनिक हिन्दी क्रिया है।
- source_word: בְּרֹאשׁ
  choice: सिर पर
  rationale: पूर्वसर्ग और संज्ञा वस्तुओं को यहोशू के सिर पर रखे जाने का भौतिक स्थान बताते हैं।
- source_word: יְהוֹשֻׁעַ בֶּן יְהוֹצָדָק
  choice: यहोसादाक के पुत्र यहोशू
  rationale: हिन्दी बाइबलीय नाम-परंपरा के अनुरूप नामों का लिप्यंतरण किया गया है और वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: महायाजक
  rationale: यह प्रधान याजकीय पदवी का प्रचलित, स्पष्ट और संक्षिप्त हिन्दी रूप है।
theological_decisions:
- issue: बहुवचन עֲטָרוֹת और यहोशू के एक सिर पर उनका रखा जाना
  choice: मुख्य पाठ में बहुवचन ‘मुकुट’ बनाए रखना
  alternative: इसे एक संयुक्त ‘मुकुट’ मानकर एकवचन में अनुवाद करना
  rationale: इब्रानी संज्ञा स्पष्ट रूप से बहुवचन है। भविष्यसूचक प्रतीकात्मक कार्य में यह रूप अर्थपूर्ण हो सकता है, इसलिए उसे मुख्य पाठ में सुरक्षित रखा गया है; संयुक्त एक मुकुट की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज आज्ञार्थक शैली अपनाई गई है। भविष्यवक्ता से परमेश्वर के प्रत्यक्ष एकवचन संबोधन को ‘तू’ से रखा गया है। हिन्दी में ‘मुकुट’ का लिखित रूप एकवचन और बहुवचन दोनों में समान होने के कारण ‘उनके’ और ‘उन्हें’ बहुवचन अर्थ स्पष्ट करते हैं।
