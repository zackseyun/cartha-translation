id: ZEC.6.12
reference: Zechariah 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֵלָי/ו֙ לֵ/אמֹ֔ר כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת לֵ/אמֹ֑ר הִנֵּה אִ֞ישׁ צֶ֤מַח שְׁמ/וֹ֙ וּ/מִ/תַּחְתָּ֣י/ו יִצְמָ֔ח וּ/בָנָ֖ה אֶת הֵיכַ֥ל יְהוָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/012.yaml
  text: 'And say to him[a], ‘Thus says Yahweh of Armies: Behold, a man—Branch is his name—and he will branch out from his place and build the temple of Yahweh.’'
translation:
  language: hi
  text: 'और उससे कहना, ‘सेनाओं का याहवे यह कहता है: देखो, एक पुरुष है—उसका नाम “अंकुर” है। वह अपने स्थान से[a] अंकुरित होगा और याहवे का मन्दिर बनाएगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “अपने नीचे से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के प्रकट किए हुए व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह צְבָאוֹת के ठोस बहुवचन अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है और ‘याहवे’ के साथ प्रचलित भविष्यवाणी-संबंधी पदबंध बनाता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: भविष्यवाणी की उद्घोषणा में ध्यान आकर्षित करने वाले हिब्रू अव्यय का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: पुल्लिंग एकवचन को स्पष्ट रूप से बनाए रखता है और किसी तटस्थ व्यक्ति-संज्ञा से उसके लिंग को धुँधला नहीं करता।
- source_word: צֶמַח
  choice: अंकुर
  rationale: वनस्पति-विषयक बिंब और नाम-सदृश पदवी दोनों को सुरक्षित रखता है; अगले क्रियापद ‘अंकुरित होगा’ के साथ मूल का शब्द-साम्य भी बना रहता है।
- source_word: שְׁמוֹ
  choice: उसका नाम … है
  rationale: हिब्रू नामकरण-वाक्य को स्वाभाविक हिन्दी में व्यक्त करता है और ‘अंकुर’ को नाम अथवा पदवी के रूप में प्रस्तुत करता है।
- source_word: וּמִתַּחְתָּיו
  choice: अपने स्थान से
  rationale: संकुचित हिब्रू अभिव्यक्ति का प्रसंगानुकूल सहज अर्थ देता है; अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יִצְמָח
  choice: अंकुरित होगा
  rationale: भविष्यसूचक अर्थ तथा צֶמַח के साथ मूल शब्द-क्रीड़ा को सुरक्षित रखता है।
- source_word: וּבָנָה
  choice: और … बनाएगा
  rationale: क्रमिक भविष्यसूचक क्रिया को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: הֵיכַל
  choice: मन्दिर
  rationale: इस प्रसंग में הֵיכַל יְהוָה का स्पष्ट और मानक हिन्दी अर्थ ‘याहवे का मन्दिर’ है।
theological_decisions:
- issue: צֶמַח का मसीहाई संकेत
  choice: मुख्य पाठ में इसे नाम-सदृश ‘अंकुर’ रखा गया है, पर व्यक्ति को स्पष्ट रूप से ‘मसीह’ नहीं कहा गया।
  alternative: इसे केवल सामान्य संज्ञा ‘नई कोंपल’ या ‘शाखा’ मानना, अथवा व्याख्यात्मक रूप से सीधे ‘मसीह’ लिखना।
  rationale: ‘उसका नाम अंकुर है’ वाली रचना पदवी-सदृश प्रयोग का समर्थन करती है। व्यापक भविष्यवाणी-संदर्भ में इसका मसीहाई अनुनाद है, पर अनुवाद को हिब्रू से अधिक स्पष्ट व्याख्या नहीं जोड़नी चाहिए।
- issue: मन्दिर बनाने वाले पुरुष की पहचान
  choice: पाठ के अनुसार केवल ‘एक पुरुष’ और उसके लिए पुल्लिंग क्रियाएँ रखी गई हैं।
  alternative: उसे अनुवाद में स्पष्ट रूप से यहोशू अथवा मसीह कहना।
  rationale: प्रतीक के अभिप्राय पर मतभेद है; यह पद स्वयं उस पुरुष की पहचान ‘अंकुर’ नाम से आगे निश्चित नहीं करता। अतः मूल की अर्थगत खुलावट सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अंकुर—अंकुरित’ से मूल हिब्रू का जानबूझकर किया गया शब्द-साम्य बचाया गया है। पादटिप्पणी-चिह्न उसी वाक्यांश पर रखा गया है जिससे वह संबंधित है।
