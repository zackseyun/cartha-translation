id: ZEC.6.1
reference: Zechariah 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אָשֻׁ֗ב וָ/אֶשָּׂ֤א עֵינַ/י֙ וָֽ/אֶרְאֶ֔ה וְ/הִנֵּ֨ה אַרְבַּ֤ע מַרְכָּבוֹת֙ יֹֽצְא֔וֹת מִ/בֵּ֖ין שְׁנֵ֣י הֶֽ/הָרִ֑ים וְ/הֶ/הָרִ֖ים הָרֵ֥י נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/001.yaml
  text: Then I turned and lifted up my eyes and saw[a], and behold[b], four chariots were coming out from between two mountains—and the mountains were mountains of bronze.
translation:
  language: hi
  text: फिर मैंने मुड़कर अपनी आँखें उठाईं और देखा। और देखो, चार रथ उन दो पहाड़ों[a] के बीच से निकल रहे थे—और वे पहाड़ काँसे[b] के पहाड़ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में निश्चितता स्पष्ट है: “उन दो पहाड़ों।”'
    reason: lexical_alternative
  - marker: b
    text: “काँसा” का अनुवाद “ताँबा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשֻׁב
  choice: फिर मैंने मुड़कर
  rationale: שׁוב यहाँ दर्शन-वर्णन की अगली गतिविधि आरम्भ करता है और इसका अर्थ ‘मुड़ना/लौटना’ हो सकता है। ‘फिर मैंने मुड़कर’ क्रम और शारीरिक दिशा-परिवर्तन, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֶשָּׂא עֵינַי
  choice: अपनी आँखें उठाईं
  rationale: यह दृष्टि को किसी ओर लगाने का सामान्य इब्रानी मुहावरा है। हिन्दी में शाब्दिक बिंब और भविष्यद्वाणी की गरिमा दोनों सहज रूप से बने रहते हैं।
- source_word: וָאֶרְאֶה
  choice: और देखा
  rationale: ראה के दर्शन-संबंधी सामान्य अर्थ और क्रियाओं के क्रम को सीधे रूप में रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर ध्यान खींचता है। ‘और देखो’ आधुनिक हिन्दी में स्पष्ट रहते हुए उसकी जीवंत प्रस्तुतिकरण-शक्ति बचाता है।
- source_word: אַרְבַּע מַרְכָּבוֹת
  choice: चार रथ
  rationale: מַרְכָּבוֹת युद्ध अथवा राजकीय रथों को दर्शाता है; ‘चार रथ’ सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: יֹצְאוֹת
  choice: निकल रहे थे
  rationale: स्त्रीलिंग बहुवचन कृदंत दृश्य में जारी क्रिया को व्यक्त करता है। हिन्दी का अपूर्ण प्रगतिशील रूप उस निरंतरता को बनाए रखता है।
- source_word: מִבֵּין שְׁנֵי הֶהָרִים
  choice: उन दो पहाड़ों के बीच से
  rationale: मूल में ‘पहाड़ों’ के साथ निश्चित उपपद है। ‘उन दो पहाड़ों’ से यह निश्चितता स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहती है।
- source_word: וְהֶהָרִים הָרֵי נְחֹשֶׁת
  choice: और वे पहाड़ काँसे के पहाड़ थे
  rationale: मूल में ‘पहाड़’ की पुनरावृत्ति बल देती है; उसे हिन्दी में भी बनाए रखा गया है। נְחֹשֶׁת के लिए ‘काँसा’ यहाँ विशाल धात्विक दृश्य का पारंपरिक और उपयुक्त अर्थ है।
theological_decisions:
- issue: נְחֹשֶׁת से अभिप्रेत धातु
  choice: काँसा
  alternative: ताँबा
  rationale: यह मुख्यतः शब्दार्थ का प्रश्न है, कोई सिद्धान्तगत निर्धारण नहीं। נְחֹשֶׁת काँसे या ताँबे का संकेत दे सकता है; मुख्य पाठ में ‘काँसा’ रखा गया है और वास्तविक शब्दार्थगत संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण भविष्यद्वाणी-वर्णन के रूप में रखी गई है। ‘और देखो’ दृश्य की आकस्मिकता बनाए रखता है, जबकि ‘पहाड़ों’ की पुनरावृत्ति मूल की बलाघाती शैली को सुरक्षित करती है।
