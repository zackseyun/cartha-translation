source:
  edition: WLC
  text: וּ/רְחוֹקִ֣ים יָבֹ֗אוּ וּ/בָנוּ֙ בְּ/הֵיכַ֣ל יְהוָ֔ה וִ/ידַעְתֶּ֕ם כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/הָיָה֙ אִם שָׁמ֣וֹעַ תִּשְׁמְע֔וּ/ן בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/015.yaml
  text: And those who are far off will come and build in the temple of Yahweh[a], and you will know that Yahweh of Armies has sent me to you[b]. And this will happen if you diligently obey the voice of Yahweh your God.
translation:
  language: hi
  text: और दूर रहनेवाले[b] आएँगे और याहवे के मंदिर का निर्माण करेंगे। और तुम जानोगे कि सेनाओं के प्रभु याहवे[a] ने मुझे तुम्हारे पास भेजा है। और ऐसा तब होगा, यदि तुम सचमुच अपने परमेश्वर याहवे की वाणी मानोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस उपाधि का पारंपरिक अनुवाद ‘सेनाओं का प्रभु’ या ‘सेनाओं का यहोवा’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘दूर रहनेवाले’ भौगोलिक रूप से दूर लोगों—जैसे निर्वासितों—की ओर संकेत कर सकता है; यह किसी अधिक व्यापक समूह को भी दर्शा सकता है, पर पद उस समूह की पहचान स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וּרְחוֹקִים
  choice: दूर रहनेवाले
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में लोगों को दर्शाता है। यह अनुवाद उनकी पहचान तय किए बिना दूरी का भाव बनाए रखता है।
- source_word: יָבֹאוּ
  choice: आएँगे
  rationale: अपूर्ण क्रिया का भाव इस भविष्यसूचक संदर्भ में सामान्य भविष्यकाल है।
- source_word: וּבָנוּ בְּהֵיכַל יְהוָה
  choice: और याहवे के मंदिर के निर्माण में हाथ बँटाएँगे
  rationale: בְהֵיכַל में בְ को सहभागिता के अर्थ में लेकर स्वाभाविक हिन्दी में मंदिर के निर्माण में भाग लेने का भाव व्यक्त किया गया है; ‘हाथ बँटाएँगे’ सहयोगी निर्माण को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: बहुवचन संबोधन और परिणामसूचक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: צְבָאוֹת के सैन्य और व्यापक सामर्थ्य-संबंधी भाव को आधुनिक पाठक के लिए पारदर्शी रखा गया है।
- source_word: שְׁלָחַנִי אֲלֵיכֶם
  choice: ने मुझे तुम्हारे पास भेजा है
  rationale: पूर्ण क्रिया को वर्तमान प्रासंगिकता वाले पूर्ण कार्य के रूप में प्रस्तुत किया गया है और बहुवचन ‘तुम्हारे’ सुरक्षित है।
- source_word: וְהָיָה
  choice: और यह तब होगा
  rationale: आगे आनेवाली शर्त के साथ इस मुहावरे का परिणामसूचक अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: אִם שָׁמוֹעַ תִּשְׁמְעוּן
  choice: यदि तुम सचमुच ... की बात मानोगे
  rationale: धातु שמע की infinitive absolute वाली तीव्रता ‘सचमुच’ से और आज्ञापालन का वाचागत भाव ‘बात मानोगे’ से व्यक्त किया गया है।
- source_word: בְּקוֹל יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे की बात
  rationale: ‘आवाज़ सुनना’ के शाब्दिक रूप के बजाय वाचा-संदर्भ में अधिकारपूर्ण वचन का आज्ञापालन दर्शाने वाला स्वाभाविक हिन्दी मुहावरा चुना गया है।
theological_decisions:
- issue: ‘दूर रहनेवालों’ की पहचान और दायरा
  choice: समूह को केवल ‘दूर रहनेवाले’ कहा गया है।
  alternative: दूर देशों में रहनेवाले यहूदी निर्वासित; या अन्यजातियाँ
  rationale: इब्रानी पद स्वयं समूह की पहचान नहीं बताता। सामान्य अभिव्यक्ति भौगोलिक दूरी तथा संभावित व्यापक अर्थ—दोनों को खुला रखती है।
- issue: अंतिम शर्त और प्रतिज्ञा की पूर्ति का संबंध
  choice: 'अंतिम वाक्य को वास्तविक शर्त के रूप में रखा गया है: ‘यह तब होगा, यदि...’।'
  alternative: इसे केवल सामान्य उपदेश मानना; या शर्त को केवल ‘तुम जानोगे’ से जोड़ना
  rationale: वाक्य-विन्यास प्रतिज्ञा के बाद स्पष्ट शर्त प्रस्तुत करता है, पर यह शर्त पूर्ववर्ती कथन के किस अंश पर ठीक-ठीक लागू होती है, इसे अनुवाद अतिरिक्त रूप से निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाथ बँटाएँगे’ बोलचाल में परिचित है, पर यहाँ निर्माण में सक्रिय सहभागिता का dignified और स्पष्ट भाव देता है। ‘तुम’ सामूहिक बहुवचन संबोधन है।
