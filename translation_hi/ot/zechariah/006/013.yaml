source:
  edition: WLC
  text: וְ֠/הוּא יִבְנֶ֞ה אֶת הֵיכַ֤ל יְהוָה֙ וְ/הֽוּא יִשָּׂ֣א ה֔וֹד וְ/יָשַׁ֥ב וּ/מָשַׁ֖ל עַל כִּסְא֑/וֹ וְ/הָיָ֤ה כֹהֵן֙ עַל כִּסְא֔/וֹ וַ/עֲצַ֣ת שָׁל֔וֹם תִּהְיֶ֖ה בֵּ֥ין שְׁנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/013.yaml
  text: Yes[a], he will build the temple of Yahweh, and he will bear majesty, and he will sit and rule on his throne. And he will be a priest on his throne[c][b], and the counsel of peace will be between the two of them.
translation:
  language: hi
  text: वही याहवे का मंदिर बनाएगा। वह राजसी वैभव[c] धारण करेगा और अपने सिंहासन पर बैठेगा और शासन करेगा। वह अपने सिंहासन पर याजक होगा[a], और उन दोनों के बीच शांति की मन्त्रणा होगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके सिंहासन पर एक याजक होगा।” हिब्रू को इस प्रकार भी समझा जा सकता है कि याजक सिंहासनारूढ़ शासक से अलग व्यक्ति है।
    reason: alternative_reading
  - marker: b
    text: “उन दोनों” से राजकीय और याजकीय भूमिकाएँ अभिप्रेत हो सकती हैं, या शासक और याजक जैसे दो अलग व्यक्ति।
    reason: alternative_reading
  - marker: c
    text: या, “महिमा” अथवा “शोभा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיכַל יְהוָה
  choice: याहवे का मन्दिर
  rationale: इस भविष्यवाणी के सन्दर्भ में הֵיכָל याहवे के पवित्रस्थान को दर्शाता है, इसलिए ‘मन्दिर’ स्वाभाविक है। יְהוָה को उपाधि से बदलने के बजाय परमेश्वर के व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: יִשָּׂא הוֹד
  choice: राजसी वैभव धारण करेगा
  rationale: נשא के ‘उठाने/धारण करने’ के ठोस बिम्ब को बनाए रखते हुए הוֹד की राजकीय गरिमा और शोभा व्यक्त की गई है।
- source_word: וְיָשַׁב וּמָשַׁל עַל כִּסְאוֹ
  choice: अपने सिंहासन पर बैठकर शासन करेगा
  rationale: यह अनुवाद सिंहासन पर बैठने और शासन करने—दोनों हिब्रू क्रियाओं तथा राजकीय बिम्ब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְהָיָה כֹהֵן עַל כִּסְאוֹ
  choice: अपने सिंहासन पर याजक भी होगा
  rationale: क्रियाओं की शृंखला में वही पुल्लिंग एकवचन कर्ता सबसे स्वाभाविक है। ‘भी’ राजकीय और याजकीय कथनों के मेल को सहज हिन्दी में व्यक्त करता है, पर वैकल्पिक व्याकरणिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַעֲצַת שָׁלוֹם
  choice: शान्ति की सम्मति
  rationale: עֵצָה में परामर्श, सम्मति, योजना या उद्देश्य के अर्थ हो सकते हैं। ‘सम्मति’ विचार-विमर्श और सहमति के भाव को संक्षेप में व्यक्त करती है, बिना इसे केवल निजी योजना बना देने के।
- source_word: בֵּין שְׁנֵיהֶם
  choice: उन दोनों के बीच
  rationale: हिब्रू वाक्यांश जानबूझकर संक्षिप्त है और ‘दोनों’ की पहचान स्पष्ट नहीं करता; हिन्दी में भी उसी अस्पष्टता को रखा गया है।
theological_decisions:
- issue: याजकीय-राजकीय व्यक्ति की पहचान और ‘उन दोनों’ का संकेत
  choice: मुख्य पाठ में एक ही कर्ता रखा गया है—वही सिंहासनारूढ़ शासक याजक भी होगा—पर ‘उन दोनों’ की पहचान नहीं खोली गई।
  alternative: ‘एक याजक उसके सिंहासन के पास होगा’ पढ़कर शासक और याजक को दो अलग व्यक्ति मानना; अथवा ‘दोनों’ को एक व्यक्ति में मिले राजकीय और याजकीय पद मानना।
  rationale: हिब्रू व्याकरण में वही एकवचन कर्ता चलता रहना सबसे सहज है, फिर भी अन्तिम शब्द שְׁנֵיהֶם स्पष्ट रूप से ‘दोनों’ कहता है। मुख्य पाठ और पादटिप्पणियाँ इस वास्तविक तनाव को किसी एक धर्मवैज्ञानिक निष्कर्ष से समाप्त नहीं करतीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक’, ‘सिंहासन’ और ‘मन्दिर’ जैसे परिचित बाइबलीय शब्द मूल के धार्मिक तथा राजकीय बिम्बों को बनाए रखते हैं। पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरन्त बाद रखे गए हैं।
