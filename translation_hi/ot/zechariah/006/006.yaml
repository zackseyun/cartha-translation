source:
  edition: WLC
  text: אֲשֶׁר בָּ֞/הּ הַ/סּוּסִ֣ים הַ/שְּׁחֹרִ֗ים יֹֽצְאִים֙ אֶל אֶ֣רֶץ צָפ֔וֹן וְ/הַ/לְּבָנִ֔ים יָצְא֖וּ אֶל אַֽחֲרֵי/הֶ֑ם וְ/הַ֨/בְּרֻדִּ֔ים יָצְא֖וּ אֶל אֶ֥רֶץ הַ/תֵּימָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/006.yaml
  text: The black horses in it are going out to the land of the north[a], and the white ones have gone out after them, and the dappled ones have gone out to the land of the south.
translation:
  language: hi
  text: उसमें जो काले घोड़े हैं, वे उत्तर देश की ओर निकल रहे हैं; सफेद घोड़े उनके पीछे निकल गए हैं, और चितकबरे घोड़े दक्षिण देश[a] की ओर निकल गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेमान देश की ओर”; यदि תֵּימָן को दिशा-सूचक “दक्षिण” के बजाय स्थान-नाम “तेमान” माना जाए।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: אֲשֶׁר בָּהּ
  choice: उसमें जो ... हैं
  rationale: यह पिछले पद में बताए गए रथ की ओर संकेत करता है। हिन्दी में यह सापेक्ष रचना स्थानवाचक अर्थ को स्पष्ट और स्वाभाविक रूप से बनाए रखती है।
- source_word: הַסּוּסִים הַשְּׁחֹרִים
  choice: काले घोड़े
  rationale: संज्ञा और रंग-सूचक विशेषण का सीधा और सामान्य हिन्दी रूप।
- source_word: יֹצְאִים
  choice: निकल रहे हैं
  rationale: हिब्रू कृदंत दृष्टि में जारी अथवा सजीव रूप से प्रस्तुत गति को व्यक्त करता है।
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: उत्तर देश की ओर
  rationale: हिब्रू के दिशात्मक भूभाग-संबंधी पदबंध को सहज हिन्दी में व्यक्त करता है और दक्षिण देश के साथ समानांतरता बनाए रखता है।
- source_word: וְהַלְּבָנִים
  choice: सफेद घोड़े
  rationale: हिब्रू में संज्ञा लुप्त है, पर हिन्दी में केवल 'सफेद वाले' की अपेक्षा 'सफेद घोड़े' अधिक स्पष्ट और गरिमापूर्ण है।
- source_word: יָצְאוּ
  choice: निकल गए हैं
  rationale: पूर्ण क्रिया को वर्तमान दृश्य से संबद्ध पूर्ण गति के रूप में व्यक्त करता है। यही रूप सफेद और चितकबरे घोड़ों, दोनों के लिए रखा गया है।
- source_word: אֶל אַחֲרֵיהֶם
  choice: उनके पीछे
  rationale: काले घोड़ों के पीछे उसी दिशा में जाने का क्रम स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וְהַבְּרֻדִּים
  choice: चितकबरे घोड़े
  rationale: यह शब्द मिश्रित या धब्बेदार रंग वाले घोड़ों को बताता है; 'चितकबरे' आधुनिक हिन्दी में घोड़ों के रंग के लिए सहज है।
- source_word: אֶל אֶרֶץ הַתֵּימָן
  choice: दक्षिण देश की ओर
  rationale: उत्तर देश के समानांतर दिशात्मक अर्थ यहाँ प्रसंगानुकूल है; स्थान-नाम 'तेमान' की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: दृष्टि में הַתֵּימָן का अर्थ
  choice: दक्षिण
  alternative: तेमान
  rationale: उत्तर देश और दक्षिण देश की समानांतर दिशाएँ रथों की गति का स्वाभाविक विन्यास प्रस्तुत करती हैं। फिर भी यह शब्द एदोम के स्थान-नाम 'तेमान' के रूप में भी समझा जा सकता है, इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक रखी गई है। जारी क्रिया और पूर्ण क्रियाओं का भेद बनाए रखा गया है। पादटिप्पणी का चिह्न 'दक्षिण देश' पर लगाया गया है, क्योंकि वैकल्पिक पाठ उसी हिब्रू पद से संबंधित है।
