  yaml_path: translation/ot/zechariah/006/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: hi
  text: तब मैंने उत्तर दिया और मुझसे बात कर रहे स्वर्गदूत से कहा, “ये क्या हैं, मेरे स्वामी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן
  choice: तब मैंने उत्तर दिया
  rationale: ענה का क़ाल वय्यिक्तोल कथानक को आगे बढ़ाते हुए नबी की प्रतिक्रिया प्रस्तुत करता है। ‘तब’ इस क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וָאֹמַר
  choice: और ... कहा
  rationale: इब्रानी का ‘उत्तर दिया और कहा’ वाला द्वि-क्रियात्मक प्रयोग बनाए रखा गया है; इसे केवल ‘पूछा’ कहना स्रोत से अधिक व्याख्यात्मक होता।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מלאך का अर्थ ‘दूत’ भी हो सकता है, पर जकर्याह के दर्शन और उसकी व्याख्या करने वाले अलौकिक पात्र के संदर्भ में ‘स्वर्गदूत’ उपयुक्त है।
- source_word: הַדֹּבֵר בִּי
  choice: मुझसे बात कर रहे
  rationale: वर्तमान कृदंत דֹּבֵר जारी या चरित्रगत क्रिया बताता है। בִּי यहाँ संवाद-संबंध में ‘मुझसे’ के रूप में स्वाभाविक है।
- source_word: מָה אֵלֶּה
  choice: ये क्या हैं
  rationale: यह दर्शन में दिखाई देने वाली वस्तुओं के विषय में सीधा प्रश्न है; हिन्दी में ‘हैं’ स्वाभाविक रूप से जोड़ा जाता है।
- source_word: אֲדֹנִי
  choice: हे मेरे प्रभु
  rationale: यह निकटवर्ती संबोधित स्वर्गदूत के लिए आदरसूचक संबोधन है। ‘मेरे प्रभु’ मूल के स्वामित्वसूचक और सम्मानसूचक भाव को रखता है; ‘हे’ हिन्दी में प्रत्यक्ष संबोधन स्पष्ट करता है।
theological_decisions:
- issue: אֲדֹנִי परमेश्वर के लिए ईश्वरीय उपाधि है या स्वर्गदूत के लिए आदरसूचक संबोधन
  choice: स्वर्गदूत को संबोधित आदरसूचक ‘हे मेरे प्रभु’
  alternative: परमेश्वर के लिए ईश्वरीय उपाधि ‘हे प्रभु’
  rationale: वाक्य में तत्काल संबोधित पात्र ‘मुझसे बात कर रहा स्वर्गदूत’ है। इसलिए अनुवाद उसे सम्मानपूर्वक संबोधित करता है, बिना स्वर्गदूत को परमेश्वर ठहराए; साथ ही אֲדֹנִי का आदरसूचक बल बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। ‘उत्तर दिया और ... कहा’ इब्रानी संरचना को सुरक्षित रखता है, जबकि शब्दक्रम हिन्दी के अनुसार स्वाभाविक किया गया है।
