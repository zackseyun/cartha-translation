revisions:
- from: तब मैंने उत्तर दिया और मुझसे बात कर रहे स्वर्गदूत से कहा,[a] “हे मेरे प्रभु, ये क्या हैं?”
  to: तब मैंने उत्तर दिया और मुझसे बात कर रहे स्वर्गदूत से कहा, “ये क्या हैं, मेरे स्वामी?”
  rationale: Revised the honorific to “मेरे स्वामी” to preserve אֲדֹנִי as respectful address to the interpreting angel without importing the stronger divine association often carried by “प्रभु” in modern Hindi. The footnote has been tightened to reflect the participial wording more directly. The remaining wording preserves the Hebrew narrative sequence and question.
  reviewer_model: gpt-5.6-terra
