base_translation:
  language: en
  yaml_path: translation/ot/zechariah/006/008.yaml
  text: Then he called out to me and spoke to me[a], saying, “See, those going out to the land of the north have set my Spirit at rest in the land of the north.”
translation:
  language: hi
  text: तब उसने मुझे ऊँची आवाज़ में पुकारा और मुझसे कहा, “देखो, जो उत्तर के देश की ओर जा रहे हैं, उन्होंने उत्तर के देश में मेरी आत्मा को विश्राम पहुँचाया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी आत्मा को चैन दिया है।” इस वाक्यांश में यह भाव भी हो सकता है कि उत्तर के देश में परमेश्वर का क्रोध या न्यायिक अप्रसन्नता शांत हो गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק אֹתִי
  choice: उसने मुझे ऊँची आवाज़ में पुकारा
  rationale: זעק में ऊँची या तात्कालिक पुकार का भाव है। यह अनुवाद उस श्रव्य बल को बनाए रखता है, पर किसी विशेष भावना को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וַיְדַבֵּר אֵלַי לֵאמֹר
  choice: और मुझसे कहा
  rationale: हिब्रू का यह प्रचलित वचन-परिचय आधुनिक हिन्दी में स्वाभाविक रूप से संक्षिप्त किया गया है; ‘पुकारा’ के बाद ‘बोला, यह कहते हुए’ कहना बोझिल होता।
- source_word: רְאֵה
  choice: देखो
  rationale: आज्ञार्थक रूप आगे कही जाने वाली बात पर ध्यान खींचता है। ‘देखो’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: הַיּוֹצְאִים
  choice: जो ... जा रहे हैं
  rationale: कर्तृवाचक कृदन्त चल रही गति को व्यक्त करता है; इसलिए इसे साधारण भूतकाल में नहीं बदला गया।
- source_word: אֶל אֶרֶץ צָפוֹן
  choice: उत्तर के देश की ओर
  rationale: यह भौगोलिक दिशा और गन्तव्य दोनों को व्यक्त करता है तथा हिन्दी में स्वाभाविक है।
- source_word: הֵנִיחוּ
  choice: विश्राम दिया है
  rationale: हिफ़ील रूप का मूल भाव किसी को ठहराना, शांत करना या विश्राम देना है। पूर्ण क्रिया को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: רוּחַ का अर्थ आत्मा, स्वभाव/मनःस्थिति, वायु या श्वास हो सकता है। दिव्य प्रथम-पुरुष सम्बन्ध और दर्शन के सन्दर्भ में ‘मेरी आत्मा’ मूल की धार्मिक तथा अर्थगत गहनता बनाए रखता है, बिना इसे सीधे ‘मेरा क्रोध’ कहकर व्याख्यायित किए।
- source_word: בְּאֶרֶץ צָפוֹן
  choice: उत्तर के देश में
  rationale: मूल पाठ में भौगोलिक पद की पुनरावृत्ति है; बल और संरचना बनाए रखने के लिए हिन्दी में भी इसे दोहराया गया है।
theological_decisions:
- issue: ‘मेरी आत्मा को विश्राम दिया है’ का आशय
  choice: मुख्य पाठ में परमेश्वर की अपनी ‘आत्मा’ को विश्राम दिए जाने की भाषा बनाए रखी गई है।
  alternative: इसे परमेश्वर के क्रोध या न्यायिक अप्रसन्नता के शांत हो जाने के अर्थ में स्पष्ट रूप से अनूदित किया जा सकता था।
  rationale: सन्दर्भ न्याय-कार्य के पूरा होने और उसके फलस्वरूप परमेश्वर के शांत होने का संकेत दे सकता है, पर רוּחִי को सीधे ‘मेरा क्रोध’ कहना मूल की वास्तविक अर्थगत और धर्मवैज्ञानिक बहुअर्थकता को समय से पहले समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘उत्तर का देश’ की अपेक्षा ‘उत्तर के देश’ अधिक स्वाभाविक सम्बन्धसूचक रूप है। मूल की पुनरावृत्ति और ‘आत्मा’ से जुड़ी अर्थगत अनिश्चितता सुरक्षित रखी गई है।
