  text: בַּ/יּ֣וֹם הַ/ה֗וּא יִגְדַּ֤ל הַ/מִּסְפֵּד֙ בִּ/יר֣וּשָׁלִַ֔ם כְּ/מִסְפַּ֥ד הֲדַדְ רִמּ֖וֹן בְּ/בִקְעַ֥ת מְגִדּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/011.yaml
  text: On that day the mourning in Jerusalem will become great[a], like the mourning of Hadad-rimmon in the plain of Megiddo.
translation:
  language: hi
  text: उस दिन यरूशलेम में शोक बहुत बढ़ जाएगा, मगिद्दो के मैदान में हदद-रिम्मोन के शोक के समान।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हदद-रिम्मोन मगिद्दो के पास किसी स्थान का नाम हो सकता है, जो संभवतः योशिय्याह के लिए किए गए शोक से जुड़ा था (देखें 2 इतिहास 35:22–25); या यह किसी अन्य प्रसिद्ध विलाप-परंपरा का संकेत हो सकता है।
    reason: वैकल्पिक व्याख्याएँ और मूल पाठ की अस्पष्टता
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यवाणी में प्रयुक्त मानक कालसूचक वाक्यांश है; हिन्दी में स्वाभाविक रूप से भविष्य की ओर संकेत करता है।
- source_word: יִגְדַּל
  choice: बहुत बढ़ जाएगा
  rationale: גדל के बढ़ने अथवा बड़ा होने के गतिशील भाव को शोक की तीव्रता के संदर्भ में स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּסְפֵּד
  choice: शोक
  rationale: מִסְפֵּד मृत्यु के अवसर पर सामुदायिक विलाप और मातम को सूचित करता है; ‘शोक’ सामान्य पाठक के लिए सहज और पर्याप्त व्यापक है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग और नगर के नाम का सीधा अनुवाद।
- source_word: כְּמִסְפַּד
  choice: जैसा ... का शोक
  rationale: तुलनार्थक כְּ और संबंधसूचक रचना को बनाए रखता है, बिना यह तय किए कि शोक किसी स्थान, व्यक्ति अथवा परंपरा के लिए था।
- source_word: הֲדַד רִמּוֹן
  choice: हदद-रिम्मोन
  rationale: विवादित पहचान को हल किए बिना इब्रानी व्यक्तिवाचक नाम का लिप्यंतरण; योजक-चिह्न उसके दो घटकों को स्पष्ट रखता है।
- source_word: בְּבִקְעַת מְגִדּוֹן
  choice: मगिद्दो के मैदान में
  rationale: בִּקְעָה प्रायः विस्तृत घाटी अथवा मैदान को दर्शाता है; यहाँ ‘मैदान’ उपयुक्त स्थलाकृतिक अर्थ देता है।
theological_decisions:
- issue: ‘हदद-रिम्मोन’ की पहचान
  choice: मुख्य पाठ में इसे व्यक्तिवाचक नाम मानकर रखा गया है और किसी विशेष ऐतिहासिक घटना से इसकी पहचान नहीं की गई।
  alternative: इसे मगिद्दो में राजा योशिय्याह के लिए हुए शोक का संकेत, अथवा हदद-रिम्मोन से जुड़ी किसी अन्य प्रसिद्ध विलाप-परंपरा का उल्लेख माना जा सकता है।
  rationale: इब्रानी पाठ नाम तो देता है, पर उसकी व्याख्या नहीं करता। विवादित पहचान को मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘शोक बहुत बढ़ जाएगा’ सामुदायिक मातम की तीव्रता व्यक्त करता है; विवादित ऐतिहासिक पहचान केवल पाद-टिप्पणी में दी गई है।
