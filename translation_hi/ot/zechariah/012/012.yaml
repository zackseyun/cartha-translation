source:
  edition: WLC
  text: וְ/סָפְדָ֣ה הָ/אָ֔רֶץ מִשְׁפָּח֥וֹת מִשְׁפָּח֖וֹת לְ/בָ֑ד מִשְׁפַּ֨חַת בֵּית דָּוִ֤יד לְ/בָד֙ וּ/נְשֵׁי/הֶ֣ם לְ/בָ֔ד מִשְׁפַּ֤חַת בֵּית נָתָן֙ לְ/בָ֔ד וּ/נְשֵׁי/הֶ֖ם לְ/בָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/012.yaml
  text: 'And the land will mourn[a], each family by itself: the family of the house of David by itself, and their wives by themselves; the family of the house of Nathan by itself[b], and their wives by themselves.'
translation:
  language: hi
  text: 'और देश[a] शोक मनाएगा—हर कुल अलग-अलग[b]: दाऊद के घराने का कुल अलग, और उनकी पत्नियाँ अलग; नातान के घराने का कुल अलग, और उनकी पत्नियाँ अलग।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धरती’।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘कुल-कुल’; इब्रानी में पुनरावृत्ति का अर्थ है कि प्रत्येक कुल अलग होकर शोक करेगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָפְדָה
  choice: और ... शोक मनाएगा
  rationale: सפד सामुदायिक विलाप या मातम को दर्शाता है। ‘शोक मनाएगा’ आधुनिक हिन्दी में स्वाभाविक है और विलाप के ढंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: הָאָרֶץ
  choice: देश
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ या ‘धरती’ हो सकता है। निकटवर्ती प्रसंग में यहूदा और यरूशलेम के कुलों का उल्लेख होने के कारण यहाँ ‘देश’ स्थानीय और राष्ट्रीय दायरे को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁפָּחוֹת מִשְׁפָּחוֹת
  choice: हर कुल अलग-अलग
  rationale: संज्ञा की पुनरावृत्ति वितरणात्मक अर्थ देती है—एक-एक कुल करके। ‘हर कुल अलग-अलग’ इस भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבָד
  choice: अलग
  rationale: לְבָד पृथकता पर बल देता है। बार-बार आया ‘अलग’ मूल पाठ की पुनरावृत्ति और प्रत्येक समूह के पृथक शोक को बनाए रखता है।
- source_word: מִשְׁפַּחַת בֵּית דָּוִיד
  choice: दाऊद के घराने का कुल
  rationale: यह पदबंध दाऊद के राजवंश से संबंधित विशिष्ट कुल को बताता है। ‘घराना’ वंशगत भाव और ‘कुल’ व्यापक पारिवारिक समूह—दोनों को सुरक्षित रखते हैं।
- source_word: וּנְשֵׁיהֶם
  choice: और उनकी पत्नियाँ
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर बहुवचन स्वामित्वसूचक प्रत्यय और पारिवारिक प्रसंग यहाँ ‘पत्नियाँ’ का समर्थन करते हैं।
- source_word: מִשְׁפַּחַת בֵּית נָתָן
  choice: नातान के घराने का कुल
  rationale: दाऊद वाले समानान्तर पदबंध की तरह यह नातान से संबंधित वंशगत कुल को दर्शाता है; समान रचना काव्यात्मक समानता को बनाए रखती है।
theological_decisions:
- issue: भविष्यवाणी के प्रसंग में הָאָרֶץ का दायरा
  choice: देश
  alternative: धरती
  rationale: आस-पास के पद विशिष्ट यहूदी कुलों की गणना करते हैं, इसलिए यहाँ शोक का चित्र पूरे संसार के बजाय उस देश में फैला हुआ जान पड़ता है। फिर भी मूल शब्द का व्यापक अर्थ सम्भव है और उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कुल’ और ‘घराना’ वंशगत संदर्भ को व्यक्त करते हैं, जबकि ‘अलग’ की पुनरावृत्ति मूल इब्रानी के पृथक-पृथक शोक पर दिए गए बल को सुरक्षित रखती है।
