- from: बाकी बचे सभी कुलों में से हर कुल अलग रहेगा, और उनकी पत्नियाँ अलग रहेंगी।[a]
  to: बचे हुए सभी परिवार—हर परिवार अलग-अलग, और उनकी पत्नियाँ अलग-अलग।[a]
  rationale: The revision removes verbs not expressed in the Hebrew, avoids the misleading ‘में से’ construction, and uses an idiomatic distributive Hindi formulation. It retains the source’s repeated separative emphasis and preserves the wife/women lexical alternative in the footnote.
