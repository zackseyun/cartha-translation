  footnotes:
  - marker: a
    text: या, “बचे हुए सभी परिवार—परिवार-परिवार अलग-अलग, और उनकी स्त्रियाँ अलग-अलग।” इब्रानी में ‘परिवार’ की पुनरुक्ति वितरणात्मक है और बल देने के लिए ‘अलग-अलग’ दोहराया गया है।
    reason: शाब्दिक विकल्प और इब्रानी पुनरुक्ति की व्याख्या
lexical_decisions:
- source_word: כֹּל
  choice: सभी
  rationale: यह बचे हुए कुलों के पूरे समूह को समेटता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַמִּשְׁפָּחוֹת
  choice: कुलों
  rationale: מִשְׁפָּחָה परिवार या कुल को सूचित कर सकता है; इस सामूहिक और वंशगत संदर्भ में ‘कुल’ व्यापक तथा सहज है।
- source_word: הַנִּשְׁאָרוֹת
  choice: बाकी बचे
  rationale: यह बचे रहने का भाव रखता है, पर अनावश्यक रूप से यह निर्धारित नहीं करता कि आशय केवल जीवित बचने से है।
- source_word: מִשְׁפָּחֹת מִשְׁפָּחֹת
  choice: हर कुल
  rationale: इब्रानी पुनरुक्ति वितरणात्मक है; ‘हर कुल’ उसका स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: לְבָד
  choice: अलग
  rationale: यह पृथक रहने या भाग लेने के भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּנְשֵׁיהֶם
  choice: और उनकी पत्नियाँ
  rationale: इस पारिवारिक संदर्भ में אִשָּׁה का बहुवचन संबंधरूप ‘उनकी पत्नियाँ’ सबसे स्वाभाविक है और मूल का स्त्री-पुरुष भेद बनाए रखता है।
- source_word: לְבָד
  choice: अलग
  rationale: दूसरी बार आया शब्द पत्नियों की पृथक सहभागिता पर वही बल बनाए रखता है।
theological_decisions:
- issue: विलाप में स्त्री-पुरुष की पृथक सहभागिता
  choice: मुख्य पाठ में ‘उनकी पत्नियाँ अलग रहेंगी’ रखा गया।
  alternative: ‘और स्त्रियाँ अलग रहेंगी’
  rationale: इब्रानी पाठ पारिवारिक समूहों और उनकी पत्नियों/स्त्रियों के बीच स्पष्ट भेद रखता है; ‘पत्नियाँ’ इस संदर्भ में संभावित संबंध को अधिक स्वाभाविक रूप से व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘कुल’ संदर्भ की सामूहिक/वंशगत धारणा को रखता है; वितरणात्मक पुनरुक्ति को मुख्य पाठ में स्वाभाविक ‘हर कुल’ से व्यक्त किया गया है और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
