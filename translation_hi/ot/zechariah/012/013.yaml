  text: the family of the house of Levi by itself[a], and their wives by themselves; the family of the Shimeites by itself, and their wives by themselves.
translation:
  language: hi
  text: लेवी के घराने का कुल अलग, और उनकी पत्नियाँ अलग; शिमईवंशियों का कुल[a] अलग, और उनकी पत्नियाँ अलग।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिमई का कुल।” इब्रानी में संभवतः शिमई से संबद्ध वंश-समूह का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: यह रचना-संबंधी रूप नामित वंश-समूह का परिचय देता है। ‘कुल’ आधुनिक हिन्दी में विस्तृत पारिवारिक या वंशीय समूह को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בֵּית לֵוִי
  choice: लेवी का घराना
  rationale: व्यक्तिनाम के साथ בֵּית वंश या घराने का बोध कराता है; ‘लेवी का घराना’ इस वंशावली-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: לְבָד
  choice: अलग
  rationale: बार-बार आया यह क्रियाविशेषण शोक मनाने में पृथकता पर बल देता है। ‘अलग’ हिन्दी में सहज है और इब्रानी की आवर्तक लय को बनाए रखता है।
- source_word: וּנְשֵׁיהֶם
  choice: और उनकी पत्नियाँ
  rationale: इस पारिवारिक प्रसंग में נָשִׁים का अर्थ ‘पत्नियाँ’ सबसे उपयुक्त है और स्त्री-पुरुषों के अलग-अलग शोक करने को स्पष्ट रखता है।
- source_word: הַשִּׁמְעִי
  choice: शिमई का कुल
  rationale: सपद रूप शिमई से संबद्ध या उसके वंशज कुल को सूचित करता है। हिन्दी में ‘शिमई का कुल’ ‘शिमईवंशी’ की अपेक्षा अधिक सहज और स्पष्ट है।
theological_decisions:
- issue: शोक में स्त्री-पुरुषों की पृथकता
  choice: परिवार के कुल और ‘उनकी पत्नियों’ का अलग-अलग उल्लेख बनाए रखा गया है।
  alternative: हर कुल अलग, और पुरुष तथा स्त्रियाँ अलग-अलग
  rationale: इब्रानी पाठ परिवार-समूहों और उनकी पत्नियों के बीच स्पष्ट भेद करता है; इसे लिंग-निरपेक्ष सामान्य कथन में बदलना मूल पाठ की संरचना और जोर को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अलग’ की चार बार पुनरावृत्ति मूल इब्रानी के शोकपूर्ण, refrain-जैसे विन्यास को सुरक्षित रखती है।
