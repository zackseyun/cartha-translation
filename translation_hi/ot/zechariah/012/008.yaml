base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/008.yaml
  text: On that day Yahweh will shield the inhabitants of Jerusalem[a], and the one who stumbles among them on that day will be like David, and the house of David like God, like the angel of Yahweh before them.
translation:
  language: hi
  text: उस दिन याहवे यरूशलेम के निवासियों की रक्षा करेगा। उस दिन उनमें ठोकर खानेवाला दाऊद के समान होगा, और दाऊद का घराना परमेश्वर के समान[a]—उनके आगे याहवे के दूत के समान—होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देवताओं के समान” अथवा “दैवी प्राणियों के समान।” इब्रानी शब्द אֱלֹהִים के ये अर्थ भी हो सकते हैं, यद्यपि यहाँ एकवचन तुलना अधिक संभावित है।
    reason: मूल इब्रानी शब्द की वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יָגֵן
  choice: रक्षा करेगा
  rationale: क्रिया सुरक्षात्मक आवरण और बचाव का भाव व्यक्त करती है। ‘रक्षा करेगा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के सैन्य-सुरक्षात्मक अर्थ को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: यरूशलेम के निवासियों
  rationale: एकवचन कृदंत यहाँ सामूहिक अर्थ में प्रयुक्त है; हिन्दी में बहुवचन ‘निवासियों’ वही अर्थ स्वाभाविक रूप से देता है।
- source_word: הַנִּכְשָׁל
  choice: ठोकर खानेवाला
  rationale: मूल शब्द लड़खड़ाने या निर्बल पड़ने की ठोस छवि देता है। इस अनुवाद में उस रूपक को सामान्यीकृत करके केवल ‘निर्बल’ नहीं किया गया।
- source_word: בָּהֶם
  choice: उनमें
  rationale: यह समूह के बीच उपस्थित व्यक्ति को सूचित करता है; ‘उनमें’ संक्षिप्त और मूल के निकट है।
- source_word: כְּדָוִיד
  choice: दाऊद के समान
  rationale: प्रत्यक्ष तुलना को औपचारिक, किंतु सहज हिन्दी में रखा गया है।
- source_word: בֵית דָּוִיד
  choice: दाऊद का घराना
  rationale: ‘घराना’ पारिवारिक और राजवंशीय दोनों अर्थों को धारण कर सकता है और स्थापित बाइबलीय शैली के अनुरूप है।
- source_word: כֵּאלֹהִים
  choice: परमेश्वर के समान
  rationale: इस प्रसंग में अगली समानांतर तुलना एकवचन अर्थ का समर्थन करती है, फिर भी אֱלֹהִים की संभावित बहुवचन या दैवी-सत्ता संबंधी अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: כְּמַלְאַךְ יְהוָה
  choice: याहवे के दूत के समान
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और इस विशेष पदबंध में यह अलौकिक दूत को भी स्वाभाविक रूप से सूचित करता है। हिन्दी ‘दूत’ संदेशवाहक और स्वर्गदूत के बीच स्रोत की शाब्दिक व्यापकता को बनाए रखता है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे
  rationale: यह स्थान, अगुवाई या आगे बढ़ने की उपस्थिति का भाव दे सकता है। ‘उनके आगे’ इन संभावनाओं को बिना अनावश्यक व्याख्या के खुला रखता है।
theological_decisions:
- issue: दाऊद के घराने की तुलना में אֱלֹהִים का अर्थ
  choice: एकवचन ‘परमेश्वर’
  alternative: ‘देवताओं’ अथवा ‘दैवी प्राणियों’
  rationale: इसके तुरंत बाद ‘याहवे के दूत’ से की गई तुलना यहाँ एकवचन, अत्यंत ऊँची तुलना की ओर संकेत करती है। फिर भी इब्रानी संज्ञा अन्य प्रसंगों में बहुवचन या दैवी प्राणियों का अर्थ रख सकती है, इसलिए इस वास्तविक अस्पष्टता को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दाऊद का घराना’ राजवंशीय अर्थ को बनाए रखता है; डैश समानांतर और व्याख्यात्मक दूसरी तुलना को स्पष्ट करते हैं, बिना उसके संबंध को निर्णायक रूप से पुनर्व्याख्यायित किए।
