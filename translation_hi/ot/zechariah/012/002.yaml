source:
  edition: WLC
  text: הִנֵּ֣ה אָ֠נֹכִי שָׂ֣ם אֶת יְרוּשָׁלִַ֧ם סַף רַ֛עַל לְ/כָל הָ/עַמִּ֖ים סָבִ֑יב וְ/גַ֧ם עַל יְהוּדָ֛ה יִֽהְיֶ֥ה בַ/מָּצ֖וֹר עַל יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/002.yaml
  text: Behold[a], I am about to make Jerusalem a cup of staggering to all the surrounding peoples[b]; and it will also be against Judah in the siege against Jerusalem.
translation:
  language: hi
  text: “देखो, मैं यरूशलेम को आस-पास की सभी जातियों के लिए लड़खड़ाने का प्याला[a] बनाने जा रहा हूँ; और यरूशलेम के विरुद्ध घेराबंदी के समय यह यहूदा के विरुद्ध भी होगा।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लड़खड़ाहट का प्याला।” इब्रानी पद का अधिक शाब्दिक अर्थ “लड़खड़ाहट का पात्र/बेसिन” या “लड़खड़ाहट की देहरी” भी हो सकता है; पर प्रसंग में ऐसा पीने का पात्र अधिक उपयुक्त है जो पीने वालों को नशे की तरह लड़खड़ा दे।
    reason: lexical_alternative
  - marker: b
    text: इस उपवाक्य का इब्रानी पाठ कठिन है। इसका अर्थ यह भी हो सकता है, “यहूदा भी यरूशलेम के साथ घेर लिया जाएगा,” या “यरूशलेम के विरुद्ध घेराबंदी के समय यह यहूदा पर भी आएगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह एक गंभीर भविष्यसूचक घोषणा की ओर ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ स्वाभाविक रहते हुए मूल का आह्वानात्मक बल बनाए रखता है।
- source_word: שָׂם
  choice: बनाने जा रहा हूँ
  rationale: הִנֵּה के साथ प्रयुक्त कृदन्त यहाँ आसन्न भविष्य का जीवंत भाव देता है; यह चयन उसी निकट और निश्चित कार्रवाई को व्यक्त करता है।
- source_word: סַף רַעַל
  choice: लड़खड़ा देने वाला प्याला
  rationale: סַף का अर्थ देहरी अथवा कोई पात्र हो सकता है, पर इस प्रसंग में नशे-जैसी लड़खड़ाहट उत्पन्न करने वाले पात्र का रूपक अधिक उपयुक्त है। ‘प्याला’ और ‘लड़खड़ा देने वाला’ मिलकर उस प्रभाव को सहज हिन्दी में व्यक्त करते हैं।
- source_word: לְכָל הָעַמִּים סָבִיב
  choice: आस-पास के सब लोगों के लिए
  rationale: यह आसपास के सामूहिक जनसमुदायों को दर्शाता है। ‘लोगों’ से עַמִּים का बहुवचन सामूहिक अर्थ बना रहता है।
- source_word: עַל יְהוּדָה
  choice: यहूदा के विरुद्ध
  rationale: सैन्य और न्याय के प्रसंग में עַל का विरोधात्मक भाव सम्भव है। यह कठिन उपवाक्य में यहूदा की प्रतिकूल संलिप्तता को बिना अधिक स्पष्ट किए बनाए रखता है।
- source_word: בַמָּצוֹר עַל יְרוּשָׁלִָם
  choice: यरूशलेम की घेराबंदी में
  rationale: यह सैन्य घेराबंदी की परिस्थिति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कठिन उपवाक्य וְגַם עַל־יְהוּדָה יִהְיֶה בַמָּצוֹר עַל־יְרוּשָׁלִָם की व्याख्या
  choice: यरूशलेम की घेराबंदी में यह यहूदा के विरुद्ध भी होगा
  alternative: यहूदा भी यरूशलेम के साथ घेरा जाएगा; अथवा यरूशलेम की घेराबंदी के समय यह यहूदा पर भी आएगा
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और विवादित है। मुख्य पाठ यहूदा की प्रतिकूल संलिप्तता को बनाए रखता है, पर उसकी ठीक प्रकृति को निश्चित नहीं करता; पादटिप्पणी वास्तविक वैकल्पिक पाठों को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और भविष्यसूचक है। ‘देखो’ तथा ‘बनाने जा रहा हूँ’ घोषणा की तत्परता बनाए रखते हैं। कठिन दूसरे उपवाक्य को जानबूझकर पूरी तरह सरल या सिद्धान्तगत रूप से निश्चित नहीं किया गया है।
