base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/006.yaml
  text: On that day I will make the clans of Judah like a firepot among wood[a], and like a flaming torch among sheaves; and they will consume all the surrounding peoples, on the right and on the left. And Jerusalem will again dwell in her own place[b], in Jerusalem.
translation:
  language: hi
  text: उस दिन मैं यहूदा के कुलों[a] को लकड़ियों के बीच आग की अंगीठी के समान और अनाज के पूलों के बीच जलती हुई मशाल के समान कर दूँगा। वे दाएँ और बाएँ, चारों ओर के सब लोगों को भस्म कर देंगे। तब यरूशलेम फिर अपने ही स्थान[b] पर, यरूशलेम में, बसी रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा के अगुओं” अथवा “यहूदा के कुल-प्रधानों।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “अपने नीचे” है; यह अपने ही स्थान पर बसे रहने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלֻּפֵי יְהוּדָה
  choice: यहूदा के अगुओं
  rationale: אַלּוּף का अर्थ किसी कुल या समूह का अगुआ अथवा प्रधान हो सकता है, और कभी उससे संबंधित कुल-इकाई भी समझी जाती है। निकटवर्ती संदर्भ में नेतृत्व करने वाले व्यक्तियों का भाव स्वाभाविक है; इसलिए मुख्य पाठ में ‘अगुओं’ रखा गया और सामूहिक अर्थ को पादटिप्पणी में सुरक्षित किया गया।
- source_word: כְּכִיּוֹר אֵשׁ בְּעֵצִים
  choice: लकड़ियों के बीच आग से भरी अंगीठी के समान
  rationale: כִּיּוֹר मूलतः पात्र या हौद है; यहाँ उसमें आग है और वह लकड़ियों के बीच रखा गया है। ‘आग से भरी अंगीठी’ पात्र तथा आसपास के ईंधन को जला देने वाली छवि दोनों को सहज हिन्दी में व्यक्त करती है।
- source_word: וּכְלַפִּיד אֵשׁ בְּעָמִיר
  choice: पूलों के बीच जलती हुई मशाल के समान
  rationale: לַפִּיד אֵשׁ जलती मशाल है और עָמִיר अनाज के पूलों या डंठलों के ढेर को सूचित कर सकता है। ‘पूलों’ से कृषि-संबंधी मूल उपमा बनी रहती है।
- source_word: וְאָכְלוּ
  choice: भस्म कर देंगे
  rationale: क्रिया का मूल अर्थ ‘खा जाना’ है, पर यहाँ आग की दोनों उपमाओं के भीतर विनाश का रूपक है। ‘भस्म कर देंगे’ उसी अग्नि-चित्र को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: עַל יָמִין וְעַל שְׂמֹאול
  choice: दाएँ और बाएँ
  rationale: शाब्दिक दिशात्मक अभिव्यक्ति को बनाए रखा गया है; यह चारों ओर फैलते विनाश की सजीवता को सुरक्षित रखती है।
- source_word: כָּל הָעַמִּים סָבִיב
  choice: चारों ओर के सब लोगों
  rationale: עַמִּים का व्यापक अर्थ जनसमूह या लोग है, केवल राजनीतिक राष्ट्र नहीं। ‘चारों ओर के’ घेरने वाले आसपास के समूहों का भाव देता है।
- source_word: וְיָשְׁבָה יְרוּשָׁלַם עוֹד
  choice: तब यरूशलेम फिर ... बसी रहेगी
  rationale: יָשַׁב बसने, रहने या स्थिर बसे रहने को व्यक्त करता है। नगर को स्त्रीलिंग व्यक्तित्व देते हुए ‘बसी रहेगी’ भविष्य की सुरक्षित पुनर्स्थापना का भाव रखता है; עוֹד को ‘फिर’ से व्यक्त किया गया है।
- source_word: תַּחְתֶּיהָ
  choice: अपने ही स्थान पर
  rationale: इसका शाब्दिक रूप ‘अपने नीचे’ है, पर यहाँ यह अपने नियत या मूल स्थान पर बसे रहने का मुहावरा है। स्पष्ट हिन्दी के लिए अर्थानुकूल रूप मुख्य पाठ में रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: अंतिम स्थान-सूचक पद को बनाए रखने से मूल पाठ का जानबूझकर किया गया नाम-पुनरावर्तन और बल सुरक्षित रहता है।
theological_decisions:
- issue: אַלֻּפֵי יְהוּדָה की सामूहिक अथवा नेतृत्व-संबंधी पहचान
  choice: मुख्य पाठ में ‘यहूदा के अगुओं’
  alternative: ‘यहूदा के कुलों’ या ‘यहूदा के कुल-प्रधानों’
  rationale: शब्द नेतृत्वकर्ता और कुल-इकाई, दोनों से जुड़ा अर्थ ग्रहण कर सकता है। निकट संदर्भ में यहूदा के अगुओं का उल्लेख नेतृत्वार्थ को बल देता है, पर सामूहिक अर्थ वास्तविक संभावना है; इसलिए उसे पादटिप्पणी में रखा गया है और प्रतिज्ञा को किसी विशिष्ट धार्मिक पद या संप्रदायगत ढाँचे तक सीमित नहीं किया गया।
