source:
  edition: WLC
  text: מַשָּׂ֥א דְבַר יְהוָ֖ה עַל יִשְׂרָאֵ֑ל נְאֻם יְהוָ֗ה נֹטֶ֤ה שָׁמַ֨יִם֙ וְ/יֹסֵ֣ד אָ֔רֶץ וְ/יֹצֵ֥ר רֽוּחַ אָדָ֖ם בְּ/קִרְבּֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/001.yaml
  text: 'An oracle[a], the word of Yahweh concerning Israel: the declaration of Yahweh, who stretches out the heavens, lays the foundation of the earth[b], and forms the spirit of man within him.'
translation:
  language: hi
  text: इस्राएल के विषय में यहोवा का भविष्यसूचक वचन:[a] यहोवा की यह घोषणा है—वह आकाश को फैलाता है, पृथ्वी की नींव डालता है और मनुष्य की आत्मा को उसके भीतर रचता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के विरुद्ध यहोवा का भविष्यसूचक वचन।” यहाँ प्रयुक्त पूर्वसर्ग का अर्थ “के विषय में” या, प्रसंगानुसार, “के विरुद्ध” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “मनुष्य की आत्मा”; या “मानवीय आत्मा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  choice: भविष्यवाणी
  rationale: भविष्यद्वाणी-संबंधी शीर्षकों में यह शब्द एक गंभीर, अधिकारपूर्ण ईश्वरीय कथन को सूचित करता है। हिंदी में ‘भविष्यवाणी’ स्वाभाविक और स्पष्ट है; ‘भार’ का शाब्दिक अनुवाद भ्रामक हो सकता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: मानक भविष्यद्वाणी-सूत्र को औपचारिक रूप से सुरक्षित रखता है और ‘संदेश’ की अपेक्षा मूल के ‘वचन’ से अधिक सीधा संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל
  choice: के विषय में
  rationale: यहाँ पूर्वसर्ग भविष्यवाणी की विषयवस्तु बताता है। आगे इस्राएल के लिए न्याय और उद्धार दोनों होने के कारण ‘के विरुद्ध’ की अपेक्षा ‘के विषय में’ कम व्याख्यात्मक है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: संज्ञात्मक घोषणा-सूत्र और उसकी गंभीर भविष्यद्वाणी शैली को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: נֹטֶה שָׁמַיִם
  choice: जो आकाश को फैलाता है
  rationale: कृदंत रूप को यहोवा का वर्णन करने वाले वर्तमानकालिक संबंधवाचक वाक्यांश के रूप में रखा गया है।
- source_word: וְיֹסֵד אָרֶץ
  choice: पृथ्वी की नींव डालता है
  rationale: यָסַד के नींव रखने अथवा स्थापित करने के बिंब को सजीव और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: וְיֹצֵר רוּחַ אָדָם
  choice: मनुष्य के भीतर उसकी आत्मा को रचता है
  rationale: יֹצֵר की गढ़ने अथवा रचने की सृष्टि-संबंधी भाषा और רוּחַ אָדָם के मानवीय आंतरिक आत्मा वाले अर्थ को बनाए रखता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: एकवचन प्रतिनिधिक मानव के अर्थ को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है और इसे केवल पुरुष लिंग तक सीमित नहीं करता।
- source_word: בְּקִרְבּוֹ
  choice: उसके भीतर
  rationale: पुल्लिंग एकवचन प्रत्यय का संबंध אָדָם से रखते हुए मूल की एकवचन रचना को सुरक्षित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके उसे लिप्यंतरित किया गया है।
- issue: אָדָם का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: मानव
  rationale: मूल का एकवचन और सार्वभौमिक मानवीय संदर्भ दोनों ‘मनुष्य’ में स्वाभाविक रूप से सुरक्षित रहते हैं।
- issue: עַל का संबंधसूचक अर्थ
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: पूर्वसर्ग दोनों अर्थ ले सकता है, पर अध्याय के व्यापक संदर्भ में इस्राएल के लिए न्याय और उद्धार दोनों हैं; अतः मुख्य पाठ में तटस्थ अर्थ रखा और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर किंतु सामान्य पाठक के लिए सहज रखी गई है। भविष्यद्वाणी शीर्षक की संक्षिप्तता और सृष्टिकर्ता के त्रिस्तरीय वर्णन की लय सुरक्षित रखी गई है।
