source:
  edition: WLC
  text: וְ/שָׁפַכְתִּי֩ עַל בֵּ֨ית דָּוִ֜יד וְ/עַ֣ל יוֹשֵׁ֣ב יְרוּשָׁלִַ֗ם ר֤וּחַ חֵן֙ וְ/תַ֣חֲנוּנִ֔ים וְ/הִבִּ֥יטוּ אֵלַ֖/י אֵ֣ת אֲשֶׁר דָּקָ֑רוּ וְ/סָפְד֣וּ עָלָ֗י/ו כְּ/מִסְפֵּד֙ עַל הַ/יָּחִ֔יד וְ/הָמֵ֥ר עָלָ֖י/ו כְּ/הָמֵ֥ר עַֽל הַ/בְּכֽוֹר־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/010.yaml
  text: And I will pour out on the house of David and on the inhabitants of Jerusalem a spirit of grace and pleas for mercy[a], and they will look to me, the one whom they pierced, and they will mourn for him as one mourns for an only son[c][b], and weep bitterly for him as one weeps bitterly for a firstborn.
translation:
  language: hi
  text: और मैं दाऊद के घराने और यरूशलेम के निवासियों पर अनुग्रह और विनती की आत्मा उँडेलूँगा[a]। तब वे मेरी ओर देखेंगे, जिसे उन्होंने बेधा है, और उसके लिए ऐसा विलाप करेंगे जैसा इकलौते पुत्र के लिए विलाप किया जाता है[c]; वे उसके लिए ऐसा फूट-फूटकर रोएँगे जैसा पहलौठे के लिए रोया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रह और दया की गुहारों की आत्मा।”
    reason: תַחֲנוּנִים उत्कट विनतियों या दया की गुहारों को सूचित कर सकता है।
  - marker: c
    text: इब्रानी में यहाँ “मेरी ओर” से “उसके लिए” में परिवर्तन होता है; अनुवाद ने इस तनाव को बनाए रखा है।
    reason: मूलपाठ के प्रथम-पुरुष से तृतीय-पुरुष सर्वनाम-परिवर्तन को स्पष्ट करना आवश्यक है।
lexical_decisions:
- source_word: שָׁפַכְתִּי
  choice: उँडेलूँगा
  rationale: यह क्रिया प्रचुरता से दिए जाने का रूपक बनाए रखती है और רוּחַ के साथ स्वाभाविक हिन्दी देती है।
- source_word: בֵּית דָּוִד
  choice: दाऊद का घराना
  rationale: यहाँ ‘घर’ वंश अथवा राजवंश का सूचक है; ‘घराना’ आधुनिक हिन्दी में उस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: יוֹשֵׁב יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: एकवचन कृदन्त सामूहिक अर्थ में प्रयुक्त है, इसलिए हिन्दी में स्वाभाविक बहुवचन रखा गया है।
- source_word: רוּחַ חֵן וְתַחֲנוּנִים
  choice: अनुग्रह और विनती की आत्मा
  rationale: यह रूप मूल पदबंध की संक्षिप्तता और उस अस्पष्टता को बनाए रखता है कि ‘आत्मा’ मनोवृत्ति है अथवा परमेश्वर द्वारा दिया गया आत्मिक सामर्थ्य; תַחֲנוּנִים के लिए ‘विनती’ दया की उत्कट याचना का स्वाभाविक, गरिमापूर्ण शब्द है।
- source_word: וְהִבִּיטוּ אֵלַי
  choice: वे मेरी ओर … देखेंगे
  rationale: אֶל के साथ क्रिया निर्देशित दृष्टि अथवा ध्यान प्रकट करती है; ‘मेरी ओर देखेंगे’ हिन्दी में दोनों भावों के लिए स्वाभाविक है।
- source_word: אֵת אֲשֶׁר דָּקָרוּ
  choice: उसी की ओर जिसे उन्होंने बेधा है
  rationale: אֵת אֲשֶׁר को पूर्ववर्ती प्रथम-पुरुष वाक्यांश के व्याख्यात्मक कर्म के रूप में लिया गया है। ‘बेधा’ דקר की तीक्ष्ण हथियार से आर-पार घायल करने की शक्ति को बनाए रखता है।
- source_word: וְסָפְדוּ עָלָיו
  choice: उसके लिए … विलाप करेंगे
  rationale: ספד मृत्यु-संबंधी औपचारिक शोक या विलाप का बोध देता है; עַל के साथ ‘उसके लिए’ स्वाभाविक हिन्दी है।
- source_word: הַיָּחִיד
  choice: इकलौता पुत्र
  rationale: शोक के प्रसंग में यह इकलौती संतान को सूचित करता है; पुल्लिंग प्रसंग के अनुरूप ‘इकलौता पुत्र’ रखा गया है।
- source_word: וְהָמֵר עָלָיו
  choice: उसके लिए … फूट-फूटकर रोएँगे
  rationale: यह पद तीखे और कटु शोक को व्यक्त करता है; ‘फूट-फूटकर रोना’ आधुनिक हिन्दी में उस भाव की तीव्रता स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַבְּכוֹר
  choice: पहलौठा
  rationale: यह पारंपरिक किंतु आज भी बोधगम्य बाइबलीय हिन्दी शब्द प्रथम जन्मे पुत्र की सांस्कृतिक महत्ता को संक्षेप में रखता है।
theological_decisions:
- issue: ‘मेरी ओर’ से ‘उसके लिए’ में सर्वनाम-परिवर्तन
  choice: 'मूलपाठ का प्रथम पुरुष से तृतीय पुरुष में परिवर्तन बनाए रखा गया है: ‘मेरी ओर … उसके लिए।’'
  alternative: दोनों स्थानों पर ‘मेरे/मेरी’ या दोनों स्थानों पर ‘उसके/उसकी’ करके वाक्य को समरूप बनाना।
  rationale: मसोरेटिक पाठ में जानबूझकर अथवा रहस्यमय रूप से उपस्थित तनाव को अनुवाद में समतल नहीं किया गया।
- issue: רוּחַ की पहचान
  choice: ‘आत्मा’ कहा गया है, ‘पवित्र आत्मा’ नहीं।
  alternative: ‘अनुग्रह और विनती का पवित्र आत्मा’ अथवा स्पष्ट रूप से केवल ‘मनोवृत्ति’।
  rationale: इब्रानी पद ईश्वरीय आत्मिक कार्य की अनुमति देता है, पर यहाँ स्वयं ‘पवित्र’ नहीं कहता और न केवल मानवीय मनोवृत्ति तक अर्थ सीमित करता है।
- issue: पद का मसीह-संबंधी प्रयोग
  choice: मूल इब्रानी का सीधा अनुवाद किया गया है, बिना मसीह की पहचान को पाठ में जोड़ने के।
  alternative: ‘मसीह’ अथवा किसी विशिष्ट पूर्ति का नाम अनुवाद में जोड़ना।
  rationale: यह शब्दांकन बाद की मसीह-संबंधी व्याख्या के अनुकूल है, पर अनुवाद मूलपाठ से अधिक स्पष्ट दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘घराना’, ‘विनती’, ‘विलाप’ और ‘फूट-फूटकर रोना’ औपचारिकता तथा भावात्मक स्पष्टता का संतुलन रखते हैं। ‘पहलौठा’ प्रसंगानुकूल बाइबलीय शब्द है; शेष वाक्यरचना अत्यधिक संस्कृतनिष्ठ नहीं रखी गई।
