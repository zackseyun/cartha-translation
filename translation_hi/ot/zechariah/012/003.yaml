source:
  edition: WLC
  text: וְ/הָיָ֣ה בַ/יּוֹם הַ֠/הוּא אָשִׂ֨ים אֶת יְרוּשָׁלִַ֜ם אֶ֤בֶן מַֽעֲמָסָה֙ לְ/כָל הָ֣/עַמִּ֔ים כָּל עֹמְסֶ֖י/הָ שָׂר֣וֹט יִשָּׂרֵ֑טוּ וְ/נֶאֶסְפ֣וּ עָלֶ֔י/הָ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/003.yaml
  text: And on that day I will make Jerusalem a heavy stone for all the peoples[a]. All who lift it will surely injure themselves[c][b], and all the nations of the earth will gather against her.
translation:
  language: hi
  text: और उस दिन मैं यरूशलेम को सभी जनसमुदायों के लिए एक भारी पत्थर[a] बना दूँगा। उसे उठाने वाले सभी लोग बुरी तरह घायल हो जाएँगे[b], और पृथ्वी के सभी राष्ट्र[c] उसके विरुद्ध इकट्ठे होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभी जनसमुदायों के लिए बोझ उठाने का पत्थर।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘निश्चय ही काटे या चीरे जाएँगे’; इब्रानी में यह गंभीर चोट बताने वाली तीव्र अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘देश के सभी राष्ट्र,’ यदि यहाँ ‘पृथ्वी’ के बजाय स्थानीय ‘देश’ अभिप्रेत हो।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: और उस दिन
  rationale: यह इब्रानी भविष्यसूचक घटनाक्रम को आगे बढ़ाने वाला समय-सूचक वाक्यांश है। ‘और उस दिन’ इसका संबंध और समय दोनों स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אָשִׂים
  choice: बना दूँगा
  rationale: यहाँ שׂים यरूशलेम को ‘भारी पत्थर’ के रूप में ठहराने या बना देने का भाव देता है; ‘बना दूँगा’ परिणामसूचक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶבֶן מַעֲמָסָה
  choice: एक भारी पत्थर
  rationale: पदबंध ऐसे बोझिल पत्थर का चित्र प्रस्तुत करता है जिसे उठाना कठिन और हानिकारक है। ‘भारी पत्थर’ स्पष्ट तथा स्वाभाविक है; ‘बोझ का पत्थर’ पादटिप्पणी में रखा गया है।
- source_word: לְכָל הָעַמִּים
  choice: सभी जनसमुदायों के लिए
  rationale: עַמִּים सामूहिक ‘लोगों/जनसमुदायों’ को दर्शाता है। ‘जनसमुदाय’ बाद के גּוֹיִם (‘राष्ट्र’) से शब्दगत भेद को बनाए रखता है।
- source_word: כָּל עֹמְסֶיהָ
  choice: उसे उठानेवाले सभी लोग
  rationale: עמס का कृदन्त बोझ लादने या उठानेवालों को सूचित करता है। भारी पत्थर के ठोस बिंब में ‘उठानेवाले’ सबसे स्वाभाविक है।
- source_word: שָׂרוֹט יִשָּׂרֵטוּ
  choice: बुरी तरह घायल हो जाएँगे
  rationale: एक ही धातु के भाववाचक रूप और क्रिया का मेल तीव्रता बताता है। मूल धातु काटे या चीरे जाने का संकेत देती है; मुख्य पाठ में गंभीर चोट का स्वाभाविक अर्थ दिया गया है और अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְנֶאֶסְפוּ עָלֶיהָ
  choice: उसके विरुद्ध इकट्ठे होंगे
  rationale: इस सैनिक-भविष्यसूचक संदर्भ में עַל के साथ क्रिया का अर्थ यरूशलेम के विरुद्ध शत्रुतापूर्वक एकत्र होना है।
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: पृथ्वी के सभी राष्ट्र
  rationale: इस अंतरराष्ट्रीय भविष्यसूचक संदर्भ में הָאָרֶץ का व्यापक अर्थ ‘पृथ्वी’ उपयुक्त है, जबकि ‘देश’ की स्थानीय सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: यरूशलेम के विरुद्ध इकट्ठे होने वाले समूह का भौगोलिक विस्तार
  choice: पृथ्वी के सभी राष्ट्र
  alternative: देश के सभी राष्ट्र
  rationale: הָאָרֶץ का अर्थ संदर्भानुसार ‘पृथ्वी’ या ‘देश’ हो सकता है। जकर्याह के इस अंतरराष्ट्रीय संदर्भ में व्यापक अर्थ मुख्य पाठ में रखा गया है, पर स्थानीय अर्थ की वास्तविक सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जनसमुदाय’ और ‘राष्ट्र’ के द्वारा मूल के עַמִּים और גּוֹיִם का भेद सुरक्षित रखा गया है; चोट की तीव्रता तथा ‘पृथ्वी/देश’ की अस्पष्टता पादटिप्पणियों में स्पष्ट की गई है।
