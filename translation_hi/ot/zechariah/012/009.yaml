base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/009.yaml
  text: And on that day I will seek to destroy all the nations that come against Jerusalem[a].
translation:
  language: hi
  text: और उस दिन ऐसा होगा कि मैं यरूशलेम पर चढ़ आनेवाली सभी जातियों को नष्ट करने का यत्न करूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं सभी जातियों को नष्ट करने के लिए कटिबद्ध होऊँगा।” इब्रानी क्रिया केवल प्रयास ही नहीं, दृढ़ संकल्प पर भी बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ... ऐसा होगा
  rationale: यह भविष्य में होने वाली घटना का परिचय देने वाला सामान्य भविष्यद्वाणी-सूत्र है। हिंदी में इसे कालवाचक पद के साथ जोड़ना स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह भविष्यद्वाणी का मानक कालवाचक प्रयोग है; इसके समय या पूर्ति की किसी खास प्रणाली को अनुवाद में नहीं जोड़ा गया।
- source_word: אֲבַקֵּשׁ
  choice: मैं ... यत्न करूँगा
  rationale: पिएल रूप यहाँ केवल खोजने की क्रिया नहीं, बल्कि किसी उद्देश्य की ओर दृढ़तापूर्वक प्रवृत्त होने का भाव देता है। 'यत्न करूँगा' मूल की उद्देश्यपूर्ण चेष्टा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְהַשְׁמִיד
  choice: नष्ट करने
  rationale: हिफ़ील क्रिया विनाश कराने या मिटा देने का अर्थ देती है। 'नष्ट करना' पर्याप्त रूप से प्रबल है, पर मूल से अधिक पूर्ण विनाश का दावा नहीं करता।
- source_word: כָּל הַגּוֹיִם
  choice: सभी जातियों
  rationale: כָּל सामूहिक पूर्णता और הַגּוֹיִם यहाँ यरूशलेम के विरुद्ध आने वाले विदेशी राष्ट्र-समूहों को दर्शाता है। 'जातियाँ' प्रचलित बाइबलीय हिंदी है और बाद की यहूदी-अन्यजाति शब्दावली को अनावश्यक रूप से नहीं थोपता।
- source_word: הַבָּאִים עַל יְרוּשָׁלִָם
  choice: यरूशलेम पर चढ़ आनेवाली
  rationale: कृदंत जातियों का वर्णन करता है और עַל संदर्भ में शत्रुतापूर्ण गति बताता है। 'पर चढ़ आना' आधुनिक हिंदी में सैन्य आक्रमण का स्पष्ट और स्वाभाविक भाव देता है।
theological_decisions:
- issue: न्याय में परमेश्वर की वाणी और कर्तृत्व
  choice: 'प्रथम पुरुष की प्रत्यक्ष वाणी रखी गई: ''मैं ... यत्न करूँगा।'''
  alternative: इसे निष्क्रिय या अवैयक्तिक घटना के रूप में प्रस्तुत करना
  rationale: इब्रानी की प्रथम पुरुष एकवचन क्रिया वक्ता को न्याय के लिए संकल्पपूर्वक कार्यरत दिखाती है; अनुवाद इस कर्तृत्व को न नरम करता है, न किसी अन्य कर्ता को जोड़ता है।
- issue: भविष्यद्वाणी का 'उस दिन' सूत्र
  choice: '''उस दिन'' को बिना समय-सारणी की व्याख्या जोड़े रखा गया।'
  alternative: '''अंतिम दिन'' या किसी निश्चित युग-संबंधी पूर्ति के रूप में विस्तार करना'
  rationale: पद स्वयं उस दिन की सटीक समय-सारणी या पूर्ति-प्रणाली निर्धारित नहीं करता; अतः मूल का भविष्यद्वाणीय तनाव सुरक्षित रखा गया है।
- issue: אֲבַקֵּשׁ में संकल्प और प्रयास का संबंध
  choice: '''यत्न करूँगा'' द्वारा उद्देश्यपूर्ण, दृढ़ प्रवृत्ति व्यक्त की गई।'
  alternative: '''ढूँढ़ूँगा'' अथवा सीधे ''नष्ट कर दूँगा'''
  rationale: '''ढूँढ़ूँगा'' संदर्भ में भ्रामक होगा, जबकि सीधे निश्चित परिणति कहना क्रिया में निहित ''किसी काम के लिए लगना/प्रयत्न करना'' की वास्तविक शाब्दिक छाया को मिटा सकता है।'
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली अपनाई गई है। 'चढ़ आनेवाली' से शत्रुतापूर्ण गति स्पष्ट होती है। 'यत्न करूँगा' के साथ पादटिप्पणी मूल क्रिया में निहित प्रयास और दृढ़ संकल्प—दोनों संभावित बलों को सुरक्षित रखती है।
