  text: בַּ/יּ֨וֹם הַ/ה֜וּא נְאֻם יְהוָ֗ה אַכֶּ֤ה כָל סוּס֙ בַּ/תִּמָּה֔וֹן וְ/רֹכְב֖/וֹ בַּ/שִּׁגָּע֑וֹן וְ/עַל בֵּ֤ית יְהוּדָה֙ אֶפְקַ֣ח אֶת עֵינַ֔/י וְ/כֹל֙ ס֣וּס הָֽ/עַמִּ֔ים אַכֶּ֖ה בַּֽ/עִוָּרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/004.yaml
  text: On that day[a], declares Yahweh, I will strike every horse with panic, and its rider with madness. But over the house of Judah I will keep my eyes open[b], and I will strike every horse of the peoples with blindness.
translation:
  language: hi
  text: उस दिन[a]—याहवे की यह घोषणा है—मैं हर घोड़े पर घबराहट से और उसके सवार पर पागलपन से प्रहार करूँगा। परन्तु यहूदा के घराने पर मैं अपनी आँखें खुली रखूँगा[b], और अन्य जातियों के हर घोड़े पर अंधापन से प्रहार करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उस दिन” भविष्यसूचक अभिव्यक्ति है; इसका सटीक समय इस पद में निर्दिष्ट नहीं है।
    reason: referential_ambiguity
  - marker: b
    text: शाब्दिक रूप में, “मैं यहूदा के घराने पर अपनी आँखें खोलूँगा”; यह अभिव्यक्ति सजग ध्यान का संकेत देती है और इस संदर्भ में अनुकूल देखरेख का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: हिब्रू भविष्यसूचक सूत्र का सीधा और स्वाभाविक हिन्दी रूप; इसका संदर्भगत अर्थ पाठक के लिए खुला रखा गया है।
- source_word: נְאֻם יְהוָה
  choice: यह यहोवा की घोषणा है
  rationale: यह मानक भविष्यसूचक वाक्यांश है। 'घोषणा' ईश्वरीय कथन की अधिकारपूर्ण प्रकृति को व्यक्त करता है, और יהוה को उसके निजी नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: אַכֶּה
  choice: मैं ... आघात करूँगा
  rationale: נכה के हिफ़ील रूप का मूल भाव 'मारना/आघात करना' है। 'आघात करूँगा' परिणाम को मृत्यु तक सीमित किए बिना दैवी प्रहार व्यक्त करता है।
- source_word: כָל סוּס
  choice: हर घोड़े
  rationale: כָל के बाद एकवचन संज्ञा का वितरणात्मक अर्थ आधुनिक हिन्दी में 'हर घोड़े' से स्वाभाविक रूप से व्यक्त होता है।
- source_word: בַּתִּמָּהוֹן
  choice: घबराहट से
  rationale: शब्द विस्मय, संभ्रम और आतंकजनित घबराहट का बोध देता है; युद्ध-संदर्भ में 'घबराहट' स्पष्ट और स्वाभाविक है।
- source_word: וְרֹכְבוֹ
  choice: और उसके सवार को
  rationale: पुल्लिंग एकवचन प्रत्यय का संबंध घोड़े से है; 'उसके सवार' इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: בַּשִּׁגָּעוֹן
  choice: पागलपन से
  rationale: यह संज्ञा विक्षिप्तता अथवा उन्मत्त दशा को दर्शाती है; 'पागलपन' आधुनिक सामान्य हिन्दी में इसकी तीव्रता बनाए रखता है।
- source_word: וְעַל בֵּית יְהוּדָה אֶפְקַח אֶת עֵינַי
  choice: परन्तु यहूदा के घराने पर मैं अपनी आँखें खुली रखूँगा
  rationale: शाब्दिक बिंब 'अपनी आँखें खोलूँगा/खुली रखूँगा' है। संदर्भ में यह यहूदा के प्रति सजग, संभवतः अनुकूल ध्यान को दर्शाता है; बिंब को बनाए रखकर अर्थ का अति-विस्तार नहीं किया गया।
- source_word: בֵּית יְהוּדָה
  choice: यहूदा का घराना
  rationale: यह वाचा-संबंधी सामूहिक अभिव्यक्ति है। 'घराना' केवल भूभाग या व्यक्ति के बजाय यहूदा के समुदाय/वंश का भाव रखता है।
- source_word: כֹל סוּס הָעַמִּים
  choice: सब जातियों के हर घोड़े
  rationale: עַמִּים बहुवचन में बाहरी जनसमूहों अथवा राष्ट्रों को सूचित करता है। 'सब जातियों' से सामूहिक विस्तार और 'हर घोड़े' से वितरणात्मक एकवचन दोनों बने रहते हैं।
- source_word: בַּעִוָּרוֹן
  choice: अन्धेपन से
  rationale: यह न्याय के रूप में दृष्टिहीनता का सीधा अर्थ देता है और घबराहट तथा पागलपन के समानांतर संज्ञात्मक संरचना बनाए रखता है।
theological_decisions:
- issue: यहूदा पर यहोवा की खुली आँखों का आशय
  choice: मूल नेत्र-बिंब को रखते हुए सजग और संभवतः अनुकूल ध्यान का संकेत
  alternative: 'स्पष्ट व्याख्यात्मक अनुवाद: ''मैं यहूदा के घराने की रक्षा के लिए उस पर दृष्टि रखूँगा'''
  rationale: संदर्भ यहूदा और जातियों पर होने वाली कार्रवाइयों में विरोध दिखाता है, पर मूल वाक्य सीधे 'रक्षा' नहीं कहता। अतः अनुकूल ध्यान की संभावना रखी गई है, किन्तु उसे पूर्णतः स्पष्ट संरक्षण-दावे में नहीं बदला गया।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यह निजी दिव्य नाम को नाम के रूप में बनाए रखता है और सामान्य हिन्दी बाइबिलीय प्रयोग में समझने योग्य है; 'प्रभु' मूल में उपस्थित नाम को पदवी में बदल देता।
- issue: जातियों के घोड़ों पर दैवी न्याय
  choice: घबराहट, पागलपन और अन्धेपन को समानांतर दैवी आघातों के रूप में प्रत्यक्ष रखा गया
  alternative: इन्हें केवल रूपकात्मक सैन्य पराजय के रूप में स्पष्ट करना
  rationale: पद स्वयं इन दशाओं को वास्तविक या रूपकात्मक ठहराकर नहीं समझाता; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। 'परन्तु' से संदर्भगत विरोध स्पष्ट होता है; 'घराना', 'आघात' और 'घोषणा' जैसे शब्द बाइबिलीय गंभीरता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
