  text: וְ/אָֽמְר֛וּ אַלֻּפֵ֥י יְהוּדָ֖ה בְּ/לִבָּ֑/ם אַמְצָ֥ה לִ/י֙ יֹשְׁבֵ֣י יְרוּשָׁלִַ֔ם בַּ/יהוָ֥ה צְבָא֖וֹת אֱלֹהֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/005.yaml
  text: Then the clans of Judah will say in their hearts[a], ‘The inhabitants of Jerusalem are my strength in Yahweh of Armies[b], their God.’
translation:
  language: hi
  text: तब यहूदा के कुल[a] अपने-अपने मन में कहेंगे, “यरूशलेम के निवासी उनके परमेश्वर, सेनाओं के याहवे में मेरे लिए सामर्थ्य हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के प्रधान” अथवा “यहूदा के मुखिया।” इब्रानी शब्द אַלֻּפֵי कुलों या उनके प्रधानों, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरूशलेम के निवासी उनके परमेश्वर, सेनाओं के याहवे के द्वारा मेरे लिए सामर्थ्य हैं।” इब्रानी संबंधबोधक शब्द का अर्थ क्षेत्र/आधार (“में”) या साधन/आधार (“के द्वारा”) हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: तब ... कहेंगे
  rationale: भविष्यसूचक प्रसंग में וְ के साथ पूर्ण क्रिया घटनाक्रम को आगे बढ़ाती है; ‘तब’ इस क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַלֻּפֵי יְהוּדָה
  choice: यहूदा के कुल
  rationale: אַלּוּף कुल या उसके प्रधान, दोनों को सूचित कर सकता है। यहाँ यहूदा की सामूहिक इकाइयों और यरूशलेम के निवासियों का संबंध सामने है, इसलिए मुख्य पाठ में ‘कुल’ रखा गया और व्यक्ति-सूचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּלִבָּם
  choice: अपने-अपने मन में
  rationale: यह भीतर कही गई बात या आंतरिक निश्चय का इब्रानी मुहावरा है। ‘अपने-अपने’ बहुवचन कर्ता के बीच व्यक्तिगत, वितरणात्मक भाव को स्पष्ट करता है।
- source_word: אַמְצָה לִי
  choice: मेरा बल हैं
  rationale: संक्षिप्त इब्रानी पदबंध का भाव ‘मेरे लिए बल/सामर्थ्य’ है। ‘मेरा बल’ आधुनिक हिन्दी में स्वाभाविक है और प्रथम पुरुष एकवचन को बनाए रखता है।
- source_word: יֹשְׁבֵי יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: स्थान में रहने वालों के लिए प्रयुक्त कृदन्तीय रचना का सीधा और सामान्य हिन्दी रूप।
- source_word: בַּיהוָה צְבָאוֹת
  choice: सेनाओं के याहवे ... में
  rationale: בְּ को मुख्य पाठ में क्षेत्र या आधार के अर्थ में ‘में’ रखा गया है। याहवे वाचा-संबंधी नाम का लिप्यंतरण है और צְבָאוֹת के युद्ध-संबंधी बल को ‘सेनाओं’ से पारदर्शी बनाया गया है। साधन/आधार का ‘के द्वारा’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֱלֹהֵיהֶם
  choice: उनके परमेश्वर
  rationale: यह यरूशलेम के निवासियों की ओर संकेत करने वाला सीधा संबंधसूचक पदबंध है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे पदवी में बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: צְבָאוֹת का अनुवाद
  choice: सेनाएँ
  alternative: गण; सेनाओं का स्वामी
  rationale: ‘सेनाएँ’ मूल पदवी की सैन्य छवि को स्पष्ट रखता है और अर्थ में अतिरिक्त ‘स्वामी’ नहीं जोड़ता।
- issue: यरूशलेम और याहवे के बीच सामर्थ्य का संबंध
  choice: यरूशलेम के निवासी मेरा बल हैं—... याहवे ... में
  alternative: यरूशलेम के निवासियों से मुझे ... याहवे के द्वारा बल मिलता है
  rationale: इब्रानी בְּ क्षेत्र (‘में’) अथवा साधन/आधार (‘के द्वारा’) बता सकता है। मुख्य पाठ पहले अर्थ को रखता है, जबकि दूसरे को पादटिप्पणी में दिया गया है; इस प्रकार सामर्थ्य के मानवीय और ईश्वरीय संबंध का तनाव मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अपने-अपने मन में’ वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। उद्धरण की संक्षिप्त और कुछ असामान्य संरचना मूल इब्रानी के धर्मवैचारिक तनाव को बनाए रखने के लिए जानबूझकर पूरी तरह नहीं खोली गई है।
