id: ZEC.12.7
reference: Zechariah 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הוֹשִׁ֧יעַ יְהוָ֛ה אֶת אָהֳלֵ֥י יְהוּדָ֖ה בָּ/רִֽאשֹׁנָ֑ה לְמַ֨עַן לֹֽא תִגְדַּ֜ל תִּפְאֶ֣רֶת בֵּית דָּוִ֗יד וְ/תִפְאֶ֛רֶת יֹשֵׁ֥ב יְרוּשָׁלִַ֖ם עַל יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/012/007.yaml
  text: And Yahweh will save the tents of Judah first[b][a], so that the glory of the house of David and the glory of the inhabitants of Jerusalem may not be magnified over Judah.
translation:
  language: hi
  text: और यहोवा पहले यहूदा के तंबुओं[a] को बचाएगा, ताकि दाऊद के घराने की महिमा और यरूशलेम के निवासियों की महिमा यहूदा से बढ़कर न हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा के निवास-स्थानों।” इब्रानी में शाब्दिक रूप से “यहूदा के तंबू” है; संभवतः यह यरूशलेम और दाऊद के घराने के विपरीत यहूदा की बाहरी बस्तियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदा से अधिक महान न हो।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/הוֹשִׁיעַ
  choice: उद्धार करेगा
  rationale: ישׁע के हिफ़ील रूप में बचाने या छुड़ाने का अर्थ है। ‘उद्धार करेगा’ परमेश्वर द्वारा संकट से बचाए जाने के अर्थ और धार्मिक गंभीरता—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אָהֳלֵי יְהוּדָה
  choice: यहूदा के तंबुओं
  rationale: शाब्दिक बिंब ‘तंबू’ बनाए रखा गया है। प्रसंग में यह यरूशलेम और दाऊद के राजघराने के विपरीत यहूदा की बाहरी बस्तियों या सामान्य निवासियों की ओर संकेत कर सकता है।
- source_word: בָּ/רִאשֹׁנָה
  choice: पहले
  rationale: यह क्रियाविशेषण क्रम में प्राथमिकता बताता है; ‘पहले’ संक्षिप्त और स्वाभाविक है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्यसूचक अव्यय है; ‘ताकि’ उसके प्रयोजनात्मक बल को स्पष्ट रखता है।
- source_word: תִגְדַּל
  choice: बढ़कर न हो
  rationale: גדל का मूल भाव बड़ा होना या बढ़ना है। תפארת और עַל के साथ ‘यहूदा से बढ़कर न हो’ महिमा की तुलनात्मक श्रेष्ठता को सहज हिन्दी में व्यक्त करता है।
- source_word: תִּפְאֶרֶת
  choice: महिमा
  rationale: यह शब्द महिमा, शोभा या प्रतिष्ठा का अर्थ दे सकता है। ‘महिमा’ समानांतर रचना और पद की व्यापक अर्थ-संभावना को बनाए रखता है।
- source_word: בֵּית דָּוִיד
  choice: दाऊद का घराना
  rationale: यह वाक्यांश दाऊद के वंश या राजघराने का द्योतक है; ‘घराना’ आधुनिक हिन्दी में वंशगत अर्थ स्पष्ट करता है।
- source_word: יֹשֵׁב יְרוּשָׁלִַם
  choice: यरूशलेम के निवासी
  rationale: इब्रानी में एकवचन कृदंत सामूहिक अर्थ में प्रयुक्त है। हिन्दी में बहुवचन ‘निवासी’ उस सामूहिक आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל יְהוּדָה
  choice: यहूदा से बढ़कर
  rationale: यहाँ עַל यहूदा की तुलना में ऊँचा या श्रेष्ठ होने का संबंध प्रकट करता है; ‘से बढ़कर’ इस तुलनात्मक अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के लोगों के भीतर राजकीय-नगरीय केंद्र और व्यापक यहूदा के बीच अंतर
  choice: पद यह बताता है कि यहोवा यहूदा के तंबुओं को पहले बचाता है, जिससे दाऊद का घराना और यरूशलेम के निवासी यहूदा से बढ़कर महिमा न पाएँ।
  alternative: इसे केवल उद्धार के कालक्रम का कथन माना जा सकता है, जिसमें सामाजिक या राजकीय संतुलन पर विशेष बल न हो।
  rationale: ‘यहूदा के तंबुओं’ का ‘दाऊद के घराने’ और ‘यरूशलेम के निवासियों’ से विरोध तथा उसके बाद आया उद्देश्य-वाक्य केवल क्रम से अधिक संकेत करता है। अनुवाद इस अंतर्निहित संतुलन को रखता है, पर बाहरी बस्तियों या सामाजिक वर्गों की पहचान को मुख्य पाठ में निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तंबुओं’ का ठोस इब्रानी बिंब मुख्य पाठ में सुरक्षित है; ‘दाऊद का घराना’ वंशगत अर्थ स्पष्ट करता है; सामूहिक एकवचन को स्वाभाविक हिन्दी बहुवचन में दिया गया है।
