translation:
  language: hi
  text: तब मैंने उत्तर में उससे कहा, “दीपाधार के दाईं ओर और उसकी बाईं ओर ये दो जैतून के पेड़ क्या हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר אֵלָיו
  choice: तब मैंने उसे उत्तर दिया
  rationale: इब्रानी का शाब्दिक मुहावरा ‘मैंने उत्तर दिया और उससे कहा’ है। आधुनिक हिन्दी में प्रश्न आरम्भ करने के लिए ‘मैंने उसे उत्तर दिया’ स्वाभाविक है और कथानक की क्रमिकता को ‘तब’ व्यक्त करता है; ‘उसे’ मूल के सर्वनाम को बनाए रखता है।
- source_word: מַה שְּׁנֵי הַזֵּיתִים הָאֵלֶּה
  choice: ये दो जैतून के पेड़ क्या हैं
  rationale: זֵיתִים यहाँ दो जैतून के पेड़ों को सूचित करता है, शाखाओं को नहीं; शाखाओं के लिए अगले पद में अलग शब्द आता है। प्रश्न की खुली प्रकृति ‘क्या हैं’ से बनी रहती है।
- source_word: הַמְּנוֹרָה
  choice: दीपाधार
  rationale: מְנוֹרָה दीप रखने वाले आधार को दर्शाता है। ‘दीपाधार’ संक्षिप्त, अर्थपूर्ण और गरिमापूर्ण हिन्दी है तथा केवल ‘दीप’ कहने से होने वाली अर्थ-हानि से बचाता है।
- source_word: עַל יְמִין ... וְעַל שְׂמֹאולָהּ
  choice: के दाईं ओर और उसके बाईं ओर
  rationale: इस स्थानिक प्रयोग में עַל दोनों ओर स्थिति बताता है, ऊपर भौतिक संपर्क नहीं। ‘दाईं ओर ... बाईं ओर’ आधुनिक हिन्दी में स्वाभाविक है; ‘उसके’ का स्त्रीलिंग एकवचन प्रत्यय दीपाधार की ओर संकेत करता है।
