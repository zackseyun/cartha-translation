base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/002.yaml
  text: And he said to me, “What do you see?” And I said, “I see, and behold, a lampstand all of gold, with its bowl on top of it, and seven lamps on it, with seven and seven spouts for the lamps that are on top of it.”
translation:
  language: hi
  text: उसने मुझसे कहा, “तुम क्या देख रहे हो?” मैंने कहा, “मैं देख रहा हूँ—और देखो, पूरी तरह सोने का एक दीपाधार, जिसके ऊपर एक कटोरा है और उस दीपाधार पर सात दीपक हैं; और उसके ऊपर के दीपकों के लिए सात-सात नलिकाएँ हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְנוֹרַת זָהָב
  choice: सोने की एक दीपवृक्ष
  rationale: מְנוֹרָה बहुशाखी दीपाधार को दर्शाता है; ‘दीपवृक्ष’ उसके वृक्षाकार रूप और दीपक रखने के कार्य, दोनों को संक्षेप में व्यक्त करता है।
- source_word: גֻלָּהּ
  choice: उसके ऊपर एक कटोरा
  rationale: यह दीपवृक्ष के शीर्ष पर स्थित तेल रखने वाले पात्र को दर्शाता है; सामान्य और दृश्यात्मक हिन्दी में ‘कटोरा’ उपयुक्त है।
- source_word: מוּצָקוֹת
  choice: नलिकाएँ
  rationale: इस दुर्लभ रूप का आशय यहाँ उन माध्यमों से है जिनसे कटोरे से दीपकों तक तेल पहुँचता है; ‘नलिकाएँ’ वस्तु और कार्य दोनों को स्वाभाविक हिन्दी में बताता है।
- source_word: שִׁבְעָה וְשִׁבְעָה
  choice: सात-सात
  rationale: इब्रानी की पुनरुक्त संख्या को यथावत रखा गया है; इसे ‘उनचास’ बनाना पाठ की वास्तविक अस्पष्टता और संभव वितरण-संकेत को अनावश्यक रूप से निश्चित कर देता।
theological_decisions:
- issue: ‘सात और सात’ की व्याख्या
  choice: सात-सात नलिकाएँ
  alternative: चौदह नलिकाएँ / उनचास नलिकाएँ
  rationale: मसोरेटिक पाठ की असामान्य संख्यात्मक अभिव्यक्ति को बिना किसी एक गणनात्मक व्याख्या को थोपे संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘और देखो’ ने וְהִנֵּה का ध्यान आकर्षित करने वाला बल बनाए रखा है; वाक्य-विन्यास को हिन्दी में सहज बनाने के लिए लंबे इब्रानी वाक्य को दो वाक्यों में बाँटा गया है।
