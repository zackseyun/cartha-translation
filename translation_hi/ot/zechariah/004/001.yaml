translation:
  language: hi
  text: तब मुझसे बात करनेवाला स्वर्गदूत लौट आया और उसने मुझे जगाया, जैसे किसी मनुष्य को उसकी नींद से जगाया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट आया
  rationale: שׁוב का सामान्य अर्थ ‘लौटना’ है; दर्शन के क्रम में यह स्वर्गदूत के फिर से भविष्यद्वक्ता के पास आकर संवाद करने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ हो सकता है, पर भविष्यसूचक दर्शन में यहाँ एक स्वर्गीय संदेशवाहक अभिप्रेत है; आधुनिक हिन्दी में ‘स्वर्गदूत’ स्पष्ट और प्रचलित है।
- source_word: הַדֹּבֵר בִּי
  choice: जो मुझसे बात कर रहा था
  rationale: कृदन्त रूप चलते हुए या चरित्रगत संवाद का भाव देता है, और בִּי को प्रसंगानुसार स्वाभाविक हिन्दी ‘मुझसे’ से व्यक्त किया गया है।
- source_word: וַיְעִירֵנִי
  choice: उसने मुझे ... जगाया
  rationale: עור के हिफ़ील रूप का कारक अर्थ ‘जगाना’ है; कर्ता को स्पष्ट करने के लिए हिन्दी में ‘उसने’ जोड़ा गया है।
- source_word: כְּאִישׁ
  choice: जैसे किसी मनुष्य को
  rationale: तुलना में प्रयुक्त एकवचन אִישׁ को सामान्य मानवीय अर्थ में ‘किसी मनुष्य’ कहा गया है; इससे हिन्दी में उपमा सहज रहती है।
- source_word: אֲשֶׁר יֵעוֹר מִשְּׁנָתוֹ
  choice: उसकी नींद से जगाया जाता है
  rationale: निफ़ाल रूप के निष्क्रिय/आत्मवाचक भाव को निष्क्रिय हिन्दी से व्यक्त किया गया है और पूर्ववर्ती कारक क्रिया के साथ समानता भी बनी रहती है।
