  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुरूप रखी गई है। ‘स्वर्गदूत’ सामान्य पाठक के लिए स्वर्गीय मध्यस्थ को स्पष्ट करता है। अन्तिम निफ़ाल की वास्तविक निष्क्रिय/आत्मवाचक सम्भावना को मुख्य पाठ में निष्क्रिय रूप से सुरक्षित रखा गया है; इसलिए अलग पादटिप्पणी आवश्यक नहीं समझी गई।
