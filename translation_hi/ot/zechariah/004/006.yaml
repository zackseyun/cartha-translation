base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/006.yaml
  text: 'Then he answered and said to me[a], “This is the word of Yahweh to Zerubbabel: ‘Not by might, nor by power[b], but by my Spirit,’ says Yahweh of Armies.”'
translation:
  language: hi
  text: 'तब उसने उत्तर देकर मुझसे कहा, “जरुब्बाबेल को याहवे का यह वचन है: ‘न बल से[a], न सामर्थ्य से, बल्कि मेरी आत्मा से,’ सेनाओं का याहवे[b] कहता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न सेना से” अथवा “न सैन्य शक्ति से”; यहाँ ‘बल’ के लिए प्रयुक्त इब्रानी शब्द सेना या सैन्य शक्ति को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'पारम्परिक अनुवाद: “सेनाओं का प्रभु।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמֶר אֵלַי
  choice: तब उसने उत्तर देकर मुझसे कहा
  rationale: इब्रानी कथात्मक क्रम और उत्तर के बाद वचन कहने की संयुक्त अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: זֶה דְּבַר יְהוָה
  choice: याहवे का यह वचन है
  rationale: ‘वचन’ भविष्यद्वाणी के प्रचलित सूत्र और דָּבָר की अर्थ-गम्भीरता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थानापन्न नहीं किया गया।
- source_word: אֶל זְרֻבָּבֶל
  choice: जरुब्बाबेल के लिए
  rationale: अर्थ यह है कि भविष्यद्वाणी का वचन जरुब्बाबेल को सम्बोधित है; यह हिन्दी में स्वाभाविक रूप से उस लक्ष्य-सम्बन्ध को व्यक्त करता है।
- source_word: לֹא בְחַיִל
  choice: न बल से
  rationale: חַיִל बल, सामर्थ्य या सैन्य शक्ति का बोध करा सकता है। ‘बल’ इसकी व्यापकता बनाए रखता है; सैन्य अर्थ को पाद-टिप्पणी में दिया गया है।
- source_word: וְלֹא בְכֹחַ
  choice: न सामर्थ्य से
  rationale: כֹּחַ के शक्ति/क्षमता सम्बन्धी अर्थ को व्यक्त करते हुए पहले पद के साथ स्पष्ट समानांतरता बनाता है।
- source_word: כִּי אִם בְּרוּחִי
  choice: बल्कि मेरी आत्मा से
  rationale: כִּי אִם का विरोधात्मक बल ‘बल्कि’ से और तीनों בְ संरचनाओं का साधनवाचक अर्थ ‘से’ द्वारा सुरक्षित रहता है। ‘मेरी आत्मा’ यहाँ याहवे की आत्मा को सूचित करता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: צְבָאוֹת का पारदर्शी अर्थ ‘सेनाएँ’ है; साथ ही याहवे नाम को उपाधि से नहीं बदला गया है।
theological_decisions:
- issue: यְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का चतुरक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: בְּרוּחִי में רוּחַ का आशय
  choice: मेरी आत्मा से
  alternative: मेरी सांस से; मेरी हवा से
  rationale: वक्ता याहवे है और बल तथा सामर्थ्य के विपरीत अपनी רוּחַ को कार्य का साधन बताता है; सन्दर्भ में ‘आत्मा’ सर्वाधिक उपयुक्त है, यद्यपि इब्रानी शब्द का मूल अर्थ-क्षेत्र सांस और हवा को भी समेटता है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं का याहवे
  alternative: सेनाओं का प्रभु; याहवे सबाओत
  rationale: यह रूप मूल के सैन्य और सम्भावित स्वर्गीय दोनों संकेतों को खुला रखता है तथा अस्पष्ट पारम्परिक लिप्यंतरण से अधिक बोधगम्य है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘न…न…बल्कि…’ मूल की संक्षिप्त और प्रभावशाली समानांतर संरचना को बनाए रखता है। पाद-टिप्पणी चिह्न उन्हीं शब्दों के साथ लगाए गए हैं जिनसे वे सम्बन्धित हैं।
