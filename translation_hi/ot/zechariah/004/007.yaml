  text: מִֽי אַתָּ֧ה הַֽר הַ/גָּד֛וֹל לִ/פְנֵ֥י זְרֻבָּבֶ֖ל לְ/מִישֹׁ֑ר וְ/הוֹצִיא֙ אֶת הָ/אֶ֣בֶן הָ/רֹאשָׁ֔ה תְּשֻׁא֕וֹת חֵ֥ן חֵ֖ן לָֽ/הּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/007.yaml
  text: Who are you[a], O great mountain? Before Zerubbabel you will become a plain. And he will bring out the top stone amid shouts of, ‘Grace[b], grace to it!’
translation:
  language: hi
  text: '“हे बड़े पहाड़, तू क्या है? जरुब्बाबेल के सामने तू समतल मैदान बन जाएगा। वह जयघोषों के बीच शीर्ष-पत्थर[a] बाहर ले आएगा: ‘इस पर अनुग्रह हो, अनुग्रह हो!’[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चोटी का पत्थर” अथवा “मुकुट-पत्थर”; शाब्दिक अर्थ “सिर का पत्थर” है।
    reason: lexical_alternative
  - marker: b
    text: या “इस पर कृपा हो, कृपा हो!” अथवा “यह कितना सुंदर है!” इब्रानी חֵן का अर्थ संदर्भ के अनुसार अनुग्रह, कृपा, मनोहरता या सुंदरता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַר הַגָּדוֹל
  choice: हे बड़े पहाड़
  rationale: सीधे संबोधन और विशाल बाधा के रूपक, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְמִישֹׁר
  choice: समतल मैदान बन जाएगा
  rationale: מִישׁוֹר के समतल भूमि अथवा मैदान के अर्थ और पहाड़ के रूपांतरित होने की छवि को सुरक्षित रखता है।
- source_word: וְהוֹצִיא
  choice: वह ... बाहर ले आएगा
  rationale: संदर्भ में कर्ता जरुब्बाबेल है; हिफ़ील रूप किसी वस्तु को बाहर लाने या सामने प्रस्तुत करने का भाव देता है।
- source_word: הָאֶבֶן הָרֹאשָׁה
  choice: चोटी का पत्थर
  rationale: शाब्दिक ‘सिर का पत्थर’ की स्थापत्य छवि को समझने योग्य हिन्दी में व्यक्त करता है, पर तकनीकी पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תְּשֻׁאוֹת
  choice: लोग पुकार उठेंगे
  rationale: यह बहुवचन संज्ञा ऊँची सामूहिक पुकारों या जयघोषों को दर्शाती है; हिन्दी में क्रियात्मक अभिव्यक्ति अधिक स्वाभाविक है।
- source_word: חֵן חֵן לָהּ
  choice: इस पर अनुग्रह हो, अनुग्रह हो!
  rationale: חֵן के अनुग्रह/कृपा के भाव और לָהּ के पत्थर की ओर संकेत को रखता है; पुनरुक्ति का जोर भी सुरक्षित है।
theological_decisions:
- issue: जयघोष में חֵן का अर्थ
  choice: पत्थर अथवा उससे सूचित निर्माण पर अनुग्रह की कामना या घोषणा
  alternative: उसकी सुंदरता अथवा मनोहरता की प्रशंसा
  rationale: חֵן का अर्थ अनुग्रह, कृपा, मनोहरता या सुंदरता हो सकता है। मंदिर-निर्माण के इस भविष्यसूचक संदर्भ में ‘अनुग्रह’ उपयुक्त है, लेकिन वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यसूचक शैली रखी गई है। ‘हे’ सीधे संबोधन को स्पष्ट करता है; ‘तू’ निर्जीव पहाड़ के अलंकारिक एकवचन संबोधन के लिए स्वाभाविक है। तकनीकी स्थापत्य शब्द को मुख्य पाठ में निर्णायक न बनाकर विकल्प पादटिप्पणी में दिया गया है।
