  to: '“हे बड़े पहाड़, तू क्या है? जरुब्बाबेल के सामने तू समतल मैदान बन जाएगा। वह जयघोषों के बीच शीर्ष-पत्थर[a] बाहर ले आएगा: ‘इस पर अनुग्रह हो, अनुग्रह हो!’[b]”'
