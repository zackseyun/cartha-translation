base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/005.yaml
  text: Then the angel who was speaking with me answered and said to me[a], “Do you not know what these are?” And I said, “No[b], my lord.”
translation:
  language: hi
  text: तब मुझसे बात कर रहे स्वर्गदूत ने उत्तर दिया और मुझसे कहा[a], “क्या तुम नहीं जानते कि ये क्या हैं?” मैंने कहा, “नहीं[b], मेरे प्रभु।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो मुझसे बातें कर रहा था।” इब्रानी मुहावरा जकर्याह के साथ स्वर्गदूत की चल रही बातचीत का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “महोदय।” इब्रानी में शाब्दिक अर्थ “मेरे प्रभु” है। यह स्वर्गदूत के लिए आदरसूचक संबोधन है, यहोवा के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का यह कथात्मक प्रयोग संवाद में उत्तर देने या प्रत्युत्तर देने को दर्शाता है; ‘उत्तर दिया’ स्वाभाविक और स्रोत के निकट है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ भी हो सकता है, पर जकर्याह के दर्शन में यह स्वर्गीय व्याख्याकार है; इसलिए ‘स्वर्गदूत’ संदर्भानुकूल है।
- source_word: הַדֹּבֵר בִּי
  choice: मुझसे बात कर रहे
  rationale: सहभागी कृदंत और בְּ के साथ यह पदबंध जकर्याह से चल रही बातचीत में लगे स्वर्गदूत का वर्णन करता है; हिन्दी में ‘मुझसे बात कर रहे’ इसकी निरंतरता और पारस्परिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיֹּאמֶר אֵלַי
  choice: मुझसे कहा
  rationale: אמר אל का सीधा और स्वाभाविक हिन्दी रूप है; यह प्रत्यक्ष कथन की भूमिका को बनाए रखता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: प्रश्नवाचक निषेध की आलंकारिक प्रश्न-रचना को बिना उसके भाव को अधिक निश्चित किए सुरक्षित रखता है।
- source_word: יָדַעְתָּ
  choice: जानते
  rationale: ידע का प्राथमिक अर्थ ‘जानना’ है; यहाँ ‘समझते’ संभव है, लेकिन ‘जानते’ इब्रानी के अधिक निकट और हिन्दी में स्वाभाविक है।
- source_word: מָה הֵמָּה אֵלֶּה
  choice: ये क्या हैं
  rationale: दर्शन में दिखाई गई वस्तुओं की पहचान या अर्थ पूछा गया है; यह संक्षिप्त हिन्दी अभिव्यक्ति मूल की अस्पष्टता बनाए रखती है।
- source_word: וָאֹמַר
  choice: मैंने कहा
  rationale: यह संवाद की अगली कथात्मक क्रिया है; हिन्दी में अलग ‘और’ आवश्यक नहीं और वाक्य अधिक स्वाभाविक रहता है।
- source_word: לֹא
  choice: नहीं
  rationale: मूल में संक्षिप्त नकारात्मक उत्तर है; पूर्व प्रश्न से लुप्त क्रिया स्वतः समझी जाती है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह स्वर्गदूत के प्रति आदरसूचक संबोधन है, यहोवा का नाम नहीं। ‘मेरे प्रभु’ मूल के स्वामित्वसूचक और सम्मानसूचक रूप को बनाए रखता है; पादटिप्पणी संभावित भ्रम स्पष्ट करती है।
theological_decisions:
- issue: אֲדֹנִי का संदर्भ और भाव
  choice: 'स्वर्गदूत के लिए आदरसूचक संबोधन: ‘मेरे प्रभु’'
  alternative: ‘महोदय’ या ‘स्वामी’
  rationale: संदर्भ में जकर्याह उस व्याख्या करने वाले स्वर्गदूत से बोल रहा है, न कि सीधे यहोवा से। ‘मेरे प्रभु’ मूल की सम्मानसूचक शक्ति बनाए रखता है, जबकि पादटिप्पणी इसे परमेश्वर के लिए प्रयुक्त उपाधि समझने से रोकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘स्वर्गदूत’ सामान्य पाठक के लिए स्पष्ट है; प्रश्न और संक्षिप्त उत्तर की मूल संवादात्मक तीक्ष्णता बनाए रखी गई है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
