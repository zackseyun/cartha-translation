base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/010.yaml
  text: For who has despised the day of small things? For these seven will rejoice and will see the plumb stone in the hand of Zerubbabel—these are the eyes of Yahweh[a], ranging through all the earth.
translation:
  language: hi
  text: क्योंकि छोटी बातों के दिन को किसने तुच्छ जाना है? ये सातों आनन्दित होंगे और जरुब्बाबेल के हाथ में साहुल-पत्थर[a] देखेंगे—ये याहवे की आँखें हैं, जो सारी पृथ्वी में घूमती-फिरती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राँगे का पत्थर’; परम्परागत अनुवाद ‘साहुल’। इब्रानी शब्द राँगे को सूचित कर सकता है, लेकिन भवन-निर्माण के इस प्रसंग में सम्भवतः सीध जाँचने वाला साहुल या उसका भार अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַז
  choice: तुच्छ जाना है
  rationale: यह क्रिया किसी वस्तु को नगण्य या घृणा के योग्य समझने का भाव देती है। प्रश्न की आलंकारिक शक्ति बनाए रखने के लिए पूर्ण पक्ष रखा गया है।
- source_word: לְיוֹם קְטַנּוֹת
  choice: छोटी बातों के दिन को
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक अर्थ ‘छोटी बातों/छोटेपन का दिन’ है। ‘छोटी शुरुआतों’ कहने से संदर्भ स्पष्ट होता, पर मूल से अधिक अर्थ निर्धारित हो जाता; इसलिए उसकी खुली अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: וְשָׂמְחוּ וְרָאוּ
  choice: आनन्दित होंगे और ... देखेंगे
  rationale: दोनों समन्वित क्रियाओं को अलग-अलग भविष्यकालीन क्रियाओं के रूप में रखा गया है, ताकि किसी एक को दूसरी का केवल कालवाचक या कारणवाचक उपवाक्य न बनाया जाए।
- source_word: הָאֶבֶן הַבְּדִיל
  choice: साहुल का पत्थर
  rationale: בְּדִיל का अर्थ ‘राँगा’ हो सकता है, पर भवन-निर्माण के इस प्रसंग में यह संभवतः सीध जाँचने वाले साहुल के भार या पत्थर को सूचित करता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּיַד זְרֻבָּבֶל
  choice: जरुब्बाबेल के हाथ में
  rationale: यह मूल मुहावरे और मंदिर के निर्माण में जरुब्बाबेल की सक्रिय भूमिका पर दिए गए बल को सीधे रूप में सुरक्षित रखता है।
- source_word: שִׁבְעָה אֵלֶּה
  choice: ये सातों
  rationale: संकेतवाचक शब्द और सात की निश्चित संख्या दोनों स्पष्ट हैं। हिन्दी में ‘सातों’ ज्ञात सात के पूरे समूह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵינֵי יְהוָה
  choice: याहवे की आँखें
  rationale: दृष्टान्त की महत्त्वपूर्ण नेत्र-छवि को यथावत रखा गया है और परमेश्वर के व्यक्तिगत नाम יהוה का लिप्यंतरण ‘याहवे’ किया गया है।
- source_word: מְשׁוֹטְטִים בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर इधर-उधर घूमती रहती हैं
  rationale: कृदन्त व्यापक और निरन्तर सक्रिय गति का बोध कराता है। यह हिन्दी अभिव्यक्ति पूरे संसार में घूमने की छवि को सहज रूप में बनाए रखती है।
theological_decisions:
- issue: ‘ये सातों’ की पहचान
  choice: इसे अगले वाक्यांश ‘याहवे की आँखें’ के साथ समानाधिकरण में समझते हुए अनुवादित किया गया है।
  alternative: यह पहले दर्शन के सात दीपकों को सूचित कर सकता है, जिन्हें फिर याहवे की आँखों के रूप में पहचाना गया हो।
  rationale: इब्रानी वाक्य-विन्यास में ‘ये सातों’ के तुरन्त बाद ‘याहवे की आँखें’ आता है। अनुवाद इस प्रतीकात्मक पहचान को रखता है, पर सातों और पहले के दीपकों के सम्बन्ध को पाठ से आगे जाकर स्पष्ट नहीं करता।
- issue: आनन्दित होने और देखने का सम्बन्ध
  choice: 'दोनों को समन्वित क्रियाओं के रूप में रखा गया है: ‘आनन्दित होंगे और ... देखेंगे।’'
  alternative: ‘साहुल का पत्थर देखकर आनन्दित होंगे,’ जिसमें देखना आनन्द का समय या कारण बनता है।
  rationale: मूल में दोनों क्रियाएँ וְ से जुड़ी हुई हैं। समन्वय रखने से उनका सम्भावित कालगत या कारणगत सम्बन्ध अनावश्यक रूप से निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। ‘छोटी बातों का दिन’ जैसी असामान्य मूल छवि को व्याख्यात्मक ‘छोटी शुरुआतों’ से नहीं बदला गया। ‘साहुल’ अपेक्षाकृत विशिष्ट निर्माण-शब्द है, इसलिए उसके साथ ‘पत्थर’ और पादटिप्पणी दी गई है।
