source:
  edition: WLC
  text: יְדֵ֣י זְרֻבָּבֶ֗ל יִסְּד֛וּ הַ/בַּ֥יִת הַ/זֶּ֖ה וְ/יָדָ֣י/ו תְּבַצַּ֑עְנָה וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה צְבָא֖וֹת שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/009.yaml
  text: The hands of Zerubbabel laid the foundation of this house[a], and his hands will complete it[b]. Then you will know that Yahweh of Armies has sent me to you.
translation:
  language: hi
  text: जरुब्बाबेल के हाथों ने इस भवन[a] की नींव रखी है, और उसके हाथ इसे पूरा करेंगे। तब तू जान लेगा कि सेनाओं के यहोवा ने मुझे तुम लोगों के पास भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भवन’ से मंदिर अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: יְדֵי זְרֻבָּבֶל
  choice: जरुब्बाबेल के हाथों ने
  rationale: बहुवचन ‘हाथों’ को बनाए रखने से जरुब्बाबेल की व्यक्तिगत भूमिका पर दिया गया बल और अगले खंड में इसकी पुनरावृत्ति सुरक्षित रहती है।
- source_word: יִסְּדוּ
  choice: नींव रखी है
  rationale: मंदिर-निर्माण के संदर्भ में יסד का विशिष्ट अर्थ नींव रखना है; पूर्ण क्रिया को वर्तमान परिणाम सहित स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַבַּיִת הַזֶּה
  choice: इस भवन
  rationale: בַּיִת का मूल अर्थ घर/भवन है। यहाँ मंदिर अभिप्रेत है, पर ‘भवन’ मूल रूपक को बनाए रखते हुए हिन्दी में गरिमापूर्ण और स्पष्ट है।
- source_word: וְיָדָיו תְּבַצַּעְנָה
  choice: और उसी के हाथ इसे पूरा करेंगे
  rationale: ‘हाथ’ की पुनरावृत्ति को सुरक्षित रखा गया है और ‘उसी’ आरम्भ करने तथा पूरा करने वाले की समानता पर बल देता है। स्त्रीलिंग बहुवचन क्रिया का आशय हाथों द्वारा कार्य को पूर्ण करना है।
- source_word: וְיָדַעְתָּ
  choice: तब तू जान लेगा
  rationale: वाव सहित पूर्ण रूप यहाँ भावी परिणाम बताता है। एकवचन संबोधन को ‘तू’ द्वारा सुरक्षित रखा गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: यहोवा नाम को प्रत्यक्ष रखा गया है और צְבָאוֹת का अर्थ आधुनिक हिन्दी में ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण क्रिया को ऐसी हिन्दी में दिया गया है जो पूर्ण हुई भेजने की क्रिया और उसकी वर्तमान प्रासंगिकता दोनों दर्शाती है।
- source_word: אֲלֵיכֶם
  choice: तुम लोगों के पास
  rationale: इब्रानी में संबोधन बहुवचन है; हिन्दी में ‘तुम लोगों’ से यह संख्या स्पष्ट होती है और पहले आए एकवचन ‘तू’ से भेद बना रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: प्रत्यक्ष वाचा-नाम को ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में सुविदित रूप ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक पुनर्निर्मित उच्चारण है।
- issue: צְבָאוֹת की अभिव्यक्ति
  choice: सेनाओं के
  alternative: सेनाधीश / सबाओत
  rationale: शब्द के बहुवचन ‘सेनाएँ’ के अर्थ को सीधे सुरक्षित रखा गया है; ‘सेनाधीश’ ईश्वर की भूमिका को स्पष्ट करता है पर व्याकरणिक रूप को बदल देता है, और ‘सबाओत’ सामान्य पाठक के लिए अस्पष्ट है।
- issue: וְיָדַעְתָּ और אֲלֵיכֶם में संख्या का परिवर्तन
  choice: ‘तू’ एकवचन, फिर ‘तुम लोगों’ बहुवचन
  alternative: दोनों स्थानों पर ‘तुम’
  rationale: मूल पाठ पहले एक व्यक्ति को संबोधित करता है और फिर समुदाय की ओर बहुवचन में मुड़ता है। सम्भवतः ‘तू’ भविष्यद्वक्ता से है और ‘तुम लोग’ समुदाय से, पर अनुवाद इस पहचान को व्याख्यात्मक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण गद्य। ‘भवन’ संदर्भ में मंदिर को सूचित करता है, पर मूल ‘घर/भवन’ की अभिव्यक्ति को अनावश्यक रूप से ‘मंदिर’ नहीं बनाया गया। एकवचन और बहुवचन संबोधन का मूल परिवर्तन स्पष्ट रखा गया है।
