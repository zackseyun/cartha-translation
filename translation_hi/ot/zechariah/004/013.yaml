  yaml_path: translation/ot/zechariah/004/013.yaml
  text: Then he said to me[a], “Do you not know what these are?” And I said, “No, my lord.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “क्या तुम नहीं जानते कि ये क्या हैं?” मैंने कहा, “नहीं, मेरे स्वामी[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” इब्रानी אֲדֹנִי आदरपूर्ण संबोधन है, जिसका अर्थ “मेरे स्वामी” है। यहाँ यह दर्शन में जकर्याह के संबोधित व्यक्ति के लिए प्रयुक्त हुआ है, परमेश्वर के नाम के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי לֵאמֹר
  choice: तब उसने मुझसे कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिन्दी में व्यक्त करता है। לֵאמֹר का उद्धरण-सूचक कार्य सीधे संवाद के उद्धरण-चिह्नों से स्पष्ट है, इसलिए अलग से ‘कहते हुए’ जोड़ना अनावश्यक है।
- source_word: הֲלוֹא יָדַעְתָּ
  choice: क्या तुम नहीं जानते
  rationale: प्रश्नवाचक הֲ और निषेध לֹא की संरचना ऐसे प्रश्न को व्यक्त करती है जिसमें सकारात्मक उत्तर की अपेक्षा है। हिन्दी में यह रूप उसकी प्रश्नात्मकता और आलंकारिक बल दोनों बनाए रखता है।
- source_word: מָה אֵלֶּה
  choice: कि ये क्या हैं
  rationale: प्रश्नवाचक सर्वनाम और बहुवचन संकेतवाचक का स्वाभाविक हिन्दी रूप, जो दर्शन में पहले बताई गई वस्तुओं की ओर संकेत बनाए रखता है।
- source_word: וָאֹמַר לֹא
  choice: मैंने कहा, ‘नहीं’
  rationale: इब्रानी उत्तर में केवल निषेध है। हिन्दी संवाद में ‘नहीं’ उसी संक्षिप्त, अध्याहृत उत्तर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह आदरसूचक सम्बोधन है। ‘मेरे स्वामी’ मूल के स्वामित्वसूचक प्रत्यय और आदरपूर्ण अर्थ को सुरक्षित रखता है; यहाँ यह परमेश्वर के विशिष्ट नाम का रूप नहीं है।
theological_decisions:
- issue: אֲדֹנִי को ईश्वरीय उपाधि मानने के बजाय दर्शन में बोलने वाले के लिए आदरसूचक सम्बोधन के रूप में प्रस्तुत करना
  choice: मेरे स्वामी
  alternative: महोदय
  rationale: संदर्भ में जकर्याह दर्शन में उससे बात करने वाले व्याख्याकार को सम्बोधित कर रहा है। इसलिए इसे परमेश्वर के विशिष्ट नाम या अनिवार्य रूप से ईश्वरीय उपाधि के रूप में नहीं दिखाया गया; फिर भी ‘मेरे स्वामी’ मूल शब्द की गरिमा और उसके प्रथम-पुरुष प्रत्यय को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘क्या तुम नहीं जानते’ मूल प्रश्न की अपेक्षात्मक और कुछ हद तक उलाहनापूर्ण शक्ति को बिना अधिक व्याख्या के बनाए रखता है।
