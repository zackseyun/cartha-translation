base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/014.yaml
  text: And he said[a], “These are the two sons of oil[b], who stand by the Lord of all the earth.”
translation:
  language: hi
  text: उसने कहा, “ये तेल के दो पुत्र[a] हैं, जो सारी पृथ्वी के प्रभु के पास खड़े रहते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दो अभिषिक्त जन।” शाब्दिक रूप से, “तेल के दो पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या “जो सारी पृथ्वी के प्रभु के सामने खड़े रहते हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: यह וַיקטֹל कथात्मक रूप आगे दिए गए स्पष्टीकरण को प्रस्तुत करता है। हिन्दी में ‘उसने कहा’ स्वाभाविक रूप से सरल कथात्मक क्रम बनाए रखता है।
- source_word: אֵלֶּה שְׁנֵי
  choice: ये ... दो
  rationale: बहुवचन संकेतवाचक और संख्या को हिन्दी की स्वाभाविक विधेयात्मक रचना में रखा गया है; ‘हैं’ निहित हिब्रू योजक क्रिया को व्यक्त करता है।
- source_word: בְּנֵי הַיִּצְהָר
  choice: तेल के दो पुत्र
  rationale: יִצְהָר जैतून के तेल, विशेषतः ताज़े तेल, को सूचित करता है। मुख्य पाठ में असामान्य ‘पुत्र’ रूपक को बनाए रखा गया है और उसे सीधे ‘अभिषिक्त जन’ बनाकर उसकी व्याख्या तय नहीं की गई।
- source_word: הָעֹמְדִים
  choice: जो ... खड़े रहते हैं
  rationale: कृदन्त इन दोनों की निरंतर स्थिति या सेवकीय भूमिका बताता है; ‘खड़े रहते हैं’ हिन्दी में उस स्थायी भाव को सहज रूप से व्यक्त करता है।
- source_word: עַל
  choice: के पास
  rationale: ‘खड़ा होना’ के साथ यहाँ यह किसी प्रभु की उपस्थिति में उसके निकट सेवा के लिए खड़े होने का भाव दे सकता है। ‘के पास’ मुख्य पाठ में स्वाभाविक है; दरबारी उपस्थिति का सम्भव भाव ‘के सामने’ पादटिप्पणी में रखा गया है।
- source_word: אֲדוֹן
  choice: प्रभु
  rationale: यह सार्वभौम स्वामी की उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: यह प्रभु के सार्वभौम अधिकार को व्यक्त करता है और हिन्दी में सीधा तथा सुबोध है।
theological_decisions:
- issue: בְּנֵי הַיִּצְהָר की पहचान
  choice: मुख्य पाठ में ‘तेल के दो पुत्र’ रूपक को बनाए रखना
  alternative: दो अभिषिक्त जन
  rationale: हिब्रू वाक्यांश स्वयं ‘अभिषिक्त’ के सामान्य शब्द का प्रयोग नहीं करता। शाब्दिक रूपक को बनाए रखने से इन दोनों की पहचान या भूमिका को आवश्यकता से अधिक निश्चित नहीं किया जाता; प्रचलित व्याख्यात्मक अनुवाद पादटिप्पणी में दिया गया है।
- issue: הָעֹמְדִים עַל אֲדוֹן का संबंध
  choice: ‘प्रभु के पास खड़े रहते हैं’
  alternative: ‘प्रभु के सामने खड़े रहते हैं’
  rationale: दोनों अनुवाद प्रभु की उपस्थिति में सेवकीय रूप से खड़े होने का भाव दे सकते हैं। मुख्य पाठ में सहज हिन्दी चुनी गई है, जबकि सम्भव दरबारी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। असामान्य हिब्रू रूपक ‘तेल के दो पुत्र’ को जानबूझकर मुख्य पाठ में सुरक्षित रखा गया है; पादटिप्पणियाँ उसके प्रचलित अर्थ और स्थान-संबंधी वैकल्पिक सूक्ष्मता स्पष्ट करती हैं।
