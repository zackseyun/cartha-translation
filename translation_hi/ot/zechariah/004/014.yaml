  source_fidelity: ‘ये तेल के दो पुत्र हैं’ faithfully retains the deliberately unusual construct בְּנֵי הַיִּצְהָר without prematurely identifying the figures as anointed persons. ‘सारी पृथ्वी के प्रभु’ accurately represents אֲדוֹן כָּל־הָאָרֶץ, and ‘के पास खड़े रहते हैं’ preserves the attendant-presence sense of the participial phrase while the viable ‘सामने’ alternative is footnoted.
