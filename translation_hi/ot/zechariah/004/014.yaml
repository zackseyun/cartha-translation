  terminology: ‘प्रभु’ is appropriate for אֲדוֹן in this exalted context. ‘अभिषिक्त जन’ is correctly confined to a lexical-alternative footnote rather than imposed on the main text. Footnote markers are placed on the relevant Hindi expressions and, unlike the English audit text’s marker placement, unambiguously anchor the respective alternatives.
