  terminology: '''स्वर्गदूत'' suits the visionary context. For אֲדֹנִי, ''मेरे स्वामी'' preserves the respectful possessive address while avoiding the stronger conventional association of ''प्रभु'' with God in Hindi Bible usage; the immediate addressee is the angel, not God.'
