  yaml_path: translation/ot/zechariah/004/004.yaml
  text: Then I answered and said to the angel who was speaking with me[a], “What are these, my lord?”
translation:
  language: hi
  text: तब मैंने उत्तर दिया और मुझसे बात करने वाले स्वर्गदूत से कहा,[a] “मेरे स्वामी, ये क्या हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझसे बोलने वाले।” यह इब्रानी अभिव्यक्ति जकर्याह में नबी के साथ रहने वाले और दर्शन का अर्थ समझाने वाले स्वर्गदूत के लिए बार-बार आती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן וָאֹמַר
  choice: तब मैंने उत्तर दिया और ... कहा
  rationale: इब्रानी के दोनों क्रियापदों—‘उत्तर दिया’ और ‘कहा’—को रखते हुए क्रमसूचक वाव को स्वाभाविक हिन्दी में ‘तब’ से व्यक्त किया गया है।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: दर्शन के प्रसंग में यह नबी को अर्थ समझाने वाला स्वर्गीय दूत है; इसलिए सामान्य ‘दूत’ की अपेक्षा ‘स्वर्गदूत’ अधिक स्पष्ट है।
- source_word: הַדֹּבֵר בִּי
  choice: मुझसे बात करने वाले
  rationale: यह जकर्याह में बार-बार आने वाली अभिव्यक्ति है और यहाँ नबी के साथ संवाद करने का अर्थ देती है। कृदन्त का भाव हिन्दी में ‘करने वाले’ से व्यक्त हुआ है।
- source_word: לֵאמֹר
  choice: अलग से अनूदित नहीं
  rationale: ‘कहा’ के बाद प्रत्यक्ष कथन आने से हिन्दी में इसका वाक्य-परिचायक कार्य पहले ही स्पष्ट है; ‘यह कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: מָה אֵלֶּה
  choice: ये क्या हैं?
  rationale: प्रश्नवाचक और बहुवचन संकेतवाचक का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: אֲדֹנִי
  choice: हे मेरे प्रभु
  rationale: यह स्वर्गदूत के लिए आदरसूचक संबोधन है। ‘मेरे प्रभु’ मूल के स्वामित्वसूचक रूप और गरिमापूर्ण शैली को बनाए रखता है; ‘हे’ हिन्दी में संबोधन को स्पष्ट करता है।
theological_decisions:
- issue: क्या אֲדֹנִי परमेश्वर के लिए प्रयुक्त उपाधि है या स्वर्गदूत के लिए आदरसूचक संबोधन?
  choice: तत्काल संबोधित स्वर्गदूत के लिए आदरसूचक ‘हे मेरे प्रभु’
  alternative: इसे परमेश्वर की उपाधि ‘प्रभु’ समझना, अथवा अधिक सामान्य ‘महोदय’ कहना
  rationale: वाक्य में जकर्याह सीधे उस स्वर्गदूत से प्रश्न करता है जो उससे बात कर रहा था। अतः यहाँ दिव्य नाम या परमेश्वर की विशिष्ट उपाधि आरोपित नहीं की गई, जबकि मूल का सम्मानसूचक भाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण भविष्यद्वाणी-दर्शन शैली रखी गई है। ‘उत्तर दिया और ... कहा’ मूल की दोहरी कथन-शैली को सुरक्षित रखता है।
