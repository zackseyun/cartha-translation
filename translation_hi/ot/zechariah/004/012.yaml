source:
  edition: WLC
  text: וָ/אַ֣עַן שֵׁנִ֔ית וָ/אֹמַ֖ר אֵלָ֑י/ו מַה שְׁתֵּ֞י שִׁבֲּלֵ֣י הַ/זֵּיתִ֗ים אֲשֶׁר֙ בְּ/יַ֗ד שְׁנֵי֙ צַנְתְּר֣וֹת הַ/זָּהָ֔ב הַֽ/מְרִיקִ֥ים מֵ/עֲלֵי/הֶ֖ם הַ/זָּהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/004/012.yaml
  text: Then I answered a second time and said to him[a], “What are these two olive branches that are beside the two golden pipes[c][b], which pour out the gold from themselves?”
translation:
  language: hi
  text: फिर मैंने दूसरी बार उससे कहा, “जैतून की ये दो फलदार टहनियाँ[a] क्या हैं, जो सोने की दो नलियों[b] के पास हैं और अपने भीतर से सोना[c] उँडेलती हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जैतून के पेड़ों के ये दो गुच्छे/कोंपलें।” यहाँ प्रयुक्त इब्रानी शब्द असामान्य है और बड़ी डालियों के बजाय फल लगे हुए छोटे अग्रभागों या टहनियों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सोने की दो नलिकाएँ” अथवा “दो स्वर्ण-नलिकाएँ।”
    reason: lexical_alternative
  - marker: c
    text: सम्भवतः आशय “सुनहरा तेल” है; इब्रानी में शाब्दिक रूप से “सोना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעַן שֵׁנִית וָאֹמַר אֵלָיו
  choice: फिर मैंने दूसरी बार उससे कहा
  rationale: इब्रानी कथाक्रम, स्पष्ट पुनरावृत्ति और ‘कहा’ के मूल अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; प्रश्न होने पर भी क्रिया को ‘पूछा’ बनाकर व्याख्यात्मक नहीं किया गया।
- source_word: שְׁתֵּי שִׁבֲּלֵי הַזֵּיתִים
  choice: जैतून की ये दो फलदार टहनियाँ
  rationale: שִׁבֲּלֵי सामान्यतः बालियों या गुच्छेदार/फलधारी अग्रभागों का संकेत देता है। दर्शन के वृक्ष-संदर्भ में ‘फलदार टहनियाँ’ केवल ‘डालियाँ’ से अधिक विशिष्ट है, जबकि असामान्य शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: אֲשֶׁר בְּיַד
  choice: जो ... के पास हैं
  rationale: शाब्दिक रूप ‘के हाथ में/हाथ के निकट’ है, पर निर्जीव वस्तुओं के स्थान-संबंध में इसका स्वाभाविक अर्थ ‘के पास’ है।
- source_word: שְׁנֵי צַנְתְּרוֹת הַזָּהָב
  choice: सोने की दो नलियों
  rationale: दुर्लभ צַנְתְּרוֹת प्रवाह ले जाने वाली नलियों या नलिकाओं को दर्शाता है। ‘सोने की दो नलियाँ’ चित्र को सहज और पर्याप्त रूप से औपचारिक रखता है।
- source_word: הַמְרִיקִים מֵעֲלֵיהֶם
  choice: अपने में से ... उँडेलती हैं
  rationale: पुंलिंग बहुवचन कृदंत निकटवर्ती स्त्रीलिंग צַנְתְּרוֹת के बजाय जैतून के फलदार भागों की ओर लौटता है। ‘अपने में से’ स्रोत का भाव और ‘उँडेलती हैं’ प्रवाह/खाली करने की क्रिया को बनाए रखते हैं, बिना यांत्रिकी को पूरी तरह समझाए।
- source_word: הַזָּהָב
  choice: सोना
  rationale: इब्रानी में सीधे ‘सोना’ है। दर्शन में आशय सुनहरा तेल होने की प्रबल सम्भावना है, फिर भी मुख्य पाठ मूल रूपक को अक्षुण्ण रखता है।
theological_decisions:
- issue: दीवट के दर्शन में ‘सोना’ किस वस्तु को दर्शाता है
  choice: मुख्य पाठ में शाब्दिक ‘सोना’ बनाए रखा गया
  alternative: ‘सुनहरा तेल’
  rationale: दर्शन की रूपकात्मक भाषा को व्याख्या से बदलना उचित नहीं। सम्भावित आशय पादटिप्पणी में दिया गया है, जिससे पाठ की वास्तविक अर्थगत तन्यता बनी रहती है।
- issue: उँडेलने वाले कर्ता की पहचान
  choice: व्याकरण के अनुसार जैतून की फलदार टहनियों को कर्ता माना गया
  alternative: सोने की नलियों को कर्ता मानना
  rationale: הַמְרִיקִים पुंलिंग बहुवचन है और שִׁבֲּלֵי भी पुंलिंग बहुवचन, जबकि צַנְתְּרוֹת स्त्रीलिंग बहुवचन है। इसलिए सम्बन्धवाचक उपवाक्य को टहनियों से जोड़ना व्याकरणतः अधिक सम्भावित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और दृश्यात्मक रूप अपनाया गया है। ‘फलदार टहनियाँ’, ‘नलियाँ’ और ‘उँडेलती हैं’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणियाँ दुर्लभ शब्दों और दर्शन की जानबूझकर बनी हुई अस्पष्टता को सुरक्षित रखती हैं।
