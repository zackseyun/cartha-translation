  text: Then the word of Yahweh came to me[a], saying,
translation:
  language: hi
  text: तब यहोवा का वचन मेरे पास आया:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; पारम्परिक रूप से इसका अनुवाद “प्रभु” किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... आया
  rationale: वाव-क्रमिक रूप यहाँ कथा या दर्शन में अगले घटनाक्रम को आरम्भ करता है। हिन्दी में “तब” क्रम को स्वाभाविक रूप से व्यक्त करता है, और आने की क्रिया को प्रचलित भविष्यद्वाणी-सूत्र “वचन ... आया” के साथ रखा गया है।
- source_word: דְבַר
  choice: वचन
  rationale: रचनात्मक संबंध דְבַר יְהוָה में यह किसी विशिष्ट ईश्वरीय संप्रेषण का प्रचलित भविष्यद्वाणी-सूत्र है। “संदेश” सम्भव है, पर “वचन” मूल अभिव्यक्ति की औपचारिक और आवर्ती प्रकृति को बेहतर बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय दिव्य नाम YHWH का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है।
- source_word: אֵלַי
  choice: मेरे पास
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय का अर्थ “मेरी ओर/मुझ तक” है। हिन्दी के प्रचलित भविष्यद्वाणी-सूत्र में “मेरे पास आया” स्वाभाविक है।
- source_word: לֵאמֹר
  choice: 'आया:'
  rationale: यह infinitive construct आगे आने वाली वाणी की विषयवस्तु का परिचय देता है। चूँकि अगली आयत में कथन आता है, आधुनिक हिन्दी में उद्धरणसूचक कोलन इसका स्वाभाविक कार्य करता है और कृत्रिम “यह कहते हुए” से बचाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए स्थापित रूप “यहोवा” नाम को नाम के रूप में सुरक्षित रखता है; पादटिप्पणी मूल रूप YHWH और पारम्परिक उपाधिमूलक अनुवाद स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। भविष्यद्वाणी के प्रचलित सूत्र “यहोवा का वचन मेरे पास आया” को बनाए रखा गया है। לֵאמֹר को अलग से “यह कहते हुए” न देकर कोलन से व्यक्त किया गया है, क्योंकि वचन की विषयवस्तु अगली आयत में आती है।
