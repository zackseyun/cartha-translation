  yaml_path: translation/ot/zechariah/011/015.yaml
  text: Then Yahweh said to me[a], “Take again for yourself the equipment of a foolish shepherd.”
translation:
  language: hi
  text: तब याहवे ने मुझसे कहा, “फिर अपने लिए एक मूर्ख चरवाहे का सामान[a] ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक मूर्ख चरवाहे के औज़ार/साज़-सामान।” इब्रानी शब्द व्यापक है और चरवाहे से जुड़ी वस्तुओं या उपकरणों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” घटनाक्रम का स्वाभाविक क्रम व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֵלָי
  choice: मुझसे
  rationale: कहने की क्रिया के साथ हिन्दी में “मुझसे कहा” स्वाभाविक रूप से इब्रानी ‘मेरी ओर/मुझसे’ का अर्थ देता है।
- source_word: עוֹד
  choice: फिर
  rationale: यहाँ यह शब्द एक और या दोहराई गई प्रतीकात्मक क्रिया का संकेत देता है; आदेश में “फिर” स्वाभाविक हिन्दी है।
- source_word: קַח לְךָ
  choice: अपने लिए ... ले
  rationale: आज्ञार्थक क्रिया के साथ לְךָ में निहित व्यक्तिगत सहभागिता को “अपने लिए” सुरक्षित रखता है।
- source_word: כְּלִי
  choice: सामान
  rationale: यह व्यापक शब्द किसी वस्तु, पात्र, औज़ार या उपकरण को सूचित कर सकता है। चरवाही के संदर्भ में सामूहिक अर्थ वाला “सामान” सहज और पर्याप्त रूप से व्यापक है।
- source_word: רֹעֶה
  choice: चरवाहे
  rationale: यह चराने वाले व्यक्ति के लिए सामान्य शब्द है और यहाँ सामान के स्वामी अथवा उससे जुड़े व्यक्ति को बताता है।
- source_word: אֱוִלִי
  choice: मूर्ख
  rationale: विशेषण बौद्धिक ही नहीं, नैतिक विवेकहीनता का भी बोध करा सकता है। “मूर्ख” इसका सीधा अनुवाद है; “निकम्मा” मूल अर्थ को अनावश्यक रूप से बदल देता।
theological_decisions:
- issue: प्रतीकात्मक चरवाहे की पहचान
  choice: वाक्यांश को केवल “एक मूर्ख चरवाहे” के रूप में वर्णनात्मक रखा गया है।
  alternative: इसे किसी विशेष ऐतिहासिक शासक, इस्राएल के भ्रष्ट अगुओं के सामूहिक चित्र, या भविष्यकालीन विरोधी चरवाहे के रूप में स्पष्ट करना।
  rationale: इस पद का इब्रानी पाठ प्रतीकात्मक पात्र की इससे अधिक निश्चित पहचान नहीं बताता। इसलिए अनुवाद किसी विवादित व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि ‘फिर,’ ‘अपने लिए,’ और चरवाहे के व्यापक ‘सामान’ जैसे मूल अर्थ-सूत्र सुरक्षित रखे गए हैं।
