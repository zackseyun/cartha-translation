  text: וָֽ/אֶגְדַּע֙ אֶת מַקְלִ֣/י הַ/שֵּׁנִ֔י אֵ֖ת הַ/חֹֽבְלִ֑ים לְ/הָפֵר֙ אֶת הָֽ/אַחֲוָ֔ה בֵּ֥ין יְהוּדָ֖ה וּ/בֵ֥ין יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/014.yaml
  text: Then I cut in pieces my second staff[a], Union, to break the brotherhood between Judah and Israel.
translation:
  language: hi
  text: तब मैंने अपनी दूसरी लाठी, जिसका नाम “बंधन”[a] था, काट डाली, ताकि यहूदा और इस्राएल के बीच के भाईचारे को तोड़ दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डोरियाँ” अथवा “बाँधने वाले”; दूसरी लाठी के इब्रानी नाम में एक साथ बँधी हुई वस्तुओं या बाँधने वालों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶגְדַּע
  choice: तब मैंने...काटकर तोड़ दी
  rationale: גדע में काट डालने या काटकर अलग करने का ठोस बिंब है। लाठी के प्रतीकात्मक कार्य में “काटकर तोड़ दी” उस भौतिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַקְלִי הַשֵּׁנִי
  choice: अपनी दूसरी लाठी
  rationale: מַקֵּל का अर्थ लाठी या डंडा है और הַשֵּׁנִי का सीधा अर्थ “दूसरी” है; यह पद 11:7 में उल्लिखित दो लाठियों के क्रम को बनाए रखता है।
- source_word: הַחֹבְלִים
  choice: बंधन
  rationale: यह दूसरी लाठी का प्रतीकात्मक नाम है। मूल शब्द बाँधने वाली डोरियों, बंधनों या बाँधने वालों का संकेत दे सकता है; “बंधन” यहूदा और इस्राएल को जोड़े रखने वाले संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהָפֵר
  choice: ताकि...टूट जाए
  rationale: הפר का अर्थ तोड़ना, भंग करना या निष्फल करना हो सकता है। यहाँ संबंधपरक संज्ञा के साथ अकर्मक हिन्दी रचना उद्देश्य और परिणाम को सहज रूप से प्रकट करती है।
- source_word: הָאַחֲוָה
  choice: भाईचारा
  rationale: אַחֲוָה भ्रातृ-संबंध और सामूहिक निकटता को दर्शाता है। “भाईचारा” पारिवारिक-राजनीतिक रूपक को सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: בֵּין יְהוּדָה וּבֵין יִשְׂרָאֵל
  choice: यहूदा और इस्राएल के बीच
  rationale: यह मूल वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है, जो दोनों ऐतिहासिक-राजनीतिक समुदायों के भेद को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: प्रतीकात्मक नाम הַחֹבְלִים का अनुवाद
  choice: बंधन
  alternative: डोरियाँ; बाँधने वाले
  rationale: संदर्भ में यह उस लाठी का नाम है जो यहूदा और इस्राएल के पारस्परिक जुड़ाव का प्रतीक है। “बंधन” प्रतीक का आशय स्पष्ट करता है, जबकि अधिक शाब्दिक संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: אַחֲוָה में भ्रातृ-रूपक
  choice: भाईचारा
  alternative: एकता; मेल-मिलाप
  rationale: इब्रानी शब्द में भाई के संबंध पर आधारित स्पष्ट पारिवारिक रूपक है। “भाईचारा” इसे सामान्य हिन्दी में बनाए रखता है और इसे केवल अमूर्त “एकता” में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लाठी के नाम को उद्धरण-चिह्नों में देकर उसके प्रतीकात्मक नाम होने को स्पष्ट किया गया है; मूल की शब्दार्थगत बहुविधता पादटिप्पणी में संरक्षित है।
