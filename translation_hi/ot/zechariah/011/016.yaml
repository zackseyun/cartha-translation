base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/016.yaml
  text: For behold[a], I am raising up a shepherd in the land who will not attend to the perishing, will not seek the straying, will not heal the broken, will not sustain the healthy[c][b], but will eat the flesh of the fat ones and tear off their hooves.
translation:
  language: hi
  text: क्योंकि देखो, मैं इस देश में एक चरवाहे को खड़ा करने वाला हूँ, जो न नष्ट होती हुई भेड़ों की सुधि लेगा[b], न भटकी हुई भेड़ को ढूँढ़ेगा[a], न घायल भेड़ को चंगा करेगा, और न खड़ी हुई भेड़ को सँभालेगा[c]; बल्कि वह मोटी भेड़ों का मांस खाएगा और उनके खुरों को चीर डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का सामान्य अर्थ ‘जवान’, ‘बालक’ या ‘कम उम्र की’ भी हो सकता है; यहाँ झुंड और ढूँढ़ने के प्रसंग में इसे ‘भटकी हुई’ समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘नष्ट होती हुई’ का अनुवाद ‘खोती हुई’, ‘लुप्त होती हुई’ या ‘विनाश की ओर जाती हुई’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक अर्थ ‘खड़ी हुई’ है; प्रसंग में सम्भवतः वह भेड़ अभिप्रेत है जो अब भी खड़ी है, अर्थात अपेक्षाकृत स्वस्थ या सक्षम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵקִים
  choice: खड़ा करने वाला हूँ
  rationale: हिफ़ील रूप का अर्थ ‘खड़ा करना/उत्पन्न करना’ है। यह परमेश्वर की सक्रिय भूमिका को बनाए रखता है, पर औपचारिक नियुक्ति का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: רֹעֶה
  choice: एक चरवाहा
  rationale: यह भेड़ों की देखभाल करने वाले के लिए सामान्य शब्द है और यहाँ नेतृत्व-संबंधी भविष्यवाणी का रूपक भी बनाए रखता है।
- source_word: הַנִּכְחָדוֹת
  choice: नष्ट होती हुई भेड़ें
  rationale: निष्क्रिय बहुवचन रूप लुप्त या नष्ट होती भेड़ों को सूचित करता है। यह अनुवाद ‘खोई हुई’ और ‘विनाश की ओर जाती हुई’ के बीच की व्यापकता बनाए रखता है।
- source_word: יִפְקֹד
  choice: सुधि लेना
  rationale: פקד का अर्थ प्रसंगानुसार ध्यान देना, देखने जाना या देखभाल करना हो सकता है। ‘सुधि लेना’ चरवाही के संदर्भ में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: הַנַּעַר
  choice: भटकती हुई
  rationale: נער सामान्यतः ‘युवा/बच्चा’ बताता है, किंतु झुंड और ‘ढूँढ़ने’ की समानांतर भाषा में इसे भटकी या असुरक्षित भेड़ के रूप में समझा जा सकता है। वास्तविक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְבַקֵּשׁ
  choice: ढूँढ़ना
  rationale: בקש के खोजने के अर्थ को चरवाही के प्रसंग में सहज हिन्दी में व्यक्त करता है।
- source_word: הַנִּשְׁבֶּרֶת
  choice: घायल हुई
  rationale: שבר का निष्क्रिय कृदंत शाब्दिक रूप से ‘टूटी हुई’ है; भेड़ के संदर्भ में ‘घायल हुई’ अधिक सहज है और शारीरिक क्षति का आशय बनाए रखता है।
- source_word: יְרַפֵּא
  choice: चंगा करना
  rationale: רפא का सीधा अर्थ चंगा करना है; इसमें मूल पाठ में निहित न होने वाली ‘पट्टी बाँधने’ की छवि नहीं जोड़ी गई।
- source_word: הַנִּצָּבָה
  choice: खड़ी रह सकने वाली
  rationale: निष्पन्न रूप का शाब्दिक अर्थ ‘खड़ी हुई’ है। ‘खड़ी रह सकने वाली’ हिन्दी में बोधगम्य रहते हुए उस शाब्दिक छवि और सम्भावित स्वस्थ/सक्षम अवस्था दोनों को बनाए रखता है।
- source_word: יְכַלְכֵּל
  choice: सँभालना
  rationale: כלכל में सहारा देने, पोषण करने और बनाए रखने का भाव है। ‘सँभालना’ इसे केवल खिलाने तक सीमित नहीं करता।
- source_word: הַבְּרִיאָה
  choice: मोटी भेड़ें
  rationale: בריא का अर्थ मोटा, हृष्ट-पुष्ट या भली-भाँति खिलाया हुआ हो सकता है। भक्षण की हिंसक छवि में ‘मोटी भेड़ें’ सबसे स्पष्ट है।
- source_word: פַרְסֵיהֶן
  choice: उनके खुर
  rationale: פרסה भेड़ के खुर को दर्शाता है; स्त्रीलिंग बहुवचन प्रत्यय का संकेत हिन्दी में ‘उनके’ से स्वाभाविक रूप में आता है।
- source_word: יְפָרֵק
  choice: चीर डालेगा
  rationale: פרק यहाँ अलग कर देने, फाड़ने या चीरने की हिंसक क्रिया बताता है। ‘चीर डालेगा’ क्रूर चरवाहे की छवि को स्पष्ट रखता है।
theological_decisions:
- issue: चरवाहे की पहचान
  choice: मुख्य पाठ में केवल ‘एक चरवाहा’
  alternative: दुष्ट चरवाहा, निकम्मा चरवाहा, अथवा किसी विशिष्ट ऐतिहासिक या अंतकालीन व्यक्ति की पहचान
  rationale: इस पद में चरवाहे का क्रूर आचरण वर्णित है, पर उसकी कोई विशिष्ट पहचान नहीं दी गई। अतः अनुवाद भविष्यवाणी की छवि और न्याय के तनाव को बिना व्याख्यात्मक पहचान थोपे बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और भविष्यवाणी-संगत शैली अपनाई गई है। ‘देखो’ ने הִנֵּה का ध्यानाकर्षक बल रखा है। भेड़ों का उल्लेख जहाँ हिन्दी में स्पष्टता के लिए आवश्यक था वहाँ जोड़ा गया है; चरवाहे की विशिष्ट पहचान नहीं थोपी गई। सभी पादटिप्पणी चिह्न मुख्य पाठ में उनके सम्बद्ध पदांश के तुरंत बाद रखे गए हैं।
