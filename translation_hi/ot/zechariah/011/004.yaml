  yaml_path: translation/ot/zechariah/011/004.yaml
  text: 'Thus says Yahweh my God: Shepherd the flock for slaughter[a].'
translation:
  language: hi
  text: 'याहवे, मेरे परमेश्वर, यों कहते हैं: “वध के लिए नियत झुंड[a] की चरवाही कर।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वध का झुंड”; अर्थात वह झुंड जिसका वध होना है।
    reason: मूल इब्रानी पदबंध की संक्षिप्त बनावट और उसके नियत वध के अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहते हैं
  rationale: यह नबूवत में परमेश्वर का संदेश प्रस्तुत करने वाला प्रचलित सूत्र है। हिन्दी में वर्तमानकालीन ‘यों कहते हैं’ उसकी सतत आधिकारिक घोषणा को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֱלֹהָי
  choice: मेरे परमेश्वर
  rationale: प्रथम पुरुष एकवचन प्रत्यय को स्पष्ट रूप से बनाए रखता है और नबी के अपने परमेश्वर से प्राप्त आदेश को व्यक्त करता है।
- source_word: רְעֵה
  choice: चरवाही कर
  rationale: द्वितीय पुरुष एकवचन पुल्लिंग आज्ञार्थक क्रिया है। ‘चरवाही कर’ पूरे अध्याय में चलने वाली चरवाहे की छवि को बनाए रखता है और केवल चारा खिलाने तक अर्थ को सीमित नहीं करता।
- source_word: צֹאן
  choice: झुंड
  rationale: यह छोटे पालतू पशुओं के समूह के लिए सामूहिक संज्ञा है। चरवाहे के प्रसंग में ‘झुंड’ स्वाभाविक हिन्दी है।
- source_word: הַהֲרֵגָה
  choice: वध के लिए नियत
  rationale: शाब्दिक संबंध ‘वध का झुंड’ है, जिसका आशय वध होने के लिए ठहराया गया झुंड है। मुख्य पाठ में ‘नियत’ इस संबंध को सहज हिन्दी में स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: אֱלֹהָי में वक्ता का संबंध
  choice: मेरे परमेश्वर
  alternative: परमेश्वर; तुम्हारे परमेश्वर
  rationale: इब्रानी प्रत्यय स्पष्ट रूप से प्रथम पुरुष एकवचन है; इसलिए नबी के कथन में ‘मेरे’ को बनाए रखा गया है।
- issue: הַהֲרֵגָה में नियति का भाव
  choice: वध के लिए नियत
  alternative: वध का; वध के लिए
  rationale: इब्रानी पदबंध संक्षिप्त और कुछ हद तक खुला है। मुख्य पाठ में उसका प्रसंगगत आशय सहज हिन्दी में दिया गया है, पर पादटिप्पणी शाब्दिक बनावट और अंतर्निहित अर्थ दोनों बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण नबूवती शैली अपनाई गई है। ‘चरवाही कर’ ग्रामीण-बाइबिलीय बिंब को बनाए रखते हुए सामान्य पाठक के लिए सहज है।
