reference: Zechariah 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וָ/אַכְחִ֛ד אֶת שְׁלֹ֥שֶׁת הָ/רֹעִ֖ים בְּ/יֶ֣רַח אֶחָ֑ד וַ/תִּקְצַ֤ר נַפְשִׁ/י֙ בָּ/הֶ֔ם וְ/גַם נַפְשָׁ֖/ם בָּחֲלָ֥ה בִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/008.yaml
  text: So I removed the three shepherds in one month[a], and my soul grew impatient with them[c][b], and their soul also loathed me.
translation:
  language: hi
  text: तब मैंने एक ही महीने में उन तीन चरवाहों[b] को हटा दिया[a]। मेरा मन उनसे अधीर हो उठा[c], और उनका मन भी मुझसे घृणा करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नष्ट कर दिया’ या ‘समाप्त कर दिया’; इब्रानी क्रिया का अर्थ उन्हें गायब कर देना या उनका अंत कर देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: पाठ इन ‘तीन चरवाहों’ की पहचान नहीं बताता; उनकी पहचान के बारे में अलग-अलग मत प्रस्तुत किए गए हैं।
    reason: alternative_reading
  - marker: c
    text: ‘मेरा मन…अधीर हो उठा’ एक इब्रानी मुहावरा है, जो धैर्य चुकने, गहरी झुंझलाहट या वितृष्णा का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַכְחִד
  choice: मैंने…हटा दिया
  rationale: हिफ़ील रूप यहाँ किसी को अदृश्य कर देने, हटा देने या नष्ट कर देने का भाव दे सकता है। ‘हटा दिया’ निर्णायक कार्रवाई को व्यक्त करता है, पर यह अनावश्यक रूप से तय नहीं करता कि चरवाहे मारे गए, पद से हटाए गए या किसी और तरह समाप्त कर दिए गए।
- source_word: שְׁלֹשֶׁת הָרֹעִים
  choice: उन तीन चरवाहों
  rationale: ‘चरवाहों’ का रूपक अध्याय के लिए केंद्रीय है; इसे ‘अगुवों’ जैसे व्याख्यात्मक शब्द से नहीं बदला गया। निश्चितता को हिन्दी में प्रसंगानुकूल ‘उन’ से व्यक्त किया गया है।
- source_word: בְּיֶרַח אֶחָד
  choice: एक ही महीने में
  rationale: यह एक महीने की सीमित अवधि और घटना की समयगत सघनता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַתִּקְצַר נַפְשִׁי בָּהֶם
  choice: मेरा मन उनसे अधीर हो उठा
  rationale: कצר נפש धैर्य चुकने, झुंझलाहट या गहरी अधीरता का मुहावरा है। ‘मेरा मन’ נַפְשִׁי का स्वाभाविक हिन्दी रूप है और अगले उपवाक्य के ‘उनका मन’ के साथ समानांतरता बनाए रखता है।
- source_word: וְגַם נַפְשָׁם בָּחֲלָה בִי
  choice: और उनका मन भी मुझसे घृणा करने लगा
  rationale: בחל तीव्र घृणा या वितृष्णा व्यक्त करता है। एकवचन ‘उनका मन’ इब्रानी के सामूहिक/मुहावरेदार एकवचन को रखते हुए हिन्दी में स्वाभाविक है और ‘मेरा मन’ के साथ पारस्परिक विरोध को उभारता है।
theological_decisions:
- issue: ‘तीन चरवाहों’ की पहचान
  choice: मुख्य पाठ में ‘तीन चरवाहों’ का रूपक बिना किसी पहचान के रखा गया है।
  alternative: इन्हें तीन ऐतिहासिक शासक, अगुवों के तीन वर्ग—जैसे भविष्यद्वक्ता, याजक और राजा—या भ्रष्ट नेतृत्व का प्रतीकात्मक अंक माना गया है।
  rationale: इब्रानी पाठ स्वयं इन चरवाहों की पहचान नहीं बताता। किसी विशेष पहचान को अनुवाद में जोड़ना पाठ की वास्तविक अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मेरा मन/उनका मन’ की समानांतर रचना मूल की पारस्परिकता बचाती है, जबकि ‘चरवाहों’ का रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित है।
