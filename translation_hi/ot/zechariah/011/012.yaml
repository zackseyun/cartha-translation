base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/012.yaml
  text: 'Then I said to them[a], “If it is good in your eyes, give me my wages; but if not, refrain.” So they weighed out my wages: thirty pieces of silver.'
translation:
  language: hi
  text: तब मैंने उनसे कहा, “यदि तुम्हारी दृष्टि में अच्छा हो, तो मेरी मजदूरी दे दो; और यदि नहीं, तो मत दो।” तब उन्होंने मेरी मजदूरी तौल दी—चाँदी के तीस सिक्के[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘तीस चाँदी’; सम्भवतः ‘चाँदी के तीस शेकेल।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: אִם טוֹב בְּעֵינֵיכֶם
  choice: यदि तुम्हारी दृष्टि में अच्छा हो
  rationale: यह इब्रानी मुहावरे की ‘आँखों में अच्छा’ वाली छवि को सम्मानजनक और बोधगम्य हिन्दी में बनाए रखता है।
- source_word: הָבוּ שְׂכָרִי
  choice: मेरी मजदूरी दे दो
  rationale: הבו का अर्थ ‘दो’ और שׂכרי का अर्थ सेवा के बदले मिलने वाली ‘मेरी मजदूरी’ है; यह चरवाहे के पारिश्रमिक के संदर्भ में स्वाभाविक है।
- source_word: וְאִם לֹא חֲדָלוּ
  choice: और यदि नहीं, तो रहने दो
  rationale: חדל का मूल भाव रुकना या किसी काम से विरत रहना है। यहाँ भुगतान न करने की अनुमति है; ‘रहने दो’ सामान्य आधुनिक हिन्दी में यही अर्थ देता है।
- source_word: וַיִּשְׁקְלוּ
  choice: तौल दिए
  rationale: क्रिया שקל चाँदी को तौलकर भुगतान करने की प्राचीन प्रथा दर्शाती है; ‘तौल दिए’ इस ठोस क्रिया को बनाए रखता है।
- source_word: שְׁלֹשִׁים כָּסֶף
  choice: चाँदी के तीस सिक्के
  rationale: इब्रानी में शाब्दिक रूप से ‘तीस चाँदी’ है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘सिक्के’ जोड़ा गया है, पर किसी निश्चित भार-इकाई को मुख्य पाठ में नहीं थोपा गया।
theological_decisions:
- issue: भुगतान की मौद्रिक इकाई
  choice: चाँदी के तीस सिक्के
  alternative: चाँदी के तीस शेकेल
  rationale: मूल इब्रानी में संख्या और चाँदी का उल्लेख है, पर ‘शेकेल’ शब्द स्पष्ट रूप से नहीं आया। इसलिए मुख्य पाठ कम विशिष्ट रहता है और संभावित इकाई को पादटिप्पणी में रखा गया है; इससे बाद के बाइबिलीय प्रतिध्वनि के आधार पर मूल को अधिक निश्चित नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘तुम्हारी दृष्टि में अच्छा’ मूल मुहावरे को बनाए रखता है, जबकि ‘रहने दो’ सामान्य पाठक के लिए स्वाभाविक है।
