  text: וָ/אֶקַּ֤ח אֶת מַקְלִ/י֙ אֶת נֹ֔עַם וָ/אֶגְדַּ֖ע אֹת֑/וֹ לְ/הָפֵיר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אֶת כָּל הָ/עַמִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/010.yaml
  text: Then I took my staff Favor and cut it in two[a], to break my covenant that I had made with all the peoples.
translation:
  language: hi
  text: तब मैंने अपनी लाठी, “कृपा,” ली और उसे दो टुकड़ों में काट दिया, ताकि अपनी उस वाचा को भंग करूँ जो मैंने सभी जातियों[a] के साथ बाँधी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभी राष्ट्रों।” इब्रानी शब्द जातियों अथवा राष्ट्रों, दोनों को सूचित कर सकता है; यहाँ उसका बहुवचन बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלִי
  choice: अपनी ... लाठी
  rationale: מַקֵּל चरवाहे की लाठी या डंडे को दर्शाता है। इस प्रतीकात्मक चरवाही प्रसंग में ‘लाठी’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: נֹעַם
  choice: “कृपा”
  rationale: यह लाठी का प्रतीकात्मक नाम है। נֹעַם में मनोहरता, प्रसन्नता और कृपापूर्ण सद्भाव के भाव हैं; ‘कृपा’ इस प्रसंग में नाम के रूप में संक्षिप्त और अर्थपूर्ण है, यद्यपि शब्द की पूरी अर्थ-परिधि इससे समाप्त नहीं होती।
- source_word: וָאֶגְדַּע אֹתוֹ
  choice: उसे दो टुकड़ों में काट दिया
  rationale: גדע का मूल भाव काट डालना या अलग कर देना है। लाठी को नष्ट करने की प्रतीकात्मक क्रिया को सहज हिन्दी में स्पष्ट करने के लिए यह अभिव्यक्ति चुनी गई है।
- source_word: לְהָפֵיר
  choice: तोड़ दूँ
  rationale: הפר वाचा के संदर्भ में उसे भंग, निष्फल या रद्द करने को दर्शाता है। ‘वाचा तोड़ना’ सीधी और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: בְּרִיתִי
  choice: अपनी वह वाचा
  rationale: בְּרִית के धार्मिक और संबंधपरक महत्व को बनाए रखने के लिए मानक हिन्दी शब्द ‘वाचा’ रखा गया है। ‘वह’ पहले से विद्यमान वाचा की ओर संकेत करता है।
- source_word: כָּרַתִּי
  choice: बाँधी थी
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर हिन्दी में स्वाभाविक मुहावरा ‘वाचा बाँधना’ है। ‘थी’ बताता है कि वाचा इस प्रतीकात्मक तोड़े जाने से पहले बाँधी गई थी।
- source_word: כָּל הָעַמִּים
  choice: सभी जातियों
  rationale: עַמִּים बहुवचन है और विभिन्न जनसमुदायों को सूचित कर सकता है। ‘सभी जातियों’ इसकी व्यापकता और बहुवचन दोनों बनाए रखता है; ‘सभी राष्ट्रों’ भी संभव है।
theological_decisions:
- issue: ‘सभी जातियों’ के साथ वाचा का दायरा
  choice: मूल पाठ की व्यापक अभिव्यक्ति ‘सभी जातियों’ को बिना संकुचित किए रखा गया है।
  alternative: इसे ‘सभी राष्ट्रों’, केवल इस्राएल, या आसपास की विरोधी जातियों के रूप में समझना।
  rationale: इब्रानी पाठ स्वयं इस पद में संदर्भ को किसी छोटे समूह तक सीमित नहीं करता। अनुवाद उस व्यापकता और व्याख्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लाठी के नाम को उद्धरण-चिह्नों और ‘नाम की’ से स्पष्ट किया गया है। पाद-टिप्पणी चिह्न को उसके वास्तविक शब्दगत संबंध, ‘जातियों’, के बाद रखा गया है।
