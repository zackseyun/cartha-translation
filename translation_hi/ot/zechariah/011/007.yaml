base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/007.yaml
  text: So I shepherded the flock doomed to slaughter, namely the afflicted of the flock. Then I took for myself two staffs; one I named Favor, and the other I named Union, and I shepherded the flock.
translation:
  language: hi
  text: तब मैंने वध के लिए ठहराए गए झुंड को चराया—अर्थात् झुंड के दीन जनों को।[a] तब मैंने अपने लिए दो लाठियाँ लीं; एक का नाम मैंने “कृपा” और दूसरी का नाम “बंधन” रखा।[b] और मैंने झुंड को चराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद का इब्रानी वाक्य-विन्यास कठिन है। यहाँ “अर्थात्” वध के लिए ठहराए गए झुंड और झुंड के दीन जनों को एक ही समूह के रूप में समझता है। वैकल्पिक रूप से לָכֵן को “इसलिए” या “इस कारण” समझकर इसके बाद के पदबंध से अलग संबंध जोड़ा जा सकता है।
    reason: לָכֵן और עֲנִיֵּי הַצֹּאן के वाक्य-संबंध की अस्पष्टता सुरक्षित रखना।
  - marker: b
    text: “बंधन” के लिए प्रयुक्त इब्रानी शब्द का अर्थ रस्सियाँ या बाँधने वाले बंधन भी हो सकता है; प्रसंग में यह परस्पर जुड़ाव या एकता का संकेत भी दे सकता है।
    reason: חֹבְלִים की ठोस छवि और संभावित प्रसंगगत अर्थ को बिना किसी एक व्याख्या को निश्चित किए दर्शाना।
lexical_decisions:
- source_word: צֹאן הַהֲרֵגָה
  choice: वध के लिए ठहराया गया झुंड
  rationale: शाब्दिक अर्थ ‘वध का झुंड’ है; हिन्दी में यह रूप स्वाभाविक ढंग से झुंड की आसन्न नियति व्यक्त करता है।
- source_word: עֲנִיֵּי הַצֹּאן
  choice: झुंड की दीन भेड़ें
  rationale: עֲנִיֵּי अभावग्रस्त, दबे-कुचले या पीड़ित लोगों का बोध करा सकता है; ‘दीन’ इस अर्थ-क्षेत्र को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מַקְלוֹת
  choice: लाठियाँ
  rationale: चरवाहे के हाथ में रहने वाली छड़ियों के लिए सामान्य और सहज हिन्दी शब्द।
- source_word: נֹעַם
  choice: कृपा
  rationale: यह शब्द मनोहरता, प्रसन्नता और अनुग्रह का बोध करा सकता है; अध्याय के वाचा-संबंधी प्रसंग में ‘कृपा’ उपयुक्त है।
- source_word: חֹבְלִים
  choice: बंधन
  rationale: मूल शब्द रस्सियों या बाँधने वाले बंधनों को सूचित करता है और प्रसंग में परस्पर जुड़ाव या एकता की ओर संकेत करता है; ‘बंधन’ दोनों आयाम बनाए रखता है।
theological_decisions:
- issue: लָכֵן और עֲנִיֵּי הַצֹּאן के बीच संबंध
  choice: ‘अर्थात्’ के द्वारा दीन भेड़ों को उसी वध-नियत झुंड के रूप में पहचानना
  alternative: ‘इसलिए/उनके लिए, झुंड के दीन लोगों’ के रूप में अलग वाक्य-संबंध
  rationale: व्यंजनात्मक पाठ कठिन है, पर निकटतम प्रसंग और परंपरागत समझ दीन भेड़ों को चराए गए झुंड की विशेष पहचान मानने का समर्थन करते हैं; पादटिप्पणी अन्य संभव संबंध सुरक्षित रखती है।
- issue: חֹבְלִים नाम का अर्थ
  choice: बंधन
  alternative: एकता
  rationale: ‘एकता’ जकर्याह 11:14 की व्याख्या को स्पष्ट कर देती है, जबकि ‘बंधन’ मूल शब्द की रस्सी/बाँधने वाली वस्तु की छवि और संबंधात्मक संकेत दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। चरवाही की छवि के लिए ‘झुंड’, ‘चराया’ और ‘लाठियाँ’ जैसे सामान्य शब्द चुने गए हैं; नाम उद्धरण-चिह्नों में रखे गए हैं।
