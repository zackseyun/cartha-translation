  text: אֲשֶׁ֨ר קֹנֵי/הֶ֤ן יַֽהֲרְגֻ/ן֙ וְ/לֹ֣א יֶאְשָׁ֔מוּ וּ/מֹכְרֵי/הֶ֣ן יֹאמַ֔ר בָּר֥וּךְ יְהוָ֖ה וַ/אעְשִׁ֑ר וְ/רֹ֣עֵי/הֶ֔ם לֹ֥א יַחְמ֖וֹל עֲלֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/005.yaml
  text: whose buyers slaughter them and are not held guilty[a], and whose sellers say, “Blessed be Yahweh[b], for I have become rich,” and their shepherds have no compassion on them.
translation:
  language: hi
  text: जिनके खरीदार उन्हें मार डालते हैं और दोषी नहीं ठहराए जाते[a], और जिनके बेचने वाले कहते हैं, “याहवे धन्य हो, क्योंकि मैं धनी हो गया हूँ,” और उनके चरवाहे उन पर दया नहीं करते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोषी नहीं होते।”
    reason: אשם का अर्थ दोषी होना अथवा दोषी ठहराया जाना हो सकता है।
  - marker: b
    text: या, “उन्हें नहीं बख्शते।”
    reason: חמל दया करने के साथ-साथ किसी को छोड़ देने या बख्श देने का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: אֲשֶׁר קֹנֵיהֶן
  choice: जिनके खरीदार
  rationale: सम्बन्धवाचक उपवाक्य को बनाए रखता है और קנה के व्यापारिक अर्थ को समानांतर ‘बेचनेवाले’ के साथ स्पष्ट करता है।
- source_word: יַהֲרְגֻן
  choice: उन्हें मार डालते हैं
  rationale: הרג का सीधा अर्थ ‘मारना’ है। यह भेड़ों के वध की कठोरता व्यक्त करता है, पर हिन्दी में अनावश्यक रूप से केवल धार्मिक या कसाईखाने के वध तक सीमित नहीं करता।
- source_word: וְלֹא יֶאְשָׁמוּ
  choice: और दोषी नहीं ठहरते
  rationale: אשם में दोषी होने या दोषी ठहराए जाने—दोनों की अर्थ-छाया हो सकती है। मुख्य पाठ उत्तरदायित्व के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וּמֹכְרֵיהֶן יֹאמַר
  choice: और जिनके बेचनेवाले कहते हैं
  rationale: बहुवचन कृदन्त ‘बेचनेवाले’ के साथ हिन्दी में बहुवचन क्रिया स्वाभाविक है। एकवचन उद्धरण ‘मैं’ प्रत्येक बेचनेवाले की अपनी बात को दर्शाता है।
- source_word: בָּרוּךְ יְהוָה
  choice: याहवे धन्य है
  rationale: इब्रानी आशीर्वाद-वाक्य का संक्षिप्त, गरिमापूर्ण रूप है और परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित करता है।
- source_word: וָאֶעְשִׁר
  choice: क्योंकि मैं धनी हो गया हूँ
  rationale: क्रिया के परिणामसूचक भाव—धनवान हो जाने—और विक्रेता के आत्मसंतुष्ट स्वर को व्यक्त करता है।
- source_word: וְרֹעֵיהֶם
  choice: और उनके चरवाहे
  rationale: मूल चरवाही रूपक को बनाए रखता है; ‘अगुए’ अर्थ खोल देता और ‘पादरी’ बाद की कलीसियाई पदावली जोड़ देता।
- source_word: לֹא יַחְמֹל עֲלֵיהֶן
  choice: उन पर दया नहीं करते
  rationale: חמל की करुणा/तरस की अर्थ-छाया को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘नहीं बख्शते’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से है; लिप्यंतरण उसे सामान्य उपाधि में नहीं बदलता।
- issue: רֹעִים का नेतृत्व-संबंधी रूपक
  choice: चरवाहे
  alternative: अगुए / पादरी
  rationale: मूल भविष्यद्वाणी का रूपक और उसकी जानबूझकर रखी गई व्यापकता सुरक्षित रहती है, बिना किसी बाद की कलीसियाई पदवी को आरोपित किए।
- issue: אשם में दोष और जवाबदेही का संबंध
  choice: दोषी नहीं ठहरते
  alternative: दोषी नहीं होते
  rationale: मुख्य पाठ बाहरी जवाबदेही के अभाव को उभारता है, जबकि पादटिप्पणी क्रिया के अंतर्निहित दोष-अर्जन वाले सम्भव अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य अपनाया गया है। व्यापार, वध और चरवाही—तीनों मूल बिंब बनाए गए हैं। वाक्य पूर्ववर्ती सन्दर्भ से जुड़ा सम्बन्धवाचक उपवाक्य है, इसलिए आरम्भ ‘जिनके’ से किया गया है।
