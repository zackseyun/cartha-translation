  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י הַשְׁלִיכֵ֨/הוּ֙ אֶל הַ/יּוֹצֵ֔ר אֶ֣דֶר הַ/יְקָ֔ר אֲשֶׁ֥ר יָקַ֖רְתִּי מֵֽ/עֲלֵי/הֶ֑ם וָֽ/אֶקְחָ/ה֙ שְׁלֹשִׁ֣ים הַ/כֶּ֔סֶף וָ/אַשְׁלִ֥יךְ אֹת֛/וֹ בֵּ֥ית יְהוָ֖ה אֶל הַ/יּוֹצֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/013.yaml
  text: Then Yahweh said to me[a], “Throw it to the potter—the magnificent price at which I was valued by them.” So I took the thirty pieces of silver and threw it into the house of Yahweh[b], to the potter.
translation:
  language: hi
  text: तब यहोवा ने मुझसे कहा[a], “इसे कुम्हार के पास फेंक दे—वह शानदार कीमत[b] जिस पर उन्होंने मुझे आँका था।” तब मैंने चाँदी के वे तीस सिक्के लिए और उन्हें यहोवा के भवन में, कुम्हार के पास फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में दोनों स्थानों पर “कुम्हार” है। कठिन प्रसंग के कारण कुछ व्याख्याकारों ने “भंडार” का प्रस्ताव किया है, पर मसोरेटिक पाठ “कुम्हार” ही पढ़ता है।
    reason: alternative_reading
  - marker: b
    text: “शानदार कीमत” सम्भवतः व्यंग्यात्मक है; यह चाँदी के केवल तीस सिक्कों के अपमानजनक मूल्यांकन का उपहास करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी विशिष्ट नाम को आधुनिक हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הַשְׁלִיכֵהוּ
  choice: इसे ... फेंक दे
  rationale: आज्ञार्थक क्रिया और पुल्लिंग एकवचन प्रत्यय को प्रसंग में पहले उल्लिखित मूल्य/धन की ओर संकेत मानकर स्वाभाविक हिन्दी में रखा गया है।
- source_word: הַיּוֹצֵר
  choice: कुम्हार
  rationale: मसोरेटिक पाठ में दोनों स्थानों पर יצר से बना सामान्य संज्ञा-रूप ‘कुम्हार’ है; कठिन प्रसंग के बावजूद अनुमानित ‘भंडार’ को मुख्य पाठ में नहीं अपनाया गया।
- source_word: אֶדֶר הַיְקָר
  choice: वह शानदार कीमत
  rationale: यह कठिन, सम्भवतः व्यंग्यात्मक पदबंध वैभव और मूल्य का ऊँचा स्वर रखता है; ‘शानदार’ हिन्दी में उस तीखे व्यंग्य को सुनाई देने देता है।
- source_word: יָקַרְתִּי מֵעֲלֵיהֶם
  choice: जो उन्होंने मेरी आँकी थी
  rationale: वाक्य में वक्ता उनके द्वारा मूल्यांकित है। सक्रिय हिन्दी रचना अर्थ को साफ रखती है और ‘मेरी कीमत आँकना’ स्वाभाविक मुहावरा है।
- source_word: שְׁלֹשִׁים הַכֶּסֶף
  choice: चाँदी के वे तीस सिक्के
  rationale: शाब्दिक रूप ‘चाँदी के तीस’ है। ‘सिक्के’ अर्थ स्पष्ट करता है, पर ‘शेकेल’ जोड़कर मूल से अधिक विशिष्ट नहीं बनाता।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ इब्रानी ‘घर’ की औपचारिक छवि बनाए रखता है और प्रसंग में उपासना-स्थल के रूप में बोधगम्य है।
- source_word: אֶל הַיּוֹצֵר
  choice: कुम्हार के पास
  rationale: अन्तिम पद में मसोरेटिक पाठ की पुनरावृत्ति सुरक्षित रखी गई है; हिन्दी ‘के पास’ गन्तव्य को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: कठिन मूल्यांकन-पदबंध और दो बार आए ‘कुम्हार’ का अनुवाद
  choice: मसोरेटिक पाठ के ‘कुम्हार’ को दोनों बार बनाए रखना और ‘शानदार कीमत’ द्वारा सम्भावित व्यंग्य प्रकट करना
  alternative: ‘कुम्हार’ को पाठ-संशोधन द्वारा ‘भंडार’ करना, अथवा मूल्यांकन-पदबंध को सपाट ‘अच्छी कीमत’ कहना
  rationale: उपलब्ध इब्रानी पाठ ‘कुम्हार’ पढ़ता है। अनुमानित संशोधन से कठिनाई मिटाने के बजाय पाठ की असहजता और वक्ता को दी गई अपमानजनक कम कीमत पर व्यंग्य, दोनों को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। ‘फेंक दे’ आज्ञा की तीक्ष्णता बनाए रखता है। ‘कुम्हार’ की कठिन पुनरावृत्ति जानबूझकर सुरक्षित है; उसे व्याख्यात्मक रूप से सरल नहीं किया गया।
