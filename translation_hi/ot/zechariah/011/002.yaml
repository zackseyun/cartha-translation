source:
  edition: WLC
  text: הֵילֵ֤ל בְּרוֹשׁ֙ כִּֽי נָ֣פַל אֶ֔רֶז אֲשֶׁ֥ר אַדִּרִ֖ים שֻׁדָּ֑דוּ הֵילִ֨ילוּ֙ אַלּוֹנֵ֣י בָשָׁ֔ן כִּ֥י יָרַ֖ד יַ֥עַר ה/בצור־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/002.yaml
  text: Wail[a], cypress, for the cedar has fallen, for the majestic ones have been destroyed. Wail, oaks of Bashan[c][b], for the thick forest has come down.
translation:
  language: hi
  text: 'हे सरू[a], विलाप कर,

    क्योंकि देवदार गिर पड़ा है;

    क्योंकि प्रतापी वृक्ष उजाड़ दिए गए हैं[b]।


    हे बाशान के बाँज वृक्षो, विलाप करो,

    क्योंकि घना वन गिर गया है[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सनोवर।”
    reason: lexical_alternative
  - marker: b
    text: या, “शक्तिशाली वृक्ष नष्ट कर दिए गए हैं।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पद का अर्थ “दुर्गम वन” या “किलेबंद वन” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵילֵל / הֵילִילוּ
  choice: विलाप कर / विलाप करो
  rationale: ये ילל के आज्ञार्थक रूप हैं और शोक या संकट की ऊँची पुकार व्यक्त करते हैं। ‘विलाप’ आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और भविष्यद्वाणी के शोकपूर्ण स्वर के अनुकूल है।
- source_word: בְּרוֹשׁ
  choice: सरू का वृक्ष
  rationale: यह किसी शंकुधारी वृक्ष का नाम है, जिसे प्रायः सरू या सनोवर समझा जाता है। मुख्य पाठ में ‘सरू’ स्पष्ट और वृक्ष-संबंधी समानांतरता के अनुकूल है; प्रजाति की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों स्थानों पर यह विलाप का कारण बताता है। ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָפַל
  choice: गिर पड़ा है
  rationale: मूल क्रिया का सीधा अर्थ गिरना है। ‘काट डाला गया’ कहने से निहित कारण को अनावश्यक रूप से स्पष्ट किया जाता, इसलिए मूल चित्र को बनाए रखा गया है।
- source_word: אֶרֶז
  choice: देवदार
  rationale: अֶרֶז के लिए प्रचलित हिन्दी पर्याय है और भविष्यद्वाणी के काव्य में वैभव तथा सामर्थ्य के वृक्ष-चित्र को बनाए रखता है।
- source_word: אַדִּרִים
  choice: प्रतापी वृक्ष
  rationale: शब्द का अर्थ प्रतापी, भव्य या सामर्थी है। निकटवर्ती वृक्ष-चित्र के कारण हिन्दी में निहित संज्ञा ‘वृक्ष’ स्पष्ट की गई है, पर इसे मानवीय शासकों में नहीं बदला गया।
- source_word: שֻׁדָּדוּ
  choice: उजाड़ दिए गए हैं
  rationale: निष्क्रिय क्रिया हिंसक विनाश या बरबादी व्यक्त करती है। ‘उजाड़ दिए गए’ वन और न्याय—दोनों संदर्भों में स्वाभाविक है और लूट का अत्यधिक संकीर्ण अर्थ नहीं थोपता।
- source_word: אַלּוֹנֵי בָשָׁן
  choice: बाशान के बाँज वृक्ष
  rationale: यह बाशान के प्रसिद्ध दृढ़ वृक्षों का पारंपरिक संकेत है। ‘बाँज’ आधुनिक हिन्दी में oak का समझने योग्य वृक्ष-नाम है।
- source_word: יָרַד
  choice: धराशायी हो गया है
  rationale: शाब्दिक अर्थ नीचे उतरना या नीचे आना है। वन के संदर्भ में ‘धराशायी हो गया’ उसके गिराए जाने या ढहने का स्वाभाविक हिन्दी चित्र देता है, बिना कर्ता बताए।
- source_word: יַעַר ה/בצור
  choice: घना वन
  rationale: अंतिम इब्रानी पद कठिन है और घने, दुर्गम अथवा किलेबंद वन का बोध करा सकता है। ‘घना वन’ प्रसंग में स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: क्या वृक्षों के चित्र को मुख्य पाठ में मानवीय शासकों या शक्तियों के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में वृक्षों का रूपक बनाए रखा गया है
  alternative: ‘शासक,’ ‘कुलीन’ या ‘सामर्थी लोग’ कहकर अर्थ को व्याख्यात्मक रूप से स्पष्ट करना
  rationale: यह चित्र नेताओं या शक्तिशाली समूहों की ओर संकेत कर सकता है, पर इब्रानी पाठ सीधे वृक्षों की भाषा बोलता है। अनुवाद उस रूपक और उसकी व्याख्यात्मक खुलावट को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज भविष्यद्वाणी-शैली रखी गई है। एकवचन वृक्ष के लिए ‘विलाप कर’ और बहुवचन वृक्षों के लिए ‘विलाप करो’ द्वारा इब्रानी वचन-भेद सुरक्षित है। ‘हे’ संबोधन और पंक्ति-विन्यास शोकगीत की लय बनाए रखते हैं।
