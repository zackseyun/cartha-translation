source:
  edition: WLC
  text: ה֣וֹי רֹעִ֤י הָֽ/אֱלִיל֙ עֹזְבִ֣י הַ/צֹּ֔אן חֶ֥רֶב עַל זְרוֹע֖/וֹ וְ/עַל עֵ֣ין יְמִינ֑/וֹ זְרֹע/וֹ֙ יָב֣וֹשׁ תִּיבָ֔שׁ וְ/עֵ֥ין יְמִינ֖/וֹ כָּהֹ֥ה תִכְהֶֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/017.yaml
  text: Woe to the worthless shepherd[a], who abandons the flock! A sword is against his arm and against his right eye. His arm will completely wither, and his right eye will be utterly dimmed.
translation:
  language: hi
  text: उस निकम्मे चरवाहे[a] पर हाय, जो झुंड को छोड़ देता है! उसकी बाँह और उसकी दाहिनी आँख पर तलवार! उसकी बाँह पूरी तरह सूख जाएगी, और उसकी दाहिनी आँख बिलकुल धुँधली हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्तिसदृश चरवाहे।” इब्रानी शब्द का अर्थ “निकम्मा/व्यर्थ” अथवा “मूर्तिसदृश/खोखला” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: हाय ... पर
  rationale: यह भविष्यद्वाणी में शोक और दंड-घोषणा का उद्गार है; आधुनिक हिन्दी में ‘हाय ... पर’ उसके न्यायसूचक स्वर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹעִי הָאֱלִיל
  choice: निकम्मे चरवाहे
  rationale: אֱלִיל यहाँ व्यर्थ, निष्प्रयोज्य या मूर्तिसदृश खोखलेपन का बोध करा सकता है। झुंड को छोड़ने वाले अगुवे के संदर्भ में ‘निकम्मा’ उसकी नैतिक और कार्यगत विफलता को स्पष्ट करता है; वैकल्पिक मूर्ति-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: עֹזְבִי הַצֹּאן
  choice: जो झुंड को छोड़ देता है
  rationale: कृदंत चरवाहे के लाक्षणिक आचरण को दर्शाता है। यह हिन्दी पदबंध उस परित्याग को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: חֶרֶב עַל זְרוֹעוֹ וְעַל עֵין יְמִינוֹ
  choice: तलवार उसकी बाँह पर और उसकी दाहिनी आँख पर चले
  rationale: इब्रानी वाक्य क्रियारहित न्याय-घोषणा है। हिन्दी में ‘चले’ उसके अभिशापात्मक/न्यायसूचक बल को व्यक्त करता है, पर वार के परिणाम को आवश्यकता से अधिक निश्चित नहीं करता। ‘बाँह’ और ‘दाहिनी आँख’ मूल बिंब बनाए रखते हैं।
- source_word: זְרֹעוֹ יָבוֹשׁ תִּיבָשׁ
  choice: उसकी बाँह पूरी तरह सूख जाएगी
  rationale: धातु के अनंत रूप और सीमित क्रिया का संयोजन तीव्रता और निश्चितता देता है; ‘पूरी तरह’ उस बल को सहज हिन्दी में पहुँचाता है।
- source_word: וְעֵין יְמִינוֹ כָּהֹה תִכְהֶה
  choice: उसकी दाहिनी आँख बिलकुल धुँधली हो जाएगी
  rationale: दोहराया गया क्रियात्मक विन्यास तीव्रता दर्शाता है। כהה का अर्थ दृष्टि या चमक का मंद पड़ना है; ‘धुँधली’ मूल की अस्पष्टता बनाए रखती है और इसे अनिवार्यतः पूर्ण अंधापन नहीं बनाती।
theological_decisions:
- issue: אֱלִיל को चरवाहे/अगुवे के रूपक में व्यक्त करना
  choice: निकम्मा चरवाहा
  alternative: मूर्ति-सरीखा चरवाहा
  rationale: शब्द में व्यर्थता और मूर्तिसदृश खोखलेपन दोनों की छाया हो सकती है। निकट संदर्भ में झुंड को छोड़ देने से उसकी विफलता प्रमुख है, इसलिए मुख्य पाठ में ‘निकम्मा’ स्पष्ट और स्वाभाविक है; दूसरा वास्तविक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: तलवार वाले क्रियारहित वाक्य का भाव
  choice: तलवार ... चले
  alternative: तलवार ... पर है
  rationale: संदर्भ दंड की भविष्यद्वाणी है। हिन्दी में केवल ‘पर है’ अस्वाभाविक और अस्पष्ट होता; ‘चले’ न्यायसूचक भाव को व्यक्त करता है, जबकि इसे किसी विशिष्ट ऐतिहासिक घटना या व्यक्ति से नहीं बाँधता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘चरवाहा’, ‘झुंड’, ‘बाँह’ और ‘दाहिनी आँख’ जैसे मूल बिंब बनाए गए हैं। तीव्रता व्यक्त करने के लिए ‘पूरी तरह’ और ‘बिलकुल’ प्रयुक्त हैं; आँख के विषय में ‘अंधी’ न कहकर ‘धुँधली’ रखा गया है ताकि मूल अर्थ से अधिक निष्कर्ष न निकले।
