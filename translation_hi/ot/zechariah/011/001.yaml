base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/001.yaml
  text: Open your doors[a], Lebanon, so that fire may consume your cedars.
translation:
  language: hi
  text: हे लबानोन, अपने द्वार खोल दे[a], और आग तेरे देवदारों को भस्म कर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे लबानोन, अपने फाटक खोल दे, और आग तेरे देवदारों को भस्म कर देगी।”
    reason: ‘द्वार’ के लिए ‘फाटक’ सम्भव वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: פְּתַח
  choice: खोल दे
  rationale: यह פתח का पुल्लिंग एकवचन आज्ञार्थक रूप है। ‘खोल दे’ सीधे आदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְבָנוֹן
  choice: लबानोन
  rationale: यह स्थानवाचक नाम है और यहाँ मानवीकृत सम्बोधन के रूप में आया है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: דְּלָתֶיךָ
  choice: अपने द्वार
  rationale: דֶּלֶת का मूल अर्थ ‘दरवाज़ा’ या ‘द्वार-पल्ला’ है। बहुवचन और सम्बोधित लबानोन के साथ सम्बन्ध को हिन्दी के स्वाभाविक ‘अपने द्वार’ से व्यक्त किया गया है; ‘फाटक’ सम्भव वैकल्पिक अर्थ है।
- source_word: וְתֹאכַל
  choice: ताकि ... भस्म कर दे
  rationale: आज्ञार्थक क्रिया के बाद आया अपूर्ण रूप प्रयोजन या परिणाम व्यक्त कर सकता है। आग के सन्दर्भ में ‘भस्म कर दे’ हिन्दी में אכל (‘खा जाना/भस्म करना’) के विनाशकारी भाव को स्वाभाविक रूप से व्यक्त करता है। ‘और ... भस्म कर देगी’ भी सम्भव है।
- source_word: אֵשׁ
  choice: आग
  rationale: मूल शब्द का सामान्य और सीधा अर्थ ‘आग’ है।
- source_word: בַּאֲרָזֶיךָ
  choice: तेरे देवदारों को
  rationale: אֶרֶז का अर्थ ‘देवदार’ है। בְּ यहाँ आग की विनाशकारी क्रिया के लक्ष्य या क्षेत्र को सूचित करता है; सहज हिन्दी में इसे कर्म ‘तेरे देवदारों को’ के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: मानवीकरण और भविष्यद्वाणी का बिम्ब
  choice: लबानोन को मानवीकृत प्रदेश/वन-क्षेत्र के रूप में सीधे सम्बोधित किया गया है, जिसके ‘द्वार’ विनाशकारी आग के लिए खोले जाते हैं।
  alternative: इसे लबानोन के पहाड़ी मार्गों अथवा वन-प्रवेशों का शाब्दिक उल्लेख, या लबानोन से जुड़े राजनीतिक शासकों का प्रतीक माना जा सकता है।
  rationale: पद काव्यात्मक और भविष्यद्वाणीपरक है। अनुवाद बड़े प्रतीकात्मक संकेत को किसी एक अर्थ तक सीमित किए बिना मूल बिम्ब और उसकी व्याख्यात्मक खुलावट बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘हे’ प्रत्यक्ष सम्बोधन को स्पष्ट करता है; ‘लबानोन’ के लिए एकवचन आत्मवाचक ‘अपने’ और आगे ‘तेरे’ मूल पाठ के मानवीकरण तथा एकवचन सम्बोधन को बनाए रखते हैं।
