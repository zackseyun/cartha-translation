source:
  edition: WLC
  text: כִּ֠י לֹ֣א אֶחְמ֥וֹל ע֛וֹד עַל יֹשְׁבֵ֥י הָ/אָ֖רֶץ נְאֻם יְהוָ֑ה וְ/הִנֵּ֨ה אָנֹכִ֜י מַמְצִ֣יא אֶת הָ/אָדָ֗ם אִ֤ישׁ בְּ/יַד רֵעֵ֨/הוּ֙ וּ/בְ/יַ֣ד מַלְכּ֔/וֹ וְ/כִתְּתוּ֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א אַצִּ֖יל מִ/יָּדָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/006.yaml
  text: For I will no longer have compassion on the inhabitants of the land[a], declares Yahweh. Behold, I am handing over the people, each into the hand of his neighbor and into the hand of his king, and they will crush the land[c][b], and I will not deliver it from their hand.
translation:
  language: hi
  text: क्योंकि अब मैं देश के निवासियों पर दया नहीं करूँगा[a]—याहवे की यह घोषणा है। देखो, मैं हर व्यक्ति को उसके पड़ोसी के हाथ में और उसके राजा के हाथ में सौंप रहा हूँ[b]। वे देश को कुचल डालेंगे, और मैं उसे उनके हाथ से नहीं छुड़ाऊँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के निवासियों पर”; הָאָרֶץ का अर्थ प्रसंग के अनुसार “देश” या “पृथ्वी” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “मनुष्य को, हर एक को उसके पड़ोसी के हाथ में और उसके राजा के हाथ में”; “हाथ में” यहाँ किसी की सत्ता या वश में होने का अर्थ देता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में “छुड़ाऊँगा” का कर्म स्पष्ट नहीं है। इसका संकेत देश की ओर, अथवा लोगों की ओर भी समझा जा सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: אֶחְמֹל
  choice: दया नहीं करूँगा
  rationale: חמל में दया दिखाने और विनाश से बचाने, दोनों का भाव हो सकता है। यहाँ ‘दया करना’ न्याय के संदर्भ में इसके करुणात्मक पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: इस देश के निवासी
  rationale: יֹשְׁבֵי का अर्थ निवासी है। निकटवर्ती संदर्भ में הָאָרֶץ किसी विशिष्ट देश या भूभाग को सूचित करता है; ‘इस’ से प्रसंग में उल्लिखित क्षेत्र स्पष्ट होता है, बिना उसे पूरी पृथ्वी तक विस्तृत किए।
- source_word: נְאֻם יְהוָה
  choice: यह याहवे की घोषणा है
  rationale: נְאֻם मानक नबूवत-सूचक घोषणा-सूत्र है। याहवे, יהוה के व्यक्तिगत वाचा-नाम का लिप्यंतरण है।
- source_word: מַמְצִיא
  choice: सौंप रहा हूँ
  rationale: מצא का हिफ़ील रूप यहाँ किसी को दूसरे की सत्ता या वश में कर देने का अर्थ देता है। ‘सौंप रहा हूँ’ इस कारक और न्यायात्मक भाव को स्पष्ट तथा सहज रखता है।
- source_word: הָאָדָם אִישׁ
  choice: लोगों में से हर एक को
  rationale: הָאָדָם यहाँ मनुष्यों या लोगों को सामूहिक रूप से और אִישׁ प्रत्येक व्यक्ति को वितरणात्मक रूप से प्रस्तुत करता है। यह अनुवाद दोनों पहलुओं को बनाए रखता है।
- source_word: בְיַד רֵעֵהוּ וּבְיַד מַלְכּוֹ
  choice: उसके पड़ोसी के हाथ में और उसके राजा के हाथ में
  rationale: ‘हाथ में’ सत्ता या नियंत्रण का हिब्रू मुहावरा है और हिन्दी में भी समझने योग्य है। רֵעַ के लिए ‘पड़ोसी’ सामाजिक विघटन के प्रसंग में ‘मित्र’ से अधिक तटस्थ और व्यापक है।
- source_word: וְכִתְּתוּ אֶת הָאָרֶץ
  choice: वे इस देश को कुचल डालेंगे
  rationale: כתת कुचलने, तोड़ डालने या चूर करने की हिंसक क्रिया है। ‘कुचल डालेंगे’ देश पर आने वाले विनाश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא אַצִּיל מִיָּדָם
  choice: मैं उसे उनके हाथ से नहीं छुड़ाऊँगा
  rationale: נצל हिफ़ील का अर्थ छुड़ाना या बचाना है। हिन्दी वाक्य की स्पष्टता के लिए ‘उसे’ जोड़ा गया है, जबकि टिप्पणी में मूल पाठ में कर्म के अनकहे रहने की सूचना दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम יהוה सीधे प्रयुक्त है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: इस देश
  alternative: पृथ्वी
  rationale: तत्काल प्रसंग किसी विशिष्ट जनसमुदाय और भूभाग पर न्याय की ओर संकेत करता है, फिर भी हिब्रू शब्द व्यापक अर्थ में ‘पृथ्वी’ भी हो सकता है; इसलिए वैकल्पिक संभावना पादटिप्पणी में रखी गई है।
- issue: הָאָדָם אִישׁ की सामूहिक और वितरणात्मक शक्ति
  choice: लोगों में से हर एक
  alternative: हर मनुष्य; प्रत्येक पुरुष
  rationale: यह रूप הָאָדָם के सामूहिक संकेत और אִישׁ के ‘एक-एक’ वितरणात्मक बल, दोनों को दर्शाता है, बिना अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित किए।
- issue: अंतिम उपवाक्य में अनुक्त कर्म
  choice: मुख्य पाठ में ‘उसे’ से देश का संकेत
  alternative: उन्हें; कर्म को अनकहा छोड़ना
  rationale: पिछले उपवाक्य में ‘देश’ स्पष्ट कर्म है, इसलिए हिन्दी में ‘उसे’ सहज संदर्भ देता है। फिर भी हिब्रू में कर्म व्यक्त नहीं है, अतः लोगों की ओर संकेत भी व्याकरणतः संभव है और इसे पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। नबूवत की गंभीरता बनाए रखने के लिए ‘घोषणा’, ‘सौंप रहा हूँ’ और ‘कुचल डालेंगे’ जैसे स्पष्ट शब्द चुने गए हैं। हिब्रू के ‘हाथ’ वाले सत्ता-मुहावरे को हिन्दी में संरक्षित किया गया है।
