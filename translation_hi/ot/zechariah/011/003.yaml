source:
  edition: WLC
  text: ק֚וֹל יִֽלְלַ֣ת הָ/רֹעִ֔ים כִּ֥י שֻׁדְּדָ֖ה אַדַּרְתָּ֑/ם ק֚וֹל שַׁאֲגַ֣ת כְּפִירִ֔ים כִּ֥י שֻׁדַּ֖ד גְּא֥וֹן הַ/יַּרְדֵּֽן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/003.yaml
  text: The sound of the shepherds’ wailing[a], for their splendor is ruined; the sound of the young lions’ roaring[b], for the majesty of the Jordan is ruined.
translation:
  language: hi
  text: चरवाहों के विलाप की आवाज़—क्योंकि उनका वैभव[a] नष्ट हो गया है; जवान सिंहों की दहाड़ की आवाज़—क्योंकि यरदन का गौरव[b] नष्ट हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका भव्य आवरण।” इब्रानी शब्द भव्यता या वैभव को व्यक्त कर सकता है और संभवतः उस वस्तु की ओर भी संकेत करता है जो उन्हें शोभित करती थी।
    reason: lexical_alternative
  - marker: b
    text: या, “यरदन का अभिमान”; यह पदबंध विशेष रूप से यरदन के तटों के घने, हरे-भरे झाड़-झंखाड़ की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וֹל
  choice: की आवाज़ सुनाई दे रही है
  rationale: קוֹל यहाँ दोनों समानांतर पंक्तियों में सुनाई देने वाले विलाप और दहाड़ को सामने लाता है। यह हिंदी में स्वाभाविक रहते हुए श्रव्य बल को सुरक्षित रखता है।
- source_word: יִלְלַ֣ת
  choice: विलाप
  rationale: ילל से बना यह शब्द शोकपूर्ण पुकार या रोने को व्यक्त करता है; मानव चरवाहों के लिए ‘विलाप’ गरिमापूर्ण और स्वाभाविक है।
- source_word: הָרֹעִ֔ים
  choice: चरवाहों
  rationale: मूल अर्थ ‘चरवाहे’ है। संभावित रूपकात्मक अर्थ को स्पष्ट करके ‘अगुवे’ नहीं बनाया गया, ताकि मूल बिंब बना रहे।
- source_word: שֻׁדְּדָ֖ה / שֻׁדַּ֖ד
  choice: उजड़ गया है
  rationale: שׁדד उजाड़ने, नष्ट करने या लूट लेने का भाव रखता है। अमूर्त संज्ञाओं ‘वैभव’ और ‘गौरव’ के साथ ‘उजड़ गया’ हिंदी में काव्यात्मक और प्रबल है तथा दोनों पंक्तियों की समानता बनाए रखता है।
- source_word: אַדַּרְתָּ֑ם
  choice: उनका वैभव
  rationale: אַדֶּרֶת भव्यता, शोभा या शानदार आवरण का संकेत दे सकता है। ‘वैभव’ मुख्य अमूर्त अर्थ को व्यक्त करता है, जबकि ठोस ‘भव्य वस्त्र/ओढ़ना’ की संभावना पादटिप्पणी में रखी गई है।
- source_word: שַׁאֲגַ֣ת
  choice: दहाड़ने
  rationale: यह सिंह की दहाड़ को सूचित करता है। ‘दहाड़ने की आवाज़’ पहली पंक्ति के ‘विलाप की आवाज़’ के समानांतर स्वाभाविक है।
- source_word: כְּפִירִ֔ים
  choice: जवान सिंहों
  rationale: כפיר ऐसा युवा सिंह है जो केवल छोटा शावक नहीं, बल्कि बलवान युवा सिंह हो सकता है; इसलिए ‘जवान सिंह’ उपयुक्त है।
- source_word: גְּא֥וֹן הַיַּרְדֵּֽן
  choice: यरदन का गौरव
  rationale: גאון गौरव, महिमा, भव्यता या अभिमान व्यक्त कर सकता है। ‘गौरव’ नकारात्मक नैतिक अर्थ थोपे बिना ऊँचे काव्यात्मक भाव को बनाए रखता है; यरदन-तट की घनी वनस्पति की संभावित ठोस ओर पादटिप्पणी में दी गई है।
theological_decisions:
- issue: चरवाहों और जवान सिंहों के रूपकात्मक संकेतों को स्पष्ट करना
  choice: मुख्य पाठ में मूल बिंबों को यथावत रखना
  alternative: चरवाहों को अगुवे और जवान सिंहों को शासक या अत्याचारी कहना
  rationale: इब्रानी पाठ रूपक के संदर्भित व्यक्तियों की स्पष्ट पहचान नहीं करता। इसलिए अनुवाद पाठक के लिए इस तनाव को पहले से हल नहीं करता।
- issue: גְּאוֹן הַיַּרְדֵּן का अर्थ
  choice: यरदन का गौरव
  alternative: यरदन का अभिमान; यरदन के घने झाड़-झंखाड़
  rationale: मूल संज्ञा का सामान्य अर्थ गौरव/भव्यता/अभिमान है, पर यह यरदन के किनारों की सघन वनस्पति के लिए भी प्रयुक्त मुहावरा हो सकता है। मुख्य पाठ स्रोत की अभिव्यक्ति रखता है और ठोस अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण भविष्यद्वाणी-काव्य का स्वर रखा गया है। दोनों अर्धपंक्तियों की श्रव्य समानांतरता और שׁדד की पुनरावृत्ति को समान वाक्य-विन्यास तथा ‘उजड़ गया है’ से सुरक्षित किया गया है।
