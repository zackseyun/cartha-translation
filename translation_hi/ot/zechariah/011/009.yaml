source:
  edition: WLC
  text: וָ/אֹמַ֕ר לֹ֥א אֶרְעֶ֖ה אֶתְ/כֶ֑ם הַ/מֵּתָ֣ה תָמ֗וּת וְ/הַ/נִּכְחֶ֨דֶת֙ תִּכָּחֵ֔ד וְ/הַ֨/נִּשְׁאָר֔וֹת תֹּאכַ֕לְנָה אִשָּׁ֖ה אֶת בְּשַׂ֥ר רְעוּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/009.yaml
  text: So I said[a], “I will not shepherd you. Let the dying die, and let the perishing perish[b]. And let those who remain each devour the flesh of the other.”
translation:
  language: hi
  text: तब मैंने कहा, “मैं तुम्हारी चरवाही नहीं करूँगा। जो मर रही है, वह मर जाए; जो नष्ट हो रही है, वह नष्ट हो जाए; और जो बची रहें, वे एक-दूसरी का मांस खाएँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “हर एक अपनी संगिनी का मांस खाए”; स्त्रीलिंग रूप झुंड की भेड़ों के चित्र के अनुरूप हैं।
    reason: cultural_note
lexical_decisions:
- source_word: אֶרְעֶה
  choice: मैं तुम्हारी चरवाही नहीं करूँगा
  rationale: רעה का चरवाहे के रूप में देखभाल करने का अर्थ है। ‘चरवाही’ पूरे अध्याय में चल रहे चरवाहे और झुंड के रूपक को बनाए रखता है।
- source_word: הַמֵּתָה תָמוּת
  choice: जो मर रही है, वह मर जाए
  rationale: स्त्रीलिंग कृदंत और उसी धातु की क्रिया की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखा गया है; स्त्रीलिंग झुंड की भेड़ों के व्याकरणिक संकेत से मेल खाता है।
- source_word: הַנִּכְחֶדֶת תִּכָּחֵד
  choice: जो नष्ट हो रही है, वह नष्ट हो जाए
  rationale: כחד के विनाश या मिट जाने के भाव तथा मूल की दोहरावयुक्त, कठोर अभिव्यक्ति—दोनों को सुरक्षित रखता है।
- source_word: הַנִּשְׁאָרוֹת
  choice: जो बची रहें
  rationale: שׁאר के ‘बचा रहना’ अर्थ और स्त्रीलिंग बहुवचन रूप को सीधे व्यक्त करता है; ‘जीवित बचनेवालियाँ’ कहना यहाँ अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: תֹּאכַלְנָה
  choice: खाएँ
  rationale: मूल क्रिया का सीधा अर्थ ‘खाना’ है। ‘मांस’ कर्म होने से हिंसक और भयानक चित्र हिन्दी में बिना अतिरिक्त तीव्र क्रिया जोड़े स्पष्ट रहता है।
- source_word: אִשָּׁה אֶת בְּשַׂר רְעוּתָהּ
  choice: वे एक-दूसरी का मांस खाएँ
  rationale: शाब्दिक स्त्रीलिंग वितरणात्मक वाक्यांश ‘एक स्त्री अपनी संगिनी का मांस’ झुंड की स्त्रीलिंग भेड़ों को संदर्भित करता है। ‘एक-दूसरी’ पारस्परिक हिंसा और स्त्रीलिंग व्याकरण दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: चरवाहे के रूपक को स्पष्ट रूप से बनाए रखना
  choice: मैं तुम्हारी चरवाही नहीं करूँगा
  alternative: मैं तुम्हें नहीं चराऊँगा
  rationale: यह अध्याय के भविष्यसूचक अभिनय में चरवाहे की भूमिका को प्रमुख रखता है और कथन को केवल भोजन कराने तक सीमित नहीं करता।
- issue: अंतिम परस्पर मांस खाने के चित्र की तीव्रता
  choice: वे एक-दूसरी का मांस खाएँ
  alternative: वे एक-दूसरी को नष्ट करें
  rationale: मूल का जानबूझकर चौंकानेवाला ठोस चित्र सुरक्षित रखा गया है; इसे सामान्य ‘नष्ट करें’ में बदलना पाठ की तीव्रता को कम कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्त्रीलिंग क्रियारूप मूल पाठ में झुंड की भेड़ों के स्त्रीलिंग व्याकरण को दर्शाते हैं। समान धातुओं की पुनरावृत्ति (‘मर…मर’, ‘नष्ट…नष्ट’) मूल की संक्षिप्त और कठोर लय को बनाए रखती है।
