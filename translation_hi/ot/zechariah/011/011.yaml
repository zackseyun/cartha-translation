source:
  edition: WLC
  text: וַ/תֻּפַ֖ר בַּ/יּ֣וֹם הַ/ה֑וּא וַ/יֵּדְע֨וּ כֵ֜ן עֲנִיֵּ֤י הַ/צֹּאן֙ הַ/שֹּׁמְרִ֣ים אֹתִ֔/י כִּ֥י דְבַר יְהוָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/011/011.yaml
  text: So it was broken on that day[b][a], and thus the afflicted of the flock who were watching me knew that it was the word of Yahweh.
translation:
  language: hi
  text: उस दिन वह तोड़ दी गई[b], और तब झुंड के वे पीड़ित लोग[a], जो मुझ पर निगाह रखे हुए थे, जान गए कि यह यहवे का वचन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झुंड के गरीब लोग’ अथवा ‘झुंड के दीन लोग’।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह रद्द कर दी गई’ अथवा ‘वह निरस्त कर दी गई’; ये अनुवाद इस प्रतीक के वाचा-संबंधी अर्थ पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֻּפַר
  choice: वह तोड़ दी गई
  rationale: פרר के होफ़अल रूप का संकेत पिछले पद की वाचा-रूपी लाठी की ओर है। ‘तोड़ दी गई’ दृश्य रूपक को बनाए रखता है, जबकि वाचा के रद्द होने का भाव संदर्भ से स्पष्ट रहता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक भविष्यद्वाणी-संबंधी कालवाचक अभिव्यक्ति है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיֵּדְעוּ כֵן
  choice: और तब ... जान गए
  rationale: 'כֵן को परिणाम अथवा तार्किक संबंध बताने वाले क्रियाविशेषण के रूप में व्यक्त किया गया है: लाठी तोड़े जाने पर उन्होंने पहचान लिया।'
- source_word: עֲנִיֵּי הַצֹּאן
  choice: झुंड के वे पीड़ित लोग
  rationale: עָנִי गरीबी, दीनता या उत्पीड़ित दशा बता सकता है। ‘पीड़ित’ यहाँ व्यापक दुःख और असहाय दशा को व्यक्त करता है, उसे केवल आर्थिक गरीबी तक सीमित नहीं करता।
- source_word: הַשֹּׁמְרִים אֹתִי
  choice: जो मुझ पर ध्यान लगाए हुए थे
  rationale: שׁמר के कृदंत और प्रत्यक्ष कर्म के साथ यहाँ वक्ता को ध्यान से देखने या उसकी गतिविधि पर निगाह रखने का भाव है। यह हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘रक्षा करने’ का अर्थ नहीं देता।
- source_word: כִּי דְבַר יְהוָה הוּא
  choice: कि यह यहवे का वचन था
  rationale: यह वाक्य घटना अथवा प्रतीकात्मक कार्य को यहवे के वचन के रूप में पहचानता है। הוּא को ‘यह’ से व्यक्त किया गया है और יְהוָה को व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘यहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे सामान्य उपाधि से प्रतिस्थापित नहीं करता।
- issue: वाचा-संबंधी प्रतीक के टूटने का अर्थ
  choice: मूल रूपक ‘तोड़ दी गई’ बनाए रखा गया
  alternative: रद्द कर दी गई; निरस्त कर दी गई
  rationale: निकटवर्ती संदर्भ में लाठी तोड़ी जाती है और उससे वाचा रद्द होने का संकेत मिलता है। मुख्य पाठ ठोस क्रिया और वाचा-संबंधी अर्थ के बीच की तनावपूर्ण बहुअर्थता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण भविष्यद्वाणी-संबंधी गद्य। वाक्यक्रम को हिन्दी के अनुकूल किया गया है। सभी पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
