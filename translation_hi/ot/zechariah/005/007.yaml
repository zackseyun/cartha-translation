  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सीसे का गोल बाट,’ ‘सीसे की चकती,’ अथवा अधिक शाब्दिक रूप से ‘सीसे का एक किक्कार।’ इब्रानी पद एक भारी, गोलाकार सीसे की वस्तु को सूचित कर सकता है; यहाँ वह एपा के पात्र के ढक्कन का काम करती जान पड़ती है।
    reason: lexical_alternative
  - marker: b
    text: एपा सूखी वस्तुओं की एक माप थी और उस माप के लिए प्रयुक्त पात्र को भी सूचित कर सकती थी; इसलिए कुछ अनुवादों में यहाँ ‘टोकरी’ है।
    reason: cultural_note
