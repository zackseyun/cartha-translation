revisions:
- from: तब मैं मुड़ा[a] और अपनी आँखें उठाकर देखा। और देखो, एक लपेटा हुआ पत्र उड़ रहा था।
  to: तब मैं मुड़ा[a], अपनी आँखें उठाईं और देखा, और देखो, एक स्क्रॉल उड़ रहा था।
  rationale: Revision replaces the less exact “लपेटा हुआ पत्र” with “स्क्रॉल,” the direct modern Hindi designation for a written roll, and smooths the sequential verbal construction. The ambiguity of וָאָשׁוּב remains signaled by the existing footnote.
