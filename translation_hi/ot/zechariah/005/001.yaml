  yaml_path: translation/ot/zechariah/005/001.yaml
  text: Then I turned and lifted my eyes and saw[a], and behold[b], a flying scroll.
translation:
  language: hi
  text: तब मैं मुड़ा[a], अपनी आँखें उठाईं और देखा, और देखो, एक स्क्रॉल उड़ रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब मैं फिर मुड़ा,” अथवा “तब मैं लौटा।”
    reason: इब्रानी क्रिया का अर्थ ‘मुड़ना,’ ‘फिर मुड़ना,’ या ‘लौटना’ हो सकता है और यहाँ नया दर्शन आरम्भ होने के कारण एक से अधिक अर्थ संभव हैं।
lexical_decisions:
- source_word: וָאָשׁוּב
  choice: तब मैं मुड़ा
  rationale: שׁוב का अर्थ ‘मुड़ना’ या ‘लौटना’ हो सकता है। यहाँ क्रमशः खुलते दर्शन में ध्यान अथवा दृष्टि के मुड़ने का भाव स्वाभाविक है; ‘तब’ वाव-युक्त कथात्मक क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: וָאֶשָּׂא עֵינַי
  choice: अपनी आँखें उठाकर
  rationale: यह इब्रानी मुहावरे की दृश्यात्मकता बनाए रखता है और आधुनिक हिन्दी में भी स्पष्ट है।
- source_word: וָאֶרְאֶה
  choice: देखा
  rationale: यह नबी के दर्शन में प्रत्यक्ष देखने को सरल और सीधा व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘देखो’ हिन्दी में उसकी जीवंत प्रस्तुति बनाए रखता है।
- source_word: מְגִלָּה
  choice: लपेटा हुआ पत्र
  rationale: מְגִלָּה लिखने के लिए प्रयुक्त लपेटे जाने वाले पत्र अथवा स्क्रोल को दर्शाता है। यह चयन सामग्री के विषय में अनावश्यक अनुमान किए बिना वस्तु का स्वरूप सामान्य हिन्दी में स्पष्ट करता है।
- source_word: עָפָה
  choice: उड़ रहा था
  rationale: स्त्रीलिंग एकवचन कृदन्त מְגִלָּה की अवस्था या क्रिया बताता है। हिन्दी में विधेयात्मक रूप स्वाभाविक है और उड़ते हुए पत्र का आशय सुरक्षित रखता है।
