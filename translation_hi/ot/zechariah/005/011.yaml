base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/011.yaml
  text: And he said to me[a], “To build a house for her in the land of Shinar; and when it is prepared[b], she will be set there on her base.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “उसके लिए शिनार देश[a] में एक घर बनाने के लिए। जब वह तैयार हो जाएगा, तब वह वहाँ अपने आधार पर रख दी जाएगी[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शिनार पुराने नियम में बाबुल देश से जुड़ा प्राचीन नाम है।
    reason: cross_reference
  - marker: b
    text: या, “उसे वहाँ उसके आधार पर रख दिया जाएगा।” इब्रानी के स्त्रीलिंग रूपों का संबंध ‘दुष्टता’ कही गई स्त्री से हो सकता है, या अधिक अमूर्त रूप से एपा-पात्र अथवा उसकी सामग्री से।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘मुझसे’ मूल पाठ के אֵלַי को स्पष्ट रखता है।
- source_word: לִבְנוֹת לָהּ בַּיִת
  choice: उसके लिए ... एक भवन बनाने को
  rationale: ל के साथ infinitive उद्देश्य बताता है। ‘उसके लिए’ स्त्रीलिंग अप्रत्यक्ष कर्म और दर्शन में व्यक्तिरूप दी गई दुष्टता से संबंध बनाए रखता है।
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: शिनार देश में
  rationale: शिनार को बाबुल से बदलने के बजाय स्थान-नाम के रूप में रखा गया है, जिससे उसका पुराना नियम-संबंधी साहित्यिक संदर्भ सुरक्षित रहता है।
- source_word: וְהוּכַן
  choice: जब वह तैयार हो जाएगा
  rationale: הוכן का भाव ‘तैयार किया जाना/स्थापित किया जाना’ है। यहाँ पुल्लिंग रूप का सबसे स्वाभाविक पूर्वपद भवन है; कालगत ‘जब’ घटनाक्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהֻנִּיחָה
  choice: तब वह वहाँ ... स्थापित की जाएगी
  rationale: इब्रानी क्रिया स्त्रीलिंग एकवचन है। हिन्दी का स्त्रीलिंग रूप दर्शन में दुष्टता के रूप में दिखाई गई स्त्री की निरंतरता को सुरक्षित रखता है।
- source_word: עַל מְכֻנָתָהּ
  choice: अपने आधार पर
  rationale: מְכוּנָה किसी स्थिर आधार, चौकी या पायदान को दर्शाता है। ‘आधार’ सीधा और स्वाभाविक है तथा स्त्रीलिंग प्रत्यय का संबंध ‘अपने’ से बना रहता है।
theological_decisions:
- issue: अंतिम उपवाक्य के स्त्रीलिंग रूपों का संदर्भ
  choice: स्त्रीलिंग रूपों को दर्शन में ‘दुष्टता’ कही गई स्त्री से जोड़कर ‘वह ... स्थापित की जाएगी’ किया गया है।
  alternative: इन्हें एपा-पात्र या उसमें रखी वस्तु का अधिक अमूर्त संदर्भ मानकर ‘उसे ... रख दिया जाएगा’ भी समझा जा सकता है।
  rationale: जकर्याह 5:8 में टोकरी के भीतर की स्त्री को ‘दुष्टता’ कहा गया है, और यहाँ के स्त्रीलिंग क्रिया तथा प्रत्यय उसी व्यक्तिरूप को स्वाभाविक रूप से आगे बढ़ाते हैं। फिर भी इब्रानी में संदर्भ की कुछ अस्पष्टता है, इसलिए वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भवन’ दर्शन में किसी स्थायी प्रतिष्ठान की छवि देता है; ‘आधार’ तकनीकी अतिशयोक्ति से बचते हुए मूल अर्थ को रखता है। उद्धरण का आरंभ उद्देश्यसूचक खंड से होता है, क्योंकि यह पिछले पद के प्रश्न का उत्तर है और मूल इब्रानी की अपूर्ण-वाक्य संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
