  text: וַ/יֵּצֵ֕א הַ/מַּלְאָ֖ךְ הַ/דֹּבֵ֣ר בִּ֑/י וַ/יֹּ֣אמֶר אֵלַ֔/י שָׂ֣א נָ֤א עֵינֶ֨י/ךָ֙ וּ/רְאֵ֔ה מָ֖ה הַ/יּוֹצֵ֥את הַ/זֹּֽאת׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/005.yaml
  text: Then the angel who was speaking with me went out and said to me[c][b][a], “Please lift up your eyes and see what this is that is coming out.”
translation:
  language: hi
  text: तब वह स्वर्गदूत, जो मुझसे बात कर रहा था[b], बाहर निकला[a] और मुझसे बोला, “कृपया अपनी आँखें उठाओ और देखो कि यह क्या है जो बाहर निकल रहा है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाहर आया”; हिब्रू क्रिया יָצָא एक सामान्य गति-सूचक क्रिया है, जिसका अनुवाद प्रसंग और दृष्टिकोण के अनुसार “बाहर जाना” या “बाहर आना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “जो मुझमें बोल रहा था”; यहाँ यह मुहावरा “मुझसे बात कर रहा था” के अर्थ में है।
    reason: lexical_alternative
  - marker: c
    text: या “यह क्या है जो बाहर जा रहा है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर निकला
  rationale: יָצָא सामान्यतः ‘बाहर जाना/निकलना’ व्यक्त करता है। ‘बाहर निकला’ स्रोत की गति को सीधे रखता है और हिन्दी में दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַמַּלְאָךְ
  choice: स्वर्गदूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ भी हो सकता है, पर जकर्याह के दर्शन और व्याख्याकार अलौकिक पात्र के संदर्भ में ‘स्वर्गदूत’ स्पष्ट और स्वाभाविक है।
- source_word: הַדֹּבֵר בִּי
  choice: जो मुझसे बात कर रहा था
  rationale: शाब्दिक ‘मुझमें बोल रहा था’ के स्थान पर यह हिब्रू मुहावरे का प्रसंगानुकूल हिन्दी रूप है; कृदन्त की जारी क्रिया भी बनी रहती है।
- source_word: שָׂא נָא עֵינֶיךָ
  choice: कृपया अपनी आँखें उठाकर देखो
  rationale: נָא की विनम्रता ‘कृपया’ से और ‘आँखें उठाना’ मुहावरे का भाव स्वाभाविक हिन्दी संयुक्त क्रिया से व्यक्त होता है।
- source_word: הַיּוֹצֵאת הַזֹּאת
  choice: यह क्या है जो बाहर निकल रहा है
  rationale: स्त्रीलिंग कृदन्त जारी गति बताता है; हिन्दी में अज्ञात वस्तु के लिए व्याकरणिक रूप से सामान्य पुल्लिंग रखा गया है, बिना उसकी पहचान पहले से तय किए।
theological_decisions:
- issue: दर्शन में बोलने वाले מַלְאָךְ की पहचान
  choice: स्वर्गदूत
  alternative: दूत
  rationale: दर्शनीय संदर्भ अलौकिक संदेशवाहक की ओर संकेत करता है, पर किसी और विशिष्ट पहचान या पद को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत-समीप शैली। विनम्र आज्ञा के लिए ‘कृपया’ और निकट संबोधन के अनुरूप ‘देखो’ रखा गया है। सभी पाठ-सम्बन्धी विकल्प संबंधित पदांश के तुरंत बाद चिह्नित हैं।
