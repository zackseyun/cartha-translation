  text: וָ/אֶשָּׂ֨א עֵינַ֜/י וָ/אֵ֗רֶא וְ/הִנֵּה֩ שְׁתַּ֨יִם נָשִׁ֤ים יֽוֹצְאוֹת֙ וְ/ר֣וּחַ בְּ/כַנְפֵי/הֶ֔ם וְ/לָ/הֵ֥נָּה כְנָפַ֖יִם כְּ/כַנְפֵ֣י הַ/חֲסִידָ֑ה וַ/תִּשֶּׂ֨אנָה֙ אֶת הָ֣/אֵיפָ֔ה בֵּ֥ין הָ/אָ֖רֶץ וּ/בֵ֥ין הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/009.yaml
  text: Then I lifted up my eyes and saw[a], and behold, two women were coming out, and the wind was in their wings. They had wings like the wings of a stork[b], and they lifted up the ephah between the earth and the heavens.
translation:
  language: hi
  text: तब मैंने अपनी आँखें उठाकर देखा, और देखो, दो स्त्रियाँ बाहर निकल रही थीं। उनके पंखों में हवा थी। उनके पंख लगलग के पंखों जैसे थे, और वे एपा[a] को पृथ्वी और आकाश के बीच[b] उठा ले गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा सूखी वस्तुओं को नापने की एक मानक माप थी; यहाँ यह दर्शन में दिखाई गई नापने की टोकरी या पात्र को सूचित करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “धरती और आकाश के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשָּׂא עֵינַי
  choice: तब मैंने अपनी आँखें उठाकर देखा
  rationale: इब्रानी के दर्शन-वर्णन वाले मुहावरे को बनाए रखता है; ‘तब’ प्रसंग में कथात्मक क्रम को व्यक्त करता है।
- source_word: וָאֵרֶא וְהִנֵּה
  choice: देखा, और देखो
  rationale: ‘देखो’ הִנֵּה की दृश्यात्मक तत्परता और आश्चर्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שְׁתַּיִם נָשִׁים יֹצְאוֹת
  choice: दो स्त्रियाँ बाहर निकल रही थीं
  rationale: स्त्रीलिंग को स्पष्ट रखता है और कृदन्त रूप की जारी क्रिया को व्यक्त करता है; दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְרוּחַ בְּכַנְפֵיהֶם
  choice: उनके पंखों में हवा थी
  rationale: רוּחַ का मूल अर्थ ‘हवा’ या ‘आत्मा’ हो सकता है; उड़ान, पंख और पक्षी की उपमा के निकट प्रसंग में ‘हवा’ अधिक स्वाभाविक है।
- source_word: כְנָפַיִם כְּכַנְפֵי הַחֲסִידָה
  choice: लगलग पक्षी के पंखों जैसे पंख
  rationale: חֲסִידָה को विशिष्ट पक्षी ‘लगलग’ के रूप में प्रस्तुत करता है और उपमा को स्पष्ट बनाए रखता है।
- source_word: וַתִּשֶּׂאנָה אֶת־הָאֵיפָה
  choice: वे एपा को ... उठा ले गईं
  rationale: נשׂא के उठाने और ले जाने—दोनों भावों को दृश्य में समेटता है; אֵיפָה की प्रमुख प्रतीकात्मक संज्ञा को लिप्यंतरित रूप में बनाए रखा गया है।
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמָיִם
  choice: पृथ्वी और आकाशमंडल के बीच
  rationale: यहाँ पृथ्वी और ऊपर के आकाश का व्यापक स्थानिक विरोध है; ‘आकाशमंडल’ हिन्दी में שָׁמַיִם का स्वाभाविक सामूहिक बोध देता है।
theological_decisions:
- issue: दर्शन में רוּחַ का अर्थ
  choice: हवा
  alternative: आत्मा
  rationale: पंखों, लगलग पक्षी और एपा को ऊपर ले जाने की भौतिक उड़ान के प्रसंग में ‘हवा’ सबसे सीधा अर्थ है; इससे पाठ में अनावश्यक आध्यात्मिक अभिप्राय नहीं जोड़ा जाता।
- issue: दर्शन में אֵיפָה का अनुवाद
  choice: एपा
  alternative: नापने की टोकरी
  rationale: यह शब्द मूलतः सूखी वस्तुओं की मानक माप और यहाँ उस माप के पात्र को सूचित करता है। मुख्य पाठ में ‘एपा’ रखने से दर्शन के पिछले उल्लेखों के साथ शब्दगत निरंतरता बनी रहती है; पात्र का स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘देखो’ मूल की आकस्मिक दृश्यात्मकता को बचाता है। ‘लगलग पक्षी’ सटीक पक्षी-संज्ञा है, जबकि ‘एपा’ को पादटिप्पणी द्वारा सामान्य पाठक के लिए स्पष्ट किया गया है।
