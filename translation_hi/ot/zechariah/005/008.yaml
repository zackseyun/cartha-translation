base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/008.yaml
  text: And he said[a], “This is Wickedness,” and he threw her into the middle of the ephah basket[c][b], and he threw the lead weight onto its opening.
translation:
  language: hi
  text: तब उसने कहा, “यह दुष्टता है।” फिर उसने उसे एपा-पात्र[a] के भीतर फेंक दिया और सीसे का पत्थर[b] एपा-पात्र के मुँह[c] पर फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एपा’ सूखी वस्तुओं की एक प्राचीन मानक माप थी; यहाँ इसका अर्थ दर्शन में दिखाई देने वाला उस माप का पात्र है।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: ‘सीसे का पत्थर’; प्रसंग में यह भारी बाट या ढक्कन जैसा है।'
    reason: lexical_alternative
  - marker: c
    text: अर्थात एपा-पात्र का खुला भाग।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִשְׁעָה
  choice: दुष्टता
  rationale: यह निश्चित, भाववाचक स्त्रीलिंग संज्ञा है, जिसे दर्शन में स्त्री के रूप में साकार किया गया है। ‘दुष्टता’ अमूर्त अर्थ को बनाए रखता है और इसे केवल ‘दुष्ट स्त्री’ बनाकर अर्थ का अति-विस्तार नहीं करता।
- source_word: וַיַּשְׁלֵךְ אֹתָהּ
  choice: उसने उसे ... फेंक दिया
  rationale: שׁלך का सामान्य अर्थ ‘फेंकना’ है। स्त्रीलिंग कर्म-प्रत्यय उस स्त्री अथवा साकार ‘दुष्टता’ की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक है, यद्यपि उसमें व्याकरणिक लिंग प्रकट नहीं होता।
- source_word: תּוֹךְ
  choice: के भीतर
  rationale: यह पात्र के अंदरूनी भाग का ठोस स्थानिक अर्थ व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָאֵיפָה
  choice: एपा-पात्र
  rationale: ‘एपा’ सूखी वस्तुओं की एक प्राचीन माप और उस माप के पात्र का नाम है। ‘पात्र’ जोड़ने से दर्शन में दिखाई गई वस्तु स्पष्ट होती है, जबकि मूल सांस्कृतिक पद सुरक्षित रहता है।
- source_word: אֶבֶן הָעֹפֶרֶת
  choice: सीसे का पत्थर
  rationale: यह इब्रानी पद का निकट अर्थ है—‘सीसे का पत्थर’। प्रसंग में वह भारी ढक्कन या बाट की तरह काम करता है, पर मुख्य पाठ उस कार्यात्मक व्याख्या को मूल शब्दों पर आरोपित नहीं करता।
- source_word: אֶל־פִּיהָ
  choice: उसके मुँह पर
  rationale: פֶּה का शाब्दिक अर्थ ‘मुँह’ है और प्रत्यय एपा-पात्र की ओर संकेत करता है। पात्र के लिए ‘मुँह’ हिन्दी में भी समझ में आने वाला रूपक है और मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: दर्शन में दुष्टता का मानवीकरण
  choice: भाववाचक संज्ञा ‘दुष्टता’ को बनाए रखा गया और स्त्री को उसी से अभिन्न बताने वाला कथन ज्यों का त्यों रखा गया।
  alternative: ‘यह दुष्ट स्त्री है’ अथवा केवल ‘यह बुराई है’ कहना।
  rationale: इब्रानी पाठ स्त्री का वर्णन केवल दुष्ट स्त्री के रूप में नहीं करता, बल्कि उसे अमूर्त संज्ञा רִשְׁעָה से पहचानता है। ‘दुष्टता’ इस मानवीकरण और उसकी अंतर्निहित तनावपूर्ण पहचान, दोनों को बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एपा-पात्र’ सांस्कृतिक पद को बचाते हुए वस्तु को स्पष्ट करता है। दोनों बार आए וַיַּשְׁלֵךְ के लिए ‘फेंक दिया’ की पुनरावृत्ति मूल की शैली और क्रिया-बल को बनाए रखती है।
