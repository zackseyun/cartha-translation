  text: Then I said to the angel who was speaking with me[a], “Where are they taking the ephah?”
translation:
  language: hi
  text: तब मैंने उस स्वर्गदूत से, जो मुझसे बात कर रहा था, पूछा, “वे एपा[a] को कहाँ ले जा रही हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टोकरी” अथवा “नापने की टोकरी।” इब्रानी में “एपा” है—यह सूखी वस्तुओं का एक मानक माप था; यहाँ इसका अर्थ दर्शन में दिखाई गई मापने की टोकरी या पात्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने ... पूछा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है। प्रत्यक्ष प्रश्न के परिचय में हिन्दी में ‘कहा’ की अपेक्षा ‘पूछा’ अधिक स्वाभाविक है, जबकि कथानुक्रम के लिए ‘तब’ रखा गया है।
- source_word: הַמַּלְאָךְ
  choice: उस स्वर्गदूत
  rationale: दर्शन के संदर्भ में מַלְאָךְ एक अलौकिक व्याख्याकार दूत है; ‘स्वर्गदूत’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है। निश्चितता और पहले से उल्लिखित पात्र को ‘उस’ व्यक्त करता है।
- source_word: הַדֹּבֵר בִּי
  choice: जो मुझसे बात कर रहा था
  rationale: जकर्याह में बार-बार आने वाला यह प्रयोग मुहावरे के अनुसार ‘मुझसे बात करना’ है; कृदंत जारी क्रिया को दर्शाता है।
- source_word: אָנָה
  choice: कहाँ
  rationale: यह गंतव्य पूछता है। ‘कहाँ ले जा रही हैं’ हिन्दी में दिशा का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵמָּה
  choice: वे
  rationale: स्वतंत्र स्त्रीलिंग बहुवचन सर्वनाम पिछले पद की दो स्त्रियों की ओर संकेत करता है; हिन्दी में ‘वे’ स्वाभाविक है।
- source_word: מוֹלִכוֹת
  choice: ले जा रही हैं
  rationale: הלך का हिफ़ील स्त्रीलिंग बहुवचन यहाँ किसी वस्तु को एक स्थान की ओर पहुँचाने का अर्थ देता है। हिन्दी क्रिया का स्त्रीलिंग बहुवचन उन दोनों स्त्रियों से इसका संबंध स्पष्ट करता है।
- source_word: אֶת הָאֵיפָה
  choice: एपा
  rationale: אֵיפָה मूलतः सूखी वस्तुओं का मानक माप है और दर्शन में उसी नाम के पात्र को दर्शाता है। लिप्यंतरित शब्द प्रसंग की निरंतरता बचाता है; अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
