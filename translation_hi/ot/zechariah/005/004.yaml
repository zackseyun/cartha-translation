base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/004.yaml
  text: I have sent it out[a], declares Yahweh of hosts, and it will enter the house of the thief and the house of the one who swears falsely by my name, and it will remain within his house and consume it[b], both its timber and its stones.
translation:
  language: hi
  text: “मैंने उसे भेज दिया है[a],” सेनाओं के यहोवा की घोषणा है, “और वह चोर के घर में और जो मेरे नाम की झूठी शपथ खाता है उसके घर में प्रवेश करेगी। वह उसके घर के भीतर ठहरी रहेगी[b] और उस घर को उसकी लकड़ियों और पत्थरों समेत नष्ट कर देगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे बाहर ले आया हूँ।” इब्रानी क्रिया का अधिक शाब्दिक अनुवाद ऐसा हो सकता है; यहाँ भाव यह है कि श्राप अपना काम करने के लिए भेजा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उसके घर में रात बिताएगी।” इब्रानी क्रिया का मूल अर्थ ठहरना या रात बिताना है; प्रसंग में वह घर के भीतर बनी रहती है, जब तक उसका विनाश न कर दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצֵאתִיהָ
  choice: मैंने उसे भेज दिया है
  rationale: हिफ़ील रूप में वक्ता की सक्रिय भूमिका और स्त्रीलिंग प्रत्यय सुरक्षित हैं; ‘उसे’ पूर्वपद श्राप/उड़ते हुए पत्र को संदर्भित करता है। ‘भेज दिया’ न्याय करने के लिए उसे बाहर प्रवर्तित करने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: נְאֻם יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा की घोषणा है
  rationale: נְאֻם की भविष्यद्वाणी-संबंधी औपचारिकता को ‘घोषणा’ से रखा गया है; יהוה को व्यक्तिगत वाचा-नाम ‘यहोवा’ और צְבָאוֹת को ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: וּבָאָה
  choice: और वह ... प्रवेश करेगा
  rationale: בוא के साथ אֶל और ‘घर’ आने की दिशा को घर में प्रवेश के रूप में स्पष्ट करते हैं। हिन्दी में पूर्वपद के व्याकरणिक लिंग के अनुसार ‘करेगा’ स्वाभाविक है।
- source_word: בֵּית הַגַּנָּב
  choice: चोर के घर
  rationale: גַּנָּב का सीधा और सामान्य आधुनिक हिन्दी समतुल्य ‘चोर’ है।
- source_word: הַנִּשְׁבָּע בִּשְׁמִי לַשָּׁקֶר
  choice: मेरे नाम की झूठी शपथ खानेवाले
  rationale: यह वाक्य परमेश्वर के नाम का आह्वान करके झूठी शपथ लेनेवाले व्यक्ति को दर्शाता है। ‘नाम की शपथ खाना’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: וְלָנֶה
  choice: ठहरा रहेगा
  rationale: לון में ठहरने या रात बिताने का मूल भाव है। प्रसंग में श्राप का घर में बने रहना मुख्य है; ‘ठहरा रहेगा’ इस अवधि को रखता है और केवल प्रवेश से अलग करता है।
- source_word: בְּתוֹךְ בֵּיתוֹ
  choice: उसके घर के भीतर
  rationale: בְּתוֹךְ घर के अंदरूनी भाग में स्थिति बताता है; ‘भीतर’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: וְכִלַּתּוּ
  choice: उस घर को ... नष्ट कर देगा
  rationale: כלה का पिएल रूप पूर्ण विनाश या अंत कर देने का प्रबल भाव रखता है। ‘नष्ट कर देगा’ हिन्दी में स्पष्ट है और आग की ऐसी छवि नहीं जोड़ता जो इब्रानी में अनिवार्य नहीं है।
- source_word: עֵצָיו וְאֶת אֲבָנָיו
  choice: उसकी लकड़ियों और पत्थरों समेत
  rationale: घर की लकड़ी और पत्थर उसके पूरे ढाँचे के विनाश को मूर्त रूप देते हैं। ‘समेत’ समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी में पहचाना जानेवाला नाम-रूप है और इसे उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: स्त्रीलिंग प्रत्यय הָ का पूर्वपद
  choice: ‘उसे’—पूर्ववर्ती श्राप/उड़ता हुआ पत्र
  alternative: व्याकरणिक स्त्रीलिंग को हिन्दी क्रिया में भी बनाए रखना
  rationale: इब्रानी प्रत्यय स्त्रीलिंग है और निकट प्रसंग के ‘श्राप’ को संदर्भित कर सकता है, जबकि दर्शन में पत्र भी है। हिन्दी में ‘श्राप’ पुल्लिंग होने से क्रिया पुल्लिंग आती है; सर्वनाम ‘उसे’ मूल की संदर्भगत गुंजाइश बनाए रखता है।
- issue: כלה की विनाशकारी शक्ति
  choice: नष्ट कर देगा
  alternative: भस्म कर देगा; पूरी तरह समाप्त कर देगा
  rationale: पाठ सम्पूर्ण विनाश बताता है, पर आग का स्पष्ट उल्लेख नहीं करता। इसलिए ‘भस्म’ से बचकर प्रबल किन्तु निरपेक्ष ‘नष्ट’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण भविष्यद्वाणी-शैली वाला गद्य। प्रत्यक्ष ईश्वरीय वचन के लिए उद्धरण-चिह्न रखे गए हैं। ‘खानेवाले’ की संयुक्त वर्तनी अपनाई गई है।
