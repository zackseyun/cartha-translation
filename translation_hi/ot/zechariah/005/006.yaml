source:
  edition: WLC
  text: וָ/אֹמַ֖ר מַה הִ֑יא וַ/יֹּ֗אמֶר זֹ֤את הָֽ/אֵיפָה֙ הַ/יּוֹצֵ֔את וַ/יֹּ֕אמֶר זֹ֥את עֵינָ֖/ם בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/006.yaml
  text: And I said[a], “What is it?” And he said, “This is the basket that is going out.” And he said[b], “This is their appearance in all the land.”
translation:
  language: hi
  text: मैंने पूछा, “यह क्या है?” उसने कहा, “यह नापने की टोकरी[a] है जो बाहर जा रही है।” फिर उसने कहा, “पूरे देश में यही उनका रूप[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एपा।” इब्रानी शब्द ‘एपा’ नामक माप और, विस्तार से, उस माप के पात्र को भी दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उनकी आँख।” इसे प्रायः “उनका रूप” या “जो उनमें दिखाई देता है” समझा जाता है। वैकल्पिक पाठ या व्याख्या के अनुसार कुछ लोग इसका अनुवाद “पूरे देश में उनका अधर्म यही है” करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיפָה
  choice: नापने की टोकरी
  rationale: यह शब्द मूलतः ‘एपा’ नामक सूखी वस्तुओं की माप को दर्शाता है और लक्षणा से उस माप के पात्र को भी। दर्शन में दिखाई देने वाली ठोस वस्तु के लिए ‘नापने की टोकरी’ स्वाभाविक और अर्थ-स्पष्ट है; तकनीकी नाम ‘एपा’ पादटिप्पणी में रखा गया है।
- source_word: הַיּוֹצֵאת
  choice: जो बाहर जा रही है
  rationale: लेखयुक्त कृदन्त टोकरी को गतिशील या बाहर निकलती हुई बताता है। यह अनुवाद उस जारी क्रिया को सहज हिन्दी में बनाए रखता है।
- source_word: עֵינָם
  choice: उनका रूप
  rationale: मसोरा-पाठ का शाब्दिक अर्थ ‘उनकी आँख’ है, पर यहाँ ‘जो दिखाई देता है’ से विस्तारित अर्थ ‘रूप’ सम्भव है। कठिन शाब्दिक अर्थ और प्रसिद्ध वैकल्पिक अर्थ ‘अधर्म’ दोनों पादटिप्पणी में सुरक्षित हैं।
- source_word: בְּכָל הָאָרֶץ
  choice: पूरे देश में
  rationale: הָאָרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है। इस दर्शन के सम्भावित स्थानीय दायरे के अनुसार ‘देश’ मुख्य पाठ में रखा गया है, बिना अनावश्यक रूप से अर्थ को समूची पृथ्वी तक फैलाए।
- source_word: מַה הִיא
  choice: यह क्या है?
  rationale: इब्रानी स्त्रीलिंग सर्वनाम आगे आने वाले स्त्रीलिंग संज्ञा אֵיפָה से मेल खाता है। निर्जीव वस्तु के विषय में आधुनिक हिन्दी में ‘यह क्या है?’ स्वाभाविक है।
theological_decisions:
- issue: अन्तिम उपवाक्य में עֵינָם का अर्थ
  choice: मुख्य पाठ में ‘उनका रूप’
  alternative: शाब्दिक ‘उनकी आँख’; अथवा वैकल्पिक पाठ/व्याख्या के अनुसार ‘उनका अधर्म’
  rationale: मसोरा-पाठ ‘उनकी आँख’ देता है, जो प्रसंग में कठिन है। ‘रूप’ उसी इब्रानी शब्द के दृश्यता-सम्बन्धी अर्थ-विस्तार से निकल सकता है और पाठ में संशोधन नहीं करता। ‘अधर्म’ को मुख्य पाठ में लाकर कठिनाई को चुपचाप सुलझाने के बजाय उसे पादटिप्पणी में रखा गया है।
- issue: הָאָרֶץ का भौगोलिक दायरा
  choice: ‘देश’
  alternative: ‘सारी पृथ्वी’
  rationale: इब्रानी दोनों अर्थों की अनुमति देता है। निकटवर्ती भविष्यदर्शी प्रसंग में ‘देश’ उपयुक्त है, पर इसे सिद्धान्तगत रूप से विश्वव्यापी बनाने से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘नापने की टोकरी’ सामान्य पाठक को दर्शन की वस्तु समझाती है, जबकि ‘एपा’ पादटिप्पणी में सुरक्षित है। ‘उनका रूप’ जानबूझकर कुछ अस्पष्टता बनाए रखता है, क्योंकि इब्रानी बहुवचन सर्वनाम का संकेत इस पद में स्पष्ट नहीं है।
