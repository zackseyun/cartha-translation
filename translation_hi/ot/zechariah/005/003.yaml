source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלַ֔/י זֹ֚את הָֽ/אָלָ֔ה הַ/יּוֹצֵ֖את עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ כִּ֣י כָל הַ/גֹּנֵ֗ב מִ/זֶּה֙ כָּמ֣וֹ/הָ נִקָּ֔ה וְ/כָל הַ/נִּ֨שְׁבָּ֔ע מִ/זֶּ֖ה כָּמ֥וֹ/הָ נִקָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/003.yaml
  text: Then he said to me[a], “This is the curse that goes out over the face of the whole land, for everyone who steals will be purged away according to what is written on this side of it[c][b], and everyone who swears falsely will be purged away according to what is written on that side of it.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “यह वह शाप है जो सारे देश[a] पर निकल रहा है; क्योंकि हर चोर उसकी इस ओर लिखी बात के अनुसार हटा दिया जाएगा[b][c], और हर शपथ खानेवाला उसकी उस ओर लिखी बात के अनुसार हटा दिया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी पृथ्वी पर।” इब्रानी אֶרֶץ का अर्थ “देश” या “पृथ्वी” दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “इससे, उसके अनुसार … उससे, उसके अनुसार।” सम्भवतः यह उड़ते हुए पत्र की दोनों ओर लिखी बातों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या “साफ कर दिया जाएगा” अथवा “निर्दोष ठहराया जाएगा।” यहाँ शाप के न्याय-संदर्भ में अपराधी को हटा दिए जाने का अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: वह शाप
  rationale: दर्शन के न्याय-संदर्भ में אָלָה शपथ से जुड़ा शाप सूचित करता है; ‘शाप’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַיּוֹצֵאת
  choice: फैल रहा है
  rationale: स्त्रीलिंग कृदन्त जारी गति को व्यक्त करता है। उड़ते हुए पत्र के दर्शन में ‘फैल रहा है’ शाप के पूरे देश में निकलने का भाव स्वाभाविक हिन्दी में देता है।
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: सारे देश में
  rationale: אֶרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है। निर्वासनोत्तर समुदाय पर केंद्रित प्रसंग में ‘देश’ अधिक संभावित है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: הַגֹּנֵב
  choice: हर चोरी करनेवाला
  rationale: संज्ञात्मक कृदन्त सामान्य रूप से ऐसे प्रत्येक व्यक्ति को दर्शाता है जो चोरी करता है।
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: इसके एक ओर लिखे हुए के अनुसार यहाँ से
  rationale: इब्रानी वाक्यांश अत्यन्त संक्षिप्त और अस्पष्ट है। उड़ते हुए पत्र की दोनों ओर की लिखावट सम्भावित संकेत है; ‘यहाँ से’ מִזֶּה की स्थानवाचक धारणा को भी बनाए रखता है।
- source_word: נִקָּה
  choice: मिटा दिया जाएगा
  rationale: निफ़अल रूप मूलतः निर्दोष ठहराए जाने या साफ किए जाने का अर्थ दे सकता है, पर शाप के दण्डात्मक संदर्भ में समुदाय/देश से हटा दिए जाने का अर्थ अधिक संगत है। ‘मिटा दिया जाएगा’ दण्डात्मक निष्कासन बताता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: הַנִּשְׁבָּע
  choice: हर शपथ खानेवाला
  rationale: मूल पाठ केवल ‘शपथ खानेवाला’ कहता है; ‘झूठी’ जोड़ने से निहित आशय स्पष्ट होता, पर मूल की वास्तविक संक्षिप्तता और अस्पष्टता घटती।
- source_word: מִזֶּה ... כָּמוֹהָ
  choice: इसके दूसरी ओर लिखे हुए के अनुसार यहाँ से
  rationale: मूल में वही संक्षिप्त पद दूसरी बार आता है। समानान्तरता सम्भवतः पत्र की दूसरी ओर की लिखावट की ओर संकेत करती है; इसे स्पष्ट किया गया है और शाब्दिक बनावट पादटिप्पणी में दी गई है।
theological_decisions:
- issue: הָאָרֶץ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: दर्शन बहाल किए गए समुदाय और उसके बीच के अपराधों पर न्याय से संबंधित है। फिर भी इब्रानी शब्द का वैश्विक अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: न्याय-संदर्भ में נִקָּה का अर्थ
  choice: दण्डात्मक निष्कासन—‘मिटा दिया जाएगा’
  alternative: निर्दोष ठहराया जाएगा / साफ किया जाएगा
  rationale: बाहर निकलते शाप के संदर्भ में दोषमुक्ति वचन के न्यायात्मक प्रवाह को उलट देगी। अनुवाद दण्ड को व्यक्त करता है, पर शब्द की वैकल्पिक संभावनाएँ पादटिप्पणी में दर्ज हैं।
- issue: הַנִּשְׁבָּע में झूठी शपथ का निहितार्थ
  choice: ‘शपथ खानेवाला’—‘झूठी’ को मुख्य पाठ में नहीं जोड़ा
  alternative: झूठी शपथ खानेवाला
  rationale: आसपास का नैतिक और वाचा-संबंधी संदर्भ झूठी शपथ की ओर संकेत कर सकता है, किन्तु इस पद के कृदन्त में ‘झूठी’ स्पष्ट नहीं है। मूल की तनावपूर्ण संक्षिप्तता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘चोरी करनेवाला’ और ‘शपथ खानेवाला’ सामान्य पाठक के लिए स्पष्ट हैं। मूल इब्रानी की संक्षिप्तता और अस्पष्टता को पादटिप्पणियों में सुरक्षित रखते हुए उड़ते हुए पत्र की दोनों ओर की सम्भावित लिखावट मुख्य पाठ में सीमित रूप से स्पष्ट की गई है।
