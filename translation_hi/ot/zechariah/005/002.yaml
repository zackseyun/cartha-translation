base_translation:
  language: en
  yaml_path: translation/ot/zechariah/005/002.yaml
  text: And he said to me[a], “What do you see?” And I said, “I see a flying scroll. Its length is twenty cubits, and its width is ten cubits.”
translation:
  language: hi
  text: तब उसने मुझसे कहा, “तुम क्या देख रहे हो?” मैंने कहा, “मैं एक उड़ता हुआ स्क्रॉल देख रहा हूँ। उसकी लंबाई बीस हाथ[a] और चौड़ाई दस हाथ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हाथ’ प्राचीन समय में लंबाई की एक प्रचलित इकाई थी, जो लगभग कोहनी से उँगलियों के सिरों तक की दूरी के बराबर होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלַי
  choice: तब उसने मुझसे कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को स्पष्ट करता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: מָה אַתָּה רֹאֶה
  choice: तुम क्या देख रहे हो?
  rationale: इब्रानी कृदंत वर्तमान में जारी प्रत्यक्ष दर्शन को व्यक्त करता है; हिन्दी में ‘देख रहे हो’ इसका स्वाभाविक रूप है।
- source_word: וָאֹמַר אֲנִי רֹאֶה
  choice: मैंने कहा, “मैं ... देख रहा हूँ”
  rationale: पहली क्रिया कथन को आगे बढ़ाती है और कृदंत वर्तमान दृश्य-अनुभव को व्यक्त करता है; हिन्दी में दोनों काल-रूप स्वाभाविक रखे गए हैं।
- source_word: מְגִלָּה
  choice: ग्रंथ-पत्र
  rationale: यह लपेटे जाने वाले लिखित दस्तावेज़ अथवा स्क्रॉल को दर्शाता है। ‘ग्रंथ-पत्र’ प्राचीन वस्तु का भाव बनाए रखता है और आधुनिक ‘पत्र’ के केवल चिट्ठी वाले अर्थ से बचाता है।
- source_word: עָפָה
  choice: उड़ता हुआ
  rationale: कृदंत ग्रंथ-पत्र की गतिशील अवस्था को सीधे और सजीव रूप में व्यक्त करता है।
- source_word: אָרְכָּהּ ... וְרָחְבָּהּ
  choice: उसकी लंबाई ... और चौड़ाई ... है
  rationale: दोनों आयामों का स्पष्ट और समकालीन हिन्दी रूप, मूल के समानांतर विन्यास को बनाए रखते हुए।
- source_word: אַמָּה
  choice: हाथ
  rationale: प्राचीन कोहनी से उँगलियों तक की माप के लिए हिन्दी में पारंपरिक और समझने योग्य शब्द; आधुनिक इकाई में अनुमानित परिवर्तन करने के बजाय मूल सांस्कृतिक माप सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक रखी गई है। प्राचीन माप ‘हाथ’ को बनाए रखकर उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
