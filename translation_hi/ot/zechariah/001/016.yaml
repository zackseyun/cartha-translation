id: ZEC.1.16
reference: Zechariah 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה שַׁ֤בְתִּי לִ/ירוּשָׁלִַ֨ם֙ בְּֽ/רַחֲמִ֔ים בֵּיתִ/י֙ יִבָּ֣נֶה בָּ֔/הּ נְאֻ֖ם יְהוָ֣ה צְבָא֑וֹת ו/קוה יִנָּטֶ֖ה עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/016.yaml
  text: 'Therefore, thus says the LORD: I have returned to Jerusalem with compassion; my house will be built in her, declares the LORD of hosts, and a measuring line will be stretched out over Jerusalem.'
translation:
  language: hi
  text: 'इसलिए यहोवा यों कहता है: मैं करुणा के साथ यरूशलेम लौट आया हूँ। उसमें मेरा भवन बनाया जाएगा—यह सेनाओं के यहोवा की घोषणा है—और यरूशलेम पर नापने की डोरी तानी जाएगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁבְתִּי
  choice: मैं ... लौट आया हूँ
  rationale: यह पूर्ण क्रिया है; सन्दर्भ में यहोवा के अनुग्रहपूर्ण पुनरागमन की वर्तमान परिणति व्यक्त होती है।
- source_word: בְּרַחֲמִים
  choice: करुणा के साथ
  rationale: बहुवचन रूप רַחֲמִים गहरी दया और करुणा को दर्शाता है; सहज हिन्दी में ‘करुणा’ उपयुक्त है।
- source_word: בֵּיתִי
  choice: मेरा भवन
  rationale: यहाँ सन्दर्भ मंदिर का है, पर मूल में सामान्य शब्द ‘घर/भवन’ है; ‘भवन’ पवित्र निर्माण के आशय को स्वाभाविक रूप से रखता है, बिना ‘मंदिर’ को स्पष्टतः जोड़ने के।
- source_word: וְקָו
  choice: और ... नापने की डोरी
  rationale: קָו निर्माण या नगर-योजना में प्रयुक्त मापने की रेखा/डोरी को सूचित करता है; ‘नापने की डोरी’ हिन्दी में ठोस और स्पष्ट है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: दैवी नाम और צְבָאוֹת के सैन्य/स्वर्गीय समूहों से जुड़े मूल बिम्ब को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: यहोवा के लौटने का काल और अर्थ
  choice: ‘मैं ... लौट आया हूँ’
  alternative: ‘मैं ... लौटूँगा’
  rationale: मसोरेटिक पाठ में שַׁבְתִּי पूर्ण रूप है; इसे भविष्यकाल में बदलना मूल की प्रतिज्ञा और पूर्णताबोध के तनाव को अनावश्यक रूप से हल कर देगा।
- issue: בָּהּ का स्त्रीलिंग निर्देश
  choice: ‘उसमें’
  alternative: ‘उसमें [यरूशलेम में]’ अथवा ‘उसके भीतर’
  rationale: सर्वनाम यरूशलेम की ओर संकेत करता है। हिन्दी में ‘उसमें’ नगर के भीतर भवन बनाए जाने का अर्थ स्वाभाविक रूप से देता है और नगर का स्त्री-मानवीकरण थोपता नहीं।
- issue: मापने की डोरी का निहितार्थ
  choice: शाब्दिक बिम्ब बनाए रखा
  alternative: इसे ‘पुनर्निर्माण किया जाएगा’ के रूप में स्पष्ट करना
  rationale: यह बिम्ब पुनर्निर्माण, विस्तार या न्याय-संबंधी मापन की अनुगूँज रख सकता है; अनुवाद किसी एक अर्थ को निर्णायक रूप से नहीं चुनता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी शैली रखी गई है। ‘यों कहता है’ पारंपरिक किंतु आज भी बोधगम्य दूत-वाक्य सूत्र है। वाक्य के मध्य डैश ‘घोषणा’ सूत्र को स्पष्ट करता है और मूल की प्रवाहशीलता बनाए रखता है।
