base_translation:
  language: en
  yaml_path: translation/ot/zechariah/001/004.yaml
  text: 'Do not be like your fathers[a], to whom the former prophets proclaimed, saying, “Thus says Yahweh of hosts: Turn back, please, from your evil ways and your evil deeds.” But they did not listen or pay attention to me, declares Yahweh.'
translation:
  language: hi
  text: 'तुम अपने पुरखों[a] के समान न बनो। पहले के भविष्यद्वक्ताओं ने उन्हें पुकारकर कहा था, “सेनाओं का याहवे यों कहता है: कृपा करके अपने बुरे मार्गों और अपने बुरे कामों से लौट आओ।” पर उन्होंने न सुना और न मेरी ओर ध्यान दिया—याहवे की यह घोषणा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पूर्वजों।” इब्रानी में शाब्दिक रूप से “अपने पिताओं,” अर्थात् पिछली पीढ़ियाँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: न बनो
  rationale: אַל के साथ היה निषेध व्यक्त करता है। समानता के संदर्भ में ‘के समान न बनो’ स्वाभाविक हिन्दी है और चेतावनी का बल बनाए रखता है।
- source_word: כַאֲבֹתֵיכֶם
  choice: अपने पुरखों[a] के समान
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिता’ है, पर यहाँ इससे पिछली पीढ़ियाँ अभिप्रेत हैं। ‘पुरखे’ आधुनिक हिन्दी में पुरुषवाची रूप और पूर्वजों का व्यापक संदर्भ दोनों बनाए रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: קָרְאוּ אֲלֵיהֶם
  choice: उन्हें पुकारकर कहा था
  rationale: קרא में पुकारने और संदेश घोषित करने दोनों का भाव हो सकता है। इसके बाद प्रत्यक्ष भविष्यद्वाणी आने के कारण यह हिन्दी पदबंध दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנְּבִיאִים הָרִאשֹׁנִים
  choice: पहले के भविष्यद्वक्ताओं
  rationale: הָרִאשֹׁנִים यहाँ समय की दृष्टि से पहले हुए भविष्यद्वक्ताओं को बताता है। यह अनुवाद किसी तकनीकी कैननिक वर्गीकरण का संकेत नहीं देता।
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे यह कहता है
  rationale: यह मानक भविष्यद्वाणी-संदेश सूत्र है। צְבָאוֹת को उसके व्यापक सैन्य/स्वर्गीय समूहवाचक अर्थ सहित ‘सेनाओं’ और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: שׁוּבוּ נָא
  choice: कृपा करके ... लौट आओ
  rationale: שׁוב नैतिक और आध्यात्मिक दिशा बदलकर लौटने का आह्वान है। נָא विनती या आग्रह का भाव जोड़ता है, जिसे ‘कृपा करके’ व्यक्त करता है; इसे समयसूचक ‘अब’ नहीं बनाया गया।
- source_word: מִדַּרְכֵיכֶם הָרָעִים
  choice: अपने बुरे मार्गों से
  rationale: דֶּרֶךְ जीवन-व्यवहार या आचरण का मार्ग दर्शा सकता है। ‘बुरे मार्ग’ इस रूपक और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: וּמַעֲלִילֵיכֶם הָרָעִים
  choice: और अपने बुरे कामों से
  rationale: מַעֲלָלִים कर्मों, कार्यों या व्यवहारों को दर्शाता है। ‘बुरे काम’ साधारण आधुनिक हिन्दी में स्पष्ट और ठोस है।
- source_word: וְלֹא שָׁמְעוּ
  choice: फिर भी उन्होंने न मेरी सुनी
  rationale: שׁמע यहाँ केवल ध्वनि सुनने से अधिक, संदेश को सुनने/ग्रहण करने का भाव रखता है। ‘मेरी सुनी’ आज्ञापालन का अर्थ आरोपित किए बिना इस संबंधपरक भाव को व्यक्त करता है।
- source_word: וְלֹא הִקְשִׁיבוּ אֵלַי
  choice: न मेरी ओर ध्यान दिया
  rationale: הקשיב ध्यान लगाने या गौर करने को दर्शाता है और אֵלַי का व्यक्तिगत लक्ष्य ‘मेरी ओर’ में सुरक्षित है।
- source_word: נְאֻם יְהוָה
  choice: याहवे की यह घोषणा है
  rationale: נְאֻם भविष्यद्वाणी की प्रामाणिक घोषणा का सूत्र है। यह अनुवाद आरंभिक ‘यह कहता है’ से इसकी अभिव्यक्ति को अलग रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יְהוָה सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: אָבוֹת को पिता-सूचक या व्यापक पीढ़ी-सूचक शब्द से व्यक्त करना
  choice: पुरखे
  alternative: पिता; पूर्वज
  rationale: मूल शब्द पुल्लिंग बहुवचन है, किंतु संदर्भ पहले की पीढ़ियों का है। ‘पुरखे’ दोनों बातों को स्वाभाविक हिन्दी में बनाए रखता है; शाब्दिक रूप पादटिप्पणी में स्पष्ट किया गया है।
- issue: שׁוּבוּ के पश्चात्ताप-संबंधी अर्थ को स्पष्ट करना
  choice: अपने बुरे मार्गों और ... कामों से लौट आओ
  alternative: मन फिराओ; पश्चात्ताप करो
  rationale: दिशा बदलकर लौटने का मूल रूपक सुरक्षित रखा गया है। ‘पश्चात्ताप करो’ सही निहितार्थ हो सकता है, पर वह रूपक को व्याख्यात्मक धार्मिक शब्द में बदल देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भविष्यद्वाणी की औपचारिकता ‘यह कहता है’ और ‘घोषणा’ से बनी रहती है, जबकि ‘कृपा करके’ मूल के आग्रहपूर्ण נָא को सामान्य पाठक के लिए स्पष्ट करता है।
